  - id: public-traction-and-gaps
    title: Public Traction and Financial Disclosure Gaps
    body: >-
      The only publicly available traction metrics for Distyl AI are company-reported and non-audited:
      150 million-plus end users (homepage, June 2026) compared to 120 million-plus cited in the September 2025
      Series B press release. No customer count, revenue figure, ARR, GMV, net revenue retention, or gross margin
      data is available from any public source. The company's case study portfolio describes Fortune 500 engagements
      in six sectors with impact claims ranging from $200 million-plus in annualized savings (telecom, healthcare)
      to percentage-point improvements in operational metrics (CPG, hardware, financial services). All client
      identities are anonymized; no third-party audit or customer-attributed testimony is publicly available.
      Distyl's job board shows 22-plus active openings across engineering, GTM, solutions, research, and operations
      as of June 2026, which serves as a proxy for hiring momentum but not headcount or revenue scale.

      Comparable public company benchmarks offer reference points: Palantir ($4.47B FY2025 revenue) and
      C3.ai ($300M TTM 2026 revenue, declining) represent the public market range for enterprise AI companies
      that have scaled from venture-backed to public. Glean (a knowledge AI company targeting enterprise
      collaboration) and Scale AI (labeled data and AI infrastructure) are frequently cited as Distyl comparables
      in the private market but do not disclose financials. The BIRD-SQL benchmark result (first place with
      71.83% execution accuracy, August 2024, published by OpenAI) is the only independently verified
      quantitative performance metric in the public domain. The adverse signal from PhoneArena on the T-Mobile
      T-Life deployment (user-experience friction) is the only independent quality signal, and it undermines
      the company's 100% production record claim, though it does not constitute a confirmed service failure.
