  - id: capital-adequacy
    title: Capital Adequacy and Financing Dependency
    body: >-
      Distyl AI raised approximately $202 million across three rounds: $7 million seed (April 2023), $20 million
      Series A (November 2024 announcement, January 2025 close per Nasdaq Private Market data), and $175 million
      Series B (September 23, 2025). The Series B was led by Lightspeed Venture Partners with participation from
      Khosla Ventures, DST Global, Coatue Management, and Dell Technologies Capital. The company has disclosed
      no specific use of proceeds from the Series B, no cash balance, no monthly burn rate, and no runway estimate
      in any public communication. Standard growth-stage enterprise AI companies with 51-200 employees spending
      on FDE staffing, cloud infrastructure, and sales typically consume $3-8 million per month, implying a
      runway of 22-58 months from the $175 million Series B close; this is a bottom-up estimate based on
      sector benchmarks and not on any Distyl-specific disclosure.

      No SEC Form D or other securities disclosure from Distyl AI is discoverable via EDGAR full-text or company
      search as of June 2026. This may indicate reliance on an exemption that does not require Form D filing
      (e.g., Regulation D Rule 506 filings are generally required; absence may reflect state-only filings or
      timing delays), or may simply reflect an incomplete EDGAR index for recent rounds. The company's USPTO
      trademark application for DISTYL (serial 99611159, filed January 23, 2026) is the only public government
      filing identified for Distyl AI, Inc. Distyl has no disclosed debt, project finance, or credit facility.
      Secondary market trading via Nasdaq Private Market and Forge Global signals investor interest but no
      disclosed liquidity price per share. Dell Technologies Capital's multi-round participation (seed through
      Series B) implies potential strategic value beyond pure financial return, and may create an enterprise
      sales channel or acquisition optionality that informs Distyl's capital strategy.
