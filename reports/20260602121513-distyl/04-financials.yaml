  - id: cost-structure-and-margins
    title: Cost Structure, Gross Margin, and Unit Economics
    body: >-
      Distyl AI's cost structure is expected to be dominated by labor, given the FDE model's requirement for
      senior engineers to be physically embedded at client sites. Enterprise AI deployment companies with
      comparable FDE models exhibit highly variable gross margins depending on the proportion of revenue
      derived from platform licensing (typically 60-80% gross margin) versus engineering services (typically
      10-40% gross margin). Palantir, the closest comparable in business model—a publicly traded enterprise
      AI software/services hybrid—reported approximately $4.47 billion in revenue for FY2025 with strong
      positive adjusted operating margins as it has shifted its revenue mix toward software and away from
      pure services. C3.ai, another enterprise AI software company targeting similar sectors, reported
      approximately $300 million in TTM 2026 revenue with a declining trajectory (-16% in FY2025), reflecting
      the challenges of pure enterprise AI software sales without a delivery model.

      Distyl's outcome-based fee structure introduces revenue recognition complexity: contingent fee components
      may not be recognizable until outcome milestones are achieved, creating timing mismatches between revenue
      and the engineering costs incurred. Licensing fees provide more predictable, recurring revenue but at
      scale depend on retaining customers post-deployment. The company's case studies show large discrete
      impact claims ($200M+ OpEx savings for a telecom client, $200M+ cost savings for a healthcare payor)
      but provide no gross profit breakdowns, fee amounts, or margin data. These impact-to-fee economics are
      central to the investment thesis and are not publicly disclosed. Cloud infrastructure costs (NVIDIA GPU
      inference, Azure/Google Cloud hosting) represent a variable component of cost of revenue that scales
      with the AI inference workloads managed for clients. The NVIDIA AI Enterprise integration announced in
      March 2026 may improve inference cost efficiency; the magnitude of any savings is unquantified.
