callouts:
  - calloutType: risk
    title: Complete Financial Opacity Blocks Underwriting
    body: >-
      Distyl AI discloses no revenue, ARR, gross margin, cash position, burn rate, or customer economics
      in any public source. The $1.8 billion valuation cannot be underwritten without a data room. All
      financial figures in this chapter are inferred from sector benchmarks or company-claimed without
      independent corroboration.
    claimRefs:
      - CI033
      - CI039
      - CI040

  - calloutType: risk
    title: Outcome-Based Revenue Carries Recognition and Cliff Risk
    body: >-
      Revenue partially contingent on achieving client outcomes may not be recognized until milestones are
      confirmed, creating timing mismatches. If a major client fails to achieve the pre-agreed outcome, the
      contingent portion may not be payable—introducing cliff risk for any engagement that goes off-track.
      This structure also makes forward revenue visibility lower than a pure SaaS subscription model.
    claimRefs:
      - CI001
      - CI006
      - CI040

  - calloutType: strength
    title: Multi-Round Tier-1 Investors Provide Capital and Credibility
    body: >-
      Lightspeed, Khosla, and Coatue have participated in multiple rounds, demonstrating sustained conviction.
      DST Global's Series B participation—a fund known for late-stage growth investments—signals external
      validation of the company's growth trajectory. Dell Technologies Capital's multi-round strategic
      participation may create enterprise distribution channels beyond pure financial return.
    claimRefs:
      - CI025
      - CI027
      - CI032

