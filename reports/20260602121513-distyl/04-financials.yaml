  - id: financial-verdict
    title: Financial Verdict
    body: >-
      Distyl AI presents a high-growth, high-opacity financial profile. The company has raised $202 million at
      a $1.8 billion unicorn valuation from tier-1 investors (Lightspeed, Khosla, DST Global, Coatue, Dell),
      which is strong institutional conviction. However, the entire investment thesis rests on a single headline
      valuation and a CEO claim of profitability, with no audited financials, no publicly disclosed ARR, no
      customer count, and no gross margin data to underwrite. Revenue quality risk is elevated: the outcome-based
      fee model creates revenue recognition complexity and potential cliff risk if key customers discontinue.
      Capital intensity risk is moderate: the FDE staffing model is labor-intensive, and at a 51-200 headcount
      range with $175 million available, the company appears adequately capitalized for 2-4 years, but the
      rate of spending is unknown.

      The financial diligence checklist is extensive. Any investor or acquirer must obtain: (1) audited or
      management-reviewed financial statements for FY2022-FY2025; (2) ARR or revenue breakdown by stream
      (outcome fees vs. licensing); (3) gross margin by segment; (4) net revenue retention by cohort;
      (5) fully diluted cap table with liquidation preference stack; (6) cash balance and monthly burn rate
      as of most recent month-end; (7) investor rights agreement and any side-letter terms; (8) customer
      contracts with ACV, initial terms, renewal history, and at-risk churn data. Without these, no valuation
      underwriting is defensible. The $1.8 billion valuation, if supported by $20-50 million ARR (a typical
      range for a 36-100x ARR multiple at this stage and investor tier), would imply strong growth-stage
      multiples consistent with the enterprise AI market premium; but this is speculative without actual ARR.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI025
      - CI030
      - CI038
      - CI039
      - CI040

