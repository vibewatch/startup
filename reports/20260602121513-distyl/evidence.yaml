    severity: minor
    topic: Distyl's specific market definition per internal strategy
    missingEvidence: >-
      Distyl has not published a market sizing document or TAM definition that would clarify how it maps its addressable
      market internally.
    whyItMatters: >-
      The market boundary used for investor valuation discussions may differ materially from the analyst-defined RPA or
      agentic AI categories.
    diligencePath: >-
      Request board presentation, pitch deck, or investor materials that show Distyl's internal TAM/SAM/SOM model and
      the methodology behind it.
    relatedQuestionRefs:
