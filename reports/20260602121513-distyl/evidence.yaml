evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: governance
    missingEvidence: >-
      Distyl AI's board composition, investor board seats, voting rights, liquidation preferences, and fully diluted cap
      table
    whyItMatters: >-
      Without cap table and board structure data, no valuation underwriting or control analysis is possible for
      investors
    diligencePath: >-
      Request data room with capitalization table, board composition, investor rights agreement, and voting agreement
      from Distyl AI
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: regulatory
    missingEvidence: >-
      Any regulatory action, enforcement order, CFPB/FOS complaint, privacy enforcement, or material litigation
      involving Distyl AI, Inc.
    whyItMatters: >-
      Enterprise AI deployments in healthcare, insurance, and financial services carry regulatory exposure; absence of
      EDGAR Form D also warrants further state-level investigation
    diligencePath: >-
      Run state-level litigation searches (California PACER, Delaware courts), check CFPB complaint database, verify SEC
      exemptions claimed for each funding round
    relatedQuestionRefs:
      - QO020
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Full executive roster, board member identities, CTO/CPO/CFO roles, and any departed executives or advisors
    whyItMatters: >-
      Key-person concentration and leadership depth are critical diligence factors for a growth-stage company at $1.8B
      valuation
    diligencePath: >-
      Request organizational chart, employment agreements for senior executives, and confirmed board roster from Distyl
      AI
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investors
    missingEvidence: >-
      Seed-round silent investors, angel participants beyond Nat Friedman, and confirmation of all Series B co-investors
      and any side-letter terms
    whyItMatters: >-
      Unknown investors may hold strategic rights, information rights, or anti-dilution provisions that affect
      future-round economics
    diligencePath: >-
      Request complete investor rights agreement, certificate of incorporation, and list of all stockholders of record
      from Distyl AI
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: >-
      Audited or management-reported revenue, ARR, gross margin, net income, burn rate, and customer impact methodology;
      CEO's 'backed by profitability' claim is unverified
    whyItMatters: >-
      Quantified financial performance metrics are essential to assess growth trajectory and sustainability; partial
      public claims (e.g., 'hundreds of millions USD impact') cannot be independently verified
    diligencePath: >-
      Request management accounts, audited financials, and customer impact measurement methodology from Distyl AI data
      room
    relatedQuestionRefs:
      - QO018
      - QO019
  - type: missing-source
    severity: minor
    topic: competitive-landscape
    missingEvidence: >-
      Independent analyst comparison of Distyl AI versus Palantir AIP, Scale AI, and other enterprise AI deployment
      platforms on price, capability, and customer satisfaction
    whyItMatters: >-
      Without independent competitor analysis, competitive moat claims cannot be verified; Distyl's FDE model may face
      similar offerings from incumbents
    diligencePath: >-
      Review Gartner, Forrester, or IDC reports on enterprise AI deployment platforms; conduct win/loss customer
      interviews
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      Internal product launch dates, unannounced customer wins, leadership hires, and adverse events not surfaced in
      public press
    whyItMatters: A comprehensive milestone chronology is needed to assess operational maturity and risk trajectory
    diligencePath: Interview CEO/COO and review board minutes, engineering roadmap, and customer contract timelines in data room
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: Distyl SOM and revenue per engagement
    missingEvidence: >-
      Distyl's revenue per engagement, ASP by vertical, mix between services and platform licensing revenue, and total
      contract value pipeline.
    whyItMatters: >-
      Without a revenue-per-engagement figure and vertical win-rate data, the SOM calculation rests on market-wide
      proxies that may significantly overstate or understate Distyl's actual addressable market.
    diligencePath: >-
      Request data room: revenue by vertical, average engagement size (services vs. platform), win/loss records against
      named competitors, and pipeline by stage.
    relatedQuestionRefs:
      - QM015
      - QM007
  - type: missing-source
    severity: material
    topic: Enterprise AI pilot failure rate baseline
    missingEvidence: >-
      No authoritative public study quantifies the exact percentage of enterprise AI pilots that fail to reach
      production, the average timeline, or root cause distribution.
    whyItMatters: >-
      The core market demand driver for Distyl's FDE model rests on pilot-to-production failure being pervasive. If
      failure rates are lower than anecdotally suggested, the TAM for specialized deployment services is smaller.
    diligencePath: >-
      Search for published IT organization surveys (Gartner, Forrester, IDC) specifically measuring AI
      pilot-to-production conversion rates, then triangulate with Distyl's own disclosed track record.
    relatedQuestionRefs:
      - QM022
      - QM016
  - type: stale
    severity: minor
    topic: 2026 real-time enterprise AI spend trajectory
    missingEvidence: >-
      Most analyst forecasts were published in 2025 with 2026 estimates; Q1 2026 actual enterprise AI budget data is not
      yet broadly available.
    whyItMatters: >-
      Macro headwinds or spending discipline in 2026 could slow the pilot-to-production transition that drives Distyl's
      near-term growth.
    diligencePath: >-
      Monitor quarterly disclosures from UiPath, ServiceNow, Palantir, and C3.ai for 2026 bookings growth; review CIO
      surveys published Q1-Q2 2026.
    relatedQuestionRefs:
      - QM016
