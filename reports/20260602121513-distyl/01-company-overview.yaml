  - id: milestones-adverse-events
    title: Milestones and Adverse Events
    body: >-
      Distyl AI's milestone timeline spans from its 2022 founding through April 2026. Key inflection points include
      the April 2023 seed round alongside an OpenAI services alliance, the August 2024 first-place ranking on the
      BIRD-SQL text-to-SQL benchmark (published by OpenAI alongside GPT-4o fine-tuning), the November 2024 Series A
      led by Lightspeed, and the September 2025 Series B unicorn round. Recognition events include placement on the
      Redpoint AI64 list, the World Economic Forum Technology Pioneers community, and the NYSE Intelligent Applications
      Top 40. In January 2026, Distyl filed a USPTO trademark application (serial number 99611159) for the DISTYL
      word mark; as of the runDate, the status is "New Application — Record Initialized Not Assigned to Examiner"
      (status code 630).

      The most substantive public adverse evidence concerns the T-Mobile T-Life AI assistant. T-Mobile's T-Life app,
      which incorporates an AI assistant with self-service capabilities, has been publicly linked to Distyl's
      involvement (per Distyl's LinkedIn posts and industry reports). A PhoneArena review published in late 2025
      described T-Life as "less simple and intuitive than customers expect" and noted that "many find it buggy,"
      with T-Mobile facing criticism for mandating app use for tasks previously handled in stores. The app has been
      downloaded over 75 million times but user-experience friction is documented. This represents a reputational
      risk to Distyl's production-record and zero-failure claims. No lawsuits, regulatory actions, CFPB/FOS
      complaints, or material leadership changes were found in a CourtListener full-text search or SEC EDGAR review
      as of the runDate.
    claimRefs:
