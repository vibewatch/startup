callouts:
  - calloutType: strength
    title: Tier-1 Investor Base and Unicorn Valuation
    body: >-
      Distyl AI's $175M Series B at a $1.8B valuation, backed by Lightspeed, Khosla, DST Global, Coatue, and Dell
      Technologies Capital, represents strong institutional conviction in the enterprise AI deployment thesis.
      Lightspeed led both the Series A and Series B, indicating deep sponsor commitment to the company's trajectory.
    claimRefs:
      - CO010
      - CO011
      - CO014

  - calloutType: risk
    title: Opaque Financials and Key-Person Concentration
    body: >-
      No public revenue, ARR, gross margin, burn rate, or cap table data exists for Distyl AI. Valuation underwriting
      relies solely on the Series B headline. Combined with co-founder key-person concentration and an undisclosed
      board structure, this creates a high diligence burden before any investment can be underwritten.
    claimRefs:
      - CO002
      - CO003
      - CO004
      - CO039

  - calloutType: risk
    title: T-Life Delivery Adverse Signal
    body: >-
      Public reporting on the T-Mobile T-Life AI assistant—believed to incorporate Distyl systems—describes persistent
      user-experience friction and "buggy" behavior despite over 75 million downloads. This represents the first
      independent, adverse public signal on a named Distyl enterprise deployment and warrants follow-up in customer
      references.
    claimRefs:
      - CO037
      - CO036

