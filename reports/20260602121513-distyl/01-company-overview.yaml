company:
  name: Distyl
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Distyl AI, Inc. is a San Francisco-based private enterprise AI company founded in 2022 by Palantir veterans Arjun
    Prakash (CEO) and Derek Ho (COO). The company has raised approximately $202 million across three rounds—including a
    $175 million Series B at a $1.8 billion valuation in September 2025—backed by Lightspeed Venture Partners, Khosla
    Ventures, DST Global, Coatue, and Dell Technologies Capital. Its Distillery platform deploys AI-native systems for
    Fortune 500 companies in telecom, healthcare, insurance, manufacturing, and financial services through an
    outcome-based, forward-deployed engineering model; independent operational-financials, cap table, and detailed
    customer data remain non-public.

sections:
  - id: identity-business-model
    title: Identity and Business Model
    body: >-
      Distyl AI, Inc. (legal name confirmed in website Terms of Use and Privacy Policy) was incorporated in 2022 and
      is headquartered in San Francisco, California, with additional offices in New York and London. The company
      operates at the intersection of enterprise AI software and professional services, deploying AI-native systems for
      large, operationally complex organizations. Its core product is the Distillery platform, which combines a
      proprietary Context Mesh architecture—a structured, traversable graph of an organization's institutional
      knowledge—with AI agent orchestration, evaluation, and governance controls. Distillery enables persistent,
      long-running agents that accumulate memory and context across enterprise workflows rather than resetting on each
      interaction.

      Distyl's business model is vertically integrated, combining engineering services, platform licensing, and
      applied AI research into a single client engagement. The company uses a forward-deployed engineering (FDE) model
      inspired by Palantir's approach, in which Distyl engineers are embedded on-site with clients and co-own
      outcomes. Revenue comes from two mechanisms: outcome-based project fees (a portion of which is contingent on
      achieving client objectives) and platform licensing fees for ongoing AI system operation and maintenance. This
      contrasts with traditional time-and-materials consulting and with pure-SaaS software models. The CEO has
      characterized the company as "backed by profitability" in its Series B announcement, though no audited
      financials have been disclosed. Sector focus includes telecommunications, healthcare, insurance, manufacturing,
      financial services, and consumer packaged goods.
    claimRefs:
      - CO001
      - CO002
      - CO007
      - CO016
      - CO029
      - CO046
    tableRefs:
      - TO001
    figureRefs:
      - FO002
      - FO003

  - id: leadership-governance
    title: Leadership and Governance
    body: >-
      Distyl AI was co-founded by Arjun Prakash (CEO) and Derek Ho (COO), both of whom previously held business
      development roles at Palantir Technologies, a publicly traded enterprise data analytics company. Their Palantir
      experience shaped Distyl's forward-deployed engineering model and its focus on deploying AI systems in complex,
      regulated enterprise environments where reliability is paramount. Vijay Candade serves as Head of Business
      Strategy, and was publicly credited in the April 2026 Google Cloud partnership announcement.

      The company has not disclosed its board composition, investor board seats, or formal governance structure in
      public filings or website disclosures. Given Lightspeed's position as lead investor on both the Series A and
      Series B, a board seat for Lightspeed (Raviraj Jain led the deal per Series A announcement) is plausible but
      unconfirmed. Key-person concentration on the two co-founders represents a diligence risk: no public information
      exists on succession planning, vesting status, or equity ownership distribution. The company's legal entity
      uses mandatory binding arbitration and class-action waiver clauses in its public Terms of Use, which limits
      some forms of public litigation disclosure that might surface leadership disputes. No LinkedIn headcount data
      was available at the time of writing from direct sources; prior-research signals indicated a 51-200 company
      size designation, and the Ashby job board shows active hiring across engineering, GTM, solutions, and research
      functions in San Francisco, New York, and London.
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO042
      - CO043
      - CO044
      - CO045
    tableRefs:
      - TO002

  - id: funding-capital-structure
    title: Funding History and Capital Structure
    body: >-
      Distyl AI has raised approximately $202 million across three equity rounds as of June 2026. The seed round of
      $7 million was announced in April 2023 alongside a strategic services alliance with OpenAI, with participation
      from Coatue and Dell Technologies Capital. The Series A round of $20 million was announced November 19, 2024,
      led by Lightspeed Venture Partners with Khosla Ventures joining; existing investors Coatue and Dell Technologies
      Capital and angel Nat Friedman also participated. Nasdaq Private Market data indicates the Series A closed on
      or around January 7, 2025.

      The Series B round of $175 million was announced September 23, 2025, at a post-money valuation of
      $1.8 billion, making Distyl a private unicorn. Participating investors include Lightspeed Venture Partners,
      Khosla Ventures, DST Global, Coatue Management, and Dell Technologies Capital. CB Insights includes Distyl on
      its unicorn tracker. Nasdaq Private Market and Forge Global list Distyl stock for secondary trading but do not
      publicly disclose price per share or detailed cap table. The company has filed no Form D or other securities
      disclosure with the SEC that is publicly discoverable via EDGAR search. No public information exists on
      liquidation preferences, participation rights, anti-dilution provisions, or fully diluted share count—all
      material for valuation underwriting.
    claimRefs:
      - CO008
      - CO009
