tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - public scale signal
  - revenue / strategic value
  - gap
  rows:
  - - Leisure travelers
    - Traveler is user and payer
    - Book attractions, tours, transport, hotels, eSIMs, and event bundles
    - 10.7m annual transacting users in 2024; 54m experiences booked
    - Core demand engine and brand surface
    - No cohort retention by geography or product
  - - Young mobile-first travelers
    - Traveler is user and payer
    - Last-minute discovery and booking through app-led journey
    - Filing explicitly targets young, tech-savvy, spontaneous travelers
    - Explains social, mobile, and loyalty emphasis
    - No disclosed CAC by age or channel
  - - Merchants / operators
    - Merchant is supplier and workflow user; Klook is demand channel
    - Inventory distribution, voucher redemption, reviews, booking operations
    - Merchant portal, partner apps, ROLLER/B2B workflow evidence
    - Supply breadth and inventory quality depend on this segment
    - No public merchant retention or take-rate by segment
  - - Destination partners / tourism boards
    - Partner acts as strategic buyer and campaign co-owner
    - Demand generation, destination packages, data sharing, dispersal campaigns
    - STB, Osaka, and Hiroshima examples are public
    - Helps Klook win exclusive inventory and regional campaigns
    - No public contract value or renewal data
  - - Event organizers / entertainment partners
    - Organizer or partner is campaign co-owner; traveler pays
    - Concert, event, and travel bundle packaging
    - STB event campaign and HYBE/BTS announcement
    - Extends Klook into high-intent event travel demand
    - No public profitability by event vertical
  notes: Klook serves multiple customer layers at once. Treating the company as only a B2C travel app misses the merchant and destination-partner customer roles that shape supply, conversion, and expansion.
