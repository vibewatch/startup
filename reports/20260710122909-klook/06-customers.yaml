  - CU031
  - CU032
  - CU033
  - CU038
figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Klook serves a traveler journey that is intertwined with merchant onboarding and destination-partner activation rather than a simple one-sided checkout path.
  data:
    items:
    - id: discover
      label: Discover
      actor: Traveler / social-led trip planner
      description: Traveler discovers destinations, attractions, transport, or event bundles through Klook content, app surfaces, creators, or destination campaigns.
      channels:
      - Klook app
      - Klook web
      - Klook Kreators
      - tourism-board campaigns
    - id: book
      label: Book
      actor: Traveler
      description: Traveler compares options, selects time slots or transport, pays, and receives confirmation through the app or website.
      channels:
      - App checkout
      - web checkout
      - KlookCash / coupons
      - support FAQ
    - id: redeem
      label: Redeem / travel
      actor: Traveler + merchant staff
      description: Merchant or attraction validates voucher or booking, manages schedules, and resolves operational issues at the point of service.
      channels:
      - Merchant app
      - voucher scan
      - operator portal
      - onsite support
    - id: review
      label: Review / support
      actor: Traveler + support team
      description: Reviews, refunds, missing confirmations, and service recovery shape perceived trust and repeat intent after the booking.
      channels:
      - App reviews
      - Trustpilot
      - Help Center
      - refund workflow
    - id: expand
      label: Expand
      actor: Traveler / merchant / destination partner
      description: Repeat bookings, cross-sell into transport or events, and destination-led campaigns deepen spend and ecosystem dependence.
      channels:
      - Loyalty program
      - bundles
      - destination campaigns
      - merchant integrations
  claimRefs:
  - CU001
  - CU004
  - CU005
  - CU013
  - CU014
  - CU027
  - CU033
- id: FU002
  title: Adoption / deployment funnel
  type: funnel
  layout: standard
  summary: Public evidence supports a narrowing path from broad travel discovery into paid bookings, repeat use, and cross-category expansion, but not a fully disclosed audited funnel.
  data:
    items:
    - label: Broad destination and trip discovery
      value: 100
      detail: Anchored in Klook’s high organic traffic, creator network, and tourism-board campaign activity rather than a disclosed impression count.
    - label: First booking / transacting user
      value: 58
      detail: Grounded in 10.7m annual transacting users versus much larger discovery traffic; value is ordinal, not disclosed conversion.
    - label: Completed experience or transport redemption
      value: 50
      detail: Grounded in 54m experiences booked and visible redemption / support workflow, not a disclosed fulfillment ratio.
    - label: Repeat use and loyalty participation
      value: 32
      detail: Grounded in organic traffic, KlookCash, ratings, and review density rather than a published repeat-booker cohort.
    - label: Cross-sell into bundles, events, or destination programs
      value: 20
      detail: Grounded in STB, Osaka, Hiroshima, and event-bundle evidence rather than a disclosed attachment rate.
  approximationNotes: Stage values are ordinal indices used to depict narrowing, not measured conversion rates. Klook does not publicly disclose a complete traveler funnel or cross-sell funnel.
  claimRefs:
  - CU006
  - CU009
  - CU013
  - CU016
  - CU033
