    - '2024'
    - F-1 / IPO filing release
    - High
    - Large active traveler base is proven publicly
    - No split by country or product line
  - - Experiences booked
    - 54m+
    - '2024'
    - F-1
    - High
    - Marketplace volume is real, not conceptual
    - No repeat-booker share
  - - Organic traffic share
    - 70%+ of traffic
    - '2024'
    - F-1
