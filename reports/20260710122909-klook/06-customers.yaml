- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - metric
  - value / null
  - segment
  - confidence
  - diligence ask
  rows:
  - - Repeat engagement proxy
    - 70%+ organic traffic in 2024
    - Traveler
    - Medium
    - Request repeat-booker rate, purchase frequency, and direct-vs-paid conversion by market
  - - Loyalty mechanism
    - KlookCash and Platinum rewards with spend thresholds
    - Traveler
    - Medium
    - Request active loyalty users, redemption rate, and repeat-booking uplift from loyalty tiers
  - - Sentiment proxy
    - 4.7 iOS rating and 4.5 Trustpilot score
    - Traveler
    - Medium
    - Request CSAT/NPS split by product line and market
  - - Merchant retention / churn
    - 'null'
    - Merchant
    - Low
    - Request gross merchant adds/losses, active merchant count, and retention by operator size
  - - Destination-partner renewal rate
    - 'null'
    - Destination / strategic partner
    - Low
    - Request renewal terms, campaign ROI benchmarks, and share of GMV linked to destination partnerships
  notes: Public retention evidence is mostly indirect. Klook discloses mechanisms and proxies, but not the core cohort metrics investors would want for underwriting durability.
  claimRefs:
  - CU009
  - CU012
  - CU013
  - CU029
  - CU030
  - CU037
  - CU038
- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Adjacency into transport, hotels, eSIMs, and events
    - Could mask weaker core repeat rates if cross-sell is doing the heavy lifting
    - Affects quality of growth and valuation durability
    - Request repeat purchase by category and attachment rates across trip products
  - - Destination-board and event partnerships
    - Large campaign wins may create lumpy volume or dependency on flagship partners
    - Could distort growth visibility and sales planning
    - Request partner-sourced GMV mix and renewal schedules
  - - APAC user concentration
    - 86.6% of 2024 GTV came from APAC users
    - Macro, FX, and travel-policy shocks hit the core region disproportionately
    - Request GTV, contribution margin, and repeat rates by region
  - - Merchant long tail
    - No public disclosure of top-merchant exposure or churn
    - Inventory quality and supply breadth could weaken faster than topline signals show
    - Request merchant concentration, churn, and commission dispersion data
  notes: Expansion paths are visible and plausible, but concentration and retention detail remain the chapter’s main underwriting gaps.
  claimRefs:
