    - Brand and repeat discovery are meaningful
    - No conversion from traffic to bookers
  - - App-store rating
    - 4.7 / 5 from 7.6K ratings
    - '2026-07-10'
    - Apple App Store
    - Medium
    - Consumer satisfaction is visibly strong on iOS
    - No disclosed install base from Apple
  - - Trustpilot review volume
    - 24,718 reviews and 4.5 / 5
    - 2026-03-04 archive snapshot
    - Trustpilot
    - Medium
    - High external review density supports customer activity at scale
    - Reviewers are self-selected, not cohort data
  notes: These are adoption and sentiment proxies, not true retention disclosures. They prove usage and scale more clearly than they prove churn or renewal durability.
