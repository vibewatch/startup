schemaVersion: report-v2
artifact: customers
slug: klook
runDate: '2026-07-10'
company:
  name: Klook
chapter:
  number: 6
  title: Customers
summary: 'Klook has real customer proof on both sides of the marketplace: millions of transacting travelers, visible app and review volume, and a growing set of destination and operator partnerships that use Klook for distribution and digital workflow. The strongest public evidence supports adoption and expansion; the weakest areas are true retention, top-merchant concentration, and cohort durability.'
sections:
- id: section-1
  title: Who the customers are and why the base is not one-dimensional
  body: 'Klook''s customer base is broader than the shorthand ''experience-booking app'' suggests. The primary demand-side customer is the traveler, especially mobile-first, younger, spontaneous users looking to discover and book attractions, transport, local tours, and other in-destination services with low friction. But the supply-side customer matters almost as much. Klook''s filing, merchant surfaces, partner apps, and operator integration documents all point to a second customer group made up of merchants, attractions, tour operators, and destination partners that use Klook for demand generation, booking intake, reviews, and workflow digitization. A third, more strategic customer-like group sits between those two sides: tourism boards, event organizers, and regional destination partners that use Klook as a distribution, marketing, and data partner. That mix means the customer question is not simply consumer acquisition. Klook must keep travelers returning, keep merchants willing to
    allocate inventory and accept commissions, and keep strategic partners convinced that Klook can move demand toward targeted destinations or events.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU015
  - CU017
  - CU032
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: section-2
  title: What public evidence proves adoption and repeat behavior
  body: 'The strongest public evidence in this chapter is adoption rather than pure retention. Klook''s filing says the platform served more than 10.7 million annual transacting users in 2024 and booked more than 54 million experiences, which is enough to show meaningful customer reality rather than a thin marketplace. The same source also says more than 70% of platform traffic in 2024 came from organic sources and frames that as evidence of brand strength and repeat engagement. App-store surfaces and Trustpilot add independent proof that customer interaction is active at scale: Klook''s iPhone app showed a 4.7 rating from roughly 7,600 ratings, while Trustpilot showed 24,000-plus reviews and a 4.5 score in March 2026. None of those metrics is a true cohort-retention disclosure, but together they support a view that Klook has recurring consumer usage, visible review density, and enough support volume to require structured FAQ, refunds, and loyalty machinery. The public evidence is therefore
    good on adoption and service intensity, but only indirect on renewal quality.'
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU011
  - CU012
  - CU013
  - CU014
  - CU028
  - CU029
