- id: section-3
  title: Named customer proof is strongest in destinations, events, and operator enablement
  body: 'Named proof exists, but it skews toward destination and operator use cases more than enterprise software-style logos. Singapore Tourism Board is the clearest long-running public example. Official STB releases show the relationship widening from destination marketing into data sharing, experience development, event promotion, and product bundling, with Klook explicitly tied to spend uplift and campaign investment. In Japan, Klook''s 2026 Osaka bureau announcement and Hiroshima case material show a similar pattern: Klook acting not just as a checkout window but as a partner for demand distribution, timed entry, transport bundling, and digital destination development. On the operator side, ROLLER''s integration guide and Arival''s Flickket coverage show that Klook is also selling distribution access and workflow support to attractions and smaller operators that need connectivity. This is useful customer proof because it shows Klook being trusted for real production workflows, not only
    for generic listing placement. The limitation is that public sources still reveal more about flagship partnerships than about average merchant outcomes across the long tail.'
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU023
  - CU024
  - CU025
