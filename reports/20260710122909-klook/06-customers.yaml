- id: section-4
  title: Expansion is visible; concentration and durability are not fully disclosed
  body: Klook's expansion logic is fairly clear in public evidence. The company keeps extending from activities into transport, accommodation, eSIMs, event bundles, and destination passes because those adjacencies increase share of trip, create more reasons to reopen the app, and give tourism-board or merchant partners more packaging options. Destination campaigns in Singapore, Osaka, and Hiroshima show how Klook uses demand, content, and mobility layers together rather than treating every booking as a single isolated SKU. That said, the concentration picture remains thin. The filing makes clear that 86.6% of GTV came from APAC users in 2024, which implies regional concentration even if that is strategically sensible. Public sources do not disclose top-merchant dependence, customer concentration by destination or attraction, or true GRR/NRR/churn by cohort. The investor takeaway is that Klook appears strong enough to expand, but the durability of its customer base still needs data-room evidence
    on repeat purchase, merchant economics, and concentration thresholds before it can be treated as fully underwritten.
