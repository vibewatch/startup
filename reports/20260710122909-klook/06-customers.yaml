- id: TU003
  title: Named customer proof table
  columns:
  - customer / partner
  - segment
  - deployment / use case
  - production vs pilot
  - outcome
  - limitation
  rows:
  - - Singapore Tourism Board
    - Destination partner
    - Joint destination marketing, data sharing, event promotion, curated bundles, and experience development
    - Production / ongoing
    - STB said Singapore activity spend on Klook rose 60% versus pre-COVID and the parties expanded into S$2m+ joint campaigns
    - Public data is campaign-centric, not contract-economics disclosure
  - - Osaka Convention & Tourism Bureau
    - Destination partner
    - Data sharing, online promotions, sustainable dispersal, digital tools, and SME reach across Osaka Prefecture
    - Production / newly formalized
    - Klook positions Osaka as a gateway-to-region program with digital content and mobility-led demand shaping
    - Too early for renewal or economic-retention evidence
  - - Hiroshima city / Peace Memorial Museum ecosystem
    - Destination / attraction program
    - Timed-entry e-ticketing, Klook Pass packaging, multilingual booking, and congestion relief
    - Production / live
    - Klook said wait times fell from 100 minutes to 23 minutes and regional products grew 12x; independent coverage confirms Klook as sole overseas OTA for museum e-tickets
    - Outcome proof is partly company-reported and tied to one flagship case
  - - ROLLER-connected attractions and operators
    - Merchant / operator segment
    - Channel integration from venue systems into Klook marketplace
    - Production / live integration
    - Bookings can flow directly into operators’ systems, showing Klook embedded in merchant workflow rather than only marketing placement
    - Public proof is segment-level rather than naming one specific operator customer
  notes: The best public named proof comes from destination and operator partnerships, not from traditional enterprise-logo case studies. That fits Klook’s marketplace model but leaves average long-tail merchant outcomes under-disclosed.
