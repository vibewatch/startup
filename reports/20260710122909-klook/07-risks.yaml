- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Privacy / security incident
    - Regulator notice, reportable breach, or public incident disclosure
    - Any confirmed material incident touching booking or payment data
    - Pause conviction; require incident response and remediation evidence
  - - Travel-demand shock
    - Bookings, cancellations, and APAC mobility weaken together
    - Sustained demand deterioration with cancellation spike and slower repeat activity
    - Re-underwrite growth and liquidity assumptions immediately
  - - Platform dependency event
    - Apple or Google policy action hits distribution or data handling
    - App rejection, removal, or forced material product change
    - Escalate platform-risk discount and require contingency distribution plan
  - - Merchant-quality deterioration
    - Refunds, bad reviews, or sync failures rise faster than booking growth
    - Persistent customer-friction deterioration across major markets
    - Treat marketplace-quality thesis as broken until cohort and ops data improve
  notes: The kill criteria focus on measurable transmission points rather than generic worries. A good diligence process should convert each trigger into a dashboard item before investment.
