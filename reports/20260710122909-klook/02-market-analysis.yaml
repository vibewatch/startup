callouts:
- calloutType: insight
  title: The real opportunity is a still-offline category, not all of travel
  body: The most decision-useful market evidence is not the trillion-dollar global travel headline. It is the combination of low online penetration, fragmented SME supply, and last-minute mobile behavior in experiences, where digital intermediation still solves a real problem.
  claimRefs:
  - CM007
  - CM008
  - CM003
  - CM004
- calloutType: risk
  title: Positive travel demand does not remove margin pressure
  body: 'Experiences can outgrow broader travel while still being economically harder than flights or hotels. Reuters and Klook''s own filing both preserve the same risk pattern: fragmented supply, multi-homing merchants, support load, and sensitivity to macro shocks.'
  claimRefs:
  - CM045
  - CM046
  - CM047
- calloutType: assumption
  title: The key denominator debate is which APAC market lens investors should trust
  body: UN Tourism, PATA, and Klook's own cited market numbers all point in a constructive direction, but they do not use one perfectly matched denominator. Management diligence should reconcile which arrival and spend series actually map to Klook's monetizable traveler flows.
  claimRefs:
  - CM016
  - CM020
  - CM034
