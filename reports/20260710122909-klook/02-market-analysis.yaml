- id: section-3
  title: Growth drivers, adoption constraints, and market timing
  body: 'The supportive forces in Klook''s market are concrete rather than abstract. Travel demand recovered again in 2025, Asia Pacific benefited from visa easing and improved air connectivity, and both PATA and Klook''s own materials point to travelers shifting budget toward experiences rather than only goods. Mobile behavior matters because experiences are often booked on the go, and Klook''s own data that more than 80% of bookings were mobile fits the structural logic in its filing: smartphones finally make an offline, last-minute category searchable and bookable at scale. AI is becoming another driver because better translations, recommendations, and merchant tools can raise discovery and conversion in a market with messy inventory. The constraints are equally material. Reuters highlights lower margins and more volatile take rates in experiences than in flights or hotels, while Klook''s filing preserves deeper structural frictions: discretionary-spend sensitivity, conflict or climate
    shocks, evolving regulation, multi-homing merchants, and intense competition from broader OTAs expanding into experiences. Those constraints do not invalidate the market; they simply mean category growth does not translate one-for-one into durable platform economics.'
