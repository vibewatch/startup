  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: apac-arrival-denominator
    missingEvidence: A reconciled explanation for why UN Tourism's Asia-Pacific arrival counts differ so materially from the PATA-based figures repeated in Klook's 2025 funding release.
    whyItMatters: Large denominator differences can materially change how investors frame Klook's SAM and growth runway.
    diligencePath: Request management's preferred market-sizing deck, including exact geography coverage, year definitions, and whether the cited series count destinations, travelers, or trips.
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-unit-economics
    missingEvidence: Public sources do not break out take rate, cancellation burden, support cost, or repeat behavior by category, geography, or traveler cohort.
    whyItMatters: The market may be large, but valuation depends on which segments are actually attractive after service and acquisition costs.
    diligencePath: Request internal cohort economics by category, destination, merchant type, and acquisition channel.
    relatedTableRefs:
    - TM003
    - TM004
  - type: missing-source
    severity: minor
    topic: observed-conversion-funnel
    missingEvidence: No fetched public source discloses Klook's measured traveler funnel from inspiration through redemption and repeat booking.
    whyItMatters: The adoption path is clear conceptually, but missing observed conversion data limits precision on growth efficiency and trust bottlenecks.
    diligencePath: Request internal funnel, refund, and support metrics by device, market, and product type.
    relatedFigureRefs:
    - FM004
