- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Regional travel recovery plus visa easing and connectivity
    - positive
    - near-term
    - Supports renewed inbound and intra-Asia trip volume
    - Track whether APAC recovery keeps converging toward or beyond 2019 levels by market
  - - Experience-led consumer budgeting
    - positive
    - near-to-medium-term
    - Helps experiences platforms capture a larger share of discretionary spend
    - Test whether experience spend keeps outgrowing goods and basic travel categories in Klook core markets
  - - Mobile-first and last-minute booking behavior
    - positive
    - ongoing
    - Favors marketplaces that can handle instant confirmation and on-trip discovery
    - Request cohort data on mobile conversion, repeat rates, and local utility attach
  - - AI personalization and merchant digitization
    - positive
    - medium-term
    - Could improve match quality, content localization, and SME supply activation
    - Ask for uplift data from AI recommendations, support automation, and merchant tooling
  - - Fragmented SME supply and multi-homing merchants
    - negative
    - ongoing
    - Raises onboarding cost, support load, and take-rate pressure
    - Request merchant retention, multi-homing rates, and economics by category
  - - Macro shocks, conflict, and travel-cost inflation
    - negative
    - near-term
    - Can reduce trip demand, compress budgets, and increase cancellations
    - Stress-test revenue sensitivity to airfare, FX, and geopolitical disruptions
  - - Competition from direct suppliers and broad OTAs
    - negative
    - ongoing
    - Caps pricing power and can raise paid acquisition or support costs
    - Benchmark take rates, marketing efficiency, and service quality against peers
  - - Regulation, over-tourism, and climate risk
    - negative
    - medium-term
    - Could alter destination economics or travel flows in core markets
    - Map exposure by destination and identify where regulation or climate events hit supply density hardest
  notes: 'The best market read is symmetrical: the same factors that make experiences attractive—fragmented supply, last-minute demand, regional travel patterns—also make the category operationally harder than flights or hotels.'
