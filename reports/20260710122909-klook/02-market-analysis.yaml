  name: Klook
chapter:
  number: 2
  title: Market Analysis
  summary: 'Klook operates inside a large but not monolithic travel opportunity: the critical market is the still-under-digitized experiences layer of travel, especially intra-Asia demand and adjacent local mobility. Public sources support a strong recovery and long runway for online penetration, but fragmented supply, multi-homing merchants, thinner margins than flights or hotels, and conflicting market denominators mean valuation should rest on execution in a specific niche rather than on generic travel TAM rhetoric.'
sections:
- id: section-1
  title: Market boundary and evidence-constrained sizing
  body: 'Klook should be underwritten against the experiences and in-destination services layer of travel, not the whole travel internet. The company''s own surfaces and filing emphasize activities, tours, attractions, local transport, eSIMs, and other last-mile utilities that travelers buy close to a trip or in-destination. That makes its true peer set narrower than a broad OTA benchmark and structurally different from flights or hotels: inventory is far more fragmented, booking decisions are often inspiration-led rather than purely price-led, and merchant supply is dominated by SMEs with uneven digital maturity. Klook''s filing is especially useful because it preserves that distinction while also giving market lenses. Euromonitor estimates in the filing put the global experiences market at $318.1 billion in 2024 and only 34.2% online penetrated, while broader analyst work pegs all online travel at $761.5 billion in 2026. Those numbers are both helpful, but they answer different questions.
    For Klook, the more relevant opportunity is the under-digitized slice of travel where online aggregation, trust, and mobile fulfillment still add real value.'
