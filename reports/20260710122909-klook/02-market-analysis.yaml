- id: section-4
  title: What the market evidence means for Klook
  body: The public record supports a favorable but bounded market conclusion. Klook's filing argues it is already the largest pan-regional APAC experiences platform by 2024 GTV, served 10.7 million transacting users in 2024, and remains deeply tied to intra-regional demand, with 86.6% of GTV coming from APAC users. That positioning matters because APAC appears to be both the fastest-growing online-travel region and the part of the experiences market where digitization remains least complete. At the same time, this chapter should preserve denominator tension rather than smooth it away. UN Tourism's 331 million Asia-Pacific arrival count for 2025 sits far below the 619 million-to-762 million trajectory cited in Klook's 2025 funding release from a PATA report, implying scope or methodology differences that matter for TAM storytelling. The right investment read is therefore not simply that travel is rebounding. It is that Klook is exposed to a large and still-modernizing niche with real structural
    tailwinds, but its upside depends on outperforming in supply aggregation, service quality, and monetization inside that niche rather than merely riding a generic tourism recovery.
