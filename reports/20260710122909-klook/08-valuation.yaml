      detail: Public evidence supports hundreds of millions in revenue and millions of transacting users
    - id: proof
      label: Real customer proof
      detail: Apps, reviews, and destination partnerships show the platform is actively used
    - id: gaps
      label: Durability gaps
      detail: Retention, concentration, security assurance, and cap-table detail remain under-disclosed
    - id: comp
      label: Comp band
      detail: Public travel comps bracket plausible multiples above and below Klook's implied mark
    - id: call
      label: Track with discipline
      detail: Current price can be defended, but not without further diligence or a better entry
