- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - what would change the view
  rows:
  - - Klook has enough real scale and category complexity to justify serious late-stage attention.
    - Stronger cohort retention, merchant retention, and take-rate durability data would strengthen conviction.
  - - Adjacencies into transport, events, and destination programs can raise share of trip and platform relevance.
    - Evidence that adjacencies are low-margin or one-off would weaken the expansion case.
  - - Merchant tooling and regional density create some moat in APAC experiences.
    - Proof that multi-homing or supply churn is high would weaken moat quality.
  - - The current valuation is inside a plausible public-comp range rather than obviously detached from fundamentals.
    - A clearer preference stack, down-round risk, or lower public trading comps would make the current mark harder to defend.
  claimRefs:
  - CV003
  - CV008
  - CV009
  - CV020
  - CV022
  - CV039
  notes: Arguments are limited to what public evidence can currently support; unresolved private data can still move the balance.
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Revenue sustains strong growth, adjusted profitability improves, repeat behavior strengthens, and adjacencies deepen share of trip
    - US$2.0B-2.6B current-value range; material upside from current round
    - Travel shock or merchant-quality drift interrupts scaling
    - Needs cleaner retention and margin proof than public evidence currently shows
  - - Base
    - Recovery holds, growth moderates, economics improve gradually, and no major incident occurs
    - US$1.2B-1.7B current-value range; limited upside from current round without new proof
    - Retention or preference-stack uncertainty caps enthusiasm
    - Best fit with today's public evidence
  - - Bear
    - APAC demand softens, refunds or quality friction rise, or distribution / policy risk hits conversion
    - US$0.7B-1.0B current-value range; downside to current round mark
    - Multiple compression plus weaker revenue quality
    - Public comparables show travel multiples can compress quickly
  claimRefs:
  - CV026
  - CV027
  - CV028
  - CV039
  - CV040
  notes: Scenario values are current-value judgment bands, not audited forecasts or probability-weighted exits.
- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Booking Holdings
    - EV / Sales; Market cap
    - 5.01x EV / Sales; US$138.44B market cap
    - Best-in-class scaled global OTA benchmark for monetization and maturity
    - Much broader, more profitable, and far larger than Klook
  - - Airbnb
    - EV / Sales; Market cap
    - 6.14x EV / Sales; US$87.71B market cap
    - Shows what premium travel-platform multiples can look like with strong brand and profitability
    - Inventory model and economics differ materially from Klook
  - - Trip.com Group
    - EV / Sales; Market cap
    - 2.01x EV / Sales; US$26.67B market cap
    - Closer APAC travel comp with cross-border and cyclicality exposure
    - Far larger and more diversified than experiences-first Klook
  - - TripAdvisor
    - EV / Sales; Market cap
    - 0.89x EV / Sales; US$1.59B market cap
    - Useful low-end travel-platform comp near Klook's current valuation neighborhood
    - Business mix and growth profile are weaker than Klook's current story
  enumerationScope:
    coverage: sample
    basis: These are representative public travel comparables spanning premium, mid-band, and lower-multiple outcomes rather than an exhaustive peer universe.
  notes: Klook should not be valued as identical to any single comp. The point is to bracket plausible multiple outcomes and show where the current late-stage mark sits inside that band.
