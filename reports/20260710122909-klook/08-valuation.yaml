- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Privacy / platform incident
    - Confirmed regulator action, material data incident, or app-store policy sanction
    - Turns current proof-quality gap into realized downside
    - Pause or walk unless remediation is unusually strong
  - - APAC travel deterioration
    - Demand weakens materially while cancellations or refunds rise
    - Undermines the recovery and density narrative
    - Re-underwrite revenue and multiple immediately
  - - Merchant-quality breakdown
    - Refunds, bad reviews, or sync failures rise across major markets
    - Damages trust and suggests weak supply-side control
    - Cut valuation support and reassess moat claims
  - - Cap-table or preference surprise
    - Preference stack or dilution overhang is materially worse than expected
    - Reduces equity upside even if operations improve
    - Lower target entry valuation or pass
  claimRefs:
  - CV033
  - CV034
  - CV035
  - CV039
  - CV040
  notes: These triggers are intended as IC monitoring thresholds, not predictions that any one outcome will occur.
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Cap table / preferences
    - Liquidation preferences, ratchets, or seniority are not public
    - Equity return can differ sharply from enterprise-value logic
    - Request latest financing documents and cap-table summary
  - - Retention / repeat purchase
    - No public cohort retention or repeat-booker frequency tables
    - Durability is the main missing input in the underwriting case
    - Request cohort analysis by geography and product
  - - Merchant concentration / churn
    - Top-merchant exposure and supply churn are undisclosed
    - A marketplace can look diversified while depending on a few large suppliers
    - Request merchant concentration and retention tables
  - - Security / incident assurance
    - No robust public assurance package or incident history is retained
    - Trust and regulatory downside can overwhelm a fair revenue multiple
    - Request security certifications, incident logs, and audit summaries
  claimRefs:
  - CV035
  - CV036
  - CV037
  - CV038
  notes: These diligence asks are prioritized for valuation movement rather than for general company education.
