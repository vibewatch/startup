      - number: '2.3'
        title: 增长驱动、采用约束与市场时点
        blocks:
          - type: paragraph
            body: >-
              Klook 所处市场的支撑力量是具体的，而不是抽象的。2025 年旅行需求再次恢复，Asia Pacific 受益于签证放松和航空连接改善，PATA 与 Klook
              自身材料都指向旅行者把预算从商品转向体验。移动端行为很关键，因为体验常在路上预订；Klook 自有数据称超过 80%
              的预订来自移动端，这与其申报文件中的结构逻辑吻合：智能手机终于让一个线下、临时性强的品类可以在规模上被搜索和预订。AI
              正成为另一股驱动，因为更好的翻译、推荐和商户工具，可以在库存杂乱的市场中提高发现和转化。约束也同样实质。Reuters 指出，体验业务的利润率低于机票或酒店，抽佣率也更波动；Klook
              的申报文件还保留了更深的结构摩擦：可选消费敏感性、冲突或气候冲击、监管演变、商户多平台经营，以及更宽的 OTA
              向体验扩张带来的激烈竞争。这些约束不会否定市场；它们只是说明，品类增长不会一比一转化为耐久的平台经济性。
