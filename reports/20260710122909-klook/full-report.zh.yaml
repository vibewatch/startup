  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 起点在哪里：当前公开估值说得通，但并不轻松
        blocks:
          - type: paragraph
            body: >-
              当前公开估值锚点很直接。Klook 在 2025 年 2 月宣布获得 US$100 million 投资，独立市场数据来源继续引用该轮附近约 US$1.4 billion 的估值。
              公开申报文件随后显示，Klook 2024 年收入为 US$417.1 million，高于 2023 年的 US$335.2 million。也就是说，后期轮对应的往绩收入倍数约为 3.4x。
              表面看，对于一家已经具备规模、似乎熬过疫情、恢复增长并建立真实区域密度的旅行市场平台，这个倍数并不荒唐。但它也不自动配得上溢价倍数。 投资者买到的不是纯软件公司，也不是 Airbnb
              式干净的轻资产品牌机器，而是一家跨境市场平台，供给碎片化、客服强度高，并且明显受旅游周期影响。
              因此，起点既不是「便宜到不能错过」，也不是「显然高估」。估值落在一个可解释的公开市场区间内，但仍需要更强证据来证明耐久性和下行保护。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV020
              - CV026
              - CV032
