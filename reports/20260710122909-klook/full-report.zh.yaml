      - number: '8.3'
        title: 为什么仍要谨慎：公开证据更能证明规模，较难证明质量
        blocks:
          - type: paragraph
            body: >-
              保持纪律的关键原因在于，Klook 的公开证据质量并不均衡。公开来源能较好证明规模、合作和近期复苏；但在留存、商户集中度、安全保障、优先清算权悬置和真实稳态利润率耐久性上较弱。 Reuters
              明确提到体验业务供给碎片化、利润率更薄。申报文件和客户章节确认，公司仍高度暴露于 APAC 旅游模式；风险章节则显示，平台、应用商店、隐私和商户质量依赖仍然重要。 公开可比公司能进一步收紧谨慎判断。Booking
              和 Airbnb 享有更高倍数，是因为它们把规模与更强品牌力、盈利感知结合起来；Airbnb 还拥有不同的库存模型。 Trip.com 和 TripAdvisor
              展示了区间另一端：一旦周期性、地理或质量感知成为主导视角，旅行平台也可能以低得多的倍数交易。 因此，Klook
              的复苏和密度应得到认可，但不应获得盲目溢价。没有更好的留存和股权结构证据，中段估值比拉伸后的估值更容易辩护。
