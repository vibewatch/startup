chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、地域与平台边界
        blocks:
          - type: paragraph
            body: >-
              Klook 最适合被理解为一家以 Asia-Pacific 为先的体验交易平台，后来扩展成更广义的目的地内旅游服务平台。官方关于页面把品牌定位在有愉悦感的体验，而不是机票或酒店搜索；IPO 阶段的资料和 SEC
              文件则显示，业务已覆盖景点、旅游、当地交通、体验式住宿，以及面向国内和国际旅行者的相邻服务。这个产品定位很重要，因为 Klook
              所处的是在线旅游里摩擦更高的一层：本地供给碎片化、取消规则不统一，履约也比只做机票聚合更复杂。


              最新的公开规模披露来自 2025 年申报周期，而不是官网上更轻的营销文案。Stock Analysis 引用 SEC 文件，申报文件本身也显示，截至 2025 年 9 月 30 日的过去十二个月，Klook 在约
              4,200 个目的地提供约 310,000 项产品，已预订体验超过 65 million。Klook 的运营足迹也比消费者品牌暗示的更分散：公司资料列出香港中环地址，申报文件则称公司在 18 个地理市场拥有 25
              个办公室，约 1,900 名员工。后续章节的结论是，应把 Klook 作为一家拥有区域密度的规模化旅游交易平台分析，而不是小众优惠券或景点票转售商。
