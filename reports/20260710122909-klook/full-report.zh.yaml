      - number: '1.2'
        title: 创始人、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              公开可获得的治理细节仍比理想状态更薄，但现有记录已经支持清晰的创始人主导图景。Ethan Lin 仍担任 CEO、联合创始人和董事长；Eric Gnock Fah 仍担任总裁和董事；Bernie Xiong
              仍担任 CTO 和董事。IPO 文件补充了尽调中最重要的治理事实：Klook 正转向双层股权结构，发行完成后 Ethan Lin 和 Eric Gnock Fah 实益拥有全部已发行 Class B
              普通股。这还不能完全回答董事会层面的问题，但确实说明创始人将继续控制战略方向和上市公司治理。


              因此，关键人依赖是真实存在的。Lin 绑定战略、资本市场和外部叙事；Gnock Fah 连接合作伙伴运营、商业扩张和平台设计；Xiong 承担技术现代化和 AI
              部署。三位创始人的强项很清楚：融资轮次、新闻稿和申报文件里，他们的角色保持连续。风险在于，公开材料仍没有充分呈现出后期公开市场投资者可能期待的独立治理制衡。对后续章节而言，这意味着执行质量和资本配置都应放在创始人控制的框架里解读，而不能默认公司已经实现机构化分散治理。
