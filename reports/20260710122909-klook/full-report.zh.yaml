  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户是谁，以及为什么客户基础不是单一维度
        blocks:
          - type: paragraph
            body: >-
              Klook 的客户基础比“体验预订
              App”这个简称更宽。需求侧核心客户是旅行者，尤其是移动优先、年轻、即兴的用户，他们希望低摩擦地发现并预订景点、交通、本地旅游和其他目的地内服务。但供给侧客户几乎同样重要。Klook
              的申报文件、商户界面、合作伙伴 App 和运营商集成文档都指向第二类客户：商户、景点、旅游运营商和目的地合作伙伴，它们用 Klook
              做需求生成、预订接入、评论和工作流数字化。第三类更具战略意味、类似客户的群体位于两侧之间：旅游局、活动组织方和区域目的地合作伙伴，它们把 Klook
              当作分发、营销和数据伙伴。这个组合意味着，客户问题不只是消费者获客。Klook 必须让旅行者持续回来，让商户愿意分配库存并接受佣金，也让战略合作伙伴相信 Klook 能把需求导向目标目的地或活动。
