        - 纯住宿市场，住宿本身就是完整产品
        - 旅客或家庭买方；旅游局或伙伴可能补贴需求生成
        - 有用的相邻业务，但不是最干净的基础市场分母
      - - 商户赋能与分销
        - 基于佣金的市场平台接入、API 连接、多语言内容、结算和商品运营支持
        - 不与分销需求绑定的完整独立商户软件预算
        - 商户通过佣金或市场平台经济间接付款
        - 关键在于供给数字化会驱动品类流动性
      - - 目的地营销和旅游局合作
        - 联合营销、发现活动、游客分流和活动驱动的旅行需求生成
        - 没有商业或流量连接的一般政府旅游资本开支
        - 旅游主管机构是预算所有者；旅客是最终用户
        - 解释 Klook 为什么能在消费者广告之外拿到机构合作
      - - 广义 OTA 和住宿替代
        - 行程规划、酒店、航班、餐厅和可加入体验的一般旅行发现界面
        - 非旅行电商和无关休闲支出
        - 旅客是买方和付款方，但平台经济性不同于 Klook 的细分市场
        - 属于重要替代类别，但过宽，不能作为 Klook 的主要市场定义
    notes: 干净的承销边界以体验和目的地内服务为中心；更宽的 OTA 或住宿平台是替代路径，而不是核心市场分母。
