      - 行动含义
    rows:
      - - 隐私 / 平台事件
        - 监管已采取行动、发生重大数据事件，或遭遇应用商店政策处罚
        - 把当前证据质量缺口变成已兑现下行风险
        - 除非补救力度异常强，否则暂停或放弃
      - - 亚太旅行需求恶化
        - 需求显著走弱，同时取消或退款上升
        - 削弱复苏和供给密度叙事
        - 立即重估收入和倍数
      - - 商户质量失守
        - 主要市场退款、差评或同步故障上升
        - 损害信任，也指向供给侧控制偏弱
        - 下调估值支撑，重评护城河判断
      - - 股权结构或清算优先权意外
        - 优先权堆栈或稀释压力明显差于预期
        - 即便经营改善，股权上行空间也会缩小
        - 压低目标入场估值，或直接放弃
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV039
      - CV040
    notes: 这些触发项用于 IC 监控门槛，并非预测其中任何结果一定会发生。
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构 / 优先权
        - 清算优先权、反稀释棘轮或优先顺位未公开
        - 股权回报可能大幅偏离企业价值逻辑
        - 索取最新融资文件和股权结构摘要
      - - 留存 / 复购
        - 没有公开的分 cohort 留存或复购频次表
        - 当前投资测算最缺的输入，就是需求能否持久
        - 索取按地区和产品拆分的 cohort 分析
      - - 商户集中度 / 流失
        - 头部商户敞口和供给流失未披露
        - 市场看似分散，实际可能依赖少数大供给方
        - 索取商户集中度和留存表
      - - 安全 / 事件保障
        - 没有可用的扎实公开保障材料或事件历史记录
        - 信任和监管下行风险可能压过看似合理的收入倍数
        - 索取安全认证、事件日志和审计摘要
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
    notes: 这些尽调问题按估值敏感度排序，而不是为了普及公司基本情况。
