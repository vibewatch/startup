            body: >-
              申报文件足以描述方向，但不足以单独完成承销。收入从 2023 年的 $335.2 million 增至 2024 年的 $417.1 million；2024 年 GTV 约 $2.5 billion，毛利达到
              $257.8 million。毛利占 GTV 的比例在 2024 年升至 10.3%，2025 年前九个月升至 11.1%；adjusted EBITDA 从 2024 年的负 $22.9 million 转为
              9M25 的正 $6.3 million。这些都是经营进步的真实迹象。不过，同一披露仍显示商业投入很重，亏损还在继续。2024 年销售和营销费用仍高达 $194.2 million，当年净亏损仍为 $99.3
              million。Reuters 和 PhocusWire 都强调同一点谨慎：体验业务比机票或酒店更难，因为供给碎片化，抽佣率可能波动。因此，Klook
              看起来是一家单位经济性在改善的公司，但还不是一家盈利质量已经完全去风险的公司。
