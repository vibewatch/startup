      - number: '1.4'
        title: 里程碑、运营现代化与负面信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录很重要，因为 Klook 已不只是疫情后反弹故事。2018 年和 2019 年新闻稿显示，公司以 App 为先，在旅游、活动和铁路 / 交通中激进扩张；2021 年融资显示，它在 COVID
              时期转向商户数字化、宅度假和 SaaS 工具；2023 年融资把公司重新定位为盈利增长、移动端留存和区域复苏；2024 年 Google Cloud 合作则显示，公司有意把 AI
              嵌入内容、工程、客服和商户运营。到 2026 年，新闻中心把产品故事扩展到体育、现场活动和娱乐驱动的旅游套餐，进一步说明 Klook 想拿下更多目的地内消费栈。


              负面信号仍然重要。Reuters 评论指出，体验业务的利润率结构上低于机票或酒店，抽佣率也更波动。PhocusWire 强调了亏损历史，以及尽管收入增长但 2024
              年仍净亏损。客户情绪也不是一边倒的好：Trustpilot 在规模上表现强，但 Reviews.io、SmartCustomer
              和投诉密集的聚合站反复出现退款、支持和履约摩擦。合在一起，公司概览支持这样一个判断：Klook
              是可信的区域领导者，供给密度有耐久性，产品野心也现代化；但承销仍取决于平台执行纪律、客服质量，以及更完整的公开财务披露。
