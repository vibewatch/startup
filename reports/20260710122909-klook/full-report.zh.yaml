          low: 1200
          mid: 1450
          high: 1700
          detail: 复苏延续，当前标记大体可辩护，但并不明显便宜
        - label: 乐观
          low: 2000
          mid: 2300
          high: 2600
          detail: 留存、盈利能力和护城河证据改善到足以支撑更强溢价
    approximationNotes: 这些值是以百万美元计的当前股权价值区间，不是未来退出价值。稀释和优先权细节未公开，因此回报结果比企业价值区间更不精确。
    claimRefs:
      - CV003
      - CV020
      - CV026
      - CV027
      - CV028
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分卡，在市场机会和规模，与质量、风险、证据缺口之间取平衡。
    data:
      items:
        - label: 市场机会
          value: 8/10
          detail: 体验品类仍然碎片化，APAC 旅行市场很大
        - label: 客户证据
          value: 8/10
          detail: 数百万用户、评论密度和可见合作伙伴关系都是真实证据
        - label: 护城河质量
          value: 6/10
          detail: 区域密度和工具有帮助，但多归属风险仍在
        - label: 经济性可见度
          value: 6/10
          detail: 收入可见，但留存和稳态利润率细节仍不完整
        - label: 治理质量
          value: 4/10
          detail: 双层股权和 VIE 结构足以构成谨慎理由
        - label: 风险负荷
          value: 4/10
          detail: 旅行周期性、隐私和平台依赖都有实质影响
        - label: 估值支撑
          value: 6/10
          detail: 当前标记落在合理可比区间内，但缺少明确折价
        - label: 证据质量
          value: 5/10
          detail: 公开证据在规模上较好，在持久性和资本结构上较弱
    claimRefs:
      - CV001
      - CV002
      - CV009
      - CV012
      - CV015
      - CV020
      - CV030
      - CV032
