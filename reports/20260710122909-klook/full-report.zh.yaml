companyProfile:
  summary: >-
    Klook 是一家在香港创立的旅游交易平台，由 Ethan Lin、Eric Gnock Fah 和 Bernie Xiong 于 2014 年创办。公司先在 APAC
    体验业务中建立区域领导地位，随后扩展到交通、住宿、目的地合作、活动旅游和商户工具。到 2025 年底，F-1 文件披露的规模已经足以说明它是一家真实的后期平台：2024 年收入超过 US$417 million，年度交易用户超过
    10.7 million，已预订体验超过 54 million。这个规模让公司原则上具备投资可行性，但公开证据仍在留存、集中度、治理和资本结构条款上留下重要问题。
