      - number: '2.2'
        title: 买方分层、付费逻辑与双边市场
        blocks:
          - type: paragraph
            body: >-
              Klook 的市场是双边的，尽管消费者侧更显眼。需求侧，公司明确瞄准年轻、懂技术、决策即兴的旅行者；公司委托研究和平台研究也显示，千禧一代和 Gen Z 对活动、短途区域旅行和活动驱动旅游有明显倾斜。PATA
              的研究强化了区域高度亚洲内部流动这一点：2025 年近七成入境旅行来自 Asia Pacific
              内部。这很重要，因为在旅行者侧，实际预算所有者往往也是用户和付款人，但不同人群的采用触发点不同：家庭要可靠性和打包便利，粉丝旅行者要准入和紧迫感，多目的地旅行者要本地移动能力和低摩擦确认。供给侧，商户和目的地合作伙伴同样重要。SME
              采用 Klook，是因为它能带来需求、支付、多语言陈列和 API 连接，而这些自己搭建成本很高。这不只是一个消费者 App 市场；它是一个横跨旅行者、商户和旅游局的分发与数字化市场。
