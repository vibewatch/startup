  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险栈由外部旅游冲击和平台复杂性共同驱动
        blocks:
          - type: paragraph
            body: >-
              Klook 的风险画像不是由一个存在性技术缺陷主导，而是由周期性终端市场和复杂跨境运营模型的相互作用主导。申报文件明确显示，Klook
              仍高度暴露于可选旅行消费、宏观波动、天气事件、疫情、战争、签证政策变化和区域不稳定。对 Klook 来说，这种暴露比纯软件供应商更重要，因为取消、退款和安全担忧可以很快打击需求。与此同时，Klook
              不只是需求聚合器。它位于旅行者、商户、旅游局、支付方式、应用商店、云提供商和预订系统集成之间。这会放大故障传播点：合规失败、服务失败或合作伙伴政策变化，都可能传导为客户不满、供给恶化或收入压力。实际结论是，Klook
              的顶部剩余风险是系统性且相互连接的：旅行需求冲击、隐私和消费者保护义务、合作伙伴依赖、治理复杂性会彼此强化，而不是保持孤立。
