  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品在工作流中交付什么
        blocks:
          - type: paragraph
            body: >-
              Klook
              的产品最好被理解为一个双边旅游体验操作系统，而不只是预订组件。旅行者侧，公开界面显示发现、比较、预订、即时或延迟确认、核销、支持、评论和忠诚度互动。供给侧，证据指向入驻、库存连接、预订接收、凭证核销、评论管理和账号管理。这个区分很重要，因为
              Klook 不只是陈列景点；它在协调一个工作流，本地化内容、支付、时间规则和预订后支持都会影响转化和质量。消费者 App 把商业界面从景点扩展到交通、酒店、eSIM 和活动打包；合作伙伴 App
              则显示商户运营也被产品化。结果是，产品定义锚定在旅行执行和商户赋能，而不只是静态目录浏览。这种宽度让产品成熟度不仅体现在交易中，也体现在旅行者动作与商户执行之间的交接上。
