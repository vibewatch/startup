      - number: '1.3'
        title: 资本路径、规模指标与披露质量
        blocks:
          - type: paragraph
            body: >-
              Klook 的融资历史显示，公司能反复获得增长资本，也说明披露质量为何仍重要。官方新闻稿支持一条路径：2018 年 US$200 million Series D、2019 年由 SoftBank Vision
              Fund 领投的 US$225 million Series D+、2021 年由 Aspex 领投的 US$200 million Series E、2023 年由 Bessemer Venture
              Partners 领投的 US$210 million 融资，最后是 2025 年由 Vitruvian Partners 领投的 US$100 million 融资。这些轮次带来了 Sequoia
              China、Matrix Partners、Goldman
              Sachs、Boyu、TCV、SoftBank，以及后来区域战略方和银行合作伙伴。对一家经历疫情冲击后仍重返增长资本市场的私营旅游平台来说，这是一组强信号投资人。


              不过，本章也必须把规模和精确度分开。源自 Reuters 的 IPO 报道给出了清晰的 2024 年收入锚点：US$417.1 million，高于 2023 年的 US$335.2
              million；申报文件也提供员工、目的地和预订数据。但可获得的公开材料仍没有完全对齐终身融资总额、优先权堆栈和最新投后估值。即使盈利能力也要谨慎：2023 年融资新闻稿称 Klook 已实现整体盈利，而 IPO
              报道仍显示 2024 年净亏损 US$99.3 million。正确解读不是一方为假，而是管理层可能描述的是更窄口径或 non-GAAP 里程碑，尚未转化为耐久的全年公开盈利能力。
