      - number: '2.4'
        title: 市场证据对 Klook 意味着什么
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个有利但有边界的市场结论。Klook 的申报文件称，按 2024 年 GTV 计算，它已经是最大的泛区域 APAC 体验平台；2024 年服务 10.7 million
              交易用户，并且与区域内需求深度绑定，86.6% 的 GTV 来自 APAC 用户。这个位置很重要，因为 APAC
              似乎既是增长最快的在线旅游区域，也是体验市场中数字化仍最不完整的部分。与此同时，本章应保留分母张力，而不是把它抹平。UN Tourism 的 2025 年 Asia-Pacific 到访人数为 331
              million，显著低于 Klook 2025 年融资新闻稿引用 PATA 报告中的 619 million 至 762 million 轨迹，暗示口径或方法差异会影响 TAM
              叙事。因此，正确的投资解读不是简单地说旅游在反弹，而是 Klook
              暴露在一个巨大且仍在现代化的小众市场里，有真实结构性顺风；但它的上行空间取决于在这个小众市场内部的供给聚合、服务质量和货币化上跑赢，而不是只搭上泛旅游复苏。
