        title: 收入模型与货币化界面
        blocks:
          - type: paragraph
            body: >-
              Klook 货币化的是高频预订工作流，而不是简单订阅产品。申报文件把公司描述为全球体验经济的数字基础设施；消费者 App
              和关于页面则显示，货币化界面覆盖活动、旅游、交通、住宿、eSIM、通票和活动套餐。公开证据显示，核心经济引擎仍是一种平台式交易变现：GTV
              转化为收入，再转化为毛利，利润率由商户经济性、支持负载、退款和营销塑造。第三方合作伙伴文档很有用，因为它为原本不透明的抽佣故事给出粗略数字。Bókun 称 Klook 佣金通常在 15% 到 35%
              区间协商，这符合平台模型，但仍没有披露各品类已实现货币化。帮助中心和 App 界面还显示了通过 KlookCash、优惠券和 Platinum
              权益构建的忠诚度与折扣层，意味着管理层不仅在追求表面预订量，也在用奖励和支持权益影响重复行为与钱包份额。
