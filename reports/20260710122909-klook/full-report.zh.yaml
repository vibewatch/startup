  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              承销 Klook 时，应把它放在旅游的体验和目的地内服务层，而不是整个旅游互联网。公司自己的界面和申报文件强调活动、旅游、景点、当地交通、eSIM
              和其他旅行者临近出行或到达目的地后购买的最后一公里工具。因此，它真正的可比公司集合比宽口径 OTA
              基准更窄，也与机票或酒店有结构差异：库存碎片化得多，预订决策往往由灵感驱动而不只是价格驱动，商户供给由数字成熟度参差不齐的 SME 主导。Klook
              的申报文件尤其有用，因为它保留了这个区分，同时给出了市场视角。申报文件中的 Euromonitor 估算显示，全球体验市场 2024 年规模为 $318.1 billion，线上渗透率只有
              34.2%；更宽的分析师研究则把 2026 年整个在线旅游市场定在 $761.5 billion。这些数字都有帮助，但回答的是不同问题。对 Klook
              而言，更相关的机会是旅游中数字化不足的一块：在线聚合、信任和移动端履约仍能创造真实价值。
