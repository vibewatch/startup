      - number: '7.2'
        title: 即使没有可见执法事件，监管、法律和治理风险也真实存在
        blocks:
          - type: paragraph
            body: >-
              公开证据没有显示 Klook 当前卷入重大诉讼或隐私执法事件，但这不等于法律风险低。Klook 跨多个司法辖区运营，收集个人和支付相关数据，与合作伙伴和运营商共享信息，并通过 Apple 和 Google
              应用商店分发；这些应用商店本身也施加隐私、内容、支持和元数据规则。Hong Kong 的 PDPO 和 Singapore 的 PDPA
              都对个人数据的收集、使用、披露、留存和安全施加基线义务，并在部分情况下赋予监管执法权及民事或刑事后果。Klook
              自己的公开政策和条件界面可见，但与成熟投资者常想看到的更丰富正式保证包相比，仍显得通用。治理复杂性再叠一层。申报文件描述了双层股权结构、拥有超级投票权的 Class B 股、上市后的受控公司身份，以及
              Cayman 控股公司和 PRC-VIE 架构。这些元素都不能证明不当行为，但合在一起会提高投资者舒适度门槛，因为少数股东影响力、本地监管变化和结构特定法律风险在下行情景里都会变得更重要。
