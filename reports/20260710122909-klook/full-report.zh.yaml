              本章最强的公开证据是采用，而不是纯留存。Klook 的申报文件称，平台 2024 年服务超过 10.7 million 年度交易用户，预订超过 54 million
              项体验，足以说明这是有实质客户基础的平台，而不是薄平台。同一来源还称，2024 年平台超过 70% 的流量来自自然来源，并把这描述为品牌实力和重复参与的证据。应用商店界面和 Trustpilot
              又提供独立证明，显示客户互动在规模上活跃：Klook iPhone App 约 7,600 个评分，评分为 4.7；Trustpilot 在 2026 年 3 月显示超过 24,000 条评论，评分为
              4.5。这些指标都不是真正的队列留存披露，但合在一起支持这样的观点：Klook 有反复使用的消费者、可见的评论密度，以及足以需要结构化
              FAQ、退款和忠诚度机制的支持量。因此，公开证据在采用和服务强度上不错，但对留存质量只能间接说明。
