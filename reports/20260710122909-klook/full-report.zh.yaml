              Klook 显然没有缺过资本，但资本依赖并未消失。2023 年融资带来 $210 million，并配套来自 Citi、J.P. Morgan 和 HSBC 的授信；2025 年又增加 $100
              million，由 Vitruvian Partners 领投。管理层把两次融资都描述为产品创新、营销、AI 和更广运营韧性的燃料，而不是单纯修复资产负债表。申报文件还称，如果 IPO
              募资成功，所得资金将用于一般企业用途，包括营运资本、运营费用和资本开支。这个用途合理，但也凸显剩余的公开数据缺口：可获得来源仍没有给出清晰的当前现金可支撑期限、月度烧钱额或限制性条款视图。Adjusted
