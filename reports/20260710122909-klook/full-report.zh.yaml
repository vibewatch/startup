      - number: '8.2'
        title: 为什么有上行空间：规模、品类领导力和行程份额扩张
        blocks:
          - type: paragraph
            body: >-
              多头逻辑是真实存在的。Klook 的申报文件显示，公司已有足够运营重量：年度交易用户超过 10.7 million，2024 年预订体验超过 54 million，评论密度也很强。
              公司看起来也不只是转售景点门票。其公开页面和合作轨迹显示，Klook 已扩展到交通、住宿、eSIM、活动旅行和目的地开发合作。 这种更宽的角色会影响估值，因为它提高了行程份额，也让 Klook
              有更多方式变现重复需求，而不必依赖单一活动预订。 商户工具、创作者带动的发现和区域目的地合作，也在单纯比价之外形成一定护城河。如果管理层能把这个生态转化为更强复购、稳定抽佣率和持续改善的盈利能力，
              当前轮在事后可能显得保守。这也是 Klook 原则上仍值得投资的原因。上行不是幻想；它绑定的是一个有可见规模的平台，以及一个仍然碎片化、运营难度高、全球巨头很难处处打穿的品类。
