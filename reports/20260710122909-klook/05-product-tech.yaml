  evidenceGaps:
  - type: missing-source
    severity: material
    topic: formal-security-assurance
    missingEvidence: The retained public source set does not surface detailed certifications, audit reports, or robust public security-compliance attestations for Klook.
    whyItMatters: Trust and safety matter deeply in cross-border travel payments, support, and merchant operations, so missing assurance detail is a real diligence gap.
    diligencePath: Request current security certifications, penetration-test cadence, privacy architecture, incident response documentation, and third-party audit summaries.
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: integration-reliability
    missingEvidence: Public sources show that integrations exist, but do not disclose API error rates, sync failures, merchant adoption by connector, or partner-specific uptime.
    whyItMatters: Integration quality is central to conversion, support load, and merchant retention in a fragmented experiences marketplace.
    diligencePath: Request API uptime, booking-sync failure rates, top connector penetration, and merchant support tickets by integration type.
    relatedFigureRefs:
    - FE001
    - FE003
  - type: missing-source
    severity: minor
    topic: roadmap-granularity
    missingEvidence: Public roadmap evidence comes mainly from announcements rather than a changelog, release notes, or product roadmap system.
    whyItMatters: That limits confidence on feature cadence, deprecations, and engineering execution rhythm.
    diligencePath: Request product roadmap documents, release cadence summaries, and major milestone retrospectives.
    relatedTableRefs:
    - TE005
