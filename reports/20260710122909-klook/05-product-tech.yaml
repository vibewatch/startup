  rows:
  - - Find and book an experience
    - Discover, compare, book, confirm, redeem
    - Marketplace with reviews, instant or delayed confirmation, and redemption support
    - Faster booking and ticket retrieval
    - No public conversion benchmark
  - - Add transport or utility to trip
    - Cross-sell trains, buses, ferries, hotels, or eSIMs
    - Same consumer app and checkout flow
    - Higher wallet share and convenience
    - Attach-rate economics undisclosed
  - - Resolve booking issue
    - Search help, check confirmation, request support
    - Help Center plus local-language support and AI-assisted service
    - Visible support workflow and faster triage
    - Public SLA detail is limited
  - - Onboard as merchant
    - Register, connect inventory, manage bookings
    - Merchant surface plus partner apps and integration docs
    - Lower digitalization hurdle for SMEs
    - Two-to-four-week onboarding still nontrivial
  - - Fulfill activity on-site
    - Receive booking, scan voucher, handle review loop
    - Partner app and operator integrations
    - Operational control at redemption point
    - Performance by merchant is not publicly benchmarked
  notes: Traveler and merchant workflows are both productized; the public evidence is unusually explicit on post-booking support and on-site redemption mechanics.
