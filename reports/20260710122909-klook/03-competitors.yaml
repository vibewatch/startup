- id: section-3
  title: Switching cost, distribution power, and supply access
  body: Klook's biggest structural challenge is that supplier lock-in looks modest. The filing openly says merchants can list across multiple platforms, and both Klook and GetYourGuide emphasize integrations with channel managers and reservation systems that make multi-homing easier, not harder. That is good for merchant adoption, but it limits hard exclusivity. Distribution power therefore becomes a contest between experience depth and broader bundle reach. Klook's APAC density and travel-utility add-ons help it defend relevance, especially for regional and last-mile bookings. Yet Trip.com, Booking, Airbnb, and Tripadvisor each enter the funnel with larger travel audiences, adjacent categories, or globally recognized brands. Public pricing data are also incomplete. Klook has a visible third-party indication that supplier commissions often land in a 15% to 35% band, but equivalent realized economics are not cleanly disclosed for most peers. In practice, competitive choice is shaped less
    by published headline pricing and more by traffic quality, support, review trust, and conversion tools.
  claimRefs:
  - CP003
  - CP004
  - CP021
  - CP022
  - CP029
  - CP035
