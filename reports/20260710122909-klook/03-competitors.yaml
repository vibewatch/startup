callouts:
- calloutType: strength
  title: Klook is more specialized than broad OTAs but broader than pure tours-only peers
  body: 'The strongest public case for Klook is not that it is the biggest travel brand overall. It is that it sits in a useful middle ground: deeper in experiences than broad OTAs, yet broader in transport, utilities, and destination partnerships than many pure tours peers.'
  claimRefs:
  - CP002
  - CP012
  - CP015
  - CP032
- calloutType: risk
  title: Multi-homing is the category's default, not an edge case
  body: The most important disconfirming evidence is that supplier-side lock-in looks weak across the category. Connectivity, channel managers, and many alternative routes to market help operators onboard faster, but they also make exclusivity harder to defend.
  claimRefs:
  - CP003
  - CP008
  - CP023
  - CP035
- calloutType: assumption
  title: Broad travel incumbents will keep pushing into experiences
  body: Klook's filing and the brand breadth of Trip.com, Booking, Airbnb, and Tripadvisor all support the assumption that incumbent pressure will remain active even if no single rival perfectly mirrors Klook's APAC experience stack today.
  claimRefs:
  - CP005
  - CP018
  - CP019
  - CP041
