tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale/funding
  - target segment
  - differentiation
  - limitation
  rows:
  - - GetYourGuide
    - Direct experiences marketplace
    - 150k+ experiences, 12k cities, 200m+ tickets sold; third-party source says $650m+ raised
    - Global travelers seeking curated activities and tours
    - Deep experiences catalog, strong support messaging, supplier integrations
    - Less obvious transport or utility breadth than Klook or KKday
  - - KKday
    - Direct experiences marketplace with travel utilities
    - No strong official revenue disclosure; Forbes title references a $70m 2024 investment
    - Asia-focused travelers wanting activities plus transport or eSIM utilities
    - Close product overlap with Klook on attractions, transport, and local utilities
    - Public scale disclosure is thinner than Klook or GetYourGuide
  - - Viator / Tripadvisor
    - Experiences marketplace plus review/content network
    - Tripadvisor Group runs two-sided marketplaces for experiences and travel categories
    - Travelers who start with review content and broad travel discovery
    - Trusted global content and Viator distribution inside Tripadvisor ecosystem
    - Current restructuring and layoffs imply operating-model pressure
  - - Trip.com
    - Broad OTA and one-stop travel platform
    - Global multi-brand platform spanning Trip.com, Ctrip, Qunar, and Skyscanner
    - Travelers wanting a bundled trip-planning experience
    - Hotels, flights, and broad trip bundle power plus strong Asia relevance
    - Experiences are only one part of a much broader product stack
  - - Airbnb
    - Lodging-led travel adjacency
    - 9m+ listings, 150k+ cities and towns, 2.5b+ guest arrivals
    - Travelers starting from stays and local discovery
    - Massive global audience and lodging-first trip intent
    - Experiences are adjacency, not the company's sole competitive focus
  - - Direct supplier / status quo
    - Direct booking, offline agents, concierges, or internal build
    - Scale fragmented across thousands of operators
    - Merchants seeking control and travelers going direct
    - Best control for merchants and no platform intermediation
    - SMEs often still need demand generation, support, and connectivity tooling
  notes: The practical buying set is not just marketplace-vs-marketplace. It spans experiences specialists, broad OTAs, lodging-led discovery, and direct booking substitutes.
