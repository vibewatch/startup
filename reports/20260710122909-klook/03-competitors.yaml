- id: TP003
  title: Pricing / packaging comparison
  columns:
  - price/unit/contract model
  - included capabilities
  - discounts/unknowns
  - implication
  rows:
  - - 'Klook: supplier commission often cited at 15%-35%; traveler pays per activity or pass'
    - Activities, transport, local utilities, event bundles, merchant apps
    - Realized take rate by category or geography remains undisclosed publicly
    - Packaging breadth is visible, but full unit economics are still private
  - - 'GetYourGuide: activity-level consumer pricing; supplier economics not publicly disclosed on official pages'
    - Experiences depth, free cancellation on many products, pay later, 24/7 support
    - Public supplier take rate not clearly disclosed
    - Strong traveler flexibility narrative can offset lack of public merchant-economics transparency
  - - 'KKday: activity and utility pricing visible to consumers; supplier economics not publicly disclosed'
    - Activities plus transport, flights, accommodation, eSIM, food and shopping
    - No clean public commission benchmark found in fetched sources
    - Breadth is strategically meaningful even without public monetization detail
  - - 'Viator / Tripadvisor: consumer pays per tour or activity; supplier economics not publicly disclosed in retained official sources'
    - Review-led discovery, experiences inventory, parent-brand travel content
    - Lack of public realized economics in retained sources
    - Trust and traffic may matter more than transparent list economics
  - - 'Trip.com: bundled travel pricing across hotels, flights, and add-ons; experiences are one line item among many'
    - One-stop trip planning, multiple brands, large travel bundle
    - Public sources here do not isolate experiences take rate or economics
    - Bundle power can pressure experiences specialists even without direct price comparability
  notes: Pricing is the noisiest part of the public comparison. Consumer packaging is visible, but realized supplier economics are mostly opaque outside limited third-party Klook indications.
