- id: section-2
  title: Capability breadth, packaging, and route-to-market differences
  body: Klook looks strongest when the buyer wants a marketplace centered on in-destination spend rather than on airfare or lodging. Its combination of activities, local transport, eSIMs, event packages, destination partnerships, mobile-first booking, and merchant-side apps is broader than a pure tours-only proposition, but still narrower than the fully bundled travel ecosystems of Trip.com or Booking. GetYourGuide emphasizes global experiences depth, cancellation flexibility, and support; KKday mirrors Klook more closely by combining activities with transport and utilities; Viator and Tripadvisor bring trust, content, and a massive audience; and Airbnb or Booking remain powerful adjacencies because they sit earlier in the trip-planning funnel with broader user intent. Supplier connectivity is also a real capability dimension. GetYourGuide and Klook both emphasize integrations and reservation-system support, which means the battle for merchants is partly about workflow fit and demand generation
    rather than only about consumer traffic.
  claimRefs:
