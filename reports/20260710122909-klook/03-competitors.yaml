company:
  name: Klook
chapter:
  number: 3
  title: Competitors
  summary: Klook competes in a crowded but segmented travel stack. Its cleanest peer set is experiences-first marketplaces such as GetYourGuide, KKday, and Viator, but the bigger competitive pressure comes from broader travel incumbents and low-lock-in merchant behavior. Klook's APAC density, transport and event adjacencies, and merchant tooling are real advantages, yet multi-homing, bundle pressure, and category economics keep moat durability conditional rather than absolute.
sections:
- id: section-1
  title: 'Landscape: direct peers, incumbents, and substitutes'
  body: 'Klook''s competitive set is wider than a simple list of attractions-ticket apps. The direct peer group is other experiences-first marketplaces such as GetYourGuide, KKday, and Viator, each of which explicitly markets tours, activities, and destination experiences. The second layer is broader travel incumbents such as Trip.com, Booking Holdings, and Airbnb, which come with much larger travel surfaces, stronger cross-category bundle power, or both. The third layer is the status quo: direct supplier sites, hotel concierges, travel agents, and operators who choose to multi-home across marketplaces or invest in more direct distribution. Klook''s own filing matters here because it confirms both sides of the picture. On one hand, it claims category leadership in pan-regional APAC experiences. On the other, it explicitly acknowledges that merchants and users can choose among many online and offline alternatives and that larger platforms have more data, traffic, and resources. That makes
    the category competitive by structure, not only by branding.'
  claimRefs:
