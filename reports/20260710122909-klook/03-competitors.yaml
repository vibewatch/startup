- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation/diligence ask
  rows:
  - - APAC experience density
    - Broad OTAs and global incumbents can expand into experiences
    - high
    - Measure whether Klook wins on APAC-local inventory quality, not just headline count
  - - Merchant distribution network
    - Merchants can multi-home and connect via channel managers
    - high
    - Request merchant retention, exclusive-inventory share, and multi-homing data
  - - Support and trust layer
    - Peers such as GetYourGuide emphasize similar service promises
    - medium
    - Benchmark refund handling, cancellation friction, and response times by market
  - - Mobility and utility cross-sell
    - Trip.com and KKday also bundle transport or utility products
    - medium
    - Track attach rates and repeat behavior for transport, eSIM, and cross-sell categories
  - - Destination-board and live-event partnerships
    - Incumbents or direct sellers can replicate some co-marketing arrangements
    - medium
    - Request conversion and CAC evidence from event-led and DMO-led demand channels
  - - Category underpenetration narrative
    - Category can still have thin margins and strategic volatility
    - high
    - Pressure-test take-rate durability, support cost, and fixed-cost leverage against peers
  notes: Klook has real strategic edges, but each moat claim has an obvious counter from either multi-homing behavior or broader incumbent distribution power.
