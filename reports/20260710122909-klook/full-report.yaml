            title: Positive travel demand does not remove margin pressure
            body: >-
              Experiences can outgrow broader travel while still being economically harder than flights or hotels.
              Reuters and Klook's own filing both preserve the same risk pattern: fragmented supply, multi-homing
              merchants, support load, and sensitivity to macro shocks.
            calloutType: risk
