    title: Market definition table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance
    rows:
      - - Experiences and tours
        - Attractions, guided tours, day trips, activities, and in-destination tickets
        - Airfare-only bookings and general offline sightseeing that never touches a digital platform
        - Traveler is usually buyer, user, and payer
        - Core direct market and Klook's clearest comparable set
      - - Local mobility and trip utilities
        - Rail passes, airport transfers, car rental, eSIMs, and transport tied to a trip
        - Standalone commuting, non-travel telecom, or generic urban mobility apps
        - Traveler buyer and payer; sometimes family planner pays for a group
        - Important adjacency that raises wallet share and retention
      - - Experiential stays and event packages
        - Travel bundles where the experience is central, including concerts or destination packages
        - Pure lodging marketplaces where the stay is the whole product
        - Traveler or household buyer; tourism board or partner may subsidize demand generation
        - Useful adjacency but not the cleanest base market denominator
      - - Merchant enablement and distribution
        - >-
          Commission-based marketplace access, API connectivity, multilingual content, settlement, and merchandising
          support
        - Full standalone merchant software budgets not tied to distribution demand
        - Merchant pays indirectly through commission or marketplace economics
        - Critical because supply digitalization drives category liquidity
      - - Destination marketing and tourism-board partnerships
        - Co-marketing, discovery campaigns, visitor dispersion, and event-led travel demand generation
        - General government tourism capex without a commerce or traffic link
        - Tourism authority budget owner; traveler is end user
        - Explains why Klook can win institutional partnerships beyond consumer ads
      - - Broad OTA and lodging substitution
        - Trip planning, hotel, flight, restaurant, and general travel discovery surfaces that can add experiences
        - Non-travel ecommerce and unrelated leisure spending
        - Traveler is buyer and payer, but platform economics differ from Klook's niche
        - Relevant substitute class but too broad to serve as Klook's primary market definition
    notes: >-
      The clean underwriting boundary centers on experiences and in-destination services, while broader OTA or lodging
      platforms matter as substitute routes rather than as the core market denominator.
