  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who the customers are and why the base is not one-dimensional
        blocks:
          - type: paragraph
            body: >-
              Klook's customer base is broader than the shorthand 'experience-booking app' suggests. The primary
              demand-side customer is the traveler, especially mobile-first, younger, spontaneous users looking to
              discover and book attractions, transport, local tours, and other in-destination services with low
              friction. But the supply-side customer matters almost as much. Klook's filing, merchant surfaces, partner
              apps, and operator integration documents all point to a second customer group made up of merchants,
              attractions, tour operators, and destination partners that use Klook for demand generation, booking
              intake, reviews, and workflow digitization. A third, more strategic customer-like group sits between those
              two sides: tourism boards, event organizers, and regional destination partners that use Klook as a
              distribution, marketing, and data partner. That mix means the customer question is not simply consumer
              acquisition. Klook must keep travelers returning, keep merchants willing to allocate inventory and accept
              commissions, and keep strategic partners convinced that Klook can move demand toward targeted destinations
              or events.
