  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Where the price starts: current public valuation is defensible, not effortless'
        blocks:
          - type: paragraph
            body: >-
              The current public valuation anchor is straightforward. Klook announced a US$100 million investment in
              February 2025, and independent market-data sources continued to cite an approximate US$1.4 billion
              valuation around that round. Public filing coverage then showed that Klook generated US$417.1 million of
              revenue in 2024, up from US$335.2 million in 2023. That means the late-stage round implies a trailing
              revenue multiple of roughly 3.4x. On its face, that does not look absurd for a scaled travel marketplace
              that appears to have survived the pandemic, regained growth, and built real regional density. But it also
              does not automatically deserve a premium multiple. Investors are not buying a pure software company or a
              clean Airbnb-style asset-light brand machine. They are buying a cross-border marketplace with fragmented
              supply, support intensity, and meaningful travel cyclicality. So the starting point is neither 'too cheap
              to ignore' nor 'obviously overvalued.' It is a valuation that sits inside a plausible public-market band,
              but one that still demands better evidence on durability and downside protection.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV020
              - CV026
              - CV032
