      - number: '7.2'
        title: Regulatory, legal, and governance risk are real even without visible enforcement actions
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not show a current headline lawsuit or privacy enforcement event against Klook, but
              that is not the same as low legal risk. Klook operates across many jurisdictions, collects personal and
              payment-related data, shares information with partners and operators, and distributes through Apple and
              Google storefronts that impose their own privacy, content, support, and metadata rules. Hong Kong's PDPO
              and Singapore's PDPA both impose baseline obligations on collection, use, disclosure, retention, and
              security of personal data, with regulator enforcement powers and civil or criminal consequences in some
              cases. Klook's own public policy and conditions surfaces are visible, yet they remain generic compared
              with the richer formal assurance packages sophisticated investors often want. Governance complexity adds
              another layer. The filing describes a dual-class structure with super-voting Class B shares,
              controlled-company status after listing, and a Cayman holding-company and PRC-VIE architecture. None of
              those elements proves misconduct, but together they raise the threshold for investor comfort because
              minority shareholder influence, local regulatory shifts, and structure-specific legal risk all become more
              important in downside scenarios.
