  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product delivers in workflow terms
        blocks:
          - type: paragraph
            body: >-
              Klook's product is best understood as a two-sided travel-experiences operating system rather than only a
              booking widget. On the traveler side, the public surfaces show discovery, comparison, booking, instant or
              delayed confirmation, redemption, support, review, and loyalty interactions. On the supply side, the
              evidence points to onboarding, inventory connection, booking receipt, voucher redemption, review
              management, and account administration. That distinction matters because Klook is not merely listing
              attractions; it is coordinating a workflow where localized content, payments, timing rules, and
              post-booking support all affect conversion and quality. The consumer app broadens the commercial surface
              beyond attractions into transport, hotels, eSIMs, and event bundles, while the partner apps show that
              merchant operations are productized too. The result is a product definition anchored in travel execution
              and merchant enablement rather than in static catalog browsing alone. That breadth makes product maturity
              visible not only in commerce but also in the handoff between traveler actions and merchant execution.
