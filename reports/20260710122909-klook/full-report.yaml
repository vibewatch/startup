      - number: '1.2'
        title: Founders, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Publicly accessible governance detail remains thinner than investors would ideally want, but the available
              record still supports a clear founder-led picture. Ethan Lin remains CEO, co-founder, and chairman; Eric
              Gnock Fah remains president and director; and Bernie Xiong remains CTO and director. The IPO filing adds
              the most important governance fact for diligence: Klook is moving toward a dual-class share structure in
              which Ethan Lin and Eric Gnock Fah beneficially own all issued Class B ordinary shares after the offering.
              That does not fully resolve board-level questions, but it does signal continuing founder control over
              strategic direction and public-company governance.


              Key-person dependence is therefore real. Lin is tied to strategy, capital markets, and external narrative;
              Gnock Fah bridges partner operations, commercial expansion, and marketplace design; and Xiong anchors
              technology modernization and AI deployment. The strength of this founder trio is obvious in the continuity
              of their roles across funding rounds, press releases, and the filing. The risk is that public materials
              still do not fully surface an independent-governance counterweight of the kind a late-stage public-market
              investor might expect. For later chapters, that means execution quality and capital allocation should be
              read through a founder-control lens rather than assumed to be institutionally diversified already.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
