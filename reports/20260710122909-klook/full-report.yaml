      - number: '4.2'
        title: Cost structure, margin path, and public efficiency signals
        blocks:
          - type: paragraph
            body: >-
              The filing gives enough to describe direction, but not enough to finish the underwriting alone. Revenue
              rose from $335.2 million in 2023 to $417.1 million in 2024, while 2024 GTV reached about $2.5 billion and
              gross profit reached $257.8 million. Gross profit as a percentage of GTV improved to 10.3% in 2024 and
              11.1% in the first nine months of 2025, and adjusted EBITDA moved from negative $22.9 million in 2024 to
              positive $6.3 million in 9M25. Those are real signs of operating progress. However, the same disclosure
              still shows heavy commercial spend and continued losses. Selling and marketing expense remained large at
              $194.2 million in 2024, and net loss was still $99.3 million that year. Reuters and PhocusWire both
              underline the same caution: experiences remain harder than flights or hotels because supply is fragmented
              and take rates can be volatile. Klook therefore looks like a company with improving unit-level economics
              but not yet one with fully de-risked earnings quality.
