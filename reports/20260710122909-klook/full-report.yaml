companyProfile:
  summary: >-
    Klook is a Hong Kong-founded travel marketplace established in 2014 by Ethan Lin, Eric Gnock Fah, and Bernie Xiong.
    The company built regional leadership in APAC experiences and then expanded into transport, accommodation,
    destination partnerships, event travel, and merchant tooling. By late 2025 it had disclosed enough scale through its
    F-1 filing to show a real late-stage platform: more than US$417 million of 2024 revenue, over 10.7 million annual
    transacting users, and more than 54 million experiences booked. That scale makes the company investable in
    principle, but public evidence still leaves meaningful open questions on retention, concentration, governance, and
    capital-structure terms.
