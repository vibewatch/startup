      - number: '8.3'
        title: 'Why caution remains: public proof on quality is weaker than public proof on size'
        blocks:
          - type: paragraph
            body: >-
              The key reason to stay disciplined is that Klook's public proof quality is uneven. Public sources are good
              on scale, partnerships, and recent recovery. They are weaker on retention, merchant concentration,
              security assurance, preference overhang, and true steady-state margin durability. Reuters explicitly
              pointed to fragmented supply and thinner margins in experiences. The filing and customer chapters confirm
              the company is still highly exposed to APAC travel patterns, while the risks chapter shows that platform,
              app-store, privacy, and merchant-quality dependencies remain material. Public comps help sharpen the
              caution. Booking and Airbnb command richer multiples because they combine scale with stronger brand power,
              profitability perception, and, in Airbnb's case, a different inventory model. Trip.com and TripAdvisor
              show the other side of the range: travel platforms can trade much lower when cyclicality, geography, or
              quality perception becomes the dominant lens. Klook therefore deserves credit for its recovery and
              density, but not a blind premium. Without better retention and cap-table evidence, a mid-band valuation is
              easier to defend than a stretched one.
            claimRefs:
              - CV012
