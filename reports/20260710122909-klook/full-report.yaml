      - number: '8.2'
        title: 'Why upside exists: scale, category leadership, and trip-share expansion'
        blocks:
          - type: paragraph
            body: >-
              There is a real bull case. Klook's filing gives it enough operating weight to matter: more than 10.7
              million annual transacting users, over 54 million experiences booked in 2024, and strong review density.
              The company also appears to be doing more than simply reselling attraction tickets. Its public surface and
              partnership trail show expansion into transport, accommodation, eSIMs, event travel, and
              destination-development partnerships. That broader role matters in valuation because it increases share of
              trip and gives Klook more ways to monetize repeat demand without relying on a single activity booking.
              Merchant tooling, creator-led discovery, and regional destination partnerships also create some moat
              beyond price comparison alone. If management can translate that ecosystem into stronger repeat purchase,
              durable take rates, and steadily improving profitability, the current round could look conservative in
              hindsight. That is why the name remains investable in principle. The upside is not fantasy; it is tied to
              a visible platform with real scale and a category that is still fragmented and operationally difficult for
              global incumbents to win uniformly.
            claimRefs:
              - CV005
