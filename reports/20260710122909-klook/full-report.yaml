  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The risk stack is driven by external travel shocks plus platform complexity
        blocks:
          - type: paragraph
            body: >-
              Klook's risk profile is not dominated by one existential technical flaw. It is dominated by the
              interaction of a cyclical end market with a complicated cross-border operating model. The filing makes
              clear that Klook remains heavily exposed to discretionary travel spending, macro volatility, weather
              events, pandemics, wars, visa policy changes, and regional instability. That exposure matters more for
              Klook than for a pure software vendor because cancellations, refunds, and safety concerns can hit demand
              very quickly. At the same time, Klook is not only a demand aggregator. It sits between travelers,
              merchants, tourism boards, payment methods, app stores, cloud providers, and booking-system integrations.
              That multiplies the number of places where a compliance failure, service failure, or partner-policy shift
              can transmit into customer dissatisfaction, supply degradation, or revenue pressure. The practical
              takeaway is that Klook's top residual risks are systemic and interconnected: travel demand shocks, privacy
              and consumer-protection obligations, partner dependency, and governance complexity all reinforce each
              other rather than remaining isolated issues.
            claimRefs:
              - CR011
              - CR015
              - CR016
              - CR017
              - CR031
              - CR035
              - CR036
          - type: figure
