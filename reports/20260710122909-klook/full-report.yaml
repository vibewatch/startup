  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              Klook monetizes a high-frequency booking workflow rather than a simple subscription product. The filing
              frames the company as digital infrastructure for the global experiences economy, while the consumer app
              and about page show monetization surfaces spanning activities, tours, transport, accommodation, eSIM,
              passes, and event packages. Public evidence suggests the core economic engine is still marketplace-style
              transaction monetization: GTV turns into revenue, then gross profit, with margin shaped by merchant
              economics, support load, refunds, and marketing. Third-party partner docs are useful because they put
              rough numbers around an otherwise opaque take-rate story. Bókun says Klook commissions are generally
              negotiated in a 15% to 35% band, which fits a marketplace model but still leaves category-by-category
              realized monetization undisclosed. The Help Center and app surfaces also show a loyalty and discount layer
              through KlookCash, coupons, and Platinum benefits, meaning management is using rewards and support perks
              to influence repeat behavior and wallet share, not only headline booking volume.
