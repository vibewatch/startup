      - number: '2.2'
        title: Buyer segmentation, payer logic, and the two-sided market
        blocks:
          - type: paragraph
            body: >-
              Klook's market is two-sided even though the consumer side is the visible one. On the demand side, the
              company explicitly targets young, tech-savvy, spontaneous travelers, and its own commissioned and platform
              studies suggest a strong millennial and Gen Z skew toward activities, short-haul regional trips, and
              event-led travel. PATA's work reinforces that the region is heavily intra-Asian: almost seven in ten
              inbound trips in 2025 came from within Asia Pacific. That matters because the practical budget owner is
              often the same person as the user and payer on the traveler side, but the adoption trigger differs by
              segment: families want reliability and bundled convenience, fandom travelers want access and urgency, and
              multi-destination travelers want local mobility plus low-friction confirmation. On the supply side,
              merchants and destination partners are equally important. SMEs adopt Klook because it can bring demand,
              payments, multilingual merchandising, and API connectivity that would be costly to build alone. This is
              not just a consumer app market; it is a distribution and digitalization market spanning travelers,
              merchants, and tourism boards.
            claimRefs:
