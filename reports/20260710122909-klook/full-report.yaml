      - number: '7.3'
        title: Operational and partner risks live in the merchant, support, and infrastructure layers
        blocks:
          - type: paragraph
            body: >-
              The customer-facing Klook brand can hide how much operational risk sits beneath the surface. The filing
              says Klook handles last-mile travel complexity, including standardized refunds, disruption management,
              multi-currency payments, and traveler-operator messaging. Every one of those workflows can fail at the
              exact moment users are most dissatisfied. Trustpilot commentary and the existence of large help-center and
              refund FAQ surfaces reinforce that booking changes, refunds, confirmations, and service recovery are not
              edge cases. On the supply side, Klook depends on thousands of merchants and operators with varying digital
              maturity. ROLLER, Rezdy, and Flickket evidence shows that Klook needs third-party integrations, product
              mapping, and merchant tooling to keep supply live and accurate. That is strategically useful, but it also
              means that stale inventory, bad redemption experience, or integration drift can hurt traveler trust while
              still being operationally outside Klook's direct control. Add Google Cloud and app-store dependence, and
              the company starts to resemble a tightly coupled operations network whose failure modes can cascade from
              partner systems into cancellations, support load, and reputational damage.
