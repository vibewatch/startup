  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Klook's value is most sensitive to revenue quality, multiple selection, and whether durability proof improves
      enough to justify staying above lower-end travel comps.
    data:
      items:
        - label: Revenue growth durability
          value: 9
          detail: Fastest driver of upside because current price already assumes continued recovery
        - label: Repeat-purchase / retention proof
          value: 8
          detail: Could expand or compress the justified multiple materially
        - label: Margin / EBITDA conversion
          value: 8
          detail: Late-stage marketplace valuations depend on quality of earnings, not only topline
        - label: Cap-table / dilution clarity
          value: 7
          detail: Preference stack can change equity returns even if enterprise value seems fair
        - label: Platform / regulatory risk realization
          value: 7
          detail: A policy or privacy event could compress the multiple quickly
    claimRefs:
      - CV003
      - CV012
      - CV013
      - CV015
      - CV028
      - CV035
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Bear, base, and bull current-value bands in USD millions anchored to public revenue scale, public travel
      comparables, and the remaining diligence gaps.
    data:
      items:
        - label: Bear
          low: 700
          mid: 850
          high: 1000
          detail: Demand weakens, quality gaps matter more, and valuation compresses toward lower travel comps
        - label: Base
          low: 1200
          mid: 1450
          high: 1700
          detail: Recovery holds and current mark remains broadly defensible but not obviously cheap
        - label: Bull
          low: 2000
          mid: 2300
          high: 2600
          detail: Retention, profitability, and moat evidence improve enough to justify a stronger premium
    approximationNotes: >-
      Values are current-value equity bands in USD millions, not future exit values. Dilution and preference detail are
      not public, so return outcomes are less precise than enterprise-value bands.
    claimRefs:
      - CV003
      - CV020
      - CV026
      - CV027
      - CV028
      - CV039
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scorecard balancing market opportunity and scale against quality, risk, and evidence gaps.
    data:
      items:
        - label: Market opportunity
          value: 8/10
          detail: Experiences remain fragmented and APAC travel is large
        - label: Customer proof
          value: 8/10
          detail: Millions of users, review density, and visible partnerships are real
        - label: Moat quality
          value: 6/10
          detail: Regional density and tooling help, but multi-homing risk persists
        - label: Economics visibility
          value: 6/10
          detail: Revenue is visible, but retention and steady-state margin detail remain incomplete
        - label: Governance quality
          value: 4/10
          detail: Dual-class and VIE structure justify caution
        - label: Risk load
          value: 4/10
          detail: Travel cyclicality, privacy, and platform dependence are meaningful
        - label: Valuation support
          value: 6/10
          detail: Current mark sits inside a plausible comp band but lacks a clear discount
        - label: Evidence quality
          value: 5/10
          detail: Public evidence is good on scale and weaker on durability and capital structure
    claimRefs:
      - CV001
      - CV002
      - CV009
      - CV012
      - CV015
      - CV020
      - CV030
      - CV032
