      - number: '1.3'
        title: Capital path, scale metrics, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Klook’s funding history shows repeated access to growth capital but also why disclosure quality still
              matters. Official releases support a progression from a US$200 million 2018 Series D, to a US$225 million
              2019 Series D+ led by SoftBank Vision Fund, to a US$200 million 2021 Series E led by Aspex, to a US$210
              million 2023 round led by Bessemer Venture Partners, and finally a US$100 million 2025 round led by
              Vitruvian Partners. Those rounds brought in investors including Sequoia China, Matrix Partners, Goldman
              Sachs, Boyu, TCV, SoftBank, and later regional strategic and banking partners. This is a strong signaling
              stack for a private travel platform that lived through the pandemic shock and still returned to growth
              capital markets.


              However, the chapter also needs to separate scale from precision. Reuters-origin IPO reporting gives a
              clean 2024 revenue anchor of US$417.1 million versus US$335.2 million in 2023, and the filing supplies
              employee, destination, and bookings figures. But the exact lifetime funding total, preference stack, and
              most recent post-money valuation are still not fully reconciled in accessible public materials. Even
              profitability requires caution: the 2023 financing release said Klook had achieved overall profitability,
              while IPO coverage still reported a US$99.3 million net loss in 2024. The right read is not that one side
              is false; it is that management may have been describing a narrower or non-GAAP milestone that did not yet
              translate into durable full-year public profitability.
