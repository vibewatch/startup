            title: The real opportunity is a still-offline category, not all of travel
            body: >-
              The most decision-useful market evidence is not the trillion-dollar global travel headline. It is the
              combination of low online penetration, fragmented SME supply, and last-minute mobile behavior in
              experiences, where digital intermediation still solves a real problem.
