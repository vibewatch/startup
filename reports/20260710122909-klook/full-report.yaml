      - number: '7.4'
        title: Mitigation exists, but several thesis-break triggers still require private diligence
        blocks:
          - type: paragraph
            body: >-
              Klook is not unmanaged. Public evidence supports several mitigation levers: policy surfaces exist,
              app-store compliance requirements are knowable, support automation has improved resolution rates,
              destination and merchant tooling reduce manual friction, and the company has survived a severe
              travel-industry shock once before. But investors should resist over-reading that resilience. The public
              evidence still does not show detailed security certification, hard uptime history, merchant concentration,
              or partner-renewal concentration. Those absences matter because Klook's model can remain apparently
              healthy until a privacy incident, platform-policy dispute, regional travel shock, or merchant-quality
              breakdown forces the weaknesses into view. The right kill criteria are therefore measurable: regulator
              action or a reportable data incident; material APAC demand deterioration combined with rising
              cancellations; app-store or major partner policy action that constrains distribution; or evidence that
              merchant churn, support burden, or refund friction is worsening faster than revenue quality. Klook may
              still be investable, but only with explicit diligence around these transmission points rather than with a
              generic assumption that travel recovery alone neutralizes the risk stack.
