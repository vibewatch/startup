evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-terms
    missingEvidence: >-
      The exact post-money valuation, liquidation preferences, and governance rights attached to the 2025 Vitruvian-led
      round.
    whyItMatters: Valuation context and investor protections materially affect how attractive the equity entry price really was.
    diligencePath: Request the 2025 term sheet, cap table, and shareholder rights schedule from management.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: lifetime-funding-total
    missingEvidence: A single authoritative schedule reconciling lifetime equity raised, round extensions, and later bank facilities.
    whyItMatters: Different public sources mix equity, debt and round extensions, making headline total-raised figures unreliable.
    diligencePath: >-
      Reconcile all historical closings against the shareholder register, bank facility agreements, and audited balance
      sheet footnotes.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: governance-depth
    missingEvidence: >-
      A current public board and committee roster with independent-director detail and voting-control percentages
      post-offering.
    whyItMatters: Founder control is clear, but board independence and governance safeguards matter for public-market readiness.
    diligencePath: Pull the most recent amended F-1 and any governance appendix, or request the board matrix directly from Klook.
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: apac-arrival-denominator
    missingEvidence: >-
      A reconciled explanation for why UN Tourism's Asia-Pacific arrival counts differ so materially from the PATA-based
      figures repeated in Klook's 2025 funding release.
    whyItMatters: Large denominator differences can materially change how investors frame Klook's SAM and growth runway.
    diligencePath: >-
      Request management's preferred market-sizing deck, including exact geography coverage, year definitions, and
      whether the cited series count destinations, travelers, or trips.
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-unit-economics
    missingEvidence: >-
      Public sources do not break out take rate, cancellation burden, support cost, or repeat behavior by category,
      geography, or traveler cohort.
    whyItMatters: >-
      The market may be large, but valuation depends on which segments are actually attractive after service and
      acquisition costs.
    diligencePath: Request internal cohort economics by category, destination, merchant type, and acquisition channel.
    relatedTableRefs:
      - TM003
