callouts:
- calloutType: insight
  title: The biggest public improvement is operating leverage, not clean profitability
  body: Revenue, gross profit, and adjusted EBITDA all moved in the right direction through 2024 and 9M25. The missing step is durable net-income quality, not evidence of any improvement at all.
  claimRefs:
  - CI001
  - CI005
  - CI007
  - CI008
- calloutType: risk
  title: Public revenue quality still has major blind spots
  body: Investors can derive revenue, GTV, gross profit, and some simple ratios from the filing, but they still cannot see the category mix of take rate, CAC payback, refund burden, or current cash runway without management help.
  claimRefs:
  - CI020
  - CI037
  - CI038
  - CI041
- calloutType: assumption
  title: Capital will keep being deployed into AI, merchant enablement, and growth rather than hoarded
  body: Both the 2023 and 2025 financing narratives, plus the IPO use-of-proceeds language, support the assumption that management is still in investment mode and views improved efficiency as a way to extend growth rather than stop spending.
  claimRefs:
  - CI022
  - CI023
  - CI025
  - CI027
