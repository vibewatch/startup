- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metrics
  - impact
  - exact diligence path
  rows:
  - - Category-level take rate
    - Without it, revenue quality by product is still opaque
    - Request revenue and gross profit by attractions, transport, eSIM, passes, stays, and events
  - - CAC and payback by channel
    - Hard to judge whether organic traffic is enough to offset marketing intensity
    - Request channel-level acquisition cost and 12-month payback cohorts
  - - Refund loss and customer-support burden
    - Can materially change true contribution margins in travel experiences
    - Request refund, chargeback, and support-cost data by product type and market
  - - Merchant retention and concentration
    - Needed to test supply-side durability and dependency risk
    - Request merchant cohort retention, overlap, and top-merchant concentration
  - - Current cash runway and covenants
    - Needed to underwrite financing dependency
    - Request current cash, restricted cash, debt terms, and covenant headroom
  notes: These are not optional details. They are the main reasons public financial evidence is directionally useful but still incomplete for full underwriting.
