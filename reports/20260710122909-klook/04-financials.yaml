  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics-blind-spots
    missingEvidence: Public sources do not disclose CAC, payback, refund loss, support cost, merchant-retention cohorts, or take rate by category.
    whyItMatters: These are the metrics that decide whether recent revenue growth and EBITDA improvement are durable or merely temporary.
    diligencePath: Request cohort P&Ls by product and market, including acquisition channel, refund burden, and support intensity.
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: current-cash-runway
    missingEvidence: Accessible public sources do not provide a clean current cash balance, restricted-cash detail, monthly burn, or covenant headroom view that is reliable enough for runway underwriting.
    whyItMatters: Financing dependency cannot be fully resolved without current balance-sheet visibility.
    diligencePath: Request the latest monthly cash report, debt schedule, covenant package, and board-approved operating plan.
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: minor
    topic: profitability-definition
    missingEvidence: Management's 2023 claim of overall profitability conflicts with later public filings showing net losses, and the public record does not fully reconcile whether the earlier statement referred to adjusted EBITDA, contribution margin, or another narrower metric.
    whyItMatters: Investors need to know which profitability definition is actually improving and which one remains elusive.
    diligencePath: Request a bridge from GAAP/IFRS loss to adjusted EBITDA, contribution profit, and any internal profitability milestones used in financing materials.
    relatedFigureRefs:
    - FI002
    - FI004
