  - - Instant-confirmation versus request-confirmation booking workflow
    - Policy-driven by product, not one universal price
    - Support cost and conversion effect not disclosed publicly
    - Klook Help Center
  - - KlookCash review rewards and checkout discounts
    - List mechanics visible; realized liability or redemption cost not public
    - Product exclusions and monthly caps apply
    - Klook Help Center
  - - Platinum loyalty perks after $1,500 of spend
    - List threshold visible; realized economics not public
    - Coupons, free eSIM, and priority support create subsidy questions
    - Google Play Klook app
  - - Bundle value-adds such as skip-the-line or event perks
    - Visible in product surfaces, but margin impact undisclosed
    - No public breakdown of attach rate or uplift by perk type
    - Filing and consumer app surfaces
  notes: Public monetization evidence is strongest on policies and commission hints, not on fully realized unit economics.
