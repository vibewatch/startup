summary:
  headline: 继续研究：SheMed 的女性 GLP-1 与诊断叙事可信，但据报道上一轮 $1 billion 估值已经把大量执行兑现提前计入；在公开经济性、队列质量和股权条款可见之前，还不能把故事强度直接当成投资确定性。
