  topStrengths:
    - 面向女性的代谢护理定位，切入需求清晰、NHS 可及性摩擦长期存在的品类。
    - 先验血、再由临床医生审核，并配合支持驱动流程，相比低摩擦线上开方模式，信任和安全叙事更清楚。
    - 公开证据确认早期增长异常快：融资事件时已有 60,000+ 会员，目前还声称社区达到 100,000+。
    - 借助 Tasso 的诊断层，让 SheMed 讲出的不是单纯转售药物，而是差异化筛查和个性化方案故事。
  topRisks:
    - 公开收入、活跃付费会员数、队列留存、CAC 和毛利率仍未披露；估值信心明显弱于叙事强度。
    - $1 billion 上一轮标记已经把 SheMed 推近高溢价数字健康结果，而不是典型早期 telehealth 资产。
    - 英国 GLP-1 telehealth 正面临更严格的监管和广告审查，执行与合规负担都会上升。
    - 支持、诊断、履约和临床医生升级质量是模型关键，但运营 SLA 和事故数据没有公开。
    - 尽管打出独角兽标题，投资者身份、优先股堆叠和详细股权结构条款仍未披露。
  unresolvedGaps:
    - 活跃付费会员基数、按药物拆分的续用情况，以及队列留存曲线。
    - 收入、贡献利润率、毛利率桥、CAC 和回本周期。
    - Series A 股权结构表、清算优先权和投资者权利。
    - 支持质量仪表盘，包括投诉率、升级处理时间和不良事件治理。
    - 先验血的个性化方案相较更简单 telehealth 流程，是否改善结果、留存或变现，还需要证据。
