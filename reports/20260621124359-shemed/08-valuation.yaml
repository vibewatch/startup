- id: what-could-justify-or-break-upside
  title: What could justify or break upside
  body: There is a plausible bull case. SheMed operates in a category where demand is accelerating, the women-specific angle is under-served, and clinical-grade personalization could produce better conversion, retention, and brand trust than generic weight-loss telehealth. If the company can show that its 100k+ community translates into a large, durable paid base; that blood testing improves outcomes or retention enough to support higher ARPU; and that support-led care keeps churn, complaints, and safety incidents controlled, then the last round could prove reasonable or even conservative. Yet the downside case is equally clear. Public materials do not disclose net revenue retention, patient continuation, CAC payback, gross margin by service component, or whether the capital structure leaves new money protected while common-equity upside is thinner than the headline valuation suggests. Category regulation is also tightening, and the business looks more like a compliance-heavy healthcare
    service than a lightweight wellness subscription. Those unknowns mean upside exists, but it should be unlocked by diligence or price discipline, not assumed.
