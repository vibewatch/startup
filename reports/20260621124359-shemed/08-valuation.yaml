  rows:
  - - Bear
    - Community does not translate into durable paid cohorts; regulation and support costs pressure conversion
    - Supportable value compresses below last round because public evidence looks more like an early, high-churn consumer telehealth service
    - High churn, complaints, medicine-supply friction, regulatory drag
    - Meaningful if diligence shows poor continuation or weak margins
  - - Base
    - Member growth is real, support model works, but economics remain similar to a high-touch private telehealth operator
    - Last round remains the main valuation anchor; upside is limited until economics and retention are evidenced
    - Limited transparency, unknown cap-table terms, premium already paid
    - Most plausible using only public information
  - - Bull
    - 100k+ community converts into durable paid base; blood-test-first model improves trust, outcomes, and ARPU; category expands
    - Value can move above last round if SheMed proves it is a women-specific metabolic platform with superior retention and brand strength
    - Need proof on unit economics and regulated execution at scale
    - Requires diligence-backed evidence rather than narrative alone
  notes: Scenarios are directional supportability cases, not price targets for tradable public stock.
