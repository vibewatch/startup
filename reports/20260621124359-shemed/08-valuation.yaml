- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Paying member quality
    - Active paid members, continuation by medication, and cohort retention
    - Narrative scale is not enough if paid usage is shallow
    - Request cohort tables and continuation by product
  - - Unit economics
    - CAC, contribution margin, gross margin by service element, and payback
    - Premium value depends on more than topline demand
    - Request monthly management metrics
  - - Clinical / support quality
    - Complaint rates, escalation times, adverse-event tracking, and safety governance
    - Service-quality failures can destroy both valuation and brand
    - Request support dashboard and incident logs
  - - Regulatory posture
    - Licensing, ad-review controls, and recent compliance findings
    - A premium telehealth multiple is impossible if regulatory footing is soft
    - Request compliance memos and any regulator correspondence
  - - Capital structure
    - Share price, preference stack, liquidation preferences, and option pool
    - The economic entry price may differ meaningfully from headline valuation
    - Request term sheet and cap table
  - - Growth adjacency proof
    - Evidence that women-specific metabolic platform can expand beyond current wedge
    - Upside above the last round requires broader platform credibility
    - Request roadmap, cross-sell data, and category-expansion plan
  notes: These are the minimum diligence asks required to turn the current public narrative into an investable valuation view.
