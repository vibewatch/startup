  - - Blood-test-first personalization may support premium positioning
    - Public workflow and Tasso partnership differentiate the onboarding path
    - Upgrade if outcomes, continuation, or ARPU uplift are proven
  - - The last round may already price in a large share of expected upside
    - Reported $1 billion valuation arrived before public economics disclosure
    - Upgrade only if diligence supports faster and more durable economics than generic telehealth
  - - Public market comps warn against paying premium multiples without proof
    - Hims earns a premium only with scale, while Teladoc and Amwell trade far lower
    - Upgrade if SheMed shows Hims-like growth quality rather than generic telehealth fragility
  notes: The anti-thesis is primarily about missing operating proof and the possibility that the last round already capitalized much of the narrative upside.
