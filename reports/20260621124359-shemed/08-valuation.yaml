chapter:
  number: 8
  title: Valuation
summary: The only clean public pricing anchor for SheMed is the October 2025 Series A at a reported $1 billion valuation. Public evidence does support meaningful ambition—fast member growth, a differentiated blood-test-first workflow, and a category tailwind around women-focused metabolic care—but it does not yet support underwriting above that mark with confidence because revenue, active paid-member quality, churn, unit economics, and cap-table terms remain private. Public comps suggest that premium valuations are possible in digital health and femtech, but they are usually earned with clearer scale, profitability, or enterprise proof than SheMed currently discloses. The investable conclusion is therefore research-more with a stretched valuation stance rather than a blind pass or bullish mark-up.
sections:
- id: recommendation-and-valuation-anchor
  title: Recommendation and valuation anchor
  body: 'SheMed is not missing a valuation anchor; it is missing enough public operating detail to judge whether that anchor is conservative, fair, or aggressive. The October 2025 Series A reportedly priced the company at $1 billion, which is unusually rich for a business founded in 2024 and still private on most core financial disclosures. Public evidence does support a real story: 60,000+ members by the funding event, women-specific positioning, a blood-test-first workflow, and strong category demand from patients seeking faster and more supportive access than the NHS currently offers. But those positives do not automatically translate into underwritable value at or above the last round. Without disclosed revenue, cohort quality, contribution margin, or preference-stack terms, the right investment call is price-sensitive and evidence-sensitive. That is why the cleanest recommendation is research-more rather than buy, and why the last round should be treated as a ceiling to test, not as
    proof of present fair value.'
