  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: paying-member-and-retention-data
    missingEvidence: Active paying members, cohort retention, continuation by medication, and repeat-purchase depth.
    whyItMatters: Narrative scale without cohort quality can overstate enterprise value dramatically.
    diligencePath: Request cohort tables by acquisition month, medication type, and support cohort.
    relatedQuestionRefs:
    - QV014
    - QV015
    - QV022
    - QV027
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Revenue, CAC, contribution margin, gross margin by service component, and payback period.
    whyItMatters: These inputs determine whether SheMed merits a premium platform multiple or a lower clinic-like multiple.
    diligencePath: Request monthly management accounts and unit-economic bridge by cohort.
    relatedQuestionRefs:
    - QV014
    - QV015
    - QV021
    - QV027
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-terms
    missingEvidence: Share price, option pool, preference stack, liquidation preferences, and any structure that changes the true entry price.
    whyItMatters: Headline valuation can materially mislead if the economic terms are investor-protective.
    diligencePath: Review term sheet, cap table, and preference summary before underwriting.
    relatedQuestionRefs:
    - QV016
    - QV026
    - QV027
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: minor
    topic: outcomes-proof
    missingEvidence: Public evidence showing that blood-test-first personalization improves outcomes, retention, or monetization versus simpler telehealth flows.
    whyItMatters: The premium-differentiation argument is plausible but not yet publicly validated with outcome data. It also limits how mechanically investors can map comparable valuations onto SheMed.
    diligencePath: Request clinical study results, continuation analysis, and ARPU comparison for screened versus unscreened cohorts.
