- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Hims & Hers
    - Public telehealth / weight-management platform
    - ~$8.2B market cap; ~3.3x EV/Revenue; profitable, scaled
    - Best public analogue for consumer-health subscription plus GLP-1 expansion
    - Much larger, public, diversified, and financially disclosed
  - - Teladoc
    - Public broad telehealth platform
    - ~$1.45B market cap; ~0.69x EV/Sales
    - Shows public market discount when telehealth loses scarcity and margin confidence
    - Less tied to GLP-1 and women-specific care
  - - American Well
    - Public virtual-care infrastructure
    - ~$0.14B market cap; negative EV; heavy skepticism
    - Downside reminder for telehealth assets without strong growth or economics support
    - Different model and much weaker growth narrative
  - - Flo Health
    - Private women’s-health platform
    - '>$1B private valuation after $200M+ Series C'
    - Useful femtech proof that consumer women’s-health can become a unicorn
    - Scale markers are far larger than SheMed’s disclosed public data
  - - Maven Clinic
    - Private women’s / family virtual clinic
    - ~$1.7B valuation in 2024 funding round
    - Useful proof that clinical women’s-health platforms can justify premium value
    - B2B and benefits model differs materially from self-pay GLP-1 care
  notes: Comps are used for framing, not mechanical mark-to-market valuation.
