- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Active paid-membership quality disappoints
    - Retention, continuation, or repeat-purchase data is materially weaker than narrative implies
    - Breaks the assumption that growth is durable and efficient
    - Re-rate valuation below last round
  - - Gross-margin or support-cost profile is unattractive
    - High-touch service burden prevents attractive unit economics
    - Undercuts premium-multiple logic
    - Treat SheMed as a costly clinic rather than a scalable platform
  - - Regulatory or safety issue emerges
    - Visible sanction, complaint cluster, or clinical failure
    - Damages conversion, brand, and financing confidence
    - Pause underwriting
  - - Cap-table terms are investor-protective in ways the headline valuation hides
    - Preferences or structure make common-equity upside less attractive
    - Headline valuation ceases to be economically comparable
    - Demand full terms before proceeding
  - - NHS access improves faster than private differentiation
    - Urgency-led private wedge narrows materially
    - Growth story loses scarcity and pricing power
    - Lower growth assumptions and multiple support
  notes: Triggers are designed to convert abstract valuation skepticism into monitorable diligence tests.
