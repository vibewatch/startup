- id: decision-implication
  title: Decision implication
  body: 'On the evidence available today, SheMed looks strategically interesting but not yet safely underwritable at a premium to the last round. The recommendation is therefore research-more with medium confidence and a stretched valuation stance. A disciplined investor could still engage if access were at or below the last round and if diligence quickly produced evidence on paying-member quality, continuation, margin structure, complaint load, regulatory posture, and liquidation preferences. Without that, the current public record is too thin for a buy call, because almost every path to upside depends on data the company has not disclosed. The actionable framing is simple: treat $1 billion as a hypothesis that requires proof, not as a fact that ends the analysis.'
