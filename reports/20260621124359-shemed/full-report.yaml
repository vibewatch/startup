            body: >-
              The public record is richer on price than on margin, so the right way to analyze SheMed is with proxies
              rather than pretending to know SaaS-style metrics. SheMed competes in a market where Numan, Juniper,
              Boots, ZAVA, and Simple Online Pharmacy all show visible entry-price anchors or broad medication menus.
              That tells us pricing power is constrained externally. At the same time, SheMed carries more obvious
              service-delivery cost than a pure pharmacy transaction because it includes blood-test logistics, clinician
              review, app support, and side-effect care. That can be good if those layers improve retention or
              willingness to pay; it is bad if they simply raise COGS while the market keeps anchoring on cheap
              first-month offers. Cross-sell is another important proxy gap. Public materials for Numan and Hims show
              broader health-platform ambition, while SheMed's visible monetization remains concentrated around
              women-focused weight-loss care. That likely makes acquisition efficiency more dependent on one category
