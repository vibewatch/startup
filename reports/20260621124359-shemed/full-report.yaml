      - number: '1.4'
        title: What the public record still cannot prove
        blocks:
          - type: paragraph
            body: >-
              Despite strong confirmation that SheMed is real, active, and clinically differentiated, the public record
              is still thin where investors usually need the most precision. No fetched source discloses the Series A
              investor list, exact ownership stakes, board composition, revenue, margin structure, cohort retention, or
              unit economics. The company’s regulatory disclosures are also indirect: rather than a standalone SheMed
              clinical-registration page, official materials point to partner infrastructure through eMed and emphasize
              compliant clinicians plus pharmacy registration. This may be operationally normal for an early telehealth
              startup, but it does mean the diligence file is much stronger on care design than on governance plumbing.
              The broader UK environment cuts both ways. On one hand, NHS obesity-drug rollout remains
              capacity-constrained, preserving demand for private providers. On the other, GPhC, BMJ-covered regulatory
              changes, and MHRA/ASA enforcement all show rising pressure on online weight-loss prescribing and
              advertising. The bottom-line overview is therefore that SheMed looks operationally credible and
              thematically well-timed, yet still under-disclosed on the financial and governance dimensions that
              determine whether a unicorn valuation is durable.
