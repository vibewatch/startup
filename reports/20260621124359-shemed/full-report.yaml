      - - Funding sufficiency gap
        - Only 9 of 42 ICBs reported enough funding to cover at least 70% of eligible patients
        - September 2025
        - Eligibility does not equal funded treatment capacity
        - Private conversion depends on budget-constrained NHS leakage
      - - Persistent postcode lottery
        - Eight of 42 ICBs still had not started providing tirzepatide by early 2026
        - January 2026
        - Rollout friction persisted well after launch
        - Demand wedge may last longer than optimistic public guidance suggests
      - - Operational friction at practices
        - GPs reported patient demand arriving before local pathways and wraparound support were ready
        - June 2025
        - Operational readiness, not just guidance, controls real access
        - High-touch providers can position against chaos but must absorb support load
      - - Long rollout horizon
        - NHS says the full eligible population may take up to 12 years to reach
        - 2025-2026 guidance
        - The market will stay phased rather than instantly universal
        - Supports a durable but regulation-bound private market window
