            - label: Advertising breach or safety concern
              tone: negative
        - label: Low Likelihood
          values:
            - label: n/a
              tone: neutral
            - label: Minor public backlash
              tone: warning
            - label: Privacy governance gap surfaces
              tone: warning
            - label: Sensitive-data breach
              tone: negative
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Regulatory, support, and dependency failures propagate quickly into churn, complaint volume, financing pressure,
      and valuation support.
    approximationNotes: Transmission paths are analytical links inferred from retained evidence rather than measured causal coefficients.
    claimRefs:
      - CR006
      - CR011
      - CR014
      - CR016
      - CR017
      - CR019
      - CR024
      - CR025
      - CR035
      - CR039
    data:
      nodes:
        - id: r1
          label: Regulatory breach
          detail: Advertising, prescribing, or supply failure surfaces
        - id: r2
          label: Support breakdown
          detail: Medication questions and escalations go unresolved
        - id: r3
          label: Diagnostics / fulfilment delay
          detail: Kit, lab, or delivery problems slow care
        - id: r4
          label: Customer trust weakens
          detail: Complaints rise and recommendation intent falls
        - id: r5
          label: Early churn rises
          detail: Users stop before durable economics appear
        - id: r6
          label: Revenue quality weakens
          detail: Repeat usage and support efficiency deteriorate
        - id: r7
