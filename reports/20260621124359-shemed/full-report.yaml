  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and the user job
        blocks:
          - type: paragraph
            body: >-
              SheMed is selling a clinically guided obesity-treatment workflow for women, not just a prescription
              checkout page. Across the .co.uk and .com surfaces, the consistent core is: the patient completes a
              medical profile, receives an at-home no-needle blood collection kit, gets clinician review based on
              biomarkers and history, then receives branded GLP-1 medication with ongoing app-based check-ins and
              support. That product definition matters because the user job is not “buy a pen online”; it is “start and
              stay on treatment safely, with more women-specific context than generic telepharmacy offers.” Public pages
              also show that SheMed is trying to make safety and personalization part of the product itself. The blood
              test is presented as prerequisite screening, not an optional add-on, and weekly check-ins turn the app
              into an operating layer for adherence rather than just a marketing shell. This matters operationally too.
