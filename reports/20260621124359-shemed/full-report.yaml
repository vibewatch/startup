      - number: '6.4'
        title: Expansion logic and concentration risk
        blocks:
          - type: paragraph
            body: >-
              For a consumer telehealth company like SheMed, concentration risk is less about one enterprise account and
              more about one segment-channel combination. The company appears most exposed to affluent, self-paying
              women who are motivated to start treatment quickly and value medically guided support. That segment can be
              powerful, but it is also vulnerable to price pressure, changing NHS access, and dissatisfaction if
              promised support feels weaker than advertised. Expansion paths do exist: switchers from other providers,
              maintenance programmes, oral options, and broader women's-health adjacency. Yet all of those paths still
              sit inside the same general self-pay funnel. The main expansion question is therefore whether SheMed can
              turn today's strong category interest and review momentum into durable repeat usage without
              over-concentrating on one demographic and one acquisition story. That is why cohort composition matters as
              much as total review volume. A high-growth self-pay funnel can still be fragile if too much demand is
              urgency-driven or highly price elastic. Segment fit remains decisive.
