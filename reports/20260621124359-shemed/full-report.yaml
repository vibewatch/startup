      - number: '2.2'
        title: Evidence-constrained sizing and NHS access bottlenecks
        blocks:
          - type: paragraph
            body: >-
              The broad need base is large, but the serviceable market is shaped by access constraints rather than raw
              prevalence alone. NHS England and NICE point to roughly 3.4 million clinically eligible adults for
              tirzepatide, yet the system is only prioritising about 220,000 patients in the first three years of a
              12-year rollout. That gap between clinical eligibility and funded near-term access is the single most
              important market fact for SheMed. Population prevalence adds context: the 2024 Health Survey for England
              found 30% of adults living with obesity and 66% overweight or living with obesity, with prevalence peaking
              in later middle age. Those numbers show why the top-of-funnel is enormous, but they do not translate
              directly into monetisable demand because public eligibility is much narrower and actual rollout has been
              slower than the policy headline suggests. BMJ and Pulse reporting show that commissioning readiness, local
              funding, and wraparound-service design are still limiting real NHS availability. For a private provider,
              the market is therefore not “all adults with obesity”; it is the subset who are clinically motivated, can
              pay, and encounter friction or delay in the public pathway.
