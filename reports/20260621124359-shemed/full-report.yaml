      - number: '3.2'
        title: Capability, pricing, and support comparison
        blocks:
          - type: paragraph
            body: >-
              Public pages show that most competitors sell the same core molecules—Wegovy, Mounjaro, or adjacent obesity
              medicines—so the fight is less about proprietary therapy and more about what surrounds the prescription.
              SheMed emphasizes women-specific clinical support, milestone blood tests, side-effect help, and app-based
              tracking. Numan highlights clinician review plus a dedicated health coach. Juniper markets 1:1 health
              coaching, behavioural change tooling, and women-first branding. Second Nature leans hardest into behaviour
              change, nutrition, and institutional trust through NHS and Vitality relationships. Boots, ZAVA, and Simple
              Online Pharmacy present broader catalogue breadth and simpler pharmacy access. Pricing is also varied and
              somewhat noisy: SheMed advertises introductory prices from £59, Numan from £57.20, Juniper from £64, Boots
              lists £79.97 at 0.25mg, and ZAVA advertises prices from £99. That range matters, but independent guides
              suggest headline entry prices are only part of the picture because support layers, dose progression, and
              contract terms change the steady-state economics.
