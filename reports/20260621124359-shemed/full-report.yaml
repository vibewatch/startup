      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              SheMed's operational risk is inseparable from its product design. The same workflow that improves
              safety—blood testing, clinician review, medication fulfilment, weekly support—also creates more points of
              failure. Sample logistics can break, lab turnaround can slow, medication supply can wobble, and support
              escalations can get stuck between customer service and clinicians. Review evidence already hints at this
              operational fragility: while many users praise onboarding and support, some complain about unclear
              clinical answers, delayed or missing delivery, and medication or subscription-management issues.
              Category-wide evidence makes those problems more important, not less. If cost and side effects are already
              major reasons people discontinue GLP-1 treatment, then weak support or operational inconsistency can
              amplify churn and regulatory exposure at the same time. Security and privacy risk are similarly central
              because SheMed handles highly sensitive health, biomarker, and treatment data in a women-focused context.
              Public materials show intent, but they do not publicly document the depth of SheMed's security controls,
              incident history, or privacy governance.
