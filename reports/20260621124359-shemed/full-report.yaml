      - number: '8.2'
        title: Public comp context
        blocks:
          - type: paragraph
            body: >-
              The public-market analogue that matters most is Hims & Hers, because it combines telehealth, recurring
              consumer healthcare, diagnostics expansion, and aggressive weight-management ambition. But Hims is also
              useful precisely because it shows how much proof the market demands before paying premium multiples. By
              mid-2026 Hims had billions in revenue, millions of subscribers, positive adjusted EBITDA, and a public
              market cap around $8 billion; even then its revenue multiple remained in the low-to-mid single digits, not
              a venture-style fantasy number. Broader telehealth comps such as Teladoc and Amwell trade far lower,
              reflecting how quickly public markets discount growth stories once profitability, retention, or category
              confidence come into question. Private women’s-health winners like Flo and Maven prove that billion-dollar
              outcomes are possible, but both had clearer scale markers than SheMed: Flo disclosed nearly 70 million
              MAUs, almost 5 million paid subscribers, and more than $200 million of expected 2024 gross bookings, while
              Maven paired a $1.7 billion valuation with 2,000 clients, 175 countries, and published ROI claims. The
              implication is not that SheMed cannot justify a premium; it is that a $1 billion mark already asks
              investors to underwrite forward proof rather than just current disclosure.
