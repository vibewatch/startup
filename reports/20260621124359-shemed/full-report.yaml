      - number: '3.3'
        title: Distribution power, switching, and channel risk
        blocks:
          - type: paragraph
            body: >-
              Channel structure is one of the clearest competitive differences. Boots, ZAVA, and Simple Online Pharmacy
              already operate broad online-pharmacy or online-doctor storefronts, which may lower customer-acquisition
              cost via existing traffic and cross-sell. Oviva and Second Nature have a different advantage: payer and
              institutional access that can bypass a pure direct-to-consumer fight when patients are eligible for NHS-
              or insurer-linked support. SheMed's switch page shows that management is actively targeting dissatisfied
              GLP-1 users, which also reveals an industry reality: switching costs are probably moderate at best.
              Providers sell the same branded drugs, and moving platforms is easier if a patient can transfer
              prescription history, dose status, and monitoring records. That means lock-in likely sits in trust,
              coaching relationships, convenience, and clinical confidence rather than in product exclusivity. For
              SheMed, the strongest channel wedge today is not unique access to medication, but a more intensive
              female-specific care path for users who feel underserved by generic pharmacy or male-skewed telehealth
              brands.
