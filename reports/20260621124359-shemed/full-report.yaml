    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Decision flow linking SheMed’s strong category narrative and differentiation to missing economics and
      price-discipline rules, ending in a research-more call.
    approximationNotes: The flow emphasizes the evidence required to move the recommendation rather than every possible diligence branch.
    claimRefs:
