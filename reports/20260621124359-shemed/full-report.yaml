      - number: '2.4'
        title: Growth drivers, constraints, and what the market means for SheMed
        blocks:
          - type: paragraph
            body: >-
              The category has powerful adoption drivers, but nearly all of them come paired with a structural
              constraint. Clinical efficacy, social awareness, and NHS under-capacity all drive consumers toward private
              GLP-1 providers. The Health Foundation’s private-prescribing analysis shows where that demand is surfacing
              first: women in mid-life, especially in more affluent areas, often before equivalent public access exists.
              Yet those same patterns expose the core risks. Access is not equitable, regulatory friction is increasing,
              and providers cannot market these medicines like ordinary consumer subscriptions. GPhC safeguards now make
              questionnaire-only models less defensible, while the joint enforcement notice with ASA and MHRA narrows
              how companies can advertise prescription weight-loss medicines. That is good for a provider built around
              higher-friction clinical processes, but it also raises acquisition costs and increases operational
              dependence on compliant prescribing and support infrastructure. The market is therefore attractive for
              differentiated providers, but only if they can convert constrained public demand into trusted private care
              without drifting into the low-compliance tactics regulators are actively targeting.
