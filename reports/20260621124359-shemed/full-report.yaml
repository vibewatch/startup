companyProfile:
  summary: >-
    SheMed is a London-based women’s GLP-1 telehealth company founded by Olivia and Chloe Ferro in April 2024. The
    company positions itself around a blood-test-first, women-specific metabolic-care workflow that combines at-home
    diagnostics, clinician review, branded medication access, and ongoing subscription support. Public funding coverage
    shows the company reached a reported $1 billion valuation unusually quickly, but the public record remains much
    stronger on demand narrative and care design than on standalone financial disclosure or cap-table transparency.
