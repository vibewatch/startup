      - number: '7.3'
        title: Dependency, people, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The highest-signal dependency risks sit in diagnostics, clinicians, medicines, and segment concentration.
              Tasso is the clearest public partner in the diagnostic layer, which means SheMed relies on outside
              hardware, logistics, and sample quality to maintain its differentiated screening model. Branded GLP-1
              supply, while attractive from a trust perspective, also creates upstream dependence on a broader market
              where shortages, switching, and safety scrutiny remain active issues. Human execution risk is just as
              important. Review complaints suggesting confusion about who can answer medication questions imply that
              clinical support design and escalation quality matter as much as the front-end app. The customer base
              itself is also a dependency. SheMed appears concentrated around women willing to self-pay for speed,
              reassurance, and support; if NHS access broadens, price sensitivity rises, or support quality disappoints,
              that same concentration could compress growth. These are not theoretical risks. They are monitorable
              operating dependencies that flow directly into revenue quality, complaint load, and future financing
              confidence.
