      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Why this is not an avoid call
            body: >-
              SheMed has a plausible path to a premium outcome because the category is large, underserved for women, and
              amenable to recurring digital engagement if clinical trust and retention are real.
            calloutType: strength
            claimRefs:
              - CV003
