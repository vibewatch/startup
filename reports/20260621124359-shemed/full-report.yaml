  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and category risk
        blocks:
          - type: paragraph
            body: >-
              Private GLP-1 telehealth in the UK is now operating under much tighter scrutiny than generic e-commerce or
              wellness subscriptions. GPhC patient guidance, professional weight-management rules, MHRA safety guidance,
              and ASA enforcement all point in the same direction: providers must verify identity and suitability
              carefully, avoid casual or questionnaire-only supply patterns, and stay well inside prescription-drug
              advertising boundaries. That environment creates a double-edged risk for SheMed. On one hand, a
              blood-test-first workflow and clinician review should fit better than lower-friction competitors with
              weaker clinical safeguards. On the other hand, the cost of compliance is high and any visible lapse could
              cause outsized reputational damage because the category is already associated with fake medicines,
              black-market supply, and public concern about inappropriate prescribing. Legal exposure also extends
              beyond prescribing itself. Remote-health providers handling special-category health data and
              distance-sales relationships can face privacy, consent, and consumer-rights risk if support, cancellation,
              or data practices do not match what users reasonably expect.
