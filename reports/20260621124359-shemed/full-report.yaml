  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal footprint, and founding context
        blocks:
          - type: paragraph
            body: >-
              SheMed’s public identity has two layers that matter for diligence. The operating brand presents itself as
              a female-founded women’s health platform launched in April 2024, while Companies House shows the current
              legal entity, SHEMED LIMITED, was incorporated on 29 November 2024 as an active private limited company in
              London under SIC 86900. That means the brand narrative predates the currently visible company registration
              and should be read as evidence of pre-incorporation venture activity rather than a contradiction. Official
              pages and financing coverage consistently name sisters Olivia Ferro and Chloe Ferro as founders, with
              Olivia as chief executive and Chloe as president. The service description is also consistent across
              company and third-party sources: SheMed sells a direct-to-consumer, clinician-led weight-management
              programme for women built around GLP-1 medication, digital support, and home testing. For later chapters,
              the most reusable ground truth is therefore not just that SheMed is a women’s health startup, but that it
              is specifically a regulated private-care subscription model sitting at the intersection of obesity
              treatment, telehealth, diagnostics, and consumer acquisition.
