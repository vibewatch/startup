      - number: '2.3'
        title: Buyer, payer, and women-specific demand segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer and payer in SheMed’s current model are usually the same person: an adult woman paying privately
              for clinician-led obesity treatment. The user, however, is more heterogeneous than a generic “weight-loss
              customer.” Public and private evidence indicate especially strong demand from women aged 30 to 49, from
              women whose NHS access is delayed, and from women experiencing metabolic complexity that makes generic
              diet advice feel insufficient. PCOS is particularly relevant because NHS and NIHR sources frame it as both
              common and metabolically important: about one in ten women are affected, insulin resistance is a central
              mechanism, and evidence on the best long-term weight-management approach remains incomplete. The
              women’s-health angle is therefore not just brand language. It corresponds to a real segmentation logic in
              which hormonal context, reproductive goals, cardiovascular risk, and dissatisfaction with
              one-size-fits-all online prescribing all influence willingness to pay. SheMed’s positioning is strongest
              where buyers believe standard pathways are either too slow, too generic, or too poorly tailored to women’s
              biology.
