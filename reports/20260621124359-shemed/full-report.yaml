  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              SheMed should not be analysed against the entire obesity economy because the company sells a much narrower
              product: a private, women-focused GLP-1 care pathway that combines diagnostics, prescribing, behavioural
              support, and ongoing monitoring. The relevant included spend is therefore paid obesity treatment where a
              patient is buying clinician-led access, medication management, and support services, whether through
              NHS-commissioned pathways or private programmes. Excluded spend includes generic wellness apps, broad
              supplements, bariatric surgery budgets, and undifferentiated primary care activity that is not converted
              into an obesity-treatment pathway. This matters because a narrow category produces a more realistic
              competitive set and avoids inflating SheMed’s addressable market with population health activity it cannot
              capture. Official NHS and NICE materials also reinforce that obesity medication is not a standalone retail
              SKU; it belongs inside a structured weight-management pathway with diet, activity, and follow-up support.
              That architecture makes the true market boundary closer to clinician-led metabolic care than to consumer
              wellness.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM033
