            body: >-
              The public architecture looks like a service workflow stitched across several operational layers. SheMed
              owns patient intake, clinical framing, app- or portal-based engagement, and the branded women's-health
              narrative. Tasso is the clearest disclosed external dependency inside the workflow. Its press materials
              and solutions pages show that the Tasso+ device sits at the sample-collection edge, while Tasso Connect
