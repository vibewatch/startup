            body: >-
              The public record is much weaker on durable customer economics than on acquisition and sentiment. SheMed
              clearly has satisfaction signals—thousands of public reviews, strong top mentions around service and app
              experience, and repeated praise for feeling medically supervised rather than left alone. But retention
              proof is missing. No public NRR, GRR, churn, renewal, or month-by-month continuation cohort exists.
              Broader category evidence suggests why that matters. Worldpanel and other sources show cost and side
              effects are two leading reasons people stop GLP-1 treatment, which means every private provider faces a
              durability test after the first wave of enthusiasm. For SheMed, the best provisional interpretation is
              that customer satisfaction looks good enough to support growth, but long-term repeat economics are still
              inferred from workflow quality rather than demonstrated by disclosed cohorts. Investors therefore need to
              separate acquisition proof from repeat-usage proof very explicitly. That missing durability evidence is
              the biggest customer-level diligence gap today.
