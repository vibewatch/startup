  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Supportable-value guardrails derived from public evidence rather than from an asserted internal model.
    approximationNotes: >-
      Ranges are heuristic supportability bands meant to show whether the last round looks cheap, fair, or rich under
      different evidence assumptions.
    claimRefs:
      - CV002
      - CV007
      - CV026
      - CV027
      - CV028
      - CV038
      - CV041
    data:
      items:
        - label: Bear supportability
          low: 500
          mid: 650
          high: 800
          detail: Looks more like an early, high-touch consumer telehealth operator with limited proof.
        - label: Base supportability
          low: 800
          mid: 950
          high: 1100
          detail: Narrative and member growth hold, but public proof still centers on the last round.
        - label: Bull supportability
          low: 1100
          mid: 1300
          high: 1500
          detail: Retention, margins, and women-specific metabolic platform expansion are all diligence-verified.
        - label: Public telehealth caution band
          low: 140
          mid: 1450
          high: 8200
          detail: Amwell, Teladoc, and Hims illustrate how far outcomes diverge once markets test proof and economics.
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scorecard for SheMed across market pull, differentiation, economics visibility, risk burden, and
      valuation transparency.
    approximationNotes: Scores are 0-10 heuristics derived from retained evidence and are intentionally judgmental rather than formulaic.
    claimRefs:
      - CV003
      - CV004
      - CV011
      - CV023
      - CV024
      - CV033
      - CV034
      - CV039
      - CV042
    data:
      items:
        - label: Market pull
          score: 8
          detail: Demand backdrop and NHS friction are clearly supportive.
        - label: Product differentiation
          score: 7
          detail: Blood-test-first and women-specific positioning are real but not yet outcome-proven.
        - label: Commercial proof
          score: 5
          detail: Member-growth signals exist, but revenue quality is undisclosed.
        - label: Economics visibility
          score: 2
          detail: No public CAC, retention, gross-margin, or payback bridge.
        - label: Regulatory risk burden
          score: 3.5
          detail: The category remains compliance-intensive and visibly scrutinized.
        - label: Valuation transparency
          score: 2.5
          detail: Headline valuation is public, but terms and supporting metrics are not.
        - label: Moat clarity
          score: 5.5
          detail: Workflow and brand may matter, but durability versus rivals is not yet proven.
        - label: Evidence quality
          score: 4.5
          detail: Strong narrative evidence, weaker underwriting evidence.
