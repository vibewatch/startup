  title: Financials
summary: Public evidence supports a recurring self-pay telehealth revenue model with aggressive introductory pricing and a recent $50 million financing, but almost every underwriting-critical number remains undisclosed. SheMed may be building meaningful annual billings if member and price claims overlap with active paying cohorts, yet revenue quality, contribution margin, CAC, and runway are still proxy-based rather than public facts.
sections:
- id: revenue-model-and-list-pricing
  title: Revenue model, list pricing, and what is actually monetized
  body: SheMed appears to monetize primarily through an all-in private weight-loss programme rather than through à la carte dispensing. Official pages repeatedly bundle medication access with blood testing, clinical review, app support, delivery, and side-effect care. That matters financially because the customer is not buying a simple weekly pen; she is buying a managed programme whose realized economics depend on onboarding, titration, refill continuation, and maintenance. Public pricing is clear enough to establish list-price structure but not realized revenue. The current SheMed site and pricing pages advertise introductory offers from £59, then much higher ongoing price points, while FAQs and third-party price coverage confirm that discounts and plan length matter. In other words, the visible top line is subscription-like and recurring, but the real monetization question is how many members convert from discounted entry into higher-value monthly persistence. That makes monthly persistence,
    not initial sign-up volume alone, the real financial fulcrum.
  claimRefs:
