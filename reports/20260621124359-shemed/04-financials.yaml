- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Recognized revenue per active paying member
    - 'null'
    - Low
    - Core top-line quality cannot be inferred from list prices alone
    - Provide monthly realized ASP by dose, plan term, and payment cohort
  - - Medication procurement cost
    - 'null'
    - Low
    - Drug cost likely dominates margin swing versus pure software models
    - Disclose branded medicine procurement terms, rebates, and stockout exposure
  - - Blood-test logistics cost
    - 'null'
    - Low
    - SheMed's monitoring wedge may raise onboarding COGS
    - Provide per-kit landed cost, failure rate, and repeat-test rate
  - - Clinical review / support cost
    - 'null'
    - Low
    - Clinician time and side-effect management determine service margin
    - Disclose clinician staffing ratio, consult minutes, and support cost per member
  - - CAC / paid acquisition cost
    - 'null'
    - Low
    - Discounted first-month pricing may only work if CAC payback is fast
    - Provide channel-by-channel CAC and payback by cohort
  - - Retention / refill continuation
    - 'null'
    - Low
    - Recurring economics depend on titration completion and maintenance persistence
    - Disclose month-1 to month-6 retention, refill rate, and dose-step completion
  - - Contribution margin after first 90 days
    - 'null'
    - Low
    - This is the clearest test of whether SheMed is a durable subscription business or a subsidized acquisition funnel
    - Provide cohort contribution by 30/90/180 days
  notes: 'Every null field is intentional: the public record is insufficient, so the diligence path is the real output of the table.'
