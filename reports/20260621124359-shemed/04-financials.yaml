- id: TI002
  title: Pricing / monetization table
  columns:
  - Provider / source
  - Price / unit / contract
  - List vs realized pricing
  - Discounts / unknowns
  - Source-backed implication
  rows:
  - - SheMed official
    - From £59 introductory; later pages show from £139 and dose tiers above that
    - List pricing only
    - Realized ASP depends on dose, term, and persistence
    - Price is explicit enough for comparison but not for revenue modeling
  - - SheMed third-party coverage
    - PharmacyUK articles cite first month at £79 and later months at £139 or £159 depending on timing/page
    - Still list or reported pricing, not realized revenue
    - Shows pricing has changed over time
    - Pricing is a live competitive lever rather than a fixed contract
  - - Numan
    - From £57.20 first month
    - List pricing
    - Dose mix and realized retention unknown
    - Low entry pricing shows SheMed is not alone in using discounted acquisition
  - - Juniper
    - Prices starting £64
    - List pricing
    - Dose-path economics not public on retained page
    - Women-focused competitors also use aggressive entry pricing
  - - Boots Online Doctor
    - £79.97 monthly at 0.25mg on retained page
    - List pricing
    - Higher doses and steady-state economics vary over time
    - Retail trust does not prevent direct price competition
  - - ZAVA
    - Prices from £99
    - List pricing
    - Support depth and net price path unclear
    - Generalist online doctors can anchor the category on convenience pricing
  - - Simple Online Pharmacy
    - Catalogue-led pricing visible by product rather than one all-in programme
    - List pricing
    - True support-inclusive economics are unclear
    - SheMed must justify bundled pricing against broad pharmacy substitutes
  notes: The comparison deliberately separates visible list pricing from realized monetization, which remains undisclosed across most private players.
