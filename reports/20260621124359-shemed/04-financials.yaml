- id: TI004
  title: Capital adequacy table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Cash on hand
    - Undisclosed publicly
    - Low
    - Without cash balance, runway cannot be estimated
    - Provide latest unrestricted cash and post-round ending balance
  - - Monthly burn
    - Undisclosed publicly
    - Low
    - Burn determines how long the 2025 round can support high-touch growth
    - Provide trailing 6-12 month net cash burn
  - - Runway months
    - Undisclosed publicly
    - Low
    - Runway is central to next-round timing and negotiating leverage
    - Provide management runway under base and downside plans
  - - Latest equity financing
    - $50 million Series A at $1 billion valuation in October 2025
    - High
    - Confirms fresh capital and investor support
    - Provide exact cash-in, secondary component if any, and closing costs
  - - Planned use of funds
    - Scale personalised women's health services / accelerate growth
    - Medium
    - Use of funds determines whether round supports marketing, supply, product, or team build
    - Provide budget split across hiring, acquisition, product, supply, and compliance
  - - Debt / project-finance obligations
    - No public debt schedule found in retained sources
    - Low
    - Hidden fixed obligations could materially change risk
    - Provide full debt, lease, and other fixed-obligation schedule
  notes: The retained source set proves that capital was raised, but not whether that capital is sufficient.
  claimRefs:
  - CI012
  - CI014
  - CI028
  - CI029
  - CI041
- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Recognized revenue / ARR / revenue mix
    - Blocks any credible top-line model and hides whether revenue is mostly onboarding or durable continuation
    - Request monthly recognized revenue split by new starts, ongoing members, maintenance, and any adjacencies
  - - Realized ASP and discount schedule
    - Prevents translation of visible list pricing into real economics
    - Provide realized ASP by cohort, plan term, dose, and channel
  - - Gross margin / contribution margin
    - Without COGS there is no way to test whether bundled support is economically accretive
    - Request gross-margin bridge including drug cost, testing, clinical labor, fulfilment, and support
  - - CAC / payback by channel
    - Discounted entry pricing could hide uneconomic acquisition
    - Provide paid and organic CAC, blended CAC, and payback curves by channel
  - - Retention / refill / churn
    - Recurring business quality depends on members staying through titration and maintenance
    - Provide retention, refill, discontinuation, and early-cancel rates by cohort
  - - Cash, burn, and runway
    - No investor can underwrite funding dependency without liquidity visibility
    - Provide latest cash balance, monthly burn, and management runway
  - - Medication procurement and supply terms
    - Drug availability and gross margin are inseparable in GLP-1 telehealth
    - Provide wholesaler / manufacturer terms, inventory days, stockout history, and substitution policy
  notes: The open-source record is good enough to describe the commercial shape of the business, but not good enough to underwrite it.
  claimRefs:
  - CI014
  - CI020
  - CI030
  - CI038
  - CI041
