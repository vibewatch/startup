- id: traction-funding-and-capital-adequacy
  title: Public traction, funding, and capital adequacy
  body: 'The best public traction signals are still company- or round-linked, not financial statements. SheMed''s current site says 100,000+ women or members, while funding coverage around the October 2025 Series A said the company had more than 60,000 members when it raised $50 million at a $1 billion valuation. Those numbers imply meaningful demand, but they do not establish active paying subscriber counts, recognized revenue, or retention. The funding itself is real enough to matter: multiple sources corroborate the round and its headline valuation, and management frames the proceeds as fuel for scaling personalised women''s health services. What investors still cannot do is bridge from round size to runway. No public balance-sheet cash figure, monthly burn, or debt schedule is disclosed in the retained source set. So capital adequacy is only partially visible: there was a large recent equity injection, but there is no public way to know how quickly high-touch growth is consuming it.'
  claimRefs:
  - CI012
  - CI013
  - CI014
  - CI015
  - CI028
