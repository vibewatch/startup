- id: public-comps-and-financial-verdict
  title: Public comps and financial verdict
  body: 'Hims & Hers is useful here not because it is a clean peer, but because it shows what real telehealth disclosure looks like. The company has an investor-relations site, live stock pages, direct 10-Q and 10-K filings, and a Q1 2026 release showing roughly $608 million of quarterly revenue, nearly 2.6 million subscribers, and updated full-year guidance of $2.8 billion to $3.0 billion. SheMed has nothing close to that disclosure standard. As a result, the financial verdict is mixed. The visible model is commercially plausible: recurring list pricing, a clear self-pay wedge, and enough capital to support near-term expansion. But public evidence still does not let an investor test revenue quality, margin path, CAC payback, churn, or true runway. The company therefore screens as financially interesting but still heavily diligence-blocked. Investors still need raw cohort data before underwriting confidently.'
  claimRefs:
  - CI016
  - CI017
