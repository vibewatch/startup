- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Core monthly programme
    - Self-pay recurring subscription around GLP-1 treatment plus support
    - £ per member per month
    - Visible and active on official pages
    - 'Medium: mechanism is public, realized revenue is not'
    - Request active paying members, recognized revenue, and refill continuation by cohort
  - - Introductory acquisition offer
    - Discounted first-month entry price to lower trial friction
    - £ first order
    - Publicly visible from £59 / £79 depending on page and timing
    - 'Low-to-medium: clear marketing tool, not realized economics'
    - Request conversion from intro plan into months 2-6 paying cohorts
  - - Longer-term commitment plans
    - 3-, 6-, and 12-month programme structures with lower monthly headline pricing
    - £ per member per month
    - Publicly visible in FAQs and treatment pages
    - Medium
    - Request realized mix by contract term and early termination rate
  - - Maintenance / continuation
    - Ongoing lower-dose or continued care after onboarding
    - £ per member per month
    - Implied by pricing architecture and ongoing support messaging
    - Low-to-medium
    - Request maintenance retention, dose mix, and duration distribution
  - - Switcher acquisition
    - Customers transferring from other GLP-1 providers into SheMed
    - members / month
    - Visible GTM tactic on switch page; revenue contribution unknown
    - Low
    - Request share of new starts from switchers and conversion vs cold acquisition
  - - Adjacency / data / study upside
    - Clinical-study and women's-health positioning may improve brand and future monetization, but no separate stream is public
    - n/a
    - Unproven
    - Low
    - Clarify whether diagnostics, data partnerships, or adjacent services generate revenue or only CAC support
  notes: Public sources support a recurring programme model, not a clean service-line mix. Quality therefore refers to visibility of mechanism, not certainty of scale.
