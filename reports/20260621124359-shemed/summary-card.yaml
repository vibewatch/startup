  topStrengths:
    - >-
      Women-specific metabolic-care positioning sits in a category with obvious demand and persistent NHS access
      friction.
    - >-
      Blood-test-first onboarding, clinician review, and support-led workflow provide a clearer trust and safety
      narrative than lower-friction online prescribing models.
    - >-
      Public evidence confirms unusually fast early traction, including 60,000+ members by the funding event and a
      current 100,000+ community claim.
    - >-
      The Tasso-enabled diagnostics layer gives SheMed a differentiated screening and personalization story rather than
      a pure medication-reselling narrative.
  topRisks:
    - >-
      Public revenue, active paying-member counts, cohort retention, CAC, and gross margin are still undisclosed, making
      valuation confidence materially lower than the narrative strength.
    - >-
      The $1 billion last-round mark already places SheMed closer to premium digital-health outcomes than to a typical
      early-stage telehealth asset.
    - >-
      GLP-1 telehealth in the UK is under increasing regulatory and advertising scrutiny, raising execution and
      compliance burden.
    - >-
      Support, diagnostics, fulfillment, and clinician-escalation quality are critical to the model, but operating SLA
      and incident data are not public.
    - Investor identity, preference stack, and detailed cap-table terms remain undisclosed despite the unicorn headline.
  unresolvedGaps:
    - Active paying-member base, continuation by medication, and cohort retention curves.
    - Revenue, contribution margin, gross-margin bridge, CAC, and payback period.
    - Series A cap table, liquidation preferences, and investor rights.
    - Support-quality dashboard including complaint rates, escalation times, and adverse-event governance.
    - >-
      Evidence that blood-test-first personalization improves outcomes, retention, or monetization versus simpler
      telehealth flows.
