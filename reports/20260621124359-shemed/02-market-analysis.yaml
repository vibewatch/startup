callouts:
- calloutType: strength
  title: Why the category is real right now
  body: Public evidence supports a large obesity need base, a much smaller near-term NHS access cohort, and a private-prescribing pattern heavily concentrated among women in mid-life — exactly the kind of demand wedge a company like SheMed is trying to capture.
  claimRefs:
  - CM005
  - CM006
  - CM017
  - CM018
  - CM019
  - CM041
- calloutType: risk
  title: Why this is not a frictionless consumer market
  body: The same category tailwinds that create demand also bring rationed NHS rollout, deprivation-driven inequality, prescribing safeguards, and strict advertising limits, so growth is likely to be regulation- and operations-bound rather than purely demand-bound.
  claimRefs:
  - CM020
  - CM021
  - CM025
  - CM027
  - CM030
  - CM032
  - CM043
