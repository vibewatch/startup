company:
  name: SheMed
chapter:
  number: 2
  title: Market Analysis
  summary: 'SheMed sits inside a large but highly filtered UK market: obesity prevalence and clinical GLP-1 eligibility are broad, yet funded NHS access remains narrow and uneven. The strongest current demand wedge is women-led private uptake during rollout friction, but the same category is constrained by affordability, regulation, and unresolved evidence on women-specific long-term adherence.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitutes
  body: 'SheMed should not be analysed against the entire obesity economy because the company sells a much narrower product: a private, women-focused GLP-1 care pathway that combines diagnostics, prescribing, behavioural support, and ongoing monitoring. The relevant included spend is therefore paid obesity treatment where a patient is buying clinician-led access, medication management, and support services, whether through NHS-commissioned pathways or private programmes. Excluded spend includes generic wellness apps, broad supplements, bariatric surgery budgets, and undifferentiated primary care activity that is not converted into an obesity-treatment pathway. This matters because a narrow category produces a more realistic competitive set and avoids inflating SheMed’s addressable market with population health activity it cannot capture. Official NHS and NICE materials also reinforce that obesity medication is not a standalone retail SKU; it belongs inside a structured weight-management
    pathway with diet, activity, and follow-up support. That architecture makes the true market boundary closer to clinician-led metabolic care than to consumer wellness.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM033
  tableRefs:
  - TM001
  figureRefs:
  - FM002
- id: size-access-and-phasing
  title: Evidence-constrained sizing and NHS access bottlenecks
  body: 'The broad need base is large, but the serviceable market is shaped by access constraints rather than raw prevalence alone. NHS England and NICE point to roughly 3.4 million clinically eligible adults for tirzepatide, yet the system is only prioritising about 220,000 patients in the first three years of a 12-year rollout. That gap between clinical eligibility and funded near-term access is the single most important market fact for SheMed. Population prevalence adds context: the 2024 Health Survey for England found 30% of adults living with obesity and 66% overweight or living with obesity, with prevalence peaking in later middle age. Those numbers show why the top-of-funnel is enormous, but they do not translate directly into monetisable demand because public eligibility is much narrower and actual rollout has been slower than the policy headline suggests. BMJ and Pulse reporting show that commissioning readiness, local funding, and wraparound-service design are still limiting real
    NHS availability. For a private provider, the market is therefore not “all adults with obesity”; it is the subset who are clinically motivated, can pay, and encounter friction or delay in the public pathway.'
