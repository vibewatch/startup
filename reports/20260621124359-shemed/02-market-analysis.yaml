tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Women-focused private GLP-1 programme
    - Diagnostics, clinician review, prescribing, medication management, behavioural support, follow-up monitoring
    - General wellness subscriptions without prescribing
    - Self-paying woman / household budget
    - Directly matches SheMed’s current offer
  - - Broad UK obesity-treatment market
    - NHS obesity pathways, specialist services, private obesity clinics, obesity pharmacotherapy
    - Public-health activity not tied to a treatment pathway
    - NHS commissioners or patients
    - Useful top-down context but too broad for underwriting SheMed
  - - Women-specific metabolic-care adjacency
    - PCOS-oriented care, hormonal-weight support, targeted diagnostics, women-specific education
    - General gynaecology not connected to weight or metabolic outcomes
    - Self-paying woman or NHS where available
    - Explains why SheMed markets around women rather than generic weight loss
  - - Status-quo substitutes
    - GP lifestyle advice, NHS tiered services, generic private online pharmacies, orlistat, waiting for NHS access
    - Bariatric surgery budgets unless escalated into obesity care
    - Patient or NHS
    - These are the practical alternatives against which conversion happens
  - - Retail / community channel expansion
    - Pharmacy- or community-based obesity pathways under new public pilots
    - Non-clinical OTC diet products
    - NHS/public commissioner and patient
    - Potential future route but not SheMed’s core model today
  notes: Included and excluded spend are defined from the perspective of what a clinician-led women-specific GLP-1 provider can plausibly capture, not from the perspective of all obesity-related spending in England.
