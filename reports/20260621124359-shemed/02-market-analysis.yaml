- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Large untreated need base
    - Positive demand driver
    - Current and structural
    - High prevalence means a deep top-of-funnel for obesity treatment
    - What share of clinically eligible women can SheMed actually convert?
  - - NHS phasing and local rollout delays
    - Positive for private demand / negative for public access
    - Current through at least 2028
    - Creates a waiting-room market for self-pay providers
    - How much demand comes from NHS-delay switchers versus never-NHS users?
  - - Women-specific metabolic positioning
    - Positive differentiation driver
    - Current
    - May improve resonance versus generic pharmacy funnels
    - What conversion uplift comes from PCOS or hormonal-health messaging?
  - - Deprivation and affordability gap
    - Negative equity constraint
    - Current
    - Need is higher in deprived groups but private uptake is lower
    - Can SheMed reach high-need groups without unsustainable CAC or price cuts?
  - - Prescribing and advertising regulation
    - 'Mixed: helps compliant players, hurts loose marketing'
    - Current and tightening
    - Raises acquisition friction but punishes low-safety competitors
    - Are SheMed’s workflows robust enough to benefit from tighter rules?
  - - Channel innovation via pharmacy/community pilots
    - Potential medium-term expansion driver
    - Emerging 2025-2026
    - Could broaden category access and change referral economics
    - Will public pilots create partnership opportunities or price pressure?
  - - Global supply and cost relief may be gradual
    - Mixed future driver
    - Emerging 2026 signal
    - Even if demand is strong, cheaper and broader GLP-1 access may arrive slowly rather than instantly
    - How fast could biosimilars, price relief, or supply expansion compress private pricing power?
  notes: 'Several drivers and constraints are double-edged: the same NHS friction that creates private demand can also invite heavier regulation and more public intervention over time.'
