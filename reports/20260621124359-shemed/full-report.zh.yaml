        title: 产品定义和用户任务
        blocks:
          - type: paragraph
            body: >-
              SheMed 销售的是面向女性、由临床指导的肥胖治疗流程，而不只是处方结账页。在 .co.uk 和 .com 页面上， 一致核心是：患者填写医疗档案，收到居家无针采血套件，临床医生基于生物标志物和病史审核，
              随后获得品牌 GLP-1 药物，并配套持续 app 签到和支持。这个产品定义很重要，因为用户任务不是“在线买一支笔”，
              而是“安全开始并坚持治疗，同时获得比通用远程药房更多的女性特异背景”。公开页面还显示，SheMed 试图把安全和个性化 做进产品本身。血液检测被呈现为前置筛查，而不是可选加购；每周签到也把 app
              变成依从性的运营层， 而不是营销外壳。这在运营上同样重要。
