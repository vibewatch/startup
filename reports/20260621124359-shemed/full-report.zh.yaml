              Nature 这类教练优先竞争对手， 可以攻击 SheMed 所称优势中的同一个依从性和信任问题。Oviva 这类 NHS 合作模式，则可在可负担性上对符合条件的患者 完全胜过私营平台。监管也在收紧品类：GPhC
              现在要求更强的在线开方保障，并重新强化体重管理处方药广告执法； 这抬高了运营门槛，但并不会独家保护 SheMed。净结果是，只有当其血液检测主导的女性健康模型能带来优于同行的留存、 结果或信任时，SheMed
