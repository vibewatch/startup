  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和品类风险
        blocks:
          - type: paragraph
            body: >-
              英国私营 GLP-1 远程医疗现在承受的审查，远比通用电商或健康订阅严格。GPhC 患者指引、专业体重管理规则、 MHRA 安全指引和 ASA
              执法都指向同一个方向：提供方必须仔细核验身份和适用性，避免随意或仅靠问卷供药的模式， 并严格待在处方药广告边界内。这个环境给 SheMed 带来双刃剑风险。一方面，先验血再治疗流程和临床医生审核，
              应该比临床保障更弱、摩擦更低的竞争对手更契合。另一方面，合规成本高，任何可见失误都可能造成超比例声誉损害， 因为这个品类已经与假药、黑市供应和公众对不当开方的担忧绑定在一起。法律暴露也不止开方本身。
              远程健康提供方处理特殊类别健康数据和远程销售关系时，如果支持、取消或数据实践不符合用户合理预期， 可能面临隐私、同意和消费者权益风险。
