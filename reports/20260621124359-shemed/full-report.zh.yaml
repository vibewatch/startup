              最好的公开牵引信号仍来自公司或融资轮，而不是财务报表。SheMed 当前网站称有 100,000+ 女性或会员； 2025 年 10 月 Series A 附近的融资报道则称，公司在以 $1 billion
              估值融资 $50 million 时已有超过 60,000 名会员。这些数字意味着有实质需求，但不能证明活跃付费订阅人数、确认收入或留存。融资本身足够真实，
              值得重视：多个来源相互印证了轮次和标题估值，管理层也把资金定义为扩展个性化女性健康服务的燃料。 投资人仍无法完成的，是从融资规模推导 runway。保留来源集合没有披露公开资产负债表现金数、月度 burn
