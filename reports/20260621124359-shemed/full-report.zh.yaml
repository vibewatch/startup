  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局和解决方案类别
        blocks:
          - type: paragraph
            body: >-
              SheMed 不是在和一组整齐的同类公司竞争。已抓取集合显示，英国减重护理中至少有四类活跃解决方案。第一类是 SheMed、Juniper 这类面向女性的远程医疗品牌，销售药物外加更贴合女性的支持叙事。第二类是
              Numan、 Second Nature 这类更宽的数字教练平台，把减重放进更大的健康或行为改变项目。第三类是 Oviva 以及另一种意义上的 Second Nature 这类 NHS
              合作路径，在用户符合条件时，可把用户导入纯自费需求之外的支持路径。第四类是 Boots、 ZAVA、Simple Online Pharmacy
              这类药房或在线医生运营商，它们靠品类宽度、便利性和可识别的零售信任竞争， 而不是狭窄的女性特异楔子。独立 2026 市场指南进一步证明，没有单一提供方以 Hims 式方式主导这个市场； 相反，相似的 GLP-1
              药物被包进不同的定价、支持、监测和渠道组合里。
