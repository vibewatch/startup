      - number: '6.2'
        title: 采用轨迹和客户证明
        blocks:
          - type: paragraph
            body: >-
              公开采用证据在两个层面最强：广义市场采用，以及评论密集的消费者证明。在市场层面，UCL 称前一年有 1.6 million 成人使用减重药，另有 3.3 million 有兴趣在下一年使用；基于
              Worldpanel 的报道则称， 2026 年有 1.9 million 成人为当前用户。在公司层面，SheMed 当前英国页面称有超过 100,000 名会员或女性， SheMed.com 页面则写
              50,000+，此前融资报道引用了 60,000+ 会员。评论平台增加可信度，也带来噪音。 Trustpilot 显示 SheMed 评级为
              Great，4.2/5，并呈现热情和批评两类体验。RatingFacts 和 Pharmacy UK 也类似：容易入组、血液检测带来安心、app 支持和配送受到赞扬，同时也有定价、沟通和偶发支持缺口方面的担忧。
              这种组合说明存在真实规模的客户使用，但还不是干净的机构级客户证明。它也意味着，当下最强证明是消费者行为和情绪， 而不是企业式账户证据或经审计的卫生系统部署。
