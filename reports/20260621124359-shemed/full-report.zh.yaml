        blocks:
          - type: paragraph
            body: >-
              SheMed 缺的不是估值锚，而是足够公开的运营细节，来判断这个锚到底保守、合理，还是激进。2025 年 10 月 Series A 据称把公司定价到 $1 billion；对一家 2024
              年才创立、核心财务披露仍大多不公开的私营公司来说，这个价格明显偏高。公开证据确实支撑一个真实故事：融资时已有 60,000+ 会员，定位女性，流程先做血液检测，患者也在寻找比 NHS
              目前更快、更有支持感的入口，品类需求很强。但这些亮点不会自动变成足以支撑上一轮或更高价格的价值。收入、队列质量、贡献利润率、优先权结构都没有披露时，正确的投资判断必须看价格，也必须看证据。因此，最干净的建议是继续研究，而不是买入；上一轮应被当作需要检验的上限，而不是当前公允价值的证明。
