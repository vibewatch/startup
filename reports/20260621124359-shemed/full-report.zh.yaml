          detail: 复购和客服效率恶化
        - id: r7
          label: 监管审查升温
          detail: 事件引来更多监管关注
        - id: r8
          label: 融资信心收缩
          detail: 市场更容易把公司看成执行很重的医疗服务商
      edges:
        - from: r1
          to: r4
          label: 公众信任受损
        - from: r1
          to: r7
          label: 后续审查
        - from: r2
          to: r4
          label: 不满显性化
        - from: r3
          to: r4
          label: 服务可靠性受质疑
        - from: r4
          to: r5
          label: 用户流失
        - from: r5
