      - number: '1.3'
        title: 资本信号、外部验证和带日期的里程碑
        blocks:
          - type: paragraph
            body: >-
              2025 年 10 月的融资事件，是本章最重要的外部验证点。SheMed、PRNewswire、Yahoo Finance、Digital Health 和 EU-Startups 都指向同一组信息：$50
              million Series A，估值 $1 billion，资金用途包括扩充医疗和技术团队、 强化临床基础设施，并投入研究与患者体验项目。值得注意的是，SheMed 也表示不披露投资人；尽管有亮眼估值，
              股权结构质量仍留下重大缺口。规模主张也必须带日期看。融资材料称，公司在不到一年内护理了超过 60,000 名会员， 并称其为英国增长最快的 GLP-1 项目；当前官方页面则营销一个 100,000
              多女性的社区。这些说法未必矛盾， 因为它们似乎对应不同日期，也可能把会员与社区定义分开，但不能合并成一个没有日期的指标。2025 年 8 月的 Tasso 合作，以及 2024 年 12
              月启动的女性聚焦临床研究，也让里程碑更有厚度：SheMed 在成为独角兽之前或前后， 已经在诊断和证据生成上投入。
