        - 如果付费会员质量或留存偏弱，则下调
      - - 先验血再个性化，可能支撑高端定位
        - 公开流程和 Tasso 合作让入门路径有差异
        - 如果疗效、续用或 ARPU 提升得到证明，则上调
      - - 上一轮可能已经计入很大一部分预期上行
        - 据报道 $1 billion 估值出现在公开经济性披露之前
        - 只有尽调支持其经济性比普通远程医疗更快且更耐久，才上调
      - - 公开市场可比公司提醒：没有证明就不该付高倍数
        - Hims 只有在具备规模时才享有溢价，而 Teladoc 和 Amwell 交易倍数低得多
        - 如果 SheMed 展现 Hims 式增长质量，而不是普通远程医疗脆弱性，则上调
    notes: 反方论点主要来自运营证明缺失，以及上一轮可能已经把大部分叙事上行资本化。
    claimRefs:
      - CV002
      - CV007
      - CV011
      - CV012
      - CV017
      - CV025
      - CV026
      - CV027
      - CV032
  - id: TV003
    title: 牛市 / 基准 / 熊市场景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 熊市
        - 社群未能转化为持久付费人群；监管和支持成本压低转化
        - 可支撑价值压到上一轮以下，因为公开证据更像早期、高流失的消费远程医疗服务
        - 高流失、投诉、药品供应摩擦、监管拖累
        - 如果尽调显示续用差或利润率弱，则权重有意义
      - - 基准
        - 会员增长真实，支持模式跑得通，但经济性仍接近高触达私营远程医疗运营商
        - 上一轮仍是主要估值锚；在经济性和留存拿出证据前，上行有限
        - 透明度有限、股权结构条款未知、溢价已经支付
        - 仅用公开信息看，这是最可能情景
      - - 牛市
        - 100k+ 社群转化为持久付费基数；先验血模式改善信任、疗效和 ARPU；品类扩张
        - 如果 SheMed 证明自己是女性专属代谢平台，且留存和品牌力更强，价值可以高于上一轮
        - 需要证明单位经济性和规模化监管执行
        - 需要尽调支撑的证据，而不是只靠叙事
    notes: 场景是方向性的可支撑案例，不是可交易公开股票的目标价。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV038
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Hims & Hers
        - 公开远程医疗 / 体重管理平台
        - ~$8.2B 市值；~3.3x EV/Revenue；已盈利、具备规模
        - 消费健康订阅加 GLP-1 扩张的最佳公开类比
        - 规模大得多，已上市、更多元，且财务已披露
      - - Teladoc
        - 公开广义远程医疗平台
        - ~$1.45B 市值；~0.69x EV/Sales
        - 远程医疗失去稀缺性和利润率信心后，公开市场会给出折价
        - 与 GLP-1 和女性专属护理绑定较弱
      - - American Well
        - 公开虚拟护理基础设施
        - ~$0.14B 市值；负 EV；市场严重怀疑
        - 提醒远程医疗资产若没有强增长或经济性支撑，下行空间很大
        - 模式不同，增长叙事也弱得多
      - - Flo Health
        - 私营女性健康平台
        - Series C $200M+ 后私营估值 >$1B
        - 证明消费女性健康可以长成独角兽，有参考价值
        - 规模指标远大于 SheMed 已公开数据
      - - Maven Clinic
        - 私营女性 / 家庭虚拟诊所
        - 2024 年融资轮估值 ~$1.7B
        - 证明临床型女性健康平台可以支撑高端价值，有参考价值
        - B2B 和福利模式与自费 GLP-1 护理差异很大
    notes: 可比公司用于框架判断，不用于机械盯市估值。
    enumerationScope:
      coverage: partial
      basis: >-
        Includes the highest-signal public telehealth and women’s-health valuation references that map most directly to
        SheMed’s model and stage questions.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: TV005
    title: 打破投资假设和终止触发器表
    columns:
      - 触发器
      - 阈值
      - 如何传导到投资假设
      - 行动含义
    rows:
      - - 活跃付费会员质量不及预期
        - 留存、续用或复购数据明显弱于叙事暗示
        - 打破增长持久且高效的假设
        - 将估值重估到上一轮以下
      - - 毛利率或支持成本画像不吸引人
        - 高触达服务负担让单位经济性难看
        - 削弱高倍数逻辑
        - 把 SheMed 视为高成本诊所，而不是可扩展平台
      - - 出现监管或安全问题
        - 可见处罚、投诉集群或临床失败
        - 损害转化、品牌和融资信心
        - 暂停承销
      - - 股权结构条款偏保护投资人，掩盖了标题估值
        - 优先权或结构让普通股上行不那么有吸引力
        - 标题估值不再具备经济可比性
        - 继续推进前要求完整条款
      - - NHS 可及性改善快于私营差异化
        - 由紧迫性驱动的私营楔子显著缩窄
        - 增长故事失去稀缺性和定价权
        - 下调增长假设和倍数支撑
    notes: 这些触发器把抽象估值怀疑转成可监控的尽调测试。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 付费会员质量
        - 活跃付费会员、按药品划分的续用和队列留存
        - 如果付费使用很浅，叙事规模不够
        - 索取队列表和按产品划分的续用数据
      - - 单位经济性
        - CAC、贡献利润率、按服务环节拆分的毛利率和回本周期
        - 高端价值不能只靠表层需求
        - 索取月度管理指标
      - - 临床 / 支持质量
        - 投诉率、升级时间、不良事件跟踪和安全治理
        - 服务质量失败会同时摧毁估值和品牌
        - 索取支持看板和事故日志
      - - 监管姿态
        - 牌照、广告审核控制和近期合规发现
        - 如果监管根基不稳，就不可能享有高端远程医疗倍数
        - 索取合规备忘录和任何监管往来
      - - 资本结构
        - 股价、优先权堆栈、清算优先权和期权池
        - 经济入场价可能与标题估值明显不同
        - 索取投资条款书和股权结构表
      - - 增长邻近品类证明
        - 证明女性专属代谢平台可以扩展到当前切入口之外的证据
        - 超过上一轮的上行需要更广的平台可信度
        - 索取路线图、交叉销售数据和品类扩张计划
    notes: 这些是最低限度尽调问题，只有回答清楚，才能把当前公开叙事转成可投资的估值判断。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV041
      - CV042
