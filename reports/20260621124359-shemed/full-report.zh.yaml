      - number: '1.4'
        title: 公开记录仍无法证明什么
        blocks:
          - type: paragraph
            body: >-
              尽管公开材料较强地确认了 SheMed 真实、活跃且有临床差异化，投资人最需要精确性的地方仍然很薄。 已抓取来源没有披露 Series A
              投资人名单、准确持股比例、董事会构成、收入、毛利结构、队列留存或单位经济。 公司的监管披露也偏间接：官方材料没有给出独立的 SheMed 临床注册页面，而是指向 eMed 等合作伙伴基础设施，
              并强调合规临床医生和药房注册。对早期远程医疗创业公司来说，这在运营上可能正常，但也意味着尽调文件对护理设计的证明， 明显强于对治理管线的证明。更大的英国环境也有双向影响。一方面，NHS 肥胖药物推广仍受产能限制，
              这保住了私营提供方的需求。另一方面，GPhC、BMJ 报道的监管变化，以及 MHRA/ASA 执法都显示， 在线减重开方和广告的压力正在上升。因此，底线概览是：SheMed 看起来运营可信、主题卡位也好，
              但在决定独角兽估值能否持久的财务和治理维度上，披露仍然不足。
