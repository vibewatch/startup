      - number: '6.4'
        title: 扩张逻辑和集中风险
        blocks:
          - type: paragraph
            body: >-
              对 SheMed 这样的消费者远程医疗公司来说，集中风险不太是某个企业账户，而是一个细分人群与渠道组合。 公司似乎最暴露于愿意为速度、安心和支持自费的富裕女性。这个细分可以很强，但也容易受到价格压力、 NHS
              可及性变化，以及承诺支持弱于宣传时的不满影响。扩张路径确实存在：从其他提供方切换来的用户、 维持项目、口服选项，以及更宽的女性健康相邻业务。但这些路径仍都在同一个广义自费漏斗里。
              因此，核心扩张问题是：SheMed 能否把今天强劲的品类兴趣和评论动能，转化为持久重复使用， 同时不过度集中在一个人口群体和一个获客故事上。这就是为什么队列构成与总评论量同样重要。
              高增长自费漏斗如果过多需求由紧迫感驱动或价格弹性很高，仍然可能脆弱。细分匹配仍是决定性因素。
