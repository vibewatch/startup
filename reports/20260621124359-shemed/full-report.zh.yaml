  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和替代品
        blocks:
          - type: paragraph
            body: >-
              不应把 SheMed 放进整个肥胖经济里分析，因为公司销售的产品窄得多：一套面向女性的私营 GLP-1 护理路径，
              组合了诊断、开方、行为支持和持续监测。因此，相关纳入支出是付费肥胖治疗，也就是患者购买由临床医生主导的获取渠道、 药物管理和支持服务，无论通过 NHS 委托路径还是私营项目。排除项包括通用健康
              app、广义补充剂、 减重手术预算，以及未转化为肥胖治疗路径的无差异基层医疗活动。这个边界很重要：窄品类才能给出更现实的竞争集， 也避免用 SheMed 无法捕获的人群健康活动来虚增可服务市场。NHS 和
              NICE 官方材料也强化了一点： 肥胖药物不是独立零售 SKU，而应放在包含饮食、活动和随访支持的结构化体重管理路径中。这样的架构让真实市场边界 更接近临床医生主导的代谢护理，而不是消费者健康。
