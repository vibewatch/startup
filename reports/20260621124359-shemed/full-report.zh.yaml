              Hims & Hers 在这里有用，不是因为它是干净的可比公司，而是因为它展示了真实远程医疗披露应有的样子。 该公司有投资者关系网站、实时股票页面、直接 10-Q 和 10-K 文件，以及 Q1 2026
              发布，显示季度收入约 $608 million、订阅者接近 2.6 million，并把全年指引更新为 $2.8 billion 至 $3.0 billion。 SheMed
              与这种披露标准相距很远。因此，财务结论是混合的。可见模式在商业上说得通：经常性标价、 清晰自费楔子，以及足够支持近期扩张的资本。但公开证据仍无法让投资人测试收入质量、毛利路径、CAC 回收、 流失或真实
              runway。公司因此看起来财务上有吸引力，但仍被尽调严重卡住。投资人需要原始队列数据， 才能高置信承销。
