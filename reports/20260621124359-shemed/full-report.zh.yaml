          to: n7
        - from: n3
          to: n7
        - from: n4
          to: n7
        - from: n5
          to: n7
        - from: n6
          to: n7
        - from: n7
          to: n8
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 这张柱状图展示公开市场和私营可比参照如何框定 SheMed 上轮融资。
    approximationNotes: 数值是留存来源中的公开市值或私募轮估值标题数，并已取整；这些是框架锚点，不是内在价值。
    claimRefs:
      - CV013
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
    data:
      items:
        - label: American Well 市值
          value: 140
        - label: Teladoc 市值
          value: 1450
        - label: SheMed 上轮融资
          value: 1000
        - label: Flo 私募估值
          value: 1000
        - label: Maven 私募估值
          value: 1700
        - label: Hims 市值
          value: 8200
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 可支撑价值的护栏来自公开证据，而不是某个声称存在的内部模型。
    approximationNotes: 区间是启发式的可支撑性带，用来展示在不同证据假设下，上轮融资看起来是便宜、合理还是偏贵。
    claimRefs:
      - CV002
      - CV007
      - CV026
      - CV027
      - CV028
      - CV038
      - CV041
    data:
      items:
        - label: 熊市可支撑性
          low: 500
          mid: 650
          high: 800
          detail: 更像早期、高接触的消费者远程医疗运营商，证明还有限。
        - label: 基准可支撑性
          low: 800
          mid: 950
          high: 1100
          detail: 叙事和会员增长仍然成立，但公开证据仍集中在上轮融资。
        - label: 牛市可支撑性
          low: 1100
          mid: 1300
          high: 1500
          detail: 留存、利润率和女性专属代谢平台扩张都通过尽调验证。
        - label: 公开远程医疗警戒带
          low: 140
          mid: 1450
          high: 8200
          detail: Amwell、Teladoc 和 Hims 说明，市场一旦检验证据和经济性，结果可能分化到什么程度。
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向 IC 的 SheMed 评分卡，覆盖市场拉力、差异化、经济性可见度、风险负担和估值透明度。
    approximationNotes: 分数是 0-10 的启发式判断，来自留存证据，并刻意保留主观判断，而不是套公式。
    claimRefs:
      - CV003
      - CV004
      - CV011
      - CV023
      - CV024
      - CV033
      - CV034
      - CV039
      - CV042
    data:
      items:
        - label: 市场拉力
          score: 8
          detail: 需求背景和 NHS 摩擦都明显有利。
        - label: 产品差异化
          score: 7
          detail: 先验血和女性专属定位真实存在，但结果尚未验证。
        - label: 商业证明
          score: 5
          detail: 会员增长信号存在，但收入质量未披露。
        - label: 经济性可见度
          score: 2
          detail: 公开材料没有 CAC、留存、毛利率或回本桥接。
        - label: 监管风险负担
          score: 3.5
          detail: 这个品类仍然合规强度高，且明显受到审视。
        - label: 估值透明度
          score: 2.5
          detail: 标题估值已公开，但条款和支撑指标没有公开。
        - label: 护城河清晰度
          score: 5.5
          detail: 工作流和品牌可能重要，但相对竞品的持久性尚未证明。
        - label: 证据质量
          score: 4.5
          detail: 叙事证据强，承销证据弱。
