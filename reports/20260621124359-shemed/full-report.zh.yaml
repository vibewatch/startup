      - number: '8.3'
        title: 什么能证明或打破上行空间
        blocks:
          - type: paragraph
            body: >-
              牛市情景说得通。SheMed 所在品类需求在加速，女性专属角度供给不足，临床级个性化可能比通用减重远程医疗带来更好的转化、留存和品牌信任。如果公司能证明 100k+
              社群可以转化为庞大且持久的付费基盘，血液检测足以改善结果或留存并支撑更高
              ARPU，支持导向的护理又能压住流失、投诉和安全事件，那么上一轮可能显得合理，甚至保守。但下行情景同样清楚。公开材料没有披露净收入留存、患者续用、CAC
              回收期、按服务组件拆分的毛利率，也没有说明资本结构是否让新钱受到保护、而普通股上行空间其实比头条估值更薄。品类监管也在收紧；这门生意看起来更像合规负担重的医疗服务，而不是轻量级健康订阅。这些未知数意味着上行空间存在，但应靠尽调或价格纪律释放，不能预设。
