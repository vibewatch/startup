chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律足迹和创立背景
        blocks:
          - type: paragraph
            body: >-
              做尽调时，SheMed 的公开身份有两层值得拆开看。运营品牌称自己是 2024 年 4 月上线、由女性创立的女性健康平台； Companies House 则显示，当前法律实体 SHEMED LIMITED 于
              2024 年 11 月 29 日在 London 注册， 是一家仍处于 active 状态的 private limited company，SIC 为 86900。也就是说，品牌叙事早于当前可见公司注册，
              更应被理解为注册前已有创业活动，而不是矛盾。官方页面和融资报道一致把姐妹 Olivia Ferro、Chloe Ferro 列为创始人， Olivia 任首席执行官，Chloe 任
              president。公司和第三方来源对服务描述也一致：SheMed 面向女性销售一套直接面向消费者、 由临床医生主导的体重管理项目，核心是 GLP-1 药物、数字支持和居家检测。因此，后续章节最可复用的底层事实，
              不只是 SheMed 是一家女性健康创业公司，而是它具体是一种受监管的私营护理订阅模式，卡在肥胖治疗、远程医疗、 诊断和消费者获客的交叉点上。
