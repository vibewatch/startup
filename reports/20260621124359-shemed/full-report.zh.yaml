      - number: '8.2'
        title: 公开可比公司背景
        blocks:
          - type: paragraph
            body: >-
              最关键的公开市场类比是 Hims & Hers，因为它同时覆盖远程医疗、经常性消费医疗、诊断扩张，以及激进的体重管理野心。Hims 的价值也恰恰在于，它说明市场要看到多少证明，才愿意支付高倍数。到 2026
              年中，Hims 已有数十亿美元收入、数百万订阅用户、调整后 EBITDA 转正，公开市值约 $8 billion；即便如此，它的收入倍数仍在低到中个位数，而不是风投式幻想数字。Teladoc、Amwell
              等更广义的远程医疗可比公司交易倍数低得多，说明一旦盈利能力、留存或品类信心被质疑，公开市场会很快折价增长故事。Flo、Maven 这类私营女性健康赢家证明，十亿美元级结果可以出现，但二者的规模标记都比
              SheMed 清楚：Flo 披露近 70 million MAU、接近 5 million 付费订阅用户，且 2024 年预期总预订额超过 $200 million；Maven 在 $1.7 billion
              估值之外，还给出 2,000 个客户、175 个国家和公开 ROI 主张。结论不是 SheMed 无法证明溢价，而是 $1 billion 标记已经要求投资者承接未来证明，而不只是当前披露。
