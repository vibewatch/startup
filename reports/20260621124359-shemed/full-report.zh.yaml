  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 这条决策流把 SheMed 强品类叙事和差异化，接到缺失的经济性与价格纪律规则，最后落到继续研究的判断。
    approximationNotes: 流程强调改变推荐结论所需的证据，而不是穷尽所有可能的尽调分支。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV025
      - CV028
      - CV035
      - CV037
    data:
      nodes:
        - id: n1
          label: 品类需求
          detail: 面向女性的 GLP-1 需求和 NHS 获取摩擦都是真实存在的
        - id: n2
          label: 差异化
          detail: 先验血、强支持、女性专属定位
        - id: n3
          label: 上轮锚点
          detail: 2025 年 10 月报道估值 $1B
        - id: n4
          label: 经济性缺口
          detail: 公开材料没有收入、流失率、CAC 或利润率桥接
        - id: n5
          label: 条款缺口
          detail: 公开材料没有每股价格或优先权结构
        - id: n6
          label: 可比参照
          detail: 高溢价可比公司有清晰得多的规模或披露
        - id: n7
          label: 推荐结论
          detail: 继续研究 / 估值偏高 / 尽调负担高
        - id: n8
          label: 上调门槛
          detail: 需要付费会员、利润率和条款的强证据
      edges:
