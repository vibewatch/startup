      - number: '7.4'
        title: 缓释因素和 thesis-breaker
        blocks:
          - type: paragraph
            body: >-
              承销 SheMed 的正确问题，不是风险是否存在，而是可见控制是否足够强、kill criteria 是否可监测。
              公开证据支持几个真实缓释因素：先验血再筛查、品牌药物定位、独立临床医生审核，以及围绕支持而非纯速度搭建的流程。 但这些控制不会自动让 thesis 过关。如果出现严重监管处罚、与供应或筛查有关的可见安全事故、
              围绕支持或药物处理的公开投诉模式上升、隐私失败，或证据显示 NHS 扩张正在比 SheMed 扩宽产品更快地缩小紧迫性驱动的私营楔子， 公司仍会变得更难支持。投资含义是，SheMed
              应被视为合规和运营强度很高的医疗服务，而不是无摩擦消费者 app。 这个框架提高了尽调门槛，也清楚指出什么会很快打破故事。
