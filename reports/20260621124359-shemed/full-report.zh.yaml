      - number: '7.2'
        title: 运营、质量和安全风险
        blocks:
          - type: paragraph
            body: >-
              SheMed 的运营风险与产品设计不可分割。同一套提升安全性的流程——血液检测、临床医生审核、药物履约、 每周支持——也创造了更多故障点。样本物流可能断裂，实验室周转可能变慢，药物供应可能摇摆，
              支持升级可能卡在客服和临床医生之间。评论证据已经暗示这种运营脆弱性：许多用户赞扬入组和支持， 也有人抱怨临床回答不清、配送延迟或缺失，以及药物或订阅管理问题。品类层面的证据让这些问题更重要，
              而不是更不重要。如果成本和副作用已经是人们停止 GLP-1 治疗的主要原因，那么薄弱支持或运营不一致， 会同时放大流失和监管暴露。安全和隐私风险同样核心，因为 SheMed 在女性聚焦语境中处理高度敏感的健康、
              生物标志物和治疗数据。公开材料显示了意图，但没有公开记录 SheMed 安全控制、事故历史或隐私治理的深度。
