      - number: '1.2'
        title: 护理模式、产品范围和所声称的差异化
        blocks:
          - type: paragraph
            body: >-
              SheMed 最强的运营差异化主张，是在开具 GLP-1 前坚持先走血液检测路径。首页、FAQ、专门的血液检测页面和 Tasso
              公告都说，治疗从居家血液检测开始，之后由临床医生审核资格并定制治疗。公开可见的监测覆盖血糖、 血脂、肝脏、肾脏、心血管和甲状腺相关指标，并在 6 个月和 12 个月做随访检测。官方材料还描述了每周签到、
              续方问卷、临床医生接入、副作用支持和 app 跟踪；这些叠加起来，让产品比只卖药的在线药房更完整。 SheMed 自己的定位很明确：它称很多竞争对手靠极简问卷开方，并不了解药物如何影响女性身体； SheMed
              则围绕女性生物学、激素背景和安全监测来搭建。这些主张带有营销色彩，但方向上契合英国监管审查： 监管越来越不支持只靠问卷开肥胖药。因此，即使还没有验证商业耐久性，公开记录已经显示，SheMed 的产品架构摩擦更高，
              但相较低接触数字药房漏斗，可能更守得住。
