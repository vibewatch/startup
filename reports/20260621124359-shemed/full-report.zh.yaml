  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、标价和实际变现内容
        blocks:
          - type: paragraph
            body: >-
              SheMed 似乎主要通过打包式私营减重项目变现，而不是按项配药。官方页面反复把药物获取、血液检测、临床审核、 app
              支持、配送和副作用护理捆在一起。这对财务很重要：客户买的不是一支简单的每周用针，而是一套托管项目； 其实际经济性取决于入组、剂量递增、续方延续和维持。公开定价足以建立标价结构，但不足以看清实际收入。 当前
              SheMed 网站和定价页宣传 £59 起的入门优惠，之后是高得多的持续价格点；FAQ 和第三方价格报道也确认，
              折扣和计划时长会影响价格。换句话说，可见收入线像订阅且有复购，但真正的变现问题是：有多少会员能从折扣入门 转化为更高价值的月度持续付费。因此，月度持续性，而不是初始注册量本身，才是真正的财务支点。
