      - number: '2.2'
        title: 受证据约束的市场规模和 NHS 获取瓶颈
        blocks:
          - type: paragraph
            body: >-
              广义需求基础很大，但可服务市场由获取约束塑形，而不是只看原始患病率。NHS England 和 NICE 指出， 大约 3.4 million 成人在临床上符合 tirzepatide 使用资格，但系统在 12
              年推广的前三年只优先覆盖约 220,000 名患者。临床资格和短期资助获取之间的缺口，是 SheMed 最重要的单一市场事实。人群患病率提供背景： 2024 Health Survey for England
              发现，30% 成人患有肥胖，66% 超重或患有肥胖，患病率在较晚中年阶段达到高点。 这些数字说明漏斗顶部巨大，但不能直接转化为可变现需求，因为公共资格窄得多，实际推广也慢于政策标题所暗示的速度。 BMJ 和
              Pulse 报道显示，委托准备度、地方资金和配套服务设计仍在限制真实 NHS 可及性。对私营提供方来说， 市场因此不是“所有肥胖成人”，而是那些临床动机明确、有支付能力，并在公共路径中遇到摩擦或延迟的人群子集。
