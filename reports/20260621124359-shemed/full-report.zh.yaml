          label: 增长质量被下调
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: SheMed 可见的依赖网络，从前端承诺一路延伸到诊断、实验室、临床医生、药品供应、监管机构和客服执行。
    approximationNotes: 本图只纳入留存来源能证明的依赖项；未披露供应商和合同可能带来比图中更多的风险敞口。
