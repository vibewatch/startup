      - number: '2.4'
        title: 增长驱动、约束和市场对 SheMed 的含义
        blocks:
          - type: paragraph
            body: >-
              这个品类有强劲采用驱动，但几乎每个驱动都伴随结构性约束。临床疗效、社会认知和 NHS 产能不足， 都把消费者推向私营 GLP-1 提供方。The Health Foundation
              的私营开方分析显示，需求最先浮现在哪里： 中年女性，尤其是更富裕地区的女性，往往早于同等公共可及性出现。但同样的模式也暴露核心风险。
              获取并不公平，监管摩擦在增加，提供方也不能像普通消费者订阅那样营销这些药物。GPhC 保障措施让仅靠问卷的模式 更难站住脚，ASA 与 MHRA
              的联合执法通知也收窄了公司宣传处方减重药的空间。这有利于围绕更高摩擦临床流程搭建的提供方， 但也会抬高获客成本，并加重对合规开方和支持基础设施的运营依赖。因此，差异化提供方能在这个市场获得吸引力，
              但前提是把受限公共需求转化为可信私营护理，同时不滑向监管正在主动打击的低合规获客手法。
