              公开记录在价格上比在毛利上更丰富，所以分析 SheMed 的正确方式是使用代理指标，而不是假装知道 SaaS 式指标。 SheMed 所在市场里，Numan、Juniper、Boots、ZAVA 和 Simple
              Online Pharmacy 都展示可见的入门价格锚点 或宽泛药物菜单。这说明外部环境限制了定价权。与此同时，SheMed 比纯药房交易背负更明显的服务交付成本， 因为它包含血液检测物流、临床医生审核、app
              支持和副作用护理。如果这些层能提高留存或支付意愿，这是好事； 如果它们只是抬高 COGS，而市场仍被便宜首月优惠锚定，就是坏事。交叉销售是另一个重要代理缺口。 Numan 和 Hims
              的公开材料显示更宽的健康平台野心，而 SheMed 可见变现仍集中在女性聚焦减重护理。 这很可能让获客效率比更宽的远程医疗平台更依赖单一品类和单一受众。
