      - number: '6.3'
        title: 留存、满意度和耐久性
        blocks:
          - type: paragraph
            body: >-
              公开记录对持久客户经济性的证明，远弱于对获客和情绪的证明。SheMed 明显有满意度信号——数千条公开评论、 围绕服务和 app 体验的高频正面提及，以及用户反复称赞自己感到有医疗监督、不是被单独放着不管。
              但留存证明缺失。没有公开 NRR、GRR、流失、续费，或逐月延续队列。更宽品类证据说明这为什么重要。 Worldpanel 和其他来源显示，成本和副作用是人们停止 GLP-1
              治疗的两个主要原因；这意味着每个私营提供方 都必须在第一波热情之后接受耐久性测试。对 SheMed 来说，最好的临时解读是：客户满意度看起来足以支持增长，
              但长期复购经济性仍然是从流程质量推断，而不是由已披露队列证明。投资人因此必须非常明确地区分获客证明和重复使用证明。 这个缺失的耐久性证据，是今天最大的客户层尽调缺口。
