      - number: '2.3'
        title: 买方、付款方和女性特异需求分层
        blocks:
          - type: paragraph
            body: >-
              在 SheMed 当前模式中，买方和付款方通常是同一个人：一名自费购买临床医生主导肥胖治疗的成年女性。 但用户比通用“减重客户”更异质。公开和私有证据显示，需求尤其强烈的群体包括 30 至 49 岁女性、 NHS
              获取被延迟的女性，以及面临代谢复杂性、觉得通用饮食建议不够的人群。PCOS 尤其相关，因为 NHS 和 NIHR 来源 把它描述为常见且代谢意义重大的病症：约每 10 名女性中就有 1
              名受影响，胰岛素抵抗是核心机制， 关于最佳长期体重管理方法的证据仍不完整。因此，女性健康角度不只是品牌语言。它对应真实的分层逻辑：
              激素背景、生育目标、心血管风险，以及对一刀切在线开方的不满，都会影响支付意愿。SheMed 的定位在这类买方面前最强： 她们相信标准路径要么太慢、太通用，要么太不贴合女性生物学。
