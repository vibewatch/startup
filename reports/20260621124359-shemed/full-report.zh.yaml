            body: >-
              最高信号的依赖风险集中在诊断、临床医生、药物和细分集中度。Tasso 是诊断层最清楚的公开伙伴， 这意味着 SheMed 依赖外部硬件、物流和样本质量来维持其差异化筛查模型。品牌 GLP-1
              供应从信任角度有吸引力， 但也带来对更大市场上游的依赖；短缺、切换和安全审查仍是活跃问题。人的执行风险同样重要。 有评论抱怨不清楚谁能回答药物问题，这意味着临床支持设计和升级质量与前端 app 一样重要。
              客户群本身也是一种依赖。SheMed 似乎集中在愿意为速度、安心和支持自费的女性；如果 NHS 获取扩大、 价格敏感度上升，或支持质量令人失望，同样的集中度就可能压缩增长。这些不是理论风险，
