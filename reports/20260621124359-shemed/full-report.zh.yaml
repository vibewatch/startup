            body: >-
              公开页面显示，多数竞争对手销售相同核心分子——Wegovy、Mounjaro 或相邻肥胖药物——所以竞争不太在专有疗法， 更多在处方周围包了什么。SheMed 强调女性特异临床支持、里程碑血液检测、副作用帮助和
              app 跟踪。 Numan 强调临床医生审核加专属健康教练。Juniper 营销 1:1 健康教练、行为改变工具和女性优先品牌。 Second Nature 最重视行为改变、营养，以及通过 NHS 和
