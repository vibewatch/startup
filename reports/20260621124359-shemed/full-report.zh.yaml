            body: >-
              SheMed 的可能客户群窄于广义英国肥胖人群。最强信号指向中年自费女性：她们想要临床指导式获取， 想要比通用在线药房更多的支持，也想要比当前 NHS 路径更快的治疗。SheMed 官方页面明确瞄准女性，
