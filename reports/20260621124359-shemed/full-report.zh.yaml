companyProfile:
  summary: >-
    SheMed 是一家位于 London、面向女性的 GLP-1 远程医疗公司，由 Olivia Ferro 和 Chloe Ferro 于 2024 年 4 月创立。
    公司围绕先验血再治疗、女性特异的代谢护理流程定位，组合了居家诊断、临床医生审核、品牌药物获取和持续订阅支持。 公开融资报道显示，公司以异常快的速度达到据称 $1 billion 估值，但公开记录更能证明需求叙事和护理设计，
    对独立财务披露和股权结构透明度的证明要弱得多。
