- id: trust-quality-and-compliance-controls
  title: Trust, quality, and compliance controls
  body: 'SheMed''s trust posture is visible in workflow decisions more than in published technical certifications. The strongest public controls are upfront biomarker screening, independent clinician review, and an explicit promise to use branded medications rather than counterfeit or compounded products. Tasso''s documentation ecosystem strengthens that story: product literature, use videos, and published instructions suggest the home-collection device is supported by real operating documents rather than improvised patient guidance. But trust also sits inside a regulatory context. GPhC weight-management guidance, stronger online-pharmacy safeguards, and reinforced MHRA advertising rules all raise the standard for how obesity-treatment providers screen, prescribe, and market. These controls arguably help a higher-friction model like SheMed, yet the public record still does not show detailed security architecture, lab-quality SLAs, sample rejection rates, or uptime metrics for the authenticated
    app layer. In other words, safety intent is visible; operational reliability proof is thinner. That missing operating proof matters because clinical telehealth trust can fail at the service layer long before it fails at the marketing layer.'
  claimRefs:
  - CE006
  - CE019
  - CE020
  - CE021
  - CE023
  - CE024
  - CE025
  - CE026
  - CE029
  - CE030
  - CE034
