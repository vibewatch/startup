  - - App / portal engagement
    - Supports weekly check-ins, progress tracking, and support
    - Authenticated SheMed software layer
    - Security, uptime, and intervention logic are not publicly detailed
  notes: The public stack is reconstructible at the workflow level, but not at the internal-software or vendor-contract level.
