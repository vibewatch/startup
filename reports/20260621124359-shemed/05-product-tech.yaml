- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Check treatment safety before first dose
    - Most telepharmacy flows rely heavily on questionnaire data
    - SheMed sends a no-needle blood kit before treatment
    - More biomarker visibility before prescribing
    - Adds friction, shipping steps, and lab dependence
  - - Get medically reviewed eligibility
    - User submits profile and waits for decision
    - Independent clinician reviews profile plus lab markers
    - Supports safer, more tailored eligibility decisions
    - Turnaround times are not publicly disclosed
  - - Start treatment from home
    - Traditional care can require in-person visits or local logistics
    - Remote onboarding plus home medication delivery
    - Convenience and reach for time-constrained users
    - Delivery and supply continuity still matter
  - - Stay on treatment with support
    - Many users struggle with side effects or adherence
    - Weekly app check-ins and ongoing support
    - Potentially better adherence and earlier intervention
    - No public retention or outcome benchmark is disclosed
  - - Switch from another provider
    - Users may feel under-supported after starting elsewhere
    - Dedicated switch messaging and transfer-oriented onboarding
    - Can capture already-converted category demand
    - Public switching friction and approval rates are unknown
  - - Move into longer-term maintenance
    - Users need lower-friction continuation once stable
    - Maintenance and longer commitment structures
    - Supports recurring revenue and habit persistence
    - Public maintenance economics remain unclear
  notes: Benefits are workflow-level and directional; public materials do not disclose quantified conversion or adherence lifts.
