chapter:
  number: 5
  title: Product & Technology
summary: 'SheMed''s product is best understood as a remote care workflow rather than a standalone app or drug SKU: at-home blood screening, clinician review, branded GLP-1 prescribing, weekly digital monitoring, and ongoing support. The most visible technical differentiation is the blood-test-first operating model and Tasso-enabled home collection stack, but the public record still leaves app architecture, lab SLAs, security controls, and partner dependency economics under-explained.'
sections:
- id: product-definition-and-user-job
  title: Product definition and the user job
  body: 'SheMed is selling a clinically guided obesity-treatment workflow for women, not just a prescription checkout page. Across the .co.uk and .com surfaces, the consistent core is: the patient completes a medical profile, receives an at-home no-needle blood collection kit, gets clinician review based on biomarkers and history, then receives branded GLP-1 medication with ongoing app-based check-ins and support. That product definition matters because the user job is not “buy a pen online”; it is “start and stay on treatment safely, with more women-specific context than generic telepharmacy offers.” Public pages also show that SheMed is trying to make safety and personalization part of the product itself. The blood test is presented as prerequisite screening, not an optional add-on, and weekly check-ins turn the app into an operating layer for adherence rather than just a marketing shell. This matters operationally too.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
