- id: operating-architecture-and-partner-stack
  title: Operating architecture and partner stack
  body: The public architecture looks like a service workflow stitched across several operational layers. SheMed owns patient intake, clinical framing, app- or portal-based engagement, and the branded women's-health narrative. Tasso is the clearest disclosed external dependency inside the workflow. Its press materials and solutions pages show that the Tasso+ device sits at the sample-collection edge, while Tasso Connect portal or API capabilities can handle sample tracking and logistics integration. That means the real product stack likely runs patient intake and support on SheMed, collection hardware and kit instructions on Tasso, laboratory processing offsite, clinician decisioning in the prescribing layer, and medication fulfilment as a downstream delivery function. The strength of this design is convenience and higher-fidelity screening before treatment. The weakness is that the experience depends on multiple external processes—kit delivery, sample quality, shipping, lab turnaround,
    and clinician throughput—that are not fully disclosed in public service-level detail.
  claimRefs:
