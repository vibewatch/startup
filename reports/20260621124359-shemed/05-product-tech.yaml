  - TE004
  figureRefs: []
- id: maturity-roadmap-and-product-risk
  title: Maturity, roadmap, and product risk
  body: 'This is a live commercial workflow, not a prototype. SheMed has active pricing, structured FAQs, switcher messaging, a continuing clinical-study narrative, and partner evidence saying the program has already treated thousands of UK women. The surfaces also show iterative product packaging: maintenance programmes, oral weight-loss mentions, weekly check-ins, and switcher acquisition are all signs of a product stack expanding around the core prescription flow. Still, maturity is not the same as technical completeness. The source set does not expose the internal app architecture, analytics stack, lab-provider roster, or exact monitoring cadence beyond high-level milestones. Nor does it fully reconcile site variants between shemed.com and shemed.co.uk, which show slightly different market framing and scale claims. The product verdict is therefore favorable on workflow design and commercialization, but still dependency-heavy and under-documented from a technical diligence perspective.
    A full technical review would need authenticated product access, partner contracts, and real support metrics.'
