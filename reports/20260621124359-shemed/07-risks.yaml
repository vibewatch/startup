  title: Risks
summary: 'SheMed''s main risks are not abstract startup risks; they are category-specific and already visible in public evidence: tighter prescribing rules, black-market spillover, sensitive health-data handling, service-quality fragility, and dependence on external diagnostics and medicine supply. The company''s blood-test-first model mitigates some unsafe-prescribing risk, but it also increases operational and support complexity that could become a thesis-breaker if customer trust or regulatory compliance slips.'
sections:
- id: regulatory-legal-and-category-risk
  title: Regulatory, legal, and category risk
  body: 'Private GLP-1 telehealth in the UK is now operating under much tighter scrutiny than generic e-commerce or wellness subscriptions. GPhC patient guidance, professional weight-management rules, MHRA safety guidance, and ASA enforcement all point in the same direction: providers must verify identity and suitability carefully, avoid casual or questionnaire-only supply patterns, and stay well inside prescription-drug advertising boundaries. That environment creates a double-edged risk for SheMed. On one hand, a blood-test-first workflow and clinician review should fit better than lower-friction competitors with weaker clinical safeguards. On the other hand, the cost of compliance is high and any visible lapse could cause outsized reputational damage because the category is already associated with fake medicines, black-market supply, and public concern about inappropriate prescribing. Legal exposure also extends beyond prescribing itself. Remote-health providers handling special-category
    health data and distance-sales relationships can face privacy, consent, and consumer-rights risk if support, cancellation, or data practices do not match what users reasonably expect.'
  claimRefs:
