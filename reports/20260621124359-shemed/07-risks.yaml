- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory / advertising breach
    - Published regulator action, sanction, or forced ad withdrawal
    - Any formal enforcement tied to SheMed or key operating entity
    - Pause underwriting until root cause and corrective action are independently reviewed
  - - Clinical safety event
    - Serious adverse-event pattern, unsafe prescribing report, or public incident cluster
    - Repeat incident or regulator concern linked to screening / prescribing workflow
    - Re-rate company as safety-challenged and demand full clinical QA review
  - - Support quality deterioration
    - Sustained public complaints about unanswered medication or escalation questions
    - Visible complaint cluster without credible remediation
    - Assume higher churn and reputational drag
  - - Diagnostics or fulfilment instability
    - Rising sample, delivery, or medication-handling failures
    - Material SLA misses across diagnostics or shipping
    - Treat workflow differentiation as impaired
  - - Privacy / data-protection failure
    - Breach, enforcement action, or major disclosure of mishandled health data
    - Any sensitive-data incident affecting users
    - Escalate to thesis-break pending remediation
  - - NHS access compression
    - Public rollout materially narrows the urgency-led self-pay wedge
    - Evidence that target segment no longer needs private speed premium
    - Lower growth expectations and reassess segment concentration risk
  notes: Kill criteria are deliberately specific so they can be monitored over time rather than waved away as generic startup risk.
