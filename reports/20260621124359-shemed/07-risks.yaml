- id: mitigations-and-thesis-breakers
  title: Mitigations and thesis-breakers
  body: 'The right way to underwrite SheMed is not to ask whether risk exists, but whether the visible controls are strong enough and whether the kill criteria are monitorable. Public evidence supports a few real mitigants: blood-test-first screening, branded-medication positioning, independent clinician review, and a workflow built around support rather than pure speed. But those controls do not automatically clear the thesis. The company would still become much harder to back if there were a serious regulatory sanction, a visible safety incident linked to supply or screening, rising public complaint patterns around support or medication handling, a privacy failure, or evidence that NHS expansion is shrinking the urgency-led private wedge faster than SheMed can broaden its offering. The investment implication is that SheMed should be treated as a compliance- and operations-intensive healthcare service, not a frictionless consumer app. That framing raises the bar for diligence, but it also
    clarifies what would break the story quickly.'
