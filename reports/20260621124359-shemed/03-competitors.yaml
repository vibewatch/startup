- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider
  - Headline entry price / model
  - Included capabilities
  - Discount or unknowns
  - Implication
  rows:
  - - SheMed
    - From £59 intro offer; dose tiers visible on treatment page
    - Medication, blood tests, clinician support, app tools, side-effect support
    - Intro price applies to first dose / longer commitments; realized steady-state mix unknown
    - Premium is easier to defend if monitoring and women-specific support convert into retention
  - - Numan
    - From £57.20 first month
    - Medication, clinician review, dedicated health coach, wider health platform
    - Intro price is not long-run realized price; multiple products cross-sold
    - Competes closely on headline affordability while offering broader platform scope
  - - Juniper
    - Prices starting £64
    - Medication, 1:1 coaching, behavioural change app, women-focused programme
    - Dose-specific realized price path not fully visible in retained source set
    - Strongest direct women-focused alternative to SheMed in public materials
  - - Second Nature
    - Public pricing not clearly disclosed on retained page
    - Medical support, nutritionist-style behaviour change, NHS / insurer trust signals
    - Price transparency weaker than rival list pages
    - Competes more on trust and support proof than on clean price comparison
  - - Oviva
    - No cost for eligible NHS-referred patients
    - Coaching, clinicians, medication, remote app/phone support
    - Access depends on eligibility and referral pathway, not open self-serve purchase
    - Can outcompete private providers on affordability when public access is available
  - - Boots Online Doctor
    - £79.97 monthly at 0.25mg on retained page
    - Medication plus app/tools, podcast, exercise content, retail trust
    - Dose progression and all-in cost move over time
    - Retail channel can win users who prioritise familiarity over specialization
  - - ZAVA
    - Prices from £99
    - Medication range through broad online-doctor service
    - Support depth appears lighter than coaching brands
    - Generalist pharmacy players can cap category pricing
  - - Simple Online Pharmacy
    - Public catalogue model; exact all-in program packaging varies by product
    - Broad medication choice and pharmacy fulfilment
    - Service depth and realized plan design less explicit than specialist brands
    - Useful low-friction substitute for confident self-managing users
  notes: Headline entry pricing is comparable only at a rough level because providers vary in what they bundle, how they escalate dose, and whether discounts depend on introductory or term commitments.
