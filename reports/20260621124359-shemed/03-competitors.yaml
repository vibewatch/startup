- id: moat-durability-and-adverse-evidence
  title: Moat durability and adverse competitive evidence
  body: 'The adverse evidence is meaningful. Independent guides describe a fragmented market with transparent side-by-side scoring on price, support, and verification, which makes weak differentiation easier to commoditize. Pharmacy-led competitors can undercut on convenience and sometimes price. Coaching-first competitors such as Numan, Juniper, and Second Nature can attack the same adherence and trust problem that SheMed cites as its edge. NHS-partner models such as Oviva can outcompete private platforms entirely for eligible patients on affordability. Regulators are also tightening the category: GPhC now expects stronger online-prescribing safeguards and has refreshed enforcement on weight-management prescription advertising, which raises the operational bar but does not uniquely protect SheMed. The net result is that SheMed''s moat looks real only if its blood-test-led women''s-health model produces better retention, outcomes, or trust than peers. Public evidence in this chapter does
    not yet prove that durability.'
