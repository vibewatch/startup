- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Women-specific brand and care narrative
    - Juniper already markets heavily to women and generalists can add women-specific campaigns
    - Medium
    - Request evidence that SheMed wins disproportionately among women who tried generic or male-skewed providers first
  - - Blood-test-led monitoring
    - Rivals can add diagnostics or emphasize clinical review without rebuilding the entire stack
    - High
    - Ask for retention, outcomes, and safety-event evidence showing blood-test-led onboarding improves economics or trust
  - - Clinical support and side-effect management
    - Numan, Juniper, and Second Nature all market coaching or clinical support around adherence
    - High
    - Benchmark SheMed retention and dose-escalation outcomes versus peer cohorts
  - - Private-demand capture via NHS frustration
    - Oviva, Second Nature, and future NHS rollout can absorb eligible users without self-pay
    - High
    - Track which segments remain private-only even as public pathways expand
  - - Price-value story
    - Boots, ZAVA, and Simple can compress convenience-led pricing with broad pharmacy distribution
    - High
    - Test willingness to pay for blood tests and women-specific support after introductory offers expire
  - - Regulatory compliance posture
    - Higher safeguards raise the bar for everyone, not only for weaker rivals
    - Medium
    - Review compliance metrics, prescriber oversight, and ad-approval workflow to see whether regulation is truly an advantage
  notes: The strongest unresolved question is whether SheMed's extra clinical friction converts into measurably better retention or trust than peers; public sources do not answer that today.
