  title: Competitors
summary: 'SheMed competes in a fragmented UK GLP-1 field where the same branded medicines are sold through very different delivery models: women-focused telehealth, generalist coaching platforms, NHS-partner pathways, and pharmacy-led prescribers. The company''s blood-test-led, women-specific positioning is differentiated, but its moat looks service- and trust-based rather than structurally protected against better-funded coaching brands or lower-friction pharmacy incumbents.'
sections:
- id: landscape-and-solution-classes
  title: Competitive landscape and solution classes
  body: SheMed is not competing against one neat set of lookalikes. The fetched set shows at least four active solution classes in UK weight-loss care. First are women-focused telehealth brands such as SheMed and Juniper, both of which sell medication plus a more tailored support narrative to women. Second are broader digital coaching platforms such as Numan and Second Nature that frame weight loss as part of a wider health or behaviour-change programme. Third are NHS-partner routes such as Oviva and, in a different way, Second Nature, which can route eligible users into supported pathways outside pure self-pay demand. Fourth are pharmacy-led or online-doctor operators such as Boots, ZAVA, and Simple Online Pharmacy, which compete through breadth, convenience, and recognizable retail trust rather than a narrow women-specific wedge. Independent 2026 market guides reinforce that no single provider dominates this market in a Hims-style way; instead, similar GLP-1 medicines are wrapped in different
    combinations of pricing, support, monitoring, and channel access.
