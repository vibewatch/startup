- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - SheMed
    - Women-focused private telehealth
    - 100k+ members claimed on current site; funding not disclosed in this chapter's source set
    - Women seeking clinician-led GLP-1 care
    - Blood-test-led onboarding, women-specific framing, bundled side-effect support
    - Private-only route; durability versus better-funded rivals is unproven
  - - Numan
    - Generalist coaching telehealth
    - 800k+ people claimed; broader health platform
    - Broad adult consumers, historically male-skewed but now wider health positioning
    - Clinician-backed care, health coach, diagnostics and cross-sell across conditions
    - Women-specific positioning is weaker than SheMed or Juniper
  - - Juniper
    - Women-focused coaching telehealth
    - 250k women claimed; pricing from £64
    - Women seeking coaching plus medication
    - 1:1 coaching, behavioural app, women-first brand, multiple medication options
    - Uses the same medicine set as rivals; public realized pricing and retention are undisclosed
  - - Second Nature
    - Behaviour-change / payer-linked programme
    - 300k+ NHS referrals supported; Vitality partner
    - Users wanting nutrition and behaviour change with medical support
    - NHS and insurer trust signals, nutritionist support, whole-person positioning
    - Public pricing is less transparent on retained pages; less clearly women-specific
  - - Oviva
    - NHS-partner weight-management pathway
    - 300k NHS patients supported; 950k+ helped claimed overall
    - Clinically eligible patients able to access referral-based support
    - No-cost eligible route, GP referral channel, remote coaches and clinicians
    - Competes more as substitute for eligible users than a pure DTC brand
  - - Boots Online Doctor
    - Retail pharmacy / online-doctor
    - National Boots trust and multi-service storefront
    - Consumers prioritising convenience and retail familiarity
    - App/tools, recognized pharmacy brand, in-store plus online service options
    - Less tailored identity; support depth appears lighter than specialist coaching brands
  - - ZAVA
    - Online doctor / pharmacy
    - Broad online-doctor catalog; prices from £99
    - Consumers seeking broad prescription access
    - Multiple weight-loss modalities and established online-doctor operations
    - Generalist service makes differentiation more price-led than category-led
  - - Simple Online Pharmacy
    - Online pharmacy convenience player
    - Large treatment catalogue; Sunday Times 100 mention on site
    - Self-directed users shopping across pharmacy options
    - Very broad medication menu and trusted-pharmacy positioning
    - High-touch clinical or women-specific support is less visible than at SheMed/Juniper
  notes: The table groups providers by operating model because category structure, not just price, determines who can challenge SheMed most directly.
