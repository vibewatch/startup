callouts:
- calloutType: strength
  title: Where SheMed really is differentiated
  body: In the retained public set, SheMed stands out most on women-specific branding plus blood-test-led monitoring. That is a more concrete wedge than generic claims about medication access, because rivals largely sell the same branded drugs.
  claimRefs:
  - CP001
  - CP002
  - CP025
  - CP026
  - CP027
- calloutType: risk
  title: Why the moat still looks fragile
  body: Support-heavy peers, NHS-partner substitutes, and pharmacy incumbents each attack a different part of SheMed's value proposition, while public evidence still does not prove superior retention or outcomes for SheMed versus those alternatives.
