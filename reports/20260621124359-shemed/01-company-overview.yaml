company:
  name: SheMed
chapter:
  number: 1
  title: Company Overview
  summary: SheMed is a London-based women’s GLP-1 telehealth company that pairs branded weight-loss medication with at-home blood testing, clinician oversight, and a consumer subscription layer. Public evidence strongly supports the company’s existence, care model, and October 2025 $50 million Series A at a $1 billion valuation, but governance depth, investor identity, and core financial metrics remain undisclosed.
sections:
- id: identity-and-legal-setup
  title: Identity, legal footprint, and founding context
  body: 'SheMed’s public identity has two layers that matter for diligence. The operating brand presents itself as a female-founded women’s health platform launched in April 2024, while Companies House shows the current legal entity, SHEMED LIMITED, was incorporated on 29 November 2024 as an active private limited company in London under SIC 86900. That means the brand narrative predates the currently visible company registration and should be read as evidence of pre-incorporation venture activity rather than a contradiction. Official pages and financing coverage consistently name sisters Olivia Ferro and Chloe Ferro as founders, with Olivia as chief executive and Chloe as president. The service description is also consistent across company and third-party sources: SheMed sells a direct-to-consumer, clinician-led weight-management programme for women built around GLP-1 medication, digital support, and home testing. For later chapters, the most reusable ground truth is therefore not just
    that SheMed is a women’s health startup, but that it is specifically a regulated private-care subscription model sitting at the intersection of obesity treatment, telehealth, diagnostics, and consumer acquisition.'
