- id: capital-validation-and-milestones
  title: Capital signal, external validation, and dated milestones
  body: The October 2025 financing event is the chapter’s most important external validation point. SheMed, PRNewswire, Yahoo Finance, Digital Health, and EU-Startups all converge on a $50 million Series A at a $1 billion valuation, with proceeds aimed at scaling medical and technology teams, strengthening clinical infrastructure, and funding research plus patient-experience initiatives. Notably, SheMed also said investors were not being disclosed, which leaves a material gap in cap-table quality despite the headline valuation. Scale claims also need date discipline. Financing materials said the company had cared for more than 60,000 members in less than a year and called it the UK’s fastest-growing GLP-1 programme, while current official pages now market a 100,000-plus women community. Those are not necessarily contradictory because they appear to describe different dates and possibly different definitions of members versus community, but they should not be blended into one undated metric.
    The August 2025 Tasso partnership and the December 2024 start of the women-focused clinical study add further milestone depth by showing that SheMed was already investing in diagnostics and evidence-generation before or around the time it became a unicorn.
