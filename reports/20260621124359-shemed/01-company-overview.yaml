  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: investor-identity
    missingEvidence: Named Series A investors, their ownership stakes, board rights, and any liquidation preferences remain undisclosed.
    whyItMatters: The quality of the syndicate and the structure of the round matter for governance, follow-on support, and whether the unicorn headline should be trusted as market validation.
    diligencePath: Request the cap table, Series A term sheet, and board observer/director list directly from management.
    relatedQuestionRefs:
    - QO016
    - QO021
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: governance-depth
    missingEvidence: Public sources do not show independent directors, audit controls, or formal governance committees.
    whyItMatters: Founder concentration can be positive operationally but increases risk if board oversight, clinical-governance processes, or escalation structures are weak.
    diligencePath: Obtain board materials, governance policies, and biographies for independent directors or advisers.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Revenue, gross margin, retention, CAC, and payback metrics are not public.
    whyItMatters: Valuation discipline depends far more on economic durability than on member-growth headlines or pricing screenshots.
    diligencePath: Request cohort retention tables, marketing efficiency data, gross margin by medicine, and churn by dose/pathway.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: clinical-study-results
    missingEvidence: The company says early-2026 study results were expected, but the fetched clinical-study page does not yet publish them.
    whyItMatters: A female-focused GLP-1 dataset is part of SheMed’s differentiation narrative; without results, investors cannot test whether the evidence claim has matured.
    diligencePath: Ask management for the study preprint, protocol, topline data deck, and any ethics or publication status documents.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: minor
    topic: member-definition
    missingEvidence: Public materials use both 60,000+ members and 100,000+ women community without a common denominator or date frame.
    whyItMatters: User-count metrics are often used as valuation shorthand, so unclear definitions can overstate growth if community reach is mistaken for active paying members.
    diligencePath: Request a dated KPI bridge separating paying members, active patients, alumni, newsletter/community members, and cumulative treated lives.
    relatedQuestionRefs:
    - QO007
