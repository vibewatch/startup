- id: care-model-and-product-differentiation
  title: Care model, product scope, and claimed differentiation
  body: 'The company’s strongest operational differentiation claim is its insistence on a blood-test-first care pathway before prescribing GLP-1s. The homepage, FAQ, dedicated blood-test page, and Tasso announcement all state that treatment starts with an at-home blood test, after which clinicians review eligibility and tailor therapy. Publicly visible monitoring covers glycaemic, lipid, liver, kidney, cardiovascular, and thyroid-related markers, with follow-up testing at six and twelve months. Official materials also describe weekly check-ins, refill questionnaires, clinician access, side-effect support, and app-based tracking, which together make the offer more comprehensive than a medication-only online pharmacy. SheMed’s own positioning is explicit: it says many competitors prescribe from minimal questionnaires and without understanding how medication affects a woman’s body, whereas SheMed was built around women’s biology, hormonal context, and safety monitoring. Those claims are marketing-led,
    but they are directionally aligned with UK regulatory scrutiny that increasingly disfavors questionnaire-only obesity prescribing. As a result, even before testing commercial durability, the public record suggests SheMed’s product is a higher-friction but plausibly more defensible service architecture than a low-touch digital pharmacy funnel.'
