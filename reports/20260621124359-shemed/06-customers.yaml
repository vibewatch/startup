- id: adoption-trajectory-and-customer-proof
  title: Adoption trajectory and customer proof
  body: 'Public adoption evidence is strongest at two levels: broad market uptake and review-heavy consumer proof. At the market level, UCL says 1.6 million adults used weight-loss drugs in the prior year and 3.3 million were interested in using them next, while Worldpanel-based reporting says 1.9 million adults are current users in 2026. At the company level, SheMed claims more than 100,000 members or women on its current UK surfaces and 50,000+ on a SheMed.com surface, while prior funding coverage cited 60,000+ members. Review platforms add credibility but also noise. Trustpilot shows SheMed rated Great at 4.2/5 and surfaces both enthusiastic and critical experiences. RatingFacts and Pharmacy UK similarly show a mix of easy onboarding, blood-test reassurance, app support, and delivery praise alongside concerns around pricing, communication, and occasional support gaps. That combination suggests real customer use at scale, but not yet clean institutional-grade customer proof. It also means
    the strongest present-day proof is consumer behavior and sentiment, not enterprise-style account evidence or audited health-system deployments.'
  claimRefs:
