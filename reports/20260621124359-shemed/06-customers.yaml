  rows:
  - - Mid-life self-pay women
    - Buyer=user=payer
    - Fast access to clinically guided GLP-1 treatment
    - Strongest independent demand signals in Health Foundation, UCL, Worldpanel
    - Core revenue base and brand fit
    - No public conversion split by age band
  - - NHS-constrained eligible women
    - Buyer=user, payer=self
    - Alternative to waiting for NHS pathway or not meeting rollout timing
    - Visible in Pharmacy UK and official SheMed positioning
    - High strategic value because urgency is clear
    - No public measure of how many come directly from NHS frustration
  - - First-time injection users seeking reassurance
    - Buyer=user=payer
    - Need blood-test reassurance, clinician review, and support
    - Review themes highlight safety and guidance value
    - Important for conversion and brand trust
    - No public first-time-user retention cohort
  - - Switcher cohort from rival providers
    - Buyer=user=payer
    - Move after dissatisfaction with support, price, or monitoring elsewhere
    - Explicit switch page and category review discussions
    - Potential lower-friction expansion route
    - No public switcher share or win rate
  - - Price-sensitive curious users
    - Buyer=user=payer
    - Want access but may churn if cost rises or side effects persist
    - Broad category studies show high demand but affordability friction
    - Large top-of-funnel but lower revenue quality
    - No public price-elasticity data
  - - Women's-health adjacency seekers
    - Buyer=user=payer
    - Value female-focused framing, metabolic context, and broader health interpretation
    - Official positioning and clinical-study narrative
    - Supports differentiation and future expansion
    - No public breakdown by PCOS/menopause/etc.
  notes: Segmentation is built from public demand studies, company positioning, and customer-proof sources rather than private CRM data.
