  title: Customers
summary: The public evidence points to a customer base centered on self-paying, mid-life women seeking faster and more supported GLP-1 access than the NHS offers. SheMed has broad consumer proof through large review volumes and community claims, but the strongest independent evidence still describes category demand and review sentiment rather than verified retention or cohort economics at SheMed specifically.
sections:
- id: segments-and-demand-shape
  title: Customer segments and where demand is concentrated
  body: SheMed's likely customer base is narrower than the broad UK obesity population. The strongest signals point to self-paying women in mid-life who want clinically guided access, more support than generic online pharmacies offer, and faster treatment than NHS pathways currently provide. Official SheMed pages target women explicitly and foreground blood-test reassurance, branded medication, and weekly support. Independent market evidence aligns with that positioning. The Health Foundation's private GLP-1 work shows usage concentrated among women and especially among ages 35 to 54, while UCL and Worldpanel data show similar sex and age skews in wider UK use. That does not mean every customer is affluent or urban, but it does mean the visible private market is concentrated where women have both motivation and ability to self-fund.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
