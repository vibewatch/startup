  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: A women-focused weight-management and metabolic-care programme that combines GLP-1 access, mandatory baseline blood testing, clinician review, refill questionnaires, app-based tracking, weekly check-ins, and side-effect support.
  customerFocus: UK women seeking faster, more personalized, and more clinically guided weight-management care, especially those dissatisfied with generic online prescribing or constrained NHS access.
  businessModel: Subscription-led private telehealth monetization built around medication access, diagnostics, clinician oversight, and support services. Public pricing is visible, but realized revenue mix, retention, and gross margin are not disclosed.
  stage: Series A private company / unicorn-marked
  fundingStatus: Last closed public financing is the October 2025 $50 million Series A at a reported $1 billion valuation. Public materials do not disclose investor identity, ownership stakes, or preference terms.
