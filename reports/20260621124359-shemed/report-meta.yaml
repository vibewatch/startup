companyProfile:
  summary: SheMed is a London-based women’s GLP-1 telehealth company founded by Olivia and Chloe Ferro in April 2024. The company positions itself around a blood-test-first, women-specific metabolic-care workflow that combines at-home diagnostics, clinician review, branded medication access, and ongoing subscription support. Public funding coverage shows the company reached a reported $1 billion valuation unusually quickly, but the public record remains much stronger on demand narrative and care design than on standalone financial disclosure or cap-table transparency.
  foundedDate: '2024-04-01'
  founders:
  - name: Olivia Ferro
    role: Co-founder and CEO
    background: SheMed co-founder who publicly ties the company’s origin to her own search for answers to an undiagnosed health issue and experience as a GLP-1 patient.
    claimRefs:
    - CO002
