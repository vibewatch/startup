      - [Company size, "fewer than 30 employees", "2026-05-13", "Tech.eu", medium, "Small team is consistent with an early research stage", "Employees are not customers and do not indicate utilization"]
      - [Developer attention, "23 listed forks in fetched GitHub network page", "2026-10-24 access", "GitHub", low, "Shows repository interest, not verified product usage", "No unique users, clones, downloads, or conversion denominator"]
      - [Reported public product progress, "Automated-research benchmarks and the Flint local coding model", "By 2026-10", "AI Atlas and Silicon Valley Invest Club", medium, "Creates a developer-facing evaluation surface after the pre-product May launch", "No download, active-user, paid-conversion, or production-deployment denominator"]
      - [Compute relationship, "$410 million multi-year AWS collaboration reported", "2026-07", "Silicon Valley Invest Club", low, "May indicate scaling capacity or strategic infrastructure access", "Agreement scope, spend, revenue treatment, and customer status are not independently verified"]
      - [Retention, null, "Not disclosed", "Assigned source pool", low, "NRR, GRR, churn, and renewals cannot be assessed", "Customer cohort, contract dates, and renewal denominator"]
    notes: "Values retain their source periods and qualifiers. The GitHub fork count is a count of entries visible in the fetched network page at access, not a claimed active-user metric; the AWS figure is explicitly treated as compute spend/relationship evidence rather than revenue."
    claimRefs: [CU005, CU006, CU007, CU008, CU010, CU013]
