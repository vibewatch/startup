schemaVersion: "report-v2"
artifact: customers
slug: recursive
runDate: 2026-10-24
company:
  name: Recursive
chapter:
  number: 6
  title: Customers
  summary: Recursive's public customer evidence remains immature and is dominated by investor and technical signaling rather than named commercial deployments. The available record supports an audience of frontier-AI builders and research organizations, but does not substantiate customer count, paid usage, retention, or concentration.
sections:
  - id: buyer-and-user-segments
    title: Buyer and user segments
    body: Recursive's apparent customer surface is not yet a conventional enterprise software funnel. Contemporary coverage describes a lab pursuing automated AI research and says it had no released product, while later public profiles describe the Eureka Machine as an internal or research-oriented loop and Recursive Flint as a local coding model. The plausible users are therefore frontier-model laboratories, AI engineering teams, and developers evaluating local coding models, but these are market-facing use cases rather than verified paying segments. Investor participation from GV, Greycroft, Nvidia, and AMD identifies strategic interest and possible compute relationships, not customer contracts. The central diligence question is whether Recursive is selling access, licensing weights, offering research partnerships, or primarily building proprietary capability.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: The adoption trajectory is bifurcated. May 2026 reporting described a company with fewer than 30 employees and no public product, which is consistent with pre-commercial development rather than active customer adoption. The assigned pool also contains a GitHub fork network for a repository named first-steps-toward-automated-ai-research, demonstrating developer attention but not usage by paying customers or production deployment. A later profile reports benchmark results, a multi-year AWS collaboration, and a local coding model released with Apache 2.0 weights; those facts may expand the addressable user surface, but the sources do not disclose downloads, active users, paid conversions, renewal, gross retention, or net retention. No cohort or denominator permits a reliable durability calculation.
    claimRefs: [CU003, CU005, CU006, CU007, CU008, CU010, CU013]
    tableRefs: [TU002]
  - id: named-proof-and-concentration
    title: Named proof, expansion, and concentration
    body: Named customer proof is the principal missing link. The sources name investors, strategic compute participants, researchers, and competing laboratories, but do not name a customer using Recursive in production or describe a customer outcome. The AWS collaboration reported in the pool is a cloud-compute relationship and must not be treated as customer revenue or proof of product-market fit. Likewise, open-source weights and a public repository can create a developer funnel without showing conversion into paid enterprise accounts. Until contracts, deployment references, usage telemetry, or customer-authored outcomes are available, expansion and concentration are unmeasurable. Diligence should request a customer-by-customer revenue and deployment schedule, contract status, renewal dates, and the share attributable to any strategic partner or single cloud provider.
    claimRefs: [CU002, CU006, CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
