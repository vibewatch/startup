      - [AI engineering organizations, "CIO, CTO, or model-platform owner", "Model evaluation, training, post-training, and infrastructure workflows", "Potential enterprise buyer implied by the research-automation thesis; no procurement evidence", "Verify security review, deployment architecture, pricing, and paid pilots"]
      - [Local coding developers, "Individual developers and engineering teams", "On-device or local agentic coding using Flint-class weights", "Apache 2.0 weights could widen access; downloads and active usage are undisclosed", "Request download, active-user, retention, and support telemetry"]
      - [Cloud and compute ecosystem, "Cloud provider / strategic infrastructure partner", "Large-scale execution of research loops", "AWS collaboration is strategically important infrastructure evidence, not disclosed customer revenue", "Review agreement, spend commitments, economics, and counterparty concentration"]
    notes: "Segments are analytical categories inferred from public product descriptions and reported relationships; no source provides a complete customer census, payer mix, or revenue allocation."
    claimRefs: [CU001, CU003, CU009, CU010, CU011]
  - id: TU002
