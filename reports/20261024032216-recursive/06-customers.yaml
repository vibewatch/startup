      - [Nvidia, "Strategic investor / compute ecosystem", "Participation in the May 2026 financing", "Investor relationship, not customer proof", "Strategic interest in the thesis", "Equity participation does not establish paid product use"]
      - [AMD, "Strategic investor / compute ecosystem", "Participation in the May 2026 financing", "Investor relationship, not customer proof", "Strategic interest in the thesis", "Equity participation does not establish deployment or retention"]
      - [GitHub developer community, "Developer / research audience", "Forks of first-steps-toward-automated-ai-research", "Public repository activity; production use unknown", "23 fork entries visible in fetched page", "Forks do not identify organizations, active users, or commercial outcomes"]
    enumerationScope:
      coverage: sample
      basis: "Publicly named counterparties and developer signals present in the assigned evidence pool as of 2026-10-24; no complete customer list is available."
    notes: "This is a bounded public-evidence sample, not an exhaustive customer enumeration. Investors, infrastructure counterparties, and developer activity are intentionally labeled separately from named paying customers."
    claimRefs: [CU002, CU004, CU006, CU009, CU010, CU011, CU012]
