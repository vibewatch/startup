      - [Recursive contract model, null, "Unavailable", "No evidence of API, license, usage, or services mix", "Request standard order forms and billing model"]
      - [Modal Starter plan, "$0 + compute per month; $30 monthly free credits", "External compute proxy", "Not Recursive pricing or revenue", "Benchmark cloud pass-through and gross-margin assumptions"]
      - [Modal Team plan, "$250 + compute per month; $100 monthly free credits", "External compute proxy", "Not a comparable customer contract", "Compare with Recursive's expected buyer and support scope"]
      - [Modal Enterprise plan, "Custom; volume discounts and higher GPU concurrency", "External compute proxy", "Does not imply Recursive enterprise terms", "Test discounting, minimum commits, and renewal economics"]
      - [Non-preemptible sandbox usage, "3x list price", "External cost behavior", "Not Recursive's unit cost or markup", "Model burst, reserved, and non-preemptible workloads separately"]
    notes: "Modal is included only as an external benchmark for compute-linked pricing mechanics; Recursive's realized prices and monetization remain unavailable."
    claimRefs: [CI006, CI007, CI008]
  - id: TI003
    title: Unit-economics inputs and underwriting status
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, null, low, "Without revenue there is no revenue multiple or sales-efficiency denominator", "Obtain monthly recognized revenue by contract and customer"]
      - [ARR, null, low, "ARR would indicate recurring commercial traction but is not disclosed", "Reconcile signed recurring contracts to recognized revenue"]
      - [Gross margin, null, low, "Compute and research labor may materially affect contribution economics", "Provide cost-of-revenue schedule and allocation policy"]
      - [CAC or sales efficiency, null, low, "No customer and spend data supports CAC or payback", "Provide GTM spend, pipeline conversion, and cohort data"]
      - [Monthly burn, null, low, "Burn is required to convert capital into runway", "Provide 12-month actual burn and forward budget"]
      - [Runway, null, low, "Capital adequacy depends on cash and burn, not total funding alone", "Provide cash balance, restricted cash, commitments, and runway case"]
      - [Compute cost per research loop, null, low, "Core operating loop may scale variable cost faster than revenue", "Provide GPU-hours, memory, storage, and failed-experiment cost"]
      - [Revenue per researcher, null, low, "Small-team productivity cannot substitute for monetization evidence", "Provide headcount, output, customer, and revenue bridge"]
    notes: "All nulls are deliberate evidence gaps, not zero values or estimates; proxy hardware and cloud data do not establish Recursive's economics."
    claimRefs: [CI003, CI009, CI010, CI011, CI012, CI014, CI016]
