company:
  name: Recursive
chapter:
  number: 4
  title: Financials
  summary: Recursive has disclosed substantial institutional financing and a high post-money valuation, but no public revenue, ARR, profitability, realized pricing, or runway figures. The financial case is therefore an option on automated AI research, with compute intensity and commercialization timing as the central underwriting uncertainties.
sections:
  - id: disclosed-capital-and-traction
    title: Disclosed capital, valuation, and public traction
    body: >-
      Recursive's clearest public financial fact is its May 2026 Series A financing. Plocamium reports $650 million raised and a $4.65 billion post-money valuation at launch, while Crunchbase describes a $500 million Series A and $4.5 billion valuation in its earlier unicorn-board account. The discrepancy is a timing and reporting issue, not a basis for averaging the figures: the later closed-round account is the stronger current reference, while the earlier report shows how the financing was described before close. No source in this pool reports revenue, ARR, gross margin, customer count, utilization, or commercial bookings. Silicon Valley Invest Club explicitly states that no audited revenue, ARR, or profitability figures are published and distinguishes the later AWS arrangement from revenue. The evidence therefore supports a funded research lab with a marked valuation, not a revenue multiple or cash-flow underwriting case. Headcount evidence is also early-stage: public descriptions range from more than 25 to 29 people in San Francisco and London, which indicates a small team but does not establish output per employee or sales capacity.
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: revenue-model-and-pricing
    title: Revenue model remains unproven
    body: >-
      Recursive's official description says the Eureka Machine automates ideation, implementation, and validation across the frontier AI research and development pipeline. That establishes an operating thesis, not a monetization mechanism. The assigned evidence does not show a public API price, enterprise license, paid pilot, customer contract, usage meter, or recognized revenue stream. The plausible routes are enterprise research licensing, strategic research partnerships, hosted compute-backed services, or downstream applications in scientific discovery, but each remains an open commercial hypothesis rather than a sourced fact. Modal's public pricing page is useful only as an external compute-economics reference: its plans combine a fixed platform fee with variable compute, and its enterprise tier uses custom pricing. That proxy illustrates how a compute-heavy service might separate platform access from usage, but it cannot be applied to Recursive's realized price, gross margin, or customer willingness to pay. Pricing diligence should therefore seek signed contracts, rate cards, billing records, and any revenue-recognition policy before assigning a multiple.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: cost-structure-and-unit-economics
    title: Compute is the dominant visible cost driver, but unit economics are unavailable
    body: >-
      Recursive's product thesis requires repeated experiments, training, validation, and infrastructure optimization. The official site describes many research paths running in parallel, and NVIDIA's H100 materials show why this can be capital intensive: the accelerator is specified at up to 700 watts configurable TDP, with 80GB GPU memory and 3.35TB/s memory bandwidth for the SXM configuration. Those are infrastructure characteristics, not Recursive's consumption or cost, so they should be treated as a cost-driver proxy rather than a company estimate. The public record does not disclose GPU fleet size, cloud commitments, reserved capacity, gross margin, researcher compensation, or service-delivery cost per experiment. A multi-year compute agreement, if confirmed in diligence, would need to be separated between committed spend, in-kind credits, and revenue because those categories have different cash and accounting effects. Until those inputs are obtained, CAC, payback, contribution margin, burn, and revenue per researcher remain unavailable rather than estimable from the financing amount.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy depends on an undisclosed runway and milestone plan
    body: >-
      The $650 million financing provides a substantial headline capital base, but the amount raised is not the same as cash available for operations after transaction terms, founder and employee liquidity, reserves, or committed obligations. The assigned sources do not disclose cash on hand, monthly burn, runway, debt, liquidation preferences, or a next-round trigger. Foundra's discussion illustrates why the cap table is unusually difficult to underwrite: it describes eight named co-founders and notes that the implied dilution calculation is not confirmed. That is contextual evidence, not a verified ownership schedule. The financial verdict is consequently mixed. Capital access and strategic investor participation reduce near-term financing risk, while the absence of revenue and operating-cost disclosure leaves valuation support dependent on a future capability milestone. The highest-value diligence is a cash bridge from the financing close to current cash, a 24-month budget by compute, people, and facilities, contract-level commitments, and milestone gates tied to reproducible research output and first monetization.
    claimRefs: [CI013, CI014, CI015, CI016]
    tableRefs: [TI001]
callouts:
  - calloutType: insight
    title: Financial underwriting is milestone-based, not revenue-based
    body: Public evidence supports a large financing and strategic backing, but not a revenue multiple, margin case, or runway calculation. The next investable proof point is reproducible capability linked to a credible commercialization path.
    claimRefs: [CI001, CI003, CI015]
  - calloutType: risk
    title: Compute intensity can outrun the capital headline
    body: Recursive's open-ended research loop may require sustained accelerator, memory, and experimentation spend; without disclosed utilization, commitments, or burn, the financing headline cannot establish capital adequacy.
    claimRefs: [CI009, CI010, CI013]
