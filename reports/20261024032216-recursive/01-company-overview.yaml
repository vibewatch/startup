company:
  name: Recursive
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Recursive is a late-2025 AI research lab built around automating the AI R&D loop. Independent
    reporting supports a $650 million Series A at a $4.65 billion post-money valuation and a
    launch-era team of fewer than 30, while revenue, customers, current headcount, governance,
    and detailed financing rights remain material diligence gaps.
sections:
  - id: identity-and-operating-snapshot
    title: Identity and operating snapshot
    body: >-
      Recursive was founded in 2025, with a UK subsidiary incorporated on December 31, 2025, and
      public profiles locating operations in San Francisco and London. The company is an AI
      research lab rather than a conventional application vendor: its stated operating thesis is
      to automate ideation, implementation, experimentation, and validation so that AI systems
      improve the AI research process itself. By October, one secondary profile reported a public
      product milestone, Recursive Flint, after June benchmark disclosures. The externally
      supportable snapshot is nevertheless narrow. Funding and valuation are well corroborated,
      but the assigned evidence does not establish audited revenue, ARR, customer count, an exact
      current headcount, or whether the two offices have different legal and operating roles.
    claimRefs: [CO001, CO002, CO003, CO004, CO013, CO014, CO016]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership depth is exceptional, while governance visibility is limited
    body: >-
      Public reporting identifies eight co-founders led by CEO Richard Socher and spanning
      Salesforce, You.com, Google DeepMind, OpenAI, Meta FAIR, Google Brain, and academia. That
      concentration of technical credentials helps explain why investors financed the company
      before conventional commercial metrics were visible. It also creates diligence questions
      that pedigree alone cannot answer. Series A Stories reported in April that Socher was still
      running You.com and AIX Ventures while leading Recursive, creating an identifiable bandwidth
      dependency around the chief executive. The assigned pool does not establish board
      composition, reserved matters, succession coverage, founder vesting, or material leadership
      changes since launch. Those are private-governance questions, not facts that can be inferred
      from the co-founder roster.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing moved rapidly from talks to a large Series A
    body: >-
      The financing record shows a compressed progression. AI Atlas says Bloomberg reported talks
      at a $4 billion valuation in January; April reporting described at least $500 million being
      assembled at a $4 billion pre-money valuation; and multiple later sources record a $650
      million Series A closing on May 13 at a $4.65 billion post-money valuation. TechCrunch says
      that round also represents total funding raised. GV and Greycroft led, with Nvidia and AMD
      participating. A secondary profile additionally reports a $410 million multi-year AWS
      compute agreement in July; that commitment is infrastructure spending, not revenue or cash
      available. The cap table, investor ownership, liquidation preferences, board rights, debt,
      secondaries, and remaining cash balance are not disclosed in the assigned evidence.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO015]
    tableRefs: [TO003]
  - id: milestone-progression
    title: Milestones show faster public execution after the financing
    body: >-
      Recursive moved from formation to a multibillion-dollar financing in roughly five months.
      The milestone record then shifted from organizational events to technical and infrastructure
      claims: June benchmark results, a July AWS collaboration, and an October model release. This
      sequence is more informative than treating the May financing as proof of operating scale.
      The June results were company-reported benchmark gains, the AWS agreement is a compute
      commitment rather than customer revenue, and the October Flint details currently rest on one
      retained secondary profile. No assigned source establishes audited commercial adoption or a
      current customer roster. The timeline therefore shows fundraising and product-development
      velocity, but not validated product-market fit or a complete adverse-event history.
    claimRefs: [CO001, CO002, CO008, CO009, CO010, CO014, CO015, CO016]
    figureRefs: [FO001]
