      - [Jeff Clune, Co-founder, "UBC professor; prior OpenAI and DeepMind roles", "AI-generating algorithms and open-endedness", "Medium: academic and research-program concentration"]
    notes: >-
      The roster synthesizes retained secondary reporting; role remits, employment status, board
      seats, succession coverage, and current time allocations have not been independently verified.
    enumerationScope:
      coverage: partial
      basis: >-
        The eight publicly identified co-founders are listed, but the broader executive team and
        board are not fully disclosed in the assigned evidence.
    claimRefs: [CO005, CO006, CO007]
