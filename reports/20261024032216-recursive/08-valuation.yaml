callouts:
  - calloutType: recommendation
    title: Research-more at the disclosed price
    body: "Recursive merits continued diligence because financing, team, infrastructure, and technical signals are unusually strong, but public evidence does not yet establish revenue-backed support for the $4.65 billion post-money valuation."
    claimRefs: [CV001, CV004, CV009, CV014]
  - calloutType: risk
    title: Compute commitment is not cash or revenue
    body: "The reported $410 million AWS agreement is described as multi-year compute spend; its size should not be counted as cash raised, cash available, ARR, or revenue without contract and accounting evidence."
    claimRefs: [CV002, CV003, CV004]
  - calloutType: assumption
    title: Scenario precision is intentionally limited
    body: "No numerical target return or exit value is assigned because public revenue, margin, usage, cap-table, preference, and customer evidence are not sufficient for a precise model."
    claimRefs: [CV004, CV009, CV013, CV015]

