  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product thesis and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Recursive's public thesis is to automate the work of AI research itself: generate ideas, implement them,
              run experiments, evaluate results, and use validated discoveries to improve subsequent research. Tech.eu
              reported that the company believes AI systems will improve themselves by analysing their own performance
              without human intervention, while The Next Web described the company's mission as autonomous knowledge
              discovery and open-ended optimisation. This is a research-infrastructure proposition, not a conventional
              API or packaged enterprise workflow. The intended user is an internal frontier-research organization that
              can supply substantial compute, evaluation infrastructure, and governance. Public reporting says the first
              target was AI research, with a later ambition to generalize the playbook to other scientific disciplines.
              The product boundary remains uncertain because the company has disclosed no independent product
              documentation or customer deployment evidence in the assigned sources.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE011
              - CE012
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The best-supported architecture is a closed research loop with distinct proposal, implementation,
              experiment, validation, and compounding stages. The assigned technical literature provides a useful
              boundary: AI systems increasingly perform planning, coding, experimentation, optimisation, and repair, but
              humans still generally set goals and evaluation criteria. The survey calls the gap between strong
              components and reliable end-to-end improvement the composition gap. Recursive's public description
              therefore supports a staged research engine, not a claim that the system already rewrites its own model
              architecture autonomously. The reported roadmap also points to a large-scale compute dependency: the
              planned autonomous training system requires infrastructure to run many experiments, and a reported
              strategic investment by Nvidia and AMD is consistent with that dependency, but does not prove technical
              performance. A public autoresearch environment provides a useful practitioner proxy for the operating
              model by exposing repeated experiments and retained improvements, although it is not evidence of
              Recursive-specific adoption.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE014
      - number: '5.3'
        title: Maturity, deployment and technical proof
        blocks:
          - type: paragraph
            body: >-
              Public evidence is mixed. Tech.eu's May 2026 report described a team of fewer than 30 and a company
              emerging from stealth, while The Next Web explicitly said it had no released product. A later
              company-profile source reports benchmark results for an automated research system and a
              40-billion-parameter local coding model, but those figures are not corroborated by a primary release,
              reproducible benchmark artifact, or customer reference in this pool. The prudent conclusion is that the
              research loop may have progressed beyond a purely conceptual thesis, while public proof of repeatability,
              external deployment, support obligations, reliability, and roadmap delivery remains incomplete. The
              assigned survey also cautions that a single successful run does not establish persistent, transferable,
              compounding improvement.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, safety and implementation risks
        blocks:
          - type: paragraph
            body: >-
              Recursive's core technical risk is not simply model quality; it is whether a self-improvement loop can
              preserve objective integrity, evaluation validity, and human control as changes compound. Anthropic's
              institute describes full recursive self-improvement as not yet achieved and warns that systems capable of
              building successors would make security, monitoring, and behavioral shaping more important. The technical
              survey distinguishes bounded self-refinement from open-ended systems that can modify their own evaluators,
              identifying the latter as the sharper safety surface. In practical diligence, Recursive needs to show
              sandboxing, rollback, independent evaluation, provenance of generated artifacts, access controls, incident
              handling, and a clear release or deployment policy. None of those controls is documented sufficiently in
              the assigned public evidence, so they remain material diligence gaps rather than inferred deficiencies.
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent technical thesis
            body: >-
              The company's stated loop aligns with an active AI4AI research frontier and is supported by a technically
              credible founding cohort, but thesis credibility is not the same as deployed-product proof.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE009
          - type: callout
            title: Proof and control surface are incomplete
            body: >-
              The assigned sources do not establish repeatable external deployments, durable compounding gains,
              independent benchmark replication, or a sufficiently documented safety and rollback regime.
            calloutType: risk
            claimRefs:
              - CE010
              - CE012
              - CE013
              - CE015
          - type: callout
            title: Underwrite the loop, not the narrative
            body: >-
              Request primary technical artifacts, held-out evaluations, intervention logs, compute economics, model or
              code release details, and governance controls before treating the research engine as product maturity.
            calloutType: recommendation
            claimRefs:
              - CE006
              - CE007
              - CE012
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segments
        blocks:
          - type: paragraph
            body: >-
              Recursive's apparent customer surface is not yet a conventional enterprise software funnel. Contemporary
              coverage describes a lab pursuing automated AI research and says it had no released product, while later
              public profiles describe the Eureka Machine as an internal or research-oriented loop and Recursive Flint
              as a local coding model. The plausible users are therefore frontier-model laboratories, AI engineering
              teams, and developers evaluating local coding models, but these are market-facing use cases rather than
              verified paying segments. Investor participation from GV, Greycroft, Nvidia, and AMD identifies strategic
              interest and possible compute relationships, not customer contracts. The central diligence question is
              whether Recursive is selling access, licensing weights, offering research partnerships, or primarily
              building proprietary capability.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
