      - number: '1.2'
        title: Leadership depth is exceptional, while governance visibility is limited
        blocks:
          - type: paragraph
            body: >-
              Public reporting identifies eight co-founders led by CEO Richard Socher and spanning Salesforce, You.com,
              Google DeepMind, OpenAI, Meta FAIR, Google Brain, and academia. That concentration of technical
              credentials helps explain why investors financed the company before conventional commercial metrics were
              visible. It also creates diligence questions that pedigree alone cannot answer. Series A Stories reported
              in April that Socher was still running You.com and AIX Ventures while leading Recursive, creating an
              identifiable bandwidth dependency around the chief executive. The assigned pool does not establish board
              composition, reserved matters, succession coverage, founder vesting, or material leadership changes since
              launch. Those are private-governance questions, not facts that can be inferred from the co-founder roster.
            claimRefs:
              - CO005
              - CO006
              - CO007
