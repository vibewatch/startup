        - Autonomous-agent oversight risks and human-accountability requirements are documented in legal analysis.
        - Published controls, external evaluations, and deployment evidence.
        - Governance diligence is a precondition to enterprise underwriting.
    notes: >-
      The rows separate company-specific evidence from the conditions that would validate or weaken each argument;
      benchmark claims are not treated as revenue claims.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV008
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario
    columns:
      - Scenario
      - Operating assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Repeatable AI-research gains become paid products; enterprise demand and compute efficiency improve.
        - The current price becomes supportable only if commercial scale and durable advantage emerge.
        - Execution, safety, compute availability, and competitive response.
        - Low-to-medium; evidence is promising but pre-commercial.
      - - Base
        - Research automation progresses and a product launches, but revenue and margin proof arrive slowly.
        - Hold or wait for a lower entry price and verified operating metrics; no precise multiple is supportable.
        - High compute cost, budget scrutiny, delayed adoption, and dilution.
        - Medium; consistent with current public evidence gaps.
      - - Bear
        - Benchmarks do not generalize or commercialization remains limited while compute obligations persist.
        - Downside is substantial because the disclosed price lacks public revenue underwriting.
        - Execution failure, governance constraints, customer concentration, and multiple compression.
        - Material; public evidence does not rule it out.
    notes: >-
      These are directional scenarios, not probability-weighted valuation outputs. The assigned evidence does not
      support numerical revenue forecasts, target returns, or precise exit multiples.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV015
