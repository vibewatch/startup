              - CU007
              - CU008
              - CU010
              - CU013
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory is bifurcated. May 2026 reporting described a company with fewer than 30 employees
              and no public product, which is consistent with pre-commercial development rather than active customer
              adoption. The assigned pool also contains a GitHub fork network for a repository named
              first-steps-toward-automated-ai-research, demonstrating developer attention but not usage by paying
              customers or production deployment. A later profile reports benchmark results, a multi-year AWS
              collaboration, and a local coding model released with Apache 2.0 weights; those facts may expand the
              addressable user surface, but the sources do not disclose downloads, active users, paid conversions,
              renewal, gross retention, or net retention. No cohort or denominator permits a reliable durability
              calculation.
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
