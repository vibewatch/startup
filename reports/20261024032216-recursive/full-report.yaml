        title: Financing moved rapidly from talks to a large Series A
        blocks:
          - type: paragraph
            body: >-
              The financing record shows a compressed progression. AI Atlas says Bloomberg reported talks at a $4
              billion valuation in January; April reporting described at least $500 million being assembled at a $4
              billion pre-money valuation; and multiple later sources record a $650 million Series A closing on May 13
              at a $4.65 billion post-money valuation. TechCrunch says that round also represents total funding raised.
              GV and Greycroft led, with Nvidia and AMD participating. A secondary profile additionally reports a $410
              million multi-year AWS compute agreement in July; that commitment is infrastructure spending, not revenue
              or cash available. The cap table, investor ownership, liquidation preferences, board rights, debt,
              secondaries, and remaining cash balance are not disclosed in the assigned evidence.
