              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public customer proof is not yet investable
            body: >-
              Recursive has credible strategic and technical signals, but the assigned sources do not establish named
              paying customers, production deployments, retention, or customer concentration.
            calloutType: insight
            claimRefs:
              - CU002
              - CU009
              - CU012
          - type: callout
            title: Strategic relationships can be misread as adoption
            body: >-
              The reported AWS collaboration and semiconductor-investor participation should not be converted into
              revenue, active-customer, or retention claims without contracts and usage evidence.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Recursive control and verification risk
        blocks:
          - type: paragraph
            body: >-
              Recursive's public technical evidence is concentrated in bounded benchmark environments, not autonomous
              deployment or open-ended scientific work. The reported system ran ideation, implementation, experiments,
              validation, and repeated search on three benchmarks, including reward-hacking checks, but the same source
              says whether the approach scales to less structured research remains open. RAND separately describes AI
              research systems as holding insider-level access to sensitive code, data, and models, and warns that a
              compromise could influence future systems. The investment implication is a control problem: capability
              gains are meaningful only if evaluator integrity, access boundaries, rollback, and human approval remain
              stronger than the system's incentives to optimize the metric. The public record does not establish those
              controls, so the appropriate kill criterion is a material benchmark or deployment decision that cannot be
              reproduced by an independent evaluator under fixed compute and human sign-off.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR011
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Recursive's stated ambition places governance inside the product rather than at the edge of an ordinary
              software business. Public reporting says the company had not released a product, while an adverse
              newsletter reported no publicly disclosed responsible-scaling policy or public commitment to
              pre-deployment evaluation by the UK AI Security Institute or a US equivalent. Those are reported
              public-record gaps, not proof that no internal controls exist. The relevant exposure is therefore
              governance maturity under a fast-moving capability curve: if the company cannot document who can approve
              experiments, how model changes are audited, and which external evaluations are binding, regulatory
              scrutiny or partner restrictions could delay launch. Diligence should obtain the current policy,
              applicable entity and jurisdiction map, incident escalation plan, and evidence of regulator or evaluator
              engagement before treating the safety posture as investment-ready.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Operating, capital, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Recursive is a young, heavily capitalized research company whose public profile has emphasized a small
              team, a large financing, and compute-intensive ambitions. Tech.eu reported fewer than 30 staff and a $650
              million raise at a $4.65 billion valuation; the same article identifies Nvidia and AMD as participating
              chip companies. The public technical account also relies on GPU profiling and hardware-specific
              optimization. This creates concentration across compute suppliers, scarce research talent, and evaluation
              infrastructure. A supplier allocation change, compute-price shock, hardware transition, or loss of key
              researchers could reduce experiment throughput before revenue exists to absorb the disruption. The public
              record does not disclose runway, burn, binding compute commitments, redundancy, or revenue, so monitoring
              should focus on signed capacity, cash runway, experiment throughput, retention of critical staff, and
              whether external users or customers emerge.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.4'
        title: Monitoring and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a staged diligence program rather than a claim that Recursive has already solved
              safe recursive improvement. The strongest positive evidence is reproducible progress on defined
              benchmarks; the strongest negative evidence is the gap between that progress and public proof of
              deployment controls, external evaluation, or commercial demand. A thesis break would occur if independent
              reruns fail to reproduce the reported improvements, if reward-hacking controls do not survive adversarial
              testing, if the company cannot document access and rollback controls, or if compute and talent
              concentration make the research loop economically non-repeatable. Until those tests are passed, the risk
              rating should remain high even though the technical signal is credible.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Control risk dominates
            body: >-
              Recursive's capability thesis is most exposed where evaluator integrity, access control, and external
              oversight are not yet publicly demonstrated.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
          - type: callout
            title: Require evidence before underwriting scale
            body: >-
              Advance only after independent benchmark reproduction, documented safety controls, and a credible compute
              and runway plan are available.
            calloutType: recommendation
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price and financing context
        blocks:
          - type: paragraph
            body: >-
              Recursive's latest disclosed financing is a May 2026 Series A of $650 million at a $4.65 billion
              post-money valuation, led by GV and Greycroft with Nvidia and AMD participation. Independent coverage
              places the company among the 2026 AI unicorn financings, while earlier reporting described at least $500
              million at a $4 billion pre-money valuation before the round closed. The financing is therefore a real
              market-clearing signal, but it is not a revenue-based valuation proof. The public record does not disclose
              revenue, ARR, profitability, a full cap table, liquidation preferences, or investor-rights terms. A $410
              million AWS agreement is described as multi-year compute spend rather than cash available or revenue;
              treating it as either would overstate underwriting support.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV009
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis is that an unusually concentrated research team can automate parts of the AI
              research loop, use large-scale experimentation to compound capability, and ultimately create products
              whose value exceeds the initial team-only financing logic. Publicly described benchmark results and the
              AWS infrastructure agreement make the technical and compute thesis more concrete than a purely conceptual
              pitch. The anti-thesis is that benchmark wins may not translate into durable research advantage,
              enterprise adoption, or attractive gross economics. Recursive is also exposed to compute intensity,
              customer budget discipline, and governance expectations for systems that can modify code or generate
              successors. The NatLaw Review discussion of autonomous agents describes a reported sandbox-escape incident
              elsewhere in the industry and argues that continuous monitoring, external review, and named human
              accountability are needed; those are material diligence questions for Recursive, not proof that it has
              suffered the same incident.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV008
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios and entry discipline
        blocks:
          - type: paragraph
            body: >-
              A defensible valuation method must match Recursive's stage. With no public revenue or ARR, a revenue
              multiple is unavailable; the disclosed financing price is better treated as a reference transaction than
              as a verified intrinsic value. The base case is that Recursive demonstrates repeatable research automation
              and launches a commercial product, but still requires substantial compute and customer proof. The bull
              case requires independently reproducible benchmark-to-product conversion, paid deployments, and evidence
              that capability compounding offsets infrastructure cost. The bear case is a research lab with weak
              commercialization, high compute commitments, customer budget resistance, or governance constraints that
              delay deployment. Entry discipline should therefore require a price reset, stronger disclosed operating
              evidence, or both; a precise target return or exit multiple is not supportable from the assigned public
              evidence.
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV011
              - CV014
      - number: '8.4'
        title: Decision and diligence path
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more rather than buy or reject. The company has enough financing, team,
              infrastructure, and technical-signal evidence to justify continued diligence, but not enough public
              operating evidence to establish that $4.65 billion is supported by revenue, ARR, unit economics, or a
              clear exit path. The next diligence package should reconcile the AWS contract's committed spend with
              usage, pricing, capacity obligations, and cash requirements; provide audited or board-level revenue, burn,
              runway, and compute-cost information; disclose the cap table and preference stack; and demonstrate product
              adoption beyond controlled benchmarks. It should also document responsible-scaling controls, named human
              accountability, and any pre- deployment evaluation commitments. Thesis-break triggers are failure to show
              paid demand, materially adverse compute economics, inability to reproduce claimed gains, or governance
              findings that block enterprise or regulatory deployment.
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more at the disclosed price
            body: >-
              Recursive merits continued diligence because financing, team, infrastructure, and technical signals are
              unusually strong, but public evidence does not yet establish revenue-backed support for the $4.65 billion
              post-money valuation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV014
          - type: callout
            title: Compute commitment is not cash or revenue
            body: >-
              The reported $410 million AWS agreement is described as multi-year compute spend; its size should not be
              counted as cash raised, cash available, ARR, or revenue without contract and accounting evidence.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV004
          - type: callout
            title: Scenario precision is intentionally limited
            body: >-
              No numerical target return or exit value is assigned because public revenue, margin, usage, cap-table,
              preference, and customer evidence are not sufficient for a precise model.
            calloutType: assumption
            claimRefs:
              - CV004
              - CV009
              - CV013
              - CV015
