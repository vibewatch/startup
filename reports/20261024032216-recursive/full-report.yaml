              - CU006
              - CU007
              - CU008
              - CU010
              - CU013
      - number: '6.3'
        title: Named proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is the principal missing link. The sources name investors, strategic compute
              participants, researchers, and competing laboratories, but do not name a customer using Recursive in
              production or describe a customer outcome. The AWS collaboration reported in the pool is a cloud-compute
              relationship and must not be treated as customer revenue or proof of product-market fit. Likewise,
              open-source weights and a public repository can create a developer funnel without showing conversion into
              paid enterprise accounts. Until contracts, deployment references, usage telemetry, or customer-authored
              outcomes are available, expansion and concentration are unmeasurable. Diligence should request a
              customer-by-customer revenue and deployment schedule, contract status, renewal dates, and the share
              attributable to any strategic partner or single cloud provider.
            claimRefs:
              - CU002
