              - CM004
              - CM005
              - CM006
              - CM011
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The most plausible first buyer is a frontier-model lab or AI-intensive organization with a central
              research budget and authority to change its development loop. Researchers, evaluation engineers, and ML
              infrastructure teams would use the system; a CTO, chief scientist, CIO, or AI-platform leader would
              control payment. Large enterprises are a second segment, particularly for R&D, knowledge-management, and
              software workflows, but their adoption path is more gated: scoped pilot, benchmarked outcome, governance
              review, integration with data and infrastructure, then controlled production expansion. The trigger is
              measurable improvement in experiment velocity, quality, or cost per useful result. Public evidence does
              not identify Recursive customers, prices, contract structures, or retention, so these segments remain
              evidence-based hypotheses rather than observed demand.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM013
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM013
              - CM014
              - CM016
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption has real tailwinds: Deloitte reports expanding worker access and production deployment, while
              Gartner expects more models and agents to enter multistep enterprise workflows. Yet broad adoption does
              not guarantee a premium research-automation market. Deloitte finds that only one in five surveyed
              companies has mature governance for autonomous agents, and it identifies insufficient skills as the
              largest integration barrier. CNBC reports companies restricting AI spend, switching to cheaper
              alternatives, and delaying large commitments until ROI is clearer; GitHub's own model routing emphasizes
              that many tasks do not require the most reasoning- or token-intensive model. Recursive must therefore
              prove reproducible research gains under cost controls, auditability, and human oversight. Until pricing
              and customer outcomes are disclosed, market growth supports strategic relevance but cannot independently
              underwrite valuation.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad spending is not obtainable market
            body: >-
              Public forecasts establish a large AI economy, but Recursive still needs a disclosed product boundary,
              pricing unit, target-account count, sales geography, and customer proof before a bottom-up SAM or SOM can
              be underwritten.
            calloutType: risk
            claimRefs:
              - CM006
              - CM016
          - type: callout
            title: Efficiency can expand usage while compressing willingness to pay
            body: >-
              Model routing and cheaper alternatives can make AI workflows more economical, but they also increase buyer
              pressure on premium pricing and force Recursive to prove value per useful research outcome rather than
              rely on category growth.
            calloutType: insight
            claimRefs:
              - CM010
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is broader than labs using the word "recursive." Recursive targets the full
              AI-research cycle: selecting ideas, implementing experiments, validating results, and retaining
              discoveries for later work. Weco's AIDE2 is a direct technical benchmark because it recursively rewrites
              an AI research agent and tests accepted revisions under fixed budgets. Ricursive Intelligence is an
              adjacent specialist that applies a feedback loop to chip design, where model and hardware progress can
              reinforce each other. The AI Scientist is a workflow substitute for users who want idea-to-paper
              automation rather than a proprietary research engine. OpenAI, Anthropic, and Google DeepMind are incumbent
              capability competitors: they already apply AI inside research workflows and can distribute improvements
              through existing model, API, and developer relationships. Internal research teams remain the status quo
              because buyers can assemble models, evaluation harnesses, compute, and domain researchers without
              purchasing a separate Recursive product, although that path shifts integration and validation costs onto
              the buyer.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.2'
        title: Capability, distribution, and positioning
        blocks:
          - type: paragraph
            body: >-
              Public evidence separates technical validation from commercial readiness. Weco reports seven accepted
              improvements during an eight-day run, transfer to four held-out benchmarks, and a reward-hacking decline
              from 55% to 32%; it also says the ignition test was inconclusive, which limits claims that the improved
              agent can accelerate its own next cycle. Recursive's evidence advanced after its May launch: October
              profiles describe Eureka benchmark results and a Flint coding model, but those reports do not establish
              independent reproduction, named customer outcomes, or a repeatable procurement motion. Ricursive offers a
              narrower chip-design wedge supported by a team associated with AlphaChip and other design work. Incumbents
              retain the strongest distribution position because research acceleration can be bundled into tools and
              model access buyers already use. The positioning map therefore uses explicit ordinal judgments, not market
              share or measured product quality, and keeps scope separate from validation maturity.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP007
              - CP008
              - CP011
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Pricing, switching, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not disclose comparable list prices, usage units, contract terms, or discounts
              for Recursive, Weco, Ricursive, or the automated-research alternatives. It also does not show named
              Recursive customers, renewals, multi-homing behavior, or measured switching costs. Any lock-in thesis must
              therefore remain conditional: a deployed research system could accumulate proprietary experiment
              histories, evaluation suites, and workflow integrations, but public sources do not demonstrate that this
              has occurred. Recursive's $650 million financing and backing from both Nvidia and AMD can support compute
              access and hiring, while Ricursive's $335 million backing and frontier incumbents' much larger capital
              bases show that money and hardware relationships are not exclusive. A further adverse signal comes from
              criticism of The AI Scientist's automated review: a public critique argues that unseen figures and
              differing reviewer behavior can overstate paper quality. Recursive's durable advantage will depend on
              independently reproducible gains, trusted evaluation, customer-specific integration, and speed of
              iteration before incumbents absorb the same methods.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The closest proof competitor is a method, not a company
            body: >-
              Weco's AIDE2 paper offers the strongest retained evidence that a research agent can improve its own
              harness under fixed evaluation budgets, but it does not establish enterprise packaging or customer demand.
            calloutType: insight
            claimRefs:
              - CP003
              - CP004
          - type: callout
            title: Capital and chip access are not exclusive moats
            body: >-
              Recursive has substantial financing and strategic semiconductor investors, but Ricursive and frontier
              incumbents also command large capital or hardware relationships; durable differentiation must come from
              validated research velocity and customer workflow lock-in.
            calloutType: risk
            claimRefs:
