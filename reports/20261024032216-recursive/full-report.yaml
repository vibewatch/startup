chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating snapshot
        blocks:
          - type: paragraph
            body: >-
              Recursive was founded in 2025, with a UK subsidiary incorporated on December 31, 2025, and public profiles
              locating operations in San Francisco and London. The company is an AI research lab rather than a
              conventional application vendor: its stated operating thesis is to automate ideation, implementation,
              experimentation, and validation so that AI systems improve the AI research process itself. By October, one
              secondary profile reported a public product milestone, Recursive Flint, after June benchmark disclosures.
              The externally supportable snapshot is nevertheless narrow. Funding and valuation are well corroborated,
              but the assigned evidence does not establish audited revenue, ARR, customer count, an exact current
              headcount, or whether the two offices have different legal and operating roles.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
              - CO014
              - CO016
