  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Recursive's core market is not the full AI economy. Current descriptions center on systems that automate
              the AI research loop, including ideation, evaluation, data selection, implementation, training,
              post-training, and validation. The closest addressable boundary is therefore software or services used by
              frontier labs and advanced enterprise AI teams to improve research throughput. Adjacent spending includes
              AI models, data-science platforms, cloud services, and infrastructure, but those categories should enter a
              market model only when a priced Recursive offering captures them. General chatbot seats, unrelated
              enterprise applications, semiconductors, servers, and broad consulting are excluded. The principal
              substitutes are human research teams, internal tooling, model APIs, open-source models, and routing
              systems that reduce the need to use an expensive frontier model for every task.
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM014
              - CM015
      - number: '2.2'
        title: Sizing lenses without a fabricated TAM
        blocks:
          - type: paragraph
            body: >-
              Gartner forecasts $2.595667 trillion of worldwide AI spending in 2026, including $1.431509 trillion of
              infrastructure, $585.527 billion of services, $453.209 billion of software, and $32.604 billion of models.
              These values share a period, geography, and spending basis, but they do not form Recursive's TAM, SAM, or
              SOM: infrastructure alone includes hyperscaler capacity and hardware that a research-automation vendor may
              consume rather than monetize. The table and pyramid consequently show market context and adjacent budget
              pools, not obtainable revenue. A defensible bottom-up estimate still requires a defined product, revenue
              unit, buyer population, price, sales geography, and evidence of the share of research budgets that can
              migrate from people, compute, and internal tools to Recursive.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
