  - id: FE001
    title: Recursive research-loop architecture
    type: stack
    summary: >-
      A staged view of how Recursive's proposed research engine could turn ideas into validated artifacts while
      retaining control points.
    data:
      layers:
        - name: Control and governance
          label: Control and governance
          detail: Human-set goals and independent checks bound the loop.
          items:
            - name: Human direction
              detail: Set goals, constraints and escalation rules; public evidence says this remains important.
            - name: Independent evaluation
              detail: Check results against held-out tests and prevent evaluator drift.
        - name: Research loop
          label: Research loop
          detail: The proposed engine turns hypotheses into tested artifacts.
          items:
            - name: Ideation
              detail: Generate hypotheses and candidate changes.
            - name: Implementation
              detail: Write code and configure experiments.
            - name: Experimentation
              detail: Run parallel jobs using compute and data.
            - name: Validation
              detail: Measure performance and retain only supported changes.
        - name: Outputs
          label: Outputs
          detail: Validated artifacts may seed later research or future domain transfer.
          items:
            - name: AI-research artifacts
              detail: Models, code, data or training procedures that may seed the next iteration.
            - name: Transfer to science
              detail: Long-term company ambition; not established as a deployed capability.
        - name: Compute and data
          label: Compute and data
          detail: Training, inference, datasets and experiment budget support the loop.
          items:
            - name: Parallel execution
              detail: Run many research threads subject to disclosed compute and orchestration limits.
        - name: Evidence and provenance
          label: Evidence and provenance
          detail: Evaluation records must identify what changed and why it survived.
          items:
            - name: Reproducible records
              detail: Retain code, data, metrics and lineage for independent reruns.
        - name: Deployment boundary
          label: Deployment boundary
          detail: External release requires safety, access and support controls.
          items:
            - name: Release gates
              detail: No assigned source establishes a customer-ready deployment or complete control policy.
    approximationNotes: >-
      The figure is an analytical architecture derived from disclosed product claims and independent AI4AI taxonomy, not
      a verified internal system specification.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE014
