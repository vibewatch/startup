company:
  name: Recursive
chapter:
  number: 3
  title: Competitors
  summary: >-
    Recursive competes on the breadth and compounding speed of an automated AI-research loop, but
    Weco's AIDE2 paper currently provides the strongest public benchmark evidence for recursive
    improvement while Ricursive and frontier incumbents bring narrower specialization or greater
    distribution. Recursive's October product evidence improves its position from launch, yet public
    pricing, customer switching data, and independently reproduced commercial outcomes remain absent.
sections:
  - id: competitive-landscape
    title: Competitive landscape and strategic alternatives
    body: >-
      The relevant landscape is broader than labs using the word "recursive." Recursive targets the
      full AI-research cycle: selecting ideas, implementing experiments, validating results, and
      retaining discoveries for later work. Weco's AIDE2 is a direct technical benchmark because it
      recursively rewrites an AI research agent and tests accepted revisions under fixed budgets.
      Ricursive Intelligence is an adjacent specialist that applies a feedback loop to chip design,
      where model and hardware progress can reinforce each other. The AI Scientist is a workflow
      substitute for users who want idea-to-paper automation rather than a proprietary research
      engine. OpenAI, Anthropic, and Google DeepMind are incumbent capability competitors: they
      already apply AI inside research workflows and can distribute improvements through existing
      model, API, and developer relationships. Internal research teams remain the status quo because
      buyers can assemble models, evaluation harnesses, compute, and domain researchers without
      purchasing a separate Recursive product, although that path shifts integration and validation
      costs onto the buyer.
    claimRefs: [CP001, CP003, CP005, CP007, CP008]
    tableRefs: [TP001]
  - id: capability-distribution-and-positioning
    title: Capability, distribution, and positioning
    body: >-
      Public evidence separates technical validation from commercial readiness. Weco reports seven
      accepted improvements during an eight-day run, transfer to four held-out benchmarks, and a
      reward-hacking decline from 55% to 32%; it also says the ignition test was inconclusive, which
      limits claims that the improved agent can accelerate its own next cycle. Recursive's evidence
      advanced after its May launch: October profiles describe Eureka benchmark results and a Flint
      coding model, but those reports do not establish independent reproduction, named customer
      outcomes, or a repeatable procurement motion. Ricursive offers a narrower chip-design wedge
      supported by a team associated with AlphaChip and other design work. Incumbents retain the
      strongest distribution position because research acceleration can be bundled into tools and
      model access buyers already use. The positioning map therefore uses explicit ordinal judgments,
      not market share or measured product quality, and keeps scope separate from validation maturity.
    claimRefs: [CP002, CP003, CP004, CP006, CP008, CP009]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: pricing-switching-and-moat
    title: Pricing, switching, and moat durability
    body: >-
      The assigned evidence does not disclose comparable list prices, usage units, contract terms, or
      discounts for Recursive, Weco, Ricursive, or the automated-research alternatives. It also does
      not show named Recursive customers, renewals, multi-homing behavior, or measured switching
      costs. Any lock-in thesis must therefore remain conditional: a deployed research system could
      accumulate proprietary experiment histories, evaluation suites, and workflow integrations, but
      public sources do not demonstrate that this has occurred. Recursive's $650 million financing
      and backing from both Nvidia and AMD can support compute access and hiring, while Ricursive's
      $335 million backing and frontier incumbents' much larger capital bases show that money and
      hardware relationships are not exclusive. A further adverse signal comes from criticism of The
      AI Scientist's automated review: a public critique argues that unseen figures and differing
      reviewer behavior can overstate paper quality. Recursive's durable advantage will depend on
      independently reproducible gains, trusted evaluation, customer-specific integration, and speed
      of iteration before incumbents absorb the same methods.
    claimRefs: [CP010, CP011, CP012, CP013, CP014, CP015, CP016]
    tableRefs: [TP003]
