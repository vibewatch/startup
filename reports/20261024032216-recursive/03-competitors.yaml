          y: 5
          note: "Harness-focused scope with repeated fixed-budget improvements and held-out benchmark reporting."
        - label: Ricursive Intelligence
          x: 2
          y: 2
          note: "Narrower chip-design focus; team credentials and financing are visible, while startup-platform validation is not retained."
        - label: Frontier incumbents
          x: 4
          y: 4
          note: "Broad research activity and established distribution, without a retained like-for-like Recursive product comparison."
        - label: The AI Scientist
          x: 4
          y: 2
          note: "Broad paper workflow, but a public critique identifies automated-evaluation blind spots."
        - label: Internal build
          x: 3
          y: 1
          note: "Scope is buyer-defined; no common public validation basis exists across organizations."
      xAxis: "Research-loop breadth (ordinal 1=narrow component, 5=full AI R&D cycle)"
      yAxis: "Public validation maturity (ordinal 1=buyer-specific or undisclosed, 5=multiple held-out benchmarks)"
    approximationNotes: "Coordinates are analyst-authored ordinal scores derived from the retained evidence; they are not measured capability, market share, or benchmark-normalized performance."
    claimRefs: [CP002, CP003, CP004, CP005, CP006, CP007, CP008]
callouts:
  - calloutType: insight
    title: The closest proof competitor is a method, not a company
    body: "Weco's AIDE2 paper offers the strongest retained evidence that a research agent can improve its own harness under fixed evaluation budgets, but it does not establish enterprise packaging or customer demand."
    claimRefs: [CP003, CP004]
  - calloutType: risk
    title: Capital and chip access are not exclusive moats
    body: "Recursive has substantial financing and strategic semiconductor investors, but Ricursive and frontier incumbents also command large capital or hardware relationships; durable differentiation must come from validated research velocity and customer workflow lock-in."
    claimRefs: [CP006, CP009, CP010, CP015]
