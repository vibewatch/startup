  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: deployment
      missingEvidence: Primary technical documentation, model or code artifacts, and named production deployments for the research loop.
      whyItMatters: Without a reproducible artifact or customer reference, public roadmap language cannot establish product maturity or reliability.
      diligencePath: Obtain a technical demonstration, deployment references, access boundaries, intervention logs and independently verifiable evaluation results.
      relatedQuestionRefs: [QE002, QE004, QE006]
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: Repeated held-out experiments showing persistent, transferable and compounding improvement.
      whyItMatters: A single benchmark or successful run can reflect search budget, evaluator leakage or a transient result rather than a durable research advantage.
      diligencePath: Request preregistered held-out evaluations, failure distributions, ablations, independent reruns and longitudinal successor comparisons.
      relatedQuestionRefs: [QE006, QE009]
    - type: missing-source
      severity: material
      topic: safety
      missingEvidence: Responsible-scaling policy, sandbox design, rollback controls, evaluator independence and incident process.
      whyItMatters: A system that changes research artifacts or evaluators can amplify errors and make ordinary model-quality checks insufficient.
      diligencePath: Review governance documents, threat models, access controls, audit logs, red-team results and release gates.
      relatedQuestionRefs: [QE007, QE010]
    - type: missing-source
      severity: material
      topic: developer-signal
