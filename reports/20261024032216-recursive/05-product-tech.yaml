    columns: [Module or asset, User, Public status, Differentiation, Diligence gap]
    rows:
      - [Eureka Machine, "Internal AI research teams", "Publicly described; external maturity unverified", "Automates ideation, implementation, experiments and validation", "Need reproducible runs, independent benchmark artifacts and failure-rate data"]
      - [Autonomous training system, "Frontier-model researchers", "Roadmap / planned public launch reported for mid-2026", "Targets the training loop rather than only model inference", "Need evidence of launch, autonomy boundary, compute budget and human intervention rate"]
      - [Recursive Flint, "Developers needing local coding inference", "Reported by a secondary company-profile source; no primary release in pool", "40B mixture-of-experts design with local inference positioning", "Need primary weights, license, model card, safety tests and independent benchmark replication"]
      - [Research-to-science extension, "Scientific R&D organizations", "Long-term ambition", "Claims the AI-research playbook can transfer to other disciplines", "Need domain validation, regulatory controls and evidence beyond AI benchmarks"]
    notes: Public descriptions and secondary reporting are not equivalent to a customer-ready product; null or unverified maturity means the assigned sources did not establish production availability.
    claimRefs: [CE001, CE003, CE009, CE010]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Recursive solution, Measurable benefit, Limitation]
    rows:
      - ["Find promising AI research directions", "Human researchers select hypotheses and experiments", "Generate and rank candidate ideas in an open-ended loop", "Potentially higher experiment throughput", "Goal selection and research taste remain unproven"]
      - ["Implement and test a research change", "Researchers write code, run jobs and inspect outputs", "Automate implementation, execution and validation", "More parallel trials per unit of researcher time", "Compute, tool reliability and recovery costs are undisclosed"]
      - ["Turn a validated result into the next iteration", "Human teams curate evidence and decide what survives", "Compound validated discoveries into later research", "Potential compounding development velocity", "Persistent, transferable gains are not publicly demonstrated"]
      - ["Deploy a local coding model", "Use hosted or dense models with external inference", "Reported local MoE model and inference engine", "Potential lower-latency or lower-cost inference", "Primary release and independent evaluation are unavailable in this pool"]
    notes: The table separates the intended job-to-be-done from evidence of current delivery; reported benefits are hypotheses, not realized customer outcomes.
    claimRefs: [CE002, CE005, CE006, CE011, CE012]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Idea generation, "Propose research hypotheses and candidate changes", "Foundation model plus search or evolution procedure", "Mode collapse, low novelty or ungrounded ideas"]
      - [Implementation, "Translate candidates into executable code and configurations", "Code tools, repositories and isolated environments", "Security exposure, brittle patches and hidden state"]
      - [Experimentation, "Run training, evaluation and comparison jobs", "Large-scale compute, data and experiment orchestration", "Cost overruns, queue latency and irreproducible conditions"]
      - [Validation, "Measure whether a change improves the target", "Independent evaluator, held-out tests and stable metrics", "Reward hacking, benchmark contamination and false positives"]
      - [Compounding and control, "Select artifacts for later iterations", "Provenance, rollback, access policy and human review", "Objective drift, error cascades and loss of oversight"]
    notes: Architecture is a diligence model grounded in the company's described loop and independent AI4AI literature; it is not a disclosed internal diagram.
    claimRefs: [CE005, CE006, CE007, CE013, CE014]
figures:
  - id: FE001
    title: Recursive research-loop architecture
    type: stack
    summary: A staged view of how Recursive's proposed research engine could turn ideas into validated artifacts while retaining control points.
    data:
      layers:
        - name: Control and governance
          label: Control and governance
          detail: Human-set goals and independent checks bound the loop.
          items:
            - name: Human direction
              detail: "Set goals, constraints and escalation rules; public evidence says this remains important."
            - name: Independent evaluation
              detail: "Check results against held-out tests and prevent evaluator drift."
        - name: Research loop
          label: Research loop
          detail: The proposed engine turns hypotheses into tested artifacts.
          items:
            - name: Ideation
              detail: "Generate hypotheses and candidate changes."
            - name: Implementation
              detail: "Write code and configure experiments."
            - name: Experimentation
              detail: "Run parallel jobs using compute and data."
            - name: Validation
              detail: "Measure performance and retain only supported changes."
        - name: Outputs
          label: Outputs
          detail: Validated artifacts may seed later research or future domain transfer.
          items:
            - name: AI-research artifacts
              detail: "Models, code, data or training procedures that may seed the next iteration."
            - name: Transfer to science
              detail: "Long-term company ambition; not established as a deployed capability."
        - name: Compute and data
          label: Compute and data
          detail: Training, inference, datasets and experiment budget support the loop.
          items:
            - name: Parallel execution
              detail: "Run many research threads subject to disclosed compute and orchestration limits."
        - name: Evidence and provenance
          label: Evidence and provenance
          detail: Evaluation records must identify what changed and why it survived.
          items:
            - name: Reproducible records
              detail: "Retain code, data, metrics and lineage for independent reruns."
        - name: Deployment boundary
          label: Deployment boundary
          detail: External release requires safety, access and support controls.
          items:
            - name: Release gates
              detail: "No assigned source establishes a customer-ready deployment or complete control policy."
    approximationNotes: The figure is an analytical architecture derived from disclosed product claims and independent AI4AI taxonomy, not a verified internal system specification.
    claimRefs: [CE001, CE005, CE006, CE014]
callouts:
  - calloutType: strength
    title: Coherent technical thesis
    body: The company's stated loop aligns with an active AI4AI research frontier and is supported by a technically credible founding cohort, but thesis credibility is not the same as deployed-product proof.
    claimRefs: [CE001, CE005, CE009]
  - calloutType: risk
    title: Proof and control surface are incomplete
    body: The assigned sources do not establish repeatable external deployments, durable compounding gains, independent benchmark replication, or a sufficiently documented safety and rollback regime.
    claimRefs: [CE010, CE012, CE013, CE015]
  - calloutType: recommendation
    title: Underwrite the loop, not the narrative
    body: Request primary technical artifacts, held-out evaluations, intervention logs, compute economics, model or code release details, and governance controls before treating the research engine as product maturity.
    claimRefs: [CE006, CE007, CE012, CE015]
