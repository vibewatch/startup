chapter:
  number: 2
  title: Market Analysis
  summary: Recursive addresses a narrow, emerging market for automating AI research inside a much larger AI software, services, and infrastructure economy. Spending and adoption indicators support demand growth, but public evidence does not yet isolate a company-specific SAM or SOM, and buyer scrutiny of cost, ROI, and governance materially limits conversion from broad category growth.
sections:
  - id: market-boundary
    title: Market boundary, adjacencies, and substitutes
    body: >-
      Recursive's core market is not the full AI economy. Current descriptions center on systems that automate the AI research loop, including ideation, evaluation, data selection, implementation, training, post-training, and validation. The closest addressable boundary is therefore software or services used by frontier labs and advanced enterprise AI teams to improve research throughput. Adjacent spending includes AI models, data-science platforms, cloud services, and infrastructure, but those categories should enter a market model only when a priced Recursive offering captures them. General chatbot seats, unrelated enterprise applications, semiconductors, servers, and broad consulting are excluded. The principal substitutes are human research teams, internal tooling, model APIs, open-source models, and routing systems that reduce the need to use an expensive frontier model for every task.
    claimRefs: [CM001, CM002, CM012, CM014, CM015]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses without a fabricated TAM
    body: >-
      Gartner forecasts $2.595667 trillion of worldwide AI spending in 2026, including $1.431509 trillion of infrastructure, $585.527 billion of services, $453.209 billion of software, and $32.604 billion of models. These values share a period, geography, and spending basis, but they do not form Recursive's TAM, SAM, or SOM: infrastructure alone includes hyperscaler capacity and hardware that a research-automation vendor may consume rather than monetize. The table and pyramid consequently show market context and adjacent budget pools, not obtainable revenue. A defensible bottom-up estimate still requires a defined product, revenue unit, buyer population, price, sales geography, and evidence of the share of research budgets that can migrate from people, compute, and internal tools to Recursive.
    claimRefs: [CM003, CM004, CM005, CM006, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      The most plausible first buyer is a frontier-model lab or AI-intensive organization with a central research budget and authority to change its development loop. Researchers, evaluation engineers, and ML infrastructure teams would use the system; a CTO, chief scientist, CIO, or AI-platform leader would control payment. Large enterprises are a second segment, particularly for R&D, knowledge-management, and software workflows, but their adoption path is more gated: scoped pilot, benchmarked outcome, governance review, integration with data and infrastructure, then controlled production expansion. The trigger is measurable improvement in experiment velocity, quality, or cost per useful result. Public evidence does not identify Recursive customers, prices, contract structures, or retention, so these segments remain evidence-based hypotheses rather than observed demand.
    claimRefs: [CM007, CM008, CM009, CM013, CM014, CM016]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      Adoption has real tailwinds: Deloitte reports expanding worker access and production deployment, while Gartner expects more models and agents to enter multistep enterprise workflows. Yet broad adoption does not guarantee a premium research-automation market. Deloitte finds that only one in five surveyed companies has mature governance for autonomous agents, and it identifies insufficient skills as the largest integration barrier. CNBC reports companies restricting AI spend, switching to cheaper alternatives, and delaying large commitments until ROI is clearer; GitHub's own model routing emphasizes that many tasks do not require the most reasoning- or token-intensive model. Recursive must therefore prove reproducible research gains under cost controls, auditability, and human oversight. Until pricing and customer outcomes are disclosed, market growth supports strategic relevance but cannot independently underwrite valuation.
    claimRefs: [CM007, CM008, CM009, CM010, CM011, CM012, CM016]
