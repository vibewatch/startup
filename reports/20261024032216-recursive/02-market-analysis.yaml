callouts:
  - calloutType: risk
    title: Broad spending is not obtainable market
    body: Public forecasts establish a large AI economy, but Recursive still needs a disclosed product boundary, pricing unit, target-account count, sales geography, and customer proof before a bottom-up SAM or SOM can be underwritten.
    claimRefs: [CM006, CM016]
  - calloutType: insight
    title: Efficiency can expand usage while compressing willingness to pay
    body: Model routing and cheaper alternatives can make AI workflows more economical, but they also increase buyer pressure on premium pricing and force Recursive to prove value per useful research outcome rather than rely on category growth.
    claimRefs: [CM010, CM012]
