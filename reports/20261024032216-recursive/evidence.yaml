evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: Audited revenue, ARR, customer count, current headcount, burn, compute liabilities, cash balance, and runway.
    whyItMatters: >-
      Funding raised and valuation do not establish commercial traction, liquidity, or the company's ability to fund
      compute commitments.
    diligencePath: >-
      Obtain audited financials, monthly management accounts, an ARR and bookings bridge, customer contracts, payroll
      roster, cash statements, and the AWS agreement.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board composition, founder vesting, role and time-allocation commitments, succession coverage, and any leadership
      changes after launch.
    whyItMatters: >-
      The public founder roster does not reveal decision rights or whether key-person and multi-role dependencies are
      contractually managed.
    diligencePath: >-
      Review the board register, employment and invention-assignment agreements, founder vesting, succession plan, and
      board minutes since incorporation.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financing-rights
    missingEvidence: >-
      Fully diluted cap table, liquidation preferences, anti-dilution terms, investor consent rights, debt, secondaries,
      and strategic commercial side letters.
    whyItMatters: >-
      Public round amounts and post-money valuation cannot establish ownership, control, or the economic value of common
      equity.
    diligencePath: >-
      Obtain the charter, stock purchase agreement, investor-rights agreement, voting agreement, option ledger, debt
      schedule, and all strategic side letters.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-size
    missingEvidence: >-
      A company-specific SAM and SOM model using a defined product, revenue unit, price, target-account population,
      sales geography, and attainable-share assumptions.
    whyItMatters: >-
      Broad AI spending forecasts cannot establish Recursive's obtainable revenue pool or support a valuation on their
      own.
    diligencePath: >-
      Request management's bottom-up market model and reconcile each input to product packaging, pipeline, contracts,
      and the operating plan.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Named customers or pilots, pricing and contract structure, procurement stage, retention, usage, and measured
      research outcomes.
    whyItMatters: Without customer proof, buyer segmentation and adoption timing remain hypotheses rather than observed demand.
    diligencePath: >-
      Obtain customer references, pilot statements of work, cohort usage, renewal data, and benchmarked outcomes under
      confidentiality.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: adoption-outlook
    missingEvidence: >-
      A comparable dataset that reconciles rapid aggregate AI spending growth with reports of enterprise cost controls
      and delayed commitments.
    whyItMatters: >-
