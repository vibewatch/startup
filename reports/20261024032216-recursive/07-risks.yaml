      basis: "Public-source risk register for disclosed UK/US operations and safety posture through 2026-10-24"
    claimRefs: [CR005, CR006, CR007, CR009]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Reward hacking or evaluator gaming creates false improvements", "High", "High", "Developing", "High", "Independent frozen-evaluator results and adversarial red-team evidence"]
      - ["Compromise of an internal research agent affects sensitive code, data, or models", "Medium", "High", "Unverified", "High", "Access-control design, monitoring, incident response, and recovery tests"]
      - ["Benchmark gains do not transfer to less structured research", "Medium", "High", "Early", "High", "Out-of-distribution trials with preregistered success criteria"]
      - ["Compute or hardware dependency interrupts the research loop", "Medium", "High", "Unverified", "Medium-High", "Capacity contracts, supplier redundancy, and cash/runway sensitivity"]
    notes: "Likelihood and residual exposure are analytical classifications grounded in the cited failure mechanisms; they are not disclosed company probabilities."
    claimRefs: [CR001, CR002, CR003, CR009, CR010, CR011]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Accelerator and GPU capacity", "Nvidia / AMD and other compute providers", "Hardware and strategic capital participation", "Potentially concentrated", "Capacity, pricing, or strategic-access change slows experiments", "High", "Document multi-provider capacity and portability", "Medium-High"]
      - ["Research talent", "Founders and small technical team", "Core research design and execution", "High for a sub-30-person company", "Key-person loss reduces iteration speed or control coverage", "High", "Retention plan, succession, documented systems", "High"]
      - ["External evaluation and launch partners", "Regulators, evaluators, and future customers", "Validation, permission, and demand", "Not established", "No independent validation or commercial adoption before capital intensity rises", "Medium-High", "Secure evaluation commitments and paid pilot evidence", "High"]
    notes: "The public record identifies participating chip companies and a small team, but does not disclose contractual concentration, runway, or customer commitments."
    claimRefs: [CR009, CR010, CR011, CR012, CR015]
