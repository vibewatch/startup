company:
  name: Recursive
chapter:
  number: 7
  title: Risks
  summary: Recursive's central risk is that its proposed self-improvement loop could scale capability faster than its verification and governance controls. Public evidence shows meaningful benchmark progress and substantial compute dependency, but also leaves product controls, safety commitments, legal posture, and operating resilience materially unverified.
sections:
  - id: recursive-control-risk
    title: Recursive control and verification risk
    body: "Recursive's public technical evidence is concentrated in bounded benchmark environments, not autonomous deployment or open-ended scientific work. The reported system ran ideation, implementation, experiments, validation, and repeated search on three benchmarks, including reward-hacking checks, but the same source says whether the approach scales to less structured research remains open. RAND separately describes AI research systems as holding insider-level access to sensitive code, data, and models, and warns that a compromise could influence future systems. The investment implication is a control problem: capability gains are meaningful only if evaluator integrity, access boundaries, rollback, and human approval remain stronger than the system's incentives to optimize the metric. The public record does not establish those controls, so the appropriate kill criterion is a material benchmark or deployment decision that cannot be reproduced by an independent evaluator under fixed compute and human sign-off."
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-and-governance
    title: Regulatory, legal, and governance exposure
    body: "Recursive's stated ambition places governance inside the product rather than at the edge of an ordinary software business. Public reporting says the company had not released a product, while an adverse newsletter reported no publicly disclosed responsible-scaling policy or public commitment to pre-deployment evaluation by the UK AI Security Institute or a US equivalent. Those are reported public-record gaps, not proof that no internal controls exist. The relevant exposure is therefore governance maturity under a fast-moving capability curve: if the company cannot document who can approve experiments, how model changes are audited, and which external evaluations are binding, regulatory scrutiny or partner restrictions could delay launch. Diligence should obtain the current policy, applicable entity and jurisdiction map, incident escalation plan, and evidence of regulator or evaluator engagement before treating the safety posture as investment-ready."
    claimRefs: [CR005, CR006, CR007, CR009]
    tableRefs: [TR002]
  - id: operating-and-dependency-risk
    title: Operating, capital, and partner dependencies
    body: "Recursive is a young, heavily capitalized research company whose public profile has emphasized a small team, a large financing, and compute-intensive ambitions. Tech.eu reported fewer than 30 staff and a $650 million raise at a $4.65 billion valuation; the same article identifies Nvidia and AMD as participating chip companies. The public technical account also relies on GPU profiling and hardware-specific optimization. This creates concentration across compute suppliers, scarce research talent, and evaluation infrastructure. A supplier allocation change, compute-price shock, hardware transition, or loss of key researchers could reduce experiment throughput before revenue exists to absorb the disruption. The public record does not disclose runway, burn, binding compute commitments, redundancy, or revenue, so monitoring should focus on signed capacity, cash runway, experiment throughput, retention of critical staff, and whether external users or customers emerge."
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: diligence-and-thesis-breaks
    title: Monitoring and thesis-break conditions
    body: "The evidence supports a staged diligence program rather than a claim that Recursive has already solved safe recursive improvement. The strongest positive evidence is reproducible progress on defined benchmarks; the strongest negative evidence is the gap between that progress and public proof of deployment controls, external evaluation, or commercial demand. A thesis break would occur if independent reruns fail to reproduce the reported improvements, if reward-hacking controls do not survive adversarial testing, if the company cannot document access and rollback controls, or if compute and talent concentration make the research loop economically non-repeatable. Until those tests are passed, the risk rating should remain high even though the technical signal is credible."
    claimRefs: [CR013, CR014, CR015, CR016]
    tableRefs: []
    figureRefs: []
