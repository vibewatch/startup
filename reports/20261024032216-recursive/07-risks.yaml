    claimRefs: [CR001, CR005, CR009, CR011, CR015]
callouts:
  - calloutType: risk
    title: Control risk dominates
    body: Recursive's capability thesis is most exposed where evaluator integrity, access control, and external oversight are not yet publicly demonstrated.
    claimRefs: [CR001, CR003, CR005, CR006]
  - calloutType: recommendation
    title: Require evidence before underwriting scale
    body: Advance only after independent benchmark reproduction, documented safety controls, and a credible compute and runway plan are available.
    claimRefs: [CR013, CR014, CR015, CR016]
