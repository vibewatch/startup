  topStrengths:
    - "Largest independent national hospital-at-home footprint post-Medically Home merger, covering 50 major metros and 20+ states — a near-impossible geography to replicate from scratch."
    - "CMS Acute Hospital Care at Home waiver extended five years through September 2030 (Consolidated Appropriations Act 2026), removing the near-term reimbursement cliff risk that previously overhung the sector."
    - "Payer-investor alignment with Humana, Blue Shield of California, and Optum Ventures creates structural referral channels and favorable in-network contract economics."
    - "First ACHC In-Home Hospital Care accreditation (November 2024) establishes a regulatory quality moat that competitors must separately earn."
    - "Clinically validated outcomes — 58% ER avoidance, 8.5% 30-day readmission vs. ~15% national average, 98% patient satisfaction — anchor enterprise contract renewals."
  topRisks:
    - "CMS waiver dependency: hospital-equivalent reimbursement is non-permanent; if waiver-to-permanent-code conversion fails before 2030, the HAC service line faces existential reimbursement risk."
    - "Medically Home integration risk: the acquired company had a leaked internal document disclosing a significant valuation collapse and emergency capital needs before the merger, raising questions about assumed liabilities and operational continuity."
    - "Revenue concentration: Humana, Blue Shield, and Optum are simultaneously investors and top payers — exit of any one relationship would compress both revenue and governance."
    - "Financial opacity: audited revenue, gross margin, EBITDA, burn rate, and exact headcount remain undisclosed; the 12-14x estimated revenue multiple requires bull-case CMS permanence assumptions to be defensible."
    - "Clinical labor scarcity: recruiting and retaining paramedics, nurses, and PAs in 50 metros at scale is operationally intensive and subject to healthcare workforce shortages."
  unresolvedGaps:
    - "Audited financials (revenue, gross margin, EBITDA, cash runway) remain undisclosed for fiscal years 2024 and 2025."
    - "Full financial terms of the Medically Home acquisition, including liabilities assumed and actual acquisition price, are not public."
    - "Status and terms of the $75M debt facility (original SVB lender collapsed in 2023; current servicer and covenants unknown)."
    - "CMS has not published a formal timeline or criteria for converting AHCAH waiver to a permanent prospective payment code."
    - "Post-merger leadership integration, governance structure, and headcount are not publicly confirmed."
    - "Revenue concentration by individual payer/health system customer is not disclosed; top-10 concentration risk is unquantified."
