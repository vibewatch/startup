companyProfile:
  summary: "DispatchHealth is a Denver-based, late-stage hospital-at-home company founded in 2013 by ER physician Dr. Mark Prather and PA-C Kevin Riddleberger. It deploys mobile clinical teams to deliver emergency-level and inpatient-equivalent care in patients' homes under three service lines: ER-Alternative Care, Hospital-Alternative Care (HAC), and Transitional Care. A $160 million Series E1 round in March 2025 valued the company at $3.7 billion; the simultaneous merger with Medically Home established DispatchHealth as the largest independent national hospital-at-home operator. The company operates under a B2B2C model contracting with 50+ health systems and payers across 50 major metro areas. Platform reimbursement is anchored to the CMS Acute Hospital Care at Home waiver, extended through September 2030."
  foundedDate: "2013-01-01"
  founders:
    - name: "Dr. Mark Prather"
      role: "Co-Founder & Executive Chair"
      background: "Emergency physician who conceived hospital-at-home after observing ER overcrowding; leads strategic and clinical governance."
      claimRefs: [CO002]
    - name: "Kevin Riddleberger"
      role: "Co-Founder & Chief Strategy Officer"
      background: "Physician assistant with an MBA who built DispatchHealth's enterprise partnerships and payer contracting strategy."
      claimRefs: [CO002]
  foundingLocation: "Denver, Colorado, USA"
  headquarters: "Denver, Colorado, USA"
  productSummary: "Mobile clinical teams (paramedic + nurse/PA) carry portable diagnostics — X-ray, ultrasound, CLIA-certified mobile lab — to treat 60+ acute conditions in the home, integrate bidirectionally with partner EHR systems, and coordinate post-visit follow-up. The Medically Home merger adds a higher-acuity remote monitoring layer for hospital-equivalent HAC admissions at scale."
  customerFocus: "Health systems, Medicare Advantage and commercial payers, and self-insured employers seeking lower-cost ER and inpatient substitutes"
  businessModel: "B2B2C fee-for-service reimbursement via health system and payer enterprise contracts; in-network with most major U.S. insurers and Medicare/Medicaid under the CMS AHCAH waiver"
  stage: "Series E1"
