chapter:
  number: 5
  title: Product & Technology
  summary: >-
    DispatchHealth delivers emergency-level and hospital-level care at home through a combination of mobile diagnostic
    hardware, CLIA-certified mobile laboratory, EHR-integrated clinical operations, and — post-merger — the Medically
    Home clinical command center. Its three service lines (ER-alternative, hospital-alternative, transitional care)
    represent a complete care-at-home stack that no single predecessor achieved. Clinical outcomes are well-documented
    and accreditation is secured; integration risk from the Medically Home merger and the absence of a public developer
    surface are the primary technology diligence gaps.
sections:
  - id: section-1
    title: Service definition in patient and partner workflow terms
    body: >-
      DispatchHealth deploys care to patients who would otherwise seek emergency or inpatient care. When a patient
      calls or a health-system partner refers, a clinical team — typically a physician assistant or nurse practitioner
      backed by a physician — arrives at the patient's home within hours carrying a mobile diagnostic suite. That suite
      includes portable X-ray, ultrasound and point-of-care ultrasound (POCUS), and a CLIA-certified moderately complex
      mobile laboratory capable of blood work, urinalysis, and cultures. For ER-alternative cases — the original and
      largest service line — the visit resolves the episode on-site: 58% of visits result in patients being treated
      entirely at home rather than transported to an emergency department.

      The Hospital-Alternative Care (HAC) line, which became operationally central through the 2024 merger with
      Medically Home, elevates the acuity level to inpatient-equivalent. Patients admitted to the HAC program receive
      IV pumps, monitoring equipment, oxygen, and daily nurse visits backed by Medically Home's 24/7 physician-led
      clinical command center. The command center provides virtual oversight so that a home patient has the equivalent
      of a hospital's telemetry infrastructure without the facility cost. DispatchHealth achieved ACHC In-Home Hospital
      Care Accreditation — the first such accreditation ever awarded — in November 2024, formally validating that its
      HAC model meets institutional-quality standards.

      The third service line, Transitional Care, wraps around hospital or emergency department discharges. A care team
      follows patients for the critical post-discharge window when readmission risk is highest. The 8.5% 30-day
      readmission rate across DispatchHealth's patient population runs at roughly half the national average of ~15%,
      providing the central economic argument for why health systems and payers will pay for the service.

      The buyer workflow is B2B: health systems and payers enter enterprise contracts with DispatchHealth, then refer
      patients via a dispatch call center, EHR-integrated referral workflow, or direct payer-care-management routing.
      Patients interact with DispatchHealth clinicians, but the purchasing and authorization relationship sits with the
      health system or payer. Reimbursement flows from Medicare, Medicare Advantage, Medicaid, and commercial
      insurance to DispatchHealth for each episode of care.
