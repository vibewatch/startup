  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: ehr-integration-roster
      missingEvidence: >-
        DispatchHealth has not published which specific EHR systems (Epic, Oracle Health/Cerner, Athena, etc.)
        are formally certified or integrated with its field dispatch and referral workflow. The bidirectional
        integration claim is made but no integration list, API documentation, or EHR vendor certification
        is publicly available.
      whyItMatters: >-
        EHR certification is a primary procurement prerequisite for large health systems. Without knowing
        which EHRs are supported at what integration depth, the addressable market for additional health
        system contracts cannot be assessed and installation friction per new partner is unknown.
      diligencePath: >-
        Request certified EHR integration list with Epic App Orchard, Oracle Health, Athena, and other major
        platforms; confirm whether integration supports FHIR R4 standards; review any public EHR vendor
        announcement or partnership press release.
      relatedQuestionRefs:
        - QE008

    - type: private-evidence-only
      severity: blocking
      topic: merger-integration-timeline
      missingEvidence: >-
        No public disclosure exists of the timeline, milestones, or technical architecture for integrating
        DispatchHealth's legacy field dispatch platform with the Medically Home clinical command center
        technology stack. The merger closed in mid-2025 and integration is described as ongoing.
      whyItMatters: >-
        Dual-platform operational complexity is the primary near-term execution risk. If integration is
        delayed, the combined company operates with higher costs, greater clinical coordination risk, and
        reduced ability to scale the HAC program. The $3.7B valuation assumes the combined platform
        is more than the sum of its parts.
      diligencePath: >-
        Request integration project plan including technology stack reconciliation, data migration approach,
        unified EHR integration strategy, and timeline for single-platform operations; assess whether
        command center technology requires custom engineering for DispatchHealth's specific dispatch model.
