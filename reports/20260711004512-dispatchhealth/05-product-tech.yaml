callouts:
  - calloutType: strength
    title: First-ever ACHC accreditation establishes an unassailable regulatory credential
    body: >-
      No competitor can claim the ACHC In-Home Hospital Care Accreditation. This is not a marketing distinction —
      it is a procurement prerequisite for risk-averse health systems and a signal to payers that the clinical
      quality standard meets or exceeds what they require for institutional reimbursement.
    claimRefs:
      - CE022
      - CE023
      - CE024
  - calloutType: strength
    title: Vertically integrated care stack creates differentiation no pure-tech competitor can replicate
    body: >-
      The combination of CLIA mobile laboratory, portable imaging, 60+ proprietary clinical protocols, EHR
      integration, and the Medically Home command center is assembled over 13 years and three service lines.
      A new entrant would need to rebuild every layer — clinical operations, regulatory credentials, health system
      contracts, and technology — simultaneously.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE010
      - CE013
      - CE014
      - CE015
  - calloutType: risk
    title: Medically Home integration is incomplete and technology risk is unresolved
    body: >-
      Two distinct technology stacks — DispatchHealth's field dispatch platform and Medically Home's command center
      — are being merged. The integration timeline is not public. A botched technology integration could delay
      the national HAC scale-up that justifies the $3.7B valuation.
    claimRefs:
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
  - calloutType: risk
    title: No public security certifications or BAA template creates enterprise procurement friction
    body: >-
      The absence of a publicly accessible SOC 2 Type II report, HITRUST certification, or BAA template means
      enterprise health system procurement teams must conduct additional diligence. This is a friction point,
      not a disqualifier, but it slows sales cycles.
    claimRefs:
      - CE031
      - CE032
      - CE034
      - CE035

