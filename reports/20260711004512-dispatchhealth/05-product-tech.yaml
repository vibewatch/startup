  - id: TE002
    title: Workflow / use-case table
    columns:
      - user job-to-be-done
      - current / legacy workflow
      - DispatchHealth solution
      - measurable benefit documented
      - limitation
    rows:
      - - Avoid ER for non-life-threatening emergency
        - Patient calls 911 or drives to ER; 4-6 hour ER wait; costly episode; potential hospital admission
        - DispatchHealth team dispatched within hours; treated at home with full diagnostic suite
        - 58% ER avoidance rate; 98% patient satisfaction; estimated cost savings vs ER
        - Not applicable for life-threatening emergencies (chest pain with cardiac risk, stroke, major trauma).
      - - Deliver inpatient-level care without hospitalization
        - Patient admitted to hospital; average 4-5 day stay; facility-borne infection risk; high cost
        - "HAC program: daily nurse visits, command center monitoring, IV therapy, imaging at home"
        - 8.5% 30-day readmission vs ~15% national; $5K-$7K savings per episode vs inpatient
        - Transfer rate of 7.2% means roughly 1 in 14 patients still requires hospital escalation.
      - - Prevent post-discharge readmission
        - Patient discharged from hospital; high readmission risk in 30-day window; no systematic follow-up
        - Transitional care program tracks patient and intervenes early when deterioration signs detected
        - Portfolio-level 8.5% 30-day readmission rate; payer ROI argument on prevented readmissions
        - Readmission data is portfolio-level; no separately published transitional care cohort data.
      - - Confirm diagnosis at point of care (for referring clinician)
        - Send patient to imaging center or lab for follow-up; adds delay, inconvenience, and cost
        - CLIA mobile lab and portable imaging provide same-visit test results
        - Same-visit laboratory and imaging results enable immediate treatment decisions
        - No published comparison of DispatchHealth mobile lab accuracy versus hospital reference lab.
      - - Manage complex chronic patients at home (payer use case)
        - Complex patients cycle through ER and hospital repeatedly; high per-patient cost
        - "Enterprise payer contract: DispatchHealth manages high-utilizer cohort with all three service lines"
        - Cumulative $1.5B in documented medical cost savings since 2013 across enterprise portfolio
        - Cost savings figure is company-reported and not independently audited.
    notes: >-
      Measurable benefits are sourced from company press releases and clinical studies. The 58% ER avoidance and 8.5%
      readmission metrics are company-reported aggregates; independent clinical audit data are limited to the CMS
