summary:
  headline: >-
    DispatchHealth is the most scaled independent hospital-at-home operator in the U.S. with a defensible clinical
    model, but its $3.7B valuation prices in permanent CMS reimbursement and seamless Medically Home integration that
    neither is yet confirmed.
