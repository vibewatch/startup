- id: TM004
  title: "Growth drivers and constraints table"
  columns:
  - Factor
  - Type
  - Description
  - Magnitude
  - Time Horizon
  rows:
  - - CMS AHCAH waiver extension (5 years to 2030)
    - Driver
    - Removes policy risk; gives health systems certainty to invest in H@H infrastructure
    - High
    - Immediate through 2030
  - - Hospital capacity shortage / aging population
    - Driver
    - US hospital occupancy is chronically elevated; H@H creates virtual bed relief
    - High
    - Medium term (3-7 years)
  - - Value-based care / ACO expansion
    - Driver
    - Risk-bearing entities have financial incentive to substitute inpatient with H@H
    - High
    - Medium term
  - - Clinical evidence accumulation
    - Driver
    - Johns Hopkins, MGH, CMS outcomes data validate lower readmissions and mortality
    - Medium
    - Immediate — evidence base is established
  - - Medicare Advantage growth (54%+ of Medicare)
    - Driver / Risk
    - MA plans can negotiate reimbursement independently; growth = scale opportunity and pricing risk
    - Medium
    - Ongoing
  - - Technology infrastructure / setup cost
    - Constraint
    - Clinical command center, remote monitoring equipment, logistics are high capital requirements
    - High
    - Persistent
  - - Nursing workforce shortage
    - Constraint
    - Home-based acute nursing requires specialized skills; supply constrained nationally
    - High
    - Persistent (structural)
  - - Physician and patient inertia
    - Constraint
    - Unfamiliarity with H@H ordering; liability concerns; patient comfort with home care
    - Medium
    - Improving gradually
  - - Regulatory reimbursement uncertainty (MA, non-Medicare)
    - Constraint
    - No national mandate for MA plans to pay at fee-for-service parity for H@H
    - High
    - Persistent
  - - Geographic density requirement
    - Constraint
    - H@H economics require high patient density per market; rural areas are uneconomic
    - Medium
    - Structural
  notes: >-
    Magnitude ratings are qualitative assessments. The nursing workforce constraint is viewed
    by most operators as the binding near-term capacity constraint regardless of regulatory
    tailwind. The geographic density requirement limits H@H to urban and suburban metros;
    DispatchHealth's 50-metro footprint reflects this constraint.

