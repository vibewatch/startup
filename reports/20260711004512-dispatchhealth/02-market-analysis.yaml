- id: tam-sam-som-sizing
  title: "TAM, SAM, and SOM sizing with multiple lenses"
  body: >-
    Market sizing for hospital-at-home is complicated by methodological inconsistency across analyst
    reports. The broadest estimates capture the full home healthcare continuum; narrow estimates
    restrict to acute H@H admissions only.


    The hospital-at-home sub-market specifically (not broader home health) was valued at approximately
    $37.17 billion globally in 2025 by MarketsandMarkets, with a projected CAGR of 7.8 to 11.9 percent
    through 2034. This translates to an addressable market of roughly $60 to $80 billion globally by
    2034, or approximately $25 to $35 billion in the United States alone. A McKinsey analysis frequently
    cited in industry discussions estimated that up to $265 billion of care currently delivered in
    Medicare fee-for-service settings could shift to the home setting by 2025; however, this McKinsey
    estimate is the broadest possible interpretation and conflates many care types far beyond acute H@H.


    DispatchHealth's SAM is more precisely defined by the intersection of: (a) CMS AHCAH waiver
    participation (320 or more hospitals across 133 health systems in 37 states as of April 2024),
    (b) commercially insured and Medicare Advantage patients in markets where DispatchHealth is
    operational (50 metropolitan areas), and (c) the subset of admissions that are clinically
    appropriate for H@H—generally estimated at 10 to 20 percent of all inpatient admissions. With
    approximately 36 million annual U.S. hospital admissions (AHRQ data), a 10-percent clinical
    eligibility floor implies a clinical TAM of roughly 3.6 million eligible annual admissions.
    At an average revenue of $3,000 to $6,000 per H@H admission (below inpatient cost), the U.S.
    SAM for acute H@H platforms is approximately $10 to $22 billion annually.


    DispatchHealth's SOM is anchored to its current operational footprint. It treated approximately
    2,000-plus hospital-level admissions in 2024 across 50 metros. At an estimated average revenue
    per admission of $3,000 to $5,000, the SOM from H@H alone is currently in the range of $6 to
    $10 million—a tiny fraction of the SAM. The company's total revenue estimate of $257 to $312
    million reflects predominantly fee-for-service ER-alternative visits and transitional care episodes,
    which have a lower per-visit revenue profile. The post-merger combined entity with Medically Home's
    55,000-plus enabling platform admissions represents a more meaningful SOM, though those admissions
    are driven through partner health systems rather than directly by DispatchHealth.
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
