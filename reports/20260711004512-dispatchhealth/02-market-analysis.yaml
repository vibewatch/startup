tables:
- id: TM001
  title: Market definition table
  columns:
  - Market Segment
  - Scope / Definition
  - DispatchHealth Role
  - Excluded Adjacencies
  rows:
  - - Hospital-at-Home (Acute H@H)
    - Inpatient-equivalent care delivered at patient's home; CMS AHCAH waiver or payer-equivalent authorization
    - Core product — direct care delivery (ER-alternative + HAC) and enabling platform (Medically Home)
    - Routine home health visits; RPM-only platforms
  - - Emergency-Alternative (ER Diversion)
    - Acute-level emergency assessment and treatment at home to avoid ED visit
    - Core product — direct care delivery team
    - Telemedicine-only triage; walk-in urgent care
  - - Transitional / Post-Acute Care
    - Post-discharge support within 30 days to prevent readmission
    - Core product — transitional care follow-up
    - Long-term home health (non-acute); SNF rehab
  - - Broader Home Healthcare
    - Non-acute skilled nursing, therapy, wound care, chronic care management
    - Adjacent; not DispatchHealth's direct model
    - All DispatchHealth acute services
  - - Hospital Capacity / Bed Substitution
    - Virtual hospital bed displacement to relieve inpatient census pressure
    - Medically Home-enabled HAC through partner health systems
    - Elective procedure recovery; infusion therapy
  notes: >-
    Market definitions vary across analyst reports; this table aligns with CMS AHCAH waiver
    scope and DispatchHealth's three publicly stated service lines. Broader home health market
    (~$120B-$222B) is an adjacent market, not the core H@H market.

