  evidenceGaps:
  - type: not-found
    severity: material
    topic: DispatchHealth SAM within 50-metro footprint
    missingEvidence: No independent analyst estimate for DispatchHealth's specific serviceable addressable market within its 50-metro operational footprint exists in public sources.
    whyItMatters: >-
      Without a footprint-specific SAM, it is impossible to calculate meaningful market
      penetration rates or triangulate DispatchHealth's growth ceiling from its current revenue
      base. The company cites broad market figures (e.g., $300B by 2028) that are promotional
      rather than analytically useful.
    diligencePath: >-
      Request management's internal market sizing model including patient flow assumptions,
      contract utilization rates per health system partner, and payer mix by metro.
    relatedQuestionRefs:
    - QM027

  - type: conflicting-data
    severity: material
    topic: Medicare Advantage H@H reimbursement parity
    missingEvidence: No public data on the distribution of MA plan reimbursement rates for H@H services across DispatchHealth's 50-metro footprint or the gap versus Medicare FFS DRG rates.
    whyItMatters: >-
      If MA plans (54%+ of Medicare) pay materially less than DRG-equivalent rates for H@H,
      the effective SAM could be 30-50% smaller than fee-for-service estimates imply. This is
      the single most material market-sizing uncertainty for DispatchHealth.
    diligencePath: >-
      Request payer contract terms (redacted), a table of MA vs FFS rate comparisons by
      major MA plan, and management's assessment of MA pricing trajectory over 2026-2030.
    relatedQuestionRefs:
    - QM028
    - QM029

  - type: stale
    severity: moderate
    topic: CMS AHCAH program current enrollment and volume
    missingEvidence: CMS has not published updated AHCAH waiver participation and patient volume data for 2025-2026 beyond the April 2024 snapshot (320 hospitals, 133 health systems).
    whyItMatters: >-
      The waiver extension passed in early 2026 after a brief lapse; enrollment may have
      contracted during the lapse and re-expanded after the extension. Without current data,
      market size estimates based on 2024 participation figures may be stale.
    diligencePath: >-
      Monitor CMS QualityNet and CMS newsroom for updated AHCAH participation statistics.
      Request DispatchHealth management's view on program re-enrollment post-extension.
    relatedQuestionRefs:
    - QM026

  - type: conflicting-data
    severity: moderate
    topic: Market share of H@H enablement platforms vs health-system-operated programs
    missingEvidence: No public data exists on the relative market share of technology-enablement platforms (DispatchHealth/Medically Home, Contessa) versus health systems running proprietary H@H programs.
    whyItMatters: >-
      If health systems prefer to build proprietary programs over contracting a platform,
      the TAM for platform providers like DispatchHealth is materially smaller than total
      H@H admissions would suggest.
    diligencePath: >-
      Review Chilmark Research detailed market segmentation; request DispatchHealth win/loss
      analysis on health system deals where the system chose to build internally.
    relatedQuestionRefs:
    - QM030

  acknowledgedWarnings:
  - dimension: unverifiedSource
    reason: >-
      Sources SM009 (KFF) and SM010 (KFF) are from the Kaiser Family Foundation, a well-established
      non-partisan health policy research organization. Their Medicare Advantage enrollment and
      benefit data are widely cited in peer-reviewed and policy literature. SM001 (MarketsandMarkets)
      is a market research subscription service; headline figures are from their publicly available
      summary page. SM004 (Chilmark Research) is an independent health IT analyst firm; the cited
      quote is from their publicly available report summary.
