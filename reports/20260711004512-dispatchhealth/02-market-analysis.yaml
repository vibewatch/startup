sections:
- id: market-boundary-and-definition
  title: "Market boundary, scope, and adjacent segments"
  body: >-
    The relevant market for DispatchHealth spans three interrelated care segments that are converging
    under the hospital-at-home (H@H) umbrella. The core market is acute-level care delivered outside
    a traditional hospital setting—encompassing emergency-alternative triage, hospital-level inpatient
    substitution, and post-acute transitional care that bridges inpatient discharge to home. The CMS
    Acute Hospital Care at Home (AHCAH) waiver program, extended through September 2030 under the
    Consolidated Appropriations Act of 2026, is the primary regulatory frame that defines what
    qualifies as reimbursable inpatient-equivalent home care under Medicare.


    Within this broad frame, DispatchHealth competes principally in the acute home care and hospital-at-home
    sub-segment, distinct from non-acute home health (skilled nursing visits, therapy, wound care) and
    from chronic care management (continuous RPM, longitudinal complex-patient programs). These
    adjacencies—non-acute home health (an estimated $120 billion market), chronic disease management
    platforms, and remote patient monitoring—are complementary and are sometimes counted together in
    broad home healthcare market estimates, inflating headline TAMs.


    The status-quo substitutes are: inpatient hospital admission (the primary substitute), emergency
    department visits, skilled nursing facility (SNF) stays, and outpatient specialty clinics for
    lower-acuity cases. The hospital-at-home model captures value by displacing SNF, inpatient stays,
    and unnecessary ED visits simultaneously. Market boundaries must therefore exclude routine home
    health visits (already a separate CMS benefit) and telehealth-only models (no physical care
    delivery), which are adjacent services that DispatchHealth's clinical command center model
    complements but does not replace.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  tableRefs:
  - TM001
