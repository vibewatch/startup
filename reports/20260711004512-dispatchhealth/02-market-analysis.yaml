callouts:
- calloutType: strength
  title: Five-year CMS waiver extension removes the primary policy risk for H@H operators
  body: >-
    The Consolidated Appropriations Act of 2026 extended the CMS AHCAH waiver through September 30,
    2030—a five-year window that gives health systems and payers the certainty needed to invest in
    hospital-at-home infrastructure. This dramatically reduces the regulatory risk that caused
    program freezes when the waiver briefly lapsed in October 2025. DispatchHealth is one of the
    largest operators in this waiver ecosystem with ACHC accreditation and active participation.
  claimRefs:
  - CM019
  - CM022

- calloutType: risk
  title: Medicare Advantage reimbursement gap is the most material unresolved market risk
  body: >-
    Medicare Advantage now covers more than 54 percent of all Medicare beneficiaries, yet MA plans
    are not required to reimburse H@H at fee-for-service parity. This creates a fragmented payer
    landscape where DispatchHealth must negotiate individual MA contracts—with variable rates and
    coverage policies—across its 50-metro footprint. The risk is that MA plans compress margins
    or limit coverage to reduce cost, offsetting the growth tailwind from fee-for-service waiver expansion.
  claimRefs:
  - CM026
  - CM027

