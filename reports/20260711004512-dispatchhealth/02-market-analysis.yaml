- id: buyer-and-payer-segmentation
  title: "Buyer, user, and payer segmentation"
  body: >-
    DispatchHealth's go-to-market motion is B2B2C: the primary buyers are health systems and payers
    (insurance companies), with patients as the end users. This dual-buyer structure creates distinct
    economic relationships and adoption pathways.


    Health systems adopt hospital-at-home for three primary reasons: capacity relief (freeing
    inpatient beds during high-census periods), revenue retention (keeping patients within the system
    rather than losing them to SNFs or other providers), and quality metrics improvement (H@H reduces
    complications, readmissions, and length of stay). The health system buyer is typically a
    Chief Medical Officer, VP of Population Health, or VP of Inpatient Operations. Budget authority
    sits with the CFO or system CEO for capital-intensive program builds, or with the CMO for
    technology-vendor contracts.


    Payers (Medicare Advantage plans, commercial insurers, self-insured employers) adopt H@H because
    it reduces total cost of care. The CMS AHCAH waiver creates a Medicare fee-for-service pathway that
    pays at inpatient DRG rates; Medicare Advantage plans negotiate separately. Humana and Blue Shield
    of California are both investors and payer customers of DispatchHealth, signaling that the model
    passes payer return-on-investment scrutiny.


    Accountable Care Organizations (ACOs) and risk-bearing entities represent a third buyer segment:
    these organizations bear financial responsibility for total cost of care, creating strong economic
    incentive to substitute costly inpatient admissions with H@H. The shift from volume-based to
    value-based care in Medicare is a structural tailwind.


    Patients (the end user) are largely passive adopters: they access H@H through their insurer's
    network or their health system's referral pathway. Patient education and willingness to accept
    home-based acute care is a real adoption constraint, particularly among elderly patients and those
    without stable home environments. DispatchHealth's 98 percent patient satisfaction figure—while
    company-claimed—suggests patient acceptance is high once care is accessed.
  claimRefs:
  - CM013
  - CM014
  - CM015
  - CM016
  - CM017
  - CM018
  tableRefs:
  - TM003
  figureRefs:
  - FM003

- id: growth-drivers-and-constraints
  title: "Growth drivers, adoption constraints, and timing"
  body: >-
    The hospital-at-home market has three primary growth drivers and three material adoption constraints.


    The most significant driver is regulatory certainty. The five-year extension of the CMS AHCAH waiver
    through September 2030, legislated in the Consolidated Appropriations Act of 2026, removes the
    existential policy risk that shadowed the sector since the waiver's temporary expiration in late
    2025. Chilmark Research estimated that H@H programs could double by 2026 given the waiver extension.
    The AHA reported that more than 320 hospitals in 133 health systems across 37 states had joined the
    AHCAH waiver program by April 2024; that number is expected to grow materially through 2030.


    A second driver is the chronic hospital capacity shortage. U.S. hospitals consistently operate at
    high occupancy rates, and aging demographics are increasing acute care demand. Hospital-at-home
    offers a capacity-relief valve without capital expenditure on new beds. The third driver is the
    shift to value-based care: as ACOs, Medicare Advantage plans, and risk-bearing providers take on
    financial responsibility for total cost of care, H@H's cost savings ($5,000 to $7,000 per admission
    versus inpatient) create strong economic alignment.


    The primary adoption constraint is technology and infrastructure: setting up a hospital-at-home
    program requires remote monitoring equipment, clinical command centers, last-mile logistics for
    mobile diagnostics, and 24-hour clinical coverage. This creates high startup cost and complexity
    for health systems that build internally. The second constraint is workforce: nursing shortages and
    the specialized training needed for acute home care nursing limit staffing capacity. The third
    constraint is patient and physician inertia: physicians and patients are unfamiliar with the
    H@H model, and liability concerns inhibit physician ordering.


    The brief lapse of the CMS waiver in October 2025 (before the Congressional extension passed)
    created disruption for active programs and demonstrated the sector's current regulatory dependency.
  claimRefs:
  - CM019
  - CM020
  - CM021
  - CM022
  - CM023
  - CM024
  - CM025
  tableRefs:
  - TM004
  figureRefs:
  - FM004

- id: sizing-gaps-and-contradictions
  title: "Sizing gaps, contradictions, and diligence implications"
  body: >-
    The hospital-at-home market faces three major sizing contradictions that complicate investment
    thesis underwriting.


    First, the headline TAM figures from analyst firms ($37 billion to $265 billion) are not comparable:
    they reflect fundamentally different market definitions. MarketsandMarkets' $37 billion (2025)
    captures the acute H@H segment globally; McKinsey's $265 billion is a U.S.-only thought-experiment
    projecting the maximum care that could shift home from all Medicare settings. Using McKinsey's
    figure as the addressable market for an acute H@H platform provider would be misleading.


    Second, the CMS AHCAH waiver only covers Medicare fee-for-service beneficiaries. Medicare
    Advantage (MA) enrollment now exceeds 54 percent of all Medicare beneficiaries (KFF, 2024);
    MA plans negotiate their own reimbursement rates with H@H providers separately, and there is no
    national mandate for MA plans to cover H@H services at fee-for-service parity. This creates a
    significant coverage and pricing uncertainty for the payer-funded portion of the market.


    Third, the H@H-eligible patient fraction is contested. CMS data from the AHCAH waiver period
    (November 2021 to March 2023) showed a 7.2 percent transfer rate back to traditional inpatient
    settings, indicating real clinical risk-stratification challenges. Academic studies (Mass General
    Brigham, Johns Hopkins) show favorable outcomes for carefully selected patients, but selection
    criteria vary across programs, making aggregate TAM calculations unreliable.


    For DispatchHealth specifically, the relevant forward-looking SOM depends on the pace of
    health system contracting, the outcome of Medicare Advantage reimbursement negotiations, and
    the success of the Medically Home technology integration. Third-party revenue estimates
    ($257 to $312 million for 2025-2026) are modeled rather than verified; actual revenue could
    deviate materially.
  claimRefs:
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
