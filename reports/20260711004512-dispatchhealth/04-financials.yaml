  evidenceGaps:
  - type: private-evidence-only
    severity: critical
    topic: audited financial statements
    missingEvidence: Audited revenue, gross margin, EBITDA, cash on hand, and payer mix for FY2024 and FY2025; Medically Home's pre-merger financials.
    whyItMatters: >-
      Without verified financials, the $3.7B valuation implies a 10-14x revenue multiple on
      third-party modeled estimates that may be inaccurate. Any capital adequacy, burn-rate,
      or margin-path assessment is speculative. The Medically Home distressed-seller context
      makes this gap especially material.
    diligencePath: >-
      Request FY2024 and FY2025 audited consolidated financial statements, monthly cash flow
      bridge for the 12 months preceding the Series E1 close, and Medically Home's last
      12-month P&L as a pre-merger data room item.
    relatedQuestionRefs:
    - QI001
    - QI006
    - QI010

  - type: unknown
    severity: material
    topic: SVB debt facility current status
    missingEvidence: Current servicer, outstanding balance, covenant terms, and maturity schedule for the $75M conventional debt facility originated with SVB in October 2022, following SVB's March 2023 collapse.
    whyItMatters: >-
      If the debt was transferred to a more restrictive servicer or if covenant violations
      occurred during SVB's receivership, there could be undisclosed financial obligations
      or restrictions on DispatchHealth's capital structure.
    diligencePath: >-
      Request the current debt facility agreement (post-SVB servicer), outstanding balance as
      of the Series E1 close date, any covenant waiver letters, and confirmation of no
      events of default since March 2023.
    relatedQuestionRefs: []

  - type: private-evidence-only
    severity: material
    topic: Medically Home liabilities assumed in merger
    missingEvidence: The financial terms of the DispatchHealth-Medically Home merger, any liabilities assumed from the distressed-seller Medically Home, and the partial liquidation terms for Medically Home insiders.
    whyItMatters: >-
      If Medically Home had undisclosed liabilities (e.g., deferred revenue, accounts payable,
      or technology debt) that DispatchHealth assumed, the true cost of the merger exceeds
      the $160M Series E1 raise. The partial liquidation for insiders also suggests the merger
      structure was not economically neutral.
    diligencePath: >-
      Request the definitive merger agreement and all schedules, Medically Home's last audited
      balance sheet, a post-merger combined entity balance sheet, and a list of all assumed
      liabilities and their current status.
    relatedQuestionRefs: []

  - type: not-found
    severity: moderate
    topic: Revenue by service line and payer mix
    missingEvidence: No public breakdown of DispatchHealth's revenue by service line (ER-alternative vs HAC vs Transitional Care vs Enablement) or by payer type (Medicare FFS vs MA vs commercial vs Medicaid).
    whyItMatters: >-
      Without service-line revenue decomposition, it is impossible to assess the margin
      profile of the combined post-merger entity or the exposure to MA reimbursement risk
      (the most material market-level financial risk identified in the market analysis chapter).
    diligencePath: >-
      Request management's revenue breakdown by service line and payer mix (quarterly, past 8
      quarters) from the data room.
