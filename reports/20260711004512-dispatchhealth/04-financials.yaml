callouts:
- calloutType: strength
  title: Fee-for-service revenue from payer-investor relationships creates a structurally defensible revenue base
  body: >-
    DispatchHealth's revenue from Humana, Blue Shield of California, and Optum-affiliated networks
    is partially protected by the dual investor-payer relationship. These payers have financial
    incentives as investors to maintain preferred-provider terms and high referral volumes for
    DispatchHealth. This creates a structural floor on revenue from those channels that pure
    fee-for-service competitors lack. The CMS waiver extension to 2030 further secures the
    Medicare fee-for-service revenue pathway for five years.
  claimRefs:
  - CI006
  - CI007

- calloutType: risk
  title: Financial opacity and the Medically Home distressed-seller context create material diligence risk
  body: >-
    DispatchHealth has not disclosed any verified financial metrics, and the Medically Home
    merger was executed with a counterparty that had a reportedly "dramatic" valuation drop and
    needed cash infusions to survive. Without a data room review, it is impossible to determine
    whether Medically Home's liabilities were fully absorbed and whether the combined entity's
    true cash position supports the growth narrative. The SVB debt facility from 2022 also has
    unknown current servicer and terms following SVB's 2023 collapse.
