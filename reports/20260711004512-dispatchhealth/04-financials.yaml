sections:
- id: revenue-streams-and-pricing
  title: "Revenue streams, pricing model, and revenue quality"
  body: >-
    DispatchHealth operates a fee-for-service revenue model with three primary service lines
    post-merger: ER-alternative care, Hospital-Alternative Care (HAC), and Transitional Care.
    Each service line generates revenue through payer reimbursement -- either directly from insurance
    companies or through the CMS Acute Hospital Care at Home (AHCAH) waiver for Medicare fee-for-service
    patients. Health systems that contract DispatchHealth's enablement technology (Medically Home
    platform) may also pay enterprise licensing or management fees, though the financial terms of
    these arrangements are not publicly disclosed.


    ER-alternative visits are the highest-volume service line and are believed to represent the
    majority of DispatchHealth's current revenue. These visits involve acute-level triage, diagnosis,
    and treatment at the patient's home in lieu of an emergency department visit, and are reimbursed
    by payers at rates that vary by plan and market. DispatchHealth reports being in-network with
    most major insurance companies, which is a prerequisite for sustainable fee-for-service revenue.


    Hospital-Alternative Care (HAC) admissions generate higher per-episode revenue than ER-alternative
    visits (estimated $3,000-$7,500 per HAC admission versus approximately $500-$1,500 per ER-
    alternative visit) but require greater operational investment per patient. DispatchHealth reported
    2,000-plus HAC admissions in 2024, and the merged entity with Medically Home is expected to scale
    this significantly.


    Third-party revenue estimates for DispatchHealth range from $257.7 million to $312.2 million
    for 2025-2026. These estimates are produced by data aggregators (Compworth, ZoomInfo, Tracxn)
    using proprietary modeling, not from verified company financial disclosures. DispatchHealth has
    not publicly confirmed its revenue figures. The estimates imply a revenue-per-employee ratio of
    approximately $200,000-$250,000 at the current headcount of 985-1,200 employees, which is
    consistent with a high-labor-cost healthcare services model.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001

- id: gtm-and-sales-efficiency
  title: "GTM motion and sales efficiency proxies"
  body: >-
    DispatchHealth's primary GTM motion is enterprise B2B sales to health systems and payers.
    Enterprise contracts with health systems typically take 6-18 months from initial outreach to
    contract execution, reflecting the clinical, operational, and legal complexity of embedding a
    third-party clinical service into a health system's care delivery model. Payer contracts also
    require network credentialing, claims processing integration, and rate negotiation.


    The company's payer-investor alignment (Humana, Blue Shield of California, Optum Ventures) is
    the most distinctive GTM advantage: these investors are also payer customers, providing
    DispatchHealth with preferred-provider status in those payer networks and materially reducing
    customer acquisition costs for patient referrals from those plans. This structural advantage is
    not replicable by new entrants without similar strategic investor composition.


    No direct Customer Acquisition Cost (CAC) data is publicly available. Proxy metrics suggest
    high sales-cycle cost: DispatchHealth employs a Chief Growth Officer and a dedicated enterprise
    sales function, and its B2B model requires senior executive engagement at both health systems
    and payer organizations. Once contracted, health systems refer patients through their normal
    clinical workflows with minimal incremental acquisition cost per patient episode.


    The company's 40 health system enterprise contracts across 50 metropolitan areas imply an
    average of fewer than 1 contract per metro, suggesting significant room for expansion within
    existing geographic footprint before requiring new market entry costs. Each new health system
    enterprise contract expands the referral pipeline without proportional growth in direct patient
    acquisition costs.
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  tableRefs: []
  figureRefs:
  - FI002

- id: cost-structure-and-margins
  title: "Cost structure, gross margin drivers, and capital intensity"
  body: >-
    DispatchHealth's cost structure is dominated by labor costs: acute care nurses, paramedics,
    physician assistants, and other clinical staff represent the primary variable cost per visit
    or admission. Additional variable costs include mobile diagnostic equipment maintenance,
    medical supplies, and last-mile transportation for equipment and clinical staff.


    Fixed costs include the clinical command center (technology and staffing), corporate
    infrastructure, and the Medically Home technology platform (which requires ongoing integration
    investment post-merger). Technology capex for integrating the Medically Home clinical command
    center platform is a near-term elevated cost that should normalize over 2-3 years post-merger.


    Gross margins for hospital-at-home services are structurally constrained by high labor
    costs relative to reimbursement rates. In the broader home health services sector, gross
    margins typically range from 25-40 percent for nursing-intensive services; DispatchHealth's
    combination of acute care (higher acuity = higher labor cost) and technology enablement
    (lower marginal cost per incremental system) implies a blended margin profile that is not
    publicly disclosed.


    Working capital requirements are moderate: fee-for-service payers typically reimburse within
    30-90 days of claim submission, and DispatchHealth's enterprise contracts with health systems
    may include upfront or milestone payments. However, claim denials, prior authorization delays,
    and payer-specific reimbursement rates create revenue cycle uncertainty.


    Capital expenditure is primarily for mobile diagnostic equipment (X-ray units, ultrasound
    devices, CLIA-certified mobile labs), clinical command center infrastructure, and technology
    platform development. The company raised a $75 million conventional debt facility in October
    2022 specifically for equipment and operational scaling.
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  tableRefs:
  - TI003
  figureRefs: []

- id: public-traction-vs-private-gaps
  title: "Public traction versus private metric gaps"
  body: >-
    DispatchHealth discloses a robust set of operational and clinical metrics that serve as
    proxies for financial health, but the company withholds the financial metrics investors
    typically require to assess revenue quality and capital efficiency.


    Public operational metrics include: 1.2 million patients treated since 2013, 58 percent ER
    avoidance rate (company-claimed), 8.5 percent 30-day readmission rate (vs 15 percent national
    average), 98 percent patient satisfaction, 50 metropolitan areas, 40-plus health system
    enterprise contracts, 2,000-plus HAC admissions in 2024, and an estimated $1.5 billion in
    total medical cost savings generated.


    These metrics paint a picture of strong clinical quality but do not directly support financial
    analysis. The critical missing metrics are: annual revenue (not disclosed), gross margin (not
    disclosed), EBITDA or net income (not disclosed), monthly or quarterly cash burn (not disclosed),
    cash on hand post-Series E1 (not disclosed), and revenue by service line (not disclosed).


    Third-party financial estimates from Compworth ($257.7M-$312.2M revenue), Tracxn (funding
    data), and PremierAlts ($3.7B valuation) provide directional context but are modeled rather
    than sourced from company disclosures. The gap between these estimates and actual financials
    could be material.
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
  tableRefs:
  - TI005
  figureRefs:
  - FI003

- id: capital-adequacy-and-verdict
  title: "Capital adequacy, burn, runway, and financial verdict"
  body: >-
    DispatchHealth closed a $160 million Series E1 round in March 2025, bringing total capital
    raised to approximately $906.8 million. The Series E1 was announced concurrently with the
    Medically Home merger announcement, suggesting the capital raise was intended to fund both
    ongoing operations and merger integration costs.


    At approximately $906.8 million total raised against a $3.7 billion valuation, the capital
    efficiency ratio is approximately 4.04x, which is healthy for a healthcare services platform
    at this stage. However, healthcare services companies typically require ongoing capital
    investment to fund geographic expansion (mobile diagnostic equipment, clinical staffing per
    new metro), and merger integration is a one-time capital consumption event.


    A monthly burn rate estimate is not publicly available. Based on the revenue estimate of $257-
    $312 million annually and a gross margin assumption of 25-35 percent (consistent with the home
    health sector), operating income before corporate overhead could be $65-$109 million annually.
    However, headcount of 985-1,200 employees at healthcare-sector compensation levels implies
    substantial corporate overhead. Without audited financials, any burn-rate estimate is highly
    speculative.


    The $160 million Series E1 provides approximately 12-24 months of additional capital runway
    depending on the burn rate. If DispatchHealth is cash-flow negative (plausible for a
    growth-stage healthcare platform with ongoing merger integration), the next capital event
    or liquidity milestone (IPO, strategic acquisition, large debt facility) may be required
    within 2-4 years of the Series E1 close.


    Financial verdict: DispatchHealth presents a high-quality revenue base (in-network fee-
    for-service, payer-investor relationships, CMS waiver extension) but material uncertainty
    around profitability, margin path, and true burn rate. The post-merger integration of Medically
    Home adds near-term cost pressure. The combination of regulatory certainty, payer-investor
    alignment, and operational scale justifies a premium valuation, but the lack of financial
    transparency makes the $3.7 billion mark difficult to independently verify.
  claimRefs:
  - CI019
  - CI020
  - CI021
  - CI022
  - CI023
  tableRefs:
  - TI004
  figureRefs:
  - FI004

