              DispatchHealth's distributed clinical model depends on paramedics, nurses, and physicians in patient homes
              — workforce categories experiencing persistent national shortages documented by the American Nurses
              Association. The AHRQ Healthcare Cost and Utilization Project benchmarks the national 30-day readmission
              rate at approximately 15%, against which DispatchHealth's claimed 8.5% rate is validated; however, a
