  - id: FO002
    title: Company snapshot logic
    type: flow
    layout: standard
    summary: >-
      The DispatchHealth operating model connects clinical credibility (hospital-level care), a payer-aligned investor
      base, an enterprise B2B2C distribution system, and a technology platform into a mutually reinforcing loop that
      makes hospital-at-home cost-effective for payers and operationally scalable for health systems.
    data:
      nodes:
        - id: n1
          label: Clinical founding team
          description: >-
            Dr. Prather (ER physician) and Riddleberger (PA-C) design hospital-at-home as a clinical first imperative,
            not a technology startup.
        - id: n2
          label: B2B2C enterprise model
          description: Health systems and payers refer patients; DispatchHealth delivers care at home and bills insurance.
        - id: n3
          label: Payer-investor alignment
          description: >-
            Humana, Blue Shield CA, Optum are both investors and customers, reducing CAC and aligning incentives for
            payer referrals.
        - id: n4
          label: Three service lines
          description: >-
            ER-Alternative Care, Hospital-Alternative Care (HAC), and Transitional Care cover the full
            acute-and-post-acute spectrum.
        - id: n5
          label: Medically Home technology
          description: Clinical command center and telehealth platform acquired in 2025 merger; enables virtual acute oversight.
        - id: n6
          label: Regulatory infrastructure
          description: >-
            ACHC accreditation, CMS AHCAH waiver participation, CLIA-certified mobile lab, and state licensure create
            barriers to entry.
      edges:
        - from: n1
          to: n2
          label: clinical credibility drives enterprise trust
        - from: n2
          to: n3
          label: enterprise contracts attract payer investors
        - from: n3
          to: n4
          label: payer alignment expands covered service lines
        - from: n4
          to: n5
          label: HAC service line requires virtual command center
        - from: n5
          to: n6
          label: technology integration strengthens accreditation case
        - from: n6
          to: n2
          label: regulatory standing unlocks more enterprise contracts
