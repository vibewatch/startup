            body: >-
              DispatchHealth has not disclosed any verified financial metrics, and the Medically Home merger was
              executed with a counterparty that had a reportedly "dramatic" valuation drop and needed cash infusions to
              survive. Without a data room review, it is impossible to determine whether Medically Home's liabilities
              were fully absorbed and whether the combined entity's true cash position supports the growth narrative.
              The SVB debt facility from 2022 also has unknown current servicer and terms following SVB's 2023 collapse.
            calloutType: risk
            claimRefs:
