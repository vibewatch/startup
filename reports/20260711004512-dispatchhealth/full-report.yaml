      - number: '5.4'
        title: Differentiation, IP, data, and trust controls
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth's differentiation is a compound of clinical credibility, regulatory credentials, operating
              scale, and proprietary protocols that competitors must replicate from scratch. The ACHC accreditation,
              CLIA-certified mobile laboratory, 60+ proprietary clinical protocols, and AHCAH waiver participation are
              each individually meaningful barriers; together they constitute a regulatory and clinical operating moat
              that no competitor has assembled at the same breadth.

              The Medically Home command center technology adds a second differentiator: the clinical infrastructure to
              manage inpatient-acuity patients remotely at scale. Before the merger, only Mayo Clinic and Kaiser
              Foundation Hospitals had operational scale with Medically Home's platform. Post-merger, DispatchHealth has
              the command center capability AND the field dispatch infrastructure, which Medically Home lacked
              independently. The combination creates a vertically integrated home-hospital that neither company could
              have built alone in the near term.

              EHR integration is a stickiness mechanism. Once a health system has embedded DispatchHealth's
              bidirectional EHR workflow into its referral process, the switching cost is a full EHR integration
              re-implementation — a meaningful deterrent to churn in the health system segment.

              On the trust and privacy side, DispatchHealth publishes a Terms of Service and HIPAA-compliant data
              handling framework. The company handles protected health information (PHI) across all patient encounters.
              Distributed care delivery — care provided at patients' homes rather than in a controlled facility —
              creates a broader attack surface for HIPAA compliance than a traditional hospital. The absence of a public
              security posture page, published BAA template, or third-party security certification (SOC 2, HITRUST) from
              publicly accessible sources is a diligence gap that enterprise health system procurement teams will raise.

              The developer surface is minimal by design: DispatchHealth is an enterprise clinical services company that
              operates through direct health system and payer contracts, not a platform that sells APIs to third-party
              developers. LinkedIn engineering job postings confirm a software engineering presence (EHR integration,
              telehealth infrastructure, data platforms) but no public developer portal, API documentation, or
              open-source contribution exists in the public record.
