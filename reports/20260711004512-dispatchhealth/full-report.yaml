      - number: '3.2'
        title: Competitor profiles and strategic positioning
        blocks:
          - type: paragraph
            body: >-
              Contessa Health, acquired by Amedisys for $250 million in 2021, operates a joint-venture model with
              hospital partners to provide hospital-at-home services. Contessa had established more than 10 health
              system JV relationships before the acquisition. Under Amedisys (itself being acquired by UnitedHealth
              Group in a deal that has faced regulatory scrutiny), Contessa's model is being integrated into Amedisys's
              broader home health portfolio. Contessa is the most directly comparable JV-enablement competitor; its
              acquisition by Amedisys provides it with operational scale but also creates strategic uncertainty during a
              period of Amedisys/UHG merger integration.


              Landmark Health was acquired by OptumHealth (UHG subsidiary) in 2021 for an undisclosed amount. Landmark's
              model focuses on longitudinal home-based primary care for complex chronic patients rather than episodic
              acute care substitution. Its integration into Optum provides massive distribution reach but repositions it
              away from acute H@H toward chronic care management. Optum (through both Landmark and Optum Ventures) is an
              investor in DispatchHealth, creating a dual investor-competitor dynamic worth flagging.


              Biofourmis is an AI-powered remote patient monitoring and care management platform that competes with the
              technology layer of DispatchHealth's clinical command center. Biofourmis has raised over $300 million in
              venture funding and serves health systems with RPM and predictive analytics tools. Its model is
              software-centric rather than direct-care, making it a complementary partner for some health systems and a
              partial substitute for others.


              Inbound Health, based in Minneapolis, is a smaller H@H enablement company operating primarily in
              partnership with regional health systems. It has less scale than DispatchHealth but targets a similar
              market with a health-system JV model. Inbound Health has limited public financial disclosure and its scale
              is not independently verified.


              Current Health was acquired by Best Buy in 2021 as part of the retailer's health strategy; it operates as
              Best Buy Health's remote patient monitoring platform. Its model is RPM-centric with low clinical acuity
              coverage, making it a partial substitute for DispatchHealth's transitional care and outpatient monitoring
              workflows.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: Feature, capability, and pricing comparison
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth is the only operator in the field that publicly claims all three core service lines
              simultaneously: ER-alternative care, Hospital-Alternative Care (HAC), and Transitional Care. The ACHC
              In-Home Hospital Care Accreditation (first-ever, November 2024) provides an external quality signal that
              no competitor currently holds.


              Contessa's JV model focuses on HAC and some transitional care but does not offer ER-alternative triage at
              scale. Landmark's model covers longitudinal chronic care rather than episodic acute care. Biofourmis is a
              software platform and lacks direct care delivery. Inbound Health covers HAC through health system
              partners. Current Health is RPM-only.


              On pricing, all competitors operate on fee-for-service reimbursement through payers or DRG- equivalent
              reimbursement through the CMS AHCAH waiver. Exact contract pricing is proprietary for all players.
              DispatchHealth's revenue-per-episode is estimated to be in the range of $1,500 to $5,000 depending on
              service line and payer, based on analyst estimates and published cost-savings data. No independent pricing
              database exists for this sector.


              Distribution is a key differentiator. DispatchHealth has 40 health system enterprise contracts, 50-metro
              coverage, and payer-investor partnerships (Humana, Blue Shield of California, Optum) that create referral
              pipelines competitors cannot easily replicate. This investor-payer alignment constitutes one of
              DispatchHealth's most durable competitive advantages.
            claimRefs:
              - CP011
