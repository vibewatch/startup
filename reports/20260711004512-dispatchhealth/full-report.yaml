  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation — who pays, who uses, and how they engage
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth's customer base divides into two primary enterprise buyer segments and two end-user
              populations. The enterprise buyers are health systems and payers. Health systems contract with
              DispatchHealth to provide on-demand home care for patients who would otherwise present to their emergency
              departments or inpatient units; they pay through a combination of capitated value-based arrangements and
              direct fee-for-service referral models. Payers — primarily Medicare Advantage plans, commercial insurers,
              and Medicaid managed care organizations — contract with DispatchHealth either directly or through their
              risk-bearing provider relationships to reduce the per-member cost of acute care episodes.

              The end-users are patients (direct care recipients) and referring clinicians (physicians, case managers,
              care coordinators). Patients do not pay DispatchHealth directly — they engage with their existing
              insurance coverage, which in most cases is in-network for DispatchHealth. Referring clinicians interact
              with DispatchHealth through EHR referral workflows or direct dispatch call center contacts.

              DispatchHealth's strategic investors are also customers: Humana invested in DispatchHealth and is a major
              Medicare Advantage payer with natural economic alignment for in-home care that reduces hospital cost. Blue
              Shield of California invested and is an enterprise payer in DispatchHealth's California markets. Optum
              Ventures (UHG) invested, and OptumHealth's clinical programs represent potential referral channels. These
              investor-customer relationships reduce independent acquisition cost but also create concentration risk and
              potential conflict-of-interest scenarios if the payer relationship deteriorates.

              Geographic segmentation covers 50+ major metro areas post-merger, primarily concentrated in high-density
              markets where dispatch economics are most favorable. DispatchHealth operates in 20+ states, with
              enterprise contracts requiring a minimum market density to maintain clinical team utilization. The company
              targets markets with high Medicare Advantage penetration, where the payer has the greatest financial
              incentive to avoid facility-based care.
