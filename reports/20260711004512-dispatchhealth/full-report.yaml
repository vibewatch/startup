      - number: '6.3'
        title: Retention, satisfaction, and adverse context
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth reports a 98% patient satisfaction rating, which is among the highest published in digital
              health. Patient satisfaction at this level is consistent with the value proposition — being treated at
              home rather than waiting in an emergency department is inherently patient-preferred. However, patient
              satisfaction is not enterprise retention: the relevant retention metric is health system and payer
              contract renewal, which is not publicly disclosed.

              The adverse retention signal comes from the Medically Home financial situation disclosed in the Axios June
              2025 leak. A 498-page document reportedly revealed that Medically Home experienced a "dramatic" valuation
              drop and survived only through emergency cash infusions from Mayo Clinic and Kaiser Foundation Hospitals —
              both also listed as investors. Some Medically Home executives and investors received partial liquidation
              proceeds from the DispatchHealth merger. The financial distress also included an employee headcount
              decline from 1,500+ to approximately 985-1,200, representing a documented 3%+ decline in staff (the larger
              number suggests a more significant restructuring). This is the most direct adverse evidence on the
              customer/partner side: at least two of Medically Home's most important health system partners (Mayo
              Clinic, Kaiser) stepped in as emergency capital providers, which could indicate relationship stress even
              as they maintained financial commitment.

              DispatchHealth declined to comment on Medically Home's financial details in response to the Axios
              reporting. The company has not published health system contract renewal rates, net revenue retention,
              gross revenue retention, or churn data. Without this data, enterprise retention durability cannot be
              independently assessed.

              The CMS AHCAH waiver brief lapse in October 2025 created temporary reimbursement uncertainty for HAC
              program patients and health system partners. No public disclosure of contract renegotiations or health
              system partner withdrawals as a result of the lapse has been found.
