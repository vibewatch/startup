            body: >-
              DispatchHealth's expansion levers are geographic (new metro markets), service line (HAC adoption by
              existing health system partners), and payer contract (adding Medicaid managed care, additional commercial
              plans). The post-merger 50-metro footprint represents the current geographic ceiling; additional market
              entries require minimum patient volume density to support clinical team utilization economics.

              Concentration risk is real but not fully quantifiable from public sources. DispatchHealth does not
              disclose its top customer revenue concentration. However, the investor-customer overlap — Humana, Blue
              Shield of California, Optum Ventures — suggests that a few large payer relationships likely account for a
              disproportionate share of patient referrals and thus revenue. If Humana were to reduce its Medicare
              Advantage plan enrollment or shift referral policy, DispatchHealth's California and national MA volumes
              would be affected. The Medically Home combination may partially redistribute this concentration by
              bringing Mayo Clinic and Kaiser Foundation Hospitals into the ecosystem, but those are operational
              partners rather than pure payer-volume contributors.

              Land-and-expand within health system accounts is possible: a health system that starts with ER-alternative
              care can expand to HAC (if it has AHCAH waiver approval), then add transitional care. The EHR integration
              creates switching cost that supports expansion conversations. However, no public data on average revenue
              per health system customer, expansion rate, or time-to-HAC-adoption from initial contract is available.

              The Contessa Health comparison is instructive: Amedisys acquired Contessa for $250M in 2021, and Contessa
              operates a joint-venture model rather than a fee-for-service model. This means DispatchHealth competes
              with an approach (JV) that gives health systems more ownership control, which some systems prefer. That
