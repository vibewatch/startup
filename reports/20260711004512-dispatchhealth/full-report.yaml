companyProfile:
  summary: >-
    DispatchHealth is a Denver-based, late-stage hospital-at-home company founded in 2013 by ER physician Dr. Mark
    Prather and PA-C Kevin Riddleberger. It deploys mobile clinical teams to deliver emergency-level and
    inpatient-equivalent care in patients' homes under three service lines: ER-Alternative Care, Hospital-Alternative
    Care (HAC), and Transitional Care. A $160 million Series E1 round in March 2025 valued the company at $3.7 billion;
    the simultaneous merger with Medically Home established DispatchHealth as the largest independent national
    hospital-at-home operator. The company operates under a B2B2C model contracting with 50+ health systems and payers
    across 50 major metro areas. Platform reimbursement is anchored to the CMS Acute Hospital Care at Home waiver,
    extended through September 2030.
