  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, scope, and adjacent segments
        blocks:
          - type: paragraph
            body: >-
              The relevant market for DispatchHealth spans three interrelated care segments that are converging under
              the hospital-at-home (H@H) umbrella. The core market is acute-level care delivered outside a traditional
              hospital setting—encompassing emergency-alternative triage, hospital-level inpatient substitution, and
              post-acute transitional care that bridges inpatient discharge to home. The CMS Acute Hospital Care at Home
              (AHCAH) waiver program, extended through September 2030 under the Consolidated Appropriations Act of 2026,
              is the primary regulatory frame that defines what qualifies as reimbursable inpatient-equivalent home care
              under Medicare.


              Within this broad frame, DispatchHealth competes principally in the acute home care and hospital-at-home
              sub-segment, distinct from non-acute home health (skilled nursing visits, therapy, wound care) and from
              chronic care management (continuous RPM, longitudinal complex-patient programs). These
              adjacencies—non-acute home health (an estimated $120 billion market), chronic disease management
              platforms, and remote patient monitoring—are complementary and are sometimes counted together in broad
              home healthcare market estimates, inflating headline TAMs.


              The status-quo substitutes are: inpatient hospital admission (the primary substitute), emergency
              department visits, skilled nursing facility (SNF) stays, and outpatient specialty clinics for lower-acuity
              cases. The hospital-at-home model captures value by displacing SNF, inpatient stays, and unnecessary ED
              visits simultaneously. Market boundaries must therefore exclude routine home health visits (already a
              separate CMS benefit) and telehealth-only models (no physical care delivery), which are adjacent services
              that DispatchHealth's clinical command center model complements but does not replace.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs: []
      - number: '2.2'
        title: TAM, SAM, and SOM sizing with multiple lenses
        blocks:
          - type: paragraph
            body: >-
              Market sizing for hospital-at-home is complicated by methodological inconsistency across analyst reports.
              The broadest estimates capture the full home healthcare continuum; narrow estimates restrict to acute H@H
              admissions only.


              The hospital-at-home sub-market specifically (not broader home health) was valued at approximately $37.17
              billion globally in 2025 by MarketsandMarkets, with a projected CAGR of 7.8 to 11.9 percent through 2034.
              This translates to an addressable market of roughly $60 to $80 billion globally by 2034, or approximately
              $25 to $35 billion in the United States alone. A McKinsey analysis frequently cited in industry
              discussions estimated that up to $265 billion of care currently delivered in Medicare fee-for-service
              settings could shift to the home setting by 2025; however, this McKinsey estimate is the broadest possible
              interpretation and conflates many care types far beyond acute H@H.


              DispatchHealth's SAM is more precisely defined by the intersection of: (a) CMS AHCAH waiver participation
              (320 or more hospitals across 133 health systems in 37 states as of April 2024), (b) commercially insured
              and Medicare Advantage patients in markets where DispatchHealth is operational (50 metropolitan areas),
              and (c) the subset of admissions that are clinically appropriate for H@H—generally estimated at 10 to 20
              percent of all inpatient admissions. With approximately 36 million annual U.S. hospital admissions (AHRQ
              data), a 10-percent clinical eligibility floor implies a clinical TAM of roughly 3.6 million eligible
              annual admissions. At an average revenue of $3,000 to $6,000 per H@H admission (below inpatient cost), the
              U.S. SAM for acute H@H platforms is approximately $10 to $22 billion annually.


              DispatchHealth's SOM is anchored to its current operational footprint. It treated approximately 2,000-plus
              hospital-level admissions in 2024 across 50 metros. At an estimated average revenue per admission of
              $3,000 to $5,000, the SOM from H@H alone is currently in the range of $6 to $10 million—a tiny fraction of
              the SAM. The company's total revenue estimate of $257 to $312 million reflects predominantly
              fee-for-service ER-alternative visits and transitional care episodes, which have a lower per-visit revenue
              profile. The post-merger combined entity with Medically Home's 55,000-plus enabling platform admissions
              represents a more meaningful SOM, though those admissions are driven through partner health systems rather
              than directly by DispatchHealth.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
