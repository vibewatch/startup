      - number: '3.4'
        title: Switching costs, lock-in, and competitive moat
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth's competitive moat has three primary components: operational infrastructure, payer-investor
              alignment, and regulatory certification.


              The operational infrastructure moat is real but not impenetrable. Building a hospital-at-home platform
              requires clinical command center technology, mobile diagnostic equipment (X-ray, ultrasound,
              CLIA-certified mobile lab), trained acute-care nursing staff, logistics networks for last-mile delivery,
              and EHR integration with partner health systems. Each of these represents a meaningful barrier to entry
              for a new competitor, and building them takes 2-4 years of capital investment. However, the post-merger
              integration of Medically Home's technology into DispatchHealth introduces execution risk that could
              partially erode this moat if the integration is slow or problematic.


              The payer-investor moat is stronger and more durable. Humana, Blue Shield of California, and Optum are
              simultaneously investors and payer customers. These relationships provide referral pipelines that are
              effectively exclusive for DispatchHealth within those payer networks. A competing H@H operator would need
              to independently negotiate payer contracts across dozens of major insurers, a process that takes 6-18
              months per payer and is competitive.


              ACHC accreditation (first-ever, November 2024) creates a trust signal and quality standard that payers and
              health systems increasingly require for program certification. This will be replicated by competitors over
              time but provides a 12-24 month first-mover advantage.


              Switching costs for health systems are moderate-to-high: changing from DispatchHealth to another platform
              requires re-integrating EHR connections, retraining staff, renegotiating payer contracts, and potentially
              dissolving JV structures. This creates meaningful lock-in for existing enterprise customers.
            claimRefs:
              - CP016
              - CP017
              - CP018
              - CP019
              - CP020
          - type: figure
            figureRef: FP003
            claimRefs:
              - CP016
              - CP017
              - CP018
              - CP019
              - CP020
      - number: '3.5'
        title: Moat durability, commoditization risk, and adverse competitor signals
        blocks:
          - type: paragraph
            body: >-
              The hospital-at-home sector faces a long-term commoditization risk from three directions: regulatory
              standardization, technology commoditization, and health system vertical integration.


              Regulatory standardization: the CMS AHCAH waiver creates uniform coverage criteria that any hospital can
              use. As more health systems build proprietary programs, the enablement platform becomes less
              differentiated. The waiver extension to 2030 is both a tailwind (certainty for existing platforms) and a
              risk (normalizes the market, enabling more internal build decisions).


              Technology commoditization: Medically Home's clinical command center technology, once a proprietary
              differentiator, is now being absorbed into DispatchHealth's platform. Meanwhile, competing RPM and
              telehealth platforms (Biofourmis, Current Health) are improving clinical capabilities and could eventually
              offer comparable command center functionality at lower cost.


              Health system vertical integration: large systems like Mass General Brigham, UPMC, and Mayo Clinic have
              opted to build proprietary H@H programs rather than contract an external platform. This "internal build"
              trend could intensify if the technology and operational components become sufficiently standardized.


              Adverse signals: the Medically Home merger itself surfaced a cautionary signal. Home Health Care News
              reported (June 2025) that a leaked internal document described Medically Home's "dramatic" valuation drop
              and reliance on cash infusions from Mayo Clinic and Kaiser before the merger. This suggests that the H@H
              enablement model is harder to monetize than expected at scale, and that DispatchHealth's combined platform
              faces profitability headwinds from the technology-enablement component.
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
          - type: table
            tableRef: TP004
            claimRefs: []
      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: >-
              DispatchHealth is the only national platform combining full-stack acute care delivery with technology
              enablement
            body: >-
              No competitor currently combines emergency-alternative care, hospital-level HAC, transitional care, a
              clinical command center, mobile diagnostics, and ACHC accreditation at national scale. The post-merger
              entity with Medically Home uniquely spans both direct care delivery (to patients) and technology
              enablement (for health systems), creating a platform that health systems can contract for either or both
              models. This is a structural differentiation that Contessa, Biofourmis, and Landmark individually cannot
              replicate without major investment.
            calloutType: strength
            claimRefs:
              - CP011
              - CP012
          - type: callout
            title: The internal-build threat from large health systems is the most underappreciated competitive risk
            body: >-
              Mass General Brigham, UPMC, Mayo Clinic, and Kaiser -- all large systems with substantial capital and
              physician referral networks -- have chosen to build proprietary H@H programs rather than contract
              DispatchHealth. This internal build dynamic is enabled by the CMS AHCAH waiver (which any eligible
              hospital can access) and by standardization of RPM and telehealth technology. If the internal-build trend
              accelerates, DispatchHealth's addressable market of health system enterprise contracts could shrink
              materially, particularly in markets where large self-sufficient systems dominate.
            calloutType: risk
            claimRefs:
              - CP003
              - CP022
              - CP023
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, pricing model, and revenue quality
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth operates a fee-for-service revenue model with three primary service lines post-merger:
              ER-alternative care, Hospital-Alternative Care (HAC), and Transitional Care. Each service line generates
              revenue through payer reimbursement -- either directly from insurance companies or through the CMS Acute
              Hospital Care at Home (AHCAH) waiver for Medicare fee-for-service patients. Health systems that contract
              DispatchHealth's enablement technology (Medically Home platform) may also pay enterprise licensing or
              management fees, though the financial terms of these arrangements are not publicly disclosed.


              ER-alternative visits are the highest-volume service line and are believed to represent the majority of
              DispatchHealth's current revenue. These visits involve acute-level triage, diagnosis, and treatment at the
              patient's home in lieu of an emergency department visit, and are reimbursed by payers at rates that vary
              by plan and market. DispatchHealth reports being in-network with most major insurance companies, which is
              a prerequisite for sustainable fee-for-service revenue.


              Hospital-Alternative Care (HAC) admissions generate higher per-episode revenue than ER-alternative visits
              (estimated $3,000-$7,500 per HAC admission versus approximately $500-$1,500 per ER- alternative visit) but
              require greater operational investment per patient. DispatchHealth reported 2,000-plus HAC admissions in
              2024, and the merged entity with Medically Home is expected to scale this significantly.


              Third-party revenue estimates for DispatchHealth range from $257.7 million to $312.2 million for
              2025-2026. These estimates are produced by data aggregators (Compworth, ZoomInfo, Tracxn) using
              proprietary modeling, not from verified company financial disclosures. DispatchHealth has not publicly
              confirmed its revenue figures. The estimates imply a revenue-per-employee ratio of approximately
              $200,000-$250,000 at the current headcount of 985-1,200 employees, which is consistent with a
              high-labor-cost healthcare services model.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
