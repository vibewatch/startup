      - number: '5.2'
        title: Technology architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth's technology stack is best understood as three integrated layers: field hardware, clinical
              software, and the command center platform inherited from Medically Home.

              At the field hardware layer, each dispatch vehicle carries portable X-ray, ultrasound, POCUS, and the CLIA
              mobile laboratory. The CLIA certification (moderately complex) is a regulatory credential that allows the
              team to perform tests on-site that would otherwise require a hospital lab. This is not software — it is
              credentialed clinical infrastructure that competitors without laboratory capability cannot replicate
              quickly. Medical-grade devices dispatched to patient homes (IV pumps, monitoring equipment, pulse
              oximetry, oxygen) extend the hardware footprint into a residential care setting.

              At the clinical software layer, DispatchHealth integrates bidirectionally with partner health-system EHR
              systems. When a patient is treated, clinical notes flow back into the health system's record. This
              integration is both an operational necessity and a retention mechanism: a health system that has embedded
              DispatchHealth into its EHR workflow faces switching friction. The company also provides a telehealth and
              virtual care capability so that a remote physician can supervise a field team's encounter when needed.

              The command center layer is the key addition from the Medically Home merger. Medically Home pioneered the
              clinical command center model: a 24/7 physician-led hub that provides continuous virtual oversight of home
              patients enrolled in hospital-at-home programs. This command center model was validated at Mayo Clinic and
              Kaiser Foundation Hospitals before the merger. Post-merger, DispatchHealth is integrating the command
              center with its own field dispatch operations to create what management describes as a unified platform
              for complex care at home.

              AI-assisted triage and clinical decision support tools are described in company materials as supporting
              the dispatch routing and clinical protocol selection processes, though the depth and specificity of the AI
              layer are not publicly detailed. DispatchHealth has developed proprietary clinical protocols for 60+
              conditions, which represent a codified clinical knowledge base that new entrants must build or license.
