      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Fee-for-service revenue from payer-investor relationships creates a structurally defensible revenue base
            body: >-
              DispatchHealth's revenue from Humana, Blue Shield of California, and Optum-affiliated networks is
              partially protected by the dual investor-payer relationship. These payers have financial incentives as
              investors to maintain preferred-provider terms and high referral volumes for DispatchHealth. This creates
              a structural floor on revenue from those channels that pure fee-for-service competitors lack. The CMS
              waiver extension to 2030 further secures the Medicare fee-for-service revenue pathway for five years.
            calloutType: strength
