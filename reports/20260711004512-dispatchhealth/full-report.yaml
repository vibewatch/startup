      - number: '4.5'
        title: Capital adequacy, burn, runway, and financial verdict
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth closed a $160 million Series E1 round in March 2025, bringing total capital raised to
              approximately $906.8 million. The Series E1 was announced concurrently with the Medically Home merger
              announcement, suggesting the capital raise was intended to fund both ongoing operations and merger
              integration costs.


              At approximately $906.8 million total raised against a $3.7 billion valuation, the capital efficiency
              ratio is approximately 4.04x, which is healthy for a healthcare services platform at this stage. However,
              healthcare services companies typically require ongoing capital investment to fund geographic expansion
              (mobile diagnostic equipment, clinical staffing per new metro), and merger integration is a one-time
              capital consumption event.


              A monthly burn rate estimate is not publicly available. Based on the revenue estimate of $257- $312
              million annually and a gross margin assumption of 25-35 percent (consistent with the home health sector),
              operating income before corporate overhead could be $65-$109 million annually. However, headcount of
              985-1,200 employees at healthcare-sector compensation levels implies substantial corporate overhead.
              Without audited financials, any burn-rate estimate is highly speculative.


              The $160 million Series E1 provides approximately 12-24 months of additional capital runway depending on
              the burn rate. If DispatchHealth is cash-flow negative (plausible for a growth-stage healthcare platform
              with ongoing merger integration), the next capital event or liquidity milestone (IPO, strategic
              acquisition, large debt facility) may be required within 2-4 years of the Series E1 close.


              Financial verdict: DispatchHealth presents a high-quality revenue base (in-network fee- for-service,
              payer-investor relationships, CMS waiver extension) but material uncertainty around profitability, margin
              path, and true burn rate. The post-merger integration of Medically Home adds near-term cost pressure. The
              combination of regulatory certainty, payer-investor alignment, and operational scale justifies a premium
              valuation, but the lack of financial transparency makes the $3.7 billion mark difficult to independently
              verify.
            claimRefs:
              - CI019
              - CI020
              - CI021
              - CI022
              - CI023
