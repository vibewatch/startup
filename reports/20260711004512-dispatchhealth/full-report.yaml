  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and severity ranking
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth's most severe risk is its time-limited dependency on the CMS Acute Hospital Care at Home
              waiver. Extended through September 30, 2030 by the Consolidated Appropriations Act of 2026, the waiver
              enables hospital-level Medicare and Medicare Advantage reimbursement for care delivered at home. Without a
              permanent payment code, the HAC service line's revenue stream will require yet another legislative
              extension before 2030. A brief October 2025 lapse — before Congress extended the waiver — demonstrated the
              vulnerability: even a short authorization gap can freeze new episode starts and create immediate
              operational disruption. Secondary severity risks include clinical staffing shortage (national nursing and
              paramedic workforce constraints limit new-market scaling), the unresolved status of DispatchHealth's $75M
              Silicon Valley Bank debt facility (SVB collapsed March 2023), and the financial integration complexity of
              absorbing Medically Home — a company that required emergency capital from investor-customers Mayo Clinic
              and Kaiser Foundation Hospitals before the merger closed. Each risk below is rated for likelihood and
              financial impact.
            claimRefs: []
