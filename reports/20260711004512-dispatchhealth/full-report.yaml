      - number: '8.2'
        title: Recommendation, confidence, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              At a $3.7B post-money valuation and an estimated 12-14x revenue multiple, DispatchHealth is priced for
              execution of the bull case. The recommendation is a conditional-watch rating: strategically compelling and
              defensible if CMS converts AHCAH to permanent payment, but overvalued absent that conversion given the
              opacity of unit economics. The comparable set supports a base fair value of $2.5-4.5B under current
              information: Oak Street Health exited at approximately 3x revenue; Contessa Health at 2-3x revenue; the
              premium DispatchHealth commands reflects its technology-platform positioning and the optionality of a
              permanent payment code. At 13x estimated revenue, the market is already pricing in regulatory resolution
              that has not yet occurred. The high-execution-risk rating is warranted by an untested CEO in Jennifer
              Webster (in role since late 2023), the most complex operational integration in the hospital-at-home
              sector, an undisclosed SVB debt facility, and the Medically Home financial distress disclosed
              post-announcement. A $2B downside scenario is plausible if the CMS waiver is not renewed post-2030 or if
              clinical scaling creates material adverse events. Entry discipline should require audited financials
              demonstrating at least three quarters of revenue trajectory, confirmation of SVB debt status, and evidence
              of Medically Home integration on-track before committing at the $3.7B valuation.
            claimRefs: []
          - type: table
            tableRef: TV001
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV004
            claimRefs:
