      - number: '2.5'
        title: Sizing gaps, contradictions, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The hospital-at-home market faces three major sizing contradictions that complicate investment thesis
              underwriting.


              First, the headline TAM figures from analyst firms ($37 billion to $265 billion) are not comparable: they
              reflect fundamentally different market definitions. MarketsandMarkets' $37 billion (2025) captures the
              acute H@H segment globally; McKinsey's $265 billion is a U.S.-only thought-experiment projecting the
              maximum care that could shift home from all Medicare settings. Using McKinsey's figure as the addressable
              market for an acute H@H platform provider would be misleading.


              Second, the CMS AHCAH waiver only covers Medicare fee-for-service beneficiaries. Medicare Advantage (MA)
              enrollment now exceeds 54 percent of all Medicare beneficiaries (KFF, 2024); MA plans negotiate their own
              reimbursement rates with H@H providers separately, and there is no national mandate for MA plans to cover
              H@H services at fee-for-service parity. This creates a significant coverage and pricing uncertainty for
              the payer-funded portion of the market.


              Third, the H@H-eligible patient fraction is contested. CMS data from the AHCAH waiver period (November
              2021 to March 2023) showed a 7.2 percent transfer rate back to traditional inpatient settings, indicating
              real clinical risk-stratification challenges. Academic studies (Mass General Brigham, Johns Hopkins) show
              favorable outcomes for carefully selected patients, but selection criteria vary across programs, making
              aggregate TAM calculations unreliable.


              For DispatchHealth specifically, the relevant forward-looking SOM depends on the pace of health system
              contracting, the outcome of Medicare Advantage reimbursement negotiations, and the success of the
              Medically Home technology integration. Third-party revenue estimates ($257 to $312 million for 2025-2026)
              are modeled rather than verified; actual revenue could deviate materially.
            claimRefs:
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Five-year CMS waiver extension removes the primary policy risk for H@H operators
            body: >-
              The Consolidated Appropriations Act of 2026 extended the CMS AHCAH waiver through September 30, 2030—a
              five-year window that gives health systems and payers the certainty needed to invest in hospital-at-home
              infrastructure. This dramatically reduces the regulatory risk that caused program freezes when the waiver
              briefly lapsed in October 2025. DispatchHealth is one of the largest operators in this waiver ecosystem
              with ACHC accreditation and active participation.
            calloutType: strength
            claimRefs:
              - CM019
              - CM022
          - type: callout
            title: Medicare Advantage reimbursement gap is the most material unresolved market risk
            body: >-
              Medicare Advantage now covers more than 54 percent of all Medicare beneficiaries, yet MA plans are not
              required to reimburse H@H at fee-for-service parity. This creates a fragmented payer landscape where
              DispatchHealth must negotiate individual MA contracts—with variable rates and coverage policies—across its
              50-metro footprint. The risk is that MA plans compress margins or limit coverage to reduce cost,
              offsetting the growth tailwind from fee-for-service waiver expansion.
            calloutType: risk
            claimRefs:
              - CM026
              - CM027
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth operates in a fragmented competitive landscape that spans four distinct categories: (1)
              direct peers that provide acute-level care at home as a primary service, (2) incumbent health systems that
              operate proprietary hospital-at-home programs, (3) technology-enablement platforms that partner with
              health systems rather than delivering care directly, and (4) adjacent and substitute providers including
              skilled nursing facilities, outpatient urgent care, and telemedicine platforms.


              The market consolidation phase of 2021-2022 reduced the competitive peer set: Contessa Health was acquired
              by Amedisys for $250 million in 2021, and Landmark Health was acquired by OptumHealth (UHG) in 2021.
              Medically Home, the most direct technology-enablement competitor to DispatchHealth's post-merger model,
              merged with DispatchHealth in May 2025. These exits narrowed the independent operator field considerably.


              The most significant competitive threat to DispatchHealth is not from independent peers but from large
              incumbent health systems building proprietary hospital-at-home programs under the CMS AHCAH waiver. Mass
              General Brigham Healthcare at Home, Mount Sinai at Home, and UPMC at Home are among the systems that have
              developed internal programs with strong physician referral channels and brand equity in their markets.
              These systems do not need to contract an external platform—they represent the "internal build" competitive
              substitute that displaces DispatchHealth's enablement model.


              The combined DispatchHealth-Medically Home entity now spans both direct care delivery and health-system
              enablement technology, positioning it as the broadest-capability platform in the space. However, this
              breadth creates integration risk and increased operational complexity.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs: []
