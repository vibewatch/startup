        - 58% ER avoidance rate; 98% patient satisfaction; estimated cost savings vs ER
        - Not applicable for life-threatening emergencies (chest pain with cardiac risk, stroke, major trauma).
      - - Deliver inpatient-level care without hospitalization
        - Patient admitted to hospital; average 4-5 day stay; facility-borne infection risk; high cost
        - 'HAC program: daily nurse visits, command center monitoring, IV therapy, imaging at home'
