      - number: '4.2'
        title: GTM motion and sales efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth's primary GTM motion is enterprise B2B sales to health systems and payers. Enterprise
              contracts with health systems typically take 6-18 months from initial outreach to contract execution,
              reflecting the clinical, operational, and legal complexity of embedding a third-party clinical service
              into a health system's care delivery model. Payer contracts also require network credentialing, claims
              processing integration, and rate negotiation.


              The company's payer-investor alignment (Humana, Blue Shield of California, Optum Ventures) is the most
              distinctive GTM advantage: these investors are also payer customers, providing DispatchHealth with
              preferred-provider status in those payer networks and materially reducing customer acquisition costs for
              patient referrals from those plans. This structural advantage is not replicable by new entrants without
              similar strategic investor composition.


              No direct Customer Acquisition Cost (CAC) data is publicly available. Proxy metrics suggest high
              sales-cycle cost: DispatchHealth employs a Chief Growth Officer and a dedicated enterprise sales function,
              and its B2B model requires senior executive engagement at both health systems and payer organizations.
              Once contracted, health systems refer patients through their normal clinical workflows with minimal
              incremental acquisition cost per patient episode.


              The company's 40 health system enterprise contracts across 50 metropolitan areas imply an average of fewer
              than 1 contract per metro, suggesting significant room for expansion within existing geographic footprint
              before requiring new market entry costs. Each new health system enterprise contract expands the referral
              pipeline without proportional growth in direct patient acquisition costs.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: figure
            figureRef: FI002
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: Cost structure, gross margin drivers, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth's cost structure is dominated by labor costs: acute care nurses, paramedics, physician
              assistants, and other clinical staff represent the primary variable cost per visit or admission.
              Additional variable costs include mobile diagnostic equipment maintenance, medical supplies, and last-mile
              transportation for equipment and clinical staff.


              Fixed costs include the clinical command center (technology and staffing), corporate infrastructure, and
              the Medically Home technology platform (which requires ongoing integration investment post-merger).
              Technology capex for integrating the Medically Home clinical command center platform is a near-term
              elevated cost that should normalize over 2-3 years post-merger.


              Gross margins for hospital-at-home services are structurally constrained by high labor costs relative to
              reimbursement rates. In the broader home health services sector, gross margins typically range from 25-40
              percent for nursing-intensive services; DispatchHealth's combination of acute care (higher acuity = higher
              labor cost) and technology enablement (lower marginal cost per incremental system) implies a blended
              margin profile that is not publicly disclosed.


              Working capital requirements are moderate: fee-for-service payers typically reimburse within 30-90 days of
              claim submission, and DispatchHealth's enterprise contracts with health systems may include upfront or
              milestone payments. However, claim denials, prior authorization delays, and payer-specific reimbursement
              rates create revenue cycle uncertainty.


              Capital expenditure is primarily for mobile diagnostic equipment (X-ray units, ultrasound devices,
              CLIA-certified mobile labs), clinical command center infrastructure, and technology platform development.
              The company raised a $75 million conventional debt facility in October 2022 specifically for equipment and
              operational scaling.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs: []
      - number: '4.4'
        title: Public traction versus private metric gaps
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth discloses a robust set of operational and clinical metrics that serve as proxies for
              financial health, but the company withholds the financial metrics investors typically require to assess
              revenue quality and capital efficiency.


              Public operational metrics include: 1.2 million patients treated since 2013, 58 percent ER avoidance rate
              (company-claimed), 8.5 percent 30-day readmission rate (vs 15 percent national average), 98 percent
              patient satisfaction, 50 metropolitan areas, 40-plus health system enterprise contracts, 2,000-plus HAC
              admissions in 2024, and an estimated $1.5 billion in total medical cost savings generated.


              These metrics paint a picture of strong clinical quality but do not directly support financial analysis.
              The critical missing metrics are: annual revenue (not disclosed), gross margin (not disclosed), EBITDA or
              net income (not disclosed), monthly or quarterly cash burn (not disclosed), cash on hand post-Series E1
              (not disclosed), and revenue by service line (not disclosed).


              Third-party financial estimates from Compworth ($257.7M-$312.2M revenue), Tracxn (funding data), and
              PremierAlts ($3.7B valuation) provide directional context but are modeled rather than sourced from company
              disclosures. The gap between these estimates and actual financials could be material.
            claimRefs:
              - CI014
              - CI015
              - CI016
              - CI017
              - CI018
