      - number: '7.2'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >-
              The CMS Hospital Outpatient Prospective Payment System (HOPPS) annual rule can reduce per-episode
              reimbursement without Congressional action, making each year's rulemaking cycle a pricing risk. CMS also
              sets patient eligibility requirements for AHCAH participation — including IV-therapy-level acuity
              requirements — that limit the patient population qualifying for HAC episodes, creating patient-selection
              risk. DispatchHealth must hold active clinical licenses in all 20+ states of operation, with each state
              having distinct home health agency, mobile diagnostic, and telehealth requirements. New state entries add
              compliance cost and timeline friction. HIPAA enforcement by the HHS Office for Civil Rights carries civil
              monetary penalties up to $1.9M per violation category annually — material for a distributed model
              collecting patient data in private homes. Telehealth reimbursement flexibility, extended post-COVID but
              not yet permanently codified, affects the virtual care component of the care model.
