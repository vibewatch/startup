      - number: '8.4'
        title: Bull / base / bear scenario analysis
        blocks:
          - type: paragraph
            body: >-
              The three scenarios turn on a single regulatory hinge: whether CMS converts the AHCAH waiver to a
              permanent prospective payment rate before or after September 2030. In the bull case, CMS announces
              permanent hospital-at-home payment codes in 2027-2028, validating the full McKinsey-estimated $265B TAM;
              DispatchHealth captures 10-15% of the addressable market by 2030, reaching $800M-$1B revenue, and exits
              via strategic acquisition at 7-8x forward revenue — implying an $8-12B valuation. In the base case, the
              waiver is renewed again in 2030 but not made permanent, maintaining growth but capping valuation at 4-5x
              forward revenue given persistent uncertainty — implying a $4-7B exit value in 2028-2030. In the bear case,
              the CMS waiver renewal fails permanently, eliminating HAC revenue which represents an estimated 60-70% of
              episode economics. DispatchHealth's urgent-care-only revenue would support a sub-$1B valuation. The
              October 2025 lapse event — even brief — demonstrated the real binary nature of this risk. Bull upside is
              asymmetric relative to entry at $3.7B; bear downside is catastrophic.
            claimRefs: []
