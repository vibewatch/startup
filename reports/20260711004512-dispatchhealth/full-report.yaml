              - CV022
      - number: '8.5'
        title: Comparable valuation set
        blocks:
          - type: paragraph
            body: >-
              The most directly comparable exit is Oak Street Health, acquired by CVS Health for $10.6B in February 2023
              at approximately 3x revenue — a primary-care-at-home platform with Medicare Advantage focus demonstrating
              that major integrated payers will pay premium multiples for proven home-care platforms. Contessa Health
              was acquired by Amedisys for $250M in 2021 at an estimated 2-3x revenue multiple, setting a floor for H@H
              enablement platforms. Landmark Health (OptumHealth) was acquired for an estimated $3B+ demonstrating
              strategic appetite for home-based care at scale. Bright Health Group filed for bankruptcy in 2024 after
              payer-side losses — a cautionary comparable illustrating the downside of payer-dependent models. LHC Group
              was acquired by Optum in 2022 for approximately $6B at roughly 1.5x revenue. DispatchHealth's 12-14x
              estimated revenue multiple is a 4-5x premium over the Oak Street Health benchmark, reflecting the
              technology-platform and permanent-payment-code optionality premium. This premium requires CMS permanence
              to be sustained by comparable precedent.
            claimRefs: []
          - type: table
            tableRef: TV004
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
      - number: '8.6'
        title: Exit readiness and diligence asks
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth has three realistic exit pathways: strategic acquisition by a major integrated
              payer-provider, a traditional IPO when profitability is demonstrated, or continued private growth with a
              mezzanine or Series F round. Strategic acquirers are most likely: Optum already owns Landmark Health for
              longitudinal home care and could acquire DispatchHealth for urgent/episodic care; Humana is both investor
              and payer with 12M+ Medicare Advantage members; CVS Health's Oak Street acquisition demonstrates
              willingness to pay premium multiples. An IPO would require at minimum two to three years of disclosed
              financials and a clear path to operating profitability. Given the Medically Home integration complexity
              and undisclosed financials, IPO in 2026 or 2027 is unlikely. A structured diligence process should
              prioritize: (1) audited financials and unit economics per service line; (2) SVB/First Citizens debt
              facility terms; (3) Medically Home purchase price allocation and goodwill; (4) board composition and
              governance; (5) CMS permanent payment code legislative strategy; (6) enterprise customer contract duration
              distribution. The ACHC accreditation and 1.2M+ patient history are genuine exit-readiness positives, but
              financial opacity remains the primary friction for institutional capital commitment at the $3.7B
              valuation.
            claimRefs: []
