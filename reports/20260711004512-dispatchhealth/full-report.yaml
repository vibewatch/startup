  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth occupies a structurally rare position in 2026: the only scaled, nationally deployed,
              multi-service hospital-at-home platform with clinical evidence, payer contracts, first-ever ACHC In-Home
              Hospital Care Accreditation, and a merged technology command center. The investment thesis rests on four
              pillars. First, the hospital-at-home market is large and growing — estimated at $37.17B in 2025 with a
              11.9% CAGR through 2034, and McKinsey's estimate places up to $265B of annual Medicare care as
              theoretically shiftable to the home. Second, DispatchHealth's B2B2C revenue model de-risks patient
              acquisition through 50+ enterprise health system and payer partners rather than direct-to-consumer
              marketing. Third, clinical outcomes are demonstrably superior — 8.5% 30-day readmission rate versus the
              15% national average, and 98% patient satisfaction. Fourth, the CMS AHCAH waiver extension through
              September 2030 provides a five-year operational runway to scale the hospital-at-home service line and
              pursue permanent payment codes. The anti-thesis is equally clear. CMS permanence is not guaranteed: the
              waiver lapsed briefly in October 2025 before re-authorization, demonstrating real binary risk. The
              Medically Home merger was executed under financial-distress conditions — confirmed by an Axios report
              citing a leaked 498-page document — with Medically Home requiring emergency capital from Mayo Clinic and
              Kaiser Foundation Hospitals before closing. DispatchHealth declined to comment on Medically Home's
              financial history. No revenue, gross margin, or cash burn data has been publicly disclosed, making
              independent valuation validation impossible. Headcount declined from more than 1,500 to approximately
              985-1,200 post-merger, suggesting integration-driven workforce reduction. The $75M Silicon Valley Bank
              debt facility has not been publicly addressed since SVB's March 2023 collapse, representing an
              unquantified balance sheet risk.
            claimRefs: []
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV014
              - CV017
              - CV027
