      - number: '5.3'
        title: Clinical evidence, accreditation, and regulatory credentials
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth's clinical outcomes record is stronger than most digital health companies at the same
              stage. The 58% ER avoidance rate, 8.5% 30-day readmission rate (vs. ~15% national average), and 98%
              patient satisfaction rating are published by the company and corroborated by health system partners. The
              estimated $1.5B in cumulative medical cost savings since 2013, and $5,000-$7,000 per HAC patient versus
              traditional inpatient care, frame the economic argument for payer and health system buyers.

              Independent clinical evidence for the hospital-at-home model more broadly comes from published
              peer-reviewed research. A landmark study in the Annals of Internal Medicine demonstrated comparable or
              superior outcomes for acute hospital-level care delivered at home versus traditional inpatient care. A CMS
              study of the Acute Hospital Care at Home (AHCAH) program covering November 2021 through March 2023 found
              lower mortality and fewer complications versus traditional hospital care across the program's participant
              hospitals. The 7.2% patient transfer rate from home to hospital reported in the CMS study documents the
              safety floor for the model at scale.

              The ACHC In-Home Hospital Care Accreditation, received November 21, 2024, is a first-in-class credential
              that no competitor can claim. ACHC (Accreditation Commission for Health Care) is the same body that
              accredits home health agencies and hospice organizations. The accreditation requires documentation of
              patient safety protocols, clinical quality standards, and operational procedures consistent with
              hospital-level care.

              The CMS Acute Hospital Care at Home (AHCAH) waiver, which authorizes Medicare reimbursement for
              hospital-at-home programs, was extended five years through September 30, 2030 by the Consolidated
              Appropriations Act 2026. This extension converted a key regulatory risk into a medium-term tailwind. As of
              April 2024, 320+ hospitals in 133 health systems across 37 states were approved for AHCAH, demonstrating
              that the regulatory framework is mainstream, not experimental.
