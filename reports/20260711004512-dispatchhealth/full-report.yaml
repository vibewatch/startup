              oversight to the clinical model, requiring integration of two technology platforms, two clinical protocol
              sets, and two organizational cultures. DispatchHealth's combined headcount declined from more than 1,500
              to approximately 985-1,200, suggesting post-merger workforce rationalization that may have created
              institutional knowledge gaps. Equipment supply chain for mobile diagnostic devices (portable X-ray, POCUS,
              mobile lab) across 50+ markets adds a physical logistics risk layer with no precedent in traditional
