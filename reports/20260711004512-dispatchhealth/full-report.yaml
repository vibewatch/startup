              - CV027
              - CV042
              - CV043
      - number: '8.3'
        title: Financing context, entry discipline, and dilution
        blocks:
          - type: paragraph
            body: >-
              The Series E1 round ($160M, March 2025) was led by existing investors with Humana and Blue Shield of
              California continuing participation alongside Optum Ventures (UnitedHealth Group affiliate). Total
              disclosed capital raised stands at $906.8M, implying a capital efficiency ratio of 4.04x (post-money
              valuation / total capital). At the $3.7B post-money, estimated investor ownership across all rounds is in
              the 25-35% range, leaving significant equity for management, early employees, and founders. The $75M debt
              facility originally provided by Silicon Valley Bank (collapsed March 2023) has not been publicly
              addressed. If First Citizens Bank (the SVB acquirer) maintained the facility, debt service represents an
              ongoing fixed obligation that reduces free cash flow. The Series E1 at $3.7B is the most recent pricing
              anchor; any new round or secondary transaction below $3.7B would be a down-round. Secondary market pricing
              via PremierAlts and CompWorth confirms the $3.7B post-money as the current mark, with PitchBook and Tracxn
              data consistent. Entry discipline should include a requirement for audited trailing-12-month financials,
              SVB debt status disclosure, and Medically Home purchase price allocation before committing at the current
              valuation. The strategic-investor-customer alignment — Humana, Blue Shield of California, and Optum
              Ventures — creates governance tension that could complicate exit negotiations if any investor-payer
              exercises strategic blocking rights.
            claimRefs: []
          - type: table
            tableRef: TV005
            claimRefs:
              - CV006
