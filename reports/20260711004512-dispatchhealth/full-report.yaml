      - number: '2.4'
        title: Growth drivers, adoption constraints, and timing
        blocks:
          - type: paragraph
            body: >-
              The hospital-at-home market has three primary growth drivers and three material adoption constraints.


              The most significant driver is regulatory certainty. The five-year extension of the CMS AHCAH waiver
              through September 2030, legislated in the Consolidated Appropriations Act of 2026, removes the existential
              policy risk that shadowed the sector since the waiver's temporary expiration in late 2025. Chilmark
              Research estimated that H@H programs could double by 2026 given the waiver extension. The AHA reported
              that more than 320 hospitals in 133 health systems across 37 states had joined the AHCAH waiver program by
              April 2024; that number is expected to grow materially through 2030.


              A second driver is the chronic hospital capacity shortage. U.S. hospitals consistently operate at high
              occupancy rates, and aging demographics are increasing acute care demand. Hospital-at-home offers a
              capacity-relief valve without capital expenditure on new beds. The third driver is the shift to
              value-based care: as ACOs, Medicare Advantage plans, and risk-bearing providers take on financial
              responsibility for total cost of care, H@H's cost savings ($5,000 to $7,000 per admission versus
              inpatient) create strong economic alignment.


              The primary adoption constraint is technology and infrastructure: setting up a hospital-at-home program
              requires remote monitoring equipment, clinical command centers, last-mile logistics for mobile
              diagnostics, and 24-hour clinical coverage. This creates high startup cost and complexity for health
              systems that build internally. The second constraint is workforce: nursing shortages and the specialized
              training needed for acute home care nursing limit staffing capacity. The third constraint is patient and
              physician inertia: physicians and patients are unfamiliar with the H@H model, and liability concerns
              inhibit physician ordering.


              The brief lapse of the CMS waiver in October 2025 (before the Congressional extension passed) created
              disruption for active programs and demonstrated the sector's current regulatory dependency.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
