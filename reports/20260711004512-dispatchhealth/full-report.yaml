  - id: FV001
    title: Recommendation logic
    type: kpi
    layout: standard
    summary: >-
      Key factors underlying the DispatchHealth investment recommendation, displayed as a decision-support KPI panel
      covering market, clinical, regulatory, financial, and integration dimensions with a final recommendation output.
    data:
      items:
        - label: Market opportunity
          value: STRONG — $37B 2025 H@H market, 11.9% CAGR, McKinsey $265B TAM ceiling
        - label: Clinical differentiation
          value: STRONG — 8.5% readmission vs 15% national; 98% satisfaction; ACHC first accredited
        - label: Regulatory status
          value: MODERATE — AHCAH extended to 2030, not permanent; Oct 2025 lapse precedent
        - label: Financial transparency
          value: WEAK — No disclosed P&L; $75M SVB debt unaddressed; burn rate unknown
        - label: Integration risk
          value: HIGH — Medically Home merger under financial distress; two-platform integration
        - label: Strategic acquirer interest
          value: HIGH — Optum, Humana, CVS all have strategic rationale for acquisition
        - label: Overall recommendation
          value: CONDITIONAL WATCH — Buy on CMS permanence confirmation at or below $3.7B
    approximationNotes: >-
      KPI ratings are analyst-constructed from public data. No internal risk management or board-level decision
      documents are available.
    claimRefs:
      - CV010
      - CV012
      - CV023
      - CV035
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      DispatchHealth implied valuation at different revenue multiples, benchmarked against comparable exits, showing the
      premium embedded in the $3.7B current mark. Values in $M.
    data:
      items:
        - label: 1.5x revenue — LHC Group-style home health
          value: 420
        - label: 3x revenue — Oak Street Health exit multiple
          value: 840
        - label: 5x revenue — Landmark Health estimate
          value: 1400
        - label: 8x revenue — high-growth platform premium
          value: 2240
        - label: 13x revenue — current Series E1 mark
          value: 3700
        - label: 7x forward revenue — bull case exit at $800M rev
          value: 5600
    approximationNotes: >-
      Revenue is analyst-estimated at approximately $280M; not disclosed. Exit multiples from comparable transactions
      documented in TV004. Values in $ millions.
    claimRefs:
      - CV011
      - CV033
      - CV034
  - id: FV003
    title: Valuation return range
    type: bar
    layout: standard
    summary: >-
      Projected exit return ranges under bull, base, and bear scenarios for DispatchHealth, measured in implied exit
      value from the $3.7B Series E1 post-money. Values in $M.
    data:
      items:
        - label: Bear case exit — CMS waiver fails permanently
          value: 750
        - label: Current Series E1 post-money entry point
          value: 3700
        - label: Base case exit — waiver renewed, not permanent
          value: 5500
        - label: Bull case exit — CMS permanent payment achieved
          value: 10000
    approximationNotes: >-
      Exit values are scenario-planning estimates only; not financial projections. Bear case reflects urgent-care-only
      revenue scenario. Bull and base cases assume CMS regulatory outcomes documented in TV003.
    claimRefs:
      - CV020
      - CV021
      - CV022
