      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth's go-to-market motion is B2B2C: the primary buyers are health systems and payers (insurance
              companies), with patients as the end users. This dual-buyer structure creates distinct economic
              relationships and adoption pathways.


              Health systems adopt hospital-at-home for three primary reasons: capacity relief (freeing inpatient beds
              during high-census periods), revenue retention (keeping patients within the system rather than losing them
              to SNFs or other providers), and quality metrics improvement (H@H reduces complications, readmissions, and
              length of stay). The health system buyer is typically a Chief Medical Officer, VP of Population Health, or
              VP of Inpatient Operations. Budget authority sits with the CFO or system CEO for capital-intensive program
              builds, or with the CMO for technology-vendor contracts.


              Payers (Medicare Advantage plans, commercial insurers, self-insured employers) adopt H@H because it
              reduces total cost of care. The CMS AHCAH waiver creates a Medicare fee-for-service pathway that pays at
              inpatient DRG rates; Medicare Advantage plans negotiate separately. Humana and Blue Shield of California
              are both investors and payer customers of DispatchHealth, signaling that the model passes payer
              return-on-investment scrutiny.


              Accountable Care Organizations (ACOs) and risk-bearing entities represent a third buyer segment: these
              organizations bear financial responsibility for total cost of care, creating strong economic incentive to
              substitute costly inpatient admissions with H@H. The shift from volume-based to value-based care in
              Medicare is a structural tailwind.


              Patients (the end user) are largely passive adopters: they access H@H through their insurer's network or
              their health system's referral pathway. Patient education and willingness to accept home-based acute care
              is a real adoption constraint, particularly among elderly patients and those without stable home
              environments. DispatchHealth's 98 percent patient satisfaction figure—while company-claimed—suggests
              patient acceptance is high once care is accessed.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
