      care to home (McKinsey $265B) down to the currently reimbursed and operationally proven segment (U.S. acute H@H
      sub-market, ~$12B-$15B). DispatchHealth operates in the middle tier of the SAM.
    data:
      items:
        - label: McKinsey Maximum TAM
          value: $265B (US Medicare full shift potential)
          tone: neutral
        - label: Broad Home Health Market (2025)
          value: $120B-$222B (incl. non-acute and chronic)
          tone: neutral
        - label: Global Acute H@H Market (2025)
          value: $37B (MarketsandMarkets)
          tone: positive
        - label: US SAM — Acute H@H (clinical eligibility)
          value: $10B-$22B (annual admissions x episode revenue)
          tone: positive
        - label: DispatchHealth SOM (2026 est.)
          value: $257M-$312M (all service lines)
          tone: positive
