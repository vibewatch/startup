        - Send patient to imaging center or lab for follow-up; adds delay, inconvenience, and cost
        - CLIA mobile lab and portable imaging provide same-visit test results
        - Same-visit laboratory and imaging results enable immediate treatment decisions
        - No published comparison of DispatchHealth mobile lab accuracy versus hospital reference lab.
