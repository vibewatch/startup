  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials-revenue-burn-rate
      missingEvidence: >-
        DispatchHealth has not disclosed audited revenue, gross margin, operating expenses, EBITDA,
        or cash burn rate for any period. The $280M revenue estimate is analyst-derived and
        unconfirmed. Without disclosed financials, the 13x revenue multiple cannot be independently
        verified.
      whyItMatters: >-
        The investment recommendation and all bull/base/bear scenario modeling rest on unconfirmed
        revenue assumptions. A disclosed revenue significantly below $280M would make the $3.7B
        valuation indefensible even in the bull case.
      diligencePath: >-
        Request trailing 12-month audited P&L; monthly revenue by service line; gross margin by
        service line; operating expense breakdown; and projected 12-month cash burn.
      relatedQuestionRefs:
        - QV023

    - type: private-evidence-only
      severity: blocking
      topic: svb-debt-facility-current-terms
      missingEvidence: >-
        The $75M Silicon Valley Bank debt facility has not been publicly addressed since SVB's
        March 2023 collapse. Whether the facility was assumed by First Citizens Bank, repaid,
        renegotiated, or otherwise resolved is unknown.
      whyItMatters: >-
        Undisclosed debt covenants could create a liquidity event or restrict future equity raises.
        Covenant breach risk is unquantifiable without documentation.
      diligencePath: >-
        Request current debt facility documentation: lender, principal balance, interest rate,
        maturity, and covenant compliance confirmation.
      relatedQuestionRefs:
        - QV025

    - type: private-evidence-only
      severity: blocking
      topic: medically-home-merger-financial-disclosure
      missingEvidence: >-
        Medically Home's pre-merger valuation collapse was not publicly quantified. The purchase
        price, structure, and liquidation preferences paid to Medically Home investors from the
        merger proceeds are unknown.
      whyItMatters: >-
        Undisclosed acquisition terms could reveal that DispatchHealth paid a premium for a
        distressed asset or that Medically Home investors received preferential liquidation,
        both affecting the Series E1 cap table and shareholder priority stack.
      diligencePath: >-
        Request purchase price allocation for the Medically Home transaction; confirm goodwill
        or intangible asset recognition; review post-close cap table for liquidation preference
        modifications.
      relatedQuestionRefs:
        - QV029
        - QV026

    - type: missing-source
      severity: material
      topic: Comparable valuation table completeness
      missingEvidence: >-
        The comparable valuation table (TV004) covers the five most cited H@H and home care
        platform transactions. Additional private comparables including international hospital-at-home
        programs and more recent transactions are not publicly valued.
      whyItMatters: >-
        A broader comparable set could either support or undermine the 13x revenue premium;
        without it, the multiple comparison relies on a small sample of publicly disclosed
        transactions.
      diligencePath: >-
        Commission a comparable transaction analysis from a healthcare investment bank with
        access to private transaction databases including CapIQ and PitchBook.
      relatedTableRefs:
        - TV004
      relatedQuestionRefs:
        - QV014

    - type: missing-source
      severity: material
