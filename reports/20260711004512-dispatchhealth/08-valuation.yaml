sections:
  - id: section-1
    title: Investment thesis and anti-thesis
    body: >-
      DispatchHealth occupies a structurally rare position in 2026: the only scaled, nationally
      deployed, multi-service hospital-at-home platform with clinical evidence, payer contracts,
      first-ever ACHC In-Home Hospital Care Accreditation, and a merged technology command center.
      The investment thesis rests on four pillars. First, the hospital-at-home market is large and
      growing — estimated at $37.17B in 2025 with a 11.9% CAGR through 2034, and McKinsey's
      estimate places up to $265B of annual Medicare care as theoretically shiftable to the home.
      Second, DispatchHealth's B2B2C revenue model de-risks patient acquisition through 50+ enterprise
      health system and payer partners rather than direct-to-consumer marketing. Third, clinical
      outcomes are demonstrably superior — 8.5% 30-day readmission rate versus the 15% national
      average, and 98% patient satisfaction. Fourth, the CMS AHCAH waiver extension through
      September 2030 provides a five-year operational runway to scale the hospital-at-home service
      line and pursue permanent payment codes. The anti-thesis is equally clear. CMS permanence
      is not guaranteed: the waiver lapsed briefly in October 2025 before re-authorization,
      demonstrating real binary risk. The Medically Home merger was executed under financial-distress
      conditions — confirmed by an Axios report citing a leaked 498-page document — with Medically
      Home requiring emergency capital from Mayo Clinic and Kaiser Foundation Hospitals before
      closing. DispatchHealth declined to comment on Medically Home's financial history. No
      revenue, gross margin, or cash burn data has been publicly disclosed, making independent
      valuation validation impossible. Headcount declined from more than 1,500 to approximately
      985-1,200 post-merger, suggesting integration-driven workforce reduction. The $75M
      Silicon Valley Bank debt facility has not been publicly addressed since SVB's March 2023
      collapse, representing an unquantified balance sheet risk.
    tableRefs:
      - TV002
    figureRefs:
      - FV001

  - id: section-2
    title: "Recommendation, confidence, and valuation stance"
    body: >-
      At a $3.7B post-money valuation and an estimated 12-14x revenue multiple, DispatchHealth is
      priced for execution of the bull case. The recommendation is a conditional-watch rating:
      strategically compelling and defensible if CMS converts AHCAH to permanent payment, but
      overvalued absent that conversion given the opacity of unit economics. The comparable set
      supports a base fair value of $2.5-4.5B under current information: Oak Street Health exited
      at approximately 3x revenue; Contessa Health at 2-3x revenue; the premium DispatchHealth
      commands reflects its technology-platform positioning and the optionality of a permanent
      payment code. At 13x estimated revenue, the market is already pricing in regulatory
      resolution that has not yet occurred. The high-execution-risk rating is warranted by
      an untested CEO in Jennifer Webster (in role since late 2023), the most complex operational
      integration in the hospital-at-home sector, an undisclosed SVB debt facility, and the
      Medically Home financial distress disclosed post-announcement. A $2B downside scenario
      is plausible if the CMS waiver is not renewed post-2030 or if clinical scaling creates
      material adverse events. Entry discipline should require audited financials demonstrating
      at least three quarters of revenue trajectory, confirmation of SVB debt status, and
      evidence of Medically Home integration on-track before committing at the $3.7B valuation.
    tableRefs:
      - TV001
    figureRefs:
      - FV004

  - id: section-3
    title: "Financing context, entry discipline, and dilution"
    body: >-
      The Series E1 round ($160M, March 2025) was led by existing investors with Humana and Blue
      Shield of California continuing participation alongside Optum Ventures (UnitedHealth Group
      affiliate). Total disclosed capital raised stands at $906.8M, implying a capital efficiency
      ratio of 4.04x (post-money valuation / total capital). At the $3.7B post-money, estimated
      investor ownership across all rounds is in the 25-35% range, leaving significant equity
      for management, early employees, and founders. The $75M debt facility originally provided
      by Silicon Valley Bank (collapsed March 2023) has not been publicly addressed. If First
      Citizens Bank (the SVB acquirer) maintained the facility, debt service represents an
      ongoing fixed obligation that reduces free cash flow. The Series E1 at $3.7B is the most
      recent pricing anchor; any new round or secondary transaction below $3.7B would be a
      down-round. Secondary market pricing via PremierAlts and CompWorth confirms the $3.7B
      post-money as the current mark, with PitchBook and Tracxn data consistent. Entry discipline
      should include a requirement for audited trailing-12-month financials, SVB debt status
      disclosure, and Medically Home purchase price allocation before committing at the current
      valuation. The strategic-investor-customer alignment — Humana, Blue Shield of California,
      and Optum Ventures — creates governance tension that could complicate exit negotiations
      if any investor-payer exercises strategic blocking rights.
    tableRefs:
      - TV005
    figureRefs:
      - FV002

  - id: section-4
    title: "Bull / base / bear scenario analysis"
    body: >-
      The three scenarios turn on a single regulatory hinge: whether CMS converts the AHCAH
      waiver to a permanent prospective payment rate before or after September 2030. In the
      bull case, CMS announces permanent hospital-at-home payment codes in 2027-2028,
      validating the full McKinsey-estimated $265B TAM; DispatchHealth captures 10-15% of the
      addressable market by 2030, reaching $800M-$1B revenue, and exits via strategic acquisition
      at 7-8x forward revenue — implying an $8-12B valuation. In the base case, the waiver is
      renewed again in 2030 but not made permanent, maintaining growth but capping valuation
      at 4-5x forward revenue given persistent uncertainty — implying a $4-7B exit value in
      2028-2030. In the bear case, the CMS waiver renewal fails permanently, eliminating HAC
      revenue which represents an estimated 60-70% of episode economics. DispatchHealth's
      urgent-care-only revenue would support a sub-$1B valuation. The October 2025 lapse event —
      even brief — demonstrated the real binary nature of this risk. Bull upside is asymmetric
      relative to entry at $3.7B; bear downside is catastrophic.
    tableRefs:
      - TV003
    figureRefs:
      - FV003

  - id: section-5
    title: Comparable valuation set
    body: >-
      The most directly comparable exit is Oak Street Health, acquired by CVS Health for $10.6B
      in February 2023 at approximately 3x revenue — a primary-care-at-home platform with Medicare
      Advantage focus demonstrating that major integrated payers will pay premium multiples for
      proven home-care platforms. Contessa Health was acquired by Amedisys for $250M in 2021 at
      an estimated 2-3x revenue multiple, setting a floor for H@H enablement platforms. Landmark
      Health (OptumHealth) was acquired for an estimated $3B+ demonstrating strategic appetite for
      home-based care at scale. Bright Health Group filed for bankruptcy in 2024 after payer-side
      losses — a cautionary comparable illustrating the downside of payer-dependent models.
      LHC Group was acquired by Optum in 2022 for approximately $6B at roughly 1.5x revenue.
      DispatchHealth's 12-14x estimated revenue multiple is a 4-5x premium over the Oak Street
      Health benchmark, reflecting the technology-platform and permanent-payment-code optionality
      premium. This premium requires CMS permanence to be sustained by comparable precedent.
    tableRefs:
      - TV004
    figureRefs: []

  - id: section-6
    title: Exit readiness and diligence asks
    body: >-
      DispatchHealth has three realistic exit pathways: strategic acquisition by a major integrated
      payer-provider, a traditional IPO when profitability is demonstrated, or continued private
      growth with a mezzanine or Series F round. Strategic acquirers are most likely: Optum already
      owns Landmark Health for longitudinal home care and could acquire DispatchHealth for
      urgent/episodic care; Humana is both investor and payer with 12M+ Medicare Advantage
      members; CVS Health's Oak Street acquisition demonstrates willingness to pay premium multiples.
      An IPO would require at minimum two to three years of disclosed financials and a clear
      path to operating profitability. Given the Medically Home integration complexity and
      undisclosed financials, IPO in 2026 or 2027 is unlikely. A structured diligence process
      should prioritize: (1) audited financials and unit economics per service line; (2) SVB/First
      Citizens debt facility terms; (3) Medically Home purchase price allocation and goodwill;
      (4) board composition and governance; (5) CMS permanent payment code legislative strategy;
      (6) enterprise customer contract duration distribution. The ACHC accreditation and
      1.2M+ patient history are genuine exit-readiness positives, but financial opacity remains
      the primary friction for institutional capital commitment at the $3.7B valuation.
    tableRefs:
      - TV006
    figureRefs: []

