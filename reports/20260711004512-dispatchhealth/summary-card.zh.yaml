  topStrengths:
    - 与 Medically Home 合并后，DispatchHealth 拥有美国最大的独立全国居家医院网络，覆盖 50 个主要都会区和 20+ 个州；这样的地理密度几乎无法从零复制。
    - >-
      CMS Acute Hospital Care at Home waiver 延长五年至 2030 年 9 月（Consolidated Appropriations Act 2026），把此前压在
      行业上的近期报销断崖风险移除了。
    - Humana、Blue Shield of California 和 Optum Ventures 同时是付款方和投资人，给公司带来结构性转诊渠道，也让入网合同经济性更友好。
    - 2024 年 11 月拿下首个 ACHC In-Home Hospital Care 认证，建立了监管质量护城河；竞争对手需要单独跨过这道门槛。
    - 临床结果已验证：58% ER 避免率、30 天再入院率 8.5%（全国平均约 15%）、患者满意度 98%，这些指标支撑企业合同续约。
  topRisks:
    - 依赖 CMS waiver：类医院报销并非永久；若 2030 年前 waiver 未能转为永久付费代码，HAC 业务线会面临生死级报销风险。
    - Medically Home 整合风险：收购标的在合并前有内部文件泄露，披露估值大幅缩水且急需资本，进而引出承担负债和运营连续性的疑问。
    - 收入集中：Humana、Blue Shield 和 Optum 既是投资人也是主要付款方；任一关系退出，收入和治理都会受挤压。
    - 财务不透明：审计收入、毛利率、EBITDA、烧钱速度和准确员工数均未披露；估计 12-14x 收入倍数要站得住，必须依赖 CMS 永久化的乐观假设。
    - 临床劳动力稀缺：在 50 个都会区大规模招聘并留住急救医护、护士和 PAs，运营强度高，也受医疗劳动力短缺约束。
  unresolvedGaps:
    - 2024 和 2025 财年审计财务数据（收入、毛利率、EBITDA、现金跑道）仍未披露。
    - Medically Home 收购完整财务条款尚未公开，包括承接负债和实际收购价格。
    - $75M 债务融资状态和条款仍不明（原 SVB 贷款方 2023 年倒闭；当前服务机构和契约未知）。
    - CMS 尚未发布把 AHCAH waiver 转为永久前瞻性付费代码的正式时间表或标准。
    - 合并后领导层整合、治理结构和员工数尚未公开确认。
    - 按单一付款方 / 医疗系统客户划分的收入集中度未披露；前十大客户集中风险无法量化。
