  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: svb-debt-facility-current-status
      missingEvidence: >-
        DispatchHealth has not disclosed the current status of its $75M Silicon Valley Bank debt
        facility following SVB's March 2023 collapse. Balance, lender (First Citizens Bank), terms,
        interest rate, maturity, and covenant compliance are unknown.
      whyItMatters: >-
        Undisclosed debt covenants from First Citizens Bank could create a liquidity event risk
        that the $160M Series E1 may not fully cover. The debt facility status is a critical
        financial risk input that investors cannot assess from public data.
      diligencePath: >-
        Request current debt facility documentation; confirm lender, balance, rate, maturity,
        and covenant compliance; verify whether SVB-era terms were changed post-acquisition.
      relatedQuestionRefs:
        - QR026

    - type: private-evidence-only
      severity: blocking
      topic: operating-cash-burn-profitability
      missingEvidence: >-
        DispatchHealth has not disclosed revenue, operating expenses, EBITDA, or cash burn rate.
        The $160M Series E1 provides a rough runway estimate but without burn rate data,
        months-to-profitability cannot be calculated.
      whyItMatters: >-
        Cash burn and profitability timeline are fundamental valuation inputs. If burn exceeds
        $50M per quarter, the Series E1 provides only 12 months before requiring another raise.
      diligencePath: >-
        Request trailing 12-month P&L; monthly cash burn; projected breakeven; capital allocation
        by service line; revenue per episode trend.
      relatedQuestionRefs:
        - QR027

    - type: private-evidence-only
      severity: material
      topic: board-risk-oversight-governance
      missingEvidence: >-
        No public board composition, risk committee structure, or enterprise risk management
        framework has been disclosed. As a late-stage private company with investor-customers
        on the board, governance risks including related-party conflicts are not independently
        assessable.
      whyItMatters: >-
        Board risk oversight quality affects how quickly emerging risks (integration failures,
        clinical incidents, regulatory changes) are escalated. Investor-customer board members
        may have conflicting interests in governance decisions about payer contracts.
      diligencePath: >-
        Request board composition; confirm independence of audit and risk committees;
        review any board-level risk register or enterprise risk management report.
      relatedQuestionRefs:
        - QR025

    - type: missing-source
      severity: material
      topic: medically-home-goodwill-balance-sheet
      missingEvidence: >-
        It is unknown whether Medically Home's valuation decline has been reflected in
        DispatchHealth's combined balance sheet as goodwill impairment or purchase price
        adjustment. A major negative valuation adjustment could materially affect net asset value.
      whyItMatters: >-
        If the merger was structured as an acquisition and Medically Home's fair value at close
