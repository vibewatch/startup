figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      DispatchHealth's risk landscape mapped on a likelihood-impact matrix. Regulatory waiver dependency,
      reimbursement rate risk, and staffing shortage are the highest-priority items. Clinical quality failure
      and payer-investor exit are low-probability but catastrophic in impact. Integration failure and SVB
      debt are medium-likelihood and major-impact.
    data:
      columns:
        - Moderate Impact
        - Major Impact
        - Catastrophic Impact
      rows:
        - label: High Likelihood
          values:
            - "Reimbursement rate cuts; state licensing delays; MA prior authorization friction"
            - "Clinical staffing shortage at scale"
            - "(none currently)"
        - label: Medium Likelihood
          values:
            - "CEO transition continuity; equipment supply chain; health equity compliance"
            - "Integration failure; SVB debt restructuring; headcount attrition"
            - "CMS waiver non-renewal (post-2030)"
        - label: Low Likelihood
          values:
            - "Telehealth rollback"
            - "HIPAA enforcement; health system in-house program displacement"
            - "Clinical quality failure at scale; payer-investor dual-role conflict"
    approximationNotes: >-
      Likelihood and impact ratings are analyst estimates. DispatchHealth has not disclosed a formal risk
      register or enterprise risk management report.
    claimRefs:
      - CR001
      - CR002
      - CR006
      - CR008
      - CR020

