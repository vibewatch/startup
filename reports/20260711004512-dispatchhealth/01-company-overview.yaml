- id: scale-and-outcomes
  title: "Scale metrics, clinical outcomes, and coverage gaps"
  body: >-
    DispatchHealth publicly claims more than 1.2 million patients treated since 2013, a 58 percent emergency room
    avoidance rate, a 8.5 percent 30-day hospital readmission rate (versus approximately 15 percent national
    average), and 98 percent patient satisfaction. The company estimates it has generated $1.5 billion in total
    medical cost savings. It operates in 50 major metropolitan areas across more than 20 states with more than
    50 enterprise customers (health systems and payers). These metrics are sourced from company press releases and
    are not independently verified through regulatory filings. They should be treated as company-claimed rather
    than audited.


    The post-merger entity adds Medically Home's track record of enabling 55,000-plus hospital-at-home patient
    admissions through partner health systems' programs, and Medically Home's clinical command center technology
    platform. Combining DispatchHealth's direct-care model with Medically Home's health-system enablement
    technology is intended to serve a wider range of acuity levels.


    Significant metric gaps exist. Revenue figures are not publicly disclosed by the company; third-party
    aggregators (Compworth, and others) provide estimates in the range of $257 million to $312 million for 2025–
    2026, but these are modeled estimates rather than verified financial data. Headcount declined from more than
    1,500 employees in 2024 to approximately 985–1,200 as of 2026, a reduction that may reflect operational
    efficiency improvements or deliberate cost-structure adjustments in advance of a capital event. The ACHC
    in-home hospital accreditation received in November 2024 is the first of its kind nationally and provides
    an external quality signal. CMS waiver participation—now extended five years to September 30, 2030 under the
    Consolidated Appropriations Act of 2026—provides the reimbursement framework for the hospital-at-home model.
