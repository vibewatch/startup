- id: FO002
  title: Company snapshot logic
  type: flow
  layout: standard
  summary: >-
    The DispatchHealth operating model connects clinical credibility (hospital-level care), a payer-aligned
    investor base, an enterprise B2B2C distribution system, and a technology platform into a mutually
    reinforcing loop that makes hospital-at-home cost-effective for payers and operationally scalable for
    health systems.
