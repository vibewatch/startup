company:
  name: DispatchHealth
chapter:
  number: 1
  title: Company Overview
  summary: >-
    DispatchHealth is a Denver-based late-stage hospital-at-home company founded in 2013 by ER physician Dr. Mark
    Prather and PA-C Kevin Riddleberger. It has treated more than 1.2 million patients across 20-plus U.S. states
    through three core service lines—ER-alternative care, hospital-alternative care (HAC), and transitional care—
    under a B2B2C model that contracts with health systems and payers. A $160 million Series E1 round in March 2025
    valued the company at $3.7 billion, and the simultaneous merger with Medically Home created the largest
    national hospital-at-home operator. Public evidence firmly anchors founding facts, clinical outcomes, the
    merger, and ACHC accreditation; private financials, exact headcount, and post-merger leadership integration
    remain diligence gaps.
sections:
- id: identity-and-scope
  title: "Identity, headquarters, founding, and business model"
  body: >-
    DispatchHealth is headquartered in Denver, Colorado, and describes itself as bringing the power of the hospital
    to the comfort of home. The company was founded in 2013 by Dr. Mark Prather, an emergency-room physician who
    serves as Executive Chair and co-founder, and Kevin Riddleberger, a physician assistant (PA-C, MBA) who serves
    as Chief Strategy Officer and co-founder. Jennifer Webster is the chief executive officer. The company occupies
    the hospital-at-home sector within the broader digital health and home healthcare industry, which sits at the
    intersection of emergency medicine, hospital-level acute care, and post-acute transitional support.


    DispatchHealth operates a B2B2C model. Enterprise contracts with health systems and payers allow those
    institutions to refer their patients; DispatchHealth's care teams then deliver medical services at the patient's
    home. In addition to enterprise contracts the company is in-network with most major insurers and accepts
    fee-for-service reimbursement. Three core service lines define the portfolio post-merger: ER-Alternative Care
    (emergency-level care at home to avoid ER visits), Hospital-Alternative Care (inpatient hospital-level care
    fully delivered at home), and Transitional Care (post-discharge support to prevent readmission). The company
    treats nearly all non-life-threatening serious conditions including congestive heart failure, COPD, pneumonia,
    skin infections, and conditions requiring moderately complex laboratory diagnostics. Its press room characterizes
    the model as handling 95 percent of the most common emergency-room diagnoses.


    As of July 2026 DispatchHealth operates in 50 major metropolitan areas across 20-plus states. The combined
    entity that emerged from the Medically Home merger holds the first ACHC In-Home Hospital Care Accreditation
    (awarded November 2024) and participates in the CMS Acute Hospital Care at Home (AHCAH) waiver program.
