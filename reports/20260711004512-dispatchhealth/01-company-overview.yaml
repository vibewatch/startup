callouts:
- calloutType: strength
  title: Hospital-at-home is now a validated, reimbursed care model with a five-year policy runway
  body: >-
    The Consolidated Appropriations Act of 2026 extended the CMS Acute Hospital Care at Home waiver through
    September 2030. Combined with ACHC accreditation and in-network payer status, DispatchHealth has
    operational clarity on the reimbursement and quality infrastructure that sustains the model for at
    least four more years. This regulatory certainty is a material competitive moat against new entrants.
  claimRefs:
  - CO035
  - CO036
  - CO037

- calloutType: strength
  title: The payer-investor base creates a structural customer acquisition advantage
  body: >-
    Humana, Blue Shield of California, and Optum Ventures are simultaneously investors and payer customers.
    This alignment means major insurance books of business refer patients to DispatchHealth as a
    preferred provider, materially reducing the cost of customer acquisition at the enterprise level
    and creating a defensible revenue channel that purely independent competitors cannot replicate easily.
  claimRefs:
  - CO016
  - CO019
  - CO020
  - CO021

- calloutType: risk
  title: The Medically Home merger introduced unknown integration liabilities and distress signals
  body: >-
    Home Health Care News reported that a leaked document showed Medically Home experienced a dramatic
    valuation decline and relied on cash infusions from Mayo Clinic and Kaiser to continue operating
    pre-merger. Executives and investors reportedly received partial liquidation through the deal.
    DispatchHealth declined to comment. Without management-confirmed financials, integration costs,
    and Medically Home's pre-merger liability schedule, diligence cannot fully underwrite the true
    combined balance sheet.
  claimRefs:
  - CO033
  - CO034

- calloutType: risk
  title: Private company opacity leaves revenue, margin, and unit economics unverifiable
  body: >-
    DispatchHealth has not publicly disclosed revenue, gross margin, EBITDA, or per-patient economics.
    Third-party aggregators provide revenue estimates in the $257M–$312M range, but these are modeled
    from headcount and industry benchmarks, not verified financial data. Any valuation analysis at
    $3.7 billion implies very high revenue multiples on these estimates, leaving fundamental financial
    diligence entirely dependent on management providing audited financials in a private dataroom.
  claimRefs:
  - CO026
  - CO027
  - CO029

