- id: funding-and-valuation
  title: "Funding history, valuation signals, and investor base"
  body: >-
    DispatchHealth has raised approximately $906.8 million across multiple rounds since its 2015 seed round.
    The funding trajectory shows acceleration commensurate with the hospital-at-home market's policy tailwind:
    a $3.6 million seed in August 2015, a $3.76 million Series A in early 2017, a $32 million Series A
    extension in September 2017 (with Alta Partners, Questa Capital, and US Acute Care Solutions), a $33 million
    Series B in May 2019 (Echo Health Ventures), and a $136 million Series C in June 2020 (Optum Ventures leading,
    Humana, Oak HC/FT, Echo Health Ventures, and others participating).


    The Series D rounds established DispatchHealth as a healthcare unicorn. Tiger Global Management led a
    $200 million tranche in March 2021 at approximately $1.7 billion post-money valuation; Optum Ventures led a
    $259 million second tranche in October 2022, joined by Humana, Blue Shield of California, Adams Street
    Partners, Olayan Group, SVB, and others. A $75 million conventional debt facility from SVB and K2
    HealthVentures closed simultaneously with the October 2022 round.


    In March 2025 DispatchHealth announced a $160 million Series E1 round at a post-money valuation of $3.7
    billion—more than doubling the reported 2021 post-money valuation and achieving a capital-efficiency ratio
    of approximately 4x (valuation vs. total funding). Premier Alts listed the $3.7 billion post-money valuation
    consistent with this announcement. The Series E1 was announced in conjunction with the Medically Home merger
    announcement and is expected to fund the combined company's national expansion.


    The investor roster is strategically coherent: Humana and Blue Shield of California are both investors and
    payers who refer patients to DispatchHealth, Optum Ventures is the investment arm of UnitedHealth Group
    (itself a major payer), and Alta Partners and Echo Health Ventures are healthcare-focused specialist funds.
    This payer-investor alignment reduces customer acquisition friction but creates potential governance conflicts
    of interest that merit diligence.
