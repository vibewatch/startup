- id: leadership-governance-and-board
  title: "Founders, leadership team, board, and governance"
  body: >-
    The founding duo remains central to governance. Dr. Mark Prather (Executive Chair) and Kevin Riddleberger
    (Chief Strategy Officer) built the company from a single Denver market. Jennifer Webster joined as CEO to lead
    the company through its growth phase. The broader C-suite includes Chief Medical Officer Dr. Pippa (Eliza)
    Shulman (D.O., M.P.H.), Chief Financial Officer David Wilkinson, Chief Legal Officer Bill Kramer, Chief Growth
    Officer Diana Verrilli, Chief Technology Officer Erin Bartley, Chief Operating Officer Jessica Landin, and
    Chief Product Officer J.T. Hedges. This team covers the functional domains of clinical care, finance, legal,
    growth, technology, operations, and product—the profile of a late-stage company preparing for potential capital
    events.


    The board reflects the investor composition assembled during the major funding rounds. Mark Prather serves as
    Executive Chair, representing the founding interest. Andrew Adams (Oak Investment Partners) and Peter Hudson
    (Alta Partners) represent two of the earliest institutional investors. Dominic Bagnoli represents US Acute Care
    Solutions (USACS), a strategic investor and clinical partner that helped seed the company. The investor-heavy
    board structure is typical for a late-stage, heavily-backed private company. Key-person risk centers on
    Dr. Prather as the clinical founder and public face of the hospital-at-home mission, and on Jennifer Webster
    as the operating CEO. No publicly documented governance incidents or formal leadership disputes were found in
    the research period.
