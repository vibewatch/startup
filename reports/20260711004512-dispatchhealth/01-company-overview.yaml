  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-statements
    missingEvidence: Audited revenue, gross margin, EBITDA, and cash-on-hand for fiscal years 2024 and 2025.
    whyItMatters: >-
      Without verified financials, the $3.7B valuation implies 10–14x revenue multiples on third-party
      estimates that may themselves be unreliable. Any capital adequacy or burn-rate assessment is
      entirely speculative without a private data room.
    diligencePath: Request FY2024 and FY2025 audited financials plus a board-approved budget for 2026 from management.
    relatedQuestionRefs:
    - QO021
    - QO027
  - type: private-evidence-only
    severity: material
    topic: merger-terms
    missingEvidence: Financial terms of the Medically Home acquisition including price, consideration structure, assumed liabilities, and earnout provisions.
    whyItMatters: >-
      The combination of Medically Home's reported financial distress and the fact that partial
      liquidation was provided to insiders means the true cost of the acquisition and any inherited
      liabilities are unknown from public sources.
    diligencePath: >-
      Request the definitive merger agreement, Medically Home's last 12-month financials, liability
      schedule, and a post-merger integration update from management.
    relatedQuestionRefs:
    - QO024
  - type: conflicting-data
    severity: material
    topic: clinical-outcomes-verification
    missingEvidence: Independent verification of DispatchHealth's claimed 58% ER avoidance rate, 8.5% readmission rate, and 98% satisfaction score.
    whyItMatters: >-
      All clinical outcome metrics are company-self-reported and the methodology, patient cohort
      definitions, and denominators are not disclosed. Without independent verification these metrics
      cannot be used to underwrite quality-of-care or competitive differentiation claims.
    diligencePath: >-
      Request methodology documentation, cohort definitions, and ask whether any metrics have been
      independently validated by a health system partner or published in a peer-reviewed journal.
    relatedQuestionRefs:
    - QO030
  - type: stale
    severity: moderate
    topic: headcount-trajectory
    missingEvidence: Verified current headcount and the reason for the reported decline from 1,500+ to ~985–1,200 employees.
    whyItMatters: >-
      Headcount reduction of 15–35% could indicate deliberate cost-structure improvement ahead of
      a capital event, or it could reflect operational difficulties, market contraction, or
      integration-related workforce reduction. Without management explanation, the signal is ambiguous.
    diligencePath: >-
      Request a current org chart, monthly headcount bridge for 2024–2026, and management's explanation
      of workforce changes including any reductions-in-force.
    relatedQuestionRefs:
    - QO020
acknowledgedWarnings:
- dimension: unverifiedSource
  reason: >-
    Sources SO020 (Healthcare Dive), SO021 (CB Insights), SO022 (Becker's Hospital Review),
    SO023 (LinkedIn), SO024 (Glassdoor), and SO025 (ZoomInfo) are from established industry
    and data-aggregation platforms that publish DispatchHealth coverage. These URLs were not
