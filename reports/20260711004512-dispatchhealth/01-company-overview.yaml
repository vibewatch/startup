      description: "Dr. Prather (ER physician) and Riddleberger (PA-C) design hospital-at-home as a clinical first imperative, not a technology startup."
    - id: n2
      label: B2B2C enterprise model
      description: Health systems and payers refer patients; DispatchHealth delivers care at home and bills insurance.
    - id: n3
      label: Payer-investor alignment
      description: "Humana, Blue Shield CA, Optum are both investors and customers, reducing CAC and aligning incentives for payer referrals."
    - id: n4
      label: Three service lines
      description: "ER-Alternative Care, Hospital-Alternative Care (HAC), and Transitional Care cover the full acute-and-post-acute spectrum."
    - id: n5
      label: Medically Home technology
      description: Clinical command center and telehealth platform acquired in 2025 merger; enables virtual acute oversight.
    - id: n6
      label: Regulatory infrastructure
      description: "ACHC accreditation, CMS AHCAH waiver participation, CLIA-certified mobile lab, and state licensure create barriers to entry."
