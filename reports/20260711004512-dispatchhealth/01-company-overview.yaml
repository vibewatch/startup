- id: milestones-and-adverse
  title: "Key milestones, Medically Home merger, and adverse items"
  body: >-
    DispatchHealth's history divides into four phases: stealth founding and early Denver operations (2013–2017),
    accelerated expansion funded by venture capital (2017–2021), hospital-at-home market build-out and regulatory
    tailwind (2021–2024), and the merger-and-accreditation transformation phase (2024–2026).


    The Medically Home merger is the most consequential recent event. In March 2025 DispatchHealth announced its
    intent to merge with Medically Home (Boston-based, founded 2016, $287 million raised including $110 million
    in 2022), which operated a technology-enabled clinical command center model serving hospital system partners
    including Mayo Clinic and Kaiser. The deal closed in late May 2025. Terms were not disclosed. The combined
    entity operates under the DispatchHealth brand while the Medically Home brand is being phased out.


    An adverse item emerged from the merger process. Home Health Care News reported in June 2025 on a leaked
    internal document reportedly describing a "dramatic" valuation drop at Medically Home prior to the merger,
    with the company relying on cash infusions from Mayo Clinic and Kaiser to remain solvent. The document also
    reportedly indicated that executives and investors received partial liquidation through the deal, suggesting
    the Medically Home side was a distressed seller rather than an equal merger of strength. DispatchHealth
    declined to comment on the financial details. This adversarial context creates diligence questions about the
    integration costs, the true combined balance sheet, and whether Medically Home's liabilities were fully
    disclosed in the transaction.


    ACHC awarded DispatchHealth the first-ever In-Home Hospital Care Accreditation in November 2024, ahead of
    the merger close. The AMA confirmed that Congress extended the CMS Acute Hospital Care at Home waiver by
    five years through September 2030, removing a major reimbursement uncertainty that had briefly disrupted
    programs when the waiver temporarily lapsed in October 2025 before the extension was passed. These
    regulatory confirmations materially de-risk the company's medium-term revenue model.
