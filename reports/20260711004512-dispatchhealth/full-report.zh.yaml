      - number: '5.4'
        title: 差异化、IP、数据与信任控制
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 的差异化由临床可信度、监管资质、运营规模和专有方案叠加而成，竞争对手必须从零复制。ACHC 认证、CLIA 认证移动实验室、60+ 个专有临床方案和 AHCAH
              豁免参与资格，单独看都是有意义的壁垒；合在一起，则构成监管与临床运营护城河，目前没有竞争对手达到同样广度。

              Medically Home 指挥中心技术带来第二个差异点：远程规模化管理住院级病情患者的临床基础设施。合并前，只有 Mayo Clinic 和 Kaiser Foundation Hospitals 在
              Medically Home 平台上形成运营规模。合并后，DispatchHealth 既有指挥中心能力，也有现场派诊基础设施，而 Medically Home
              独立运营时缺少后者。两者组合成一体化居家医院，短期内任何一家公司单独都无法建成。

              EHR 集成是一种粘性机制。医疗系统一旦把 DispatchHealth 的双向 EHR 工作流嵌入转诊流程，切换成本就是重新实施一整套 EHR 集成——这足以显著抑制医疗系统客户流失。

              信任与隐私方面，DispatchHealth 发布了服务条款和符合 HIPAA
              的数据处理框架。公司在所有患者接诊过程中处理受保护健康信息（PHI）。分布式护理交付——在患者家中而非受控设施内提供护理——比传统医院为 HIPAA
              合规带来更宽的攻击面。公开可访问来源中没有公开安全态势页面、BAA 模板或第三方安全认证（SOC 2、HITRUST），这是企业医疗系统采购团队会提出的尽调缺口。

              开发者界面有意保持最小化：DispatchHealth 是一家通过直接医疗系统和付款方合同运营的企业临床服务公司，不是向第三方开发者销售 API 的平台。LinkedIn 工程岗位确认公司有软件工程团队（EHR
              集成、远程医疗基础设施、数据平台），但公开记录中没有开发者门户、API 文档或开源贡献。
