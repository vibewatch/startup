      - number: '7.3'
        title: 运营与临床执行风险
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 的分布式临床模型依赖进入患者家中的急救医护人员、护士和医生——这些劳动力类别正经历 American Nurses Association 记录的持续全国性短缺。AHRQ
              Healthcare Cost and Utilization Project 将全国 30 天再入院率基准设为约 15%，DispatchHealth 声称的 8.5% 率以此为参照获得验证；但患者转院率（当前
              7.2%）一旦上升，就会显示患者筛选质量下降、临床风险增加。Medically Home
              合并给临床模型增加了指挥中心运营和虚拟医生监督，要求整合两套技术平台、两套临床方案和两种组织文化。DispatchHealth 合并后员工数从 1,500 多人降至约
              985-1,200，说明合并后人员优化可能已经制造机构知识缺口。50+ 个市场的移动诊断设备（便携式 X 光、POCUS、移动实验室）供应链，给实体物流增加一层风险；传统按服务收费医疗交付中没有这种先例。
            claimRefs: []
