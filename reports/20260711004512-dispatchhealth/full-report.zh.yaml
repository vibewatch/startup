  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              2026 年，DispatchHealth 处在一个结构性稀缺位置：它是唯一已规模化、全国部署、覆盖多服务线的居家医院平台，同时拥有临床证据、付款方合同、首个 ACHC In-Home Hospital Care
              Accreditation，以及合并后的技术指挥中心。投资论点建立在四根支柱上。第一，居家医院市场大且在增长——2025 年估计为 $37.17B，至 2034 年 CAGR 为 11.9%；McKinsey
              估计每年最多 $265B 的 Medicare 护理理论上可迁移到家中。第二，DispatchHealth 的 B2B2C 收入模型通过 50+
              家企业医疗系统和付款方合作伙伴降低患者获取风险，而不是依赖直接面向消费者营销。第三，临床结果明显更优——30 天再入院率 8.5%，对比全国平均 15%，患者满意度 98%。第四，CMS AHCAH 豁免延长至
              2030 年 9 月，为居家医院服务线规模化和争取永久支付代码提供五年运营跑道。反论点同样清楚。CMS 永久化没有保证：豁免在 2025 年 10
              月曾短暂停摆，之后才重新授权，暴露出真实的二元风险。Medically Home 合并是在财务困境条件下完成的——Axios 报道引用泄露的 498 页文件确认——Medically Home 在交割前需要
              Mayo Clinic 和 Kaiser Foundation Hospitals 提供紧急资本。DispatchHealth 拒绝评论 Medically Home
              的财务历史。公司没有公开披露收入、毛利率或现金消耗数据，导致独立估值验证不可能。合并后员工数从 1,500 多人降至约 985-1,200，说明整合驱动了人员缩减。$75M Silicon Valley Bank
              债务融资自 SVB 2023 年 3 月倒闭后未被公开说明，构成无法量化的资产负债表风险。
