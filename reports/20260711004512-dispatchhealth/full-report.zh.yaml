      - number: '2.4'
        title: 增长驱动、采用约束与时点
        blocks:
          - type: paragraph
            body: >-
              居家医院市场有三大增长驱动，也有三项重要采用约束。


              最关键驱动是监管确定性。Consolidated Appropriations Act of 2026 将 CMS AHCAH 豁免延长五年至 2030 年 9 月，移除了自 2025
              年底豁免短暂到期以来笼罩行业的生存级政策风险。Chilmark Research 估计，考虑到豁免延期，H@H 项目到 2026 年可能翻倍。AHA 报告称，到 2024 年 4 月，37 个州、133
              个医疗系统中的 320 多家医院已加入 AHCAH 豁免项目；到 2030 年，这一数字预计会显著增长。


              第二个驱动是长期医院容量短缺。美国医院长期维持高入住率，人口老龄化正在推高急性期护理需求。居家医院无需投资新增床位，就能提供一个容量释放阀。第三个驱动是向价值型医疗迁移：随着 ACOs、Medicare
              Advantage 计划和承担风险的提供方为总护理成本负责，H@H 相对住院每次可节省 $5,000 至 $7,000，经济激励高度一致。


              主要采用约束是技术和基础设施：搭建居家医院项目需要远程监测设备、临床指挥中心、移动诊断的最后一公里物流，以及 24
              小时临床覆盖。这让医疗系统自建项目的启动成本和复杂度都很高。第二个约束是劳动力：护士短缺，以及急性居家护理护士所需的专门培训，限制了人员供给。第三个约束是患者和医生惯性：医生和患者不熟悉 H@H
              模式，责任顾虑也抑制医生下单。


              CMS 豁免在 2025 年 10 月短暂失效（国会延期通过前），扰动了活跃项目，也证明该行业目前仍依赖监管。
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
