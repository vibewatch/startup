      - number: '3.2'
        title: 竞争对手画像与战略定位
        blocks:
          - type: paragraph
            body: >-
              Contessa Health 于 2021 年以 $250 million 被 Amedisys 收购，采用与医院合作方成立合资公司的模式提供居家医院服务。收购前，Contessa 已建立 10 多个医疗系统
              JV 关系。在 Amedisys 旗下（Amedisys 本身正被 UnitedHealth Group 收购，该交易面临监管审查），Contessa 模式正在并入 Amedisys
              更广泛的居家健康服务组合。Contessa 是最直接可比的 JV 赋能竞争对手；被 Amedisys 收购给了它运营规模，但在 Amedisys / UHG 合并整合期间也带来战略不确定性。


              Landmark Health 于 2021 年被 OptumHealth（UHG 子公司）收购，金额未披露。Landmark 模式聚焦复杂慢病患者的纵向居家初级护理，而非单次事件型 急性期护理替代。并入
              Optum 后，它获得了巨大的分发触达，但也从急性 H@H 转向慢病管理。Optum（通过 Landmark 和 Optum Ventures）是 DispatchHealth
              的投资方，形成了值得标注的投资方兼竞争者关系。


              Biofourmis 是一个 AI 驱动的远程患者监测和护理管理平台，与 DispatchHealth 临床指挥中心的技术层竞争。Biofourmis 已获得超过 $300 million 风险融资，并用 RPM
              和预测分析工具服务医疗系统。它的模式以软件为中心，而非直接护理，因此对部分医疗系统是互补合作方，对另一些则是部分替代项。


              Inbound Health 位于 Minneapolis，是一家较小的 H@H 赋能公司，主要与区域医疗系统合作运营。它的规模小于 DispatchHealth，但同样以医疗系统 JV
              模式瞄准类似市场。Inbound Health 公开财务披露有限，规模也未获独立验证。


              Current Health 于 2021 年被 Best Buy 收购，成为这家零售商健康战略的一部分；它以 Best Buy Health 的远程患者监测平台运营。其模式以 RPM
              为中心，覆盖的临床病情严重度较低，因此只是 DispatchHealth 过渡护理和门诊监测工作流的部分替代项。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: 功能、能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 是该领域唯一公开声称同时具备三条核心服务线的运营商：急诊替代护理、住院替代护理（HAC）和过渡护理。ACHC 居家医院护理认证（首个，2024 年 11
              月）提供了外部质量信号，目前没有竞争对手持有。


              Contessa 的 JV 模式聚焦 HAC 和部分过渡护理，但没有规模化提供急诊替代分诊。Landmark 模式覆盖纵向慢病护理，而非单次事件型 急性护理。Biofourmis
              是软件平台，缺少直接护理交付。Inbound Health 通过医疗系统合作方覆盖 HAC。Current Health 仅做 RPM。


              定价方面，所有竞争对手都通过支付方按服务收费报销，或通过 CMS AHCAH 豁免获得 DRG 等价报销。所有玩家的确切合同价格都是专有信息。基于分析师估算和公开成本节省数据，DispatchHealth
              每个单次服务收入估计在 $1,500 至 $5,000 区间，取决于服务线和支付方。该领域不存在独立定价数据库。


              分发是关键差异点。DispatchHealth 拥有 40 个医疗系统企业合同、50 个都市区覆盖，以及 Humana、Blue Shield of California、Optum
              等支付方投资者合作关系，形成了竞争对手难以轻易复制的转介管道。这种投资方与支付方一致性，构成 DispatchHealth 最持久的竞争优势之一。
