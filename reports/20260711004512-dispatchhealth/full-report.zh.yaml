          tone: positive
    approximationNotes: 全部数字都是估算且不确定性很高。McKinsey TAM 是上限情景；美国 SAM 是内部构建，基于 AHRQ 入院数据和平均单次服务收入估计。DispatchHealth SOM 来自第三方聚合平台，并非已核验的公司财务数据。
