companyProfile:
  summary: >-
    DispatchHealth 总部位于 Denver，是一家后期居家医院公司，2013 年由急诊医生 Dr. Mark Prather 和 PA-C Kevin Riddleberger
    创立。公司派出移动临床团队，把急诊级和等同住院的护理送到患者家中，三条服务线包括急诊替代护理、住院替代护理（HAC）和过渡护理。2025 年 3 月的 $160 million Series E1 轮把公司估值推至 $3.7
    billion；同期开启的 Medically Home 合并让 DispatchHealth 成为美国最大的独立全国性居家医院运营商。公司采用 B2B2C 模式，与 50+ 家医疗系统和支付方签约，覆盖 50
    个主要都市区。平台报销锚定 CMS AHCAH 豁免，该豁免已延长至 2030 年 9 月。
