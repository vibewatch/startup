      - number: '7.4'
        title: 合作伙伴、财务与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Humana、Blue Shield of California 和 Optum/UHG 三家投资人兼客户，合计可能贡献 DispatchHealth Medicare Advantage
              转诊量中不成比例的一部分。投资人兼客户双重角色意味着付款方关系任何恶化，都会同时影响转诊量、企业收入和投资人治理。Silicon Valley Bank 曾为 DispatchHealth 提供 $75M
              债务融资，该行于 2023 年 3 月倒闭并被 First Citizens Bank 收购；该融资当前条款、余额和契约状态没有公开披露。竞争上，Landmark Health（OptumHealth
              子公司）借助 UHG 分销优势，在 Medicare Advantage 居家护理中大规模运营；获 CMS 批准的医疗系统也可能绕过 DispatchHealth，直接运营 AHCAH 项目。Federal
              Register Medicare 支付规则直接影响 DispatchHealth 单次护理事件按服务收费报销，Medicare Advantage 预授权摩擦也可能推迟护理事件启动。KFF 数据显示，MA
              计划越来越多使用预授权作为居家健康和医院等效服务的成本控制机制。
