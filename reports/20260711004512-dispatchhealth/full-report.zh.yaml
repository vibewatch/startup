        - $75M 债务额度（2022 年 10 月；SVB/K2）；当前余额未知
        - 低（条款和当前余额未披露）
        - SVB 于 2023 年倒闭；债务条款和当前服务机构不明
      - - 下一次资本事件触发点
        - IPO、战略收购或 Series F（估计 2026-2028 年）
        - 低（推测）
        - 取决于烧钱率和增长轨迹；$3.7B 估值显示有 IPO 目标
      - - Series E1 资金计划用途
        - 合并整合、地理扩张、技术开发
        - 中（从合并公告推断）
        - 资金主要投向增长；并非主要用于过渡到盈利
    notes: 所有低置信度估计均为推导而非披露。鉴于 SVB 2023 年倒闭，2022 年的 SVB 债务额度当前状态未知；尽调需澄清服务机构和还款条款。月度烧钱率是评估资本充足性时最关键的未披露指标。
  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对分析的影响
      - 具体尽调路径
    rows:
      - - 年收入（精确）
        - 无法验证 10-14x 收入倍数；无法评估增长轨迹
        - 索取 FY2024 和 FY2025 经审计 P&L 报表
      - - 按服务线拆分毛利率
        - 无法评估利润率结构或盈利路径
        - 索取毛利拆分：ER 替代、HAC、过渡期护理、赋能
      - - EBITDA 或营业收入
        - 无法判断公司运营是否产生现金
        - 如适用，索取 EBITDA 桥表和管理层调整后 EBITDA
      - - 月度现金消耗和账上现金
        - 无法计算 $160M Series E1 能支撑的跑道
        - 索取过去 12 个月月度消耗报告和当前现金余额
      - - Medically Home FY2024 财务（合并前）
        - 无法评估整合成本或从困境卖方承接的任何负债
        - 索取合并交割文件中的 Medically Home FY2024 P&L 和资产负债表
      - - 按服务线拆分收入（ER 替代、HAC、过渡期护理、赋能）
        - 无法判断哪项业务贡献最多收入或毛利结构最好
        - 向数据室索取按服务线拆分的收入
      - - 支付方结构（Medicare FFS、MA、商业保险、Medicaid）
        - 无法评估报销费率敞口或 MA 特有定价风险
        - 索取按服务线和市场拆分的支付方结构
      - - HAC 入院量轨迹（2023-2026）
        - 无法评估 HAC 这条最高价值服务线的扩张速度
        - 索取 2022 年至 2026 年 Q1 的季度 HAC 入院量
    notes: 所有列出的指标都是医疗服务公司数据室的标准项目。缺少任何已验证财务披露，是后期私营公司的常见情况，本身不构成负面信号。不过，Medically Home 困境卖方背景让合并实体的财务透明度尤其重要。
  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 服务线
      - 主要用户
      - 状态 / 成熟度
      - 有证据支撑的能力
      - 差异化
      - 尽调缺口
    rows:
      - - ER 替代护理
        - 非危及生命急症患者；发起派单的医疗系统和支付方合作伙伴
        - GA；2013 年以来的最早服务线；量最大
        - 移动临床团队配备便携式 X 光、超声、POCUS、CLIA 移动实验室；记录的 ER 避免率为 58%；患者满意度 98%；覆盖 60+ 类病症
        - 规模和临床可信度需要临床运营体系支撑，纯技术新进入者很难复制
        - 公开来源未将 ER 替代护理的收入、量或利用率从其他服务线中单独拆出。
      - - 医院替代护理（HAC）
        - 符合住院条件的复杂 / 高病情复杂度患者；拥有 AHCAH 豁免的医疗系统
        - 合并后获得规模；2024 年 11 月取得 ACHC 认证（史上首个）；入院量里程碑 2,000+
        - IV 泵、监测设备、氧气、每日护士上门；Medically Home 指挥中心提供 24/7 虚拟医生监督；30 天再入院率 8.5%，全国平均约 15%；每个案节省 $5K-$7K
        - 首个 ACHC 居家医院护理认证获证者；来自 Medically Home 合并的指挥中心技术
        - Medically Home 平台尚未整合完成；技术和文化合并风险未解决。
      - - 过渡期护理
        - 从医院、ER 或 SNF 出院后的患者；承担风险的支付方或 ACO 合同主体
        - 已成熟；与企业合同打包，用于全个案管理
        - 在再入院高风险窗口提供出院后随访护理；组合层面 30 天再入院率 8.5%，作为项目有效性的标记
        - 补齐护理连续体，使医疗系统在居家急性到急性后护理上只需一个供应商
        - 过渡期护理没有单独结果数据；公开数据只给组合层面再入院率。
      - - 移动诊断影像
        - 一线临床人员；居家患者
        - 覆盖所有 50+ 都市市场；包含 CLIA 认证实验室组件
        - 便携式 X 光、超声、POCUS、血检、尿检、培养均可现场完成
        - CLIA 认证（中等复杂度）是竞争对手必须自行取得的监管资质
        - 具体设备供应商、维护合同、校准规程和故障率数据未公开。
      - - EHR 集成平台
        - 医疗系统 IT 和临床工作流团队；转诊临床人员
        - 已在 40+ 医疗系统合作伙伴中部署双向集成
        - 与合作伙伴 EHR 系统实时交换临床数据；就诊后病历记录回流合作伙伴记录
        - 切换成本嵌入医疗系统 EHR 工作流，形成留存护城河
        - 已认证的具体 EHR 供应商（Epic、Cerner 等）、集成深度和 API 文档未公开。
      - - Medically Home 指挥中心
        - HAC 患者；监督医生；远程护理监督团队
        - 合并后整合；此前已在 Mayo Clinic 和 Kaiser Foundation Hospitals 验证
        - 24/7 由医生主导的虚拟指挥中心；实时患者监测；临床决策支持；此前通过合作医疗系统服务 55,000+ 名患者
        - 在这一规模下，唯一把现场派单与医院级虚拟指挥中心结合的平台
        - 与 DispatchHealth 既有系统的技术集成尚未完成；双平台风险仍在。
    notes: 行级能力主张依赖公司新闻稿、ACHC 认证公告和 CMS 项目数据。按服务线拆分的收入分配、利用率和运营指标，要么是估计值，要么无法从公开来源获得。
