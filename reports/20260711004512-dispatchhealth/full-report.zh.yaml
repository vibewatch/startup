      - number: '1.2'
        title: 创始人、管理团队、董事会与治理
        blocks:
          - type: paragraph
            body: >-
              创始二人仍是治理核心。Dr. Mark Prather（执行董事长）和 Kevin Riddleberger（首席战略官）把公司从单一 Denver 市场做起。Jennifer Webster 加入后担任
              CEO，负责带领公司进入增长阶段。更广泛的管理层包括首席医疗官 Dr. Pippa (Eliza) Shulman（D.O.、M.P.H.）、首席财务官 David Wilkinson、首席法务官 Bill
              Kramer、首席增长官 Diana Verrilli、首席技术官 Erin Bartley、首席运营官 Jessica Landin，以及首席产品官 J.T.
              Hedges。这支团队覆盖临床护理、财务、法务、增长、技术、运营和产品，符合一家后期公司为潜在资本事件做准备的画像。


              董事会反映了几轮主要融资中形成的投资者构成。Mark Prather 以执行董事长身份代表创始人利益。Andrew Adams（Oak Investment Partners）和 Peter
              Hudson（Alta Partners）代表最早的两家机构投资方。Dominic Bagnoli 代表 US Acute Care Solutions
              (USACS)，后者是战略投资方和临床合作伙伴，帮助公司完成早期起步。投资人占比较高的董事会结构，在重度融资的后期私营公司中很常见。关键人风险集中在作为临床创始人和居家医院使命公开代表的 Dr.
              Prather，以及负责运营的 CEO Jennifer Webster。研究期内未发现公开记录的治理事件或正式领导层争议。
