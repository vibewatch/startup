      - number: '8.5'
        title: 可比估值组
        blocks:
          - type: paragraph
            body: >-
              最直接可比的退出是 Oak Street Health，CVS Health 于 2023 年 2 月以 $10.6B 收购，约为 3x 收入——这是一个聚焦 Medicare Advantage
              的居家初级护理平台，证明大型一体化付款方愿意为已验证的居家护理平台支付溢价倍数。Contessa Health 于 2021 年被 Amedisys 以 $250M 收购，估计收入倍数 2-3x，为 H@H
              赋能平台设定底部。Landmark Health（OptumHealth）以估计 $3B+ 被收购，显示战略买家对规模化居家护理有需求。Bright Health Group 在 2024
              年因付款方侧亏损申请破产——这是一个警示性可比，说明依赖付款方模型的下行风险。LHC Group 于 2022 年被 Optum 以约 $6B 收购，约为 1.5x 收入。DispatchHealth 估计
              12-14x 收入倍数，比 Oak Street Health 基准高出 4-5x，反映技术平台与永久支付代码可选性溢价。要维持这一溢价，必须由 CMS 永久化获得可比先例支撑。
