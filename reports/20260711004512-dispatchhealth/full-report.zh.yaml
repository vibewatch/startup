      - number: '3.4'
        title: 转换成本、锁定与竞争护城河
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 的竞争护城河主要由三部分构成：运营基础设施、支付方投资者一致性，以及监管认证。


              运营基础设施护城河真实存在，但并非无法攻破。搭建居家医院平台需要临床指挥中心技术、移动诊断设备（X-ray、超声、CLIA 认证移动实验室）、训练有素的急性护理护士、最后一公里配送物流网络，以及与合作医疗系统的
              EHR 集成。每一项都为新竞争对手设置了有意义的进入壁垒，建设需要 2–4 年资本投入。不过，Medically Home 技术并入 DispatchHealth
              的合并后整合带来执行风险；如果整合缓慢或问题较多，可能部分侵蚀这道护城河。


              支付方投资者护城河更强，也更持久。Humana、Blue Shield of California 和 Optum 同时是投资方和支付方客户。这些关系给 DispatchHealth
              提供了在这些支付方网络内近乎独家的转介管道。竞争性 H@H 运营商需要独立与数十家主要保险公司谈判支付方合同，每家支付方都需要 6–18 个月，且竞争激烈。


              ACHC 认证（首个，2024 年 11 月）形成了信任信号和质量标准，支付方和医疗系统在项目认证中会越来越需要它。竞争对手最终会复制这项认证，但它提供了 12–24 个月的先发优势。


              医疗系统转换成本中高：从 DispatchHealth 切换到另一平台，需要重新集成 EHR 连接、重新培训员工、重新谈判支付方合同，并可能解散 JV 结构。这为现有企业客户创造了有意义的锁定。
            claimRefs:
              - CP016
              - CP017
              - CP018
              - CP019
              - CP020
