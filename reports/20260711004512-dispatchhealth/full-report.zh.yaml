          - type: callout
            title: 私营公司不透明，让收入、利润率和单位经济难以验证
            body: >-
              DispatchHealth 没有公开披露收入、毛利率、EBITDA 或单患者经济模型。第三方聚合商给出的收入估算为 $257M–$312M，但这些估算来自员工数和行业基准模型，不是经验证的财务数据。若按
              $3.7 billion 估值分析，基于这些估算会隐含很高的收入倍数，基础财务尽调完全依赖管理层在私有数据室提供经审计财务。
