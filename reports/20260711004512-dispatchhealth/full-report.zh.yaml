      - number: '8.2'
        title: 建议、信心与估值立场
        blocks:
          - type: paragraph
            body: >-
              在 $3.7B 投后估值和估计 12-14x 收入倍数下，DispatchHealth 已按牛市情景执行成功来定价。建议为有条件观察评级：如果 CMS 将 AHCAH
              转为永久支付，战略上有吸引力且可防守；但在没有转化的情况下，考虑到单位经济不透明，估值偏高。按现有信息，可比公司支持 $2.5-4.5B 的基础公允价值：Oak Street Health 约以 3x
              收入退出；Contessa Health 以 2-3x 收入退出；DispatchHealth 的溢价来自其技术平台定位和永久支付代码可选性。按估计收入 13x
              计算，市场已经把尚未发生的监管解决计入价格。高执行风险评级有充分理由：Jennifer Webster 是未经验证的 CEO（2023 年底上任），公司正在推进居家医院行业最复杂的运营整合，SVB
              债务融资未披露，Medically Home 财务困境在公告后才披露。如果 CMS 豁免在 2030 年后不续期，或临床扩张制造重大不良事件，$2B 下行情景有合理可能。若要以 $3.7B
              估值投入，进入纪律应要求经审计财务报表证明至少三个季度的收入轨迹、确认 SVB 债务状态，并证明 Medically Home 整合按计划推进。
