      - number: '6.3'
        title: 留存、满意度与负面背景
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 报告 98%
              患者满意度，在数字健康领域已披露数据中处于最高水平之一。这一满意度与价值主张一致——在家接受治疗，而不是在急诊科等待，本来就更符合患者偏好。但患者满意度不等于企业留存：真正相关的留存指标是医疗系统和付款方合同续约，公开资料没有披露。

              负面留存信号来自 Axios 2025 年 6 月泄露文件披露的 Medically Home 财务状况。一份据称 498 页的文件显示，Medically Home 经历了“剧烈”估值下跌，并且只有靠 Mayo
              Clinic 和 Kaiser Foundation Hospitals 的紧急现金注入才存续下来——两者也列为投资人。一些 Medically Home 高管和投资人从 DispatchHealth
              合并中获得了部分清算收益。财务困境还包括员工人数从 1,500+ 降至约 985-1,200，代表有记录的 3%+ 员工减少（更大的数字意味着更显著的重组）。这是客户 /
              合作伙伴侧最直接的负面证据：Medically Home 至少两个最重要医疗系统合作伙伴（Mayo Clinic、Kaiser）以紧急资本提供方身份介入；即便它们维持了财务承诺，也可能说明关系存在压力。

              DispatchHealth 面对 Axios 报道，拒绝评论 Medically Home 的财务细节。公司没有发布医疗系统合同续约率、净收入留存、总收入留存或流失数据。没有这些数据，企业留存韧性无法独立评估。

              CMS AHCAH 豁免在 2025 年 10 月短暂停摆，为 HAC 项目患者和医疗系统合作伙伴制造了临时报销不确定性。目前没有发现公开披露显示停摆导致合同重新谈判或医疗系统合作伙伴退出。
