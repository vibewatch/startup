      - number: '3.5'
        title: 护城河耐久性、商品化风险与竞争对手不利信号
        blocks:
          - type: paragraph
            body: >-
              居家医院板块长期面临三方面商品化风险：监管标准化、技术商品化和医疗系统垂直整合。


              监管标准化：CMS AHCAH 豁免创建了任何医院都可使用的统一覆盖标准。随着更多医疗系统自建项目，赋能平台的差异化会下降。豁免延期至 2030
              年既是顺风（给现有平台确定性），也是风险（市场被常态化，更多内部自建决策变得可行）。


              技术商品化：Medically Home 的临床指挥中心技术曾是专有差异点，如今正在被 DispatchHealth 平台吸收。与此同时，竞争性 RPM 和远程医疗平台（Biofourmis、Current
              Health）正在提升临床能力，最终可能以更低成本提供可比的指挥中心功能。


              医疗系统垂直整合：Mass General Brigham、UPMC、Mayo Clinic 等大型系统选择自建 H@H 项目，而不是签约外部平台。如果技术和运营组件足够标准化，“内部自建”趋势可能强化。


              不利信号：Medically Home 合并本身暴露了一个警示。Home Health Care News 在 2025 年 6 月报道称，一份泄露内部文件描述了 Medically Home
              “剧烈”估值下降，以及合并前依靠 Mayo Clinic 和 Kaiser 现金输血。这说明，H@H 赋能模式规模化变现可能比预期更难，DispatchHealth
              合并后平台也会受到技术赋能组件带来的盈利能力逆风。
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
          - type: table
            tableRef: TP004
            claimRefs: []
      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: DispatchHealth 是唯一把全栈急性护理交付与技术赋能结合起来的全国性平台
            body: >-
              目前没有竞争对手在全国规模上同时结合急诊替代护理、医院级 HAC、过渡护理、临床指挥中心、移动诊断和 ACHC 认证。合并 Medically Home
              后的实体独特地横跨直接护理交付（面向患者）和技术赋能（面向医疗系统），让医疗系统可以为一种或两种模式签约。这是结构性差异化，Contessa、Biofourmis 和 Landmark
              单独都无法在不投入大量资金的情况下复制。
            calloutType: strength
            claimRefs:
              - CP011
              - CP012
          - type: callout
            title: 大型医疗系统的内部自建威胁，是最被低估的竞争风险
            body: >-
              Mass General Brigham、UPMC、Mayo Clinic 和 Kaiser 都是拥有大量资本和医生转介网络的大型系统，却选择自建 H@H 项目，而不是签约 DispatchHealth。CMS
              AHCAH 豁免（任何合格医院都可使用）以及 RPM 和远程医疗技术标准化，让这种内部自建成为可能。如果内部自建趋势加速，DispatchHealth
              面向医疗系统企业合同的可服务市场可能实质性收缩，尤其是在大型自给自足系统占主导的市场。
            calloutType: risk
            claimRefs:
              - CP003
              - CP022
              - CP023
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、定价模式与收入质量
        blocks:
          - type: paragraph
            body: >-
              合并后，DispatchHealth 采用按服务收费收入模式，三条主要服务线为急诊替代护理、住院替代护理（HAC）和过渡护理。每条服务线都通过支付方报销产生收入——要么直接来自保险公司，要么通过面向
              Medicare 按服务收费患者的 CMS AHCAH 豁免。签约 DispatchHealth 赋能技术（Medically Home
              平台）的医疗系统也可能支付企业许可费或管理费，但这些安排的财务条款没有公开披露。


              急诊替代就诊是最高频服务线，据信贡献了 DispatchHealth 当前收入的大部分。这些就诊在患者家中完成急性级分诊、诊断和治疗，替代急诊科就诊；支付方按不同计划和市场的费率报销。DispatchHealth
              报告称已进入多数主要保险公司网络，这是按服务收费收入可持续的前提。


              住院替代护理（HAC）收治的单次服务收入高于急诊替代就诊（估计每例 HAC 收治为 $3,000-$7,500，而每次急诊替代就诊约
              $500-$1,500），但每位患者需要更多运营投入。DispatchHealth 报告称 2024 年完成 2,000+ 例 HAC 收治，合并 Medically Home 后的实体预计会显著扩大这一规模。


              第三方对 DispatchHealth 2025-2026 年收入的估算区间为 $257.7 million 至 $312.2
              million。这些估算由数据聚合商（Compworth、ZoomInfo、Tracxn）用专有模型生成，不来自经验证的公司财务披露。DispatchHealth 没有公开确认收入数字。按当前 985–1,200
              名员工计算，这些估算隐含每员工收入约 $200,000-$250,000，符合高劳动力成本医疗服务模式。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
