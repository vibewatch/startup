  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用患者与合作伙伴流程定义服务
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth
              把护理送到那些本来会去急诊或住院的患者身边。患者来电，或医疗系统合作伙伴转诊之后，一支临床团队通常在数小时内到达患者家中，团队通常由医师助理或执业护士组成，并由医生提供后备支持，同时携带一套移动诊断设备。这套设备包括便携式
              X 光、超声和床旁超声（POCUS），以及一间 CLIA 认证、中等复杂度的移动实验室，可完成血液检查、尿检和培养。ER 替代病例是最早也是最大的服务线，单次上门就在现场解决病程：58%
              的上门最终让患者完全在家接受治疗，而不是被送往急诊科。

              Hospital-Alternative Care（HAC）服务线在 2024 年与 Medically Home 合并后成为运营核心，它把病情复杂度提升到等同住院的水平。进入 HAC
              项目的患者会收到输液泵、监测设备、氧气，并接受每日护士上门，同时由 Medically Home 的 24/7
              医生主导临床指挥中心支持。指挥中心提供虚拟监督，让居家患者获得相当于医院遥测基础设施的能力，却不承担实体设施成本。DispatchHealth 于 2024 年 11 月获得 ACHC In-Home
              Hospital Care Accreditation——这是首次授予该类认证——正式验证其 HAC 模型达到机构级质量标准。

              第三条服务线是过渡护理，围绕患者从医院或急诊科出院后的阶段展开。护理团队在再入院风险最高的关键出院后窗口持续跟进患者。DispatchHealth 患者群体的 8.5% 30 天再入院率，大约只有 ~15%
              全国平均的一半，这构成医疗系统和付款方愿意为该服务付费的核心经济论据。

              购买流程是 B2B：医疗系统和付款方与 DispatchHealth 签订企业合同，再通过派单呼叫中心、EHR 集成转诊流程，或付款方护理管理直接路由来转诊患者。患者与 DispatchHealth
              临床人员互动，但采购和授权关系掌握在医疗系统或付款方手中。每次护理事件的报销资金来自 Medicare、Medicare Advantage、Medicaid 和商业保险，流向 DispatchHealth。
