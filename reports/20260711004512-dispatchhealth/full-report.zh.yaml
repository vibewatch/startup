      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              CMS Hospital Outpatient Prospective Payment
              System（HOPPS）年度规则可以在无需国会行动的情况下下调单次护理事件报销额，因此每年的规则制定周期都是定价风险。CMS 还设定 AHCAH 参与的患者资格要求——包括达到 IV
              治疗水平的病情复杂度要求——限制符合 HAC 护理事件条件的患者群体，带来患者筛选风险。DispatchHealth 必须在所有 20+
              个运营州持有有效临床牌照，而各州对居家健康机构、移动诊断和远程医疗的要求各不相同。进入新州会增加合规成本和时间阻力。HHS Office for Civil Rights 的 HIPAA
              执法，每个违规类别每年最高可处以 $1.9M 民事罚款；对于在私人住宅收集患者数据的分布式模型，这一风险重大。远程医疗报销灵活性在 COVID 后延长，但尚未永久成文，也会影响护理模型中的虚拟护理部分。
            claimRefs: []
