      - number: '5.3'
        title: 临床证据、认证与监管资质
        blocks:
          - type: paragraph
            body: >-
              与同阶段大多数数字健康公司相比，DispatchHealth 的临床结果记录更强。58% 急诊规避率、8.5% 30 天再入院率（对比 ~15% 全国平均）和 98%
              患者满意度由公司发布，并获得医疗系统合作伙伴佐证。2013 年以来累计节省医疗成本估计 $1.5B，以及每名 HAC 患者相较传统住院节省 $5,000-$7,000，构成面向付款方和医疗系统买家的经济论据。

              更广义的居家医院模型，也有独立临床证据，来自已发表的同行评议研究。《Annals of Internal Medicine》一项里程碑研究显示，在家提供急性医院级护理，相比传统住院可达到相当或更优结果。CMS
              针对 Acute Hospital Care at Home（AHCAH）项目的研究覆盖 2021 年 11 月至 2023 年 3 月，发现项目参与医院的死亡率和并发症低于传统医院护理。CMS 研究报告的
              7.2% 患者从家转回医院比例，记录了该模型规模化时的安全底线。

              ACHC In-Home Hospital Care Accreditation 于 2024 年 11 月 21 日获得，是同类首个资质，竞争对手无法声称拥有。ACHC（Accreditation
              Commission for Health Care）也是认证居家健康机构和临终关怀组织的同一机构。该认证要求记录患者安全方案、临床质量标准和与医院级护理一致的运营流程。

              CMS Acute Hospital Care at Home（AHCAH）豁免授权 Medicare 为居家医院项目报销，并由 2026 年《Consolidated Appropriations
              Act》延长五年至 2030 年 9 月 30 日。这次延长把一项关键监管风险转化为中期顺风。截至 2024 年 4 月，37 个州、133 个医疗系统内的 320+ 家医院获批
              AHCAH，说明该监管框架已经主流化，而不是实验性安排。
