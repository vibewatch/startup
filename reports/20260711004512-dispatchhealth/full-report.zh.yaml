          - type: callout
            title: 财务不透明与 Medically Home 困境卖方背景，带来重大尽调风险
            body: >-
              DispatchHealth 没有披露任何经过验证的财务指标，而 Medically Home 合并的交易对手，据报道估值曾出现“剧烈”下跌，并且需要现金注入才能存续。没有数据室审阅，就无法判断
              Medically Home 的负债是否已被完全吸收，也无法判断合并后实体的真实现金状况是否支撑增长叙事。2022 年的 SVB 债务融资在 SVB 于 2023 年倒闭后，当前服务方和条款也仍然未知。
