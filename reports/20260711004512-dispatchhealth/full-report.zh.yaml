      - - Landmark Health（OptumHealth）
        - 纵向居家基层医疗
        - 收购价未披露（2021）；Optum 规模（UHG 子公司）
        - 复杂慢病患者（不是急性期单次事件）
        - 庞大的 Optum 分销；接入 UHG 支付方网络
        - 重点是慢病管理，不是急性 H@H；同时是 DispatchHealth 投资人
      - - Biofourmis
        - AI 驱动的 RPM 与照护管理平台（软件）
        - 累计融资 $300M+；在美国、欧洲、亚洲运营
        - 寻求 RPM 和预测分析能力的医疗系统
        - AI/ML 能力强；获多个市场监管批准
        - 仅软件；不交付直接照护；病情急性程度低于 DispatchHealth
      - - Inbound Health
        - H@H 赋能（区域型）
        - 公开披露有限；规模小于 Contessa 或 DispatchHealth
        - 区域医疗系统（中西部及部分市场）
        - 聚焦赋能模式；区域医疗系统关系深
        - 规模有限；受地域约束；无公开结局数据
      - - Current Health / Best Buy Health（RPM 平台）
        - 远程患者监测（RPM）
        - Best Buy 收购（2021）；已整合进 Best Buy Health 平台
        - 为慢病和急性后期患者寻求 RPM 的医疗系统与支付方
        - 零售分销渠道；消费者品牌认知广
        - 低急性程度；不能替代急性 H@H；仅 RPM
      - - Mass General Brigham Healthcare at Home（医疗系统自营）
        - 医疗系统自营 H@H 运营方
        - MGB 系统规模；学术医疗中心背书；未单独融资
        - 归属 MGB 的患者；Boston 和 New England 地区
        - 学术研究可信度；已发表结局；医生转诊管线
        - 受地域限制；不是平台或技术供应商；自建而非采购
      - - UPMC at Home（医疗系统自营）
        - 医疗系统自营 H@H 运营方
        - UPMC 系统规模；Pittsburgh 和 Pennsylvania 足迹
        - UPMC 主导市场中的 UPMC 患者
        - 与 UPMC 保险（UPMC Health Plan）整合；纵向一体化
        - 区域型；不是全国平台；自建而非采购
    notes: >-
      所有竞争对手画像基于公开新闻稿、分析师报告和公司网站。Contessa/Amedisys 与 Landmark/Optum 是收购后实体，战略方向可能变化。Biofourmis 和 Inbound Health
      的融资数字来自公开披露轮次，可能不反映当前资本结构。
