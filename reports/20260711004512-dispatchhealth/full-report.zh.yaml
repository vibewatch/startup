      - number: '1.4'
        title: 规模指标、临床结果与覆盖缺口
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 公开声称，自 2013 年以来已服务超过 1.2 million 名患者，急诊室规避率为 58%，30 天再入院率为 8.5%（全国平均约 15%），患者满意度为
              98%。公司估算，累计节省总医疗成本 $1.5 billion。公司在 20 多个州的 50 个主要都市区运营，拥有 50
              多家企业客户（医疗系统和支付方）。这些指标来自公司新闻稿，没有通过监管文件独立验证，应按公司自称而非经审计数据处理。


              合并后的实体纳入了 Medically Home 的历史成绩：通过合作医疗系统项目支持 55,000+ 例居家医院患者收治，并带来 Medically Home
              的临床指挥中心技术平台。DispatchHealth 的直接护理模式与 Medically Home 的医疗系统赋能技术结合，意在覆盖更宽的病情严重度区间。


              关键指标仍有明显缺口。公司没有公开披露收入；第三方聚合商（Compworth 等）给出 2025–2026 年 $257 million 到 $312 million
              的估算，但这些是模型估算，不是经验证的财务数据。员工数从 2024 年超过 1,500 人降至 2026 年约 985–1,200 人，可能反映运营效率改善，也可能是在资本事件前有意调整成本结构。2024 年
              11 月获得的 ACHC 居家医院认证是全国首个同类认证，提供了外部质量信号。CMS 豁免参与资格如今已在 Consolidated Appropriations Act of 2026 下延长五年至 2030
              年 9 月 30 日，为居家医院模式提供了报销框架。
