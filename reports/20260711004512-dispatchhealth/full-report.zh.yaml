      - number: '4.3'
        title: 成本结构、毛利驱动因素与资本强度
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth
              的成本结构主要被人力成本吃掉：急性护理护士、急救医护人员、医师助理和其他临床人员，是每次上门或入院的主要可变成本。其他可变成本还包括移动诊断设备维护、医疗耗材，以及设备和临床团队最后一公里运输。


              固定成本包括临床指挥中心（技术与人员）、公司基础设施，以及 Medically Home 技术平台（合并后仍需持续集成投入）。整合 Medically Home
              临床指挥中心平台带来的技术资本开支，短期会偏高，合并后 2-3 年应逐步回归正常。


              居家医院服务的毛利率受到结构性限制，原因是人力成本相对报销费率偏高。在更广义的居家健康服务行业里，护理密集型服务毛利率通常在 25%-40%；DispatchHealth 既做急性护理（病情更重 =
              人力成本更高），又有技术赋能（增量系统的边际成本更低），因此综合利润率画像并未公开披露。


              营运资本需求中等：按服务收费的付款方通常在提交理赔后 30-90 天内报销，DispatchHealth
              与医疗系统签订的企业合同也可能包含预付款或里程碑付款。但理赔被拒、预授权延迟和不同付款方的报销费率，会给收入周期带来不确定性。


              资本开支主要用于移动诊断设备（X 光机、超声设备、CLIA 认证移动实验室）、临床指挥中心基础设施和技术平台开发。公司在 2022 年 10 月筹集了一笔 $75M 的传统债务融资，明确用于设备和运营扩张。
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
