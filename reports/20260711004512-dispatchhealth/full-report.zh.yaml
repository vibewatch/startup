chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部、创立与商业模式
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 总部在 Colorado 州 Denver，公司把自己描述为把医院能力带到舒适的家中。公司由 Dr. Mark Prather 和 Kevin Riddleberger 于 2013
              年创立：Prather 是急诊室医生，现任执行董事长兼联合创始人；Riddleberger 是医师助理（PA-C、MBA），现任首席战略官兼联合创始人。Jennifer Webster
              是首席执行官。公司所处的居家医院板块隶属于更广义的数字健康和居家医疗行业，夹在急诊医学、医院级急性期护理和出院后过渡支持的交汇处。


              DispatchHealth 采用 B2B2C 模式。医疗系统和支付方签下企业合同后，可以把患者转介过来；DispatchHealth
              的护理团队再到患者家中提供医疗服务。除了企业合同，公司还进入多数主要保险公司的网络，并接受按服务收费报销。合并后，产品组合由三条核心服务线构成：急诊替代护理（在家提供急诊级护理，避免急诊就诊）、住院替代护理（完全在家交付住院级护理）和过渡护理（出院后支持，预防再入院）。公司治疗几乎所有非危及生命的严重病症，包括充血性心力衰竭、COPD、肺炎、皮肤感染，以及需要中等复杂度实验室诊断的病症。公司新闻室称，该模式可处理最常见急诊室诊断中的
              95%。


              截至 2026 年 7 月，DispatchHealth 在 20 多个州的 50 个主要都市区运营。与 Medically Home 合并后的实体持有首个 ACHC 居家医院护理认证（2024 年 11
              月授予），并参与 CMS Acute Hospital Care at Home (AHCAH) 豁免项目。
