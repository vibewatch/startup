      - number: '4.2'
        title: GTM 路径与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 的主要 GTM 路径，是面向医疗系统和支付方的企业 B2B 销售。医疗系统企业合同从初次触达到签约通常需要 6–18
              个月，因为把第三方临床服务嵌入医疗系统护理交付模式，涉及临床、运营和法务复杂性。支付方合同也需要完成网络资质认证、理赔处理集成和费率谈判。


              公司最鲜明的 GTM 优势是支付方投资者一致性（Humana、Blue Shield of California、Optum Ventures）：这些投资者也是支付方客户，让 DispatchHealth
              在这些支付方网络中获得优先提供方地位，并显著降低来自这些计划患者转介的获客成本。新进入者若没有类似战略投资者构成，就无法复制这种结构性优势。


              公开信息中没有直接获客成本（CAC）数据。代理指标显示销售周期成本较高：DispatchHealth 雇有首席增长官和专门的企业销售职能，其 B2B
              模式还需要医疗系统和支付方组织中的高管参与。一旦签约，医疗系统会通过正常临床工作流转介患者，每个患者单次服务的增量获客成本很低。


              公司在 50 个都市区拥有 40 个医疗系统企业合同，意味着平均每个都市区不到 1
              份合同；在产生新市场进入成本之前，现有地理覆盖内仍有显著扩张空间。每新增一个医疗系统企业合同，都会扩大转介管道，而直接患者获客成本不会同比例增长。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: figure
