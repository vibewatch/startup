      - number: '7.5'
        title: 缓释措施、监控项与打破投资论点的触发器
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 已落地以下结构性风险缓释：（1）ACHC In-Home Hospital Care Accreditation（首个，2024 年 11 月）提供外部质量验证；（2）60+
              个特定病症临床方案标准化分布式护理交付；（3）CMS 豁免延长 5 年至 2030 年，创造运营跑道；（4）Series E1（$160M，2025 年 3 月）提供资本缓冲。但以下条件会打破投资论点：CMS
              豁免到期后没有永久编码，或 CMS 将 HAC 报销削减 >20%；Medically Home 整合未能在合并完成后 18 个月内（即 2027 年 Q1
              前）交付统一平台；主要付款方兼投资人（Humana、Blue Shield、Optum）退出其付款方客户关系；或 SVB/First Citizens 债务契约违约触发强制资本事件。投资人应跟踪 CMS
              年度规则制定周期、整合里程碑披露、付款方预授权政策公告和季度员工数趋势，作为领先指标。
