        - 高（基于披露估值和累计融资额）
        - 高于 D/E 轮医疗服务公司的中位数；反映市场信心
        - 确认收购 Medically Home 未带来会调整有效累计融资额的隐藏负债
    notes: >-
      所有单位经济性估计均为推导或推断，没有一项来自审计财务。毛利率和人力成本估计采用上市居家健康公司的行业类比（如 LHC Group、被收购前的 Amedisys）。DispatchHealth
      的实际利润率可能因其急性高病情复杂度模型以及合并后整合成本而显著不同。
