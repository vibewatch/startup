      - number: '4.6'
        title: 附录
        blocks:
          - type: callout
            title: 来自付款方兼投资人关系的按服务收费收入，构成结构性可防守收入基础
            body: >-
              DispatchHealth 来自 Humana、Blue Shield of California 和 Optum 关联网络的收入，受到投资人兼付款方双重关系的部分保护。这些付款方作为投资人，有财务动机维持
              DispatchHealth 的优先提供方条款和高转诊量。上述渠道收入因此拥有结构性底部，纯按服务收费竞争对手并不具备。CMS 豁免延长至 2030 年，也进一步锁定了未来五年的 Medicare
              按服务收费收入通道。
