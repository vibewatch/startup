      - CO037
  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: DispatchHealth 的运营模式把临床可信度（医院级护理）、与支付方一致的投资者基础、企业级 B2B2C 分发系统和技术平台连成互相强化的闭环，让居家医院对支付方有成本效益，也让医疗体系能规模化运营。
    data:
      nodes:
        - id: n1
          label: 临床创始团队
          description: Dr. Prather（急诊医生）和 Riddleberger（PA-C）把居家医院设计成临床优先事项，而不是一家技术创业公司。
        - id: n2
          label: B2B2C 企业模式
          description: 医疗体系和支付方转诊患者；DispatchHealth 在家中交付护理并向保险计费。
        - id: n3
          label: 支付方投资者一致性
          description: Humana、Blue Shield CA、Optum 既是投资者也是客户，降低 CAC，并让支付方转诊激励一致。
        - id: n4
          label: 三条服务线
          description: 急诊替代护理、医院替代护理（HAC）和过渡期护理覆盖完整急性期和急性后期连续谱。
        - id: n5
          label: Medically Home 技术
          description: 2025 年并购获得临床指挥中心和远程医疗平台；支撑虚拟急性期监督。
