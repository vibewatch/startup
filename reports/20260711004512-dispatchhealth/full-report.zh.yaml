figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: >-
      DispatchHealth 的轨迹展现典型风险资本支持下的扩张曲线：种子阶段验证、机构融资加速、独角兽认定，以及由并购驱动的转型；关键监管节点（ACHC 认证、CMS
      豁免延期）提供合法性锚点，另一个负面拐点（Medically Home 财务承压）则增加整合不确定性。
    data:
      items:
        - label: 成立
          date: '2013'
          detail: Dr. Mark Prather 和 Kevin Riddleberger 在 Denver 创立 DispatchHealth，定位为急诊替代护理服务
          tone: positive
        - label: Series A 轮（$32M）
          date: 2017-09
          detail: Alta Partners、Questa Capital 和 USACS 领投扩张资本
          tone: positive
        - label: Series C 轮（$136M）
          date: 2020-06
          detail: Optum Ventures 领投；Humana 以支付方投资者身份加入；COVID-19 推高 H@H 需求
          tone: positive
        - label: 独角兽 — Series D1 轮（$200M）
          date: 2021-03
          detail: Tiger Global 领投；投后估值约 $1.7B
          tone: positive
        - label: Series D2 轮 + 债务（$259M + $75M）
          date: 2022-10
          detail: Optum Ventures 领投第二笔 D 轮；Blue Shield CA 加入；SVB 债务融资
          tone: positive
        - label: ACHC 认证
          date: 2024-11
          detail: DispatchHealth 获得全国首个居家医院护理认证
          tone: positive
        - label: Series E1 轮 + 并购公告（$160M，$3.7B）
          date: 2025-03
          detail: Series E1 轮估值 $3.7B；同步宣布与 Medically Home 合并
          tone: positive
        - label: 并购交割
          date: 2025-05
          detail: 吸收 Medically Home；合并实体覆盖 50 个都市区和 40+ 医疗体系
          tone: positive
        - label: Medically Home 承压被报道
          date: 2025-06
          detail: 据报道，泄露文件显示 Medically Home 并购前估值大幅下跌，并依赖 Mayo/Kaiser 现金
          tone: adverse
        - label: CMS 豁免延长 5 年
          date: 2026-01
          detail: Consolidated Appropriations Act of 2026 将 AHCAH 豁免延长至 2030 年 9 月
          tone: positive
    approximationNotes: null
    claimRefs:
