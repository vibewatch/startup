      - number: '4.4'
        title: 公开进展与未披露私有指标之间的缺口
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 披露了一组扎实的运营和临床指标，可作为财务健康状况的代理变量，但公司没有披露投资人通常用来判断收入质量和资本效率的财务指标。


              公开运营指标包括：2013 年以来治疗 1.2M 名患者、58% 急诊规避率（公司声称）、8.5% 30 天再入院率（对比 15% 全国平均）、98% 患者满意度、50 个大都会区、40
              多个医疗系统企业合同、2024 年 2,000 多例 HAC 入院，以及估计累计创造 $1.5B 医疗总成本节省。


              这些指标描绘出较强的临床质量，但不能直接支撑财务分析。关键缺失指标包括：年收入（未披露）、毛利率（未披露）、EBITDA 或净利润（未披露）、月度或季度现金消耗（未披露）、Series E1
              后账上现金（未披露），以及按服务线拆分的收入（未披露）。


              Compworth（$257.7M-$312.2M 收入）、Tracxn（融资数据）和 PremierAlts（$3.7B
              估值）给出的第三方财务估算提供了方向性参照，但这些数字来自模型，而不是公司披露。这些估算与真实财务之间的差距可能相当大。
