      - number: '1.5'
        title: 关键里程碑、Medically Home 合并与不利事项
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 的历史可分为四个阶段：隐身创立与早期 Denver
              运营（2013–2017）、风险资本推动的加速扩张（2017–2021）、居家医院市场建设与监管顺风（2021–2024），以及合并与认证驱动的转型阶段（2024–2026）。


              Medically Home 合并是近期最关键事件。2025 年 3 月，DispatchHealth 宣布计划与 Medically Home 合并。Medically Home 位于 Boston，成立于
              2016 年，累计融资 $287 million（包括 2022 年的 $110 million），采用技术赋能的临床指挥中心模式，服务 Mayo Clinic、Kaiser 等医院系统合作伙伴。交易于 2025
              年 5 月下旬完成，条款未披露。合并后实体沿用 DispatchHealth 品牌，Medically Home 品牌正在退出。


              合并过程中出现了不利事项。Home Health Care News 在 2025 年 6 月报道称，一份泄露的内部文件据称显示，Medically Home 在合并前估值出现“剧烈”下降，并依靠 Mayo
              Clinic 和 Kaiser 输血维持偿付能力。文件还据称显示，高管和投资者通过该交易获得了部分清算回款，暗示 Medically Home 一方是困境卖方，而不是实力对等的合并方。DispatchHealth
              拒绝评论财务细节。这一不利背景带来尽调问题：整合成本是多少，合并后真实资产负债表如何，Medically Home 的债务是否在交易中完整披露。


              2024 年 11 月、合并完成前，ACHC 授予 DispatchHealth 首个居家医院护理认证。AMA 确认，美国国会已将 CMS AHCAH 豁免延长五年至 2030 年 9 月；此前该豁免在 2025
              年 10 月短暂失效，导致项目受扰，后续延期通过后移除了一个主要报销不确定性。这些监管确认实质性降低了公司中期收入模型的风险。
