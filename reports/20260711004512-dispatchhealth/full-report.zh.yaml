        - 中
        - 立即 — 证据基础已经建立
      - - Medicare Advantage 增长（占 Medicare 54%+）
        - 驱动因素 / 风险
        - MA 计划可独立谈判报销；增长既带来规模机会，也带来定价风险
        - 中
        - 持续
      - - 技术基础设施 / 搭建成本
        - 约束因素
        - 临床指挥中心、远程监测设备、物流都需要大量资本
        - 高
        - 持续
      - - 护理人力短缺
        - 约束因素
        - 居家急性期护理需要专门技能；全国供给受限
        - 高
        - 持续（结构性）
      - - 医生与患者惯性
        - 约束因素
        - 不熟悉 H@H 医嘱流程；责任顾虑；患者对居家照护的舒适度
        - 中
        - 逐步改善
      - - 监管与报销不确定性（MA、非 Medicare）
        - 约束因素
        - 没有全国性要求，强制 MA 计划按 FFS 同等水平为 H@H 付费
        - 高
        - 持续
      - - 地理密度要求
        - 约束因素
        - H@H 经济账要求单个市场患者密度高；农村地区跑不出经济性
        - 中
        - 结构性
    notes: 影响强度评级是定性判断。多数运营方认为，不管监管顺风有多强，护理人力短缺才是近期卡住容量的约束。地理密度要求把 H@H 限定在城市和郊区都会区；DispatchHealth 覆盖 50 个都会区，也体现了这一约束。
  - id: TP001
