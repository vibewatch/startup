      - number: '6.4'
        title: 扩张动力与集中度风险
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 的扩张杠杆包括地理（新都会区）、服务线（现有医疗系统合作伙伴采用 HAC）和付款方合同（新增 Medicaid 管理式护理、更多商业保险计划）。合并后的 50
              个都会区覆盖，代表当前地理上限；新增市场进入需要最低患者量密度，才能支撑临床团队利用率经济性。

              集中度风险是真实存在的，但公开来源无法完整量化。DispatchHealth 没有披露头部客户收入集中度。不过，投资人兼客户重叠——Humana、Blue Shield of California、Optum
              Ventures——说明少数大型付款方关系很可能贡献了不成比例的患者转诊量，进而贡献收入。如果 Humana 缩减 Medicare Advantage 计划参保规模，或调整转诊政策，DispatchHealth
              在加州和全国 MA 的患者量都会受影响。Medically Home 组合可能通过把 Mayo Clinic 和 Kaiser Foundation Hospitals
              带入生态，部分重新分散这种集中度，但它们是运营合作伙伴，而非纯粹的付款方流量贡献者。

              医疗系统账户内可以先落地再扩张：一家医疗系统从 ER 替代护理起步后，可以扩展到 HAC（前提是它有 AHCAH 豁免批准），再增加过渡护理。EHR
              集成创造切换成本，有助于推进扩张对话。不过，公开数据没有披露每个医疗系统客户平均收入、扩张率，或从初始合同到采用 HAC 的周期。

              Contessa Health 对比很有启发：Amedisys 于 2021 年以 $250M 收购 Contessa，Contessa 采用合资模式，而不是按服务收费模式。这意味着 DispatchHealth
              竞争的是一种让医疗系统拥有更多所有权控制的方式（JV），而部分系统更偏好这种方式。这一结构选择提出了 DispatchHealth 在企业销售中必须回答的差异化问题。
