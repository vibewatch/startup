  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户待完成任务
      - 当前 / 传统工作流
      - DispatchHealth 方案
      - 已记录的可衡量收益
      - 限制
    rows:
      - - 非危及生命急症避免去 ER
        - 患者拨打 911 或自行去 ER；等待 4-6 小时；单次就诊成本高；可能住院
        - DispatchHealth 团队数小时内上门；在家用完整诊断套件治疗
        - ER 避免率 58%；患者满意度 98%；相对 ER 有估计成本节省
        - 不适用于危及生命的急症（伴心脏风险的胸痛、中风、重大创伤）。
      - - 无需住院即可提供住院级护理
        - 患者住院；平均住院 4-5 天；承担院内感染风险；成本高
        - HAC 项目：每日护士上门、指挥中心监测、IV 治疗、居家影像
        - 30 天再入院率 8.5%，全国约 15%；相对院内住院每个案节省 $5K-$7K
        - 转院率 7.2%，意味着约每 14 名患者中仍有 1 名需要升级到医院。
      - - 防止出院后再入院
        - 患者从医院出院；30 天窗口内再入院风险高；没有系统化随访
        - 过渡期护理项目跟踪患者，一旦发现恶化迹象就早期介入
        - 组合层面 30 天再入院率 8.5%；以防止再入院支撑支付方 ROI 论证
        - 再入院数据为组合层面；未单独发布过渡期护理队列数据。
      - - 在照护现场确认诊断（面向转诊临床人员）
        - 将患者送往影像中心或实验室复查；增加延误、不便和成本
        - CLIA 移动实验室和便携影像提供同次就诊检测结果
        - 同次就诊的实验室和影像结果支持立即决定治疗
        - 未发布 DispatchHealth 移动实验室准确性与医院参考实验室的对比。
      - - 在家管理复杂慢病患者（支付方用例）
        - 复杂患者反复进出 ER 和医院；单患者成本高
        - 企业支付方合同：DispatchHealth 用三条服务线管理高利用人群
        - 自 2013 年以来，企业组合累计记录医疗成本节省 $1.5B
        - 成本节省数字由公司报告，未经独立审计。
    notes: 可衡量收益来自公司新闻稿和临床研究。58% ER 避免率和 8.5% 再入院率为公司报告的汇总指标；独立临床审计数据仅限于 CMS AHCAH 项目研究（2021 年 11 月至 2023 年 3 月）。
