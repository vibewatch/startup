  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与相邻板块
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 的相关市场横跨三个相互关联、正在向居家医院 (H@H)
              伞形概念靠拢的护理板块。核心市场是在传统医院之外交付急性期级别护理——包括急诊替代分诊、医院级住院替代，以及连接住院出院与回家的急性期后过渡护理。CMS Acute Hospital Care at Home
              (AHCAH) 豁免项目已在 Consolidated Appropriations Act of 2026 下延长至 2030 年 9 月；它是主要监管框架，界定 Medicare
              下哪些等同住院的居家护理可以获得报销。


              在这个宽框架内，DispatchHealth 主要竞争的是急性居家护理和居家医院子板块。它不同于非急性居家健康服务（专业护士上门、治疗、伤口护理），也不同于慢病管理（连续
              RPM、纵向复杂患者项目）。这些相邻板块——非急性居家健康服务（估算 $120 billion 市场）、慢病管理平台和远程患者监测——具有互补性，有时会被纳入广义居家医疗市场估算，推高标称 TAM。


              现状替代方案包括：住院入院（主要替代项）、急诊科就诊、专业护理机构（SNF）停留，以及较低病情严重度病例的门诊专科诊所。居家医院模式同时替代 SNF、住院停留和不必要的 ED
              就诊，从而捕捉价值。因此，市场边界必须排除常规居家健康上门服务（已经是单独的 CMS 福利）和纯远程医疗模式（没有实体护理交付）。这些相邻服务能与 DispatchHealth
              的临床指挥中心模式互补，但不能被其取代。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs: []
      - number: '2.2'
        title: 用多重视角测算 TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >-
              居家医院市场测算很难，因为不同分析报告的方法口径不一致。最宽口径会纳入完整的居家医疗连续体；窄口径只统计急性 H@H 收治。


              MarketsandMarkets 估计，居家医院子市场本身（不是更广义居家健康服务）在 2025 年全球规模约 $37.17 billion，预计到 2034 年 CAGR 为 7.8% 至
              11.9%。由此推算，到 2034 年全球可服务市场约 $60 billion 至 $80 billion，美国单独约 $25 billion 至 $35 billion。行业讨论中经常引用的 McKinsey
              分析估计，到 2025 年，当前在 Medicare 按服务收费场景中交付的护理最多有 $265 billion 可转移到居家场景；但这个 McKinsey 估算是最宽泛的解释，混合了远超急性 H@H
              的多类护理。


              DispatchHealth 的 SAM 更精确地由三者交集界定：(a) CMS AHCAH 豁免参与范围（截至 2024 年 4 月，37 个州、133 个医疗系统中的 320 家以上医院），(b)
              DispatchHealth 已运营市场（50 个都市区）中的商业保险和 Medicare Advantage 患者，(c) 临床上适合 H@H 的收治子集——通常估计为全部住院收治的 10% 至 20%。按
              AHRQ 数据，美国每年约 36 million 例住院，10% 临床适配下限意味着临床 TAM 约为每年 3.6 million 例合格收治。若每例 H@H 收治平均收入为 $3,000 至
              $6,000（低于住院成本），美国急性 H@H 平台 SAM 约为每年 $10 billion 至 $22 billion。


              DispatchHealth 的 SOM 锚定当前运营覆盖。2024 年公司在 50 个都市区完成约 2,000+ 例医院级收治。按每例 $3,000 至 $5,000 的估算平均收入，仅 H@H 带来的 SOM
              目前约 $6 million 至 $10 million，只占 SAM 极小一部分。公司 $257 million 至 $312 million
              的总收入估算，主要来自按服务收费的急诊替代就诊和过渡护理单次服务，这些服务的单次收入更低。合并 Medically Home 及其 55,000+ 例赋能平台收治后，合并实体的 SOM
              更有意义；不过这些收治由合作医疗系统推动，而不是 DispatchHealth 直接驱动。
