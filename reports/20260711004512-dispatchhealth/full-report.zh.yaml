      - number: '5.2'
        title: 技术架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 的技术栈最好拆成三层理解：现场硬件、临床软件，以及从 Medically Home 继承而来的指挥中心平台。

              现场硬件层面，每辆派诊车辆都搭载便携式 X 光、超声、POCUS 和 CLIA 移动实验室。CLIA
              认证（中等复杂度）是一项监管资质，让团队可以在现场完成原本需要医院实验室承担的检测。这不是软件，而是有资质背书的临床基础设施；没有实验室能力的竞争对手很难快速复制。派送到患者家中的医疗级设备（输液泵、监测设备、脉搏血氧仪、氧气）把硬件触角延伸到居家护理场景。

              临床软件层面，DispatchHealth 与合作医疗系统的 EHR 系统双向集成。患者接受治疗后，临床记录会回流到医疗系统病历中。这种集成既是运营必需品，也是留存机制：一家医疗系统一旦把
              DispatchHealth 嵌入 EHR 转诊流程，切换就意味着重新实施完整 EHR 集成，阻力很大。公司还提供远程医疗和虚拟护理能力，让远程医生在需要时监督现场团队接诊。

              指挥中心层是 Medically Home 合并带来的关键新增能力。Medically Home 开创了临床指挥中心模型：一个
              24/7、由医生主导的中枢，持续虚拟监督加入居家医院项目的患者。合并前，这一指挥中心模型已在 Mayo Clinic 和 Kaiser Foundation Hospitals
              获得验证。合并后，DispatchHealth 正在把指挥中心与自身现场派诊运营整合，打造管理层所称的居家复杂护理统一平台。

              公司材料称，AI 辅助分诊和临床决策支持工具支撑派诊路由和临床方案选择流程，但 AI 层的深度和具体性并未公开说明。DispatchHealth 已为 60+
              种疾病开发专有临床方案，这是一套编码化临床知识库，新进入者必须自建或授权取得。
