      - number: '2.3'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 的商业化路径是 B2B2C：主要买方是医疗系统和支付方（保险公司），患者是终端用户。这种双买方结构形成了不同的经济关系和采用路径。


              医疗系统采用居家医院主要出于三点：释放容量（在高住院普查期腾出住院床位）、留住收入（把患者留在体系内，而不是流向 SNF 或其他提供方），以及改善质量指标（H@H
              降低并发症、再入院和住院天数）。医疗系统买方通常是首席医疗官、人口健康 VP 或住院运营 VP。预算权掌握在 CFO 或系统 CEO 手中，用于资本密集型项目建设；技术供应商合同则可能由 CMO 掌握。


              支付方（Medicare Advantage 计划、商业保险公司、自保雇主）采用 H@H，是因为它能降低总护理成本。CMS AHCAH 豁免创建了一条 Medicare 按服务收费路径，按住院 DRG
              费率支付；Medicare Advantage 计划则单独谈判。Humana 和 Blue Shield of California 既是投资方，也是 DispatchHealth
              的支付方客户，说明该模式通过了支付方投资回报审查。


              Accountable Care Organizations (ACOs) 和承担风险的实体构成第三类买方：这些组织为总护理成本承担财务责任，因此有很强的经济动机，用 H@H 替代高成本住院。Medicare
              从按量付费转向价值型医疗，是结构性顺风。


              患者（终端用户）基本是被动采用者：他们通过保险公司的网络或医疗系统的转介路径接触 H@H。患者教育以及接受居家急性期护理的意愿是真实采用约束，老年患者和没有稳定居家环境的患者尤其如此。DispatchHealth
              声称的 98% 患者满意度虽然来自公司口径，但表明一旦护理可达，患者接受度较高。
            claimRefs:
              - CM013
