    summary: DispatchHealth 的风险图谱按可能性-影响矩阵映射。监管豁免依赖、报销费率风险和人手短缺优先级最高。临床质量失效和支付方兼投资人退出发生概率低，但影响灾难性。整合失败和 SVB 债务的可能性中等、影响重大。
    data:
      columns:
        - 中等影响
        - 重大影响
        - 灾难性影响
      rows:
        - label: 高可能性
          values:
            - 报销费率下调；州牌照审批延迟；MA 事前授权摩擦
            - 规模化后的临床人员短缺
            - （当前无）
        - label: 中等可能性
          values:
            - CEO 交接连续性；设备供应链；健康公平合规
            - 整合失败；SVB 债务重组；人员流失
            - CMS 豁免不续期（2030 年后）
        - label: 低可能性
          values:
            - 远程医疗回滚
            - HIPAA 执法；医疗体系自建项目替代
            - 规模化后的临床质量失效；支付方兼投资人双重角色冲突
    approximationNotes: 可能性和影响评级为分析师估算。DispatchHealth 未披露正式风险登记册或企业风险管理报告。
    claimRefs:
      - CR001
      - CR002
      - CR006
      - CR008
      - CR020
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: >-
      有向图展示 DispatchHealth 主要风险事件如何传导为运营和财务后果。CMS 豁免风险会导致服务量流失 → 收入压缩 → 资本消耗加速。人手短缺会导致市场进入延迟 → 地域扩张放慢。整合失败会导致平台成本重复 →
      单位经济性下降。SVB 债务风险会导致契约违约 → 流动性事件 → 被迫融资。
    approximationNotes: 传导路径是分析师根据公开披露中的结构性依赖推断；内部风险模型未公开。
    data:
      nodes:
        - id: waiver-risk
          label: CMS 豁免到期风险
        - id: rate-cut
          label: CMS 费率下调风险
        - id: staffing-shortage
          label: 人手短缺
        - id: integration-failure
          label: 整合失败
        - id: svb-debt
          label: SVB / 债务契约风险
        - id: payer-investor-exit
          label: 支付方兼投资人退出
        - id: volume-loss
          label: 服务量流失
        - id: margin-compression
          label: 利润率压缩
        - id: capital-burn
          label: 资本消耗加速
        - id: market-delay
          label: 新市场进入延迟
        - id: liquidity-event
          label: 被迫流动性事件
        - id: valuation-impact
          label: 估值减损
      edges:
        - from: waiver-risk
          to: volume-loss
        - from: rate-cut
          to: margin-compression
        - from: staffing-shortage
          to: market-delay
        - from: integration-failure
          to: margin-compression
        - from: svb-debt
          to: liquidity-event
        - from: payer-investor-exit
          to: volume-loss
        - from: volume-loss
          to: capital-burn
        - from: margin-compression
          to: capital-burn
        - from: market-delay
          to: valuation-impact
        - from: capital-burn
          to: liquidity-event
        - from: liquidity-event
          to: valuation-impact
    claimRefs:
      - CR001
      - CR006
      - CR008
      - CR014
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: >-
      DispatchHealth 的关键依赖关系。临床交付依赖急救医护 / 护士人力（外部劳动力市场）、EHR 集成（医疗体系技术）和 CMS AHCAH 豁免（联邦监管）。收入依赖企业支付方合同（Humana、Blue
      Shield、Optum 作为投资人兼客户）和医疗体系转诊关系。技术依赖指挥中心平台（Medically Home 集成）、移动诊断供应链和远程医疗平台。CMS 豁免以及投资人兼客户的支付方关系，单点失效风险最高。
    approximationNotes: 依赖关系根据公开商业模式描述和投资人公告推断；内部依赖架构和 SLA 未公开。
    data:
      nodes:
        - id: dispatchhealth
          label: DispatchHealth（合并后实体）
        - id: cms-waiver
          label: CMS AHCAH 豁免
        - id: humana
          label: Humana（投资人兼支付方）
        - id: blue-shield
          label: Blue Shield CA（投资人兼支付方）
        - id: optum
          label: Optum / UHG（投资人兼支付方）
        - id: mayo-kaiser
          label: Mayo Clinic / Kaiser（医疗体系）
        - id: nurse-workforce
          label: 护士 / 急救医护人力
        - id: ehr-systems
          label: Epic / Cerner / Meditech（EHR）
        - id: svb-debt
          label: SVB / First Citizens 债务融资额度
        - id: medically-home-tech
          label: Medically Home 指挥中心技术
      edges:
        - from: dispatchhealth
          to: cms-waiver
          label: HAC 收入授权
        - from: dispatchhealth
          to: humana
          label: MA 支付方转诊渠道
        - from: dispatchhealth
          to: blue-shield
          label: 商业支付方转诊渠道
        - from: dispatchhealth
          to: optum
          label: MA 支付方转诊渠道
        - from: dispatchhealth
          to: mayo-kaiser
          label: 医疗体系合作方转诊
        - from: dispatchhealth
          to: nurse-workforce
          label: 临床人员配置
        - from: dispatchhealth
          to: ehr-systems
          label: EHR 双向集成
        - from: dispatchhealth
          to: svb-debt
          label: 债务融资（状态不明）
        - from: dispatchhealth
          to: medically-home-tech
          label: 指挥中心集成（推进中）
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: kpi
    layout: standard
    summary: 支撑 DispatchHealth 投资建议的关键因素，以决策支持 KPI 面板呈现，覆盖市场、临床、监管、财务和整合维度，并给出最终建议输出。
    data:
      items:
        - label: 市场机会
          value: STRONG — $37B 2025 H@H market, 11.9% CAGR, McKinsey $265B TAM ceiling
        - label: 临床差异化
          value: STRONG — 8.5% readmission vs 15% national; 98% satisfaction; ACHC first accredited
        - label: 监管状态
          value: MODERATE — AHCAH extended to 2030, not permanent; Oct 2025 lapse precedent
        - label: 财务透明度
          value: WEAK — No disclosed P&L; $75M SVB debt unaddressed; burn rate unknown
        - label: 整合风险
          value: HIGH — Medically Home merger under financial distress; two-platform integration
        - label: 战略收购方兴趣
          value: HIGH — Optum, Humana, CVS all have strategic rationale for acquisition
        - label: 总体建议
          value: CONDITIONAL WATCH — Buy on CMS permanence confirmation at or below $3.7B
    approximationNotes: KPI 评级由分析师基于公开数据构建。内部风险管理或董事会层面的决策文件不可获得。
    claimRefs:
      - CV010
      - CV012
      - CV023
      - CV035
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 以不同收入倍数测算 DispatchHealth 隐含估值，并对标可比退出，显示当前 $3.7B 标记中嵌入的溢价。数值单位为 $M。
    data:
      items:
        - label: 1.5x 收入 — LHC Group 式居家医疗
          value: 420
        - label: 3x 收入 — Oak Street Health 退出倍数
          value: 840
        - label: 5x 收入 — Landmark Health 估算
          value: 1400
        - label: 8x 收入 — 高增长平台溢价
          value: 2240
        - label: 13x 收入 — 当前 Series E1 估值标记
          value: 3700
        - label: 7x 远期收入 — 乐观情景按 $800M 收入退出
          value: 5600
    approximationNotes: 收入由分析师估算，约 $280M；公司未披露。可比交易退出倍数见 TV004。数值单位为百万美元。
    claimRefs:
      - CV011
      - CV033
      - CV034
  - id: FV003
    title: 估值回报区间
    type: bar
    layout: standard
    summary: 测算 DispatchHealth 在乐观、基准和悲观情景下的退出回报区间，以 $3.7B Series E1 投后估值对应的隐含退出价值衡量。数值单位为 $M。
    data:
      items:
        - label: 悲观情景退出 — CMS 豁免永久失效
          value: 750
        - label: 当前 Series E1 投后入场点
          value: 3700
        - label: 基准情景退出 — 豁免续期但未永久化
          value: 5500
        - label: 乐观情景退出 — CMS 永久支付落地
          value: 10000
    approximationNotes: 退出价值仅为情景规划估算，并非财务预测。悲观情景反映仅急症护理的收入场景。乐观和基准情景假设 TV003 记录的 CMS 监管结果。
    claimRefs:
      - CV020
      - CV021
      - CV022
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投资人应跟踪这些关键绩效指标，以判断 DispatchHealth 投资逻辑在监管、临床、运营和财务维度上的健康度。
    data:
      items:
        - label: CMS 永久支付代码
          value: KEY CATALYST — Announcement would validate $3.7B+ valuation; expected 2027-2030
        - label: 患者转院率
          value: '7.2% current — WATCH: >10% signals declining clinical selection quality'
        - label: 30 天再入院率
          value: '8.5% reported vs 15% national — WATCH: rising rate signals case-mix deterioration'
        - label: 合并后人员稳定性
          value: '~985-1,200 (down from 1,500+) — WATCH: further decline signals integration stress'
        - label: 企业客户数
          value: '50+ current — TARGET: 100+ for revenue diversification sufficient for scale'
        - label: 运营州数
          value: '20+ current — TARGET: 35+ for national payer contract coverage requirements'
        - label: SVB 债务解决
          value: 'Not publicly disclosed — REQUIRED: resolution confirmation before Series F'
    approximationNotes: KPI 来自公司公开披露和分析师估算。管理层提供的预测或目标均未公开。
    claimRefs:
      - CV006
      - CV027
      - CV042
      - CV043
