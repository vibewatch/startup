      - number: '1.3'
        title: 融资历史、估值信号与投资方
        blocks:
          - type: paragraph
            body: >-
              自 2015 年种子轮以来，DispatchHealth 已通过多轮融资筹集约 $906.8 million。融资节奏随着居家医院市场的政策顺风而加速：2015 年 8 月完成 $3.6 million
              种子轮；2017 年初完成 $3.76 million Series A；2017 年 9 月完成 $32 million Series A 延伸轮（Alta Partners、Questa Capital 和
              US Acute Care Solutions 参与）；2019 年 5 月完成 $33 million Series B（Echo Health Ventures）；2020 年 6 月完成 $136
              million Series C（Optum Ventures 领投，Humana、Oak HC/FT、Echo Health Ventures 等参投）。


              Series D 轮把 DispatchHealth 推成医疗健康独角兽。Tiger Global Management 在 2021 年 3 月领投 $200 million，投后估值约 $1.7
              billion；Optum Ventures 在 2022 年 10 月领投第二笔 $259 million，Humana、Blue Shield of California、Adams Street
              Partners、Olayan Group、SVB 等跟投。2022 年 10 月融资同期开启了 SVB 和 K2 HealthVentures 提供的 $75 million 传统债务融资。


              2025 年 3 月，DispatchHealth 宣布完成 $160 million Series E1，投后估值 $3.7 billion——较 2021 年披露的投后估值翻倍以上，资本效率比约
              4x（估值相对累计融资）。Premier Alts 列示的 $3.7 billion 投后估值与该公告一致。Series E1 与 Medically Home
              合并公告同时发布，预计用于支持合并后公司的全国扩张。


              投资方名单在战略上高度一致：Humana 和 Blue Shield of California 既是投资方，也是向 DispatchHealth 转介患者的支付方；Optum Ventures 是
              UnitedHealth Group 的投资部门，而 UnitedHealth Group 本身就是主要支付方；Alta Partners 和 Echo Health Ventures
              则是专注医疗健康的基金。支付方与投资方重合降低了获客摩擦，但也带来需要尽调的潜在治理利益冲突。
