      - number: '8.6'
        title: 退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 有三条现实退出路径：被大型一体化付款方 / 提供方战略收购，在证明盈利能力后传统 IPO，或继续私有增长并融资夹层轮或 Series F 轮。最可能的是战略收购方：Optum
              已拥有做纵向居家护理的 Landmark Health，可能收购 DispatchHealth 补上急性 / 阶段性护理；Humana 既是投资人，也是拥有 12M+ Medicare Advantage
              会员的付款方；CVS Health 收购 Oak Street 显示其愿意支付溢价倍数。IPO 至少需要两到三年披露财务和清晰的运营盈利路径。考虑到 Medically Home 整合复杂、财务未披露，2026
              年或 2027 年 IPO 可能性不高。结构化尽调流程应优先关注：（1）经审计财务和各服务线单位经济；（2）SVB/First Citizens 债务融资条款；（3）Medically Home
              收购价分摊和商誉；（4）董事会构成和治理；（5）CMS 永久支付代码立法策略；（6）企业客户合同期限分布。ACHC 认证和 1.2M+ 患者历史是真正的退出准备度加分项，但财务不透明仍是机构资本以 $3.7B
              估值投入的主要摩擦。
