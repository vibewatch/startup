  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重性排序
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 最严重的风险，是其对 CMS Acute Hospital Care at Home 豁免有时限依赖。该豁免通过 2026 年《Consolidated Appropriations
              Act》延长至 2030 年 9 月 30 日，支持为在家提供的医院级护理支付 Medicare 和 Medicare Advantage 报销。没有永久支付代码，HAC 服务线收入流在 2030
              年前还需要再次立法延长。2025 年 10
              月短暂停摆——在国会延长豁免之前——已经证明这种脆弱性：哪怕很短的授权缺口，也会冻结新护理事件启动，并立即打乱运营。次级严重风险包括临床人员短缺（全国护士和急救医护人员劳动力约束限制新市场扩张）、DispatchHealth
              的 $75M Silicon Valley Bank 债务融资状态未决（SVB 2023 年 3 月倒闭），以及吸收 Medically Home 的财务整合复杂度——这家公司在合并完成前曾需要投资人兼客户
              Mayo Clinic 和 Kaiser Foundation Hospitals 提供紧急资本。以下每项风险均按发生概率和财务影响评级。
            claimRefs: []
