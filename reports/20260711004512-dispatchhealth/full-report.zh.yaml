    type: pyramid
    layout: standard
    summary: >-
      居家医院市场的可触达机会分为三层：最高层是把护理转移到家庭的理论上限（McKinsey $265B），最低层是当前可报销且运营已验证的细分市场（美国急性 H@H 子市场，约 $12B-$15B）。DispatchHealth
      位于 SAM 的中间层。
