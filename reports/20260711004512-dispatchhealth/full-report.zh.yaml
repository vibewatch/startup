  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层——谁付费、谁使用、如何互动
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 的客户群分为两类主要企业买家和两类终端用户。企业买家是医疗系统和付款方。医疗系统与 DispatchHealth
              签约，为本来会去急诊科或住院部的患者提供按需居家护理；付款方式结合按人头的价值医疗安排和直接按服务收费的转诊模式。付款方主要是 Medicare Advantage 计划、商业保险公司和 Medicaid
              管理式护理组织，它们直接或通过承担风险的提供方关系与 DispatchHealth 签约，以降低急性护理事件的单会员成本。

              终端用户是患者（直接护理接受者）和转诊临床人员（医生、个案经理、护理协调员）。患者不直接向 DispatchHealth 付费——他们使用既有保险覆盖，大多数情况下 DispatchHealth
              在网内。转诊临床人员通过 EHR 转诊工作流或直接联系派诊呼叫中心与 DispatchHealth 互动。

              DispatchHealth 的战略投资人同时也是客户：Humana 投资了 DispatchHealth，本身又是大型 Medicare Advantage
              付款方，对能降低医院成本的居家护理天然经济一致。Blue Shield of California 投资了公司，也是 DispatchHealth 加州市场的企业付款方。Optum
              Ventures（UHG）投资，公司 OptumHealth 的临床项目构成潜在转诊渠道。这些投资人兼客户关系降低独立获客成本，但也带来集中度风险；如果付款方关系恶化，还可能产生利益冲突场景。

              地理分层覆盖合并后的 50+ 个主要都会区，主要集中在派诊经济性最有利的高密度市场。DispatchHealth 在 20+ 个州运营，企业合同要求最低市场密度，才能维持临床团队利用率。公司瞄准 Medicare
              Advantage 渗透率高的市场，因为付款方最有财务动机避免基于机构的护理。
