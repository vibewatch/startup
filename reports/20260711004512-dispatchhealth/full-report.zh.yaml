  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 扩张驱动
      - 集中度风险
      - 影响
      - 尽调路径
    rows:
      - - 向新都市市场扩张（合并后 50 个都市圈基线）
        - 每个新市场达到使用率盈亏平衡前都需要资本投入
        - 若全国覆盖落地，上行空间高；若市场达不到最低服务量，成本也高
        - 要求提供单市场单位经济模型和盈亏平衡最低服务量门槛。
      - - 服务线扩张：现有医疗系统合作伙伴在初始 ER 替代合同后增加 HAC
        - HAC 需要 AHCAH 豁免；并非所有医疗系统合作伙伴都有或寻求该豁免
        - HAC 单次服务收入是 ER 替代的 2–3 倍；推高单合同收入
        - 要求提供 ER 替代合作伙伴的 HAC 采用率；确认哪些合作伙伴拥有 AHCAH 豁免。
      - - 支付方渠道加深：增加 Medicaid 管理式医疗和更多商业计划
        - Medicaid 管理式医疗报销率显著低于 MA 或商业保险
        - 扩大可触达人群；但 Medicaid 占比上升会压缩利润率
        - 要求按收入档提供支付方结构，并提供 Medicaid 报销率基准。
      - - 投资方—客户集中（Humana、Blue Shield CA、Optum/UHG）
        - 三大投资方同时也是支付方客户；如果经济利益分歧，可能产生冲突
        - 失去任何投资方—支付方关系都会影响转诊量和股权位置
        - 要求提供前五大支付方客户收入集中度；确认投资方合同与支付方合同的利益一致性。
      - - Contessa Health（Amedisys）JV 模式与 DispatchHealth 管理服务模式
        - 部分医疗系统更偏好 JV（持股）而非完全外包模式
        - DispatchHealth 可能输掉偏好 JV 的医疗系统潜在客户；Contessa 是直接竞争对手
        - 要求提供 Contessa 进入最终名单的企业 RFP 胜负数据。
    notes: 扩张驱动和集中度风险根据公开商业模式描述推断；具体合同条款未公开。
    claimRefs:
      - CU006
      - CU007
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
