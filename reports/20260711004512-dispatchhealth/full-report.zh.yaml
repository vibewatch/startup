  - id: TM001
    title: 市场定义表
    columns:
      - 市场分段
      - 范围 / 定义
      - DispatchHealth 角色
      - 排除的相邻领域
    rows:
      - - 居家住院（急性 H@H）
        - 在患者家中交付等同住院的护理；需 CMS AHCAH 豁免或支付方等效授权
        - 核心产品——直接护理交付（ER 替代 + HAC）和赋能平台（Medically Home）
        - 常规居家健康上门；仅 RPM 平台
      - - 急诊替代（ER 分流）
        - 在家提供急性病级别的急诊评估和治疗，避免急诊科就诊
        - 核心产品——直接护理团队
        - 仅远程医疗分诊；步入式紧急护理
      - - 过渡期 / 急性期后护理
        - 出院后 30 天内提供支持，防止再入院
        - 核心产品——过渡期护理随访
        - 长期居家健康（非急性）；SNF 康复
      - - 更广义居家医疗
        - 非急性专科护理、治疗、伤口护理、慢病管理
        - 相邻领域；不是 DispatchHealth 的直接模式
        - DispatchHealth 的全部急性服务
      - - 医院容量 / 床位替代
        - 用虚拟医院床位替代住院床位，缓解住院床位占用压力
        - 由 Medically Home 赋能、通过合作健康系统提供的 HAC
        - 择期手术恢复；输注治疗
    notes: 不同分析师报告对市场定义并不一致；本表与 CMS AHCAH 豁免范围及 DispatchHealth 公开披露的三条服务线对齐。 更广义的居家健康市场（~$120B-$222B）属于相邻市场，不是核心 H@H 市场。
  - id: TM002
    title: TAM/SAM/SOM 或规模测算口径表
    columns:
      - 口径
      - 估算
      - 范围
      - 方法 / 来源
      - 可靠性
    rows:
      - - 全球 H@H 市场（急性子分段）
        - $37.17B (2025)
        - 全球
        - MarketsandMarkets：到 2034 年 CAGR 为 7.8-11.9%
        - 分析师估算；方法论未公开
      - - McKinsey 美国 Medicare 转移潜力
        - 最高 $265B
        - 仅美国 Medicare
        - 从按服务付费体系转移护理的最大理论空间
        - “天花板”思想实验；不是可执行 TAM
      - - 美国 SAM（临床适用性 x DRG 平价）
        - $10B-$22B/年
        - 美国急性 H@H 适用入院（~3.6M）
        - 36M 次美国住院的 10% × 每例 $3K-$6K（AHRQ 基数，DRG 类比）
        - 内部估算；不确定性区间很宽
      - - 行业前瞻估算（2028）
        - ~$300B（广义居家健康服务）
        - 美国居家医疗连续体
        - DispatchHealth / Medically Home 合并公告引用
        - 宣传口径；混合了多个子市场
      - - DispatchHealth 可获取市场（SOM，2026）
        - $257M-$312M（所有服务线）
        - 美国 50 个都会区已运营
        - 第三方聚合平台估算（Compworth、ZoomInfo）
        - 模型推算；非已验证财务数据
      - - Chilmark H@H 可服务市场（2026）
        - 项目数到 2026 年可能翻倍
        - 美国参与 AHCAH 豁免的医院
        - Chilmark Research H@H 报告（延期后分析）
        - 定性方向判断；不是收入估算
    notes: >-
      任何测算口径都不能当作定论。MarketsandMarkets 的 $37B 数字引用最频繁，但覆盖的是全球 H@H；仅美国部分约为 $12B-$15B。McKinsey 的 $265B 用于框定总体机会，不是近期收入
      TAM。所有估算的不确定性区间都很宽；本表只应用来做方向性框架。
