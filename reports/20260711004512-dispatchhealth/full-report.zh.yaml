      - number: '6.2'
        title: 采用轨迹与具名客户证明
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 的采用轨迹由公司披露指标记录，并得到外部来源的部分佐证。2013 年以来累计服务 1.2M+ 名患者，代表累计需求。50+
              家企业客户（医疗系统和付款方）是最新客户数量说法，并由合并后新闻稿支持。合并完成前，Medically Home 部分通过其指挥中心模型及与 Mayo Clinic、Kaiser Foundation
              Hospitals 的合作，已服务 55,000+ 名患者。

              通过公开来源确认的具名医疗系统合作伙伴，包括合并新闻稿和新闻报道提到的组织：Scripps Health、Trinity Health 以及其他区域性一体化交付网络出现在合作伙伴语境中。Medically
              Home 合并前合作伙伴名单包括 Mayo Clinic 和 Kaiser Foundation Hospitals，它们既是技术合作伙伴，也是合并前为维持公司运营提供资本注入的投资人。

              付款方渠道通过投资人名单得到记录。Humana 和 Blue Shield of California 的投资，构成有文件支持的企业付款方关系。Optum Ventures 的参与连接到 UnitedHealth
              Group 的商业保险覆盖基础，这是 DispatchHealth 最大的潜在商业付款方转诊来源。

              AHA 报告称，截至 2024 年 4 月，37 个州、133 个医疗系统内的 320+ 家医院已获 CMS AHCAH 批准——这是 DispatchHealth HAC
              项目的可服务市场。DispatchHealth 目前触达 40+ 家医疗系统合作伙伴，约等于 AHCAH 已批准医院宇宙的 30% 渗透率，但并非所有 320+ 家医院都适合同一种企业合同模式。

              Rock Health 对居家医院商业模式的分析验证了，只要临床与财务论据足够有说服力，医疗系统愿意为外部运营的居家项目付费；DispatchHealth 的结果数据支撑其企业销售的经济论据。
