      - number: '8.4'
        title: 牛市 / 基础 / 熊市情景分析
        blocks:
          - type: paragraph
            body: >-
              三种情景都取决于同一个监管铰链：CMS 是否在 2030 年 9 月之前或之后，把 AHCAH 豁免转化为永久预期支付费率。牛市情景中，CMS 在 2027-2028 年宣布永久居家医院支付代码，验证
              McKinsey 估计的完整 $265B TAM；DispatchHealth 到 2030 年拿下可服务市场 10%-15%，收入达到 $800M-$1B，并以 7-8x 远期收入通过战略收购退出——对应
              $8-12B 估值。基础情景中，豁免在 2030 年再次续期，但没有永久化，增长维持，但持续不确定性把估值上限压在 4-5x 远期收入——意味着 2028-2030 年退出价值 $4-7B。熊市情景中，CMS
              豁免续期永久失败，HAC 收入消失，而它估计代表 60%-70% 护理事件经济性。DispatchHealth 只剩急诊护理替代收入，将支撑低于 $1B 的估值。2025 年 10
              月停摆事件——即便短暂——证明这一风险真实且二元。相对 $3.7B 进入价格，牛市上行不对称；熊市下行则是灾难性的。
