      - number: '2.5'
        title: 测算缺口、矛盾与尽调含义
        blocks:
          - type: paragraph
            body: >-
              居家医院市场有三项主要测算矛盾，增加了投资论证承销难度。


              第一，分析机构给出的标称 TAM（$37 billion 到 $265 billion）不可直接比较，因为它们反映的是完全不同的市场定义。MarketsandMarkets 的 $37
              billion（2025）统计全球急性 H@H 板块；McKinsey 的 $265 billion 是一个仅限美国的思想实验，投射所有 Medicare 场景中理论上最多可迁至居家的护理。把 McKinsey
              数字当作急性 H@H 平台提供商的可服务市场，会产生误导。


              第二，CMS AHCAH 豁免只覆盖 Medicare 按服务收费受益人。Medicare Advantage (MA) 注册人数如今超过全部 Medicare 受益人的 54%（KFF，2024）；MA
              计划会与 H@H 提供方单独谈判报销费率，且没有全国性要求强制 MA 计划按服务收费同等水平覆盖 H@H 服务。这给市场中由支付方资助的部分带来显著覆盖和定价不确定性。


              第三，H@H 合格患者比例存在争议。CMS 在 AHCAH 豁免期间（2021 年 11 月至 2023 年 3 月）的数据显示，7.2%
              的患者会转回传统住院场景，说明临床风险分层挑战真实存在。学术研究（Mass General Brigham、Johns Hopkins）显示，精挑患者后结果有利，但各项目筛选标准不同，使汇总 TAM 计算不可靠。


              对 DispatchHealth 来说，前瞻 SOM 取决于医疗系统签约速度、Medicare Advantage 报销谈判结果，以及 Medically Home
              技术整合能否成功。第三方收入估算（2025-2026 年 $257 million 至 $312 million）来自模型而非验证；实际收入可能出现重大偏离。
            claimRefs:
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: CMS 豁免延长五年，移除了 H@H 运营商的主要政策风险
            body: >-
              Consolidated Appropriations Act of 2026 将 CMS AHCAH 豁免延长至 2030 年 9 月 30
              日——这个五年窗口给了医疗系统和支付方投资居家医院基础设施所需的确定性。2025 年 10 月豁免短暂失效时曾导致项目冻结；延期后，监管风险大幅下降。DispatchHealth
              是该豁免生态中最大的运营商之一，拥有 ACHC 认证并积极参与项目。
            calloutType: strength
            claimRefs:
              - CM019
              - CM022
          - type: callout
            title: Medicare Advantage 报销缺口是最重大的未解市场风险
            body: >-
              Medicare Advantage 现在覆盖全部 Medicare 受益人的 54% 以上，但 MA 计划不必按服务收费同等水平报销 H@H。这形成了碎片化支付方格局：DispatchHealth 必须在其
              50 个都市区覆盖范围内逐一谈判 MA 合同，费率和覆盖政策都会变化。风险在于，MA 计划为降低成本而压缩利润率或限制覆盖，抵消按服务收费豁免 扩张带来的增长顺风。
            calloutType: risk
            claimRefs:
              - CM026
              - CM027
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 所处竞争格局较为分散，横跨四类玩家：(1) 以在家提供急性期护理为核心服务的直接同行；(2) 运营自有居家医院项目的存量医疗系统；(3)
              与医疗系统合作而非直接交付护理的技术赋能平台；(4) 相邻和替代提供方，包括专业护理机构、门诊急诊护理和远程医疗平台。


              2021–2022 年的市场整合缩小了可比同行集合：Contessa Health 于 2021 年以 $250 million 被 Amedisys 收购，Landmark Health 于 2021 年被
              OptumHealth (UHG) 收购。Medically Home 曾是最直接对标 DispatchHealth 合并后模式的技术赋能竞争对手，已在 2025 年 5 月与 DispatchHealth
              合并。这些退出让独立运营商阵营明显收窄。


              对 DispatchHealth 最重大的竞争威胁并非来自独立同行，而是大型存量医疗系统在 CMS AHCAH 豁免下自建居家医院项目。Mass General Brigham Healthcare at
              Home、Mount Sinai at Home 和 UPMC at Home
              都已开发内部项目，在各自市场拥有强医生转介渠道和品牌资产。这些系统不需要向外部平台签约——它们代表了“内部自建”这个竞争替代项，会挤掉 DispatchHealth 的赋能模式。


              合并后的 DispatchHealth-Medically Home 实体同时覆盖直接护理交付和医疗系统赋能技术，使其成为该领域能力最宽的平台。不过，这种宽度也带来整合风险和更高运营复杂度。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
