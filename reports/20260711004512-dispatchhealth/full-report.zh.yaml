      - number: '8.3'
        title: 融资背景、进入纪律与稀释
        blocks:
          - type: paragraph
            body: >-
              Series E1 轮（$160M，2025 年 3 月）由现有投资人领投，Humana 和 Blue Shield of California 继续参与，Optum Ventures（UnitedHealth
              Group 关联方）也在其中。已披露累计融资为 $906.8M，意味着资本效率倍数为 4.04x（投后估值 / 累计资本）。按 $3.7B 投后估值估算，所有轮次投资人合计持股在 25%-35%
              区间，管理层、早期员工和创始人仍保留大量股权。最初由 Silicon Valley Bank（2023 年 3 月倒闭）提供的 $75M 债务融资没有公开说明。如果 First Citizens Bank（SVB
              收购方）维持该融资，债务服务就是持续固定义务，会降低自由现金流。$3.7B 的 Series E1 是最新定价锚；任何低于 $3.7B 的新轮次或二级交易都会成为估值下调轮。PremierAlts 和
              CompWorth 的二级市场定价确认 $3.7B 投后估值是当前标记，PitchBook 和 Tracxn 数据也一致。进入纪律应包括要求披露经审计的过去 12 个月财务、SVB 债务状态，以及
              Medically Home 收购价分摊，再按当前估值投入。战略投资人兼客户一致性——Humana、Blue Shield of California 和 Optum
              Ventures——带来治理张力；如果任何投资人付款方行使战略阻止权，退出谈判可能变复杂。
