  figureRefs: []

- id: feature-and-capability-comparison
  title: "Feature, capability, and pricing comparison"
  body: >-
    DispatchHealth is the only operator in the field that publicly claims all three core service
    lines simultaneously: ER-alternative care, Hospital-Alternative Care (HAC), and Transitional
    Care. The ACHC In-Home Hospital Care Accreditation (first-ever, November 2024) provides an
    external quality signal that no competitor currently holds.


    Contessa's JV model focuses on HAC and some transitional care but does not offer ER-alternative
    triage at scale. Landmark's model covers longitudinal chronic care rather than episodic acute
    care. Biofourmis is a software platform and lacks direct care delivery. Inbound Health covers
    HAC through health system partners. Current Health is RPM-only.


    On pricing, all competitors operate on fee-for-service reimbursement through payers or DRG-
    equivalent reimbursement through the CMS AHCAH waiver. Exact contract pricing is proprietary
    for all players. DispatchHealth's revenue-per-episode is estimated to be in the range of
    $1,500 to $5,000 depending on service line and payer, based on analyst estimates and published
    cost-savings data. No independent pricing database exists for this sector.


    Distribution is a key differentiator. DispatchHealth has 40 health system enterprise contracts,
    50-metro coverage, and payer-investor partnerships (Humana, Blue Shield of California, Optum)
    that create referral pipelines competitors cannot easily replicate. This investor-payer alignment
    constitutes one of DispatchHealth's most durable competitive advantages.
  claimRefs:
  - CP011
  - CP012
  - CP013
  - CP014
  - CP015
