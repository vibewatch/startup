callouts:
- calloutType: strength
  title: DispatchHealth is the only national platform combining full-stack acute care delivery with technology enablement
  body: >-
    No competitor currently combines emergency-alternative care, hospital-level HAC, transitional care,
    a clinical command center, mobile diagnostics, and ACHC accreditation at national scale. The
    post-merger entity with Medically Home uniquely spans both direct care delivery (to patients)
    and technology enablement (for health systems), creating a platform that health systems can
    contract for either or both models. This is a structural differentiation that Contessa, Biofourmis,
    and Landmark individually cannot replicate without major investment.
  claimRefs:
  - CP011
  - CP012

- calloutType: risk
  title: The internal-build threat from large health systems is the most underappreciated competitive risk
  body: >-
    Mass General Brigham, UPMC, Mayo Clinic, and Kaiser -- all large systems with substantial capital
    and physician referral networks -- have chosen to build proprietary H@H programs rather than
    contract DispatchHealth. This internal build dynamic is enabled by the CMS AHCAH waiver (which
    any eligible hospital can access) and by standardization of RPM and telehealth technology. If the
    internal-build trend accelerates, DispatchHealth's addressable market of health system enterprise
    contracts could shrink materially, particularly in markets where large self-sufficient systems
    dominate.
  claimRefs:
  - CP003
  - CP022
  - CP023

