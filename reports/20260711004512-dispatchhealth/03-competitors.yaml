- id: switching-costs-and-moat
  title: "Switching costs, lock-in, and competitive moat"
  body: >-
    DispatchHealth's competitive moat has three primary components: operational infrastructure,
    payer-investor alignment, and regulatory certification.


    The operational infrastructure moat is real but not impenetrable. Building a hospital-at-home
    platform requires clinical command center technology, mobile diagnostic equipment (X-ray,
    ultrasound, CLIA-certified mobile lab), trained acute-care nursing staff, logistics networks
    for last-mile delivery, and EHR integration with partner health systems. Each of these
    represents a meaningful barrier to entry for a new competitor, and building them takes 2-4
    years of capital investment. However, the post-merger integration of Medically Home's
    technology into DispatchHealth introduces execution risk that could partially erode this moat
    if the integration is slow or problematic.


    The payer-investor moat is stronger and more durable. Humana, Blue Shield of California, and
    Optum are simultaneously investors and payer customers. These relationships provide referral
    pipelines that are effectively exclusive for DispatchHealth within those payer networks.
    A competing H@H operator would need to independently negotiate payer contracts across dozens
    of major insurers, a process that takes 6-18 months per payer and is competitive.


    ACHC accreditation (first-ever, November 2024) creates a trust signal and quality standard
    that payers and health systems increasingly require for program certification. This will be
    replicated by competitors over time but provides a 12-24 month first-mover advantage.


    Switching costs for health systems are moderate-to-high: changing from DispatchHealth to
    another platform requires re-integrating EHR connections, retraining staff, renegotiating
    payer contracts, and potentially dissolving JV structures. This creates meaningful lock-in
    for existing enterprise customers.
  claimRefs:
  - CP016
  - CP017
  - CP018
  - CP019
  - CP020
  tableRefs: []
  figureRefs:
  - FP003

- id: moat-durability-and-risk
  title: "Moat durability, commoditization risk, and adverse competitor signals"
  body: >-
    The hospital-at-home sector faces a long-term commoditization risk from three directions:
    regulatory standardization, technology commoditization, and health system vertical integration.


    Regulatory standardization: the CMS AHCAH waiver creates uniform coverage criteria that any
    hospital can use. As more health systems build proprietary programs, the enablement platform
    becomes less differentiated. The waiver extension to 2030 is both a tailwind (certainty for
    existing platforms) and a risk (normalizes the market, enabling more internal build decisions).


    Technology commoditization: Medically Home's clinical command center technology, once a
    proprietary differentiator, is now being absorbed into DispatchHealth's platform. Meanwhile,
    competing RPM and telehealth platforms (Biofourmis, Current Health) are improving clinical
    capabilities and could eventually offer comparable command center functionality at lower cost.


    Health system vertical integration: large systems like Mass General Brigham, UPMC, and
    Mayo Clinic have opted to build proprietary H@H programs rather than contract an external
    platform. This "internal build" trend could intensify if the technology and operational
    components become sufficiently standardized.


    Adverse signals: the Medically Home merger itself surfaced a cautionary signal. Home Health
    Care News reported (June 2025) that a leaked internal document described Medically Home's
    "dramatic" valuation drop and reliance on cash infusions from Mayo Clinic and Kaiser before
    the merger. This suggests that the H@H enablement model is harder to monetize than expected
    at scale, and that DispatchHealth's combined platform faces profitability headwinds from the
    technology-enablement component.
  claimRefs:
  - CP021
  - CP022
  - CP023
  - CP024
  - CP025
  tableRefs:
  - TP004
  figureRefs: []

