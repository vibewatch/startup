sections:
- id: competitive-landscape
  title: "Competitive landscape overview"
  body: >-
    DispatchHealth operates in a fragmented competitive landscape that spans four distinct categories:
    (1) direct peers that provide acute-level care at home as a primary service, (2) incumbent health
    systems that operate proprietary hospital-at-home programs, (3) technology-enablement platforms
    that partner with health systems rather than delivering care directly, and (4) adjacent and
    substitute providers including skilled nursing facilities, outpatient urgent care, and telemedicine
    platforms.


    The market consolidation phase of 2021-2022 reduced the competitive peer set: Contessa Health
    was acquired by Amedisys for $250 million in 2021, and Landmark Health was acquired by
    OptumHealth (UHG) in 2021. Medically Home, the most direct technology-enablement competitor to
    DispatchHealth's post-merger model, merged with DispatchHealth in May 2025. These exits narrowed
    the independent operator field considerably.


    The most significant competitive threat to DispatchHealth is not from independent peers but from
    large incumbent health systems building proprietary hospital-at-home programs under the CMS AHCAH
    waiver. Mass General Brigham Healthcare at Home, Mount Sinai at Home, and UPMC at Home are among
    the systems that have developed internal programs with strong physician referral channels and
    brand equity in their markets. These systems do not need to contract an external platform—they
    represent the "internal build" competitive substitute that displaces DispatchHealth's
    enablement model.


    The combined DispatchHealth-Medically Home entity now spans both direct care delivery and
    health-system enablement technology, positioning it as the broadest-capability platform in the
    space. However, this breadth creates integration risk and increased operational complexity.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  tableRefs:
  - TP001
  figureRefs:
  - FP001

- id: competitor-profiles
  title: "Competitor profiles and strategic positioning"
  body: >-
    Contessa Health, acquired by Amedisys for $250 million in 2021, operates a joint-venture model
    with hospital partners to provide hospital-at-home services. Contessa had established more than
    10 health system JV relationships before the acquisition. Under Amedisys (itself being acquired
    by UnitedHealth Group in a deal that has faced regulatory scrutiny), Contessa's model is being
    integrated into Amedisys's broader home health portfolio. Contessa is the most directly comparable
    JV-enablement competitor; its acquisition by Amedisys provides it with operational scale but also
    creates strategic uncertainty during a period of Amedisys/UHG merger integration.


    Landmark Health was acquired by OptumHealth (UHG subsidiary) in 2021 for an undisclosed amount.
    Landmark's model focuses on longitudinal home-based primary care for complex chronic patients
    rather than episodic acute care substitution. Its integration into Optum provides massive
    distribution reach but repositions it away from acute H@H toward chronic care management. Optum
    (through both Landmark and Optum Ventures) is an investor in DispatchHealth, creating a dual
    investor-competitor dynamic worth flagging.


    Biofourmis is an AI-powered remote patient monitoring and care management platform that competes
    with the technology layer of DispatchHealth's clinical command center. Biofourmis has raised
    over $300 million in venture funding and serves health systems with RPM and predictive analytics
    tools. Its model is software-centric rather than direct-care, making it a complementary partner
    for some health systems and a partial substitute for others.


    Inbound Health, based in Minneapolis, is a smaller H@H enablement company operating primarily
    in partnership with regional health systems. It has less scale than DispatchHealth but targets
    a similar market with a health-system JV model. Inbound Health has limited public financial
    disclosure and its scale is not independently verified.


    Current Health was acquired by Best Buy in 2021 as part of the retailer's health strategy; it
    operates as Best Buy Health's remote patient monitoring platform. Its model is RPM-centric with
    low clinical acuity coverage, making it a partial substitute for DispatchHealth's transitional
    care and outpatient monitoring workflows.
  claimRefs:
  - CP005
  - CP006
  - CP007
  - CP008
  - CP009
  - CP010
