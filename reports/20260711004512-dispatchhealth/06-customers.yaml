  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - expansion driver
      - concentration risk
      - impact
      - diligence path
    rows:
      - - Geographic expansion to new metro markets (post-merger 50-metro baseline)
        - Each new market requires capital investment before achieving utilization breakeven
        - High upside if national coverage achieved; high cost if markets fail to reach minimum volume
        - Request per-market unit economics and minimum volume threshold for breakeven.
      - - "Service line expansion: existing health system partners adding HAC after initial ER-alternative contract"
        - HAC requires AHCAH waiver; not all health system partners have or seek the waiver
        - HAC has 2-3x higher revenue per episode vs ER-alternative; drives revenue per contract up
        - Request HAC adoption rate among ER-alternative partners; confirm which partners have AHCAH waiver.
      - - "Payer channel deepening: adding Medicaid managed care, additional commercial plans"
        - Medicaid managed care reimbursement rates are materially lower than MA or commercial
        - Broadens addressable population but compresses margin if Medicaid share grows
        - Request payer mix by revenue band and Medicaid reimbursement rate benchmarks.
      - - Investor-customer concentration (Humana, Blue Shield CA, Optum/UHG)
        - Three of the largest investors are also payer-customers; potential conflict if economic interests diverge
        - Loss of any investor-payer relationship would affect both referral volume and equity position
        - Request revenue concentration by top-5 payer customers; confirm alignment of investor and payer contracts.
      - - Contessa Health (Amedisys) JV model vs DispatchHealth managed services model
        - Some health systems prefer JV (ownership stake) over fully outsourced model
        - DispatchHealth may lose health system prospects who prefer JV; Contessa is direct competitor
        - Request win-loss data for enterprise RFPs where Contessa was a finalist.
    notes: Expansion drivers and concentration risks are inferred from public business model description; specific contract terms are not public.
    claimRefs:
