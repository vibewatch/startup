callouts:
  - calloutType: strength
    title: Investor-customers create high-value enterprise relationships with aligned economic incentives
    body: >-
      Humana, Blue Shield of California, and Optum Ventures invested in DispatchHealth because in-home care
      reduces their medical loss ratios. This alignment means payer-investors have a financial incentive to
      maximize DispatchHealth patient referrals, which is a powerful customer acquisition and retention mechanism.
    claimRefs:
      - CU005
      - CU006
      - CU007
  - calloutType: risk
    title: Medically Home financial distress reveals fragility in named health system customer relationships
    body: >-
      Mayo Clinic and Kaiser Foundation Hospitals provided emergency capital to prevent Medically Home's failure
      before the merger — they were lenders/rescuers, not just satisfied customers. This signals that at least
      two anchor customers had significant concerns about Medically Home's viability but chose rescue over
      replacement, likely because switching would be disruptive to their own programs.
    claimRefs:
      - CU014
