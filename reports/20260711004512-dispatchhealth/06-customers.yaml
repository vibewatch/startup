  - id: section-2
    title: Adoption trajectory and named customer proof
    body: >-
      DispatchHealth's adoption trajectory is documented through company-reported metrics that are partially
      corroborated by external sources. The 1.2M+ total patients served since 2013 represents cumulative
      demand. The 50+ enterprise customers (health systems and payers) is the most current customer count
      claim, supported by the post-merger press release. The Medically Home component added 55,000+ patients
      served through its command center model and partnerships with Mayo Clinic and Kaiser Foundation Hospitals
      before the merger closed.

      Named health system partners that are confirmed through public sources include organizations referenced
      in merger press releases and news coverage: Scripps Health, Trinity Health, and other regional integrated
      delivery networks appear in partner context. Medically Home's pre-merger partner list included Mayo Clinic
      and Kaiser Foundation Hospitals as both technology partners and investors who provided capital infusions
      to keep the company operational before the merger.

      The payer channel is documented through the investor roster. Humana's investment and Blue Shield of
      California's investment create documented enterprise payer relationships. Optum Ventures' participation
      links to UnitedHealth Group's commercial coverage base, which is DispatchHealth's largest potential
      commercial payer referral source.

      The AHA reported 320+ hospitals in 133 health systems across 37 states had been approved for CMS AHCAH
      by April 2024 — this is the addressable universe for DispatchHealth's HAC program. DispatchHealth
      currently reaches 40+ health system partners, representing roughly 30% penetration of the AHCAH-approved
      universe, though not all 320+ hospitals are candidates for the same enterprise contract model.

      The Rock Health analysis of hospital-at-home business models validates that health systems are willing
      to pay for externally operated at-home programs when the clinical and financial case is compelling, and
      DispatchHealth's outcomes data supports the economic argument for enterprise sales.
