  evidenceGaps:
    - type: missing-source
      severity: material
      topic: named-customer-proof-enumeration-completeness
      missingEvidence: >-
        The named customer proof table (TU003) covers only 6 of DispatchHealth's 40+ health system
        and 50+ enterprise customers. The majority of customer relationships are not individually
        disclosed in public sources. No independent case studies, G2/Capterra reviews, or health
        system CIO/CMO testimonials have been found for non-investor partners.
      whyItMatters: >-
        A partial named customer list conflates investor-customers (Humana, Blue Shield, Mayo, Kaiser)
        with purely commercial customers, making it difficult to assess whether enterprise adoption is
        driven by financial relationships or genuine clinical value. A complete customer list with
        independent testimonials is needed for full diligence.
      diligencePath: >-
        Request a complete enterprise customer list; obtain 5 reference customers who are non-investor
        health systems; search for any health system CIO/CMO public statements about DispatchHealth.
      relatedTableRefs:
        - TU003
      relatedQuestionRefs:
        - QU021
        - QU023

    - type: private-evidence-only
      severity: blocking
      topic: enterprise-retention-metrics
      missingEvidence: >-
        DispatchHealth has not published enterprise customer retention metrics: net revenue retention, gross
