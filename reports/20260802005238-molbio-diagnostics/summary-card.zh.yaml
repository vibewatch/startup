  topStrengths:
    - 便携式 Truenat 工作流更适合基层和低基础设施医疗场景，比许多既有分子诊断平台更贴近一线使用。
    - FY25 收入 Rs 1,020 crore、PAT Rs 138.5 crore，让 Molbio 相比许多仍在亏损的 healthtech 独角兽更有可信度。
    - TB 场景有 WHO 背书，多国部署证据也让公共卫生买方更愿意信任。
    - 五座制造设施和已披露产能表明，公司不只是一次疫情周期里的临时故事。
    - 检测菜单正从 TB 扩到 HPV、肝炎、流感、疟疾和疫情响应。
    - 快速当日诊断能实质改善治疗启动时，公共卫生价值可能带来更持久的需求。
  topRisks:
    - 收入质量仍高度依赖公共卫生、捐助方和政府部门采购渠道，订单可能不连续，也容易受政策影响。
    - 服务在线率、装机利用率和检测试剂复购强度披露不够细，还不足以完整承保。
    - Cepheid 级别和更大型诊断既有玩家的竞争压力仍然真实存在，尤其当它们改善现场便携性和服务包之后。
    - 分产品毛利率、营运资本强度和客户集中度仍未公开。
    - 2024-2025 年报道中的 IPO 估值预期，可能高过公开市场投资人愿为诊断制造平台支付的价格。
    - Molbio 公开可见的产品护城河在 TB 和相邻公共卫生工作流里最强；离开这些切入口后的延展成功还没完全验证。
  unresolvedGaps:
    - 当前公开来源里仍缺最终 IPO 价格区间和更新后的 RHP 披露。
    - 国家、项目和客户层面的集中度数据没有公开披露。
    - 装机在线率、服务响应时间，以及投诉 / CAPA 历史仍是私有信息。
    - 按检测系列和产品类别拆分的毛利率没有公开。
    - 员工数和管理梯队深度披露仍不够精确，无法支撑经营杠杆分析。
