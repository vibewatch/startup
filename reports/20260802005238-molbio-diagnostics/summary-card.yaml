  topStrengths:
    - >-
      Portable Truenat workflow fits peripheral and low-infrastructure care settings better than many incumbent
      molecular platforms.
    - >-
      FY25 revenue of Rs 1,020 crore and PAT of Rs 138.5 crore make Molbio unusually credible versus many
      still-lossmaking healthtech unicorns.
    - WHO-backed TB relevance and multiple cross-country deployment proofs create real trust with public-health buyers.
    - Five manufacturing facilities and disclosed capacity show the company has scaled beyond a one-off outbreak story.
    - The assay menu is widening beyond TB into HPV, hepatitis, influenza, malaria, and outbreak response.
    - >-
      Public-health significance may create durable demand where fast same-day diagnosis materially improves treatment
      initiation.
  topRisks:
    - >-
      Revenue quality still depends heavily on public-health, donor, and ministry procurement channels that can be lumpy
      or policy-sensitive.
    - >-
      Service uptime, installed-base utilization, and assay reorder intensity are not disclosed with enough detail for
      full underwriting.
    - >-
      Competitive pressure from Cepheid-class and larger diagnostics incumbents remains real, especially if they improve
      field portability and service bundles.
    - Gross margin by product, working-capital intensity, and customer concentration remain private.
    - >-
      IPO valuation expectations in 2024-2025 coverage may outrun what public-market investors will pay for a
      diagnostics manufacturing platform.
    - >-
      Molbio's public product moat is strongest in TB and adjacent public-health workflows; extension success outside
      those wedges is not fully proven.
  unresolvedGaps:
    - Final IPO price band and updated RHP disclosures are still missing from the current public source set.
    - Country-, program-, and customer-level concentration data are not publicly disclosed.
    - Installed-base uptime, service-response times, and complaint / CAPA history remain private.
    - Gross margin by assay family and product category is not public.
    - >-
      Headcount and management-bench depth are still not disclosed with enough precision for operating-leverage
      analysis.
