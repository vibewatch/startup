summary:
  headline: >-
    Molbio Diagnostics has genuine business quality — profitable FY25 operations, WHO-backed TB credibility, and unusual
    field-deployment relevance — but the right recommendation remains Track until IPO pricing, concentration, and
    service-quality disclosure catch up with the story.
