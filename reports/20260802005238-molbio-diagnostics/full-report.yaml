      - number: '3.4'
        title: Moat durability and pricing pressure
        blocks:
          - type: paragraph
            body: >-
              Moat durability and pricing pressure is best understood by combining the strongest evidence from filings,
              official materials, and independent reporting. Pricing pressure is likely to increase as rapid molecular
              TB testing becomes a negotiated procurement category rather than a novel technology category. Global Fund
              and Stop TB-linked procurement evidence already shows price and maintenance guarantees are part of
              competitive positioning. Consumables economics matter because once a site adopts a platform, recurring
              cartridge or chip usage drives the lifetime economics of the account. Switching costs should be moderate
              rather than extreme because programs can change diagnostic algorithms if performance, price, or service
              deteriorate. Molbio's moat is therefore more operational and workflow-specific than absolute or
              monopolistic. In developed, high-throughput, reimbursement-led markets, Molbio is more likely to face
              displacement by incumbent lab platforms than in remote public-health networks. In high-burden LMIC
              settings, Molbio's competitive case strengthens because infrastructure simplicity directly affects
              diagnostic access. The balance of evidence in this section is good enough to frame an investment view, but
              remaining private-data gaps should still be tested in management diligence.
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
              - CP027
          - type: table
            tableRef: TP004
            claimRefs:
              - CP024
              - CP025
              - CP028
              - CP029
      - number: '3.5'
        title: Competitive verdict and unresolved questions
        blocks:
          - type: paragraph
            body: >-
              Competitive verdict and unresolved questions is best understood by combining the strongest evidence from
              filings, official materials, and independent reporting. The most plausible differentiation compression
              comes from incumbents improving portability, financing, and service packages into lower-resource settings.
              Another compression path is donor or ministry standardization around one negotiated platform that narrows
              room for parallel vendor adoption. Public sources do not cleanly quantify installed-base retention, so
              competitive durability still needs cohort-style field evidence. Molbio nevertheless appears competitively
              credible because it now sits inside the same global procurement and policy conversation as far larger
              diagnostics companies. The investment question is not whether Molbio has no competition, but whether its
              field-first product design keeps winning enough tenders and deployments to matter. For underwriting, the
              key competitor benchmark remains Cepheid, while Hologic, Abbott, QIAGEN, and Roche frame the broader trust
