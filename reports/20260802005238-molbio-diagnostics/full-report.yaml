              adjacent assets such as radiology and pathology investments, though Truenat remains the technological
              center of gravity. The HPV validation program shows Molbio is trying to apply the same decentralized
              molecular logic to women's health and screening use cases. Nipah authorization and Ebola-deployment
              materials show the platform is also pitched for outbreak response. This breadth matters because
              multi-disease menu utility can raise utilization per installed device. But menu breadth alone is not
              enough; adoption still depends on validated workflows and program inclusion. The balance of evidence in
