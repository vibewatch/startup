              many geographies. Five manufacturing facilities imply real execution load across capacity planning, QA,
              logistics, and maintenance. Outbreak-response expansion into Ebola and Nipah is strategically exciting,
              but also creates technical and regulatory workload beyond core TB deployment. Adjacency moves into
              pathology, breast cancer screening, or sickle-cell testing add optionality while also stretching
              management attention. Workflow complexity matters because a field-deployed PCR system still depends on
              operator training and consumables discipline. The Uganda case study explicitly notes that Truenat involves
              more hands-on work than GeneXpert for some lab staff. That does not invalidate the platform, but it shows
              adoption friction can remain even when same-day diagnosis is superior. The balance of evidence in this
