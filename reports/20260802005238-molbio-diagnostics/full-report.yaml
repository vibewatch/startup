      - number: '1.5'
        title: Milestones and strategic extensions
        blocks:
          - type: paragraph
            body: >-
              Milestones since 2020 show a company using the Truenat core platform to expand into adjacent assays,
              public-health programs, and hardware adjacencies while also preparing itself for public markets. WHO
              endorsement of Truenat for TB materially changed Molbio's positioning from Indian innovator to globally
              acceptable TB platform vendor. Public-health rollout stories in India, Africa, and Asia show Molbio
              converting platform validation into national-program deployments. Emergency authorization for Nipah
              testing demonstrated that Molbio can extend the platform rapidly to outbreak-response use cases. The
              OptraSCAN investment shows Molbio is willing to deploy capital into adjacent healthtech categories beyond
              core PCR testing. Recognition at the World Health Assembly reinforced Molbio's reputation with
              global-health stakeholders. The combination of profitable operations, manufacturing scale, and a live IPO
              process differentiates Molbio from many still-lossmaking Indian healthtech unicorns. The balance of
