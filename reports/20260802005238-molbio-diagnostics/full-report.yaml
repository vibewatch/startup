  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and disclosure risk is best understood by combining the strongest evidence from filings,
              official materials, and independent reporting. Molbio does not appear to face a single thesis-breaking
              public scandal today, but it does operate in a risk-heavy mix of regulation, manufacturing, and
              public-health execution. Regulatory risk is inherent because assay quality, diagnostics claims, and
              program use can all attract intense scrutiny if field performance degrades. The company's move toward
              public markets raises disclosure risk because private-company opacity will be harder to sustain after
              listing. Detailed post-market surveillance, complaint data, and recall history are not publicly disclosed
              in a way that closes all diligence questions. Any diagnostics company serving vulnerable public-health
              settings carries reputational risk if a large installed base fails to deliver consistent results. The lack
              of public litigation or recall headlines is a positive signal, but absence of evidence is not proof of
              zero risk. Risk governance therefore needs to be judged partly through process maturity rather than
              incident counts alone. The balance of evidence in this section is good enough to frame an investment view,
              but remaining private-data gaps should still be tested in management diligence.
