        title: POCT growth and regional context
        blocks:
          - type: paragraph
            body: >-
              POCT growth and regional context is best understood by combining the strongest evidence from filings,
              official materials, and independent reporting. Grand View estimated the global point-of-care molecular
              diagnostics market at US$8.17 billion in 2023 and US$8.70 billion in 2024. Grand View projects that
              point-of-care molecular diagnostics will reach about US$10.12 billion by 2030. The same Grand View summary
              says decentralized labs represented 42.66% of the market in 2023, which aligns well with Molbio's
              field-use thesis. The 1Lattice report positions APAC as the largest global POCT market in CY24 and
              highlights high growth in MENA and Latin America. Within infectious-disease POCT, the 1Lattice report
              identifies TB as the largest category by market value. The same report estimates roughly 170.8 million TB
              tests and about US$2.33 billion of TB testing value in 2024. India's molecular diagnostics opportunity is
              structurally attractive because it combines high infectious-disease burden with an active public-health
              procurement system. The balance of evidence in this section is good enough to frame an investment view,
              but remaining private-data gaps should still be tested in management diligence.
