      - number: '1.2'
        title: Leadership, governance, and decision rights
        blocks:
          - type: paragraph
            body: >-
              Leadership quality matters disproportionately in a diagnostics business that combines regulated assays,
              manufacturing, tender-led sales, and global health partnerships. Public evidence shows both founder
              continuity and a gradual formalization of governance. Sriram Natarajan is the founder-director and chief
              executive most consistently associated with Molbio in company and press materials. The promoter group
              includes Sriram Natarajan, Dr. Chandrasekhar Bhaskaran Nair, family members, and Exxora Trading LLP. The
              DRHP identifies Bigtec as a wholly owned subsidiary that houses critical R&D capabilities. The DRHP also
              identifies Prognosys Medical Systems as a material subsidiary focused on radiology products. Tracxn and
              company disclosures indicate Molbio added distinguished public-health voices such as Balram Bhargava and
              Arun Kumar Jha to broaden governance credibility. The governance story is improving, but public materials
              still do not disclose the same committee-level detail that listed diagnostics peers publish routinely.
              Molbio's acquisition and investment activity suggests leadership is using adjacent devices and digital
              pathology to widen the platform perimeter. The balance of evidence in this section is good enough to frame
              an investment view, but remaining private-data gaps should still be tested in management diligence.
