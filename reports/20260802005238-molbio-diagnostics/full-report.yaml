  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the Truenat product is
        blocks:
          - type: paragraph
            body: >-
              What the Truenat product is is best understood by combining the strongest evidence from filings, official
              materials, and independent reporting. Truenat is a point-of-care real-time PCR platform designed to
              decentralize access to timely molecular diagnosis. The workflow combines sample preparation on Trueprep
              AUTO V2 with amplification and analysis on Truelab analyzers. Molbio's public product story is rooted in
              bringing lab-grade molecular performance into peripheral healthcare settings. TB remains the most
              important proof point because the platform has WHO-backed public-health legitimacy in that use case. The
              Truenat TB assays are chip-based molecular tests that detect Mycobacterium tuberculosis and drug
              resistance markers. Sample-to-result time for key TB workflows is about one hour for detection and roughly
              seventy minutes for rifampicin resistance testing. The platform is explicitly designed for same-day
              diagnosis and treatment initiation where central-lab turnaround would be too slow. The balance of evidence
              in this section is good enough to frame an investment view, but remaining private-data gaps should still
              be tested in management diligence.
