  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              Landscape and substitute set is best understood by combining the strongest evidence from filings, official
              materials, and independent reporting. Molbio's competitor set includes direct TB molecular platforms,
              broader infectious-disease molecular systems, and non-molecular diagnostic substitutes. Cepheid is the
              most important comparator because Xpert established the reference benchmark for rapid molecular TB testing
              more than a decade earlier. WHO's TB materials explicitly discuss Truenat in relation to Xpert rather than
              in isolation, which shows the market frames them as comparable classes. Tracxn classifies Molbio as a
              point-of-care molecular diagnostics platform rather than a generic lab-equipment vendor. Tracxn's peer
              list shows Molbio competes in a global diagnostics set, not only an India-only startup cohort. Legacy
              smear microscopy remains an indirect competitor in low-resource TB settings because budget-constrained
              programs do not upgrade instantly. Centralized reference-lab PCR remains another substitute where
              throughput beats point-of-care convenience. The balance of evidence in this section is good enough to
              frame an investment view, but remaining private-data gaps should still be tested in management diligence.
            claimRefs:
