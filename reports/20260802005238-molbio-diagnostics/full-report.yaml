        title: Customer segmentation and buyer model
        blocks:
          - type: paragraph
            body: >-
              Customer segmentation and buyer model is best understood by combining the strongest evidence from filings,
              official materials, and independent reporting. Molbio's customers are best understood as public-health
              systems, national programs, and donor-backed procurement channels rather than a narrow list of named
              enterprise accounts. In India, the National Tuberculosis Elimination Programme is the clearest domestic
              anchor for Truenat deployment. Public-health buyers, not end patients, typically control procurement
              decisions for Molbio's core TB use case. Users are often nurses, lab staff, or clinic workers in
              peripheral facilities rather than central-lab specialists. Internationally, donors, ministries of health,
              and implementation partners appear to mediate a large share of customer acquisition. This customer
              structure means adoption quality is better measured by active sites and test throughput than by classical
              account counts. Public evidence for private-provider adoption exists but is much thinner than the
              public-health deployment evidence. The balance of evidence in this section is good enough to frame an
