    analyzers, and assay chips for TB, rifampicin resistance, HPV, hepatitis, influenza, malaria, and other
    infectious-disease workflows built for battery-operated, low-infrastructure settings.
  customerFocus: >-
    National TB programs, ministries of health, donor-backed LMIC procurement channels, public hospitals, and selected
    healthcare providers needing decentralized molecular testing.
  businessModel: >-
    Hardware-plus-consumables diagnostics model in which device placements create recurring assay-kit demand, supported
    by training, deployment, and program relationships.
  stage: pre-IPO profitable unicorn
  fundingStatus: >-
