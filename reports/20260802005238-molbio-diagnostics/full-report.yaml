  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Market boundary and sizing lenses is best understood by combining the strongest evidence from filings,
              official materials, and independent reporting. Molbio's market should be bounded as an overlap between
              molecular diagnostics, point-of-care molecular diagnostics, and high-burden infectious-disease testing.
              The 1Lattice report used in Molbio's IPO materials values the global molecular diagnostics market at
              US$18.1 billion in CY24. That same report projects the market to reach US$28.4 billion by CY29, implying a
              9.4% CAGR. MarketsandMarkets presents a broadly similar bullish direction for molecular diagnostics
              through 2030, though with a different methodology and scope. Infectious diseases accounted for 46.4% of
              the global molecular diagnostics market in CY24 according to the 1Lattice report. PCR remains the largest
              technology category inside molecular diagnostics, with a 42.9% share in the same market study. The size of
              the overall molecular diagnostics market is large enough that Molbio does not need to win broad-based
              hospital labs to justify continued growth. The balance of evidence in this section is good enough to frame
              an investment view, but remaining private-data gaps should still be tested in management diligence.
