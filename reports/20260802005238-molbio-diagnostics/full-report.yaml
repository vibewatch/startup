      - number: '5.5'
        title: Quality controls, trust, and final product verdict
        blocks:
          - type: paragraph
            body: >-
              Quality controls, trust, and final product verdict is best understood by combining the strongest evidence
              from filings, official materials, and independent reporting. Cost-effectiveness work in India and Africa
              suggests decentralized Truenat deployment can be economically defensible when linkage to care improves.
              The India cost-effectiveness analysis links Truenat's value not just to assay sensitivity but also to
              higher linkage-to-care at the primary-care level. The Mozambique and Tanzania analysis frames Truenat as a
              viable alternative to hub-and-spoke GeneXpert models in specific contexts. These economic studies
              strengthen the investment case because diagnostics value is only realized when workflows alter treatment
              timing and access. HPV validation against WHO-IARC-style criteria is an important trust signal for
              platform extensibility beyond infectious disease. The HPV program also shows Molbio is willing to compete
              on affordability and screening feasibility rather than only on laboratory sophistication. Nipah and Ebola
              materials suggest Molbio can move relatively quickly when a high-urgency outbreak response requires new
              assays. Quality and trust controls are public at the product-marketing level, but detailed reliability,
              uptime, and post-market surveillance data remain private. Cybersecurity and data-platform claims are not
              the center of the public product story; the moat is mostly physical, assay, and workflow based. Overall,
              Molbio's product and technology stack is credible, field-oriented, and unusually well aligned with
              public-health deployment needs. The balance of evidence in this section is good enough to frame an
              investment view, but remaining private-data gaps should still be tested in management diligence.
