      - number: '7.5'
        title: Valuation risk, mitigations, and kill triggers
        blocks:
          - type: paragraph
            body: >-
              Valuation risk, mitigations, and kill triggers is best understood by combining the strongest evidence from
              filings, official materials, and independent reporting. Valuation risk is material because pre-IPO
              narratives can get ahead of public market willingness to pay for diagnostics manufacturing businesses.
              Economic Times reported that private-market negotiation around the 2022 round involved lower accepted
              valuation than some seller expectations, showing price sensitivity even in strong growth periods.
              Moneycontrol later reported a much higher aspirational IPO range, which could prove difficult if public
              investors demand stricter comparables discipline. Residual risk remains high because public evidence still
              lacks gross-margin detail, concentration data, service metrics, and full governance disclosure. Mitigation
              signals do exist: profitability, WHO-backed product legitimacy, installed manufacturing capacity, and
              repeated cross-country deployment proof. A thesis-break trigger would be clear evidence that installed
              sites are not reordering assays or that procurement channels are narrowing materially. A second
              thesis-break trigger would be significant quality or service incidents that damage public-health trust in
              the platform. A third thesis-break trigger would be IPO price discovery that demands a public multiple
              unsupported by revenue quality and growth durability. Because these risks transmit directly into
              deployment, reorder rates, and valuation, investors should treat Molbio as high potential but high
              execution risk. Overall, Molbio deserves a high residual risk rating even though the operating business is
              clearly real and strategically relevant. The balance of evidence in this section is good enough to frame
              an investment view, but remaining private-data gaps should still be tested in management diligence.
            claimRefs:
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
