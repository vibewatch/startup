        title: Revenue model and monetization logic
        blocks:
          - type: paragraph
            body: >-
              Revenue model and monetization logic is best understood by combining the strongest evidence from filings,
              official materials, and independent reporting. Molbio's revenue model combines device placements,
              recurring assay and test-kit consumption, and associated platform workflows. The recurring consumables
              engine is visible in public reporting because FY25 kit volumes materially exceed annual device placements.
              Prognosys broadens the financial lens by adding radiology hardware exposure beyond core Truenat assays. A
              platform business mixing devices and assays usually carries different margin profiles across hardware and
              consumables, but public mix data remain absent. Molbio's commercialization appears more tender and program
              driven than subscription based, so revenue quality should be judged through throughput and replenishment
              rather than ARR heuristics. Public sources do not reveal segment revenue by disease or geography, which
              limits precision on mix quality. Even so, the available data support a real operating business rather than
