              delays, funding gaps, or algorithm changes could slow device placements and consumables consumption even
              if the product is technically credible. The Global Fund collaboration reduces some affordability risk but
              also confirms how central donor-backed procurement is to the thesis. Public-market or macro volatility can
              also matter because diagnostics IPO appetite is cyclical and can change independently of Molbio's
              operating progress. Execution risk is therefore partly outside management control in a way that software
              businesses do not face. Yet the same channel concentration can be a strength when policy alignment and
