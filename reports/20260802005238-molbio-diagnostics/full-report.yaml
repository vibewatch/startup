      - number: '7.4'
        title: Competitive and roadmap risk
        blocks:
          - type: paragraph
            body: >-
              Competitive and roadmap risk is best understood by combining the strongest evidence from filings, official
              materials, and independent reporting. Competitive risk remains real because Cepheid-class alternatives are
              entrenched and globally trusted. A major competitive risk is that incumbents improve portability,
              financing, and service packages into the same field settings that underpin Molbio's edge. Another
              competitive risk is that buyers standardize around a single vendor platform to simplify training, service,
              and procurement. The broad assay roadmap also creates prioritization risk because too many extensions can
              dilute focus from the core TB and infectious-disease base. If private-provider diversification fails to
              materialize, Molbio could remain more procurement-sensitive than investors expect. The balance of evidence
              in this section is good enough to frame an investment view, but remaining private-data gaps should still
              be tested in management diligence.
            claimRefs:
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
          - type: table
            tableRef: TR004
