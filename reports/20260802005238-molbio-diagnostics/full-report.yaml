        title: Architecture, consumables, and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              Architecture, consumables, and operating dependencies is best understood by combining the strongest
              evidence from filings, official materials, and independent reporting. Key technical features include
              battery operation, lyophilized reagents, low biosafety requirements, and room-temperature stability for
              important consumables. The TB brochure cites reagent stability up to 30°C for two years for certain
              assays, supporting low-resource deployment claims. Minimal extracted elute volume and
              contamination-control design features are part of the publicly marketed technical package. The platform
              relies on a cartridge-based extraction step and disposable consumables, which simplifies field use but
              still requires operator training. Bigtec is important because it is the R&D engine that develops assays
              and underpins platform extensibility. The product moat therefore combines hardware design, chemistry,
              workflow, and assay development rather than software alone. The balance of evidence in this section is
              good enough to frame an investment view, but remaining private-data gaps should still be tested in
