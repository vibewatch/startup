      - number: '5.4'
        title: Validation and cost-effectiveness evidence
        blocks:
          - type: paragraph
            body: >-
              Validation and cost-effectiveness evidence is best understood by combining the strongest evidence from
              filings, official materials, and independent reporting. Peer-reviewed evidence from multicentre studies
              finds Truenat performance directionally comparable to Xpert MTB/RIF in several settings. The Pen-Nicholson
              multicentre study reported high specificity and comparable head-to-head performance against Xpert in
              reference-lab comparisons. The Uganda and Cameroon studies reinforce that Truenat is clinically usable
              outside India and in real-world program contexts. The strongest product advantage emerges when portability
              and decentralized use are more important than raw throughput. The strongest product weakness emerges when
              operators prioritize high-throughput central-lab efficiency or wider incumbent menus. The balance of
              evidence in this section is good enough to frame an investment view, but remaining private-data gaps
              should still be tested in management diligence.
