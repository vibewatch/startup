companyProfile:
  summary: >-
    Molbio Diagnostics is one of the stronger late-stage Indian healthtech businesses on the public record: it has a
    real product moat in portable molecular diagnostics, meaningful global-public-health relevance through Truenat, a
    profitable FY25, and a credible pre-IPO financing and manufacturing story. The company sells a
    hardware-plus-consumables workflow, not software, so the underwriting case depends on installed-base activation,
    public-health procurement durability, assay reorders, and field service execution. The public story is compelling,
    but deeper concentration, service, and margin disclosure is still needed before aggressive underwriting.
  foundedDate: '2000-01-01'
  founders:
