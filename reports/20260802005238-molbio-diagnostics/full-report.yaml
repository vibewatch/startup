      - number: '1.4'
        title: Operating scale and footprint
        blocks:
          - type: paragraph
            body: >-
              Scale indicators now point to a business that is no longer a single-product pandemic beneficiary. Revenue,
              capacity, and deployment evidence all show a broader installed-base story anchored by Truenat but
              supported by manufacturing and international channels. Molbio reported FY25 revenue from operations of Rs
              1,020 crore. Molbio reported FY25 profit after tax of Rs 138.5 crore. FY25 revenue grew 21.98% year over
              year from FY24 according to the DRHP-based reporting summarized by ET and Entrackr. The company sold 2,180
              devices and 12.24 million test kits in FY25 according to DRHP-based coverage. Installed annual capacity
              stood at 3,600 devices and 3.9 crore test kits as of March 2025. Molbio operates five manufacturing
              facilities across Goa, Bengaluru, and Visakhapatnam. Molbio's public materials claim reach across more
              than 85 countries and over 40 million lives touched. The company does not publicly disclose a clean
              current employee headcount, which limits operating-leverage analysis. The balance of evidence in this
              section is good enough to frame an investment view, but remaining private-data gaps should still be tested
