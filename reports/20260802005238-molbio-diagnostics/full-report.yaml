      - number: '2.4'
        title: Adoption drivers in TB and LMIC settings
        blocks:
          - type: paragraph
            body: >-
              Adoption drivers in TB and LMIC settings is best understood by combining the strongest evidence from
              filings, official materials, and independent reporting. WHO's rapid communication states that rapid
              molecular assays are the standard of care for initial TB diagnosis and rifampicin resistance testing. The
              Global Fund stated that fewer than 40% of people needing TB testing had access to rapid molecular
              diagnostics in 2021. WHO's global TB report for 2024 says TB regained its position as the world's leading
              infectious killer in 2023, reinforcing the urgency of faster diagnosis. Molbio's market case strengthens
              when sample-to-result time, battery operation, and minimal biosafety requirements matter more than maximum
              laboratory throughput. Same-day diagnosis is a programmatic advantage because it shortens
              loss-to-follow-up between testing and treatment initiation. Public sources repeatedly position Truenat as
              a replacement for smear microscopy in peripheral sites rather than a wholesale replacement for
              high-throughput central platforms. Market adoption still depends on training, service networks, cartridge
              availability, quality assurance, and national algorithm updates. The balance of evidence in this section
              is good enough to frame an investment view, but remaining private-data gaps should still be tested in
              management diligence.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
          - type: table
            tableRef: TM004
            claimRefs:
