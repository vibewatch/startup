chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company identity and legal footing
        blocks:
          - type: paragraph
            body: >-
              Public filings, official company materials, and independent funding trackers present a fairly consistent
              picture of Molbio as a scaled Indian molecular diagnostics company, but they also reveal where
              corporate-form details and venture-style narratives diverge. Molbio Diagnostics is a Goa-headquartered
              point-of-care molecular diagnostics company centered on the Truenat platform. The legal entity behind
              Molbio Diagnostics was incorporated in 2000 according to the 2025 draft red herring prospectus. Secondary
              venture databases often describe Molbio using a later startup-era lens, creating a public founding-date
              mismatch with the legal entity chronology. Molbio's core business model is selling devices, assays, and
              related point-of-care molecular testing workflows into public-health and healthcare settings. The
              company's flagship Truenat platform is portable, battery-operated, and built for decentralized PCR
              testing. Molbio presents itself as a healthcare-equity enabler that takes gold-standard molecular testing
              into low-resource settings. Public materials show Molbio operating from Verna Industrial Estate in Goa as
              its registered and corporate office. The balance of evidence in this section is good enough to frame an
              investment view, but remaining private-data gaps should still be tested in management diligence.
