- id: SM_BUYER-USER-AND-PAYER-MAP
  title: Buyer, user, and payer map
  body: Buyer, user, and payer map is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Molbio's realistic buyers are ministries of health, national TB programs, donor-backed procurers, public hospitals, and selected private providers rather than individual consumers. In TB programs, the buyer is often the ministry or donor, the user is a lab or clinic worker, and the patient is neither the payer nor procurement decision-maker. Stop TB, USAID, Global Fund, and Unitaid sources show that affordability and maintenance commitments materially influence buyer adoption. India Health Fund and CHAI materials reinforce that last-mile diagnostic access is a service-delivery problem, not just a hardware problem. In India, NTEP has already treated Truenat as part of the national push to replace smear microscopy with rapid molecular testing. High-burden LMICs are especially attractive to Molbio because decentralized PCR eliminates transport
    delays, power fragility, and long turnaround times. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
