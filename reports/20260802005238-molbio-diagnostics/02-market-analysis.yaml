chapter:
  number: 2
  title: Market Analysis
  summary: 'Molbio competes in the intersection of global molecular diagnostics, point-of-care PCR, and TB-focused public-health testing. Public market evidence shows a large and growing diagnostics backdrop, while TB-specific adoption still depends on donor funding, NTEP program design, and the operational advantage of decentralized testing in low-resource settings. The market is attractive, but it is not frictionless: access, reimbursement, workflow simplicity, training, and national procurement rules govern real adoption.'
sections:
- id: SM_MARKET-BOUNDARY-AND-SIZING-LENSES
  title: Market boundary and sizing lenses
  body: Market boundary and sizing lenses is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Molbio's market should be bounded as an overlap between molecular diagnostics, point-of-care molecular diagnostics, and high-burden infectious-disease testing. The 1Lattice report used in Molbio's IPO materials values the global molecular diagnostics market at US$18.1 billion in CY24. That same report projects the market to reach US$28.4 billion by CY29, implying a 9.4% CAGR. MarketsandMarkets presents a broadly similar bullish direction for molecular diagnostics through 2030, though with a different methodology and scope. Infectious diseases accounted for 46.4% of the global molecular diagnostics market in CY24 according to the 1Lattice report. PCR remains the largest technology category inside molecular diagnostics, with a 42.9% share in the same market study. The size of the overall molecular diagnostics market is large enough that
    Molbio does not need to win broad-based hospital labs to justify continued growth. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
