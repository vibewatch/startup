- id: SM_CONSTRAINTS-DATA-QUALITY-AND-PRACTICAL-MARKET-TAKEAWAYS
  title: Constraints, data quality, and practical market takeaways
  body: Constraints, data quality, and practical market takeaways is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Policy execution risk remains material because WHO endorsement does not itself guarantee tender budgets, distribution capacity, or algorithm compliance. Market-sizing summaries are directionally useful but not precise enough to serve as a stand-alone SOM model for Molbio. Buyer budgets and tender-level economics are still poorly disclosed in public sources, especially for country-specific rollouts. The strongest practical market signal is not top-down TAM, but repeated evidence that high-burden programs are willing to procure decentralized molecular testing at scale. Molbio benefits from adjacencies in HPV, hepatitis, and STI testing, but TB remains the sharpest proof point for why decentralized PCR matters. Private-provider demand matters most as a second-order monetization layer after public-health credibility
    is established. Molbio's addressable market is therefore attractive, but the real adoption bottleneck is implementation discipline rather than pure market size. For underwriting purposes, investors should treat program-access evidence and throughput economics as more important than headline TAM inflation. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
