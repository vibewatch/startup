- id: SE_MENU-BREADTH-AND-PLATFORM-EXTENSIONS
  title: Menu breadth and platform extensions
  body: Menu breadth and platform extensions is best understood by combining the strongest evidence from filings, official materials, and independent reporting. The public assay menu now extends beyond TB into influenza, hepatitis, HPV, malaria, STI, and other infectious disease categories. Truenat Assays pages and brochures position the platform as multi-disease rather than a single-program product. Molbio also highlights adjacent assets such as radiology and pathology investments, though Truenat remains the technological center of gravity. The HPV validation program shows Molbio is trying to apply the same decentralized molecular logic to women's health and screening use cases. Nipah authorization and Ebola-deployment materials show the platform is also pitched for outbreak response. This breadth matters because multi-disease menu utility can raise utilization per installed device. But menu breadth alone is not enough; adoption still depends on validated workflows and program inclusion.
    The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
