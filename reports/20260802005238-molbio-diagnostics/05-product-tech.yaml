  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-data
    missingEvidence: Installed-base uptime, maintenance intervals, failure rates, and service-response metrics by geography.
    whyItMatters: A field-deployed hardware platform is only as good as its uptime and service economics at scale.
    diligencePath: Request device reliability dashboards and service logs by installed cohort.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: menu-economics
    missingEvidence: Assay-level contribution margins and utilization by disease family.
    whyItMatters: Multi-disease menu breadth matters only if the economics and throughput improve return on installed devices.
    diligencePath: Review device utilization and gross margin by assay category.
    relatedQuestionRefs:
    - QE021
  - type: private-evidence-only
    severity: minor
    topic: post-market-surveillance
    missingEvidence: Formal post-market surveillance and complaint trend data for major assay families.
    whyItMatters: Trust claims are stronger when supported by operational quality disclosure, not only validation studies.
    diligencePath: Request QA dashboards, complaint logs, and regulator correspondence where available.
    relatedQuestionRefs:
    - QE024
