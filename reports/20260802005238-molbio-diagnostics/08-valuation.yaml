- id: SV_BULL-BASE-AND-BEAR-LOGIC
  title: Bull, base, and bear logic
  body: Bull, base, and bear logic is best understood by combining the strongest evidence from filings, official materials, and independent reporting. A bull case assumes Molbio converts TB leadership into wider infectious-disease, HPV, and public-health utilization on the installed base. A bull case also assumes that profitability is durable and that IPO price discovery stays within a reasonable diagnostics multiple range. A base case assumes Molbio remains a strong but procurement-sensitive diagnostics platform whose public valuation should stay disciplined. A bear case assumes public investors reject a high IPO range because concentration, margin opacity, and tender cyclicality cap the multiple. Another bear case is that installed-base quality or reorder intensity proves weaker than deployment headlines suggest. Capital intensity still matters because IPO proceeds are aimed at new facilities and equipment, not only software-like expansion. The use-of-funds profile therefore argues for
    a manufacturing and diagnostics lens rather than a pure asset-light technology lens. Comparable framing should lean toward diagnostics and medtech execution quality rather than generic healthtech or SaaS multiples. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CV015
  - CV016
  - CV017
  - CV018
  - CV019
