- id: SV_CURRENT-VALUATION-CONTEXT-AND-RECOMMENDATION-FRAME
  title: Current valuation context and recommendation frame
  body: Current valuation context and recommendation frame is best understood by combining the strongest evidence from filings, official materials, and independent reporting. The last clearly confirmed unicorn valuation evidence is the September 2022 round at approximately US$1.6 billion. Economic Times and Moneycontrol later described aspirational IPO thinking closer to Rs 22,000-24,000 crore, but that is not the same as priced public-market validation. The 2025 DRHP confirms a live IPO pathway but does not yet disclose the final price band in the fetched public materials. FY25 revenue of Rs 1,020 crore and PAT of Rs 138.5 crore materially strengthen Molbio's claim to public-market readiness. The fresh issue is only Rs 200 crore, which suggests Molbio is not raising IPO capital from a position of financial distress. Offer-for-sale components, however, show that liquidity for existing holders is part of the transaction logic. The valuation stance should therefore reflect both operating strength
    and seller liquidity incentives. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CV008
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
