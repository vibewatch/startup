  claims:
  - id: CV001
    statement: The core investment thesis is that Molbio combines real revenue, real profitability, public-health relevance, and a differentiated field-deployment platform.
    type: inferred
    topic: thesis-core
    sourceRefs:
    - SV003
    - SV004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV001
  - id: CV002
    statement: Unlike many healthtech unicorns, Molbio has public evidence of FY25 profit rather than only growth narratives.
    type: inferred
    topic: profitability-thesis
    sourceRefs:
    - SV004
    - SV009
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV002
  - id: CV003
    statement: The company also has manufacturing capacity, installed deployment proof, and WHO-backed product credibility.
    type: inferred
    topic: asset-thesis
    sourceRefs:
    - SV009
    - SV011
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV003
  - id: CV004
    statement: These factors support a positive fundamental view on the business quality itself.
    type: inferred
    topic: business-quality
    sourceRefs:
    - SV011
    - SV003
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV004
  - id: CV005
    statement: The anti-thesis is that public-health concentration, margin opacity, and IPO valuation uncertainty could make the public entry point far less attractive than the operating story.
    type: inferred
    topic: anti-thesis
    sourceRefs:
    - SV003
    - SV004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV005
