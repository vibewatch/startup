- id: SV_FINAL-DILIGENCE-ASKS-AND-THESIS-BREAK-TRIGGERS
  title: Final diligence asks and thesis-break triggers
  body: Final diligence asks and thesis-break triggers is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Recommendation should therefore be Track rather than outright Buy before price discovery. Confidence should be medium because the business quality is visible, but several valuation-critical metrics remain private. Risk rating should be high because procurement concentration, margin opacity, and public-market pricing risk remain unresolved. Valuation stance should be fair to stretched depending on final IPO pricing, with the pre-pricing default leaning stretched when using aspirational 2024 headlines. A thesis-break trigger would be an IPO valuation that assumes premium software-style multiples despite manufacturing and tender risk. Another thesis-break trigger would be evidence that FY25 profitability does not translate into sustainable post-IPO cash generation. Final diligence should focus on gross margin by category,
    concentration by country and customer, service quality, and reorder intensity. The overall valuation verdict is positive on company quality but disciplined on entry price. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
