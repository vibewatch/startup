chapter:
  number: 8
  title: Valuation
  summary: 'Molbio has one of the better operating profiles among Indian healthtech unicorns: it is profitable, has large installed manufacturing capacity, and owns a platform with global-public-health relevance. The open question is price discipline. The last confirmed unicorn mark remains the 2022 $1.6 billion round, while later IPO-prep reporting points to much higher aspirational public valuations without formal price discovery yet. The right stance is to respect the quality of the business but stay valuation-disciplined until IPO terms and concentration data are clear.'
sections:
- id: SV_THESIS-AND-ANTI-THESIS
  title: Thesis and anti-thesis
  body: Thesis and anti-thesis is best understood by combining the strongest evidence from filings, official materials, and independent reporting. The core investment thesis is that Molbio combines real revenue, real profitability, public-health relevance, and a differentiated field-deployment platform. Unlike many healthtech unicorns, Molbio has public evidence of FY25 profit rather than only growth narratives. The company also has manufacturing capacity, installed deployment proof, and WHO-backed product credibility. These factors support a positive fundamental view on the business quality itself. The anti-thesis is that public-health concentration, margin opacity, and IPO valuation uncertainty could make the public entry point far less attractive than the operating story. Because procurement cycles matter, Molbio is not a pure recurring-revenue software story and should not be valued like one. The right recommendation therefore depends heavily on price discipline rather than only business
    admiration. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  tableRefs:
  - TV001
  figureRefs:
