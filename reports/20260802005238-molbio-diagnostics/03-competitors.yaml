- id: SP_COMPETITIVE-VERDICT-AND-UNRESOLVED-QUESTIONS
  title: Competitive verdict and unresolved questions
  body: Competitive verdict and unresolved questions is best understood by combining the strongest evidence from filings, official materials, and independent reporting. The most plausible differentiation compression comes from incumbents improving portability, financing, and service packages into lower-resource settings. Another compression path is donor or ministry standardization around one negotiated platform that narrows room for parallel vendor adoption. Public sources do not cleanly quantify installed-base retention, so competitive durability still needs cohort-style field evidence. Molbio nevertheless appears competitively credible because it now sits inside the same global procurement and policy conversation as far larger diagnostics companies. The investment question is not whether Molbio has no competition, but whether its field-first product design keeps winning enough tenders and deployments to matter. For underwriting, the key competitor benchmark remains Cepheid, while Hologic,
    Abbott, QIAGEN, and Roche frame the broader trust and menu context. Molbio's competitive posture is therefore differentiated but not unassailable. Execution in service, pricing, and procurement will matter as much as assay science in sustaining that posture. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
