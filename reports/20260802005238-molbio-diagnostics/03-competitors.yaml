- id: SP_INCUMBENT-PLATFORM-COMPARISONS
  title: Incumbent platform comparisons
  body: Incumbent platform comparisons is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Hologic competes more as a centralized molecular diagnostics incumbent than as a last-mile TB device peer. Abbott's infectious-disease portfolio shows breadth in molecular assays and installed diagnostics infrastructure that Molbio does not yet match globally. QIAGEN matters because its diagnostics portfolio spans infectious disease and TB-related clinical workflows, even though its form factor differs from Truenat. Roche represents a scale and trust benchmark in diagnostics but is less directly matched to Truenat's field-deployment thesis. Cepheid's systems page illustrates a much broader installed menu than Molbio currently discloses publicly, especially outside TB and public-health use cases. Molbio's menu breadth is still meaningful because Truenat can address TB, viral hepatitis, HPV, influenza, malaria, and other infectious-disease
    needs on one platform. Competitive comparison should therefore separate throughput incumbents from decentralized workflow specialists. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
