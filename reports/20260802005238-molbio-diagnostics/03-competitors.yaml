- id: SP_WHERE-MOLBIO-IS-GENUINELY-DIFFERENT
  title: Where Molbio is genuinely different
  body: Where Molbio is genuinely different is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Molbio's strongest competitive edge is deployment in peripheral settings that cannot reliably support centralized molecular labs. Battery operation and lower infrastructure dependency are central reasons Truenat travels better into LMIC primary-care settings than many incumbent systems. WHO endorsement narrows the trust gap with global incumbents because it validates the clinical class rather than only company marketing. Peer-reviewed comparisons from Cameroon, Uganda, and multicentre studies suggest Truenat performance is directionally comparable to Xpert in several use cases. Molbio is weaker than global incumbents on disclosed service scale, multinational sales coverage, and likely post-sale support density. Large incumbents also have stronger bundle potential because they sell into broader hospital and lab menus beyond one public-health
    wedge. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CP015
  - CP016
  - CP017
  - CP018
