- id: SP_MOAT-DURABILITY-AND-PRICING-PRESSURE
  title: Moat durability and pricing pressure
  body: Moat durability and pricing pressure is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Pricing pressure is likely to increase as rapid molecular TB testing becomes a negotiated procurement category rather than a novel technology category. Global Fund and Stop TB-linked procurement evidence already shows price and maintenance guarantees are part of competitive positioning. Consumables economics matter because once a site adopts a platform, recurring cartridge or chip usage drives the lifetime economics of the account. Switching costs should be moderate rather than extreme because programs can change diagnostic algorithms if performance, price, or service deteriorate. Molbio's moat is therefore more operational and workflow-specific than absolute or monopolistic. In developed, high-throughput, reimbursement-led markets, Molbio is more likely to face displacement by incumbent lab platforms than in remote public-health
    networks. In high-burden LMIC settings, Molbio's competitive case strengthens because infrastructure simplicity directly affects diagnostic access. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CP021
