- id: SI_THROUGHPUT-NORMALIZATION-AND-PUBLIC-KPI-QUALITY
  title: Throughput, normalization, and public KPI quality
  body: Throughput, normalization, and public KPI quality is best understood by combining the strongest evidence from filings, official materials, and independent reporting. FY25 device sales reached 2,180 while kit sales reached 12.24 million, which supports a blended hardware-and-consumables model. Public reporting describes FY21 as a pandemic-era peak and FY23 as a trough before FY25 recovery. That revenue arc implies Molbio is no longer only a COVID testing story, but has not erased cyclicality risk completely. The company is now profitable enough to approach IPO markets from a position of strength relative to many venture-backed healthtech peers. Still, there is not enough public disclosure to calculate gross margin precisely. Public evidence is also insufficient to estimate CAC, payback, NRR, or renewal economics. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
