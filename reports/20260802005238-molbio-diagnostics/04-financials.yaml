chapter:
  number: 4
  title: Financials
  summary: Molbio is unusual among private Indian healthtech unicorns because FY25 public evidence shows scale and profitability at the same time. Revenue reached Rs 1,020 crore and PAT reached Rs 138.5 crore, but the public package still leaves important underwriting gaps around gross margin, working capital swings, segment mix, and realized pricing by assay and geography. The financial story is strong enough to justify IPO readiness, but not transparent enough to eliminate diligence dependency.
sections:
- id: SI_REVENUE-MODEL-AND-MONETIZATION-LOGIC
  title: Revenue model and monetization logic
  body: Revenue model and monetization logic is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Molbio's revenue model combines device placements, recurring assay and test-kit consumption, and associated platform workflows. The recurring consumables engine is visible in public reporting because FY25 kit volumes materially exceed annual device placements. Prognosys broadens the financial lens by adding radiology hardware exposure beyond core Truenat assays. A platform business mixing devices and assays usually carries different margin profiles across hardware and consumables, but public mix data remain absent. Molbio's commercialization appears more tender and program driven than subscription based, so revenue quality should be judged through throughput and replenishment rather than ARR heuristics. Public sources do not reveal segment revenue by disease or geography, which limits precision on mix quality. Even so, the available
    data support a real operating business rather than a pre-revenue platform story. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
