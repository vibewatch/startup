  - TI004
- id: SI_CAPITAL-ADEQUACY-AND-REMAINING-DILIGENCE-BLOCKERS
  title: Capital adequacy and remaining diligence blockers
  body: Capital adequacy and remaining diligence blockers is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Molbio plans to use fresh IPO proceeds for an R&D facility, center of excellence, connected office space, and plant and machinery. That use-of-funds profile implies continuing capital needs despite current profitability. Public trackers place total capital raised at roughly US$124 million or about Rs 970 crore equivalent, which looks modest relative to current revenue scale. Molbio's financial quality is helped by the fact that its product is physically manufactured, clinically relevant, and already deployed, not a purely speculative R&D pipeline. But financial opacity remains meaningful because no public source breaks revenue by assay, geography, customer type, or margin. For underwriting, the strongest public metrics are revenue, PAT, growth, margin headline, units sold, and capacity. The most important missing metrics
    are gross margin by category, working-capital cycle, receivables aging, and channel concentration. Overall, Molbio's financial picture is good enough to support a positive diligence stance, but not good enough to eliminate data-room dependency. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
