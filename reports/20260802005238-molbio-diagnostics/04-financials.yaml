- id: SI_SCALE-GROWTH-AND-PROFITABILITY-EVIDENCE
  title: Scale, growth, and profitability evidence
  body: Scale, growth, and profitability evidence is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Molbio generated Rs 1,020 crore of FY25 revenue from operations. FY25 profit after tax reached Rs 138.5 crore. FY25 revenue grew about 21.98% from FY24. Public reporting also says FY25 EBITDA margin stood at 26.17%. ROCE stood at 22.06% in FY25 according to Entrackr's DRHP-based summary. Molbio spent roughly Rs 0.80 to earn one rupee of revenue in FY25 versus Rs 0.82 in FY24. These reported profitability metrics support the view that Molbio has moved beyond the post-COVID slump. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CI008
