- id: SI_COST-STRUCTURE-AND-CAPITAL-INTENSITY
  title: Cost structure and capital intensity
  body: Cost structure and capital intensity is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Total expenses reportedly increased to about Rs 820 crore in FY25. Raw material consumption was about Rs 413 crore, making it the single largest visible cost bucket. Employee benefits rose to about Rs 103 crore in FY25. Advertising and marketing spend rose to roughly Rs 22 crore in FY25, showing some willingness to spend behind commercial expansion. The DRHP text shows annual device capacity of 3,600 units and annual kit capacity of 3.9 crore units. Five manufacturing units across Goa, Bengaluru, and Visakhapatnam reinforce that Molbio carries real capex and operations intensity. The audited standalone financial PDFs are publicly available, even though their extracted text is sparse and requires manual review for fine-grained footnotes. The balance of evidence in this section is good enough to frame an investment view, but remaining
    private-data gaps should still be tested in management diligence.
  claimRefs:
  - CI015
  - CI016
  - CI017
