chapter:
  number: 6
  title: Customers
  summary: Molbio's customer story is strongest when framed as a deployment network rather than a classic SaaS account list. Public evidence points to ministries of health, TB programs, public-health partners, and selected hospitals or labs as the real buyers, with users at peripheral clinics and labs. Named proof from Uganda, Zimbabwe, Nigeria, India, and multi-country TB rollouts demonstrates real adoption, but public disclosure still does not provide clean customer concentration or reorder-cohort data.
sections:
- id: SU_CUSTOMER-SEGMENTATION-AND-BUYER-MODEL
  title: Customer segmentation and buyer model
  body: Customer segmentation and buyer model is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Molbio's customers are best understood as public-health systems, national programs, and donor-backed procurement channels rather than a narrow list of named enterprise accounts. In India, the National Tuberculosis Elimination Programme is the clearest domestic anchor for Truenat deployment. Public-health buyers, not end patients, typically control procurement decisions for Molbio's core TB use case. Users are often nurses, lab staff, or clinic workers in peripheral facilities rather than central-lab specialists. Internationally, donors, ministries of health, and implementation partners appear to mediate a large share of customer acquisition. This customer structure means adoption quality is better measured by active sites and test throughput than by classical account counts. Public evidence for private-provider adoption exists but
    is much thinner than the public-health deployment evidence. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: SU_ADOPTION-TRAJECTORY-AND-GEOGRAPHY
  title: Adoption trajectory and geography
  body: Adoption trajectory and geography is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Molbio publicly claims reach across more than 85 countries, which is a meaningful geography-diversification signal. The multi-country iNTP rollout covers nine high-burden countries across Asia and Africa. The first phase includes Nigeria, DRC, Uganda, Kenya, Zimbabwe, Bangladesh, Cambodia, Vietnam, and the Philippines. In India, public reporting says Truenat has been deployed in more than 3,500 PHCs and CHCs under NTEP. Earlier funding-round coverage also cited more than 5,000 testing centers across 40-plus countries, showing the footprint widened over time. Public sources therefore show meaningful geography diversification even if they do not disclose revenue by country. Installations alone are not enough to prove durable revenue, but they do confirm non-pilot operating reality. The balance of evidence in this section is good enough
    to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
