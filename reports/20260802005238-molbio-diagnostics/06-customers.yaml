- id: SU_DURABILITY-USAGE-AND-REPEAT-VALUE-SIGNALS
  title: Durability, usage, and repeat-value signals
  body: Durability, usage, and repeat-value signals is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Public customer durability is visible mainly through usage and same-day diagnosis stories rather than renewal metrics. Same-day diagnosis matters because customer value in TB programs is measured by faster treatment initiation and reduced loss to follow-up. Program case studies repeatedly emphasize training, workflow redesign, and strategic placement as success factors for customer outcomes. This means customer success is operationally intensive and not purely driven by a box sale. Public sources do not disclose NRR, GRR, or contractual renewal terms, so retention remains an inferred rather than directly measured strength. Throughput evidence from Uganda and country rollout materials suggests at least some installed-base activation is real. The balance of evidence in this section is good enough to frame an investment view,
    but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  tableRefs:
  - TU004
- id: SU_EXPANSION-AND-CONCENTRATION-RISKS
  title: Expansion and concentration risks
  body: Expansion and concentration risks is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Molbio's customer expansion path likely includes adjacent disease programs on top of existing public-health relationships. HPV, hepatitis, and outbreak-response materials suggest Molbio wants to reuse installed trust and infrastructure beyond TB. Customer concentration risk is still likely high because public-health and donor channels dominate the visible customer set. Revenue concentration cannot be quantified from public data because site, country, and program revenue splits are not disclosed. The strongest customer proof is therefore deployment depth in named countries rather than a polished enterprise-logo list. Molbio's adoption case is compelling for a public-health diagnostics company, but still under-documented by commercial SaaS-style metrics. For diligence, the next step is to convert installation narratives into reorder,
    utilization, and geography-level revenue cohorts. Overall, public evidence supports real customer adoption, but not yet full transparency on durability or concentration. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
