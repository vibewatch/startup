- id: SU_NAMED-CUSTOMER-PROOF
  title: Named customer proof
  body: Named customer proof is best understood by combining the strongest evidence from filings, official materials, and independent reporting. Uganda is one of the strongest named case studies because Molbio cites 38 healthcare facilities connected to the technology. The Uganda case study says 16,000 TB tests were performed between July and December 2022 with 675 positives identified. The same Uganda case study says 26 rifampicin resistance cases were identified and that rapid molecular testing increased by 26.7%. Zimbabwe is highlighted by Molbio as a case where Truenat supported a national TB response in challenging infrastructure conditions. Nigeria is another major proof point because public materials discuss deployment of 333 Truenat devices for TB and DR-TB diagnostics. The iNTP rollout story indicates that several countries had already completed installations while others were still underway, showing phased production use rather than mere pilot rhetoric. These country examples provide
    stronger customer proof than generic website claims because they include specific facilities, tests, or device counts. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
