evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-date
    missingEvidence: A management-approved narrative that reconciles 2000 legal incorporation with later startup-era references.
    whyItMatters: Founding chronology is a cover fact and affects how investors frame Molbio's maturity and execution duration.
    diligencePath: >-
      Ask management and counsel to reconcile legal-entity history, operating pivot history, and any predecessor
      businesses.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current employee count and functional split by manufacturing, R&D, commercial, and support roles.
    whyItMatters: Headcount is required to judge productivity, labor intensity, and public-company readiness.
    diligencePath: Request an HR snapshot and the last twelve months of hiring and attrition data.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: governance-detail
    missingEvidence: Board committee composition, meeting cadence, and committee charters beyond policy headlines.
    whyItMatters: IPO execution quality depends on governance architecture, not just named directors.
    diligencePath: Review governance annexures and committee charters from the RHP when available.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: country-som
    missingEvidence: Country-level installed-base, active-site, and tender pipeline data by geography and disease.
    whyItMatters: Without site-level and geography-level deployment data, SOM estimates remain top-down abstractions.
    diligencePath: Request installed-base cohorts, country revenue mix, and tender pipeline schedules.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: buyer-budgets
    missingEvidence: Procurement budgets and actual realized pricing in India and major LMIC tenders.
    whyItMatters: Budget ownership and realized pricing determine revenue capture, not just market need.
    diligencePath: Review procurement contracts and donor-negotiated price lists.
    relatedQuestionRefs:
      - QM025
  - type: stale
    severity: minor
    topic: market-studies
    missingEvidence: A 2026-independent update that reconciles third-party market-study methodologies for POC molecular diagnostics.
    whyItMatters: Top-down market studies disagree on scope and CAGR even when direction is similar.
    diligencePath: Refresh with 2026 analyst notes or management-commissioned market triangulation.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: installed-base-retention
    missingEvidence: Retention and re-order data by country, site, and assay cohort.
    whyItMatters: Without retention and reorder data, competitive durability is inferred rather than demonstrated.
    diligencePath: Request installed-base cohorts, service logs, and consumables reorder histories.
    relatedQuestionRefs:
      - QP022
  - type: private-evidence-only
    severity: material
    topic: tender-pricing
    missingEvidence: Tender-level pricing versus Xpert and other benchmark systems by geography.
    whyItMatters: Competitive wins in diagnostics are heavily influenced by price and service economics.
    diligencePath: Review major tender submissions and any donor-negotiated price schedules.
    relatedQuestionRefs:
      - QP014
  - type: missing-source
    severity: minor
    topic: roche-direct-tb-positioning
    missingEvidence: A cleaner direct source connecting Roche to TB-specific decentralized testing rather than diagnostics generally.
    whyItMatters: Roche is more a trust benchmark than a perfect product-level peer in current public evidence.
    diligencePath: Fetch Roche TB-specific assay or menu pages before a refresh.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Gross margin by device, kit, and assay family, plus inventory and warranty assumptions.
    whyItMatters: >-
      A diagnostics IPO cannot be fully underwritten from EBITDA and PAT alone without understanding contribution
      margins.
    diligencePath: Request audited management accounts, product-level gross margin bridge, and warranty-cost history.
    relatedQuestionRefs:
      - QI016
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Pipeline conversion, channel mix, CAC, payback, and reorder dynamics by geography.
    whyItMatters: Commercial efficiency determines whether profitable growth is durable or tender-cycle dependent.
    diligencePath: Review CRM funnel data, sales compensation design, and reorder cohorts.
    relatedQuestionRefs:
      - QI017
  - type: private-evidence-only
    severity: material
    topic: working-capital
    missingEvidence: Receivables aging, inventory turns, and customer concentration in public-health accounts.
    whyItMatters: Working-capital stress can matter even in profitable manufacturing businesses.
    diligencePath: Request monthly working-capital dashboards and top-customer receivables.
    relatedQuestionRefs:
      - QI023
  - type: private-evidence-only
    severity: material
    topic: reliability-data
    missingEvidence: Installed-base uptime, maintenance intervals, failure rates, and service-response metrics by geography.
    whyItMatters: A field-deployed hardware platform is only as good as its uptime and service economics at scale.
    diligencePath: Request device reliability dashboards and service logs by installed cohort.
    relatedQuestionRefs:
      - QE024
  - type: private-evidence-only
    severity: material
    topic: menu-economics
    missingEvidence: Assay-level contribution margins and utilization by disease family.
    whyItMatters: Multi-disease menu breadth matters only if the economics and throughput improve return on installed devices.
    diligencePath: Review device utilization and gross margin by assay category.
    relatedQuestionRefs:
      - QE021
  - type: private-evidence-only
    severity: minor
    topic: post-market-surveillance
    missingEvidence: Formal post-market surveillance and complaint trend data for major assay families.
    whyItMatters: Trust claims are stronger when supported by operational quality disclosure, not only validation studies.
    diligencePath: Request QA dashboards, complaint logs, and regulator correspondence where available.
    relatedQuestionRefs:
      - QE024
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof-and-revenue-concentration
    missingEvidence: Revenue share by country, program, and top public-health customer relationships.
    whyItMatters: A wide country footprint does not necessarily imply diversified revenue.
    diligencePath: Request country-level revenue mix and top-customer concentration schedules.
    relatedQuestionRefs:
      - QU024
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: reorder-cohorts
    missingEvidence: Assay reorder, active-site utilization, and repeat-purchase cohorts by installed base.
    whyItMatters: Installations matter only if they convert into sustained throughput and consumables demand.
    diligencePath: Review reorder cohorts and monthly test-volume dashboards by site.
    relatedQuestionRefs:
      - QU019
  - type: private-evidence-only
    severity: minor
    topic: private-provider-proof
    missingEvidence: Named private hospital and private lab references with production-scale usage details.
    whyItMatters: Private-channel upside is part of the story but weakly evidenced today.
    diligencePath: Collect reference customers outside public-health channels.
    relatedQuestionRefs:
      - QU017
  - type: private-evidence-only
    severity: material
    topic: service-metrics
    missingEvidence: Uptime, field service, and maintenance metrics by installed cohort and geography.
    whyItMatters: Service quality is a key transmission path from operational risk into customer durability and valuation.
    diligencePath: Request service dashboards, maintenance intervals, and spare-parts performance metrics.
    relatedQuestionRefs:
      - QR023
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: concentration-metrics
    missingEvidence: Country, program, and top-customer concentration figures.
    whyItMatters: Procurement concentration can quickly translate into revenue volatility.
    diligencePath: Review geography- and channel-level revenue concentration schedules.
    relatedQuestionRefs:
      - QR014
  - type: private-evidence-only
    severity: material
    topic: quality-surveillance
    missingEvidence: Complaint trends, CAPA history, recalls, and formal post-market surveillance metrics.
    whyItMatters: Diagnostics trust can erode rapidly after quality failures, especially in public-health channels.
    diligencePath: Request QA logs, CAPA summaries, and any regulator correspondence.
    relatedQuestionRefs:
      - QR011
  - type: private-evidence-only
    severity: blocking
    topic: ipo-pricing
    missingEvidence: Final IPO price band, updated financial disclosures, and full RHP terms.
    whyItMatters: The recommendation can change materially with price even if the company quality does not.
    diligencePath: Wait for RHP and roadshow disclosures before setting an aggressive entry recommendation.
    relatedQuestionRefs:
      - QV015
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cash
    missingEvidence: Gross margin by product, working-capital data, and cash-generation profile.
    whyItMatters: Valuation discipline requires more than PAT and EBITDA headlines.
    diligencePath: Request detailed management accounts and working-capital schedules.
    relatedQuestionRefs:
      - QV024
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue concentration by geography, program, and customer cohort.
    whyItMatters: Public-market investors will discount businesses with hidden concentration risk.
    diligencePath: Review top-customer and top-country revenue mix before underwriting.
    relatedQuestionRefs:
      - QV023
    relatedTableRefs:
      - TV004
