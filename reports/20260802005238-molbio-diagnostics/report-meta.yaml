companyProfile:
  summary: 'Molbio Diagnostics is one of the stronger late-stage Indian healthtech businesses on the public record: it has a real product moat in portable molecular diagnostics, meaningful global-public-health relevance through Truenat, a profitable FY25, and a credible pre-IPO financing and manufacturing story. The company sells a hardware-plus-consumables workflow, not software, so the underwriting case depends on installed-base activation, public-health procurement durability, assay reorders, and field service execution. The public story is compelling, but deeper concentration, service, and margin disclosure is still needed before aggressive underwriting.'
  foundedDate: '2000-01-01'
  founders:
  - name: Sriram Natarajan
    role: Founder-Director and CEO
    background: Public face and operating leader most consistently associated with scaling Truenat and Molbio's global public-health platform.
    claimRefs:
    - CO008
  - name: Dr. Chandrasekhar Bhaskaran Nair
    role: Promoter / scientific co-builder
    background: Promoter-scientist figure tied to the company's technical development and promoter-control structure.
    claimRefs:
    - CO009
  foundingLocation: Goa, India
  headquarters: Panaji / Verna, Goa, India
  productSummary: 'Molbio sells the Truenat decentralized molecular diagnostics platform: Trueprep sample preparation, Truelab analyzers, and assay chips for TB, rifampicin resistance, HPV, hepatitis, influenza, malaria, and other infectious-disease workflows built for battery-operated, low-infrastructure settings.'
  customerFocus: National TB programs, ministries of health, donor-backed LMIC procurement channels, public hospitals, and selected healthcare providers needing decentralized molecular testing.
  businessModel: Hardware-plus-consumables diagnostics model in which device placements create recurring assay-kit demand, supported by training, deployment, and program relationships.
  stage: pre-IPO profitable unicorn
  fundingStatus: Last clearly confirmed private valuation is the September 2022 $85M round at about $1.6B; the 2025 DRHP opens an IPO path with a Rs 200 crore fresh issue and an OFS by existing holders.
