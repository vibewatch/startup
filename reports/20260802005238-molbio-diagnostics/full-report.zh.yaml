      - number: '2.5'
        title: 约束、数据质量与可执行市场结论
        blocks:
          - type: paragraph
            body: >-
              约束、数据质量与可执行市场结论，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。政策执行风险仍然重要，因为 WHO
              背书本身并不保证招标预算、分发能力或算法遵循。市场规模摘要可用于判断方向，但精度不足，不能单独作为 Molbio 的 SOM
              模型。公开来源对买方预算和招标层面经济性披露仍很弱，尤其是具体国家落地。最强的可执行市场信号不是自上而下的 TAM，而是反复出现的证据：高负担项目愿意大规模采购分散式分子检测。Molbio 受益于 HPV、肝炎和
              STI 检测等相邻机会，但 TB 仍是解释分散式 PCR 价值的最锐利证明点。私营服务提供者需求最重要的作用，是在公共卫生可信度建立后的第二层变现。Molbio
              的可服务市场因此有吸引力，但真正采用瓶颈是执行纪律，而非纯粹市场规模。承销时，投资者应把项目准入证据和吞吐量经济性看得比标题式 TAM
              膨胀更重要。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
