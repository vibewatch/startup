  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与替代方案集合
        blocks:
          - type: paragraph
            body: >-
              格局与替代方案集合，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。Molbio 的竞争集合包括直接 TB 分子平台、更广泛传染病分子系统和非分子诊断替代方案。Cepheid 是最重要参照，因为
              Xpert 十多年前就为快速分子 TB 检测建立了基准。WHO 的 TB 材料明确把 Truenat 放在与 Xpert 的关系中讨论，而非孤立讨论，说明市场把二者看作可比类别。Tracxn 将 Molbio
              归为即时分子诊断平台，而非通用实验室设备供应商。Tracxn 的同业名单显示，Molbio 参与的是全球诊断竞争集合，不只是印度本土创业公司队列。传统涂片显微镜在低资源 TB
              场景仍是间接竞争者，因为预算受限的项目不会立即升级。中心化参考实验室 PCR 也是另一种替代方案，适用于吞吐量胜过即时便利性的场景。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
