  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑与反向逻辑，需要把监管文件、官方材料和独立报道里的最强证据放在一起看。核心投资逻辑是，Molbio 同时具备真实收入、真实盈利、公共卫生相关性和差异化的现场部署平台。不同于许多医疗科技
              独角兽，Molbio 有 FY25 盈利的公开证据，而不只是增长叙事。公司也有制造产能、已装机部署验证，以及 WHO
              支持的产品可信度。这些因素支撑对业务质量本身的正面基本面判断。反向逻辑是，公共卫生集中度、利润率不透明和 IPO 估值不确定性，可能让公开市场进入点远不如经营故事有吸引力。采购周期很重要，因此 Molbio
              不是纯经常性收入软件故事，也不应按软件公司估值。正确建议高度取决于价格纪律，而不能只靠对业务的欣赏。本节证据足以支撑投资判断框架，但管理层尽调仍需验证剩余的私有数据缺口。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
