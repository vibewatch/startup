      - number: '3.2'
        title: 在位平台对比
        blocks:
          - type: paragraph
            body: >-
              在位平台对比，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。Hologic 更像中心化分子诊断在位者，而不是最后一公里 TB 设备同业。Abbott 的传染病产品组合体现了 Molbio
              在全球尚未具备的分子检测项目广度和诊断基础设施装机。QIAGEN 重要，是因为其诊断组合覆盖传染病和围绕 TB 的临床工作流，尽管形态与 Truenat 不同。Roche 是诊断领域的规模和信任基准，但与
              Truenat 的现场部署逻辑匹配度较低。Cepheid 的系统页面展示了远比 Molbio 当前公开披露更广的装机菜单，尤其在 TB 和公共卫生用例之外。Molbio 的菜单广度仍有意义，因为 Truenat
              可在同一平台上覆盖 TB、病毒性肝炎、HPV、流感、疟疾和其他传染病需求。因此，竞争比较应把吞吐量型在位者与分散式工作流专家分开。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
