  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              市场边界与规模测算口径，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。Molbio 的市场应界定为分子诊断、即时分子诊断和高负担传染病检测的重叠区。Molbio IPO 材料采用的 1Lattice
              报告，将 CY24 全球分子诊断市场估为 US$18.1 billion。该报告预测市场到 CY29 达到 US$28.4 billion，隐含 9.4% CAGR。MarketsandMarkets 对
              2030 年前分子诊断给出大体同向的乐观判断，但方法和范围不同。1Lattice 报告称，CY24 传染病占全球分子诊断市场 46.4%。在同一市场研究中，PCR 仍是分子诊断内部最大技术类别，占比
              42.9%。整体分子诊断市场足够大，Molbio 不需要赢下大范围医院实验室，也能支撑持续增长。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
