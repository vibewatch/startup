              持久性、使用量与重复价值信号，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。公开客户持久性主要通过使用和当日诊断故事体现，而不是续约指标。当日诊断重要，因为 TB
              项目的客户价值由更快启动治疗和减少失访来衡量。项目案例研究反复强调，培训、工作流重设计和战略性布点是客户成效的成功因素。这意味着客户成功需要高强度运营，并不纯粹由卖出一台设备驱动。公开来源没有披露 NRR、GRR
              或合同续约条款，因此留存仍是推断出来的优势，而非直接测量。Uganda 和国家推广材料中的吞吐量证据显示，至少部分装机基础激活是真实的。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
