      - number: '3.3'
        title: Molbio 真正不同之处
        blocks:
          - type: paragraph
            body: >-
              Molbio 真正不同之处，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。Molbio 最强的竞争边，是部署到无法稳定支撑中心化分子实验室的外周场景。电池供电和更低基础设施依赖，是 Truenat
              比许多在位系统更容易进入 LMIC 初级医疗场景的核心原因。WHO 背书缩小了它与全球在位者的信任差距，因为该背书验证的是临床类别，而不只是公司营销。来自 Cameroon、Uganda
              和多中心研究的同行评议比较显示，在若干用例中，Truenat 表现与 Xpert 方向上可比。Molbio
              在披露的服务规模、跨国销售覆盖和可能的售后支持密度上弱于全球在位者。大型在位者也有更强打包潜力，因为它们能向更广的医院和实验室菜单销售，而不只押注一个公共卫生切口。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
