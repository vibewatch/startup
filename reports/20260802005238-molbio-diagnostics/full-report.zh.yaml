      - number: '1.3'
        title: 资本结构与投资者支持
        blocks:
          - type: paragraph
            body: >-
              Molbio 的融资历史重要，不只是因为它确认了独角兽身份，也因为公司正从私募融资转向公开上市路径，募集资金用途和股东退出会受到更严格审视。Molbio 2022 年 9 月完成 $85 million
              融资，Temasek 领投，Motilal Oswal Alternates 参与，随后进入印度独角兽俱乐部。公司和媒体报道称，该轮融资将 Molbio 估值推至约 $1.6 billion。Economic
              Times 报道，COVID 带动规模化期间，轮前讨论已经反映出 Molbio 的二级市场需求很强。2025 年 DRHP 开启新的资本市场阶段：Rs 200 crore 新股发行，并出售最多 1.25
              crore 股老股。IPO 文件披露的资金用途集中在 R&D 设施、卓越中心、办公空间，以及 Goa 和 Visakhapatnam 单元设备。Moneycontrol 报道，正式定价发现前，投行曾讨论约 Rs
              22,000-24,000 crore 的潜在 IPO 估值区间。公开追踪器显示，Molbio 累计融资约 $124 million，或按来源和换算口径约 Rs 970
              crore。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
