              架构、耗材与运营依赖，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。关键技术特征包括电池供电、冻干试剂、低生物安全要求，以及重要耗材的室温稳定性。TB 手册引用若干检测项目的试剂在最高 30°C
              下两年稳定，支撑低资源部署主张。最小化提取洗脱体积和污染控制设计，也是公开营销的技术包一部分。平台依赖基于试剂匣的提取步骤和一次性耗材，简化了现场使用，但仍需要操作员培训。Bigtec
              很重要，因为它是开发检测项目并支撑平台可扩展性的 R&D 引擎。因此，产品护城河结合了硬件设计、化学、工作流和检测项目开发，而不只是软件。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
