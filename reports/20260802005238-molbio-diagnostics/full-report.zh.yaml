            body: >-
              竞争与路线图风险，需要把监管文件、官方材料和独立报道里的最强证据放在一起看。Cepheid
              这一类替代方案已经扎根，并获得全球信任，竞争风险仍然真实。一个主要风险是，既有玩家把便携性、融资和服务包改进到同样的现场场景里，侵蚀 Molbio
              的优势。另一个风险是，买方为了简化培训、服务和采购，围绕单一供应商平台标准化。检测项目路线图很宽，也带来优先级风险：延伸太多会稀释核心 TB 和传染病基础的注意力。如果私营服务方多元化没有兑现，Molbio
              对采购的敏感度可能高于投资者预期。本节证据足以支撑投资判断框架，但管理层尽调仍需验证剩余的私有数据缺口。
