              设施、卓越中心、相连办公空间以及厂房和机器设备。该资金用途表明，即便目前盈利，公司仍有持续资本需求。公开追踪器显示，累计融资约 US$124 million，或约 Rs 970 crore
              等值；相对于当前收入规模，这一数字看起来不高。Molbio 的财务质量受益于一个事实：产品是实物制造、有临床价值且已经部署的，不是纯投机 R&D
