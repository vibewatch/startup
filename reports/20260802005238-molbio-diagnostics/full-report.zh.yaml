        title: 里程碑与战略延伸
        blocks:
          - type: paragraph
            body: >-
              2020 年以来的里程碑显示，公司在用 Truenat 核心平台向相邻检测项目、公共卫生项目和硬件相邻领域扩张，同时为公开市场做准备。WHO 对 Truenat 的 TB 背书，实质性改变了 Molbio
              的定位：从印度创新者变成全球可接受的 TB 平台供应商。印度、非洲和亚洲的公共卫生落地故事显示，Molbio 把平台验证转化为国家项目部署。Nipah 检测获得紧急授权，证明 Molbio
              能把平台快速延伸到疫情响应场景。对 OptraSCAN 的投资显示，Molbio 愿意把资本投向核心 PCR 检测之外的相邻健康科技品类。World Health Assembly 的认可强化了 Molbio
              在全球健康利益方中的声誉。盈利运营、制造规模和进行中的 IPO 进程结合，让 Molbio 区别于许多仍在亏损的印度健康科技独角兽。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
