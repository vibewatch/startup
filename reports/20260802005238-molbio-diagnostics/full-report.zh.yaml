      - number: '7.2'
        title: 运营与产品执行风险
        blocks:
          - type: paragraph
            body: >-
              运营和产品执行风险，也要把监管文件、官方材料和独立报道里的最强证据放在一起看。Molbio 既生产硬件和耗材，又服务装机设备，还要在多个地区支持一线工作流，运营风险不低。5
              座制造设施意味着产能规划、QA、物流、维护都有实打实的执行负荷。向 Ebola 和 Nipah 等疫情响应场景扩张，战略上有吸引力，但也把核心 TB
              部署之外的技术和监管工作量拉高。切入病理、乳腺癌筛查或镰状细胞检测等邻近领域，增加了选择权，也会分散管理层注意力。工作流复杂度很关键，因为部署在现场的 PCR 系统仍依赖操作员培训和耗材纪律。Uganda
              案例研究明确提到，对部分实验室人员而言，Truenat 比 GeneXpert
              需要更多手工操作。这不推翻平台价值，但说明即使当天诊断更优，采用阻力仍可能存在。本节证据足以支撑投资判断框架，但管理层尽调仍需验证剩余的私有数据缺口。
