companyProfile:
  summary: >-
    Molbio Diagnostics 是公开资料中更强的印度后期健康科技公司之一：便携式分子诊断具备真实产品护城河，Truenat 带来有意义的全球公共卫生价值，FY25 已盈利，IPO
    前融资和制造叙事也可信。公司卖的是硬件加耗材工作流，不是软件；承销判断取决于装机基础激活、公共卫生采购韧性、检测项目复购和现场服务执行。公开叙事有吸引力，但在激进承销前，仍需要更深入披露集中度、服务和利润率。
