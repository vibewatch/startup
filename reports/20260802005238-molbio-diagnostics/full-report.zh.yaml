      - number: '2.3'
        title: 买方、用户与支付方图谱
        blocks:
          - type: paragraph
            body: >-
              买方、用户与支付方图谱，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。Molbio 的现实买方是卫生部、国家 TB 项目、捐助方支持的采购方、公立医院和部分私营服务提供者，而不是个人消费者。TB
              项目里，买方往往是卫生部或捐助方，用户是实验室或诊所工作人员，患者既不是支付方，也不是采购决策者。Stop TB、USAID、Global Fund 和 Unitaid
              等来源显示，可负担性和维护承诺会实质影响买方采用。India Health Fund 和 CHAI 材料进一步说明，最后一公里诊断可及性是服务交付问题，不只是硬件问题。在印度，NTEP 已将 Truenat
              纳入用快速分子检测替代涂片显微镜的全国推进。高负担 LMIC 对 Molbio 尤具吸引力，因为分散式 PCR
              消除了样本运输延迟、电力脆弱和长周转时间。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
