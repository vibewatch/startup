      - number: '7.3'
        title: 客户、渠道与采购依赖
        blocks:
          - type: paragraph
            body: >-
              客户、渠道与采购依赖，需要把监管文件、官方材料和独立报道里的最强证据放在一起看。公共卫生渠道集中，是最大的业务风险之一，因为部委、捐赠方和国家项目主导了可见需求。招标延迟、资金缺口或诊疗算法变化，即使产品技术可信，也可能拖慢设备铺设和耗材消耗。Global
              Fund 合作降低了部分可负担性风险，但也反过来确认，捐赠方支持的采购对投资逻辑有多关键。公开市场或宏观波动同样重要，因为诊断企业的 IPO 偏好有周期性，可能脱离 Molbio
              的经营进展而变化。因此，一部分执行风险落在管理层控制之外，软件公司通常不会面对这种风险。不过，同样的渠道集中，在政策方向和捐赠方支持站到 Molbio
              一边时，也可以成为优势。本节证据足以支撑投资判断框架，但管理层尽调仍需验证剩余的私有数据缺口。
