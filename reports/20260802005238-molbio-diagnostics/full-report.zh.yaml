            body: >-
              采用轨迹与地域，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。Molbio 公开称覆盖超过 85 个国家，这是有意义的地域多元化信号。多国 iNTP 推广覆盖亚洲和非洲 9 个高负担国家。第一阶段包括
              Nigeria、DRC、Uganda、Kenya、Zimbabwe、Bangladesh、Cambodia、Vietnam 和 Philippines。在印度，公开报道称 Truenat 已在 NTEP
              下部署到超过 3,500 个 PHC 和 CHC。更早融资轮报道还提到 40 多个国家、超过 5,000
              个检测中心，显示足迹随时间扩大。因此，公开来源显示出有意义的地域多元化，即便它们没有按国家披露收入。安装本身不足以证明收入持久，但确实确认了非试点运营现实。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
