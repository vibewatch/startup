      - number: '8.5'
        title: 最终尽调事项与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              最终尽调事项与投资逻辑破裂触发点，需要把监管文件、官方材料和独立报道里的最强证据放在一起看。因此，价格发现前的建议应是观察，而不是直接买入。信心应为中等，因为业务质量可见，但若干估值关键指标仍未公开。风险评级应为高，因为采购集中度、利润率不透明和公开市场定价风险仍未解决。估值立场应根据最终
              IPO 定价落在合理到偏高之间；在定价前，若采用 2024 目标估值报道，默认更偏向偏高。若 IPO 估值在制造和招标风险存在的情况下仍假设高端软件式倍数，投资逻辑就会破裂。另一个破裂触发点，是证据显示 FY25
              盈利无法转化为可持续的上市后现金生成。最终尽调应聚焦按品类拆分的毛利率、按国家和客户拆分的集中度、服务质量，以及复购强度。总体估值结论是：公司质量正面，但进入价格必须有纪律。本节证据足以支撑投资判断框架，但管理层尽调仍需验证剩余的私有数据缺口。
