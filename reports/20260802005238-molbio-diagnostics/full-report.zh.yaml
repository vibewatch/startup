      - number: '2.2'
        title: POCT 增长与区域背景
        blocks:
          - type: paragraph
            body: >-
              POCT 增长与区域背景，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。Grand View 估计，全球即时分子诊断市场 2023 年为 US$8.17 billion，2024 年为 US$8.70
              billion。Grand View 预测，即时分子诊断到 2030 年将达到约 US$10.12 billion。同一 Grand View 摘要称，分散式实验室在 2023 年占市场 42.66%，与
              Molbio 的现场使用逻辑高度一致。1Lattice 报告将 APAC 定位为 CY24 全球最大 POCT 市场，并强调 MENA 和 Latin America 的高增长。在传染病 POCT
              内，1Lattice 报告认定 TB 是按市场价值计算最大的类别。同一报告估计，2024 年 TB 检测约 170.8 million 次，检测价值约 US$2.33
              billion。印度分子诊断机会具备结构性吸引力，因为它同时有高传染病负担和活跃的公共卫生采购体系。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
