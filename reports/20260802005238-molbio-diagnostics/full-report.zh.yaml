  foundingLocation: Goa, India
  headquarters: Panaji / Verna, Goa, India
  productSummary: Molbio 销售 Truenat 分散式分子诊断平台：Trueprep 样本制备、Truelab 分析仪，以及用于 TB、利福平耐药、HPV、肝炎、流感、疟疾和其他传染病工作流的检测芯片；这些工作流面向电池供电、低基础设施场景。
  customerFocus: 国家 TB 项目、卫生部、由捐助方支持的 LMIC 采购渠道、公立医院，以及需要分散式分子检测的部分医疗服务提供者。
  businessModel: 硬件加耗材的诊断模式：设备铺设带来反复的检测试剂盒需求，培训、部署和项目关系提供支撑。
