chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与法律基础
        blocks:
          - type: paragraph
            body: >-
              公开申报文件、公司官方材料和独立融资追踪器，对 Molbio 已成规模的印度分子诊断公司这一定位给出了相当一致的图景；同时也暴露出公司形式细节与风险投资式叙事的分歧。Molbio Diagnostics 总部在
              Goa，是一家围绕 Truenat 平台展开的即时分子诊断公司。2025 年 DRHP 显示，Molbio Diagnostics 背后的法律实体成立于 2000 年。二级创投数据库往往用更晚的创业公司视角描述
              Molbio，导致公开创立日期与法律实体时间线不一致。Molbio 的核心商业模式，是向公共卫生和医疗场景销售设备、检测项目及配套即时分子检测工作流。公司的旗舰 Truenat 平台便携、可电池供电，面向分散式
              PCR 检测。Molbio 将自己定位为医疗公平推动者，把金标准分子检测带入低资源场景。公开材料显示，Molbio 的注册和公司办公地点位于 Goa 的 Verna Industrial
              Estate。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
