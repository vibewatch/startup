  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分与买方模型
        blocks:
          - type: paragraph
            body: >-
              客户细分与买方模型，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。Molbio 的客户最好理解为公共卫生系统、国家项目和捐助方支持的采购渠道，而不是一份狭窄的具名企业账户清单。在印度，National
              Tuberculosis Elimination Programme 是 Truenat 部署最清晰的国内锚点。公共卫生买方而非终端患者，通常控制 Molbio 核心 TB
              用例的采购决策。用户往往是外周设施中的护士、实验室人员或诊所工作人员，而不是中心实验室专家。在国际上，捐助方、卫生部和实施伙伴似乎介导了很大一部分客户获取。这种客户结构意味着，采用质量更适合用活跃站点和检测吞吐量衡量，而不是传统账户数。私营服务提供者采用的公开证据存在，但比公共卫生部署证据薄得多。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
