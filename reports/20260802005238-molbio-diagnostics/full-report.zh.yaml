        title: 竞争结论与未解问题
        blocks:
          - type: paragraph
            body: >-
              竞争结论与未解问题，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。最可能压缩差异化的路径，是在位者把便携性、融资和服务包改进后打入低资源场景。另一条压缩路径，是捐助方或卫生部围绕一个谈判平台标准化，缩小平行供应商采用空间。公开来源没有清楚量化装机基础留存，因此竞争韧性仍需要队列式现场证据。尽管如此，Molbio
              看起来具备竞争可信度，因为它已经进入与大得多的诊断公司同一套全球采购和政策对话。投资问题不是 Molbio
              有没有竞争，而是其现场优先的产品设计能否持续赢下足够多的招标和部署，形成实际规模。承销时，关键竞争基准仍是 Cepheid；Hologic、Abbott、QIAGEN 和 Roche
              则构成更广的信任和菜单背景。因此，Molbio 的竞争姿态有差异化，但并非不可攻破。要守住这一姿态，服务、定价和采购执行与检测科学同样重要。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
