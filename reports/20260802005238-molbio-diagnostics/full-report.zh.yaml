            body: >-
              具名客户证明，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。Uganda 是最强具名案例之一，因为 Molbio 提到 38 家医疗设施接入该技术。Uganda 案例研究称，2022 年 7 月至
              12 月期间完成 16,000 次 TB 检测，识别 675 例阳性。同一 Uganda 案例研究称，识别 26 例利福平耐药病例，快速分子检测增加 26.7%。Molbio 将 Zimbabwe
              作为案例强调：在充满挑战的基础设施条件下，Truenat 支持了全国 TB 响应。Nigeria 是另一个重大证明点，因为公开材料讨论了为 TB 和 DR-TB 诊断部署 333 台 Truenat
              设备。iNTP
              推广故事显示，多个国家已经完成安装，其他国家仍在推进，体现的是分阶段生产使用，而不只是试点话术。这些国家案例比泛泛的网站主张更强，因为它们包含具体设施、检测次数或设备数量。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
