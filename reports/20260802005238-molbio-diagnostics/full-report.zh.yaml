              - CV031
      - number: '8.4'
        title: 估值为什么可能合理或偏高
        blocks:
          - type: paragraph
            body: >-
              估值为什么可能合理或偏高，需要把监管文件、官方材料和独立报道里的最强证据放在一起看。Molbio 有产品可信度和当前盈利，理应相对疲弱或未盈利的医疗科技 公司享有溢价。但如果 IPO
              区间跑过公开证据能证明的利润率质量和集中度，Molbio 不应获得无纪律的溢价。公共卫生相关性可以支撑估值韧性，但不能抹掉渠道集中风险。最好的公开市场情景，是一次有纪律的 IPO，让 Molbio
              因盈利能力和平台相关性获得回报，同时不过度定价未来的完美兑现。最坏的公开市场情景，是高价上市，随后当投资者要求更细颗粒度的经济性时出现失望。本节证据足以支撑投资判断框架，但管理层尽调仍需验证剩余的私有数据缺口。
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
