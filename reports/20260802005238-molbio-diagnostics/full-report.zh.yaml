      - number: '8.2'
        title: 当前估值背景与建议框架
        blocks:
          - type: paragraph
            body: >-
              当前估值背景与建议框架，需要把监管文件、官方材料和独立报道里的最强证据放在一起看。最后一条明确确认的独角兽估值证据，是 September 2022 约 US$1.6 billion 的融资轮。Economic
              Times 和 Moneycontrol 后来描述的 IPO 目标更接近 Rs 22,000-24,000 crore，但这不等于已经定价的公开市场验证。2025 DRHP 确认 IPO
              路径已经启动，但抓取到的公开材料尚未披露最终价格区间。FY25 收入 Rs 1,020 crore、PAT Rs 138.5 crore，实质性强化了 Molbio 对公开市场准备度的主张。新股发行只有 Rs
              200 crore，说明 Molbio 并不是在财务困境中寻求 IPO
              资金。不过，老股出售部分显示，现有持有人流动性也是交易逻辑之一。因此，估值立场需要同时反映经营强度和卖方流动性动机。本节证据足以支撑投资判断框架，但管理层尽调仍需验证剩余的私有数据缺口。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
