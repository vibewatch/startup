      - number: '8.3'
        title: 乐观、基准与悲观逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观、基准与悲观逻辑，需要把监管文件、官方材料和独立报道里的最强证据放在一起看。乐观情景假设 Molbio 把 TB 领先地位转化为装机基础上的更广泛传染病、HPV
              和公共卫生利用。乐观情景还假设盈利能力可持续，且 IPO 定价发现停留在合理诊断企业倍数区间内。基准情景假设 Molbio
              仍是强劲但对采购敏感的诊断平台，公开估值应保持纪律。悲观情景假设，由于集中度、利润率不透明和招标周期性压制倍数，公开市场投资者拒绝较高 IPO
              区间。另一种悲观情景是，装机基础质量或复购强度低于部署头条所暗示的水平。资本强度仍然重要，因为 IPO
              募资用途指向新设施和设备，而不只是类软件扩张。因此，资金用途画像要求用制造和诊断视角看待公司，而不是纯轻资产技术视角。可比公司框架应更多靠近诊断和医疗技术执行质量，而不是泛医疗科技或 SaaS
              倍数。本节证据足以支撑投资判断框架，但管理层尽调仍需验证剩余的私有数据缺口。
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
