  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与披露风险
        blocks:
          - type: paragraph
            body: >-
              监管与披露风险，需要把监管文件、官方材料和独立报道里的最强证据放在一起看。Molbio
              目前看不到足以推翻投资逻辑的单一公开丑闻，但它处在监管、制造和公共卫生执行交织的高风险地带。监管风险是底层风险：检测质量、诊断声明、项目使用，一旦现场表现下滑，都可能引来严密审查。公司走向公开市场后，披露风险会上升，因为上市后很难再维持私营公司的不透明。上市后监督、投诉数据和召回历史，目前没有以足以关闭所有尽调问题的方式公开。任何服务脆弱公共卫生场景的诊断公司，只要大规模装机不能稳定产出结果，声誉都会受损。没有公开诉讼或召回头条是正面信号，但没有证据不等于零风险。因此，风险治理不能只看事故数量，也要看流程成熟度。本节证据足以支撑投资判断框架，但管理层尽调仍需验证剩余的私有数据缺口。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
