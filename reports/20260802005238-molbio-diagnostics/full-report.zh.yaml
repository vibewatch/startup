        title: 收入模式与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              收入模式与变现逻辑，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。Molbio 的收入模式结合了设备铺设、反复的检测项目和试剂盒消耗，以及配套平台工作流。公开报道中可以看到经常性耗材引擎，因为
              FY25 试剂盒销量显著高于年度设备铺设量。Prognosys 把财务视角拓宽到核心 Truenat
              检测之外的放射学硬件敞口。一个混合设备和检测项目的平台业务，通常在硬件与耗材之间有不同利润率结构，但公开混合数据仍缺失。Molbio
              的商业化看起来更多由招标和项目驱动，而非订阅驱动，因此收入质量应通过吞吐量和补货判断，而不是 ARR
              口径。公开来源没有披露按疾病或地域划分的分部收入，限制了对收入结构质量的精确判断。即便如此，现有数据支持这是一个真实运营业务，而不是收入前平台故事。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
