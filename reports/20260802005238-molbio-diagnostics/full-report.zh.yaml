        title: 验证与成本效益证据
        blocks:
          - type: paragraph
            body: >-
              验证与成本效益证据，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。多中心研究等同行评议证据发现，Truenat 在若干场景中的表现与 Xpert MTB/RIF 方向上可比。Pen-Nicholson
              多中心研究报告了高特异性，并在参考实验室对比中显示其与 Xpert 的正面对照表现可比。Uganda 和 Cameroon 研究进一步证明，Truenat
              在印度以外和真实世界项目环境中具备临床可用性。当便携性和分散式使用比原始吞吐量更重要时，最强产品优势会显现。当操作者优先考虑高通量中心实验室效率或更宽的在位者菜单时，最强产品弱点会显现。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
