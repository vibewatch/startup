      - number: '2.4'
        title: TB 与 LMIC 场景的采用驱动因素
        blocks:
          - type: paragraph
            body: >-
              TB 与 LMIC 场景的采用驱动因素，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。WHO 的快速沟通文件表示，快速分子检测是初始 TB 诊断和利福平耐药检测的护理标准。Global Fund
              表示，2021 年需要 TB 检测的人群中，不到 40% 能获得快速分子诊断。WHO 2024 年全球 TB 报告称，TB 在 2023
              年重新成为世界头号传染病杀手，进一步凸显加快诊断的紧迫性。样本到结果时间、电池供电和最低生物安全要求，比最大实验室吞吐量更重要时，Molbio
              的市场逻辑会增强。当日诊断是项目层面的优势，因为它缩短了检测到启动治疗之间的失访。公开来源反复将 Truenat
              定位为外周站点替代涂片显微镜的方案，而不是对高通量中心平台的整体替代。市场采用仍取决于培训、服务网络、试剂匣可用性、质量保证和国家算法更新。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
