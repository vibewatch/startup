      - number: '1.4'
        title: 经营规模与布局
        blocks:
          - type: paragraph
            body: >-
              规模指标显示，Molbio 已不再只是单一产品的疫情受益者。收入、产能和部署证据都指向更广泛的装机基础叙事，核心是 Truenat，支撑来自制造和国际渠道。Molbio 公布 FY25 经营收入 Rs 1,020
              crore。Molbio 公布 FY25 税后利润 Rs 138.5 crore。ET 和 Entrackr 汇总的 DRHP 口径报道显示，FY25 收入较 FY24 同比增长 21.98%。DRHP
              口径报道显示，公司 FY25 售出 2,180 台设备和 12.24 million 套检测试剂盒。截至 2025 年 3 月，已安装年产能为 3,600 台设备和 3.9 crore 套检测试剂盒。Molbio
              在 Goa、Bengaluru 和 Visakhapatnam 共有五个制造设施。Molbio 公开材料称，覆盖超过 85 个国家，触达超过 40 million
              人。公司没有公开披露清晰的当前员工数，限制了经营杠杆分析。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
