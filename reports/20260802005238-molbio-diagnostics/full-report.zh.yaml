  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Truenat 产品本质
        blocks:
          - type: paragraph
            body: >-
              Truenat 产品本质，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。Truenat 是一个即时实时 PCR 平台，设计目标是让及时分子诊断下沉。工作流将 Trueprep AUTO V2
              的样本制备与 Truelab 分析仪上的扩增和分析结合。Molbio 的公开产品叙事根植于把实验室级分子性能带到外周医疗场景。TB 仍是最重要证明点，因为该用例拥有 WHO 背书的公共卫生合法性。Truenat
              TB 检测项目是芯片式分子检测，可识别 Mycobacterium tuberculosis 和耐药标记。关键 TB
              工作流的样本到结果时间约为一小时，利福平耐药检测约为七十分钟。该平台面向当日诊断和启动治疗，特别适合中心实验室周转过慢的场景。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
