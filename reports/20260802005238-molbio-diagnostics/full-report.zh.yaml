        blocks:
          - type: paragraph
            body: >-
              一个诊断业务同时涉及监管检测、制造、招标驱动销售和全球健康伙伴关系，领导层质量就格外重要。公开证据显示，创始人保持连续性，治理也在逐步正规化。Sriram Natarajan 是公司和媒体材料中最常与
              Molbio 联系在一起的创始董事兼首席执行官。发起人集团包括 Sriram Natarajan、Dr. Chandrasekhar Bhaskaran Nair、家庭成员和 Exxora Trading
              LLP。DRHP 将 Bigtec 列为全资子公司，承载关键 R&D 能力。DRHP 还将 Prognosys Medical Systems 列为专注放射学产品的重大子公司。Tracxn
              和公司披露显示，Molbio 引入 Balram Bhargava、Arun Kumar Jha
              等有分量的公共卫生人士，以拓宽治理可信度。治理叙事在改善，但公开材料仍没有披露上市诊断同业常规发布的委员会层面细节。Molbio
