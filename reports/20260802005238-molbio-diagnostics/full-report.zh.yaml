      - number: '7.5'
        title: 估值风险、缓释因素与否决触发点
        blocks:
          - type: paragraph
            body: >-
              估值风险、缓释因素与否决触发点，需要把监管文件、官方材料和独立报道里的最强证据放在一起看。估值风险很实质，因为 IPO 前 叙事可能跑在公开市场愿意为诊断制造企业支付的价格前面。Economic Times
              报道称，围绕 2022 轮融资的私募市场谈判，最终接受的估值低于部分卖方预期，说明即使在高增长阶段，价格敏感性也存在。Moneycontrol 后来报道的 IPO
              目标区间高得多；如果公开市场投资者要求更严格的可比公司纪律，这一区间可能难以成立。剩余风险仍高，因为公开证据仍缺少毛利率细节、集中度数据、服务指标和完整治理披露。缓释信号也存在：盈利能力、WHO
              支持的产品合法性、已建成制造产能，以及多国重复部署验证。若出现明确证据显示装机站点不再复购检测项目，或采购渠道明显收窄，投资逻辑就会破裂。第二个破裂触发点，是重大质量或服务事件损害公共卫生体系对平台的信任。第三个破裂触发点，是
              IPO 定价发现要求的公开市场倍数，无法由收入质量和增长耐久性支撑。由于这些风险会直接传导到部署、复购率和估值，投资者应把 Molbio
              视为高潜力但执行风险高的标的。总体看，即使经营业务显然真实且具战略相关性，Molbio 仍应获得高剩余风险评级。本节证据足以支撑投资判断框架，但管理层尽调仍需验证剩余的私有数据缺口。
            claimRefs:
              - CR026
