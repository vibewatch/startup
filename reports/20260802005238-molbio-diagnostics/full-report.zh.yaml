      - number: '3.4'
        title: 护城河韧性与价格压力
        blocks:
          - type: paragraph
            body: >-
              护城河韧性与价格压力，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。随着快速分子 TB 检测从新技术类别变成协商采购类别，价格压力可能上升。Global Fund 和 Stop TB
              采购证据已经显示，价格和维护保证是竞争定位的一部分。耗材经济性重要，因为一个站点采用平台后，反复使用试剂匣或芯片会驱动该账户的生命周期经济性。切换成本应是中等，而非极高，因为如果性能、价格或服务恶化，项目可以改变诊断算法。因此，Molbio
              的护城河更多来自运营和工作流特异性，而不是绝对垄断。在发达、高通量、报销驱动的市场，Molbio 更可能被在位实验室平台替代，概率高于偏远公共卫生网络。在高负担 LMIC 场景中，Molbio
              的竞争逻辑更强，因为基础设施简单性直接影响诊断可及性。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
