      - number: '5.2'
        title: 菜单广度与平台延伸
        blocks:
          - type: paragraph
            body: >-
              菜单广度与平台延伸，需要把申报文件、官方材料和独立报道中的最强证据合在一起看。公开检测菜单已从 TB 扩展到流感、肝炎、HPV、疟疾、STI 和其他传染病类别。Truenat Assays
              页面和手册把平台定位为多疾病产品，而非单一项目产品。Molbio 也强调放射学和病理投资等相邻资产，但 Truenat 仍是技术重心。HPV 验证项目显示，Molbio
              试图把同一套分散式分子逻辑应用到女性健康和筛查用例。Nipah 授权和 Ebola
              部署材料显示，平台也面向疫情响应。菜单广度重要，因为多疾病菜单能提高每台装机设备的利用率。但仅有菜单广度不够；采用仍取决于经验证的工作流和项目纳入。本节证据足以形成投资判断，但管理层尽调仍需检验剩余的私有数据缺口。
