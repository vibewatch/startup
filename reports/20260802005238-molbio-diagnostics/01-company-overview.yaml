- id: SO_CAPITALIZATION-AND-INVESTOR-SUPPORT
  title: Capitalization and investor support
  body: Molbio's funding history matters not only because it confirms unicorn status, but also because the company is now moving from private fundraising into a public-listing pathway with more scrutiny around proceeds and shareholder exits. Molbio joined India's unicorn club in September 2022 after an $85 million financing led by Temasek with participation from Motilal Oswal Alternates. The 2022 financing valued Molbio at about $1.6 billion according to company and press reports. Economic Times reported that pre-round discussions already reflected strong secondary demand for Molbio during the COVID-enabled scale-up period. The 2025 DRHP launches a new capital-markets phase with a Rs 200 crore fresh issue and an offer for sale of up to 1.25 crore shares. Use of proceeds disclosed in the IPO filing focus on an R&D facility, center of excellence, office space, and equipment for Goa and Visakhapatnam units. Moneycontrol reported that bankers discussed a potential IPO valuation range of roughly
    Rs 22,000-24,000 crore before formal price discovery. Public trackers place Molbio's lifetime capital raised around $124 million or roughly Rs 970 crore equivalent, depending on source and conversion basis. The balance of evidence in this section is good enough to frame an investment view, but remaining private-data gaps should still be tested in management diligence.
  claimRefs:
  - CO015
