schemaVersion: report-v2
artifact: financials
slug: perplexity-ai
runDate: '2026-09-23'
company:
  name: Perplexity AI
chapter:
  number: 4
  title: Financials
  summary: >-
    Perplexity’s financial picture is the strongest part of the bull case and the weakest part of the diligence package.
    Revenue and valuation have scaled quickly, but the company still does not disclose the unit economics needed to
    underwrite margins with confidence.
sections:
  - id: i1
    title: Pricing and Revenue Stack
    body: >-
      Perplexity’s monetisation stack now looks like a real software business rather than a single consumer app. Public
      sources still centre on the $20/month Pro tier, but they also point to enterprise licensing, API usage, and newer
      subscription layers such as Max and publisher-facing products. That matters because it broadens the revenue base
      and reduces dependence on one product line, even if the exact mix is still opaque.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI009
    tableRefs:
      - TI001
  - id: i2
    title: Growth and Valuation
    body: >-
      The most recent reporting suggests roughly $450 million ARR by early 2026 and a valuation somewhere between $20
      billion and $23 billion, depending on source. That implies a very high revenue multiple, so the investment case
      still depends on continued rapid growth. The market is willing to pay for that growth because the product has
      clear usage and a differentiated interface, but the spread between revenue and valuation is still large enough to
      leave little room for disappointment.
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI011
    tableRefs:
      - TI002
  - id: i3
    title: Economics and Diligence Gaps
    body: >-
      The biggest financial gap remains the same: the company still does not disclose gross margin, churn, net revenue
      retention, or cash balance. Current sources also do not give audit-quality headcount or burn numbers. That means
      the valuation can be monitored, but not fully underwritten, from public information alone. For a refresh, that is
      acceptable as long as the report explicitly carries the gap rather than pretending to know the answer.
    claimRefs:
      - CI006
      - CI008
      - CI010
      - CI012
    tableRefs:
      - TI003
    figureRefs:
      - FI001
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Consumer subscription
        - Monthly Pro / higher tiers
        - Seat
        - $20 Pro and higher tiers
        - High
        - Check churn and conversion
      - - Enterprise
        - Team / seat licensing
        - Seat / contract
        - Growing but opaque
        - High
        - Check renewal and NRR
      - - API
        - Usage-based grounded LLM
        - Token / request
        - Growing
        - Medium
        - Check attach rate
      - - Publisher / commerce
        - Revenue share / commerce
        - Transaction / subscription
        - Early
        - Low
        - Check scale
    notes: Revenue mix is based on public product and analysis sources rather than company filings.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI009
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / unit / contract
      - List vs realised pricing
      - Discounts / unknowns
      - Source
    rows:
      - - $20 Pro
        - List price
        - Promo discounts unknown
        - TSG / official sources
      - - $200 Max
        - List price
        - Adoption unclear
        - Current analysis sources
      - - Enterprise
        - Custom
        - Realised pricing opaque
        - Official / analysis
      - - API
        - Usage-based
        - Discounts opaque
        - Docs and hiring signals
    notes: List pricing is more visible than realised pricing, especially for enterprise and API products.
    claimRefs:
      - CI003
      - CI004
      - CI009
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR
        - ~$450M
        - medium
        - Growth anchor
        - Reconcile latest estimate
      - - Valuation
        - $20B-$23B
        - medium
        - Multiple driver
        - Check the newest round
      - - Gross margin
        - 'null'
        - high gap
        - Profitability anchor
        - Need direct disclosure
      - - NRR
        - 'null'
        - high gap
        - Retention anchor
        - Need direct disclosure
    notes: The table highlights what is publicly estimated versus what remains undisclosed.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
      - CI008
