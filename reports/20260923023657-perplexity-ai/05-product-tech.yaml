schemaVersion: report-v2
artifact: product-tech
slug: perplexity-ai
runDate: '2026-09-23'
company:
  name: Perplexity AI
chapter:
  number: 5
  title: Product and Technology
  summary: >-
    Perplexity’s product stack has broadened from a web search box to APIs, agents, browser surfaces, and workflow
    tools. The technical story is compelling, but it also deepens infrastructure dependence and operational complexity.
sections:
  - id: t1
    title: Retrieval Stack and Developer Platform
    body: >-
      Perplexity still describes its core technology as retrieval plus citation-backed synthesis, but the product
      surface has moved well beyond the original answer engine. The API platform and developer-facing materials show a
      company trying to become infrastructure, not just a consumer app. That matters because infrastructure businesses
      are stickier and often have better pricing power, but they also need stronger operational discipline.
    claimRefs:
      - CT001
      - CT003
      - CT007
    tableRefs:
      - TT001
  - id: t2
    title: Agents, Browsers, and Partner Capacity
    body: >-
      The current source set repeatedly points to agentic workflows, browser surfaces, and a Mac-oriented experience as
      the big 2026 product story. Partner capacity from CoreWeave is a useful signal that inference demand is no longer
      trivial. The more surfaces Perplexity adds, the more it must manage a single retrieval stack across more products
      and more users, which is good for defensibility but harder to run.
    claimRefs:
      - CT002
      - CT005
      - CT006
      - CT010
    tableRefs:
      - TT002
  - id: t3
    title: Reliability and Technical Risk
    body: >-
      The help-center, status, and API hiring signals together suggest that operational reliability has become a
      first-order concern. That is normal for a scaled AI product, but it also means the company has to prove service
      quality, not just model quality. The main technical gap in the public source set is still simple: it does not give
      enough hard metrics to judge latency, uptime, or efficiency with confidence.
    claimRefs:
      - CT004
      - CT008
      - CT009
      - CT011
      - CT012
    tableRefs:
      - TT003
    figureRefs:
      - FT001
tables:
