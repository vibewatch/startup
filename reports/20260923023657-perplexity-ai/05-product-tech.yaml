        - Mature
        - Proof of value
        - Retention
    notes: This matrix groups the product family into a concise due-diligence lens rather than a feature catalog.
    claimRefs:
      - CT001
      - CT003
      - CT007
  - id: TT002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Perplexity solution
      - Measurable benefit
      - Limitation
    rows:
      - - Research
        - Search + copy notes
        - Cited synthesis
        - Faster discovery
        - Source quality varies
      - - Development
        - Glue together models
        - API platform
        - Grounded outputs
        - Adoption still building
      - - Ops / admin
        - Manual web tasks
        - Agents / Computer
        - Task automation
        - Reliability risk
      - - Enterprise search
        - Internal docs + search
        - Customer stories / enterprise
        - Knowledge retrieval
        - Controls opaque
    notes: Workflow mapping is inferred from public product pages, job listings, and partner announcements.
    claimRefs:
      - CT002
      - CT006
      - CT008
      - CT010
  - id: TT003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Retrieval
        - Find source material
        - Web access
        - Source quality
      - - LLM synthesis
        - Generate answer
        - Third-party models
        - Supplier leverage
      - - Infrastructure
        - Run workloads
        - Cloud / partner capacity
        - Cost and capacity
      - - Control plane
        - Enterprise controls / status
        - Internal tooling
        - Operational complexity
    notes: Operating architecture is summarised from public docs and third-party coverage, not from internal diagrams.
    claimRefs:
      - CT001
      - CT004
      - CT005
      - CT009
