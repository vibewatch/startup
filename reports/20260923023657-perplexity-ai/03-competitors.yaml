schemaVersion: report-v2
artifact: competitors
slug: perplexity-ai
runDate: '2026-09-23'
company:
  name: Perplexity AI
chapter:
  number: 3
  title: Competitors
  summary: >-
    Perplexity competes against the deepest incumbents in tech plus a growing field of answer-engine startups. The moat
    is currently product experience and speed, not distribution, so direct comparison to Google, OpenAI, and Microsoft
    remains central.
sections:
  - id: p1
    title: Main Competitors
    body: >-
      The clearest competitors are still Google, OpenAI, and Microsoft, with smaller answer engines and browser-native
      challengers filling out the rest of the field. The most important fact is not that Perplexity has competition — it
      is that the largest competitors can bundle similar features into products users already use every day. That means
      the competitive fight is fundamentally about distribution and default behaviour, not just model quality.
    claimRefs:
      - CP001
      - CP003
      - CP010
    tableRefs:
      - TP001
  - id: p2
    title: Differentiation and Moat
    body: >-
      Perplexity’s product edge is the clarity of cited answers and the speed with which users can move from question to
      answer. That is valuable, but it is not an uncopyable moat. Current sources repeatedly point to browser, app, and
      workflow surfaces as the battleground because those are the places where answer engines become habit-forming. If
      incumbents reach acceptable parity, the company’s pricing power becomes the first thing at risk.
    claimRefs:
      - CP002
      - CP004
      - CP006
      - CP007
    tableRefs:
      - TP002
  - id: p3
    title: Market Structure
    body: >-
      The market is crowded enough that it should be treated as dynamic rather than settled. Independent sources still
      view Perplexity as a credible challenger, but they also point to a widening field of adjacent products,
      open-source tools, and browser-native features. For diligence, the key question is therefore not whether
      Perplexity has a product — it clearly does — but whether it can keep a differentiated product while the market
      shifts around it.
    claimRefs:
      - CP005
      - CP008
      - CP009
      - CP011
      - CP012
    tableRefs:
      - TP003
    figureRefs:
      - FP001
tables:
