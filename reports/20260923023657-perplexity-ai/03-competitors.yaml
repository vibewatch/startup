        - Strong
        - Medium
        - Medium
        - Medium
      - - Default distribution
        - Weak
        - Strong
        - Strong
        - Strong
      - - Browser/workflow integration
        - Growing
        - Strong
        - Growing
        - Strong
      - - Enterprise workflow depth
        - Growing
        - Strong
        - Medium
        - Strong
    notes: Capability scoring is directional and based on public product positioning, not internal benchmarks.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP006
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Company
      - Price / unit / contract
      - Included capabilities
      - Discounts or unknowns
      - Implication
    rows:
      - - Perplexity
        - $20 Pro / enterprise / API
        - Citations, agents, retrieval
        - Enterprise pricing opaque
        - Needs premium UX
      - - Google
        - Bundled
        - Search + AI Overviews
        - Cross-subsidised
        - Distribution advantage
      - - OpenAI
        - Bundled / seat-based
        - Chat + search + tools
        - Package mix changes fast
        - Broad funnel
      - - Microsoft
        - Bundled enterprise
        - Copilot in productivity stack
        - Complex bundling
        - Workspace lock-in
    notes: Pricing is compared at a high level because direct seat and API comparables are not uniformly disclosed.
    claimRefs:
      - CP006
      - CP007
      - CP011
