chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Product
        blocks:
          - type: paragraph
            body: >-
              Perplexity AI positions itself as an answer engine: users ask a question, the system retrieves live web
              sources, and the product returns a cited response. The current public narrative still centres on
              curiosity, source transparency, and a web-plus-mobile experience rather than a narrow chat assistant. That
              framing matters because the company is monetising a search replacement workflow, not only a
              general-purpose chatbot. The latest public sources also show that the product surface has expanded beyond
              the original consumer search box into finance, API access, and dedicated customer stories.
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO012
      - number: '1.2'
        title: Founders, Leadership, and Hiring
        blocks:
          - type: paragraph
            body: >-
              The founder set remains stable across current sources: Aravind Srinivas, Denis Yarats, Johnny Ho, and Andy
              Konwinski. The Berkeley Haas profile still captures the founder-market fit story, while the company
              careers page and API hiring signals show that the organisation continues to add product and infrastructure
              talent. Headcount itself is still opaque, so diligence should rely on hiring velocity and product breadth
              rather than a single headcount figure. That opacity is a normal private-company limitation, but it still
              reduces confidence in burn-rate reconstruction. The continued API hiring signal and the broader product
              line show ongoing scale-up even if the exact employee count is not visible.
            claimRefs:
              - CO003
              - CO009
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO009
      - number: '1.3'
        title: Funding, Scale, and Milestones
        blocks:
          - type: paragraph
            body: >-
              Current 2026 sources point to a late-stage private company with roughly $1.5 billion to $1.7 billion
              raised and valuation signals between $20 billion and $23 billion. Usage remains the other important scale
              indicator: public sources place monthly active users around 45 million and lifetime downloads above 80
              million. Those figures suggest the company has moved beyond novelty adoption into sustained product usage.
              The key remaining diligence question is whether current product growth can outrun the cost structure and
              the legal overhang that now accompany the scale. The company’s own hiring and product signals suggest it
              is still investing for breadth, not harvesting margin. Additional current context remains material.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO010
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO010
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO007
              - CO010
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Category Positioning
        blocks:
          - type: paragraph
            body: >-
              The current source set still frames Perplexity as part of a broader shift from static search links to
              answer engines and research copilots. That shift matters because the product is not just a chatbot: it is
              a workflow layer that can aggregate sources, cite them, and feed downstream decision-making. The practical
              market implication is that Perplexity competes on usefulness and trust rather than only on entertainment
              or generic conversation. That creates a narrower but deeper use-case wedge.
            claimRefs:
              - CM001
              - CM004
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM009
      - number: '2.2'
        title: Adoption and Reach
        blocks:
          - type: paragraph
            body: >-
              Usage sources still point to strong adoption among knowledge workers, researchers, marketers, and
              developers. Public third-party estimates put active usage high enough to matter, but still far below the
              installed base of incumbent search and chat products. Geographic reach and language coverage are part of
              the story, yet the more important signal is professional repeat usage. That is why current analysis
              sources keep returning to retention rather than raw trial growth.
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Commercialisation and Market Risk
        blocks:
          - type: paragraph
            body: >-
              The market is attractive because every answer can be monetised through subscription, enterprise workflow
              licensing, or usage-based API access, but the same structure makes unit economics sensitive to retrieval
              and inference cost. Current sources still treat the market as competitive and likely to commoditise. In
              practice, that means Perplexity must defend its position with product quality, distribution, and pricing
              discipline rather than assuming category leadership will arrive automatically.
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Main Competitors
        blocks:
          - type: paragraph
            body: >-
              The clearest competitors are still Google, OpenAI, and Microsoft, with smaller answer engines and
              browser-native challengers filling out the rest of the field. The most important fact is not that
              Perplexity has competition — it is that the largest competitors can bundle similar features into products
              users already use every day. That means the competitive fight is fundamentally about distribution and
              default behaviour, not just model quality.
            claimRefs:
              - CP001
              - CP003
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP008
      - number: '3.2'
        title: Differentiation and Moat
        blocks:
          - type: paragraph
            body: >-
              Perplexity’s product edge is the clarity of cited answers and the speed with which users can move from
              question to answer. That is valuable, but it is not an uncopyable moat. Current sources repeatedly point
              to browser, app, and workflow surfaces as the battleground because those are the places where answer
              engines become habit-forming. If incumbents reach acceptable parity, the company’s pricing power becomes
              the first thing at risk.
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
      - number: '3.3'
        title: Market Structure
        blocks:
          - type: paragraph
            body: >-
              The market is crowded enough that it should be treated as dynamic rather than settled. Independent sources
              still view Perplexity as a credible challenger, but they also point to a widening field of adjacent
              products, open-source tools, and browser-native features. For diligence, the key question is therefore not
              whether Perplexity has a product — it clearly does — but whether it can keep a differentiated product
              while the market shifts around it.
            claimRefs:
              - CP005
              - CP008
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP007
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Pricing and Revenue Stack
        blocks:
          - type: paragraph
            body: >-
              Perplexity’s monetisation stack now looks like a real software business rather than a single consumer app.
              Public sources still centre on the $20/month Pro tier, but they also point to enterprise licensing, API
              usage, and newer subscription layers such as Max and publisher-facing products. That matters because it
              broadens the revenue base and reduces dependence on one product line, even if the exact mix is still
              opaque.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI009
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI009
      - number: '4.2'
        title: Growth and Valuation
        blocks:
          - type: paragraph
            body: >-
              The most recent reporting suggests roughly $450 million ARR by early 2026 and a valuation somewhere
              between $20 billion and $23 billion, depending on source. That implies a very high revenue multiple, so
              the investment case still depends on continued rapid growth. The market is willing to pay for that growth
              because the product has clear usage and a differentiated interface, but the spread between revenue and
              valuation is still large enough to leave little room for disappointment.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI009
      - number: '4.3'
        title: Economics and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The biggest financial gap remains the same: the company still does not disclose gross margin, churn, net
              revenue retention, or cash balance. Current sources also do not give audit-quality headcount or burn
              numbers. That means the valuation can be monitored, but not fully underwritten, from public information
              alone. For a refresh, that is acceptable as long as the report explicitly carries the gap rather than
              pretending to know the answer.
            claimRefs:
              - CI006
              - CI008
              - CI010
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
              - CI008
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Retrieval Stack and Developer Platform
        blocks:
          - type: paragraph
            body: >-
              Perplexity still describes its core technology as retrieval plus citation-backed synthesis, but the
              product surface has moved well beyond the original answer engine. The API platform and developer-facing
              materials show a company trying to become infrastructure, not just a consumer app. That matters because
              infrastructure businesses are stickier and often have better pricing power, but they also need stronger
              operational discipline.
            claimRefs:
              - CT001
              - CT003
              - CT007
          - type: table
            tableRef: TT001
            claimRefs:
              - CT001
              - CT003
              - CT007
      - number: '5.2'
        title: Agents, Browsers, and Partner Capacity
        blocks:
          - type: paragraph
            body: >-
              The current source set repeatedly points to agentic workflows, browser surfaces, and a Mac-oriented
              experience as the big 2026 product story. Partner capacity from CoreWeave is a useful signal that
              inference demand is no longer trivial. The more surfaces Perplexity adds, the more it must manage a single
              retrieval stack across more products and more users, which is good for defensibility but harder to run.
            claimRefs:
              - CT002
              - CT005
              - CT006
              - CT010
          - type: table
            tableRef: TT002
            claimRefs:
              - CT002
              - CT006
              - CT008
              - CT010
      - number: '5.3'
        title: Reliability and Technical Risk
        blocks:
          - type: paragraph
            body: >-
              The help-center, status, and API hiring signals together suggest that operational reliability has become a
              first-order concern. That is normal for a scaled AI product, but it also means the company has to prove
              service quality, not just model quality. The main technical gap in the public source set is still simple:
              it does not give enough hard metrics to judge latency, uptime, or efficiency with confidence.
            claimRefs:
              - CT004
              - CT008
              - CT009
              - CT011
              - CT012
          - type: table
            tableRef: TT003
            claimRefs:
              - CT001
              - CT004
              - CT005
              - CT009
          - type: figure
            figureRef: FT001
            claimRefs:
              - CT001
              - CT002
              - CT003
              - CT007
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments
        blocks:
          - type: paragraph
            body: >-
              The public source set suggests a broad customer footprint rather than a single narrow niche. Perplexity
              shows up in public-sector, enterprise, and research-oriented use cases, which is encouraging because it
              means the product is not confined to curiosity traffic. At the same time, the evidence is still mostly
              anecdotal and story-driven rather than a clean customer-split disclosure, so the report should treat the
              segment mix as directional, not audited.
            claimRefs:
              - CC001
              - CC005
              - CC006
          - type: table
            tableRef: TC001
            claimRefs:
              - CC001
              - CC005
              - CC006
      - number: '6.2'
        title: Proof of Value
        blocks:
          - type: paragraph
            body: >-
              The strongest customer proof comes from named organisations and concrete time-savings claims. Montana DNRC
              is the clearest example, while CoreWeave shows that the company is also relevant to infrastructure and
              partner ecosystems. That combination is useful because it suggests the product creates value in both
              workflow and platform contexts. The diligence gap is that these are still proofs, not a disclosed
              retention or cohort dataset.
            claimRefs:
              - CC002
              - CC003
              - CC004
              - CC007
          - type: table
            tableRef: TC002
            claimRefs:
              - CC002
              - CC003
              - CC007
              - CC009
      - number: '6.3'
        title: Retention and Concentration
        blocks:
          - type: paragraph
            body: >-
              The customer story is broad enough to support the growth narrative, but not detailed enough to underwrite
              concentration or retention with confidence. Public sources do not show a clean account split or a
              disclosed repeat-use cohort. That means the report should recognise customer adoption as real while still
              treating customer economics as partly open. For a refresh, that is enough to keep the thesis alive, but
              not enough to close the diligence file.
            claimRefs:
              - CC008
              - CC009
              - CC010
              - CC011
              - CC012
          - type: table
            tableRef: TC003
            claimRefs:
              - CC002
              - CC003
              - CC004
              - CC007
          - type: figure
            figureRef: FC001
            claimRefs:
              - CC001
              - CC002
              - CC003
              - CC004
              - CC008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and Privacy Risk
        blocks:
          - type: paragraph
            body: >-
              The legal risk story remains the most important downside factor. Current sources still point to copyright,
              scraping, and data-use disputes, and the public source set does not resolve the legal outcome. That means
              the core business model is still carrying an unresolved externality: if content access becomes more
              expensive, the company’s economics could change materially. The company’s own status page and customer
              story pages help, but they do not offset the structural risk that lives in the legal layer.
            claimRefs:
              - CR001
              - CR005
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR010
      - number: '7.2'
        title: Operational and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Reliability and dependency risks are also material. Perplexity relies on infrastructure and model supply
              that it does not fully control, so changes in pricing, access, or quality could hit the product quickly.
              The competitive backdrop is equally sharp: if incumbent platforms bundle similar experiences,
              differentiation can compress fast. In that scenario the company still has a good product, but a much
              tougher path to defend pricing and growth.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR008
      - number: '7.3'
        title: Risk Rating and Mitigations
        blocks:
          - type: paragraph
            body: >-
              Mitigations exist — a status page, named enterprise customers, partner infrastructure, and an increasingly
              broad product set — but they are only partial offsets. The appropriate current posture is therefore still
              high risk. The main open issue is not whether the company is attractive to users; it clearly is. The open
              issue is whether the legal and cost stack can stay aligned with the growth story long enough to preserve
              the equity value implied by the latest private-market marks.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Path
        blocks:
          - type: paragraph
            body: >-
              Perplexity’s valuation has moved from the low billions to the $20 billion-plus range extremely quickly,
              and the latest public discussion still places it around the top tier of private AI names. That is a sign
              of real product traction, but also a sign that investors are paying for a future state rather than current
              economics. The current report keeps the stance at stretched because the mark is still rich even after
              strong growth.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV012
      - number: '8.2'
        title: Bull and Bear Cases
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: usage keeps compounding, enterprise expands, and the product surface
              keeps broadening into APIs, agents, and browser-like workflows. The bear case is also straightforward:
              legal costs rise, incumbents bundle similar features, or growth slows before the business becomes
              self-funding. The valuation question therefore reduces to whether the company can keep outrunning both the
              cost structure and the competitive response.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV010
      - number: '8.3'
        title: Recommendation
        blocks:
          - type: paragraph
            body: >-
              On the current source set, “track” is still the most defensible recommendation. The company is real, usage
              is real, and monetisation is broader than a single consumer app, but the economics are still opaque enough
              that a buy case would be premature. The main thing to watch in the next refresh is whether the valuation
              keeps moving faster than the disclosure quality.
            claimRefs:
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV009
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
