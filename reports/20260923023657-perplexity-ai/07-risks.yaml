schemaVersion: report-v2
artifact: risks
slug: perplexity-ai
runDate: '2026-09-23'
company:
  name: Perplexity AI
chapter:
  number: 7
  title: Risks
  summary: >-
    The biggest risks are legal, competitive, and operational. Perplexity is still growing quickly, but the company’s
    dependence on web content, external model providers, and a thin public disclosure stack makes the downside more
    difficult to model than the upside.
sections:
  - id: r1
    title: Legal and Privacy Risk
    body: >-
      The legal risk story remains the most important downside factor. Current sources still point to copyright,
      scraping, and data-use disputes, and the public source set does not resolve the legal outcome. That means the core
      business model is still carrying an unresolved externality: if content access becomes more expensive, the
      company’s economics could change materially. The company’s own status page and customer story pages help, but they
      do not offset the structural risk that lives in the legal layer.
    claimRefs:
      - CR001
      - CR005
      - CR007
    tableRefs:
      - TR001
  - id: r2
    title: Operational and Competitive Risk
    body: >-
      Reliability and dependency risks are also material. Perplexity relies on infrastructure and model supply that it
      does not fully control, so changes in pricing, access, or quality could hit the product quickly. The competitive
      backdrop is equally sharp: if incumbent platforms bundle similar experiences, differentiation can compress fast.
      In that scenario the company still has a good product, but a much tougher path to defend pricing and growth.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR006
    tableRefs:
      - TR002
  - id: r3
    title: Risk Rating and Mitigations
    body: >-
      Mitigations exist — a status page, named enterprise customers, partner infrastructure, and an increasingly broad
      product set — but they are only partial offsets. The appropriate current posture is therefore still high risk. The
      main open issue is not whether the company is attractive to users; it clearly is. The open issue is whether the
      legal and cost stack can stay aligned with the growth story long enough to preserve the equity value implied by
      the latest private-market marks.
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
    tableRefs:
      - TR003
    figureRefs:
      - FR001
