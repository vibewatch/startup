          - type: paragraph
            body: >-
              缓释因素存在——状态页、具名企业客户、伙伴基础设施以及越来越宽的产品集——但它们只能部分抵消。因此当前合适的姿态仍是高风险。开放问题不是公司是否吸引用户；显然吸引。开放问题是，法律风险和成本结构能否与增长故事保持足够久的同步，从而守住最新私募市场估值所隐含的股权价值。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值路径
        blocks:
          - type: paragraph
            body: >-
              Perplexity 的估值极快地从低个位数十亿美元升至 $20 billion 以上，最新公开讨论仍把它放在私营 AI
              公司第一梯队附近。这说明产品牵引真实存在，但也说明投资人买的是未来状态，而不是当前经济性。本报告仍把立场维持在偏贵，因为即便增长强劲，这个估值标记仍然很高。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV012
      - number: '8.2'
        title: 乐观与悲观情境
        blocks:
          - type: paragraph
            body: >-
              乐观情境很直接：使用量继续复合增长，企业业务扩张，产品界面继续拓宽到
              API、智能体和类浏览器工作流。悲观情境也很直接：法律成本上升、既有巨头捆绑类似功能，或者业务自我造血前增长放缓。因此，估值问题最终归结为：公司能否继续跑赢成本结构和竞争回应。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV010
      - number: '8.3'
        title: 建议
        blocks:
          - type: paragraph
            body: 基于当前来源集，“跟踪”仍是最站得住脚的建议。公司是真实的，使用量是真实的，变现也不再只是单一消费者应用；但经济性仍足够不透明，买入判断还为时过早。下一次刷新最该看的，是估值是否继续比披露质量跑得更快。
            claimRefs:
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV009
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
