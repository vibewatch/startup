companyProfile:
  summary: >-
    Perplexity AI 是一家总部位于旧金山的答案引擎公司，由 Aravind Srinivas、Denis Yarats、Johnny Ho 和 Andy Konwinski 于 2022 年 8
    月创立。公司把实时网页检索和带引用的综合答案结合起来，已从消费者搜索扩展到企业、API、金融和智能体工作流产品。当前公开报道显示，它已进入后期私营公司梯队，ARR 约 $450 million，月活用户约 45
    million，估值信号落在 $20 billion 至 $23 billion 之间。
