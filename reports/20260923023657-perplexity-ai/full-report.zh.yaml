  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 定位与产品
        blocks:
          - type: paragraph
            body: >-
              Perplexity AI
              把自己定位成答案引擎：用户提问，系统检索实时网页来源，再返回带引用的回答。当前公开叙事仍围绕好奇心、来源透明和网页加移动端体验，而不是一个窄义聊天助手。这个定位很关键：公司在变现的是替代搜索的工作流，不只是通用聊天机器人。最新公开来源还显示，产品界面已从最初的消费者搜索框扩到金融、API
              访问和专门的客户案例。
