        blocks:
          - type: paragraph
            body: >-
              这个市场有吸引力，因为每一次回答都能通过订阅、企业工作流授权或按量计费的 API 访问变现；但同一结构也让单位经济对检索和推理成本敏感。当前来源仍把市场视为竞争激烈且很可能商品化。落到执行上，Perplexity
              必须靠产品质量、分发和定价纪律守住位置，不能假设类别领导地位会自动到来。
