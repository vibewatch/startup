              画像仍能说明创始人与市场的匹配故事；公司招聘页和 API
              招聘信号则显示，组织还在补产品和基础设施人才。员工数本身仍不透明，因此尽调应更多看招聘速度和产品宽度，而不是盯一个员工数。私营公司有这种不透明度并不意外，但它仍会降低重建烧钱速度的把握。持续的 API
              招聘信号和更宽的产品线说明，即使看不到准确员工数，公司仍在继续扩张。
