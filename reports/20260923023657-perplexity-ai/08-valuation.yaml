schemaVersion: report-v2
artifact: valuation
slug: perplexity-ai
runDate: '2026-09-23'
company:
  name: Perplexity AI
chapter:
  number: 8
  title: Valuation
  summary: >-
    Perplexity remains one of the most richly priced private AI companies because growth is strong and product usage is
    real. The valuation is defensible only if growth, monetisation, and legal risk all break in the company’s favour.
sections:
  - id: v1
    title: Valuation Path
    body: >-
      Perplexity’s valuation has moved from the low billions to the $20 billion-plus range extremely quickly, and the
      latest public discussion still places it around the top tier of private AI names. That is a sign of real product
      traction, but also a sign that investors are paying for a future state rather than current economics. The current
      report keeps the stance at stretched because the mark is still rich even after strong growth.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
    tableRefs:
      - TV001
  - id: v2
    title: Bull and Bear Cases
    body: >-
      The bull case is straightforward: usage keeps compounding, enterprise expands, and the product surface keeps
      broadening into APIs, agents, and browser-like workflows. The bear case is also straightforward: legal costs rise,
      incumbents bundle similar features, or growth slows before the business becomes self-funding. The valuation
      question therefore reduces to whether the company can keep outrunning both the cost structure and the competitive
      response.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV009
      - CV010
    tableRefs:
      - TV002
  - id: v3
    title: Recommendation
    body: >-
      On the current source set, “track” is still the most defensible recommendation. The company is real, usage is
      real, and monetisation is broader than a single consumer app, but the economics are still opaque enough that a buy
      case would be premature. The main thing to watch in the next refresh is whether the valuation keeps moving faster
      than the disclosure quality.
    claimRefs:
      - CV008
      - CV011
      - CV012
    tableRefs:
      - TV003
    figureRefs:
      - FV001
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Recommendation
      - Confidence
      - Risk rating
      - Valuation stance
      - Decision implication
    rows:
      - - Track
        - Medium
        - High
        - Stretched
        - Keep monitoring
      - - Why now
        - Medium
        - High
        - Stretched
        - Real product traction
      - - What changes the view
        - Low
        - High
        - Stretched
        - Disclosure or legal clarity
      - - What would justify buy
        - Low
        - High
        - Fair
        - Much cleaner economics
    notes: This table compresses the current recommendation into a short decision lens rather than a full investment memo.
    claimRefs:
      - CV007
      - CV012
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - What would change the view
    rows:
      - - Usage keeps compounding
        - Growth slows materially
      - - Monetisation broadens
        - Enterprise/API stall
      - - Valuation stays defensible
        - Market re-rates the multiple
      - - Legal risk is contained
        - Major adverse ruling or settlement
    notes: The table expresses the valuation debate as a set of falsifiable drivers.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - ARR keeps compounding
        - Multiple stays rich
        - Competition + legal
        - Low / medium
      - - Base
        - Growth normalises
        - Current mark roughly holds
        - Margin opacity
        - Medium
      - - Bear
        - Legal or bundling shock
        - Multiple compresses
        - Cost stack
        - Medium / high
    notes: Scenario values are directional because current public sources do not provide audited operating metrics.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV009
      - CV010
