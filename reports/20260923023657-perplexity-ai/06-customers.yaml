      - CC009
  - id: TC003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Montana DNRC
        - Public sector
        - Research and efficiency
        - Production
        - 125+ hours weekly saved
        - Single named example
      - - CoreWeave
        - Infrastructure partner
        - Inference workloads
        - Production
        - Capacity support
        - Partner, not end customer
      - - Customer stories page
        - Enterprise mix
        - Workflow proof points
        - Production / case study
        - Proof of adoption
        - Self-selected examples
      - - Case-study lists
        - Multiple verticals
        - Cross-functional research
        - Pilot / production mix
        - Breadth
        - Not independently audited
    notes: Named customer proof is strongest when the source names the organisation and outcome explicitly.
    claimRefs:
      - CC002
      - CC003
      - CC004
      - CC007
    enumerationScope:
      coverage: partial
      basis: Named public customer stories and partner proof points visible in current sources
