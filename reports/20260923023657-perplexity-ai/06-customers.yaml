schemaVersion: report-v2
artifact: customers
slug: perplexity-ai
runDate: '2026-09-23'
company:
  name: Perplexity AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Perplexity’s customer story is still broad rather than deeply concentrated: public-sector users, enterprises,
    developers, and consumers all appear in the source set. The key diligence question is not whether people use it, but
    whether they keep using it enough to justify the current scale narrative.
sections:
  - id: c1
    title: Customer Segments
    body: >-
      The public source set suggests a broad customer footprint rather than a single narrow niche. Perplexity shows up
      in public-sector, enterprise, and research-oriented use cases, which is encouraging because it means the product
      is not confined to curiosity traffic. At the same time, the evidence is still mostly anecdotal and story-driven
      rather than a clean customer-split disclosure, so the report should treat the segment mix as directional, not
      audited.
    claimRefs:
      - CC001
      - CC005
      - CC006
    tableRefs:
      - TC001
  - id: c2
    title: Proof of Value
    body: >-
      The strongest customer proof comes from named organisations and concrete time-savings claims. Montana DNRC is the
      clearest example, while CoreWeave shows that the company is also relevant to infrastructure and partner
      ecosystems. That combination is useful because it suggests the product creates value in both workflow and platform
      contexts. The diligence gap is that these are still proofs, not a disclosed retention or cohort dataset.
    claimRefs:
      - CC002
      - CC003
      - CC004
      - CC007
    tableRefs:
      - TC002
  - id: c3
    title: Retention and Concentration
    body: >-
      The customer story is broad enough to support the growth narrative, but not detailed enough to underwrite
      concentration or retention with confidence. Public sources do not show a clean account split or a disclosed
      repeat-use cohort. That means the report should recognise customer adoption as real while still treating customer
      economics as partly open. For a refresh, that is enough to keep the thesis alive, but not enough to close the
      diligence file.
    claimRefs:
      - CC008
      - CC009
      - CC010
      - CC011
      - CC012
    tableRefs:
      - TC003
    figureRefs:
      - FC001
