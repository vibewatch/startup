schemaVersion: report-v2
artifact: market-analysis
slug: perplexity-ai
runDate: '2026-09-23'
company:
  name: Perplexity AI
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The market is still shifting from blue-link search toward answer engines and agentic research tools. Perplexity has
    meaningful usage and brand momentum, but the segment remains crowded and cost-sensitive, so distribution and unit
    economics matter more than category hype.
sections:
  - id: m1
    title: Category Positioning
    body: >-
      The current source set still frames Perplexity as part of a broader shift from static search links to answer
      engines and research copilots. That shift matters because the product is not just a chatbot: it is a workflow
      layer that can aggregate sources, cite them, and feed downstream decision-making. The practical market implication
      is that Perplexity competes on usefulness and trust rather than only on entertainment or generic conversation.
      That creates a narrower but deeper use-case wedge.
    claimRefs:
      - CM001
      - CM004
      - CM009
    tableRefs:
      - TM001
  - id: m2
    title: Adoption and Reach
    body: >-
      Usage sources still point to strong adoption among knowledge workers, researchers, marketers, and developers.
      Public third-party estimates put active usage high enough to matter, but still far below the installed base of
      incumbent search and chat products. Geographic reach and language coverage are part of the story, yet the more
      important signal is professional repeat usage. That is why current analysis sources keep returning to retention
      rather than raw trial growth.
    claimRefs:
      - CM002
      - CM003
      - CM006
      - CM011
    tableRefs:
      - TM002
  - id: m3
    title: Commercialisation and Market Risk
    body: >-
      The market is attractive because every answer can be monetised through subscription, enterprise workflow
      licensing, or usage-based API access, but the same structure makes unit economics sensitive to retrieval and
      inference cost. Current sources still treat the market as competitive and likely to commoditise. In practice, that
      means Perplexity must defend its position with product quality, distribution, and pricing discipline rather than
      assuming category leadership will arrive automatically.
    claimRefs:
      - CM005
      - CM007
      - CM008
      - CM010
      - CM012
    tableRefs:
      - TM003
    figureRefs:
      - FM001
