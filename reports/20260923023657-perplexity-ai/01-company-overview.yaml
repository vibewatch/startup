runDate: '2026-09-23'
company:
  name: Perplexity AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Perplexity AI is a late-stage private answer engine that combines cited web retrieval with subscription, enterprise,
    and API monetisation. Public data still shows rapid usage growth and major strategic backing, but valuation,
    headcount, and legal exposure remain the main diligence constraints.
sections:
  - id: s1
    title: Identity and Product
    body: >-
      Perplexity AI positions itself as an answer engine: users ask a question, the system retrieves live web sources,
      and the product returns a cited response. The current public narrative still centres on curiosity, source
      transparency, and a web-plus-mobile experience rather than a narrow chat assistant. That framing matters because
      the company is monetising a search replacement workflow, not only a general-purpose chatbot. The latest public
      sources also show that the product surface has expanded beyond the original consumer search box into finance, API
      access, and dedicated customer stories.
    claimRefs:
      - CO001
      - CO002
      - CO008
      - CO011
    tableRefs:
      - TO001
  - id: s2
    title: Founders, Leadership, and Hiring
    body: >-
      The founder set remains stable across current sources: Aravind Srinivas, Denis Yarats, Johnny Ho, and Andy
      Konwinski. The Berkeley Haas profile still captures the founder-market fit story, while the company careers page
      and API hiring signals show that the organisation continues to add product and infrastructure talent. Headcount
      itself is still opaque, so diligence should rely on hiring velocity and product breadth rather than a single
      headcount figure. That opacity is a normal private-company limitation, but it still reduces confidence in
      burn-rate reconstruction. The continued API hiring signal and the broader product line show ongoing scale-up even
      if the exact employee count is not visible.
    claimRefs:
      - CO003
      - CO009
      - CO012
    tableRefs:
      - TO002
  - id: s3
    title: Funding, Scale, and Milestones
    body: >-
      Current 2026 sources point to a late-stage private company with roughly $1.5 billion to $1.7 billion raised and
      valuation signals between $20 billion and $23 billion. Usage remains the other important scale indicator: public
      sources place monthly active users around 45 million and lifetime downloads above 80 million. Those figures
      suggest the company has moved beyond novelty adoption into sustained product usage. The key remaining diligence
      question is whether current product growth can outrun the cost structure and the legal overhang that now accompany
      the scale. The company’s own hiring and product signals suggest it is still investing for breadth, not harvesting
      margin. Additional current context remains material.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO007
      - CO010
      - CO012
    tableRefs:
      - TO003
    figureRefs:
      - FO001
