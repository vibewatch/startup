  topStrengths:
    - Fast product expansion from answer engine into API, enterprise, finance, and agentic workflows
    - Strong usage and downloads, with public sources still showing roughly 45M monthly active users
    - Large strategic backers and broad third-party coverage of the company’s growth narrative
    - Clear consumer and enterprise utility for research and decision support
  topRisks:
