companyProfile:
  summary: >-
    Perplexity AI is a San Francisco-based answer engine company founded in August 2022 by Aravind Srinivas, Denis
    Yarats, Johnny Ho, and Andy Konwinski. The company combines real-time web retrieval with cited synthesis and has
    expanded beyond consumer search into enterprise, API, finance, and agentic workflow products. Current public
    reporting puts it in the late-stage private category with roughly $450 million ARR, about 45 million monthly active
    users, and valuation signals between $20 billion and $23 billion.
