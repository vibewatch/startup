  - id: FE001
    title: Bambu Lab product architecture map
    type: stack
    summary: >-
      Bambu Lab's customer experience is layered from physical fabrication through materials, sensing, software, and
      cloud services.
    data:
      layers:
        - label: Fabrication hardware
          detail: Physical printer mechanics that deposit and position material.
          items:
            - name: Motion and frame
              detail: CoreXY motion, enclosed or open chassis, and build volume.
            - name: Extrusion and toolhead
              detail: Direct-drive or dual-nozzle paths with material deposition.
        - label: Materials and thermal control
          detail: Filament routing, enclosure, chamber temperature, and filtration.
          items:
            - name: AMS material handling
              detail: Automated spool selection and multi-material routing.
            - name: Chamber and filtration
              detail: Enclosure, heated chamber, airflow, and filtration for selected models.
        - label: Sensing and automation
          detail: Sensors, cameras, firmware, and automated calibration or monitoring.
          items:
            - name: Cameras and sensors
              detail: Calibration, first-layer checks, monitoring, and failure detection.
            - name: Firmware control
              detail: Coordinates motion, temperature, materials, and safety states.
        - label: Workflow software
          detail: Slicing, material assignment, notifications, and job management.
          items:
            - name: Bambu Studio
              detail: Slicing, material assignment, and printer-aware preparation.
            - name: Bambu Handy
              detail: Mobile monitoring, notifications, and remote job management.
        - label: Platform services
          detail: Cloud connectivity, model discovery, and local-operation alternatives.
          items:
            - name: Cloud and model ecosystem
              detail: Remote connectivity and MakerWorld-linked workflow convenience.
            - name: Offline alternatives
              detail: LAN-only and third-party-slicer paths have feature and governance trade-offs.
        - label: Service and safety
          detail: Maintenance, filtration, interlocks, and operating-limit controls.
          items:
            - name: Maintenance and safety controls
              detail: Wear-item maintenance, filtration, interlocks, and documented operating limits.
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE007
      - CE010
      - CE011
  - id: FU001
    title: Customer journey from first print to ecosystem expansion
    type: journey-map
    summary: >-
      Bambu Lab's public customer path moves from low-friction setup through repeated use and ecosystem attachment, with
      openness and cloud dependence as a countervailing risk.
    data:
      items:
        - label: Discover
          touchpoints: Reviews, community recommendations, and product-line price points
          detail: Beginners can enter through the A1 mini or A1; advanced users evaluate enclosed and multi-material models.
        - label: First print
          touchpoints: Out-of-box setup, automatic calibration, and sample PLA workflows
          detail: Named reviewers describe first-print setup in minutes rather than extensive manual tuning.
        - label: Repeat use
          touchpoints: Bambu Studio, Bambu Handy, MakerWorld, and repeat model downloads
          detail: Platform activity and reported print hours indicate recurring engagement, but not audited hardware usage.
        - label: Expand
          touchpoints: AMS accessories, additional machines, and creator or small-business use
          detail: A reviewer reports moving from A1 mini to P1S and P2S while keeping a consistent workflow.
        - label: Depend
          touchpoints: Cloud services, firmware, telemetry, and integrated software
          detail: LAN-only mode exists but has documented feature trade-offs; dependence can increase switching friction.
        - label: Advocate or resist
          touchpoints: Community sharing, open-source debate, and firmware backlash
          detail: Positive workflow advocacy coexists with adverse power-user reaction to authorization and cloud changes.
    claimRefs:
      - CU001
      - CU009
      - CU010
      - CU011
      - CU012
