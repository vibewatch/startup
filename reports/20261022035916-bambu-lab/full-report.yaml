  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and value pools
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all additive manufacturing. The evidence here supports a narrower boundary:
              desktop, entry-level and prosumer 3D printers, related multi-material hardware, filament and accessories,
              and the software and model-sharing layer that makes those machines usable. The customer outcome is a
              reliable path from a digital design to a physical object, rather than a machine purchased solely for
              technical experimentation. How-To Geek describes Bambu's X1 launch, later P and A1 expansion, and H2
              manufacturing-oriented products as a progression across price points and user tiers. Its account also says
              the A1's preassembled units and automatic calibration reduced the learning curve. Metapress similarly
              frames the product promise around speed, automation, connected software, and multi-color printing. This
              boundary includes hobbyists, families, educators, makers, creators, and small businesses that buy desktop
              equipment or use it for low-volume production. It excludes industrial additive manufacturing systems,
              contract printing services, unrelated CAD software, and general consumer electronics. Status-quo
              substitutes include buying a finished item, outsourcing a print, or using a less automated/open printer
              and accepting more setup work.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
      - number: '2.2'
        title: Sizing lenses and adoption signals
        blocks:
          - type: paragraph
            body: >-
              No assigned source provides a complete, independently audited TAM, SAM, or SOM for Bambu Lab's defined
              market. The strongest available sizing lenses are therefore shipment share, platform activity, and
              observed usage rather than a single top-down market number. Tom's Hardware reports, citing Context data as
              reported by All3DP, that Bambu held 37% of the global sub-$2,500 segment during 2025, while entry-level
              shipments grew 26% across the year. That is a share and growth signal, not company revenue or a total
              market value. 3DPrint reports Bambu's stated MakerWorld activity of about 10 million monthly active users,
              2.6 million original models, more than 7,000 new models per day, and 290 million print hours in 2025.
              Those figures indicate usage and network density, but they are company-reported and do not establish
              paying users or recurring revenue. The market can plausibly expand as setup friction falls and printing
              becomes useful for small businesses, but a valuation-grade sizing model still needs segment revenue,
              geography, repeat hardware demand, consumables attach, and platform monetization.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
