  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Evidence signal
      - Decision implication
    rows:
      - - Recommendation
        - Track
        - Do not underwrite a buy without verified price and financial disclosure.
      - - Confidence
        - Medium-low
        - Operating evidence is meaningful, but valuation evidence is incomplete.
      - - Risk rating
        - High
        - Cloud governance, IP/open-source disputes, and hardware economics remain material.
      - - Valuation stance
        - Unknown / unverified
        - A reported 40bn RMB list mark is not a confirmed financing price.
    notes: >-
      Decision synthesis from assigned public sources; the reported valuation is not a verified financing price and null
      financial inputs are not treated as zero.
    claimRefs:
      - CV004
      - CV008
      - CV015
      - CV016
  - id: TV002
    title: Thesis / anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - Platform engagement is real
        - >-
          Industry coverage reports 10m monthly active users, 290m print hours, and 83% one-year retention on
          MakerWorld.
        - Independent cohort and monetisation data showing repeat paid demand.
      - - Integrated workflow can raise switching costs
        - Product coverage describes printers, AMS, software, MakerWorld, and cloud control as a connected ecosystem.
        - Evidence that users can switch without meaningful retention or attach-rate loss.
      - - Scale may not equal investor value
        - The assigned evidence does not quantify gross margin, cash flow, take rate, or recurring revenue.
        - Audited or management financials with segment economics and cash conversion.
      - - Governance can impair the premium
        - Independent commentary reports cloud, telemetry, open-source, and OrcaSlicer disputes.
        - Documented compliance, transparent data controls, and durable community resolution.
      - - Category leadership is exposed to competition
        - Coverage describes a broad competitive desktop-printer market and positions Bambu against Creality and Prusa.
        - Evidence of durable share, pricing power, and lower acquisition cost.
    notes: >-
      Qualitative synthesis; company-reported platform metrics and independent commentary are intentionally separated
      from verified financial measures.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
  - id: TV003
    title: Bull / base / bear scenario framework
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Engagement converts to repeat hardware, filament, accessory, and software demand; margins remain durable.
        - Premium multiple may be justified only after verified cash conversion and financing terms.
        - 'Low-to-medium: strong usage evidence, weak public financial evidence.'
        - Repeat usage or monetisation fails to scale with the installed base.
      - - Base
        - Bambu remains a leading hardware ecosystem but recurring revenue and margins stay uncertain.
        - Anchor entry to verified sales, cash generation, dilution, and public comparable multiples.
        - 'Medium: operating traction is visible, valuation inputs are incomplete.'
        - New financing implies a lower mark or dilution is larger than expected.
      - - Bear
        - Price competition, disputes, cloud incidents, IP costs, or weaker demand compress economics.
        - Apply a lower hardware multiple and require a substantial risk discount; no precise target is supportable.
        - 'Medium: several adverse mechanisms are documented, but loss magnitude is unknown.'
        - Major recall, legal judgment, service outage, or sustained demand deterioration.
    notes: >-
      Directional scenarios, not a forecast or target price. No probability-weighted valuation is calculated because
      revenue, margin, dilution, and transaction price inputs are not sufficiently verified in the assigned evidence.
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
