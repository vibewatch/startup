      - number: '4.3'
        title: Margin depends on hardware mix, fulfillment, support, and cloud cost
        blocks:
          - type: paragraph
            body: >-
              The integrated proposition combines electromechanical hardware, sensors, automation, multi-material
              handling, firmware, apps, cloud services, and a model marketplace. That design can support differentiation
              and premium pricing, but it also implies costs across components, assembly, inventory, freight, warranty,
              support, and cloud operations. No assigned source provides bill-of-materials cost, gross margin, return
              rate, warranty reserve, customer acquisition cost, payback, channel economics, or contribution margin. Nor
              do the public adoption signals show how activity converts into paid accessories or consumables. A shipment
              share or monthly-active-user count should not be converted into revenue or gross profit without shipment
              volume, net pricing, cohort attach, and cost data. Every unavailable unit-economics field is therefore a
              diligence request rather than a zero.
