  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Bambu Lab sells a tiered desktop-fabrication portfolio rather than a single printer: open-frame A-series
              machines target entry-level PLA, PETG, and TPU use; enclosed P-series machines target more demanding
              materials; the X2D occupies a compact dual-nozzle position; and the H-series targets larger,
              higher-temperature, more professional workflows. The portfolio evidence is primarily third-party and
              should not be read as audited product or pricing disclosure. Across the sources, the repeatable customer
              workflow is consistent: select or prepare a model in Bambu Studio, assign material through AMS hardware,
              calibrate automatically, and monitor jobs through cameras and the mobile app. That integrated sequence is
              the product's core usability proposition, while material compatibility, enclosure requirements, and cloud
              connectivity determine where the proposition breaks down.
            claimRefs:
