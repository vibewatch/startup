      - number: '3.2'
        title: Capability, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              Bambu's strongest buyer-facing differentiation is workflow compression: automatic calibration, high
              acceleration, integrated slicing and mobile control, MakerWorld, and AMS material switching are presented
              as one system. A source describing the current lineup says the integrated system can reduce traditional
              print times by 50% to 70%, but that is an independent editorial estimate rather than a controlled
              benchmark, so it should not be treated as a universal performance claim. The comparison is asymmetric.
              Prusa is associated in the retained coverage with open-source commitment and local support; lower-cost
              alternatives can offer similar core capability at a lower price but require more tuning; and internal
              builds maximize control at the cost of setup, maintenance, and support. Official material guidance also
              shows a product-line trade-off: open A-series machines target PLA/PETG/TPU, while enclosed P-series or X2D
              machines are recommended for ABS, ASA, PA, and carbon-fiber workflows.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP008
              - CP015
      - number: '3.3'
        title: Moat durability and displacement risks
        blocks:
          - type: paragraph
            body: >-
              The ecosystem is a real switching-cost mechanism: users who value a simple
              printer-to-slicer-to-model-library-to-cloud workflow may accept proprietary parts, telemetry, and account
              dependence in exchange for lower operational friction. MakerWorld evidence points to network effects
              around 10 million monthly active users, 2.6 million uploaded models, and 280,000 designers, but the
              retained report is based on company-reported platform data and should be treated as claimed rather than
              independently audited. The main displacement vector is not merely a cheaper printer; it is a buyer who
              values openness, local control, privacy, or third-party software more than convenience. Adverse coverage
              describes cloud initialization requirements, local-access restrictions, and an OrcaSlicer dispute, while
              also recording Bambu's stated security rationale and continued LAN/developer-mode options. This leaves
              durability contingent on whether Bambu can preserve convenience without alienating power users or creating
              unacceptable platform, legal, or outage risk. The assigned evidence does not quantify multi-homing,
              distributor bargaining power, component access, or customer churn, so those potential moat and
              displacement channels remain unscored rather than being treated as advantages.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The moat is workflow, not only hardware
            body: >-
              Bambu Lab combines automatic calibration, software, model discovery, remote control, and AMS into a
              low-friction workflow that can create habit and switching costs.
            calloutType: strength
            claimRefs:
              - CP005
              - CP010
          - type: callout
            title: Convenience is exposed to control backlash
            body: >-
              Cloud dependence, telemetry, firmware restrictions, and the OrcaSlicer dispute create a credible
              displacement path for power users who prioritize openness and local control.
            calloutType: risk
            claimRefs:
