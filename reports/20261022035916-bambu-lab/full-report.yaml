        title: Price breadth and adoption are visible; realized economics are not
        blocks:
          - type: paragraph
            body: >-
              A May 2026 product overview places the lineup from roughly $219 for the A1 mini to $2,399 for the H2C,
              with intermediate products covering entry, enclosed, dual-nozzle, and premium use cases. These are
              third-party-reported starting prices, not realized ASPs after discounts, bundles, taxes, channel margin,
              or returns. Commercial traction is more persuasive than the pricing evidence: 3DPrint.com reported Bambu
              Lab's disclosure of about 10 million monthly active MakerWorld users, while Tom's Hardware reported
              Context data assigning Bambu Lab 37% of global sub-$2,500 printer shipments in 2025. Neither measure is
              revenue, and the MakerWorld figure remains company-reported. Together they indicate reach and
              installed-base potential, but they cannot resolve revenue quality, concentration, or profitability.
            claimRefs:
