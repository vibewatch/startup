      - number: '5.2'
        title: Architecture, automation, and maturity
        blocks:
          - type: paragraph
            body: >-
              The X2D and H2D reviews show a progression from automated consumer convenience toward more capable
              fabrication infrastructure. The X2D combines a primary high-speed direct-drive nozzle with an auxiliary
              Bowden-fed nozzle, an AMS 2 Pro path, camera monitoring, calibration routines, filtration, and an actively
              heated chamber. The H2D adds a larger build volume, dual nozzles, multiple cameras and sensors,
              high-temperature hardware, and an optional laser module. These are concrete architecture elements rather
              than generic “AI” claims. Operational maturity is strongest where the system removes repetitive setup
              work: reviewers describe guided calibration and production use over long operating periods. However, the
              same reviews show increased plumbing, wiring, configuration checks, and feature complexity, while one
              production user reported false alarms and missed failures from AI monitoring. The product is therefore
              mature as an integrated workflow, but not uniformly mature across every automation promise.
            claimRefs:
