  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Hardware anchors a broad but unquantified monetization surface
        blocks:
          - type: paragraph
            body: >-
              Bambu Lab describes itself as a desktop 3D-printer company, and the reviewed product evidence shows a
              connected system spanning printers, AMS multi-material hardware, filament, accessories, software, cloud
              workflow, and MakerWorld. That breadth supports a hardware-led model with possible follow-on revenue from
              accessories and consumables; it does not establish a subscription business or recurring-revenue mix. The
              X1 page says projects can be managed in one cloud, while independent product descriptions connect model
              discovery, slicing, printing, and monitoring. Those surfaces may strengthen retention and cross-sell, but
              none of the assigned sources reports revenue by stream, accessory attach rates, consumables repurchase,
              software monetization, or revenue-recognition policy. The appropriate base case is therefore product
              revenue with ecosystem optionality, not ARR.
