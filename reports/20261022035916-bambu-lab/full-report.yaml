      - number: '4.4'
        title: Financial opacity blocks a capital-adequacy conclusion
        blocks:
          - type: paragraph
            body: >-
              The evidence set contains no audited income statement or balance sheet and no disclosed cash, burn,
              runway, debt schedule, financing terms, or planned use of funds. This matters because a global hardware
              business may need to finance components, finished-goods inventory, tooling, logistics, service parts, and
              returns before customer cash is realized. Publicly visible demand does not reveal inventory turns,
              supplier terms, channel receivables, or downside liquidity. Adverse reporting and practitioner commentary
              also document disputes over cloud control, telemetry, and open-source access; these issues could affect
              support, compliance, infrastructure cost, or retention, but no source quantifies the impact. The financial
              verdict is to track pending primary evidence on audited revenue and margin, working capital, warranty and
              returns, concentration, and financing obligations.
