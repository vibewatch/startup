          - type: callout
            title: Market size is not yet valuation-grade
            body: >-
              Shipment share and platform activity show traction but do not disclose Bambu's revenue mix, monetization,
              or defensible SAM/SOM; ecosystem-control disputes also create a trust constraint for power users.
            calloutType: risk
            claimRefs:
