      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer and user are often the same person in hobby and creator segments, while the budget owner
              diverges in education and small businesses. A household or hobbyist buys for convenience and creative
              output; an educator or lab manager buys for classroom or project throughput; a small business owner buys
              for prototypes, customized merchandise, inventory, or spare parts. The adoption path generally begins with
              an accessible, ready-to-print machine, expands through multi-color or multi-material capability, and
              becomes more valuable when model discovery, slicing, monitoring, and repeat printing are integrated.
              3DPrint's reported MakerWorld figures, including retention and heavy printing cohorts, are consistent with
              repeat use, but remain company data. The principal constraints are not only price: material and
              maintenance costs, print reliability, learning time, supply availability, trust in cloud services, and the
              risk that software or firmware policy limits user control. How-To Geek describes the convenience of
              Bambu's cloud-connected ecosystem while also reporting concern about cloud dependence and a 2025
              restriction affecting third-party slicers. Independent criticism from Jeff Geerling and Tom's Hardware
              makes trust and openness a real adoption consideration for power users, even if mainstream buyers
              prioritize ease of use. This creates a two-speed market: accessible hardware can widen demand, while
              ecosystem friction can cap conversion among technically sophisticated buyers.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: What remains unproven
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence is sufficient to define a market and identify directional growth signals, but not to
              quantify Bambu Lab's addressable profit pool. Public material does not separate printer revenue from
              filament, accessories, software, or platform economics; does not provide a consistent geographic split;
              and does not establish how much MakerWorld activity converts into purchases or business income. Shipment
              share also cannot be translated directly into market dollars without average selling prices, channel mix,
              and the scope of Context's segment. The market thesis is therefore strongest on category accessibility and
              engagement, and weaker on durable monetization and valuation. A diligence process should obtain
              segment-level revenue and gross margin, installed-base and consumables attach data, cohort retention by
              buyer type, regional pricing, channel inventory, warranty and return rates, and the share of prints that
              are commercial rather than hobby use. It should also test whether cloud dependence, firmware policy, and
              open-source disputes reduce enterprise, education, or power-user adoption.
            claimRefs:
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Accessibility is the category wedge
            body: >-
              The strongest market evidence is that automation and integrated workflow can move desktop 3D printing from
              a technical hobby toward repeat household, creator, education, and small-business use.
            calloutType: insight
            claimRefs:
