  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer choice
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than other branded FDM printers. Bambu Lab competes directly with
              Prusa, Creality, Anycubic, Elegoo, and Flashforge for the same desktop-printer purchase; it also competes
              with open-source builds such as Voron or RatRig, internal fabrication, outsourced print services, and the
              status quo of not printing. The evidence base supports a clear segmentation rather than a single winner.
              Bambu's official store positions the A1 mini for education and first-time users, the A1 and P1S for
              regular hobby use, the enclosed P2S for small studios, and the X2D/H2 range for production. Independent
              ecosystem coverage similarly places the A1 mini at roughly $219, the A1 at $299, the P1S at $399, and one
              configuration of the P2S at $799, while describing the portfolio as spanning about $220 to $2,400. A
              separate review distinguishes a $549 P2S from a $799 package with AMS, illustrating why configuration and
              promotion must accompany every price comparison. Those list, starting, or editorial prices are not
              realized transaction prices, and competitor pricing is incomplete in the retained sources.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
