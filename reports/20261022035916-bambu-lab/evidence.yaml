evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: >-
      Primary incorporation or company-history evidence reconciling the 2020 origin reported by BGR with Printara's 2022
      founding date.
    whyItMatters: Company age changes milestone sequencing and the interpretation of execution speed.
    diligencePath: >-
      Request incorporation records and an official chronology separating team formation, legal formation, Kickstarter
      launch, and product launch.
    relatedQuestionRefs:
      - QO002
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current executive roster, board roster, delegated authorities, leadership-change history, and succession plan.
    whyItMatters: The public record cannot establish functional coverage, board oversight, or the severity of key-person dependence.
    diligencePath: Request the organization chart, executive biographies, board materials, and succession or continuity plans.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      A cap table, round history, total raised, valuation, investor rights, secondaries, and debt or credit
      arrangements.
    whyItMatters: Named investors do not reveal dilution, control, liquidation economics, or available cash.
    diligencePath: >-
      Obtain capitalization records, financing documents, shareholder agreements, debt schedules, and bank
      confirmations.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited revenue, margins, cash flow, customer count, installed base, headcount, and definitions for platform usage
      metrics.
    whyItMatters: Users and shipment share are not revenue, customers, profitability, cash, or workforce capacity.
    diligencePath: >-
      Request audited 2025 and year-to-date 2026 financials plus reconciled customer, device, user, and employee
      cohorts.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: A complete investor and stakeholder roster with verified economic, contractual, and control rights.
    whyItMatters: The public stakeholder map cannot establish all owners, counterparties, concentrations, or governance influence.
    diligencePath: >-
      Reconcile the cap table, partnership register, customer concentration schedule, and platform stakeholder
      definitions.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A segment-level market model with geography, average selling price, installed base, repeat demand, and channel
      scope.
    whyItMatters: >-
      Without a reconciled market denominator, shipment share and platform activity cannot support a valuation-grade SAM
      or SOM.
    diligencePath: Request management's market model and reconcile it to Context shipment definitions and regional channel data.
    relatedQuestionRefs:
      - QM008
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: monetization-gap
    missingEvidence: Audited or management-reconciled revenue, margin, consumables attach, and platform monetization by segment.
    whyItMatters: User activity and print hours may be valuable without translating proportionally into revenue or cash generation.
    diligencePath: Obtain segment revenue, gross margin, repeat-purchase, and cohort-conversion schedules under NDA.
    relatedQuestionRefs:
      - QM010
  - type: conflicting-data
    severity: minor
    topic: ecosystem-constraints
    missingEvidence: A direct company response and independent technical assessment of cloud, firmware, and slicer-control allegations.
    whyItMatters: >-
      The dispute may affect power-user trust and enterprise or education adoption, but the assigned evidence is not a
      neutral adjudication.
    diligencePath: Review Bambu's current policy, firmware documentation, incident history, and customer churn or support data.
    relatedQuestionRefs:
      - QM007
  - type: enumeration-incomplete
    severity: material
    topic: competitive-landscape
    missingEvidence: >-
      Comparable current prices, funding, shipment scale, support metrics, strategic roadmaps, and feature tests for
      Creality, Anycubic, Flashforge, Prusa, and other alternatives.
    whyItMatters: >-
      The retained evidence supports buyer segmentation but cannot establish relative market share, capital durability,
      or a complete price-performance ranking.
    diligencePath: >-
      Collect current official price sheets, financing disclosures, independent side-by-side tests, shipment data,
      roadmaps, and service-level evidence for each material alternative.
    relatedQuestionRefs:
      - QP001
      - QP003
    relatedTableRefs:
      - TP001
      - TP003
  - type: conflicting-data
    severity: material
    topic: openness
    missingEvidence: >-
      A primary, independently reviewable record resolving the legal and technical claims in the OrcaSlicer and AGPL
      dispute.
    whyItMatters: >-
      The dispute could affect trust, third-party software access, and ecosystem durability, but current sources report
      allegations and company positions rather than a final adjudication.
    diligencePath: Review the relevant correspondence, repository history, license obligations, and any court or settlement record.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: missing-source
