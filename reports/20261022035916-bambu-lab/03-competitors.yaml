      - [Bambu A1, "$299 starting price", "Full-size open-frame printer; AMS Lite-compatible", "Starting/list price; realized price unknown", "Targets mainstream hobby adoption"]
      - [Bambu P1S, "$399 starting price", "Enclosed high-speed workhorse", "Starting/list price; realized price unknown", "Bridges hobby and engineering-material use"]
