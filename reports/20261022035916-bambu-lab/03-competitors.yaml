      - [Bambu X2D, "$899 starting price", "Dual-nozzle multi-color positioning", "Starting/list price; realized price unknown", "Competes on convenience and material separation"]
      - [Elegoo Centauri Carbon, "$290-$350 reported street range", "Budget alternative described as offering about 90% of capability", "Editorial range; not independently verified here", "Price pressure is credible, but convenience and support trade off"]
      - [Bambu H2 series, "$1,249-$2,399 reported starting points", "Premium single-nozzle through flagship multi-material tiers", "Starting/list prices; realized price unknown", "Extends the ecosystem toward professional and small-business demand"]
    notes: "Prices are publisher- or company-reported starting/street prices from 2026 coverage, not audited transaction data; competitor coverage is partial."
    claimRefs: [CP002, CP003, CP004, CP008, CP015]

