callouts:
  - calloutType: strength
    title: "The moat is workflow, not only hardware"
    body: "Bambu Lab combines automatic calibration, software, model discovery, remote control, and AMS into a low-friction workflow that can create habit and switching costs."
    claimRefs: [CP005, CP010]
  - calloutType: risk
    title: "Convenience is exposed to control backlash"
    body: "Cloud dependence, telemetry, firmware restrictions, and the OrcaSlicer dispute create a credible displacement path for power users who prioritize openness and local control."
    claimRefs: [CP011, CP012, CP013, CP014]

