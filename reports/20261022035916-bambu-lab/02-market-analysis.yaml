callouts:
  - calloutType: insight
    title: Accessibility is the category wedge
    body: >-
      The strongest market evidence is that automation and integrated workflow
      can move desktop 3D printing from a technical hobby toward repeat
      household, creator, education, and small-business use.
    claimRefs: [CM001, CM002, CM010, CM011]
  - calloutType: risk
    title: Market size is not yet valuation-grade
    body: >-
      Shipment share and platform activity show traction but do not disclose
      Bambu's revenue mix, monetization, or defensible SAM/SOM; ecosystem-control
      disputes also create a trust constraint for power users.
    claimRefs: [CM005, CM013, CM015, CM016]
