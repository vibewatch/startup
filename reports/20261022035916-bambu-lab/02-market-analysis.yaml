      - [Family and beginner creator, Parent or individual purchaser, Family member or creator, Household, "Create practical or decorative objects", Household discretionary budget, "Accessible price and automation"]
      - [School or educator, School, teacher or student, School or lab budget, "Classroom projects and robotics", Education budget owner, "Preassembled hardware and repeatability"]
      - [Maker and prototyping lab, Lab manager or creator, Designer or engineer, Lab or project budget, "Prototype and iterate locally", Department or project budget, "Speed and material flexibility"]
