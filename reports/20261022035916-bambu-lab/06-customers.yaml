chapter:
  number: 6
  title: Customers
  summary: Bambu Lab's customer proposition is strongest where buyers value immediate, low-maintenance printing and an integrated hardware-software workflow. Public evidence supports broad community engagement and strong user advocacy, but retention, revenue concentration, production deployment, and customer economics remain undisclosed.
sections:
  - id: customer-segments
    title: Buyer segments and adoption surfaces
    body: >-
      Public product coverage indicates a laddered customer base rather than one homogeneous
      segment. The A series is positioned for beginners and open-frame materials, the P series
      for more demanding hobbyists, and the H series for advanced fabrication and small-business
      use. This segmentation is visible in both pricing and workflow requirements: entry users
      prioritize rapid setup and automatic calibration, while professional users value enclosed
      chambers, repeatability, multi-material handling, and lower intervention. The customer
      journey therefore begins with a low-friction first print, then can expand into AMS
      accessories, additional machines, MakerWorld content, and commercial or creator use.
      These are observable adoption surfaces, not proof of recurring revenue or account-level
      expansion.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption trajectory and usage intensity
    body: >-
      The clearest public adoption evidence is activity around MakerWorld and Bambu's control
      software, rather than a disclosed count of paying printer customers. A 3DPrint.com report
      says MakerWorld had about 10 million monthly active users in 2025, 2.6 million original
      models, and more than 7,000 new models per day; it also reports 290 million print hours
      and an 83% one-year retention rate for the platform. Those figures are company-reported
      or company-derived platform metrics as relayed by a trade publication, so they should not
      be treated as audited hardware sell-through, net revenue retention, or printer fleet
      utilization. Reviews from named technology writers provide corroborating qualitative
      evidence that the A1 mini can reach first print quickly and that the common software and
      machine workflow encourages repeat use.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: durability-and-concentration
    title: Durability, expansion, and customer risk
    body: >-
      The ecosystem creates plausible switching costs through shared software, profiles, AMS
      accessories, cloud services, and a model library. A named How-To Geek reviewer describes
      moving from an A1 mini to P1S and P2S machines because the workflow remains consistent
      across the fleet, while Printara describes Bambu Studio, Bambu Handy, MakerWorld, and AMS
      as an integrated whole. That is evidence of user-perceived workflow durability, not a
      measured renewal or expansion rate. The counter-signal is customer dependence on a
      controlled cloud and firmware layer: coverage of the 2025 authorization changes and the
      OrcaSlicer dispute describes backlash among power users, while LAN-only operation carries
      feature trade-offs. Public data do not establish top-customer concentration, production
      versus pilot mix, warranty or return rates, or the share of revenue from consumables,
      accessories, software, or services.
    claimRefs: [CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
