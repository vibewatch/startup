      - [Software and slicer access, Bambu Lab and third-party slicer developers, Workflow control and cloud authentication, High for integrated workflows, Legal or technical restriction disrupts third-party software access, High, Documented API and license governance plus change control, High while the dispute remains unresolved]
      - [Product support and spare parts, Bambu Lab and regional resellers, Repair continuity and lifecycle support, Unknown by region and model, Parts delay or end-of-support extends fleet downtime, High, Contracted service levels and stocked critical spares, Medium-high because service metrics are private]
      - [MakerWorld and product ecosystem, Bambu Lab platform and model portfolio, Discovery files community and hardware attachment, Material but unaudited, Platform or compatibility failure affects a large reported user base, Medium-high, Segmented failover and model-specific support plans, Medium-high]
    notes: Rows are ordered by qualitative severity. Concentration and residual exposure are underwriting judgments based on retained evidence; public sources do not provide audited uptime, supplier shares, or service-level denominators.
    claimRefs: [CR001, CR002, CR003, CR006, CR007, CR008, CR009, CR011, CR014, CR015, CR016]
  - id: TR002
    title: Regulatory / legal risk register
    columns: ["Rule, license, or case", Jurisdiction, Public status, Severity, Mitigation or diligence path, Residual exposure]
    rows:
      - [A1 electrical-safety recall, Not specified in retained article, Historical recall reported in industry press, Critical, "Obtain recall notice, closure, affected-unit count, and corrective-action evidence", High]
      - [OrcaSlicer fork and AGPL/cloud dispute, Software and contractual context, Public dispute described in 2026 reporting, High, "Review complete correspondence, license obligations, and any filed or settled claims", High]
      - [Cloud telemetry and data ownership, Not specified in retained article, Community and reviewer concern; no audit retained, High, "Obtain data map, retention policy, opt-out controls, and independent security assessment", High]
    notes: This is a partial public-source register, not a complete litigation or regulatory enumeration; unknown jurisdiction and status fields are preserved as gaps rather than inferred.
    enumerationScope:
      coverage: partial
      basis: Retained public reporting and reviews through the 2026-10-22 run date; no private docket or regulator data was available in the assigned pool.
    claimRefs: [CR005, CR007, CR008]
  - id: TR003
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Cloud outage removes remote monitoring or control, Medium, High, Partial, High, Current uptime and offline feature parity are not independently established]
      - [Firmware or software change disrupts workflow, Medium, High, Partial, Medium-high, Change-control and rollback evidence are not public]
      - [Material mismatch or AMS jam causes failed production print, Medium, Medium, Partial, Medium, Fleet-specific failure and rework rates are not public]
      - [Repair or spare-part bottleneck extends downtime, Medium, High, Low-to-partial, High, Regional service-level and parts lead-time data are not public]
      - [Security or identity-control weakness affects cloud infrastructure, Low-to-medium, Critical, Low-to-partial, High, Independent penetration-test and incident-disclosure evidence is not retained]
    notes: Operational rows combine observed review limitations with unresolved diligence questions; likelihood is a qualitative underwriting judgment, not a published incident rate.
    claimRefs: [CR002, CR003, CR010, CR011, CR012, CR013, CR015, CR016]
