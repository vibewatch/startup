callouts:
  - calloutType: risk
    title: Highest-conviction risk
    body: "The strongest evidence-backed risk is platform concentration: cloud access, telemetry, proprietary software, and hardware workflows are interdependent, while the retained sources do not provide independently audited uptime, security, or offline parity."
    claimRefs: [CR001, CR002, CR003, CR013]
  - calloutType: assumption
    title: Evidence boundary
    body: The retained pool supports risk identification and diligence paths, but it does not establish current litigation outcomes, repeat safety-event frequency, supplier concentration, warranty loss rates, or cash capacity to absorb remediation.
    claimRefs: [CR005, CR008, CR012, CR016]
