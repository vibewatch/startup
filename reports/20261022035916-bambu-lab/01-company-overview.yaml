callouts:
  - calloutType: strength
    title: Platform reach is visible but not financial proof
    body: MakerWorld activity and entry-level shipment share support meaningful reach, while the integrated hardware-software model creates multiple engagement surfaces. Neither metric establishes revenue quality, profitability, or customer economics.
    claimRefs: [CO001, CO010, CO011]
  - calloutType: risk
    title: Private-company opacity remains material
    body: Public sources name leaders and investors but do not establish the cap table, financing terms, board rights, audited financials, valuation, customer count, or headcount.
    claimRefs: [CO005, CO006, CO007]
