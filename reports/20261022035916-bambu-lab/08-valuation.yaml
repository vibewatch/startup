callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: >-
      Bambu Lab has credible operating traction, but the assigned evidence cannot
      establish whether the reported valuation compensates investors for disclosure,
      dilution, hardware, and governance risks.
    claimRefs: [CV001, CV004, CV015, CV016]
  - calloutType: risk
    title: Price discovery is the gating item
    body: >-
      Obtain a current arm’s-length financing price, cap table, preferences, and
      audited or management financial package before assigning a target return.
    claimRefs: [CV015, CV016]
