      - [Net printer ASP, null, "Unavailable", "Connects shipments to recognized hardware revenue", "Obtain net ASP by SKU, geography, and channel"]
      - [Gross margin, null, "Unavailable", "Tests whether demand produces contribution", "Obtain margin bridge for product mix, freight, warranty, and cloud"]
      - [Accessory attach rate, null, "Unavailable", "Measures cross-sell from the installed base", "Obtain AMS and accessory attach by printer cohort"]
      - [Consumables repurchase, null, "Unavailable", "Tests recurring economics beyond initial hardware", "Obtain filament orders and contribution by cohort"]
      - [CAC and payback, null, "Unavailable", "Tests sales and marketing efficiency", "Obtain acquisition spend, attributed orders, and payback"]
      - [Warranty and returns, null, "Unavailable", "Hardware failures can reverse reported sales economics", "Obtain claims, return rate, refurbishments, and reserve policy"]
      - [Inventory turns, null, "Unavailable", "Determines working-capital intensity and obsolescence risk", "Obtain inventory aging, turns, payables, and channel terms"]
      - [Cash and runway, null, "Unavailable", "Determines financing dependency and downside timing", "Obtain cash, monthly burn, restricted cash, and scenario runway"]
      - [Debt and obligations, null, "Unavailable", "Tests covenant, security, and refinancing risk", "Obtain debt schedule, leases, guarantees, and covenants"]
      - [Revenue concentration, null, "Unavailable", "Tests exposure to channels, geographies, and large buyers", "Obtain revenue by region, channel, and top counterparties"]
      - [Cloud and support cost, null, "Unavailable", "Tests economics of the connected ecosystem", "Obtain infrastructure, support, incident, and compliance cost"]
    notes: "Null means the assigned public evidence does not disclose the metric; no unavailable input is treated as zero or estimated."
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI015]
