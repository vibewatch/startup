    title: Revenue model bridge
    type: flow
    summary: Customer discovery and hardware purchases may create accessory and consumables demand, but the assigned evidence does not quantify conversion, revenue mix, or gross profit.
    data:
      nodes:
        - id: discovery
          label: MakerWorld discovery
          detail: "Company-reported engagement can expose users to models and use cases."
        - id: printer
          label: Printer purchase
          detail: "Hardware spans entry through premium price tiers."
        - id: activity
