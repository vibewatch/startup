          detail: "Apps, slicing, cloud workflow, and model sharing support use."
        - id: attach
          label: AMS and accessories
          detail: "Add-on hardware creates a potential cross-sell stream."
        - id: repeat
          label: Filament and consumables
          detail: "Installed users create possible repeat demand, but repurchase is undisclosed."
        - id: revenue
          label: Recognized revenue
          detail: "Mix, period, discounts, and recognition policy are unavailable."
        - id: gross-profit
          label: Gross profit
          detail: "Product cost, freight, warranty, channel, and cloud costs are unavailable."
      edges:
        - [discovery, printer]
        - [printer, activity]
        - [activity, attach]
        - [activity, repeat]
        - [printer, revenue]
        - [attach, revenue]
        - [repeat, revenue]
        - [revenue, gross-profit]
    approximationNotes: "This is a qualitative mechanism map, not a measured funnel, conversion model, or accounting reconciliation."
    claimRefs: [CI002, CI003, CI006, CI007]
callouts:
  - calloutType: strength
    title: Demand signals support installed-base potential
    body: >-
      Company-reported MakerWorld activity and Context shipment-share reporting indicate meaningful
      reach, although neither is audited revenue or proof of profitability.
    claimRefs: [CI006, CI007, CI008]
  - calloutType: risk
    title: Financial opacity is the decisive blocker
    body: >-
      Audited revenue, gross margin, cash, burn, working capital, warranty, concentration, and
      financing obligations are absent from the assigned evidence.
    claimRefs: [CI010, CI011, CI012, CI013, CI016]
  - calloutType: recommendation
    title: Track until primary financial evidence is available
    body: >-
      Do not convert shipment share, users, or list pricing into a valuation case until management
      provides auditable revenue quality, margin, liquidity, and unit-economics data.
    claimRefs: [CI005, CI008, CI016]
