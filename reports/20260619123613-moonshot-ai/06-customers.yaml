- id: durability-and-concentration-blind-spots
  title: Monetization paths are visible, but durability and concentration are still under-disclosed
  body: 'Moonshot does have visible expansion logic. A user can start free, buy faster priority access, pay for API consumption, and likely graduate into more structured business workflows through workspaces, Kimi Code, or business plans. The problem is that the public disclosures stop before the part investors care most about. No retained source disclosed NRR, GRR, churn, renewal schedules, active business accounts, or the split between consumer subscriptions, API revenue, and any channel-led revenue. Just as importantly, the trust and compliance stack is not clean enough to ignore: SCMP reported an excessive-data-collection finding, OECD logged a resume leak, and Moonshot’s privacy policy allows user content processing for service improvement and model training depending on jurisdiction. Those issues do not erase the adoption story, but they do mean expansion could be slowed by procurement, privacy, or trust objections in the exact customer segments that would otherwise improve monetization
    quality. The right current posture is therefore conditional: Kimi clearly has scale and monetization routes, but public evidence still falls short of proving durable, low-concentration enterprise revenue.'
