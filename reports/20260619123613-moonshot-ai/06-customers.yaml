  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, logo retention, paid-member retention, and churn by major product line.
    whyItMatters: Adoption breadth does not by itself prove that Kimi is a durable business with healthy renewal economics.
    diligencePath: Request retention and churn cohorts for app members, API customers, and any business-plan customers over the last four quarters.
    relatedQuestionRefs:
    - QU013
    - QU025
