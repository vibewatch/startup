  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Revenue mix across app subscriptions, API, and business plans plus top-customer and top-channel concentration.
    whyItMatters: Moonshot could have strong visible adoption while still depending on a narrow monetization base or a small number of high-spend accounts.
    diligencePath: Request top-10 customer share, channel mix, partner-sourced revenue, and the percentage of revenue attributable to consumer subscriptions versus API and business products.
