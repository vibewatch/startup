  - type: conflicting-data
    severity: minor
    topic: adoption-denominator-gap
    missingEvidence: A single canonical Moonshot disclosure bridging app ratings, web visits, and active accounts to paying user counts.
    whyItMatters: The public evidence is strong on proxies but weak on denominator alignment, which makes it easy to over-read broad usage as durable monetization.
    diligencePath: Request a monthly dashboard showing MAU, WAU, DAU, paid members, paying API customers, and business accounts using the same period definitions.
