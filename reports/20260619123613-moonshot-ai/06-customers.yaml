- id: adoption-and-scale-proxies
  title: Adoption proxies show meaningful scale, but mostly on consumer and platform metrics
  body: 'Moonshot has enough independent traffic and app evidence to argue Kimi is well beyond novelty stage. SEMrush reported 34.15 million visits to kimi.com in May 2026, with China as the largest audience but the United States and India also showing visible shares. SCMP separately reported that Kimi ranked fifth among China’s most popular AI apps and that Moonshot and Zhipu together had nearly 35 million monthly active users as of April. The App Store surface adds a different kind of proof: Kimi carried a 4.9 out of 5 score from 190,000 ratings and showed an active in-app purchase ladder. None of these metrics is the same as disclosed paid seats, active accounts, or revenue-quality cohorts, but together they establish real user breadth. The stronger interpretation is not “Moonshot has proved enterprise durability”; it is that the company has proved broad reach across web, mobile, and ranking surfaces and has already started converting part of that reach into paid access. That breadth
    matters because it lowers the burden of proving interest, while leaving the harder questions of paid depth and retention unresolved.'
