- id: developer-proof-vs-enterprise-proof
  title: Public proof is denser in developers and visible users than in named enterprise accounts
  body: The most tangible non-consumer adoption proof today comes from Moonshot’s developer surfaces, not from named enterprise logos. GitHub and Hugging Face show a fast release cadence, multiple current Kimi model families, and meaningful community activity on Kimi K2 and Kimi Code. CNBC’s coverage of Kimi K2 adds that Moonshot has tried to underprice Western rivals while open-sourcing the model, which is a classic builder-acquisition move. K2.6’s official page also says the model is available across website, app, API, and Kimi Code, reinforcing a multi-surface distribution strategy. By contrast, the retained public source set does not disclose a named paying enterprise customer, contract size, or a reference deployment that can be clearly labeled production rather than pilot. That does not mean business demand is absent; it means the evidence quality is asymmetric. Moonshot has enough developer and power-user proof to show authentic external pull, but not enough public enterprise detail
    to claim diversified production maturity across large accounts.
