- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Free-to-paid consumer ladder
    - Unknown conversion from free to paid members
    - Consumer breadth may not translate into durable revenue quality
    - Request monthly active payers, conversion curve, and refund rates
  - - API and Kimi Code adoption
    - Unknown mix of hobbyist builders vs. production customers
    - Developer enthusiasm may overstate monetization depth
    - Request active API customers, spend distribution, and top-10 account concentration
  - - Business/workspace features
    - No named public enterprise accounts or public seat schedule
    - Land-and-expand story exists conceptually but is not yet underwritten publicly
    - Request named references, ACV bands, and deployment maturity
  - - International traffic
    - Unknown revenue share outside China
    - Some diversification exists, but geographic monetization may still be China-heavy
    - Request regional revenue and retention split
  - - Trust-sensitive workflows
    - Privacy and data-governance issues may slow enterprise procurement
    - Can reduce conversion from visible adoption into durable business contracts
    - Request security diligence pack, complaint trend, and enterprise opt-out controls
  notes: The expansion logic is visible, but concentration and revenue-quality disclosures are not. This is the central reason the customer chapter cannot move from “scaled adoption” to “fully proven durability.”
