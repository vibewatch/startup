  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-enterprise-proof-gap
    missingEvidence: Named paying enterprise customers, deployment stage, contract scope, and at least two reference calls or published case studies.
    whyItMatters: Moonshot’s public customer evidence is strong for consumers and developers but still weak for enterprise production proof, which limits confidence in durable high-ACV revenue.
    diligencePath: Request a current customer reference list segmented by consumer, API, and business accounts, with at least three named enterprise references and deployment status notes.
    relatedQuestionRefs:
    - QU011
    - QU012
