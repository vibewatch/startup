tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - primary use case
  - evidence-backed scale
  - revenue / strategic value
  - gap
  rows:
  - - Consumer app users
    - Buyer=user=payer on mobile or web
    - Chat, deep research, file understanding, slides, and daily productivity help
    - 190k App Store ratings; visible in-app purchase ladder; top-5 China AI app ranking proxy
    - Largest public top-of-funnel and clearest monetization surface
    - No public split between free users, paid members, and retained monthly actives
  - - Professional knowledge workers
    - Buyer may be the individual; user is the same person; payer is self-serve or small-team budget
    - Research, legal/financial file reading, writing, presentation generation, and spreadsheet work
    - Official surfaces explicitly target researchers, legal professionals, and internet workers
    - Can convert high-frequency workflows into paid plans or API use
    - No public disclosure of seat counts, ACVs, or function-level penetration
  - - Developers and builders
    - Buyer is engineering or product lead; user is developers; payer is product or engineering budget
    - API use, Kimi Code, open-source model deployment, and agentic application building
    - Platform claims millions of professional developers; GitHub/Hugging Face show active external pull
    - Higher-value route because it embeds Kimi into downstream products and workflows
    - No public breakdown of paid API customers or enterprise developer contracts
  - - Teams / workspace users
    - Buyer is likely manager, ops lead, or IT; users are cross-functional contributors; payer is team or department budget
    - Shared workspaces, coordinated agents, document-to-skill reuse, and business administration
    - Help center and K2.6 materials show workspaces, Claw Groups, and business-plan scaffolding
    - Most plausible land-and-expand bridge toward enterprise spend
    - No public seat schedule, business-plan customer count, or named team deployment
  - - International users
    - Buyer/user/payer vary by channel
    - English-language use, cross-border web access, open-source adoption, and app installs outside China
    - SEMrush shows U.S. and India traffic shares; App Store listing supports English
    - Useful hedge against purely domestic traffic concentration
    - No public regional revenue or retention disclosure
  notes: Segmentation is strongest by surface and workflow, not by disclosed ARR or logo count. Buyer-user-payer distinctions are inferred from official surfaces, pricing, and developer distribution channels.
