chapter:
  number: 6
  title: Customers
  summary: 'Moonshot AI’s public customer evidence is strongest in consumer and developer channels rather than named enterprise accounts: Kimi has large app-store and web-traffic proxies, visible paid consumer and API pricing, and a fast-moving open-source ecosystem. The weak point is enterprise durability proof. Official surfaces show workspaces, business features, and professional workflows, but the retained public source set does not disclose named paying enterprise customers, retention cohorts, or customer concentration.'
sections:
- id: segmentation-and-surfaces
  title: Kimi now spans consumers, professionals, developers, and early team workflows
  body: 'Moonshot’s customer story is broader than a simple consumer chatbot, but the public record still points to a consumer-led installed base rather than a disclosed enterprise one. Kimi’s own surfaces show consumer chat, agentic research, website and slide generation, deep-research workflows, API access, and Kimi Code. The help center further separates Membership from Kimi Business, which implies Moonshot already thinks in buyer-versus-user-versus-payer terms even if it does not publish a traditional enterprise case-study page. The App Store description also makes the targeting unusually explicit by naming programmers, researchers, students, internet workers, legal professionals, and general AI-curious users. That is important because it suggests Kimi’s present customer map is role-based and workflow-based: end users come in through mobile and web, professional builders come in through API and open-source tooling, and teams are the still-thinly disclosed layer sitting above those entry
    points. What is still missing is a named buyer list that shows who has crossed from interesting workflow adoption into durable enterprise spend.'
