    severity: material
    topic: governance / TO002 leadership coverage
    missingEvidence: >-
      Board roster, committee structure, finance leadership disclosure, and a fuller executive bench beyond the
      founder-centric public record.
    whyItMatters: >-
      A $20B private AI company with opaque governance is harder to underwrite on controls, succession, investor rights,
      and management depth.
    diligencePath: >-
      Request board deck excerpts, cap-table governance summary, executive list, and committee materials from the data
      room.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
