  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Nested lenses from broad China AI adoption conditions down to the narrower public demand and workflow pools Kimi can plausibly monetize today.
  data:
    nodes:
    - label: Broad China AI+ backdrop
      value: 70% by 2027; 90% by 2030
      detail: IDC FutureScape China AI+ smart-device and AI-agent penetration targets.
    - label: Enterprise sovereignty wave
      value: 80% of C1000 by 2027
      detail: IDC says mission-critical enterprise AI will prioritize sovereignty, nonpublic hosting, open tech, and regional partners.
    - label: Visible monitored demand pool
      value: 1.089B web visits + 1.199B app MAU
      detail: AICPB April 2026 China AI ranking pools are usage proxies, not revenue.
    - label: Kimi current observed position
      value: 43.69M web visits; 25.33M app MAU
      detail: AICPB ranks Kimi fifth on China AI websites and eighth on China AI apps in April 2026.
    - label: Near-term monetizable focus
      value: research + knowledge work + API + enterprise agents
      detail: Moonshot’s public products most clearly support these flows rather than all AI spend in China.
  approximationNotes: This pyramid intentionally mixes adoption, traffic, and workflow layers because open sources do not disclose a clean standalone RMB TAM for Kimi’s exact category.
