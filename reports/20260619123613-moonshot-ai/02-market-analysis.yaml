- id: drivers-constraints-and-regulation
  title: Growth drivers, pricing compression, and regulation
  body: |-
    Three drivers stand out. First, OpenAI’s absence from mainland China and IDC’s emphasis on AI sovereignty create a structural opening for domestic substitutes. Second, Chinese vendors are pushing faster releases, multimodality, and ecosystem integration, which keeps users actively sampling local products. Third, transparent public price ladders make experimentation cheap enough to widen the top of funnel. But the same facts create the core constraints. DeepSeek’s pricing shows that the local floor can sit well below Kimi’s list price, and Qwen, ERNIE, and other platforms offer their own OpenAI-compatible or multimodal alternatives. That compresses willingness to pay before customer lock-in is deep. IDC’s coding excerpt makes the same point: adoption can grow faster than realized revenue.

    Regulation adds another layer of market structure. China’s 2023 generative-AI measures require providers to manage content, privacy, and security responsibilities for public services. The 2025 labeling rules then add explicit and implicit marks on generated content and metadata. These rules can help domestic vendors relative to foreign services that are not supported in mainland China, but they are not a free moat. They raise compliance cost, require operational controls, and make enterprise-grade governance more important. Finally, Caixin’s reporting on chip restrictions shows that compute supply remains a live constraint. Moonshot therefore operates in a market with real demand tailwinds, but also with concentrated price pressure, policy overhead, and capital intensity that limit how quickly usage can translate into durable margin.
