- id: switching-costs-and-moats
  title: Switching costs, lock-in, and moat durability
  body: |-
    At the model layer, switching costs remain lower than in many historical software categories. Kimi publishes an OpenAI migration guide; DeepSeek supports OpenAI and Anthropic formats; Alibaba explicitly offers OpenAI-compatible APIs; Zhipu documents OpenAI-SDK compatibility; and MiniMax token-plan docs expose Anthropic-style integration. That combination makes price and benchmark comparison structurally easier for buyers. A vendor that only wins on model quality alone can therefore be displaced quickly.

    Durable moats sit one layer higher. Distribution through consumer or commerce ecosystems, explicit governance tooling, search and knowledge assets, and deeper workflow embedding all raise the real cost of switching. Baidu’s enterprise controls and search assets, Alibaba’s commerce graph, ByteDance’s app reach, and Tencent’s super-app positioning all operate in that higher layer. Kimi’s moat is more modest but still real: it has a recognizable brand, long-context positioning, public knowledge-work surfaces, and migration ease for developers already using OpenAI-style tooling. The question is whether that combination compounds fast enough before local pricing pressure and platform-backed rivals narrow the gap further.
