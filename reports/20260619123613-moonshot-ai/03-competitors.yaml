  evidenceGaps:
  - type: missing-source
    severity: material
    topic: win-rates-and-churn
    missingEvidence: Public competitive win-rate, churn, or renewal data for Kimi against specific rivals.
    whyItMatters: Without disclosed win-rate or renewal evidence, the chapter can compare product surfaces and distribution but cannot quantify competitive durability.
    diligencePath: Look for investor materials, procurement interviews, or management commentary that quantify competitive conversion and retention.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: enterprise-discounting
    missingEvidence: Public enterprise discount ladders, seat bundles, or committed-spend contracts across Kimi and local rivals.
    whyItMatters: List prices are useful but incomplete when larger accounts may buy through credits, bundles, or bespoke contracts.
    diligencePath: Collect customer procurement anecdotes, partner quotes, or disclosed enterprise plan sheets in a future refresh.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: minor
    topic: consumer-retention-cohorts
    missingEvidence: Public retention or cohort metrics for Kimi, Doubao, DeepSeek, and Qwen consumer apps.
    whyItMatters: Traffic and MAU show reach, but retention would better measure moat durability in assistants.
    diligencePath: Seek app-analytics exports or company disclosures that break out retention, engagement, and paid-conversion behavior.
