- id: product-capability-breadth
  title: Product and capability breadth across major rivals
  body: |-
    Public product pages show that most serious Kimi competitors now sell far more than a single text model. DeepSeek combines chat, app, API, and open-source research assets. Z.ai emphasizes long-horizon agents, mobile automation, multimodality, and coding releases. Doubao’s parent stack spans text, code, video, image, speech, and realtime voice. Baidu Qianfan extends further into enterprise agent development, RAG, search, encyclopedia tools, and observability. Qwen runs both first-party models and third-party access through Model Studio. MiniMax couples code with Hailuo video, audio, and Talkie. Against that field, Kimi’s own breadth is credible: assistant workflows, deep research, spreadsheets, slides, coding, and API tooling all exist in the public evidence.

    The consequence is that capability breadth alone is not a sufficient moat for Kimi. It is table stakes. Buyers can plausibly solve similar jobs with several rival stacks. What changes by rival is the balance among coding strength, consumer distribution, multimodal creation, governance, and compatibility. That is why unsupported cells must stay unknown where public evidence is thin and why the comparison should focus on the most decision-relevant capabilities rather than on vague “AI leadership” claims.
