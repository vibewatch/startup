- id: pricing-packaging-and-distribution
  title: Pricing, packaging, and distribution power
  body: |-
    The clearest public economic threat to Kimi is not OpenAI’s premium pricing but local price compression. DeepSeek’s official pricing materially undercuts Kimi. Qwen and Baidu also publish broad model ladders, while OpenAI, Anthropic, and Google establish premium outside-reference ceilings. Kimi remains cheaper than many U.S. references, but that is not enough to guarantee share if local rivals are even cheaper or if ecosystem owners can subsidize adoption. Public packaging evidence also differs. Anthropic and Baidu explicitly foreground compliance or audit capabilities. MiniMax and Z.ai foreground coding-tool integration. Alibaba and ByteDance pair models with broader ecosystems and user funnels.

    Distribution power is therefore one of the biggest asymmetries in this market. CNBC’s agentic-commerce coverage shows Alibaba linking Qwen directly into Taobao, Fliggy, and Alipay, while ByteDance pushes Doubao through commerce and mobile-device paths. Those are distribution and retention moats Kimi does not obviously match in the fetched set. Kimi’s strongest compensating lever is lower switching friction for existing OpenAI-style developers and a product suite that stays close to knowledge work, but that is a narrower moat than owning a super-app or commerce network.
