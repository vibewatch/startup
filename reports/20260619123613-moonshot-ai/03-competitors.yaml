chapter:
  number: 3
  title: Competitors
  summary: Kimi competes against a deep domestic field, not only against outside U.S. benchmarks. Public evidence shows the sharpest local threats come from DeepSeek on price, Doubao and Qwen on ecosystem-backed distribution, Baidu on enterprise platform tooling, and Z.ai plus MiniMax on coding-agent or multimodal breadth. Kimi remains a real challenger with meaningful traffic and credible long-context knowledge-work positioning, but the public source set does not yet support a moat broader than migration ease, workflow focus, and continued execution speed.
sections:
- id: landscape-overview
  title: 'Landscape structure: direct peers, platform giants, and outside references'
  body: |-
    Kimi does not compete in a tidy one-vendor market. The strongest domestic peers span three overlapping classes. First are direct frontier-model rivals such as DeepSeek, Z.ai/GLM, Qwen, MiniMax, and Baidu ERNIE that compete for API, coding, and agent workloads. Second are parent-platform giants such as ByteDance, Alibaba, Baidu, and Tencent that can pair models with existing consumer, commerce, search, payments, or productivity distribution. Third are outside references—OpenAI, Anthropic, and Google—that matter even when they are not the default legal choice in mainland China because buyers still benchmark quality, packaging, and price against them.

    This structure matters because Kimi can look strong or weak depending on the comparison axis. Against premium U.S. references, Kimi can look cost-effective and localized. Against DeepSeek, it can look expensive. Against Doubao, it can look narrower on mass-market reach. Against Baidu or Alibaba, it can look thinner on public enterprise controls and distribution. A serious competitor chapter therefore has to cover both direct model peers and the adjacent ecosystems that can subsidize or distribute AI more aggressively than an independent lab can.
