- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Key metric
  - Multiple / valuation
  - Relevance
  - Limitation
  rows:
  - - Moonshot AI (private, May 2026)
    - ARR >$200M in April 2026
    - $20B reported valuation; ~100x implied ARR multiple on the minimum public anchor
    - Closest direct anchor for the decision
    - Public ARR is a floor signal, not audited revenue
  - - Anthropic (private, May 2026)
    - Run-rate revenue $47B
    - $965B post-money; ~20.5x run-rate revenue
    - Shows what a scaled frontier-model winner can command
    - Much larger, more global, and more disclosed than Moonshot
  - - OpenAI (private, Mar 2026)
    - Revenue $2B/month (~$24B annualized)
    - $852B post-money; ~35.5x annualized revenue
    - Shows frontier scarcity premium under extreme distribution advantage
    - Different distribution, compute control, and geopolitical context
  - - Zhipu AI (public debut, Jan 2026)
    - H1 2025 revenue CNY190.9M; heavy losses
    - $7.4B debut market cap
    - Shows Hong Kong investors will capitalize China AI scarcity despite losses
    - Revenue period not full-year and business mix differs
  - - MiniMax (public debut, Jan 2026)
    - $619M IPO raise; >$11.5B debut market cap; 69.4% GM in 9M25
    - Public market accepted very rich valuation on a lossmaking China AI issuer
    - Useful China frontier-model precedent
    - Debut-day market cap is volatile and not a steady-state valuation
  - - C3.ai (public, Jun 2026)
    - FY2026 revenue $250.3M
    - $1.50B market cap; 3.9x EV/Sales
    - Lower bound for subscale AI software with weak economics
    - Not a frontier-model platform and much lower growth
  - - Palantir (public, Jun 2026)
    - TTM revenue $5.22B
    - $307.98B market cap; 57.46x EV/Sales
    - Upper public bound for AI-driven growth with proven profitability and cash generation
    - Far more mature and profitable than Moonshot
  notes: This is a sample-based comparable set, not an exhaustive universe of every AI issuer. It is intended to bracket rather than precisely price Moonshot.
  enumerationScope:
    coverage: sample
    basis: Selected private frontier-model rounds, Chinese AI IPOs, and public AI software comps that bracket Moonshot's current valuation debate as of June 2026.
