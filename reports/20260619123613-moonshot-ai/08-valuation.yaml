  - - Bear
    - ARR stalls near ~$250M and multiple compresses to 30-40x
    - $7.5B-$10.0B implied value; material downside from current levels
    - Would follow IPO delay, slower paid adoption, or weaker margin quality
    - Down-round, governance discount, and valuation reset
  notes: Scenario math is illustrative and intentionally rounded because cap-table terms, dilution, and audited ARR are undisclosed.
