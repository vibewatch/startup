- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited monetization bridge
    - Monthly recognized revenue, ARR, deferred revenue, and prepaid balances
    - Determines whether April ARR is durable enough to support the current mark
    - Finance team / auditor package
  - - Cap table and preference stack
    - Full capitalization table, liquidation waterfall, anti-dilution, ROFR, and investor-rights terms
    - Determines actual security quality and downside protection
    - Company counsel and CFO
  - - Gross-margin bridge
    - Hosted-versus-partner routing economics, compute commitments, and support cost allocation
    - Reveals whether growth is software-like or infra-pass-through heavy
    - FP&A plus infrastructure operations
  - - IPO readiness package
    - Structure-cleanup status, listing timetable, underwriter status, and regulator feedback
    - Current valuation partly assumes public-market optionality
    - GC, external counsel, and bankers
  - - Customer concentration / retention
    - Top-customer share, prepaid dependency, and retention cohorts
    - Tests whether the monetization story is diversified and durable
    - Revenue operations and sales leadership
  - - Competitive switching risk
    - Win/loss analysis versus DeepSeek, Zhipu, MiniMax, and third-party K2.6 hosts
    - Shows whether current demand belongs to Moonshot or to a temporary performance window
    - Product, GTM, and major-account teams
  notes: These asks are ordered by how quickly they would change the pricing view, not by how easy they are to obtain.
