- id: thesis-vs-anti-thesis
  title: Investment thesis versus anti-thesis
  body: |-
    The positive case is straightforward. Moonshot now has official pricing, reported subscription and API monetization, enterprise customers willing to prepay for compute, and enough cash to keep training and commercializing without an immediate emergency raise. That combination is rare in China's frontier-model cohort. It is also happening while the company is still early enough in the revenue curve that another year of similar execution could materially change the scale picture. Compared with many foundation-model labs that still hide behind product demos, Moonshot has at least started to publish the commercial surfaces an investor wants to see.

    The anti-thesis is just as forceful. Even if the April ARR figure is accepted, a $20 billion price tag implies a multiple that already discounts years of hypergrowth and assumes listing execution, margin discipline, and customer retention that are not yet public. The regulatory restructuring story is adverse, not cosmetic. The cap table and preference stack are missing. Public valuation support still relies partly on a scarcity premium visible in China AI IPOs rather than on a fully disclosed fundamental ledger. That is why the right call is not 'avoid' — the business appears too real for that — but 'research-more' with a stretched valuation stance.
  claimRefs:
  - CV025
  - CV026
  - CV029
  - CV030
  - CV031
  - CV032
