- id: comparable-valuation-framework
  title: Comparable valuation framework
  body: |-
    Moonshot sits in an awkward comparable set, which is exactly why the current price is hard to underwrite. OpenAI and Anthropic show how private frontier-model leaders can still command exceptional funding multiples when compute, developer demand, and distribution all compound at once. But those companies also disclose far more about run-rate revenue, product breadth, and infrastructure strategy than Moonshot does today. On the public side, C3.ai shows a harsh lower bound for subscale AI software with weak margins, while Palantir shows how the market can still pay extreme premiums for AI-driven growth and cash generation once execution is already proven.

    China AI IPOs complicate the picture further. Yicai and TechNode show that Zhipu and MiniMax came public into a market willing to capitalize frontier-model scarcity at levels far above what U.S. mid-cap software comps would justify. That helps explain why Moonshot's current mark is not obviously absurd. It does not, however, make the mark intrinsically attractive. The most defensible interpretation is that Moonshot is currently priced closer to a public-scarcity option than to a private-round discount. That makes upside possible, but only if commercialization and listing readiness keep converging faster than skepticism does.
