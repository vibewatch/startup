    - Requires sustained post-April monetization and cleaner disclosure
    - Regulatory or margin slippage would quickly compress this case
  - - Base
    - ARR reaches ~$350M and premium settles at 50-60x
    - $17.5B-$21.0B implied value; current mark looks roughly fair
    - Most plausible if Moonshot remains category leader but not a breakout global outlier
