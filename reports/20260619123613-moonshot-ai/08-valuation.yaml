  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-preferences
    missingEvidence: Full cap table, liquidation preferences, anti-dilution terms, and any strategic-investor rights from the 2025-2026 financings.
    whyItMatters: A $20B entry price cannot be judged properly without knowing how much downside protection, control, or dilution sits above a new investor.
    diligencePath: Request latest cap table, round docs, investor-rights agreements, and waterfall model.
    relatedQuestionRefs:
    - QV021
    - QV022
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: audited-arr-and-revenue
    missingEvidence: Audited monthly revenue and ARR split across API, subscriptions, prepaids, and any service revenue.
    whyItMatters: The present valuation debate hinges on whether April 2026 ARR is a transient burst or the base of a durable growth curve.
    diligencePath: Request audited monthly KPI pack, deferred-revenue roll-forward, and cohort retention tables.
    relatedQuestionRefs:
    - QV003
    - QV014
    - QV015
    - QV016
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-compute-commitments
    missingEvidence: Gross margin by product family plus committed cloud or chip-purchase obligations.
    whyItMatters: A scarce AI asset can still be overvalued if growth is bought with structurally poor unit economics or inflexible compute prebuys.
    diligencePath: Request hosted-vs-partner margin bridge and signed compute procurement summary.
    relatedQuestionRefs:
    - QV024
    - QV022
    relatedTableRefs:
    - TV006
  - type: access-blocked
    severity: material
    topic: full-paywalled-round-reporting
    missingEvidence: Full-text access to Caixin, WSJ, and Bloomberg reporting on private-round structure and IPO preparation.
    whyItMatters: Summaries are enough to establish direction but not enough to reconstruct exact terms, investor mix, or regulatory dependencies.
    diligencePath: Obtain subscriber access or management-provided copies of the referenced shareholder communications.
    relatedQuestionRefs:
    - QV001
    - QV018
    - QV020
    relatedTableRefs:
    - TV005
    - TV006
  - type: enumeration-incomplete
    severity: material
    topic: tv004-sample-comparable-set
    missingEvidence: Company-verified IPO timetable, draft filing status, and exchange or regulator feedback.
    whyItMatters: Exit timing is core to the valuation case because public-market scarcity premium is part of what makes the current mark plausible.
    diligencePath: Ask management for the listing workplan, counsel memos, and contingency financing plan.
    relatedQuestionRefs:
    - QV018
    - QV020
    - QV030
    relatedTableRefs:
    - TV004
