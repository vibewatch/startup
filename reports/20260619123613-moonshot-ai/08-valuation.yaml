- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - IPO execution failure
    - Listing materially delayed or abandoned after structure cleanup
    - Scarcity premium and exit optionality collapse
    - Move from research-more to avoid until financing terms reset
  - - Down-round or flat-round financing
    - Next primary round below or not meaningfully above the current private mark
    - Confirms valuation outran fundamentals
    - Re-cut scenario table and assume dilution-heavy downside
  - - Growth stall
    - Evidence remains near the April 2026 ARR floor rather than compounding above it
    - Bull and base cases lose support
    - Require lower entry price or drop the opportunity
  - - Weak margin disclosure
    - Data room shows poor gross margins or large compute prebuys
    - Converts a growth story into a low-quality security
    - Treat as avoid unless price resets materially
  - - Preference overhang
    - Senior investor rights or anti-dilution stack heavily burdens new entrants
    - Upside may belong to earlier rounds rather than new capital
    - Demand stronger governance or pass
  - - Regulatory tightening
    - Hong Kong or mainland policy shift constrains listing or foreign-holder structure
    - Exit timing and investor pool both shrink
    - Re-rate to a longer-hold private asset with lower multiple
  notes: Triggers are designed for monitoring. They are not predictions; they are the specific events most likely to break the valuation case.
