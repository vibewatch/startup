  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-revenue
    missingEvidence: Audited quarterly revenue with split between API, subscription, enterprise prepaids, and any services revenue.
    whyItMatters: Without audited revenue and mix, investors cannot map rapid ARR claims into durable recognized revenue or assign a defendable multiple.
    diligencePath: Request audited 2025 and year-to-date 2026 P&L with monthly revenue bridge and contract waterfall.
    relatedQuestionRefs:
    - QI006
    - QI015
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-bridge
    missingEvidence: Gross margin by product stream plus inference, cloud, and support-cost bridge.
    whyItMatters: Official list pricing alone does not show whether API growth creates software-like contribution margins or just funds compute pass-through.
    diligencePath: Request cohort margin analysis by model tier and by hosted versus reseller/partner delivery.
    relatedQuestionRefs:
    - QI008
    - QI010
    - QI014
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: burn-runway
    missingEvidence: Monthly burn, cash runway, debt facilities, and committed chip or cloud prepayments.
    whyItMatters: Reported cash and fresh funding do not translate into runway without the monthly cash-consumption base and off-balance-sheet commitments.
    diligencePath: Request treasury schedule, forecast burn, vendor commitments, and covenant summary.
    relatedQuestionRefs:
    - QI016
    - QI017
    - QI018
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer mix, prepaid contract terms, renewal data, and usage concentration by customer cohort.
    whyItMatters: Tens-of-millions prepayments may reflect healthy enterprise demand or a small number of compute-hungry accounts.
    diligencePath: Request top-10 customer concentration, prepaid balance roll-forward, and renewal/expansion schedule.
    relatedQuestionRefs:
    - QI002
    - QI011
    - QI015
    relatedTableRefs:
    - TI001
    - TI003
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Average realized selling price by model family, discounting policy, and hosted-versus-direct mix.
    whyItMatters: List prices are not the same as realized revenue or margin, especially when priority access and partner routing are involved.
    diligencePath: Request invoice samples, price-book policy, and discount waterfall for enterprise contracts.
    relatedQuestionRefs:
    - QI003
    - QI007
    - QI014
    relatedTableRefs:
    - TI002
  - type: access-blocked
    severity: minor
    topic: paywalled-ipo-coverage
    missingEvidence: Full-text access to WSJ/Caixin/Bloomberg reporting on private-round structure and listing preparation.
    whyItMatters: Open summaries establish direction, but the unpaywalled record is too thin to reconstruct precise terms or investor rights.
    diligencePath: Obtain subscriber access or ask management for the shareholder letter and round documents those articles reference.
    relatedQuestionRefs:
    - QI016
    - QI021
    relatedTableRefs:
    - TI004
