callouts:
- calloutType: risk
  title: Public pricing is not public margin
  body: Moonshot discloses list pricing and recent ARR headlines, but it still does not disclose the infrastructure cost basis behind those prices. Treat every margin conclusion here as directional until hosted-versus-partner compute economics are shown.
  claimRefs:
  - CI019
  - CI022
  - CI036
  - CI039
- calloutType: insight
  title: Prepaid demand matters more than MAU headlines
  body: The most useful 2026 signal is not broad consumer popularity; it is that some enterprise customers reportedly prepaid tens of millions of dollars to secure compute priority. That is a monetization-quality clue, even though the concentration and accounting treatment remain opaque.
  claimRefs:
  - CI010
  - CI014
