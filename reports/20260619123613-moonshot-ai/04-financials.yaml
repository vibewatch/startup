- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited recognized revenue by month and stream
    - Cannot reconcile ARR headlines to GAAP or IFRS revenue
    - Request audited monthly revenue bridge with API/subscription/services split
  - - Gross margin by model and delivery mode
    - Cannot determine whether token pricing translates into software-like economics
    - Request margin bridge for hosted, partner-hosted, and batch usage
  - - Customer concentration and renewal data
    - Prepayment headlines may hide single-account dependence
    - Request top-customer concentration, renewal cohorts, and usage expansion curves
  - - CAC, payback, and sales-efficiency metrics
    - Cannot judge whether growth is bought or durable
    - Request funnel conversion, sales headcount productivity, and payback
  - - Monthly burn, runway, and debt schedule
    - Cannot convert cash and fresh funding into solvency view
    - Request treasury schedule, vendor prebuys, and debt covenants
  - - Revenue-recognition policy for enterprise prepayments
    - Advance commitments may not equal recurring revenue quality
    - Request contract templates and deferred-revenue accounting treatment
  notes: Every row is a genuine open-source gap; unsupported values are intentionally left as diligence asks rather than backfilled with guesses.
