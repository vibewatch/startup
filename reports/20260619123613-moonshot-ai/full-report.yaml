  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and privacy exposure is the highest-severity risk stack
        blocks:
          - type: paragraph
            body: >-
              Moonshot operates inside a regulatory environment that is already specific to generative AI rather than
              merely adjacent to it. China’s Interim Measures apply directly to public generative-AI services, tie
              compliance back to cybersecurity, data-security, and personal-information laws, and require lawful
              training data, necessary data collection, service stability, and filing obligations for qualifying
              systems. Since 2025 the compliance bar has not loosened: White & Case notes mandatory labeling rules and
              new security-oriented national standards, while China’s own policy pages point to an expanding body of AI
              standards and judicial guidance. Against that backdrop, Moonshot’s public trust record matters more than
              it would for a casual consumer app. SCMP reported an excessive-data-collection finding against Kimi, and
              OECD’s incident tracker recorded a resume leak that reportedly triggered legal action. Moonshot’s own
              terms and privacy materials also create real diligence work: users contract with a Singapore entity under
              Singapore law, while the privacy policy still allows broad content processing, affiliate sharing, and
              retention tied to legal or operational needs. The result is a legal stack where compliance, data handling,
              and trust cannot be cleanly separated.
