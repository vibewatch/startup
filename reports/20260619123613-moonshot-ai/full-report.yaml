      - number: '8.5'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The missing evidence is unusually concentrated in valuation-critical areas. Investors need an audited
              monthly revenue bridge, cap table and preference stack, compute-procurement commitments, and the actual
              timetable for Hong Kong listing readiness. Without those, the company may still be a high-quality asset,
              but it is impossible to know how much downside protection, dilution, or cash-intensity risk sits between a
              new investor and the underlying business. The diligence burden is therefore not about discovering whether
              Moonshot has demand — public evidence already suggests it does — but about discovering whether the demand
              converts into a durable, investable security at the current price.


              The thesis-break triggers are correspondingly concrete. A failed or materially delayed listing process
              would puncture scarcity premium. A financing below the current mark would confirm valuation overreach. ARR
              stalling below the level required to sustain 2026 enthusiasm would invalidate the 'fastest monetizing lab'
              story. And a disclosure package showing weak gross margins or aggressive preference overhang would turn a
              promising company into a poor security. Those are not remote edge cases; they are the four issues that
              should determine whether Moonshot moves from watchlist to portfolio or from watchlist to pass.
            claimRefs:
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
              - CV045
          - type: table
            tableRef: TV005
            claimRefs:
