      - number: '7.4'
        title: Execution breadth is now a risk in itself, so the thesis needs measurable kill criteria
        blocks:
          - type: paragraph
            body: >-
              Moonshot’s opportunity set is large enough that execution sprawl is now a core underwriting question. The
              company is not shipping one narrow answer engine; it is simultaneously operating consumer memberships,
              app-store billing, an API platform, open-source model releases, Kimi Code, Kimi Claw, agent swarms, and
              increasingly high-stakes workflows such as legal or financial document processing. The documentation and
              repository surface is active, which is encouraging, but it also signals how many control planes management
              must keep aligned. Public evidence does not yet close several important diligence loops: there is no
              public SLA or certification packet in the retained set, no visible filing number on the fetched product
              surfaces, no detailed incident postmortem, and no public map of infrastructure counterparties. Those
              omissions do not prove weakness, but they materially raise residual execution risk. The right investor
              posture is therefore explicit, not impressionistic: insist on control artifacts, incident discipline, and
              dependency mapping now, and treat a failure to produce them as a thesis-break signal rather than a routine
