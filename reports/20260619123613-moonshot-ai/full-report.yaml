  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Moonshot should be analyzed inside the China-facing AI assistant and foundation-model application layer,
              not as a proxy for all AI spend in China. The evidence set shows Kimi operating where public users or
              enterprise teams buy model-backed knowledge work: chat, research, document workflows, spreadsheet help,
              coding, and agent tasks. Kimi’s API documentation extends that surface into developer workflows through
              files, batch processing, tool calls, JSON mode, and web search. IDC’s China market-glance supports the
              same boundary by separating model and agent platforms from the underlying chip, compute, storage, and
              network stack. That means the included spend is application and platform spend attached to model use,
              while excluded spend includes raw semiconductors, undifferentiated cloud IaaS, and the entire China
              software market.


              This boundary matters because the real substitutes are not only named chatbot rivals. For a Chinese
              knowledge worker, the status quo can still be search, documents, spreadsheets, office software, or manual
              analysis. For a developer, the substitute can be OpenAI-compatible local peers such as DeepSeek or Qwen,
              or an internal stack built on a migration-friendly API. For an enterprise buyer, the substitute can be a
              localized platform with stronger governance or parent-company distribution. Treating Moonshot as if it
              addresses all AI budgets would hide both the narrowness of what Kimi demonstrably sells today and the
              intensity of substitution at the workflow level.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
