      - number: '3.5'
        title: Competitive risks, displacement pressure, and likely entrants
        blocks:
          - type: paragraph
            body: >-
              The adverse case for Kimi is straightforward. DeepSeek’s official price floor pressures local
              monetization. Doubao and Qwen benefit from much stronger parent-company distribution. Baidu surfaces
              enterprise controls and a richer search-linked platform. Z.ai keeps releasing long-horizon and
              coding-centric products that target the same developer mindshare Kimi needs. MiniMax broadens the domestic
              field further by pairing multimodal creation with coding and consumer products. Outside China, OpenAI,
              Anthropic, and Google still set premium expectations around quality, enterprise packaging, and scale. In
              other words, Kimi is squeezed from below on price, from beside on ecosystem reach, and from above on
              global benchmark reputation.


              That does not mean Kimi is weak. Public traffic rankings still show it as a meaningful challenger, not an
              afterthought, and Moonshot’s funding history means it is not undercapitalized by startup standards. But
              the public evidence does suggest that Kimi’s moat remains conditional rather than settled. Without
              disclosed win-rate, churn, or contract-depth data, the safer judgment is that Kimi is a credible,
              high-velocity challenger operating inside one of the most aggressively competitive AI markets in the
              world.
