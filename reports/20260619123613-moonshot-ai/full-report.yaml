      - number: '1.2'
        title: Leadership visibility, governance, and stage
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is heavily concentrated around founder Yang Zhilin. Third-party coverage
              repeatedly centers him as founder and public face, and the most substantive profile material focuses on
              his academic and research pedigree, including prior work at Meta AI and Google Brain. SCMP adds a useful
              strategic frame by quoting Yang's aspiration to combine OpenAI-like technical idealism with ByteDance-like
              business discipline. What the public record does not provide is almost as important as what it does: there
              is no reviewed board roster, no investor-relations page, and no clearly disclosed finance leader or
              broader executive bench on the primary company surfaces. That absence makes governance diligence difficult
              for anyone trying to assess succession depth, committee structure, or financial controls from public
              materials alone.


              Stage assessment is easier than governance assessment. By 2026, Moonshot AI is clearly not a seed-stage
              experiment or a pre-product lab. The company has raised multiple late-stage rounds, advertises recurring
              product surfaces, and is already being written about in terms of valuation, ARR, and IPO timing. The
              safest label is a late-stage private foundation-model company in commercialization mode. That is strong
              enough for downstream analysis, but not strong enough to standardize the exact round taxonomy without
              caveat because Series B, follow-on raises, and Series C language appear across different points in the
              public record.
