      - number: '3.4'
        title: Switching costs, lock-in, and moat durability
        blocks:
          - type: paragraph
            body: >-
              At the model layer, switching costs remain lower than in many historical software categories. Kimi
              publishes an OpenAI migration guide; DeepSeek supports OpenAI and Anthropic formats; Alibaba explicitly
              offers OpenAI-compatible APIs; Zhipu documents OpenAI-SDK compatibility; and MiniMax token-plan docs
              expose Anthropic-style integration. That combination makes price and benchmark comparison structurally
              easier for buyers. A vendor that only wins on model quality alone can therefore be displaced quickly.


              Durable moats sit one layer higher. Distribution through consumer or commerce ecosystems, explicit
              governance tooling, search and knowledge assets, and deeper workflow embedding all raise the real cost of
              switching. Baidu’s enterprise controls and search assets, Alibaba’s commerce graph, ByteDance’s app reach,
