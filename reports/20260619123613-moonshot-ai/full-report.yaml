      - number: '1.4'
        title: Milestones, adverse events, and what later chapters should inherit
        blocks:
          - type: paragraph
            body: >-
              Moonshot AI's public milestone arc is unusually visible for a private AI company. TechCrunch places the
              founding-model launch in March 2023 and the first Kimi chatbot launch in October 2023. CNBC then documents
              the later cadence: Kimi K2 in July 2025, K2 Thinking in November 2025, and K2.5 in January 2026.
              Moonshot's own homepage adds WorldVQA, Agent Swarm, and K2.6 to the 2026 research timeline, while the
              platform blog shows that the commercialization stack had already been broadening since 2024 through
              context caching and enterprise API work. Together these milestones support an important analytical point
              for later chapters: Moonshot is not only releasing models, it is packaging those models into a fuller
              product and developer ecosystem.


              The adverse side of the record is real enough that it should travel with the chapter. CNBC reported
              Anthropic's claim that Moonshot participated in a large-scale distillation campaign against Claude, and
              Anthropic's own statement gave detailed allegations about millions of exchanges and targeted capability
              extraction. Separately, the OECD AI Incidents Monitor recorded a 2026 privacy incident involving a Kimi
              resume leak. Neither episode alone settles the legal or technical facts of Moonshot's internal controls,
              but together they establish non-trivial risk around provenance, privacy, and governance. Later chapters
              should therefore reuse this overview as ground truth for identity, scale direction, and milestone cadence
              while continuing to treat governance depth, customer breadth, headcount, and exact capital history as
              unresolved diligence items.
