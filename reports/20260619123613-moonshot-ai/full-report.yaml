companyProfile:
  summary: >-
    Moonshot AI is a Beijing-centered Chinese AI company founded in 2023 by Yang Zhilin, Zhou Xinyu, and Wu Yuxin. Its
    public product stack now spans the Kimi consumer assistant, Kimi Code, a developer API platform, and a fast-moving
    open-weight / open-source model roadmap including K1.5, K2, K2.5, K2.6, and K2.7 Code. The business model combines
    memberships and other paid Kimi access with usage-based API billing, while 2026 reporting indicates ARR moved above
    $200 million alongside a reported $20 billion financing mark. The investment case is supported by real product
    velocity and commercialization, but still constrained by limited public disclosure on governance, unit economics,
    customer concentration, and listing-readiness details.
