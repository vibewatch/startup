  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and the current private mark
        blocks:
          - type: paragraph
            body: >-
              The best-supported current valuation anchor is TechCrunch's May 2026 report that Moonshot raised about $2
              billion at a $20 billion valuation. That article also says the company raised $3.9 billion over the prior
              six months and pushed ARR above $200 million in April, which is enough to explain why investors are
              treating Moonshot as the most monetized Chinese open-weight frontier lab. CnTechPost adds the earlier
              March datapoint that ARR had already surpassed $100 million one month after K2.5 launched, while Caixin
              says Moonshot ended 2025 with more than 10 billion yuan of cash after a $500 million Series C. Taken
              together, the funding history does not read like a rescue round sequence; it reads like a company
              repeatedly able to convert technical momentum into primary capital.


              That said, the mark is still structurally fragile. The Wall Street Journal reported a roughly $18 billion
              funding discussion while Moonshot was pursuing Hong Kong-listing preparation under heightened scrutiny,
              and CnTechPost says the company is dismantling its red-chip structure because the odds of preserving a VIE
              waiver look slim. Those reports matter because at $20 billion, Moonshot is no longer being valued like a
              fast-growing private SaaS business with disclosure gaps; it is being valued like a strategic
              capital-markets asset. The result is a valuation that may be plausible, but only if the next chapter of
              commercialization and IPO execution arrives on schedule.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
