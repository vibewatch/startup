      - number: '7.3'
        title: Competition, pricing pressure, and ecosystem dependencies can transmit quickly into margin and customer risk
        blocks:
          - type: paragraph
            body: >-
              Moonshot is competing in a market that currently rewards rapid rollout, low pricing, and ecosystem
              integration, which is a risky operating stance even when adoption is strong. CNBC reported that Chinese
              firms are prioritizing user growth over benchmark headlines and that Moonshot kept iterating from K2 to
              K2.5 at high speed, while also underpricing major U.S. rivals. Kimi’s own API model compounds that by
              tying cost to input, output, and tool usage, which makes agent-heavy workflows potentially expensive to
              serve even when customer pricing looks attractive. Developer distribution is a strength, but it is also a
              dependency layer: the GitHub and Hugging Face surfaces show fast-moving open-source releases, public
              tooling, and broad external builder pull, which increases maintenance burden and the risk that abuse,
              breakage, or incompatible integrations propagate outside Moonshot’s direct support boundary. The public
              record also does not disclose a cloud-provider or infrastructure concentration schedule, so investors can
              see evidence of scale without yet seeing the resilience of the underlying cost base or the concentration
              of critical counterparties.
