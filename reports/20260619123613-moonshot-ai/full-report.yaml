      - number: '8.4'
        title: Bull / base / bear scenarios and recommendation
        blocks:
          - type: paragraph
            body: >-
              At the current evidence level, the recommendation is research-more and the valuation stance is stretched.
              The central reason is that the $20 billion mark can be defended only if Moonshot keeps compounding revenue
              extremely fast while successfully converting regulatory cleanup into a credible Hong Kong listing option.
              In the bull case, ARR scales toward roughly $500 million and investors continue to award a 55-70x scarcity
              premium, producing a $27.5-$35 billion outcome. In the base case, ARR reaches roughly $350 million and the
              premium settles to 50-60x, leaving a $17.5-$21 billion range that makes today's price closer to fair than
              cheap. In the bear case, ARR stalls near $250 million and the multiple compresses toward 30-40x as
              scrutiny, dilution, or weaker demand erode enthusiasm, implying $7.5-$10 billion and material downside.


              These scenarios deliberately avoid false precision on IRR because the cap table and liquidation stack are
              unknown. They are meant to answer one narrower question: is the present mark already pricing in much of
              the good news? The answer is yes. There is enough evidence to keep Moonshot on the investable list, but
              not enough to recommend paying through the current price without additional diligence. A more constructive
              stance would require one of two things: materially stronger audited monetization than the April ARR figure
              suggests, or a materially better entry price.
            claimRefs:
              - CV005
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV044
          - type: table
            tableRef: TV003
