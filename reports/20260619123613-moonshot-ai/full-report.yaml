  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing surfaces
        blocks:
          - type: paragraph
            body: >-
              Moonshot now has a visible monetization stack rather than a single opaque chatbot surface. Official Kimi
              pricing documents show that the company bills both input and output tokens across real-time chat, charges
              separate list prices by model family, discounts batch jobs, and layers an explicit per-call fee on top of
              web-search tool usage. That means Moonshot is monetizing usage, model tier, and workflow type at the same
              time. The public docs do not prove realized prices or margin capture, but they do establish a concrete
              path from model usage to billable revenue. K2.6 and K2.7 Code are both priced for long-context, agentic
              workloads; Moonshot V1 remains the cheaper legacy family; and batch plus tool pricing extend monetization
              into lower-latency-tolerant or retrieval-heavy workflows.


              The clearest commercial proof that these list surfaces matter is the combination of ARR acceleration and
              prepaid enterprise demand. CnTechPost says ARR crossed $100 million in early March 2026 one month after
              K2.5 launched, and TechCrunch says ARR topped $200 million in April, driven by subscriptions and API
              usage. The same CnTechPost report says some enterprise clients offered tens of millions of dollars in
              prepaid commitments to secure priority compute. That does not reveal recurring share, discounts, or
              contract duration, but it does show Moonshot is not only collecting consumer attention — it is monetizing
              scarce inference capacity. The chapter therefore treats API tokens, paid Kimi access, enterprise priority
              capacity, batch processing, and tool calls as the five most supportable public revenue surfaces, with
              realized ASPs and renewal quality left as diligence items rather than invented facts.
