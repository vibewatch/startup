      - number: '4.2'
        title: Unit economics proxies and inference-cost intensity
        blocks:
          - type: paragraph
            body: >-
              Moonshot still does not publish gross margin, CAC, payback, or contribution margin, so the only defensible
              approach is to work from public proxies. The official price sheets show that K2.6 output tokens are more
              than four times as expensive as uncached input tokens, that K2.7 Code keeps similar economics, and that
              batch processing trades latency for a 40% lower output rate. Those ratios suggest Moonshot is explicitly
              trying to steer customers toward lower-cost operating modes where it can control infrastructure
              utilization. At the same time, the pricing hub confirms the model is billed on pure token throughput,
              which means gross profit is highly sensitive to the spread between Moonshot's own compute cost and the
              public rate card.


              Public demand and benchmark evidence reinforce that inference capacity is the critical bottleneck.
              CnTechPost says token-per-minute quotas tightened quickly after K2.5 launched, while CoreWeave and
              VentureBeat show how far infrastructure performance and unit-cost dispersion can move once third parties
              optimize K2.6 differently from the official endpoint. VentureBeat further describes K2.6 as a
              trillion-parameter MoE model with 32 billion activated parameters per token, which helps explain why
              capacity management matters so much. The takeaway is not that Moonshot has bad economics; it is that the
              economics are visibly infrastructure-heavy. Without a hosted-versus-reseller cost bridge, the public
              record supports only a directional conclusion: Moonshot has real monetization momentum, but its
              contribution margin is likely much more sensitive to inference mix, supplier terms, and capacity planning
              than a classic 80%-plus gross-margin SaaS company.
