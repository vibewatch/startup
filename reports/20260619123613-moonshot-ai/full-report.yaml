            body: >-
              Moonshot has enough evidence to support a real financial narrative: there is now visible usage-based
              pricing, clear ARR acceleration, enterprise willingness to prepay for compute, and a balance sheet that —
              at least on reported cash and fundraising alone — looks stronger than most private AI labs. It also has
              the same capital-intensity signature visible in global frontier-model peers. OpenAI and Anthropic are both
              raising at a scale that explicitly ties valuation to compute expansion and infrastructure control, and
              Moonshot's own chip-buying plan fits that pattern. In other words, Moonshot looks less like a speculative
              chatbot with no business model and more like a scarce infrastructure-plus-model asset whose commercial
              trajectory is starting to surface publicly.


              The blockers are just as clear. Public sources still do not disclose recognized revenue policy, gross
              margin, customer concentration, CAC, payback, debt, or runway; the IPO-prep reporting is partly paywalled;
              and even the best external benchmarks only show what a public AI software company like C3.ai must
              disclose, not what Moonshot itself earns on each token. That leaves the right verdict cautious rather than
              bullish: Moonshot appears commercially real and well financed, but the public record is still too thin to
              underwrite revenue quality, contribution margin, or capital sufficiency with filing-grade confidence.
