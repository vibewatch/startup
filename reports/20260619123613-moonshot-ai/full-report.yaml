      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: research-more'
            body: >-
              Moonshot should stay on the front end of the funnel because commercial proof and strategic scarcity are
              real. The current price, however, already assumes that monetization compounds and that IPO execution
              works. That is too much to underwrite without the data room.
            calloutType: recommendation
