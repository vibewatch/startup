    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, headquarters, and business model
        blocks:
          - type: paragraph
            body: >-
              Moonshot AI's official web presence shows a company trying to look like a research lab and a product
              company at the same time. The Moonshot homepage leads with AGI-oriented language about converting energy
              into intelligence, while the linked Kimi surfaces emphasize practical user workflows such as code, deep
              research, websites, slides, and spreadsheets. That combination matters because it is the cleanest one-line
              description of the business model available from primary sources: Moonshot is commercializing
              foundation-model capabilities through both a consumer assistant layer and a developer platform rather than
              through a single-purpose application. The platform-pricing materials further support this interpretation
              by documenting token-based API billing, while Kimi Code explicitly describes itself as a membership-linked
              coding surface.


              The founding and location record is directionally clear but not perfectly standardized. TechCrunch
              reported that Yang Zhilin founded Moonshot AI with Zhou Xinyu and Wu Yuxin in 2023, and multiple 2026 news
              outlets describe the company as Beijing-based. At the same time, Kimi's current Terms of Service identify
              Moonshot AI PTE. LTD. in Singapore as the service provider. The best supported conclusion is therefore a
              Beijing-centered operating company with at least one Singapore legal entity on the service side, not a
              single clean headquarters disclosure. Later chapters should preserve that nuance rather than flatten it
              into a one-jurisdiction simplification.
