      - number: '2.2'
        title: Evidence-constrained sizing lenses and Kimi’s current position
        blocks:
          - type: paragraph
            body: >-
              Open public sources do not provide a clean, non-paywalled RMB market size for the exact China
              assistant-plus-foundation-model category that Moonshot serves, so the more defensible approach is to
              preserve multiple sizing lenses. The first is monitored demand. AICPB’s April 2026 China AI rankings show
              a very large public attention pool among leading products, and they place Kimi fifth on China AI websites
              at 43.69 million visits and eighth on China AI apps at 25.33 million MAU. Those numbers are meaningful,
              but they also show Kimi is not the current consumer leader: DeepSeek and Doubao are much larger on
              monitored public demand proxies. The second lens is enterprise adoption. IDC says that by 2027, 80% of
              China C1000 enterprises will prioritize AI sovereignty, which enlarges the addressable pool for domestic
              model vendors even if exact category revenue remains undisclosed. The third lens is monetization rails.
              Public pricing pages from Kimi, DeepSeek, Qwen, ERNIE, OpenAI, Anthropic, and Google show a wide
              list-price ladder from sub-RMB local price floors to premium U.S. API pricing.


              Taken together, these lenses support a large and growing market, but one where monetization depth is still
              uncertain. IDC’s China AI coding outlook explicitly notes very fast growth and low monthly pricing with
              top-vendor revenue still below RMB 100 million in 2025. That is the central analytical tension for
              Moonshot: Kimi has enough distribution to matter, but public evidence suggests the category is expanding
              faster in usage than in normalized profit pools. Kimi’s current position therefore looks more like a
              credible challenger with real scale than a category owner with proven market capture.
