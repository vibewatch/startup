      - number: '1.3'
        title: Funding history, valuation path, and cover metrics
        blocks:
          - type: paragraph
            body: >-
              The financing story is one of rapid escalation. TechCrunch reported a $2.5 billion valuation and more than
              $1 billion Series B financing in early 2024. By early 2026, public coverage had moved to a much larger
              scale: Caixin reported a $500 million Series C and more than RMB 10 billion in cash, while TechCrunch and
              Forbes both reported a roughly $2 billion round at a $20 billion valuation. TechCrunch also said Moonshot
              had raised $3.9 billion over the previous six months, with Long-Z Investments, Tsinghua Capital, China
              Mobile, and CPE Yuanfeng in the latest financing and Alibaba, Tencent, HongShan, ZhenFund, IDG, and 5Y
              appearing in the broader backer set. That is enough to conclude that Moonshot sits near the top tier of
              Chinese private AI financings.


              The metric picture is still incomplete. A reported ARR above $200 million in April 2026 is meaningful, and
              the company's cash balance and OpenRouter usage ranking suggest real commercial traction. But the reviewed
              corpus does not provide audited revenue, customer count, headcount, or a reconciled lifetime
              capital-raised figure. Those omissions matter because they limit any clean interpretation of operating
              efficiency, dilution, or durability. For this chapter, the right move is to state the supported numbers,
              preserve the unsupported ones as explicit gaps, and avoid converting investor enthusiasm into false
              precision.
