            body: >-
              Kimi's public product map is now broad enough that it should be read as a suite rather than a single
              assistant. The corporate and product homepages emphasize code, deep research, websites, sheets, and
              slides, while the platform homepage adds a developer layer with official tools such as web search, memory,
              Excel analysis, code execution, and content fetching. Kimi Code sits inside that map as the explicitly
              coding-focused surface, marketed as a terminal-and-IDE workflow connected to Kimi membership. The
              developer platform does not hide behind a proprietary SDK either: the quickstart materials say the API is
              OpenAI-compatible, which reduces adoption friction for teams already built around Chat Completions-style
              clients.


              This matters for how the product should be analyzed. Moonshot is not just selling better raw model
              weights. It is packaging those weights into a set of workflow products that map to different buyer jobs:
              deep research for knowledge work, code for developer productivity, websites or slides for creative output,
              and an API plus tools layer for application builders. The presence of batch APIs, official tool
              documentation, and migration guides reinforces that the company expects users to build multi-step, agentic
              workflows on top of Kimi rather than only single-turn text prompts.
