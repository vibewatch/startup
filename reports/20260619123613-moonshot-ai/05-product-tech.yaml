- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Moonshot solution
  - Measurable or claimed benefit
  - Limitation
  rows:
  - - Ship coding tasks in terminal or IDE
    - Use generic chat model or editor plugin with manual context management
    - Kimi Code on K2.7 Code
    - Faster coding-specific model and native terminal surface
    - Plan detail, seats, and enterprise controls are underdisclosed
  - - Build OpenAI-style app with new model backend
    - Refactor existing SDKs to proprietary interfaces
    - OpenAI-compatible Kimi API quickstart
    - Lower migration friction for existing app stacks
    - Compatibility still has model-specific caveats such as reasoning_content handling
  - - Run multimodal reasoning on images or video
    - Stitch together OCR, file storage, and separate VLM calls
    - Vision-capable K2.6 / K2.7 Code and Kimi-VL plus file upload flow
    - Single workflow for text, image, and video understanding
    - No direct remote image URL support and body-size limits remain
  - - Orchestrate long research or content-generation jobs
    - Manually chain many prompts or custom scripts
    - Agent Swarm, official tools, and batch-friendly docs
    - Parallelized task decomposition and richer workflow primitives
    - Many capabilities are still framed as previews or research surfaces
  - - Serve long-context requests efficiently
    - Keep prefill and decode on one tightly coupled cluster
    - Mooncake disaggregated prefill/decode serving
    - Higher throughput and better KV-cache reuse under long-context loads
    - Backend complexity and ecosystem dependencies increase operational burden
  - - Evaluate multimodal factuality
    - Use generic VLM benchmarks with weak long-tail coverage
    - WorldVQA benchmark
    - Higher visibility into hallucination-prone visual world knowledge
    - It is still a company-created benchmark rather than an external audit
  notes: Benefit cells summarize documented claims and benchmark framing; they should not be read as customer-verified ROI
    figures.
