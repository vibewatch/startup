- id: platform-architecture-and-serving-stack
  title: Developer platform, architecture, and serving stack
  body: 'The most important technical point in Moonshot''s public architecture is that the product stack is not just a model
    wrapper; it is a workflow and systems stack. At the API layer, Moonshot exposes OpenAI-compatible endpoints, tool use,
    vision ingestion, batch processing, and model-selection guidance. At the application layer, the company pushes Kimi Code,
    research, websites, and other higher-level surfaces. Underneath, the public technical materials show a serious serving
    and infrastructure posture. Mooncake is described in both paper and repository form as a KVCache-centric disaggregated
    serving architecture that separates prefill from decode, pools cache across CPU, DRAM, and SSD resources, and improves
    request throughput under long-context workloads.


    That serving layer matters because Kimi''s product claims lean heavily on long context, multi-step agents, and multimodal
    workflows, all of which are infrastructure-hungry. The Mooncake paper and USENIX presentation report very large throughput
    gains and production scale, while the open-source checkpoint-engine repository claims that Kimi-K2 weights can be updated
    across thousands of GPUs in about twenty seconds. The architecture therefore appears technically credible, but it is also
    dependency-heavy: Moonshot is building on and contributing to a broader ecosystem involving GitHub-hosted repos, vLLM-style
    deployment paths, Hugging Face model cards, and third-party hardware or serving integrations. That creates both leverage
    and vendor-compatibility risk.'
