- id: model-family-and-capabilities
  title: Model family, long-context history, and capability packaging
  body: 'Moonshot''s model family now has enough internal history to show an architectural through-line. The early public
    differentiator was long context, with Kimi already claiming very large conversation windows in 2023. Kimi k1.5 then marked
    a reasoning-heavy reinforcement-learning milestone, while K2 scaled the family into a 1T-parameter MoE release with 32B
    activated parameters, 128K context, and strong agentic benchmarks. By the current documentation set, K2.5 and K2.6 push
    the active product line to 256K context and stronger agentic coding, multimodal, and long-horizon behavior, and K2.7 Code
    specializes that line further for coding with an always-thinking interaction model and a much faster HighSpeed variant.


    Kimi-VL widens the portfolio again rather than merely extending text models. Its public materials describe a 16B-class
    MoE VLM with a MoonViT encoder, 128K context, and competitive performance on OCR, long-video, long-document, and OS-agent
    tasks. WorldVQA adds an internal benchmark asset aimed at hallucination-resistant visual world knowledge, which is relevant
    because it shows Moonshot building evaluation infrastructure alongside models. Put together, the portfolio looks less
    like a single frontier-model bet and more like an expanding model stack optimized for coding, multimodal productivity,
    and agent workflows.'
