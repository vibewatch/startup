  evidenceGaps:
  - type: missing-source
    severity: material
    topic: enterprise-assurance
    missingEvidence: Publicly reviewable SOC 2, ISO 27001, SLA, uptime, or similar enterprise-assurance material for Kimi
      products and API.
    whyItMatters: Without assurance artifacts, large regulated customers cannot easily underwrite Kimi as production-ready
      infrastructure.
    diligencePath: Request the latest security packet, compliance certifications, and standard SLA/MSA exhibits from enterprise
      sales.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: customer-adoption
    missingEvidence: Named enterprise references, renewal data, and production case studies for major Kimi deployments.
    whyItMatters: Current public evidence shows product breadth but not enough customer proof to assess repeatability or stickiness.
    diligencePath: Request customer reference calls, renewal cohorts, and named lighthouse deployments from GTM leadership.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE002
  - type: conflicting-data
    severity: material
    topic: provenance-risk
    missingEvidence: Independent findings or legal resolution regarding the Anthropic distillation allegations.
    whyItMatters: Model provenance and compliance narratives can affect procurement, partner appetite, and regulatory scrutiny.
    diligencePath: Request internal investigation findings, counsel summary, and any regulator or partner correspondence on
      provenance controls.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: operational-reliability
    missingEvidence: Customer-facing uptime, latency, and incident-history disclosures for Kimi API and consumer surfaces.
    whyItMatters: Mooncake papers show strong systems sophistication, but buyers still need service-level reliability evidence.
    diligencePath: Request SRE dashboards, status-page history, and customer SLA performance reports.
