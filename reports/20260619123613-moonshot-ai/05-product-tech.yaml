- id: trust-quality-compliance-and-roadmap
  title: Trust, quality, compliance, and roadmap risk
  body: 'Moonshot''s trust package is mixed. On the positive side, the company publishes real policy pages rather than a black
    box: the Terms of Service prohibit reverse engineering, scraping, abusive automation, safety-filter evasion, and training
    competing models from the service, while the privacy policy describes encryption, backups, monitoring, and incident response.
    The model docs also give unusually specific integration guidance around reasoning_content, multimodal limits, and compatibility
    behavior, which is a quality signal for developers. The release history is also active enough to show real product iteration,
    from context caching and enterprise APIs in 2024 to K2, K2 Thinking, K2.5, Agent Swarm, WorldVQA, and K2.6/K2.7 Code across
    2025-2026.


    The gaps are still significant. The reviewed public record does not disclose SOC 2, ISO 27001, formal SLAs, or other enterprise-grade
    assurance artifacts that procurement-heavy customers often demand. More importantly, the risk surface is not abstract:
    the OECD AI Incidents Monitor records a 2026 privacy incident involving Kimi, and Anthropic publicly accused Moonshot
    of industrial-scale distillation against Claude. Those episodes do not erase the technical sophistication of the product
    stack, but they do change the diligence burden. A buyer or investor can underwrite the technology as ambitious and increasingly
    full-stack; they should not yet underwrite it as low-friction, certification-rich enterprise infrastructure without more
    private evidence.'
