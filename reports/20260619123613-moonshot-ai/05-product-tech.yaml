company:
  name: Moonshot AI
chapter:
  number: 5
  title: Product & Technology
  summary: 'Moonshot AI now sells far more than a generic chatbot: the Kimi stack spans consumer productivity surfaces, developer
    APIs, coding-centric agents, multimodal model families, and the Mooncake serving infrastructure underneath them. Official
    documentation supports a dense model roadmap from K1.5 to K2, K2.5, K2.6, K2.7 Code, and Kimi-VL, with 256K context on
    the current flagship text models and 128K on K2 and Kimi-VL. The public trust package is meaningfully weaker than the
    product package, however: policy pages document usage controls and security measures, but not audited enterprise certifications,
    while 2026 privacy and provenance controversies create real technical and compliance risk.'
sections:
- id: product-surface-and-workflows
  title: Product surface and user workflow
  body: 'Kimi''s public product map is now broad enough that it should be read as a suite rather than a single assistant.
    The corporate and product homepages emphasize code, deep research, websites, sheets, and slides, while the platform homepage
    adds a developer layer with official tools such as web search, memory, Excel analysis, code execution, and content fetching.
    Kimi Code sits inside that map as the explicitly coding-focused surface, marketed as a terminal-and-IDE workflow connected
    to Kimi membership. The developer platform does not hide behind a proprietary SDK either: the quickstart materials say
    the API is OpenAI-compatible, which reduces adoption friction for teams already built around Chat Completions-style clients.


    This matters for how the product should be analyzed. Moonshot is not just selling better raw model weights. It is packaging
    those weights into a set of workflow products that map to different buyer jobs: deep research for knowledge work, code
    for developer productivity, websites or slides for creative output, and an API plus tools layer for application builders.
    The presence of batch APIs, official tool documentation, and migration guides reinforces that the company expects users
    to build multi-step, agentic workflows on top of Kimi rather than only single-turn text prompts.'
