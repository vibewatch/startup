- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Privacy / data-governance failure
    - Material new leak, regulator action, or repeated data-collection criticism
    - Another verified user-data leak or unresolved regulator finding within the next refresh cycle
    - Escalate to red-flag diligence; do not underwrite enterprise durability without independent remediation evidence
  - - Reliability degradation
    - Public outages or overloaded launches
    - Repeated multi-hour outages on core user surfaces or lack of postmortem discipline
    - Treat margin and customer expansion assumptions as overstated until operating controls improve
  - - Control-stack opacity
    - Missing public or private compliance artifacts
    - Moonshot cannot provide filing details, DPA / security pack, or incident evidence in diligence
    - Move from research-more to avoid for regulated or cross-border customer underwriting
  - - Competitive underpricing
    - Continued low-price launches without visibility into cost discipline
    - New major releases keep prices compressed while customer-quality and retention data remain undisclosed
    - Assume lower-quality revenue and require stricter entry discipline
  - - Dependency concentration
    - No vendor map or cloud resilience evidence
    - Management cannot identify top infrastructure counterparties and failover plans
    - Treat operational resilience as unproven and haircut scaling assumptions
  notes: Each trigger is tied to a concrete public or diligence artifact so the investment team can treat risk movement as observable rather than intuitive.
