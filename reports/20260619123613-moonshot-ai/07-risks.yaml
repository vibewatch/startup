  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: dependency-gap
    missingEvidence: Cloud-provider list, top infrastructure counterparties, failover design, and any internal concentration limits.
    whyItMatters: Without dependency mapping, investors cannot judge how outages, pricing resets, or capacity shocks would transmit into margin or reliability.
    diligencePath: Request architecture and vendor map, top-five compute / cloud counterparties, failover policy, and any contingency contract terms.
    relatedQuestionRefs:
    - QR016
    - QR030
    relatedTableRefs:
    - TR003
    - TR004
  - type: private-evidence-only
    severity: material
    topic: control-gap
    missingEvidence: SLA terms, certification pack, enterprise security controls, postmortems, and module-level retention / logging documentation.
    whyItMatters: Public policies alone are not enough to underwrite operational resilience or enterprise trust after a privacy incident and data-collection criticism.
    diligencePath: Request SOC / ISO status if any, DPA or security packet, past-year incident list, postmortems, and product-by-product data-flow diagrams.
    relatedQuestionRefs:
    - QR020
    - QR021
    - QR026
    - QR030
    relatedTableRefs:
    - TR002
    - TR004
  - type: private-evidence-only
    severity: material
    topic: filing-visibility-gap
    missingEvidence: Moonshot’s specific filing number(s), registration number(s), and labeling implementation evidence on each user-facing surface.
    whyItMatters: China’s rules explicitly tie public service deployment to filing and disclosure expectations, but the fetched product surfaces did not make those references easy to verify.
    diligencePath: Request screenshots or product-detail disclosures for each Kimi surface plus the related CAC filing identifiers and scope notes.
    relatedQuestionRefs:
    - QR027
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: export-and-jurisdiction-gap
    missingEvidence: Management view on foreign-procurement restrictions, national-security screening, and how cross-border enterprise customers are segmented and governed.
    whyItMatters: IAPS and enterprise-leakage reporting suggest geopolitical and jurisdictional risk can affect adoption outside China even when technical performance is strong.
    diligencePath: Request policy memo on foreign-government or regulated-customer positioning, sanctions / screening controls, and customer geo-segmentation policy.
    relatedQuestionRefs:
    - QR022
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: minor
    topic: support-and-remediation-gap
    missingEvidence: Complaint volumes, refund rates, chargebacks, support SLA metrics, and legal-notice volumes by channel.
    whyItMatters: Consumer-scale apps can absorb minor complaints, but repeated support friction can become an early warning signal for revenue quality and trust decay.
    diligencePath: Request monthly support dashboard, billing dispute rates, refund percentage, and any regulator or app-store escalation summaries.
    relatedQuestionRefs:
    - QR011
    - QR030
    relatedTableRefs:
    - TR002
    - TR004
  - type: private-evidence-only
    severity: material
    topic: governance-owner-gap
    missingEvidence: Named owners for legal compliance, privacy, security, and trust across consumer, API, and agentic surfaces.
    whyItMatters: Moonshot’s risk stack is multi-front, so undefined ownership is itself a residual execution risk.
    diligencePath: Request org chart, named control owners, escalation matrix, and reporting cadence to founders or board-level bodies.
    relatedQuestionRefs:
    - QR023
    - QR024
    - QR030
    relatedTableRefs:
    - TR004
    - TR005
