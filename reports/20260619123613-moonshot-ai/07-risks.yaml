- id: operational-quality-security
  title: Operational reliability, data handling, and agentic security widen the downside beyond ordinary chatbot risk
  body: 'Moonshot’s operational risk is not just that models hallucinate; it is that the product surface is becoming broad enough for control failures to land across many workflows at once. Kimi now touches deep research, website building, documents, slides, spreadsheets, API tool use, Kimi Code, and always-on agent workflows. SCMP already documented one visible overload outage, and the privacy policy shows a far wider data footprint than a narrow chat app: user content can include files and generated outputs, logs can include device and conversation identifiers, and clipboard data may be collected when settings allow. IAPS takes the risk further by arguing that Kimi Claw and the OpenClaw ecosystem import always-on surveillance, prompt-injection, malicious-skill, and even remote-code-execution exposure into a Chinese-hosted agent stack. Hacker News’ summary of Harmonic data adds a practical enterprise angle: Kimi may be reaching corporate environments through unsanctioned employee adoption
    long before formal governance exists. That combination means operational risk now spans uptime, privacy, abuse prevention, and the security consequences of agent autonomy.'
