  productSummary: >-
    Kimi is a multi-surface AI product suite covering chat, deep research,
    code, websites, slides, sheets, and agent workflows. Moonshot also sells an
    OpenAI-compatible developer platform with token-based pricing, tool calls,
    and long-context frontier models, while continuing to publish new model
    families and infrastructure such as Mooncake.
  customerFocus: >-
