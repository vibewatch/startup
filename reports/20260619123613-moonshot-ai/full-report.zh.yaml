  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              分析 Moonshot，应把它放在面向中国的 AI 助手和基础模型应用层，而不是把它当作中国全部 AI 支出的代理。证据显示，Kimi
              活跃在公众用户或企业团队购买模型支撑型知识工作的场景：聊天、研究、文档工作流、电子表格辅助、编码和 Agent 任务。Kimi 的 API 文档又通过文件、批处理、工具调用、JSON
              模式和网页搜索，把这个边界延伸到开发者工作流。IDC 的中国市场概览也支持同一边界：它把模型和 Agent
              平台，与底层芯片、计算、存储和网络栈分开。因此，纳入支出是与模型使用绑定的应用和平台支出；排除支出包括原始半导体、无差异云 IaaS，以及整个中国软件市场。


              这个边界重要，因为真实替代品不只是有名有姓的聊天机器人竞品。对中国知识工作者来说，现状仍可能是搜索、文档、电子表格、办公软件或手工分析。对开发者来说，替代品可能是 DeepSeek、Qwen 等兼容 OpenAI
              的本土同行，也可能是基于迁移友好 API 自建的内部栈。对企业买家来说，替代品可能是治理更强或母公司分发更强的本地化平台。若把 Moonshot 视为覆盖所有 AI 预算，就会掩盖 Kimi
              今天可证明销售内容的窄度，也会掩盖工作流层面的替代强度。
