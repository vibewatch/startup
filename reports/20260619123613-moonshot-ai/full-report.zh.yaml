  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Moonshot 的隐私和可靠性失误可能传导到客户信任、监管负担、变现和估值。
    data:
      nodes:
        - id: privacy
          label: 隐私 / 数据事件
        - id: regulatory
          label: 监管审视
        - id: trust
