      - number: '1.4'
        title: 里程碑、不利事件与后续章节应继承的内容
        blocks:
          - type: paragraph
            body: >-
              对一家私有 AI 公司来说，Moonshot AI 的公开里程碑曲线异常清晰。TechCrunch 将基础模型发布放在 2023 年 3 月，将首个 Kimi 聊天机器人发布放在 2023 年 10 月。CNBC
              随后记录了后续节奏：2025 年 7 月 Kimi K2、2025 年 11 月 K2 Thinking、2026 年 1 月 K2.5。Moonshot 自有主页又把 WorldVQA、Agent Swarm
              和 K2.6 加入 2026 年研究时间线；平台博客则显示，商业化栈自 2024 年起已通过上下文缓存和企业 API 工作持续拓宽。合在一起，这些里程碑支撑了后续章节的一个关键分析点：Moonshot
              不只是发布模型，也在把模型包装成更完整的产品和开发者生态。


              记录中的负面一侧也足够真实，应随本章进入后续分析。CNBC 报道了 Anthropic 的指控：Moonshot 参与了针对 Claude 的大规模蒸馏行动；Anthropic
              自身声明则给出关于数百万次交互和定向能力抽取的详细指称。另据 OECD AI Incidents Monitor 记录，2026 年发生了一起涉及 Kimi 简历泄露的隐私事件。单看任一事件，都不能直接确定
              Moonshot
              内部控制的法律或技术事实；但两者合在一起，已经构成围绕来源、隐私和治理的非轻微风险。后续章节因此应把本概览作为身份、规模方向和里程碑节奏的事实底座，同时继续把治理深度、客户广度、员工规模和准确融资历史视为未解决尽调项。
