companyProfile:
  summary: >-
    Moonshot AI 是一家以北京为中心的中国 AI 公司，由杨植麟、周鑫宇、吴雨欣于 2023 年创立。公开产品栈已覆盖 Kimi 消费者助手、Kimi Code、开发者 API 平台，以及快速推进的开放权重 /
    开源模型路线图，包括 K1.5、K2、K2.5、K2.6 和 K2.7 Code。商业模式把会员和其他 Kimi 付费访问，与按量计费的 API 结合起来；2026 年报道显示 ARR 已超过 $200
    million，融资估值据称达到 $20 billion。投资逻辑有真实产品速度和商业化支撑，但治理、单位经济、客户集中度和上市准备细节的公开披露仍限制判断。
