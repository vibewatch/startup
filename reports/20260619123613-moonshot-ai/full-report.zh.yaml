        - 继续研究
        - Moonshot 确有变现和资本可得性，但价格支撑仍依赖不透明变量
        - 没有数据室前，不按当前估值投入
      - - 信心
        - 中
        - 2026 年新来源印证了规模、融资和 IPO 准备
        - 继续尽调，而不是停止覆盖
      - - 风险评级
        - 高
        - 监管重组、披露缺口和稀缺性溢价下行仍然重要
        - 任何交易都应按高波动、受条款敏感处理
      - - 估值立场
        - 偏高
        - 当前估值已计入乐观增长和上市假设
        - 要么要求更好披露，要么要求更好入场价格
    notes: 建议对价格敏感，并不意味着 Moonshot 缺少产品或市场质量。
    claimRefs:
      - CV001
      - CV004
      - CV029
      - CV032
      - CV033
      - CV034
  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 支持因素
      - 何种变化会改变判断
    rows:
      - - Moonshot 是中国变现最快的开放权重前沿实验室
        - ARR 从 3 月的 $100M+ 增至 4 月的 $200M+；官方定价和预付需求均已公开
        - 独立审计收入或留存低于预期会削弱这一判断
      - - 该资产具备公开上市可选性
        - 已融资、结构清理和香港准备工作都指向仍在推进的 IPO 路径
        - 监管延误或放弃上市计划会实质削弱稀缺性溢价
      - - 当前价格已折现大部分利好
        - 基于公开 ARR 证据的 $20B 估值意味着当前倍数很高
        - 更强的审计后变现基础或更低入场价格会降低这一担忧
      - - 安全性定价风险不同于公司质量风险
        - 股权结构、清算优先权和投资者权利仍未披露
        - 完整融资文件和清晰分配瀑布可迅速改善投资论点
    notes: 正方论点真实存在，但仍对证据敏感；反方论点关乎安全性定价和披露，而不是产品无关紧要。
    claimRefs:
      - CV004
      - CV025
      - CV029
      - CV030
      - CV031
      - CV044
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - ARR 向 ~$500M 复合增长，IPO 路径保持打开，55-70x 稀缺溢价守住
        - 隐含估值 $27.5B-$35.0B；存在上行空间，但取决于持续高增长
        - 需要 4 月之后变现持续推进，披露也更清晰
        - 监管或利润率一旦滑坡，该情景会很快被压缩
      - - 基准
        - ARR 达到 ~$350M，溢价回落到 50-60x
        - 隐含估值 $17.5B-$21.0B；当前估值大致合理
        - 最可能的前提是 Moonshot 仍是品类龙头，但不是全球级爆发异类
        - 新资金安全边际很薄
      - - 悲观
        - ARR 卡在 ~$250M 附近，倍数压缩到 30-40x
        - 隐含估值 $7.5B-$10.0B；较当前水平有实质下行
        - IPO 延后、付费采用放慢或利润率质量偏弱都会触发该情景
        - 下轮降估值、治理折价、估值重置
    notes: 情景测算仅作示意，且有意取整；股权结构条款、稀释和经审计 ARR 均未披露。
    claimRefs:
      - CV035
      - CV036
      - CV037
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 关键指标
      - 倍数 / 估值
      - 相关性
      - 局限
    rows:
      - - Moonshot AI（私有，2026 年 5 月）
        - 2026 年 4 月 ARR >$200M
        - 据报道估值 $20B；按公开最低锚点计算，隐含 ARR 倍数约 100x
        - 最接近本次决策的直接锚点
        - 公开 ARR 是地板信号，不是经审计收入
      - - Anthropic（私有，2026 年 5 月）
        - 运行率收入 $47B
        - 投后估值 $965B；约 20.5x 运行率收入
        - 展示规模化前沿模型赢家能拿到的定价
        - 规模、全球化和披露程度都远高于 Moonshot
      - - OpenAI（私有，2026 年 3 月）
        - 收入 $2B/月（年化约 $24B）
        - 投后估值 $852B；约 35.5x 年化收入
        - 展示极强分发优势下的前沿稀缺溢价
        - 分发、算力控制和地缘政治背景不同
      - - Zhipu AI（公开首秀，2026 年 1 月）
        - 2025 年上半年收入 CNY190.9M；亏损严重
        - 首秀市值 $7.4B
        - 显示香港投资者即便面对亏损，也会给中国 AI 稀缺性资本化
        - 收入期不是全年，业务组合也不同
      - - MiniMax（公开首秀，2026 年 1 月）
        - IPO 募资 $619M；首秀市值 >$11.5B；9M25 毛利率 69.4%
        - 公开市场接受一家亏损中国 AI 发行人的极高估值
        - 有用的中国前沿模型先例
        - 首日市值波动大，不代表稳态估值
      - - C3.ai（公开，2026 年 6 月）
        - FY2026 收入 $250.3M
        - 市值 $1.50B；3.9x EV/Sales
        - 经济性偏弱的小规模 AI 软件公司估值下沿
        - 不是前沿模型平台，增速也低得多
      - - Palantir（公开，2026 年 6 月）
        - TTM 收入 $5.22B
        - 市值 $307.98B；57.46x EV/Sales
        - 已证明盈利能力和现金生成的 AI 驱动增长公司公开市场上沿
        - 比 Moonshot 成熟且盈利能力强得多
    notes: 这是一组样本可比公司，不覆盖所有 AI 发行人。用途是给 Moonshot 估值划出区间，而不是精确定价。
    enumerationScope:
      coverage: sample
      basis: >-
        Selected private frontier-model rounds, Chinese AI IPOs, and public AI software comps that bracket Moonshot's
        current valuation debate as of June 2026.
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV012
      - CV014
      - CV015
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: TV005
    title: 投资逻辑失效与止损触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - IPO 执行失败
        - 结构清理后，上市明显延后或放弃
        - 稀缺溢价和退出可选性坍塌
        - 从「继续研究」转为「回避」，直到融资条款重设
      - - 降估值或平估值融资
        - 下一轮新股融资低于当前私人估值，或没有明显高于当前估值
        - 证实估值跑在基本面前面
        - 重切情景表，并假设下行伴随大量稀释
      - - 增长停滞
        - 证据仍停留在 2026 年 4 月 ARR 地板附近，而不是继续复合增长
        - 乐观和基准情景失去支撑
        - 要么要求更低入场价，要么放弃机会
      - - 利润率披露偏弱
        - Data room 显示毛利率差，或存在大额算力预购
        - 成长故事变成低质量证券
        - 除非价格大幅重置，否则按回避处理
      - - 优先权悬顶
        - 高级投资者权利或反稀释堆叠严重压在新进入者身上
        - 上行可能属于早期轮次，而不是新资本
        - 要求更强治理，否则放弃
      - - 监管收紧
        - 香港或内地政策变化限制上市或外资持有人结构
        - 退出时点和投资者池同时收缩
        - 重估为持有期更长、倍数更低的私人资产
    notes: 这些触发项用于监测，不是预测；它们是最可能打破估值逻辑的具体事件。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV042
      - CV043
      - CV045
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计变现桥
        - 月度确认收入、ARR、递延收入和预收余额
        - 判断 4 月 ARR 是否足够持久，能否支撑当前估值
        - 财务团队 / 审计师材料
      - - 股权结构表和优先股堆叠
        - 完整股权结构表、清算瀑布、反稀释、ROFR 和投资者权利条款
        - 判断真实证券质量和下行保护
        - 公司法律顾问和 CFO
      - - 毛利率桥
        - 自托管与合作伙伴路由经济性、算力承诺和支持成本分摊
        - 揭示增长更像软件，还是严重依赖基础设施转手
        - FP&A 加基础设施运营
      - - IPO 准备材料
        - 结构清理状态、上市时间表、承销商状态和监管反馈
        - 当前估值部分押注公开市场可选性
        - 总法律顾问、外部律师和投行
      - - 客户集中度 / 留存
        - 头部客户占比、预付依赖和留存队列
        - 检验变现故事是否分散且持久
        - 收入运营和销售负责人
      - - 竞争切换风险
        - 相对 DeepSeek、Zhipu、MiniMax 和第三方 K2.6 托管方的赢单 / 输单分析
        - 显示当前需求属于 Moonshot，还是属于暂时性能窗口
        - 产品、GTM 和大客户团队
    notes: 这些问题按它们改变定价观点的速度排序，而不是按获取难度排序。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
