            body: >-
              Moonshot 的客户故事比简单消费者聊天机器人更宽，但公开记录仍指向消费者主导的安装基础，而不是已披露的企业基础。Kimi 自有界面显示消费聊天、Agentic 研究、网站和幻灯片生成、深度研究工作流、API
              访问和 Kimi Code。帮助中心进一步区分 Membership 与 Kimi Business，说明即便公司没有发布传统企业案例页面，Moonshot 已经按买家、用户和付款方来思考。App Store
