      - number: '4.4'
        title: 财务结论与承销阻断点
        blocks:
          - type: paragraph
            body: >-
              Moonshot 已有足够证据支撑一个真实财务叙事：可见的按使用量定价、清晰的 ARR 加速、企业为算力预付的意愿，以及一张仅看报道现金和融资就强于多数私有 AI
              实验室的资产负债表。它也带有全球前沿模型同行身上同样可见的资本强度特征。OpenAI 和 Anthropic 都在以明确绑定算力扩张和基础设施控制的尺度融资，Moonshot
              自身芯片采购计划也符合这一模式。换句话说，Moonshot 看起来不像没有商业模式的投机聊天机器人，更像一个稀缺的基础设施 + 模型资产，其商业轨迹正开始公开浮现。


              阻断点同样清楚。公开来源仍未披露收入确认政策、毛利率、客户集中度、CAC、回本周期、债务或 runway；IPO 准备报道部分在付费墙后；即便最好的外部基准，也只能显示 C3.ai 这类公开 AI
              软件公司必须披露什么，而不是 Moonshot 自身每个 token 赚多少。因此，正确结论应谨慎而非看多：Moonshot
              看起来商业真实且融资充足，但公开记录仍过薄，无法以申报文件级信心承销收入质量、贡献利润率或资本充足性。下表所有无支撑指标因此都作为尽调缺口呈现，而不是编造数字。
