      - number: '8.3'
        title: 可比估值框架
        blocks:
          - type: paragraph
            body: >-
              Moonshot 落在一组尴尬的可比公司之间，这正是当前价格难以承销的原因。OpenAI 和 Anthropic
              说明，当算力、开发者需求和分发同时复合时，私营前沿模型龙头仍可拿到极高融资倍数。但这些公司对经常性收入、产品宽度和基础设施战略的披露，也远多于今天的 Moonshot。公开市场一侧，C3.ai
              给出了低规模、弱利润率 AI 软件的严苛下限；Palantir 则说明，一旦执行已经被证明，市场仍愿意为 AI 驱动增长和现金生成支付极高溢价。


              中国 AI IPO 让图景更复杂。Yicai 和 TechNode 显示，Zhipu 和 MiniMax 上市时，市场愿意按远高于美国中盘软件可比公司可解释水平的价格资本化前沿模型稀缺性。这有助于解释为什么
              Moonshot 当前估值并不明显荒谬。但这不等于这个估值本身有吸引力。最站得住脚的解释是：Moonshot
              现在更接近一份公开市场稀缺性期权，而不是带折价的私募轮次。上行仍有可能，但只有当商业化和上市准备的收敛速度持续快过怀疑情绪时才成立。
