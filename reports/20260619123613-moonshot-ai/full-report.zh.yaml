        title: 切换成本、锁定与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              在模型层，切换成本仍低于许多历史软件类别。Kimi 发布 OpenAI 迁移指南；DeepSeek 支持 OpenAI 和 Anthropic 格式；Alibaba 明确提供兼容 OpenAI 的
              API；Zhipu 记录 OpenAI-SDK 兼容性；MiniMax token 方案文档暴露了 Anthropic
              风格集成。这种组合让买家更容易做价格和基准比较。因此，只靠模型质量取胜的供应商可能很快被替换。


              更耐久的护城河在上一层。通过消费者或商业生态分发、明确治理工具、搜索与知识资产、更深工作流嵌入，都会提高真实切换成本。Baidu 的企业控制和搜索资产、Alibaba 的商业图谱、ByteDance
              的应用触达、Tencent 的超级应用定位，都在这一更高层运作。Kimi 的护城河更温和，但依然真实：它有可识别品牌、长上下文定位、公开知识工作入口，以及面向已使用 OpenAI
              风格工具开发者的迁移便利。问题在于，在本土价格压力和平台支持竞争者进一步缩小差距前，这组能力能否足够快地复利。
