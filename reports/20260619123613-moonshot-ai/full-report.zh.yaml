      - number: '8.5'
        title: 最后尽调要求和投资论证破裂触发器
        blocks:
          - type: paragraph
            body: >-
              缺失证据异常集中在估值关键区域。投资者需要经审计的月度收入桥、股权结构和优先权栈、算力采购承诺，以及香港上市准备的真实时间表。没有这些，公司仍可能是高质量资产，但无法判断新投资者与底层业务之间隔着多少下行保护、稀释或现金强度风险。因此，尽调负担不在于弄清
              Moonshot 有没有需求——公开证据已经显示大概率有——而在于弄清这些需求能否在当前价格下转化为一只耐久、可投资的证券。


              投资论证破裂触发器也相应具体。上市流程失败或实质延迟，会刺破稀缺性溢价。低于当前估值的融资会确认估值透支。ARR 停在支撑 2026
              年热情所需水平之下，会推翻「变现最快实验室」叙事。披露包若显示毛利率薄弱或激进优先权悬顶，会把一家有前景的公司变成一只糟糕证券。这些不是遥远边缘情形；Moonshot
              是从观察名单进入组合，还是从观察名单转为放弃，应由这四个问题决定。
