      - number: '1.3'
        title: 融资历史、估值路径与封面指标
        blocks:
          - type: paragraph
            body: >-
              融资故事的核心是快速抬升。TechCrunch 报道，2024 年初公司估值为 $2.5 billion，并完成超过 $1 billion 的 Series B 融资。到 2026
              年初，公开报道已进入更大尺度：Caixin 报道 $500 million Series C 和超过人民币 100 亿元现金；TechCrunch 与 Forbes 均报道称，公司以 $20 billion
              估值融资约 $2 billion。TechCrunch 还称，Moonshot 在此前六个月融资 $3.9 billion，最新融资中有 Long-Z Investments、Tsinghua
              Capital、China Mobile 和 CPE Yuanfeng，更广泛投资方包括 Alibaba、Tencent、HongShan、ZhenFund、IDG 和 5Y。这足以判断 Moonshot
              已站在中国私有 AI 融资的第一梯队附近。


              指标图景仍不完整。2026 年 4 月报道的 ARR 超过 $200 million 很有意义，公司的现金余额和 OpenRouter
              使用排名也指向真实商业牵引。但经审阅材料没有给出经审计收入、客户数量、员工规模，也没有调和后的累计融资金额。这些缺口很重要，因为它们限制了对运营效率、稀释和持续性的清晰解读。本章的正确做法是陈述有支撑的数字，把无支撑数字保留为明确缺口，避免把投资者热情转成虚假的精确性。
