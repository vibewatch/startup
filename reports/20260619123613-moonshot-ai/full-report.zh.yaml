      - number: '2.2'
        title: 受证据约束的规模测算视角与 Kimi 当前位置
        blocks:
          - type: paragraph
            body: >-
              公开来源没有给出 Moonshot 所服务的“中国助手 + 基础模型”精确类别的、非付费墙且口径干净的人民币市场规模，因此更可辩护的做法是保留多个规模测算视角。第一是被监测需求。AICPB 2026 年 4
              月中国 AI 排名显示，头部产品拥有很大的公众注意力池，并将 Kimi 排在中国 AI 网站第五，访问量 43.69 million；在中国 AI 应用中排第八，MAU 25.33
              million。这些数字有意义，但也说明 Kimi 目前不是消费者端领导者：在被监测的公众需求代理指标上，DeepSeek 和 Doubao 要大得多。第二个视角是企业采用。IDC 称，到 2027 年，80%
              的中国 C1000 企业将优先考虑 AI 主权，这会扩大国内模型供应商的可服务池，即使精确类别收入仍未披露。第三个视角是变现轨道。Kimi、DeepSeek、Qwen、ERNIE、OpenAI、Anthropic
              和 Google 的公开定价页显示，标价阶梯很宽，从低于人民币级别的本土价格地板，到高端美国 API 定价都有。


              合并来看，这些视角支撑一个大且增长中的市场，但变现深度仍不确定。IDC 的中国 AI 编码展望明确提到增长很快、月度定价较低，且头部供应商 2025 年收入仍低于人民币 1 亿元。这正是 Moonshot
              的核心分析张力：Kimi 已有足够分发来成为重要玩家，但公开证据显示，类别使用量扩张快于标准化利润池。Kimi 当前位置更像一个有真实规模的可信挑战者，而不是一个已证明市场捕获能力的类别所有者。
