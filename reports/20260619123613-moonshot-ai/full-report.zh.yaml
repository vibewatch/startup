      - number: '4.2'
        title: 单位经济代理指标与推理成本强度
        blocks:
          - type: paragraph
            body: >-
              Moonshot 仍未披露毛利率、CAC、回本周期或贡献利润率，因此唯一可辩护的方法是从公开代理指标入手。官方价格表显示，K2.6 输出 token 价格是未缓存输入 token 的四倍多，K2.7 Code
              保持类似经济性，批处理则用延迟换取输出费率降低 40%。这些比例说明 Moonshot 正有意识地把客户引向成本更低、公司能控制基础设施利用率的运行模式。同时，定价中心确认模型按纯 token
              吞吐量计费，这意味着毛利高度取决于 Moonshot 自身算力成本与公开价目表之间的价差。


              公开需求和基准证据进一步说明，推理容量是关键瓶颈。CnTechPost 称，K2.5 发布后 token-per-minute 配额很快收紧；CoreWeave 和 VentureBeat
              则显示，当第三方以不同于官方端点的方式优化 K2.6 时，基础设施性能和单位成本差异可以拉开多大。VentureBeat 还把 K2.6 描述为万亿参数 MoE 模型，每个 token 激活 32 billion
              参数，这有助于解释容量管理为何如此重要。结论不是 Moonshot 经济性差，而是其经济性明显受基础设施驱动。没有托管端与转售端成本桥接时，公开记录只能支持方向性结论：Moonshot
              有真实变现动能，但其贡献利润率很可能比经典 80% 以上毛利率 SaaS 公司更敏感于推理组合、供应商条款和容量规划。
