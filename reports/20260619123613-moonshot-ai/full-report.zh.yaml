      - number: '7.4'
        title: 执行范围本身已经成为风险，投资论证需要可衡量的止损标准
        blocks:
          - type: paragraph
            body: >-
              Moonshot 的机会足够大，执行发散已经成了核心承销问题。公司不是在交付一个窄口径答案引擎，而是在同时运营消费者会员、应用商店计费、API 平台、开源模型发布、Kimi Code、Kimi
              Claw、智能体群，以及法律或金融文档处理这类风险越来越高的工作流。文档和仓库页面很活跃，这是正面信号，但也说明管理层必须同步多少控制平面。公开证据还没有闭合几条重要尽调链：保留材料中没有公开 SLA
              或认证包，抓取到的产品页面看不到备案号，没有详细事故复盘，也没有公开的基础设施交易对手地图。这些缺口不能证明公司薄弱，但会实质性抬高剩余执行风险。因此，正确的投资者姿态应当明确，而不是凭印象判断：现在就要求控制证据、事故纪律和依赖关系映射；如果拿不出来，应视为投资论证破裂信号，而不是常规创业公司缺口。
