  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品入口与用户工作流
        blocks:
          - type: paragraph
            body: >-
              Kimi 的公开产品图谱已经足够宽，应被视为一套产品，而不是单一助手。公司和产品主页强调代码、深度研究、网站、表格和幻灯片；平台主页又增加开发者层，提供网页搜索、记忆、Excel
              分析、代码执行和内容抓取等官方工具。Kimi Code 位于这张图谱之内，是明确聚焦编码的入口，被营销为连接 Kimi 会员的终端与 IDE 工作流。开发者平台也没有躲在专有 SDK 后面：快速入门材料称 API
              兼容 OpenAI，这会降低已围绕 Chat Completions 风格客户端构建团队的采用摩擦。


              这会影响产品分析方式。Moonshot 卖的不是更好的原始模型权重，而是把这些权重包装进一组工作流产品，对应不同买家任务：深度研究服务知识工作，代码服务开发者生产力，网站或幻灯片服务创意产出，API
              加工具层服务应用构建者。批处理 API、官方工具文档和迁移指南的存在进一步说明，公司预期用户在 Kimi 之上构建多步 Agentic 工作流，而不是只发单轮文本提示。
