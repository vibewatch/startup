  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价入口
        blocks:
          - type: paragraph
            body: >-
              Moonshot 现在有了可见的变现栈，而不是单一不透明的聊天机器人入口。Kimi 官方定价文件显示，公司对实时聊天的输入和输出 token
              均计费，按模型家族设置不同标价，对批处理作业打折，并在网页搜索工具使用上叠加明确的单次调用费。这意味着 Moonshot
              同时对使用量、模型层级和工作流类型变现。公开文档不能证明已实现价格或利润率捕获，但确立了从模型使用到可计费收入的具体路径。K2.6 和 K2.7 Code 都面向长上下文、Agentic
              工作负载定价；Moonshot V1 仍是更便宜的旧模型家族；批处理和工具定价则把变现延伸到可容忍更高延迟或检索更重的工作流。


              这些标价入口重要，最清晰的商业证明来自 ARR 加速与企业预付需求的组合。CnTechPost 称，K2.5 发布一个月后，ARR 在 2026 年 3 月初突破 $100 million；TechCrunch
              称 ARR 在 4 月超过 $200 million，由订阅和 API 使用驱动。同一篇 CnTechPost
              报道称，部分企业客户提出数千万美元预付承诺，以锁定优先算力。这没有揭示经常性收入占比、折扣或合同期限，但说明 Moonshot 不只是收割消费者注意力——它也在把稀缺推理容量变现。因此，本章把 API
              token、Kimi 付费访问、企业优先容量、批处理和工具调用视为公开证据最能支撑的五个收入入口；已实现 ASP 和续约质量则保留为尽调项，而不是编造事实。
