  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和隐私暴露是最高严重度的风险栈
        blocks:
          - type: paragraph
            body: >-
              Moonshot 面对的监管环境，已经不是泛泛牵连到生成式 AI，而是直接点名生成式 AI。中国《生成式人工智能服务管理暂行办法》直接适用于面向公众的生成式 AI
              服务，把合规拉回网络安全、数据安全和个人信息法律框架，并要求训练数据合法、数据收集必要、服务稳定，符合条件的系统还要履行备案义务。2025 年以来，合规门槛没有降低：White & Case
              提到强制标识规则和新的安全导向国家标准，中国官方政策页面也显示 AI 标准和司法指引还在扩容。在这个背景下，Moonshot 的公开信任记录比普通消费应用更关键。SCMP 报道 Kimi
              被认定存在过度收集数据，OECD 事件追踪器记录了一起简历泄露，并称该事件引发法律行动。Moonshot
              自己的条款和隐私材料也留下真实尽调工作：用户与一家新加坡实体按新加坡法律订约，隐私政策仍允许较宽泛的内容处理、关联方共享，以及因法律或运营需要而保留数据。结论是，这套法律栈里，合规、数据处理和信任已经无法干净切开。
