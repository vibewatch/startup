      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Kimi 的买方图谱随产品入口而变化。消费端，用户和付款方可以是同一个人：学生、研究人员，或探索搜索、文档、幻灯片、电子表格辅助的一般知识工作者。开发者端，用户可能是工程师或 Agent 构建者；随着 API
              使用增长，付款方会从个人卡转向团队或产品预算。企业端，最终用户仍可能是分析师、运营人员或开发者，但实际预算所有者通常落在 CTO、CIO、平台或创新职能，因为采购开始包含治理、吞吐量和推广要求，而不只是模型质量。


              采用路径也相应是多步的。公开定价和工具表明，低摩擦入口包括自助使用、编码试用或 API 实验。OpenAI 迁移文档降低初始切换成本，因为团队可以保留熟悉的 SDK
              模式。但从试用进入持续支出仍需要工作流验证；从团队使用进入有治理的部署，还要通过合规、日志和本地化的第二道关口。因此，Kimi
              宽产品面有助于需求生成，却不能消除后期摩擦。公开证据支持一个真实的买家—用户—付款方阶梯，但也说明收入质量取决于 Moonshot 能否从实验推进到嵌入团队流程的重复性工作。
