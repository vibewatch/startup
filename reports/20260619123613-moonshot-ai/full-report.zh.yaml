      - number: '7.2'
        title: 运营可靠性、数据处理和智能体安全把下行风险推到普通聊天机器人之外
        blocks:
          - type: paragraph
            body: >-
              Moonshot 的运营风险不只是模型会幻觉，而是产品触面已经足够宽，一旦控制失效，可能同时落到多条工作流上。Kimi 现在覆盖深度研究、网站搭建、文档、幻灯片、电子表格、API 工具调用、Kimi
              Code，以及常驻智能体工作流。SCMP
              已记录过一次可见的过载宕机；隐私政策显示，其数据足迹也远宽于窄口径聊天应用：用户内容可包括文件和生成输出，日志可包括设备和会话标识符，设置允许时还可能收集剪贴板数据。IAPS 把风险再往前推一步，认为 Kimi
              Claw 和 OpenClaw 生态把常驻监控、提示注入、恶意技能，甚至远程代码执行暴露引入了一个中国托管的智能体栈。Hacker News 对 Harmonic
              数据的概述又补上企业端视角：在正式治理到位很久之前，员工未经批准采用 Kimi，可能已经把它带进企业环境。几项风险叠加后，运营风险已横跨正常运行时间、隐私、滥用防控，以及智能体自主性带来的安全后果。
