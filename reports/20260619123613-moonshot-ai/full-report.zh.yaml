    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 按当前公开证据，Moonshot 像一家可投公司，但还不像一只可投证券。
    data:
      nodes:
        - id: r1
          label: 真实变现证据
        - id: r2
          label: 资本获取和现金
        - id: r3
          label: 当前估值偏高
        - id: r4
          label: IPO / 结构风险
        - id: r5
          label: 披露缺口
        - id: r6
          label: 继续研究 / 偏紧
      edges:
