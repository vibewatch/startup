        title: 主要竞争者的产品与能力宽度
        blocks:
          - type: paragraph
            body: >-
              公开产品页显示，多数严肃 Kimi 竞争者如今卖的远不止单一文本模型。DeepSeek 结合聊天、应用、API 和开源研究资产。Z.ai 强调长周期 Agent、移动自动化、多模态和编码发布。Doubao
              的母公司栈横跨文本、代码、视频、图像、语音和实时语音。Baidu Qianfan 进一步延伸到企业 Agent 开发、RAG、搜索、百科工具和可观测性。Qwen 通过 Model Studio
              同时运行自有模型和第三方访问。MiniMax 把代码与 Hailuo 视频、音频和 Talkie 结合起来。放在这个竞争场中，Kimi 自身宽度可信：助手工作流、深度研究、电子表格、幻灯片、编码和 API
              工具，都有公开证据。


              结果是，能力宽度本身不足以成为 Kimi
              的护城河，而是入场券。买家完全可能用多个竞品栈解决类似工作。不同对手之间变化的是编码强度、消费者分发、多模态创作、治理和兼容性的平衡。因此，公开证据薄弱的单元格必须保持未知，比较也应聚焦最影响决策的能力，而不是模糊的“AI
              领导力”宣称。
