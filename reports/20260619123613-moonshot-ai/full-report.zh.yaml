  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Moonshot 的估值敏感性主要由 ARR 规模，以及投资者愿意为前沿稀缺性支付多少溢价驱动。
    data:
      items:
        - label: ARR 增长持续性
          value: 5
        - label: IPO 执行 / 时点
          value: 4
        - label: 毛利质量
          value: 4
        - label: 优先权 / 稀释条款
          value: 3
    approximationNotes: 评分是序数值（1-5 影响），不是概率估计。
    claimRefs:
      - CV005
      - CV007
      - CV031
      - CV043
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 在现有证据下，情景区间说明 Moonshot 更适合放进观察名单，而不是按一个干净价格直接买入。
    data:
      items:
        - label: 熊市
          low: 7.5
          high: 10
          unit: USDb
        - label: 基准
          low: 17.5
          high: 21
          unit: USDb
        - label: 牛市
          low: 27.5
          high: 35
          unit: USDb
    approximationNotes: 区间采用 ARR 和倍数的情景假设，不是 DCF 或只看可比公司的模型。
    claimRefs:
      - CV035
      - CV036
      - CV037
