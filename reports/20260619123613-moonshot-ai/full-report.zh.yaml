      - number: '8.4'
        title: 牛市 / 基准 / 熊市情景和建议
        blocks:
          - type: paragraph
            body: >-
              在现有证据水平下，建议是继续研究，估值立场是偏紧。核心原因在于，只有当 Moonshot 继续极快复合收入，同时成功把监管清理转化为可信的香港上市选项时，$20 billion 估值才守得住。牛市情景下，ARR
              扩至约 $500 million，投资者继续给 55-70x 稀缺性溢价，对应 $27.5-$35 billion 结果。基准情景下，ARR 达到约 $350 million，溢价回落到 50-60x，留下
              $17.5-$21 billion 区间，使今天价格更接近公允而非便宜。熊市情景下，ARR 在 $250 million 附近停滞，随着审查、稀释或需求转弱削弱热情，倍数压缩到 30-40x，对应
              $7.5-$10 billion，并带来实质下行。


              这些情景刻意避免对 IRR 做虚假精确化，因为股权结构和清算优先权栈未知。它们只回答一个更窄的问题：当前估值是否已经计入了大部分好消息？答案是肯定的。Moonshot
              有足够证据留在可投资名单上，但没有足够证据支持在缺少额外尽调的情况下穿透当前价格买入。更积极的立场需要两件事之一：经审计的商业化数据显著强于 4 月 ARR 所暗示的水平，或入场价格显著更好。
