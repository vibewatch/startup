      - number: '2.4'
        title: 增长驱动、价格压缩与监管
        blocks:
          - type: paragraph
            body: >-
              三个驱动最突出。第一，OpenAI 缺席中国大陆，加上 IDC 强调 AI
              主权，为国内替代品创造结构性窗口。第二，中国供应商在更快发布、多模态和生态整合上推进，持续刺激用户试用本土产品。第三，透明的公开价格阶梯让试验成本足够低，能拓宽漏斗顶部。但同一组事实也带来核心约束。DeepSeek
              定价显示，本土价格地板可能远低于 Kimi 标价；Qwen、ERNIE 和其他平台也提供各自兼容 OpenAI 或多模态的替代方案。在客户锁定尚未深入前，这会压缩付费意愿。IDC
              的编码摘录也表达了同一点：采用增长可能快于已实现收入。


              监管又加了一层市场结构。中国 2023 年生成式 AI 办法要求提供者为公共服务管理内容、隐私和安全责任。2025
              年标识规则进一步要求对生成内容和元数据添加显式和隐式标识。相对不支持中国大陆服务的外国服务商，这些规则可以帮助国内供应商，但不是免费护城河。它们抬高合规成本，要求运营控制，并让企业级治理更重要。最后，Caixin
              关于芯片限制的报道显示，计算供给仍是现实约束。因此，Moonshot 所在市场确有需求顺风，但也有集中的价格压力、政策成本和资本强度，限制使用量转化为持久利润率的速度。
