      - number: '5.3'
        title: 开发者平台、架构与服务栈
        blocks:
          - type: paragraph
            body: >-
              Moonshot 公开架构中最重要的技术点是，产品栈不只是模型包装器，而是工作流和系统栈。API 层，Moonshot 暴露兼容 OpenAI 的端点、工具使用、视觉输入、批处理和模型选择指南。应用层，公司推广
              Kimi Code、研究、网站和其他更高层入口。底层公开技术材料显示，其服务和基础设施姿态认真。Mooncake 在论文和代码库中都被描述为以 KVCache 为中心的解耦服务架构：分离 prefill 与
              decode，在 CPU、DRAM 和 SSD 资源之间池化缓存，并提升长上下文工作负载下的请求吞吐量。


              这个服务层重要，因为 Kimi 的产品主张高度依赖长上下文、多步 Agent 和多模态工作流，而这些都吃基础设施。Mooncake 论文和 USENIX 演示报告了很大的吞吐增益和生产规模；开源
              checkpoint-engine 代码库则称，Kimi-K2 权重可在约 20 秒内跨数千块 GPU 更新。因此，架构看起来技术上可信，但也依赖很重：Moonshot 正在构建并贡献一个更广生态，涉及
              GitHub 托管代码库、vLLM 风格部署路径、Hugging Face 模型卡，以及第三方硬件或服务集成。这同时带来杠杆和供应商兼容风险。
