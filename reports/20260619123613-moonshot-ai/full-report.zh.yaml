chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Moonshot AI 的官方网站呈现出一种双重姿态：既想像研究实验室，也想像产品公司。Moonshot 主页用面向 AGI 的语言讲“把能量转化为智能”，关联的 Kimi
              界面则强调代码、深度研究、网站、幻灯片和电子表格等实际用户工作流。这种组合很关键，因为它是主来源能给出的最清晰商业模式概括：Moonshot
              不是靠单一用途应用变现，而是通过消费者助手层和开发者平台，把基础模型能力商业化。平台定价材料记录了基于 token 的 API 计费，也进一步支持这一判断；Kimi Code
              则明确把自己描述为与会员绑定的编码入口。


              创立和地点记录方向清楚，但口径并不完全统一。TechCrunch 报道称，杨植麟在 2023 年与周鑫宇、吴雨欣共同创立 Moonshot AI，多家 2026 年新闻媒体也把公司描述为总部在北京。同时，Kimi
              现行服务条款把新加坡的 Moonshot AI PTE. LTD. 列为服务提供方。因此，最有证据支撑的结论是：Moonshot
              是一家以北京为中心运营、服务侧至少有一个新加坡法律实体的公司，而不是一个总部披露干净单一的主体。后续章节应保留这一细微差别，不要压平成单一司法辖区叙事。
