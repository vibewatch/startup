      - number: '7.3'
        title: 竞争、价格压力和生态依赖可能迅速传导到利润率和客户风险
        blocks:
          - type: paragraph
            body: >-
              Moonshot 所处市场目前奖励快速发布、低定价和生态整合，即便采用势头强，这也是一种高风险运营姿态。CNBC 报道称，中国公司正把用户增长放在基准测试头条之前，Moonshot 也从 K2 到 K2.5
              高速迭代，同时定价低于美国主要对手。Kimi 自己的 API
              模型又把问题放大：成本与输入、输出和工具使用挂钩，因此重智能体工作流即便客户侧价格看起来有吸引力，服务成本也可能很高。开发者分发是优势，也是一层依赖：GitHub 和 Hugging Face
              页面显示，开源发布、公共工具和外部构建者拉力都在快速推进，这会增加维护负担，也提高滥用、故障或不兼容集成传播到 Moonshot
              直接支持边界之外的风险。公开记录也没有披露云服务商或基础设施集中度清单，因此投资者能看到规模证据，却还看不到底层成本基础的韧性，也看不到关键交易对手的集中度。
