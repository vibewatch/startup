      - number: '8.2'
        title: 投资论证与反论证
        blocks:
          - type: paragraph
            body: >-
              正面逻辑很直接。Moonshot 现在有官方定价，有订阅和 API
              变现的报道，有愿意预付算力费用的企业客户，也有足够现金继续训练和商业化，不需要马上紧急融资。这样的组合在中国前沿模型公司中很少见。更重要的是，公司还处在收入曲线较早阶段，如果接下来一年保持类似执行，规模图景可能发生实质变化。相比许多仍躲在产品演示背后的基础模型实验室，Moonshot
              至少已经开始公开投资者想看的商业化触面。


              反论证同样有力。即便接受 4 月 ARR 数据，$20 billion
              标价也意味着一个已经折现多年超高速增长的倍数，并假设上市执行、利润率纪律和客户留存都会兑现，但这些还没有公开证据。监管重组不是表面修饰，而是不利因素。股权结构和优先权栈缺失。公开估值支撑仍部分依赖中国 AI
              IPO 中可见的稀缺性溢价，而不是一套完整披露的基本面账本。因此，正确结论不是「回避」——业务看起来太真实，不能这么处理——而是在估值偏紧的前提下「继续研究」。
