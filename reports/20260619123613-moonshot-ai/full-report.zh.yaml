  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局结构：直接同行、平台巨头与外部参照
        blocks:
          - type: paragraph
            body: >-
              Kimi 不是在一个整齐的单供应商市场竞争。最强的国内同行分成三类且相互重叠。第一类是 DeepSeek、Z.ai/GLM、Qwen、MiniMax 和 Baidu ERNIE 等直接前沿模型对手，争夺
              API、编码和 Agent 工作负载。第二类是 ByteDance、Alibaba、Baidu 和 Tencent
              等母平台巨头，可以把模型与既有消费者、商业、搜索、支付或生产力分发结合起来。第三类是外部参照——OpenAI、Anthropic 和
              Google——即便它们不是中国大陆默认合法选择，买家仍会拿它们来对标质量、包装和价格。


              这种结构重要，因为 Kimi 的强弱取决于比较轴。相对高价美国参照，Kimi 看起来成本有效且本地化。相对 DeepSeek，它可能显得昂贵。相对 Doubao，它在大众市场触达上可能更窄。相对 Baidu 或
              Alibaba，它在公开企业控制和分发上可能更薄。因此，严肃的竞争章节必须同时覆盖直接模型同行，以及那些能比独立实验室更激进地补贴或分发 AI 的相邻生态。
