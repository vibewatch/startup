  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Kimi 的公开旅程从消费者和专业工作流发现开始，随后分流到付费访问、API 使用和面向团队的功能。
    data:
      items:
        - label: 发现消费者
          stage: 发现
          segment: Consumers
          surface: App Store / kimi.com
          signal: Ratings, free use, direct traffic
        - label: 采用专业工作流
          stage: 采用
          segment: Professionals
          surface: Deep Research / Slides / Office workflows
          signal: Role-targeted product copy
        - label: 变现付费用户
          stage: 变现
          segment: Paid consumer members
          surface: In-app purchase / priority use / membership
          signal: Visible paid ladder
        - label: 与开发者共建
          stage: 构建
          segment: Developers
          surface: API / GitHub / Hugging Face / Kimi Code
          signal: Open-source and tool distribution
        - label: 扩张到团队
          stage: 扩张
          segment: Teams
          surface: Business / workspaces / Claw Groups
          signal: Feature scaffolding, not named customer proof
    approximationNotes: 这是方向性工作流图，不是实测转化漏斗。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU005
      - CU006
      - CU022
      - CU024
      - CU032
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: Moonshot 在认知度、使用量和部分变现上有公开证据，但企业留存或集中度证据不足。
    data:
      nodes:
        - label: 认知度
          detail: 中国 AI 应用 Top-5 排名代理指标；网站流量大
        - label: 活跃使用
          detail: 34.15M 月网站访问；190k App Store 评分
        - label: 付费转化
          detail: 优先使用充值、应用内购买、API 定价
        - label: 工作流扩张
          detail: API、Kimi Code、Agent Swarm、工作区
        - label: 企业耐久性缺口
          detail: 公开披露不足
      edges:
        - from: Awareness
          to: Active use
        - from: Active use
          to: Paid conversion
        - from: Paid conversion
          to: Workflow expansion
        - from: Workflow expansion
          to: Enterprise durability gap
    approximationNotes: 前四个阶段有证据支撑。最后阶段刻意保持定性，因为没有找到公开企业 cohort 披露。
    claimRefs:
