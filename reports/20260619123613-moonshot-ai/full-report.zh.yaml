      - number: '4.3'
        title: 资本充足性、融资历史与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Moonshot 的资本故事是公开记录中最强的正面财务信号。TechCrunch 和 SCMP 显示，公司从 2024 年前约 $300 million 的基础，推进到 2024 年超过 $1 billion
              的融资；TechNode 又补充了 2024 年 8 月后续一轮，投后估值超过 $3.3 billion。Caixin 随后报道 2025 年末 Series C 融资 $500
              million，账上现金超过人民币 100 亿元；接着 TechCrunch 在 2026 年 5 月报道，公司以 $20 billion 估值融资 $2 billion，并在六个月内融资 $3.9
              billion。这条曲线强烈暗示，投资者愿意以异常快的节奏，为产品野心和容量扩张同时买单。


              更难的问题是，这个资本基础是足够，而不只是大。Caixin 称，2025 年融资将用于 AI 芯片、K3 开发和商业化；一家前沿模型公司在仍需先于收入投入时，正会这样表述。CnTechPost 和 WSJ
              也显示，Moonshot 仍在重做公司结构，并为潜在香港上市做准备，说明融资策略仍活跃，并未定型。没有公开来源披露月度烧钱、长期云承诺、债务或优先股条款，本章不能把报道现金转成干净的 runway
              数字。因此，最有支撑的答案是有条件的：Moonshot 看起来不缺资本，但仍看起来依赖融资；这种依赖很可能同样落在芯片和基础设施上，而不只是销售和市场。
