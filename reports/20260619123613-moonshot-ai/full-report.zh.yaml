      - number: '5.2'
        title: 模型家族、长上下文历史与能力包装
        blocks:
          - type: paragraph
            body: >-
              Moonshot 的模型家族已有足够内部历史，能看出一条架构主线。早期公开差异点是长上下文，Kimi 在 2023 年已声称具备超大对话窗口。Kimi k1.5 随后标志着偏重推理的强化学习里程碑；K2
              则把家族扩展为 1T 参数 MoE 发布，激活参数 32B、上下文 128K，并具备强 Agentic 基准表现。到当前文档集，K2.5 和 K2.6 把活跃产品线推到 256K 上下文，并强化 Agentic
              编码、多模态和长周期行为；K2.7 Code 则进一步专门面向编码，采用 always-thinking 交互模型，并提供快得多的 HighSpeed 变体。


              Kimi-VL 再次拓宽组合，而不只是延伸文本模型。其公开材料描述了一个 16B 级 MoE VLM，配有 MoonViT 编码器、128K 上下文，并在 OCR、长视频、长文档和 OS-agent
              任务上表现有竞争力。WorldVQA 增加了一个面向抗幻觉视觉世界知识的内部基准资产；这很重要，因为它显示 Moonshot
              在构建模型的同时也在搭建评测基础设施。合在一起，这个组合不像单一前沿模型押注，更像一个为编码、多模态生产力和 Agent 工作流优化的扩张模型栈。
