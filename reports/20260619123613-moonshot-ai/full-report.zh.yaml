        title: 图表资料
        blocks:
          - type: callout
            title: 建议：继续研究
            body: Moonshot 应留在漏斗前端，因为商业化证明和战略稀缺性都是真实的。但当前价格已经假设变现持续复合、IPO 执行顺利。没有数据室，这个前提太重，不能直接承销。
