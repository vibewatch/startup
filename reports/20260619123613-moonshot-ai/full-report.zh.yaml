      - number: '5.4'
        title: 信任、质量、合规与路线图风险
        blocks:
          - type: paragraph
            body: >-
              Moonshot
              的信任包有利有弊。正面看，公司发布了真实政策页面，而不是黑箱：服务条款禁止逆向工程、抓取、滥用自动化、规避安全过滤，以及用服务训练竞争模型；隐私政策描述了加密、备份、监控和事件响应。模型文档还围绕
              reasoning_content、多模态限制和兼容性行为给出异常具体的集成指南，这对开发者是质量信号。发布历史也足够活跃，显示真实产品迭代：从 2024 年的上下文缓存和企业 API，到 2025—2026
              年的 K2、K2 Thinking、K2.5、Agent Swarm、WorldVQA 和 K2.6/K2.7 Code。


              缺口仍然显著。经审阅的公开记录没有披露 SOC 2、ISO 27001、正式 SLA，或采购重的客户常要求的其他企业级保障材料。更重要的是，风险面并不抽象：OECD AI Incidents Monitor
              记录了一起 2026 年涉及 Kimi 的隐私事件，Anthropic 也公开指控 Moonshot 对 Claude
              进行了工业规模蒸馏。这些事件没有抹掉产品栈的技术成熟度，但改变了尽调负担。买家或投资者可以把技术承销为有野心且日益全栈；在获得更多私有证据前，不应把它承销为低摩擦、认证丰富的企业基础设施。
