  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景和当前私募估值
        blocks:
          - type: paragraph
            body: >-
              目前支撑最充分的估值锚，是 TechCrunch 2026 年 5 月报道称 Moonshot 以 $20 billion 估值融资约 $2 billion。该文还称，公司在此前六个月融资 $3.9
              billion，并在 4 月把 ARR 推到 $200 million 以上，这足以解释为什么投资者把 Moonshot 视为中国开源权重前沿实验室中商业化最强的一家。CnTechPost 补充了更早的 3
              月数据点：K2.5 发布一个月后，ARR 已超过 $100 million；Caixin 则称，Moonshot 在 $500 million Series C 后，于 2025 年底持有超过 10
              billion yuan 现金。合在一起看，这段融资历史不像一串救急轮次，更像一家公司反复把技术动能转化为一级市场资本。


              但这个估值锚的结构仍然脆弱。The Wall Street Journal 报道称，Moonshot 在更高审查压力下筹备香港上市时，曾讨论过约 $18 billion 的融资；CnTechPost
              称，公司正在拆除红筹结构，因为保住 VIE 豁免的可能性看起来很低。这些报道重要，因为在 $20 billion 估值上，Moonshot 已不再像一家有信息缺口的高速增长私营 SaaS
              公司被定价，而是像一个战略资本市场资产被定价。因此，这个估值或许说得通，但前提是商业化和 IPO 执行的下一章能按时到来。
