      - number: '1.2'
        title: 领导层可见度、治理与阶段
        blocks:
          - type: paragraph
            body: >-
              公开领导层披露高度集中在创始人杨植麟身上。第三方报道反复把他置于创始人和公众面孔的位置，最有实质内容的个人资料也聚焦他的学术和研究履历，包括曾在 Meta AI 和 Google Brain 工作。SCMP
              还提供了一个有用的战略框架：引用杨植麟希望结合 OpenAI 式技术理想主义和 ByteDance
              式商业纪律的愿景。公开记录没有提供的内容几乎同样重要：主公司界面没有经核验的董事会名单，没有投资者关系页面，也没有清楚披露的财务负责人或更广泛高管梯队。仅靠公开材料评估继任深度、委员会结构或财务控制时，这些缺口会显著增加治理尽调难度。


              阶段判断比治理判断更容易。到 2026 年，Moonshot AI 显然已不是种子期实验，也不是前产品实验室。公司已完成多轮后期融资，持续推广反复出现的产品入口，媒体也已围绕估值、ARR 和 IPO
              时间表来报道。最稳妥的标签是：处于商业化模式的后期私有基础模型公司。这个判断足以支撑下游分析，但还不足以无保留地统一具体融资轮次分类，因为公开记录在不同时间点同时出现 Series B、追加融资和 Series
              C 等表述。
