    columns: [Alternative, "Public list price", Unit, "Contract / packaging model", "Included capability", "Underwriting implication"]
    rows:
      - [Lightmatter, Unknown, "No comparable unit disclosed", Unknown, "Passage interconnect and Guide laser-engine scope", "Request price per bandwidth tier, qualification cost, and committed-volume schedule"]
      - [Ayar Labs, Unknown, "No comparable unit disclosed", Unknown, "Photonic I/O", "Request equivalent port, bandwidth, power, and volume quote"]
      - [Celestial AI, Unknown, "No comparable unit disclosed", "Post-acquisition model unknown", "Photonic Fabric", "Confirm roadmap ownership and bundled economics after acquisition"]
      - [NVIDIA, "Unknown in assigned evidence", "No like-for-like optical unit", "Integrated-platform model not evidenced here", "Accelerator, networking, and software ecosystem", "Compare total-cluster economics rather than isolated component price"]
