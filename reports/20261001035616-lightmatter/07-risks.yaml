    - type: "private-evidence-only"
      severity: "material"
      topic: "commercial-verification"
      missingEvidence: "Named production customers, binding purchase commitments, shipments, recognized revenue, customer concentration, and deployment acceptance evidence."
      whyItMatters: "Sampling does not establish production adoption, and commercial conversion is the principal support needed for the financing valuation."
      diligencePath: "Request customer-level backlog and shipment schedules, redacted contracts, acceptance milestones, revenue recognition, renewal or expansion evidence, and references."
