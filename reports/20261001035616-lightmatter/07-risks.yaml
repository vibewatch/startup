            - label: "High"
              detail: "Volume conversion is central to supporting the last-round valuation."
            - label: "Early"
              detail: "A product leader and customer sampling are visible; signed volume proof is not."
        - label: "Manufacturing test and yield"
          values:
            - label: "Elevated"
