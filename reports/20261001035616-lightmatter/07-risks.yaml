callouts:
  - calloutType: "risk"
    title: "Production evidence is the gating catalyst"
    body: "The highest-value diligence item is a production evidence package: named customer acceptance, committed volume, shipment and revenue recognition, qualification results, yield, field reliability, and gross-margin bridge. Sampling and specifications are useful milestones but do not establish durable commercial deployment."
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR004"
      - "CR014"
      - "CR015"
  - calloutType: "recommendation"
    title: "Monitorable thesis-break triggers"
    body: "Treat a missed customer qualification plan, inability to disclose acceptable yield and reliability, loss of a critical manufacturing path without an approved alternate, or a new financing before volume proof on opaque terms as thesis-break triggers. Confirm thresholds and dates directly with management because the public sources do not quantify them."
    claimRefs:
      - "CR003"
      - "CR011"
      - "CR014"
      - "CR015"
