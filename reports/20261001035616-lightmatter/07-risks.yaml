      severity: "material"
      topic: "manufacturing-reliability"
      missingEvidence: "Volume yield, defect and rework rates, test coverage, burn-in, MTBF, thermal drift, optical-loss distributions, returns, capacity, unit cost, and second-source qualification."
      whyItMatters: "The public evidence identifies a novel combined-stack test challenge but provides no denominator for manufacturability or field quality."
      diligencePath: "Review qualification reports and lot-level dashboards with operations leaders, then corroborate capacity, yield, and quality metrics with manufacturing partners and customers."
      relatedQuestionRefs:
