      whyItMatters: "Without primary records, neither compliance nor the absence of enforcement and litigation can be established."
      diligencePath: "Obtain counsel memoranda and company schedules, then verify them against BIS and other regulator databases, court dockets, patent records, licenses, and dispute correspondence."
