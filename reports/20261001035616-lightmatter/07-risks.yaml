              detail: "The company is private and commercial financial disclosure is limited."
            - label: "High"
              detail: "A new round before volume proof could create valuation and preference risk."
            - label: "Partial"
              detail: "Funding history is visible, but cash, burn, runway, and terms are not."
    approximationNotes: "The matrix uses ordinal analyst judgments rather than measured probabilities; 'unknown' and 'not evidenced' preserve missing denominators and unavailable mitigation data."
