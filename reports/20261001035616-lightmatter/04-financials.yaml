    title: "Runway Cannot Be Inferred from Funding Raised"
    body: "The visible financing history establishes access to equity capital, but it does not disclose current cash, burn, debt, capex commitments, or runway. Underwriting should remain conditional on a current balance sheet, cash-flow bridge, and product-level margin evidence."
    claimRefs:
      - "CI003"
      - "CI015"
