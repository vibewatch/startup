        - label: "Customer sampling"
          detail: "Guide was described as sampling with customers in April 2026."
        - label: "Qualification and testing"
          detail: "High-volume photonic/electronic stack testing remains an execution requirement."
        - label: "Volume deployment"
          detail: "Company states Passage and Guide are being scaled toward volume deployment; shipment volume is undisclosed."
        - label: "Recognized revenue"
          detail: "Price, acceptance, recognition policy, and audited revenue are unavailable."
        - label: "Gross profit"
          detail: "Fabrication, packaging, yield, testing, warranty, and service costs are unavailable."
    approximationNotes: "Ordered diligence bridge, not a reported conversion funnel; no conversion rates or financial values are inferred."
    claimRefs:
