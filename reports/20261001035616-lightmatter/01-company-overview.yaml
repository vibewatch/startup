company:
  name: "Lightmatter"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Lightmatter is a 2017-founded, Mountain View-based photonics company whose public positioning now centers on Passage interconnects and Guide light engines for AI infrastructure. Its latest consistently reported financing benchmark is the October 2024 $400 million Series D at a $4.4 billion valuation and $850 million total funding, while revenue, customer volume, board composition, and production-scale deployment remain material diligence gaps."
sections:
  - id: "identity-and-business-model"
    title: "Identity, operating stage, and business model"
    body: >-
      Independent profiles identify Lightmatter as a 2017-founded company created by Nicholas
      Harris, Darius Bunandar, and Thomas Graham, while the company site lists its headquarters
      at 250 Bryant Street in Mountain View, California. Lightmatter describes Passage as its
      photonic interconnect platform and Guide as its large-scale light-engine platform, both
      aimed at moving data among processors and switches in AI infrastructure. This is a
      component-and-platform hardware model rather than a disclosed recurring-software model:
      the retained materials emphasize photonic chips, reference platforms, integration, and
      manufacturing partners, but do not provide pricing, revenue mix, gross margin, or contracted
      unit volumes. The company is therefore best treated as a late-stage, Series D semiconductor
      platform whose commercial economics remain private, not as a revenue-validated infrastructure
      supplier.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO015"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "financing-and-milestones"
    title: "Financing history, investors, and milestone progression"
    body: >-
      The retained evidence shows a sharp valuation progression: an independent company profile
      records a $154 million Series C in May 2023 at a $720 million post-money valuation, followed
      by $155 million in December 2023 at a $1.2 billion post-money valuation. Lightmatter's site
      and two independent profiles converge on the later benchmark of a $400 million Series D in
      October 2024, a $4.4 billion valuation, and $850 million of total funding. T. Rowe Price led
      the Series D, with Fidelity, Viking Global, Lockheed Martin, and GV named as participants in
      an independent CEO interview. One directory page also displays a conflicting $1.6 billion
      total-raised headline while its own FAQ says $850 million, so $850 million is retained as
      the corroborated figure and the discrepancy is flagged rather than averaged or silently
      reconciled.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO014"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "leadership-and-governance"
    title: "Leadership coverage and governance gaps"
    body: >-
      Nicholas Harris remains the co-founder and chief executive identified across the independent
      profiles. The retained directory evidence also names co-founder Thomas Graham as Head of
      Machine Learning and Simona Jankowski as chief financial officer, although it does not provide
      primary biographies or a complete current executive roster. In April 2026, a Lightmatter-issued
      release announced Roy Kim as vice president of product after product leadership roles at Google,
      AMD, and NVIDIA; this adds commercialization experience but remains a company-issued account.
      Publicly retained materials do not establish the board's membership, investor observer rights,
      founder voting control, succession plan, or the current operating role of co-founder Darius
      Bunandar. These omissions prevent a reliable assessment of formal governance and make CEO and
      specialist-technical dependence a diligence question rather than a quantified conclusion.
    claimRefs:
      - "CO001"
      - "CO009"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "scale-and-commercial-proof"
    title: "Current scale signals and limits of public commercial proof"
    body: >-
      Product cadence accelerated in 2026 according to company-issued material: Guide was described
      as introduced in January and sampling with customers, Passage L20 was announced in March, Roy
      Kim joined in April, and an independent CEO interview reported NVIDIA NVLink Fusion ecosystem
      participation in June. These are relevant readiness signals, but sampling and ecosystem
      membership are not equivalent to recognized revenue or production commitments. Tracxn lists
      372 employees "as of Aug 26" without stating the year in the fetched text, so the figure is
      retained only as a qualified third-party estimate. Built In Boston's explicitly AI-generated
      summary says commercial traction is hard to verify and revenue is undisclosed. An anonymous
      Reddit commenter claiming former employment is more critical, but that anecdote is low-confidence
      adverse evidence rather than proof that Lightmatter has no sales or viable product.
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO015"
    tableRefs: []
    figureRefs: []
