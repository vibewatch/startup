callouts:
  - calloutType: "insight"
    title: "Strategic Architectural Realignment from Compute to Interconnect"
    body: "Lightmatter's commercial repositioning away from optical tensor computing (Envise) toward optical networking (Passage) represents a pragmatic adaptation to hyperscale AI physics. While optical computing faced insurmountable noise, precision, and software toolchain barriers compared to digital GPUs, optical interconnect solves the physical shoreline bottleneck that all digital compute accelerators inevitably confront."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE013"
  - calloutType: "risk"
    title: "Co-Packaged Optics Manufacturing and Testing Yield Hurdle"
    body: "Evaluating overlapping stacks of photonics and electronic silicon simultaneously remains an unsolved manufacturing bottleneck across the semiconductor industry. Combining 34 chiplets onto a 4,000 mm² optical interposer introduces severe compounding yield exposure, where any single defect in the optical waveguide or electronic bonding layer threatens the entire multi-thousand-dollar package."
    claimRefs:
      - "CE003"
      - "CE012"
      - "CE014"
      - "CE015"
