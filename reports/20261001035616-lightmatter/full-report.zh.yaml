      - number: '2.4'
        title: 结构性落地阻力、CUDA 护城河与验证缺口
        blocks:
          - type: paragraph
            body: >-
              尽管具备出色的理论能耗与带宽优势，Lightmatter 在走向主流市场时仍面临严峻的结构性壁垒。业界最坚固的竞争壁垒依然是 NVIDIA 的专有 CUDA
              计算平台和根深蒂固的软件生态。企业级机器学习团队和云端软件开发者极度排斥非标硬件架构，不愿引入定制编译器工具链或 Lightmatter Idiom 这类专有
              SDK。行业分析估计，在更广阔的新兴加速器领域中，Lightmatter 当前的商业化市场份额不足 1%。此外，在商业晶圆级别量产 3D
              堆叠硅光芯片面临前所未有的封装复杂度，要求先进制程晶圆代工厂与专业光学组装厂之间实现严丝合缝的协同制造。尽调视角下，最核心的投资脆弱点在于完全缺乏经过核实的公开量产客户合同、已官宣的超大规模云厂商中标方案（Design
              Wins）以及经审计的财务数据。虽然官方宣传材料重点展示了深度送样合作以及 Google Ventures 和 Fidelity
              的战略参投，但确认性尽调必须看到确凿证据，证明一线运营商已经签署批量采购订单，而不仅停留在探索性研发测试阶段。
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM014
