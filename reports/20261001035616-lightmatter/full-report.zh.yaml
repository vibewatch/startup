      - number: '3.3'
        title: 采购经济性、分销与客户锁定
        blocks:
          - type: paragraph
            body: >-
              公开定价是最薄弱的对比维度：现有资料均未提供可比的单端口、单带宽单位、单封装、单机架或多年期合同价格。采购方必须先比对架构与集成负担，才能进一步核算总拥有成本。行业巨头坐拥显著的分销防御壁垒，成熟软件与生态支持大幅降低了客户验证和切换风险。Lightmatter
              则以直连超大规模云厂商、GPU 公司及 ASIC
              设计商来应对，但这仅属公司单方声明，缺乏已披露的合同证据支撑。在评估阶段，客户完全可能多方押注（Multi-homing）；只有核实了接口规范、准入归属权以及承诺采购量条款之后，才能真正确认持久的客户锁定效应。
