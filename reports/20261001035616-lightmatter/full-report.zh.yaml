      - number: '2.3'
        title: 客户分层、生态协同与 NVLink 集成
        blocks:
          - type: paragraph
            body: >-
              受制于不同的预算审批权限与集成门槛，各级企业客户对硅光子技术的采购诉求差异显著。第一类核心客群为 Microsoft、Google、AWS 和 Meta
              等一线超大规模云厂商。这类客户的采购决策由中央云基础设施高管把控，核心诉求是突破散热功耗瓶颈以及阻碍集群扩容的局部变电站供电上限。第二类目标客群包括商用半导体芯片厂商和定制 AI ASIC
              开发者，他们希望在封装层集成 Passage，利用多芯片拼接来突破光刻掩模版尺寸限制。为加快市场集成并避免行业标准碎片化，Lightmatter 于 2026 年 6 月加入 NVIDIA NVLink
              Fusion 生态，并接入 Open CPX 多源协议（MSA）。与此同时，任命前 Google 和 AMD AI 基础设施负责人 Roy Kim 担任产品副总裁，释放出明确的商业化信号：推动 Passage 与
              Guide 从定制工程样件向标准化、可部署的数据中心组件转型。接入成熟芯片生态后，Lightmatter 无需客户重构底层加速芯片，即可直接满足超大规模云厂商在 Scale-up 网络上的扩容需求。
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
