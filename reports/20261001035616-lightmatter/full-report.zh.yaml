  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争边界
        blocks:
          - type: paragraph
            body: >-
              相关市场的范围远超一份单纯的光子学初创公司名录。Tracxn 将 Ayar Labs、Celestial AI、NVIDIA 和 Graphcore 归入 Lightmatter
              的竞争阵营；一份独立技术综述则按架构重心区分了各家专精厂商：Passage 主攻互连，Ayar 聚焦光子 I/O，Celestial 侧重面向内存的 Photonic Fabric，Lightelligence
              则结合光计算与光互连。在短距离传输上，铜缆和自研内部系统设计依然占据主流地位，并非已退出舞台的无关对手。这导致三场竞赛同时打响：垂直光引擎厂商角逐、成熟加速卡与网络平台守擂，以及客户自研架构——后者宁愿推迟采用光学方案，直至机架级经济性与可靠性得到验证。
            claimRefs:
              - CP001
              - CP002
              - CP003
