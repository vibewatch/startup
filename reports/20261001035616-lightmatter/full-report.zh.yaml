  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 概率信号
      - 核心运营假设
      - 估值 / 回报逻辑
      - 下行情景与否决触发条件
    rows:
      - - 乐观情景：成为超大规模云厂商互连标准
        - 低 (15-20%)
        - Passage 与 Guide 在两家主要 Tier-1 云提供商处斩获规模化 Design-Win；到 2028 年实现 $500M+ 收入运行率
        - 凭借主流 AI 基础设施护城河享受估值倍数扩张；退出估值达 $12B-$15B（D 轮的 2.7x-3.4x）
        - TSMC 3DIC 封装良率受挫；超大规模云厂商取消试点项目
      - - 基准情景：细分市场共封装光学部署
        - 中 (50-55%)
        - 在专用 AI 集群中实现适度商业化落地；在铜线激烈竞争下，到 2028 年收入达 $100M-$200M
        - 估值持平至温和增长，达 $4.0B-$5.5B（D 轮的 0.9x-1.2x）；私募持有期延长
        - 超大规模云厂商自研光互连方案，绕过第三方硅光器件
      - - 悲观情景：封装良率受阻与市场推迟
        - 中 (25-30%)
        - 规模化制造推迟、单位生产成本高企及冗长的客户评估周期消耗资金
        - 折价融资或资本重组，估值降至 $1.5B-$2.5B（较 D 轮折让 40-65%）
        - 商业化规模前现金跑道耗尽；关键光学工程领导层流失
      - - 极端下行情景：技术淘汰 / 低价并购清算
        - 低 (5%)
        - 电互连方案延长生命周期；自研专有光引擎未能成为行业标准
        - 陷入困境的知识产权收购或低于累计 $850M 实缴资本的资产出售 ($400M-$700M)
        - Broadcom/Nvidia 专有互连标准将独立商用光引擎初创公司排除在外
    notes: 情景估值倍数与收入预测系作者根据历史 AI 硬件估值倍数分布及硬件爬坡周期测算。
