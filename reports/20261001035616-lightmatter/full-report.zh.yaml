      - number: '5.4'
        title: 展示项
        blocks:
          - type: callout
            title: 从计算向互连的战略架构重组
            body: >-
              Lightmatter 从光学张量计算（Envise）转向光网络（Passage）的商业重塑，是对超大规模 AI 底层物理规律的务实顺应。与数字 GPU
              相比，光计算在噪声控制、计算精度及软件工具链上面临难以逾越的高墙；光互连则正中靶心，精准攻克了所有数字计算加速卡都无法避开的封装边缘物理限制。
            calloutType: insight
