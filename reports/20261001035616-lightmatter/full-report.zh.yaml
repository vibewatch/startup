      - number: '5.2'
        title: 子系统规格、模块化产品与封装集成
        blocks:
          - type: paragraph
            body: >-
              公司硬件产品组合涵盖多个专用光学子组件与模块化产品梯队，旨在契合超大规模云厂商不断演进的封装流程。旗舰级 Passage M1000 超级芯片配置可在 4,000 mm² 等效光子衬底上集成多达 34
              颗异构计算小芯片，在 1,024 条 SerDes 通道上实现 114 Tbps 双向互连带宽。针对近封装光学（NPO）与板载光学收发模组，Lightmatter 推出了 Passage L20 引擎，可提供
              6.4 Tbps 光学吞吐能力，并利用双向波分复用技术将所需光纤数量减少一半。光学物理连接借助专有 vClick 可插拔光纤阵列单元实现，其插损低于 1.5
              dB，便于模块化装配与现场返工维护。在散热与激光器可靠性上，公司选择将激光产生与计算封装分离：Guide VLSP 引擎从机箱的可维护位置输出，单模块可提供高达 51.2 Tbps
              的光载波功率。为实现规模化量产，Lightmatter 与创意电子（GUC）建立战略合作，将 ASIC 设计服务与先进 3D 封装流程相结合；同时联合 Celestica、Dell 和 Qualcomm
              在开放计算项目（OCP）中共同发起开放 AI 系统硅光技术倡议，推动共封装光互连机架蓝图标准化。
