      - number: '7.4'
        title: 资本敞口、监控指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              累计融资不等于可用现金。Tracxn 记录公司经历 10 轮融资累计筹集 $850 million，多方信源均证实 2024 年 10 月的 D 轮融资为 $400 million、估值 $4.4
              billion；但指定证据未提供任何烧钱速度、现金跑道、毛利率、营运资金、负债、清算优先权或账面现金数据。二级市场平台上 Public 给出的 $84.19 估计价，以及 Forge 标出的 $84.48
              股价（对应模型测算估值 $4.63
              billion），纯属平台估算，绝非经审计的企业价值或真实流动性。一旦出现以下情形，投资逻辑即告破裂：客户送样未能转化为可独立核实的规模化量产、认证可靠性未达客户指标，或者在尚未达成上述节点前以不透明条款强行开启新一轮融资。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 量产证据是决定性的核心催化剂
            body: 最具决策价值的尽调标的，在于一套完整量产证据链：具名客户验收报告、承诺采购量、发货与收入确认单、准入验证结果、良率、现场可靠性以及毛利率拆解桥接。送样与技术规格属于重要阶段进展，但不能等同于稳固的商业化落地。
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR014
              - CR015
          - type: callout
            title: 可监控的逻辑破裂触发信号
            body: >-
              应将以下信号视为投资逻辑破裂的触发红线：未能达成客户准入验证节点、无法出具令人满意的良率与可靠性指标、关键制造产线受阻且缺乏备用替代方案，或在尚未取得量产验证前以不透明条款强行融资。由于公开渠道未量化具体指标与交付时间表，必须与管理层当面核对。
            calloutType: recommendation
            claimRefs:
              - CR003
