  - id: FE001
    title: Lightmatter 光互连技术栈
    type: stack
    summary: 采用硅光技术连接分布式 AI 计算集群的集成硬件层。
    data:
      layers:
        - label: 计算与交换芯片层
          detail: 异构电子晶片，涵盖 GPU、定制 XPU 及数据中心交换机 ASIC
          items:
            - 每颗 M1000 超级芯片集成 34 个异构小芯片
            - 1,024 个高速 SerDes 电接口
            - 借助 GUC 合作开发定制超大规模云厂商 ASIC
        - label: 光学中介层 (Passage)
          detail: 提供密集光通信架构的 3D 堆叠硅光衬底
          items:
            - 4,000 mm² 等效光学中介层衬底
            - 114 Tbps 双向光通信总带宽
            - 芯片间直接光交换与波导互连
        - label: 光耦合与互连连接层 (vClick 与 L20)
          detail: 近封装光学引擎与精密可插拔光纤接口
          items:
            - 插损 <1.5 dB 的 vClick 可插拔光连接器
            - 具备双向复用能力的 Passage L20 6.4 Tbps 光引擎
            - 亚微米级精密光纤带耦合
        - label: 光功率发生层 (Guide VLSP)
          detail: 机箱外置连续波激光光源引擎
          items:
            - 单模块支持高达 51.2 Tbps 带宽的 Guide VLSP
            - GuideDR 现场可更换多波长激光器模块
            - 保护激光器免受 100°C+ 计算结温影响的热隔离设计
        - label: 系统标准与机架集成层
          detail: 生态协议与模块化机架机械规范
          items:
            - OCP 面向 AI 系统的开放硅光参考架构
            - 符合 MHS 及 Open Rack v3 (ORv3) 标准的模块化机架设计
            - 从 72 节点平滑扩展至 1,024+ 节点的互操作多节点集群
        - label: 光子工艺与代工层
