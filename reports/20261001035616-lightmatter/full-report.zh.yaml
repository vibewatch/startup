        title: 产品范围与竞争规模
        blocks:
          - type: paragraph
            body: >-
              在指定资料中，Lightmatter 展现出的战略广度非同寻常。公司将商业化重点从 Envise 光计算转移到 Passage 互连，同时引入 Guide 补齐激光引擎；官方通告称 Guide 单模块正以
              51.2 Tbps 进行客户送样测试，L20 单向提供 6.4 Tbps 带宽。单靠资金无法决出胜负：Tracxn 显示 Lightmatter 累计融资 $850 million，相比之下 Ayar Labs
              为 $1.02 billion，Celestial AI 为 $589 million；Graphcore 的遭遇更说明高额融资无法避免被收购的命运。Lightmatter
              由此获得了平台覆盖广度优势，但现有证据尚未证明这种广度已经转化为领先的规模化量产交付。
