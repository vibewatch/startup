      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 超大规模算力中的光互连转型
            body: >-
              当 AI 模型规模迈入万亿参数级，传统铜互连在物理带宽密度与散热极限上面临无法逾越的高墙。Lightmatter 的 Passage 平台通过光纤替代电线直击这一痛点，但规模落地仍取决于与 OSAT
              伙伴长达数年的共封装准入认证。
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU011
          - type: callout
            title: 商业化落地与量产定点信息缺乏透明度
            body: >-
              尽管斩获 $850 million 风险投资并与 NVIDIA 达成生态合作，Lightmatter
              至今未公开任何一家规模量产客户名单，也未披露任何财务收入数据。在一线超大规模云厂商的方案中标获得确凿验证前，投资人必须将其实际商业进展视为量产前的样品测试阶段。
            calloutType: risk
            claimRefs:
              - CU003
              - CU005
              - CU008
              - CU009
              - CU010
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资后果
        blocks:
          - type: paragraph
            body: >-
              商业准入认证是当前最高的残余风险。Lightmatter 称 Guide 正在面向客户送样，并聘请产品高管推动各平台走向规模化量产部署；然而 Built In 明确标为 AI
              生成的综述指出，大规模部署极难证实且收入未曾公开。Forge 也将相关产品定性为仍处成熟期，并表示无法保证能实现规模化采纳。这些观察并不代表商业化失败，而是表明公开证据离量产佐证仍有一步之遥。以最新披露的
              $4.4 billion 融资估值衡量，准入认证延期或量产转化乏力将对投资逻辑造成极其严重的打击。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR007
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR007
