  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场分类与边界：光互连路线转型
        blocks:
          - type: paragraph
            body: >-
              光计算的目标市场已从根本上分化为两条路径：独立光计算处理器与晶圆级光互连网络。Lightmatter 在 2017 年作为 MIT 衍生企业成立时，最初的商业化重心是
              Envise——一款旨在利用光计算核心加速稠密矩阵乘法的光子处理器。然而在 2021 至 2023 年间，基于 Transformer
              的大语言模型爆发式增长，将底层基础设施的主要瓶颈从片上算术计算转移到了芯片间的数据搬运。在分布式 AI
              训练与高并发推理集群中，传统铜线互连受制于物理规律，在传输距离、信号衰减和引脚引出密度上遭遇严峻瓶颈。Lightmatter 随即将核心商业化战略转向 Passage：这是一种 3D
              堆叠硅光子中介层，能够把异构处理器互连为统一的 Scale-up 算力域。与 Passage 互补的则是
              Guide——一种专有外置激光子系统，专门负责向高密度光纤阵列提供光功率。该架构将公司的可服务市场边界明确锁定在 Scale-up
              互连网络与共封装光引擎（CPO）领域，排除了同质化的机架间无源铜缆、传统电子交换机以及通用处理器插槽。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM011
      - number: '2.2'
        title: 市场规模测算视角：从算力加速卡资本支出到光引擎
        blocks:
          - type: paragraph
            body: >-
              测算该市场空间，需要把宏观 AI 资本支出拆成可触达的网络与光学器件市场。先看整体投入：超大规模云厂商与专业企业建设方每年向加速计算基础设施投入数百亿美元，行业追踪数据显示全球加速卡支出超过
              $150B。当集群规模扩大到数万颗 XPU 时，网络与互连架构在集群总资本支出中所占比例持续上升，从历史上约 10% 到 20% 的常规水平迈向系统总投资的 30%
              以上。在这一波资本开支浪潮中，由于传统铜线在单通道 200Gbps 和 400Gbps 速率下触及物理传输距离极限，先进光互连、近封装光学与共封装光引擎的实际可服务市场预计将达到
              $4.5B。Lightmatter 在 2024 年 10 月完成 $400M D 轮融资后，一级市场估值跃升至 $4.4B，背后有 $850M
              累计私募资本支持。虽然第三方私募股权数据库根据人均创收模型测算其年化收入运行率为 $116.1M，但这纯属合成测算，并非经审计的实际商业收入。Lightmatter
              当期可获取市场的核心切入点，集中在超大规模云厂商光中介层送样与定制 ASIC 联合设计构成的 $1.2B 初期滩头阵地。
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
              - CM012
