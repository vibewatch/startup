              - CV015
      - number: '8.2'
        title: 投资逻辑与反向逻辑框架
        blocks:
          - type: paragraph
            body: >-
              Lightmatter 的核心投资逻辑立足于现代 AI
              基础设施的物理瓶颈。当集群规模扩大至数万颗加速芯片时，传统铜缆互连与电子交换机遭遇严重的散热、功耗及带宽密度天花板，可能导致算力扩展停滞。Lightmatter 的 Passage 光互连平台与 Guide
              超大规模光子引擎提供了专有光学网络，旨在以微秒级延迟和突破性的能效将处理器串联起来。反向逻辑则直指关键的工程执行与市场竞争风险：共封装光学引入了极高的封装复杂度，严重依赖组装良率向来偏低的多芯片集成技术；与此同时，半导体巨头正通过先进数字信号处理器（DSP）不断延长电互连的生命周期。2026
              年 4 月聘请前 Google AI 基础设施主管 Roy Kim 领导产品落地展现了商业化意图，但规模化出货的落地证据仍未得到证实。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: 融资背景与多情景估值推演
        blocks:
          - type: paragraph
            body: >-
              Lightmatter 展现出卓越的资本吸纳能力，从 Google Ventures、Fidelity Investments、Viking Global 以及 T. Rowe Price
              等顶级风投和公募巨头手中，历经 10 轮融资累计获得约 $850 million 资金。在 2024 年底斩获 $400 million D 轮融资之前，公司于 2023 年 5 月完成 $154 million
              C 轮融资，用于打磨软硬件技术栈。为评估当前入场价位的潜在回报特征，我们构建了三套概率性经营情景：在乐观情景下，Passage 成为多家云服务商通用的行业标杆光互连方案，到 2028 年退出估值有望达到 $12
              billion 至 $15 billion；基准情景预计公司将在特定垂直场景实现小规模部署并产生温和收入，估值大致稳定在 $4.0 billion 到 $5.5 billion
              之间；悲观情景则对应封装良率瓶颈与认证周期拉长，可能迫使公司以 $1.5 billion 至 $2.5 billion 估值进行折价重组融资（Down-round）。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 退出就绪度、流动性约束与尽调诉求
        blocks:
          - type: paragraph
            body: >-
              拟通过二级市场平台配置 Pre-IPO 份额的机构投资者面临着实质性的结构性障碍。Lightmatter
              股份在二级市场的交投极度缺乏流动性，受到公司股权转让限制、优先购买权（ROFR）机制以及交易执行拖延的多重约束。公司尚未宣布任何 IPO
              时间表、秘密递表文件或正式承销团接洽。此外，散户及私人财富通过特殊目的载体（SPV）配置份额，往往需要承担层层费用，且完全不附带治理权或知情权。鉴于一级市场估值已经预先计入了建立在假设规模之上的溢价倍数，当前介入
              Pre-IPO 投资的风险收益比极为不对称。在建立投资头寸前，审慎尽调必须核实三大核心催化指标：一线超大规模云厂商数百万美元量级的确认采购订单、台积电 TSMC 3DIC
              光学封装经核实的代工良率数据，以及单体经济模型中证明毛利率能持续高于常规硬件基准的盈利能力。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 保持严谨的观察立场
            body: 在超大规模量产合同与封装良率获得实际验证前，建议对 Lightmatter 维持“观察”（Track）评级，规避已计入完美预期的一级半市场溢价。
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
          - type: callout
            title: 二级市场流动性锁定风险
            body: 认购 Pre-IPO 老股面临严峻的流动性风险、苛刻的转让审批限制，且在财务数据未公开披露的前提下面临不明朗的 IPO 时间表。
            calloutType: risk
            claimRefs:
              - CV005
              - CV010
