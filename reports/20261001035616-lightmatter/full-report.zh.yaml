      - number: '7.2'
        title: 制造、质量与执行风险敞口
        blocks:
          - type: paragraph
            body: >-
              实际经营挑战远非在受控演示中展现光子性能那么简单。在 2026 年的一次专访中，Lightmatter 的 CEO
              披露了与台湾供应链开展的大规模量产协同，并提到了针对光电重叠堆叠开发的新测试方案，同时坦言这种光电混合测试难题尚未彻底解决。公司官方资料罗列了送样状态、带宽和插损指标，但在指定资料中完全找不到制造良率、老化测试（Burn-in）、现场故障率、退货率或平均无故障时间（MTBF）数据。一个声称曾就职该公司的
              Reddit 匿名账号还爆料称，公司历史上曾频繁推翻设计方案，且非光学领域的工程执行力孱弱；这属于反向参考背景，并非经核实的公司证据，需要结合专家访谈与运营数据做进一步求证。
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR015
          - type: table
            tableRef: TR002
