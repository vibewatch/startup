              当前最明确的经营信号来自公司官方通告：Guide 正在面向客户送样，且已任命产品高管带队推进全球部署 [CI006, CI007]。一份高管访谈透露公司正与超大规模云厂商、GPU 厂商及 ASIC
              公司展开合作，但同时坦言，要实现大批量量产，就需要针对光电重叠堆叠开发全新的测试流程 [CI008]。相较于泛泛的客户意向，准入验证进度、良率、封装成本、质保负担以及实际出货量才是更具决策价值的指标。LeadIQ
              给出了 $100 million 至 $250 million 的收入区间，但抓取页面未提供任何对应会计区间、统计方法或财务报表佐证 [CI009]。该测算绝不能等同于经审计的实际收入、ARR
              或年化运行率。现有资料均未披露实际成交价、毛利率、CAC、回本周期、销售周期、客户集中度或营运资金条款，因此无法据此评估销售效率与边际贡献。
