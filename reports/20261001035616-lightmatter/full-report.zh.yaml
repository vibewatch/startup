  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与架构重心转型
        blocks:
          - type: paragraph
            body: >-
              Lightmatter 提供高密度光互连平台，旨在消除分布式 AI 计算集群中的数据传输瓶颈。作为一家源自 MIT 的初创公司，其早期曾通过 Envise 张量处理器探索模拟光计算；2021 至 2023
              年间，当前沿 AI 训练模型将芯片间带宽推向核心扩展瓶颈时，公司果断实施战略转型，全面押注互连解决方案。其旗舰硬件产品 Passage 是一种 3D
              堆叠硅光子中介层平台，专门用于突破传统芯片电气封装边缘（Shoreline）的物理限制。Passage 将 GPU、定制 XPU
              及高基数交换芯片等电算小芯片垂直耦合至光通信基底，赋予多芯片模组接近单芯片级的互连延迟与数 Tbps 级的带宽密度。与 Passage 协同的 Guide
              则是外置超大规模光子（VLSP）光引擎，专门为共封装光学（CPO）架构输送大功率光载波信道，避免热敏激光器直接承受来自高温计算裸片的炙烤。两套系统结合，为超大规模云厂商和 ASIC
              开发者提供了模块化光通信背板，旨在将集群 Scale-up 域扩展至多个计算机架。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE011
