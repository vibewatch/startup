      - CU001
      - CU004
      - CU006
      - CU011
      - CU014
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 基于已披露阶段、后果及可见缓释成熟度，对六大主要风险进行序数评估。
    data:
      columns:
        - 发生概率信号
        - 影响程度
        - 缓释成熟度
      rows:
        - label: 规模化客户认证
          values:
            - label: 偏高
              detail: 已披露送样，但缺失独立的生产级规模实证。
            - label: 高
              detail: 规模化转化是支撑最近一轮估值的核心。
            - label: 早期
              detail: 可见产品负责人入职与客户送样；未见签署的批量实证。
        - label: 制造测试与良率
          values:
            - label: 偏高
              detail: 2026 年访谈中承认了协同堆叠测试挑战。
            - label: 高
              detail: 认证、成本与交付均取决于可重复的制造能力。
            - label: 开发中
              detail: 据报道团队在开发新测试流程；良率数据目前不可得。
        - label: 现场可靠性
          values:
            - label: Unknown
              detail: 所分配证据未包含现场故障的分母数据。
            - label: 高
              detail: 可靠性不及预期可能直接卡死超大规模云厂商认证。
            - label: 缺乏证据
              detail: 产品规格并不等同于老化测试或现场可靠性结果。
        - label: 合作伙伴集中度
          values:
            - label: Unknown
              detail: 所分配证据中未公开合同与依赖份额。
            - label: 高
              detail: 关键封装或集成延期可能推迟部署。
            - label: 部分证实
              detail: 虽点名数家生态合作方，但尚未建立冗余替代能力。
        - label: 法律与出口管制态势
          values:
            - label: Unknown
              detail: 未分配一手法律或监管来源。
            - label: 潜在偏高
              detail: 管制限制或 IP 约束可能缩窄市场或延缓销售。
            - label: 缺乏证据
              detail: 缺少分类评定、FTO 意见或监管机构记录。
        - label: 融资与流动性
          values:
            - label: 偏高
              detail: 公司仍属非上市状态，商业财务披露十分有限。
            - label: 高
              detail: 在量产证据成型前开启新一轮融资，可能引发估值倒挂与优先权风险。
            - label: 部分证实
              detail: 融资历史清晰可见，但账上现金、烧钱速度、现金跑道与交易条款均未公开。
    approximationNotes: 该矩阵采用分析师定序判断，而非测算概率；保留 'unknown' 与 'not evidenced' 以体现缺失的分母与不可得的缓解措施数据。
    claimRefs:
      - CR004
      - CR007
      - CR010
      - CR011
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 该决策路径展示了技术差异化与资金储备如何与商业不透明形成鲜明对比，从而支撑持续跟踪立场。
    data:
      nodes:
        - id: scale-proof
          label: 光学技术规模
          description: Passage 与 Guide 平台凭借 51.2 Tbps 能力，直击数据中心互连关键瓶颈
        - id: capitalization
          label: 充沛资金储备
          description: 历经 10 轮融资，从一线投资方（GV、Fidelity、T. Rowe Price）累计筹集 $850M
        - id: commercial-gap
          label: 商业验证缺口
          description: 量产收入、ARR 或具名超大规模云厂商批量部署披露均为零
        - id: valuation-overhang
          label: 估值承压偏高
          description: Series D 轮 $4.4B 估值与 Forge Price 老股交易价格 $4.63B 已提前计入未经证实的量产推进
        - id: liquidity-risk
          label: 老股流动性受限
          description: 老股交易面临交割限制、流动性匮乏以及尚未公布的 IPO 时间表
        - id: catalyst-monitoring
          label: 催化剂跟踪
          description: 在入场前重点评估 Tier-1 云厂商定点（design-win）、封装良率及毛利率表现
        - id: decision-gate
          label: 维持跟踪建议
          description: 在验证客户实际部署并看清商业可见度前，维持观察立场
      edges:
        - from: scale-proof
          to: capitalization
        - from: capitalization
          to: commercial-gap
        - from: commercial-gap
          to: valuation-overhang
        - from: valuation-overhang
          to: liquidity-risk
        - from: liquidity-risk
          to: catalyst-monitoring
        - from: catalyst-monitoring
          to: decision-gate
    approximationNotes: 流程图展示导出建议的序列分析框架，并不代表物理或时间维度的实际推进顺序。
    claimRefs:
      - CV005
      - CV007
      - CV010
      - CV011
      - CV012
      - CV015
