      - number: '3.4'
        title: 护城河持久度与被替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河的核心考验在于量产制造，而非实验室跑出的峰值带宽。多份独立评论指出，可重复良率、可靠性、光测试产能以及晶圆代工工艺控制，才是决定光学需求能否转化为出货产品的关键制约。Built In
              另外提及，Lightmatter 大规模部署缺乏公开证据。收入数据同样充满矛盾：Latka 在未公开测算方法的前提下给出了 $116 million 的收入数据，而 Built In
              则直言公开收入佐证滞后。这些空白削弱了“技术差异化已转化为商业锁定”的主张。真正立得住的护城河，必须具备客户导入验证数据、具名量产部署案例、单体经济模型，并证明在巨头反扑与行业标准收敛之后，Passage 与
              Guide 仍能守住领先优势。
            claimRefs:
              - CP012
              - CP013
              - CP015
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 商业化验证仍是核心竞争门槛
            body: 产品线广度与雄厚资金支撑了公司的战略存在感，但在当前公开资料中，依然找不到可重复良率证据、具名量产部署、可比定价以及经过核实一致的真实收入数据。
            calloutType: risk
            claimRefs:
              - CP012
