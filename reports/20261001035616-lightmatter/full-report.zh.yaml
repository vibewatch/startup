              公开融资记录存在口径冲突。Tracxn 显示公司历经 10 轮融资（含政府补贴）累计募资 $850 million；FundedIQ 则仅记录了 2 轮融资共计 $555
              million，并声明该数据仅包含公开披露的轮次金额 [CI001, CI002, CI003]。各方最明确的共识是 2024 年 10 月官宣的 $400 million D 轮融资，报道估值为 $4.4
              billion [CI004]。公司 2023 年发布的官方公告曾表示 $154 million C 轮融资将用于产品交付，但历史累计融资并不等同于账面可用现金
