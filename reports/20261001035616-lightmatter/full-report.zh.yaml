        title: 展示项
        blocks:
          - type: callout
            title: 从电子计算向光互连的架构转型
            body: 数据中心功率密度持续攀升，集群扩容触碰电线物理极限，AI 基础设施的资本分配重心正从纯算力芯片转向高带宽光互连网络。
            calloutType: insight
            claimRefs:
              - CM002
              - CM008
          - type: callout
            title: 超大规模云厂商采购话语权与生态惯性
            body: 采用硅光技术需要替代根深蒂固的铜线与可插拔光学标准，必须与晶圆代工厂经历长达数年的协同工程开发与联合验证。
            calloutType: risk
            claimRefs:
