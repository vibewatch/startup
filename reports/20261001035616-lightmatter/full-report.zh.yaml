              - CU014
              - CU015
      - number: '6.2'
        title: 生态合作伙伴与客户送样里程碑
        blocks:
          - type: paragraph
            body: >-
              硅光技术要实现商业化，就必须与整个半导体生态深度协同设计，确保物理接口和协议均与主流算力平台兼容。2026 年 6 月，Lightmatter 达成了一项重大架构里程碑：加入 NVIDIA NVLink
              Fusion 生态，为将旗下 Passage 光互连切入下一代 AI 工厂搭建了集成通道。为跨越从实验室原型到商业化部署的鸿沟，Lightmatter 任命曾任职于 Google、AMD 和 NVIDIA 的老将
              Roy Kim 担任产品副总裁。单模块可承载 51.2 Tbps 的 Guide 超大规模光子引擎已进入客户送样阶段，Passage L20 6.4 Tbps 光引擎也在同步送样。公司累计融资 $850
              million，其中包括估值 $4.4 billion 的 $400 million D 轮融资；这笔资金为 GlobalFoundries、Amkor 和 ASE
              等代工与封测伙伴所需的漫长客户认证周期提供了资产负债表支撑。
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU010
              - CU011
          - type: table
