              - CP015
              - CP016
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式由产品驱动，但财务细节未公开
        blocks:
          - type: paragraph
            body: >-
              Lightmatter 已披露的产品线表明其走的是硬件与零部件销售路线，而非订阅制 ARR 逻辑。Tracxn 将其业务归类为光互连与共封装光学器件，公司官方通告则将 Passage、Guide、Envise 和
              Idiom 列为面向客户的核心产品 [CI005, CI006, CI014]。公开资料未披露合同是否混合了开发费、授权费、保底产能金或单件出货计费，也未提供任何收入构成细节。官方于 2026 年 4 月宣称
              Guide 正向客户送样，Passage 与 Guide 正推进规模化量产部署 [CI006,
              CI007]。这些表述属于有参考价值的商业化节点，但无论是送样还是部署意向，均不能作为确认收入的证据。因此，可供投资评估的收入模型依然只是分步推进的假设：企业接洽、客户准入验证、批量交付、确认收入，并在扣除制造、封装、测试与维保成本后方能结算毛利。
            claimRefs:
