  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分群与目标买方架构
        blocks:
          - type: paragraph
            body: >-
              Lightmatter 的商业战略直击大型 AI 数据中心传统铜缆互连在带宽与功率密度上的物理瓶颈。公司将潜在客群划分为三大核心阵营：运营海量训练集群的超大规模云服务商（如 AWS、Google 和
              Meta）、商用 GPU 平台厂商，以及定制 AI 加速芯片或 ASIC 设计公司。这类客户面临严峻的数据传输制约，芯片间通信瓶颈会导致大模型训练中大量 GPU 空转。Lightmatter 依托硅光技术，在
              3D 中介层拓扑中用光子替代电子，声称可将互连功耗降低高达 75%，并削减至多 40% 的算力空闲等待时间。然而，目标客户必须承担沉重的架构权衡代价，包括部署复杂的 1.5 kW
              液冷系统，并彻底重新设计服务器物理封装以适配共封装光引擎。
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU013
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
