      - number: '7.3'
        title: 法律、监管与合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              指定且成功获取的资料中，没有来自监管机构、法院、专利局、出口管制分类数据库、信任中心或安全事件通报渠道的材料。因此，本报告的法律登记项只记录潜在风险敞口与尽调路径，不能据此断言诉讼、执法、认证或安全事件存在或不存在。现有资料还显示，公司在台湾开展制造与测试，并与封装和集成伙伴保持生态合作；但公开证据未披露排他性协议、二供覆盖、产能预留、终止权、地域集中度或依赖份额。这些未知数不可忽视：制造商或平台合作方一旦延误认证，即便
              Lightmatter 自身零部件达到实验室规格，收入也可能推迟。
            claimRefs:
