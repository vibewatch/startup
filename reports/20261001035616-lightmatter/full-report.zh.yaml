      - number: '6.4'
        title: 商业化落地进展、客户集中度与准入壁垒
        blocks:
          - type: paragraph
            body: >-
              尽管技术营销铺天盖地、生态合作声势浩大，Lightmatter 经核实的商业化进展仍存在巨大的尽调缺口。截至 2026
              年底，公司公开渠道未列出任何一家付费量产客户，未公布任何具备约束力的中标定点，亦未披露任何经常性产品收入。行业评论与从业者反馈始终疑虑重重，直言除研发送样和高管技术演示外，Lightmatter
              的实际商业进展极难独立证实。此外，客户需求高度集中在极少数一线超大规模云厂商手中，这批巨头握有绝对的定价议价权，同时也在评估 NVIDIA Spectrum-X
              等竞争方案。在缺乏明确量产出货佐证的情况下，商业化前景极易受到冗长准入周期的冲击，甚至面临客户转投替代互连方案的流失风险。核实客户能否将送样协议转化为具备约束力的商业采购大单，正是评估 Lightmatter
              估值最关键的尽调催化剂。
            claimRefs:
              - CU008
              - CU009
              - CU012
