            body: >-
              多份独立行业档案显示，Lightmatter 由 Nicholas Harris、Darius Bunandar 与 Thomas Graham 于 2017 年创立；公司官网披露总部位于加州 Mountain
              View 的 250 Bryant Street。Lightmatter 将 Passage 定位为光互连平台，Guide 定位为大规模光引擎平台，两者均用于在 AI
              基础设施各处理器与交换机之间传输数据。这种业务属于零部件与硬件平台销售，而非已披露的订阅软件模式：现有资料重点强调光子芯片、参考平台、系统集成与代工制造合作伙伴，但未提供定价、收入构成、毛利率或合同出货量。因此，更准确的定性是将公司视为一家商业化数据尚未公开的后期
              D 轮半导体平台，而非已通过实际收入验证的基础设施供应商。
