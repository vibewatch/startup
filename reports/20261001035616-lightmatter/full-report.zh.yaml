  - id: TV002
    title: 核心论点 / 反向论点表
    columns:
      - 支柱维度
      - 正向论点
      - 反向论点
      - 观点转变触发条件
    rows:
      - - 算力与互连瓶颈
        - 超大规模 AI 集群面临电功耗墙与互连瓶颈，硅光子技术天然具备解决能力
        - 铜线与标准光学方案持续演进；光集成面临较高的初始封装复杂度与良率损耗
        - 独立基准测试证明在客户生产集群中互连能效提升 >5x
      - - 产品组合转型
        - Passage 互连、Guide 光引擎及 vClick 光学器件为 3D 共封装光学 (CPO) 提供全栈平台
        - 旗舰计算硬件 Envise 自 2023 年试点以来尚未宣布超大规模云厂商的规模化部署
        - Passage 或 Guide 模块达成首个具有约束力的数兆瓦级数据中心合同
      - - 资本结构与投资辛迪加
        - 包括 GV、Fidelity 和 T. Rowe Price 在内的顶尖投资辛迪加累计提供 $850M 资本
        - 私募估值在 D 轮融资中翻了两番，达到 $4.4B，但 ARR 和客户数均未公开披露
        - 经审计披露商业收入运行率，或斩获 Tier-1 云服务商 (CSP) 的 Design-Win
      - - 二级市场流动性
        - 来自 Forge Global ($4.63B) 与 PM Insights 的二级市场指标显示价格在 D 轮估值水平附近具抗跌性
        - 二级市场交易缺乏流动性，受转让权利受限、执行风险及未公布 IPO 时间表的制约
        - 正式提交 S-1 文件，或聘请公认会计师推进 IPO 前公司治理转型
    notes: 源自技术架构刊物、高管招聘披露，以及硅光与电互连领域的行业竞争对手对比。
