  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Ordinal assessment of six principal risks using disclosed stage, consequence, and visible mitigation maturity.
    data:
      columns:
        - Likelihood signal
        - Impact
        - Mitigation maturity
      rows:
        - label: Volume customer qualification
          values:
            - label: Elevated
              detail: Sampling is disclosed, but independent production-scale proof is absent.
            - label: High
              detail: Volume conversion is central to supporting the last-round valuation.
            - label: Early
              detail: A product leader and customer sampling are visible; signed volume proof is not.
        - label: Manufacturing test and yield
          values:
            - label: Elevated
              detail: The combined-stack test challenge was acknowledged in a 2026 interview.
            - label: High
              detail: Qualification, cost, and delivery depend on repeatable manufacturing.
            - label: Developing
              detail: New testing processes are reportedly in development; yield data is unavailable.
        - label: Field reliability
          values:
            - label: Unknown
              detail: The assigned evidence contains no field-failure denominator.
            - label: High
              detail: A reliability miss can block hyperscale qualification.
            - label: Not evidenced
              detail: Product specifications are not burn-in or field reliability results.
        - label: Partner concentration
          values:
            - label: Unknown
              detail: Contracts and dependency shares are not public in the assigned evidence.
            - label: High
              detail: A critical packaging or integration delay can defer deployment.
            - label: Partial
              detail: Several ecosystem relationships are named, but redundancy is not established.
        - label: Legal and export posture
          values:
            - label: Unknown
              detail: No primary legal or regulatory source was allocated.
            - label: Potentially high
              detail: Restrictions or an IP constraint could narrow the market or delay sales.
            - label: Not evidenced
              detail: No classification, FTO opinion, or regulator record was available.
        - label: Financing and liquidity
          values:
            - label: Elevated
              detail: The company is private and commercial financial disclosure is limited.
            - label: High
              detail: A new round before volume proof could create valuation and preference risk.
            - label: Partial
              detail: Funding history is visible, but cash, burn, runway, and terms are not.
    approximationNotes: >-
      The matrix uses ordinal analyst judgments rather than measured probabilities; 'unknown' and 'not evidenced'
      preserve missing denominators and unavailable mitigation data.
