      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The central moat question is manufacturing, not a laboratory bandwidth headline. Independent commentary
              identifies repeatable yield, reliability, optical-test capacity, and foundry process control as the
              constraints that determine whether optical demand becomes shipped product. Built In separately notes
              limited public proof of large-scale Lightmatter deployments. Revenue evidence is also contradictory: Latka
              reports $116 million without disclosing a methodology, while Built In says public revenue proof lags.
              These gaps weaken any claim that technical differentiation has already become commercial lock-in. A
              defensible moat would require qualification data, named production deployments, unit economics, and
              evidence that Passage and Guide remain advantaged after incumbent responses and standards convergence.
            claimRefs:
              - CP012
              - CP013
              - CP015
              - CP016
