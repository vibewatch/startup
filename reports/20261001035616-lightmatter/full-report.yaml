  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence Basis
      - Decision Implication
    rows:
      - - Investment Recommendation
        - Track
        - Absence of confirmed production revenue despite $4.4B-$4.63B private valuation marks
        - Maintain watch posture without allocating capital until production deployment is proven
      - - Confidence Level
        - Medium
        - Documented Series D financing and secondary pricing but unverified customer production contracts
        - Require primary customer audit verification before upgrading conviction
      - - Risk Rating
        - High
        - Critical dependencies on TSMC advanced packaging, hyperscaler qualification, and illiquid secondary markets
        - Discount return hurdles to account for multi-year hardware qualification lag
      - - Valuation Stance
        - Stretched
        - October 2024 Series D post-money mark of $4.4B and October 2026 Forge Price of $4.63B with no public revenue
        - Entry at current secondary levels prices in near-flawless hyperscaler adoption
    notes: >-
      Synthesized from reported Series D financing metrics, Forge Global secondary pricing indicators, and qualitative
      diligence findings as of October 2026.
