    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating stage, and business model
        blocks:
          - type: paragraph
            body: >-
              Independent profiles identify Lightmatter as a 2017-founded company created by Nicholas Harris, Darius
              Bunandar, and Thomas Graham, while the company site lists its headquarters at 250 Bryant Street in
              Mountain View, California. Lightmatter describes Passage as its photonic interconnect platform and Guide
              as its large-scale light-engine platform, both aimed at moving data among processors and switches in AI
              infrastructure. This is a component-and-platform hardware model rather than a disclosed recurring-software
              model: the retained materials emphasize photonic chips, reference platforms, integration, and
              manufacturing partners, but do not provide pricing, revenue mix, gross margin, or contracted unit volumes.
              The company is therefore best treated as a late-stage, Series D semiconductor platform whose commercial
              economics remain private, not as a revenue-validated infrastructure supplier.
