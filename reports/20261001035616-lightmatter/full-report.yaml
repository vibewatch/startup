      - number: '3.3'
        title: Buying economics, distribution, and lock-in
        blocks:
          - type: paragraph
            body: >-
              Public pricing is the weakest comparison dimension: none of the retained sources provides a comparable
              price per port, bandwidth unit, package, rack, or multiyear contract. Buyers must therefore compare
              architecture and integration burden before they can compare total cost. Incumbents retain a material
              distribution defense because mature software and ecosystem support reduce qualification and switching
              risk. Lightmatter counters with direct engagement across hyperscalers, GPU companies, and ASIC designers,
              but that engagement is a company claim rather than disclosed contract evidence. Multi-homing is plausible
              during evaluation; durable lock-in should be underwritten only after interfaces, qualification ownership,
              and committed volume terms are reviewed.
