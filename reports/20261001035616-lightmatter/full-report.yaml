  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Architectural Pivot
        blocks:
          - type: paragraph
            body: >-
              Lightmatter delivers high-density optical interconnect platforms engineered to eliminate data movement
              bottlenecks across distributed AI compute clusters. Founded as an MIT spinout originally exploring analog
              photonic computing through its Envise tensor processor, the company executed a strategic pivot between
              2021 and 2023 toward interconnect solutions as frontier AI training models made inter-chip bandwidth the
              primary scaling constraint. Its flagship hardware offering is Passage, a 3D-stacked silicon photonics
              interposer platform designed to bypass conventional electrical package shoreline limitations. By
              vertically coupling electronic compute chiplets—such as GPUs, custom XPUs, and high-radix switch
              dies—directly to a photonic communication substrate, Passage enables multi-die assemblies to communicate
              with near-monolithic latency and multi-terabit bandwidth density. Complementing Passage is Guide, an
              external Very Large Scale Photonics (VLSP) light engine designed to supply high-power optical carrier
              channels to co-packaged optics (CPO) architectures without subjecting heat-sensitive lasers to hot
              electronic compute dies. Together, these systems provide hyperscalers and ASIC developers with a modular
              optical communication backplane aimed at extending cluster scale-up domains across multiple compute racks.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE007
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
