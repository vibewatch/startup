  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment consequence
        blocks:
          - type: paragraph
            body: >-
              Commercial qualification is the highest residual risk. Lightmatter says Guide is sampling with customers
              and hired a product leader to help move its platforms toward volume deployment, but Built In's explicitly
              AI-generated synthesis says large-scale deployments are difficult to verify and revenue is undisclosed.
              Forge separately characterizes the products as still maturing and says adoption at scale is not
              guaranteed. Those observations do not prove commercial failure; they show that the public evidence remains
              one stage short of production proof. At the last disclosed $4.4 billion financing valuation, delayed
              qualification or weak volume conversion would be disproportionately damaging to the investment case.
            claimRefs:
              - CR001
