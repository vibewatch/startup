      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Photonic Interconnect Transition at Hyperscale
            body: >-
              As AI models scale to trillions of parameters, conventional copper interconnects face severe physical
              bandwidth density and thermal dissipation boundaries. Lightmatter's Passage platform directly targets this
              transition by substituting optical fibers for electrical wiring, though adoption hinges on multi-year
              co-packaging qualifications with OSAT partners.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU011
          - type: callout
            title: Commercial Proof and Production Win Opacity
            body: >-
              Despite securing $850 million in venture funding and ecosystem partnerships with NVIDIA, Lightmatter has
              not publicly named a single volume production customer or disclosed revenue figures. Investors must treat
              commercial traction as pre-production sampling until verified tier-1 hyperscaler design wins materialize.
            calloutType: risk
            claimRefs:
