  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability Signal
      - Core Operating Assumptions
      - Valuation / Return Logic
      - Downside & Kill Triggers
    rows:
      - - 'Bull Case: Hyperscaler Interconnect Standard'
        - Low (15-20%)
        - >-
          Passage and Guide achieve volume design-wins across two major Tier-1 cloud providers; $500M+ revenue run-rate
          by 2028
        - Multiples expand on dominant AI infrastructure moat; exit valuation $12B-$15B (2.7x-3.4x Series D)
        - Failure of TSMC 3DIC packaging yield; cancellation of hyperscaler pilot programs
      - - 'Base Case: Niche Co-Packaged Optics Deployment'
        - Medium (50-55%)
        - >-
          Moderate commercial adoption in specialized AI clusters; $100M-$200M revenue by 2028 amid stiff copper
          competition
        - Valuation holds flat to moderate growth at $4.0B-$5.5B (0.9x-1.2x Series D); extended private holding period
        - Hyperscaler in-house optical interconnect initiatives bypassing third-party silicon photonics
      - - 'Bear Case: Packaging Yield Friction & Market Delay'
        - Medium (25-30%)
        - Volume manufacturing delays, high unit production costs, and prolonged customer evaluation cycles burn capital
        - Down-round financing or recapitalization at $1.5B-$2.5B (40-65% haircut from Series D)
        - Cash runway exhaustion before commercial scale; loss of key optical engineering leadership
      - - 'Downside Scenario: Obsolescence / Acquisition Salvage'
        - Low (5%)
        - Electrical interconnects extend life; proprietary optical engines fail to become industry standards
        - Distressed IP acquisition or asset sale below cumulative $850M paid-in capital ($400M-$700M)
        - Broadcom/Nvidia proprietary interconnect standards locking out merchant optical engine startups
    notes: >-
      Scenario valuation multiples and revenue projections are author estimates based on historical AI hardware multiple
      distributions and hardware ramp timelines.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV013
      - CV014
      - CV015
