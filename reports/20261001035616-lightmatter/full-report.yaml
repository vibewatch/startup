  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Decision pathway demonstrating how technological differentiation and capitalization contrast against commercial
      opacity to dictate a track stance.
    data:
      nodes:
        - id: scale-proof
          label: Photonic Technology Scale
          description: Passage and Guide platforms address critical data center interconnect bottlenecks with 51.2 Tbps capability
        - id: capitalization
          label: Substantial Capitalization
          description: $850M raised across 10 rounds from Tier-1 sponsors (GV, Fidelity, T. Rowe Price)
        - id: commercial-gap
          label: Commercial Proof Gap
          description: Zero disclosed production revenue, ARR, or named hyperscaler volume deployments
        - id: valuation-overhang
          label: Stretched Valuation
          description: Series D mark of $4.4B and secondary Forge Price of $4.63B pricing in unverified production traction
        - id: liquidity-risk
          label: Secondary Illiquidity
          description: Secondary shares face execution restrictions, illiquidity, and unannounced IPO timeline
        - id: catalyst-monitoring
          label: Catalyst Monitoring
          description: Evaluate Tier-1 CSP design-wins, packaging yields, and gross margins prior to entry
        - id: decision-gate
          label: Track Recommendation
          description: Maintain watch posture pending verified customer deployments and commercial visibility
      edges:
        - from: scale-proof
          to: capitalization
        - from: capitalization
          to: commercial-gap
        - from: commercial-gap
          to: valuation-overhang
        - from: valuation-overhang
          to: liquidity-risk
        - from: liquidity-risk
          to: catalyst-monitoring
        - from: catalyst-monitoring
          to: decision-gate
    approximationNotes: >-
      Flow diagram illustrates the sequential analytical framework leading to the recommendation rather than physical or
      chronologic progression.
