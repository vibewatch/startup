          - type: callout
            title: Monitorable thesis-break triggers
            body: >-
              Treat a missed customer qualification plan, inability to disclose acceptable yield and reliability, loss
              of a critical manufacturing path without an approved alternate, or a new financing before volume proof on
              opaque terms as thesis-break triggers. Confirm thresholds and dates directly with management because the
              public sources do not quantify them.
