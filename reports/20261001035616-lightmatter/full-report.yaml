      - number: '7.4'
        title: Capital exposure, monitoring indicators, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Funding raised is not cash available. Tracxn reports $850 million raised across ten rounds, and multiple
              sources place the October 2024 Series D at $400 million and a $4.4 billion valuation, but the assigned
              evidence provides no burn, runway, gross margin, working-capital, debt, preference, or current cash data.
              Secondary-market estimates of $84.19 on Public and a Forge Price of $84.48 at a modeled $4.63 billion
              valuation are platform estimates, not audited enterprise value or liquidity. The thesis should break if
              customer sampling does not convert to independently verifiable volume deployment, if qualification
              reliability misses customer requirements, or if financing is needed before those milestones without
              transparent terms.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
