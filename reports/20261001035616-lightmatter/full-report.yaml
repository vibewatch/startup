      - number: '7.2'
        title: Manufacturing, quality, and execution exposure
        blocks:
          - type: paragraph
            body: >-
              The operating challenge is not merely photonic performance in a controlled demonstration. In a 2026
              interview, Lightmatter's chief executive described high-volume production work with a Taiwan supply chain
              and new tests for overlapping photonic and electronic stacks, adding that the combined testing problem had
              not been fully solved. Company-issued material presents sampling, bandwidth, and insertion-loss
              specifications, but the assigned evidence contains no manufacturing yield, burn-in, field failure, return,
              or mean-time-between-failure data. An anonymous Reddit account alleging former employment also described
              historical design churn and weak non-photonic execution; it is adverse context, not verified company
              evidence, and should be tested through references and operating data.
