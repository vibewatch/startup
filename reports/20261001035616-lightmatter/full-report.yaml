              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Production evidence is the gating catalyst
            body: >-
              The highest-value diligence item is a production evidence package: named customer acceptance, committed
              volume, shipment and revenue recognition, qualification results, yield, field reliability, and
              gross-margin bridge. Sampling and specifications are useful milestones but do not establish durable
              commercial deployment.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR014
