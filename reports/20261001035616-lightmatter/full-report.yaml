      - number: '5.2'
        title: Subsystem Capabilities, Modular SKUs, and Packaging Integrations
        blocks:
          - type: paragraph
            body: >-
              The hardware product portfolio spans several specialized optical sub-assemblies and modular tiers designed
              to fit into evolving hyperscaler packaging workflows. The flagship Passage M1000 superchip configuration
              integrates up to 34 heterogeneous compute chiplets across a 4,000 mm² equivalent photonic substrate,
              delivering 114 Tbps of bidirectional interconnect bandwidth across 1,024 SerDes lanes. For near-package
              optics (NPO) and on-board optical transceivers, Lightmatter introduced the Passage L20 engine, which
              provides 6.4 Tbps optical capacity and cuts fiber count in half via bidirectional wavelength-division
              multiplexing. Optical connectivity is physically coupled using proprietary vClick optics, a detachable
              fiber array unit exhibiting less than 1.5 dB insertion loss to facilitate clean modular assembly and field
              rework. Thermal and laser reliability are addressed by separating laser generation from compute packages:
              the Guide VLSP engine supplies up to 51.2 Tbps of optical carrier power per module from a serviceable
              chassis location. To manufacture these assemblies at commercial volume, Lightmatter established a
              strategic partnership with Global Unichip Corporation (GUC) to combine ASIC design services with advanced
              3D packaging workflows, while co-founding the Open Silicon Photonics for AI Systems initiative within the
              Open Compute Project (OCP) alongside Celestica, Dell, and Qualcomm to standardize co-packaged optical rack
              blueprints.
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE012
          - type: table
            tableRef: TE002
