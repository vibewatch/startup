  - id: FE001
    title: Lightmatter Photonic Interconnect Technology Stack
    type: stack
    summary: Integrated hardware layers connecting distributed AI compute clusters through silicon photonics.
    data:
      layers:
        - label: Compute & Switch Silicon Layer
          detail: Heterogeneous electronic dies including GPUs, custom XPUs, and datacenter switch ASICs
          items:
            - 34 heterogeneous chiplets per M1000 superchip
            - 1,024 high-speed SerDes electrical interfaces
            - Custom hyperscaler ASIC designs via GUC partnership
        - label: Photonic Interposer Layer (Passage)
          detail: 3D-stacked silicon photonics substrate providing dense optical communication fabric
          items:
            - 4,000 mm² equivalent photonic interposer substrate
            - 114 Tbps total bidirectional optical communication bandwidth
            - Direct die-to-die optical switching and waveguide interconnects
        - label: Optical Coupling & Connectivity Layer (vClick & L20)
          detail: Near-package optics engines and detachable precision fiber interfaces
          items:
            - vClick detachable optical connector with <1.5 dB insertion loss
            - Passage L20 6.4 Tbps optical engine with bidirectional multiplexing
            - Sub-micron precision optical ribbon coupling
        - label: Optical Power Generation Layer (Guide VLSP)
          detail: External chassis-mounted continuous-wave laser light engines
          items:
            - Guide VLSP powering up to 51.2 Tbps bandwidth per module
            - GuideDR field-replaceable multi-wavelength laser modules
            - Thermal isolation protecting lasers from 100°C+ compute junction heat
        - label: System Standards & Rack Integration Layer
          detail: Ecosystem protocols and modular rack mechanical specifications
          items:
            - OCP Open Silicon Photonics for AI Systems reference architecture
            - MHS- and Open Rack v3 (ORv3)-compliant modular rack designs
            - Interoperable multi-node cluster scaling from 72 to 1,024+ nodes
        - label: Photonic Process & Foundry Layer
          detail: Underlying silicon photonics fabrication and electro-optic device primitives
          items:
            - Mach-Zehnder optical modulators and micro-ring resonators
            - Commercial wafer fabrication via TSMC and GlobalFoundries
            - Direct vertical TSV opto-electronic interconnects
    approximationNotes: >-
      Layer hierarchy represents functional opto-electronic abstraction based on company technical announcements and
      partner releases.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE007
      - CE009
      - CE010
