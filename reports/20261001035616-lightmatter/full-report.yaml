      - number: '7.3'
        title: Legal, regulatory, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              No regulator, court, patent-office, export-control classification, trust-center, or incident source
              appears in the assigned successful pool. The legal register therefore records exposure and diligence paths
              rather than claiming that litigation, enforcement, certification, or incidents are present or absent.
              Operationally, available sources identify Taiwan manufacturing and test work plus ecosystem relationships
              involving packaging and integration partners. Public evidence does not disclose contract exclusivity,
              second-source coverage, capacity reservations, termination rights, geographic concentration, or dependency
              shares. These unknowns matter because qualification delays at a manufacturing or platform counterparty can
              defer revenue even when Lightmatter's own component meets its laboratory specification.
