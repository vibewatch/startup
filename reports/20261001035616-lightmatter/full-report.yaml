      - number: '6.2'
        title: Ecosystem Partnerships & Sampling Milestones
        blocks:
          - type: paragraph
            body: >-
              Commercializing silicon photonics requires extensive co-design across the semiconductor ecosystem to
              ensure physical and protocol compatibility with incumbent computing platforms. In June 2026, Lightmatter
              achieved a significant architectural milestone by joining the NVIDIA NVLink Fusion ecosystem, establishing
              an integration path to connect its Passage photonic interconnects into next-generation AI factories. To
              bridge the gap from laboratory prototyping to commercial deployment, Lightmatter appointed former Google,
              AMD, and NVIDIA product veteran Roy Kim as Vice President of Product. The company has advanced its Guide
              Very Large Scale Photonics light engine—capable of powering 51.2 Tbps per module—into active customer
              sampling alongside the Passage L20 6.4 Tbps optical engine. These sampling engagements are backed by an
              $850 million lifetime capital pool, including a $400 million Series D round at a $4.4 billion valuation,
              providing the balance sheet stability necessary to support long customer qualification cycles across
              foundry and packaging partners like GlobalFoundries, Amkor, and ASE.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU010
              - CU011
          - type: table
            tableRef: TU002
