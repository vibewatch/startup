  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counter
      - What Would Change View
    rows:
      - - Compute & Interconnect Bottleneck
        - >-
          Hyperscale AI clusters face electrical power walls and interconnect limits that silicon photonics natively
          solves
        - >-
          Copper and standard optics continue to advance; optical integration incurs high initial packaging complexity
          and yield friction
        - Independent benchmarks demonstrating >5x interconnect power efficiency in customer production clusters
      - - Product Portfolio Transition
        - >-
          Passage interconnect, Guide light engines, and vClick optics provide a full-stack platform for 3D co-packaged
          optics
        - Flagship Envise compute hardware has not announced volume hyperscaler deployments since 2023 pilots
        - First binding multi-megawatt data center contract for Passage or Guide modules
      - - Capitalization & Investor Syndicate
        - Top-tier syndicates including GV, Fidelity, and T. Rowe Price have provided $850M in cumulative capital
        - Private valuation quadrupled to $4.4B in Series D with no publicly disclosed ARR or customer count
        - Audited disclosure of commercial revenue run-rate or Tier-1 CSP design-win
      - - Secondary Market Liquidity
        - Secondary indicators from Forge Global ($4.63B) and PM Insights show pricing resilience near Series D levels
        - >-
          Secondary transactions are illiquid with restricted transfer rights, execution risk, and no announced IPO
          timeline
        - Formal S-1 filing or pre-IPO corporate governance transition with public auditor engagement
    notes: >-
      Derived from technical architecture publications, executive hiring disclosures, and industry competitor
      comparisons across silicon photonics and electronic interconnects.
