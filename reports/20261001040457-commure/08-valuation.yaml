        - "ARR grows 50% YoY to $675M by 2028; autonomous RCM drives gross margin expansion to 75%; successful public listing"
        - "$13.5B enterprise valuation (20.0x ARR multiple) generating 1.9x MOIC and ~25% annualized IRR"
        - "Regulatory scrutiny on autonomous billing or antitrust obstacles in health system software consolidation"
        - "High market adoption of multi-EHR agentic workflows across non-HCA health systems (25% probability)"
      - - "Base Case"
        - "ARR compounds at 40% YoY to $400M by 2028; steady HCA expansion and moderate market share gains in RCM"
        - "$7.2B enterprise valuation (18.0x ARR multiple) generating 1.0x-1.1x capital preservation / modest upside"
        - "Lengthening enterprise sales cycles and partial customer churn among community hospital networks"
        - "Continued steady expansion with current 130+ health systems and enterprise RCM adoption (55% probability)"
      - - "Bear Case"
        - "ARR growth slows to 15% YoY ($265M by 2028); CVF cash encumbrance and customer concentration attrition trigger multiple compression"
        - "$2.65B enterprise valuation (10.0x ARR multiple) representing a 62% drawdown from the $7.0B post-money mark"
        - "Severe health system IT budget freezes, marquee customer churn, or adverse audit findings in revenue-share accounting"
        - "Inability to attract independent outside lead investor or slowdown in enterprise rollouts (20% probability)"
    notes: "Scenario projections assume a 2-year holding period through mid-2028 based on reported May 2026 $200M contracted ARR baseline."
