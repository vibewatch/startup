  title: "Customers"
  summary: "Commure claims enterprise adoption across 500+ healthcare organizations and 130+ major health systems, anchored by strategic partnerships with HCA Healthcare and Tenet Healthcare. However, rapid commercialization has sparked public scrutiny over referral compensation schemes and customer friction, while retention metrics and customer concentration disclosures remain unverified."
sections:
  - id: "customer-segmentation-and-commercial-scale"
    title: "Customer Segmentation and Commercial Scale"
    body: "Commure structures its customer base across two primary commercial tiers: tier-one acute enterprise health systems and mid-market or independent physician practices. On the enterprise acute side, Commure's anchor deployments center on investor-affiliated health systems, most notably HCA Healthcare (comprising 188 hospitals and approximately 2,400 ambulatory care sites) and Tenet Healthcare's Tenet Physician Resources. These enterprise health systems contract for ambient AI clinical documentation, multi-EHR clinical intelligence, and end-to-end revenue cycle management (RCM). Across its aggregate customer footprint, Commure publicly reports deployment within more than 500 healthcare organizations spanning over 3,000 care sites, serving an active clinician base claimed at over 500,000 providers and processing more than $25 billion in annual claims. In addition to health systems, Commure targets independent ambulatory clinics and multi-specialty physician practices with its Athelas Air electronic medical record (EMR) and practice management software. However, the commercial composition of the customer base is bifurcated: enterprise systems act as strategic design partners with equity or fund alignment, while independent practices adopt modular RCM or ambient documentation tools to alleviate severe administrative burden."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-adoption-trajectory"
    title: "Named Deployments and Adoption Trajectory"
    body: "Operational deployment proof for Commure is concentrated in its high-profile enterprise commitments, though the depth of full production rollout varies across modules. Commure's flagship relationship is with HCA Healthcare, which selected Commure in October 2024 following the acquisition of Augmedix to develop and deploy an ambient AI platform across its network. Co-developed with HCA's Care Transformation and Innovation department, the platform is targeted at emergency departments, hospitalist workflows, and ambulatory clinics. HCA's formal enterprise agreement represented an initial co-development and phased deployment across selected facilities, with expansion planned across its 43 million annual patient encounters. At Tenet Healthcare, CEO of Tenet Physician Resources Philipp Ludwig endorsed Commure's provider- and patient-centric platform, noting its rollout across their national physician network. Reported operational metrics include 40 million ambient appointments charted annually and over 85% autonomous execution across RCM billing workflows. Nevertheless, outside these flagship investor-partner deployments, third-party verified case studies detailing complete health system-wide production cutovers remain scarce, and adoption in independent clinics often faces multi-EHR synchronization bottlenecks."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "retention-satisfaction-and-concentration-risks"
    title: "Retention, Satisfaction, and Concentration Risks"
    body: "While Commure exhibits rapid headline adoption, its commercial expansion carries substantial concentration, operational, and reputational risks. A major investigative report published by STAT in August 2026 revealed that Commure offered thousands of dollars in financial compensation and incentives to medical clinics and third parties willing to refer new business prospects, raising governance questions regarding its aggressive sales culture. The investigation highlighted that while many customers praise billing and scheduling automation, some clinics experienced steep financial losses, billing disruption, and operational turmoil following rapid implementation. Furthermore, third-party software evaluation platforms such as RFP.wiki report that independent B2B review presence remains sparse, noting that while ambient scribing and collections receive positive feedback, multi-EHR environments frequently encounter extended implementation support requirements and sync delays between connected clinical systems. From a durability standpoint, Commure has not publicly disclosed audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), customer churn rates, or per-customer Annual Recurring Revenue (ARR) distributions. This absence creates significant diligence uncertainty, as top-customer concentration with HCA Healthcare and Tenet Healthcare poses an acute vulnerability if enterprise renewal terms soften or deployment milestones stall."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
callouts:
  - calloutType: "risk"
    title: "Customer Concentration and Incentive Scrutiny"
    body: "Commure's enterprise narrative relies heavily on its flagship HCA Healthcare and Tenet Healthcare partnerships. The revelation of aggressive cash referral programs and reported customer financial friction underscores operational risk in post-merger integration and commercial durability."
    claimRefs:
