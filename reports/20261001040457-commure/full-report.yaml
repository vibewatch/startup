      - CE004
      - CE005
      - CE006
      - CE012
      - CE014
    data:
      layers:
        - label: Client & Capture Surface
          detail: Multi-modal input interfaces across clinical and operational settings
          modules:
            - Ambient Room Microphone & Mobile iOS/Android App
            - Dictation & Voice-to-Cursor Client (95ms latency)
            - Patient Access & Digital Intake Portals
            - Wearable RTLS Staff Duress Badges (Strongline)
        - label: Ingestion & Streaming Pipeline
          detail: High-throughput real-time healthcare message processing
          modules:
            - Cloud-Native Streaming Integration Engine (Apache Flink)
            - Unstructured Document & Referral Parsing Pipeline (Orchestrator)
            - Omnichannel Telephony & Inbound Voice Stream Handler
        - label: EHR Interoperability & Connector Layer
          detail: Bidirectional health system data exchange and writeback
          modules:
            - HL7 v2/v3 Message Broker & FHIR RESTful Endpoints
            - Bidirectional Connectors Spanning 40+ EHR/EMR Platforms
            - Direct Integration with MEDITECH EHRs (MaaS Compatible)
            - Automated Reverse-Engineered EHR Interface Adapters
        - label: Clinical NLP & Ambient Intelligence
          detail: Acoustic processing, diarization, and structured note synthesis
          modules:
            - Medical Acoustic Speech-to-Text & Speaker Diarization
            - Specialty-Aware Clinical Note Synthesis Engine
            - Clinician Review & Sign-Off Verification Workflow
            - Pre-Chart Encounter Context Ingestion
        - label: Agentic Automation & Revenue Engine
          detail: Middle-office coding, prior authorization, and call routing
          modules:
            - Autonomous Medical Coding & CDI Integration
            - Payer Rules Engine & Real-Time Prior Authorization
            - Dynamic AI Call Center Agents & Scheduling Bot
            - Unified Claims Scrubbing & Denials Prevention Queue
        - label: Trust, Compliance & Governance
          detail: Regulatory certifications, device standards, and residency
          modules:
            - CE-Mark Class I Software under EU MDR 2017/745
            - UK MHRA Registration under Medical Devices Regs 2002
            - ISO 14971 Hazard Analysis & IEC 62366-1 Usability
            - HIPAA Compliant Controls & UK Regional Data Residency
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Visualizes the clinical and administrative customer touchpoints from initial ambient AI or EMR onboarding to
      enterprise RCM expansion and system-wide lock-in.
    data:
      nodes:
        - label: Initial Onboarding
          stage: Initial Onboarding
          title: Clinician Workflow Integration
          description: >-
            Health systems and practices pilot ambient AI scribing or Athelas Air EMR to alleviate immediate
            documentation burnout.
          touchpoints:
            - Multi-EHR integration (Epic, Athenahealth, ECW)
            - Mobile provider app setup
            - Specialty workflow mapping
        - label: Mid-Cycle Adoption
          stage: Mid-Cycle Adoption
          title: Clinical Intelligence Expansion
          description: >-
            Usage broadens from ambient recording to automated clinical coding, charge capture, and care team
            collaboration.
          touchpoints:
            - Real-time care cues
            - Automated chart completion
            - Emergency department rollout
        - label: Back-End Lock-In
          stage: Back-End Lock-In
          title: Autonomous RCM Integration
          description: >-
            Organizations transition full billing, denial appeals, and revenue integrity onto Commure's automated
            platform.
          touchpoints:
            - Autonomous claims processing
            - Payer rule reconciliation
            - Revenue cycle analytics
        - label: Enterprise Scaling
          stage: Enterprise Scaling
          title: Network-Wide Standardization
          description: >-
            Anchor systems (e.g., HCA, Tenet) standardize operations across regional facilities, creating deep
            operational stickiness.
          touchpoints:
            - Executive governance reviews
            - Cross-facility performance tracking
            - Referral and co-development programs
        - label: System Expansion
          stage: System Expansion
          title: Multi-Facility Cross-Sell
          description: Expansion across acute inpatient facilities, ambulatory surgery centers, and regional physician clinics.
          touchpoints:
            - Inpatient charge reconciliation
            - Enterprise contract renewal
            - Cross-department KPI alignment
        - label: Platform Maturity
          stage: Platform Maturity
          title: Operating System Entrenchment
          description: >-
            Commure becomes the primary system of action for all clinical charting and revenue operations across the
            IDN.
          touchpoints:
            - Automated denial appeals
            - System-wide financial reporting
            - Consolidated vendor replacement
