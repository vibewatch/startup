chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Commure, Inc. is an enterprise healthcare technology platform headquartered at 1300 Terra Bella Avenue in
              Mountain View, California. Founded in 2017 through incubation by venture firm General Catalyst, the
              company was initially established to construct an open, FHIR-native operating system unifying fragmented
              hospital data architectures. Over nine years of development, Commure evolved from a foundational developer
              infrastructure provider into a full-stack clinical intelligence and autonomous revenue cycle management
              (RCM) platform. The company's core software portfolio bridges front-end patient access, mid-cycle ambient
              clinical documentation, and back-end billing reconciliation. By deploying agentic artificial intelligence
              directly across more than sixty Electronic Health Record (EHR) systems, Commure automates routine clinical
              documentation, charge capture, and insurance claim denial management, transforming labor-intensive
              hospital administration into automated software workflows.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO010
              - CO014
      - number: '1.2'
        title: Executive Leadership, Governance, and Integration History
        blocks:
          - type: paragraph
            body: >-
              Commure's executive leadership structure reflects a series of transformative corporate combinations, most
              notably its October 2023 merger with Athelas. Tanay Tandon, who founded Athelas at age eighteen from his
              Stanford dorm room, assumed the role of Chief Executive Officer of the combined entity, driving an
              aggressive shift toward applied machine learning and agentic healthcare workflows. The company's
              governance is anchored by Co-Founder and Chairman Hemant Taneja, Chief Executive Officer of General
              Catalyst, who engineered Commure's original incubation and syndicated its health system partnerships.
              Following the Athelas transaction, Commure expanded its clinical capabilities by acquiring publicly traded
              ambient scribe pioneer Augmedix for $139 million in 2024, integrating founder Ian Shakil's clinical
              documentation team. Regulatory and operational leadership is overseen by President Dan Warner, who
              spearheaded Commure's Class I medical device certification under EU MDR 2017/745 and registration with the
              United Kingdom Medicines and Healthcare products Regulatory Agency.
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: Capitalization Structure, Scale Metrics, and Investor Base
        blocks:
          - type: paragraph
            body: >-
              Commure's balance sheet reflects substantial institutional backing across equity and non-dilutive growth
              capital facilities, totaling over $890 million in cumulative capital. In May 2026, Commure finalized a $70
              million growth financing round at a $7.0 billion post-money valuation led by General Catalyst, with
              participation from Sequoia Capital, Morgan Stanley, and Kirkland & Ellis. This equity injection
              complemented a $200 million growth financing facility secured in June 2025 from General Catalyst's
              Customer Value Fund (CVF), a performance-linked structure that finances customer acquisition and product
              implementation repaid via cohort revenue sharing without corporate equity dilution. The company's
              commercial scale has expanded rapidly, with annualized recurring revenue doubling for three consecutive
              years to surpass $200 million as of June 2025. Commure now powers operations across more than 130 health
              systems, 500 healthcare organizations, and 3,000 sites of care, processing tens of billions of dollars in
              annual billing claims with reported 85% autonomous execution.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO008
              - CO011
      - number: '1.4'
        title: Operational Evolution, Technical Milestones, and Governance Constraints
        blocks:
          - type: paragraph
            body: >-
              Commure's operational history has transitioned through distinct phases, beginning with venture rounds such
              as its $250 million Series D in 2021, moving through vertical consolidation via the Athelas, Augmedix, and
              Memora Health acquisitions, and culminating in national enterprise scale. Its defining commercial
              milestone is the partnership with HCA Healthcare, which selected Commure to deploy ambient clinical
              intelligence across 188 hospitals and 2,400 care sites. However, institutional diligence reveals
              meaningful operational constraints and governance boundaries. Independent architectural benchmarks
              indicate that Commure relies heavily on proprietary OpenAI foundation model integrations without offering
              customer-configurable model routing, external observability traces, or open API extensibility.
              Furthermore, Commure's standard enterprise terms enforce mandatory individual arbitration, waive class
              actions, and strictly disclaim medical decision-making or credential verification of treating providers,
              establishing distinct legal boundaries around provider accountability and software liability.
            claimRefs:
