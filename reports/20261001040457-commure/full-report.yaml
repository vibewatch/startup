  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Risk
      - Pivot Trigger / What Would Change View
    rows:
      - - Market & Platform Breadth
        - Enterprise healthcare operating system spanning documentation, coding, and RCM creates massive cross-sell moat
        - >-
          Point-solution ambient AI competitors (e.g., Abridge) may out-innovate on specialty clinical transcription
          depth
        - Loss of marquee enterprise health systems to focused ambient documentation specialists
      - - Commercial Traction
        - Contracted ARR doubled annually for three years to $200M+ with massive HCA Healthcare deployment footprint
        - Revenue concentration in anchor health systems leaves growth vulnerable to enterprise contract renegotiation
        - Disclosed top-5 customer revenue concentration exceeding 40% of contracted ARR
      - - Financing & Capital Efficiency
        - Non-dilutive $200M Customer Value Fund financing pre-funds go-to-market without equity dilution
        - CVF revenue-share obligations encumber gross margin cash flows and reduce residual equity upside
        - Net revenue share payments exceeding 15% of annual collected software billings
      - - Valuation & Governance
        - $7.0B valuation represents disciplined 17% markup since 2023 merger rather than speculative bubble multiple
        - General Catalyst repeatedly pricing internal rounds raises conflict of interest and insider self-marking risk
        - Down-round pricing or failure to attract independent third-party lead investor in next equity round
    notes: Evaluates core investment pillars across market breadth, traction, financing structure, and governance.
    claimRefs:
      - CV004
      - CV006
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          ARR grows 50% YoY to $675M by 2028; autonomous RCM drives gross margin expansion to 75%; successful public
          listing
        - $13.5B enterprise valuation (20.0x ARR multiple) generating 1.9x MOIC and ~25% annualized IRR
        - Regulatory scrutiny on autonomous billing or antitrust obstacles in health system software consolidation
        - High market adoption of multi-EHR agentic workflows across non-HCA health systems (25% probability)
      - - Base Case
        - ARR compounds at 40% YoY to $400M by 2028; steady HCA expansion and moderate market share gains in RCM
        - $7.2B enterprise valuation (18.0x ARR multiple) generating 1.0x-1.1x capital preservation / modest upside
        - Lengthening enterprise sales cycles and partial customer churn among community hospital networks
        - Continued steady expansion with current 130+ health systems and enterprise RCM adoption (55% probability)
      - - Bear Case
        - >-
          ARR growth slows to 15% YoY ($265M by 2028); CVF cash encumbrance and customer concentration attrition trigger
          multiple compression
        - $2.65B enterprise valuation (10.0x ARR multiple) representing a 62% drawdown from the $7.0B post-money mark
        - >-
          Severe health system IT budget freezes, marquee customer churn, or adverse audit findings in revenue-share
          accounting
        - Inability to attract independent outside lead investor or slowdown in enterprise rollouts (20% probability)
    notes: >-
      Scenario projections assume a 2-year holding period through mid-2028 based on reported May 2026 $200M contracted
      ARR baseline.
    claimRefs:
      - CV001
      - CV003
      - CV011
      - CV012
