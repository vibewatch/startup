  - id: FE001
    title: CommureOS Enterprise Healthcare AI Technology Stack
    type: stack
    summary: >-
      Six-layer architectural model showing data ingestion, EHR interoperability, ambient NLP, workflow orchestration,
      autonomous coding, and governance controls.
    approximationNotes: >-
      Architectural layers reflect functional decomposition from engineering disclosures and integration specifications;
      internal microservices topologies are proprietary.
    claimRefs:
