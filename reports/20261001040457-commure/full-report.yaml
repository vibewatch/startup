  - id: TV001
    title: Recommendation summary table
    columns:
      - Metric / Dimension
      - Assessment
      - Supporting Evidence
      - Decision Implication
    rows:
      - - Recommendation
        - BUY
        - Category-leading enterprise footprint across 500+ health systems and HCA Healthcare anchor deployment
        - Overweight position supported by sticky enterprise revenue cycle integrations and expanding ARR
