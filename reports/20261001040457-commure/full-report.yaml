        - Monitor hospital procurement cycles and healthcare provider capital expenditure trends
      - - Valuation Stance
        - Fair
        - $7.0B post-money valuation at 35.0x ARR reflects 17% step-up since 2023 Athelas merger
        - Entry price reflects platform premium over single-point documentation copilots
