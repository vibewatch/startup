      - [Abridge, "Enterprise ambient documentation", "Unknown in assigned evidence", "Enterprise health systems", "Directly framed as a Commure comparison", "Fetched comparison evidence is incomplete for pricing and feature scoring"]
      - [Qventus, "AI care-operations automation", "$105M Series D and approximately $400.12M valuation reported for January 2025", "Health systems", "Capacity and workflow automation with reported ROI orientation", "Adjacent rather than evidenced end-to-end RCM replacement"]
      - [Innovaccer, "Healthcare data and analytics platform", "$275M Series F reported for January 2025", "Providers and payers", "Data unification and value-based-care analytics", "No current like-for-like price or implementation comparison in assigned evidence"]
      - ["Native EHR, point tools, or internal build", "Incumbent and status-quo substitute", "Not applicable", "Health systems with internal IT capacity", "Existing data access, governance, and local control", "Fragmentation, integration burden, and total cost are not independently quantified"]
    notes: >-
      Partial landscape based only on the assigned prefetched sources; funding and valuation
      figures are third-party reported, company scale is company-claimed, and unknown fields
      are not inferred.
    claimRefs: [CP001, CP003, CP008, CP013, CP014, CP015]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Commure, BastionGPT, Abridge, "Native EHR / internal build"]
    rows:
      - ["Ambient clinical documentation", "Yes; enterprise and self-serve surfaces described", "Yes; competitor describes unlimited scribe", "Yes; comparison page frames enterprise documentation overlap", "Variable; existing or internally assembled"]
      - ["Coding and revenue-cycle automation", "Yes; coding, claims, denials, and payments described", "Coding review support described; end-to-end RCM not evidenced", "Unknown in assigned evidence", "Variable across EHR and point tools"]
      - ["Enterprise EHR integration", "60+ EHRs claimed", "Works alongside 50+ systems claimed by competitor; direct write-back depth not established", "Unknown in assigned evidence", "Native access can be strong; cross-system integration varies"]
      - ["Published self-serve pricing", "Scribe pricing reported; enterprise platform quote-only", "$20-$75 per user per month published by competitor", "Unknown in assigned evidence", "Internal cost is not publicly comparable"]
      - ["Patient access through payment breadth", "Yes; end-to-end product map described", "No comparable breadth evidenced", "Unknown in assigned evidence", "Possible through multiple modules and internal integration"]
      - ["Owned EMR direction", "Athelas Air identified as Commure's EMR offering", "Not evidenced", "Not evidenced", "Incumbent EHR already owned or contracted"]
    notes: >-
      Cells reflect public evidence availability, not a product certification. "Unknown"
      means the assigned fetched sources did not support a determination; competitor-authored
      claims are not treated as independent benchmarks.
    claimRefs: [CP001, CP002, CP006, CP008, CP009, CP010, CP013, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Offer, Public price, Unit and contract model, Included scope, Qualification, Implication]
    rows:
      - ["Commure enterprise platform", "Not published", "Custom sales process", "Ambient, coding, RCM, patient access, and related workflows", "Competitor-issued comparison says enterprise products are quoted", "High scope but low price transparency"]
      - ["Commure Scribe Pro monthly", "$89", "Per month", "Documentation with coding and template features described", "Price reported by a competitor comparison, not reverified from a retained Commure pricing page", "Higher visible entry price than focused substitute"]
      - ["Commure Scribe Pro annual", "$59 monthly; $708 upfront", "Annual billing", "Same product tier", "Different billing period from monthly offer", "Annual commitment lowers displayed monthly equivalent"]
      - ["BastionGPT Professional / Plus / Ultra", "$20 / $45 / $75", "Per user per month", "Scribe and assistant scope varies by plan", "Vendor-authored competitor page", "Transparent low-end pressure in small-practice segment"]
      - ["Commure Perform", "$125 starting price", "Per month; flat rate", "Legacy charge-capture product listing", "Archived Capterra page with one visible review; not current enterprise suite pricing", "Historical product price is not a current platform benchmark"]
      - ["Abridge, Qventus, and Innovaccer", "Unknown", "Unknown", "Enterprise workflow products", "No retained source supplied comparable current pricing", "Request normalized proposals before underwriting price advantage"]
    notes: >-
      Prices cover different products, dates, units, and feature sets and are not directly
      comparable. No discounts, implementation fees, realized contract values, or enterprise
      total cost of ownership were available in the assigned evidence.
    claimRefs: [CP009, CP010, CP011, CP012]
figures:
  - id: FP001
    title: Ordinal positioning by workflow breadth and deployment intensity
    type: quadrant
    summary: >-
      Analytical 1-5 scores place broader, implementation-heavy platforms toward the upper
      right and focused self-serve substitutes toward the lower left.
    data:
      points:
        - label: Commure
          x: 5
          y: 5
          detail: "Broad ambient-to-payment scope with enterprise integrations and HCA deployment relationship."
        - label: BastionGPT
          x: 2
          y: 1
          detail: "Focused self-serve scribe and assistant with transparent pricing."
        - label: Abridge
          x: 2
          y: 4
          detail: "Enterprise ambient documentation peer; broader scope was not established in assigned evidence."
        - label: Qventus
          x: 2
          y: 4
          detail: "Enterprise care-operations automation adjacent to Commure's workflow footprint."
        - label: Innovaccer
          x: 3
          y: 4
          detail: "Enterprise data and analytics platform with broader infrastructure positioning."
        - label: "Native EHR / internal build"
          x: 4
          y: 5
          detail: "Potentially broad and deeply embedded, but assembled through incumbent and internal capabilities."
    approximationNotes: >-
      X is an ordinal 1-5 assessment of evidenced workflow breadth; Y is an ordinal 1-5
      assessment of deployment intensity. Scores are analyst synthesis from the retained
      sources, not measured market data, and unknown features were not scored as present.
    claimRefs: [CP016]
callouts:
  - calloutType: strength
    title: Distribution is the most defensible public differentiator
    body: >-
      The HCA relationship, 60+ claimed EHR integrations, and multi-stage revenue-cycle
      coverage create more defensibility than any isolated AI feature visible in this
      evidence set.
    claimRefs: [CP002, CP004, CP005, CP015]
  - calloutType: risk
    title: Public evidence does not prove price-performance leadership
    body: >-
      Lower-priced focused products are visible, but normalized enterprise proposals,
      independent feature tests, retention, and switching outcomes are missing.
    claimRefs: [CP009, CP010, CP012, CP016]
