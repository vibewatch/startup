chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业基本信息、成立沿革与运营模式
        blocks:
          - type: paragraph
            body: >-
              Commure, Inc. 是一家企业级医疗技术平台公司，总部设在加利福尼亚州 Mountain View 的 1300 Terra Bella Avenue。公司于 2017 年由风险投资机构 General
              Catalyst 孵化创立，起初旨在搭建一套基于 FHIR 原生标准的开放式操作系统，打通医院四分五裂的数据架构。历经九年发展，Commure
              从底层开发者基础设施提供商，演进为全栈临床智能与自主收入周期管理（RCM）平台。其核心软件组合打通了前端患者准入、中端环境式临床文书记录与后端账单对账。通过直接接入 60 多套电子健康记录（EHR）系统部署智能体
              AI，Commure 实现了常规临床记录、计费捕获与保险理赔主张拒付管理自动化，把耗费大量人力的医院行政事务转变为自动化软件工作流。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO010
              - CO014
      - number: '1.2'
        title: 管理层架构、公司治理与整合历程
        blocks:
          - type: paragraph
            body: >-
              Commure 的管理团队在一系列里程碑式企业整合中成形，其中最关键的是 2023 年 10 月与 Athelas 的合并。18 岁在斯坦福大学宿舍创办 Athelas 的 Tanay Tandon
              出任合并后公司的首席执行官，大力推动向应用机器学习与医疗智能体工作流转型。公司治理以联合创始人兼董事长 Hemant Taneja 为核心，后者身为 General Catalyst 首席执行官，主导了
              Commure 的早期孵化并牵线各家医疗系统合作。完成 Athelas 合并后，Commure 于 2024 年斥资 $139 million 收购公开上市的环境式临床记录先驱 Augmedix，吸纳创始人
              Ian Shakil 的临床文档团队，进一步拓宽临床能力。监管与合规运营由总裁 Dan Warner 掌舵，其牵头推动 Commure 在欧盟 MDR 2017/745 框架下取得 I
              类医疗器械认证，并完成在英国药品与保健品监管局（MHRA）的注册。
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 资本架构、业务规模指标与投资方阵容
        blocks:
          - type: paragraph
            body: >-
              Commure 的资产负债表获得顶级机构重金背书，横跨股权与非稀释性成长资本工具，累计融资总额逾 $890 million。2026 年 5 月，Commure 完成由 General Catalyst 领投的
              $70 million 成长轮融资，投后估值达 $7.0 billion，Sequoia Capital、Morgan Stanley 及 Kirkland & Ellis 参投。该笔股权融资与 2025 年 6
              月从 General Catalyst 客户价值基金（CVF）获得的 $200 million
              成长融资工具形成互补——该融资结构以绩效挂钩形式为获客与产品实施垫资，通过客群收入分成还款，不稀释母公司股权。公司商业化规模扩张迅猛，截至 2025 年 6 月，签约年经常性收入（ARR）已连续三年翻番，突破
              $200 million。Commure 目前为 130 多家医疗系统、500 多家医疗机构和 3,000 多个诊疗网点提供运营支撑，年处理数十亿美元理赔账单，据称自主执行率达 85%。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO008
              - CO011
      - number: '1.4'
        title: 运营演进、技术里程碑与治理边界
        blocks:
          - type: paragraph
            body: >-
              Commure 的运营历程经历了清晰的发展阶段：早期依托风投融资起步（如 2021 年的 $250 million Series D 轮），继而借助收购 Athelas、Augmedix 及 Memora
              Health 推进纵向整合，最终迈向全国性机构规模。其最具代表性的商业里程碑是与 HCA Healthcare 达成合作，后者选定 Commure 在其 188 家医院和 2,400
              个诊疗网点全线部署环境式临床智能。然而，机构级尽调也揭示了显著的运营制约与治理边界。独立架构评估表明，Commure 高度依赖自研封装的 OpenAI
              基础模型集成，未提供用户可配置的模型路由、外部可观测性追踪或开放 API 扩展能力。此外，Commure
              的标准企业条款强制要求个人独立仲裁并放弃集体诉讼，且明确免除对医疗决策或诊疗医生资质审核的责任，在医务人员责任与软件法律责任之间划定了严格界限。
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO012
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
