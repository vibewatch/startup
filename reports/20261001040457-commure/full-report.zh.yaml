            title: 机构分发能力是公开信息中最稳固的差异化壁垒
            body: HCA 的深度绑定、号称对接 60+ 套 EHR 的互联能力，以及覆盖收入周期多阶段的业务广度，比起公开材料里任何孤立的 AI 功能点都更具防守壁垒。
