        - ARR 同比增长 50%，到 2028 年达到 $675M；自主 RCM 推动毛利率扩张至 75%；成功实现公开上市
        - 企业估值达 $13.5B（20.0x ARR 倍数），实现 1.9x MOIC 及约 25% 的年化 IRR
        - 自主账单计费遭遇监管审查，或医疗系统软件整合面临反垄断阻力
        - 非 HCA 体系医疗机构对跨 EHR 智能体工作流采纳率极高（25% 概率）
      - - 基准情景
        - ARR 复合年增长率达 40%，到 2028 年达到 $400M；在 HCA 稳健推开，并在 RCM 领域获得适度份额提升
        - 企业估值达 $7.2B（18.0x ARR 倍数），实现 1.0x-1.1x 的资金保值及温和上行收益
        - 企业级销售周期拉长，且社区医院网络客户出现部分流失
        - 在现有 130+ 家医疗系统中持续稳步推开，并在企业级 RCM 保持良好采纳势头（55% 概率）
      - - 悲观情景
        - ARR 增速放缓至同比 15%（2028 年达到 $265M）；CVF 现金流分成负担叠加客户流失触发估值倍数严重压缩
        - 企业估值压缩至 $2.65B（10.0x ARR 倍数），较 $7.0B 投后估值回撤 62%
        - 医疗系统 IT 预算出现严重冻结、标杆大客户流失，或收入分成会计处理遭遇不利审计结论
        - 未能引入独立的外部领投机构，或企业级全面上线落地进度放缓（20% 概率）
    notes: 情景预测基于已披露的 2026 年 5 月 $200M 已签约 ARR 为基准，假定截至 2028 年中的 2 年投资持有期。
