        title: 公开业务指标口径不一，难以拼凑出连贯的时间序列
        blocks:
          - type: paragraph
            body: >-
              公开渠道中最为强劲的财务信号彼此口径各异。GetLatka 估计其 2024 年年度收入为 $176.2 million，而 Silicon Valley Investment Club 则报道截至 2025 年
              6 月其 ARR 历经三年翻番已突破 $200 million。Commure 领英主页宣称连续两年实现超过 300% 的同比增速，却未说明具体统计指标与测算日期。Multiples 将 $200 million
              记为 2026 年 5 月的收入，但也明确提示该口径可能是年度收入、ARR、收入运行率或过去 12
              个月（LTM）收入。这些数字很可能各自指代不同的时间段或统计口径，不能直接拼成增长曲线。证据确实表明其具备一定商业规模，但无法得出关于当前实际收入、ARR、内生增长率或收入确认规则的明确结论。
