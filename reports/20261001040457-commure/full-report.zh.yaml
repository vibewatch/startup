  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户客群细分与商业化覆盖规模
        blocks:
          - type: paragraph
            body: >-
              Commure 将客户群体划分为两大主要商业梯队：一类是顶级大型急诊医疗系统，另一类是中端市场或独立医生诊所。在大型医疗系统端，其标杆客户主要与投资方生态重叠，最突出的是 HCA Healthcare（涵盖
              188 家医院和约 2,400 个门诊医疗网点）以及 Tenet Healthcare 旗下的 Tenet Physician Resources。这些大型医疗机构签约采购环境式 AI 临床记录、跨多套 EHR
              的临床智能及端到端收入周期管理（RCM）。从整体客户规模看，Commure 官方披露已进入 500 多家医疗机构和 3,000 多个诊疗网点，宣称活跃医务人员超过 500,000 人，年处理理赔金额逾 $25
              billion。除大型医院外，Commure 还通过 Athelas Air
              电子病历（EMR）与诊所管理软件覆盖独立门诊与多专科诊所。然而，其客户基本盘呈现明显分化：大型系统多为具备股权或基金利益绑定的战略共建伙伴，而独立诊所主要采纳模块化的 RCM 或环境式工具来缓解繁重行政开销。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
