      - number: '4.4'
        title: 融资估值难掩流动性缺口，不能直接推导资金充裕度
        blocks:
          - type: paragraph
            body: >-
              据 HIT Consultant 报道，Commure 于 2026 年 5 月完成一轮投后估值 $7 billion 的 $70 million
              融资。这笔交易证实了公司的融资通道依然畅通，但融到资金并不等同于账面可用现金，高估值也不代表经营业绩优异。各数据库记录的累计融资金额与融资轮次存在重大出入，反映出并购交易、复杂融资结构以及各家统计标准存在混杂。现有证据均未披露经审计的现金余额、单月烧钱率、资金跑道、还款时间表、清偿顺序瀑布、资金用途规划或下一轮融资触发条件。同样缺失的还有毛利率、NRR、GRR、客群流失率、CAC/回本周期以及头部客户收入集中度。因此，财务层面的定论必须附加审慎前提：产品广度与大客户分发或许能支撑稳固收入，但收入质量、利润率改善空间、资本密集度及外部融资依赖度，仍是数据室核验必须攻克的实质性障碍。
            claimRefs:
              - CI014
              - CI015
              - CI016
