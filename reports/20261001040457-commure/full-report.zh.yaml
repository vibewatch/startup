  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入架构纵深宽广，但变现机制依然模糊
        blocks:
          - type: paragraph
            body: >-
              Commure 将平台铺展至患者准入、临床记录、编码、索赔、拒赔及款项回收全流程，形成了多个潜在的企业级软件收入来源。其官网称，平台年处理理赔金额逾 $25 billion，并集成 60+ 套
              EHR，但这只是业务吞吐量与分发广度的信号，不等于实际收入、ARR、提成比例（take rate）或毛利润。Orchestrator
              产品把转诊接诊自动化从接收一路延伸至入院，但现有产品页面并未披露价格、计费单元、最低保底承诺或实际合同金额。分析师数据库将公司整体商业模式标注为订阅制，但没有任何一手证据表明具体模块是按医生、网点、就诊人次、理赔单量、追回金额还是企业全包牌照来收费。因此，其收入质量完全取决于未公开的合同明细。
