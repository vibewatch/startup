      - number: '5.4'
        title: 技术差异化壁垒、合规认证与安全管控
        blocks:
          - type: paragraph
            body: >-
              在拥挤的医疗 AI 赛道中，Commure 凭借机构级联合研发合作与正式医疗软件合规认证形成了独特壁垒。公司联合 HCA Healthcare
              专门面向急诊科与住院科医生工作流定制研发环境式平台，直接将前置部署工程师派驻至医院业务科室一线。监管合规是一道关键准入门槛：Commure Ambient AI 已依据欧盟 MDR 2017/745 取得 I
              类医疗器械软件 CE 标志自我认证，并依据《2002 年医疗器械法规》在英国 MHRA 成功注册。鉴于该软件仅用于草拟病历初稿且必须经过临床医生强制审阅确认，不属于自主做出诊断结论的系统，因此符合 MDR 规则
              11 下的 I 类界定。其技术文件收录了 ISO 14971 风险分析、IEC 62366-1 医疗器械可用性工程测试以及英国 GDPR 数据本地化合规条款。然而，公开披露中缺乏第三方出具的 SOC 2 Type
              II 审计报告、次级数据处理方清单及详尽的多网点可用性 SLA 承诺，仍对机构级技术尽调构成制约。
            claimRefs:
              - CE002
              - CE004
              - CE007
              - CE009
              - CE013
              - CE014
