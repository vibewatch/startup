  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 模块化产品矩阵与临床工作流深度咬合
        blocks:
          - type: paragraph
            body: >-
              Commure 并未将自身定位为孤立点状工具的拼盘，而是打造为消除全流程医疗行政负担的综合操作系统。其核心产品为 Commure Ambient
              AI，这款环境式临床记录方案可实时捕获医患多方对话，并自动合成为结构化病历初稿。临床医生保留最终质控权，需在审阅、编辑后签名确认，再将病历归档至电子病历系统。除环境式听写外，该套件还涵盖自主收入周期管理（RCM）、用于预约挂号的
              AI 呼叫中心智能体，以及 2026 年 6 月推出的转诊平台 Commure
              Orchestrator——后者能从非结构化的外来转诊单中自动抽取结构化临床与保险信息。此外，产品线还整合了早期收购资产，如用于护士紧急求助安全的可穿戴 RTLS 报警工牌 Strongline，以及
              PatientKeeper 医生移动查房软件。这套全景版图旨在缝合碎片化的医院 IT 架构，但多次并购的历史也要求尽调查明底层平台的协同度与实际集成深度。
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE008
      - number: '5.2'
        title: 诊前接诊、环境式速记与自主编码流水线
        blocks:
          - type: paragraph
            body: >-
              Commure 平台运转的飞轮在于打通前端诊疗交互文书与后端收入周期自动化。在常规医院运作中，病历撰写与医疗编码往往脱节串行，极易产生周转拖延、转录差错与医保拒赔。Commure
              消除这种阻力的做法，是将环境式生成的临床文书直接灌入自主编码与计费捕获引擎。在门诊及专科诊所中，据客户公开反馈的运营指标显示，该方案大幅提升了记录效率，成熟项目中病历差错率最高降低 31%，拒赔率压低至 2%
              以下。在业务前置环节，Commure Orchestrator
              通过自动接收传真与电子转诊单、核验医保资质规则并派发排班任务，实现了诊前流程自动化。尽管全链路工作流省去了人工交接，但复杂的跨专科手术病例和非标准转诊传真件仍需人工例外复核与专业编码员把关。
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE008
              - CE011
      - number: '5.3'
        title: 流式集成架构与多厂商 EMR 互操作性
        blocks:
          - type: paragraph
            body: >-
              作为一套解耦于各家 EHR 的通用平台，必须在保障临床即时响应的前提下，与主流电子病历系统实现高通量双向集成。Commure 依托基于 Apache Flink
              构建的云原生流式集成引擎，实时处理各类临床终端产生的高频医疗事件。平台抛弃单一依赖老旧 HL7 接口机的做法，部署现代事件流管道，通过 HL7 v2、HL7 v3 及 FHIR RESTful 接口与 40
              多套电子病历系统互联。在 MEDITECH 等专属合作伙伴生态中，Commure Ambient Suite 实现了与 EHR 工作流的原生集成，并支持云托管 MEDITECH as a
              Service（MaaS）环境。在交互层，工程团队重点优化了界面响应性能，利用前端渲染调优与 WebSocket 状态同步，将病历录入界面的打字延迟由 1200ms 大幅降至
              95ms。维系如此深度的对接，离不开一支深谙各家闭源 EHR 接口逆向工程并在多云环境中管理分布式 Kubernetes 集群的 AI 集成攻坚团队。
            claimRefs:
              - CE003
              - CE005
              - CE010
              - CE011
              - CE012
