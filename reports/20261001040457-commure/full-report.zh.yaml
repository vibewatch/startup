        title: 辅助图表
        blocks:
          - type: callout
            title: 环境式速记与自主收入周期管理的全面交汇
            body: Commure 的核心技术与商业壁垒在于连通临床记录与收入周期自动化。将结构化环境式病历直连自主编码与计费规则引擎后，该平台压低保险理赔主张遭拒比例、加快资金回笼的效果，显著优于孤立的单点文书记录工具。
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE006
          - type: callout
            title: 并购整合复杂度与第三方安全验证缺口
            body: >-
              强行将 Athelas、Augmedix、PatientKeeper 和 Strongline 拼装成统一套件，在异构代码库之间积聚了技术债与协同开销。此外，大型医疗系统仍需警惕云端环境式模型缺乏直接公开的
              SOC 2 Type II 审计材料与次级处理方清单这一合规风险。
            calloutType: risk
            claimRefs:
