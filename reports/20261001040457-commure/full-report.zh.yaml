      nodes:
        - id: N1
          label: 患者准入与转诊分诊
          detail: 门诊接诊排班、资质核实、预先授权及转诊信息接入
        - id: N2
          label: 临床诊疗问诊与文书记录
          detail: 环境式文书记录与临床智能引擎生成业务工作流数据
        - id: N3
          label: 医疗编码与收费捕获
          detail: 临床诊疗活动被转换为医疗编码与账单收费条目
        - id: N4
          label: 索赔申报与拒赔申诉流程
          detail: RCM 自动化系统处理申报提交、对账调解、拒赔处理与申诉
        - id: N5
          label: 账单支付与款项回收
          detail: 客户财务资金流完成结算处理，但 Commure 的抽佣费率分母未予公开
        - id: N6
          label: Commure 确认收入与毛利润
          detail: 已确认收入、业务收入构成、实际实现单价及毛利率水平均未予披露
      edges:
        - from: N1
          to: N2
        - from: N2
          to: N3
        - from: N3
          to: N4
        - from: N4
          to: N5
        - from: N5
          to: N6
    approximationNotes: 此图展示定性业务工作流而非数值转化漏斗；未从业务运营量中推导转化率、分成比例、确认收入或毛利润数值。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI016
  - id: FE001
    title: CommureOS 企业级医疗 AI 技术架构栈
    type: stack
    summary: 由数据采集接入、EHR 互操作性、环境式 NLP、工作流编排调度、自主编码及监管合规控制构成的六层架构模型。
    approximationNotes: 架构层级系基于工程公开资料与系统集成规范的功能性拆解；内部微服务拓扑结构属商业专有秘密。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE012
      - CE014
    data:
      layers:
        - label: 客户端与交互采集层
          detail: 面向各类临床与运营场景的多模态输入交互界面
          modules:
            - 诊室环境式麦克风与 iOS/Android 移动端应用
            - 语音听写与光标直输客户端（95ms 低延迟）
            - 患者准入与数字化接诊门户
            - 可穿戴 RTLS 医护人员紧急求助胸牌（Strongline）
        - label: 数据摄取与流处理管道
          detail: 高吞吐量、实时的医疗数据交换处理管道
          modules:
            - 云原生流式集成引擎（Apache Flink）
            - 非结构化文档与转诊单解析管道（Orchestrator）
            - 全渠道电话通信与呼入语音流处理器
        - label: EHR 互操作性与连接器层
          detail: 面向医疗系统底层数据的双向数据交换与病历回写
          modules:
            - HL7 v2/v3 消息代理与 FHIR RESTful 接口
            - 覆盖 40+ 套 EHR/EMR 平台的双向连接器
            - 与 MEDITECH EHR 系统的直接集成（兼容 MaaS）
            - 自动逆向工程封装的 EHR 系统适配器
        - label: 临床 NLP 与环境式智能
          detail: 声学语音处理、说话人分离及结构化病历合成
          modules:
            - 医疗专科声学语音转文字与说话人日志分离
            - 面向专科临床场景的病历智能合成引擎
            - 医生审阅与签名确认工作流
            - 问诊前病历历史背景上下文自动导入
        - label: 智能体自动化与收入引擎
          detail: 中端医疗编码、预先授权审批与电话呼叫智能路由
          modules:
            - 自主医疗编码与 CDI 临床文书改进集成
            - 医保规则引擎与实时预先授权审批
            - 动态 AI 呼叫中心智能体与智能排班挂号机器人
            - 统一理赔单智能审核与拒赔事前预防队列
        - label: 信任、合规与治理层
          detail: 监管注册认证、医疗器械标准合规与数据本地化
          modules:
            - 欧盟 MDR 2017/745 认证的 CE 标识 I 类软件
            - 英国 Medical Devices Regs 2002 下的 MHRA 注册
            - ISO 14971 风险分析与 IEC 62366-1 可用性工程标准
            - 符合 HIPAA 的安全控制措施与英国区域数据本地化存储
  - id: FU001
    title: 客户落地采纳路径图
    type: journey-map
    summary: 直观展示医疗系统与诊所从最初接入环境式 AI 或 EMR，到向企业级 RCM 扩展并形成全系统深度绑定的临床与管理触点。
    data:
      nodes:
        - label: 初期接入上线
          stage: Initial Onboarding
          title: Clinician Workflow Integration
          description: 医疗系统与门诊诊所试点环境式 AI 速记或 Athelas Air EMR，以立即缓解医生临床文书疲劳。
          touchpoints:
            - Multi-EHR integration (Epic, Athenahealth, ECW)
            - Mobile provider app setup
            - Specialty workflow mapping
        - label: 中期深入采纳
          stage: Mid-Cycle Adoption
          title: Clinical Intelligence Expansion
          description: 使用场景从环境式录音拓展至自动化医疗编码、费用捕获及医疗团队协作。
          touchpoints:
            - Real-time care cues
            - Automated chart completion
            - Emergency department rollout
        - label: 后端深度锁定
          stage: Back-End Lock-In
          title: Autonomous RCM Integration
          description: 医疗机构将全套账单计费、拒赔申诉与收入完整性管理全面迁移至 Commure 自动化平台。
          touchpoints:
            - Autonomous claims processing
            - Payer rule reconciliation
            - Revenue cycle analytics
        - label: 全院级规模推广
          stage: Enterprise Scaling
          title: Network-Wide Standardization
          description: 核心基石医疗系统（如 HCA、Tenet）在全区域各院区推行标准化作业，形成极强的运营粘性。
          touchpoints:
            - Executive governance reviews
            - Cross-facility performance tracking
            - Referral and co-development programs
        - label: 跨业务系统延展
          stage: System Expansion
          title: Multi-Facility Cross-Sell
          description: 跨越急性期住院院区、门诊日间手术中心及区域专科医生网络展开横向扩张。
          touchpoints:
            - Inpatient charge reconciliation
            - Enterprise contract renewal
            - Cross-department KPI alignment
        - label: 平台成熟运行
          stage: Platform Maturity
          title: Operating System Entrenchment
          description: Commure 成为贯穿整个综合医疗交付网络（IDN）全部临床病历撰写与收入运营的核心行动系统。
          touchpoints:
            - Automated denial appeals
            - System-wide financial reporting
            - Consolidated vendor replacement
    approximationNotes: 依据 Commure 模块化平台架构、实施落地操作手册及已披露的医疗系统推广里程碑综合梳理。
    claimRefs:
      - CU001
      - CU004
      - CU009
