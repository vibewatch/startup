            body: 在下达可靠的收入质量或资金充裕度结论之前，必须要求对方出具经审计的实际收入、ARR 定义、业务收入构成、毛利率、客户留存率、集中度、现金头寸、烧钱速度、资金跑道以及债务和结构化融资条款。
