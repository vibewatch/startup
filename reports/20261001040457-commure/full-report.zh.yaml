      - number: '6.2'
        title: 标杆案例落地与推广节奏
        blocks:
          - type: paragraph
            body: >-
              Commure 的实际部署证据主要扎堆在其高调宣扬的标杆企业客户上，但各业务模块在生产环境中的全量铺开程度参差不齐。其旗舰级合作方是 HCA Healthcare——在 2024 年 10 月收购
              Augmedix 后，HCA 选定 Commure 在其全国网络中研发并部署环境式 AI 平台。该方案由 Commure 与 HCA 护理转型与创新部门联合共创，主要面向急诊科、住院科及门诊诊所。HCA
              签署的正式企业协议最初仅涵盖选定机构的共建研发与分期部署，后续计划逐步推广至其每年 4300 万人次的患者就诊场景。Tenet Healthcare 方面，Tenet Physician Resources
              首席执行官 Philipp Ludwig 曾公开为 Commure 站台，肯定其以医患为核心的平台架构，并提及在全国医生网络中的推开成效。官方披露数据还包括年处理 4000 万次环境式门诊记录，以及 RCM
              计费工作流自主执行率超 85%。然而，除去这几家兼具投资方背景的样板客户外，经第三方独立核实的医院级全量切换公开案例依然罕见，独立诊所上线时也常遭遇跨 EHR 同步延迟瓶颈。
