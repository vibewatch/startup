      - number: '3.3'
        title: 定价与产品打包压力
        blocks:
          - type: paragraph
            body: >-
              公开定价数据在小型诊所市场最为清晰，但在大型机构合同中依然密不透光。一份竞品对比资料显示 Commure Scribe Pro 月费为 $89，年付折合每月 $59；BastionGPT 则公开列出每位用户每月
              $20 至 $75 的套餐。Capterra 存档页面显示早期 Commure Perform 产品起售价为固定费率每月
              $125。由于这些产品版本、计费单元和覆盖范围各不相同，不能直接当做同维度的比价基准。但这也表明，专注型供应商往往能让采购流程更简单、价格更透明。目前公开证据中完全查不到
              Commure、Abridge、Qventus 及 Innovaccer 的企业级定价，这是实质性的尽调缺口。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河持久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              Commure 的护城河更多依赖落地部署深度而非纯算法优势：工作流广度、EHR
              互联深度、内嵌收入周期数据以及标杆医疗机构背书，一旦多款模块接入同一底座，客户切换成本就会显著抬高。然而，战线过长也会带来执行风险。追求精简快速的运营模式与多产品线扩张虽能加快交付，但买方必须验证其集成能力是否具备标准化复用性，而非纯定制化项目。专注型竞品可能凭借更低价格、更快的自助上线或更深的专科工作流发起冲击，而传统
              EHR 巨头与医院内部 IT 团队始终牢牢掌控着渠道分发与底层数据接口。因此，定位图仅为分析维度的排序视角，而非独立基准评估：它突出了 Commure
              的业务广度与部署深度，却不能证明市场份额能否持久，也不能证明总体成本更低或产出更优。
            claimRefs:
              - CP007
              - CP008
              - CP015
              - CP016
