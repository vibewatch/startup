  - id: FV001
    title: 投资建议推导逻辑
    type: flow
    summary: 串联机构规模、收入动能、治理风险、情景回报及最终投资建议的决策流程。
    approximationNotes: null
    data:
      nodes:
        - id: enterprise-scale
          label: 机构规模与落地覆盖
          detail: 落地 500+ 家医疗机构、3,000+ 个诊疗网点，并与 HCA Healthcare 达成覆盖 188 家医院的独家合作。
        - id: revenue-traction
          label: 商业化动能与增长
          detail: 签约 ARR 连续三年翻番至 $200M+，并获得 $200M CVF 成长信贷支持，实现非稀释性扩张。
        - id: market-positioning
          label: 全景 OS 平台护城河
          detail: 集成 60+ 套 EHR 系统，具备覆盖环境式 AI、自主编码及端到端 RCM 自动化的全栈能力。
        - id: governance-evaluation
          label: 治理与内部人定价审查
          detail: General Catalyst 屡次以内部人身份领投，且 17% 的温和估值抬升已计入中等风险水平。
        - id: scenario-return
          label: 风险调整后回报画像
          detail: 基准情景提供本金保护（对应 18x ARR，估值 $7.2B），而一旦具备公开上市条件，乐观情景可释放 $13.5B（1.9x MOIC）。
        - id: investment-decision
          label: 投资建议：BUY（中等置信度）
          detail: 无可比拟的医疗机构分发网络与收入周期企业级集成广度，足以支撑超配定调。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV009
      - CV010
