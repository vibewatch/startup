            title: 各项业务指标口径不可混为一谈
            body: 公开信源交替报道年度收入、ARR，以及可能代表收入、ARR、运行率或过去 12 个月收入的融资挂钩数值。把这些指标强行串联成增长曲线，只会造成虚假精度。
            calloutType: risk
            claimRefs:
