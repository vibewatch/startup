      - number: '4.2'
        title: 企业级 GTM 具备标杆背书，但获客效率未经验证
        blocks:
          - type: paragraph
            body: >-
              HCA 的战略合作证明了其打入大型机构客户的能力：HCA 选定 Commure 作为独家环境式 AI 研发与部署伙伴。然而，2024 年 10
              月的公告明确指出双方仍在商讨正式的企业服务协议，因而无法证实实际执行的商务条款、实施费收入、续约条件或客户集中度。公司发布的一份财务招聘公告显示，这家 Pre-IPO
              企业正在建立正规的研发与日常管理预算规划、人员编制控制、供应商优化、财务预测及资本效率分析机制。Commure
              招聘页面另称公司实行精简编制、不设纯管理岗。这些都是正向的成本管控信号，但并未给出具体的销售周期长度、CAC、回本周期、实施人力消耗、云与模型成本，亦未披露专业服务毛利率。大客户触达能力清晰可见，但销售效率与交付杠杆仍不明确。
            claimRefs:
              - CI006
