              - CO004
              - CO008
              - CO009
      - number: '1.5'
        title: 辅助图表
        blocks:
          - type: callout
            title: 标杆医疗系统构筑的分发护城河
            body: >-
              Commure 与 HCA Healthcare 在 188 家医院及 2,400 个诊疗网点开展联合研发合作，构筑了无可比拟的运营试验场与分发壁垒，在全国性大型机构规模上验证了环境式临床 AI 与 RCM
              自动化的可行性。
            calloutType: strength
            claimRefs:
              - CO004
              - CO010
          - type: callout
            title: 平台扩展性与单一模型供应商风险
            body: 独立架构评估显示，Commure 高度依赖 OpenAI 专有次级数据处理，缺乏用户自选模型路由、可观测性工具或公开开发者 API，带来了潜在的模型供应商集中度风险与治理制约。
            calloutType: risk
            claimRefs:
              - CO012
              - CO013
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入门槛与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              医疗行政支出覆盖广泛的运营环节，横跨患者准入、临床文书记录、编码、索赔提交与拒赔申诉。过去，医疗机构通常将零散的点状软件方案与大量离岸业务流程外包（BPO）及人工病历抽取拼凑在一起，以应对沉重的行政负担。Commure
              打破这一市场边界，将前端接诊、中端临床智能与后端收入保障整合为统一的 AI
              原生操作系统。平台不再充当被动的文档记录库，而是作为主动的行动系统，旨在把临床诊疗过程直接关联至财务账本。传统电子健康记录（EHR）厂商虽提供原生模块，但医疗机构 IT
              架构往往严重割裂，迫切需要跨数十套老旧系统提供与厂商解耦的集成能力。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: TAM、SAM 与 SOM 约束下的测算视角
        blocks:
          - type: paragraph
            body: >-
              评估 Commure 的市场空间，需要将自上而下的宏观资源浪费拆解为可触达的软件实际支出。虽然全美医疗体系宏观行政浪费估计每年约为 $1
              trillion，但软件能截留的预算仅限于特定的机构预算细项。行业分析师共识认为，全美机构级收入周期与临床文书软件整体市场规模约为 $45 billion，其中高增长的 AI 原生自主 RCM
              与环境式智能细分赛道代表了 $14.5 billion 的可服务市场（SAM）。在此边界内，聚焦于急诊医院及寻求整合碎片化计费供应商并实现理赔自动化的大型门诊诊所集团，Commure
              近期直接可获取市场（SOM）估计为 $1.8 billion。能否抓住这一机遇，取决于能否将医疗系统试点协议转化为全院级部署。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM011
      - number: '2.3'
        title: 企业级买方细分、预算归属与采纳经济学
        blocks:
          - type: paragraph
            body: >-
              医疗自动化采购格局呈现高度细分，主要涵盖大型整合医疗服务网络（IDN）、区域社区医疗系统及独立多专科医生诊所。采购决策权通常一分为二：首席财务官倾向于通过压低拒赔率快速找回利润，而首席医疗官则优先考虑借助环境式文书记录减轻医生负担以留住人才。机构采购流程极为严苛，买方更看重合规工作流深度、HIPAA
              达标情况、审计完备性与可验证的落地实施可行性，而非营销宣传中的自述。各家医疗系统基本不再自行研发内部软件，转而拥抱与厂商联合共建的模式，为能够证明清晰投资回报率并实现 EHR
              无缝互操作的机构级平台带来了强劲的扩张东风。
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM010
              - CM014
      - number: '2.4'
        title: 宏观增长驱动力、采纳阻力与尽调风险
        blocks:
          - type: paragraph
            body: >-
              医务人员薪资通胀居高不下、临床人手紧缺叠加医保/商保机构严苛的理赔审查（据行业表述），迫使医疗机构把收入周期自动化视为生死攸关的运营底线。然而，机构推广仍面临切实阻力。医疗机构平均运行 150
              套或更多互不相通的软件系统，在系统落地过程中造成严重的数据标准化摩擦与集成延误。此外，若环境式记录模型生成的病历过于冗长、需要医生手动编辑，一线临床人员的采纳意愿便会受挫。从法律与监管维度看，企业合同必须严格把辅助性运营软件与执业临床诊疗决策区分开来。未来的持续扩张，要求
              Commure 在保持高自主执行率的同时，证明其在各科室具有经得起检验的总体拥有成本优势。
            claimRefs:
              - CM007
              - CM009
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 辅助图表
        blocks:
          - type: callout
            title: 从被动记录系统向自主行动系统的转变
            body: 医疗机构 IT 主管正在降低对核心 EHR 整体换代的优先级，转而青睐能够带来切实投资回报的纵向自动化层，采购重心转向据称可自主执行理赔申报与病历撰写的智能体工作流。
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
          - type: callout
            title: 采购复杂性与跨 EHR 集成延迟
            body: 大型医疗采购受制于严苛的合规、安全审查及老旧系统的跨 EHR 互操作性验证，容易拉长商业化落地周期，形成客户采纳阻力。
            calloutType: risk
            claimRefs:
              - CM008
              - CM010
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方替代选择
        blocks:
          - type: paragraph
            body: >-
              Commure 面临的竞争对手远不止环境式医疗速记厂商。据公司自述，Commure 主打横跨患者准入、临床智能、病历编码、索赔申报、拒赔处理及结算收款的统一数据模型，而独立医疗科技分析将其归入后期 AI
              基础设施与工作流公司阵营，与 Innovaccer、Qventus 等同台并列。Abridge 被视为机构级临床文书记录的直接竞品，BastionGPT 则主打轻量级速记与助手功能切入小型诊所。买方也可以停留在
              EHR 原生报表与单点工具，或在内部自建集成层。这些现状路径固然保住了本地掌控力，却无法解决系统割裂的痛点——而这恰恰是 Commure
              进攻的方向。由此构成了层次分明的竞争格局：环境式直接竞品、相邻工作流平台、传统 EHR 厂商自带工具、聚焦长尾的低价替代方案以及医院自建方案。
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP013
              - CP014
              - CP015
      - number: '3.2'
        title: 功能表现、分发网络与交付壁垒
        blocks:
          - type: paragraph
            body: >-
              Commure 得到证据支撑的最强壁垒在于机构级交付深度。其官网显示平台可对接 60 多套 EHR，且 HCA 官方公告将 Commure 选为独家合作伙伴，在其公告发布时涵盖的 188 家医院及约 2,400
              个诊疗网点研发并部署环境式平台。公司还将触角延伸至自研 EMR 产品 Athelas
              Air，并重点宣传现场驻场设计与前置实施部署。这些动向表明其构筑了点状产品难以逾越的分发与集成护城河。但这些信号并不能证明其在模型准确率、客户留存或实际 ROI
              上占优，公司自述的部署口径在视作独立验证之前，仍需做客户层面的深入尽调。
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
