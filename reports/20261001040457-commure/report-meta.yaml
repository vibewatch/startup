companyProfile:
  summary: >-
    Commure is a late-stage private healthcare AI platform that combines ambient clinical documentation, autonomous
    revenue cycle management, patient access automation, and enterprise workflow integration into a single operating
    layer for large health systems and physician networks. The company is headquartered in Mountain View and has evolved
    through the Commure-Athelas merger and subsequent acquisitions to cover both front-end clinical workflows and
    back-end billing operations.
