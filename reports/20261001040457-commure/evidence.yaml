evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Audited breakdown of HCA Healthcare's exact contribution to Commure's annual recurring revenue and contractual
      renewal schedule.
    whyItMatters: >-
      HCA Healthcare represents Commure's flagship anchor deployment across 188 hospitals; unverified revenue
      concentration creates material single-client dependency risk.
    diligencePath: >-
      Request customer concentration schedule, top-5 customer revenue contribution, and master service agreement renewal
      terms in management diligence.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs: []
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: Complete executive committee organizational chart, reporting lines, and independent board member roster.
    whyItMatters: >-
      Verified disclosures enumerate key leaders but omit functional VPs (finance, engineering, legal) and full board
      committee composition following multiple acquisitions.
    diligencePath: >-
      Request comprehensive cap table, board of directors committee roster, and executive committee employment
      agreements.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Fully diluted capitalization table detailing equity ownership percentages, share classes, liquidation preferences,
      and CVF repayment terms.
    whyItMatters: >-
      General Catalyst holds significant economic and operational influence via incubation, board chairmanship, and the
      $200M Customer Value Fund facility; exact senior liquidation rights impact common share valuation.
    diligencePath: Review certified capitalization table, investor rights agreements, and CVF revenue-sharing repayment covenants.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: long-term-som-saturation
    missingEvidence: >-
      Granular health system penetration data, customer logo retention cohorts, and competitive displacement rates from
      specialized ambient scribing and RCM point solutions.
    whyItMatters: >-
      Without independent disclosure of Commure's customer contract values and churn metrics, long-term SOM conversion
      and market saturation limits cannot be modeled with high confidence.
    diligencePath: >-
      Review audited customer cohort retention reports, average contract value (ACV) distributions, and win/loss records
      across acute hospital procurements.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: minor
    topic: ambient-note-editing-overhead
    missingEvidence: >-
      Standardized multi-center clinical studies measuring physician note editing time and post-generation manual
      correction rates across specialty workflows.
    whyItMatters: >-
      Customer feedback suggests some providers spend unexpected time trimming verbose AI notes, which directly offsets
      projected clinical productivity gains.
    diligencePath: >-
      Obtain objective provider EHR audit logs measuring time spent reviewing and editing ambient draft notes prior to
      final chart signing across pilot hospital sites.
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Normalized enterprise proposals covering price, unit, implementation fees, discounts, minimum commitments, and
      renewal terms for Commure and shortlisted peers.
    whyItMatters: Public self-serve prices cover different scopes and cannot establish enterprise price-performance leadership.
    diligencePath: Run a common-scope RFP and normalize three-year total cost by clinician, encounter, claim, and deployed module.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat
    missingEvidence: >-
      Independent win-loss data, module-level retention, multi-product attach, implementation duration, and completed
      customer migrations away from Commure.
    whyItMatters: Integration breadth suggests switching cost but does not prove durable retention or deployment repeatability.
    diligencePath: >-
      Interview at least five current customers and two former customers, then review renewal cohorts and implementation
      statements of work.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP007
