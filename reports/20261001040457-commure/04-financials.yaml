      - "CI003"
      - "CI004"
      - "CI016"
callouts:
  - calloutType: "risk"
    title: "Metric Labels Are Not Interchangeable"
    body: "The retained sources alternately report annual revenue, ARR, and a round-linked value that may be revenue, ARR, run-rate, or LTM. Connecting those values into a growth curve would create false precision."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
  - calloutType: "recommendation"
    title: "Condition Financial Underwriting on a Data-Room Reconciliation"
    body: "Require audited revenue, ARR definitions, revenue mix, gross margin, retention, customer concentration, cash, burn, runway, debt and structured-financing terms before assigning a durable revenue-quality or capital-adequacy conclusion."
    claimRefs:
      - "CI015"
      - "CI016"
