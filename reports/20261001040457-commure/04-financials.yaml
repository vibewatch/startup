        - "Provide a round-by-round capitalization and cash-proceeds reconciliation"
      - - "Core unit economics"
        - null
        - "Gross margin, NRR, GRR, CAC/payback, burn, and runway are not disclosed in retained evidence"
        - "Unavailable"
        - "Blocks a margin-path and capital-adequacy conclusion"
        - "Provide audited financials and cohort-level unit-economics schedules"
    notes: "Periods and metric names are preserved as published. Revenue, ARR, claims volume, valuation, funding raised, and cash available are distinct and are not substituted for one another."
