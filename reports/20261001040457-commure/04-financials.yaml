          to: "N3"
        - from: "N3"
          to: "N4"
        - from: "N4"
          to: "N5"
        - from: "N5"
          to: "N6"
    approximationNotes: "This is a qualitative workflow, not a conversion funnel; no conversion rate, take rate, revenue, or gross-profit value is inferred from operating volume."
    claimRefs:
