company:
  name: "Commure"
chapter:
  number: 4
  title: "Financials"
  summary: "Commure presents a broad clinical-to-cash platform and substantial operating-volume signals, but public revenue figures are inconsistent in metric definition and period. Pricing, revenue mix, gross margin, retention, cash, burn, runway, financing obligations, and customer concentration remain private, so the financial case is not yet underwritable from public evidence."
sections:
  - id: "revenue-architecture"
    title: "Revenue Architecture Is Broad, but Monetization Is Opaque"
    body: "Commure positions its platform across patient access, clinical documentation, coding, claims, denials, and collections, creating several plausible enterprise software revenue streams. Its current website reports more than $25 billion in annual claims handled and integration with more than 60 EHRs; those are operating-volume and distribution signals, not revenue, ARR, take rate, or gross profit. The Orchestrator product adds referral intake automation from ingestion through admission, but the retained product page does not disclose a price, billing unit, minimum commitment, or realized contract value. An analyst database labels the company-wide revenue model as subscription, yet no retained primary evidence establishes whether particular modules are priced per clinician, site, encounter, claim, recovered dollar, or enterprise license. Revenue quality therefore depends on contract evidence that is not public."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "gtm-and-cost-signals"
    title: "Enterprise GTM Has Anchor Proof but Unproven Efficiency"
    body: "The HCA announcement demonstrates access to a large enterprise buyer: HCA selected Commure as an exclusive ambient-AI development and deployment partner. However, the October 2024 release also stated that a formal enterprise agreement was still being negotiated, so it does not establish executed economics, implementation revenue, renewal terms, or customer concentration. A company-issued finance job repost describes a pre-IPO organization formalizing R&D and G&A planning, headcount envelopes, vendor optimization, forecasting, and capital-efficiency analysis. Commure's careers page separately says the company staffs leanly and has no pure managers. These are useful cost-governance signals, but they do not quantify sales-cycle length, CAC, payback, implementation labor, cloud and model expense, or services gross margin. Enterprise reach is visible; sales efficiency and delivery leverage are not."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
    tableRefs:
      - "TI002"
  - id: "traction-and-comparability"
    title: "Public Traction Metrics Do Not Form a Clean Time Series"
    body: "The strongest public financial signals use different definitions. GetLatka estimates $176.2 million of 2024 annual revenue, while Silicon Valley Investment Club reports more than $200 million of ARR as of June 2025 after three years of doubling. Commure's LinkedIn profile claims more than 300% year-over-year growth for two years without identifying the metric or measurement dates. Multiples records $200 million as May 2026 revenue but explicitly warns that its round-linked values may represent revenue, ARR, run-rate revenue, or LTM revenue. These figures may all describe different periods or bases; they should not be connected into a growth curve. The evidence supports commercial scale, but it does not support a precise current revenue, ARR, organic-growth, or revenue-recognition conclusion."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-verdict"
    title: "Capital Adequacy Cannot Be Inferred from Funding Headlines"
    body: "HIT Consultant reports a $70 million financing at a $7 billion post-money valuation in May 2026. That transaction confirms access to capital, but funding raised is not cash available and valuation is not operating performance. Retained databases disagree materially on cumulative funding totals and round counts, indicating that mergers, financing structures, and database conventions are being combined differently. None of the retained evidence supplies an audited cash balance, monthly burn, runway, debt schedule, repayment waterfall, planned use of funds, or next-round trigger. It also omits gross margin, NRR, GRR, cohort churn, CAC/payback, and top-customer revenue concentration. The financial verdict is therefore conditional: product breadth and enterprise distribution may support durable revenue, but revenue quality, margin expansion, capital intensity, and financing dependency remain material data-room blockers."
    claimRefs:
      - "CI014"
      - "CI015"
      - "CI016"
