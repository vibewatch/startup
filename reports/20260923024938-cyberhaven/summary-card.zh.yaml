  topStrengths:
    - 以 lineage 为核心的产品架构，相比传统 DLP 和 bundle-first incumbent 看起来确有差异化。
    - 作为私营安全公司，公开客户证据异常强，包括 14 家具名企业和详细 Motorola 效果指标。
    - DLP、DSPM、内部人员风险和 AI 数据治理预算正在汇流，市场顺风明确。
    - 客户满意度和 mindshare 信号强，包括 Gartner Peer Insights、G2、FeaturedCustomers，以及 PeerSpot share 改善。
    - 2025 年 4 月 Series D 带来可观资本，也说明即便经历 2024 年 12 月事件，投资人仍愿意为增长买单。
  topRisks:
    - 2024 年 12 月 Chrome 扩展被攻破，仍是声誉、法律和监管上的未解包袱。
    - 财务不透明严重：ARR、NRR、毛利率、流失率、burn 和现金 runway 均未公开披露。
    - Microsoft Purview 等 incumbents 可凭打包和分发杠杆压价、降低 Cyberhaven 的 win rate。
    - 除非架构实质演进，浏览器扩展依赖会持续留下供应链和平台依赖风险。
    - 关于总客户数、客户集中度和扩张质量的公开证据太薄，无法验证当前估值下的耐久性。
  unresolvedGaps:
    - 经验证的 ARR 或收入，以及 NRR、流失率、毛利率和销售效率。
    - 诉讼状态、监管跟进，以及 2024 年扩展事件财务敞口的可信边界。
    - 事件之后扩展和 OAuth 加固证据，包括摆脱浏览器商店单点依赖的 roadmap。
    - 客户集中度、ACV 分布，以及具名客户之外的总安装基数。
