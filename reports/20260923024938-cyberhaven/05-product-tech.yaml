callouts:
- calloutType: strength
  title: Data Lineage as Structural Differentiator
  body: 'Cyberhaven''s end-to-end data lineage engine is a verified architectural differentiator.

    The Motorola case study (90% false positive reduction, 98% investigation time reduction)

    provides independent customer validation of the approach''s effectiveness. PeerSpot DLP

    mindshare grew 53% YoY to 2.3%, and Gartner Peer Insights shows 4.6/5 from 48 reviews,

    both corroborating independent market traction.

    '
  claimRefs:
  - CE001
  - CE002
- calloutType: risk
  title: Chrome Extension Supply-Chain Risk
  body: 'The December 2024 phishing attack that resulted in publication of malicious extension

    v24.10.4 exposed a structural vulnerability in Chrome Web Store distribution. The extension

    auto-updated to approximately 400,000 enterprise users before detection. This incident

    highlights that the browser extension deployment channel—central to Cyberhaven''s AI Security

    and DLP coverage—is vulnerable to OAuth phishing attacks that bypass MFA. Post-incident

    hardening disclosures have been limited; diligence should confirm whether extension version

    pinning, phishing-resistant auth for Web Store accounts, and browser extension security

    controls have been implemented.

    '
  claimRefs:
  - CE001
  - CE002
- calloutType: insight
  title: Public API Surface Is Narrow — EDM CLI Is Sole Developer-Facing Tool
  body: 'Cyberhaven''s public REST API exposes only three endpoints (endpoints/list, incidents/list,

    audit-log/dataflow/list). The GitHub org (CyberhavenInc) maintains 10+ public repos but the

    only customer-facing CLI is edm-cli (Python, for EDM database management). The broader

    internal stack (Go, gRPC, TypeScript generators) is visible but not customer-exposed. This

    suggests that API extensibility and partner integration depth are more constrained than the

    integration listing suggests.

    '
  claimRefs:
  - CE001
  - CE002
- calloutType: assumption
  title: Patent Portfolio Not Confirmed
  body: 'No patent filings for Cyberhaven''s data lineage technology or LLiM were confirmed in the

    public record during this research. The company may hold trade secrets or pending patents

    not yet visible. Competitive moat relies heavily on accumulated lineage data and model

    quality, not formally registered IP protection.

    '
  claimRefs:
  - CE001
  - CE002
