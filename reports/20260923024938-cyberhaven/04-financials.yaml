chapter:
  number: 4
  title: Financials
  summary: 'Cyberhaven shows strong public momentum for an enterprise data-security platform, but the
    public record still supports underwriting mainly through financing, pricing mechanics, customer proof,
    and explicit disclosure gaps rather than through audited operating metrics.

    '
sections:
- id: revenue-model
  title: Revenue model, pricing mechanics, and GTM motion
  body: 'Cyberhaven''s monetization model is easiest to describe as enterprise software subscriptions
    wrapped around a unified AI and data-security platform. The company''s current product pages position
    one platform spanning DSPM, DLP, insider risk management, and AI security, with data lineage as the
    common control layer. That architecture matters financially because it supports land-and-expand selling:
    Cyberhaven can start from data detection and response, then add adjacent modules such as DSPM or AI-security
    controls as customer requirements broaden. The Microsoft marketplace listing reinforces the same bundle
    thesis by describing a unified offer that protects data across cloud, endpoints, and removable media
    while also integrating with tools such as Microsoft Purview and Salesforce.


    Commercially, Cyberhaven is not running a transparent self-serve SaaS motion. The official website
    routes buyers to a request-demo path and a free on-demand demo instead of publishing list prices.
    Third-party pricing pages and AWS private-offer documentation point in the same direction: pricing
    appears to be subscription based, usually tied to deployment scope such as endpoints or data volume,
    and then negotiated through enterprise contracts, volume discounts, or marketplace private offers.
    That means the public record supports pricing mechanics, but not realized pricing, discounting discipline,
    or module-level revenue mix.


    GTM breadth is improving. Cyberhaven says it is channel-first, operates reseller / tech / integration
    partner programs, and as of April 2026 can transact through AWS, Azure, and Google Cloud marketplaces
    using existing cloud commitments. Those procurement options likely shorten enterprise approvals and
    expand routes to revenue, especially for buyers already budgeting through hyperscaler commitments.
    Still, none of the retained sources disclose contract duration, renewal rates, implementation services
    mix, or how much of bookings come from direct sales versus partners versus marketplaces.

    '
  claimRefs:
  - CI001
  - CI002
  - CI003
  tableRefs:
  - TI001
- id: traction-unit-economics
  title: Public traction signals and what they imply for unit economics
  body: 'Public traction signals are directionally strong even though classical SaaS efficiency metrics
    remain undisclosed. Cyberhaven''s June 2024 Series C announcement said the company had 200 percent
    growth in new bookings, and its February 2026 business-results release said the fiscal year ended
    January 31, 2026 delivered record growth in revenue, customers, and platform adoption, including triple-digit
    growth over the prior year and customer growth above 50 percent. The same release also said customers
    include four of the top five companies on Forbes'' AI 50 list and some of the top five North American
    banks, alongside other regulated institutions and law firms. Those disclosures support the idea that
    Cyberhaven is moving upmarket into larger, more compliance-sensitive enterprises.


    Customer proof also suggests the product can generate measurable operational value. Cyberhaven highlights
    a 200 percent improvement in time-to-resolution and an 80 percent reduction in risky behavior after
    enabling real-time user coaching. The request-demo and partner materials add management claims that
    the platform reduces alert noise, lowers program cost, and lowers total cost of ownership by consolidating
    tools. These are not substitutes for CAC, payback, gross retention, or NRR, but they do suggest why
    Cyberhaven can pursue a premium enterprise motion rather than a volume-led commodity-security motion.


    The hardest public-number question is scale. Independent data vendors disagree: Datanyze and ZoomInfo
    both show roughly $64.9 million of revenue, while Growjo estimates roughly $52.4 million. Those figures
    are plausible enough to frame a public estimate range, but they are not company-filed and should not
    be treated as underwriteable revenue. Taken together, the strongest unit-economics read is qualitative:
    Cyberhaven appears to have strong enterprise demand, rising sales velocity, and meaningful product
    ROI signals, but the public record still lacks direct evidence on CAC, payback, gross margin, and
    renewal quality.

    '
  claimRefs:
  - CI003
  - CI004
  - CI005
  tableRefs:
  - TI002
  figureRefs:
  - FI001
- id: capital-adequacy
  title: Capital adequacy, financing dependency, and diligence blockers
  body: 'The cleanest capital-adequacy fact in the public record is the April 2025 Series D. Cyberhaven
    said the round brought in $100 million, lifted total funding to $250 million, and valued the company
    at $1 billion. Management also said the proceeds would support M&A, organic product innovation, and
    aggressive go-to-market investment. That combination usually implies an offensive use-of-funds plan
    rather than a defensive bridge round: Cyberhaven appears to be financing platform expansion and distribution
    growth at the same time. The February 2026 results release, plus marketplace expansion in April 2026,
    suggests management kept investing after the raise rather than slowing down.


    That said, the company remains difficult to underwrite from public data alone. No retained public
    source disclosed cash on hand, monthly burn, runway, debt balances, covenant terms, project-finance
    obligations, or a next-round trigger. The North Carolina Secretary of State filing page shows regular
    annual-report compliance, including a 2026 filing tied to fiscal date 2026-01-31, but it does not
    provide the operating financial statements that a public-company filing would. The SEC EDGAR search
    page is useful as a filing diligence path, yet no company-specific public financial filing was retained
    for Cyberhaven because it is still private.


    The practical verdict is that Cyberhaven likely has meaningful capital support and current demand,
    but financial quality still hinges on private diligence. The next diligence session should prioritize
    management-reported ARR or revenue, gross margin, sales efficiency, cash and burn, debt schedule,
    revenue-recognition policy, and channel / module mix. Without those items, an investor can defend
    a positive commercial-momentum view, but not a precise view of runway, capital intensity, or margin
    path.

    '
  claimRefs:
  - CI005
  - CI006
  - CI007
