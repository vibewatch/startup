  title: Public pricing transparency favors Nightfall and Teramind in early evaluations
  body: Cyberhaven and most incumbents stay demo-led on reviewed pages, while Nightfall and Teramind expose
    clearer public pricing structures that can accelerate initial shortlist formation.
