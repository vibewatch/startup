  title: Context, not checkbox compliance, is Cyberhaven's strongest wedge
  body: 'The retained public evidence repeatedly shows Cyberhaven winning the “what actually happened
    to this data?” argument: lineage, event reconstruction, and lower-noise investigations are the most
    differentiated parts of the story.'
  claimRefs:
