      - CI002
  - id: FE001
    title: Cyberhaven 产品架构栈
    type: stack
    summary: |
      展示从底部的数据采集面，到血缘处理引擎，再到 AI 智能层和面向用户模块能力的分层架构。
    data:
      layers:
        - label: 数据采集面
          modules:
            - 端点 Agent（Windows / macOS / Linux）
            - 浏览器扩展（Chrome）
            - 云 API 连接器（Google Workspace、Microsoft 365）
        - label: 血缘处理引擎
          modules:
            - 数据血缘图（创建 → 复制 → 转换 → 上传）
            - AI 内容智能（持续分类）
            - Exact Data Match（EDM）指纹识别
        - label: Linea AI 智能层
          modules:
            - 大型血缘模型（LLiM）— 专有
            - 检测 Agent（自主风险检测）
            - 分析师 Agent（自动调查与报告）
        - label: 平台模块
          modules:
            - DSPM（数据安全态势管理）
            - DLP（数据防泄漏）
            - IRM（内部风险管理）
            - AI 安全（Shadow AI + Agentic AI）
        - label: GCP 后端基础设施
          modules:
            - 每客户隔离实例（专用 VM + 存储 + 网络）
            - Google Security Command Center（Kubernetes 安全）
            - 24/7 MDR 监控 + GCP Key Management
        - label: 运营护栏
          modules:
            - SOC 2 Type 2 / 合规材料
            - 渗透测试与 MDR
            - GDPR / CCPA 策略控制
    approximationNotes: null
    claimRefs:
      - CE001
      - CE002
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: |
      描绘企业客户从初始痛点到部署和扩展阶段的旅程。重点展示 Cyberhaven 如何在整个生命周期中，
      把客户从 DLP 切入推进到 DSPM / IRM / AI Security 扩展。
    data:
      nodes:
        - id: j1
          label: 痛点：传统 DLP 误报压垮安全团队
        - id: j2
          label: 评估：Gartner Cool Vendor 或同业推荐触发评估
        - id: j3
          label: 价值验证：用 MDM 端点 Agent 做有限试点
        - id: j4
          label: 购买：直营企业销售成交；SOC 2 审查完成
        - id: j5
          label: 部署：MDM 推送（Windows / macOS / Linux）+ 通过 Workspace 管理员部署 Chrome 扩展
        - id: j6
          label: 价值：误报减少 90%+；调查速度提升 98%（Motorola 基准）
        - id: j7
          label: 扩展：增加 DSPM 模块，用于云数据发现
        - id: j8
          label: 扩展：增加 IRM，获取行为型内部风险信号
        - id: j9
          label: 扩展：增加 AI Security，阻断流向 ChatGPT / Gemini 的数据泄露
        - id: j10
          label: 续约：多年合同；可能成为参考客户
    approximationNotes: 旅程阶段根据产品结构、具名客户证据和 Cyberhaven 营销材料推断。实际销售周期长度未公开披露。
    claimRefs:
      - CU001
      - CU002
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: >
      二维风险热力图，以可能性（1=罕见到 5=几乎必然）和影响（1=可忽略到 5=灾难性）为轴。Chrome 扩展重复事件和集体诉讼位置最高（可能性 3-4，影响 4-5）。GDPR/FTC 监管风险处于中高位置（可能性
      2-3，影响 4-5）。Microsoft Purview 竞争替代处于中等位置（可能性 2，影响 4）。
    data:
      columns:
        - 影响 1 可忽略
        - 影响 2 较小
        - 影响 3 中等
        - 影响 4 重大
        - 影响 5 灾难性
