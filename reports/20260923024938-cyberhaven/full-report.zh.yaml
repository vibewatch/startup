        - 提供按年预订额、净新增 ARR 和胜率桥
      - - FY2026 客户增长
        - '>50%'
        - 中
        - 若扩张和续约健康，可支持持续需求和潜在回本杠杆
        - 提供新增客户、流失客户和按客户队列拆分的扩张 ARR
      - - 公开合同价值基准
        - 35016
        - 低
        - 可方向性检验入门级合同经济性，但第三方基准可能低估大型企业交易规模
        - 提供按客户规模和部署范围拆分的 ACV 分布
      - - 运营 ROI 代理指标：调查更快
        - 解决时间改善 200%
        - 中
        - 运营回本可支撑企业级溢价定价，并降低客户摩擦
        - 提供量化人工节省和事件成本避免研究
      - - 运营 ROI 代理指标：风险降低
        - 风险行为减少 80%
        - 中
        - 若广泛验证，用户行为改善可支撑留存和扩张叙事
        - 提供样本量、测量周期和客户队列背景
      - - 公开年度收入估算区间
        - 52.4-64.9 USD M
        - 低
        - 仅能作为粗略规模边界，因为供应商估计相互冲突，且数字未提交监管文件
        - 提供管理层口径 ARR / 收入及月度趋势
      - - CAC / 回本期 / 销售周期
        - null
        - 低
        - 缺少这些指标，投资人无法判断 GTM 效率或招聘产能
        - 提供全口径 CAC、回本期、销售周期和按客群拆分的销售生产率
      - - 毛利率 / 服务交付成本
        - null
        - 低
        - 毛利路径决定当前增长有多少能转化为持久经营杠杆
        - 提供毛利桥、托管成本、支持负担和服务收入结构
    notes: |
