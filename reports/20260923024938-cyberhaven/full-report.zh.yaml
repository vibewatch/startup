figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公开可交叉验证的里程碑显示，Cyberhaven 从创立走向更宽的产品版图，融资大幅上台阶，经历一次重大负面事件， 并在 2026 年初重新披露增长。
    data:
      items:
        - date: '2016-01-01'
          label: 创立
          detail: 公开来源列出五位联合创始人；具体创立日期未披露。
          tone: neutral
        - date: '2021-12-14'
          label: Series B 轮
          detail: 宣布由 Redpoint 领投的 $33M 融资。
          tone: positive
        - date: '2022-11-17'
          label: 内部威胁平台发布
          detail: Cyberhaven 发布基于数据血缘的实时内部威胁防护。
          tone: positive
        - date: '2024-06-11'
          label: Series C 轮 + 董事席位
          detail: $88M 融资；Adams Street 的 Fred Wang 加入董事会。
          tone: positive
        - date: '2024-09-17'
          label: 领导层扩充
          detail: Doshi、Sharp、Vines 和 Gupta 加入高管团队。
          tone: positive
        - date: '2024-12-27'
          label: 披露 Chrome 扩展被攻破
          detail: 恶意扩展更新和凭证暴露风险被公开报道。
          tone: warning
        - date: '2025-04-02'
          label: 以独角兽估值完成 Series D
          detail: $100M 融资将 Cyberhaven 估值推至 $1B。
          tone: positive
        - date: '2025-05-13'
          label: CEO 交接
          detail: Howard Ting 卸任后，Nishant Doshi 接任。
          tone: warning
        - date: '2025-11-19'
          label: Deloitte Fast 500
          detail: 外部认可强化了增长叙事。
          tone: positive
        - date: '2026-02-10'
          label: FY2026 增长更新
          detail: 公司披露收入三位数增长，客户增长 >50%。
          tone: positive
    approximationNotes: 创立节点锚定到 2016-01-01，因为已审阅公开来源只披露年份，未披露具体日期。
