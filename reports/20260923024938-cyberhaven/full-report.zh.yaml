          detail: 仍受益于传统企业存在感，但当前公开差异化更弱。
          tone: warning
    approximationNotes: 序数评分综合保留的公开证据，而不是有来源支撑的数字化市场份额数据。评分围绕 Cyberhaven 的核心购买标准—— 上下文深度和分销触达——做相对排序。
    claimRefs:
      - CP001
      - CP002
  - id: FI001
    title: 收入模型桥
    type: flow
    summary: 演示驱动、谈判定价的订阅销售动作把企业需求转化为收入；成交可以走直营、合作伙伴，也可以走云巨头市场。
    data:
      nodes:
        - id: demand
          label: 企业对面向 AI 的数据安全需求
        - id: demo
          label: 申请演示 / 按需评估
        - id: direct
          label: 直营企业销售动作
        - id: channel
          label: 渠道 / 经销商销售动作
        - id: marketplace
          label: AWS / Azure / GCP Marketplace 采购
        - id: pricing
          label: 谈判确定的订阅档位和私有报价
        - id: revenue
          label: 经常性平台收入加模块扩展
      edges:
