  - id: FV001
    title: 建议逻辑
    type: flow
    summary: |
      从规模和验证，到风险评估，再到投资建议的逻辑链。起点是已展示的 ARR 增长和客户验证，接着评估产品差异化， 再经过风险关口（事件历史、财务不透明、竞争威胁），最后给出有条件继续研究建议，条件是满足三项证据要求。
    data:
      nodes:
        - id: N1
          label: ARR ~$100M（估算）+ 14 家具名 F500 客户
        - id: N2
          label: AI 数据血缘差异化，对比内容检查型 DLP
        - id: N3
          label: 风险关口 1：Chrome 扩展事件 + 诉讼
        - id: N4
          label: 风险关口 2：财务不透明（NRR、GM 未知）
        - id: N5
          label: 风险关口 3：Microsoft Purview 竞争威胁
        - id: N6
          label: 有条件继续研究（3 项证据要求）
      edges:
        - from: N1
          to: N2
        - from: N2
          to: N3
        - from: N3
          to: N4
        - from: N4
          to: N5
        - from: N5
          to: N6
    approximationNotes: 简化的 IC 决策逻辑；实际流程包含并行证据轨道。
    claimRefs:
      - CV001
      - CV002
