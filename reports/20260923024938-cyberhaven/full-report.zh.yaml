          label: 销售主导的企业评估
        - from: demo
          to: channel
          label: 合作伙伴协助路径
        - from: demo
          to: marketplace
          label: 云采购路径
        - from: direct
          to: pricing
          label: 定制企业条款
        - from: channel
          to: pricing
          label: 渠道主导条款
        - from: marketplace
          to: pricing
          label: 承诺消费 / 私有报价
