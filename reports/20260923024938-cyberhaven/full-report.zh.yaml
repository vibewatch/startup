companyProfile:
  summary: >-
    Cyberhaven 是一家私营网络安全公司，面向大型企业打造以数据谱系为先的 AI 与数据安全平台。公司把 DSPM、DLP、内部人员风险管理和 AI 安全整合到统一控制平面，并把这套定位转化为具名企业客户、较高用户评价，以及以
    $1B 估值完成 $100M D 轮的快速融资进展。产品差异化和客户结果让商业逻辑很有吸引力，但公开证据在财务质量和事件后续影响上仍过于稀薄，不足以支撑一项完全承销过的后期投资决策。
