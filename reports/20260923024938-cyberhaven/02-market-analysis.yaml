  title: Segment / buyer map
  columns:
  - segment
  - buyer
  - user
  - payer
  - workflow
  - budget owner
  - adoption trigger
  rows:
  - - Microsoft 365 and compliance-heavy enterprise
    - CISO / compliance lead
    - Insider-risk analysts, compliance admins, IT admins
    - Central security or compliance budget
    - Already uses Purview-style governance and wants broader cross-channel enforcement
    - CISO or VP Compliance
    - Native controls create noise, role complexity, or gaps outside Microsoft estate
  - - Multicloud and SaaS-heavy enterprise
    - Cloud security leader
    - Cloud security engineers and data-governance teams
    - Cloud security platform budget
    - Needs DSPM-style discovery, classification, and exposure mapping across cloud and SaaS
    - VP Cloud Security / CISO
    - Sensitive data visibility gaps across cloud, SaaS, and AI workflows
  - - Regulated-data operator (healthcare, law, finance)
    - CISO / privacy / legal operations leader
    - Security investigations team and business data owners
    - Security, privacy, or risk budget
    - Protect regulated or high-value data while preserving audit trails
    - Chief Risk Officer / CISO
    - Regulatory pressure, breach evidence, and insider misuse risk
  - - Modern web, endpoint, and collaboration environment
    - Security platform owner
    - SOC analysts and endpoint/web/email administrators
    - Central security operations budget
    - Unify DLP across web, email, endpoint, removable media, and cloud channels
    - Director of Security Engineering
    - Legacy DLP operational burden and inconsistent policy enforcement
  - - AI-adopting enterprise with shadow-AI concerns
    - CISO / AI governance committee
    - Security analysts, AI program owners, IT admins
    - Security or AI-governance budget
    - Map where data moves into AI tools and stop unsafe prompts or uploads
    - CISO with CIO / AI governance sponsor
    - Need to accelerate AI adoption without uncontrolled data leakage
