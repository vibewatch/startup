callouts:
- calloutType: insight
  title: Cyberhaven competes in a convergence zone, not one clean category
  body: Public evidence consistently places Cyberhaven across DLP, insider risk, DSPM, and AI-governance
    conversations. That broadens opportunity, but it also makes headline TAM claims easy to overstate
    if category boundaries are not kept explicit.
  claimRefs:
  - CM001
  - CM002
- calloutType: risk
  title: Public SAM/SOM evidence is still thin
  body: No retained independent source publishes a Cyberhaven-specific SAM, vertical mix, ACV range, or
    conversion funnel. Market direction is clear; company-specific capture assumptions remain a diligence
    item.
  claimRefs:
  - CM001
  - CM002
- calloutType: assumption
  title: Economic buyer is usually security or compliance, not a standalone developer budget
  body: The strongest public buying evidence points to CISOs, compliance leaders, and central security
    platform owners who need cross-channel governance, investigations, and privacy controls, even when
    deployment touches end users or AI tools.
  claimRefs:
  - CM001
  - CM002
