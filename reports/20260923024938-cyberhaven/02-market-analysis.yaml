chapter:
  number: 2
  title: Market Analysis
  summary: Cyberhaven sits in a fast-growing but boundary-messy slice of enterprise data security where
    DLP, insider risk management, DSPM, and AI-data-governance controls are converging. The broadest public
    lens is the DLP market ($9.33B by 2030 per Grand View), while the more company-relevant adjacencies
    are DSPM ($5.7B-$17.2B by 2033 across public estimates) and insider risk management ($3.7B-$8.23B
    by 2030-2033 across public estimates). Cyberhaven is not selling into all cybersecurity spend; it
    is selling to security and compliance buyers who need to discover sensitive data, understand how it
    moves, and stop risky internal or AI-enabled exfiltration. Demand is supported by cloud sprawl, AI
    adoption, insider-driven breach evidence, and tightening governance obligations, but precise Cyberhaven
    SAM/SOM remains publicly under-disclosed because no independent source cleanly isolates Cyberhaven-specific
    revenue pools, contract values, or vertical conversion rates.
sections:
- id: section-1
  title: Market boundary, included spend, and substitutes
  body: The right market boundary for Cyberhaven starts with what the product actually claims to do. Official
    Cyberhaven materials position the company as an AI and data security platform that unifies DSPM, DLP,
    insider risk management, and AI security across endpoints, cloud, on-prem, SaaS, and AI tools. That
    means the included spend is not “all cybersecurity” and not even the full universe of data security.
    The most relevant pools are enterprise spend on discovering sensitive data, classifying it, monitoring
    how it moves, preventing unauthorized transfer, and investigating risky user or AI-assisted data handling.
    Adjacent spend includes native data security suites from Microsoft Purview, cloud-delivered DLP from
    Zscaler, and CNAPP-integrated DSPM from Palo Alto Networks. Status-quo substitutes are native Microsoft
    controls, legacy DLP stacks, manual data classification programs, and point products focused only
    on cloud repositories. Excluded spend should include generic SIEM, firewall, endpoint protection,
    and broad infrastructure security budgets that do not directly buy data discovery, data classification,
    exfiltration prevention, or insider-risk response. This boundary matters because Cyberhaven’s public
    messaging is about data-in-motion context, lineage, and response quality, not about owning the whole
    security stack.
  claimRefs:
  - CM001
  - CM002
  - CM003
  tableRefs:
  - TM001
- id: section-2
  title: Sizing lenses and why public TAM/SAM/SOM remains constrained
  body: 'Public market sizing is useful only if the boundary logic is kept explicit. The broadest adjacent
    lens is DLP: Grand View sizes the global DLP market at $1.87B in 2022 and $9.33B by 2030, with cloud
    deployment already the largest mode. The next lens is insider risk management, where ResearchAndMarkets
    puts the market at $2.4B in 2024 growing to $3.7B by 2030, while Verified Market Reports publishes
    a larger $3.14B in 2024 to $8.23B by 2033 path. The most Cyberhaven-adjacent emerging category is
    DSPM, but even there public estimates diverge sharply: Growth Market Reports says $1.42B in 2024 to
    $17.2B by 2033, while DataHorizzon places DSPM tools at $1.8B in 2023 and $5.7B by 2033. Palo Alto’s
    vendor-authored market guide adds a still different frame, citing $415M-$2B 2025 market valuations
    and 25%-37% annual growth. Taken together, the evidence supports a meaningful and expanding data-centric
    security opportunity, but not a clean nested TAM/SAM/SOM pyramid. The categories overlap, the forecast
    years differ, and some sources count standalone tools while others include integrated platform modules.
    That is enough to bound the market directionally, but not enough to claim a precise public Cyberhaven
    SAM or SOM.'
  claimRefs:
  - CM003
  - CM004
  - CM005
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: section-3
  title: Buyer segmentation, budget ownership, and adoption path
  body: 'The public buyer map is more security-and-compliance led than developer led. Cyberhaven’s own
    marketplace and homepage messaging repeatedly target security teams, IT professionals, CISOs, and
    regulated-data operators, while Microsoft’s insider-risk documentation shows how purchases often sit
    inside compliance, security, and tenant-administration workflows with licensing gates and explicit
    role-group setup. In practice, the economic buyer is usually a CISO, compliance leader, or central
    security platform owner; the operational users are security analysts, insider-risk investigators,
    and IT administrators; and the payer is commonly a central security, compliance, or Microsoft/Purview-adjacent
    platform budget. The adoption path is also visible in public materials: organizations first recognize
    data-sprawl or insider-risk problems, then evaluate whether legacy or native controls are producing
    too much noise, then pilot across one or two data channels, then connect the tool into identity, ticketing,
    DLP, or cloud workflows, and only then scale into a broader data-security program. Because privacy
    settings, opt-in indicators, connectors, and cross-platform policy enforcement all matter, deployment
    is not a commodity seat sale. Budget unlocks most plausibly when a buyer can link insider-risk, AI
    governance, and compliance reporting into one measurable control plane.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  tableRefs:
  - TM003
- id: section-4
  title: Growth drivers, adoption constraints, and valuation relevance
  body: 'The adoption case for Cyberhaven is supported by several durable drivers. First, cloud and multicloud
    sprawl keep pushing sensitive data across endpoints, SaaS, and cloud repositories, which is exactly
    the discovery and classification problem highlighted in public DSPM research. Second, AI adoption
    creates new exfiltration and governance problems: Cyberhaven, Microsoft, and Palo Alto all emphasize
    protecting data that now moves through AI tools and agents. Third, regulatory and governance pressure
    is increasing; SEC rules now require more explicit cyber-risk management and governance disclosure
    by public companies, while Microsoft and CISA materials show how insider-risk controls are becoming
    formal programs rather than ad hoc investigations. Fourth, breach data keeps the urgency high. HIPAA
    Journal’s summary of Verizon’s 2024 DBIR shows internal actors causing 70% of healthcare breaches
    and human error involved in 68% of breaches under Verizon’s methodology. The constraints are equally
    real: legacy environments are fragmented, alert quality can be poor, licensing and permissions can
    slow rollout, and public market forecasts disagree about category scope. For valuation, that means
    Cyberhaven is exposed to a real and growing market, but investors should discount for implementation
    friction and for the absence of public evidence on contract sizes, win rates, and vertical mix.'
  claimRefs:
  - CM007
  - CM008
  - CM009
tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Unified AI and data security platform
    - DSPM, DLP, insider risk management, AI-security controls, incident investigation workflows
    - Generic SIEM, firewall, endpoint protection, and unrelated infrastructure security spend
    - CISO, security platform owner, central IT / security budget
    - Direct framing used by Cyberhaven
  - - Data loss prevention (DLP)
    - Policy enforcement across web, email, endpoint, removable media, cloud, and AI channels
    - Threat intel, network firewall, and IAM spend not tied to data handling controls
    - Security operations, compliance, data-protection owners / security or compliance budget
    - Core adjacent category and legacy substitute
  - - Insider risk management (IRM)
    - Behavior analytics, policy alerts, investigations, privacy-aware internal misuse programs
    - General HR software, generic UEBA not tied to data-risk actions
    - Compliance leaders, insider-risk investigators, legal and security stakeholders / central governance
      budget
    - Core adjacent category for Cyberhaven’s risky-user positioning
  - - Data security posture management (DSPM)
    - Sensitive-data discovery, classification, exposure mapping, compliance reporting, cloud data context
    - Infrastructure-only posture management without data classification
    - Cloud-security and data-governance teams / cloud security or platform budget
    - Most relevant emerging category for Cyberhaven’s data-lineage and visibility claims
  - - Native suite substitutes
    - Microsoft Purview or similar suite controls bundled with wider compliance and data-security programs
    - Best-of-breed platforms when the buyer only wants bundled native controls
    - Existing Microsoft/compliance owners / existing suite budget
    - Important status-quo substitute that can slow standalone adoption
  - - Excluded adjacencies
    - 'null'
    - Broad cybersecurity suites, SOC tooling, endpoint detection, and non-data-centric security categories
    - Mixed enterprise security buyers / mixed budgets
    - Useful outer context but not a clean Cyberhaven revenue pool
  notes: Boundary is evidence-constrained and intentionally excludes generic cybersecurity TAM claims.
    Rows focus on Cyberhaven-adjacent spend categories surfaced in official product and market sources.
