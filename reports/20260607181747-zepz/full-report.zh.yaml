companyProfile:
  summary: >-
    Zepz 是总部位于伦敦的汇款集团，旗下运营 WorldRemit 和 Sendwave。业务源自 WorldRemit；Ismail Ahmed 于 2010
    年创立该公司，试图把过去依赖高成本代理网络的移民汇款数字化。WorldRemit 于 2021 年 2 月完成对 Sendwave 的收购，当年晚些时候将控股公司更名为 Zepz，并以 $5 billion 估值融资 $292
    million。此后的公开披露显示，公司从核心法币汇款进一步推向钱包和稳定币产品，最终在 2025 年推出 Sendwave Wallet，并在 2026 年建立相关 Fireblocks / TRM
    基础设施合作。公司规模明确，但当前用户数、走廊、员工数和经审计财务指标仍披露不一致。
