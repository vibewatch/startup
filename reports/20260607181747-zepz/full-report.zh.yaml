    sections:
      - number: '8.1'
        title: 建议、投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Zepz 的估值案例始于一项真实资产，而不是故事股。官方公司材料仍能锚定一个已有规模的汇款平台：2021 年 Series E 公告称，合并品牌在 2020 年产生近 $10 billion 的汇款总额和
              $338 million 收入；后续伙伴材料称，Zepz 在 2025 年转账超过 $17 billion，服务 130 个国家的超过 9 million 名用户。这个规模，加上反复获得包括 IFC
              在内的高质量投资人支持，是核心投资逻辑。反向逻辑同样重要。最后一份可公开审计的收入和利润率细节仍是历史数据，2024 年 $267 million 轮没有披露估值，Sendwave 近期历史中有 CFPB
              命令，公司进入 2026 年时也只有临时 CEO，而不是已任命的永久运营负责人。公开市场可比公司也奖励透明度：Wise、Remitly、Western Union 和 Euronet
              都发布当前收入和运营数据，Zepz 没有。这个缺口意味着投资决定不能仅凭公司质量给出干净的买入或回避结论；它必须对价格敏感，也必须对尽调结果敏感。在这个基础上，正确建议是「继续研究」，而不是「买入」。Zepz
              仍可能配得上溢价的私募估值，但公开证据不足以支持在没有当前财务包、投资条款可见度，以及证明 2024 年后业务既盈利又可治理的情况下，按 2021 年峰值或更高价格支付。
