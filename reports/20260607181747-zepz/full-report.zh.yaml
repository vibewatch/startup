      - number: '3.5'
        title: 护城河耐久性、竞争风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              Zepz 的护城河真实，但有边界。真实在于付款广度仍然重要：WorldRemit
              可以跨银行入账、移动钱包、现金领取和话费充值满足收款人偏好，这种广度很难被账户到账户专门玩家一夜复制。边界在于，公开竞争对手没有停下。Wise 在扩大客户和交易量的同时仍在降低抽成率；Remitly
              在同样侨民密集的收款市场快速增长；Western Union 正利用规模加深数字贡献，并试验稳定币基础设施；Euronet 仍在投入 Ria 的数字转账业务。最强的反向证据不是今天某个竞争对手明显从 Zepz
              手中夺走份额，而是整个品类持续出现会快速侵蚀信任的披露和合规失败。Wise 在 2025 年面临 CFPB 命令，MoneyGram 在 2025 年与 New York 达成和解，Sendwave 自身在
              2023 年受到 CFPB 行动。这意味着 Zepz 不能把信任当成静态护城河。未来两到三年，持久边缘来自特定走廊的付款相关性，加上移民社区内的品牌熟悉度；主要风险是资本更充足或更透明的对手压缩价格，使 Zepz
              相比之下显得不透明。
