  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 投资判断取决于规模和资本获取能力，能否经得起缺价格、缺审计两项测试。
    data:
      nodes:
        - id: anchor
          label: 2021 年峰值标记：$5B
          detail: 官方证据显示，投资者曾把 Zepz 定价为高溢价汇款平台。
          tone: positive
        - id: scale
          label: 规模看起来仍真实
          detail: 合作伙伴材料仍指向 2025 年转账额 >$17B、用户数 >9M。
          tone: positive
        - id: gap
          label: 当前审计缺口
          detail: 没有公开的 2025-2026 年经审计收入、利润率或现金流桥。
          tone: risk
        - id: terms
          label: 2024 轮条款未知
          detail: $267M 融资未披露估值或优先股堆叠。
          tone: risk
        - id: governance
          label: 治理还未达到退出准备状态
          detail: 临时 CEO 状态和有限的公开董事会可见度削弱信心。
          tone: risk
        - id: call
          label: 继续研究 / 高风险
          detail: 保持价格纪律，不要把 2021 年峰值当作当前公允价值。
          tone: risk
      edges:
        - from: anchor
          to: scale
          label: 证明投资者曾愿意付高价
        - from: scale
          to: gap
          label: 仍需要经审计变现证据
        - from: gap
          to: terms
          label: 缺数字让结构更重要
        - from: terms
          to: governance
          label: 估值信心也取决于控制质量
        - from: governance
          to: call
          label: 直到这些问题澄清
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV012
      - CV034
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 公开可比公司区间显示，Zepz 2021 年峰值倍数比上市汇款和混合同业高出多少。
    data:
      items:
        - label: Zepz 2021 年峰值 / 2020 年收入
          value: 14.8
          detail: 官方 $5B 估值除以官方 2020 年收入 $338M。
          tone: risk
        - label: Wise 代理指标
          value: 4.7
          detail: 基于市值和收入参考页面得出的 June 2026 市值 / 收入代理指标。
          tone: positive
        - label: Remitly 代理指标
          value: 2.3
          detail: 按市值 / 收入口径，最接近的上市汇款 App 同业。
          tone: neutral
        - label: Western Union 代理指标
          value: 0.6
          detail: 成熟混合型在位者下限。
          tone: neutral
        - label: Euronet 代理指标
          value: 0.6
          detail: Ria 和其他汇款活动的母公司层面代理指标。
          tone: neutral
    approximationNotes: |
      数值是市值 / 收入代理指标，不是 EV/revenue。目的在于展示相对公开定价纪律，而不是声称 Zepz 有一个精确可比倍数。
