      - number: '4.4'
        title: 公开牵引信号有意义，但当前财务牵引仍主要是缺口
        blocks:
          - type: paragraph
            body: >
              Zepz 并非因为没有任何公开信息而财务不透明；它不透明，是因为公开记录在范围、时间和审计状态上不均衡。在硬锚点一侧，2021 年 Series E 新闻稿称两个品牌 2020 年产生近 $10 billion
              总汇出量和 $338 million 收入，而经审计的 2021 年集团账目披露 $399.4 million 收入。2023 年官方材料随后称，集团在 2022 年 H1 实现经营盈利，并已帮助客户在 2022
              年汇出超过 $15 billion。到 2026 年，合作伙伴材料称 2025 年转账超过 $17 billion，客户或用户超过 9
              million。问题不是这些说法在方向上不可信；而是它们目前无法对齐成一套经审计的当下收入、利润率或现金流视图。Companies House 显示 2024 年账目已提交，2025 年账目要到 2026 年 9
              月下旬才到期。这让投资人拥有历史经审计报表、当前营销主张和合作伙伴统计，但没有两者之间的经审计桥梁。即便是基本规模描述也在不同来源之间漂移，包括 2,000 对 5,000 条走廊，以及 9 million 对
              11 million 用户。
