      - number: '8.2'
        title: 融资背景、估值锚点与入场纪律
        blocks:
          - type: paragraph
            body: >
              融资背景是避免伪精确的最清晰理由。唯一干净的公开估值锚点是 2021 年 8 月 Series E，当时 WorldRemit 称 Zepz 以 $5 billion 估值融资 $292
              million。下一次主要股权事件是 2024 年 10 月一轮：IFC 披露在更大的 $267 million 轮中投资 $20
              million，独立报道确认估值未披露。这一遗漏不是细节；它就是整个估值问题。公司可以融到真实资本，同时仍可能接受平轮、结构化轮，或普通股经济性与标题金额明显不同的一轮。最后一个历史审计检查点也很重要。WorldRemit
              Group 的 2021 年账目报告收入 $399.4 million，但 Companies House 称 2025 年账目要到 2026 年 9
              月下旬才到期，因此当前审计收入、毛利率和现金生成情况对公开投资人仍不可得。再加上 2026 年 3 月 CEO 过渡到临时领导层，承销姿态就很直接：不要锚定 2021 年峰值，也不要在 2024
              年标记未披露时，按盲目的上调估值价格买入。任何严肃入场都应要么相对旧的 $5 billion 标题估值有明确折扣，要么使用结构来防范未披露优先权、稀释或弱于宣传的盈利质量。
