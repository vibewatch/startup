      - number: '1.5'
        title: 重大里程碑如今与反复重组和监管审视并存
        blocks:
          - type: paragraph
            body: >-
              从纸面看，里程碑时间线很有吸引力：WorldRemit 2010 年创立，Sendwave 2014 年创立，2021 年完成收购，2021 年达到 $5 billion 估值，2022-2023
              年传达经营盈利，2024 年再次完成重要股权融资，并在 2025-2026 年通过 Fireblocks、TRM Labs
              等合作伙伴扩展钱包和稳定币。但同一时期也包含一连串反向事实，投资人不能将其简单视为宏观噪音。Sky News 报道 2022 年裁员影响少于 5% 的岗位，当时员工数降至约 1,000。CNBC 和
              Finextra 随后报道，2023 年 5 月裁员 420 人，约占 1,600 人员工队伍的 26%，公司在整合 Sendwave 后集中团队。CNBC 和 Crowdfund Insider 又在 2025
              年初描述了约 200 个岗位削减。另一个维度上，CFPB 于 2023 年 10 月向 Chime, Inc. d/b/a Sendwave 发布命令，认定其存在误导性汇款营销和 Regulation E
              违规，并要求约 $1.5 million 消费者赔偿和 $1.5 million 罚款。这些事件并不抹掉战略案例，但会改变案例质量：Zepz
              像是一家已有规模的汇款在位者，一边试图拓展到钱包和稳定币，一边简化成本结构、修复控制流程并重新定义领导层。后续任何章节都应把执行和合规视为核心，而非外围问题。
