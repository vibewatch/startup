          detail: 两个品牌都会在付款前显示价格和付款选择，并要求身份检查；Sendwave 以 App 优先、借记卡主导，WorldRemit 则支持更广的入金方式和网站 / App 使用。
          tone: neutral
        - label: 付款轨道选择
          detail: 汇款人选择银行转账、移动钱包、现金领取、话费，或在 Sendwave Wallet 场景下选择数字美元路径并后续提现。
          tone: positive
        - label: 收款人到账与确认
          detail: 收款人通过本地合作伙伴、钱包、银行或领取网点收款；两个品牌都会展示状态更新和送达通知。
          tone: positive
        - label: 重复汇款行为
          detail: WorldRemit 强调已保存收款人、快速重发和跟踪，Sendwave 则突出 App 内限额、低摩擦复用和 24/7 聊天。
          tone: positive
        - label: 扩展到钱包 / 数字美元
          detail: 最新扩张闭环是面向美国汇款人的 Sendwave Wallet，储值余额、返现和数字美元转账试图把留存拉到单次转账之外。
          tone: positive
    claimRefs:
      - CU004
      - CU020
      - CU021
      - CU022
      - CU024
  - id: FU002
    title: 品牌、走廊与合作伙伴依赖流程
    type: flow
    layout: wide
    summary: WorldRemit 和 Sendwave 的路由逻辑不同，说明客户集中度风险会通过走廊、付款合作伙伴和合规基础设施体现出来。
    data:
      nodes:
        - id: worldremit-senders
          label: WorldRemit 广泛汇款人基础
          description: 多国侨民汇款人通过网站或 App 流程使用广泛路线和付款方式。
        - id: worldremit-rails
          label: WorldRemit 付款轨道
          description: 银行转账、移动钱包、现金领取和话费依赖本地合作伙伴及收款人识别。
          dependsOn:
            - worldremit-senders
        - id: sendwave-senders
          label: Sendwave 聚焦汇款人
          description: 美国、英国、加拿大和欧洲部分地区的 App 优先汇款人，为通往非洲和南亚的高频走廊供给资金。
        - id: sendwave-rails
          label: Sendwave 走廊合作伙伴
          description: 送达依赖特定移动钱包、银行和现金领取合作伙伴，例如 MTN、bKash、Access、Zenith 和 Fidelity。
          dependsOn:
            - sendwave-senders
        - id: wallet-expansion
          label: 钱包与稳定币层
          description: 仅面向美国的 Sendwave Wallet 增加 USDC、返现、更优汇率优惠，以及收款人的后续提现选择。
          dependsOn:
            - sendwave-rails
        - id: compliance-stack
          label: 合规与结算栈
          description: TRM 和 Fireblocks 为稳定币扩张支撑风险控制、资金管理和结算；但尼日利亚汇款规则等监管变化仍可能改变客户体验。
          dependsOn:
            - wallet-expansion
            - sendwave-rails
            - worldremit-rails
    claimRefs:
      - CU008
      - CU010
      - CU030
      - CU031
      - CU033
      - CU037
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 公开证据在覆盖广度和表层满意度上最强；真实留存经济性较弱，且部分被监管信任包袱抵消。
    data:
      columns:
        - 覆盖广度
        - 结果信号
        - 复用代理指标
        - 反向包袱
      rows:
        - label: WorldRemit 官方 + App Store 界面
          values:
            - label: 强
              tone: positive
              detail: 5.7M 客户、130 个国家、70 种货币，加上大量 iOS 评分。
            - label: 强
              tone: positive
              detail: 216K 评分给出 4.8/5，78,150 条公开评论形成可见的满意度证据。
            - label: 中等
              tone: neutral
              detail: 快速重发、已保存收款人和跟踪功能暗示重复行为，但没有揭示真实队列留存。
            - label: 低
              tone: positive
              detail: 审阅的客户材料中没有出现直接的当前监管执法问题。
        - label: WorldRemit 走廊页面
          values:
            - label: 强
              tone: positive
              detail: 尼日利亚、肯尼亚和菲律宾页面显示路线和付款覆盖都较广。
            - label: 中等
              tone: positive
              detail: 90% 数分钟内到账主张和 20M+ 菲律宾转账有用，但只适用于特定路线。
            - label: 中等
              tone: neutral
              detail: 收款人要求和状态更新支持重复家庭汇款使用。
            - label: 低
              tone: positive
              detail: 主要弱点是缺少走廊组合，而不是可见的客户伤害。
        - label: Sendwave 官方走廊 + 支持界面
          values:
            - label: 中等
              tone: neutral
              detail: 覆盖有实质意义但更窄，集中在部分非洲和南亚走廊。
            - label: 中等
              tone: positive
              detail: 1M+ 可信用户信号和官方低摩擦定位支撑真实使用。
            - label: 强
              tone: positive
              detail: 基于 App 的借记卡入金、App 内状态、限额历史和钱包增购都瞄准重复汇款人。
            - label: 中等
              tone: risk
              detail: 官方投诉流程和走廊特定合作伙伴限制说明运营摩擦不小。
        - label: Sendwave 独立评论 + CFPB 记录
          values:
            - label: 窄
              tone: risk
              detail: 独立评论反复指出，其走廊广度比大型同业更窄。
            - label: 强
              tone: positive
              detail: 独立评测者称赞即时移动钱包和低摩擦 App 使用。
            - label: 中等
              tone: neutral
              detail: 评论暗示核心走廊存在重复使用，但仍不披露队列留存或流失。
            - label: 强
              tone: risk
              detail: CFPB 执法行动在速度、成本和披露质量上给出明确的反向信任信号。
    claimRefs:
      - CU012
      - CU013
      - CU018
      - CU019
      - CU026
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 截至 June 2026，按可能性与影响展示 Zepz 的主要剩余风险。
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
        - 关键影响
      rows:
        - label: 高可能性
          values:
            - 州级投诉升级
            - 指标不一致
            - 定价压力 / 促销强度
            - 反复重组带来的执行压力
        - label: 中等可能性
          values:
            - 董事会更替
            - 隐私 / 生物识别审查
            - 稳定币合作伙伴失效
            - 披露或钱包触发的监管反复
        - label: 低可能性
          values:
            - 小幅披露更新延迟
            - 供应商政策薄弱
            - 估值不透明固化为弱条款
            - 牌照或走廊中断
    approximationNotes: 位置为定性判断，反映公开缓释措施之后的剩余暴露，不是概率模型。
    claimRefs:
      - CR001
      - CR014
      - CR016
      - CR025
      - CR030
      - CR040
      - CR044
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Zepz 关键风险如何传导到信任、收入、利润率、融资和估值。
