      - number: '8.5'
        title: 退出准备度、最终尽调要求与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >
              仅凭公开证据，Zepz 还没有准备好进入公开市场。投资人仍缺当前审计 P&L、当前利润率桥接、2024 年后的股权结构表、明确清算优先权，以及对最新一轮到底是重设价格还是仅保留融资灵活性的清楚说明。公司还需要证明
              Sendwave 的 CFPB 问题已经得到补救，而不只是成为历史；也要证明 2026 年 3 月的临时 CEO 安排是过渡，而不是运营不稳定的症状。因此，最低尽调包既是运营性的，也是财务性的：2025
              年审计数字和 2026 年初至今数字、走廊级抽佣率和出款组合数据、2024 年条款清单和优先股堆叠、合规补救证据，以及一张治理图，点名拟任长期 CEO
              和负责风险的董事会成员。如果这些文件继续关着，投资逻辑会很快破裂，因为投资案例将依赖管理层叙事，而不是投资级证据。这也是为什么建议不是「回避」。这里显然有一门生意。但正确姿态是保留可选性，坚持价格纪律，并且只在公司证明当前经济性和治理至少与其持续宣传的规模故事方向一致时行动。
