      - number: '7.3'
        title: 运营、执行与披露风险
        blocks:
          - type: paragraph
            body: >-
              运营风险故事由反复重组和领导层变化塑造，而不是某次披露的单一宕机。公开报道显示，公司在 2022、2023 和 2025 年裁员，其中 2023 年一轮达到 420 人，约为员工总数的 26%；2025
              年一轮影响约 200 名员工或 20% 员工，对 IT、工程、数据库管理和开发运维的冲击尤其明显。FinTech Futures 将 2025
              年裁员与重新平台化工作完成、自动化，以及拟关闭肯尼亚和波兰雇佣实体联系起来。这些事实可以被正面解读为成本纪律，但也意味着公司要求一个更小、且反复重组的团队，在延伸到稳定币钱包的同时运营一家全球持牌汇款业务。领导层连续性又加一层风险。2026
              年 3 月，Mark Lenhard 离任，Barrie Morris 从 CFO 转为临时 CEO，这一变化得到 Companies House 文件佐证。公司可以扛过临时负责人；风险在于，Zepz
              近期的公开故事——整合、盈利、2024 融资和钱包扩张——高度绑定 Lenhard 的运营者叙事。披露集合让承销更难，因为基础指标对不上。按不同来源，Zepz 有 5.7 million 名客户、超过 9
              million 名用户，或超过 11 million 名用户；有 2,000、4,600 或 5,000 条走廊；员工数则为超过 800、1,400 或约
              1,000。最可能的解释是定义漂移，而不是欺诈；但在风险章节里，结论相同：投资人需要管理层级别的口径桥接，才应相信任何头部 KPI。
