      - number: '3.3'
        title: 能力、定价、GTM 与信任 / 监管对比
        blocks:
          - type: paragraph
            body: >-
              与多数金融科技品类相比，能力对比更取决于具体走廊。WorldRemit、Remitly、Western Union、MoneyGram 和 Ria
              都支持银行入账和现金领取的组合，但它们在移动钱包深度、零售依赖，以及结账前多透明地展示费用和 FX 组合上不同。Wise
              在结构上不同：它领先于显性费用提示和数字账户经济，并在可用处支持移动钱包付款，但不像混合汇款在位者那样突出广泛现金领取网络。Remitly 在产品形态上更接近 Zepz，因为它提供同样的消费者承诺：App
              主导开户加付款灵活性。Western Union 和 MoneyGram 保留了「普及带来的信任」，因为汇款人知道品牌，收款人知道取款网络，但这种触达伴随不如 Wise
              优雅的包装和不够简单的费用。信任也不是上市公司或大型在位者的单向优势。过去两年，监管机构因汇款披露或错误解决问题对 Wise、MoneyGram 以及此前的 Sendwave
              采取行动，说明合规质量是品类风险，而非仅属于 Zepz。竞争后果是，Zepz 必须同时守住收款人触达和合规可信度，并提升其数字定价体验的清晰度。
