      - number: '4.5'
        title: 资本充足性和融资依赖仍是核心尽调问题
        blocks:
          - type: paragraph
            body: >
              关于资本充足性的最强公开证据是历史性的，也带有警示。经审计的 2021 年账目显示，完成 Series E 后，Zepz 已筹得扣除费用后的 $259.0 million，另有 $25.0 million
              贷款，年末持有 $116.1 million 现金和 $346.2 million 权益，但仍存在与持续经营相关的重大不确定性。审计师措辞很具体：下行情景会在十二个月内触发收入财务契约违约，Silicon
              Valley Bank 的 $70 million
              循环授信需要展期，管理层可能需要财务契约豁免、额外融资或新的营运资本设施。这很重要，因为后来的公开叙事转向盈利能力主张，却没有用新的经审计数字替代融资分析。2024 年融资又增加 $267 million，其中
              IFC 披露参与 $20 million，独立报道称资金将用于新市场和钱包扩张，而估值未披露。当前公开来源不披露手头现金、债务到期、财务契约余量或现金跑道。最稳妥的结论是，Zepz
              已反复证明可以获得资本，但公开证据仍支持它是融资依赖型业务，而不是透明自我供血型业务。
