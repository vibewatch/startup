  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              判断 Zepz 的风险画像，正确框架不是一家带着噪音的高增长汇款公司，而是一个已有规模的汇款在位者，同时背着多项未解的执行和控制负担。最严重的剩余风险有五项：第一，监管和合规反复，因为 Sendwave
              已有记录在案的 CFPB 执法历史，而公司现在又在跨境汇款承诺之上叠加稳定币功能；第二，执行压力，因为 Zepz 在 2022、2023 和 2025 年经历多轮重组，随后又在 2026 年 3 月进入临时
              CEO 阶段；第三，披露质量风险，因为用户、走廊、国家和员工数等公开指标，在官方和伙伴材料之间对不上；第四，稳定币栈内部的伙伴集中度，Fireblocks、TRM、Circle 和 Solana
              成为产品的一部分，而产品仍依赖汇款牌照和出款伙伴；第五，估值不透明，因为公司 2024 年再次融资，却没有公开重设或重申 2021 年 $5 billion
              标记。单看任何一项都不会杀死故事，但合在一起意味着承销负担已经从需求证明转向控制证明。只有管理层能够对齐运营指标、展示 CFPB
              后的控制补救，并解释一个更精简的组织为何能安全运营更复杂的产品组合，投资人才应把这家公司视为可投。
