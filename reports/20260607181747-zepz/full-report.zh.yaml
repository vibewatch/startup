      - - 2024 股权融资
        - IFC 披露在更大的 $267M 轮次中投资 $20M。
        - 投后估值、优先股堆叠和清算优先级均未披露。
        - 隐藏结构可能让表面融资规模很难代表普通股价值。
        - 要求完整投资条款清单，或要求下行保护。
      - - 2025-2026 运营信号
        - 合作伙伴材料称 2025 年转账额 >$17B，130 个国家用户 >9M。
        - 这些是规模口径，不是已审计盈利或现金流披露。
        - 业务底盘很可能仍有价值，但变现质量仍未证实。
        - 只为已验证盈利能力付费，不为营销式规模说法本身付费。
      - - 2026 领导层与报告状态
        - Companies House 显示 2025 年账目应在 30 Sep 2026 前提交，行业媒体报道 Mar 2026 出现临时 CEO。
        - 正式 CEO 计划和可供投资人使用的报告节奏仍不清楚。
        - 在领导层和报告节奏更稳定前，退出准备度应打折。
        - 推迟承诺，或使用与披露挂钩的分阶段资本。
    notes: |
      本表区分融资能力和价格验证。Zepz 显然融到过钱；问题是没有数据室的投资人能否承销同一套经济性。
