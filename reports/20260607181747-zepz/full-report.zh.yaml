      - number: '2.2'
        title: 用多重视角测算市场规模
        blocks:
          - type: paragraph
            body: >-
              在这里给出单一 TAM 数字会误导，因为公开发布方测量的是不同事物。最保守的官方口径是 World Bank 的说法：2023 年汇回本国的汇款总额约为 $656 billion。World Bank API
              给出的更宽官方视角显示，2024 年全球收到的个人汇款约为 $856.1 billion。Zepz 基础设施合作伙伴 Fireblocks 更进一步，引用了到 2025 年全球汇款市场预计达到 $895
              billion 的说法。这些数字不应被调和成同一组序列；它们在范围、年份和方法论上都不同。对 Zepz 来说，更有用的视角是其核心新兴市场走廊的收款端资金池。仅 South Asia 和 Sub-Saharan
              Africa 在 2024 年就收到约 $239.1 billion。这仍然太宽，不能称为 SAM，因为并非每条走廊都在 Zepz 覆盖范围内，也不是每笔收款流都已具备数字化条件。套用透明的 25% 到
              40%「数字化就绪且已服务走廊」过滤器，可得到证据约束下约 $60 billion 到 $95 billion 的 SAM。相对这一基础，Zepz 公开引用的 2025 年超过 $17 billion
              转账量显示其已有显著当前份额，而 Wise、Remitly 和 Western Union 的公开披露也确认该品类规模大且竞争激烈。
