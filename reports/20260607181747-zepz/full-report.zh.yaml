  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              分析
              Zepz，应放在正式的跨境消费者汇款市场，而不是整个全球跨境支付综合体。相关任务是移民汇款人把家庭资金转给指定收款人，收款人可能需要银行入账、移动钱包、现金领取，或如今的钱包式收款。因此，纳入支出覆盖转账手续费、外汇价差、付款处理，以及更新的钱包邻近场景：Sendwave
              让收款人接收、存储并在之后提取数字美元。排除支出包括 B2B
              供应商应付账款、银行卡收单、旅行换汇、司库、商户结算和多数批发支付流，因为这些市场的买方、合规堆栈和分发经济不同。现状也不是单一在位者。银行仍是昂贵的正式替代方案；Western Union
              式混合网络在需要实体兜底的地方仍相关；移动钱包原生路线在特定走廊可以更便宜；在信任高度本地化的地方，非正式现金转交仍在竞争。这一框架很重要，因为 Zepz
              的输赢取决于每条走廊上的付款相关性和信任，而不是抽象的「全球支付」主张。公开材料也在走廊数量上不一致，进一步说明市场边界主张必须先有精确定义，才足以支撑估值。
