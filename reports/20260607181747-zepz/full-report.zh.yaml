        - 没有当前已审计证据，不要按该标记价或更高价格支付。
      - - 2021 已审计检查点
        - WorldRemit Group 2021 年账目披露 $399.4M 收入和详细成本结构。
        - 当前没有公开的已审计 2025 或 2026 收入 / 利润率披露。
