      - number: '2.4'
        title: 增长驱动、采用约束与未解决的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场确有顺风。ILO 仍统计有 167.7 million 移民在劳动力中，并称这一基数自 2013 年以来增长超过 30 million。GSMA 报告 2025 年移动钱包处理约 $2.1
              trillion，拥有 593 million 个活跃 30 日账户，这显著提升了 Zepz 目标市场的收款端准备度。World Bank 的成本基准也创造了颠覆空间，因为全球汇款定价仍远高于 3%
              政策目标，而银行尤其昂贵。但约束同样真实。走廊扩张需要牌照、AML 控制、司库和合作伙伴尽调，因此增长并不像纯消费者互联网市场那样轻资产。信任也是硬运营变量：CFPB 针对 Sendwave
              的命令显示，披露和错误解决失败可能变成罚款、赔偿和声誉损害。稳定币有前景，但公开来源仍未披露活跃钱包数、留存余额或走廊级经济。投资人因此需要把强劲的品类方向性，与仍缺失、但承销持久份额和利润率所需的公司特定数据区分开。
