      - - 治理路径
        - 临时领导层可能只是过渡，之后由更强的正式运营班子接手。
        - 临时领导层叠加股权结构表不透明、公开治理细节有限，削弱了当前退出准备度。
      - - 合规叙事
        - 已整改的 CFPB 问题可以变成可控的历史伤痕，而不是仍在眼前的投资逻辑破裂点。
        - 如果整改不完整或控制薄弱，合规包袱仍会压缩估值倍数。
    notes: |
