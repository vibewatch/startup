  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 侨民汇款人与收款人架构
        blocks:
          - type: paragraph
            body: >-
              Zepz 卖的不是企业或商户服务，而是在服务反复发生的消费者汇款行为：付款人通常是侨民或移民汇款人，最终用户往往是家庭收款人，资金进入银行账户、移动钱包，或在现金领取网点领取。WorldRemit
              是覆盖更宽的品牌：公开页面称其服务 5.7 million 名客户、70 种货币和 130 个国家；其他 WorldRemit 页面则宣传覆盖 150
              个国家、客户超过五百万名。尼日利亚、肯尼亚和菲律宾的汇款走廊页面呈现出一致模式：汇款人用银行账户或银行卡出资，收款端可在现金领取、银行转账、移动钱包和话费充值之间选择。Sendwave
              更窄、更集中：其支持页和走廊页面明确围绕美国、英国、加拿大和欧洲部分地区的 App 优先汇款人展开，他们主要向非洲和南亚汇款。因此，客户群可以按工作流清楚描述：汇款人是反复使用
              App、用数字方式出资的用户；收款人通常是移动钱包、银行账户或指定合作伙伴现金领取的受益人，而不是带有披露留存经济性的合同账户持有人。
