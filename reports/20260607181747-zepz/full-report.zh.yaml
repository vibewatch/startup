      - number: '5.4'
        title: 运营模型依赖消费者 App 分发、付款合作伙伴和具名钱包基础设施
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，即便前端感觉简单，Zepz 的产品交付模型也很重。两个品牌都依赖消费者 App 分发、走廊特定付款伙伴、合规检查和支持运营，而不是纯软件闭环。WorldRemit 仍营销 App
              和网页发起加转账追踪，Sendwave 走廊页面则描述借记卡和预付卡注资，资金随后到达移动钱包、银行账户或现金领取地点。钱包又增加了一层依赖：USDC 运行在具名公开发布轨道上，Fireblocks
              负责司库和结算，TRM 负责金融犯罪监测。这些依赖本身并非负面，但每一项都会增加执行表面积。


              支持可见，但可靠性遥测不可见。WorldRemit 联系流程把用户推向帮助中心和转账状态工具；Sendwave 联系页面宣传 24/7 App
              内支持和地区电话线。这足以说明客户运营对运营模型很重要。公开材料没有提供等同证据来说明正常运行时间、事故历史或服务级别承诺。换句话说，Zepz
              的公开产品技术材料更擅长解释客户能做什么，而不是量化堆栈在负载下有多可靠、支持升级有多频繁，或稳定币层在生产环境中如何表现。这是尽调缺口，而不是发明隐藏架构的理由。
