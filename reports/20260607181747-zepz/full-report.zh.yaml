      - number: '5.2'
        title: Sendwave Wallet 将产品延伸到储值和稳定币汇款，但推出节奏仍具选择性
        blocks:
          - type: paragraph
            body: >-
              超越经典汇款的关键产品扩展是 Sendwave Wallet。实时钱包页面称，该产品目前仅面向来自 United States
              的汇款人开放，这立刻告诉投资人两件事：第一，钱包是已上线的真实界面，而不是概念；第二，推出仍按地理分阶段推进。公开钱包信息在标准转账流程之上叠加了几项好处：部分市场更好汇率或返现、非 USDC
              流程退款更快、24/7 支持、持有数字美元的能力，以及收款人可自行选择何时转换或花费。钱包 FAQ 还增加了两个重要运营细节：开通和维护钱包免费，钱包到钱包的数字美元转账被描述为已在 113 个以上国家上线。


              稳定币堆栈如今已有公开日期戳。Zepz 2025 年 10 月 24 日的发布稿将 Sendwave Wallet 描述为基于 Circle、Solana 和 Portal
              构建的稳定币支持点对点跨境资金解决方案。Fireblocks 随后在 2025 年 12 月 16 日表示，Zepz 将使用其司库和结算基础设施，为 WorldRemit 和 Sendwave
              扩大稳定币汇款；TRM Labs 则在 2026 年 3 月 25 日称，其区块链情报将帮助 Zepz
              在钱包扩张时管理金融犯罪风险。这足以说明钱包已成为集团真实运营模型的一部分。但还不足以推断自研架构或广泛全球完成度，因为同一个钱包页面仍承诺更多国家和更多注资、取现方式，而不是已经完成的覆盖版图。
