      - number: '7.5'
        title: 缓释因素、监控与投资逻辑破裂指标
        blocks:
          - type: paragraph
            body: >-
              公开缓释因素确实存在，而且重要。Zepz 拥有广泛牌照布局，发布州级投诉路径，披露隐私和合同条款，称 Sendwave App 已获 PCI DSS 认证，并称稳定币栈正与 TRM 金融犯罪控制和
              Fireblocks 结算基础设施一起搭建。这些缓释因素足以避免仅凭公开证据就给出一刀切的回避结论。它们不足以消除严密监控的需要。最清晰的短期指标都可观察：任何新的 CFPB
              或州监管行动；任何进一步裁员或实体关闭；无法在可信时间表内任命永久 CEO；尽调中无法对齐当前用户、走廊和员工数；任何涉及制裁筛查、提现、安全或伙伴宕机的稳定币事件；以及任何相较 2021
              年标记意味着持平或下调经济性的新增融资。传导路径很直接。合规或伙伴失败会伤害信任，并可能叫停产品扩张；定价压力侵蚀抽佣率；又一轮重组会抬高服务和执行风险；如果必须再次融资，估值不透明会限制下行保护。因此，举证责任在管理层。一份令人满意的尽调包应包括按实体和司法辖区拆分的完整牌照矩阵、CFPB
              后补救证据、永久 CEO 搜寻计划、对齐后的运营指标、Fireblocks / TRM / Circle / Solana 的伙伴备份计划，以及关于 2024
              融资条款和当前估值的坦诚更新。在此之前，投资逻辑仍成立，但带条件。
