chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立历史，以及 Zepz 实际销售什么
        blocks:
          - type: paragraph
            body: >-
              Zepz 是支撑两个消费者汇款品牌 WorldRemit 和 Sendwave 的控股公司。核心起源仍然要从 WorldRemit 讲起。公司官方材料称，创始人 Ismail Ahmed
              因亲身经历向东非家人汇款的成本和摩擦，于 2010 年在伦敦创立 WorldRemit。WorldRemit 随后加入联合创始人 Catherine Wines 和 Richard
              Igoe，打造了一个数字优先的跨境转账产品，用 App
              和网页发起替代线下代理网点。公司围绕银行入账、现金领取、话费充值和移动钱包收款扩张；在非洲和亚洲走廊，收款人往往银行服务不足，这正是关键的产品切入口。Sendwave
              增加了第二个移动优先品牌，强调低摩擦转账，尤其面向非洲和亚洲，如今还把基于钱包的 USDC 转账作为额外产品界面来营销。集团结构形成于 WorldRemit 2021 年 2 月完成对 Sendwave
              的收购，并在当年晚些时候将控股公司更名为 Zepz。公开材料仍显示明显的品牌层级不对称：WorldRemit 称有 5.7 million 客户和 70 种货币，而 Sendwave 强调像发短信一样简单的 UX
              和更新的数字钱包主张。尽调中最清晰的解读是，Zepz 不是单一消费者品牌，而是一个共享平台和资本结构，管理两块相互重叠的汇款业务；消费者分发仍按品牌推进。
