      - number: '6.4'
        title: 扩张路径、集中度暴露与伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Zepz
              服务的是数百万小额消费者汇款人，而不是少数大型企业账户，因此主要集中度问题不是经典的大客户集中度，而是走廊、出款伙伴和监管集中度。公开来源没有披露大客户组合或走廊收入占比，甚至公开走廊总数也互相冲突：Sendwave
              信任页面称集团服务超过 900 万名用户、覆盖 2,000 条走廊；Fireblocks 公告则称超过 900 万名客户、覆盖 5,000 条走廊。能够观察到的是对伙伴和轨道的依赖。WorldRemit
              的现金领取和移动钱包 FAQ 清楚说明，收款人依赖本地代理网络、有效 ID、SMS 参考码和出款服务商。Sendwave 的走廊页面以更具体形式暴露同一依赖：MTN Ghana 额度、孟加拉国 bKash
              容量限制、尼日利亚现金领取的具名银行伙伴，以及汇错账户时由伙伴协助追回。扩张现在也高度依赖伙伴。Sendwave Wallet 仅面向美国汇款人，其稳定币路线图依赖 USDC，以及 TRM 和
              Fireblocks 提供合规、资金管理和结算能力。因此，2023 年 CFPB 行动是高度相关的客户证据：在一个重监管产品里，伤害客户信任的不只是差评，还包括披露失败或速度承诺失败。
