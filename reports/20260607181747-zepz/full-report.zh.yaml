  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: WorldRemit 提供付款广度，Sendwave 增加移动优先的走廊界面
        blocks:
          - type: paragraph
            body: >-
              WorldRemit 和 Sendwave 应被视为互补产品界面，而不是建立在同一客户主张上的装饰性品牌。WorldRemit
              的公开帮助和使用说明堆栈仍像一个经典数字汇款产品，但末端选择异常广：银行转账、现金领取、移动钱包和话费充值都被列为一等收款方式，汇款人流程仍是 App
              或网页自助。这在非洲和亚洲走廊很重要，因为收款轨道常常就是产品本身。拥有银行账户的城市收款人、银行服务不足的移动钱包用户，以及依赖现金的家庭，并不看重同一种末端选项。WorldRemit
              公开材料明确把移动钱包定位为银行账户替代方案，并描述账单支付、购物、话费购买和代理取现等用途，这正是侨民汇款运营商在银行服务不足市场所需要的契合度。


              Sendwave 的公开界面更窄，但更尖锐。其走廊页面和品牌故事强调快速、低成本、移动优先的汇款，而当前国家中心页面仍把非洲和亚洲放在叙事中心。Ghana 和 Philippines
              的样本实时走廊页面仍提示汇款人选择收款方式、付款并追踪，至少一个非洲走廊页面明确列出移动钱包、银行账户和现金领取地点。实际解读是，Zepz 仍首先通过付款相关性和走廊包装差异化，而不是依靠一个全球统一的产品外壳。
