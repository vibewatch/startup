      - number: '3.2'
        title: 竞争对手画像：规模、融资、产品范围与定价姿态
        blocks:
          - type: paragraph
            body: >-
              与 Wise 和 Remitly 的直接数字化重叠最清晰。Wise 现在披露 18.9 million 活跃客户和 £181.7 billion 的 FY26 跨境交易量，定位围绕低显性费用、透明
              FX，以及账户或钱包连接的交付，而不是现金密集走廊。Remitly 是最接近 Zepz 的同类侨民 App 竞争对手：其报告超过 9.6 million 客户，覆盖 175+ 个国家，2025 年汇出量
              $74.9 billion，并提供因走廊而异的银行入账、现金领取、移动钱包和送货上门等付款选项。混合在位者在实体分发上更大，或至少更广。Western Union 仍把 500,000+
              零售网络与数字交付结合起来，并在 2025 全年产生 $4.1 billion GAAP 收入；MoneyGram 在 2023 年被 Madison Dearborn 私有化后，强调 50+ million
              客户、近 500,000 个网点和 5 billion 个数字端点。Ria 在品牌心智中没那么重要，但基础设施上并非如此：它称在 200 个国家和地区拥有 600,000+ 网点，并属于上市母公司
              Euronet，后者的转账业务仍在数字化增长。因此，Zepz 面对的不是一个单一巨型对手；它一侧是专门的数字颠覆者，另一侧是有规模的混合在位者。
