  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 服务商
      - 公开定价界面
      - 代表性公开线索
      - 资金来源 / 汇款模式
      - 强调的收款选项
      - 透明度推断
      - 对 Zepz 的含义
    rows:
      - - Zepz / WorldRemit
        - 首页计算器
        - 价格和速度随走廊、收款方式和付款方式变化；公司称比大多数银行便宜 46%
        - 数字化汇款；多种付款方式
        - 银行入账、移动货币、现金领取、话费充值
        - 消费者报价透明度较好，但面向投资者的公开披露少于上市对手
        - 必须守住收款覆盖广度，同时提高规模和性价比的公开清晰度
      - - Wise
        - 手续费页加汇款流程
        - 费用低至 0.1%；价格低且清晰；定位为无隐藏汇率费
        - 数字账户和 App 流程
        - 以账户转账为主；支持地区可用移动钱包
        - 组内公开价格透明度最好
        - 最强的数字费用标杆；Zepz 对照之下可能显得不够透明
      - - Remitly
        - 实时货币转换器
        - 按走廊显示精确汇率；靠交易费和 FX 价差变现
        - 数字 App / 网页流程
        - 银行入账、现金领取、移动钱包、送款上门
        - 报价层面透明度高，但没有一张静态全球费率表
        - 与 Zepz 最接近的同类侨民汇款 App 竞争者
      - - Western Union
        - 汇款流程和银行转账页面
        - 按报价定价；线上 / 门店付款混合打包
        - 数字流程叠加门店起点或终点
        - 现金领取、银行账户、钱包
        - 结账时透明，但费用叙事不如 Wise 简单
        - 收款人或汇款人需要线下兜底时仍有胜算
      - - MoneyGram
        - 费用 FAQ 和在线汇款页面
        - 费用随走廊、金额、出资方式和收款方式变化；银行卡可能更贵
        - 数字汇款叠加强线下兜底
        - 银行、银行卡、钱包、现金领取
        - 结账透明度够用，但营销表达不够简洁
        - 收款灵活性比价格简单更重要时有竞争力
      - - Ria
        - 在线汇款计算器
        - 实时查汇率和首笔转账优惠信息
        - 数字汇款和线下网络
        - 现金领取、银行入账
        - 报价驱动、优惠驱动
        - 特定走廊可能低价胜出或打平，但品牌心智次一级
      - - 银行 / 卡转账
        - 报价常不透明或速度慢
        - World Bank 显示，银行平均是成本最高的正规渠道
        - 基于账户的转账
        - 多数走廊只支持银行账户
        - 小额转账的消费者清晰度低
        - 对照银行转账痛点，Zepz 仍能受益
      - - 移动钱包原生 / 非正规
        - 钱包原生定价，或非正规议价
        - GSMA 称，移动钱包汇款明显低于全球平均成本；非正规现金不透明
        - 钱包 App 或本地代理交接
        - 钱包或现金
        - 混合：移动钱包可以清晰；非正规现金不透明
        - 在特定收款生态里是真替代品，尤其收款人本来就高频使用钱包时
    notes: 代表性线索来自公开落地页和监管 / 基准来源，并非模拟实时交易。精确走廊排名持续变化，应视为动态而非静态。
