      - number: '7.2'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              Zepz 最具体的负面风险是 Sendwave 的执法记录。CFPB 2023 年 10 月的命令并不是指出小的文书疏漏；命令称 Sendwave 对速度和成本作出误导陈述，未按 Regulation E
              提供必要汇款披露，错误要求客户放弃权利，并对纠错流程处理不当。这一点重要，是因为公司的当前策略不是简化产品面，而是扩宽产品面。Sendwave 自有信任和监管页面称，集团横跨 FinCEN
              和美国州级汇款牌照体系、英国 FCA、加拿大 FINTRAC 和比利时 NBB 运营；其隐私和条款材料也清楚说明，个人数据处理、生物识别身份核验、按司法辖区区分的客户条款，以及按交易区分的费用和 FX
              披露，都会因产品和国家而异。稳定币钱包进一步抬高复杂度：钱包 FAQ 引入 USDC、Circle、Solana，以及新的转账 / 提现行为；隐私通知确认 Zepz
              处理生物识别和收款人数据，并可能在法律要求下与伙伴或公共机构共享数据。公司确实发布了缓释因素——PCI DSS
              认证、审计表述、举报和反贿赂政策，以及州级投诉路径——但公开记录仍未显示按实体逐一对应的监管确认、CFPB
              后补救测试，或钱包披露的法律控制矩阵。按尽调语言，这是一个高严重度但已有部分缓释的风险：牌照看起来覆盖很广，但一次有记录的美国消费者保护失败，会让任何新的产品控制失误比白纸型运营商更具破坏性。
