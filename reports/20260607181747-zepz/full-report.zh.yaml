      - number: '8.4'
        title: 乐观、基准与悲观区间及估值桥接
        blocks:
          - type: paragraph
            body: >
              处理 Zepz 的正确方法是情景逻辑，而不是单点估值。乐观情景下，公司重新赚回接近 2021 年光环的东西，因为管理层证明 2025-2026 年审计收入显著高于 2021 年水平，展示出持久的 EBITDA
              或自由现金流转正，补上 CFPB 和控制补救缺口，并把领导层问题解决为一名永久 CEO 和可信的退出准备型治理。这条路径可以支持 $3.5 billion 至 $5.0 billion
              区间，旧峰值只有在区间高端才够得到。基准情景更保守，也更符合公开证据：Zepz 仍有规模，但缺失的审计桥接、未披露的 2024 年估值，以及私募轮结构风险，把公允价值压到更接近 $2.0 billion 至
              $3.0 billion。悲观情景适用于 2024 年轮次经济性被证明为持平或下调、利润率弱于市场假设，或出现进一步合规或治理摩擦；在该结果下，$1.0 billion 至 $1.8 billion
              区间说得通。因此，估值桥接从 2021 年 $5 billion
              锚点开始，扣除缺失审计证明和未知轮次条款的折扣，然后只为仍然庞大的业务部分加回规模信用。这个逻辑产生的是低于旧峰值的偏好入场区间，而不是试图把当前不确定性解释掉。
