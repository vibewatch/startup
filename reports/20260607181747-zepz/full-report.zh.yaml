        - 2021 年收入成本 $152.6m；账目中披露定价风险。
        - 按走廊提供付款方式和收款方式成本栈。
      - - FX 管理与对冲
        - 收入部分依赖 FX 价差；2021 年账目还出现衍生品和 FX 损失。
        - 同时影响收入捕获和毛利以下波动。
        - 2021 年衍生品公允价值损失 $12.3m；还披露外汇损失。
        - 提供对冲政策、净 FX 收入和走廊敞口集中度。
      - - 拒付、欺诈和交易损失
        - 拒付和其他损失是披露的费用类别；Remitly 也单独报告交易损失准备。
        - 抬高直接交易成本和损失波动。
        - Zepz 2021 年拒付和其他损失 $12.5m；Remitly 2025 年交易损失准备增加。
        - 按出资方式提供欺诈损失率和拒付率。
      - - 客户促销和汇率补贴
        - 新客免手续费和更优 FX 汇率先压低收入，随后才体现为营销。
        - 即便标价看起来有吸引力，也会拉低实际 take rate。
        - 审计账目明确披露收入确认政策。
        - 提供促销量占比和促销后留存。
      - - 营销与传播
        - 历史上是人员费用之后最大的已披露 opex 科目。
        - 是撬动 EBITDA 和现金消耗的关键杠杆。
        - 2021 年 $93.7m，约为收入的 23.5%。
        - 按效果、品牌、推荐和留存渠道提供当前支出。
      - - 人员、IT、合规和支持
        - 员工费用、IT、客服和合规嵌在行政成本和产品风险控制中。
        - 安全扩张离不开这些投入，但可能推迟盈亏平衡。
        - 2021 年员工费用 $113.1m、IT $26.9m；同业支持成本仍然可观。
        - 按产品、合规、欺诈、支持和工程拆分组织成本。
    notes: 最详细的公开成本栈来自 2021 年审计文件。后续资料讨论盈利能力和裁员，但没有更新后的成本桥；因此，当前利润率驱动因素只能从较早审计账目和公开同业中推断。
