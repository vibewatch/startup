      - number: '1.3'
        title: 融资历史、估值锚点与控制型股东
        blocks:
          - type: paragraph
            body: >-
              资本形成历史是公开记录中记录最充分的部分之一。WorldRemit 自己在 2021 年 8 月的公告称，Zepz 在收购 Sendwave 并将控股公司更名后不久，以 $5 billion 估值完成 $292
              million 的新增 Series E 新股融资。该轮引入 Farallon Capital，同时延续 LeapFrog、TCV 和 Accel 的支持。随后，2024 年公开文章报道了一轮由 Accel
              领投、LeapFrog、TCV、Coller Capital 和 IFC 参与的 $267 million 新股融资。IFC 自己的披露页面确认，其向 WorldRemit Group Limited 投入
              $20 million 股权，作为更大规模 $267 million 融资的一部分；不过 IFC 将该融资标为 Series X，而行业媒体使用 Series F。关键尽调结论不是轮次标签，而是财务含义：Zepz
              在 $5 billion 标记三年后融资了大量新股，却没有公开披露更新估值。该遗漏很重要，因为投资人缺少当前市场出清价格锚。Companies House 还显示，英国集团实体内部持续存在公司活动、股份动作和
              2024 年账目提交，确认资本和治理堆叠仍然活跃，尽管集团保持私有。因而，Zepz 拥有可信背书方和融资通道，但 2024 年后的具体所有权、清算优先权和估值仍未公开。
