      - number: '8.6'
        title: 图表要点
        blocks:
          - type: callout
            title: 不要把融资能力误认为价格验证
            body: 2024 年融资证明 Zepz 仍能募资。它不能证明在没有估值机制和当前审计数字的情况下，外部投资人应该支付同样的普通股价格。
