  - id: TP001
    title: 竞争对手画像表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the main direct, incumbent, and substitute options relevant to Zepz in consumer remittances and diaspora
        corridors; excludes small corridor-specific local operators without public evidence.
    columns:
      - 服务商
      - 相对 Zepz 的角色
      - 公开规模信号
      - 所有权 / 融资状态
      - 核心收款方式
      - 定价姿态
      - 战略方向
      - 相对 Zepz 的关键弱点
    rows:
      - - Zepz / WorldRemit
        - 研究对象；数字优先的汇款专营商
        - 5.7M 客户；130 个国家；70 种货币
        - 私人公司；最新公开估值仍锚在 2021 年 $5B；当前估值未披露
        - 银行入账、移动货币、现金领取、话费充值
        - 实时报价；价格 / 速度随走廊、收款方式和付款方式变化；公司自称比大多数银行便宜 46%
        - 守住侨民汇款走廊，同时拓宽钱包和数字金融界面
        - 公开披露少于上市同业；纯手续费透明度声誉弱于 Wise
      - - Wise
        - 直接数字化对标方
        - 18.9M 活跃客户；£181.7B FY26 跨境交易量
        - 上市公司（Wise PLC）
        - 账户转账；支持地区提供移动货币；现金领取不是主打方案
        - 明确以手续费定价主导；费用低至 0.1%；低抽成率策略
        - 继续累积透明跨境账户的经济性
        - 现金领取或混合收款选项占主导的市场相关性较弱
      - - Remitly
        - 直接数字化对标方
        - 9.6M+ 客户；$74.9B 2025 年汇出量；175+ 个国家
        - 上市公司（Remitly Global）
        - 银行入账、现金领取、移动钱包、按走廊提供上门配送
        - 通过计算器提供按走廊实时报价；靠手续费加汇差变现
        - 从基础汇款扩展到更广的移民金融场景
        - 全球价格领先地位无法静态精确观察；公开监管记录比同业更轻，但仍需持续监控
      - - Western Union
        - 规模化混合型在位者
        - 500,000+ 个代理点；200+ 个国家；$4.1B FY2025 GAAP 收入
        - '上市公司（NYSE: WU）'
        - 现金领取、银行账户、数字钱包、店内和线上支付
        - 实时报价；线上 / 线下混合打包；不是标题手续费最清晰的品牌
        - 数字化传统网络，提高品牌数字化占比，并测试稳定币通道
        - 传统复杂度和零售成本底座会削弱纯 App 经济性
      - - MoneyGram
        - 规模化混合型在位者
        - 50M+ 客户；近 500,000 个网点；5B 个数字端点
        - 2023 年 Madison Dearborn 收购后转为私人公司
        - 现金领取、银行账户、银行卡、移动钱包
        - 实时报价；费用取决于走廊、金额、资金来源类型和收款方式
        - 在保留全球现金网络的同时提高数字化占比
        - 近期 NYAG 和解削弱信任叙事；私有化所有权比上市同业更不透明
      - - Ria
        - 混合型在位者 / 次级品牌威胁
        - 600,000+ 个网点；200 个国家和地区；3.7B 数字钱包触达
        - 由上市母公司 Euronet 持有
        - 现金领取、银行入账、数字化汇款流程
        - 以计算器引导报价；在线流程以首笔转账促销切入
        - 借 Euronet 投资和数字化增长深化混合汇款
        - 消费者心智低于 Western Union 或 MoneyGram
      - - 银行和银行卡资金电汇
        - 现状替代方案
        - World Bank 数据中，银行渠道平均成本为 12.66%
        - 在位银行资本底座
        - 多数情况下仅银行账户
        - 通常成本高、速度慢；可信品牌可抵消较差经济性
        - 留住偏好传统金融机构的客户
        - 小额侨民汇款成本高，现金或钱包交付能力弱
      - - 移动货币原生和非正规现金路径
        - 收款侧替代方案
        - GSMA 数据中，移动货币汇款成本显著低于全球平均
        - 分散的钱包、电信运营商、本地代理和非正规网络
        - 钱包入账或非正规现金交接
        - 高度走廊特定；可能比银行通道便宜，但跨走廊可携带性较弱
        - 在收款人行为已是钱包原生或非正规时胜出
        - 合规、可追踪性或广泛跨境覆盖往往有限
    notes: 融资和所有权字段区分上市公司的资本获取、私募股权支持以及 Zepz 当前估值披露有限，而不是硬套一项苹果对苹果的风险融资指标。
