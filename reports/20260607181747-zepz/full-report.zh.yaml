      - number: '5.5'
        title: 差异化是运营型且走廊特定，公开缺口仍在完整性和证据上
        blocks:
          - type: paragraph
            body: >-
              公开来源中最强的产品技术差异化，是对非洲和亚洲走廊的运营适配。WorldRemit
              保留了公开记录中最广的明确付款菜单；在收款人会在银行入账、移动钱包、现金领取和电信连接价值之间切换的地方，这很重要。Sendwave
              用更简单的移动优先获客动作和现在的钱包层补充这种广度；钱包可以持有数字美元并延后转换。合在一起，这些界面让 Zepz 相比单轨账户到账户汇款 App
              拥有更灵活的走廊主张。应用商店覆盖也显示两个品牌拥有真实移动分发，而非纯概念产品。


              但差异化案例有边界。公开材料没有披露足以支撑深技术护城河主张的自研匹配引擎、司库算法或基础设施性能。最接近的开发者信号是招聘和 App 分发，而不是公开 API
              或开发者生态。同样，钱包故事在发布伙伴上比生产指标更具体：公司点名 Solana 相关发布轨道、Fireblocks 和
              TRM，却没有发布钱包交易量、失败率，或完整实时取现走廊矩阵。因此，正确尽调结论应保持平衡：Zepz
              在付款广度和钱包可选性重要的地方看起来有实质差异化，但这种边缘最好仍被描述为由选择性新基础设施支撑的运营模型强项，而不是公开证实的自研平台护城河。
