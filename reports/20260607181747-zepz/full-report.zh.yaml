      - number: '1.2'
        title: 创始人延续、CEO 交接与治理可见度
        blocks:
          - type: paragraph
            body: >-
              领导层记录显示创始人延续性很强，但治理透明度并不完整。WorldRemit 官方材料确认 Ismail Ahmed 为创始人，并称他目前担任董事长，而非日常运营者。2022 年 9 月，Zepz 宣布 Mark
              Lenhard 出任集团 CEO，称其曾任 Bill.com 和 Invoice2go 高管，并有 PayPal 和 JPMorgan 经历。此后，Lenhard 成为整合叙事、盈利能力表述和 2024
              年融资的公开代表。2026 年 3 月，治理图景再次变化：FinTech Futures 报道 Lenhard 离任，CFO Barrie Morris 出任临时 CEO。Companies House
              文件历史与这一交接一致：WorldRemit Group Limited 于 2026 年 3 月 27 日记录了 Morris 的董事任命和 Lenhard
              终止董事职务。也就是说，领导层交接是真实发生的，并非只是传闻；但它也带来执行问题，因为公司尚未披露永久继任者、完整现任董事会名单，或可与上市公司相比的投资人治理图谱。考虑到 Zepz
              历史上拥有较高私募估值，但委员会结构、投票权或优先股堆叠的公开讨论有限，额外的治理不透明也清晰可见。结果是，公司仍显得受创始人影响、使命驱动，但当前运营领导层和董事会动态需要管理层尽调，不能靠假设补足。
