      - CV016
      - CV017
      - CV019
      - CV020
      - CV021
      - CV023
      - CV024
      - CV030
      - CV031
      - CV032
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持较宽的公允价值区间，以及低于 2021 年峰值的优先进入区间。
    data:
      items:
        - label: 悲观
          low: 1
          mid: 1.4
          high: 1.8
          displayValue: $1.0B-$1.8B
          detail: 融资轮条款令人失望，或当前经审计经济性弱于市场假设。
          tone: risk
        - label: 基准
          low: 2
          mid: 2.5
          high: 3
          displayValue: $2.0B-$3.0B
          detail: 业务已有规模，但仍受披露约束；只有拿到折价或结构保护才投资。
          tone: neutral
        - label: 乐观
          low: 3.5
          mid: 4.2
          high: 5
          displayValue: $3.5B-$5.0B
          detail: 需要经审计证据、干净的整改结果和更强治理。
          tone: positive
        - label: 优先进入区间
          low: 1.8
          mid: 2.2
          high: 2.6
          displayValue: $1.8B-$2.6B
          detail: 在不假设回到 2021 年峰值的情况下，公开证据对应的下行风险得到更好补偿的区间。
          tone: positive
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 投委会落笔定价前，最该盯住这些估值锚点。
    data:
      items:
        - label: 最新公开估值
          value: $5.0B
          detail: 2021 年 8 月 Series E 轮估值锚点。
          tone: neutral
        - label: 最新披露轮次
          value: $267M
          detail: 2024 年股权融资，但估值未披露。
          tone: neutral
        - label: IFC 参投
          value: $20M
          detail: 2024 年融资中，IFC 官方确认的投资。
          tone: positive
        - label: 2020 年官方收入
          value: $338M
          detail: 公司口径收入锚点，用来测算 2021 年峰值倍数。
          tone: neutral
        - label: 最新经审计收入
          value: $399.4M
          detail: 2021 年集团账目经审计数字；更新的审计数字仍未公开。
          tone: neutral
        - label: 2025 年转账量口径
          value: '>$17B'
          detail: 可作为规模信号，但不是经审计的盈利披露。
          tone: positive
        - label: 上市可比公司代理区间
          value: 0.6x-4.7x
          detail: Western Union / Euronet 到 Wise 这些上市同业的市值 / 收入区间。
          tone: neutral
        - label: 2025-2026 年最新经审计收入
          value: Undisclosed
          detail: 判断当前估值时最大的卡点。
          tone: risk
        - label: 正式 CEO 状态
          value: Open
          detail: 公开记录显示，2026 年公司仍是临时 CEO，而非已落定的长期运营负责人。
          tone: risk
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV009
      - CV010
      - CV012
      - CV033
