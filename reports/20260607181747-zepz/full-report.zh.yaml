      - number: '1.4'
        title: 规模信号真实，但披露口径内部不一致
        blocks:
          - type: paragraph
            body: >-
              Zepz 显然已有规模，但公开数字在时间、实体和定义之间并不能整齐对齐。WorldRemit 的关于页面称，该品牌服务 5.7 million 客户，覆盖 130 个国家，使用 70 种货币，雇用超过 1,000
              人。较早的集团层面新闻稿描述的是 150 个国家超过 11 million 用户、超过 5,000 条走廊、约 1,500 名员工，以及 2020 年每月 4.5 million 笔交易。2023
              年增长计划文章保留了 5,000 条走廊和 1,400 人的表述，而 Sendwave 信任页面上的 2026 年现代奴役声明称，Zepz 在 130 多个国家、仅 2,000 条走廊服务超过 9 million
              用户。2026 年合作伙伴和 PR 材料随后引用 2025 年转账超过 $17 billion，并继续使用 9 million
              用户口径。这些并不意味着公司虚报规模；更可能的解释是，不同文件采用了不同范围，例如活跃汇款人对总用户、历史集团指标对品牌指标，或当前支持走廊对技术可达路线。即便如此，这种不一致仍具有实质性，因为它阻止外界把一句简洁的公司规模快照视为经审计事实。公开尽调因此应使用保守数字，为每个指标标注日期，并把当前准确员工数、走廊数和合并收入列为待管理层对齐的开放项。
