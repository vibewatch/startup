        blocks:
          - type: paragraph
            body: >-
              汇款中的经济买方通常是汇款人，但产品用户往往分为汇款人和收款人。汇款人支付费用并选择
              App，但收款人的付款需求常常决定哪个品牌真正赢下交易。需要立即现金领取的家庭，与可以接受银行入账的家庭行为不同；两者又不同于希望先在钱包里持有 USDC
              再兑换的用户。因此，预算归属更像家庭现金流分配，而不是企业软件采购。采用通常从一次紧急转账需求、实时比价和 KYC 检查开始。只有付款稳定成功、收款人信任取现路径，复用才会发生。Zepz
              的钱包动作增加了第二条采用路径：移民汇款人可能从传统转账开始，但为了存储数字美元、选择转换时间等保值用例留下来。结果是，这个市场中买方、用户和付款方角色在标题层面简单，实际运营中却受走廊、付款轨道和收款人行为塑形。
