      - number: '5.3'
        title: 公开控制堆栈有意义，但 CFPB 历史让合规始终位于投资逻辑中心
        blocks:
          - type: paragraph
            body: >-
              Zepz 确实有可见的公开控制堆栈。在 WorldRemit
              侧，对一个消费者汇款产品而言，资金保护和开户语言相当具体：公司称等待付款的客户资金存放在专门客户资金账户中，其客户接受政策明确提到反洗钱、制裁、反贿赂、开户尽调和持续检查。在 Sendwave
              侧，公开信任页面比许多私营金融科技公司更清楚地说明监管边界。它称覆盖美国 FinCEN 和州牌照、英国 FCA 授权、加拿大 FINTRAC、欧盟 NBB 护照化、GDPR 合规、频繁审计，以及移动 App 的
              PCI DSS 认证。公开安全页面还称，开户可能需要身份验证和唯一安全码，而钱包页面增加了 passkey 登录和 256-bit 加密。


              这些正面证据不应被夸大。公开记录中最强的反向产品技术事实，仍是 CFPB 在 2023 年针对 Sendwave 运营方的命令。该局称 Sendwave 作出误导性汇款声明并违反 Regulation E
              要求，随后要求消费者赔偿和民事罚款。这不否定当前钱包或汇款产品，但会改变承销方式。对本章而言，正确立场是：Zepz 的公开控制叙事真实存在，但投资人应把合规执行视为运营依赖，而不只是法律附录。
