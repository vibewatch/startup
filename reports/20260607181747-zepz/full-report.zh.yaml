  - id: TU006
    title: 扩张与集中度风险表
    columns:
      - 扩张驱动 / 集中度风险
      - 类型
      - 当前状态
      - 影响
      - 尽调路径
    rows:
      - - 终端客户集中度
        - 结构性正面 / 未知
        - 未披露头部客户；消费者基础看起来分散
        - 传统单一客户风险低，但公开数据未量化分散度
        - 要求按走廊和消费分层提供活跃汇款人分布
      - - 走廊集中度与路线总数不一致
        - 集中度风险
        - 公开总数在 2,000 和 5,000 条走廊之间冲突
        - 公开资料无法测算真实路线集中度
        - 要求提供前 20 条路线的走廊收入、交易量和活跃汇款人集中度
      - - 出款合作伙伴依赖
        - 合作伙伴依赖
        - 现金领取银行、移动钱包、ID 检查和 SMS 引用中都能看到这种依赖
        - 合作伙伴宕机、余额上限或网点摩擦会直接伤害客户体验
        - 要求提供出款合作伙伴集中度和 SLA 失败数据
      - - 尼日利亚监管依赖
        - 反向监管敞口
        - Sendwave 称，不再允许向尼日利亚外币账户发送美元汇款
        - 监管可能迫使出款方式改变，并扰乱走廊经济性
        - 要求提供走廊变更日志，以及监管规则变化对收入的影响
      - - 稳定币 / 钱包扩张栈
        - 扩张驱动与依赖
        - Sendwave Wallet 仅面向美国汇款人上线；TRM 和 Fireblocks 支撑合规与结算
        - 留存和降本有上行空间，但也增加加密资产 / 合规交易对手依赖
        - 要求提供钱包采用、留存余额和出款合作伙伴依赖图
      - - 执法造成的客户信任压力
        - 反向信任 / 合规风险
        - CFPB 在 2023 年因速度、成本和披露失败下令补偿并处罚
        - 监管质疑服务承诺时，获客和留存会受损
        - 要求提供投诉趋势、整改支出和命令后控制测试
      - - 钱包带动的增购机会
        - 扩张驱动
        - Sendwave Wallet 为美国汇款人增加更优汇率、返现、更快退款和数字美元存储功能
        - 如果采用范围扩至美国之外，可能把一次性汇款人转成基于账户的复用用户
        - 要求提供钱包 MAU、入金钱包比例，以及相较非钱包用户的复汇提升
    notes: 最明显的集中度风险不是企业式客户集中度，而是走廊、出款合作伙伴和监管依赖。钱包扩张有吸引力，但仍处早期且以美国为中心。
    claimRefs:
      - CU027
