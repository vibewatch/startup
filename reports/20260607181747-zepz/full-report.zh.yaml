      - number: '8.3'
        title: 可比公司集合与公开市场代理读数
        blocks:
          - type: paragraph
            body: >
              可比公司集合需要尊重商业模式差异，而不是硬套一个整齐倍数。Wise 是数字化上界，因为它同时具备全球规模、抽佣率纪律和异常强的披露；CompaniesMarketCap 与 Wise FY2026
              交易更新合起来，隐含约 4.7x 的市值 / 收入代理倍数。Remitly 是最接近的公开汇款 App 同行，按同一代理倍数约 2.3x，明显更低，即便它拥有 9.6 million 名客户和 $74.9
              billion 的 2025 年汇款量。Western Union 和 Euronet 接近 0.6x 市值 / 收入，反映出增长较慢、传统或多元化结构，以及公开市场对成熟资金流动模型的怀疑。MoneyGram
              仍具战略相关性，但自 Madison Dearborn 收购后已私有化，因此估值不干净。实际教训不是 Zepz
              必须精确按某个公开倍数定价。私募成长公司如果能显示更快增长、更干净经济性和更多可选项，可以拿到溢价。教训在于，Zepz 旧的 $5 billion 峰值约等于 2020 年收入的
              14.8x，远高于今天的公开代理区间。这让 2021 年标记更像乐观的历史参照，而不是公允价值捷径。公开可比公司支持一个宽区间：Wise 是数字化天花板，Remitly 是最接近的运营检验，Western
              Union 加 Euronet 则是混合型底部。
