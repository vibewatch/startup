      - number: '7.4'
        title: 伙伴、财务与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Zepz 下一段产品策略提高了依赖风险，同时公开估值可见度仍然很薄。资本层面，公司显然还能拿到钱，但没有给外部投资人一个当前价格锚：2021 年融资公开估值为 $5 billion；2024 年 $267
              million 轮真实存在且经 IFC
              确认，但估值没有公开披露。这意味着投资人无法判断最新一轮是干净的上调估值轮、内部人支持的平轮，还是结构化妥协。更早的审计账目也比管理层可能愿意承认的更重要，因为这些账目显示了持续经营的重大不确定性，以及下行情景中对契约违约的敏感性。竞争和定价层面，汇款同行没有停下。Remitly
              的 10-K 明确把市场描述为高度竞争且由规模驱动；Wise 仍在降低抽佣率，用费用和速度赢客户。Zepz 自己的钱包经济性提示的是利润率压力，而不是缓解：开户注册和维护免费，促销 FX
              和返现用于驱动行为，部分变现被推到选择性入金和提现事件。稳定币栈同时带来上行和集中度。TRM 负责区块链情报，Fireblocks 提供资金管理和结算基础设施，Sendwave 称 Circle 和 Solana
              支撑 USDC 发行和钱包功能。这可能提升速度和 FX 透明度，但也意味着一个已经依赖汇款牌照和出款伙伴的产品，现在还依赖未公开的加密基础设施、合规工具和伙伴合同。从财务和战略上看，Zepz
              因此不再像一个简单汇款 App，而更像一个试图扩宽自身栈的汇款平台；与此同时，关于伙伴可替代性、定价韧性和估值条款的公开证据仍不完整。
