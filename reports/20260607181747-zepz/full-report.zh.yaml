      - CV025
      - CV026
      - CV028
      - CV029
      - CV030
      - CV031
      - CV046
  - id: TV005
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - 已审计 2025-2026 收入和利润率较 2021 明显改善，CFPB 整改干净，正式 CEO 和可提交董事会的治理也已到位。
        - $3.5B-$5.0B 公允价值区间；只有拿到已审计证据后，靠近上沿才守得住 2021 峰值。
        - 在财务包和治理文件开放前，概率低至中等。
        - 如果 2024 轮带有惩罚性优先权，或规模说法不能转化为已审计盈利，本案仍会失败。
      - - 基准
        - Zepz 仍有规模，也可投资，但当前经济性只得到部分证明，2024 估值仍未披露。
        - $2.0B-$3.0B 公允价值区间；公开证据支持相对 2021 峰值打折，并以纪律性而非激进入场。
        - 这是今天公开证据下概率最高的情景。
        - 隐藏轮次条款、较弱利润率，或又一次领导层摇摆，仍可能把估值区间往下压。
      - - 悲观
        - 2024 轮融资按普通股口径显示为平轮或降价轮，或当前盈利能力和控制情况披露后令人失望。
        - $1.0B-$1.8B 公允价值区间；减记风险真实存在，私募估值可能大幅压缩。
        - 除非尽调补齐核心披露缺口，否则该情景概率不低。
        - 合规、治理或流动性意外会加速估值倍数压缩。
    notes: |
      这些区间是承销判断，不是 DCF。区间刻意拉宽，因为核心缺失变量不是市场规模，而是当前经审计盈利质量。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV045
  - id: TV006
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 2024 轮融资经济条款不及预期
        - 管理层拒绝披露估值机制，或披露按普通股口径为平轮 / 降价轮
        - 最新资本验证溢价定价的论点会被击穿
        - 暂停，或按悲观情景区间重新承销。
      - - 当前经审计业绩不及预期
        - 2025 年经审计收入或利润率明显低于 2021 至 2025 年规模叙事
        - 披露问题会变成经营质量问题
        - 除非价格重置，否则从继续研究转向回避。
      - - 合规整改未完成
        - CFPB 整改材料薄弱，或核心市场出现新的监管问题
        - 信任和控制质量不再支撑估值溢价
        - 要求大幅折价，或退出流程。
      - - 领导层仍未定
        - 临时 CEO 状态持续，且没有可信的正式任命和董事会方案
        - 退出准备度下降，执行风险上升
        - 推迟投资，待治理问题闭合后再看。
      - - 优先股堆叠过于苛刻
        - 新资本带有更高优先级经济条款，使普通股投资者保护变薄
        - 名义估值不再能有效说明普通股价值
        - 要求结构保护，否则退出。
    notes: |
      这些触发因素是应当改变价格或终止流程的实际条件，不只是泛泛的风险清单。
    claimRefs:
      - CV034
      - CV041
      - CV042
      - CV043
  - id: TV007
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 当前经审计财务
        - 2025 年经审计损益表，以及 2026 年至今收入、毛利率、EBITDA 和现金流桥
        - 没有新的经审计盈利基线，就无法承销当前估值。
        - CFO 与审计师工作底稿。
      - - 2024 轮融资条款
        - 投后估值、清算优先权、反稀释条款，以及任何优先级或附函权利
        - 只看披露的融资规模，无法推断普通股价值。
        - CFO 和首席法律顾问。
      - - 队列与走廊经济性
        - 重复汇款率、走廊抽成率、支付方式组合经济性、欺诈和拒付损失率
        - 需要判断规模是否有利润、是否守得住。
        - 财务和运营分析。
      - - 合规整改
        - Sendwave CFPB 整改交付物、测试结果，以及后续监管通信
        - 问题若已封闭，只应打折；问题若未解决，会击穿溢价逻辑。
        - 总法律顾问和合规负责人。
      - - 领导层与治理
        - 正式 CEO 方案、当前董事会名单、委员会归属，以及投资者治理图谱
        - 退出准备度部分取决于治理。
        - 董事长、董事会负责人和遴选委员会材料。
      - - 资本充足性与流动性
        - 当前现金、债务、契约，以及 2024 轮融资后的现金跑道假设
        - 区分韧性业务和依赖融资的业务。
        - 资金部资料包和董事会材料。
    notes: |
      这是把 Zepz 从一家值得关注的公司转化为可定价投资案例所需的最低文件集。
    claimRefs:
      - CV009
      - CV013
      - CV042
      - CV043
  - id: TV008
    title: 估值桥 / 区间表
    columns:
      - 桥接步骤
      - 证据锚点
      - 方向性影响
      - 区间评论
      - 为何重要
    rows:
      - - 2021 年峰值锚点
        - 官方 Series E 轮估值 $5B
        - 起始锚点
        - 设定历史上限参考。
        - 证明投资者曾为该业务支付溢价。
      - - 披露折价
        - 没有公开的 2025-2026 年当前经审计收入或利润率。
        - '-$1.0B 至 -$1.5B'
        - 仅靠公开证据，无法支撑按旧峰值付价。
        - 缺少经审计证明，应当打估值折扣。
      - - 结构折价
        - 2024 年 $267M 融资未披露估值或优先股堆叠。
        - '-$0.5B 至 -$1.0B'
        - 未知轮次机制削弱对名义价格的信心。
        - 结构化资本可以维持融资，同时压低普通股价值。
      - - 规模加分
        - 2025 年转账额 > $17B，且合作伙伴材料显示 130 个国家有 >9M 用户
        - +$0.5B 至 +$1.0B
        - 业务规模看起来仍足以支撑可观的私募价值。
        - 业务连续性抵消部分披露折价，但无法完全抵消。
      - - 公开可比公司约束
        - 上市可比公司市值 / 收入倍数约为 0.6x 至 4.7x。
        - 轻松重估的上限
        - 若要回到 2021 年水平，需要比当前公开同业更强的证据。
        - 透明度和公开市场纪律应当有真实权重。
      - - 公开证据基础区间
        - 基于上述调整的分析师判断。
        - $2.0B-$3.0B
        - 尽调前纪律化承销的合理区间。
        - 该区间最贴合已披露证据，不代表当前账面估值。
    notes: |
      估值桥刻意保持方向性。它从 Zepz 唯一披露的估值出发，先惩罚不确定性，再只加回公开证据仍能支撑的那部分规模价值。
    claimRefs:
      - CV001
      - CV004
      - CV009
      - CV010
      - CV011
      - CV033
      - CV034
      - CV037
      - CV040
