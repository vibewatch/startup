  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 消费者汇款竞争格局
        blocks:
          - type: paragraph
            body: >-
              Zepz 在消费者汇款市场同时面对两类不同对手。第一类是 Wise 和 Remitly 等数字优先、App 主导的专门玩家，靠透明定价、移动端开户和清晰的自助用户体验取胜。第二类是 Western
              Union、MoneyGram 和 Ria
              等混合在位者，把数字获客与密集的现金领取、银行和钱包付款基础设施配在一起。银行、银行卡注资电汇和移动钱包原生收款轨道仍是相关替代方案，而不是抽象背景：WorldRemit 仍把自己营销为比银行便宜，而 World
              Bank 和 GSMA 数据显示，银行仍是成本最高的渠道，移动钱包可以在结构上低于全球平均成本。在侨民走廊，买方不是在选择一个通用汇款 App；他们是在选择付款网络、费用和 FX
              体验，以及收款人的信任界面。按这个框架，Zepz 在非洲和亚洲走廊需要同时具备银行入账、现金领取和移动钱包时最强。在采购决策由纯价格透明度和账户到账户经济主导的地方，Zepz 优势较弱，Wise
              是最尖锐的可比对象；在由实体普及度主导的地方，Western Union、MoneyGram 和 Ria 仍然重要。
