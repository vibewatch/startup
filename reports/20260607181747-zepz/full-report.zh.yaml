      - number: '4.6'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >
              因此，Zepz 的财务结论是混合的，但并不含糊。正面因素真实存在：业务历史上创造了数亿美元收入；在最近一次详细经审计节点，毛利率有意义；规模足以吸引重复股权资本；产品模型清楚地通过手续费、FX
              价差和越来越多的钱包连接经济变现。负面因素同样真实：公开披露无法证明当前经审计收入、当前毛利率、当前现金生成或当前现金跑道；2021 年经审计文件仍显示沉重营销和经营亏损，以及持续经营敏感性；2024
              年融资没有公开估值重置。合作伙伴材料中关于 2025 年转账 $17 billion 以及现金流或盈利能力的叙事，是有用的方向性数据点，但不能替代经审计报表。对投资人或贷款人而言，正确承销姿态是：Zepz
              的财务可信度足以值得尽调，但透明度不足以仅凭公开材料承销。任何关于利润率路径或资本充足性的确信，仍取决于管理层内部证据，覆盖 2025-2026 年收入、成本结构、流动性、债务条款和队列经济。
