      - number: '6.3'
        title: 留存、满意度与重复使用代理指标
        blocks:
          - type: paragraph
            body: >-
              Zepz
              不披露投资人通常希望在客户章节看到的指标，这是客户韧性最大的限制。公开材料没有净留存率（NRR）、总留存率（GRR）、汇款人流失、收款人流失、队列续约或走廊级重复使用率。因此，公开记录只能依赖代理指标。WorldRemit
              的代理指标主要是产品设计信号：快速重发、已保存收款人、汇率提醒、转账跟踪和 24/7 汇款，都是为习惯性家庭支持汇款设计的功能，而不是一次性外汇交易。Sendwave 的代理指标不同，但仍有意义：FAQ
              称额度可能随账户年龄和成功汇款历史提高，交易状态会在 App 内更新为「已送达」，并提供 24/7 App
              内聊天支持。评分和评论分数也大体指向正面，但它们不能替代队列留存。即便投诉处理流程也只是代理指标：Sendwave 称多数投诉会在 10 个工作日内收到最终回复，复杂案件最多 35
              天；这有助于判断服务纪律，却不能说明客户终身价值或续约质量。
