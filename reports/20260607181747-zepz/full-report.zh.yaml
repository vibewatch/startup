  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 不要仅凭公开材料投钱，也不要在未披露的 2024 标记价上投钱。
      - - 信心
        - 中
        - 公开证据足以圈定上行和下行，但不足以放行价格。
      - - 风险评级
        - 高
        - 估值、治理、合规和优先股堆叠不透明，都仍可能重定价本案。
      - - 估值立场
        - 未证实 / 可能低于 2021 峰值
        - 2021 年 $5B 标记只是历史锚点，不是当前清算价格。
      - - 入场纪律
        - 优先选择 <=$2.5B 的普通股等价估值，或带下行保护的结构
        - 高于该水平，在已审计 2025-2026 数据开放前，安全边际很薄。
      - - 决策含义
