  - id: TU001
    title: 客户分群表
    columns:
      - 分群
      - 买方 / 用户 / 付费方
      - 使用场景
      - 规模
      - 收入 / 战略价值
      - 缺口
    rows:
      - - WorldRemit 侨民汇款人
        - 汇款人同时是付费方和应用 / 网页用户
        - 用银行转账或银行卡资助的经常性家庭支持汇款
        - 关于页面显示 5.7M 客户、70 种货币、130 个国家
        - Zepz 内部覆盖最广的品牌；收款选择更多元
        - 没有按汇出国家或汇款走廊拆分活跃汇款人
      - - WorldRemit 家庭收款人
        - 收款人是最终用户，不是付费方
        - 通过银行转账、移动钱包、现金领取或话费充值收款
        - 覆盖被营销为横跨 130-150 个国家
        - 收款人灵活性提高现金和钱包密集市场中的转化
        - 未披露各汇款走廊的收款方式组合
      - - Sendwave 应用优先汇款人
        - 汇款人是付费方和应用内用户
        - 从美国、英国、加拿大和欧洲部分地区高频转账
        - 汇款走廊页面显示 1M+ 可信用户；更广集团 >9M 用户
        - 面向重复汇款的低摩擦汇款走廊专家
        - 没有按汇出地域拆分的公开活跃用户数据
      - - Sendwave 移动钱包收款人
        - 收款人是钱包或移动钱包持有人
        - 在非洲和 Bangladesh 通过移动钱包通道收款
        - Ghana/Bangladesh 支持和汇款走廊页面有明确说明
        - 速度和便利性推动非银行市场中的重复行为
        - 钱包与银行份额未披露
      - - Sendwave 银行 / 现金领取收款人
        - 收款人使用银行账户或具名取现合作伙伴
        - 通过 Nigeria 等汇款走廊中的银行或具名现金领取合作伙伴收款
        - 按汇款走廊披露具名银行和取现合作伙伴
        - 在钱包渗透率较弱或监管限制支付通道的市场很重要
        - 合作伙伴层面的集中度和收款份额不公开
      - - Sendwave Wallet 汇款人
        - 美国汇款人成为付费方、用户和储值余额持有人
        - 持有并发送数字美元，享受更优汇率或返现优惠
        - 钱包目前仅限美国汇款人
        - 一次性汇款之外，最可见的扩张和留存界面
        - 现有汇款人的钱包采用率、频率和使用转化未公开
    notes: 各行描述付款人—用户—收款人的结构，而非企业账户，因为 Zepz 服务的是消费者汇款流程。规模数值来自公开营销材料或平台信号，不是经审计的活跃用户队列。
