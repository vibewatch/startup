  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价界面与真正公开的信息
        blocks:
          - type: paragraph
            body: >
              Zepz 通过交易手续费、外汇价差和选择性促销定价组合来变现国际资金流动；促销可能减少报告收入，也可能计入营销费用。最强的直接会计披露来自 2021 年 WorldRemit Group
              账目，其中明确说明，收入来自交易手续费和外汇价差，首次转账免手续费或更优惠的入门 FX
              汇率会在客户累计收入达到零之前作为收入抵减处理。这很重要，因为它说明标价和实际价格不是一回事。当前面向消费者的页面强化了同样结构，但没有发布通用费率表：WorldRemit
              告诉用户，他们会在结账前看到费用和汇率，而其货币转换器强调实时换算和中间市场参考汇率。Sendwave
              当前钱包界面又增加了一层：开通和维护钱包免费，部分充值或提现方式仍可能收取小额披露费用，公司则用更好汇率、返现和 USDC 存储作为变现杠杆；这些杠杆取决于走廊和行为，而非全球标准化。
