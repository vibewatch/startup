  - id: TR005
    title: 缓释措施与投资逻辑破裂表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 监管问题反弹
        - CFPB、州监管机构、FCA、FINTRAC 或 NBB 行动
        - 任何指向披露、钱包或错误处理的新正式执法、同意令或检查发现
        - 在拿出整改证据前，投资逻辑立即破裂
      - - 执行压力
        - 员工数公告、实体关闭或管理层备忘录
        - 又一轮影响超过 10% 员工的重组，或再关闭一个运营实体
        - 下调运营信心假设，重新评估服务 / 控制韧性
      - - 领导层不稳定
        - 董事会公告和 Companies House 文件
        - 可信时间表内仍未确定正式 CEO，或又有高管离任
        - 暂停对多年执行计划的信心
      - - 披露可信度
        - 管理层尽调资料室和 KPI 桥接请求
        - 用户、汇款走廊和员工数仍无法归入一套带日期的指标
        - 定义标准化前，将模型视为无法承销
      - - 稳定币控制失效
        - 钱包事故、制裁 / 合规问题或合作伙伴停机
        - 重大钱包控制漏洞、制裁失效，或提现中断超过 24 小时
        - 暂停计入钱包驱动的上行，假设合规支出更高
      - - 定价压缩
        - 同业抽成率 / 费率变化和 Zepz 促销强度
        - 更激进的返现 / 外汇补贴，但没有抵消留存或利润率改善的证据
        - 下调利润率预期，拉长盈利路径假设
      - - 融资 / 估值压力
        - 新一轮融资、老股标记或优先权很重的融资
        - 隐含条款相较 2021 持平或下行，或惩罚性结构显示需求疲弱
        - 重新评估下行保护、稀释和退出时间
    notes: 这些是投资监测触发项，不是法律契约。每个触发项都因可从公开来源或标准尽调请求观察到而入选。
