  - id: TE001
    title: 产品线 / 模块矩阵
    description: Publicly visible Zepz product surfaces across WorldRemit and Sendwave.
    columns:
      - 产品线 / 界面
      - 主要用户
      - 核心任务
      - 当前收款或储值模式
      - 状态 / 成熟度
      - 差异化
      - 关键尽调缺口
    rows:
      - - WorldRemit 核心转账
        - 侨民汇款人和收款家庭
        - 从应用或网页汇款，并灵活选择末端收款方式
        - 银行转账、现金领取、移动钱包、话费充值
        - 成熟的当前界面
        - 公开材料中最宽的明确收款菜单
        - 没有公开完整、按汇款走廊逐项列出的实时收款矩阵
      - - WorldRemit 移动钱包通道
        - 移动钱包市场中银行服务不足的收款人
        - 将汇款收进与手机号绑定的储值账户
        - 移动钱包，加上通过服务商代理网点本地取现
        - 已开通市场中较成熟
        - 在银行覆盖较薄的非洲和部分亚洲汇款走廊适配度强
        - 国家可用性仍需查询目的地，而不是查看一张静态地图
      - - WorldRemit 现金领取通道
        - 无法使用银行或钱包的收款人
        - 以现金形式收取转账金额
        - 通过本地合作伙伴现金领取
        - 已开通市场中较成熟
        - 在依赖现金的汇款走廊中维持触达
        - 取现合作伙伴覆盖和实时服务水平没有公开披露
      - - WorldRemit 话费充值
        - 预付费手机用户
        - 发送通话 / 流量额度，而不是一般资金
        - 仅话费充值
        - 成熟的附加功能
        - 适合小额、与电信账户相连的价值转移
        - 不能替代通用储值或钱包收款
      - - Sendwave 传统汇款
        - 侨民汇款走廊中移动优先的汇款人
        - 用银行卡类入金快速发起汇款，并选择收款人的收款方式
        - 视汇款走廊而定，可用移动钱包、银行账户、现金领取
        - 成熟的当前界面
        - 在重叠汇款走廊上，移动优先包装比 WorldRemit 更简单
        - 准确的收款方式组合隐藏在汇款走廊选择页面之后
      - - Sendwave Wallet
        - 美国汇款人和已开通钱包的收款人
        - 持有数字美元、钱包到钱包转账，并决定何时兑换或取现
        - USDC 储值、钱包转账、部分市场取现
        - 2025 年推出，仍在扩张
        - 在汇款之上增加储值和兑换时点控制
        - 仅面向美国汇款人的推出范围和选择性取现意味着覆盖尚未完整
    notes: 各行覆盖截至 2026-06-07 两个品牌主要的公开可见产品界面；并非完整 SKU 清单。
