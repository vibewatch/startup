      - number: '4.3'
        title: 成本结构和毛利率驱动在历史上比今天更清楚
        blocks:
          - type: paragraph
            body: >
              最近一次详细经审计成本图景来自 2021 年，并已显示为什么不能把 Zepz 当作纯软件业务来分析。收入成本为 $152.6 million，对应 $399.4 million 收入，留下 $246.8
              million 毛利，估计毛利率为 61.8%。毛利以下的成本堆叠很重：管理费用 $338.1 million，其中包括 $113.1 million 员工费用、$93.7 million 营销和沟通、$26.9
              million IT 成本，以及 $12.5 million
              拒付和其他损失。账目还将交易处理费标为定价风险，意味着利润率不仅暴露于客户定价，也暴露于网络经济和付款轨道。同业披露有助于解释这些驱动因素的可能形态，尽管它们不能替代 Zepz 当前数字。Remitly 称
              2025 年交易费用占收入 34%，Wise 报告销售成本约占收入 27%；Zepz 披露的 2021 年直接成本比率更高，约为
              38.2%。这不能证明当前表现落后，但确实说明，在判断利润率质量时，付款组合、资金方式、拒付、欺诈控制和 FX 管理与标示转账费同样重要。
