  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: exhaustive
      basis: >
        This table exhaustively covers the valuation references used in this chapter: Wise and Remitly as digital-first
        public comps, Western Union as the mature hybrid incumbent, MoneyGram as the private hybrid comparator, and Ria
        through public parent Euronet as the listed hybrid proxy.
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值状态
      - 参考价值
      - 局限
    rows:
      - - Wise plc
        - $11.02B 市值 / $2.33B 收入代理；FY26 跨境交易量 £181.7B
        - ~4.7x 市值 / 收入代理
        - 数字化上沿参考：公司盈利、全球化且透明度高
        - 更宽的账户主导平台和较低抽成率模式，与 Zepz 不是完全同类。
      - - Remitly
        - $3.95B 市值 / $1.72B TTM 收入代理；2025 汇款额 $74.9B
        - ~2.3x 市值 / 收入代理
        - 在汇款走廊和侨民使用场景上最接近的上市汇款应用同业
        - 上市公司纪律和更好的当前披露，应解释其部分溢价。
      - - Western Union
        - $2.33B 市值 / $4.04B TTM 收入代理；FY2025 收入 $4.1B
        - ~0.6x 市值 / 收入代理
        - 成熟资金流转经济性的混合型老牌公司下沿
        - 传统网络和较慢增长让它作为 Zepz 一对一可比过于保守。
      - - MoneyGram
        - Madison Dearborn 于 2023 完成收购后转为私有；近 500,000 个网点和 5B 个数字端点
        - 无当前公开估值倍数
        - 运营上可比的混合型标的，网络覆盖有意义
        - 私有化使其无法提供干净的当前公开倍数或按市值重估参考。
      - - Ria（经 Euronet）
        - Euronet $2.54B 市值 / $4.24B TTM 收入代理；Q1 2026 数字汇款收入同比 +42%
        - ~0.6x 母公司层面市值 / 收入代理
        - 有用的上市代理，代表仍展现数字汇款增长的混合型网络
        - Euronet 包含其他业务板块，因此母公司倍数会低估或扭曲 Ria 独立价值。
    notes: |
      倍数是市值 / 收入代理，不是 EV / 收入；因为所用同业参考之间缺少一致的当前净债务处理。
    claimRefs:
