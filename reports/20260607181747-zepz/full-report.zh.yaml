    rows:
      - - WorldRemit 核心转账
        - 一般跨境汇款
        - 银行转账、现金领取、移动钱包、话费充值
        - 通过应用或网页发起，并可自助追踪
        - 当前
        - WorldRemit 是公开资料中最清楚展示多通道收款广度的来源
      - - WorldRemit 移动钱包
        - 银行服务不足的非洲 / 亚洲收款人
        - 移动钱包账户，可支持账单、购物、话费和代理网点取现
        - 收款人没有传统银行账户时最适合
        - 已开通市场中为当前状态
        - 支付通道深度在概念上很强，但实时国家覆盖必须逐条汇款走廊核查
      - - WorldRemit 银行转账
        - 有银行账户的收款家庭
        - 直接存入收款人银行账户
        - 在银行体系更正式的汇款走廊中有用
        - 当前
        - 公开文案对方式定义较清楚，但汇款走廊层面的服务指标较少
      - - WorldRemit 现金领取
        - 依赖现金的收款家庭
        - 从合作伙伴网点领取现金
        - 银行或钱包可及性弱时有用
        - 当前
        - 公开页面解释了支付通道，但没有给出合作伙伴密度地图
      - - Sendwave 传统非洲汇款走廊
        - 美国至 Ghana / 类似非洲汇款走廊
        - 移动钱包、银行账户、现金领取
        - 汇款人用借记卡或预付卡入金
        - 当前
        - 显示 Sendwave 仍靠末端选择竞争，而不只是靠应用体验
      - - Sendwave 传统亚洲汇款走廊
        - 美国至 Philippines / 类似亚洲汇款走廊
        - 收款方式选择加转账追踪
        - 与非洲汇款走廊相同的移动优先漏斗
        - 当前
        - 公开汇款走廊页面确认了流程，但没有暴露一张标准化跨国方式矩阵
      - - Sendwave Wallet 转账
        - 美国钱包汇款人向已开通钱包的收款人汇款
        - 覆盖 113+ 个国家的钱包到钱包数字美元转账
        - 收款人也必须拥有 Sendwave Wallet
        - 当前但仍在扩张
        - 这是传统汇款之外最清楚的新产品界面
      - - Sendwave Wallet 取现
        - 部分市场中的钱包收款人
        - 之后可通过部分市场的本地支付通道兑换或取现
        - 对兑换时点有更多控制
        - 选择性推出
        - 取现可选性是优势，但公开资料未披露国家层面的完整性
    notes: 本表是示例而非穷尽；它结合 WorldRemit 方式页面与部分 Sendwave 汇款走廊和钱包页面，展示汇款走廊支持如何随支付通道变化。
