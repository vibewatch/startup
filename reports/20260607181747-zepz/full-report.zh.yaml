      - number: '3.4'
        title: 切换成本、多平台使用与分发力量
        blocks:
          - type: paragraph
            body: >-
              消费者汇款的汇款人侧切换成本低于许多企业金融科技品类，因为领先服务商都提供自助开户、实时报价和基于 App 的复用。价格敏感的汇款人在每次转账前可以轻松比较 Zepz、Wise 和
              Remitly，尤其是在收款人可接受多种付款方式的走廊。更难的切换变量在收款人侧。如果家人需要移动钱包、熟悉的现金领取伙伴，或特定银行入账路径，汇款人的选择集会迅速收窄，拥有正确本地付款地图的服务就会变得粘性。这也是为什么
              Western Union、MoneyGram 和 Ria 即便数字 UX 不那么受赞赏仍然相关：分发密度、收款人熟悉度和店内付款选项降低了转账失败风险。相较纯账户到账户对手，Zepz 的优势在于
              WorldRemit 仍可在移动钱包、现金领取和银行入账之间靠付款灵活性竞争。相较混合在位者，它的弱点是无法匹配对方实体代理的普及度或数十年的默认地位。实际结果是，汇款人 App
              端是多平台使用市场，而收款轨道端则具有本地粘性。
