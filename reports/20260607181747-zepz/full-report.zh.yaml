      - number: '4.2'
        title: GTM 动作和销售效率代理指标可见，但只能间接观察
        blocks:
          - type: paragraph
            body: >
              公开证据指向自助式数字获客模型，而非企业销售动作或代理主导的零售网络。WorldRemit 的开户流程以报价优先、结账驱动；Sendwave 首页强调 App
              下载、绑定借记卡、快速注册和快速消费者转账。这意味着采购周期短，并依赖消费者营销，而不是外勤销售。历史上这一动作成本有多高，公开代理指标来自经审计的 2021 年账目：营销和沟通费用为 $93.7
              million，对应 $399.4 million 收入，约为收入的 23.5%；随着集团继续投资增长，员工数增至 1,766。该比例接近 Remitly 2025 年 21% 的营销比率，远高于 Wise 的
              4.4%，说明 Zepz 历史增长模型更像获客密集型汇款 App，而不是有规模的低成本基础设施平台。承销问题在于新鲜度：公开来源不披露当前 CAC、回本周期、重复汇款频率或留存队列，因此最有用的当前 GTM
              事实是结构性的，而非数字性的。
