        - WorldRemit 披露支持银行入账、移动钱包、现金领取和话费充值
        - Wise 或其他数字优先对手扩展收款选项的速度快过 Zepz 的市场沟通
        - 中
        - 12-24 个月
        - 索取走廊级收款方式组合、按收款方式拆分的复用率，以及收款成功率
      - - 价格透明度
        - WorldRemit 提供实时报价，但 Wise 是更清晰的费用标杆，Remitly 也主打透明的 App 报价
        - 即便经济性有竞争力，消费者也可能觉得 Zepz 不如同行透明
        - 高
        - 近期
        - 按走廊对比 Wise 和 Remitly 的落地页披露与报价转化
      - - 线下覆盖劣势
        - WU、MoneyGram 和 Ria 仍保有大得多的线下或现金领取基础设施
        - 收款人信任代理品牌或需要现金兜底时，混合型老牌玩家更容易赢
        - 中
        - 持续
        - 衡量现金占比高走廊的流失率，确认合作伙伴密度是否成为硬约束
      - - 合规信任风险
        - Wise、MoneyGram 和 Sendwave 近期都遭遇过汇款执法行动
        - 披露或错误处理一旦失手，整个品类的信任会很快被吃掉
        - 高
        - 持续
        - 按品牌审阅退款 / 错误处理 KPI、投诉率和监管往来函件
      - - 数字专门玩家压力
        - Wise 在扩张中继续压低 take rate，Remitly 则持续放大汇款量
        - 数字优先对手可能挤压利润率，或在性价比叙事上压过 Zepz
        - 高
        - 12-36 个月
        - 按费用、FX 和收款方式匹配度，跟踪相对 Wise 与 Remitly 的走廊级胜负
      - - 老牌玩家数字化再投入
        - Western Union 和 Euronet 仍在投入数字化和稳定币基础设施
        - 传统玩家可以变得更像 App，同时不放弃网络触达
        - 中
        - 12-36 个月
        - 跟踪 WU 和 Euronet 的品牌数字化占比、数字交易增长和新收款轨道
      - - 汇款人多 App 使用
        - 实时计算器和 App 入门流程降低了跨服务商比价成本
        - 价格敏感用户可能把汇款量分散到多个 App，而不是保持忠诚
        - 中
        - 持续
        - 索取 Wise 和 Remitly 也重投广告走廊的复购率和流失数据
      - - 相对上市同业的信息披露差距
        - Wise、Remitly、Western Union 和 Euronet 发布的经营更新比 Zepz 更新
        - 竞争评估可能偏向最可衡量的品牌，而不只看走廊产品谁最好
        - 中
        - 近期
        - 在 NDA 下索取当前集团汇款量、活跃汇款人、走廊组合和退款指标
    notes: 严重度评级是基于留存证据的分析判断，并非公司披露。表格有意同时放入优势与风险，因为汇款业务的护城河耐久度离不开走廊级执行和信任。
