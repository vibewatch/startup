          to: scale
          label: proves investors once paid up
        - from: scale
          to: gap
          label: still needs audited monetization proof
        - from: gap
          to: terms
          label: missing numbers make structure matter more
        - from: terms
          to: governance
          label: valuation confidence also depends on control quality
        - from: governance
          to: call
          label: until these clear
