callouts:
  - calloutType: recommendation
    title: Do not mistake fundraising access for price validation
    body: The 2024 round proves Zepz can still raise capital. It does not prove that outside investors should pay the same common-equity price absent the valuation mechanics and current audited numbers.
    claimRefs:
      - CV003
      - CV004
      - CV034
      - CV037
  - calloutType: risk
    title: The 2021 peak multiple is the clearest warning sign
    body: A $5B valuation against $338M of 2020 revenue implied roughly 14.8x revenue, far above the 2026 public proxy band for listed remittance peers and hybrid incumbents.
    claimRefs:
      - CV017
      - CV021
      - CV024
      - CV031
      - CV032
      - CV033
  - calloutType: assumption
    title: The bull case needs proof, not optimism
    body: Zepz can still earn back something close to the 2021 mark, but only if audited 2025-2026 economics, remediation work, and governance quality all clear together.
    claimRefs:
      - CV039
      - CV042
      - CV043
