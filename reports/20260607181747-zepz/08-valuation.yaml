  - id: TV003
    title: Financing context and entry discipline table
    columns:
      - Anchor / event
      - What is public
      - What is missing
      - Valuation implication
      - Entry discipline
    rows:
      - - '2021 Series E peak'
        - '$292M raised at a disclosed $5B valuation'
        - Nothing public bridges that mark directly to 2024 or 2026.
        - Treat as a historical peak anchor not as a live price.
        - Do not pay at or above that mark without current audited proof.
      - - '2021 audited checkpoint'
        - WorldRemit Group 2021 accounts reported $399.4M revenue and detailed cost structure.
        - No current audited 2025 or 2026 revenue or margin disclosure is public.
        - Historical audit proves the model is real but not what it is worth today.
        - Require the audited 2025 and YTD 2026 bridge before pricing current equity.
      - - '2024 equity round'
        - IFC disclosed a $20M investment inside a broader $267M round.
        - Post-money valuation, preference stack, and liquidation seniority were not disclosed.
        - Hidden structure can make headline financing a weak proxy for common-equity value.
        - Ask for the full term sheet or demand downside protection.
      - - '2025-2026 operating signals'
        - Partner material cites >$17B transferred in 2025 and >9M users across 130 countries.
        - Those are scale claims, not audited earnings or cash-flow disclosures.
        - The franchise likely still matters but the monetization quality is still unproven.
        - Pay only for verified earnings power, not for marketing-scale claims alone.
      - - '2026 leadership and reporting status'
        - Companies House says 2025 accounts are due by 30 Sep 2026 and trade press reported an interim CEO in Mar 2026.
        - Permanent CEO plan and investor-ready reporting cadence are still unclear.
        - Exit readiness deserves a discount until leadership and reporting are steadier.
        - Delay commitment or use stage-gated capital tied to disclosure.
    notes: >
      This table distinguishes capital access from price validation. Zepz has clearly raised money; the issue is
      whether investors without a data room can underwrite the same economics.
    claimRefs:
