company:
  name: Zepz
chapter:
  number: 8
  title: Valuation
summary: >
  Zepz still looks like a real, scaled remittance franchise, but the public record no longer supports
  underwriting the 2021 $5 billion mark as if it were current fair value. The 2024 $267 million round
  disclosed no valuation, current audited revenue and margin remain undisclosed, and the company entered
  2026 with an interim CEO and unresolved preference-stack opacity. The right public-evidence stance is
  research-more with medium confidence, high risk, and an unproven valuation view; only a discounted or
  structured entry looks attractive until audited 2025-2026 financials, round terms, and control evidence
  are opened.
sections:
  - id: recommendation-and-thesis
    title: Recommendation, thesis, and anti-thesis
    body: >
      The valuation case for Zepz begins with a real asset, not a story stock. Official company material
      still anchors a scaled remittance platform: the 2021 Series E announcement said the combined brands
      produced almost $10 billion of gross send volume and $338 million of revenue in 2020, while later
      partner material said Zepz transferred more than $17 billion in 2025 and serves more than 9 million
      users across 130 countries. That scale, plus repeat access to high-quality investors including IFC,
      is the core thesis. The anti-thesis is equally important. The last publicly auditable revenue and
      margin detail is still historical, the 2024 $267 million round disclosed no valuation, Sendwave has
      a CFPB order in its recent history, and the company entered 2026 with an interim CEO rather than a
      named permanent operator. Public market comparables also reward transparency: Wise, Remitly,
      Western Union, and Euronet all publish current revenue and operating data, while Zepz does not.
      That gap means the investment decision cannot be a clean buy or avoid call based on company quality
      alone. It must be price-sensitive and diligence-sensitive. On that basis, the right recommendation is
      research-more rather than buy. Zepz could still deserve a premium private valuation, but public
      evidence does not support paying at or above the 2021 peak without a current finance pack, term-sheet
      visibility, and proof that the post-2024 business is both profitable and governable.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
      - CV010
