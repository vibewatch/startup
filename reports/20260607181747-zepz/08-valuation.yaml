  - id: TV005
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Key risks
    rows:
      - - Bull
        - Audited 2025-2026 revenue and margins show clear improvement versus 2021, CFPB remediation is clean, and a permanent CEO plus board-ready governance are in place.
        - '$3.5B-$5.0B fair-value range; the 2021 peak is only defensible near the top end after audited proof.'
        - Low-to-medium probability until the finance pack and governance files are open.
        - The case still fails if the 2024 round carried punitive preferences or if scale claims do not convert into audited earnings.
      - - Base
        - Zepz remains scaled and investable but current economics are only partially proven and the 2024 valuation remains undisclosed.
        - '$2.0B-$3.0B fair-value range; public evidence supports a discount to the 2021 peak and disciplined rather than aggressive entry.'
        - Highest-probability public-evidence case today.
        - Hidden round terms, weaker margins, or another leadership wobble can still push the range lower.
      - - Bear
        - The 2024 round proves flat or down in common-equity terms or current profitability and controls disappoint when opened.
        - '$1.0B-$1.8B fair-value range; markdown risk is real and the private mark could compress sharply.'
        - Material probability unless diligence closes the core disclosure gaps.
        - Compliance, governance, or liquidity surprises would accelerate multiple compression.
    notes: >
      These ranges are underwriting judgments, not a DCF. They are intentionally wide because the central
      missing variable is not market size but current audited earnings quality.
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV045
  - id: TV006
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - ['2024 round economics disappoint', 'Management refuses to disclose valuation mechanics or reveals a flat/down round in common-equity terms', It collapses the argument that the latest capital validates premium pricing, Pause or re-underwrite at the bear-case range.]
      - ['Current audited earnings miss', '2025 audited revenue or margin is materially below the 2021-to-2025 scale narrative', It converts a disclosure problem into an operating-quality problem, Move from research-more to avoid unless price resets.]
      - ['Compliance remediation is incomplete', 'CFPB remediation pack is weak or new regulatory issues emerge in core markets', Trust and control quality no longer deserve a premium, Demand a large discount or exit the process.]
      - ['Leadership remains unresolved', 'Interim CEO status extends without a credible permanent appointment and board plan', Exit readiness weakens and execution risk rises, Delay investment and revisit after governance closes.]
      - ['Preference stack is punitive', 'New capital carries senior economics that leave common investors thinly protected', Headline valuation stops meaningfully describing common-equity value, Require structure or walk away.]
    notes: >
      These triggers are the practical conditions that should change price or stop the process, not merely a
      list of generic risks.
    claimRefs:
