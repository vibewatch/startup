  - id: exit-readiness-diligence-and-kill-triggers
    title: Exit readiness, final diligence asks, and thesis-break triggers
    body: >
      Zepz is not public-market ready on public evidence alone. Investors still lack a current audited P&L,
      a current margin bridge, a post-2024 cap table, explicit liquidation preferences, and a clear account
      of whether the latest round reset price or merely preserved funding flexibility. The company also needs
      to show that Sendwave's CFPB issues are remediated, not merely historical, and that the March 2026
      interim-CEO arrangement is a transition rather than a symptom of operating instability. The minimum
      diligence package is therefore operational as much as financial: audited 2025 and year-to-date 2026
      numbers, corridor-level take-rate and payout-mix data, the 2024 term sheet and preference stack,
      compliance-remediation evidence, and a governance map that names the intended long-term CEO and board
      owners of risk. The thesis breaks quickly if those files stay shut, because the investment case then
      depends on management narratives rather than investor-grade evidence. That is why the recommendation is
      not avoid. There is clearly a business here. But the right posture is to preserve optionality, insist
      on price discipline, and move only when the company proves that current economics and governance are at
      least directionally consistent with the scale story it continues to market.
    claimRefs:
