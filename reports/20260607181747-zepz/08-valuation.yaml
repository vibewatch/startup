      nodes:
        - id: anchor
          label: '2021 peak mark: $5B'
          detail: Official proof that investors once priced Zepz as a premium remittance platform.
          tone: positive
        - id: scale
          label: 'Scale still looks real'
          detail: Partner material still points to >$17B transferred in 2025 and >9M users.
          tone: positive
        - id: gap
          label: 'Current audited gap'
          detail: No public 2025-2026 audited revenue, margin, or cash-flow bridge is available.
          tone: risk
        - id: terms
          label: '2024 round terms unknown'
          detail: The $267M raise disclosed no valuation or preference stack.
          tone: risk
        - id: governance
          label: 'Governance not exit-ready yet'
          detail: Interim CEO status and limited public board visibility reduce confidence.
          tone: risk
        - id: call
          label: 'research-more / high risk'
          detail: Use price discipline and do not treat the 2021 peak as current fair value.
          tone: risk
      edges:
