  - id: scenario-range-and-valuation-bridge
    title: Bull, base, and bear ranges with a valuation bridge
    body: >
      The right way to handle Zepz is scenario logic, not a single-point valuation. In the bull case, the
      company re-earns something close to its 2021 aura because management proves 2025-2026 audited revenue
      well above the 2021 level, demonstrates durable EBITDA or free-cash-flow positivity, closes the gap on
      CFPB and control remediation, and resolves leadership into a permanent CEO with credible exit-ready
      governance. That path can justify a $3.5 billion to $5.0 billion range, with the old peak reachable
      only at the high end. The base case is more conservative and more plausible on public evidence: Zepz
      remains scaled, but the missing audited bridge, undisclosed 2024 valuation, and private-round
      structure risk keep fair value closer to $2.0 billion to $3.0 billion. The bear case applies if the
      2024 round economics prove flat or down, if margins are weaker than the market assumes, or if further
      compliance or governance friction emerges; under that outcome, a $1.0 billion to $1.8 billion range is
      defensible. The valuation bridge therefore starts at the 2021 $5 billion anchor, subtracts a discount
      for missing audited proof and unknown round terms, then adds back only a partial scale credit for the
      still-large franchise. That logic produces a preferred entry zone below the old peak rather than an
      attempt to explain away the current uncertainty.
    claimRefs:
