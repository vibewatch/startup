  - id: comparable-set-and-public-market-read-through
    title: Comparable set and public-market proxy read-through
    body: >
      The comparable set needs to respect business model differences rather than force a single neat
      multiple. Wise is the upper digital bound because it combines global scale, take-rate discipline, and
      unusually strong disclosure; CompaniesMarketCap and Wise's FY2026 trading update together imply a
      market-cap-to-revenue proxy of about 4.7x. Remitly is the closest public remittance app peer and sits
      materially lower at about 2.3x on the same proxy, even with 9.6 million customers and $74.9 billion
      of 2025 send volume. Western Union and Euronet sit near 0.6x market-cap-to-revenue, reflecting slower
      growth, legacy or diversified structures, and public-market skepticism toward mature money-movement
      models. MoneyGram remains strategically relevant but not valuation-clean because it has been private
      since the Madison Dearborn acquisition. The practical lesson is not that Zepz must price exactly at a
      public multiple. Private growth companies can earn a premium if they show faster growth, cleaner
      economics, and more optionality. The lesson is that Zepz's old $5 billion peak implied roughly 14.8x
      2020 revenue, far above today's public proxy band. That makes the 2021 mark an optimistic historical
      reference, not a fair-value shortcut. Public comparables support a wide band, with Wise as the digital
      ceiling, Remitly as the closest operating check, and Western Union plus Euronet as the hybrid floor.
    claimRefs:
