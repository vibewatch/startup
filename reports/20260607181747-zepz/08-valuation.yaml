      - CV041
      - CV042
      - CV043
  - id: TV007
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited current financials
        - 2025 audited P&L and YTD 2026 revenue, gross margin, EBITDA, and cash-flow bridge
        - Current valuation cannot be underwritten without a fresh audited earnings baseline.
        - CFO plus auditor working papers.
      - - '2024 round terms'
        - Post-money valuation, liquidation preferences, anti-dilution, and any seniority or side-letter rights
        - Headline round size is not enough to infer common-equity value.
        - CFO and lead counsel.
      - - Cohort and corridor economics
        - Repeat-send rates, corridor take rates, payout-mix economics, fraud and chargeback loss rates
        - Needed to know whether scale is profitable and defensible.
        - Finance and operations analytics.
      - - Compliance remediation
        - Sendwave CFPB remediation deliverables, testing, and any subsequent regulator correspondence
        - A contained issue deserves a discount; an unresolved issue breaks the premium thesis.
        - General counsel and compliance leadership.
      - - Leadership and governance
        - Permanent CEO plan, current board roster, committee ownership, and investor-governance map
        - Exit readiness is partly a governance question.
        - Chairman, board lead, and search-committee materials.
      - - Capital adequacy and liquidity
        - Current cash, debt, covenants, and runway assumptions after the 2024 round
        - Distinguishes a resilient franchise from a financing-dependent one.
        - Treasury pack and board materials.
    notes: >
      This is the minimum file set required to convert Zepz from an interesting company into a priced
      investment case.
    claimRefs:
      - CV009
      - CV013
      - CV042
      - CV043
  - id: TV008
    title: Valuation bridge / range table
    columns:
      - Bridge step
      - Evidence anchor
      - Directional effect
      - Range comment
      - Why it matters
    rows:
      - - '2021 peak anchor'
        - 'Official Series E at $5B valuation'
        - Starting anchor
        - Sets the upper historical reference.
        - It proves investors once paid a premium price for the franchise.
      - - Disclosure discount
        - No current audited 2025-2026 revenue or margin is public.
        - '-$1.0B to -$1.5B'
        - Public evidence alone cannot support paying the old peak.
        - Missing audited proof deserves a valuation haircut.
      - - Structure discount
        - 2024 $267M round disclosed no valuation or preference stack.
        - '-$0.5B to -$1.0B'
        - Unknown round mechanics weaken headline-price confidence.
        - Structured capital can preserve fundraising while reducing common-equity value.
      - - Scale credit
        - '> $17B transferred in 2025 and >9M users across 130 countries in partner materials'
        - '+$0.5B to +$1.0B'
        - The business still appears large enough to justify a material private value.
        - Franchise continuity offsets some but not all of the disclosure discount.
      - - Public comp discipline
        - Listed proxy band is about 0.6x to 4.7x market-cap-to-revenue.
        - Ceiling on easy rerating
        - A return to 2021 requires stronger proof than public peers currently need.
        - Transparency and public-market discipline deserve real weight.
      - - Public-evidence base band
        - Analyst judgment after the adjustments above.
        - '$2.0B-$3.0B'
        - Reasonable zone for disciplined underwriting before diligence.
        - This is the range that best fits the disclosed evidence, not a statement of current mark.
    notes: >
      The bridge is intentionally directional. It starts from the only disclosed Zepz valuation and then
      penalizes uncertainty before adding back only the part of scale that public evidence can still support.
    claimRefs:
