  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Investment thesis argument
      - Anti-thesis counterargument
    rows:
      - - Scaled franchise
        - Official and partner sources still point to a large remittance platform with $338M of 2020 revenue and more than $17B transferred in 2025.
        - Scale without current audited revenue or margin can still mask weak unit economics or a down-round reality.
      - - Capital support
        - Repeat backing from Accel, TCV, LeapFrog, and IFC suggests sophisticated investors still see strategic value.
        - The 2024 round disclosed no valuation and may include preferences or dilution economics hidden from public investors.
      - - Competitive position
        - Zepz still spans bank deposit, wallet, and cash-like corridors that remain strategically relevant in migrant flows.
        - Public peers such as Wise and Remitly combine comparable or better scale with far stronger current disclosure.
      - - Valuation reset potential
        - If management proves current profitability and clean controls, a premium to mature hybrid peers can still be justified.
        - The 2021 peak implied about 14.8x 2020 revenue, far above today's public proxy band.
      - - Governance path
        - Interim leadership could be temporary and followed by a stronger permanent operating bench.
        - Interim leadership plus cap-table opacity and limited public governance detail reduce exit readiness today.
      - - Compliance narrative
        - A remediated CFPB issue can become a contained historical scar rather than a live thesis-breaker.
        - If remediation is incomplete or controls are weak, the compliance overhang remains a multiple-compression risk.
    notes: >
      The thesis is about what could justify a premium; the anti-thesis is about what the current public file
      still fails to prove.
