tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - research-more
        - Do not commit capital off public materials alone or at an undisclosed 2024 mark.
      - - Confidence
        - Medium
        - Public evidence is good enough to bound upside and downside but not to clear price.
      - - Risk rating
        - High
        - Valuation, governance, compliance, and preference-stack opacity can all still reprice the case.
      - - Valuation stance
        - Unproven / likely below 2021 peak
        - The 2021 $5B mark is a historical anchor rather than a current clearing price.
      - - Entry discipline
        - Prefer <=$2.5B common-equity-equivalent or downside-protected structure
        - Above that level the margin of safety is thin until audited 2025-2026 data is open.
      - - Decision implication
        - Engage only after a current finance and governance pack is opened
        - If management will not disclose audited numbers and round terms, step back rather than average up into uncertainty.
    notes: >
      This table converts the public record into an IC posture. The entry discipline is an analyst judgment,
      not a disclosed company valuation.
    claimRefs:
