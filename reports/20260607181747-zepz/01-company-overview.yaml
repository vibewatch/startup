- id: scale-disclosure-quality
  title: Scale signals are real, but the disclosure set is internally inconsistent
  body: Zepz is clearly scaled, but the public numbers do not line up cleanly across time, entities, or definitions. WorldRemit’s about page says the brand serves 5.7 million customers, covers 130 countries, uses 70 currencies, and employs more than 1,000 people. Older group-level releases describe over 11 million users across 150 countries, more than 5,000 corridors, around 1,500 employees, and 4.5 million monthly transactions in 2020. The 2023 growth-plan article retains the 5,000-corridor and 1,400-person framing, while the 2026 modern-slavery statement on Sendwave’s trust page says Zepz serves more than 9 million users across just 2,000 corridors in over 130 countries. 2026 partner and PR materials then cite over $17 billion transferred in 2025 and keep the 9 million user framing. None of this means the company is misrepresenting scale; the likelier explanation is that different documents are using different scopes such as active senders versus total users, historical group metrics versus
    brand metrics, or currently supported corridors versus technically reachable routes. Still, the inconsistency is material because it prevents a simple one-line company snapshot from being treated as audited fact. Public diligence should therefore use conservative numbers, date-stamp each metric, and keep exact current headcount, corridor count, and consolidated revenue as open items until management reconciles them.
