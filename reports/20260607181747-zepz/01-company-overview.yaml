  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: A disclosed post-money valuation or investor-marked valuation from the 2024 equity round.
    whyItMatters: Without a current valuation anchor, return modeling and dilution analysis are speculative.
    diligencePath: Request the 2024 financing deck, term sheet summary, and the latest board materials covering valuation and preference stack.
    relatedQuestionRefs:
    - QO018
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: Current board roster, committee structure, investor board seats, and any observer rights.
    whyItMatters: Leadership transition risk cannot be judged cleanly without understanding who governs the company and who controls succession.
    diligencePath: Request the current cap table, board consent history, and signed governance documents from the data room.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
    - TO003
    - TO004
  - type: conflicting-data
    severity: material
    topic: current-scale-metrics
    missingEvidence: A management-reconciled metric bridge for current users, corridors, countries, and headcount.
    whyItMatters: Official and partner-facing documents cite materially different totals, weakening confidence in any cover-page scale metric.
    diligencePath: Ask management to provide a one-page KPI reconciliation with metric definitions and as-of dates for each headline number.
    relatedQuestionRefs:
    - QO013
    - QO023
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: Audited 2024-2025 revenue, gross margin, EBITDA, and cash-flow statements for the consolidated group.
    whyItMatters: Company overview can establish scale and milestones, but not underwrite valuation or quality of earnings without audited data.
    diligencePath: Request the latest audited group accounts, monthly management accounts, and CFO bridge from revenue to cash generation.
    relatedQuestionRefs:
    - QO025
  - type: stale
    severity: minor
    topic: headcount-by-brand
    missingEvidence: A current brand-level and group-level headcount breakdown after the 2025 layoffs and 2026 CEO transition.
    whyItMatters: The headcount story is central to evaluating operating leverage and whether restructuring is complete or still ongoing.
    diligencePath: Request an org chart and monthly headcount trend by function, geography, and brand from January 2023 onward.
    relatedQuestionRefs:
    - QO013
