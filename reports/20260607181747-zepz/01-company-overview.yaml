- id: funding-capital-structure
  title: Funding history, valuation anchors, and control stakeholders
  body: 'The capital formation history is one of the best-documented parts of the public record. WorldRemit’s own August 2021 announcement says Zepz raised $292 million of new primary Series E financing at a $5 billion valuation, shortly after acquiring Sendwave and rebranding the holding company. That round added Farallon Capital while extending support from LeapFrog, TCV, and Accel. Public articles in 2024 then reported a fresh $267 million equity round led by Accel with participation from LeapFrog, TCV, Coller Capital, and IFC. IFC’s own disclosure page confirms its $20 million equity investment into WorldRemit Group Limited as part of the broader $267 million round, though IFC labels the financing a Series X while trade press uses Series F. The key diligence conclusion is not the round label but the financial meaning: Zepz raised substantial new equity three years after the $5 billion mark without publicly disclosing an updated valuation. That omission matters because it leaves investors
    without a current market-clearing price anchor. Companies House also shows continuing corporate activity, share actions, and 2024 account filings inside the UK group entities, confirming that the capital and governance stack remains active even though the group stays private. Zepz therefore has credible backers and access to capital, but its exact post-2024 ownership, liquidation preferences, and valuation remain non-public.'
