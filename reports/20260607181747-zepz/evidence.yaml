evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: A disclosed post-money valuation or investor-marked valuation from the 2024 equity round.
    whyItMatters: Without a current valuation anchor, return modeling and dilution analysis are speculative.
    diligencePath: >-
      Request the 2024 financing deck, term sheet summary, and the latest board materials covering valuation and
      preference stack.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: Current board roster, committee structure, investor board seats, and any observer rights.
    whyItMatters: >-
      Leadership transition risk cannot be judged cleanly without understanding who governs the company and who controls
      succession.
    diligencePath: Request the current cap table, board consent history, and signed governance documents from the data room.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
      - TO004
  - type: conflicting-data
    severity: material
    topic: current-scale-metrics
    missingEvidence: A management-reconciled metric bridge for current users, corridors, countries, and headcount.
    whyItMatters: >-
      Official and partner-facing documents cite materially different totals, weakening confidence in any cover-page
      scale metric.
    diligencePath: >-
      Ask management to provide a one-page KPI reconciliation with metric definitions and as-of dates for each headline
      number.
    relatedQuestionRefs:
      - QO013
      - QO023
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: Audited 2024-2025 revenue, gross margin, EBITDA, and cash-flow statements for the consolidated group.
    whyItMatters: >-
      Company overview can establish scale and milestones, but not underwrite valuation or quality of earnings without
      audited data.
    diligencePath: >-
      Request the latest audited group accounts, monthly management accounts, and CFO bridge from revenue to cash
      generation.
    relatedQuestionRefs:
      - QO025
  - type: stale
    severity: minor
    topic: headcount-by-brand
    missingEvidence: A current brand-level and group-level headcount breakdown after the 2025 layoffs and 2026 CEO transition.
    whyItMatters: >-
      The headcount story is central to evaluating operating leverage and whether restructuring is complete or still
      ongoing.
    diligencePath: Request an org chart and monthly headcount trend by function, geography, and brand from January 2023 onward.
    relatedQuestionRefs:
      - QO013
  - type: missing-source
    severity: material
    topic: corridor-mix-disclosure
    missingEvidence: Current public corridor-level send volume concentration, corridor growth, and top-corridor dependence for Zepz.
    whyItMatters: >-
      Without corridor concentration data, investors cannot tell whether Zepz's current volume is diversified or exposed
      to a few diaspora routes.
    diligencePath: Request top-20 corridors by send volume, growth, margin, and failed-transfer rate under NDA.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: payout-mix-retention
    missingEvidence: Payout-method mix, repeat rate, retention, and cohort behaviour by receive rail and corridor.
    whyItMatters: The durability of Zepz's share depends on whether bank, mobile-money, cash, and wallet users retain differently.
    diligencePath: Request cohort retention and repeat-use splits by payout type, corridor, and customer tenure.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: wallet-adoption-metrics
    missingEvidence: Active Sendwave Wallet users, wallet balances, stablecoin share of transfer volume, and cash-out behaviour.
    whyItMatters: >-
      Wallet adjacency is central to the growth narrative, but public sources only show launch, coverage, and partner
      announcements.
    diligencePath: Request monthly active wallets, balance retention, repeat cash-out timing, and stablecoin-related unit economics.
    relatedQuestionRefs:
      - QM024
  - type: conflicting-data
    severity: minor
    topic: footprint-definition-drift
    missingEvidence: >-
      A reconciled company definition of corridor count, country count, and whether figures refer to marketed, active,
      or technically available routes.
    whyItMatters: >-
      The difference between 2,000, 4,600, and 5,000 corridors changes how investors interpret Zepz's market reach and
      serviceable coverage.
    diligencePath: >-
      Ask management to provide a one-page metric dictionary for corridors, send countries, receive countries, and
      active users.
    relatedQuestionRefs:
      - QM020
  - type: private-evidence-only
    severity: material
    topic: current-zepz-group-send-volume-and-corridor-mix
    missingEvidence: >-
      Current consolidated Zepz group send volume, active senders, and corridor mix across WorldRemit plus Sendwave are
      not publicly reconciled in a 2025-2026 disclosure set comparable to listed peers.
    whyItMatters: >-
      Without a current group operating baseline, it is hard to quantify whether Zepz is nearer to Remitly, Western
      Union branded digital, or MoneyGram on actual throughput and repeat use.
    diligencePath: >-
      Request current active senders, send volume, corridor concentration, and payout-method mix under NDA, split by
      WorldRemit and Sendwave where possible.
  - type: stale
    severity: material
    topic: corridor-level-price-snapshots
    missingEvidence: >-
      A stable, apples-to-apples matrix of exact fees and FX spreads across overlapping Zepz, Wise, Remitly, Western
      Union, MoneyGram, and Ria corridors was not retained because the providers use live calculators that change by
      amount, funding type, and payout method.
    whyItMatters: >-
      Competitive pricing conclusions can overstate or understate the real consumer ranking if they rely on one stale
      quote or one payment method.
    diligencePath: >-
      Run a same-day corridor sample across 8-10 key diaspora routes with matched send amounts, pay-in methods, and
      recipient payout types, then archive screenshots or exported quotes.
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: multi-homing-and-churn-by-corridor
    missingEvidence: >-
      No public source quantified multi-homing, repeat rate, or churn for Zepz versus Wise, Remitly, or hybrid
      incumbents by corridor.
    whyItMatters: >-
      Switching-cost claims are materially weaker without observed behavior on whether senders actually alternate
      providers or stay with one brand after onboarding.
    diligencePath: >-
      Request cohort retention, repeat-rate, and quote-to-send conversion data by corridor and payout type, and compare
      win-loss versus Wise and Remitly marketing-heavy corridors.
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: current-revenue-margin
    missingEvidence: >-
      Audited 2025 consolidated revenue, cost of revenue, gross margin, operating expense, EBITDA, and cash-flow
      statements.
    whyItMatters: >-
      These are the minimum facts required to test whether the 2022 profitability story persisted through the 2024 raise
      and 2025 wallet expansion.
    diligencePath: Request the FY2025 audited financial statements, management bridge to 2026 YTD, and board-approved KPI pack.
    relatedQuestionRefs:
      - QI020
