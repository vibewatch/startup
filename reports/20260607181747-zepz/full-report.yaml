      - number: '4.6'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >
              Zepz's financial verdict is therefore mixed but not ambiguous. The positive side is real: the business has
              historically generated hundreds of millions of dollars of revenue, gross margins that were meaningful at
              the last detailed audited checkpoint, enough scale to attract repeat equity capital, and a product model
              that clearly monetizes through fees, FX spread, and increasingly wallet-linked economics. The negative
              side is equally real: public disclosures do not establish current audited revenue, current gross margin,
              current cash generation, or current runway; the 2021 audited file still showed heavy marketing and
              operating losses plus going-concern sensitivity; and the 2024 financing round arrived without a public
              valuation reset. Partner materials citing $17 billion transferred in 2025 and cash-flow or profitability
              narratives are useful directional datapoints, but they are not substitutes for audited statements. For an
              investor or lender, the right underwriting stance is that Zepz is financially credible enough to warrant
              diligence, but not transparent enough to underwrite on public materials alone. Any conviction on margin
              path or capital adequacy still depends on management-only evidence covering 2025-2026 revenue, cost
              structure, liquidity, debt terms, and cohort economics.
            claimRefs:
