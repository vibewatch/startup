  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Public evidence supports a wide fair-value band and a preferred entry zone below the 2021 peak.
    data:
      items:
        - label: Bear
          low: 1
          mid: 1.4
          high: 1.8
          displayValue: $1.0B-$1.8B
          detail: Round terms disappoint or current audited economics are weaker than the market assumes.
          tone: risk
        - label: Base
          low: 2
          mid: 2.5
          high: 3
          displayValue: $2.0B-$3.0B
          detail: Scaled but still disclosure-constrained business; invest only with discount or structure.
          tone: neutral
        - label: Bull
          low: 3.5
          mid: 4.2
          high: 5
          displayValue: $3.5B-$5.0B
          detail: Requires audited proof, clean remediation, and stronger governance.
          tone: positive
        - label: Preferred entry zone
          low: 1.8
          mid: 2.2
          high: 2.6
          displayValue: $1.8B-$2.6B
          detail: Range where public-evidence downside is better paid for without assuming the 2021 peak returns.
          tone: positive
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: These are the valuation anchors that matter most before an IC writes a price.
    data:
      items:
        - label: Last public valuation
          value: $5.0B
          detail: August 2021 Series E anchor.
          tone: neutral
        - label: Latest disclosed round
          value: $267M
          detail: 2024 equity round, but valuation undisclosed.
          tone: neutral
        - label: IFC participation
          value: $20M
          detail: Official IFC check inside the 2024 round.
          tone: positive
        - label: Official 2020 revenue
          value: $338M
          detail: Company-stated revenue anchor used to frame the 2021 peak multiple.
          tone: neutral
        - label: Latest audited revenue
          value: $399.4M
          detail: 2021 audited group-account figure; fresher audited numbers remain private.
          tone: neutral
        - label: 2025 transfer-volume claim
          value: '>$17B'
          detail: Useful scale signal, but not an audited earnings disclosure.
          tone: positive
        - label: Public comp proxy band
          value: 0.6x-4.7x
          detail: Listed peer market-cap-to-revenue range from Western Union/Euronet to Wise.
          tone: neutral
        - label: Current audited 2025-2026 revenue
          value: Undisclosed
          detail: Most important blocker to underwriting current value.
          tone: risk
        - label: Permanent CEO status
          value: Open
          detail: Public record shows an interim CEO in 2026 rather than a settled long-term operating leader.
          tone: risk
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV009
      - CV010
      - CV012
      - CV033
