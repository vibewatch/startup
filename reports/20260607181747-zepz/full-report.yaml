      - number: '6.3'
        title: Retention, satisfaction, and repeat-use proxies
        blocks:
          - type: paragraph
            body: >-
              The biggest durability limitation is that Zepz does not publish the metrics an investor would usually want
              for a customer chapter. There is no public NRR, GRR, sender churn, recipient churn, cohort renewal, or
              corridor-level repeat rate. The public record therefore has to rely on proxies. On WorldRemit, those
              proxies are mostly product-design signals: quick resend, saved receivers, rate alerts, transfer tracking,
              and 24/7 sending are all features built for habitual family-support remittances rather than one-off
              foreign exchange transactions. On Sendwave, the proxies are different but still meaningful: the FAQ says
              limits may rise with account age and successful sending history, transaction states update to Delivered
              inside the app, and 24/7 in-app chat exists for support. Ratings and review scores also point in a broadly
              positive direction, but they are not substitutes for cohort retention. Even the complaint-resolution
              process is only a proxy: Sendwave says most complaints receive a final response within 10 working days,
              with complex cases taking up to 35 days, which helps gauge service discipline but not lifetime value or
              renewal quality.
