      - number: '4.2'
        title: GTM motion and sales-efficiency proxies are visible, but only indirectly
        blocks:
          - type: paragraph
            body: >
              Public evidence points to a self-serve digital acquisition model rather than an enterprise sales motion or
              an agent-led retail network. WorldRemit's onboarding flow is quote-first and checkout-led, while
              Sendwave's homepage stresses app download, debit-card linking, rapid sign-up, and fast consumer transfers.
              That implies short purchase cycles and consumer marketing dependence rather than field sales. The public
              proxy for how expensive that motion was historically comes from audited 2021 accounts: marketing and
              communications expense was $93.7 million against $399.4 million of revenue, or about 23.5% of revenue, and
              headcount grew to 1,766 as the group continued investing in growth. That sits near Remitly's 2025
              marketing ratio of 21% and far above Wise's 4.4%, suggesting Zepz's historical growth model looked much
              closer to a customer-acquisition-heavy remittance app than to a scaled low-cost infrastructure platform.
              The problem for underwriting is freshness: public sources do not disclose current CAC, payback,
              repeat-send frequency, or retention cohorts, so the most useful current GTM facts are structural rather
              than numerical.
