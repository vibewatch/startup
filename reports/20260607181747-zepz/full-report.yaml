      - number: '8.2'
        title: Financing context, valuation anchors, and entry discipline
        blocks:
          - type: paragraph
            body: >
              Financing context is the clearest reason to avoid false precision. The only clean public valuation anchor
              is the August 2021 Series E, where WorldRemit said Zepz raised $292 million at a $5 billion valuation. The
              next major equity event was the October 2024 round: IFC disclosed a $20 million equity investment inside a
              broader $267 million round, and independent coverage confirmed the valuation was not disclosed. That
              omission is not a detail; it is the whole valuation problem. A company can raise real capital while still
              taking a flat round, a structured round, or a round whose common-equity economics differ materially from
              the headline amount. The last historical audited checkpoint also matters. WorldRemit Group's 2021 accounts
              reported $399.4 million of revenue, but Companies House says 2025 accounts are not due until late
              September 2026, so current audited revenue, gross margin, and cash generation are still unavailable to
              public investors. Add the March 2026 CEO transition to interim leadership and the underwriting stance
              becomes straightforward: do not anchor on the 2021 peak and do not pay a blind-up-round price against an
              undisclosed 2024 mark. Any serious entry should either come at a meaningful discount to the old $5 billion
              headline or use structure that protects against undisclosed preferences, dilution, or
              weaker-than-advertised earnings quality.
