      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer in remittances is usually the sender, but the product user is often split between
              sender and recipient. The sender pays the fees and chooses the app, yet the recipient’s payout need often
              decides which brand can actually win the transaction. A household that needs immediate cash pickup behaves
              differently from one that can accept bank deposit, and both differ from a user who wants to hold USDC in a
              wallet before converting. That makes budget ownership much more like household cash-flow allocation than
              enterprise software procurement. Adoption commonly begins with an urgent transfer need, a live price
              comparison, and a KYC check. Repeat usage only follows if payout succeeds reliably and the recipient
              trusts the cash-out path. Zepz’s wallet move adds a second adoption path: migrant senders may start with a
              traditional transfer but stay for retained-value use cases such as storing digital dollars and choosing
              when to convert. The result is a market in which buyer, user, and payer roles are simple at headline level
              but operationally shaped by corridor, payout rail, and recipient behavior.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM036
              - CM042
              - CM048
              - CM050
