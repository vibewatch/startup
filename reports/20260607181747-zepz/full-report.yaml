      - number: '4.4'
        title: Public traction signals are meaningful, but current financial traction is still mostly a gap
        blocks:
          - type: paragraph
            body: >
              Zepz is not financially opaque because nothing is public; it is opaque because the public record is uneven
              across scope, time, and audit status. On the hard-anchor side, the 2021 Series E release said the brands
              generated almost $10 billion of gross send volume and $338 million of revenue in 2020, while audited 2021
              group accounts disclosed $399.4 million of revenue. Official 2023 material then said the group achieved
              operating profitability in H1 2022 and had helped customers send over $15 billion in 2022. By 2026,
              partner materials claimed more than $17 billion transferred in 2025 and more than 9 million customers or
              users. The issue is not that these claims are directionally implausible; it is that they are not currently
              reconcilable into an audited present-day revenue, margin, or cash-flow view. Companies House shows 2024
              accounts have been filed and 2025 accounts are not due until late September 2026. That leaves investors
              with historical audited statements, current marketing claims, and partner statistics, but no audited
              bridge between them. Even basic scale descriptors drift across sources, including 2,000 versus 5,000
              corridors and 9 million versus 11 million users.
