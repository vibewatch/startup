              tone: positive
              detail: 90% within-minutes claims and 20M+ Philippines transfers are useful but route-specific.
            - label: Moderate
              tone: neutral
              detail: Recipient requirements and status updates support repeat family remittance usage.
            - label: Low
              tone: positive
              detail: Main weakness is missing corridor mix, not visible customer harm.
        - label: Sendwave official corridor + support surfaces
          values:
            - label: Moderate
              tone: neutral
              detail: Coverage is meaningful but narrower, centered on selected Africa and South Asia corridors.
            - label: Moderate
              tone: positive
              detail: 1M+ trusted-user signal and official low-friction positioning support real usage.
            - label: Strong
              tone: positive
              detail: App-based debit funding, in-app status, limits history, and wallet upsell all target repeat senders.
            - label: Moderate
              tone: risk
              detail: Official complaints process and corridor-specific partner limits show operational friction is material.
        - label: Sendwave independent reviews + CFPB record
          values:
            - label: Narrow
              tone: risk
              detail: Independent reviews repeatedly describe narrower corridor breadth than larger peers.
            - label: Strong
              tone: positive
              detail: Independent reviewers praise instant mobile money and low-friction app use.
            - label: Moderate
              tone: neutral
              detail: Reviews imply repeat use in core corridors but still do not expose cohort retention or churn.
            - label: Strong
              tone: risk
              detail: The CFPB enforcement action is a clear adverse trust signal on speed, cost, and disclosure quality.
    claimRefs:
      - CU012
      - CU013
      - CU018
      - CU019
      - CU026
      - CU035
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: standard
    summary: Likelihood versus impact view of Zepz’s primary residual risks as of June 2026.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: High Likelihood
          values:
            - State-complaint escalation
            - Metric inconsistency
            - Pricing pressure / promo intensity
            - Execution strain from repeated restructuring
        - label: Medium Likelihood
          values:
            - Board churn
            - Privacy / biometric scrutiny
            - Stablecoin partner failure
            - Regulatory relapse tied to disclosures or wallets
        - label: Low Likelihood
          values:
            - Minor disclosure update delay
            - Supplier-policy weakness
            - Valuation opacity crystallising in weak terms
            - License or corridor disruption
    approximationNotes: Placements are qualitative and reflect residual exposure after public mitigants, not a probabilistic model.
