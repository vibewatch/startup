  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: WorldRemit provides payout breadth while Sendwave adds a mobile-first corridor surface
        blocks:
          - type: paragraph
            body: >-
              WorldRemit and Sendwave should be read as complementary product surfaces, not as cosmetic brands sitting
              on an identical customer proposition. WorldRemit’s public help and how-it-works stack still looks like a
              classic digital remittance product with unusually broad last-mile choice: bank transfer, cash pickup,
              mobile money, and airtime top up are all presented as first-class receive methods, and the sender flow
              remains app-or-web self-service. That matters in African and Asian corridors because the receive rail is
              often the product. A banked urban recipient, an underbanked mobile-money user, and a cash-dependent
              household do not value the same last-mile option. WorldRemit’s public materials explicitly frame mobile
              money as an alternative to bank accounts and describe uses such as bill payment, shopping, airtime
              purchase, and agent cash-out, which is exactly the kind of fit a diaspora remittance operator needs in
              underbanked markets.


              Sendwave’s public surface is narrower but sharper. Its corridor pages and brand story lean into fast,
              low-cost, mobile-first sending, while the current countries hub keeps Africa and Asia at the center of the
              story. Sample live corridor pages for Ghana and the Philippines still prompt the sender to choose a
              receive method, pay, and track, and at least one Africa corridor page explicitly lists mobile wallets,
              bank accounts, and cash pick-up locations. The practical reading is that Zepz still differentiates first
              through payout relevance and corridor packaging, not through a single globally uniform product shell.
            claimRefs:
