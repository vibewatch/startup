      - number: '1.2'
        title: Founder continuity, CEO succession, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The leadership record shows strong founder continuity but imperfect governance transparency. Official
              WorldRemit material identifies Ismail Ahmed as founder and says he now serves as chairman rather than
              day-to-day operator. In September 2022, Zepz announced Mark Lenhard as group CEO, describing him as a
              former Bill.com and Invoice2go executive with prior experience at PayPal and JPMorgan. Lenhard then became
              the public face of the integration story, profitability messaging, and 2024 financing round. The
              governance picture changed again in March 2026, when FinTech Futures reported that Lenhard stepped down
              and CFO Barrie Morris became interim CEO. Companies House filing history is consistent with that
              transition: WorldRemit Group Limited recorded Morris’s board appointment and Lenhard’s termination as a
              director on 27 March 2026. That makes the leadership handoff real, not merely rumored, but it also raises
              an execution question because the company has not disclosed a permanent successor, a full current board
              roster, or an investor-governance map comparable to a public company. Additional governance opacity is
              visible in the limited public discussion of committee structure, voting rights, or preference stack
              despite Zepz’s large private valuation history. The result is a company that still looks
              founder-influenced and mission-led, but one whose current operating leadership and board dynamics require
              management diligence rather than assumption.
