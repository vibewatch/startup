            body: >-
              Public customer proof exists, but it looks different from B2B software evidence because the best external
              signals are ratings, review density, corridor pages, and third-party provider reviews rather than named
              logos. WorldRemit has the stronger public proof stack today: its Apple App Store page shows a 4.8 out of 5
              score from 216,000 ratings, its own reviews page reports 78,150 reviews and a 4.1 “Great” score, and its
