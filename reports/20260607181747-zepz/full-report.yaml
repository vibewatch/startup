      - number: '7.5'
        title: Mitigations, monitoring, and thesis-break indicators
        blocks:
          - type: paragraph
            body: >-
              Public mitigants do exist, and they matter. Zepz has a broad licensing footprint, publishes state
              complaint routes, discloses privacy and contract terms, says the Sendwave app is PCI DSS certified, and
              claims the stablecoin stack is being built with TRM financial-crime controls and Fireblocks settlement
              infrastructure. Those mitigants are enough to prevent a blanket avoid conclusion on public evidence alone.
              They are not enough to remove the need for tight monitoring. The cleanest near-term indicators are all
              observable: any new CFPB or state regulator action; any further workforce reduction or entity closure;
              failure to appoint a permanent CEO on a credible timeline; inability to reconcile current users,
              corridors, and headcount in diligence; any stablecoin incident involving sanctions screening, cash-out,
              security, or partner downtime; and any new financing that implies flat or down economics versus the 2021
              mark. The transmission path is straightforward. Compliance or partner failures hurt trust and can halt
              product expansion; pricing pressure erodes take rate; another restructuring round raises service and
              execution risk; and valuation opacity limits downside protection if capital must be raised again. The
              burden of proof therefore sits with management. A satisfactory diligence package would include a full
              license matrix by entity and jurisdiction, post-CFPB remediation evidence, a permanent CEO search plan,
              reconciled operating metrics, partner fallback plans for Fireblocks/TRM/Circle/Solana, and a candid update
              on 2024 financing terms and current valuation. Until then, the thesis is intact but conditional.
