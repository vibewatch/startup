      - number: '3.5'
        title: Moat durability, competitive risk, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Zepz's moat is real but bounded. It is real because payout breadth still matters: WorldRemit can meet
              recipient preferences across bank deposit, mobile money, cash pickup, and airtime top-up, and that breadth
              is difficult for account-to-account specialists to reproduce overnight. It is bounded because public
              competitors are not standing still. Wise is still lowering take rate while scaling customers and volume;
              Remitly is growing quickly in the same diaspora-heavy receive markets; Western Union is using its scale to
              deepen digital contribution and is experimenting with stablecoin infrastructure; and Euronet is still
              investing behind Ria's digital money-transfer segment. The strongest adverse evidence is not that one
              competitor is obviously taking share from Zepz today, but that the whole category keeps generating
              disclosure and compliance failures that can erode trust quickly. Wise faced a CFPB order in 2025,
              MoneyGram settled with New York in 2025, and Sendwave itself was subject to CFPB action in 2023. That
              means Zepz cannot rely on trust as a static moat. Over the next two to three years, the durable edge is
              corridor-specific payout relevance plus brand familiarity with migrant communities; the main risk is that
              better-capitalized or more transparent rivals compress price and make Zepz look opaque by comparison.
