  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Zepz should be analyzed inside formal cross-border consumer remittances, not inside the entire global
              cross-border-payments complex. The relevant job is a migrant sender moving household money to a named
              recipient who may need bank deposit, mobile money, cash pickup, or now wallet-based receipt. Included
              spend therefore covers transfer fees, FX spread, payout processing, and the newer wallet adjacency where
              Sendwave lets recipients receive, store, and later cash out digital dollars. Excluded spend includes B2B
              supplier payables, card acquiring, travel FX, treasury, merchant settlement, and most wholesale payment
              flows, because those markets have different buyers, compliance stacks, and distribution economics. The
              status quo is also not a single incumbent. Banks remain an expensive formal substitute; Western
              Union–style hybrid networks remain relevant where physical fallback matters; mobile-money-native routes
              can be cheaper in specific corridors; and informal cash handoffs still compete where trust is hyperlocal.
              This framing matters because Zepz wins or loses corridor by corridor on payout relevance and trust, not on
              an abstract claim to “global payments.” Public materials also disagree on corridor counts, which
              reinforces that market-boundary claims need precise definitions before they can support valuation.
            claimRefs:
