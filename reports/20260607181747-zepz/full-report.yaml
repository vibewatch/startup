  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              The right way to frame Zepz's risk profile is not a high-growth remittance company with some noise but a
              scaled remittance incumbent carrying several unresolved execution and control burdens at once. The
              highest-severity residual risks are: first, regulatory and compliance relapse, because Sendwave already
              has a documented CFPB enforcement history and the company is now layering stablecoin functionality on top
              of cross-border remittance promises; second, execution strain, because Zepz has gone through restructuring
              waves in 2022, 2023, and 2025 and then moved to an interim CEO in March 2026; third, disclosure-quality
              risk, because public metrics on users, corridors, countries, and headcount do not reconcile cleanly across
              official and partner materials; fourth, partner concentration inside the stablecoin stack, where
              Fireblocks, TRM, Circle, and Solana become part of a product that also still depends on remittance
              licenses and payout partners; and fifth, valuation opacity, because the company raised again in 2024
              without publicly resetting or reaffirming the 2021 $5 billion mark. None of these risks independently
              kills the story, but together they mean the underwriting burden has shifted from demand proof to control
              proof. Investors should treat the business as investable only if management can reconcile the operating
              metrics, show post-CFPB control remediation, and explain why a leaner organization can safely run a more
              complex product portfolio.
            claimRefs:
              - CR001
              - CR011
              - CR014
              - CR016
