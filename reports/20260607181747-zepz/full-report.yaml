      - number: '4.3'
        title: Cost structure and gross-margin drivers are clearer historically than they are today
        blocks:
          - type: paragraph
            body: >
              The last detailed audited cost picture comes from 2021 and already shows why Zepz cannot be analyzed as a
              pure software business. Cost of revenue was $152.6 million on $399.4 million of revenue, leaving $246.8
              million of gross profit and an estimated 61.8% gross margin. Below gross profit, the cost stack was heavy:
              administrative expenses were $338.1 million, including $113.1 million of employee expense, $93.7 million
              of marketing and communications, $26.9 million of IT costs, and $12.5 million of chargeback and other
              losses. The accounts also flag transaction-processing fees as a pricing risk, meaning margin is exposed
              not only to customer pricing but to network economics and payout rails. Peer disclosures help explain the
              likely shape of those drivers even though they do not substitute for current Zepz numbers. Remitly says
              transaction expense ran at 34% of revenue in 2025, while Wise reported cost of sales of roughly 27% of
              revenue; Zepz's disclosed 2021 direct-cost ratio was higher at about 38.2%. That does not prove current
              underperformance, but it does show why payout mix, funding method, chargebacks, fraud controls, and FX
              management matter as much as listed transfer fees when judging margin quality.
