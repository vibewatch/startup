      - number: '7.3'
        title: Operational, execution, and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              The operating risk story is shaped by repeated restructuring and changing leadership rather than by a
              single disclosed outage. Public reporting shows layoffs in 2022, 2023, and 2025, with the 2023 wave
              reaching 420 people, or roughly 26% of the workforce, and the 2025 wave hitting about 200 employees or 20%
              of staff with an especially visible impact on IT, engineering, database administration, and development
              operations. FinTech Futures tied the 2025 cuts to completed replatforming work, automation, and proposed
              closure of the Kenya and Poland employing entities. Those facts can be read positively as cost discipline,
              but they also mean the company is asking a smaller and repeatedly reorganized team to operate a global
              licensed remittance business while extending into stablecoin wallets. Leadership continuity adds another
              layer. In March 2026, Mark Lenhard stepped down and Barrie Morris moved from CFO to interim CEO, a change
              corroborated by Companies House filings. A company can survive an interim leader; the risk is that Zepz's
              recent public story — integration, profitability, 2024 financing, and wallet expansion — was heavily
              associated with Lenhard's operator narrative. The disclosure set makes that harder to underwrite because
              basic metrics do not line up cleanly. Depending on source, Zepz has 5.7 million customers, more than 9
              million users, or over 11 million users; it has 2,000, 4,600, or 5,000 corridors; and it has over 800,
              1,400, or roughly 1,000 employees. The likely explanation is definitional drift rather than fraud, but for
              a risk chapter the conclusion is the same: investors need a management-grade bridge before trusting any
              headline KPI.
