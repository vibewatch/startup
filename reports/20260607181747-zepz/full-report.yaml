      - number: '4.5'
        title: Capital adequacy and financing dependence remain central diligence issues
        blocks:
          - type: paragraph
            body: >
              The strongest public evidence on capital adequacy is historical and cautionary. Audited 2021 accounts show
              that after completing Series E, Zepz had raised $259.0 million net of fees plus a $25.0 million loan,
              ended the year with $116.1 million of cash and $346.2 million of equity, and still carried a material
              uncertainty related to going concern. Auditor language was specific: downside scenarios breached revenue
              covenants within twelve months, the $70 million revolving facility with Silicon Valley Bank needed
              extension, and management could need covenant waivers, additional financing, or new working capital
              facilities. That matters because the later public story shifts to profitability claims without replacing
              the financing analysis with fresh audited numbers. The 2024 round added another $267 million, with IFC
              disclosing a $20 million participation and independent coverage saying proceeds would fund new markets and
              wallet expansion while valuation went undisclosed. Current public sources do not disclose cash on hand,
              debt maturities, covenant headroom, or runway. The safest conclusion is that Zepz has repeatedly
              demonstrated access to capital, but public evidence still supports a financing- dependent business rather
              than a transparently self-funding one.
