  - id: TV006
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - 2024 round economics disappoint
        - Management refuses to disclose valuation mechanics or reveals a flat/down round in common-equity terms
        - It collapses the argument that the latest capital validates premium pricing
        - Pause or re-underwrite at the bear-case range.
      - - Current audited earnings miss
        - 2025 audited revenue or margin is materially below the 2021-to-2025 scale narrative
        - It converts a disclosure problem into an operating-quality problem
        - Move from research-more to avoid unless price resets.
      - - Compliance remediation is incomplete
        - CFPB remediation pack is weak or new regulatory issues emerge in core markets
        - Trust and control quality no longer deserve a premium
        - Demand a large discount or exit the process.
      - - Leadership remains unresolved
        - Interim CEO status extends without a credible permanent appointment and board plan
        - Exit readiness weakens and execution risk rises
        - Delay investment and revisit after governance closes.
      - - Preference stack is punitive
        - New capital carries senior economics that leave common investors thinly protected
        - Headline valuation stops meaningfully describing common-equity value
        - Require structure or walk away.
    notes: >
      These triggers are the practical conditions that should change price or stop the process, not merely a list of
      generic risks.
    claimRefs:
      - CV034
      - CV041
      - CV042
      - CV043
  - id: TV007
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited current financials
        - 2025 audited P&L and YTD 2026 revenue, gross margin, EBITDA, and cash-flow bridge
        - Current valuation cannot be underwritten without a fresh audited earnings baseline.
        - CFO plus auditor working papers.
      - - 2024 round terms
        - Post-money valuation, liquidation preferences, anti-dilution, and any seniority or side-letter rights
        - Headline round size is not enough to infer common-equity value.
        - CFO and lead counsel.
      - - Cohort and corridor economics
        - Repeat-send rates, corridor take rates, payout-mix economics, fraud and chargeback loss rates
        - Needed to know whether scale is profitable and defensible.
        - Finance and operations analytics.
      - - Compliance remediation
        - Sendwave CFPB remediation deliverables, testing, and any subsequent regulator correspondence
        - A contained issue deserves a discount; an unresolved issue breaks the premium thesis.
        - General counsel and compliance leadership.
      - - Leadership and governance
        - Permanent CEO plan, current board roster, committee ownership, and investor-governance map
        - Exit readiness is partly a governance question.
        - Chairman, board lead, and search-committee materials.
      - - Capital adequacy and liquidity
        - Current cash, debt, covenants, and runway assumptions after the 2024 round
        - Distinguishes a resilient franchise from a financing-dependent one.
        - Treasury pack and board materials.
    notes: |
      This is the minimum file set required to convert Zepz from an interesting company into a priced investment case.
