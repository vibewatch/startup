  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The investment call depends on whether scale and capital access can survive the missing-price and missing-audit
      tests.
    data:
      nodes:
        - id: anchor
          label: '2021 peak mark: $5B'
          detail: Official proof that investors once priced Zepz as a premium remittance platform.
          tone: positive
        - id: scale
          label: Scale still looks real
          detail: Partner material still points to >$17B transferred in 2025 and >9M users.
          tone: positive
        - id: gap
          label: Current audited gap
          detail: No public 2025-2026 audited revenue, margin, or cash-flow bridge is available.
          tone: risk
        - id: terms
          label: 2024 round terms unknown
          detail: The $267M raise disclosed no valuation or preference stack.
          tone: risk
        - id: governance
          label: Governance not exit-ready yet
          detail: Interim CEO status and limited public board visibility reduce confidence.
          tone: risk
        - id: call
          label: research-more / high risk
          detail: Use price discipline and do not treat the 2021 peak as current fair value.
          tone: risk
      edges:
        - from: anchor
          to: scale
          label: proves investors once paid up
        - from: scale
          to: gap
          label: still needs audited monetization proof
        - from: gap
          to: terms
          label: missing numbers make structure matter more
        - from: terms
          to: governance
          label: valuation confidence also depends on control quality
        - from: governance
          to: call
          label: until these clear
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV012
      - CV034
      - CV044
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: The public comp band shows how far the 2021 Zepz peak multiple sat above listed remittance and hybrid peers.
    data:
      items:
        - label: Zepz 2021 peak / 2020 revenue
          value: 14.8
          detail: Official $5B valuation divided by official 2020 revenue of $338M.
          tone: risk
        - label: Wise proxy
          value: 4.7
          detail: June 2026 market-cap-to-revenue proxy from market-cap and revenue reference pages.
          tone: positive
        - label: Remitly proxy
          value: 2.3
          detail: Closest public remittance app peer on a market-cap-to-revenue basis.
          tone: neutral
        - label: Western Union proxy
          value: 0.6
          detail: Mature hybrid incumbent floor.
          tone: neutral
        - label: Euronet proxy
          value: 0.6
          detail: Parent-level proxy for Ria and other money-transfer activity.
          tone: neutral
    approximationNotes: >
      Values are market-cap-to-revenue proxies, not EV/revenue. The purpose is to show relative public pricing
      discipline, not to claim one exact comparable multiple for Zepz.
