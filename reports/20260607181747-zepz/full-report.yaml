      - number: '1.5'
        title: Major milestones now coexist with repeated restructuring and regulatory scrutiny
        blocks:
          - type: paragraph
            body: >-
              The milestone chronology is attractive on paper: WorldRemit founded in 2010, Sendwave in 2014, acquisition
              in 2021, $5 billion valuation in 2021, operating profitability communicated in 2022-2023, a second major
              equity round in 2024, and a 2025-2026 wallet and stablecoin expansion with partners such as Fireblocks and
              TRM Labs. But the same period also includes a series of adverse facts that investors cannot wave away as
              macro noise. Sky News reported 2022 redundancies that affected fewer than 5% of roles and took employee
              numbers to roughly 1,000 at the time. CNBC and Finextra then reported 420 layoffs in May 2023, roughly 26%
              of a 1,600-person workforce, as the company centralized teams after integrating Sendwave. CNBC and
              Crowdfund Insider again described roughly 200 job cuts in early 2025. Separately, the CFPB issued an
              October 2023 order against Chime, Inc. d/b/a Sendwave, finding deceptive remittance marketing and
              Regulation E failures and requiring approximately $1.5 million in consumer redress plus a $1.5 million
              penalty. Those events do not eliminate the strategic case, but they change the quality of the case: Zepz
              looks like a scaled remittance incumbent trying to broaden into wallets and stablecoins while
              simultaneously simplifying cost structure, repairing control processes, and redefining leadership. Any
              later chapter should treat execution and compliance as central, not peripheral.
