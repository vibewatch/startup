        corridors; excludes small corridor-specific local operators without public evidence.
    columns:
      - Provider
      - Role vs Zepz
      - Public scale signal
      - Ownership / funding status
      - Core payout modes
      - Pricing posture
      - Strategic direction
      - Key weakness vs Zepz
    rows:
      - - Zepz / WorldRemit
        - Subject; digital-first remittance specialist
        - 5.7M customers; 130 countries; 70 currencies
        - Private; latest public valuation still anchored to 2021 $5B mark; current valuation undisclosed
        - Bank deposit, mobile money, cash pickup, airtime top-up
        - >-
          Live quote; price/speed vary by corridor, receive method, and pay-in method; markets itself as 46% cheaper
          than most banks
        - Defend diaspora corridors while broadening wallet and digital-finance surfaces
        - Less public disclosure than listed peers; weaker pure fee-transparency reputation than Wise
      - - Wise
        - Direct digital comparator
        - 18.9M active customers; £181.7B FY26 cross-border volume
        - Public company (Wise PLC)
        - Account transfer and mobile money where available; cash pickup not a lead proposition
        - Explicit fee-led pricing; fees as low as 0.1%; low take-rate strategy
        - Keep compounding transparent cross-border account economics
        - Less relevant where cash pickup or hybrid recipient options dominate
      - - Remitly
        - Direct digital comparator
        - 9.6M+ customers; $74.9B 2025 send volume; 175+ countries
        - Public company (Remitly Global)
        - Bank deposit, cash pickup, mobile wallet, home delivery by corridor
        - Live corridor-specific quote via calculator; monetizes through fees plus FX spread
        - Expand beyond basic remittance into broader immigrant-finance use cases
        - >-
          Exact global price leadership not statically observable; public regulatory record lighter than peers but still
          a monitored category
      - - Western Union
        - Scaled hybrid incumbent
