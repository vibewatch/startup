      - number: '6.4'
        title: Expansion paths, concentration exposure, and partner dependence
        blocks:
          - type: paragraph
            body: >-
              Because Zepz serves millions of small consumer senders rather than a handful of large enterprise accounts,
              the main concentration question is not classic top-customer concentration; it is corridor, payout-partner,
              and regulatory concentration. Public sources do not disclose top-customer mix or corridor revenue share,
              and even the public corridor totals conflict: the Sendwave trust page says the group serves more than nine
              million users across 2,000 corridors, while the Fireblocks announcement says over nine million customers
              across 5,000 corridors. What is observable is dependence on partners and rails. WorldRemit’s cash-pickup
              and mobile-money FAQs make clear that recipients rely on local agent networks, valid ID, SMS references,
              and payout providers. Sendwave’s corridor pages expose the same dependency in more specific form: MTN
              Ghana limits, bKash capacity limits in Bangladesh, named Nigerian bank partners for cash pickup, and
              partner-assisted recovery when money is sent to the wrong account. Expansion is now also partner-heavy.
              The Sendwave Wallet is US-sender only, and its stablecoin roadmap depends on USDC plus TRM and Fireblocks
              for compliance, treasury, and settlement. The 2023 CFPB action is therefore highly relevant customer
              evidence: customer trust can be damaged not just by bad reviews, but by disclosure or speed failures in a
              heavily regulated product.
