      - number: '5.5'
        title: Differentiation is operational and corridor-specific, with public gaps still around completeness and proof
        blocks:
          - type: paragraph
            body: >-
              The strongest product-tech differentiation visible in public sources is operational fit for Africa and
              Asia corridors. WorldRemit retains the broadest explicit payout menu in the public record, which matters
              where recipients switch between bank deposit, mobile money, cash pickup, and telecom-linked value.
              Sendwave complements that breadth with a simpler mobile-first acquisition motion and now a wallet layer
              that can hold digital dollars and delay conversion. Together, those surfaces give Zepz a more flexible
              corridor proposition than a single-rail account-to-account remittance app. The app-store footprint also
              suggests that both brands have real mobile distribution rather than purely notional products.


              But the differentiation case has limits. Public materials do not disclose proprietary matching engines,
              treasury algorithms, or infrastructure performance that would support a deep technical-moat claim. The
              nearest developer signal is hiring and app distribution, not a public API or developer ecosystem.
              Likewise, the wallet story is still more concrete on launch partners than on production metrics: the
              company has named Solana-related launch rails, Fireblocks, and TRM, yet has not published wallet volumes,
              failure rates, or a full live corridor matrix for cash-out. The correct diligence conclusion is therefore
              balanced: Zepz looks meaningfully differentiated where payout breadth and wallet optionality matter, but
              the edge is still best described as operating-model strength backed by selective new infrastructure rather
              than as a publicly proven proprietary platform moat.
