  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: exhaustive
      basis: >
        This table exhaustively covers the valuation references used in this chapter: Wise and Remitly as digital-first
        public comps, Western Union as the mature hybrid incumbent, MoneyGram as the private hybrid comparator, and Ria
        through public parent Euronet as the listed hybrid proxy.
    columns:
      - Comparable
      - Metric
      - Multiple / valuation status
      - Relevance
      - Limitation
    rows:
      - - Wise plc
        - $11.02B market cap / $2.33B revenue proxy; FY26 cross-border volume £181.7B
        - ~4.7x market-cap-to-revenue proxy
        - Upper digital bound because it is profitable, global, and highly transparent
        - Broader account-led platform and lower take-rate model are not like-for-like with Zepz.
      - - Remitly
        - $3.95B market cap / $1.72B TTM revenue proxy; $74.9B 2025 send volume
        - ~2.3x market-cap-to-revenue proxy
        - Closest public remittance app peer on corridor and diaspora use case
        - Public-company discipline and better current disclosure deserve part of its premium.
      - - Western Union
        - $2.33B market cap / $4.04B TTM revenue proxy; $4.1B FY2025 revenue
        - ~0.6x market-cap-to-revenue proxy
        - Hybrid incumbent floor for mature money-movement economics
        - Legacy network and slower growth make it too conservative as a one-for-one Zepz comp.
      - - MoneyGram
        - >-
          Private since Madison Dearborn completed the acquisition in 2023; nearly 500,000 locations and 5B digital
          endpoints
        - No current public valuation multiple
        - Operationally relevant hybrid comparator with meaningful network breadth
        - Private ownership prevents a clean current public multiple or mark-to-market reference.
      - - Ria via Euronet
        - Euronet $2.54B market cap / $4.24B TTM revenue proxy; Q1 2026 digital MT revenue +42% YoY
        - ~0.6x parent-level market-cap-to-revenue proxy
        - Useful listed proxy for a hybrid network that still shows digital money-transfer growth
        - Euronet includes other segments, so the parent multiple understates or misstates standalone Ria value.
    notes: >
      Multiples are proxy market-cap-to-revenue ratios, not EV/revenue, because consistent current net-debt treatment is
      not available across all peer references used here.
