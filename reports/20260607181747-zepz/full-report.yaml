  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Diaspora sender and recipient architecture
        blocks:
          - type: paragraph
            body: >-
              Zepz is not selling to enterprises or merchants; it is serving recurring consumer remittance behavior,
              with the payer typically a diaspora or migrant sender and the end-user often a household recipient who
              receives funds into a bank account, mobile-money wallet, or cash pickup branch. WorldRemit is the broader
              brand: its public pages say it serves 5.7 million customers, 70 currencies, and 130 countries, while other
              WorldRemit surfaces market 150-country reach and more than five million customers. The corridor pages for
              Nigeria, Kenya, and the Philippines show a consistent pattern of sender-funded bank or card payments, with
              recipient-side flexibility across cash pickup, bank transfer, mobile money, and airtime. Sendwave is
              narrower and more concentrated: its support and corridor pages are explicitly built around app-first
              senders in the US, UK, Canada, and parts of Europe who send primarily into Africa and South Asia. That
              makes the customer base easy to describe in workflow terms: the sender is a repeat app user funding
              transfers digitally, while the recipient is usually a mobile-money, bank, or named-partner cash-pickup
              beneficiary rather than a contractual account holder with disclosed retention economics.
