chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding history, and what Zepz actually sells
        blocks:
          - type: paragraph
            body: >-
              Zepz is the holding company that powers two consumer remittance brands: WorldRemit and Sendwave. The core
              origin story still runs through WorldRemit. Official company material says founder Ismail Ahmed started
              WorldRemit in London in 2010 after personally experiencing the cost and friction of sending money to
              family in East Africa. WorldRemit then added co-founders Catherine Wines and Richard Igoe, building a
              digital-first cross-border money transfer product that replaced agent visits with app and web initiation.
              The company expanded around bank deposit, cash pickup, airtime top-up, and mobile money payout, which is
              the critical product wedge in African and Asian corridors where recipients are often underbanked. Sendwave
              adds a second, mobile-first brand that emphasizes low-friction transfers, especially into Africa and Asia,
              and now markets wallet-based USDC transfers as an additional product surface. The group structure emerged
              when WorldRemit completed its acquisition of Sendwave in February 2021 and then rebranded the holding
              company to Zepz later that year. Public materials still show meaningful brand-level asymmetry: WorldRemit
              describes 5.7 million customers and 70 currencies, while Sendwave emphasizes easy texting-like UX and a
              newer digital-wallet proposition. For diligence purposes, the cleanest interpretation is that Zepz is not
              a single consumer brand but a shared platform and capital structure governing two overlapping remittance
              businesses, with consumer distribution still brand-specific.
