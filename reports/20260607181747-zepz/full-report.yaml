  - id: TV005
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Key risks
    rows:
      - - Bull
        - >-
          Audited 2025-2026 revenue and margins show clear improvement versus 2021, CFPB remediation is clean, and a
          permanent CEO plus board-ready governance are in place.
        - $3.5B-$5.0B fair-value range; the 2021 peak is only defensible near the top end after audited proof.
        - Low-to-medium probability until the finance pack and governance files are open.
        - >-
          The case still fails if the 2024 round carried punitive preferences or if scale claims do not convert into
          audited earnings.
      - - Base
        - >-
          Zepz remains scaled and investable but current economics are only partially proven and the 2024 valuation
          remains undisclosed.
        - >-
          $2.0B-$3.0B fair-value range; public evidence supports a discount to the 2021 peak and disciplined rather than
          aggressive entry.
        - Highest-probability public-evidence case today.
        - Hidden round terms, weaker margins, or another leadership wobble can still push the range lower.
      - - Bear
        - >-
          The 2024 round proves flat or down in common-equity terms or current profitability and controls disappoint
          when opened.
        - $1.0B-$1.8B fair-value range; markdown risk is real and the private mark could compress sharply.
        - Material probability unless diligence closes the core disclosure gaps.
        - Compliance, governance, or liquidity surprises would accelerate multiple compression.
    notes: >
      These ranges are underwriting judgments, not a DCF. They are intentionally wide because the central missing
      variable is not market size but current audited earnings quality.
