  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing surfaces, and what is actually public
        blocks:
          - type: paragraph
            body: >
              Zepz monetizes international money movement through a combination of transaction fees, foreign exchange
              spreads, and selective promotional pricing that can either reduce reported revenue or be expensed as
              marketing. The strongest direct accounting disclosure comes from the 2021 WorldRemit Group accounts, which
              state explicitly that revenue is earned from transaction fees and foreign exchange spreads and that
              first-transfer fee waivers or better introductory FX rates are treated as reductions to revenue up to the
              point a customer's cumulative revenue reaches zero. That is important because it shows list pricing and
              realized pricing are not the same thing. Current consumer-facing pages reinforce the same structure but do
              not publish a universal tariff sheet: WorldRemit tells users they will see fees and exchange rates upfront
              at checkout, while its currency converter emphasizes live conversion and mid-market reference rates.
              Sendwave's current wallet surfaces add a newer layer: opening and maintaining a wallet is free, some
              pay-in or withdrawal methods may still carry small disclosed fees, and the company promotes better rates,
              cashback, and USDC-based storage as monetization levers that are corridor- and behavior-dependent rather
              than globally standardized.
