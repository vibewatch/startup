      - number: '3.3'
        title: Capability, pricing, GTM, and trust/regulatory comparison
        blocks:
          - type: paragraph
            body: >-
              Capability comparison is more corridor-specific than in most fintech categories. WorldRemit, Remitly,
              Western Union, MoneyGram, and Ria all support mixtures of bank deposit and cash pickup, but they differ on
              mobile-money depth, retail dependence, and how transparently they present the fee-and-FX package before
              checkout. Wise is structurally different: it leads on explicit fee signaling and digital account
              economics, and it supports mobile-money payouts where available, but it does not foreground the broad
              cash-pickup network that hybrid remittance incumbents do. Remitly is closer to Zepz on product shape
              because it offers the same consumer promise of app-led onboarding plus payout flexibility. Western Union
              and MoneyGram retain trust-by-ubiquity because senders know the brand and recipients know the pickup
              network, but that reach comes with less elegant packaging and less fee simplicity than Wise. Trust is also
              not a one-way advantage for public or large incumbents. In the last two years, regulators acted against
              Wise, MoneyGram, and previously Sendwave over remittance disclosure or error-resolution issues, which
              means compliance quality is a category risk rather than a Zepz-only issue. The competitive consequence is
              that Zepz must defend both recipient reach and compliance credibility while also improving the clarity of
              its digital pricing experience.
