- id: operating-model-dependencies-support-and-reliability
  title: The operating model depends on consumer app distribution, payout partners, and named wallet infrastructure
  body: 'Public evidence suggests that Zepz’s product delivery model is operationally heavy even if the front end feels simple. Both brands rely on consumer app distribution, corridor-specific payout partners, compliance checks, and support operations rather than on a pure software-only loop. WorldRemit still markets app and web initiation plus transfer tracking, while Sendwave corridor pages describe debit-card and prepaid-card funding before funds reach mobile wallets, bank accounts, or cash pickup locations. The wallet adds another layer of dependency: USDC on named public launch rails, Fireblocks for treasury and settlement, and TRM for financial-crime monitoring. None of those dependencies is inherently negative, but each adds execution surface area.


    Support is visible, but reliability telemetry is not. WorldRemit’s contact flow pushes users into the help hub and transfer-status tools; Sendwave’s contact page advertises 24/7 in-app support and regional phone lines. That is enough to show that customer operations matter to the operating model. What public materials do not provide is equivalent evidence on uptime, incident history, or service-level commitments. In other words, Zepz’s public product-tech materials are much better at explaining what customers can do than at quantifying how reliably the stack performs under load, how often support escalations occur, or how the stablecoin layer behaves in production. That is a diligence gap, not a reason to invent hidden architecture.'
