- id: TE004
  title: Technical / operating dependency table
  description: Public dependencies that shape the operating model without inferring hidden backend design.
  columns:
  - Dependency / layer
  - Public role
  - Named dependency or rail
  - Operational risk if weak
  - Evidence status
  rows:
  - - Consumer acquisition surfaces
    - Acquire senders and originate transfers
    - WorldRemit web and app; Sendwave mobile app; app stores
    - Store friction, app-ranking weakness, or UX instability would hurt new-customer acquisition
    - Strong public evidence
  - - Sender funding rails
    - Load remittance or wallet value
    - Debit cards, prepaid cards, ACH for wallet funding
    - Funding failures or fraud controls can create support load and conversion friction
    - Strong public evidence
  - - Last-mile payout network
    - Deliver local value in recipient markets
    - Mobile-money providers, banks, and cash-pickup partners
    - Poor partner reach or outages directly degrade corridor usefulness
    - Strong public evidence, weak public partner detail
  - - Wallet value rail
    - Hold and move digital-dollar value
    - USDC and Solana-linked launch stack
    - Chain, issuer, or wallet-UX issues would hit a new strategic surface
    - Moderate public evidence
  - - Treasury and settlement layer
    - Store and settle digital assets at scale
    - Fireblocks
    - Vendor dependency and treasury-control quality matter as wallet volume grows
    - Moderate public evidence
  - - Financial-crime intelligence layer
    - Monitor sanctions and AML risk on blockchain activity
    - TRM Labs
    - Weak screening would create regulatory and fraud exposure
    - Moderate public evidence
  - - Regulatory perimeter
    - Authorize service in core jurisdictions
    - FinCEN, state licenses, FCA, FINTRAC, NBB, PCI/GDPR obligations
    - Licensing or compliance failure can directly constrain product availability
    - Strong public evidence
  - - Customer-support layer
    - Resolve transfer, refund, and wallet issues
    - FAQ hubs, in-app support, phone lines
    - Public support exists, but opaque service levels leave reliability hard to judge
    - Strong public support evidence, weak public reliability metrics
  notes: Rows model public operating dependencies rather than undisclosed internal microservices or vendor contracts.
