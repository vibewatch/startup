tables:
- id: TE001
  title: Product line / module matrix
  description: Publicly visible Zepz product surfaces across WorldRemit and Sendwave.
  columns:
  - Product line / surface
  - Primary user
  - Core job
  - Current payout or storage modes
  - Status / maturity
  - Differentiation
  - Key diligence gap
  rows:
  - - WorldRemit core transfer
    - Diaspora sender and recipient household
    - Send money from app or web with flexible last-mile choice
    - Bank transfer, cash pickup, mobile money, airtime top up
    - Mature current surface
    - Broadest explicit payout menu in public materials
    - No exhaustive live corridor-by-corridor payout matrix is public
  - - WorldRemit mobile money lane
    - Underbanked recipients in mobile-money markets
    - Receive remittances into a phone-linked stored-value account
    - Mobile money wallet plus local cash-out through provider agents
    - Mature where offered
    - Strong fit for Africa and some Asia corridors where bank access is thinner
    - Country availability still requires destination lookup rather than one static map
  - - WorldRemit cash pickup lane
    - Recipients without bank or wallet access
    - Collect transfer value as cash
    - Cash pickup through local partners
    - Mature where offered
    - Keeps reach in cash-dependent corridors
    - Pickup partner coverage and real-time service levels are not disclosed publicly
  - - WorldRemit airtime top up
    - Prepaid mobile users
    - Send call/data credit instead of general funds
    - Airtime recharge only
    - Mature adjunct feature
    - Useful low-ticket telecom-linked value transfer
    - Not a substitute for general stored value or wallet receipt
  - - Sendwave classic remittance
    - Mobile-first senders in diaspora corridors
    - Fund a transfer quickly from card-based pay-in and choose recipient receive method
    - Mobile wallet, bank account, cash pick-up depending corridor
    - Mature current surface
    - Simpler mobile-first packaging than WorldRemit on overlapping corridors
    - Exact receive-method mix is hidden behind corridor selection pages
  - - Sendwave Wallet
    - US senders and wallet-enabled recipients
    - Hold digital dollars, send wallet-to-wallet value, and decide when to convert or cash out
    - USDC storage, wallet transfer, select-market cash-out
    - Launched in 2025 and still expanding
    - Adds stored value and conversion timing control on top of remittance
    - US-sender-only rollout and selective cash-out mean footprint is not yet complete
  notes: Rows cover the main publicly visible product surfaces across both brands as of 2026-06-07; they are not an exhaustive SKU inventory.
