- id: trust-compliance-and-security-controls
  title: The public control stack is meaningful, but CFPB history keeps compliance central to the thesis
  body: 'Zepz does have a visible public control stack. On the WorldRemit side, safeguarding and onboarding language is reasonably concrete for a consumer remittance product: the company says customer funds awaiting payout are held in a dedicated customer-money account, and its customer-acceptance policy explicitly references anti-money-laundering, sanctions, anti-bribery, onboarding due diligence, and ongoing checks. On the Sendwave side, the public trust page is clearer about regulatory perimeter than many private fintechs are. It claims US FinCEN and state-licence coverage, FCA authorization in the UK, FINTRAC in Canada, NBB passporting in the EU, GDPR compliance, frequent audits, and PCI DSS certification for the mobile app. The public security page also says account opening may require identity verification and a unique security code, while the wallet page adds passkey login and 256-bit encryption.


    That positive evidence should not be overstated. The strongest adverse product-tech fact in the public record is still the CFPB’s 2023 order against Sendwave’s operator. The Bureau said Sendwave made deceptive remittance claims and violated Regulation E requirements, then required consumer redress and a civil money penalty. That does not negate the current wallet or remittance products, but it does change how they should be underwritten. For this chapter, the right stance is that Zepz’s public control story is real, yet investors should treat compliance execution as an operating dependency, not just as a legal appendix.'
