  evidenceGaps:
  - type: missing-source
    severity: material
    topic: wallet-country-matrix
    missingEvidence: A current exhaustive matrix of classic and wallet payout methods by receive country, including which wallet cash-out routes are live.
    whyItMatters: The public record supports Africa and Asia corridor breadth, but it does not expose a full corridor-by-corridor wallet and cash-out matrix.
    diligencePath: Request an internal corridor matrix that maps each receive country to bank, mobile money, cash pickup, wallet receipt, and wallet cash-out status.
    relatedQuestionRefs:
    - QE009
    - QE025
    relatedTableRefs:
    - TE002
  - type: private-evidence-only
    severity: material
    topic: stablecoin-operations
    missingEvidence: Transaction volumes, failure rates, treasury controls, vendor concentration terms, and unit economics for the Solana, Fireblocks, and TRM stack.
    whyItMatters: Public announcements name the stack but do not reveal whether the stablecoin product is operationally robust, economical, or strategically dependent on a small vendor set.
    diligencePath: Request wallet KPI dashboards, treasury-control documentation, vendor contracts, and post-launch operational reviews.
    relatedQuestionRefs:
    - QE012
    - QE013
    - QE014
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: reliability-disclosure
    missingEvidence: Historical uptime, incident logs, SLA terms, and support-resolution metrics for both brands and the wallet product.
    whyItMatters: Support pages are public, but buyers and investors still cannot judge service reliability, incident response, or refund performance from public evidence alone.
    diligencePath: Request customer-support KPIs, incident postmortems, and any internal or customer-facing SLA commitments.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: developer-ecosystem
    missingEvidence: Any public API docs, developer forums, or engineering blog surface beyond hiring pages and app listings.
    whyItMatters: Product-tech diligence is stronger when external integrators or developers leave a visible footprint; here the footprint is sparse.
    diligencePath: Ask management for API documentation, integration architecture, and ecosystem metrics even if they are not public.
    relatedQuestionRefs:
    - QE021
