- id: wallet-rollout-and-stablecoin-stack
  title: Sendwave Wallet extends the product into stored value and stablecoin remittances, but rollout is still selective
  body: 'The key product expansion beyond classic remittance is Sendwave Wallet. The live wallet page says the product is currently available only for senders from the United States, which immediately tells investors two things: first, the wallet is a real launched surface rather than a concept; second, the rollout is still geographically staged. Public wallet messaging layers several benefits on top of a standard transfer flow: better rates or cashback in select markets, faster refunds for non-USDC flows, 24/7 support, the ability to hold digital dollars, and recipient choice over when to convert or spend. The wallet FAQ adds two important operational details: opening and maintaining the wallet is free, and wallet-to-wallet digital-dollar transfers are presented as live in more than 113 countries.


    The stablecoin stack is now date-stamped in public. Zepz’s 24 October 2025 launch release described Sendwave Wallet as a stablecoin-backed peer-to-peer cross-border money solution built on Circle, Solana, and Portal. Fireblocks then said on 16 December 2025 that Zepz would use its treasury and settlement infrastructure to scale stablecoin remittances for WorldRemit and Sendwave, while TRM Labs said on 25 March 2026 that its blockchain intelligence would help Zepz manage financial-crime risk as the wallet expanded. That is enough to say the wallet has become part of the group’s real operating model. It is not enough to infer proprietary architecture or broad global completion, because the same wallet page still promises more countries and more ways to fund and cash out rather than an already-complete footprint.'
