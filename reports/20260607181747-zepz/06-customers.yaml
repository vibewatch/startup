- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Type
  - Current status
  - Impact
  - Diligence path
  rows:
  - - End-customer concentration
    - Structural positive / unknown
    - No top-customer disclosure; consumer base appears fragmented
    - Low classic single-customer risk, but public data does not quantify fragmentation
    - Request active-sender distribution by corridor and spend bucket
  - - Corridor concentration and inconsistent route totals
    - Concentration risk
    - Public totals conflict between 2,000 and 5,000 corridors
    - Makes it impossible to size true route concentration from public sources
    - Request corridor revenue, volume, and active-sender concentration for top 20 routes
  - - Payout-partner dependence
    - Partner dependence
    - Visible in cash-pickup banks, mobile-money wallets, ID checks, and SMS references
    - Partner outages, balance caps, or branch friction can directly damage customer experience
    - Request payout-partner concentration and SLA failure data
  - - Nigeria regulatory dependence
    - Adverse regulatory exposure
    - Sendwave says USD remittances to Nigerian domiciliary accounts are no longer permitted
    - Regulation can force payout-method changes and disrupt corridor economics
    - Request corridor change log and revenue impact from regulatory rule shifts
  - - Stablecoin / wallet expansion stack
    - Expansion driver and dependency
    - Sendwave Wallet is live for US senders only; TRM and Fireblocks support compliance and settlement
    - Upside for retention and cost reduction, but with added crypto/compliance counterparty reliance
    - Request wallet adoption, retained balance, and payout-partner dependency map
  - - Customer-trust overhang from enforcement
    - Adverse trust / compliance risk
    - CFPB ordered redress and penalties in 2023 over speed, cost, and disclosure failures
    - Customer-acquisition and retention can be hurt when regulators challenge service promises
    - Request complaint trend, remediation spending, and post-order control testing
  - - Wallet-led upsell opportunity
    - Expansion driver
    - Sendwave Wallet adds better-rate, cashback, faster refund, and digital-dollar storage features for US senders
    - Could convert one-off remitters into account-based repeat users if adoption expands beyond the US
    - Request wallet MAUs, funded-wallet rate, and repeat-send uplift versus non-wallet users
  notes: The most visible concentration risks are corridor, payout-partner, and regulatory dependencies rather than enterprise-style customer concentration. Wallet expansion is promising but still early and US-centric.
