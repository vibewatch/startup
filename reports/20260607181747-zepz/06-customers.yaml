company:
  name: Zepz
chapter:
  number: 6
  title: Customers
  summary: 'Zepz serves diaspora remittance customers through two different customer architectures: WorldRemit is the broader multi-rail brand with 5.7 million customers across 130 countries and 70 currencies, while Sendwave is the narrower app-first brand concentrated in high-frequency routes from North America and Europe into Africa and South Asia, with a wallet upsell for US senders. Public customer proof is real but surface-level: WorldRemit shows 4.8/5 from 216K App Store ratings, 78,150 on-site reviews, and more than 20 million historical Philippines transfers, while Sendwave review sites praise its low-friction mobile-money experience. Durability remains under-disclosed because neither brand publishes NRR, GRR, churn, or corridor revenue mix, leaving partner, corridor, and regulatory dependence more visible than true cohort retention.'
sections:
- id: customer-architecture
  title: Diaspora sender and recipient architecture
  body: 'Zepz is not selling to enterprises or merchants; it is serving recurring consumer remittance behavior, with the payer typically a diaspora or migrant sender and the end-user often a household recipient who receives funds into a bank account, mobile-money wallet, or cash pickup branch. WorldRemit is the broader brand: its public pages say it serves 5.7 million customers, 70 currencies, and 130 countries, while other WorldRemit surfaces market 150-country reach and more than five million customers. The corridor pages for Nigeria, Kenya, and the Philippines show a consistent pattern of sender-funded bank or card payments, with recipient-side flexibility across cash pickup, bank transfer, mobile money, and airtime. Sendwave is narrower and more concentrated: its support and corridor pages are explicitly built around app-first senders in the US, UK, Canada, and parts of Europe who send primarily into Africa and South Asia. That makes the customer base easy to describe in workflow terms:
    the sender is a repeat app user funding transfers digitally, while the recipient is usually a mobile-money, bank, or named-partner cash-pickup beneficiary rather than a contractual account holder with disclosed retention economics.'
