  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Brand-level NRR, GRR, sender churn, recipient churn, and repeat-send cohorts by corridor and payout method.
    whyItMatters: Customer durability cannot be underwritten from ratings and product features alone; cohort economics determine payback, marketing efficiency, and valuation quality.
    diligencePath: Request monthly active-sender cohorts, repeat-send frequency, sender retention by corridor, and any board reporting on churn or revenue retention.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU026
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration-mix
    missingEvidence: Top-corridor volume and revenue concentration, payout-partner concentration, and active-sender concentration by geography.
    whyItMatters: Publicly visible customer count is broad, but concentration risk may still sit inside a small set of corridors or counterparties.
    diligencePath: Request top 20 corridors by volume and revenue, top payout partners by disbursement share, and monthly sender concentration by send market.
    relatedQuestionRefs:
    - QU023
    - QU024
    - QU026
    relatedTableRefs:
    - TU006
  - type: conflicting-data
    severity: material
    topic: corridor-count-conflict
    missingEvidence: A reconciled metric dictionary explaining whether current group scale is 2,000 corridors or 5,000 corridors and how users versus customers are defined.
    whyItMatters: Conflicting route totals weaken confidence in headline customer-scale claims and make concentration analysis unreliable.
    diligencePath: Ask management for a current KPI glossary covering customers, users, active senders, receive countries, send countries, and corridor definitions.
    relatedQuestionRefs:
    - QU007
    - QU025
    relatedTableRefs:
    - TU003
    - TU006
  - type: private-evidence-only
    severity: material
    topic: wallet-adoption
    missingEvidence: Wallet MAUs, funded-wallet rate, repeat-send uplift, retained balance, and corridor mix for Sendwave Wallet users.
    whyItMatters: The most important expansion surface in the public record is the wallet, but its actual retention and monetization impact remain opaque.
    diligencePath: Request wallet cohort dashboards, adoption by existing versus new senders, and corridor-level usage of digital-dollar cash-out flows.
    relatedQuestionRefs:
    - QU021
    - QU022
    - QU026
    relatedTableRefs:
    - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: customer-proof-table-coverage
    missingEvidence: A broader raw review export or store-level review history for both brands across iOS, Android, and corridor-specific channels.
    whyItMatters: The public customer-proof table is a representative sample of review surfaces, not a full population of all customer reviews and comments.
    diligencePath: Export review histories from app stores, Trustpilot, and internal support tooling to quantify rating drift, complaint themes, and review geography.
    relatedQuestionRefs:
    - QU008
    - QU010
    - QU011
    relatedTableRefs:
