- id: customer-proof-and-adoption
  title: Customer proof, app signals, and adoption surfaces
  body: 'Public customer proof exists, but it looks different from B2B software evidence because the best external signals are ratings, review density, corridor pages, and third-party provider reviews rather than named logos. WorldRemit has the stronger public proof stack today: its Apple App Store page shows a 4.8 out of 5 score from 216,000 ratings, its own reviews page reports 78,150 reviews and a 4.1 “Great” score, and its Philippines corridor page says customers have sent more than 20 million transfers to that market since 2011. Independent reviewers broadly confirm that WorldRemit wins on breadth and payout variety rather than always on price. Sendwave’s public proof is narrower but still tangible. Its official corridor pages repeatedly say more than one million users trust the app, while Remit-Scout and RemitReview both score the product highly for instant mobile-money delivery and low-friction app flows. The pattern is consistent: WorldRemit looks like the broad, multi-country household-remittance
    utility, whereas Sendwave looks like the faster, more focused, mobile-first corridor product for frequent senders in a smaller set of routes.'
