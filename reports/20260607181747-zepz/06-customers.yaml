figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: How diaspora senders progress from quote and verification to payout choice, repeat sending, and wallet expansion across the two Zepz brands.
  data:
    nodes:
    - label: 'Trigger: family-support need'
      detail: Sender opens WorldRemit or Sendwave to fund bills, school fees, medical needs, or household support for a recipient abroad.
      tone: neutral
    - label: Quote and identity check
      detail: Both brands show price and payout choice before payment and require identity checks; Sendwave is app-first and debit-card-led, while WorldRemit allows broader funding and web/app usage.
      tone: neutral
    - label: Payout rail selection
      detail: Sender chooses bank transfer, mobile money, cash pickup, airtime, or in Sendwave Wallet cases a digital-dollar path with later cash-out.
      tone: positive
    - label: Recipient delivery and confirmation
      detail: Recipients receive money through local partners, wallets, banks, or pickup branches; both brands surface status updates and delivery notifications.
      tone: positive
    - label: Repeat send behavior
      detail: WorldRemit emphasizes saved receivers, quick resend, and tracking, while Sendwave highlights in-app limits, low-friction repeat use, and 24/7 chat.
      tone: positive
    - label: Expansion to wallet / digital dollars
      detail: The newest expansion loop is Sendwave Wallet for US senders, where stored balance, cashback, and digital-dollar transfers attempt to deepen retention beyond single transfers.
      tone: positive
  claimRefs:
  - CU004
  - CU020
  - CU021
  - CU022
  - CU024
- id: FU002
  title: Brand, corridor, and partner dependence flow
  type: flow
  layout: wide
  summary: Distinct routing logic across WorldRemit and Sendwave, showing that customer concentration risk is expressed through corridors, payout partners, and compliance infrastructure.
  data:
    nodes:
    - id: worldremit-senders
      label: WorldRemit broad sender base
      description: Multi-country diaspora senders use web or app flows across a broad set of routes and payout methods.
    - id: worldremit-rails
      label: WorldRemit payout rails
      description: Bank transfer, mobile money, cash pickup, and airtime depend on local partners and recipient identification.
      dependsOn:
      - worldremit-senders
    - id: sendwave-senders
      label: Sendwave focused senders
      description: App-first senders in the US, UK, Canada, and parts of Europe fund high-frequency corridors to Africa and South Asia.
    - id: sendwave-rails
      label: Sendwave corridor partners
      description: Delivery depends on specific mobile-money, bank, and cash-pickup partners such as MTN, bKash, Access, Zenith, and Fidelity.
