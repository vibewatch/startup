tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - WorldRemit diaspora sender
    - Sender is both payer and app/web user
    - Recurring family-support remittance funded by bank transfer or card
    - 5.7M customers; 70 currencies; 130 countries on about page
    - Broadest brand reach inside Zepz; diversified payout choice
    - No active-sender split by send country or corridor
  - - WorldRemit household recipient
    - Recipient is end user, not payer
    - Receive via bank transfer, mobile money, cash pickup, or airtime top-up
    - Coverage marketed across 130-150 countries
    - Recipient flexibility raises conversion in cash- and wallet-heavy markets
    - Payout-method mix by corridor is undisclosed
  - - Sendwave app-first sender
    - Sender is payer and in-app user
    - High-frequency transfers from the US, UK, Canada, and parts of Europe
    - 1M+ trusted users on corridor pages; broader group >9M users
    - Lower-friction corridor specialist for repeat remittances
    - No public active-user split by send geography
  - - Sendwave mobile-money recipient
    - Recipient is wallet or mobile-money holder
    - Receive funds into mobile-money rails in Africa and Bangladesh
    - Explicit in Ghana/Bangladesh support and corridor pages
    - Speed and convenience drive repeat behavior in non-bank markets
    - Wallet-versus-bank share is not disclosed
  - - Sendwave bank / cash-pickup recipient
    - Recipient uses bank account or named pickup partner
    - Receive via banks or named cash-pickup partners in corridors like Nigeria
    - Named bank and pickup partners disclosed by corridor
    - Important where wallet penetration is weaker or regulators constrain rails
    - Partner-level concentration and payout share are not public
  - - Sendwave Wallet sender
    - US sender becomes payer, user, and stored-balance holder
    - Hold and send digital dollars with better-rate or cashback offers
    - Wallet currently limited to US senders
    - Most visible expansion and retention surface beyond one-off remittance
    - Wallet adoption, frequency, and take-up by existing senders are not public
  notes: Rows describe payer-user-recipient structure rather than enterprise accounts because Zepz is serving consumer remittance workflows. Scale values are public marketing or platform signals, not audited active-user cohorts.
