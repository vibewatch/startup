  topStrengths:
    - >-
      Dual-brand reach across WorldRemit and Sendwave gives Zepz broad payout coverage and multiple customer-acquisition
      surfaces in remittance corridors.
    - >-
      The company has demonstrated repeated access to late-stage capital, including a $292 million Series E in 2021 and
      a $267 million follow-on round in 2024.
    - >-
      WorldRemit and Sendwave support the payout methods that matter most in underbanked markets: bank deposit, cash
      pickup, airtime, mobile money, and now wallet-based digital dollars.
    - >-
      Public materials show a genuine product-extension effort beyond pure remittance into wallet and stablecoin
      capabilities, rather than a static remittance-only posture.
  topRisks:
    - >-
      The 2023 CFPB enforcement action against Sendwave is a real consumer-compliance scar and raises questions about
      remediation depth.
    - >-
      Zepz has gone through repeated layoffs in 2022, 2023, and 2025, suggesting that cost structure and integration
      were more difficult than headline growth messaging implies.
    - >-
      The October 2024 funding round disclosed fresh capital but not valuation, leaving the 2021 $5 billion mark stale
      and hard to defend with public financial evidence.
    - >-
      Board composition, current cap-table economics, and permanent post-Lenhard leadership remain under-disclosed for a
      company at this scale.
    - >-
      Price competition from Wise, Remitly, and other digital remittance providers continues to pressure fees and FX
      spreads.
  unresolvedGaps:
    - Current audited group revenue, gross margin, EBITDA, and cash-flow statements are not publicly available.
    - The post-2024 valuation, preference stack, and dilution terms remain undisclosed.
    - >-
      Public documents disagree on current users, corridor count, and headcount, so management reconciliation is still
      required.
    - The permanent CEO succession plan and full board governance map are not public.
    - There is no public, management-level proof that the CFPB / compliance issues have been fully remediated.
