  evidenceGaps:
  - type: missing-source
    severity: material
    topic: corridor-mix-disclosure
    missingEvidence: Current public corridor-level send volume concentration, corridor growth, and top-corridor dependence for Zepz.
    whyItMatters: Without corridor concentration data, investors cannot tell whether Zepz's current volume is diversified or exposed to a few diaspora routes.
    diligencePath: Request top-20 corridors by send volume, growth, margin, and failed-transfer rate under NDA.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: material
    topic: payout-mix-retention
    missingEvidence: Payout-method mix, repeat rate, retention, and cohort behaviour by receive rail and corridor.
    whyItMatters: The durability of Zepz's share depends on whether bank, mobile-money, cash, and wallet users retain differently.
    diligencePath: Request cohort retention and repeat-use splits by payout type, corridor, and customer tenure.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: material
    topic: wallet-adoption-metrics
    missingEvidence: Active Sendwave Wallet users, wallet balances, stablecoin share of transfer volume, and cash-out behaviour.
    whyItMatters: Wallet adjacency is central to the growth narrative, but public sources only show launch, coverage, and partner announcements.
    diligencePath: Request monthly active wallets, balance retention, repeat cash-out timing, and stablecoin-related unit economics.
    relatedQuestionRefs:
    - QM024
  - type: conflicting-data
    severity: minor
    topic: footprint-definition-drift
    missingEvidence: A reconciled company definition of corridor count, country count, and whether figures refer to marketed, active, or technically available routes.
    whyItMatters: The difference between 2,000, 4,600, and 5,000 corridors changes how investors interpret Zepz's market reach and serviceable coverage.
    diligencePath: Ask management to provide a one-page metric dictionary for corridors, send countries, receive countries, and active users.
    relatedQuestionRefs:
    - QM020
