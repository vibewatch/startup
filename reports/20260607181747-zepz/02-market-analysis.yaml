- id: growth-drivers-and-constraints
  title: Growth drivers, adoption constraints, and unresolved diligence gaps
  body: 'The market has real tailwinds. ILO still counts 167.7 million migrants in the labour force and says that base has grown by more than 30 million since 2013. GSMA reports mobile money processing of about $2.1 trillion in 2025 with 593 million active 30-day accounts, which materially improves recipient readiness in Zepz’s target markets. World Bank cost benchmarks also create room for disruption because global remittance pricing remains far above the 3% policy target, while banks remain especially expensive. But the constraints are just as real. Corridor expansion requires licensing, AML controls, treasury, and partner due diligence, so growth is not asset-light in the way pure consumer internet marketplaces are. Trust is also a hard operating variable: CFPB’s order against Sendwave shows that disclosure and error-resolution failures can become penalties, redress, and reputational damage. Stablecoins are promising, but public sources still stop short of disclosing active-wallet counts,
    retained balances, or corridor-level economics. Investors therefore need to separate strong category directionality from the still-missing company-specific data needed to underwrite durable share and margin.'
