- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Migrant-worker growth
    - Positive
    - Medium term
    - Larger sender base supports recurring remittance demand
    - Request Zepz sender-growth by top send market
  - - Mobile-money scale
    - Positive
    - Near to medium term
    - More recipients can accept digital value instead of only cash pickup
    - Measure payout mix by mobile money, bank, and cash
  - - Global cost still above 3% target
    - Positive for challengers
    - Near term
    - Room remains for digital providers to win on price and transparency
    - Benchmark corridor quotes against banks and top digital peers
  - - Stablecoin / wallet adjacency
    - Positive but early
    - Medium term
    - Could increase retention and create stored-value use cases beyond one-off sends
    - Request active wallets, retained balances, and stablecoin transaction share
  - - Licensing, AML, and disclosure obligations
    - Negative
    - Ongoing
    - Slows corridor launches and raises operating complexity
    - Review licensing map, audit findings, and compliance headcount
  - - Trust and enforcement risk
    - Negative
    - Near term
    - Errors or deceptive disclosures can directly trigger redress and penalties
    - Request complaints, refunds, and regulator-correspondence metrics
  - - Price-transparency pressure from digital peers
    - Negative
    - Near term
    - Sender switching costs stay low when quotes are easy to compare
    - Track win/loss by corridor versus Wise and Remitly
  - - Payout-network and settlement intensity
    - Negative
    - Ongoing
    - Even without branches, expanding corridors requires partners, treasury, and operational controls
    - Review partner concentration, failed-transfer rates, and treasury economics
  notes: Implications are analytical judgments grounded in retained evidence. The table mixes tailwinds and headwinds because both shape adoption timing and valuation.
