tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Formal digital consumer remittances
    - Transfer fee, FX spread, payout processing, compliance cost embedded in each send
    - B2B AP/AR flows, trade finance, merchant settlement
    - Migrant sender household pays; recipient receives
    - Core Zepz market
  - - Hybrid remittance corridors
    - Digital initiation plus cash pickup or local-agent payout economics
    - Pure retail branch banking outside cross-border send use case
    - Sender pays; recipient often chooses pickup need
    - Important where physical fallback still matters
  - - Wallet / stablecoin adjacency
    - Stored value, wallet-to-wallet transfers, conversion spread, cash-out fee where applicable
    - Standalone crypto speculation or exchange trading
    - Sender funds wallet; recipient may hold or cash out later
    - Expands Zepz into adjacent financial-behaviour spend
  - - Bank-transfer substitute
    - Account-to-account remittance or international wire fees
    - Domestic payments unrelated to cross-border family support
    - Sender household pays bank fees
    - Status-quo substitute; still costly on average
  - - Mobile-money-native substitute
    - Wallet payout, cash-out fees, mobile-money transfer economics
    - Unrelated domestic merchant acquiring
    - Sender pays; recipient may already live in wallet ecosystem
    - Relevant in African and Asian receive markets
  - - Broad cross-border payments umbrella
    - Consumer remittances only as one slice of a much larger universe
    - B2B, wholesale treasury, card acquiring, marketplace settlement
    - Multiple enterprise buyers
    - Useful TAM context but wrong market boundary for Zepz
  notes: 'Included and excluded spend are defined by the end-user job to be done: migrant household remittance and adjacent wallet value storage, not generic global payments.'
