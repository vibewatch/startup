company:
  name: Zepz
chapter:
  number: 2
  title: Market Analysis
  summary: 'Zepz operates in the large but definition-sensitive consumer remittance market, where official lenses range from about $656 billion to $856 billion and partner sources go higher. The company''s directly relevant opportunity is narrower: digital, migrant-led, corridor-specific remittances into Africa, Asia, and adjacent wallet use cases, with growth driven by mobile money and connectivity but constrained by regulation, trust, and payout economics.'
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitutes
  body: Zepz should be analyzed inside formal cross-border consumer remittances, not inside the entire global cross-border-payments complex. The relevant job is a migrant sender moving household money to a named recipient who may need bank deposit, mobile money, cash pickup, or now wallet-based receipt. Included spend therefore covers transfer fees, FX spread, payout processing, and the newer wallet adjacency where Sendwave lets recipients receive, store, and later cash out digital dollars. Excluded spend includes B2B supplier payables, card acquiring, travel FX, treasury, merchant settlement, and most wholesale payment flows, because those markets have different buyers, compliance stacks, and distribution economics. The status quo is also not a single incumbent. Banks remain an expensive formal substitute; Western Union–style hybrid networks remain relevant where physical fallback matters; mobile-money-native routes can be cheaper in specific corridors; and informal cash handoffs still
    compete where trust is hyperlocal. This framing matters because Zepz wins or loses corridor by corridor on payout relevance and trust, not on an abstract claim to “global payments.” Public materials also disagree on corridor counts, which reinforces that market-boundary claims need precise definitions before they can support valuation.
