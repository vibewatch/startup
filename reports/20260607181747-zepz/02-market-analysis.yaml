- id: market-sizing
  title: Sizing the market with multiple lenses
  body: A single TAM number would be misleading here because public publishers are measuring different things. The most conservative official framing is the World Bank’s statement that remittances back to home countries totaled about $656 billion in 2023. A broader official lens from the World Bank API shows world personal remittances received of about $856.1 billion in 2024. Fireblocks, a Zepz infrastructure partner, goes further and cites a projected global remittance market of $895 billion by 2025. Those figures should not be harmonized as if they were the same series; they differ in scope, year, and methodology. For Zepz, the more useful lens is the receive-side pool in its core emerging-market corridors. South Asia and Sub-Saharan Africa alone received about $239.1 billion in 2024. That is still too broad to call SAM because not every corridor is in Zepz’s footprint and not every recipient flow is digitally ready. Applying a transparent 25% to 40% digital-ready and served-corridor filter
    yields an evidence-constrained SAM of roughly $60 billion to $95 billion. Against that base, Zepz’s publicly cited 2025 transfer volume of more than $17 billion suggests meaningful current share, while public Wise, Remitly, and Western Union disclosures confirm the category is large and heavily contested.
