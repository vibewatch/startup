tables:
- id: TP001
  title: Competitor profile table
  enumerationScope:
    coverage: partial
    basis: Covers the main direct, incumbent, and substitute options relevant to Zepz in consumer remittances and diaspora corridors; excludes small corridor-specific local operators without public evidence.
  columns:
  - Provider
  - Role vs Zepz
  - Public scale signal
  - Ownership / funding status
  - Core payout modes
  - Pricing posture
  - Strategic direction
  - Key weakness vs Zepz
  rows:
  - - Zepz / WorldRemit
    - Subject; digital-first remittance specialist
    - 5.7M customers; 130 countries; 70 currencies
    - Private; latest public valuation still anchored to 2021 $5B mark; current valuation undisclosed
    - Bank deposit, mobile money, cash pickup, airtime top-up
    - Live quote; price/speed vary by corridor, receive method, and pay-in method; markets itself as 46% cheaper than most banks
    - Defend diaspora corridors while broadening wallet and digital-finance surfaces
    - Less public disclosure than listed peers; weaker pure fee-transparency reputation than Wise
  - - Wise
    - Direct digital comparator
    - 18.9M active customers; £181.7B FY26 cross-border volume
    - Public company (Wise PLC)
    - Account transfer and mobile money where available; cash pickup not a lead proposition
    - Explicit fee-led pricing; fees as low as 0.1%; low take-rate strategy
    - Keep compounding transparent cross-border account economics
    - Less relevant where cash pickup or hybrid recipient options dominate
  - - Remitly
    - Direct digital comparator
    - 9.6M+ customers; $74.9B 2025 send volume; 175+ countries
    - Public company (Remitly Global)
    - Bank deposit, cash pickup, mobile wallet, home delivery by corridor
    - Live corridor-specific quote via calculator; monetizes through fees plus FX spread
    - Expand beyond basic remittance into broader immigrant-finance use cases
    - Exact global price leadership not statically observable; public regulatory record lighter than peers but still a monitored category
  - - Western Union
    - Scaled hybrid incumbent
    - 500,000+ agents; 200+ countries; $4.1B FY2025 GAAP revenue
    - 'Public company (NYSE: WU)'
    - Cash pickup, bank account, digital wallet, pay-in-store and online
    - Live quote; hybrid online/offline packaging; not the clearest headline-fee brand
    - Digitize legacy network, raise branded-digital mix, and test stablecoin rails
    - Legacy complexity and retail cost base can blunt pure-app economics
  - - MoneyGram
    - Scaled hybrid incumbent
    - 50M+ customers; nearly 500,000 locations; 5B digital endpoints
    - Private since 2023 Madison Dearborn acquisition
    - Cash pickup, bank account, card, mobile wallet
    - Live quote; fee depends on corridor, amount, funding type, and receive method
    - Push digital mix higher while preserving global cash network
    - Recent NYAG settlement weakens trust narrative; ownership is private and less transparent than listed peers
  - - Ria
    - Hybrid incumbent / secondary brand threat
    - 600,000+ locations; 200 countries and territories; 3.7B digital-wallet reach
    - Owned by public parent Euronet
    - Cash pickup, bank deposit, digital send flow
    - Calculator-led quote; promo-first-transfer framing appears in online flow
    - Use Euronet investment and digital growth to deepen hybrid remittances
    - Lower consumer mindshare than Western Union or MoneyGram
  - - Banks and card-funded wires
    - Status-quo substitute
    - Bank channel average cost 12.66% in World Bank data
    - Incumbent banking capital base
    - Bank account only in most cases
    - Usually high cost and slower; trusted brand can offset poor economics
    - Retain customers who prefer traditional financial institutions
    - Expensive for small-value diaspora transfers and weak on cash or wallet delivery
  - - Mobile-money-native and informal cash routes
    - Recipient-side substitute
    - Mobile-money remittance costs are materially below global average in GSMA data
    - Fragmented wallets, telcos, local agents, and informal networks
    - Wallet deposit or informal cash handoff
    - Very corridor-specific; may be cheaper than bank rails but less portable cross-corridor
    - Win where recipient behavior is already wallet-native or informal
    - Often limited on compliance, traceability, or broad cross-border coverage
  notes: Funding and ownership fields distinguish public-company access to capital, private-equity backing, and Zepz's limited current valuation disclosure rather than forcing an apples-to-apples venture-funding metric.
