  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-zepz-group-send-volume-and-corridor-mix
    missingEvidence: Current consolidated Zepz group send volume, active senders, and corridor mix across WorldRemit plus Sendwave are not publicly reconciled in a 2025-2026 disclosure set comparable to listed peers.
    whyItMatters: Without a current group operating baseline, it is hard to quantify whether Zepz is nearer to Remitly, Western Union branded digital, or MoneyGram on actual throughput and repeat use.
    diligencePath: Request current active senders, send volume, corridor concentration, and payout-method mix under NDA, split by WorldRemit and Sendwave where possible.
  - type: stale
    severity: material
    topic: corridor-level-price-snapshots
    missingEvidence: A stable, apples-to-apples matrix of exact fees and FX spreads across overlapping Zepz, Wise, Remitly, Western Union, MoneyGram, and Ria corridors was not retained because the providers use live calculators that change by amount, funding type, and payout method.
    whyItMatters: Competitive pricing conclusions can overstate or understate the real consumer ranking if they rely on one stale quote or one payment method.
    diligencePath: Run a same-day corridor sample across 8-10 key diaspora routes with matched send amounts, pay-in methods, and recipient payout types, then archive screenshots or exported quotes.
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: multi-homing-and-churn-by-corridor
    missingEvidence: No public source quantified multi-homing, repeat rate, or churn for Zepz versus Wise, Remitly, or hybrid incumbents by corridor.
    whyItMatters: Switching-cost claims are materially weaker without observed behavior on whether senders actually alternate providers or stay with one brand after onboarding.
    diligencePath: Request cohort retention, repeat-rate, and quote-to-send conversion data by corridor and payout type, and compare win-loss versus Wise and Remitly marketing-heavy corridors.
    relatedTableRefs:
    - TP004
