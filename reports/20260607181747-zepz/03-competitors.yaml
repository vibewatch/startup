- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk dimension
  - Current evidence
  - Threat vector
  - Severity
  - Time horizon
  - Mitigant or diligence ask
  rows:
  - - Payout breadth in diaspora corridors
    - WorldRemit documents bank deposit, mobile money, cash pickup, and airtime
    - Wise or another digital-first rival expands recipient options faster than Zepz communicates them
    - Medium
    - 12-24 months
    - Request corridor-level payout mix, repeat-use by payout type, and recipient success rates
  - - Price transparency
    - WorldRemit has live quotes, but Wise is the clearer fee benchmark and Remitly also markets transparent app-led quoting
    - Consumers may perceive Zepz as less transparent than peers despite competitive economics
    - High
    - Near term
    - Compare landing-page disclosure and quote conversion by corridor against Wise and Remitly
  - - Retail ubiquity disadvantage
    - WU, MoneyGram, and Ria retain far larger physical or cash-pickup infrastructure
    - Hybrid incumbents win recipients who trust agent brands or need fallback cash access
    - Medium
    - Ongoing
    - Measure loss rates in cash-heavy corridors and identify whether partner density is a binding constraint
  - - Compliance trust risk
    - Wise, MoneyGram, and Sendwave all faced recent remittance-enforcement actions
    - Disclosure or error-resolution failures can erode trust quickly across the category
    - High
    - Ongoing
    - Review refund/error-resolution KPIs, complaint ratios, and regulator correspondence by brand
  - - Digital specialist pressure
    - Wise continues to reduce take rate while scaling and Remitly keeps growing send volume
    - Digital-first rivals can compress margins or out-message Zepz on value-for-money
    - High
    - 12-36 months
    - Track corridor-level win/loss against Wise and Remitly by fee, FX, and payout-type match
  - - Incumbent digital reinvestment
    - Western Union and Euronet are still investing in digital and stablecoin infrastructure
    - Legacy incumbents become more app-like without surrendering network reach
    - Medium
    - 12-36 months
    - Track branded-digital mix, digital transaction growth, and new payout rails at WU and Euronet
  - - Sender multi-homing
    - Live calculators and app onboarding lower search costs across providers
    - Price-sensitive users may split volume across apps rather than staying loyal
    - Medium
    - Ongoing
    - Request repeat-rate and churn data for corridors where Wise and Remitly also advertise heavily
  - - Disclosure gap vs public peers
    - Wise, Remitly, Western Union, and Euronet publish fresher operating updates than Zepz
    - Competitive evaluations may favor the most measurable brand, not only the best corridor product
    - Medium
    - Near term
    - Request current group send volume, active senders, corridor mix, and refund metrics under NDA
  notes: Severity ratings are analytical judgments based on retained evidence rather than company disclosures. The table intentionally mixes strengths and risks because moat durability in remittances is inseparable from corridor-specific execution and trust.
