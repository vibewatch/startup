    - GSMA says mobile-money remittances are materially cheaper than global average; informal cash is opaque
    - Wallet app or local agent handoff
    - Wallet or cash
    - 'Mixed: mobile money can be clear; informal cash is opaque'
    - Real substitute in specific recipient ecosystems, especially when recipients already live in wallets
