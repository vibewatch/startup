    - Live currency converter
    - Exact rate shown per corridor; monetizes through transaction fees and FX spread
    - Digital app/web flow
    - Bank deposit, cash pickup, mobile wallet, home delivery
    - High transparency at quote level, but no one static global fee card
    - Closest like-for-like diaspora app competitor to Zepz
  - - Western Union
    - Send-money flow and bank-transfer page
    - Quote-based pricing; hybrid online / pay-in-store packaging
    - Digital plus retail start or finish in store
    - Cash pickup, bank account, wallets
