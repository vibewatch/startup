chapter:
  number: 3
  title: Competitors
  summary: Zepz sits between pure digital remittance specialists and scaled hybrid incumbents. Wise is the sharpest price-transparency threat; Remitly is the closest app-led diaspora-corridor overlap; Western Union, MoneyGram, and Ria still matter because cash and bank payout ubiquity remain decisive in many recipient markets. Zepz retains a real moat where mobile money, cash pickup, and bank deposit must coexist, but its weaker public disclosure and lower fee transparency make that moat less durable than it first appears.
sections:
- id: competitive-landscape
  title: Competitive landscape in consumer remittances
  body: 'Zepz competes in consumer remittances against two different archetypes at once. The first archetype is digital-first app-led specialists such as Wise and Remitly, which win on transparent pricing, mobile onboarding, and clear self-serve user experience. The second archetype is hybrid incumbents such as Western Union, MoneyGram, and Ria, which pair digital acquisition with dense cash-pickup, bank, and wallet payout infrastructure. Banks, card-funded wires, and mobile-money-native recipient rails remain the relevant substitutes rather than an abstract background condition: WorldRemit still markets itself as cheaper than banks, while World Bank and GSMA data show banks remain the highest-cost channel and mobile money can be structurally cheaper than the global average. In diaspora corridors, buyers are not choosing a generic remittance app; they are choosing a payout network, a fee-and-FX experience, and a recipient trust surface. On that framing, Zepz is strongest where African and
    Asian corridors require bank deposit, cash pickup, and mobile money in the same portfolio. It is less advantaged where the purchase decision is dominated by pure price transparency and account-to-account economics, where Wise is the sharpest comparator, or by physical ubiquity, where Western Union, MoneyGram, and Ria still matter.'
