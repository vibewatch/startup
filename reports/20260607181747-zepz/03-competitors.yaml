- id: switching-costs-and-multi-homing
  title: Switching costs, multi-homing, and distribution power
  body: 'Consumer remittances have lower sender-side switching costs than many enterprise fintech categories because the leading providers all expose self-serve onboarding, live quotes, and app-based repeat use. That makes it easy for price-sensitive senders to compare Zepz, Wise, and Remitly before each transfer, especially in corridors where the recipient can accept multiple payout methods. The harder switching variable sits on the recipient side. If a family member needs mobile money, a known cash-pickup partner, or a particular bank-deposit path, the sender''s choice set narrows quickly and the service with the right local payout map becomes sticky. This is why Western Union, MoneyGram, and Ria remain relevant even when their digital UX is less admired: distribution density, recipient familiarity, and pay-in-store options reduce the risk of a failed transfer. Zepz''s advantage over pure account-to-account rivals is that WorldRemit can still compete on payout flexibility across mobile
    money, cash pickup, and bank deposit. Its weakness versus hybrid incumbents is that it cannot match their physical agent ubiquity or decades-long default status. The practical result is a multi-homing market on the sender app but a locally sticky market on the recipient rail.'
