- id: competitor-profiles
  title: 'Competitor profiles: scale, funding, product scope, and pricing posture'
  body: 'The direct digital overlap is clearest with Wise and Remitly. Wise now discloses 18.9 million active customers and £181.7 billion of FY26 cross-border volume, and it positions around low explicit fees, transparent FX, and account or wallet-linked delivery rather than cash-heavy corridors. Remitly is the closest like-for-like diaspora app competitor to Zepz: it reports more than 9.6 million customers across 175+ countries, $74.9 billion of 2025 send volume, and payout options that include bank deposit, cash pickup, mobile wallet, and home delivery depending on corridor. The hybrid incumbents are larger or at least broader on physical distribution. Western Union still pairs a 500,000+ retail network with digital delivery and generated $4.1 billion of full-year 2025 GAAP revenue, while MoneyGram highlights 50+ million customers, nearly 500,000 locations, and 5 billion digital endpoints after its 2023 take-private by Madison Dearborn. Ria matters less in brand mindshare but not in infrastructure:
    it claims 600,000+ locations across 200 countries and territories and sits inside public parent Euronet, whose money-transfer business is still growing digitally. Zepz is therefore not facing one monolithic rival; it faces specialist digital disruptors on one flank and scaled hybrid incumbents on the other.'
