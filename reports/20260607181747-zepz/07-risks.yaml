  - id: partner-financial-and-competitive-risk
    title: Partner, financial, and competitive risk
    body: >-
      Zepz's next leg of product strategy increases dependency risk even as public valuation visibility remains thin.
      On capital, the company clearly retains access to money, but it does not give outsiders a current price anchor: the 2021 raise was public
      at $5 billion, while the 2024 $267 million round was real and IFC-confirmed yet publicly undisclosed on valuation. That means investors cannot
      tell whether the latest round was a clean mark-up, a flat insider-support round, or a structured compromise. The older audited accounts also matter
      more than management might like, because they showed material going-concern uncertainty and sensitivity to covenant breaches in downside cases.
      On competition and pricing, remittance peers are not standing still. Remitly's 10-K explicitly frames the market as highly competitive and scale-driven,
      while Wise is still cutting take rate to win on fees and speed. Zepz's own wallet economics suggest margin pressure rather than relief: opening and
      maintaining the wallet is free, promotional FX and cashback are used to drive behavior, and some monetization is pushed to selective pay-in and withdrawal
      events. The stablecoin stack adds both upside and concentration. TRM handles blockchain intelligence, Fireblocks provides treasury and settlement infrastructure,
      and Sendwave says Circle and Solana sit behind USDC issuance and wallet functionality. That may improve speed and FX transparency, but it also means a product that
      already depends on remittance licenses and payout partners now depends on crypto infrastructure, compliance tooling, and partner contracts that are not public.
      Financially and strategically, Zepz therefore looks less like a simple remittance app and more like a remittance platform trying to widen its stack while public
      evidence on partner substitutability, pricing resilience, and valuation terms remains incomplete.
