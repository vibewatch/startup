  - id: TR005
    title: Mitigation and thesis-break table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Regulatory relapse
        - CFPB, state-regulator, FCA, FINTRAC, or NBB action
        - Any new formal enforcement, consent order, or exam finding tied to disclosures, wallets, or error resolution
        - Immediate thesis break until remediation evidence is produced
      - - Execution strain
        - Headcount announcements, entity closures, or management memos
        - Another restructuring wave affecting more than 10% of staff or closure of another operating entity
        - Downgrade operating-confidence case and revisit service / control resilience
      - - Leadership instability
        - Board announcements and Companies House filings
        - No permanent CEO identified on a credible timetable or another senior-executive departure
        - Pause conviction on multi-year execution plan
      - - Disclosure credibility
        - Management diligence room and KPI bridge requests
        - Users, corridors, and headcount still cannot be reconciled into one dated metric set
        - Treat the model as non-underwriteable until definitions are standardized
      - - Stablecoin control failure
        - Wallet incidents, sanctions/compliance issues, or partner downtime
        - Material wallet-control breach, sanctions failure, or cash-out disruption lasting more than 24 hours
        - Suspend wallet-driven upside and assume higher compliance spend
      - - Pricing compression
        - Peer take-rate / fee moves and Zepz promotion intensity
        - More aggressive cashback / FX subsidy without evidence of offsetting retention or margin gains
        - Haircut margin expectations and extend path-to-profit assumptions
      - - Financing / valuation stress
        - New round, secondary mark, or preference-heavy capital raise
        - Flat or down implied terms versus 2021, or punitive structure that signals weak demand
        - Reassess downside protection, dilution, and exit timing
    notes: These are investment-monitoring triggers, not legal covenants. Each trigger is chosen because it is observable from public sources or a standard diligence request.
