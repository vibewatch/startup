  - id: regulatory-legal-and-compliance-risk
    title: Regulatory, legal, and compliance risk
    body: >-
      Zepz's most concrete adverse risk is the Sendwave enforcement record. The CFPB's October 2023 order did not cite
      a minor paperwork lapse; it said Sendwave misrepresented speed and cost, failed required Regulation E remittance
      disclosures, wrongly required customers to waive rights, and mishandled error-resolution processes. That matters
      because the company's current strategy is not to simplify the product surface but to widen it. Sendwave's own trust
      and regulatory page says the group operates across FinCEN and US state money-transmitter regimes, the FCA in the UK,
      FINTRAC in Canada, and the NBB in Belgium, while its privacy and terms materials make clear that personal-data handling,
      biometric identity checks, jurisdiction-specific customer terms, and transaction-specific fee and FX disclosures all vary
      by product and country. The stablecoin wallet raises that complexity again: the wallet FAQ introduces USDC, Circle,
      Solana, and new transfer/cash-out behaviors, while the privacy notice confirms that Zepz handles biometric and recipient data
      and may share data with partners or public agencies when legally required. The company does publish mitigants — PCI DSS certification,
      audit language, whistleblowing and anti-bribery policies, and state complaint paths — but the public record still does not show
      entity-by-entity regulator confirmations, post-CFPB remediation testing, or the legal-control matrix for wallet disclosures.
      In diligence terms, this is a high-severity but partially mitigated risk: licenses appear broad, yet one documented US consumer-protection
      failure makes any new product-control miss more damaging than it would be for a clean-sheet operator.
    claimRefs:
