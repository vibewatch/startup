  evidenceGaps:
    - type: missing-source
      severity: material
      topic: licensing
      missingEvidence: Direct entity-specific register extracts for the relevant WorldRemit or Sendwave entities across FCA, FinCEN, FINTRAC, and NBB databases.
      whyItMatters: Company disclosures describe the license stack, but underwriting legal-compliance risk requires primary regulator records by entity and status.
      diligencePath: Ask legal or compliance for a current license matrix with legal entity names, registration numbers, renewal dates, and any open regulator issues.
      relatedQuestionRefs: [QR025]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: operational-controls
      missingEvidence: Current fraud-loss, chargeback, outage, and complaint metrics for both the remittance core and Sendwave Wallet.
      whyItMatters: Public sources show a prior CFPB action and repeated restructurings but do not quantify current control quality or operational resilience.
      diligencePath: Request monthly control dashboards covering fraud, chargebacks, service incidents, complaint rates, and post-incident remediation actions.
      relatedQuestionRefs: [QR024]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: organization
      missingEvidence: Current headcount by function, severance costs, retained critical roles, and the permanent-CEO search plan.
      whyItMatters: Repeated layoffs and interim leadership can be survivable, but only if the operating bench and succession plan are strong enough to absorb them.
      diligencePath: Request org charts before and after the 2025 cuts, leadership succession materials, and board minutes covering the CEO search process.
      relatedQuestionRefs: [QR026]
      relatedTableRefs: [TR004]
    - type: private-evidence-only
      severity: material
      topic: partner-dependence
      missingEvidence: Commercial terms, SLAs, substitution plans, and incident history for Fireblocks, TRM, Circle, Solana, and key payout partners.
      whyItMatters: The wallet strategy adds visible vendor concentration, but the public record does not show how quickly Zepz could switch providers or absorb failures.
      diligencePath: Obtain partner contracts or management summaries covering termination rights, fallback providers, service credits, and live-incident playbooks.
      relatedQuestionRefs: [QR027, QR028]
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: Current post-2024 valuation, preference stack, secondary marks, and any structured terms inside the latest financing.
      whyItMatters: Public materials prove new capital but do not show whether the economics improved, stayed flat, or deteriorated versus the 2021 $5 billion mark.
      diligencePath: Request the last financing term sheet, cap table, board valuation materials, and any investor-mark or secondary-transaction history.
      relatedTableRefs: [TR005]
