  title: Risks
summary: >-
  Zepz's risk profile is dominated by a cluster of execution and compliance risks rather than by a single fatal flaw.
  The hardest public adverse facts are the CFPB's 2023 Sendwave order, repeated layoffs in 2022-2025,
  a March 2026 move to interim leadership, and a still-opaque valuation after the 2024 financing round.
  Those issues are now compounded by a stablecoin-wallet push that adds new compliance, vendor, and operational dependencies
  on top of an already complex global remittance licensing stack.
sections:
  - id: severity-ranked-risk-overview
    title: Severity-ranked risk overview
    body: >-
      The right way to frame Zepz's risk profile is not a high-growth remittance company with some noise
      but a scaled remittance incumbent carrying several unresolved execution and control burdens at once.
      The highest-severity residual risks are: first, regulatory and compliance relapse, because Sendwave already
      has a documented CFPB enforcement history and the company is now layering stablecoin functionality on top of
      cross-border remittance promises; second, execution strain, because Zepz has gone through restructuring waves
      in 2022, 2023, and 2025 and then moved to an interim CEO in March 2026; third, disclosure-quality risk,
      because public metrics on users, corridors, countries, and headcount do not reconcile cleanly across official
      and partner materials; fourth, partner concentration inside the stablecoin stack, where Fireblocks, TRM,
      Circle, and Solana become part of a product that also still depends on remittance licenses and payout partners;
      and fifth, valuation opacity, because the company raised again in 2024 without publicly resetting or reaffirming
      the 2021 $5 billion mark. None of these risks independently kills the story, but together they mean the underwriting
      burden has shifted from demand proof to control proof. Investors should treat the business as investable only if
      management can reconcile the operating metrics, show post-CFPB control remediation, and explain why a leaner
      organization can safely run a more complex product portfolio.
    claimRefs:
