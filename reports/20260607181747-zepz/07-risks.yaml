    title: Regulatory / legal risk register
    columns:
      - Rule / license / case
      - Jurisdiction
      - Status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    enumerationScope:
      coverage: partial
      basis: Covers the primary publicly evidenced regulatory and legal exposures across remittance operations, privacy, wallet terms, and the known Sendwave enforcement record as of June 2026; it is not a complete entity-by-entity license inventory.
    rows:
      - - CFPB Sendwave order (deceptive remittance disclosures and Reg E failures)
        - United States (federal)
        - Order issued Oct 2023; historical but still relevant to brand control quality
        - Medium
        - Critical
        - Order required redress, penalty, and future-compliance measures
        - A prior consumer-protection failure increases the cost of any new disclosure or wallet-control miss
        - Request post-order remediation testing, complaint trend data, and 2024-2026 exam findings
      - - Multi-jurisdiction money-transmitter and payment-institution licensing
        - US / UK / Canada / EU
        - Active footprint claimed across FinCEN-state, FCA, FINTRAC, and NBB regimes
        - High
        - Critical
        - Existing licenses, audits, and published disclosures
        - Public materials do not map every entity, renewal, and regulator obligation in one place
        - Obtain a legal-entity/license matrix with renewal calendar and accountable owners
      - - US state complaint and escalation regime
        - United States (state-by-state)
        - Complaint routes and license notices published in multiple states
        - Medium
        - High
        - Customer-support process plus state notice pages
        - Complaint escalation can become a regulatory signal before a formal sanction
        - Review complaint volumes, state inquiries, and unresolved-case aging by jurisdiction
      - - Privacy, biometric data, and cross-border data-sharing obligations
        - Multi-jurisdiction
        - 2026 privacy notice effective; biometric processing and public-agency sharing disclosed
        - Medium
        - High
        - Published privacy notice and processor-sharing disclosures
        - Sensitive identity data and recipient data expand breach and privacy-enforcement exposure
        - Request DPIAs, breach history, processor list, and named privacy governance owner
      - - Transaction-specific fee / FX / jurisdictional-terms complexity
        - Multi-jurisdiction
        - Current terms say local rules, fees, and exchange rates vary by product and country
        - Medium
        - High
        - Jurisdictional terms and per-transaction disclosure model
        - Complexity can recreate disclosure or refund-control errors at scale, especially in wallets
        - Request product-by-country legal signoff matrix for fees, FX, refunds, and wallet disclosures
      - - Modern Slavery Act and partner due-diligence statement
        - United Kingdom / supply chain
        - 2025 statement published in 2026 with policy commitments
        - Low-Medium
        - Medium
        - Whistleblowing, anti-bribery policy, and partner screening are disclosed
        - Policy-level disclosure does not prove operating effectiveness across payout and network partners
        - Review supplier-risk metrics, escalation cases, and annual board reporting packs
    notes: Severity is residual severity after the mitigants visible in public sources. Partial coverage reflects that direct regulator-register confirmations for every entity were not recoverable from public fetched pages.
