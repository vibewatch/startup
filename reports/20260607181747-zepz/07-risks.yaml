callouts:
  - calloutType: risk
    title: The CFPB order makes future compliance misses more expensive
    body: >-
      The 2023 Sendwave order is the strongest single adverse fact in the file because it concerns consumer disclosures,
      error resolution, and core remittance promises. Once a company has that history, investors should assume any new wallet
      or disclosure-control miss will be judged more harshly by regulators and counterparties.
    claimRefs:
      - CR001
      - CR002
      - CR045
  - calloutType: risk
    title: Repeated layoffs plus interim leadership create a real execution overhang
    body: >-
      Zepz is asking the market to trust a leaner, reorganized team to run a broader and more technically complex product set.
      The 2025 IT-heavy layoffs and the March 2026 move to interim leadership make that a central diligence risk, not background noise.
    claimRefs:
      - CR014
      - CR016
      - CR044
  - calloutType: recommendation
    title: Three diligence asks matter most before conviction rises
    body: >-
      Investors should insist on a reconciled KPI bridge, post-CFPB remediation evidence, and partner/fallback detail for Fireblocks,
      TRM, Circle, and Solana. Without those three items, the upside case remains too dependent on management narrative.
    claimRefs:
