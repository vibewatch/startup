  productSummary: WorldRemit and Sendwave let consumers send cross-border remittances digitally via mobile app or web, with payout options including bank deposit, cash pickup, airtime top-up, mobile money, and, increasingly, wallet-based USDC transfers through Sendwave Wallet.
  customerFocus: Diaspora and migrant communities in North America, the UK, Europe, and other sending markets supporting recipients across Africa, Asia, Latin America, and other emerging-market corridors.
  businessModel: Consumer remittance fees, FX spread, and related payout economics across WorldRemit and Sendwave; the company is also testing wallet and stablecoin-led extensions to the core remittance workflow.
