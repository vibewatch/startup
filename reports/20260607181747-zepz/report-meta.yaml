companyProfile:
  summary: Zepz is the London-headquartered remittance group behind WorldRemit and Sendwave. The business grew out of WorldRemit, founded in 2010 by Ismail Ahmed to digitize migrant remittances that had historically relied on high-cost agent networks. WorldRemit completed the Sendwave acquisition in February 2021, rebranded the holding company to Zepz later that year, and raised $292 million at a $5 billion valuation. Public disclosures since then show a broader push from core fiat remittances into wallet and stablecoin products, culminating in the Sendwave Wallet launch in 2025 and related Fireblocks / TRM infrastructure partnerships in 2026. The company is clearly scaled, but current users, corridors, headcount, and audited financial metrics remain inconsistently disclosed.
  foundedDate: '2010-01-01'
