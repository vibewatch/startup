        - Current EBIT, EBITDA, net income, and cash-flow statements for 2025-2026.
        - Request audited P&L plus profitability definitions used externally.
      - - Customer and corridor scale
        - 9m users, 2,000 corridors, 130+ countries on trust page; 9m users and 5,000 corridors on Fireblocks PR.
        - conflicting current descriptors
        - Metric dictionary and consistent scope across brands and documents.
        - Request KPI glossary reconciling users, customers, active senders, and corridors.
      - - Cash, burn, runway, and debt headroom
        - Not publicly disclosed for 2025-2026.
        - unavailable
        - Treasury position, debt maturities, covenant headroom, and runway.
        - Request treasury pack, debt schedule, and covenant certificates.
    notes: This table distinguishes hard historical anchors from current company-claimed or partner-quoted metrics. The main gating issue is not lack of activity but lack of current audited conversion of activity into revenue, margin, and cash.
