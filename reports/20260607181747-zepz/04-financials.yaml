company:
  name: Zepz
chapter:
  number: 4
  title: Financials
summary: >
  Zepz has a real and historically auditable remittance revenue engine, but not a currently auditable one.
  Official 2021 disclosures put combined 2020 revenue at about $338 million on nearly $10 billion of
  gross send volume, while audited 2021 WorldRemit Group accounts showed $399.4 million of revenue,
  $246.8 million of gross profit, and a $150.9 million net loss alongside a going-concern warning despite
  fresh capital. Since then the public record has shifted to company- and partner-claimed profitability and
  transfer-volume milestones, a $267 million 2024 round at undisclosed valuation, and no current audited
  revenue, margin, cash, or runway disclosure.
sections:
  - id: revenue-model-pricing
    title: Revenue model, pricing surfaces, and what is actually public
    body: >
      Zepz monetizes international money movement through a combination of transaction fees, foreign
      exchange spreads, and selective promotional pricing that can either reduce reported revenue or be
      expensed as marketing. The strongest direct accounting disclosure comes from the 2021 WorldRemit
      Group accounts, which state explicitly that revenue is earned from transaction fees and foreign
      exchange spreads and that first-transfer fee waivers or better introductory FX rates are treated as
      reductions to revenue up to the point a customer's cumulative revenue reaches zero. That is important
      because it shows list pricing and realized pricing are not the same thing. Current consumer-facing
      pages reinforce the same structure but do not publish a universal tariff sheet: WorldRemit tells users
      they will see fees and exchange rates upfront at checkout, while its currency converter emphasizes
      live conversion and mid-market reference rates. Sendwave's current wallet surfaces add a newer layer:
      opening and maintaining a wallet is free, some pay-in or withdrawal methods may still carry small
      disclosed fees, and the company promotes better rates, cashback, and USDC-based storage as
      monetization levers that are corridor- and behavior-dependent rather than globally standardized.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI041
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI002
  - id: gtm-sales-efficiency
    title: GTM motion and sales-efficiency proxies are visible, but only indirectly
    body: >
      Public evidence points to a self-serve digital acquisition model rather than an enterprise sales motion
      or an agent-led retail network. WorldRemit's onboarding flow is quote-first and checkout-led, while
      Sendwave's homepage stresses app download, debit-card linking, rapid sign-up, and fast consumer
      transfers. That implies short purchase cycles and consumer marketing dependence rather than field
      sales. The public proxy for how expensive that motion was historically comes from audited 2021
      accounts: marketing and communications expense was $93.7 million against $399.4 million of revenue,
      or about 23.5% of revenue, and headcount grew to 1,766 as the group continued investing in growth.
      That sits near Remitly's 2025 marketing ratio of 21% and far above Wise's 4.4%, suggesting Zepz's
      historical growth model looked much closer to a customer-acquisition-heavy remittance app than to a
      scaled low-cost infrastructure platform. The problem for underwriting is freshness: public sources do
      not disclose current CAC, payback, repeat-send frequency, or retention cohorts, so the most useful
      current GTM facts are structural rather than numerical.
    claimRefs:
      - CI005
      - CI007
      - CI008
      - CI015
      - CI032
      - CI033
      - CI035
      - CI041
    tableRefs:
      - TI003
    figureRefs:
      - FI003
  - id: cost-structure-margin-drivers
    title: Cost structure and gross-margin drivers are clearer historically than they are today
    body: >
      The last detailed audited cost picture comes from 2021 and already shows why Zepz cannot be
      analyzed as a pure software business. Cost of revenue was $152.6 million on $399.4 million of revenue,
      leaving $246.8 million of gross profit and an estimated 61.8% gross margin. Below gross profit, the
      cost stack was heavy: administrative expenses were $338.1 million, including $113.1 million of employee
      expense, $93.7 million of marketing and communications, $26.9 million of IT costs, and $12.5 million
      of chargeback and other losses. The accounts also flag transaction-processing fees as a pricing risk,
      meaning margin is exposed not only to customer pricing but to network economics and payout rails.
      Peer disclosures help explain the likely shape of those drivers even though they do not substitute for
      current Zepz numbers. Remitly says transaction expense ran at 34% of revenue in 2025, while Wise
      reported cost of sales of roughly 27% of revenue; Zepz's disclosed 2021 direct-cost ratio was higher at
      about 38.2%. That does not prove current underperformance, but it does show why payout mix,
      funding method, chargebacks, fraud controls, and FX management matter as much as listed transfer
      fees when judging margin quality.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI031
      - CI032
      - CI033
      - CI036
      - CI044
    tableRefs:
      - TI004
    figureRefs:
      - FI001
  - id: public-traction-vs-private-gaps
    title: Public traction signals are meaningful, but current financial traction is still mostly a gap
    body: >
      Zepz is not financially opaque because nothing is public; it is opaque because the public record is
      uneven across scope, time, and audit status. On the hard-anchor side, the 2021 Series E release said
      the brands generated almost $10 billion of gross send volume and $338 million of revenue in 2020,
      while audited 2021 group accounts disclosed $399.4 million of revenue. Official 2023 material then
      said the group achieved operating profitability in H1 2022 and had helped customers send over $15
      billion in 2022. By 2026, partner materials claimed more than $17 billion transferred in 2025 and more
      than 9 million customers or users. The issue is not that these claims are directionally implausible; it is
      that they are not currently reconcilable into an audited present-day revenue, margin, or cash-flow view.
      Companies House shows 2024 accounts have been filed and 2025 accounts are not due until late
      September 2026. That leaves investors with historical audited statements, current marketing claims,
      and partner statistics, but no audited bridge between them. Even basic scale descriptors drift across
      sources, including 2,000 versus 5,000 corridors and 9 million versus 11 million users.
    claimRefs:
