  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-revenue-margin
      missingEvidence: Audited 2025 consolidated revenue, cost of revenue, gross margin, operating expense, EBITDA, and cash-flow statements.
      whyItMatters: These are the minimum facts required to test whether the 2022 profitability story persisted through the 2024 raise and 2025 wallet expansion.
      diligencePath: Request the FY2025 audited financial statements, management bridge to 2026 YTD, and board-approved KPI pack.
      relatedQuestionRefs:
        - QI020
        - QI021
        - QI022
    - type: private-evidence-only
      severity: material
      topic: cash-runway
      missingEvidence: Current cash balance, debt maturities, covenant headroom, undrawn facilities, and monthly burn or cash generation.
      whyItMatters: Capital adequacy and financing dependency cannot be quantified from public information alone.
      diligencePath: Request the treasury pack, debt schedule, covenant certificates, and rolling 12-month liquidity forecast.
      relatedQuestionRefs:
        - QI018
        - QI019
        - QI020
    - type: private-evidence-only
      severity: material
      topic: realized-pricing
      missingEvidence: Corridor-level fee cards, realized FX spread, payout mix, promo incidence, and repeat-send economics by brand.
      whyItMatters: These inputs determine take rate, gross margin, and CAC payback, which are central to underwriting.
      diligencePath: Request corridor P&Ls, pricing exports, and cohort retention / frequency tables by acquisition channel.
      relatedQuestionRefs:
        - QI003
        - QI006
        - QI022
    - type: conflicting-data
      severity: material
      topic: metric-scope-reconciliation
      missingEvidence: A company-approved bridge reconciling 2020 revenue scope, 9 million versus 11 million users, and 2,000 versus 5,000 corridors.
      whyItMatters: Public scale claims cannot be compared across time or mapped cleanly into peer benchmarks until the scope is standardized.
      diligencePath: Request a metric glossary and historical restatement table from finance or investor relations.
      relatedQuestionRefs:
        - QI013
        - QI015
        - QI025
