    rows:
      - - Core remittance transaction fees
        - Corridor-specific fixed or variable fees shown at checkout before transfer confirmation.
        - Publicly visible at quote level; no universal rate card published.
        - medium
        - Realized blended fee rate by corridor and brand is undisclosed.
        - Export corridor fee cards and net realized fee yield by major route.
      - - Foreign exchange spreads
        - Revenue earned between customer FX rate and currency-purchase rate.
        - Explicitly identified in audited accounts and peer filings.
        - high
        - Current realized FX spread by corridor is private.
        - Provide corridor-level spread bridge net of hedging and promotions.
      - - Introductory promotions
        - Waived first-transfer fees or better introductory FX rates reduce revenue; excess incentive spend books to marketing.
        - Explicit accounting policy in audited 2021 accounts.
        - high
        - No current disclosure of promo mix or payback.
        - Provide promo incidence, repeat-rate uplift, and payback by cohort.
      - - Sendwave wallet pay-in / withdrawal fees
        - Wallet opening and maintenance are free, but some pay-in and withdrawal methods may carry small fees disclosed before confirmation.
        - Customer-facing FAQ confirms selective fee model.
        - medium
        - No disclosure of revenue contribution from wallet-fee events.
        - Break out wallet fee revenue and attach rate by market.
      - - Wallet incentives and better-rate offers
        - Better exchange rates or cashback in select markets may monetize by retention and spread rather than explicit wallet subscription fees.
        - Publicly marketed, but economically unspecified.
        - low
        - No disclosed net economics from cashback or better-rate campaigns.
        - Provide campaign economics, subsidy budget, and repeat-use uplift.
      - - Other financial-services revenue
        - Public sources do not establish a material non-remittance revenue line beyond wallet-related functionality.
        - Effectively unavailable.
        - low
        - No current segment mix across remittance, wallet, or adjacent services.
        - Provide segment revenue mix for remittance, wallet, and any other products.
    notes: Official consumer pages and audited 2021 accounts establish the revenue mechanisms, but not a current segment mix. Current pricing is quote-based and corridor-specific rather than disclosed in a static public tariff sheet.
