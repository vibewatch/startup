    rows:
      - - WorldRemit transfer checkout
        - Fees and exchange rate shown upfront before payment.
        - List pricing visible per quote; realized net yield unavailable.
        - Public evidence supports transparent checkout pricing, not a universal published tariff.
        - SI003
      - - WorldRemit currency converter
        - Live conversion with mid-market reference for over 140 currencies.
        - Reference tool, not necessarily the final transacted price.
        - Useful for FX context; insufficient for realized revenue or spread analysis.
        - SI004
      - - WorldRemit introductory promotions
        - First-transfer fee waivers and better FX rates may be offered.
        - Explicitly not equal to realized pricing because they reduce revenue or book as marketing.
        - Promotions are economically important and visible in accounting policy.
        - SI006
      - - Sendwave standard remittance
        - Marketing emphasizes low service fees rather than a single static fee card.
        - List pricing largely quote-based.
        - Suggests price-led acquisition strategy but not measurable current take rate.
        - SI007
      - - Sendwave Wallet for US senders
        - Opening and maintenance are free; some withdrawal or pay-in methods may have small fees; better rates or cashback may apply in select markets.
        - List promises visible; realized economics not disclosed.
        - Wallet monetization is partly incentive- and behavior-driven, not subscription-driven.
        - SI007/SI008
      - - Recipient wallet / USDC hold
        - 1 digital dollar equals 1 USD until conversion; user chooses when to cash out.
        - FX timing option is public, realized revenue share is not.
        - The product may improve retention and FX-margin capture without publishing a separate wallet ARPU.
        - SI008/SI009
    notes: This table separates customer-facing list statements from realized economics. Official pricing visibility exists mainly at the quote or FAQ level rather than in a downloadable public rate card, so revenue realization remains a diligence question.
