  - id: TI004
    title: Cost structure and gross-margin drivers
    columns:
      - Driver
      - Public evidence
      - Financial effect
      - Public anchor
      - Diligence ask
    rows:
      - - Payment processing and payout-network costs
        - Audited accounts identify cost of revenue and warn that higher transaction-processing fees could hurt profitability.
        - Direct hit to gross margin.
        - 2021 cost of revenue $152.6m; pricing-risk disclosure in accounts.
        - Provide payer-method and payout-method cost stack by corridor.
      - - FX management and hedging
        - Revenue depends partly on FX spreads; derivatives and FX losses also appeared in 2021 accounts.
        - Affects both revenue capture and below-gross-profit volatility.
        - 2021 fair-value loss on derivatives $12.3m; foreign-exchange losses also disclosed.
        - Provide hedging policy, net FX revenue, and corridor exposure concentrations.
      - - Chargebacks, fraud, and transaction losses
        - Chargeback and other losses were a disclosed expense category; Remitly also separately reports transaction-loss provisions.
        - Raises direct transaction cost and loss volatility.
        - Zepz 2021 chargeback and other losses $12.5m; Remitly 2025 transaction-loss provision increased.
        - Provide fraud-loss rate and chargeback rate by funding method.
      - - Customer promotions and rate subsidies
        - Introductory fee waivers and better FX rates reduce revenue before they show up as marketing.
        - Lowers realized take rate even when list pricing looks attractive.
        - Explicit revenue-recognition policy in audited accounts.
        - Provide promo share of volume and post-promo retention.
      - - Marketing and communications
        - Historically the largest disclosed opex line after people expense.
        - Major lever on EBITDA and cash burn.
        - $93.7m in 2021, about 23.5% of revenue.
        - Provide current spend by performance, brand, referral, and retention channel.
      - - People, IT, compliance, and support
        - Employee expense, IT, customer service, and compliance are embedded in administrative costs and product risk controls.
        - Necessary to scale safely but can delay breakeven.
        - Employee expense $113.1m and IT $26.9m in 2021; peer support costs remain material.
        - Provide org cost by product, compliance, fraud, support, and engineering.
    notes: The best detailed public cost stack is the 2021 audited filing. Later sources discuss profitability and layoffs, but not a refreshed cost bridge, so current margin drivers must be inferred from older audited accounts plus public peers.
