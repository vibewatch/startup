      - TI005
    figureRefs: []
  - id: capital-adequacy-funding-dependence
    title: Capital adequacy and financing dependence remain central diligence issues
    body: >
      The strongest public evidence on capital adequacy is historical and cautionary. Audited 2021 accounts
      show that after completing Series E, Zepz had raised $259.0 million net of fees plus a $25.0 million
      loan, ended the year with $116.1 million of cash and $346.2 million of equity, and still carried a material
      uncertainty related to going concern. Auditor language was specific: downside scenarios breached
      revenue covenants within twelve months, the $70 million revolving facility with Silicon Valley Bank
      needed extension, and management could need covenant waivers, additional financing, or new working
      capital facilities. That matters because the later public story shifts to profitability claims without
      replacing the financing analysis with fresh audited numbers. The 2024 round added another $267
      million, with IFC disclosing a $20 million participation and independent coverage saying proceeds would
      fund new markets and wallet expansion while valuation went undisclosed. Current public sources do not
      disclose cash on hand, debt maturities, covenant headroom, or runway. The safest conclusion is that
      Zepz has repeatedly demonstrated access to capital, but public evidence still supports a financing-
      dependent business rather than a transparently self-funding one.
    claimRefs:
      - CI014
      - CI016
      - CI017
      - CI024
      - CI025
      - CI026
      - CI027
      - CI028
      - CI037
      - CI042
      - CI043
    tableRefs:
      - TI006
    figureRefs:
      - FI004
  - id: financial-verdict
    title: Financial verdict
    body: >
      Zepz's financial verdict is therefore mixed but not ambiguous. The positive side is real: the business has
      historically generated hundreds of millions of dollars of revenue, gross margins that were meaningful at
      the last detailed audited checkpoint, enough scale to attract repeat equity capital, and a product model
      that clearly monetizes through fees, FX spread, and increasingly wallet-linked economics. The negative
      side is equally real: public disclosures do not establish current audited revenue, current gross margin,
      current cash generation, or current runway; the 2021 audited file still showed heavy marketing and
      operating losses plus going-concern sensitivity; and the 2024 financing round arrived without a public
      valuation reset. Partner materials citing $17 billion transferred in 2025 and cash-flow or profitability
      narratives are useful directional datapoints, but they are not substitutes for audited statements. For an
      investor or lender, the right underwriting stance is that Zepz is financially credible enough to warrant
      diligence, but not transparent enough to underwrite on public materials alone. Any conviction on margin
      path or capital adequacy still depends on management-only evidence covering 2025-2026 revenue,
      cost structure, liquidity, debt terms, and cohort economics.
    claimRefs:
      - CI011
      - CI013
      - CI018
      - CI024
      - CI027
      - CI037
      - CI042
      - CI043
      - CI045
    tableRefs: []
    figureRefs: []
