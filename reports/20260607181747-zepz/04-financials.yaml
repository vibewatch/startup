      - Diligence ask
    rows:
      - - Series E equity and debt proceeds in audited accounts
        - $259.0m net equity proceeds plus $25.0m loan disclosed in 2021 accounts
        - '2021'
        - Capital support included both equity and debt even before later rounds.
        - Reconcile all post-2021 equity and debt movements into a current cap-table and debt schedule.
      - - Cash and restricted cash
        - $116.1m cash and cash equivalents plus $17.7m restricted cash
        - '2021-12-31'
        - Historically meaningful liquidity buffer, but not a current liquidity view.
        - Provide 2025 year-end and latest month-end cash balances.
      - - Auditor going-concern language
        - Material uncertainty; downside scenarios breached revenue covenants within twelve months.
        - 2021 accounts
        - Historical evidence that external funding and waivers mattered even after a large raise.
        - Provide current covenant package and downside sensitivities.
      - - Working-capital / debt facility dependence
        - $70m revolving credit facility with SVB required extension beyond October 2022.
        - 2021 accounts
        - Indicates operating liquidity was supported by facilities, not just equity.
        - Provide successor facilities, maturity dates, and undrawn headroom.
      - - 2024 equity round
        - $267m raised; IFC disclosed a $20m investment; valuation undisclosed.
        - '2024'
        - Confirms continued market access but also continuing funding need and valuation opacity.
        - Provide post-money cap table and internal valuation memo.
      - - Current runway
        - Publicly unavailable
        - '2025-2026'
        - No defendable runway estimate can be made from public materials.
        - Provide cash burn / cash generation by month and planned use-of-funds by product and geography.
    notes: Capital adequacy is analyzable historically but not currently. The public record shows repeated access to capital and a historical going-concern warning, yet does not disclose present cash, debt, or runway.
