company:
  name: "Lighter"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Lighter competes most directly with Hyperliquid and dYdX for professional
    order-book flow, while GMX, Vertex, Drift, centralized exchanges, and
    internal multi-venue routing remain credible alternatives. Its strongest
    differentiation is verifiable matching on an Ethereum-settled zk-rollup,
    but current evidence also shows a material scale gap to Hyperliquid,
    sequencer and outage risk, and significant dependence on distribution
    partners.
sections:
  - id: "competitive-set"
    title: "The competitive set is broader than perp DEX peers"
    body: >-
      Hyperliquid is the closest direct benchmark because both venues target
      high-frequency, order-book perpetuals users, but the architectures differ:
      Hyperliquid runs a purpose-built Layer 1 while Lighter publishes rollup
      data and validity proofs to Ethereum. dYdX is another direct order-book
      peer, while GMX offers a pooled-liquidity AMM model and Vertex combines
      off-chain matching with on-chain settlement. Drift supplies a Solana-based
      alternative, centralized exchanges remain the incumbent status quo, and
      sophisticated desks can build internal routers across several venues.
      Public evidence is much stronger for product features and list fees than
      for competitor funding, institutional share, or the cost of an internal
      build, so those fields remain explicitly unknown rather than estimated.
    claimRefs: ["CP003", "CP005", "CP006", "CP007", "CP008", "CP013", "CP014"]
    tableRefs: ["TP001"]
  - id: "capability-and-positioning"
    title: "Verifiability differentiates Lighter, but scale and control remain trade-offs"
    body: >-
      Lighter's defensible claim is narrower than “better exchange”: retained
      sources consistently describe an application-specific zk-rollup that
      proves matching and liquidation rules while settling to Ethereum. That
      architecture separates it from Hyperliquid's monolithic Layer 1 and from
      AMM-style venues such as GMX. The differentiation does not remove operating
      control, however. A critical account of the October 2025 disruption ties
      multi-hour unavailability to a single sequencer and database upgrade, and
      the retained evidence does not establish redundant production sequencing.
      Scale also favors Hyperliquid: one October 2026 review reported roughly
      $206 billion of 30-day volume and $7.7 billion of open interest for
      Hyperliquid versus about $59 billion and $0.8 billion for Lighter. Those
      point-in-time figures are not durable market-share estimates.
    claimRefs: ["CP001", "CP003", "CP004", "CP010", "CP011"]
    tableRefs: ["TP002"]
    figureRefs: ["FP001"]
  - id: "pricing-and-distribution"
    title: "Free retail execution shifts competition to latency, APIs, and distribution"
    body: >-
      Lighter's Standard account removes maker and taker fees, while paid
      Premium and Plus tiers monetize lower latency and greater API capacity.
      Rival list pricing remains low rather than free: the retained comparison
      lists Hyperliquid at 0.015% maker and 0.045% taker, dYdX at 0.01% and
      0.05%, GMX at roughly 0.1% under its AMM model, and Vertex at 0% and
      0.02%. These are publisher-reported schedules, not realized institutional
      rates, and they omit rebates, funding, slippage, bridge costs, and bespoke
      agreements. Distribution can outweigh nominal fees. A current review says
      Robinhood uses Lighter for one non-US deployment but selected Bitstamp for
      a US perpetuals launch, demonstrating that a wallet partner can choose
      different suppliers by market.
    claimRefs: ["CP002", "CP006", "CP007", "CP008", "CP015"]
    tableRefs: ["TP003"]
  - id: "durability-and-diligence"
    title: "Moat durability depends on reliability, partner access, and regulatory execution"
    body: >-
      Cryptographic verification is technically meaningful, but competitors can
      still displace Lighter through deeper liquidity, broader distribution,
      reliable operations, or regulatory access. Hyperliquid's reported volume
      and open-interest lead gives it a liquidity advantage, while Lighter's
      partner-led expansion creates concentration risk when distributors can
      route flow elsewhere. Regulatory posture is also a market-access variable,
      not merely a compliance footnote: a CFTC enforcement release states that
      smart-contract delivery did not exempt DeFi operators offering leveraged
      digital-asset transactions from registration requirements. That action did
      not concern Lighter and does not establish a violation by Lighter, but it
      is relevant precedent for every unregistered US-facing derivatives model.
      The investment case therefore requires production uptime evidence,
      customer and maker concentration, realized pricing, API switching costs,
      and jurisdiction-specific legal analysis before treating the zk design as
      a durable commercial moat.
    claimRefs: ["CP004", "CP011", "CP012", "CP015"]
