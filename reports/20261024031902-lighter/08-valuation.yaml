      - [Confidence, "Medium", "Latest financing is corroborated, but core private-company inputs are missing"]
      - [Risk rating, "High", "Operational, regulatory, monetization, competition, and security-structure risks remain material"]
      - [Valuation stance, "Stretched / unproven", "Do not pay a premium to the reported $1.5B mark without verified denominators and terms"]
    notes: "Analyst synthesis from public reporting; the financing mark is reported, not an independently audited fair value."
    claimRefs: [CV001, CV002, CV010, CV011, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Public evidence, What would change the view]
    rows:
      - [Thesis, "Product reach can support monetization", "Secondary sources report large volume, TVL, user, and market counts", "Reconciled fee-paying cohorts and audited net revenue"]
      - [Thesis, "Verifiable execution can differentiate the venue", "Lighterpedia describes a verifiable ZK order book across 219 markets", "Independent reliability, retention, and execution-quality data"]
      - [Anti-thesis, "Headline activity may not translate into durable economics", "Standard trading is described as zero-fee while paid API and premium products carry the monetization burden", "Gross margin and contribution profit after incentives and liquidity costs"]
      - [Anti-thesis, "Operational fragility can destroy trust and value", "AInvest reports a single-sequencer bottleneck, multi-hour outages, and estimated user losses", "Independent postmortem, remediation evidence, and tested redundancy"]
    notes: "Metrics come from different secondary sources, dates, and denominators; they are not aggregated or treated as audited."
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Audited paid revenue scales, retention is durable, and reliability and regulation are de-risked", "A premium to the $1.5B reference is considered only if entry math clears the investor's return hurdle", "Execution, competitive response, and security dilution", "Possible but unsupported by current public denominators"]
      - [Base, "Product traction persists while economics and capitalization remain partly private", "Treat $1.5B as a ceiling reference pending verified revenue, preferences, and dilution", "Slow monetization, incentive dependence, and multiple compression", "Most consistent with the mixed current evidence"]
      - [Bear, "Paid monetization disappoints, outages recur, share shifts to rivals, or regulation restricts products", "Require a material discount or decline because a defensible absolute downside range is unavailable", "Customer losses, enforcement, liquidity flight, and token-linked dilution", "Material downside indicators are already present"]
    notes: "Qualitative decision cases, not probability estimates or fair-value forecasts; token FDV and private-company equity value are not treated as interchangeable."
    claimRefs: [CV010, CV011, CV012, CV013, CV014, CV015, CV016]
