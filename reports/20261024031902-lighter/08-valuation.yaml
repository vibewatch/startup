company:
  name: Lighter
chapter:
  number: 8
  title: Valuation
  summary: Public reporting corroborates a $68 million financing at an approximately $1.5 billion valuation and shows substantial product activity, but it does not provide the audited economics, capitalization terms, or operational assurance needed to underwrite that price. The resulting stance is research-more, with no premium to the reported financing mark until the missing denominators and downside protections are verified.
sections:
  - id: recommendation-and-entry
    title: Recommendation and entry discipline
    body: >-
      Lighter merits continued diligence rather than a buy recommendation. Four independent reports
      converge on a $68 million financing and an approximately $1.5 billion valuation, establishing a
      credible market signal but not a verified fair value. The founder reportedly confirmed that the
      financing included equity and token warrants while declining to confirm the valuation, so the
      headline does not reveal ownership, dilution, preference seniority, or the allocation of value
      between securities. Product activity and a founder claim of profitability strengthen the thesis,
      but neither substitutes for audited revenue quality. A critical third-party account of the
      October 2025 crash adds operational downside that must be resolved before entry. The appropriate
      decision is research-more, with high risk and medium confidence: do not pay a premium to the
      reported mark without verified economics, financing terms, and incident remediation.
    claimRefs: [CV001, CV002, CV008, CV010, CV011, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-economics
    title: Financing context, traction, and monetization
    body: >-
      The financing record is internally inconsistent beyond the latest round. SetterVC estimates
      $100 million raised across three rounds and explicitly warns that its company and valuation data
      may be incomplete or revised; Tapbit instead states $80 million of total funding. That conflict
      prevents a reliable cumulative-funding or cash-available conclusion. Operating indicators are
      also substantial but secondary: Coin360 reports $279.5 billion of 30-day trading volume and
      $1.15 billion of TVL, Gate reports 188,000 users and $1.37 billion of TVL after private testing,
      and Lighterpedia reports 219 active markets. These metrics have different dates and denominators
      and should not be combined into a funnel or revenue proxy. Public descriptions pair zero-fee
      standard trading with institutional API or premium monetization, while the founder has claimed
      profitability. Audited net revenue, incentive expense, gross margin, retention, and cohort
      concentration remain necessary before applying any valuation multiple.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV009]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenarios and comparable context
    body: >-
      Public evidence supports scenario discipline, not a precise equity range. VanEck presents
      Hyperliquid as the scaled benchmark, reporting $633 billion of Q1 2026 trading volume,
      approximately 32% of on-chain perpetuals volume, and a $626 million annualized protocol-revenue
      run rate as of April 2026. Those figures are useful operating reference points, but VanEck was
      promoting a Hyperliquid-linked product and the benchmark is a token/protocol exposure rather
      than a like-for-like private-company security. The Block's report of $1.2 trillion in October
      2025 on-chain perpetuals volume supports the category opportunity. Gate's published LIT fully
      diluted valuation scenarios cannot be substituted for Lighter's equity valuation because the
      instruments and claims on value differ. The bull, base, and bear cases therefore use observable
      diligence conditions, with the reported $1.5 billion financing mark as a reference rather than
      an asserted fair value.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and thesis-break conditions
    body: >-
      The reviewed public sources do not establish exit readiness, a target return, or a realizable
      secondary price. A private financing mark can support future fundraising optionality, but the
      mixed equity-and-token-warrant structure makes proceeds allocation and investor seniority
      essential to return analysis. Before investment, diligence should obtain audited monthly
      financials, a fully diluted cap table and preference waterfall, fee-paying customer cohorts,
      jurisdiction-specific regulatory advice, and incident records covering uptime, liquidations,
      customer losses, and remediation. The thesis breaks if activity proves predominantly
      incentive-driven, if paid monetization cannot support infrastructure and liquidity costs, if a
      material outage leaves customer losses unresolved, or if regulation blocks core products or
      distribution. The view would improve only with repeatable net revenue, durable retention,
      verified controls, and entry terms that provide downside protection.
    claimRefs: [CV002, CV008, CV009, CV010, CV011, CV016]
