schemaVersion: "report-v2"
artifact: risks
slug: lighter
runDate: 2026-10-24
company:
  name: Lighter
chapter:
  number: 7
  title: Risks
  summary: Lighter's principal risks are concentrated in regulatory perimeter, leveraged-market mechanics, proving and sequencer operations, and the economics of a zero-fee venue. Public evidence shows meaningful controls such as verifiable execution, non-custody, and forced-withdrawal paths, but it does not establish resilience, legal clearance, or durable post-incentive demand.
sections:
  - id: ranked-risk-profile
    title: Ranked risk profile
    body: >-
      The highest-consequence risk is a leveraged-market failure in which oracle
      disruption, thin liquidity, or delayed sequencing leaves traders unable to
      reduce exposure while liquidations accelerate. The next tier is technical:
      zero-knowledge proving, verifier contracts, smart contracts, and the
      sequencing path add components whose failure can affect both execution and
      withdrawals. Regulatory exposure is also material because the venue offers
      perpetual derivatives and cross-border access, while the precise legal
      status of products and token activity is not established by the public
      record reviewed here. Finally, the zero-fee model and incentive history
      create a business-model risk: volume can be high while revenue quality,
      liquidity depth, and post-incentive retention remain uncertain. These risks
      should be monitored as linked failure modes rather than as independent
      checklist items.
    claimRefs: [CR001, CR002, CR003, CR004]
    figureRefs: [FR001]
  - id: regulatory-legal-exposure
    title: Regulatory and legal exposure
    body: >-
      Lighter operates in a policy environment that is becoming more explicit,
      not risk-free. The SEC states that its March 17, 2026 interpretation
      clarifies how federal securities laws apply to certain crypto assets and
      transactions, including airdrops, protocol mining, staking, and wrapping.
      IOSCO's DeFi recommendations separately emphasize market integrity,
      investor protection, responsible-person identification, conflicts,
      operational and technology risk, disclosures, enforcement, and
      cross-border cooperation. Those documents are not a legal conclusion about
      Lighter, but they define the questions that an outside counsel review must
      answer for perpetuals, collateral, token incentives, pre-IPO or RWA
      markets, geographic restrictions, and any reliance on decentralization
      claims. The absence of a public enforcement action in this source pool is
      not evidence that the products are cleared.
    claimRefs: [CR005, CR006, CR007]
    tableRefs: [TR001]
  - id: operational-and-market-structure
    title: Operational, technical, and market-structure risk
    body: >-
      Lighter's architecture reduces one class of execution discretion but does
      not remove availability, oracle, liquidity, or software risk. The reviewed
      material describes off-chain matching with on-chain proof verification,
      and it explicitly distinguishes proving that an accepted order followed
      the rules from guaranteeing prompt sequencing or venue availability.
      A proof therefore cannot prevent downtime, a thin book, oracle disruption,
      or a smart-contract and proving-system defect. Leverage up to 50x,
      depending on market, increases the speed at which a data or liquidity
      problem can become a customer-loss event. The public evidence also reports
      a large decline from an incentive-era volume peak to a lower current
      volume level, which makes liquidity under stressed conditions and the
      durability of demand important diligence items rather than settled facts.
    claimRefs: [CR008, CR009, CR010, CR011]
    tableRefs: [TR002]
  - id: mitigations-and-kill-criteria
    title: Mitigations, monitoring, and thesis-break triggers
    body: >-
      Publicly described mitigations include zero-knowledge proofs for matching
      and liquidations, an escape or forced-withdrawal path, self-custody, and
      isolated-margin and stop-loss practices. These controls are useful but
      incomplete: they do not independently verify uptime, oracle quality,
      market depth, code audit remediation, legal permissions, or sustainable
      revenue. The practical monitoring plan is therefore quantitative. Track
      forced withdrawals and withdrawal latency, proof failures, sequencer
      liveness, oracle deviations, liquidation losses, bid-ask depth at stress
      intervals, concentrated collateral, fee and funding economics, and volume
      after points or token incentives. A thesis-break event would be a material
      outage during a volatile market, a verified loss of collateral or
      liquidation integrity, a regulator or court action restricting the core
      product, or sustained post-incentive liquidity and revenue deterioration.
      Until those indicators are disclosed and tested, residual exposure remains
      high.
    claimRefs: [CR012, CR013, CR014]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or issue, Jurisdiction, Public status, Likelihood, Severity, Mitigation or diligence path, Residual exposure]
    rows:
      - ["Application of federal securities laws to crypto transactions", United States, "SEC interpretation issued 2026-03-17; application to Lighter not determined", Medium, Critical, "Obtain outside-counsel analysis for perpetuals, collateral, token incentives, and product structure", High]
      - ["DeFi responsible-person and market-integrity expectations", Cross-border IOSCO member jurisdictions, "IOSCO recommendations published in December 2023", Medium, High, "Map responsible persons, conflicts, disclosures, surveillance, and enforcement posture", High]
      - ["Cross-border derivatives, RWA, and pre-IPO market permissions", Multiple jurisdictions, "Product-specific clearance not established by the assigned evidence", Medium, Critical, "Complete jurisdiction-by-jurisdiction licensing, marketing, sanctions, and market-integrity review", High]
    enumerationScope:
      coverage: partial
      basis: "Public regulatory materials and assigned product descriptions reviewed through 2026-10-24; not a complete jurisdictional legal inventory."
    notes: "Rows identify diligence questions and analyst-assessed likelihood and severity, not findings that Lighter violated a rule. No public enforcement action was treated as evidence of compliance."
    claimRefs: [CR005, CR006, CR007]
  - id: TR002
    title: Operational, quality, and dependency risk register
    columns: [Failure mode, Dependency or counterparty, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Delayed or unavailable order sequencing, Sequencer and matching path, Medium, Critical, Partial, High, "Need independent uptime, incident, and recovery-time history"]
      - [Incorrect or unavailable liquidation reference price, Oracle and market-data feeds, Medium, Critical, Unverified, High, "Need oracle design, fallbacks, deviation limits, and incident records"]
      - ["Prover, verifier, or circuit defect", ZK proving system and verifier contracts, Medium, Critical, Unverified, High, "Need current audits, remediation evidence, and production failure history"]
      - [Liquidity withdrawal or thin-book slippage, Market makers and active traders, Medium, High, Partial, Medium-high, "Need stress-depth, concentration, and post-incentive retention data"]
    notes: "The register separates a protocol dependency from a proven incident. A missing public incident record is an evidence gap, not proof that no incident occurred."
    claimRefs: [CR008, CR009, CR010, CR011, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or layer, Role, Concentration evidence, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Order acceptance and sequencing, "Operator-controlled matching and sequencing path", "Accept and sequence orders before proof-backed settlement", "Public redundancy and control-rights evidence is not established", "Orders cannot be entered or closed during volatility", Critical, "Verify failover, forced-withdrawal, and recovery procedures", High]
      - [Settlement and proving, "Ethereum plus Lighter's prover and verifier stack", "Validate and settle state transitions", "The architecture concentrates execution assurance in a specialized proving stack", "Proof or verifier failure delays finality or blocks state updates", Critical, "Review audits, remediation, proof monitoring, and emergency controls", High]
      - [Pricing and liquidity, "Oracle providers and market makers", "Supply reference prices and executable depth", "Provider identities, fallback design, and stress concentration are not established", "Price error or withdrawn liquidity amplifies liquidation losses", Critical, "Test oracle deviation limits, fallback feeds, and stressed book depth", High]
      - [Demand and monetization, "Traders, liquidity providers, and incentive programs", "Create volume, depth, and revenue opportunities", "Public evidence indicates incentive-sensitive activity but not durable cohort economics", "Post-incentive activity falls below a viable liquidity and revenue base", High, "Obtain incentive-adjusted cohorts, revenue mix, and counterparty concentration", High]
    notes: "Concentration and residual-exposure cells are analyst assessments from the assigned public evidence; undisclosed provider identities or controls are recorded as gaps, not assumed facts."
    claimRefs: [CR002, CR003, CR008, CR009, CR010, CR012, CR014]
figures:
  - id: FR001
    title: Risk heatmap and residual exposure
    type: matrix
    summary: Residual exposure remains highest where leverage, availability, regulatory uncertainty, and incentive-dependent economics interact.
    data:
      columns: [Impact, Likelihood, Mitigation maturity, Residual severity, Trigger]
      rows:
        - label: Liquidation and oracle stress
          values: [Critical, High, Partial, High, "Oracle deviation or inability to close"]
        - label: Sequencer and withdrawal liveness
          values: [Critical, Medium, Partial, High, "Downtime or forced-withdrawal delay"]
        - label: ZK and smart-contract defect
          values: [Critical, Medium, Early, High, "Proof, verifier, or audit-remediation failure"]
        - label: Regulatory perimeter
          values: [Critical, Medium, Early, High, "Restriction, action, or counsel red flag"]
        - label: Incentive-driven volume
          values: [High, High, Partial, High, "Post-incentive liquidity or revenue decline"]
        - label: Market depth and collateral concentration
          values: [High, Medium, Partial, Medium-high, "Stress spread or concentration breach"]
    claimRefs: [CR001, CR005, CR008, CR010, CR011, CR012]
callouts:
  - calloutType: risk
    title: Thesis-break trigger
    body: A material outage or collateral loss during market stress, a regulator or court action restricting the core product, or sustained post-incentive deterioration in liquidity and revenue would break the current diligence thesis.
    claimRefs: [CR012, CR014]
  - calloutType: insight
    title: Proof is not availability
    body: Verifiable matching can constrain execution after acceptance, but it does not by itself guarantee prompt sequencing, oracle integrity, market depth, or uptime.
    claimRefs: [CR008, CR009]
