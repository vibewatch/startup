      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Product access is better evidenced than customer durability
            body: >-
              Lighter has public evidence for trading activity, fee tiers, and a named wallet distribution route. It
              does not have public evidence sufficient to underwrite unique-customer growth, retention, or
