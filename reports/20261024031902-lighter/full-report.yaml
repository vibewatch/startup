  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile
        blocks:
          - type: paragraph
            body: >-
              The highest-consequence risk is a leveraged-market failure in which oracle disruption, thin liquidity, or
              delayed sequencing leaves traders unable to reduce exposure while liquidations accelerate. The next tier
              is technical: zero-knowledge proving, verifier contracts, smart contracts, and the sequencing path add
              components whose failure can affect both execution and withdrawals. Regulatory exposure is also material
              because the venue offers perpetual derivatives and cross-border access, while the precise legal status of
              products and token activity is not established by the public record reviewed here. Finally, the zero-fee
              model and incentive history create a business-model risk: volume can be high while revenue quality,
              liquidity depth, and post-incentive retention remain uncertain. These risks should be monitored as linked
              failure modes rather than as independent checklist items.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Lighter operates in a policy environment that is becoming more explicit, not risk-free. The SEC states
              that its March 17, 2026 interpretation clarifies how federal securities laws apply to certain crypto
              assets and transactions, including airdrops, protocol mining, staking, and wrapping. IOSCO's DeFi
              recommendations separately emphasize market integrity, investor protection, responsible-person
              identification, conflicts, operational and technology risk, disclosures, enforcement, and cross-border
              cooperation. Those documents are not a legal conclusion about Lighter, but they define the questions that
              an outside counsel review must answer for perpetuals, collateral, token incentives, pre-IPO or RWA
              markets, geographic restrictions, and any reliance on decentralization claims. The absence of a public
              enforcement action in this source pool is not evidence that the products are cleared.
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: Operational, technical, and market-structure risk
        blocks:
          - type: paragraph
            body: >-
              Lighter's architecture reduces one class of execution discretion but does not remove availability, oracle,
              liquidity, or software risk. The reviewed material describes off-chain matching with on-chain proof
              verification, and it explicitly distinguishes proving that an accepted order followed the rules from
              guaranteeing prompt sequencing or venue availability. A proof therefore cannot prevent downtime, a thin
              book, oracle disruption, or a smart-contract and proving-system defect. Leverage up to 50x, depending on
              market, increases the speed at which a data or liquidity problem can become a customer-loss event. The
              public evidence also reports a large decline from an incentive-era volume peak to a lower current volume
              level, which makes liquidity under stressed conditions and the durability of demand important diligence
              items rather than settled facts.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Publicly described mitigations include zero-knowledge proofs for matching and liquidations, an escape or
              forced-withdrawal path, self-custody, and isolated-margin and stop-loss practices. These controls are
              useful but incomplete: they do not independently verify uptime, oracle quality, market depth, code audit
              remediation, legal permissions, or sustainable revenue. The practical monitoring plan is therefore
              quantitative. Track forced withdrawals and withdrawal latency, proof failures, sequencer liveness, oracle
              deviations, liquidation losses, bid-ask depth at stress intervals, concentrated collateral, fee and
              funding economics, and volume after points or token incentives. A thesis-break event would be a material
              outage during a volatile market, a verified loss of collateral or liquidation integrity, a regulator or
              court action restricting the core product, or sustained post-incentive liquidity and revenue
              deterioration. Until those indicators are disclosed and tested, residual exposure remains high.
            claimRefs:
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR008
              - CR009
              - CR010
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              A material outage or collateral loss during market stress, a regulator or court action restricting the
              core product, or sustained post-incentive deterioration in liquidity and revenue would break the current
              diligence thesis.
            calloutType: risk
            claimRefs:
              - CR012
              - CR014
          - type: callout
            title: Proof is not availability
            body: >-
              Verifiable matching can constrain execution after acceptance, but it does not by itself guarantee prompt
              sequencing, oracle integrity, market depth, or uptime.
            calloutType: insight
            claimRefs:
              - CR008
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Lighter merits continued diligence rather than a buy recommendation. Four independent reports converge on
              a $68 million financing and an approximately $1.5 billion valuation, establishing a credible market signal
              but not a verified fair value. The founder reportedly confirmed that the financing included equity and
              token warrants while declining to confirm the valuation, so the headline does not reveal ownership,
              dilution, preference seniority, or the allocation of value between securities. Product activity and a
              founder claim of profitability strengthen the thesis, but neither substitutes for audited revenue quality.
              A critical third-party account of the October 2025 crash adds operational downside that must be resolved
              before entry. The appropriate decision is research-more, with high risk and medium confidence: do not pay
              a premium to the reported mark without verified economics, financing terms, and incident remediation.
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV011
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV012
              - CV016
      - number: '8.2'
        title: Financing context, traction, and monetization
        blocks:
          - type: paragraph
            body: >-
              The financing record is internally inconsistent beyond the latest round. SetterVC estimates $100 million
              raised across three rounds and explicitly warns that its company and valuation data may be incomplete or
              revised; Tapbit instead states $80 million of total funding. That conflict prevents a reliable
              cumulative-funding or cash-available conclusion. Operating indicators are also substantial but secondary:
              Coin360 reports $279.5 billion of 30-day trading volume and $1.15 billion of TVL, Gate reports 188,000
              users and $1.37 billion of TVL after private testing, and Lighterpedia reports 219 active markets. These
              metrics have different dates and denominators and should not be combined into a funnel or revenue proxy.
              Public descriptions pair zero-fee standard trading with institutional API or premium monetization, while
              the founder has claimed profitability. Audited net revenue, incentive expense, gross margin, retention,
              and cohort concentration remain necessary before applying any valuation multiple.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports scenario discipline, not a precise equity range. VanEck presents Hyperliquid as
              the scaled benchmark, reporting $633 billion of Q1 2026 trading volume, approximately 32% of on-chain
              perpetuals volume, and a $626 million annualized protocol-revenue run rate as of April 2026. Those figures
              are useful operating reference points, but VanEck was promoting a Hyperliquid-linked product and the
              benchmark is a token/protocol exposure rather than a like-for-like private-company security. The Block's
              report of $1.2 trillion in October 2025 on-chain perpetuals volume supports the category opportunity.
              Gate's published LIT fully diluted valuation scenarios cannot be substituted for Lighter's equity
              valuation because the instruments and claims on value differ. The bull, base, and bear cases therefore use
              observable diligence conditions, with the reported $1.5 billion financing mark as a reference rather than
              an asserted fair value.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              The reviewed public sources do not establish exit readiness, a target return, or a realizable secondary
              price. A private financing mark can support future fundraising optionality, but the mixed
              equity-and-token-warrant structure makes proceeds allocation and investor seniority essential to return
              analysis. Before investment, diligence should obtain audited monthly financials, a fully diluted cap table
              and preference waterfall, fee-paying customer cohorts, jurisdiction-specific regulatory advice, and
              incident records covering uptime, liquidations, customer losses, and remediation. The thesis breaks if
              activity proves predominantly incentive-driven, if paid monetization cannot support infrastructure and
              liquidity costs, if a material outage leaves customer losses unresolved, or if regulation blocks core
              products or distribution. The view would improve only with repeatable net revenue, durable retention,
              verified controls, and entry terms that provide downside protection.
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry condition
            body: >-
              Do not pay a premium to the reported $1.5 billion financing mark until audited revenue quality, fully
              diluted ownership, preference terms, and incident remediation are independently verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV016
          - type: callout
            title: Instrument mismatch
            body: >-
              Published LIT token FDV scenarios are not evidence of Lighter equity value; token and company securities
              carry different economic rights.
            calloutType: risk
            claimRefs:
              - CV015
