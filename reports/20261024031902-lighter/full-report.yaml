  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Lighter's relevant market is on-chain perpetual-derivatives trading, with adjacent exposure to spot,
              real-world-asset and pre-IPO contracts. The boundary should exclude the full crypto-exchange market and
              avoid treating total value locked, open interest, trading volume and protocol revenue as interchangeable.
              Gate describes perpetual contracts as a major crypto-derivatives instrument and identifies performance
              constraints, fragmented liquidity and transaction costs as adoption barriers. Lighter's own documentation
              frames the product around Ethereum settlement, verifiable execution, scalable throughput and independent
              exits. The status quo includes centralized exchanges for speed and liquidity, AMM-based DEXs for
              permissionless access, and dedicated-chain order-book venues for professional execution. These
              alternatives compete for the same trader budget but differ in custody, regulatory posture, market depth
              and operating model.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and growth drivers
        blocks:
          - type: paragraph
            body: >-
              Public figures support multiple sizing lenses rather than a single TAM. Gate reports that perpetual
              contracts generate daily volumes in the tens of billions of dollars, while The Crypto Wiki reports Lighter
              at approximately $39 billion in 30-day perpetual volume and $487 million of TVL in early 2026; those
              figures describe activity and collateral on one venue, not revenue or addressable spend. An independent
              market-profile source reports approximately $34 billion of Lighter 30-day perpetual volume, $523 million
              TVL and $857 million open interest as of August 2026, but the methodology is not independently documented
              in the fetched text. Growth drivers are lower trading friction, self-custody, verifiable matching, broader
              contract coverage and professional-grade order books. The buyer's adoption trigger is credible execution
              at acceptable liquidity; the budget owner is the trader, market maker or institutional trading desk rather
              than a conventional software procurement function.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
