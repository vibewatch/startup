      snapshots cannot be treated as revenue or summed into TAM.
    claimRefs:
      - CM003
      - CM006
      - CM007
      - CM009
  - id: FP001
    title: Competitive positioning by verifiability and professional execution breadth
    type: quadrant
    summary: >-
      Analyst ordinal positioning separates cryptographic-verifiability claims from breadth of professional execution
      features.
    data:
      xAxis:
        label: Trust minimization / verifiability (analyst ordinal)
        min: 1
        max: 5
      yAxis:
        label: Professional execution breadth (analyst ordinal)
        min: 1
        max: 5
      points:
        - label: Lighter
          x: 5
          'y': 4
          detail: ZK-proved matching and Ethereum settlement; broad order-book feature set.
        - label: Hyperliquid
          x: 3
          'y': 5
          detail: Purpose-built L1 with the broadest retained scale and advanced order tools.
        - label: dYdX
          x: 4
          'y': 5
          detail: Cosmos-based order book with API tooling and more than 200 reported markets.
        - label: GMX
          x: 4
          'y': 2
          detail: Wallet-native pooled liquidity with a simpler reported order set.
        - label: Vertex
          x: 3
          'y': 3
          detail: Hybrid matching and settlement with cross-margin and lending integration.
        - label: Drift
          x: 3
          'y': 3
          detail: Solana composability alternative; retained detail is insufficient to distinguish it further.
    approximationNotes: >-
      Scores are analyst-authored ordinal judgments from the cited architecture, order-type, market-breadth, and custody
      descriptions; they are not measured benchmarks or value-proportional distances.
    claimRefs:
      - CP016
  - id: FI001
    title: Revenue model and value-flow map
    type: flow
    summary: >-
      User activity can produce protocol revenue through paid account and operational fees, while liquidation fees
      follow a separate supply-side path.
    data:
      nodes:
        - id: trader-activity
          label: Trader activity
          detail: Perpetual and spot orders, transfers, withdrawals, and liquidations.
        - id: account-pricing
          label: Account pricing
          detail: Standard accounts are reported at zero maker/taker fees; Premium terms vary by staking tier.
        - id: operational-fees
          label: Operational fees
          detail: Maker/taker, transfer, and withdrawal fees enter DefiLlama's revenue methodology.
        - id: protocol-revenue
          label: Protocol revenue
          detail: Revenue retained by the protocol before undisclosed corporate operating costs.
        - id: treasury-buybacks
          label: Treasury and buybacks
          detail: Treasury revenue is measured after LIT buybacks and can be negative on a daily basis.
        - id: liquidation-path
          label: LLP / insurance fund
          detail: Liquidation fees are classified as supply-side revenue rather than protocol revenue.
      edges:
        - from: trader-activity
          to: account-pricing
        - from: account-pricing
          to: operational-fees
        - from: operational-fees
          to: protocol-revenue
        - from: protocol-revenue
          to: treasury-buybacks
        - from: trader-activity
          to: liquidation-path
    approximationNotes: >-
      Conceptual flow based on public methodology; widths do not represent value and no corporate cost bridge is
      implied.
    claimRefs:
      - CI001
      - CI002
      - CI012
      - CI013
      - CI015
  - id: FE001
    title: Source-derived product architecture map
    type: stack
    summary: >-
      The assigned sources describe a layered path from trader interfaces through matching, risk logic, proof
      generation, and Ethereum verification.
    data:
      layers:
        - label: Client surfaces
          detail: Wallet trading interface and reported programmatic access.
          items:
            - Trading interface
            - REST and WebSocket API
        - label: Collateral and account state
          detail: USDC collateral and position records used by the trading workflow.
          items:
            - Collateral contracts
            - Position state
        - label: Matching and sequencing
          detail: Fast order-book processing described as occurring off-chain.
          items:
            - Order book
            - Sequencer or matching engine
        - label: Risk processing
          detail: Margin checks and liquidations included in the proof narrative.
          items:
            - Margin checks
            - Liquidation logic
        - label: Proof generation
          detail: Prover and state structures generate evidence for state transitions.
          items:
            - ZK prover
            - Order Book Tree and State Tree
        - label: Ethereum verification and recovery
          detail: L1 verification and the reported escape-hatch withdrawal path.
          items:
            - Ethereum verifier
            - Escape hatch
    approximationNotes: >-
      Layering is analytical and source-derived; component boundaries, throughput, and failover behavior are not
      independently verified.
    claimRefs:
      - CE007
      - CE009
      - CE015
  - id: FU001
    title: Customer journey from access to expansion
    type: journey-map
    summary: >-
      Public evidence supports an access-to-trading pathway and possible premium or partner expansion, but not verified
      conversion or retention rates.
    data:
      nodes:
        - id: access
          label: Wallet access
          title: Wallet access
          detail: >-
            Connect a compatible wallet and deposit collateral; no email or account signup is described in assigned
            guides.
          touchpoints:
            - Wallet connection
            - USDC collateral
            - Jurisdiction eligibility
        - id: trade
          label: Standard trading
          title: Standard trading
          detail: Standard accounts are described as zero maker/taker fee with leveraged perpetual and broader market access.
          touchpoints:
            - Perpetuals
            - Spot/RWA markets
            - Risk and liquidation
        - id: premium
          label: Premium/API expansion
          title: Premium/API expansion
          detail: >-
            Premium and Plus tiers trade speed, fees, and API limits; the assigned evidence does not disclose
            conversion.
          touchpoints:
            - Lower latency
            - API limits
            - Institutional execution
        - id: partner
          label: Partner distribution
          title: Partner distribution
          detail: Robinhood Wallet is described as a separate access route for eligible users in selected jurisdictions.
          touchpoints:
            - Wallet distribution
            - Restricted jurisdictions
            - Potential liquidity route
        - id: retention
          label: Retention proof
          title: Retention proof
          detail: Retention, concentration, and production outcomes are not disclosed in the assigned sources.
          touchpoints:
            - Cohort data gap
            - Concentration gap
        - id: expansion
          label: Expansion evidence
          title: Expansion evidence
          detail: >-
            Premium, API, partner, and liquidity-pool pathways are described, but conversion and revenue are not
            disclosed.
          touchpoints:
            - Premium/API
            - Partner channel
            - Liquidity pool
    claimRefs:
      - CU016
  - id: FR001
    title: Risk heatmap and residual exposure
    type: matrix
    summary: >-
      Residual exposure remains highest where leverage, availability, regulatory uncertainty, and incentive-dependent
      economics interact.
    data:
      columns:
        - Impact
        - Likelihood
        - Mitigation maturity
        - Residual severity
        - Trigger
      rows:
        - label: Liquidation and oracle stress
          values:
            - Critical
            - High
            - Partial
            - High
            - Oracle deviation or inability to close
        - label: Sequencer and withdrawal liveness
          values:
            - Critical
            - Medium
            - Partial
            - High
            - Downtime or forced-withdrawal delay
        - label: ZK and smart-contract defect
          values:
            - Critical
            - Medium
            - Early
            - High
            - Proof, verifier, or audit-remediation failure
        - label: Regulatory perimeter
          values:
            - Critical
            - Medium
            - Early
            - High
            - Restriction, action, or counsel red flag
        - label: Incentive-driven volume
          values:
            - High
            - High
            - Partial
            - High
            - Post-incentive liquidity or revenue decline
        - label: Market depth and collateral concentration
          values:
            - High
            - Medium
            - Partial
            - Medium-high
            - Stress spread or concentration breach
    claimRefs:
      - CR001
      - CR005
      - CR008
      - CR010
      - CR011
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The reported financing signal passes through monetization, financing-term, and downside gates before reaching a
      research-more decision.
    data:
      nodes:
        - id: financing
          label: Reported $68M financing at approximately $1.5B
          detail: Corroborated market signal, not verified fair value
        - id: product
          label: Substantial reported product activity
          detail: Volume, TVL, users, and market counts use different denominators
        - id: economics
          label: Audited economics unavailable
          detail: Revenue quality, margins, retention, and incentives remain private
        - id: structure
          label: Security economics unavailable
          detail: Equity, token warrants, preferences, and dilution need reconciliation
        - id: downside
          label: Operational and regulatory gates
          detail: Outage evidence and product permissions require diligence
        - id: decision
          label: Research-more
          detail: No premium to the reported mark before gates clear
      edges:
        - from: financing
          to: product
        - from: product
          to: economics
        - from: economics
          to: structure
        - from: structure
          to: downside
        - from: downside
          to: decision
    approximationNotes: Ordered decision flow; it does not imply numeric conversion rates or a probability-weighted valuation.
    claimRefs:
      - CV001
      - CV008
      - CV010
      - CV012
      - CV016
