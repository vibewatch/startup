      - number: '3.3'
        title: Free retail execution shifts competition to latency, APIs, and distribution
        blocks:
          - type: paragraph
            body: >-
              Lighter's Standard account removes maker and taker fees, while paid Premium and Plus tiers monetize lower
              latency and greater API capacity. Rival list pricing remains low rather than free: the retained comparison
              lists Hyperliquid at 0.015% maker and 0.045% taker, dYdX at 0.01% and 0.05%, GMX at roughly 0.1% under its
              AMM model, and Vertex at 0% and 0.02%. These are publisher-reported schedules, not realized institutional
              rates, and they omit rebates, funding, slippage, bridge costs, and bespoke agreements. Distribution can
              outweigh nominal fees. A current review says Robinhood uses Lighter for one non-US deployment but selected
              Bitstamp for a US perpetuals launch, demonstrating that a wallet partner can choose different suppliers by
              market.
            claimRefs:
