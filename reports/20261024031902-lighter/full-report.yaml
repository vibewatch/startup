      - number: '3.4'
        title: Moat durability depends on reliability, partner access, and regulatory execution
        blocks:
          - type: paragraph
            body: >-
              Cryptographic verification is technically meaningful, but competitors can still displace Lighter through
              deeper liquidity, broader distribution, reliable operations, or regulatory access. Hyperliquid's reported
              volume and open-interest lead gives it a liquidity advantage, while Lighter's partner-led expansion
              creates concentration risk when distributors can route flow elsewhere. Regulatory posture is also a
              market-access variable, not merely a compliance footnote: a CFTC enforcement release states that
              smart-contract delivery did not exempt DeFi operators offering leveraged digital-asset transactions from
              registration requirements. That action did not concern Lighter and does not establish a violation by
              Lighter, but it is relevant precedent for every unregistered US-facing derivatives model. The investment
              case therefore requires production uptime evidence, customer and maker concentration, realized pricing,
              API switching costs, and jurisdiction-specific legal analysis before treating the zk design as a durable
              commercial moat.
            claimRefs:
              - CP004
              - CP011
              - CP012
              - CP015
