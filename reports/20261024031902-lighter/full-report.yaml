      - number: '6.2'
        title: Adoption signals and durability
        blocks:
          - type: paragraph
            body: >-
              Current third-party market data demonstrates activity, not customer durability. DefiLlama reports $817.07
              million of total value locked, $66.508 billion of 30-day perpetual volume, and 23,803 active addresses
              over 24 hours as of October 24, 2026. It also attributes $48.908 billion of that 30-day perpetual volume
              to zkLighter and $17.6 billion to Robinhood Chain. These are materially stronger adoption signals than a
              logo list, but leveraged notional volume, addresses, and deposited value use different denominators and
              cannot be converted into customers or retention. The TVL series peaked at $1.45 billion at 2025 year-end,
              fell to $520.59 million by March 31, 2026, and recovered to $817.04 million on the run date. Publicly
              reported activity therefore appears meaningful but volatile, while NRR, GRR, churn, renewal, and cohort
              repeat rates remain unavailable.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named customer proof remains thin. AI Market Watch explicitly says notable customers are not disclosed,
              while the strongest named relationship in the assigned evidence is Robinhood as a wallet distribution
              route for eligible users in selected jurisdictions. That route is evidence of channel availability, not
              evidence of a customer contract, production volume, conversion, or retention. Crypto Economy reports an
              intention to expand institutional-grade products, but no named institutional buyer is attached. Adverse
              evidence also matters for durability: AInvest reports that a failed database upgrade and transaction surge
              caused multi-hour outages during the October 2025 crash, and Perp DEX Guide recounts a DefiLlama founder's
              wash-trading allegation while noting the lack of detailed evidence. Without counterparty-level economics,
              the investment case cannot separate organic repeat demand from incentives, concentrated accounts, or
              partner-routed volume.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
