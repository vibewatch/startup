      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The observable economics stop at the protocol boundary. DefiLlama's methodology distinguishes treasury
              revenue from liquidation fees paid to the liquidity pool, but it does not disclose payroll,
              proof-generation and sequencer expense, Ethereum settlement costs, market-making support, working capital,
              capex, tax, or corporate gross margin. Capital evidence is also internally inconsistent: DefiLlama and
              Gaebler identify a $68 million financing, while Crypto Economy reports that the same round brought total
              funding to nearly $90 million and repeats a company claim of operational profitability. Funding raised is
              not cash available, and none of these sources establishes current cash, burn, runway, debt,
              project-finance obligations, or the trigger for another round.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial risks and verdict
        blocks:
          - type: paragraph
            body: >-
              The financial profile combines strong public protocol activity with weak corporate disclosure. AInvest's
              adverse account attributes an October 2025 disruption to single-sequencer dependence and questions whether
              a zero-fee retail model can sustain infrastructure and liquidity costs; Atomic Wallet separately raises
              the same zero-fee sustainability issue. A newly reported weETH collateral policy applies a 30% haircut and
              a 1,000-token platform cap, illustrating that collateral design can constrain activity during risk
              management changes. The investable conclusion is therefore conditional: protocol monetization appears
              established, but revenue quality, margin conversion, resilience costs, and capital adequacy cannot be
              underwritten without management data and reconciled financial statements.
            claimRefs:
              - CI014
              - CI015
              - CI016
              - CI004
              - CI005
