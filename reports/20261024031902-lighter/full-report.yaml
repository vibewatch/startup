        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Lighter is described as a decentralized perpetual-futures exchange that settles to Ethereum and uses
              custom zero-knowledge infrastructure. The product combines a central-limit order book with cryptographic
              proofs for order matching and liquidations, rather than relying on an automated market maker. Sources
              describe standard-account trading as zero-fee, self-custodial wallet access, USDC collateral, and leverage
              that varies by market up to 50x. The commercial surface is broader than crypto perpetuals: public guides
              also describe spot markets, real-world-asset exposure, and pre-IPO perpetuals. These are source-reported
              product characteristics, not independently audited operating metrics.
