  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set is broader than perp DEX peers
        blocks:
          - type: paragraph
            body: >-
              Hyperliquid is the closest direct benchmark because both venues target high-frequency, order-book
              perpetuals users, but the architectures differ: Hyperliquid runs a purpose-built Layer 1 while Lighter
              publishes rollup data and validity proofs to Ethereum. dYdX is another direct order-book peer, while GMX
              offers a pooled-liquidity AMM model and Vertex combines off-chain matching with on-chain settlement. Drift
              supplies a Solana-based alternative, centralized exchanges remain the incumbent status quo, and
              sophisticated desks can build internal routers across several venues. Public evidence is much stronger for
              product features and list fees than for competitor funding, institutional share, or the cost of an
              internal build, so those fields remain explicitly unknown rather than estimated.
            claimRefs:
