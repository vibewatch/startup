  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Lighter's public customer model is a product ladder rather than a conventional enterprise sales funnel.
              Standard accounts address self-directed traders with zero maker and taker fees, while Premium and Plus
              tiers exchange fees for lower latency or higher API limits. The same venue exposes perpetual, spot,
              real-world-asset, and pre-IPO markets, broadening the use cases available to an individual account.
              Professional traders, market makers, and API users are therefore plausible payers even when the standard
              retail user is not. An unverified GitHub Pages site repeats the retail-versus-premium segmentation, but
              its issuer cannot be established and it is treated as low-confidence context rather than company evidence.
              Public materials do not disclose segment revenue, unique customer counts, or account-to-person mapping.
            claimRefs:
              - CU001
              - CU002
