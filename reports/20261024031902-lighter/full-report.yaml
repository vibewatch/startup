  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and maturity
        blocks:
          - type: paragraph
            body: >-
              The public product surface combines order-book perpetuals with spot, real-world asset, and pre-IPO
              markets, although the assigned evidence is secondary and market counts differ by publisher and vintage.
              Lighterpedia describes 219 active markets in a September 2026 review, while Alchemy describes more than 40
              markets; neither figure should substitute for a live product inventory. DefiLlama's current protocol page
              separately tracks Perps, Spot, Bridge, LLP, and Robinhood Perps products, which is useful evidence that
              the platform has expanded beyond one trading screen. The investable conclusion is a broadening trading
              product, not a verified SKU count. Current market availability, leverage limits, eligibility, and
              account-tier features require confirmation against official documentation that was not present in the
              assigned pool.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
