      - number: '3.2'
        title: Verifiability differentiates Lighter, but scale and control remain trade-offs
        blocks:
          - type: paragraph
            body: >-
              Lighter's defensible claim is narrower than “better exchange”: retained sources consistently describe an
              application-specific zk-rollup that proves matching and liquidation rules while settling to Ethereum. That
              architecture separates it from Hyperliquid's monolithic Layer 1 and from AMM-style venues such as GMX. The
              differentiation does not remove operating control, however. A critical account of the October 2025
              disruption ties multi-hour unavailability to a single sequencer and database upgrade, and the retained
              evidence does not establish redundant production sequencing. Scale also favors Hyperliquid: one October
              2026 review reported roughly $206 billion of 30-day volume and $7.7 billion of open interest for
              Hyperliquid versus about $59 billion and $0.8 billion for Lighter. Those point-in-time figures are not
              durable market-share estimates.
