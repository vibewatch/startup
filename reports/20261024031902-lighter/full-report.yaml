      - number: '5.2'
        title: Trading workflow and integration surface
        blocks:
          - type: paragraph
            body: >-
              The described user workflow begins with a wallet connection and USDC collateral, continues through market
              selection and order entry, and ends with position monitoring or withdrawal. Lighterpedia reports market,
              limit, stop-loss, and take-profit orders, with leverage set by market; it also describes no email or
              account registration. A separate low-reputation site claims REST and WebSocket endpoints plus a TypeScript
              SDK, while Lighterpedia links to a public API reference. Those signals indicate a programmatic integration
              surface, but they do not establish an official repository, version policy, uptime commitment, or external
              developer adoption. Integration diligence should therefore test the live API and SDK rather than crediting
              documentation claims as production reliability evidence.
            claimRefs:
              - CE001
              - CE004
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE006
              - CE008
              - CE015
      - number: '5.3'
        title: Architecture and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              The consistent architectural theme is a hybrid order book: fast matching occurs away from Ethereum, while
              zero-knowledge proofs and Ethereum verification are intended to make execution and state transitions
              auditable. Gate Learn describes off-chain matching followed by batching into a zk-rollup; Alchemy says
              fills, risk checks, and liquidations are proven in circuits and verified on L1. Gate's technical overview
              adds a prover and specialized order-book and state-tree data structures. These accounts explain the
              intended performance-verifiability trade, but they come from ecosystem publishers and exchange-affiliated
              education rather than Lighter's own technical specification. The architecture map is consequently a
              source-derived operating model, not a validated topology, benchmark, or security assessment.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
