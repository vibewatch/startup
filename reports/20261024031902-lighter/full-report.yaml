      - number: '2.3'
        title: Buyer segments and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The primary user segment is crypto-native retail and professional traders seeking leveraged exposure, low
              fees and self-custody. A second segment is market makers and systematic/API users that value order-book
              access, latency and predictable settlement. A third, still less proven segment is institutional or
              cross-asset users considering RWA and pre-IPO contracts. The adoption path is from wallet connection and
              collateral deposit to repeat trading, liquidity provision or programmatic execution. Constraints are
              material: perpetuals embed funding and liquidation risk; order books need depth; off-chain matching
              creates operational dependence; and regulatory treatment remains unsettled. The Digital Chamber's CFTC
              comment summary calls for margin limits, funding-rate caps, circuit breakers, continuous surveillance and
              clearer classification, while FinCEN's 2019 guidance shows that virtual-currency business-model
              classification can carry compliance implications. These constraints can delay institutional adoption even
              where product-market interest exists.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
