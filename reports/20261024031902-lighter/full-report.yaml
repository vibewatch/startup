        title: Exhibits
        blocks:
          - type: callout
            title: Narrow but credible technical differentiation
            body: >-
              Lighter's strongest comparative evidence is proof-verified matching and liquidation on an Ethereum-settled
              rollup, not a demonstrated structural lead in liquidity or distribution.
