      - number: '5.4'
        title: Reliability, recovery, and assurance gaps
        blocks:
          - type: paragraph
            body: >-
              Reliability is the central technical underwriting risk. AINvest reports that a single-sequencer dependency
              became a bottleneck during an October 2025 crash and that cross-asset margin dynamics amplified
              deleveraging; these are adverse third-party claims, not verified incident totals. Lighterpedia and Gate
              Wiki describe an escape hatch that should permit Ethereum-based withdrawal if the sequencer is
              unavailable, but the assigned evidence provides no tested recovery time or failure drill. DefiLlama shows
              live activity and a multi-product footprint as of the run date, which supports current operation but
              cannot prove uptime, liquidation correctness, privacy, compliance, or audit remediation. Investment
              diligence should require official architecture, audit, status, incident, and control evidence before
              treating cryptographic verifiability as end-to-end operational safety.
            claimRefs:
