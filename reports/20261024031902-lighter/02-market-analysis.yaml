      - [The Crypto Wiki, "Early 2026", "Lighter venue", "$39B 30-day perpetual volume; $487M TVL; $766M open interest", "Reported venue metrics", medium, "Third-party page; activity and collateral are not revenue"]
      - [AI Market Watch, "Aug 2026", "Lighter venue", "$34B 30-day perp volume; $523M TVL; $857M open interest", "Profile citing DeFiLlama, with no methodology reproduced", low, "Conflicts with other venue snapshot and cannot be reconciled here"]
      - [VanEck, "2025 and Q1 2026", "Global on-chain derivatives", "Perpetuals DEX-to-CEX share rose to 24.3% in 2025; Hyperliquid processed $633B in Q1 2026", "Issuer-authored market commentary citing DeFiLlama", medium, "Category share and competitor volume are context, not Lighter SAM"]
      - [Lighter docs, "Current at fetch", "Lighter protocol", "Proof-backed exchange operations and Ethereum-anchored settlement", "Technical architecture description", high, "Capability evidence, not market-size evidence"]
    notes: "The lenses mix market context, venue activity and technical capability by design; no conversion from volume or TVL to TAM, SAM, SOM, ARR or valuation is inferred."
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer/budget owner, Workflow, Adoption trigger]
    rows:
      - ["Crypto-native retail trader", "Individual trader", "Individual trader", "Personal trading capital", "Wallet connect, collateralize, trade, withdraw", "Zero maker/taker fees and self-custody"]
      - ["Professional trader", "Trading desk", "Trader or quant", "Trading desk capital", "API/order-book execution and funding management", "Low latency and verifiable matching"]
      - ["Market maker", "Liquidity firm", "Quoting and risk team", "Firm trading capital", "Quote, hedge, manage inventory and liquidation exposure", "Depth and predictable risk controls"]
      - ["Institutional or regulated participant", "Institution or prime desk", "Portfolio/trading team", "Institutional risk budget", "Due diligence, onboarding and monitored execution", "Regulatory clarity, surveillance and operational resilience"]
      - ["Cross-asset/RWA user", "Crypto-native or specialist trader", "Portfolio manager", "Trading allocation", "Trade tokenized or pre-IPO references", "Sufficient liquidity and trusted contract terms"]
    notes: "Segments are analytical roles inferred from the documented product and market structure; public evidence does not disclose customer counts, retention, cohort economics or budget conversion."
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
