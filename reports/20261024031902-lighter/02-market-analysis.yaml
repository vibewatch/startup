      - [Professional order-book trading, "Execution, market making and API-driven flow on CLOB venues", "AMM-only swaps and passive spot holdings", "Market makers and systematic desks", "Core adoption wedge"]
      - [Spot and cross-asset extensions, "Spot, RWA and pre-IPO contracts listed by the venue", "Underlying asset ownership or issuer-sponsored securities", "Existing traders and cross-asset users", "Adjacent expansion"]
      - [Centralized exchange substitute, "Fees, custody and execution budget that could migrate on-chain", "Regulated exchange revenue is not directly comparable", "Traders and institutional desks", "Status-quo substitute"]
      - [DeFi liquidity provision, "Collateral and liquidity supplied to pools or order books", "TVL as a value metric is not revenue or customer count", "Liquidity providers and market makers", "Enabling layer"]
    notes: "Boundary is analytical and uses source-described market functions; volume, TVL, open interest, collateral and revenue are retained as distinct measures rather than summed."
    claimRefs: [CM001, CM002, CM003, CM004]
