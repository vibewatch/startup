      - [Perpetual volume by chain, "$48.908B zkLighter; $17.6B Robinhood Chain over 30d", "2026-10-24", DefiLlama, medium, "Activity spans direct and partner surfaces", "Cross-chain users and partner-attributed economics"]
      - [TVL peak, "$1.45B", "2025-12-31", DefiLlama, medium, "Historical scale benchmark", "Cohort identity and incentive contribution"]
      - [TVL trough/recovery, "$520.59M on 2026-03-31; $817.04M on 2026-10-24", "2026", DefiLlama, medium, "Deposited value recovered but remains below peak", "Retention, net flows, and customer composition"]
      - [Access model, "Invite via Discord or referral", "2025-11-11", CCN, medium, "Historical controlled-growth funnel", "Current invite conversion and customer quality"]
    notes: "DefiLlama metrics use TVL, address, and notional-volume methodologies with different denominators; none is a customer count or retention rate."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
