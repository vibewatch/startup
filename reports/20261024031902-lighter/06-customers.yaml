      - [Standard accounts, Anonymous retail cohort, "Zero-fee self-directed trading", "Public product tier, not a named customer deployment", "Low-friction acquisition proposition", "No named reference, outcome, or active-user count"]
      - [Premium and Plus/API accounts, Anonymous professional cohort, "Lower latency or higher API limits", "Public product tiers, not named customer deployments", "Potential expansion from free to paid usage", "No conversion, contract, volume, or renewal evidence"]
    notes: "Partial enumeration of publicly evidenced channels and cohorts; the assigned sources disclose no exhaustive customer list or independently verified customer outcome."
    enumerationScope:
      coverage: partial
      basis: "Named relationships and customer categories visible in assigned public sources fetched for the 2026-10-24 refresh"
    claimRefs: [CU001, CU002, CU003, CU010, CU011, CU012, CU015]
