schemaVersion: "report-v2"
artifact: customers
slug: lighter
runDate: 2026-10-24
company:
  name: Lighter
chapter:
  number: 6
  title: Customers
  summary: Lighter shows substantial current trading activity and a differentiated retail-to-professional product ladder, but those signals do not establish customer retention or concentration. Robinhood is the only named distribution route in the assigned evidence; named end customers, cohort durability, and channel economics remain undisclosed.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segmentation
    body: >-
      Lighter's public customer model is a product ladder rather than a conventional enterprise
      sales funnel. Standard accounts address self-directed traders with zero maker and taker
      fees, while Premium and Plus tiers exchange fees for lower latency or higher API limits.
      The same venue exposes perpetual, spot, real-world-asset, and pre-IPO markets, broadening
      the use cases available to an individual account. Professional traders, market makers, and
      API users are therefore plausible payers even when the standard retail user is not. An
      unverified GitHub Pages site repeats the retail-versus-premium segmentation, but its issuer
      cannot be established and it is treated as low-confidence context rather than company
      evidence. Public materials do not disclose segment revenue, unique customer counts, or
      account-to-person mapping.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption signals and durability
    body: >-
      Current third-party market data demonstrates activity, not customer durability. DefiLlama
      reports $817.07 million of total value locked, $66.508 billion of 30-day perpetual volume,
      and 23,803 active addresses over 24 hours as of October 24, 2026. It also attributes
      $48.908 billion of that 30-day perpetual volume to zkLighter and $17.6 billion to Robinhood
      Chain. These are materially stronger adoption signals than a logo list, but leveraged
      notional volume, addresses, and deposited value use different denominators and cannot be
      converted into customers or retention. The TVL series peaked at $1.45 billion at 2025
      year-end, fell to $520.59 million by March 31, 2026, and recovered to $817.04 million on the
      run date. Publicly reported activity therefore appears meaningful but volatile, while NRR,
      GRR, churn, renewal, and cohort repeat rates remain unavailable.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU015]
    tableRefs: [TU002]
  - id: named-proof-and-expansion
    title: Named proof, expansion, and concentration
    body: >-
      Named customer proof remains thin. AI Market Watch explicitly says notable customers are not
      disclosed, while the strongest named relationship in the assigned evidence is Robinhood as
      a wallet distribution route for eligible users in selected jurisdictions. That route is
      evidence of channel availability, not evidence of a customer contract, production volume,
      conversion, or retention. Crypto Economy reports an intention to expand institutional-grade
      products, but no named institutional buyer is attached. Adverse evidence also matters for
      durability: AInvest reports that a failed database upgrade and transaction surge caused
      multi-hour outages during the October 2025 crash, and Perp DEX Guide recounts a DefiLlama
      founder's wash-trading allegation while noting the lack of detailed evidence. Without
      counterparty-level economics, the investment case cannot separate organic repeat demand
      from incentives, concentrated accounts, or partner-routed volume.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015]
    tableRefs: [TU003]
    figureRefs: [FU001]
