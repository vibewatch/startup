        - id: retention
          label: Retention proof
          title: Retention proof
          detail: "Retention, concentration, and production outcomes are not disclosed in the assigned sources."
          touchpoints: ["Cohort data gap", "Concentration gap"]
        - id: expansion
          label: Expansion evidence
          title: Expansion evidence
          detail: "Premium, API, partner, and liquidity-pool pathways are described, but conversion and revenue are not disclosed."
          touchpoints: ["Premium/API", "Partner channel", "Liquidity pool"]
    claimRefs: [CU016]
callouts:
  - calloutType: insight
    title: Product access is better evidenced than customer durability
    body: "Lighter has public evidence for trading activity, fee tiers, and a named wallet distribution route. It does not have public evidence sufficient to underwrite unique-customer growth, retention, or concentration."
    claimRefs: [CU005, CU006, CU007, CU010, CU011, CU015]
  - calloutType: risk
    title: Incentive activity and trading volume are not retention
    body: "Addresses, TVL, and leveraged notional volume indicate activity under different denominators; none provides repeat-user cohorts, unique customers, or a retention rate."
    claimRefs: [CU005, CU006, CU007, CU008, CU015]
