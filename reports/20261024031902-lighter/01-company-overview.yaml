schemaVersion: "report-v2"
artifact: company-overview
slug: lighter
runDate: 2026-10-24
company:
  name: Lighter
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Lighter is presented by multiple sources as an Ethereum-settled decentralized
    perpetual-futures venue using custom zero-knowledge infrastructure and an
    order-book model. Public evidence supports its 2022 founding, November 2025
    financing and product positioning, but revenue quality, governance detail,
    and operating resilience remain incompletely disclosed.
sections:
  - id: identity-and-product
    title: Identity, product, and operating model
    body: >-
      Lighter is described as a decentralized perpetual-futures exchange that
      settles to Ethereum and uses custom zero-knowledge infrastructure. The
      product combines a central-limit order book with cryptographic proofs for
      order matching and liquidations, rather than relying on an automated
      market maker. Sources describe standard-account trading as zero-fee,
      self-custodial wallet access, USDC collateral, and leverage that varies by
      market up to 50x. The commercial surface is broader than crypto
      perpetuals: public guides also describe spot markets, real-world-asset
      exposure, and pre-IPO perpetuals. These are source-reported product
      characteristics, not independently audited operating metrics.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Founding, leadership, and capital formation
    body: >-
      The assigned evidence identifies Vladimir Novakovski as Lighter's founder
      and ties his background to Citadel engineering or quantitative research.
      A 2025 financing report says the company raised $68 million at a roughly
      $1.5 billion valuation, led by Founders Fund and Ribbit Capital, with
      additional participation attributed to Haun Ventures and Robinhood. The
      same reporting says the financing included equity and future-token
      allocations and brought total funds raised to nearly $90 million. Public
      material does not establish a complete board, executive roster, ownership
      table, liquidation preferences, debt, runway, or the extent of founder
      key-person dependence.
    claimRefs: [CO005, CO006, CO007, CO008, CO013]
    tableRefs: [TO002, TO003]
  - id: milestones-and-gaps
    title: Milestones, scale signals, and unresolved diligence
    body: >-
      The available record shows a 2022 founding, a November 2025 financing,
      a December 2025 token launch described by one source, and a public
      expansion of product and distribution ambitions. CoinGecko reports that
      decentralized perpetual-exchange volume reached $6.7 trillion in 2025 and
      attributes $1.3 trillion of annual volume to Lighter, while also noting
      that incentives and airdrop farming drove activity across several venues.
      An adverse analysis alleges multi-hour outages and user losses during the
      October 2025 crash, but those claims are not corroborated by a primary
      incident record in this pool. Accordingly, the chapter treats scale,
      profitability, and resilience as signals requiring further verification,
      not as settled facts. This distinction is material for any financing
      or governance judgment.
    claimRefs: [CO003, CO009, CO010, CO011, CO012, CO014, CO015]
    figureRefs: [FO001]
callouts:
  - calloutType: insight
    title: What is established
    body: >-
      Independent sources consistently describe Lighter's identity, Ethereum
      settlement, zero-knowledge verification, 2022 founding, and $68 million
      November 2025 financing at an approximately $1.5 billion valuation.
    claimRefs: [CO001, CO002, CO005, CO006]
  - calloutType: risk
    title: What still needs diligence
    body: >-
      Public evidence does not establish audited revenue, durable organic
      demand, complete governance, customer concentration, or independently
      verified incident remediation.
    claimRefs: [CO010, CO011, CO012]
