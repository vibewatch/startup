slug: "lighter"
runDate: "2026-10-24"
company:
  name: "Lighter"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Lighter has visible protocol-level monetization and trading activity, including
    $5.91 million of 30-day fees and $4.96 million of 30-day protocol revenue reported
    by DefiLlama as of the run date. Underwriting remains constrained because those
    metrics are not audited company revenue, while realized pricing, corporate costs,
    cash, burn, runway, and financing obligations remain unavailable.
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model and pricing"
    body: >-
      Lighter's pricing is segmented rather than uniformly free. Two independent
      guides report zero maker and taker fees for Standard accounts, while Premium
      pricing can vary with LIT staking tiers; users can still bear spread, slippage,
      network, funding, and liquidation costs. Funding is described as an hourly,
      peer-to-peer transfer without an exchange charge, so it should not be counted
      as protocol revenue. DefiLlama instead attributes monetization to maker and
      taker fees, transfer fees, and withdrawal fees, while routing liquidation fees
      to the Lighter Liquidity Pool. This structure creates a real revenue path, but
      public list terms do not reveal realized account mix, discounts, or revenue
      concentration.
    claimRefs: [CI001, CI002, CI003, CI012, CI013]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: "public-traction-and-efficiency-proxies"
    title: "Public traction and efficiency proxies"
    body: >-
      DefiLlama's current protocol page reports $5.91 million in fees, $4.96 million
      in protocol revenue, $817.07 million in total value locked, and $66.508 billion
      in perpetual volume for the latest 30-day windows. Its trailing-year
      annualized protocol revenue is $63.03 million, compared with an approximately
      $68 million annualized figure reported by AI Market Watch for August 2026.
      These time-stamped protocol metrics show material activity, but they are not
      substitutes for customer retention, CAC, payback, contribution margin, or
      audited corporate revenue. Changing windows, product coverage, and chain mix
      also make point-in-time comparisons unsuitable as a clean growth rate.
    claimRefs: [CI004, CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: "cost-structure-and-capital-adequacy"
    title: "Cost structure and capital adequacy"
    body: >-
      The observable economics stop at the protocol boundary. DefiLlama's methodology
      distinguishes treasury revenue from liquidation fees paid to the liquidity
      pool, but it does not disclose payroll, proof-generation and sequencer expense,
      Ethereum settlement costs, market-making support, working capital, capex, tax,
      or corporate gross margin. Capital evidence is also internally inconsistent:
      DefiLlama and Gaebler identify a $68 million financing, while Crypto Economy
      reports that the same round brought total funding to nearly $90 million and
      repeats a company claim of operational profitability. Funding raised is not
      cash available, and none of these sources establishes current cash, burn,
      runway, debt, project-finance obligations, or the trigger for another round.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
  - id: "financial-risks-and-verdict"
    title: "Financial risks and verdict"
    body: >-
      The financial profile combines strong public protocol activity with weak
      corporate disclosure. AInvest's adverse account attributes an October 2025
      disruption to single-sequencer dependence and questions whether a zero-fee
      retail model can sustain infrastructure and liquidity costs; Atomic Wallet
      separately raises the same zero-fee sustainability issue. A newly reported
      weETH collateral policy applies a 30% haircut and a 1,000-token platform cap,
      illustrating that collateral design can constrain activity during risk
      management changes. The investable conclusion is therefore conditional:
      protocol monetization appears established, but revenue quality, margin
      conversion, resilience costs, and capital adequacy cannot be underwritten
      without management data and reconciled financial statements.
    claimRefs: [CI014, CI015, CI016, CI004, CI005]
callouts:
  - calloutType: "strength"
    title: "Protocol monetization is visible"
    body: >-
      DefiLlama reports positive fees and protocol revenue across current 30-day and
      trailing-year windows, providing a stronger signal than trading volume alone.
    claimRefs: [CI004, CI005, CI006]
  - calloutType: "risk"
    title: "Protocol metrics are not company accounts"
    body: >-
      No retained source discloses audited corporate revenue, gross margin, cash,
      burn, runway, or financing obligations, so capital adequacy remains unresolved.
    claimRefs: [CI009, CI010, CI011, CI012]
