      - ["Funding", "Settles hourly, peer to peer, without an exchange charge", "Open perpetual positions", "Market-determined holding cost", "Trader cost but not exchange revenue under the cited description", "Rates and net user incidence vary by market and time"]
      - ["Other trading costs", "Spread, slippage, network, and liquidation costs", "All traders depending on activity", "Execution-dependent", "Can outweigh a zero-fee headline and affect retention", "No public average all-in cost by cohort"]
    notes: "List pricing and funding mechanics from PerpsHub and Lighterpedia; no retained source supplies realized take rates or customer-level all-in costs."
    claimRefs: [CI001, CI002, CI003, CI015]
  - id: "TI003"
    title: "Public unit-economics and capital snapshot"
    columns: ["Metric", "Value", "Period / scope", "Confidence", "Underwriting interpretation"]
    rows:
      - ["Fees", "$5.91m", "Latest 30 days as of 2026-10-24; protocol", "Medium", "Gross user-fee signal, not audited company revenue"]
      - ["Protocol revenue", "$4.96m", "Latest 30 days as of 2026-10-24; protocol", "Medium", "Positive monetization signal before undisclosed corporate costs"]
      - ["Annualized protocol revenue", "$63.03m", "Trailing-year annualized as of 2026-10-24", "Medium", "Run-rate proxy only; not ARR or a forecast"]
      - ["Total value locked", "$817.07m", "Point in time as of 2026-10-24", "Medium", "Capital deposited in protocol, not company cash"]
      - ["Perpetual volume", "$66.508b", "Latest 30 days as of 2026-10-24", "Medium", "Notional activity, not revenue"]
      - ["Cash, burn, runway, gross margin, CAC / payback", null, "Corporate", "Low", "Management financials required before underwriting capital adequacy"]
    notes: "DefiLlama protocol metrics use different denominators and are not audited company accounts; null means no support in the retained evidence, not zero."
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI011]
