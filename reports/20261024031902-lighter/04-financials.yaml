  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "capital-adequacy"
      missingEvidence: "Current cash balance, monthly net cash burn, treasury composition, runway, debt, project-finance obligations, and next-round triggers."
      whyItMatters: "Funding raised does not establish cash availability or the period over which the company can fund operations and resilience investment."
      diligencePath: "Obtain management cash statements, monthly burn bridge, treasury wallet reconciliation, debt schedule, and board-approved financing plan."
      relatedQuestionRefs: [QI005]
      relatedTableRefs: [TI003]
    - type: "private-evidence-only"
      severity: "material"
      topic: "revenue-quality"
      missingEvidence: "Realized take rates, Standard versus Premium volume mix, discounts, fee waivers, cohort retention, customer concentration, and revenue by product and chain."
      whyItMatters: "Public list pricing and aggregate protocol revenue cannot establish recurring revenue quality or customer-level monetization."
      diligencePath: "Request monthly revenue cohorts, account-tier mix, top-customer concentration, realized pricing, and reconciliation to protocol data."
      relatedQuestionRefs: [QI001, QI002, QI008]
      relatedTableRefs: [TI001, TI002]
    - type: "private-evidence-only"
      severity: "material"
      topic: "cost-structure"
      missingEvidence: "Audited corporate revenue, gross margin, payroll, proof and sequencer costs, settlement costs, liquidity support, working capital, capex, tax, CAC, and payback."
      whyItMatters: "Protocol revenue can coexist with negative corporate cash flow, and the retained sources do not bridge protocol economics to company profitability."
      diligencePath: "Obtain audited or reviewed financial statements and a monthly protocol-to-company revenue and contribution-margin bridge."
      relatedQuestionRefs: [QI003, QI006]
      relatedTableRefs: [TI003]
    - type: "conflicting-data"
      severity: "material"
      topic: "funding"
      missingEvidence: "A primary financing ledger reconciling the reported $68 million total with the nearly $90 million cumulative figure."
      whyItMatters: "The discrepancy may reflect omitted earlier rounds, token allocations, or different definitions and prevents a reliable capitalization baseline."
      diligencePath: "Review signed financing documents, cap table, token warrants, cash receipts, and investor closing statements by round."
      relatedQuestionRefs: [QI005, QI009]
    - type: "missing-source"
      severity: "material"
      topic: "outage"
      missingEvidence: "Primary incident report, outage duration, affected positions, compensation, remediation, and independently verified user-loss data."
      whyItMatters: "Unquantified resilience failures could create compensation costs, churn, liquidity withdrawal, and additional infrastructure spending."
      diligencePath: "Request incident postmortems, status logs, compensation ledger, insurer or auditor review, and current sequencer-failover evidence."
      relatedQuestionRefs: [QI007]
