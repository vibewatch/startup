        - id: "treasury-buybacks"
          label: "Treasury and buybacks"
          detail: "Treasury revenue is measured after LIT buybacks and can be negative on a daily basis."
        - id: "liquidation-path"
          label: "LLP / insurance fund"
          detail: "Liquidation fees are classified as supply-side revenue rather than protocol revenue."
