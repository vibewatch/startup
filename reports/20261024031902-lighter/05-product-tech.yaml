      - [Automate trading, Use reported REST WebSocket and TypeScript interfaces, Public API and SDK surface, Enables programmatic order and data workflows, Official repository versioning uptime and adoption are unverified]
    notes: "Benefits are reported capabilities rather than independently measured outcomes; no latency, fill-quality, or availability benchmark was available."
    claimRefs: [CE004, CE006, CE008, CE015]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Critical dependency, Underwriting risk]
    rows:
      - [Wallet and collateral layer, Represent user collateral and positions, Smart contracts and Ethereum connectivity, Contract defects bridge failures or blocked exits]
      - [Matching and sequencing, Order and prioritize trades before proof submission, Matcher availability and correct sequencing, Censorship latency or single-sequencer outage]
      - [Risk and liquidation logic, Apply margin checks and liquidation state transitions, Market data cross-margin rules and circuits, Cascading liquidations or incorrect risk state]
      - [Prover and state structures, Generate proofs for matching liquidation and state changes, Circuit correctness and proof-generation capacity, Proof delay implementation defect or unavailable capacity]
      - [Ethereum verification and escape path, Verify batches and support recovery, L1 contracts data availability and recovery tooling, Congestion untested recovery time or incomplete user tooling]
    notes: "The model reconciles secondary source descriptions; it is not an official architecture diagram and does not establish control effectiveness."
    claimRefs: [CE005, CE006, CE007, CE009, CE010, CE012]
figures:
  - id: FE001
    title: Source-derived product architecture map
    type: stack
    summary: >-
      The assigned sources describe a layered path from trader interfaces through
      matching, risk logic, proof generation, and Ethereum verification.
    data:
      layers:
        - label: Client surfaces
          detail: Wallet trading interface and reported programmatic access.
          items: [Trading interface, REST and WebSocket API]
        - label: Collateral and account state
          detail: USDC collateral and position records used by the trading workflow.
          items: [Collateral contracts, Position state]
        - label: Matching and sequencing
          detail: Fast order-book processing described as occurring off-chain.
          items: [Order book, Sequencer or matching engine]
        - label: Risk processing
          detail: Margin checks and liquidations included in the proof narrative.
          items: [Margin checks, Liquidation logic]
        - label: Proof generation
          detail: Prover and state structures generate evidence for state transitions.
          items: [ZK prover, Order Book Tree and State Tree]
        - label: Ethereum verification and recovery
          detail: L1 verification and the reported escape-hatch withdrawal path.
          items: [Ethereum verifier, Escape hatch]
    approximationNotes: "Layering is analytical and source-derived; component boundaries, throughput, and failover behavior are not independently verified."
    claimRefs: [CE007, CE009, CE015]
callouts:
  - calloutType: strength
    title: Verifiable execution is the clearest technical wedge
    body: >-
      Multiple assigned sources describe matching, risk checks, or liquidations as
      zero-knowledge-proven and Ethereum-verified, differentiating the product from
      an exchange whose execution record is only internal.
    claimRefs: [CE005, CE006, CE012]
  - calloutType: risk
    title: Cryptographic verification does not eliminate availability risk
    body: >-
      Adverse reporting identifies sequencer and cross-margin stress, while no assigned
      source supplies tested failover, uptime, audit-remediation, or recovery-time data.
    claimRefs: [CE009, CE010, CE015]
