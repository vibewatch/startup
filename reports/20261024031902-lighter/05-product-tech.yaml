  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-assurance
      missingEvidence: Official architecture specifications, independent audit reports, findings, remediation status, and privacy or compliance controls.
      whyItMatters: Secondary explanations of zero-knowledge proofs do not establish circuit correctness, contract security, data handling, or control effectiveness.
      diligencePath: Obtain the official specification and current audit package, map every finding to remediation evidence, and commission independent circuit and contract review.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Twelve months of uptime, latency, proof-generation, failover, withdrawal, and incident-postmortem data.
      whyItMatters: Availability failures during volatile markets can prevent position management even when eventual state transitions are verifiable.
      diligencePath: Request SLOs and raw incident records, then run sequencer-loss, prover-delay, liquidation-load, and escape-hatch recovery tests.
      relatedQuestionRefs: [QE006, QE008]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Verified official repositories, release history, SDK test coverage, API uptime, package adoption, and named external integrations.
      whyItMatters: A claimed API and SDK do not demonstrate maintainability, reliability, or third-party developer adoption.
      diligencePath: Confirm official repositories and packages with management, inspect release and issue history, and interview two production integrators.
      relatedQuestionRefs: [QE004]
    - type: access-blocked
      severity: minor
      topic: refresh-evidence
      missingEvidence: Usable current text from the assigned FinanceFeeds mainnet-launch URL, whose prefetched body was an access-verification page.
      whyItMatters: The inaccessible refresh-recovery source cannot independently support launch, access, or architecture claims.
      diligencePath: Obtain the original article through an authorized archive or replace it in a future run with an accessible original announcement.
