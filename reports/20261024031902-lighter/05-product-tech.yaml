schemaVersion: "report-v2"
artifact: product-tech
slug: lighter
runDate: 2026-10-24
company:
  name: Lighter
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Lighter is described across the assigned evidence as an Ethereum-settled
    order-book venue whose central product claim is verifiable matching and
    liquidation through zero-knowledge proofs. The architecture is differentiated,
    but public primary documentation, audit evidence, service levels, and tested
    recovery data remain material diligence gaps.
sections:
  - id: product-surface
    title: Product surface and maturity
    body: >-
      The public product surface combines order-book perpetuals with spot, real-world
      asset, and pre-IPO markets, although the assigned evidence is secondary and
      market counts differ by publisher and vintage. Lighterpedia describes 219 active
      markets in a September 2026 review, while Alchemy describes more than 40 markets;
      neither figure should substitute for a live product inventory. DefiLlama's
      current protocol page separately tracks Perps, Spot, Bridge, LLP, and Robinhood
      Perps products, which is useful evidence that the platform has expanded beyond
      one trading screen. The investable conclusion is a broadening trading product,
      not a verified SKU count. Current market availability, leverage limits,
      eligibility, and account-tier features require confirmation against official
      documentation that was not present in the assigned pool.
    claimRefs: [CE001, CE002, CE003, CE014]
    tableRefs: [TE001]
  - id: workflow-and-integration
    title: Trading workflow and integration surface
    body: >-
      The described user workflow begins with a wallet connection and USDC collateral,
      continues through market selection and order entry, and ends with position
      monitoring or withdrawal. Lighterpedia reports market, limit, stop-loss, and
      take-profit orders, with leverage set by market; it also describes no email or
      account registration. A separate low-reputation site claims REST and WebSocket
      endpoints plus a TypeScript SDK, while Lighterpedia links to a public API
      reference. Those signals indicate a programmatic integration surface, but they
      do not establish an official repository, version policy, uptime commitment, or
      external developer adoption. Integration diligence should therefore test the
      live API and SDK rather than crediting documentation claims as production
      reliability evidence.
    claimRefs: [CE001, CE004, CE008]
    tableRefs: [TE002]
  - id: architecture
    title: Architecture and technical differentiation
    body: >-
      The consistent architectural theme is a hybrid order book: fast matching occurs
      away from Ethereum, while zero-knowledge proofs and Ethereum verification are
      intended to make execution and state transitions auditable. Gate Learn describes
      off-chain matching followed by batching into a zk-rollup; Alchemy says fills,
      risk checks, and liquidations are proven in circuits and verified on L1. Gate's
      technical overview adds a prover and specialized order-book and state-tree data
      structures. These accounts explain the intended performance-verifiability trade,
      but they come from ecosystem publishers and exchange-affiliated education rather
      than Lighter's own technical specification. The architecture map is consequently
      a source-derived operating model, not a validated topology, benchmark, or
      security assessment.
    claimRefs: [CE005, CE006, CE007, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: reliability-and-assurance
    title: Reliability, recovery, and assurance gaps
    body: >-
      Reliability is the central technical underwriting risk. AINvest reports that a
      single-sequencer dependency became a bottleneck during an October 2025 crash and
      that cross-asset margin dynamics amplified deleveraging; these are adverse
      third-party claims, not verified incident totals. Lighterpedia and Gate Wiki
      describe an escape hatch that should permit Ethereum-based withdrawal if the
      sequencer is unavailable, but the assigned evidence provides no tested recovery
      time or failure drill. DefiLlama shows live activity and a multi-product footprint
      as of the run date, which supports current operation but cannot prove uptime,
      liquidation correctness, privacy, compliance, or audit remediation. Investment
      diligence should require official architecture, audit, status, incident, and
      control evidence before treating cryptographic verifiability as end-to-end
      operational safety.
    claimRefs: [CE009, CE010, CE011, CE013, CE015]
