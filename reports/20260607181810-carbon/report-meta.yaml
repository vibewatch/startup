  productSummary: >-
    Carbon sells an integrated DLS platform spanning M-series and L1 printers, Design Engine and production software,
    a proprietary resin portfolio, and workflow tools for prototyping through production-scale manufacturing.
  customerFocus: >-
    Brands and manufacturers in footwear, helmets, cycling, dental/oral health, medtech, industrial, and automotive
    applications that need customized polymer parts at production quality.
  businessModel: >-
