companyProfile:
  summary: >-
    Carbon is a Redwood City-based 3D printing and digital manufacturing company founded in 2013 that commercializes
    Digital Light Synthesis (DLS), an integrated platform of printers, software, and photopolymer materials for end-use
    production. The company now operates under an Office of the CEO led by Philip DeSimone and Craig Carlson, with Ellen
    Kullman as Executive Chair, and has built production deployments across footwear, helmets, cycling, dental, medical,
    and industrial applications.
