- id: sizing-lenses
  title: TAM, industrial filters, and Carbon-core SAM
  body: Public sizing evidence proves the market matters, but it does not support a single canonical TAM. Retained 2026 lenses
    range from $28.27 billion at The Business Research Company and $28.55 billion at Fortune to $34.45 billion at Mordor,
    $34.85 billion at Precedence, and $48.76 billion at Future Market Insights. Those are not small methodological differences;
    they reflect materially different inclusion rules, forecast horizons, and treatment of industrial versus consumer and
    services versus hardware. The more stable takeaway is that industrial systems still take the majority of revenue and polymer
    remains one of the largest material families, while photopolymers themselves form a fast-growing subsegment measured around
    $1.6 billion in 2026 by Precedence. Using those filters to strip away desktop, metal-heavy, and clearly non-Carbon adjacencies
    yields a pragmatic Carbon-core SAM of about $8 billion to $15 billion. A current SOM can only be illustrated, not verified,
    because public sources bracket Carbon revenue broadly at $100 million to $500 million without confirming ARR or segment
    mix.
