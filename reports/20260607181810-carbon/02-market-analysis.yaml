- id: buyer-map
  title: Buyer, user, and payer motion across Carbon's visible verticals
  body: 'Carbon''s buyer motion is cross-functional and differs by end market. In footwear and protective gear, the sponsor
    is usually a product, innovation, or category leader trying to ship premium, customized, or performance-differentiated
    products; the end user is the athlete or consumer; the payer is often the end customer through premium pricing or the
    brand through a protected-margin launch. In dental, the visible workflow centers on labs and clinicians: labs run production,
    clinicians specify appliances, operations owners care about uptime and throughput, and the payer logic is tied to lab
    economics and downstream patient demand rather than a single software budget. In automotive and service parts, the sponsor
    is often engineering, aftersales, or operations leadership trying to avoid tooling, shorten lead times, or localize low-volume
    production. Carbon''s Powered by Carbon network adds one more layer: some buyers do not want to own printers at all and
    instead route work through contract manufacturers or production partners, which widens the company''s practical channel
    beyond printer placements.'
