  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: carbon-som
    missingEvidence: Exact ARR or revenue, installed-base counts, materials/software mix, and vertical revenue contribution
      by footwear, dental, automotive, and contract manufacturing.
    whyItMatters: Without private revenue and segment data, current SOM is only a scenario shell and cannot be underwritten
      as a verified market-share fact.
    diligencePath: Request a cohort by customer, printer, material, and vertical showing recurring revenue, consumables pull-through,
      and gross margin by segment.
    relatedQuestionRefs:
    - QM023
    - QM024
  - type: conflicting-data
    severity: material
    topic: tam-boundary
    missingEvidence: A normalized publisher cut that reconciles what each analyst includes in additive manufacturing, industrial
      systems, services, and consumer or desktop spend.
    whyItMatters: The outer-shell TAM range is too wide to use blindly; valuation depends on whether Carbon is benchmarked
      against total AM or a narrower industrial polymer shell.
    diligencePath: Obtain full paid tables from one or two lead publishers and rebuild a normalized TAM bridge that separates
      industrial, desktop, materials, software, and services.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: competitive-overlap
    missingEvidence: Public pricing, utilization, and lost-win evidence showing where desktop polymer farms, Formlabs-like
      stacks, or other industrial platforms displace Carbon.
    whyItMatters: Desktop polymer growth is a real market signal, but the degree of overlap with Carbon's higher-performance
      applications remains unclear and affects margin durability.
    diligencePath: Ask management for competitive win/loss data, replacement rates, and part-level economics by application
      class versus lower-cost polymer alternatives.
    relatedQuestionRefs:
    - QM017
    - QM025
  - type: private-evidence-only
    severity: material
    topic: vertical-mix
    missingEvidence: Current revenue mix by footwear, dental, automotive, protective gear, and production-partner channels.
    whyItMatters: A modeled $8 billion to $15 billion SAM is only useful if investors know which slices Carbon is actually
      penetrating and which are still aspirational.
    diligencePath: Request the current pipeline and installed-base split by vertical, production partner, and direct versus
      indirect go-to-market motion.
    relatedQuestionRefs:
    - QM011
    - QM024
    relatedTableRefs:
    - TM003
