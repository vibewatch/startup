tables:
- id: TM001
  title: Market definition
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Broad additive manufacturing outer shell
    - Printers, materials, software, services, and contract production across AM technologies
    - Consumer hobby spend, CNC, molding, casting, and raw-material extraction
    - Varies by vertical and procurement model
    - Useful only as a top-level TAM shell, not as Carbon's true addressable market.
  - - Industrial polymer / photopolymer production
    - Industrial DLP, SLA, CLIP/DLS, lattice design, production software, and production-part workflows
    - Desktop hobby printers and non-production classroom use
    - Manufacturing, product, operations, or innovation owner
    - Closest public shell for Carbon because DLS is sold as an industrial production platform.
  - - Footwear and consumer performance products
    - Custom midsoles, insoles, protective gear, lattices, and outsourced production support
    - Generic foam tooling, standard molded goods, and non-custom SKUs
    - Brand innovation team; consumer or brand ultimately pays
    - Matches Carbon's visible customization and protective-gear proofs.
  - - Dental and medical-adjacent appliances
    - Dental models, splints, dentures, aligner workflows, surgical guides, biocompatible polymer parts
    - Legacy manual lab work, unrelated clinic software, and generalized medtech spend
    - Lab owner, clinician, or operations leader; lab economics usually pay
    - Production-scale dental is one of Carbon's clearest industrial polymer use cases.
  - - Automotive / industrial service parts
    - Validated low-volume parts, connectors, jigs, fixtures, and service components
    - High-volume mass production better served by molding or machining
    - Engineering, aftersales, or operations owner
    - Important because Carbon is strongest when tooling avoidance and speed matter.
  - - Contract manufacturing / partner network
    - Production-part outsourcing through service bureaus and Powered by Carbon partners
    - Printer placements the customer never intends to outsource
    - Procurement or supply-chain owner buying finished parts
    - Extends Carbon's reach beyond direct printer ownership into manufacturing services.
  notes: 'Boundary logic is workflow based: spend counts only when it supports industrial polymer additive workflows that
    could plausibly use Carbon''s DLS stack or its partner network.'
