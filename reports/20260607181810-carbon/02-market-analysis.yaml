- id: drivers-and-constraints
  title: Growth drivers, adoption constraints, and diligence edge
  body: 'The demand case for Carbon''s category is strongest where additive manufacturing solves a specific production problem:
    mass customization, spare-part localization, performance lattices, or regulated geometry that would be awkward to tool
    conventionally. Carbon''s own footwear, dental, automotive, and helmet examples show that these are not hypothetical applications.
    Independent 2026 commentary from TCT, Engineering.com, 3D Printing Industry, Wohlers, and Stratasys also points to a market
    that is maturing away from hype toward utilization, repeatability, and production economics. That same evidence highlights
    the main headwinds. Printer and material economics still need to beat incumbent methods at the application level; post-processing
    and traceability still limit automation; regulated medical or automotive programs need validation and qualification; and
    policy issues such as tariffs, procurement reform, certification, and adversarial supply chains can change buyer timing.
    Desktop polymer growth is simultaneously a tailwind and a warning: it proves broader industrial comfort with polymer AM,
    but it may also compress simpler applications that do not require Carbon''s higher-performance stack.'
