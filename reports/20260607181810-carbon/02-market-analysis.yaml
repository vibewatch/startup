- id: TM004
  title: Growth drivers / constraints
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Mass customization in footwear and dental
    - up
    - now
    - Strengthens Carbon where geometry and personalization replace fixed tooling
    - Request attach rates, repeat order data, and margin by customized product family.
  - - Supply-chain reshoring and localization
    - up
    - now to 3 years
    - Supports North American partner capacity and service-part programs
    - Ask what portion of pipeline is explicitly tied to reshoring or tariff mitigation.
  - - Materials innovation and biocompatible resins
    - up
    - now to 5 years
    - Expands regulated and performance-sensitive applications
    - Review material qualification roadmap, FDA/biocompatibility evidence, and obsolescence risk.
  - - Cost-per-part reductions and software maturity
    - up
    - now to 3 years
    - Moves additive from prototyping into production buying committees
    - Request apples-to-apples part-level economics against molding or machining for top SKUs.
  - - Sustainability and resource-efficiency mandates
    - up
    - multi-year
    - Improves the narrative for lighter parts, digital inventory, and localized production
    - Ask how often sustainability is a deal catalyst versus just a supporting sales message.
  - - Industrial printer and materials capex
    - down
    - persistent
    - Limits deployment to applications with clear throughput or tooling-avoidance ROI
    - Request payback period and utilization assumptions for each core vertical.
  - - Post-processing and automation bottlenecks
    - down
    - persistent
    - Can turn a good printer application into a bad factory workflow
    - Inspect labor content, cure/wash bottlenecks, and automation roadmap at customer sites.
  - - Traceability, repeatability, and regulatory validation
    - down
    - persistent
    - Slows entry into medical and production automotive programs
    - Request process-capability data, validation packets, and quality-system evidence.
  - - Policy, tariffs, procurement reform, and certification rules
    - down
    - current
    - Can delay defense, biomedical, and reshoring programs despite strategic interest
    - Map which opportunities depend on public procurement or tariff-sensitive import assumptions.
  - - Low-cost desktop polymer competition
    - mixed
    - current
    - Expands general comfort with polymer AM but may pressure simpler applications
    - Ask where Carbon still wins decisively on throughput, material properties, and quality control.
  notes: This table mixes true demand drivers with execution constraints because Carbon's valuation depends on whether adoption
    converts from technical possibility into repeatable factory economics.
