chapter:
  number: 2
  title: Market Analysis
  summary: Carbon sells into a large but definition-sensitive additive manufacturing market where broad 2026 TAM estimates
    range from roughly $28 billion to $49 billion depending on what publishers include. The better underwriting lens is a
    narrower industrial photopolymer SAM of roughly $8 billion to $15 billion across footwear, dental, protective gear, automotive,
    and contract-manufacturing workflows, with adoption pulled by customization and reshoring but slowed by automation, validation,
    and cost discipline.
sections:
- id: market-boundary
  title: Market boundary and the real category Carbon serves
  body: 'Carbon should not be underwritten against the entire additive-manufacturing universe. The broad market shells retained
    here include hardware, materials, software, and services across dozens of technologies and use cases, while some publishers
    explicitly exclude consumer-grade desktop printers and conventional subtractive or molding equipment. Carbon''s own DLS,
    materials, footwear, dental, and automotive pages point to a much narrower commercial reality: the company wins where
    industrial polymer parts need end-use performance, geometric freedom, or data-driven customization rather than one-off
    hobbyist prototyping. That pushes the relevant boundary toward industrial polymer and photopolymer workflows for lattices,
    dental appliances, service parts, and outsourced production runs. The practical substitute set is also workflow-specific.
    A footwear brand can stay with foam tooling and standard sizes; a dental lab can keep legacy resin tools; an automotive
    supplier can keep machining, molding, or low-volume tooling. Carbon therefore competes inside a production-method decision,
    not across every dollar of additive manufacturing spend.'
