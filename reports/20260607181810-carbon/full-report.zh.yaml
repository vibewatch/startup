      - number: '4.4'
        title: $60M 融资是通向现金流转正的桥，不是资产负债表已解决的证明
        blocks:
          - type: paragraph
            body: >-
              Carbon 2025 年末融资，是资本充足性上的核心财务事实。公司和 PR Newswire 宣布 $60M 融资，由 Sequoia Capital、Silver Lake、adidas、Baillie
              Gifford、Madrone 和 Northgate 等现有投资者领投，并称资金将支持产能扩张、新产品，以及向现金流为正运营迈进。TCT
              的反向解读重要，因为它称公司最近裁掉了相当数量员工，正以现金流为正运营为目标，且未披露裁员规模。SEC Form D 文件显示更早的豁免股权发行，包括一份 2019 年关于 $300M 发行的通知，申报时已售出约
              $120M，以及更早的 2018、2016 和 2015 年通知。文件本身证明公司长期依赖股权融资，但不披露 2026 年手头现金、月度烧钱、债务、客户预付款、营运资本需求，或这座 $60M 桥是否足以在没有
              IPO 或另一轮私募融资的情况下支撑公司。因此，资本结论是有条件的：投资者支持很强，但在 Carbon 展示真实现金流为正结果前，融资依赖仍然存在。
