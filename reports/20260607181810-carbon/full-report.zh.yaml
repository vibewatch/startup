        title: 图景：Carbon 被直接牙科同行和相邻生产替代方案夹击
        blocks:
          - type: paragraph
            body: >-
              Carbon 的竞争场不是一场单纯的打印机对打印机比赛。直接对手是能与同一批实验室、诊所和生产团队沟通的牙科和光聚合物厂商：Formlabs、3D Systems、Stratasys、Desktop
              Health、SprintRay、Asiga 和 LuxCreo。相邻对手同样重要，因为买方往往先从零件要求出发，而不是信奉某种技术。热塑性粉末床经济性、耐用性或材料复用比 DLS
              表面光洁度或光聚合物弹性更重要时，EOS 和 HP Multi Jet Fusion 就会竞争。目标是强度的工业复合材料任务中，Markforged 会竞争。Align
              这类规模化牙科既有企业以及传统制造，是内部自建或维持现状的替代方案。由此形成的格局拥挤，证据也不支持把 Carbon 当作唯一的生产级聚合物平台来承销。
