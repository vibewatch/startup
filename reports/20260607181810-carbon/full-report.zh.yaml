              反向证据不是 Carbon
              没有产品差异化，而是差异化可能在复利成风险投资级利润率之前，就被竞争消化或重新定价。公开增材制造同行和交易历史显示，一个行业正试图围绕更宽产品组合、披露和工业触达做整合。Stratasys 宣布以 $42.5M
              收购 Markforged，以及更早 Stratasys、Desktop Metal 和 Nano Dimension 的交易冲突，并不是 Carbon
              的直接估值标记，但强烈提醒：当增长、盈利和品类领导力令人失望时，AM 硬件故事可能剧烈降级。与此同时，Formlabs、3D Systems、Stratasys、HP、EOS、Desktop Health
