    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值立场对收入规模、毛利率、利用率和本轮价格最敏感。
    data:
      items:
        - label: 收入规模披露
          value: 5
        - label: 毛利率证明
          value: 5
        - label: 利用率 / 树脂附加率
          value: 4
        - label: 当前轮估值
          value: 5
        - label: 公开 AM 倍数环境
          value: 4
        - label: 优先权 / 稀释堆叠
          value: 4
