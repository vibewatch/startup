      - number: '1.3'
        title: 资本基础、融资历史与估值
        blocks:
          - type: paragraph
            body: >
              Carbon 自创立以来八轮累计融资约 $742M，是史上资本最充足的私有增材制造公司之一。最早披露融资发生在 2013 年 12 月，为种子轮。公司 2016 年 9 月 Series C 轮从 BMW
              Group、GE、Nikon、JSR Corp.、GV（Google Ventures）和 Sequoia Capital 融得 $81M，使当时累计融资达到 $222M，估值 $1B。2018 年 2 月的
              $200M Series D 轮将 Carbon 估值推至 $1.7B。2019 年 6 月的 $260M Series E 轮是最大一轮，确立了最后一次披露的 $2.4B 投后估值，并使当时累计融资超过
              $680M。


              最近一次融资于 2025 年 11 月 12 日宣布，由现有投资者 Sequoia Capital、Silver Lake、adidas、Baillie Gifford、Madrone 和 Northgate
              领投，规模 $60M。官方新闻稿和 Axios 独家报道均称，该轮旨在把 Carbon 过渡到现金流转正，并伴随公司「预计在 12 到 24 个月内
              IPO」的表述。公司未披露新的投后估值；目前仍可支撑的最新数字，是 2019 年的 $2.4B。


              投资者基础横跨纯财务资助方（Sequoia、Silver Lake）、战略企业（adidas，以及此前的 GE、J&J、BMW）和资产管理机构（Baillie Gifford、Fidelity）。Sequoia
              合伙人 Jim Goetz 坐在董事会，确认其仍深度参与治理。adidas 同时是投资者和 Carbon 最醒目的生产伙伴，带来潜在利益冲突角度：adidas
              的生产承诺与投资经济账交织在一起。收入和年度运行率仍未公开披露；后续章节会标出证据缺口。
