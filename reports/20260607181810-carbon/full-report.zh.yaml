  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流和定价按设计具备经常性，但实际组合仍属私有
        blocks:
          - type: paragraph
            body: >-
              Carbon 销售的是整合式生产平台，而不是一台简单打印机。公开模型有四个财务引擎：以订阅或类租赁方式访问 M
              系列打印机和连接服务；自研且验证过的光聚合物材料；嵌入订阅的软件、空中更新、监控和支持；以及通过认证制造商而非直接设备所有权来变现零件的生产伙伴或客户项目。最强的质量信号是经常性：Carbon
              自己称，订阅定价避免一次性大额资本投入，包含持续维护和软件升级，并随国家、地区和应用变化。第三方定价页面显示，老款 M2 经济性大约为三年期每年 $50,000，另加配件；3Dnatives 报告 M3
              套餐起价每年 $25,000；上述数字都是标价或公开估计，不是实现后的净价。树脂定价同样可作为成本和收入驱动因素支撑：Dynamism 引述每升 $100-$450，Carbon 牙科页面列出许多验证材料；但
              Carbon 未披露树脂附着率、耗材毛利、折扣、续约率，或按硬件、材料、软件、服务和伙伴生产拆分的收入。
