        - label: 产品证明
          value: 4
        - label: 商业模式质量
          value: 3
        - label: 财务披露
          value: 1
        - label: 估值支撑
          value: 1
        - label: 退出就绪度
          value: 2
        - label: 风险调整后建议
          value: 2
