            body: >-
              可比公司集合应当刻意让人不舒服。Stratasys 和 3D Systems 提供透明的公开文件和市场数据，但它们是成熟、增长较慢的 AM 公司，而不是私有 DLS 生产平台。Markforged
              更具警示意义：它以 $42.5M 出售给 Stratasys，凸显一家上市 AM 公司无法独立扩张时，战略价值会被压缩。这些参考不能证明 Carbon 一定低于任何单一可比公司；如果 Carbon
              的生产应用、材料附着和订阅经济性明显更强，它可能应享受溢价。它们真正证明的是，没有私下证据，过时的 $2.4B
