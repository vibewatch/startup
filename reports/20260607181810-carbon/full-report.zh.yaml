  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 细分市场：真实的垂直宽度，不同的买方
        blocks:
          - type: paragraph
            body: >-
              理解 Carbon
              客户基础，最好把它看作一组特定应用生产单元，而不是单一横向打印机市场。牙科实验室和牙科材料伙伴是运营上最具体的细分市场：付费方是实验室或牙科服务组织，临床医生和患者消费产出，用例包括假牙、矫治器模型、夜磨牙垫、导板和试戴件。鞋履、自行车和运动防护装备是品牌主导的消费品类，adidas、Selle
              Italia、fi’zi:k 和 Riddell 拥有终端客户关系，Carbon 则提供制造平台和材料 / 工作流。Ford 与 Johnson & Johnson/Ethicon 显示大型工业和医疗 OEM
              曾在专业工作流中使用 Carbon，但公开证据较旧，对当前生产的完整度较弱。分段方式对承销重要，因为续约风险、支持强度、利润率和扩张路径按垂直不同而变化；牙科实验室更像一个生产订阅 /
              支持账户，消费品牌则可能更像一个项目型 SKU 或平台依赖。
