      - number: '2.2'
        title: TAM、工业过滤器与 Carbon 核心 SAM
        blocks:
          - type: paragraph
            body: >-
              公开规模测算证明市场足够重要，但无法支撑一个唯一权威的 TAM。保留的 2026 年视角从 The Business Research Company 的 $28.27B、Fortune 的 $28.55B，到
              Mordor 的 $34.45B、Precedence 的 $34.85B，再到 Future Market Insights 的
              $48.76B。方法差异并不小；它们反映了纳入规则、预测期、工业与消费、服务与硬件处理方式的实质差别。更稳定的结论是：工业系统仍拿走收入大头，聚合物仍是最大的材料族之一，而光聚合物本身是快速增长子赛道，Precedence
              估计 2026 年规模约 $1.6B。用这些过滤器剥离桌面、重金属和明显非 Carbon 的相邻市场后，可得到务实的 Carbon 核心 SAM，大约 $8B 到 $15B。当前 SOM
              只能示意，不能验证，因为公开来源把 Carbon 收入宽泛夹在 $100M 到 $500M 之间，并未确认 ARR 或细分组合。
