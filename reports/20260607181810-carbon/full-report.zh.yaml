      - number: '4.5'
        title: 财务结论：高质量收入潜力、未证明的利润率转化，以及有意义的资本密集度
        blocks:
          - type: paragraph
            body: >-
              财务结论是：商业模式设计谨慎偏正面，但承销质量先按兵不动。Carbon
              拥有高质量收入所需的正确要素：经常性打印机订阅、软件和连接服务、自研材料、验证过的生产工作流，以及鞋履、头盔、自行车和牙科中的标志性终端应用。不过，私有披露缺口主导投资判断。IncFact 的统计收入区间
              $100M 到 $500M，以及 Tracxn 的 2026 年员工数，有助于方向性测量公司规模，但无法替代管理层披露的 ARR、GAAP 收入、毛利率、净收入留存、队列利用率、客户集中度或现金流报表。2025
              年末桥接轮和裁员背景，使利润率路径与资本密集度成为卡口尽调主题。强案例需要证据证明，材料和软件的利润率足以抵消硬件、现场支持、R&D、库存和生产零件资质认定成本。在拿出这些证据前，应把 Carbon
              视为一家拥有可信经常性收入架构的生产平台公司，而不是已证明的软件式利润率复利器。
