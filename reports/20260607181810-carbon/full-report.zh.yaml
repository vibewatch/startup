      - number: '4.3'
        title: 毛利率路径取决于利用率、树脂附着和支持杠杆
        blocks:
          - type: paragraph
            body: >-
              Carbon 的利润率路径无法公开测量，因为公司没有披露收入、毛利率、贡献利润率、生产成本、装机基础、服务成本或树脂组合。最佳经济性应出现在一个已验证工作流产生高利用率、经常性树脂使用和重复软件 /
              支持收入，同时不需要大量新增现场工程投入的时候。同一模型也可能变得资本密集：打印机被补贴、机队利用不足、客户要求定制化应用支持，或树脂和后处理良率令人失望，都会拖累经济性。外部背景偏反向：2026 年
              Wohlers/ASTM 发布稿把增材制造描述为 $24.2B 市场，但 AMPOWER 将设备、材料、零件制造、定价和投资数据列为不同市场段，进一步说明硬件本身不是利润池。Dynamism 与 Nexa3D
              的比较也展示客户会审视总拥有成本。因此，承销姿态应把收入质量与利润率证明拆开：经常性结构有吸引力，但实际毛利率耐久性需要按应用和材料拿私有队列数据验证。
