      - number: '1.4'
        title: 里程碑、合作伙伴与反向背景
        blocks:
          - type: paragraph
            body: >
              Carbon 的时间线从一项实验室洞察开始——2013 年创立，基础是 Alex Ermoshkin 和 Joseph DeSimone 关于把氧气作为光聚合过程控制变量的想法——随后到 2015 年 3
              月的标志性 Science 论文（Vol. 347, Issue 6228）、DeSimone 在 TED2015 上超过 4.2M 次观看的演讲，以及一连串大型工业合作公告。


              adidas 合作始于 2017 年，已经扩展到数百万个鞋履部件，如今涵盖 Climacool 系列和一款全 3D 打印跑鞋。自行车领域，Carbon 技术已生产近 100 万个 3D 打印车座；2025 年
              Tour de France 前 10 名车手中有 6 人使用 Carbon 平台制造的车座。Riddell 的 Carbon 加持橄榄球头盔连续六年在 NFL/NFLPA 实验室测试中排名
              #1。牙科领域，Carbon 客户每周生产数百万个定制 3D 打印零件，公司连续六年被 NADL 评为 #1 最可靠打印机。2026 年 5 月，Carbon 宣布 DDK 成为其首个 Tier 1
              亚洲专属车座制造伙伴，显示公司正在推动供应能力的地域多元化。


              反向背景重要，但不构成生存性问题。TCT Magazine 2025 年 11 月指出，Carbon 在最新融资前不久裁掉了相当数量员工；具体裁员人数未获公开确认。Phil DeSimone 2025 年向
              3DPrint.com 承认，2023 年增材制造行业失败的 M&A 潮损害了投资者对该品类的信心。公司 13 年累计融资 $742M 却尚未实现盈利，是 IPO 尽调中的重要资本效率问题。Tracxn
              报告称，截至 2026 年 5 月公司有 517 名员工，低于裁员前暗示的更高员工数；Carbon 的法律实体注册地址显示，其注册名称为 Carbon3d, Inc.（CIN: 461897013）。
