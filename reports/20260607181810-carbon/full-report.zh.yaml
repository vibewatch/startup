  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 额外融资需求
        - 在已验证现金流转正运营之前又开启新一轮融资
        - 表明 $60M 过桥资金不够，优先股堆叠可能恶化
        - 倾向回避，除非条款保护性很强
      - - 利用率 / 材料拉动偏弱
        - 核心应用里的打印机利用率低，或树脂绑定率低
        - 削弱经常性收入和毛利率逻辑
        - 下调估值倍数，暂停投资
      - - 陈旧估值要价
        - 进入价格锚定在接近 $2.4B，但没有收入证明
        - 忽视公开 AM 倍数压缩和不透明折价
        - 拒绝该价格，或要求大幅重置
      - - 反向老股 / 降价轮信号
        - 近期要约、老股交易或定价轮显著低于上一估值标记
        - 确认市场重估，也可能带来员工 / 投资者压力
        - 只从当前价格重建模型
      - - IPO 准备度失败
        - 没有审计收入规模、内控或客户集中度材料包
        - 退出时间变得投机，非流动性折价上升
        - 要求更长持有期和更低进入估值
    notes: 否决触发项把未解决的尽调问题转成明确的投委会决策规则。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV043
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 财务模型
        - ARR、GAAP 收入、毛利率、收入结构、烧钱速度、现金、现金跑道
        - 需要用这些指标把公开业务进展转成估值
        - 要求提供审计财务、管理层模型和董事会材料
      - - 队列经济性
        - 按应用拆分的打印机利用率、树脂绑定、续约 / 流失、服务成本
        - 验证经常性模式赚的是软件式利润率，还是硬件式利润率
        - 分析牙科、鞋履、运动防护、骑行和工业队列
      - - 股权结构表
        - 2025 年融资条款、清算优先权、期权池、债务、SAFEs、老股 / 要约定价
        - 决定普通股价值和稀释风险
        - 审查法律文件、瀑布分配和备考持股
      - - 客户集中度
        - 头部客户、合同期限、续约条款、SLA / 质保敞口
        - 旗舰应用可能掩盖集中度或定制化经济性
        - 审查匿名账户队列和客户协议
      - - 退出准备度
        - 审计、内控、董事会结构、收入确认、IPO 时间线
        - 退出倍数取决于上市公司准备度
        - 要求 IPO 准备清单和投行反馈
    notes: 尽调要求只限于会改变建议或进入价格的证据。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV039
      - CV043
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Carbon 的发展脉络从 2013 年成立开始，经过科学论文发表、战略企业合作、四轮主要融资、两次治理交接，到 2025 年 IPO 前资本桥接。
    data:
      items:
        - date: 2013-12
          label: Carbon 成立
          detail: 六位联合创始人在 Redwood City, CA 围绕 CLIP 光聚合技术创立 Carbon。
          tone: positive
        - date: 2015-03
          label: CLIP 论文登上 Science + TED 演讲
          detail: 研究发表于 Science（Vol. 347）；Joseph DeSimone 的 TED2015 演讲获得 4M+ 次观看。
          tone: positive
        - date: 2016-09
          label: Series C — $81M，估值 $1B
          detail: BMW、GE、Nikon、JSR Corp.、GV 和 Sequoia 投资；国际扩张开始。
          tone: positive
        - date: '2017'
          label: adidas 合作启动
          detail: Carbon 与 adidas 开始规模化鞋履生产；最终达到数百万个部件。
          tone: positive
        - date: 2018-02
          label: Series D — $200M，估值 $1.7B
          detail: Silver Lake、Baillie Gifford、Fidelity、GE、J&J 等投资；估值翻倍。
          tone: positive
        - date: 2019-06
          label: Series E — $260M，估值 $2.4B
          detail: 最大一轮融资；最后一次披露估值；Madrone、Temasek、JSR 等参与。
          tone: positive
        - date: 2019-11
          label: Ellen Kullman 出任 CEO
          detail: 计划内接班；Joseph DeSimone 转任执行董事长。
          tone: neutral
