        blocks:
          - type: paragraph
            body: >-
              公开牵引故事最强的部分，是生产用例，而不是已披露美元收入。Carbon 提到 adidas 鞋履已达数百万个部件，Riddell 头盔内衬连续六年在 NFL/NFLPA 测试中高排名，骑行车座有专门的亚洲
              Tier 1 生产伙伴，牙科客户每周生产数百万个定制零件。信号本身意味着重复工作流、重复树脂消耗，以及比一次性原型销售更持久的服务 /
              支持关系。销售动作看起来也由企业客户牵引：客户需要应用工程、验证、材料选择、生产零件资质认定，有时还需要认证生产伙伴。它支撑更高合同价值，但很可能抬高 CAC、解决方案工程成本和实施周期。由于 Carbon
              不公开 bookings、销售员工数、赢率、CAC 回本周期、利用率、机队规模、出货量或按客户拆分的收入，本章使用公开伙伴规模、定价表面、员工数和融资姿态做代理，而不把它们当作已验证销售效率指标。
