  - id: TM004
    title: 增长驱动因素 / 约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 鞋类和牙科的大规模定制
        - 上行
        - 当前
        - 在几何结构和个性化替代固定模具的场景，Carbon 更占优
        - 索取各定制产品族的附加率、复购数据和利润率。
      - - 供应链回流和本地化
        - 上行
        - 当前至 3 年
        - 支撑北美合作伙伴产能和维修零件项目
        - 询问销售管线中有多少机会明确绑定供应链回流或关税缓释。
      - - 材料创新和生物相容树脂
        - 上行
        - 当前至 5 年
        - 拓宽受监管和性能敏感应用
        - 审阅材料认证路线图、FDA / 生物相容性证据和淘汰风险。
      - - 单件成本下降和软件成熟
        - 上行
        - 当前至 3 年
        - 把增材制造从原型制作推入生产采购委员会
        - 索取头部 SKU 与注塑或机加工逐项可比的单件经济性。
      - - 可持续和资源效率要求
        - 上行
        - 多年
        - 让轻量化零件、数字库存和本地化生产的叙事更顺
        - 询问可持续性多常成为成交催化剂，而不只是辅助销售信息。
      - - 工业打印机和材料资本开支
        - 下行
        - 持续
        - 只有产能或避免开模 ROI 清晰的应用才会部署
        - 索取每个核心垂直的回本周期和利用率假设。
      - - 后处理和自动化瓶颈
        - 下行
        - 持续
        - 可能把好的打印机应用变成糟糕的工厂工作流
        - 到客户现场核查人工占比、固化 / 清洗瓶颈和自动化路线图。
      - - 可追溯性、可重复性和监管验证
        - 下行
        - 持续
        - 拖慢进入医疗和量产汽车项目
        - 索取过程能力数据、验证包和质量体系证据。
      - - 政策、关税、采购改革和认证规则
        - 下行
        - 当前
        - 即便战略兴趣明确，也可能拖延国防、生物医学和供应链回流项目
        - 梳理哪些机会依赖公共采购或对关税敏感的进口假设。
      - - 低价桌面聚合物竞争
        - 混合
        - 当前
        - 提升市场对聚合物增材制造的总体接受度，但可能挤压简单应用
        - 询问 Carbon 在产能、材料属性和质量控制上仍然明显胜出的场景。
    notes: 本表把真实需求驱动和执行约束放在一起，因为 Carbon 的估值取决于采用能否从技术可行转成可重复的工厂经济性。
