  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：继续研究，估值立场偏高 / 未知
        blocks:
          - type: paragraph
            body: >-
              仅靠公开证据，Carbon 不是一个干净的买入标的，因为决定估值的输入要么过时、要么未披露、要么只能间接观察。正向投资逻辑真实存在：Carbon 拥有差异化 DLS
              平台、订阅加材料的经常性架构、苛刻终端市场中的生产证明，以及现有蓝筹投资者的新支持。反向逻辑同样具体：最新 $60M 融资没有披露估值，TCT 把融资与现金流转正目标和裁员背景联系起来，Carbon
              也不披露收入、ARR、毛利率、现金、烧钱速度、优先股堆叠、客户集中度或队列利用率。因此，编码建议是继续研究，置信度中低、风险高；估值立场是在过时的 2019 年 $2.4B 标记上偏高，但在未披露的 2025 年
              11 月轮价格上未知。决策含义是价格纪律，不是放弃：只有管理层能提供财务和股权结构表证据，让当前价格在压缩后的上市 AM 可比公司面前站得住，才继续尽调。
