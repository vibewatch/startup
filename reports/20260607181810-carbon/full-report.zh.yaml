  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发项
    rows:
      - - 乐观
        - 收入超过 $150M，利用率高，树脂绑定强，毛利率改善
        - 可能支撑较公开 AM 倍数的溢价和 IPO 期权价值
        - 未公开的审计财务显示增长和现金流转正轨迹
        - IPO 推迟，且需要再融一轮
      - - 基准
        - 现金跑道延伸到现金流转正目标，但收入和利润率证明仍未公开
        - 采用折价后的公开 AM 倍数区间；不采信 $2.4B 的陈旧估值标记
        - 现有投资者继续支持，但不披露价格
        - 股权结构表显示惩罚性条款
      - - 悲观
        - 收入低于 $75M，或毛利率、利用率、续约指标偏弱
        - 降价轮或战略出售结果主导预期价值
        - 老股标记和 Markforged 出售背景成为参照点
        - 客户集中度或融资需求恶化
      - - 不交易
        - 管理层无法披露收入、利润率、现金、条款或客户队列
        - 按请求价格，新资金无法承销股权价值
        - 尽调包仍不完整
        - 投委会无法给风险定价
    notes: Carbon 收入和利润率并不公开，因此情景数值只是用于门槛判断的示例区间。
    claimRefs:
