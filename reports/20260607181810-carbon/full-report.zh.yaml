      - number: '6.5'
        title: 扩张与集中度风险：标志性证明，暴露度不透明
        blocks:
          - type: paragraph
            body: >-
              Carbon 的扩张逻辑有吸引力，但对集中度敏感。平台可以先落地一个合格应用，再扩展到相邻产品线、头盔线、牙科材料、实验室工作流或车座型号。Riddell
              的扩展表述、牙科材料合作和自行车产品宽度都能看到扩张路径。风险在于，公开证明围绕标志性部署被策展，而 Carbon 不披露按客户、垂直、材料族或头部账户贡献拆分的收入。行业层面的反向数据进一步加重尽调负担：3D
              打印客户仍提到长交期、公差问题、材料短缺和软件不匹配等摩擦点，这些问题都可能拖慢生产部署或增加支持成本。Dentsply/Lucitone 在非 Carbon 平台上的验证也提醒，牙科材料需求并不等同于
