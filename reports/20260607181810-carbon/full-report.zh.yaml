      - number: '2.3'
        title: Carbon 可见垂直场景中的买方、用户与付费方动作
        blocks:
          - type: paragraph
            body: >-
              Carbon
              的买方动作跨职能，并且随终端市场变化。在鞋履和防护装备中，发起人通常是产品、创新或品类负责人，目标是推出高端、定制化或性能差异化产品；终端用户是运动员或消费者；付费逻辑往往由终端客户通过溢价承担，或由品牌通过受保护的利润率新品发布承担。牙科领域，可见工作流围绕实验室和临床医生展开：实验室负责生产，临床医生指定器械，运营负责人关注正常运行时间和吞吐量，付费逻辑绑定实验室经济性和下游患者需求，而不是单一软件预算。汽车和维修件领域，发起人往往是工程、售后或运营领导，希望避开模具、缩短交期或本地化小批量生产。Carbon
              的 Powered by Carbon 网络又加了一层：部分买方根本不想拥有打印机，而是把工作交给合同制造商或生产伙伴，从而让公司的实际渠道超出打印机铺设。
