  - id: TM001
    title: 市场定义
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 广义增材制造外壳
        - 跨 AM 技术的打印机、材料、软件、服务和合同生产
        - 消费者爱好支出、CNC、模压、铸造和原材料开采
        - 随垂直领域和采购模式而变
        - 只适合作为顶层 TAM 外壳，不是 Carbon 真正的可服务市场。
      - - 工业聚合物 / 光聚合物生产
        - 工业 DLP、SLA、CLIP/DLS、晶格设计、生产软件和生产件工作流
        - 桌面爱好打印机和非生产课堂使用
        - 制造、产品、运营或创新负责人
        - 最接近 Carbon 的公开外壳，因为 DLS 被当作工业生产平台销售。
      - - 鞋类和消费性能产品
        - 定制中底、鞋垫、防护装备、晶格和外包生产支持
        - 通用泡沫模具、标准模压产品和非定制 SKU
        - 品牌创新团队；最终由消费者或品牌付款
        - 匹配 Carbon 可见的定制化和防护装备证明。
      - - 牙科和医疗相邻器械
        - 牙科模型、夹板、义齿、矫治器工作流、手术导板、生物相容聚合物部件
        - 传统手工技工室工作、无关诊所软件和泛医疗科技支出
        - 技工室所有者、临床医生或运营负责人；通常由技工室经济性买单
        - 规模化牙科生产是 Carbon 最清晰的工业聚合物用例之一。
      - - 汽车 / 工业服务件
        - 已验证的小批量部件、连接器、夹具、工装和服务组件
        - 更适合模压或机加工的大批量生产
        - 工程、售后或运营负责人
        - 重要性在于，绕开模具和速度重要时 Carbon 最强。
      - - 合同制造 / 合作伙伴网络
        - 通过服务商和 Powered by Carbon 合作伙伴外包生产件
        - 客户从未打算外包的打印机部署
        - 采购或供应链负责人购买成品部件
        - 把 Carbon 的触达从直接打印机所有权延伸到制造服务。
    notes: 边界逻辑基于工作流：只有当支出支持可能使用 Carbon DLS 技术栈或合作伙伴网络的工业聚合物增材工作流时，才计入市场。
