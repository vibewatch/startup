  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 在价格和私有指标得到验证前，公开证据只支持继续尽调，不支持买入。
    data:
      nodes:
        - id: n1
          label: 生产级 AM 投资逻辑
        - id: n2
          label: 新近 $60M 过桥融资
        - id: n3
          label: 过时的 $2.4B 估值标记
        - id: n4
          label: 未公开收入 / 利润率
        - id: n5
