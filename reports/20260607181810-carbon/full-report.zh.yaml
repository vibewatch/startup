      - 正向证据
      - 反向证据
      - 什么会改变判断
    rows:
      - - 生产级 AM 领导地位
        - 融资公告和行业报道提到生产应用和内部人士支持
        - 公开来源未披露客户经济性或集中度
        - 按应用和账户拆分的客户队列数据
      - - 经常性模式
        - 订阅 / 定价材料描述打印机使用权、软件、维护、支持和材料
        - ARR、续约、流失、树脂绑定和毛利率均未披露
        - ARR 桥接表和毛利率瀑布图
      - - 融资支撑
        - $60M 内部投资者支持的融资延长现金跑道
        - 未披露估值、优先权或现金跑道；TCT 提到现金流目标背景
        - 条款清单、股权结构表和现金流转正证明
      - - 估值锚点
        - 2019 年 $2.4B 估值标记给出历史融资峰值背景
        - 公开 AM 可比公司和老股服务暗示压缩风险
        - 最新定价轮或要约收购，加经营指标
      - - 退出可选性
        - 行业报道讨论过 IPO 窗口
        - 缺少公开市场准备度数据
        - 审计报表、内控和客户集中度
