  - id: TI001
    title: 收入来源表
    columns:
      - 来源
      - 机制
      - 单位 / 定价证据
      - 当前公开状态
      - 收入质量
      - 尽调要求
    rows:
      - - 打印机订阅 / 租赁
        - 客户以订阅式套餐使用 Carbon 打印机，而不是直接购买设备。
        - 官方定价页称价格按报价并因国家和地区而异；3Dnatives 报道 M3 套餐起价 $25k/year；Dynamism 称旧款 M2 为 $50k/year，期限 3 年。
        - 只有公开标价证据；装机量和实际折扣仍属私有信息。
        - 具备经常性，但可能重依赖硬件服务。
        - 已安装打印机数量、续约率、单台打印机实际 ARR、折扣表，以及单台打印机服务成本。
      - - 连接服务与软件
        - 订阅包含围绕打印机的更新、监控、支持、维护和工作流软件。
        - Carbon 称该模式包含更新、维护、预测性支持和新材料支持。
        - 打包进订阅；独立软件收入未披露。
        - 收入质量取决于软件 / 支持能否提高留存，同时不吃掉现场工程利润率。
        - 软件收入分摊、支持毛利率、正常运行时间 SLA 成本，以及按客户队列划分的附加率。
      - - 自有和已验证树脂
        - Carbon 及合作伙伴材料按打印作业消耗，尤其用于牙科和生产应用。
        - Dynamism 称价格为 $100-$450 per liter；Carbon 列出牙科和工程材料家族，但未披露实际成交价。
        - 材料宽度公开；树脂用量和毛利率仍属私有信息。
        - 如果附加率高、替代受限，树脂可能是最强的经常性利润池。
        - 每台活跃打印机的树脂用量（liters）、按材料家族划分的收入、COGS、良率损失和客户专项返利。
      - - 生产合作伙伴 / 认证制造服务
        - 客户可以通过经认证的 Carbon 生产合作伙伴获得零件，而不必自有打印机。
        - Carbon 定价页提供合作伙伴报价；DDK 合作在亚洲提供垂直整合的车座生产。
        - 合作伙伴经济模型、抽成率和收入确认未披露。
        - 可以降低资本开支阻力，但可能要与合作伙伴分成利润。
        - 合作伙伴合同条款、抽成率、最低承诺、责任划分和收入确认政策。
      - - 应用服务与导入
        - 企业工作流需要验证、晶格设计、材料选择、后处理和生产资格认证。
        - 公开页面显示支持和认证工作流；未披露单独服务价目表。
        - 可能嵌入订阅或合作伙伴合同。
        - 有助于留存，但如果高度定制，会压低毛利率。
        - 每客户实施工时、付费与免费服务拆分，以及应用工程的贡献利润率。
    notes: 这是公开收入来源图谱；Carbon 未披露收入结构、ARR、利用率、毛利率或收入确认节奏。
