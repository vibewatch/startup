chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与平台
        blocks:
          - type: paragraph
            body: >
              Carbon, Inc.——早期品牌名为 Carbon3D——自称是一家位于 Silicon Valley
              的增材制造公司，能以规模化方式生产高性能聚合物部件。公司在多个官方渠道阐述的使命，是重塑聚合物产品的设计、工程、制造和交付方式，迈向数字化且可持续的未来。Carbon 总部位于 California 州
              Redwood City 的 1089 Mills Way，但部分 2025–2026 年新闻稿提到 CA Sunnyvale，可能意味着办公室部分整合或区域布局变化，尽调中需要核实。


              平台整合三层自研能力：硬件（M 系列和 L1 工业 3D 打印机）、软件（用于晶格设计和大规模定制的 Carbon Design Engine 与 Custom Production
              Software）以及材料（包括 EPU、RPU、DPR 和新推出 EPU Pro 50、EPU Pro 90
              在内的广泛光聚合物树脂族）。这套整合栈让客户能在不更换供应商的情况下，从原型推进到小批量，再到规模化生产——相较商品化 3D 打印服务商，这是关键差异。包括 adidas、Ford 和 Becton
              Dickinson 在内的数百家全球机构使用 Carbon 工艺。公司通过生产伙伴网络服务 17 个国家的客户。


              Carbon 的商业模式混合硬件订阅 / 租赁、材料耗材和软件访问。TechCrunch 2016
              年的早期报道写到，三年期设备租赁带来经常性收入，同时销售树脂；这种订阅优先的结构让公司有别于只卖资本设备的竞争对手。公司处于私有、后期阶段（Series E），截至 2025 年 11
              月融资完成时正接近现金流转正，并公开表示自该日期起有 12–24 个月的 IPO 窗口。
