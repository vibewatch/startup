              模块地图显示，平台有四类硬资产或类资产层：用于一般生产的 M 系列打印机、用于更大幅面工作的 L1、清洗机和 AO
              模块等生产配件，以及包含弹性、刚性、柔性、硅酮聚氨酯和牙科树脂的材料目录。软件是单独一层：Design Engine 塑造几何和晶格，打印机软件运营机队，API
              证据说明存在面向生产监控或工作流系统的集成钩子。在这个模型里，材料不是商品化附加件。RPU、FPU、EPU、SIL 和牙科树脂属于性能包络的一部分，因为 Carbon
              关于各向同性、表面光洁度和终端用途质量的主张，依赖验证过的打印与后固化配方。最终形成的 SKU 地图具备防御性，但运营要求高：每一种新材料或牙科适应症，都会增加文件、兼容性和质量控制负担。
