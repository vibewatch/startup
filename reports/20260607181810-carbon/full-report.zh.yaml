      - 倍数或估值信号
      - 与 Carbon 的相关性
      - 局限
    rows:
      - - Stratasys
        - 2025 20-F 加 Stock Analysis、CompaniesMarketCap、MarketScreener
        - 可取得公开收入和市场 / 估值比率数据
        - 最大的纯 AM 上市参照，适合看规模和经常性耗材 / 服务组合
        - 成熟上市公司，技术和增长曲线不同
      - - 3D Systems
        - 2025 10-K 加 Stock Analysis 和 CompaniesMarketCap
        - 可取得公开收入和市值数据
        - 第二个宽口径 AM 参照，反映医疗 / 工业 AM 投资者预期
        - 细分组合不同，且处在上市公司转型背景中
      - - Markforged
        - 2024 10-K、CompaniesMarketCap、Nano Dimension 出售新闻稿
        - 2026 年宣布以 $42.5M 出售给 Stratasys
        - AM 平台估值压缩下的下行战略退出参照
        - 不是 DLS；出售排除部分业务线，且发生在上市公司承压之后
      - - Carbon 2019 Series E
        - 来源：3D Printing Industry、VentureBeat、TechCrunch、SEC Form D
        - 报道口径的名义估值为 $2.4B；SEC 发行金额为 $300M
        - 历史峰值锚点和投资者质量信号
        - 已是 7 年前的估值标记；不能指示 2026 年公允价值
      - - Carbon 老股服务
        - 来源：PM Insights、PremierAlts、CB Insights
        - 较低的 2026 年隐含 / 老股估值参考和融资数据
        - 显示市场隐含的估值压缩风险
        - 权威性低于新股定价轮，且可能由模型驱动
    notes: 该清单只是部分公开可比公司集合，筛选标准是 AM 相关性和公开数据可得性。
    enumerationScope:
      coverage: partial
      basis: Public additive-manufacturing comps and Carbon valuation references available before 2026-06-07.
