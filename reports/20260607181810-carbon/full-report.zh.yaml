            body: >-
              信任姿态可信，但应窄口径解读。Carbon 发布 ISO 9001:2015 质量认证证据，牙科生态也由验证过的牙科树脂页面和围绕 FDA 许可材料的伙伴报道支撑。外部 ISO 13485、FDA 增材制造指南和
              2026 年 QMSR 背景，定义了医疗器械和牙科生产的标准注意义务；但公开来源不能证明每个客户实验室、工作流或树脂适应症都已认证或获许可。承销时，正确结论是 Carbon
