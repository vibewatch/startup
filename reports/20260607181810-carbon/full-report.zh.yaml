  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 医疗 / 牙科监管资质
        - FDA、QMSR、MDR 或合作伙伴 510(k) 问题
        - 许可失败、警告信、合作伙伴退出，或无法证明具备等同 ISO 13485 的控制
        - 暂停投资，直到质量体系和产品文件归属得到独立验证。
      - - 光聚合物化学安全
        - SDS、REACH、TSCA、OSHA 或 NIOSH 出现不利进展
        - 危害重新分类、受限物质、客户 EHS 审计失败，或被要求重新配方
        - 将增长纳入投资模型前，要求拿到重新配方计划、替代供应商和重新认证时间表。
      - - IP / 专利挑战
        - PTAB、地区法院、EPO 或许可要求
        - 禁令风险、不利权利要求解释、核心 DLS / 树脂专利被启动 IPR，或高价许可
        - 在律师审查前，下调护城河假设，并推迟 IPO 准备度假设。
      - - 客户集中度
        - 标杆客户流失或利用率下降
        - 最大客户收入占比 >20%、续约未达预期，或实质性生产迁移到竞争 AM 平台
        - 将增长质量视为未经证明，并要求披露客户队列。
      - - 硬件加订阅经济性
        - 机群利用率、毛利率、服务成本或流失偏弱
        - 利用率低于计划、经常性毛利率低于目标，或服务事故引发赔付
        - 没有队列级经济性，就不要把现金流转正路径纳入投资模型。
      - - AM 行业周期性
        - 宏观资本开支或 AM 需求放缓
        - 可比公司文件显示资本开支收缩；AMPOWER / Wohlers 增速放缓；客户推迟新增打印机
        - 对估值倍数和现金跑道做压力测试；要求更低烧钱方案。
      - - CEO 办公室执行
        - 决策权摩擦
        - 发布延迟、客户升级问题未解决，或商业 / 技术优先级冲突
        - 要求董事会层面修复治理，并指定单一责任人。
      - - 特种化学品供应链
        - 供应商中断或材料批次故障
        - 单一来源材料、质量逃逸，或一个季度内无法认证备用供应商
        - 在扩大受监管应用前，要求双来源计划和库存缓冲。
    notes: 这些触发因素被设计成可在尽调和董事会报告中按季度监测的「投资逻辑破裂」或「投资逻辑打折」条件。
    claimRefs:
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
      - CR041
      - CR042
      - CR043
      - CR044
      - CR045
  - id: TV001
    title: 投资建议摘要表
    columns:
      - 决策字段
      - 编码立场
      - 证据基础
      - 什么会改变判断
      - 主张引用
    rows:
      - - 投资建议
        - 继续研究
        - 公开证据支持平台质量，但不足以支撑有价格依据的买入
        - 私有财务、股权结构表和队列证据能支撑可辩护入场价格
        - CV020; CV040
      - - 置信度
        - 中低
        - 已审阅大量来源，但决定性财务输入仍是私有
        - 经审计收入、毛利率、现金、烧钱速度和客户集中度
        - CV041
      - - 风险评级
        - 高
        - 过桥融资、不透明度和压缩后的 AM 可比公司估值主导投资判断
        - 现金流转正证据，且没有进一步稀释轮
        - CV042
      - - 估值立场
        - 偏高 / 未知
        - $2.4B 估值已陈旧；2025 年价格未披露；老股标记更低
        - 披露的新轮融资或带经营支撑的老股 / 要约证据
        - CV021; CV022
      - - 决策含义
        - 不要按 2019 年标记定价
        - 使用区间 / 敏感性分析和尽调闸门
        - 只有私有证据通过闸门后，IC 才批准
        - CV023; CV043
    notes: 判断表仅使用公开证据；未知字段是尽调阻断项，不是零值。
