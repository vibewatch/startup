  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Carbon 真正服务的品类
        blocks:
          - type: paragraph
            body: >-
              不应把 Carbon 放在整个增材制造宇宙里估值。这里保留的广义市场外壳，覆盖硬件、材料、软件和服务，横跨数十种技术和用例；部分发布方还明确排除消费级桌面打印机以及传统减材或成型设备。Carbon 自己的
              DLS、材料、鞋履、牙科和汽车页面指向一个窄得多的商业现实：当工业聚合物零件需要终端用途性能、几何自由度或数据驱动定制，而不是一次性业余原型时，公司才赢。市场边界因此应收敛到晶格、牙科器械、维修件和外包生产批次所用的工业聚合物及光聚合物工作流。实际替代集合也随工作流变化。鞋履品牌可以继续使用泡棉模具和标准尺码；牙科实验室可以沿用传统树脂工具；汽车供应商可以继续机加工、模塑或小批量模具。Carbon
              因此是在生产方法决策里竞争，而不是争夺增材制造每一美元支出。
