  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险视图
        blocks:
          - type: paragraph
            body: >-
              Carbon 的首要风险不是某起已知诉讼或一次性产品缺陷，而是一组叠加的受监管制造风险。公司试图把自研 DLS
              平台扩展到牙科、消费、防护和工业应用，同时让树脂化学、打印机正常运行时间、已验证工作流和客户经济性保持一致。现有证据显示真实缓释项：庞大的专利资产、ISO 9001 认证、合作伙伴牙科材料获得 FDA
              放行的证据、自动化投入，以及新近 $60M 融资。残余敞口仍高，因为最关键证据都在私下：客户集中度、利用率、产品协议补救、供应商冗余，以及逐应用验证。投资含义是观察 /
              继续研究，除非尽调证明受监管牙科生产可以在不重新配方、不重新认证、也不经历另一轮稀释融资的情况下扩张。
