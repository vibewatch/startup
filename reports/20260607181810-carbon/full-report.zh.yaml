        - DLS、树脂、自动化和验证路线图需要连续性
        - 中
        - 高
        - 任命 Jason Rolland 增强技术领导力
        - 审查技术路线图、关键人员留任、继任安排和专利发明人集中度。
      - - 监管事务 / 质量
