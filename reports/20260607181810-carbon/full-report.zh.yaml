              Lucitone/Carbon 工作流能支撑面向患者的产品。当前自行车产品页面和 Riddell 持续存在的 Diamond 产品，也暗示部分应用熬过了上市阶段。但决定性的 SaaS
              式或制造平台指标缺失：公开资料没有 NRR、GRR、流失率、续约率、材料附着率、每个生产单元支持成本或客户级利用率。缺口重要，因为 Carbon
              平台很可能需要大量工作流支持、材料验证和伙伴执行；客户满意度代理不能证明经常性经济性。因此，尽调应把客户访谈和私有队列置于继续收集 logo 之上。
