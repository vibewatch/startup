      - number: '1.2'
        title: 领导层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >
              Carbon 于 2013 年 12 月由六人共同创立：Joseph M. DeSimone、Philip DeSimone、Alex Ermoshkin、Nikita Ermoshkin、Edward
              Samulski 和 Steve Nelson。Joseph DeSimone 是化学家，曾任 University of North Carolina 教授超过 20 年，也是公司前六年的首任
              CEO；市场普遍把他视为 CLIP 技术背后的主要科学发明人。2016 年，他获得 Obama 总统颁发的 National Medal of Technology and Innovation，并且是大约 20
              名同时当选美国三大国家院士机构的个人之一。


              2019 年 11 月，Ellen Kullman（DuPont 前董事长兼 CEO，任期 2009–2015 年）获任总裁兼 CEO，DeSimone 转任执行董事长。Kullman 自 2016
              年起已作为首席独立董事加入 Carbon 董事会。2022 年 6 月，Carbon 设立 CEO 办公室：Philip DeSimone 与 Craig Carlson
              被共同任命为公司联合负责人，Kullman 转任董事会执行董事长。Joseph DeSimone 留任董事会。2026 年 2 月，聚合物科学家 Jason Rolland, Ph.D. 晋升为首席技术官；他在
              Carbon 任职超过 12 年，并共同发明了双固化树脂平台。2026 年 5 月 DDK 合作新闻稿称 Phil DeSimone 为「Chief Executive Officer」，说明到 2026
              年中，双 CEO 标签可能已经收束。


              治理结构至少在两个轴线上存在关键人物集中风险：Philip DeSimone 与 Craig Carlson 共享战略和运营权力，却没有传统单一 CEO 负责制的清晰问责；Joseph DeSimone
              的科学信誉和品牌资产即便只保留董事会角色，仍然是公司叙事核心。董事会规模较大（Tracxn 称有 14 名成员），包括 Jim Goetz（Sequoia Capital）、Alan Mulally（Ford 前
              CEO）、Eric Liedtke（adidas 前高管）以及多名独立董事——这显示治理成熟度，但尽调团队应拿当前代理材料或股东材料核实。
