              2025 年 11 月融资是本章最核心的当前事实。它改善现金跑道，也释放内部人支持信号，但没有披露价格、证券类型、优先权、稀释，或公司是否已实现可持续经营现金流转正。历史 SEC Form D
              文件显示，Carbon 曾多次进入私募股权市场，包括 2019 年一份总发行额 $300M、提交时已售出约 $120M 的文件；媒体报道的 Series E 最终成为至今仍被引用的 $2.4B 估值来源。到
