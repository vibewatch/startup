  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Carbon 并不只是卖一台树脂打印机；可承销的产品，是一套受控生产工作流。客户从应用要求出发，使用 Design Engine 等 Carbon
              软件把性能意图转成可打印的晶格或表面几何，为特定打印机和材料族准备构建，通过 DLS
              打印，清洗并烘烤生坯零件，然后在验证过的生产单元中运行结果。工作流视角重要，因为差异化输出来自协同配方：数字光投影和透氧光学元件形成连续液体界面，双固化化学在打印后设定最终性能，软件 /
              自动化降低重复牙科和工业任务中的人工。机制和工作流方面，最强证据来自公司官方；独立 Science 和专利证据则佐证了 CLIP
              死区原理。最弱的公开证据不是这些部件是否存在，而是各用例中证明经济性所需的客户级良率、正常运行时间和成本数据。
