        - Dynamism 称 $50k/year、3 年最低期限、$12.5k 配件包、可选 $10k 安装 / 培训，以及可选清洗机成本。
        - 第三方标价式估算，不是 Carbon 当前报价。
        - 显示客户承诺支出高，配件 / 服务也能变现。
        - 独立经销商 / 对比来源。
      - - M3 套餐估算
        - 3Dnatives 报道 M3 纳入订阅，包含 OTA 软件、支持和维护，打印机零售价起于 $25k/year。
        - 第三方估算；具体套餐会变化。
        - 表面入门价更低，可能扩大 TAM；若材料收入不能抵消，会压低 ASP。
