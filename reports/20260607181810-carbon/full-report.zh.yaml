    claimRefs:
      - CV023
      - CV024
      - CV028
      - CV029
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 由于 Carbon 收入未披露，区间测算以估值带呈现。
    data:
      items:
        - label: 悲观情景当前股权价值
          low: 150
          high: 400
        - label: 基准情景可测算区间
          low: 400
          high: 900
        - label: 乐观情景可测算区间
          low: 900
          high: 1800
        - label: 过时的 2019 年标题估值
          low: 2400
          high: 2400
    approximationNotes: 单位为百万美元；区间是基于公开可比公司和数据缺口折价设定的情景门槛，不是正式评估。
    claimRefs:
      - CV004
      - CV016
      - CV019
      - CV022
      - CV023
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Carbon 在市场/产品证明上得分最高，在估值支撑和披露质量上最弱。
    data:
