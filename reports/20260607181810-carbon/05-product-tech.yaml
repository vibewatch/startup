artifact: product-tech
slug: carbon
runDate: '2026-06-07'
company:
  name: Carbon
chapter:
  number: 5
  title: Product & Technology
  summary: 'Carbon’s product-tech strength is a vertically integrated DLS manufacturing platform: CLIP/dead-zone physics,
    dual-cure materials, M-series/L1 hardware, Design Engine software, AO production workflow, and patent/quality controls
    reinforce one another. Public developer signal exists through API docs, GitHub, and release notes, but it is sparse and
    must be supplemented with private integration and reliability diligence.'
sections:
- id: workflow-definition
  title: Product definition in workflow terms
  body: 'Carbon is not simply selling a resin printer; the underwriteable product is a controlled production workflow. A customer
    starts with an application requirement, uses Carbon software such as Design Engine to convert performance intent into
    printable lattice or surface geometry, prepares the build for a specific printer and material family, prints through DLS,
    washes and bakes the green part, and then operates the result inside a validated production cell. That workflow framing
    matters because the differentiated output comes from the coordinated recipe: digital light projection and oxygen-permeable
    optics create the continuous liquid interface, dual-cure chemistry sets final properties after printing, and software/automation
    reduce labor in repetitive dental and industrial jobs. The strongest evidence is company-official for the mechanism and
    workflow, with independent Science and patent evidence corroborating the CLIP dead-zone principle. The weakest public
    evidence is not whether the pieces exist, but the customer-level yield, uptime, and cost data needed to prove economics
    in each use case.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE028
  - CE038
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
  - FE002
- id: module-asset-map
  title: Module, SKU, and material map
  body: 'The module map shows a platform with four hard assets or asset-like layers: M-series printers for general production,
    L1 for larger-format work, production accessories such as washers and AO modules, and a materials catalog that includes
    elastomeric, rigid, flexible, silicone urethane, and dental resins. Software is a separate layer: Design Engine shapes
    geometry and lattices, printer software operates the fleet, and API evidence suggests integration hooks for production
    monitoring or workflow systems. Materials are not commodity add-ons in this model. RPU, FPU, EPU, SIL, and dental resins
    are part of the performance envelope, because Carbon’s claims about isotropy, surface finish, and end-use quality depend
    on validated print and post-cure recipes. The resulting SKU map is defensible but operationally demanding: every new material
    or dental indication adds documentation, compatibility, and quality-control burden.'
  claimRefs:
