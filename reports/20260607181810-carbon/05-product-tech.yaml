- id: deployment-integration-roadmap
  title: Deployment, integration, support, and roadmap signal
  body: Deployment evidence is strongest in public documentation and release notes rather than in open engineering artifacts.
    Carbon Learn hosts hardware manuals and model-specific documentation for M3/M3 Max and L1, while release-note pages document
    Design Engine, printer software, and DLS API changes. The public API and GitHub repository are important developer-signal
    sources because they show that Carbon exposes some integration surface; however, that signal is intentionally sparse.
    The repository is API/client oriented, the API docs appear to require authentication for meaningful use, and there is
    no public evidence of open printer firmware, resin recipes, or a conventional public product roadmap. I treat that sparsity
    as a feature of a proprietary manufacturing platform, not as proof of weak software execution, but it does mean diligence
    should request private API docs, SLAs, uptime data, and customer integration references.
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE034
  - CE035
  - CE036
  tableRefs:
  - TE005
- id: differentiation-ip
  title: Differentiation, IP, and defensibility
  body: Carbon’s most credible differentiation is the combined mechanism/IP/materials stack. Company sources explain the oxygen
    dead zone and dual-cure chemistry; Google Patents and Carbon’s virtual patent marking page provide legal evidence that
    the CLIP concept and related products are patent-marked; and Science/TED evidence anchors the original mechanism outside
    company marketing. This does not make every later product claim automatically true, but it raises the burden for direct
    copycats that lack the same optics, resin chemistry, software workflow, and production know-how. The product-tech moat
    is therefore not a single patent number or printer spec; it is an operating recipe across hardware, chemistry, software,
    and support. The diligence implication is favorable for applications where performance and validated workflow matter,
    but less compelling where low-cost commodity photopolymer printing is sufficient.
  claimRefs:
  - CE026
  - CE027
  - CE028
  - CE029
  - CE031
  - CE032
  - CE037
  - CE038
- id: trust-quality-compliance
  title: Trust, quality, and compliance posture
  body: The trust posture is credible but should be interpreted narrowly. Carbon publishes ISO 9001:2015 quality-certification
    evidence, and the dental ecosystem is supported by validated dental-resin pages plus partner reporting around FDA-cleared
    materials. External ISO 13485, FDA additive-manufacturing guidance, and 2026 QMSR context define the standard of care
    for medical-device and dental production, but public sources do not prove that every customer lab, workflow, or resin
    indication is certified or cleared. For underwriting, the right conclusion is that Carbon has the building blocks expected
    of a production manufacturing platform—documentation, release notes, quality certification, patent marking, and regulated-use
    awareness—while still requiring private diligence on lot traceability, validation packages, field reliability, cybersecurity
    posture, and customer quality metrics.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE029
  - CE030
  - CE031
  - CE034
  - CE039
  - CE040
