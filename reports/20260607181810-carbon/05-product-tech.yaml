  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: developer-signal-gap
    missingEvidence: Authenticated API documentation, production integration examples, SLA terms, and security architecture
      for Carbon-hosted services.
    whyItMatters: Public developer-signal evidence is sparse and does not prove integration depth, uptime commitments, or
      software reliability for production customers.
    diligencePath: Request customer portal/API docs under NDA, interview two integrated customers, and review incident/SLA
      history.
    relatedQuestionRefs:
    - QE010
    - QE017
    - QE025
  - type: private-evidence-only
    severity: material
    topic: reliability-yield
    missingEvidence: Fleet uptime, print failure rates, field service response times, and cost per accepted part by printer/material/application.
    whyItMatters: Product-tech differentiation only converts to enterprise value if the workflow reliably beats incumbent
      manufacturing economics.
    diligencePath: Ask Carbon for anonymized fleet telemetry and validate against customer production logs for dental and
      industrial accounts.
    relatedQuestionRefs:
    - QE016
    - QE025
  - type: conflicting-data
    severity: minor
    topic: regulatory-scope
    missingEvidence: Per-material FDA clearance/validation matrix by geography, indication, printer, and post-processing workflow.
    whyItMatters: Public dental evidence supports a regulated-use posture but does not prove every resin or customer workflow
      is cleared.
    diligencePath: Request regulatory matrix, IFUs, biocompatibility packages, and customer-lab quality certifications.
    relatedQuestionRefs:
    - QE014
    - QE021
