- id: architecture-operating-model
  title: Architecture and operating model
  body: 'The architecture stack starts with physics: CLIP depends on an oxygen-permeable window that sustains a liquid dead
    zone so resin can flow beneath the curing part. Above that are optics, force/thermal controls, printer software, material-specific
    print parameters, post-processing equipment, and support documentation. The operating model therefore looks closer to
    a managed manufacturing platform than to open desktop printing. Carbon controls key inputs and recipes, customers receive
    documentation and support, and software release notes imply continuing changes after installation. This coupling is the
    core product-tech advantage, but it is also the dependency map: if resin supply, window performance, cloud/software access,
    or validated post-processing breaks, the customer cannot easily replace just one layer with a generic substitute.'
  claimRefs:
  - CE003
  - CE004
  - CE005
  - CE010
  - CE011
  - CE012
