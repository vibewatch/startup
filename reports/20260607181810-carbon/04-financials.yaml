  - calloutType: risk
    title: Bridge financing is not the same as capital adequacy
    body: >-
      The $60 million raise supports the path to cash-flow positivity, but layoffs, undisclosed cash burn, and absent margin data
      keep financing dependency as a live diligence risk.
    claimRefs:
