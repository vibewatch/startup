  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-mix
      missingEvidence: Audited or management-reported revenue by hardware subscriptions, connected software/services, resins, application services, and partner-produced parts.
      whyItMatters: Revenue quality cannot be underwritten without knowing which streams recur, carry margin, and renew.
      diligencePath: Request audited financials, revenue-recognition memo, ARR bridge, and revenue by product family for the last eight quarters.
      relatedQuestionRefs: [QI025]
      relatedTableRefs: [TI001, TI006]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Cohort gross margin, printer utilization, resin liters per active printer, support cost, and application-engineering hours by workflow.
      whyItMatters: Carbon's margin path depends on utilization and resin attach offsetting hardware, service, and support costs.
      diligencePath: Request cohort contribution-margin schedules for dental, footwear, helmets, cycling, and industrial customers.
      relatedQuestionRefs: [QI022, QI018]
      relatedTableRefs: [TI004, TI006]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Current cash balance, monthly burn, debt, working-capital needs, capex, runway months, and cash-flow-positive definition after the $60 million bridge.
      whyItMatters: The round is described as a bridge, so runway and financing dependency cannot be assessed from public evidence.
      diligencePath: Obtain the latest balance sheet, cash-flow statement, board plan, downside case, and covenant or debt schedules.
      relatedQuestionRefs: [QI023, QI015]
      relatedTableRefs: [TI005]
    - type: private-evidence-only
      severity: material
      topic: pricing-discounts
      missingEvidence: Realized net prices, discounting, rebates, bundle allocations, and renewal terms by geography and printer generation.
      whyItMatters: Public pricing is quote-based or third-party estimated, so list price may materially overstate revenue and margin.
      diligencePath: Request booking cohorts, realized ASP by product generation, discount approvals, and churn/renewal cohorts.
      relatedQuestionRefs: [QI024]
      relatedTableRefs: [TI002]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer revenue concentration, contract lengths, minimum commitments, termination rights, and customer-level gross margin.
      whyItMatters: Public proof is anchored in flagship accounts and partners; concentration could dominate revenue quality.
      diligencePath: Review top-20 customer schedule, contracts for adidas/Riddell/DDK/dental labs, and renewal pipeline.
      relatedQuestionRefs: [QI021]
      relatedTableRefs: [TI003, TI006]
