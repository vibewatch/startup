tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit / pricing evidence
      - Current public status
      - Revenue quality
      - Diligence ask
    rows:
      - - Printer subscriptions / leases
        - Customers access Carbon printers through subscription-style packages rather than outright equipment purchase.
        - Official pricing page says quote-based and region-specific; 3Dnatives reports M3 packages from $25k/year; Dynamism cites legacy M2 at $50k/year with three-year term.
        - Public list-price evidence only; installed base and realized discounting are private.
        - Recurring but potentially hardware-service intensive.
        - Installed printers, renewal rate, realized ARR per printer, discount schedule, and service cost per printer.
      - - Connected services and software
        - Subscription includes updates, monitoring, support, maintenance, and workflow software around the printer.
        - Carbon says updates, maintenance, predictive support, and new material support are included in the model.
        - Bundled into subscription; standalone software revenue is undisclosed.
        - Quality depends on whether software/support lift retention without consuming field-engineering margin.
        - Software allocation, support gross margin, uptime SLA cost, and attach rates by customer cohort.
      - - Proprietary and validated resins
        - Carbon and partner materials are consumed per print job, especially dental and production applications.
        - Dynamism cites $100-$450 per liter; Carbon lists dental and engineering material families but not realized prices.
        - Material breadth is public; resin volume and gross margin are private.
        - Potentially strongest recurring margin pool if attach is high and substitution is limited.
        - Resin liters per active printer, revenue by material family, COGS, yield loss, and customer-specific rebates.
      - - Production partner / certified manufacturing services
        - Customers can use certified Carbon production partners for parts rather than owning printers.
        - Carbon pricing page offers partner quotes; DDK partnership provides vertically integrated saddle production in Asia.
        - Partner economics, take rate, and revenue recognition are not disclosed.
        - Could reduce capex friction but may share margin with partners.
        - Partner contract terms, take rate, minimum commitments, liability, and revenue recognition policy.
      - - Application services and onboarding
        - Enterprise workflows require validation, lattice design, material selection, post-processing, and production qualification.
        - Public pages show support and certified workflows; no separate services price list is disclosed.
        - Likely embedded in subscription or partner contracts.
        - Valuable for retention but can pressure gross margin if bespoke.
        - Implementation hours per customer, paid versus free services split, and contribution margin on application engineering.
    notes: Public stream map; no Carbon-disclosed revenue mix, ARR, utilization, gross margin, or revenue-recognition schedule is available.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI017
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price or monetization item
      - Public evidence
      - List vs. realized status
      - Margin implication
      - Source posture
    rows:
      - - Quote-based Carbon printer packages
        - Carbon says pricing varies by country and region and asks buyers to contact an expert for a quote.
        - Realized price undisclosed.
        - Enterprise quoting can protect price but hides discounting.
        - Official company source.
      - - M2 ReFLEX / pay-as-you-print entry point
        - Carbon describes M2 ReFLEX as an affordable entry point with flexible pay-as-you-print pricing for labs.
        - Realized utilization-dependent economics undisclosed.
        - Lowers adoption friction; can defer revenue if utilization starts slowly.
        - Official company source.
      - - Legacy M2 estimated package
        - Dynamism cites $50k/year, three-year minimum, $12.5k accessory pack, optional $10k installation/training, and optional washer cost.
        - Third-party list-style estimate, not current Carbon quote.
        - Shows high committed spend and accessory/service monetization.
        - Independent reseller/comparison source.
      - - M3 package estimate
        - 3Dnatives reports M3 included in subscription with OTA software, support, maintenance, and printers retailing from $25k/year.
        - Third-party estimate; exact package varies.
        - Lower headline entry could expand TAM but pressures ASP if not offset by materials.
        - Independent product profile.
      - - Resin price range
        - Dynamism cites Carbon material pricing of $100-$450 per liter.
        - Public cost range; actual discounts and gross margin private.
        - Materials are likely recurring and margin-critical.
        - Independent comparison source.
      - - Partner-produced parts
        - Carbon directs buyers seeking part pricing to certified production partners.
        - Quote-based; Carbon take rate unknown.
        - Converts capex into outsourced production economics but may split margin.
        - Official company source.
    notes: Pricing entries mix official quote-based statements and third-party estimates; none should be read as realized net revenue.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
  - id: TI003
    title: Public traction and sales-efficiency proxy table
    columns:
      - Proxy
      - Public evidence
      - Financial read-through
      - Limitation
      - Diligence path
    rows:
      - - Footwear scale
        - Carbon says adidas has produced millions of components and expanded into Climacool.
        - Suggests repeat production, material use, and brand validation.
        - No revenue, margin, or customer concentration disclosure.
        - Contract value, annual volumes, pricing, exclusivity, and renewal terms.
      - - Dental production
        - Carbon says dental customers generate millions of custom 3D-printed parts weekly.
        - High-frequency parts can drive resin attach and subscription retention.
        - No lab-level cohort economics or resin margin.
        - Parts per printer, resin liters per lab, churn, and support tickets.
      - - Helmets
        - Carbon says its helmet lattice platform supports energy control, airflow, customization, and consolidation; Riddell partnership established a DLS liner.
        - Safety-critical validation can create switching costs.
        - Unit economics and royalty/take-rate model are undisclosed.
        - Revenue per helmet program, warranty costs, and customer concentration.
      - - Cycling saddles
        - DDK is Carbon's first saddle-specific contract manufacturer in Asia and integrates lattice printing with final saddle assembly.
        - Partner model can scale without every brand buying printers.
        - Partner revenue recognition and margin split are private.
        - Minimum volume commitments, take rate, and material supply terms.
      - - Employee base proxy
        - Tracxn reports 517 employees as of May 2026; IncFact reports 100-500 employees and $100M-$500M statistical revenue range.
        - Implies meaningful operating scale but wide efficiency uncertainty.
        - Database estimates conflict and do not disclose productivity or burn.
        - Management headcount, revenue per FTE, sales and field-support mix.
    notes: These are proxies for traction and efficiency; Carbon has not disclosed bookings, ARR, CAC, payback, or fleet utilization.
    claimRefs:
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
      - CI017
      - CI018
      - CI019
      - CI038
      - CI039
  - id: TI004
    title: Unit economics and gross-margin driver table
    columns:
      - Driver
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Installed printer utilization
        - Not disclosed.
        - low
        - Utilization determines subscription renewal quality and resin consumption.
        - Active printers, print hours, uptime, renewal cohorts, and utilization by application.
      - - Resin attach and margin
        - Resin families are public; $100-$450/liter third-party range; liters and margin undisclosed.
        - medium
        - Materials may be the recurring margin pool that offsets hardware and support.
        - Liters per printer, material COGS, scrap, discounting, and gross margin by resin family.
      - - Hardware/service support cost
        - Subscription includes maintenance, support, updates, and predictive troubleshooting.
        - medium
        - Bundled service can depress gross margin if support intensity is high.
        - Service tickets per printer, parts replacement, field labor, warranty reserve, and uptime penalties.
      - - Application engineering cost
        - Production workflows require material, design, and validation work; no cost data disclosed.
        - low
        - Bespoke onboarding can turn high-value revenue into consulting-like margin.
        - Paid services rate card, implementation hours, repeatability by workflow, and gross margin.
      - - Working capital and inventory
        - Not disclosed; business includes printers, washers, resins, and production ecosystem.
        - low
        - Hardware and resin supply can require inventory and warranty reserves before cash conversion.
        - Inventory turns, deferred revenue, customer deposits, supplier terms, and warranty provisions.
      - - Partner production economics
        - Certified partners and DDK model are public; take rate undisclosed.
        - low
        - Partner scaling may lower capex friction but shares margin.
        - Partner contracts, revenue-recognition treatment, minimums, and material exclusivity.
    notes: Null values are intentional private-data gaps; public sources do not disclose Carbon's unit economics or gross margins.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI017
      - CI022
      - CI023
      - CI024
      - CI026
      - CI027
  - id: TI005
    title: Capital adequacy table
    columns:
      - Item
      - Public evidence
      - Underwriting read
      - Unknowns
      - Diligence ask
    rows:
      - - Cash on hand
        - Not disclosed after the $60M November 2025 round.
        - Cannot compute runway.
        - Cash balance, restricted cash, debt, and customer prepayments.
        - Latest balance sheet and monthly cash report.
      - - Latest financing
        - $60M announced by Carbon and PR Newswire in November 2025, led by existing investors.
        - Strong insider support and bridge intent.
        - Valuation, liquidation preferences, security, and cash balance.
        - Financing documents and cap table.
      - - Cash-flow-positive framing
        - Carbon says the round helps it approach cash-flow positive operations; TCT says it targets cash-flow positive operations.
        - Positive if achieved, but not proof of current profitability.
        - Definition of cash-flow positive, timeframe, and one-time restructuring costs.
        - Monthly EBITDA, operating cash flow, and capex bridge.
      - - Layoffs / efficiency actions
        - TCT reported a significant workforce reduction before the raise and no disclosed reduction size.
        - Signals burn reduction but also pressure.
        - Exact headcount reduction, severance, and effect on sales/support capacity.
        - Headcount bridge, severance cash cost, and productivity plan.
      - - Earlier equity financing evidence
        - SEC Form D notices show 2019 $300M offering with about $120M sold at filing, 2018 $200M offering notice, 2016 $70M offering with $41.1M sold, and 2015 $100.1M offering notice.
        - Long equity-funded history supports capital access but raises capital-efficiency questions.
        - Current preferred stack and investor return expectations.
        - Full financing chronology, preferences, warrants, and option pool.
      - - Next-round or IPO dependency
        - 3DPrint and TCT report IPO framing around the cash-flow-positive milestone; company has not filed an S-1.
        - Exit or further financing may still be required if cash-flow positive slips.
        - IPO readiness, audit status, public-company controls, and fallback round terms.
        - Board-approved financing plan and trigger metrics.
    notes: Capital table intentionally does not restate the full Company Overview chronology; it uses local financing claims needed for financial underwriting.
    claimRefs:
      - CI001
      - CI029
      - CI030
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
  - id: TI006
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Public proxy available
      - Impact on judgment
      - Exact diligence path
    rows:
      - - GAAP revenue / ARR / revenue mix
        - IncFact statistical $100M-$500M range; CB Insights and Tracxn profiles; public production milestones.
        - Cannot underwrite scale, repeatability, or mix quality.
        - Obtain audited financials and revenue by hardware, materials, software, services, and partner production.
      - - Gross margin and contribution margin
        - Pricing surfaces and material lists only.
        - Cannot verify software-like margin path or hardware/service drag.
        - Cohort gross margin by application, resin family, partner channel, and printer generation.
      - - Burn and runway
        - $60M bridge and cash-flow-positive framing.
        - Cannot judge capital adequacy or financing dependency.
        - Monthly cash burn, cash balance, debt, capex, and downside plan.
      - - Customer concentration
        - adidas, Riddell, dental labs, DDK, and cycling partners are public.
        - Flagship proof may mask dependence on a few programs.
        - Top-10 customer revenue, renewal status, minimums, and termination rights.
      - - Sales efficiency
        - Enterprise quote model, certified partners, and employee proxies.
        - CAC/payback and sales productivity are unknown.
        - Pipeline conversion, bookings per sales FTE, CAC, implementation cost, and payback.
      - - Installed base and utilization
        - Product pages and production milestones only.
        - Hardware subscription quality and resin attach cannot be measured.
        - Printer count, active fleet, utilization hours, resin liters, and churn.
    notes: This table is a diligence workplan, not a complete KPI disclosure; Carbon remains private and does not publish the listed metrics.
