artifact: financials
slug: carbon
runDate: '2026-06-07'
company:
  name: Carbon
chapter:
  number: 4
  title: Financials
  summary: >-
    Carbon's financial profile is attractive only if its subscription printer base, proprietary resins, software/connectivity,
    and production-part ecosystems convert into repeatable gross profit. Public evidence supports real production traction and
    a late-2025 $60 million cash bridge, but revenue, ARR, gross margin, burn, cash on hand, realized pricing, and customer
    concentration remain undisclosed, so the chapter treats revenue quality as promising but not yet underwritable.
sections:
  - id: revenue-model
    title: Revenue streams and pricing are recurring in design, but realized mix is private
    body: >-
      Carbon sells an integrated production platform rather than a simple printer. The public model has four financial engines:
      subscription or lease-like access to M-series printers and connected services; proprietary and validated photopolymer
      materials; application software, over-the-air updates, monitoring, and support embedded in the subscription; and production
      partner or customer programs that monetize parts through certified manufacturers rather than direct equipment ownership.
      The strongest quality signal is recurrence: Carbon itself says subscription pricing avoids one large capital investment,
      includes ongoing maintenance and software upgrades, and varies by country, region, and application. Third-party pricing
      pages indicate older M2 economics of roughly $50,000 per year on a three-year term plus accessories, while 3Dnatives reports
      M3 packages from $25,000 per year; those are list or public estimates, not realized net price. Resin pricing is similarly
      supportable as a cost and revenue driver, with Dynamism citing $100-$450 per liter and Carbon's dental pages listing many
      validated materials, but Carbon does not disclose resin attach rates, consumable gross margin, discounting, renewal rates,
      or revenue by hardware, materials, software, service, and partner production.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: traction-and-sales-motion
    title: Public traction signals are production-scale, but sales efficiency is still a proxy exercise
    body: >-
      The public traction story is strongest in production use cases, not disclosed dollars. Carbon cites adidas footwear at
      millions of components, Riddell helmet liners that have ranked highly in NFL/NFLPA testing for six consecutive years,
      cycling saddles with a dedicated Asian Tier 1 production partner, and dental customers producing millions of custom parts
      weekly. These signals imply repeat workflows, repeat resin consumption, and service/support relationships that should be
      more durable than one-off prototype sales. The sales motion also looks enterprise-led: customers need application engineering,
      validation, material choice, production-part qualification, and sometimes certified production partners. That supports
      higher contract value but likely raises CAC, solutions-engineering cost, and implementation cycle length. Because Carbon
      does not publish bookings, sales headcount, win rates, CAC payback, utilization, fleet size, units shipped, or revenue by
      customer, this chapter uses public partner scale, pricing surfaces, employee counts, and funding posture as proxies rather
      than treating them as verified sales-efficiency metrics.
    claimRefs:
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
      - CI017
      - CI018
      - CI019
      - CI020
      - CI021
    tableRefs:
      - TI003
    figureRefs:
      - FI002
  - id: margins-and-cost-structure
    title: Gross-margin path depends on utilization, resin attach, and support leverage
    body: >-
      Carbon's margin path is not publicly measurable because the company has not disclosed revenue, gross margin, contribution
      margin, production cost, installed base, service cost, or resin mix. The economics should be best when a validated workflow
      produces high utilization, recurring resin usage, and repeat software/support revenue without requiring heavy incremental
      field engineering. The same model can become capital intensive if printers are subsidized, fleets sit underutilized,
      customers demand bespoke application support, or resin and post-processing yields disappoint. External context is adverse:
      the 2026 Wohlers/ASTM release frames additive manufacturing as a $24.2 billion market, but AMPOWER highlights equipment,
      materials, part manufacturing, pricing, and investment data as distinct market segments, reinforcing that hardware alone is
      not the margin pool. Dynamism's comparison against Nexa3D also illustrates customer scrutiny of total cost of ownership.
      The underwriting posture therefore separates revenue quality from margin proof: recurring structure is attractive, but
      actual gross-margin durability requires private cohort data by application and material.
    claimRefs:
      - CI006
      - CI008
      - CI009
      - CI022
      - CI023
      - CI024
      - CI025
      - CI026
      - CI027
      - CI028
    tableRefs:
      - TI004
    figureRefs:
      - FI003
  - id: capital-adequacy
    title: The $60 million raise is a bridge to cash-flow positivity, not proof that the balance sheet is solved
    body: >-
      Carbon's late-2025 financing is the central financial fact for capital adequacy. The company and PR Newswire announced a
      $60 million raise led by existing investors including Sequoia Capital, Silver Lake, adidas, Baillie Gifford, Madrone, and
      Northgate, and described the proceeds as supporting scale capacity, new products, and movement toward cash-flow positive
      operations. TCT's adverse read is important because it says the company had recently laid off a significant number of
      employees, was targeting cash-flow positive operations, and had not disclosed the size of the workforce reduction. SEC Form
      D filings show earlier exempt equity offerings, including a 2019 notice for a $300 million offering with roughly $120
      million sold at filing and earlier 2018, 2016, and 2015 notices. Those filings prove a long equity-financed history, but
      they do not disclose 2026 cash on hand, monthly burn, debt, customer prepayments, working-capital needs, or whether the
      $60 million bridge is enough without an IPO or another private round. The capital conclusion is therefore conditional:
      investor support is strong, but the financing dependency remains live until Carbon shows actual cash-flow-positive results.
    claimRefs:
      - CI001
      - CI029
      - CI030
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
    tableRefs:
      - TI005
  - id: verdict
    title: "Financial verdict: high-quality revenue potential, unproven margin conversion, and meaningful capital intensity"
    body: >-
      The financial verdict is a cautious positive on business-model design and a hold on underwriting quality. Carbon has the
      right ingredients for high-quality revenue: recurring printer subscriptions, software and connected services, proprietary
      materials, validated production workflows, and marquee end-use applications in footwear, helmets, cycling, and dental.
      However, private disclosure gaps dominate the investment case. IncFact's statistical revenue range of $100 million to $500
      million and Tracxn's 2026 employee count help size the company directionally, but neither replaces management-reported ARR,
      GAAP revenue, gross margin, net revenue retention, cohort utilization, customer concentration, or cash-flow statements.
      The late-2025 bridge round and layoff context make margin path and capital intensity the gating diligence topics. A strong
      case requires evidence that materials and software carry enough margin to offset hardware, field support, R&D, inventory,
      and production-part qualification costs. Until that evidence is produced, Carbon should be treated as a production-platform
      company with credible recurring revenue architecture, not as a proven software-like margin compounder.
    claimRefs:
      - CI010
      - CI011
      - CI020
      - CI021
      - CI022
