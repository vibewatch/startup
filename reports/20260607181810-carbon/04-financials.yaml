callouts:
  - calloutType: insight
    title: Revenue architecture is better than the disclosure surface
    body: >-
      Carbon has a credible recurring-revenue architecture across printer access, software/support, materials, and partner
      production, but public sources do not disclose the mix needed to prove revenue quality.
    claimRefs:
