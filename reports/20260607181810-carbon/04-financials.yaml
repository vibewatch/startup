    title: Revenue model bridge
    type: flow
    layout: wide
    summary: Carbon revenue quality improves as printer access converts into resin consumption, connected service retention, and repeat production parts.
    data:
      nodes:
        - id: customer-demand
          label: Validated production need
          detail: Dental, footwear, helmets, cycling, and industrial customers start with a part or workflow rather than a printer purchase.
          tone: positive
        - id: printer-access
          label: Printer subscription / lease
          detail: Quote-based Carbon packages reduce upfront capex and bundle support, software, and maintenance.
          tone: positive
        - id: materials
          label: Proprietary and validated resins
          detail: Recurring material consumption is tied to print volume and application qualification.
          tone: positive
        - id: services
          label: Connected software and support
          detail: Updates, monitoring, predictive support, and new materials increase retention but consume service cost.
          tone: neutral
        - id: partners
          label: Certified production partners
          detail: Partners can quote and produce parts, widening access while sharing economics.
          tone: neutral
        - id: gross-profit
