  - - Proprietary materials and validated workflows
    - Open-material dental ecosystems reduce lock-in for simpler jobs
    - High
    - Compare material margin, failure rate, and regulatory files by application
  - - Enterprise production references
    - Public incumbents offer broader disclosure and procurement trust
    - Medium
    - Request customer concentration, renewal, uptime, and installed-fleet data
  - - Dental vertical depth
    - Dental specialists optimize onboarding and application-specific workflows
    - High
    - Segment Carbon win/loss by lab size and application
  - - Industrial polymer breadth
    - HP and EOS offer thermoplastic powder-bed alternatives
    - Medium
    - Map applications where thermoplastics beat photopolymers on durability or unit cost
  - - Valuation premium
    - AM public-company consolidation and low acquisition prices reset comparables
    - High
    - Triangulate valuation against public AM multiples and realistic cash-flow breakeven
  notes: Severity is an underwriting judgment derived from retained competitor evidence rather than a disclosed vendor risk
    score.
