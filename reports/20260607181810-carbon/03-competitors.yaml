    - Chairside, labs, direct appliance workflows
    - Focused dental onboarding and application specialization
    - May lack Carbon enterprise production breadth
  - - Internal build / status quo
    - Substitute
    - Align SEC surface plus Carbon and HP workflow pages retained
    - Large dental, footwear, and industrial incumbents
    - Control of data, process, and existing manufacturing economics
    - Requires process engineering and validation capacity
