    - Indirect dental overlap versus direct photopolymer appliances
  - - Desktop Health / ETEC
    - Direct dental photopolymer peer
    - ETEC knowledge base and Envision guide retained
    - Dental labs using DLP workflows
    - Installed EnvisionTEC dental workflow knowledge
    - Corporate-parent changes may complicate strategic focus
  - - Markforged
    - Industrial substitute
    - FX20 product page and SEC issuer surface retained
    - Composite and industrial parts buyers
    - High-strength composite printing
    - Not a core dental photopolymer substitute
  - - SprintRay / Asiga / LuxCreo
    - Dental specialists
