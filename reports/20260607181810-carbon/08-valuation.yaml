slug: carbon
runDate: '2026-06-07'
company:
  name: Carbon
chapter:
  number: 8
  title: Valuation
  summary: Carbon earns a research-more recommendation rather than a buy because the production-AM thesis is credible but
    valuation support is stale or undisclosed. The chapter treats the 2019 $2.4 billion headline mark as stretched, the November
    2025 $60 million financing as a bridge with undisclosed price, and public AM comparables as a discipline check until private
    revenue, margin, cap-table, and exit-readiness evidence is produced.
sections:
- id: recommendation-and-stance
  title: 'Recommendation: research-more, with a stretched/unknown valuation stance'
  body: 'Carbon is not a clean buy on public evidence because the decisive valuation inputs are either stale, undisclosed,
    or only indirectly observable. The positive thesis is real: Carbon has a differentiated DLS platform, a recurring subscription-and-materials
    architecture, production proof in demanding end markets, and fresh support from existing blue-chip investors. The anti-thesis
    is equally concrete: the latest $60 million financing disclosed no valuation, TCT connected the raise to cash-flow-positive
    targets and workforce-reduction context, and Carbon does not publish revenue, ARR, gross margin, cash, burn, preference
    stack, customer concentration, or cohort utilization. Therefore the encoded recommendation is research-more with medium-low
    confidence, high risk, and a valuation stance of stretched at the stale $2.4 billion 2019 mark but unknown at the undisclosed
    November 2025 round price. The decision implication is price discipline, not abandonment: continue diligence only if management
    can provide financial and cap-table evidence that makes the current price defensible against compressed public AM comparables.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV020
  - CV021
  - CV022
  - CV040
  - CV041
  - CV042
