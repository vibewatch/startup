  - FV004
- id: financing-dilution-context
  title: Financing and dilution context make the round a bridge, not valuation proof
  body: The November 2025 financing is the chapter's central current fact. It improves runway and signals insider support,
    but it does not reveal the price, security, preference, dilution, or whether the company has reached sustainable cash-flow-positive
    operations. Historical SEC Form D filings show that Carbon has repeatedly accessed private equity markets, including a
    2019 filing with a $300 million total offering amount and roughly $120 million sold at filing; the media-reported Series
    E ultimately became the source of the still-cited $2.4 billion valuation. In 2026, that historical mark is a context anchor
    rather than a valuation answer. Dilution and preference overhang are material because a fresh late-stage bridge round
    can be investor-friendly even when the headline amount looks modest. The underwriting posture should require the 2025
    term sheet, pro-forma cap table, option pool, liquidation preference, debt schedule, and any secondary/tender pricing
    before assigning equity value to common or new-money ownership.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV010
  - CV028
  - CV029
  - CV033
