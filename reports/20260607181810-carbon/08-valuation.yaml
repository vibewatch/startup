  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-gap
    missingEvidence: 2025 financing term sheet, post-money valuation, preference stack, option-pool refresh, debt, and secondary
      or tender pricing.
    whyItMatters: Without the security terms and ownership waterfall, a new-money investor cannot translate enterprise value
      into common or preferred equity value.
    diligencePath: Request legal financing documents, pro-forma capitalization table, liquidation waterfall, board approval
      materials, and any secondary-market transaction history.
    relatedQuestionRefs:
    - QV034
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Audited revenue, ARR, gross margin, burn, cash runway, revenue mix, NRR, churn, and customer concentration.
    whyItMatters: These metrics determine whether Carbon deserves a premium platform multiple or a discounted hardware-heavy
      AM multiple.
    diligencePath: Obtain audited financials, monthly management accounts, cohort dashboards, and customer concentration schedules.
    relatedQuestionRefs:
    - QV014
    - QV037
    - QV038
    relatedTableRefs:
    - TV006
  - type: stale
    severity: material
    topic: valuation-history
    missingEvidence: A current primary-round, tender-offer, or independent 409A valuation that can be reconciled with operating
      metrics.
    whyItMatters: The 2019 $2.4 billion mark is too stale for 2026 entry pricing and may conflict with secondary-market indicators.
    diligencePath: Request latest 409A, investor reporting package, tender data, and any banker or board valuation materials.
    relatedQuestionRefs:
    - QV027
    - QV028
    relatedTableRefs:
    - TV004
  - type: conflicting-data
    severity: material
    topic: secondary-valuation
    missingEvidence: Reconciliation between company-supported valuation, secondary services, and any 2025 financing price.
    whyItMatters: Conflicting valuation signals can change recommendation from research-more to avoid or to price-reset diligence.
    diligencePath: Triangulate management data with cap-table records, secondary brokers, 409A provider assumptions, and recent
      investor marks.
    relatedQuestionRefs:
    - QV028
    - QV044
    relatedTableRefs:
    - TV005
