- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric / source
  - Multiple or valuation signal
  - Relevance to Carbon
  - Limitation
  rows:
  - - Stratasys
    - 2025 20-F plus Stock Analysis, CompaniesMarketCap, MarketScreener
    - Public revenue and market/valuation-ratio data available
    - Largest pure-play public AM reference for scale and recurring consumables/service mix
    - Mature public issuer with different technology and growth profile
  - - 3D Systems
    - 2025 10-K plus Stock Analysis and CompaniesMarketCap
    - Public revenue and market-cap data available
    - Second broad AM reference for healthcare/industrial AM investor expectations
    - Different segment mix and public turnaround context
  - - Markforged
    - 2024 10-K, CompaniesMarketCap, Nano Dimension sale PR
    - $42.5M announced 2026 sale to Stratasys
    - Downside strategic-exit reference for AM platform compression
    - Not DLS; sale excludes some business lines and follows public-company stress
  - - Carbon 2019 Series E
    - 3D Printing Industry, VentureBeat, TechCrunch, SEC Form D
    - $2.4B reported headline valuation; $300M SEC offering amount
    - Historical peak anchor and investor-quality signal
    - Seven-year-old mark; not a 2026 fair-value indication
  - - Carbon secondary services
    - PM Insights, PremierAlts, CB Insights
    - Lower 2026 implied/secondary valuation references and funding data
    - Shows market-implied compression risk
    - Less authoritative than primary priced rounds and may be model-driven
