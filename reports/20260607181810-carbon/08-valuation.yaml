- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Additional financing need
    - New round before verified cash-flow-positive operations
    - Signals $60M bridge was insufficient and preference stack may worsen
    - Move to avoid unless terms are highly protective
  - - Weak utilization / materials pull-through
    - Low printer utilization or low resin attach in top applications
    - Undermines recurring-revenue and gross-margin thesis
    - Cut valuation multiple and pause investment
  - - Stale valuation ask
    - Entry price anchored near $2.4B without revenue proof
    - Ignores public AM multiple compression and opacity discount
    - Reject price or require major reset
  - - Adverse secondary/down-round signal
    - Recent tender, secondary, or priced round materially below prior mark
    - Confirms market repricing and possible employee/investor pressure
    - Rebuild model from current price only
  - - IPO-readiness failure
    - No audited revenue scale, controls, or customer-concentration package
    - Exit timing becomes speculative and illiquidity discount rises
    - Require longer hold and lower entry valuation
  notes: Kill triggers convert unresolved diligence into explicit IC decision rules.
  claimRefs:
  - CV035
  - CV036
  - CV037
  - CV038
  - CV039
  - CV043
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Financial model
    - ARR, GAAP revenue, gross margin, revenue mix, burn, cash, runway
    - Needed to convert public traction into valuation
    - Request audited financials, management model, and board materials
  - - Cohort economics
    - Printer utilization, resin attach, renewal/churn, service cost by application
    - Tests whether recurring model earns software-like or hardware-like margins
    - Analyze cohorts for dental, footwear, sports protection, cycling, and industrial
  - - Cap table
    - 2025 round terms, liquidation preferences, option pool, debt, SAFEs, secondary/tender pricing
    - Determines common-equity value and dilution risk
    - Review legal docs, waterfall, and pro-forma ownership
  - - Customer concentration
    - Top customers, contract duration, renewal clauses, SLA/warranty exposure
    - Marquee applications may mask concentration or bespoke economics
    - Review anonymized account cohort and customer agreements
  - - Exit readiness
    - Audits, controls, board structure, revenue recognition, IPO timeline
    - Exit multiple depends on public-company readiness
    - Request IPO-readiness checklist and banker feedback
  notes: Diligence asks are restricted to evidence that changes recommendation or entry price.
