- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - Revenue exceeds $150M, high utilization, strong resin attach, improving gross margin
    - Could justify premium to public AM multiples and IPO-option value
    - Private audited financials show growth plus cash-flow-positive trajectory
    - IPO delayed and another round required
  - - Base
    - Runway extends to cash-flow-positive target, but revenue and margin proof remain private
    - Use discounted public-AM multiple range; no credit for $2.4B stale mark
    - Existing investors continue support but do not disclose price
    - Cap table reveals punitive terms
  - - Bear
    - Revenue below $75M or weak gross margin, utilization, or renewal metrics
    - Down-round or strategic-sale outcome dominates expected value
    - Secondary marks and Markforged sale context become reference points
    - Customer concentration or financing need worsens
  - - No-deal
    - Management cannot disclose revenue, margin, cash, terms, or customer cohorts
    - No underwriteable equity value for new money at requested price
    - Diligence package remains incomplete
    - IC cannot price risk
  notes: Scenario values are illustrative gating bands because Carbon revenue and margins are not public.
