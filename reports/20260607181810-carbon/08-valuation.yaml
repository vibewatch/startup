    - Current priced round or tender plus operating metrics
  - - Exit optionality
    - IPO window discussed in industry reporting
    - Public-market readiness data are absent
    - Audited statements, controls, and customer concentration
  notes: Arguments intentionally pair pro and con evidence so the recommendation is price-sensitive.
