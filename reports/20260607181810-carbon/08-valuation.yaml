  - TV002
  - TV006
  figureRefs: []
- id: scenario-and-sensitivity
  title: Bull/base/bear scenarios depend on private revenue scale and margin proof
  body: 'Because Carbon does not disclose revenue or margins, the scenario work must be framed as a conditional range rather
    than a precise point estimate. The bull case requires evidence that printer subscriptions, software, service, and proprietary
    materials are producing recurring, high-utilization production revenue with improving gross margins and an IPO-readiness
    timeline. The base case is narrower: the $60 million round buys time to reach cash-flow-positive operations, but valuation
    remains capped until management proves revenue scale and margin conversion. The bear case is a down-round, additional
    financing, or distressed strategic exit if public AM multiples and the Markforged sale reset buyer expectations. Sensitivity
    is therefore dominated by three variables: current recurring revenue, credible gross-margin trajectory, and the revenue
    multiple an investor is willing to pay for a hardware-plus-materials AM platform. Public sources justify the direction
    of the variables, not the point estimate.'
  claimRefs:
  - CV023
  - CV024
  - CV025
  - CV026
  - CV027
  - CV044
  tableRefs:
  - TV003
  figureRefs:
  - FV002
  - FV003
- id: comparable-set
  title: Public AM comparables argue for multiple discipline
  body: 'The comparable set should be uncomfortable by design. Stratasys and 3D Systems offer transparent public filings and
    market data, but they are mature, slower-growth AM businesses rather than private DLS production platforms. Markforged
    is even more cautionary: its sale to Stratasys for $42.5 million highlights how strategic value can compress when a public
    AM company struggles to scale independently. Those references do not prove Carbon is worth less than any single comp;
    Carbon may deserve a premium if its production applications, materials attach, and subscription economics are demonstrably
    stronger. They do prove that the stale $2.4 billion mark cannot be treated as current without private evidence. The right
    valuation method is a range using public revenue multiples, a premium only for verified recurring revenue quality, and
    a discount for opacity, cap-table complexity, and exit uncertainty.'
  claimRefs:
  - CV011
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  - CV017
  - CV018
  - CV019
  - CV030
  tableRefs:
  - TV004
  figureRefs: []
- id: exit-readiness-and-breakpoints
  title: Exit readiness, diligence asks, and thesis-break triggers
  body: 'Carbon can become exit-ready, but public evidence does not yet prove it is ready. An IPO-quality story needs audited
    revenue scale, durable gross margin, controls, predictable retention, customer concentration disclosure, board/governance
    clarity, and a credible use of proceeds that is not simply another bridge to profitability. A strategic-exit story needs
    evidence that a large industrial, dental, footwear, or AM buyer would pay for Carbon''s platform rather than wait for
    a lower private-market price. The diligence plan should be binary: request the financial model, cap table, cohort dashboard,
    customer and supplier concentration, and IPO-readiness package, then update valuation only if those materials close the
    gaps. Thesis-break triggers are also binary: another financing before cash-flow-positive proof, weak utilization or resin
    attach, a valuation ask near the stale 2019 mark without revenue support, or adverse secondary/down-round evidence that
    management cannot reconcile.'
