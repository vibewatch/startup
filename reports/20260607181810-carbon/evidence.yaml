evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: >-
      Carbon's annual revenue, annual recurring revenue, and gross margin are not publicly disclosed. No third-party
      analyst estimate or company guidance has been retained.
    whyItMatters: >-
      Revenue scale and growth rate are essential for IPO pricing, comparables analysis, and valuation chapter judgment.
      The company's cash-flow-positive claim cannot be evaluated without knowing whether the revenue base is large
      enough to support the cost structure.
    diligencePath: >-
      Request audited financial statements and management accounts in a due-diligence data room. Cross-check with
      deferred revenue schedules, materials COGS, and hardware leasing cash flows.
    relatedQuestionRefs:
      - QO021
  - type: missing-source
    severity: material
    topic: adverse-layoffs
    missingEvidence: >-
      The exact number of employees laid off before the November 2025 raise and the timing of those reductions are not
      publicly confirmed; TCT Magazine characterized them as "significant" without a number.
    whyItMatters: >-
      Scope of workforce reductions directly affects unit economics, team morale, and management capability assessment.
      A large reduction (e.g., 30%+ of headcount) would be material to company-overview and financials judgments.
    diligencePath: >-
      Obtain HR records or WARN Act filings (if applicable) in the data room. Cross-reference LinkedIn employee timeline
      data and press reports for timing.
    relatedQuestionRefs:
      - QO013
      - QO010
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: >-
      No post-money valuation was disclosed for the November 2025 $60 million round; the last publicly disclosed
      valuation of $2.4 billion dates from the June 2019 Series E — seven years before runDate.
    whyItMatters: >-
      A stale valuation makes IPO pricing discovery highly uncertain; it prevents relative valuation benchmarking and
      makes it difficult to assess dilution for earlier investors.
    diligencePath: >-
      Request the capitalization table, most recent 409A or independent valuation, and any term sheet from the November
      2025 round in the data room.
    relatedQuestionRefs:
      - QO017
      - QO004
    relatedTableRefs:
      - TO003
      - TO004
  - type: missing-source
    severity: minor
    topic: headquarters
    missingEvidence: >-
      Official press releases have used both Redwood City and Sunnyvale as Carbon's headquarters city; the current legal
      registered address and primary operational office location are not confirmed in a single authoritative source
      post-2025.
    whyItMatters: >-
      This is a low-stakes identity fact but affects later chapter accuracy, regulatory jurisdiction determination, and
      comparison to peer comps that use consistent HQ data.
    diligencePath: >-
      Review the most recent Delaware or California corporate filing or the official carbon3d.com contact page to
      confirm the current primary registered address.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: sector-valuation-comparison
    missingEvidence: >-
      No retained source directly compares Carbon's $2.4B (2019) valuation to current comparable AM sector companies
      such as Stratasys, Desktop Metal, or EOS to provide context for whether the valuation implies a premium or
      discount to public comparables.
    whyItMatters: >-
      Relative valuation context is needed to judge whether Carbon's IPO window is financially opportunistic or
      distressed, and to interpret the PE return profile for existing investors.
    diligencePath: >-
      Run a valuation comparables search for publicly traded AM companies (EV/Revenue, EV/EBITDA) and compare to
      Carbon's implied multiple using any available revenue proxies.
    relatedQuestionRefs:
      - QO017
      - QO025
  - type: private-evidence-only
    severity: material
    topic: carbon-som
    missingEvidence: >-
      Exact ARR or revenue, installed-base counts, materials/software mix, and vertical revenue contribution by
      footwear, dental, automotive, and contract manufacturing.
    whyItMatters: >-
      Without private revenue and segment data, current SOM is only a scenario shell and cannot be underwritten as a
      verified market-share fact.
    diligencePath: >-
      Request a cohort by customer, printer, material, and vertical showing recurring revenue, consumables pull-through,
      and gross margin by segment.
    relatedQuestionRefs:
      - QM023
      - QM024
  - type: conflicting-data
    severity: material
    topic: tam-boundary
    missingEvidence: >-
      A normalized publisher cut that reconciles what each analyst includes in additive manufacturing, industrial
      systems, services, and consumer or desktop spend.
    whyItMatters: >-
      The outer-shell TAM range is too wide to use blindly; valuation depends on whether Carbon is benchmarked against
      total AM or a narrower industrial polymer shell.
    diligencePath: >-
      Obtain full paid tables from one or two lead publishers and rebuild a normalized TAM bridge that separates
      industrial, desktop, materials, software, and services.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitive-overlap
    missingEvidence: >-
      Public pricing, utilization, and lost-win evidence showing where desktop polymer farms, Formlabs-like stacks, or
      other industrial platforms displace Carbon.
    whyItMatters: >-
      Desktop polymer growth is a real market signal, but the degree of overlap with Carbon's higher-performance
      applications remains unclear and affects margin durability.
    diligencePath: >-
      Ask management for competitive win/loss data, replacement rates, and part-level economics by application class
      versus lower-cost polymer alternatives.
    relatedQuestionRefs:
      - QM017
      - QM025
  - type: private-evidence-only
    severity: material
    topic: vertical-mix
    missingEvidence: Current revenue mix by footwear, dental, automotive, protective gear, and production-partner channels.
    whyItMatters: >-
      A modeled $8 billion to $15 billion SAM is only useful if investors know which slices Carbon is actually
      penetrating and which are still aspirational.
    diligencePath: >-
      Request the current pipeline and installed-base split by vertical, production partner, and direct versus indirect
      go-to-market motion.
    relatedQuestionRefs:
      - QM011
      - QM024
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable customer-level pricing, service, material margin, and accepted-part cost data for Carbon and the named
      competitors.
    whyItMatters: >-
      The retained public sources do not support a normalized list-price comparison, so pricing power cannot be
      underwritten from public evidence alone.
    diligencePath: >-
      Request Carbon win-loss files, quotes, material gross margin, and customer production economics by dental and
      industrial application.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: win-loss
    missingEvidence: >-
