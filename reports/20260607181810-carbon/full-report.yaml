            body: >-
              The strongest direct pressure is dental. Formlabs matters because its Form 4B page combines dental
              indications, Open Material Mode, reliability claims, and the striking 11-models-in-9-minutes throughput
              claim. That is exactly the kind of visible improvement that weakens a generic Carbon speed story. 3D
              Systems matters because its dental portfolio and NextDent jetted denture announcement show a public
              incumbent bringing regulated dental workflows and materials into a segment Carbon wants to defend.
              Stratasys matters because J5 DentaJet and the broader dental portfolio give labs another multi-material
              production option. Desktop Health, SprintRay, Asiga, and LuxCreo create narrower but dangerous specialist
              pressure by speaking in the operating language of dentists and labs. Carbon can still win on validated
              production recipes, but it must prove application-level economics rather than rely on category novelty.
