      - number: '8.5'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Carbon can become exit-ready, but public evidence does not yet prove it is ready. An IPO-quality story
              needs audited revenue scale, durable gross margin, controls, predictable retention, customer concentration
              disclosure, board/governance clarity, and a credible use of proceeds that is not simply another bridge to
              profitability. A strategic-exit story needs evidence that a large industrial, dental, footwear, or AM
              buyer would pay for Carbon's platform rather than wait for a lower private-market price. The diligence
              plan should be binary: request the financial model, cap table, cohort dashboard, customer and supplier
              concentration, and IPO-readiness package, then update valuation only if those materials close the gaps.
              Thesis-break triggers are also binary: another financing before cash-flow-positive proof, weak utilization
              or resin attach, a valuation ask near the stale 2019 mark without revenue support, or adverse
              secondary/down-round evidence that management cannot reconcile.
            claimRefs:
