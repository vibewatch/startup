              detail: Reformulation can trigger requalification.
            - label: low-medium
              tone: warning
              detail: No public dual-source proof.
            - label: high
              tone: negative
              detail: High residual exposure.
        - label: Customer concentration
          values:
            - label: medium
              tone: warning
              detail: Named deployments exist but revenue share is unknown.
            - label: high
              tone: negative
              detail: Flagship churn can impair utilization.
            - label: low
              tone: positive
              detail: No public concentration disclosure.
            - label: high
              tone: negative
              detail: Needs private cohort proof.
        - label: Hardware-plus-subscription economics
          values:
            - label: medium
              tone: warning
              detail: Model depends on utilization and service quality.
            - label: high
              tone: negative
              detail: Weak utilization pressures gross margin.
            - label: low-medium
              tone: warning
              detail: Recent financing helps.
            - label: medium-high
              tone: negative
              detail: Economics remain undisclosed.
        - label: IP challenge
          values:
            - label: medium
              tone: warning
              detail: Patent estate is visible.
            - label: high
              tone: negative
              detail: Adverse claim or injunction would matter.
            - label: medium
              tone: warning
              detail: Portfolio breadth mitigates.
            - label: medium-high
              tone: negative
              detail: Litigation clearance remains private.
        - label: Competitive catch-up
          values:
            - label: high
              tone: negative
              detail: Peers focus on polymer, dental, and workflow.
            - label: medium-high
              tone: negative
              detail: Catch-up can compress differentiation.
            - label: medium
              tone: warning
              detail: Validated applications help.
            - label: medium-high
              tone: negative
              detail: Moat must be proven use-case by use-case.
        - label: Office of CEO execution
          values:
            - label: medium
              tone: warning
              detail: Dual leadership can work but needs clear rights.
            - label: medium-high
              tone: negative
              detail: Launch and financing tradeoffs are time-sensitive.
            - label: medium
              tone: warning
              detail: Named leadership is visible.
            - label: medium-high
              tone: negative
              detail: Governance proof is private.
        - label: AM demand cyclicality
          values:
            - label: medium
              tone: warning
              detail: Comparable filings cite capex and macro pressure.
            - label: medium-high
              tone: negative
              detail: Printer additions can be deferred.
            - label: medium
              tone: warning
              detail: Market data shows growth.
            - label: medium
              tone: warning
              detail: Stress case remains relevant.
        - label: Privacy / contract exposure
          values:
            - label: low-medium
              tone: warning
              detail: Public policy and terms are visible.
            - label: medium
              tone: warning
              detail: Enterprise remedies are private.
            - label: medium
              tone: warning
              detail: Separate product agreements mitigate.
            - label: medium
              tone: warning
              detail: Lower than regulated materials.
    approximationNotes: >-
      Qualitative scoring from cited public evidence; private diligence can move likelihood and mitigation maturity
      materially.
    claimRefs:
