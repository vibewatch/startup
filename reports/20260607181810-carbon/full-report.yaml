        title: Differentiation, IP, and defensibility
        blocks:
          - type: paragraph
            body: >-
              Carbon’s most credible differentiation is the combined mechanism/IP/materials stack. Company sources
              explain the oxygen dead zone and dual-cure chemistry; Google Patents and Carbon’s virtual patent marking
              page provide legal evidence that the CLIP concept and related products are patent-marked; and Science/TED
              evidence anchors the original mechanism outside company marketing. This does not make every later product
              claim automatically true, but it raises the burden for direct copycats that lack the same optics, resin
              chemistry, software workflow, and production know-how. The product-tech moat is therefore not a single
              patent number or printer spec; it is an operating recipe across hardware, chemistry, software, and
              support. The diligence implication is favorable for applications where performance and validated workflow
