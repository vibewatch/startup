  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Carbon is boxed in by direct dental peers and adjacent production substitutes'
        blocks:
          - type: paragraph
            body: >-
              Carbon’s competitive arena is not a single printer-versus-printer race. The direct set is dental and
              photopolymer vendors that can speak to the same labs, clinics, and production teams: Formlabs, 3D Systems,
              Stratasys, Desktop Health, SprintRay, Asiga, and LuxCreo. The adjacent set is just as important because
              buyers often start with a part requirement, not a technology religion. EOS and HP Multi Jet Fusion compete
              when thermoplastic powder-bed economics, durability, or material reuse matter more than DLS surface finish
              or photopolymer elasticity. Markforged competes for industrial composite jobs where strength is the
              objective. Align-like scaled dental incumbents and conventional manufacturing are the internal-build or
              status-quo alternatives. The resulting landscape is crowded, and the evidence argues against underwriting
              Carbon as the only production-polymer platform.
