figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Carbon's chronology runs from a 2013 founding through scientific publication, strategic corporate partnerships,
      four major financing rounds, two governance transitions, and a 2025 pre-IPO capital bridge.
    data:
      items:
        - date: 2013-12
          label: Carbon founded
          detail: Six co-founders establish Carbon in Redwood City, CA around CLIP photopolymerization.
          tone: positive
        - date: 2015-03
          label: CLIP paper in Science + TED talk
          detail: Research published in Science (Vol. 347); Joseph DeSimone's TED2015 talk garners 4M+ views.
          tone: positive
        - date: 2016-09
          label: Series C — $81M at $1B
          detail: BMW, GE, Nikon, JSR Corp., GV, and Sequoia invest; international expansion begins.
          tone: positive
        - date: '2017'
          label: adidas partnership launched
          detail: Carbon and adidas begin scaled footwear production; eventually millions of components.
          tone: positive
        - date: 2018-02
          label: Series D — $200M at $1.7B
          detail: Silver Lake, Baillie Gifford, Fidelity, GE, J&J, and others invest; valuation doubles.
          tone: positive
        - date: 2019-06
          label: Series E — $260M at $2.4B
          detail: Largest round; last disclosed valuation; Madrone, Temasek, JSR, and others participate.
          tone: positive
        - date: 2019-11
          label: Ellen Kullman becomes CEO
          detail: Planned succession; Joseph DeSimone transitions to Executive Chairman.
          tone: neutral
        - date: 2022-06
          label: Office of CEO created
          detail: Phil DeSimone and Craig Carlson co-appointed; Kullman becomes Executive Chair.
          tone: neutral
        - date: 2025-11
          label: $60M round + IPO window
          detail: Cash-flow breakeven; 12–24 month IPO signal; no new valuation disclosed.
          tone: positive
        - date: 2026-02
          label: Jason Rolland appointed CTO
          detail: Polymer scientist with 12+ years at Carbon and 60+ patents named Chief Technology Officer.
          tone: positive
        - date: 2026-05
          label: DDK — first Asian Tier 1 saddle partner
          detail: Vertically integrated Asian manufacturer brings scale to 3D-printed cycling saddle supply chain.
          tone: positive
        - date: 2025-11
          label: Layoffs disclosed (scope undisclosed)
          detail: TCT Magazine noted Carbon laid off a significant number of employees before the Nov 2025 raise.
          tone: warning
    approximationNotes: >-
      Some dates (founding, early rounds) are rounded to month/year from secondary sources. The Series C date is
      confirmed by TechCrunch; Series D and E by Tracxn. Layoff scope is not publicly confirmed; magnitude unknown.
