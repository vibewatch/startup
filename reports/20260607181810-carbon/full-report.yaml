        blocks:
          - type: paragraph
            body: >-
              Carbon's late-2025 financing is the central financial fact for capital adequacy. The company and PR
              Newswire announced a $60 million raise led by existing investors including Sequoia Capital, Silver Lake,
              adidas, Baillie Gifford, Madrone, and Northgate, and described the proceeds as supporting scale capacity,
              new products, and movement toward cash-flow positive operations. TCT's adverse read is important because
              it says the company had recently laid off a significant number of employees, was targeting cash-flow
              positive operations, and had not disclosed the size of the workforce reduction. SEC Form D filings show
              earlier exempt equity offerings, including a 2019 notice for a $300 million offering with roughly $120
              million sold at filing and earlier 2018, 2016, and 2015 notices. Those filings prove a long
              equity-financed history, but they do not disclose 2026 cash on hand, monthly burn, debt, customer
              prepayments, working-capital needs, or whether the $60 million bridge is enough without an IPO or another
              private round. The capital conclusion is therefore conditional: investor support is strong, but the
