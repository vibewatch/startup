      - number: '3.4'
        title: Moat durability depends on accepted-part economics, not raw printer speed
        blocks:
          - type: paragraph
            body: >-
              Carbon’s defensibility is most durable when a customer has validated a full production cell: material,
              geometry, post-processing, quality documentation, uptime, and accepted-part cost. That creates switching
              cost because a buyer must requalify more than a machine. The moat is less durable in dental models,
              guides, or other workflows where open materials, faster desktop systems, or focused dental specialists can
              meet the job with lower adoption friction. Competitors are visibly closing parts of the gap. Formlabs
              publishes high-throughput dental model claims; 3D Systems is pushing FDA-cleared denture workflows;
              Stratasys has dental lab hardware and is buying Markforged capabilities; HP and EOS offer broad
              thermoplastic alternatives. The diligence ask is therefore specific benchmark data by application, not a
              broad assertion that DLS is faster or better.
