      - number: '7.5'
        title: Mitigations, monitoring indicators, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The best diligence posture is to treat every high-severity risk as monitorable. For regulatory risk, the
              trigger is a failed clearance, partner-file issue, or MDR/QMSR gap; for materials, it is a chemical
              restriction, SDS reclassification, or reformulation event; for operations, it is uptime or quality drift
              in production cells; for customers, it is a flagship account loss or underutilized installed base; for
              finance, it is another financing need before cash-flow-positive operations; and for governance, it is slow
              or conflicting decisions from the Office of the CEO. The chapter preserves uncertainty where public
              evidence is sparse. No retained source proves a current Carbon-specific litigation crisis, but no retained
              source rules it out; no public source discloses concentration or enterprise contractual remedies. Those
              gaps should be diligence conditions, not footnotes.
