            body: >-
              Public adoption evidence is strongest when a source gives a throughput, product-line, or milestone signal.
              Carbon’s 2025 financing announcement says production volumes and customer/partner relationships are
              deepening; Riddell is described as scaling Carbon pads across helmet lines and levels; OECHSLER describes
              mass-production industrialization; the L1 dental workflow claims up to 1,900 aligner models per day; and
              Keystone-related coverage reports one million dental parts. Cycling adds current product availability via
              fi’zi:k and Selle Italia, with Carbon’s 2025 statement claiming hundreds of thousands of saddles across
              several brands. These signals support a real adoption trajectory, but they stop short of investor-grade
              revenue quality: none disclose active printer fleet by customer, utilization by site, gross margin,
              current customer count, or repeat order economics. The correct conclusion is “production evidence exists,”
              not “retention and concentration are solved.”
