      - number: '1.4'
        title: Milestones, partnerships and adverse context
        blocks:
          - type: paragraph
            body: >
              Carbon's chronology runs from a laboratory insight — a 2013 founding grounded in Alex Ermoshkin's and
              Joseph DeSimone's ideas about using oxygen as a process-control variable in photopolymerization — through
              a landmark Science paper in March 2015 (Vol. 347, Issue 6228), a TED2015 talk by DeSimone viewed more than
              4.2 million times, and a series of large industrial partnership announcements.


              The adidas partnership, launched in 2017, has scaled to millions of footwear components and now
              encompasses the Climacool franchise, a fully 3D-printed running shoe. In cycling, Carbon's technology has
              produced nearly one million 3D-printed saddles; in the 2025 Tour de France, 6 of the top 10 riders used
              saddles made on Carbon's platform. Riddell's Carbon-enabled football helmets have ranked #1 in NFL/NFLPA
              laboratory testing for six consecutive years. In dental, Carbon customers generate millions of custom
              3D-printed parts per week and the company has ranked as the #1 most reliable printer per NADL for six
              years. In May 2026 Carbon announced DDK as its first Tier 1 dedicated Asian saddle-manufacturing partner,
              signaling a move toward geographic diversification of supply capacity.


              Adverse context is material but not existential. TCT Magazine noted in November 2025 that Carbon had
              recently laid off a significant number of its workforce before the latest raise; the exact headcount
              reduction figure is not publicly confirmed. Phil DeSimone acknowledged to 3DPrint.com in 2025 that the
              failed M&A wave across the additive manufacturing sector in 2023 had damaged investor confidence in the
              category. The company's $742 million raised across 13 years without yet achieving profitability is a
              meaningful capital-efficiency question for IPO diligence. Tracxn reports 517 employees as of May 2026,
              down from a headcount implied to be higher before the layoffs, and Carbon's legal entity registered
              address shows it incorporated as Carbon3d, Inc. (CIN: 461897013).
