              Deployment evidence is strongest in public documentation and release notes rather than in open engineering
              artifacts. Carbon Learn hosts hardware manuals and model-specific documentation for M3/M3 Max and L1,
              while release-note pages document Design Engine, printer software, and DLS API changes. The public API and
