      - number: '8.4'
        title: Public AM comparables argue for multiple discipline
        blocks:
          - type: paragraph
            body: >-
              The comparable set should be uncomfortable by design. Stratasys and 3D Systems offer transparent public
              filings and market data, but they are mature, slower-growth AM businesses rather than private DLS
              production platforms. Markforged is even more cautionary: its sale to Stratasys for $42.5 million
              highlights how strategic value can compress when a public AM company struggles to scale independently.
              Those references do not prove Carbon is worth less than any single comp; Carbon may deserve a premium if
              its production applications, materials attach, and subscription economics are demonstrably stronger. They
              do prove that the stale $2.4 billion mark cannot be treated as current without private evidence. The right
              valuation method is a range using public revenue multiples, a premium only for verified recurring revenue
              quality, and a discount for opacity, cap-table complexity, and exit uncertainty.
            claimRefs:
              - CV011
              - CV012
              - CV013
