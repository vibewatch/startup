      - number: '6.6'
        title: Customer conclusion for underwriting
        blocks:
          - type: paragraph
            body: >-
              The customer chapter supports a positive but qualified conclusion. Carbon has enough public named
              deployment evidence to clear the “real production, not science project” bar: Riddell, Ford, dental
              labs/materials, Keystone, adidas, and cycling brands collectively show that the platform can reach end-use
              production. The strongest current signals are dental and cycling, while Riddell adds a compelling
              protective-equipment proof point. The weakest claims are those that rely on old case studies,
              Carbon-curated libraries, or generic 3D-printing examples that do not explicitly identify Carbon Inc. The
              main investment risk is not whether Carbon has customers; it is whether the production deployments are
              durable, diversified, and profitable after support, materials, partner execution, and top-account
              concentration are considered. Private diligence should ask for cohort retention, active production
              accounts, printer utilization, material revenue, top-10 customer exposure, and customer references from
              non-marketing-selected accounts.
