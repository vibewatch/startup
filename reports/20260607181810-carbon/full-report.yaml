  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Segments: real vertical breadth, different buyers'
        blocks:
          - type: paragraph
            body: >-
              Carbon’s customer base is best understood as a set of application-specific production cells rather than a
              single horizontal printer market. Dental labs and dental-material partners are the most operationally
              concrete segment: the payer is a lab or dental-services organization, clinicians and patients consume the
              output, and the use cases include dentures, aligner models, nightguards, guides, and try-ins. Footwear,
              cycling, and protective sports equipment are brand-led consumer categories where adidas, Selle Italia,
              fi’zi:k, and Riddell own the end-customer relationship while Carbon supplies the manufacturing platform
              and materials/workflow. Ford and Johnson & Johnson/Ethicon show that large industrial and medical OEMs
              have used Carbon in specialized workflows, but the public evidence is older and less complete on current
              production. This segmentation matters for underwriting because renewal risk, support intensity, margin,
              and expansion path differ by vertical; a dental lab behaves more like a production subscription/support
              account, while a consumer brand may behave like a programmatic SKU or platform dependency.
            claimRefs:
