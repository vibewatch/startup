            body: >-
              The financial verdict is a cautious positive on business-model design and a hold on underwriting quality.
              Carbon has the right ingredients for high-quality revenue: recurring printer subscriptions, software and
              connected services, proprietary materials, validated production workflows, and marquee end-use
              applications in footwear, helmets, cycling, and dental. However, private disclosure gaps dominate the
              investment case. IncFact's statistical revenue range of $100 million to $500 million and Tracxn's 2026
              employee count help size the company directionally, but neither replaces management-reported ARR, GAAP
              revenue, gross margin, net revenue retention, cohort utilization, customer concentration, or cash-flow
              statements. The late-2025 bridge round and layoff context make margin path and capital intensity the
              gating diligence topics. A strong case requires evidence that materials and software carry enough margin
