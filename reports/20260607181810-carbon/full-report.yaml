      - number: '7.2'
        title: Regulatory, legal, and materials exposure
        blocks:
          - type: paragraph
            body: >-
              Carbon’s photopolymer strategy imports medical-device, chemical-safety, and IP risk into what might
              otherwise look like an industrial-equipment story. FDA additive-manufacturing guidance and the 2026 QMSR
              create process-validation and quality-system expectations for patient-facing applications, while EU MDR
              can require separate market access work. Carbon’s public ISO 9001 certificate is helpful but does not
              close the question of ISO 13485 readiness for device partners. Photopolymer materials add OSHA HazCom,
              NIOSH worker-exposure, EPA TSCA, and ECHA REACH diligence, especially if a formulation change affects
              biocompatibility or a partner-held 510(k). The IP picture is similarly two-sided: patents are a moat, yet
              a visible patent estate is also a target for PTAB or licensing challenges; public docket sources did not
              provide a definitive active-litigation conclusion.
