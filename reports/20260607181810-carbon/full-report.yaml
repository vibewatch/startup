  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in workflow terms
        blocks:
          - type: paragraph
            body: >-
              Carbon is not simply selling a resin printer; the underwriteable product is a controlled production
              workflow. A customer starts with an application requirement, uses Carbon software such as Design Engine to
              convert performance intent into printable lattice or surface geometry, prepares the build for a specific
              printer and material family, prints through DLS, washes and bakes the green part, and then operates the
              result inside a validated production cell. That workflow framing matters because the differentiated output
              comes from the coordinated recipe: digital light projection and oxygen-permeable optics create the
              continuous liquid interface, dual-cure chemistry sets final properties after printing, and
              software/automation reduce labor in repetitive dental and industrial jobs. The strongest evidence is
              company-official for the mechanism and workflow, with independent Science and patent evidence
              corroborating the CLIP dead-zone principle. The weakest public evidence is not whether the pieces exist,
              but the customer-level yield, uptime, and cost data needed to prove economics in each use case.
