      - number: '7.4'
        title: People, execution, and financial/model risk
        blocks:
          - type: paragraph
            body: >-
              The Office of the CEO structure is not disqualifying, but it raises a specific governance question: who
              can make fast tradeoffs among regulated launches, customer escalations, financing timing, and IP strategy
              when those issues collide. The CTO appointment helps technical continuity, yet the company still needs
              execution proof across hardware, software, materials, quality, and sales. Financially, the November 2025
              raise gives Carbon time, not a full underwriting answer. Public sources do not disclose ARR, gross margin,
              burn, utilization, renewal rates, or top-customer share. Comparable public AM filings show that macro
              conditions, customer capex, raw materials, and production disruptions can pressure
              hardware-plus-consumables models. Carbon’s model therefore needs proof that installed printers and
              proprietary resins generate durable, high-utilization gross profit rather than lumpy production wins.
