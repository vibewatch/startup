  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and pricing are recurring in design, but realized mix is private
        blocks:
          - type: paragraph
            body: >-
              Carbon sells an integrated production platform rather than a simple printer. The public model has four
              financial engines: subscription or lease-like access to M-series printers and connected services;
              proprietary and validated photopolymer materials; application software, over-the-air updates, monitoring,
              and support embedded in the subscription; and production partner or customer programs that monetize parts
              through certified manufacturers rather than direct equipment ownership. The strongest quality signal is
              recurrence: Carbon itself says subscription pricing avoids one large capital investment, includes ongoing
              maintenance and software upgrades, and varies by country, region, and application. Third-party pricing
              pages indicate older M2 economics of roughly $50,000 per year on a three-year term plus accessories, while
              3Dnatives reports M3 packages from $25,000 per year; those are list or public estimates, not realized net
              price. Resin pricing is similarly supportable as a cost and revenue driver, with Dynamism citing $100-$450
              per liter and Carbon's dental pages listing many validated materials, but Carbon does not disclose resin
              attach rates, consumable gross margin, discounting, renewal rates, or revenue by hardware, materials,
              software, service, and partner production.
