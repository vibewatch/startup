              production, L1 for larger-format work, production accessories such as washers and AO modules, and a
              materials catalog that includes elastomeric, rigid, flexible, silicone urethane, and dental resins.
              Software is a separate layer: Design Engine shapes geometry and lattices, printer software operates the
              fleet, and API evidence suggests integration hooks for production monitoring or workflow systems.
              Materials are not commodity add-ons in this model. RPU, FPU, EPU, SIL, and dental resins are part of the
              performance envelope, because Carbon’s claims about isotropy, surface finish, and end-use quality depend
              on validated print and post-cure recipes. The resulting SKU map is defensible but operationally demanding:
