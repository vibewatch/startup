  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk view
        blocks:
          - type: paragraph
            body: >-
              Carbon’s priority risk is a compound regulated-manufacturing risk rather than a single known lawsuit or
              one-off product defect. The company is trying to scale a proprietary DLS platform across dental, consumer,
              protective, and industrial applications while keeping resin chemistry, printer uptime, validated
              workflows, and customer economics aligned. The evidence supports real mitigants: a large patent estate,
              ISO 9001 certification, FDA-cleared partner dental material evidence, automation investment, and a fresh
              $60 million financing. Residual exposure remains high because the hardest evidence is private: customer
              concentration, utilization, product-agreement remedies, supplier redundancy, and
              application-by-application validation. The investment implication is track/research-more unless diligence
              proves that regulated dental production can scale without reformulation, requalification, or another
              dilutive financing cycle.
            claimRefs:
