      - number: '8.3'
        title: Bull/base/bear scenarios depend on private revenue scale and margin proof
        blocks:
          - type: paragraph
            body: >-
              Because Carbon does not disclose revenue or margins, the scenario work must be framed as a conditional
              range rather than a precise point estimate. The bull case requires evidence that printer subscriptions,
              software, service, and proprietary materials are producing recurring, high-utilization production revenue
              with improving gross margins and an IPO-readiness timeline. The base case is narrower: the $60 million
              round buys time to reach cash-flow-positive operations, but valuation remains capped until management
              proves revenue scale and margin conversion. The bear case is a down-round, additional financing, or
              distressed strategic exit if public AM multiples and the Markforged sale reset buyer expectations.
              Sensitivity is therefore dominated by three variables: current recurring revenue, credible gross-margin
              trajectory, and the revenue multiple an investor is willing to pay for a hardware-plus-materials AM
              platform. Public sources justify the direction of the variables, not the point estimate.
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV044
