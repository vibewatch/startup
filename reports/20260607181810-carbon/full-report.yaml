      - number: '6.5'
        title: 'Expansion and concentration risk: marquee proof, opaque exposure'
        blocks:
          - type: paragraph
            body: >-
              Carbon’s expansion logic is attractive but concentration-sensitive. The platform can land in one qualified
              application and expand through adjacent product lines, helmet lines, dental materials, lab workflows, or
              saddle models. That is visible in Riddell scaling language, dental material partnerships, and cycling
              product breadth. The risk is that public proof is curated around marquee deployments while Carbon does not
              disclose revenue by customer, vertical, material family, or top-account contribution. Industry-wide
              adverse data reinforces the diligence burden: 3D printing customers still cite long lead times, tolerance
              issues, material shortages, and software mismatch as friction points, any of which can stall production
              deployments or increase support cost. Dentsply/Lucitone validation on non-Carbon platforms also cautions
              that dental material demand is not the same as exclusive Carbon lock-in. The diligence ask is a
              top-customer and top-vertical revenue bridge, not more customer logos.
            claimRefs:
              - CU024
              - CU026
              - CU027
              - CU032
              - CU036
