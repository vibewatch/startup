      - number: '6.4'
        title: 'Retention durability: useful proxies, missing cohorts'
        blocks:
          - type: paragraph
            body: >-
              Retention and durability are the public-evidence weak spot. Carbon can point to customer satisfaction
              language in the L1 dental one-pager, including an NPS of 89, and Absolute Dental’s 12-month no-repair
              warranty is a practical proxy that the Lucitone/Carbon workflow can stand behind patient-facing products.
              Current cycling product pages and Riddell’s ongoing Diamond presence also imply that some applications
              survived past launch. But the decisive SaaS-like or manufacturing-platform metrics are absent: no public
              NRR, GRR, churn, renewal rate, material attach rate, support cost per production cell, or customer-level
              utilization. This gap is material because Carbon’s platform likely requires significant workflow support,
              material validation, and partner execution; customer satisfaction proxies do not prove recurring
              economics. Diligence should therefore prioritize customer calls and private cohorts over more logo
              collection.
            claimRefs:
              - CU015
              - CU016
