      - number: '3.3'
        title: Pricing, packaging, distribution, and trust advantages are uneven and buyer-specific
        blocks:
          - type: paragraph
            body: >-
              Pricing evidence is less clean than product evidence. The retained official surfaces do not support a
              normalized list-price comparison across Carbon, Stratasys, 3D Systems, EOS, HP, and Markforged; most
              enterprise additive systems push buyers toward quoting, service, materials, and application economics.
              That absence is itself a diligence finding. Carbon’s packaging appears enterprise-led and closed around
              DLS printers, materials, software, and support, while Formlabs shows a lower-friction, buy-now and Open
              Material Mode posture and specialists show onboarding-oriented dental workflows. Public incumbents have a
              trust advantage because they provide SEC, investor, and support surfaces that procurement teams can
              diligence. Distribution power therefore splits by segment: Carbon should be strongest where its
              application recipe is proven, incumbents where global enterprise coverage matters, and specialists where
              chairside workflow convenience matters most.
