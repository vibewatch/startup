      - number: '7.3'
        title: Operational, quality, and partner/dependency risk
        blocks:
          - type: paragraph
            body: >-
              The operational risk is that Carbon’s platform must behave like both a manufacturing cell and a regulated
              materials ecosystem. Dental automation reduces labor friction, but also raises the cost of software
              defects, printer downtime, training gaps, and post-processing variation. Partner dependency is highest
              where the public evidence points to Keystone’s FP3D clearance, specialty resin supply, and customer-owned
              production workflows. Comparable dental manufacturing disclosures from Align show how a single resin or
              polymer source can matter at scale. A supplier change, hazard reclassification, or unavailable material
              can cascade from procurement into validation, FDA records, customer acceptance, and revenue recognition.
              Mitigation diligence should therefore test supplier redundancy, lot qualification, field-service response,
              and customer change-control playbooks rather than relying on generic AM market growth.
