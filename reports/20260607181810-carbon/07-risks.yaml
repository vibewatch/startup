  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: quality-certification
    missingEvidence: Carbon’s ISO 13485 status, device quality manual, partner quality agreements, and product-file ownership
      for regulated dental applications.
    whyItMatters: ISO 9001 evidence does not establish medical-device quality-system readiness under QMSR or EU MDR.
    diligencePath: Request certifications, audit reports, CAPA logs, complaint files, validation plans, and partner quality
      agreements.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: litigation
    missingEvidence: A counsel-certified PTAB, district-court, EPO, and licensing-dispute search for Carbon, Carbon3D, key
      patents, and major competitors.
    whyItMatters: A single injunction or license demand can impair the DLS moat and delay financing or IPO readiness.
    diligencePath: Commission legal diligence with claim charts and docket searches across PTAB, PACER, CourtListener, Justia,
      and foreign patent offices.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: contracts
    missingEvidence: Actual customer Product Agreements, subscription terms, SLA credits, liability caps, indemnities, and
      product-liability insurance schedules.
    whyItMatters: Public terms say product use is governed by separate agreements, so enterprise remedies and exposure cannot
      be underwritten publicly.
    diligencePath: Review standard and top-10 customer agreements, redlines, claims history, and insurance coverage.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, renewal cohorts, printer utilization, material pull-through, churn, and flagship
      account dependency.
    whyItMatters: Customer concentration is the clearest path from a single account issue to revenue quality, valuation, and
      financing risk.
    diligencePath: Request cohort exports by customer, application, printer fleet, material consumption, gross margin, and
      renewal status.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
