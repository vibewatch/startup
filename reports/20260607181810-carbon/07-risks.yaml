- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Medical / dental regulatory qualification
    - FDA, QMSR, MDR, or partner 510(k) issue
    - Failed clearance, warning letter, partner withdrawal, or inability to show ISO 13485-equivalent controls
    - Pause investment until quality-system and product-file ownership are independently verified.
  - - Photopolymer chemical safety
    - SDS, REACH, TSCA, OSHA, or NIOSH adverse development
    - Hazard reclassification, restricted substance, failed customer EHS audit, or required reformulation
    - Require reformulation plan, alternate suppliers, and requalification timeline before underwriting growth.
  - - IP / patent challenge
    - PTAB, district-court, EPO, or licensing demand
    - Injunction risk, adverse claim construction, IPR institution on core DLS / resin patent, or expensive license
    - Haircut moat and delay IPO-readiness assumptions pending counsel review.
  - - Customer concentration
    - Flagship account churn or utilization decline
    - Top customer >20% revenue, renewal miss, or material production migration to rival AM platform
    - Treat growth quality as unproven and require customer cohort disclosure.
  - - Hardware-plus-subscription economics
    - Fleet utilization, gross margin, service cost, or churn weakness
    - Utilization below plan, recurring gross margin below target, or service incidents driving credits
    - Do not underwrite cash-flow-positive path without cohort-level economics.
  - - AM-sector cyclicality
    - Macro capex or AM demand slowdown
    - Comparable filings show capex pullback; AMPOWER / Wohlers growth decelerates; customers defer printer adds
    - Stress valuation multiple and runway; require lower burn plan.
  - - Office of the CEO execution
    - Decision-rights friction
    - Delayed launch, unresolved customer escalation, or conflicting commercial / technical priorities
    - Require board-level governance remediation and single accountable owner.
  - - Specialty chemical supply chain
    - Supplier disruption or material lot failure
    - Single-source material, quality escape, or inability to qualify backup supplier within one quarter
    - Require dual-source plan and inventory buffer before scaling regulated applications.
  notes: Triggers are designed as thesis-break or thesis-haircut conditions that can be monitored quarterly in diligence and
    board reporting.
