company:
  name: Carbon
chapter:
  number: 7
  title: Risks
  summary: 'Carbon’s risk profile is dominated by regulated materials execution: photopolymer chemistry, medical/dental qualification,
    specialty supply chain, and customer production uptime can all cascade into gross margin, financing, and IPO readiness.
    No retained source proves a current Carbon-specific litigation crisis, but the patent-heavy model, Office of the CEO transition,
    undisclosed customer concentration, and hardware-plus-subscription complexity require private diligence before the downside
    can be bounded.'
sections:
- id: severity-ranked-risk-view
  title: Severity-ranked risk view
  body: 'Carbon’s priority risk is a compound regulated-manufacturing risk rather than a single known lawsuit or one-off product
    defect. The company is trying to scale a proprietary DLS platform across dental, consumer, protective, and industrial
    applications while keeping resin chemistry, printer uptime, validated workflows, and customer economics aligned. The evidence
    supports real mitigants: a large patent estate, ISO 9001 certification, FDA-cleared partner dental material evidence,
    automation investment, and a fresh $60 million financing. Residual exposure remains high because the hardest evidence
    is private: customer concentration, utilization, product-agreement remedies, supplier redundancy, and application-by-application
    validation. The investment implication is track/research-more unless diligence proves that regulated dental production
    can scale without reformulation, requalification, or another dilutive financing cycle.'
  claimRefs:
  - CR001
  - CR002
  - CR035
  - CR036
  - CR037
  - CR039
  - CR045
  tableRefs:
  - TR005
  figureRefs:
