    severity: material
    topic: concentration-risk
    missingEvidence: Top-10 customer revenue share, largest vertical exposure, and customer-by-customer gross margin contribution.
    whyItMatters: Marquee customer proof could still mask dependence on a few programs or low-margin support-heavy accounts.
    diligencePath: Obtain revenue waterfall by customer and vertical, reconcile against bookings, materials consumption, and
      printer utilization.
