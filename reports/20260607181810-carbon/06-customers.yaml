company:
  name: Carbon
chapter:
  number: 6
  title: Customers
  summary: 'Carbon has credible named production deployments across Riddell, Ford, dental, Keystone, adidas, and cycling,
    with the freshest public proof in dental and cycling. The main underwriting issue is not customer existence but durability
    and concentration: public sources rarely disclose renewal, utilization, revenue share, or top-customer exposure.'
sections:
- id: segmentation
  title: 'Segments: real vertical breadth, different buyers'
  body: 'Carbon’s customer base is best understood as a set of application-specific production cells rather than a single
    horizontal printer market. Dental labs and dental-material partners are the most operationally concrete segment: the payer
    is a lab or dental-services organization, clinicians and patients consume the output, and the use cases include dentures,
    aligner models, nightguards, guides, and try-ins. Footwear, cycling, and protective sports equipment are brand-led consumer
    categories where adidas, Selle Italia, fi’zi:k, and Riddell own the end-customer relationship while Carbon supplies the
    manufacturing platform and materials/workflow. Ford and Johnson & Johnson/Ethicon show that large industrial and medical
    OEMs have used Carbon in specialized workflows, but the public evidence is older and less complete on current production.
    This segmentation matters for underwriting because renewal risk, support intensity, margin, and expansion path differ
    by vertical; a dental lab behaves more like a production subscription/support account, while a consumer brand may behave
    like a programmatic SKU or platform dependency.'
  claimRefs:
  - CU001
  - CU002
  - CU035
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-production-proof
  title: 'Named customer proof: production, pilot, and false-positive discipline'
  body: 'The strongest named proof is not merely logo presence. Riddell has customer-side and Carbon-side evidence for a helmet
    liner, plus OECHSLER manufacturing proof, so it clears the production bar. Ford clears an historical end-use production
    bar because the public sources name specific production parts, but it does not clear a current-volume bar for 2026. Dental
    proof is broad: Dentsply Sirona/Lucitone and Absolute Dental demonstrate workflow and lab-side use, while Keystone gives
    a one-million-parts milestone. adidas remains strategically important because it proved Carbon could move beyond prototyping
    into performance footwear, but the fetched adidas proof is older. J&J/Ethicon is credible as a collaboration, yet should
    be treated as R&D or undisclosed production until fresher commercialization evidence is obtained. Cobra is deliberately
    not credited as a Carbon deployment because fetched Cobra and review pages show 3D-printed golf products without explicit
    Carbon Inc. attribution.'
  claimRefs:
  - CU003
  - CU004
  - CU006
  - CU009
  - CU012
  - CU013
  - CU017
  - CU021
  - CU023
  - CU028
  - CU037
  tableRefs:
