- id: adoption-trajectory
  title: 'Adoption trajectory: scale signals without revenue denominators'
  body: 'Public adoption evidence is strongest when a source gives a throughput, product-line, or milestone signal. Carbon’s
    2025 financing announcement says production volumes and customer/partner relationships are deepening; Riddell is described
    as scaling Carbon pads across helmet lines and levels; OECHSLER describes mass-production industrialization; the L1 dental
    workflow claims up to 1,900 aligner models per day; and Keystone-related coverage reports one million dental parts. Cycling
    adds current product availability via fi’zi:k and Selle Italia, with Carbon’s 2025 statement claiming hundreds of thousands
    of saddles across several brands. These signals support a real adoption trajectory, but they stop short of investor-grade
    revenue quality: none disclose active printer fleet by customer, utilization by site, gross margin, current customer count,
    or repeat order economics. The correct conclusion is “production evidence exists,” not “retention and concentration are
    solved.”'
  claimRefs:
  - CU007
  - CU008
  - CU014
  - CU017
  - CU018
  - CU019
  - CU020
  - CU031
  - CU033
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: retention-durability
  title: 'Retention durability: useful proxies, missing cohorts'
  body: 'Retention and durability are the public-evidence weak spot. Carbon can point to customer satisfaction language in
    the L1 dental one-pager, including an NPS of 89, and Absolute Dental’s 12-month no-repair warranty is a practical proxy
    that the Lucitone/Carbon workflow can stand behind patient-facing products. Current cycling product pages and Riddell’s
    ongoing Diamond presence also imply that some applications survived past launch. But the decisive SaaS-like or manufacturing-platform
    metrics are absent: no public NRR, GRR, churn, renewal rate, material attach rate, support cost per production cell, or
    customer-level utilization. This gap is material because Carbon’s platform likely requires significant workflow support,
    material validation, and partner execution; customer satisfaction proxies do not prove recurring economics. Diligence
    should therefore prioritize customer calls and private cohorts over more logo collection.'
  claimRefs:
  - CU015
  - CU016
  - CU025
  - CU029
  - CU030
  - CU034
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration-risk
  title: 'Expansion and concentration risk: marquee proof, opaque exposure'
  body: 'Carbon’s expansion logic is attractive but concentration-sensitive. The platform can land in one qualified application
    and expand through adjacent product lines, helmet lines, dental materials, lab workflows, or saddle models. That is visible
    in Riddell scaling language, dental material partnerships, and cycling product breadth. The risk is that public proof
    is curated around marquee deployments while Carbon does not disclose revenue by customer, vertical, material family, or
    top-account contribution. Industry-wide adverse data reinforces the diligence burden: 3D printing customers still cite
    long lead times, tolerance issues, material shortages, and software mismatch as friction points, any of which can stall
    production deployments or increase support cost. Dentsply/Lucitone validation on non-Carbon platforms also cautions that
    dental material demand is not the same as exclusive Carbon lock-in. The diligence ask is a top-customer and top-vertical
    revenue bridge, not more customer logos.'
  claimRefs:
  - CU024
  - CU026
  - CU027
  - CU032
  - CU036
  tableRefs:
  - TU005
- id: underwriting-conclusion
  title: Customer conclusion for underwriting
  body: 'The customer chapter supports a positive but qualified conclusion. Carbon has enough public named deployment evidence
    to clear the “real production, not science project” bar: Riddell, Ford, dental labs/materials, Keystone, adidas, and cycling
    brands collectively show that the platform can reach end-use production. The strongest current signals are dental and
    cycling, while Riddell adds a compelling protective-equipment proof point. The weakest claims are those that rely on old
    case studies, Carbon-curated libraries, or generic 3D-printing examples that do not explicitly identify Carbon Inc. The
    main investment risk is not whether Carbon has customers; it is whether the production deployments are durable, diversified,
    and profitable after support, materials, partner execution, and top-account concentration are considered. Private diligence
    should ask for cohort retention, active production accounts, printer utilization, material revenue, top-10 customer exposure,
    and customer references from non-marketing-selected accounts.'
  claimRefs:
  - CU028
  - CU029
  - CU032
  - CU033
  - CU034
  - CU035
