- id: TU005
  title: Expansion and concentration risk map
  columns:
  - Expansion driver
  - Evidence
  - Concentration or durability risk
  - Impact if weak
  - Diligence path
  rows:
  - - Application-led expansion
    - Riddell helmet lines, dental workflows, cycling saddle models
    - Expansion may stay inside a few marquee OEMs
    - Revenue growth could be lumpy
    - Obtain top-10 customer revenue and cohort expansion
  - - Dental materials ecosystem
    - Lucitone, Keystone, L1 aligner workflow
    - Dentsply/Keystone workflows may not be exclusive to Carbon
    - Platform lock-in weaker than material demand
    - Review contracts, validation exclusivity, and printer attach rate
  - - Manufacturing partners
    - OECHSLER industrializes Riddell damping elements
    - Partner execution becomes part of customer success
    - Quality or capacity issues could impair brand customers
    - Audit partner SLAs, yields, and contingency capacity
  - - Consumer-brand proof
    - adidas, cycling, Cobra false-positive control
    - Logo marketing can overstate active Carbon revenue
    - Investor may over-credit stale logos
    - Tie every logo to current PO, SKU, or unit economics
  - - Support / satisfaction
    - NPS 89 and concierge support claims
    - Support burden may scale with complex workflows
    - Gross margin and churn risk if support-heavy
    - Request support cost per active production cell
  - - Industry friction
    - 2026 market data cites lead-time, tolerance, material, and software pain points
    - Same frictions can trigger churn or stalled deployments
    - Production customers may revert to conventional processes
    - Customer calls on downtime, tolerance yield, and material availability
  notes: Risk map converts public evidence and adverse industry data into diligence paths; no public source quantifies Carbon
    top-customer exposure.
