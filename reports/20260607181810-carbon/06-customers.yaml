  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Customer-level NRR, GRR, churn, renewal, utilization, and material attach-rate cohorts by vertical.
    whyItMatters: Public proxies cannot prove that production deployments renew profitably after support and material costs.
    diligencePath: Request anonymized cohort tables and conduct at least five non-marketing customer calls across dental,
      Riddell/protective, cycling, and automotive accounts.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU025
    relatedTableRefs:
