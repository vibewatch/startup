  - id: section-capital
    title: Capital base, funding history and valuation
    body: >
      Carbon has raised approximately $742 million over eight rounds since its founding, making it one of the
      best-capitalized private additive manufacturing companies in history. The earliest disclosed funding came
      in December 2013 through a seed-stage round. The company's Series C in September 2016 raised $81 million
      from BMW Group, GE, Nikon, JSR Corp., GV (Google Ventures), and Sequoia Capital, bringing total raised at
      that point to $222 million at a $1 billion valuation. The $200 million Series D in February 2018 valued
      Carbon at $1.7 billion. The $260 million Series E in June 2019 — the largest round — established the last
      disclosed post-money valuation of $2.4 billion and brought aggregate fundraising to more than $680 million
      at the time.


      The most recent close, announced November 12, 2025, raised $60 million led by existing investors Sequoia
      Capital, Silver Lake, adidas, Baillie Gifford, Madrone, and Northgate. Per the official press release and
      an Axios exclusive, this round was designed to bridge Carbon to cash-flow positive operations and was
      accompanied by a statement that the company "expects to IPO in 12 to 24 months." No new post-money
      valuation was disclosed; the most recent supportable figure remains the 2019 $2.4 billion mark.


      The investor base spans pure financial sponsors (Sequoia, Silver Lake), strategic corporates (adidas,
      formerly GE, J&J, BMW), and asset managers (Baillie Gifford, Fidelity). Sequoia partner Jim Goetz sits
      on the board, confirming active governance involvement. adidas plays a dual role as both an investor and
      Carbon's most prominent production partner, which creates a potential conflict-of-interest angle for
      diligence: adidas's production commitments and investment economics are intertwined. Revenue and
      annual run rate remain undisclosed publicly; an evidenceGap is flagged for later chapters.
