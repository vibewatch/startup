    title: Deeply entrenched brand partnerships validate production-scale DLS
    body: >-
      adidas (millions of footwear components), Riddell (#1 NFL helmet testing six years running), and Tour de
      France saddle brands collectively demonstrate that Carbon's DLS platform has cleared the hardest bar in
      additive manufacturing: production-at-scale for demanding consumer end-use parts. These partnerships are
      multi-year, capital-intensive, and not easily replicated by competitors without equivalent platform depth.
    claimRefs:
      - CO026
      - CO027
      - CO028
      - CO029
  - calloutType: risk
    title: Dual-CEO structure, undisclosed layoffs, and stale valuation create diligence gaps
    body: >-
      The Office of the CEO model (DeSimone and Carlson) lacks the accountability clarity of a conventional
      single-CEO structure. An unquantified workforce reduction occurred before the November 2025 raise; the scope
      remains undisclosed. The last official post-money valuation ($2.4B) is now seven years old, making
      IPO pricing discovery especially sensitive to financial disclosures not yet in the public domain.
    claimRefs:
      - CO032
      - CO016
      - CO022

