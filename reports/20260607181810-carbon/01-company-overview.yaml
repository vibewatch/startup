company:
  name: Carbon
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Carbon, Inc. is a Redwood City, California-based additive manufacturing company founded in December 2013 that
    commercializes Digital Light Synthesis (DLS) — a proprietary photopolymer platform descended from the CLIP
    technology published in Science in 2015. As of June 2026 the company is run by an Office of the CEO (Philip
    DeSimone and Craig Carlson) under Executive Chair Ellen Kullman, with Jason Rolland as newly appointed CTO.
    Carbon has raised approximately $742 million over eight rounds, the latest being a $60 million close in November
    2025 at a cash-flow-breakeven inflection point, and has publicly indicated a 12–24 month IPO window.
sections:
  - id: section-identity
    title: Identity, mission and platform
    body: >
      Carbon, Inc. — also known by its earlier brand Carbon3D — describes itself as a Silicon Valley-based additive
      manufacturing company that enables large-scale production of high-performance polymer components. The company's
      mission, stated across multiple official surfaces, is to reinvent how polymer products are designed, engineered,
      manufactured, and delivered toward a digital and sustainable future. Carbon is headquartered at 1089 Mills Way,
      Redwood City, California, though some 2025–2026 press releases reference Sunnyvale, CA, indicating either a
      partial office consolidation or a regional presence shift that warrants verification in due diligence.


      The platform integrates three proprietary layers: hardware (the M-series and L1 industrial 3D printers),
      software (Carbon Design Engine and Custom Production Software for lattice design and mass customization), and
      materials (a broad family of photopolymer resins including EPU, RPU, DPR, and the newly launched EPU Pro 50 and
      EPU Pro 90). This integrated stack allows customers to move from prototyping through low-volume to
      production-at-scale without changing vendors — a critical differentiation from commodity 3D printing bureaus.
      Hundreds of global organizations, including adidas, Ford, and Becton Dickinson, use the Carbon process.
      The company serves customers in 17 countries through a network of production partners.


      Carbon's business model blends hardware subscription/leasing, materials consumables, and software access.
      Earlier TechCrunch reporting from 2016 described three-year machine leases generating recurring revenue alongside
      resin sales, a subscription-forward structure that distinguishes the company from capital-equipment-only
      competitors. The company is private, late-stage (Series E), approaching cash-flow positive operations as of
      the November 2025 funding close, and has publicly indicated a 12–24 month IPO window from that date.
