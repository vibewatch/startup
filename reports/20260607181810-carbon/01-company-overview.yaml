  - id: section-leadership
    title: Leadership, governance and key-person risk
    body: >
      Carbon was co-founded in December 2013 by a group of six: Joseph M. DeSimone, Philip DeSimone, Alex Ermoshkin,
      Nikita Ermoshkin, Edward Samulski, and Steve Nelson. Joseph DeSimone — a chemist and former University of
      North Carolina professor of over 20 years — was the company's first CEO for its first six years and
      is widely recognized as the principal scientific inventor behind CLIP technology. He received the National Medal
      of Technology and Innovation from President Obama in 2016 and is one of only roughly 20 individuals elected to
      all three U.S. National Academies.


      In November 2019, Ellen Kullman (former Chairman and CEO of DuPont, 2009–2015) was appointed President and CEO,
      with DeSimone transitioning to Executive Chairman. Kullman had served on Carbon's board as lead independent
      director since 2016. In June 2022 Carbon created an Office of the CEO: Philip DeSimone and Craig Carlson were
      jointly appointed as co-leads of the company, while Kullman became Executive Chair of the board. Joseph
      DeSimone remained on the board. In February 2026 Jason Rolland, Ph.D. — a polymer scientist who has been with
      Carbon for over 12 years and co-invented the dual-cure resin platform — was promoted to Chief Technology
      Officer. Phil DeSimone is referred to as "Chief Executive Officer" in the May 2026 DDK partnership press
      release, suggesting that by mid-2026 the dual-CEO label may have resolved.


      The governance structure carries key-person concentration risk on at least two axes: Philip DeSimone and Craig
      Carlson share strategic and operational authority without a conventional single-CEO accountability structure,
      and Joseph DeSimone's scientific credibility and brand equity remain central to the company's narrative even
      in a board-only role. The board is large (14 members per Tracxn) and includes Jim Goetz (Sequoia Capital),
      Alan Mulally (former Ford CEO), Eric Liedtke (former adidas), and several other independent directors —
      a depth that signals governance maturity but that due-diligence teams should verify against current proxy
      or shareholder materials.
