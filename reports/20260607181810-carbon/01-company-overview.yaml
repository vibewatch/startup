  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: >-
        Carbon's annual revenue, annual recurring revenue, and gross margin are not publicly disclosed.
        No third-party analyst estimate or company guidance has been retained.
      whyItMatters: >-
        Revenue scale and growth rate are essential for IPO pricing, comparables analysis, and valuation
        chapter judgment. The company's cash-flow-positive claim cannot be evaluated without knowing whether
        the revenue base is large enough to support the cost structure.
      diligencePath: >-
        Request audited financial statements and management accounts in a due-diligence data room. Cross-check
        with deferred revenue schedules, materials COGS, and hardware leasing cash flows.
      relatedQuestionRefs:
        - QO021
    - type: missing-source
      severity: material
      topic: adverse-layoffs
      missingEvidence: >-
        The exact number of employees laid off before the November 2025 raise and the timing of those
        reductions are not publicly confirmed; TCT Magazine characterized them as "significant" without a number.
      whyItMatters: >-
        Scope of workforce reductions directly affects unit economics, team morale, and management capability
        assessment. A large reduction (e.g., 30%+ of headcount) would be material to company-overview
        and financials judgments.
      diligencePath: >-
        Obtain HR records or WARN Act filings (if applicable) in the data room. Cross-reference LinkedIn
        employee timeline data and press reports for timing.
      relatedQuestionRefs:
        - QO013
        - QO010
    - type: stale
      severity: material
      topic: valuation
      missingEvidence: >-
        No post-money valuation was disclosed for the November 2025 $60 million round; the last publicly
        disclosed valuation of $2.4 billion dates from the June 2019 Series E — seven years before runDate.
      whyItMatters: >-
        A stale valuation makes IPO pricing discovery highly uncertain; it prevents relative valuation
        benchmarking and makes it difficult to assess dilution for earlier investors.
      diligencePath: >-
        Request the capitalization table, most recent 409A or independent valuation, and any term sheet
        from the November 2025 round in the data room.
      relatedQuestionRefs:
        - QO017
        - QO004
      relatedTableRefs:
        - TO003
        - TO004
    - type: missing-source
      severity: minor
      topic: headquarters
      missingEvidence: >-
        Official press releases have used both Redwood City and Sunnyvale as Carbon's headquarters city;
        the current legal registered address and primary operational office location are not confirmed in
        a single authoritative source post-2025.
      whyItMatters: >-
        This is a low-stakes identity fact but affects later chapter accuracy, regulatory jurisdiction
        determination, and comparison to peer comps that use consistent HQ data.
      diligencePath: >-
        Review the most recent Delaware or California corporate filing or the official carbon3d.com contact
        page to confirm the current primary registered address.
      relatedQuestionRefs:
        - QO024
    - type: missing-source
      severity: minor
      topic: sector-valuation-comparison
      missingEvidence: >-
        No retained source directly compares Carbon's $2.4B (2019) valuation to current comparable AM sector
        companies such as Stratasys, Desktop Metal, or EOS to provide context for whether the valuation
        implies a premium or discount to public comparables.
      whyItMatters: >-
        Relative valuation context is needed to judge whether Carbon's IPO window is financially opportunistic
        or distressed, and to interpret the PE return profile for existing investors.
      diligencePath: >-
        Run a valuation comparables search for publicly traded AM companies (EV/Revenue, EV/EBITDA) and
        compare to Carbon's implied multiple using any available revenue proxies.
      relatedQuestionRefs:
        - QO017
        - QO025
