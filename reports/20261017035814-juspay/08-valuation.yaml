  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: round-disclosure-gap
      missingEvidence: Exact primary-versus-secondary split, investor rights, liquidation preferences, and board / governance terms for the January 2026 round.
      whyItMatters: The announced headline valuation can overstate common-share entry quality if dilution or preference terms are investor-favorable.
      diligencePath: Request the term sheet, updated cap table, and board materials summarizing the post-round security stack.
      relatedQuestionRefs: [QV007]
    - type: missing-source
      severity: material
      topic: underwriting-metrics
      missingEvidence: Quarterly FY26-to-FY27 revenue trajectory, gross margin, cash generation, and segment mix.
      whyItMatters: Without current unit economics and cash conversion, public sources cannot distinguish temporary investment drag from a structurally lower-margin business.
      diligencePath: Obtain management accounts and KPI bridge decks covering growth, margin, opex, and cash flow by quarter.
      relatedQuestionRefs: [QV006, QV008]
    - type: missing-source
      severity: material
      topic: concentration-and-retention
      missingEvidence: Customer concentration, GRR / NRR, international revenue mix, and routing-share changes after partner conflict.
      whyItMatters: Valuation upside depends on durable enterprise stickiness; concentration or share erosion would compress the appropriate multiple.
      diligencePath: Request cohort retention tables, top-customer exposure, regional revenue mix, and routing-share trend data by large merchant cohort.
      relatedQuestionRefs: [QV005, QV008]
      relatedTableRefs: [TV001, TV003]
