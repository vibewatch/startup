evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-roster
    missingEvidence: A current board roster, full executive bench, and role-by-role governance disclosures.
    whyItMatters: >-
      Key-person dependency and oversight quality cannot be underwritten from only two clearly surfaced current
      executives plus conflicting founder attribution.
    diligencePath: Request the current board deck, leadership org chart, and any governance disclosures tied to the latest financing.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: ownership-and-control
    missingEvidence: A current cap table, financing terms, debt or credit disclosures, and any material secondary transactions.
    whyItMatters: >-
      Valuation, dilution, investor control rights, and founder economic alignment remain too uncertain for investment
      judgment.
    diligencePath: >-
      Obtain the latest cap table, Series D documents, debt schedules, and investor rights summary directly from
      management or lead investors.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      A current primary or independently reported valuation figure tied to the latest financing or secondary market
      activity.
    whyItMatters: >-
      Later valuation work should not anchor on stale refresh-context numbers or an uncorroborated historical blog
      estimate.
    diligencePath: >-
      Request the latest financing memo or obtain a fresh independent financing report that states post-money valuation
      explicitly.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: material
    topic: concentration-and-mix
    missingEvidence: Customer concentration, GRR/NRR, international revenue mix, and segment-level contribution data.
    whyItMatters: >-
      Reported scale is meaningful, but resilience and quality of growth cannot be judged without concentration and
      retention context.
    diligencePath: Ask management for cohort retention, top-customer exposure, and geography or product revenue splits tied to FY26.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: private-evidence-only
    severity: material
    topic: sam-som-segmentation
    missingEvidence: Segment-level revenue, take-rate, and transaction-volume splits by geography, buyer type, and product line.
    whyItMatters: >-
      Without segmented economics, the market narrative stays at the broad-demand level and cannot support a precise
      SAM, SOM, or market-share argument.
    diligencePath: >-
      Request management reporting for revenue mix, TPV mix, take-rate by product, and international versus India
      contribution.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-owner-detail
    missingEvidence: >-
      Contract-level evidence on who signs, who pays, and how budgets are approved across merchant versus bank
      deployments.
    whyItMatters: >-
      Merchant and bank sales motions can look similar in prose but have very different procurement cycles, payback
      periods, and implementation risks.
    diligencePath: >-
      Review sample contracts, implementation plans, or win-loss notes covering at least one merchant and one bank
      deployment.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: peer-pricing
    missingEvidence: >-
      Matched official pricing, fee units, minimum commitments, implementation charges, and discount schedules for
      Juspay and its direct peers.
    whyItMatters: >-
      Without normalized commercial terms, the analysis cannot determine whether Juspay wins on price, packaging, or
      only product breadth.
    diligencePath: >-
      Request anonymized proposals and MSAs for matched merchant volumes, then compare effective fees and implementation
      costs on the same payment mix.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-multihoming
    missingEvidence: >-
      Renewal cohorts, win-loss records, migration timelines, multi-homing shares, and internal-build total-cost data
      from comparable customers.
    whyItMatters: >-
      Product breadth alone cannot prove that customers are locked in or that internal builds and direct PSP
      relationships are uneconomic.
    diligencePath: >-
      Interview reference customers and inspect renewal, routing-share, migration, and implementation-cost records
      segmented by merchant and bank deployment.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly or quarterly burn, debt facilities, and management runway target after the January
      2026 round.
    whyItMatters: >-
      Without liquidity and burn data, capital adequacy and next-round timing cannot be underwritten from public
      evidence.
    diligencePath: Request post-FY26 cash bridge, current bank balances, debt schedules, and board runway materials.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Realized take rate, gross margin, CAC, payback, GRR/NRR, and customer concentration by revenue.
    whyItMatters: >-
      These metrics determine whether volume growth translates into durable, high-quality revenue and operating
      leverage.
    diligencePath: >-
      Request product-line P&L, cohort retention tables, sales-efficiency metrics, and top-customer concentration
      disclosures.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: profitability-bridge
    missingEvidence: >-
      An audited bridge across FY25 profit before exceptional items and tax, FY25 net profit, FY26 adjusted EBITDA, FY26
      net loss, and cash flow.
    whyItMatters: >-
      Public profitability figures use different definitions, so the margin path can be overstated or misread without a
      common bridge.
    diligencePath: >-
      Request audited FY25 and FY26 financial statements plus management reconciliation between operating profit, net
      profit, and cash generation.
    relatedQuestionRefs:
      - QI004
  - type: missing-source
    severity: material
    topic: compliance-validation
    missingEvidence: >-
      Independent audit or certification artifacts for PCI DSS, GDPR posture, uptime SLA commitments, and any public
      incident or status-history record.
    whyItMatters: >-
      Feature-level control claims do not prove enterprise-grade compliance or operational resilience, which matters
      directly to underwriting technical and security risk.
    diligencePath: >-
      Request the current PCI DSS attestation, security overview, uptime SLA, status-history archive, and any
      third-party assurance reports covering production operations.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: implementation-burden
    missingEvidence: >-
      Module-level implementation timelines, support coverage, and merchant engineering effort for self-hosted versus
      managed deployments.
    whyItMatters: >-
      Juspay's modular and open-source positioning can lower lock-in, but it may also shift operational burden to the
      customer in ways not visible from marketing pages.
    diligencePath: >-
      Request two recent implementation plans, support/SLA matrices, and customer references segmented by deployment
      model and module mix.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE001
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Customer-level NRR, GRR, churn, renewal rates, contract length, and cohort retention by merchant, bank, or
      geography.
    whyItMatters: >-
      Public evidence shows scale and product breadth, but it does not prove whether customers renew or deepen spend
      after initial deployment.
    diligencePath: >-
      Request cohort retention, renewal, and contract data from management, ideally segmented by banks, Indian
      merchants, and international enterprise accounts.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer revenue concentration, share of TPV by the ten largest accounts, and a production-versus-pilot split
      for named logos.
    whyItMatters: >-
      Logo breadth alone can overstate durability if a few large accounts or app relationships drive most revenue or
      payment volume.
    diligencePath: >-
      Ask management for customer concentration, live-account counts, and module penetration by named enterprise and
      bank customers.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-verification
    missingEvidence: >-
      Regulator records, legal-entity license identifiers, current certificates, audit periods, exceptions, enforcement
      history, and jurisdiction-specific scope.
    whyItMatters: >-
      Unsupported license or compliance scope could block products, markets, or enterprise contracts and materially
      change residual legal exposure.
    diligencePath: >-
      Obtain management's entity-by-jurisdiction matrix and current audit pack, then verify identifiers with each
      regulator and review with payments counsel.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-model-risk
    missingEvidence: >-
      Audited gross margin, fraud and loss exposure, working-capital profile, customer and partner concentration,
      liquidity, cash generation, and stress tests.
    whyItMatters: >-
      Public discussion of low take rates cannot establish whether transaction growth produces durable economics or
      hidden balance-sheet and cash risk.
    diligencePath: >-
      Review FY26 audited accounts, monthly management accounts, loss ledgers, settlement flows, top-counterparty
      exposures, and downside liquidity scenarios.
    relatedQuestionRefs:
      - QR007
  - type: private-evidence-only
    severity: material
    topic: resilience-validation
    missingEvidence: >-
      Audited incident history, severity-one root-cause analyses, RTO and RPO test results, failover evidence,
      write-back lag distributions, and customer SLAs.
    whyItMatters: >-
      Marketing uptime and architecture descriptions do not establish realized availability or recovery performance
      across the full production estate.
    diligencePath: >-
      Review three years of incident and SLA data, observe disaster-recovery and active-active tests, and reconcile
      results to customer credits and churn.
  - type: private-evidence-only
    severity: material
    topic: round-disclosure-gap
    missingEvidence: >-
      Exact primary-versus-secondary split, investor rights, liquidation preferences, and board / governance terms for
      the January 2026 round.
    whyItMatters: >-
      The announced headline valuation can overstate common-share entry quality if dilution or preference terms are
      investor-favorable.
    diligencePath: Request the term sheet, updated cap table, and board materials summarizing the post-round security stack.
    relatedQuestionRefs:
      - QV007
  - type: missing-source
    severity: material
    topic: underwriting-metrics
    missingEvidence: Quarterly FY26-to-FY27 revenue trajectory, gross margin, cash generation, and segment mix.
    whyItMatters: >-
      Without current unit economics and cash conversion, public sources cannot distinguish temporary investment drag
      from a structurally lower-margin business.
    diligencePath: Obtain management accounts and KPI bridge decks covering growth, margin, opex, and cash flow by quarter.
    relatedQuestionRefs:
      - QV006
      - QV008
  - type: missing-source
    severity: material
    topic: concentration-and-retention
    missingEvidence: Customer concentration, GRR / NRR, international revenue mix, and routing-share changes after partner conflict.
    whyItMatters: >-
      Valuation upside depends on durable enterprise stickiness; concentration or share erosion would compress the
      appropriate multiple.
    diligencePath: >-
      Request cohort retention tables, top-customer exposure, regional revenue mix, and routing-share trend data by
      large merchant cohort.
    relatedQuestionRefs:
      - QV005
      - QV008
    relatedTableRefs:
      - TV001
      - TV003
