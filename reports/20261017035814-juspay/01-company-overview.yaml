callouts:
  - calloutType: strength
    title: Scaled enterprise infrastructure is real
    body: >-
      Even after discounting company-controlled framing, the assigned pool supports a real
      enterprise-scale platform: 500+ enterprises and banks, 400 million daily transactions,
      >$1 trillion annualised TPV, and expanding international operating hubs.
    claimRefs: [CO004, CO008, CO009]
  - calloutType: risk
    title: Governance evidence still trails operating evidence
    body: >-
      The source pack is much stronger on operating traction than on ownership and control. Current
      public founder attribution conflicts across sources, and the latest disclosed funding history
      is still lightly corroborated relative to the diligence importance of valuation, board rights,
      and cap-table clarity.
    claimRefs: [CO011, CO012, CO013]
