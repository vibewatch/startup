company:
  name: Juspay
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Juspay enters this refresh as a scaled, still founder-led payments infrastructure platform:
    current company and press materials support 500+ enterprise and bank customers, 400 million
    daily transactions, more than $1 trillion of annualised TPV, and FY26 revenue of ₹664 crore.
    The same source pack also shows why diligence still needs to stay skeptical: FY26 swung to a
    ₹90 crore net loss amid AI and global-expansion investment, public founder attribution is not
    fully consistent across sources, and current valuation, cap-table, and board details remain
    under-evidenced.
sections:
  - id: identity-and-scope
    title: Identity, scope, and current scale
    body: >-
      The assigned evidence consistently describes Juspay as a Bengaluru-founded payments
      infrastructure company that has expanded from checkout and orchestration into a broader
      global operating system for merchant, bank, and payout workflows. Company materials place
      the business at the intersection of checkout UX, payment orchestration, authentication,
      tokenisation, payouts, and bank payments stacks rather than a single PSP point product.
      That positioning is not just marketing breadth: the same FY26 company release that reports
      revenue growth also claims 400 million daily transactions, 500+ enterprise and bank
      relationships, annualised TPV above $1 trillion, and a 1,500+ person operating footprint
      spanning India plus hubs in San Francisco, Dublin, São Paulo, Singapore, and Dubai. The
      core underwriting takeaway for later chapters is that Juspay is already operating at
      meaningful enterprise scale, but many of the largest scale metrics still originate with
      company-controlled disclosures rather than audited filings.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO008, CO009]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership, and governance visibility
    body: >-
      Public leadership visibility in this source pack centers on Vimal Kumar and Sheetal
      Lalwani, with Lalwani also serving as the named spokesperson on the FY26 update. That gives
      enough evidence to treat the company as still tightly tied to a small founder/executive set,
      but not enough to underwrite governance cleanly. The main complication is founder
      attribution: StartupTalky identifies Vimal Kumar and Ramanathan RV as founders and says
      Ramanathan left in January 2023 to start Hyperface, while Business Standard instead states
      that Juspay was co-founded by Vimal Kumar and Sheetal Lalwani. That conflict does not alter
      the operating fact that Vimal and Lalwani are the current visible leadership anchors, but it
      is a real diligence flag because the assigned pool does not independently resolve board
      composition, founder shareholding, or control rights.
    claimRefs: [CO010, CO012, CO013]
    tableRefs: [TO002]
  - id: funding-and-stakeholders
    title: Funding history, stakeholder relevance, and monetisation signals
    body: >-
      The operating story is easier to verify than the capital-structure story. StartupTalky
      provides the clearest current funding chronology in the assigned pool, listing four rounds
      totaling $147.42 million through a $60 million Series D led by Kedaara Capital on 2025-04-07.
      That supports a post-Series D private-company framing, but the figure is still lightly
      corroborated and does not resolve secondaries, debt, or present-day investor ownership.
      External stakeholder relevance is nonetheless clear: VEF's March 2025 note calls Juspay one
      of its top three holdings and describes merchant performance gains from HyperCheckout, while
      official and independent FY26 reporting support real commercial scale in enterprise checkout
      and payment operations. In short, the company looks commercially important and late-stage,
      but the current source pack is still short of a board-rights or cap-table-grade view.
    claimRefs: [CO004, CO006, CO007, CO008, CO009, CO011, CO016]
    tableRefs: [TO003]
  - id: milestones-and-watchpoints
    title: Milestones, trajectory, and current watchpoints
    body: >-
      Juspay's arc in the assigned evidence is coherent even where some ownership details are not:
      it was founded in 2012, raised institutional rounds from Accel, VEF, SoftBank Vision Fund,
      and Kedaara, saw a founder departure in 2023, made the LotusPay acquisition in 2024, and
      spent FY26 pushing global expansion plus a new AI and open-source product layer. The
      immediate watchpoint is not whether the company has found demand, because current sources do
      support scaled usage and broad geographic reach; it is whether the investment phase can keep
      translating into durable economics and control clarity. FY26 revenue growth to ₹664 crore
      came with a swing to a ₹90 crore net loss, and the source pack still leaves open questions on
      valuation, ownership, board oversight, and concentration risk. That keeps Juspay in the
      category of a real scaled asset with unfinished governance and profitability diligence.
    claimRefs: [CO006, CO007, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
