chapter:
  number: 5
  title: "Product & Technology"
  summary: "Juspay sells a broad payments-infrastructure stack rather than a single checkout tool: public product surfaces span orchestration, checkout, authentication, tokenisation, payouts, reconciliation, and UPI-specific infrastructure. The clearest technical differentiator is Hyperswitch, which Juspay positions as an open-source, modular layer that can be self-hosted or consumed as a managed service, but most reliability, compliance, and performance proof in this pool remains company-issued."
sections:
  - id: "product-scope"
    title: "Product surface covers merchant UX, orchestration, and bank-payment rails"
    body: |
      Juspay's public product catalog presents a multi-module stack rather than a narrow gateway overlay. The core commercial surface spans payment orchestration, recurring payments / revenue recovery, checkout experience, 3DS and authentication, tokenisation, payouts, offers, reconciliation, and India-specific UPI infrastructure, with Hypercheckout and UPI 360 called out as branded modules rather than generic feature bullets. The workflow implication is that merchants can use Juspay at several layers: customer-facing checkout, PSP and routing logic, token and authentication controls, and bank or UPI-facing payment rails. That breadth matters because product value is being sold as both conversion uplift and infrastructure consolidation, not only as acceptance-rate optimization. [ClaimRefs: CE001, CE002, CE003, CE004]
    claimRefs: ["CE001", "CE002", "CE003", "CE004"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture-deployment"
    title: "Architecture combines commercial no-code modules with an open-source core"
    body: |
      The most concrete technical evidence is Hyperswitch. Juspay describes it as an open-source, modular stack that can be self-hosted on cloud or on-prem infrastructure or consumed as a managed service, while the repository documentation breaks the system into a Rust app server, vault and encryption services, a routing control plane, merchant dashboards, and client SDKs. This architecture is consistent with Juspay's commercial pitch that merchants can layer routing, retries, vaulting, observability, and authentication onto an existing payments stack instead of replacing everything at once. Partner evidence from RateGain also shows the product can sit inside another enterprise platform, where Juspay supplies orchestration and routing infrastructure rather than a directly branded merchant front end. [ClaimRefs: CE005, CE006, CE007, CE008, CE009, CE010, CE011, CE015]
    claimRefs: ["CE005", "CE006", "CE007", "CE008", "CE009", "CE010", "CE011", "CE015"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "maturity-controls-risks"
    title: "Scale and control claims are strong, but third-party validation is thin"
    body: |
      Product maturity is supported by repeated claims that Juspay already serves hundreds of enterprises and processes hundreds of millions of daily transactions, and by 2026 partner evidence that the stack is being embedded into new vertical offerings such as RateGain's travel product. Public documentation also describes fairly specific control primitives—vaulting, network tokens, adaptive 3DS, rule-based authentication, smart retries, and compliance-sensitive deployment options—which is more concrete than generic marketing language. The underwriting problem is that the assigned pool does not include independent validation for PCI, GDPR, uptime SLAs, or incident history: the strongest operational metrics, including 20,000 TPS, sub-100ms processing, and six-nines uptime claims, still come from Juspay's own materials. The product looks architecturally credible and operationally broad, but diligence still needs external proof for security, compliance, and realized deployment burden. [ClaimRefs: CE006, CE011, CE012, CE013, CE014]
    claimRefs: ["CE006", "CE011", "CE012", "CE013", "CE014"]
