  - calloutType: "strength"
    title: "Differentiation comes from architecture optionality, not only checkout UX"
    body: "Juspay's strongest product argument is that merchants can adopt a modular stack—commercial surfaces, routing logic, and even an open-source core—without committing to a single hosted gateway model."
    claimRefs: ["CE004", "CE007", "CE008", "CE009"]
  - calloutType: "risk"
    title: "Trust posture is still under-documented for underwriting"
    body: "The pool documents many control features, but it does not provide independent evidence for PCI/GDPR posture, uptime commitments, or incident history, so operational diligence still depends heavily on management materials."
    claimRefs: ["CE006", "CE007", "CE014"]
