      - number: '3.3'
        title: 定价不透明，切换成本仍属推断
        blocks:
          - type: paragraph
            body: >-
              公开商业可比性很弱。G2 将 Juspay 定价标为定制，并引导买方联系供应商；现有来源没有 Juspay 或最接近同业 的标准化价格、费率表、最低承诺、折扣或实施费。Juspay 称最低成本路由最多可降低
              30% 的支付成本，但这 是供应商口径，不是披露的实际节省。广泛的银行技术栈可能提高切换成本，因为替代方案必须复现运营和控制 平面功能；但多 PSP
              连接也可能让成熟商户更容易绕开任何一个处理商。现有来源没有客户合同、续约群组、 迁移研究或可比的内部建设总成本模型来化解这一矛盾。因此，定价和锁定仍是重要尽调空白，而非已证实的 竞争优势来源。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP013
      - number: '3.4'
        title: 壁垒在嵌入式部署中最深，但渠道边缘仍脆弱
        blocks:
          - type: paragraph
            body: >-
              最有力的持久性依据是运营嵌入：使用商户入驻、风控、授权、结算和对账功能的银行，比更换结账组件的商户 面临更大的迁移范围。规模口径也说明其工程经验可观，但保留来源没有将这些说法与直接同业进行基准比较。
              反向证据同样重要。StartupTalky 报道称，Paytm、PhonePe、Cashfree 和 Razorpay 终止了与 Juspay 作为第三方 编排供应商的合作。G2
              的评论样本虽小，但整体评价为正；其中一位评论者提到未公告的维护，以及 UPI 支付 中断数小时。两项证据都不能证明系统性流失或不可靠，但都削弱了简单的锁定论。稳妥判断是：Juspay 确实
              拥有广度和本地化优势，但当大型支付平台把编排内化，或买方可以多家部署时，被替代风险会上升。
            claimRefs:
              - CP004
              - CP005
              - CP012
              - CP014
              - CP015
