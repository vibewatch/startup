      - number: '1.3'
        title: 融资历史、利益相关方重要性与变现信号
        blocks:
          - type: paragraph
            body: >-
              运营故事比资本结构故事更容易核实。现有来源中，StartupTalky 提供了最清晰的当前融资时间线：共四轮、累计 $147.42 million，至 2025-04-07 由 Kedaara Capital
              领投的 $60 million Series D 为止。这支持“Series D 之后的私营公司”这一判断，但该数字仍缺乏充分交叉验证，也无法厘清老股转让、债务或当前投资人持股。外部
              利益相关方的重要性仍很明确：VEF 2025 年 3 月的报告称 Juspay 是其前三大持仓之一，并描述 HyperCheckout 带来的商户表现提升；官方及独立的 FY26
              报道也支持其在企业结账和支付运营上的真实商业规模。简而言之，公司 看起来具有商业重要性且已进入后期阶段，但现有来源仍不足以构建董事会权利或股权结构级别的判断。
