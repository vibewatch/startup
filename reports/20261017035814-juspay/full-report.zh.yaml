    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、范围与当前规模
        blocks:
          - type: paragraph
            body: >-
              分配到的证据一致将 Juspay 描述为一家源自 Bengaluru 的支付基础设施公司；它已从结账和支付编排扩展为服务商户、 银行和出款流程的全球操作系统。公司材料显示，其业务位于结账
              UX、支付编排、认证、令牌化、出款和银行支付 技术栈的交汇处，而非单一 PSP 点产品。这个定位不只是营销口径：同一份报告收入增长的 FY26 公司公告还称， 日交易笔数为 400
              million，企业及银行关系超过 500，年化 TPV 超过 $1 trillion，运营团队超过 1,500 人， 覆盖印度，并在 San Francisco、Dublin、São
              Paulo、Singapore 和 Dubai 设有枢纽。后续章节的核心投资判断是： Juspay 已在有意义的企业规模上运营，但最大的一批规模指标仍来自公司控制的披露，而非经审计的申报文件。
