    title: 正反论点表
    columns:
      - 观察角度
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 规模证据
        - 日交易量超过 3 亿笔、年化 TPV 超过 $1 万亿，以及 500 多个企业客户关系，支持“Juspay 已是重要基础设施”的说法。
        - 如果这些交易量集中在少数客户，或无法转化为可持续的费率，规模的可辩护性就会低于表面看起来的水平。
      - - 产品护城河
        - 官方产品页面将 Juspay 定位为连接 300 多家 PSP 的编排层，并称其提升了授权率、拥有较高的 UPI 成功率，这些都可能带来高黏性的集成。
        - 若有独立证据证明这些提升在不同地区和大型商户中都能持续，护城河逻辑会更扎实；若商户快速切换的证据出现，逻辑则会减弱。
      - - 资本效率
        - 2026 年融资和 FY25 盈利表明，公司能够吸引资本，并且至少曾经实现过经营杠杆。
        - 如果再亏损一年，或融资估值低于上一轮，就意味着盈利拐点只是暂时现象，而非结构性变化。
      - - 执行 / 生态风险
        - ET 记录了 PA 牌照之后的合作伙伴渠道紧张关系，而公开来源没有披露确切的融资条款或优先权压顶。
        - 清晰的留存数据、稳定的路由份额说明和完整融资条款，都会降低市场应采用的折价率。
    notes: 各行结合了公司报告的经营证据，以及关于资本市场和生态风险的独立报道；未知条款和集中度数据仍是明确的限制条件。
