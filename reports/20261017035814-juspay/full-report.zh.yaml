      - number: '3.2'
        title: 广度与本地基础设施是最明确的差异化
        blocks:
          - type: paragraph
            body: >-
              Juspay 的官方页面把产品呈现为覆盖面广的运营层，而非单一网关。当前产品目录覆盖支付编排、经常性支付、结账、 认证、令牌化、出款、优惠、对账和收入回收。其编排页面还提供无需代码即可接入 300-plus 个
              PSP 和本地 支付方式；银行产品则从商户入驻和风险控制延伸至授权、清分、结算、账单和对账。印度页面进一步把 UPI 结账、TPAP/PPI
              技术栈和银行收单定位为本地深度。这些是公司口径，不是基准测试结果，因此对比矩阵区分 已披露范围和同业未知单元。证据支持其凭集成广度和部署场景实现差异化，但不能证明其授权、可靠性或经济性 优于每一家指定竞争对手。
            claimRefs:
              - CP001
