  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方结构
        blocks:
          - type: paragraph
            body: >-
              Juspay 所处市场可定义为支付基础设施软件：帮助企业和金融机构跨多个供应商管理结账、路由、认证、重试、 对账及本地支付通道的复杂性。因此它位于支付编排和受理层，而不是消费者钱包分发或纯网关经济。商户买方
              通常希望提高支付批准率、降低支付成本，并简化多 PSP 运营；银行或 TPAP 买方则希望更快升级收单或 UPI
              基础设施，同时保留合规控制、商户所有权和战略灵活性。现状替代方案仍包括直接接入网关、拼接多供应商技术栈 以及更慢的内部自建。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM013
              - CM014
