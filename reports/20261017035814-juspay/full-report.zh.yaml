companyProfile:
  summary: >-
    Juspay 是一家源自 Bengaluru 的支付基础设施公司，为企业、银行和支付平台提供支付编排、结账、认证、令牌化、出款、 UPI 及银行支付基础设施。公开证据显示其已具备可观规模：日交易笔数达 400 million，年化
    TPV 超过 $1 trillion， FY26 收入为 $75 million；但毛利质量、集中度和股权结构等关键问题仍未解决。
  headquarters: Bengaluru, India
  productSummary: 覆盖支付编排、结账、认证、令牌化、出款、经常性支付、UPI 及银行技术栈流程的企业支付基础设施。
  customerFocus: 企业、银行、收单机构和大型商户。
  businessModel: 与交易量挂钩的企业基础设施业务，收入来自交易费及实施比重较高的商业项目。
  stage: Series D
  fundingStatus: 后期阶段私营公司；公开来源指向 2026 年 1 月一轮 $1.2 billion 估值的融资，市场数据来源还报告累计融资额为 $161 million。
  disclosureProfile: private-disclosed
chapters:
