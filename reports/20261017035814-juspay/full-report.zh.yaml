              - CM014
      - number: '2.2'
        title: 市场规模视角与采用驱动因素
        blocks:
          - type: paragraph
            body: >-
              保留来源中最宽泛的需求视角，是一项印度数字支付流量估算：到 2026 年从 $3 trillion 增长至 $10 trillion； 但这只是宏观交易流量，不是支付编排软件的
              TAM。更有用的视角是平台吞吐量、企业覆盖面和集成广度： Juspay 称服务超过 500 家企业，年化支付额超过 $1 trillion，日交易约 400 million；其商户产品还宣传已 集成
              300-plus 个 PSP 和本地支付方式。支付通道与地域的碎片化，加上更高成功率、更低处理成本和更快上线 新支付能力的明确 ROI，共同推动了采用。
            claimRefs:
              - CM003
