      - number: '4.2'
        title: 公开运营进展与有限的单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              Juspay 最强的公开财务信号是运营规模。FY25 公司公告称，收入达到 ₹514 crores，日交易超过 300 million， 年化 TPV 为 $1 trillion；FY26 公司材料称，收入达到
              $75 million，日交易增至 400 million，平台服务 500+ 家企业和银行。这些数据说明，公司在首次实现盈利后仍保持复合增长。单位经济性的推断则较弱。Juspay 自有产品页面称，路由最多可降低
              30% 的支付成本，并将授权率最多提升 10%，但这些是供应商口径，不是披露 的商户实际结果。StartupTalky 的历史表还显示，FY25 之前的收入增长伴随持续亏损，进一步说明仅凭规模无法看出 毛利质量。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
              - CI014
              - CI015
