              - CR006
              - CR007
      - number: '7.4'
        title: 依赖、财务模型风险与终止标准
        blocks:
          - type: paragraph
            body: >-
              Juspay 宣传的广度同时带来韧性和协同风险：公司称已集成 300-plus 个 PSP 和本地支付方式，VEF 则描述了
              其卡组织合作关系，以及为一家未具名全球银行搭建的完整收单业务。公司还覆盖支付编排、结账、认证、令牌化、 出款、优惠、对账和收入回收。VEF 将印度描述为低毛利支付环境：UPI 商户折扣率为零，其他市场的经济性也受
              上限约束；但现有来源没有经审计的毛利、亏损、欺诈、营运资金或现金暴露数据。论点失效触发条件包括 PA 主导 的商户绕行持续发生、重大安全或可用性事故且没有经过测试的恢复能力、无法验证必需牌照，或证据表明合作伙伴
              集中度和低抽成率无法支撑持久的单位经济性。
            claimRefs:
