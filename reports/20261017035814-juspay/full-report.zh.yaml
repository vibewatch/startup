  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              最直接的风险是生态去中介化：Business Standard 报道运营摩擦，以及支付聚合商推动商户离开第三方路由的行动， 直接挑战 Juspay
              所营销的中立编排定位。技术韧性是第二大暴露，因为工作负载可在数秒内飙升 twenty-fold； 已披露架构缓解了早期数据库瓶颈，却仍依赖最终一致性和托管云。监管与跨境执行风险排在其后，因为公开合规声明覆盖面
              很广，但实体层面的牌照和司法辖区范围没有独立证据。热力图是定性判断，反映证据强度和影响，而非测量 得出的概率模型。
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR011
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR006
              - CR010
              - CR011
              - CR016
      - number: '7.2'
        title: 监管与法律暴露
        blocks:
          - type: paragraph
            body: >-
              Juspay 称其银行平台符合 PCI DSS V4、PSD2、ISO 27001:2022、SOC 2 Type 2 和 GDPR。这些说法说明公司拥有
              相当完整的控制体系，但现有证据没有提供证书、审计期间、覆盖的法律实体、例外情况或监管记录。一篇声誉 较低的博客还称其具备 Payment Aggregator
              身份，并较早适配印度本地化规则；这里只将其视为未经验证的线索。 VEF 是投资人而非独立基准来源，它描述了公司向欧洲、美洲、东南亚和中东扩张。因此，投资放行应要求按
              司法辖区和实体列明的牌照矩阵、最新审计报告、执法检索结果，并由法律顾问确认 Juspay 或其客户分别承担哪些 受监管义务。
            claimRefs:
              - CR003
              - CR011
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR011
              - CR015
      - number: '7.3'
        title: 运营、质量与安全暴露
        blocks:
          - type: paragraph
            body: >-
              不利的商户渠道报道之所以重要，是因为它描述的是影响交易对手的运营问题，而不只是理论上的宕机场景。 Juspay 供应商托管的技术账户称，IPL 流量可在数秒内从正常水平跃升至平均值的
              twenty-fold，并描述了早期 限流、数据库扩展约束和数据库单点故障隐患。当前以内存为先的设计、受控回写、次级流和故障隔离是可信的 缓解措施，但同一账户称多区域 active-active
              韧性仍是未来工作。公司可用性口径覆盖范围不同，也没有独立 审计的测量窗口。因此，月度复盘应追踪支付失败率、限流、回写延迟、恢复目标、一级事故，以及经测试的 active-active 故障切换进度。
            claimRefs:
              - CR001
