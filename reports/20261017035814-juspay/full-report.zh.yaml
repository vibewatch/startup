      - number: '1.2'
        title: 创始人、管理层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              这批来源中的公开管理层信息集中于 Vimal Kumar 和 Sheetal Lalwani，Lalwani 还是 FY26 更新的指定发言人。证据足以
              判断公司仍与少数创始人及高管紧密绑定，但不足以对治理作出明确投资判断。主要难点在于创始人归属： StartupTalky 将 Vimal Kumar 和 Ramanathan RV 认定为创始人，并称
              Ramanathan 于 2023 年 1 月离开、创办 Hyperface；Business Standard 则称 Juspay 由 Vimal Kumar 和 Sheetal Lalwani
              共同创立。这个冲突不改变 Vimal 和 Lalwani 是当前公开管理层核心这一事实，但确实构成尽调警示，因为现有来源无法独立确认董事会构成、 创始人持股或控制权。
            claimRefs:
              - CO010
              - CO012
              - CO013
