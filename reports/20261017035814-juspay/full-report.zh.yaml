      - number: '8.2'
        title: 情景框架
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开估值锚点是里程碑，而不是公开市场可比公司。ET 报道 Juspay 于 2025 年 4 月以 $900 million 估值融资 $60 million，随后在 2026 年 1 月达到 $1.2
              billion；因此，在市场尚未看到扩张后的完整年度盈利 之前，当前估值已经包含明显上调。这并不否定该价格：行业报道认为，基础设施金融科技深度集成后能受益于 与交易挂钩的经常性收入和显著切换成本。但只有当
              FY26 亏损是暂时的、全球扩张能复合推动企业采用， 且生态冲突不会压缩编排份额时，估值才有吸引力。在没有留存率、集中度、毛利率和优先权 overhang 的独立披露
              前，基准情景应围绕前一轮私募估值与当前估值之间的宽区间，而不是制造虚假的精确度。
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV007
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: 建议与尽调问题
        blocks:
          - type: paragraph
            body: >-
              从公开记录看，正确选择是跟踪，而不是买入。Juspay 有真实的规模证据，所在品类正被投资人重新定价，产品广度 也足以值得再次审视。但同一份记录还显示盈利波动、PA
              牌照之后的渠道冲突，以及最新一轮融资确切经济条款和 治理安排披露不完整。因此，当前估值看起来偏高，而非明显错价：如果管理层能展示 FY27 毛利率恢复和持久的
              国际增长，它可能奏效；但现有证据尚不足以把这一结果作为基准情景进行投资判断。在从观察名单转向高确信度前， 尽调应迫使公司回答客户集中度、留存率、毛利率、国际收入组合、优先权条款，以及
              PhonePe、Razorpay 和 Cashfree 带来的路由份额压力是趋稳还是恶化。
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 按公布估值跟踪
            body: 按规模化基础设施资产的标准看，当前 $1.2 billion 估值并非不可接受，但公开记录在盈利持久性、集中度和融资条款 上仍不完整，无法支持买入判断。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV010
              - CV012
              - CV014
          - type: callout
            title: 哪些变化会提升判断
            body: 更清晰的 FY27 毛利率路径、透明的融资条款，以及合作伙伴渠道紧张没有侵蚀商户路由份额的证据，会让同一业务 更容易作出投资判断。
            calloutType: assumption
            claimRefs:
              - CV009
              - CV010
              - CV012
