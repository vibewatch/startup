  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              2026 年后续融资为 Juspay 提供了真实市场数据点：WestBridge 以 $1.2 billion 估值投资 $50 million，交易
              明确混合了新股资本和老股流动性。这有力说明成熟资本仍希望投资规模化支付基础设施，尤其是在 Juspay 报告 日交易超过 300 million、年化 TPV 超过 $1 trillion
              之后。看多逻辑是，公司如今更像难以替代的基础设施， 而不是功能供应商；公司称覆盖 500+ 家企业、接入 300+ 个 PSP，并拥有可以走出印度的开放模块化技术栈。
              入场纪律的问题在于，公开来源仍未披露确切的新股与老股比例、优先权条款、客户集中度，或足够的单位经济性 细节，无法证明新估值是保守投资判断的结果，而非动量推动。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV012
              - CV013
