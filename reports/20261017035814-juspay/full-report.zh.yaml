  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值区间逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - FY26 亏损证明只是暂时的；国际扩张带来可持续的企业增长；编排和银行基础设施产品继续维持较高的切换成本。
        - 高于当前 $12 亿估值，因为届时 2026 年 1 月融资会像是更长期溢价重估的早期一步。
        - 利润率修复延后，全球扩张消耗现金却没有带来匹配的收入，或合作伙伴冲突再次出现。
        - 有可能，但从公开证据看尚不是默认情景。
      - - 基准
        - 增长仍然健康，但公司持续投资至 FY27 期间，盈利能力和披露情况仍好坏参半。
        - 介于 2025 年 4 月的 $9 亿参考值和 2026 年 1 月的 $12 亿估值之间，因为业务仍值得溢价，但不足以支撑完全风险偏好的倍数。
        - 留存、集中度和股权结构不透明，使投资者不会激进地抬高出价。
        - 与当前公开记录最一致。
      - - 悲观
        - 亏损持续，商户将编排内置化或迁移出去，而下一轮融资在利润率明显修复前到来。
        - 低于此前 $9 亿的私募参考值，意味着最新独角兽估值高估了利润率和渠道地位的持久性。
        - 下轮融资风险、倍数压缩，以及不利的路由份额说明。
        - 这是一个现实的下行情景，因为 FY26 盈利已经逆转。
    notes: 区间以已观察到的 2025 年和 2026 年私募融资估值为参照，因为指定证据池没有提供干净的公开可比公司或并购倍数集合。
    claimRefs:
      - CV002
      - CV007
      - CV009
      - CV010
      - CV011
      - CV014
