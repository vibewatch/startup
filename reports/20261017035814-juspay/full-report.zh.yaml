              - CM014
      - number: '2.3'
        title: 约束、切换成本与未解空白
        blocks:
          - type: paragraph
            body: >-
              市场吸引力并不能消除执行摩擦。支付习惯、KYC 和 AML 要求、本地监管，以及碎片化的银行或支付方式覆盖， 仍迫使公司按国家适配，可能拖慢上线或压缩短期 ROI。与此同时，编排层一旦深度集成，买方往往面临显著的
              运营切换风险；这有助于留存，却也会因为决策关系到关键基础设施而拉长销售周期。剩余的公开数据空白在于 可变现的市场定义：保留来源支持广泛需求和实际平台规模，但不足以清晰拆出 Juspay 的 SAM 或
              SOM、细分市场 预算负责人，或国际收入组合，因此无法精确主张市场份额。
            claimRefs:
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 支付基础设施预算靠 ROI，而非品牌投入来证明合理性
            body: 保留证据中最有力的采用逻辑来自运营层面：买方要的是更高批准率、更低处理成本、更快上线支付方式，以及 更少的支付工程开销，而不是消费者获客故事。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM009
          - type: callout
            title: 公开市场规模仍过于宽泛，无法清晰论证份额
            body: 平台规模披露很强，但保留的公开记录仍未按地域、行业或预算负责人拆出可变现的 SAM 或 SOM，限制了估值精度。
            calloutType: risk
            claimRefs:
              - CM008
              - CM012
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 密集竞争格局超出支付编排供应商
        blocks:
          - type: paragraph
            body: >-
              相关市场不止支付编排。Tracxn 的分类把 Checkout.com、PPRO 和 Primer 等直接基础设施同业，与 Zuora 和 PayNearMe
              等相邻流程并列，并显示这些公司的融资基础差异很大。Juspay 还面临面向印度市场的默认网关、 直接 PSP 关系，以及大型商户或银行保留旧系统、内部搭建编排层的选择。后两种是买方的分析选项，并非
              指定供应商；保留证据没有量化其成本。Angeltors 报道 Juspay 为 Amazon、Flipkart 和 Swiggy 提供支付，
              说明其企业分发能力，但该来源声誉较低，无法独立证明留存率或赢单率。竞争格局因此很拥挤：Juspay 不仅 要击败功能丰富的同业，还要击败买方现有技术栈，而不只是另一家印度网关。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP016
