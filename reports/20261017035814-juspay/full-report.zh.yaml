              - CI015
          - type: callout
            title: 资本充足性仍阻碍尽调
            body: 2026 年融资和 FY26 增长无法说明 Juspay 是否有足够流动性支持 AI 与国际扩张计划，因为现金、烧钱、债务和 续航均未公开披露。路由渠道压力也意味着，仅凭当前规模推断未来可持续毛利十分危险。
            calloutType: risk
