      - number: '4.3'
        title: 资本需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开融资证据确认，Juspay 于 2026 年 1 月以 $1.2 billion 估值融资 $50 million；一份独立来源称，该轮
              同时包含新股和老股，但未披露比例。这有助于理解估值，却不足以判断资本充足性，因为审阅的公开来源没有 披露融资后的现金余额、烧钱速度、债务额度或管理层续航目标。FY26 披露和报道还显示，Juspay 为国际扩张和
              AI 基础设施投入资金后重新出现会计亏损，因此不能仅凭增长推断下一次融资触发点。与此同时，Economic Times 报道 Paytm、Razorpay 和 Cashfree
              将商户从第三方路由转走，渠道压力可能削弱支付编排相关收入的质量和持久性。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI016
      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Juspay 的公开利好是：公司已达到有意义的基础设施规模，服务大型企业和银行，并在 FY26 仍实现两位数增长， 同时保持调整后 EBITDA 为正。公开风险同样重要：FY26
              净亏损回归，路由业务出现渠道冲突，毛利率、抽成率、 留存率、客户集中度、现金和续航等关键投资判断指标仍属私有信息。综合来看，公司具有商业重要性且可能具备
              防御力，但仅凭公开证据，还不足以对收入质量或资本密集度作出完整投资判断。任何投资观点都应把实际定价、 盈利桥接和流动性状况视为一级尽调门槛，而不是从交易量或估值标题外推。
            claimRefs:
              - CI006
              - CI008
              - CI009
              - CI012
              - CI015
              - CI016
      - number: '4.5'
        title: 图表
        blocks:
          - type: callout
            title: 规模可见，收益率不可见
            body: 支付量、企业数量和收入增长的公开证据很强，但实际定价、抽成率和毛利率的证据很弱。因此， 公司看起来规模庞大且具有商业重要性，却尚未证明每一美元 TPV 能捕获多少利润。
            calloutType: insight
            claimRefs:
