      - number: '1.4'
        title: 里程碑、发展轨迹与当前观察点
        blocks:
          - type: paragraph
            body: >-
              即使部分所有权细节尚不明确，现有证据中的 Juspay 发展轨迹仍然连贯：公司成立于 2012 年，从 Accel、VEF、 SoftBank Vision Fund 和 Kedaara 获得机构融资，2023
              年有创始人离任，2024 年完成 LotusPay 收购，并在 FY26 推进全球扩张及新的 AI 和开源产品层。当前要观察的重点不是公司是否找到了需求——现有来源确实支持其
              规模化使用和广泛地域覆盖——而是投资期能否继续转化为持久的经济效益和清晰的控制结构。FY26 收入增长至 ₹664 crore 的同时，净利润转为 ₹90 crore
              的亏损；估值、所有权、董事会监督和集中度风险仍有待回答。因此， Juspay 属于真实的规模化资产，但治理和盈利能力尽调尚未完成。
