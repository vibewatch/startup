              基础设施；Hypercheckout 和 UPI 360 被明确列为品牌化模块，而非泛泛的功能点。商户可以把 Juspay 接到多个环节：面向客户的结账、 PSP 与路由逻辑、令牌和认证控制，以及面向银行或
