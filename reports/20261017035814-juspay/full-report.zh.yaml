          note: 支付受理、拨付和支付管理平台。
    approximationNotes: 坐标是有证据支持的序数分类，不代表市场份额、质量、赢单率或基准分数；相差一点仅表示方向。
    claimRefs:
      - CP001
      - CP007
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据展示了 Juspay 如何将企业支付量转化为收入信号，但最重要的毛利和现金跑道环节仍未披露。
    data:
      nodes:
        - label: 商户支付量
          value: 300m+ FY25 / 400m FY26
          unit: daily transactions
          summary: Company-issued materials moved from more than 300 million daily transactions in FY25 to 400 million in FY26.
          note: 交易量数据由公司发布。
          claimRefs:
            - CI005
            - CI006
        - label: Juspay 基础设施模块
          summary: >-
            The public product stack spans orchestration, checkout, authentication, recurring payments, payouts,
            tokenisation, and UPI or bank infrastructure.
          claimRefs:
            - CI001
        - label: 客户 ROI 口径
          value: up to 30% / up to 10%
          unit: cost reduction / authorization lift
          summary: >-
            Product pages claim lower payment costs and better authorization, but they do not disclose customer cohorts
            or realized economics.
          note: 供应商口径，而非经过审计的商户结果。
          claimRefs:
            - CI013
            - CI015
        - label: 收入获取
          summary: >-
            Third-party profiling says Juspay monetizes mainly through transaction-based fees plus custom implementation
            and consultancy work.
          note: 按模块划分的公开收入结构未披露。
          claimRefs:
            - CI002
            - CI003
        - label: 成本基础和投资
          summary: >-
            FY26 disclosures point to AI, open-source infrastructure, and international expansion as meaningful cost
            drivers.
          claimRefs:
            - CI008
            - CI009
        - label: 报告的财务结果
          value: $75m FY26
          unit: revenue
          summary: >-
            Growth stayed positive and adjusted EBITDA stayed positive, but accounting losses returned and public
            cash/runway data remains absent.
          note: 现金跑道仍是尽调阻碍。
          claimRefs:
            - CI007
            - CI016
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI008
      - CI009
      - CI013
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Juspay 在编排逻辑、控制服务和开源基础设施核心之上，叠加面向商户的结账和区域支付 UX。
    data:
      layers:
        - label: 商户体验层
          detail: 面向客户、提供给商户的支付和身份验证界面。
          modules:
            - label: Hypercheckout
              detail: 带品牌的一键式无代码结账流程和实验
            - label: 3DS 与身份验证
              detail: 自适应 3DS 和基于规则的身份验证触发器
        - label: 区域支付通道
          detail: Juspay 推出的印度专属及银行连接型支付体验。
          modules:
            - label: UPI 360
              detail: 一键式 UPI，以及面向 UPI 应用的 SDK/S2S API
            - label: 出款通道
              detail: 卡、银行转账和钱包出款
        - label: 编排层
          detail: 选择服务商并管理支付生命周期决策的逻辑。
          modules:
            - label: 动态路由
              detail: 预测式、回退式、级联式和自定义路由规则
            - label: 收入恢复
              detail: 智能重试和周期性支付恢复策略
        - label: 控制和数据服务
          detail: 管理凭证、控制项和运营洞察的服务。
          modules:
            - label: 令牌金库
              detail: 支持第三方金库和网络令牌管理
            - label: 对账和可观测性
              detail: 三方对账、成本可观测性和日志
        - label: 商户控制平面
          detail: 配置连接器、规则、分析和运营工作流的界面。
          modules:
            - label: 商户控制中心
              detail: 连接器、路由规则、分析和 API 密钥的仪表盘
            - label: 托管式沙盒
              detail: 用于探索控制中心流程的预配置环境
        - label: 基础设施核心
          detail: Hyperswitch 材料中描述的开源核心和部署基础。
          modules:
            - label: Rust 应用服务器
              detail: 核心支付处理服务
            - label: 卡片金库和加密服务
              detail: 敏感数据和加密支持服务
        - label: 路由和连接器服务
          detail: 将核心扩展至多处理器执行的独立服务。
          modules:
            - label: 决策引擎和连接器层
              detail: 独立路由控制平面和 100 多个处理器连接
    claimRefs:
      - CE005
      - CE007
      - CE008
      - CE009
      - CE010
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Juspay 通常从可靠性或路由问题切入，嵌入生产支付运营，再扩展到银行、周期性支付、欺诈防控或国际化等相邻模块。
    data:
      items:
        - label: 识别企业结账痛点
          actor: 商户或企业支付负责人
          channel: 支付技术栈评估
          touchpoints:
            - 处理器泛滥和结账失败带来与收入直接相关的可靠性问题。
            - Juspay 围绕编排、成功率和更低处理成本进行定位。
        - label: 技术评估与集成
          actor: 工程和支付运营团队
          channel: API 和工作流集成
          touchpoints:
            - 通过无代码方式连接 300 多家 PSP 和本地支付方式，降低初始集成工作量。
            - 银行级控制、对账和欺诈工具，让产品可用于受监管的支付环境。
        - label: 生产部署
          actor: 商户、银行或 TPAP
          channel: 线上结账或支付技术栈
          touchpoints:
            - 日交易量和 TPS 披露表明其承载着收入关键型生产工作负载。
            - 被点名的银行、TPAP 和企业表明其已被多种买方采用。
        - label: 表现优化
          actor: 支付运营和财务团队
          channel: 路由、重试和分析
          touchpoints:
            - 案例证据指向更高成功率、更快交易速度和更低处理成本。
            - 周期性支付工具明确围绕留存和重试恢复进行营销。
        - label: 模块扩张
          actor: 现有客户利益相关方
          channel: 向相邻产品交叉销售
          touchpoints:
            - 技术栈从编排扩展到结账、出款、欺诈 / 风险、商户接入和银行基础设施。
            - 核心支付流程上线后，这会形成一个合理的落地并扩张循环。
        - label: 地域和客户群扩张
          actor: 区域企业和银行团队
          channel: 国际化推出
          touchpoints:
            - 最新 FY26 材料指向亚太、欧洲、美国、拉丁美洲和中东。
            - 公开证据证明了扩张动作，但尚未提供清晰的分地区客户结构或留存曲线。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU007
      - CU009
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 使用指定证据对六项最影响决策的风险进行定性排序。
    data:
      columns:
        - label: 可能性
          detail: 根据保留证据对发生频率或出现可能性的定性评估
        - label: 影响
          detail: 对支付连续性、市场准入或经济性的潜在影响
        - label: 缓释成熟度
          detail: 有公开证据支持的成熟度，而非仅管理层口径
        - label: 残余严重度
          detail: 考虑已披露缓释措施和证据局限后的暴露程度
      rows:
        - label: PA 主导的编排绕开
          note: 独立报道的运营和渠道压力
          values:
            - 高
            - 高
            - 有限
            - 高
        - label: 峰值负载或交易状态故障
          note: twenty-fold 峰值和最终一致性设计
          values:
            - 高
            - 高
            - 已部署
            - 中
        - label: 牌照或合规范围不匹配
          note: 口径宽泛，但没有保留监管机构或审计记录
          values:
            - 不确定
            - 高
            - 部分有证据
            - 高
        - label: 云或区域依赖
          note: 技术账户中双活架构仍是未来工作
          values:
            - 中
            - 高
            - 进行中
            - 中高
        - label: 跨境执行复杂度
          note: 多区域产品和监管范围
          values:
            - 中
            - 高
            - 部分
            - 中高
        - label: 低费率财务压力
          note: 缺少经审计的单位经济性和现金风险数据
          values:
            - 不确定
            - 高
            - 未验证
            - 高
    approximationNotes: 所有评级都是分析师的定性评估；没有可用的数值概率、损失估计、事件分母或经审计的缓释测试。
    claimRefs:
      - CR004
      - CR006
      - CR010
      - CR011
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: Juspay 具备规模和产品证据，但盈利波动、生态冲突和融资披露不完整叠加在一起，使基于公开证据的建议仍停留在跟踪。
    data:
      nodes:
        - id: funding
          label: 融资估值
          value: $50M at $1.2B
          detail: 2026 年 1 月的后续融资包含新股和老股成分。
        - id: scale
          label: 规模证据
          value: '>300M daily tx / >$1T TPV'
          detail: 公司报告的企业和银行运营规模。
        - id: product
          label: 产品广度
          value: 300+ PSPs / 90%+ UPI success
          detail: 官方产品声明称，编排和 UPI 能力具有黏性。
        - id: financials
          label: 财务波动
          value: FY26 revenue +30%, loss ₹90cr
          detail: 增长仍然稳健，但 FY25 盈利后盈利能力发生逆转。
        - id: risk
          label: 执行 / 披露风险
          value: PA-channel tension + opaque terms
          detail: 公开来源没有披露确切的新股与老股比例、优先权条款或集中度指标。
        - id: decision
          label: 建议
          value: Track / medium confidence / high risk / stretched
          detail: 等待更充分的披露或更有吸引力的入场价格，再纳入投资判断。
      edges:
        - from: funding
          to: scale
          label: 支持
        - from: scale
          to: product
          label: 进一步强化
        - from: product
          to: financials
          label: 接受检验
        - from: financials
          to: risk
          label: 叠加
        - from: risk
          to: decision
          label: 驱动
    approximationNotes: 数值保留公开来源的单位和措辞；流程展示的是决策逻辑，而非推断出的转化率或评分权重。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV009
      - CV010
      - CV012
