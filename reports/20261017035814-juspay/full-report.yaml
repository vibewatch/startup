      - number: '3.3'
        title: Pricing is opaque and switching costs remain inferred
        blocks:
          - type: paragraph
            body: >-
              Public commercial comparability is weak. G2 presents Juspay pricing as custom and directs buyers to
              contact the vendor; the assigned source pool contains no normalized price, fee schedule, minimum
              commitment, discount, or implementation charge for Juspay or its closest peers. Juspay says least-cost
              routing can reduce payment costs by up to 30%, but that is a vendor claim rather than disclosed realized
              savings. The broad bank stack plausibly raises switching costs because a replacement must reproduce
              operational and control-plane functions, while multi-PSP connectivity can also make it easier for
              sophisticated merchants to route around any one processor. No retained customer contract, renewal cohort,
              migration study, or matched internal-build total-cost model resolves that tension. Pricing and lock-in
              therefore remain material diligence gaps rather than proven sources of competitive advantage.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP013
      - number: '3.4'
        title: The moat is deepest in embedded deployments but vulnerable at the channel edge
        blocks:
          - type: paragraph
            body: >-
              The strongest durability case is operational embedding: a bank using onboarding, risk, authorization,
              settlement, and reconciliation functions would face a wider migration surface than a merchant replacing a
              checkout widget. Scale claims also suggest meaningful engineering experience, but the retained sources do
              not benchmark those claims against direct peers. Adverse evidence matters. StartupTalky reports that
              Paytm, PhonePe, Cashfree, and Razorpay ended partnerships with Juspay as a third-party orchestration
              provider. G2's small review base is positive overall, yet one reviewer described unannounced maintenance
              and several hours without UPI payments. Neither item proves systematic churn or unreliability, but both
              weaken a simple lock-in thesis. The prudent view is that Juspay has a real breadth-and-localization wedge,
              while displacement risk rises when major payment platforms internalize orchestration or when buyers can
              multi-home.
            claimRefs:
              - CP004
              - CP005
              - CP012
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Channel control can reverse
            body: >-
              Reported departures by four payment platforms show that a distribution partner can become an
              internal-build or direct competitor rather than a permanent source of volume.
            calloutType: risk
            claimRefs:
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              Public product surfaces show Juspay selling multiple infrastructure modules around the same merchant
              payment flow: orchestration, checkout, authentication, recurring payments, payouts, tokenisation, and UPI
              or bank infrastructure. A third-party profile describes the commercial model as transaction-based fees
              plus custom implementation and consultancy revenue, which fits an enterprise payments-infra vendor rather
              than a pure SaaS seat-license model. The important underwriting caveat is that Juspay does not publish
              public rate cards or standard contract terms on the reviewed official surfaces. That means investors can
              see what is being sold and some vendor-claimed customer outcomes, but cannot infer realized take rate,
              service attach, discounting, or the split between software-like and services-like revenue from public
              evidence.
            claimRefs:
