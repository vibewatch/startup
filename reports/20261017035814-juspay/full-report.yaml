  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is enterprise- and bank-led, not consumer-led
        blocks:
          - type: paragraph
            body: >-
              Juspay's public customer proof consistently points to an infrastructure business sold into merchants,
              banks, and payment apps rather than a consumer brand. Company pages position the product around payment
              orchestration, merchant onboarding, fraud and settlement tooling for bank clients, while third-party
              coverage frames the buyer as large enterprises and banks that care about checkout reliability and
              processor failover. That matters for diligence because it implies longer sales cycles and higher
              implementation effort, but also higher switching costs once the stack is embedded in core payment flows.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU008
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
              - CU008
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU007
              - CU009
              - CU011
      - number: '6.2'
        title: Adoption scale is large and current, with fresh FY26 proof
        blocks:
          - type: paragraph
            body: >-
              The freshest customer-scale disclosure is the October 2026 FY26 release, which says Juspay supports more
              than 500 enterprises globally, handles more than 400 million daily transactions, and exceeds $1 trillion
              of annualised payment volume. Independent and partner sources do not fully restate every metric, but they
              do corroborate production-grade throughput, international expansion, and merchant-facing ROI. The
              practical takeaway is that customer breadth is not merely logo decoration: the platform is operating at
              transaction volumes that imply live, high-stakes usage.
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU007
              - CU009
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU007
              - CU009
              - CU011
      - number: '6.3'
        title: Named customer proof spans banks, apps, and international enterprises
        blocks:
          - type: paragraph
            body: >-
              Named proof is strongest where multiple sources converge on recognizable customer references. The FY26
              release lists brands such as Amazon, Google, HSBC, IKEA, IndiGo, Swiggy, Zepto, and Zurich Insurance; the
              VEF case study adds banks including ICICI, Axis, and Yes Bank plus UPI and wallet surfaces such as Google
              Pay, Amazon Pay, CRED, Navi, and Super Money. Internationally, evidence is directionally positive rather
              than deeply enumerated: Agoda and Wego appear in both company-linked and investor materials, while
              regional case-study proof shows deployment needs beyond India.
            claimRefs:
              - CU006
              - CU008
              - CU011
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU008
              - CU011
              - CU013
      - number: '6.4'
        title: Durability has product signals, but public retention and concentration data remain thin
        blocks:
          - type: paragraph
            body: >-
              Juspay clearly markets land-and-expand and retention-oriented features, including recurring payments, card
              updater tooling, smart retries, and adjacent bank infrastructure, which supports a durability thesis. But
              the available chapter pool stops short of publishing NRR, GRR, churn, contract-length, or top-customer
              concentration data, so the strength of renewal behavior remains under-disclosed. The most concrete adverse
              signal in the pool is Startuptalky's report that several payment platforms ended orchestration
              partnerships with Juspay, alongside Founder Nation's warning that reliance on a small number of very large
              enterprise clients creates concentration risk.
            claimRefs:
              - CU010
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Cross-segment proof is stronger than raw logo walls
            body: >-
              The evidence spans merchants, banks, TPAPs, and international enterprise brands, which is materially
              better than a generic customer-logo page.
            calloutType: strength
            claimRefs:
              - CU002
              - CU006
              - CU008
              - CU011
          - type: callout
            title: Breadth is visible, durability is not fully disclosed
            body: >-
              Public sources support scale and named adoption, but they do not quantify NRR, GRR, churn, renewal
              cadence, or customer concentration.
            calloutType: risk
            claimRefs:
              - CU010
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The most immediate risk is ecosystem disintermediation: Business Standard reported operational friction
              and efforts by payment aggregators to move merchants away from third-party routing, directly challenging
              the neutral orchestration position that Juspay markets. Technical resilience is the second major exposure
              because the workload can spike twenty-fold within seconds; the disclosed architecture reduces earlier
              database bottlenecks but retains eventual-consistency and managed-cloud dependencies. Regulatory and
              cross-border execution risk ranks next because public compliance claims are broad while entity-level
              licenses and jurisdictional scope are not independently evidenced. The heatmap is qualitative and reflects
              evidence strength as well as impact, not a measured probability model.
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR011
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR006
              - CR010
              - CR011
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Juspay states that its bank platform maintains PCI DSS V4, PSD2, ISO 27001:2022, SOC 2 Type 2, and GDPR
              compliance. Those claims indicate a substantial control program, but the assigned evidence does not
              provide certificates, audit periods, covered legal entities, exceptions, or regulator records. A
              low-reputation blog also claims Payment Aggregator status and early adaptation to Indian localization
              rules; this is treated only as an unverified lead. VEF, an investor rather than an independent benchmark,
              describes expansion across Europe, the Americas, Southeast Asia, and the Middle East. Investment clearance
              should therefore require a jurisdiction-by-entity license matrix, current audit reports, enforcement
              searches, and counsel confirmation of whether Juspay or its customers carry each regulated obligation.
            claimRefs:
              - CR003
              - CR011
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR011
              - CR015
      - number: '7.3'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The adverse merchant-channel report matters because it describes operating issues reaching counterparties
              rather than merely a theoretical outage scenario. Juspay's supplier-hosted technical account says IPL
              traffic can jump from normal levels to twenty times average in seconds and describes earlier rate
              limiting, database scaling constraints, and a database single-point-of-failure concern. Its current
              memory-first design, controlled write-back, secondary streams, and fault isolation are credible
              mitigations, but the same account says multi-region active-active resilience remains future work. Company
              uptime claims use different scopes and lack an independently audited measurement window. Monthly review
              should therefore track failed-payment rates, throttling, write-back lag, recovery objectives, severity-one
              incidents, and progress toward tested active-active failover.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.4'
        title: Dependencies, financial-model risk, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Juspay's advertised breadth creates both resilience and coordination risk: it claims integrations with
              more than 300 PSPs and local methods, while VEF describes card-network partnerships and a full acquiring
              build for an unnamed global bank. The company also spans orchestration, checkout, authentication,
              tokenisation, payouts, offers, reconciliation, and revenue recovery. VEF characterizes India as a
              low-margin payment environment with zero UPI merchant discount rates and capped economics elsewhere, but
              the pool contains no audited margin, loss, fraud, working-capital, or cash exposure data. Thesis-break
              triggers are sustained PA-led merchant bypass, a material security or availability event without tested
              recovery, failure to validate required licenses, or evidence that partner concentration and low take rates
              prevent durable unit economics.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR009
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment kill criteria
            body: >-
              Pause investment if PA-led bypass produces sustained merchant loss, a material incident reveals untested
              recovery, required licenses cannot be validated, or partner concentration and low take rates fail
              underwriting thresholds.
            calloutType: risk
            claimRefs:
              - CR001
              - CR007
              - CR010
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The 2026 follow-on round gives Juspay a real market datapoint: WestBridge invested $50 million at a $1.2
              billion valuation, with the deal explicitly mixing primary capital and secondary liquidity. That is strong
              evidence that sophisticated capital still wants exposure to scaled payments infrastructure, especially
              after Juspay reported more than 300 million daily transactions and annualized TPV above $1 trillion. The
              bullish case is that the company now looks more like hard-to-replace infrastructure than a feature vendor,
              with company-reported reach across 500+ enterprises, 300+ PSP integrations, and an open, modular stack
              that can travel beyond India. The entry-discipline issue is that public sources still do not disclose the
              exact primary-secondary split, preference terms, customer concentration, or enough unit-economics detail
              to prove that the new mark is conservatively underwritten rather than momentum-backed.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV009
              - CV010
              - CV012
      - number: '8.2'
        title: Scenario framing
        blocks:
          - type: paragraph
            body: >-
              The cleanest public valuation anchors are milestone references, not public-market comps. ET reports Juspay
              raised $60 million at a $900 million valuation in April 2025, then reached $1.2 billion in January 2026,
              so the current mark embeds a material step-up before the market has seen a full year of post-expansion
              profitability. That does not invalidate the price: industry coverage argues infrastructure fintechs
              benefit from recurring transaction-linked revenue and meaningful switching costs once deeply integrated.
              It does, however, mean the valuation is only attractive if the FY26 loss is temporary, global expansion
              compounds enterprise adoption, and ecosystem conflict does not compress orchestration share. Without
              independent disclosure on retention, concentration, gross margin, and preference overhang, the base case
              should stay framed around a wide range between the prior private mark and the current one rather than
              false precision.
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV007
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: Recommendation and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The right call from the public record is track, not buy. Juspay has genuine scale proof, a category that
              investors are actively re-rating, and enough product breadth to earn another look. But the same record
              also shows profitability volatility, channel conflict after the PA licence, and incomplete disclosure on
              the exact economics and governance of the latest round. That makes the current mark look stretched rather
              than plainly mispriced: it may work if management can show FY27 margin recovery and durable international
              growth, but the existing evidence does not yet justify underwriting that outcome as the base case. Before
              moving from watchlist to conviction, diligence should force answers on customer concentration, retention,
              gross margin, international mix, preference terms, and whether routing-share pressure from PhonePe,
              Razorpay, and Cashfree has stabilized or worsened.
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track at the announced mark
            body: >-
              The current $1.2 billion valuation is plausible for a scaled infrastructure asset, but the public record
              is still too incomplete on profitability durability, concentration, and financing terms to support a buy
              call.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV010
              - CV012
              - CV014
          - type: callout
            title: What would move the call up
            body: >-
              A cleaner FY27 margin path, transparent round terms, and evidence that partner-channel tension is not
              eroding merchant routing share would make the same business materially easier to underwrite.
            calloutType: assumption
            claimRefs:
              - CV009
              - CV010
              - CV012
