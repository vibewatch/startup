chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and current scale
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence consistently describes Juspay as a Bengaluru-founded payments infrastructure company
              that has expanded from checkout and orchestration into a broader global operating system for merchant,
              bank, and payout workflows. Company materials place the business at the intersection of checkout UX,
              payment orchestration, authentication, tokenisation, payouts, and bank payments stacks rather than a
              single PSP point product. That positioning is not just marketing breadth: the same FY26 company release
              that reports revenue growth also claims 400 million daily transactions, 500+ enterprise and bank
              relationships, annualised TPV above $1 trillion, and a 1,500+ person operating footprint spanning India
              plus hubs in San Francisco, Dublin, São Paulo, Singapore, and Dubai. The core underwriting takeaway for
              later chapters is that Juspay is already operating at meaningful enterprise scale, but many of the largest
              scale metrics still originate with company-controlled disclosures rather than audited filings.
