  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer structure
        blocks:
          - type: paragraph
            body: >-
              Juspay's market is best defined as payment-infrastructure software that helps enterprises and financial
              institutions manage checkout, routing, authentication, retries, reconciliation, and local rail complexity
              across many providers. That places it in the orchestration and acceptance layer, not in consumer-wallet
              distribution or in pure gateway economics. The merchant buyer is typically trying to improve approval
              rates, lower payment cost, and simplify operations across many PSPs. The bank or TPAP buyer is trying to
              modernize acquiring or UPI infrastructure faster without giving up compliance control, merchant ownership,
              or strategic flexibility. Status-quo substitutes remain direct gateway integrations, stitched multi-vendor
              stacks, and slower in-house builds.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM013
              - CM014
