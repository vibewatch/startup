      - number: '3.2'
        title: Breadth and local infrastructure are the clearest differentiators
        blocks:
          - type: paragraph
            body: >-
              Juspay's official surfaces describe a broad operating layer rather than a single gateway. The current
              catalog covers orchestration, recurring payments, checkout, authentication, tokenisation, payouts, offers,
              reconciliation, and revenue recovery. Its orchestration page adds no-code access to more than 300 PSPs and
              local payment methods, while the bank offering stretches from merchant onboarding and risk controls
              through authorization, clearing, settlement, billing, and reconciliation. The India page further positions
              UPI checkout, TPAP/PPI stacks, and bank acquiring as local depth. These are company claims, not benchmark
              results, so the comparison matrix distinguishes disclosed scope from unknown peer cells. The evidence
              supports differentiation by integration breadth and deployment context; it does not establish better
              authorization, reliability, or economics than every named competitor.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
