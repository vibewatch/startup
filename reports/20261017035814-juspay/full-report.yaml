              - CM008
              - CM013
              - CM014
      - number: '2.2'
        title: Sizing lenses and adoption drivers
        blocks:
          - type: paragraph
            body: >-
              The broadest published demand lens in the retained source set is an India digital-payments-flow estimate
              that grows from $3 trillion to $10 trillion by 2026, but that is a macro transaction-flow number rather
              than a software TAM for orchestration. The more useful lenses are platform throughput, enterprise
              footprint, and integration breadth: Juspay says it serves more than 500 enterprises, more than $1 trillion
              in annualized payment volume, and roughly 400 million daily transactions, while its merchant product
              advertises 300-plus PSP and local-method integrations. Adoption is driven by fragmentation across rails
              and geographies, plus explicit ROI around higher success rates, lower processing cost, and faster rollout
              of new payment capabilities.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
              - CM009
