      - number: '1.3'
        title: Funding history, stakeholder relevance, and monetisation signals
        blocks:
          - type: paragraph
            body: >-
              The operating story is easier to verify than the capital-structure story. StartupTalky provides the
              clearest current funding chronology in the assigned pool, listing four rounds totaling $147.42 million
              through a $60 million Series D led by Kedaara Capital on 2025-04-07. That supports a post-Series D
              private-company framing, but the figure is still lightly corroborated and does not resolve secondaries,
              debt, or present-day investor ownership. External stakeholder relevance is nonetheless clear: VEF's March
              2025 note calls Juspay one of its top three holdings and describes merchant performance gains from
              HyperCheckout, while official and independent FY26 reporting support real commercial scale in enterprise
              checkout and payment operations. In short, the company looks commercially important and late-stage, but
              the current source pack is still short of a board-rights or cap-table-grade view.
            claimRefs:
