  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Public evidence supports a layered demand stack from broad payment flows down to Juspay's live enterprise and
      integration footprint, but not a precise SAM or SOM.
    data:
      items:
        - label: India digital-payments backdrop
          displayValue: $3T to $10T by 2026
          detail: Broad macro payments-flow lens rather than orchestration TAM.
        - label: Live enterprise footprint
          displayValue: 500+ enterprises
          detail: FY26 company-reported customer scope across banks and enterprises.
        - label: Annualized platform throughput
          displayValue: $1T+ TPV
          detail: Company-reported annualized payment volume handled on the platform.
        - label: Daily transaction intensity
          displayValue: 400M transactions/day
          detail: Operational scale of the live platform rather than addressable spend.
        - label: Integration and method breadth
          displayValue: 300+ PSPs and local methods
          detail: Product breadth that abstracts provider fragmentation for buyers.
        - label: India-specific performance layer
          displayValue: 99.99% uptime; 90%+ success
          detail: UPI-stack proof point for banks, TPAPs, PPIs, and high-volume merchants.
    approximationNotes: >-
      Layers intentionally mix market-flow, transaction-volume, customer-count, integration-breadth, and performance
      lenses because retained public evidence does not isolate a clean SAM or SOM; pyramid width signals order, not
      magnitude.
    claimRefs:
      - CM003
      - CM005
      - CM007
      - CM014
  - id: FP001
    title: Competitive positioning by disclosed scope
    type: quadrant
    summary: >-
      Ordinal classification of six named vendors using only Tracxn category descriptions and Juspay's disclosed product
      scope.
    xAxis:
      label: Lifecycle breadth in retained evidence
      min: 1
      max: 5
      lowLabel: Narrower workflow
      highLabel: Broader payment lifecycle
      description: Analyst-assigned ordinal score from disclosed category and product scope.
    yAxis:
      label: Directness to orchestration / infrastructure job
      min: 1
      max: 5
      lowLabel: Adjacent workflow
      highLabel: Direct infrastructure peer
      description: Analyst-assigned ordinal score from retained descriptions, not measured performance.
    data:
      points:
        - label: Juspay
          x: 5
          'y': 5
          note: Broad orchestration, UPI, and bank-infrastructure scope.
        - label: Checkout.com
          x: 4
          'y': 4
          note: Accept, process, and optimize online payments.
        - label: Primer
          x: 4
          'y': 5
          note: Unified acceptance, routing, and reconciliation.
        - label: PPRO
          x: 3
          'y': 4
          note: Global payment-infrastructure positioning.
        - label: Zuora
          x: 4
          'y': 1
          note: Broad subscription and invoice workflow, adjacent to orchestration.
        - label: PayNearMe
          x: 4
          'y': 2
          note: Acceptance, disbursement, and payment-management platform.
    approximationNotes: >-
      Coordinates are evidence-backed ordinal classifications, not market-share, quality, win-rate, or benchmark scores;
      one-point differences are directional only.
    claimRefs:
      - CP001
      - CP007
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how Juspay converts enterprise payment volume into revenue signals, while the most important
      gross-profit and runway steps remain undisclosed.
    data:
      nodes:
        - label: Merchant payment volume
          value: 300m+ FY25 / 400m FY26
          unit: daily transactions
          summary: Company-issued materials moved from more than 300 million daily transactions in FY25 to 400 million in FY26.
          note: Volume figures are company-issued.
          claimRefs:
            - CI005
            - CI006
        - label: Juspay infrastructure modules
          summary: >-
            The public product stack spans orchestration, checkout, authentication, recurring payments, payouts,
            tokenisation, and UPI or bank infrastructure.
          claimRefs:
            - CI001
        - label: Customer ROI claims
          value: up to 30% / up to 10%
          unit: cost reduction / authorization lift
          summary: >-
            Product pages claim lower payment costs and better authorization, but they do not disclose customer cohorts
            or realized economics.
          note: Vendor claims, not audited merchant outcomes.
          claimRefs:
            - CI013
            - CI015
        - label: Revenue capture
          summary: >-
            Third-party profiling says Juspay monetizes mainly through transaction-based fees plus custom implementation
            and consultancy work.
          note: Public revenue mix by module is not disclosed.
          claimRefs:
            - CI002
            - CI003
        - label: Cost base and investment
          summary: >-
            FY26 disclosures point to AI, open-source infrastructure, and international expansion as meaningful cost
            drivers.
          claimRefs:
            - CI008
            - CI009
        - label: Reported financial outcome
          value: $75m FY26
          unit: revenue
          summary: >-
            Growth stayed positive and adjusted EBITDA stayed positive, but accounting losses returned and public
            cash/runway data remains absent.
          note: Runway remains a diligence blocker.
          claimRefs:
            - CI007
            - CI016
