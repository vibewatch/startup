      - number: '4.2'
        title: Public traction and limited unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Juspay's strongest public financial signal is operating scale. The FY25 company release said revenue
              reached ₹514 crores with more than 300 million daily transactions and annualised TPV of $1 trillion, while
              FY26 company-issued materials said revenue reached $75 million, daily transactions rose to 400 million,
              and the platform served 500+ enterprises and banks. Those data points indicate that the business kept
              compounding after its first profitable year. The unit-economics read-through is weaker. Juspay's own
              product pages claim routing can cut payment costs by up to 30% and lift authorization rates by up to 10%,
              but those are vendor claims, not disclosed realized merchant outcomes. StartupTalky's historical table
              also shows that revenue growth before FY25 came with persistent losses, reinforcing that scale alone does
              not reveal margin quality.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI009
              - CI014
              - CI015
              - CI016
      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence confirms that Juspay raised $50 million at a $1.2 billion valuation in January
              2026, and one independent source says the round mixed primary and secondary capital without disclosing the
              split. That is useful for valuation context but not enough to underwrite capital adequacy, because the
              reviewed public sources do not disclose cash on hand, burn, debt facilities, or management runway targets
              after the round. FY26 disclosures and reporting also show a return to accounting losses as Juspay funded
              international expansion and AI infrastructure, so the next financing trigger cannot be inferred from
              growth alone. In parallel, Economic Times reported routing-channel pressure as Paytm, Razorpay, and
              Cashfree moved merchants away from third-party routing, which can pressure the quality and durability of
              orchestration-linked revenue.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI016
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The public case for Juspay is that it has already reached meaningful infrastructure scale, serves large
              enterprises and banks, and still reported double-digit growth into FY26 while remaining adjusted-EBITDA
              positive. The public risk case is equally important: FY26 net losses returned, channel conflict is visible
              in routing, and key underwriting metrics such as gross margin, take rate, retention, customer
              concentration, cash, and runway are still private. The result is a business that looks commercially
              significant and plausibly defensible, but not yet fully underwritable on revenue quality or capital
              intensity from public evidence alone. Any investment view should treat realized pricing, profitability
              bridge, and liquidity position as first-order diligence gates rather than extrapolating from volume or
              valuation headlines.
            claimRefs:
              - CI006
              - CI008
              - CI009
              - CI012
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is visible; yield is not
            body: >-
              Juspay's public evidence is strong on payment volume, enterprise count, and revenue growth, but weak on
              realized pricing, take rate, and gross margin. That makes the business look large and commercially
              important without yet proving how much profit it captures per dollar of TPV.
            calloutType: insight
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI015
          - type: callout
            title: Capital adequacy is still a diligence blocker
            body: >-
              The 2026 round and FY26 growth do not reveal whether Juspay has enough liquidity for its AI and
              international expansion plans, because cash, burn, debt, and runway are not disclosed publicly.
              Routing-channel pressure also makes it dangerous to infer durable future margins from current scale alone.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface covers merchant UX, orchestration, and bank-payment rails
        blocks:
          - type: paragraph
            body: >
              Juspay's public product catalog presents a multi-module stack rather than a narrow gateway overlay. The
              core commercial surface spans payment orchestration, recurring payments / revenue recovery, checkout
              experience, 3DS and authentication, tokenisation, payouts, offers, reconciliation, and India-specific UPI
              infrastructure, with Hypercheckout and UPI 360 called out as branded modules rather than generic feature
              bullets. The workflow implication is that merchants can use Juspay at several layers: customer-facing
              checkout, PSP and routing logic, token and authentication controls, and bank or UPI-facing payment rails.
              That breadth matters because product value is being sold as both conversion uplift and infrastructure
              consolidation, not only as acceptance-rate optimization. [ClaimRefs: CE001, CE002, CE003, CE004]
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
