      - number: '5.3'
        title: Scale and control claims are strong, but third-party validation is thin
        blocks:
          - type: paragraph
            body: >
              Product maturity is supported by repeated claims that Juspay already serves hundreds of enterprises and
              processes hundreds of millions of daily transactions, and by 2026 partner evidence that the stack is being
              embedded into new vertical offerings such as RateGain's travel product. Public documentation also
              describes fairly specific control primitives—vaulting, network tokens, adaptive 3DS, rule-based
              authentication, smart retries, and compliance-sensitive deployment options—which is more concrete than
              generic marketing language. The underwriting problem is that the assigned pool does not include
              independent validation for PCI, GDPR, uptime SLAs, or incident history: the strongest operational metrics,
              including 20,000 TPS, sub-100ms processing, and six-nines uptime claims, still come from Juspay's own
              materials. The product looks architecturally credible and operationally broad, but diligence still needs
              external proof for security, compliance, and realized deployment burden. [ClaimRefs: CE006, CE011, CE012,
              CE013, CE014]
            claimRefs:
