      - number: '1.4'
        title: Milestones, trajectory, and current watchpoints
        blocks:
          - type: paragraph
            body: >-
              Juspay's arc in the assigned evidence is coherent even where some ownership details are not: it was
              founded in 2012, raised institutional rounds from Accel, VEF, SoftBank Vision Fund, and Kedaara, saw a
              founder departure in 2023, made the LotusPay acquisition in 2024, and spent FY26 pushing global expansion
              plus a new AI and open-source product layer. The immediate watchpoint is not whether the company has found
              demand, because current sources do support scaled usage and broad geographic reach; it is whether the
              investment phase can keep translating into durable economics and control clarity. FY26 revenue growth to
              ₹664 crore came with a swing to a ₹90 crore net loss, and the source pack still leaves open questions on
              valuation, ownership, board oversight, and concentration risk. That keeps Juspay in the category of a real
              scaled asset with unfinished governance and profitability diligence.
