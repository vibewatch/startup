      - number: '5.2'
        title: Architecture combines commercial no-code modules with an open-source core
        blocks:
          - type: paragraph
            body: >
              The most concrete technical evidence is Hyperswitch. Juspay describes it as an open-source, modular stack
              that can be self-hosted on cloud or on-prem infrastructure or consumed as a managed service, while the
              repository documentation breaks the system into a Rust app server, vault and encryption services, a
              routing control plane, merchant dashboards, and client SDKs. This architecture is consistent with Juspay's
              commercial pitch that merchants can layer routing, retries, vaulting, observability, and authentication
              onto an existing payments stack instead of replacing everything at once. Partner evidence from RateGain
              also shows the product can sit inside another enterprise platform, where Juspay supplies orchestration and
              routing infrastructure rather than a directly branded merchant front end. [ClaimRefs: CE005, CE006, CE007,
              CE008, CE009, CE010, CE011, CE015]
