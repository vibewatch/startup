      - number: '2.3'
        title: Constraints, switching costs, and open gaps
        blocks:
          - type: paragraph
            body: >-
              Market attractiveness does not remove execution friction. Payment behavior, KYC and AML requirements,
              local regulation, and fragmented bank or method coverage still force country-specific adaptation, which
              can slow rollout or compress near-term ROI. At the same time, once an orchestration layer is deeply
              integrated, buyers often face meaningful operational switching risk, which can support retention but
              lengthen sales cycles because the decision is infrastructure-critical. The remaining public-data gap is
              monetizable market definition: retained sources support broad demand and actual platform scale, but they
              do not isolate Juspay's SAM or SOM, segment-level budget owner, or international revenue mix closely
              enough for a precise market-share claim.
            claimRefs:
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Payments-infrastructure budgets are justified by ROI, not brand spend
            body: >-
              The strongest adoption logic in the retained evidence is operational: buyers want more approval, lower
              processing cost, faster method rollout, and less payments-engineering overhead rather than a
              consumer-acquisition story.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM009
          - type: callout
            title: Public market sizing is still too broad for a clean share argument
            body: >-
              Platform-scale disclosures are strong, but the retained public record still does not break out monetizable
              SAM or SOM by geography, vertical, or budget owner, which limits valuation precision.
            calloutType: risk
            claimRefs:
              - CM008
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A dense landscape extends beyond orchestration vendors
        blocks:
          - type: paragraph
            body: >-
              The relevant market is broader than payment orchestration alone. Tracxn's taxonomy places direct
              infrastructure peers such as Checkout.com, PPRO, and Primer beside adjacent workflows such as Zuora and
              PayNearMe, and reports substantially different funding bases across those companies. Juspay also faces
              India-facing gateway defaults, direct PSP relationships, and the option for a large merchant or bank to
              retain legacy systems or build orchestration internally. Those last two alternatives are analytical buyer
              choices rather than named vendors, and the retained evidence does not quantify their cost. Angeltors'
              report that Juspay powers payments for Amazon, Flipkart, and Swiggy indicates enterprise distribution, but
              its low-reputation profile does not independently prove retention or win rates. The resulting landscape is
              dense: Juspay must beat both feature-rich peers and the buyer's existing stack, not merely another Indian
              gateway.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP016
