  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Juspay layers merchant-facing checkout and regional payment UX on top of orchestration logic, control services,
      and an open-source infrastructure core.
    data:
      layers:
        - label: Merchant experience layer
          detail: Customer-facing payment and authentication surfaces exposed to merchants.
          modules:
            - label: Hypercheckout
              detail: Branded no-code checkout with one-click flows and experiments
            - label: 3DS & Authentication
              detail: Adaptive 3DS and rule-based authentication triggers
        - label: Regional payment rails
          detail: India-specific and bank-connected payment experiences marketed by Juspay.
          modules:
            - label: UPI 360
              detail: One-click UPI plus SDK/S2S APIs for UPI apps
            - label: Payout rails
              detail: Cards, bank transfers, and wallet payouts
        - label: Orchestration layer
          detail: Logic that selects providers and manages payment lifecycle decisions.
          modules:
            - label: Dynamic routing
              detail: Predictive, fallback, cascading, and custom routing rules
            - label: Revenue recovery
              detail: Smart retries and recurring-payment recovery strategies
        - label: Control and data services
          detail: Services that manage credentials, controls, and operating insight.
          modules:
            - label: Token vault
              detail: Third-party vault support and network-token management
            - label: Reconciliation and observability
              detail: 3-way reconciliation, cost observability, and logs
        - label: Merchant control plane
          detail: Interfaces that configure connectors, rules, analytics, and operator workflows.
          modules:
            - label: Merchant control center
              detail: Dashboard for connectors, routing rules, analytics, and API keys
            - label: Hosted sandbox
              detail: Preconfigured environment for exploring control-center flows
        - label: Infrastructure core
          detail: Open-source core and deployment foundation described in Hyperswitch materials.
          modules:
            - label: Rust app server
              detail: Core payment-processing service
            - label: Card-vault and encryption-service
              detail: Sensitive-data and cryptographic support services
        - label: Routing and connector services
          detail: Standalone services that extend the core toward multi-processor execution.
          modules:
            - label: Decision-engine and connector layer
              detail: Standalone routing control plane and 100+ processor connectivity
    claimRefs:
      - CE005
      - CE007
      - CE008
      - CE009
      - CE010
      - CE015
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Juspay typically lands through a reliability or routing problem, embeds into production payment operations, and
      then expands across adjacent bank, recurring, fraud, or international modules.
    data:
      items:
        - label: Enterprise checkout pain identified
          actor: Merchant or enterprise payments leader
          channel: Payments stack evaluation
          touchpoints:
            - Processor sprawl and failed checkouts create a revenue-linked reliability problem.
            - Juspay is positioned around orchestration, success rates, and lower processing costs.
        - label: Technical evaluation and integration
          actor: Engineering and payment operations teams
          channel: API and workflow integration
          touchpoints:
            - No-code connections to 300+ PSPs and local payment methods reduce initial integration effort.
            - >-
              Bank-grade controls, reconciliation, and fraud tooling make the product usable in regulated payment
              environments.
        - label: Production deployment
          actor: Merchant, bank, or TPAP
          channel: Live checkout or payment stack
          touchpoints:
            - Daily transaction and TPS disclosures imply revenue-critical production workloads.
            - Named banks, TPAPs, and enterprises suggest adoption across multiple buyer types.
        - label: Performance optimization
          actor: Payment ops and finance teams
          channel: Routing, retries, and analytics
          touchpoints:
            - Case-study evidence points to better success rates, faster transaction time, and lower processing cost.
            - Recurring-payments tooling is explicitly marketed around retention and retry recovery.
        - label: Module expansion
          actor: Existing customer stakeholders
          channel: Cross-sell into adjacent products
          touchpoints:
            - >-
              The stack expands from orchestration into checkout, payouts, fraud/risk, merchant onboarding, and bank
              infrastructure.
            - This creates a plausible land-and-expand loop once core payment flows are live.
        - label: Geographic and segment expansion
          actor: Regional enterprise and bank teams
          channel: International rollout
          touchpoints:
            - Fresh FY26 materials point to APAC, Europe, the US, Latin America, and the Middle East.
            - Public evidence proves motion, but not yet a clean region-by-region customer mix or retention curve.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU007
      - CU009
      - CU011
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Qualitative ranking of the six most decision-relevant risks using the assigned evidence.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative frequency or emergence assessment from retained evidence
        - label: Impact
          detail: Potential effect on payment continuity, market access, or economics
        - label: Mitigation maturity
          detail: Publicly evidenced maturity, not management assertion alone
        - label: Residual severity
          detail: Exposure after disclosed mitigations and evidence limitations
      rows:
        - label: PA-led orchestration bypass
          note: Independently reported operating and channel pressure
          values:
            - High
            - High
            - Limited
            - High
        - label: Peak-load or transaction-state failure
          note: Twenty-fold spikes and eventual-consistency design
          values:
            - High
            - High
            - Deployed
            - Medium
        - label: License or compliance-scope mismatch
          note: Broad claims without retained regulator or audit records
          values:
            - Uncertain
            - High
            - Partially evidenced
            - High
        - label: Cloud or regional dependency
          note: Active-active architecture remained future work in the technical account
          values:
            - Medium
            - High
            - In progress
            - Medium-high
        - label: Cross-border execution complexity
          note: Multi-region product and regulatory breadth
          values:
            - Medium
            - High
            - Partial
            - Medium-high
        - label: Low-take-rate financial pressure
          note: Audited unit economics and cash-risk data are absent
          values:
            - Uncertain
            - High
            - Unverified
            - High
    approximationNotes: >-
      All ratings are qualitative analyst assessments; no numeric probability, loss estimate, incident denominator, or
      audited mitigation test was available.
    claimRefs:
      - CR004
      - CR006
      - CR010
      - CR011
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Juspay has scale and product proof, but the combination of earnings volatility, ecosystem conflict, and incomplete
      financing disclosure keeps the public-evidence recommendation at track.
    data:
      nodes:
        - id: funding
          label: Funding mark
          value: $50M at $1.2B
          detail: Jan 2026 follow-on round with primary and secondary elements.
        - id: scale
          label: Scale proof
          value: '>300M daily tx / >$1T TPV'
          detail: Company-reported operating scale for enterprises and banks.
        - id: product
          label: Product breadth
          value: 300+ PSPs / 90%+ UPI success
          detail: Official product claims indicate sticky orchestration and UPI capability.
        - id: financials
          label: Financial volatility
          value: FY26 revenue +30%, loss ₹90cr
          detail: Growth remains solid, but profitability reversed after FY25 profitability.
        - id: risk
          label: Execution / disclosure risk
          value: PA-channel tension + opaque terms
          detail: Public sources do not disclose exact primary-secondary split, preference terms, or concentration metrics.
        - id: decision
          label: Recommendation
          value: Track / medium confidence / high risk / stretched
          detail: Wait for better disclosure or a more attractive entry before underwriting.
      edges:
        - from: funding
          to: scale
          label: supports
        - from: scale
          to: product
          label: reinforced by
        - from: product
          to: financials
          label: tested against
        - from: financials
          to: risk
          label: compounded by
        - from: risk
          to: decision
          label: drives
    approximationNotes: >-
      Values preserve the public source units and wording; the flow shows decision logic, not inferred conversion rates
      or score weights.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV009
      - CV010
      - CV012
