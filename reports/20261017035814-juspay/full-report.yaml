      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility in this source pack centers on Vimal Kumar and Sheetal Lalwani, with Lalwani
              also serving as the named spokesperson on the FY26 update. That gives enough evidence to treat the company
              as still tightly tied to a small founder/executive set, but not enough to underwrite governance cleanly.
              The main complication is founder attribution: StartupTalky identifies Vimal Kumar and Ramanathan RV as
              founders and says Ramanathan left in January 2023 to start Hyperface, while Business Standard instead
              states that Juspay was co-founded by Vimal Kumar and Sheetal Lalwani. That conflict does not alter the
              operating fact that Vimal and Lalwani are the current visible leadership anchors, but it is a real
              diligence flag because the assigned pool does not independently resolve board composition, founder
              shareholding, or control rights.
            claimRefs:
