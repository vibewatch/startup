callouts:
  - calloutType: "insight"
    title: "Scale is visible; yield is not"
    body: >-
      Juspay's public evidence is strong on payment volume, enterprise count, and revenue growth, but weak on realized
      pricing, take rate, and gross margin. That makes the business look large and commercially important without yet
      proving how much profit it captures per dollar of TPV.
    claimRefs: ["CI005", "CI006", "CI007", "CI015"]
  - calloutType: "risk"
    title: "Capital adequacy is still a diligence blocker"
    body: >-
      The 2026 round and FY26 growth do not reveal whether Juspay has enough liquidity for its AI and international
      expansion plans, because cash, burn, debt, and runway are not disclosed publicly. Routing-channel pressure also
      makes it dangerous to infer durable future margins from current scale alone.
    claimRefs: ["CI010", "CI011", "CI012", "CI016"]
