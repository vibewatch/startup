schemaVersion: report-v2
artifact: customers
slug: juspay
runDate: 2026-10-17
company:
  name: Juspay
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence positions Juspay in payment workflows for large enterprises,
    banks, and major UPI apps rather than as a direct-to-consumer product.
    Platform adoption is credible at scale, but account-level deployment and
    durability are less verified because the allocated evidence does not disclose customer
    concentration, NRR/GRR, renewal rates, or a clean pilot-versus-production
    split by named account.
sections:
  - id: customer-base-segmentation
    title: Customer base is enterprise- and bank-led, not consumer-led
    body: >-
      Juspay's public customer proof consistently points to an infrastructure
      business sold into merchants, banks, and payment apps rather than a
      consumer brand. Company pages position the product around payment
      orchestration, merchant onboarding, fraud and settlement tooling for bank
      clients, while third-party coverage frames the buyer as large enterprises
      and banks that care about checkout reliability and processor failover.
      That matters for diligence because it implies longer sales cycles and
      higher implementation effort, but also higher switching costs once the
      stack is embedded in core payment flows.
    claimRefs: [CU001, CU004, CU005, CU008, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-scale-and-freshness
    title: Adoption scale is large and current, with fresh FY26 proof
    body: >-
      The freshest customer-scale disclosure is the October 2026 FY26 release,
      which says Juspay supports more than 500 enterprises globally, handles
      more than 400 million daily transactions, and exceeds $1 trillion of
      annualised payment volume. Independent and partner sources do not fully
      restate every metric, but they do corroborate production-grade throughput,
      international expansion, and merchant-facing ROI. The practical takeaway
      is that customer breadth is not merely logo decoration: the platform is
      operating at transaction volumes that imply live, high-stakes usage.
    claimRefs: [CU002, CU003, CU006, CU007, CU009, CU011]
    tableRefs: [TU002]
  - id: named-proof-and-expansion
    title: Named customer proof spans banks, apps, and international enterprises
    body: >-
      Named proof is strongest where multiple sources converge on recognizable
      customer references. The FY26 release lists brands such as Amazon, Google,
      HSBC, IKEA, IndiGo, Swiggy, Zepto, and Zurich Insurance; the VEF case
      study adds banks including ICICI, Axis, and Yes Bank plus UPI and wallet
      surfaces such as Google Pay, Amazon Pay, CRED, Navi, and Super Money.
      Internationally, evidence is directionally positive rather than deeply
      enumerated: Agoda and Wego appear in both company-linked and investor
      materials, while regional case-study proof shows deployment needs beyond
      India.
    claimRefs: [CU006, CU008, CU011, CU013]
    tableRefs: [TU003]
  - id: durability-and-concentration-risks
    title: Durability has product signals, but public retention and concentration data remain thin
    body: >-
      Juspay clearly markets land-and-expand and retention-oriented features,
      including recurring payments, card updater tooling, smart retries, and
      adjacent bank infrastructure, which supports a durability thesis. But the
      available chapter pool stops short of publishing NRR, GRR, churn,
      contract-length, or top-customer concentration data, so the strength of
      renewal behavior remains under-disclosed. The most concrete adverse signal
      in the pool is Startuptalky's report that several payment platforms ended
      orchestration partnerships with Juspay, alongside Founder Nation's warning
      that reliance on a small number of very large enterprise clients creates
      concentration risk.
    claimRefs: [CU010, CU012, CU013, CU014]
callouts:
  - calloutType: strength
    title: Cross-segment proof is stronger than raw logo walls
    body: >-
      The evidence spans merchants, banks, TPAPs, and international enterprise
      brands, which is materially better than a generic customer-logo page.
    claimRefs: [CU002, CU006, CU008, CU011]
  - calloutType: risk
    title: Breadth is visible, durability is not fully disclosed
    body: >-
      Public sources support scale and named adoption, but they do not quantify
      NRR, GRR, churn, renewal cadence, or customer concentration.
    claimRefs: [CU010, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale evidence
      - Revenue / strategic value
      - Gap
    rows:
      - - Large enterprises / merchants
        - Buyer is payments or checkout leadership; users are ops, product, and engineering teams; payer is the merchant.
        - Payment orchestration, checkout optimization, retries, reconciliation.
        - 500+ enterprises globally; named brands include Amazon, Flipkart, Swiggy, Zepto, IKEA, IndiGo, and Zurich Insurance.
        - Core transaction-routing workload with ROI tied to success rates and processing costs.
        - No public split by GMV tier, geography, or production versus pilot logo count.
      - - Banks
        - Buyer is acquiring or payments leadership; users are bank operations and risk teams; payer is the bank.
        - Acceptance stack, merchant onboarding, fraud/risk, settlements, analytics, and real-time payments infrastructure.
        - Official bank stack page plus VEF cite ICICI, Axis, and Yes Bank as enabled UPI PSP customers.
        - Deepens embed depth and can create multi-module expansion once a bank stack is live.
        - No disclosed contract duration, installed-base count, or share of revenue from banks.
      - - TPAPs / payment apps
        - Buyer is platform or payments leadership; users are app product and engineering teams; payer is the platform.
        - In-app UPI experiences and app-linked payment rails.
        - VEF names Google Pay, Amazon Pay, CRED, Navi, and Super Money; the official India page separately cites CRED and Amazon.
        - Helps Juspay sit inside high-frequency consumer-payment surfaces without owning the end brand.
        - Public evidence does not state volume share, exclusivity, or churn by app client.
      - - International enterprises / travel and SaaS platforms
        - Buyer is enterprise payments leadership; users are regional payment ops teams; payer is the enterprise.
        - Orchestration, acquiring stack, B2B payouts, and localized payment-method coverage.
        - PR and VEF materials cite Agoda, Wego, LATAM Airlines, Recurly, MakeMyTrip, and EaseMyTrip.
        - Important for diversification away from India and for larger global wallet share per account.
        - Geography-level revenue mix and live-account counts are not disclosed.
    notes: >-
      Mixes company, partner, investor, and independent reporting. Scale evidence
      reflects named proof and disclosed breadth, not a complete customer census.
    claimRefs: [CU001, CU002, CU004, CU005, CU006, CU008, CU011]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Enterprises supported globally
        - 500+ enterprises
        - "2026-10-13"
        - PR Newswire / Yahoo Finance
        - High
        - Indicates customer breadth beyond a handful of flagship logos.
        - No split by region, cohort, or paying versus live-production accounts.
      - - Daily transactions
        - 400 million per day
        - FY26 / 2026-10-13 disclosure
        - PR Newswire / Yahoo Finance; Business Standard
        - High
        - Suggests current production scale and fresh operating momentum.
        - No account-level concentration or active-customer denominator.
      - - Annualised TPV
        - More than $1 trillion
        - FY26 / 2026-10-13 disclosure
        - PR Newswire / Yahoo Finance; Business Standard
        - High
        - Shows enterprise relevance on very large payment flows.
        - No take-rate, revenue-per-customer, or international share disclosure.
      - - Merchant performance uplift
        - 5–10% higher transaction success, 75% lower transaction time, up to 40% lower processing cost
        - 2025 case-study deck
        - VEF
        - Medium
        - Supports a land-and-expand story because ROI is tied to customer economics.
        - Presented as case-study benefits, not audited portfolio-wide averages.
    notes: >-
      The table combines FY26 current disclosures with a 2025 investor case-study
      deck. Denominator gaps are material because Juspay does not publish live
      customer cohorts, retention, or revenue concentration in this evidence set.
    claimRefs: [CU002, CU003, CU007, CU009, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / cohort
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Amazon / Google / Flipkart / Swiggy / Zepto / HSBC / Zurich Insurance
        - Large enterprises / merchants
        - Named in Juspay's FY26 release and supported by third-party narrative about enterprise payment orchestration usage.
        - Not disclosed at the named-account level.
        - Supports the claim that Juspay is embedded in revenue-critical checkout and payments operations.
        - No customer-specific case study, start date, or module-level scope per account.
      - - ICICI / Axis / Yes Bank plus Google Pay / Amazon Pay / CRED / Navi / Super Money
        - Banks and TPAP / app platforms
        - UPI PSP stacks for banks and seamless in-app UPI experiences for payment apps.
        - Not independently established account by account.
        - Shows Juspay can sell both bank infrastructure and app-layer payment experiences.
        - Evidence is concentrated in the VEF case study with limited independent confirmation by named account.
      - - Agoda / Wego / LATAM Airlines / Recurly
        - International enterprise customers
        - International orchestration and payments support across travel and SaaS-like use cases.
        - Not disclosed at the named-account level.
        - Supports the thesis that international expansion is moving beyond abstract market entry.
        - No revenue disclosure, country-by-country scale, or pilot-to-production timeline.
    notes: >-
      Enumeration is a representative sample of named accounts visible in the
      assigned source pool, not an exhaustive customer registry. Rows are
      cross-checked against multiple domains at the table level.
    enumerationScope:
      coverage: sample
      basis: >-
        Representative sample built from the named customer, bank, and app
        references visible across the assigned FY26 release, independent
        reporting, and investor case-study materials in this chapter pool.
    claimRefs: [CU006, CU008, CU011, CU013]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Juspay typically lands through a reliability or routing problem, embeds
      into production payment operations, and then expands across adjacent bank,
      recurring, fraud, or international modules.
    data:
      items:
        - label: Enterprise checkout pain identified
          actor: Merchant or enterprise payments leader
          channel: Payments stack evaluation
          touchpoints:
            - "Processor sprawl and failed checkouts create a revenue-linked reliability problem."
            - "Juspay is positioned around orchestration, success rates, and lower processing costs."
        - label: Technical evaluation and integration
          actor: Engineering and payment operations teams
          channel: API and workflow integration
          touchpoints:
            - "No-code connections to 300+ PSPs and local payment methods reduce initial integration effort."
            - "Bank-grade controls, reconciliation, and fraud tooling make the product usable in regulated payment environments."
        - label: Production deployment
          actor: Merchant, bank, or TPAP
          channel: Live checkout or payment stack
          touchpoints:
            - "Daily transaction and TPS disclosures imply revenue-critical production workloads."
            - "Named banks, TPAPs, and enterprises suggest adoption across multiple buyer types."
        - label: Performance optimization
          actor: Payment ops and finance teams
          channel: Routing, retries, and analytics
          touchpoints:
            - "Case-study evidence points to better success rates, faster transaction time, and lower processing cost."
            - "Recurring-payments tooling is explicitly marketed around retention and retry recovery."
        - label: Module expansion
          actor: Existing customer stakeholders
          channel: Cross-sell into adjacent products
          touchpoints:
            - "The stack expands from orchestration into checkout, payouts, fraud/risk, merchant onboarding, and bank infrastructure."
            - "This creates a plausible land-and-expand loop once core payment flows are live."
        - label: Geographic and segment expansion
          actor: Regional enterprise and bank teams
          channel: International rollout
          touchpoints:
            - "Fresh FY26 materials point to APAC, Europe, the US, Latin America, and the Middle East."
            - "Public evidence proves motion, but not yet a clean region-by-region customer mix or retention curve."
    claimRefs: [CU001, CU003, CU004, CU005, CU007, CU009, CU011]
