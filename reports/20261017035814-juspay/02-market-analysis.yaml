      - ["PR Newswire via Yahoo Finance", FY26, Global, "$1T+ annualized TPV across 500+ enterprises; 400M daily transactions", "n/a", "Installed-base throughput lens", High, "Company-reported operating scale is not equivalent to addressable software spend."]
      - [Juspay, Current, Global, "300+ PSPs and local payment methods", "n/a", "Integration-breadth lens", High, "Coverage breadth shows workflow complexity, not market size."]
      - ["VEF / Juspay", 2025, Global, "5-10% success-rate gain; up to 40% processing-cost savings", "n/a", "ROI lens on payment-spend optimization", Medium, "Investor/company framing shows economic trigger, not audited SAM or SOM."]
    notes: >-
      This chapter uses multiple lenses because retained public sources do not
      isolate a clean SAM or SOM; the table preserves broad market, platform-scale,
      integration-breadth, and ROI evidence instead of inventing a precise share
      model.
