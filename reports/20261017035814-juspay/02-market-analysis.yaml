      approximations rather than disclosed contract archetypes.
    claimRefs: [CM005, CM006, CM008, CM013, CM014]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Public evidence supports a layered demand stack from broad payment flows down
      to Juspay's live enterprise and integration footprint, but not a precise SAM
      or SOM.
    data:
      items:
        - label: India digital-payments backdrop
          displayValue: "$3T to $10T by 2026"
          detail: Broad macro payments-flow lens rather than orchestration TAM.
        - label: Live enterprise footprint
          displayValue: "500+ enterprises"
          detail: FY26 company-reported customer scope across banks and enterprises.
        - label: Annualized platform throughput
          displayValue: "$1T+ TPV"
          detail: Company-reported annualized payment volume handled on the platform.
        - label: Daily transaction intensity
          displayValue: "400M transactions/day"
          detail: Operational scale of the live platform rather than addressable spend.
        - label: Integration and method breadth
          displayValue: "300+ PSPs and local methods"
          detail: Product breadth that abstracts provider fragmentation for buyers.
        - label: India-specific performance layer
          displayValue: "99.99% uptime; 90%+ success"
          detail: UPI-stack proof point for banks, TPAPs, PPIs, and high-volume merchants.
    approximationNotes: >-
      Layers intentionally mix market-flow, transaction-volume, customer-count,
      integration-breadth, and performance lenses because retained public evidence
      does not isolate a clean SAM or SOM; pyramid width signals order, not
      magnitude.
    claimRefs: [CM003, CM005, CM007, CM014]
callouts:
  - calloutType: insight
    title: Payments-infrastructure budgets are justified by ROI, not brand spend
    body: >-
      The strongest adoption logic in the retained evidence is operational: buyers
      want more approval, lower processing cost, faster method rollout, and less
      payments-engineering overhead rather than a consumer-acquisition story.
    claimRefs: [CM005, CM006, CM009]
  - calloutType: risk
    title: Public market sizing is still too broad for a clean share argument
    body: >-
      Platform-scale disclosures are strong, but the retained public record still
      does not break out monetizable SAM or SOM by geography, vertical, or budget
      owner, which limits valuation precision.
    claimRefs: [CM008, CM012]
