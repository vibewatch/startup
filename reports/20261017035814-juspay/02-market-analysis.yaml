      - ["Large bank / acquirer", "Acquiring or payments business head", "Product, risk, operations, and platform engineering teams", Bank, "Merchant acquiring, routing, tokenization, ledgering, disputes", "Payments-platform or acquiring budget", "Need a modern stack that launches features faster without losing compliance control."]
      - ["TPAP / PPI / issuer app", "Product and platform leadership", "UPI operations and app teams", "Fintech or issuer", "UPI SDK, PSP stack, and app-level payment experience", "Product and infrastructure budget", "Need India-specific uptime and success rates on UPI-heavy flows."]
      - ["Cross-border enterprise / travel / SaaS", "Treasury, platform, or payments leadership", "Payout and multi-country acceptance teams", Enterprise, "Localized methods, payouts, and multi-region payment operations", "Payments or treasury budget", "Need local-method coverage and regulatory adaptation across regions."]
