companyProfile:
  summary: >-
    Juspay is a Bengaluru-founded payments infrastructure company serving enterprises, banks, and payment platforms with
    orchestration, checkout, authentication, tokenisation, payouts, UPI, and bank-payment infrastructure. The public
    evidence set shows meaningful scale, including 400 million daily transactions, more than $1 trillion of annualised
    TPV, and FY26 revenue of $75 million, but it also leaves important questions open around margin quality,
    concentration, and cap-table structure.
  headquarters: Bengaluru, India
  productSummary: >-
    Enterprise payment infrastructure spanning orchestration, checkout, authentication, tokenisation, payouts, recurring
    payments, UPI, and bank-stack workflows.
  customerFocus: Enterprises, banks, acquirers, and large merchants.
  businessModel: Volume-linked enterprise infrastructure with transaction fees and implementation-heavy commercial work.
  stage: Series D
  fundingStatus: >-
