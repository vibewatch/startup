      - ["PA or merchant rejection of third-party orchestration", High, High, "Business Standard reported operating strain and merchant-bypass pressure", "Open-source and routing breadth are claimed; outcome evidence absent", High, "Merchant churn linked to PA pressure; direct-routing share; escalations by PA"]
      - ["Twenty-fold event-driven traffic spike", High, High, "AWS/Juspay account describes 7.6 million transactions per hour at peak", "Cell-based ElastiCache design deployed", Medium, "Peak failure rate; p99 latency; throttled requests; cache and drainer saturation"]
      - ["Write-back delay, cache failure, or inconsistent transaction state", Medium, High, "Current architecture drains short-lived state to RDS with eventual consistency", "Secondary streams and cache-miss handlers disclosed", Medium, "Write-back lag; replay errors; reconciliation breaks; failover data loss"]
      - ["Regional outage or incomplete disaster recovery", Medium, High, "Multi-region expansion exists, but active-active and shuffle sharding were described as future work", "In progress", "Medium-high", "Recovery-time and recovery-point tests; active-active launch and fault-injection results"]
    notes: >-
      Severity ordering combines an independent adverse report with supplier-hosted
      company technical disclosures; no audited incident-frequency denominator was available.
    claimRefs: [CR001, CR004, CR005, CR006, CR007]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - ["Merchant-routing access", "Payment aggregators and PSPs", "Processing routes and merchant relationships", "Not disclosed", "Aggregators steer merchants to direct relationships and away from Juspay", High, "300+ integrations and fallback routing are company-claimed", High]
      - ["Managed cloud and data layer", "AWS services including ElastiCache, RDS, EKS, and Aurora", "Critical transaction-state and compute infrastructure", "Not disclosed", "Service or regional failure impairs transaction processing or persistence", High, "Fault-isolated cells, secondary streams, and multi-region deployments", Medium]
      - ["Network and banking partnerships", "Visa, Mastercard, and an unnamed global bank", "Cross-border products and acquiring-stack distribution", "Not disclosed", "Partner reprioritization or delayed market delivery constrains expansion", "Medium-high", "Multiple regions, payment methods, and counterparties", "Medium-high"]
    notes: >-
      Counterparties and mitigations come from company or investor-issued sources;
      contractual concentration, termination rights, and revenue exposure are unavailable.
    claimRefs: [CR001, CR007, CR008, CR009, CR012]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Qualitative ranking of the six most decision-relevant risks using the assigned evidence.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative frequency or emergence assessment from retained evidence
        - label: Impact
          detail: Potential effect on payment continuity, market access, or economics
        - label: Mitigation maturity
          detail: Publicly evidenced maturity, not management assertion alone
        - label: Residual severity
          detail: Exposure after disclosed mitigations and evidence limitations
      rows:
        - label: PA-led orchestration bypass
          note: Independently reported operating and channel pressure
          values: [High, High, Limited, High]
        - label: Peak-load or transaction-state failure
          note: Twenty-fold spikes and eventual-consistency design
          values: [High, High, Deployed, Medium]
        - label: License or compliance-scope mismatch
          note: Broad claims without retained regulator or audit records
          values: [Uncertain, High, "Partially evidenced", High]
        - label: Cloud or regional dependency
          note: Active-active architecture remained future work in the technical account
          values: [Medium, High, "In progress", "Medium-high"]
        - label: Cross-border execution complexity
          note: Multi-region product and regulatory breadth
          values: [Medium, High, Partial, "Medium-high"]
        - label: Low-take-rate financial pressure
          note: Audited unit economics and cash-risk data are absent
          values: [Uncertain, High, Unverified, High]
    approximationNotes: >-
      All ratings are qualitative analyst assessments; no numeric probability,
      loss estimate, incident denominator, or audited mitigation test was available.
    claimRefs: [CR004, CR006, CR010, CR011, CR016]
callouts:
  - calloutType: risk
    title: Investment kill criteria
    body: >-
      Pause investment if PA-led bypass produces sustained merchant loss, a material
      incident reveals untested recovery, required licenses cannot be validated,
      or partner concentration and low take rates fail underwriting thresholds.
    claimRefs: [CR001, CR007, CR010, CR016]
