    - Country manager or 3PL lead
    - Warehouse and customs teams
    - Country P&L or local logistics budget
    - Import, local warehousing, domestic parcel handoff
    - Avoid customs friction and offer domestic-like delivery windows
  - - Consumer-to-consumer parcel sender
    - Individual sender
    - Self-service app user
    - Individual sender
    - On-demand or occasional parcel movement
    - Convenience and price, but this is less central to Loggi’s stated B2B focus
