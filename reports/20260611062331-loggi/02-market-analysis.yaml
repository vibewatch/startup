    - Positive
    - Current
    - Concentrated demand supports better route economics and faster SLAs
    - Request corridor-level margin by Southeast metro and secondary city
  - - Road dependence and weak maintenance
    - Negative
    - Current
    - Raises line-haul cost and long-tail delivery risk
    - Track cost per parcel by route length and modal alternative
  - - Congestion, diesel, and labor inflation
    - Negative
    - Current
    - Compresses margin and favors operators with routing and scale
    - Validate whether Loggi’s productivity gains offset external inflation
  - - Infrastructure concession pipeline
    - Positive but delayed
    - Medium term
    - Can improve corridors over time but is not an immediate unit-economics reset
    - Map which announced projects affect Loggi’s main lanes before 2028
