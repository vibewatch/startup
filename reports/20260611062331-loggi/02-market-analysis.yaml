tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Loggi
  rows:
  - - Online retail demand
    - GMV / retail revenue that creates parcel demand
    - Delivery revenue itself is not equal to merchandise value
    - Consumers generate demand; merchants and marketplaces fund fulfillment
    - Context only; useful for demand direction, too broad for TAM
  - - Merchant payments / checkout
    - Pix, cards, BNPL, and payment rails that improve conversion and working capital
    - Pure fintech revenue or banking balances
    - Merchants pay fees; consumers choose methods
    - Adjacency and adoption driver, not the delivery TAM
  - - CEP / parcel services
    - Domestic and international parcels under courier/express/parcel definitions
    - Heavy freight, bulk line-haul, and non-parcel industrial movements
    - Businesses and consumers pay shipping fees
    - Core service layer for outsourced package movement
  - - Last-mile delivery
    - Pickup, urban sorting, and delivery execution close to recipient
    - Upstream marketplace take rates and non-delivery tech revenue
    - Merchants, marketplaces, and logistics buyers
    - Closest public proxy for Loggi’s operational niche
  - - Broad freight and logistics
    - Road, warehousing, forwarding, and multimodal services
    - Consumer GMV and fintech revenue
    - Shippers and enterprise logistics buyers
    - Upper-bound context only; far broader than Loggi’s service scope
  - - Cross-border commerce
    - Imported orders that localize inventory or need domestic delivery handoff
    - Foreign order value that never touches domestic fulfillment networks
    - Cross-border merchants, marketplaces, and Brazilian buyers
    - Relevant only when customs and warehousing translate into local parcel flows
  notes: 'Synthesis table: included and excluded spend boundaries are analytical judgments built from public market definitions, not a vendor-disclosed taxonomy.'
