    - Marketplace account operator
    - Ops and customer-service staff
    - Seller or marketplace-funded shipping program
    - Multi-order parcel dispatch through integrated channels
    - Lower shipping friction and preserve marketplace conversion
  - - Enterprise retailer / brand
    - Logistics or commerce director
    - Warehouse and CX teams
    - Operations / fulfillment budget
    - API-led pickup, SLA tracking, returns and nationwide delivery
    - Need reliability, density, and lower failure rates at scale
