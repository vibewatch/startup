- id: buyer-segments-and-demand-drivers
  title: Buyer segments and demand drivers
  body: 'Brazilian parcel demand is not homogeneous across buyers. The strongest fit for Loggi sits with merchants and marketplaces that must convert digital demand into low-friction delivery: SMB sellers that need simple pickup and billing, larger retailers and marketplaces that value integrations and SLA consistency, and cross-border or omnichannel merchants that increasingly localize inventory to reduce friction. Merchant behavior in 2025-2026 suggests a market that is still growing but has become more selective. NuvemCommerce 2026 shows that merchants are now more focused on conversion and margin than on raw traffic, while the shift toward own-store D2C economics makes fulfillment quality more strategic. Payments also matter: Pix has become central to SME and e-commerce checkout behavior, improving cash flow and reducing payment friction. Mobile usage deepens that effect by widening demand beyond desktop-heavy cohorts. Together, those drivers favor logistics platforms that can combine
    integrations, reliable tracking, and cost-efficient delivery rather than platforms competing only on brute geographic coverage.'
