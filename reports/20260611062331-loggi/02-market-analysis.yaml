callouts:
- calloutType: insight
  title: The right denominator is narrower than GMV
  body: The public market data supports strong e-commerce growth, but the service layer closest to Loggi is parcel and last mile. Treating all e-commerce or all logistics as the TAM would overstate addressability.
  claimRefs:
  - CM004
  - CM006
  - CM009
  - CM042
- calloutType: risk
  title: National coverage does not mean national unit economics
  body: Brazil’s road dependence, old fleets, and corridor concentration mean that density matters more than coverage headlines. Operators can be national in reach while still earning their best returns in a narrow set of corridors.
  claimRefs:
  - CM023
  - CM024
  - CM030
  - CM031
  - CM034
  - CM043
- calloutType: insight
  title: Loggi’s upside is execution-led, not white-space-led
  body: Management’s own 2026 message is about breakeven, operational excellence, and doubling share from an existing base. That is consistent with a market that rewards route density, integrations, and service reliability over simple footprint expansion.
  claimRefs:
  - CM010
  - CM020
  - CM040
  - CM041
