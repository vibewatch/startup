    - Quantify how much Pix-heavy merchants ship more frequently or convert better
  - - Mobile commerce penetration
    - Positive
    - Current to medium term
    - Extends e-commerce demand beyond desktop-heavy urban cohorts
    - Check whether mobile-driven demand is matched by affordable delivery options outside core metros
  - - D2C and own-store shift
    - Positive
    - Current
    - Pushes merchants to own the delivery experience and retention loop
    - Measure how much self-owned channels versus marketplaces drive Loggi mix
