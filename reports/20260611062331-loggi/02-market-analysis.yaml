chapter:
  number: 2
  title: Market Analysis
  summary: 'Brazil gives Loggi a genuinely large but layered opportunity: e-commerce demand is still compounding, Pix and mobile usage keep broadening merchant activity, and outsourced parcel and last-mile services continue to expand. The market is also structurally constrained by road dependence, infrastructure gaps, and strong Southeast concentration, which means the company’s real SAM is outsourced merchant parcel execution rather than all Brazilian logistics spend. Public evidence supports Loggi as a meaningful scaled participant, but precise SOM remains under-defined because the denominator behind management’s 10% share claim is not publicly reconciled.'
sections:
- id: market-boundary-and-sizing
  title: Market boundary and sizing logic
  body: Loggi should be framed against a nested market stack rather than one oversized TAM. The broadest context is Brazilian online retail demand, which official and industry sources place between roughly US$36 billion of 2025 e-commerce revenue and a broader US$69 billion 2026 e-commerce market estimate. That demand does not flow one-for-one into delivery revenue, because checkout, payments, and merchandise value sit upstream of logistics services. The narrower service layers are courier, express, parcel, and last-mile delivery, where 2026 public estimates point to a low-single-digit-billion-dollar market, not the full GMV pool. The practical consequence is that Loggi’s addressable market is best defined as outsourced merchant parcel and last-mile execution for businesses that need national reach and dense urban performance. That framing keeps TAM, SAM, and SOM internally consistent and also explains why a 10% share claim can coexist with a much smaller service denominator than Brazil’s
    total e-commerce spend.
  claimRefs:
