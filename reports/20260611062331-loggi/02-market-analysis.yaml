- id: implications-for-loggi
  title: Implications for Loggi
  body: 'Within that market structure, Loggi looks best positioned as a scaled B2B parcel and last-mile orchestrator rather than as a proxy for the whole Brazilian logistics market. Management-reported data points—500 thousand packages per day, more than 250 agencies, cross-docks, PUDO points, and broad integrations with SME commerce platforms—support real operating relevance. But they also highlight the analytical trap: large national footprint claims do not solve the denominator problem for market share or the unit-economics problem for long-tail routes. The company’s own messaging has shifted toward breakeven, operational excellence, and density optimization, which is exactly what the surrounding market demands. If the market keeps rewarding fast settlement, reliable tracking, and dense urban execution while penalizing congestion, diesel exposure, and thin routes, Loggi’s upside comes from share gains inside outsourced merchant parcel flows rather than from pretending all Brazilian logistics
    spend is available. That is positive for the thesis, but it keeps precise SOM sizing dependent on internal evidence the public market does not disclose.'
