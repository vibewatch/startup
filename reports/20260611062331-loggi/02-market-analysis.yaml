  evidenceGaps:
  - type: missing-source
    severity: material
    topic: som-denominator
    missingEvidence: A public denominator for the 10% market-share claim, including whether management means B2B outsourced parcel, all CEP, or another slice.
    whyItMatters: Without a clear denominator, the SOM narrative can overstate or understate Loggi’s current position and distort any market-share-based valuation logic.
    diligencePath: Request a dated internal KPI pack that reconciles market-share definition, parcel volumes, and served merchants against a third-party category framework.
    relatedQuestionRefs:
    - QM006
    - QM024
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: municipality-coverage
    missingEvidence: An independently dated source that states exact municipality coverage and reconciles it with current package throughput and service levels.
    whyItMatters: National-coverage claims matter to SAM and execution positioning, but the chapter cannot independently verify a precise municipality count from its retained pack.
    diligencePath: Obtain a current network footprint deck or operations appendix that lists covered municipalities, active lanes, and SLA performance by region.
    relatedQuestionRefs:
    - QM023
    - QM021
  - type: private-evidence-only
    severity: material
    topic: sam-bridge
    missingEvidence: Merchant-segment spend by SMB versus enterprise on outsourced parcel and last-mile services in Brazil, ideally with route-density splits.
    whyItMatters: That split is required to turn broad market layers into a tighter SAM and to assess whether Loggi’s strongest segment is SMB aggregation or enterprise outsourcing.
    diligencePath: Request cohort-level revenue and parcel mix by merchant segment, plus external benchmarking from parcel aggregators or carrier procurement partners.
    relatedQuestionRefs:
    - QM005
    - QM024
    relatedTableRefs:
    - TM002
    - TM003
  - type: private-evidence-only
    severity: minor
    topic: route-profitability
    missingEvidence: Contribution margin by region, service speed, and delivery-density band for Loggi’s network.
    whyItMatters: Public sources clearly show national growth and cost pressure, but they do not reveal which corridors actually generate acceptable unit economics.
    diligencePath: Request route-level profitability cohorts and carrier cost curves segmented by Southeast core, secondary cities, and long-tail coverage zones.
    relatedQuestionRefs:
    - QM020
