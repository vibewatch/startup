summary:
  headline: 继续研究：Loggi 是一家有真实规模的巴西末端配送平台，盈亏平衡抓手也可信；但 ~US$2B 私募估值锚点已经过旧，披露又薄，当前案例对价格过于敏感，难以仅凭公开信息承销。
