companyProfile:
  summary: >-
    Loggi is a São Paulo-founded Brazilian logtech founded in 2013 that has grown from an urban
    courier service into a national merchant-focused parcel and last-mile platform. The public
    record supports real operating relevance: more than 20,000 online stores served, presence
    across more than 5,000 municipalities, roughly 500,000 packages per day in 2026 management
    narratives, and a software-led merchant workflow built around integrations, APIs, tracking,
    and LoggiPonto pickup/drop-off points. The core investment question is no longer whether the
    company is real or strategically relevant; it is whether a business still anchored to an old
    ~US$2B private valuation can justify a premium despite limited financial disclosure, labor and
    governance overhangs, and mixed public service-quality signals.
  foundedDate: '2013-01-01'
  founders:
    - name: Fabien Mendez
      role: Co-founder; former CEO; later chairman/executive chairman
      background: >-
        Public founder and former chief executive who remained central to the company narrative
        through the 2022 leadership transition.
      claimRefs: [CO006, CO018]
    - name: Arthur Debert
      role: Co-founder
      background: >-
        Long-standing co-founder still cited in recent public founder narratives, though the full
        founder roster remains somewhat ambiguous in historical coverage.
      claimRefs: [CO006, CO007]
  foundingLocation: São Paulo, Brazil
  headquarters: São Paulo, Brazil
  productSummary: >-
    Loggi sells national parcel collection, local express delivery, LoggiPonto drop-off, and
    merchant integrations through a software-led logistics stack spanning APIs, EDI, platform
    connectors, label generation, tracking, and route orchestration.
  customerFocus: >-
    SMB online merchants, marketplaces, larger enterprise shippers, and some individual users that
    need outsourced parcel and last-mile execution with nationwide reach plus dense urban service.
  businessModel: >-
    Transaction-based logistics monetization built around parcel delivery, merchant workflow
    software, pricing/routing optimization, pickup and drop-off network usage, and higher-touch
    enterprise shipping relationships.
  stage: late-stage private
  fundingStatus: >-
    The last major public primary financing was the March 2021 CapSur-led R$1.15B (~US$205M)
    round, widely reported at about a US$2B valuation. Later public reporting referenced a
    Citi-assisted private stake-sale exploration in 2024 rather than a clearly disclosed new round.
  disclosureProfile: private-undisclosed
  claimRefs: [CO004, CO006, CO010, CO012, CO013, CO026, CO028, CO031, CE018, CU005, CM042, CI024, CR029]

summary:
  headline: >-
    Research-more: Loggi is a real, scaled Brazilian last-mile platform with credible breakeven
    levers, but the stale ~US$2B private valuation anchor and thin disclosure make the current case
    too price-sensitive to underwrite publicly.
  overallScore: 6.1
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 2000
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 486
    customerCount: 20000
    headcount: null
  topStrengths:
    - >-
      Public evidence supports real national operating scale, including 20k+ online stores,
      5k+ municipalities, and roughly 500k daily packages.
    - >-
      Loggi is more software-native than many parcel peers, with merchant integrations, APIs,
      tracking/webhook infrastructure, and a growing LoggiPonto network that lowers SMB adoption friction.
    - >-
      Management is now focused on pricing discipline, density, and breakeven rather than
      growth-at-all-costs, which fits the economics of Brazilian last-mile logistics.
    - >-
      The company still appears strategically relevant to major merchants and marketplaces, giving
      it a credible platform position rather than a purely local courier profile.
  topRisks:
    - >-
      The old ~US$2B private valuation anchor looks difficult to justify from public evidence when
      logistics comps trade on lower revenue multiples and Loggi still withholds core margin and cash data.
    - >-
      Financial disclosure remains too thin to underwrite profitability with confidence: public
      sources do not reconcile gross margin, cash balance, burn, runway, debt-like obligations, or cap-table terms.
    - >-
      Labor classification exposure, leadership reshuffles, and incomplete governance disclosure
      create material execution and downside risk during a period when the company is pushing for breakeven.
    - >-
      Public service-quality signals remain mixed, with heavy complaint volume and poor app-review
      surfaces that could weaken retention or force pricing concessions.
    - >-
      Customer concentration and retention quality remain unquantified even though large-platform
      relationships likely matter to route density and economics.
  unresolvedGaps:
    - >-
      Audited or management-reconciled financials covering net revenue, gross margin, EBITDA,
      operating cash flow, cash balance, and runway.
    - >-
      Current cap table, liquidation preferences, investor rights, and any verified secondary
      clearing price since the 2021 financing.
    - >-
      Cohort retention, NRR/GRR, customer concentration, and unit economics by SMB versus large-account lanes.
    - >-
      Formal board composition, investor governance rights, and a cleaner founder/leadership map
      after the 2026 operating reorganization.
    - >-
      A reconciled KPI pack for customer count, package throughput, pickup-point footprint, and
      realized progress toward the 2H26 breakeven target.

disclaimer: >-
  This report is based on publicly available information as of 2026-06-11 and is not investment
  advice. Loggi is a private company, and several decisive underwriting inputs remain outside the
  public record reviewed here.
