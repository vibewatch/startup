evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founders
    missingEvidence: >-
      A current official founder roster that explicitly lists every cofounder and clarifies whether Eduardo Wexler
      remains part of the canonical founding set.
    whyItMatters: >-
      Founder identity is reused across later governance and key-person analysis, and the retained public record is not
      fully consistent.
    diligencePath: >-
      Request the current corporate history or cap-table summary from management and reconcile it against archived
      unicorn-era coverage.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster plus investor governance rights after the 2021 round and 2026 leadership reset.
    whyItMatters: >-
      Public reporting surfaces Marcel Arins and CapSur influence, but not the full decision-making structure or board
      independence.
    diligencePath: >-
      Request the latest board list, committee structure, shareholder rights summary, and any observer arrangements tied
      to CapSur or other investors.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      A dated management KPI pack reconciling current customer count, package throughput, courier count, and municipal
      reach.
    whyItMatters: >-
      Retained sources show 300k versus 500k daily packages and 20k versus 22k customers, which affects maturity and
      execution judgments.
    diligencePath: >-
      Ask for the latest monthly operating dashboard with definitions for customers, municipalities served, daily
      packages, and active couriers.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      An exact total-raised figure, any debt or credit facilities, and ownership stakes after the 2024 secondary
      exploration.
    whyItMatters: >-
      Public sources disagree on lifetime capital raised and do not disclose dilution, secondaries completed, or
      leverage.
    diligencePath: >-
      Request the financing history ledger, current cap table, debt schedule, and any completed or abandoned secondary
      process materials.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology
    missingEvidence: >-
      A management-verified chronology that dates internal product launches, network-asset openings, and any completed
      secondary transaction outcomes not captured in public reporting.
    whyItMatters: >-
      The milestone table clears the public chronology bar, but its partial coverage means some internal or unpublished
      milestones may still be missing from the record.
    diligencePath: >-
      Request a board or investor update deck with the internal operating timeline and reconcile any private milestones
      against the public sequence already documented here.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: som-denominator
    missingEvidence: >-
      A public denominator for the 10% market-share claim, including whether management means B2B outsourced parcel, all
      CEP, or another slice.
    whyItMatters: >-
      Without a clear denominator, the SOM narrative can overstate or understate Loggi’s current position and distort
      any market-share-based valuation logic.
    diligencePath: >-
      Request a dated internal KPI pack that reconciles market-share definition, parcel volumes, and served merchants
      against a third-party category framework.
    relatedQuestionRefs:
      - QM006
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: municipality-coverage
    missingEvidence: >-
      An independently dated source that states exact municipality coverage and reconciles it with current package
      throughput and service levels.
    whyItMatters: >-
      National-coverage claims matter to SAM and execution positioning, but the chapter cannot independently verify a
      precise municipality count from its retained pack.
    diligencePath: >-
      Obtain a current network footprint deck or operations appendix that lists covered municipalities, active lanes,
      and SLA performance by region.
    relatedQuestionRefs:
      - QM023
      - QM021
  - type: private-evidence-only
    severity: material
    topic: sam-bridge
    missingEvidence: >-
      Merchant-segment spend by SMB versus enterprise on outsourced parcel and last-mile services in Brazil, ideally
      with route-density splits.
    whyItMatters: >-
      That split is required to turn broad market layers into a tighter SAM and to assess whether Loggi’s strongest
      segment is SMB aggregation or enterprise outsourcing.
    diligencePath: >-
      Request cohort-level revenue and parcel mix by merchant segment, plus external benchmarking from parcel
      aggregators or carrier procurement partners.
    relatedQuestionRefs:
      - QM005
      - QM024
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: route-profitability
    missingEvidence: Contribution margin by region, service speed, and delivery-density band for Loggi’s network.
    whyItMatters: >-
      Public sources clearly show national growth and cost pressure, but they do not reveal which corridors actually
      generate acceptable unit economics.
    diligencePath: >-
      Request route-level profitability cohorts and carrier cost curves segmented by Southeast core, secondary cities,
      and long-tail coverage zones.
    relatedQuestionRefs:
      - QM020
  - type: missing-source
    severity: material
    topic: pivot-timing
    missingEvidence: >-
      A dated management statement or archived strategy artifact that pins the consumer-to-B2B transition to a specific
      2019-2020 milestone.
    whyItMatters: >-
      The retained pack supports the directional pivot but not a clean date, so narrative precision is weaker than the
      strategic conclusion.
    diligencePath: >-
      Ask Loggi for archived 2019-2020 strategy materials, press decks, or board updates that explicitly describe the
      shift in target customer and service mix.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Realized merchant tariffs, discounts, fuel surcharges, and minimum-volume commitments across Loggi, Correios
      contracts, Amazon, Mercado Envios, Jadlog, and Total Express.
    whyItMatters: >-
      Public list-price and commission signals exist, but pricing power and contribution margin cannot be judged from
      teaser pages alone.
    diligencePath: >-
      Request anonymized current contracts, discount ladders, surcharge policies, and merchant cohort gross margins by
      parcel band.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: apples-to-apples-benchmarking
    missingEvidence: >-
      Comparable parcel volumes, on-time SLAs, failed-delivery rates, and corridor mix for Loggi, Correios, Mercado
      Envios, Amazon, Jadlog, and Total Express.
    whyItMatters: >-
      Without comparable benchmarks, “subscale” and “density edge” can be directionally true while still remaining
      under-specified for underwriting.
    diligencePath: >-
      Request corridor-level benchmark packs from management or a third-party parcel audit covering volume, SLA, and
      failure rates by competitor set.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: corridor-economics
    missingEvidence: Contribution margin, courier utilization, and retention by metro or lane versus marketplace-owned alternatives.
    whyItMatters: >-
      Competitive durability depends on whether Loggi’s integration and routing edge converts into superior unit
      economics in dense corridors, not just faster growth in public narratives.
    diligencePath: >-
      Request route-level unit economics, courier acceptance/utilization, and merchant retention by integration channel
      and corridor.
    relatedQuestionRefs:
      - QP019
      - QP020
      - QP021
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized enterprise pricing, discount waterfalls, and net yields by merchant segment.
    whyItMatters: >-
      List prices and pricing-tool descriptions do not show whether Loggi is earning acceptable gross profit after
      discounts and service exceptions.
    diligencePath: Request contract price books, realized ASP by segment, and price-approval governance from finance and sales ops.
    relatedQuestionRefs:
      - QI003
  - type: private-evidence-only
    severity: blocking
    topic: cac-payback-and-margin
    missingEvidence: CAC, payback, contribution margin, and cohort profitability for the SME self-service and enterprise channels.
    whyItMatters: >-
