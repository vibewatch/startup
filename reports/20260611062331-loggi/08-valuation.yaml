    {
      "id": "execution-can-justify-a-premium-but-not-a-blind-one",
      "title": "Execution evidence explains why the company is not a simple low-multiple logistics asset",
      "body": "Public evidence also explains why Loggi should not be treated as a commodity trucking or parcel name. Management is now talking about R$1.5 billion of annual revenue, second-half 2026 breakeven, and a deliberate push to move from 10% to something closer to 20% share. Bloomberg Línea’s 2024 interview adds a useful bridge: Loggi said it had reached positive EBITDA in late 2023, had no debt, and still held hundreds of millions of reais in cash. Operationally, the company is still large enough to matter—roughly half a million daily packages, more than 22 thousand customers, national reach through thousands of municipalities, and continued SME expansion via LoggiPontos and platform integrations. Open Pricer’s pricing partnership is especially important because it shows management attacking profitability through quote speed, discount discipline and customer-specific pricing, not just through cost cuts. These signals justify some private premium. They do not, however, erase the fact that profitability remains management-described rather than independently disclosed.",
