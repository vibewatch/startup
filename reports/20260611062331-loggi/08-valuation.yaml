  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Loggi still has enough scale and execution optionality to justify a meaningful private premium, but the public record does not support treating the old ~US$2 billion mark as obviously cheap. The retained evidence shows a stable valuation memory from the 2021 round into the 2024 Citigroup-led stake-sale process, plus current management commentary around roughly R$1.5 billion of annual revenue, a 2H26 breakeven target, market-share ambitions and continued investment in pricing and operations. At the same time, public logistics comparables such as JD Logistics and J&T trade on far lower revenue multiples than a stale unicorn-style mark would imply, while Loggi remains too opaque on margins, runway, cap table and preference terms for rigorous DCF or return math. The chapter’s conclusion is therefore price-sensitive: Loggi looks strategically relevant but publicly stretched, so the right stance is research-more rather than buy unless diligence or entry terms improve materially."
  },
  "sections": [
    {
      "id": "private-mark-context",
      "title": "Private valuation anchors still point to the same headline mark, but not to proven 2026 clearing",
      "body": "The public valuation story is unusually stable on the surface. Loggi became a unicorn in 2019 after a US$150 million round, then drew a new financing in early 2021 that multiple outlets placed near a US$2 billion valuation. That same number reappeared in January 2024 when Bloomberg-reported stake-sale coverage said Citigroup was helping explore strategic options and a private sale. But stability of headline marks is not the same as proof of current clearing price. The 2024 coverage described a process, not a disclosed closed trade, and PitchBook’s current profile points to private secondary activity rather than a fresh priced primary round. That means the old valuation anchor is still relevant as a market-memory reference, but it cannot be treated as a fully verified fair-value mark for 2026 without transaction evidence or a current term sheet. The mark is informative, not decisive.",
