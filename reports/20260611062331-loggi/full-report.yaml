      - number: '3.2'
        title: National incumbents and marketplace-owned logistics
        blocks:
          - type: paragraph
            body: >-
              Correios still defines the baseline for national parcel service in Brazil because the retained official
              pack shows SEDEX with tracking, reverse logistics, contract collections, lockers, and merchant workflow
              tools such as Correios Empresas and Pré-Postagem Nacional. Jadlog is the strongest private-incumbent
              comparator in the retained pack, pairing broad capillarity, 7,000 vehicles, and SMB-facing franchise
              units. Against those incumbents, marketplace-owned networks raise a different challenge. Mercado Envios
              openly documents multiple operating modes—ME1, ME2, Full, Flex, Turbo, cross-docking, and drop-off—which
              means it can let sellers use external carriers in some flows while still tightening ecosystem control in
              others. Amazon goes further by layering marketplace demand, FBA, invite-only FBA Onsite, Prime service
              promises, post-sale handling, and a Brazil network that it says already reaches every municipality. This
              is why Loggi’s nationwide narrative is credible but still subscale: the public evidence supports
              meaningful reach, yet the biggest incumbent and platform stacks pair physical logistics with stronger
              captive demand and broader service bundles than Loggi can currently document in public.
