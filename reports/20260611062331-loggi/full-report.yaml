companyProfile:
  summary: >-
    Loggi is a São Paulo-founded Brazilian logtech founded in 2013 that has grown from an urban courier service into a
    national merchant-focused parcel and last-mile platform. The public record supports real operating relevance: more
    than 20,000 online stores served, presence across more than 5,000 municipalities, roughly 500,000 packages per day
    in 2026 management narratives, and a software-led merchant workflow built around integrations, APIs, tracking, and
    LoggiPonto pickup/drop-off points. The core investment question is no longer whether the company is real or
    strategically relevant; it is whether a business still anchored to an old ~US$2B private valuation can justify a
    premium despite limited financial disclosure, labor and governance overhangs, and mixed public service-quality
    signals.
