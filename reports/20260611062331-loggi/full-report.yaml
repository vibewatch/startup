      - number: '7.5'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              There are real mitigations, but they are operational rather than structural. Loggi has proven it can cut
              costs, reach positive EBITDA, maintain significant liquidity, and keep investing in infrastructure and
              software. Management also appears to understand the right bottlenecks: route quality, package-status
              visibility, sortation technology, pricing discipline, and a more operations-led top structure. Those are
              meaningful positives. But the residual exposure stays high because each mitigation is being asked to carry
              several risks at once. Better routing has to improve both customer experience and margin; smarter pricing
              has to defend share without restarting a discount spiral; a new operator-led org chart has to deliver
              breakeven, absorb labor-market competition, and keep large ecosystem partners close even as they
              internalize logistics. That is why monitorable triggers matter more than broad narrative. Investors should
              want proof that the labor case is truly de-risking, that 2026 breakeven is reached without another large
              retrenchment, that review-surface pain is falling rather than merely being answered, and that no further
              strategic asset sales or executive reshuffles are needed to keep the model on track. If those indicators
              move the wrong way, the risk-adjusted case weakens quickly even if topline growth continues.
