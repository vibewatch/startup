  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows a chain from private valuation anchors through execution evidence, public comp
      discipline and disclosure gaps.
    approximationNotes: This is an analytical logic map, not a process diagram of company operations.
    claimRefs:
      - CV029
      - CV037
      - CV039
      - CV044
      - CV045
    data:
      nodes:
        - id: anchor
          label: 2019-2024 public anchors keep pointing to ~US$1B then ~US$2B
        - id: scale
          label: 'Real scale: R$1.5B revenue claim, 500k packages/day, 22k+ clients'
        - id: execution
          label: Breakeven + pricing discipline could justify some premium
        - id: comps
          label: Public logistics comps still trade on far lower multiples
        - id: opacity
          label: No public cap table, margin bridge or audited cash-flow pack
        - id: call
          label: Recommendation = research-more; valuation stance = stretched
      edges:
        - from: anchor
          to: scale
        - from: scale
          to: execution
        - from: execution
          to: comps
        - from: comps
          to: opacity
        - from: opacity
          to: call
  - id: FV002
    title: Valuation / return range
    type: range
    layout: wide
    summary: Public scenario ranges frame where value could sit if execution lands, partially lands or slips.
    approximationNotes: >-
      Ranges are illustrative enterprise-value anchors derived from public comparables, private marks and execution risk
      rather than from audited DCF outputs.
    claimRefs:
      - CV029
      - CV041
      - CV042
      - CV043
      - CV044
    data:
      items:
        - label: Bear
          low: 0.6
          mid: 0.8
          high: 1
          note: Breakeven slips; public logistics multiples dominate.
        - label: Base
          low: 1.2
          mid: 1.5
          high: 1.8
          note: Execution improves, but opacity keeps a discount vs stale private mark.
        - label: Bull
          low: 2
          mid: 2.3
          high: 2.6
          note: Breakeven lands and investors still accept a premium private platform story.
        - label: Historic private anchor
          low: 2
          mid: 2
          high: 2
          note: 2021 round and 2024 process reference point, not a proven 2026 clearing price.
  - id: FV003
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scoring shows why the company remains interesting while the price still looks hard to underwrite
      publicly.
    approximationNotes: Scores are 1-5 and reflect public-evidence strength, not a mechanical investment model.
    claimRefs:
      - CV017
      - CV028
      - CV034
      - CV039
      - CV044
      - CV045
    data:
      items:
        - label: Market
          score: 4
          rationale: Brazilian e-commerce logistics still supports a scaled challenger with room to gain share.
          evidenceQuality: medium
        - label: Scale / proof
          score: 4
          rationale: Loggi has meaningful package volume, clients, integrations and private valuation persistence.
          evidenceQuality: medium
        - label: Execution
          score: 3
          rationale: Breakeven and pricing levers are plausible but not yet fully proven in audited numbers.
          evidenceQuality: medium
        - label: Economics
          score: 2
          rationale: Positive EBITDA and cash claims exist, but gross margin and burn remain opaque.
          evidenceQuality: low
        - label: Disclosure quality
          score: 1
          rationale: No public cap table, waterfall, audited cash-flow pack or margin bridge.
          evidenceQuality: low
        - label: Risk
          score: 2
          rationale: Layoffs and labor-model risk still warrant a real discount.
          evidenceQuality: medium
        - label: Valuation fit
          score: 2
          rationale: Current implied mark looks stretched against public logistics comps absent diligence upside.
          evidenceQuality: medium
  - id: FV004
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Public comp multiple dispersion shows how wide the allowed valuation band becomes once business-model differences
      are acknowledged.
    approximationNotes: >-
      Bars mix market-cap-to-revenue and EV-to-revenue style signals because the retained public pages expose different
      but still directionally useful valuation surfaces.
    claimRefs:
