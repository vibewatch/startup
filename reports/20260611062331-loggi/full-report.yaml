  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Private valuation anchors still point to the same headline mark, but not to proven 2026 clearing
        blocks:
          - type: paragraph
            body: >-
              The public valuation story is unusually stable on the surface. Loggi became a unicorn in 2019 after a
              US$150 million round, then drew a new financing in early 2021 that multiple outlets placed near a US$2
              billion valuation. That same number reappeared in January 2024 when Bloomberg-reported stake-sale coverage
              said Citigroup was helping explore strategic options and a private sale. But stability of headline marks
              is not the same as proof of current clearing price. The 2024 coverage described a process, not a disclosed
              closed trade, and PitchBook’s current profile points to private secondary activity rather than a fresh
              priced primary round. That means the old valuation anchor is still relevant as a market-memory reference,
              but it cannot be treated as a fully verified fair-value mark for 2026 without transaction evidence or a
              current term sheet. The mark is informative, not decisive.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV023
              - CV029
              - CV038
