              - CV045
              - CV046
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV017
              - CV028
              - CV034
              - CV039
              - CV044
              - CV045
      - number: '8.5'
        title: What would move the call, and what would break it
        blocks:
          - type: paragraph
            body: >-
              The remaining work is therefore highly practical. If diligence proves a clean preference stack, confirms
              that the R$1.5 billion revenue base carries healthy gross margins, and shows that 2H26 breakeven can be
              reached without another major restructuring, the current private mark could still be defended as a premium
              logistics-platform valuation. If instead investors find thin margins, weak customer retention, hidden
              financing protections, or another gap between narrative and cash generation, then the company starts
              looking much closer to public logistics comps than to an enduring software-like platform premium. The key
              is to stop debating the abstract worth of the company and focus on the few documents that actually
              determine whether a private premium is deserved. Until those materials surface, the thesis is intact
              enough to follow, but not underwritten enough to buy with conviction at the old headline number.
            claimRefs:
