      - number: '4.4'
        title: Profitability path and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The profitability story is therefore plausible but not yet proven. On the positive side, Loggi has several
              visible levers that could improve economics without a fresh growth-at-all-costs push: self-service SME
              onboarding reduces commercial friction, pricing optimization should improve quote quality and discount
              discipline, route selection is explicitly driven by cost and density, and LoggiPonto expands access with
              less owned-infrastructure burden. On the negative side, the public record also shows repeated layoffs in
              2020, 2022, and 2023, plus recurring labor-law challenges over whether couriers should be treated as
              employees. Those facts matter financially because they imply a company that has repeatedly had to
              rebalance cost structure while still carrying legal uncertainty around a core operating input. Just as
              importantly, the missing metrics are the ones investors need most: cash balance, burn, runway, gross
              margin, contribution margin, realized pricing, debt obligations, and working-capital intensity. Management
              commentary about breakeven is useful directionally, but until those figures are disclosed privately to
              diligence parties, the correct verdict is that Loggi may be approaching sustainability yet still requires
              evidence before profitability can be underwritten with confidence.
