  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating posture
        blocks:
          - type: paragraph
            body: >-
              Loggi’s public identity is that of a technology-led logistics network rather than a narrow courier app.
              Its official English and Portuguese pages emphasize national shipping, first-to-last-mile execution,
              tracking by SMS or email, and integrations that let sellers and marketplaces outsource delivery complexity
              while keeping recipients informed. That combination supports a practical description of Loggi as a
              late-stage private Brazilian logtech serving e-commerce and other business senders across the country. The
              strongest current scale claims remain management-led rather than audited, but they are still important
              because they frame the company’s operating ambition: more than 22,000 clients, more than 5,000
              municipalities, and roughly 500,000 packages a day in 2026 management narratives, versus about 300,000
              packages a day in Bloomberg-syndicated 2024 reporting. The safe conclusion is not one exact throughput
              number, but that Loggi has already moved well beyond an urban messenger niche into a large national
              delivery platform whose next phase is execution discipline and profitability rather than proving
              product-market fit.
