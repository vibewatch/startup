      - number: '8.3'
        title: Public comparables argue for caution unless Loggi can prove it deserves a premium far above logistics norms
        blocks:
          - type: paragraph
            body: >-
              The most important valuation discipline comes from public comps. J&T Express and JD Logistics both show
              that large delivery networks with real scale can trade at low public-market revenue multiples—roughly
              below 1x in J&T’s case and around 0.3x EV/revenue in JD’s case. MercadoLibre is the obvious
              counterexample, but it is a blended marketplace, fintech, ads and logistics platform rather than a pure
              parcel carrier; even there, Yahoo’s June 2026 snapshot points to 2.75x EV/revenue, which is richer than
              logistics comps but still not a blank check for opaque private freight assets. That leaves Loggi in an
              awkward middle. It has more technology, route intelligence and platform leverage than a plain carrier, but
              much less disclosure and monetization diversity than MercadoLibre. The result is a wide scenario range
              with a base case that should sit below the old US$2 billion mark unless management proves breakeven, keeps
              share gains coming, and demonstrates that pricing discipline is actually flowing through to cash
              generation.
            claimRefs:
              - CV030
