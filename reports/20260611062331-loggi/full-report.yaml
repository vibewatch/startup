      - number: '1.3'
        title: Funding history, investor base, and ownership signals
        blocks:
          - type: paragraph
            body: >-
              Loggi’s capital history is strong enough to anchor later valuation work, even if exact lifetime funding
              and ownership percentages remain fuzzy. The company became a unicorn in the June 2019 round of about
              US$150 million, with SoftBank, Microsoft, GGV, Fifth Wall, and VELT repeatedly named in public coverage.
              The next major step was the March 2021 round: R$1.15 billion, or about US$205 million, led by CapSur with
              Verde participating and legacy backers such as Monashees, SoftBank, Microsoft, and GGV returning. Public
              coverage around that financing consistently placed valuation near US$2 billion, while database-style
              sources later estimated roughly US$2.2 billion; the prudent synthesis is to describe the round as valuing
              Loggi at about US$2 billion. Bloomberg-syndicated 2024 coverage then introduced an important ownership
              signal: Citi was reportedly helping explore a private stake sale to Asian investors, with IPO optionality
              in the background. That shows at least some investor liquidity planning, but not a disclosed completed
              transaction or cap-table outcome.
