      - number: '5.3'
        title: Network controls, trust, and service quality
        blocks:
          - type: paragraph
            body: >-
              Loggi’s operating system combines a digital merchant layer with a physical network that is still evolving
              quickly. Public pages claim more than 500 thousand packages per day, ten owned distribution centers,
              dozens of agencies, and up to one million packages of daily sorting capacity in São Paulo. The
              pickup-point network is strategically important because it makes the SME motion work at low volume, yet it
              is also where the public record gets messy: current consumer pages and the integrations page say 1,700+
              points, while another official enterprise page still says 1,200+, and 2025 news coverage described a plan
              to add 1,200 new points on top of a smaller installed base. The conclusion is not that the network is
              weak; it is that public version control is weak. Operational controls are more concrete than the security
              posture is. The help center publishes collection cutoff times and free-versus-paid pickup rules, the
              transportadora page advertises digital proof of delivery and courier identity validation, and the privacy
              pages articulate LGPD rights, fraud-prevention uses, and security obligations. But there is still no
              public uptime SLA for the merchant/API stack in the materials reviewed. Service quality also appears
              mixed: the product is feature-rich, but adverse consumer feedback remains meaningful on Reclame Aqui.
