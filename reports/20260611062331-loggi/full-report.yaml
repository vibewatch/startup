        title: Integration stack and operating model
        blocks:
          - type: paragraph
            body: >-
              Loggi’s strongest product evidence is on the merchant integration layer rather than on deep public
              architecture disclosure. The official stack spans REST APIs, EDI, no-code platform connectors, and
              platform-native plugins such as WooCommerce and Shopify. The API docs are real and reasonably broad:
              authentication, quotation, shipment creation, updates, cancellations, labels, tracking, and LoggiPonto
              lookup are all exposed, with sample code in multiple languages. Tracking is not just a generic “track your
              order” marketing claim either; the docs explicitly recommend webhook delivery for real-time monitoring and
              publish a granular event taxonomy that includes delivery exceptions, loss, theft, and fiscal holds. That
              said, direct API usage is not fully self-serve. Credentials still require commercial or support
              intervention, and the help center says some integrations and postpaid shipping features pass through
              credit/profile review. In practice, Loggi appears to have optimized for a mixed stack: low-friction
              platform onboarding for mainstream SMB commerce, plus a gated direct-integration path for higher-touch
              merchants and enterprise customers. On the operating side, official pages repeatedly claim routing
              decisions incorporate cost, density, and destination-capacity logic. This is specific enough to show that
              the routing engine is not pure slogan, but not specific enough to treat the AI layer as independently
              validated.
