      - number: '3.4'
        title: Loggi relative positioning and moat durability
        blocks:
          - type: paragraph
            body: >-
              On the evidence retained in this chapter, Loggi’s strongest relative position is not universal network
              control but a merchant-facing software and orchestration layer: APIs for quote, shipment, labels,
              tracking, and pickup points; EDI; and no-code integrations through widely used commerce platforms. That
              stack makes the company more open and channel-agnostic than marketplace-owned logistics programs, and its
              courier-facing app supports a flexible, asset-light capacity model. Those are real strengths, especially
              for merchants that want parcel execution without committing all demand to Mercado Livre, Amazon, or a
              food-delivery app. But the same evidence also shows why the moat is not fully secure. NeoFeed frames the
              current phase around execution discipline and breakeven, not unconstrained expansion; Valor shows that
