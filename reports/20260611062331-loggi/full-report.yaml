      - number: '2.3'
        title: Geographic density and Brazil logistics environment
        blocks:
          - type: paragraph
            body: >-
              Brazil’s logistics environment is supportive of parcel growth but structurally challenging for unit
              economics. Public sources converge on strong concentration in the Southeast, where freight flows,
              last-mile demand, warehouses, and digital purchasing power cluster around São Paulo and adjacent
              corridors. The rest of the country matters, especially as the North and Northeast continue to digitize,
              but lower density and weaker infrastructure make universal coverage more expensive and slower to monetize.
              Road dependence is the dominant constraint. Official and analyst sources describe a system in which
              trucking still carries the backbone of commerce, old fleets and weak road quality inflate cost, and
              underinvestment in infrastructure continues to leak value out of the system. The pipeline of highway
              concessions and ongoing public investment can improve conditions over time, but those programs are a
              medium-term relief valve, not an immediate reset. For a national last-mile platform, this means route
              density, corridor mix, and asset-light orchestration remain more important than headline coverage alone.
            claimRefs:
