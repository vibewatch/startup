  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosure boundary
        blocks:
          - type: paragraph
            body: >-
              Loggi’s public revenue model is easier to describe than its reported financial outcomes. Official pages
              show a multi-product logistics stack aimed at people, e-commerce merchants, and larger businesses,
              supported by freight calculation, platform integrations, tracking, and partner workflows rather than a
              single monoline courier product. The most concrete list-pricing signals are on the public calculator and
              merchant-facing pages: freight is shaped by distance, weight, dimensions, service level, and add-ons such
              as insurance, while some self-serve offers advertise starting prices such as next-day delivery from R$4 or
              LoggiPonto shipping from R$5.89. What is not public is just as important. No retained source discloses
              realized enterprise pricing, discount ladders, gross margin by service, or revenue recognition detail by
              pickup, drop-off, and integrated enterprise flows. That means the safe underwriting view is to separate
              disclosed list-pricing mechanics from actual monetization quality. Revenue quality can only be discussed
              indirectly today: Loggi clearly monetizes freight transactions and software-enabled shipping workflows,
              but the public record still does not show what share comes from high-frequency enterprise contracts versus
              lower-ticket self-service merchant volume.
