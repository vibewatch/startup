      - CR022
      - CR023
      - CR032
      - CR034
      - CR036
      - CR046
      - CR047
      - CR049
      - CR050
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: standard
    summary: >-
      How Loggi’s labor, pricing, quality, and leadership risks flow into growth, margin, financing, and the investment
      call.
    data:
      nodes:
        - id: n1
          label: Labor / privacy overhang
          description: Court ambiguity, worker governance criticism, and active regulator backdrop
        - id: n2
          label: Pricing pressure
          description: Aggressive rivals, shipping-economics compression, and tailored discounting
        - id: n3
          label: Operational quality drag
          description: Complaint load, app errors, and tracking-visibility gaps
        - id: n4
          label: Leadership reshuffle
          description: 2026 operating-model redesign and closer board involvement
        - id: n5
          label: Margin and cash-generation pressure
          description: Share gain and investment goals compete with sustainable economics
        - id: n6
          label: Customer trust and retention pressure
          description: Merchants and end users feel service failures or inconsistent support
        - id: n7
          label: Growth miss or concentration shock
          description: Platform dependence or marketplace verticalization hurts volume mix
        - id: n8
          label: Investment thesis break
          description: Risk-adjusted case fails despite ongoing topline demand
      edges:
