      Matrix values are an evidence-quality lens based on freshness, directness, and retention visibility; it
      intentionally differs from the enumeration table, which inventories the proofs themselves.
    claimRefs:
      - CU027
      - CU029
      - CU034
      - CU035
      - CU037
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: standard
    summary: Residual Loggi risks positioned by publicly supportable impact and likelihood rather than management aspiration.
    data:
      columns:
        - Critical impact
        - High impact
        - Moderate impact
      rows:
        - label: High likelihood
          values:
            - tone: negative
              label: Execution miss on breakeven + share gain
            - tone: negative
              label: Service-quality / tracking pain persists
            - tone: neutral
              label: Disclosure opacity slows diligence
        - label: Medium likelihood
          values:
            - tone: negative
              label: Labor classification reopens materially
            - tone: negative
              label: Marketplace price war compresses yield
            - tone: neutral
              label: Another leadership redesign
        - label: Low likelihood
          values:
            - tone: negative
              label: Formal data-privacy sanction tied to platform operations
            - tone: negative
              label: Asset-base shrink signals deeper stress
            - tone: neutral
              label: Courier-network complexity stabilizes without new cost
    claimRefs:
