      - number: '1.4'
        title: Milestones of record and adverse operating signals
        blocks:
          - type: paragraph
            body: >-
              The milestone record combines genuine national-scale buildout with meaningful operating stress. By late
              2019, court-coverage articles said Loggi had to formalize courier work relations and pay fines,
              highlighting labor-model exposure tied to its contractor-heavy network. A 2024 retrospective later said
              that ruling was reversed in 2021, so the public record points to legal volatility rather than a fully
              settled defeat. Operationally, the company also absorbed multiple rounds of restructuring: about 120
              layoffs in 2020, roughly 15% of staff in 2022 when Lecuyer took over as CEO, and another 250 employees in
              early 2023 after a much larger 2022 cut. The 2021 round funded infrastructure and technology expansion
              toward full population coverage, while 2026 management messaging shifted from expansion-at-all-costs
              toward breakeven, R$1.5 billion annual revenue ambitions, and R$100 million of technology spend. NeoFeed’s
              footprint markers of more than 250 agencies, 10 cross-docks, and over 1,900 PUDO points show the company
              is still operating at significant physical scale despite the tighter execution tone.
