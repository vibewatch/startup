      - number: '8.4'
        title: 'Recommendation: research-more, with a stretched valuation stance rather than a clean pass-or-buy verdict'
        blocks:
          - type: paragraph
            body: >-
              Taken together, the public evidence supports a nuanced rather than binary view. Loggi is not a broken
              asset. The company still has scale, real customers, operational levers, and a management team focused on
              sustainability instead of growth at any cost. That is enough to reject the simplistic bearish case that
              the business is merely a fading unicorn with no operating foundation. But the current implied valuation
              also does not look obviously cheap. Public comp evidence is softer than the private mark, total capital
              raised is still inconsistent across databases, and the data that would convert a strong company into a
              strong investment—gross margins, cohort retention, cap-table cleanliness, cash runway, and preference
              terms—remains private. For that reason, the right stance is stretched and the right public recommendation
              is research-more. A disciplined investor can stay engaged, but only on the expectation that diligence will
              either improve the data quality materially or produce entry terms better than the stale headline mark.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV039
