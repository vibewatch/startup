  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape segmentation and apples-to-oranges boundaries
        blocks:
          - type: paragraph
            body: >-
              Brazil’s competitive map around Loggi is real, but it is not a single clean carrier list. Correios and
              Jadlog are the clearest national parcel incumbents because they advertise nationwide pickup, delivery, and
              reverse-logistics infrastructure. Mercado Envios and Amazon are different: they are logistics systems
              embedded inside commerce ecosystems, so their power comes not only from freight execution but also from
              fulfillment, customer-service, and seller-acquisition loops. iFood matters again in a different way,
              because it owns dense urban courier demand and now reaches off-platform merchant orders as well, but its
              strongest evidence still sits in local, high-frequency delivery rather than national parcel line-haul.
              Melhor Envio is another apples-to-oranges case: it lowers switching costs by aggregating carrier choice
              and negotiated rates instead of running a national parcel network itself. The practical implication is
              that Loggi cannot be benchmarked only against one legacy carrier. It competes simultaneously against
              physical incumbency, platform lock-in, hyperlocal convenience expectations, and SMB software layers that
              make freight more comparable.
