        title: Differentiation, maturity, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Against conventional carriers, Loggi’s clearest product differentiation is not simply “better logistics”;
              it is a more software-native workflow for merchants. Official enterprise pages emphasize integrated local
              and national flows, routing by AI, platform connections, pickup-point density, ship-from-store, reverse
              logistics, and specialist support. Some of those are clearly productized today, especially the merchant
              onboarding path, platform connectors, tracking/webhook stack, and LoggiPonto economics. Others are more
              lightly documented. Reverse logistics, ship-from-store, and logistics fracionada are named, but public
              implementation depth is thin. The roadmap that is actually visible in public evidence is pragmatic and
              operational: Loggi Fácil as a 2023 launch, Agência 2.0 in 2024, major pickup-point expansion through 2025,
              and a 2026 self-service push that materially expanded integrations and reduced merchant onboarding
              friction. The risk for diligence is over-crediting the AI narrative. Loggi likely does have a meaningful
              optimization layer, and the public pages do reveal some routing inputs, but the reviewed evidence does not
              provide an independently benchmarked routing moat or a clean proof that service outcomes beat conventional
              carriers on a like-for-like basis. Underwriting should therefore anchor on workflow advantage and network
              design, while discounting unverified AI-superiority claims.
