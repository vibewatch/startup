  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Public evidence supports a real mixed customer base for Loggi in 2026: the official site sells to self-serve merchants, expanding businesses, and large enterprises, while VEJA says the company serves more than 20,000 online stores and Bloomberg says the new PUDO/SMB motion is growing quickly. The strongest current proof is channel-based rather than logo-based—Shopify and Nuvemshop onboarding, LoggiPonto activation, and merchant workflow automation—while named enterprise customer proof is mostly directory-level or management-quoted rather than fresh co-signed case-study evidence. Durability is therefore supported by embedded tracking and onboarding surfaces but weakened by negative Shopify app reviews, heavy Reclame Aqui complaint volume, and the absence of public NRR, churn, or top-customer concentration metrics."
  },
