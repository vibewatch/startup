    {
      "id": "acquisition-channels-and-activation",
      "title": "Acquisition channels and activation surfaces",
      "body": "Loggi’s current customer-acquisition motion is heavily channel-driven. Official Shopify documentation shows a concrete merchant workflow: install the Loggi app, authenticate the account, choose collection or drop-off mode, surface Loggi in checkout, generate labels, and follow tracking status from the admin panel. The Shopify partnership announcement adds that the integration was intended to give small and medium businesses more autonomy with no extra app cost. On the SMB side, the Nuvemshop + LoggiPonto rollout is the clearest current expansion channel. Multiple June 2025 sources say merchants and larger online brands can activate Loggi inside the Nuvemshop panel without individual contracts or minimum volume, use pickup-and-drop-off points in 93 cities, and keep labels and tracking inside the same workflow. Bloomberg adds an important behavioral lesson: Loggi initially expected SMBs to prefer home pickup, then pivoted toward PUDO after learning many small merchants wanted to fit drop-off into their routine. That combination makes LoggiPonto and platform integrations the strongest evidence-backed acquisition loop in this chapter.",
