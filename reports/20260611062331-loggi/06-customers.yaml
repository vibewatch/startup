    {
      "id": "customer-base-and-segment-mix",
      "title": "Customer base and segment mix",
      "body": "Current public evidence shows Loggi is not a single-segment carrier. The official homepage explicitly markets the service to broad self-serve shippers, growing businesses, and industries or large businesses, and says the network connects with any size of company. Bloomberg’s 2024 CEO interview sharpens that segmentation: management distinguishes the very large retailer sending 100 thousand packages per day from the seller sending 100 packages or fewer, and says the company now serves large platforms, SMBs, and even individuals in one integrated operation. VEJA supplies the clearest current volume proxy, reporting that Loggi serves more than 20 thousand online stores in Brazil. That supports a 20k-plus customer-base claim, but not the stronger 22k-plus figure sometimes repeated in startup databases or commentary. The safe conclusion is that Loggi has a mixed enterprise-plus-long-tail base; the unsafe conclusion is any precise segment revenue split, because public sources do not disclose how many active accounts are enterprise, SMB, marketplace-adjacent, or dormant.",
