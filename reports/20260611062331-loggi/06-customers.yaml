    {
      "id": "named-customer-proof-vs-inference",
      "title": "Named customer proof versus marketplace inference",
      "body": "Named-customer proof is much thinner than channel proof. The only retained source in this chapter that explicitly lists enterprise logos is Tracxn, which names Google, Samsung, Mercado Livre, McDonald’s, and Pizza Hut as corporate clients. Bloomberg adds a management quote that Loggi is known for serving very large retailers including Mercado Livre, Amazon, Shein, and Shopee. Those are meaningful signals, but they are not equivalent to dated, co-signed customer references that prove current production scope, outcomes, or renewals. That distinction matters most for the user-specified names. Within the retained set, Magazine Luiza, Via, and Americanas appear only as major marketplaces in broader Brazil e-commerce market context, not as verified Loggi customers. Shein and Shopee have a company-sourced mention in Bloomberg, but not direct current proof. Mercado Livre has the strongest relationship signal because it appears in the Tracxn client list and later shows up in 2026 asset-transfer coverage, yet even there the evidence proves a live commercial relationship more clearly than a fresh shipping deployment. The underwriting takeaway is that direct named-customer proof remains materially weaker than platform or cohort proof.",
