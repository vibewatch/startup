      "id": "durability-support-quality-and-concentration",
      "title": "Durability, support quality, and concentration disclosure gaps",
      "body": "Durability evidence is mixed rather than cleanly positive or negative. The positive side is operational: official Shopify materials and the Nuvemshop rollout both promise embedded tracking, automated status updates, label generation, and simplified support flows inside merchant tooling, while partner articles cite a 99.01% successful-delivery rate on more than 12 thousand LoggiPonto packages in May 2025. The negative side is equally concrete. The Shopify app listing shows a 1.0 overall rating from six reviews, and Reclame Aqui reports 22,010 complaints in the December 2025 to May 2026 window, only 40% of reviewed consumers willing to do business again, 63.1% resolution, and nearly eight-day average response times. Individual complaints cite sellers removing Loggi from shipping options, inconsistent tracking status, and confirmed package loss. That means customer-support and tracking quality clearly matter as a retention lever, but current public signals do not prove that Loggi has stabilized them. The larger blind spot is disclosure: public sources still do not provide NRR, GRR, churn cohorts, renewal terms, or top-customer concentration, so large-client dependence remains a real but unquantified risk.",
