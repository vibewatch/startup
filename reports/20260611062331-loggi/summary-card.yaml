  topStrengths:
    - >-
      Public evidence supports real national operating scale, including 20k+ online stores, 5k+ municipalities, and
      roughly 500k daily packages.
    - >-
      Loggi is more software-native than many parcel peers, with merchant integrations, APIs, tracking/webhook
      infrastructure, and a growing LoggiPonto network that lowers SMB adoption friction.
    - >-
      Management is now focused on pricing discipline, density, and breakeven rather than growth-at-all-costs, which
      fits the economics of Brazilian last-mile logistics.
    - >-
      The company still appears strategically relevant to major merchants and marketplaces, giving it a credible
      platform position rather than a purely local courier profile.
  topRisks:
    - >-
      The old ~US$2B private valuation anchor looks difficult to justify from public evidence when logistics comps trade
      on lower revenue multiples and Loggi still withholds core margin and cash data.
    - >-
      Financial disclosure remains too thin to underwrite profitability with confidence: public sources do not reconcile
      gross margin, cash balance, burn, runway, debt-like obligations, or cap-table terms.
    - >-
      Labor classification exposure, leadership reshuffles, and incomplete governance disclosure create material
      execution and downside risk during a period when the company is pushing for breakeven.
    - >-
      Public service-quality signals remain mixed, with heavy complaint volume and poor app-review surfaces that could
      weaken retention or force pricing concessions.
    - >-
      Customer concentration and retention quality remain unquantified even though large-platform relationships likely
      matter to route density and economics.
  unresolvedGaps:
    - >-
      Audited or management-reconciled financials covering net revenue, gross margin, EBITDA, operating cash flow, cash
      balance, and runway.
    - >-
      Current cap table, liquidation preferences, investor rights, and any verified secondary clearing price since the
      2021 financing.
    - Cohort retention, NRR/GRR, customer concentration, and unit economics by SMB versus large-account lanes.
    - >-
      Formal board composition, investor governance rights, and a cleaner founder/leadership map after the 2026
      operating reorganization.
    - >-
      A reconciled KPI pack for customer count, package throughput, pickup-point footprint, and realized progress toward
      the 2H26 breakeven target.
