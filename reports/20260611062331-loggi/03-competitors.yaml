- id: loggi-relative-positioning
  title: Loggi relative positioning and moat durability
  body: 'On the evidence retained in this chapter, Loggi’s strongest relative position is not universal network control but a merchant-facing software and orchestration layer: APIs for quote, shipment, labels, tracking, and pickup points; EDI; and no-code integrations through widely used commerce platforms. That stack makes the company more open and channel-agnostic than marketplace-owned logistics programs, and its courier-facing app supports a flexible, asset-light capacity model. Those are real strengths, especially for merchants that want parcel execution without committing all demand to Mercado Livre, Amazon, or a food-delivery app. But the same evidence also shows why the moat is not fully secure. NeoFeed frames the current phase around execution discipline and breakeven, not unconstrained expansion; Valor shows that platform-owned rivals are already repricing or subsidizing logistics in ways standalone operators cannot easily match; and the public pack still does not show realized
    pricing, route-level economics, or apples-to-apples SLA benchmarks. The honest conclusion is that Loggi looks differentiated and nationally relevant, but still pressured by stronger physical incumbency above it and stronger ecosystem lock-in around it.'
