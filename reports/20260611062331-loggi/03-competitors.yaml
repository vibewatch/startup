- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor
  - Public pricing / fee signal
  - Contract / access model
  - Included capabilities
  - Key unknown
  - Implication
  rows:
  - - Loggi
    - Next-day delivery starting from R$4 on public e-commerce page
    - Self-serve merchant onboarding plus commercial sales motion
    - Tracking, last-mile execution, merchant notifications
    - Realized tariffs, surcharges, and volume discounts are not public
    - Accessible teaser pricing helps SMB acquisition, but public margin inference is weak
  - - Correios SEDEX
    - Public calculators and parcel products exist, but retained pack does not pin a single reference tariff
    - Counter and contract flows
    - Tracking, indemnization, reverse logistics, collection options
    - Contract rates and merchant-specific discounts not retained here
    - Strong baseline utility, but price comparison remains incomplete in this chapter
  - - Mercado Envios Full
    - From Mar-2026, pricing becomes variable by weight, dimensions, and product price for key Full flows
    - Embedded in Mercado Livre seller economics
    - Storage, pick-pack-ship, marketplace-linked delivery promise
    - Merchant net price after marketplace subsidies remains opaque
    - Platform-owned logistics can reprice shipping strategically inside its ecosystem
  - - Amazon FBA Onsite
    - 50% logistics-fee promotion for products from R$79; free-shipping thresholds for Prime and non-Prime customers
    - Invite-only and restricted to Amazon sellers
    - Pickup, delivery, customer service, returns, Prime badge
    - Base tariffs vary by weight and origin and are not fully observable in retained public pack
    - Amazon can use logistics economics to strengthen seller lock-in and customer expectation
  - - iFood Básico
    - 12% commission + 3.2% payment fee + R$110 monthly threshold
    - Merchant handles delivery
    - Marketplace demand and order management
    - Actual off-platform delivery economics remain merchant-specific
    - Lower headline take rate, but logistics burden stays with the merchant
  - - iFood Entrega
    - 23% commission + 3.2% payment fee + R$150 monthly threshold
    - iFood partner-delivery model
    - Partner couriers, real-time tracking, delivery-time management
    - Contribution margin after subsidies is not public
    - Shows how merchants can outsource dense urban delivery without a parcel carrier contract
  - - Melhor Envio
    - Free platform; publicly claims negotiated discounts and rates up to 80% below balcão prices
    - No-contract shipping intermediation
    - Multi-carrier quotation, checkout, labels, posting points
    - Carrier-specific realized rate cards still depend on shipment profile
    - Compresses carrier differentiation by making price comparison easier for SMBs
  notes: This table mixes public list-price signals, commissions, and platform terms because realized merchant contracts are not public for most competitors. Unknowns are structural evidence gaps, not omissions.
