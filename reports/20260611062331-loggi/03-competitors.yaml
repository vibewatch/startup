  title: 'Main threat: platforms can subsidize logistics inside larger ecosystems'
  body: Mercado Envios, Amazon, and iFood can all make freight more competitive by pairing logistics with marketplace demand, Prime or super-app engagement, and broader post-sale economics that a standalone network cannot match as easily.
  claimRefs:
  - CP040
  - CP045
  - CP047
