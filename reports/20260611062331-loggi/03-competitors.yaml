  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pivot-timing
    missingEvidence: A dated management statement or archived strategy artifact that pins the consumer-to-B2B transition to a specific 2019-2020 milestone.
    whyItMatters: The retained pack supports the directional pivot but not a clean date, so narrative precision is weaker than the strategic conclusion.
    diligencePath: Ask Loggi for archived 2019-2020 strategy materials, press decks, or board updates that explicitly describe the shift in target customer and service mix.
    relatedQuestionRefs:
    - QP004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized merchant tariffs, discounts, fuel surcharges, and minimum-volume commitments across Loggi, Correios contracts, Amazon, Mercado Envios, Jadlog, and Total Express.
    whyItMatters: Public list-price and commission signals exist, but pricing power and contribution margin cannot be judged from teaser pages alone.
    diligencePath: Request anonymized current contracts, discount ladders, surcharge policies, and merchant cohort gross margins by parcel band.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: apples-to-apples-benchmarking
    missingEvidence: Comparable parcel volumes, on-time SLAs, failed-delivery rates, and corridor mix for Loggi, Correios, Mercado Envios, Amazon, Jadlog, and Total Express.
    whyItMatters: Without comparable benchmarks, “subscale” and “density edge” can be directionally true while still remaining under-specified for underwriting.
    diligencePath: Request corridor-level benchmark packs from management or a third-party parcel audit covering volume, SLA, and failure rates by competitor set.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
    - TP002
  - type: private-evidence-only
    severity: material
    topic: corridor-economics
    missingEvidence: Contribution margin, courier utilization, and retention by metro or lane versus marketplace-owned alternatives.
    whyItMatters: Competitive durability depends on whether Loggi’s integration and routing edge converts into superior unit economics in dense corridors, not just faster growth in public narratives.
    diligencePath: Request route-level unit economics, courier acceptance/utilization, and merchant retention by integration channel and corridor.
    relatedQuestionRefs:
    - QP019
    - QP020
