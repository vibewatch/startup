- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat source
  - Severity
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - Merchant integration stack
    - SMB enablers and platform APIs make carrier choice more modular
    - High
    - Loggi APIs and no-code integrations versus Melhor Envio aggregation and marketplace tooling
    - Software depth helps acquisition, but not necessarily long-term exclusivity
    - Request retention and wallet-share by integration partner cohort
  - - Dense tech-enabled execution
    - Amazon and iFood both document partner-based last-mile programs and dense delivery operations
    - High
    - Amazon Flex, Amazon hubs, iFood courier scale
    - Density edge is real but contested in the highest-volume corridors
    - Ask for metro- and corridor-level cost and SLA comparison versus Amazon/iFood alternatives
  - - Channel-agnostic proposition
    - Marketplace-owned logistics bind freight to demand and customer-service loops
    - High
    - Mercado Envios and Amazon logistics modes plus iFood/Uber super-app expansion
    - Standalone carriers can lose merchants even if freight quality is competitive
    - Quantify revenue exposure to marketplace-dependent seller cohorts
  - - Nationwide reach narrative
    - Correios and Jadlog define a stronger public ubiquity baseline
    - Medium-high
    - SEDEX and Correios systems; Jadlog franchise and municipality footprint
    - Coverage claims alone do not confer differentiation
    - Request on-time performance and failure-rate data outside core dense corridors
  - - Flexible partner capacity
    - Asset-light models help scale but can also expose service consistency under price pressure
    - Medium
    - Loggi courier flexibility, Amazon Flex, sector-wide margin strain
    - Flexibility is valuable only if quality remains stable as prices move
    - Ask for courier utilization, acceptance, and failed-delivery metrics by route type
  - - Pricing accessibility
    - Public teaser pricing is visible, but realized pricing is mostly private
    - High
    - Loggi teaser price, iFood plan economics, Amazon promo, Mercado Envios repricing
    - Price power is the least-verifiable part of the thesis
    - Request anonymized contracts, surcharge policies, and margin by parcel band
  notes: Risk rows distinguish between a true moat and the specific competitor mechanism that can erode it. Severity reflects thesis impact, not bankruptcy risk.
