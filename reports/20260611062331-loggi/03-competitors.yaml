  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / reach signal
  - Merchant-facing model
  - Differentiation
  - Limitation / apples-to-oranges note
  rows:
  - - Loggi
    - Direct B2B parcel / last-mile
    - Publicly relevant national network; 10% share claim in 2026 coverage but no apples-to-apples benchmark pack
    - Channel-agnostic APIs, no-code integrations, partner couriers
    - Tracking, merchant tooling, flexible capacity
    - Public realized pricing and corridor economics remain opaque
  - - Correios
    - National parcel incumbent
    - SEDEX, merchant systems, contract collection, universal baseline expectation
    - Counter plus contract parcel workflows
    - Broadest public baseline for national reach and reverse logistics
    - Legacy incumbent comparison is fair on parcel coverage but not on software openness
  - - Mercado Envios
    - Marketplace-owned logistics network
    - Own centers, agencies, growing land/air fleet, Full/Flex/Turbo modes
    - Logistics embedded inside Mercado Livre seller flows
    - Captive demand plus fulfillment control
    - Best viewed as ecosystem logistics, not a neutral carrier
  - - Amazon Logistics Brazil
    - Marketplace-owned fulfillment / last-mile network
    - 150 hubs and 100% municipality coverage claimed by Amazon in Brazil
    - FBA, FBA Onsite, DBA and Prime-linked shipping for Amazon sellers
    - Prime speed, customer service, fulfillment bundle
    - Access is channel-tied and some programs are invite-only
  - - Jadlog
    - National private parcel incumbent
    - 500+ franchises / units and ~5,000 municipalities
    - Pickup, SMB-facing units, reverse logistics
    - High physical capillarity for private parcel flows
    - Public pack shows less explicit API/no-code depth than Loggi
  - - Total Express
    - Retailer-contracted B2C fulfillment carrier
    - Large private logistics operator, but public support leans to corporate-client servicing
    - Corporate-contracted retail fulfillment
    - Important parcel contractor for large e-commerce flows
    - Not a self-serve SMB shipping stack in retained public evidence
  - - iFood Entrega
    - Hyperlocal logistics adjacency
    - 120M monthly orders ecosystem, 360k couriers, 1,500 cities
    - Dense urban merchant delivery, including off-app order channels
    - High-frequency urban courier density and off-platform merchant adjacency
    - Not a like-for-like national parcel and line-haul substitute
  - - Melhor Envio
    - SMB shipping enabler / aggregator
    - 3M merchants, 110M shipments intermediated, 14k posting points
    - Free rate-comparison and label platform across carriers
    - Reduces switching costs and makes freight more transparent for SMBs
    - Does not operate a national parcel network itself
  notes: Profile rows mix direct competitors with adjacent layers because Brazilian merchants can solve the same delivery problem through incumbents, marketplace-owned networks, hyperlocal apps, or aggregator software; this table labels the apples-to-oranges cases explicitly.
