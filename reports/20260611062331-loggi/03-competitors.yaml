- id: adjacent-networks-and-smb-enablers
  title: Adjacent networks and SMB shipping enablers
  body: 'The adjacent set matters because it changes merchant expectations even when it is not a one-for-one parcel substitute. iFood’s retained official pages show explicit pricing, partner-delivery economics, and off-platform order handling through Entrega Fácil; Business Wire and G1 add scale and super-app evidence via the Uber partnership. That makes iFood relevant wherever merchants care more about dense urban responsiveness, order-frequency, and channel blending than about national parcel coverage. Melhor Envio changes the game from another angle. Its official copy is unusually direct: the platform is free, contract-light, connected to multiple carriers and Correios, and built to compare rates, automate labels, and simplify checkout freight. In practice, that means Melhor Envio competes with Loggi less as a line-haul operator and more as a merchant decision layer that can steer volume toward whichever carrier wins on rate or convenience. Total Express belongs in the landscape too,
    but the public evidence suggests a more retailer-contracted B2C fulfillment role than a self-serve SMB shipping product. Together, these adjacencies make the market more modular and reduce the chance that merchant loyalty rests on freight alone.'
