  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founders
    missingEvidence: A current official founder roster that explicitly lists every cofounder and clarifies whether Eduardo Wexler remains part of the canonical founding set.
    whyItMatters: Founder identity is reused across later governance and key-person analysis, and the retained public record is not fully consistent.
    diligencePath: Request the current corporate history or cap-table summary from management and reconcile it against archived unicorn-era coverage.
    relatedQuestionRefs:
    - QO007
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster plus investor governance rights after the 2021 round and 2026 leadership reset.
    whyItMatters: Public reporting surfaces Marcel Arins and CapSur influence, but not the full decision-making structure or board independence.
    diligencePath: Request the latest board list, committee structure, shareholder rights summary, and any observer arrangements tied to CapSur or other investors.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: A dated management KPI pack reconciling current customer count, package throughput, courier count, and municipal reach.
    whyItMatters: Retained sources show 300k versus 500k daily packages and 20k versus 22k customers, which affects maturity and execution judgments.
    diligencePath: Ask for the latest monthly operating dashboard with definitions for customers, municipalities served, daily packages, and active couriers.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: An exact total-raised figure, any debt or credit facilities, and ownership stakes after the 2024 secondary exploration.
    whyItMatters: Public sources disagree on lifetime capital raised and do not disclose dilution, secondaries completed, or leverage.
    diligencePath: Request the financing history ledger, current cap table, debt schedule, and any completed or abandoned secondary process materials.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology
    missingEvidence: A management-verified chronology that dates internal product launches, network-asset openings, and any completed secondary transaction outcomes not captured in public reporting.
    whyItMatters: The milestone table clears the public chronology bar, but its partial coverage means some internal or unpublished milestones may still be missing from the record.
    diligencePath: Request a board or investor update deck with the internal operating timeline and reconcile any private milestones against the public sequence already documented here.
    relatedTableRefs:
    - TO004
