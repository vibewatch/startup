- id: founders-leadership-governance
  title: Founders, leadership resets, and governance visibility
  body: The cleanest founder story in current sources centers on Fabien Mendez and Arthur Debert, but the historical record is not perfectly tidy. Recent media and investor pages consistently identify those two as the core founders, while a 2019 unicorn-era retrospective also pictured Eduardo Wexler alongside them, which means later chapters should not treat the founder roster as unanimously settled without management confirmation. Leadership chronology is stronger. Reuters- and Bloomberg-syndicated 2022 coverage says Thibaud Lecuyer replaced Fabien Mendez as CEO during a 15% workforce reduction, with Mendez moving to chairman or executive chairman. In 2024, Viviane Sales arrived in a commercial and operating leadership role; in January 2026 she was elevated to CEO; and within months NeoFeed reported another restructuring that installed Rafael Szarf as president with a sharper operations-and-sustainability mandate while Marcel Arins and the board moved closer to day-to-day oversight. The
    implication is clear key-person and governance concentration, but not a clearly disclosed board architecture.
