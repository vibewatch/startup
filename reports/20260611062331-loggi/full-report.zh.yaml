        title: 融资历史、投资方基础与股权信号
        blocks:
          - type: paragraph
            body: >-
              Loggi 的资本历史足以为后续估值工作提供锚点，尽管累计融资和持股比例仍不精确。公司在 2019 年 6 月约 US$150 million
              的融资中成为独角兽，SoftBank、Microsoft、GGV、Fifth Wall 和 VELT 在公开报道中反复出现。下一步是 2021 年 3 月轮：R$1.15 billion，约 US$205
              million，由 CapSur 领投，Verde 参投，Monashees、SoftBank、Microsoft、GGV 等老股东回归。围绕该轮融资的公开报道普遍把估值放在接近 US$2
              billion，数据库式来源后来估计约 US$2.2 billion；审慎综合应写为该轮对 Loggi 的估值约 US$2 billion。随后，Bloomberg 转发的 2024
              年报道给出一个重要股权信号：据报道，Citi 正在协助探索向亚洲投资者出售私募股权，IPO 可选性在背景中保留。这说明至少部分投资者在规划流动性，但并不等于已披露完成交易或股权结构结果。
