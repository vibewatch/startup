        blocks:
          - type: paragraph
            body: >-
              最强的公开 GTM 和单位经济性证据来自 Loggi 的 SME 推进和定价基础设施。Época Negócios 报道称，在自动化之前，小商户入驻最长可能需要 30
              天，因为流程需要商务谈判、手工生成代码和测试；自助式重设计之后，超过 40 个平台接入更自动化的旅程。据报道，新渠道已经每月运送约 100 thousand 个包裹，带来约 R$3 million
              增量月收入，留存约 80% 的获客，并计划在 2026 年继续扩张。Open Pricer 还给出另一个重要信号：Loggi 称公司正从简单成本加成模型，转向面向具体客户、API
              驱动的定价，以缩短报价时间和销售周期。这些都是实在的效率杠杆，但还不是完整单位经济性披露。它们表明，定价纪律、更快入驻和渠道自动化可以提升销售生产率和路线质量；但没有公开来源展示
              CAC、回本周期、按队列流失、按线路贡献利润率，或折扣后商户盈利性。结果是代理指标丰富，却仍不足以承销。
