companyProfile:
  summary: >-
    Loggi 是一家创立于 2013 年、总部在 São Paulo 的巴西 logtech，早期从城市跑腿服务起步，已长成面向商户的全国包裹和最后一公里平台。公开记录支持其真实运营分量：服务超过 20,000 家线上店铺，覆盖超过
    5,000 个市镇，2026 年管理层叙事称每日约 500,000 个包裹，并围绕集成、API、追踪和 LoggiPonto 取送点搭出软件驱动的商户工作流。核心投资问题已不再是公司是否真实、是否有战略价值；而是一个仍锚定旧有约
    US$2B 私募估值的业务，能否在财务披露有限、劳工和治理压力未消、公开服务质量信号混杂的情况下支撑溢价。
