chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品边界与运营姿态
        blocks:
          - type: paragraph
            body: >-
              Loggi 的公开身份不是狭义跑腿应用，而是技术驱动的物流网络。其英文和葡语官网强调全国寄送、从首公里到最后一公里的履约、通过 SMS
              或电子邮件追踪，以及让卖家和市场平台外包配送复杂度、同时让收件人保持知情的集成能力。放在一起，Loggi 更适合被定义为一家后期私营巴西
              logtech，服务全国电商和其他企业发货方。当前最强的规模说法仍由管理层主导，未经审计，但仍重要，因为它勾勒出公司的运营野心：2026 年管理层叙事称客户超过 22,000 个、覆盖市镇超过 5,000
              个、每日包裹约 500,000 个；相比之下，Bloomberg 转发的 2024 年报道约为每日 300,000 个包裹。稳妥结论不是锁定某个精确吞吐数字，而是 Loggi
              已经明显走出城市即时配送小众市场，成为大型全国配送平台；下一阶段要证明的是执行纪律和盈利能力，而不是产品市场匹配。
