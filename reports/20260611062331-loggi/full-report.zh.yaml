  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算逻辑
        blocks:
          - type: paragraph
            body: >-
              评估 Loggi 时，应放在嵌套市场栈里，而不是套用一个过大的 TAM。最宽的背景是巴西线上零售需求，官方和行业来源把它放在 2025 年电商收入约 US$36 billion 到 2026
              年更宽口径电商市场估计 US$69 billion 之间。但这部分需求不会一比一流入配送收入，因为结账、支付和商品价值都位于物流服务上游。更窄的服务层是快递、即时、包裹和最后一公里配送；2026
              年公开估计指向的是低个位数十亿美元市场，而不是完整 GMV 池。实际后果是，Loggi 的可服务市场最好定义为面向需要全国覆盖和高密度城市履约的企业客户，提供外包商户包裹与最后一公里执行。这个框架让
              TAM、SAM 和 SOM 内部一致，也解释了为什么 10% 份额说法可以和远小于巴西总电商支出的服务分母并存。
