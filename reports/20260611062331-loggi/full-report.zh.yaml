      - number: '8.3'
        title: 除非 Loggi 证明自己值得远高于物流常规的溢价，上市可比公司要求谨慎
        blocks:
          - type: paragraph
            body: >-
              最重要的估值纪律来自上市可比公司。J&T Express 和 JD Logistics 都说明，真正有规模的大型配送网络，在公开市场也可能以很低的收入倍数交易——J&T 大致低于 1x，JD 约为 0.3x
              EV/revenue。MercadoLibre 是显而易见的反例，但它是市场、电商金融、广告和物流混合平台，不是纯包裹承运商；即便如此，Yahoo 2026 年 6 月快照也显示其 EV/revenue 为
              2.75x，比物流可比公司更高，但仍不能给不透明的私募货运资产开空白支票。这让 Loggi 处在尴尬中间地带。它比普通承运商拥有更多技术、路线智能和平台杠杆，但披露质量和变现多元化远不及
              MercadoLibre。结果是情景区间很宽；基准情景应低于旧的 US$2 billion 标记，除非管理层证明盈亏平衡、持续拿份额，并证明定价纪律确实流入现金生成。
