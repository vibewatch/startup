  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与披露边界
        blocks:
          - type: paragraph
            body: >-
              Loggi
              的公开收入模型比其已报告财务结果更容易描述。官方页面展示了面向个人、电商商户和大型企业的多产品物流栈，由运费计算、平台集成、追踪和伙伴工作流支撑，而不是单一品类的跑腿产品。最具体的标价信号来自公开计算器和面向商户的页面：运费由距离、重量、尺寸、服务等级和保险等附加项塑造；部分自助服务还宣传起价，例如次日达
              R$4 起、LoggiPonto 发货 R$5.89
              起。未公开的内容同样重要。保留来源没有披露企业实际成交价、折扣阶梯、按服务划分的毛利率，或按揽收、投递和集成企业流程拆分的收入确认细节。因此，稳妥承销视角应把披露的标价机制与实际变现质量分开。今天只能间接讨论收入质量：Loggi
              清楚地通过货运交易和软件使能的发货工作流变现，但公开记录仍没有说明收入中高频企业合同与低客单自助商户运量各占多少。
