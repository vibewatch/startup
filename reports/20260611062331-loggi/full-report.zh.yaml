    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公共情景区间勾勒出：执行落地、部分落地或失速时，价值可能落在何处。
    approximationNotes: 区间只是示意性的企业价值锚点，来自上市可比公司、私募估值标记和执行风险，而不是经审计 DCF 输出。
