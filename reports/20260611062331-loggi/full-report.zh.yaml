  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 类型
      - 什么会改变判断
    rows:
      - - Loggi 的规模、客户触达和路线密度足够支撑其相对普通承运商的溢价。
        - 投资逻辑
        - 如果有证据显示货量密度恶化或客户集中度上升，规模溢价就会被削弱。
      - - 盈亏平衡、定价纪律和 SME 扩张，拼出了一条可持续现金生成的可信路径。
        - 投资逻辑
        - 如果 2026 年下半年盈亏平衡延后，或定价调整未能抬升现金生成，投资逻辑会迅速走弱。
      - - 从 2021 年到 2024 年流程，约 US$2B 的公开估值锚出人意料地稳定。
        - 投资逻辑
        - 若披露的 2025–2026 年老股交易低于该水平，估值锚会被下修。
      - - 上市物流可比公司的收入倍数，远低于陈旧独角兽估值所暗示的水平。
        - 反向逻辑
        - 只有经审计的利润率质量和可重复现金流，才能支撑忽略这种可比公司压力。
      - - 多轮裁员和劳工模式诉讼仍然支持给出执行折价。
        - 反向逻辑
        - 如果公司经历一段很长的稳定运营期，没有新的劳工冲击，也不再重置员工队伍，折价会缓和。
      - - 即便业务本身在改善，私营公司不透明仍会挡住精确回报测算。
        - 反向逻辑
        - 如果完整数据室提供股权结构表、利润率、现金流和留存，判断可能从继续研究转向可行动。
    notes: 每一行都写明一个承销论点，以及会推动建议变化的可观察条件，而不是重复公司质量叙事。
