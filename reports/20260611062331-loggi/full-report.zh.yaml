      - number: '2.3'
        title: 地理密度与巴西物流环境
        blocks:
          - type: paragraph
            body: >-
              巴西物流环境支持包裹增长，但在单位经济性上结构性吃力。公开来源一致指向东南部高度集中：货物流、最后一公里需求、仓库和数字购买力围绕 São Paulo
              及邻近走廊聚集。全国其他地区也重要，尤其是北部和东北部继续数字化；但密度更低、基础设施更弱，让全域覆盖更贵，也更难快速变现。道路依赖是主约束。官方和分析师来源描述的是一个仍由卡车运输支撑商业骨干的系统：车队老化、道路质量弱推高成本，基础设施投资不足持续让价值流出系统。高速公路特许经营管线和持续公共投资可以逐步改善条件，但这些项目是中期减压阀，不是立刻重置。对全国最后一公里平台而言，这意味着路线密度、走廊组合和轻资产编排，比单纯覆盖标题更重要。
