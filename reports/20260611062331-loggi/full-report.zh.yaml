        title: 创始人、领导层重置与治理能见度
        blocks:
          - type: paragraph
            body: >-
              当前来源中最清晰的创始人故事围绕 Fabien Mendez 和 Arthur Debert 展开，但历史记录并不完全整齐。近期媒体和投资方页面持续把这两人列为核心创始人；而 2019 年独角兽阶段的回顾也把
              Eduardo Wexler 与他们并列出现，因此后续章节不应在没有管理层确认的情况下，把创始人名单当作毫无争议。领导层时间线更扎实。Reuters 和 Bloomberg 转发的 2022 年报道称，在裁员
              15% 期间，Thibaud Lecuyer 接替 Fabien Mendez 出任 CEO，Mendez 转任董事长或执行董事长。2024 年，Viviane Sales 加入并担任商业与运营领导角色；2026
              年 1 月她升任 CEO；数月内 NeoFeed 又报道了一轮重组，Rafael Szarf 出任总裁，任务更聚焦运营与可持续性，Marcel Arins
              和董事会也更接近日常监督。结论很清楚：存在关键人物和治理集中度问题，但公开材料没有清晰披露董事会架构。
