      - number: '7.2'
        title: 盈利能力、定价与财务可持续性风险
        blocks:
          - type: paragraph
            body: >-
              财务风险不在于 Loggi 没有规模，而在于公司还在为激进的运营调整投入资金，同时试图把规模转成可持续现金生成。2022 年和 2023
              年裁员很关键，因为管理层多次把裁员同效率、可持续性挂钩，其中一次还直接指向公司的现金状况。Bloomberg 2024 年访谈显示公司确有改善——2023 年末 EBITDA
              转正、没有债务、账上有数亿雷亚尔现金——但这只是把公司带到一个更可信的起点。2026 年计划难度高得多。NeoFeed 和 Tecnologística 称，Loggi 希望在 2026
              年下半年达到盈亏平衡；同一管理团队还想把市场份额从 10% 翻到 20%，向运营和技术投入大约 R$100 million，并继续修补分拣和末端可视化。这是一道很紧的运营方程。Open Pricer
              自己发布的合作伙伴稿件反而放大了风险：竞争对手更激进，折扣需要更快做到个性化，Loggi 因此放弃成本加成定价。运输经济性本已承压，一旦执行出错，原本向好的 EBITDA 轨迹可能很快重新变成烧钱。
