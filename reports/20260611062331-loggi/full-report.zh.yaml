  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 私募估值锚点表面上仍指向同一个头部标记，但不能证明 2026 年出清价
        blocks:
          - type: paragraph
            body: >-
              公开估值叙事表面上异常稳定。Loggi 在 2019 年完成 US$150 million 融资后成为独角兽，2021 年初又完成新一轮融资，多家媒体把估值放在接近 US$2 billion。2024 年 1
              月，Bloomberg 报道的股权出售新闻称 Citigroup 正在协助探索战略选项和私下出售，同一个数字再次出现。但头部估值稳定，不等于当前出清价格已被证明。2024
              年报道描述的是一个过程，不是已披露的成交；PitchBook 当前资料也指向私募二级市场活动，而不是一轮新的定价新股融资。这意味着旧估值锚点仍可作为市场记忆参考，但如果没有交易证据或当前条款清单，不能把它当作
              2026 年完全验证过的公允价值标记。这个标记有信息量，但不能定案。
