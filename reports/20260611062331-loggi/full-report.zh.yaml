      - number: '1.4'
        title: 已记录里程碑与反向运营信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录一边是真正的全国规模建设，一边是有分量的运营压力。到 2019 年末，法院报道文章称 Loggi 必须规范骑手劳动关系并缴纳罚款，凸显其重合同工网络带来的劳工模式风险。2024 年一篇回顾后来称该裁决在
              2021 年被推翻，因此公开记录指向法律波动，而不是一次完全坐实的败诉。运营上，公司也承受了多轮重组：2020 年约裁 120 人；2022 年 Lecuyer 接任 CEO 时裁员约 15%；2023 年初在
              2022 年更大规模裁员之后又裁 250 人。2021 年融资支持基础设施和技术扩张，目标指向覆盖全部人口；到 2026 年，管理层口径从不惜代价扩张转向盈亏平衡、R$1.5 billion 年收入目标和
              R$100 million 技术投入。NeoFeed 给出的超过 250 个网点、10 个交叉转运中心和超过 1,900 个 PUDO 点等足迹指标说明，尽管执行口径收紧，公司仍在相当大的实体规模上运营。
