  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 当前产品触点与客户工作流
        blocks:
          - type: paragraph
            body: >-
              阅读 Loggi 2026 年产品地图，最干净的方法是忽略部分旧简称，跟着当前客户触点走。现有导航围绕服务模式展开：带揽收的全国配送、本地配送、LoggiPonto 投递和平台集成。这意味着，“Loggi for
              Business” 更应理解为企业和商户栈的松散标签，而非当前独立 SKU；“Pacotes” 看起来更像已发出的包裹单位，而不是一个独立品牌产品。不过，Loggi Fácil 和 Loggi Expresso
              并不是已失效术语。它们仍有专门落地页，也继续出现在移动 app 文案中，因此应把它们视为更宽服务模式架构下保留的子品牌，而不是完全退役的名称。对 SME
              而言，工作流如今已经明显产品化：创建账户、连接商业平台或直接在 Loggi 面板操作、报价、选择上门揽收或
              LoggiPonto、打印或接收面单，并在同一栈中追踪包裹。产品之间的实际区别是待完成任务，而不是技术栈：Expresso 解决同城紧急需求；Fácil 解决全国包裹流；LoggiPonto
              去掉最低量门槛；企业触点则把同一网络打包成更高运量、更定制化的工作流。
