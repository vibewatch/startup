      - number: '5.2'
        title: 集成栈与运营模型
        blocks:
          - type: paragraph
            body: >-
              Loggi 最强的产品证据落在商户集成层，而不是深度公开架构披露。官方栈覆盖 REST API、EDI、无代码平台连接器，以及 WooCommerce、Shopify 等平台原生插件。API
              文档真实且范围不窄：认证、报价、创建发货、更新、取消、面单、追踪和 LoggiPonto 查询均已开放，并提供多语言示例代码。追踪也不只是泛泛的“追踪订单”营销语；文档明确建议用 webhook
              做实时监控，并发布细颗粒度事件分类，包含配送异常、遗失、盗窃和税务扣留。话虽如此，直接 API 使用并非完全自助。凭证仍需要商业或支持介入，帮助中心也称部分集成和后付费发货功能需要经过信用 /
              资料审核。实际看，Loggi 似乎优化的是混合栈：面向主流 SMB
              商业的低摩擦平台入驻，加上面向更高接触度商户和企业客户的门控直接集成路径。运营侧，官方页面反复称路由决策纳入成本、密度和目的地容量逻辑。具体程度足以说明路由引擎不是纯口号，但还不足以把 AI
              层当作独立验证过的能力。
