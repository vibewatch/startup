  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议沿着一条链条形成：从私募估值锚点，到执行证据、上市可比公司的估值纪律，再到披露缺口。
    approximationNotes: 这是分析逻辑图，不是公司运营流程图。
    claimRefs:
      - CV029
      - CV037
      - CV039
      - CV044
      - CV045
    data:
      nodes:
        - id: anchor
          label: 2019-2024 年公开锚点仍指向约 US$1B，再到约 US$2B
        - id: scale
          label: 真实规模：R$1.5B 收入声明、每天 500k 个包裹、22k+ 客户
        - id: execution
          label: 盈亏平衡 + 定价纪律或能支撑部分溢价
        - id: comps
          label: 上市物流可比公司交易倍数仍低得多
        - id: opacity
          label: 未公开股权结构表、利润率桥接或经审计现金流资料包
        - id: call
          label: 建议 = 继续研究；估值立场 = 偏高
      edges:
        - from: anchor
          to: scale
        - from: scale
          to: execution
        - from: execution
          to: comps
        - from: comps
          to: opacity
        - from: opacity
          to: call
