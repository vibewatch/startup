      - number: '3.2'
        title: 全国既有玩家与市场平台自有物流
        blocks:
          - type: paragraph
            body: >-
              Correios 仍定义巴西全国包裹服务基线，因为保留下来的官方材料显示，SEDEX 提供追踪、逆向物流、合同揽收、储物柜，以及 Correios Empresas 和 Pré-Postagem Nacional
              等商户工作流工具。Jadlog 是保留材料中最强的民营既有玩家对标，结合了广泛毛细网络、7,000 辆车和面向 SMB 的加盟单位。面对这些既有玩家，市场平台自有网络提出的是另一种挑战。Mercado
              Envios 公开记录多种运营模式——ME1、ME2、Full、Flex、Turbo、交叉转运和投递——这意味着它可以在部分流程里让卖家使用外部承运商，同时在其他流程里加强生态控制。Amazon
              更进一步，把市场平台需求、FBA、邀请制 FBA Onsite、Prime 服务承诺、售后处理，以及其称已覆盖巴西每个市镇的网络叠在一起。因此，Loggi
              的全国化叙事可信但仍显次规模：公开证据支持有意义的覆盖，但最大既有玩家和平台栈把实体物流与更强的自有需求、更宽的服务包结合起来，超过 Loggi 目前能在公开材料中证明的能力。
