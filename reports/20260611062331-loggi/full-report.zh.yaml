  - id: TV005
    title: 投资逻辑破裂与叫停触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 盈亏平衡拖到 2027 年仍未实现
        - 管理层不再预期 2026 年下半年盈亏平衡或经营现金生成
        - 拿掉了投资人为私募溢价估值辩护的主要条件
        - 把悲观情景拉近基准情景，并要求更低入场价。
      - - 又一次重大裁员
        - 经济性证明前出现新的大范围裁员
        - 暗示运营模式仍需要重置，才能维持偿付能力或效率
        - 提高风险折价，暂停任何激进入场。
      - - 劳工模式冲击
        - 骑手分类出现新的不利裁决或高成本和解
        - 抬高整个配送网络的单位成本不确定性
        - 更像给有法律敞口的物流运营商定价，而不是相信科技溢价故事。
      - - 尽调利润率疲弱
        - 毛利率或贡献利润率低于溢价估值所需水平
        - 表明收入规模没有转化为站得住的现金经济性
        - 向上市物流可比公司重估。
      - - 老股交易显著低于头部估值
        - 有文件记录的 2025–2026 年老股交易明显低于 US$2B
        - 使陈旧估值记忆无法继续作为主锚
        - 按观察到的价格重置承销判断，而不是按旧轮次头条估值。
    notes: 触发项被定义为会改变承销判断的尽调或市场事件，而不是叙事里已经计入的泛泛公司风险。
    claimRefs:
      - CV005
      - CV023
      - CV028
      - CV039
      - CV042
      - CV043
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和优先权
        - 当前所有权、期权池、清算优先权和任何老股转让权
        - 头条企业价值不等于普通股价值
        - 在 NDA 下索取律师背书的股权结构表和融资文件。
      - - 经审计财务桥
        - 2024–2026 年收入桥、毛利率、贡献利润率和现金流
        - 需要把盈亏平衡故事转成可投资的估值模型
        - 索取审计报表或董事会批准的管理账。
      - - 现金跑道和融资条款
        - 当前现金余额、任何债务或契约，以及最低流动性阈值
        - 决定公司能否在不再融资的情况下达到盈亏平衡
        - 索取资金管理包和融资协议。
      - - 客户质量
        - NRR / GRR、头部客户集中度和队列毛利
        - 显示规模是持久且高质量，还是只是体量大
        - 索取队列材料和账户集中度明细。
      - - 运营证明
        - 2024–2026 年修复后的准时交付、退货、密度和路线效率指标
        - 验证定价和路由改善是否真的在扩大利润率
        - 索取月度运营仪表盘和异常日志。
      - - 当前市场成交证据
        - 2025–2026 年任何已执行老股交易、投行指示价或战略条款清单
        - 区分叙事估值和真正可执行估值
        - 索取 Citigroup 材料或最新董事会融资更新。
    notes: 这些索取项按改变价格的能力排序，而不是按便利程度排序；每一项都直接影响当前估值是偏高，还是最终合理。
    claimRefs:
      - CV003
      - CV023
      - CV039
      - CV040
      - CV045
      - CV046
