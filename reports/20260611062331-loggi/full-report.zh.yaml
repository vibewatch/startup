            body: >-
              因此，盈利故事可信但尚未证明。正面看，Loggi 有多项可见杠杆，可以在不重启不惜代价增长的情况下改善经济性：自助 SME
              入驻降低商务摩擦，定价优化应提升报价质量和折扣纪律，路线选择明确由成本和密度驱动，LoggiPonto 以更低自有基础设施负担扩大触达。负面看，公开记录也显示 2020、2022、2023
              年反复裁员，以及围绕骑手是否应按雇员处理的持续劳动法挑战。这些事实对财务很重要，因为它们意味着公司反复需要再平衡成本结构，同时围绕核心运营投入仍有法律不确定性。同样重要的是，缺失指标恰好是投资者最需要的：现金余额、烧钱速度、现金跑道、毛利率、贡献利润率、实际成交价、债务义务和营运资本强度。管理层关于盈亏平衡的评论在方向上有用；但在这些数字向尽调方私下披露之前，正确判断是
