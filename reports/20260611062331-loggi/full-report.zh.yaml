  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 劳工、监管与数据合规风险
        blocks:
          - type: paragraph
            body: >-
              Loggi 最持久的反向压力，来自劳工法边界不清，加上平台工人待遇的公开治理披露仍然薄弱。TRT-2 的官方判决不是一句含混标题：它点明了 MPT 诉讼、案号、R$200 million
              的诉因金额，以及针对快递员就业、安全、保险和工时义务的请求。2019 年的独立媒体随后把风险界定为全国范围的正规化要求和高额罚款。相对地，Loggi
              法务负责人后来描述了一个更有利于承包商模式的结果，也公开承认争议可能继续上诉。投资人的实际解读不该是“案件已结”，也不是“案件致命”；而是快递员分类的法律基础已经在一场严肃公开诉讼中遭遇挑战，本章保留的材料里仍缺少最终上诉文件来彻底关账。Fairwork
              2025 年零分（满分十分）的评分重要，因为它说明工人治理担忧没有随着第一波诉讼消失。数据和运输合规又叠加第二层风险：Loggi 2026 年条款明确更新了文件要求和个人数据定义，而 ANPD
              仍是活跃执法机构，所以合规风险是现实问题，不是假设情景。
