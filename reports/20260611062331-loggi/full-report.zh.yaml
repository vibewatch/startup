  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局分层与不可简单对标的边界
        blocks:
          - type: paragraph
            body: >-
              巴西围绕 Loggi 的竞争图谱真实存在，但不是一张干净的承运商名单。Correios 和 Jadlog 是最清晰的全国包裹既有玩家，因为它们公开宣传全国揽收、配送和逆向物流基础设施。Mercado Envios
              和 Amazon 则不同：它们是嵌在商业生态里的物流系统，力量不仅来自货运执行，也来自履约、客服和卖家获取闭环。iFood
              又以另一种方式重要，因为它掌握高密度城市骑手需求，如今也触达平台外商户订单；但最强证据仍落在本地高频配送，而不是全国包裹干线运输。Melhor Envio
              是另一个不能简单横比的案例：它通过聚合承运商选择和议价费率降低切换成本，而不是自己运营全国包裹网络。实际含义是，Loggi
              不能只和一家传统承运商对标。它同时在对抗实体既有优势、平台锁定效应、超本地便利性预期，以及让运费更可比的 SMB 软件层。
