      - number: '7.3'
        title: 治理、领导层交接与披露风险
        blocks:
          - type: paragraph
            body: >-
              治理风险偏高，并不是因为有直接舞弊或丑闻证据，而是运营计划变得更吃力时，领导层和披露仍在流动。2026 年 1 月的报道把 Viviane Sales 定位为内部延续人选，她将推动 SMB
              增长和运营创新。但几个月内架构再次变化：Rafael Szarf 成为运营负责人，Marcel Arins 把战略、财务、法务和新业务拉近董事会，Viviane
              转为顾问角色。积极解读是经营控制更清晰；但这也意味着公司在证明盈亏平衡计划之前，一年内两次调整最高决策架构。公开披露质量无法抵消这项风险。保留的 Loggi
              官方页面都是商业界面——主页、条款和帮助页——不是投资人式治理披露。公司没有发布当前董事会名单、股东表、审计报表、烧钱桥表或头部客户集中度数据。即便信息量更强的 2024 年和 2026
              年访谈，也只是给出管理层筛选过的数字，不是完整风险包。对投资人来说，问题很简单：执行负担增加的速度，已经快过外部人士可用来检验管理深度和下行韧性的公开证据。
