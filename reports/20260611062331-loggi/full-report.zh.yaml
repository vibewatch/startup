      - number: '4.3'
        title: 资本强度与现金跑道含义
        blocks:
          - type: paragraph
            body: >-
              资本充足性是核心尽调问题，因为 Loggi 是私营公司，且仍以面向未来的口吻讨论可持续性。NeoFeed 2026 年 5 月访谈是当前最清晰的管理层披露：年收入约 R$1.5 billion，目标是在 2H26
              实现经营现金生成和盈亏平衡，年度 R&D 支出约 R$60 million，管理层计划 2026 年再投入 R$100 million
              到最后一公里和分拣技术。同一来源还称，公司未来两年不计划分红，已审视资产基础，并把 São Paulo 和 Rio 的两项业务卖给 Mercado Livre。O Globo 关于 LoggiPonto
              扩张的报道，是互补的资本强度信号：公司通过合作伙伴和包裹量分享经济性增加毛细网络，而不是只依靠自有基础设施。即便如此，现金充足性仍不透明。公开数据库对累计融资分歧很大，从约 US$295 million 到
              US$486 million，或超过 US$500 million；保留公开来源均未披露当前账面现金、月度烧钱、循环信贷或类债务义务。因此，盈亏平衡目标在分析上重要，但仍未经验证。
