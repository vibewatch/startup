      - number: '2.2'
        title: 买方分层与需求驱动
        blocks:
          - type: paragraph
            body: >-
              巴西包裹需求并不是同质的。Loggi 最契合的是必须把数字需求转成低摩擦配送的商户和市场平台：需要简单揽收和计费的 SMB 卖家，看重集成和 SLA
              稳定性的大型零售商与市场平台，以及越来越通过本地化库存降低摩擦的跨境或全渠道商户。2025–2026 年的商户行为显示，市场仍在增长，但选择更挑剔。NuvemCommerce 2026
              显示，商户现在比原始流量更关注转化和利润率；同时，自有店 D2C 经济性抬头，让履约质量更具战略意义。支付也关键：Pix 已成为 SME
              和电商结账行为的核心，改善现金流并降低支付摩擦。移动使用进一步放大这一效果，把需求扩展到不那么依赖桌面的群体。合在一起，这些驱动因素利好能把集成、可靠追踪和成本高效配送结合起来的物流平台，而不是只拼地理覆盖的玩家。
