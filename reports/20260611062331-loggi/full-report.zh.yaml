      - number: '8.2'
        title: 执行证据解释了为什么公司不是简单的低倍数物流资产
        blocks:
          - type: paragraph
            body: >-
              公开证据也解释了为什么不应把 Loggi 当作大宗货运或普通包裹公司。管理层现在谈的是 R$1.5 billion 年收入、2026 年下半年盈亏平衡，以及有意识地把份额从 10% 推向更接近
              20%。Bloomberg Línea 2024 年访谈补上一座有用的桥：Loggi 称自己在 2023 年末已实现 EBITDA 转正、没有债务，且仍持有数亿雷亚尔现金。运营上，公司规模仍足以产生影响——每天约
              500,000 个包裹、22,000 多名客户、通过数千个市镇覆盖全国，并借 LoggiPontos 和平台集成继续扩张 SME。Open Pricer
              定价合作尤其重要，因为它显示管理层在靠报价速度、折扣纪律和客户定制定价攻盈利，而不是只靠削成本。这些信号足以支撑一定私募溢价。但它们没有抹掉一个事实：盈利能力仍是管理层描述，而非独立披露。
