        - 包含电商平台和金融科技经济性，因此不是直接包裹可比公司。
    notes: 表格混合 Loggi 自身私募估值历史和公开市场参照点，因为没有业务组合和披露质量完全相同的巴西上市直接可比公司。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the main public and private valuation references that are both retained and decision-relevant for Loggi
        in 2026: its own disclosed financing marks, the 2024 secondary-process signal, and three public comparables
        spanning logistics-heavy to platform-heavy models.
