              推出是当前最清晰的扩张渠道。多家 2025 年 6 月来源称，商户和更大的线上品牌可以在 Nuvemshop 面板内启用 Loggi，无需单独合同或最低量；可在 93
              个城市使用取送点，并把面单和追踪留在同一工作流中。Bloomberg 补充了一个重要行为教训：Loggi 最初预计 SMB 会偏好上门揽收，后来发现许多小商户想把投递融入日常节奏，于是转向 PUDO。这个组合让
