      - number: '5.3'
        title: 网络控制、信任与服务质量
        blocks:
          - type: paragraph
            body: >-
              Loggi 的操作系统把数字商户层与仍在快速演进的实体网络结合起来。公开页面称每日包裹超过 500 thousand 个、10 个自有配送中心、数十个网点，以及 São Paulo 每日最多 1 million
              个包裹的分拣能力。取件点网络具有战略意义，因为它让 SME 低量模式跑得通；但这里也是公开记录最混乱的地方：当前消费者页面和集成页面称有 1,700+ 个点位，另一页官方企业页面仍写 1,200+，2025
              年新闻报道则描述计划在较小既有基础上新增 1,200 个点位。结论不是网络弱，而是公开版本控制弱。运营控制比安全姿态更具体。帮助中心发布揽收截止时间和免费 / 付费取件规则，transportadora
              页面宣传电子签收证明和骑手身份验证，隐私页面阐明 LGPD 权利、反欺诈用途和安全义务。但在已审阅材料中，仍没有公开的商户 / API 栈正常运行时间 SLA。服务质量也呈混合信号：产品功能丰富，但
              Reclame Aqui 上的反向消费者反馈仍有分量。
