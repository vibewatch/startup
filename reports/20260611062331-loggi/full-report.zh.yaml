      - number: '5.4'
        title: 差异化、成熟度与路线图
        blocks:
          - type: paragraph
            body: >-
              面对传统承运商，Loggi 最清晰的产品差异化不只是“更好的物流”，而是更软件原生的商户工作流。官方企业页面强调本地和全国流程集成、AI
              路由、平台连接、取件点密度、门店发货、逆向物流和专家支持。其中一些今天已经清楚产品化，尤其是商户入驻路径、平台连接器、追踪 / webhook 栈和 LoggiPonto
              经济性。另一些记录较浅。逆向物流、门店发货和 logistics fracionada 被点名，但公开实现深度很薄。公开证据中真正可见的路线图务实且偏运营：2023 年推出 Loggi Fácil，2024 年
              Agência 2.0，2025 年大规模扩张取件点，以及 2026 年自助服务推进，显著扩大集成并降低商户入驻摩擦。尽调风险在于高估 AI 叙事。Loggi
              很可能确实有有意义的优化层，公开页面也透露了部分路由输入；但已审阅证据没有给出独立基准测试的路由护城河，也没有干净证明在同口径下服务结果胜过传统承运商。因此，承销应锚定工作流优势和网络设计，同时折价处理未经验证的
              AI 优越性说法。
