      - number: '3.4'
        title: Loggi 相对定位与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              按本章保留证据看，Loggi 最强的相对位置不是普遍网络控制，而是面向商户的软件和编排层：报价、发货、面单、追踪、取件点
              API；EDI；以及通过常用商业平台提供无代码集成。这个栈让公司比市场平台自有物流项目更开放、更不依赖单一渠道；面向骑手的 app 也支撑灵活、轻资产的运力模型。对于不想把全部需求交给 Mercado
              Livre、Amazon 或外卖 app 的商户，这些优势真实存在。但同一批证据也解释了为什么护城河并不完全稳固。NeoFeed 把当前阶段框定为执行纪律和盈亏平衡，而非不受约束的扩张；Valor
              显示平台自有对手已经在重定价或补贴物流，独立运营商很难同样匹配；公开材料仍没有实现价格、路线级经济性或同口径 SLA 基准。诚实结论是，Loggi
              看起来有差异化、全国相关性也成立，但上方仍受更强实体既有玩家挤压，周围又受更强生态锁定效应压制。
