      - number: '7.4'
        title: 运营可靠性、竞争压力与依赖风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Loggi 跑的是一个庞大但仍脆弱的系统。官网声称覆盖全国，拥有 1,700 多个收集和配送点，以及 200,000
              多名合作快递员；规模有价值，但也制造了大量跟踪、路由和交接质量可能失灵的节点。负面评价界面显示，这些失灵已经可见。Reclame Aqui 仍显示投诉量高、解决水平中等，评价用户复购意愿只有
              40%；Shopify 应用页则出现一星评分和反复的 500 错误投诉。管理层显然意识到问题：NeoFeed
              称公司正在投资更好的路线软件、包裹状态可视化、分拣和退货追踪。竞争和伙伴依赖让问题更难，不是更容易。Loggi 现在嵌在约 50 到 60 个平台集成里，希望贴近 Amazon、Mercado Livre
              这类巨头，同时也暴露在这些巨头的垂直整合之下。Mercado Livre 2026 年收购 Loggi 在 Cajamar 和 São João de Meriti
              运营的两个站点，最清楚地体现了这种双重性：一个主要生态玩家可以同时是需求锚、运营标杆，也可以直接吸收战略物流产能。
