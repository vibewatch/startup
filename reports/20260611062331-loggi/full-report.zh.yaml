            body: >-
              当前公开证据显示，Loggi 不是单一客群承运商。官网首页明确把服务卖给广泛自助发货人、成长型企业、行业客户或大型企业，并称网络可连接任何规模公司。Bloomberg 2024 年 CEO
              访谈进一步细化了分层：管理层区分每天发送 100 thousand 个包裹的超大型零售商与发送 100 个或更少包裹的卖家，并称公司如今在一个集成运营中服务大型平台、SMB 甚至个人。VEJA
              给出当前最清楚的量级代理指标，报道 Loggi 服务巴西超过 20 thousand 家线上店铺。这支持 20k+ 客户基础说法，但不支持创业数据库或评论中有时重复的更强 22k+ 数字。稳妥结论是，Loggi
              拥有企业加长尾的混合基础；不稳妥结论是任何精确分层收入拆分，因为公开来源没有披露有多少活跃账户属于企业、SMB、市场平台相邻客户或休眠客户。
