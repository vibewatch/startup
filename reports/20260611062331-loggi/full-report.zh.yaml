      - number: '3.3'
        title: 相邻网络与 SMB 发货使能者
        blocks:
          - type: paragraph
            body: >-
              相邻玩家很重要，因为即便它们不是一比一的包裹替代品，也会改变商户预期。iFood 保留下来的官方页面展示了明确价格、合作伙伴配送经济性，以及通过 Entrega Fácil 处理平台外订单；Business
              Wire 和 G1 又通过 Uber 合作补充了规模和超级应用证据。因此，在商户更看重高密度城市响应、订单频次和渠道混合，而不是全国包裹覆盖的场景里，iFood 就有分量。Melhor Envio
              从另一个角度改变游戏。它的官方文案异常直接：平台免费、轻合同、连接多家承运商和 Correios，并用于比价、自动化面单和简化结账运费。实际效果是，Melhor Envio 与 Loggi
              的竞争更少像干线运营商之争，更多像商户决策层之争：它可以把运量导向费率或便利性最优的承运商。Total Express 也应放入格局，但公开证据更像是为零售商签约的 B2C 履约角色，而非自助式 SMB
              发货产品。合在一起，这些相邻层让市场更模块化，也降低了商户忠诚度只建立在货运本身上的概率。
