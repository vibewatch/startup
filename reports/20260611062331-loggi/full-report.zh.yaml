      - number: '2.4'
        title: 对 Loggi 的含义
        blocks:
          - type: paragraph
            body: >-
              在这样的市场结构里，Loggi 更像一个规模化 B2B 包裹和最后一公里编排商，而不是整个巴西物流市场的代理变量。管理层披露的数据点——每日 500 thousand 个包裹、超过 250
              个网点、交叉转运中心、PUDO 点，以及与 SME
              商业平台的广泛集成——支持真实运营分量。但这些数据也凸显分析陷阱：大的全国足迹说法，既解决不了市场份额分母问题，也解决不了长尾路线的单位经济性问题。公司自己的口径已经转向盈亏平衡、运营卓越和密度优化，这正是周边市场所要求的。如果市场继续奖励快速结算、可靠追踪和高密度城市履约，同时惩罚拥堵、柴油敞口和低密度路线，那么
              Loggi 的上行来自外包商户包裹流内的份额提升，而不是假装所有巴西物流支出都可争夺。这对投资逻辑有利，但精准 SOM 测算仍取决于公开市场没有披露的内部证据。
