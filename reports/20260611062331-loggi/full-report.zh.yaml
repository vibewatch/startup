        - label: 市场
          score: 4
          rationale: Brazilian e-commerce logistics still supports a scaled challenger with room to gain share.
          evidenceQuality: medium
        - label: 规模 / 证明
          score: 4
          rationale: Loggi has meaningful package volume, clients, integrations and private valuation persistence.
          evidenceQuality: medium
        - label: 执行
          score: 3
          rationale: Breakeven and pricing levers are plausible but not yet fully proven in audited numbers.
          evidenceQuality: medium
        - label: 经济性
          score: 2
          rationale: Positive EBITDA and cash claims exist, but gross margin and burn remain opaque.
          evidenceQuality: low
        - label: 披露质量
          score: 1
          rationale: No public cap table, waterfall, audited cash-flow pack or margin bridge.
          evidenceQuality: low
        - label: 风险
          score: 2
          rationale: Layoffs and labor-model risk still warrant a real discount.
          evidenceQuality: medium
        - label: 估值匹配度
          score: 2
          rationale: Current implied mark looks stretched against public logistics comps absent diligence upside.
          evidenceQuality: medium
