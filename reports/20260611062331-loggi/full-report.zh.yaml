      - number: '8.5'
        title: 什么会改变判断，什么会打破判断
        blocks:
          - type: paragraph
            body: >-
              剩余工作因此非常具体。如果尽调证明优先股堆叠清晰，确认 R$1.5 billion 收入基础拥有健康毛利率，并显示 2H26
              盈亏平衡无需再做一次重大重组就能实现，那么当前私募标记仍可被辩护为物流平台估值中的溢价情景。反过来，如果投资人发现利润率薄、客户留存弱、隐藏融资保护，或叙事与现金生成之间又出现缺口，那么公司就会更接近上市物流可比公司，而不是拥有持久软件化平台溢价的资产。关键不是继续抽象争论公司值多少钱，而是把注意力放到真正决定私募溢价是否成立的少数文件上。在这些材料出现之前，投资逻辑足够完整，值得跟踪；但还不足以支撑按旧头部估值坚定买入。
