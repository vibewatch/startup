      - CV029
      - CV041
      - CV042
      - CV043
      - CV044
    data:
      items:
        - label: 悲观
          low: 0.6
          mid: 0.8
          high: 1
          note: 盈亏平衡推迟；上市物流倍数主导估值。
        - label: 基准
          low: 1.2
          mid: 1.5
          high: 1.8
          note: 执行改善，但不透明度使其相对过时的私募估值标记仍需折价。
        - label: 乐观
          low: 2
          mid: 2.3
          high: 2.6
          note: 盈亏平衡落地，投资者仍接受私募平台故事的溢价。
        - label: 历史私募锚点
          low: 2
          mid: 2
          high: 2
          note: 2021 年融资轮和 2024 年流程参考点，并非已验证的 2026 年清算价格。
