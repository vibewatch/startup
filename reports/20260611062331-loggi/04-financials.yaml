    {
      "id": "capital-intensity-and-runway-implications",
      "title": "Capital intensity and runway implications",
      "body": "Capital adequacy is the central diligence issue because Loggi is private and still discussing sustainability in forward-looking terms. NeoFeed’s May 2026 interview is the clearest current management disclosure: annual revenue is around R$1.5 billion, the goal is to reach operating cash generation and breakeven in 2H26, annual R&D spend is about R$60 million, and management plans another R$100 million of 2026 investment in last-mile and sortation technology. That same source also says the company is not planning dividends for the next two years, has reviewed its asset base, and sold two operations in São Paulo and Rio to Mercado Livre. O Globo’s LoggiPonto expansion is the complementary capital-intensity signal: the company is adding capillarity through partners and package-volume-sharing economics instead of relying only on owned infrastructure. Even so, cash adequacy remains opaque. Public databases disagree sharply on lifetime capital raised, from about US$295 million to US$486 million or more than US$500 million, and none of the retained public sources discloses current cash on hand, monthly burn, revolvers, or debt-like obligations. That makes the breakeven target analytically important but still unverified.",
