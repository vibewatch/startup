  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Loggi’s public financial picture is still mostly management and database driven rather than disclosed, but the retained evidence is enough to frame the underwriting problem. The clearest disclosed operating signals are a management-stated R$1.5 billion annual revenue run, a 2H26 breakeven target, about R$60 million of annual R&D, and a R$100 million 2026 technology plan, while the strongest caution signals are repeated layoffs, labor-model litigation, and unresolved cash, burn, gross-margin, and runway gaps. The chapter’s main conclusion is that Loggi has credible efficiency levers—self-service SME onboarding, pricing automation, and asset-light LoggiPonto expansion—but profitability remains unverified until management provides a reconciled KPI pack and balance-sheet evidence."
  },
  "sections": [
    {
      "id": "revenue-model-and-disclosure-boundary",
      "title": "Revenue model and disclosure boundary",
      "body": "Loggi’s public revenue model is easier to describe than its reported financial outcomes. Official pages show a multi-product logistics stack aimed at people, e-commerce merchants, and larger businesses, supported by freight calculation, platform integrations, tracking, and partner workflows rather than a single monoline courier product. The most concrete list-pricing signals are on the public calculator and merchant-facing pages: freight is shaped by distance, weight, dimensions, service level, and add-ons such as insurance, while some self-serve offers advertise starting prices such as next-day delivery from R$4 or LoggiPonto shipping from R$5.89. What is not public is just as important. No retained source discloses realized enterprise pricing, discount ladders, gross margin by service, or revenue recognition detail by pickup, drop-off, and integrated enterprise flows. That means the safe underwriting view is to separate disclosed list-pricing mechanics from actual monetization quality. Revenue quality can only be discussed indirectly today: Loggi clearly monetizes freight transactions and software-enabled shipping workflows, but the public record still does not show what share comes from high-frequency enterprise contracts versus lower-ticket self-service merchant volume.",
