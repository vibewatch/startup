    {
      "id": "gtm-proxies-and-unit-economics",
      "title": "GTM proxies and unit-economics signals",
      "body": "The strongest public GTM and unit-economics evidence comes from Loggi’s SME push and pricing infrastructure. Época Negócios reported that before automation, onboarding a smaller merchant could take up to 30 days because the process required commercial negotiation, manual code generation, and testing; after the self-service redesign, more than 40 platforms were integrated into a more automated journey. That new channel reportedly already moves about 100 thousand packages per month, creates around R$3 million of incremental monthly revenue, retains roughly 80% of acquired customers, and is slated for further 2026 expansion. Open Pricer adds another important signal: Loggi says it is moving away from a simple cost-plus model toward customer-specific, API-driven pricing meant to cut quote time and shorten the sales cycle. These are real efficiency levers, but not a complete unit-economics disclosure. They suggest that pricing discipline, faster onboarding, and channel automation can improve sales productivity and route quality, yet no public source shows CAC, payback, churn by cohort, contribution margin by lane, or merchant profitability after discounts. The result is a proxy-rich but still non-underwritable picture.",
