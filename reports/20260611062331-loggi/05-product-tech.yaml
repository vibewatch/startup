  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Loggi’s product surface in 2026 is broader and messier than the legacy shorthand implies: the current site sells service modes—national collection/posting, local express, LoggiPonto drop-off, and platform integrations—while Loggi Fácil and Loggi Expresso still survive as live sub-brands on dedicated pages and in the mobile app. The strongest verified moat is workflow productization for SMEs and merchants (self-serve onboarding, 49 platform integrations, API/EDI/plugin coverage, and a fast-growing pickup network), not a fully disclosed AI stack or independently benchmarked service advantage over conventional carriers. Enterprise pages make strong AI-routing and network-capacity claims, but public evidence on exact point counts, API SLA, and AI performance remains incomplete or internally inconsistent."
  },
  "sections": [
    {
      "id": "current-surfaces-and-workflows",
      "title": "Current product surfaces and customer workflow",
      "body": "The cleanest way to read Loggi’s 2026 product map is to ignore some of the older shorthand and follow the live customer surfaces. Current navigation centers on service modes: national delivery with collection, local delivery, LoggiPonto drop-off, and platform integrations. That means “Loggi for Business” is better understood as a loose label for the enterprise and merchant stack rather than a current standalone SKU, while “Pacotes” appears more as the shipped unit than as a separate branded product. Loggi Fácil and Loggi Expresso are not dead terms, however. They still have dedicated landing pages and remain visible in the mobile app copy, so they should be treated as retained sub-brands inside a broader service-mode architecture rather than fully retired names. For an SME, the workflow is now meaningfully productized: create an account, connect a commerce platform or operate directly in the Loggi panel, quote freight, choose home collection or LoggiPonto, print or receive labels, and track the parcel through the same stack. The practical distinction across products is job-to-be-done, not technology stack: Expresso solves same-city urgency; Fácil solves national parcel flows; LoggiPonto removes minimum-volume friction; and the enterprise surfaces package the same network into higher-volume, more customized workflows.",
