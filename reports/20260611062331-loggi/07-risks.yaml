    {
      "id": "labor-regulatory-and-data-risk",
      "title": "Labor, regulatory, and data-compliance risk",
      "body": "Loggi’s most durable adverse overhang is the combination of labor-law ambiguity and still-thin public governance around platform-worker treatment. The official TRT-2 sentence is not a vague headline: it names the MPT action, the process number, the R$200 million cause value, and the requested employment, safety, insurance, and working-time obligations for couriers. Independent press coverage from 2019 then framed the exposure as nationwide formalization plus large fines. Against that, Loggi’s legal chief later described a contractor-friendly outcome and openly acknowledged the dispute might continue through appeals. The practical investor read is not “case closed” or “case fatal”; it is that the legal basis for courier classification has already been challenged in a serious public action and is still not cleanly closed by a retained final appellate document in this chapter. Fairwork’s 2025 zero-out-of-ten score matters because it shows that worker-governance concerns did not disappear with the first wave of litigation. Data and transport compliance add a second layer: Loggi’s 2026 terms explicitly update documentary requirements and personal-data definitions, while ANPD remains an active enforcement body, so compliance risk is live rather than hypothetical.",
