  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Loggi’s risk profile is dominated by compounding execution rather than a single fatal flaw: a still-unsettled labor/governance overhang, public service-quality weakness, and a financially tight plan to double share from 10% while reaching breakeven in 2026. The strongest adverse evidence is direct rather than theoretical—repeat layoffs tied to efficiency and cash, a major 2019 labor action with lingering ambiguity, heavy complaint volume, one-star Shopify reviews, and a 2026 leadership rewire occurring at the same time that Mercado Livre is absorbing Loggi-operated assets. Public mitigations exist, but disclosure on board structure, concentration, burn, and margin remains too thin to shrink residual risk below high."
  },
