    {
      "id": "governance-leadership-and-disclosure-risk",
      "title": "Governance, leadership-transition, and disclosure risk",
      "body": "Governance risk is elevated not because there is direct fraud or scandal evidence, but because leadership and disclosure remain fluid while the operating plan is getting more demanding. January 2026 coverage positioned Viviane Sales as an internal continuity choice who would push SMB growth and operational innovation. Within months, however, the structure changed again: Rafael Szarf became the operating head, Marcel Arins took strategy, finance, legal, and new business closer to the board, and Viviane shifted into an advisory role. That can be read positively as sharper operator control, but it also means the company altered its top decision architecture twice in one year before proving the breakeven plan. Public disclosure quality does not offset that risk. The retained official Loggi pages are commercial surfaces—homepages, terms, and help—not investor-style governance disclosures. They do not publish a current board list, shareholder table, audited statements, burn bridge, or top-customer concentration data. Even the stronger 2024 and 2026 interviews give management-selected numbers rather than a full risk pack. For an investor, that raises a simple problem: the execution burden is increasing faster than the public evidence base that would let outsiders test management depth and downside resilience.",
