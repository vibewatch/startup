      "id": "profitability-pricing-and-financial-sustainability-risk",
      "title": "Profitability, pricing, and financial-sustainability risk",
      "body": "The financial risk is not that Loggi lacks scale; it is that the company is trying to convert scale into sustainable cash generation while still funding aggressive operational change. The 2022 and 2023 layoffs are material because management repeatedly tied them to efficiency, sustainability, and in one case directly to the company’s cash situation. Bloomberg’s 2024 interview shows genuine improvement—positive EBITDA in late 2023, no debt, and hundreds of millions of reais in cash—but that only gets the company to a more credible starting point. The 2026 plan is much harder. NeoFeed and Tecnologística say Loggi wants breakeven in the second half of 2026, yet the same management team also wants to double market share from 10% to 20%, invest roughly R$100 million in operations and technology, and continue fixing sortation and last-mile visibility. That is a tight operating equation. Open Pricer’s own partner release sharpens the risk rather than reducing it: Loggi is abandoning cost-plus pricing because competitors are getting more aggressive and discounts need to be individualized faster. In a market where shipping economics are already under pressure, execution mistakes could quickly turn an encouraging EBITDA trajectory back into renewed cash burn.",
