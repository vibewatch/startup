      "id": "operational-reliability-competition-and-dependency-risk",
      "title": "Operational reliability, competitive pressure, and dependency risk",
      "body": "Operationally, Loggi is running a large and still-fragile system. The official site claims national coverage, more than 1,700 collection and distribution points, and more than 200,000 partner couriers; that scale is valuable, but it also creates many points where tracking, routing, and handoff quality can fail. The negative review surfaces show those failures are visible. Reclame Aqui still shows heavy complaint volume, middling resolution, and only 40% repurchase willingness among reviewing users, while the Shopify app page shows one-star ratings and repeated 500-error complaints. Management is clearly aware of the issue: NeoFeed says the company is investing in better route software, package-status visibility, sortation, and return tracking. Competitive and partner dependence make the problem harder, not easier. Loggi now sits inside roughly 50 to 60 platform integrations, wants to stay close to giants like Amazon and Mercado Livre, and is simultaneously exposed to those giants’ verticalization. Mercado Livre’s 2026 purchase of two Loggi-operated sites in Cajamar and São João de Meriti is the clearest symbol of this duality: a major ecosystem player can be a demand anchor, an operational benchmark, and a direct absorber of strategic logistics capacity all at once.",
