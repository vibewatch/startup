chapter:
  number: 6
  title: Customers
  summary: DayOne shows strong hyperscale, AI, and cloud demand through roughly 1GW of secured commitments, power-backed SIJORI campuses, and a named Firmus Batam AI-factory signal. The key diligence gap is not whether demand exists; it is customer-level concentration, signed lease quality, utilization, and retention evidence that remains private.
sections:
- id: who-pays-and-where
  title: Who pays, and where demand clusters
  body: 'DayOne’s publicly visible customer base is best understood by segment and geography rather than by logo list. The official positioning is hyperscale-first: DayOne says it builds for customers that need deployment speed, scale, and access to strategic underserved markets, while its Series C announcement ties roughly 1GW of secured commitments to AI and cloud infrastructure demand. The customer mix therefore appears weighted toward global hyperscalers, cloud platforms, AI-native GPU operators, and regulated enterprises that need either local Singapore compute or nearby overflow capacity. Geography matters to the customer thesis. Singapore provides scarce, policy-supported local compute; Johor offers Singapore-adjacent scale and direct connectivity; Batam supplies expansion power and land; Finland adds renewable European optionality. This segmentation is supportable, but the revenue mix is not: the retained sources do not disclose customer count, top-customer concentration, or segment revenue.'
