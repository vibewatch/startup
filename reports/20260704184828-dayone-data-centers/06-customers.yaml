  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof-table
    missingEvidence: Executed customer lease schedules, move-in certificates, and permissioned customer references by campus.
    whyItMatters: Public sources name only limited demand-side users, so production status and lease quality remain hard to underwrite.
    diligencePath: Request management-provided customer list, top-ten contract abstracts, and two live customer calls by geography.
    relatedQuestionRefs:
    - QU004
    - QU005
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, renewal rates, contract term distribution, SLA credits, and customer satisfaction survey data.
    whyItMatters: Retention evidence is required to distinguish durable hyperscale demand from one-time capacity reservations.
    diligencePath: Ask for cohort retention metrics, renewal pipeline, SLA-credit history, and customer health scores for all operating campuses.
    relatedQuestionRefs:
    - QU012
    - QU013
    - QU024
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer revenue shares, MW committed by customer, and segment-level revenue split.
    whyItMatters: The public 1GW commitment figure could still be concentrated in a small number of hyperscalers or AI customers.
    diligencePath: Obtain top-10 customer exposure by revenue, MW, contract term, credit rating, and cancellation rights.
    relatedQuestionRefs:
    - QU017
    - QU025
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: minor
    topic: Firmus-offtake
    missingEvidence: Primary executed offtake agreements and a DayOne/Firmus contract summary tying the 360MW project to DayOne economics.
    whyItMatters: Firmus demand is strong customer proof but public sources describe Firmus-NVIDIA economics more clearly than DayOne lease economics.
    diligencePath: Review Firmus lease/offtake documents, DayOne revenue-recognition treatment, and interparty responsibility matrix.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: service-quality
    missingEvidence: Site-level SLA uptime, outage logs, incident postmortems, customer support metrics, and maintenance windows.
    whyItMatters: AI-density campuses can face power and cooling resiliency risk even when no DayOne-specific outage is reported.
    diligencePath: Request three-year incident logs, SLA-credit reports, commissioning test results, and customer support ticket metrics.
    relatedQuestionRefs:
    - QU016
    - QU024
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: Named customer proof table public enumeration incomplete
    missingEvidence: A complete named customer roster with production/pilot status for each disclosed logo or counterparty.
    whyItMatters: Public evidence mixes one named demand-side user with partners and unnamed move-ins, limiting customer proof quality.
    diligencePath: Reconcile public logos, customer references, revenue contracts, and move-in dates in a management data room.
    relatedQuestionRefs:
    - QU004
    - QU005
    - QU024
    relatedTableRefs:
    - TU003
