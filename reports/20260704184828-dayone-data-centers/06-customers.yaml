- id: named-proof-and-ai-concentration
  title: Named proof is led by Firmus, while most customers remain unnamed
  body: 'Firmus is the clearest named customer-demand signal found in public sources. Tech Wire Asia and Certified Strategic report that Firmus will rent DayOne-built Batam capacity for a 360MW NVIDIA-backed AI factory, with up to 170,000 GPUs planned for delivery from 2027 into early 2028 and committed offtake claims in the tens of billions of dollars under the NVIDIA partnership. That proof matters because it links DayOne capacity to a specific AI-native use case rather than to generic hyperscale marketing. It also sharpens concentration risk: if one named AI infrastructure project becomes a large demand block, DayOne needs private evidence that economics, cancellation rights, power obligations, and customer diversification are robust. Beyond Firmus, public sources refer to HK1 customer move-in and secured commitments but generally omit tenant names and lease terms.'
  claimRefs:
