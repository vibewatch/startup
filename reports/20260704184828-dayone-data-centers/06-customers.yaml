- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Hyperscale and AI demand
    - Revenue could depend on a small number of cloud or AI anchor customers
    - Loss or delay of one anchor could impair utilization and financing visibility
    - Obtain customer-level MW, revenue, term, renewal, and credit exposure
  - - Firmus/NVIDIA Batam AI factory
    - Named proof may itself be a large concentrated demand block
    - Improves proof quality but can concentrate execution and counterparty exposure
    - Review DayOne-Firmus contract economics, termination rights, and power responsibility
  - - SIJORI cross-border corridor
    - Demand may cluster around Singapore-adjacent spillover and power constraints
    - Strong if Singapore remains constrained; weaker if latency, regulation, or connectivity fails
    - Test latency, data-residency, and customer workload placement by site
  - - Power-secured campuses
    - Power PPAs can convert demand to RFS capacity but delays threaten backlog quality
    - Phased power delivery can defer customer revenue or trigger penalties
    - Review PPA milestones, grid interconnection, and customer delivery obligations
  - - Rapid modular build model
    - Hyperscale partners may impose strict milestones
    - Construction or supply-chain delays can create SLA, penalty, or churn risk
    - Compare actual delivery vs committed RFS and customer acceptance tests
  - - Security and service-quality policy
    - Customer responsibility demarcations may complicate incident accountability
    - Ambiguous responsibility can weaken satisfaction or renewal if incidents occur
    - Review customer MSAs, incident logs, cyber insurance, and customer support history
  notes: Risk ratings are qualitative proxies because DayOne does not disclose revenue concentration or churn metrics.
