- id: commitments-and-capacity-quality
  title: Committed capacity and backlog quality
  body: 'The strongest public demand metric is the approximately 1GW of secured customer commitments cited in DayOne’s January 2026 financing materials and repeated by independent market coverage. Backlog quality improves where those commitments connect to enabling facts: Singapore SG1 has a 20MW Phase One RFS target in 2026 and a renewable-backed Sembcorp PPA; Batam has a 511MVA, roughly 450MW, PLN Batam power arrangement phased over 2026-2027; Johor has operating capacity and direct Singapore connectivity; Finland has 281MW across Lahti and Kouvola plus a larger Nurmijärvi option that remains approval-dependent. The important underwriting distinction is that capacity and power are not the same as revenue. Public evidence supports large demand and delivery intent, but the conversion from commitment to signed lease, fit-out, utilization, and renewal remains mostly private.'
