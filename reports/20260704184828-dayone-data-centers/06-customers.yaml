  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Public demand proof
  - Geography match
  - Strategic value
  - Gap
  rows:
  - - Global hyperscalers and cloud platforms
    - Infrastructure, capacity planning, and procurement teams
    - Company positioning around hyperscalers plus 1GW secured commitments
    - SIJORI, Singapore, Johor, Batam, Hong Kong, Tokyo, Finland
    - Large MW commitments and repeat-region expansion potential
    - Customer names and lease economics mostly undisclosed
  - - AI-native GPU cloud providers and model companies
    - AI infrastructure operators renting high-density space and buying GPUs
    - Firmus Batam 360MW / 170,000-GPU plan using DayOne-built facilities
    - Batam, with Singapore-adjacent connectivity
    - Creates named proof beyond generic hyperscaler logos
    - DayOne revenue share and Firmus lease terms undisclosed
  - - Singapore-regulated and latency-sensitive enterprises
    - Local sectors needing critical applications and compute locally
    - EDB/DISG quotes SG1 as enabling compute-intensive technologies and local critical services
    - Singapore SG1 and SIJORI spillover
    - Regulatory/locality reason to buy scarce Singapore capacity
    - Named enterprise customers not disclosed
  - - Cross-border Southeast Asia deployment teams
    - Cloud and AI customers optimizing land, power, latency, and ESG constraints
    - SIJORI official and DCPulse evidence for Singapore-Johor-Batam corridor
    - Singapore + Johor + Batam
    - Supports expansion without relying only on Singapore land/power
    - Needs latency, network, and contractual proof by workload
  - - European hyperscale and AI buyers
    - Customers prioritizing renewable energy, cool climate, and EU connectivity
    - Finland Lahti/Kouvola 281MW plus Nurmijärvi pipeline
    - Finland
    - Diversifies demand beyond APAC and supports sustainability-led procurement
    - No named European customer or signed lease disclosed
  - - Partner-enabled procurement and delivery ecosystem
    - Customers indirectly relying on power, R&D, grid, local and supplier partners
    - Sembcorp PPA, NUS R&D, PT PLN Batam PPA, Fortum grid planning, supplier ESG code
    - Singapore, Batam, Finland, supply chain
    - Improves probability that commitments convert to delivered capacity
    - Partner risk can become customer delivery risk
  notes: Segmentation is derived from public commitments, campus positioning, and the Firmus named-user evidence; revenue shares and customer counts are not disclosed.
