  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-run-rate
    missingEvidence: Audited DayOne revenue, annualized rent, EBITDA and gross margin by campus.
    whyItMatters: Capacity cannot be valued as revenue without utilization, rent and margin data.
    diligencePath: Request management financial statements and site-level revenue bridge under NDA.
    relatedQuestionRefs:
    - QI004
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: contracted-backlog
    missingEvidence: Signed customer backlog, MW commitments, price per kW, term, ramp schedule and cancellation rights.
    whyItMatters: The 1.5GW bookings signal cannot be underwritten without contract proof.
    diligencePath: Review customer MSAs, lease schedules and lender base-case bookings model.
    relatedQuestionRefs:
    - QI007
    - QI013
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: conflicting-data
    severity: material
    topic: capacity
    missingEvidence: Canonical campus-level capacity schedule reconciling Johor 390MW and over-478MW statements.
    whyItMatters: Revenue, capex and valuation scenarios are sensitive to MW in service versus planned or committed.
    diligencePath: Ask management for MW by campus split into built, RFS, operational, committed and utilized.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI005
    - TI006
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: Green financing, mezzanine and any corporate loan agreements including coupons, maturities, security and covenants.
    whyItMatters: Debt terms determine equity value, downside protection and refinancing risk.
    diligencePath: Obtain credit agreements, lender presentations and covenant model from company counsel or financing banks.
    relatedQuestionRefs:
    - QI010
    - QI022
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: minor
    topic: IPO-reporting
    missingEvidence: Accessible primary or high-quality independent source confirming IPO timing, exchange structure and valuation target.
    whyItMatters: IPO rumors are useful context but should not drive valuation without reliable access.
    diligencePath: Refresh Reuters/Financial Times/Bloomberg access or request company-approved IPO process materials.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, sales cycle, win rate, prelease conversion and customer acquisition cost by hyperscale segment.
    whyItMatters: GTM efficiency cannot be inferred from capacity announcements alone.
    diligencePath: Request sales pipeline conversion analysis and customer acquisition cost by region.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI005
