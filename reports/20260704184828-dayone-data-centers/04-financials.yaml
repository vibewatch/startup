- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Impact on underwriting
  - Current proxy
  - Severity
  - Exact diligence path
  rows:
  - - GAAP revenue and annualized rent
    - Cannot size current business or value revenue multiple
    - Capacity and customer move-in milestones
    - Blocking
    - Request audited revenue by month, site and customer segment
  - - Contracted backlog / bookings schedule
    - Cannot convert MW commitments into revenue timing
    - Secondary-source 1.5GW bookings claim
    - Blocking
    - Obtain signed contract waterfall with cancellation and ramp terms
  - - Customer concentration
    - Hyperscale demand can be concentrated in a few powerful buyers
    - No named customer list beyond generic hyperscaler language
    - Material
    - Request top-10 customer revenue, MW and remaining contract term
  - - Cash, burn and runway
    - Cannot judge whether Series C and debt cover committed build-out
    - Financing announcements only
    - Material
    - Request pro forma balance sheet, committed capex and monthly cash burn
  - - Debt terms and project-finance covenants
    - Debt capacity and downside control depend on collateral and covenants
    - Green and mezzanine facility headlines
    - Material
    - Review credit agreements, security packages and covenant model
  - - Canonical capacity by service status
    - Johor page conflicts between 390MW and over 478MW operational capacity
    - Official capacity pages and timeline
    - Material
    - Reconcile built, RFS, operational, committed and utilized MW by campus
  - - Power procurement economics
    - Power cost and interconnection timing can dominate margin and schedule
    - TNB MOU and market power-constraint reports
    - Material
    - Review PPAs, tariff contracts, backup-generation and grid-connection dates
  - - Gross margin and stabilized yield-on-cost
    - Cannot underwrite asset returns or valuation multiple
    - JLL capex benchmark and public REIT comps
    - Blocking
    - Request site-level EBITDA, total project cost and stabilized yield bridge
  notes: Every gap is paired with a diligence path because public sources are insufficient for full financial underwriting.
