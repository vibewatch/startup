company:
  name: DayOne Data Centers
chapter:
  number: 4
  title: Financials
  summary: 'DayOne has unusually strong capital and capacity signals for a private data-center platform: official sources show over US$2.0 billion of Series C equity financing, major green and mezzanine facilities, and hundreds of MW across Singapore-adjacent and international campuses. The public file is still not fully underwritable because revenue, contracted backlog, rent per kW, gross margin, cash, burn, debt terms and customer concentration remain undisclosed; the chapter therefore treats capacity and financing as proxies, not substitutes for management financials.'
sections:
- id: revenue-model-and-backlog-proxies
  title: Revenue Model and Backlog Proxies
  body: DayOne looks financially less like a software startup and more like a private hyperscale infrastructure platform whose economic engine is contracted power, space, cooling, connectivity and facility operations. The public record does not show an SKU card, take-rate schedule or GAAP revenue bridge. Instead, the strongest revenue signals are capacity, market placement and customer-intent proxies. DayOne's own materials frame the buyer as hyperscalers and enterprises that need speed, scale, latency and high-density AI infrastructure; GDS's public descriptions of outsourced data-center customers reinforce that this business is usually sold to cloud, internet, financial and telecom buyers under long-duration capacity agreements. For underwriting, the most important proxy is therefore not website traffic or customer count but committed megawatts and customer move-ins. The SIJORI strategy is financially meaningful because Singapore capacity is scarce and expensive while Johor and Batam offer expansion land, power and lower-cost operating environments close to Singapore. Still, no retained source discloses DayOne's contracted rent per kW, renewal terms, minimum commitments, pass-through
    power charges, customer concentration or backlog conversion schedule. The 1.5 GW bookings figure reported by Startup Fortune would be a major backlog signal if proven, but it remains a secondary-source claim until customer contracts, lender packages or management schedules corroborate it.
