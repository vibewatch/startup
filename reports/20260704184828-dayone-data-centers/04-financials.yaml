- id: capex-intensity-and-unit-economics
  title: Capex Intensity and Unit Economics
  body: 'DayOne''s public financial story is dominated by capital intensity. JLL''s 2026 forecast of $11.3 million per MW for shell-and-core construction, plus AI fit-out that can reach $25 million per MW, makes clear why DayOne is pairing equity with green financing, mezzanine facilities and likely project-level debt. The company may have a build-speed advantage: it claims one of the world''s largest modular solutions, up to 2,500 modules and 500 MW of annual fabrication capacity, and an 8.5-month greenfield delivery timeline for the Johor NTP project. It also claims more than 300 MW of liquid-cooled sites deployed since 2020 and pilots above 130 kW per cabinet using NVIDIA GB200 NVL72 systems. Those details matter because AI density turns cooling, power delivery and supply-chain control into direct margin drivers. However, the public file still does not disclose utilization, realized rent per kW, power pass-through margin, energy procurement cost, depreciation, maintenance capex, land basis, construction cost by campus or stabilized yield-on-cost. Public comps such as Digital Realty and Equinix disclose these categories in audited filings; DayOne does not. The best underwriting posture
    is therefore scenario-based: treat signed capacity as the revenue leading indicator, model construction and fit-out costs using market benchmarks, and require management to provide site-level development budgets and customer contracts before underwriting free cash flow.'
