      - number: '8.3'
        title: 'Comparable method: scarcity premium with imperfect public anchors'
        blocks:
          - type: paragraph
            body: >-
              The relevant comp set combines private APAC hyperscale M&A, listed global data-center platforms, and
              market data on power scarcity. AirTrunk is the closest strategic precedent because it was an APAC
              hyperscale platform with more than 800MW committed to customers and land for more than 1GW of future
              growth; its A$24 billion transaction validates that large pools of infrastructure capital will pay for
              scaled, power-and-land-secured growth. Public REITs provide disclosure discipline and market-cap anchors,
              but Equinix, Digital Realty, Iron Mountain, and GDS are not pure DayOne twins. The method should
              triangulate value per booked/committed MW, quality of power and land, customer credit and concentration,
              construction execution, and whether public markets will accept private-growth marks.
            claimRefs:
              - CV015
