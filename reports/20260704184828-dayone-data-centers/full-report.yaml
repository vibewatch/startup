    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      Public proof is strongest at market demand and committed-capacity stages, then thins at lease terms, utilization,
      and retention.
    data:
      items:
        - label: Market demand
          value: 100
          detail: AI/cloud demand, Singapore constraints, and sustainability procurement are well documented.
        - label: Secured commitments
          value: 80
          detail: Approximately 1GW customer commitments disclosed, but customer-level details private.
        - label: Power/RFS enabling
          value: 65
          detail: SG1, Batam PPA, Johor operations, and Finland projects support conversion.
        - label: Named deployment proof
          value: 35
          detail: Firmus Batam is strong; HK1 move-in is unnamed; most leases are not public.
        - label: Retention proof
