      - number: '7.4'
        title: Financing, IPO and customer concentration risk
        blocks:
          - type: paragraph
            body: >-
              DayOne’s reported financing story is both a strength and a risk amplifier. Large private rounds, reported
              IPO ambitions and possible multi-billion-dollar debt facilities can fund land, substations and cooling
              infrastructure, but they also expose the company to rate, listing-window, disclosure and valuation-reset
              risk. The most decision-useful public comparator is GDS’s own filing: it documents DayOne’s standalone
              status and committed/billable IT power, while also showing the concentration and pricing-leverage risks
              inherent in hyperscale data-center models. DayOne’s exact customer concentration is not publicly disclosed
              in the retained sources; therefore, concentration, contract termination rights, billing ramp and
              top-customer credit should be treated as a diligence blocker before relying on bookings or valuation
              marks.
