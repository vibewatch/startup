  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: powered hyperscale capacity, not a generic IT TAM'
        blocks:
          - type: paragraph
            body: >-
              DayOne should be underwritten against the market for powered, networked, AI-ready data-center campuses
              sold to hyperscale cloud, AI infrastructure and large enterprise buyers, rather than against a loose
              digital-transformation TAM. The included spend is wholesale colocation capacity, powered shell or
              build-to-suit campus capacity, interconnection, high-density cooling and site-level energy integration.
              Excluded spend includes customer-owned GPUs and servers, cloud software revenue, consumer connectivity and
              general IT outsourcing. This boundary matters because DayOne’s own pitch is not a software workflow but a
              geography-and-power platform: it clusters Singapore, Johor and Batam into SIJORI and adds Thailand, Tokyo,
              Hong Kong and Finland as capacity nodes. The market is therefore large, but adoption is gated by power
              delivery, land, permits, cooling, latency and customer precommitments rather than by simple software
              adoption curves. The practical underwriting frame is therefore a constrained infrastructure market:
              customers may want cloud capacity everywhere, but DayOne only earns attractive returns where it can
              convert site control, grid access and latency into contracted capacity faster than peers.
            claimRefs:
              - CM001
              - CM012
