chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Footprint
        blocks:
          - type: paragraph
            body: >-
              DayOne Data Centers is best understood as a private, Singapore-headquartered hyperscale data center
              platform rather than a conventional colocation operator with a single-market footprint. The company says
              it was established in 2022 and develops next-generation, high-capacity, AI-ready campuses for global
              hyperscalers and enterprises. Its differentiator is a market-creation model: DayOne describes a
              proprietary SIJORI hub-and-spoke corridor that links Singapore's connectivity with Johor's cost and land
              advantages and Batam's expansion capacity. Official market pages show a broader platform spanning
              Singapore, Johor, Batam, Hong Kong, Tokyo, Greater Bangkok and Finland; the June 2026 final Series C
              release added Spain to the disclosed operation-or-development list. The business model is therefore a
              capital-intensive capacity-origination platform: secure land, power and permits ahead of demand, package
              the campuses as high-density AI-ready supply, and convert scarce regional capacity into long-term bookings
              from hyperscale customers. The strongest public support is for identity, markets and product architecture;
              named customers, revenue and precise utilization are not public.
