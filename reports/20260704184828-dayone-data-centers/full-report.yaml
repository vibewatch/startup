      - number: '2.2'
        title: 'Demand and sizing: AI creates a supercycle, but the usable SAM is power-constrained'
        blocks:
          - type: paragraph
            body: >-
              The strongest market evidence is the convergence of three independent signals: JLL’s 2026 outlook calls
              for roughly 100 GW of new capacity between 2026 and 2030, CBRE reports tight vacancy and persistent
              preleasing in major hubs, and the IEA says data-centre, AI and crypto electricity use could double by
              2026. For DayOne, the broad TAM is global hyperscale and colocation capacity, while the practical SAM is
              APAC plus selected European markets where the company can secure power, land and permits. APAC is
              particularly relevant: JLL forecasts regional capacity rising from 32 GW to 57 GW by 2030, and CBRE
              identifies Tokyo, Johor and Batam as positioned for AI-related demand or spillover transactions. The
              attractive feature is scarcity value in powered sites; the adverse feature is that every credible
              competitor is chasing the same bottleneck. The chapter deliberately avoids a single headline TAM because
              broad forecasts can overstate opportunity when interconnection queues, substation lead times and customer
              fit-out budgets determine which megawatts become revenue-bearing supply.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
