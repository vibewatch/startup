      - number: '7.3'
        title: Hydrogen/SOFC, supply chain and ESG claims risk
        blocks:
          - type: paragraph
            body: >-
              The SOFC strategy is credible enough to monitor but too early to underwrite as a solved decarbonization
              pathway. DOE and Bloom support the technical proposition that fuel cells can deliver efficient onsite
              power, yet hydrogen’s climate value turns on production pathway and delivered fuel availability; DOE’s
              statement that most hydrogen is produced from natural-gas reforming makes fuel-source proof a diligence
              gate. DayOne’s sustainability roadmap includes renewable PPAs and 2030 targets, but the inaugural
              sustainability report is scheduled for 2026, so investors still need audited site-level PUE, WUE,
              renewable-matching, emissions and waste-heat evidence. Supplier controls reduce construction and
              compliance risk, but the supplier code itself shows that audits, sanctions, export-control and
              environmental evidence will have to scale with the build program.
