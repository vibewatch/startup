      - number: '1.4'
        title: Infrastructure Partnerships and Regulatory Exposure
        blocks:
          - type: paragraph
            body: >-
              The operating story is increasingly about whether DayOne can convert scarce land and power into delivered
              megawatts faster than competitors. Data Center Dynamics reported more than 500MW in service and under
              construction and more than 500MW held for future development, while DayOne's own journey cites NTP Johor,
              HK1 customer move-in, SG1 groundbreaking, Chonburi Tech Park, Tokyo phase one and 34MW at Nongsa Digital
              Park in Batam. In Malaysia, DayOne signed renewable-energy supply agreements with TNB entities covering
              roughly 1.5GWp of solar and 2.2GWh of battery storage and reported more than 1GW of renewable energy
              secured through the TNB partnership. Indonesia is emerging as both a DayOne market and a partner
              ecosystem: independent reporting describes a Nvidia-backed Firmus plan for a 360MW, 170,000-GPU Batam AI
              data center with DayOne as infrastructure partner. The adverse side is not a company-specific legal event
              in the reviewed sources, but a structural risk: data centers are drawing policy scrutiny over grid strain,
              water, noise, emissions and land use, and Singapore is strengthening sustainability and resilience
              governance. That makes power contracts, permitting, community engagement and uptime governance core
              diligence items, not ESG footnotes.
