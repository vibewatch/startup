      - number: '3.3'
        title: Capability and customer-focus comparison
        blocks:
          - type: paragraph
            body: >-
              Across the peer set, the buying criteria are converging around AI-ready density, fast RFS dates, power
              certainty, direct connectivity, and sustainability. DayOne claims a modular process capable of up to 500
              MW annually, an 8.5-month greenfield delivery record for NTP Johor, more than 300 MW deployed across
              liquid-cooled sites, and a 130 kW-plus per-cabinet pilot using NVIDIA GB200 NVL72 systems. Digital Realty
              counters with a publicly described high-density colocation offer from 30 kW to 150 kW per cabinet and
              liquid-cooling options, while Equinix positions metro AI inference and xScale training as separate
              deployment patterns. PDG and Bridge emphasize AI-ready greenfield campuses, local delivery, utility
              partnerships, advanced cooling, and proximity to Singapore. The capability matrix therefore does not
              support a single winner; it shows DayOne with particularly strong speed/density claims, incumbents with
              stronger ecosystem breadth, and pan-Asia peers with similar customer-centric campus narratives.
