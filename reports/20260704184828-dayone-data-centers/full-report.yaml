      - number: '1.3'
        title: Capital, Valuation, and Scale
        blocks:
          - type: paragraph
            body: >-
              DayOne's capital formation accelerated sharply in 2026. In January, it announced definitive agreements for
              more than US$2.0 billion of Series C equity led by Coatue with INA support, priced at a 100 percent
              premium to the prior round and building on US$1.9 billion of Series A/B equity plus an up-to-€1 billion
              mezzanine facility. By June 5, 2026, DayOne announced a final Series C close of US$4.5 billion, with
              Coatue and Hillhouse as the two largest shareholders and INA and Achi Capital Partners among notable
              participants. The traction metrics also stepped up: January materials cited approximately 1GW of secured
              customer commitments, while the June final close reported more than 1.5GW of total capacity bookings since
              inception. Independent reporting adds the valuation frame: Data Center Dynamics and Startup Fortune
              describe a roughly US$20 billion IPO valuation target or reported valuation, while DCD also reported that
              MGX was exploring an acquisition and that an IPO could still proceed. Treat the US$20 billion number as
              reported, not company-confirmed, and underwrite it against contracted bookings, power access and execution
              risk rather than revenue metrics, which remain undisclosed.
