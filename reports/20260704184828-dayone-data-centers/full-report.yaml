      - number: '8.4'
        title: Scenarios and sensitivity
        blocks:
          - type: paragraph
            body: >-
              The bull case is not simply “AI demand remains high.” It requires DayOne to convert bookings into
              revenue-producing campuses, preserve access to debt and equity, deliver Finland and APAC builds on time,
              and approach public markets while data-center scarcity remains acute. The base case credits the platform’s
              momentum but treats the US$20 billion marker as fair only with strong private evidence. The bear case
              matters because valuation can move faster than construction: power interconnection delays, capex
              inflation, customer concentration, or weaker IPO appetite could pull the mark back toward the earlier
              US$10 billion reference. Sensitivity is highest to booked-MW conversion, delivered cost per MW, contracted
              yield, debt cost, and terminal market appetite for AI infrastructure.
            claimRefs:
              - CV010
              - CV013
              - CV014
              - CV025
              - CV028
