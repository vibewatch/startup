      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              The public leadership surface is concentrated but credible for an infrastructure company at this stage.
              DayOne's official site names Lim Ah Doo as chairman, emphasizing more than four decades of experience
              across telecommunications, technology, data centers, infrastructure, banking and investment, including
              prior board-level roles. Jamie Khoo has served as CEO since March 2024 and is the central operating voice
              in the company's financing, TNB renewable-energy and corporate narrative. The most material 2026
              leadership change was the appointment of Chengkang (CK) Yan as CFO on June 30, 2026; his background at
              Hillhouse, KKR and Citi is directly relevant because DayOne's growth depends on recurring access to
              institutional capital, structured debt, land and power. Governance remains only partially visible: Coatue
              and Hillhouse are now the two largest shareholders, INA and Achi participated in the final Series C, and
              GDS remains a minority investor after a US$385 million share repurchase. Board composition, reserved
              matters, founder economics and customer concentration governance are not disclosed, leaving a key
              diligence path around control and conflicts as DayOne weighs IPO or strategic alternatives.
