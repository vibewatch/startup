      - number: '6.5'
        title: 'Customer risks: concentration, delivery, power, and AI resilience'
        blocks:
          - type: paragraph
            body: >-
              The customer-risk profile is concentrated in what public evidence does not show. EY’s sector work flags
              the structural risk that data center operators can depend on a small number of hyperscalers and cloud
              providers, while power access, construction delays, and customer churn can directly affect growth. Uptime
              and Data Center Knowledge add that AI-driven density, cooling load, grid instability, and power-system
              complexity are increasingly important reliability questions. None of these sources names a DayOne-specific
              outage or failed deployment, but they are directly relevant to a company selling high-density AI-ready
              capacity. DayOne has credible mitigants: PPAs, modular build claims, government-backed capacity awards,
              security controls, and partner ecosystems. The orchestrator should still treat customer concentration,
              signed lease quality, and service-level performance as data-room priorities before relying on the 1GW
              commitment figure as durable revenue.
