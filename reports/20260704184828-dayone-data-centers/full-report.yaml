      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is attractive but not yet underwritable from public evidence alone. DayOne has
              high-quality signals: institutional financing, a GDS-validated Series C price, large disclosed capacity
              footprints, a Singapore-adjacent market thesis, and credible infrastructure-market tailwinds. It also has
              serious underwriting gaps. The Johor page contains an internal capacity inconsistency, the private company
              discloses no revenue or margin metrics, and key figures such as cash on hand, monthly burn, runway, debt
              maturity, interest cost, customer concentration and backlog are unavailable. Power and grid constraints
              are not theoretical; JLL, Cushman, Uptime and DOE all point to power availability, cost, staffing and AI
              density as sector-wide constraints. DayOne has some mitigation evidence through TNB, water-treatment,
              supplier ecosystem and liquid-cooling initiatives, but those do not replace project-level economics. A
              financing-led bullish case should therefore be conditional: require audited or management-prepared
              revenue, EBITDA and cash-flow schedules; signed customer commitments by site and MW; debt-facility terms;
              construction budgets; power procurement terms; and stabilized yield-on-cost by campus. Until then, DayOne
              should be treated as a scarce, well-financed AI-infrastructure platform with positive capacity optionality
              and material disclosure risk.
