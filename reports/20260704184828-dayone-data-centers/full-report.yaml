      - number: '7.2'
        title: Power, grid and permitting risk by jurisdiction
        blocks:
          - type: paragraph
            body: >-
              Power is the binding constraint behind most of the chapter’s risk register. Singapore’s government is
              explicitly managing generation adequacy and solar intermittency, so a 20 MW DC-CFA allocation and a
              first-of-kind SOFC proof of concept should be treated as a monitored milestone, not a de-risked capacity
              entitlement. Malaysia is more expansionary, but MIDA’s own materials show why power and water are becoming
              policy variables: Johor dominates operational IT capacity, national data-centre demand could grow sharply
              by 2035, and grid-reinforcement costs are described as very high. Hong Kong and Europe show the other side
              of the same constraint: facilitation and legal transparency help, but land disposal, reporting, waste-heat
              and sustainability KPIs become formal obligations.
            claimRefs:
              - CR021
