    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue conversion
        - Contracted revenue, term, ramp and utilization by campus
        - Determines whether booked MW supports valuation
        - Request customer-by-campus data-room schedule
      - - Customer concentration
        - Named hyperscaler/enterprise exposure and top-customer share
        - Single-client risk can reprice platform multiples
        - Review contracts and credit support
      - - Project finance
        - Debt covenants, cost, amortization and security package
        - Senior claims may reduce equity upside
        - Review facility agreements and lender model
      - - Preference stack
        - Liquidation preferences, conversion terms and anti-dilution
        - Entry price may not equal common-equity economics
        - Review charter, shareholder agreements and cap table
      - - Capex and power
        - Interconnection dates, capex-to-complete, EPC terms
        - Power is the scarce valuation driver
        - Third-party engineering and utility diligence
      - - Exit plan
        - Bank mandates, draft prospectus metrics, jurisdiction choice
        - Determines IPO probability and valuation range
        - Meet bankers and review filing timetable
    notes: Diligence asks are required to move from track/research-more to investable.
    claimRefs:
      - CV012
      - CV024
      - CV037
