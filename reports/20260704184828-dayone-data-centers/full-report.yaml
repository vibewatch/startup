  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity ranking and thesis impact
        blocks:
          - type: paragraph
            body: >-
              DayOne’s top risk is not a single jurisdictional defect; it is the concurrency of a hyperscale platform
              buildout across power-constrained and policy-sensitive markets. The SG1 permit and SOFC pilot are
              strategically valuable, but they introduce unproven onsite-power execution into a market where EMA is
              actively managing generation adequacy. Johor is already large enough to become a concentration point for
              both capacity and grid/water scrutiny, while Batam, Chonburi, Fuchu, Hong Kong and Finland each add local
              permitting, land, utility and disclosure dependencies. The investment implication is a research-more
              posture on risk: valuation upside depends on converting committed power and bookings into billable,
              permitted, renewable-backed capacity without overruns or policy backlash. The ranking also weights source
              quality: company disclosures establish the project map, while regulators and filings establish the
              constraints that can invalidate optimistic ramp assumptions.
            claimRefs:
              - CR001
