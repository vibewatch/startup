  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and peer map
        blocks:
          - type: paragraph
            body: >-
              DayOne competes in a crowded but segmented digital-infrastructure field. The closest direct peers are not
              generic colocation landlords; they are hyperscale campus developers that can secure power, land, modular
              construction, and renewable-energy pathways in Asia-Pacific markets. PDG, AirTrunk, Bridge Data Centres,
              and STT GDC fit that job-to-be-done most closely, while Equinix and Digital Realty compete through global
              platform breadth, customer ecosystems, and interconnection depth. Keppel DC REIT is better treated as an
              asset-owner and capital-market peer than as a pure operating substitute, because its disclosed strategy
              focuses on data-centre real estate assets, colocation/single-tenant assets, shell-and-core assets, and
              disciplined portfolio capital recycling. Status quo and internal build also remain real substitutes for
              hyperscalers: JLL explicitly expects hyperscalers to keep using both leasing and self-building strategies.
              The result is a two-axis market: global ecosystem breadth on one side, and power-led APAC hyperscale
              execution on the other.
