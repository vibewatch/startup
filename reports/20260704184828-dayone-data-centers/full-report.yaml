companyProfile:
  summary: >-
    DayOne Data Centers is a Singapore-headquartered independent hyperscale data-center platform established in 2022 and
    led by CEO Jamie Khoo. Its product is not a software service but a portfolio of AI-ready campuses, power, cooling,
    connectivity and sustainability-linked infrastructure for hyperscalers and enterprises across Singapore, Johor,
    Batam, Hong Kong, Tokyo, Thailand and Finland. By June 2026 the company had closed a US$4.5B Series C, reported more
    than 1.5GW of bookings across Asia-Pacific and Europe, and was being discussed in independent reporting around a
    potential US$20B IPO valuation. The core underwriting challenge is that these scale signals are real, but the public
    file still lacks the revenue, margin and customer concentration disclosure needed to validate the headline mark.
  foundedDate: '2022-01-01'
