      - number: '8.2'
        title: Current valuation context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The January round gives the cleanest primary baseline: more than US$2.0 billion of Series C equity, led by
              Coatue and supported by INA, at a 100 percent premium to the prior round. The same filing points to
              earlier US$1.9 billion Series A/B equity and up to €1 billion of mezzanine financing, while the June close
              lifts total Series C gross proceeds to US$4.5 billion. Public reports then describe a potential US$20
              billion IPO valuation and in some accounts a US$5 billion raise. This chapter therefore treats US$20
              billion as an estimated marker, not a disclosed post-money. Entry discipline should require a discount or
              structure unless diligence proves bookings are binding, power is deliverable, project returns are
              attractive, and senior claims do not dilute common-equity upside.
            claimRefs:
