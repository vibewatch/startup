        title: Financing History and Valuation Signals
        blocks:
          - type: paragraph
            body: >-
              The financing file is stronger than the operating-metric file. DayOne's own timeline discloses a rapid
              capital stack: approximately $587 million of Series A funding, $1.2 billion of Series B funding, up to EUR
              1 billion of mezzanine financing for Finland and global expansion, RM15 billion of multicurrency green
              financing for Malaysia, and over $2.0 billion of Series C equity financing in 2026. GDS's SEC-filed
              January 2026 release is the cleanest valuation signal because it is not just a press headline. GDS said
              DayOne would repurchase $385 million of shares at the same price as the Series C preferred issue; that
              transaction recycled about 95% of GDS's principal invested in DayOne at nearly 6.5x money-on-money and
              left GDS with a stake implied to be worth more than $2.2 billion. Those facts imply meaningful
              private-market appreciation even without a fully disclosed post-money valuation. Startup Fortune reported
              a larger $4.5 billion Series C, a $20 billion valuation and a possible $7 billion loan, but those figures
              are treated as lower-confidence because the official DayOne page and GDS filing retained here corroborate
              only the over-$2.0 billion Series C and GDS sale mechanics. The conclusion is that investor demand is
              real, but headline valuation should not be relied upon without cap table, preference stack and
              debt-facility detail.
