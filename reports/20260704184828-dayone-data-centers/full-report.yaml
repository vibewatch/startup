      - number: '6.4'
        title: Retention is not disclosed, but switching costs look structurally high
        blocks:
          - type: paragraph
            body: >-
              No retained source disclosed DayOne NRR, GRR, churn, renewal rates, SLA credits, or satisfaction scores,
              so retention must be diligenced directly. Still, the product and policy evidence suggest switching costs
              can become high after deployment. DayOne describes bespoke in-house builds, liquid-cooled high-density
              infrastructure, live monitoring, and customer-specific operational controls; its data security policy
              restricts Customer Data use, Customer Equipment access, security incident notification, and
              shared-responsibility boundaries. These are the kinds of controls that become embedded in customer
              operating models once workloads, power design, cooling design, and monitoring are live. That said,
              switching-cost logic is not retention proof. The diligence path is to obtain contract duration,
              renewal/cancellation terms, SLA-credit history, incident logs, support metrics, and customer reference
              calls by campus.
