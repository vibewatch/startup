      - number: '8.5'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is credible but incomplete. Reuters/Straits Times and Bloomberg/Yahoo reporting point to US
              and potential Singapore listing routes, and the AirTrunk sale demonstrates strategic infrastructure
              appetite if IPO timing deteriorates. However, no public prospectus, audited standalone DayOne financial
              package, customer schedule, or detailed preference stack was retained. The IC should therefore treat a
              2026 IPO as an option rather than the base underwriting exit. Before investing, diligence must obtain
              contracted revenue and utilization by campus, named customer concentration, capex-to-complete and
              interconnection schedules, debt covenants, liquidation preferences, and sensitivity to an IPO clearing
              below US$20 billion. Failure to produce those materials is itself a thesis-break signal.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV040
              - CV041
              - CV042
          - type: table
