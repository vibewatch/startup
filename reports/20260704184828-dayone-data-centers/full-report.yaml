      - number: '1.5'
        title: Milestones, Adverse Signals, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              The milestone record supports a rapid platform build but also exposes how much diligence still depends on
              private materials. DayOne's journey starts with 2021 land acquisitions in Batam and Johor, then the 2022
              Singapore headquarters, 2023 Singapore capacity award, 2024 Japan and Thailand entries, 2025 Finland and
              financing milestones, and multiple 2026 campus, capital and partnership events. That chronology is
              internally coherent and corroborated by independent funding and capacity reporting. The biggest gaps are
              not absence of identity evidence; they are the economics behind the identity. Public sources do not
              disclose revenue, ARR, run-rate, margins, headcount, named hyperscale customers, contract duration,
              customer concentration, signed-versus-reserved capacity, project-level power usage effectiveness, or the
              governance terms around IPO/MGX alternatives. The adverse research also found broad data-center opposition
              and resource-use risks but no retained source documenting a DayOne-specific lawsuit, sanction, outage or
              community dispute by the run date. The chapter therefore establishes DayOne as a well-funded, fast-scaling
              AI-infrastructure platform while explicitly reserving final judgment on customer quality, profitability
              and execution until data-room evidence is available.
