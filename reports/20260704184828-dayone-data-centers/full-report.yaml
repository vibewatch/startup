  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      DayOne customers move from constrained compute demand to site selection, power-backed deployment, move-in, and
      multi-region expansion.
    data:
      nodes:
        - id: demand
          label: AI / cloud demand spike
          detail: Hyperscalers, AI-native operators, and regulated enterprises need high-density capacity.
        - id: site-selection
          label: Geography and latency choice
          detail: Singapore for local critical workloads; Johor/Batam for scale; Finland for renewable EU capacity.
        - id: contracting
          label: Commitment and power matching
          detail: Customer commitment must be paired with campus power, RFS timing, and sustainability evidence.
        - id: deployment
          label: Build / fit-out / move-in
          detail: Bespoke builds, liquid cooling, customer equipment controls, and site operations become embedded.
        - id: operations
          label: Operations and service quality
          detail: Monitoring, SLA performance, data security, and incident response shape renewal confidence.
        - id: expansion
          label: Expansion or concentration test
          detail: Multi-region expansion creates stickiness but top-customer exposure must be proven privately.
    approximationNotes: Journey stages are inferred from retained public sources; no customer contract workflow was disclosed.
    claimRefs:
      - CU024
      - CU025
      - CU027
      - CU036
      - CU044
