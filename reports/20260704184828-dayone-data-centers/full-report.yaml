              - CV024
              - CV037
              - CV038
              - CV040
              - CV041
              - CV042
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Track / research-more at the reported US$20B marker; invest only with verified private economics or
              downside-protective structure.
            calloutType: recommendation
            claimRefs:
              - CV030
              - CV032
              - CV038
          - type: callout
            title: Main valuation risk
            body: >-
              The public narrative prices scarce AI infrastructure before disclosing the revenue, margins, customer
              concentration and preference stack needed for underwriting.
            calloutType: risk
            claimRefs:
