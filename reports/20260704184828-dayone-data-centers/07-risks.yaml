slug: dayone-data-centers
runDate: '2026-07-04'
company:
  name: DayOne Data Centers
chapter:
  number: 7
  title: Risks
  summary: 'DayOne’s biggest risk is concurrency: a capital-intensive, power-dependent data-center platform is scaling across several jurisdictions while relying on timely permits, grid capacity, renewable procurement, customer concentration discipline, financing access and an unproven Singapore SOFC proof of concept.'
sections:
- id: severity-ranking
  title: Severity ranking and thesis impact
  body: 'DayOne’s top risk is not a single jurisdictional defect; it is the concurrency of a hyperscale platform buildout across power-constrained and policy-sensitive markets. The SG1 permit and SOFC pilot are strategically valuable, but they introduce unproven onsite-power execution into a market where EMA is actively managing generation adequacy. Johor is already large enough to become a concentration point for both capacity and grid/water scrutiny, while Batam, Chonburi, Fuchu, Hong Kong and Finland each add local permitting, land, utility and disclosure dependencies. The investment implication is a research-more posture on risk: valuation upside depends on converting committed power and bookings into billable, permitted, renewable-backed capacity without overruns or policy backlash. The ranking also weights source quality: company disclosures establish the project map, while regulators and filings establish the constraints that can invalidate optimistic ramp assumptions.'
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR005
  - CR010
  - CR012
  - CR030
  - CR045
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: power-grid-and-permitting
  title: Power, grid and permitting risk by jurisdiction
  body: 'Power is the binding constraint behind most of the chapter’s risk register. Singapore’s government is explicitly managing generation adequacy and solar intermittency, so a 20 MW DC-CFA allocation and a first-of-kind SOFC proof of concept should be treated as a monitored milestone, not a de-risked capacity entitlement. Malaysia is more expansionary, but MIDA’s own materials show why power and water are becoming policy variables: Johor dominates operational IT capacity, national data-centre demand could grow sharply by 2035, and grid-reinforcement costs are described as very high. Hong Kong and Europe show the other side of the same constraint: facilitation and legal transparency help, but land disposal, reporting, waste-heat and sustainability KPIs become formal obligations.'
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR035
  - CR036
  - CR037
  - CR038
  - CR041
  - CR043
  - CR044
