- id: technology-supply-chain-and-esg
  title: Hydrogen/SOFC, supply chain and ESG claims risk
  body: The SOFC strategy is credible enough to monitor but too early to underwrite as a solved decarbonization pathway. DOE and Bloom support the technical proposition that fuel cells can deliver efficient onsite power, yet hydrogen’s climate value turns on production pathway and delivered fuel availability; DOE’s statement that most hydrogen is produced from natural-gas reforming makes fuel-source proof a diligence gate. DayOne’s sustainability roadmap includes renewable PPAs and 2030 targets, but the inaugural sustainability report is scheduled for 2026, so investors still need audited site-level PUE, WUE, renewable-matching, emissions and waste-heat evidence. Supplier controls reduce construction and compliance risk, but the supplier code itself shows that audits, sanctions, export-control and environmental evidence will have to scale with the build program.
  claimRefs:
  - CR014
  - CR015
  - CR017
  - CR018
  - CR024
  - CR025
  - CR026
  - CR035
  - CR044
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: financing-customer-and-ipo-risk
  title: Financing, IPO and customer concentration risk
  body: 'DayOne’s reported financing story is both a strength and a risk amplifier. Large private rounds, reported IPO ambitions and possible multi-billion-dollar debt facilities can fund land, substations and cooling infrastructure, but they also expose the company to rate, listing-window, disclosure and valuation-reset risk. The most decision-useful public comparator is GDS’s own filing: it documents DayOne’s standalone status and committed/billable IT power, while also showing the concentration and pricing-leverage risks inherent in hyperscale data-center models. DayOne’s exact customer concentration is not publicly disclosed in the retained sources; therefore, concentration, contract termination rights, billing ramp and top-customer credit should be treated as a diligence blocker before relying on bookings or valuation marks.'
  claimRefs:
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
