  figureRefs: []
- id: monitoring-and-kill-criteria
  title: Mitigations, monitoring indicators and kill criteria
  body: 'The risk posture is manageable only if DayOne can turn company-claimed mitigations into verifiable operating evidence. The critical monitors are: Singapore SOFC fuel source and uptime; Johor grid and water approvals; Batam SEZ and cable/interconnection milestones; Chonburi and Fuchu utility and construction schedules; Hong Kong land and certification continuity; Finland EU reporting and waste-heat compliance; and group-level customer, debt and supplier disclosures. A thesis break would occur if any flagship campus loses grid allocation, if SOFC claims rely materially on fossil hydrogen without transparent emissions accounting, if debt or IPO terms imply distressed dilution, or if the top-customer mix proves too concentrated to sustain pricing power. These indicators should be refreshed before each investment committee because several are volatile and tied to 2026 financing, policy and construction events.'
