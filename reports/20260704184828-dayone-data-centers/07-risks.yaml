- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Singapore SOFC / hydrogen
    - Fuel source, runtime and emissions disclosure
    - No clean-fuel contract or material outage during pilot
    - Do not underwrite SG1 as green/firm capacity
  - - Johor grid and water
    - Utility and water approvals
    - Delayed TNB allocation, water cap or adverse PUE/WUE result
    - Haircut Johor ramp and revenue timing
  - - Batam SEZ execution
    - Permits, tax incentives, cable and power milestones
    - Material permit slippage or incentive withdrawal
    - Require lower valuation or milestone-based funding
  - - Thailand/Japan development
    - BOI/METI-equivalent approvals, grid queue, construction RFS
    - No binding utility or permit evidence before capital call
    - Defer expansion credit in base case
  - - EU/Finland ESG reporting
    - EED KPIs, waste-heat offtake, water data
    - Failure to meet reporting or heat-reuse economics
    - Treat ESG premium as unproven
  - - Customer concentration
    - Top customer share and termination rights
    - Top two customers dominate bookings or have broad termination rights
    - Demand contract-level diligence before investment
  - - Financing / IPO
    - Debt terms, covenants, listing window
    - Loan reprices, IPO delayed, or valuation reset below private mark
    - Move recommendation toward avoid/reprice
  - - Supply-chain compliance
    - Audit exceptions and critical supplier concentration
    - Repeated unresolved supplier non-compliance or sanctions issue
    - Escalate to legal blocker
  notes: Kill criteria are monitorable diligence thresholds derived from public evidence gaps and comparable filing risk factors.
