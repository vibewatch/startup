  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: DayOne customer concentration by customer, contract, booked MW, billable MW, termination rights and pricing escalation.
    whyItMatters: Hyperscaler concentration can turn bookings into pricing leverage or delayed move-in risk.
    diligencePath: Request anonymized top-10 customer schedule and contract summaries under NDA.
    relatedQuestionRefs:
    - QR018
    - QR029
  - type: missing-source
    severity: material
    topic: utility-commitments
    missingEvidence: Binding grid-connection letters, substation schedules, water permits and renewable matching by campus.
    whyItMatters: Grid and water constraints are the most direct path from policy risk to RFS delay and revenue slip.
    diligencePath: Obtain utility interconnection agreements and regulator correspondence for SG1, Johor, Batam, Chonburi, Fuchu and Finland.
    relatedQuestionRefs:
    - QR003
    - QR005
    - QR029
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: sofc-hydrogen
    missingEvidence: SOFC supplier, fuel-source pathway, emissions factor, safety approval, runtime, maintenance and availability data.
    whyItMatters: The Singapore SOFC pilot is a flagship differentiator but could be an ESG liability if fuel source or uptime disappoints.
    diligencePath: Review pilot contract, fuel certificates, safety filings and operating logs.
    relatedQuestionRefs:
    - QR004
    - QR012
  - type: private-evidence-only
    severity: material
    topic: financing-ipo
    missingEvidence: Debt facility term sheet, covenants, use of proceeds, maturity ladder and IPO readiness documents.
    whyItMatters: Capital intensity means valuation and execution are sensitive to debt cost and public-market timing.
    diligencePath: Review lender presentations, board materials and draft listing-risk factors.
    relatedQuestionRefs:
    - QR017
    - QR023
  - type: missing-source
    severity: minor
    topic: adverse-press
    missingEvidence: Independent adverse press, litigation searches and local-court records did not surface a retained source with a specific DayOne legal proceeding.
    whyItMatters: Absence of public adverse evidence is not proof of absence, especially for private operating subsidiaries.
    diligencePath: Run jurisdictional litigation, land-use and environmental searches under local counsel.
    relatedQuestionRefs:
    - QR023
    - QR026
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-risk-register
    missingEvidence: The risk register is partial and based on public markets disclosed by DayOne, not a full legal inventory of every permit and license.
    whyItMatters: Unlisted permits could still drive campus-specific delays.
    diligencePath: Request management’s global permit matrix and compare with local counsel checklists.
    relatedQuestionRefs:
    - QR001
    - QR021
    relatedTableRefs:
