  - TO003
- id: capital-valuation-and-scale
  title: Capital, Valuation, and Scale
  body: 'DayOne''s capital formation accelerated sharply in 2026. In January, it announced definitive agreements for more
    than US$2.0 billion of Series C equity led by Coatue with INA support, priced at a 100 percent premium to the prior round
    and building on US$1.9 billion of Series A/B equity plus an up-to-€1 billion mezzanine facility. By June 5, 2026, DayOne
    announced a final Series C close of US$4.5 billion, with Coatue and Hillhouse as the two largest shareholders and INA
    and Achi Capital Partners among notable participants. The traction metrics also stepped up: January materials cited approximately
    1GW of secured customer commitments, while the June final close reported more than 1.5GW of total capacity bookings since
    inception. Independent reporting adds the valuation frame: Data Center Dynamics and Startup Fortune describe a roughly
    US$20 billion IPO valuation target or reported valuation, while DCD also reported that MGX was exploring an acquisition
    and that an IPO could still proceed. Treat the US$20 billion number as reported, not company-confirmed, and underwrite
    it against contracted bookings, power access and execution risk rather than revenue metrics, which remain undisclosed.'
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO021
  - CO022
  - CO048
- id: infrastructure-partnerships-and-regulatory-exposure
  title: Infrastructure Partnerships and Regulatory Exposure
  body: 'The operating story is increasingly about whether DayOne can convert scarce land and power into delivered megawatts
    faster than competitors. Data Center Dynamics reported more than 500MW in service and under construction and more than
    500MW held for future development, while DayOne''s own journey cites NTP Johor, HK1 customer move-in, SG1 groundbreaking,
    Chonburi Tech Park, Tokyo phase one and 34MW at Nongsa Digital Park in Batam. In Malaysia, DayOne signed renewable-energy
    supply agreements with TNB entities covering roughly 1.5GWp of solar and 2.2GWh of battery storage and reported more than
    1GW of renewable energy secured through the TNB partnership. Indonesia is emerging as both a DayOne market and a partner
    ecosystem: independent reporting describes a Nvidia-backed Firmus plan for a 360MW, 170,000-GPU Batam AI data center with
    DayOne as infrastructure partner. The adverse side is not a company-specific legal event in the reviewed sources, but
    a structural risk: data centers are drawing policy scrutiny over grid strain, water, noise, emissions and land use, and
    Singapore is strengthening sustainability and resilience governance. That makes power contracts, permitting, community
    engagement and uptime governance core diligence items, not ESG footnotes.'
  claimRefs:
