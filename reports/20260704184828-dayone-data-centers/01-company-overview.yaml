company:
  name: DayOne Data Centers
chapter:
  number: 1
  title: Company Overview
  summary: DayOne Data Centers is a Singapore-headquartered hyperscale data center platform established in 2022, led by CEO
    Jamie Khoo, and scaling AI-ready campuses across Asia-Pacific and Europe. By the July 2026 run date it had closed US$4.5
    billion of Series C equity financing, disclosed more than 1.5GW of capacity bookings, and was reported to be pursuing
    public-market or strategic alternatives around a roughly US$20 billion valuation, while public disclosure remains thin
    on revenue, named customers and headcount.
sections:
- id: identity-product-footprint
  title: Identity, Product, and Footprint
  body: 'DayOne Data Centers is best understood as a private, Singapore-headquartered hyperscale data center platform rather
    than a conventional colocation operator with a single-market footprint. The company says it was established in 2022 and
    develops next-generation, high-capacity, AI-ready campuses for global hyperscalers and enterprises. Its differentiator
    is a market-creation model: DayOne describes a proprietary SIJORI hub-and-spoke corridor that links Singapore''s connectivity
    with Johor''s cost and land advantages and Batam''s expansion capacity. Official market pages show a broader platform
    spanning Singapore, Johor, Batam, Hong Kong, Tokyo, Greater Bangkok and Finland; the June 2026 final Series C release
    added Spain to the disclosed operation-or-development list. The business model is therefore a capital-intensive capacity-origination
    platform: secure land, power and permits ahead of demand, package the campuses as high-density AI-ready supply, and convert
    scarce regional capacity into long-term bookings from hyperscale customers. The strongest public support is for identity,
    markets and product architecture; named customers, revenue and precise utilization are not public.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO031
  tableRefs:
  - TO001
  figureRefs:
