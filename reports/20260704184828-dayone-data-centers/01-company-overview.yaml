  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: Named customer list, signed capacity by customer, contract tenor, termination rights and ramp schedule
      for the disclosed bookings.
    whyItMatters: Bookings are the core valuation support, but concentration and contract quality cannot be underwritten from
      public aggregate GW figures.
    diligencePath: Request anonymized customer concentration schedule and top-ten contract summaries under NDA.
    relatedQuestionRefs:
    - QO015
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Revenue, ARR or run-rate, gross margin, EBITDA, capex committed, debt draw status and project-level returns.
    whyItMatters: The US$20B valuation discussion cannot be assessed without economics per delivered MW and customer contract
      profitability.
    diligencePath: Obtain management financial model, lender presentations and latest board materials.
    relatedQuestionRefs:
    - QO023
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Current employee headcount, hiring plan by market and operating staffing model.
    whyItMatters: Execution across eight markets requires substantial project, operations, energy and regulatory teams.
    diligencePath: Request HR dashboard and reconcile to LinkedIn/careers data in the next refresh.
    relatedQuestionRefs:
    - QO022
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Full board roster, committee structure, investor rights, founder economics and related-party policies
      with GDS, Hillhouse and INA.
    whyItMatters: Governance terms affect IPO readiness, strategic-sale optionality and conflict management across major shareholders
      and partners.
    diligencePath: Review shareholders agreement, board minutes, reserved matters schedule and conflict policies.
    relatedQuestionRefs:
    - QO008
    - QO014
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: minor
    topic: adverse
    missingEvidence: Company-specific lawsuit, sanction, outage, community opposition or permitting dispute source; none was
      retained in this chapter's source set.
    whyItMatters: General data-center opposition is relevant but less probative than project-specific controversies in DayOne
      markets.
    diligencePath: Run jurisdiction-specific court, regulator, planning-board and media searches for Johor, Batam, Singapore,
      Finland and Thailand assets.
    relatedQuestionRefs:
    - QO021
  - type: private-evidence-only
    severity: material
    topic: capacity delivery
    missingEvidence: Project-level status for each campus, live MW, contracted MW, power availability, construction milestones
      and delivery-risk register.
    whyItMatters: The business is valued on scarce AI-ready capacity, so delays in power or construction can impair bookings
      and IPO valuation.
    diligencePath: Request project controls dashboard, utility interconnection letters and customer delivery obligations by
      campus.
    relatedQuestionRefs:
    - QO016
    - QO017
    - QO024
    relatedTableRefs:
    - TO004
    - TO005
