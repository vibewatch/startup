evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: >-
      Named customer list, signed capacity by customer, contract tenor, termination rights and ramp schedule for the
      disclosed bookings.
    whyItMatters: >-
      Bookings are the core valuation support, but concentration and contract quality cannot be underwritten from public
      aggregate GW figures.
    diligencePath: Request anonymized customer concentration schedule and top-ten contract summaries under NDA.
    relatedQuestionRefs:
      - QO015
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Revenue, ARR or run-rate, gross margin, EBITDA, capex committed, debt draw status and project-level returns.
    whyItMatters: >-
      The US$20B valuation discussion cannot be assessed without economics per delivered MW and customer contract
      profitability.
    diligencePath: Obtain management financial model, lender presentations and latest board materials.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Current employee headcount, hiring plan by market and operating staffing model.
    whyItMatters: Execution across eight markets requires substantial project, operations, energy and regulatory teams.
    diligencePath: Request HR dashboard and reconcile to LinkedIn/careers data in the next refresh.
    relatedQuestionRefs:
      - QO022
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Full board roster, committee structure, investor rights, founder economics and related-party policies with GDS,
      Hillhouse and INA.
    whyItMatters: >-
      Governance terms affect IPO readiness, strategic-sale optionality and conflict management across major
      shareholders and partners.
    diligencePath: Review shareholders agreement, board minutes, reserved matters schedule and conflict policies.
    relatedQuestionRefs:
      - QO008
      - QO014
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: adverse
    missingEvidence: >-
      Company-specific lawsuit, sanction, outage, community opposition or permitting dispute source; none was retained
      in this chapter's source set.
    whyItMatters: >-
      General data-center opposition is relevant but less probative than project-specific controversies in DayOne
      markets.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, planning-board and media searches for Johor, Batam, Singapore, Finland
      and Thailand assets.
    relatedQuestionRefs:
      - QO021
  - type: private-evidence-only
    severity: material
    topic: capacity delivery
    missingEvidence: >-
      Project-level status for each campus, live MW, contracted MW, power availability, construction milestones and
      delivery-risk register.
    whyItMatters: >-
      The business is valued on scarce AI-ready capacity, so delays in power or construction can impair bookings and IPO
      valuation.
    diligencePath: Request project controls dashboard, utility interconnection letters and customer delivery obligations by campus.
    relatedQuestionRefs:
      - QO016
      - QO017
      - QO024
    relatedTableRefs:
      - TO004
      - TO005
  - type: private-evidence-only
    severity: material
    topic: SOM-gap
    missingEvidence: >-
      Campus-level contracted MW, occupancy, utilization, price per kW, customer concentration and remaining power
      rights.
    whyItMatters: >-
      Without these data, DayOne’s true SOM and near-term revenue capacity cannot be derived from public market
      forecasts.
    diligencePath: >-
      Request management data room exports for each campus covering signed capacity, optioned capacity, energized
      capacity and pricing.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
      - TM005
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named customer case studies or third-party procurement records validating large hyperscale commitments by campus.
    whyItMatters: >-
      Market attractiveness depends on whether DayOne has converted demand into committed capacity rather than
      speculative pipeline.
    diligencePath: Ask for top customer contract abstracts and independently verify at least three deployments or reservations.
    relatedQuestionRefs:
      - QM017
      - QM024
  - type: conflicting-data
    severity: minor
    topic: Johor-capacity
    missingEvidence: Reconciliation between DayOne page metrics that cite 390 MW in-service and over 478 MW operational capacity.
    whyItMatters: Different capacity definitions may mix IT load, facility load, operational capacity and total planned capacity.
    diligencePath: >-
      Have management define each MW metric and map it to energized IT load, committed load and total campus design
      load.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: power-and-water
    missingEvidence: >-
      Utility letters, substation delivery schedules, water permits and PUE/WUE design guarantees for Johor, Batam,
      Thailand and Tokyo.
    whyItMatters: Power and water are the binding constraints for hyperscale delivery and can delay revenue recognition.
    diligencePath: >-
      Review utility interconnection agreements, milestone payments, water availability letters and local authority
      approvals.
    relatedQuestionRefs:
      - QM015
      - QM020
      - QM025
    relatedTableRefs:
      - TM005
  - type: stale
    severity: minor
    topic: market-forecasts
