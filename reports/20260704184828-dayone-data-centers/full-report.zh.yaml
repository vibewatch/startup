            - 多元化选项，没有具名客户证明
    approximationNotes: 矩阵等级是定性证据评估，不是客户评分。
    claimRefs:
      - CU014
      - CU015
      - CU020
      - CU023
      - CU041
      - CU046
  - id: FU004
    title: 客户集中度和服务风险敞口
    type: matrix
    layout: standard
    summary: 主要客户风险不是没有需求，而是公开集中度、留存和服务质量指标缺失。
    data:
      columns:
        - 公开证据
        - 客户影响
        - 尽调优先级
      rows:
        - label: 头部客户集中度
          values:
            - 1GW 承诺，但没有客户级拆分
            - 大规模流失或延期可能影响利用率
            - 高
        - label: 电力和电网交付
          values:
            - 新加坡 PPA、巴淡岛分阶段 PPA、芬兰电网规划
            - 错过 RFS 会推迟收入和工作负载
            - 高
        - label: AI 密度 / 冷却
          values:
            - 液冷说法和行业停机风险
            - 密度越高，可靠性和 SLA 敞口越大
            - 高
        - label: 安全责任边界
          values:
            - 客户数据和设备访问政策
            - 事件责任归属影响续约
            - 中
        - label: 建设里程碑
          values:
            - 模块化建设说法和行业延期风险
            - 超大规模客户罚金或验收风险
            - 中
    approximationNotes: 风险优先级是分析师基于公开证据和行业风险来源作出的评估。
    claimRefs:
      - CU031
      - CU032
      - CU034
      - CU036
      - CU044
