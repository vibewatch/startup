        title: 可比方法：稀缺性溢价，但公开锚点不完美
        blocks:
          - type: paragraph
            body: >-
              可比集应同时纳入 APAC 私有超大规模平台并购、上市全球数据中心平台，以及电力稀缺性的市场数据。 AirTrunk 是最接近的战略先例，因为它是 APAC 超大规模平台，已向客户承诺超过
              800MW，且土地可支持超过 1GW 的未来增长； A$24 billion 交易验证了大型基础设施资本愿意为已规模化、且电力和土地有保障的增长付费。 公开 REIT 提供披露纪律和市值锚点，但
              Equinix、Digital Realty、Iron Mountain 和 GDS 都不是 DayOne 的完全可比对象。 方法上应三角验证每个已预订 / 已承诺 MW
              的价值、电力和土地质量、客户信用与集中度、建设执行，以及公开市场是否会接受私募成长估值。
