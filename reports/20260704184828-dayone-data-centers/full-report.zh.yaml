      - number: '7.4'
        title: 融资、IPO 与客户集中风险
        blocks:
          - type: paragraph
            body: >-
              公开报道中的融资叙事既是 DayOne 的优势，也是风险放大器。大额私募轮、报道中的 IPO 计划以及可能的数十亿美元债务工具，
              可以支撑土地、变电站和冷却基础设施；但这些安排也让公司暴露在利率、上市窗口、披露和估值重置风险之下。 最有决策价值的公开可比材料是 GDS 自身备案：它确认 DayOne 的独立状态以及已承诺 / 可计费 IT
              电力， 也揭示了超大规模数据中心模式内生的集中度和定价杠杆风险。留存来源没有公开 DayOne 的确切客户集中度； 因此，在依赖订单或估值标记前，客户集中度、合同终止权、计费爬坡和头部客户信用都应作为尽调阻断项。
