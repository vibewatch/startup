  - id: TV005
    title: 论点破裂和终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 已签 MW 质量
        - 订单无约束力，或集中在单一客户
        - 收入可见度和每 MW 估值同时塌陷
        - 转向回避，或要求大幅折扣
      - - 电力交付
        - 芬兰 / APAC 园区出现重大并网延迟
        - 容量无法按投资测算时间表转成收入
        - 暂停投资，直到里程碑重设
      - - 资本开支通胀
        - 每 MW 成本上升到损害稳定收益率
        - 额外债务 / 股权摊薄股权回报
        - 要求反稀释或价格重置
      - - IPO 窗口
        - 招股区间明显低于 US$20B
        - 退出倍数假设失效
        - 按悲观情景估值重做承保
      - - 优先清偿权结构
        - 高级优先权 / 契约条款吃掉上行空间
        - 普通股 / 新资金回报不对称加剧
        - 没有结构保护不投
      - - 披露缺口
        - 管理层不提供收入、利润率、客户和债务明细
        - 无法验证估值方法
        - 阻断投委会批准
    notes: 触发项把公开不确定性转成具体尽调关口。
