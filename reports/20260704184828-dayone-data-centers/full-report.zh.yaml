      - number: '8.2'
        title: 当前估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              1 月轮次给出最干净的一手基线：Series C 股权超过 US$2.0 billion，由 Coatue 领投，并有 INA 支持，较上一轮溢价 100%。 同一份备案还指向此前 Series A/B 股权
              US$1.9 billion，以及最高 €1 billion 的夹层融资； 6 月关账则把 Series C 总募集额抬到 US$4.5 billion。随后公开报道描述了潜在 US$20 billion IPO
              估值， 部分报道还称可能募资 US$5 billion。因此，本章把 US$20 billion 视为估计标记，而不是已披露的投后估值。
              入场纪律应要求折价或结构保护，除非尽调证明订单具约束力、电力可交付、项目回报有吸引力，且更优先的权利不会稀释普通股上行。
