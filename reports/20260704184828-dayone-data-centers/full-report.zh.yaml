              把电力可得性有限称为增长的首要抑制因素，并指出预租和建设时间线已拉到 2027 年及以后。JLL 称主要市场的电网接入等待超过四年，并估计到 2030 年行业需要 US$3 trillion 投资。如果
              DayOne 已锁定电力，这些条件会帮助快执行者；但它们也会吸引资本更深的既有玩家和基础设施基金。超大规模客户一旦预租多 MW 容量并接入云 /
              网络连接，转换成本确实存在，但并非绝对：超大规模客户可以多地部署和自建，最大同行也能融资推进电力相邻策略。因此，尽调重点不是 DayOne 有没有差异化，而是这些差异化是否已经通过客户承诺、公用事业安排和 RFS
