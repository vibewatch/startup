      - number: '2.3'
        title: 地理语境：SIJORI 加精选 APAC 与北欧节点
        blocks:
          - type: paragraph
            body: >-
              DayOne 最有差异化的市场逻辑是 SIJORI。Singapore 提供连接能力、企业信任和溢价定价，但土地和电力限制让超大单一市场部署很难。Johor 随后成为规模阀门，MIDA 报告 Malaysia
              78.6% 的运营 IT 容量已在 Johor，DayOne 也称在 NTP 和 KTP 拥有数百 MW。Batam 则补上靠近 Singapore、具备海底光缆接入、成本更低且位于 SEZ 的节点。SIJORI
              之外，Thailand 提供政府支持的数字经济环境和大型 Chonburi 园区命题；Tokyo 提供需求密度和时延；Hong Kong 提供金融市场和跨境连接，但土地有限；Finland
              则用可再生电力和余热定位服务欧洲客户。这些地点让市场有吸引力，但每个地点也有自己的瓶颈：电网建设、水、许可、客户集中度或执行节奏。因此，答案不是单一市场，而是组合问题：Singapore
              锚定信任和时延，相邻或可再生资源丰富的节点必须证明自己能吸收工作负载，同时不牺牲性能、合规或碳目标。
