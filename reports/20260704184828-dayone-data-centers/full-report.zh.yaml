      - number: '2.2'
        title: 需求与测算：AI 打开超级周期，但可落地 SAM 受电力限制
        blocks:
          - type: paragraph
            body: >-
              最强的市场证据来自三组独立信号的汇合：JLL 的 2026 年展望预计 2026 至 2030 年将新增约 100 GW 容量，CBRE 报告主要枢纽空置率紧、预租持续，IEA 则称数据中心、AI 和加密用电量到
              2026 年可能翻倍。对 DayOne 来说，广义 TAM 是全球超大规模和托管容量，实际 SAM 则是公司能锁定电力、土地和许可的 APAC 加精选欧洲市场。APAC 尤其相关：JLL 预测区域容量到 2030
              年将从 32 GW 增至 57 GW，CBRE 也认为 Tokyo、Johor 和 Batam 已为 AI
              相关需求或外溢交易占位。吸引力在于有电站点的稀缺价值；负面点在于所有可信竞争者都在追同一个瓶颈。本章刻意不使用单一总量 TAM，因为当互联排队、变电站交期和客户侧装配预算决定哪些 MW
              会变成收入供给时，宏观预测很容易夸大机会。
