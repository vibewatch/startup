      - number: '2.4'
        title: 买家、采用路径与约束：拿到电力的速度触发采购
        blocks:
          - type: paragraph
            body: >-
              买家很少只是一个用户。云容量规划、AI
              平台团队、网络架构师、可持续负责人、财务和房地产基础设施负责人都会影响采购，预算也往往横跨容量预留、建设承诺、电力采购和技术装配。采用从客户预测工作负载需求开始，再收窄到时延区域、主权要求、电力可得性、机柜密度和碳要求。DayOne
              声称的优势——预制交付、液冷、SOFC 试点、可再生 PPA 和多市场扩张——与这条漏斗匹配度较高。不过，公开证据没有披露签约客户、入住率、利用率、实际价格或园区级回报，所以精确 SOM
              仍不可得。尽调结论应把市场视为结构性有吸引力但高度依赖执行：核验电网里程碑、客户预租、公用事业合同、PUE / WUE
              表现，以及满足客户可持续要求的成本。尽调中决定性的证据不是另一张市场规模图，而是从预测工作负载到已签预订、通电里程碑、制冷表现和客户特定部署日期的转化桥。
