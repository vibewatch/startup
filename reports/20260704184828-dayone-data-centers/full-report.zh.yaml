      - number: '7.5'
        title: 缓释措施、监测指标与放弃标准
        blocks:
          - type: paragraph
            body: >-
              只有 DayOne 能把公司声称的缓释措施转成可验证的运营证据，风险才可管理。关键监测项包括： 新加坡 SOFC 燃料来源和运行时间；柔佛电网和用水审批；巴淡 SEZ 与海缆 / 互联里程碑；
              春武里和府中的公用事业与建设排期；香港土地和认证连续性；芬兰 EU 报告和余热合规； 以及集团层面的客户、债务和供应商披露。若任一旗舰园区失去电网配额，若 SOFC 声明在很大程度上依赖化石氢且没有透明排放核算，
              若债务或 IPO 条款暗示困境式稀释，或若头部客户结构过度集中、无法支撑定价权，投资论点就会破裂。 上述指标应在每次投委会前刷新，因为其中多项波动大，并与 2026 年融资、政策和建设事件绑定。
