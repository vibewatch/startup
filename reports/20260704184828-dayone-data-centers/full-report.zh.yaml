      - - 报告称 1.5GW 预订
        - 2022 年以来预订超过 1.5GW
        - 第三方积压订单代理变量
        - 合同支持前可信度低
        - 若核实，可能意味着合同需求非常大
        - 提供已签积压订单、保证金、取消权和爬坡计划
      - - 容量页面指标
