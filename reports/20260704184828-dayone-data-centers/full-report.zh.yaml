      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              财务结论是有吸引力，但仅靠公开证据还无法完成投资判断。DayOne 有高质量信号：机构融资、经 GDS 验证的 Series C 价格、大型已披露容量版图、Singapore
              相邻市场命题，以及可信的基础设施市场顺风。它也有严重尽调缺口。Johor
              页面存在内部容量口径不一致，私营公司不披露收入或利润率指标，现金在手、月度消耗、现金跑道、债务到期、利息成本、客户集中度和在手订单等关键数字均不可得。电力和电网约束并非理论问题；JLL、Cushman、Uptime
              和 DOE 都指向电力可得性、成本、用工和 AI 密度这些全行业约束。DayOne 通过
              TNB、水处理、供应商生态和液冷举措拿出了一些缓释证据，但这些不能替代项目级经济性。融资驱动的看多情景必须带条件：要求审计或管理层编制的收入、EBITDA 和现金流清单；按站点和 MW
              拆分的已签客户承诺；债务融资条款；建设预算；电力采购条款；以及各园区稳定后成本收益率。在此之前，DayOne 应被视为一个稀缺、融资充分、拥有正向容量期权的 AI 基础设施平台，同时伴随重大披露风险。
