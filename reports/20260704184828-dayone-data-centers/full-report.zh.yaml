      - number: '8.4'
        title: 情景与敏感性
        blocks:
          - type: paragraph
            body: >-
              牛市情景不只是「AI 需求维持高位」。它要求 DayOne 把订单转成产生收入的园区，守住债务和股权融资通道， 按时交付芬兰和 APAC 建设，并在数据中心稀缺性仍然紧张时接近公开市场。基准情景认可平台动能，
              但只有在强有力私有证据支撑下，才把 US$20 billion 标记视为公允。熊市情景重要，因为估值可能比建设更快调整： 电力互联延迟、资本开支通胀、客户集中度或 IPO 胃口走弱，都可能把标记拉回此前
              US$10 billion 参照附近。 敏感度最高的变量是已预订 MW 转化、每 MW 交付成本、合同收益率、债务成本，以及终局市场对 AI 基础设施的胃口。
