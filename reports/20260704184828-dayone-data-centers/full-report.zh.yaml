            body: >-
              AI 就绪故事可信，但依赖很重。DayOne 是 NVIDIA Data Center Partner，并称其通过验证的设施按 NVIDIA Reference Design 标准建设；解决方案页面还称用
              GB200 NVL72 系统做了单柜 130 kW 以上试点。这支持高密度方向，但本身没有披露有多少机柜、数据厅或园区已经准备好承载这些密度。电力系统才是硬约束。Singapore 依赖严格监管下的 20 MW
              配额和 SOFC 概念验证；Batam 依赖 511 MVA PPA 下 2026-2027 年分阶段电网交付；Malaysia 依赖 CRESS 可再生执行；Thailand 依赖 Amata、AMBRE 和
              PEA 相关可再生集成；Finland 依赖电网接入、余热和许可。制冷也按地理位置分化：Singapore 测试热带混合 / 液冷，Johor 和 Batam 瞄准高密度区域规模，Finland
              借助天然冷凉气候和零淡水制冷。架构有吸引力，因为它跨多市场；但每个市场只能跟着公用事业、许可和制冷验证的速度往前走。
