  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 底线：跟踪资产，不要盲信表面标价
        blocks:
          - type: paragraph
            body: >-
              DayOne 看起来是一类稀缺的超大规模平台，但估值判断不等同于公司质量判断。公开证据确认， 2026 年 1 月 Series C 以 100% 溢价定价，2026 年 6 月最终关账总额 US$4.5
              billion， 第三方报道还提到可能的 US$20 billion IPO 估值。这足以框定机会，但还不足以支持按表面标价给出买入建议。 在已预订 MW
              经济性、客户集中度、债务条款和优先权结构得到核实前，建议保持跟踪 / 继续研究，高风险，估值偏紧。 如果 DayOne 能把超过 1.5GW 订单转成电力有保障且盈利的园区，并进入 IPO 窗口，上行存在；
              如果执行或融资成本追不上叙事，下行也很实质。这个姿态也保留了选择权，同时避免围绕尚未在公开材料披露的私募经济性制造虚假精确。
