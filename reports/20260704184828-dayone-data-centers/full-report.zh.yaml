  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 在未披露经济数据验证 US$20B 标尺之前，证据只支持继续跟踪。
    data:
      nodes:
        - id: scale
          label: 规模证据：US$4.5B Series C 轮和 >1.5GW 签约订单
        - id: scarcity
          label: 稀缺性证据：AI 需求和电力约束
        - id: comp
          label: 可比证据：AirTrunk 加公开 REIT 锚点
        - id: gaps
          label: 缺口：收入、客户结构、债务和优先权条款
        - id: call
          label: 决策：跟踪 / 继续研究；US$20B 估值偏紧
      edges:
        - from: scale
          to: call
        - from: scarcity
          to: call
        - from: comp
          to: call
        - from: gaps
          to: call
    approximationNotes: 基于保留公开来源的定性决策流。
    claimRefs:
      - CV007
      - CV009
      - CV015
      - CV030
      - CV038
  - id: FV002
    title: 估值对执行驱动因素的敏感度
    type: bar
    layout: standard
    summary: 签约转化、供电交付和 IPO 市场胃口最牵动估值。
    data:
      items:
        - label: 签约转化
          value: 5
        - label: 供电交付
          value: 5
        - label: 每 MW 资本开支
          value: 4
        - label: 客户集中度
          value: 4
        - label: 债务 / 优先权压力
          value: 4
        - label: IPO 市场窗口
          value: 4
    approximationNotes: 敏感度采用 1–5 序数评分，来自证据判断，并非统计模型。
    claimRefs:
      - CV028
      - CV029
      - CV033
      - CV035
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据给出的区间很宽：大致从早前 US$10B 背景，到媒体报道的 US$20B IPO 标尺。
    data:
      items:
        - label: 熊市重置标尺
          low: 8
          high: 12
          unit: US$B
          note: 若执行或 IPO 市场转弱，回到早前 ~$10B 背景
        - label: 基准标尺
          low: 16
          high: 20
          unit: US$B
          note: 若未披露经济数据验证签约订单，估值介于合理到偏紧
        - label: 牛市延伸
          low: 20
          high: 28
          unit: US$B
          note: 需要签约转化、供电交付和持久稀缺溢价
    approximationNotes: 场景区间是基于报道估值标尺和可比背景推导的估算。
    claimRefs:
      - CV006
      - CV008
      - CV033
      - CV034
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: DayOne 在市场和规模上得分高，但估值证据质量偏低。
    data:
