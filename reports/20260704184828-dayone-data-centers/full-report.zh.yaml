  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与资产地图
        blocks:
          - type: paragraph
            body: >-
              DayOne 的产品最好理解为被包装成可复制区域平台的超大规模数据中心容量，而不是纯软件基础设施产品。客户购买或预留的是空间、电力、制冷、连接和运营可靠性，这些能力分布在 DayOne
              布局于受限需求池附近的园区。公开证据显示，DayOne 明确搭建了连接 Singapore、Johor 和 Batam 的 SIJORI 架构，并在 Hong Kong、Tokyo、Greater Bangkok
              和 Finland
              叠加更广的扩张层。服务流程从市场选择和容量承诺开始，进入土地和电力锁定，再使用预制交付和高密度制冷，最终成为带监控和可持续性主张的运营设施。因此，最强的产品资产是园区权益、公用事业互联、模块化建设能力、液冷诀窍，以及面向客户特定需求的高密度就绪度。公开材料不能证明每个数据厅都超过
              30 MW；支撑更好的说法是，选定园区和电力模块足够承载超大规模 AI 容量，而单个数据厅设计仍是尽调项。
