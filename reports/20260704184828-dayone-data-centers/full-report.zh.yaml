  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与在手订单代理指标
        blocks:
          - type: paragraph
            body: >-
              从财务上看，DayOne 不像软件初创，更像一家私营超大规模基础设施平台，经济引擎是已签约的电力、空间、制冷、连接和设施运营。公开记录没有 SKU 价目表、费率表或 GAAP
              收入桥。最强的收入信号反而是容量、市场位置和客户意向代理指标。DayOne 自己的材料把买家定义为需要速度、规模、时延和高密度 AI 基础设施的超大规模客户与企业；GDS
              对外包数据中心客户的公开描述也强化了这一点：这类业务通常通过长周期容量协议卖给云、互联网、金融和电信买家。投资判断中最重要的代理指标因此不是网站流量或客户数，而是已承诺 MW 和客户入驻。SIJORI
              战略在财务上有意义，因为 Singapore 容量稀缺且昂贵，Johor 和 Batam 则在靠近 Singapore 的位置提供扩张土地、电力和较低成本运营环境。尽管如此，没有留存来源披露 DayOne 的每
              kW 合同租金、续约条款、最低承诺、电力费用转嫁、客户集中度或在手订单转化时间表。Startup Fortune 报道的 1.5 GW
              预订数字如果被证实，会是重要在手订单信号；但在客户合同、贷款人资料包或管理层清单印证前，它仍是二手来源说法。
