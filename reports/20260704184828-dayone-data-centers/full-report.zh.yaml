    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与版图
        blocks:
          - type: paragraph
            body: >-
              DayOne Data Centers 更应被理解为一家总部位于 Singapore 的私营超大规模数据中心平台，而不是只有单一市场版图的传统托管运营商。公司称其成立于 2022
              年，为全球超大规模云厂商和企业开发下一代、高容量、AI 就绪园区。它的差异化在于造市场模式：DayOne 描述了一条自有 SIJORI 轴辐式走廊，把 Singapore 的连接能力、Johor
              的成本和土地优势、Batam 的扩张容量串在一起。官方市场页面显示平台已覆盖 Singapore、Johor、Batam、Hong Kong、Tokyo、Greater Bangkok 和
              Finland；2026 年 6 月最终 Series C 新闻稿又把 Spain 加入已披露的运营或开发名单。因此，这是一套重资本的容量前置开发平台：先于需求锁定土地、电力和许可，把园区打包成高密度 AI
              就绪供给，再把区域稀缺容量转化为超大规模客户的长期预订。公开证据最能支撑的是身份、市场和产品架构；具名客户、收入和精确利用率仍未公开。
