      - number: '1.3'
        title: 资本、估值与规模
        blocks:
          - type: paragraph
            body: >-
              DayOne 的资本形成在 2026 年明显提速。1 月，公司宣布已签署超过 US$2.0 billion 的 Series C 股权融资最终协议，由 Coatue 领投、INA 支持，价格较上一轮溢价
              100%，并建立在 US$1.9 billion 的 Series A/B 股权融资和最高 €1 billion 夹层融资之上。到 2026 年 6 月 5 日，DayOne 宣布最终 Series C
              关闭，规模为 US$4.5 billion，Coatue 和 Hillhouse 成为两大股东，INA 和 Achi Capital Partners 也在重要参与方之列。牵引指标也上了一个台阶：1 月材料提到约
              1GW 已锁定客户承诺，6 月最终关闭则披露成立以来总容量预订超过 1.5GW。独立报道给出了估值框架：Data Center Dynamics 和 Startup Fortune 描述了约 US$20
              billion 的 IPO 估值目标或据报估值，DCD 还报道称 MGX 曾探索收购，IPO 仍可能推进。US$20 billion
              应按报道口径处理，而不是公司确认口径；投资判断应落在已签约预订、电力获取和执行风险上，而不是仍未披露的收入指标上。
