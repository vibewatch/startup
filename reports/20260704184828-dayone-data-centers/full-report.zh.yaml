        - 最大的云和 AI 平台
        - 避开第三方利润率，也能优化自有架构
        - 需要站点、电力、建设、许可和资产负债表投入
    notes: 同业图谱基于公开来源，规模指标混合了运营、已承诺、已供电土地、AUM 和平台数量，不是同口径容量排名。
