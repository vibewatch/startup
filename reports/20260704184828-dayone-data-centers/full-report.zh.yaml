      - number: '1.2'
        title: 管理团队与治理
        blocks:
          - type: paragraph
            body: >-
              公开层面的管理团队信息集中，但以一家这个阶段的基础设施公司看，可信度不低。DayOne 官网列明 Lim Ah Doo
              为董事长，强调其在电信、科技、数据中心、基础设施、银行和投资领域超过四十年的经验，包括此前的董事会层面角色。Jamie Khoo 自 2024 年 3 月起担任 CEO，也是公司融资、TNB
              可再生能源合作和企业叙事中的核心经营声音。2026 年最重要的人事变化，是 Chengkang (CK) Yan 于 2026 年 6 月 30 日出任 CFO；他在 Hillhouse、KKR 和 Citi
              的背景直接相关，因为 DayOne 的增长要持续拿到机构资本、结构化债务、土地和电力。治理仍只露出一部分：Coatue 和 Hillhouse 现在是两大股东，INA 和 Achi 参与了最终 Series
              C，GDS 在 US$385 million 股份回购后仍为少数股东。董事会构成、保留事项、创始人经济利益和客户集中度治理均未披露；当 DayOne 权衡 IPO 或战略替代方案时，控制权与冲突将是关键尽调路径。
