      - number: '4.2'
        title: 融资历史与估值信号
        blocks:
          - type: paragraph
            body: >-
              融资材料强于运营指标材料。DayOne 自己的时间线披露了快速搭建的资本结构：约 $587 million Series A 融资、$1.2 billion Series B 融资、最高 EUR 1
              billion 用于 Finland 和全球扩张的夹层融资、RM15 billion Malaysia 多币种绿色融资，以及 2026 年超过 $2.0 billion 的 Series C 股权融资。GDS
              提交给 SEC 的 2026 年 1 月新闻稿是最干净的估值信号，因为它不只是新闻标题。GDS 称 DayOne 将以与 Series C 优先股发行相同的价格回购 $385 million 股份；这笔交易让
              GDS 收回了约 95% 的 DayOne 本金投入，投入资本回报倍数接近 6.5x，同时保留一笔隐含价值超过 $2.2 billion
              的持股。即使没有完整披露投后估值，这些事实也说明私募市场升值幅度可观。Startup Fortune 报道了更大的 $4.5 billion Series C、$20 billion 估值和可能的 $7
              billion 贷款，但这些数字置信度较低，因为此处留存的 DayOne 官方页面和 GDS 申报只印证了超过 $2.0 billion 的 Series C 以及 GDS
              出售机制。结论是投资者需求真实，但在看到股权表、优先权结构和债务融资细节前，不能依赖报道估值。
