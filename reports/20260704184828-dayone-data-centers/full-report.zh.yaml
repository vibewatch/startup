  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：有电力保障的超大规模容量，不是泛泛的 IT TAM
        blocks:
          - type: paragraph
            body: >-
              DayOne 应放在有电力保障、联网、AI 就绪的数据中心园区市场中判断，这些园区卖给超大规模云、AI 基础设施和大型企业买家；不应拿泛泛的数字化转型 TAM
              来套。纳入的支出包括批发托管容量、有电力接入的壳体或定制园区容量、互联、高密度制冷和站点级能源集成。排除的支出包括客户自有 GPU 和服务器、云软件收入、消费者连接和一般 IT 外包。这个边界很重要，因为
              DayOne 自己的卖点不是软件工作流，而是地理和电力平台：它把 Singapore、Johor 和 Batam 聚成 SIJORI，再加入 Thailand、Tokyo、Hong Kong 和 Finland
              作为容量节点。因此，市场很大，但采用不取决于简单软件渗透曲线，而取决于电力交付、土地、许可、制冷、时延和客户预承诺。可操作的投资框架是一类受约束的基础设施市场：客户可能到处都想要云容量，但 DayOne
              只有在能比同行更快把站点控制、电网接入和时延转化为签约容量时，才会赚到有吸引力的回报。
