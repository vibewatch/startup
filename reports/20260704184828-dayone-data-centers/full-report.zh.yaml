  - id: TV006
    title: 最终尽调问题表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入转化
        - 按园区列示的已签约收入、期限、爬坡和利用率
        - 决定已预订 MW 能否支撑估值
        - 要求数据室提供客户-园区明细表
      - - 客户集中度
        - 具名超大规模客户 / 企业敞口和头部客户占比
        - 单一客户风险会重定价平台倍数
        - 审阅合同和信用支持
      - - 项目融资
        - 债务契约、成本、摊销和担保组合
        - 优先索偿可能压低股权上行
        - 审阅授信协议和贷款方模型
      - - 优先清偿权结构
        - 清算优先权、转换条款和反稀释
        - 入场价格不等于普通股经济性
        - 审阅章程、股东协议和股权结构表
      - - 资本开支与电力
        - 并网日期、完工所需资本开支、EPC 条款
        - 电力是稀缺估值驱动因素
        - 第三方工程和公用事业尽调
      - - 退出计划
        - 投行委任、招股书草稿指标、上市地选择
        - 决定 IPO 概率和估值区间
        - 会见投行并审阅申报时间表
    notes: 必须完成这些尽调问题，才能从跟踪 / 继续研究推进到可投资。
