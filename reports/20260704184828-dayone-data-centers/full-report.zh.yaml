      - number: '7.2'
        title: 各司法辖区的电力、电网与许可风险
        blocks:
          - type: paragraph
            body: >-
              本章风险清单里，大多数项目最终都卡在电力。新加坡政府明确在管理发电充足性和太阳能间歇性， 因此投资人应把 20 MW DC-CFA 配额和首个 SOFC 概念验证视为需要持续跟踪的里程碑，
              而不是已经去风险的容量权益。马来西亚更偏扩张，但 MIDA 自身材料说明了电力和用水为何正在变成政策变量： 柔佛已占据运行中 IT 容量主导，全国数据中心需求到 2035
              年可能大幅增长，材料还称电网加固成本很高。 香港和欧洲呈现了同一约束的另一面：便利措施和法律透明度有帮助，但土地处置、报告、余热和可持续性 KPI 会变成正式义务。
