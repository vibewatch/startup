          unit: /5
        - label: 规模 / 签约订单
          value: 5
          unit: /5
        - label: 融资能力
          value: 4
          unit: /5
        - label: 护城河 / 稀缺性
          value: 4
          unit: /5
        - label: 执行风险
          value: 2
          unit: /5
        - label: 估值证据质量
          value: 2
          unit: /5
        - label: 退出准备度
          value: 3
          unit: /5
    approximationNotes: IC 序数评分：除风险按可投资性反向计分外，分数越高越好。
    claimRefs:
      - CV022
      - CV023
      - CV025
      - CV031
      - CV037
      - CV040
