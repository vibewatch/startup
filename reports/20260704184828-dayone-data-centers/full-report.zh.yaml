      - - Equinix
        - 全球既有龙头 / 互联平台
        - 全球 281 座数据中心；亚太 63 个设施；10,500+ 客户
        - 企业、网络、云、AI 推理和 xScale 训练
        - 全球生态和互联密度远高于 DayOne
        - 可能不如 DayOne 聚焦单一 SIJORI 绿地超大规模走廊
      - - Digital Realty
        - 全球既有龙头 / 平台型托管
        - 全球 300+ 座数据中心；亚太 20+ 座数据中心；亚太 230+ 已连接客户
        - 混合云、AI、企业、服务提供商和托管买方
        - PlatformDIGITAL、广泛亚太云 / 服务提供商生态、高密托管
        - 公开页面未披露市场层面批发价格或已承诺 MW
      - - Princeton Digital Group
        - 泛亚洲超大规模专家
        - 亚洲七国平台；披露 US$1.8B 绿色 / 可持续发展挂钩贷款
        - 亚洲云和 AI 超大规模客户
        - 与新加坡-柔佛-巴淡直接重叠，公用事业 / 电力叙事相近
        - 公开容量总量与 DayOne 的 MW 指标不可完全横比
      - - Bridge Data Centres
        - 东南亚 / 南亚超大规模运营商
        - 布局马来西亚、泰国和印度；马来西亚页面列出 MY01 / MY02 / MY03 / MY06 / MY07
        - 云服务商、超大规模和企业买方
        - 马来西亚毗邻新加坡；先进冷却；模块化基础设施
        - 所有权 / 资本深度和实时已签约 MW 需要统一口径
      - - AirTrunk
        - 规模化亚太 / APME 超大规模平台
        - A$24B Blackstone / CPP 交易；已承诺 800 MW+；土地可支撑未来 1 GW+ 增长
        - 云、内容和大型企业客户
        - 资本背书最强的亚太超大规模标杆；已供电土地规模
        - 最大威胁是可能在区域电力和土地储备上比 DayOne 更能砸钱
      - - Keppel DC REIT
        - 数据中心 REIT / 资产所有者
        - S$6.3B AUM；10 个国家 25 座数据中心
        - 通过资产组合服务数据中心地产投资者和租户
        - 资本市场和资产所有权参照，尤其可比新加坡敞口
        - 作为超大规模园区运营开发商，可比性较弱
