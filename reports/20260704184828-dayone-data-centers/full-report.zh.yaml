        blocks:
          - type: paragraph
            body: >-
              各市场的运营架构有清晰模式。DayOne 先锁定土地、电网接入、监管支持和连接；再用模块化预制压缩部署时间；随后围绕电力密度、制冷方式、韧性和管理软件配置技术边界。公司称其模块化方法每年最多可制造 2,500
              个模块、最高 500 MW，Johor 项目达到 8.5 个月绿地交付。GDS 的公开申报也独立呼应了同一架构，称 DayOne
              使用高密度、支持液冷的设计，可再生和低碳路径，以及快速部署的预制模式。基础设施管理平台增加了一层软件，用于实时能源、热管理和系统健康监控，但公开材料没有暴露 API、可用性遥测、故障域设计或站点级
              PUE。因此，对一家私营数据中心平台而言，其交付模型看起来异常具体；但运营证据仍需要客户尽调包支撑。
