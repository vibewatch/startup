            body: >-
              退出准备度可信但不完整。Reuters/Straits Times 和 Bloomberg/Yahoo 报道指向美国以及潜在新加坡上市路径； AirTrunk 出售也说明，如果 IPO
              时点恶化，战略基础设施买家仍有胃口。不过，留存材料没有公开招股书、 经审计的 DayOne 独立财务包、客户排期或详细优先权结构。投委会因此应把 2026 年 IPO 视为选项，而非基础承销退出。
              投资前，尽调必须拿到按园区拆分的合同收入和利用率、具名客户集中度、完工所需资本开支和互联排期、债务契约、 清算优先权，以及 IPO 定价低于 US$20 billion
              时的敏感性。无法提供这些材料，本身就是投资论点破裂信号。
