companyProfile:
  summary: >-
    DayOne Data Centers 是一家总部位于 Singapore、2022 年成立的独立超大规模数据中心平台，由 CEO Jamie Khoo 领导。它卖的不是软件服务，而是面向 AI
    的园区、供电、制冷、连接和可持续基础设施组合，服务 Singapore、Johor、Batam、Hong Kong、Tokyo、Thailand 和 Finland 等地的超大规模云厂商与企业。到 2026 年 6 月，公司已完成
    US$4.5B Series C，称在亚太和欧洲累计预订超过 1.5GW，独立报道也在讨论其潜在 US$20B IPO
    估值。核心投资判断难点在于：这些规模信号确实存在，但公开材料仍缺少验证这一高估值所需的收入、利润率和客户集中度披露。
  foundedDate: '2022-01-01'
  foundingLocation: Singapore
  headquarters: Singapore
  productSummary: DayOne 开发并运营超大规模数据中心园区，采用模块化交付，配置高密度供电与制冷、连接能力，以及可再生能源采购、部分 SOFC 能源试点等可持续特性。
  customerFocus: 需要在亚太和欧洲电力、时延受限市场获得高密度容量的超大规模云厂商、云服务商、AI 基础设施买家和大型企业。
  businessModel: 长周期托管和超大规模容量合同，加上相关园区开发、供电配置、基础设施运营和可持续能源解决方案。
  stage: Late-stage private / Series C
