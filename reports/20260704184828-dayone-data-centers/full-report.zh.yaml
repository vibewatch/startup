  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 严重性排序与投资论点影响
        blocks:
          - type: paragraph
            body: >-
              DayOne 最大的风险不是某个司法辖区的单点缺陷，而是在电力受限、政策敏感的市场里同步铺开超大规模平台。 SG1 许可和 SOFC 试点有战略价值，但它们也把尚未验证的现场供电执行风险带进一个 EMA
              正在主动管理发电充足性的市场。 柔佛的规模已经足以成为容量集中点，也会吸引电网和用水审查；巴淡、春武里、府中、香港和芬兰又各自叠加本地许可、土地、公用事业和披露依赖。
              投资含义是：风险侧应保持继续研究。估值上行取决于能否把已承诺电力和订单转成可计费、已获许可、可再生能源支撑的容量，同时不出现超支或政策反弹。
              排序也纳入来源质量：公司披露能勾勒项目地图，监管机构和备案文件则界定可能推翻乐观爬坡假设的约束。
