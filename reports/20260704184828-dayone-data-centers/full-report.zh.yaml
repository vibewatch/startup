      - 竞争含义
    rows:
      - - DayOne
        - 零碳旅程；环境绩效、社会责任和治理三大支柱；柔佛 LEED 认证
        - 公司历史提到可接入可再生能源的基础设施、液冷、模块化预制和 TNB MOU
        - 叙事不错，但还需要园区级 PPA、WUE 和隐含碳证明
      - - Equinix
        - 96% 可再生能源覆盖率，2020 年以来发行 US$9.5B 绿色债券
        - 能源供应、水、循环利用和隐含碳举措
        - 对 ESG 要求严格的企业和云买家，采购门槛被抬高
      - - Digital Realty
        - 可持续领导者定位，高密度能效叙事
        - 高密度托管称 PUE 更低，并提供液冷选项
        - ESG 平台可信，但保留来源缺少 APAC 园区级可再生能源细节
      - - PDG
        - 2030 年前 Scope 1 和 Scope 2 净零；US$1.8B 绿色 / 可持续挂钩贷款
        - 与公用事业和可再生能源供应商建立战略联盟
        - 与 DayOne 以电力驱动的超大规模定位非常接近
      - - Bridge Data Centres
        - 采用 RE100 可再生能源，节水技术，循环资源利用
        - 先进冷却、模块化建设和 AI 驱动运营
        - 东南亚同业，可持续话术相似
      - - AirTrunk
        - 100% 可再生能源匹配，2030 年前 Scope 1 和 Scope 2 净零
        - 声称 PUE 低于 1.2，聚焦能源 / 用水效率
        - 规模和 Blackstone 支持让其可持续主张具有商业威胁
      - - 市场约束
        - CBRE 和 JLL 将电力约束和并网延迟列为核心瓶颈
        - 表后电力、电池储能和直接能源融资正在成为应对方式
        - 只有在已依法签约且可交付时，电力接入才是护城河
    notes: 本表比较的是公开承诺，不是经审计的园区级排放结果；私下 PPA 和公用事业数据仍是关键尽调事项。
