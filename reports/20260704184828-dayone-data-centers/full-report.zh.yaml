              锁定超过 1 GW 可再生能源。Singapore 增加了 Sembcorp PPA、SOFC 概念验证、NUS 热带数据中心研发，以及计划申请的 LEED / BCA Green Mark
              Platinum。Johor 有可见的 LEED 记录，包括 NTP1 Platinum 和若干 2026 年 Platinum 认证。Finland 贡献余热回收和零淡水制冷。信任控制在公开材料中更薄：Hong
