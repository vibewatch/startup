        - 面向 AI 的超大规模园区，商业模式灵活
        - 已披露 US$1.8B 绿色 / 可持续挂钩贷款
        - 最接近的泛亚洲私营挑战者；融资可见，但不完全可比
      - - AirTrunk
        - 没有公开实际成交价格
        - 面向云、内容和大型企业客户的超大规模园区
        - A$24B 交易；Blackstone/CPP 支持；引用 800MW 已承诺容量
        - 抬高 DayOne 融资能力和区域扩张速度的门槛
      - - Keppel DC REIT
        - REIT 财务指标，不是租户价目表
        - 产生收入的数据中心资产，包括全装修资产和壳 / 核心资产
        - S$6.3B AUM，上市 REIT 架构
        - 可作资本 / 资产参照；对运营方案的直接可比性较弱
      - - 市场代理变量
        - CBRE 新加坡 250-500kW 容量为 US$310-$470/kW/month
        - 批发 / 托管市场参照，不是具体供应商价格
        - 供应和电力受限时，价格上行
        - 仅可作代理变量；投资测算仍需要私下报价
    notes: 定价行区分供应商交付方案和市场租金代理变量；任何一行都不应被解读为 DayOne 或同业合同的实际成交价格。
