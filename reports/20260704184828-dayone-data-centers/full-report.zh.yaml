  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与同行图谱
        blocks:
          - type: paragraph
            body: >-
              DayOne 所在的数字基础设施市场拥挤但分层。最接近的直接同行不是泛泛的托管房东，而是在亚太市场能锁定电力、土地、模块化建设和可再生能源路径的超大规模园区开发商。PDG、AirTrunk、Bridge Data
              Centres 和 STT GDC 最贴近这类需求，Equinix 和 Digital Realty 则凭全球平台广度、客户生态和互联深度竞争。Keppel DC REIT
              更适合作为资产持有人和资本市场同行，而不是纯运营替代品，因为其披露战略聚焦数据中心房地产资产、托管 /
              单租户资产、壳体与核心工程资产，以及有纪律的组合资本回收。维持现状和内部自建也仍是超大规模客户的真实替代方案：JLL
              明确预期超大规模客户会继续同时使用租赁和自建策略。结果是一个双轴市场：一端是全球生态广度，另一端是电力驱动的 APAC 超大规模执行能力。
