            body: 1GW 承诺披露、Firmus Batam 证据和多个电力支持园区支撑强需求，但公开来源仍不披露客户级经济性。
            calloutType: strength
            claimRefs:
              - CU004
              - CU020
              - CU030
          - type: callout
            title: 无法排除集中度
            body: 超大规模数据中心需求常集中在少数大买家；DayOne 没有公开披露最大客户收入占比、按客户拆分的 MW 或流失率。
