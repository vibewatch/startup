      - number: '7.3'
        title: 氢能 / SOFC、供应链与 ESG 声明风险
        blocks:
          - type: paragraph
            body: >-
              SOFC 路线值得跟踪，但现在就把它写进已解决的脱碳路径还太早。DOE 和 Bloom 支持一个技术判断： 燃料电池可以提供高效率的现场供电；但氢能的气候价值取决于生产路径和到场燃料可得性。 DOE
              称大多数氢来自天然气重整，这让燃料来源证明成为尽调闸口。DayOne 的可持续路线图包括可再生能源 PPA 和 2030 年目标， 但首份可持续发展报告排到 2026 年，投资人仍需要经审计的站点级
              PUE、WUE、可再生能源匹配、排放和余热证据。 供应商控制能降低建设和合规风险，但供应商准则本身也说明：审计、制裁、出口管制和环境证据必须随着建设计划一起扩容。
