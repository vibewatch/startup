        - 电力延误或客户流失会打断转化
      - - 基准
        - 平台强；私有经济性只能验证部分溢价
        - US$20B 属于合理到偏紧；需要结构保护或折扣
        - Series C 和市场稀缺性真实，但披露不完整
        - 招股书或数据室显示收益率更低
      - - 悲观
        - IPO 市场转弱；资本开支 / 电力延误；集中度高
        - 需向早前约 US$10B 参照重置，或要求降价轮保护
        - 电力约束且未披露利润率
        - 重大并网或融资契约落空
    notes: 区间只是情景标记，不是 DCF；公开来源缺少收入和利润率输入。
