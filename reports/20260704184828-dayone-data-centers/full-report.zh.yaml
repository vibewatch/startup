      - number: '1.5'
        title: 里程碑、负面信号与证据缺口
        blocks:
          - type: paragraph
            body: >-
              里程碑记录支撑了一个快速搭建的平台故事，也暴露出尽调仍有多少内容要依赖私有材料。DayOne 的历程从 2021 年在 Batam 和 Johor 拿地开始，之后是 2022 年 Singapore
              总部、2023 年 Singapore 容量配额、2024 年进入 Japan 和 Thailand、2025 年 Finland 和融资里程碑，以及 2026
              年多个园区、资本和合作事件。这条时间线内部一致，也得到独立融资和容量报道印证。最大缺口不是身份缺证据，而是身份背后的经济性。公开来源没有披露收入、ARR、经常化收入规模、利润率、员工数、具名超大规模客户、合同期限、客户集中度、已签约容量与保留容量的区分、项目级
              PUE，或 IPO / MGX 替代方案的治理条款。负面研究也发现了广泛的数据中心反对声音和资源使用风险，但截至运行日期，没有留存来源记录 DayOne 特定的诉讼、制裁、宕机或社区纠纷。因此，本章确认
              DayOne 是一个资金充足、扩张很快的 AI 基础设施平台，同时明确把客户质量、盈利能力和执行力的最终判断保留到资料室证据可得之后。
