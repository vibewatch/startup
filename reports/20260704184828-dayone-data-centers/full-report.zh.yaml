      - number: '1.4'
        title: 基础设施合作与监管暴露
        blocks:
          - type: paragraph
            body: >-
              运营故事越来越取决于 DayOne 能否比竞争对手更快把稀缺土地和电力转化为已交付 MW。Data Center Dynamics 报道其在役和在建容量超过 500MW，另有超过 500MW
              留作未来开发；DayOne 自己的历程则提到 NTP Johor、HK1 客户入驻、SG1 破土、Chonburi Tech Park、Tokyo 一期，以及 Batam 的 Nongsa Digital
              Park 34MW。在 Malaysia，DayOne 与 TNB 旗下实体签署可再生能源供应协议，覆盖约 1.5GWp 太阳能和 2.2GWh 电池储能，并称已通过 TNB 合作锁定超过 1GW
              可再生能源。Indonesia 正同时成为 DayOne 的市场和伙伴生态：独立报道描述了 Firmus 在 NVIDIA 支持下计划建设 360MW、170,000-GPU 的 Batam AI
              数据中心，DayOne 为基础设施伙伴。负面一面不是已审阅来源中的公司特定法律事件，而是结构性风险：数据中心正因电网压力、水、噪音、排放和土地使用受到政策审视，Singapore
              也在加强可持续性和韧性治理。因此，电力合同、许可、社区沟通和可用性治理都是核心尽调项，不是 ESG 脚注。
