      - number: '4.3'
        title: 资本开支强度与单位经济
        blocks:
          - type: paragraph
            body: >-
              DayOne 的公开财务故事由资本强度主导。JLL 2026 年预测显示，壳体与核心工程建设每 MW 需要 $11.3 million，AI 机房装配还可能达到每 MW $25 million，这解释了为什么
              DayOne 要把股权与绿色融资、夹层设施以及可能的项目级债务配在一起。公司可能有建设速度优势：它称自己拥有全球最大模块化解决方案之一，最高 2,500 个模块和 500 MW 年度制造能力，并在 Johor
              NTP 项目实现 8.5 个月绿地交付。公司还称自 2020 年以来已部署超过 300 MW 液冷站点，并用 NVIDIA GB200 NVL72 系统做了单柜 130 kW 以上试点。这些细节重要，因为 AI
              密度会把制冷、供电和供应链控制变成直接利润率驱动因素。不过，公开材料仍没有披露利用率、实际每 kW
              租金、电力转嫁利润率、能源采购成本、折旧、维护资本开支、土地成本基础、各园区建设成本或稳定后成本收益率。Digital Realty 和 Equinix 等公开可比公司会在审计文件中披露这些类别；DayOne
              不披露。最佳投资判断姿态因此是情景化：把已签容量视为收入先行指标，用市场基准测算建设和客户侧装配成本，并要求管理层在判断自由现金流前提供站点级开发预算和客户合同。
