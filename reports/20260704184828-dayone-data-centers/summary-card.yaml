  topStrengths:
    - >-
      DayOne has assembled rare capital support, including Coatue-led Series C financing, GDS linkage, and
      infrastructure debt/mezzanine capacity.
    - >-
      The SIJORI strategy gives DayOne a differentiated way to serve Singapore-constrained hyperscale demand through
      Johor and Batam spillover.
    - >-
      Publicly disclosed bookings and commitments indicate real AI/cloud demand rather than purely speculative land
      banking.
    - >-
      Sustainability-linked positioning, renewable-energy contracting, and modular delivery may help win constrained
      hyperscale deployments.
  topRisks:
    - >-
      Revenue, margin, cash burn, contract pricing, and customer concentration remain private, making the reported IPO
      valuation difficult to underwrite.
    - >-
      Multi-jurisdiction execution depends on power availability, permits, and on-time delivery across Singapore,
      Malaysia, Indonesia, Thailand, Japan, Hong Kong, and Finland.
    - >-
      The sustainability thesis relies partly on future renewable procurement and SOFC/hydrogen deployment that is
      promising but not yet proven at full platform scale.
    - >-
      A premium mark could compress if public markets re-rate digital infrastructure or if DayOne pursues an IPO before
      operating metrics are better disclosed.
    - >-
      Expansion appears tied to a small number of very large hyperscale/AI customers whose contract quality, tenure, and
      churn data remain undisclosed.
  unresolvedGaps:
    - Audited or management-level revenue, EBITDA, cash, debt-service, and margin data for 2025-2026.
    - >-
      Customer-level lease terms, utilization, concentration, and retention for the 1.0-1.5GW committed/booked capacity
      base.
    - Site-level proof of hall density, liquid-cooling deployment, uptime performance, and SOFC operating economics.
    - Detailed terms of the mezzanine/green-financing stack, including covenants, security, and cost of capital.
    - >-
      Confirmation of IPO timing, listing venue mix, and whether the US$20B marker reflects firm banked demand or only
      aspirational positioning.
