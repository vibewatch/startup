- id: TM003
  title: DayOne geography scorecard
  columns:
  - Geography
  - DayOne claimed capacity / status
  - Market pull
  - Constraint to diligence
  - Market implication
  rows:
  - - Singapore
    - 20 MW approved Jurong East; 2027 RFS; SOFC/hydrogen proof-of-concept
    - Premium connectivity, low vacancy, high pricing
    - Land/power finite; execution of emerging power technology
    - Innovation and anchor hub rather than bulk capacity alone
  - - Johor, Malaysia
    - NTP/KTP; company claims >478 MW operational and 390 MW in service metric on page
    - Singapore spillover, land, power-ready sites
    - Grid, water, PUE/WUE standards and pace of new supply
    - Scale valve for SIJORI if power milestones hold
  - - Batam, Indonesia
    - 72 MW Nongsa Digital Park campus; 2025 onward RFS
    - SEZ, low-cost proximity and submarine cable access
    - Need corroboration of customer demand and grid robustness
    - Useful extension node, but weaker independent proof than Johor
  - - Greater Bangkok / Chonburi
    - 300 MW campus; 2026 RFS; company describes path to 1 GW platform
    - Thailand digital economy growth and regional bridge
    - Power procurement, competition and policy execution
    - Potential new growth node if preleases materialize
  - - Tokyo / Fuchu-Kodaira
    - 80 MW across two sites; 2028 RFS
    - Large APAC market, latency and AI/start-up demand
    - Power/land scarcity and long development timeline
    - Attractive but later-cycle capacity
  - - Hong Kong / Kwai Chung
    - 66 MW carrier-neutral urban cluster; 2023 onward RFS
    - Financial services, logistics, cross-border connectivity
    - Land scarcity and competitive urban redevelopment
    - Good interconnection hub; not obvious bulk-growth market
  - - Finland / Lahti-Kouvola
    - 281 MW renewable-powered two-campus platform; 2026 onward RFS
    - Nordic renewable power, cool climate, heat recovery
    - Customer commitments and grid/heat-reuse economics not public
    - European sustainability hedge and diversification
  notes: Company capacity claims are retained as company-claimed unless corroborated by independent government or analyst
    sources.
