  rows:
  - - Wholesale colocation / hyperscale campus
    - Powered data hall capacity, cooling, physical security, connectivity
    - Customer servers, GPUs, cloud software revenue
    - Cloud and AI infrastructure capacity teams
    - Core market boundary for DayOne campuses
  - - Powered shell / build-to-suit
    - Land, permits, substations, shell, customer-specific fit-out coordination
    - Customer applications and model training revenue
    - Hyperscaler real-estate and infrastructure finance
    - Relevant where customers precommit large MW blocks
  - - Interconnection and low-latency hubs
    - Carrier-neutral meet-me rooms, fiber routes, subsea access
    - Consumer broadband and generic telecom services
    - Network architects and cloud edge teams
    - Critical to Singapore, Hong Kong, Batam and Tokyo positioning
  - - Energy-integrated data centers
    - Renewable PPAs, on-site power trials, heat reuse, efficiency systems
    - Utility-scale generation not tied to campus load
    - Sustainability, procurement and infrastructure buyers
    - Key for Singapore SOFC and Finland renewable narrative
  - - Status quo substitutes
    - Enterprise owned data rooms, self-built hyperscale campuses, incumbent colocation
    - General IT outsourcing and SaaS subscriptions
    - CIO, CTO, cloud infrastructure and finance
    - Defines competition beyond named data-center operators
  notes: Boundary separates DayOne-addressable capacity from customer IT hardware/software and generic digital-economy spend.
