- id: buyers-adoption-and-constraints
  title: 'Buyers, adoption path and constraints: speed-to-power is the purchase trigger'
  body: 'The buyer is rarely a single user. Cloud capacity planners, AI platform teams, network architects, sustainability
    officers, finance and real-estate infrastructure leaders all influence the purchase, and the budget often spans capacity
    reservation, construction commitments, power procurement and technical fit-out. Adoption begins when a customer forecasts
    workload demand, then narrows to latency zones, sovereignty needs, power availability, rack density and carbon requirements.
    DayOne’s claimed advantages—prefabricated delivery, liquid cooling, SOFC trials, renewable PPAs and multi-market expansion—map
    well to that funnel. However, public evidence does not reveal contracted customers, occupancy, utilization, achieved pricing
    or campus-level returns, so a precise SOM remains unavailable. The diligence answer is to treat the market as structurally
    attractive but execution-sensitive: verify grid milestones, customer preleases, utility contracts, PUE/WUE performance,
    and the cost of meeting customer sustainability requirements. In diligence, the decisive proof is not another market-size
    chart but a conversion bridge from forecast workloads to signed reservations, energization milestones, cooling performance
    and customer-specific deployment dates.'
