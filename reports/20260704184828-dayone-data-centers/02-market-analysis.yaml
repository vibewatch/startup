- id: geographic-expansion-context
  title: 'Geographic context: SIJORI plus selective APAC and Nordic nodes'
  body: 'DayOne’s most differentiated market logic is SIJORI. Singapore supplies connectivity, enterprise trust and premium
    pricing, but land and power limits make very large single-market deployments hard. Johor then becomes the scale valve,
    with MIDA reporting that 78.6% of Malaysia’s operational IT capacity is already in Johor and DayOne claiming hundreds
    of megawatts across NTP and KTP. Batam adds a lower-cost, SEZ-based node close to Singapore with submarine-cable access.
    Outside SIJORI, Thailand offers a government-backed digital-economy setting and a large Chonburi campus thesis; Tokyo
    offers demand density and latency; Hong Kong offers financial-market and cross-border connectivity but limited land; Finland
    offers renewable-power and waste-heat positioning for European customers. These locations make the market attractive,
    yet each also carries a distinct bottleneck: grid buildout, water, permitting, customer concentration or execution timing.
    This creates a portfolio question rather than a single-market answer: Singapore anchors trust and latency, while adjacent
    or renewable-rich nodes must prove they can absorb workloads without sacrificing performance, compliance or carbon objectives.'
