- id: TM005
  title: Growth drivers, constraints and diligence asks
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI and cloud capacity growth
    - Driver
    - 2026-2030
    - Raises demand for large powered campuses
    - Request signed LOIs, preleases and pipeline conversion by campus
  - - Power availability and grid-connection waits
    - Constraint
    - Current and structural
    - Determines which markets can actually deliver MW
    - Verify utility agreements, energization dates and penalties
  - - Singapore scarcity and pricing
    - Driver and constraint
    - Current
    - Supports SIJORI spillover but caps domestic bulk growth
    - Confirm customer willingness to use Johor/Batam as substitutes
  - - Johor and Malaysia grid/water standards
    - Constraint
    - 2025 onward
    - Could slow or raise cost of large campus delivery
    - Review PUE/WUE compliance plan and local water/power allocations
  - - On-site / low-carbon power models
    - Driver
    - Current to medium term
    - Can differentiate with sustainability-sensitive buyers
    - Diligence SOFC performance, renewable PPAs and electricity-import strategy
  - - Community opposition and moratorium risk
    - Constraint
    - Current and rising
    - Can block greenfield development even where demand is strong
    - Map permitting, community engagement and local political risk
  - - Liquid cooling and high rack density
    - Driver
    - Current
    - Improves fit for GB200-class AI deployments
    - Request operating data, failure rates and customer acceptance evidence
  - - Customer and pricing opacity
    - Constraint
    - Current
    - Prevents public SOM and margin validation
    - Obtain contracted MW, price/kW, churn and utilization data
  notes: Constraints are intentionally mixed with drivers because data-center adoption depends on both demand and deliverable
    powered capacity.
