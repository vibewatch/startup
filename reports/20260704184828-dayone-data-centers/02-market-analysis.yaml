  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: SOM-gap
    missingEvidence: Campus-level contracted MW, occupancy, utilization, price per kW, customer concentration and remaining
      power rights.
    whyItMatters: Without these data, DayOne’s true SOM and near-term revenue capacity cannot be derived from public market
      forecasts.
    diligencePath: Request management data room exports for each campus covering signed capacity, optioned capacity, energized
      capacity and pricing.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
    - TM005
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named customer case studies or third-party procurement records validating large hyperscale commitments
      by campus.
    whyItMatters: Market attractiveness depends on whether DayOne has converted demand into committed capacity rather than
      speculative pipeline.
    diligencePath: Ask for top customer contract abstracts and independently verify at least three deployments or reservations.
    relatedQuestionRefs:
    - QM017
    - QM024
  - type: conflicting-data
    severity: minor
    topic: Johor-capacity
    missingEvidence: Reconciliation between DayOne page metrics that cite 390 MW in-service and over 478 MW operational capacity.
    whyItMatters: Different capacity definitions may mix IT load, facility load, operational capacity and total planned capacity.
    diligencePath: Have management define each MW metric and map it to energized IT load, committed load and total campus
      design load.
    relatedQuestionRefs:
    - QM009
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: power-and-water
    missingEvidence: Utility letters, substation delivery schedules, water permits and PUE/WUE design guarantees for Johor,
      Batam, Thailand and Tokyo.
    whyItMatters: Power and water are the binding constraints for hyperscale delivery and can delay revenue recognition.
    diligencePath: Review utility interconnection agreements, milestone payments, water availability letters and local authority
      approvals.
    relatedQuestionRefs:
    - QM015
    - QM020
    - QM025
    relatedTableRefs:
    - TM005
  - type: stale
    severity: minor
    topic: market-forecasts
    missingEvidence: Updated analyst estimates for 2026 second half after AI inference demand, tariffs, interest rates and
      grid-queue changes are clearer.
    whyItMatters: Market forecasts can change quickly when power, GPU supply or capital markets shift.
