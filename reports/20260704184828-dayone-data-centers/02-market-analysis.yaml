slug: dayone-data-centers
runDate: '2026-07-04'
company:
  name: DayOne Data Centers
chapter:
  number: 2
  title: Market Analysis
  summary: 'DayOne sits in an attractive but highly constrained market: AI and cloud demand are driving a global data-center
    buildout, while power, land, grid queues and sustainability requirements determine which campuses can actually monetize
    demand. The strongest market logic is SIJORI spillover from Singapore into Johor and Batam, plus selective Thailand, Tokyo,
    Hong Kong and Finland nodes; the largest diligence gap is whether public capacity claims translate into contracted, energized,
    profitable MW.'
sections:
- id: market-boundary
  title: 'Market boundary: powered hyperscale capacity, not a generic IT TAM'
  body: 'DayOne should be underwritten against the market for powered, networked, AI-ready data-center campuses sold to hyperscale
    cloud, AI infrastructure and large enterprise buyers, rather than against a loose digital-transformation TAM. The included
    spend is wholesale colocation capacity, powered shell or build-to-suit campus capacity, interconnection, high-density
    cooling and site-level energy integration. Excluded spend includes customer-owned GPUs and servers, cloud software revenue,
    consumer connectivity and general IT outsourcing. This boundary matters because DayOne’s own pitch is not a software workflow
    but a geography-and-power platform: it clusters Singapore, Johor and Batam into SIJORI and adds Thailand, Tokyo, Hong
    Kong and Finland as capacity nodes. The market is therefore large, but adoption is gated by power delivery, land, permits,
    cooling, latency and customer precommitments rather than by simple software adoption curves. The practical underwriting
    frame is therefore a constrained infrastructure market: customers may want cloud capacity everywhere, but DayOne only
    earns attractive returns where it can convert site control, grid access and latency into contracted capacity faster than
    peers.'
  claimRefs:
  - CM001
  - CM012
  - CM023
  - CM031
  - CM039
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: demand-and-sizing
  title: 'Demand and sizing: AI creates a supercycle, but the usable SAM is power-constrained'
  body: 'The strongest market evidence is the convergence of three independent signals: JLL’s 2026 outlook calls for roughly
    100 GW of new capacity between 2026 and 2030, CBRE reports tight vacancy and persistent preleasing in major hubs, and
    the IEA says data-centre, AI and crypto electricity use could double by 2026. For DayOne, the broad TAM is global hyperscale
    and colocation capacity, while the practical SAM is APAC plus selected European markets where the company can secure power,
    land and permits. APAC is particularly relevant: JLL forecasts regional capacity rising from 32 GW to 57 GW by 2030, and
    CBRE identifies Tokyo, Johor and Batam as positioned for AI-related demand or spillover transactions. The attractive feature
    is scarcity value in powered sites; the adverse feature is that every credible competitor is chasing the same bottleneck.
    The chapter deliberately avoids a single headline TAM because broad forecasts can overstate opportunity when interconnection
    queues, substation lead times and customer fit-out budgets determine which megawatts become revenue-bearing supply.'
  claimRefs:
  - CM002
  - CM003
  - CM004
  - CM006
  - CM007
  - CM008
  - CM032
  - CM033
  - CM040
