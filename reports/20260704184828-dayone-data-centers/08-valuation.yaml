- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence support
  - What would change the view
  rows:
  - - 'Thesis: scarce APAC-Europe AI infrastructure platform'
    - US$4.5B Series C final close and >1.5GW bookings
    - Bookings fail to become binding revenue or capacity slips materially
  - - 'Thesis: strong capital access'
    - Equity plus up-to-€1B mezzanine facility
    - Debt terms or preferences consume common upside
  - - 'Thesis: private comp support'
    - AirTrunk A$24B transaction for committed MW and land bank
    - Comp evidence weakens if AirTrunk economics prove non-comparable
  - - 'Anti-thesis: valuation front-runs disclosure'
    - No public revenue, EBITDA, customer concentration or cap-table terms
    - Audited financials show attractive yields and diversified customers
  - - 'Anti-thesis: power and construction bottlenecks'
    - CBRE, Cushman and Goldman highlight power constraints
    - Interconnection milestones and fixed-price construction contracts de-risk builds
  notes: 'Arguments are price-sensitive: they support tracking, not unconditional buying.'
