- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - '>1.5GW bookings convert, Finland/APAC deliver on time, IPO window open'
    - US$20B+ can be defended if scarcity premium persists and revenue quality is proven
    - Final Series C demand and AirTrunk precedent
    - Power delay or customer churn breaks conversion
  - - Base
    - Strong platform; private economics validate only part of the premium
    - US$20B is fair-to-stretched; require structure or discount
    - Series C and market scarcity are real but disclosure incomplete
    - Prospectus or data room shows lower yields
  - - Bear
    - IPO market softens; capex/power delays; concentration high
    - Reset toward earlier ~$10B reference or down-round protection needed
    - Power constraints and lack of disclosed margins
    - Major interconnection or financing covenant miss
  notes: Ranges are scenario markers, not a DCF; public sources lack revenue and margin inputs.
