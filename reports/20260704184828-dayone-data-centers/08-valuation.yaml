company:
  name: DayOne Data Centers
chapter:
  number: 8
  title: Valuation
  summary: DayOne has enough public evidence to justify a premium watchlist position, but not enough to underwrite a buy at the reported US$20B marker. The chapter frames the January 2026 Series C premium, mid-2026 US$20B valuation marker, comps, scenarios, and diligence gates.
sections:
- id: valuation-bottom-line
  title: 'Bottom line: track the asset, do not underwrite the headline blindly'
  body: DayOne screens as a scarce hyperscale platform, but the valuation decision is not the same as the company-quality decision. Public evidence confirms a January 2026 Series C priced at a 100 percent premium, a June 2026 final close at US$4.5 billion, and third-party reporting around a possible US$20 billion IPO valuation. That is enough to frame the opportunity, not enough to clear a buy recommendation at the headline mark. The recommendation is track / research-more with high risk and a stretched valuation stance until booked MW economics, customer concentration, debt terms, and preference stack are verified. Upside exists if DayOne converts more than 1.5GW of bookings into power-secured profitable campuses and reaches the IPO window; downside is material if execution or financing costs lag the narrative. This posture also preserves optionality while avoiding false precision around private economics not yet disclosed in public materials.
