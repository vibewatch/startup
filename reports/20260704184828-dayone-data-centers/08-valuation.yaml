- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Track / research-more
    - Strong platform evidence but private economics and preference stack are missing
    - Do not buy solely at a US$20B marker
  - - Confidence
    - Medium
    - Financing, bookings and comps are public; revenue, margin and customer mix are not
    - Use staged diligence before IC approval
  - - Risk rating
    - High
    - Capital intensity, power delivery, construction and financing execution drive outcomes
    - Require downside protection and milestone covenants
  - - Valuation stance
    - Stretched at US$20B
    - Marker implies aggressive growth but can be rational if 1.5GW bookings convert
    - Price must be evidence-sensitive
  - - Exit posture
    - IPO-option plus strategic/M&A fallback
    - Reports point to US/dual listing; AirTrunk validates M&A appetite
    - Do not assume IPO multiple in base case
  notes: Judgment table synthesizes retained public evidence; private financial terms remain undisclosed.
