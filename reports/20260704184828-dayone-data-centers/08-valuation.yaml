- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric / status
  - Valuation or market marker
  - Relevance
  - Limitation
  rows:
  - - DayOne January 2026
    - Series C announced
    - '>US$2.0B round; 100% premium; ~US$10B reported context'
    - Primary baseline for step-up
    - Official release did not disclose valuation
  - - DayOne mid-2026
    - IPO target / estimated marker
    - US$20B target in Bloomberg/Reuters/DCD reporting; US$4.5B final Series C
    - Direct marker for entry discipline
    - Still not a filed prospectus or official post-money
  - - AirTrunk
    - Private M&A
    - A$24B / ~US$16.1B transaction; >800MW committed and >1GW land
    - Closest APAC hyperscale scarcity comp
    - Economics and lease terms not public
  - - Equinix
    - Public REIT market cap
    - ~US$98.8B market cap July 2026
    - Premium global data-center benchmark
    - Interconnection-heavy, mature public company
  - - Digital Realty
    - Public REIT market cap
    - ~US$63.1B market cap July 2026
    - Global hyperscale/colocation platform anchor
    - Scale and disclosure differ from private DayOne
  - - Iron Mountain
    - Public REIT market cap
    - ~US$34.9B market cap July 2026
    - Shows investor demand for data-center adjacency
    - Mixed business model
  - - GDS Holdings
    - Former parent / public comp
    - ~US$6.0B market cap July 2026
    - Cross-check for separation and retained stake
    - China exposure and remaining business distort comp
