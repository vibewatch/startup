- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Booked-MW quality
    - Bookings are non-binding or concentrated in one customer
    - Revenue visibility and valuation-per-MW collapse
    - Move to avoid or demand major discount
  - - Power delivery
    - Material interconnection delay on Finland/APAC campuses
    - Capacity cannot become revenue on underwriting timeline
    - Suspend investment until milestones reset
  - - Capex inflation
    - Cost per MW rises enough to impair stabilized yield
    - Equity returns diluted by extra debt/equity
    - Require anti-dilution or price reset
  - - IPO window
    - Prospectus range clears materially below US$20B
    - Exit multiple assumption fails
    - Re-underwrite with bear-case valuation
  - - Preference stack
    - Senior preferences/covenants absorb upside
    - Common/new-money return asymmetry worsens
    - Do not invest without structure
  - - Disclosure gap
    - Management will not provide revenue, margin, customer and debt schedules
    - Cannot validate valuation method
    - Block IC approval
  notes: Triggers convert public uncertainty into concrete diligence gates.
  claimRefs:
