  topStrengths:
    - DayOne 拿到稀缺资本支持，包括 Coatue 领投的 Series C、GDS 关联资源，以及基础设施债务 / 夹层融资能力。
    - SIJORI 策略让 DayOne 借柔佛和巴淡承接新加坡外溢需求，形成服务受限超大规模云需求的差异化路径。
    - 公开披露的预订和承诺显示 AI / 云需求真实存在，不只是囤地式押注。
    - 可持续定位、可再生能源合同和模块化交付，可能帮助 DayOne 赢下受约束的超大规模云部署。
  topRisks:
    - 收入、利润率、烧钱速度、合同定价和客户集中度仍未公开，据报 IPO 估值因此很难承销。
    - 跨司法辖区落地要靠电力供给、许可和准时交付，范围覆盖新加坡、马来西亚、印尼、泰国、日本、香港和芬兰。
    - 可持续逻辑部分依赖未来可再生能源采购，以及 SOFC / 氢能部署；方向有吸引力，但尚未在整个平台规模跑通。
    - 如果公开市场重估数字基础设施，或 DayOne 在运营指标披露更充分前推进 IPO，估值溢价可能被压缩。
    - 扩张似乎绑定少数超大型 hyperscale / AI 客户，但合同质量、期限和流失数据仍未披露。
  unresolvedGaps:
    - 2025–2026 年审计或管理层口径的收入、EBITDA、现金、偿债和利润率数据。
    - 1.0–1.5GW 已承诺 / 已预订容量对应的客户级租约条款、利用率、集中度和留存。
    - 站点级机房密度、液冷部署、可用性表现和 SOFC 运营经济性的证据。
    - 夹层 / 绿色融资结构的详细条款，包括契约、担保和资本成本。
    - 确认 IPO 时间、上市地点组合，以及 US$20B 标记反映的是银行端明确需求，还是仅为目标定位。
