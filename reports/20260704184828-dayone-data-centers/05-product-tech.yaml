- id: architecture-delivery-and-operations
  title: Architecture, delivery and operations
  body: The operating architecture has a clear pattern across markets. DayOne first secures land, grid access, regulatory
    support and connectivity; then it shortens deployment with modular prefabrication; then it configures the technical envelope
    around power density, cooling mode, resilience and management software. The company claims that its modular approach can
    fabricate up to 2,500 modules and up to 500 MW annually and that a Johor project reached 8.5-month greenfield delivery.
    Public filings from GDS independently echo the same architecture by describing DayOne as using high-density, liquid-cooling-enabled
    designs, renewable and low-carbon pathways, and rapid-deployment prefabricated models. The infrastructure-management platform
    adds a software layer for live energy, thermal and system-health monitoring, but the public file does not expose APIs,
    uptime telemetry, fault-domain design or site-level PUE. As a result, the delivery model looks unusually specific for
    a private data-center platform, while operational evidence still requires customer diligence packs.
  claimRefs:
