- id: ai-density-power-cooling-network
  title: AI density, power, cooling and network dependencies
  body: 'The AI-ready story is credible but dependency-heavy. DayOne is an NVIDIA Data Center Partner and says its verified
    facilities are built to NVIDIA Reference Design standards; its solutions page also claims a pilot above 130 kW per cabinet
    using GB200 NVL72 systems. That supports a high-density direction, but it does not by itself disclose how many racks,
    halls or campuses are ready for those densities. The power system is the binding constraint. Singapore depends on a tightly
    regulated 20 MW allocation and a SOFC proof of concept; Batam depends on phased 2026-2027 grid delivery under a 511 MVA
    PPA; Malaysia depends on CRESS renewable execution; Thailand depends on Amata, AMBRE and PEA-linked renewable integration;
    Finland depends on grid connection, waste heat and permitting. Cooling is equally differentiated by geography: Singapore
    tests tropical hybrid/liquid cooling, Johor and Batam target high-density regional scale, and Finland leans on naturally
    cool climate and zero freshwater cooling. The architecture is attractive because it is multi-market, but each market moves
    only as fast as utilities, permits and cooling validation allow.'
