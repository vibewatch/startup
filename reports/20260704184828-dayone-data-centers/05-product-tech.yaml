  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: 30MW-hall-gap
    missingEvidence: Hall-by-hall design capacity, rack-density allocation, commissioned load and customer fit-out specifications.
    whyItMatters: The prompt focus includes 30+ MW per hall, but public sources only substantiate campus and power-block scale.
    diligencePath: Request engineering basis-of-design documents, single-line diagrams and customer-ready hall commissioning
      packs from management.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: material
    topic: site-level-reliability
    missingEvidence: Site-level PUE, WUE, uptime SLA, maintenance history, incident reports and redundancy certification evidence.
    whyItMatters: AI customers value density only if facilities maintain thermal and power resilience under high utilization.
    diligencePath: Ask for customer SLA templates, SOC2 reports, ISO certificates, incident logs and Uptime/Tier or equivalent
      engineering attestations.
  - type: private-evidence-only
    severity: material
    topic: SOFC-scale-up
    missingEvidence: Measured SOFC output, emissions by feedstock, hydrogen procurement plan, safety case and regulatory approvals
      for scale-up.
    whyItMatters: The Singapore green-power differentiation depends on moving beyond a natural-gas-fed pilot toward reliable
      low-carbon operation.
    diligencePath: Review SK ecoplant/Bloom technical test results, fuel contracts, Singapore regulatory approvals and contingency
      power design.
    relatedQuestionRefs:
    - QE011
  - type: stale
    severity: minor
    topic: roadmap-timing
    missingEvidence: Updated RFS dates for SG1, Thailand CTP, Kabil phases, Lahti and Tokyo after the 2026 run date.
    whyItMatters: Utility interconnection and permitting dates are volatile and can materially change capacity timing.
    diligencePath: Refresh market pages, partner announcements and permitting files before investment committee.
  - type: private-evidence-only
    severity: material
    topic: customer-technical-proof
    missingEvidence: Named customer deployments, signed capacity by site, workload types and production acceptance tests for
      AI clusters.
    whyItMatters: NVIDIA alignment and high-density claims are stronger if tied to production customers rather than pilots
      or partner status.
    diligencePath: Request anonymized customer acceptance certificates, GPU cluster deployment references and utilization
      evidence from DayOne.
