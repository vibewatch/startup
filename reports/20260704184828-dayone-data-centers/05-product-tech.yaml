- id: sustainability-trust-and-compliance
  title: Sustainability, trust and compliance
  body: 'DayOne''s sustainability posture is more developed than its public reliability posture. Malaysia has the most concrete
    renewable-energy evidence, with DayOne describing about 1.5 GWp of solar and 2.2 GWh of battery storage under CRESS and
    more than 1 GW of renewable energy secured through TNB. Singapore adds a Sembcorp PPA, SOFC proof of concept, NUS tropical
    data-center R&D, and planned LEED/BCA Green Mark Platinum applications. Johor has a visible LEED track record, including
    NTP1 Platinum and several 2026 Platinum certifications. Finland contributes waste-heat recovery and zero freshwater cooling.
    Trust controls are thinner in public: Hong Kong lists ISO 9001, ISO 27001 and SOC2, DayOne publishes a data-security policy
    and supplier code, but there is no site-by-site SOC2 report, SLA, incident ledger, cybersecurity packet, or PUE history
    in the retained sources. For underwriting, sustainability is a credible customer-facing feature; reliability and security
    require private diligence.'
