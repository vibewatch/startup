- id: roadmap-maturity-and-technical-risks
  title: Roadmap, maturity and technical risks
  body: The maturity map is uneven by design because DayOne is scaling across several development stages at once. Hong Kong
    and Johor provide the strongest proof of operating maturity, with certifications and in-service campus claims. Batam NDP
    is opening from 2025 while Kabil adds a very large grid-backed expansion. Singapore SG1 is a strategic testbed with 20
    MW approved capacity and first-phase timing disclosed as 2026/2027 across sources. Thailand has construction and a 300
    MW/1 GW platform ambition. Finland has large planned capacity, local-city support and a 2027 operations target, but permitting
    and tenant execution remain relevant. Tokyo is a later-dated 2028 project. The most material risks are not whether demand
    exists for AI compute; they are whether DayOne can synchronize power interconnection, renewable procurement, high-density
    cooling validation, modular quality control, and compliance evidence across seven markets without creating delivery slippage
    or uneven customer experience.
