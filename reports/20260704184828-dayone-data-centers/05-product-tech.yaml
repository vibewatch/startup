company:
  name: DayOne Data Centers
chapter:
  number: 5
  title: Product & Technology
  summary: 'DayOne’s product is a hyperscale data-center platform: campuses, power, cooling, connectivity, sustainability
    and operations packaged for AI/cloud customers. Public evidence strongly supports high-density direction, renewable positioning,
    SOFC experimentation, LEED-certified Johor assets and multi-market expansion; the main diligence gaps are hall-level density
    proof, utility timing, site-level reliability data and private customer acceptance evidence.'
sections:
- id: product-definition-and-asset-map
  title: Product definition and asset map
  body: DayOne's product is best understood as hyperscale data-center capacity packaged as a repeatable regional platform,
    not as a software-only infrastructure product. Customers buy or reserve space, power, cooling, connectivity and operating
    reliability in campuses that DayOne places near constrained demand pools. The public evidence shows an explicit SIJORI
    architecture linking Singapore, Johor and Batam, then a broader expansion layer across Hong Kong, Tokyo, Greater Bangkok
    and Finland. The service workflow starts with market selection and capacity commitment, moves through land and power securing,
    uses prefabricated delivery and high-density cooling, and ends in an operated facility with monitoring and sustainability
    claims. The strongest product assets are therefore campus rights, utility interconnections, modular construction capability,
    liquid-cooling know-how, and customer-specific high-density readiness. Public materials do not prove that every hall is
    30 MW-plus; the better-supported claim is that selected campuses and power blocks are large enough for hyperscale AI capacity
    while individual hall design remains a diligence item.
