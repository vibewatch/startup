- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Land and campus rights
    - Anchor capacity in constrained markets
    - Industrial zoning, acquisition, local partners
    - Permitting delays or community opposition
  - - Utility interconnect and PPA
    - Deliver enough firm power for AI loads
    - Grid operator, PPA, battery or REC structure
    - Phased delivery slips or grid congestion
  - - Prefabricated modules
    - Compress construction time and standardize quality
    - In-house module design, suppliers, logistics
    - Module defects or vendor bottlenecks are not publicly quantified
  - - High-density cooling
    - Support GPU heat loads and energy efficiency
    - Liquid/hybrid design, maintenance skills, water/air conditions
    - Pilot density may not represent all halls
  - - Infrastructure management platform
    - Monitor energy, thermal and system health
    - Sensor data, analytics, controls integration
    - No public API, uptime telemetry or incident data
  - - Renewable and low-carbon pathway
    - Meet customer sustainability requirements
    - CRESS, RECs, solar, batteries, SOFC, heat reuse
    - Accounting and physical delivery vary by market
  - - Trust and certification layer
    - Enable enterprise compliance screening
    - LEED, ISO, SOC2, data-security policy
    - Certification scope and audit reports are not public
  - - Talent and operations
    - Operate sites across seven markets
    - Data center managers, mechanical engineers, project directors
    - Scaling people/process across markets may lag build pace
  notes: This is a derived architecture table; rows reflect repeatedly evidenced layers rather than DayOne-supplied architecture
    diagrams.
