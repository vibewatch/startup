  - Diligence gap
  rows:
  - - SIJORI regional platform
    - Hyperscalers needing Singapore-adjacent scale
    - Marketed as proprietary hub-and-spoke model
    - Combines Singapore connectivity with Johor and Batam land/power options
    - Signed customer allocation and latency SLA by route
  - - Johor NTP/KTP campuses
    - Cloud and AI workloads needing Malaysia scale
    - Operating since 2023 onwards; multiple LEED certificates
    - Large LEED-certified campuses with direct Singapore connectivity
    - Reconcile 390 MW in-service versus over-478 MW operational wording
  - - Batam NDP and Kabil campuses
    - Hyperscalers needing cost-efficient Singapore-adjacent capacity
    - NDP opens 2025; Kabil power phased 2026-2027
    - SEZ, subsea cables, 511 MVA PLN Batam PPA
    - Kabil build schedule, redundancy design and power-delivery milestones
  - - Singapore SG1 / Jurong East
    - AI, cloud and innovation workloads in regulated Singapore
    - 20 MW approved; first phase 2026/2027
    - SOFC proof-of-concept, renewable PPA, NUS tropical R&D
    - SOFC pilot performance and regulatory pathway to hydrogen
  - - Hong Kong Kwai Chung cluster
    - Carrier-neutral and multi-cloud APAC workloads
    - 66 MW; certifications listed publicly
    - Urban high-density brownfield capacity in land-scarce market
    - Audit scope, uptime record and customer deployment mix
  - - Finland Lahti/Kouvola platform
    - European hyperscalers needing renewable/cold-climate scale
    - Lahti planned 2027; Kouvola partnership disclosed
    - Waste heat, zero freshwater cooling, renewable-powered Nordic platform
    - Building permit status, tenant commitments and grid connection milestones
  notes: Rows are a public-evidence asset map; maturity labels are based only on retained sources, not private pipeline data.
