  rows:
  - - Deploy AI clusters near Singapore
    - Singapore land and power are finite
    - SIJORI routes demand to Singapore, Johor and Batam
    - Singapore 20 MW, Johor scale, Batam 511 MVA PPA
    - Cross-border latency and customer contract terms are private
  - - Run high-density GPU racks
    - Conventional air-cooled rooms strain at high rack power
    - Liquid/hybrid cooling and NVIDIA-aligned environments
    - Company claims 130 kW-plus GB200 NVL72 pilot
    - Pilot scale and repeatable rack count undisclosed
  - - Decarbonize Malaysian capacity
    - Hyperscale customers need renewable power at scale
    - TNB CRESS solar and battery contracts
    - About 1.5 GWp solar and 2.2 GWh storage disclosed
    - Delivery timing and REC accounting need diligence
  - - Build in tropical climates
    - Cooling energy and humidity drive PUE risk
    - Singapore hybrid cooling and NUS tropical R&D
    - DayOne release cites pilot testing under STDCT 2.0
    - No site-level PUE or water-use figures disclosed
  - - Localize European capacity
    - Nordic customers want low-carbon compute and heat reuse
    - Lahti/Kouvola renewable-powered platform
    - 128 MW Lahti potential, waste heat and zero freshwater cooling
    - Tenant contracts and permit outcomes not public
  - - Serve interconnection workloads
    - Cloud and enterprise buyers need carrier neutrality
    - Hong Kong Kwai Chung carrier-neutral multi-cloud hub
    - 66 MW with ISO/SOC claims
    - Detailed interconnection ecosystem not enumerated
