  - - Equinix
    - Global incumbent / interconnection platform
    - 281 data centers globally; 63 APAC facilities; 10,500-plus customers
    - Enterprises, networks, cloud, AI inference and xScale training
    - Global ecosystem and interconnection density far above DayOne
    - May be less focused on one greenfield SIJORI hyperscale corridor
  - - Digital Realty
    - Global incumbent / platform colocation
    - 300-plus global data centers; 20-plus APAC data centers; 230-plus APAC connected customers
    - Hybrid cloud, AI, enterprise, service-provider and colocation buyers
    - PlatformDIGITAL, broad APAC cloud/service-provider ecosystem, high-density colocation
    - Public pages do not disclose market-level wholesale pricing or committed MW
  - - Princeton Digital Group
    - Pan-Asia hyperscale specialist
    - Seven-country Asia platform; US$1.8B green/sustainability-linked loan disclosed
    - Cloud and AI hyperscalers across Asia
    - Direct overlap in SG-Johor-Batam and similar utility/power narrative
    - Public capacity totals are not fully comparable to DayOne MW metrics
  - - Bridge Data Centres
    - Southeast/South Asia hyperscale operator
    - Malaysia, Thailand and India footprint; Malaysia page lists MY01/MY02/MY03/MY06/MY07
    - Cloud providers, hyperscale and enterprise buyers
    - Malaysia proximity to Singapore; advanced cooling; modular infrastructure
    - Ownership/capital depth and live contracted MW need normalization
  - - AirTrunk
    - Scaled APAC/APME hyperscale platform
    - A$24B Blackstone/CPP transaction; 800MW-plus committed; land for 1GW-plus future growth
    - Cloud, content and large enterprise customers
    - Best capital-backed APAC hyperscale benchmark; powered-land scale
    - Largest threat may outspend DayOne in regional power and land banking
  - - Keppel DC REIT
    - Data-center REIT / asset owner
    - S$6.3B AUM; 25 data centers in 10 countries
    - Data-centre real estate investors and tenants through portfolio assets
    - Capital-market and asset ownership comparator, especially Singapore exposure
    - Less directly comparable as an operating hyperscale-campus developer
  - - STT GDC
    - Regional/global colocation and hyperscale platform
    - 20-plus markets and roughly 2.3GW IT load stated on site
    - Cloud, AI and enterprise colocation in mature and emerging markets
    - Singapore-headquartered platform with broad APAC execution history
    - Official site metrics need parsing and market-level contracted capacity
  - - Internal build / status quo
    - Substitute
    - Hyperscalers continue leasing and self-building according to JLL
    - Largest cloud and AI platforms
    - Avoids third-party margin and can optimize proprietary architecture
    - Requires site, power, construction, permitting and balance-sheet commitment
