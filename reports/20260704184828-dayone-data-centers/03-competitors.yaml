- id: moat-durability-risks
  title: Moat durability, switching costs, and adverse evidence
  body: 'DayOne’s moat is most plausible where site control, power access, modular delivery, liquid cooling, and SIJORI network
    effects compound before peers can secure equivalent capacity. Yet the same evidence base raises adverse points. CBRE calls
    limited power availability the prime inhibitor of growth and notes preleasing and construction timelines stretching to
    2027 and beyond. JLL says grid-connection waits in primary markets exceed four years and estimates a US$3 trillion industry
    investment requirement by 2030. Those conditions can help a fast operator if it has secured power, but they also attract
    better-capitalized incumbents and infrastructure funds. Switching costs are real once a hyperscaler preleases multi-MW
    capacity and integrates cloud/network connectivity, but they are not absolute: hyperscalers can multi-home and self-build,
    and the largest peers can finance power-adjacent strategies. The diligence priority is therefore not whether DayOne has
    differentiation; it is whether that differentiation is already locked through customer commitments, utility arrangements,
    and RFS dates.'
