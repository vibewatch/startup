- id: pricing-capital-access
  title: Pricing, packaging, and capital access
  body: 'Public pricing is the weakest comparable dimension. Vendor pages disclose packaging themes—colocation, connectivity,
    AI-ready high density, build-to-suit, powered land, renewable-ready infrastructure—but not realized prices, discounts,
    power pass-throughs, customer credits, or fit-out responsibilities. CBRE is useful as a market proxy: Singapore remained
    one of the most expensive global markets at US$310 to US$470 per kW per month in Q1 2025. Capital access is easier to
    compare directionally. Equinix and Digital Realty have public-company filing histories and global capital markets access;
    Keppel DC REIT discloses S$6.3 billion of AUM; AirTrunk gained Blackstone/CPP backing at a transaction value above A$24
    billion; PDG discloses US$1.8 billion of green and sustainability-linked loans; DayOne lists more than US$2.0 billion
    of Series C equity financing plus earlier large facilities. This supports underwriting DayOne as capital-credible, but
    not uniquely advantaged versus AirTrunk, public REITs, or global incumbents.'
