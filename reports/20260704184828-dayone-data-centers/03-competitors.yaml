- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation or diligence ask
  rows:
  - - SIJORI corridor first-mover narrative
    - PDG, Equinix, Bridge and AirTrunk also have Singapore/Johor/Malaysia/Batam-relevant footprints
    - High
    - Verify land, power, permits, and signed customer capacity by campus and RFS date
  - - Speed-to-market via modular prefab
    - AirTrunk reports nine-month delivery and peers can copy modular methods or acquire supply-chain capacity
    - Medium
    - Audit historical DayOne project schedules against NTP claim and peer RFS timelines
  - - AI density and liquid cooling
    - Digital Realty discloses up to 150kW per cabinet; Bridge and PDG also market advanced cooling
    - Medium
    - Run engineering diligence on rack-density, coolant, failure modes, and customer acceptance
  - - Sustainability and renewable-ready design
    - Most peers publish net-zero, renewable, green-bond, or RE100 claims
    - Medium
    - Compare actual PPA coverage, hourly matching, embodied carbon, WUE and LEED/BREEAM evidence by campus
  - - Capital access after Series C
    - AirTrunk/Blackstone, public Equinix/DLR, Keppel REIT and PDG green loans all show credible capital access
    - High
    - Compare committed equity, undrawn debt, project finance terms, and funding needed to reach RFS pipeline
  - - Customer-centric hyperscaler focus
    - Named customers and contract terms remain largely private in public sources
    - High
    - Obtain customer concentration, take-or-pay terms, preleasing, churn, and reference calls under NDA
  - - Power/site availability
    - CBRE and JLL show power constraints, grid delays, and rising construction costs are sector-wide bottlenecks
    - High
    - Validate utility agreements, grid-connection dates, backup-power strategy, and community/permitting risk
  notes: Risk severity is analyst judgment derived from public evidence; it should be updated after management data-room review.
