- calloutType: insight
  title: Positioning read-through
  body: DayOne is best framed as a power- and speed-led APAC hyperscale challenger, not as a global interconnection incumbent.
    The diligence burden is to prove that SIJORI capacity and customer commitments are already locked before peers with deeper
    capital and broader ecosystems arrive.
  claimRefs:
