- id: geographic-footprint-power
  title: Geographic footprint, power, and capacity positioning
  body: DayOne’s strongest public footprint evidence is concentrated around SIJORI. The company claims operations or markets
    across Singapore, Johor, Batam, Greater Bangkok, Hong Kong, Tokyo, and Finland, and its Johor page claims more than 478
    MW of operational capacity across Nusajaya Tech Park and Kempas Tech Park with direct Singapore connectivity. That is
    a meaningful wedge because CBRE says major-market supply constraints are pushing attention toward Johor and other secondary
    markets, and that Johor and Batam are already capturing sizable multi-MW transactions. However, breadth still favors incumbents
    and scaled specialists. Equinix reports 63 APAC data centers and interconnection facilities in nine countries; Digital
    Realty reports 20-plus APAC data centers across 10 metros; PDG has a seven-country pan-Asia platform; AirTrunk discloses
    about 2 GW of powered land and, through Blackstone, more than 800 MW committed to customers plus land for more than 1
    GW of future growth. DayOne therefore looks strongest as a corridor-focused challenger, not as the broadest platform.
