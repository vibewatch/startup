  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing opacity
    missingEvidence: Comparable MSA pricing, discount schedule, SLA credits, power pass-through, and fit-out responsibility
      by operator and market.
    whyItMatters: Without private contract evidence, the pricing table can only show market proxies and public packaging claims,
      not a definitive price/performance rank.
    diligencePath: Request anonymized proposals or executed term sheets for Johor, Singapore, Batam, Tokyo, and Hong Kong
      deployments from DayOne and peer customers.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: material
    topic: customer proof
    missingEvidence: Named DayOne hyperscaler tenants, renewal rates, customer concentration, and third-party case studies
      comparable to public incumbent references.
    whyItMatters: Customer proof determines whether DayOne’s speed and density claims convert into durable win rates against
      incumbents and pan-Asia specialists.
    diligencePath: Ask management for customer logos under NDA, booked capacity by customer, renewal history, and permissioned
      reference calls.
    relatedQuestionRefs:
    - QP024
  - type: conflicting-data
    severity: material
    topic: capacity comparability
    missingEvidence: Like-for-like realized MW, committed MW, powered-land pipeline, and RFS schedule across each named competitor
      using one capacity convention.
    whyItMatters: Operators mix operational, committed, under-development, powered-land, and IT-load metrics, so public totals
      are not directly rankable.
    diligencePath: Normalize capacity from operator data rooms, lender materials, utility interconnection queues, and market
      broker data by operational/RFS/committed/pipeline status.
    relatedQuestionRefs:
    - QP025
  - type: missing-source
    severity: minor
    topic: local permitting opposition
    missingEvidence: Comparable country-by-country evidence on zoning, community opposition, water permits, grid-connection
      delays, and moratoria for each competitor.
    whyItMatters: Local approval friction can erase speed-to-market advantages even when land and capital are available.
    diligencePath: Review municipal filings, utility interconnection registers, environmental impact assessments, and local-news
      archives for each live campus.
    relatedQuestionRefs:
    - QP026
