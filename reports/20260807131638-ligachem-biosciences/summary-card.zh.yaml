  topStrengths:
    - LigaChem 的 ADC 平台有真实深度，覆盖多类 payload、正在推进人体研究，并获得蓝筹合作伙伴验证。
    - 2026 年 National Growth Fund 领投融资显著改善现金跑道和战略灵活性，强于较弱的临床期 biotech 同行。
    - 过往授权和合作伙伴广度表明，复杂交易对手看重的是平台本身，不只是叙事。
    - 活跃专利和公认的 ConjuAll™ 化学栈，为护城河提供至少一部分可见支撑。
  topRisks:
    - 当前核心试验证据仍早期，本报告引用的在研人体研究没有保留下已发布结果。
    - 公司正转向更烧钱的自研阶段，但公开 CMC 或商业化证据还不足以完全支撑这一转向。
    - 公开经济性仍然不平滑且依赖合作伙伴，收入集中度、里程碑节奏和未来稀释风险透明度有限。
    - 尽管证明深度低于战略并购先例，当前公开估值已较上市 ADC-biotech 可比公司隐含溢价。
    - 客户、合作伙伴和区域权益复杂度高；即便底层科学可信，价值兑现也可能变慢或被摊薄。
  unresolvedGaps:
    - 合作伙伴层面收入集中度、里程碑瀑布时间表和 royalty 转化历史。
    - 任何自研路径的 CMC 质量指标、供应可靠性和上市准备度证据。
    - ConjuAll 相关化学在关键司法辖区的完整自由实施权和专利格局分析。
    - 当前公开目标价背后的详细分析师模型假设和情景概率。
    - 把当前现金、单资产投入和现金跑道，与关键临床拐点重新对齐的更清楚口径。
