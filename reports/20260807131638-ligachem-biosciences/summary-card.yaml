summary:
  headline: >-
    LigaChem has a credible ADC platform and unusually strong partner validation for its stage, but the current public
    valuation looks stretched enough that better human proof, cleaner CMC evidence, or a cheaper entry is needed before
    a fresh high-conviction buy call is justified.
