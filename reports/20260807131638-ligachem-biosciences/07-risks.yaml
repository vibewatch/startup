sections:
- id: S1
  title: 'Top Risk Stack: More Capital, More Ambition, Still Clinical-Stage Fragility'
  body: |-
    LigaChem's central risk has not changed: it is still a company whose value depends on whether ADC molecules can cross the gap from mechanistic credibility into human efficacy, tolerability, and manufacturable reproducibility. What has changed is the scale of the ambition. The 2026 financing gives the company more runway to push late-stage development and even self-development, but that same shift also increases the number of ways the thesis can break. The company is no longer just a platform seller hoping for partner validation; it is becoming a hybrid platform-and-development company that may need to manage trial execution, capital allocation, CMC readiness, and partner relationships at the same time.

    That makes the risk stack multidimensional. Clinical failure remains the highest-severity risk because current studies are still early and none of the cited trials had posted results. Manufacturing and CMC are next because ADC performance depends heavily on conjugation quality and reproducibility, yet public quality evidence is thin. Partner and customer dependence remains high because several key assets sit under external control. Financing risk is lower than before the raise, but not removed, because the company is now funding a more expensive strategy. Finally, legal and IP protections look real but incomplete: active patents exist, yet public FTO visibility is limited.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR007
  - CR008
  - CR018
  - CR019
  - CR020
  - CR021
  - CR024
  - CR040
  tableRefs: []
  figureRefs:
  - FR001
- id: S2
  title: 'Regulatory, Legal, and Clinical Risk: The Science Is Real, the Proof Is Still Thin'
  body: |-
    The regulatory and clinical evidence simultaneously validates the platform and underlines the risk. Four active ClinicalTrials records show that multiple LigaChem-derived programs are genuinely in human testing, but all are still burdened by dose-escalation logic, biomarker gating, and exclusion criteria that are characteristic of drugs with uncertain therapeutic windows. LNCB74 excludes prior MMAE-ADC exposure and pulmonary or ocular risk factors; LCB02A excludes prior Topo1-payload ADC exposure; IKS014 excludes ILD and corneal abnormalities. These are not abstract concerns—they are built into the protocols. The absence of posted results means investors still do not know which programs can combine efficacy and tolerability at commercially relevant doses.

    The legal picture is better than a pure concept-stage platform but still incomplete. Google Patents records show active self-immolative and conjugation-related patents assigned to LigaChem, which is real protection. Yet public materials do not provide a complete FTO map, expiry matrix, or dispute history. The broader ADC field is demonstrably litigious, and even comparator conjugation families show litigation markers. The right conclusion is that IP is a mitigation, not a full answer. Without deeper diligence, legal/IP residual risk remains medium-to-high.
  claimRefs:
  - CR003
  - CR004
  - CR005
  - CR006
  - CR025
  - CR026
  - CR027
  - CR028
  - CR036
  - CR040
  tableRefs:
  - TR001
  figureRefs:
  - FR002
- id: S3
  title: Operational, Partner, and Customer Dependence Risk
  body: |-
    LigaChem's partner model reduces some direct operating burden but creates another kind of fragility: value realization depends on many external organizations moving in sync. Ono controls LCB97 downstream. SOTIO controls research, development, manufacturing, and commercialization for its licensed programs. Iksuda runs key HER2 and CD19 programs while also sitting in a more entangled strategic relationship with LigaChem. CStone and NextCure operate additional externally advanced assets. The practical consequence is that LigaChem can show broad validation and still miss economic expectations if one or more partners slow enrollment, reprioritize pipelines, or fail to convert early data into later-stage investment.

    Customer concentration compounds that dependence. Public sources show strong named counterparties, but they do not show revenue splits, churn, or milestone timing by partner. The Ono milestone being worth at least 10% of prior-year revenue illustrates how concentrated the visible economics can be. Rights-split structures, such as the IKS014 / FS-1502 configuration across Iksuda and Fosun, add coordination and governance complexity. This is a diversified scientific ecosystem but probably not yet a diversified economic one.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR034
  - CR035
  - CR037
  - CR038
  tableRefs:
  - TR002
  - TR003
  figureRefs:
  - FR003
- id: S4
  title: 'Financial and Execution Risk: The Raise Buys Time, Not Certainty'
  body: |-
    Financial risk improved sharply in 2026 but remains central. Official 2025 statements show that LigaChem was not self-funding: operating loss exceeded KRW 100 billion, operating cash outflow exceeded KRW 120 billion, and year-end cash was under KRW 100 billion. The KRW 500 billion raise therefore mattered enormously. But the market should not confuse that with a solved business model. Independent reporting indicates the money is intended for late-stage trials, regulatory work, manufacturing, and commercialization readiness—the most expensive parts of drug development. The company may simply have upgraded itself into a higher-cost risk class.

    Execution risk follows from that. Governance shows meaningful Orion presence, which can help oversight but also raises strategic-control sensitivity. Leadership shows explicit attention to toxicology, safety, and manufacturing, which is a genuine mitigant. Recruiting materials show the company still depends on highly specialized scientific talent. The practical kill criteria are therefore straightforward: watch for safety setbacks, timeline slips in self-advanced assets, signs of faster-than-expected cash consumption, or any public indication that partner follow-through is weakening. If those indicators remain stable, the risk profile becomes more investable. If they break, the downside can re-rate quickly.
  claimRefs:
