- id: TR005
  slug: mitigation-kill-criteria
  title: Mitigation and kill criteria table
  description: Monitorable indicators that would materially improve or worsen the underwriting case.
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Clinical safety failure
    - Serious unexpected toxicity in LCB02A or LNCB74
    - Dose-limiting pattern or study hold / major protocol tightening
    - Re-underwrite platform therapeutic-window claims
  - - Capital sufficiency
    - Cash burn accelerates faster than milestone inflow
    - Evidence of another large raise before core readouts or commercialization clarity
    - Increase dilution and financing-risk haircut
  - - Partner dependence
    - Named anchor partner deprioritizes or pauses a lead program
    - Loss of milestone cadence or removal from partner pipeline
    - Reduce assumed external-validation value and timing
  - - CMC readiness
    - No disclosed progress on manufacturing or quality infrastructure as self-development deepens
    - Late-stage ambitions advance without new CMC evidence
    - Treat strategy shift as under-resourced
  - - Execution sprawl
    - Roadmap assets slip materially versus 2026-2027 plans
    - Missed IND / Phase 1 start for LCB36 or LCB58A, or major slippage on LCB02A
    - Downgrade management-execution confidence
  notes: |-
    The thesis is most fragile where multiple risks compound: safety, time, capital, and partner behavior.
