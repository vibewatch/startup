  name: LigaChem Biosciences
chapter:
  number: 7
  title: Risks
  summary: |-
    LigaChem's risk profile is still dominated by classic late-clinical biotech exposure, but the shape of that risk has changed in 2026. The company now has more capital and more visible partner validation than a typical early ADC platform, yet it is also taking on more late-stage, manufacturing, and commercialization burden itself. The top risks are: (1) clinical efficacy and safety failure across early-stage ADC programs; (2) CMC and manufacturing reproducibility in a modality where linker-payload quality is mission critical; (3) partner, customer, and capital-provider dependence despite apparent breadth; (4) financing and dilution risk if the 2026 raise proves insufficient for late-stage self-development; and (5) legal/IP uncertainty because active patents exist but freedom-to-operate, contract details, and any historical disputes are not transparently disclosed. Public sources show meaningful mitigants—deep cash injection, active patents, experienced scientific leadership, and multiple global partners—but residual risk remains high because there is still no marketed product, no posted pivotal results, and no public evidence that the platform can move through late-stage execution without additional capital, partner slippage, or safety setbacks.
