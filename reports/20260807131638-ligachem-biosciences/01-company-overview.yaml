sections:
- id: identity-listing-and-focus
  title: Identity, Listing Status, and Strategic Focus
  body: 'LigaChem Biosciences is not a private company in the strict legal sense: official history, the company stock page, Yahoo Finance, and Stock Analysis all show that the business trades on KOSDAQ under ticker 141080, with the IPO dated to 2013. That matters because later chapters should treat it as a publicly traded biotech with venture-style economics rather than as a classic venture-backed private startup. At the same time, the operating profile still resembles a platform biotech: the company describes itself as clinical stage, Daejeon-headquartered, medicinal-chemistry-led, and focused on antibody-drug conjugates plus immuno-oncology. The March 2024 rename from LegoChem to LigaChem is important for source hygiene because older licensing and media references still use the LegoChem brand while current company pages and 2026 financing notices use LigaChem.'
  claimRefs:
  - CO001
  - CO003
  - CO004
  - CO005
  - CO006
  - CO009
  tableRefs:
  - TO001
  figureRefs: []
- id: leadership-and-governance
  title: Leadership and Governance
  body: 'Leadership appears bifurcated between founder symbolism and professionalized daily management. Founder Yong-Zu Kim still presents himself as the chairman and long-term scientific architect, while the public leadership page and Yahoo profile identify Sejin Park as CEO and President. The governance page also shows that control is no longer purely founder-centric: Orion-linked executives occupy multiple internal-director seats, indicating that Pan Orion''s ownership position has translated into visible board influence since becoming the largest shareholder in 2024. Governance disclosure is stronger than many Asian biotech peers because the board page names outside directors, reports attendance, and discloses meeting cadence, but it still does not provide a full English-language explanation of committee structure, reserved-matter rights, or the exact balance of influence between founder, management, and Orion representatives.'
  claimRefs:
  - CO007
  - CO008
  - CO010
  - CO011
  - CO012
  tableRefs:
  - TO002
- id: capital-formation-and-market-context
  title: Capital Formation and Market Context
  body: 'The June 2026 National Growth Fund financing is the key current fact for this report. Company notices and multiple Korean news outlets align on a KRW 500 billion transaction, structured as KRW 170 billion of convertible bonds and KRW 330 billion of convertible preferred shares with long tenor. The company emphasized that the money is earmarked for R&D and late-stage clinical development, not M&A, and that out-licensing remains intact rather than displaced. That is analytically important because LigaChem is trying to add selective late-stage self-development capacity without abandoning the licensing engine that produced its existing cash reserves. The financing is also designed to look shareholder-friendly on paper: no discount, delayed conversion rights, and transfer restrictions. Even so, public-market reaction was not euphoric. NEWSTOP reported an 8.28% drop on the announcement day, which suggests the market still worries about dilution, execution, or biotech-sector fatigue despite
    the prestige of the state-backed capital.'
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO021
  - CO022
  - CO037
  tableRefs:
  - TO003
  figureRefs:
  - FO002
  - FO003
- id: partnership-engine-and-milestones
  title: Partnership Engine and Milestones
  body: 'LigaChem''s current relevance comes less from product revenue than from the pace and size of its ADC partnering machine. The company''s official history records milestone deals with Amgen, NextCure, Ono, and J&J, while independent press reports give concrete economics for the J&J/Janssen LCB84 agreement. Korea Biomedical Review adds useful scale markers by attributing 14 global licensing deals and eight global clinical trials to the company by June 2026. That partnering density helps explain why a listed Korean biotech could attract unusually large policy capital: the state fund was not financing a science project from scratch, but rather a platform with a demonstrated ability to place ADC assets into global pipelines. The 2024-2026 IND milestones for LNCB74, LCB97/ONO-7429, and LCB02A reinforce the message that the company is moving a growing set of internally originated assets through early human-development gates.'
  claimRefs:
  - CO023
  - CO024
  - CO025
  - CO026
  - CO027
  - CO028
  - CO029
  - CO030
  - CO031
  - CO032
  - CO033
  - CO034
  - CO038
  tableRefs:
  - TO004
  figureRefs:
  - FO001
- id: remaining-frictions-and-how-to-use-this-baseline
  title: Remaining Frictions and How to Use This Baseline
  body: 'For later chapters, the safest posture is to treat official company history, the stock page, the June 2026 funding notices, and corroborating Korean biotech reporting as the canonical baseline, while explicitly carrying several open gaps. The business is clearly public, ADC-focused, and better financed than most clinical-stage peers, but the exact post-money valuation of the 2026 raise is still not cleanly disclosed in accessible public materials. The unnamed third financial investor, full cap-table rights, and a precise bridge from existing cash to dilution-adjusted enterprise value remain unresolved. Public operating metrics are also uneven: liquidity is visible, but headcount, revenue mix, and the relative contribution of product sales versus licensing are not cleanly disclosed on the accessible surfaces reviewed here. That means later market, financial, and valuation chapters should rely on documented funding and pipeline progress while staying conservative on unsupported cover
    metrics.'
  claimRefs:
  - CO001
  - CO004
  - CO013
  - CO019
  - CO020
  - CO036
  - CO039
