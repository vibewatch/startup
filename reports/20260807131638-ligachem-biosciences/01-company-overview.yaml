chapter:
  number: 1
  title: Company Overview
  summary: LigaChem Biosciences is a Daejeon-headquartered, KOSDAQ-listed clinical-stage ADC biotech founded in 2006. The company renamed from LegoChem Biosciences in 2024, remains founder-chaired by Yong-Zu Kim, is operated by CEO Sejin Park, and in June 2026 raised KRW 500 billion from a National Growth Fund-led consortium to extend its historically licensing-led ADC model toward selective late-stage self-development. Public disclosure is meaningful for a Korean biotech, but the unnamed third financial investor, exact post-money valuation, and several cover metrics remain incomplete in public sources.
