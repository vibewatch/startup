sections:
- id: S1
  title: Investment Thesis and Anti-Thesis Must Start With Price Sensitivity
  body: |-
    LigaChem is not a trivial company. It has a real ADC platform, meaningful partner validation, several active human programs, and enough financing to pursue a more ambitious strategy than many peers can afford. Those are genuine reasons the market grants it a premium. Big-pharma and specialist-biotech counterparties have repeatedly signed up to the platform, and the 2026 recapitalization plus continuing milestones show the company is more than a science project. The positive case, then, is clear: LigaChem has strategic value, product optionality, and enough market relevance to deserve continued investor attention.

    The anti-thesis is just as important. The current valuation already assumes a large share of that optionality will convert into future value. At roughly KRW 4.125 trillion of market cap and only about KRW 284 billion of 2026 revenue expectation, the market is not pricing a normal loss-making biotech on near-term fundamentals. It is pricing future pipeline and platform success. That can work if data and execution de-risk quickly. It becomes dangerous if investors mistake theoretical milestone ceilings, analyst target upside, or strategic sponsor validation for proved commercial economics. The first job of this chapter is therefore not to decide whether the company is good. It is to decide whether the current price is already doing too much of the future underwriting for the investor.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV005
  - CV006
