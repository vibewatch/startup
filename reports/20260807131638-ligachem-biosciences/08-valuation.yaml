    - Operations + technical diligence
  - - Freedom-to-operate and IP scope
    - Portfolio-wide patent family, expiry, license-in obligations, challenge history
    - Tests whether moat is defendable or merely plausible
    - IP counsel diligence
  - - Analyst model assumptions
    - Probability-of-success, WACC, revenue ramp, and terminal logic behind targets
    - Prevents over-reliance on opaque public targets
    - Sell-side note collection and model rebuild
  - - Capital path to key inflections
    - Cash use by asset and minimum financing needed to reach decisive readouts
    - Clarifies whether current premium should include future dilution
    - Management diligence and scenario model
  notes: |-
    If these diligence asks close well, the recommendation can upgrade even without a dramatic change in the business itself.
  claimRefs:
