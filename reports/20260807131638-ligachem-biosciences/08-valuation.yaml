- id: S4
  title: Final Diligence Asks and Thesis-Break Triggers
  body: |-
    The last step is to be explicit about what would change the view. An upgrade requires either better evidence or better price. Better evidence would mean: clear early human data in LCB02A or other priority assets, partner-level economics that show real cash-conversion quality, CMC evidence that supports eventual scale-up, and visibility into launch or late-stage readiness for self-developed assets. A better price would mean the market has given up some of the current optionality premium without the core thesis breaking.

    The main thesis-break triggers through 2027 are equally straightforward. If lead safety or efficacy signals disappoint, if the 2026 war chest burns down faster than expected, or if partner momentum stalls, the current premium can compress quickly toward public-peer territory. Conversely, if the company shows it can convert platform optionality into de-risked product value faster than it consumes capital, today’s premium will look more justified. Until then, the investment case remains live but not yet conviction-grade at the current price.
  claimRefs:
  - CV039
  - CV040
  - CV041
  - CV042
