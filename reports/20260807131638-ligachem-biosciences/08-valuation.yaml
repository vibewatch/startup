  name: LigaChem Biosciences
chapter:
  number: 8
  title: Valuation
  summary: |-
    LigaChem deserves to stay investable, but not price-insensitive. The company has stronger partner validation, more capital, and a broader ADC platform than most clinical-stage biotechs, yet the current public valuation already embeds a large amount of future success relative to disclosed revenue and current proof depth. Yahoo Finance places the company at roughly KRW 4.125 trillion of market capitalization on 2026-08-07, versus 2026 sales estimates of roughly KRW 284 billion and 2027 estimates of roughly KRW 286 billion—an elevated forward revenue multiple for a business that still has no marketed flagship product and no posted results for the current lead-trial set. Public ADC biotech comparables such as ADC Therapeutics and Sutro trade far lower, while premium strategic anchors such as Seagen and ImmunoGen were tied to approved or clearly de-risked products. The correct conclusion is therefore not 'bad company' but 'high-quality optionality already priced rich.' Recommendation: track / research more at current levels, with medium confidence and a high risk rating; upgrade only if either price compresses meaningfully or human data, CMC proof, and partner economics improve materially.
