- id: S2
  title: 'Competitor Profiles: Where the Benchmarks Are Strongest and Where LigaChem Actually Overlaps'
  body: |-
    The strongest commercial benchmark is ENHERTU. Official patient and HCP pages show a franchise that already spans multiple HER2-defined breast-cancer settings, NSCLC, gastric cancer, and HER2-positive solid tumors. BioMed Nexus describes it as the best-selling ADC, which matters less as a sales brag than as proof that one linker-payload system can become a platform with repeatable clinical and commercial expansion. ADCETRIS remains narrower by disease area but still matters because its official materials emphasize eight indications and more than a decade of clinical use. TRODELVY and PADCEV add a different lesson: both pair their label with clear ordering, benefits-investigation, and copay-support surfaces that demonstrate what scaled oncology commercialization looks like once an ADC wins approval.

    Among independent specialists, ADC Therapeutics is the clearest public peer that has reached commercialization, though its focus is narrower and more hematology-heavy than the broad solid-tumor ambitions surrounding ENHERTU. Sutro competes through platform claims about single- and dual-payload engineering rather than through current commercial heft. Mersana provides the most important adverse case: even with a differentiated B7-H4 ADC and an additional pipeline, it exited the market through acquisition and delisting rather than by compounding into a durable standalone winner. Hanmi deserves attention as a Korean adjacent challenger because its AACR 2026 disclosures show a willingness to pursue bispecific ADC designs, which means LigaChem cannot assume home-region scarcity of modality innovation. The overlap is therefore real, but it is concentrated in platform credibility, next-generation chemistry, and partner attention rather than in direct product promotion today.
