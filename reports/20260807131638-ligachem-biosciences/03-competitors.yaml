- id: S3
  title: Capability, Pricing Structure, Distribution Power, and Switching Costs
  body: |-
    Capability comparisons are asymmetric because approved incumbents and platform licensors solve different jobs. For ENHERTU, ADCETRIS, TRODELVY, and PADCEV, public evidence covers labels, warnings, packaging, access support, and treatment workflows. For LigaChem, the public surface instead highlights chemistry focus and partnership orientation. That means a simple feature matrix must mark several cells as unknown rather than pretending the company already has downstream capabilities it has not disclosed. The cleanest apples-to-apples comparison is not net price per course of therapy, which is not consistently public, but contract structure. LigaChem seeks upfronts, milestones, and royalties from partners; the incumbents monetize approved vials and then reinforce utilization through reimbursement and patient-support programs.

    Distribution power therefore sits overwhelmingly with large-pharma incumbents. They control oncologist relationships, coverage resources, coding guidance, field reimbursement teams, and manufacturing supply chains. LigaChem's model avoids the need to build that stack immediately, which is a capital advantage, but it also leaves bargaining leverage with partners that already own commercial infrastructure. Switching costs after a partner selects an ADC platform are real because process know-how, translational datasets, and manufacturing workstreams become asset-specific. But before signature, multi-homing is likely high: public market and landscape sources show a crowded field of vendors, China-originated assets, and multiple ways for big pharma to source ADC capability. LigaChem's competitive problem is thus to become sufficiently differentiated that a partner stops treating it as one option among many chemistry suppliers.
