chapter:
  number: 3
  title: Competitors
  summary: |-
    LigaChem competes in ADC through a different choke point than the commercial franchises dominating public attention. The company is not yet selling a marketed therapy, so its first competitors are approved-ADC incumbents such as Daiichi Sankyo/AstraZeneca, Pfizer/Seagen, Gilead, and Astellas/Pfizer that shape partner expectations for clinical proof, safety management, reimbursement support, and manufacturing reliability; and independent platform companies such as ADC Therapeutics, Sutro, and the former standalone Mersana that compete for investor capital, licensing mindshare, and scarce ADC development talent. LigaChem's differentiator remains its licensing-oriented conjugation platform and Korean-origin chemistry reputation, but public evidence still favors incumbents on clinical validation and commercial infrastructure. Adverse evidence matters: the Day One takeout of Mersana and the small-cap trading profiles of ADC Therapeutics and Sutro show that independent ADC platforms can struggle to sustain premium standalone valuations without clearer late-stage or commercial wins.
