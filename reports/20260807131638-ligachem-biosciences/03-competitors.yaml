    - Clarify which assets are destined for self-development versus perpetual out-licensing
  - - ADC science itself is the moat
    - Approved leaders already own the strongest clinical validation, while safety and manufacturing remain hard for everyone
    - Medium-High
    - Modality novelty alone is insufficient in a 23-approved-product market
    - Track clinical differentiation, manufacturability, and safety window with explicit external benchmarks
