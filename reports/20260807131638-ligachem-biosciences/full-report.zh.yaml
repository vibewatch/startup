  - id: TU001
    slug: customer-segmentation
    title: 客户分群表
    description: Who buys, uses, and pays for LigaChem's platform and assets.
    columns:
      - 分群
      - 买方 / 用户 / 付款方
      - 用例
      - 规模
      - 收入 / 战略价值
      - 缺口
    rows:
      - - 产品授权药企合作伙伴
        - 买方：BD/R&D；用户：临床开发组织；付款方：首付款 / 里程碑交易对手
        - 授权指定 ADC 资产用于全球开发
        - 锚定的实名客户包括 Ono 和 Janssen
        - 可产生很大的里程碑池和版税
        - 无公开续约或满意度指标
      - - 平台授权肿瘤合作伙伴
        - 买方：合作伙伴发现 / 组合团队；用户：合作伙伴 ADC 团队；付款方：平台费和里程碑
        - 将 ConjuAll 和连接子-载荷技术栈用于合作伙伴选定靶点
        - 实名证据包括 SOTIO 和 Ono
        - 验证平台不只靠单一分子成立
        - 单个靶点的商业深度仍不透明
      - - 权益拆分的区域合作伙伴
        - 买方：区域生物技术公司 / 药企；用户：本地临床 / 商业团队；付款方：按地区划分的被许可方
        - 在地区权益拆分下开发同一资产
        - Fosun 覆盖大中华区；Iksuda 覆盖 LCB14 的大中华区 / 韩国以外地区
        - 不必完全自建全球化，也能扩大覆盖
        - 造成客户经济性碎片化
      - - 共同开发 / 股权绑定合作伙伴
        - 买方：合作伙伴管理层 + 投资人；用户：联合管线团队；付款方：授权与股权资本组合
        - 围绕多个资产和控制权加深关系
        - Iksuda 是最清晰案例
        - 相比简单对外授权，可捕获更多下游价值
        - 抬高治理和执行复杂度
      - - 临床合作伙伴
        - 买方：合作伙伴 R&D / 转化团队；用户：试验运营方
        - 推动合作资产完成 IND 和 1 期活动
        - NextCure 和 CStone 提供当前证据
