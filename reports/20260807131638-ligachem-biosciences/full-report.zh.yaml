        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              领导结构呈现创始人象征与职业化日常管理的分工。创始人 Yong-Zu Kim 仍以董事长和长期科学架构师身份出现；公开领导层页面和 Yahoo 资料则将 Sejin Park 列为 CEO
              兼总裁。治理页面也显示，控制权已不再纯粹围绕创始人：与 Orion 相关的高管占据多个内部董事席位，说明 Pan Orion 2024
              年成为最大股东后，持股地位已经转化为可见的董事会影响力。与许多亚洲生物技术同行相比，公司治理披露更强：董事会页面列出外部董事，披露出席率和会议频次。但它仍没有用英文完整说明委员会结构、保留事项权利，或创始人、管理层与
              Orion 代表之间的实际影响力平衡。
