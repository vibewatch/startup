      - number: '8.2'
        title: 融资和可比公司支撑溢价，但不是无条件溢价
        blocks:
          - type: paragraph
            body: >-
              公开可比公司给出两种方向。一方面，ADC Therapeutics、Sutro Biopharma 等上市开发阶段 ADC 同行的市值，比 LigaChem 低数亿美元。CStone
              虽然是已上市的亚洲肿瘤生物科技公司，商业和临床背景更宽，但按当前市值筛选仍低于 LigaChem。这提醒投资者：即便是真实的 ADC
              故事，公开市场也可能极度苛刻。另一方面，战略并购锚点显示了品类头部能拿到的价格：Seagen 约 430 亿美元，ImmunoGen 在获批产品和后期验证之后达到每股
              $31.26。这些结果巨大，但买家并不是为未经验证的故事买单。


              LigaChem
              夹在这两端之间。它显然强于普通早期平台公司；从合作伙伴验证和选择权价值看，也可能强于部分上市同行。但相比已获批产品驱动的战略收购，它的降风险程度明显更低。因此，混合可比组才是唯一诚实的方法。当前公开价格为何显得贵而非疯狂，也由此能解释：公司配得上溢价，但这个溢价不能脱离证据到不再受证据约束。
