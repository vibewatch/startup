      - number: '1.3'
        title: 资本形成与市场背景
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月 National Growth Fund 融资是本报告当前最关键的事实。公司公告和多家韩国新闻媒体都指向一笔 KRW 500B 交易，结构为 KRW 170B 可转债和 KRW 330B
              可转换优先股，期限较长。公司强调，这笔钱专门投向 R&D 和后期临床开发，不用于 M&A；外部授权引擎仍保留，而不是被取代。这个点有分析意义：LigaChem
              想增加选择性的后期自研能力，但不放弃已经贡献现金储备的授权机器。融资条款也试图在纸面上显得友好：无折价、延后转换权，并设置转让限制。即便如此，公开市场反应并不亢奋。NEWSTOP 报道公告当天股价下跌
              8.28%，说明即便有国家背景资本背书，市场仍担心稀释、执行，或整个生物技术板块的疲劳。
