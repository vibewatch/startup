  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点和反论点都必须先看价格敏感性
        blocks:
          - type: paragraph
            body: >-
              LigaChem 不是一家可以轻描淡写带过的公司。它有真正的 ADC
              平台、扎实的合作伙伴验证、多个人体试验项目，也拿到了足以支撑更激进战略的融资，而许多同行负担不起。市场给它溢价，有真实理由。大型药企和专业生物科技交易对手反复选择该平台，2026
              年再融资和持续里程碑也说明，公司不只是一个科学项目。因此，正面论点很清楚：LigaChem 具备战略价值、产品选择权和足够的市场关注度，值得投资者继续盯住。


              反论点同样重要。当前估值已经假设，很大一部分选择权会转成未来价值。市值约 4.125 万亿韩元，而 2026 年收入预期只有约 2840
              亿韩元，市场并没有按近期基本面给一家亏损型生物科技公司定价，而是在给未来管线和平台成功定价。如果数据和执行很快降风险，这套定价可以成立；如果投资者把理论里程碑上限、分析师目标价空间或战略股东背书误认为已经验证的商业经济性，就会危险。本章第一件事不是判断公司好不好，而是判断当前价格是否已经替投资者预支了太多未来。
            claimRefs:
