  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型：高毛利授权，还不是可重复产品经济性
        blocks:
          - type: paragraph
            body: >-
              LigaChem 已经报告了有意义的收入，但收入机制更接近平台变现，而不是传统生物医药商业化模型。官方 2025 年合并报表显示，收入为 KRW 141.553B，其中 KRW 121.161B
              来自授权费收入，只有 KRW 20.392B 来自商品销售。这个结构很关键：公司已经证明能把科学合作转成现金，但最大科目取决于里程碑时点、伙伴决策和合同确认，而不是可重复的处方需求。Ono
              一揽子交易展示了这种结构。公司披露潜在经济条款最高可达 $700 million 加特许权使用费；2026 年 7 月 LCB97 里程碑也显示，伙伴推进项目时，收入或现金可以突然跃升。


              这个模型不应被绝对地视为低质量，因为授权收入可以带来优秀的增量利润率，也验证了平台的外部需求。但它应被视为低可预测性收入。公开披露没有干净列出按资产划分的伙伴集中度、里程碑时间表或特许权使用费阶梯。商品销售看起来真实且持续，但管理层和第三方资料都明确表明，它们在
              ADC 授权引擎之后。投资人因此需要区分收入规模和收入可重复性：LigaChem 已经搭出变现引擎，但这个引擎仍由交易驱动。
