  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 顶层风险栈：资本更多、雄心更大，但仍有临床阶段脆弱性
        blocks:
          - type: paragraph
            body: >-
              LigaChem 的核心风险没有变：公司价值仍取决于 ADC 分子能否从机制可信，跨到人体疗效、耐受性和可制造可重复性。变化的是雄心规模。2026
              年融资给公司更多跑道，去推进后期开发甚至自研；但同一转向也增加了投资论点破裂的路径数量。公司不再只是一个期待伙伴验证的平台销售方，而是在变成平台 + 开发的混合公司，可能需要同时管理试验执行、资本配置、CMC
              准备和伙伴关系。


              因此，风险栈是多维的。临床失败仍是最高严重度风险，因为当前研究仍处于早期，引用试验都没有发布结果。制造和 CMC 排在其后，因为 ADC
              表现高度依赖偶联质量和可重复性，而公开质量证据很薄。伙伴和客户依赖仍高，因为若干关键资产在外部控制之下。融资风险低于融资前，但没有消失，因为公司现在在资助一条更昂贵的战略。最后，法律和 IP
              保护看起来真实但不完整：活跃专利存在，但公开 FTO 可见度有限。
