      - number: '6.2'
        title: 具名客户证明：最强证据来自里程碑与试验进展
        blocks:
          - type: paragraph
            body: >-
              具名证明集比普通初创公司 logo 页强得多，因为多个交易对手已经进入硬性运营里程碑。Ono 是最干净的例子。2024 年一揽子交易覆盖 LCB97 和更广泛的 ConjuAll 平台权利；到 2026 年 7
              月，这段关系已经推进到首例患者给药，并触发估计超过上一年收入 10% 的里程碑。SOTIO 是另一个高质量证明点：2021 年协议覆盖最多 5 个项目，将下游开发和商业化责任放在 SOTIO 一侧；到 2026
              年初，SOT106 进展已经带来另一笔里程碑。


              Iksuda 和 CStone 增加了多年连续性和运营深度。Iksuda 的关系覆盖 Greater China 和 South Korea 之外 LCB14
              的全球权利，之后进入首例患者临床活动，最终又形成战略股权绑定，把 LigaChem 拉近管理参与。CStone 将 CS5001 从 2020 年授权推进到 2024 年末 Phase 1b。Janssen 和
              NextCure 也有意义，只是本次保留的公开证据对新近下游里程碑较薄。总体上，最好的规则很简单：客户关系只有从合同文字跨入试验登记、患者给药或里程碑经济性，才值得承销。LigaChem 已经有多个关系做到了。
