      - number: '7.2'
        title: 监管、法律与临床风险：科学是真实的，证明仍然很薄
        blocks:
          - type: paragraph
            body: >-
              监管和临床证据一边验证平台，一边凸显风险。4 条活跃 ClinicalTrials 记录显示，多个 LigaChem 衍生项目确实进入人体测试；但它们都仍背负剂量递增逻辑、biomarker
              设门槛和排除标准，这些都是治疗窗口尚不确定药物的典型特征。LNCB74 排除既往 MMAE-ADC 暴露以及肺部或眼部风险因素；LCB02A 排除既往 Topo1-payload ADC 暴露；IKS014 排除
              ILD 和角膜异常。这些不是抽象担忧——它们写进了方案。没有发布结果意味着投资人仍不知道哪些项目能在商业相关剂量下同时实现疗效和耐受性。


              法律图景比纯概念阶段平台更好，但仍不完整。Google Patents 记录显示，LigaChem 拥有自裂解和偶联相关的活跃专利，这是真实保护。但公开材料没有提供完整 FTO 地图、到期矩阵或纠纷历史。更广泛的
              ADC 领域显然诉讼不少，就连可比偶联家族也出现诉讼标记。正确结论是，IP 是缓释项，不是完整答案。没有更深尽调时，法律 / IP 剩余风险仍为中高。
