  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：已获批 ADC 产品系列、平台同行与韩国相邻挑战者
        blocks:
          - type: paragraph
            body: >-
              LigaChem 的竞争格局必须按竞争发生的位置拆分。已获批产品层由 Daiichi Sankyo/AstraZeneca 的 ENHERTU、Pfizer/Seagen 的 ADCETRIS 组合、Gilead
              的 TRODELVY 产品系列，以及 Astellas/Pfizer 的 PADCEV 项目主导。从当前窄口径看，这些公司不是 LigaChem 的直接销售竞争者，因为 LigaChem
              还没有上市药物；但它们是最重要的基准竞争者，因为它们的产品系列定义了制药伙伴如今眼中经过验证的 ADC 表现。它们在标签广度、医生熟悉度、不良事件管理、编码支持和报销运营上都有证据。任何评估 LigaChem
              管线或 ConjuALL 式化学体系的全球伙伴，都会把其潜力与这些可见参照标准比较。


              第二层是独立或近期仍独立的 ADC 专家，例如 ADC Therapeutics、Sutro Biopharma，以及曾经的 Mersana。这些同行更像
              LigaChem，因为它们销售平台、聚焦管线，或两者兼有，也必须说服伙伴或投资人相信，其化学体系或载荷架构足以拿到持久经济性。公开来源显示，这一组有真实技术雄心，但结果参差不齐。ADC Therapeutics
              已进入商业化阶段，Sutro 仍在公开市场证明其下一代平台，Mersana 则通过现金收购失去独立性。第三层包括韩国和亚洲起源的挑战者，例如 Hanmi 的双特异性 ADC 工作，以及由中国带动的 ADC
              交易流加速。区域压力很重要，因为它增加了同一批全球伙伴可选择的替代方案数量，而 LigaChem 正在争取的正是这些伙伴。
