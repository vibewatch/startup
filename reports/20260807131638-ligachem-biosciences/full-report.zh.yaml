      - number: '2.4'
        title: 增长驱动、瓶颈与模式迁移
        blocks:
          - type: paragraph
            body: >-
              ADC
              最强的多头逻辑已经不再只是「靶向化疗」。癌症发病率上升、临床试验快速扩张、标签扩展、生物标志物路径更丰富，以及双载荷、多特异性、免疫整合构型等平台创新浪潮，都在推高这个板块。大型既有巨头正在验证这种转向：Roche、Pfizer
              等大型制药公司现在把 ADC 视为核心肿瘤平台，Pfizer 收购 Seagen
              也显示，成熟偶联药物产品系列可以被赋予多高的战略价值。但瓶颈同样真实。制造仍昂贵且运营上高度专门化；开发背负剂量优化、免疫原性和药理学要求；报销仍可能因价格或证据不确定而失败。这组因素让 ADC
              成为结构上有吸引力、但运营上低容错的市场——对 LigaChem
              这类差异化平台拥有者有利，但前提是它们能持续比同行更好地解决载荷、连接子、安全性和伙伴执行问题。它也解释了为什么简单的市场增长标题会误导：即便品类高速增长，只有拿到制造产能、让监管满意并跨过报销门槛的开发商，才能把创新转成持久经济性。
