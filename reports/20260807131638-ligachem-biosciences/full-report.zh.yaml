      - number: '5.4'
        title: 信任、安全与质量控制
        blocks:
          - type: paragraph
            body: >-
              公开来源中最强的信任信号不是认证，而是方案纪律。ClinicalTrials 材料显示，研究受 FDA 监管，设有明确的剂量递增和剂量扩展结构，使用 RECIST 或 Lugano 等客观缓解指标，要求 ECOG
              体能状态、器官功能阈值，并设置产品特异性排除标准。LNCB74 排除既往 MMAE-ADC 暴露、ILD/pneumonitis 病史、神经病变和角膜疾病。LCB02A 排除既往 Topo1 ADC
              暴露。IKS014 排除 ILD/pneumonitis 和临床显著眼部异常。这些都是具体迹象，说明公司及其伙伴理解类别特异性安全负担，并在设计中绕开这些风险。


              但信任缺口仍然重要。引用资产没有公开的制造认证、批放行指标、供应可靠性统计，或已发布临床结果。更广泛领域的综述仍强调毒性、异质性、耐药和复杂制造是 ADC 成功尚未解决的约束。这意味着 LigaChem
              的信任论证目前在试验设计和科学依据层面最强，在制造质量和市场可靠性层面较弱。因此，产品技术尽调问题不是有没有真实平台——平台确实存在——而是公开证明是否已经深到足以承销持久规模和稳定执行。
