      - number: '8.4'
        title: 最终尽调问题和推翻论点的触发器
        blocks:
          - type: paragraph
            body: >-
              最后一步要明确什么会改变判断。上调评级需要更好证据，或更好价格。更好证据意味着：LCB02A 或其他优先资产拿出清晰早期人体数据，合作伙伴层面的经济条款显示真实现金转化质量，CMC
              证据支撑未来放大生产，并且自主开发资产的上市或后期准备能看得见。更好价格意味着，市场让出部分当前选择权溢价，而核心论点没有破裂。


              到 2027 年，主要推翻触发器同样直接。如果领先项目安全性或疗效信号令人失望，如果 2026
              年现金弹药消耗快于预期，或合作伙伴势头停滞，当前溢价可能很快压缩到公开同行区间。反过来，如果公司能在消耗资本之前，更快把平台选择权转成已降风险的产品价值，今天的溢价就会更站得住。到那之前，投资逻辑仍然成立，但按当前价格还不到高信念级别。
