      - 决策含义
    rows:
      - - 跟踪 / 继续研究
        - 中
        - 高
        - 估值偏贵 / 对证据敏感
        - 没有更好数据或更好入场价，不追当前价格
      - - 有条件上调路径
        - 中，证据改善后可升至高
        - 高，有证据后可降至中
        - 需要更强的人体、CMC 和经济性证据
        - 保持主动尽调，而不只是被动观察
    notes: 建议取决于证据和价格，不是泛泛的质量打分。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 拥有真实平台可选性，并获蓝筹伙伴验证
        - 若当前重点资产拿出人体证据并提高 CMC 可见度，判断会增强
      - - 2026 年融资显著降低短期偿付风险
        - 若现金消耗再加速，或关键拐点前还需融资，判断会削弱
      - - 公开市场已计入相当多的未来成功
        - 若价格压缩，或证据改善快于市场预期，判断会改善
      - - 没有已上市旗舰产品，也没有公布重点试验结果，仍是核心反论点
        - 若自主推进资产出现人体概念验证数据，反论点会削弱
    notes: 核心争论不是抽象公司质量，而是当前报价里已经埋入了多少成功。
    claimRefs:
      - CV006
      - CV007
      - CV010
      - CV011
      - CV029
      - CV030
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - LCB02A 早期人体数据有进展，合作伙伴里程碑持续兑现，CMC 放大路径可信
        - 支撑价值显著高于当前市值，并更接近战略溢价逻辑
        - 仍暴露于执行和稀释风险
        - 低至中
      - - 基准
        - 平台仍有价值，但去风险更慢，现金消耗仍大
        - 当前报价已覆盖大部分近期合理价值；上行需要耐心
        - 证据、时点和可比公司匹配度仍不完美
        - 中至高
      - - 熊市
        - 临床延误、伙伴进度滑坡、现金消耗加重，或估值倍数向公开同业压缩
        - 价值明显低于当前报价，事后看显得透支
        - 临床和融资挫折可能快速叠加
        - 中
    notes: 情景逻辑对里程碑和概率敏感，因为单一倍数法对当前阶段过于粗糙。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV039
      - CV042
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        The set intentionally mixes current public trading comps, Asia-listed biotech context, and strategic ADC M&A
        anchors because no single comparable family fits LigaChem cleanly.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - LigaChem 当前公开报价
        - 市值与远期销售额
        - ~KRW 4.125T 市值；约 14.5x 2026 年销售预测
        - 最好的实时入场锚点
        - 收入基础仍以授权为主，且受事件驱动
      - - ADC Therapeutics
        - 公开市场市值
        - ~$0.14-0.15B
        - 说明公开市场对 ADC 叙事可以很冷
        - 资产组合和商业化轮廓不同
      - - Sutro Biopharma
        - 公开市场市值
        - ~$0.40-0.41B
        - 有用的平台型公开可比公司
        - 仍不能直接类比 LigaChem 的伙伴模式
      - - CStone Pharmaceuticals
        - 亚洲上市肿瘤生物科技市值
        - ~HKD 6.9B 至 8.4B
        - 区域上市生物科技语境比纯美国同业更接近 LigaChem
        - 商业模式和产品组合不同
      - - Pfizer / Seagen 收购
        - 战略并购 EV
        - 企业价值约 $43B
        - 显示世界级已获批 ADC 产品组合的上限
        - 去风险程度远高于 LigaChem
      - - AbbVie / ImmunoGen 收购
        - 战略并购与获批产品锚点
        - 以 $31.26/股收购，含已获批 ELAHERE 和后期管线
        - 显示产品获批和标签扩展可见后，价值会抬升
        - 同样，比 LigaChem 阶段晚得多
    notes: 这组混合可比对象是优点，不是缺陷：更干净的可比集看起来更精确，但更不诚实。
    claimRefs:
      - CV001
      - CV003
      - CV013
      - CV014
      - CV015
      - CV016
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: TV005
    title: 论点破裂与放弃触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 重点资产安全性或疗效令人失望
        - LCB02A 或 LNCB74 人体数据出现明确负面信号
        - 削弱平台溢价叙事和自主开发上行空间
        - 立场转向回避 / 低配
      - - 资金续航恶化
        - 有证据显示 2026 年融资不足以支撑到关键拐点
        - 抬高稀释风险，降低战略期权价值
        - 要求更低入场价或更强融资结构
      - - 伙伴动能停滞
        - 里程碑放缓、伙伴管线地位下降，或交易对手降低资产优先级
        - 削弱护城河和客户验证支柱
        - 下调牛市和基准情景概率
      - - 自主开发加深，但 CMC 证据仍缺位
        - 虽有后期开发野心，却看不到制造准备度升级
        - 让溢价更难自圆其说
        - 将战略转向视为资源不足
      - - 没有证据，价格先涨
        - 报价在没有去风险证据下明显高于当前水平
        - 进一步把风险收益不对称推向不利于新投资者
        - 仅保留在观察名单
    notes: 关键放弃标准大多可从公开数据和后续尽调中观察，因此建议具备可执行性。
    claimRefs:
      - CV038
      - CV039
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 伙伴层面经济条款
        - 收入分成、里程碑日程、版税时点、交易对手敞口
        - 区分真实变现质量与理论交易价值
        - 财务 + BD 尽调，并审阅合同
      - - CMC 与上市准备度
        - 制造网络、QA 指标、放行历史、上市规划
        - 判断自主开发溢价是否可信
        - 运营 + 技术尽调
      - - 自由实施与 IP 范围
        - 全组合专利族、到期日、引进许可义务、挑战历史
        - 检验护城河是否守得住，还是只是看起来可行
        - IP 律师尽调
      - - 分析师模型假设
        - 目标价背后的成功概率、WACC、收入爬坡和终值逻辑
        - 避免过度依赖不透明的公开目标价
        - 收集卖方报告并重建模型
      - - 通往关键拐点的资本路径
        - 各资产现金用途，以及到达决定性读数所需最低融资
        - 厘清当前溢价是否应纳入未来稀释
        - 管理层尽调和情景模型
    notes: 如果这些尽调问题都能良好收口，即便业务本身没有剧烈变化，建议也可以上调。
    claimRefs:
      - CV040
      - CV041
      - CV042
