      - number: '7.3'
        title: 运营、伙伴与客户依赖风险
        blocks:
          - type: paragraph
            body: >-
              LigaChem 的伙伴模式减少了一部分直接运营负担，但制造出另一种脆弱性：价值兑现取决于许多外部组织同步前进。Ono 控制 LCB97 下游。SOTIO 控制其授权项目的研究、开发、制造和商业化。Iksuda
              运行关键 HER2 和 CD19 项目，同时也与 LigaChem 处在更纠缠的战略关系中。CStone 和 NextCure 运营其他外部推进资产。实际后果是，即便 LigaChem
              能展示广泛验证，只要一个或多个伙伴放慢入组、重新排序管线，或没能把早期数据转成后期投资，公司仍可能错过经济预期。


              客户集中度会放大这种依赖。公开来源显示具名交易对手很强，但没有显示按伙伴划分的收入拆分、流失或里程碑时点。Ono 里程碑价值至少达到上一年收入 10%，说明可见经济性可以非常集中。IKS014 / FS-1502
              在 Iksuda 和 Fosun 之间的权利拆分结构，也增加了协调和治理复杂度。这是一个多元的科学生态，但很可能还不是多元的经济生态。
