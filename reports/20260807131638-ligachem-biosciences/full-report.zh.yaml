  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品到底是什么：平台 + 管线型 ADC 公司
        blocks:
          - type: paragraph
            body: >-
              LigaChem 的产品最好理解为一套技术栈加一个资产组合，而不是单一商业化药物。官方公司页面把业务定义在下一代 ADC
              和药物化学上；管线页面则展示一组广泛的靶点-载荷组合，而不是一个旗舰模块。从客户工作流看，第一位客户通常是希望获得已对准靶点的候选物，或其背后偶联引擎的制药或生物技术伙伴。第二层下游客户是临床网络，它们必须把生物标志物阳性入组、给药排程和最终商业化落到运营上。这解释了为什么公司可以同时报告平台合作、单产品授权和内部推进资产。


              产品地图已经相当宽。公开材料显示
              HER2-MMAF、CD19-pPBD、B7H4-MMAE、CLDN18.2-Topo1i、LRRC15-MMAE，以及额外的双特异性或实体瘤项目，说明公司正通过多个生物靶点和多个载荷类别表达其平台。这种宽度很重要，因为它暗示公司销售的是可重复的化学与开发能力。但产品定义仍处于商业化前：公司还在证明这些资产能否从架构和早期临床设计，毕业为持久、已上市的肿瘤产品。
