        title: 伙伴引擎与里程碑
        blocks:
          - type: paragraph
            body: >-
              LigaChem 当前的重要性，更多来自 ADC 伙伴机器的速度和规模，而不是产品收入。公司官方历史记录了与 Amgen、NextCure、Ono、J&J 的里程碑交易，独立媒体报道则给出了
              J&J/Janssen LCB84 协议的具体经济条款。Korea Biomedical Review 补充了有用的规模指标：截至 2026 年 6 月，公司已有 14 笔全球授权交易和 8
              项全球临床试验。如此密集的伙伴关系解释了为什么一家韩国上市生物技术公司能拿到异常大额的政策资本：国家基金资助的不是从零开始的科学项目，而是一个已经能把 ADC 资产放进全球管线的平台。2024–2026 年
              LNCB74、LCB97/ONO-7429 和 LCB02A 的 IND 里程碑进一步说明，公司正把越来越多内部起源资产推过早期人体开发闸门。
