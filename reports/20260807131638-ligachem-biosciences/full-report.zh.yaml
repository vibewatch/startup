      - number: '6.3'
        title: 持久性、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              客户章节最难的是持久性，因为 LigaChem
              是生物技术授权方，不是订阅软件公司。保留来源没有提供按群组划分的客户数、续约率、GRR、NRR，甚至没有伙伴收入拆分。这迫使分析转向代理指标。最佳可用代理指标，是从初始交易到后续里程碑或更深范围的关系连续性。按这个标准，平台表现好于平均水平。Iksuda
              从授权扩展到股权和管线控制。Ono 先是单资产授权，后来又买入多靶点平台准入。SOTIO 从平台协议推进到后续里程碑证明。CStone 将授权资产推进到更后期临床阶段。这些都说明，客户在初始新闻稿之后仍保持投入。


              但持久性不等于集中度透明。公开证明明显集中在少数交易对手和资产上。由于这个模型的经济性不连续且由里程碑驱动，一项研究延迟或一个伙伴重新排序管线，都可能对已确认收入造成放大影响。2026 年融资给 LigaChem
              更大自研自由度，也反过来凸显这个缺口：公司看起来正在增加内部可选性，正因为单靠伙伴主导变现不足以抹平收入模型。客户群在战略质量上强，但还不够宽、也不够透明，不能排除集中度风险。
