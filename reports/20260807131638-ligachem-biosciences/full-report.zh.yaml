  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户是谁：交易对手，而非终端用户
        blocks:
          - type: paragraph
            body: >-
              LigaChem 当前客户群最好用生物技术授权视角来看。公司还没有把成品药卖给医院、支付方或消费者。它卖的是 ADC
              平台准入、单个产品候选物准入，或共同开发权。官方公司材料明确把伙伴模式定义为联合研究、共同开发和授权。这让客户定义异常清楚：直接买方是愿意为独家权利付费的制药和生物技术组织；直接用户是把资产继续向前推进的伙伴
              R&D 和临床开发团队；经济支付方则是同一批交易对手，通过首付款、里程碑和未来特许权使用费付款。


              这个客户群已经足够宽，可以有意义地分层。有 Ono、Janssen 这样的产品授权伙伴；有 SOTIO、Ono 这样的平台授权伙伴；有 Iksuda 加 Fosun 这样的共同开发和权利拆分关系；也有
              CStone、NextCure 这样的伙伴开发关系。官方历史页面显示，这些不是为了撑门面的零散名字；伙伴名单跨越多年和多种资产类型。含义是，LigaChem 在全球 ADC 生态里已经获得真实的 BD
              市场采纳。未解问题不是交易对手是否存在，而是其经济性有多集中。
