      - number: '3.4'
        title: 护城河耐久性与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              LigaChem 护城河最强的论据是，重复授权活动说明外部公司认可其偶联和化学能力。但公开记录中，这条护城河仍只被部分验证，因为它还没有转化为一个已上市的自有产品系列，也没有转化为 ENHERTU
              那种多适应症标签扩展。公开证据显示，这个板块已经挤满跨多个靶点的已获批产品，大型制药公司也已经习惯大规模收购或合作已降险资产。当 LigaChem
              拿出有说服力的数据时，这会帮到公司；当买方能够让多个资产来源相互竞价时，这也会伤到公司。


              本章里，反向证据尤其重要。Mersana 被收购说明，即使是差异化 ADC 平台，结局也可能是被卖掉，而不是独立复利。ADC Therapeutics 和 Sutro 相比主导已获批 ADC
              的制药集团仍处于小市值位置，说明投资人仍怀疑独立 ADC 专家能否在缺少更广泛证明时捕获产品系列级经济性。与此同时，所有已获批龙头仍背负显著安全负担，BioMed Nexus
              也强调制造产能仍困难且专门化。合在一起，这些信号意味着 LigaChem 的竞争耐久性不是靠泛泛宣称 ADC 有前景来赢，而是取决于其平台能否比拥挤的全球替代方案更快、更干净或更经济地持续产出可合作资产。
