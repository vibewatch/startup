      - number: '4.3'
        title: 资本充足性：按 2025 年烧钱速度跑道不到 12 个月，随后 2026 年融资重塑局面
        blocks:
          - type: paragraph
            body: >-
              2026 年融资前，公开数字指向一家明显依赖外部资本的公司。官方和 Yahoo 现金流页面都显示，2025 年经营现金流出约 KRW 124.533B，年末现金约 KRW
              98.650B。按这个简单口径，LigaChem 的跑道不到一年。2026 年资本重组大幅改变了图景。官方 Q&A 和多篇外部报道描述了一笔 KRW 500B 融资，拆分为 KRW 170B 可转债和 KRW
              330B 可转换优先股，明确用于资助 R&D 和后期开发，而不是 M&A。公开报道还描述了转换限制、无折价发行，以及国家背景资本和 Pan Orion 的大额参与。


              即便如此，资本充足性并不会因融资标题金额足够大就完全解决。公开来源对当前现金分歧很大，从约 KRW 60.7B 到 KRW 418B，甚至约 KRW 450B
              不等，取决于来源和定义。差异很可能来自不同截点，或是否计入更广义流动资源，但这让单靠公开材料精确计算跑道变得不可能。此外，向更多自研转移意味着 2025
              年烧钱速度很可能是下限，而不是上限。这轮融资显然买来了时间；如果多个资产同时在内部推进，它并没有消除未来融资风险。
