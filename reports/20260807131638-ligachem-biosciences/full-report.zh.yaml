      - number: '4.2'
        title: 成本结构与单位经济性：毛利看起来强，经营模型还没有
        blocks:
          - type: paragraph
            body: >-
              公开成本结构说明，尽管 LigaChem 报告的收入在临床阶段生物技术公司中异常可观，公司仍不能按传统盈利能力判断。官方 2025 年报表显示，经营费用为 KRW 248.039B，其中 R&D 费用 KRW
              216.908B，对应经营亏损 KRW 106.486B。换句话说，公司花在研发上的钱远高于总收入。Yahoo
              的毛利润科目表面上好看，因为授权费几乎不带传统意义上的收入成本，但那只是经济性的第一层。更重要的问题是，公司还需要投入多少增量科研和临床开支，才能让未来里程碑继续出现。


              因此，CAC 或回本周期这类经典 SaaS 单位指标不适合这门生意。这里的实际变现单位是交易、项目或里程碑，而不是重复订阅或交易群组。更有用的财务镜头是收入质量对比开发强度：已确认授权收入的毛利很高，但 R&D
              强度极高，公司把资产推向更深开发阶段时，经营亏损也很大。商品销售或许能提供更稳定的收入，但其利润率和战略重要性披露不够清楚，无法锚定投资判断。结果是，经营模型在毛利层看起来有效率，在现金流层仍资本密集且脆弱。
