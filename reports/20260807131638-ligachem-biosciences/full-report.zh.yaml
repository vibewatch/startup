      - number: '8.3'
        title: 建议：除非价格或证据改善，否则跟踪 / 继续研究
        blocks:
          - type: paragraph
            body: >-
              按当前报价，合适的建议是跟踪 / 继续研究，而不是买入。这个建议不是否定公司，而是承认当前估值已经假设投资者会拿到一套高质量的未来证据包：领先自主推进资产的人体数据、合作伙伴继续兑现里程碑、可信的 CMC
              准备，以及足以在不遭遇惩罚性稀释前提下撑到这些节点的现金。这套未来证据包可能会到来。但在到来之前，激进买入股票就是提前为相当多的成功付费。


              价格敏感性也由此而来。如果股价大幅压缩，而平台质量或融资位置没有同步恶化，回报逻辑会很快变得更有吸引力。如果价格在缺少人体数据或 CMC
              降风险的情况下继续上涨，不对称性会变差。多头情景真实存在；基准情景仍比市场似乎期待的更慢、更有条件；空头情景也不难想象，因为临床、烧钱和合作伙伴依赖风险都还活着。因此，中等信心和高风险是纪律化结论，不是回避判断。
