      - number: '2.3'
        title: 买方、支付方与采纳路径
        blocks:
          - type: paragraph
            body: >-
              下游 ADC 采纳路径仍高度依赖机构。医院主导当前给药经济学；市场报告也仍把医院和诊所描述为实际终端用户渠道，因为这些疗法需要输注基础设施、生物标志物检测、安全管理和报销协调。支付方控制同样强：NICE 对
              Enhertu 的决定说明，即使临床表现出色，成本效果仍高于可接受门槛时，ADC 也可能被挡在外面；PADCEV
              的支持材料则提醒医护，覆盖范围会随支付方和场景变化，治疗前必须核验。换句话说，科学有效性必要但不充分；真正的市场准入取决于指南位置、处方集接纳和报销流程。对 LigaChem
              来说，任何伙伴不仅要把资产开发成功，还要在主要肿瘤市场穿过 HTA 机构、保险方和治疗场所经济学。
