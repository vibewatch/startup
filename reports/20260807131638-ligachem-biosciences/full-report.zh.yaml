      - number: '5.2'
        title: 架构与运营工作流
        blocks:
          - type: paragraph
            body: >-
              对一家生物技术公司来说，LigaChem 的公开架构异常清晰，因为公司材料和试验记录暴露了主要设计组件。官方材料称，ConjuAll
              技术栈的差异化来自位点特异性偶联、连接子稳定性、毒素释放和药代动力学特征。临床试验 API 随后显示，这套思路如何落到不同资产上：LCB02A 将 CLDN18.2 抗体与 Topo1
              抑制剂载荷连接；IKS014 / LCB14 是靶向 HER2 的 MMAF ADC；IKS03 / LCB73 使用 CD19 抗体和 PBD 前药；LNCB74 则是靶向 B7-H4 的 ADC，采用 21
              天静脉给药周期。这是真实产品架构，不是泛泛营销口号。


              运营工作流很长，也分多阶段。团队先选择靶点和抗体，调校偶联和载荷设计，生成临床前证据；随后以生物标志物设门槛的临床试验经过剂量递增、剂量扩展，最终进入伙伴或自研决策。这个工作流是全球的，不是本地的：引用研究在美国、澳大利亚、新加坡、加拿大、欧洲和韩国招募。与此同时，模型仍依赖伙伴。SOT106
              被明确描述为由伙伴主导开发、制造和商业化；Iksuda 投资则说明，LigaChem 有时通过股权和治理深化控制，而不是把每个职能都内部化。
