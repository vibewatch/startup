      - number: '1.5'
        title: 剩余摩擦与如何使用这条基线
        blocks:
          - type: paragraph
            body: >-
              后续章节最稳妥的做法，是把公司官方历史、股票页面、2026 年 6 月融资公告，以及相互印证的韩国生物技术报道作为基准事实，同时明确保留若干未解缺口。公司显然已经上市，聚焦
              ADC，融资能力也强于大多数临床阶段同行；但 2026 年融资的确切投后估值，在可获得公开材料中仍没有干净披露。未具名的第三家财务投资人、完整 cap table
              权利，以及从现有现金到稀释调整后企业价值的精确桥接都还没有解决。公开运营指标同样不均衡：流动性可见，但员工数、收入结构、产品销售与授权收入的相对贡献，在本次可访问页面上没有清楚披露。因此，后续市场、财务和估值章节应依赖已记录的融资与管线进展，同时对缺乏支撑的封面指标保持保守。
