    type: kpi
    layout: compact
    summary: IC 风格摘要，展示当前证据在最关键维度上的得分。
    data:
      items:
        - label: 市场吸引力
          value: High
          note: ADC 仍是肿瘤治疗中具战略重要性的疗法
        - label: 产品验证
          value: Medium
          note: 有真实临床和合作伙伴信号，但当前主导项目数据仍偏早期
        - label: 客户 / 合作伙伴验证
          value: High
          note: Ono、SOTIO、Janssen、Iksuda 等都是有分量的信号
        - label: 经济性可见度
          value: Medium-low
          note: 授权收入已经存在，但长期转化质量不透明
        - label: 风险评级
          value: High
          note: 临床、CMC、资本和合作伙伴风险仍在
        - label: 当前入场吸引力
          value: Low-medium
          note: 需要更多证据，或者更低价格
