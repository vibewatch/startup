      - number: '3.2'
        title: 竞争者画像：基准最强在哪里，LigaChem 真正重叠在哪里
        blocks:
          - type: paragraph
            body: >-
              最强商业基准是 ENHERTU。官方患者和 HCP 页面显示，这个产品系列已覆盖多个 HER2 定义的乳腺癌场景、NSCLC、胃癌和 HER2 阳性实体瘤。BioMed Nexus 将其描述为最畅销
              ADC，这个事实的意义不在于销售炫耀，而在于证明一套连接子-载荷系统可以成为具备可重复临床和商业扩张的平台。ADCETRIS 的疾病范围更窄，但依然重要，因为其官方材料强调 8
              个适应症和超过十年的临床使用。TRODELVY 和 PADCEV 提供了另一层经验：二者都把标签与明确的订购、权益调查和共同支付支持页面配套，展示 ADC 获批后，规模化肿瘤商业化应是什么样子。


              独立专家中，ADC Therapeutics 是最清晰、已经到达商业化的公开同行，尽管其重点比 ENHERTU 周围的广泛实体瘤雄心更窄，也更偏血液肿瘤。Sutro
              依靠单载荷和双载荷工程的平台主张竞争，而不是依靠当前商业体量。Mersana 提供了最重要的反面案例：即便拥有差异化 B7-H4 ADC
              和额外管线，它也通过收购和退市离场，而不是复利成长为持久的独立赢家。Hanmi 作为韩国相邻挑战者值得关注，因为其 AACR 2026 披露显示，它愿意推进双特异性 ADC 设计，这意味着 LigaChem
              不能假设本土区域缺少技术路径创新。重叠因此是真实存在的，但今天主要集中在平台可信度、下一代化学体系和伙伴注意力上，而不是直接产品推广。
