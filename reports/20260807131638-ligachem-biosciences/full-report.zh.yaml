    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、上市状态与战略重点
        blocks:
          - type: paragraph
            body: >-
              严格从法律意义看，LigaChem Biosciences 不是一家未上市私人公司：官方历史、公司股票页面、Yahoo Finance 和 Stock Analysis 都显示，公司以 141080 为股票代码在
              KOSDAQ 交易，IPO 时间为 2013
              年。这个事实很关键，后续章节应把它视为一家具备创投式经济属性的上市生物技术公司，而不是典型风投支持的未上市初创。与此同时，公司的运营画像仍像一家平台型生物技术公司：公司自称处于临床阶段，总部位于大田，由药物化学驱动，聚焦
              ADC 和免疫肿瘤。2024 年从 LegoChem 更名为 LigaChem 也影响来源辨识：较早的授权和媒体材料仍使用 LegoChem 品牌，而当前公司页面和 2026 年融资公告使用 LigaChem。
