      - number: '5.3'
        title: 成熟度、路线图与依赖结构
        blocks:
          - type: paragraph
            body: >-
              成熟度图景混合，但在改善。LCB02A 已经进入首次人体 1/2 期设计，计划入组 191 人，时间线预计持续多年。LNCB74 正在 1 期招募。IKS014 和 IKS03 都在 Iksuda 旗下推进全球
              1 期项目。SOT106 仍处于 IND 前，但公开目标是 2026 年下半年提交 IND。BigGo 和其他 2026 年报道又加了一层：LCB36 和 LCB58A 被描述为下一批将加速的项目，因为
              LigaChem 正在超越纯外部授权。这让公司在临床阶段 ADC 平台中拥有少见宽度，但也提高了执行依赖，因为许多项目现在争夺资本、管理层注意力和制造规划。


              平台的关键依赖很清楚。生物标志物检测和患者筛选逻辑是必需的，因为试验围绕靶点阳性人群设计。伙伴很重要，因为大量下游开发和商业化仍在 LigaChem
              之外。监管方和试验中心很重要，因为领先资产都还没有发布成熟结果；它们仍是设计阶段或早期招募故事。制造同样重要，即使公开细节有限，因为载荷-连接子质量和 CMC
              可重复性是这个类别的根基。因此，路线图令人兴奋，但还没有降险。
