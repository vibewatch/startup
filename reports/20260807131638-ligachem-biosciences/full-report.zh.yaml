        title: 财务与执行风险：融资买来时间，不是确定性
        blocks:
          - type: paragraph
            body: >-
              2026 年，财务风险明显缓和，但仍是核心问题。2025 年官方报表显示，LigaChem 还不能靠自身造血： 经营亏损超过 1000 亿韩元，经营现金流出超过 1200 亿韩元，年末现金不到 1000
              亿韩元。因此，5000
              亿韩元融资意义很大。但市场不能把这理解成商业模式已经跑通。独立报道显示，这笔钱将投向后期临床、监管工作、生产和商业化准备——这些正是药物开发里最烧钱的环节。公司可能只是把自己推入了成本更高的风险档位。


              执行风险也由此而来。治理层面，Orion
              的存在感不低，能加强监督，也会带来战略控制权的敏感性。管理层明确把毒理、安全和生产放在重点位置，这是实质性的缓释因素。招聘材料显示，公司仍依赖高度专业化的科学人才。因此，实际的出局条件很直接：安全性受挫、自主推进资产时间表滑坡、现金消耗快于预期，或任何公开迹象显示合作伙伴跟进转弱。只要这些指标保持稳定，风险画像就更可投；一旦破裂，下行估值重估会很快。
