      - number: '4.4'
        title: 财务结论与剩余承销阻断点
        blocks:
          - type: paragraph
            body: >-
              公开结论是混合但可理解的。LigaChem
              已经拥有真实的外部变现引擎：它能签授权交易，赚取里程碑触发的现金，并报告相对许多早期同行都很大的授权费收入。这是实质正面，因为它把公司与纯粹收入前平台故事区分开来。与此同时，模型还没有自我维持。经营亏损很大，经营现金流为负；选择性后期自研的战略动作，也提高了未来资本需求上升而不是下降的概率。Yahoo
              上显示的市值和分析师目标同样说明，投资人定价的是管线可选性，不是近期现金生成。


              因此，承销阻断点是具体的，不是泛泛的。投资人仍缺少伙伴层面收入集中度、单项目 R&D 预算、已实现特许权使用费阶梯、干净的当前现金勾稽，以及 2026
              年资本会被每个自研资产消耗多少的精确视图。这些缺口比再说一句「ADC 是有前景的领域」更重要。有了它们，投资人才能认真建模跑道、稀释风险和盈利质量。没有它们，最稳妥的公开结论是：2026 年让 LigaChem
              从资金承压变成资金延展，但没有让它从不确定变成可预测。
