        - 具体交易时点和收入确认规则未公开披露
        - 2025 年官方财务报表
        - 营收可以跳升，但不代表需求可重复
      - - Ono LCB97 一揽子交易最高 $700 million，另有特许权使用费
        - 最高包价，不是当前已实现现金
        - 实际预付款、里程碑时点和特许权使用费率未完全公开
        - Ono 官方交易新闻稿
        - 有商业潜力，但可预测性仍有限
      - - 2026 年 7 月 LCB97 里程碑付款
        - 与首例患者给药绑定的已实现现金事件
        - 确切金额保密；公开估算采用高于上一年收入 10% 的下限
        - Sedaily 里程碑文章 + 披露清单
        - 特许权使用费到来前，里程碑可支撑流动性
      - - 商品销售
        - 产品或耗材销售，而非授权
        - 实际价格和毛利率未披露
        - 官方财务报表 + Yahoo 资料页
        - 仅有有限证据显示非授权收入可重复
      - - 2026 年 CB/CPS 融资
        - 资本而非收入；BigGo 显示转股价为每股 KRW 149,300
        - 披露无折价发行，但稀释路径取决于转股和未来股价
        - 官方 Q&A + BigGo + WOWTALE
        - 改善流动性，同时嵌入未来转股敏感性
    notes: 本章把变现合同和融资拆开。公司两者都有，但解决的是不同问题。
