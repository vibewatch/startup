      - number: '2.2'
        title: 规模测算视角与需求集中地
        blocks:
          - type: paragraph
            body: >-
              公开 ADC 市场测算方向一致，但数字噪声很大。按不同方法，2026 年市场规模约在 USD 16.8 billion 到 USD 20.3 billion 之间；更长期预测则从 2033 年的 mid-USD
              30 billions 到 2031 年超过 USD 70 billion
              不等。与其假装某一个预测具有权威性，更稳的结论是：这个市场已经足够大，多数公开观点认为它保持两位数增长，并且仍集中在报销、生物标志物检测和肿瘤基础设施已经成熟的地区和适应症。乳腺癌和 HER2
              相关疗法目前占主导；Asia-Pacific 是 LigaChem 这类韩国开发商最相关的增长地区，因为日本、中国和韩国的报销和本土 ADC 投资都在扩张。对 LigaChem 来说，这个区域增长故事比泛泛的全球
              TAM 叙事更重要。
