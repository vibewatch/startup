companyProfile:
  summary: >-
    LigaChem Biosciences 总部位于大田，是一家 KOSDAQ 上市的临床阶段生物技术公司，2006 年成立，2024 年由 LegoChem 更名而来。公司聚焦抗体偶联药物（ADC），核心是自有的 ConjuAll™
    偶联、连接子和载荷平台。历史上，商业模式主要围绕 ADC 资产和平台权利的对外授权，交易对象包括 Ono、SOTIO、Janssen、Iksuda、NextCure、CStone 等全球制药和生物技术公司；2026 年
    National Growth Fund 牵头融资后，公司开始选择性把优先资产拉近自研。
