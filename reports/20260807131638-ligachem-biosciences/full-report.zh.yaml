  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与实际购买对象
        blocks:
          - type: paragraph
            body: >-
              对 LigaChem 而言，相关市场比已获批 ADC 药物的下游销售更宽，但又窄于所有肿瘤治疗。公司材料显示，近期变现模式仍是资产授权和共同开发，因此第一层买方通常是希望获得 ADC
              平台、靶点项目或载荷-连接子组合的大型制药或生物技术伙伴。这些买方所处的更大终端市场，则由医院、肿瘤中心和支付方最终决定某个已获批 ADC 能否触达患者。于是市场边界分成两层：上游 ADC
              伙伴合作与开发需求，以及下游 ADC 治疗收入。两者都影响估值，因为健康的终端市场会支撑授权胃口；但全球 ADC 总销售额并不等于 LigaChem
              能直接触达的收入池。这个框架也能避免尽调中的常见错误：把下游产品销售额等同于一家商业化前平台开发商能通过首付款、里程碑和特许权使用费捕获的更小收入池。
