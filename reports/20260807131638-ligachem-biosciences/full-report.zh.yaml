      - number: '6.4'
        title: 这对客户群承销意味着什么
        blocks:
          - type: paragraph
            body: >-
              客户结论是正面但有条件的。LigaChem 显然已经获得成熟交易对手的采纳，这些对手理解 ADC
              科学，也愿意把真实权利、资金和开发资源放到这些关系后面。这比泛泛的初创公司背书更强，因为客户本身就是专业买方。与此同时，承销案例依赖一组窄证明点：少数交易对手、基于里程碑的经济性，以及对满意度、集中度和长期特许权使用费转化的有限公开可见度。


              实际含义是，投资人应把客户章节看作全球制药体系内部技术-市场匹配的验证，而不是平滑经常性收入的证明。最强尽调问题是伙伴层面收入暴露、期权与续约行为，以及失败或终止关系的案例。如果这些答案健康，具名客户集就会成为真正的护城河信号。如果答案弱，同一小撮交易对手就会变成集中度脆弱点。
