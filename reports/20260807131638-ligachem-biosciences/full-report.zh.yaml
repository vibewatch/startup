      - number: '3.3'
        title: 能力、定价结构、分销力量与转换成本
        blocks:
          - type: paragraph
            body: >-
              能力比较是不对称的，因为已获批产品在位者和平台授权方解决的是不同工作。对 ENHERTU、ADCETRIS、TRODELVY 和 PADCEV 来说，公开证据覆盖标签、警示、包装、准入支持和治疗流程。对
              LigaChem
              来说，公开表面强调的是化学体系聚焦和伙伴导向。这意味着简单功能矩阵必须把若干格标为未知，而不能假装公司已经拥有尚未披露的下游能力。最干净的横向比较不是单疗程净价——这个数字并不稳定公开——而是合同结构。LigaChem
              向伙伴收取首付款、里程碑和特许权使用费；在位者则通过已获批药瓶变现，再用报销和患者支持项目强化使用。


              分销力量因此几乎完全掌握在大型制药在位者手里。它们控制肿瘤医生关系、覆盖资源、编码指导、现场报销团队和制造供应链。LigaChem
              的模式让公司暂时不用搭建这整套能力，这是资本优势；但议价权也因此留给了已经拥有商业基础设施的伙伴。伙伴一旦选择某个 ADC
              平台，转换成本是真实存在的，因为流程经验、转化数据集和制造工作流会变成资产专属。但签约前，多家并行考察很可能很高：公开市场和格局来源显示，供应商、中国起源资产以及大型制药公司获取 ADC
              能力的路径都很多。LigaChem 的竞争问题因此是：差异化必须强到让伙伴不再把它当作众多化学供应商之一。
