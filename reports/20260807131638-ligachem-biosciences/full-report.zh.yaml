  customerFocus: 全球制药和生物技术伙伴、肿瘤试验网络，以及由伙伴主导、偶尔由公司自推进的 ADC 开发项目最终触达的下游患者。
  businessModel: 以授权为主的 ADC 平台模式，资金来源包括首付款、里程碑、特许权使用费、商品销售和公开市场融资；2026 年战略开始转向核心资产的选择性后期自研。
