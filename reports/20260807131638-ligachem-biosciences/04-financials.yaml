chapter:
  number: 4
  title: Financials
  summary: |-
    LigaChem's public financial picture is unusual for a clinical-stage biotech because it already reports meaningful top-line revenue but that revenue is still dominated by licensing economics rather than product sales. Official 2025 consolidated statements show KRW 141.6 billion of revenue, of which KRW 121.2 billion came from licence fee income, versus only KRW 20.4 billion from goods sales. The same statements show R&D expense of KRW 216.9 billion, operating loss of KRW 106.5 billion, and operating cash outflow of KRW 124.5 billion, which means the business was not self-funding before the 2026 recapitalization. The June-July 2026 KRW 500 billion CB/CPS financing, plus milestone receipts such as the Ono-linked LCB97 payment, clearly improves capital adequacy; however, public sources conflict sharply on current cash, and there is still no clean disclosure of partner concentration, per-program spend, or recurring royalty timing. The verdict is a high-gross-margin but low-predictability licensing model that remains heavily financing- and milestone-dependent as LigaChem pushes toward later-stage self-development.
