sections:
- id: S1
  title: 'Revenue Model: High-Margin Licensing, Not Yet Recurring Product Economics'
  body: |-
    LigaChem already reports meaningful revenue, but the revenue mechanism remains much closer to platform monetization than to a conventional biopharma commercial model. Official 2025 consolidated statements show KRW 141.553 billion of revenue, with KRW 121.161 billion coming from licence fee income and only KRW 20.392 billion from goods sales. That mix matters: it means the company has demonstrated an ability to turn scientific partnerships into cash, yet the dominant line item depends on milestone timing, partner decisions, and contract recognition rather than on recurring prescription demand. The Ono package deal illustrates the structure. The company disclosed potential economics of up to $700 million plus royalties, and the July 2026 LCB97 milestone shows how revenue or cash can step up sharply when a partner advances a program.

    This model should not be read as low-quality in an absolute sense, because licensing income can carry excellent incremental margins and validates external demand for the platform. It should, however, be read as low-predictability revenue. There is no clean public disclosure of partner concentration, milestone schedules, or royalty ladders by asset. Goods sales appear real and ongoing, but management and third-party profiles make clear that they are secondary to the ADC licensing engine. Investors therefore need to distinguish between top-line size and top-line repeatability: LigaChem has already built a monetization engine, but it is still a deal-driven one.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI024
  - CI025
  - CI027
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: S2
  title: 'Cost Structure and Unit Economics: Gross Margin Looks Strong, Operating Model Does Not'
  body: |-
    The public cost structure shows why LigaChem cannot yet be judged on traditional earnings power despite its unusually large reported revenue for a clinical-stage biotech. Official 2025 statements show KRW 248.039 billion of operating expense, including KRW 216.908 billion of R&D expense, against an operating loss of KRW 106.486 billion. In other words, the company spent far more on research and development than it generated in total revenue. Yahoo's gross-profit line looks superficially attractive because licence fees carry relatively little classical cost of revenue, but that is only one layer of the economics. The more important question is how much incremental scientific and clinical spending is needed to keep future milestones coming.

    That is why classic SaaS-style unit metrics such as CAC or payback do not fit the business. The practical monetization unit here is the deal, the program, or the milestone, not a recurring subscription or transaction cohort. A more useful financial lens is revenue quality versus development intensity: high gross margin on recognised licence income, but very high R&D intensity and large operating losses as the company pushes assets deeper into development. Goods sales may offer some steadier revenue, yet their margin profile and strategic importance are not disclosed clearly enough to anchor the investment case. The result is an operating model that can look efficient at the gross-profit layer while still remaining capital-intensive and fragile at the cash-flow layer.
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  - CI013
  - CI028
  - CI029
