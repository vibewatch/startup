  - FI003
  - FI004
- id: S4
  title: Financial Verdict and Remaining Underwriting Blockers
  body: |-
    The public verdict is mixed but intelligible. LigaChem already has a real external monetization engine: it can sign licensing deals, earn milestone-triggered cash, and report large licence-fee revenue relative to many early-stage peers. That is a material positive because it separates the company from purely pre-revenue platform stories. At the same time, the model is not yet self-sustaining. Operating losses are large, operating cash flow is negative, and the strategic move toward selective late-stage self-development increases the chance that future capital needs rise rather than fall. The market capitalization and analyst targets shown on Yahoo also suggest investors are valuing pipeline optionality, not near-term cash generation.

    The underwriting blockers are therefore specific, not generic. Investors still lack partner-level revenue concentration, per-program R&D budgets, realized royalty ladders, clean current-cash reconciliation, and a precise view of how much of the 2026 capital will be consumed by each self-development asset. Those gaps matter more than another generic statement that ADC is a promising field. With them, one could build a serious model of runway, dilution risk, and quality of earnings. Without them, the best public conclusion is that LigaChem moved from financially pressured to financially extended in 2026, but not from uncertain to predictable.
  claimRefs:
