chapter:
  number: 5
  title: Product & Technology
  summary: |-
    LigaChem does not deliver a single finished commercial product today; it delivers an ADC technology stack plus a portfolio of partnered and self-advanced assets that move through a long clinical-development workflow. Official pipeline materials and trial records show the stack spanning multiple target-payload combinations, including HER2-MMAF (LCB14/IKS014), CD19-pPBD (LCB73/IKS03), B7-H4-MMAE (LNCB74), CLDN18.2-Topo1i (LCB02A), LRRC15-MMAE (SOT106), and newer planned programs such as CD20xCD22 and CEACAM5 assets. The core technical claim is ConjuAll-based conjugation quality—site-specific conjugation, linker stability, efficient toxin release, and pharmacokinetic profile—rather than a software workflow or one-off antibody. Product maturity is mixed: several assets are in Phase 1 or Phase 1/2, but none are marketed, most efficacy proof remains pre-results, and public evidence on manufacturing quality systems or platform patent depth is thin. The technology case is credible and broad; the main remaining risks are execution, safety window, partner dependence, and the absence of public late-stage or commercial reliability proof.
