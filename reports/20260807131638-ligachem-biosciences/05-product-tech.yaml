- id: S3
  title: Maturity, Roadmap, and Dependency Structure
  body: |-
    The maturity picture is mixed but improving. LCB02A is already in a first-in-human Phase 1/2 design with 191 planned subjects and a projected multi-year timeline. LNCB74 is recruiting in Phase 1. IKS014 and IKS03 are both in global Phase 1 programs under Iksuda. SOT106 remains pre-IND but has a publicly stated second-half-2026 IND objective. BigGo and other 2026 coverage add another layer by describing LCB36 and LCB58A as next programs to be accelerated as LigaChem pushes beyond pure out-licensing. This gives the company unusual breadth for a clinical-stage ADC platform, but it also increases execution dependency because many programs now compete for capital, management attention, and manufacturing planning.

    The platform's critical dependencies are clear. Biomarker assays and patient-selection logic are essential, because the trials are built around target-positive populations. Partners matter because much of downstream development and commercialization still sits outside LigaChem. Regulators and trial sites matter because none of the lead assets have posted mature results yet; they are still design-stage or early-recruitment stories. And manufacturing matters even when public details are sparse, because payload-linker quality and CMC reproducibility are fundamental to the class. The roadmap is therefore exciting, but it is not yet de-risked.
  claimRefs:
  - CE005
  - CE007
  - CE009
  - CE012
  - CE015
  - CE016
  - CE017
  - CE018
  - CE027
  - CE032
  - CE033
  - CE036
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: S4
  title: Trust, Safety, and Quality Controls
  body: |-
    The strongest trust signal in public sources is not certification but protocol discipline. ClinicalTrials materials show FDA-regulated studies, explicit dose-escalation and dose-expansion structures, objective response metrics such as RECIST or Lugano, ECOG performance requirements, organ-function thresholds, and product-specific exclusion criteria. LNCB74 excludes prior MMAE-ADC exposure, ILD/pneumonitis history, neuropathy, and corneal disease. LCB02A excludes prior Topo1 ADC exposure. IKS014 excludes ILD/pneumonitis and clinically significant ocular abnormalities. These are concrete signs that the company and its partners understand class-specific safety liabilities and are designing around them.

    But there are still important trust gaps. No public manufacturing certifications, batch-release metrics, supply reliability statistics, or posted clinical results were retained for the cited assets. Reviews of the broader field continue to emphasize toxicity, heterogeneity, resistance, and complex manufacturing as unresolved constraints on ADC success. That means LigaChem's trust case is presently strongest at the trial-design and scientific-rationale level, weaker at the manufacturing-quality and market-reliability level. The product-tech diligence question is therefore not whether there is a real platform—there is—but whether public proof is deep enough yet to underwrite durable scale and consistent execution.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE029
  - CE030
  - CE031
  - CE034
  - CE035
