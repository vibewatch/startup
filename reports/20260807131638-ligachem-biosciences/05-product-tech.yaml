- id: S2
  title: Architecture and Operating Workflow
  body: |-
    The public architecture is unusually legible for a biotech because the company and trial records expose the major design components. Official materials say the ConjuAll stack is differentiated by site-specific conjugation, linker stability, toxin release, and pharmacokinetic profile. Clinical-trial APIs then show how that philosophy is instantiated differently across assets: LCB02A couples a CLDN18.2 antibody to a Topo1 inhibitor payload; IKS014 / LCB14 is a HER2-targeting MMAF ADC; IKS03 / LCB73 uses a CD19 antibody with a PBD pro-drug; and LNCB74 is a B7-H4-targeted ADC in 21-day IV cycles. This is a real product architecture, not a generic marketing slogan.

    The operating workflow is long and multi-stage. A target and antibody are selected, the conjugation and payload design are tuned, preclinical evidence is generated, and then biomarker-gated clinical trials move through dose escalation, dose expansion, and eventual partner or self-development decisions. The workflow is global rather than local: cited studies recruit across the U.S., Australia, Singapore, Canada, Europe, and Korea. At the same time, the model remains partner-dependent. SOT106 is explicitly described as partner-led for development, manufacturing, and commercialization, while the Iksuda investment shows LigaChem sometimes deepens control through equity and governance rather than by internalizing every function itself.
  claimRefs:
  - CE002
  - CE006
  - CE010
  - CE011
  - CE013
  - CE014
  - CE020
  - CE021
  - CE022
