- id: S2
  title: 'Named Customer Proof: The Strongest Evidence Comes From Milestones and Trial Progress'
  body: |-
    The named proof set is much stronger than a normal startup logo page because several counterparties have already advanced into hard operational milestones. Ono is the cleanest example. The 2024 package deal covered both LCB97 and broader ConjuAll platform rights; by July 2026 the relationship had already progressed to first-patient dosing and a milestone estimated at more than 10% of prior-year revenue. SOTIO is another high-quality proof point: its 2021 agreement covered up to five programs, placed downstream development and commercialization responsibility with SOTIO, and by early 2026 had already yielded another milestone linked to SOT106 progress.

    Iksuda and CStone add multi-year continuity plus operating depth. Iksuda's relationship spans global rights to LCB14 outside Greater China and South Korea, later first-patient clinical activity, and eventually a strategic equity tie-up that pulls LigaChem closer to management participation. CStone advanced CS5001 from a 2020 license to Phase 1b by late 2024. Janssen and NextCure are also meaningful, though the retained public evidence here is thinner on fresh downstream milestones. Overall, the best rule is simple: a customer relationship becomes underwriteable only once it crosses from contract copy into trial registration, patient dosing, or milestone economics. LigaChem has several that do.
  claimRefs:
  - CU007
  - CU008
