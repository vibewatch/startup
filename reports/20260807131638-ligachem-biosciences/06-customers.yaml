  rows:
  - - Product-license pharma partner
    - 'Buyer: BD/R&D; User: clinical-development org; Payer: upfront/milestone counterparty'
    - License a named ADC asset for global development
    - Anchor named accounts include Ono and Janssen
    - Can generate very large milestone pools plus royalties
    - No public renewal or satisfaction metrics
  - - Platform-license oncology partner
    - 'Buyer: partner discovery/portfolio team; User: partner ADC teams; Payer: platform fees and milestones'
    - Use ConjuAll and linker-payload stack against partner-selected targets
    - Named proof includes SOTIO and Ono
    - Validates the platform beyond a single molecule
    - Commercial depth per target remains opaque
  - - Rights-split regional partner
    - 'Buyer: regional biotech/pharma; User: local clinical/commercial teams; Payer: licensee by territory'
    - Develop the same asset under territorial rights splits
    - Fosun in Greater China; Iksuda ex-Greater China/Korea for LCB14
    - Expands reach without full in-house globalization
    - Creates fragmented customer economics
  - - Co-development / equity-linked partner
    - 'Buyer: partner management + investor; User: joint pipeline teams; Payer: mix of licensing and equity capital'
    - Deepen relationship across multiple assets and control rights
    - Iksuda is the clearest example
    - Can capture more downstream value than a simple out-license
    - Raises governance and execution complexity
  - - Clinical-collaboration partner
    - 'Buyer: partner R&D / translational teams; User: trial operators'
    - Move a partnered asset through IND and Phase 1 activity
    - NextCure and CStone provide current proof
    - Creates external validation even before commercialization
    - Economics and timing can remain very lumpy
  notes: |-
    End patients and trial sites are downstream users of partnered assets, but they are not the direct economic customers in LigaChem's present model.
