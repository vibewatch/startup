sections:
- id: S1
  title: 'Who the Customers Are: Counterparties, Not End Users'
  body: |-
    LigaChem's present customer base is best viewed through a biotech licensing lens. The company is not yet selling finished drugs to hospitals, payers, or consumers. Instead, it sells access to an ADC platform, to individual product candidates, or to co-development rights. Official company materials explicitly define the partner model around joint research, co-development, and licensing. That makes the customer definition unusually clear: the direct buyers are pharma and biotech organizations willing to pay for exclusive rights, the direct users are partner R&D and clinical-development teams that carry assets forward, and the economic payers are the same counterparties through upfront fees, milestones, and eventual royalties.

    This customer base is already broad enough to segment meaningfully. There are product-license partners such as Ono and Janssen, platform-license partners such as SOTIO and Ono, co-development and rights-split relationships such as Iksuda plus Fosun, and partnered development relationships such as CStone and NextCure. The official history page shows these are not one-off names added for prestige; the partner list extends over many years and multiple asset types. The implication is that LigaChem has real BD-market adoption in the global ADC ecosystem. The unresolved question is not whether counterparties exist, but how concentrated their economics are.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU020
