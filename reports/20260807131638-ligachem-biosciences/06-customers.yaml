chapter:
  number: 6
  title: Customers
  summary: |-
    LigaChem's effective customers are not hospitals or consumers today; they are global pharma and biotech counterparties that license ADC assets, platform rights, or co-development access and then fund the relationship through upfronts, milestones, royalties, or strategic equity. The official record and retained partner evidence show a real installed base: Fosun in Greater China for LCB14, Iksuda for global ex-China/Korea HER2 and CD19 programs, CStone for ROR1, SOTIO for multi-target solid-tumor ADCs, Janssen/J&J for LCB84, Ono for LCB97 plus multi-target platform access, and NextCure for LNCB74. Adoption proof is strongest where a partner relationship has progressed from contract signature into IND approvals, patient dosing, milestone receipts, or expanded rights. What remains missing is classic customer SaaS-style visibility—no NRR, GRR, renewal rate, customer count by cohort, or revenue concentration split is publicly disclosed. The customer verdict is therefore strong on named strategic adoption and weak on durability and concentration transparency: LigaChem clearly has blue-chip demand for its platform, but that demand is mediated through a small number of lumpy, milestone-driven relationships.
