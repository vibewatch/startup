- id: S3
  title: Durability, Expansion, and Concentration
  body: |-
    Durability is the hardest part of the customer chapter because LigaChem is a biotech licensor, not a subscription software business. No retained source provides customer count by cohort, renewal rate, GRR, NRR, or even a partner revenue split. That forces the analysis onto proxies. The best available proxy is relationship continuity from initial deal to later milestones or deeper scope. By that standard the platform looks better than average. Iksuda has expanded from licensing into equity and pipeline control. Ono started with an asset-specific license but also bought into multi-target platform access. SOTIO moved from a platform agreement to later milestone proof. CStone advanced its licensed asset into later clinical stages. These are all signs of customers staying engaged after the initial press release.

    Still, durability is not the same as concentration transparency. Public proof is visibly clustered around a small number of counterparties and assets. Because economics in this model are lumpy and milestone-driven, one delayed study or one reprioritized partner can have an outsized effect on recognized revenue. The same 2026 financing that gives LigaChem more freedom to self-develop also underlines the gap: the company appears to be adding internal optionality precisely because partner-led monetization alone is not enough to smooth the revenue model. The customer base is strong on strategic quality, but it is not yet broad or transparent enough to dismiss concentration risk.
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU032
  - CU033
  - CU034
  - CU035
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: S4
  title: What This Means for Underwriting the Customer Base
  body: |-
    The customer verdict is positive but qualified. LigaChem has clearly won adoption from sophisticated counterparties that understand ADC science and are willing to put real rights, money, and development resources behind those relationships. That is stronger evidence than generic startup references because the customers are themselves expert buyers. At the same time, the underwriting case depends on a narrow set of proof points: a handful of counterparties, milestone-based economics, and limited public visibility into satisfaction, concentration, and long-term royalty conversion.

    The practical implication is that investors should treat the customer chapter as validation of technology-market fit within global pharma, not as proof of smooth recurring revenue. The strongest diligence asks are partner-level revenue exposure, option and renewal behavior, and examples of failed or terminated relationships. If those are healthy, the named customer set becomes a real moat signal. If they are weak, the same small set of counterparties becomes a concentration vulnerability.
  claimRefs:
  - CU031
  - CU034
  - CU035
  - CU036
  - CU037
  tableRefs:
  - TU002
  figureRefs: []
