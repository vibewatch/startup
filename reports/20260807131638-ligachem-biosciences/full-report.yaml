  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and What Is Actually Being Bought
        blocks:
          - type: paragraph
            body: >-
              For LigaChem, the relevant market is broader than the simple downstream sale of approved ADC medicines but
              narrower than all oncology therapeutics. The company's own materials show that its near-term monetization
              model remains asset licensing and co-development, which means the first buyer is usually a large pharma or
              biotech partner that wants access to an ADC platform, target program, or payload-linker stack. Those
              buyers participate in a larger end market where hospitals, oncology centers, and payers ultimately decide
              whether an approved ADC reaches patients. The result is a two-layer market boundary: upstream ADC
              partnering and development demand, and downstream ADC treatment revenue. Both matter to valuation, because
              a healthy end market supports licensing appetites, but total global ADC sales are not the same thing as
              the revenue pool directly accessible to LigaChem. This framing also prevents a common diligence mistake:
              equating downstream product sales with the smaller revenue pool that a pre-commercial platform developer
              can capture through upfronts, milestones, and royalties.
