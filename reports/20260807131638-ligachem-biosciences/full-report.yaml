      - number: '4.3'
        title: 'Capital Adequacy: Sub-12-Month Runway on 2025 Burn, Then a Transformational 2026 Raise'
        blocks:
          - type: paragraph
            body: >-
              Before the 2026 financing, the public figures pointed to a company that was materially dependent on
              outside capital. Official and Yahoo-based cash-flow pages both show 2025 operating cash outflow of about
              KRW 124.533 billion and year-end cash of about KRW 98.650 billion. On that simple basis, LigaChem was
              carrying less than a year of runway. The 2026 recapitalization changed that picture dramatically. Official
              Q&A and multiple external reports describe a KRW 500 billion financing split between KRW 170 billion of
              convertible bonds and KRW 330 billion of convertible preferred shares, explicitly designed to fund R&D and
              late-stage development rather than M&A. Public reports also describe conversion constraints, a no-discount
              issuance, and substantial participation from state-backed capital plus Pan Orion.


              Even so, capital adequacy is not fully settled by the headline size of the round. Public sources disagree
              sharply on current cash, with figures ranging from roughly KRW 60.7 billion to KRW 418 billion or even
              about KRW 450 billion depending on source and definition. The discrepancy likely reflects different cut
              dates or whether the figure includes broader liquid resources, but it makes exact runway calculation
              impossible from public materials alone. In addition, the strategic shift toward more self-development
              means 2025 burn is probably a floor, not a ceiling. The raise clearly buys time; it does not eliminate
              future financing risk if multiple assets are advanced in-house at once.
