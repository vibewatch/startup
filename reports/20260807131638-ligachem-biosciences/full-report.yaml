      - number: '1.5'
        title: Remaining Frictions and How to Use This Baseline
        blocks:
          - type: paragraph
            body: >-
              For later chapters, the safest posture is to treat official company history, the stock page, the June 2026
              funding notices, and corroborating Korean biotech reporting as the canonical baseline, while explicitly
              carrying several open gaps. The business is clearly public, ADC-focused, and better financed than most
              clinical-stage peers, but the exact post-money valuation of the 2026 raise is still not cleanly disclosed
              in accessible public materials. The unnamed third financial investor, full cap-table rights, and a precise
              bridge from existing cash to dilution-adjusted enterprise value remain unresolved. Public operating
              metrics are also uneven: liquidity is visible, but headcount, revenue mix, and the relative contribution
              of product sales versus licensing are not cleanly disclosed on the accessible surfaces reviewed here. That
              means later market, financial, and valuation chapters should rely on documented funding and pipeline
              progress while staying conservative on unsupported cover metrics.
