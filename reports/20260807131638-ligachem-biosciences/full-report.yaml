    sections:
      - number: '1.1'
        title: Identity, Listing Status, and Strategic Focus
        blocks:
          - type: paragraph
            body: >-
              LigaChem Biosciences is not a private company in the strict legal sense: official history, the company
              stock page, Yahoo Finance, and Stock Analysis all show that the business trades on KOSDAQ under ticker
              141080, with the IPO dated to 2013. That matters because later chapters should treat it as a publicly
              traded biotech with venture-style economics rather than as a classic venture-backed private startup. At
              the same time, the operating profile still resembles a platform biotech: the company describes itself as
              clinical stage, Daejeon-headquartered, medicinal-chemistry-led, and focused on antibody-drug conjugates
              plus immuno-oncology. The March 2024 rename from LegoChem to LigaChem is important for source hygiene
              because older licensing and media references still use the LegoChem brand while current company pages and
              2026 financing notices use LigaChem.
