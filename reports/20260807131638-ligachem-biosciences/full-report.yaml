      - number: '1.3'
        title: Capital Formation and Market Context
        blocks:
          - type: paragraph
            body: >-
              The June 2026 National Growth Fund financing is the key current fact for this report. Company notices and
              multiple Korean news outlets align on a KRW 500 billion transaction, structured as KRW 170 billion of
              convertible bonds and KRW 330 billion of convertible preferred shares with long tenor. The company
              emphasized that the money is earmarked for R&D and late-stage clinical development, not M&A, and that
              out-licensing remains intact rather than displaced. That is analytically important because LigaChem is
              trying to add selective late-stage self-development capacity without abandoning the licensing engine that
              produced its existing cash reserves. The financing is also designed to look shareholder-friendly on paper:
              no discount, delayed conversion rights, and transfer restrictions. Even so, public-market reaction was not
              euphoric. NEWSTOP reported an 8.28% drop on the announcement day, which suggests the market still worries
              about dilution, execution, or biotech-sector fatigue despite the prestige of the state-backed capital.
