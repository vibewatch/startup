  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue Model: High-Margin Licensing, Not Yet Recurring Product Economics'
        blocks:
          - type: paragraph
            body: >-
              LigaChem already reports meaningful revenue, but the revenue mechanism remains much closer to platform
              monetization than to a conventional biopharma commercial model. Official 2025 consolidated statements show
              KRW 141.553 billion of revenue, with KRW 121.161 billion coming from licence fee income and only KRW
              20.392 billion from goods sales. That mix matters: it means the company has demonstrated an ability to
              turn scientific partnerships into cash, yet the dominant line item depends on milestone timing, partner
              decisions, and contract recognition rather than on recurring prescription demand. The Ono package deal
              illustrates the structure. The company disclosed potential economics of up to $700 million plus royalties,
              and the July 2026 LCB97 milestone shows how revenue or cash can step up sharply when a partner advances a
              program.


              This model should not be read as low-quality in an absolute sense, because licensing income can carry
              excellent incremental margins and validates external demand for the platform. It should, however, be read
              as low-predictability revenue. There is no clean public disclosure of partner concentration, milestone
              schedules, or royalty ladders by asset. Goods sales appear real and ongoing, but management and
              third-party profiles make clear that they are secondary to the ADC licensing engine. Investors therefore
