        title: Sizing Lenses and Where Demand Is Concentrated
        blocks:
          - type: paragraph
            body: >-
              Public ADC market estimates are directionally aligned but numerically noisy. Depending on methodology,
              2026 market size ranges from about USD 16.8 billion to USD 20.3 billion, while longer-term forecasts span
              from the mid-USD 30 billions by 2033 to more than USD 70 billion by 2031. Rather than pretending one
              forecast is authoritative, the more stable conclusion is that the market is already large, is growing
              double digits in most published views, and remains concentrated in geographies and indications where
              reimbursement, biomarker testing, and oncology infrastructure are already mature. Breast cancer and
              HER2-linked therapies dominate today, while Asia-Pacific is the most relevant growth region for a Korean
              developer like LigaChem because reimbursement and domestic ADC investment are expanding in Japan, China,
              and South Korea. That regional growth story matters more for LigaChem than generic global TAM rhetoric.
