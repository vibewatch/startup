      - number: '4.2'
        title: 'Cost Structure and Unit Economics: Gross Margin Looks Strong, Operating Model Does Not'
        blocks:
          - type: paragraph
            body: >-
              The public cost structure shows why LigaChem cannot yet be judged on traditional earnings power despite
              its unusually large reported revenue for a clinical-stage biotech. Official 2025 statements show KRW
              248.039 billion of operating expense, including KRW 216.908 billion of R&D expense, against an operating
              loss of KRW 106.486 billion. In other words, the company spent far more on research and development than
              it generated in total revenue. Yahoo's gross-profit line looks superficially attractive because licence
              fees carry relatively little classical cost of revenue, but that is only one layer of the economics. The
              more important question is how much incremental scientific and clinical spending is needed to keep future
              milestones coming.


              That is why classic SaaS-style unit metrics such as CAC or payback do not fit the business. The practical
              monetization unit here is the deal, the program, or the milestone, not a recurring subscription or
              transaction cohort. A more useful financial lens is revenue quality versus development intensity: high
              gross margin on recognised licence income, but very high R&D intensity and large operating losses as the
              company pushes assets deeper into development. Goods sales may offer some steadier revenue, yet their
              margin profile and strategic importance are not disclosed clearly enough to anchor the investment case.
              The result is an operating model that can look efficient at the gross-profit layer while still remaining
              capital-intensive and fragile at the cash-flow layer.
