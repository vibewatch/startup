              - CR035
      - number: '7.4'
        title: 'Financial and Execution Risk: The Raise Buys Time, Not Certainty'
        blocks:
          - type: paragraph
            body: >-
              Financial risk improved sharply in 2026 but remains central. Official 2025 statements show that LigaChem
              was not self-funding: operating loss exceeded KRW 100 billion, operating cash outflow exceeded KRW 120
              billion, and year-end cash was under KRW 100 billion. The KRW 500 billion raise therefore mattered
              enormously. But the market should not confuse that with a solved business model. Independent reporting
              indicates the money is intended for late-stage trials, regulatory work, manufacturing, and
              commercialization readiness—the most expensive parts of drug development. The company may simply have
              upgraded itself into a higher-cost risk class.


              Execution risk follows from that. Governance shows meaningful Orion presence, which can help oversight but
              also raises strategic-control sensitivity. Leadership shows explicit attention to toxicology, safety, and
              manufacturing, which is a genuine mitigant. Recruiting materials show the company still depends on highly
              specialized scientific talent. The practical kill criteria are therefore straightforward: watch for safety
              setbacks, timeline slips in self-advanced assets, signs of faster-than-expected cash consumption, or any
              public indication that partner follow-through is weakening. If those indicators remain stable, the risk
              profile becomes more investable. If they break, the downside can re-rate quickly.
            claimRefs:
