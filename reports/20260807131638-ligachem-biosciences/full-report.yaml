      - number: '5.3'
        title: Maturity, Roadmap, and Dependency Structure
        blocks:
          - type: paragraph
            body: >-
              The maturity picture is mixed but improving. LCB02A is already in a first-in-human Phase 1/2 design with
              191 planned subjects and a projected multi-year timeline. LNCB74 is recruiting in Phase 1. IKS014 and
              IKS03 are both in global Phase 1 programs under Iksuda. SOT106 remains pre-IND but has a publicly stated
              second-half-2026 IND objective. BigGo and other 2026 coverage add another layer by describing LCB36 and
              LCB58A as next programs to be accelerated as LigaChem pushes beyond pure out-licensing. This gives the
              company unusual breadth for a clinical-stage ADC platform, but it also increases execution dependency
              because many programs now compete for capital, management attention, and manufacturing planning.


              The platform's critical dependencies are clear. Biomarker assays and patient-selection logic are
              essential, because the trials are built around target-positive populations. Partners matter because much
              of downstream development and commercialization still sits outside LigaChem. Regulators and trial sites
              matter because none of the lead assets have posted mature results yet; they are still design-stage or
              early-recruitment stories. And manufacturing matters even when public details are sparse, because
              payload-linker quality and CMC reproducibility are fundamental to the class. The roadmap is therefore
              exciting, but it is not yet de-risked.
