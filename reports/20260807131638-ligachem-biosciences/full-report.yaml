            body: >-
              The regulatory and clinical evidence simultaneously validates the platform and underlines the risk. Four
              active ClinicalTrials records show that multiple LigaChem-derived programs are genuinely in human testing,
              but all are still burdened by dose-escalation logic, biomarker gating, and exclusion criteria that are
              characteristic of drugs with uncertain therapeutic windows. LNCB74 excludes prior MMAE-ADC exposure and
              pulmonary or ocular risk factors; LCB02A excludes prior Topo1-payload ADC exposure; IKS014 excludes ILD
              and corneal abnormalities. These are not abstract concerns—they are built into the protocols. The absence
              of posted results means investors still do not know which programs can combine efficacy and tolerability
              at commercially relevant doses.


              The legal picture is better than a pure concept-stage platform but still incomplete. Google Patents
              records show active self-immolative and conjugation-related patents assigned to LigaChem, which is real
              protection. Yet public materials do not provide a complete FTO map, expiry matrix, or dispute history. The
              broader ADC field is demonstrably litigious, and even comparator conjugation families show litigation
              markers. The right conclusion is that IP is a mitigation, not a full answer. Without deeper diligence,
              legal/IP residual risk remains medium-to-high.
