      - number: '8.2'
        title: Financing and Comparable Context Support a Premium, But Not an Unconditional One
        blocks:
          - type: paragraph
            body: >-
              Public comparables point in two different directions. On the one hand, listed development-stage ADC peers
              such as ADC Therapeutics and Sutro Biopharma trade at market values hundreds of millions of dollars below
              LigaChem. CStone, while a listed Asia oncology biotech with a broader commercial and clinical context,
              still screens below LigaChem on current market cap. This tells investors that the public market can be
              brutally skeptical even toward real ADC stories. On the other hand, strategic M&A anchors show what the
              top of the category can command: Seagen at roughly $43 billion and ImmunoGen at $31.26 per share after
              approved-product and late-stage validation. Those are enormous outcomes—but they were not paid for
              unproven stories.


              LigaChem sits between those two worlds. It is clearly stronger than a generic early platform company and
              arguably stronger than some public peers on partner validation and option value. But it is also
              meaningfully less de-risked than approved-product strategic takeouts. That is why a mixed comp set is the
              only honest approach. It also explains why the current public price feels rich rather than insane: the
              company deserves a premium, but not a premium so detached from proof that it stops being
              evidence-sensitive.
            claimRefs:
