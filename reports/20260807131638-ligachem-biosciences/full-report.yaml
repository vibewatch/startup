          - type: paragraph
            body: >-
              Leadership appears bifurcated between founder symbolism and professionalized daily management. Founder
              Yong-Zu Kim still presents himself as the chairman and long-term scientific architect, while the public
              leadership page and Yahoo profile identify Sejin Park as CEO and President. The governance page also shows
