      - number: '3.4'
        title: Moat Durability and Adverse Competitive Evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest case for LigaChem's moat is that repeated licensing activity suggests outside companies view
              its conjugation and chemistry capabilities as credible. But the moat remains only partially validated in
              the public record because it has not yet been translated into a marketed in-house franchise or into the
              kind of multi-indication label expansion visible at ENHERTU. Public evidence shows that the sector is
              already crowded with approved products across many targets, and that big pharma has become comfortable
              acquiring or partnering for de-risked assets at scale. That helps a company like LigaChem when it has
              compelling data; it hurts when buyers can play multiple asset sources against each other.


              Adverse evidence is unusually important in this chapter. Mersana's takeout shows that a differentiated ADC
              platform can still end up sold rather than compounded independently. The small-cap positioning of ADC
              Therapeutics and Sutro relative to the pharmaceutical groups that dominate approved ADCs suggests
              investors remain skeptical that standalone ADC specialists will capture franchise-level economics without
              broader proof. Meanwhile, all approved leaders still carry significant safety burdens, and BioMed Nexus
              underscores that manufacturing capacity remains difficult and specialized. Taken together, these signals
              imply that LigaChem's competitive durability will be won or lost less on generic claims about ADC promise
              and more on whether its platform keeps producing partnerable assets faster, cleaner, or more economically
              than a crowded field of global alternatives.
