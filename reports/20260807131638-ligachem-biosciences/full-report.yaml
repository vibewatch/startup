            body: >-
              Durability is the hardest part of the customer chapter because LigaChem is a biotech licensor, not a
              subscription software business. No retained source provides customer count by cohort, renewal rate, GRR,
              NRR, or even a partner revenue split. That forces the analysis onto proxies. The best available proxy is
              relationship continuity from initial deal to later milestones or deeper scope. By that standard the
              platform looks better than average. Iksuda has expanded from licensing into equity and pipeline control.
              Ono started with an asset-specific license but also bought into multi-target platform access. SOTIO moved
              from a platform agreement to later milestone proof. CStone advanced its licensed asset into later clinical
              stages. These are all signs of customers staying engaged after the initial press release.


              Still, durability is not the same as concentration transparency. Public proof is visibly clustered around
              a small number of counterparties and assets. Because economics in this model are lumpy and
              milestone-driven, one delayed study or one reprioritized partner can have an outsized effect on recognized
              revenue. The same 2026 financing that gives LigaChem more freedom to self-develop also underlines the gap:
              the company appears to be adding internal optionality precisely because partner-led monetization alone is
              not enough to smooth the revenue model. The customer base is strong on strategic quality, but it is not
