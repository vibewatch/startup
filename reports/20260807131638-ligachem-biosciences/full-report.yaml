  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'What the Product Actually Is: A Platform-plus-Pipeline ADC Company'
        blocks:
          - type: paragraph
            body: >-
              LigaChem's product is best understood as a technology stack plus a portfolio, not as a single commercial
              drug. Official company pages define the business around next-generation ADCs and medicinal chemistry,
              while the pipeline pages show a broad menu of target-payload combinations rather than one flagship module.
              In customer workflow terms, the first customer is often a pharma or biotech partner that wants access to a
              target-ready candidate or to the conjugation engine behind it. The second downstream customer is the
              clinical network that must operationalize biomarker-positive trial enrollment, dose scheduling, and
              eventual commercialization. This is why the company can report platform partnerships, product-specific
              licenses, and internally advanced assets at the same time.


              The product map is already fairly broad. Public materials show HER2-MMAF, CD19-pPBD, B7H4-MMAE,
              CLDN18.2-Topo1i, LRRC15-MMAE, and additional bispecific or solid-tumor programs, which means the company
              is expressing its platform through multiple biological targets and multiple payload classes. That breadth
              is important because it suggests the company is selling a repeatable chemistry-and-development capability.
              But the product definition remains pre-commercial: the company is still proving whether these assets can
              graduate from architecture and early clinical design into durable, marketed oncology products.
