  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Approved ADC Franchises, Platform Peers, and Korean Adjacent Challengers'
        blocks:
          - type: paragraph
            body: >-
              LigaChem's competitive landscape has to be segmented by where competition occurs. The approved-product
              layer is led by Daiichi Sankyo/AstraZeneca's ENHERTU, Pfizer/Seagen's ADCETRIS portfolio, Gilead's
              TRODELVY franchise, and Astellas/Pfizer's PADCEV program. These companies are not direct sales competitors
              to LigaChem in the narrow current-period sense because LigaChem has no marketed drug; however, they are
              the most important benchmark competitors because their franchises define what pharma partners now regard
              as validated ADC performance. They have proof across label breadth, physician familiarity, adverse-event
              management, coding support, and reimbursement operations. Any global partner assessing LigaChem's pipeline
              or ConjuALL-style chemistry will compare its potential against those visible reference standards.


              A second layer consists of independent or recently independent ADC specialists such as ADC Therapeutics,
              Sutro Biopharma, and formerly Mersana. These peers resemble LigaChem more closely because they sell a
              platform, a focused pipeline, or both, and they must convince partners or investors that their chemistry
              or payload architecture matters enough to command durable economics. Public sources show real technical
              ambition in this set, but also uneven outcomes. ADC Therapeutics is commercial-stage, Sutro is still
              proving its next-generation platform in public markets, and Mersana lost independence via a cash
              acquisition. A third layer includes Korean and Asia-originated challengers such as Hanmi's bispecific ADC
              work and the broader China-led acceleration in ADC deal flow. That regional pressure matters because it
              increases the number of alternatives available to the same global partner base LigaChem courts.
            claimRefs:
