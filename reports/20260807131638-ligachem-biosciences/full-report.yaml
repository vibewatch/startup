      - number: '8.3'
        title: 'Recommendation: Track / Research More Unless Price or Proof Improves'
        blocks:
          - type: paragraph
            body: >-
              The right recommendation at the current quote is track / research more, not buy. This is not a dismissal
              of the company. It is recognition that the current valuation already assumes investors will receive a
              high-quality future evidence package: human data from the lead self-advanced assets, continued milestone
              conversions from partners, credible CMC readiness, and enough cash to reach those milestones without
              punitive dilution. That future package may arrive. But until it does, investors buying the stock
              aggressively are prepaying for a substantial amount of success.


              This is also why the call is price-sensitive. If the stock compresses materially without a corresponding
              deterioration of platform quality or financing position, the return case gets more attractive quickly. If
              the price rises further without human or CMC de-risking, the asymmetry worsens. The bull case is real; the
              base case is still slower and more conditional than the market seems to want; the bear case is easy to
              imagine because clinical, burn, and partner-dependence risks are all still alive. Medium confidence and
              high risk are therefore the disciplined output, not an evasive one.
            claimRefs:
