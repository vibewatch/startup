      - number: '2.4'
        title: Growth Drivers, Bottlenecks, and the Modal Shift
        blocks:
          - type: paragraph
            body: >-
              The strongest bull case for ADCs is no longer just "targeted chemotherapy." The sector is benefiting from
              rising cancer incidence, rapid clinical-trial expansion, label expansions, richer biomarker pathways, and
              a wave of platform innovation that includes dual-payload, multispecific, and immunologically integrated
              constructs. Large incumbents are validating that shift: Roche, Pfizer, and other big pharma companies now
              treat ADCs as a core oncology platform, and Pfizer's Seagen acquisition shows how much strategic value can
              be assigned to established conjugate franchises. But the bottlenecks are equally real. Manufacturing
              remains expensive and operationally specialized; development is burdened by dose-optimization,
              immunogenicity, and pharmacology requirements; and reimbursement can still fail on price or evidence
              uncertainty. That combination makes ADCs a structurally attractive but operationally unforgiving
              market—favorable for differentiated platform owners like LigaChem, but only if they continue solving
              payload, linker, safety, and partnering execution better than peers. It also explains why simple
              market-growth headlines can mislead: even in a fast-growing category, only developers that can secure
              manufacturing slots, satisfy regulators, and clear reimbursement hurdles will convert innovation into
              durable economics.
