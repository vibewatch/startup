  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Top Risk Stack: More Capital, More Ambition, Still Clinical-Stage Fragility'
        blocks:
          - type: paragraph
            body: >-
              LigaChem's central risk has not changed: it is still a company whose value depends on whether ADC
              molecules can cross the gap from mechanistic credibility into human efficacy, tolerability, and
              manufacturable reproducibility. What has changed is the scale of the ambition. The 2026 financing gives
              the company more runway to push late-stage development and even self-development, but that same shift also
              increases the number of ways the thesis can break. The company is no longer just a platform seller hoping
              for partner validation; it is becoming a hybrid platform-and-development company that may need to manage
              trial execution, capital allocation, CMC readiness, and partner relationships at the same time.


              That makes the risk stack multidimensional. Clinical failure remains the highest-severity risk because
              current studies are still early and none of the cited trials had posted results. Manufacturing and CMC are
              next because ADC performance depends heavily on conjugation quality and reproducibility, yet public
              quality evidence is thin. Partner and customer dependence remains high because several key assets sit
              under external control. Financing risk is lower than before the raise, but not removed, because the
              company is now funding a more expensive strategy. Finally, legal and IP protections look real but
              incomplete: active patents exist, yet public FTO visibility is limited.
