      - number: '2.3'
        title: Buyers, Payers, and the Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The downstream ADC adoption path remains institution-heavy. Hospitals dominate current administration
              economics, and the market reports still describe hospitals and clinics as the practical end-user channel
              because these therapies require infusion infrastructure, biomarker testing, safety management, and
              reimbursement coordination. Payer control is equally strong: NICE's Enhertu decision demonstrates that
              even clinically impressive ADCs can be blocked when cost-effectiveness remains above acceptable
              thresholds, while PADCEV's support materials remind providers that coverage varies by payer and setting
              and must be verified before treatment. In other words, scientific validity is necessary but insufficient;
              real market access depends on guideline position, formulary acceptance, and reimbursement workflow. For
              LigaChem, this means any partner must not only develop an asset successfully but also navigate HTA bodies,
              insurers, and site-of-care economics in the dominant oncology markets.
