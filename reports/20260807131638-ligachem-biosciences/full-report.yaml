      - number: '5.4'
        title: Trust, Safety, and Quality Controls
        blocks:
          - type: paragraph
            body: >-
              The strongest trust signal in public sources is not certification but protocol discipline. ClinicalTrials
              materials show FDA-regulated studies, explicit dose-escalation and dose-expansion structures, objective
              response metrics such as RECIST or Lugano, ECOG performance requirements, organ-function thresholds, and
              product-specific exclusion criteria. LNCB74 excludes prior MMAE-ADC exposure, ILD/pneumonitis history,
              neuropathy, and corneal disease. LCB02A excludes prior Topo1 ADC exposure. IKS014 excludes ILD/pneumonitis
              and clinically significant ocular abnormalities. These are concrete signs that the company and its
              partners understand class-specific safety liabilities and are designing around them.


              But there are still important trust gaps. No public manufacturing certifications, batch-release metrics,
              supply reliability statistics, or posted clinical results were retained for the cited assets. Reviews of
              the broader field continue to emphasize toxicity, heterogeneity, resistance, and complex manufacturing as
              unresolved constraints on ADC success. That means LigaChem's trust case is presently strongest at the
              trial-design and scientific-rationale level, weaker at the manufacturing-quality and market-reliability
              level. The product-tech diligence question is therefore not whether there is a real platform—there is—but
              whether public proof is deep enough yet to underwrite durable scale and consistent execution.
