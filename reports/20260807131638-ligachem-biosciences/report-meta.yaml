  topStrengths:
    - LigaChem has real ADC platform depth with multiple payload classes, active human studies, and blue-chip partner validation.
    - The 2026 National Growth Fund-led financing materially improves runway and strategic flexibility versus weaker clinical-stage biotech peers.
    - Licensing history and partner breadth suggest the platform is valued by sophisticated counterparties rather than by narrative alone.
    - Active patents and a recognized ConjuAll™ chemistry stack provide at least some visible moat support.
  topRisks:
    - Current lead-trial proof remains early and no posted results were retained for the active human studies cited in this report.
    - The company is moving into a more capital-intensive self-development phase without public CMC or commercialization evidence strong enough to fully underwrite the shift.
    - Public economics remain lumpy and partner-dependent, with limited transparency into revenue concentration, milestone timing, or future dilution risk.
    - Current public valuation already implies a premium to public ADC-biotech comparables despite lower proof depth than strategic M&A precedents.
    - Customer, partner, and territorial-rights complexity can slow or dilute value realization even if the underlying science remains credible.
  unresolvedGaps:
    - Partner-level revenue concentration, milestone waterfall timing, and royalty-conversion history.
    - CMC quality metrics, supply reliability, and launch-readiness evidence for any self-developed path.
    - Full freedom-to-operate and patent-landscape analysis for ConjuAll-related chemistry across key jurisdictions.
    - Detailed analyst-model assumptions and scenario probabilities behind current public price targets.
    - A cleaner reconciliation of present cash, per-asset spend, and runway to decisive clinical inflections.
