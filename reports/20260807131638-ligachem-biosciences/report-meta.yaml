companyProfile:
  summary: >-
    LigaChem Biosciences is a Daejeon-based, KOSDAQ-listed clinical-stage biotech founded in 2006 and rebranded from
    LegoChem in 2024. The company focuses on antibody-drug conjugates using its proprietary ConjuAll™ conjugation,
    linker, and payload platform. Its business model has historically centered on out-licensing ADC assets and
    platform rights to global pharma and biotech counterparties such as Ono, SOTIO, Janssen, Iksuda, NextCure, and
    CStone, while selectively pulling priority assets closer to self-development after the 2026 National Growth
    Fund-led financing.
  foundedDate: '2006-01-01'
  founders:
    - name: Yong-Zu Kim
      role: Founder and Chairman
      background: Medicinal-chemistry founder who still chairs the company and is cited by LigaChem as having founded the business in 2006.
      claimRefs: [CO002, CO008]
  foundingLocation: Daejeon, South Korea
  headquarters: Daejeon, South Korea
  productSummary: >-
    LigaChem's product surface is an ADC platform plus a portfolio of oncology assets spanning HER2, CD19, B7-H4,
    CLDN18.2, LRRC15, L1CAM, and other targets across partnered and self-advanced programs.
  customerFocus: >-
    Global pharmaceutical and biotechnology partners, oncology trial networks, and downstream patients reached through
    partner-led and occasionally self-advanced ADC development programs.
  businessModel: >-
    Licensing-led ADC platform model funded by upfronts, milestones, royalties, goods sales, and public-market
    financing, with a 2026 strategy shift toward selective later-stage self-development on core assets.
  stage: post-ipo
  fundingStatus: >-
    Public evidence supports a KRW 500B CB/CPS financing in June-July 2026, meaningful historical licensing income,
    and a current public market cap around KRW 4.125T. Public sources do not cleanly disclose partner-level revenue
    splits, realized milestone conversion quality, or a fully reconciled present cash position.
  claimRefs: [CO002, CO004, CO009, CO013, CI001, CI017, CE002, CE014, CU001, CU006, CV001, CV007]
summary:
  headline: >-
    LigaChem has a credible ADC platform and unusually strong partner validation for its stage, but the current public
    valuation looks stretched enough that better human proof, cleaner CMC evidence, or a cheaper entry is needed
    before a fresh high-conviction buy call is justified.
