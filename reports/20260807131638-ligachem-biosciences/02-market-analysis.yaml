  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A single audited ADC market-size series that reconciles why credible-looking publishers disagree so widely on 2026 size and long-term CAGR.
    whyItMatters: Valuation work can use a range, but any precise TAM-based penetration model will otherwise overstate certainty.
    diligencePath: Obtain full paid methodologies from one premium market-research vendor or triangulate sell-side models against public-company product sales and approved-brand revenue.
    relatedQuestionRefs:
    - QM006
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: liga-sam
    missingEvidence: A clean public estimate for the platform-licensing SAM relevant to Korean ADC developers rather than total global ADC therapeutics sales.
    whyItMatters: LigaChem monetizes via licensing and selective development, so end-market drug sales alone overstate its directly addressable revenue pool.
    diligencePath: Build a bottom-up licensing-market lens from disclosed ADC deal counts, upfronts, and annual partner budgets.
    relatedQuestionRefs:
