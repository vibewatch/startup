  title: Market Analysis
  summary: 'LigaChem addresses a fast-growing but heterogeneous ADC market whose public 2026 size estimates span roughly $16.8 billion to $20.3 billion and whose 2030/2031 forecasts range from the mid-$20 billions to over $70 billion depending on methodology. The most reliable common facts are directional rather than exact: breast and HER2-led oncology indications dominate current revenue, hospitals and large oncology centers remain the main administration channel, big-pharma partnering and manufacturing capacity are critical bottlenecks, and reimbursement scrutiny plus high production cost still gate adoption. For LigaChem, the most relevant buyer is not the end patient but the large pharma partner willing to license or co-develop ADC assets into those downstream treatment pathways.'
