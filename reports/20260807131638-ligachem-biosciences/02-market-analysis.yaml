- id: buyers-payers-and-the-adoption-path
  title: Buyers, Payers, and the Adoption Path
  body: 'The downstream ADC adoption path remains institution-heavy. Hospitals dominate current administration economics, and the market reports still describe hospitals and clinics as the practical end-user channel because these therapies require infusion infrastructure, biomarker testing, safety management, and reimbursement coordination. Payer control is equally strong: NICE''s Enhertu decision demonstrates that even clinically impressive ADCs can be blocked when cost-effectiveness remains above acceptable thresholds, while PADCEV''s support materials remind providers that coverage varies by payer and setting and must be verified before treatment. In other words, scientific validity is necessary but insufficient; real market access depends on guideline position, formulary acceptance, and reimbursement workflow. For LigaChem, this means any partner must not only develop an asset successfully but also navigate HTA bodies, insurers, and site-of-care economics in the dominant oncology markets.'
  claimRefs:
  - CM011
  - CM012
  - CM018
  - CM019
  - CM030
  - CM031
  - CM032
  - CM040
  tableRefs:
  - TM003
  figureRefs:
  - FM004
- id: growth-drivers-bottlenecks-and-modal-shift
  title: Growth Drivers, Bottlenecks, and the Modal Shift
  body: 'The strongest bull case for ADCs is no longer just "targeted chemotherapy." The sector is benefiting from rising cancer incidence, rapid clinical-trial expansion, label expansions, richer biomarker pathways, and a wave of platform innovation that includes dual-payload, multispecific, and immunologically integrated constructs. Large incumbents are validating that shift: Roche, Pfizer, and other big pharma companies now treat ADCs as a core oncology platform, and Pfizer''s Seagen acquisition shows how much strategic value can be assigned to established conjugate franchises. But the bottlenecks are equally real. Manufacturing remains expensive and operationally specialized; development is burdened by dose-optimization, immunogenicity, and pharmacology requirements; and reimbursement can still fail on price or evidence uncertainty. That combination makes ADCs a structurally attractive but operationally unforgiving market—favorable for differentiated platform owners like LigaChem, but
    only if they continue solving payload, linker, safety, and partnering execution better than peers. It also explains why simple market-growth headlines can mislead: even in a fast-growing category, only developers that can secure manufacturing slots, satisfy regulators, and clear reimbursement hurdles will convert innovation into durable economics.'
  claimRefs:
