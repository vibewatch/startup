sections:
- id: market-boundary-and-whats-being-bought
  title: Market Boundary and What Is Actually Being Bought
  body: 'For LigaChem, the relevant market is broader than the simple downstream sale of approved ADC medicines but narrower than all oncology therapeutics. The company''s own materials show that its near-term monetization model remains asset licensing and co-development, which means the first buyer is usually a large pharma or biotech partner that wants access to an ADC platform, target program, or payload-linker stack. Those buyers participate in a larger end market where hospitals, oncology centers, and payers ultimately decide whether an approved ADC reaches patients. The result is a two-layer market boundary: upstream ADC partnering and development demand, and downstream ADC treatment revenue. Both matter to valuation, because a healthy end market supports licensing appetites, but total global ADC sales are not the same thing as the revenue pool directly accessible to LigaChem. This framing also prevents a common diligence mistake: equating downstream product sales with the smaller
    revenue pool that a pre-commercial platform developer can capture through upfronts, milestones, and royalties.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM010
  - CM040
  tableRefs:
  - TM001
  figureRefs:
  - FM003
- id: sizing-lenses-and-where-demand-is-concentrated
  title: Sizing Lenses and Where Demand Is Concentrated
  body: Public ADC market estimates are directionally aligned but numerically noisy. Depending on methodology, 2026 market size ranges from about USD 16.8 billion to USD 20.3 billion, while longer-term forecasts span from the mid-USD 30 billions by 2033 to more than USD 70 billion by 2031. Rather than pretending one forecast is authoritative, the more stable conclusion is that the market is already large, is growing double digits in most published views, and remains concentrated in geographies and indications where reimbursement, biomarker testing, and oncology infrastructure are already mature. Breast cancer and HER2-linked therapies dominate today, while Asia-Pacific is the most relevant growth region for a Korean developer like LigaChem because reimbursement and domestic ADC investment are expanding in Japan, China, and South Korea. That regional growth story matters more for LigaChem than generic global TAM rhetoric.
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
