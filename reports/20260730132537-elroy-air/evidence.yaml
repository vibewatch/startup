evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: lifetime-capitalization
    missingEvidence: Exact lifetime capital raised, current ownership, liquidation preferences, and sponsor dilution terms.
    whyItMatters: >-
      The open record shows announced financings and a SPAC value but not the full capital stack that determines
      investor downside and dilution.
    diligencePath: Request cap table, financing summary, and the latest board deck or financing memo from management.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, headcount, cash balance, customer count, backlog conversion, and debt obligations.
    whyItMatters: >-
      These metrics are essential to test whether a $1 billion enterprise value has operating support or requires heavy
      forward assumptions.
    diligencePath: Request audited or management financials plus commercial pipeline conversion by customer and program.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: chaparral-specification
    missingEvidence: A reconciled product-spec sheet explaining the 300lb/300mi versus 500+lb/450mi public performance claims.
    whyItMatters: >-
      Capability claims drive both market positioning and valuation; unresolved configuration drift can overstate
      readiness or economics.
    diligencePath: >-
      Ask management for the current production configuration, test results, and mapping of each public spec to aircraft
      variant or mission profile.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: pipeline-conversion
    missingEvidence: Binding order values, cancellation terms, and deployment milestones behind the 1,400-aircraft pipeline claim.
    whyItMatters: >-
      SEC-linked materials say the pipeline is non-binding, so conversion risk is central to the chapter’s investability
      judgment.
    diligencePath: Request the pipeline by customer, instrument type, probability weighting, and expected certification dependency.
    relatedQuestionRefs:
      - QO024
      - QO025
    relatedTableRefs:
      - TO004
  - type: stale
    severity: minor
    topic: exact-headquarters-labeling
    missingEvidence: >-
      A single current corporate disclosure that reconciles South San Francisco, San Francisco, and Byron facility
      language.
    whyItMatters: The discrepancy is not thesis-breaking but it matters for legal, hiring, and operations diligence.
    diligencePath: >-
      Confirm the legal headquarters, engineering office, and flight-test site addresses directly from management or
      state filings.
    relatedQuestionRefs:
      - QO001
  - type: missing-source
    severity: minor
    topic: public-leadership-roster
    missingEvidence: >-
      A complete executive roster, reporting lines, and clearer governance disclosure behind the public
      founder-and-leadership snapshot.
    whyItMatters: >-
      The public table is directionally useful but incomplete, which limits assessment of bench depth and succession
      coverage.
    diligencePath: Request an org chart, executive bios, and current board-observer list from management.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: precise-som
    missingEvidence: >-
      A route-level model translating market growth into Elroy’s actual reachable share by geography, approval regime,
      and mission type.
    whyItMatters: Public TAM studies are too broad to underwrite revenue capture without conversion assumptions.
    diligencePath: Request management’s bottom-up route model with customers, lanes, payload, utilization, and approval gating.
    relatedQuestionRefs:
      - QM012
      - QM024
  - type: conflicting-data
    severity: material
    topic: market-size-drift
    missingEvidence: A reconciled view of why major analyst firms disagree so sharply on current and long-range market size.
    whyItMatters: Different scope choices can dramatically overstate or understate investable market size.
    diligencePath: Normalize each report to manufacturing only, then compare against a separate services-stack lens.
    relatedQuestionRefs:
      - QM010
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-roi
    missingEvidence: >-
      Customer-level ROI evidence showing when Chaparral beats helicopters, trucks, or feeder aircraft on selected
      lanes.
    whyItMatters: Adoption depends on mission economics, not just macro market growth.
    diligencePath: Request pilot data, route economics, and time-to-turn comparisons from FedEx, Bristow, or internal test corridors.
    relatedQuestionRefs:
      - QM021
      - QM023
    relatedTableRefs:
      - TM003
      - TM004
  - type: stale
    severity: minor
    topic: narrow-sam-definition
    missingEvidence: >-
      A current public segmentation that isolates heavy-payload hybrid-VTOL middle-mile cargo from the broader drone
      market.
    whyItMatters: Analyst coverage still bundles multiple architectures and use cases together.
    diligencePath: Monitor later SEC filings or management decks for a bottom-up SAM cut by mission and region.
    relatedQuestionRefs:
      - QM011
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Comparable public pricing, service-rate cards, or customer ROI disclosures across autonomous cargo peers.
    whyItMatters: >-
      Without published pricing or lane economics, it is difficult to assess whether Elroy wins on cost, speed, or only
      narrative.
    diligencePath: Request route-level proposals, leasing economics, and customer business cases from Elroy and comparable operators.
    relatedQuestionRefs:
      - QP015
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: share-durability
    missingEvidence: Customer concentration, renewal rates, pilot conversion rates, and exclusivity terms across the competitive set.
    whyItMatters: Winner-take-most claims depend on retention and exclusivity, not just product specs.
