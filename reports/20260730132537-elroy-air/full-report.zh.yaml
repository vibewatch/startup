  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Elroy Air 的公开路径从 2016 年创立，走到 2026 年融资和政府项目里程碑；客户验证早于系统性收入披露出现。
    data:
      items:
        - label: 2016 年创立
          description: David Merrill 和 Clint Cope 围绕中段物流自主货运假设创办 Elroy Air
        - label: 2021 年 A 轮报道
          description: TechCrunch 报道这家创始人主导的自主货运无人机平台完成 $40M 融资
        - label: 2022 年 Chaparral 亮相
          description: 公司推出 Chaparral，FedEx 宣布计划开展中段物流测试
        - label: 2022 年 Bristow LOI
