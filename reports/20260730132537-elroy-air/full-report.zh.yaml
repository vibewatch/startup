      - number: '3.3'
        title: 壁垒耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Elroy 当前最好的差异化，似乎是混合电动航程、不依赖跑道、可拆卸货舱，以及“国防 +
              商业”的商业化叙事。这一组合有用，因为今天多数规模化配送网络优化的是更轻载荷，而许多更大飞机项目优化的是客运或依赖跑道的货运。即便如此，壁垒耐久性仍是暂定的。如果资本更充足的航空航天或国防公司认定这个细分有吸引力，混合动力、自主任务软件和模块化货物处理都不是永久垄断。公司还要靠制造和认证执行，把设计差异化转成运营信任。竞争对手和替代方案可以从多个角度进攻：成本更低的小载荷网络、更大固定翼货运经济性、上市公司融资优势，或既有运营商关系。务实结论是，Elroy
              的壁垒目前是一条关于窄楔子里的任务匹配和上市时间的论点，还不是自主货运里的锁定平台标准。因此，竞争尽调不应只点名单一对手，而要理解哪个相邻平台最可能先侵蚀 Elroy
              的窄楔子。投资人应透过客户工作流和预算归属来读竞争证据，因为相同飞行技术不必然意味着相同竞争压力。很多时候，最危险的对手是能把够用的飞机能力与更好路线准入、更强授权或更可信服务打包结合起来的一方。
