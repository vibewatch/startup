    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位与领导层转换
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，更适合把 Elroy Air 看作一家美国自主中段物流公司：它做的是重货 VTOL 飞机，而不是小包裹无人机或载人
              eVTOL。公司称，其使命是用不需要跑道或充电站的混合电动飞机，扩大当日送达，并让补给实现零风险。公开领导层证据也显示，公司正从创始人主导的创业公司转向规模化运营团队。Andrew Clare 在 Tesla 和
              Nuro 任职后，于 2025 年 1 月出任 CEO；共同创始人 Dave Merrill 转任执行董事长，仍把持战略、合作伙伴关系和国防定位。另一位共同创始人 Clint Cope
              仍在公司介绍页上，以战略、产品和工程角色出现。更大的管理层班底现在包括具名
              CTO、财务负责人、联邦业务拓展负责人、飞行测试和集成负责人。相比早期以创始人为中心的公开形象，这一配置更强，但关键人物依赖仍在：Merrill 的市场关系和 Clare 的执行能力都很关键。
