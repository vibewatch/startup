      - number: '3.2'
        title: 分销权力、替代方案与多归属
        blocks:
          - type: paragraph
            body: >-
              Elroy
              最难的竞争压力可能来自分销权力，而不只是飞机性能。FedEx、国防买方、出租人和海上运营商可以同时评估多种架构，这会在规模化机队部署前限制锁定。客户也可以留在既有替代方案里：海上航线用直升机，仓库转运用卡车，区域货运用支线飞机，临时任务用人工包机运力。有些相邻玩家已经拥有更强的路线密度或既有网络。Wing
              和 Matternet 已经建成商业配送运营和授权；Zipline 拥有大品牌和运营证明集；Joby 和 EHang 的公开市场或认证能见度远高于 Elroy，即便核心任务不同。另一方面，轻基础设施货运 VTOL
              仍足够不成熟，买方可能在运营商、租赁结构和任务画像之间多归属，而不是选出单一赢家。这给 Elroy
              切入未被充分服务的重货任务留下机会，但也降低了早期试点转化为持久独占份额的确定性。换句话说，真正的竞争往往是路线权和集成信任，而不只是更好的飞机宣传册。时间和信任才是真正关口。
