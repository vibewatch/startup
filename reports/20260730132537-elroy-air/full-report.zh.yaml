        title: 客户标识与验证路径
        blocks:
          - type: paragraph
            body: >-
              Elroy 的客户故事最有力的读法，不是单一锚定账户，而是一组验证渠道。公司有公开证据显示与 FedEx、Bristow、LCI、Barq Group
              和多个美国国防相关项目接触，合在一起说明商业物流、运营中介、租赁渠道和政府用户都有需求。这种宽度重要，因为自主货运飞机如果依赖单一演示客户或单一监管场景，往往会失败。FedEx 给出品牌物流验证，Bristow
              和 LCI
              暗示运营方和出租人路径，海军陆战队防务演示则说明飞机正在比常规包裹配送更难的任务环境里接受评估。尽调上，这一组合是正面的：它拓宽了可能商业化路线，也降低了对某一买方类别的依赖。但它也让解读更复杂，因为这些信号处于不同承诺层级，并非全部意味着近期生产收入。另一种读法，是把客户集合看作问题紧迫性的层层证明。FedEx
              验证全球快递物流兴趣，Bristow 和 LCI 验证运营方与融资路径，国防相关演示验证飞机正在紧迫性和路线难度最高的地方测试。这不能解决商业化风险，但确实降低了 Elroy
