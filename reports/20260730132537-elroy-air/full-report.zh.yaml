      - number: '5.3'
        title: 技术壁垒与开放问题
        blocks:
          - type: paragraph
            body: >-
              二阶优势在于来源中可见的任务打包宽度。Chaparral 被描述为可用于国防补给、灾害响应、仓库物流和专门交付模式，这说明平台围绕载荷模块化设计，而不是只服务单一客户工作流。这样可以提高利用率，也帮助公司把
              R&D 分摊到相邻市场。代价是复杂度。多任务飞机在试图满足不同买方时，往往会遇到配置管理、支持负担和认证范围挑战。如果同一核心平台能以有限定制服务多条高价值路线，Elroy
              的产品边就是真实的；如果每个任务都需要定制集成、监管处理或运营条令，这一优势就会削弱。总体看，技术证据支撑一个严肃且差异化的平台，但最终壁垒取决于 Elroy
              能否高效地把任务灵活性转化为标准化生产和可靠的软件定义运营。因此，技术上行最容易在基础设施稀缺且载荷紧迫的任务中成立，因为这些场景里，混合 VTOL
              和模块化物流相对传统无人机的优势最清晰。剩下的举证责任是运营重复性：重复架次、可维护性和可预测现场支持。在这些数据公开前，投资人应把平台视为技术上可信，但仍在从演示证据走向规模化运营证据。
