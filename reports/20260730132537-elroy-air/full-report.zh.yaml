      - number: '2.3'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              采用势头来自几类相互强化的驱动因素。市场报告持续指向电商增长、物流网络自动化、商业无人机监管试点，以及专用基础设施投入上升，包括通道、降落区、机队软件和空域集成。Global Market Insights
              还强调 BVLOS 扩展、医疗物流和国防补给是重要需求加速器，这些都能顺畅映射到 Elroy
              的定位。但约束同样真实。各地区监管碎片化仍高，大型货运无人机网络的运营成本仍不可忽视，许多买方还需要证明：载荷、周转、维护和任务可靠性优于既有直升机或地面运输。FAA
              认证和批准节奏对美国规模化尤其关键。因此，采用路径看起来会分阶段：先是 ROI
              强、基础设施要求较低的国防或偏远工业任务；再是区域性海上和工业走廊；只有安全数据、吞吐量和经济性更清晰后，才会进入更广泛的商业中段网络。实际推进时，采用应先发生在客户痛点尖锐、路线密度低到既有运输昂贵或高风险的地方。市场准备度会按地理和细分高度不均，而不是统一“打开”或“关闭”。
