  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接同业与相邻架构
        blocks:
          - type: paragraph
            body: >-
              Elroy 的直接竞争比整个无人机配送宇宙窄得多。最接近的架构和任务同业，是那些试图用 VTOL 或短场自主能力，把有意义载荷运到远处的公司：Pyka 的 DropShip 和 Pelican
              Cargo、Windracers ULTRA、Sabrewing 的 Rhaegal 概念、Dronamics 的长航程货运系统，瞄准的都更偏货运而非载人出行。但相邻领域几乎同样重要。EHang 和 Joby
              说明，资本充足的 eVTOL 平台可以向物流或特殊任务变体演进。Wing、Matternet 和 Zipline 则展示了小载荷配送网络规模化运营成熟度是什么样，尽管它们的载荷等级和路线经济性与
              Chaparral
              明显不同。因此，竞争集合不是由完全相同的飞机规格定义，而是由谁掌握自主空中物流的买方关系和监管路径定义。最好的分组方式是按任务相邻性：真正的重货同业、可能沿载荷阶梯上移的规模化末端运营商，以及如果经济性足够有吸引力、可能把资本和认证经验转投物流的上市
              eVTOL 公司。到 2026 年，这一点尤其成立，因为监管进展和客户信任在不同架构和地区之间仍不均衡。
