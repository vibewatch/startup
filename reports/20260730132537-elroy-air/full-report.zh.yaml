            body: >-
              主要尽调挑战，是把管理层的管线语言和经济转化分开。公开材料提到超过 1,400 架飞机的需求管线和超过 $5 billion
              的潜在收入机会，但同一交易披露也提醒，这些意向大多是非约束性意向书和谅解备忘录。这个区分是财务分析的核心。管线可以支撑融资和供应商信心，却不等于已确认收入、现金收款，甚至也不等于确定积压订单。公开证据显示，Elroy
              有足够多交易对手让机会可信，但披露还不足以建模时间、定价、定金、取消权、利润率结构或支持义务。务实地说，投资人应假设下一阶段价值创造取决于把“需求密度”故事转化为可衡量的已签约生产位置、项目收入，以及最终管理层提到但尚未用数字拆出的经常性软件或服务流。投资人还应注意，航空航天硬件公司通常会在工装、供应商认证、库存和现场支持上分批吸收现金，收入确认随后才追上来。这一动态让表面资本充足性对进度滑坡非常敏感。认证、客户验收或生产准备稍有延迟，看似资金充足的计划就可能很快变成过桥融资故事，尤其是在当前市场对乐观
