      - number: '1.3'
        title: 产品、需求与客户信号
        blocks:
          - type: paragraph
            body: >-
              核心产品是 Chaparral，一款自主混合电动 VTOL 货运飞机，用可拆卸货舱在没有机场基础设施的情况下取放货物。公开产品表述随时间变化。2022 年到 2025 年初，官方和合作伙伴来源一直描述的是约
              300 磅载荷、约 300 英里航程；而 2026 年 6 月的 SPAC 材料则描述了更重的 500 磅以上配置，航程最高 450 英里。这一变化说明，公司讲的可能是更宽的机型 /
              配置族，也可能是当前营销更激进，而不是单一不变规格；尽调应要求管理层对准确量产配置给出一致解释。客户和合作伙伴信号真实存在，但大多仍面向未来。FedEx 自 2020 年以来与 Elroy 合作，并在 2022
              年公开计划开展中段测试。Bristow 签署了 100 架飞机意向书，随后锁定 5 个早期交付位置；LCI 承诺最多 40 架飞机。Elroy 自己的 2026 年材料也在 1,400 架飞机管线中列出 Barq
              Group、SLI 和 FedEx，但备案语言明确提示，管线由非约束性意向书和谅解备忘录构成，而不是已确认收入。
