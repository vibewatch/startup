  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 资本栈与交易结构
        blocks:
          - type: paragraph
            body: >-
              按传统意义看，Elroy Air 的财务仍然不透明：没有经审计损益表、积压订单转化披露、单位经济性桥接，或可让外部投资人承销近期经营表现的公开现金余额。公开记录能提供的是资本形成故事。2026 年 6
              月的业务合并公告，把公司框定在约 $800 million 交易前股权价值、约 $1.0 billion 交易后企业价值，以及至少 $165 million 已承诺 PIPE
              融资之上；赎回情况不同，还可能有额外信托收益。这些事实重要，是因为本章重点不是历史财务表现，而是计划中的资本注入是否足以支撑一个重货飞机项目的量产、认证、招聘和营运资本需求。交易材料反复把募资用途定位为增长资本，意味着管理层把核心用途看作规模化，而不是清理资产负债表。因此，投资人应把
              Elroy
              读成一个前收入或早期收入阶段的工业技术融资案例，最重要变量是相对执行里程碑的现金跑道，而不是已报告季度利润率。投资人还应注意，航空航天硬件公司通常会在工装、供应商认证、库存和现场支持上分批吸收现金，收入确认随后才追上来。这一动态让表面资本充足性对进度滑坡非常敏感。认证、客户验收或生产准备稍有延迟，看似资金充足的计划就可能很快变成过桥融资故事，尤其是在当前市场对乐观
              SPAC 预测的折价比周期早期更激进的情况下。
            claimRefs:
              - CI001
