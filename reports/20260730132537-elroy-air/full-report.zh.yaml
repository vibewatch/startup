      - number: '2.2'
        title: 规模测算视角与目标细分
        blocks:
          - type: paragraph
            body: >-
              公开规模证据方向上有吸引力，但数字彼此不一致，这在未成熟品类里很典型。The Business Research Company 的货运无人机报告把 2026 年市场规模定为 $3.13 billion，高于
              2025 年的 $2.32 billion；Global Market Insights 估算 2026 年为 $2.8 billion，高于 2025 年的 $2.1 billion，并预测 2035
              年规模更大。Fortune Business Insights 发布的 2025 年基数较低，为 $1.82 billion，但仍预测多年快速爬坡。与此同时，TBRC 更宽的无人机物流与运输报告达到 2026 年
              $26.33 billion，因为它把飞机之外的服务和基础设施层也纳入。真正有用的结论不是哪个数字在绝对意义上“正确”，而是 Elroy 的实际可服务市场远小于宽泛服务栈，却大于医疗配送这类单一利基。近期 SAM
              最可能是重载、混合 VTOL、长航程中段这个楔子，服务国防、海上能源、偏远工业物流，以及愿意支持试点推广项目地区的时敏仓到仓运输。尽调上更负责任的方法，是把宽 TAM、由任务驱动的窄 SAM、以及由证明驱动的
              SOM 分开，而不是把某个分析师预测直接换算成公司收入潜力。
            claimRefs:
