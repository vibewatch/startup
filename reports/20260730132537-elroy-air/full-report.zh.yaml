  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 表面定价及其隐含假设
        blocks:
          - type: paragraph
            body: >-
              Elroy 公布的估值，更适合看成一笔带战略期权的融资事件，而不是市场对已验证经营表现给出的清算价格。公开资料大体指向约 $800 million 的交易前股权估值、约 $1.0 billion
              的交易后企业价值；支撑来自至少 $165 million 已承诺 PIPE
              资金，若赎回情况允许，还可能有额外信托资金。放在国防相关性、制造伙伴和公司披露的大额需求管线里看，这个价格对一家私营自主货运飞机公司并非没有道理。反过来，若用本次查阅公开材料中缺失的收入、利润率和经审计经营历史衡量，它又显得激进。因此，估值取决于投资人用哪副镜头：看战略自主平台的期权，还是看商业爬坡仍未证实后的折价证据。资料里两种视角都存在，合理答案大概率不在任何一个极端。换句话说，Elroy
              可能配得上战略稀缺性溢价，但稀缺不等于已证明的盈利能力。投资逻辑越依赖未来战略重要性，估值就越吃执行速度和市场情绪。因此，$1 billion
              企业价值作为融资结果可以理解，作为基本面估值锚仍让人不安。这个价格说明投资人愿意资助怎样的期权，不说明这门生意已经在经济性上证明了什么。
            claimRefs:
