  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Elroy Air
              不在最宽泛的“无人机市场”里竞争；它位于货运无人机、无人机物流服务和中段工业空运的较窄交叉点。最窄视角来自货运无人机制造研究，把品类定义为用于运输货物的无人航空器，并按机型、载荷区间、航程和终端市场细分。最宽视角来自无人机物流研究，不只计算飞机，还把软件、仓储、基础设施和运输服务算进去。这个区分很重要，因为
              Elroy
              的价值主张不是密集城市里的消费者末端配送，而是面向国防、海上能源、人道主义和工业运营方，在灵活点位之间完成重载、轻基础设施物流。现状替代方案取决于路线密度和紧急程度，可能是直升机、支线飞机、卡车、船舶或人工调度的包机运力。买方的核心问题不是无人机是否存在，而是混合
              VTOL
              货运飞机能否以足够可靠性搬运足够载荷，在缺少高效跑道或道路基础设施的路线中，在成本、速度、风险或可达性上击败这些替代方案。因此，最有用的市场框架应从任务几何和基础设施约束出发，而不是从泛化无人机数量出发。Elroy
              试图在道路、跑道或机组可用性构成瓶颈的地方创造价值，而不是仅仅在包裹量大的地方。
            claimRefs:
