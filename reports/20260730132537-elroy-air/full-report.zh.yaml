  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 架构与任务匹配
        blocks:
          - type: paragraph
            body: >-
              对一家自主航空创业公司来说，Elroy 的技术论点异常具体：Chaparral 不优化载人 eVTOL，也不优化很小的末端包裹，而是被设计成一款重货 VTOL
              飞机，可以在不依赖跑道或充电基础设施的情况下搬运有意义载荷。公开材料持续强调混合电动推进系统、可拆卸货舱，以及围绕中段、国防和简陋环境物流任务的运营。这一点重要，因为产品不只是又一架无人机；它是一套系统架构，瞄准道路、跑道或机组稀缺的最难线路。技术承诺因此同时组合了几层能力：垂直起降服务灵活物流节点，固定翼巡航带来航程效率，自主软件减少机组需求，任务货舱支持快速装载和重构。尽调上，问题不是每个组件孤立看是否有吸引力，而是集成系统能否在真实运营约束下交付可重复的任务可靠性和经济表现。因此，技术上行最容易在基础设施稀缺且载荷紧迫的任务中成立，因为这些场景里，混合
              VTOL 和模块化物流相对传统无人机的优势最清晰。剩下的举证责任是运营重复性：重复架次、可维护性和可预测现场支持。在这些数据公开前，投资人应把平台视为技术上可信，但仍在从演示证据走向规模化运营证据。
