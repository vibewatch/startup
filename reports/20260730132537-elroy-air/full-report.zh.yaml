        - 在广泛民用认证成熟前，支持早期市场采用
      - - 电商和时效敏感物流
        - 驱动因素
        - Fortune BI 和 FedEx 材料把增长与更快配送、网络效率联系起来
        - 为特定中段线路创造商业紧迫感
      - - 轻基础设施工业走廊
        - 驱动因素
        - Bristow、Barq 和 Elroy eIPP 材料指向海上与远程工业航线
        - 与 Chaparral 不依赖跑道的设计匹配
      - - 监管割裂与认证延误
