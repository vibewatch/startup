  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 交易与资本风险
        blocks:
          - type: paragraph
            body: >-
              Elroy 的风险栈很宽，因为它位于航空航天认证、自主运营、制造规模化和风险投资式资本依赖的交叉点。2026 年 6
              月交易材料明确写明，拟议业务合并仍取决于批准；材料也提醒，已公布需求管线不是确定积压订单。这些是 de-SPAC 的常规提示，但在这里格外重要，因为 Elroy
              的商业案例取决于把技术承诺转成已认证、已交付并可重复运营的飞机。因此，公司同时承受交易风险和项目风险。即使交易交割，投资人仍可能面对监管节奏、生产复杂度或客户转化慢于资本部署的情形。简言之，最大风险不是一个灾难性缺陷，而是一串里程碑都需要足够紧密地对齐，让融资和运营相互强化，而不是相互背离。由于风险相互连接，小失误可能复合放大。如果交割时间滑坡，资本会更紧；资本一紧，招聘和工业化可能放慢；工业化放慢，客户转化和监管可信度就会削弱。这个复合模式意味着，投资人应跟踪里程碑顺序，而不是孤立新闻标题。Elroy
              最好的风险缓释，是持续拿出具体运营证明并让合同变硬，从而一次性降低多个类别的不确定性。
