      - number: '8.2'
        title: 公开市场与创投语境
        blocks:
          - type: paragraph
            body: >-
              相对估值很难做，因为真正可比的上市公司很少。Joby 和 EHang 能提供先进空中交通情绪、认证可见度在公开市场上的读数，但并不是重载中段货运的直接可比。Kratos
              可作为战略制造和国防技术参照，但它是多元化上市国防承包商，不是纯自主货运公司。Dealroom、PitchBook、Crunchbase
              以及行业交易汇总给出的创投市场数据说明：带有强平台叙事的公司拿到十亿美元级定价并不罕见，尤其当国防、自主和物流主题交汇时。但这些资料只是语境，不是证明。它们真正说明的是，Elroy
              的估值落在高溢价叙事群组里；传统财务披露出现之前，投资人已经在为类别领导者的可能性买单。这种定价可以接受，前提是承认主题稀缺价值和合同已经证明的经济产出之间仍有缺口。换句话说，Elroy
              可能配得上战略稀缺性溢价，但稀缺不等于已证明的盈利能力。投资逻辑越依赖未来战略重要性，估值就越吃执行速度和市场情绪。因此，$1 billion
              企业价值作为融资结果可以理解，作为基本面估值锚仍让人不安。这个价格说明投资人愿意资助怎样的期权，不说明这门生意已经在经济性上证明了什么。
