companyProfile:
  summary: >-
    Elroy Air 成立于 2016 年，做自主货运飞机，核心产品是 Chaparral：一套混合电动 VTOL
    平台，瞄准中段物流、国防补给、人道主义响应等不依赖重基础设施的货运任务。公开记录显示，FedEx、Bristow、LCI、国防演示、USDOT eIPP，以及 2026 年通过 SPAC 上市、注入至少 $165 million
    已承诺 PIPE 融资的协议，都给了公司可信的外部验证。机会有战略吸引力，因为它切的是比消费者末端配送更难、也没那么拥挤的任务集；但公司披露的仍更多是平台愿景和需求管线，而不是收入、利润率或合同转化。
