companyProfile:
  summary: >-
    Elroy Air is a 2016-founded autonomous cargo-aircraft company building Chaparral, a hybrid-electric VTOL platform aimed at middle-mile logistics, defense resupply, humanitarian response, and other infrastructure-light freight missions. The public record shows credible external validation through FedEx, Bristow, LCI, defense demonstrations, USDOT's eIPP, and a 2026 agreement to go public through a SPAC that would inject at least $165 million of committed PIPE financing. The opportunity is strategically interesting because it targets a harder and less crowded mission set than consumer last-mile delivery, but the company still discloses far more about platform promise and demand pipeline than about revenue, margins, or contract conversion.
  foundedDate: "2016-01-01"
  founders:
    - name: David Merrill
      role: Founder; Executive Chairman
      background: >-
        Public materials and historical coverage identify Merrill as a co-founder who led the company before the 2025 CEO transition and remains central to strategic partnerships and government-facing positioning.
      claimRefs: [CO002, CO004, CO034]
    - name: Clint Cope
      role: Co-founder; product and engineering leader
      background: >-
        Public sources continue to identify Cope as co-founder with responsibilities spanning strategy, product, and engineering, anchoring the technical continuity of the Chaparral program.
      claimRefs: [CO002, CO005]
  foundingLocation: San Francisco Bay Area, California
  headquarters: San Francisco Bay Area, CA
  productSummary: >-
    Chaparral is a hybrid-electric autonomous heavy-cargo VTOL aircraft platform designed for runway-independent middle-mile logistics. Public materials describe detachable cargo pods, defense and industrial mission flexibility, and specification ranges that evolved from roughly 300 lb / 300 mi claims toward 500+ lb / up to 450 mi claims in 2026 transaction materials.
  customerFocus: Defense, freight, humanitarian logistics operators
  businessModel: >-
    The visible monetization stack appears to combine aircraft sales, operating partnerships, lessor or operator channel deployment, and potential recurring software or services revenue referenced in transaction materials.
  stage: SPAC (pre-close)
  fundingStatus: >-
    Announced June 2026 SPAC transaction with Columbus Circle Capital Corp II at approximately $800 million pre-money and roughly $1.0 billion post-transaction enterprise value, supported by at least $165 million of committed PIPE capital.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO011, CO012, CO013, CO016, CO019, CO021, CO033]
summary:
  headline: >-
    Elroy Air has a differentiated and strategically relevant autonomous cargo-aircraft thesis with real partner and customer validation, but the current public record still leaves too much contract, operating, and financial opacity to underwrite the announced $1 billion valuation with high conviction.
  overallScore: 6.6
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
