      - number: '1.3'
        title: Product, demand, and customer signals
        blocks:
          - type: paragraph
            body: >-
              The core product is Chaparral, an autonomous hybrid-electric VTOL cargo aircraft that uses detachable pods
              to pick up and drop off freight without airport infrastructure. Public product language evolved over time.
              In 2022 through early 2025, official and partner sources consistently described a 300-pound payload over
              roughly 300 miles, while the June 2026 SPAC materials described a heavier 500-plus-pound configuration
              with up to 450 miles of range. That change suggests either a broader family/configuration story or more
              aggressive current marketing rather than a single immutable spec, so diligence should ask management to
              reconcile the exact production configuration. Customer and partner signals are real but still mostly
              forward-looking. FedEx has collaborated with Elroy since 2020 and publicly planned middle-mile testing in
              2022. Bristow signed a 100-aircraft letter of intent and later secured five early delivery positions,
              while LCI committed to up to 40 aircraft. Elroy’s own 2026 materials also cite Barq Group, SLI, and FedEx
              inside a 1,400-aircraft pipeline, but the filing language explicitly warns that the pipeline remains
              composed of non-binding letters of intent and memorandums of understanding rather than booked revenue.
            claimRefs:
              - CO014
              - CO016
              - CO019
              - CO020
              - CO021
              - CO022
              - CO023
              - CO031
      - number: '1.4'
        title: Milestones and diligence caveats
        blocks:
          - type: paragraph
            body: >-
              Elroy’s milestone path shows tangible technical and institutional progress. The company was founded in
              2016, announced the Chaparral platform publicly in early 2022, expanded FedEx and Bristow relationships in
              2022-2023, completed the first flight of its hybrid-electric powertrain in 2023, flew at Yuma Proving
              Ground in 2024 for Marine Corps contested-logistics use cases, and entered 2025 with a new CEO plus
              additional private financing. In March 2026 Elroy said it was the only heavy-payload cargo OEM selected
              for the U.S. Department of Transportation’s eVTOL Integration Pilot Program, and in June 2026 it announced
              the SPAC transaction. July 2026 releases added new unattended-delivery modes under an Army contract. Those
              milestones support the conclusion that Elroy is no longer a paper concept. The caveat is that the company
              still operates with substantial disclosure opacity and execution dependency. Revenue, customer count,
              backlog conversion, headcount, cash balance, and debt remain unavailable in public materials, while both
              SEC materials and external certification reporting highlight regulatory approvals as a major
              commercialization risk.
