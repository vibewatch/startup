      - number: '2.3'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption momentum comes from several reinforcing drivers. Market reports consistently point to e-commerce
              growth, automation of logistics networks, regulatory pilots for commercial drone usage, and rising
              investment in dedicated infrastructure such as corridors, landing zones, fleet software, and airspace
              integration. Global Market Insights also highlights BVLOS expansion, healthcare logistics, and defense
              resupply as important demand accelerants, all of which map cleanly onto Elroy’s positioning. Yet the
              constraint set is just as real. Regulatory fragmentation across regions remains high, operating costs for
              large cargo-drone networks are still meaningful, and many buyers need proof that payload, turnaround,
              maintenance, and mission reliability are better than incumbent helicopters or ground transport. FAA
              certification and approval cadence remain particularly important for U.S. scale-up. The adoption path
              therefore looks staged: first defense or remote industrial missions with strong ROI and lower
              infrastructure requirements, then regional offshore and industrial corridors, and only later broader
              commercial middle-mile networks once safety data, throughput, and economics are clearer. In practice,
              adoption should be expected to move first in places where customer pain is acute and route density is low
              enough that incumbent transport is expensive or risky. That makes market readiness highly uneven by
              geography and segment rather than uniformly “on” or “off.”
            claimRefs:
              - CM016
              - CM017
