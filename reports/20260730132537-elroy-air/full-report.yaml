  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital stack and transaction structure
        blocks:
          - type: paragraph
            body: >-
              Elroy Air remains financially opaque in the classic sense: there is no audited income statement, backlog
              conversion disclosure, unit-economics bridge, or public cash balance that allows an outside investor to
              underwrite near-term operating performance. What the public record does provide is a capital-formation
              story. The June 2026 business-combination announcement frames the company around an approximately $800
              million pre-money equity value, roughly $1.0 billion post-transaction enterprise value, and at least $165
              million of committed PIPE financing, with additional trust proceeds available depending on redemptions.
              Those facts matter because this chapter is less about trailing financial performance than about whether
              the planned capital injection is adequate to fund production, certification, hiring, and working-capital
              needs for a heavy-cargo aircraft program. The deal materials repeatedly position proceeds as growth
              capital, which implies management views scale-up, not balance-sheet cleanup, as the core use case.
              Investors should therefore read Elroy as a pre-revenue or early-revenue industrial technology financing
              case whose most important variable is cash runway against execution milestones, not reported quarterly
              margins.  Investors should also note that aerospace hardware businesses often absorb cash in batches
              around tooling, supplier qualification, inventory, and field support before revenue recognition catches
              up. That dynamic makes apparent capital adequacy very sensitive to schedule slip. A modest delay in
              certification, customer acceptance, or production readiness can convert a seemingly well-funded plan into
              a bridge-financing story quickly, especially in a market that now discounts optimistic SPAC projections
