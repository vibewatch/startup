  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Elroy Air does not compete in the broadest possible “drone market”; it sits inside a narrower intersection
              of cargo drones, drone logistics services, and middle-mile industrial air freight. The narrowest lens
              comes from cargo-drone manufacturing studies that define the category around unmanned aircraft used to
              transport goods, segmented by aircraft type, payload band, range, and end market. The broadest lens comes
              from drone-logistics studies that count not just aircraft but software, warehousing, infrastructure, and
              transport services. This distinction matters because Elroy’s value proposition is not last-mile consumer
              delivery in dense urban areas. It is heavy-payload, infrastructure-light logistics between flexible points
              for defense, offshore energy, humanitarian, and industrial operators. The status-quo substitutes are
              helicopters, feeder aircraft, trucks, boats, and manually scheduled charter lift, depending on route
              density and urgency. For buyers, the core question is not whether drones exist; it is whether hybrid VTOL
              cargo aircraft can move enough payload with enough reliability to beat those substitutes on cost, speed,
              risk, or access in routes that lack efficient runway or road infrastructure. That is why the most useful
              market frame starts with mission geometry and infrastructure constraints, not with generic drone counts.
              Elroy is trying to create value where roads, runways, or crew availability are the bottleneck rather than
              merely where parcel volume is large.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
