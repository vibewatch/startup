      - number: '2.2'
        title: Sizing lenses and target segments
        blocks:
          - type: paragraph
            body: >-
              The public sizing evidence is directionally attractive but numerically inconsistent, which is typical for
              an immature category. The Business Research Company’s cargo-drone report puts the market at $3.13 billion
              in 2026, up from $2.32 billion in 2025, while Global Market Insights estimates $2.8 billion in 2026 after
              $2.1 billion in 2025 and projects much larger 2035 scale. Fortune Business Insights publishes a lower 2025
              base of $1.82 billion but still projects an aggressive multiyear ramp. Meanwhile, TBRC’s broader
              drone-logistics-and-transportation report reaches $26.33 billion in 2026 because it includes services and
              infrastructure layers beyond aircraft alone. The useful conclusion is not which number is “correct” in
              absolute terms; it is that Elroy’s practical addressable market is much smaller than the broad service
              stack but larger than a single niche such as medical delivery. Near-term SAM is most plausibly the
              heavy-payload, hybrid-VTOL, long-range middle-mile wedge serving defense, offshore energy, remote
              industrial logistics, and time-sensitive warehouse-to-warehouse transport in regions willing to support
              piloted rollout programs. For diligence, the most responsible method is to keep a broad TAM, a narrow
              mission-led SAM, and a proof-driven SOM separate instead of converting one analyst forecast directly into
              company revenue potential.
