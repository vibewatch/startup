  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers and adjacent architectures
        blocks:
          - type: paragraph
            body: >-
              Elroy’s direct competition is narrower than the full drone-delivery universe. The closest architectural
              and mission peers are companies trying to move meaningful cargo over distance with either VTOL or
              short-field autonomy: Pyka’s DropShip and Pelican Cargo, Windracers ULTRA, Sabrewing’s Rhaegal concept,
              and Dronamics’ long-range cargo system all address freight movement more than passenger mobility. But the
              adjacent field matters almost as much as the direct peer set. EHang and Joby illustrate how
              well-capitalized eVTOL platforms can evolve toward logistics or special-mission variants. Wing, Matternet,
              and Zipline show what scaled operational maturity looks like in smaller-payload delivery networks, even
              though their payload classes and route economics differ sharply from Chaparral’s. The result is a
              competitive set defined less by identical aircraft specs than by who owns the buyer relationship and
              regulatory pathway for autonomous air logistics. The landscape is therefore best grouped by mission
              adjacency: true heavy cargo peers, scaled last-mile operators that could climb the payload ladder, and
              public eVTOL companies that could redeploy capital and certification learning into logistics if the
              economics become compelling. That is especially true in 2026, when regulatory progress and customer trust
              remain uneven across architectures and geographies.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP001
