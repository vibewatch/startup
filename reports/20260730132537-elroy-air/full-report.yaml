      - number: '8.3'
        title: Investment stance and valuation judgment
        blocks:
          - type: paragraph
            body: >-
              The most defensible conclusion is that Elroy’s valuation is stretched but not absurd. It is too rich to
              justify on disclosed fundamentals alone, because those fundamentals are largely absent. It is not
              obviously irrational if one gives significant credit to the company’s differentiated mission focus, named
              counterparties, public-market financing path, and strategic manufacturing alignment. The adverse read is
              that investors are capitalizing non-binding pipeline claims and regulatory optimism too heavily. The
              constructive read is that the market is paying for a potentially important U.S.-aligned autonomy platform
              before the category is crowded. Balancing those views, the right stance is fair-to-stretched leaning
              stretched: interesting enough to track closely, but not yet supported by the level of economic
              transparency that would justify a high-confidence bullish underwriting case.  Put differently, Elroy may
              deserve a premium for strategic scarcity, but scarcity is not the same as demonstrated earning power. The
              more the investment case rests on future strategic importance, the more sensitive valuation becomes to
              execution speed and market mood. That is why a $1 billion enterprise value can be simultaneously
              understandable as a financing outcome and still uncomfortable as a fundamental valuation anchor. The price
              is telling us what optionality investors are willing to fund, not what the business has already proven
