  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Transaction and capital risk
        blocks:
          - type: paragraph
            body: >-
              Elroy’s risk stack is broad because it sits at the intersection of aerospace certification, autonomous
              operations, manufacturing scale-up, and venture-style capital dependency. The June 2026 transaction
              materials are explicit that the proposed business combination still depends on approvals, and they also
              warn that the published demand pipeline is not firm backlog. Those are ordinary cautions for a de-SPAC,
              but they are unusually important here because Elroy’s business case depends on converting technical
              promise into certified, delivered, and repeatedly operated aircraft. The company therefore carries both
              transactional risk and program risk. Even if the deal closes, investors still face the possibility that
              regulatory timing, production complexity, or customer conversion runs slower than capital deployment. In
              short, the biggest risk is not one catastrophic flaw; it is a chain of milestones that all need to line up
              closely enough for financing and operations to reinforce each other rather than diverge.  Because the
              risks are interconnected, small misses can compound. If close timing slips, capital gets tighter. If
              capital tightens, hiring and industrialization may slow. If industrialization slows, customer conversions
              and regulatory credibility can weaken. That compounding pattern is why investors should track milestone
              sequencing rather than isolated headlines. The best risk mitigant for Elroy is a steady cadence of
              concrete operating proof and contract hardening that reduces uncertainty across several categories at
              once.
            claimRefs:
