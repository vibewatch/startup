  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Architecture and mission fit
        blocks:
          - type: paragraph
            body: >-
              Elroy’s technical thesis is unusually specific for an autonomous aviation startup: instead of optimizing
              for passenger eVTOL or very small last-mile packages, Chaparral is designed as a heavy-cargo VTOL aircraft
              that can move meaningful payload without runway dependence or charging infrastructure. The public
              materials consistently emphasize a hybrid-electric propulsion system, detachable cargo pods, and
              operations oriented around middle-mile, defense, and austere logistics missions. That matters because the
              product is not simply another drone; it is a systems architecture aimed at the hardest lanes where roads,
              runways, or crews are scarce. The technology promise therefore combines several layers at once: vertical
              takeoff for flexible logistics nodes, fixed-wing cruise efficiency for range, autonomy software for
              crew-light operations, and mission pods for rapid loading and reconfiguration. In diligence terms, the
              question is not whether each component sounds attractive in isolation, but whether the integrated system
              can deliver repeatable mission reliability and economic performance under real operational constraints. 
              The technical upside is therefore easiest to believe on missions where infrastructure scarcity and payload
              urgency dominate, because those are the situations in which hybrid VTOL and modular logistics have the
              clearest advantage over conventional drones. The remaining burden of proof is operational repetition:
              repeated sorties, maintainability, and predictable field support. Until those datasets are public,
              investors should view the platform as technically credible but still moving from demonstration evidence
              into scaled operating evidence.
            claimRefs:
