      - number: '8.2'
        title: Public-market and venture context
        blocks:
          - type: paragraph
            body: >-
              Relative valuation is imperfect because truly comparable public companies are scarce. Joby and EHang
              provide public-market readthrough on advanced air mobility sentiment and certification visibility, but not
              a direct heavy-cargo middle-mile match. Kratos offers a strategic manufacturing and defense-technology
              reference point, yet it is a diversified public defense contractor rather than an autonomous cargo pure
              play. Venture market trackers from Dealroom, PitchBook, Crunchbase, and sector deal summaries provide
              context that billion-dollar pricing is not unusual for companies attached to strong platform narratives,
              especially where defense, autonomy, and logistics themes intersect. Still, those sources are context, not
              proof. What they do show is that Elroy’s valuation sits inside a premium narrative cohort, where investors
              pay for the possibility of category leadership before traditional financial disclosures exist. That can be
              acceptable, but only if one acknowledges the gap between thematic scarcity value and contractually proven
              economic output.  Put differently, Elroy may deserve a premium for strategic scarcity, but scarcity is not
              the same as demonstrated earning power. The more the investment case rests on future strategic importance,
              the more sensitive valuation becomes to execution speed and market mood. That is why a $1 billion
              enterprise value can be simultaneously understandable as a financing outcome and still uncomfortable as a
              fundamental valuation anchor. The price is telling us what optionality investors are willing to fund, not
              what the business has already proven economically.
            claimRefs:
              - CV011
              - CV012
