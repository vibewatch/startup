companyProfile:
  summary: >-
    Elroy Air is a 2016-founded autonomous cargo-aircraft company building Chaparral, a hybrid-electric VTOL platform
    aimed at middle-mile logistics, defense resupply, humanitarian response, and other infrastructure-light freight
    missions. The public record shows credible external validation through FedEx, Bristow, LCI, defense demonstrations,
    USDOT's eIPP, and a 2026 agreement to go public through a SPAC that would inject at least $165 million of committed
    PIPE financing. The opportunity is strategically interesting because it targets a harder and less crowded mission
    set than consumer last-mile delivery, but the company still discloses far more about platform promise and demand
    pipeline than about revenue, margins, or contract conversion.
