    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and leadership transition
        blocks:
          - type: paragraph
            body: >-
              Elroy Air is best understood in 2026 as a U.S. autonomous middle-mile logistics company building
              heavy-cargo VTOL aircraft rather than small parcel drones or passenger eVTOLs. The company says its
              mission is to expand same-day shipping and zero-risk resupply by using hybrid-electric aircraft that can
              operate without runways or charging stations. Open-record leadership evidence also shows a meaningful
              transition from founder-led startup to scale-up operator. Andrew Clare became chief executive in January
              2025 after prior roles at Tesla and Nuro, while co-founder Dave Merrill moved to executive chairman and
              remained central to strategy, partnerships, and defense positioning. Clint Cope, the other co-founder,
              still appears on the company’s about page in a strategy, product, and engineering role. The broader
              leadership bench now includes a named CTO, finance lead, federal business-development lead, and
              flight-test and integration leaders, which is stronger than the company’s earlier founder-centric public
              profile but still leaves key-person dependence on Merrill’s market relationships and Clare’s execution
              capability.
