- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Primary buyer / budget owner
  - User
  - Why Chaparral fits
  - Adoption path
  rows:
  - - Defense resupply
    - Program office, logistics command, procurement
    - Operators supporting troops or expeditionary logistics
    - Runway independence, pod flexibility, and lower personnel exposure
    - Demo -> pilot program -> program-of-record or repeated tasking
  - - Offshore energy and industrial logistics
    - Operations, aviation, or logistics lead
    - Field teams and support contractors
    - Point-to-point cargo to energy sites and industrial locations
    - Pilot corridor -> contracted service -> fleet expansion
  - - Express middle-mile parcel / warehouse transfer
    - Network planning and transportation ops
    - Hub managers and linehaul teams
    - Potential to bridge sortation sites faster than trucks in selected lanes
    - Evaluation with incumbent carrier -> route trials -> lane-based rollout
  - - Humanitarian and remote community supply
    - Government, NGO, or aid-program logistics sponsor
    - Field delivery coordinators
    - Infrastructure-light access and rapid point-to-point movement
    - Grant / emergency pilot -> regional operating partner -> scaled program
  - - Regional leasing / aviation-service intermediary
    - Aircraft lessor or operator
    - Commercial service operator
    - Lets buyers avoid full internal aircraft development and certification burden
    - Pre-order -> delivery slots -> region-specific service deployment
  notes: Segments are defined by budget owner and operational context rather than only end-user label; Elroy’s adoption path depends heavily on who controls risk, safety, and route authorization.
