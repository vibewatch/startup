- id: TM002
  title: TAM / SAM / SOM or sizing lens table
  columns:
  - Lens
  - Public number / scale
  - Source period
  - Interpretation
  - Use in diligence
  rows:
  - - Global cargo drones market (TBRC)
    - '2026: $3.13B; 2030: $10.69B'
    - 2025-2030
    - Factory-gate market for cargo-drone goods and related services
    - Reasonable manufacturing-oriented top-down TAM lens
  - - Global cargo drones market (GMI)
    - '2026: $2.8B; 2035: $58.8B'
    - 2025-2035
    - Aggressive long-duration growth case with heavy-payload and BVLOS upside
    - Useful bull-case industry lens
  - - Global cargo drones market (Fortune BI)
    - '2025: $1.82B; 2032: $33.79B'
    - 2025-2032
    - Lower near-term base but still hypergrowth trajectory
    - Useful downside/bearish check on market starting point
  - - Drone logistics and transportation market (TBRC)
    - '2026: $26.33B; 2030: $61.1B'
    - 2025-2030
    - Much broader service and infrastructure lens than aircraft-only TAM
    - Do not use as Elroy SAM without haircut
  - - Elroy practical SAM
    - Heavy-payload hybrid-VTOL middle-mile missions in defense, offshore, industrial, and remote logistics
    - 2026 onward
    - Smaller than broad drone logistics, larger than a single pilot use case
    - Management should quantify by route, mission, and buyer budget rather than generic drone TAM
  notes: Sizing is evidence-constrained and deliberately multi-lens; no single analyst number should be treated as a precise forecast for Elroy’s convertible revenue opportunity.
