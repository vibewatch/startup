  - CM005
  - CM006
  - CM007
  - CM014
  - CM015
  - CM021
- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Evidence
  - Why it matters for Elroy
  rows:
  - - BVLOS and airspace integration pilots
    - Driver
    - GMI and TBRC both point to regulatory pilots, BVLOS expansion, and enabling frameworks
    - Directly increases the reachable route set for hybrid-VTOL cargo systems
  - - Defense and tactical logistics demand
    - Driver
    - GMI highlights defense logistics growth; Elroy sources show real federal programs
    - Supports early-market adoption before broad civil certification matures
  - - E-commerce and time-sensitive logistics
    - Driver
    - Fortune BI and FedEx materials tie growth to faster delivery and network efficiency
    - Creates commercial urgency for selected middle-mile lanes
  - - Infrastructure-light industrial corridors
    - Driver
    - Bristow, Barq, and Elroy eIPP materials point to offshore and remote industrial routes
    - Matches Chaparral’s runway-independent design
  - - Regulatory fragmentation and certification delay
    - Constraint
    - GAO and Aerospace America show approval complexity and timing uncertainty
    - Delays U.S. scale-up and makes non-U.S. or defense-first strategy more likely
  - - High cost, maintenance, and proof burden
    - Constraint
    - Fortune BI and GMI both cite high startup or operating costs and deployment complexity
    - Means buyers will demand mission economics, reliability, and support evidence before scaling
  notes: This table pairs market-study drivers with Elroy-specific route-to-market implications; the adoption constraint side is at least as important as the growth-story side.
