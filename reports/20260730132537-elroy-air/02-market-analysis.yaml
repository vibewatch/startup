tables:
- id: TM001
  title: Market definition table
  columns:
  - Lens
  - What it includes
  - What it excludes
  - Why it matters for Elroy
  rows:
  - - Cargo drones (aircraft manufacturing lens)
    - Aircraft platforms, payload/range classes, and related OEM sales
    - Broader services, warehousing, and software-only logistics revenue
    - Closest to Elroy as an aircraft-maker and systems provider
  - - Drone logistics and transportation lens
    - Aircraft plus shipping, warehousing, software, and supporting infrastructure
    - Non-drone transport modes
    - Useful for long-run ecosystem value but too broad for near-term SAM
  - - Middle-mile logistics wedge
    - Inter-facility, offshore, intercity, and remote-point cargo transfer
    - Dense consumer last-mile parcel drop-offs
    - Best functional description of Chaparral’s warehouse-to-warehouse and industrial role
  - - Defense / humanitarian / industrial mission lens
    - High-urgency, infrastructure-light, or contested logistics missions
    - Routine commodity freight where trucking already dominates
    - Explains why Elroy can win before the entire commercial air-cargo stack changes
  notes: The same company can participate in multiple overlapping market lenses; the purpose of the table is to keep broad TAM language from overstating the near-term commercial wedge.
  claimRefs:
