  evidenceGaps:
  - type: missing-source
    severity: material
    topic: precise-som
    missingEvidence: A route-level model translating market growth into Elroy’s actual reachable share by geography, approval regime, and mission type.
    whyItMatters: Public TAM studies are too broad to underwrite revenue capture without conversion assumptions.
    diligencePath: Request management’s bottom-up route model with customers, lanes, payload, utilization, and approval gating.
    relatedQuestionRefs:
    - QM012
    - QM024
  - type: conflicting-data
    severity: material
    topic: market-size-drift
    missingEvidence: A reconciled view of why major analyst firms disagree so sharply on current and long-range market size.
    whyItMatters: Different scope choices can dramatically overstate or understate investable market size.
    diligencePath: Normalize each report to manufacturing only, then compare against a separate services-stack lens.
    relatedQuestionRefs:
    - QM010
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-roi
    missingEvidence: Customer-level ROI evidence showing when Chaparral beats helicopters, trucks, or feeder aircraft on selected lanes.
    whyItMatters: Adoption depends on mission economics, not just macro market growth.
    diligencePath: Request pilot data, route economics, and time-to-turn comparisons from FedEx, Bristow, or internal test corridors.
    relatedQuestionRefs:
    - QM021
    - QM023
    relatedTableRefs:
    - TM003
    - TM004
  - type: stale
    severity: minor
    topic: narrow-sam-definition
    missingEvidence: A current public segmentation that isolates heavy-payload hybrid-VTOL middle-mile cargo from the broader drone market.
    whyItMatters: Analyst coverage still bundles multiple architectures and use cases together.
    diligencePath: Monitor later SEC filings or management decks for a bottom-up SAM cut by mission and region.
    relatedQuestionRefs:
