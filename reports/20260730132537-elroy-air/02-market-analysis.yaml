chapter:
  number: 2
  title: Market Analysis
  summary: Public market data supports a large and rapidly growing cargo-drone opportunity, but reported market size varies widely depending on whether a source counts only cargo-aircraft manufacturing or the broader drone-logistics services stack. Elroy Air is best positioned inside the heavy-payload, hybrid-VTOL, middle-mile and defense-logistics wedge rather than the entire drone-delivery universe, which sharpens near-term SAM but still leaves a meaningful runway if BVLOS policy and industrial/offshore use cases continue opening in the U.S. and allied markets.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary and substitutes
  body: Elroy Air does not compete in the broadest possible “drone market”; it sits inside a narrower intersection of cargo drones, drone logistics services, and middle-mile industrial air freight. The narrowest lens comes from cargo-drone manufacturing studies that define the category around unmanned aircraft used to transport goods, segmented by aircraft type, payload band, range, and end market. The broadest lens comes from drone-logistics studies that count not just aircraft but software, warehousing, infrastructure, and transport services. This distinction matters because Elroy’s value proposition is not last-mile consumer delivery in dense urban areas. It is heavy-payload, infrastructure-light logistics between flexible points for defense, offshore energy, humanitarian, and industrial operators. The status-quo substitutes are helicopters, feeder aircraft, trucks, boats, and manually scheduled charter lift, depending on route density and urgency. For buyers, the core question is not
    whether drones exist; it is whether hybrid VTOL cargo aircraft can move enough payload with enough reliability to beat those substitutes on cost, speed, risk, or access in routes that lack efficient runway or road infrastructure. That is why the most useful market frame starts with mission geometry and infrastructure constraints, not with generic drone counts. Elroy is trying to create value where roads, runways, or crew availability are the bottleneck rather than merely where parcel volume is large.
