  - FR003
- id: execution-and-concentration-risk
  title: Execution and concentration risk
  body: 'Execution and concentration risks round out the picture. Kratos is strategically helpful as a manufacturing partner, but any heavy reliance on a limited supplier set can create bottlenecks or renegotiation leverage. Customer concentration cuts both ways as well: marquee counterparties validate the platform, yet loss of momentum with just a few flagship programs could materially weaken the company’s narrative and financing posture. International expansion via Barq adds geopolitical and program-management opportunity, but also coordination, compliance, and timeline risk. Finally, management transition and talent retention matter because Elroy is trying to scale complex hardware and autonomy software simultaneously. The practical takeaway is that Elroy’s upside is real precisely because it is attempting something difficult; the same difficulty creates a layered risk profile that justifies conservative assumptions on timing, conversion, and capital needs.  Because the risks are interconnected,
    small misses can compound. If close timing slips, capital gets tighter. If capital tightens, hiring and industrialization may slow. If industrialization slows, customer conversions and regulatory credibility can weaken. That compounding pattern is why investors should track milestone sequencing rather than isolated headlines. The best risk mitigant for Elroy is a steady cadence of concrete operating proof and contract hardening that reduces uncertainty across several categories at once.'
