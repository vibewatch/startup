- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: 'Regulatory and legal risk deserve special weight. Large autonomous cargo aircraft live in a policy environment that is still evolving, particularly around BVLOS operations, airspace integration, export controls, and liability frameworks. ABA and DLA Piper commentary shows that the rulemaking environment remains active rather than settled, while GAO and Aerospace America sources underline how certification pathways remain challenging even for new piloted electric aircraft, let alone autonomous logistics systems. Elroy can progress through defense and pilot pathways before the broadest civil rules are complete, but the long-run commercial thesis still requires a more durable permissions regime. That means a company-level win condition is partly external: even excellent engineering may not translate into timely scaled deployment if FAA and adjacent policy frameworks move cautiously. Investors should treat every commercial forecast as a joint function of product readiness and regulatory
    tempo.  Because the risks are interconnected, small misses can compound. If close timing slips, capital gets tighter. If capital tightens, hiring and industrialization may slow. If industrialization slows, customer conversions and regulatory credibility can weaken. That compounding pattern is why investors should track milestone sequencing rather than isolated headlines. The best risk mitigant for Elroy is a steady cadence of concrete operating proof and contract hardening that reduces uncertainty across several categories at once.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  tableRefs:
