- id: distribution-power-and-substitutes
  title: Distribution power, substitutes, and multi-homing
  body: 'The hardest competitive pressure on Elroy may come from distribution power rather than aircraft performance alone. FedEx, defense buyers, lessors, and offshore operators can evaluate multiple architectures at once, which limits lock-in before a scaled fleet is deployed. Customers can also stay with incumbent substitutes: helicopters for offshore routes, trucks for warehouse transfers, feeder aircraft for regional freight, and manual charter lift for ad hoc missions. Some adjacent players already own stronger route density or installed networks. Wing and Matternet have built commercial delivery operations and authorizations; Zipline has a large brand and operational proof set; Joby and EHang have far larger public-market or certification visibility, even if their core missions differ. On the other hand, infrastructure-light cargo VTOL remains immature enough that buyers may multi-home across operators, leasing structures, and mission profiles rather than selecting a single winner.
    That creates opportunity for Elroy to wedge into underserved heavy-cargo missions, but it reduces certainty that early pilots translate into durable exclusive share. In other words, the real contest is often for route authority and integration trust, not just for a better aircraft brochure. Timing and trust are the real gates.'
