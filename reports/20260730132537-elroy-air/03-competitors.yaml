  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Comparable public pricing, service-rate cards, or customer ROI disclosures across autonomous cargo peers.
    whyItMatters: Without published pricing or lane economics, it is difficult to assess whether Elroy wins on cost, speed, or only narrative.
    diligencePath: Request route-level proposals, leasing economics, and customer business cases from Elroy and comparable operators.
    relatedQuestionRefs:
    - QP015
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: share-durability
    missingEvidence: Customer concentration, renewal rates, pilot conversion rates, and exclusivity terms across the competitive set.
    whyItMatters: Winner-take-most claims depend on retention and exclusivity, not just product specs.
    diligencePath: Ask management which customers are exclusive, multi-homing, or using competing vendors in parallel.
    relatedQuestionRefs:
    - QP017
    - QP020
    - QP025
  - type: conflicting-data
    severity: minor
    topic: peer-readiness-comparability
    missingEvidence: A common scorecard that normalizes certification, payload, route type, and operating scale across very different platforms.
    whyItMatters: The peer set mixes cargo VTOLs, fixed-wing freighters, and last-mile delivery networks, which can distort comparisons.
    diligencePath: Normalize competitors by mission class and customer workflow before using them in investment comp sets.
    relatedQuestionRefs:
    - QP001
    - QP010
    - QP024
