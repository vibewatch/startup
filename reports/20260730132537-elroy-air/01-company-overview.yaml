- id: governance-capital-and-stage
  title: Governance, capital, and current stage
  body: Governance visibility improved materially by 2026 because Elroy Air’s public about page now names both board members and a defense-oriented advisory board. Publicly identified directors include investor representatives from Shield Capital, Marlinspike Partners, Catapult Ventures, DiamondStream Partners, Lockheed Martin Ventures, and former U.S. Secretary of Defense Mark Esper, alongside David Merrill. The advisory board includes H.R. McMaster, Ellen Lord, Frank McKenzie, Lorin Selby, Richard Clarke, Mike Dana, Jason Rathje, and other defense and aerospace figures, reinforcing the company’s clear tilt toward military logistics and government credibility. Capital disclosure remains mixed. Elroy announced an additional funding close in January 2025 but did not publish the round size, then announced in June 2026 a SPAC merger with Columbus Circle Capital Corp II that implied an $800 million pre-money value and approximately $1.0 billion post-transaction enterprise value. The transaction
    also disclosed at least $165 million of committed PIPE capital, including $65 million funded at signing, but public documents still do not disclose current cash on hand, lifetime capital raised with full precision, or any audited revenue base supporting the step-up in valuation.
