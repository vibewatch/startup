- id: product-demand-and-customer-signals
  title: Product, demand, and customer signals
  body: The core product is Chaparral, an autonomous hybrid-electric VTOL cargo aircraft that uses detachable pods to pick up and drop off freight without airport infrastructure. Public product language evolved over time. In 2022 through early 2025, official and partner sources consistently described a 300-pound payload over roughly 300 miles, while the June 2026 SPAC materials described a heavier 500-plus-pound configuration with up to 450 miles of range. That change suggests either a broader family/configuration story or more aggressive current marketing rather than a single immutable spec, so diligence should ask management to reconcile the exact production configuration. Customer and partner signals are real but still mostly forward-looking. FedEx has collaborated with Elroy since 2020 and publicly planned middle-mile testing in 2022. Bristow signed a 100-aircraft letter of intent and later secured five early delivery positions, while LCI committed to up to 40 aircraft. Elroy’s own 2026
    materials also cite Barq Group, SLI, and FedEx inside a 1,400-aircraft pipeline, but the filing language explicitly warns that the pipeline remains composed of non-binding letters of intent and memorandums of understanding rather than booked revenue.
