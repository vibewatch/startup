- id: milestones-and-diligence-caveats
  title: Milestones and diligence caveats
  body: Elroy’s milestone path shows tangible technical and institutional progress. The company was founded in 2016, announced the Chaparral platform publicly in early 2022, expanded FedEx and Bristow relationships in 2022-2023, completed the first flight of its hybrid-electric powertrain in 2023, flew at Yuma Proving Ground in 2024 for Marine Corps contested-logistics use cases, and entered 2025 with a new CEO plus additional private financing. In March 2026 Elroy said it was the only heavy-payload cargo OEM selected for the U.S. Department of Transportation’s eVTOL Integration Pilot Program, and in June 2026 it announced the SPAC transaction. July 2026 releases added new unattended-delivery modes under an Army contract. Those milestones support the conclusion that Elroy is no longer a paper concept. The caveat is that the company still operates with substantial disclosure opacity and execution dependency. Revenue, customer count, backlog conversion, headcount, cash balance, and debt remain
    unavailable in public materials, while both SEC materials and external certification reporting highlight regulatory approvals as a major commercialization risk.
