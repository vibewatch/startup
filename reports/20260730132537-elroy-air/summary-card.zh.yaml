  topStrengths:
    - Elroy 切入服务不足的重载中程货运和国防物流，而不是更拥挤的载人 eVTOL 或小载荷最后一公里。
    - FedEx、Bristow、LCI、Barq、Kratos 和美国国防相关项目都给出具名验证，说明公司在解决真实物流痛点，且有多条商业化路径。
    - 2026 年 6 月交易若能完成，将在关键工业化阶段提供实质资金，推动生产、招聘和平台开发。
  topRisks:
    - 客户管线不等于确定 backlog；公开文件提示，许多需求信号仍无约束力，未必能按估值隐含时间表转成收入。
    - 认证、BVLOS 政策和运营批准仍是自主货运规模化部署的核心闸门，管理层只能部分掌控。
    - 收入、毛利率、现金消耗、backlog 质量和客户转化指标大多未披露，估值和现金跑道判断只能靠情景推演。
  unresolvedGaps:
    - 需要经审计或管理层提供的收入、现金消耗、现金跑道和毛利率桥接，检验宣布的 PIPE 是否真能支撑走向商业规模。
    - 需要 Bristow、LCI 和 FedEx 相关部署等主要交易对手的合同级细节，包括定金、里程碑付款、取消权和支持义务。
    - 需要独立运营数据，覆盖调度可靠性、架次、维护负担和航线级经济性，区分技术潜力与可持续商业表现。
