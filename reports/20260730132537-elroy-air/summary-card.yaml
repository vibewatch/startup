summary:
  headline: >-
    Elroy Air has a differentiated and strategically relevant autonomous cargo-aircraft thesis with real partner and
    customer validation, but the current public record still leaves too much contract, operating, and financial opacity
    to underwrite the announced $1 billion valuation with high conviction.
