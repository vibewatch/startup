  topStrengths:
    - >-
      Elroy is targeting a comparatively under-served heavy-cargo middle-mile and defense-logistics wedge rather than
      the more crowded passenger eVTOL or tiny-payload last-mile categories.
    - >-
      Named validation across FedEx, Bristow, LCI, Barq, Kratos, and U.S. defense-related programs suggests the company
      is solving a real logistics problem with multiple route-to-market pathways.
    - >-
      The June 2026 transaction, if closed, would provide meaningful capital to push production, hiring, and platform
      development forward during a critical industrialization phase.
  topRisks:
    - >-
      The customer pipeline is not equivalent to firm backlog; public filings warn that many demand signals remain
      non-binding and may not convert into revenue on the timeline implied by the valuation.
    - >-
      Certification, BVLOS policy, and operational approvals remain core gating factors for scaled autonomous cargo
      deployment, and they are only partly within management control.
    - >-
      Revenue, gross margin, burn, backlog quality, and customer-conversion metrics remain largely undisclosed, forcing
      valuation and runway judgments to remain scenario-based.
  unresolvedGaps:
    - >-
      Need audited or management-provided revenue, burn, runway, and gross-margin bridges to test whether the announced
      PIPE truly funds the path to commercial scale.
    - >-
      Need contract-level detail on deposits, milestone payments, cancellation rights, and support obligations for major
      counterparties such as Bristow, LCI, and FedEx-linked deployments.
    - >-
      Need independent operating data on dispatch reliability, sortie counts, maintenance burden, and lane-level
      economics to distinguish technical promise from durable commercial performance.
