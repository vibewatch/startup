- id: proof-points-and-industrialization
  title: Proof points and industrialization
  body: 'Public evidence provides encouraging but still incomplete signs of technical maturation. Official pages, patent records, defense demonstrations, and eIPP selection collectively indicate the company has moved well beyond concept art. NAVAIR and Leidos materials show government interest in performance evaluation and resupply use cases, while the USDOT eIPP selection suggests policy relevance for U.S. demonstration activity. The Kratos manufacturing relationship also implies the design is being industrialized rather than left as a prototype-only effort. Still, outside investors do not yet have a full certification roadmap, fleet availability metrics, dispatch reliability history, or a published maintenance-cost framework. That makes the technical case stronger than a pure paper airplane story, but weaker than a mature aircraft program with recurrent operating data. The prudent read is that Elroy has assembled a coherent architecture with credible proof points, while the remaining gap
    is certification-grade, scaled, and repetitive field performance that converts technical elegance into operational trust.  The technical upside is therefore easiest to believe on missions where infrastructure scarcity and payload urgency dominate, because those are the situations in which hybrid VTOL and modular logistics have the clearest advantage over conventional drones. The remaining burden of proof is operational repetition: repeated sorties, maintainability, and predictable field support. Until those datasets are public, investors should view the platform as technically credible but still moving from demonstration evidence into scaled operating evidence.'
