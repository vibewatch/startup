- id: contract-quality-and-conversion-risk
  title: Contract quality and conversion risk
  body: 'The sharpest limitation is contractual quality. Elroy’s own transaction materials caution that the demand pipeline includes non-binding letters of intent and memorandums of understanding. That means public logos cannot be treated as equivalent to firm backlog. FedEx testing is a meaningful proof point but not proof of scaled deployment economics. Bristow’s LOI and early delivery positions create more tangible structure, and LCI’s committed order language is stronger than broad partnership rhetoric, yet investors still lack visibility into deposits, milestone payments, cancellation terms, exclusivity, support obligations, and revenue timing. In other words, the customer set is real enough to validate problem relevance and platform interest, but not yet disclosed deeply enough to underwrite near-term revenue certainty. The practical implication is that customer diligence should focus on conversion quality: which counterparties are moving from strategic exploration into operational
    scheduling, financed fleet commitments, and repeatable route-level demand.  Another way to read the customer set is as stacked proof of problem urgency. FedEx validates interest from global express logistics, Bristow and LCI validate operator and financing pathways, and defense-linked demonstrations validate that the aircraft is being tested where urgency and route difficulty are highest. That does not solve commercialization risk, but it does lower the probability that Elroy is searching for a market in the abstract. The unresolved issue is economic conversion speed, not the absence of plausible customers.'
  claimRefs:
  - CU011
  - CU012
