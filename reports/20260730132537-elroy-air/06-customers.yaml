- id: route-to-commercial-scale
  title: Route to commercial scale
  body: 'A final positive is that Elroy appears to have multiple go-to-market pathways. It can sell aircraft, work through operators, partner with lessors, or support government and humanitarian use cases where performance matters more than dense-route economics. That flexibility improves the odds of finding early revenue wedges before a broad commercial air-cargo network exists. Yet it also creates go-to-market complexity because each path requires a different sales motion, operating responsibility split, and aftermarket support profile. The company’s best customer outcome is likely not a single monolithic fleet sale but a staggered set of deployments across logistics, defense, and regional operators that prove reliability in increasingly commercial settings. The evidence therefore supports a constructive customer-validation view with an execution caveat: Elroy has earned serious attention from credible counterparties, but investors still need firmer evidence that interest is maturing into
    contracted, financeable, and supportable fleet deployments.  Another way to read the customer set is as stacked proof of problem urgency. FedEx validates interest from global express logistics, Bristow and LCI validate operator and financing pathways, and defense-linked demonstrations validate that the aircraft is being tested where urgency and route difficulty are highest. That does not solve commercialization risk, but it does lower the probability that Elroy is searching for a market in the abstract. The unresolved issue is economic conversion speed, not the absence of plausible customers.'
