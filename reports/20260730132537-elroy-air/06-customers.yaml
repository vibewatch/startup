  evidenceGaps:
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: No public lane-level cost and margin disclosure.
    whyItMatters: Without lane economics, it is hard to separate narrative demand from profitable deployment.
    diligencePath: Request route-level pricing, utilization, and support-cost evidence.
    relatedQuestionRefs:
    - QU022
    - QU023
    - QU024
    - QU025
  - type: missing-source
    severity: material
    topic: contract-quality TU001
    missingEvidence: Public sources do not disclose deposit schedules, cancellation terms, or support obligations for named counterparties.
    whyItMatters: Revenue timing and cash-conversion quality depend on contract structure, not just logos.
    diligencePath: Obtain customer contract summaries or management disclosure on milestone payments.
    relatedTableRefs:
    - TU001
  - type: missing-source
    severity: moderate
    topic: operational-metrics
    missingEvidence: No public dispatch reliability, maintenance burden, or availability statistics were found.
    whyItMatters: Operational proof is essential for aircraft commercialization confidence.
    diligencePath: Seek fleet-test metrics, sortie counts, and uptime statistics from management or program partners.
