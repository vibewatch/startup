- id: disclosure-gaps-and-pipeline-quality
  title: Disclosure gaps and pipeline quality
  body: The main diligence challenge is separating management pipeline language from economic conversion. Public materials cite a demand pipeline of more than 1,400 aircraft and over $5 billion in potential revenue opportunity, but the same transaction disclosures caution that those expressions are largely non-binding letters of intent and memorandums of understanding. That distinction is central to financial analysis. A pipeline can support fundraising and supplier confidence, yet it is not equivalent to booked revenue, cash receipts, or even firm backlog. The public evidence suggests Elroy has enough counterparties to make the opportunity credible, but not enough disclosure to model timing, pricing, deposits, cancellation rights, margin structure, or support obligations. In practical terms, investors should assume the next phase of value creation depends on converting a story about demand density into measurable contracted production slots, program revenue, and eventually recurring software
    or services streams that management references but has not numerically broken out.  Investors should also note that aerospace hardware businesses often absorb cash in batches around tooling, supplier qualification, inventory, and field support before revenue recognition catches up. That dynamic makes apparent capital adequacy very sensitive to schedule slip. A modest delay in certification, customer acceptance, or production readiness can convert a seemingly well-funded plan into a bridge-financing story quickly, especially in a market that now discounts optimistic SPAC projections more aggressively than it did earlier in the cycle.
  claimRefs:
  - CI011
