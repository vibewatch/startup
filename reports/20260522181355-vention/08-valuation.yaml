  description: Range chart showing the implied Vention enterprise value at exit for bull, base, and bear scenarios across a 3–5 year hold period, all expressed in USD millions. The base case ($1.6–$2.5B) represents the probability-weighted central outcome given current evidence. The bull case ($3.6–$6.0B) requires software-mix expansion and platform premium. The bear case ($480M–$900M) implies limited returns on the implied current valuation.
