  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: post-money valuation
    missingEvidence: No disclosed post-money Series D valuation, no cap table, and no preference stack data is publicly available in any jurisdiction.
    whyItMatters: Valuation stance cannot be assessed without knowing the entry price; all return modeling rests on inferred dilution assumptions that may be materially wrong.
    diligencePath: Request Series D term sheet summary including pre-money valuation, option pool, preference terms, anti-dilution provisions, and full capitalization table.
    relatedQuestionRefs:
    - QV001
    - QV025
    relatedTableRefs:
    - TV001
  - type: private-evidence-only
    severity: blocking
    topic: audited financials and gross margin
    missingEvidence: No audited revenue by stream, gross margin, EBITDA, cash position, or burn rate is accessible publicly.
    whyItMatters: Revenue quality, margin trajectory, and runway cannot be independently underwritten; bull/base/bear cases rest on inferred assumptions rather than confirmed economics.
    diligencePath: Request audited or reviewed financial statements for FY2023–FY2025, monthly management accounts, and gross margin bridge by revenue segment.
    relatedQuestionRefs:
    - QV020
    - QV022
    - QV023
    relatedTableRefs:
    - TV001
    - TV003
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: net revenue retention
    missingEvidence: No NRR, GRR, or cohort retention data is publicly available; platform standardization thesis is unverified.
    whyItMatters: Bull case requires >110% NRR; bear case is triggered below 90%; without this metric, scenario probabilities are poorly calibrated.
    diligencePath: Request trailing-4-quarter NRR and GRR cohort data by customer segment (enterprise, mid-market, SMB) and by revenue type (subscription, hardware, services).
    relatedQuestionRefs:
    - QV021
    relatedTableRefs:
    - TV003
    - TV005
  - type: private-evidence-only
    severity: material
    topic: credit facility terms
    missingEvidence: The credit facility mentioned by BetaKit has no publicly disclosed lender, size, interest rate, or covenant package.
    whyItMatters: Financial covenants could restrict operating flexibility or trigger accelerated repayment if performance targets are missed; credit facility holders hold structural seniority over equity investors.
    diligencePath: Request full credit facility agreement including borrowing-base mechanics, covenant definitions, maintenance tests, cure provisions, and cross-default clauses.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: EU AI Act conformity assessment
    missingEvidence: No public evidence of conformity assessment, notified-body engagement, or compliance roadmap for GRIIP and Rapid OperatorAI as high-risk AI systems under the EU AI Act.
    whyItMatters: EMEA expansion — a stated use of Series D proceeds — depends on EU AI Act compliance; non-compliance blocks AI-product sales in EU and could require costly retroactive assessment.
    diligencePath: Request EU AI Act compliance roadmap, any in-progress conformity assessment documentation, legal opinion on high-risk classification, and CE marking status for GRIIP and Rapid OperatorAI.
    relatedQuestionRefs:
    - QV007
    relatedTableRefs:
    - TV005
    - TV006

