    - ISO 27001 certified; EN ISO 13849-1 PL e safety; no public regulatory enforcement; German GmbH entity for EMEA scale
    - EU AI Act high-risk classification for GRIIP and Rapid OperatorAI not addressed publicly; OT/ICS cybersecurity inherent in cloud-connected factory architecture
    - Medium — certifications confirmed; EU AI Act conformity gap is material and unresolved
