callouts:
- calloutType: assumption
  title: Valuation is inferred, not confirmed
  body: Vention has not publicly disclosed its post-money Series D valuation in any accessible jurisdiction. All enterprise value figures in this chapter are derived from dilution-assumption modeling on the $110M USD raise and cross-checked against public comparable multiples. They should not be treated as confirmed market prices.
  claimRefs:
  - CV014
  - CV015
  - CV016
- calloutType: risk
  title: Financial opacity is the primary underwriting blocker
  body: No audited revenue, gross margin, NRR, burn rate, or cap table data is publicly available. The run-rate claim from BetaKit and company-provided traction metrics provide directional signal but are insufficient to underwrite return expectations without private diligence.
  claimRefs:
  - CV019
  - CV020
  - CV021
  - CV022
- calloutType: strength
  title: Physical-AI timing and capital position support the bull case
  body: The January 2026 Series D, NVIDIA''s NVentures participation, and the IFR World Robotics 2025 data on global robot installations collectively support the thesis that Vention is well-positioned at the intersection of the reshoring wave and the physical-AI adoption cycle.
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007

