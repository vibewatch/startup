- id: bull-base-bear-scenarios
  title: Bull, base, and bear cases with explicit assumptions and downside triggers
  body: 'The bull case rests on five assumptions: (1) Vention''s physical-AI platform becomes the default standard for enterprise Advanced Manufacturing Teams globally, not just in North America; (2) software subscription attach rates grow so that software-derived gross profit approaches or exceeds 40% of total revenue by 2028; (3) EMEA revenue scales as planned, reducing the 70% US concentration and expanding the total addressable footprint; (4) the platform retains and expands within existing enterprise accounts at NRR of 110%+ as multi-site deployments compound; and (5) the global robotics market continues its institutional growth trajectory, with IFR data confirming installations have doubled over the prior decade and Roland Berger forecasting up to 9% CAGR through 2030. Under the bull case, Vention reaches $300–$400M USD in revenue by 2028–2029 with software mix providing premium margins, and exits at 12–15x revenue through an IPO or strategic acquisition, yielding a $3.6–$6B enterprise value and strong returns for Series D investors. The base case assumes: (1) revenue continues growing but hardware remains the dominant mix, holding blended gross margin in the 30–45% range rather than a software-tier 60%+; (2) EMEA ramp delivers incremental but not breakout scale; (3) net retention is healthy (100–110%) but platform switching costs moderate competitive moat; and (4) Vention reaches $200–$250M USD run-rate by 2028 and an exit at 8–10x revenue, yielding $1.6–$2.5B enterprise value. The bear case assumes: (1) industrial automation capex contracts in 2026–2027 due to US macro weakness or tariff disruption; (2) hardware margin pressure intensifies as component costs rise and Symbotic/Rockwell/Siemens push adjacent AI-automation offerings; (3) software subscription attach rates stagnate below 20% of revenue; (4) EU AI Act compliance delays EMEA expansion and increases R&D cost; (5) NRR falls below 90% as enterprise customers rationalize automation vendors; and revenue growth decelerates to single digits. Under the bear case, Vention reaches $120–$150M USD revenue by 2028 and exits at 4–6x, yielding $480–$900M, offering limited returns on the implied $750M+ current valuation. The probability-weighted outcome across all three cases is directionally positive for patient capital with a long horizon but uncertain for near-term liquidity events.'
