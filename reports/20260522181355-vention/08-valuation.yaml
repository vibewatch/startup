- id: exit-readiness-and-diligence-asks
  title: Exit readiness, thesis-break triggers, and final diligence asks
  body: 'Vention''s exit readiness as of mid-2026 is below IPO-readiness threshold on public evidence. The company has no registered securities, no published S-1 or F-1, no audited financial statements accessible publicly, and no disclosed revenue mix, gross margin, or burn rate. That does not mean an IPO is years away — growth-stage platforms frequently compress the timeline from $100M run-rate to public offering — but the public evidence does not support underwriting a near-term liquidity event. Strategic M&A is a more plausible near-term exit path: Rockwell, Siemens, ABB, FANUC, and potentially NVIDIA or a large cloud infrastructure player all have strategic rationale for acquiring a full-stack automation platform that accelerates their physical-AI positioning. NVIDIA''s participation in the Series D through NVentures creates a strategic relationship that could presage a deeper commercial or acquisition dialogue. For institutional investors evaluating a new secondary or primary position, the following diligence asks are binding: (1) audited or reviewed financial statements for fiscal 2023, 2024, and 2025 showing revenue by stream, gross margin, and EBITDA; (2) cap table showing preference stack, option pool, and fully diluted ownership by investor class; (3) NRR, GRR, and churn data for the subscription and service components for the trailing four quarters; (4) top-10 customer revenue concentration and contract terms including renewal dates and multi-site commitments; (5) Series D credit facility terms, financial covenants, and maintenance tests; and (6) the EU AI Act compliance roadmap for GRIIP and Rapid OperatorAI. Thesis-break triggers on the monitoring side include: any disclosed revenue growth deceleration below 20% YoY, any disclosed NRR below 90%, any CISA advisory or documented OT/ICS security incident involving MachineCloud, any EU regulatory enforcement action blocking GRIIP deployment, or a down-round financing event. Until these gaps close, the public-evidence investment stance is track with low confidence. The valuation stance is unknown because price discovery requires private diligence on the preference overhang and revenue quality.'
