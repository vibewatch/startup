    - Revenue mix undisclosed; concentration risk from named logos; NRR and churn not public; hardware may dominate recurring share
    - Medium — run-rate from BetaKit, corroborated by PRNewswire; mix and stickiness unconfirmed
  - - Financial health
    - $110M USD Series D from institutional investors; total $263M+ USD raised; fresh capital for 2+ years runway
    - No audited financials, no gross margin, no burn rate publicly disclosed; credit facility terms unknown; significant preference overhang
    - Medium — capital raise confirmed; burn and runway cannot be independently underwritten
  - - Competition
    - Only AI-powered full-stack platform unifying hardware, software, and physical AI; NVIDIA strategic investor creates differentiation signal
    - Rockwell ($50.3B market cap), Siemens, ABB, FANUC all adding AI layers; no barriers to incumbents bundling similar functionality
