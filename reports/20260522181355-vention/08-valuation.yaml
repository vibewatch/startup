  - - Product and platform
    - Full-stack AI-automation platform with Zero-Shot Automation™; 25,000+ machines; design-once-deploy-everywhere for enterprise AMTs
    - Physical-AI reliability unproven at scale; no independent uptime or accuracy benchmarks publicly available; integration-heavy deployments persist
