- id: sales-efficiency-and-unit-economics
  title: Sales efficiency proxies, deployment-speed economics, and margin drivers
  body: 'Vention’s public sales-efficiency story is built on customer-value proxies rather than disclosed CAC or payback cohorts. The strongest public numbers come from Vention-backed research and case-writeups: a 1.3-year average payback claim, 3–8x faster deployment, and 4.7x ROI on the platform. Those claims are directionally helpful because they fit the broader narrative that fragmented automation burns time and budget in design, integration, and commissioning. The hidden-costs essay makes that argument explicitly, citing 28-to-60-week traditional project timelines and shorter case examples once design, programming, procurement, and deployment are linked inside one software-defined workflow. But that same evidence base is also the core diligence problem. Most unit-economics data is company-authored and framed as outcome marketing rather than independently audited cohort economics. The result is that Vention appears to have a compelling sales narrative built around faster quoting, easier
    deployment, and lower integration friction, yet the public record still cannot answer what portion of those gains lands as gross margin, services utilization, or recurring software revenue. Peer filings reinforce why that distinction matters: software-heavy mix can be structurally more profitable than service-heavy mix, and hybrid automation vendors often have to balance both.'
