- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  - Current public substitute
  rows:
  - - Cash balance, monthly burn, runway months
    - Cannot size financing dependency or next-round trigger precisely
    - Request latest management accounts, cash waterfall, and board liquidity plan
    - 2026 raise size plus run-rate claim only
  - - Revenue mix across hardware, software, services, partner commerce
    - Cannot test recurring-quality or gross-profit durability
    - Request revenue bridge and margin by stream for trailing 8 quarters
    - Workflow evidence shows multiple streams, not their mix
  - - Gross margin and services utilization
    - Cannot decide whether growth improves or dilutes economics
    - Request blended and segment gross margin plus implementation labor utilization
    - Rockwell/Symbotic peers used only as analogs
  - - CAC, sales-cycle, win-rate, payback by segment
    - Cannot validate efficiency of enterprise standardization GTM
    - Request CRM funnel snapshots, cohort CAC, and close-rate by segment
    - Company-authored ROI and speed case studies only
  - - Debt / credit facility terms and covenants
    - Cannot model downside or lender constraints during slower growth
    - Request facility agreement, borrowing base, interest rate, and covenants
    - BetaKit mention of small credit facility
  - - Renewal, churn, NRR / GRR, and top-customer concentration
    - Cannot underwrite recurring durability or concentration risk
    - Request logo and dollar-retention by cohort plus top-10 customer exposure
    - Enterprise standardization claims and factory count only
  notes: Every null or unresolved finance field is translated into a concrete diligence request rather than backfilled with a guess.
