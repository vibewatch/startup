tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Current value / status
  - Revenue-recognition implication
  - Quality / diligence ask
  rows:
  - - Marketplace hardware and components
    - Direct product sale through marketplace and project BOM checkout
    - Publicly active; 2,200+ components, 25 categories
    - Mostly point-in-time product revenue
    - Need realized hardware margin and partner-vs-proprietary mix
  - - Partner-certified components
    - Curated third-party parts certified for compatibility
    - 40 certified partners; 200+ partner products in 2025 press release
    - Likely transactional product or ecosystem take-rate economics
    - Need partner terms, take-rate, and inventory ownership
  - - Software subscriptions
    - Subscription services and support tied to Vention platform accounts
    - Active; enterprise package and renewal terms published, but no list price visible
    - Recurring over contract term where hosted/support services are delivered
    - Need price ladder, attach rate, churn, and ARR by cohort
  - - Application engineering / deployment support
    - Discovery sessions, digital twin assistance, assembly or turnkey delivery
    - Publicly offered; pricing not published
    - Mix of service revenue and support bundle
    - Need services utilization, gross margin, and attach rate to hardware deals
  - - Pre-engineered applications / workcells
    - Turnkey or customizable applications sold through platform workflow
    - Active, but public list prices not published for Vention packages
    - Hybrid of product, software, and service content
    - Need ASP, discounting, and proportion of turnkey versus modular orders
  notes: Rows separate revenue mechanisms from disclosed prices. Vention exposes workflow and component pricing cues publicly, but not realized mix or gross margin.
