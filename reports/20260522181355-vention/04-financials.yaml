- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer / benchmark
  - Price / contract model
  - List vs realized
  - Implication
  - Source / diligence gap
  rows:
  - - Vention software subscriptions
    - Custom package; start designing for free; enterprise sold via contact
    - List structure visible, realized price undisclosed
    - Suggests recurring software/support layer but opaque ARPU
    - Subscriptions page and terms show packaging, not actual spend
  - - Vention subscription contract
    - Two-year initial term, annual renewals, fees can rise with notice
    - Contract mechanics public; pricing amounts absent
    - Supports durability but also potential renewal friction
    - Need annual contract value and logo-retention data
  - - Vention design-to-order workflow
    - Real-time BOM pricing before checkout; secure pay after design/simulation
    - BOM list pricing visible during build, system discounts unknown
    - Reduces presales friction and helps ROI conversations
    - Need data on conversion from quote to order
  - - Vention marketplace logistics
    - Transparent pricing and shipping times; 95% ship within two weeks
    - Operational transparency, not realized margin
    - Fast ship times can support cash conversion and buyer trust
    - Need inventory turns and partner-stock model
  - - Hirebotics turnkey anchor
    - $100k–$140k starting prices plus optional subscriptions / financing
    - Public list price
    - Benchmark shows what productized cell economics can look like in the market
    - Comparable only for narrow use cases
  - - Tulip software anchor
    - $100/interface/mo Essentials; $250/mo Professional; Enterprise by quote
    - Public list price
    - Benchmark shows software-only manufacturing stack monetization is far below integrated-cell pricing
    - Not directly comparable to Vention hardware-attached deals
  notes: This table mixes Vention list/contract signals with external pricing anchors. It does not infer realized Vention ASPs or discounts.
