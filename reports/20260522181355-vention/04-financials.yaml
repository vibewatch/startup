- id: financial-verdict-and-gaps
  title: Financial verdict, revenue quality, and diligence blockers
  body: 'The underwriting conclusion is mixed but usable. Vention clearly has multiple monetization layers, enterprise-standardization momentum, and enough recent capital to keep investing through its next product cycle. Those are real positives. At the same time, nearly every finance-critical variable that an investor would need for conviction remains private: revenue mix, gross margin, software attach rate, services utilization, CAC, renewal behavior, cash balance, burn, and working-capital intensity. Public evidence therefore supports a view of Vention as a promising but still partially opaque industrial software-and-hardware platform. Revenue quality looks better than a project-only integrator because the workflow includes subscriptions, support, and a reusable marketplace ecosystem; however, public disclosures do not show how much of revenue is truly recurring versus transactional. Capital intensity also looks manageable only in relative terms. The fresh 2026 raise and run-rate claim
    argue against near-term stress, yet they do not clear the bar for precise runway or next-round timing. The investable takeaway is to treat Vention as financeable on momentum, but not fully underwritten on economics until private diligence closes the gaps below.'
