callouts:
- calloutType: strength
  title: Full-stack platform positioning is unusually coherent
  body: Vention does not market a single robot or controller in isolation; it markets a cloud workflow spanning design, programming, deployment, and operation, which strengthens switching costs and makes later product launches easier to monetize.
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO007
- calloutType: strength
  title: Enterprise standardization is the most important scale signal
  body: The strongest company-overview evidence is not a raw machine count alone but the claim that enterprise customers use Vention as a common automation standard across plants and geographies.
  claimRefs:
  - CO038
  - CO039
  - CO043
  - CO044
