  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A disclosed post-money valuation for the January 2026 Series D round is still absent from fetched public sources.
    whyItMatters: The exact post-money sets the entry multiple, dilution math, and later valuation sensitivity anchors.
    diligencePath: Request the Series D term sheet or cap-table summary from management or an investor with information rights.
    relatedQuestionRefs:
    - QO021
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, EBITDA, and cash-flow statements are not publicly disclosed.
    whyItMatters: Without audited financials, chapter-one scale metrics rely on press and database summaries rather than investor-grade statements.
    diligencePath: Obtain board materials or annual budget/actuals showing revenue, gross margin, burn, and cash balance.
    relatedQuestionRefs:
    - QO022
  - type: missing-source
    severity: material
    topic: series-d-structure
    missingEvidence: The size, lender identity, pricing, covenant package, and maturity of the 2026 credit facility are not public.
    whyItMatters: Debt terms affect runway, downside recoveries, and whether equity capital was sufficient on its own.
    diligencePath: Ask finance leadership for credit agreements or a lender-side summary of the facility booked alongside Series D.
    relatedQuestionRefs:
    - QO023
  - type: missing-source
    severity: minor
    topic: governance-rights
    missingEvidence: Public sources show board names but not committee structure, observer rights, or investor consent provisions.
    whyItMatters: Control rights determine how much autonomy founders retain and how protective preferred holders are in a downside case.
    diligencePath: Review shareholder agreements, board committee charters, and investor rights letters from major financing rounds.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: minor
    topic: total-funding
    missingEvidence: Public sources mix USD and CAD totals, producing reported cumulative funding figures of about $260M, $263M, and more than C$300M.
    whyItMatters: The report should use one canonical capital-total convention to avoid misleading cross-chapter valuation math.
    diligencePath: Reconcile each round’s closing amount and currency in a cap-table schedule, then standardize all later chapters to USD.
    relatedQuestionRefs:
    - QO009
    - QO024
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: minor
    topic: series-c-ii
    missingEvidence: The accessible public databases reveal a 2023 late-stage round but do not expose its amount or instrument details.
    whyItMatters: The undisclosed 2023 tranche affects cumulative funding, preference overhang, and valuation trend interpretation.
    diligencePath: Request round-closing notices from Vention or shareholders, or review confidential database exports with full funding fields.
    relatedQuestionRefs:
    - QO008
    - QO009
    - QO024
    relatedTableRefs:
    - TO003
