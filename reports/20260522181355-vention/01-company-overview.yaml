- id: milestones-scale-and-open-risks
  title: Milestones, Scale Signals, and Early Adverse Evidence
  body: 'The milestone record suggests Vention has executed with unusual cadence for an industrial platform company. Its About timeline shows repeated annual product and company milestones from MachineBuilder and Universal Robots certification in 2017 through MachineMotion AI in 2024 and Rapid OperatorAI in 2026. The company also paired financing events with platform expansion, office growth, and infrastructure buildout such as the Montréal distribution center and the Berlin headquarters. Commercial scale signals improved in step changes: the Series B announcement cited more than 1,000 factories in 2020, the Series C announcement cited 3,000-plus clients on five continents in 2022, and the current platform claims show more than 4,000 factories and 25,000 machines. BetaKit adds that Vention crossed a C$100 million annual run rate in late 2025 and had roughly 330 employees by the January 2026 round, while Tracxn later listed 355 employees. The most important chapter-one adverse evidence is
    not a company-specific scandal but a market-friction signal: the Vention and Industry Week automation survey reported that only 37% of manufacturers had significant or full automation in place, with technology choice, internal expertise, and budget overruns still blocking adoption. That means Vention’s growth is real, but it still depends on solving a market problem that remains stubbornly hard for manufacturers in practice.'
