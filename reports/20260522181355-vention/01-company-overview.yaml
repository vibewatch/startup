- id: leadership-and-governance
  title: Founders, Leadership Depth, and Governance Visibility
  body: Leadership disclosure is stronger than many private industrial companies, but governance rights remain only partially visible. Etienne Lacroix is clearly the public face of Vention as founder and CEO, and his background at GE and McKinsey, plus formal engineering and MBA training, gives him strong founder-market fit for a platform aimed at manufacturing transformation. Co-founder Max Windisch remains active in 2026 as Chief Science Officer, giving continuity from the original product architecture into the current physical-AI push. The company now shows a broader executive bench as well, including CTO François Giguère, CFO Rob Lorbetskie, and CRO Joe Wykes. Public legal disclosures for Vention GmbH also show Lacroix, Wykes, and Lorbetskie as the Berlin board of management, which supports the idea that the commercial and financial functions are already internationalized. Third-party databases add a five-person board list that includes Ajay Agarwal, Jean-François Marcoux, Emily Walsh,
    Lacroix, and Windisch, but those sources do not expose board committees, reserved matters, or investor protective rights. The practical takeaway is that operational leadership is reasonably visible, while formal governance remains only partly disclosed.
  claimRefs:
