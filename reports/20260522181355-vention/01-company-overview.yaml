company:
  name: Vention
chapter:
  number: 1
  title: Company Overview
  summary: Vention is a Montréal-based industrial automation platform company founded in 2016 that combines AI-powered software, modular hardware, and physical-AI workflows to help manufacturers design and deploy automated equipment in days instead of months. Public sources support strong operating momentum—25,000+ machines across 4,000+ factories, a January 2026 $110M Series D, and a late-2025 C$100M run-rate claim—while exact valuation, debt terms, and audited financials remain private.
sections:
- id: identity-and-platform
  title: Identity, Product, and Operating Footprint
  body: 'Vention is a Montréal-based industrial automation company founded in 2016 that now operates through North American and European headquarters in Montréal and Berlin. Across its homepage, About page, and Series D materials, the company consistently frames itself as an AI-powered full-stack automation platform rather than a narrow robot OEM: customers can design, program, deploy, and operate automated equipment and robot cells inside a single cloud workflow. The core value proposition is time compression. Vention says manufacturers can move from concept to deployment in days instead of months, aided by MachineBuilder for AI-assisted CAD, MachineLogic for robot and machine programming, and MachineCloud for deployment and ongoing support. The current public footprint is meaningful: Vention says it has more than 25,000 machines in the field, more than 4,000 factories on the platform, and coverage across more than 25 manufacturing industries. Those headline metrics, together with the Berlin
    entity disclosures and the 2026 funding push into EMEA, establish Vention as a cross-border growth-stage platform company with both software and physical automation exposure rather than a single-site systems integrator.'
  claimRefs:
