- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - EU AI Act non-compliance for physical-AI products
    - EU national market surveillance authority advisory or enforcement notice
    - Any official finding that GRIIP or Rapid OperatorAI must undergo conformity assessment
    - Pause EMEA AI-product sales pending remediation; revise thesis on EMEA expansion timeline and cost
  - - OT/ICS cybersecurity breach
    - CISA ICS advisory naming Vention products; public disclosure of factory incident
    - Any confirmed breach causing physical motion error or data exfiltration in a customer factory
    - Immediate thesis-break trigger; potential product liability, regulatory investigation, and customer churn cascade
  - - NVIDIA chip supply disruption
    - NVIDIA Jetson product discontinuation notice; US export control rule restricting Orin to China/Russia/etc.
    - Formal Jetson platform end-of-life announcement or export restriction applying to Vention’s hardware
    - Hardware product line pause; initiate alternative chip qualification; revise hardware roadmap timeline
  - - Series E down-round or financing failure
    - Public disclosure of new primary equity round at valuation below Series D implied valuation
    - Down-round with >30% valuation reduction; or public announcement of funding difficulty
    - Investigate revenue-quality and burn deterioration before further capital commitment
  - - CEO or CSO departure
    - Public leadership announcement without a named successor
    - CEO or co-founder CSO departure with no named successor in place
    - Reassess founder-dependency and succession-plan quality before investment
  - - EMEA revenue stagnation
    - Publicly stated revenue geography mix (if disclosed)
    - European share below 10% of ARR by end-2026, absent explicit strategic decision to delay
    - Signal of EMEA execution risk or regulatory friction; revisit EMEA expansion thesis
  - - US industrial capex contraction
    - US manufacturing PMI below 48 for three consecutive months; US tariff escalation on Canadian automation goods
    - US-Canada tariff rate on automation hardware exceeding 10%; PMI sustained contraction
    - Reduce growth assumptions; stress-test customer renewal pipeline
  - - Physical-AI safety incident
    - Customer press coverage or safety regulator investigation referencing Vention equipment
    - Any reported worker injury or property damage in a Vention-equipped factory attributed to AI-controlled motion
    - Immediate thesis-break trigger; liability, regulatory, and reputational cascade
  notes: 'Kill criteria are defined for portfolio monitoring. Thesis-break events require immediate reassessment but do not automatically preclude further investment without additional evidence.'
