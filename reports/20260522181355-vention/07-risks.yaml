- id: people-and-execution-risk
  title: People, execution, and governance risk
  body: 'Vention’s leadership bench is stronger than many growth-stage industrial companies, but retains founder concentration and key-person risk. CEO Etienne Lacroix is the external face, strategic narrator, and primary investor-relations voice; a departure or incapacity would create significant transition risk. Co-founder Max Windisch, now in the CSO role, anchors the core scientific and physical-AI differentiation; his involvement since founding gives continuity but also concentrates AI-model expertise. The executive team has been expanded with a CFO (Rob Lorbetskie, former Shopify VP Finance), CTO (François Giguère), CRO (Joe Wykes), and CPO (Brendan), but the team’s collective tenure at Vention and team cohesion under scaling stress are not independently verifiable from public sources. Talent risk is structurally elevated in AI-robotics: the global competition for engineers who can develop physical-AI models, embedded software, and modular industrial hardware is intense, and Vention competes with NVIDIA, Boston Dynamics, Rockwell, and a growing cohort of physical-AI startups. The Montréal tech market provides access to strong engineering talent from Polytechnique and McGill, but salary competition from US-headquartered firms is real. Vention’s career page shows active recruiting across software, hardware, and AI roles, suggesting ongoing growth headcount needs. Indeed reviews from prior chapter research provide a mixed signal — small sample size limits reliability, but cultural and management feedback was not unanimously positive. Board governance is only partially visible: five board members are disclosed in third-party databases (Lacroix, Windisch, Ajay Agarwal, Jean-François Marcoux, Emily Walsh), but investor protective rights, board composition requirements, drag-along provisions, and preferred liquidation terms are not public. The Vention GmbH impressum confirms Lacroix, Wykes, and Lorbetskie as the German legal management, suggesting key executive overlap across entities but also that the EMEA entity currently relies on Canadian leadership rather than dedicated regional management.'
