companyProfile:
  summary: >
    Vention is a Montréal-based industrial automation company founded in 2016 by Étienne Lacroix and Max Windisch.
    The company combines cloud design software, code-capable programming, modular hardware, deployment tooling, and
    newer physical-AI products to help manufacturers design, program, deploy, and operate custom or turnkey
    automation systems in days instead of months. Public evidence supports meaningful operating momentum — more than
    25,000 machines across 4,000+ factories, a late-2025 C$100M run-rate claim, and a January 2026 $110M USD Series
    D — but detailed disclosure on revenue mix, gross margin, retention, cash, burn, and the preference stack
    remains private.
  foundedDate: "2016-01-01"
  founders:
    - name: "Étienne Lacroix"
      role: "Founder & CEO"
      background: "Former GE and McKinsey operator with Harvard MBA and mechanical engineering training from ÉTS Montréal."
      claimRefs: [CO008, CO009]
    - name: "Max Windisch"
      role: "Co-Founder & Chief Science Officer"
      claimRefs: [CO010]
  foundingLocation: "Montréal, QC, Canada"
  headquarters: "Montréal, QC, Canada"
  productSummary: >
    Full-stack industrial automation platform spanning MachineBuilder design software, MachineLogic programming,
    MachineCloud deployment and support, MachineMotion AI controllers, pre-engineered applications, and newer
    physical-AI workflows such as AI Operator.
  customerFocus: >
    Manufacturers ranging from SMEs to enterprise advanced-manufacturing teams across fulfillment, apparel,
    packaging, woodworking, industrial production, logistics, and specialized process manufacturing.
  businessModel: >
    Hybrid hardware/software/services model selling modular automation components, partner-certified marketplace
    products, software subscriptions and support, deployment services, and pre-engineered or custom automation cells.
  stage: "Series D / late-stage private"
  fundingStatus: >
    Raised $110M USD ($150M CAD) in a January 2026 Series D after reaching a reported late-2025 C$100M annual
    run-rate; cumulative funding is publicly framed at roughly $263M+ USD / more than C$300M including facility
    framing depending on source normalization.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO005, CO035, CO039, CO040, CV004, CV015]
