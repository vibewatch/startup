  - FE002
- id: architecture-and-developer-surface
  title: Architecture, SDKs, CLI, and developer surface
  body: 'The strongest product-technology differentiator in the public record is how much Vention exposes about its architecture and developer workflow. MachineMotion AI is documented as a Linux-based controller with NVIDIA compute, EtherCAT motor support, camera support, LTE and Ethernet networking, and compatibility with Python, G-code, and MachineLogic interfaces. The Developer Toolkit then adds a software layer on top of that hardware: a state-machine framework, Python-defined data models that generate databases and REST APIs, React-based operator interfaces, a CLI, and a MachineLogic SDK. The public Python SDK repository goes beyond a brochure. It shows that developers can run applications on the controller or from an external computer, install dependencies, connect over network interfaces, and issue low-level motion commands. Combined with a public GitHub organization, docs root, and careers page, the evidence suggests Vention is intentionally opening the platform to more technical
    teams. The caveat is ecosystem depth. The presence of SDKs, GitHub repos, and a forum is a positive signal, but it does not yet look like a deeply externalized developer ecosystem on the scale of mature software platforms.'
  claimRefs:
