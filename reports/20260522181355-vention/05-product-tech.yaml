chapter:
  number: 5
  title: Product & Technology
  summary: Vention’s product stack now spans cloud design, code-capable programming, AI-ready edge control, deployment tooling, and a newly visible developer toolkit. Public documentation and external coverage make the architecture unusually legible for a private industrial automation company, but reliability telemetry, API maturity, and independently verified AI-operator performance remain materially under-disclosed.
sections:
- id: product-scope-and-modules
  title: Product scope, modules, and workflow jobs
  body: 'Vention’s product surface is unusually broad for an industrial automation startup. Public materials show a full-stack workflow rather than a narrow component sale: MachineBuilder handles design, MachineLogic handles programming, MachineCloud handles deployment and support, and MachineMotion AI anchors the edge-controller layer that powers physical execution. Around that core, Vention now positions AI Operator for unstructured tasks such as bin picking, plus customer-facing turnkey applications in palletizing, welding, machine tending, and related jobs. The important analytical point is that the product is not just a catalog of hardware. It is a software-defined automation workflow in which cloud design, simulation, control, and operations are tightly linked. That matters because it changes what buyers are actually purchasing: not only a robot cell or controller, but a standardized way to model, deploy, and reuse automation across sites. Public docs and Demo Day materials are strong
    on module definition and workflow logic, and significantly better than average for a private industrial company, though still incomplete on hard performance metrics such as uptime, version stability, and large-fleet reliability.'
  claimRefs:
  - CE001
  - CE002
  - CE007
  - CE017
  - CE018
  - CE034
  tableRefs:
  - TE001
  - TE002
  figureRefs:
