- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Vention solution
  - Measurable benefit
  - Limitation
  rows:
  - - Design a robot cell
    - Browser CAD plus digital twin
    - MachineBuilder
    - Faster design handoff into programming and procurement
    - No public data on design-to-order conversion
  - - Program machine logic
    - Code or low-code logic authoring
    - MachineLogic + MachineLogic SDK
    - Keeps logic inside same stack as design and deploy
    - Need public change-management/versioning detail
  - - Deploy and support a machine
    - Cloud-assisted deployment and remote support
    - MachineCloud + MachineMotion AI
    - Remote updates and connected troubleshooting
    - No public uptime dashboard found
  - - Build custom machine apps
    - Local/cloud development with generated APIs and HMIs
    - Developer Toolkit + CLI + Digital Twin
    - Shorter path from idea to testable app
    - External developer adoption still looks early
  - - Run unstructured bin-picking
    - AI-driven perception and motion on edge controller
    - AI Operator / Rapid Operator AI
    - Targets tasks that previously required higher engineering effort
    - Independent production benchmarks remain limited
  - - Standardize factory jobs
    - Reusable workflows across palletizing, welding, machine tending
    - Integrated platform + customer stories
    - Supports reuse across common industrial jobs
    - Breadth is clear, quantified depth by module is not
  notes: Benefits are evidence-backed but mostly company-authored; limitations preserve where proof remains thin.
