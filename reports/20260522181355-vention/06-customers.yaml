- id: durability-expansion-and-concentration
  title: Durability, expansion motion, and concentration limits
  body: 'Public durability evidence exists, but it is qualitative. The Feed explicitly says it would return as a future customer. McAlpine moved from automated case packing into a follow-on AI bin-picking collaboration. Solestial’s story frames Vention as a continuing manufacturing partner as it scales from a one-megawatt to a ten-megawatt site. Financing coverage also describes enterprise customers adopting Vention as the standard setter across plants, which supports a land-and-expand narrative. Those are meaningful positives. The negative is that none of them substitute for real retention metrics. No public NRR, GRR, churn, renewal, contract length, or top-customer exposure data appears in the reviewed sources. That leaves investors unable to tell whether named stories are representative of the revenue base or just the best public references. It also leaves channel and partner dependence only partly visible: customer deployments clearly depend on hardware ecosystems and, in some cases,
    partner brands, but public sources do not quantify how much revenue rides through those relationships. The customer chapter therefore ends with strong proof of usefulness, moderate proof of repeat trust, and weak proof of portfolio durability.'
  claimRefs:
  - CU006
  - CU016
  - CU021
  - CU029
  - CU030
  - CU034
