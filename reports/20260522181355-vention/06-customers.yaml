- id: adverse-signals-and-verdict
  title: Adverse signals, proof quality limits, and final verdict
  body: 'The most important adverse signal is not a public customer revolt; it is the gap between vivid case studies and absent portfolio metrics. The official stories are persuasive, but they are still authored or amplified by Vention. External mirrors and trade coverage help, yet most of them repeat the same underlying customer narratives rather than audit them. Meanwhile, broader survey evidence says manufacturers still struggle to automate at scale because of technology selection, expertise gaps, and budget overruns. That matters because even a well-liked platform can face slower expansion if customers remain structurally underprepared. Another caution is that large logo references in funding coverage are not equivalent to the deeply documented named stories in this chapter. Without account-level revenue, concentration, or renewal data, investors cannot tell how representative the public references are. The final customer verdict is therefore positive but qualified: Vention has unusually
    vivid and cross-vertical named customer proof for a private automation company, but still needs private diligence to confirm whether those wins translate into durable, repeatable, and diversified customer economics.'
