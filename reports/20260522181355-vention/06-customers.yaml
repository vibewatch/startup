chapter:
  number: 6
  title: Customers
  summary: Vention has unusually vivid named customer proof for a private automation company, spanning fulfillment, apparel, packaging, woodworking, industrial manufacturing, and advanced solar production. The public record is strongest on deployment-specific outcomes and qualitative repeat trust, but still weak on retention, concentration, and independently audited customer economics.
sections:
- id: customer-segmentation-and-surface
  title: Customer segments, buyers, and the visible adoption surface
  body: 'Vention’s public customer record is strongest where it names specific manufacturers and shows what job they automated. Across the reviewed stories, the customer base spans e-commerce and fulfillment (The Feed), apparel manufacturing (Safari Sun), industrial seating (Sears Seating), plumbing and packaging (McAlpine), woodworking (Cripps & Sons), and space-solar production (Solestial). Those references imply Vention is selling into both SMEs and more advanced industrial operators, not one narrow robot-cell niche. The buyer and user map also looks varied. Some stories emphasize hands-on engineers and owner-operators who want to self-program or build internal capability, while others emphasize factory teams that want a partner to co-design and deploy a custom solution quickly. Public geography evidence remains thin but directionally useful: BetaKit reported a 70/20/10 customer split across the U.S., Europe, and Canada. More broadly, Vention continues to repeat platform-scale numbers—25,000
    machines, 4,000 factories, and 4,000-plus customers—but those aggregate claims are still weaker than the named story-level evidence because they do not reveal paying-account quality, contract size, or retention.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU026
  - CU027
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: named-customer-proof-and-outcomes
  title: Named customer proof and measurable outcomes
  body: 'The best part of Vention’s customer proof is that it often includes named operators and concrete outcomes rather than vague logo walls. The Feed’s story reports a six-week conveyor deployment, more than 5,000 orders per day, and 15 workers reallocated. Safari Sun’s story adds a different kind of proof: a custom gantry for 300-plus SKUs, a 10-minute training curve, and Python self-programming inside MachineLogic. Sears Seating reports 15-day deployment, 50% lower cost, 20% operating-cost reduction, and 15-month payback. McAlpine’s case is especially valuable because it has both an initial packaging-automation story and a later AI bin-picking follow-on, which suggests real repeat trust rather than a one-time marketing reference. Solestial adds throughput and speed evidence in a harder manufacturing domain, and Cripps & Sons adds quality and productivity gains in a different workflow. Collectively, these stories make the chapter’s central point clear: Vention’s customer proof is cross-vertical,
    named, and operationally specific. What is still missing is more independent verification and a cleaner separation between production-grade accounts and future-pipeline logos.'
