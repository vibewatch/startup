tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Vention
  rows:
  - - Factory automation and industrial controls
    - Controllers, field devices, robot cells, industrial software, and control architectures
    - Back-office SaaS, ERP-only tools, consumer devices
    - Plant operations, engineering, capex committees
    - Broadest ceiling for Vention’s category and partner ecosystem
  - - Industrial automation software
    - SCADA, MES, HMI, plant analytics, orchestration, cloud and on-prem control software
    - Pure IT tools unrelated to production execution
    - Manufacturing engineering, OT/IT, site leadership
    - Closest public proxy for the platform/software layer Vention monetizes
  - - Modular design and deployment workflow
    - Design CAD, simulation, program generation, controller configuration, support
    - Traditional disconnected CAD plus manual commissioning labor
    - Manufacturing engineers, advanced manufacturing teams
    - Most direct fit with Vention’s design-to-deploy value proposition
  - - Pre-engineered robot cells and turnkey applications
    - Palletizing, machine tending, sanding, inspection, labeling, material handling
    - Highly bespoke one-off integration projects with no reusable platform layer
    - Plant managers, operations leaders, procurement
    - Important wedge for first deployments and proof-of-value
  - - Physical AI for unstructured tasks
    - Perception, grasp planning, context-aware motion, AI-native controllers
    - General-purpose humanoid hype unrelated to current factory use cases
    - Innovation leads, robotics teams, enterprise pilots
    - Emerging differentiator that can expand Vention’s reachable workflows
  - - Status-quo substitutes
    - System integrators, proprietary vendor stacks, manual processes, legacy PLC/SCADA islands
    - N/A
    - Same buyers, but different economics and risk profiles
    - The real competitive baseline for adoption decisions
  notes: The table uses layered market definitions because analyst reports and buyer decisions do not share one common boundary; relevance rather than absolute category purity is the goal.
