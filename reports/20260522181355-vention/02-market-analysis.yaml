  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: Published market estimates differ because some sources measure broad factory automation and controls, while others isolate software or general industrial automation.
    whyItMatters: Later valuation work can overstate upside if it treats every broad estimate as the same addressable market.
    diligencePath: Anchor later chapters on one primary lens, then show transformed adjacencies explicitly rather than blending incompatible market categories.
    relatedQuestionRefs:
    - QM021
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: No public source isolates a precise Vention-specific SAM or SOM for North America and Europe using the company’s exact product boundary.
    whyItMatters: A precise SAM/SOM is required to tie penetration assumptions to sales capacity and later scenario valuation math.
    diligencePath: Build an internal bottoms-up model from target sites, deployment value per site, and attach rates by workflow rather than relying on generic analyst totals.
    relatedQuestionRefs:
    - QM022
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: budget-owner-patterns
    missingEvidence: Public sources discuss buyers and users directionally but do not expose broad procurement datasets that identify budget owners by workflow and company size.
    whyItMatters: Budget ownership determines whether Vention sells through plant operations, centralized manufacturing teams, integrators, or finance-led capex processes.
    diligencePath: Review win-loss notes, CRM opportunity data, and customer procurement documents to map actual buyer-user-payer patterns.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: minor
    topic: roi-realization
    missingEvidence: Public ROI examples are directional and marketing-oriented rather than cohort-level deployment economics across Vention’s installed base.
    whyItMatters: Without cohort economics, market accessibility can be overstated by assuming every buyer realizes the same payback window.
    diligencePath: Request anonymized deployment-level payback, cycle-time, and utilization data segmented by application and customer size.
    relatedQuestionRefs:
    - QM018
  - type: stale
    severity: minor
    topic: regional-outlook
    missingEvidence: Most hard robot-installation data is published for 2024 with forecasts into 2025-2028 rather than audited 2026 realized results.
    whyItMatters: Near-term market timing claims for 2026 rely on forward-looking association and consultant expectations rather than realized year-end data.
    diligencePath: Refresh the chapter once IFR publishes the next audited installation dataset and compare forecasts versus actuals.
    relatedQuestionRefs:
    - QM008
    - QM010
