- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Manufacturing labor shortages
    - Positive
    - Near term
    - Improves automation urgency, especially for SMMs and repetitive workflows
    - How many target buyers cite labor scarcity as the first purchase trigger?
  - - Energy-efficiency and net-zero mandates
    - Positive
    - Medium term
    - Supports software-centric upgrades, smart drives, and predictive optimization
    - Which Vention applications are strongest in energy-sensitive plants?
  - - Policy stimulus and smart-manufacturing funding
    - Positive
    - Medium term
    - Reduces adoption friction for pilots and modernization projects
    - Can Vention or partners tap public manufacturing programs directly?
  - - Standardized hardware plus software value-add
    - Positive
    - Medium term
    - Expands automation into smaller-batch production where Vention is strongest
    - How much of Vention’s installed base fits small-batch or high-mix use cases?
  - - AI adoption moving from pilot to scale
    - Positive
    - Near term
    - Improves receptivity to physical AI and AI-assisted programming
    - Do buyers accept AI-led commissioning in production-critical cells?
  - - High upfront capex
    - Negative
    - Near term
    - Still delays projects, especially for SMEs and brownfield retrofits
    - What financing or RaaS options materially improve win rates?
  - - Legacy integration complexity
    - Negative
    - Near term
    - Raises deployment risk and stretches payback timelines
    - What percentage of Vention projects replace vs. integrate old control systems?
  - - Cybersecurity and data-trust concerns
    - Negative
    - Near term
    - Creates extra approval steps for cloud and AI-heavy deployments
    - What cyber standards or audit artifacts are now table stakes?
  - - Skills scarcity
    - Negative
    - Near term
    - Can block adoption unless tools reduce the need for specialist programmers
    - How much training is required for operators after go-live?
  - - Contradictory market estimates
    - Negative
    - Current diligence issue
    - Can distort valuation if one inflated TAM is treated as reality
    - Which market lens should govern later pricing and share assumptions?
  notes: Direction and timing are analytical synthesis based on market reports, association data, and Vention’s own workflow framing; diligence asks should carry into later chapters.
