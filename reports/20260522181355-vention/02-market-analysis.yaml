callouts:
- calloutType: insight
  title: Use multiple lenses, not one TAM
  body: The market is large by any reasonable benchmark, but valuation work should not substitute a broad automation ceiling for Vention’s serviceable, software-centric deployment wedge.
  claimRefs:
  - CM003
  - CM007
  - CM017
- calloutType: strength
  title: Vention is aligned with the software-defined shift
  body: Roland Berger, Mordor, and WEF all point toward a market where software value, AI, and standardized hardware matter more over time—exactly the direction Vention’s product narrative is taking.
  claimRefs:
  - CM029
  - CM030
  - CM035
  - CM043
- calloutType: risk
  title: Interest is not the same as scalable deployment
  body: Robot shipments, AI optimism, and policy funding are strong, but capex discipline, integration burden, cyber review, and skills scarcity still slow adoption once projects leave the pilot stage.
  claimRefs:
  - CM016
  - CM020
