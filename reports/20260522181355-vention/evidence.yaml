  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A disclosed post-money valuation for the January 2026 Series D round is still absent from fetched public sources.
    whyItMatters: The exact post-money sets the entry multiple, dilution math, and later valuation sensitivity anchors.
    diligencePath: Request the Series D term sheet or cap-table summary from management or an investor with information rights.
    relatedQuestionRefs:
      - QO021
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, EBITDA, and cash-flow statements are not publicly disclosed.
    whyItMatters: >-
      Without audited financials, chapter-one scale metrics rely on press and database summaries rather than
      investor-grade statements.
    diligencePath: Obtain board materials or annual budget/actuals showing revenue, gross margin, burn, and cash balance.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: material
    topic: series-d-structure
    missingEvidence: The size, lender identity, pricing, covenant package, and maturity of the 2026 credit facility are not public.
    whyItMatters: Debt terms affect runway, downside recoveries, and whether equity capital was sufficient on its own.
    diligencePath: Ask finance leadership for credit agreements or a lender-side summary of the facility booked alongside Series D.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: minor
    topic: governance-rights
    missingEvidence: Public sources show board names but not committee structure, observer rights, or investor consent provisions.
    whyItMatters: >-
      Control rights determine how much autonomy founders retain and how protective preferred holders are in a downside
      case.
    diligencePath: Review shareholder agreements, board committee charters, and investor rights letters from major financing rounds.
    relatedQuestionRefs:
