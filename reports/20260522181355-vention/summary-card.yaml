  topStrengths:
    - >-
      Integrated design-to-deploy automation platform with a clearer software, controller, and developer surface than
      many private industrial peers.
    - >-
      Named customer proof is unusually concrete across multiple verticals, with public outcomes on throughput,
      deployment speed, labor reallocation, and ROI proxies.
    - >-
      Fresh January 2026 capital and enterprise standardization narratives support continued product investment and
      geographic expansion.
    - >-
      Physical-AI positioning, NVIDIA ecosystem ties, and modular workflow design create strategic relevance beyond
      one-off robot-cell sales.
  topRisks:
    - >-
      No audited revenue mix, gross margin, NRR, burn, cash balance, runway, or cap-table waterfall is publicly
      disclosed.
    - >-
      EU AI Act compliance, OT/ICS cybersecurity exposure, and safety-at-scale questions remain material as physical-AI
      products roll out in Europe and connected factories.
    - >-
      Hybrid hardware/software/services economics may cap margin potential versus pure software peers while incumbents
      with larger balance sheets intensify AI competition.
    - Customer concentration and renewal durability remain under-documented despite strong named case studies.
  unresolvedGaps:
    - Audited FY2023-FY2025 financial statements with revenue by stream, gross margin, EBITDA, cash, and burn.
    - Full cap table and liquidation waterfall across Series A through D, including any credit-facility seniority.
    - Trailing-quarter NRR, GRR, churn, and contract-length data for software and services components.
    - Top-10 customer revenue concentration, multi-site commitments, and renewal schedule visibility.
    - EU AI Act compliance roadmap and conformity-assessment status for GRIIP and Rapid OperatorAI.
