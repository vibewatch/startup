- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Public price / contract model
  - Included capabilities
  - Unknowns / discounts
  - Implication
  rows:
  - - Vention
    - Public pricing not standardized on fetched product pages
    - Integrated design, hardware, programming, deployment workflow
    - Quote structure, bundling, and enterprise discounts unknown
    - Can optimize enterprise pricing, but harder for buyers to benchmark quickly
  - - Tulip
    - Essentials $100/interface/mo; Professional $250/interface/mo; Enterprise custom
    - Apps, AI, analytics, connectors, governance, regulated add-on
    - Enterprise discounting and full-site economics undisclosed
    - Strong transparency for digital-ops buyers comparing SaaS plans
  - - Formic
    - Monthly managed-service model; industrial palletizers start at $5,975/mo and as low as $3,975/mo
    - Equipment, support, maintenance, parts, SLAs, production intelligence
    - Term length and custom quotes vary by system
    - Very compelling for zero-capex buyers focused on end-of-line automation
  - - Hirebotics
    - Cobot Welder core package starts at $105,000
    - Robot, application equipment, mobile workstation, software, starter kit
    - BeaconCare upsell and service bundles vary
    - Useful benchmark for vertical turnkey capital purchase
  - - READY / Wandelbots / Siemens / Rockwell / ABB / OnRobot
    - Mostly quote-based or undisclosed in fetched sources
    - Capabilities vary from software-only to full portfolios
    - Discounts, contract lengths, and maintenance terms not public
    - Procurement requires direct vendor engagement rather than self-serve comparison
  notes: Public list prices and contract models are unevenly disclosed across the set; that asymmetry itself is competitively relevant for SME versus enterprise buyers.
