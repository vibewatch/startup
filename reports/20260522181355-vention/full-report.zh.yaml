    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Vention 是一家总部位于 Montréal 的工业自动化公司，成立于 2016 年，如今通过位于 Montréal 和 Berlin 的北美与欧洲总部运营。公司在官网、关于我们页面和 Series D
              材料中，始终把自己定位为 AI 驱动的全栈自动化平台，而不是狭义机器人 OEM：客户可以在同一个云端工作流里设计、编程、部署并运行自动化设备和机器人单元。核心价值主张是压缩时间。Vention 称，制造商借助
              MachineBuilder 做 AI 辅助 CAD、MachineLogic 做机器人和机器编程、MachineCloud
              做部署和持续支持，可以把从概念到落地的周期从几个月压到几天。当前公开足迹已经有分量：Vention 称现场有 25,000 多台机器，平台覆盖 4,000 多家工厂和 25 个以上制造行业。这些头部指标，加上
              Berlin 实体披露以及 2026 年融资后向 EMEA 推进，说明 Vention 已是跨境成长期平台公司，同时暴露于软件和实体自动化，而不是单点系统集成商。
