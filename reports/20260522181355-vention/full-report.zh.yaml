      - number: '8.4'
        title: 上市公司可比对象、私募轮次参照与并购基准
        blocks:
          - type: paragraph
            body: >-
              Vention 最相关的上市可比对象，横跨大型传统自动化平台和高增长 AI 增强自动化软件。 Rockwell Automation（NYSE: ROK）是结构上最接近的可比公司，它是一家同时拥有硬件和
              软件板块的全栈工业自动化公司：截至 2026 年 5 月 22 日，Rockwell 市值 $50.3B，财政 2025 年收入约 $8.1B，隐含约 6.2x EV/revenue 倍数。Rockwell 的
              Software & Control 板块经营利润率为 29.7%，Lifecycle Services 为 14.5%，说明利润率离散度很大，而 Vention
              未披露收入结构，难以对标。Symbotic（Nasdaq: SYM）是一家 AI 驱动的仓储与供应链自动化 平台，可作为 AI 增强自动化溢价定价的有用参照：2026 年 5 月 22 日，Symbotic 市值
              $32.6B，财政 2025 年收入 $2.247B，对应约 14.5x 倍数——这是公开自动化公司中最高水平 之一。Symbotic 披露 Q2 fiscal 2026 收入 $676M（同比
              +23%），adjusted EBITDA 为 $78M， 说明当增长和利润率扩张并存时，AI 自动化平台可以获得显著收入溢价。Teradyne（Nasdaq: TER）是 Universal Robots
              的母公司，也是 Vention 主要协作机器人伙伴；其 2025 年年报 于 2026 年 2 月提交，覆盖截至 2025 年 12 月 31 日期间，TER 工业自动化板块可为协作机器人
              相邻平台提供收入结构参照。私募侧，Bright Machines 已为软件定义模块化制造自动化平台 融过多轮，与 Vention 定位有重叠；虽然截至撰写时其最新估值未公开确认，但作为 Series B+
              私营公司的融资轨迹，可为该领域资本形成提供参照。私募市场 M&A 数据显示，高增长工业 软件平台的收购倍数约为过去 12 个月收入的 10–18x；Roland Berger 在 2026 年 1 月更新中
              提到，2024 年交易活动出现复苏迹象，且“欧洲和北美仍是目标地区和买方地区的主导区域。” Vention 与上市可比公司的关键差异是规模：Rockwell 和 Symbotic
              收入高出多个数量级，因此若不加入私营公司增长溢价，直接外推倍数会低估 Vention 的可触达 上行；但硬件结构又会削弱软件溢价论证。
