      - number: '3.2'
        title: 能力、定价与包装对比
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，Vention 在现代挑战者中拥有最广的集成工作流。MachineBuilder 和 MachineLogic 合在一起覆盖 CAD、BOM 生成、仿真、编程、开发者工具和一键部署；这与 Tulip
              的可组合应用和合规工作流、READY 的机器人抽象层，或 Formic 的托管码垛合约，是不同命题。Tulip 最清楚地说明了强相邻玩家和直接类比对象的区别：它的产品强项在互联应用、AI
              增强的一线工作流和受监管数字运营，而不是公开的机器人单元硬件或实体硬件市场广度。Formic 更不同；它以零资本开支和月费销售运营结果，尤其面向包装和码垛。公开定价透明度也反映了这些差异。Tulip
              公布基于界面的软件定价，Formic 公布月度码垛机定价，Hirebotics 披露起始系统价格。相比之下，Vention、READY、Wandelbots、Siemens、Rockwell 和 ABB
