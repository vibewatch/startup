      - number: '4.2'
        title: 销售效率代理、部署速度经济性与利润率驱动
        blocks:
          - type: paragraph
            body: >-
              Vention 的公开销售效率故事建立在客户价值代理指标上，而不是披露的 CAC 或回本队列。最强的公开数字来自 Vention 支持的研究和案例文章：平均 1.3 年回本、部署速度快 3–8x，以及平台 ROI
              4.7x。这些说法方向上有帮助，因为它们符合更大的叙事：碎片化自动化会在设计、集成和调试中烧掉时间和预算。隐藏成本文章明确提出了这个论点，引用传统项目 28 到 60
              周的周期，并给出一旦设计、编程、采购和部署被连接进一个软件定义工作流后周期缩短的案例。但同一证据基础也是核心尽调问题。大多数单位经济数据由公司撰写，并以结果营销而非独立审计的队列经济性呈现。结果是，Vention
              围绕更快报价、更易部署和更低集成摩擦，讲出了有吸引力的销售故事；但公开记录仍无法回答这些收益有多少沉淀为毛利率、服务利用率或经常性软件收入。同行文件也强化了这个区分的重要性：软件占比高的组合在结构上可能比服务占比高的组合更赚钱，混合自动化供应商通常必须在两者之间平衡。
