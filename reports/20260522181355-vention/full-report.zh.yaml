  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Vention
              并不落在单一清晰的分析师分类里。公司销售的是全栈工厂自动化工作流，覆盖设计、编程、控制、预工程化单元、部署和运营支持。因此，最广义的相关市场是工厂自动化和工业控制，最窄且可辩护的视角则是工业自动化软件。正确分析动作是保留这些层次，而不是把它们压成一个过大的总可用市场（TAM）。广义类别很重要，因为买方仍会拿
              Vention 与现状替代方案比较，例如定制系统集成、传统 PLC 和 SCADA
              技术栈，以及需要独立设计和调试工具的单体机器人项目。但公司的实际切入点更窄：软件定义、模块化、可快速部署的自动化，面向重视价值兑现速度和跨站点标准化的离散制造工作流。这个边界逻辑也说明该排除什么。纯 ERP
              或后台软件不在范围内。消费机器人不在范围内。永远不触及 Vention
              设计到部署工作流的纯流程自动化层也不在范围内。因此，本章使用多重市场镜头，并把换算过程说清楚，而不是暗示一个泛化的“大市场”数字就能回答每个尽调问题。
