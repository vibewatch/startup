      - number: '1.2'
        title: 创始人、领导层厚度与治理可见度
        blocks:
          - type: paragraph
            body: >-
              管理层披露比许多私营工业公司更充分，但治理权利仍只露出一部分。Etienne Lacroix 作为创始人兼 CEO，显然是 Vention 的对外核心面孔；他曾在 GE 和 McKinsey 任职，叠加工程与
              MBA 正规训练，与面向制造业转型的平台有很强创始人-市场匹配。联合创始人 Max Windisch 到 2026 年仍以首席科学官身份活跃，把最初产品架构的连续性带入当前物理 AI
              推进。公司现在也展示了更完整的高管班底，包括 CTO François Giguère、CFO Rob Lorbetskie 和 CRO Joe Wykes。Vention GmbH
              的公开法律披露还显示，Lacroix、Wykes 和 Lorbetskie 是 Berlin 管理委员会成员，说明商业和财务职能已经国际化。第三方数据库补充了一份五人董事会名单，包含 Ajay
              Agarwal、Jean-François Marcoux、Emily Walsh、Lacroix 和
              Windisch，但这些来源没有披露董事会委员会、保留事项或投资人保护权。务实结论是：运营领导层相当可见，正式治理结构仍只披露了一部分。
