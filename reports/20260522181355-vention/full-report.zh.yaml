      - number: '4.4'
        title: 财务结论、收入质量与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              承销结论混合但可用。Vention
              显然有多层变现面、企业标准化动能，以及足够的近期资本来支撑下一轮产品周期投入。这些都是实质利好。与此同时，投资人建立信念所需的几乎每个关键财务变量仍未公开：收入结构、毛利率、软件附加率、服务利用率、CAC、续约行为、现金余额、烧钱速度和营运资本强度。因此，公开证据支持把
              Vention
              视为有前景但仍部分不透明的工业软件与硬件平台。收入质量看起来好于纯项目型集成商，因为工作流包含订阅、支持和可复用的市场生态；但公开披露没有说明收入中有多少真正经常性、多少是交易性。资本强度也只是在相对意义上显得可控。2026
              年新融资和收入运行率说法降低了近期压力的可能，却没有达到精确判断现金跑道或下一轮融资时点的门槛。可投资结论是：Vention 动能足以支持融资，但在私下尽调补齐下列缺口之前，经济性还不能被充分承销。
            claimRefs:
