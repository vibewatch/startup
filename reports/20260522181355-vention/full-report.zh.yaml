      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图会随公司规模和工作流复杂度拆分。中小制造商往往从狭窄用例入手——机床上下料、打磨、贴标、检测，或一个机器人单元——最关心融资灵活性、集成负担，以及操作员能否在没有庞大自动化团队的情况下学会系统。这也是
              A3 强调 RaaS、协作机器人和可扩展单元是中小制造商（SMMs）实际入口的原因。大型企业的行为不同。它们想要能在多工厂反复部署的标准化硬件和软件，所以 Vention
              自有材料强调集中项目管理、共享机器规格和跨站点可见度。第三类买方是高级技术用户——开发者、机器人专家和系统集成商——他们关心可编程性、CLI
              支持，以及与现有工程技术栈的互操作性。三个群体的采用路径有共同顺序：界定工作流，定义 ROI 和需求，数字化建模机器，仿真并编程，部署到车间，再借助分析和远程支持运行。变化的是谁签字、哪类摩擦占主导：SMMs
              卡在预算和技能短缺，企业卡在标准化和治理复杂度，高级用户卡在工具链灵活性和集成深度。
