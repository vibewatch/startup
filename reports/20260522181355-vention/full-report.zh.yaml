      - number: '8.2'
        title: 融资背景、隐含估值、入场纪律与优先股压力
        blocks:
          - type: paragraph
            body: >-
              Vention 任何融资轮的投后估值都未公开披露。公司没有在任何司法辖区提交会触发 强制估值披露的注册声明、IPO 招股书或证券文件。可以从公开信号出发，构建一个隐含区间。 Series D 总额为 $110M
              USD（$150M CAD）。按后期风险投资常见的单轮 10–20% 稀释，隐含 投后估值区间为 $550M–$1.1B USD。以 C$100M 收入运行率（按近似 CAD/USD 汇率约 $73M
              USD）为基数，套用 7.5x–15x 的可比公司收入倍数，也得到 $550M–$1.1B USD 的隐含 估值区间——两种方法收敛。区间中点（$750M–$800M USD）相当于按运行率约 10x 收入倍数，
              相较大型上市自动化同行偏高（Rockwell 约 6.2x 收入），但相对高增长 AI 增强平台可比 公司仍说得通（截至 2026 年 5 月 22 日，Symbotic 按 FY2025 收入约 14.5x
              交易，市值 $32.6B，对应收入 $2.247B）。任何假设中下一轮新股投资者的入场纪律都需要：（1）私人 财务数据确认收入质量、毛利率和 NRR；（2）审阅股权结构表，覆盖 Series A 到 D 的优先股
              堆叠、清算优先权和反稀释条款；（3）搭桥收入运行率与已签约 ARR，以确认粘性；（4）清晰 说明通往现金流盈亏平衡或下一次融资事件的路径。累计稀释是重要变量：Vention 自 2019 年
              以来在五轮或更多可识别融资中累计筹集 $263M+ USD。按正常风险投资经济性推断，早期投资者 已发生显著稀释，现有优先股堆叠也会在普通股或员工期权兑现价值前形成实质门槛。BetaKit
              报道提到的信贷额度增加了潜在结构性优先级，但条款未公开。任何二级市场定价，或后期基金 按隐含 $750M+ USD 估值入场，都需要论证在预期退出或 IPO 规模下，优先股压力是否可管理。
