companyProfile:
  summary: >
    Vention 是一家总部位于 Montréal 的工业自动化公司，2016 年由 Étienne Lacroix 和 Max Windisch 创立。公司把云端设计软件、可写代码的编程能力、模块化硬件、部署工具，以及较新的物理
    AI 产品组合在一起，帮助制造商在几天内而非几个月内设计、编程、部署并运行定制或交钥匙自动化系统。公开证据显示经营动能可观——25,000 多台机器覆盖 4,000+ 家工厂，2025 年末据称年收入运行率达到 C$100M，且
    2026 年 1 月完成 $110M USD Series D——但收入结构、毛利率、留存、现金、烧钱速度和优先股堆叠的详细披露仍未公开。
