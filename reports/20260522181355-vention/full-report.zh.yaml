  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与逻辑破坏条件
        blocks:
          - type: paragraph
            body: >-
              2026 年 Vention 的投资逻辑有五根相互咬合的支柱。第一，市场时点：全球工业自动化和 控制系统市场 2025 年规模为 $226.76 billion，预计 2033 年达到 $504.38
              billion，CAGR 为 10.5%，由制造业回流、劳动力成本压力和 Industry 4.0 采用推动。在其中，协作机器人 子市场增速更快，预计到 2030 年以 18.9% CAGR 增至 $3.38
              billion。Vention 处在平台 软件和模块化硬件的交叉点，能在全栈捕获价值，而不是以单层供应商身份竞争。第二， 产品-市场匹配：Vention 在 2025 年 12 月底跨过 C$100
              million 年收入运行率，在 4,000+ 家工厂部署超过 25,000 台机器，并公开点名 Boeing、L'Oréal、Lockheed Martin 等企业 客户。Q4 2025
              更新提到公司史上最大订单之一，规模为 200 个机器人站，符合多站点 先落地再扩张动作。第三，资本充足性：2026 年 1 月来自 Investissement Québec、 Desjardins
              Capital、Fidelity Investments Canada 和 NVIDIA 的 NVentures 等机构投资者 的 $110M USD Series D，使累计融资约 $263M USD /
              $300M+ CAD，为物理 AI 研究和 EMEA 扩张提供了已融资现金跑道。第四，平台差异化：Vention 的 Zero-Shot Automation™ 逻辑、 GRIIP 物理 AI 管线，以及面向企业
              Advanced Manufacturing Teams 的一次设计、处处部署 模型，相较传统系统集成商形成了差异化且可防守的表面。第五，NVIDIA 战略投资和 IFR World Robotics 2025
              数据显示全球机器人安装量过去十年翻倍，物理 AI 叙事正在获得机构 可信度。反向逻辑同样清晰。第一，财务不透明很关键：公开信息没有投后估值、
              经审计毛利率、收入结构、NRR、烧钱速度或现金余额。这意味着任何估值都要依赖收入运行率 替代指标和可比公司倍数，而不是经验证的经常性经济性。第二，混合软硬件模型相较纯软件 同行会结构性限制毛利率；Rockwell
              Automation FY2025 数据显示，Software & Control 板块利润率为 29.7%，Lifecycle Services 为 14.5%，而 Vention 未披露收入结构，无法确认
              经常性软件是否足以支撑软件层级盈利能力。第三，来自规模化既有厂商的竞争正在加剧—— Rockwell（$50.3B 市值）、Siemens、ABB 和 FANUC 都在 AI 增强自动化上加码，并拥有更深
              资产负债表、既有客户关系和嵌入式工业软件平台。第四，2025 年工业自动化需求偏弱： Roland Berger 2026 年 1 月更新指出，许多自动化公司 2025 年订单获取仍低于收入，Q3
              情绪仅温和恢复。Vention 的增长动能可能真实，但市场背景让 2026 年爬坡究竟是耐久需求， 还是放缓后的补单，存在不确定性。第五，地理集中度（70% 美国客户）带来关税和资本开支
              敏感性；美国制造业资本开支持续收缩，或贸易政策风险升级，都会不成比例地影响订单。
