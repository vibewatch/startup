      - number: '8.5'
        title: 退出准备度、逻辑破坏触发因素与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              以公开证据看，截至 2026 年中，Vention 的退出准备度低于 IPO 准备度门槛。公司没有注册 证券，没有公开 S-1 或 F-1，没有公开可访问的经审计财务报表，也没有披露收入结构、毛利率
              或烧钱速度。这不意味着 IPO 还要等很多年——成长阶段平台常常能把从 $100M 收入运行率到 上市的时间压缩——但公开证据不足以承销近期流动性事件。战略 M&A 是更合理的近期退出路径：
              Rockwell、Siemens、ABB、FANUC，以及潜在的 NVIDIA 或大型云基础设施玩家，都有战略理由 收购一家能加速其物理 AI 布局的全栈自动化平台。NVIDIA 通过 NVentures 参与
              Series D， 建立了可能预示更深商业合作或收购对话的战略关系。机构投资者若评估新的二级或一级仓位， 以下尽调问题是硬约束：（1）2023、2024 和 2025 财年的经审计或审阅财务报表，按收入来源
              展示收入、毛利率和 EBITDA；（2）股权结构表，展示优先股堆叠、期权池，以及各类投资人的 完全稀释后持股；（3）过去四个季度订阅和服务组件的 NRR、GRR 与流失数据；（4）前 10 大
              客户收入集中度和合同条款，包括续约日期与多站点承诺；（5）Series D 信贷额度条款、财务 财务约束条款和维持测试；（6）GRIIP 与 Rapid OperatorAI 的 EU AI Act
              合规路线图。监控侧的 投资逻辑破坏触发因素包括：任何披露的收入增速低于 20% YoY，任何披露的 NRR 低于 90%，任何 涉及 MachineCloud 的 CISA advisory 或有记录
              OT/ICS 安全事故，任何阻断 GRIIP 部署的 EU 监管执法，或 down-round 融资事件。在这些缺口闭合之前，基于公开证据的投资态度是低置信度
              观察。估值态度是未知，因为价格发现需要对优先股压力和收入质量做私人尽调。
