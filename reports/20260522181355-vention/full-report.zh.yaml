        title: 牵引力、资本充足性与同行财务背景
        blocks:
          - type: paragraph
            body: >-
              头部牵引力信号强到足以支持其市场重要性，但不足以完全承销耐久性。BetaKit 报道称，Vention 在 2025 年 12 月末跨过 C$100 million 年收入运行率，随后在 2026 年 1 月融资
              $110 million USD（$150 million CAD）。管理层称，资金将加速物理 AI 研发，增加软件能力，扩展预工程化应用，并加深欧洲覆盖。在运营侧，Vention 继续引用 25,000
              多台机器和 4,000 多家工厂；其 2025 年 Q4 更新称，最大订单之一包含 200
              个机器人工作站。这些信号与公司从一次性试点走向可重复企业推广部署的状态一致。问题在资本充足性可见度。公开材料既未披露手头现金，也未披露月度烧钱速度；BetaKit
              提到的小额信用额度，除了这次提及本身，也没有公开文件。这让上市公司同行只能作为框架。Rockwell 展示了混合自动化经济性如何在产品、软件和服务之间拆分；Symbotic
              则显示，即使规模化自动化领导者，在盈利完全稳定前也可能需要非常大的资产负债表。因此，Vention 看起来比许多私营同行资金更充足，但财务透明度还不够。
