  - id: FV001
    title: 建议逻辑 — Vention 估值决策树
    type: flow
    description: >-
      决策流程图追踪支撑“观察”建议、但信心较低的关键证据节点。顶层问题是 Vention 在隐含 $550M–$1.1B USD
      估值下是否值得投资；流程围绕五道证据关口分叉——市场证据、产品市场契合、财务披露、可比公司倍数和风险画像——最终收敛到仍待非公开尽调验证的观察结论。
    data:
      nodes:
        - id: f1
          label: Vention 在隐含 $550M–$1.1B USD 估值下值得投资吗？
          type: question
        - id: f2
          label: 市场证据支持吗？
          type: gate
        - id: f3
          label: 是 — $226B+ 市场、10.5% CAGR、制造业回流浪潮
          type: positive
        - id: f4
          label: 产品市场契合已确认吗？
          type: gate
        - id: f5
          label: 是 — C$100M 收入运行率、4,000+ 家工厂、企业客户标杆
          type: positive
        - id: f6
          label: 财务披露足够吗？
          type: gate
        - id: f7
          label: 否 — 无审计收入、无毛利率、无 NRR、无股权结构表
          type: negative
        - id: f8
          label: 可比公司倍数站得住吗？
          type: gate
        - id: f9
          label: 部分支持 — 6.2x（Rockwell）到 14.5x（Symbotic）区间；Vention 收入结构未知
          type: neutral
        - id: f10
          label: 风险画像可接受吗？
          type: gate
        - id: f11
          label: 高风险 — 尚未盈利、EU AI Act、硬件资本强度、竞争
          type: negative
        - id: f12
          label: 建议 — 观察（低信心；估值未知）
          type: outcome
  - id: FV002
    title: 估值敏感性 — 不同收入倍数情景下的隐含企业价值
    type: bar
    description: >-
      柱状图展示将五档收入倍数（5x、7.5x、10x、12.5x、15x）套用于约 $73M USD 收入运行率后，对应的 Vention 隐含企业价值（USD 百万美元）。7.5x–10x 区间对应基准情景；12.5x–15x
      代表乐观情景下的实体 AI 溢价。
    data:
      items:
        - label: 5x（硬件同行下限）
          value: 365
        - label: 7.5x（基准情景低端）
          value: 548
        - label: 10x（基准情景中值）
          value: 730
        - label: 12.5x（乐观情景低端）
          value: 913
        - label: 15x（乐观情景高端 / Symbotic 档）
          value: 1095
  - id: FV003
    title: 估值与回报区间 — 乐观 / 基准 / 悲观情景
    type: range
    description: >-
      区间图展示 3–5 年持有期内，乐观、基准、悲观情景下 Vention 退出时的隐含企业价值，均以 USD
      百万美元计。基准情景（$1.6–$2.5B）是在当前证据下按概率加权后的中枢结果。乐观情景（$3.6–$6.0B）需要软件收入占比提升和平台溢价。悲观情景（$480M–$900M）意味着按当前隐含估值进入的回报有限。
    data:
      items:
        - label: 悲观情景退出（4–6x 收入，$120–150M USD 收入）
          low: 480
          high: 900
        - label: 基准情景退出（8–10x 收入，$200–250M USD 收入）
          low: 1600
          high: 2500
        - label: 乐观情景退出（12–15x 收入，$300–400M USD 收入）
          low: 3600
          high: 6000
        - label: 隐含当前估值（由 Series D 推断）
          low: 550
          high: 1100
