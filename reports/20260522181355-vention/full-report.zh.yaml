      - number: '2.2'
        title: 规模测算视角、地域重点与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              公开规模证据支持三种可用视角，而不是一个精确答案。第一，全球工厂自动化和工业控制的广义市场很大；按 Mordor 口径，2026 年为 USD 338.46 billion，按 Coherent
              稍有不同的工业自动化边界，为 USD 261.23 billion。第二，最贴近 Vention 平台逻辑的软件层要小得多；Mordor 的工业自动化软件视角给出 2026 年 USD 43.87
              billion。第三，公司的实际销售地域集中在北美和欧洲；这些地区机器人渗透率和政策支持都高，尽管区域估计来自不同框架。仅欧洲在 Mordor 的 2026 年视角中就是 USD 74.07 billion
              市场，Coherent 则把其更广义自动化市场的 40.8% 份额分配给北美。这意味着，正确结论不是基于一份报告搭一个单一 TAM、SAM、SOM 堆栈。正确结论是，Vention
              位于三个集合的交叉点：庞大的广义自动化资本开支池、更小的软件中心编排层，以及机器人密度和政策顺风高于平均的地域集中买方群。准确的 Vention 专属可服务市场（SAM）仍是尽调缺口。
