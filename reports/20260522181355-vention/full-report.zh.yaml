  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接、相邻与替代型竞争格局
        blocks:
          - type: paragraph
            body: >-
              理解 Vention 的竞争集合，按类别切分比找一个单一同行组更准确。公司面对 READY Robotics 和 Wandelbots
              等直接、软件形态更强的挑战者，它们主打不绑定机器人品牌的编排和数字孪生部署层。它也面对 Tulip 这类数字运营相邻玩家；Tulip 更接近可组合 MES 和前线 AI
              平台，不像机器人单元市场，但仍争夺同一笔车间转型预算。它还面对 Formic 这类轻资本替代方案；其零资本开支 RaaS 模式会赢下更重视即时产线末端结果、而不是拥有一体化设计到部署技术栈的买方。此外，还有
              OnRobot 这类组件和工具竞争者，它让传统机器人品牌上的自动化更模块化；以及 Hirebotics、Standard Bots
              这类更窄的垂直专家，承诺在特定工作流中快速兑现价值。最后，Siemens、Rockwell 和 ABB
              等传统巨头仍凭借服务覆盖、装机基础和企业信任，在许多存量工厂或受监管决策中占据锚点。关键洞察是：Vention
              的护城河不只是跑赢某一个初创竞争对手；它必须把足够多的价值链整合在一起，让买方不把设计、编排、硬件和支持拆给不同供应商。
