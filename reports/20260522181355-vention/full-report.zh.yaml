      - number: '8.3'
        title: 乐观、基准和悲观情景：明确假设与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              乐观情景建立在五项假设上：（1）Vention 的物理 AI 平台成为全球企业 Advanced Manufacturing Teams 的默认标准，而不只是在北美；（2）软件订阅附着率提升，使软件来源 毛利到
              2028 年接近或超过总收入的 40%；（3）EMEA 收入按计划放大，降低 70% 美国集中度， 并扩大总可触达版图；（4）平台在既有企业账户内留存并扩张，随着多站点部署复合增长，NRR 达到
              110%+；（5）全球机器人市场延续机构化增长轨迹，IFR 数据确认过去十年安装量翻倍， Roland Berger 预测到 2030 年 CAGR 最高 9%。在乐观情景下，Vention 到
              2028–2029 年收入 达到 $300–$400M USD，软件结构带来溢价利润率，并通过 IPO 或战略收购以 12–15x 收入退出， 对应 $3.6–$6B 企业价值，为 Series D
              投资人带来强回报。基准情景假设：（1）收入继续增长， 但硬件仍是主导结构，混合毛利率维持在 30–45% 区间，而不是软件层级 60%+；（2）EMEA 爬坡
              带来增量，但没有爆发式规模；（3）净留存健康（100–110%），但平台切换成本只形成中等护城河； （4）Vention 到 2028 年达到 $200–$250M USD 收入运行率，并以 8–10x
              收入退出，对应 $1.6–$2.5B 企业价值。悲观情景假设：（1）2026–2027 年美国宏观走弱或关税扰动使工业自动化 资本开支收缩；（2）零部件成本上升，Symbotic/Rockwell/Siemens
              推出相邻 AI 自动化产品， 硬件毛利压力加剧；（3）软件订阅附着率停滞在收入 20% 以下；（4）EU AI Act 合规推迟 EMEA 扩张并抬高研发成本；（5）企业客户精简自动化供应商，NRR 跌破
              90%；收入增速降至 个位数。在悲观情景下，Vention 到 2028 年收入为 $120–$150M USD，以 4–6x 退出，对应 $480–$900M，在隐含 $750M+
              当前估值上回报有限。三种情景的概率加权结果，对长周期耐心 资本方向上正面，但对近期流动性事件仍不确定。
