      - number: '7.4'
        title: 合作伙伴、供应商与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              Vention 的产品架构编织出一张密集依赖图，它既是优势，也是集中风险。最深的单点依赖 是 NVIDIA：MachineMotion AI 和 MachineMotion AI Pro 控制器都基于
              NVIDIA Orin 处理器 （NX16 GB 或 Nano 8 GB），使 NVIDIA 成为 Vention 物理 AI 能力唯一的 AI 芯片供应商。 如果 NVIDIA 调整 Jetson
              平台路线图、提高 OEM 价格或限制出货，Vention 将面临以数月 到数年计的硬件重设计周期。双方关系看起来有商业强化——NVIDIA 的 NVentures 参与了 2026 年 1 月 Series
              D，NVIDIA 也在 GTC 2025 宣布 Vention 为物理 AI 部署伙伴——但 股权投资不保证芯片配额或价格稳定。Universal Robots（Teradyne）是物理 AI 集成中
              被点名的机器人伙伴，并与 Vention 一同亮相 Interpack 2026；UR 关系中断或 UR 平台 被弃用，会移除最可见的联合品牌集成。ABB 在 Demo Day 2024 材料中被列为第二个机器人
              伙伴。AWS 是云托管提供商；Vention 安全页面明确把 Amazon Web Services 列为唯一可信 云提供商。IQ（Investissement Québec）领投 Series
              D，Desjardins Capital 也参与， 这给 Québec 公司带来政府和合作社资本，也带来声誉与政治依赖；不过短期内这不是运营 风险。客户集中度风险存在但无法量化：Boeing、L’Oréal 和
              Lockheed Martin 被公开点名 为客户，但它们的收入贡献和续约状态没有披露。地理集中度清晰可见——BetaKit 确认 美国 70%、欧洲 20%、加拿大
              10%——意味着美国市场放缓或关税扰动会不成比例地影响收入。 加拿大制造业调查数据显示，2025–2026 年美国关税不确定性正在让制造商预算犹豫；即便 Vention
              的硬件在加拿大设计和组装，其客户群的资本设备预算仍对美国工业政策敏感。 最新 IFR 数据显示，全球机器人安装量十年翻倍，这支撑 Vention 的市场逻辑，但也意味着 成熟 OEM
              机器人公司正在扩大竞争性自动化方案。
