        - 设计、硬件、编程、部署工作流一体化
        - 报价结构、捆绑方式、企业折扣未知
        - 可以优化企业定价，但买家更难快速比价
      - - Tulip
        - Essentials $100/interface/mo；Professional $250/interface/mo；Enterprise 定制报价
        - 应用、AI、分析、连接器、治理、受监管行业附加包
        - 企业折扣和全站经济性未披露
        - 数字运营买家比较 SaaS 套餐时，透明度很高
      - - Formic
        - 月度托管服务模式；工业码垛机起价 $5,975/mo，最低 $3,975/mo
        - 设备、支持、维护、零件、SLA、生产智能
        - 期限和定制报价因系统而异
        - 对关注产线末端自动化的零 CapEx 买家很有吸引力
      - - Hirebotics
        - Cobot Welder 核心包起价 $105,000
        - 机器人、应用设备、移动工作站、软件、入门套件
        - BeaconCare 增购和服务捆绑方案会变化
        - 可作为垂直交钥匙资本采购的基准
      - - READY / Wandelbots / Siemens / Rockwell / ABB / OnRobot 等自动化厂商
        - 抓取来源多为询价制或未披露
