      - number: '7.5'
        title: 财务、模型与资本风险
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 1 月，Vention 尚未盈利，且资本密集。Series D 融资 $110 M USD（$150 M CAD），使已披露累计资本超过 $300 M CAD；公司在 2025 年底据报跨过约
              $100 M CAD 年 收入运行率。简单计算显示，累计资本投放远高于年收入，符合持续投入阶段的特征。BetaKit 报道称该轮主要为股权，另有小额信贷额度，但未披露信贷条款、利率或财务约束条款结构。
              硬件优先的平台公司，资本需求结构性重于纯 SaaS：Vention 必须同时投入研发、模块化 硬件零部件库存、配送中心运营、保修准备金和销售人力。可比自动化软硬件公司的公开
              部门文件（Symbotic、Rockwell Automation）显示，硬件加软件组合的毛利率从低 30% 到 中 50% 不等，取决于服务附着率；Vention 的真实混合毛利率没有公开。汇率风险有实际
              意义：公司以 USD 和 EUR 报告收入，并且大概率有一部分 COGS 也以这两种货币发生；但 公司注册在 Canada，运营成本、工资和政府补助资格以 CAD 计价。CAD 对 USD 若持续升值， 会压缩以
              CAD 计的 USD 收入，却不能同步减轻 CAD 成本。硬件销售存在营运资本风险： 销售条款规定下单支付 50%，交付后 net 30 支付 50%，超过 24 小时取消收 30% 费用——
              条款合理，但结构上不同于纯 SaaS 经常性收入。新机器订单放缓会直接减少现金流入，而 生产周期承诺仍会继续。欺诈风险属于全球处理机器设计和支付交易的平台常规风险，并被 第三方支付处理商和 ISO 27001
              控制部分缓释，但没有发现公开欺诈披露。财务模型最重要 的不确定性是收入质量：Vention 披露年收入运行率（$100 M CAD），但不披露硬件/软件 拆分、经常性/一次性收入拆分或
              NRR，因此无法判断该运行率代表的是耐久的 SaaS 式经济性， 还是交易占比很高的机器销售。
            claimRefs:
              - CR036
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
      - number: '7.6'
        title: 团队、执行与治理风险
        blocks:
          - type: paragraph
            body: >-
              Vention 的领导层梯队强于许多成长阶段工业公司，但仍有创始人集中和关键人物风险。 CEO Etienne Lacroix 是对外门面、战略叙事者和主要投资者关系声音；如果离职或无法履职，
              会带来显著交接风险。联合创始人 Max Windisch 现任 CSO，支撑核心科学和物理 AI 差异化； 他从创立至今的参与带来连续性，也集中了承载 AI 模型专长的人。管理团队已补入 CFO （Rob
              Lorbetskie，前 Shopify VP Finance）、CTO（François Giguère）、CRO（Joe Wykes） 和 CPO（Brendan），但团队在 Vention
              的整体任期，以及在规模化压力下的凝聚力，无法 从公开来源独立核验。AI 机器人领域的人才风险结构性偏高：能开发物理 AI 模型、嵌入式 软件和模块化工业硬件的工程师在全球竞争激烈，Vention 要与
              NVIDIA、Boston Dynamics、 Rockwell 和越来越多物理 AI 初创公司抢人。Montréal 科技市场能从 Polytechnique 和 McGill
              获得强工程人才，但来自美国总部公司的薪酬竞争真实存在。Vention 招聘页面显示 软件、硬件和 AI 岗位仍在招聘，说明增长仍需要新增人手。前文研究中的 Indeed 评价给出
              混合信号——样本小限制了可靠性，但文化和管理反馈并非一致正面。董事会治理只部分可见： 第三方数据库披露五名董事会成员（Lacroix、Windisch、Ajay Agarwal、Jean-François
              Marcoux、Emily Walsh），但投资人保护权、董事会构成要求、拖售条款和优先股清算条款 都未公开。Vention GmbH impressum 确认 Lacroix、Wykes 和
              Lorbetskie 是德国法律管理层， 说明关键高管跨实体重叠，也说明 EMEA 实体目前依赖加拿大领导层，而不是专门的区域管理。
