      - number: '1.4'
        title: 里程碑、规模信号与早期反向证据
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，Vention 作为工业平台公司的执行节奏异常紧。其关于我们时间线列出从 2017 年 MachineBuilder 和 Universal Robots 认证，到 2024 年
              MachineMotion AI，再到 2026 年 Rapid OperatorAI 的年度产品与公司里程碑。公司还把融资事件与平台扩展、办公室扩张和基础设施建设配套推进，例如 Montréal 配送中心和
              Berlin 总部。商业规模信号呈阶梯式改善：Series B 公告称 2020 年覆盖 1,000 多家工厂，Series C 公告称 2022 年在五大洲拥有 3,000 多个客户，当前平台口径显示
              4,000 多家工厂和 25,000 台机器。BetaKit 补充称，Vention 在 2025 年末跨过 C$100 million 年收入运行率，2026 年 1 月融资时约有 330 名员工；Tracxn
              后来列示 355 名员工。第一章最重要的反向证据不是公司特定丑闻，而是市场摩擦信号：Vention 与 Industry Week 的自动化调查显示，只有 37%
              的制造商已经实现显著或全面自动化，技术选择、内部专业能力和预算超支仍在阻碍采用。这意味着 Vention 的增长真实存在，但仍取决于它能否解决一个制造商在实践中长期难啃的市场问题。
