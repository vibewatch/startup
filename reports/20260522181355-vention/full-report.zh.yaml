      - number: '7.7'
        title: 缓释因素、否决条件与尽调问题
        blocks:
          - type: paragraph
            body: >-
              相对同阶段公司，Vention 最重要的风险缓释来自认证和合规姿态较强：ISO 27001 认证、 面向美国联邦的 NIST 800-171 合规、英国 Cyber Essentials、具备 IEC 60529
              IP54 工业 等级的 MachineMotion AI，以及 EN ISO 13849-1 Performance Level e 机械安全，都是可信 基线。漏洞披露政策和接近 bug bounty
              的奖励计划，显示安全团队已有成熟度。2026 年 1 月 Series D 带来的资本缓冲降低了近期财务风险。NVIDIA 通过 NVentures 直接参股， 降低但不能消除芯片供应风险。最大的未解决风险，是
              EU AI Act 合格评定缺口、设备级 IoT 认证缺口（ioXt 尚未取得）、未经验证的 IP 保护姿态，以及缺少关于烧钱速度、毛利率 和 NRR 的经审计财务指标。否决条件包括：（1）EU 监管方认定
              GRIIP 或 Rapid OperatorAI 必须接受正式合格评定，且 Vention 被认定不合规——这会阻断 EMEA 收入；（2）确认发生 与客户工厂 MachineCloud
              连接有关的安全泄露或实体安全事故——这会触发产品责任索赔和 声誉损害；（3）NVIDIA Jetson 平台停产或出口限制削减 MachineMotion AI 芯片供应——这
              需要多个季度的硬件重设计；（4）Series E 以显著更低估值融资（down-round）或融资失败， 释放收入质量恶化或烧钱压力信号；（5）CEO 或 CSO 流失且没有可见继任者。尚不单独构成
              否决条件、但需要监控的投资逻辑破坏触发因素包括：到 2026 年底 EMEA 收入占比低于 10% （扩张执行失败）；软件 NRR 低于 90%（留存恶化）；任何点名 Vention 产品的公开网络安全
              公告（CISA ICS advisory）；以及 2026 年下半年美国工业资本开支因关税引发的预算冻结 而实质性下滑。
