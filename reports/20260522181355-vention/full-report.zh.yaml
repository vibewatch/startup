  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围、模块与工作流任务
        blocks:
          - type: paragraph
            body: >-
              Vention 的产品覆盖面在工业自动化初创公司中少见地宽。公开材料展示的不是狭窄组件销售，而是全栈工作流：MachineBuilder 负责设计，MachineLogic 负责编程，MachineCloud
              负责部署和支持，MachineMotion AI 则锚定支撑实体执行的边缘控制器层。在这个核心周围，Vention 现在把 AI Operator
              定位于料箱拣选等非结构化任务，并推出面向客户的交钥匙应用，覆盖码垛、焊接、机床上下料等工作。关键分析点是，产品不只是硬件目录。它是软件定义的自动化工作流，把云端设计、仿真、控制和运营紧密连接在一起。这会改变买方实际购买的东西：不只是一个机器人单元或控制器，而是一套跨站点建模、部署和复用自动化的标准化方式。公开文档和
              Demo Day 材料在模块定义和工作流逻辑上很强，对于私营工业公司显著优于平均水平；但在正常运行时间、版本稳定性和大规模机群可靠性等硬指标上仍不完整。
