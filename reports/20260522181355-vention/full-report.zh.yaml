        - 当前证据下最可能 — 收入运行率轨迹和市场动能支撑；利润率结构是关键不确定性
      - - 悲观
        - 美国资本开支收缩；硬件利润率承压；NRR <90%；EU AI Act 合规成本上升；软件附加停滞；增长降至个位数
        - $120–150M
        - 4–6x
        - $480–900M
        - 可能 — 需要多重负面事件同时发生；现有融资降低短期困境风险
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
    notes: 收入预测是基于公开证据和可比公司数据的情景推断。Vention 并未背书，也不是已验证估计。所有数字都需要私下尽调验证。
  - id: TV004
    title: 可比估值表
    columns:
      - 公司
      - 类型
      - 收入 / 收入运行率（USD）
      - 市值 / 隐含估值
      - 收入倍数
      - AI / 软件结构
      - 备注
    rows:
      - - Rockwell Automation (ROK)
        - 上市 — 大市值工业自动化平台
        - ~$8.1B（FY2025 指引中点）
        - ~$50.3B（2026 年 5 月）
        - ~6.2x
        - 部分 — Software & Control 分部经营利润率约 30%
        - 业务模式最直接可比；较低倍数反映规模和硬件结构；Software & Control 利润率 29.7%
      - - Symbotic (SYM)
        - 上市 — AI 赋能仓库自动化平台
        - $2.247B（FY2025）；$676M（FY2026 Q2，收入）
        - ~$32.6B（2026 年 5 月）
        - ~14.5x FY2025 收入
        - 控制栈中 AI / 软件含量高
        - 溢价倍数反映 AI 平台叙事和强增长（FY2026 Q2 同比 +23%）；FY2026 Q2 调整后 EBITDA $78M
      - - Teradyne (TER) — 含 Universal Robots
        - 上市 — 测试设备 + UR 协作机器人
        - ~$2.5B 总收入（FY2025 估计）；UR 分部估计 ~$230–280M
        - 估计市值 ~$11–13B
        - 总收入约 ~5–6x
        - UR 是 Vention 的主要协作机器人合作伙伴；结构偏硬件
        - UR 若独立上市，可能获得更高倍数；Teradyne FY2025 10-K 于 2026 年 2 月提交，覆盖截至 2025 年 12 月 31 日的期间
      - - Vention（非上市标的）
        - 非上市 — 全栈 AI 自动化平台
        - C$100M CAD / ~$73M USD 收入运行率（2025 年末）
        - $550M–$1.1B USD（推断；未披露）
        - ~7.5x–15x（推断）
        - 硬件、软件、服务结构未披露
        - 投后估值未披露；按 $110M USD Series D 对应 10–20% 稀释推断
      - - Bright Machines
        - 非上市 — 软件定义模块化制造自动化
        - 未披露（Series B+ 阶段）
        - 未公开披露
        - 不可得
        - 软件定义微型工厂平台
        - 定位为最接近的非上市结构可比公司；已围绕重叠投资逻辑完成多轮融资
    enumerationScope:
      coverage: partial
      basis: >-
        Public comps use publicly available market cap and revenue data as of May 22, 2026. Private comp valuations are
