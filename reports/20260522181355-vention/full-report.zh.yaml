      - number: '1.3'
        title: 融资历史、投资人和披露质量
        blocks:
          - type: paragraph
            body: >-
              Vention 的融资历史显示，它从早期加拿大自动化初创公司稳步走到全球机构支持的成长期公司。公司 2019 年 1 月完成 CA$17 million Series A，由 Bain Capital
              Ventures 领投；2020 年 6 月完成 C$38 million Series B，由 Georgian 领投；2022 年 5 月完成 US$95 million Series C，Georgian
              再次领投，Fidelity 加入；2026 年 1 月宣布 US$110 million Series D，公开点名 Investissement Québec、Desjardins
              Capital、Fidelity Investments Canada ULC 和 NVentures。第三方数据库还显示 2023 年有一轮后期延伸融资，实质上是 Series C-II，Fonds de
              solidarité FTQ 参与，但可获取资料没有披露金额。这带来第一个重要尽调提醒：累计融资容易圈定区间，却很难在各来源间完全核对，因为部分媒体报 USD 总额，部分报 CAD 总额，数据库页面还展示
              Series D 以及同日一笔信用额度。Tracxn 和 CB Insights 大致收敛在约 $263 million 总融资额；BetaKit 则把同一资本结构加上一小笔信用额度后表述为超过 C$300
              million。因此，投资人基础显然机构化且厚实，但当前准确的优先股堆叠仍需私下尽调。
