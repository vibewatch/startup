      - number: '3.3'
        title: 切换成本、锁定效应与渠道力量
        blocks:
          - type: paragraph
            body: >-
              竞争棋盘既由切换成本和渠道触达定义，也由功能清单定义。Vention 的集成技术栈通过设计、物料清单、仿真成果、部署逻辑和平台特定工作流形成锁定。这是真实的，但不是绝对的。READY、Wandelbots 和
              OnRobot 这类不绑定机器人品牌的层，通过承诺跨品牌兼容，并把机器人或末端执行器视为更大软件或工具环境中的可替换组件，降低锁定效应。Tulip 也降低了数字工作流预算的切换摩擦，因为它强调开放
              API、连接器、边缘设备和可组合应用，可以叠在许多现有系统之上。Formic 形成另一种锁定：制造商一旦把正常运行时间、维护、零件和性能 SLA
              外包进一份月度合约，即便最初承诺是“无资本开支、低风险”，切换也会造成运营扰动。传统巨头仍掌握最强渠道力量。Siemens、Rockwell 和 ABB
              胜出，不只是因为产品广，还因为采购团队知道怎么买，系统集成商知道怎么装，全球服务组织能提供支持。Vention 的挑战，是足够快地叠加集成便利，让买方愿意为了更快部署和未来复用，接受今天更小的生态。
