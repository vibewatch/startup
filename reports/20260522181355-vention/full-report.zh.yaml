  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、变现面与定价透明度
        blocks:
          - type: paragraph
            body: >-
              公开证据指向的是混合自动化业务，而不是纯 SaaS 公司。网站、MachineBuilder 和 MachineCloud
              页面以及市场新闻材料都显示，这套技术栈覆盖设计软件、合作伙伴认证及自有硬件、部署工具和安装后支持。最清晰的公开变现证据不是完整系统的公开价目表，而是流程本身。Vention
              称，客户可以免费开始设计，生成数字孪生，实时查看物料清单和价格更新，然后进入自助结账和部署。订阅服务也存在；企业套餐增加定制
              SLA、优先响应、现场支持和指定技术联系人。订阅条款显示，计划具有合同性并可续约，但仍没有披露 ARPU、附加率，或软件、硬件和服务之间的拆分。相较同行，Vention 在 BOM
              阶段比传统纯报价集成商更透明；但投资人若想推断已实现收入或毛利率，它又远不如 Tulip 这类软件原生厂商，或 Hirebotics 这类交钥匙产品化卖家。
