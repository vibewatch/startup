      - number: '2.4'
        title: 增长驱动、采用约束与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              Vention 所在市场的需求逻辑很强，但并非没有摩擦。劳动力短缺、能源成本、政策支持和软件定义自动化，都在把制造商推向更模块化、AI 赋能的系统。IFR 的 2024
              年数据集显示，机器人需求仍保持结构性高位，全球安装 542,000 台，并预计到 2028 年超过 700,000 台。咨询机构展望也显示，经历疲软的 2025 年后，2026
              年可能开启新一轮增长周期。但多个来源保留了下行面。Mordor 强调资本开支、网络安全、互操作性和人才短缺是采用的真实刹车。WEF 和 BCG 明确指出，传统机器人仍受高集成成本和有限适应性拖累。A3
              说明了这在客户层面的重要性：SMMs 往往需要灵活、高混合度解决方案，却仍受劳动力准备度和可负担性困扰。KPMG 又叠加了数据信任问题——制造商正在快速采用
              AI，但许多企业仍不信任底层数据基础。净结果是：市场有清晰的长期增长，也有清晰的短期落地风险。Vention 的方向与这道方程的胜出一侧一致，但估值仍应折价反映战略兴趣与可重复部署经济性之间的缺口。
