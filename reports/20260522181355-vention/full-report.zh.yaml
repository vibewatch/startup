  - id: TV005
    title: 投资逻辑破裂与终止触发器
    columns:
      - 触发器
      - 信号
      - 监测来源
      - 影响
    rows:
      - - 收入增长放缓
        - 任何披露的同比增速低于 20%，并连续两个季度持续
        - 公司新闻稿、BetaKit、行业报道
        - 基准情景向悲观情景侵蚀；退出倍数压缩
      - - NRR / 留存恶化
        - 任何披露的 NRR 低于 90%，或 GRR 证据显示显著流失
        - 公司文件（若提交 IPO）、投资人沟通
        - 平台标准化叙事破裂；估值重定至 4–6x
      - - OT/ICS 安全事件
        - CISA 公告点名 Vention 产品，或确认 MachineCloud 漏洞影响客户工厂
        - CISA 公告、SEC Form 8-K（若上市）、安全研究
        - 投资逻辑立即破裂；产品责任、监管调查、客户流失连锁发生
      - - EU AI Act 执法行动
        - 监管调查，或 GRIIP / Rapid OperatorAI 在欧盟辖区被合规拦截
        - EU AI Office 通知、德国监管机构、EMEA 媒体
        - EMEA 扩张暂停；R&D 成本上升；约 20% 可触达市场承压
      - - 下轮降价融资
        - Series E 或过桥轮估值低于隐含 $550M+ USD
        - 公司新闻稿、投资人数据库、BetaKit
        - 证实投资逻辑走弱；现有优先股堆叠增加额外压力
      - - 竞争对手平台标准化
        - Rockwell、Siemens 或 ABB 以有竞争力价格推出可信 AI 原生全栈平台
        - 行业媒体、展会公告、客户赢单 / 输单披露
        - 竞争护城河收窄；平台溢价侵蚀；退出倍数压缩
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
    notes: 触发器是绑定公开披露的监测启发式，不是管理层指引；私下尽调拿到队列和利润率数据后，应重新校准阈值。
  - id: TV006
    title: 最终尽调清单
    columns:
      - 尽调要求
      - 理由
      - 严重性
      - 与投资逻辑的关联
    rows:
      - - FY2023–FY2025 经审计财务报表（按收入流拆分收入、毛利率、EBITDA、现金、烧钱速度）
        - 核心承保缺口；除收入运行率说法外没有公开财务数据
        - 阻断
        - 收入质量、利润率画像、现金跑道；三种情景都必须具备
      - - 股权结构表和优先股堆叠（按投资人类别列示清算瀑布）
        - $263M+ USD 累计融资可能形成优先股堆叠压力；普通股回报取决于清算瀑布
        - 阻断
        - 入场纪律；回报建模；降价融资敏感性
      - - 过去 4 个季度的净留存率（NRR）和总留存率（GRR）
        - 平台标准化投资逻辑需要企业账户内可持续扩张
        - 阻断
        - 乐观情景需要 NRR >110%；低于 90% 触发悲观情景
      - - 前 10 大客户收入集中度和合同条款
        - Boeing、L'Oréal、Lockheed Martin 等具名客户可能掩盖高集中度
        - 重大
        - 集中度风险评估；续约管线；多站点承诺可见度
      - - GRIIP 和 Rapid OperatorAI 的 EU AI Act 合规路线图
        - 高风险 AI 系统分类触发强制合格评定；EMEA 扩张取决于合规
        - 重大
        - EMEA 收入轨迹；监管风险缓释
      - - Series D 信贷额度条款、契约和维持测试
        - BetaKit 确认存在小额信贷额度；条款、贷款方和契约包未披露
        - 重大
        - 流动性风险；潜在契约触发；相对股权的结构性优先级
      - - 过去 4 个季度的软件 ARR、硬件收入和服务收入拆分
        - 收入质量和毛利率画像高度取决于结构；没有拆分就无法承保混合模式
        - 阻断
        - 基准和乐观情景利润率假设；可比公司倍数选择
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV039
      - CV040
      - CV041
      - CV042
    notes: 尽调要求按承保重要性排序；“阻断”项是把公开证据下的观察立场转化为可投资价格判断的前提。
