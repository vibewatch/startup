      - number: '7.3'
        title: 运营、质量、网络安全与供应链风险
        blocks:
          - type: paragraph
            body: >-
              Vention 同时是硬件制造商、云平台运营商和物理 AI 部署方，这决定了它的运营风险。 每一层都有不同的失效模式。网络安全上，NIST SP 800-82r3 和 CISA 指引都强调，云连接
              工业控制系统风险更高：OT 环境最初并不是按互联网连接来设计，老旧协议往往缺少认证， 在存量基础设施上叠加新的云系统，会把攻击面复合放大。Vention 的 MachineCloud 正是 这种架构：带
              Wi-Fi、LTE 和 Ethernet 连接的 MachineMotion AI 控制器，把数据发往 托管在 AWS 的云系统，也从云系统接收指令。MachineCloud 被攻破，或
              MachineMotion AI 控制器遭遇供应链攻击，都可能在客户工厂内造成实体运动控制错误，使风险后果成倍放大。 以公司阶段看，Vention 的安全姿态相对强：ISO 27001 认证、面向美国联邦客户的
              NIST 800-171 合规、英国 Cyber Essentials、TLS 1.2/1.3 加密、私有 PKI、自动备份、渗透测试， 以及公开漏洞披露政策。不过，MachineCloud 连接的
              MachineMotion AI 设备的 ioXt 认证 和 CAIQ 发布仍被安全页面列为路线图事项，意味着设备级 IoT 安全尚未获得独立认证。 供应链上，关键硬件风险是 NVIDIA
              芯片可得性：MachineMotion AI 基于 NVIDIA Orin NX16 GB 和 Orin Nano 8 GB 处理器，NVIDIA Jetson 供应如果中断，包括美中贸易限制或 ITAR
              邻近出口管制，都会直接卡住硬件制造。实物硬件制造以 Montréal 配送中心为基础； 铝型材模块化零件和 EtherCAT 电机系统的可靠性，取决于未公开的底层零部件供应商。
              公开记录没有发现产品召回、安全事故或现场可靠性故障，但机器部署量超过 25,000 台后， 现场事故的精算概率会随规模上升。Vention 销售条款把保修限制在产品本身，并提供含
              支持服务的标准服务计划；但所复核摘录未公开限制后果性或间接损害赔偿，这给保险和 保修准备金需求留下不确定性。AWS 基础设施集中意味着，一旦 AWS 出现长时间宕机 （US-East 或
              US-West，取决于部署），所有依赖云的部署都会中断 MachineCloud 连接， 使用实时远程监控或 AI 推理的客户会受到运营影响。
