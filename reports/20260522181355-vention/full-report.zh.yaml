              Seating）、管道与包装（McAlpine）、木工（Cripps & Sons）以及航天太阳能生产（Solestial）。这些案例意味着，Vention
              同时卖给中小企业和更先进的工业运营商，而不是只服务一个狭窄机器人单元细分。买方和用户地图也很多样。一些故事强调希望自编程或建立内部能力的一线工程师和业主经营者，另一些则强调想要合作伙伴快速共同设计并部署定制方案的工厂团队。公开地域证据仍然单薄，但方向上有用：BetaKit
              报道称，客户在美国、欧洲和加拿大的分布为 70/20/10。更广义上，Vention 持续重复平台规模数字——25,000 台机器、4,000 家工厂和 4,000
