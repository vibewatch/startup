  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重性排序
        blocks:
          - type: paragraph
            body: >-
              Vention 的风险面横跨五类：监管/法律、运营/质量/安全、合作伙伴/依赖、财务/模型，以及团队/执行。 截至 2026 年 5 月，残余敞口最高的是 EU AI Act 合规：工业机器人里的物理 AI
              安全部件在 EU AI Act 下被归为高风险，该法案已在 2025 年 8 月进入全面合规义务期，而 Vention 的 GRIIP 和 Rapid OperatorAI 把 AI
              嵌入工厂环境中的运动控制和自主任务执行。Vention 尚未 公开披露这些 AI 系统的 CE 标识或合格评定流程，公司又在推进 EMEA 扩张，德国 GmbH 实体 已经设立。紧随其后的是 OT/ICS
              网络安全：Vention 的 MachineCloud 借助 AWS 基础设施把 工厂机器连到互联网，CISA 指引明确把云连接 OT 设备列为高风险，因为传统 ICS 环境最初 并不是为互联网暴露而设计。第三是
              NVIDIA 芯片集中度：MachineMotion AI 运行在 NVIDIA Orin NX16 GB 或 Orin Nano 8 GB 处理器上，使物理 AI 能力在硬件层面依赖单一供应商。
              合作伙伴集中度还延伸到协作机器人编程里的 Universal Robots，以及全部云托管所依赖的 AWS。财务风险不低，但 2026 年 1 月 $110 M USD Series D
              部分缓释了这一点；不过公司 仍未盈利，硬件 COGS 和持续研发投入让业务保持资本密集。人才风险真实存在，但鉴于 Vention 披露的领导层梯队和 Montréal 工程人才供给，并不紧迫。截至本报告日期，复核
              的公开记录没有发现公开负面事件——没有诉讼、没有泄露、没有产品召回、没有监管执法； 但没有公开证据不等于记录干净，若干尽调路径仍待补齐。
