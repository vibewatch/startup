      - number: '7.2'
        title: 监管、法律、IP 与隐私风险
        blocks:
          - type: paragraph
            body: >-
              最具结构性意义的监管风险是 EU AI Act。欧盟委员会的 AI Act 已于 2025 年 8 月全面生效，把产品和关键基础设施中的 AI 安全部件归为高风险 AI。Vention 的物理 AI
              产品——GRIIP（Generalized Physical AI Pipeline）、MachineMotion AI 和 Rapid OperatorAI—— 把 AI
              推理接入真实工厂里的运动控制和自主操作决策。AI Act 文本明确写明，机器人辅助 装配等产品中的 AI 应用，如果构成基于 AI 的安全部件，可能落入高风险类别。高风险 AI
              系统在欧盟部署前，需要有记录的风险评估、高质量训练数据集、人类监督措施、稳健性和 网络安全控制、详细技术文档，以及 CE 合格评定。Vention 安全页面确认其信息安全通过 ISO 27001，并引用
              Cyber Essentials 认证以满足英国合规，但公开证据没有显示 GRIIP 或 Rapid OperatorAI 已完成 EU AI Act 合格评定。另一个层面是 EU Machinery
              Regulation 2023/1230，该法规将在 2027 年初取代 Machinery Directive，并为机械和 AI 系统引入 更新后的安全要求；这些欧盟合规义务正好与 Vention 的 EMEA
              扩张重叠。在 OSHA 29 CFR 1910.217 及相关机械法规下，Vention 用于美国工厂的设备必须符合相应机械防护和动力 压力机标准；MachineMotion AI 数据表确认符合 EN ISO
              13849-1:2023，并达到 Performance Level e 安全等级，这是正面因素，但机器人单元集成会带来系统级责任，范围超出控制器 本身。隐私风险真实存在但已有部分缓释：Vention
              安全页面称平台符合 GDPR 和魁北克 Privacy Act（Law 25），加拿大的 PIPEDA 也适用于跨境个人数据流。订阅条款明确写明 客户拥有其数据，Vention
              只能在交付订阅服务所必需的范围内使用。标准 URL 无法访问 DPA 或隐私政策页面，留下独立核验缺口。出口管制风险存在但大概率可管理：加拿大 出口管制法（Export and Import Permits
              Act）覆盖两用物项，带 AI 芯片的 自动化控制器若发往受限目的地，可能需要出口许可；不过 Vention 业务重点仍是成熟的 OECD 制造业市场。IP 风险尚无法量化：公开记录未找到专利申请，Vention
              也未披露其 模块化硬件设计和物理 AI 方法是否有已授权专利，或依赖商业秘密保护。来自竞争对手 （Rockwell、Siemens、ABB、NVIDIA 生态伙伴）的 IP 敞口也未被公开评估。
