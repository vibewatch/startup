chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              Vention is a Montréal-based industrial automation company founded in 2016 that now operates through North
              American and European headquarters in Montréal and Berlin. Across its homepage, About page, and Series D
              materials, the company consistently frames itself as an AI-powered full-stack automation platform rather
              than a narrow robot OEM: customers can design, program, deploy, and operate automated equipment and robot
              cells inside a single cloud workflow. The core value proposition is time compression. Vention says
              manufacturers can move from concept to deployment in days instead of months, aided by MachineBuilder for
              AI-assisted CAD, MachineLogic for robot and machine programming, and MachineCloud for deployment and
              ongoing support. The current public footprint is meaningful: Vention says it has more than 25,000 machines
              in the field, more than 4,000 factories on the platform, and coverage across more than 25 manufacturing
              industries. Those headline metrics, together with the Berlin entity disclosures and the 2026 funding push
              into EMEA, establish Vention as a cross-border growth-stage platform company with both software and
              physical automation exposure rather than a single-site systems integrator.
