  - id: TV005
    title: Thesis-break and kill triggers
    columns:
      - Trigger
      - Signal
      - Monitoring Source
      - Impact
    rows:
      - - Revenue growth deceleration
        - Any disclosed YoY growth rate below 20% sustained for two quarters
        - Company press releases, BetaKit, industry coverage
        - Base case erodes toward bear; exit multiple compression
      - - NRR / retention deterioration
        - Any disclosed NRR below 90% or GRR evidence of significant churn
        - Company filings (if IPO filed), investor communications
        - Platform standardization narrative breaks; valuation re-rates to 4–6x
      - - OT/ICS security incident
        - CISA advisory naming Vention products, or confirmed MachineCloud breach affecting customer factories
        - CISA advisories, SEC Form 8-K (if public), security research
        - Immediate thesis-break; product liability, regulatory investigation, customer churn cascade
      - - EU AI Act enforcement action
        - Regulatory investigation or compliance block on GRIIP or Rapid OperatorAI in EU jurisdiction
        - EU AI Office notices, German regulatory authority, EMEA press
        - EMEA expansion paused; R&D costs increase; ~20% of addressable market at risk
      - - Down-round financing
        - Series E or bridge round at valuation below implied $550M+ USD
        - Company press releases, investor databases, BetaKit
        - Confirms thesis weakening; existing preference stack creates additional overhang
      - - Competitor platform standardization
        - Rockwell, Siemens, or ABB launches a credible AI-native full-stack platform at competitive price
        - Industry press, trade show announcements, customer win/loss disclosures
        - Competitive moat narrowed; platform premium erodes; exit multiple compresses
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
    notes: >-
      Triggers are monitoring heuristics tied to public disclosures and not management guidance; thresholds should be
      recalibrated once private diligence provides cohort and margin data.
  - id: TV006
    title: Final diligence asks
    columns:
      - Diligence Ask
      - Rationale
      - Severity
      - Thesis Linkage
    rows:
      - - Audited financial statements FY2023–FY2025 (revenue by stream, gross margin, EBITDA, cash, burn)
        - Core underwriting gap; no public financial data beyond run-rate claim
        - Blocking
        - Revenue quality, margin profile, runway; required for all three scenario cases
      - - Cap table and preference stack (liquidation waterfall by investor class)
        - $263M+ USD cumulative raised creates potential preference overhang; common equity returns depend on waterfall
        - Blocking
        - Entry discipline; return modeling; down-round sensitivity
      - - Net revenue retention (NRR) and gross revenue retention (GRR) for trailing 4 quarters
        - Platform standardization thesis requires durable expansion within enterprise accounts
        - Blocking
        - Bull case requires >110% NRR; bear case triggered below 90%
      - - Top-10 customer revenue concentration and contract terms
        - Named logos (Boeing, L''Oréal, Lockheed Martin) could mask high concentration
        - Material
        - Concentration risk assessment; renewal pipeline; multi-site commitment visibility
      - - EU AI Act compliance roadmap for GRIIP and Rapid OperatorAI
        - >-
          High-risk AI system classification triggers mandatory conformity assessment; EMEA expansion depends on
          compliance
        - Material
        - EMEA revenue trajectory; regulatory risk mitigation
      - - Series D credit facility terms, covenants, and maintenance tests
        - BetaKit confirmed small credit facility exists; terms, lender, and covenant package not disclosed
        - Material
        - Liquidity risk; potential covenant triggers; structural seniority relative to equity
      - - Software ARR, hardware revenue, and services revenue split for trailing 4 quarters
        - >-
          Revenue quality and gross margin profile depend critically on mix; hybrid model cannot be underwritten without
          breakdown
        - Blocking
        - Base and bull case margin assumptions; comparable-company multiple selection
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV039
      - CV040
      - CV041
      - CV042
    notes: >-
      The asks are ranked by underwriting materiality; “blocking” items are prerequisites for converting the
      public-evidence track stance into an investable price view.
