companyProfile:
  summary: >
    Vention is a Montréal-based industrial automation company founded in 2016 by Étienne Lacroix and Max Windisch. The
    company combines cloud design software, code-capable programming, modular hardware, deployment tooling, and newer
    physical-AI products to help manufacturers design, program, deploy, and operate custom or turnkey automation systems
    in days instead of months. Public evidence supports meaningful operating momentum — more than 25,000 machines across
    4,000+ factories, a late-2025 C$100M run-rate claim, and a January 2026 $110M USD Series D — but detailed disclosure
    on revenue mix, gross margin, retention, cash, burn, and the preference stack remains private.
