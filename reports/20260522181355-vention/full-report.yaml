  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and severity ranking
        blocks:
          - type: paragraph
            body: >-
              Vention’s risk surface spans five domains: regulatory/legal, operational/quality/security,
              partner/dependency, financial/model, and people/execution. The highest-residual-exposure risk as of May
              2026 is EU AI Act compliance: physical-AI safety components in industrial robots are classified high-risk
              under the EU AI Act, which entered full compliance obligations in August 2025, and Vention’s GRIIP and
              Rapid OperatorAI products embed AI into motion control and autonomous task execution in factory
              environments. Vention has not publicly disclosed a CE-marking or conformity-assessment process for these
              AI systems, and the company is mid-EMEA expansion with a German GmbH entity already in place. A close
              second is OT/ICS cybersecurity: Vention’s MachineCloud connects factory machines over the internet using
              AWS infrastructure, and CISA guidance explicitly identifies cloud-connected OT devices as high-risk
              because legacy ICS environments were not designed for internet exposure. Third is NVIDIA chip
              concentration: MachineMotion AI runs on NVIDIA Orin NX16 GB or Orin Nano 8 GB processors, creating a
              single-vendor dependency for the physical-AI capability at the hardware layer. Partner concentration
              extends to Universal Robots for collaborative-robot programming and AWS for all cloud hosting. Financial
              risk is significant but partially mitigated by the January 2026 $110 M USD Series D, though the company
              remains pre-profitability and capital-intensive given hardware COGS and ongoing R&D investment. Talent
              risk is real but not acute given Vention’s disclosed leadership bench and Montréal engineering pipeline.
              No public adverse event — no litigation, no breach, no product recall, no regulatory enforcement — was
              found across the reviewed public record as of this date, but absence of public evidence is not the same as
              a clean record; several diligence paths remain open.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
