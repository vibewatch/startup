      - number: '7.7'
        title: Mitigations, kill criteria, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Vention’s most important risk mitigation is the strength of its certification and compliance posture
              relative to peers: ISO 27001 certification, NIST 800-171 compliance for US federal, Cyber Essentials for
              UK, MachineMotion AI with IEC 60529 IP54 industrial rating, and EN ISO 13849-1 Performance Level e
              machinery safety are credible baselines. The vulnerability disclosure policy and bug-bounty-adjacent
              reward program show security-team maturity. The capital cushion from the January 2026 Series D reduces
              near-term financial risk. NVIDIA’s direct equity participation via NVentures reduces (but does not
              eliminate) chip-supply risk. The biggest unresolved risks are the EU AI Act conformity gap, the
              device-level IoT certification gap (ioXt not yet achieved), the unverified IP protection posture, and the
              absence of audited financial metrics on burn rate, margin, and NRR. Kill criteria include: (1) a EU
              regulator finding that GRIIP or Rapid OperatorAI must undergo a formal conformity assessment and Vention
              is found non-compliant — this would block EMEA revenue; (2) a confirmed security breach or physical safety
              incident tied to MachineCloud connectivity in a customer factory — this would trigger product liability
              claims and reputational damage; (3) NVIDIA Jetson platform discontinuation or export restriction reducing
              MachineMotion AI chip supply — this would require a multi-quarter hardware redesign; (4) a Series E
              capital raise at a markedly lower valuation (down-round) or failure to raise, signaling deteriorating
              revenue quality or burn concern; (5) loss of CEO or CSO without a visible successor. Thesis-break triggers
              that do not by themselves constitute kill criteria but require monitoring include: EMEA revenue share
              falling below 10% by end-2026 (failure to execute expansion); software NRR falling below 90% (retention
              deterioration); any public cybersecurity advisory naming Vention products (CISA ICS advisory); and US
              industrial capex declining materially in H2 2026 due to tariff-induced budget freezes.
