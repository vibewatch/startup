        title: Customer segments, buyers, and the visible adoption surface
        blocks:
          - type: paragraph
            body: >-
              Vention’s public customer record is strongest where it names specific manufacturers and shows what job
              they automated. Across the reviewed stories, the customer base spans e-commerce and fulfillment (The
              Feed), apparel manufacturing (Safari Sun), industrial seating (Sears Seating), plumbing and packaging
              (McAlpine), woodworking (Cripps & Sons), and space-solar production (Solestial). Those references imply
              Vention is selling into both SMEs and more advanced industrial operators, not one narrow robot-cell niche.
              The buyer and user map also looks varied. Some stories emphasize hands-on engineers and owner-operators
              who want to self-program or build internal capability, while others emphasize factory teams that want a
              partner to co-design and deploy a custom solution quickly. Public geography evidence remains thin but
              directionally useful: BetaKit reported a 70/20/10 customer split across the U.S., Europe, and Canada. More
              broadly, Vention continues to repeat platform-scale numbers—25,000 machines, 4,000 factories, and
              4,000-plus customers—but those aggregate claims are still weaker than the named story-level evidence
              because they do not reveal paying-account quality, contract size, or retention.
