      - number: '3.4'
        title: Moat Durability, Commoditization Risk, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The durable part of Vention’s position is not any one robot arm or single workflow. It is the combination
              of integrated design software, modular hardware marketplace, simulation, deployment logic, and current
              scale on the platform. That combination can be hard for buyers to replicate internally. The vulnerable
              part is that several competitors attack specific layers of the stack with sharper economic or technical
              narratives. Formic attacks financing and time-to-value at the end of the line. Tulip attacks regulated
              digital workflow ownership. READY and Wandelbots attack robot-programming abstraction and multi-brand
              flexibility. OnRobot attacks tool modularity and component compatibility. Hirebotics attacks narrow
              fabrication workflows with a smartphone-first user experience and disclosed payback. Incumbents attack
              trust and channel breadth. None of those threats individually make Vention obsolete, but together they
              point to the real adverse signal: Vention must keep proving that integrated full-stack convenience beats
              best-of-breed unbundling. If the market keeps moving toward open, robot-agnostic orchestration and
              capital-light service models, parts of Vention’s moat can commoditize faster than its growth narrative
              implies.
