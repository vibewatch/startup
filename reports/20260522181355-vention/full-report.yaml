      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Remaining Gaps
        blocks:
          - type: paragraph
            body: >-
              The demand case for Vention’s market is strong but not frictionless. Labor scarcity, energy costs, policy
              support, and software-defined automation are all pushing manufacturers toward more modular, AI-enabled
              systems. IFR’s 2024 dataset shows robotics demand remaining structurally high, with 542,000 units
              installed globally and forecasts to exceed 700,000 by 2028. Consultant outlooks also suggest 2026 is the
              beginning of a renewed growth cycle after a soft 2025. Yet multiple sources preserve the downside. Mordor
              highlights capex, cybersecurity, interoperability, and talent scarcity as real brakes on adoption. WEF and
              BCG explicitly say traditional robots still suffer from high integration costs and limited adaptability.
              A3 shows why this matters at the customer level: SMMs often need flexible, high-mix solutions but still
              struggle with workforce readiness and affordability. KPMG adds a data-trust problem on top of
              that—manufacturers are adopting AI quickly, but many still do not trust the data foundations underneath
              it. The net result is a market with clear secular growth and clear near-term implementation risk. Vention
              is directionally aligned with the winning side of that equation, but its valuation should still discount
              the gap between strategic interest and repeatable deployment economics.
