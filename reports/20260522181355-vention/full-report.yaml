  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Vention does not sit inside a single clean analyst bucket. The company sells a full-stack factory
              automation workflow that spans design, programming, controls, pre-engineered cells, deployment, and
              operational support. That makes the broadest relevant market the factory automation and industrial
              controls category, while the narrowest defensible lens is industrial automation software. The correct
              analytical move is to preserve those layers rather than collapse them into one oversized TAM. Broad
              categories matter because buyers still compare Vention against status-quo alternatives such as custom
              system integration, incumbent PLC and SCADA stacks, and standalone robot projects that require separate
              design and commissioning tools. But the company’s practical wedge is narrower: software-defined, modular,
              quickly deployed automation for discrete-manufacturing workflows where time-to-value and cross-site
              standardization matter. This boundary logic also clarifies what to exclude. Pure ERP or back-office
              software is out. Consumer robots are out. Process-only automation layers that never touch Vention’s
              design-to-deployment workflow are out. The chapter therefore uses multiple market lenses and makes the
              transformations explicit instead of implying one generic “large market” number answers every diligence
              question.
