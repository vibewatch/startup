      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map fragments by company size and workflow complexity. Small and mid-sized manufacturers tend to
              begin with a narrow use case—machine tending, sanding, labeling, inspection, or one robot cell—and care
              most about financing flexibility, integration burden, and whether an operator can learn the system without
              a large automation staff. That is why A3 highlights RaaS, cobots, and scalable cells as the practical
              on-ramp for SMMs. Larger enterprises behave differently. They want standardized hardware and software that
              can be deployed repeatedly across plants, which is why Vention’s own materials emphasize centralized
              project management, shared machine specifications, and cross-site visibility. A third buyer group is the
              advanced technical user—developers, roboticists, and system integrators—who care about programmability,
              CLI support, and interoperability with their existing engineering stack. Across all three segments, the
              adoption path follows a common sequence: scope the workflow, define ROI and requirements, model the
              machine digitally, simulate and program it, deploy it to the floor, then operate with analytics and remote
              support. What changes is who signs off and what friction dominates: SMMs fight budget and skills scarcity,
              enterprises fight standardization and governance complexity, and advanced users fight toolchain
              flexibility and integration depth.
