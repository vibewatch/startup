      - number: '7.3'
        title: Operational, quality, cybersecurity, and supply chain risk
        blocks:
          - type: paragraph
            body: >-
              Vention’s operational risk is shaped by the fact that it is simultaneously a hardware manufacturer, a
              cloud platform operator, and a physical-AI deployer. Each layer carries distinct failure modes. On
              cybersecurity, NIST SP 800-82r3 and CISA guidance both highlight that cloud-connected industrial control
              systems face elevated risk because OT environments were not originally designed with internet connectivity
              in mind, legacy protocols often lack authentication, and brownfield deployments layering new cloud systems
              on old infrastructure create compounded attack surfaces. Vention’s MachineCloud creates exactly this
              architecture: MachineMotion AI controllers with Wi-Fi, LTE, and Ethernet connectivity send data to and
              receive commands from cloud systems hosted on AWS. A compromise of MachineCloud or a supply-chain attack
              on a MachineMotion AI controller could result in physical motion control errors inside a customer factory,
              making this a consequence-multiplied risk. Vention’s security posture is relatively strong for its stage:
              ISO 27001 certified, NIST 800-171 compliance for US federal customers, Cyber Essentials for UK, TLS
              1.2/1.3 encryption, private PKI, automated backups, penetration testing, and a published vulnerability
              disclosure policy. However, ioXt certification for MachineCloud-connected MachineMotion AI devices and the
              CAIQ publication are listed as roadmap items on the security page, meaning device-level security is not
              yet independently certified for IoT. On supply chain, the key hardware risk is NVIDIA chip availability:
              MachineMotion AI is built on NVIDIA Orin NX16 GB and Orin Nano 8 GB processors, and any disruption to
              NVIDIA Jetson supply (including US-China trade restrictions or ITAR-adjacent export controls) would
              directly constrain hardware manufacturing. Physical hardware manufacturing is distribution-center-based in
              Montréal; reliability of aluminum-extrusion modular parts and EtherCAT motor systems depends on underlying
              component suppliers that are not publicly disclosed. No product recalls, safety incidents, or field
              reliability failures were found in the public record, but with 25,000+ machines deployed, the actuarial
              probability of a field incident increases with scale. Product liability under Vention’s terms of sale
              limits Vention’s warranty to the product itself and provides a standard service plan with support
              services, but the terms do not publicly cap consequential or indirect damages in the reviewed excerpts — a
              gap that creates uncertainty about insurance and warranty reserve requirements. AWS infrastructure
              concentration means a prolonged AWS outage (US-East or US-West depending on deployment) would interrupt
              MachineCloud connectivity for all cloud-dependent deployments, creating operational impact for customers
              using real-time remote monitoring or AI inference.
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
