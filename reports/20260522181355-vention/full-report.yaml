        - id: f3
          label: Yes — $226B+ market, 10.5% CAGR, reshoring wave
          type: positive
        - id: f4
          label: Product-market fit confirmed?
          type: gate
        - id: f5
          label: Yes — C$100M run-rate, 4,000+ factories, enterprise logos
          type: positive
        - id: f6
          label: Financial disclosure sufficient?
          type: gate
        - id: f7
