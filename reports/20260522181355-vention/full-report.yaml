      Starting from the top-level question of whether Vention is investable at the implied $550M–$1.1B USD valuation,
      the flow branches on five evidence gates — market evidence, product-market fit, financial disclosure, comparable
      multiples, and risk profile — converging on a track outcome pending private diligence.
