            figureRef: FR001
            claimRefs: []
      - number: '7.2'
        title: Regulatory, legal, IP, and privacy risk
        blocks:
          - type: paragraph
            body: >-
              The most structurally significant regulatory risk is the EU AI Act. The European Commission’s AI Act,
              fully in force since August 2025, classifies AI safety components in products and critical infrastructure
              as high-risk AI. Vention’s physical-AI products — GRIIP (Generalized Physical AI Pipeline), MachineMotion
              AI, and Rapid OperatorAI — route AI inference into motion control and autonomous manipulation decisions in
              live factory settings. The AI Act text is explicit that AI-based safety components of products such as AI
              applications in robot-assisted assembly can fall into the high-risk category. High-risk AI systems require
              documented risk assessment, high-quality training datasets, human oversight measures, robustness and
              cybersecurity controls, detailed technical documentation, and a CE conformity assessment before EU
              deployment. Vention’s security page confirms ISO 27001 for information security and cites a Cyber
              Essentials certification for UK compliance, but there is no public evidence of an EU AI Act conformity
              assessment for GRIIP or Rapid OperatorAI. Separately, the EU Machinery Regulation 2023/1230 (replacing the
              Machinery Directive in early 2027) introduces updated safety requirements for machinery and AI systems,
              adding another layer of EU compliance obligations that coincide with Vention’s EMEA expansion. Under OSHA
              29 CFR 1910.217 and related machinery regulations, Vention’s equipment used in US factories must comply
              with relevant machine-guarding and power-press standards; the MachineMotion AI datasheet confirms EN ISO
              13849-1:2023 compliance and a Performance Level e safety rating, which is positive, but robot cell
              integration creates system-level liability that extends beyond the controller alone. Privacy risk is real
              but partially mitigated: Vention’s security page says the platform complies with GDPR and the Quebec
              Privacy Act (Law 25), and Canada’s PIPEDA applies to cross-border personal data flows. The terms of
              subscription explicitly note that customers own their data and Vention may only use it as necessary to
              deliver the Subscribed Services. No DPA or privacy policy page was accessible at the standard URL,
              creating a gap in independent verification. Export control risk is present but likely manageable: Canadian
              export control law (Export and Import Permits Act) covers dual-use goods, and automation controllers with
              AI chips may require export permits for shipments to restricted destinations, though Vention’s business
              focuses on established OECD manufacturing markets. IP risk is unquantified: no patent filings were found
              in the public record, and Vention has not disclosed whether its modular hardware designs and physical-AI
              methods carry issued patents or rely on trade-secret protection. IP exposure from competitors (Rockwell,
              Siemens, ABB, NVIDIA ecosystem partners) has not been publicly assessed.
            claimRefs:
