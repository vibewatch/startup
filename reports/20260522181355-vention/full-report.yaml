      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation is inferred, not confirmed
            body: >-
              Vention has not publicly disclosed its post-money Series D valuation in any accessible jurisdiction. All
              enterprise value figures in this chapter are derived from dilution-assumption modeling on the $110M USD
              raise and cross-checked against public comparable multiples. They should not be treated as confirmed
              market prices.
            calloutType: assumption
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: callout
            title: Financial opacity is the primary underwriting blocker
            body: >-
              No audited revenue, gross margin, NRR, burn rate, or cap table data is publicly available. The run-rate
              claim from BetaKit and company-provided traction metrics provide directional signal but are insufficient
              to underwrite return expectations without private diligence.
            calloutType: risk
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
          - type: callout
            title: Physical-AI timing and capital position support the bull case
            body: >-
              The January 2026 Series D, NVIDIA''s NVentures participation, and the IFR World Robotics 2025 data on
              global robot installations collectively support the thesis that Vention is well-positioned at the
              intersection of the reshoring wave and the physical-AI adoption cycle.
            calloutType: strength
            claimRefs:
              - CV004
