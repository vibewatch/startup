  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, monetization surfaces, and pricing transparency
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to Vention as a hybrid automation business rather than a clean SaaS company. The
              website, MachineBuilder and MachineCloud surfaces, and marketplace press materials all point to a stack
              that spans design software, partner-certified and proprietary hardware, deployment tooling, and
              post-installation support. The clearest public monetization evidence is not a public price sheet for
              complete systems; it is the process itself. Vention says customers can start designing for free, generate
              a digital twin, watch bill of materials and pricing update in real time, then move through self-checkout
              and deployment. Subscription services also exist, with an enterprise package that adds custom SLAs,
              priority response, on-site support, and a named technical contact. Terms of subscription show that plans
              are contractual and renewable, but they still stop short of revealing ARPU, attachment rates, or the split
              between software, hardware, and services. Relative to peers, Vention is more transparent than a
              traditional quote-only integrator at the BOM stage, but far less transparent than software-native vendors
              like Tulip or turnkey productized sellers like Hirebotics when an investor tries to infer realized revenue
              or gross margin.
