      - number: '1.3'
        title: Funding History, Investors, and Disclosure Quality
        blocks:
          - type: paragraph
            body: >-
              Vention’s financing history shows a steady progression from early Canadian automation startup to globally
              backed growth company. The company raised a CA$17 million Series A in January 2019 led by Bain Capital
              Ventures, then a C$38 million Series B in June 2020 led by Georgian, then a US$95 million Series C in May
              2022 with Georgian again leading and Fidelity joining, and finally a US$110 million Series D announced in
              January 2026 with Investissement Québec, Desjardins Capital, Fidelity Investments Canada ULC, and
              NVentures named publicly. Third-party databases additionally show a 2023 late-stage extension, effectively
              a Series C-II, with Fonds de solidarité FTQ participating, though the accessible amount is not public.
              That creates the first important diligence caveat: cumulative capital is easy to bracket but not perfectly
              reconciled across sources because some outlets report USD totals, others report CAD totals, and database
              pages expose a Series D plus a same-day line of credit. Tracxn and CB Insights converge around roughly
              $263 million in total funding, while BetaKit frames the same capital stack as more than C$300 million
              after adding a small credit facility. The investor base is therefore clearly institutional and deep, but
              the exact current preference stack still requires private diligence.
