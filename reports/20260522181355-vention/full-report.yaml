      - number: '2.2'
        title: Sizing Lenses, Geographic Focus, and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence supports three usable lenses rather than one precise answer. First, the broad
              global factory automation and industrial controls market is very large, with Mordor at USD 338.46 billion
              in 2026 and Coherent at USD 261.23 billion for a somewhat different industrial automation boundary.
              Second, the software layer that most closely maps to Vention’s platform logic is much smaller, at USD
              43.87 billion in 2026 per Mordor’s industrial automation software view. Third, the company’s actual
              go-to-market geography is concentrated in North America and Europe, where robot penetration and policy
              support are high even if regional estimates come from different frameworks. Europe alone is a USD 74.07
              billion market in Mordor’s 2026 view, while Coherent assigns North America 40.8% share of its broader
              automation market. This means the right takeaway is not a single TAM, SAM, SOM stack based on one report.
              The right takeaway is that Vention operates at the intersection of a large broad automation capex pool, a
              smaller software-centric orchestration layer, and a geographically concentrated buyer set with
              above-average robot density and policy tailwinds. The exact Vention-specific SAM remains a diligence gap.
