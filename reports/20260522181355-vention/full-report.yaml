      - number: '7.4'
        title: Partner, supplier, and platform dependency risk
        blocks:
          - type: paragraph
            body: >-
              Vention’s product architecture creates a dense dependency map that is both a strength and a concentration
              risk. The deepest single-point dependency is NVIDIA: both the MachineMotion AI and MachineMotion AI Pro
              controllers are built on NVIDIA Orin processors (NX16 GB or Nano 8 GB), making NVIDIA the sole AI-chip
              supplier for Vention’s physical-AI capability. If NVIDIA modifies Jetson platform roadmaps, raises OEM
              prices, or restricts shipments, Vention would face a hardware redesign cycle measured in months to years.
              The relationship appears commercially reinforced — NVIDIA’s NVentures participated in the January 2026
              Series D, and NVIDIA announced Vention as a physical-AI deployment partner at GTC 2025 — but equity stakes
              do not guarantee chip allocation or price stability. Universal Robots (Teradyne) is the named robot
              partner for physical-AI integration and was featured with Vention at Interpack 2026; a UR relationship
              disruption or UR platform deprecation would remove the most visible co-branded integration. ABB is listed
              as a second robot partner from Demo Day 2024 materials. AWS is the cloud hosting provider; Vention’s
              security page explicitly names Amazon Web Services as the sole trusted cloud provider. IQ (Investissement
              Québec), which led the Series D, and Desjardins Capital add government and co-operative capital that
              carries reputational and political dependencies for a Québec-based firm, though this is not an operational
              risk in the near term. Customer concentration risk exists but cannot be quantified: Boeing, L’Oréal, and
              Lockheed Martin are publicly named as customers, but their revenue contribution and renewal status are not
              disclosed. Geography concentration is visible — BetaKit confirmed 70% US, 20% Europe, 10% Canada — meaning
              a US market slowdown or tariff disruption disproportionately affects revenue. Canadian manufacturing
              survey data showed that US tariff uncertainty in 2025–2026 was creating budget hesitation among
              manufacturers; while Vention’s hardware is Canadian-designed and assembled, its customer base’s
              capital-equipment budgets are sensitive to US industrial policy. The recent IFR data shows global robot
              installations have doubled over ten years, which supports Vention’s market thesis, but also means
              established OEM robotics companies are scaling competing automation solutions.
