      - number: '8.4'
        title: Public company comparables, private round references, and M&A benchmarks
        blocks:
          - type: paragraph
            body: >-
              The most relevant public comparables for Vention span a spectrum from large-cap traditional automation
              platforms to high-growth AI-augmented automation software. Rockwell Automation (NYSE: ROK) is the closest
              structural comp as a full-stack industrial automation company with both hardware and software segments: as
              of May 22, 2026, Rockwell traded at a $50.3B market capitalization against approximately $8.1B in fiscal
              2025 revenue, implying a ~6.2x EV/revenue multiple. Rockwell's Software & Control segment earns 29.7%
              operating margin versus Lifecycle Services at 14.5%, illustrating the margin dispersion that Vention's
              undisclosed revenue mix makes hard to benchmark. Symbotic (Nasdaq: SYM), an AI-enabled warehouse and
              supply-chain automation platform, is a useful comp for AI-augmented automation premium pricing: Symbotic
              traded at a $32.6B market cap on May 22, 2026, against $2.247B in fiscal 2025 revenue, a ~14.5x multiple —
              one of the highest in public automation. Symbotic reported $676M in Q2 fiscal 2026 revenue (+23% YoY) and
              adjusted EBITDA of $78M, showing that AI automation platforms can command significant revenue premiums
              when growth and margin expansion coexist. Teradyne (Nasdaq: TER), parent of Universal Robots — Vention's
              primary cobot partner — filed its 2025 annual report in February 2026 covering the period ended December
              31, 2025; TER's industrial automation segment provides a revenue-mix reference for
              collaborative-robot-adjacent platforms. On the private side, Bright Machines has raised multiple rounds
              for a software-defined modular manufacturing automation platform that overlaps with Vention's positioning;
              while its most recent valuation is not publicly confirmed at time of writing, its fundraising trajectory
              as a Series B+ private company provides a reference for capital formation in the space. Private market M&A
              data suggests acquisition multiples of 10–18x trailing revenue for high-growth industrial software
              platforms; Roland Berger noted in its January 2026 update that transaction activity showed signs of life
              in 2024 and that "Europe and North America continue to dominate as target and buyer regions." The key
              divergence between Vention and its public comps is scale: Rockwell and Symbotic generate orders of
              magnitude more revenue, so direct multiple extrapolation without a private-company growth premium would
              understate Vention's addressable upside while the hardware mix would reduce the software-premium argument.
            claimRefs:
