      - number: '5.3'
        title: Deployment, safety, security, and trust controls
        blocks:
          - type: paragraph
            body: >-
              On trust and quality controls, Vention’s public evidence is more substantive than many private automation
              companies but still incomplete. The strongest proof is security- and hardware-specific. Vention says it
              obtained ISO 27001 certification for the processes and resources supporting the Manufacturing Automation
              Platform, explicitly naming MachineScope, MachineBuilder, MachineLogic, MachinePortal, MachineApps, and
              MachineCloud. It also discloses a roadmap for NIST 800-171, ioXt for MachineMotion devices, and future
              CAIQ publication. On the product side, the MachineMotion AI manual documents TLS 1.2 and 1.3 for secure
              remote access, safety notices, hazard symbols, and a detailed statement that the integrator—not Vention
              alone—remains responsible for full-system risk assessment, validation, and training. That is a realistic
              industrial posture, not a software-style promise of turnkey safety by default. The resulting view is
              balanced. Vention has clear public documentation on controller safety and platform security frameworks,
              but it does not publish the kind of uptime history, service-status reporting, or operational incident
              transparency that would make reliability evaluation straightforward for an outside investor.
