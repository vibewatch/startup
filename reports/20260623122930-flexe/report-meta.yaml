  topStrengths:
  - Large North American network with 800+ operators and 3,000+ locations accessible
    through one integration.
  - Clear enterprise positioning in omnichannel fulfillment, retail distribution,
    and network-capacity use cases.
  - Continued productization into data and market-intelligence tools such as the Spot
    Warehousing Index.
  topRisks:
