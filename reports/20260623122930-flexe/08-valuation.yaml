  - id: TV002
    title: Investment Thesis vs. Anti-Thesis
    columns:
      - Dimension
      - Thesis (Positive View)
      - Anti-Thesis (Negative View)
      - What Would Change the View
    rows:
      - - Market position
        - "3,000+ facility network and 6-of-top-10 US retailer penetration represent multi-year
          moat; first-mover in on-demand enterprise warehousing"
        - "Network is operator-dependent not owned; GXO/Stord/Amazon offer institutional
          alternatives; rising industrial vacancy reduces spot scarcity premium"
        - Independent SLA/NPS data by facility; confirmed customer retention rate; vacancy
          impact on Flexe take-rate disclosed
      - - Financial scale
        - "$91–97M ARR (tracker consensus) represents genuine enterprise demand; Deloitte Fast
          500 confirmation of multi-year growth"
        - "No audited financials; ~18% estimated gross margin precludes SaaS multiple;
          Deloitte rank 236→370 signals growth deceleration"
        - Audited FY2025 income statement with gross margin ≥30% and NRR ≥110% per confirmed
          customer cohort data
      - - Product/technology
        - "Orchestration layer plus 20+ integrations creates switching cost; Forrester ROI study
          validates enterprise demand-side value at 124% ROI"
        - "Software layer thin vs WMS-native competitors (Stord, ShipBob); no SOC 2 confirmed;
          technology moat undemonstrated in competitive displacement"
        - SOC 2 Type II report; confirmed TCV per enterprise account; integration depth audit
          vs Stord and ShipBob
      - - Financing and governance
        - "Secondary market implies $1.36B; Prologis Ventures investor provides strategic exit
          optionality; existing institutional investor syndicate (BlackRock, T. Rowe Price)"
        - "No primary round in 4+ years; burn rate and cash balance undisclosed; 71% cumulative
          workforce reduction signals cash pressure; preference stack on $205M–$330M raised"
        - Confirmed bridge/credit facility; audited cash and 18-month runway; management
          representation letter; full cap table with preference terms
      - - Valuation entry
        - "Stord $3B Series F resets sector benchmarks; secondary premium of 35% signals
          private market demand; strategic acquirer network premium possible"
        - "$1B = 10–11x EV/ARR vs 0.54–1.7x public logistics comps; 2022-cohort unicorns down
          52% on average; paper unicorn risk if no financing by 2027"
        - Entry price ≤$700M with confirmed preference haircut; or new primary round at reset
          valuation; or named M&A process with indicated value above $900M
    notes: >-
      Thesis/anti-thesis pairs are author assessments based on public evidence as of June 2026.
      No company-confirmed financial data is available to resolve key disputes.

  - id: TV003
    title: Bull / Base / Bear Scenario Analysis
    columns:
      - Scenario
      - Key Assumptions
      - Implied EV Range ($M)
      - Return Logic
      - Key Risk
      - Probability Signal
    rows:
      - - Bull — strategic acquisition premium
        - "ARR grows to $130M by 2027; gross margin improves to 30%+; strategic acquirer
          (Prologis or large 3PL) pays 10–13x forward ARR for network premium; logistics
          SaaS re-rating from operational proof"
        - $1,100–$1,700
        - "13x × $130M = $1.69B ceiling; ~20–25% IRR plausible at entry ≤$700M; requires
          negotiated entry below last round"
        - No confirmed M&A process or named acquirer; Stord at $3B makes relative pricing
          harder; gross margin improvement unproven
        - Low — requires multiple favorable outcomes simultaneously; no current public evidence
          of M&A process
      - - Base — fair-value reset with tech premium
        - "ARR grows to $110M by 2027; gross margin holds at 18–22%; M&A exit at 5–7x ARR
          for tech-enabled 3PL comp; no secondary premium; entry price reset from $1B"
        - $470–$770
        - "6x × $110M = $660M midpoint; ~15–20% IRR requires entry at $450–$500M;
          consistent with PCE M&A TEV/Rev 1.7x plus technology premium"
        - Requires new primary round or negotiated discount; no confirmed revenue trajectory
          beyond tracker estimates
        - Medium — consistent with comparable set; requires entry price discipline
      - - Bear — distressed or down-round
        - "Revenue flat or declining; gross margin compresses to <15%; down-round or distressed
          M&A at 52% discount to last mark (consistent with 2022-cohort average per CNBC/
          PitchBook); buyer pool limited by Amazon 3PL expansion and competitive displacement"
        - $250–$500
        - "3–4x ARR at $80–100M; $480M midpoint consistent with 52% compression from $1B;
          negative returns from $1B entry; breakeven near $450M entry"
        - Likeliest outcome if no financing event or credible exit by mid-2027; 71% workforce
          reduction history makes continued service quality maintenance uncertain
        - Medium-high — current trajectory (stale round, opaque finances, competitive pressure)
          favors this outcome absent new evidence
    notes: >-
      All scenario valuations are author estimates derived from public comparable data and
      third-party ARR estimates. Probability signals are qualitative assessments of available
      public evidence, not actuarial estimates.

  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Comparable
      - Type
      - Key Metric
      - Multiple / Valuation
      - Relevance to Flexe
      - Limitation
    rows:
      - - "GXO Logistics (NYSE: GXO)"
        - Public contract logistics
        - EV/Revenue 2026E
        - 0.54–0.81x
        - Asset-light enterprise contract logistics platform; largest direct public analog;
          FY2025 revenue $13.2B, EV/EBITDA 7.9–11.6x
        - Orders-of-magnitude larger; public market pricing; EBITDA margins 7–8%; implies
          Flexe fundamental floor of $51–$76M at this multiple
      - - "C.H. Robinson (NASDAQ: CHRW)"
        - Public asset-light 3PL brokerage
        - EV/Revenue 2026E
        - ~1.4x
        - Pure asset-light logistics brokerage at scale ($16–17B revenue); comparable
          transaction model and margin structure
        - Revenue $16B+ at 1.4x; applied to $94M Flexe ARR yields $132M implied value
      - - "XPO Inc. (NYSE: XPO)"
        - Public asset-based LTL carrier
        - EV/Revenue 2026E
        - 3.3–3.6x
        - Provides logistics sector premium ceiling; LTL network and asset ownership drive
          multiple not applicable to Flexe
        - Asset-based model; premium not transferable to asset-light brokerage/tech model
      - - Stord (private)
        - Private on-demand logistics (Series F May 2026)
        - Valuation vs estimated ARR
        - ~$3B / ~$120M est. (≈25x ARR)
        - Direct on-demand warehousing and fulfillment competitor; most recent large sector
          financing event; Ware2Go integration added density
        - Stord's May 2026 round at current market prices vs Flexe's 4-year-stale mark;
          Stord likely shows higher NRR/margin from integrated WMS; $3B sets 3x premium
          over Flexe $1B last mark
      - - ShipBob (private)
        - Private tech-enabled fulfillment 3PL
        - Valuation vs estimated revenue
        - ~$1B / ~$215M est. (≈4.7x ARR)
        - eCommerce fulfillment competitor with similar hybrid tech+services model;
          more recent operating data available
        - SMB/DTC focus vs Flexe's enterprise; different customer concentration profile;
          ShipBob's lower implied multiple vs ARR is a direct comp signal
      - - Asset-light logistics platforms M&A
        - M&A transaction benchmark (PCE Investment Bankers 2025–2026)
        - TEV/Revenue (strategic buyer)
        - ~1.7x
        - Best-quality differentiated asset-light platforms; strategic buyer median;
          Flexe at $94M ARR yields $160M implied at this multiple
        - Requires demonstrated differentiation and profitability proof; floor for
          differentiated seller, not ceiling
      - - Logistics SaaS premium (TMS/WMS)
        - Public SaaS benchmark (Windsor Drake Q1 2026)
        - EV/Revenue 2026
        - 8.2–10.5x
        - Mission-critical software with embedded workflow lock-in, >40% gross margin,
          strong NRR; ceiling for Flexe if software layer proves sticky
        - Flexe's ~18% gross margin disqualifies it from this range; would require
          fundamental business model transformation
      - - Private SaaS median (tech-enabled, B2B)
        - Private market benchmark (Aventis Advisors 2026)
        - EV/Revenue 2026
        - 4.7–6.1x
        - Upper bound for Flexe if technology platform confirmed dominant vs services;
          applies a modest private discount to public SaaS median of 6.1x
        - Flexe's hybrid model (tech + physical logistics services) likely trades at
          discount to pure-SaaS; gross margin constraint persists
    notes: >-
      All public company multiples are as of June 2026 per Stock Analysis, Multiples.vc,
      Yahoo Finance, and MarketScreener. Private company valuations are from press releases
      and third-party trackers; not audited. M&A benchmarks from PCE Investment Bankers Q4
      2025 Transportation and Logistics M&A Update.
