  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Revenue decline confirmed
        - "ARR falls below $75M (>20% decline from $91–97M est. base)"
        - Destroys multiple expansion case; prevents any M&A premium; forces distressed
          scenario; makes base EV range $225–$300M
        - Exit position; trigger immediate full due diligence; no new capital at any
          multiple above 3x ARR
      - - Financing failure (no new round by end 2026)
        - "No confirmed equity round, credit facility, or bridge financing by December 2026
          — marking 4.5+ year hold since Series D"
        - Cash runway may be critically low; preference for insider or distressed M&A at
          large discount; workforce further reduced
        - Do not invest without bridge confirmation; request management liquidity
          representation as first diligence step
      - - Major customer defection
        - "Loss of 2+ Fortune 500 accounts representing >20% of estimated GMV with
          public announcement or supply chain press coverage"
        - Enterprise concentration thesis broken; network effect reversed; remaining
          revenue base insufficient for tech multiple
        - Immediate thesis reconsideration; require independent churn data; reduce
          target multiple by 2–3x
      - - Competitor displacement event
        - "Named enterprise customer migrates to Stord, GXO, or Amazon 3PL with
          confirmed public announcement"
        - Demonstrates switching cost assumption is weaker than thesis assumes;
          reduces defensibility of network moat claim
        - Re-benchmark competitive moat assumption; reduce target entry multiple by
          1–2x; require Flexe win-rate data before proceeding
      - - Gross margin confirmed below 12%
        - "Audited or management-reviewed gross margin disclosed below 12%
          (vs ~18% current third-party estimate)"
        - Path to profitability becomes extremely long; SaaS re-rating impossible;
          fundamental value gravitates to 1.7x TEV/Rev M&A floor ($160M)
        - Downgrade to Avoid; $1B valuation collapses entirely; only exit thesis is
          distressed M&A or strategic acquisition at network value
    notes: >-
      Trigger thresholds are indicative and derived from public industry analogues; Flexe
      has not disclosed internal risk management frameworks. All thresholds should be
      calibrated against confirmed ARR and gross margin data obtained in diligence.

  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Audited financials
        - "FY2024 and FY2025 audited income statement; gross margin; operating burn;
          contribution margin by product line"
        - Third-party ARR estimates unaudited; actual gross margin determines which
          multiple range applies; burn determines runway; difference between $470M and
          $1.7B valuation scenario
        - Request audited statements from Flexe CFO; if unavailable request management
          accounts with independent accountant review; minimum 3-year P&L
      - - Cash and runway
        - "Current cash balance; monthly burn rate; next financing timeline; any bridge,
          venture debt, or insider round not publicly disclosed"
        - 4+ year hold since Series D with no confirmed financing; runway uncertainty
          is the single largest downside risk; cash exhaustion triggers distressed scenario
        - Obtain management representation on cash and runway; bank statement
          confirmation for most recent quarter; ask directly about any pending term sheets
      - - Customer retention economics
        - "Net revenue retention (NRR); gross revenue retention; top-5 customer revenue
          share and contract durations; cohort expansion data"
        - NRR >110% would justify mid-range tech multiple; NRR <90% confirms commodity
          pricing and structural churn risk that collapses the bull case
        - Request customer-level revenue data from enterprise dashboard; calculate NRR
          from management-provided cohort data; confirm if top 2 customers are still active
      - - Cap table and preference stack
        - "Full cap table as of Q1 2026; Series D liquidation preference terms; anti-
          dilution provisions; investor rights agreement; any triggered pay-to-play"
        - "Liquidation preferences on $205M–$330M raised absorb exit proceeds below
          $500–700M; critical for return modeling at any entry price; post-layoff governance
          changes may have triggered investor consent rights"
        - Request current cap table and investor rights agreement; confirm no outstanding
          anti-dilution adjustments; verify board composition has not changed materially
      - - Competitive win/loss data
        - "Win rate vs Stord, GXO, and ShipBob in competitive enterprise bids; reason
          codes for lost deals; customer NPS by program type"
        - Competitive moat is the central thesis differentiator; no public evidence of
          win rate or switching-cost magnitude; Stord's $3B valuation signals it is winning
        - Request last 12-month CRM data on competitive wins and losses; ask for customer
          reference contacts at 3+ named accounts; obtain NPS survey results
      - - Operator network quality
        - "Operator SLA compliance rates; quality audit results; ejection rates; service
          variance by geography; incident escalation log (12 months)"
        - Flexe's enterprise promise rests on third-party operator execution; 800+
          independent operators create asymmetric brand risk; no public quality metrics
        - Request operator performance dashboard; contractual SLA terms with operators;
          12-month incident log; sample of operator contracts with performance clauses
    notes: >-
      Diligence topics ordered by materiality to valuation judgment. Items 1–3 are blocking
      for any investment; items 4–6 are required before finalizing structure. No company-
      confirmed data resolves any of these gaps as of the report date.

callouts:
  - calloutType: strength
    title: Enterprise network density is a genuine but underexplored strategic asset
    body: >-
      Flexe's 800+ operator, 3,000+ facility network represents years of contracting,
      on-boarding, and relationship investment that cannot be replicated quickly. If
      customer-verified and backed by quality metrics, this network moat could support a
      valuation premium above the asset-light 3PL comp floor. The Forrester TEI study
      confirms enterprise buyers generate real ROI, and 6-of-top-10-US-retailer penetration
      (if independently verified) represents a concentrated sales asset for a potential
      strategic acquirer seeking retailer relationships at scale.
    claimRefs:
      - CV038
      - CV001

  - calloutType: risk
    title: Four-year stale $1B mark in a market that has repriced 50–68%
    body: >-
      Flexe's last confirmed valuation was set at the peak of the 2022 private market cycle.
      CNBC and PitchBook data from June 2026 shows 2022-cohort companies trading at
      approximately 52% below last round values on average. Against $91–97M ARR, the $1B
      mark requires a 10–11x EV/ARR multiple that no comparable public logistics company
      supports. Without a new primary round establishing a current market mark, the $1B
      figure is an accounting artifact rather than a market price, and any investment
      diligence must independently establish entry price.
    claimRefs:
      - CV023
      - CV010
      - CV036

  - calloutType: recommendation
    title: Track at current mark; conditions for Buy require price reset and financial proof
    body: >-
      Flexe merits sustained monitoring as one of the largest independent on-demand
      warehousing platforms in North America, but the current $1B mark is stretched relative
      to all available comparable evidence. The conditions for upgrading to Buy are specific
      and measurable: (1) entry price at or below $700M with confirmed preference alignment,
      (2) audited gross margin above 30%, (3) NRR above 110%, or (4) a named M&A process
      with indicated value above $900M. Absent any of these signals, capital discipline
      requires patience.
    claimRefs:
      - CV034
      - CV037

figures:
  - id: FV001
    title: Flexe Investment Recommendation Logic Chain
    type: flow
    layout: wide
    summary: >-
      Traces the evidence chain from network scale, customer proof, financial state,
      competitive risk, and valuation assessment to the final Track / Research-More
      recommendation.
    claimRefs:
      - CV034
      - CV035
      - CV036
    data:
      nodes:
        - id: network-scale
          label: "Network Scale"
          detail: "800+ operators, 3,000+ facilities, 6-of-top-10 US retailers; multi-year
            relationship moat; hard to replicate quickly"
        - id: customer-proof
          label: "Customer & Revenue Proof"
          detail: "$91–97M ARR est.; Forrester 124% ROI; Nike/Target/Lowe's logos;
            Deloitte Fast 500 confirmed"
        - id: financial-state
          label: "Financial & Governance State"
          detail: "No confirmed round since Jul 2022; 71% workforce reduction; opaque burn;
            $205M–$330M raised with unknown preference stack"
        - id: competitive-risk
          label: "Competitive & Market Pressure"
          detail: "Stord $3B May 2026; GXO 10.8% FY2025 growth; Amazon 3PL expansion;
            warehousing vacancy 7.4% compressing spot premium"
        - id: valuation-assessment
          label: "Valuation Assessment"
          detail: "$1B mark = 10–11x EV/ARR; logistics comps 0.54–1.7x; SaaS comps 4.7–6.1x;
            2022-cohort unicorns down 52% avg (CNBC/PitchBook 2026)"
        - id: recommendation
          label: "Track / Research-More — Stretched"
          detail: "Unicorn mark unsupported by comparable evidence; monitor for price reset,
            next financing event, or profitability proof; conditions for Buy are explicit"
      edges:
        - from: network-scale
          to: recommendation
          label: "Positive but insufficient alone"
        - from: customer-proof
          to: recommendation
          label: "Validates demand; does not resolve multiple"
        - from: financial-state
          to: recommendation
          label: "Opaque runway = high uncertainty premium"
        - from: competitive-risk
          to: recommendation
          label: "Stord premium + market headwinds = downside pressure"
        - from: valuation-assessment
          to: recommendation
          label: "10x EV/ARR vs 1.7x–5x comp → stretched"

  - id: FV002
    title: Flexe Implied Valuation Sensitivity to EV/ARR Multiple
    type: bar
    layout: wide
    summary: >-
      Shows how Flexe's implied enterprise value varies across five EV/ARR multiples applied
      to the $94M midpoint ARR estimate, spanning asset-light 3PL floor to last-round implied
      multiple.
    approximationNotes: >-
      ARR midpoint of $94M derived from GetLatka $91.1M and Growjo $97.1M third-party estimates;
      neither is audited. Asset-light 3PL multiple from PCE M&A benchmark (1.7x). Tech-enabled
      3PL (5x) and private SaaS floor (6x) from Windsor Drake Q1 2026 and Aventis Advisors.
      SaaS premium (8x) from Windsor Drake premium TMS/WMS range. Last-round implied (10.6x)
      derived from $1B ÷ $94M ARR.
    claimRefs:
      - CV010
      - CV017
      - CV018
      - CV028
      - CV029
    data:
      items:
        - label: "Asset-light 3PL M&A floor (1.7× ARR)"
          value: 160
          unit: "$M"
          note: "PCE M&A TEV/Rev benchmark; best-quality differentiated platforms"
        - label: "C.H. Robinson public comp (1.4×)"
          value: 132
          unit: "$M"
          note: "CHRW EV/Rev 2026E; pure asset-light logistics brokerage"
        - label: "Tech-enabled 3PL blended (5× ARR)"
          value: 470
          unit: "$M"
          note: "Base scenario; technology premium above asset-light comp; gross margin ~18%"
        - label: "Private SaaS floor (6× ARR)"
          value: 564
          unit: "$M"
          note: "Aventis Advisors private SaaS median floor; requires confirmed software moat"
        - label: "Logistics SaaS premium (8× ARR)"
          value: 752
          unit: "$M"
          note: "Windsor Drake premium range; requires gross margin >40% — not supported"
        - label: "Last-round implied (10.6× ARR)"
          value: 1000
          unit: "$M"
          note: "Implied by $1B Series D mark at $94M midpoint ARR; no comp supports this"

  - id: FV003
    title: Flexe Bull / Base / Bear Valuation Range
    type: range
    layout: wide
    summary: >-
      Three-scenario valuation range spanning $250M (bear distressed exit) to $1.7B (bull
      strategic acquisition premium), with the base scenario of $470M–$770M most consistent
      with current comparable evidence.
    approximationNotes: >-
      All values are scenario estimates, not company-confirmed or audited. ARR growth assumptions
      and multiple rationale stated in TV003. Bear scenario anchored to 52% 2022-cohort average
      compression (CNBC/PitchBook June 2026). Base scenario anchored to 5–7x tech-enabled 3PL
      blended multiple on projected $110M ARR. Bull requires strategic acquirer paying network
      premium beyond current comp range.
    claimRefs:
      - CV030
      - CV031
      - CV032
    data:
      items:
        - label: "Bear — distressed / down-round scenario"
          low: 250
          mid: 400
          high: 500
          unit: "$M"
          note: "3–4x ARR; 52% discount to $1B consistent with 2022-cohort average compression"
        - label: "Base — tech-enabled 3PL fair-value reset"
          low: 470
          mid: 620
          high: 770
          unit: "$M"
          note: "5–7x EV/ARR × $94–$110M est. ARR; entry price discipline required"
        - label: "Bull — strategic acquisition with network premium"
          low: 1000
          mid: 1250
          high: 1700
          unit: "$M"
          note: "10–13x forward ARR; requires strategic acquirer; above current comp evidence"

