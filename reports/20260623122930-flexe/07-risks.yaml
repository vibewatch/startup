  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financing-runway
      missingEvidence: "Flexe current cash position, burn rate, monthly runway estimate, and whether any bridge financing or venture debt has been arranged since the July 2022 Series D"
      whyItMatters: "Without confirmed runway, it is impossible to assess whether Flexe can continue investing in competitive differentiation, rebuilding workforce, or operating at current enterprise SLA commitments through a potential investment close and hold period"
      diligencePath: "Request audited or management-reviewed financial statements for FY2023, FY2024, and FY2025; obtain management representation on current cash balance and runway projection; ask directly whether any bridge, debt, or insider round has occurred"
      relatedQuestionRefs: [QR005, QR012, QR028]

    - type: private-evidence-only
      severity: blocking
      topic: operator-quality-performance
      missingEvidence: "Flexe operator SLA compliance rates, quality audit results, network ejection rates, service variance by geography, and incident escalation data"
      whyItMatters: "Flexe's enterprise promise rests entirely on third-party operator execution; operator quality is the primary operational risk variable and no public metrics exist to assess it; asymmetric brand risk requires documented quality controls"
      diligencePath: "Request operator performance dashboard from Flexe management; assess contractual SLA terms with operators; ask for 12-month incident log and service-level adherence data"
      relatedTableRefs: [TR003]
      relatedQuestionRefs: [QR022]

    - type: private-evidence-only
      severity: material
      topic: post-layoff-headcount
      missingEvidence: "Flexe current total headcount by function (engineering, customer success, operations, sales, finance) and staffing ratios relative to enterprise customer count"
      whyItMatters: "71% cumulative workforce reduction across two WARN Act events leaves the functional capacity of Flexe's enterprise delivery organization uncertain; customer success staffing directly affects service quality and churn"
      diligencePath: "Request current org chart and headcount by function; obtain CSM-to-customer ratio and implementation queue data; assess open roles and time-to-fill for engineering and operations"
