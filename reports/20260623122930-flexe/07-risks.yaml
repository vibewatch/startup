figures:
  - id: FR001
    title: Flexe Risk Heatmap — Likelihood vs. Impact vs. Residual Severity
    type: matrix
    layout: wide
    summary: >
      Rates Flexe's seven primary risk categories on likelihood, impact, residual severity after
      known mitigations, and current mitigation maturity based on public evidence available
      as of June 2026.
    data:
      columns:
        - Likelihood
        - Impact
        - Residual Severity
        - Mitigation Maturity
      rows:
        - label: "Market normalization / demand headwinds"
          values:
            - {label: "High — 16 qtrs rising vacancy; tariff volatility every 1.5 wks", tone: "negative"}
            - {label: "High — revenue growth headwind; TAM expansion slowdown", tone: "negative"}
            - {label: "Critical — structural not cyclical; no obvious near-term reversal", tone: "negative"}
            - {label: "Low — Spot Warehousing Index adds data but not demand", tone: "negative"}
        - label: "Competitive pressure (GXO, Stord, Amazon)"
          values:
            - {label: "High — Stord $3B, GXO 10.8% growth, Flowspace launching", tone: "negative"}
            - {label: "High — margin compression; customer win rate pressure", tone: "negative"}
            - {label: "High — differentiation eroding as incumbents adopt tech platforms", tone: "negative"}
            - {label: "Low — no confirmed competitive moat metric or win-rate data", tone: "negative"}
        - label: "Third-party operator failure"
          values:
            - {label: "High — 800+ independent operators; no disclosed quality controls", tone: "negative"}
            - {label: "High — SLA breach → enterprise churn; brand concentration at Flexe", tone: "negative"}
            - {label: "Critical — no operator performance data or public mitigation framework", tone: "negative"}
            - {label: "Low — no public SLA scorecard, audit, or ejection-rate data", tone: "negative"}
        - label: "Workforce / execution capacity"
          values:
            - {label: "High — confirmed 71% cumulative staff reduction in 2023–2024", tone: "negative"}
            - {label: "High — reduced CSM and engineering capacity; slower implementation", tone: "negative"}
            - {label: "High — current headcount unknown; residual risk unquantifiable", tone: "negative"}
            - {label: "Emerging — continued product launches suggest some recovery", tone: "neutral"}
