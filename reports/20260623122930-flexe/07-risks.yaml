      Shows how Flexe's primary risk events propagate through operational capacity, customer
      relationships, revenue, and ultimately financing and valuation. Key transmission paths
      highlight the layoff-to-service-quality chain and the market-normalization-to-revenue chain
      as the two highest-severity cascades.
    data:
      nodes:
        - id: layoff-event
          label: "Workforce Reduction Events (33% 2023, 38% 2024)"
          detail: "Confirmed via WARN Act filings; 71% cumulative headcount reduction"
        - id: reduced-ops-capacity
          label: "Reduced Operational & CSM Capacity"
          detail: "Fewer customer success, implementation, and operations staff to serve enterprise accounts"
        - id: service-degradation
          label: "Service Quality Degradation / Implementation Delays"
          detail: "Enterprise deployments slower; SLA monitoring reduced; customer experience at risk"
        - id: market-normalization
          label: "Market Normalization / Warehousing Stagflation"
          detail: "Rising vacancy + elevated lease rates compress spot premium; tariff volatility delays program launches"
        - id: competitive-pressure
          label: "Competitive Pressure (GXO, Stord, Flowspace)"
          detail: "Incumbents and well-funded peers offer competing enterprise logistics platforms at aggressive pricing"
        - id: revenue-headwind
          label: "Revenue Growth Headwind"
          detail: "Slower program launches, price compression, and potential churn reduce revenue growth rate"
        - id: financing-pressure
          label: "Financing / Runway Pressure"
          detail: "No confirmed round since July 2022; 4+ year hold increases investor exit pressure"
        - id: valuation-pressure
          label: "Valuation Mark-Down / Down-Round Risk"
          detail: "Revenue miss + investor pressure + comparable multiple compression → sub-$1B mark risk"
      edges:
        - from: layoff-event
          to: reduced-ops-capacity
          label: "Headcount directly reduces operational throughput"
        - from: reduced-ops-capacity
          to: service-degradation
          label: "Fewer staff → slower implementations, less SLA monitoring"
        - from: service-degradation
          to: revenue-headwind
          label: "Service issues → churn, slower new-logo closes"
        - from: market-normalization
          to: revenue-headwind
          label: "Spot premium compression + tariff paralysis reduce program launches"
