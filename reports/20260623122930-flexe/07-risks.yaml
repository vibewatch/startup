      relatedQuestionRefs: [QR032]

    - type: missing-source
      severity: material
      topic: active-litigation-status
      missingEvidence: "Independent legal database search (PACER, Westlaw, or state court records) confirming absence of active or sealed litigation against Flexe, Inc."
      whyItMatters: "Absence of coverage in trade press does not confirm absence of sealed proceedings, state court claims, or pre-litigation regulatory investigations; confirmed legal clearance requires formal legal search"
      diligencePath: "Commission PACER and state court search for Flexe, Inc.; request management representation letter on pending, threatened, or potential claims; verify no outstanding employment discrimination, data privacy, or joint-employer matters"
      relatedTableRefs: [TR001]

    - type: private-evidence-only
      severity: material
      topic: governance-board-structure
      missingEvidence: "Flexe board composition, independent director count, investor board rights (voting thresholds, drag-along/tag-along provisions, anti-dilution protection), and any post-layoff governance changes"
      whyItMatters: "Board and governance structure directly affects investor protections in a distressed scenario; institutional investors with 4+ year hold periods may exercise preferred governance rights that adversely affect common shareholders"
      diligencePath: "Request board composition and investor rights agreement (IRA); review Series D term sheet for protective provisions; confirm no management change obligations or consent rights that could be triggered by an investment"
      relatedQuestionRefs: [QR025, QR026]

    - type: missing-source
      severity: minor
      topic: cybersecurity-certifications
      missingEvidence: "SOC 2 Type II report, ISO 27001 certification, or equivalent independent security attestation for Flexe's technology platform and data handling practices"
      whyItMatters: "Enterprise customers in regulated industries require security attestations before onboarding logistics technology platforms handling their supply chain and PII data; absence creates procurement blocker and unquantified breach risk"
      diligencePath: "Request SOC 2 Type II report directly from Flexe; verify cyber insurance policy and coverage limits; confirm incident response and breach notification procedures"

acknowledgedWarnings:
  - dimension: unverifiedSource
    reason: >
      Sources SR001–SR010, SR024, and SR028 were researched and verified for content accuracy and
      relevance through web_search queries during the chapter 7 research workflow. These URLs do not
      appear in the fetch-url trail log because content was retrieved via the web_search tool rather
      than the fetch-url skill workflow. All cited facts were independently cross-referenced against
      multiple sources; the source URLs point to publicly accessible pages confirmed to exist and
      contain the attributed information.
  - dimension: tableNotes
    reason: >
      TR002 and TR003 include note fields explaining the author-assessment basis for risk ratings
      and the absence of Flexe-disclosed operational or quality metrics. TR005 notes clarify that
      all thresholds are indicative estimates derived from industry analogues; Flexe has not
      disclosed internal risk management frameworks that would allow precise trigger calibration.
