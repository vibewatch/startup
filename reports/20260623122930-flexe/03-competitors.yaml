- id: FP003
  title: Moat / readiness KPIs — Flexe competitive durability summary
  type: kpi
  layout: compact
  summary: Six evidence-backed competitive durability indicators for Flexe as of mid-2026. Items mix confirmed metrics and analyst-derived assessments.
  approximationNotes: >-
    Revenue and valuation figures are third-party estimates from Compworth (not audited). Headcount
    change from Compworth and Supply Chain Dive reporting. Network size from Flexe product pages.
    Valuation gap calculated from Stord $3B vs Flexe $1B estimates (both third-party). Switching cost
    is from industry analysis, not a Flexe-disclosed figure.
  claimRefs:
  - CP001
  - CP025
  - CP026
  - CP033
  data:
    items:
    - label: "Flexe network coverage"
      value: "3,000+"
      unit: "warehouse partners"
      trend: stable
    - label: "Stord valuation premium over Flexe"
      value: "~3×"
      unit: "multiple ($3B vs $1B est.)"
      trend: adverse
    - label: "Flexe employee count change (prior year)"
      value: "-45%"
      unit: "headcount decline"
      trend: adverse
    - label: "Estimated enterprise switching cost per facility"
      value: ">$150K"
      unit: "one-time cost (industry estimate)"
      trend: stable
    - label: "Amazon MCF preferred pricing discount available"
      value: "up to 15%"
      unit: "off MCF outbound fees"
      trend: adverse
    - label: "Stord GMV vs Flexe estimated revenue ratio"
      value: "~155×"
      unit: "GMV-to-revenue differential"
      trend: adverse

callouts:
- calloutType: risk
  title: Stord's capital and valuation advantage is the single largest near-term competitive threat
  body: >-
    Stord's $250M Series F at $3B valuation (May 2026) means it has ~3× Flexe's estimated valuation
    and has raised ~3× Flexe's total capital. Stord's ~100 owned and operated fulfillment locations,
    $15B+ GMV, and Stord Labs AI initiative give it a product investment runway that Flexe — with an
    estimated ~$97M revenue and 45% headcount reduction — cannot match dollar-for-dollar. If Stord
    successfully moves upmarket toward enterprise customers (its Ware2Go acquisition was partly an
    enterprise-capacity play), Flexe's differentiation in enterprise overflow could erode meaningfully
    within 18–24 months.
  claimRefs:
  - CP001
  - CP007
  - CP025
  - CP026
  - CP031

- calloutType: strength
  title: Flexe's 80/20 model and Prologis partnership are defensible differentiators for enterprise buyers
  body: >-
    The 80/20 warehousing framework Flexe published in 2026 articulates a specific, evidence-backed
    value proposition for enterprise logistics leaders: use Flexe for the variable 20% of network
    capacity to eliminate "dead air" costs while keeping core DCs at 85–90% utilisation. This is a
    positioning that requires a 3,000+ warehouse network to execute, limiting replication by smaller
    platforms. The Prologis strategic partnership also provides enterprise credibility that Stord,
    Flowspace, and ShipBob cannot easily replicate.
  claimRefs:
  - CP027
  - CP033
  - CP036

