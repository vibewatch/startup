  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, independent-director composition, and founder voting-control details are not disclosed in reviewed public materials.
    whyItMatters: Governance structure determines oversight quality, succession resilience, and investor-control dynamics.
    diligencePath: Request board deck, cap-table governance summary, and list of current directors/observers from the company.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: Public trackers conflict on total funding raised and round count after the 2022 Series D.
    whyItMatters: Total invested capital affects ownership dilution, runway analysis, and valuation benchmarking.
    diligencePath: Request a cap-table-backed financing history and reconcile tracker entries against signed financing documents.
    relatedQuestionRefs:
    - QO011
    - QO025
    relatedTableRefs:
    - TO003
    - TO004
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Public headcount estimates range from roughly 201 to 400 and do not reconcile cleanly after the 2023-2024 layoffs.
    whyItMatters: Current employee base is important for burn, sales capacity, and post-restructuring execution assessment.
    diligencePath: Request current employee count by function and a monthly headcount bridge covering the layoff period.
    relatedQuestionRefs:
    - QO013
    - QO025
  - type: missing-source
    severity: material
    topic: financing-structure
    missingEvidence: No reviewed public source established whether Flexe has venture debt, secondary sales, or structured financing beyond primary equity rounds.
    whyItMatters: Non-primary financing can change liquidation preference, runway, and valuation interpretation.
    diligencePath: Ask management or lead investors for debt schedules, side letters, and any secondary transaction history since 2022.
    relatedQuestionRefs:
    - QO024
