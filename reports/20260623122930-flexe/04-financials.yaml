  rows:
  - - ARR / Annual Revenue (2024)
    - "$91.1M (GetLatka) to $97.1M (Growjo)"
    - Low — third-party tracker estimates; no company confirmation
    - Anchor for valuation multiple and growth-rate assessment
    - Request audited or management-confirmed ARR or GAAP revenue
  - - Revenue growth (3-year, 2020–2023)
    - "612% per Deloitte Fast 500 2023 data"
    - Medium — Deloitte Fast 500 based on company-supplied financials
    - Validates the scale-up during the 2020–2023 e-commerce boom
    - Confirm whether growth reflects net revenue or gross merchandise flows
  - - Estimated gross margin
    - "15–25%; asset-light platform benchmark"
    - Low — estimated from on-demand warehousing peer models; no Flexe disclosure
    - Central to capital efficiency and path-to-profitability assessment
    - Request COGS breakdown by warehouse-partner pass-through vs. platform operating costs
  - - Estimated monthly operating burn (post-2024 layoffs)
    - "$2.5M–$5.0M per month"
    - Low — estimated from headcount × average loaded compensation + infrastructure
    - Key to runway and capital-adequacy assessment
    - Request cash burn reconciliation from management; include non-headcount opex
  - - Estimated runway from Series D proceeds (hypothetical)
    - "~18–48 months from mid-2022 depending on burn rate assumption"
    - Low — no cash position disclosed; range covers plausible scenarios
    - Determines whether Flexe requires near-term capital
    - Request current cash balance, burn rate, and expected profitability timeline
  - - Customer Acquisition Cost (CAC)
    - Not publicly disclosed
    - Unknown
    - CAC/payback directly affects capital efficiency for growth
    - Request enterprise CAC and payback period from sales leadership
  - - Net Revenue Retention (NRR)
    - Not publicly disclosed
    - Unknown
    - NRR determines revenue durability; critical for a transactional model
    - Request NRR or gross churn data from customer success / finance
  - - Revenue per employee (estimated)
    - "$327K/employee (Growjo estimate; based on $97.1M / 296 employees)"
    - Low — relies on both revenue and headcount estimates being accurate
    - Proxy for operational efficiency; reasonable for a tech-services hybrid
    - Validate against management-confirmed headcount and revenue
  notes: >-
    All financial metrics except the Deloitte Fast 500 growth rate are estimated or third-party
    derived. Flexe does not publicly disclose unit economics. Gross margin and burn rate are
    modeled from industry benchmarks and headcount proxies. The hypothetical runway calculation
    assumes the Series D proceeds were the primary cash reserve and does not account for revenue
    contributions or other financing.
