    Revenue values are estimated from public pricing benchmarks and third-party research; Flexe
    does not publicly disclose per-stream revenue or realized rates. Status and quality are inferred
    from product descriptions and industry benchmarks for on-demand warehousing platforms. Diligence
    asks reflect missing private-data items required for underwriting.
