callouts:
- calloutType: risk
  title: Runway cannot be underwritten from public data
  body: >-
    The combination of no disclosed cash position, no fundraise since July 2022, and two major
    layoff rounds (totalling ~230 WARN-notified workers) creates a capital-adequacy gap that
    cannot be closed without direct access to Flexe's balance sheet and burn-rate schedule.
    The company's January 2024 "very strong cash position" statement is now 18+ months stale,
    and runway implications depend entirely on burn rate and revenue dynamics that are not
    publicly observable. Any investment thesis that requires confidence in Flexe's 12-month
    capital adequacy must resolve this data gap first.
  claimRefs:
  - CI021
  - CI033
  - CI034
  - CI043
- calloutType: risk
  title: Revenue quality is mixed — transactional model exposes ARR to demand cycles
  body: >-
    Flexe's usage-based, no-commitment pricing model is a strong marketing differentiator for
    customers but a revenue-quality challenge for investors. Unlike SaaS businesses with high
    net revenue retention and multi-year ACVs, Flexe's storage and fulfillment revenue is
    directly exposed to e-commerce demand cycles, retailer inventory normalization, and freight
    market softening — exactly the conditions that drove the 2023–2024 workforce reductions.
    The absence of NRR data and churn metrics means revenue durability cannot be quantified.
    The Deloitte Fast 500 rank decline from 236 (2023) to 370 (2024) is consistent with a
    deceleration in revenue growth even as the absolute base stabilized.
  claimRefs:
  - CI003
  - CI007
  - CI009
  - CI037
  - CI039
  - CI040
- calloutType: insight
  title: Forrester TEI validates demand-side economics but not supply-side margins
  body: >-
    The Forrester Total Economic Impact study (commissioned by Flexe) demonstrates that
    enterprise customers achieve compelling ROI (124% over 3 years, $97.4M NPV for a large
    composite customer). This validates the demand premise: customers are willing to pay for
    the flexibility Flexe provides because the alternative — fixed leases, long-term 3PL
    contracts, and captive distribution centres — carries substantial hidden costs. However,
    the TEI study does not constitute evidence of Flexe's gross margins or contribution
    economics; a customer saving $19M in capex does not translate directly to Flexe capturing
    margin on that saving. The supply-side margin question remains open.
  claimRefs:
  - CI025
  - CI026
  - CI027
  - CI042

