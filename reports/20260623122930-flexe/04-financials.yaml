  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-position
    missingEvidence: Current cash balance, trailing 12-month burn rate, and runway projections from Flexe management
    whyItMatters: Without cash and burn data, capital adequacy cannot be assessed; the January 2024 "very strong cash position" statement is 18+ months stale
    diligencePath: Request the most recent balance sheet and cash-flow statement from management; if unavailable, request a management-prepared burn-rate schedule
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Audited COGS breakdown showing warehouse-partner pass-through, platform labor, technology, and overhead
    whyItMatters: Gross margin determines path-to-profitability, capital intensity, and whether the business model is defensible under competitive pricing pressure
    diligencePath: Request P&L with COGS detail; compare warehouse-partner settlement rate to revenue; derive platform gross contribution margin
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: arr
    missingEvidence: Company-confirmed ARR or GAAP revenue figure with recognition policy
    whyItMatters: All revenue estimates ($91–97M) come from third-party trackers with no methodology transparency; without confirmation, valuation multiples and growth rates are unverifiable
    diligencePath: Request most recent two fiscal years of audited financial statements or a management-prepared financial summary with revenue recognition disclosure
    relatedQuestionRefs:
    - QI003
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, NRR, churn rate, LTV, and payback period broken down by customer segment
    whyItMatters: Without unit economics, sales efficiency and growth capital requirements cannot be modelled; transactional model may have higher churn than implied by company messaging
    diligencePath: Request customer success and finance data; focus on enterprise-program NRR vs. spot-transaction cohorts
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Flexe cap table showing round-by-round equity ownership, liquidation preference stack, and any secondary-market transactions
    whyItMatters: Total-funding discrepancy ($125M spread across trackers) and unknown liquidation preference stack make exit modeling and dilution analysis impossible
    diligencePath: Request cap table and investor rights agreement; reconcile with Reuters/trackers
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: stale
    severity: minor
    topic: valuation
    missingEvidence: Post-2022 valuation anchor from secondary-market transactions, 409A valuation, or new financing
    whyItMatters: The $1B unicorn valuation is from July 2022; four years of headcount reductions, no new raise, and competitive capital disadvantage likely impair the mark, but no current data exists
    diligencePath: Request most recent 409A or board-approved fair market value; check if secondary-market platforms have active bids
    relatedQuestionRefs:
    - QI006
  - type: private-evidence-only
    severity: material
    topic: investors
    missingEvidence: Board composition, voting control provisions, investor governance rights, and current ownership percentages for Series D and earlier investors
    whyItMatters: Without governance details, the control provisions of the investor rights agreement, board authority, and any blocking rights held by BlackRock, Tiger Global, or others cannot be assessed in diligence
    diligencePath: Request board composition, investor rights agreement, voting-control provisions, and any secondary transactions since the Series D closing in July 2022
    relatedQuestionRefs:
    - QI014
  - type: missing-source
    severity: minor
    topic: revenue-quality
    missingEvidence: Clarification from Flexe or Deloitte on whether the Fast 500 revenue figures submitted represent net platform revenue or gross warehousing throughput including pass-through costs
    whyItMatters: If the 612% growth rate and Fast 500 ranking are based on gross revenue including warehouse-partner pass-through, the metric is less meaningful for evaluating the platform business and its margin trajectory
    diligencePath: Request revenue recognition policy from Flexe CFO/COO; confirm whether Deloitte Fast 500 submissions were based on GAAP net revenue or gross billings
    relatedQuestionRefs:
    - QI019

