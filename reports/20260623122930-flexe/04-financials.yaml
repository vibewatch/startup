    gross margin benchmarks (15–25%), and headcount-to-burn proxies. These figures are not
    Flexe-confirmed and should be treated as a planning scaffold, not financial statements.
    GXO comparable gross margin (15%) used as a logistics-operator floor; SaaS/platform
    benchmark (25%) used as a ceiling.
