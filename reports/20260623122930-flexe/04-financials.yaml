- id: TI005
  title: Public financial gaps and diligence path table
  columns:
  - Missing Private Metric
  - Impact on Analysis
  - Exact Diligence Path
  rows:
  - - Audited GAAP revenue or management-confirmed ARR
    - Without it, third-party estimates ($91–97M) cannot be relied on; valuation multiple and growth trajectory unverifiable
    - Request most recent two years of audited P&L; alternatively request management-prepared financial summary with revenue recognition policy
  - - Gross margin and cost of revenue breakdown
    - Without it, path-to-profitability and capital efficiency cannot be modelled; margin compression under price competition unassessable
    - Request P&L with COGS breakdown by warehouse partner pass-through, labor, technology, and platform overhead; compare to GXO and Stord comparable structures
  - - Current cash balance and monthly burn rate
    - Without it, runway and capital-adequacy assessment is entirely speculative; cannot assess whether a raise is imminent or unnecessary
    - Request last audited or unaudited balance sheet plus 12-month cash flow statement or burn-rate schedule
  - - Net revenue retention (NRR) and churn rates
    - Without it, revenue durability cannot be assessed; transactional model may have higher churn than disclosed; ARR trajectory unreliable
    - Request quarterly NRR by cohort, gross logo churn, and expansion rates from customer success records
  - - Customer Acquisition Cost (CAC) and payback period
    - Without it, sales efficiency and capital-to-growth ratio cannot be assessed
    - Request blended CAC by channel, payback period by segment, and average contract value for enterprise programs
  - - Cap table and ownership structure
    - Without it, investor control provisions, liquidation preference, and dilution stack are unknown; critical for valuation and exit analysis
    - Request cap table, investor rights agreement, and any secondary-market transactions since Series D
  notes: >-
    All items in this table are genuine data gaps as of the report date. Flexe has not made
    any of these metrics publicly available. The diligence paths are specific and actionable;
    absence of any single item materially impairs the ability to underwrite an investment.
  claimRefs:
  - CI003
  - CI033
  - CI034
  - CI040

figures:
- id: FI001
  title: Revenue model bridge — how customer activity converts to Flexe revenue
  type: flow
  layout: wide
  summary: Customer warehouse and fulfillment demand flows through Flexe's orchestration layer, generating transaction-based revenue before a warehouse partner cost split reduces it to gross profit.
  claimRefs:
  - CI001
  - CI002
  - CI028
  - CI031
  data:
    nodes:
    - id: enterprise-customer
      label: Enterprise Customer
      detail: Retailer or brand with variable warehousing, fulfillment, or distribution needs; no long-term lease required.
    - id: flexe-platform
      label: Flexe Platform (WMS + Orchestration)
      detail: Receives customer orders and inventory; routes to optimal warehouse partner based on location, capacity, and cost.
    - id: transaction-revenue
      label: Transaction Revenue
      detail: Customer pays storage, fulfillment, transportation, and platform fees; estimated $91–97M ARR (2024, tracker data).
    - id: warehouse-partner
      label: Warehouse Partner Network (800+ operators, 3,000+ locations)
      detail: Executes physical storage and fulfillment; receives 70–85% of service revenue as direct cost of goods.
    - id: gross-profit
      label: Platform Gross Profit
      detail: Estimated 15–25% retention after warehouse-partner cost share; represents Flexe's contribution to cover engineering, sales, and G&A.
    - id: data-layer
      label: Flexe Discover / Market Intelligence (2026)
      detail: New data product launched June 2026 via Spot Warehousing Index; potential higher-margin software revenue stream.
  approximationNotes: >-
    Revenue splits are estimated from on-demand warehousing industry benchmarks; Flexe does
    not disclose its gross margin or partner revenue share. The data-layer node reflects the
    June 2026 product launch and is at an early monetization stage.

- id: FI002
  title: Unit economics bridge — from transaction to contribution margin
  type: flow
  layout: standard
  summary: Each fulfilled order passes through warehouse-partner costs and platform overhead before contributing to operating income; most input values are estimated due to private data gaps.
