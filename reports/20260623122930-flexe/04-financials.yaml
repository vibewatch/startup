  rows:
  - - Storage fees
    - Charge per pallet, sq ft, or position stored in network warehouse
    - Per pallet/month or per sq ft/day
    - Active; estimated $14–24/pallet/month national range; Flexe market-rate with transactional pricing
    - Medium — variable by location and season; churn risk high without lock-in
    - Confirm net realized rates, volume by customer, revenue concentration
  - - Fulfillment / pick-pack-ship fees
    - Charge per order fulfilled through network warehouse partners
    - Per order or per unit pick/pack
    - Active; included in enterprise program pricing; per-order rate not publicly disclosed
    - Medium — order volume tied to customer GMV; high leverage but volatile
    - Request average revenue per order, order volume trend, and customer-level breakdown
  - - Transportation / freight coordination fees
    - Broker or orchestrate carrier capacity; may include last-mile and freight brokerage
    - Per shipment or percentage of freight spend
    - Active; part of extended logistics programs
    - Low–medium — thin freight brokerage margins; high pass-through to carriers
    - Confirm net margin on transportation vs. storage/fulfillment; assess blended take-rate
  - - Technology / platform access fee
    - Software access, integration setup, analytics, and market intelligence (Flexe Discover)
    - Flat SaaS fee or embedded in enterprise program pricing
    - Evolving; Flexe Discover / Spot Warehousing Index launched June 2026 adds data product layer
    - High potential — software-layer margin superior to pass-through; currently mixed with services
    - Confirm whether platform fee is separately invoiced or bundled; assess ACV for enterprise programs
