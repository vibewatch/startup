      current mitigation maturity based on public evidence available as of June 2026.
    data:
      columns:
        - Likelihood
        - Impact
        - Residual Severity
        - Mitigation Maturity
      rows:
        - label: Market normalization / demand headwinds
          values:
            - label: High — 16 qtrs rising vacancy; tariff volatility every 1.5 wks
              tone: negative
            - label: High — revenue growth headwind; TAM expansion slowdown
              tone: negative
            - label: Critical — structural not cyclical; no obvious near-term reversal
              tone: negative
            - label: Low — Spot Warehousing Index adds data but not demand
              tone: negative
        - label: Competitive pressure (GXO, Stord, Amazon)
          values:
            - label: High — Stord $3B, GXO 10.8% growth, Flowspace launching
              tone: negative
            - label: High — margin compression; customer win rate pressure
              tone: negative
            - label: High — differentiation eroding as incumbents adopt tech platforms
              tone: negative
            - label: Low — no confirmed competitive moat metric or win-rate data
              tone: negative
        - label: Third-party operator failure
          values:
            - label: High — 800+ independent operators; no disclosed quality controls
              tone: negative
            - label: High — SLA breach → enterprise churn; brand concentration at Flexe
              tone: negative
            - label: Critical — no operator performance data or public mitigation framework
              tone: negative
            - label: Low — no public SLA scorecard, audit, or ejection-rate data
              tone: negative
        - label: Workforce / execution capacity
          values:
            - label: High — confirmed 71% cumulative staff reduction in 2023–2024
              tone: negative
            - label: High — reduced CSM and engineering capacity; slower implementation
              tone: negative
            - label: High — current headcount unknown; residual risk unquantifiable
              tone: negative
            - label: Emerging — continued product launches suggest some recovery
              tone: neutral
        - label: Financing / runway pressure
          values:
            - label: Medium — no confirmed new round since July 2022 Series D
              tone: neutral
            - label: Critical — insufficient runway would force distressed financing or exit
              tone: negative
            - label: High — 4+ year hold with no re-mark creates valuation and governance uncertainty
              tone: negative
            - label: Unconfirmed — no public runway, burn, or cash position data
              tone: negative
        - label: Cybersecurity breach
          values:
            - label: Medium — logistics sector attacks accelerating; 20+ integration touchpoints
              tone: neutral
            - label: High — operational disruption; PII exposure; regulatory notification
              tone: negative
            - label: High — no SOC 2/ISO 27001 publicly confirmed; broad attack surface
              tone: negative
            - label: Low — no public certifications, trust page, or incident response disclosure
              tone: negative
        - label: Regulatory / legal
          values:
            - label: Low–Medium — no confirmed active litigation or enforcement
              tone: positive
            - label: Medium — WARN Act compliance verified; data privacy exposure structural
              tone: neutral
            - label: Medium — compliant WARN filings; no confirmed current legal exposure
              tone: neutral
            - label: Adequate — WARN Act obligations met; privacy policy gap remains
              tone: neutral
    approximationNotes: >
      Risk assessments are author judgments based on public evidence as of June 2026. Likelihood and impact ratings are
      qualitative. No Flexe-internal risk register or audit data is publicly available. Mitigation maturity is based
      solely on publicly disclosed evidence; internal controls may be more mature than the public record reflects.
    claimRefs:
      - CR001
      - CR002
      - CR022
      - CR024
      - CR028
      - CR029
      - CR030
      - CR033
      - CR035
  - id: FR002
    title: Flexe Risk Transmission Map — How Key Risks Flow to Revenue and Valuation
    type: dag
    layout: wide
    summary: >
      Shows how Flexe's primary risk events propagate through operational capacity, customer relationships, revenue, and
      ultimately financing and valuation. Key transmission paths highlight the layoff-to-service-quality chain and the
      market-normalization-to-revenue chain as the two highest-severity cascades.
    data:
      nodes:
        - id: layoff-event
          label: Workforce Reduction Events (33% 2023, 38% 2024)
          detail: Confirmed via WARN Act filings; 71% cumulative headcount reduction
        - id: reduced-ops-capacity
          label: Reduced Operational & CSM Capacity
          detail: Fewer customer success, implementation, and operations staff to serve enterprise accounts
        - id: service-degradation
          label: Service Quality Degradation / Implementation Delays
          detail: Enterprise deployments slower; SLA monitoring reduced; customer experience at risk
        - id: market-normalization
          label: Market Normalization / Warehousing Stagflation
          detail: Rising vacancy + elevated lease rates compress spot premium; tariff volatility delays program launches
        - id: competitive-pressure
          label: Competitive Pressure (GXO, Stord, Flowspace)
          detail: Incumbents and well-funded peers offer competing enterprise logistics platforms at aggressive pricing
        - id: revenue-headwind
          label: Revenue Growth Headwind
          detail: Slower program launches, price compression, and potential churn reduce revenue growth rate
        - id: financing-pressure
          label: Financing / Runway Pressure
          detail: No confirmed round since July 2022; 4+ year hold increases investor exit pressure
        - id: valuation-pressure
          label: Valuation Mark-Down / Down-Round Risk
          detail: Revenue miss + investor pressure + comparable multiple compression → sub-$1B mark risk
      edges:
        - from: layoff-event
          to: reduced-ops-capacity
          label: Headcount directly reduces operational throughput
        - from: reduced-ops-capacity
          to: service-degradation
          label: Fewer staff → slower implementations, less SLA monitoring
        - from: service-degradation
          to: revenue-headwind
          label: Service issues → churn, slower new-logo closes
        - from: market-normalization
          to: revenue-headwind
          label: Spot premium compression + tariff paralysis reduce program launches
        - from: competitive-pressure
          to: revenue-headwind
          label: Price pressure + enterprise optionality compress Flexe take-rate
        - from: revenue-headwind
          to: financing-pressure
          label: Revenue miss accelerates cash runway depletion
        - from: financing-pressure
          to: valuation-pressure
          label: Distressed financing or investor exit pressure → down-round scenario
        - from: competitive-pressure
          to: valuation-pressure
          label: Narrowing moat reduces growth premium in comparable multiples
    approximationNotes: >
      Transmission paths are inferred from industry analogues and public evidence; Flexe has not disclosed internal
      financial or operational data. Causal linkages are logical inferences based on standard enterprise SaaS and
      logistics platform dynamics.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR009
      - CR016
      - CR017
      - CR022
      - CR024
      - CR027
  - id: FR003
    title: Flexe Critical Dependency Map — External Entities and Platform Exposure
    type: dag
    layout: standard
    summary: >
      Maps Flexe's six critical external dependencies — warehouse operators, enterprise customers, Microsoft
      integration, Prologis investor, and VC syndicate — and the nature of each dependency's risk transmission to the
      platform.
    data:
      nodes:
        - id: flexe-platform
          label: Flexe Technology Platform
          detail: Core WMS/OMS/IMS/analytics layer; connects demand-side and supply-side
        - id: warehouse-operators
          label: 800+ Third-Party Warehouse Operators
          detail: Provide all physical execution; service quality outside Flexe's direct control
        - id: enterprise-customers
          label: Enterprise Customers (Fortune 500 / CPG)
          detail: Generate platform revenue; top 2 estimated ~38% of FY2025 volume
        - id: microsoft-d365
          label: Microsoft Dynamics 365 IOM Integration
          detail: Certified ERP integration gateway; deprecation risk; single primary pathway
        - id: prologis-investor
          label: Prologis Ventures (Strategic Investor)
          detail: Series D participant; real-estate network overlap; potential competitive conflict
        - id: vc-syndicate
          label: VC Syndicate (BlackRock, T. Rowe Price, Tiger Global)
          detail: Capital and governance; 4+ year hold since Series D; exit pressure risk
      edges:
        - from: warehouse-operators
          to: flexe-platform
          label: Physical execution; service quality dependency
        - from: flexe-platform
          to: enterprise-customers
          label: Order routing, inventory visibility, SLA delivery
        - from: enterprise-customers
          to: flexe-platform
          label: Revenue, demand signal, network utilization
        - from: microsoft-d365
          to: flexe-platform
          label: Integration gateway; enterprise ERP connectivity
        - from: prologis-investor
          to: flexe-platform
          label: Capital + real-estate channel; strategic conflict potential
        - from: vc-syndicate
          to: flexe-platform
          label: Governance rights, capital access, exit pressure
    approximationNotes: >
      Dependency mapping is based on publicly disclosed Series D investor list, Microsoft Learn certified integration
      documentation, and Flexe official network materials. Edge labels describe primary risk transmission direction, not
      full bidirectional relationships.
    claimRefs:
      - CR014
      - CR019
      - CR028
      - CR031
      - CR032
  - id: FV001
    title: Flexe Investment Recommendation Logic Chain
    type: flow
    layout: wide
    summary: >-
      Traces the evidence chain from network scale, customer proof, financial state, competitive risk, and valuation
      assessment to the final Track / Research-More recommendation.
    claimRefs:
      - CV034
      - CV035
      - CV036
    data:
      nodes:
        - id: network-scale
          label: Network Scale
          detail: >-
            800+ operators, 3,000+ facilities, 6-of-top-10 US retailers; multi-year relationship moat; hard to replicate
            quickly
        - id: customer-proof
          label: Customer & Revenue Proof
          detail: $91–97M ARR est.; Forrester 124% ROI; Nike/Target/Lowe's logos; Deloitte Fast 500 confirmed
        - id: financial-state
          label: Financial & Governance State
          detail: >-
            No confirmed round since Jul 2022; 71% workforce reduction; opaque burn; $205M–$330M raised with unknown
            preference stack
        - id: competitive-risk
          label: Competitive & Market Pressure
          detail: >-
            Stord $3B May 2026; GXO 10.8% FY2025 growth; Amazon 3PL expansion; warehousing vacancy 7.4% compressing spot
            premium
        - id: valuation-assessment
          label: Valuation Assessment
          detail: >-
            $1B mark = 10–11x EV/ARR; logistics comps 0.54–1.7x; SaaS comps 4.7–6.1x; 2022-cohort unicorns down 52% avg
            (CNBC/PitchBook 2026)
        - id: recommendation
          label: Track / Research-More — Stretched
          detail: >-
            Unicorn mark unsupported by comparable evidence; monitor for price reset, next financing event, or
            profitability proof; conditions for Buy are explicit
      edges:
        - from: network-scale
          to: recommendation
          label: Positive but insufficient alone
        - from: customer-proof
          to: recommendation
          label: Validates demand; does not resolve multiple
        - from: financial-state
          to: recommendation
          label: Opaque runway = high uncertainty premium
        - from: competitive-risk
          to: recommendation
          label: Stord premium + market headwinds = downside pressure
        - from: valuation-assessment
          to: recommendation
          label: 10x EV/ARR vs 1.7x–5x comp → stretched
  - id: FV002
    title: Flexe Implied Valuation Sensitivity to EV/ARR Multiple
    type: bar
    layout: wide
    summary: >-
      Shows how Flexe's implied enterprise value varies across five EV/ARR multiples applied to the $94M midpoint ARR
      estimate, spanning asset-light 3PL floor to last-round implied multiple.
    approximationNotes: >-
      ARR midpoint of $94M derived from GetLatka $91.1M and Growjo $97.1M third-party estimates; neither is audited.
      Asset-light 3PL multiple from PCE M&A benchmark (1.7x). Tech-enabled 3PL (5x) and private SaaS floor (6x) from
      Windsor Drake Q1 2026 and Aventis Advisors. SaaS premium (8x) from Windsor Drake premium TMS/WMS range. Last-round
      implied (10.6x) derived from $1B ÷ $94M ARR.
    claimRefs:
      - CV010
      - CV017
      - CV018
      - CV028
      - CV029
    data:
      items:
        - label: Asset-light 3PL M&A floor (1.7× ARR)
          value: 160
          unit: $M
          note: PCE M&A TEV/Rev benchmark; best-quality differentiated platforms
        - label: C.H. Robinson public comp (1.4×)
          value: 132
          unit: $M
          note: CHRW EV/Rev 2026E; pure asset-light logistics brokerage
        - label: Tech-enabled 3PL blended (5× ARR)
          value: 470
          unit: $M
          note: Base scenario; technology premium above asset-light comp; gross margin ~18%
        - label: Private SaaS floor (6× ARR)
          value: 564
          unit: $M
          note: Aventis Advisors private SaaS median floor; requires confirmed software moat
        - label: Logistics SaaS premium (8× ARR)
          value: 752
          unit: $M
          note: Windsor Drake premium range; requires gross margin >40% — not supported
        - label: Last-round implied (10.6× ARR)
          value: 1000
          unit: $M
          note: Implied by $1B Series D mark at $94M midpoint ARR; no comp supports this
  - id: FV003
    title: Flexe Bull / Base / Bear Valuation Range
    type: range
    layout: wide
    summary: >-
      Three-scenario valuation range spanning $250M (bear distressed exit) to $1.7B (bull strategic acquisition
      premium), with the base scenario of $470M–$770M most consistent with current comparable evidence.
    approximationNotes: >-
      All values are scenario estimates, not company-confirmed or audited. ARR growth assumptions and multiple rationale
      stated in TV003. Bear scenario anchored to 52% 2022-cohort average compression (CNBC/PitchBook June 2026). Base
      scenario anchored to 5–7x tech-enabled 3PL blended multiple on projected $110M ARR. Bull requires strategic
      acquirer paying network premium beyond current comp range.
    claimRefs:
      - CV030
      - CV031
      - CV032
    data:
      items:
        - label: Bear — distressed / down-round scenario
          low: 250
          mid: 400
          high: 500
          unit: $M
          note: 3–4x ARR; 52% discount to $1B consistent with 2022-cohort average compression
        - label: Base — tech-enabled 3PL fair-value reset
          low: 470
          mid: 620
          high: 770
          unit: $M
          note: 5–7x EV/ARR × $94–$110M est. ARR; entry price discipline required
        - label: Bull — strategic acquisition with network premium
          low: 1000
          mid: 1250
          high: 1700
          unit: $M
          note: 10–13x forward ARR; requires strategic acquirer; above current comp evidence
  - id: FV004
    title: IC-Ready Investment KPI Dashboard — Flexe
    type: kpi
