      - number: '1.3'
        title: Capital history, milestones, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Flexe's public capital story is strongest around the July 2022 Series D round. Reuters reported that the
              company raised $119 million and crossed a $1 billion valuation with BlackRock leading and investors
              including T. Rowe Price, Madrona Ventures, and Prologis Ventures participating. After that point, the
              evidence becomes less consistent. Latka reports $205.4 million total funding across five rounds, while
              StartupIntros reports $268.6 million across seven rounds and Compworth estimates cumulative funding around
              $263 million. Those figures are directionally similar — all imply a heavily venture-backed private company
              — but not precise enough to treat total raised as a high-confidence fact without management confirmation
              or cap-table access.


              Operational milestones after 2022 show a company still shipping product and market-intelligence
              initiatives despite organizational stress. Flexe ranked on Deloitte's Technology Fast 500 in both 2023 and
              2024, announced a 2025 growth strategy centered on automation and transportation partnerships, and in June
              2026 launched the Spot Warehousing Index at Reuters Supply Chain USA. At the same time, the company
              underwent two material layoff events: 33% of staff in September 2023 and another 38% reduction in January
              2024. Those cuts do not invalidate the product thesis, but they do materially change the diligence
              read-through. They indicate that Flexe is still managing post-pandemic demand normalization, cost
              discipline, and possible go-to-market reset while trying to sustain enterprise credibility and category
              leadership.
