  - id: FI001
    title: Revenue model bridge — how customer activity converts to Flexe revenue
    type: flow
    layout: wide
    summary: >-
      Customer warehouse and fulfillment demand flows through Flexe's orchestration layer, generating transaction-based
      revenue before a warehouse partner cost split reduces it to gross profit.
    claimRefs:
      - CI001
      - CI002
      - CI028
      - CI031
    data:
      nodes:
        - id: enterprise-customer
          label: Enterprise Customer
          detail: >-
            Retailer or brand with variable warehousing, fulfillment, or distribution needs; no long-term lease
            required.
        - id: flexe-platform
          label: Flexe Platform (WMS + Orchestration)
          detail: >-
            Receives customer orders and inventory; routes to optimal warehouse partner based on location, capacity, and
            cost.
        - id: transaction-revenue
          label: Transaction Revenue
          detail: >-
            Customer pays storage, fulfillment, transportation, and platform fees; estimated $91–97M ARR (2024, tracker
            data).
        - id: warehouse-partner
          label: Warehouse Partner Network (800+ operators, 3,000+ locations)
          detail: Executes physical storage and fulfillment; receives 70–85% of service revenue as direct cost of goods.
        - id: gross-profit
          label: Platform Gross Profit
          detail: >-
            Estimated 15–25% retention after warehouse-partner cost share; represents Flexe's contribution to cover
            engineering, sales, and G&A.
