      - number: '7.5'
        title: Regulatory, Legal, and Compliance Risks
        blocks:
          - type: paragraph
            body: >
              No active lawsuits, regulatory enforcement actions, or formal complaints against Flexe appear in the
              public record as of June 2026. The most substantive regulatory evidence is the WARN Act compliance record:
              two documented filings with the Washington State Employment Security Department confirm that Flexe met its
              federal and state notification obligations for both the 2023 and 2024 layoff events. WARN compliance
              confirms regulatory adherence but also signals that reductions reached statutory thresholds requiring
              formal notification. Forward-looking regulatory risks include: data privacy obligations under CCPA and
              applicable state laws given Flexe's processing of enterprise customer and consumer PII; potential
              joint-employer liability in California and other expansive employment-law states arising from the
              platform's management of third-party warehouse worker relationships; and the evolving cybersecurity
              regulatory environment, including FTC enforcement activity and applicable NIST guidelines for logistics
              platform operators handling sensitive supply chain data. No data privacy litigation, joint- employer
              claims, or FTC inquiries against Flexe appear in public reporting. However, the absence of SOC 2/ISO 27001
              certifications and a formal trust-and-security page on Flexe's website constitutes a diligence gap for
              enterprise security reviews. The 2026 Norton Rose Fulbright Litigation Trends Survey identifies
              cybersecurity, AI liability, and employment discrimination suits as rising categories across
              technology-enabled logistics companies — representing background structural risk for Flexe even in the
              absence of specific confirmed claims.
            claimRefs:
