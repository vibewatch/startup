  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Revenue decline confirmed
        - ARR falls below $75M (>20% decline from $91–97M est. base)
        - >-
          Destroys multiple expansion case; prevents any M&A premium; forces distressed scenario; makes base EV range
          $225–$300M
        - Exit position; trigger immediate full due diligence; no new capital at any multiple above 3x ARR
      - - Financing failure (no new round by end 2026)
        - >-
          No confirmed equity round, credit facility, or bridge financing by December 2026 — marking 4.5+ year hold
          since Series D
        - >-
          Cash runway may be critically low; preference for insider or distressed M&A at large discount; workforce
          further reduced
        - Do not invest without bridge confirmation; request management liquidity representation as first diligence step
      - - Major customer defection
        - >-
          Loss of 2+ Fortune 500 accounts representing >20% of estimated GMV with public announcement or supply chain
          press coverage
        - >-
          Enterprise concentration thesis broken; network effect reversed; remaining revenue base insufficient for tech
          multiple
        - Immediate thesis reconsideration; require independent churn data; reduce target multiple by 2–3x
      - - Competitor displacement event
        - Named enterprise customer migrates to Stord, GXO, or Amazon 3PL with confirmed public announcement
        - >-
          Demonstrates switching cost assumption is weaker than thesis assumes; reduces defensibility of network moat
          claim
        - >-
          Re-benchmark competitive moat assumption; reduce target entry multiple by 1–2x; require Flexe win-rate data
          before proceeding
      - - Gross margin confirmed below 12%
        - Audited or management-reviewed gross margin disclosed below 12% (vs ~18% current third-party estimate)
        - >-
          Path to profitability becomes extremely long; SaaS re-rating impossible; fundamental value gravitates to 1.7x
          TEV/Rev M&A floor ($160M)
        - >-
          Downgrade to Avoid; $1B valuation collapses entirely; only exit thesis is distressed M&A or strategic
          acquisition at network value
    notes: >-
      Trigger thresholds are indicative and derived from public industry analogues; Flexe has not disclosed internal
      risk management frameworks. All thresholds should be calibrated against confirmed ARR and gross margin data
      obtained in diligence.
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Audited financials
        - FY2024 and FY2025 audited income statement; gross margin; operating burn; contribution margin by product line
        - >-
          Third-party ARR estimates unaudited; actual gross margin determines which multiple range applies; burn
          determines runway; difference between $470M and $1.7B valuation scenario
        - >-
          Request audited statements from Flexe CFO; if unavailable request management accounts with independent
          accountant review; minimum 3-year P&L
      - - Cash and runway
        - >-
          Current cash balance; monthly burn rate; next financing timeline; any bridge, venture debt, or insider round
          not publicly disclosed
        - >-
          4+ year hold since Series D with no confirmed financing; runway uncertainty is the single largest downside
          risk; cash exhaustion triggers distressed scenario
        - >-
          Obtain management representation on cash and runway; bank statement confirmation for most recent quarter; ask
          directly about any pending term sheets
      - - Customer retention economics
        - >-
          Net revenue retention (NRR); gross revenue retention; top-5 customer revenue share and contract durations;
          cohort expansion data
        - >-
          NRR >110% would justify mid-range tech multiple; NRR <90% confirms commodity pricing and structural churn risk
          that collapses the bull case
        - >-
          Request customer-level revenue data from enterprise dashboard; calculate NRR from management-provided cohort
          data; confirm if top 2 customers are still active
      - - Cap table and preference stack
        - >-
          Full cap table as of Q1 2026; Series D liquidation preference terms; anti- dilution provisions; investor
          rights agreement; any triggered pay-to-play
        - >-
          Liquidation preferences on $205M–$330M raised absorb exit proceeds below $500–700M; critical for return
          modeling at any entry price; post-layoff governance changes may have triggered investor consent rights
        - >-
          Request current cap table and investor rights agreement; confirm no outstanding anti-dilution adjustments;
          verify board composition has not changed materially
      - - Competitive win/loss data
        - >-
          Win rate vs Stord, GXO, and ShipBob in competitive enterprise bids; reason codes for lost deals; customer NPS
          by program type
        - >-
          Competitive moat is the central thesis differentiator; no public evidence of win rate or switching-cost
          magnitude; Stord's $3B valuation signals it is winning
        - >-
          Request last 12-month CRM data on competitive wins and losses; ask for customer reference contacts at 3+ named
          accounts; obtain NPS survey results
      - - Operator network quality
        - >-
          Operator SLA compliance rates; quality audit results; ejection rates; service variance by geography; incident
          escalation log (12 months)
        - >-
          Flexe's enterprise promise rests on third-party operator execution; 800+ independent operators create
          asymmetric brand risk; no public quality metrics
        - >-
          Request operator performance dashboard; contractual SLA terms with operators; 12-month incident log; sample of
          operator contracts with performance clauses
    notes: >-
      Diligence topics ordered by materiality to valuation judgment. Items 1–3 are blocking for any investment; items
      4–6 are required before finalizing structure. No company- confirmed data resolves any of these gaps as of the
      report date.
