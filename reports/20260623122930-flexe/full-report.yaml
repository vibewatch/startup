            title: Runway cannot be underwritten from public data
            body: >-
              The combination of no disclosed cash position, no fundraise since July 2022, and two major layoff rounds
              (totalling ~230 WARN-notified workers) creates a capital-adequacy gap that cannot be closed without direct
              access to Flexe's balance sheet and burn-rate schedule. The company's January 2024 "very strong cash
              position" statement is now 18+ months stale, and runway implications depend entirely on burn rate and
              revenue dynamics that are not publicly observable. Any investment thesis that requires confidence in
              Flexe's 12-month capital adequacy must resolve this data gap first.
