      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise network density is a genuine but underexplored strategic asset
            body: >-
              Flexe's 800+ operator, 3,000+ facility network represents years of contracting, on-boarding, and
              relationship investment that cannot be replicated quickly. If customer-verified and backed by quality
              metrics, this network moat could support a valuation premium above the asset-light 3PL comp floor. The
              Forrester TEI study confirms enterprise buyers generate real ROI, and 6-of-top-10-US-retailer penetration
              (if independently verified) represents a concentrated sales asset for a potential strategic acquirer
              seeking retailer relationships at scale.
            calloutType: strength
            claimRefs:
              - CV038
              - CV001
          - type: callout
            title: Four-year stale $1B mark in a market that has repriced 50–68%
            body: >-
              Flexe's last confirmed valuation was set at the peak of the 2022 private market cycle. CNBC and PitchBook
              data from June 2026 shows 2022-cohort companies trading at approximately 52% below last round values on
              average. Against $91–97M ARR, the $1B mark requires a 10–11x EV/ARR multiple that no comparable public
              logistics company supports. Without a new primary round establishing a current market mark, the $1B figure
              is an accounting artifact rather than a market price, and any investment diligence must independently
              establish entry price.
            calloutType: risk
            claimRefs:
              - CV023
              - CV010
              - CV036
          - type: callout
            title: Track at current mark; conditions for Buy require price reset and financial proof
            body: >-
              Flexe merits sustained monitoring as one of the largest independent on-demand warehousing platforms in
              North America, but the current $1B mark is stretched relative to all available comparable evidence. The
              conditions for upgrading to Buy are specific and measurable: (1) entry price at or below $700M with
              confirmed preference alignment, (2) audited gross margin above 30%, (3) NRR above 110%, or (4) a named M&A
              process with indicated value above $900M. Absent any of these signals, capital discipline requires
              patience.
            calloutType: recommendation
            claimRefs:
