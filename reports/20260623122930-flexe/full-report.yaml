            title: Revenue quality is mixed — transactional model exposes ARR to demand cycles
            body: >-
              Flexe's usage-based, no-commitment pricing model is a strong marketing differentiator for customers but a
              revenue-quality challenge for investors. Unlike SaaS businesses with high net revenue retention and
              multi-year ACVs, Flexe's storage and fulfillment revenue is directly exposed to e-commerce demand cycles,
              retailer inventory normalization, and freight market softening — exactly the conditions that drove the
              2023–2024 workforce reductions. The absence of NRR data and churn metrics means revenue durability cannot
              be quantified. The Deloitte Fast 500 rank decline from 236 (2023) to 370 (2024) is consistent with a
              deceleration in revenue growth even as the absolute base stabilized.
