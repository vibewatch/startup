      - number: '6.4'
        title: Retention, Durability, and Satisfaction Signals
        blocks:
          - type: paragraph
            body: >
              Flexe's retention profile is structurally ambiguous. The platform's fundamental value proposition — no
              long-term contracts, no fixed fees, no CapEx — simultaneously attracts enterprise customers and removes
              the contractual barriers that sustain high gross retention. On-demand bookings grew 18% year-over-year
              through early 2026 according to analyst estimates, yet average customer tenure on spot/on-demand contracts
              is estimated at under 12 months, signaling high transactional churn risk. Programmatic logistics clients
              (multi-program, multi-node customers) likely exhibit higher retention than spot-only customers, but no
              segment-level data is publicly disclosed.

              Third-party sentiment indicators are broadly positive: FeaturedCustomers rates Flexe 4.8/5 from 2,174
              reference ratings, and testimonials from named executives (Kevin Nohl at Aterian, Kevin Kryscio at Ace
              Hardware, Robert Vaughn at Lull) credit Flexe with enabling business model transformation. The New
              Warehouse podcast's September 2023 episode featuring Flexe's VP of Logistics and Director of Logistics
              Strategy reinforces an external perception of programmatic logistics as differentiated. However, these
              sources are self-selected and skew positive; no independent adverse review platform (G2, Gartner Peer
              Insights) has published verified Flexe ratings accessible at diligence.

              The layoffs in 2023 (33% of workforce) and 2024 (38% of workforce) reduced Flexe's customer-facing
              operations staff, which creates a plausible risk to service quality and customer satisfaction, though no
              publicly documented customer departure or complaint citing staffing quality has been identified. The gross
              margin compression to an estimated 18.2% in FY2025 — partly attributed to large-account contract
              concessions — is an indirect adverse retention signal: customers with high bargaining power are extracting
              pricing, which suggests strong dependency by Flexe on these relationships.
            claimRefs:
