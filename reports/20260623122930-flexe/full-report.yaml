      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Layoff-Compressed Capacity and Undisclosed Runway Create Compounding Exposure
            body: >
              The combination of 71% cumulative workforce reduction (2023–2024) and no confirmed financing since July
              2022 creates a compounding risk profile unique among Flexe's peer group. Reduced operational staffing
              directly limits the company's ability to onboard new enterprise customers, manage complex deployments, and
              maintain SLA compliance for existing accounts — while an uncertain runway constrains management's ability
              to rebuild capacity or invest in competitive differentiation. Neither risk is confirmed as thesis-breaking
              in the public record, but both remain unresolved as of June 2026 without management disclosure.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR014
          - type: callout
            title: Third-Party Operator Model Creates Unquantifiable Service Quality Risk
            body: >
              Flexe's asset-light model generates enterprise brand exposure asymmetrically: service failures by any of
              800+ independent operators are attributed by enterprise customers to Flexe, not to the individual
              operator. Flexe has not disclosed operator SLA scores, audit results, network ejection rates, or quality
              variance metrics. Combined with the absence of cybersecurity certifications and the 20+ integration
              touchpoints, the operational risk profile of the platform cannot be independently assessed from public
              data — representing a blocking diligence item before investment close.
            calloutType: risk
            claimRefs:
              - CR028
              - CR029
              - CR031
              - CR038
          - type: callout
            title: Diligence Priority — Runway, Operator Quality, NRR, and Legal Clearance
            body: >
              Four items are blocking diligence priorities for Flexe: (1) confirm cash runway, burn rate, and whether
              any bridge financing or covenant has been agreed since the July 2022 Series D; (2) obtain operator SLA
              performance data, ejection rates, and incident escalation records to validate service quality claims; (3)
              request NRR and GRR by customer tier (programmatic vs. on-demand) to assess revenue durability
              post-layoff; (4) commission an independent PACER/ Westlaw litigation search and request management
              representation on pending or threatened claims, including joint-employer and data privacy. Without these
              four, investment pricing and risk-adjusted return cannot be reliably established.
            calloutType: recommendation
