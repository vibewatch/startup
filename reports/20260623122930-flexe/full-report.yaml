      - number: '3.3'
        title: Hyperscaler and incumbent substitutes — Amazon MCF and GXO
        blocks:
          - type: paragraph
            body: |-
              Amazon Multi-Channel Fulfillment (MCF) is the most structurally threatening long-term substitute
              for Flexe's ecommerce fulfillment program because Amazon offers both the physical fulfilment
              network and the channel relationship simultaneously. As of June 1, 2026, Amazon's updated MCF US
              rate card charges a 3.5% fuel and logistics surcharge on top of base fulfillment fees. For a
              small-standard 4–8 oz item, the standard 3-day delivery fee is $7.51 per unit (1-unit order). The
              2026 MCF Preferred Pricing program offers eligible sellers up to 15% off MCF outbound fulfillment
              fees and up to $1 in FBA credits per MCF unit shipped, with a 6-month track for new MCF users and
              a 12-month track for high-volume shippers. Amazon has also waived the 5% AMZL block surcharge for
              MCF orders — including Walmart orders — through January 14, 2027. For sellers already using FBA,
              MCF removes switching friction by allowing cross-channel fulfillment from the same inventory pool.
              Amazon's structural leverage includes existing seller relationships, Prime infrastructure, data
              from Seller Central, and the ability to cross-subsidise MCF pricing through other Amazon business
              units. Flexe's advantages over Amazon MCF are: no seller-channel dependency (buyers using Flexe
              are not forced into Amazon's ecosystem), pricing flexibility across warehouse types, and
              enterprise-grade retail distribution support that Amazon MCF does not offer.

              GXO Logistics, the world's largest pure-play contract logistics provider, is the most
              economically significant incumbent substitute. GXO reported record full-year 2025 revenue of
              $13.2 billion, up 12.5% year-over-year, with organic growth of 3.9%. It operates more than 1,000
              facilities totalling 200 million square feet globally, employs more than 150,000 team members, and
              secured over $1 billion in new business wins for the third consecutive year in 2025, with
              incremental 2026 new business revenue of $774 million (up 20% year-over-year). GXO's 2026 guidance
              projects organic revenue growth of 4–5% and adjusted EBITDA of $930–970 million. GXO does not
              operate a true on-demand marketplace; its contracts are multi-year and asset-backed. However,
              its scale, technology investment (10,000+ robots across 40%+ of sites), global brand, and
              bundled TMS/WMS/automation capabilities allow it to offer enterprise buyers an end-to-end
              alternative to Flexe's point solution. Enterprise buyers often evaluate GXO and similar incumbents
              in the same RFP as Flexe when scoping annual warehouse network decisions.

              Prologis, Flexe's strategic investor, is a complementary relationship rather than a direct
              competitor, but it does offer its own dynamic fulfillment products under the broader Prologis
              Essentials label. Prologis's 2026 predictions emphasised flexibility and adaptability as central
              logistics real-estate purchasing criteria, and forecast that e-commerce would approach 25% of
              industrial leasing in 2026. This positions Prologis as a potential channel for referring demand
              to Flexe, but also as a platform that could develop competing flex-space products if Flexe's
              moat weakens.
