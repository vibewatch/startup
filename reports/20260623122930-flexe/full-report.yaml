          multiple vs ARR is a direct comp signal
      - - Asset-light logistics platforms M&A
        - M&A transaction benchmark (PCE Investment Bankers 2025–2026)
        - TEV/Revenue (strategic buyer)
        - ~1.7x
        - >-
          Best-quality differentiated asset-light platforms; strategic buyer median; Flexe at $94M ARR yields $160M
