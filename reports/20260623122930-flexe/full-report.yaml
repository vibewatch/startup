      - number: '3.2'
        title: Direct peers — Stord, Flowspace, ShipBob, and Ware2Go
        blocks:
          - type: paragraph
            body: |-
              Stord is the most generously capitalised and most strategically positioned direct competitor to
              Flexe as of mid-2026. In May 2026, Stord announced a $250 million Series F round at a $3 billion
              valuation — double its $1.5 billion valuation from its May 2025 Series E. The round was led by
              Strike Capital with participation from Kleiner Perkins, Founders Fund, Franklin Templeton, Baillie
              Gifford, G Squared, Bond, and Lux. Stord has now raised approximately $775 million in total. It
              operates nearly 100 fulfillment locations globally, manages over $15 billion in annual GMV, serves
              more than 1,000 customers, and its packages reach nearly one in four US households annually. Stord
              processed 8 billion data points per year across its network in 2026. Its software business tripled
              in 2025 and new bookings more than doubled quarter-over-quarter in Q1 2026. Alongside the Series F,
              Stord launched Stord Labs, a physical-AI research environment for testing agentic AI, robotics, and
              advanced automation against live orders. In May 2025, Stord acquired Ware2Go from UPS, adding 21
              fulfillment centres and 2.5 million square feet to its network and forming a strategic partnership
              with UPS. The company's narrative frames it explicitly as an "anti-Amazon" enterprise — giving
              independent brands fulfillment capability that surpasses Prime without surrendering customer data.
              Stord's $3B valuation vs. Flexe's estimated $1B valuation represents the most material adverse
              signal in the direct-peer landscape: Flexe is outspent, outgrown, and outvalued by its nearest
              peer.

              Flowspace is the most SMB/DTC-oriented among the Tier 1 platforms. Headquartered in Los Angeles,
              Flowspace has raised approximately $48.6 million in total, most recently a $31 million Series B in
              2021 led by BuildGroup. Its estimated revenue of ~$30.5 million and ~100 employees place it
              significantly smaller than both Flexe and Stord by revenue. Flowspace offers coast-to-coast
              warehousing with a technology-forward platform emphasising real-time data, omnichannel control, and
              flexible capacity. In April 2026, Flowspace released Inventory Allocation Pools and Order
              Compliance Automation, and in May 2026 it launched a full B2B Retail Fulfillment Solution covering
              EDI order management, ASN processing, UCC label generation, retail compliance, and chargeback
              dispute management. Its focus on DTC-to-retail expansion and omnichannel compliance automation
              differentiates it from Flexe's enterprise overflow focus.

              ShipBob is the most revenue-rich and most internationally scaled direct competitor. It reported
              approximately $500 million in revenue in 2023 (43% year-over-year growth), operates more than 60
              fulfillment centres across five countries, and ships approximately 100 million orders annually.
              ShipBob has raised $330.5 million in total, led by Bain Capital Ventures in a $200 million Series
              E in 2021. The company is reportedly seeking a $4 billion valuation for a planned IPO. Its
              technology stack spans 250+ integrations including Shopify, TikTok Shop, Temu, and SHEIN
              Marketplace, and it launched a Madrid fulfillment centre in Q1 2026. ShipBob's market is
              primarily SMB and mid-market ecommerce brands rather than enterprise retailers — a different ICP
              from Flexe's core enterprise overflow focus — but its scale, capital access, and omnichannel
              expansion threaten to erode Flexe's mid-market ecommerce fulfillment program revenue.

              Ware2Go, now operating as "Ware2Go, A Stord Company" after the May 2025 acquisition, was founded
              in 2018 as a UPS subsidiary providing on-demand fulfillment and warehousing for DTC and B2B
              merchants. Its integration into Stord's platform further concentrates competitor resources and
              eliminates it as a standalone competitor, but it brings Stord a UPS carrier partnership and
              expanded fulfillment footprint relevant to the US mid-market.
