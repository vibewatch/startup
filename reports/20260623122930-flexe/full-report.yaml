      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market-sizing gap is material for valuation
            body: >-
              The 7–8× gap between Mordor Intelligence's $19.67B and Research & Markets' $149–167B estimates for the
              same "on-demand warehousing" label in 2026 is not a rounding error — it reflects fundamentally different
              market-boundary choices. If Flexe's TAM is $7B (North America share of narrow estimate), its growth story
              is a focused niche play. If the TAM is closer to the 3PL outer bound, it is a large-market category. A
              diligence investor cannot reliably underwrite a specific market-penetration assumption without resolving
              this definitional dispute, ideally by reviewing Flexe's own TAM model and confirming what revenue it
              counts as addressable.
            calloutType: risk
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: callout
            title: On-demand warehousing faces a structural platform evolution risk
            body: >-
              The MDPI academic analysis of on-demand warehousing platforms (Tornese 2024) identified that several
              pure-marketplace ODW providers migrated toward "mixed ODW-4PL" models because service-level consistency
              could not be maintained at scale. Flexe's visible evolution toward omnichannel orchestration and
              transportation partnerships could reflect exactly this structural pressure, but it also increases capital
              intensity and operational liability. The direction is strategically coherent but narrows differentiation
              from full-stack 3PLs.
            calloutType: insight
            claimRefs:
              - CM033
              - CM034
          - type: callout
            title: E-commerce share gain and volatility are durable demand drivers
            body: >-
              Two structural factors provide durable demand for flexible warehousing: e-commerce continuing to take
              share of US retail (16.9% in Q1 2026, up from ~15.9% in Q1 2025), and persistent supply-chain volatility
              that makes variable-cost capacity an operational hedge rather than a cost-optimization play. These factors
              are unlikely to reverse in a 3–5 year investment horizon and provide a floor for addressable demand
              independent of specific market-size methodology disputes.
            calloutType: strength
