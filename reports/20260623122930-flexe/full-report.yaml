      - number: '7.4'
        title: Execution, Governance, and Financing Risks
        blocks:
          - type: paragraph
            body: >
              Flexe's most documented adverse signal is workforce reduction. WARN Act filings in Washington state
              document two events: a September 2023 layoff (33% of staff, ~131 employees) and a January 8, 2024 filing
              affecting 99 workers effective March 8, 2024 (38% reduction). WARNScan and LayoffAlert independently
              corroborate the 2024 filing. Taken cumulatively, these reductions represent approximately 71% of peak
              headcount across two events — a substantial compression of operational capacity affecting functions
              directly tied to enterprise customer management, including customer success, implementation, and
              operations support. No 2025 or 2026 WARN filings have been documented, suggesting workforce stabilization,
              but Flexe has not published current headcount, staffing ratios, or organizational structure. On governance
              and financing, the public record creates material gaps. Flexe last raised capital in July 2022 ($119M
              Series D at $1B valuation, confirmed by InfotechLead and Tracxn). PitchBook shows no subsequent financing
              round through June 2026 — approximately four years without a confirmed capital injection. Revenue
              run-rate, burn rate, and cash position remain undisclosed. Flexe has not disclosed board composition,
              independent director count, or governance structure changes post-layoff. Industry analysis indicates only
              11% of unicorn-status companies now exit via IPO (down from 53% historically), per SaaStr, making M&A or
              secondary transactions more likely — but investor pressure from BlackRock, T. Rowe Price, and Tiger Global
              following a four-year hold creates governance tension that cannot be independently assessed from public
              data. Pre-IPO late-stage startups broadly face elevated down-round risk in the 2025–2026 environment as
              2022-era growth multiples compress, per Eqvista analysis.
