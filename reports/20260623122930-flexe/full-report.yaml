  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context, Last Round, and Comparable Set
        blocks:
          - type: paragraph
            body: |-
              Flexe's sole publicly confirmed valuation event is its Series D round in July 2022, in
              which the company raised $119M led by BlackRock with participation from Tiger Global, T.
              Rowe Price, Madrona Ventures, Prologis Ventures, Activate Capital, and Redpoint Ventures
              at a post-money valuation exceeding $1 billion. That mark is now approximately four years
              stale with no public evidence of a follow-on equity round, venture debt facility, or
              insider bridge. Third-party secondary market data from PM Insights indicates Flexe shares
              trading at approximately $1.36B implied valuation (35.82% premium to the $1B last primary
              round) as of mid-2026, but this figure is unaudited and not corroborated by company
              disclosure. Third-party funding trackers remain materially inconsistent: GetLatka reports
              $205.4M total raised; Growjo $263M; StartupIntros $268.6M; and Tracxn $330M — a $125M
              spread that is itself a diligence flag.

              Against third-party ARR estimates of $91.1M (GetLatka) and $97.1M (Growjo), the $1B
              last-round mark implies an EV/ARR multiple of approximately 10–11x. For context, GXO
              Logistics (the largest publicly traded contract logistics company) trades at 0.54–0.81x
              EV/Revenue in 2026 on $13.2B of FY2025 revenue. C.H. Robinson trades at approximately
              1.4x EV/Revenue. XPO Inc., an asset-based LTL carrier, trades at 3.3–3.6x — but XPO's
              premium reflects owned infrastructure, not a comparison to Flexe's asset-light model.
              PCE Investment Bankers' 2026 Transportation and Logistics M&A Update documents the median
              strategic TEV/Revenue for best-quality asset-light platforms at approximately 1.7x, with
              a strategic EV/EBITDA of 12.7x for differentiated sellers. Windsor Drake's Q1 2026
              Logistics and Supply Chain SaaS Valuation Report places premium TMS/WMS platforms with
              workflow lock-in and >40% gross margin at 8.2–10.5x EV/Revenue — a range Flexe cannot
              reach at its estimated ~18% gross margin.

              Private comparables provide mixed signals. Stord raised $250M at a $3B valuation in May
              2026 — a 3x premium to Flexe's last mark — but Stord completed a more recent primary
              round including the Ware2Go integration, making its implied multiple (estimated ~25x ARR
              on ~$120M revenue) a peak transaction rather than a sector floor. ShipBob's estimated
              2026 valuation of ~$1B against estimated $215M revenue implies a 4.7x multiple, more
              consistent with a hybrid tech+services 3PL. The Aventis Advisors SaaS multiples report
              for 2026 confirms the private SaaS median at 4.7–6.1x EV/Revenue — and logistics
              platforms with sub-20% gross margin trade at a discount to pure-SaaS peers.
