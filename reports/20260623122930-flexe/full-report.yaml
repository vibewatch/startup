      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: |-
              Flexe's primary buyers are enterprise and upper-mid-market companies with meaningful logistics
              footprints, supply-chain volatility, and existing IT infrastructure. The ShipBob 2026 State of
              Ecommerce Fulfillment Report (416 executive respondents) found that 84% of brands leverage a
              third-party fulfillment company for at least some of their orders, 86% sell on two or more channels
              (up 8% from 2025), and 44% plan to expand their fulfillment-center network in 2026. These statistics
              characterise the broader ecommerce brand population, not Flexe's direct customer base, but they
              set the adoption context: multi-channel selling and distributed inventory are now mainstream
              requirements rather than advanced practices.

              The payer is typically the VP of Supply Chain, Head of Logistics, or Chief Supply Chain Officer at
              a retailer, CPG company, or manufacturer. Budget authority rests in Operations or Finance rather than
              IT — a distinction relevant for enterprise sales cycles, since IT departments do not typically hold
              the warehousing budget. Adoption triggers include seasonal peak capacity needs (holiday surges),
              inventory overflow after supplier disruptions, geographic expansion into new markets, or the
              transition from a fixed-lease model to a more variable cost structure. For enterprise buyers who
              value service-level certainty, Flexe's 30+ integration methods and 3,000+ warehouse network reduce
              vendor-discovery friction and integration risk relative to self-sourcing individual warehouse
              operators.

              Three distinct buyer segments emerge from public evidence. First, enterprise retailers and CPG
              companies seeking overflow and seasonal capacity — this is the original Flexe use case and likely
              still accounts for most network volume. Second, mid-market ecommerce brands pursuing distributed
              inventory without signing long-term leases — a segment where Flexe competes directly with dedicated
              fulfillment network operators such as ShipBob. Third, omnichannel operators or manufacturers needing
              rapid network expansion during supply-chain disruptions (reshoring, nearshoring inventory buffers,
              tariff-driven sourcing shifts). The CSCMP 2026 report documents ongoing tariff volatility (policy
              changed on average every 1.5 weeks in 2025) as a persistent driver of unplanned inventory buffers
              requiring temporary staging capacity.

              Prologis, Flexe's strategic investor, emphasised in its 2026 supply-chain predictions that
              "flexibility" and "adaptability" are the central purchasing criteria for logistics real-estate
              decisions — a framing that reinforces Flexe's positioning but also means that every incumbent 3PL
              and real-estate owner has strong incentive to offer its own flex product. CBRE observed that 3PLs
              will account for more than 35% of US industrial leasing in 2026, meaning the payer population is
              large but already served by alternative providers.
