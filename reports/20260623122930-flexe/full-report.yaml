      - number: '4.3'
        title: Cost structure, gross margin drivers, and unit economics
        blocks:
          - type: paragraph
            body: |-
              Flexe's asset-light model structurally reduces capital intensity relative to owned-warehouse
              logistics operators, but it introduces a different cost challenge: the majority of gross revenue
              passes through to warehouse partner operators, leaving Flexe with a margin layer that is thin
              relative to typical SaaS businesses. In on-demand warehousing platforms, industry benchmarks
              and third-party analyses suggest that 70–85% of storage and fulfillment revenue flows to
              warehouse partners as direct cost-of-goods, leaving a platform take-rate of 15–30%.
              For a $91–97M revenue base, this implies gross profit of approximately $13–29M, or a gross
              margin of approximately 15–25%. This is materially below software-business benchmarks (typically
              60–80% gross margin) but consistent with operator-technology hybrid models.

              GXO Logistics, the world's largest pure-play contract logistics provider, reported 2025 revenues
              of $13.2B against direct operating expenses of approximately $11.2B — an implied gross margin of
              approximately 15%. While GXO is a fully asset-heavy contract operator rather than an asset-light
              platform, the comparison illustrates that the logistics sector as a whole operates at thin gross
              margins, and that even tech-enabled platforms face structural cost pressure when warehouse labor,
              real estate pass-through, and order-level variable costs are included in cost of revenue. Flexe's
              gross margin should be somewhat higher than GXO's 15% because it does not own facilities, but it
              is unlikely to reach pure SaaS levels because its revenue is primarily service-delivery revenue
              rather than software licensing.

              Flexe's cost base beyond direct warehouse costs includes: platform and engineering teams to
              maintain the WMS, integration layer, and analytics; an enterprise sales and account management
              function; operations and solutions staff who manage customer onboarding, exception handling, and
              network optimization; and a general and administrative overhead. Prior to the 2023–2024 layoff
              rounds, Flexe employed approximately 400 people (per Supply Chain Dive, citing the company's
              LinkedIn profile). After the combined 33% and 38% reductions — totalling approximately 230
              WARN-notified workers (WARNTracker) — current headcount is estimated at 155–175 people. With
              enterprise logistics technology compensation benchmarks of $140–180K average fully loaded cost
              per employee, the post-layoff headcount implies a monthly compensation-driven burn of approximately
              $1.8–2.6M, plus technology infrastructure, office, and overhead. Total monthly operating cost
              is estimated at $2.5–5.0M post-restructuring.
