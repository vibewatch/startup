          unicorn risk if no financing by 2027
        - >-
          Entry price ≤$700M with confirmed preference haircut; or new primary round at reset valuation; or named M&A
          process with indicated value above $900M
    notes: >-
      Thesis/anti-thesis pairs are author assessments based on public evidence as of June 2026. No company-confirmed
      financial data is available to resolve key disputes.
  - id: TV003
    title: Bull / Base / Bear Scenario Analysis
    columns:
      - Scenario
      - Key Assumptions
      - Implied EV Range ($M)
      - Return Logic
      - Key Risk
      - Probability Signal
    rows:
      - - Bull — strategic acquisition premium
        - >-
          ARR grows to $130M by 2027; gross margin improves to 30%+; strategic acquirer (Prologis or large 3PL) pays
          10–13x forward ARR for network premium; logistics SaaS re-rating from operational proof
        - $1,100–$1,700
        - >-
          13x × $130M = $1.69B ceiling; ~20–25% IRR plausible at entry ≤$700M; requires negotiated entry below last
          round
        - >-
          No confirmed M&A process or named acquirer; Stord at $3B makes relative pricing harder; gross margin
          improvement unproven
        - Low — requires multiple favorable outcomes simultaneously; no current public evidence of M&A process
      - - Base — fair-value reset with tech premium
        - >-
          ARR grows to $110M by 2027; gross margin holds at 18–22%; M&A exit at 5–7x ARR for tech-enabled 3PL comp; no
          secondary premium; entry price reset from $1B
        - $470–$770
        - >-
          6x × $110M = $660M midpoint; ~15–20% IRR requires entry at $450–$500M; consistent with PCE M&A TEV/Rev 1.7x
          plus technology premium
        - Requires new primary round or negotiated discount; no confirmed revenue trajectory beyond tracker estimates
        - Medium — consistent with comparable set; requires entry price discipline
      - - Bear — distressed or down-round
        - >-
          Revenue flat or declining; gross margin compresses to <15%; down-round or distressed M&A at 52% discount to
          last mark (consistent with 2022-cohort average per CNBC/ PitchBook); buyer pool limited by Amazon 3PL
          expansion and competitive displacement
        - $250–$500
        - >-
          3–4x ARR at $80–100M; $480M midpoint consistent with 52% compression from $1B; negative returns from $1B
          entry; breakeven near $450M entry
        - >-
          Likeliest outcome if no financing event or credible exit by mid-2027; 71% workforce reduction history makes
          continued service quality maintenance uncertain
        - >-
          Medium-high — current trajectory (stale round, opaque finances, competitive pressure) favors this outcome
          absent new evidence
    notes: >-
      All scenario valuations are author estimates derived from public comparable data and third-party ARR estimates.
      Probability signals are qualitative assessments of available public evidence, not actuarial estimates.
  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Comparable
      - Type
      - Key Metric
      - Multiple / Valuation
      - Relevance to Flexe
      - Limitation
    rows:
      - - 'GXO Logistics (NYSE: GXO)'
        - Public contract logistics
        - EV/Revenue 2026E
        - 0.54–0.81x
        - >-
          Asset-light enterprise contract logistics platform; largest direct public analog; FY2025 revenue $13.2B,
          EV/EBITDA 7.9–11.6x
        - >-
