      - number: '4.2'
        title: Funding history, capital structure, and valuation
        blocks:
          - type: paragraph
            body: |-
              Flexe's most reliably documented financing event is its Series D round, reported by Reuters
              via MarketScreener and separately republished by Yahoo Finance/Reuters on July 6, 2022.
              Flexe raised $119M led by BlackRock, with participation from Tiger Global, T. Rowe Price,
              Madrona Ventures, and Prologis Ventures, at a post-money valuation in excess of $1 billion —
              conferring unicorn status. The prior round was approximately $70M raised about two years before
              the Series D, according to the Reuters article. That pre-Series D round date and structure are
              not confirmed by official materials, suggesting the prior round was a Series C or late-stage
              venture round circa 2020.

              Third-party funding trackers disagree materially on total capital raised. Tracxn reports $330M
              over 7 rounds; Growjo reports $263M; GetLatka reports $205.4M over 5 rounds with the most
              recent being a $67.9M Venture Round in 2022; and StartupIntros reports $268.6M across 7 rounds.
              The spread between the lowest ($205M) and highest ($330M) estimate is $125M — roughly equivalent
              to the Series D itself. This level of discrepancy is unusual for a well-known unicorn and suggests
              that at least some trackers are double-counting tranches, including non-equity debt, or using
              different cutoff dates. The true total raised is unresolvable without access to Flexe's cap table
              or audited financial statements, and the inconsistency itself is a diligence flag.

              As of the report date (June 23, 2026), no public record of a post-2022 financing event — new
              equity round, credit facility, or strategic investment — has been located. Flexe's Series D was
              nearly four years ago at the time of writing. The absence of a disclosed raise since 2022, combined
              with two major layoff rounds in 2023–2024, is consistent with a company that is either (a)
              extending runway by cutting costs, (b) operating near breakeven on a reduced cost base, or (c)
              in active fundraising without disclosure. All three scenarios have different implications for
              investors, and distinguishing them requires management access.
