      - number: '2.2'
        title: Market sizing — multiple lenses and contradictory estimates
        blocks:
          - type: paragraph
            body: |-
              Sizing Flexe's addressable opportunity requires three stacked lenses because no single published
              estimate cleanly captures its model: (1) the on-demand warehousing platform TAM, (2) the US 3PL
              addressable envelope as an outer bound, and (3) a bottom-up SAM derived from the US industrial
              real-estate and ecommerce fulfillment markets where Flexe actually operates.

              Lens 1 — On-demand warehousing platform TAM. Mordor Intelligence pegs the global market at $19.67B
              in 2026 growing to $39.85B by 2031 (15.17% CAGR). North America at 35% share implies roughly $6.9B
              in 2026. This is the most directly comparable estimate to Flexe's transaction model. Research and
              Markets published a conflicting estimate of $149.47–167.46B for 2026, citing similar segment labels;
              the 7–8× gap is unresolved and likely reflects scope creep into broader logistics-as-a-service or
              outsourced 3PL spending. Precedence Research's 13.07% CAGR from a $167.46B base implies even
              faster compound growth but anchors off the same inflated base. Preserving this contradiction is
              material: if Flexe's TAM is ~$7B (narrow) rather than ~$150B (broad), Flexe's implied market share
              targets are very different investments.

              Lens 2 — US 3PL addressable envelope (outer bound). The US 3PL market at $220–299B (2026) is the
              outer bound of what Flexe could theoretically capture if it displaced traditional contracts. The
              CSCMP 2026 State of Logistics Report placed total US business logistics costs at $2.4 trillion
              (7.8% of GDP), contextualising the 3PL market as a subset of the broader supply-chain spend.
              GXO's $13.2B in 2025 revenue across 1,000+ facilities and 200M sq ft illustrates how one large
              incumbent already captures ~5–6% of a conservatively sized US 3PL market — a benchmark for what a
              scaled platform play could aspire to over a decade.

              Lens 3 — Bottom-up US industrial real-estate demand (SAM proxy). The US industrial inventory stood
              at approximately 16.2 billion square feet as of early 2026 (JLL Q1 2026). Net absorption in Q1 2026
              reached 50.9 million sq ft, the strongest first quarter since 2023 (Cushman & Wakefield). Annualised
              leasing is projected at nearly 1 billion sq ft in 2026 (CBRE). National asking rents averaged
              approximately $10.20–10.34/sq ft NNN, with vacancy at 7.0–7.5% after stabilising from post-pandemic
              highs. If one assigns a rough 10–15% incremental share to flexible/on-demand arrangements (a
              conservative estimate given CBRE's note that 3PLs will account for 35%+ of activity), the implied
              flexible warehousing SAM in US annual spend ranges from $4B to $12B, consistent with the lower
              end of analyst estimates. This SAM construction is directional only; Flexe does not disclose its
              actual network utilisation or revenue share relative to total industrial spend.

              The Logistics Managers Index (LMI) for May 2026 read 69.5, indicating continued expansion of
              warehousing utilisation and costs, though growth has moderated from early-year highs. Warehousing
              costs remain elevated while inventory levels plateaued — a signal that end-market demand exists
              but operators face margin pressure from the cost side, which supports adoption of variable-cost
              models that convert fixed occupancy expense into on-demand spend.
