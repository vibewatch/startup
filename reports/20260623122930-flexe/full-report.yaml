  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Market and Demand Normalization Risks
        blocks:
          - type: paragraph
            body: >
              Flexe's core value proposition — enabling enterprises to substitute long-term warehouse leases with
              short-term spot capacity — depends on a structural inefficiency between fixed and variable warehousing
              supply. That inefficiency is under sustained pressure in 2026 from two converging forces. First, the US
              industrial real estate market has experienced rising vacancy for 16 consecutive quarters since Q2 2022,
              reaching 7.4% nationally in Q1 2026 per Colliers data, with large-format distribution centers exceeding
              11% vacancy in oversupplied markets. As traditional lessors offer shorter leases and more flexible terms
              under occupancy pressure, the economic gap that Flexe monetizes through spot pricing narrows. Second,
              Flexe's own Spot Warehousing Index, launched at Reuters Supply Chain USA 2026, documents what the company
              labels "warehousing stagflation" — the paradox of rising vacancy coinciding with elevated lease rates —
              which squeezes operator economics while enterprise buyers expect competitive spot pricing. The 2026 State
              of Logistics Report (FreightWaves/GEP Worldwide) identifies tariff changes averaging every 1.5 weeks as
              causing "paralysis effects" in network decisions, complicating enterprise warehousing program launches
              that Flexe converts into recurring logistics program revenue. Supply Chain Dive's 2026 risk outlook
              confirms warehousing overcapacity in certain formats as a top risk for platform-based logistics providers.
              Meanwhile, US e-commerce growth has normalized from COVID peaks to single-digit annual rates, moderating
              the explosive demand that drove Flexe's 2021–2022 network expansion. These forces are structural and
              require scenario-specific assumptions when modeling Flexe's revenue growth trajectory.
            claimRefs:
              - CR022
