  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Landscape
        blocks:
          - type: paragraph
            body: >
              Flexe's commercial model bifurcates into two interlocking buyer categories: enterprise shippers (the
              paying customers) and warehouse operators (the supply-side partners who also pay a technology fee). On the
              shipper side, Flexe primarily serves Fortune 500 and large enterprise organizations across retail,
              consumer packaged goods (CPG), e-commerce, food and beverage, and gaming verticals. Its client roster
              spans 6 of the top 10 US retailers, 4 of the top 5 global CPG brands, and an estimated 30%+ of the Fortune
              100 according to industry analysis from LogisticsNavigators. The archetypal buyer is a VP or SVP of Supply
              Chain or Logistics at a large retailer or CPG manufacturer facing capacity constraints, seasonal demand
              swings, or a need to rapidly expand a distribution footprint without long-term lease commitments.

              The user is typically a supply chain operations team using the Flexe Technology Platform for inventory
              visibility, order management, and analytics. The payer is the enterprise finance or procurement team that
              structures the transaction-based or program-fee contract with Flexe. Mid-market e-commerce brands (DTC
              mattresses, kitchenware, consumer electronics) represent a secondary segment, relying on Flexe for
              asset-light fulfillment scaling. 3PL operators are a distinct third segment: companies like Johnson
              Logistics and Innovel use Flexe's platform to access demand and standardize operations across multiple
              facilities, participating as both supplier and paying technology customer.

              Geographically, Flexe is exclusively North America-focused (US and Canada), which is both a strength
              (network density) and a gap (no international customers). Revenue bands are not disclosed publicly, but
              industry sources suggest enterprise accounts typically represent six-to-seven-figure annual contract
              values based on transaction throughput and program fees.
