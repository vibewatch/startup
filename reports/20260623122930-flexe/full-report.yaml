    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and business model
        blocks:
          - type: paragraph
            body: >-
              Flexe presents itself as the pioneer of "Flexible Warehousing Infrastructure," a category that combines
              software, open logistics networks, and transactional pricing to help enterprises avoid long-term warehouse
              commitments. Across its homepage, about page, and logistics-network materials, the company consistently
              describes an asset-light model in which a single integration opens access to a broad network of warehouse
              operators and facilities across North America. That identity matters because it frames Flexe less as a
              traditional 3PL and more as a logistics orchestration layer designed to turn fixed real-estate liabilities
              into variable operating capacity.


              Public materials also show that Flexe is no longer selling only overflow storage. The company now
              emphasizes three primary use cases — eCommerce fulfillment, retail distribution, and network capacity —
              supported by integration pathways, analytics, and operations support. The home page highlights 3,000+
              warehouses, 605M+ square feet of available capacity, under-30-day average go-live, and 20+ integration
              methods. The logistics-network and technology-platform pages expand that pitch into a single-platform
              model for orders, inventory, and analytics, while the 2025 strategy release says Flexe is expanding
              transportation partnerships, white-label services, and automation. Taken together, the evidence supports a
              company that has evolved from an on-demand warehousing marketplace into an enterprise omnichannel
              logistics platform, even if some of the exact scale metrics vary slightly between company pages and press
              releases.
