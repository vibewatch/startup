      All scores are author assessments derived from public evidence only; not company-confirmed. Financial health score
      reflects absence of confirmed 2022-post round and undisclosed burn. Valuation attractiveness reflects 10–11x
      EV/ARR vs 0.54–5x comparable range.
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV034
      - CV036
    data:
      items:
        - label: Market size and tailwinds
          value: 3 / 5
          unit: score
          trend: stable
        - label: Product and technology proof
          value: 3.5 / 5
