      - number: '1.2'
        title: Leadership, organization, and governance signals
        blocks:
          - type: paragraph
            body: >-
              The most stable leadership fact in public materials is that Karl Siebrecht remains Flexe's co-founder and
              CEO. His profile describes a technology-heavy background spanning AdReady, Atlas at aQuantive, Bain, and
              the U.S. Navy, which supports the narrative that Flexe was founded by operators who saw warehousing as a
              software and network-coordination problem. Current public leadership materials also show Curt Anderson as
              CFO and COO, indicating that finance and operations leadership are now combined in one executive seat.
              That is notable because third-party reporting from 2023 separately documented David Kipe joining as COO,
              suggesting that Flexe has reconfigured its operating leadership during a period that also included
              workforce reductions.


              Beyond the top two roles, the public leadership page and careers page show a fairly complete functional
              skeleton across finance, legal/people, product, engineering, operations, business development, revenue
              operations, and marketing. This is enough to infer that Flexe still operates as a full-stack enterprise
              logistics software-and-services company rather than a narrow marketplace. What is missing is governance
              transparency: the reviewed sources do not provide a current public board roster, voting-control detail, or
              a clear statement about independent directors. For diligence purposes, that means founder dependence
              remains high, public evidence on succession planning is thin, and board-level oversight has to be treated
              as an unresolved diligence area rather than an established strength.
