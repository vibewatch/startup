callouts:
  - calloutType: strength
    title: Named Enterprise Proof with Quantified ROI
    body: >
      Flexe has documented outcomes across named enterprise accounts spanning hardware retail (Ace Hardware),
      tech-enabled CPG (Aterian), and DTC furniture (Lull), with measurable delivery improvements of 51–97%
      and cost reductions of 30% on shipping. The Forrester TEI study provides a credible third-party ROI
      framework showing 124% return over three years for enterprise logistics programs. FeaturedCustomers
      4.8/5 from 2,174 ratings adds breadth to the positive signal.
    claimRefs: [CU006, CU010, CU019, CU018]

  - calloutType: risk
    title: Concentration and Retention Opaqueness
    body: >
      Estimated Walmart + Staples volume share of ~38% represents material customer concentration. Average
      on-demand tenure under 12 months and absence of publicly disclosed NRR, GRR, or cohort data leave
      revenue durability opaque. Gross margin at ~18.2% in FY2025 reflects pricing concessions to large
      accounts. Enterprise customers use short-contract flexibility to exit or renegotiate, structurally
      limiting Flexe's revenue predictability.
    claimRefs: [CU024, CU025, CU026, CU036, CU037]

  - calloutType: recommendation
    title: Diligence Priority — Request NRR, Cohort Data, and Customer Revenue Mix
    body: >
      Diligence must surface (1) NRR and GRR disaggregated by programmatic vs. on-demand customer tier,
      (2) revenue share from top-5 and top-10 customers, (3) contract length distribution and renewal rates,
      (4) customer count by tier, and (5) whether the 2023–2024 layoffs affected customer success
      and operations staff. Without this data, revenue durability cannot be assessed.
    claimRefs: [CU024, CU026, CU037]

