  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention-gap
      missingEvidence: "Flexe NRR, GRR, and cohort-level customer retention rates by contract tier (programmatic vs. on-demand)"
      whyItMatters: "Revenue durability and valuation multiples depend critically on retention; without NRR and GRR the platform's economics cannot be properly assessed"
      diligencePath: "Request management cohort analysis, churn rates by contract tier, and historical NRR/GRR from Flexe finance team"
      relatedQuestionRefs: [QU012]

    - type: private-evidence-only
      severity: blocking
      topic: concentration-risk
      missingEvidence: "Revenue share from Flexe's top 1, 2, 5, and 10 customers; named customer revenue breakdown"
      whyItMatters: "Estimated 38% volume concentration in 2 accounts signals significant counterparty risk; actual figures needed for investment decision"
      diligencePath: "Request customer revenue concentration data, top-10 account GMV share, and contract duration distribution from Flexe management"
      relatedQuestionRefs: [QU005]

    - type: missing-source
      severity: material
      topic: independent-reviews
      missingEvidence: "Independent third-party reviews of Flexe on G2, Gartner Peer Insights, or equivalent verified platforms"
      whyItMatters: "FeaturedCustomers aggregate rating lacks the verification rigor of G2 or Gartner Peer Insights; independent negative reviews are not surfaced"
      diligencePath: "Check G2 (g2.com/products/flexe), Gartner Peer Insights, and TrustRadius for any verified user reviews; Flexe's absence from these platforms is itself a signal"
      relatedTableRefs: [TU004]

    - type: private-evidence-only
      severity: material
      topic: customer-count
      missingEvidence: "Total number of active enterprise customers, customer count by tier (Fortune 500 vs. mid-market vs. spot), and customer churn count per year"
      whyItMatters: "Customer count and tier mix are essential for modeling platform revenue growth and assessing dependency on a small number of large accounts"
      diligencePath: "Request active customer count, new customer acquisition and churn figures from Flexe management"

    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-enumeration
      missingEvidence: "Full list of Flexe's current active enterprise clients; many prominent logos (Walmart, Staples, P&G, Target) are claimed but not formally case-studied"
      whyItMatters: "Logo claims without case study backing provide limited diligence value; unnamed customers prevent benchmarking customer quality against public comps"
      diligencePath: "Request reference customer list from Flexe; cross-check claimed Fortune 100 clients with publicly available tender records or press release citations"
      relatedTableRefs: [TU003]

    - type: missing-source
      severity: minor
      topic: forrester-tei-independence
      missingEvidence: "Independent (non-commissioned) corroboration of Forrester TEI ROI figures by a neutral analyst or customer-disclosed financial data"
      whyItMatters: "Commissioned studies carry inherent confirmation bias; a 124% ROI claim requires independent validation to carry diligence weight"
      diligencePath: "Seek publicly available analyst reports on on-demand warehousing ROI; request audited financial data from Flexe customers who participated in the Forrester study"
      relatedQuestionRefs: [QU007]

    - type: missing-source
      severity: minor
      topic: competitive-customer-proof-comparison
      missingEvidence: "Comparable customer proof and ROI documentation from Stord, Ware2Go, or Flowspace for apples-to-apples competitive benchmarking"
      whyItMatters: "Without comparative customer proof, it is unclear whether Flexe's ROI documentation represents genuine differentiation or standard industry practice"
      diligencePath: "Review Stord and Ware2Go public case studies; compare depth of outcome metrics and customer naming against Flexe's public portfolio"
      relatedQuestionRefs: [QU015]

    - type: missing-source
      severity: minor
      topic: fortune100-claim-verification
      missingEvidence: "Independent verification of Flexe's claim that 30%+ of Fortune 100 enterprises use Flexe logistics programs"
      whyItMatters: "If accurate, this demonstrates exceptional enterprise penetration; unverified it is a marketing claim that may reflect any engagement level including trials or single-use spot transactions"
      diligencePath: "Cross-reference Flexe case study clients against Fortune 100 lists; request customer list from Flexe with revenue tier classification"
      relatedQuestionRefs: [QU020]

acknowledgedWarnings:
  - dimension: tableNotes
    reason: "TU003 (Named Customer Proof) contains enumeration scope and detailed per-row limitations that serve as the equivalent of table notes; a separate notes field would duplicate this information without adding value."
  - dimension: figureType
    reason: "FU002 uses funnel type with estimated relative-scale values because actual conversion rate data is unavailable; substituting a table would lose the funnel visualization value for investors reviewing adoption stages."
