      - number: '7.4'
        title: 执行、治理与融资风险
        blocks:
          - type: paragraph
            body: >
              Flexe 记录最充分的反向信号是裁员。Washington state 的 WARN Act 文件记录了两次事件：2023 年 9 月裁员（员工 33%，约 131 人）和 2024 年 1 月 8
              日提交的文件，影响 99 名员工，2024 年 3 月 8 日生效（裁员 38%）。WARNScan 和 LayoffAlert 独立佐证了 2024 年文件。累计看，这两次裁员约等于峰值 headcount 的
              71%，显著压缩了直接关联企业客户管理的运营能力，包括客户成功、实施和运营支持。未记录 2025 或 2026 年 WARN 文件，说明 workforce 可能已经稳定；但 Flexe 没有公布当前
              headcount、人员配比或组织结构。治理和融资方面，公开记录留下实质缺口。Flexe 最近一次融资是 2022 年 7 月（$119M Series D，估值 $1B，由 InfotechLead 和
              Tracxn 确认）。PitchBook 显示截至 2026 年 6 月没有后续融资轮——约四年没有确认资本注入。Revenue run-rate、burn rate 和现金余额仍未披露。Flexe
              没有披露董事会构成、独立董事人数，或裁员后的治理结构变化。SaaStr 数据显示，如今只有 11% 的独角兽公司通过 IPO 退出（历史上为 53%），因此 M&A 或二级交易更可能发生；但
              BlackRock、T. Rowe Price 和 Tiger Global 在四年持有期后的投资人压力，制造了无法从公开数据独立评估的治理张力。Eqvista 分析显示，随着 2022
              年时期增长倍数压缩，pre-IPO 后期创业公司在 2025–2026 年环境中普遍面临更高 down-round 风险。
