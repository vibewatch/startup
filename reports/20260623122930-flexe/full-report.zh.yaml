  - id: FI004
    title: 资本强度与现金流桥——估算 2024 年经济模型
    type: waterfall
    layout: wide
    summary: 估算年度经济模型显示，轻资产总收入与运营成本结构之间仍有缺口；若没有经审计数据，运营层面盈利能力高度不确定。
