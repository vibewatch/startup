      - number: '4.2'
        title: 融资历史、资本结构与估值
        blocks:
          - type: paragraph
            body: >-
              Flexe 最可靠、可查证的融资事件是 Series D 轮：Reuters 经 MarketScreener 报道，Yahoo Finance/Reuters 也在 2022 年 7 月 6 日转载。该轮融资
              $119M，由 BlackRock 领投，Tiger Global、T. Rowe Price、Madrona Ventures 和 Prologis Ventures 参投，投后估值超过 $1B，Flexe
              因此进入独角兽行列。Reuters 称，上一轮约在 Series D 前两年完成，融资约 $70M。官方材料没有确认这轮 pre-Series D 的日期和结构，因此更可能是 2020 年前后的 Series C
              或后期风险投资轮。


              第三方融资追踪平台对总融资额分歧很大。Tracxn 记录 7 轮、$330M；Growjo 记录 $263M；GetLatka 记录 5 轮、$205.4M，最近一轮是 2022 年 $67.9M 的
              Venture Round；StartupIntros 记录 7 轮、$268.6M。最低估算（$205M）与最高估算（$330M）相差 $125M，几乎等于 Series D
              本身。对一家知名独角兽而言，这种差异并不常见，说明至少部分追踪平台可能重复计算了分批到账金额、纳入了非股权债务，或采用了不同截止日期。没有 Flexe 的 cap table
              或经审计财务报表，真实累计融资额无法还原；这种不一致本身就是尽调警讯。


              截至报告日期（2026 年 6 月 23 日），未发现 2022 年之后的公开融资记录——无论是新股权轮、信贷额度，还是战略投资。写作时，Flexe 距 Series D 已近四年。自 2022
              年以来没有披露新融资，又在 2023–2024 年经历两轮大规模裁员，说明公司可能处于三种状态之一：（a）靠降本延长
              runway；（b）在缩小后的成本基底上接近盈亏平衡；或（c）正在融资但尚未披露。三种情景对投资人的含义不同，必须接触管理层才能区分。
