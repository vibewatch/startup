      - number: '2.2'
        title: 市场规模——多重视角与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >-
              估算 Flexe 的可服务机会，需要叠加三层视角，因为没有单一公开估算能干净捕捉其模式：（1）按需仓储平台 TAM；（2）作为外部上限的美国 3PL 可触达边界；（3）从 Flexe
              实际运营的美国工业地产和电商履约市场自下而上推导出的 SAM。


              视角 1——按需仓储平台 TAM。Mordor Intelligence 估算，2026 年全球市场为 $19.67B，到 2031 年增至 $39.85B（15.17% CAGR）。北美占 35%，意味着
              2026 年约 $6.9B。这是最能直接对比 Flexe 交易模式的估算。Research and Markets 使用类似细分标签，却给出 2026 年 $149.47–167.46B 的冲突估算；7–8×
              的差距尚未解决，可能反映口径扩张到了更广泛的物流即服务或外包 3PL 支出。Precedence Research 从 $167.46B 基数给出的 13.07% CAGR
              暗示更快复合增长，但也锚定在同一个被抬高的基数上。保留这个矛盾很重要：如果 Flexe 的 TAM 是约 $7B（窄口径），而不是约 $150B（宽口径），Flexe 隐含的市场份额目标就是两种完全不同的投资。


              视角 2——美国 3PL 可触达边界（外部上限）。2026 年 $220–299B 的美国 3PL 市场，是 Flexe 理论上替代传统合同时可捕获的外部上限。CSCMP 2026 State of
              Logistics Report 将美国企业物流总成本放在 $2.4 trillion（GDP 的 7.8%），把 3PL 市场放进更大供应链支出的子集里。GXO 2025 年收入 $13.2B，覆盖
              1,000+ 个设施和 200M 平方英尺，说明一家大型既有供应商已经捕获保守口径美国 3PL 市场约 5–6%——这是一个平台型公司十年维度可望达到的基准。


              视角 3——自下而上的美国工业地产需求（SAM 代理）。截至 2026 年初，美国工业地产库存约 16.2 billion 平方英尺（JLL Q1 2026）。2026 年 Q1 净吸收达到 50.9
              million 平方英尺，为 2023 年以来最强一季度（Cushman & Wakefield）。2026 年全年租赁预计接近 1 billion 平方英尺（CBRE）。全国要价租金平均约
              $10.20–10.34/sq ft NNN，空置率从疫情后高位稳定后为 7.0–7.5%。若粗略把 10–15% 增量份额分配给灵活 / 按需安排（鉴于 CBRE 指出 3PL 将占活动
              35%+，这是保守估算），隐含的美国年度灵活仓储 SAM 支出为 $4B 至 $12B，与分析师估算低端一致。这个 SAM 构造只具方向性；Flexe 没有披露其实际网络利用率或相对总工业支出的收入份额。


              2026 年 5 月 Logistics Managers Index（LMI）为
              69.5，显示仓储利用率和成本继续扩张，尽管增速较年初高位放缓。仓储成本仍高，库存水平则趋于平台期——这说明终端市场需求存在，但运营方承受来自成本端的利润压力，从而支持采用把固定占用成本转为按需支出的可变成本模式。
