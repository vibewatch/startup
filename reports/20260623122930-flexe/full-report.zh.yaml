      - number: '4.5'
        title: 附录
        blocks:
          - type: callout
            title: 公开数据无法承保 runway
            body: >-
              未披露现金余额、自 2022 年 7 月以来没有融资、两轮大规模裁员（合计约 230 名 WARN 通知员工）叠加，形成了资本充足性缺口；没有直接查看 Flexe 资产负债表和 burn-rate
              计划，就无法弥合。公司 2024 年 1 月「现金状况非常强劲」的表述如今已过时 18 个月以上，runway 含义完全取决于 burn rate 和收入动态，而这些都无法从公开渠道观察。任何需要相信 Flexe
              未来 12 个月资本充足性的投资论点，都必须先解决这个数据缺口。
            calloutType: risk
            claimRefs:
              - CI021
              - CI033
              - CI034
              - CI043
          - type: callout
            title: 收入质量参差——交易型模型让 ARR 暴露于需求周期
            body: >-
              Flexe 按使用量计费、无承诺的定价模型，对客户是强营销差异点；对投资人则是收入质量挑战。SaaS 公司靠高净收入留存和多年期 ACV 稳住收入，Flexe
              的仓储和履约收入却直接暴露于电商需求周期、零售商库存正常化和货运市场走弱——这些条件正是 2023–2024 年裁员的触发背景。缺少 NRR 数据和 churn 指标，收入耐久性无法量化。Deloitte
              Fast 500 排名从 236（2023）降至 370（2024），即便绝对收入基数趋稳，也与收入增长放缓一致。
            calloutType: risk
            claimRefs:
              - CI003
              - CI007
              - CI009
              - CI037
              - CI039
              - CI040
          - type: callout
            title: Forrester TEI 验证需求侧经济性，但不能证明供给侧毛利
            body: >-
              Forrester Total Economic Impact 研究（Flexe 委托）显示，企业客户能获得有吸引力的 ROI（3 年 124%，大型合成客户 NPV 为
              $97.4M）。这验证了需求前提：客户愿意为 Flexe 提供的灵活性付费，因为替代方案——固定租约、长期 3PL 合同和自有配送中心——隐藏成本很高。但 TEI 研究不能证明 Flexe 的毛利率或
              contribution economics；客户节省 $19M capex，并不等于 Flexe 能直接从这笔节省中捕获毛利。供给侧毛利问题仍然悬而未决。
            calloutType: insight
            claimRefs:
              - CI025
              - CI026
              - CI027
              - CI042
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块、服务层与客户工作流定义
        blocks:
          - type: paragraph
            body: >-
              Flexe 的产品围绕三个明确命名的服务层组织：Logistics Network、Technology Platform 和 Operations Team。三层合在一起，构成 Flexe
              所称的「Flexible Warehousing Infrastructure」——一种托管式、轻资产的替代方案，取代企业自持或租赁专用仓库空间。


              Logistics Network 层是实体供给侧：美国和加拿大境内由 800+ 独立合作方运营的 3,000
              多个仓储设施。企业客户接入该网络，用于存储库存、履约电商订单、支持零售分销，或吸收溢出和季节性产能高峰。Flexe
              将该网络描述为北美最大的灵活仓储网络，客户可以按碎片化方式接入预先筛选的多客户仓库运营商。客户不与单个运营商签租约；Flexe 作为编排中介，提供单一商业关系和统一 SLA 包装。


              在产品层级内，三条商业服务线对应不同客户用例：（1）Fulfillment——电商拣货、打包、发货项目，帮助品牌把库存前置到消费者需求中心附近，并执行全渠道订单；（2）Distribution——大宗存储和零售补货项目，支持向零售门店、批发合作伙伴和收货中心交付并满足
              OTIF；（3）Capacity——纯按需存储项目，在没有固定期限承诺的情况下提供溢出、季节性暂存或过渡性存储。三者之上叠加 Flexe Discover，这是 2026 年推出的市场情报与基准平台。


              客户主要是 Fortune 500 零售商、CPG 品牌和全渠道运营商。Flexe 公开提及的具名客户包括 Target、Nike、Dick's Sporting Goods、Lowe's 和 Mars。GTM
              模型聚焦企业客户：每个账户配备专门的物流分析师和运营经理，反映出在技术平台之上叠加高接触度托管服务的交付模式。
