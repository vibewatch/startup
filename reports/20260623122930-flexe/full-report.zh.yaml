      - number: '6.3'
        title: 采用轨迹与平台规模
        blocks:
          - type: paragraph
            body: >
              Flexe 披露的规模数据反映出截至 2022 年的快速网络和体量增长，而 2022 年也是最近披露的参考年份。公司 2022 年通过平台处理超过 1,400 万个订单，并仅在当年上线 3,000
              多个新履约节点——没有新增任何长期租约承诺。行业来源的收入估算显示，2020 年收入 $30M，2022 年收入 $70M+，同比增长约 100%，但 Flexe 未公开确认这些数字。LeadIQ 将当前收入放在
              $100–250M 区间。

              Forrester Total Economic Impact 研究——Flexe 委托、2023 年发布——提供了最细颗粒度的已记录采用结果：合成客户三年收益 $175.7M，对应成本 $78.3M，净得
              $97.4M NPV 和 124% ROI。主要收益驱动包括店内和电商销售增加 $47.5M（来自更快补货）、避免资本成本 $19M（避免 9 个建设项目）、节省产能成本 $3.4M，以及新设施爬坡时间缩短
              50%+。这些数字是合成且受委托生成，独立性有限，但方法遵循 Forrester 标准 TEI 框架。

              Flexe CEO Karl Siebrecht 于 2026 年 6 月在 Reuters Supply Chain USA 演讲，凸显持续的企业参与度，以及 Spot Warehousing Index
              的推出——这是针对现货仓库费率真实交易数据的自有基准。该产品增强了 Flexe 的企业情报价值主张，支撑 2026 年的客户粘性和认知度。Ace Hardware 2025
              年继续更新部署，也至少说明锚定账户具备多年客户耐久性。
