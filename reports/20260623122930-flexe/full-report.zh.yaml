  - id: TR004
    title: 人员 / 执行风险台账
    columns:
      - 角色 / 职能
      - 依赖或缺口
      - 可能性
      - 严重性
      - 缓释措施
      - 尽调路径
    rows:
      - - CEO Karl Siebrecht（创始人）
        - 公开姓名中的唯一战略领导者；未披露继任者或联席 CEO；未披露接班计划
        - 中 — 创始人领导形成单点故障
        - 高 — 若其离任，会带来战略不确定性，并削弱企业客户信心
        - 假设董事会有监督（未确认）；截至 2026 年 6 月，Siebrecht 仍在活跃发声（Reuters Supply Chain USA）
        - 索取董事会接班计划；评估必要时 Curt Anderson 接任的准备度
      - - CFO/COO Curt Anderson（双重角色）
        - 财务和运营合并在一个高管席位上；对一家接近潜在退出的后期独角兽来说并不常见
        - 中 — 若某一职能需要专职负责人，双重角色会形成依赖
        - 高 — IPO 前或并购过程中 CFO 缺口会构成硬伤；COO 缺口影响运营连续性
        - 双重整合可能提高效率；组织信息披露有限
        - 索取组织架构图；评估任何临近融资或退出流程前，是否计划拆分 CFO/COO 职能
      - - 工程和产品团队
        - 裁员 71% 之后，工程人数未知；经历两轮重大裁员后，产品路线图执行能力不确定
        - 高 — 精简后的团队必须维护复杂的多集成平台，并交付路线图
        - 高 — 平台可靠性和功能迭代速度直接取决于工程能力
        - 仍有产品发布（2025 年增长战略、Spot Warehousing Index），说明仍保有部分持续能力
        - 索取当前工程人数；评估 sprint 速度、开放工程岗位和产品路线图里程碑
      - - 客户成功和实施团队
        - 裁员后，面向客户的运营能力下降；公司未公开披露 CSM 配比或实施排队情况
        - 高 — 部署复杂的企业客户需要专门支持
        - 高 — CSM 能力下降会造成实施延误、SLA 未达标和流失
        - 假设平台自助和自动化能部分抵消；无文档支持
        - 索取裁员前后 CSM 与客户比例；评估实施 backlog 和上线周期指标
    notes: >-
      人员缺口评估来自 WARN Act 申报数据和公开组织信息。裁员后各职能实际人数未公开披露。Flexe 仍在发布产品并进行企业展示 （2026 年 6
      月），说明公司仍维持功能性运营，但未与管理层沟通前，无法确认团队容量和人员质量。
