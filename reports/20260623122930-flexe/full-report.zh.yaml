      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 企业网络密度是真实但尚未充分挖掘的战略资产
            body: >-
              Flexe 覆盖 800+ 运营商、3,000+ 设施的网络，代表多年签约、入驻和关系投入，无法快速复制。如果客户验证属实，且有质量指标支撑，这一网络护城河可支持高于轻资产 3PL
              可比公司底部的估值溢价。Forrester TEI 研究确认企业买家能获得真实 ROI；若美国前十大零售商中 6 家的渗透也经独立验证，对于寻求大规模零售商关系的潜在战略收购方，这就是集中销售资产。
            calloutType: strength
            claimRefs:
              - CV038
              - CV001
          - type: callout
            title: 四年前的 $1B 估值已滞后，市场已重估 50–68%
            body: >-
              Flexe 上一次确认估值定在 2022 年私募市场周期峰值。CNBC 和 PitchBook 2026 年 6 月数据显示，2022 年队列公司平均交易价格较上一轮估值约低 52%。对照 $91–97M
              ARR，$1B 估值要求 10–11x EV/ARR 倍数，没有任何可比上市物流公司能支撑。若没有新一轮新股融资确立当前市场价格，$1B 数字只是会计产物，不是市场价格；任何投资尽调都必须独立确定入场价格。
            calloutType: risk
            claimRefs:
              - CV023
              - CV010
              - CV036
          - type: callout
            title: 按当前估值观察；买入需要价格重置和财务证明
            body: >-
              作为北美最大的独立按需仓储平台之一，Flexe 值得持续跟踪，但当前 $1B 估值相对所有可得可比证据都偏高。上调至买入的条件具体且可衡量：（1）入场价格不高于
              $700M，且确认优先权安排一致；（2）经审计毛利率高于 30%；（3）NRR 高于 110%；或（4）点名 M&A 流程且指示价值高于 $900M。若没有这些信号，资本纪律要求保持耐心。
            calloutType: recommendation
            claimRefs:
              - CV034
              - CV037
