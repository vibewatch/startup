      - number: '4.3'
        title: 成本结构、毛利驱动因素与单位经济性
        blocks:
          - type: paragraph
            body: >-
              相比自有仓库的物流运营商，Flexe 的轻资产模型从结构上降低了资本强度，但也带来另一类成本挑战：大部分总收入会转付给仓库合作运营商，Flexe 留下的是一层平台毛利，厚度远低于典型 SaaS
              公司。按需仓储平台的行业基准和第三方分析显示，仓储和履约收入中 70–85% 会作为直接销售成本流向仓库合作方，平台 take-rate 只剩 15–30%。若收入基数为 $91–97M，对应毛利约
              $13–29M，毛利率约 15–25%。这显著低于软件业务基准（通常为 60–80% 毛利率），但符合「运营商 + 技术」混合模型。


              全球最大的纯合同物流服务商 GXO Logistics 2025 年收入 $13.2B，直接运营费用约 $11.2B，隐含毛利率约 15%。GXO
              是完全重资产的合同运营商，不是轻资产平台，但这个对比说明，物流行业整体毛利很薄；只要仓库劳动力、房地产转付成本和订单级可变成本计入收入成本，即便是技术赋能平台，也会承受结构性成本压力。Flexe
              不持有设施，毛利率应略高于 GXO 的 15%；但其收入主要来自服务交付，而不是软件授权，因此不太可能达到纯 SaaS 水平。


              除直接仓库成本外，Flexe 的成本基底还包括：维护 WMS、集成层和分析能力的平台与工程团队；企业销售和客户管理职能；负责客户
              onboarding、异常处理和网络优化的运营与解决方案团队；以及一般行政开支。2023–2024 年裁员前，Flexe 约有 400 名员工（Supply Chain Dive 引述公司 LinkedIn
              资料）。在 33% 和 38% 两轮裁员之后——WARN 通知涉及合计约 230 名员工（WARNTracker）——当前员工数估计为 155–175 人。按企业物流技术岗位平均 fully loaded
              人力成本 $140–180K 估算，裁员后的员工规模对应每月由薪酬驱动的 burn 约 $1.8–2.6M，另有技术基础设施、办公室和管理开销。重组后每月总运营成本估计为 $2.5–5.0M。
