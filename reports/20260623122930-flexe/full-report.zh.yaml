      - number: '6.4'
        title: 留存、耐久性与满意度信号
        blocks:
          - type: paragraph
            body: >
              Flexe 的留存画像在结构上并不清晰。平台的根本价值主张——无长期合同、无固定费用、无 CapEx——一方面吸引企业客户，另一方面也移除了支撑高毛留存的合同壁垒。分析师估计，到 2026 年初按需预订同比增长
              18%；但 spot / on-demand 合同的平均客户 tenure 估计不到 12 个月，显示交易型 churn 风险较高。项目化物流客户（多项目、多节点客户）留存可能高于纯 spot
              客户，但没有公开披露的细分层级数据。

              第三方情绪指标整体积极：FeaturedCustomers 基于 2,174 条引用评分给 Flexe 4.8/5；具名高管 testimonials（Aterian 的 Kevin Nohl、Ace
              Hardware 的 Kevin Kryscio、Lull 的 Robert Vaughn）认为 Flexe 促成了业务模式转型。The New Warehouse 播客 2023 年 9 月一期邀请 Flexe
              VP of Logistics 和 Director of Logistics
              Strategy，也强化了外部对项目化物流差异化的认知。不过，这些来源自选择且偏正面；在尽调时，未发现独立负面评价平台（G2、Gartner Peer Insights）发布了可访问的 Flexe 验证评分。

              2023 年（裁员 33%）和 2024 年（裁员 38%）的裁员减少了 Flexe
              面向客户的运营人员，合理地带来服务质量和客户满意度风险；但尚未发现公开记录中有客户流失或投诉明确归因于人员配置质量。FY2025 估计毛利率压缩至
              18.2%——部分归因于大客户合同让利——是一个间接的反向留存信号：议价能力强的客户正在榨取价格，说明 Flexe 对这些关系高度依赖。
