      - number: '6.5'
        title: 扩张动态、集中度风险与反向信号
        blocks:
          - type: paragraph
            body: >
              客户集中度是 Flexe 画像中的实质风险。分析师估计，Walmart 和 Staples 在 FY2025 合计约占平台量的 38%，形成双边依赖：Flexe
              需要这些账户稳定收入，同时又面对其在定价、服务水平和合同条款上的谈判杠杆。据称企业账户会较标准现货价格谈低 12–20%，压缩 Flexe 本已很薄的毛利。SWOT
              分析将蓝筹客户集中度同时列为优势（验证、收入）和风险（依赖、定价压力）。

              多个已记录案例显示出 land-and-expand 动态：Ace Hardware 从 2016 年的溢出试点，扩展到 2025 年仍在持续的多年 Hurricane Heroes
              与长期溢出项目；全国性零售商从 9 节点试点，扩展到规划覆盖所有 2,000+ 门店 350 英里以内；Aterian 随业务增长动态增加节点。这些多项目关系的收入质量高于 spot 交易。但短合同模型意味着
              Flexe 的合同锁定有限；客户可以在没有多年期罚金的情况下退出。

              研究记录中未出现公开记录的客户流失或已确认失败实施。不过，结构性反向信号包括：（1）Flexe Discover 的现货费率透明度和 AI 基准（分析师估计托运人采用率 68%）压缩了 Flexe 相对
              Flowspace、ShipBob 等对手的定价权；（2）按需客户平均 tenure 低于 12 个月；（3）未披露 NRR、GRR 或 cohort 留存数据；（4）FY2025 估计毛利率为
              18.2%，低于可持续 SaaS 基准。先尽调客户集中度、合同期限和 NRR 披露，再判断收入耐久性。
