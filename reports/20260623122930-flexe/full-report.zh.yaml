      - number: '3.2'
        title: 直接同业——Stord、Flowspace、ShipBob 和 Ware2Go
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，Stord 是 Flexe 直接竞争对手中资本最充足、战略位置最强的一家。2026 年 5 月，Stord 宣布完成 $250 million Series F 轮，估值 $3
              billion——较 2025 年 5 月 Series E 的 $1.5 billion 估值翻倍。该轮由 Strike Capital 领投，Kleiner Perkins、Founders
              Fund、Franklin Templeton、Baillie Gifford、G Squared、Bond 和 Lux 参与。Stord 目前累计融资约 $775 million。它在全球运营近 100
              个履约地点，管理超过 $15 billion 年 GMV，服务 1,000 多名客户，其包裹每年触达近四分之一的美国家庭。2026 年，Stord 网络每年处理 8 billion 个数据点。其软件业务在
              2025 年增长 3 倍，2026 年 Q1 新预订环比增长超过 1 倍。伴随 Series F，Stord 推出 Stord Labs，这是一个实体 AI 研究环境，用于在真实订单上测试 agentic
              AI、机器人和先进自动化。2025 年 5 月，Stord 从 UPS 收购 Ware2Go，向网络增加 21 个履约中心和 2.5 million 平方英尺，并与 UPS
              建立战略伙伴关系。公司的叙事明确把自己定位为「反 Amazon」企业——让独立品牌获得超过 Prime 的履约能力，同时不交出客户数据。Stord 的 $3B 估值对比 Flexe 估算的 $1B
              估值，是直接同业格局中最重大的反向信号：Flexe 被最近同业在支出、增长和估值上全面拉开。


              Flowspace 是第一层平台中最偏 SMB / DTC 的玩家。Flowspace 总部位于 Los Angeles，累计融资约 $48.6 million，最近一轮是 2021 年由 BuildGroup
              领投的 $31 million Series B。其估算收入约 $30.5 million、约 100 名员工，按收入显著小于 Flexe 和 Stord。Flowspace
              提供覆盖美国两岸的仓储，技术平台强调实时数据、全渠道控制和灵活产能。2026 年 4 月，Flowspace 发布 Inventory Allocation Pools 和 Order Compliance
              Automation；2026 年 5 月，又推出完整 B2B Retail Fulfillment Solution，覆盖 EDI 订单管理、ASN 处理、UCC 标签生成、零售合规和扣款争议管理。其对 DTC
              转零售扩张和全渠道合规自动化的聚焦，使它区别于 Flexe 的企业溢出产能重点。


              ShipBob 是收入最充裕、国际化规模最大的直接竞争对手。公司报告 2023 年收入约 $500 million（同比增长 43%），在五个国家运营 60 多个履约中心，每年发货约 100 million
              个订单。ShipBob 累计融资 $330.5 million，由 Bain Capital Ventures 在 2021 年 $200 million Series E 中领投。据报道，公司正为计划 IPO
              寻求 $4 billion 估值。其技术栈覆盖 250+ 个集成，包括 Shopify、TikTok Shop、Temu 和 SHEIN Marketplace，并在 2026 年 Q1 启动 Madrid
              履约中心。ShipBob 的市场主要是 SMB 和中端电商品牌，而不是企业级零售商——这与 Flexe 核心企业溢出产能 ICP 不同——但其规模、资本通道和全渠道扩张，威胁到 Flexe
              的中端电商履约项目收入。


              Ware2Go 现以「Ware2Go, A Stord Company」运营。它在 2025 年 5 月被收购前，成立于 2018 年，是 UPS 子公司，为 DTC 和 B2B 商家提供按需履约和仓储。并入
              Stord 平台后，它进一步集中竞争对手资源，也不再是独立竞争对手；但它为 Stord 带来了 UPS 承运商伙伴关系和与美国中端市场相关的扩展履约足迹。
