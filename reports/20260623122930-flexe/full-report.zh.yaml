      所有数值均为说明性估算，来自追踪器收入（中位 $94M）、行业毛利率基准（15–25%）和员工数到烧钱率代理。 这些数字未获 Flexe 确认，应视为规划脚手架，而非财务报表。GXO 可比毛利率（15%）作为物流运营商底线；
      SaaS/平台基准（25%）作为上限。
    data:
      items:
        - label: 估算总收入（2024，中位区间）
          value: 94
          detail: GetLatka（$91.1M）与 Growjo（$97.1M）第三方估算的中点。
        - label: 仓库伙伴成本（COGS；按 15% 毛利率的低估）
          value: -80
          detail: 假设 85% 收入转付给仓库运营商；与 GXO 持平的物流底线。
        - label: 毛利润（15% 利润率）
          value: 14
