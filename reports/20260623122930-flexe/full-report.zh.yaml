      - number: '1.3'
        title: 资本历史、里程碑与反向证据
        blocks:
          - type: paragraph
            body: >-
              Flexe 的公开融资故事，最强锚点是 2022 年 7 月的 Series D 轮。Reuters 报道称，公司融资 $119 million，估值突破 $1 billion，由 BlackRock 领投，T.
              Rowe Price、Madrona Ventures 和 Prologis Ventures 等参与。此后，证据变得不那么一致。Latka 报告称总融资 $205.4
              million、共五轮；StartupIntros 报告 $268.6 million、共七轮；Compworth 估算累计融资约 $263
              million。这些数字方向相近——都指向一家获得大量风险资本支持的私营公司——但若没有管理层确认或 cap table 访问权限，精度不足以把总融资额当作高置信事实。


              2022 年之后的运营里程碑显示，尽管组织承压，公司仍在发布产品和市场情报举措。Flexe 在 2023 年和 2024 年均入选 Deloitte Technology Fast
              500，宣布了以自动化和运输伙伴为核心的 2025 年增长战略，并于 2026 年 6 月在 Reuters Supply Chain USA 发布 Spot Warehousing
              Index。与此同时，公司经历了两次重大裁员：2023 年 9 月裁员 33%，2024 年 1 月又裁员 38%。这些裁员并不推翻产品论点，但会实质改变尽调读数。它们表明，Flexe
              在努力维持企业信誉和品类领导地位的同时，仍在处理疫情后需求正常化、成本纪律，以及可能的 GTM 重置。
