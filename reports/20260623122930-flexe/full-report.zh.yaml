      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Flexe 的主要买方，是拥有实质物流足迹、供应链波动和现有 IT 基础设施的企业级和中高端市场公司。ShipBob 2026 State of Ecommerce Fulfillment Report（416
              名高管受访者）发现，84% 的品牌至少部分订单使用第三方履约公司，86% 在两个或更多渠道销售（较 2025 年提高 8%），44% 计划在 2026
              年扩展履约中心网络。这些统计描述的是更广泛的电商品牌群体，而不是 Flexe 的直接客户群，但它们给出了采用背景：多渠道销售和分布式库存已经是主流要求，不再是先进实践。


              付款方通常是零售商、CPG 公司或制造商的供应链 VP、物流负责人或首席供应链官。预算权在运营或财务，而不是 IT——这个区别影响企业销售周期，因为 IT
              部门通常不掌握仓储预算。采用触发因素包括季节性高峰产能需求（假日激增）、供应商中断后的库存溢出、进入新地理市场，或从固定租约模式转向更可变的成本结构。对于重视服务水平确定性的企业买方，Flexe 的 30+
              种集成方式和 3,000+ 仓库网络，相比自行寻找单个仓库运营方，降低了供应商发现摩擦和集成风险。


              公开证据显示出三类不同买方。第一，寻求溢出和季节性产能的企业级零售商和 CPG 公司——这是 Flexe
              最初的用例，可能仍贡献大部分网络量。第二，希望不签长期租约就布局分布式库存的中端电商品牌——在这一细分，Flexe 直接与 ShipBob
              等专门履约网络运营商竞争。第三，在供应链扰动期间需要快速扩展网络的全渠道运营商或制造商（回流、近岸化库存缓冲、关税驱动的采购迁移）。CSCMP 2026 报告记录了持续的关税波动（2025 年政策平均每 1.5
              周变化一次），这是需要临时暂存产能的计划外库存缓冲的持续驱动因素。


              Flexe 的战略投资方 Prologis 在其 2026 年供应链预测中强调，「灵活性」和「适应性」是物流地产决策的核心采购标准。这个框架强化了 Flexe 的定位，但也意味着每个既有 3PL
              和地产所有者都有强烈动机推出自己的 flex 产品。CBRE 观察到，2026 年 3PL 将占美国工业租赁的 35% 以上，意味着付款方群体很大，但已经被替代供应商服务。
