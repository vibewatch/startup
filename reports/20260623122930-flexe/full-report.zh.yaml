  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              Flexe
              所处的竞争场域横跨五个可区分层级，每一层的客户焦点、资本强度和竞争方式都不同。理解层级边界很关键，因为买方要完成的任务——弹性、低承诺的仓库接入和履约编排——会随体量、成熟度和风险承受度不同，由非常不同类型的供应商满足。


              第一层——按需仓储和履约平台：由技术中介的市场或网络，提供存储、拣货 / 打包 / 发货和网络编排，不要求买方签多年租约或自行运营物理空间。Flexe、Stord、Flowspace、ShipBob 和
              Ware2Go（现为 Stord 旗下公司）属于这一层。这是 Flexe 企业和中端市场项目的主要竞争层级。


              第二层——超大规模平台替代方案：Amazon FBA 和 Multi-Channel Fulfillment（MCF）代表由 Amazon 驱动的履约替代方案，把卖家拉入 Amazon
              的库存基础设施，用于跨渠道订单履约。Amazon 通过 Prime 交付基础设施、Seller Central 数据锁定，以及提高渠道费用的威胁，拥有结构性杠杆。


              第三层——既有合同物流供应商：GXO Logistics（全球最大纯合同物流供应商，2025 年收入 $13.2B）、XPO、Ryder、DHL Supply Chain
              及类似运营商，通过多年期、资产支持合同争夺同一企业外包预算。它们的按需产品只是 Flexe 所提供能力的一部分，但其在位优势和打包运输 / 物流能力很强。


              第四层——地产和空间接入替代方案：Prologis 的动态履约模型、短期转租，以及 Saltbox、ReadySpaces 等共仓运营方，提供仅空间的替代方案，缺少 Flexe 增加的编排软件，但对 IT
              需求较低的买方来说，是成本更低的替代品。


              第五层——现状和内部自建：多数企业买方今天仍通过自有配送中心和长期 3PL 合同运营 100% 固定网络。通过经纪商自行寻找现货空间，或在现有 WMS 平台之上构建内部编排软件，是低成本但运营复杂的替代方案。


              Mordor Intelligence 2026 年按需仓储市场概览把竞争碎片化、缺少全球主导玩家列为行业特征，这与上述多层格局一致。Saltbox 对 Flexe 替代方案的分析，将
              Stord、Flowspace、ShipBob 和 Amazon MCF 列为 2026 年市场的主要竞争对手，也印证了这套分类。Flexe
              的主要竞争战场在第一层，但企业预算负责人会同时评估第二层和第三层选项，因此替代风险比直接同业比较更宽。
