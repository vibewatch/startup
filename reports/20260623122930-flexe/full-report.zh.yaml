  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 市场与需求正常化风险
        blocks:
          - type: paragraph
            body: >
              Flexe 的核心价值主张，是让企业用短期现货产能替代长期仓库租约；它依赖固定仓储供给与可变仓储供给之间的结构性低效。2026 年，两股力量持续挤压这种低效。第一，美国工业地产市场自 2022 年 Q2 起连续
              16 个季度空置率上升，Colliers 数据显示 2026 年 Q1 全国空置率达 7.4%，供给过剩市场的大型配送中心空置率超过 11%。传统出租方面临入住压力，开始提供更短租期和更灵活条款，Flexe
              通过现货定价变现的经济价差随之收窄。第二，Flexe 自己在 Reuters Supply Chain USA 2026 推出的 Spot Warehousing Index
              记录了公司称为「warehousing stagflation」的现象——空置率上升与租金高企并存——这会挤压运营商经济性，而企业买家仍期待有竞争力的现货价格。2026 State of Logistics
              Report（FreightWaves/GEP Worldwide）指出，平均每 1.5 周变化一次的关税导致网络决策出现「paralysis effects」，使企业仓储项目启动更复杂，而 Flexe
              需要把这些项目转化为经常性物流项目收入。Supply Chain Dive 2026 年风险展望确认，某些形态的仓储产能过剩是平台型物流服务商的首要风险之一。与此同时，美国电商增长已从 COVID
              高峰回落至个位数年增长，缓和了推动 Flexe 2021–2022 年网络扩张的爆发式需求。这些力量是结构性的，建模 Flexe 收入增长轨迹时需要按情景设定假设。
