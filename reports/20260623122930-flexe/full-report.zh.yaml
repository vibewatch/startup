      - number: '6.2'
        title: 具名客户证明与案例研究
        blocks:
          - type: paragraph
            body: >
              Flexe 已发布至少 15 个具名或描述性客户案例，覆盖五金零售、电商 DTC 品牌、CPG 制造商、游戏公司、能源企业和 3PL 运营商。公开记录中有生产部署的具名客户包括 Ace
              Hardware、Aterian、Lull、Great Jones、DeFili Solutions、True Fabrications、Fun World、Global Point Energy、Innovel
              和 Johnson Logistics。若干高影响部署仍保持匿名（全国性零售商、前五大 CPG 制造商、全球游戏公司、全球护肤品牌、全球咖啡零售商）。

              Ace Hardware 关系自 2016 年延续至今，是记录最充实的合作之一：Hurricane Heroes 项目在 Florida、Texas 和 Georgia 的三处 Flexe
              设施部署大件应急物资（发电机、丙烷罐），支持 1,000+ 家零售门店。从首次 Flexe 沟通到库存入仓耗时四周；周末向飓风灾区发货不到 24 小时即可送达。2025 年更新又增加 Tampa
              附近的战略前置部署，用于主动应对飓风季，将合作延伸为 resilience-as-a-service。

              Aterian 部署是公开记录中量化最充分的案例：12 个履约节点带来 97% 两日达覆盖，Aterian 在使用 Flexe 期间 CAGR 达 61%。Lull 部署将平均配送时间从 3.5 天降至 1.8
              天（改善 51%），FedEx 成本降低 30%，并通过四个履约地点实现 88% 两日达覆盖。匿名全国性零售商在 8 周内实现 9 节点覆盖，为 1,200 家门店提供次日补货；Flexe 的 mixing
              centers 最终处理了 70% 超大托盘，远高于最初仅 10% 的预测。

              FeaturedCustomers 独立汇总了 43 条 Flexe 客户引用，来自 2,174 个评分的总体得分为 4.8/5，其中包括 16 条 testimonials、25 个案例研究和 2
              个客户视频。证据质量不一：具名企业账户（Ace、Aterian、Lull）具备经生产验证的成果；匿名账户有结果主张但难以独立验证；Flexe 官网上的 logo-only 展示证明价值较低。
