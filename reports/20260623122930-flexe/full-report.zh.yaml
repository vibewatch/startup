      - number: '5.2'
        title: 技术平台架构、集成模型与开发者界面
        blocks:
          - type: paragraph
            body: >-
              Flexe 将其技术平台定位为企业级 WMS + OMS + IMS 栈，通过单一软件界面管理分布式运营商网络中的所有仓库作业。官方产品材料将平台拆成四个功能组件：Order & Inventory
              Management（跨所有地点统一实时跟踪订单和库存位置）、Warehouse Management（收货、存储、拣货和发货的标准化运营流程）、Dashboards and Analytics（集中 KPI
              报告和 SLA 监控），以及 Platform Integrations（面向企业系统的 API 和 EDI 连接界面）。Flexe 2025 年 2
              月新闻稿称该平台「已获专利」，但没有公开具体专利号或技术规格。


              集成架构采用「一对多」模型：企业客户只需与 Flexe 集成一次，平台负责处理通往单个仓库运营商的所有下游连接。这免除了客户为每个运营商节点单独开发集成的需要。支持的集成格式包括 REST APIs（JSON
              over HTTPS）、使用 ANSI X12 交易集的 EDI（包括 940 Warehouse Shipping Order、945 Warehouse Shipping Advice、943 Stock
              Transfer Shipment Advice、944 Stock Transfer Receipt Advice、856 Advanced Ship Notice 和 810 Invoice）、XML 以及
              CSV 批量传输。Webhooks 支持围绕订单生命周期事件、履约状态更新、账单确认和 SLA 警报的事件驱动集成。


              developer-sandbox.flexe.com 提供开发者沙盒，包含 API 文档、测试环境和 onboarding 资源。沙盒要求创建 Flexe 开发者账户并签发 API key。Microsoft
              已为 Dynamics 365 Intelligent Order Management（IOM）平台发布认证连接器，并在 Microsoft Learn 上提供分步集成文档（最后更新于 2026 年 1 月
              30 日）。Dynamics 365 IOM 集成提供四项开箱即用能力：四种业务事件类型（billing confirmation、fulfillment line creation
              succeeded、fulfillment order succeeded、fulfillment order failed），以及两种转换（Dataverse fulfillment order 到 Flexe
              order；Dataverse fulfillment line 到 Flexe order line）。截至 2026 年 6 月，这份 Microsoft Learn 文档是公开可得、面向 Flexe
              第三方开发者的最详细技术规格。


              API Tracker 服务（apitracker.io，Apideck 产品）列出 Flexe 拥有公共 API 界面，但返回的结构化内容很少，说明该 API 尚未被第三方开发者情报工具深度编目。未发现
              Flexe 名下的公开 GitHub 仓库，搜索结果中也未发现 npm、PyPI 或其他包注册表存在——这与 Flexe 直接服务企业集成、而非自助式开发者生态的模型一致。
