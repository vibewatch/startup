  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与替代方案
        blocks:
          - type: paragraph
            body: >-
              Flexe
              处在三个相互重叠但并不相同的市场交汇处：按需仓储平台（短周期、可变成本的空间接入）、第三方物流（外包仓储和履约运营），以及全渠道履约技术（跨渠道协调订单、库存和网络节点的软件与编排层）。厘清每条边界很重要，因为研究者把边界画得多宽，会让市场规模估算出现巨大差异。


              最窄且可辩护的边界，是按需或灵活仓储平台品类：企业不用签传统多年租约，而是按托盘、按平方英尺或按交易为仓储空间付费。Mordor Intelligence 估算，2025 年该细分市场全球规模为 $16.93
              billion，2026 年增至 $19.67 billion，并以 15.17% CAGR 增长至 2031 年。北美在 2025 年占其中 35%。Research and Markets 对 2026
              年「on-demand warehousing」给出了明显更宽的 $149–167 billion
              估算，但其方法似乎纳入了更广泛的物流支出类别；若无法看到底层模型假设，两组估算无法调和，这是一个实时尽调缺口。两家公司都认同方向性的增长信号（13–15% CAGR 区间），但绝对底线相差近 8×。


              更宽的 3PL 市场构成外部边界，其中包括合同仓储、分销、运输管理，以及第三方交付的增值服务。Mordor Intelligence 估算，2025 年美国 3PL 市场为 $219.6 billion，2026
              年约 $226–228 billion，并以约 3.7% CAGR 增长至 2031 年。MarkWide Research 的更宽估算把 2026 年美国 3PL 规模放在 $298.6
              billion，反映了不同口径选择。全球最大纯合同物流供应商 GXO Logistics 报告 2025 全年收入 $13.2 billion，来自全球 1,000 多个设施和 200 million
              平方英尺——这是一个参照锚点，显示一家既有供应商能在更广泛的外包物流边界内捕获多少。


              Flexe 必须替代或补充的方案包括：（1）传统长期租约仓储（主导型既有方案，占美国工业地产存量的大部分）；（2）自有内部配送中心；（3）采用固定网络承诺的传统
              3PL；以及（4）由大型承运商（UPS、FedEx）或市场平台（Amazon FBA）运营的区域履约网络。CBRE 2026 年工业地产展望指出，3PL 将占今年美国工业租赁活动的 35%
              以上，说明即便按需平台在增长，既有外包物流供应商仍有强大的存量吸引力。


              电商子细分市场是 Flexe 最直接的需求驱动。美国 Census Bureau 2026 年 Q1 数据显示，经季调后的零售电商销售额为 $326.7 billion，同比增长 9.8%，占美国零售总额
              16.9%——创有记录以来最高占比。Mordor Intelligence 估算，2026 年北美电商履约服务市场为 $53.4 billion，到 2031 年增至 $89.2 billion，CAGR 为
              10.8%。这个细分市场最直接对应 Flexe 的电商履约和全渠道项目。
