        - 没有运营商绩效评分卡、淘汰率或 SLA 方差数据；品牌风险不对称
      - - 企业核心账户（估算 Walmart、Staples 约 38% 交易量）
        - Fortune 500 零售商 / CPG 品牌
        - 估算 FY2025 平台交易量约 38%；主要收入来源
        - 高 — 两个账户估计占交易量三分之一以上
        - 账户不续约或转向 GXO/Stord → 收入损失 30%+
        - 严重 — 未公开确认合同最低交易量保证
        - 长期项目关系（多年期，条款未披露）
        - 未公开合同期限、NRR 或锁定机制；集中度未经确认
      - - Microsoft Dynamics 365 IOM 认证连接器
        - Microsoft Corporation
        - 面向企业 ERP 连接的认证物流集成网关
        - Microsoft ERP 客户的单一认证集成路径
        - Microsoft 弃用 IOM 集成或更改认证要求 → 失去主要 ERP 集成路径
        - 高 — 大量企业客户处在 Microsoft Dynamics 生态
        - Flexe 维护 Microsoft 认证连接器；Microsoft Learn 已有文档
        - Microsoft 若调整平台，Flexe 没有公开应急方案；连接器更新周期也未披露
      - - Prologis Ventures（Series D 战略投资方）
        - Prologis, Inc.（工业 REIT，市值 $76B）
        - 战略投资方，也可能成为房地产渠道伙伴；参与 Series D
        - 单一战略投资方，且自身有可能冲突的房地产利益
        - Prologis 转向用自有 10 亿+ 平方英尺网络直接做按需平台 → Flexe 被绕开
        - 高 — Prologis 掌握全球最大的工业地产网络
        - 共同经济激励：Flexe 帮 Prologis 设施提高利用率
        - Prologis 若开发竞争平台，会产生利益冲突；公司未公开回应
      - - VC 投资方财团（BlackRock、T. Rowe Price、Tiger Global）
        - 机构投资者（管理资产数十亿美元）
        - 提供资本；治理权；董事会席位
        - 三家大型机构投资方持有未披露条款的优先股
        - 持有 4 年多之后，投资方可能施压要求折价退出、低于市场价并购，或更换管理层
        - 高 — 优先股股东享有优先回报权，也可能握有治理抓手
        - Series D 投资协议（条款未披露）
        - 未公开披露反稀释条款、随售 / 强售权，或董事会投票结构
