        - label: G&A（CEO、CFO/COO、法务、人力、财务）
          value: -4
          detail: 按重组后小型高管与支持职能员工数估算。
        - label: 估算经营收入 / （亏损）
          value: -4
          detail: 在 15% 毛利率情景下为模型赤字；在 25% 毛利率情景下接近盈亏平衡。
  - id: FE001
    title: Flexe 产品架构——五层技术与运营栈
    type: stack
    layout: wide
    summary: >-
      Flexe 平台由五个纵向集成层组成：顶部是客户互动层，其下是集成界面、核心技术（WMS/OMS/IMS）、数据与智能层（Discover/Spot
      Index），底部是实物物流网络。每一层都依赖下一层；实物网络层完全由第三方运营，因此是主要运营风险。
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE014
      - CE015
    data:
      layers:
        - id: customer-engagement
          label: 客户互动层
          detail: 企业客户门户、订单提交、库存可视化仪表板、SLA 报告界面和分析导出。企业账户的单点登录入口。
          items:
            - id: customer-portals
              label: 企业仪表板与订单管理 UI
              detail: 基于 Web 的界面，用于提交订单、跟踪库存、监控 SLA 和生成报告。
            - id: analytics-exports
              label: 分析导出与 KPI 报告
              detail: 标准化 KPI 报告；可导出至客户 BI 工具的数据；绩效预警。
        - id: integration-layer
          label: API 与集成层
          detail: >-
            连接企业 ERP/OMS 系统与 Flexe 平台的双向集成界面。支持 REST API、ANSI X12 EDI、XML、CSV、webhooks 以及认证的 Microsoft Dynamics 365 IOM
            连接器。开发者沙盒位于 developer-sandbox.flexe.com。
          items:
            - id: rest-api
              label: REST API（JSON/HTTPS）与 webhook 事件
              detail: 新企业客户的主要集成路径；按 Dynamics 365 IOM 文档，支持 OAuth/API-key 认证。
            - id: edi-integration
              label: EDI ANSI X12（940、945、943、944、856、810）与 EDIFACT
              detail: 面向使用既有 EDI VAN 或 AS2 传输的企业客户，提供兼容传统系统的 EDI 集成。
            - id: dynamics365-connector
              label: Microsoft Dynamics 365 IOM 认证连接器
              detail: 官方记录的集成；支持从 D365 IOM 发起订单路由、履约行转换和业务事件订阅。
        - id: technology-platform
          label: 技术平台（WMS + OMS + IMS）
          detail: 核心软件栈在所有伙伴运营节点之间编排仓库运营、订单路由、库存管理和 SLA 监控。2025 年新闻稿称其为「专利」平台； 未披露具体专利范围。
          items:
            - id: wms
              label: WMS——仓库管理系统
              detail: 将所有伙伴节点的仓库运营标准化；包括收货、上架、拣货打包发货、退货。
            - id: oms
              label: OMS——订单管理系统
              detail: 从客户系统摄取订单；应用路由规则；创建并跟踪履约行。
            - id: ims
              label: IMS——库存管理系统
              detail: 跨网络库存可视性；分配；循环盘点对账；差异管理。
        - id: data-intelligence
          label: 数据与智能层（Flexe Discover）
          detail: 专有分析与市场情报层。承载 Spot Warehousing Index（基于十年竞价数据和第三方指数）、全国与区域指数、需求强度指标和市场情绪读数。 可通过 discover.flexe.com 访问。
          items:
            - id: spot-warehousing-index
              label: Spot Warehousing Index（专有，2026 年 2 月 GA）
              detail: 按需仓储的真实交易费率基准；不是静态租赁均值。基于 10 年 Flexe 竞价数据构建。
            - id: market-intelligence-dashboard
              label: 市场情报仪表板（全国与区域）
              detail: 按枢纽 / 区域展示空置率、成本基准、需求强度和市场情绪。
        - id: logistics-network
          label: 物流网络（实物执行）
          detail: 800+ 家独立第三方仓库运营商；美国和加拿大 3,000+ 个地点。运营商提供实物仓储、履约和配送服务； Flexe 充当编排中介和商业包装层。
          items:
            - id: warehouse-operators
              label: 800+ 家独立仓库运营商
              detail: 预先审核的第三方伙伴提供实物执行。服务质量因运营商而异。
            - id: physical-locations
              label: 3,000+ 个仓库地点（美国和加拿大）
              detail: 覆盖北美所有主要市场。截至 2026 年 6 月，覆盖范围仅限北美。
    approximationNotes: >-
      层级拆解基于 Flexe 官方产品页、2025 年 2 月新闻稿和 Microsoft Learn Dynamics 365 IOM 集成文档。
      「专利」平台表述来自新闻稿；公开渠道没有专利范围或编号。数据与智能层（Discover）于 2026 年 2 月正式成形， 过去几年可能并不存在这一形态。
  - id: FE002
    title: Flexe 客户工作流——企业订单到履约的运营流程
    type: flow
    layout: wide
    summary: 企业客户通过 API、EDI 或直接集成向 Flexe 平台提交订单；平台执行路由优化，并在选定伙伴运营商处创建履约行； 运营商完成实物履约，再通过平台将状态回传至面向客户的分析层。
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE019
    data:
      nodes:
        - id: enterprise-customer
          label: 企业客户
          detail: 零售商、D2C 品牌或 CPG 发货方。通过 REST API、EDI、XML 或 CSV 向 Flexe 平台提交订单和库存指令。 设定 SLA 和履约要求。
        - id: flexe-oms
          label: Flexe OMS（订单摄取与路由）
          detail: 摄取客户订单；验证库存位置；应用网络优化规则（地理、运营商容量、成本、SLA 权重）；创建履约行。
        - id: flexe-ims
          label: Flexe IMS（库存编排）
          detail: 维护跨网络库存可视性；为履约行分配库存；对账循环盘点；管理节点间库存移动。
        - id: warehouse-operator-execution
          label: 伙伴仓库运营商（实物执行）
          detail: 800+ 家独立运营商之一，按 Flexe WMS 指令执行拣货打包发货、大宗仓储或配送。实时向平台回报状态事件。
        - id: carrier-last-mile
          label: 承运商 / 最后一公里（运输）
          detail: 由运营商或 Flexe 选择承运商进行最后一公里交付；ASN（EDI 856）和跟踪数据回传平台。2025–2026 年路线图包括运输供应商伙伴关系。
        - id: customer-analytics
          label: 客户分析与 SLA 仪表板
          detail: 企业客户收到实时订单状态、SLA 合规报告、库存位置和 KPI 仪表板。数据进入 Flexe Discover 市场情报，用于组合层面分析。
      edges:
        - from: enterprise-customer
          to: flexe-oms
          label: 订单 + 库存指令（API / EDI / XML）
        - from: flexe-oms
          to: flexe-ims
          label: 库存分配与履约行创建
        - from: flexe-oms
          to: warehouse-operator-execution
          label: 通过 WMS 下发履约指令
        - from: warehouse-operator-execution
          to: carrier-last-mile
          label: 交运与承运商选择
        - from: carrier-last-mile
          to: customer-analytics
          label: 跟踪事件与交付确认
        - from: warehouse-operator-execution
          to: customer-analytics
          label: 订单状态、SLA 事件和循环盘点数据
  - id: FE003
    title: Flexe 关键依赖图——平台、网络与集成依赖
    type: dag
    layout: wide
    summary: >-
      Flexe 平台位于依赖图中心，周围包括第三方仓库运营商（实物执行）、企业客户 ERP/OMS 系统（订单来源）、Microsoft Dynamics 365 IOM 认证连接器、第三方市场指数（输入 Spot
      Warehousing Index）、运输承运商和开发者沙盒。 第三方运营商依赖是最高风险节点，因为服务质量由它决定，且不在 Flexe 直接运营控制之内。
    claimRefs:
      - CE001
      - CE007
      - CE012
      - CE013
      - CE014
      - CE021
    data:
      nodes:
        - id: flexe-platform
          label: Flexe 技术平台（WMS/OMS/IMS）
          detail: 核心编排层；路由订单、管理库存、监控 SLA，并向分析层供数。
        - id: warehouse-operators
          label: 800+ 家第三方仓库运营商
          detail: 提供全部实物执行——仓储、拣货打包发货、配送。最高风险依赖：服务波动不在 Flexe 直接控制之内。
        - id: customer-erp-oms
          label: 企业客户 ERP / OMS
          detail: 通过 REST API、EDI、XML 或 CSV 向 Flexe 发送订单和库存数据。客户数据馈送的质量和频率直接影响平台准确性。
        - id: microsoft-d365-iom
          label: Microsoft Dynamics 365 IOM（认证连接器）
          detail: 认证集成伙伴；Microsoft Learn 文档于 2026 年 1 月发布。支持从 D365 IOM 向 Flexe 履约网络执行基于规则的订单编排。
        - id: spot-market-indices
          label: 第三方市场指数
          detail: 外部指数与 Flexe 专有竞价数据一起用于驱动 Spot Warehousing Index。指数构成和加权方法未完全披露。
        - id: transportation-carriers
          label: 运输承运商 / 最后一公里
          detail: 将出库货件从运营商节点运至终端客户。承运商选择可能由运营商管理，也可能由 Flexe 协调；路线图中已宣布运输伙伴关系。
        - id: developer-sandbox
          label: 开发者沙盒（developer-sandbox.flexe.com）
          detail: 为企业集成团队提供 API 文档和测试环境。设有门槛（需创建账户）；第三方 API 目录覆盖有限。
      edges:
        - from: customer-erp-oms
          to: flexe-platform
          label: 订单和库存数据（API / EDI / XML）
        - from: microsoft-d365-iom
          to: flexe-platform
          label: 通过认证 D365 IOM 连接器编排订单
        - from: flexe-platform
          to: warehouse-operators
          label: 履约指令；SLA 监控；WMS 编排
        - from: flexe-platform
          to: transportation-carriers
          label: 发货协调；跟踪事件摄取
        - from: spot-market-indices
          to: flexe-platform
          label: 将第三方指数数据输入 Spot Warehousing Index 计算
        - from: developer-sandbox
          to: flexe-platform
          label: 镜像生产 API；集成测试与上线引导
