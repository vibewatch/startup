      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: Stord 的资本和估值优势，是近期最大的单一竞争威胁
            body: >-
              Stord 2026 年 5 月以 $3B 估值完成 $250M Series F，意味着其估算估值约为 Flexe 的 3×，累计融资约为 Flexe 总资本的 3×。Stord 约 100
              个自有并运营履约地点、$15B+ GMV 和 Stord Labs AI 项目，给了它产品投资续航；而 Flexe 估算收入约 $97M、员工数减少 45%，无法逐美元匹配。如果 Stord
              成功上移到企业客户（其收购 Ware2Go 部分就是企业产能打法），Flexe 在企业溢出产能上的差异化可能在 18–24 个月内明显被侵蚀。
            calloutType: risk
            claimRefs:
              - CP001
              - CP007
              - CP025
              - CP026
              - CP031
          - type: callout
            title: Flexe 的 80/20 模型和 Prologis 伙伴关系，是企业买方可辩护的差异化
            body: >-
              Flexe 2026 年发布的 80/20 仓储框架，为企业物流负责人清楚表达了一个有证据支撑的价值主张：用 Flexe 承担网络产能中可变的 20%，消除「空耗空间」成本，同时让核心 DC 保持 85–90%
              利用率。执行这一定位需要 3,000+ 个仓库网络，小型平台难以复制。Prologis 战略伙伴关系也提供了 Stord、Flowspace 和 ShipBob 不易复制的企业可信度。
