chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与商业模式
        blocks:
          - type: paragraph
            body: >-
              Flexe 自称是「Flexible Warehousing
              Infrastructure」的先行者。这个品类把软件、开放物流网络和交易型定价结合起来，帮助企业避开长期仓库承诺。在官网、关于页面和物流网络资料中，公司持续描述一种轻资产模式：一次集成即可接入北美广泛的仓库运营方和设施网络。这个身份很关键，因为它把
              Flexe 定义为物流编排层，而不是传统 3PL；它要把固定房地产负债转成可变运营产能。


              公开资料也显示，Flexe 已不再只卖溢出仓储。公司现在强调三类主要用例——电商履约、零售分销和网络产能——并用集成路径、分析和运营支持来支撑。首页突出 3,000+ 个仓库、605M+
              平方英尺可用产能、平均不到 30 天上线，以及 20+ 种集成方式。物流网络和技术平台页面把这个主张扩展为覆盖订单、库存和分析的单一平台模式；2025 年战略发布则称 Flexe
              正在扩展运输伙伴、白标服务和自动化。合在一起看，证据支持一个判断：Flexe 已从按需仓储市场演化为企业全渠道物流平台，尽管不同公司页面和新闻稿中的部分精确规模指标略有出入。
