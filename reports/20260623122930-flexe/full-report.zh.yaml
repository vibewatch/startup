  - id: FI001
    title: 收入模型桥——客户活动如何转化为 Flexe 收入
    type: flow
    layout: wide
    summary: 客户的仓储与履约需求流经 Flexe 编排层，先产生按交易计费的收入；随后仓库伙伴成本分成将其压缩为毛利润。
    claimRefs:
      - CI001
      - CI002
      - CI028
      - CI031
    data:
      nodes:
        - id: enterprise-customer
          label: 企业客户
          detail: 有可变仓储、履约或配送需求的零售商或品牌；无需长期租约。
        - id: flexe-platform
          label: Flexe 平台（WMS + 编排）
          detail: 接收客户订单和库存；按位置、容量和成本路由至最优仓库伙伴。
        - id: transaction-revenue
          label: 交易收入
          detail: 客户支付仓储、履约、运输和平台费用；估算 ARR 为 $91–97M（2024，追踪器数据）。
        - id: warehouse-partner
          label: 仓库伙伴网络（800+ 运营商，3,000+ 地点）
          detail: 执行实物仓储和履约；收取服务收入的 70–85% 作为直接货品成本。
        - id: gross-profit
          label: 平台毛利润
          detail: 扣除仓库伙伴成本分成后，估算留存 15–25%；用于覆盖 Flexe 的工程、销售和 G&A。
        - id: data-layer
          label: Flexe Discover / 市场情报（2026）
          detail: 2026 年 6 月通过 Spot Warehousing Index 推出的新数据产品；可能带来更高毛利的软件收入流。
    approximationNotes: 收入分成按按需仓储行业基准估算；Flexe 未披露毛利率或伙伴收入分成。数据层节点反映 2026 年 6 月产品发布， 仍处于早期货币化阶段。
  - id: FI002
    title: 单位经济模型桥——从交易到贡献利润率
    type: flow
    layout: standard
    summary: 每个已履约订单在贡献经营利润前，要先扣除仓库伙伴成本和平台开销；由于私有数据缺口，多数输入值为估算。
    claimRefs:
      - CI030
      - CI031
      - CI035
      - CI036
    data:
      nodes:
        - id: gross-revenue-per-order
          label: 单订单总收入
          detail: 未公开披露；行业可比：含仓储分摊的拣货、打包、发货，每单 $5–$10。
        - id: warehouse-partner-cost
          label: 仓库伙伴成本（转付）
          detail: 估算订单收入的 70–85% 支付给仓库运营商；这是最大收入成本项。
        - id: gross-contribution
          label: 平台毛贡献（15–25%）
          detail: 与仓库伙伴结算后由 Flexe 留存；覆盖平台运营、销售和工程。
        - id: customer-acquisition-cost
          label: 客户获取成本（企业）
          detail: 未披露；企业物流交易估算区间 $5K–$50K；按多年项目摊销。
        - id: contribution-to-opex
          label: 对运营费用的贡献
          detail: 毛贡献用于支持工程、销售和 G&A；Flexe 目前是否贡献为正尚未验证。
    approximationNotes: 所有单订单数值和百分比均为行业基准与估算；Flexe 未披露单位经济。CAC 估算由企业物流销售周期假设建模得出。 该图为定性分析，尽调中应以管理层提供的经济模型替换。
