      - number: '3.3'
        title: 超大规模平台与既有供应商替代方案——Amazon MCF 和 GXO
        blocks:
          - type: paragraph
            body: >-
              Amazon Multi-Channel Fulfillment（MCF）是 Flexe 电商履约项目最具结构性威胁的长期替代品，因为 Amazon 同时提供物理履约网络和渠道关系。截至 2026 年 6 月 1
              日，Amazon 更新后的美国 MCF 价目表在基础履约费之上收取 3.5% 的燃油和物流附加费。对于一个 small-standard 4–8 oz 商品，标准 3 天送达费用为每件 $7.51（1
              件订单）。2026 年 MCF Preferred Pricing 项目向合格卖家提供最高 15% 的 MCF 出库履约费折扣，以及每发一件 MCF 商品最高 $1 的 FBA credit；新 MCF 用户可走
              6 个月路径，高量发货方可走 12 个月路径。Amazon 还免除了 MCF 订单的 5% AMZL block surcharge——包括 Walmart 订单——直到 2027 年 1 月 14
              日。对已经使用 FBA 的卖家，MCF 允许从同一库存池做跨渠道履约，从而消除切换摩擦。Amazon 的结构性杠杆包括既有卖家关系、Prime 基础设施、Seller Central 数据，以及通过其他
              Amazon 业务单元交叉补贴 MCF 定价的能力。Flexe 相比 Amazon MCF 的优势是：没有卖家渠道依赖（使用 Flexe 的买方不会被迫进入 Amazon 生态）、跨仓库类型的定价灵活性，以及
              Amazon MCF 不提供的企业级零售分销支持。


              GXO Logistics 是全球最大纯合同物流供应商，也是经济意义最重的既有替代品。GXO 报告 2025 全年收入创纪录达到 $13.2 billion，同比增长 12.5%，其中有机增长为
              3.9%。公司在全球运营 1,000 多个设施，总面积 200 million 平方英尺，员工超过 150,000 人，并在 2025 年连续第三年赢得超过 $1 billion 新业务，2026
              年增量新业务收入为 $774 million（同比增长 20%）。GXO 2026 年指引预计有机收入增长为 4–5%，调整后 EBITDA 为 $930–970 million。GXO
              不运营真正的按需市场；其合同是多年期、资产支持的。不过，它的规模、技术投资（40%+ 站点部署 10,000+ 台机器人）、全球品牌，以及打包 TMS / WMS / 自动化能力，使其能向企业买方提供替代
              Flexe 单点方案的端到端选择。企业买方在规划年度仓储网络决策时，经常会在同一个 RFP 中评估 GXO 和类似既有供应商。


              Prologis 是 Flexe 的战略投资方，关系更偏互补而非直接竞争，但它也在更广泛的 Prologis Essentials 标签下提供自己的动态履约产品。Prologis 2026
              年预测强调，灵活性和适应性是物流地产采购标准的核心，并预测电商将在 2026 年接近工业租赁的 25%。这让 Prologis 可能成为向 Flexe 转介需求的渠道，但如果 Flexe
              护城河变弱，它也可能发展出竞争性的灵活空间产品。
