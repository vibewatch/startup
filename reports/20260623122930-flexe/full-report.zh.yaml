      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 市场规模缺口对估值很关键
            body: >-
              Mordor Intelligence 对 2026 年同一「on-demand warehousing」标签给出的 $19.67B 估算，与 Research & Markets 的 $149–167B
              估算相差 7–8×，这不是四舍五入误差，而是市场边界选择根本不同。如果 Flexe 的 TAM 是 $7B（窄口径估算的北美份额），其增长故事就是一个聚焦利基市场的打法。如果 TAM 更接近 3PL
              外部边界，它就是一个大市场品类。尽调投资人若不解决这个定义争议，就无法可靠承销具体市场渗透率假设；理想做法是审阅 Flexe 自己的 TAM 模型，并确认公司把哪些收入计为可触达。
            calloutType: risk
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: callout
            title: 按需仓储面临结构性平台演化风险
            body: >-
              MDPI 对按需仓储平台的学术分析（Tornese 2024）指出，若干纯市场 ODW 供应商已迁移到「混合 ODW-4PL」模式，因为规模化后无法维持服务水平一致性。Flexe
              可见地转向全渠道编排和运输伙伴，可能正是这种结构性压力的体现，但这也提高了资本强度和运营责任。方向在战略上自洽，却缩小了与全栈 3PL 的差异。
            calloutType: insight
            claimRefs:
              - CM033
              - CM034
          - type: callout
            title: 电商份额提升和波动，是持久需求驱动
            body: >-
              两个结构性因素为灵活仓储提供持久需求：电商继续拿走美国零售份额（2026 年 Q1 为 16.9%，高于 2025 年 Q1 的约
              15.9%），以及持续的供应链波动，使可变成本产能成为运营对冲，而不仅是成本优化玩法。这些因素在 3–5 年投资周期内不太可能逆转，并能在具体市场规模方法论争议之外，为可触达需求提供底部。
