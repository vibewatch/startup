  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方格局
        blocks:
          - type: paragraph
            body: >
              Flexe 的商业模型分成两个相互咬合的买方类别：企业托运人（付费客户）和仓库运营商（供给侧合作方，同时也支付技术费）。托运人侧，Flexe 主要服务零售、消费品（CPG）、电商、食品饮料和游戏等垂直领域的
              Fortune 500 与大型企业组织。LogisticsNavigators 的行业分析称，其客户名单覆盖美国前 10 大零售商中的 6 家、全球前 5 大 CPG 品牌中的 4 家，以及估计 30%+ 的
              Fortune 100。典型买方是大型零售商或 CPG 制造商的供应链或物流 VP / SVP，他们面临产能约束、季节性需求波动，或需要在没有长期租约承诺的情况下快速扩张配送足迹。

              用户通常是供应链运营团队，使用 Flexe Technology Platform 做库存可视化、订单管理和分析。付款方是企业财务或采购团队，负责与 Flexe 设计基于交易或项目费的合同。中端电商品牌（DTC
              床垫、厨具、消费电子）是次级细分市场，依赖 Flexe 以轻资产方式扩大履约规模。3PL 运营商构成第三个独立细分：Johnson Logistics、Innovel 等公司用 Flexe
              平台获取需求，并在多个设施间标准化运营，既作为供应商参与，也作为付费技术客户参与。

              地理上，Flexe 只聚焦北美（美国和加拿大），这既是优势（网络密度），也是缺口（没有国际客户）。收入分层未公开披露，但行业来源显示，企业账户通常基于交易吞吐量和项目费用，代表六到七位数的年合同价值。
