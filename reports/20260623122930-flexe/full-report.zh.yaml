  - id: FR002
    title: Flexe 风险传导图——关键风险如何流向收入和估值
    type: dag
    layout: wide
    summary: |
      展示 Flexe 主要风险事件如何通过运营能力、客户关系和收入层层传导，最终影响融资和估值。关键传导路径凸显两条严重性最高的级联：裁员到服务质量，市场正常化到收入。
    data:
      nodes:
        - id: layoff-event
          label: 人员缩减事件（2023 年 33%，2024 年 38%）
          detail: WARN Act 申报已确认；累计员工数减少 71%
        - id: reduced-ops-capacity
          label: 运营与 CSM 能力下降
          detail: 客户成功、实施和运营人员减少，服务企业账户的人手变少
        - id: service-degradation
          label: 服务质量下降 / 实施延误
          detail: 企业部署变慢；SLA 监控减少；客户体验承压
        - id: market-normalization
          label: 市场正常化 / 仓储滞胀
          detail: 空置率上升 + 租金维持高位，压缩临时溢价；关税波动推迟项目启动
        - id: competitive-pressure
          label: 竞争压力（GXO、Stord、Flowspace）
          detail: 既有玩家和资金充足的同业以激进价格提供竞品企业物流平台
        - id: revenue-headwind
          label: 收入增长逆风
          detail: 项目启动变慢、价格被压缩、潜在流失共同拉低收入增速
        - id: financing-pressure
          label: 融资 / 现金跑道压力
          detail: 2022 年 7 月后未确认新一轮融资；持有 4 年以上加大投资人退出压力
        - id: valuation-pressure
          label: 估值下调 / Down-round 风险
          detail: 收入不达预期 + 投资人压力 + 可比倍数压缩 → 估值跌破 $1B 风险
      edges:
        - from: layoff-event
          to: reduced-ops-capacity
          label: 员工数下降直接削弱运营吞吐
        - from: reduced-ops-capacity
          to: service-degradation
          label: 人手减少 → 实施更慢、SLA 监控更少
        - from: service-degradation
          to: revenue-headwind
          label: 服务问题 → 客户流失、新 logo 成交变慢
        - from: market-normalization
          to: revenue-headwind
          label: 临时溢价压缩 + 关税僵局减少项目启动
        - from: competitive-pressure
          to: revenue-headwind
          label: 价格压力 + 企业客户选择变多，压缩 Flexe 抽成率
        - from: revenue-headwind
          to: financing-pressure
          label: 收入不达预期加速消耗现金跑道
        - from: financing-pressure
          to: valuation-pressure
          label: 困境融资或投资人退出压力 → down-round 场景
        - from: competitive-pressure
          to: valuation-pressure
          label: 护城河收窄，削弱可比倍数中的增长溢价
    approximationNotes: |
      传导路径由行业类比和公开证据推断；Flexe 未披露内部财务或运营数据。因果联系为基于标准企业 SaaS 和物流平台动态作出的逻辑推断。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR009
      - CR016
      - CR017
      - CR022
      - CR024
      - CR027
  - id: FR003
    title: Flexe 关键依赖图——外部实体与平台暴露
    type: dag
    layout: standard
    summary: |
      映射 Flexe 的六类关键外部依赖——仓库运营商、企业客户、Microsoft 集成、Prologis 投资人和 VC 辛迪加——以及每类依赖向平台传导风险的方式。
    data:
      nodes:
        - id: flexe-platform
          label: Flexe 技术平台
          detail: 核心 WMS/OMS/IMS/分析层；连接需求侧和供给侧
        - id: warehouse-operators
          label: 800+ 第三方仓库运营商
          detail: 承担全部实物执行；服务质量不在 Flexe 直接控制之内
        - id: enterprise-customers
          label: 企业客户（Fortune 500 / CPG）
          detail: 贡献平台收入；前 2 大客户估计约占 FY2025 交易量的 38%
        - id: microsoft-d365
          label: Microsoft Dynamics 365 IOM 集成
          detail: 认证 ERP 集成网关；存在弃用风险；单一主要路径
        - id: prologis-investor
          label: Prologis Ventures（战略投资人）
          detail: Series D 参与方；房地产网络重叠；存在潜在竞争冲突
        - id: vc-syndicate
          label: VC 辛迪加（BlackRock、T. Rowe Price、Tiger Global）
          detail: 资本和治理；Series D 后持有 4 年以上；存在退出压力风险
      edges:
        - from: warehouse-operators
          to: flexe-platform
          label: 实物执行；服务质量依赖
        - from: flexe-platform
          to: enterprise-customers
          label: 订单路由、库存可见性、SLA 交付
        - from: enterprise-customers
          to: flexe-platform
          label: 收入、需求信号、网络利用率
        - from: microsoft-d365
          to: flexe-platform
          label: 集成网关；企业 ERP 连接
        - from: prologis-investor
          to: flexe-platform
          label: 资本 + 房地产渠道；战略冲突可能
        - from: vc-syndicate
          to: flexe-platform
          label: 治理权、资本获取、退出压力
    approximationNotes: |
      依赖映射基于公开披露的 Series D 投资人名单、Microsoft Learn 认证集成文档和 Flexe 官方网络材料。边标签描述主要风险传导方向，不代表完整双向关系。
    claimRefs:
      - CR014
      - CR019
      - CR028
      - CR031
      - CR032
  - id: FV001
    title: Flexe 投资建议逻辑链
    type: flow
    layout: wide
    summary: 追踪证据链：从网络规模、客户验证、财务状态、竞争风险和估值评估，推导到最终「跟踪 / 继续研究」建议。
    claimRefs:
      - CV034
      - CV035
      - CV036
    data:
      nodes:
        - id: network-scale
          label: 网络规模
          detail: 800+ 运营商、3,000+ 设施、美国前 10 大零售商中的 6 家；多年期关系护城河；难以快速复制
        - id: customer-proof
          label: 客户与收入验证
          detail: ARR 估算 $91–97M；Forrester ROI 124%；Nike/Target/Lowe's 标识；Deloitte Fast 500 已确认
        - id: financial-state
          label: 财务与治理状态
          detail: 2022 年 7 月后未确认融资；员工减少 71%；烧钱率不透明；累计融资 $205M–$330M，优先权结构未知
        - id: competitive-risk
          label: 竞争与市场压力
          detail: Stord 2026 年 5 月估值 $3B；GXO FY2025 增长 10.8%；Amazon 扩张 3PL；仓储空置率 7.4%，压缩临时溢价
        - id: valuation-assessment
          label: 估值评估
          detail: $1B 标记 = 10–11x EV/ARR；物流可比公司 0.54–1.7x；SaaS 可比公司 4.7–6.1x；2022 年队列独角兽平均下跌 52%（CNBC/PitchBook 2026）
        - id: recommendation
          label: 跟踪 / 继续研究——估值偏紧
          detail: 独角兽标记缺少可比证据支撑；关注价格重置、下一次融资事件或盈利能力证明；买入条件已明确
      edges:
        - from: network-scale
          to: recommendation
          label: 正面，但单独不足以支撑结论
        - from: customer-proof
          to: recommendation
          label: 验证需求；但不能解决倍数问题
        - from: financial-state
          to: recommendation
          label: 现金跑道不透明 = 高不确定性溢价
        - from: competitive-risk
          to: recommendation
          label: Stord 溢价 + 市场逆风 = 下行压力
        - from: valuation-assessment
          to: recommendation
          label: 10x EV/ARR 对比 1.7x–5x 可比倍数 → 偏紧
  - id: FV002
    title: Flexe 隐含估值对 EV/ARR 倍数的敏感性
    type: bar
    layout: wide
    summary: 展示以 $94M ARR 中点估算为基准时，Flexe 隐含企业价值如何随五档 EV/ARR 倍数变化，范围从轻资产 3PL 下限到上一轮隐含倍数。
    approximationNotes: >-
      $94M ARR 中点来自 GetLatka $91.1M 与 Growjo $97.1M 的第三方估算；两者均未经审计。轻资产 3PL 倍数来自 PCE M&A 基准（1.7x）。技术赋能 3PL（5x）和私有 SaaS
      下限（6x）来自 Windsor Drake 2026 年 Q1 与 Aventis Advisors。SaaS 溢价（8x）来自 Windsor Drake 高端 TMS/WMS 区间。上一轮隐含倍数（10.6x）由 $1B
      ÷ $94M ARR 推导。
    claimRefs:
      - CV010
      - CV017
      - CV018
      - CV028
      - CV029
    data:
      items:
        - label: 轻资产 3PL M&A 下限（1.7× ARR）
          value: 160
          unit: $M
          note: PCE M&A TEV/Rev 基准；最佳质量的差异化平台
        - label: C.H. Robinson 上市可比（1.4×）
          value: 132
          unit: $M
          note: CHRW EV/Rev 2026E；纯轻资产物流经纪
        - label: 技术赋能 3PL 混合倍数（5× ARR）
          value: 470
          unit: $M
          note: 基准场景；相对轻资产可比公司有技术溢价；毛利率约 18%
        - label: 私有 SaaS 下限（6× ARR）
          value: 564
          unit: $M
          note: Aventis Advisors 私有 SaaS 中位数下限；需要确认软件护城河
        - label: 物流 SaaS 溢价（8× ARR）
          value: 752
          unit: $M
          note: Windsor Drake 高端区间；需要毛利率 >40%——证据不支持
        - label: 上一轮隐含倍数（10.6× ARR）
          value: 1000
          unit: $M
          note: 由 $1B Series D 标记和 $94M ARR 中点隐含；没有可比公司支持该倍数
  - id: FV003
    title: Flexe 牛 / 基准 / 熊估值区间
    type: range
    layout: wide
    summary: 三种场景估值区间从 $250M（熊市困境退出）到 $1.7B（牛市战略收购溢价）；其中 $470M–$770M 的基准场景最贴近当前可比证据。
    approximationNotes: >-
      所有数值均为场景估算，未经公司确认或审计。ARR 增长假设和倍数依据见 TV003。熊市场景锚定 2022 年队列平均压缩 52%（CNBC/PitchBook，2026 年 6 月）。基准场景锚定预计 $110M ARR 上
      5–7x 的技术赋能 3PL 混合倍数。牛市场景需要战略收购方支付超出当前可比区间的网络溢价。
    claimRefs:
      - CV030
      - CV031
      - CV032
    data:
      items:
        - label: 熊市——困境 / 下调估值轮场景
          low: 250
          mid: 400
          high: 500
          unit: $M
          note: 3–4x ARR；相对 $1B 折价 52%，与 2022 年队列平均压缩一致
        - label: 基准——技术赋能 3PL 公允价值重置
          low: 470
          mid: 620
          high: 770
          unit: $M
          note: 5–7x EV/ARR × $94–$110M 估算 ARR；需要严守入场价格纪律
        - label: 牛市——带网络溢价的战略收购
          low: 1000
          mid: 1250
          high: 1700
          unit: $M
          note: 10–13x 远期 ARR；需要战略收购方；高于当前可比证据
  - id: FV004
    title: IC 可用投资 KPI 仪表盘——Flexe
    type: kpi
    layout: wide
    summary: 基于截至 2026 年 6 月的公开证据，为七个投资维度打分。评分 1–5，其中 1 = 差 / 红灯，3 = 中性 / 观察，5 = 强 / 绿灯。
    approximationNotes: 所有评分均为作者仅依据公开证据作出的评估，未经公司确认。财务健康评分反映 2022 年后未确认融资且烧钱率未披露。估值吸引力反映 10–11x EV/ARR 与 0.54–5x 可比区间的差距。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV034
      - CV036
    data:
      items:
        - label: 市场规模和顺风
          value: 3 / 5
          unit: score
          trend: stable
        - label: 产品和技术验证
          value: 3.5 / 5
          unit: score
          trend: stable
        - label: 客户牵引力和质量
          value: 4 / 5
          unit: score
          trend: stable
        - label: 财务健康和现金跑道
          value: 1.5 / 5
          unit: score
          trend: adverse
        - label: 竞争护城河耐久性
          value: 2.5 / 5
          unit: score
          trend: adverse
        - label: 上一轮标记下的估值吸引力
          value: 2 / 5
          unit: score
          trend: adverse
        - label: 退出准备度（IPO 或 M&A）
          value: 2 / 5
          unit: score
          trend: adverse
