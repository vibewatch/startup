figures:
- id: FE001
  title: Flexe product architecture — five-layer technology and operations stack
  type: stack
  layout: wide
  summary: >-
    Flexe's platform consists of five vertically integrated layers: customer engagement at the top, the
    integration surface, the core technology (WMS/OMS/IMS), the data and intelligence layer (Discover/Spot
    Index), and the physical logistics network at the base. Each layer depends on the one below it;
    the physical network layer is the primary operational risk as it is entirely third-party operated.
  claimRefs:
  - CE007
  - CE008
  - CE009
  - CE014
  - CE015
  data:
    layers:
    - id: customer-engagement
      label: "Customer Engagement Layer"
      detail: >-
        Enterprise customer portals, order submission, inventory visibility dashboards, SLA reporting
        interfaces, and analytics exports. Single sign-on access point for enterprise accounts.
      items:
      - id: customer-portals
        label: Enterprise dashboards and order management UI
        detail: Web-based interface for order submission, inventory tracking, SLA monitoring, and reporting.
      - id: analytics-exports
        label: Analytics exports and KPI reporting
        detail: Standardized KPI reports; exportable data for customer BI tools; performance alerts.
    - id: integration-layer
      label: "API and Integration Layer"
      detail: >-
        Bidirectional integration surface connecting enterprise ERP/OMS systems to the Flexe platform.
        Supports REST API, ANSI X12 EDI, XML, CSV, webhooks, and the certified Microsoft Dynamics 365
        IOM connector. Developer sandbox at developer-sandbox.flexe.com.
      items:
      - id: rest-api
        label: REST API (JSON/HTTPS) with webhook events
        detail: Primary integration path for new enterprise customers; supports OAuth/API-key authentication per Dynamics 365 IOM documentation.
      - id: edi-integration
        label: EDI ANSI X12 (940, 945, 943, 944, 856, 810) and EDIFACT
        detail: Legacy-compatible EDI integration for enterprise customers using established EDI VAN or AS2 transport.
      - id: dynamics365-connector
        label: Microsoft Dynamics 365 IOM certified connector
        detail: Officially documented integration; enables order routing, fulfillment-line transformation, and business-event subscriptions from D365 IOM.
    - id: technology-platform
      label: "Technology Platform (WMS + OMS + IMS)"
      detail: >-
        Core software stack orchestrating warehouse operations, order routing, inventory management,
        and SLA monitoring across all partner operator nodes. Described as "patented" in a 2025 press
        release; no specific patent scope disclosed.
      items:
      - id: wms
        label: WMS — Warehouse Management System
        detail: Standardized warehouse operations across all partner nodes; receiving, put-away, pick-pack-ship, returns.
      - id: oms
        label: OMS — Order Management System
        detail: Ingests orders from customer systems; applies routing rules; creates and tracks fulfillment lines.
      - id: ims
        label: IMS — Inventory Management System
        detail: Cross-network inventory visibility; allocation; cycle-count reconciliation; discrepancy management.
    - id: data-intelligence
      label: "Data and Intelligence Layer (Flexe Discover)"
      detail: >-
        Proprietary analytics and market intelligence layer. Hosts the Spot Warehousing Index (built on
        a decade of bid data and third-party indices), National and Regional Indices, Demand Intensity
        indicators, and Market Sentiment readings. Available at discover.flexe.com.
      items:
      - id: spot-warehousing-index
        label: Spot Warehousing Index (proprietary, GA Feb 2026)
        detail: Real transaction-rate benchmark for on-demand warehousing; not static lease averages. Built on 10 years of Flexe bid data.
      - id: market-intelligence-dashboard
        label: Market Intelligence Dashboard (national and regional)
        detail: Vacancy rates, cost benchmarks, Demand Intensity, and Market Sentiment by hub/region.
    - id: logistics-network
      label: "Logistics Network (Physical Execution)"
      detail: >-
        800+ independent third-party warehouse operators; 3,000+ locations across the United States and
        Canada. Operators provide the physical storage, fulfillment, and distribution services; Flexe acts
        as orchestration intermediary and commercial wrapper.
      items:
      - id: warehouse-operators
        label: 800+ independent warehouse operators
        detail: Pre-vetted third-party partners providing physical execution. Service quality varies by operator.
      - id: physical-locations
        label: 3,000+ warehouse locations (US and Canada)
        detail: >-
          Distributed across all major North American markets. Coverage is North America only as of June 2026.
  approximationNotes: >-
    Layer decomposition based on Flexe official product pages, February 2025 press release, and Microsoft
    Learn Dynamics 365 IOM integration documentation. "Patented" platform claim sourced from press release;
    no patent scope or numbers are publicly available. The data and intelligence layer (Discover) was formalized
    in February 2026 and may not have been present in this form in prior years.

- id: FE002
  title: Flexe customer workflow — enterprise order-to-fulfillment operating flow
  type: flow
  layout: wide
  summary: >-
    An enterprise customer submits orders to the Flexe platform via API, EDI, or direct integration;
    the platform performs routing optimization and creates fulfillment lines at selected partner operators;
    operators execute physical fulfillment and feed status back through the platform to the customer-facing
    analytics layer.
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
  - CE019
  data:
    nodes:
    - id: enterprise-customer
      label: Enterprise Customer
      detail: >-
        Retailer, D2C brand, or CPG shipper. Submits orders and inventory instructions to Flexe
        platform via REST API, EDI, XML, or CSV. Sets SLA and fulfillment requirements.
    - id: flexe-oms
      label: Flexe OMS (Order Ingestion and Routing)
      detail: >-
        Ingests customer orders; validates inventory positions; applies network optimization rules
        (geography, operator capacity, cost, SLA weighting); creates fulfillment lines.
    - id: flexe-ims
      label: Flexe IMS (Inventory Orchestration)
      detail: >-
        Maintains cross-network inventory visibility; allocates stock to fulfillment lines;
        reconciles cycle counts; manages inter-node inventory movements.
    - id: warehouse-operator-execution
      label: Partner Warehouse Operator (Physical Execution)
      detail: >-
        One of 800+ independent operators executes pick-pack-ship, bulk storage, or distribution
        per Flexe WMS instructions. Reports status events back to the platform in real time.
    - id: carrier-last-mile
      label: Carrier / Last-Mile (Transportation)
      detail: >-
        Carrier selected by operator or Flexe for last-mile delivery; ASN (EDI 856) and tracking
        data fed back to the platform. Transportation provider partnerships in roadmap for 2025–2026.
    - id: customer-analytics
      label: Customer Analytics and SLA Dashboard
      detail: >-
        Enterprise customer receives real-time order status, SLA compliance reports, inventory
        positions, and KPI dashboards. Feeds into Flexe Discover market intelligence for portfolio-wide analysis.
    edges:
    - from: enterprise-customer
      to: flexe-oms
      label: Orders + inventory instructions (API / EDI / XML)
    - from: flexe-oms
      to: flexe-ims
      label: Inventory allocation and fulfillment-line creation
    - from: flexe-oms
      to: warehouse-operator-execution
      label: Fulfillment instructions via WMS
    - from: warehouse-operator-execution
      to: carrier-last-mile
      label: Shipment hand-off and carrier selection
    - from: carrier-last-mile
      to: customer-analytics
      label: Tracking events and delivery confirmation
    - from: warehouse-operator-execution
      to: customer-analytics
      label: Order status, SLA events, and cycle-count data

- id: FE003
  title: Flexe critical dependency map — platform, network, and integration dependencies
  type: dag
  layout: wide
  summary: >-
    The Flexe platform sits at the center of a dependency graph that includes third-party warehouse
    operators (physical execution), enterprise customer ERP/OMS systems (order source), the Microsoft
    Dynamics 365 IOM certified connector, third-party market indices (feeding the Spot Warehousing Index),
    transportation carriers, and the developer sandbox. Third-party operator dependency is the highest-risk
    node as it governs service quality and is outside Flexe's direct operational control.
  claimRefs:
  - CE001
  - CE007
  - CE012
  - CE013
  - CE014
  - CE021
  data:
    nodes:
    - id: flexe-platform
      label: Flexe Technology Platform (WMS/OMS/IMS)
      detail: Core orchestration layer; routes orders, manages inventory, monitors SLA, and feeds analytics.
    - id: warehouse-operators
      label: 800+ Third-Party Warehouse Operators
      detail: >-
        Provides all physical execution — storage, pick-pack-ship, distribution. Highest-risk dependency:
        service variability is outside Flexe's direct control.
    - id: customer-erp-oms
      label: Enterprise Customer ERP / OMS
      detail: >-
        Sends orders and inventory data to Flexe via REST API, EDI, XML, or CSV. Quality and frequency
        of customer data feeds directly affects platform accuracy.
    - id: microsoft-d365-iom
      label: Microsoft Dynamics 365 IOM (Certified Connector)
      detail: >-
        Certified integration partner; Microsoft Learn documentation published January 2026.
        Enables rules-based order orchestration from D365 IOM into Flexe fulfillment network.
    - id: spot-market-indices
      label: Third-Party Market Indices
      detail: >-
        External indices used alongside Flexe's proprietary bid data to power the Spot Warehousing Index.
        Index composition and weighting methodology not fully disclosed.
    - id: transportation-carriers
      label: Transportation Carriers / Last-Mile
      detail: >-
        Carry outbound shipments from operator nodes to end customers. Carrier selection may be operator-
        managed or Flexe-coordinated; transportation partnerships announced for roadmap.
    - id: developer-sandbox
      label: Developer Sandbox (developer-sandbox.flexe.com)
      detail: >-
        Provides API documentation and test environment for enterprise integration teams.
        Gated (requires account creation); limited third-party API-catalogue coverage.
    edges:
    - from: customer-erp-oms
      to: flexe-platform
      label: Orders and inventory data (API / EDI / XML)
    - from: microsoft-d365-iom
      to: flexe-platform
      label: Order orchestration via certified D365 IOM connector
    - from: flexe-platform
      to: warehouse-operators
      label: Fulfillment instructions; SLA monitoring; WMS orchestration
    - from: flexe-platform
      to: transportation-carriers
      label: Shipment coordination; tracking event ingestion
    - from: spot-market-indices
      to: flexe-platform
      label: Feeds third-party index data into Spot Warehousing Index calculation
    - from: developer-sandbox
      to: flexe-platform
      label: Mirrors production API; integration testing and onboarding

- id: FE004
  title: Flexe product capability maturity map
  type: matrix
  layout: wide
  summary: >-
    Evidence-backed maturity assessment of Flexe's five core product capability areas across three
    dimensions: currently generally available, announced on roadmap, and evidence/disclosure gap.
    Maturity assessed from official product pages, press releases, and Microsoft Learn documentation
    as of June 23, 2026.
  claimRefs:
  - CE003
  - CE004
  - CE015
  - CE028
  - CE029
  - CE031
  approximationNotes: >-
    GA assessments based on official Flexe product pages and press releases; Roadmap entries based
    on the February 2025 Webwire press release. Evidence Gap reflects absence of public disclosure,
    not confirmed absence of the capability. Matrix does not assess performance depth, only
    publicly verifiable existence and maturity.
  data:
    columns:
    - "Generally Available (GA)"
    - "Announced / Roadmap"
    - "Evidence Gap"
    rows:
    - label: eCommerce Fulfillment
      values:
      - {label: "Full GA — 3,000+ fulfillment nodes; sub-30-day go-live", tone: "positive"}
      - {label: "White-label fulfillment expansion (announced Feb 2025)", tone: "neutral"}
      - {label: "SLA thresholds, order-accuracy rates, and service-variability data not public", tone: "negative"}
    - label: Retail Distribution
      values:
      - {label: "Full GA — OTIF-compliance positioning; multi-node retail replenishment", tone: "positive"}
      - {label: "Transportation carrier partnerships (announced Feb 2025, no detail)", tone: "neutral"}
      - {label: "Carrier performance by operator or region not disclosed; penalty structure not public", tone: "negative"}
    - label: Market Intelligence (Discover)
      values:
      - {label: "GA Feb 2026 — Spot Warehousing Index; National and Regional Indices; Discover dashboard", tone: "positive"}
      - {label: "Ongoing index refinement and market intelligence releases per Flexe press release", tone: "neutral"}
      - {label: "Index methodology partial; third-party index weighting and bid-data sample size not disclosed", tone: "negative"}
    - label: API and Integrations
      values:
      - {label: "GA — REST API, EDI ANSI X12, XML/CSV, webhooks; D365 IOM certified connector", tone: "positive"}
      - {label: "AI-powered data mapping in connectors referenced in industry search results for 2026", tone: "neutral"}
      - {label: "API rate limits, versioning policy, and OAuth scope not publicly documented; sandbox is gated", tone: "negative"}
    - label: Automation and Robotics
      values:
      - {label: "Partial — automation capabilities available at select operator nodes; scope not specified", tone: "neutral"}
      - {label: "Automation expansion announced Feb 2025; white-label automation buildout", tone: "neutral"}
      - {label: "No specific automation capabilities, partner names, or robotics coverage data publicly disclosed as of June 2026", tone: "negative"}

