  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: soc2-compliance
    missingEvidence: >-
      Flexe's SOC 2 Type II attestation report (or equivalent security certification); platform
      uptime and availability commitments; data-residency and encryption-at-rest policy.
    whyItMatters: >-
      Enterprise contracts with Fortune 500 customers typically require SOC 2 Type II before signing.
      The absence of any public attestation means security posture cannot be independently verified
      in diligence from publicly available materials.
    diligencePath: >-
      Request SOC 2 Type II attestation report from Flexe security team (expected to be shared under
      NDA). Request data-processing agreement and encryption policy documentation.
    relatedQuestionRefs:
    - QE007
    - QE022
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: operator-quality-standards
    missingEvidence: >-
      Specific admission criteria for warehouse operators entering the Flexe network, performance
      thresholds required to remain in the network, and contractual backstop Flexe provides to
      customers in the event of operator failure or quality breach.
    whyItMatters: >-
      The entire physical execution layer depends on 800+ third-party operators. Without public
      or disclosed quality standards, service-level variance cannot be underwritten by a diligence
      buyer. This is the primary operational risk of the Flexe model.
    diligencePath: >-
      Request operator vetting criteria, performance scorecard methodology, and the SLA/penalty
      terms in Flexe's operator partner agreement. Inspect a sample of recent customer SLA
      performance reports.
