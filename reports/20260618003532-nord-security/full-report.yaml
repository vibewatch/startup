  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Segment Coverage
        blocks:
          - type: paragraph
            body: >-
              Nord Security’s competitive landscape is not one list of VPN peers; it is a stacked set of contests across
              consumer privacy, password management, business secure access, and a smaller encrypted-storage adjacency.
              That matters because the company can look strong in one lane and much more exposed in another. In the
              consumer VPN lane, NordVPN sits in a crowded field with ExpressVPN, Surfshark, Proton VPN, Mullvad,
              Private Internet Access, and CyberGhost all presenting broadly similar baseline promises: encrypted
              browsing, no-logs or privacy-forward messaging, broad device support, and promotional web pricing. In
              password management, NordPass is no longer competing with only niche vault products; it faces 1Password,
              Bitwarden, Dashlane, and Proton Pass, each with its own trust posture, business-admin angle, and pricing
              logic. On the B2B side, NordLayer is more naturally compared with secure-access and ZTNA platforms such as
              Twingate and Perimeter 81 than with a generic small-business VPN utility. NordLocker, by contrast, appears
              strategically useful but smaller in public prominence than the flagship NordVPN and the more scalable
              NordPass/NordLayer pair. The implication is that Nord Security’s true competitor set is broad but uneven.
              Its portfolio breadth gives it more paths to win than a single-product rival, yet it also forces the
              company to defend against distinct buyer expectations and category economics across both household and
              business budgets.
            claimRefs:
