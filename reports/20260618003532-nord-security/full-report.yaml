chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Scope, and Current Stage
        blocks:
          - type: paragraph
            body: >-
              Nord Security presents itself as a global digital-security company whose mission is to help people and
              businesses regain control of their privacy, security, and data online. The official homepage frames the
              company as broader than a single VPN brand, while the about page and related product sites show a
              portfolio that now includes NordVPN, NordPass, NordLayer, NordLocker, and newer launches such as
              NordStellar, Saily, and Coveron. That mix matters because it positions the business as an ecosystem
              company rather than a point solution. The official historical timeline says 2022 was the year Nord first
              became a unicorn, 2023 brought another $100 million investment round, and 2024 added three new digital
              products. Third-party reporting from TechCrunch and Tech.eu is consistent with the basic corporate
              narrative: Nord Security was founded in Vilnius, Lithuania in 2012; it operated for roughly a decade
              without institutional capital; and it used the Nord brand to build both consumer and business security
              lines before taking external money. The current product footprint is not only consumer-facing. NordLayer
              shows a business network-security and access-control motion, while NordLocker and NordPass support
              adjacent privacy and identity use cases that widen customer lifetime value and reduce single-product
              dependence. Public company materials therefore support describing Nord Security as a growth-stage
              cybersecurity platform anchored by NordVPN but no longer reducible to it.
