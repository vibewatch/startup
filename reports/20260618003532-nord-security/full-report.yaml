  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              Nord Security’s public financial story starts with a structural observation: this is a subscription
              software business, not a project-services or hardware company. NordVPN, NordPass, and NordLayer all
              publish recurring plan structures, which strongly supports a recurring-revenue model across consumer and
              business use cases. The company’s product architecture also suggests multiple monetization lanes—consumer
              subscriptions, family or household plans, business-password seats, and business secure-access seats—rather
              than a single price point. That is a favorable revenue-quality signal because it reduces dependence on any
              one SKU or buyer archetype. At the same time, the public record does not reveal clean revenue mix by
              product, geography, or consumer versus business segment, so it is easy to overstate diversification. The
              Surfshark group context further muddies interpretation because public narratives can speak in terms of a
              broader portfolio without revealing which legal entity or brand owns which revenue. The safest conclusion
              is that Nord has a real recurring engine with multiple monetization layers, but investors should resist
              pretending that visible pricing pages are the same thing as a segmented revenue ledger.
