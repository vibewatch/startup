      - number: '2.4'
        title: Constraints, Substitutes, and Sizing Caveats
        blocks:
          - type: paragraph
            body: >-
              The bull case on market growth does not remove important adoption constraints. First, estimate quality is
              uneven. Even the accessible VPN market sources disagree on absolute TAM because they are counting
              different things, and public market reports for password managers or identity protection are often gated,
              inconsistent, or overly broad. Second, technology evolution cuts two ways. Zero-trust architectures and
              broader security platforms can expand NordLayer’s opportunity, but they can also substitute for legacy
              business VPN spending if buyers prefer integrated SASE or identity-first vendors. Third, regulation is
              both a demand driver and a cost center. NIS2, SEC cyber disclosures, state privacy laws, and broader legal
              fragmentation push organizations toward more security tooling, but they also raise vendor compliance
              expectations. Fourth, the consumer side is still vulnerable to free-tool substitution, discount-led churn,
              and feature overlap from platform bundles. Nord’s answer is portfolio breadth, but the market remains
              competitive and partially commoditized at the edge. The right analytical conclusion is that Nord Security
              has exposure to several genuine growth markets, yet any valuation model that assumes one clean TAM,
              uniform buyer urgency, or frictionless category expansion would overstate certainty.
            claimRefs:
              - CM031
              - CM032
              - CM033
