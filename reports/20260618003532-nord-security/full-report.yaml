  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Nord Security’s product story is broad enough to require a map. At the top level, the company sells four
              visible products that correspond to distinct workflows: NordVPN for privacy and secure connectivity;
              NordPass for credentials, passkeys, and secure notes; NordLayer for business secure access and network
              control; and NordLocker for encrypted file storage and sharing. That spread matters because it pushes the
              company beyond a narrow VPN label. Each line also contains meaningful internal modules. NordVPN’s public
              pages highlight Meshnet, Threat Protection, kill switch, Double VPN, and Dark Web Monitor, which
              collectively move the experience from “tunnel traffic” toward a more bundled consumer-security workflow.
              NordPass adds Password Health and Data Breach Scanner, while NordLayer adds posture and segmentation
              features that belong to business access control rather than simple connectivity. The common thread is that
              Nord packages security into workflows that customers can act on directly, but the product depth is not
              identical across all lines. NordVPN is clearly the most mature flagship, while NordLocker looks more like
              a supporting adjacency in the broader ecosystem.
