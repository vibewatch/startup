  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Ranking and Trust Priority
        blocks:
          - type: paragraph
            body: >-
              The most important risk lens for Nord Security is trust. This is not a business where customers can easily
              verify every technical claim for themselves; they buy privacy, security, and safe defaults partly on
              reputation. That makes brand trust a first-order operating asset and a first-order fragility. The public
              record therefore points first to reputation and trust risks, then to model and regulation risks, and only
              after that to more ordinary software execution concerns. The legacy NordVPN datacenter incident remains
              highly relevant because it shows how a single security event can become a multi-year trust variable. Even
              if the direct operational blast radius was limited, the reputational implications were not. The right
              starting point is therefore to rank risks by their ability to damage trust, reduce demand, or increase
              scrutiny rather than by how easy they are to describe technically. for investors.
            claimRefs:
