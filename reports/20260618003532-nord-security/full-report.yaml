  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing Logic
        blocks:
          - type: paragraph
            body: >-
              Nord Security should not be sized against the entire global cybersecurity market even though that framing
              appears in some company materials and media coverage. Its practical opportunity is a stacked set of
              adjacent categories: consumer VPN and privacy software, business secure-access and network-protection
              software, password and credential management, and newer identity-protection extensions such as Coveron.
              The category boundary matters because published market estimates diverge sharply depending on whether
              analysts count only commercial VPN subscriptions or also include hardware, managed services, SASE layers,
              and related infrastructure. Accessible 2026 market overviews from Axis Intelligence and VPNPro both point
              to a very large and fast-growing VPN segment, but they also explicitly explain why absolute dollar
              estimates differ. That is exactly the discipline needed here: Nord’s TAM is large enough to matter, yet
              not every dollar of cybersecurity, privacy, or compliance spending belongs in the denominator. The
              strongest evidence therefore supports a tiered view. The consumer VPN layer is real and global; business
              secure access and zero-trust adjacency broaden the enterprise and SMB side; password management and
              identity-protection expand wallet share; and broader cyber, compliance, and privacy budgets remain
              adjacent rather than automatically included. This layered framing avoids both understatement and
              marketing-grade exaggeration.
