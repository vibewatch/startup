      - number: '7.4'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Nord is not a story of unmitigated risk. The company has publicly described security changes, audits, and
              trust initiatives after past incidents, and those should count as real mitigation signals. But because
              this is a trust-sensitive category, mitigations only matter if outsiders can verify them and if they hold
              up in future incidents. The most important monitoring indicators are therefore practical: evidence of
              another serious incident, proof that privacy claims were misleading, signs of sustained pricing-led margin
              erosion, or clear strategic loss of relevance as zero-trust alternatives displace Nord’s business
              expansion path. Those are not abstract risks; they are concrete kill criteria. The right verdict is
              disciplined interest: Nord can be investable, but only if diligence is strong on trust operations,
              regulatory readiness, and resilience under scrutiny. Another practical point is timing: risks in this
              category can stay latent for long periods and then reprice the business suddenly when one event
              crystallizes them. That asymmetry is why kill criteria must be explicit before capital is committed.
