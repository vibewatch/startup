      - number: '3.3'
        title: Switching Costs, Distribution, and Lock-in
        blocks:
          - type: paragraph
            body: >-
              Competitive durability depends less on feature checklists than on how hard it is for a customer to leave.
              Consumer VPN subscriptions usually have the lowest switching costs in Nord’s portfolio: installation is
              easy, contracts are not deeply operational, and buyers can compare new offers within minutes. Password
              managers create more friction because vault migration, admin policies, sharing structures, and user
              training all matter. Secure-access tooling creates even deeper operational dependencies because
              administrators must coordinate identities, devices, network policies, and rollout workflows. This is where
              Nord’s portfolio cuts both ways. NordVPN’s category is crowded and discount-sensitive, but NordPass and
              NordLayer can build stickier admin relationships if they become embedded in organizational workflows. The
              counterweight is distribution power. Large security incumbents and identity-centric vendors often have
              bigger enterprise sales reach than NordLayer, and that can overwhelm product-level merit. Multi-homing is
              also asymmetric: it is realistic for a household to experiment with multiple VPN or privacy tools, but
              much less realistic for a company to operate duplicate password-governance or ZTNA systems indefinitely.
              The underwriting takeaway is that Nord’s competitive position improves as it moves from casual consumer
              utility toward workflow-embedded admin systems, yet that same move puts it in front of better-distributed
              incumbents.
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
