        blocks:
          - type: paragraph
            body: >-
              Operational and model risks are where Nord’s growth story can turn fragile. Consumer VPN categories face
              commoditization and discount pressure, while business security categories face substitution pressure from
              broader zero-trust and identity-centric stacks. At the same time, Nord’s products depend on
              infrastructure, external platforms, and third-party environments that are not fully visible from public
              sources. That combination matters because a company can simultaneously have a strong brand and a delicate
              margin structure. Infrastructure or supplier incidents can create trust shocks; distribution dependencies
              can weaken control; and pricing wars can compress margins if management prioritizes volume over quality.
              The public evidence supports this as a medium-to-elevated risk zone rather than a speculative edge case.
              It is also where later-stage private-company opacity hurts investors most: without cleaner disclosure, one
              cannot easily separate healthy strategic investment from hidden margin strain or partner fragility.
