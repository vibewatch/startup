        - More mature businesses often trade at lower multiples
      - - Kape / ExpressVPN history
        - Strategic consumer VPN
        - Shows strategic value in privacy/VPN assets
        - Consumer VPN is valuable but not automatically premium forever
      - - Private cyber multiple datasets
        - Sector benchmark
        - Frames late-stage cyber valuation ranges
        - Nord can be premium to SaaS medians if quality is proven
      - - Proton / 1Password
        - Private product comparables
        - Help frame product adjacency and category quality
        - Weak direct pricing comps without transparent valuation metrics
    notes: >-
      No single comparable fully captures Nord’s mix of consumer privacy, business security, and private-company
      opacity.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV025
      - CV026
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Comparable rows capture the main public, strategic, and private reference points used in this chapter as of
        2026-06-18; they are not claimed to be every possible cybersecurity comparable.
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Why it matters
      - Current visibility
    rows:
      - - Serious new trust event
        - 'Could damage the core asset: reputation'
        - Not observed now
      - - Margin damage from discounting
        - Would weaken value of ARR scale
        - Not publicly quantified
      - - Business-product expansion stalls
        - Would narrow strategic premium
        - Not yet disproven
      - - Revealed adverse rights / preference overhang
        - Would hurt entry attractiveness
        - Not visible publicly
    notes: Triggers should focus on what would invalidate the premium narrative, not on generic market noise.
    claimRefs:
      - CV019
      - CV021
      - CV022
      - CV027
      - CV037
