            claimRefs:
              - CV013
              - CV014
              - CV031
              - CV032
              - CV035
              - CV036
              - CV038
          - type: table
            tableRef: TV005
            claimRefs:
              - CV019
              - CV021
              - CV022
              - CV027
              - CV037
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV021
              - CV023
              - CV040
      - number: '8.4'
        title: Diligence Asks and Final Verdict
        blocks:
          - type: paragraph
            body: >-
              The final valuation judgment is that Nord is attractive enough to continue diligencing and not transparent
              enough to underwrite casually. The main blockers are familiar but material: revenue mix, gross margin,
              retention, cash generation, and cap-table rights. Exit-readiness also remains ambiguous. Scale and
              category relevance support future IPO or strategic options, but thin disclosure on economics and
              preferences makes that option value hard to price today. The right investor behavior is therefore
              conditional: pursue the asset if management can substantiate revenue quality and rights visibility at an
              entry price that leaves room for execution and trust risk. Otherwise, the safer interpretation is that the
              current public record supports admiration more than immediate conviction. Put differently, the last round
              price is a useful data point, not a substitute for present-tense diligence. More transparency would
              convert admiration into pricing conviction.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV020
              - CV022
              - CV034
              - CV037
              - CV039
              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Nord may be worth the price only if it proves more than consumer VPN strength
            body: >-
              The multiple case improves meaningfully if management can show durable business-product expansion and
              high-quality recurring revenue, not just consumer brand power.
            calloutType: insight
            claimRefs:
              - CV005
              - CV013
              - CV035
          - type: callout
            title: The hidden variable is rights and revenue quality, not awareness
            body: >-
              The market already knows Nord is important and scaled. What it does not know publicly is enough about mix,
              margins, retention, and preferences to underwrite the last mark with conviction.
            calloutType: risk
            claimRefs:
              - CV007
              - CV016
              - CV020
              - CV022
              - CV037
