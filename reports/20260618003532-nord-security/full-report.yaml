      - number: '1.3'
        title: Funding History, Investors, and Surfshark Combination
        blocks:
          - type: paragraph
            body: >-
              Nord Security’s capital narrative is unusually distinctive for a European cybersecurity scale-up.
              TechCrunch reported that the company spent its first decade bootstrapped before raising its first-ever
              external round in April 2022: $100 million at a $1.6 billion valuation, led by Novator with Burda
              Principal Investments, General Catalyst, and prominent angel investors participating. Official company
              materials and Tech.eu then show a second $100 million round in September 2023 led by Warburg Pincus, with
              Novator and Burda doubling down, and valuation stepping up to $3 billion. The 2023 release is explicit
              that Nord planned to use the money not just for product expansion but also for strategic mergers and
              acquisitions. That context matters because the company had already entered a merger agreement with
              Surfshark in 2022. Both NordVPN’s own explanation and Surfshark’s companion announcement say the brands
              would keep separate infrastructures, user bases, and product roadmaps even while sharing technical
              knowledge and corporate-level strategic alignment. This is a meaningful distinction for diligence: Nord
              Security widened scale and category coverage without fully collapsing brand identities or product stacks.
              It also means that reported product breadth and employee counts at the group level need careful
              interpretation, because public pages sometimes mix Nord-branded assets, legacy Atlas VPN references, and
              Surfshark-group context. Overall, the evidence supports a company that moved from self-funded
              profitability into selective growth capital while using M&A and group formation to accelerate portfolio
              breadth.
