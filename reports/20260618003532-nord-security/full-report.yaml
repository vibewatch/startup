      - number: '4.2'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Public data are far thinner on unit economics than on pricing. No source in the accessible set discloses
              CAC, payback, GAAP gross margin, EBITDA, or free cash flow. That means the most useful work is
              inferential. Because Nord Security sells software subscriptions and network-delivered security tools, the
              gross-margin profile should be structurally closer to software than to hardware or services. But that does
              not mean the cost base is trivial. VPN infrastructure, server operations, support, payments, affiliate
              marketing, compliance, and trust investments all matter. The business mix also matters. Consumer VPN
              likely has lower switching costs and heavier marketing sensitivity than admin-centered products such as
              NordPass Business or NordLayer, while the business products may have better durability but somewhat higher
              service and support overhead. Public evidence therefore supports a software-like economic model, but not a
              clean margin model. That is sufficient to argue for good theoretical margins, yet insufficient to prove
              current efficiency.
