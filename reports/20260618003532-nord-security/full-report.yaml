      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Nord operates in a category where regulation can both help and hurt. Privacy and cyber-governance rules
              raise the importance of digital protection, which can support demand. But the same rules also increase
              vendor expectations, disclosure pressure, and the cost of doing business. NIS2, GDPR, SEC cyber-disclosure
              rules, and the fragmented U.S. privacy-law environment all push in that dual-direction way. For Nord
              specifically, the implication is that a company selling privacy and security tools has less room for
              sloppy controls, weak disclosures, or ambiguous promises than a generic consumer-software company.
              VPN-specific geopolitics add another layer: shutdowns, censorship, or anti-VPN restrictions in some
              jurisdictions can affect availability or growth. Legal risk therefore sits not only in formal enforcement,
              but also in the broader governance environment surrounding privacy claims and internet freedom. It also
              means that legal missteps can quickly become commercial risks, especially with business buyers that must
              justify vendor choice under governance pressure.
