      - number: '2.2'
        title: Buyer, User, and Budget Segmentation
        blocks:
          - type: paragraph
            body: >-
              Nord Security’s markets break into meaningfully different buyer and payer patterns. In consumer VPN and
              privacy products, the user and payer are often the same person or household administrator buying a
              subscription for privacy, streaming access, safer public-Wi-Fi use, or general cyber hygiene. In password
              management, a similar split exists between personal subscriptions and business credential management, but
              NordPass shows how the business use case changes the buyer from an individual to an IT, identity, or
              security administrator with compliance and audit obligations. On the business side, NordLayer shifts even
              more clearly into the secure-access and zero-trust world. Its homepage markets to organizations that need
              encrypted remote access, segmented access control, threat prevention, breach monitoring, and lower total
              cost of ownership than fragmented legacy tooling. The buyer here is not a household but an SMB or
              enterprise technology leader, managed-service partner, or security operator. The market therefore has
              multiple budget owners: consumers, households, small-business IT teams, compliance-minded midmarket
              buyers, and large enterprises looking for faster secure-access rollout. That segmentation supports a SAM
              logic built on overlapping but distinct purchasing motions rather than a single monolithic customer
              archetype.
