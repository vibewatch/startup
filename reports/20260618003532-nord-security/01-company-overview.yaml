- id: leadership-governance-and-organization
  title: Leadership, Governance, and Organizational Signals
  body: 'Founder continuity remains one of Nord Security’s clearest strengths. Company sources and funding coverage consistently identify Tomas Okmanas and Eimantas Sabaliauskas as the co-founders who built the business from 2012 onward. The 2023 financing announcement still used the co-CEO framing for both founders, while later ecosystem sources such as Craft and Tomas Okmanas’s own biography point to Okmanas as the most visible CEO-level public face. Nord’s official leadership page is more revealing about management culture than about the full executive roster: it emphasizes internal promotions, women in leadership roles, and a leadership-development framework, but it does not publish a clean list of current executive officers, committee structures, or directors. That disclosure gap is meaningful because the 2023 Warburg Pincus round included a board seat for Chandler Reedy, so governance is no longer solely founder-defined even if founders remain central. Craft adds one useful datapoint
    by identifying Toma Sabaliauskienė as chief marketing officer, but open-source visibility into the rest of the executive bench is still weaker than investors would typically prefer for a company of Nord’s scale. Careers data nevertheless show an organization that continues to hire across engineering, commercial, legal, finance, risk, and product functions, which supports the view that the platform has matured beyond a narrow founder-led startup. The balance of evidence suggests strong founder-market fit and organizational breadth, but only partial public transparency on who now holds formal decision rights.'
