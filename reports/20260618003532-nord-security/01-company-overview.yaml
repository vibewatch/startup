- id: scale-milestones-and-adverse-history
  title: Scale Markers, Milestones, and Adverse History
  body: Nord Security publishes enough public milestones to establish a credible growth arc, but not enough audited operating data to eliminate all ambiguity. The 2023 round announcement said the company operated in more than 20 markets and employed around 2,000 professionals globally. The latest accessible Latka profile pushes the late-2025 revenue figure to $357 million and team size to roughly 1.8 thousand, which is directionally consistent with a mature private software company but still requires management confirmation because the methodology is not fully transparent. The about page adds strategic product milestones, stating that Nord launched NordStellar, Saily, and Coveron in 2024, while the 2022 impact-report materials describe product and trust initiatives such as Threat Protection, Meshnet, audits, ISO certifications, and bug-bounty activity. The most material adverse event in the public record remains the NordVPN server incident disclosed in 2019. NordVPN’s official response and
    Engadget’s coverage both describe unauthorized access to one rented Finnish server in 2018, no evidence of compromised user credentials or activity logs, and a delayed public disclosure that nonetheless forced the company to accelerate audits, bug bounty work, and a move toward stronger infrastructure controls. That history does not negate the company’s category leadership, but it does matter because trust is foundational to the Nord brand. A diligence-minded summary is therefore that Nord Security’s scale story is real, its portfolio expansion is visible, and its adverse history is manageable but highly relevant to brand underwriting.
