  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and post-2023 investor-rights summary that shows exactly how founder control changed after the Warburg Pincus round.
    whyItMatters: Governance and control rights determine how much strategic freedom the founders still hold and whether later financing introduced preferences or oversight that can shape future exits.
    diligencePath: Request the latest board materials, shareholder agreement summary, and post-money cap table from management or lead investors.
    relatedQuestionRefs:
    - QO007
    - QO008
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or management-certified 2025 revenue, ARR, gross margin, and current employee count that reconcile the 2023 official figures with later third-party profile estimates.
    whyItMatters: Public private-company profiles are directionally helpful but not enough for underwriting scale quality or comparing valuation multiples to peers.
    diligencePath: Obtain management reporting, investor update decks, and KPI definitions for revenue, ARR, and headcount.
    relatedQuestionRefs:
    - QO017
    - QO024
    relatedTableRefs:
    - TO001
    - TO004
