evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A current board roster, committee structure, and post-2023 investor-rights summary that shows exactly how founder
      control changed after the Warburg Pincus round.
    whyItMatters: >-
      Governance and control rights determine how much strategic freedom the founders still hold and whether later
      financing introduced preferences or oversight that can shape future exits.
    diligencePath: >-
      Request the latest board materials, shareholder agreement summary, and post-money cap table from management or
      lead investors.
    relatedQuestionRefs:
      - QO007
      - QO008
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited or management-certified 2025 revenue, ARR, gross margin, and current employee count that reconcile the
      2023 official figures with later third-party profile estimates.
    whyItMatters: >-
      Public private-company profiles are directionally helpful but not enough for underwriting scale quality or
      comparing valuation multiples to peers.
    diligencePath: Obtain management reporting, investor update decks, and KPI definitions for revenue, ARR, and headcount.
    relatedQuestionRefs:
      - QO017
      - QO024
    relatedTableRefs:
      - TO001
      - TO004
  - type: missing-source
    severity: material
    topic: password-manager-tam
    missingEvidence: >-
      A high-quality public market report that isolates the password-manager category with methodology transparent
      enough to map directly onto NordPass business and consumer demand.
    whyItMatters: >-
      NordPass is strategically important, but accessible public market reports either over-broaden cybersecurity or sit
      behind paywalls, which weakens exact TAM modeling.
    diligencePath: >-
      Obtain a primary market-research extract or management segmentation materials that isolate password-manager and
      credential-management spend.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: nord-market-mix
    missingEvidence: Management-level revenue mix by NordVPN, NordLayer, NordPass, identity-protection add-ons, and geography.
    whyItMatters: >-
      A layered TAM is useful, but real underwriting needs to know which layers matter most to actual revenue and which
      remain strategic options only.
    diligencePath: Request product-level revenue mix, customer counts, and pipeline split by consumer versus business products.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM001
      - TM003
  - >-
    Public sources show competitor positioning and packaging far better than true enterprise pricing, renewal behavior,
    or category-level win rates.
  - No public source set gives a rigorous Nord-specific win-loss database across VPN, password-manager, and ZTNA deals.
  - Public sources do not provide management-grade gross margin, burn, runway, debt, or cash-flow disclosures.
  - >-
    The widely cited $357M ARR figure remains a third-party estimate until management confirms methodology and date
    basis.
  - >-
    Public pages do not disclose full backend architecture, defect rates, or detailed independent audit scope across
    every product line.
  - >-
    The current public record is much stronger on feature visibility than on reproducible evidence of internal
    engineering quality.
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof-tu003
    missingEvidence: >-
      Public sources do not reveal a robust set of named enterprise customers or deployment details for NordLayer and
      NordPass beyond review-platform evidence.
