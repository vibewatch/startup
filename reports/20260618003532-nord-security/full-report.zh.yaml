      - number: '8.4'
        title: 尽调要求与最终判断
        blocks:
          - type: paragraph
            body: >-
              最终估值判断是：Nord 足够有吸引力，值得继续尽调；但透明度还不够，不能随意承销。主要障碍熟悉却关键：收入结构、毛利率、留存、现金生成和股权结构权利。退出准备度也仍然模糊。规模和品类相关性支持未来 IPO
              或战略出售选项，但经济性和优先权披露太薄，使今天很难给这部分期权价值定价。因此，正确的投资人行为应是有条件推进：如果管理层能在一个为执行风险和信任风险留下空间的入场价格上，证实收入质量并提高权利可见度，就继续追踪该资产。否则，更安全的解读是：当前公开记录更支持赞赏，而不是立即建立确信。换句话说，上一轮价格是有用的数据点，但不能替代当下尽调。更多透明度才能把赞赏转化为定价确信。
