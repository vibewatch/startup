  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Nord Security 的公开财务故事始于一个结构性观察：这是一家订阅软件公司，不是项目服务或硬件公司。NordVPN、NordPass 和 NordLayer
              都公开经常性套餐结构，强有力地支持其在消费者和企业用例中采用经常性收入模式。公司的产品架构也暗示多条变现路径——消费者订阅、家庭或家庭组套餐、企业密码席位、企业安全访问席位——而不是单一价格点。这是有利的收入质量信号，因为它降低了对任何单一
              SKU 或买方原型的依赖。同时，公开记录没有按产品、地区或消费者 / 企业分部披露干净收入结构，因此很容易高估多元化。Surfshark
              集团语境进一步让解读变浑，因为公开叙事可能谈一个更宽的组合，却不说明哪个法律实体或品牌拥有哪块收入。最稳妥的结论是，Nord 确实有一个多层变现的经常性引擎，但投资者不应假装可见定价页等同于分部收入账本。
