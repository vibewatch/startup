      - number: '3.2'
        title: 能力、定价与定位
        blocks:
          - type: paragraph
            body: >-
              竞争的第二层，是这些供应商如何打包和定位重叠能力。NordVPN、ExpressVPN、Surfshark 和 PIA
              都公开网页直销定价和长期套餐，让消费者端标题级比较异常透明，也加剧了折扣驱动流失风险。NordPass、1Password 和 Bitwarden
              同样公开企业套餐，因此中小买方进入销售流程前就能比较基础价格点。NordLayer 公开团队定价，并把自己营销为可部署的安全访问平台，而不是咨询很重的企业转型项目。这些公开页面表明，Nord
              竞争的位置居中：比最便宜的单点方案更精致、更有组合意识，但通常比大型企业安全套件更易接近、更自助。定位上的细微差别很重要。Mullvad 和 Proton
              等隐私聚焦品牌更强调信任叙事，较便宜或更促销化的同行更强调价值。在密码管理中，开放或开发者友好的替代品可能改变买方心理，尤其当买方更看重透明度或成本控制，而不是套件宽度。Nord
              的强项并不是竞争对手弱，而是公司常常避免被迫只围绕单一购买标准竞争。它可以卖高端 VPN、管理员友好的密码管理器和企业访问平台，而不需要每个产品单独主导每一项能力。
