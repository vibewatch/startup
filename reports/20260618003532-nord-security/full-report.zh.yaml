      - number: '5.4'
        title: 信任控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              网络安全里的产品质量无法与信任控制和失败历史分开。Nord
              的公开材料展示了客户可见的安全功能和事件后的安全投入，这是有意义的正面信号。但历史数据中心泄露仍然重要，因为它检验公司在压力下的可信度；TunnelVision
              这类更新的品类级风险也说明，强品牌并不能消除协议或架构风险。公开来源集有助于识别可见控制和已知事件；但要判断后端缺陷率、完整发布节奏，或当前技术审计的独立性与深度，它很弱。正确综合应当平衡：Nord
              看起来是有能力、且相当成熟的运营商，控制面可见；但技术尽调仍需要超越营销页面，做架构审查和信任验证。它也留下了关于依赖管理、发布治理，以及每条产品线是否获得同等深度独立保证的问题。这些缺口不会否定组合，但意味着技术上行故事在功能层面更有证明，在工程流程层面证明较弱。
