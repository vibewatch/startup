            body: >-
              最强的可见牵引力数据点，是第三方数据库给出的 $357M ARR 或收入代理值、已知融资时间线，以及 Nord 招聘页面持续释放的招聘信号。最可信的融资事实很清楚：2022 年是首个外部融资轮，估值约
              $1.6B；2023 年又在 Warburg Pincus 领投下以 $3B 估值融资 $100M。合在一起，这些轮次意味着约 $200M 公开披露融资额，并支持 Nord
              在做出相当规模后才选择外部资金的判断。这是一个有意义的资本效率信号，即便它不能证明当前盈利能力。员工数数据在方向上有用，但第三方来源之间不一致，使公开生产率比率很脆弱。因此，资本时间线最好的分析用途不是声称精确，而是把
              Nord 框定为一家后期私营软件公司，其融资看起来是成长导向，而不是救助导向。
