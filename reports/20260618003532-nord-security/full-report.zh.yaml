      - number: '1.2'
        title: 领导层、治理与组织信号
        blocks:
          - type: paragraph
            body: >-
              创始人连续性仍是 Nord Security 最清晰的优势之一。公司来源和融资报道一致将 Tomas Okmanas 与 Eimantas Sabaliauskas 识别为自 2012
              年起打造业务的联合创始人。2023 年融资公告仍用联合 CEO 框架描述两位创始人；之后的生态系统来源，如 Craft 以及 Tomas Okmanas 自己的履历，则指向 Okmanas 是最可见的 CEO
              级公开代表。Nord 官方领导力页面透露的管理文化多于完整高管名单：它强调内部晋升、女性领导者和领导力发展框架，但没有发布清晰的现任高管、委员会结构或董事名单。这个披露缺口有意义，因为 2023 年
              Warburg Pincus 融资包含 Chandler Reedy 的董事席位；即便创始人仍是核心，治理也不再完全由创始人定义。Craft 补充了一个有用数据点，将 Toma Sabaliauskienė
              标为首席营销官；但开源渠道对其余高管梯队的可见度，仍弱于投资者通常希望在 Nord
              这种规模公司看到的水平。招聘数据仍显示，公司持续在工程、商业、法务、财务、风险和产品等职能招聘，支持平台已成熟到不只是狭义创始人主导创业公司的判断。综合证据指向强创始人市场匹配和组织宽度，但谁实际拥有正式决策权，公开透明度仍不完整。
