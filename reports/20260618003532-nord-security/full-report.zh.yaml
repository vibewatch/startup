  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与细分覆盖
        blocks:
          - type: paragraph
            body: >-
              Nord Security 的竞争格局不是一张 VPN
              同行名单，而是一组横跨消费者隐私、密码管理、企业安全访问和较小加密存储相邻品类的叠加战场。这很重要，因为公司可能在一条赛道很强，在另一条赛道暴露更多。在消费者 VPN 赛道，NordVPN
              面对拥挤市场，ExpressVPN、Surfshark、Proton VPN、Mullvad、Private Internet Access 和 CyberGhost
              都给出大体相似的基础承诺：加密浏览、无日志或隐私优先叙事、广泛设备支持，以及促销式网页定价。在密码管理中，NordPass 不再只与小众密码库产品竞争；它面对
              1Password、Bitwarden、Dashlane 和 Proton Pass，每家都有自己的信任姿态、企业管理员角度和定价逻辑。B2B 侧，NordLayer 更自然的可比对象是
              Twingate、Perimeter 81 等安全访问和 ZTNA 平台，而不是通用小企业 VPN 工具。相比之下，NordLocker 看起来有战略价值，但在公开声量上小于旗舰 NordVPN，也小于更可扩展的
              NordPass / NordLayer 组合。含义是，Nord Security
              的真实竞争集合很宽，但并不均匀。组合宽度给它提供了比单产品对手更多的取胜路径，也迫使公司同时防守家庭和企业预算中不同的买方预期与品类经济性。
