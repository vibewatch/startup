  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与信任优先级
        blocks:
          - type: paragraph
            body: >-
              评估 Nord Security
              风险，最重要的镜头是信任。这不是客户能轻易自行验证每一项技术主张的业务；他们购买隐私、安全和安全默认设置，一部分靠声誉背书。因此，品牌信任既是一阶运营资产，也是一阶脆弱点。公开记录首先指向声誉和信任风险，其次是模型和监管风险，最后才是更普通的软件执行问题。历史
              NordVPN
              数据中心事件仍高度相关，因为它显示单一安全事件如何变成多年信任变量。即便直接运营影响范围有限，声誉影响也并不有限。因此，正确起点是按风险损害信任、削弱需求或增加审查的能力排序，而不是按技术描述的难易程度排序——这是投资者应采用的视角。
