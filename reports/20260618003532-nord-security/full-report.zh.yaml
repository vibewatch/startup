      - number: '2.4'
        title: 约束、替代品与规模测算注意事项
        blocks:
          - type: paragraph
            body: >-
              市场增长的多头故事并不能抹掉重要采用约束。第一，估算质量参差不齐。即便是可访问的 VPN 市场来源，也因统计对象不同而对绝对 TAM
              意见不一；密码管理或身份保护的公开市场报告往往有门槛、口径不一致或过宽。第二，技术演进有双重影响。零信任架构和更广泛的安全平台可以扩大 NordLayer 的机会，但如果买方偏好一体化 SASE
              或身份优先厂商，它们也会替代传统企业 VPN 支出。第三，监管既是需求驱动，也是成本中心。NIS2、SEC
              网络披露、州隐私法和更广泛的法律碎片化会推动组织采用更多安全工具，也会抬高对供应商合规的预期。第四，消费者侧仍容易受到免费工具替代、折扣驱动流失和平台捆绑功能重叠的冲击。Nord
              的答案是组合宽度，但市场边缘仍竞争激烈且部分商品化。正确的分析结论是，Nord Security 暴露于几个真实增长市场；但任何假设一个干净 TAM、统一买方紧迫性或无摩擦品类扩张的估值模型，都会高估确定性。
