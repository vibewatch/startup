      - number: '3.3'
        title: 切换成本、分销与锁定
        blocks:
          - type: paragraph
            body: >-
              竞争耐久性更取决于客户离开有多难，而不是功能清单。消费者 VPN 订阅通常是 Nord
              组合中切换成本最低的：安装容易，合同不深度嵌入运营，买方几分钟内就能比较新报价。密码管理器会制造更多摩擦，因为密码库迁移、管理员策略、共享结构和用户培训都重要。安全访问工具会形成更深的运营依赖，因为管理员必须协调身份、设备、网络策略和上线工作流。这里，Nord
              的组合有双面性。NordVPN 所在品类拥挤且对折扣敏感，但如果 NordPass 和 NordLayer
              嵌入组织工作流，就能建立更黏的管理员关系。反向压力来自分销能力。大型安全现有厂商和以身份为核心的供应商往往比 NordLayer 拥有更强企业销售触达，足以压过产品层面的优点。多归属也不对称：家庭尝试多个 VPN
              或隐私工具很现实，但一家公司长期运行重复的密码治理或 ZTNA 系统就不太现实。承销结论是，Nord 从随意消费者工具走向嵌入工作流的管理员系统时，竞争位置会改善；但同一移动也会让它正面遇到分销更强的现有厂商。
