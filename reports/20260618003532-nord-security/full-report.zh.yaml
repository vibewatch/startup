      - number: '3.4'
        title: 护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              最强的看多 Nord 竞争论点是组合逻辑：很少有隐私品牌能同时在消费者
              VPN、密码管理、企业访问和加密存储相邻品类拥有有意义的足迹。这创造了交叉销售选项，也提供了比大多数单产品对手更宽的信任伞。但最强反论点是，每个品类也都有具备具体优势的可信替代：Bitwarden
              在价值和开放性上有优势，Proton 在多产品隐私使命上有优势，ExpressVPN 有高端品牌位置，Surfshark 和 PIA 定价激进，Check Point
              等企业供应商则有分销深度。NordLocker 也更像支撑性资产，而不是客户买入生态系统的核心理由。因此，公开证据支持一个有层次的护城河判断。Nord
              并没有明显困在一条商品化赛道里，但公开记录也没有证明硬性的赢家通吃经济性。消费者 VPN 仍是组合中最商品化的边缘；如果 Nord
              能深化集成和续约，围绕管理员的产品可能最有耐久性。剩余最大尽调缺口，是公开网站无法解决的部分：真实输赢率、企业客户背书质量、续约行为和折扣纪律。在回答这些问题前，Nord
              的护城河应被视为真实但有条件，而不是绝对。
