      - number: '1.3'
        title: 融资历史、投资者与 Surfshark 合并
        blocks:
          - type: paragraph
            body: >-
              在欧洲网络安全 scale-up 中，Nord Security 的资本叙事格外有辨识度。TechCrunch 报道称，公司前十年靠自举增长，直到 2022 年 4 月才完成首个外部融资轮：$100M、估值
              $1.6B，由 Novator 领投，Burda Principal Investments、General Catalyst 和知名天使投资人参投。公司官方材料和 Tech.eu 随后显示，2023 年 9
              月公司完成第二笔 $100M 融资，由 Warburg Pincus 领投，Novator 与 Burda 继续加码，估值升至 $3B。2023 年新闻稿明确表示，Nord
              计划把资金不仅用于产品扩张，也用于战略并购。这个背景很重要，因为公司 2022 年已经与 Surfshark 签署合并协议。NordVPN 自己的解释和 Surfshark
              的配套公告都称，即便共享技术知识和公司层面的战略协同，品牌仍会保持独立基础设施、用户群和产品路线图。对尽调而言，这是一个关键区分：Nord Security
              扩大了规模和品类覆盖，却没有完全折叠品牌身份或产品栈。这也意味着，集团层面报告的产品宽度和员工数需要谨慎解读，因为公开页面有时会混合 Nord 品牌资产、历史 Atlas VPN 引用和 Surfshark
              集团语境。总体看，证据支持这样一家公司：先从自筹盈利走向选择性成长资本，再借 M&A 和集团化加快组合宽度。
