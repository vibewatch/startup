              公开证据集足以支持方向性的财务判断，但又弱到不能完成硬承销。正面看，Nord
              明显像一家已具规模的经常性收入公司，拥有多个产品、直观定价、可见品牌强度，以及估值随时间显著抬升的后期融资。负面看，证据集没有提供真正决定投资质量的指标：收入结构、毛利率、留存、CAC
              效率、现金生成、债务、跑道或折扣纪律。公开来源能说明 Nord 卖什么，以及规模可能大致有多大；它们不能说明这台机器把增长转化为耐久经济性的效率。平衡结论是，Nord
