  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Nord Security 并不只卖给一种客户。可见客户基础清晰分成消费者隐私买家和企业管理员。NordVPN
              的买方看起来是个人用户或家庭付款人，他们追求隐私、更安全的公共连接、旅行灵活性或一般网络卫生。NordPass 和 NordLayer 把图景转向管理员买方、团队策略和 IT
              主导控制。这意味着客户地图应按买方动作建模，而不只是按产品 logo 建模。地理覆盖证据在 NordVPN 侧最强，公开服务器国家和统计页面显示非常广的国际足迹。相比之下，NordPass 和 NordLayer
              的证据更多来自用例和评测存在感，而不是订阅用户数。这个分裂对尽调很重要，因为消费者侧规模清晰可见，B2B 侧则更适合通过管理员工作流证明来理解，而不是通过公开账户总数。因此，消费者足迹比企业账户足迹更容易看见。
