      - number: '2.2'
        title: 买方、用户与预算分层
        blocks:
          - type: paragraph
            body: >-
              Nord Security 所在市场拆成几种差异明显的买方和付款人模式。在消费者 VPN 和隐私产品中，用户和付款人往往是同一个个人或家庭管理员，为隐私、流媒体访问、更安全的公共 Wi-Fi
              使用或一般网络卫生购买订阅。密码管理也存在类似的个人订阅与企业凭证管理之分，但 NordPass 展示了企业用例如何把买方从个人变为承担合规和审计义务的 IT、身份或安全管理员。企业侧，NordLayer
              更清晰地进入安全访问和零信任世界。其首页面向需要加密远程访问、分段访问控制、威胁防护、泄露监控，以及比碎片化传统工具更低 TCO 的组织。这里的买方不是家庭，而是 SMB
              或企业技术负责人、托管服务伙伴或安全运营者。因此，市场有多个预算所有者：消费者、家庭、小企业 IT 团队、重视合规的中型市场买家，以及寻求更快部署安全访问的大型企业。这种分层支持一种 SAM
              逻辑：它建立在重叠但不同的购买动作上，而不是单一、庞大的客户原型。
