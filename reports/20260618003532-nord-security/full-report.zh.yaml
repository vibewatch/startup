  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算逻辑
        blocks:
          - type: paragraph
            body: >-
              即便部分公司材料和媒体报道会这样表述，也不应把 Nord Security 放进整个全球网络安全市场来测算。它的实际机会是一组相邻品类的叠加：消费者 VPN
              和隐私软件、企业安全访问和网络防护软件、密码与凭证管理，以及 Coveron 等更新的身份保护延伸。品类边界很重要，因为公开市场估算会因口径不同而大幅分化：分析师到底只计算商业 VPN
              订阅，还是也把硬件、托管服务、SASE 层和相关基础设施纳入。Axis Intelligence 和 VPNPro 可访问的 2026 年市场概览都指向一个巨大且快速增长的 VPN
              细分市场，但也明确解释了绝对美元估算为何不同。这正是这里需要的纪律：Nord 的 TAM 足够大，但网络安全、隐私或合规支出的每一美元，并不都该进入分母。因此，最强证据支持分层看法。消费者 VPN
              层真实且全球化；企业安全访问和零信任相邻品类拓宽了企业与 SMB 侧；密码管理和身份保护扩大钱包份额；更广泛的网络安全、合规和隐私预算仍是相邻项，而不是自动纳入项。这种分层框架既避免低估，也避免营销式夸大。
