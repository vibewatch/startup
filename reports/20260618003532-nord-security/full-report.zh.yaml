      - number: '8.2'
        title: 多重逻辑与可比公司组
        blocks:
          - type: paragraph
            body: >-
              最简单的估值算术也最危险。按 $3B 估值和约 $357M ARR 计算，Nord 约为 8.4x 倍数。这个数字有方向意义，但仍依赖二级 ARR
              数字，而不是经审计的公开报告。因此下一步必须看可比公司，可比组也必然混合。Gen Digital 可作为公开消费者安全基准，市场指标透明。Kape 以及 ExpressVPN 交易历史可作为战略性消费者 VPN
              参照。私营网络安全倍数数据集则帮助框定 2026 年后期网络安全资产可能的交易区间。但没有单一可比项完美适配，因为 Nord
              把消费者隐私、企业安全和私营公司不透明性装进了同一个资产。正确方法是用区间视角，而不是假装某一个可比项就能决定答案。也就是说，Nord 应在公开消费者安全可比公司、战略性 VPN
              交易和私营网络安全参考区间之间交叉校准，同时清楚每个比较都只解开部分谜题。
