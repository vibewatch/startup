  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Nord Security 的产品故事足够宽，需要一张地图。最高层面，公司销售四个可见产品，对应不同工作流：NordVPN 面向隐私和安全连接；NordPass 面向凭证、passkey
              和安全笔记；NordLayer 面向企业安全访问和网络控制；NordLocker 面向加密文件存储和共享。这个跨度很重要，因为它把公司推离狭义 VPN 标签。每条产品线内部也有重要模块。NordVPN
              的公开页面突出 Meshnet、Threat Protection、kill switch、Double VPN 和 Dark Web
              Monitor，这些功能合在一起，把体验从「隧道化流量」推向更捆绑的消费者安全工作流。NordPass 增加 Password Health 和 Data Breach Scanner，NordLayer
              则增加属于企业访问控制而非简单连接的姿态和分段功能。共同线索是，Nord 把安全打包进客户能直接执行的工作流，但各条产品线的深度并不相同。NordVPN 显然是最成熟的旗舰，NordLocker
              更像大生态里的支撑性相邻产品。
