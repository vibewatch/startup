      - number: '1.4'
        title: 规模标记、里程碑与负面历史
        blocks:
          - type: paragraph
            body: >-
              Nord Security 发布的公开里程碑足以建立可信增长弧线，但不足以用经审计经营数据消除全部模糊性。2023 年融资公告称，公司在 20 多个市场运营，全球雇佣约 2,000 名专业人员。最新可访问的
              Latka 档案把 2025 年末收入推至 $357M，团队规模约 1.8 千人；这与成熟私营软件公司的方向一致，但方法论并不完全透明，仍需要管理层确认。关于页面补充了战略产品里程碑，称 Nord 在 2024
              年推出 NordStellar、Saily 和 Coveron；2022 年影响报告材料则描述了 Threat Protection、Meshnet、审计、ISO
              认证和漏洞赏金等产品与信任举措。公开记录中最重大的负面事件仍是 2019 年披露的 NordVPN 服务器事件。NordVPN 官方回应和 Engadget 报道都描述了 2018
              年一台租用的芬兰服务器遭未授权访问、没有用户凭证或活动日志被泄露的证据，以及虽有延迟但最终迫使公司加速审计、漏洞赏金和更强基础设施控制的公开披露。该历史不会否定公司的品类领导地位，但很重要，因为信任是 Nord
              品牌的根基。以尽调视角概括，Nord Security 的规模故事是真实的，组合扩张是可见的，负面历史可管理，但对品牌承销高度相关。
