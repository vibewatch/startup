      - number: '4.2'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              单位经济的公开数据远少于定价数据。可访问来源中没有披露 CAC、回本周期、GAAP 毛利率、EBITDA 或自由现金流。因此，最有用的工作是推断。由于 Nord Security
              销售软件订阅和通过网络交付的安全工具，毛利率结构应当比硬件或服务更接近软件。但这不代表成本基础可以忽略。VPN 基础设施、服务器运营、支持、支付、联盟营销、合规和信任投入都重要。业务结构也重要。消费者 VPN
              的切换成本可能低于 NordPass Business 或 NordLayer
              等管理员中心产品，营销敏感度也更高；企业产品耐久性可能更好，但服务和支持开销也略高。因此，公开证据支持软件式经济模型，但不支持干净的利润率模型。这足以论证理论利润率不错，却不足以证明当前效率。
