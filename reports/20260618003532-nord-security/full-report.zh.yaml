chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Nord Security 将自己定位为一家全球数字安全公司，使命是帮助个人和企业重新掌控线上隐私、安全和数据。官网首页把公司框定为不止一个 VPN 品牌；关于页面及相关产品站点显示，组合已经包括
              NordVPN、NordPass、NordLayer、NordLocker，以及 NordStellar、Saily、Coveron
              等新产品。这个组合很关键：它把业务定位为生态系统公司，而不是单点方案。官方历史时间线称，2022 年 Nord 首次成为独角兽，2023 年又完成 $100M 投资轮，2024
              年新增三款数字产品。TechCrunch 和 Tech.eu 的第三方报道与基本公司叙事一致：Nord Security 2012 年创立于立陶宛 Vilnius；大约十年没有机构资本；在引入外部资金前，借
              Nord 品牌做出了消费者和企业安全产品线。当前产品版图也不只面向消费者。NordLayer 展示的是企业网络安全和访问控制动作，NordLocker 与 NordPass
              则支撑相邻的隐私和身份用例，扩大客户生命周期价值，降低单一产品依赖。因此，公开公司材料支持把 Nord Security 描述为一家以 NordVPN 为锚、但已不能被简化为 NordVPN
              的成长期网络安全平台。
