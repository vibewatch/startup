companyProfile:
  summary: >-
    Nord Security was founded in Vilnius in 2012 and built a consumer-privacy franchise around
    NordVPN before expanding into NordPass, NordLayer, NordLocker, and adjacent privacy/security
    products. The company spent roughly a decade bootstrapped before taking external capital,
    which supports a narrative of real product-market fit before institutional funding.
  founders:
    - name: Tomas Okmanas
      role: Co-founder and CEO-level public face
      background: Built Nord Security with founder continuity spanning product, fundraising, and public narrative.
      claimRefs: [CO013, CO014]
    - name: Eimantas Sabaliauskas
      role: Co-founder
      background: Represents founder continuity and product credibility across Nord Security's expansion.
      claimRefs: [CO013, CO015]
  foundingLocation: Vilnius, Lithuania
  headquarters: Vilnius, Lithuania
  productSummary: >-
    Nord Security sells consumer VPN and privacy subscriptions through NordVPN, password
    management through NordPass, business secure access through NordLayer, encrypted storage
    through NordLocker, and several newer adjacent privacy/security tools.
  customerFocus: >-
    Consumer and household privacy buyers plus SMB and enterprise administrators purchasing secure
    access and credential-security workflows.
  businessModel: >-
    Recurring subscription revenue across consumer and business software products, with self-serve
    consumer plans and admin-led business motions.
  stage: Private growth-stage cybersecurity platform
  fundingStatus: >-
    Public funding history shows $100M in 2022 at roughly $1.6B valuation and another $100M in
    2023 at $3B valuation led by Warburg Pincus.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO022, CI001, CI017, CV001]
summary:
  headline: >-
    Nord Security has enough scale, brand strength, and category breadth to merit continued
    diligence, but the current public record still supports research-more rather than buy.
  overallScore: 6.9
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: fair
  keyMetrics:
    valuationUsdM: 3000
    revenueRunRateUsdM: null
    arrUsdM: 357
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 200
    customerCount: 14000000
    headcount: 1800
  topStrengths:
    - >-
      Nord has real scale anchors: a $3B valuation, a widely cited ~$357M ARR proxy, and a long
      runway of product expansion around a strong privacy brand.
    - >-
      The portfolio spans both consumer and business security workflows, giving Nord more optionality
      than a single-product VPN vendor.
    - >-
      Public pricing and product pages support a recurring-revenue business model with visible
      consumer and SMB monetization paths.
    - >-
      The company appears to have reached meaningful scale before taking institutional capital,
      which supports capital-efficiency narratives.
  topRisks:
    - >-
      Trust remains the core risk variable because Nord sells privacy and security promises that are
      difficult for end users to verify directly.
    - >-
      Public disclosure is still too thin on revenue mix, margins, retention, and cap-table rights
      to justify unconditional multiple confidence.
    - >-
      Consumer VPN categories remain exposed to commoditization, discounting, and strategic
      substitution by broader zero-trust or platform-level alternatives.
    - >-
      Historical incident memory and future regulatory scrutiny can magnify the financial impact of
      any future trust failure.
  unresolvedGaps:
    - >-
      Need audited or management-certified revenue mix, gross margin, retention, and cash-generation
      data to support a high-confidence multiple.
    - >-
      Need cap-table rights, preferences, and dilution visibility from the 2022 and 2023 rounds.
    - >-
      Need stronger named enterprise proof and renewal evidence for NordLayer and NordPass Business.
    - >-
      Need clearer evidence on how much valuation rests on consumer VPN versus more durable business
      security expansion.
appendices: null
disclaimer: >-
