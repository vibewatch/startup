    - Demand proxy, not spend or willingness-to-pay.
  - - Zero-trust architecture lens
    - NIST SP 800-207
    - 2020 plus ongoing use
    - Structural shift from perimeter VPNs to user/resource-centric access
    - Problem framing for secure access and network security
