- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver or constraint
  - Direction
  - Evidence
  - Why it matters for Nord
  - Implication
  rows:
  - - Persistent telework and hybrid work
    - Positive
    - BLS telework tables; WFH Research monthly data
    - Sustains need for secure remote access, credential control, and device-independent security
    - Supports NordLayer and NordPass business motions.
  - - Zero-trust migration
    - Mixed but net positive
    - NIST SP 800-207; NCCoE build guidance
    - Expands spend on identity-centric secure access but can displace legacy point VPNs
    - NordLayer can benefit if positioned as a modern access platform.
  - - Cybercrime and identity abuse
    - Positive
    - IC3 2025 report; ITRC breach report
    - Raises awareness and perceived ROI for privacy, monitoring, and identity tools
    - Supports Nord consumer and identity-protection adjacencies.
  - - Regulatory and governance pressure
    - Positive but costly
    - NIS2, GDPR, SEC cyber rules, U.S. privacy-law patchwork
    - Pushes organizations to buy security tools and document controls
    - Supports B2B demand but also raises vendor compliance bar.
  - - Estimate divergence and category blur
    - Negative on precision
    - Axis, VPNPro, legal and regulatory sources
    - Makes a single clean TAM unreliable
    - Use range-based valuation logic instead of one headline market number.
  - - Free tools and bundle substitution
    - Negative on pricing power
    - Consumer category structure and overlapping features
    - Consumers can approximate parts of Nord’s value with cheaper or included tools
    - Requires differentiation beyond basic VPN functionality.
  notes: The same structural trends that grow Nord’s categories also increase competition and analysis uncertainty; both effects should be carried into later valuation work.
