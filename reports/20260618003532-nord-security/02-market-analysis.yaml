tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Why it matters
  rows:
  - - Consumer VPN and privacy software
    - Paid VPN subscriptions, privacy add-ons, threat protection, identity-light bundle features
    - All cybersecurity spend unrelated to privacy or secure access
    - Individual user or household administrator
    - Still the anchor category for NordVPN and the brand halo.
  - - Business secure access and network protection
    - Remote access, network segmentation, cloud firewall, breach monitoring, compliance-friendly access control
    - Unrelated general IT infrastructure and broad managed-security contracts
    - SMB or enterprise IT/security leader
    - This is the clearest NordLayer budget pool.
  - - Password and credential management
    - Personal and business password vaults, admin controls, breach scanning, access sharing
    - Generic productivity apps without credential-security workflows
    - Consumer, SMB admin, identity/security team
    - NordPass expands both consumer and business wallet share.
  - - Identity protection adjacency
    - Dark-web alerts, credit monitoring, identity recovery, cyber extortion cover
    - General insurance or offline fraud products without digital monitoring
    - U.S. consumer or household buyer
    - Coveron shows Nord moving into a higher-trust consumer-security layer.
  - - Broader cybersecurity adjacency
    - Selected privacy, compliance, and governance tooling that can cross-sell into Nord products
    - The entire global cybersecurity market
    - Mixed buyers across many budgets
    - Relevant for strategic narrative but too broad for disciplined TAM.
  notes: 'Boundary rule: include markets where Nord products are directly sold or logically bundled; treat the rest of cyber as adjacency rather than automatic addressable spend.'
