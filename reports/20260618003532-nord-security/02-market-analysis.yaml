    - Architecture framework, not a revenue market-size report.
  - - Identity / breach demand lens
    - IC3 + ITRC
    - '2025'
    - High complaint, loss, and breach-notice volumes
    - Problem intensity for identity, privacy, and account-protection tools
    - high
    - Incident volumes are demand proxies rather than direct product TAM.
  notes: No single public report maps exactly to Nord Security’s mixed consumer-and-business portfolio. The safest view is a multi-lens sizing approach that separates spend pools from problem-volume proxies.
