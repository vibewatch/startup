  evidenceGaps:
  - type: missing-source
    severity: material
    topic: password-manager-tam
    missingEvidence: A high-quality public market report that isolates the password-manager category with methodology transparent enough to map directly onto NordPass business and consumer demand.
    whyItMatters: NordPass is strategically important, but accessible public market reports either over-broaden cybersecurity or sit behind paywalls, which weakens exact TAM modeling.
    diligencePath: Obtain a primary market-research extract or management segmentation materials that isolate password-manager and credential-management spend.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: nord-market-mix
    missingEvidence: Management-level revenue mix by NordVPN, NordLayer, NordPass, identity-protection add-ons, and geography.
    whyItMatters: A layered TAM is useful, but real underwriting needs to know which layers matter most to actual revenue and which remain strategic options only.
    diligencePath: Request product-level revenue mix, customer counts, and pipeline split by consumer versus business products.
    relatedQuestionRefs:
    - QM005
    relatedTableRefs:
    - TM001
    - TM003
