company:
  name: Nord Security
chapter:
  number: 8
  title: Valuation
  summary: Nord Security’s last clear public valuation anchor is $3B against a widely cited but unaudited ~$357M ARR proxy, implying roughly 8.4x revenue. That multiple is plausible for a high-quality late-stage cyber asset, but the public record is still too thin on revenue quality, rights, and durability to justify blind acceptance of the last private mark. The right stance is disciplined interest, scenario-based valuation, and explicit diligence asks before pricing conviction.
sections:
- id: valuation-context-and-thesis
  title: Valuation Context and Thesis
  body: 'Nord Security’s valuation context is unusually clean at the headline level and unusually incomplete underneath. The market knows the key financing anchors: roughly $1.6 billion in 2022, $3 billion in 2023, and around $357 million of later ARR or revenue proxy from secondary databases. That lets investors form an initial price conversation much faster than with most opaque private companies. It also creates the temptation to overstate confidence. The strongest thesis is that Nord is a scaled, recurring-revenue cyber platform with brand power, product breadth, and some business-product expansion upside that goes beyond pure consumer VPN economics. The anti-thesis is that the public record still leaves too much unknown about revenue quality, rights, and sustainability for investors to accept the last headline price uncritically. Valuation should therefore start with context, not conclusion. Investors also need to remember that headline marks are negotiated outcomes, not permanent truths.
    A private round can be both real and stale if later evidence fails to expand or validate the business mix behind it. today.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  tableRefs:
  - TV002
  figureRefs:
