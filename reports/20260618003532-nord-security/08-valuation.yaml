- id: diligence-asks-and-final-verdict
  title: Diligence Asks and Final Verdict
  body: 'The final valuation judgment is that Nord is attractive enough to continue diligencing and not transparent enough to underwrite casually. The main blockers are familiar but material: revenue mix, gross margin, retention, cash generation, and cap-table rights. Exit-readiness also remains ambiguous. Scale and category relevance support future IPO or strategic options, but thin disclosure on economics and preferences makes that option value hard to price today. The right investor behavior is therefore conditional: pursue the asset if management can substantiate revenue quality and rights visibility at an entry price that leaves room for execution and trust risk. Otherwise, the safer interpretation is that the current public record supports admiration more than immediate conviction. Put differently, the last round price is a useful data point, not a substitute for present-tense diligence. More transparency would convert admiration into pricing conviction.'
  claimRefs:
