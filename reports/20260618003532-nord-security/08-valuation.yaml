- id: multiple-logic-and-comparable-set
  title: Multiple Logic and Comparable Set
  body: The simplest valuation math is also the most dangerous. At $3 billion versus roughly $357 million of ARR, Nord sits near an 8.4x multiple. That is directionally meaningful but still depends on a secondary ARR figure rather than audited public reporting. The next step is therefore comparables, and the comp set is necessarily mixed. Gen Digital is useful as a public consumer-security benchmark with transparent market metrics. Kape and the ExpressVPN transaction history are useful as strategic consumer VPN references. Private cybersecurity multiple datasets help frame where late-stage cyber can trade in 2026. But no single comp is perfect because Nord blends consumer privacy, business security, and private-company opacity in one asset. The right method is a range-based lens rather than pretending one comp decides the answer. That means Nord should be triangulated across public consumer-security comps, strategic VPN transactions, and private cybersecurity reference bands, with full awareness
    that each comparison solves only part of the puzzle.
  claimRefs:
  - CV008
  - CV009
