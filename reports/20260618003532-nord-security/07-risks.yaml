  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: dependency-inventory
    missingEvidence: A complete dependency inventory covering infrastructure, critical suppliers, platform exposures, and internal control-testing cadence is not public.
    whyItMatters: Dependency failures can become trust failures quickly in privacy and security products.
    diligencePath: Request architecture dependency maps, vendor risk reviews, and control-test summaries from management.
    relatedQuestionRefs:
    - QR010
    - QR019
    - QR026
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: economic-risk-sensitivity
    missingEvidence: Public sources do not quantify how discounting, compliance cost, or future incidents would affect margins, cash flow, or financing needs.
    whyItMatters: Investors need downside economics, not just qualitative risk labels.
    diligencePath: Request scenario analysis on pricing, incident cost, and compliance burden from management or lead investors.
    relatedQuestionRefs:
    - QR014
    - QR017
    - QR023
    - QR025
    relatedTableRefs:
    - TR004
    - TR005
  - type: private-evidence-only
    severity: moderate
    topic: tr001-regulatory-register
    missingEvidence: Country-by-country operating constraints and detailed legal interpretation for every jurisdiction are not public.
    whyItMatters: VPN and privacy rules vary by market and can affect go-to-market decisions.
    diligencePath: Request jurisdictional compliance summaries and external counsel memos for priority markets.
    relatedQuestionRefs:
    - QR005
    - QR012
    relatedTableRefs:
    - TR001
