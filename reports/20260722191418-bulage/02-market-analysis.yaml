- id: growth-drivers-constraints-and-diligence-gaps
  title: Growth drivers, adoption constraints, and what remains unproven
  body: The growth case is strong at the ecosystem level. China already has the world's largest factory-robot installed base, rising domestic supplier share, heavy state support, and increasingly formalized standards, testing infrastructure, and subsidy regimes. Official and research sources connect embodied-AI demand to labor shortages, rising labor costs, manufacturing upgrading, and the strategic desire to keep AI and robotics value chains in China. Yet the market is still early enough that commercialization risk dominates valuation risk. MERICS finds current humanoids still lack precision and dexterity, are mostly in small-scale site-specific trials, and remain too expensive for mass deployment, with viability thresholds around CNY 160,000 versus reported current averages around CNY 300,000 to CNY 500,000. Multiple adverse sources add that product-market fit remains unclear, some factory deployments are more demo than deal, and the hardest bottleneck is still real-world data and cross-environment
    generalization rather than pure hardware availability. Beijing itself has warned of bubble risk as more than 150 companies crowd the space. Bulage therefore sits inside a market with exceptional strategic momentum but weak public proof on customer ROI, repeat orders, and model-layer monetization. The key diligence question is not whether embodied AI is strategically important in China; it is whether Bulage can convert that national push into a commercially defensible position before the 2027-2028 shakeout that several sources imply.
