  rows:
  - - Embodied model layer
    - World models, embodied brains, control stacks, training systems, corpora, simulation
    - General-purpose text-only LLM applications without physical action loop
    - Robot OEMs, labs, enterprise pilot programs
    - Closest fit to Bulage thesis
  - - General-purpose humanoid robots
    - Humanoid hardware and system integration sold into pilots or deployments
    - Fixed industrial arms and non-embodied automation
    - OEMs, factories, public-sector pilots
    - Important downstream vehicle for Bulage-style software
  - - Embodied data and training infrastructure
    - Real-world data collection, digital twins, pilot testing, compute leasing, corpus services
    - Generic cloud spend not tied to embodied systems
    - Training bases, OEMs, municipal platforms
    - Critical enabling layer for model improvement
  - - Industrial deployment programs
    - Factory inspection, assembly, logistics, material handling, warehouse trials
    - Pure exhibition robots with no operational workflow
    - Manufacturing operations and automation budgets
    - Likely first scaled revenue pool if products work
  - - Service and public-interaction programs
    - Reception, retail, patrol, education, entertainment, eldercare and rehab pilots
    - Consumer gadgets and simple home appliances
    - Malls, venues, SOEs, healthcare institutions, local governments
    - Real but often signaling-driven
  - - Traditional robotics and automation
    - None for core scope; only used as substitute benchmark
    - Conventional industrial robots, AMRs, surgical robots, autonomous driving
    - Existing factory capex owners
    - Substitute and comparison set, not primary market
