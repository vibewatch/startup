  evidenceGaps:
  - type: missing-source
    severity: material
    topic: bulage-sam
    missingEvidence: No free public source isolates the monetizable SAM for a China-based embodied-model startup like Bulage separate from hardware sales, broader user spending, or industry-output targets.
    whyItMatters: Without a clean SAM, investors can underwrite the wrong revenue layer.
    diligencePath: Request Bulage internal market map by customer type, pricing layer, and near-term product scope; validate against pilot pipeline and competitor positioning.
    relatedQuestionRefs:
    - QM024
    - QM026
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: Published 2030 estimates range from $15B for China humanoid external sales to $77B for China embodied-robot user spending and RMB 400B for broader industry scale.
    whyItMatters: Different scopes can produce valuation narratives that look consistent numerically but describe different markets.
    diligencePath: Normalize each estimate by scope, unit, and revenue layer before using it in valuation work.
    relatedQuestionRefs:
    - QM009
    - QM025
  - type: private-evidence-only
    severity: material
    topic: buyer-roi
    missingEvidence: Public sources provide many pilot stories but almost no verified repeat-order, payback-period, or utilization data for embodied deployments in China.
    whyItMatters: The difference between a demo market and a scale market is buyer ROI, not press coverage.
    diligencePath: Obtain signed pilot results, renewal rates, task success metrics, and labor-displacement economics from OEMs and enterprise partners.
    relatedQuestionRefs:
    - QM013
    - QM020
    - QM026
  - type: private-evidence-only
    severity: material
    topic: bulage-go-to-market
    missingEvidence: No public source discloses whether Bulage intends to sell models, licenses, integrated robots, development tools, or custom enterprise deployments first.
    whyItMatters: Route-to-market determines which part of the market tables and valuation lens actually matter.
    diligencePath: Request product roadmap, pricing architecture, target customer list, and any OEM or enterprise design-partner agreements.
    relatedQuestionRefs:
    - QM001
    - QM015
    - QM024
  - type: stale
    severity: moderate
    topic: commercialization-speed
    missingEvidence: Many optimistic 2030-2035 forecasts assume cost declines and technical progress that are not yet evidenced by public repeat-order data in 2026.
    whyItMatters: Forward curves may be directionally right while still overstating near-term monetization speed.
    diligencePath: Re-underwrite the market using 12-24 month deployment milestones rather than long-range shipment curves alone.
    relatedQuestionRefs:
    - QM020
    - QM021
    - QM026
