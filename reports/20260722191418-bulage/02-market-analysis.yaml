company:
  name: Bulage
chapter:
  number: 2
  title: Market Analysis
  summary: 'Bulage sits inside China''s embodied-intelligence and humanoid-robotics market, but the relevant boundary is the model-and-deployment stack rather than all robotics. Public sources support several incompatible sizing lenses: Morgan Stanley sees a $2 billion China humanoid market in 2026 growing to $15 billion by 2030, while broader sources cite $56.5 billion to $77 billion 2030 opportunity lenses for embodied-intelligence spending or industry scale. Buyer evidence shows the market is migrating from research labs and showcase deployments toward manufacturing, logistics, retail, healthcare, and household pilots, yet commercialization remains early because costs, dexterity, data scarcity, and weak repeat-order proof still constrain adoption.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitutes
  body: Bulage should be analyzed against the embodied-intelligence and humanoid-robotics stack rather than against all robotics or all generative AI. Public coverage repeatedly ties the company to world models, embodied brains, and model-driven action in the physical world. That makes the relevant spend broader than a single robot SKU but narrower than China's full automation market. Included spend therefore covers embodied foundation-model development, robot-training data and simulation infrastructure, general-purpose humanoid and wheeled embodied robots used for training or deployment, and pilot programs where OEMs or enterprises pay to test embodied systems in factories, logistics, retail, or service settings. Excluded spend includes conventional fixed industrial robots, warehouse-only AMRs, surgical robots, autonomous driving, and consumer devices such as robot vacuums that do not depend on Bulage's stated embodied-AI thesis. The status-quo substitutes are still human labor, conventional
    task-specific automation, and internal AI or robotics teams at large incumbents. This boundary matters because Bulage has not yet disclosed a product catalog; investors are effectively underwriting a layer of the embodied-AI stack rather than a proven end-market niche.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
