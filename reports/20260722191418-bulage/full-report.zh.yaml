      - number: '8.3'
        title: 情景分析和预期价值
        blocks:
          - type: paragraph
            body: >-
              Bulage 这个阶段，基于里程碑的情景模型比收入倍数模型更站得住脚，因为公开收入仍未知。乐观情形下，Bulage
              证明具身大脑论点能跨机器人本体运行，拿下至少一个高质量工业锚点，并开始像一个值得向上重估的中国本土模型层或部署平台。
              基准情形下，公司用种子资本建立技术可信度和早期试点，但在商业杠杆清晰前仍需要更多资本。悲观情形下，客户证明仍薄，竞争和热度压缩削弱投资者胃口，下一轮融资按更低实际估值发生。


              在这个框架下，当前报道估值仍显得要求很高。最关键的敏感项是具名客户证明、重复预算证据，以及合规或算力依赖不会拖慢商业化的证据。
              这些事实一旦出现，支撑区间可以很快上移。但在它们出现前，预期价值逻辑更该服务于保护下行，而不是追逐上行。
