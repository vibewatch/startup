      - number: '1.2'
        title: 创始人背景与治理不透明
        blocks:
          - type: paragraph
            body: >-
              在概览阶段，Bulage 的可投性几乎全靠创始人支撑。已审阅资料一致认为，Lin Junyang 是新实验室的创始人和对外代表；英文报道也称其为 Justin Lin。他此前担任 Alibaba Qwen /
              通义千问模型项目的技术负责人或核心负责人。对如此年轻的公司来说，创始人画像异常强：公开传记和第三方报道将其出生年份写为 1993 年，提到他毕业于 University of International
              Relations 和 Peking University’s School of Foreign Languages，并梳理了他从 2019 年加入 DAMO Academy 到 2022 年底领导 Qwen
              的 Alibaba 路径。多篇报道还称，他 2025 年在 Qwen 内部搭建机器人与具身智能团队，因此 Bulage
              更像是已孵化研究方向的延续，而不是冷启动。主要反向因素是治理不透明。已审阅材料没有识别出联合创始人名单、已披露董事会构成、独立董事，也没有 Lin 之外的高管梯队。对一家成立数周内以 $2 billion
              估值融资的公司而言，治理披露缺口是实质尽调问题，不是表面瑕疵。
