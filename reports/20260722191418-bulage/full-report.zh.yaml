    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、命名与公开足迹
        blocks:
          - type: paragraph
            body: >-
              2026 年的公开报道一致把 Bulage 视为一家很新的上海主体，而不是已有长期运营史的隐身项目。本次审阅的中文资料将其登记式公司名识别为 Shanghai Bulage Technology Co.,
              Ltd.，写作上海卜拉格科技有限公司；任务简报则给出了另一个写法：布拉格。由于 2026-07-22 可访问的公开资料压倒性使用卜拉格，本章将 Bulage
              作为罗马化标签，并把字面命名差异列为尽调点，而不是直接抹平。公司被描述为成立于 2026-05-27，因此在报告日仍不足一岁。即便按刚成立的前沿 AI 实验室标准，它的公开沟通界面也异常单薄：bulage.cn
              可解析但没有返回可读的公司内容，bulage.com 则托管无关游戏内容，两个域名都没有给投资人提供正常的官方产品、领导层或客户参考页面。这一缺口很重要，因为公司在发布可用官方网页叙事前，已经被定价到独角兽量级。
