      - number: '1.4'
        title: 战略论点、里程碑与眼前尽调旗标
        blocks:
          - type: paragraph
            body: >-
              资料集中对 Bulage 的战略叙事一致：公司面向世界模型，以及服务机器人或其他物理终端的具身大脑。资料描述的方向，是把 AI
              从屏幕内推理推向感知、物理世界建模和行动规划。这个论点解释了为什么公司即便没有公开产品目录、客户 logo
              或已披露收入，仍能与前沿实验室放在同一语境中讨论。它也解释了为什么投资人看重创始人质量和赛道时点，超过当下商业证据。里程碑链条被压得很短：Lin 在 2026 年 3 月初离开 Qwen；5
              月媒体报道他正为新实验室融资，目标估值约 $2 billion；运营主体被报道在 5 月至 6 月注册；到 6
              月中旬，多家媒体称首轮已关闭，管理层正在试探下一轮融资。这种速度有两面性。它制造了即时独角兽身份，但也意味着今天的公开尽调仍更多依赖团队履历和市场叙事，而不是已验证的 PMF。
