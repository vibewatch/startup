      - number: '4.4'
        title: 资本充足性与承销结论
        blocks:
          - type: paragraph
            body: >-
              Bulage 据报道的 $220 million 种子轮按绝对值很大，但周边证据表明，这只是起点，不是财务充足性的证明。Figure 单轮融资 $675 million，用于加速 AI
              训练、制造和部署。Agility 正推进一笔总收益超过 $620 million 的交易，同时称已有超过 $300 million 的多年订单和 30 多个客户管线。UBTECH 做到 RMB2.0
              billion 收入后，仍报告大额亏损和大量 R&D 需求。1X 融资 $100 million，仍把家庭部署描述为持续建设。共同模式是：该品类在稳定盈利可见前，会长时间消耗资本。


              因此，承销结论偏谨慎。Bulage 可能有足够现金支持核心研究、早期硬件迭代，以及一个或多个试点项目，但公开证据不足以承销收入质量、毛利率、烧钱速度、营运资本需求或现金跑道。如果 Bulage
              打算打造全栈人形机器人平台，资本负担很可能包括算力、数据采集、原型迭代、安全工程、制造搭建、部署支持和伙伴集成。如果它打算做 OEM
              中立模型层，成本基数可能更轻，但仍取决于能否证明真实任务表现。无论哪条路径，当前估值更多压在期权价值上，而不是已披露财务牵引力上。
