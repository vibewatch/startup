      - number: '5.3'
        title: 数据、仿真、安全与依赖
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年公开技术语料给出的最醒目教训是：具身智能既是模型问题，也是数据和安全问题。AGIBOT World 2026 通过突出异构真实世界数据、自由式遥操作、全身控制、多模态感知和 1:1
              数字孪生，把这一点讲得很直接。NVIDIA Isaac Lab 和 GR00T 则从平台侧做了同样的事，强调可规模化机器人学习工作流和 sim-to-real 迁移。DeepMind 的 Gemini
              Robotics 1.5 和 π0 都显示，更宽的预训练只有经过大量具身数据适配后才变得有用。UBTECH 的 Thinker
              和年报语言展示了类似的中国框架：空间智能、时间理解、世界模型和工业机器人协作，都离不开数据质量与全栈执行。


              安全和信任位于这张依赖图之上。NVIDIA Halos 把物理 AI 描述为需要全栈安全 OS、检查制度、标准对齐和外部监控。SCIO 的标准工作和 MERICS
              的政策研究说明了这在中国为何重要：机器人正在进入工厂、门店、医院和家庭，可靠性与安全不再是可选附加项。Bulage 目前没有公开展示自己的安全、隐私、质量或支持控制，这是一项产品技术风险，而不只是披露脚注。
