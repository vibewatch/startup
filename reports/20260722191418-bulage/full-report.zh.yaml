            body: >-
              Bulage 的公开客户记录实际上仍是空白。官网没有客户页面、案例库、合作伙伴故事、定价或试用流程，也没有部署参考。2026 年 6 月把 Bulage
              头条估值立起来的融资报道，也没有填上这个缺口；它描述的是创始人背景和世界模型 / 具身大脑论点，但没有识别出具名客户、试点地点、设计伙伴或付费工作流。也没有买方证言、采购线索或用户引语，能说明 Bulage
              已经改善任何生产任务。这意味着客户尽调的起点结论是负面但重要的：目前尚无公开证据表明 Bulage 已把技术故事转化为真实买方关系。


              这个缺口在 2026 年比一年前更重要，因为参照组已经具体得多。Agility 和 GXO 公开描述从试点到付费部署的路径。BMW 公开报告其 Figure 试点的运行小时数和组件数量。Hyundai
              公开列出分阶段 Atlas 部署计划。UBTECH 公开点名多家汽车和制造业客户。AGIBOT 和 KEENON 展示出更清晰的买方分层和商业化界面。Bulage
              可能仍太年轻，不适合广泛披露，但投资人不应把这种可能性误认为实际客户证明。
