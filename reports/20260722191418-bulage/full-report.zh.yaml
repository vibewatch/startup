      - number: '6.3'
        title: 留存、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              整个人形机器人领域的留存证据仍然稀少，Bulage 更是一片空白。已审阅来源没有披露 Bulage 的 NRR、GRR、流失率、续约率、合同期限、扩张收入，甚至没有第一个公开客户
              logo。即便是证据更强的同行，公开客户材料仍偏向首次部署公告，而不是长期账户经济性。 Agility 的 GXO 案例值得注意，正是因为它披露了 2023 年底试点后签下多年协议；BMW 的 Figure
              披露也值得注意，因为它发布了运营产出，而不是证明长期续约。 UBTECH 具名工厂案例强于多数同行，但即便如此，公开队列耐久度仍弱于部署广度。已审阅来源没有显示 Bulage
              在客户现场的上线、培训、支持或服务责任归属。


              Bulage 成立时间太短，这会放大客户集中问题。最早一批客户很可能会过度影响融资叙事、背书质量和产品迭代。如果首批账户集中在某个创始人网络、某个 OEM
              或某个地区，公司在更广泛买方出现前，可能看起来比真实情况更强。
              因此，严谨判断应先要求客户验证里程碑，再为采用买单：具名试点、部署范围、任务频次、正常运行时间、用户责任归属，以及至少一些重复预算或扩张信号。落到执行，就是要材料，不要口号。
