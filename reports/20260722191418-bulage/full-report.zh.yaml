  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局类型与 Bulage 的起点
        blocks:
          - type: paragraph
            body: >-
              Bulage 不是进入一场只同另一家初创公司正面竞争的整齐赛道。相关的 2026 年购买格局至少横跨三类玩家加上现状替代品。第一类是全栈具身 AI 实验室，试图同时掌握机器人和控制栈；公开代表包括
              Figure、1X、AGIBOT、Unitree、UBTech、Agility 和 Boston
              Dynamics。第二类是工业在位企业或准在位企业，它们带来服务、安全、制造和部署经验，这些不是新实验室一夜之间能买来的。第三类是中国规模优先的竞争者，它们未必已拥有最强公开模型叙事，但已经有价格锚、供应链杠杆和出货动能。现状替代品仍是任务专用自动化、人力和内部系统集成。


              Bulage 起跑时有一个不可否认的优势，也有一个同样实质的短板。优势是资本加创始人履历：据报道的 $220 million 种子轮和 $2 billion
              估值，给了它快速招聘、训练模型和购买硬件的资源。短板是披露与证明。与本章几乎所有具名同行相比，Bulage
              在官方界面上没有公开产品页、没有发布包装、没有客户故事，也没有经验证的部署记录。这意味着公司目前更多是在用论点竞争——世界模型和具身大脑——而不是用可观察的商业执行竞争。市场正从 demo
              走向狭窄但真实的工厂、物流和开发者部署，这个缺口很重要。
