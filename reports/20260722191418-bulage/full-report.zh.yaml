      - number: '8.4'
        title: 建议和最后尽调问题
        blocks:
          - type: paragraph
            body: >-
              证据支持的建议是继续研究。若要给出买入判断，要么入场价格显著更低，要么当前价格下证据显著更强。Bulage 完全可能变得重要；问题是公开尽调还无法判断，公司只是前景诱人，还是已经开始复利增长。
              因此，建议质量必须对价格敏感。估值更低时，同一组证据或许足以支持投机性跟踪。按当前报道价格，更干净的立场是：估值偏紧、信心中等、风险高。


              要改变这个判断，需要补的工作也很清楚。投资者需要具名客户或伙伴部署、任务级运营指标、产品范围清晰度，以及后续资本究竟是可选项还是必然项的判断。
              这些不是细枝末节的缺口，而是世界模型故事与可投投资论证之间缺失的桥。在 Bulage 搭起这座桥之前，最聪明的姿态是有纪律的好奇，而不是确信。
