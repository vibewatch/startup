  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              分析 Bulage，应把它放在具身智能与人形机器人栈里，而不是拿它对标所有机器人或所有生成式 AI。公开报道反复把公司与世界模型、具身大脑、以及物理世界中的模型驱动行动绑定。因此，相关支出比单一机器人 SKU
              更宽，但比中国整个自动化市场更窄。应纳入的支出包括具身基础模型研发、机器人训练数据与仿真基础设施、用于训练或部署的通用人形和轮式具身机器人，以及 OEM
              或企业付费在工厂、物流、零售或服务场景测试具身系统的试点项目。应排除的支出包括传统固定式工业机器人、仅限仓储的 AMR、手术机器人、自动驾驶，以及不依赖 Bulage 所称具身 AI
              论点的扫地机器人等消费设备。现状替代品仍是人力、传统任务专用自动化，以及大型在位企业的内部 AI 或机器人团队。这个边界很重要，因为 Bulage 尚未披露产品目录；投资人实际上是在承销具身 AI
              栈中的一层，而不是一个已验证的终端市场细分。
