      - number: '3.3'
        title: 中国规模领导者：价格、吞吐与组件杠杆
        blocks:
          - type: paragraph
            body: >-
              如果西方玩家定义了公开前沿叙事，中国赛场则定义了近期商业化压力。Unitree 是最清晰的公开价格锚，因为它明示 G1 起价 $13,500，同时推进能力更强的全尺寸 H1
              系列，并声称对电机、减速器、控制器、LiDAR 和算法有强内部控制。TrendForce 补上了关键信号：据称 Unitree 招股书显示，2025 年人形机器人收入超过四足机器人，综合毛利率 60%，并规划
              75,000 台人形机器人产能。AGIBOT 给出另一套同样重要的模板：多样化机器人形态、大型具身数据集计划，以及 Omdia 支持的 2025 年 5,168 台人形机器人出货、全球份额 39% 的说法。


              UBTech 位于这两种模式之间。它更显眼地聚焦工业集成、大模型辅助决策、工厂系统连接和换电式续航。更广泛地看，TrendForce、CNBC、SCIO、MERICS
              和反向投资人报道都指向同一个方向：中国如今的严肃竞争者，远多于围绕单一独角兽叙事所能解释的数量。国内制造商超过 140 家，型号超过 330 个，政府也明确推动接口标准化并加速工业部署。因此，Bulage
              面对的不只是几个知名 logo，而是一个正在压缩实验室原型、供应链规模化与商业可读产品包装之间距离的本土市场。
