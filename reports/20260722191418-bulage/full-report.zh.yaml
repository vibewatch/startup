      - number: '8.2'
        title: 可比公司组及其含义
        blocks:
          - type: paragraph
            body: >-
              最相关的直接估值参照，是私有人形机器人融资轮和交易估值锚点，而不是成熟工业上市公司。Figure 和 Agility 有参考意义，因为它们在野心和市场热度上足够接近，能说明投资者愿意为 AI
              叙事、机器人叙事和客户证明的组合支付多少。 Apptronik 有参考意义，因为它显示，一旦真实企业关系可见，战略资本可以进入到什么规模。1X 是有用的低证据可比对象，尽管它的家庭场景角度不同。
              这些可比对象说明，私募资本仍愿意在盈利前为巨大上行提供资金。


              上市公司组的价值在另一个层面。ABB、Rockwell、FANUC、Teradyne 和 Intuitive 展示了机器人或自动化公司达到持久收入、装机基础、监管披露和投资者报告深度之后，估值可以长成什么样。
              因此，这些公司是天花板参照，不是入场价格辩护。若只指向 $40-180B 的上市市值、却不承认这些数字下面压着几十年的证据，就无法为 Bulage 当前估值辩护。
