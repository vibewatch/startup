      - number: '2.4'
        title: 增长驱动、采用约束与仍未证明的事
        blocks:
          - type: paragraph
            body: >-
              从生态层面看，增长逻辑很强。中国已经拥有全球最大的工厂机器人装机基数、上升中的国产供应商份额、强力国家支持，以及越来越正式的标准、测试基础设施和补贴体系。官方与研究资料把具身 AI
              需求同劳动力短缺、劳动力成本上升、制造业升级，以及把 AI 和机器人价值链留在中国的战略意愿相连。但市场仍足够早，商业化风险压过估值风险。MERICS
              发现，当前人形机器人仍缺乏精度和灵巧性，大多停留在小规模、场地定制化试验，且对大规模部署来说仍太贵；商业可行阈值约 CNY 160,000，而报道中的当前均价约 CNY 300,000 至 CNY
              500,000。多份反向资料还指出，PMF 仍不清晰，一些工厂部署更像 demo 而不是成交，最难的瓶颈仍是真实世界数据和跨环境泛化，而非单纯硬件可得性。北京方面也已警示泡沫风险，因为已有 150
              多家公司挤入该领域。因此，Bulage 所在市场战略动能极强，但在客户 ROI、复购和模型层变现上公开证明仍弱。关键尽调问题不是具身 AI 在中国是否有战略重要性，而是 Bulage 能否在多份资料暗示的
              2027–2028 洗牌前，把国家级推动转化成商业上可防守的位置。
