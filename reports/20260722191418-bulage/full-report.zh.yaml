  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 公开收入模型：已知与未知
        blocks:
          - type: paragraph
            body: >-
              Bulage
              的公开财务界面几乎是空白。官方域名仍没有可读的产品、定价或客户细节，而推动公司独角兽叙事的融资报道，重点放在创始人履历、估值和世界模型论点上，不在订单或收入上。这意味着第一步分析是负面的，而不是肯定的：公开资料没有基础断言
              Bulage 是机器人销售商、模型授权方、企业软件厂商、集成承包商，或四者的某种组合。公司未来可能通过硬件、软件、部署服务、维护和数据工具的任意组合变现，但先后顺序没有披露。


              同行证据很重要，因为它显示这个品类里财务上可读的收入层长什么样。Agility 强调的部署栈包括机器人硬件、工作流软件和支持。UBTECH
              的报告把人形机器人产品与服务同其他机器人产品和硬件设备分开。Research and Markets 的 2026 年行业报告明确把软件、系统集成和维护列为更宽市场的一部分，而不只是机器人 ASP。换句话说，即便
              Bulage 自身模式尚不清楚，公开证据也表明人形机器人变现通常是打包且运营很重。任何简单的 SaaS 式解读都缺乏支持。
