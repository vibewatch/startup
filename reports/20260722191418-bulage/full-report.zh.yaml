      - number: '3.4'
        title: 护城河耐久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              公开证据还不足以支持“人形机器人护城河已经在任何地方锁定”的强主张，更不用说
              Bulage。家庭优先玩家仍需证明安全、低接触支持和可复用效用。工业优先玩家仍面对任务范围窄、定制集成重的负担。中国规模优先玩家受益于更低硬件成本和政策支持，但仍要面对泛化、数据稀缺和进口高端组件瓶颈。因此，来自
              KrASIA、Yicai 和 Unite.ai 的反向报道很重要，因为它们认为估值膨胀跑在已验证 PMF 前面。换句话说，品类是真的，但护城河故事往往讲得太早。


              对 Bulage 来说，竞争含义很直接。当 Unitree 能公布价格锚、AGIBOT 能引用出货领先、UBTech 能引用订单和工厂部署、Agility 或 Boston Dynamics
              能指向服务能力和具名企业工作流时，融资本身不是护城河。可持续的 Bulage 护城河需要在四个地方之一显现：在高价值任务上有独特有用的具身模型表现；通过 OEM
              中立软件层更快部署；经济性强于全栈对手；或形成别人难以低成本复制的专有伙伴 / 数据飞轮。上述几点目前都没有公开证据。竞争结论因此不是 Bulage 不可能赢，而是举证责任几乎全部还在前方。
