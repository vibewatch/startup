      - number: '3.2'
        title: 西方参照玩家：模型、安全与服务
        blocks:
          - type: paragraph
            body: >-
              西方参照组分成两种不同的竞争肌肉。Figure 和 1X 主打具身智能与家庭泛化。Figure 的公开叙事是，搭载 Helix 的 Figure 03
              能在不可预测的家庭环境中移动，拿起数千种新的家用物体，并最终把语言条件行为扩展到狭窄脚本之外。1X 讲的是一条相近但更柔和的故事：NEO
              面向家庭，设计上轻且安静，但对于它不知道的任务，仍依赖专家引导路径。这些公司对 Bulage 重要，因为它们是最清晰的公开基准，支撑“模型质量和数据闭环可以成为人形机器人主要护城河”这一主张。


              Agility 和 Boston Dynamics 则锚定光谱另一端。它们的优势不是宏大的 AGI 叙事，而是部署纪律。Agility 把 Digit、工作流软件和现场支持组合起来，并在测试或部署主张中公开点名
              Amazon、GXO、Schaeffler、Toyota Motor Manufacturing Canada 和 Mercado Libre。Boston Dynamics
              更明确地说，家庭不是正确的首发市场，因为安全标准、成本和能力仍不成熟。这给 Bulage
              设下了不舒服的基准：即便模型能力正在成为头条故事，今天看起来最真实的买方，仍在奖励服务、安全、工作流适配和现场可靠性，而不只是前沿模型野心。
