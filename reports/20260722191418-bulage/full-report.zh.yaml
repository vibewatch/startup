  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与公开界面
        blocks:
          - type: paragraph
            body: >-
              相比估值，Bulage 的公开产品定义仍薄得多。官网没有可读产品文档、模块列表、信任页面、API 或开发者入口，也没有路线图。主要公开描述来自媒体报道：Lin Junyang
              的新公司聚焦世界模型和具身大脑。这是有意义的战略方向，但还不是产品地图。它没有说明 Bulage
              销售的是一体化人形机器人、第三方机器人的控制栈、训练数据管线、开发者工具，还是定制部署。因此，正确的产品技术框架要从缺口开始：Bulage 有主题，但没有可公开检查的产品。


              周边赛场说明，公开产品定义通常可以具体得多。Figure 展示面向家庭的人形机器人界面和很深的 Helix 技术叙事。AGIBOT 发布多种机器人形态和开放数据集计划。UBTECH
              发布工业产品页、年报中的架构语言，以及开源 Thinker 模型。NVIDIA、DeepMind 和 Physical Intelligence
              都展示了行业如何收敛到显式栈：推理模型、行动策略、仿真、数据管线、硬件和安全基础设施相结合。Bulage 还没有揭示自己位于这套栈的哪个位置。
