      - number: '4.3'
        title: 成本结构、单位经济性与可比公开结果
        blocks:
          - type: paragraph
            body: >-
              这个市场中最好的公开成本与利润窗口来自 UBTECH，因为它已经上市。其 2025 年年报说明，哪怕收入已经出现，人形机器人承销仍是资本密集型。收入增长 53.3% 至 RMB2.0
              billion，毛利翻倍以上，人形机器人产品与服务成为最大分部，收入 RMB820.6 million。但净亏损仍有 RMB789.8 million，R&D 消耗 RMB507.5
              million；公司看起来从容，只是因为多轮融资后现金升至接近 RMB4.9 billion。这是 Bulage 应吸收的可比教训：商业进展不会自动意味着轻资产或自我造血模式。


              更宽行业证据也强化了这一点。MERICS 认为，许多中国人形机器人当前平均成本仍为 RMB300,000–500,000，并引用约 RMB160,000 的商业可行阈值，对应两年 ROI 场景。SCIO
              和标准化推进意味着成本下降应来自模块化与互操作性，但这些是未来助推器，不是当下事实。换句话说，在有吸引力的单位经济性得到证明前，该品类的公开数字仍显示沉重的工程、数据、制造和服务负担。Bulage
              今天没有披露这些项目中任何一项的数据。
