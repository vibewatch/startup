      - number: '5.2'
        title: 参考架构与具身模型栈
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年具身 AI 披露中最清晰的技术模式，是高层推理与低层控制分层。Figure 的 Helix 把较慢的推理 VLM 与快速视觉运动控制器分开。DeepMind 的 Gemini
              Robotics 1.5 把具身推理模型与 VLA 执行器配对。Physical Intelligence 的 π0 使用预训练 VLM，加上在广泛机器人数据上训练的 flow-matching
              行动头。NVIDIA 的 GR00T 平台再把这种模式变成通用生态供给：基础模型、开放数据、仿真、中间件和部署硬件。这些架构重要，因为它们说明“世界模型”或“具身大脑”在真实出货系统中可能到底意味着什么。


              它们也让 Bulage 当前披露缺口更刺眼。如果 Bulage
              做的是模型层公司，行业已经期待它回答跨具身迁移、推理延迟、遥操作或模仿数据、仿真和硬件抽象。如果它做的是全栈机器人，期待会进一步扩大到机械操作、电池与热管理、现场可靠性，以及对人安全的运行。早期保持安静本身没有错，但公开资料也没有基础假定
              Bulage 已经把这套栈中的任何具体环节做得好过如今已有充分文档的参考组。
