      - number: '7.3'
        title: 运营、商业和人才风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，最大挑战是 Bulage 还没有发布足以让投资者判断公司类型的材料：它究竟是模型层公司、机器人产品公司，还是重集成的部署业务。
              公开可靠性记录、公开安全论证、公开质量看板、隐私姿态和公开伙伴图谱都不存在。也就无法区分可管理的早期不透明和真正的控制缺口。商业侧又放大了问题。
              证据更充分的同行显示，即便成功部署，仍然是分阶段、烧资本、服务强度高。UBTECH 的公开业绩仍在亏损。Agility 即便有订单，也需要巨额融资。Figure 和 Hyundai 说明，工业落地需要时间。
              AGIBOT 和 UBTECH 还说明，竞争压力现在不只来自产品 demo，还来自公开部署证据。


              人才风险同样重要。Bulage 的公开身份仍集中在 Lin Junyang 和创始人故事上。公司如果不披露运营、合规、制造、销售和客户成功梯队，商业化复杂度上升时，就可能过度依赖一个小核心团队。
              年轻机器人公司最先遇到的隐性瓶颈，往往就是执行深度。
