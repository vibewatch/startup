      - number: '7.2'
        title: 监管、法律和地缘政治敞口
        blocks:
          - type: paragraph
            body: >-
              Bulage 所在的 AI 栈位置，法律和地缘政治敞口可能比收入扩张更快。中国已经围绕数据来源、个人信息、内容处理、透明度和安全评估，监管面向公众的生成式 AI 服务。 欧洲正在落地基于风险分级的 AI
              Act；系统一旦触及安全、劳动或受监管产品场景，义务就会加重。欧盟和美国的出口管制框架同样重要，因为具身 AI 公司依赖软件、技术协助、芯片和算力基础设施；即便机器人本体在本地制造，这些要素也可能跨司法辖区流动。
              这些框架都不说明 Bulage 眼下已被卡住。风险在于，公司公开合规控制面很少，可能只有在尝试大规模销售、境外融资、跨境合作或接入客户运营时，才发现这些义务。


              法律先例也有参考价值。专业律所的行业 M&A 材料反复强调机器人交易中的监管审批。这并不是说 Bulage 现在有交易麻烦，而是说明周边行业只是转移资产和伙伴关系，就已经需要法律基础设施。 对一家有前沿 AI
              野心的上海创业公司来说，这是实打实的提醒：跨境增长可能比种子轮叙事暗示的更慢，也更贵。
