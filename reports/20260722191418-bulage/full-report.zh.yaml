        title: 成熟度、路线图与技术结论
        blocks:
          - type: paragraph
            body: >-
              公开成熟度在赛场内并不均匀。Figure、DeepMind、NVIDIA、Physical Intelligence、AGIBOT、UBTECH 和 Unitree
              都至少展示了一层可检查内容：产品页、技术报告、数据集发布、仿真框架、开放 repo，或与标准相连的安全材料。其中一些主张可能仍有愿景成分，但它们给尽调留下了可挑战的界面。相比之下，Bulage
              几乎没有提供这些东西。没有公开模块图、公开发布里程碑、公开开发者社区，也没有公开集成、可靠性或支持证据。


              这并不意味着 Bulage 的策略无效。事实上，行业技术方向说明，如果一家公司能在不同机器人身体和任务之间泛化，同时把推理、安全和集成保持在可管理范围内，OEM
              中立具身大脑仍有空间。但这仍是假设，不是已展示产品。因此，技术结论是有条件的：Bulage
              的方向与前沿演进一致，但在公开透明度和证明标准上，明显落后于同行已经设定的基线。在公司披露栈选择、合作伙伴、安全控制和若干任务级表现证据前，应把它的产品技术案例视为有前景但未验证。
