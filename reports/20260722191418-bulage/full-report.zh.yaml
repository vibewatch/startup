      - number: '2.3'
        title: 今天谁买、谁用、谁真正付钱
        blocks:
          - type: paragraph
            body: >-
              具身 AI 的买方分层仍在过渡期。Interact Analysis 把应用分成八个桶，从学术
              R&D、机器人训练，到娱乐、制造、仓储、公共服务和家庭用途。反向证据显示，最早的真实买方往往是研究实验室；较新的客户画像虽然出现，但仍偏弱，包括把机器人放进大堂或展陈场景、主要追求示范价值而非替代劳动力的国企。即便如此，已审阅官方资料也显示支出下一步想往哪里走：上海政策框架优先支持物流、工业制造、商业零售、医疗康复和家政服务；杭州国家级试点基地已在
              30 多个职业场景运行 130 多台机器人；WAIC 公开报道指向工厂、门店和家庭中的快速试验。实践中，付款方通常是
              OEM、工厂运营方、国家支持的试点项目、地方政府平台或大型企业预算负责人，而不是终端消费者。运营买方可能是制造
              VP、自动化负责人、实验室负责人或公共部门创新办公室。用户随场景变化：工厂里的操作员和流程工程师、训练场景的数据采集技术员，以及零售和接待场景的服务人员或访客。对 Bulage
              来说，最可信的近期客户因此不是家庭消费者，而是寻求具身模型、训练系统或早期部署能力的机器人厂商或标杆企业。
