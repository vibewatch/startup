  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格与证据
        blocks:
          - type: paragraph
            body: >-
              Bulage 报道中的约 $2B 估值，只能理解为给期权价值定价，而不是给已披露运营证据定价。公开来源仍没有说明收入、具名客户、产品架构、任务级部署指标，或重复使用的可靠证据。
              它们能确认的是创始人履历、大额种子轮、诱人的市场主题，以及一个投资者仍在竞相下注人形机器人和具身 AI 叙事的赛道。这组要素可以产生真实价值，但也意味着当前价格更多由可能性支撑，而不是可验证牵引力。


              这个区别很重要，因为同行数据现在设下了比一年前更高的门槛。Figure 把估值与 BMW 和 Helix 绑定。Agility 把估值与订单和客户数量绑定。 Apptronik 把大额融资与
              Mercedes-Benz、GXO、Jabil 以及生产型机器人叙事绑定。UBTECH 和 AGIBOT 说明，中国同行至少愿意发布收入、出货或部署信号。 按这个标准看，Bulage
              的账面估值并非离谱，但它显然跑在了公开证据曲线前面。
