        - 未披露与里程碑计划匹配的烧钱速度或现金续航
        - 后续融资需求会实质改变当前公允价值
        - 索取走到下一轮融资或盈亏平衡里程碑的经营计划
      - - 治理与合规
        - 隐私、安全和 AI 治理没有公开责任人或路线图
        - 监管和客户尽调最终都会要求这些材料
        - 索取治理材料包和辖区合规地图
    notes: 上述要求是最低证据集；只有拿到它们，才能在接近报道估值的水平上，从好奇推进到有信心。
    claimRefs:
      - CV002
      - CV003
      - CV031
      - CV034
      - CV040
