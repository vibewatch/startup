  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险图景
        blocks:
          - type: paragraph
            body: >-
              Bulage 的风险画像不寻常：几乎所有重大尽调问题都同时悬而未决。公司成立不到一年，公开叙事绑定在雄心勃勃的具身大脑论点上；在展示具名客户、公开安全控制或运营指标之前，报道估值已达数十亿美元。
              这并不证明业务弱，但意味着外部证据还无法给下行封顶。真正的投资判断难题，是不确定性叠加：合规负担、算力访问、客户证明和烧钱速度各自重要，又会相互强化。


              行业背景让这组风险更难忽视。同行现在披露分阶段工厂部署、工业案例页面、交易级融资，以及越来越正式的合规语境。与此同时，分析师和行业观察者提醒，商业化热度可能跑在持久价值前面。 因此，投资者应把 Bulage
              风险章节当成排序练习，而不是泛泛的免责声明列表。严重度最高的风险，是那些会同时伤害商业化、融资和估值叙事的风险：控制面缺失、出口管制与工具链依赖、资金需求强烈，以及证据落后于同行。
