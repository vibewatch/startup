      - number: '7.4'
        title: 缓释因素、监控和止损标准
        blocks:
          - type: paragraph
            body: >-
              明显的缓释因素也存在。Bulage 拿到了规模很大的种子轮弹药，站上及时的市场主题，创始人叙事也足够强，能快速吸引顶级资本。 更大的行业也在验证几件事：具身 AI
              确实有客户，工厂可以成为标杆现场，标准工作正在成熟。这些都是实打实的正面因素。但它们还不是 Bulage 自身的缓释因素，因为公司还没有展示自己真正掌握哪些控制、客户或工作流。
              现阶段的缓释故事，更像期权价值，而不是已验证的流程纪律。


              因此，监控负担必须说清楚。投资者应要求具名客户证明、合规负责人和路线图、算力与工具链依赖的清晰说明，以及一些公开或私下的安全与可靠性证据。
              如果这些材料迟迟不出现，正确反应不是无限期等市场继续兴奋，而是用严得多的标准重做估值判断。下面的止损标准不是泛泛的谨慎信号；它们是让 Bulage 继续处在可投区间的最低里程碑。
