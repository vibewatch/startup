      - number: '2.2'
        title: 用多重视角做市场规模，而非只看一个 TAM
        blocks:
          - type: paragraph
            body: >-
              公开资料支持几组真实但互不兼容的规模口径。CNBC 报道的 Morgan Stanley 2026 年 6 月报告称，中国人形机器人市场 2026 年约 $2 billion，当年外部销售出货 50,000
              台，到 2030 年升至 $15 billion 和 446,000 台。TrendForce 另行预测，中国人形机器人产量将在 2026 年增长 94%，并称 2026 年下半年是行业商业化拐点。China
              Economic Net 引用了更宽口径估算：Development Research Center 预测中国具身智能产业到 2030 年达 RMB 400 billion，2035 年超过 RMB 1
              trillion；另有 IDC 估算，中国用户在具身智能机器人上的支出 2025 年已超过 $1.4 billion，到 2030 年可能达 $77 billion。来自 Omdia
              的出货报道又给出一个视角：2025 年全球通用具身机器人出货约 13,318 台，2035 年预测为 2.6 million 台。这些数字不应揉成一个头条
              TAM，因为它们测量的是不同范围：外部人形机器人销售、用户支出、更宽的具身智能产业产值，以及全球出货。正确结论不是市场精确等于某一个数，而是中国已经是该品类的量级中心；但像 Bulage
              这样的模型层初创公司，其经济上真正相关的 SAM 仍无法从免费公开资料中单独剥离。
