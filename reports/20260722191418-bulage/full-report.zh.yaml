      - number: '1.3'
        title: 融资、估值与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              资本故事是 Bulage 登上 2026 年前沿实验室地图的核心事实。Crunchbase News 明确称，公司是一家总部位于上海的机器人智能初创公司，完成由 Gaorong Capital 和 HSG 领投的
              $220 million 种子轮，估值 $2 billion。中文报道对轮次标签说法不一——首轮、天使轮，或泛称数亿美元融资——但反复指向同一组已披露出资：Gaorong 和 HongShan / Sequoia
              China 各 $100 million，Tencent $20 million。这些具名出资合计 $220 million，与 Crunchbase 的数字一致；MarketScreener 称公司获得
              HongShan、Gaorong、Tencent 和“其他投资者”融资，则留下了仍有未披露参与方的可能。公开报道还称，Lin 在 2026 年 5 月至 6 月控制一组新注册主体，包括 100% 持股的
              Yuyong、99% 持股的上海 Bulage Technology，以及一家通过 Bulage
              关联的管理合伙企业。这一结构显示，围绕融资快速搭建了实体，但公开资料仍未披露股权比例、投资人治理权、清算条款或董事席位分配。
