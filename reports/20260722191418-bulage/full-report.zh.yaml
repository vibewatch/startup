      - number: '4.2'
        title: 定价、变现与销售周期代理
        blocks:
          - type: paragraph
            body: >-
              人形机器人公开定价记录很薄，但已有片段很有提示性。Unitree G1 起价 $13,500，提供了少见的低端公开锚。Research and Markets 的 2026
              年中国报告随后给出更宽的工业价格阶梯：低端系统 RMB100,000–200,000，中端系统 RMB250,000–500,000；一旦加入软件、集成和维护，更宽市场继续扩大。1X 对 NEO 给出 $200
              订金信号，但没有完整消费端或企业端 ASP。Agility、Figure 和 UBTECH 披露能力、客户、订单或融资，却仍把真实定价保密。


              这种不透明对 Bulage 有两层含义。第一，可能的销售动作更像咨询式、按里程碑推进，而不是自助式。Agility
              的文件和投资人材料谈的是多年订单、部署承诺和客户管线，不是无摩擦的经常性订阅。第二，即便公开价格锚不完整，心理上仍有影响。一家未披露包装的种子阶段公司，最终会被放进一个已有参照的赛场：Unitree
              设定低标价基准，工业同行则用工作流集成、安全、正常运行时间和服务来证明更高总合同价值。Bulage 还没有显示自己会落在这条连续谱的哪里。
