companyProfile:
  summary: Bulage is a Shanghai embodied-intelligence startup formed in May 2026 by Lin Junyang, the former technical lead and public face of Alibaba's Qwen/Tongyi Qianwen model effort. Public reporting describes the company as pursuing world models and an embodied brain for robots or other physical endpoints, but the official site exposes almost no readable product, governance, customer, or financial detail. By mid-June 2026, Chinese and English reporting said Bulage had already completed a roughly $220 million seed or first round at about a $2 billion valuation, making it one of the most aggressively priced new humanoid/robotics AI labs in China despite very limited public operating proof.
  foundedDate: '2026-05-27'
  founders:
    - name: Lin Junyang
      role: Founder
      background: Former Alibaba DAMO/Qwen technical lead who built and led key parts of the Tongyi Qianwen effort before leaving in early 2026 to start Bulage.
      claimRefs: [CO008, CO011, CO012, CO013]
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: Publicly, Bulage is defined mainly as a world-model / embodied-brain company rather than as a disclosed robot SKU, software module, or deployment platform. No readable official product docs, roadmap, developer surface, safety stack, or customer case studies were found on the company website.
  customerFocus: Not publicly disclosed; the available narrative implies future enterprise robotics, robot-OEM, or industrial deployment use cases rather than consumer software.
  businessModel: Not publicly disclosed. Public evidence does not yet reveal whether Bulage plans to monetize via robot hardware, model/software licensing, deployment services, or a bundled full-stack offering.
  stage: Seed-stage private (formed May 2026; first round reported closed June 2026)
  fundingStatus: Reported ~$220M seed / first round at a ~$2B valuation in June 2026, led by Gaorong and HSG/HongShan with Tencent named in Chinese-language reporting.
  disclosureProfile: private-undisclosed
  claimRefs: [CO003, CO004, CO007, CO008, CO011, CO012, CO020, CO021, CO023, CE001, CE002, CI001, CU003]
