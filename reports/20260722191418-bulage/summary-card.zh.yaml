  topStrengths:
    - 创始人与市场匹配度很强：Lin Junyang 直接来自 Alibaba Qwen 体系，在中国新一代具身 AI 实验室里技术履历最清晰。
    - 据报道约 $220M 的种子 / 首轮融资，让 Bulage 有资源做产品、招人、推进早期试点，不必马上承受再融资压力。
    - 品类时点顺风：2026 年，具身 AI、人形机器人和工业机器人智能在中国及全球私募市场都进入高关注窗口。
    - 如果 Bulage 真能做成 OEM 中立的具身大脑层，而不是又一家机器人整机 OEM，上行空间可能有战略级别。
  topRisks:
    - 公开验证仍极薄：未找到具名客户、收入、产品架构或已披露部署指标。
    - 据报道 $2B 估值相比 Figure、Agility、Apptronik、UBTECH 等证据更充分的可比公司，已经跑在 Bulage 披露证据前面。
    - 公司仍很年轻，治理和披露不透明：董事会、联合创始人梯队、投资人权利、股权结构表、烧钱速度、现金跑道都缺少公开视图。
    - 这个赛道仍重资本、也暴露于地缘风险，出口管制、算力、安全和商业化风险都还没关闭。
  unresolvedGaps:
    - 具名客户、试点或部署证据，以及任务级运营结果。
    - 清晰产品边界：模型层、机器人栈、服务业务，还是混合模式。
    - 烧钱速度、现金跑道、招聘计划，以及后续融资是可选还是不可避免。
