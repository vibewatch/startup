  rows:
  - - Integrated robot sale
    - None disclosed
    - Unitree, UBTECH, and Agility all monetize around robot deployments
    - Possible but unverified
    - Hardware revenue alone can be low-quality without service or repeat orders
    - Request first product package, bill of materials, and target ASP
  - - Model / software license
    - None disclosed
    - Agility and UBTECH both frame software/platform value alongside hardware
    - Possible but unverified
    - Could be attractive if OEM-neutral and high gross margin, but there is no evidence yet
    - Request software architecture, pricing metric, and attach assumptions
  - - Integration / deployment services
    - None disclosed
    - Agility Arc and UBTECH factory integration imply service-heavy launches
    - Likely category norm
    - Service revenue can validate demand but may compress margins
    - Request pilot SOWs, implementation staffing, and acceptance criteria
  - - Maintenance / support
    - None disclosed
    - Research and Markets includes maintenance in broader market sizing
    - Likely category norm
    - Important for uptime and retention, but can be labor intensive
    - Request support obligations, SLA design, and field-service plan
  - - Data / tooling / developer workflows
    - None disclosed
    - Peers monetize capability indirectly through data flywheels or developer-facing hardware
    - Unknown
    - Could strengthen margins over time, but evidence is absent
    - Request whether Bulage sells tools, APIs, or only integrated outcomes
  notes: The table distinguishes what the category can monetize from what Bulage has actually disclosed. Today, the latter is still effectively blank.
