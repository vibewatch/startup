  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: bulage-revenue
    missingEvidence: No free public source discloses Bulage's revenue, bookings, contracted pilots, or recognized-revenue policy.
    whyItMatters: Without basic revenue data, it is impossible to test growth, revenue quality, or whether the business is still pre-commercial.
    diligencePath: Request monthly revenue, bookings by customer, and revenue-recognition rules for any pilot or delivery contract.
    relatedQuestionRefs:
    - QI001
    - QI022
  - type: private-evidence-only
    severity: material
    topic: bulage-margin-and-burn
    missingEvidence: No public source discloses Bulage's gross margin, cash burn, headcount cost, compute spend, or runway.
    whyItMatters: Capital adequacy cannot be judged from a funding headline alone.
    diligencePath: Request latest cash balance, trailing three-month burn, 12-18 month operating budget, and gross-margin assumptions by revenue stream.
    relatedQuestionRefs:
    - QI020
    - QI022
  - type: private-evidence-only
    severity: material
    topic: contract-structure
    missingEvidence: There is no public evidence showing whether Bulage would bill by robot, by pilot, by software seat, by service contract, or by milestone.
    whyItMatters: Different contract structures produce radically different revenue quality and working-capital needs.
    diligencePath: Obtain a sample MSA/SOW, acceptance milestones, payment schedule, and any maintenance or warranty obligations.
    relatedQuestionRefs:
    - QI002
    - QI019
    - QI022
  - type: conflicting-data
    severity: moderate
    topic: price-bands
    missingEvidence: Public price anchors span very low developer-style devices and much higher industrial ROI thresholds, making cross-company pricing comparisons noisy.
    whyItMatters: A low sticker price can obscure support burden, while a high industrial price can include integration and maintenance.
    diligencePath: Normalize competitor pricing into hardware-only, bundled-service, and lifecycle-cost views before drawing conclusions.
    relatedQuestionRefs:
    - QI008
    - QI009
    - QI010
  - type: stale
    severity: moderate
    topic: capital-requirements
    missingEvidence: Humanoid financing conditions and unit economics are moving quickly in 2026, so even recent peer financing can go stale fast.
    whyItMatters: Bulage's runway sufficiency depends on the next 12 months of technical and commercial proof, not on historical rounds alone.
    diligencePath: Refresh peer orders, new financings, and component-cost trends before any valuation decision.
