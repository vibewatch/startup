chapter:
  number: 4
  title: Financials
  summary: 'Bulage''s public financial record is almost entirely opaque: no revenue, pricing, margin, or customer data is disclosed, so the company cannot be underwritten on current operating performance. Peer filings and official materials point to a more capital-intensive reality than the seed headline alone suggests: humanoid monetization is usually bundled across hardware, integration, support, and software, while even scaled players such as UBTECH remain loss-making and Agility and Figure are still raising or planning very large amounts of capital to fund deployment.'
sections:
- id: public-revenue-model-what-is-and-is-not-known
  title: 'Public revenue model: what is and is not known'
  body: |-
    Bulage's public financial surface is almost blank. The official domain still provides no readable product, pricing, or customer detail, while the funding coverage that drove the company's unicorn narrative focuses on founder pedigree, valuation, and the world-model thesis rather than on bookings or revenue. That means the first analytical step is negative rather than affirmative: there is no public basis to say Bulage is a robot seller, a model licensor, an enterprise software vendor, an integration contractor, or some mix of all four. The company may eventually monetize through any combination of hardware, software, deployment services, maintenance, and data tooling, but the order of operations is undisclosed.

    Peer evidence matters because it shows what financially legible revenue layers look like in this category. Agility emphasizes a deployment stack that includes robot hardware, workflow software, and support. UBTECH's reporting separates humanoid products and services from other robot products and hardware devices. Research and Markets' 2026 industry report explicitly treats software, system integration, and maintenance as part of the broader market, not just robot ASP. In other words, even before Bulage's own model is known, the public evidence says humanoid monetization is usually bundled and operationally heavy. Any simple SaaS-style reading would be unsupported.
