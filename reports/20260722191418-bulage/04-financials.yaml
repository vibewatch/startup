- id: cost-structure-unit-economics-and-comparable-results
  title: Cost structure, unit economics, and comparable public results
  body: |-
    The best public cost-and-margin window in this market comes from UBTECH because it is already public. Its 2025 annual results show why humanoid underwriting remains capital intensive even after revenue shows up. Revenue rose 53.3% to RMB2.0 billion, gross profit more than doubled, and humanoid products and services became the largest segment at RMB820.6 million. Yet net loss still remained RMB789.8 million, R&D consumed RMB507.5 million, and the business only looks comfortable because cash rose to nearly RMB4.9 billion after repeated capital raises. That is the right comparable lesson for Bulage: commercial progress does not automatically mean a light or self-funding model.

    The broader industry evidence reinforces this. MERICS argues that many China humanoids still cost RMB300,000-500,000 on average and cites a commercial-viability threshold of roughly RMB160,000 for a two-year ROI case. SCIO and the standards push imply cost declines should come through modularization and interoperability, but those are future enablers rather than present facts. Put differently, the category's public numbers still show heavy engineering, data, manufacturing, and service burden before attractive unit economics are proven. Bulage has no disclosed data for any of those line items today.
