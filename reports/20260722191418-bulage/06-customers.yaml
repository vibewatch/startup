  - - GXO x Agility
    - Logistics operator
    - Digit tote movement and warehouse workflow integration
    - Pilot converted into multi-year paid deployment
    - Best public proof that a humanoid can move from pilot to customer-site revenue
    - Robot count, contract value, and long-term renewal terms are still private
  - - BMW x Figure
    - Automotive OEM
    - Sheet-metal handling in Spartanburg body shop
    - Pilot with concrete operating outputs and further use-case evaluation
    - More than 30,000 X3 supported and more than 90,000 components moved
    - Public economics and scaling pace remain undisclosed
  - - Hyundai x Boston Dynamics
    - Automotive OEM
    - Atlas sequencing and future assembly work at HMGMA / Georgia plant
    - Real-work testing plus phased rollout plan
    - Strong strategic customer signal from parent company integration
    - Main scale-up is future-dated to 2028 and beyond
  - - UBTECH automotive accounts
    - Automotive / industrial OEMs
    - Handling, assembly, inspection, and factory logistics
    - Multiple named industrial application cases
    - Broadest named China factory-account list in the reviewed set
    - Per-account utilization, retention, and economics are not public
  - - KEENON service scenarios
    - Medical / hospitality / service operators
    - Healthcare station, lounge bar, and branded beverage service
    - Demo-heavy scenario proof
    - Shows buyer segmentation and human-facing workflow positioning
    - Still weaker than a disclosed long-running production deployment
  notes: Each row is grounded in at least two retained sources or a retained source pair plus a corroborating official context page. Bulage remains the only row with no positive public proof.
