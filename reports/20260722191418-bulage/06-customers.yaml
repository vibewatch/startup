  summary: Bulage still has no public named-customer or deployment proof, so its customer chapter is mainly an exercise in measuring the gap between its current disclosure surface and the proof standard already visible across humanoid peers. The strongest public buyer evidence in this sector now comes from industrial deployments such as Agility/GXO, Figure/BMW, Hyundai/Boston Dynamics, and UBTECH's automotive accounts, while service and consumer-facing channels remain earlier-stage and retention disclosure remains thin even for better-documented peers.
sections:
- id: public-customer-surface-and-proof-gap
  title: Public customer surface and the proof gap
  body: |-
    Bulage's public customer record is still effectively blank. The official site exposes no customer page, no case-study archive, no partner stories, no pricing or trial flow, and no deployment references. The June 2026 financing coverage that established Bulage's headline valuation also does not solve that gap; it describes founder background and the world-model / embodied-brain thesis, but it does not identify a named customer, pilot site, design partner, or paying workflow. There is also no buyer testimonial, procurement breadcrumb, or user quote indicating that Bulage already improves any production task. That means the starting conclusion for customer diligence is negative but important: there is no public evidence yet that Bulage has converted its technical story into a real buyer relationship.

    That absence matters more in 2026 than it would have a year earlier because the reference set has become much more explicit. Agility and GXO publicly describe a pilot-to-paid deployment path. BMW publicly reports operating hours and component counts from its Figure pilot. Hyundai publicly lays out a phased Atlas deployment plan. UBTECH openly names multiple automotive and manufacturing accounts. AGIBOT and KEENON expose clearer buyer segmentation and commercialization surfaces. Bulage may still be too young for wide disclosure, but investors should not confuse that possibility with actual customer proof.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU006
  - CU030
  tableRefs:
