- id: peer-buyers-and-adoption-patterns
  title: Peer buyers and adoption patterns
  body: |-
    The peer evidence shows that humanoid customer formation is splitting into several distinct paths. One path is industrial automation, where logistics operators and auto OEMs are willing to tolerate integration complexity in exchange for labor substitution, safety improvement, or process consistency. Agility/GXO, Figure/BMW, Hyundai/Boston Dynamics, and UBTECH's automotive examples all live in that bucket. A second path is service and hospitality, where KEENON demonstrates medical, lounge, and branded beverage-service scenarios. A third path is direct-sale or developer-style surface, where Unitree and 1X make buyer targeting legible even without fully disclosed enterprise retention metrics.

    For Bulage, this peer map is useful because it reveals what is still missing. There is no public statement on whether Bulage is pursuing warehouse operators, auto OEMs, retail chains, hospitals, robot OEMs, or software-licensing partners. There is no disclosed channel strategy, no production geography, and no public proof of workflow fit. In other words, the category is starting to show real buyer shapes, while Bulage still presents mostly as a thesis waiting for its first publicly inspectable customer motion.
