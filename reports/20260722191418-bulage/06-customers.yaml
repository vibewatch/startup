  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / proof quality
  - Revenue / strategic value
  - Gap
  rows:
  - - Bulage undisclosed target account
    - Unknown buyer, unknown operator, unknown budget owner
    - Undisclosed embodied-AI workflow
    - No public named account proof
    - Could be strategic if tied to OEMs or major enterprises
    - No customer segmentation is publicly disclosed
  - - Logistics / warehouse operator
    - COO, automation lead, site manager
    - Tote movement, handoff, repetitive warehouse work
    - Strongest public proof via Agility/GXO
    - Validates paid deployment plus workflow software and service
    - Bulage has no comparable warehouse proof
  - - Automotive / industrial OEM
    - Plant operations, manufacturing engineering, quality leaders
    - Sequencing, handling, assembly, inspection
    - Strong proof via BMW, Hyundai, and UBTECH factory cases
    - Large-volume accounts can become anchor references and training grounds
    - Bulage has no named factory customer
  - - Service / healthcare / hospitality operator
    - Venue operator, medical administrator, service manager
    - Reception, delivery, medical assistance, beverage service
    - Early-stage scenario proof via KEENON
    - Broadens TAM but evidence is more demo-oriented
    - Bulage has not shown a service-sector wedge
  - - Direct-sale / developer / prosumer buyer
    - Individual developer, lab, SMB integrator
    - Robot evaluation, early access, experimentation
    - Visible at Unitree and 1X
    - Fastest route to top-of-funnel demand and community signal
    - Bulage has no public purchase or waitlist path
  - - China industrial ecosystem buyer
    - OEM partner, supplier, local government-backed operator
    - Scenario deployment and expansion
    - Visible in AGIBOT and UBTECH commercialization narratives
    - Can create fast deployment density inside one geography
    - Bulage has no public geographic customer footprint
  notes: Rows separate the buyer shapes visible in the current humanoid market from what Bulage has actually disclosed, which is still almost nothing.
