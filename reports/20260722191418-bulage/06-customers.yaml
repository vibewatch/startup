  enumerationScope:
    coverage: sample
    basis: Sample of the strongest public named-account proofs relevant to Bulage likely buyer paths, plus a null Bulage row that shows the current disclosure gap.
  columns:
  - Customer / account
  - Segment
  - Deployment / use case
