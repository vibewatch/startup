- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - First flagship industrial account
    - One-logo narrative dependence
    - A single visible customer could dominate Bulage's credibility and product roadmap
    - Ask for full pipeline by vertical, not only the flagship name
  - - Founder-network or investor-introduced pilots
    - Relationship concentration
    - Can create fast early wins but overstate broad market pull
    - Map introductions by investor, founder, and partner
  - - China-first manufacturing deployments
    - Geographic concentration
    - May accelerate learning but leave overseas demand, compliance, and service capacity untested
    - Request customer geography, export plan, and service footprint
  - - OEM-neutral embodied-brain strategy
    - Integration concentration
    - Bulage may depend on a small number of hardware or OEM partners to reach users
    - Request signed OEM or integrator relationships and exclusivity terms
  - - Category hype and commercialization timing
    - Procurement friction and stalled expansions
    - Robotics enthusiasm can outrun real repeat budget and safety readiness
    - Reconcile any bookings story with actual task frequency, uptime, and expansion purchase orders
  notes: This table isolates the main ways a first-customer story can look stronger than the actual durability of demand.
