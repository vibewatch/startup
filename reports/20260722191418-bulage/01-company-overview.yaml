  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Full post-round capitalization table, investor percentages, board seats, and side-letter rights remain undisclosed.
    whyItMatters: A $2 billion post-money overview is hard to judge without governance and ownership economics.
    diligencePath: Request financing documents, cap table, board consents, and shareholder agreements.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: No public revenue, customer, headcount, or signed deployment metrics were found in the fetched source set.
    whyItMatters: Without operating metrics, investors cannot benchmark whether the valuation reflects commercial traction or only founder pedigree.
    diligencePath: Obtain management KPI pack, customer pipeline, employment roster, and product roadmap.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: official-communications
    missingEvidence: The company provided no readable official website content, product pages, or press releases accessible via bulage.cn on the run date.
    whyItMatters: Thin official communication increases identity risk and makes later diligence depend on third-party press summaries.
    diligencePath: Request an official deck, company fact sheet, press release archive, and confirmation of corporate domains.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: minor
    topic: round-label
    missingEvidence: Public sources vary between seed, angel, and generic first-round terminology for the same June 2026 financing.
    whyItMatters: Round classification affects peer comparison and stage benchmarking even if valuation and named checks are directionally aligned.
    diligencePath: Confirm the company’s own round label and financing chronology with management or financing counsel.
    relatedQuestionRefs:
    - QO012
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: No public board roster, cofounder slate, or succession plan was available for review.
    whyItMatters: Founder concentration is extreme for a company already capitalized at unicorn scale.
    diligencePath: Request governance documents, board composition, and an executive org chart.
