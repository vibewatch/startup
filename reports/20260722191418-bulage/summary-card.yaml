  topStrengths:
    - >-
      Founder-market fit is unusually strong: Lin Junyang comes directly from Alibaba's Qwen effort and is one of the
      clearest technical pedigrees among new China embodied-AI labs.
    - >-
      The reported ~$220M seed/first round gives Bulage meaningful resources to build product, hire, and pursue early
      pilots before immediate financing pressure.
    - >-
      Category timing is favorable: 2026 has become a high-attention year for embodied AI, humanoids, and industrial
      robot intelligence in both China and global private markets.
    - >-
      If Bulage really becomes an OEM-neutral embodied-brain layer rather than a me-too robot OEM, the upside could be
      strategically large.
  topRisks:
    - >-
      Public proof is still extremely thin: no named customers, no revenue, no product architecture, and no disclosed
      deployment metrics were found.
    - >-
      The reported $2B valuation appears ahead of Bulage's disclosed proof level relative to Figure, Agility, Apptronik,
      UBTECH, and other better-documented peers.
    - >-
      Governance and disclosure opacity are material for such a young company: no public board, cofounder bench,
      investor rights, cap-table detail, burn, or runway view is available.
    - >-
      The category remains capital intensive and geopolitically exposed, with export-control, compute, safety, and
      commercialization risks all still open.
  unresolvedGaps:
    - Named customer, pilot, or deployment evidence with task-level operating outcomes.
    - 'Clear product scope: model layer, robot stack, services business, or hybrid.'
    - Burn, runway, hiring plan, and whether follow-on capital is optional or inevitable.
    - Governance package including board composition, investor rights, and senior leadership bench.
    - Safety, privacy, and compliance controls for real-world embodied-AI deployment.
