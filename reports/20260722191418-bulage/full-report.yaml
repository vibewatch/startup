      - number: '3.2'
        title: Western reference-setters on models, safety, and service
        blocks:
          - type: paragraph
            body: >-
              The western reference set splits along two different competitive muscles. Figure and 1X market embodied
              intelligence and home generalization. Figure's public story is that Figure 03, powered by Helix, can
              navigate unpredictable home environments, pick up thousands of novel household objects, and eventually
              scale language-conditioned behavior beyond narrow scripts. 1X tells a parallel but softer-edged story: NEO
              is meant for the home, is designed to be light and quiet, and still relies on an expert-guided path for
              tasks it does not know. These companies matter to Bulage because they are the clearest public benchmarks
              for the claim that model quality and data loops can become the main moat in humanoids.


              Agility and Boston Dynamics anchor the opposite end of the spectrum. Their edge is not a grand AGI
              narrative but deployment discipline. Agility combines Digit, workflow software, and on-site support, and
              it publicly names Amazon, GXO, Schaeffler, Toyota Motor Manufacturing Canada, and Mercado Libre across
              testing or deployment claims. Boston Dynamics is even more explicit that home is the wrong first market
              because safety standards, cost, and capabilities remain immature. That creates an uncomfortable benchmark
              for Bulage: even if model capability is becoming the headline story, the buyers that appear most real
              today still reward service, safety, workflow fit, and field reliability rather than just frontier-model
              ambition.
