      - number: '2.2'
        title: Market sizing through multiple lenses, not one TAM
        blocks:
          - type: paragraph
            body: >-
              The public source set supports several real but incompatible sizing lenses. Morgan Stanley's June 2026
              note, as reported by CNBC, sizes China's humanoid robot market at about $2 billion in 2026, with 50,000
              external-sales shipments this year, rising to $15 billion and 446,000 units by 2030. TrendForce separately
              forecasts China's humanoid output will grow 94% in 2026 and says the second half of 2026 is the sector's
              commercialization inflection point. China Economic Net cites still broader estimates: a Development
              Research Center projection of RMB 400 billion for China's embodied-intelligence industry by 2030 and more
              than RMB 1 trillion by 2035, plus an IDC estimate that user spending on embodied intelligent robots in
              China exceeded $1.4 billion in 2025 and could reach $77 billion by 2030. Omdia-derived shipment reporting
              provides another lens, with global general-purpose embodied robot shipments at about 13,318 units in 2025
              and a 2.6 million-unit 2035 forecast. These figures should not be blended into one headline TAM because
              they measure different scopes: external humanoid sales, user spending, broader embodied-intelligence
              industry output, and global shipments. The right conclusion is not that the market is precisely one size,
              but that China is already the volume center of the category while the exact economically relevant SAM for
              a model-layer startup like Bulage remains unisolated in free public sources.
            claimRefs:
