              path is industrial automation, where logistics operators and auto OEMs are willing to tolerate integration
              complexity in exchange for labor substitution, safety improvement, or process consistency. Agility/GXO,
              Figure/BMW, Hyundai/Boston Dynamics, and UBTECH's automotive examples all live in that bucket. A second
              path is service and hospitality, where KEENON demonstrates medical, lounge, and branded beverage-service
              scenarios. A third path is direct-sale or developer-style surface, where Unitree and 1X make buyer
              targeting legible even without fully disclosed enterprise retention metrics.


