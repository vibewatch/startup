      - number: '7.3'
        title: Operational, commercial, and people risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, the biggest challenge is that Bulage has not yet published the artifacts that would let
              investors judge whether the company is a model-layer venture, a robotics product company, or an
              integration-heavy deployment business. There is no public reliability record, no public safety case, no
              public quality dashboard, no privacy posture, and no public partner map. That means there is no way to
              separate manageable early-stage opacity from a genuine control gap. The commercial side compounds the
              problem. Better-documented peers show that even successful deployments remain staged, capital hungry, and
              service intensive. UBTECH's public results still show losses. Agility needs very large financing despite
              orders. Figure and Hyundai demonstrate that industrial rollouts take time. AGIBOT and UBTECH also show
              that competitive pressure now includes public deployment proof, not just product demos.


              People risk matters too. Public Bulage identity is still concentrated around Lin Junyang and the founder
              story. Without a disclosed bench across operations, compliance, manufacturing, sales, and customer
              success, the company risks depending too heavily on a small core team just as commercialization complexity
              rises. For a young robotics company, execution depth is often the first hidden bottleneck.
