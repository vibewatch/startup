  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price versus proof
        blocks:
          - type: paragraph
            body: >-
              Bulage's reported ~$2 billion valuation can be understood only as a price on option value, not as a price
              on disclosed operating proof. Public sources still do not identify revenue, named customers, product
              architecture, task-level deployment metrics, or reliable evidence of repeat usage. What they do identify
              is a founder pedigree, a large seed round, a compelling market theme, and a category in which investors
              are still racing to back humanoid and embodied-AI narratives. That combination can produce real value, but
              it also means the current price is supported more by possibility than by verifiable traction.


              This distinction matters because peer data now sets a higher bar than a year earlier. Figure couples
              valuation with BMW and Helix. Agility couples it with orders and customer count. Apptronik couples large
              funding with Mercedes-Benz, GXO, Jabil, and a production robot narrative. UBTECH and AGIBOT show that
              Chinese peers are at least willing to publish revenue, shipment, or deployment signals. By that standard,
              Bulage is not wildly out of range on headline valuation—but it is clearly ahead of its public proof curve.
            claimRefs:
