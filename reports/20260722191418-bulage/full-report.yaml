      - number: '7.2'
        title: Regulatory, legal, and geopolitical exposure
        blocks:
          - type: paragraph
            body: >-
              Bulage sits in a part of the AI stack where legal and geopolitical exposure can grow faster than revenue.
              China already regulates public generative-AI services around data provenance, personal information,
              content handling, transparency, and security review. Europe is implementing a risk-based AI Act whose
              obligations become heavier when systems touch safety, labor, or regulated-product contexts. Export-control
              frameworks in the EU and U.S. also matter because embodied-AI companies depend on software, technical
              assistance, chips, and compute infrastructure that can cross jurisdictions even when the robot itself is
              built locally. None of these frameworks proves Bulage is currently blocked. The risk is that a company
              with little public compliance surface can discover those obligations only when it tries to sell broadly,
              raise abroad, partner across borders, or integrate into customer operations.


              The legal-precedent evidence is also instructive. Sector M&A materials from specialist law firms
              repeatedly emphasize regulatory approvals in robotics transactions. That does not say Bulage is in
              transaction trouble now; it says the surrounding industry already needs legal infrastructure just to move
              assets and partnerships. For a Shanghai startup with frontier-AI ambitions, that is a real warning that
              cross-border growth can become slower and costlier than the seed-round narrative implies.
            claimRefs:
