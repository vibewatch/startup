      - number: '8.4'
        title: Recommendation and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The evidence-supported recommendation is research-more. A buy call would require either a materially lower
              entry price or materially stronger proof at the current price. Bulage may absolutely become important; the
              problem is that public diligence cannot yet tell whether the company is merely promising or already
              compounding. Recommendation quality therefore has to be price-sensitive. At a lower valuation, the same
              proof set might justify a speculative track posture. At the currently reported price, the cleaner stance
              is that valuation is stretched, confidence is medium, and risk is high.


              The work needed to change that call is also clear. Investors need a named customer or partner deployment,
              task-level operating metrics, product-scope clarity, and a view on whether follow-on capital is optional
              or inevitable. Those are not minor missing details. They are the missing bridge between a world-model
              story and an investable underwriting case. Until Bulage provides that bridge, the smartest posture is
              disciplined curiosity rather than conviction.
