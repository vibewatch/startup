      - number: '7.4'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              There are some obvious mitigants. Bulage has a very large seed-round war chest, a timely market theme, and
              a founder narrative strong enough to attract top-tier capital quickly. The broader field is also
              validating that embodied-AI customers exist, that factories can become reference sites, and that standards
              work is maturing. Those are real positives. But they are not yet Bulage-specific mitigations, because the
              company has not shown which controls, customers, or workflows it actually owns. In practice, the current
              mitigation story is more option value than verified process discipline.


              That is why the monitoring burden needs to be explicit. Investors should demand named customer proof, a
              compliance owner and roadmap, clarity on compute and toolchain dependencies, and some public or private
              evidence of safety and reliability. If those do not materialize, the right response is not to wait
              indefinitely for the market to stay enthusiastic. It is to re-underwrite the valuation on a much stricter
              basis. The kill criteria below are therefore not generic caution flags; they are the minimum milestones
              needed to keep Bulage in an investable zone.
