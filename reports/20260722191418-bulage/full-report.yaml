      - number: '1.4'
        title: Strategic thesis, milestones, and immediate diligence flags
        blocks:
          - type: paragraph
            body: >-
              The strategic pitch attached to Bulage is consistent across the source set: the company is oriented toward
              world models and an embodied brain for robots or other physical endpoints. Sources describe an attempt to
              move AI from screen-bound reasoning toward perception, physical-world modeling, and action planning. That
              thesis explains why the company can be discussed in the same sentence as frontier labs despite having no
              public product catalog, customer logos, or disclosed revenue. It also explains why investors appear to be
              underwriting founder quality and category timing more than current commercial evidence. The milestone
              chain is compressed: Lin left Qwen in early March 2026, press reports surfaced in May that he was
              fundraising for a new lab at roughly a $2 billion target valuation, the operating entities were reported
              as registered from May to June, and by mid-June multiple outlets said the first round had already closed
              and that management was sounding out a next financing. This speed cuts both ways. It created immediate
              unicorn status, but it also means public diligence today still rests more on team pedigree and market
              narrative than on demonstrated product-market fit.
