      - number: '1.1'
        title: Identity, naming, and public footprint
        blocks:
          - type: paragraph
            body: >-
              Public 2026 coverage consistently treats Bulage as a very new Shanghai entity rather than a stealth
              project with a long operating history. Chinese-language sources reviewed for this run identify the
              registered-style company name as Shanghai Bulage Technology Co., Ltd. written as 上海卜拉格科技有限公司, while the
              assignment brief supplied the alternate rendering 布拉格. Because the public-source record accessed on
              2026-07-22 overwhelmingly uses 卜拉格, this chapter treats Bulage as the Romanized label and flags the
              character-level naming discrepancy as a diligence point rather than normalizing it away. The company was
              described as founded on 2026-05-27 and therefore remained less than one year old on the report date. Its
              public communication surface is unusually thin even for a fresh frontier-AI lab: bulage.cn resolves but
              returns no readable corporate content, and bulage.com hosts unrelated game content, so neither domain
              gives investors a normal official product, leadership, or customer reference page. That absence matters
              because the company has already been valued at unicorn scale before publishing a usable official web
              narrative.
