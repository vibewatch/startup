  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Bulage should be analyzed against the embodied-intelligence and humanoid-robotics stack rather than
              against all robotics or all generative AI. Public coverage repeatedly ties the company to world models,
              embodied brains, and model-driven action in the physical world. That makes the relevant spend broader than
              a single robot SKU but narrower than China's full automation market. Included spend therefore covers
              embodied foundation-model development, robot-training data and simulation infrastructure, general-purpose
              humanoid and wheeled embodied robots used for training or deployment, and pilot programs where OEMs or
              enterprises pay to test embodied systems in factories, logistics, retail, or service settings. Excluded
              spend includes conventional fixed industrial robots, warehouse-only AMRs, surgical robots, autonomous
              driving, and consumer devices such as robot vacuums that do not depend on Bulage's stated embodied-AI
              thesis. The status-quo substitutes are still human labor, conventional task-specific automation, and
              internal AI or robotics teams at large incumbents. This boundary matters because Bulage has not yet
              disclosed a product catalog; investors are effectively underwriting a layer of the embodied-AI stack
              rather than a proven end-market niche.
