      - number: '6.3'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Retention evidence is still sparse across the whole humanoid field, and it is nonexistent for Bulage. No
              reviewed source disclosed Bulage NRR, GRR, churn, renewal rate, contract length, expansion revenue, or
              even a first public logo. Even among stronger peers, public customer material is still weighted toward
              first deployment announcements rather than longitudinal account economics. Agility's GXO case is notable
              precisely because it discloses a late-2023 pilot followed by a multi-year agreement; BMW's Figure
              disclosure is notable because it publishes operating outputs, not because it proves long-term renewals.
              UBTECH's named factory cases are stronger than most, but even there public cohort durability remains
              thinner than deployment breadth. No reviewed source shows Bulage onboarding, training, support, or service
              ownership at customer sites.


              That creates a concentration problem for a company as young as Bulage. Its earliest customers are likely
              to matter disproportionately for financing narrative, reference quality, and product iteration. If those
              first accounts cluster around one founder network, one OEM, or one geography, the company could look
              stronger than it really is until a broader buyer set emerges. The disciplined read is therefore to demand
              customer-proof milestones before underwriting adoption: named pilots, deployment scope, task frequency,
              uptime, user ownership, and at least some signal of repeat budget or expansion. In practice, that means
              asking for artifacts, not slogans.
            claimRefs:
              - CU015
              - CU016
              - CU031
