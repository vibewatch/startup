      - number: '3.3'
        title: China scale leaders on price, throughput, and component leverage
        blocks:
          - type: paragraph
            body: >-
              If the western players define the public frontier narrative, the Chinese field defines the near-term
              commercialization pressure. Unitree is the clearest public price anchor because it openly advertises G1
              from $13,500, while also pushing a more capable full-size H1 line and claiming strong internal control
              over motors, reducers, controllers, LiDAR, and algorithms. TrendForce adds the key financial signal:
              Unitree's prospectus reportedly showed humanoid revenue surpassing quadrupeds in 2025, with 60% combined
