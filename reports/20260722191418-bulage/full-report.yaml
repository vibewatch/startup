            body: >-
              The public pricing record across humanoids is thin, but the pieces that do exist are instructive.
              Unitree's G1 starts at $13,500, providing a rare low-end public anchor. Research and Markets' 2026 China
              report then frames a broader industrial price ladder: low-tier systems at RMB100,000-200,000, mid-tier
              systems at RMB250,000-500,000, and a broader market that grows further once software, integration, and
              maintenance are added. 1X provides a $200 deposit signal for NEO, but not a full consumer or enterprise
              ASP. Agility, Figure, and UBTECH disclose capabilities, customers, orders, or funding, yet keep realized
              pricing private.


              That opacity has two implications for Bulage. First, the likely sales motion is consultative and
              milestone-based rather than self-serve. Agility's filings and investor materials talk about multi-year
              orders, deployment commitments, and customer pipelines, not frictionless recurring subscriptions. Second,
              public price anchors still matter psychologically even when they are incomplete. A seed-stage company with
              no packaging disclosed will eventually be judged against a field where Unitree sets a low sticker-price
              benchmark, while industrial peers try to justify higher total contract values through workflow
              integration, safety, uptime, and service. Bulage has not yet shown where it would sit on that continuum.
