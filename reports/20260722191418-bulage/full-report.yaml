companyProfile:
  summary: >-
    Bulage is a Shanghai embodied-intelligence startup formed in May 2026 by Lin Junyang, the former technical lead and
    public face of Alibaba's Qwen/Tongyi Qianwen model effort. Public reporting describes the company as pursuing world
    models and an embodied brain for robots or other physical endpoints, but the official site exposes almost no
    readable product, governance, customer, or financial detail. By mid-June 2026, Chinese and English reporting said
    Bulage had already completed a roughly $220 million seed or first round at about a $2 billion valuation, making it
    one of the most aggressively priced new humanoid/robotics AI labs in China despite very limited public operating
    proof.
