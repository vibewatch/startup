  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              Bulage's risk profile is unusual because almost every major diligence question is still open at the same
              time. The company is less than a year old, publicly associated with an ambitious embodied-brain thesis,
              and reported at a multibillion-dollar valuation before it has shown named customers, public safety
              controls, or operating metrics. That does not prove the business is weak, but it does mean the downside
              cannot yet be bounded by outside evidence. The practical underwriting problem is therefore one of stacked
              uncertainty: compliance burden, compute access, customer proof, and burn all matter individually, yet they
              also reinforce one another.


              The sector backdrop makes that stack harder to ignore. Peer companies now disclose phased factory
              deployments, industrial case pages, transaction-scale financing, and increasingly formal compliance
              context. At the same time, analysts and industry observers warn that commercialization hype can outrun
              durable value. Investors should therefore treat Bulage's risk chapter as a ranking exercise, not a generic
              disclaimer list. The highest-severity risks are the ones that can simultaneously damage commercialization,
              fundraising, and valuation narrative: missing control surface, export-control/tooling dependence, intense
              capital requirements, and proof lag versus peers.
            claimRefs:
              - CR001
              - CR002
