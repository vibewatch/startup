      - number: '1.2'
        title: Founder background and governance opacity
        blocks:
          - type: paragraph
            body: >-
              Bulage’s investability at the overview stage is almost entirely founder-driven. Reviewed sources agree
              that Lin Junyang, also rendered as Justin Lin in English-language reporting, is the founder and public
              face of the new lab after serving as technical lead or core head of Alibaba’s Qwen/Tongyi Qianwen model
              effort. The founder profile is unusually strong for such a young company: public biographies and
              third-party reporting place his birth year in 1993, note degrees from the University of International
              Relations and Peking University’s School of Foreign Languages, and trace his Alibaba path from DAMO
              Academy in 2019 to Qwen leadership by late 2022. Multiple reports also say he set up a robotics and
              embodied-intelligence team inside Qwen in 2025, making Bulage a continuation of an already incubated
              research direction rather than a cold start. The main counterweight is governance opacity. Reviewed
              materials identify no cofounder slate, no disclosed board composition, no independent directors, and no
              senior executive bench beyond Lin. For a company raising at a $2 billion valuation within weeks of
              formation, that lack of governance disclosure is a material diligence gap rather than a cosmetic omission.
