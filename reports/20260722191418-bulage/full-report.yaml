              template: diversified robot forms, a large embodied dataset initiative, and an Omdia-backed claim of 5,168
              humanoid shipments and 39% global share in 2025.


              UBTech sits between those two models. It focuses more visibly on industrial integration,
              large-model-assisted decision making, factory system connectivity, and battery-swapping uptime. More
              broadly, TrendForce, CNBC, SCIO, MERICS, and adverse investor coverage all point in the same direction:
              China now has many more serious competitors than a narrative built around a single unicorn can justify.
              There are over 140 domestic manufacturers, over 330 models, and explicit government effort to standardize
              interfaces and accelerate industrial deployment. Bulage therefore faces not just a few famous logos, but a
              home market that is compressing the distance between lab prototype, supply-chain scaling, and commercially
