      - number: '2.3'
        title: Who buys today, who uses, and who actually pays
        blocks:
          - type: paragraph
            body: >-
              Buyer segmentation in embodied AI is still transitional. Interact Analysis frames eight application
              buckets ranging from academic R&D and robot training to entertainment, manufacturing, warehouse, public
              service, and household uses. The adverse evidence shows that the earliest real buyers were often research
              labs, while a newer but still weak customer profile includes state-owned enterprises that place robots in
              lobbies or exhibition settings for signaling value rather than labor replacement. Even so, reviewed
              official sources show where spending is trying to move next: Shanghai's policy framework prioritizes
              logistics, industrial manufacturing, commercial retail, healthcare and rehabilitation, and household
              services; Hangzhou's national pilot base already runs more than 130 robots across over 30 vocational
              scenarios; and public reporting from WAIC points to rapid experimentation in factories, stores, and homes.
              In practice, the payer is usually an OEM, factory operator, state-backed pilot program, local government
              platform, or large enterprise budget owner rather than an end consumer. The operational buyer may be a
              manufacturing VP, automation director, lab head, or public-sector innovation office. Users vary by
              scenario: operators and process engineers in factories, data-collection technicians in training settings,
              and service staff or visitors in retail and reception settings. For Bulage, the most plausible near-term
              customer is therefore not the household consumer but a robot maker or flagship enterprise seeking embodied
              models, training systems, or early deployment capability.
