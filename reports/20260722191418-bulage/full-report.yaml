      - number: '1.3'
        title: Funding, valuation, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Bulage’s capital story is the central fact that pushed it onto the 2026 frontier-lab map. Crunchbase News
              explicitly described the company as a Shanghai-based robotics-intelligence startup that raised a $220
              million seed round led by Gaorong Capital and HSG at a $2 billion valuation. Chinese-language reports use
              different round labels — first round, angel round, or generic several-hundred-million-dollar financing —
              but repeatedly identify the same disclosed check sizes: $100 million each from Gaorong and
              HongShan/Sequoia China, plus $20 million from Tencent. Those named checks sum to $220 million and
              therefore reconcile with Crunchbase’s figure, while MarketScreener’s wording that the company received
              funding from HongShan, Gaorong, Tencent and “other investors” leaves open the possibility of additional
              undisclosed participants. Public reporting further states that Lin controlled a set of newly registered
              entities from May to June 2026, including 100%-owned Yuyong, 99%-owned Shanghai Bulage Technology, and a
              management partnership linked through Bulage. That structure signals rapid entity formation around
              fundraising, but public sources still do not disclose cap-table percentages, investor governance rights,
              liquidation terms, or board-seat allocation.
