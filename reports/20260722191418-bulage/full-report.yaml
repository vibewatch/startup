      - number: '5.3'
        title: Data, simulation, safety, and dependencies
        blocks:
          - type: paragraph
            body: >-
              The most striking lesson from the public 2025-2026 technical corpus is that embodied intelligence is as
              much a data-and-safety problem as a model problem. AGIBOT World 2026 makes this explicit by foregrounding
              heterogeneous real-world data, free-form teleoperation, whole-body control, multi-modal sensing, and 1:1
              digital twins. NVIDIA Isaac Lab and GR00T do the same from the platform side, emphasizing scalable
              robot-learning workflows and sim-to-real transfer. DeepMind's Gemini Robotics 1.5 and π0 both show that
              broader pretraining only becomes useful after substantial embodied-data adaptation. UBTECH's Thinker and
              annual-report language show a similar Chinese framing: spatial intelligence, temporal understanding, world
              models, and industrial robot collaboration are inseparable from data quality and full-stack execution.


              Safety and trust sit on top of that dependency graph. NVIDIA Halos frames physical AI as requiring a
              full-stack safety OS, inspection regime, standards alignment, and external monitoring. SCIO's standards
              work and MERICS' policy research show why this matters in China: robots are moving into factories, stores,
              hospitals, and homes, so reliability and safety are no longer optional add-ons. Bulage currently exposes
              none of its own safety, privacy, quality, or support controls publicly, which is a product-tech risk
              rather than just a disclosure footnote.
