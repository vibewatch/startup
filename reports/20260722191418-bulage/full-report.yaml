      - number: '4.4'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Bulage's reported $220 million seed round is large in absolute terms, but the surrounding evidence says
              that is only a starting point, not proof of financial sufficiency. Figure raised $675 million in one round
              to accelerate AI training, manufacturing, and deployment. Agility is pursuing a transaction worth more
              than $620 million of gross proceeds while also citing more than $300 million of multi-year orders and a
              30-plus-customer pipeline. UBTECH reached RMB2.0 billion of revenue and still reported large losses and
              substantial R&D needs. 1X raised $100 million and still frames home deployment as an ongoing buildout. The
              common pattern is that the category consumes capital long before stable profitability is visible.


              The underwriting conclusion is therefore cautious. Bulage may have enough cash to fund core research,
              early hardware iteration, and one or more pilot programs, but there is no public evidence to underwrite
              revenue quality, gross margin, burn, working capital needs, or cash runway. If Bulage intends to build a
              full-stack humanoid platform, the capital burden likely includes compute, data collection, prototype
              iterations, safety engineering, manufacturing setup, deployment support, and partner integration. If it
              intends to be an OEM-neutral model layer, the cost base could be lighter but still depends on proving real
              task performance. Either way, the current valuation rests far more on option value than on disclosed
              financial traction.
