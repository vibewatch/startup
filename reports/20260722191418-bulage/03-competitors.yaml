  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: bulage-product-definition
    missingEvidence: No public source reveals whether Bulage plans to sell integrated robots, model licenses, developer tools, or enterprise services first.
    whyItMatters: Product form determines which competitor class is actually most dangerous and which pricing benchmarks matter.
    diligencePath: Request the product roadmap, first commercial package, hardware strategy, and any OEM or design-partner agreements.
    relatedQuestionRefs:
    - QP004
    - QP023
    - QP026
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Most competitors do not disclose realized ASPs, support economics, discounting, or software attach rates.
    whyItMatters: Without realized pricing, it is impossible to know whether hardware price anchors or service economics dominate the market.
    diligencePath: Request customer contracts, quotation ranges, and deployment support assumptions from Bulage and relevant peers.
    relatedQuestionRefs:
    - QP020
    - QP026
  - type: private-evidence-only
    severity: material
    topic: repeat-order-proof
    missingEvidence: Public deployment evidence is still thin on renewals, utilization, task success, and repeat-order behavior across the field.
    whyItMatters: The gap between an impressive pilot and a scalable business model is usually visible in repeat-order behavior, not launch headlines.
    diligencePath: Ask for signed renewal orders, utilization dashboards, and task-level ROI data from any claimed pilot or enterprise design partner.
    relatedQuestionRefs:
    - QP021
    - QP026
  - type: conflicting-data
    severity: moderate
    topic: home-vs-industrial
    missingEvidence: Different sources describe home humanoids as the long-run prize but disagree on whether home is commercially sensible in the near term.
    whyItMatters: Bullish home narratives can produce the wrong product roadmap if safety and support burdens delay monetization.
    diligencePath: 'Stress-test Bulage''s sequencing assumptions: what can be sold into factories first versus what remains a home-robot aspiration?'
    relatedQuestionRefs:
    - QP012
    - QP024
  - type: stale
    severity: moderate
    topic: competitive-ranking
    missingEvidence: Shipment leadership and price anchors in humanoids are moving quickly, and several public metrics are still 2025 or early-2026 snapshots.
    whyItMatters: A ranking that looks durable in July 2026 could shift rapidly if another peer opens capacity or cuts price.
    diligencePath: Refresh competitor shipment, order, and price checks before any investment decision or customer-facing positioning exercise.
    relatedQuestionRefs:
    - QP018
    - QP026
