chapter:
  number: 3
  title: Competitors
  summary: 'Bulage is entering a crowded 2026 embodied-intelligence field where western labs such as Figure and 1X lead the public model narrative, Agility and Boston Dynamics lead on service and industrial deployment discipline, and Chinese rivals such as Unitree, AGIBOT, and UBTech are compressing price and scaling pressure. The public record supports a cautious conclusion: Bulage has financing and founder pedigree, but its competitive moat is still thesis-level because peers already disclose stronger evidence on pricing, deployments, service layers, or shipment momentum.'
sections:
- id: landscape-classes-and-bulage-position
  title: Landscape classes and Bulage's starting position
  body: |-
    Bulage is not entering a tidy head-to-head race against one other startup. The relevant 2026 buying landscape spans at least three archetypes plus the status quo. First are full-stack embodied-AI labs trying to own both the robot and the control stack, led publicly by Figure, 1X, AGIBOT, Unitree, UBTech, Agility, and Boston Dynamics. Second are industrial incumbents or quasi-incumbents that bring service, safety, manufacturing, and deployment experience that a new lab cannot buy overnight. Third are China scale-first competitors that may not yet own the strongest public model narrative, but already have price anchors, supply-chain leverage, and shipment momentum. The status quo substitutes are still task-specific automation, human labor, and internal system integration.

    Bulage starts this race with one undeniable advantage and one equally material handicap. The advantage is capital plus founder pedigree: its reported $220 million seed round and $2 billion valuation give it the resources to recruit, train models, and buy hardware quickly. The handicap is disclosure and proof. Compared with almost every named peer in this chapter, Bulage shows no public product page, no posted packaging, no customer story, and no verified deployment record on its official surface. That means the company is presently competing more on thesis — world models and an embodied brain — than on observed commercial execution. In a market that is moving from demos toward narrow but real factory, logistics, and developer deployments, that gap matters.
