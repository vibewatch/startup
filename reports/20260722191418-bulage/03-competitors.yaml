- id: moat-durability-and-displacement-risk
  title: Moat durability and displacement risk
  body: |-
    The public evidence does not yet support a strong claim that humanoid moats are locked in anywhere, let alone at Bulage. Home-first players still have to prove safety, low-touch support, and repeat utility. Industrial-first players still face narrow task scope and custom integration burdens. China scale-first players benefit from lower hardware cost and policy support, but they still face generalization, data scarcity, and imported high-end component bottlenecks. Adverse coverage from KrASIA, Yicai, and Unite.ai is therefore important, because it argues that valuation inflation is racing ahead of proven product-market fit. In other words, the category is real, but the moat story is often premature.

    For Bulage, the competitive implication is straightforward. Funding alone is not a moat when Unitree can post public price anchors, AGIBOT can cite shipment leadership, UBTech can cite orders and factory deployments, and Agility or Boston Dynamics can point to service muscle and named enterprise workflows. A durable Bulage moat would need to show up in one of four places: uniquely useful embodied-model performance on valuable tasks, faster deployment through an OEM-neutral software layer, stronger economics than full-stack rivals, or a proprietary partner/data flywheel that others cannot cheaply copy. None of those are yet publicly evidenced. The competitive verdict is therefore not that Bulage cannot win, but that the burden of proof sits almost entirely ahead of it.
