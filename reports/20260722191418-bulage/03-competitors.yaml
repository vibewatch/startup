- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat / competitor response
  - Severity
  - Current evidence
  - Mitigation / diligence ask
  rows:
  - - Embodied-model superiority
    - Figure and 1X already publicize strong VLA or home-learning narratives
    - High
    - Model differentiation is visible in marketing, not yet in verified ROI league tables
    - Request Bulage task-level benchmarks, inference architecture, and partner pilots
  - - China manufacturing advantage
    - Unitree, AGIBOT, and UBTech already operate inside stronger local supply chains and scale programs
    - High
    - TrendForce, SCIO, and MERICS all point to Chinese scale and standardization momentum
    - Test whether Bulage is model-layer neutral or must also fight on hardware cost
  - - Capital as moat
    - Seed capital alone can be matched or outflanked by peers with deployments or IPO paths
    - High
    - Bulage has capital, but peers show richer public execution evidence
    - Demand first-pilot proof before treating financing as defensible advantage
  - - Home-first generality
    - Boston Dynamics and adverse sources argue home is too early on cost and safety
    - Medium-High
    - Home leaders still show limited scaled monetization proof
    - Prioritize narrow paid workflows before broad home narrative
  - - Industrial integration
    - Agility and UBTech already frame workflow integration and support as core products
    - High
    - Named customers and factory-system integration appear before Bulage has public references
    - Clarify whether Bulage sells software, robots, or joint solutions
  - - Low-price disruption
    - Unitree's public pricing can reset buyer expectations downward
    - High
    - G1 price is public; most rivals are opaque
    - Benchmark Bulage against task ROI, not against premium narrative alone
  - - Lock-in from standards and interfaces
    - Government-led standardization may reduce switching costs over time
    - Medium
    - SCIO highlights interoperability, modularization, and lower coordination costs
    - Test whether Bulage owns proprietary data or only swappable components
  - - Category hype support
    - Bubble risk could tighten capital or punish weak PMF quickly
    - High
    - KrASIA, Yicai, and Unite.ai all warn commercialization trails valuation
    - Underwrite Bulage on proof milestones, not comparable headlines
  notes: The register tests whether Bulage's potential moat survives against real competitor responses rather than simply listing attractive attributes.
