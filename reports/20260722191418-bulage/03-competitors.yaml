- id: china-scale-leaders-on-price-and-throughput
  title: China scale leaders on price, throughput, and component leverage
  body: |-
    If the western players define the public frontier narrative, the Chinese field defines the near-term commercialization pressure. Unitree is the clearest public price anchor because it openly advertises G1 from $13,500, while also pushing a more capable full-size H1 line and claiming strong internal control over motors, reducers, controllers, LiDAR, and algorithms. TrendForce adds the key financial signal: Unitree's prospectus reportedly showed humanoid revenue surpassing quadrupeds in 2025, with 60% combined gross margin and planned capacity of 75,000 humanoids. AGIBOT presents a different but equally important template: diversified robot forms, a large embodied dataset initiative, and an Omdia-backed claim of 5,168 humanoid shipments and 39% global share in 2025.

    UBTech sits between those two models. It focuses more visibly on industrial integration, large-model-assisted decision making, factory system connectivity, and battery-swapping uptime. More broadly, TrendForce, CNBC, SCIO, MERICS, and adverse investor coverage all point in the same direction: China now has many more serious competitors than a narrative built around a single unicorn can justify. There are over 140 domestic manufacturers, over 330 models, and explicit government effort to standardize interfaces and accelerate industrial deployment. Bulage therefore faces not just a few famous logos, but a home market that is compressing the distance between lab prototype, supply-chain scaling, and commercially legible product packaging.
