chapter:
  number: 5
  title: Product & Technology
  summary: 'Bulage''s public product-tech case is still more strategic thesis than inspectable stack: outside media references to world models and an embodied brain, the company exposes almost no product, developer, safety, or roadmap surface. Peer disclosures show what that missing surface should eventually contain — a layered combination of embodied data, simulation, reasoning and VLA models, hardware abstraction, and full-stack safety / support controls — so the correct diligence posture is to treat Bulage as directionally aligned with the frontier but technically unverified.'
sections:
- id: product-definition-and-public-surface
  title: Product definition and public surface
  body: |-
    Bulage's public product definition is still far thinner than its valuation. The official site offers no readable product documentation, no module list, no trust page, no API or developer surface, and no roadmap. The main public description comes from media coverage that says Lin Junyang's new company focuses on world models and an embodied brain. That is a meaningful strategic direction, but it is not yet a product map. It does not say whether Bulage sells an integrated humanoid, a control stack for third-party robots, a training-data pipeline, developer tooling, or custom deployments. As a result, the right product-tech framing begins with absence: Bulage has a theme, but not a publicly inspectable product.

    The surrounding field shows how much more concrete public product definition usually looks. Figure exposes a home-oriented humanoid surface and a deep Helix technical narrative. AGIBOT publishes multiple robot forms and an open dataset program. UBTECH publishes industrial product pages, annual-report architecture language, and an open-source Thinker model. NVIDIA, DeepMind, and Physical Intelligence all show how the field is converging on explicit stacks that combine reasoning models, action policies, simulation, data pipelines, hardware, and safety infrastructure. Bulage has not yet revealed where it sits in that stack.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE021
  - CE030
  - CE034
  tableRefs:
