- id: maturity-roadmap-and-technical-verdict
  title: Maturity, roadmap, and technical verdict
  body: |-
    Public maturity is uneven across the field. Figure, DeepMind, NVIDIA, Physical Intelligence, AGIBOT, UBTECH, and Unitree all expose at least one inspectable layer: product pages, technical reports, dataset releases, simulation frameworks, open repos, or standards-linked safety materials. Some of those claims may still be aspirational, but they give diligence a surface to challenge. Bulage, by contrast, offers almost none of that. There is no public module map, no public release milestone, no public developer community, and no public evidence of integration, reliability, or support.

    That does not mean Bulage's strategy is invalid. In fact, the field's technical direction suggests there is room for an OEM-neutral embodied brain if a company can generalize across robot bodies and tasks while keeping inference, safety, and integration manageable. But that is still a hypothesis, not a demonstrated product. The technical verdict is therefore conditional: Bulage is directionally aligned with where the frontier is going, yet materially behind the public transparency and proof standard already set by peers. Its product-tech case should be treated as promising but unverified until the company discloses stack choices, partners, safety controls, and some evidence of task-level performance.
