- id: reference-architectures-and-model-stack
  title: Reference architectures and the embodied-model stack
  body: |-
    The clearest technical pattern across 2025-2026 embodied-AI disclosures is a layered split between high-level reasoning and low-level control. Figure's Helix separates a slower reasoning VLM from a fast visuomotor controller. DeepMind's Gemini Robotics 1.5 pairs an embodied reasoning model with a VLA executor. Physical Intelligence's π0 uses a pre-trained VLM plus a flow-matching action head trained on broad robot data. NVIDIA's GR00T platform then turns that pattern into a generalized ecosystem offer: foundation models, open data, simulation, middleware, and deployment hardware. These architectures matter because they clarify what "world models" or an "embodied brain" could actually mean in a shipping system.

    They also make Bulage's current disclosure gap sharper. If Bulage is building a model-layer company, the field already expects answers on cross-embodiment transfer, inference latency, teleoperation or imitation data, simulation, and hardware abstraction. If it is building a full-stack robot, the expectation expands further to manipulation, battery and thermal management, field reliability, and human-safe operation. There is nothing inherently wrong with staying quiet at an early stage, but there is also no public basis to assume Bulage has solved any specific piece of this stack better than the now well-documented reference set.
  claimRefs:
