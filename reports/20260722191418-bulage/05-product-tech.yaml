  title: Bulage-relevant embodied-AI product architecture map
  type: stack
  layout: standard
  summary: Layered map of the product architecture Bulage would need to disclose or build to make its embodied-brain thesis concrete.
  data:
    layers:
    - label: Layer 1 — Data collection and annotation
      detail: Teleoperation, sensor capture, labeling, and quality control for embodied behavior data
    - label: Layer 2 — Simulation / digital twins
      detail: Synthetic scenes, robot models, and training or evaluation environments
    - label: Layer 3 — Reasoning / world model
      detail: Semantic planning and environment understanding layer
    - label: Layer 4 — VLA / control policy
      detail: Turns vision-language context into robot actions at deployment speed
    - label: Layer 5 — Robot body / integration
      detail: Actuators, sensors, compute, and workflow integration
    - label: Layer 6 — Safety / support / trust
      detail: Monitoring, standards, support, privacy, and quality controls for real-world use
  approximationNotes: This is a conceptual stack synthesized from public peer disclosures. Bulage has not publicly confirmed its own implementation choices for any of these layers.
