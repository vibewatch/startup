- id: scenario-analysis-and-expected-value
  title: Scenario analysis and expected value
  body: 'A milestone-based scenario model is more defensible than a revenue-multiple model at Bulage''s stage because public revenue is still unknown. In the bull case, Bulage proves that its embodied-brain thesis works across robot bodies, lands at least one high-quality industrial anchor, and starts to look like a China-based model layer or deployment platform worth repricing upward. In the base case, the company uses its seed capital to build technical credibility and early pilots but still needs more capital before commercial leverage is clear. In the bear case, customer proof remains thin, competition and hype compression narrow investor appetite, and the next financing happens at a lower effective mark.


    Under that framework, the current reported valuation still looks demanding. The most important sensitivities are named customer proof, repeat-budget evidence, and evidence that compliance or compute dependencies will not slow commercialization. Those facts could move the supported range up quickly. Until they appear, however, expected-value logic is better read as downside protection than upside chasing.'
