company:
  name: Bulage
chapter:
  number: 8
  title: Valuation
  summary: Bulage's current reported ~$2 billion valuation sits inside the 2026 humanoid funding boom but ahead of what the company has publicly proven. The closest private comps—Figure, Agility, and Apptronik—pair billion-scale valuations or funding with far richer customer, product, or deployment disclosure, while mature public robotics and automation companies only earn much larger market values after long histories of revenue and installed-base proof. The most evidence-supported call today is therefore research-more with a stretched valuation stance and high risk rating.
sections:
- id: price-versus-proof
  title: Price versus proof
  body: 'Bulage''s reported ~$2 billion valuation can be understood only as a price on option value, not as a price on disclosed operating proof. Public sources still do not identify revenue, named customers, product architecture, task-level deployment metrics, or reliable evidence of repeat usage. What they do identify is a founder pedigree, a large seed round, a compelling market theme, and a category in which investors are still racing to back humanoid and embodied-AI narratives. That combination can produce real value, but it also means the current price is supported more by possibility than by verifiable traction.


    This distinction matters because peer data now sets a higher bar than a year earlier. Figure couples valuation with BMW and Helix. Agility couples it with orders and customer count. Apptronik couples large funding with Mercedes-Benz, GXO, Jabil, and a production robot narrative. UBTECH and AGIBOT show that Chinese peers are at least willing to publish revenue, shipment, or deployment signals. By that standard, Bulage is not wildly out of range on headline valuation—but it is clearly ahead of its public proof curve.'
