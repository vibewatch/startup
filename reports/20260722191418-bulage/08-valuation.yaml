  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: tv004-comparable-coverage
    missingEvidence: No public source provides a perfect like-for-like valuation comparable for a sub-one-year-old China embodied-AI startup at Bulage's proof level.
    whyItMatters: Any valuation frame must mix private humanoid comps with mature public ceilings, which increases model uncertainty.
    diligencePath: Request internal investor materials, round terms, cap-table context, and any private-market marks used by lead investors.
    relatedQuestionRefs:
    - QV005
    - QV007
    - QV013
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: customer-proof-gap
    missingEvidence: No public Bulage source identifies the named customers or partners needed to support the current price.
    whyItMatters: A $2B seed valuation becomes much more defensible if tied to real buyer pull or repeatable deployments.
    diligencePath: Request named customer references, scope of work, milestones, and follow-on budget evidence.
