- id: comparable-set-and-what-it-means
  title: Comparable set and what it means
  body: 'The most relevant direct valuation references are private humanoid rounds and transaction marks, not mature industrial public companies. Figure and Agility are useful because they are close enough in ambition and market excitement to illuminate what investors will pay for a mix of AI narrative, robot narrative, and customer proof. Apptronik is useful because it shows how much strategic capital can enter a company once real enterprise relationships are visible. 1X is a useful lower-proof comparator, though its home angle is different. These comparables say private capital is still willing to fund big upside before profits.


    The public-company set is valuable for a different reason. ABB, Rockwell, FANUC, Teradyne, and Intuitive show what valuations can look like when a robotics or automation company reaches durable revenue, installed base, regulatory disclosure, and investor reporting depth. Those companies are therefore ceiling references, not entry-price justification. Bulage''s current mark cannot be defended by pointing at $40-180 billion public market caps without also acknowledging the decades of proof that sit underneath those numbers.'
