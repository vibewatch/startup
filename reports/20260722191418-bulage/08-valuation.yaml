- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Bulage proves an OEM-neutral embodied-brain wedge, lands anchor industrial deployments, and publishes a credible product stack with manageable capital burn.
    - Supported range roughly $2.4B-$3.2B; upside comes from moving closer to Figure / Agility / Apptronik proof quality while retaining frontier narrative premium.
    - Execution still depends on customer conversion, compute access, and safe deployment.
    - Low-Medium
  - - Base
    - Bulage converts thesis into pilots and technical credibility but remains pre-scale and likely needs follow-on capital before broad commercialization.
    - Supported range roughly $1.2B-$1.8B; price can hold only if milestone progress becomes visible before the next financing.
    - Proof arrives slower than market expects; capital intensity remains material.
    - Medium-High
  - - Bear
    - Bulage fails to show clear customer proof, hype compresses, and the next round reprices the company on weaker negotiating leverage.
    - Supported range roughly $0.6B-$1.2B; downside comes from down-round or flat-round dynamics rather than business failure alone.
    - Competitive displacement, proof lag, and funding-market discipline converge.
    - Medium
  notes: Ranges are heuristic and milestone-anchored, not revenue-model outputs, because public revenue is still unknown.
