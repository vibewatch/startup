- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - No named customer proof
    - Still no named pilot or deployment by next major diligence cycle
    - Current price keeps depending on narrative alone
    - Maintain research-more or reprice sharply lower
  - - No product-scope clarity
    - Management still cannot show whether it sells models, robots, or service-heavy deployments
    - Makes economics and competitive moat impossible to underwrite
    - Pause any upgrade in recommendation
  - - Follow-on capital looks mandatory
    - Runway ends before proof milestones land
    - Dilution or flat/down round becomes part of base case
    - Re-cut supported value range downward
  - - Compliance / compute fragility
    - Meaningful dependence on hard-to-replace restricted tooling or no governance owner
    - Roadmap risk rises and customer diligence burden increases
    - Treat bull case as impaired
  - - Weak pilot economics
    - Any first customer proves too costly, too customized, or not repeatable
    - OEM-neutral or software-premium thesis weakens materially
    - Move toward bear-case valuation framing
  notes: These are monitorable triggers intended for investment committee follow-up rather than generic risk caveats.
  claimRefs:
  - CV026
  - CV027
  - CV028
  - CV036
  - CV037
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Named customers
    - No public anchor account, pilot, or production site
    - Largest gap between current price and proof
    - Request customer references, site list, and scoped deployment outcomes
  - - Product scope
    - No clear public statement on model layer versus full-stack robot strategy
    - Prevents margin, moat, and comp selection
    - Request product architecture, BOM responsibility, and workflow map
  - - Deployment economics
    - No public task-success, uptime, or repeat-budget evidence
    - Without this, valuation stays narrative-driven
    - Request pilot metrics, support burden, and expansion orders
  - - Capital sufficiency
    - No burn or runway disclosure relative to milestone plan
    - Follow-on financing need changes current fair value materially
    - Request operating plan to next financing or breakeven milestone
  - - Governance and compliance
    - No public owner or roadmap for privacy, safety, and AI governance
    - Regulatory and customer diligence will eventually demand it
    - Request governance package and jurisdictional compliance map
  notes: These asks are the minimum evidence set needed to move from curiosity to conviction at anything near the reported valuation.
