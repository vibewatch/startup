- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Large market, strong founder pedigree, and a very large seed round can create a real embodied-AI winner before public revenue exists.
    - Publish one named anchor customer, a product map, and a proof package showing the company is ahead on generalization or deployment economics.
  - - Private humanoid capital markets still reward upside before profits, so Bulage can remain valuable even in a proof-building phase.
    - Show that follow-on capital is optional rather than structurally required, or that current capital can fund the company to clear commercial milestones.
  - - Current valuation is stretched because public proof is thinner than at Figure, Agility, or Apptronik.
    - Either lower the entry price or raise the proof standard with customer outputs, technical artifacts, and repeat-budget evidence.
  - - Public market comps show eventual upside but do not validate today's price.
    - Demonstrate revenue-quality traction that begins to resemble a real installed base rather than an R&D option.
  notes: The anti-thesis is not that Bulage cannot win; it is that current public evidence cannot yet tell whether the current price already assumes too much of that win.
