- id: capital-adequacy-and-financing
  title: Capital adequacy, financing trajectory, and underwriting gaps
  body: 'Forward capital adequacy looks unusually strong relative to the public evidence base. The August 21, 2025 Series
    C added $415 million at a $2 billion post-money valuation per Flatwater Free Press and Omaha Daily Record (both citing
    PitchBook), with B Capital leading and Decades Holdings joining alongside continuing investors Insight Partners, JMI Equity,
    Blueprint Equity, Nelnet, Invest Nebraska, and WndrCo. Premier Alternatives and PitchBook put lifetime capital raised
    at $452.4 million, implying that the Series C represents roughly 92% of cumulative equity raised. Layered onto a "profitable
    track record" framing from B Capital and a still-modest 308-person headcount, runway is almost certainly multi-year measured
    in any reasonable burn scenario, even though management has not disclosed cash on hand, net burn, or a target spend plan.
    The capital-adequacy table below treats every cell as a diligence ask rather than a disclosed number.


    Two forward triggers matter for underwriting. First, the Beam acquisition is now an integration project that will absorb
    cash and engineering time without immediately producing measurable payments revenue; the deal price and any earn-out structure
    are not disclosed. Second, the company''s prior SEC Form D filings (the most recent being the October 27, 2021 Form D
    filed for the $30 million Series B with nine investors at CIK 0001725158) establish a baseline expectation that the 2025
    Series C should also produce a Form D within the standard window, which would publicly confirm the $415 million amount
    through a primary regulatory record rather than via PitchBook-mediated press coverage. The financial verdict is therefore:
    revenue quality, pricing discipline, and capital base all look investable, but cash, burn, runway, gross margin, retention,
    and realized ARPU after bundling Beam remain private and gate any final underwriting decision.'
