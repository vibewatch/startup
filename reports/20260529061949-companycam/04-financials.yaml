  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ARR
    missingEvidence: 2025 and 2026 ARR, MRR, and quarterly trajectory beyond Latka's 2024 $68M reading
    whyItMatters: Cannot validate the "durable ARR growth" framing or set a defensible valuation multiple for the $2B post-money
    diligencePath: Request management ARR series with revenue recognition policy; cross-check against billing-system exports
    relatedQuestionRefs:
    - QI003
    - QI020
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross margin
    missingEvidence: Consolidated gross margin, COGS breakdown for storage / support / payments pass-through
    whyItMatters: Determines whether vertical SaaS comps (75–85% GM) or storage-heavy COGS apply, and changes runway math
    diligencePath: Request P&L with full COGS breakdown plus AWS/GCP/Azure invoice trend over 24 months
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, logo churn by tier and trade vertical
    whyItMatters: Seat-expansion thesis is unverified; SMB contractor seasonality risk is unmeasured
    diligencePath: Request cohort retention tables and ARR by plan tier and trade
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: CAC
    missingEvidence: Blended CAC, S&M-to-net-new-ARR ratio, payback months by tier
    whyItMatters: Cannot test whether product-led GTM is as efficient as the 48-person sales team implies
    diligencePath: Request CAC by channel and payback distribution for FY2024 and FY2025 cohorts
    relatedQuestionRefs:
    - QI012
    - QI016
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: minor
    topic: Form D
    missingEvidence: 2025 SEC Form D for the $415M Series C
    whyItMatters: Without a Form D, the round amount is press-only via PitchBook; a primary filing would corroborate the $415M
    diligencePath: Monitor EDGAR (CIK 0001725158) for filings; if a Form D is filed late, reconcile to press
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI006
  - type: private-evidence-only
    severity: material
    topic: Beam acquisition
    missingEvidence: Beam deal price, earn-out structure, 2026 cash outflow, integration plan
    whyItMatters: Cannot size 2026 M&A cash impact or model the future Beam payments revenue contribution
    diligencePath: Request Beam SPA highlights including price, escrow, earn-out triggers, and 2026-2027 integration roadmap
    relatedQuestionRefs:
    - QI010
    - QI025
    relatedTableRefs:
    - TI005
  - type: enumeration-incomplete
    severity: minor
    topic: outages
    missingEvidence: Machine-readable status-page history to quantify outage frequency and severity
    whyItMatters: A high outage cadence would weaken the "profitable / durable" narrative through retention pressure
    diligencePath: Subscribe to status.companycam.com RSS and request a 12-month uptime report from management
    relatedQuestionRefs:
    - QI023
  - type: private-evidence-only
    severity: minor
    topic: vertical concentration
    missingEvidence: Revenue or seat distribution across user-reported verticals (roofing, restoration, HVAC, solar)
    whyItMatters: A heavy single-trade concentration would change valuation multiple and customer risk assumptions
    diligencePath: Request management ARR / seats split by trade vertical and concentration percentage of top vertical
    relatedQuestionRefs:
    - QI027
