callouts:
- calloutType: strength
  title: Pricing transparency is unusually high for a private SaaS at this scale
  body: CompanyCam publishes a complete three-tier per-seat price card with a hard three-user minimum, lets buyers compute
    an exact monthly cost, and reserves contact-sales only for 50+ seat enterprise deals. That makes the revenue model auditable
    from list prices in a way most private vertical SaaS peers do not allow.
  claimRefs:
  - CI001
  - CI002
  - CI004
  - CI005
  - CI006
  - CI008
- calloutType: insight
  title: '"Profitable" framing plus a $415M Series C means runway is almost certainly multi-year'
  body: B Capital described CompanyCam as having a "profitable track record" alongside "durable ARR growth," and the August
    2025 Series C added $415M to a previously roughly $37M cumulative base. Even a conservative burn scenario implies multi-year
    runway, though no cash or burn number has been publicly disclosed.
  claimRefs:
  - CI030
  - CI031
  - CI032
  - CI036
- calloutType: risk
  title: Every realized-economics metric is private, including margin, retention, and CAC
  body: Gross margin, NRR, GRR, logo churn, CAC, and payback are all null in the public record. Reviewer adverse signals (cost
    scales with team size, photo-only scope, occasional outages) raise plausible retention and ARPU risks that cannot be measured
    from public data.
  claimRefs:
  - CI020
  - CI025
  - CI026
  - CI027
  - CI030
- calloutType: recommendation
  title: Pull the 2025 Form D and request a one-page management metrics sheet before underwriting
  body: Confirming the $415M raise against an EDGAR Form D (CIK 0001725158), pairing it with management ARR/gross margin/NRR/CAC
    and a Beam deal-terms summary, is the minimum data set that would convert this chapter from a qualified positive read
    into a complete financial diligence package.
  claimRefs:
  - CI045
  - CI046
  - CI047
  - CI048
  - CI049
