  evidenceGaps:
  - type: missing-source
    severity: material
    topic: ai-model-and-evaluation-disclosure
    missingEvidence: A public description of the exact AI model providers, model-routing logic, training boundaries, evaluation metrics, and human-review safeguards for CompanyCam AI features.
    whyItMatters: The company now markets AI as a product differentiator, but outside diligence cannot independently test the safety or leverage of the AI stack from marketing and legal boilerplate alone.
    diligencePath: Request a technical AI overview covering model providers, prompt/guardrail architecture, evaluation dashboards, and customer-data training boundaries.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE001
    - TE004
  - type: missing-source
    severity: material
    topic: public-payments-economics
    missingEvidence: A public fee schedule, reserve policy summary, dispute-loss matrix, and payout-SLA description for CompanyCam Payments.
    whyItMatters: Payments can change product adoption, attach rate, and margin profile, but the public docs describe legal responsibility better than they describe actual economics.
    diligencePath: Request the live payments pricing sheet, reserve rules, payout timing by merchant class, and chargeback-loss policy.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: architecture-diagram-and-api-reference
    missingEvidence: A public system diagram or developer reference that shows the exact API objects, auth patterns, and platform boundaries beyond partner setup guides.
    whyItMatters: Integration depth is clearly real, but outside readers cannot fully map extensibility or lock-in without more developer-facing documentation.
    diligencePath: Request API docs or a partner architecture brief from the product or engineering team.
    relatedQuestionRefs:
    - QE016
    - QE024
    relatedTableRefs:
    - TE003
  - type: conflicting-data
    severity: minor
    topic: reliability-polish
    missingEvidence: A quantified reliability record for app regressions, sync failures, and export incidents across mobile and Pages surfaces.
    whyItMatters: Public incidents and reviews show that quality issues can materially affect field users, but there is no public uptime/SLO or bug-resolution dashboard.
    diligencePath: Request incident counts, mean-time-to-resolution, mobile crash rates, and export failure metrics for the last 12 months.
    relatedQuestionRefs:
    - QE021
    - QE022
    relatedTableRefs:
    - TE005
