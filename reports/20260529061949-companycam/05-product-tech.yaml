- id: TE001
  title: Product module / asset matrix
  columns:
  - module / asset
  - primary user
  - status / maturity
  - differentiation
  - diligence gap
  rows:
  - - Core capture and project feed
    - Field crews and office staff
    - Mature / core
    - GPS-time-stamped photos, videos, annotations, feeds, and unlimited cloud storage keep the jobsite record structured instead of scattered.
    - No public performance metrics on media upload speed, offline behavior, or sync latency.
  - - Pages and AI reports
    - Project managers, owners, office staff
    - Live / expanding
    - Turns captured media into shareable docs, PDFs, links, summaries, walkthroughs, and daily-log style outputs.
    - No public architecture or benchmarking for AI output quality or model routing.
  - - Direct integrations
    - Admins and back-office operators
    - Mature / broad
    - Native connections move projects, files, tags, labels, and documents into contractor CRMs/FSMs and proposal tools.
    - Coverage is broad but depth varies by connector and plan/admin permissions.
  - - Marketing Suite
    - Sales and marketing teams
    - Live / add-on
    - Converts completed jobs into Google posts, social content, review requests, and a visual portfolio.
    - Public docs do not quantify campaign ROI or adoption by tier.
  - - CompanyCam Payments
    - Office admins and contractors collecting payment
    - Live / early-platform extension
    - Embeds white-labeled payment acceptance inside the workflow rather than forcing a separate billing surface.
    - Public fee schedule and reserve economics are not posted.
  - - Chrome extension
    - Admins and office staff using browser tools
    - Niche but practical
    - Lets users upload CompanyCam photos to almost any website without manual download/re-upload steps.
    - Version history is light and public docs do not quantify adoption.
  - - Beam-enabled finance layer
    - Owners and finance-oriented contractor teams
    - Early-stage integration
    - Adds AI estimating, invoicing, payments, and broader finance workflow scope beyond pure documentation.
    - No public integration roadmap or timeline for unified user experience.
  notes: Module map mixes mature core features with newer scope extensions such as payments, marketing, and Beam-enabled finance. “Status / maturity” reflects only public evidence, not internal telemetry.
