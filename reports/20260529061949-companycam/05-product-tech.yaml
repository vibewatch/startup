- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow problem
  - CompanyCam solution
  - measurable / visible benefit
  - limitation
  rows:
  - - Capture field proof
    - Crews take photos on phones that become impossible to find later.
    - GPS-time-stamped capture with projects, annotations, labels, and feeds.
    - Creates a searchable, shared job record instead of loose camera-roll evidence.
    - Public docs do not disclose offline capture resilience or sync SLAs.
  - - Share progress with office and customers
    - Teams lose time rebuilding updates from texts and calls.
    - Pages, galleries, project feeds, PDF reports, and links.
    - Turns field activity into office/customer-ready updates quickly.
    - Pages export reliability has shown at least one public incident.
  - - Coordinate with CRM / FSM
    - Job data and project media live in separate systems.
    - Direct integrations with JobNimbus, AccuLynx, Procore, Roofr, and many others.
    - Reduces duplicate entry and keeps media attached to the right job record.
    - Setup often requires admin permissions, tokens, or plan gating.
  - - Automate repetitive admin work
    - Admins manually create projects, folders, and sync steps.
    - Zapier triggers/actions plus open API references and Chrome extension support.
    - Supports automation to Drive, Airtable, Jobber, QuickBooks Online, and more.
    - No public comprehensive API reference or webhook-rate documentation.
  - - Collect payment from the field
    - Payment request and collection often happen outside project context.
    - CompanyCam Payments with cards, ACH, Apple Pay, Google Pay, and tap-to-pay.
    - Keeps invoicing/payment collection closer to the proof-of-work workflow.
    - Economics, fraud-loss sharing, and processor fees are not publicly priced.
  - - Turn completed work into marketing proof
    - Finished jobs do not automatically become demand-generation assets.
    - Marketing Suite and review-collection features.
    - Converts project documentation into Google posts, social content, and review requests.
    - Public docs do not show attach rates or measurable conversion lift.
  notes: Workflow table stays in customer-job language rather than product-marketing slogans. “Measurable / visible benefit” is public-evidence based, not an internal KPI sheet.
