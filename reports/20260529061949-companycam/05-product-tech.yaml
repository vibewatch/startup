- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / component
  - role
  - dependency
  - risk
  rows:
  - - iOS / Android mobile apps
    - Primary field capture, review, and payment/tap-to-pay surfaces.
    - Apple App Store, Google Play, mobile OS permissions, device camera/GPS stack.
    - UI regressions or app-store/platform policy changes directly affect front-line usability.
  - - Web app and Pages surface
    - Office-side organization, documentation assembly, exports, and sharing.
    - Browser compatibility, CompanyCam web stack, PDF export/rendering.
    - Pages export incidents can block customer-facing outputs at critical moments.
  - - AI features
    - Summaries, recaps, walkthroughs, translations, checklists, and report generation.
    - Internal AI/LLM pipeline and customer-supplied content quality.
    - Legal docs disclaim output accuracy and public model/provider details are absent.
  - - Integration and token layer
    - Moves projects, files, metadata, and workflows across partner systems.
    - Partner APIs, admin credentials, API keys, access tokens, Zapier connectors, open API endpoints.
    - Connector breakage or auth misconfiguration can silently degrade workflows.
  - - Payments rail
    - Accepts and settles customer payments inside CompanyCam.
    - Stripe processing, Apple Pay / Google Pay rails, NACHA/card-network compliance, LexisNexis risk checks.
    - Fee opacity, reserves, disputes, and processor dependency sit outside CompanyCam’s full control.
  - - Trust / infrastructure controls
    - Protects stored project evidence and exposes reliability information.
    - AWS hosting, encryption, permissions, penetration testing, public status tooling, vendor reviews.
    - No public deep architecture diagram means trust is policy-visible but not system-design-visible.
  - - Browser extension
    - Injects CompanyCam photos into third-party web upload flows.
    - Chrome platform behavior and site-specific upload widgets.
    - Extension maintenance and browser changes could degrade the workaround over time.
  notes: Architecture is reconstructed from public product, legal, trust, app-store, and integration documentation. CompanyCam does not publish a formal system diagram, so some layer boundaries are analytical rather than explicitly documented.
