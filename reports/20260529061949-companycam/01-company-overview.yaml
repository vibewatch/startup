  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters-address
    missingEvidence: A directly confirmed current headquarters address from CompanyCam legal, operations, or a current office lease document.
    whyItMatters: Craft lists 350 Canopy Street Suite 230 while CompanyCam site markup points to 300 Canopy St Suite 200, so even a basic company-reference field is not perfectly harmonized.
    diligencePath: Request the current legal HQ and mailing address from CompanyCam finance or HR and reconcile it against secretary-of-state and lease records.
    relatedQuestionRefs:
    - QO003
    - QO028
  - type: private-evidence-only
    severity: material
    topic: board-and-governance
    missingEvidence: A current board roster, observer list, voting-control map, and any investor-rights summary.
    whyItMatters: Public sources show some board evidence but not the full governance picture, which limits diligence on control, downside protection, and strategic influence.
    diligencePath: Request the board list, voting agreements, and latest financing documents directly from the company or lead investors.
    relatedQuestionRefs:
    - QO005
    - QO027
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: current-arr
    missingEvidence: A 2025 or 2026 ARR / revenue run-rate disclosure from management, investors, or audited statements.
    whyItMatters: The only retained public ARR point is the 2024 estimate of roughly $68M, which is not enough to test whether the $2B valuation still rests on similar or faster growth.
    diligencePath: Request current ARR, retention, and gross-margin materials from management or the data room.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: customer-count-precision
    missingEvidence: A current, clearly defined customer-account count with the unit defined as accounts, businesses, paying customers, or active pros.
    whyItMatters: Public sources cite 50,000 customers, tens of thousands of businesses, and 285,000 professionals, which all imply scale but do not answer the same diligence question.
    diligencePath: Ask CompanyCam to disclose active paying accounts, active businesses, and active professionals separately.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current ownership percentages, liquidation preferences, employee-option dilution, and any secondary-sale details.
    whyItMatters: Valuation and control cannot be fully judged from headline funding data alone; the economics depend on who owns what and with which rights.
    diligencePath: Request the cap table, stock ledger, option pool summary, and financing documents from management.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: international-expansion-plan
    missingEvidence: A public or management-confirmed list of target countries, launch timing, and commercial model for non-U.S. expansion.
    whyItMatters: Series C materials mention global growth, but without geographic sequencing it is difficult to evaluate execution risk or market upside outside North America.
    diligencePath: Ask management for geographic expansion plans, current non-U.S. revenue, and partner strategy.
    relatedQuestionRefs:
    - QO026
  - type: missing-source
    severity: minor
    topic: milestone-coverage
    missingEvidence: A fuller dated company timeline covering internal product launches, partnerships, and any adverse or governance events omitted from public coverage.
    whyItMatters: TO004 is the chapter's chronology of record, but public sources do not surface every internal milestone needed for an exhaustive timeline.
    diligencePath: Request a management timeline or press archive export and reconcile it against the public milestone table.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO004
