- id: leadership-and-governance
  title: Leadership and Governance
  body: Leadership evidence is strongest around founder control and thinner around full governance detail. Luke Hansen remains Founder and CEO and is still the dominant public face of the business across founder-story content, financing announcements, and regional press coverage. Fast Company and Silicon Prairie also identify Tullen Mabbutt as CFO, which is strategically important because CompanyCam has moved from founder-led bootstrap behavior into late-stage capital deployment, secondary-liquidity, and acquisition territory. Public board evidence is partial rather than complete. CB Insights lists Blueprint Equity co-founder Sheldon Lewis on the board, while Insight Partners’ Series B announcement said Matt Koran would join the board after the 2021 round. Together these sources show institutional investor oversight, but they do not produce a full, current board roster, observer list, or control-rights map. That leaves clear governance diligence still to do. From an investment-risk perspective,
    key-person dependence on Hansen remains material because the company narrative, product thesis, and financing story still center on his contractor-market credibility and operating judgment.
  claimRefs:
