  figureRefs: []
- id: funding-valuation-and-stakeholders
  title: Funding, Valuation, and Stakeholders
  body: 'CompanyCam’s funding history now fits a late-stage growth software profile. Public evidence supports an approximately $6 million Series A in June 2020 led by Blueprint Equity, a $30 million Series B in October 2021 led by Insight Partners with JMI Equity and WndrCo, and an August 2025 Series C led by B Capital with Decades joining and existing investors returning. Regional news and market-data sources put the Series C at $415 million and the post-money valuation at $2 billion, making CompanyCam Nebraska’s first unicorn. B Capital is described as the largest external investor after that round, and William Blair advised the transaction. Combining the publicly disclosed Series A, Series B, and Series C rounds yields more than $450 million of disclosed capital, before accounting for early family backing and local ecosystem grants. What remains private is just as important as what is public: exact ownership percentages, preference stack, secondary-sale amounts, and full board/control
    terms are not public. That means the chapter can identify the stakeholder map, but not the true governance economics behind it.'
