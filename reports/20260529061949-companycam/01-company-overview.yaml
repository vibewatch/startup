- id: scale-footprint-and-customer-reception
  title: Scale, Footprint, and Customer Reception
  body: 'Public traction evidence is meaningful but still partly estimate-based. The official homepage says CompanyCam is used by more than 285,000 professionals on 79 million jobs. Unify describes the platform as serving tens of thousands of contracting businesses and shows a distributed workforce footprint across 43 locations, with 106 employees in Lincoln and Sales as the largest department with 48 employees. PitchBook lists 308 employees in 2026, while Omaha Magazine separately reports more than 300 employees and 50,000 customers, highlighting why the right mental model is “broadly strong scale, imprecise exact counts.” Revenue visibility is similar: GetLatka and PitchBook-based reporting put 2024 ARR at roughly $68 million, up from about $32 million in 2023, but no 2025 or 2026 ARR figure is public. On customer sentiment, the tone is broadly strong. G2 shows a 4.7/5 rating, Software Advice reports a 4.7 overall rating with 4.6 ease of use, 4.4 support, and 4.5 value, and FieldCamp cites
    a 4.7/5 Capterra rating. These review surfaces support the view that customers like the workflow, even if some price and reliability friction remains.'
