- id: product-pricing-and-workflow
  title: Product, Pricing, and Workflow
  body: 'CompanyCam sells a visual documentation and job-progress platform for contractors. Official product pages show the core workflow clearly: capture photos and video, save them with automatic time and location metadata, annotate them, share them through galleries or live project timelines, and coordinate teams through comments, @mentions, and translations. The platform also extends into pages, AI-generated summaries and daily logs, offline capture, and integrations that connect CompanyCam to the office systems contractors already use. Pricing is transparent and seat based. Pro starts at $79 per month for three users, Premium is $129 per month with AI features such as walkthroughs and summaries, Elite is $199 per month with customer-facing sales tools, and Enterprise is custom for companies with 50 or more employees. All plans include unlimited photo, video, and document storage, which is a meaningful product choice in a field context where media volume is naturally high. Official and
    partner pages directly corroborate integrations with JobNimbus, AccuLynx, Jobber, Leap, JobTread, ProLine, RoofLink, ServiceTitan, and related contractor software.'
