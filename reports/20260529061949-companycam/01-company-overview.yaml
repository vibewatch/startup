- id: adverse-evidence-and-open-gaps
  title: Adverse Evidence and Open Gaps
  body: The adverse picture is manageable rather than clean. Review sites repeatedly describe CompanyCam as useful and easy to adopt, but they also surface practical complaints that matter for retention and expansion. Customers complain that the product becomes expensive for teams because pricing starts at three seats and grows with add-on users. Reviewers also mention occasional bugs, connectivity issues, and instances where photos do not save or upload cleanly in low-signal environments. FieldCamp’s comparison lens is strategically important because it frames CompanyCam as a specialized photo-and-documentation layer rather than a complete field service management suite with scheduling, dispatch, CRM, and invoicing depth. That framing is consistent with the product’s strengths, but it also caps how much budget share CompanyCam can capture unless Beam, AI, and partner integrations broaden the workflow. Public-source review did not surface a major lawsuit or regulator action, yet that should
    not be treated as substitute legal clearance. Exact customer-account counts, full board composition, cap-table ownership percentages, the current ARR number, and the precise address suite all remain open diligence items.
