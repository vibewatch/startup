  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争概览与品类边界
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 所在市场拥挤，但结构上仍分层明显。核心购买任务很简单：采集可信现场证据，快速分享，并让施工队、客户、分包商和办公室员工保持同步。买方解决这个任务的方式不同。有些人偏好 CompanyCam
              这样的专业工具，把视觉完工证明和可直接给客户看的照片报告做到最深。另一些人选择 Jobber、Housecall Pro、FieldPulse 或 ServiceTitan
              等更宽的现场服务管理套件，因为派单、报价、开票和 CRM 比最佳照片工作流更重要。第三类买方在 Procore 或 Buildertrend
              等项目中心型建筑系统里工作；对他们来说，文档控制、版本管理和更宽的项目协同比移动端视觉采集更重要。SafetyCulture/iAuditor
              是检查密集型团队的相邻替代品，它们想要清单和报告，而不是承包商专用照片层。这张竞争地图重要，因为 CompanyCam 在一个工作流上赢深度，而许多对手销售覆盖整个运营栈的宽度；2026
              年市场增长最强的正是这些更宽套件品类。
