      - number: '4.2'
        title: GTM 动作、客户与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              平台官方首页称有 285,000+ 用户，覆盖 79 million 个作业；PRNewswire 的 2025 年 8 月 C
              轮新闻稿称有“数万家承包企业”。两个数字都来自公司自述，未被独立审计佐证，但现在已经在公司界面、B Capital 表述，以及 Built In、PitchBook 等第三方资料之间保持一致。GTM
              动作压倒性地偏自助和产品驱动：公开三层价格卡、只有 50 名以上用户才进入联系销售路径，并高速集成到承包商工具栈（JobNimbus、AccuLynx、QuickBooks、Zapier）。这与 Unify
              报告的林肯员工结构一致——销售 48 人，工程 25 人，2026 年 4 月总员工 308 人——说明销售投入有意义，但不是主导成本中心。


              销售效率代理指标仍是间接的。G2、Capterra 和 Software Advice 上的公开评论者描述了高满意度和粘性（平均 4.7/5），这些与照片作为证明的工作流和保险理赔可防御性相关；Hansen 在
              Silicon Prairie News 和 StartLand News 的叙事强调“每次拿下一个承包商”的落地动作，用户基础从 2021 年 B 轮时的 100,000 增长到 2026 年的
              285,000+——四年半里用户约增至 2.85x。CompanyCam 自身没有发布
              CAC、回本周期、总美元留存或净美元留存、客户流失，或落地后扩张队列表，因此销售效率承保只能依赖基准区间（peppereffect 给出的中端市场 SaaS NRR 108–115%），而不是公司特定队列数学。C
              轮领投方称增长“持久”，加上没有任何公开裁员报道，是更软但一致的信号。
