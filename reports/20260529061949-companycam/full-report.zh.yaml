      - number: '5.3'
        title: 支付、安全、隐私与质量控制
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 的信任界面强于普通私有垂直软件公司，因为它实际发布控制语言，而不只是说“企业级”。信任中心称 CompanyCam 通过 SOC 2 Type II 认证，符合 GDPR 和
              CCPA，并接受年度第三方渗透测试。它还称客户数据在静态和传输中加密，托管在美国 AWS
              基础设施上，受严格访问控制保护，并在各项集成中覆盖供应商安全审查。状态网站公开展示事故历史；这一点重要，因为围绕现场证据和客户报告构建的产品不能悄悄失效。隐私声明也异常透明：它覆盖照片、视频、文件、消息、精确地理位置、支付信息、会话回放数据，以及使用服务数据分析和改进平台，包括训练内部
              AI 和大语言模型。法律文件进一步定义支付栈。CompanyCam 的支付服务采用贴牌形式，但由 Stripe 处理，CompanyCam 不是持牌支付机构；它支持银行卡、ACH、Apple Pay、Google
              Pay，以及符合条件 iOS 和 Android 设备上的触碰支付。同一组条款也明确风险位置：商户仍对争议或拒付交易负责，CompanyCam
              保留广泛的合规和账户控制权。这是可信的信任姿态，但不是魔法——它仍依赖 AWS、Stripe、合作伙伴安全和 CompanyCam 自身运营纪律。
