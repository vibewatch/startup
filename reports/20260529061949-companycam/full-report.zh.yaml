  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议一边看真实规模和产品质量，另一边受收入支撑陈旧、上市可比公司倍数压缩和持久性数据缺失拖累。
    data:
      nodes:
        - id: n1
          label: 品类强度
          detail: CompanyCam 有强客户证据、AI / 支付可选项，也有顶级投资人背书。
        - id: n2
          label: 2025 私募估值
          detail: 独立来源称 Series C 约为 $415M，估值约 $2B。
        - id: n3
          label: 收入锚点陈旧
          detail: 最好的公开收入锚点是 Latka 的 2024 年 $68M，不是 2026 年管理层数字。
        - id: n4
          label: 上市可比公司倍数更低
          detail: Procore 和 ServiceTitan 的交易倍数约为 ~5–7x 收入，远低于 CompanyCam 朴素倒推的往绩收入倍数。
        - id: n5
          label: 存在溢价叙事
          detail: 如果支付渗透和 Beam 集成跑通，可以支撑部分溢价。
        - id: n6
          label: 缺少持久性数据
          detail: 公开材料没有 NRR、GRR、合同期限或集中度表。
        - id: n7
          label: 建议 = 观察
          detail: 公司不错，但当前入场纪律应等更强指标或更好价格。
      edges:
        - from: n1
          to: n2
          label: 支撑溢价叙事
        - from: n2
          to: n7
          label: 起点
        - from: n3
          to: n7
          label: 限制确信度
        - from: n4
          to: n7
          label: 限制确信度
        - from: n5
          to: n7
          label: 避免直接回避
        - from: n6
          to: n7
          label: 阻止买入判断
