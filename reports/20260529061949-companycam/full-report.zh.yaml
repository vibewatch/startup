      - number: '2.4'
        title: 增长驱动、竞争捆绑与采用约束
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 所在品类的需求逻辑是真实的。劳动力短缺仍然严峻；AGC
              报告称，多数招聘企业仍难找到合格技工和受薪员工，这会抬高能减少协调开销、无需额外行政劳动即可记录工作的工具价值。ABC、CMAA、Autodesk 及其他行业来源也指向同一方向：互联现场技术、数字成熟度和 AI
              辅助工作流，越来越成为承包商守住利润率、推动项目运行的手段。结构化文档还带来间接监管价值，因为 OSHA
              记录保存和事故报告规则会奖励有纪律的证据采集，即使它们不强制使用特定照片应用。但这个品类也有真实约束。更宽的套件已经打包了重叠能力，可能压缩独立工具的付费意愿。Fortune
              还强调实施成本、培训负担、数据安全和集成复杂度是障碍。CompanyCam 向相邻 AI、支付和金融扩张，展示了一条可能回应：在更大套件补上可用性缺口前，先从文档切入长成更宽的承包商操作系统。
