  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    summary: 产品从现场采集走到有组织的凭证，再进入报告、同步、支付和营销动作。
    data:
      nodes:
        - id: capture
          label: 现场采集
          detail: 施工队用 iOS/Android 拍摄带 GPS 和时间戳的照片或视频。
        - id: organize
          label: 整理项目记录
          detail: 媒体按项目存放，并带有标签、评论、文件和 Pages。
        - id: summarize
          label: 汇总并报告
          detail: AI 和 Pages 把原始证据转成摘要、走查、清单、报告以及 PDF / 分享链接。
        - id: sync
          label: 同步到合作系统
          detail: 集成把项目、照片、文件、提案或文档送入 JobNimbus、AccuLynx、Procore、Roofr、Zapier 和其他工具。
        - id: collect
          label: 收款
