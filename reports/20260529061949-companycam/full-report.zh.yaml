  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              CompanyCam
              的相关市场不是完整建筑软件栈。公司自有界面一贯把承包商工作流描述为：采集工地证据，自动整理，让施工队保持同步，并向客户分享进度证明。屋面和修复页面进一步说明，既有替代方案通常不是另一套复杂平台，而是一团邮件、短信线程、相机胶卷和通用云文件夹。因此，这个品类比广义建筑管理软件更窄，更接近面向专业工种、家政服务承包商和多施工队运营者的现场文档、沟通与完工证明；这些客户需要视觉记录来减少争议。相邻支出仍然重要。CompanyCam
              现在把这个切口与 AI、支付、营销和集成结合起来，而 Procore、Fieldwire、Buildertrend、Autodesk
              等更大套件也越来越把照片、报告、文档和现场—办公室工作流打包进更宽的操作系统。用于估值时，正确边界是建筑和家政服务运营里可防守的文档工作流，而不是整个 BIM、排班、预算和企业控制宇宙。
