      - number: '6.2'
        title: 采用轨迹与具名生产证据
        blocks:
          - type: paragraph
            body: >-
              采用轨迹很清楚，即使留存数学还不清楚。CompanyCam 自有材料和关联新闻显示，用户规模从 2021 年 Series B 阶段的 100,000+ 用户，推进到 2023 年的 140,000+ 专业人士和
              200+ 员工，再到 2024 年 2 月 Inc. 地区公告中的 170,000+ 承包商，随后到 2026 年跨 7,900 万个项目的 285,000+ 专业人士。2025 年 8 月 Series C
              信息又补了一层：数万家承包企业依赖该产品。有名有姓的客户证据，在 CompanyCam 发布了足够上下文、能指向真实生产使用的地方最强。Reliant Roofing 是最好的例子：这是一家位于
              Jacksonville、拥有 100+ 员工的屋顶公司，有 61 名用户、数百万张已存照片、16,000+ 个项目和 1,100+ 份已生成报告，并声称取消全职上传岗位后每年节省 $50,000
              人工成本。Reliant 之外，企业和行业页面也给出更小但有用的结果片段：BK Restoration 称每月节省 36 小时；AHC 称软件价值达到成本的 10 倍；Academy Roofing
              强调估价与执行之间协调更好；White Castle Roofing 称电话减少一半；Terrytown Plumbing & Heating
              看重所有项目图片都放在一处。这些客户证据可信，但仍是自报证据，不是经审计的部署经济性。
