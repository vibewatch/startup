      - number: '2.3'
        title: 买方、用户与付款方分层偏向专业承包商和现场中心型团队
        blocks:
          - type: paragraph
            body: >-
              买方地图比把“建筑公司”视为单一分层更细。CompanyCam
              的包装和行业页面显示，至少有五个有意义的分层：业主自营的工种小店、多施工队专业承包商、屋面和修复公司、需要办公室—现场协调的大型总包或专业承包团队，以及想要标准工作流的多地点或加盟网络。多数情况下，终端用户是现场工长、技师或施工队成员；预算所有者则是业主、运营负责人、行政或区域经理。房主、物业经理和保险公司通常是报告使用者，而不是实际软件付款方。采用触发点包括：现场团队需要证明工作已完成、证明既有状况、更快更新进度，以及更轻松地把工作交回办公室。CompanyCam
