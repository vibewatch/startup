companyProfile:
  summary: >
    CompanyCam 是一家位于内布拉斯加州林肯的 SaaS 公司，由 Luke Hansen 于 2015 年夏天创立。平台帮助承包商拍摄、整理、分享并报告工地照片和项目文档，并用 AI
    辅助进度跟踪、报告生成和团队沟通。CompanyCam 已接入 ServiceTitan、Salesforce、QuickBooks、JobNimbus 等 60+ 承包商工具。截至 2026 年中，平台服务 285,000+
    专业人士，覆盖 79 million 张工地照片。2025 年 8 月，公司完成由 B Capital 和 Decathlon Capital 领投的 $415 million C 轮，投后估值约 $2.0
    billion，成为内布拉斯加州首家独角兽。ARR 从 $32 million（2023 年 12 月）增至 $68 million（2024 年），约翻一倍。2026 年 3 月，CompanyCam 收购 Beam
    Finance，为承包商补上 AI 驱动的估价和融资能力。
  foundedDate: '2015-06-01'
  founders:
    - name: Luke Hansen
      role: 创始人兼 CEO
      background: 在内布拉斯加州林肯做承包商照片管理时遇到个人痛点，由此做出 CompanyCam；带领公司完成 A、B、C 轮，期间没有 CEO 更替。
