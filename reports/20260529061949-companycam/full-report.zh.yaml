  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景、市场支持与当前估值标记的真实含义
        blocks:
          - type: paragraph
            body: >-
              公开证据足以说明 CompanyCam 在 2025 年被重估，但还不足以说明今天市场仍会按同一估值成交。CompanyCam 自己的 Series C 信息，经 William Blair 和 Nebraska
              媒体呼应，确认 B Capital 是领投方和最大外部支持者，Decades Holdings 加入了知名老股东组合。Flatwater Free Press、Omaha Daily
              Record、PitchBook 和 Premier Alternatives 都支持约 $415M 融资、$2B 估值这个口径，也让 CompanyCam 成为 Nebraska 首个独角兽。Premier
              Alternatives 还补充累计融资 $452.4M、估值 / 融资比 4.40x；放在成长型软件里，这个比例体面但并不罕见。关键限定在于，估值支持一部分是历史性的，一部分相互冲突。Omaha
              Magazine 后来对同一个 2025 年里程碑使用了 $1.5B 数字，提醒我们私营市场标记不像公开市值那样干净。2021 年 Form D 确认至少有一轮此前融资对应正式证券发行，而 2025
              年巨额融资几乎必然形成更有意义的优先权和稀释堆叠，只是公开信息未披露。正确解读因此是：$2B 标记真实到可以引用，但它没有充分刷新，也没有完整解释，不能被当作今天不容置疑的内在价值。
