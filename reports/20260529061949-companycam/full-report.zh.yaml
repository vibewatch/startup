    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与创立
        blocks:
          - type: paragraph
            body: >-
              2015 年，Luke Hansen 在家族屋面公司 White Castle Roofing 反复遇到文档问题后，在内布拉斯加州林肯创立 CompanyCam。官方创始故事称，产品最初是给 White
              Castle 施工队用的工具：照片需要挂到真实工程上，而不是散落在手机、短信和通用云文件夹里。这个起点重要，因为它解释了为什么 CompanyCam
              至今仍把自己定位为承包商优先的工作流层，而不是通用媒体应用。公开来源一致把公司放在林肯，并把创立逻辑与屋面、保险、责任、客户沟通以及现场到办公室可视性联系起来。公开地址证据方向上支持总部仍在林肯
              Haymarket 区的 Canopy Street，但具体套间号在不同来源间并不完全一致：Craft 列出 350 Canopy Street, Suite 230，而 CompanyCam
              自家网站标记目前指向 300 Canopy St, Suite 200。战略上，这个差异不大，但尽调时值得确认；它说明连基础公司参考数据在公开界面之间也没有完全对齐。
