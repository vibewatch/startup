  - id: TR005
    title: 缓释与否决条件表
    columns:
      - 风险
      - 可监测触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 产品质量投资逻辑
        - 状态事件和评论情绪
        - 单季度发生两起或以上重大现场工作流事件，或应用评分 / 评论情绪持续下滑
        - 暂停投资信心；先要求事件日志、崩溃指标和发布治理整改，再为未来增长假设背书。
      - - 支付逻辑
        - 拒付、准备金与打款摩擦
        - 准备金扣留上升、纠纷损失显著，或商户对支付体验不满
        - 指标改善前，把支付视为风险放大器，而不是利润率增厚器。
      - - Beam 整合逻辑
        - 附加率与工作流收敛
        - 12 个月内看不到实质工作流整合、附加率证明或客户采用信号
        - 将 Beam 从战略上行空间下调为分心风险。
      - - 需求韧性逻辑
        - 承包商市场走弱
        - 核心承包商客群积压订单恶化，项目取消增加或支出收缩
        - 下调增长假设，并提高对客户流失的敏感度。
      - - 平台治理逻辑
        - 应用商店或政策执行
        - 应用下架、审核严重延迟，或数据安全执法事件
        - 上调平台依赖风险，并测试仅 Web 备用方案是否可行。
      - - 竞争逻辑
        - 套件替代
        - 大客户流向更完整套件，或“CompanyCam 只是点状功能”的异议增加
        - 假设定价压力更高、长期独立价值更低。
      - - 集中度逻辑
        - 未披露的客户 / 垂直行业集中
        - 发现少数工种或客户贡献了过大收入占比
