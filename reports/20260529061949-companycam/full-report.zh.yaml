    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流问题
      - CompanyCam 方案
      - 可衡量 / 可见收益
      - 限制
    rows:
      - - 采集现场证据
        - 施工队用手机拍照，之后几乎找不到。
        - 按项目、标注、标签和动态流组织的 GPS 时间戳采集。
        - 把零散相册证据变成可搜索、可共享的工作记录。
        - 公开文档未披露离线采集韧性或同步 SLA。
      - - 向办公室和客户同步进展
        - 团队会把时间耗在从短信和电话里重拼更新。
        - Pages、图库、项目动态、PDF 报告和链接。
        - 快速把现场动作变成可发给办公室和客户的更新。
        - Pages 导出可靠性至少出现过一次公开事故。
      - - 与 CRM / FSM 协同
        - 作业数据和项目媒体分散在不同系统。
        - 与 JobNimbus、AccuLynx、Procore、Roofr 等众多系统直接集成。
        - 减少重复录入，让媒体跟上正确的工作记录。
        - 配置往往需要管理员权限、令牌或套餐门槛。
      - - 自动化重复后台工作
        - 管理员手动创建项目、文件夹并处理同步步骤。
        - Zapier 触发器 / 动作，加上开放 API 参考和 Chrome 扩展支持。
        - 支持自动化流转到 Drive、Airtable、Jobber、QuickBooks Online 等。
        - 未公开完整 API 参考或 webhook 速率文档。
      - - 在现场收款
        - 付款请求和收款常常脱离项目上下文。
        - CompanyCam Payments 支持银行卡、ACH、Apple Pay、Google Pay 和 tap-to-pay。
        - 让开票和收款更贴近完工证明流程。
        - 经济性、欺诈损失分摊和处理商费用均未公开定价。
      - - 把已完工项目变成营销证明
        - 完工项目不会自动变成获客素材。
        - Marketing Suite 和评论收集功能。
        - 把项目文档转成 Google 帖子、社交内容和评论请求。
        - 公开文档未披露附加率或可量化转化提升。
