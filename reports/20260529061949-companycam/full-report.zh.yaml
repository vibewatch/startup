      - number: '7.4'
        title: 人员、宏观与投资逻辑失效监控
        blocks:
          - type: paragraph
            body: >-
              最后一组风险是执行与终端市场暴露的组合。公开 CompanyCam 报道仍高度围绕创始人展开，因此即使 Series C 之后，Luke Hansen 仍是显眼的关键人物依赖。招聘页也显示，公司员工远程、AI
              优先，分布在美国所有时区。这本身不是负面，但公司正从文档拓展到支付和 Beam 支持的财务，这个时点会提高协作和变革管理要求。宏观环境让这个问题更重要。AGC 的 2026
              年展望显示，承包商情绪相比一年前明显走弱，衰退担忧、劳动力短缺、移民执法、关税，以及昂贵或不确定的资金，都在压制项目活动。如果承包商预算收紧，可选或半可选软件模块会很快感到压力。正确回应不是今天就判定投资逻辑破裂，而是定义什么会让它破裂。若
              app 或 Pages 反复出现重大事故，支付出现准备金 / 拒付压力，Beam
              无法接入客户工作流，评论情绪大幅恶化，或硬数据显示公司集中暴露于疲弱承包商细分，都会实质改变承销判断。这些监控指标比抽象的「中等风险」标签更重要。
