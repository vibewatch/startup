      - number: '5.2'
        title: 集成、工作流契合度与运行架构
        blocks:
          - type: paragraph
            body: >-
              最强的技术证据不是漂亮架构图，而是一堆具体工作流文档。CompanyCam 发布了 JobNimbus、AccuLynx 和 Zapier 产品页，以及 Procore、Roofr 和 Chrome
              扩展帮助文章。合起来看，运行模型很清楚：CompanyCam 坐在现场边缘，采集媒体和作业上下文，再把上下文同步进承包商 CRM、提案系统或文档存储。JobNimbus 需要管理员凭证、API key 和
              CompanyCam access token，说明它有真实 API 认证层，而不是松散的 CSV 式同步。AccuLynx
              不只同步照片和文件，也同步标签、描述、里程碑和项目标签，意味着结构化项目元数据，而不是笨文件传输。Procore 从活跃 Procore 项目创建 CompanyCam 项目，并把照片 / 文件发回
              Procore Documents。Roofr 双向推送作业和提案。Zapier 进一步扩展触发 / 动作工作流，连到 Google Drive、Jobber、Airtable、QuickBooks Online
              等。Chrome 扩展填补最后一公里，让用户能把 CompanyCam 照片上传到几乎任何基于浏览器的工作流。简单说，架构看起来像前端的移动 / web 采集、中间层的结构化项目对象，以及边缘的 token
