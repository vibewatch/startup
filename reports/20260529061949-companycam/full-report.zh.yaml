      - number: '7.3'
        title: 法律、隐私、支付与 Beam 整合风险
        blocks:
          - type: paragraph
            body: >-
              第三组风险来自产品伸向受监管或准受监管领域，但尚未披露投资人想看的量化控制指标。CompanyCam
              的隐私声明、条款和支付条款比多数私营公司的法律页面更有信息量，但正是这些披露本身，一旦实际产品行为偏离承诺，就会带来执法暴露。FTC 明确把隐私承诺和合理安全界定为法律义务，并称 DPF 失败可能违反 FTC
              Act 第 5 条；California 的隐私监管机构仍然活跃，并由投诉驱动。CompanyCam 也承认自己处理广泛数据类别，包括精确地理位置、照片、视频、消息、支付信息和会话回放数据，并训练内部 AI
              和大语言模型来改进服务。这围绕同意、披露、下游使用和跨境传输承诺形成法律风险面。支付会放大风险。Stripe 是处理方，不是
              CompanyCam，但这不会让支付风险消失；它只是把一部分风险移到商户和平台提供方协议上。争议会立即冲回资金和费用，准备金逻辑可能限制打款，商户仍要承担许多损失事件。最后，收购 Beam 把
              CompanyCam 推向 AI 估算、开票和财务工作流，而两家公司仍独立运营。战略上这令人兴奋；运营上，在协同效应被证明前，它先增加了整合、合规、UX 和支持风险。
