      - number: '8.2'
        title: 可比公司、公开市场倍数压缩与隐含倍数纪律
        blocks:
          - type: paragraph
            body: >-
              估值纪律测试让 CompanyCam 更难承销。相邻施工和承包商软件公开可比公司，交易水平远达不到一个天真的 2024 年追踪收入倍数，无法支撑 CompanyCam $2B 标记。StockAnalysis
              显示 Procore 市值约 $7.17B、追踪收入 $1.37B，约 5.2x 销售额；ServiceTitan 市值约 $6.27B、收入 $960.97M，约 6.5x 销售额。Macrotrends 显示
              Procore 2026 年 1 月达到更高的 $10.11B，这一点有用，因为它凸显即使受青睐的软件公司也会很快下修估值。Windsor Drake 的 construction-tech SaaS
              报告把更广板块锚定在 2025 年 Q4 收入 8.2x，现场管理公司在 7.0x 到 8.5x，更高溢价留给支付赋能或垂直整合程度更高的平台。已审阅资料包里 CompanyCam 唯一公开收入锚点，是
              Latka 对 2024 年 $68M 的估计。在这个基数上，$2B 标记意味着约 29x 追踪收入，远高于公开可比区间。即使 CompanyCam 到 2025–2026 年已经长到 $100–140M
              收入区间，该标记仍意味着大约十几倍中段到 20x 收入，依然是溢价区。这个溢价并非不可能，但它要求投资人相信 CompanyCam
              正在从现场管理演进成更有价值的工作流和金融科技平台，而且速度快于当前公开指标所能证明的速度。
