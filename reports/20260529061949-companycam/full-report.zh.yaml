      - number: '8.3'
        title: 建议、情景区间与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              建议应当对价格敏感，而不是对喜爱程度敏感。CompanyCam 显然是一家真实公司，拥有品类强度、客户喜爱、投资人质量，以及围绕 AI
              和支付的可信可选性。这是投资逻辑。反向逻辑是，公司可能仍然优秀，但新投资人缺少私有留存、当前 ARR、拒付或集中度数据，2025
              年价格已经可能过高。因此，合理建议是以中等置信度观察，并维持估值偏高立场。乐观情景下，CompanyCam 已经远超 Latka 的 2024 年估计，Beam
              显著提高变现，市场把它按支付赋能的垂直整合者定价；这可以支撑约 $2.0–$3.0B。基准情景下，公司依然强，但更像优质现场管理或工作流平台，或许支撑
              $1.2–$1.8B。悲观情景下，客户集中、承包商宏观疲软或倍数压缩，把公允价值拖向约 $0.6–$1.1B。这些情景之间的差距不只是数学区间；更是数据质量区间。在更新
              ARR、留存和金融科技指标给出前，审慎立场是跟踪这项资产，而不是把 2025 年头条融资当成已经按公开市场重新成交的价格来承销。
