          value: 8/10
          note: 承包商工作流痛点大，AI 和支付邻近性可信。
        - label: 客户证据
          value: 8/10
          note: 用户数、具名案例和评价分数都较强。
        - label: 产品 / 护城河质量
          value: 7/10
          note: 平台效用真实，但更大套件的捆绑压力不小。
        - label: 经济性可见度
          value: 4/10
          note: 有 2024 年收入锚点，但缺当前 ARR、留存和金融科技附加率。
        - label: 风险水平
          value: 4/10
          note: 平台、支付、集中度和宏观风险让风险水平维持高位。
        - label: 估值公允性
          value: 3/10
          note: 对照陈旧收入锚点和上市可比公司倍数，引用的 $2B 估值显得偏高。
        - label: 证据质量
          value: 5/10
          note: 以私营公司标准看不错，但仍不足以支持高确信度买入。
