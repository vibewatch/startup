  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争、定价与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              竞争是第一大风险，因为 CompanyCam 的核心价值主张容易理解，也容易拿来和更广的套件比较。Procore 以无限用户、无限数据、实施服务和企业级安全来定位自身，服务超过 300
              万用户；当买方想要一条统一协作主干，而不是最佳单点照片层时，它就是实在的高端市场威胁。ServiceTitan、Jobber 和 Buildxact
              造成另一类同样重要的风险：它们把派工、通话录音、CRM、报价、排期、营销、估算、项目管理或客户门户功能打包进更广的家庭服务和施工套件。这会把 CompanyCam 推入「功能还是平台」的比较。CompanyCam
              定价透明，是产品驱动增长的优势，但也让价格压力更可见，尤其在评论网站已经标出成本敏感，以及用户对集成、API 深度和现场收款等第二层模块热情较弱时。商业集中度会放大这种压力。公开来源仍把 CompanyCam
              描述为施工和家庭服务产品，而不是多元化的横向工作流平台，因此承包商终端市场一旦放缓或情绪转差，会同时打到多个风险向量：新增增长、升级意愿和付费意愿。
