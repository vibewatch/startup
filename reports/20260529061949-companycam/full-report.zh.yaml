      - number: '3.4'
        title: 定价、包装与评论信号
        blocks:
          - type: paragraph
            body: >-
              商业上，CompanyCam 位于低端 FSM 入门层级和企业级建筑套件之间。它公开的标价很直接：Pro 3 名用户每月 $79，Premium $129，Elite $199，每个额外用户再加
              $29。问题不在首次购买，而在打包后的算账。当承包商还需要派单、估价、CRM、开票或会计同步时，CompanyCam
              往往会成为又一层付费工具，而不是记录系统。因此，尽管满意度仍然强，独立评论覆盖里定价抱怨仍会反复出现。评论数据还显示，更大的工作流套件受益于更广的安装基础和更大的可见评论池。Procore
