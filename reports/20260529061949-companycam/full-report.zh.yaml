        title: 满意度、留存代理指标与仍未知的问题
        blocks:
          - type: paragraph
            body: >-
              客户满意度是证据底座里更干净的一块。iOS App Store 评分为 4.8/5，来自 26,000 条评分；Google Play 为 4.6/5，来自 6.53K 条评论。G2 也显示
              4.6/5，Software Advice 为 4.7/5，客户支持 4.4、性价比 4.5；GetApp 来自 99 条已验证评论，评分
              4.7/5，易用性和移动访问得分较强。合在一起，足以说明客户总体认可产品，而且产品并不依赖某一个友好市场的评分。GetApp
              还补充了有用的分层纹理：评论组合横跨小型、中型和企业客户，但施工和承包商管理用例占主导。公开记录仍然没有给出经典耐久性证据。没有公开
              NRR、GRR、流失率、续约率、合同期限表，也没有按工种或套餐拆分的队列分析。因此，耐久性只能从评论一致性、用例广度、客户关于习惯形成的表述，以及回到 SD
              卡、邮件链和割裂云文件夹的实际痛感中推断。方向上是正面的，但不能替代真正的留存包。
