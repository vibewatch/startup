  - id: TV006
    title: 最终尽调需求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前 ARR / MRR
        - 2025 和 2026 年收入或 ARR 运行率，以及确认口径
        - 没有当前收入锚点，所有估值方法都不稳。
        - 索取管理层指标表或经审计财务摘录。
      - - 留存和合同质量
        - NRR、GRR、客户流失、合同期限，以及年付 / 月付组合
        - 决定 CompanyCam 应获得上市可比公司溢价，还是应该折价。
        - 索取按套餐和账户规模切分的队列数据包。
      - - 支付 / Beam 经济性
        - GMV、抽佣率、附加率、准备金发生率、拒付率和 Beam 交叉销售指标
        - 用来测试 fintech 叙事是在增厚价值，还是只是在增加复杂度。
        - 索取支付仪表盘和 Beam 整合 KPI 包。
      - - 股权结构表和优先权
        - 2025 年 Series C 证券条款、清算优先权、老股交易和持股集中度
        - 私募轮经济性可能让真实入场价值与名义投后估值明显不同。
        - 索取股权结构表摘要和融资条款清单要点。
      - - 客户集中度
        - 按工种、地域、账户规模和头部客户拆分的收入
        - 用来测试承包商市场放缓时的韧性。
        - 向财务 / RevOps 索取集中度表。
      - - 当前独立市场验证
        - 一级市场投资人或二级市场对股票当前清算价格的指示
        - 测试 2025 年估值标记仍然有效，还是已经过时。
        - 获取最新经纪商、投资人或董事会估值标记背景。
    notes: 这些是把建议从观察升级到类似买入信心所需的最低数据请求。
