        - id: market
          label: 把工作转成营销凭证
          detail: Marketing Suite 和评论工具把已完成项目转成面向客户的凭证和需求生成资产。
        - id: archive
          label: 保留证据轨迹
          detail: 状态、信任、隐私和权限控制支持长期存储，并控制访问项目记录。
