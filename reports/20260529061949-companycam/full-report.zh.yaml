      - number: '1.4'
        title: 融资、估值与股东
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 的融资历史现在已经符合后期成长型软件公司的轮廓。公开证据支持 2020 年 6 月由 Blueprint Equity 领投的约 $6 million A 轮、2021 年 10 月由
              Insight Partners 领投且 JMI Equity 和 WndrCo 参投的 $30 million B 轮，以及 2025 年 8 月由 B Capital 领投、Decades
              加入且既有投资方继续参与的 C 轮。地方新闻和市场数据来源把 C 轮金额列为 $415 million、投后估值列为 $2 billion，使 CompanyCam 成为内布拉斯加州首家独角兽。该轮之后，B
              Capital 被描述为最大外部投资方，William Blair 担任交易顾问。把公开披露的 A、B、C 轮合计，公司已披露融资超过 $450
              million，尚未计入早期家族支持和本地生态资助。未公开的内容同样重要：精确持股比例、优先股堆叠、老股出售金额，以及完整董事会 /
              控制权条款都不公开。因此，本章能识别股东地图，但不能还原其背后的真实治理经济学。
