      - number: '2.2'
        title: TAM、SAM 和 SOM 应用多重视角定义，而不是一个标题数字
        blocks:
          - type: paragraph
            body: >-
              公开 TAM 证据存在，但只能提供方向感。Future Market Insights、Mordor 和 Fortune Business Insights 都发布了 2026 年建筑管理软件估计值，但区间从
              USD 8.18 billion 到 USD 12.92 billion，因为每家机构对品类的定义不同，且纳入了远超 CompanyCam 照片文档切口的模块。更可防守的做法，是搭一个受约束的
              TAM/SAM/SOM 框架。广义 TAM 可以用分析师收入区间展示，但 SAM 应锚定最可能需要工地证明的劳动力基础和工作流，尤其是 BLS 统计的专业工种承包商 5.249 million
              名员工。第二个视角来自 2026 年美国建筑支出；该支出年化仍高于 USD 2.18 trillion 且还在增长，支持混合宏观环境下的持续软件需求。公开 SOM 仍未解决：CompanyCam
              披露了数万家企业和宽产品扩张，但没有披露席位数、客户组合或 ARPU。因此，投资人应把市场视为足够大、值得重视，但不能仅靠公开证据精确测量。
