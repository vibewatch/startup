      - number: '1.5'
        title: 规模、覆盖与客户反馈
        blocks:
          - type: paragraph
            body: >-
              公开牵引证据有分量，但仍有一部分基于估计。官方首页称，CompanyCam 被超过 285,000 名专业人士用于 79 million 个工地。Unify 描述该平台服务数万家承包企业，并显示公司员工分布在
              43 个地点；林肯有 106 名员工，销售是最大部门，有 48 人。PitchBook 列出 2026 年员工数 308 人；Omaha Magazine 另称公司有 300 多名员工、50,000
              名客户，这也说明正确心智模型应是“规模大体强劲，但精确数量模糊”。收入可见度类似：GetLatka 和基于 PitchBook 的报道把 2024 年 ARR 放在约 $68 million，高于 2023 年约
              $32 million，但 2025 或 2026 年 ARR 没有公开数字。客户情绪总体较强。G2 显示评分 4.7/5；Software Advice 给出 4.7 的总体评分，其中易用性 4.6、支持
              4.4、价值 4.5；FieldCamp 引用 Capterra 4.7/5 评分。这些评论界面支持一个判断：客户喜欢这套工作流，即使价格和可靠性摩擦仍然存在。
