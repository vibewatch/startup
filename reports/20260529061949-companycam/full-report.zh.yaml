  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支持证据
      - 哪些因素会改变判断
    rows:
      - - 投资逻辑：承包商工作流品类领先平台
        - 强客户证明、快速用户增长、重大 Series C 融资，以及 AI / 支付可选性。
        - 更新后的 ARR 和留存若能证明溢价叙事，会显著强化该逻辑。
      - - 投资逻辑：支付和 Beam 支撑更高质量倍数
        - Windsor Drake 称，带支付能力的建筑 SaaS 可获得显著溢价倍数。
        - 附加率、GMV 和 Beam 整合成功的公开证据会验证这一溢价。
      - - 反向逻辑：2025 年估值标记跑在公开基本面之前
        - Latka 的 2024 年 $68M 收入锚点，使 $2B 估值按历史收入看极贵。
        - 明显更高的当前 ARR / 收入运行率会削弱这一质疑。
      - - 反向逻辑：私募估值标记并未清晰刷新
        - Omaha Magazine 的 $1.5B 数字与更常见的 $2B 标记冲突。
        - 管理层或投资人若能对 2025 年估值机制做精确调和，会降低不确定性。
      - - 反向逻辑：留存和集中度仍不透明
        - 公开材料没有 NRR、GRR、流失、合同期限或集中度表。
        - 客户队列与集中度数据包会直接提高信心。
      - - 反向逻辑：上市可比公司倍数已压缩
        - Procore 和 ServiceTitan 的交易销售倍数远低于 CompanyCam 隐含私募估值标记。
        - CompanyCam 增长更快、利润率更高，或 fintech 占比更强，才能更好解释溢价。
    notes: 反向逻辑不是 CompanyCam 弱，而是价格支撑仍弱于公司质量支撑。
