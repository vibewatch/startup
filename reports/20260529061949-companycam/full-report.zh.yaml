      - number: '4.4'
        title: 资本充足度、融资轨迹与承保缺口
        blocks:
          - type: paragraph
            body: >-
              相对公开证据基础，前瞻资本充足度看起来异常强。根据 Flatwater Free Press 和 Omaha Daily Record（两者均引用 PitchBook），2025 年 8 月 21 日 C 轮新增
              $415 million，投后估值 $2 billion；B Capital 领投，Decades Holdings 加入，持续投资方包括 Insight Partners、JMI
              Equity、Blueprint Equity、Nelnet、Invest Nebraska 和 WndrCo。Premier Alternatives 和 PitchBook 把累计融资列为 $452.4
              million，意味着 C 轮约占累计股权融资的 92%。叠加 B Capital 的“盈利记录”表述和仍然适中的 308
              人员工数，在任何合理烧钱情景下，现金跑道几乎肯定按多年计算，尽管管理层没有披露手上现金、净烧钱或目标支出计划。下面的资本充足度表把每个单元格都视为尽调询问项，而不是披露数字。


              两个前瞻触发点对承保重要。第一，Beam 收购现在是集成项目，会消耗现金和工程时间，却不会立刻产生可测量支付收入；交易价格和任何业绩对价结构均未披露。第二，公司此前的 SEC Form D 文件（最近一次是
              2021 年 10 月 27 日为 $30 million B 轮提交的 Form D，9 名投资人，CIK 0001725158）建立了基线预期：2025 年 C 轮也应在标准窗口内产生 Form
              D，从而通过一手监管记录公开确认 $415 million 金额，而不是通过 PitchBook
              中介的媒体报道确认。因此，财务结论是：收入质量、定价纪律和资本基础都看起来可投，但现金、烧钱速度、现金跑道、毛利率、留存，以及捆绑 Beam 后的实际 ARPU 仍是私有信息，并会卡住任何最终承保决定。
