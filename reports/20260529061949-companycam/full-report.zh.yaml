  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价：透明的按席位 SaaS 栈，加上新的支付叠层
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 用按席位订阅变现一个核心产品——面向承包商的工地照片、视频和 AI 文档应用——且硬性要求至少 3 名用户。官方定价页列出，Pro 年付时 3 名用户 $79/month（每个额外用户
              $29），Premium 和 Elite 层级叠加 AI 导览、日报、文档签署、嵌入式图库；50 名以上用户进入通过联系销售售卖的 Enterprise 计划。G2 的定价抓取佐证了三个已发布层级和 3
              用户下限，独立评论者则把 Premium 和 Elite 对 3 名用户的价格分别放在约 $129/month 和 $199/month。结果是：以一家私有 SaaS
              公司的规模看，它的标价异常透明，但年付折扣、多年合同和企业谈判之后的实际 ARPU 没有公开。


              收入已经不再是纯订阅。2026 年 3 月 2 日收购 Beam Finance Inc. 后，CompanyCam 栈加入 AI 估价、开票和支付；两家公司仍独立运营。Beam 最终能让 CompanyCam
              在既有席位业务上挂接类似抽佣率的金融科技收入流，尽管公开资料没有披露抽佣率、附加率或对 ARR 的贡献。通过 JobNimbus、AccuLynx、QuickBooks 和 Zapier
              集成产生的渠道中介收入存在，但未作为单独收入线报告；它更像分销，而不是披露的变现流。收入规模最清晰的证据仍是 Latka 对 2024 年 $68 million ARR 的读数；这与创始人 Luke
              Hansen 在 2022 年炉边谈话中称 ARR “超过 $20 million”，以及 C 轮投资人对“持久 ARR 增长”的表述相一致。
