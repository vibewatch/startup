      - number: '4.3'
        title: 成本结构、盈利信号与单位经济
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 的成本面主要由人员和云基础设施驱动，而不是硬件或资本密集型建设。Unify 的员工快照显示，2026 年 4 月公司有 308
              名员工，最大集群在销售（48）、运营（29）、IT（28）和工程（25），呈现典型中端市场垂直 SaaS 的运营支出组合：薪酬推动大部分非 COGS 支出。“无限照片和视频”的云存储是直接
              COGS，会随用户数和图片量扩大；平台自家首页称覆盖 79 million 个作业，意味着可能存在数十亿张照片的存储足迹，但公开资料没有披露单位存储成本或毛利率。Beam
              收购增加了支付处理转付成本，会改变未来任何捆绑产品的毛利率报告口径，尽管 Beam 的独立经济性和交易价格都未披露。


              最有决策价值的公司经济性数据点，是 B Capital 新闻稿称 CompanyCam 有“持久 ARR 增长和盈利记录”。这是 C 轮领投方表述，不是经审计利润表，但 2025–2026 年 WARN 或
              Built In 数据中没有报道裁员，且 2026 年可见员工数为 308 人，对其形成佐证。把 Latka 2024 年 $68 million ARR 与 Windsor Drake 2025 年 Q4
              建筑科技 SaaS 8.2x 追踪收入倍数相配，$2 billion 估值意味着：若倍数不变，隐含 2025 年收入运行率接近 $200–$245 million；或者在 15–22x 高增长溢价倍数下，运行率为
              $90– $130 million——两者都未披露，且都是推导而非确认。所有已实现经济性字段（毛利率、贡献利润率、NRR、GRR、CAC 回本、LTV/CAC）仍是私有数字，本文把它们视为尽调询问项，而非事实。
