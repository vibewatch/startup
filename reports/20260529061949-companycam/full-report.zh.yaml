  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 当前收入已远高于 $150M，Beam 显著加深变现，CompanyCam 证明带支付能力的工作流整合跑通。
        - 按 $150–200M 收入的约 12–15x，企业价值可支撑约 $2.0–$3.0B。
        - 需要快速增长和强附加率，且没有运营反噬。
        - 有可能，但公开指标尚未证明。
      - - 基准
        - CompanyCam 是强承包商工作流公司，但上市可比公司和缺失留存数据限制了可支撑溢价。
        - 按 $110–140M 收入的约 10–13x，公允价值更像约 $1.2–$1.8B。
        - 仅要守住该基准，也需要更好的当前 ARR 证明。
        - 当前最符合证据的情形。
      - - 悲观
        - 增长慢于市场假设，Beam / 打款经济性令人失望，上市公司倍数进一步压缩。
        - 按 $75–120M 收入的约 7–9x，价值压缩至约 $0.6–$1.1B。
        - 承包商放缓、套件竞争或集中度可能加速重估。
        - 如果当前 ARR 仍接近过时的公开锚点，这一情形并非小概率。
    notes: 情景区间刻意拉宽，因为缺失当前 ARR 造成的是数据质量区间，不只是市场波动区间。
