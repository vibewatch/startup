        - 中型市场和企业级建筑团队
        - 版本控制、权限、关联、无限存储、企业级工作流广度
        - 实施和平台复杂度高于 CompanyCam
      - - ServiceTitan
        - 间接服务既有厂商
        - 大型工种软件既有厂商，运营打法成熟
        - 规模化住宅服务运营商
        - 调度、自动化清单、报告、客户沟通
        - 抓取来源未见专业视觉文档记录楔子
