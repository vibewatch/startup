      - number: '6.4'
        title: 扩张循环、集中度风险与负面客户信号
        blocks:
          - type: paragraph
            body: >-
              扩张逻辑看得见，尽管扩张指标还看不见。CompanyCam 可以先以简单文档 app
              落地，再靠共享报告、企业上线、标准化模板、协作者访问、集成、营销工作流，以及现在的支付逐步加深。更好的官方客户故事都指向这个模式：起点是「我们需要更好的工地照片」，随后变成记录保存、沟通、责任保护、营销，最终走向更广泛的流程标准化。与此同时，集中度风险并不小。CompanyCam
              仍深度集中在承包商和家庭服务工种，具名证据集中尤其贴近屋顶。公开来源没有披露头部客户收入占比、头部垂直行业收入占比或地理收入集中度。负面信号也确实存在。评论平台反复提到崩溃、iPhone
              或界面问题、项目合并困难和定价担忧。GetApp 的功能级评分也显示，第三方集成、API、估价和收款等第二层能力，不如核心移动访问和工作流管理那样普遍受欢迎。最后，已审阅资料包里的 BBB
              搜索结果是不确定，而不是洗清问题，因此正式投诉可见度有限。客户侧判断因此是：采用和有用性偏正面，但耐久性和集中度仍不完整。
