            body: >-
              CompanyCam 在所选垂直领域里的客户覆盖面很宽，但出了这个范围仍然偏窄。公开行业页现在覆盖屋顶、修复、油漆、太阳能、园林、HVAC、管道和总包，首页也继续把产品定位为适用于 50+
