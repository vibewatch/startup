      - number: '7.2'
        title: 平台依赖、宕机与运营质量风险
        blocks:
          - type: paragraph
            body: >-
              第二组风险是平台和产品交付依赖。CompanyCam 是现场产品，这意味着分发和可用性比纯办公室 SaaS 更重要。公司依赖 Apple App Store、Google Play 和 Chrome
              浏览器生态，来保持现场采集、Android/iOS app 和浏览器扩展工作流可用。Apple 指南明确说明，质量、安全、隐私和法律违规可能触发拒绝或下架；Google 的 Data Safety
              计划要求完整、准确申报，并保留对差异执行处罚的权利。这些不是理论上的治理层，而是 CompanyCam 与用户之间的外部门卫。运营证据从另一个角度说明了同一点。CompanyCam 公开状态页记录了 2026 年
              5 月 18 日的一次事故，导致图片较多的 Pages 无法导出 PDF；评论界面也保留了关于崩溃、iPhone
              问题、导航摩擦和界面回退的投诉。即使底层事故数量不高，产品价值也发生在高风险时刻——证明工作、解决纠纷、发送报告、收款。这意味着狭窄的可靠性失败可能带来不成比例的声誉和留存影响。CompanyCam
              有实在的缓释措施，包括 SOC 2、公开状态可见性、供应商审查和企业上线支持，但这些只能降低残余风险；它们不能移除一个基本事实：产品受平台治理，而且一旦移动端或报告导出质量滑坡，运营韧性会变脆。
