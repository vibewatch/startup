    $199/mo，每 3 名用户起）加上需联系销售的 Enterprise。2026 年 3 月收购 Beam Finance 后，平台增加 AI 估价和承包商融资能力。
  customerFocus: 屋面、修复、建筑和专业工种里的 SMB 与中端市场承包商；企业级承包商通过专属 CSM 层级服务。
