      - number: '1.2'
        title: 产品、定价与工作流
        blocks:
          - type: paragraph
            body: >-
              CompanyCam
              向承包商销售一套视觉文档和作业进度平台。官方产品页把核心工作流讲得很清楚：拍摄照片和视频，自动保存时间和位置元数据，添加标注，通过图库或实时项目时间线分享，并用评论、@提及和翻译协调团队。平台还延伸到
              Pages、AI 生成的摘要和日报、离线采集，以及把 CompanyCam 接入承包商既有办公室系统的集成。定价透明且按席位计费。Pro 每月 $79 起，含 3 名用户；Premium 每月
              $129，包含导览和摘要等 AI 功能；Elite 每月 $199，加入面向客户的销售工具；员工数 50 人以上的公司使用定制
              Enterprise。所有套餐都包含无限照片、视频和文档存储；在媒体量天然很高的现场场景里，这是一个有意义的产品选择。官方和合作伙伴页面直接佐证了与
              JobNimbus、AccuLynx、Jobber、Leap、JobTread、ProLine、RoofLink、ServiceTitan 及相关承包商软件的集成。
