      - number: '3.2'
        title: 直接替代品：Jobber、Housecall Pro、FieldPulse 和 SafetyCulture
        blocks:
          - type: paragraph
            body: >-
              在 SMB 直接替代品中，Jobber 是最宽的威胁，因为它把排班、派单、开票、支付和客户管理打包进一个系统，同时仍与 CompanyCam 集成，以服务想要专业文档的团队。Housecall Pro
              路径相似：商业上容易理解，有可见的低端套餐，并给业主一层从预约到开票的统一运营界面；但只有买方升级到更贵层级并添加附加功能后，功能才会扩展。FieldPulse
              更微妙。它竞争同一批中小型工种账户，但合作伙伴证据也显示，当买方想把更强现场文档挂到作业和估价上时，两款产品可以很好共存。SafetyCulture
              不是完全一对一替代，更像面向优先考虑清单、报告、任务和运营改进团队的检查驱动替代方案。实践中，承包商若更看重便利和供应商整合，而不是文档深度，CompanyCam
              暴露最大；若盖章式视觉证明是关键任务，CompanyCam 暴露最小。
