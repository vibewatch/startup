  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              CompanyCam
              更适合理解为承包商工作流产品，而不是通用照片仓库。核心任务仍是现场文档：施工队拍摄照片和视频，按项目和位置自动整理，标注关键内容，并创建办公室、分包商和客户都真正能用的实时事实源。但公开产品界面已经远远超出最初的采集闭环。功能和定价页面展示了
              Pages、AI 驱动的报告和清单生成、翻译、导览、摘要、日报、自定义模板、评论收集、嵌入式图库、双视频估价、iOS Pro 机型上的 LiDAR 测量支持，以及把完工项目转成社媒帖和评论请求的
              Marketing Suite。支付现在也进入产品界面，付费层级支持应用内收款，并有专门的支付条款文件。结果是：它还不是完整建筑 ERP，但明显不再是单用途相机应用。CompanyCam
