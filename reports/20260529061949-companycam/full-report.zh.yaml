      - number: '1.3'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              领导层证据最强的是创始人控制，完整治理细节则更薄。Luke Hansen 仍是创始人兼 CEO，也是创始故事内容、融资公告和地方媒体报道里最主要的公司公众面孔。Fast Company 和 Silicon
              Prairie 还确认 Tullen Mabbutt 担任 CFO；这在战略上重要，因为 CompanyCam 已经从创始人主导的自举式经营，进入后期资本部署、老股流动性和并购阶段。公开董事会证据不完整。CB
              Insights 显示 Blueprint Equity 联合创始人 Sheldon Lewis 在董事会任职；Insight Partners 的 B 轮公告则称 Matt Koran 将在 2021
              年该轮融资后加入董事会。合起来看，这些来源证明公司有机构投资方监督，但无法拼出完整且最新的董事名单、观察员名单或控制权图谱。治理尽调仍有明确工作要做。从投资风险看，Hansen
              的关键人依赖仍然实质存在，因为公司叙事、产品逻辑和融资故事仍围绕他的承包商市场信誉和经营判断展开。
