      - number: '8.4'
        title: 最终尽调问题、估值上调条件与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              CompanyCam 仍有机会赢得更高置信度判断，但前提是补齐一小组缺失事实。最重要的缺失输入是 2025 年和 2026 年当前 ARR 或收入运行率；没有它，所有倍数论证都被迫依赖 2024 年 Latka
              估计和情景推断。第二个缺失输入是客户耐久性：NRR、GRR、流失率、合同期限，以及企业与 SMB 组合，会告诉我们 CompanyCam 值不值得拿到溢价倍数，还是只能作为好公司相对公开可比打折。第三，Beam
              和支付逻辑需要硬运营数据——GMV、抽成率、支付挂载、拒付、准备金和产品融合里程碑。第四，股权结构表很重要。此前 VC 融资后又完成 $415M
              融资，很可能意味着有实质性优先权、流动性或稀释复杂性，而当前公开记录没有展示。上调建议的触发器也同样直接：证明当前 ARR 明显高于
              $100M、留存健康、金融科技挂载可信，并且没有新出现的集中度问题。投资逻辑失效触发器则相反：证据显示真实估值更接近 Omaha Magazine 的 $1.5B 而不是常被引用的
              $2B；公开可比继续压缩且没有增长抵消；或新的产品、支付、集中度数据压缩合理倍数的速度快于收入增长。
