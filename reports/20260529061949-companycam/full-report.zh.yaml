      - number: '1.6'
        title: 反向证据与待核查缺口
        blocks:
          - type: paragraph
            body: >-
              反向图景可控，但并不干净。评论网站反复说 CompanyCam 好用、容易采用，同时也暴露出影响留存和扩张的实际抱怨。客户认为产品对团队会变贵，因为定价从 3 个席位起步，并随新增用户上升。评论者还提到偶发
              bug、连接问题，以及在低信号环境下照片无法顺利保存或上传的情况。FieldCamp 的比较视角在战略上重要，因为它把 CompanyCam 定位为专业照片和文档层，而不是具备排班、派单、CRM
              和开票深度的完整现场服务管理套件。这个定位符合产品强项，但也限制了 CompanyCam 能拿到的预算份额，除非 Beam、AI
              和合作伙伴集成把工作流拓宽。公开来源审查没有发现重大诉讼或监管行动，但这不能替代法律尽调放行。精确客户账户数、完整董事会构成、股权结构表持股比例、当前 ARR 数字和具体套间地址，仍都是开放尽调事项。
