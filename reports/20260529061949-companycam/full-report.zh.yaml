  - id: TV005
    title: 投资逻辑破裂和否决触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 当前 ARR 披露不及预期
        - 更新后的 ARR 或收入运行率未明显超过 ~$100M
        - 溢价倍数的支撑明显变弱
        - 从观察转向回避 / 下调公允价值区间。
      - - 留存披露偏弱
        - NRR / GRR / 流失显示耐久性差或 SMB 流失强
        - 客户喜爱叙事不再支撑高溢价软件估值
        - 下调倍数假设。
      - - 支付 / Beam 表现不及预期
        - 附加率低、GMV 表现差、纠纷高，或整合进展弱
        - 嵌入式 fintech / 集成商溢价消失
        - 估值时把 CompanyCam 当作纯现场管理软件。
      - - 可比公司倍数继续压缩
        - 上市承包商软件 P/S 倍数压缩，且没有 CompanyCam 增长证明抵消
        - 私募估值标记支撑被侵蚀
        - 要求更低入场价格或更强私营指标。
      - - 集中度浮现
        - 收入集中在少数工种或客户
        - 风险折价应扩大，退出可选性收窄
        - 下调目标估值和信心。
      - - 冲突估值标记向下收敛
        - 真实 2025 年经济性上，证据更接近 $1.5B 而不是 $2.0B
        - 起始锚点过于宽松
        - 重置情景表，并下调建议。
    notes: 触发因素用于把缺失证据转化为可监测的估值纪律。
    claimRefs:
