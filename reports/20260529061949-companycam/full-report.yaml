      - number: '5.3'
        title: Payments, security, privacy, and quality controls
        blocks:
          - type: paragraph
            body: >-
              CompanyCam’s trust surface is stronger than the average private vertical-software company because it
              actually publishes control language instead of only saying “enterprise-grade.” The trust center says
              CompanyCam is SOC 2 Type II certified, GDPR and CCPA compliant, and subject to annual third-party
              penetration testing. It says customer data is encrypted at rest and in transit, hosted on U.S.-based AWS
              infrastructure, protected by strict access controls, and covered by vendor security reviews across
              integrations. The status site exposes incident history publicly, which matters because a product built
              around field evidence and client reporting cannot quietly fail. The privacy notice is also unusually
              revealing: it covers photos, videos, files, messages, precise geolocation, payment information, session
              replay data, and the use of service data to analyze and improve the platform, including training internal
              AI and large language models. The legal docs further define the payments stack. CompanyCam’s payments
              service is white-labeled but processed by Stripe, not by CompanyCam as a licensed payments institution,
              and it supports cards, ACH, Apple Pay, Google Pay, and tap-to-pay on eligible iOS and Android devices.
              Those same terms also make clear where risk sits: merchants remain responsible for disputed or
              charged-back transactions, and CompanyCam reserves broad compliance and account-control rights. This is a
              credible trust posture, but not a magical one — it still depends on AWS, Stripe, partner security, and
              CompanyCam’s own operational discipline.
