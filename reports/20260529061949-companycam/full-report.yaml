      - number: '6.4'
        title: Expansion loops, concentration risk, and adverse customer signals
        blocks:
          - type: paragraph
            body: >-
              Expansion logic is visible even though expansion metrics are not. CompanyCam can land as a simple
              documentation app, then deepen through shared reporting, enterprise onboarding, standardized templates,
              collaborator access, integrations, marketing workflows, and now payments. The better official customer
              stories all point to that pattern: what begins as “we need better jobsite photos” turns into
              recordkeeping, communication, liability protection, marketing, and eventually broader process
              standardization. At the same time, concentration risk is not trivial. CompanyCam is still deeply
              concentrated in contractor and home-service trades, with especially heavy roofing adjacency in the named
              proof set. Public sources do not disclose top-customer revenue share, top-vertical revenue share, or
              geographic revenue concentration. There are also real adverse signals. Review platforms repeatedly mention
              crashes, iPhone or interface issues, difficult job merging, and pricing concerns. GetApp’s feature-level
              scoring also suggests that secondary capabilities such as third-party integrations, API, estimating, and
              payment collection are less universally loved than core mobile access and workflow management. Finally,
              the BBB search result in the reviewed pack was inconclusive rather than exculpatory, so formal complaint
              visibility is limited. The customer read is therefore favorable on adoption and usefulness, but still
              incomplete on durability and concentration.
