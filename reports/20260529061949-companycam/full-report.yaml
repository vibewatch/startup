      - number: '6.2'
        title: Adoption trajectory and named production proof
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory is clear even if the retention math is not. CompanyCam’s own materials and
              affiliated press coverage show a progression from over 100,000 users at the 2021 Series B stage, to over
              140,000 pros and 200+ employees in 2023, to over 170,000 contractors in the February 2024 Inc. regional
              announcement, and then to 285,000+ pros across 79 million jobs by 2026. The August 2025 Series C messaging
              adds another layer by saying tens of thousands of contracting businesses depend on the product. Named
              customer proof is strongest where CompanyCam publishes outcomes with enough context to suggest real
              production usage. Reliant Roofing is the best example: a 100+ employee Jacksonville roofer with 61 users,
              millions of stored photos, more than 16,000 projects, and over 1,100 reports created, plus a claimed
              $50,000 annual labor saving from eliminating a full-time upload role. Beyond Reliant, the enterprise and
              industry pages add smaller but still useful outcome snippets: BK Restoration says it saved 36 hours a
              month; AHC says the software is worth 10x its cost; Academy Roofing highlights better coordination across
              estimating and execution; White Castle Roofing says calls were cut in half; and Terrytown Plumbing &
              Heating values having all project pictures in one place. This is credible customer proof, but it remains
              self-reported proof rather than audited deployment economics.
