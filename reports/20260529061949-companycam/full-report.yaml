      - number: '4.3'
        title: Cost structure, profitability signal, and unit economics
        blocks:
          - type: paragraph
            body: >-
              CompanyCam's cost surface is dominated by personnel and cloud infrastructure rather than hardware or
              capital-intensive build-outs. Unify's headcount snapshot shows 308 employees as of April 2026, with the
              largest cluster in Sales (48), Operations (29), IT (28), and Engineering (25), suggesting a typical
              mid-market vertical SaaS opex mix where compensation drives most non-COGS spend. Cloud storage for
              "unlimited photos and videos" is a direct COGS line that scales with user count and image volume; the
              platform's own homepage claim of 79 million jobs implies a multi-billion-photo storage footprint, but no
              public unit-storage-cost or gross-margin disclosure exists. The Beam acquisition adds payments-processing
              pass-through costs that change the gross-margin reporting profile for any future bundle, though Beam's
              standalone economics and the deal price are not disclosed.


              The single most decision-useful corporate-economics datapoint is the B Capital release's statement that
              CompanyCam has "durable ARR growth and a profitable track record." That is a Series-C lead-investor
              framing, not an audited income statement, but it is corroborated by the absence of any 2025–2026 reported
              layoffs in WARN or Built In data and by the visible 308-person headcount in 2026. Pairing the Latka 2024
              ARR of $68 million against Windsor Drake's Q4 2025 construction-tech SaaS multiple of 8.2x trailing
              revenue, the $2 billion valuation implies an implied 2025 revenue run rate near $200–$245 million if the
              multiple held, or alternatively a $90– $130 million run rate at a 15–22x premium-growth multiple — neither
              is disclosed, and both are derived rather than confirmed. Every realized-economics field (gross margin,
              contribution margin, NRR, GRR, CAC payback, LTV/CAC) remains a private number, treated here as a diligence
              ask rather than a fact.
