      - number: '2.2'
        title: TAM, SAM, and SOM Must Be Framed as Multiple Lenses, Not One Headline Number
        blocks:
          - type: paragraph
            body: >-
              Public TAM evidence exists, but it is only directionally useful. Future Market Insights, Mordor, and
              Fortune Business Insights all publish 2026 construction-management-software estimates, yet the range spans
              from USD 8.18 billion to USD 12.92 billion because each analyst defines the category differently and
              includes modules that reach far beyond CompanyCam’s photo-documentation wedge. The more defensible
              approach is a constrained TAM/SAM/SOM stack. Broad TAM can be shown with the analyst revenue range, but
              SAM should be anchored to the labor base and workflows most likely to need jobsite proof, especially the
              5.249 million employees BLS counts in specialty trade contractors. A second lens comes from 2026 U.S.
              construction spending, which remains above USD 2.18 trillion annualized and still growing, supporting
              ongoing software demand even in a mixed macro environment. Public SOM remains unresolved: CompanyCam
              discloses tens of thousands of businesses and broad product expansion, but not seat count, customer mix,
              or ARPU. Investors should therefore treat the market as large enough to matter, but not cleanly measurable
              from public evidence alone.
