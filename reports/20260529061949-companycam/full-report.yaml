  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model and pricing: a transparent per-seat SaaS stack with a new payments overlay'
        blocks:
          - type: paragraph
            body: >-
              CompanyCam monetizes a single core product — a jobsite photo, video, and AI documentation app for
              contractors — through a per-seat subscription with a hard three-user minimum. The official pricing page
              lists Pro at $79/month for three users when billed annually ($29 per additional user), with Premium and
              Elite tiers layering AI walkthroughs, daily logs, document signing, embedded galleries, and an enterprise
              plan above 50 users sold via contact-sales. G2's pricing capture corroborates the three published tiers
              and the three-user floor, and independent reviewers price Premium and Elite at roughly $129/month and
              $199/month respectively for three users. The result is unusually transparent list pricing for a private
              SaaS company, but realized ARPU after annual discounting, multi-year deals, and enterprise negotiation is
              not published.


              Revenue is no longer purely subscription. The March 2, 2026 acquisition of Beam Finance Inc. added AI
              estimating, invoicing, and payments to the CompanyCam stack, with both companies still operating
              independently. Beam will eventually let CompanyCam attach a take-rate-style fintech revenue stream to the
              existing seat business, although no public take-rate, attach rate, or contribution to ARR has been
              disclosed. Channel-mediated revenue through JobNimbus, AccuLynx, QuickBooks, and Zapier integrations
              exists but is not reported as a separate revenue line; it functions as distribution rather than as a
              disclosed monetization stream. The clearest piece of revenue scale remains Latka's 2024 reading of $68
              million in ARR, which is consistent with founder Luke Hansen's 2022 fireside statement that ARR was "north
              of $20 million" and the Series C investor framing of "durable ARR growth."
