            body: >-
              The strongest technical evidence is not a glossy architecture diagram; it is the accumulation of concrete
              workflow docs. CompanyCam publishes product pages for JobNimbus, AccuLynx, and Zapier, plus help articles
              for Procore, Roofr, and the Chrome extension. Together they show the operating model clearly: CompanyCam
              sits at the field edge, captures media and job context, and then synchronizes that context into contractor
              CRMs, proposal systems, or document stores. JobNimbus requires admin credentials plus API keys and
              CompanyCam access tokens, showing a real API-authentication layer rather than loose CSV-style sync.
              AccuLynx syncs not only photos and files but tags, descriptions, milestones, and project labels, which
              implies structured project metadata rather than dumb file transfer. Procore creates CompanyCam projects
              from active Procore projects and sends photos/files back to Procore Documents. Roofr pushes jobs and
              proposals in both directions. Zapier expands the surface further with trigger/action workflows to Google
              Drive, Jobber, Airtable, QuickBooks Online, and more. The Chrome extension fills the last-mile gap by
              letting users upload CompanyCam photos into almost any browser-based workflow. Put simply, the
              architecture looks like mobile/web capture on the front end, structured project objects in the middle, and
              token-based partner connections plus browser/upload tooling at the edge.
