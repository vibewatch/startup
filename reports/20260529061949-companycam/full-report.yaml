  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Current ARR disclosure disappoints
        - Updated ARR or revenue run rate does not comfortably exceed ~$100M
        - Premium-multiple defense weakens materially
        - Move from Track toward Avoid / lower fair-value range.
      - - Retention disclosure is weak
        - NRR/GRR/churn show poor durability or strong SMB churn
        - Customer-love narrative stops supporting premium software valuation
        - Re-rate multiple assumptions downward.
      - - Payments / Beam underperform
        - Low attach, poor GMV, high disputes, or weak integration progress
        - Embedded-fintech / integrator premium disappears
        - Treat CompanyCam as pure field-management software for valuation.
      - - Comp multiple compression continues
        - Public contractor software P/S multiples compress without offsetting CompanyCam growth proof
        - Private mark support erodes
        - Demand lower entry price or stronger private metrics.
      - - Concentration emerges
        - Revenue is concentrated in a few trades or accounts
        - Risk discount should widen and exit optionality narrows
        - Lower target valuation and confidence.
      - - Conflicting valuation mark resolves downward
        - Evidence converges closer to $1.5B than $2.0B for the real 2025 economics
        - Starting anchor was too generous
        - Reset scenario table and recommendation lower.
    notes: Triggers are designed to convert missing evidence into monitorable valuation discipline.
