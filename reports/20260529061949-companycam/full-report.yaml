  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              CompanyCam is best understood as a contractor workflow product rather than as a generic photo repository.
              The core job is still field documentation: crews capture photos and videos, automatically organize them by
              project and location, annotate what matters, and create a live source of truth the office, subcontractors,
              and customers can actually use. But the public product surface now goes well beyond that first capture
              loop. Features and pricing pages show Pages, AI-powered report and checklist generation, translations,
              walkthroughs, summaries, daily logs, custom templates, review collection, embedded galleries, dual-video
              estimates, LiDAR measurement support on iOS Pro models, and a Marketing Suite that turns completed jobs
              into social posts and review requests. Payments are now part of the product surface as well, with in-app
              collection on paid tiers and a dedicated payments terms document. The result is not yet a full
              construction ERP, but it is clearly no longer a single-purpose camera app. CompanyCam’s real product
              strategy is to own the visual proof layer of contractor work and then expand outward into communication,
              automation, payments, and adjacent finance workflows where that visual proof is valuable.
