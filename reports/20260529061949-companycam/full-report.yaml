        title: Satisfaction, retention proxies, and what remains unknown
        blocks:
          - type: paragraph
            body: >-
              Customer satisfaction is one of the cleaner parts of the evidence base. The iOS App Store sits at 4.8/5
              from 26,000 ratings and Google Play at 4.6/5 from 6.53K reviews. G2 also shows 4.6/5, Software Advice
              4.7/5 with 4.4 customer support and 4.5 value for money, and GetApp 4.7/5 from 99 verified reviews with
              strong ease-of-use and mobile-access scores. Taken together, that is enough to say customers generally
              value the product and that the product is not dependent on one flattering marketplace. GetApp also adds
              useful segment texture: the review mix spans small, midsize, and enterprise businesses, while construction
