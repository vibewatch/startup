      - number: '3.4'
        title: Pricing, packaging, and review signals
        blocks:
          - type: paragraph
            body: >-
              Commercially, CompanyCam is positioned between low-end FSM entry tiers and enterprise construction suites.
              Its visible list pricing is straightforward: $79 per month for three users on Pro, $129 on Premium, and
              $199 on Elite, plus $29 for each extra user. The issue is not the first purchase; it is the bundle math.
              When a contractor also needs dispatch, estimates, CRM, invoicing, or accounting sync, CompanyCam often
              becomes one more paid layer rather than the system of record. That is why pricing complaints recur in
              independent review coverage even though satisfaction remains strong. Review data also suggests that larger
              workflow suites benefit from broader installed bases and larger visible review pools. Procore surfaces
              thousands of ratings on its own pricing page, Buildertrend and Jobber show very large verified review
              bases in Software Advice, and FieldPulse highlights both strong customer support and a meaningful review
              count. CompanyCam still reviews well, but buyer perception shifts once prospects compare not just product
              quality, but how many tools and subscriptions they will need after purchase.
