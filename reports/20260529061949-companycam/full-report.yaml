      - number: '4.2'
        title: GTM motion, customers, and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The platform's official homepage claims 285,000+ users across 79 million jobs, and PRNewswire's August
              2025 Series C release describes "tens of thousands of contracting businesses." Both numbers are
              company-stated and uncorroborated by an independent audit, but they are now consistent across the company
              surface, B Capital's framing, and third-party profiles such as Built In and PitchBook. The GTM motion is
              overwhelmingly self-serve and product-led: a public three-tier price card, a contact-sales path only above
              50 users, and high-velocity integrations into the contractor tool stack (JobNimbus, AccuLynx, QuickBooks,
              Zapier). That is consistent with the Lincoln headcount mix Unify reports — 48 in Sales versus 25 in
              Engineering, with 308 total employees as of April 2026 — which suggests a sales investment that is
              meaningful but not the dominant cost center.


              Sales-efficiency proxies remain indirect. Public reviewers on G2, Capterra, and Software Advice describe
              high satisfaction and stickiness (4.7/5 average) tied to photo-as-proof workflows and insurance-claim
              defensibility, and Hansen's narrative in Silicon Prairie News and StartLand News emphasizes a "one
              contractor at a time" land motion that grew the user base from 100,000 at the 2021 Series B to 285,000+ by
              2026 — roughly a 2.85x increase in users over four-and-a-half years. CompanyCam itself has not published
              CAC, payback, gross or net dollar retention, logo churn, or land-and-expand cohort tables, so the
              underwriting view of sales efficiency must lean on benchmark ranges (NRR 108–115% for mid-market SaaS per
              peppereffect) rather than on company-specific cohort math. The Series C lead-investor statement that
              growth is "durable" plus the absence of any reported layoffs is a softer but consistent signal.
