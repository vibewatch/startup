chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Founding
        blocks:
          - type: paragraph
            body: >-
              CompanyCam was founded in 2015 in Lincoln, Nebraska by Luke Hansen after he ran into recurring
              documentation problems inside the Hansen family roofing business, White Castle Roofing. The official
              founder-story narrative says the product started as a tool for White Castle crews that needed photos
              attached to real jobs rather than scattered across phones, texts, and generic cloud folders. That origin
              story matters because it explains why CompanyCam still presents itself as a contractor-first workflow
              layer instead of a generic media app. Public sources consistently place the company in Lincoln and tie the
              founding thesis to roofing, insurance, liability, customer communication, and field-to-office visibility.
              Public address evidence is directionally consistent that headquarters remains on Canopy Street in
              Lincoln’s Haymarket district, but the exact suite is not perfectly consistent across sources: Craft lists
              350 Canopy Street, Suite 230, while CompanyCam’s own site markup currently points to 300 Canopy St, Suite
              200. That discrepancy is small in strategic terms but worth confirming in diligence because it shows even
              basic company-reference data is not perfectly harmonized across public surfaces.
