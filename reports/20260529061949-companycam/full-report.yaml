      - number: '8.2'
        title: Comparable set, public multiple compression, and implied multiple discipline
        blocks:
          - type: paragraph
            body: >-
              The valuation discipline test is where CompanyCam gets harder to underwrite. Public comps in adjacent
              construction and contractor software are not trading anywhere close to a naive 2024 trailing-revenue
              multiple that would justify a $2 billion CompanyCam mark. StockAnalysis shows Procore at about $7.17
              billion market cap and $1.37 billion trailing revenue, or roughly 5.2x sales, while ServiceTitan sits
              around $6.27 billion market cap and $960.97 million revenue, or about 6.5x sales. Macrotrends shows
              Procore at a much higher $10.11 billion in January 2026, which is useful because it highlights how quickly
              even favored software names can re-rate lower. Windsor Drake’s construction-tech SaaS report anchors the
              broader sector at 8.2x revenue in Q4 2025, with field-management names at 7.0x to 8.5x and higher premiums
              reserved for payment-enabled or more vertically integrated platforms. CompanyCam’s only public revenue
              anchor in the reviewed pack is Latka’s $68 million for 2024. On that base, a $2 billion mark implies
              roughly 29x trailing revenue — far above public comp bands. Even if CompanyCam had already grown into a
              $100–140 million revenue zone by 2025–2026, the mark would still imply roughly mid-teens to 20x revenue,
              which remains premium territory. That premium is not impossible, but it requires investors to believe
              CompanyCam is evolving from field management into a more valuable workflow and fintech platform faster
              than the public metrics currently prove.
