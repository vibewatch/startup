  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Competition, pricing, and commercial-model risk
        blocks:
          - type: paragraph
            body: >-
              Competition is the first major risk because CompanyCam’s core value proposition is easy to understand and
              easy to compare against broader suites. Procore positions itself with unlimited users, unlimited data,
              implementation services, and enterprise-grade security for more than 3 million users, which makes it a
              real upmarket threat whenever a buyer wants a single collaboration spine rather than a best-of-breed photo
              layer. ServiceTitan, Jobber, and Buildxact create a different but equally important risk: they bundle
              dispatching, call recording, CRM, quoting, scheduling, marketing, estimates, job management, or
              client-portal features into broader home-service and construction packages. That can force CompanyCam into
              a “feature versus platform” comparison. Transparent CompanyCam pricing is a strength for product-led
              growth, but it also makes pricing pressure visible, especially when review sites already flag cost
              sensitivity and weaker enthusiasm for second-layer modules like integrations, API depth, and field payment
              collection. Commercial concentration compounds that pressure. Public sources still frame CompanyCam as a
              construction and home-service product, not a diversified horizontal workflow platform, so any slowdown or
              negative sentiment in contractor end markets can hit multiple risk vectors at once: net new growth,
              upgrade appetite, and willingness to pay.
