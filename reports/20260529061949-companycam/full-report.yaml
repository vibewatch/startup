      - number: '7.3'
        title: Legal, privacy, payments, and Beam integration risk
        blocks:
          - type: paragraph
            body: >-
              The third risk cluster comes from stretching the product into regulated or quasi-regulated areas without
              yet disclosing the quantitative controls investors would want. CompanyCam’s privacy notice, terms, and
              payments terms are more informative than most private-company legal pages, but the very existence of that
              disclosure creates enforcement exposure if actual product behavior drifts from those promises. The FTC
              explicitly frames privacy promises and reasonable security as legal obligations and says DPF failures can
              violate Section 5 of the FTC Act; California’s privacy regulator remains active and complaint-driven.
              CompanyCam also acknowledges that it processes broad categories of data, including precise geolocation,
              photos, videos, messages, payment information, and session-replay data, and that it trains internal AI and
              large language models to improve services. That creates a legal-risk surface around consent, disclosure,
              downstream use, and cross-border transfer promises. Payments amplify the risk. Stripe is the processor,
              not CompanyCam, but that does not make payments risk disappear; it moves part of the risk to merchants and
              to the platform-provider agreement. Disputes reverse funds and fees immediately, reserve logic can
              constrain payouts, and merchants remain on the hook for many loss events. Finally, the Beam acquisition
              expands CompanyCam into AI estimating, invoicing, and finance workflows while both companies still operate
              independently. Strategically that is exciting; operationally it adds integration, compliance, UX, and
              support risk before synergy is proven.
