  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Public evidence supports a five-layer view: field capture surfaces, structured project objects, AI/reporting,
      integration automation, and payment/security infrastructure.
    data:
      layers:
        - label: Field capture surfaces
          detail: >-
            iOS, Android, web, and the Chrome extension let crews and office users capture or insert photos, videos,
            notes, and documents from wherever work happens.
        - label: Structured project layer
          detail: >-
            Projects hold photos, videos, files, labels, pages, checklists, comments, and customer-facing reports as the
            system-of-record objects.
        - label: AI and workflow layer
          detail: >-
            Pages, summaries, walkthroughs, translations, captions, checklists, daily logs, and report-generation
            features automate the administrative side of documentation.
        - label: Integration and automation layer
          detail: >-
            Direct connectors, API keys, access tokens, open API references, Zapier automations, and browser upload
            interception move CompanyCam data into external CRMs, proposal tools, and storage systems.
        - label: Payments and trust layer
          detail: >-
            Stripe-powered payments, LexisNexis risk checks, AWS hosting, encryption, SOC 2 / GDPR / CCPA controls, and
            public status tooling provide the monetization and trust backbone.
    approximationNotes: >-
      CompanyCam does not publish a formal internal architecture diagram. The stack is reconstructed from product pages,
