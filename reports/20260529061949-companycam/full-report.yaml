      - number: '8.3'
        title: Recommendation, scenario ranges, and the anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The recommendation should remain price-sensitive, not admiration-sensitive. CompanyCam is clearly a real
              company with category strength, customer love, investor quality, and credible optionality around AI and
              payments. That is the thesis. The anti-thesis is that the company may still be excellent while the 2025
              price is already too rich for a new investor who lacks private retention, current ARR, chargeback, or
              concentration data. A sensible recommendation is therefore Track with medium confidence and a stretched
              valuation stance. In the bull case, CompanyCam has already grown well beyond Latka’s 2024 estimate, Beam
              meaningfully increases monetization, and the market rewards it as a payment-enabled vertical integrator;
              that can justify roughly $2.0–$3.0 billion. In the base case, the company remains strong but more like a
              premium field-management or workflow platform, supporting perhaps $1.2–$1.8 billion. In the bear case,
              customer concentration, macro contractor softness, or multiple compression drag fair value toward roughly
              $0.6–$1.1 billion. The gap between those scenarios is not just a math range; it is a data-quality range.
              Until updated ARR, retention, and fintech metrics are supplied, the prudent stance is to track the asset
              rather than underwrite the 2025 headline round as if it were a refreshed public-market-clearing price.
