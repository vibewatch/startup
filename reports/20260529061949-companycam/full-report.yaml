      - number: '3.2'
        title: 'Direct substitutes: Jobber, Housecall Pro, FieldPulse, and SafetyCulture'
        blocks:
          - type: paragraph
            body: >-
              Among direct SMB alternatives, Jobber is the broadest threat because it packages scheduling, dispatch,
              invoicing, payments, and customer management in one system while still integrating with CompanyCam for
              teams that want specialized documentation. Housecall Pro follows a similar pattern: it is easy to
              understand commercially, starts with a visible low-end plan, and gives owners a single operating layer for
              booking through invoicing, but its functionality expands only after buyers move up to more expensive tiers
              and add-ons. FieldPulse is more nuanced. It competes for the same small and midsize trades accounts, but
              partner evidence also shows the two products coexist well when a buyer wants stronger field documentation
              attached to jobs and estimates. SafetyCulture is less of a one-for-one substitute and more of an
              inspection-driven alternative for teams that prioritize checklists, reports, tasks, and operational
              improvement. In practice, CompanyCam is most exposed where a contractor values convenience and vendor
              consolidation over documentation depth, and least exposed where stamped visual proof is mission-critical.
            claimRefs:
