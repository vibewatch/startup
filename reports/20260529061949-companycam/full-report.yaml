      - number: '7.4'
        title: People, macro, and thesis-break monitoring
        blocks:
          - type: paragraph
            body: >-
              The final risk cluster is the combination of execution and end-market exposure. Public CompanyCam coverage
              is still heavily founder-centered, so Luke Hansen remains a visible key-person dependency even after the
              Series C. The careers page also points to a remote, AI-forward workforce spread across all U.S. time
              zones. That is not inherently negative, but it raises coordination and change-management demands at
              exactly the moment the company is broadening from documentation into payments and Beam-enabled finance.
              Macro conditions make this more important. AGC’s 2026 outlook shows meaningfully weaker contractor
              sentiment than a year earlier, with recession concerns, labor shortages, immigration enforcement, tariffs,
              and expensive or uncertain funding all pressuring project activity. If contractor budgets tighten,
              discretionary or semi-discretionary software modules can feel pressure quickly. The right response is not
              to call the thesis broken today; it is to define what would break it. Repeated material app or Pages
              incidents, evidence of reserve/chargeback stress in payments, failure to attach Beam into customer
              workflows, large deterioration in review sentiment, or hard data showing concentrated exposure to weak
              contractor segments would all materially change the underwriting view. Those are the monitoring indicators
              that matter more than abstract “medium risk” labels.
