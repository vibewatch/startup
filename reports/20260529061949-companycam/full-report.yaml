  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              CompanyCam’s relevant market is not the full construction-software stack. The company’s own surfaces
              consistently describe a contractor workflow centered on capturing jobsite evidence, organizing it
              automatically, keeping crews aligned, and sharing proof of progress with clients. Roofing and restoration
              pages reinforce that the incumbent substitute is usually not another sophisticated platform but a messy
              bundle of emails, text threads, camera rolls, and generic cloud folders. That makes the category narrower
              than broad construction-management software and closer to field documentation, communication, and
              proof-of-work for specialty trades, home-service contractors, and multi-crew operators that need visual
              records to reduce disputes. Adjacent spend still matters. CompanyCam now pairs the wedge with AI,
              payments, marketing, and integrations, while much larger suites such as Procore, Fieldwire, Buildertrend,
              and Autodesk increasingly bundle photo, report, document, and field-to-office workflows into broader
              operating systems. For valuation, that means the right boundary is a defendable documentation workflow
              inside construction and home-service operations, not the entire BIM, scheduling, budgeting, and
              enterprise-control universe.
            claimRefs:
