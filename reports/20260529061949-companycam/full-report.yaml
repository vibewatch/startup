      - number: '2.3'
        title: Buyer, User, and Payer Segmentation Favors Specialty Contractors and Field-Centric Teams
        blocks:
          - type: paragraph
            body: >-
              The buyer map is more nuanced than ‘construction company’ as a single segment. CompanyCam’s packaging and
              industry pages suggest at least five meaningful segments: owner-operated trade shops, multi-crew specialty
              contractors, roofing and restoration firms, larger general-contractor or specialty-contractor teams that
              need office-field coordination, and multi-location or franchise networks that want standard workflows. In
              most of those cases, the end user is a foreman, technician, or crew member in the field, while the budget
              owner is an owner, operations lead, admin, or regional manager. Homeowners, property managers, and
              insurers are usually consumers of reports rather than the actual software payer. Adoption is triggered
              when field teams need proof that work was performed, proof of preexisting conditions, faster progress
              updates, and easier handoffs back to the office. CompanyCam’s home-service adjacency matters here: it
              widens the top of funnel beyond traditional commercial construction and makes the core buying motion look
              more like contractor workflow software than enterprise PMO software.
