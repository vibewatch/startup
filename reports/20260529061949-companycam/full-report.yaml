  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Current ARR / MRR
        - 2025 and 2026 revenue or ARR run rate with recognition basis
        - Every valuation method is unstable without a current top-line anchor.
        - Request management metrics sheet or audited financial excerpt.
      - - Retention and contract quality
        - NRR, GRR, logo churn, contract length, and annual-vs-monthly mix
        - Determines whether CompanyCam deserves a public-comp premium or a discount.
        - Request cohort pack segmented by plan and account size.
      - - Payments / Beam economics
        - GMV, take rate, attach rate, reserve incidence, chargeback rate, and Beam cross-sell metrics
        - Needed to test whether the fintech narrative is value-accretive or merely complexity-accretive.
        - Request payments dashboard and Beam integration KPI pack.
      - - Cap table and preferences
        - 2025 Series C security terms, liquidation preferences, secondaries, and ownership concentration
        - Private-round economics can materially change real entry value versus headline post-money.
        - Request cap table summary and financing term sheet highlights.
      - - Customer concentration
        - Revenue by trade, geography, account size, and top logos
        - Needed to test resilience in a contractor-market slowdown.
        - Request concentration table from finance / RevOps.
      - - Current independent market check
        - Primary investor or secondary-market indication of where the stock would clear today
        - Tests whether the 2025 mark is still current or stale.
        - Obtain latest broker, investor, or board-mark context.
    notes: These are the minimum data requests required to upgrade the call from Track to Buy-like conviction.
