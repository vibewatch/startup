  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context, market support, and what the current mark actually means
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong enough to say that CompanyCam was re-rated in 2025, but not strong enough to say
              the market would still clear at the same mark today. CompanyCam’s own Series C messaging, echoed by
              William Blair and Nebraska press, established B Capital as lead investor and largest external backer, with
              Decades Holdings joining a well-known prior syndicate. Flatwater Free Press, Omaha Daily Record,
              PitchBook, and Premier Alternatives all support a roughly $415 million round at a $2 billion valuation,
              which also made CompanyCam Nebraska’s first unicorn. Premier Alternatives adds total capital raised of
              $452.4 million and a 4.40x valuation-to-funding ratio, which is respectable but not extraordinary for
              growth software. The key qualification is that the valuation support is partly historical and partly
              conflicting. Omaha Magazine later used a $1.5 billion figure for the same 2025 milestone, reminding us
              that private marks are not as clean as public market caps. The 2021 Form D confirms that at least one
              prior round had a formal security issuance, while the 2025 mega-round almost certainly created a much more
              meaningful preference and dilution stack that is not publicly disclosed. The right read is therefore: the
              $2 billion mark was real enough to cite, but it is not sufficiently refreshed or fully explained to treat
              it as today’s unquestioned intrinsic value.
            claimRefs:
              - CV001
              - CV002
              - CV003
