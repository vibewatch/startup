      - number: '8.4'
        title: Final diligence asks, valuation-upgrade conditions, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              CompanyCam can still earn a higher-conviction call, but only with a short list of missing facts. The most
              important missing input is current ARR or revenue run rate for 2025 and 2026; without that, every multiple
              argument is forced to lean on a 2024 Latka estimate and scenario inference. The second missing input is
              customer durability: NRR, GRR, churn, contract length, and enterprise-vs-SMB mix would tell us whether
              CompanyCam deserves a premium multiple or only a good-company discount to public comps. Third, the Beam
              and payments thesis requires hard operating data — GMV, take rate, payments attach, chargebacks, reserves,
              and product-convergence milestones. Fourth, the cap table matters. A $415 million round after earlier VC
              financing likely implies meaningful preference, liquidity, or dilution complexity that the current public
              record does not show. The triggers that would upgrade the recommendation are equally straightforward:
              proof that current ARR is comfortably above $100 million, evidence of healthy retention, credible fintech
              attach, and no emerging concentration issue. The thesis-break triggers are the inverse: evidence that the
              real mark was closer to Omaha Magazine’s $1.5 billion than the oft-cited $2 billion, continued public-comp
              compression without offsetting growth, or new product, payments, or concentration data that compresses the
              justified multiple faster than growth expands revenue.
