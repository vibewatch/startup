tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to CompanyCam
  rows:
  - - Stand-alone jobsite documentation software
    - Mobile photo, video, markup, sharing, reports, and proof-of-work workflows
    - Full ERP, accounting, BIM authoring, enterprise cost-control suites
    - Contractor owner, ops lead, or field admin pays; crews use
    - Core wedge that matches CompanyCam's original problem statement
  - - Roofing and restoration documentation
    - Before-and-after evidence, homeowner updates, insurance support, and dispute defense
    - General marketing spend or full-service call-center software
    - Trade business pays; homeowner consumes output
    - Explicit vertical fit on CompanyCam's own pages
  - - SMB and mid-market specialty contractor field ops
    - Crew coordination, project timelines, comments, galleries, and office-field alignment
    - Generic office collaboration tools not tied to jobsites
    - Owner or office manager pays; crews and PMs use
    - Most natural buyer motion for CompanyCam's mobile-first workflow
  - - Enterprise and franchise standardization
    - Cross-location workflow templates, centralized sharing, and accountability
    - Company-wide back-office systems that do not capture field evidence
    - Regional ops or franchise admin pays; local teams use
    - Shows the wedge can scale beyond very small crews
  - - Broader construction-management suites
    - Project execution, document management, inspections, AI, and field reporting with photos embedded
    - Stand-alone photo documentation is only one module within the suite
    - Construction software buyer pays; multiple departments use
    - Important adjacency because it bundles substitute capabilities
  - - Status-quo substitutes
    - Texts, emails, personal camera rolls, Google Drive, paper notes, and ad hoc folders
    - Dedicated structured photo platforms
    - No software budget line or only cheap general tools
    - Still the most common incumbent in small contractor workflows
  notes: The boundary is defined by workflow and proof-of-work need, not by every software dollar spent in construction. The broader-suite and status-quo rows matter because they shape CompanyCam demand even when they are not stand-alone TAM pools.
