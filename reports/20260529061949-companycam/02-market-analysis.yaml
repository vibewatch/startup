  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: som-gap
    missingEvidence: Current customer count, seat count, ARPU, and revenue mix by contractor segment.
    whyItMatters: Without these fields, public TAM/SAM evidence cannot be translated into a defensible obtainable-market model or penetration rate.
    diligencePath: Request an investor or management data pack with current logos, paid seats, ARPU, net revenue retention, and segment revenue mix.
    relatedQuestionRefs:
    - QM010
    - QM024
    - QM025
  - type: missing-source
    severity: material
    topic: documentation-budget-line-item
    missingEvidence: A public study that isolates stand-alone construction photo-documentation spend rather than broader project-management or document-control software.
    whyItMatters: The absence of a pure category study forces the chapter to use mixed revenue and workforce proxies that are less precise for valuation.
    diligencePath: Ask management and customers how documentation software is budgeted, whether it is line-itemed separately, and what alternatives were evaluated.
    relatedQuestionRefs:
    - QM009
    - QM024
  - type: private-evidence-only
    severity: material
    topic: segment-exposure
    missingEvidence: CompanyCam revenue mix by roofing, restoration, general construction, home service, SMB, and enterprise cohorts.
    whyItMatters: Segment mix determines how macro construction cycles, insurance restoration, and home-service demand actually flow into revenue quality.
    diligencePath: Request cohort revenue by vertical, employee bucket, and customer maturity plus churn and upsell trends by segment.
    relatedQuestionRefs:
    - QM023
    - QM026
  - type: conflicting-data
    severity: minor
    topic: tam-variance
    missingEvidence: Methodology notes that reconcile why analyst market estimates diverge so widely on the same 2026 software category.
    whyItMatters: Different definitions can mislead valuation work if a single headline TAM is repeated without boundary logic.
    diligencePath: Cross-check analyst definitions against module scope, geography, and end-user coverage before using any one figure in valuation work.
    relatedQuestionRefs:
    - QM008
