company:
  name: CompanyCam
chapter:
  number: 2
  title: Market Analysis
  summary: 'CompanyCam participates in a narrower market than broad construction-management software: a mobile, field-first documentation and proof-of-work layer for contractors, specialty trades, and adjacent home-service operators. Public 2026 TAM signals are strong but inconsistent, with broad construction-management-software estimates spanning USD 8.18 billion to USD 12.92 billion, while a more decision-useful SAM proxy comes from the 5.249 million U.S. specialty-trade workers whose workflows depend on jobsite evidence and field-office coordination. Labor scarcity, AI adoption, mobile/cloud workflows, and compliance-linked documentation needs all support demand, but bundled competition from Procore, Fieldwire, Buildertrend, and Autodesk and missing public data on CompanyCam''s segment mix prevent a precise public SOM.'
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: CompanyCam’s relevant market is not the full construction-software stack. The company’s own surfaces consistently describe a contractor workflow centered on capturing jobsite evidence, organizing it automatically, keeping crews aligned, and sharing proof of progress with clients. Roofing and restoration pages reinforce that the incumbent substitute is usually not another sophisticated platform but a messy bundle of emails, text threads, camera rolls, and generic cloud folders. That makes the category narrower than broad construction-management software and closer to field documentation, communication, and proof-of-work for specialty trades, home-service contractors, and multi-crew operators that need visual records to reduce disputes. Adjacent spend still matters. CompanyCam now pairs the wedge with AI, payments, marketing, and integrations, while much larger suites such as Procore, Fieldwire, Buildertrend, and Autodesk increasingly bundle photo, report, document, and field-to-office
    workflows into broader operating systems. For valuation, that means the right boundary is a defendable documentation workflow inside construction and home-service operations, not the entire BIM, scheduling, budgeting, and enterprise-control universe.
  claimRefs:
  - CM001
  - CM002
  - CM004
  - CM005
