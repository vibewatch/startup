    - label: Broad 2026 construction management software TAM
      value: USD 8.18B to USD 12.92B
      detail: Range across FMI, Mordor, and Fortune for the global construction management software market; useful for outer TAM context but materially broader than photo documentation.
    - label: U.S. specialty-trade field-user SAM proxy
      value: 5.249M employees
      detail: BLS and FRED specialty trade employment provides a nearer-term proxy for field users whose workflows require proof-of-work and site evidence.
    - label: CompanyCam disclosed reachable motion
      value: 50+ trades and tens of thousands of businesses
      detail: CompanyCam's own segment disclosures suggest a broad SMB-to-enterprise contractor motion, but not enough public data to convert that reach into a precise SOM.
  approximationNotes: This is a constrained lens, not a pure revenue cascade. It intentionally mixes revenue, workforce, and disclosed reach because no public source isolates stand-alone construction photo-documentation revenue with enough precision for a strict TAM/SAM/SOM waterfall.
