callouts:
- calloutType: insight
  title: The best TAM frame is workflow-specific, not software-stack maximalist
  body: Broad construction-management-software revenue estimates prove the category is meaningful, but they are too wide to stand in for CompanyCam's actual field-documentation opportunity. The specialty-trade workforce and proof-of-work workflow are more decision-useful SAM anchors.
  claimRefs:
  - CM015
  - CM016
  - CM019
  - CM021
- calloutType: risk
  title: Bundled suites can cap stand-alone pricing power
  body: CompanyCam benefits from a simple mobile wedge, but Procore, Fieldwire, Buildertrend, and Autodesk all market overlapping documentation and AI-enabled field workflows. If those suites keep closing the usability gap, CompanyCam may need expansion modules to defend wallet share.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM028
  - CM047
- calloutType: assumption
  title: Public SOM precision is not possible yet
  body: The public record supports a large enough market and a real adoption problem, but not a precise obtainable-market model. Without current customer count, seat count, ARPU, and segment mix, the right move is to preserve the gap rather than manufacture a false SOM.
  claimRefs:
  - CM024
  - CM050
