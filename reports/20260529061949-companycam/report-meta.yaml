companyProfile:
  summary: >
    CompanyCam is a Lincoln, Nebraska-based SaaS company founded in summer 2015 by Luke Hansen.
    The platform enables contractors to capture, organize, share, and report on jobsite photos and project
    documentation, with AI-assisted features for progress tracking, report generation, and team communication.
    CompanyCam integrates with 60+ contractor tools including ServiceTitan, Salesforce, QuickBooks, and
    JobNimbus. As of mid-2026, the platform serves 285,000+ professionals across 79 million jobsite photos.
    The company achieved unicorn status—Nebraska's first—with the August 2025 Series C of $415 million led
    by B Capital and Decathlon Capital, reaching a ~$2.0 billion post-money valuation. ARR grew approximately
    2x from $32 million (December 2023) to $68 million (2024). In March 2026, CompanyCam acquired Beam
    Finance to add AI-driven estimating and financing capabilities for contractors.
  foundedDate: "2015-06-01"
  founders:
    - name: "Luke Hansen"
      role: "Founder & CEO"
      background: "Built CompanyCam from a personal frustration with contractor photo management in Lincoln, NE; has led the company through Series A, B, and C with no CEO transition."
