    sales. Beam Finance acquisition (March 2026) adds AI estimating and contractor financing capabilities.
  customerFocus: "SMB and mid-market contractors in roofing, restoration, construction, and specialty trades; enterprise contractors via dedicated CSM tiers."
  businessModel: "Per-seat SaaS with tiered pricing (Pro/Premium/Elite) and contact-sales Enterprise; expanding into fintech through Beam Finance acquisition."
