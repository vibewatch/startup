company:
  name: CompanyCam
chapter:
  number: 6
  title: Customers
  summary: 'CompanyCam’s customer evidence points to a broad but still construction-heavy base: official surfaces say tens of thousands of contracting businesses and 285,000+ pros now use the platform across 79 million jobs, while industry pages and case studies show adoption across roofing, restoration, painting, solar, landscaping, HVAC, plumbing, and general contracting. The strongest named proof is production usage rather than pilots — Reliant Roofing publishes user, project, photo, and report counts plus a claimed $50,000 annual labor saving — and review platforms consistently cluster around 4.6–4.8 stars. The main diligence problem is not whether customers like the product; it is that CompanyCam still does not disclose retention cohorts, contract length, or concentration data, so durability must be inferred from reviews, case studies, and product breadth rather than from hard cohort math.'
sections:
- id: segments-and-buyer-map
  title: Customer segmentation, buyer/user split, and use cases
  body: CompanyCam’s customer footprint is broad within its chosen vertical and narrow outside it. The public industry pages now span roofing, restoration, painting, solar, landscaping, HVAC, plumbing, and general contracting, and the homepage still frames the product as useful across 50+ trades. That breadth matters because it suggests the company has escaped pure-roofing-single-vertical risk, but it is still overwhelmingly concentrated in contractor and home-service workflows rather than in horizontal enterprise software. The buyer/user/payer pattern also appears consistent. Owners, operations leads, or office admins typically choose and pay for the software; project managers, crews, estimators, and subcontractors become the daily users; and homeowners, adjusters, or office stakeholders are downstream viewers of reports, galleries, and proof-of-work links. Enterprise packaging reinforces that segmentation logic. CompanyCam’s enterprise page promises dedicated onboarding, priority support,
    integration help, and a single point of contact, while the public pricing page keeps the self-serve floor at small teams. In other words, CompanyCam looks like a product-led contractor tool with a growing enterprise wrapper, not a top-down enterprise suite that later added SMB. The main jobs-to-be-done are proving what happened on site, reducing office-field communication friction, speeding issue resolution, protecting against disputes, and turning completed work into marketing fuel.
