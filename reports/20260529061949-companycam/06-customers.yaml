tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - scale / evidence
  - revenue / strategic value
  - gap
  rows:
  - - Roofing contractors
    - Owner or ops lead / PMs, crews, sales / contractor business
    - Photo proof, homeowner updates, before-after galleries, dispute defense
    - Dedicated roofing page plus multiple named roofing testimonials and Reliant case study
    - Largest and best-evidenced trade segment; likely core revenue base
    - No disclosed share of ARR by roofing vs other trades.
  - - Restoration contractors
    - Owner or PM / field crews / restoration company
    - Documentation, communication, and repeatable job records for damage-heavy work
    - Dedicated restoration page
    - Strategically important because documentation quality is naturally critical in restoration
    - No named restoration case study beyond BK enterprise outcome snippet.
  - - Painting contractors
    - Owner / painters and PMs / contractor business
    - Visual progress proof, report sharing, customer communication
    - Dedicated painting page
    - Extends proof-of-work logic beyond roofing-adjacent trades
    - No published adoption count by painting vertical.
  - - Solar installers
    - Owner / field techs and crews / installer
    - Installation documentation, reporting, and job visibility
    - Dedicated solar page
    - Shows fit with project-based home-improvement trades
    - No named solar customer outcome in reviewed pack.
  - - Landscaping / tree / outdoor services
    - Owner / field crews / contractor business
    - Visual proof, communication, and marketing galleries
    - Dedicated landscaping page plus Artistic Tree & Landscape testimonial
    - Broadens TAM beyond home exterior construction
    - No segment-level retention disclosure.
  - - HVAC / plumbing / general contractors
    - Owner or office admin / techs and crews / contractor business
    - Dispatch-adjacent photo proof, customer reporting, centralized records
    - Dedicated HVAC, plumbing, and general-contracting pages plus Terrytown quote
    - Evidence that CompanyCam sells into service and light-commercial trades, not only roofers
    - Public proof is quote-heavy rather than metric-heavy.
  - - Enterprise multi-crew contractors
    - Ops leader or admin / crews, subcontractors, office staff / contractor business
    - Standardization, onboarding, integrations, support, and jobsite visibility at scale
    - Dedicated enterprise page for 50+ employee firms
    - Supports expansion into larger accounts without abandoning SMB product roots
    - No public enterprise-seat mix or ACV distribution.
  notes: Segments are grouped by public evidence strength, not by internal revenue buckets. Buyer/user/payer assignments are inferred from plan design, enterprise packaging, and testimonial context.
