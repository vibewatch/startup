  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-retention-cohorts
    missingEvidence: Any public NRR, GRR, logo-churn, renewal-rate, or cohort-retention table segmented by trade, plan, or account size.
    whyItMatters: Customer love is visible, but durability is still inferential without cohort data.
    diligencePath: Request monthly and annual retention cohorts, renewal rates, and churn by trade and plan.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Public disclosure of top-customer revenue share, top-vertical revenue share, or geographic revenue concentration.
    whyItMatters: A contractor-focused platform can look broad in user counts while still being concentrated in a few trades or accounts.
    diligencePath: Request customer-concentration tables by logo, trade, geography, and channel partner.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU005
  - type: access-blocked
    severity: minor
    topic: formal-complaint-surface
    missingEvidence: A clean, company-specific BBB or equivalent formal complaint record.
    whyItMatters: The reviewed pack showed rich review-platform evidence but weak formal complaint visibility.
    diligencePath: Repeat BBB and attorney-general searches using address variants, older entity names, and state-level complaint portals.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU006
  - type: private-evidence-only
    severity: minor
    topic: enterprise-commercials
    missingEvidence: Public enterprise seat counts, contract value, and onboarding-to-renewal conversion metrics.
    whyItMatters: Enterprise support is visible, but the economic importance of enterprise accounts is still unknown.
    diligencePath: Request enterprise ACV, seat distribution, and renewal metrics by account size.
    relatedQuestionRefs:
    - QU003
    - QU018
    relatedTableRefs:
    - TU001
    - TU003
    - TU005
