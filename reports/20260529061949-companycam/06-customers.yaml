callouts:
- calloutType: strength
  title: Customer proof is unusually concrete for a private contractor SaaS company
  body: Reliant Roofing’s case study includes users, photos, projects, reports, and a claimed $50,000 annual saving, while enterprise and industry pages add named quotes across roofing, restoration, plumbing, and landscape contractors. That is stronger than a pure logo wall.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU037
- calloutType: strength
  title: Satisfaction is consistent across multiple review surfaces
  body: App Store, Google Play, G2, Software Advice, and GetApp all cluster around mid-to-high 4-star averages, which suggests CompanyCam’s usefulness is not a one-platform artifact.
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU040
- calloutType: risk
  title: Durability is still mostly inferred because no public cohort or renewal data exists
  body: There is no public NRR, GRR, churn, contract-length, or top-customer concentration disclosure. Later underwriting will have to treat retention as a diligence ask rather than a proven fact.
  claimRefs:
  - CU029
  - CU030
  - CU040
- calloutType: risk
  title: Adverse reviews point to product-quality and pricing friction
  body: Crashes, UI changes, iPhone performance issues, tricky job merging, and price complaints recur often enough to matter. These do not outweigh the strong headline ratings, but they do qualify the customer-quality picture.
  claimRefs:
  - CU033
  - CU034
  - CU035
  - CU040
