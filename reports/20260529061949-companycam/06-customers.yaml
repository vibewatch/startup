- id: satisfaction-and-durability
  title: Satisfaction, retention proxies, and what remains unknown
  body: 'Customer satisfaction is one of the cleaner parts of the evidence base. The iOS App Store sits at 4.8/5 from 26,000 ratings and Google Play at 4.6/5 from 6.53K reviews. G2 also shows 4.6/5, Software Advice 4.7/5 with 4.4 customer support and 4.5 value for money, and GetApp 4.7/5 from 99 verified reviews with strong ease-of-use and mobile-access scores. Taken together, that is enough to say customers generally value the product and that the product is not dependent on one flattering marketplace. GetApp also adds useful segment texture: the review mix spans small, midsize, and enterprise businesses, while construction and contractor-management use cases dominate. What the public record still does not provide is classical durability evidence. There is no public NRR, GRR, churn, renewal rate, contract-length table, or cohort analysis by trade or plan. As a result, durability must be inferred from review consistency, the breadth of use cases, customer quotes around habit formation, and
    the practical pain of going back to SD cards, email chains, and disconnected cloud folders. That is directionally positive, but it is not a substitute for a real retention pack.'
  claimRefs:
