- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Office-field standardization
    - Roofing-heavy named proof set
    - Strong fit in roofing may obscure weaker economics in adjacent trades
    - Request revenue mix and retention by trade vertical.
  - - Collaborator access and enterprise onboarding
    - SMB contractor concentration
    - Self-serve SMB growth can be strong but more seasonal and price-sensitive
    - Request ACV mix, seat expansion rates, and churn by account size.
  - - Integrations into CRM / proposal stack
    - Partner dependence
    - Stickiness rises with partner integrations, but connector failures can hurt adoption
    - Request usage frequency and retention lift for integrated vs non-integrated accounts.
  - - Marketing Suite and review collection
    - ROI proof still self-reported
    - Expansion into marketing may help retention but public conversion data is absent
    - Request attach rate and ROI metrics for marketing add-ons.
  - - Payments and Beam finance layer
    - Unknown adoption curve
    - Fintech modules may deepen monetization but also raise support/compliance burden
    - Request payments attach rate, GMV, and Beam cross-sell conversion.
  - - Word-of-mouth referrals
    - Geographic concentration risk
    - Referral-heavy growth can be durable in core markets but weaker outside contractor clusters
    - Request geographic logo mix and expansion performance outside core states.
  notes: The public surface makes the expansion story visible, but not quantifiable. Every row therefore pairs a plausible expansion loop with the concentration or disclosure risk that still blocks underwriting.
  claimRefs:
  - CU030
  - CU031
  - CU032
  - CU036
  - CU038
  - CU039
  - CU042
- id: TU006
  title: Adverse customer signal table
  columns:
  - source
  - signal
  - segment
  - implication
  - diligence ask
  rows:
  - - Software Advice
    - Price is high; app crashes; merging jobs can lose notes or communication
    - Review-site users
    - Reliability and price perception can weaken retention even when headline ratings are strong
    - Request support ticket volume, crash-rate trend, and pricing-objection win/loss data.
  - - Google Play
    - New interface and file-view issues created headaches and delays for a long-time user
    - Android field users
    - UI changes can directly slow live jobs in the field
    - Request release-quality metrics and rollback process.
  - - G2
    - iPhone performance, navigation/back-button friction, and inconsistent AI noted in dislikes
    - B2B review-site users
    - Daily usability and AI consistency remain active product risks
    - Request complaint trend by feature area and platform.
  - - GetApp feature ratings
    - Third-party integrations 3.5, API 3.7, field payment collection 3.0
    - Verified review-site users
    - Secondary features may be less sticky than core mobile access and reporting
    - Request feature usage and renewal correlation by module.
  - - BBB search
    - No direct CompanyCam result surfaced in the reviewed pack
    - Formal complaint visibility
    - Absence of a result is not proof of no complaint history
    - Repeat BBB and state AG checks with company aliases and address variants.
  - - Public retention disclosure
    - No NRR, GRR, churn, or contract-length disclosure
    - All customers
    - Durability remains partly inferential rather than measured
    - Request cohort tables and renewal history by trade and plan.
  notes: 'Adverse signals are real but mostly operational rather than existential: price, crashes, interface changes, and documentation gaps. The table preserves those frictions instead of letting headline star ratings dominate the narrative.'
  claimRefs:
