- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Current revenue already well above $150M, Beam meaningfully deepens monetization, and CompanyCam proves payment-enabled workflow integration.
    - At roughly 12–15x $150–200M revenue, enterprise value can justify about $2.0–$3.0B.
    - Requires fast growth and strong attach without operational blowback.
    - Possible, but not yet proven by public metrics.
  - - Base
    - CompanyCam is a strong contractor workflow company, but public comps and missing retention data cap justified premium.
    - At roughly 10–13x $110–140M revenue, fair value looks more like about $1.2–$1.8B.
    - Needs better current ARR proof just to defend this base.
    - Most evidence-consistent case today.
  - - Bear
    - Growth is slower than the market assumes, Beam/payout economics disappoint, and public multiples compress further.
    - At roughly 7–9x $75–120M revenue, value compresses toward about $0.6–$1.1B.
    - Contractor slowdown, bundle competition, or concentration could accelerate rerating.
    - Non-trivial if current ARR is still near stale public anchors.
  notes: Scenarios are intentionally wide because the missing-current-ARR problem creates a data-quality range, not just a market-volatility range.
