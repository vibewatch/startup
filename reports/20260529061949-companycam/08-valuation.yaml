- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - what supports it
  - what would change the view
  rows:
  - - 'Thesis: category-leading contractor workflow platform'
    - Strong customer proof, rapid user growth, major Series C, and AI/payments optionality.
    - Updated ARR and retention proving the premium narrative would strengthen this materially.
  - - 'Thesis: payments and Beam justify a higher-quality multiple'
    - Windsor Drake says payment-enabled construction SaaS can command material premium multiples.
    - Public evidence of attach rate, GMV, and Beam integration success would validate the premium.
  - - 'Anti-thesis: the 2025 mark is ahead of public fundamentals'
    - Latka’s 2024 $68M revenue anchor makes $2B look extremely expensive on a trailing basis.
    - A much higher current ARR/revenue run rate would blunt this objection.
  - - 'Anti-thesis: private marks are not cleanly refreshed'
    - Omaha Magazine’s $1.5B figure conflicts with the more common $2B mark.
    - Management or investor reconciliation of the exact 2025 valuation mechanics would reduce uncertainty.
  - - 'Anti-thesis: retention and concentration are still opaque'
    - No public NRR, GRR, churn, contract term, or concentration tables exist.
    - A customer-cohort and concentration pack would directly improve confidence.
  - - 'Anti-thesis: public comps have compressed'
    - Procore and ServiceTitan are trading at much lower sales multiples than CompanyCam’s implied private mark.
    - Faster CompanyCam growth, higher margins, or stronger fintech mix would justify the premium better.
  notes: The anti-thesis is not that CompanyCam is weak; it is that price support is still weaker than company-quality support.
