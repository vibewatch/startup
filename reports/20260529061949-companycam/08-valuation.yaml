company:
  name: CompanyCam
chapter:
  number: 8
  title: Valuation
  summary: 'The public record supports that CompanyCam entered a new valuation regime in August 2025: multiple independent sources place the Series C at roughly $415 million and a $2 billion valuation, while Premier Alternatives now shows $452.4 million total capital raised and a 4.40x valuation-to-funding ratio. The valuation question is not whether the 2025 mark existed; it is whether it is still justified without updated ARR, retention, payments-attach, and cap-table evidence. Using the only public revenue anchor in the pack — Latka’s $68 million 2024 revenue estimate — the $2 billion mark looks stretched relative to public comps such as Procore and ServiceTitan, and only becomes more defensible if CompanyCam has already grown materially beyond that anchor and if Beam/payments meaningfully deepen monetization.'
sections:
- id: financing-context-and-price-support
  title: Financing context, market support, and what the current mark actually means
  body: 'Public evidence is strong enough to say that CompanyCam was re-rated in 2025, but not strong enough to say the market would still clear at the same mark today. CompanyCam’s own Series C messaging, echoed by William Blair and Nebraska press, established B Capital as lead investor and largest external backer, with Decades Holdings joining a well-known prior syndicate. Flatwater Free Press, Omaha Daily Record, PitchBook, and Premier Alternatives all support a roughly $415 million round at a $2 billion valuation, which also made CompanyCam Nebraska’s first unicorn. Premier Alternatives adds total capital raised of $452.4 million and a 4.40x valuation-to-funding ratio, which is respectable but not extraordinary for growth software. The key qualification is that the valuation support is partly historical and partly conflicting. Omaha Magazine later used a $1.5 billion figure for the same 2025 milestone, reminding us that private marks are not as clean as public market caps. The 2021 Form D confirms that at least one prior round had a formal security issuance, while the 2025 mega-round almost certainly created a much more meaningful preference and dilution stack that is not publicly disclosed. The right read is therefore: the $2 billion mark was real enough to cite, but it is not sufficiently refreshed or fully explained to treat it as today’s unquestioned intrinsic value.'
