- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Product
  - List-price signal
  - User model
  - Included scope
  - Pricing friction
  - Implication
  rows:
  - - CompanyCam
    - $79 / $129 / $199 per month
    - 3 users included on paid plans; +$29 each extra user
    - Specialist visual documentation, AI add-ons, collaborator access on higher tiers
    - Seat expansion increases bundle cost quickly
    - Strong if documentation is the priority; weaker when buyers also need an FSM core
  - - Jobber
    - Independent reviews summarize core plans around $29-$149 per month; official site also shows higher team tiers
    - Single-user and multi-user team bundles
    - Scheduling, dispatch, invoicing, payments, customer management
    - Pricing expands with team tiers and add-ons
    - Competes well for SMBs that want one operating system
  - - Housecall Pro
    - $59 per month annual entry; many teams move to $149-$189+ tiers
    - Tiered FSM plans plus paid add-ons
    - Booking, dispatch, invoicing, quotes, review management
    - GPS, QuickBooks, proposals, and other needs can push actual monthly spend higher
    - Broad substitute, but total cost rises with operational complexity
  - - FieldPulse
    - Review coverage points to quote-led pricing around ~$89 per first user plus add-ons
    - Custom quote + per-user/add-on dynamics
    - FSM workflow, proposals, fleet or AI extras, integrations
    - Opaque pricing and add-on fatigue are recurring complaints
    - Competitive in breadth but weaker on transparency
  - - Buildertrend
    - Custom quote
    - Unlimited users
    - Project management, daily logs, invoicing, integrations
    - No public list rate in fetched text
    - Targets larger project-based teams rather than lightweight documentation buyers
  - - Procore
    - Custom quote
    - Unlimited users and data
    - Construction platform, support, training, security, document control
    - No list price; annual contract model
    - Competes on platform breadth and enterprise value, not entry affordability
  - - Tradify
    - $47 per user per month entry signal
    - Per-user pricing
    - Scheduling, quotes, invoices, pricing markups
    - Per-user cost and add-ons on higher tiers
    - Long-tail trades competitor with broader commercial workflow than CompanyCam
  - - Knowify
    - Tiered pricing page, but detailed public list prices were not surfaced in fetched text
    - Tiered service/subcontractor packages
    - Operational workflow plus equipment-tracking options
    - Limited pricing transparency in fetched extract
    - Relevant as an operations-layer alternative, not a photo-first peer
  notes: Pricing signals are drawn from official pages when surfaced clearly and supplemented by independent reviews when official pages are quote-driven or difficult to normalize. Table compares packaging logic, not negotiated enterprise discounts.
