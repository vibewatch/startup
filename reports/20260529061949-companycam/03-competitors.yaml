  evidenceGaps:
  - type: missing-source
    severity: material
    topic: category-market-share
    missingEvidence: A public category-level benchmark that breaks out construction photo-documentation software share separately from broader construction-management and FSM markets.
    whyItMatters: Without a dedicated niche-market denominator, CompanyCam's precise market share and relative concentration cannot be measured with confidence.
    diligencePath: Request analyst reprint or internal market-sizing work that isolates documentation-only spend, then cross-check it against CompanyCam customer and revenue data.
    relatedQuestionRefs:
