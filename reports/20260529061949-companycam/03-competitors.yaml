- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Primary target segment
  - Differentiation
  - Limitation vs CompanyCam
  rows:
  - - CompanyCam
    - Specialist documentation
    - Private specialist; independent review footprint smaller than broad suites
    - SMB contractors needing proof-of-work and client sharing
    - Time/GPS-stamped photo workflow, galleries, PDF reports, subcontractor sharing
    - Requires adjacent tools for dispatch, CRM, and invoicing
  - - Jobber
    - Direct FSM substitute
    - Software Advice cites 1,373 verified reviews; FieldCamp summarizes $29-$149/mo core plans
    - Home-service SMBs that want one operating system
    - Scheduling, dispatch, invoices, payments, customer management
    - Document management scores below category average in Software Advice
  - - Housecall Pro
    - Direct FSM substitute
    - Broad residential-service install base; starts at $59/mo annually
    - Residential trades wanting booking through payments
    - All-in-one booking, dispatch, invoicing, review management
    - Add-on creep and less specialized documentation depth
  - - FieldPulse
    - Direct / complementary FSM
    - Own site shows 4.8/5 and 2,537 reviews; FieldCamp cites ~ $79M total funding
    - Growing trade businesses with tailored workflows
    - Broad FSM plus CompanyCam partner integration
    - Quote-led pricing and reported offline / add-on friction
  - - SafetyCulture / iAuditor
    - Adjacent substitute
    - Operational improvement platform with inspections, reports, tasks, analytics
    - Inspection-heavy teams prioritizing compliance and checklists
    - Inspection and reporting workflows, document/task management
    - Not a contractor-specific FSM or dedicated photo collaboration layer
  - - Buildertrend
    - Indirect construction incumbent
    - Software Advice cites 2,481 verified reviews; unlimited-user custom-quote model
    - Builders, remodelers, specialty contractors with multi-phase projects
    - Project management, daily logs, invoicing, integrations
    - Less purpose-built for lightweight field photo proof as a standalone job
  - - Procore
    - Indirect construction incumbent
    - Official page says 3M+ users and unlimited-user custom quotes
    - Mid-market and enterprise construction teams
    - Version control, permissions, linking, unlimited storage, enterprise workflow breadth
    - Heavier implementation and platform complexity than CompanyCam
  - - ServiceTitan
    - Indirect service incumbent
    - Large trade-software incumbent with deep operational playbooks
    - Scaled residential service operators
    - Dispatch, automated checklists, reporting, customer communication
    - No specialist visual-documentation wedge in fetched sources
  notes: Scale and pricing signals mix official pages with independent review summaries because several competitors use quote-based pricing; the purpose is comparability, not perfect apples-to-apples valuation.
