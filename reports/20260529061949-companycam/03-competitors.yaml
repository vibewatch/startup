- id: TP004
  title: Review signal comparison
  columns:
  - Product
  - Fetched review signal
  - Review-base signal
  - Common praise
  - Common complaint
  rows:
  - - CompanyCam
    - FieldCamp reports roughly 4.7/5 on Capterra- and G2-style surfaces
    - FieldCamp cites 400+ Capterra reviews and 100+ G2 reviews; Software Advice comparison shows 102 reviews vs Procore
    - Ease of use, organized stamped photos, proof-of-work communication
    - Pricing scales quickly; buyers still need separate FSM tools
  - - Jobber
    - FieldCamp reports 4.4/5 on Capterra and 4.5/5 on G2
    - Software Advice references 1,373 verified reviews
    - Mobile workflow, invoicing, broad home-service coverage
    - Document management underperforms broader strengths
  - - Housecall Pro
    - FieldCamp reports 4.7/5 on Capterra and 4.3/5 on G2
    - FieldCamp synthesizes hundreds of verified reviews across major platforms
    - Broad FSM convenience, intuitive scheduling, professional invoices
    - Add-on cost creep, mixed app/support feedback
  - - FieldPulse
    - FieldCamp reports 4.6/5 on Capterra and 4.6/5 on GetApp; Software Advice overall rating 4.6
    - Software Advice shows 373 reviews; FieldPulse site highlights 2,537 reviews
    - Customer support and workflow breadth
    - Pricing opacity and offline / mobile friction
  - - Buildertrend
    - Software Advice emphasizes strong feature and support sentiment
    - Software Advice references 2,481 verified reviews and 82% positive customer-support sentiment
    - Issue management, real-time updates, scheduling, support
    - CRM and supplier-management ratings trail stronger project features
  - - Procore
    - Official pricing page shows 4.5 with 2,656 reviews plus large app-store footprints
    - Official page also shows 41K and 43K app-review footprints
    - Scale, collaboration, document controls, enterprise breadth
    - Heavier learning curve and budget burden than niche tools
  notes: Review evidence is triangulated from fetched independent summaries and accessible platform comparisons because some live G2/Capterra pages were bot-protected during this run. Counts and ratings are therefore directional but still useful for buyer-perception comparisons.
