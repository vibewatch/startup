- id: broader-platforms
  title: 'Indirect and incumbent platforms: Procore, Buildertrend, ServiceTitan, Zuper, Tradify, and Knowify'
  body: 'CompanyCam also competes against products that are not sold as photo apps at all. Procore and Buildertrend are the clearest examples in construction. Procore emphasizes version control, permissions, unlimited storage, and document linking across a much larger project stack, while Buildertrend targets builders and remodelers with quote-led pricing, unlimited users, daily logs, invoicing, and project management. ServiceTitan plays a similar role in residential trades, but from the service-operations side rather than the project-management side. Its pitch is dispatch, checklists, reporting, customer communication, and operational scale. Zuper, Tradify, and Knowify illustrate a long-tail convergence story: documentation no longer lives in isolation, because buyers can now get images, notes, estimates, invoices, and workflow automation from broader FSM tools. CompanyCam can still coexist with some of these platforms, especially Procore and FieldPulse, but the strategic risk is clear.
    Broader systems keep adding enough documentation to make a specialized tool feel optional unless CompanyCam preserves a visible UX edge.'
  claimRefs:
