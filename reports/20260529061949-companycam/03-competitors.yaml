    whyItMatters: Accessible live review-platform counts would tighten the review-comparison table and remove reliance on independent summaries or archived pages.
    diligencePath: Re-run fetches from a network profile that can clear the bot checks or obtain screenshots/exported review summaries from the platforms directly.
