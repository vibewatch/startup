  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: Public win-loss, churn, expansion, or attach-rate data showing how often CompanyCam is displaced by or bundled with Jobber, Housecall Pro, FieldPulse, or Procore.
    whyItMatters: The quality of CompanyCam's moat depends on whether integrations actually preserve retention or simply delay eventual suite consolidation.
    diligencePath: Ask management for cohort retention, attach-rate by integration partner, competitive loss reasons, and top replacement products over the last 12 months.
    relatedQuestionRefs:
