chapter:
  number: 3
  title: Competitors
  summary: CompanyCam is a specialist visual-documentation product competing most directly with SMB field-service suites such as Jobber, Housecall Pro, and FieldPulse, while larger indirect platforms such as Procore, Buildertrend, and ServiceTitan compete through broader workflow ownership. The durable advantage is CompanyCam's proof-of-work UX and integration layer; the main vulnerability is that many buyers can now get “good enough” photos inside broader systems that also own dispatch, invoicing, CRM, or document control.
sections:
- id: landscape-overview
  title: Competitive overview and category boundaries
  body: 'CompanyCam sits in a crowded but still structurally segmented market. The core buying job is simple: capture trustworthy field evidence, share it quickly, and keep crews, customers, subcontractors, and office staff aligned. The way buyers solve that job varies. Some prefer a specialist like CompanyCam that maximizes visual proof of work and client-ready photo reports. Others choose broader field service management suites such as Jobber, Housecall Pro, FieldPulse, or ServiceTitan because dispatch, quoting, invoicing, and CRM are more important than having the best photo workflow. A third set of buyers lives in project-centric construction systems such as Procore or Buildertrend, where document control, versioning, and broader project coordination matter more than mobile visual capture. SafetyCulture/iAuditor is an adjacent substitute for inspection-heavy teams that want checklists and reporting rather than a contractor-specific photo layer. This competitive map matters because CompanyCam
    wins on depth in one workflow while many rivals sell breadth across the entire operating stack, and 2026 market growth is strongest in those broader suite categories.'
  claimRefs:
  - CP001
  - CP018
  - CP019
  - CP020
  - CP022
  - CP026
  - CP027
  - CP035
