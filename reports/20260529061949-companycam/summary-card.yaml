  topStrengths:
    - >-
      Dominant contractor documentation platform with 285,000+ verified users, 60+ deep integrations, and network
      effects from shared project visibility—creating high switching costs in a fragmented SMB contractor market.
    - >-
      Proven ARR acceleration ($32M to $68M in 2024, ~2x growth) with Series C proceeds and Beam Finance acquisition
      providing fuel for fintech-adjacent expansion and enterprise up-market motion.
    - >-
      Tier-1 institutional backing (B Capital, Insight Partners, JMI Equity) with fresh $415M capital and a
      profitability-trajectory signal from the Series C press release reducing near-term dilution risk.
  topRisks:
    - >-
      Valuation multiple (~29x 2024 ARR) is expensive; requires ongoing 50%+ ARR growth to approach exit-multiple
      rationalization, and current ARR beyond 2024 data is not publicly disclosed.
    - >-
      SMB and contractor concentration creates cyclical exposure to construction activity slowdowns,
      interest-rate-driven homebuilding contraction, and insurance-claim volume cycles.
    - >-
      Platform bundling risk from ServiceTitan, Procore, and other construction management incumbents adding
      photo-documentation and AI-report features that could commoditize CompanyCam's core workflow.
  unresolvedGaps:
    - >-
      Current ARR post-Series C (late 2025 or early 2026); the only public data point is the 2024 $68M figure and the
      $2.0B valuation implies expected continued growth.
    - >-
      NRR, gross churn, and CAC by plan tier—the key metrics for underwriting the ~29x ARR multiple on a SaaS base that
      is primarily SMB.
    - >-
      Beam Finance integration timeline, expected revenue contribution, and gross margin implications of adding a
      fintech component to a SaaS business.
    - >-
      Enterprise contract economics: deal sizes, ramp timelines, and how many NMHC- or S&P-scale construction firms are
      in the customer base.
