summary:
  headline: >
    CompanyCam has built a defensible contractor documentation moat with 285,000+ users, proven 2x ARR growth to $68M in
    2024, and Nebraska's first unicorn valuation—but a ~29x 2024 ARR multiple demands ongoing acceleration that public
    evidence cannot yet confirm, warranting a track posture pending current ARR disclosure.
