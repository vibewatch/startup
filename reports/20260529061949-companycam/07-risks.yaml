- id: platform-and-operational-risk
  title: Platform dependency, outages, and operational quality risk
  body: The second risk cluster is platform and product-delivery dependence. CompanyCam is a field product, which means distribution and usability matter more than in an office-only SaaS. The company depends on Apple’s App Store, Google Play, and the Chrome browser ecosystem to keep its field capture, Android/iOS apps, and browser-extension workflow available. Apple’s guidelines make clear that quality, safety, privacy, and legal violations can trigger rejection or removal, while Google’s Data Safety program requires complete, accurate declarations and reserves enforcement for discrepancies. Those are not theoretical governance layers; they are external gatekeepers between CompanyCam and its users. Operational evidence shows the same point from another angle. CompanyCam’s public status page recorded a May 18, 2026 incident that broke PDF export for image-heavy Pages, and review surfaces preserve complaints about crashes, iPhone issues, navigation friction, and interface regressions. Even
    when the underlying incident count is low, the product’s value lives in high-stakes moments — proving work, resolving disputes, sending reports, collecting payment. That means narrow reliability failures can have disproportionate reputational and retention effects. CompanyCam has real mitigations, including SOC 2, public status visibility, vendor reviews, and enterprise onboarding, but those mitigate residual risk; they do not remove the basic truth that the product is platform-governed and operationally brittle if mobile or report-export quality slips.
  claimRefs:
