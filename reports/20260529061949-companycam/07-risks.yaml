callouts:
- calloutType: risk
  title: Payments broadens risk faster than it broadens proof
  body: CompanyCam now has a real payments surface, but the public record explains legal responsibility much better than it explains chargeback rates, reserve behavior, or unit economics. That asymmetry makes payments a material residual risk rather than a clean upside lever today.
  claimRefs:
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
- calloutType: risk
  title: CompanyCam is still platform-governed despite strong product-market fit
  body: Apple, Google, Chrome, Stripe, and integration partners all sit between CompanyCam and the customer workflow. Strong customer love and good security posture do not remove those external dependencies.
  claimRefs:
  - CR006
  - CR007
  - CR008
  - CR032
  - CR036
- calloutType: insight
  title: Macro construction softness would hit several risk channels at once
  body: If contractor end markets weaken, CompanyCam faces not just slower growth but also higher price sensitivity, lower expansion appetite, and more difficulty proving fintech or marketing add-ons.
  claimRefs:
  - CR025
  - CR026
  - CR027
  - CR029
  - CR039
- calloutType: recommendation
  title: Underwrite CompanyCam with explicit trigger-based discipline
  body: The right posture is not to reject the company outright, but to insist on monitorable thresholds around app reliability, payments friction, Beam integration progress, and concentration disclosure before granting a high-confidence recommendation.
  claimRefs:
  - CR034
  - CR037
  - CR038
  - CR039
  - CR042
