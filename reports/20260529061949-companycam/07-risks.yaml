  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-chargeback-and-reserve-metrics
    missingEvidence: A public or management-confirmed series for chargebacks, reserve holds, payouts delayed, fraud losses, and payment-support burden.
    whyItMatters: Payments can shift CompanyCam’s risk profile materially, but the public record only describes legal allocation, not realized loss rates.
    diligencePath: Request monthly payments KPIs covering GMV, dispute rate, reserve incidence, payout delays, and support tickets.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: material
    topic: public-customer-concentration-metrics
    missingEvidence: Actual concentration metrics by trade, account size, geography, and top-customer revenue share.
    whyItMatters: A contractor-focused customer base can look broad in logos yet still be financially concentrated.
    diligencePath: Request revenue concentration tables by logo, trade, state, and channel partner.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR006
    - TR005
  - type: access-blocked
    severity: minor
    topic: comprehensive-legal-search
    missingEvidence: A broad court, regulator, and enforcement search beyond the reviewed public web surfaces.
    whyItMatters: The absence of surfaced litigation or enforcement in this pack is not the same as a legal clean bill of health.
    diligencePath: Run docket, state AG, FTC, CFPB, and privacy-regulator searches using all entity aliases and addresses.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: minor
    topic: platform-reliability-metrics
    missingEvidence: Crash-rate, mean-time-to-resolution, release-failure, and sync-failure metrics across iOS, Android, Pages, and integrations.
    whyItMatters: Public incidents and reviews prove the risk exists, but not its actual frequency or trend.
    diligencePath: Request engineering reliability dashboard extracts and customer-support incident volumes for the last 12 months.
    relatedQuestionRefs:
    - QR008
    - QR009
    relatedTableRefs:
    - TR002
    - TR005
