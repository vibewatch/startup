- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Product-quality thesis
    - Status incidents and review sentiment
    - Two or more material field-workflow incidents in a quarter or sustained drop in app ratings/review sentiment
    - Pause conviction; demand incident log, crash metrics, and release-governance remediation before underwriting forward growth.
  - - Payments thesis
    - Chargebacks, reserves, and payout friction
    - Evidence of rising reserve holds, material dispute losses, or merchant dissatisfaction around payments
    - Treat payments as a risk amplifier rather than a margin enhancer until metrics improve.
  - - Beam integration thesis
    - Attachment and workflow convergence
    - No meaningful workflow integration, attach-rate proof, or customer adoption signal within 12 months
    - Downgrade Beam from strategic upside to distraction risk.
  - - Demand resilience thesis
    - Contractor market softness
    - Backlog deterioration plus increased project cancellations or spend retrenchment in core contractor segments
    - Reduce growth assumptions and raise customer-churn sensitivity.
  - - Platform-governance thesis
    - App-store or policy enforcement
    - App removal, severe review delay, or data-safety enforcement event
    - Escalate platform-dependence risk and test web-only fallback viability.
  - - Competition thesis
    - Bundle substitution
    - Loss of large accounts to broader suites or rising objections that CompanyCam is only a point feature
    - Assume higher pricing pressure and lower long-run standalone value.
  - - Concentration thesis
    - Undisclosed customer / vertical concentration
    - Discovery that a small set of trades or logos drives an outsize share of revenue
    - Re-rate residual risk higher and require deeper cohort work before investment.
  notes: Kill criteria are designed as monitoring indicators, not predictions. Each row states what would materially change the underwriting view.
