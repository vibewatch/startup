            title: Rule sensitivity is demonstrated; the segment bridge is not
            body: >-
              FY25 revenue and profit declined, and secondary reporting attributes a quarterly brokerage decline to
              regulatory changes. Obtain a current segment and rule-impact reconciliation before treating the reported
              cash balance as protection against recurring earnings pressure.
            calloutType: risk
