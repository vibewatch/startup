  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and monetization
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to individual retail investors as the core user group, but distinguishes at
              least two economically different behaviors: delivery investors, for whom the sources describe zero
              brokerage, and intraday or futures-and-options traders, who pay per executed order. One secondary analysis
              estimates that active F&O and intraday users account for roughly three-quarters of revenue; that is a
              publisher-reported revenue mix, not a disclosed customer share, and it is not independently verified here.
              The sources also describe Varsity, Coin, Console and Kite Connect as adjacent learning, mutual-fund,
              reporting and developer surfaces. They do not report how many brokerage customers use each adjacent
              product, whether those users are active, or whether use expands account value. This supports a
              product-based segmentation, not a demonstrated retention or expansion thesis.
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU008
              - CU009
      - number: '6.2'
        title: Adoption signals are not a retention series
        blocks:
          - type: paragraph
            body: >-
              Public articles report substantial scale, but their measures cannot be joined into a reliable growth or
              retention curve. A 2023 Medium article gives an NSE active-client figure for March 2022; later accounts
              variously report active clients, platform clients, or users without a consistent denominator. Entrackr
              attributes one FY25 user and market-share figure to NSE data but does not specify the observation date in
              the reviewed text. Another source claims more than ten million active users by 2025, while an encyclopedia
              entry reports approximately eight million clients for FY24. These statements may reflect different
              snapshots and definitions, and some are low-quality secondary reporting. They are useful as evidence that
              Zerodha has operated at large reported scale, not as comparable cohort, activity-frequency, or
              monetization metrics.
