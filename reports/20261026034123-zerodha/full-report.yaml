              - CP004
              - CP005
      - number: '3.2'
        title: Product breadth and pricing are not yet a verified basis for ranking
        blocks:
          - type: paragraph
            body: >-
              Groww's 2020 acquisition of Indiabulls Asset Management Company, subject to SEBI approval at announcement,
              is evidence of an earlier move to add mutual-fund manufacturing alongside distribution; it is not proof of
              present scale or successful integration (CP008). 5paisa's own pricing page currently presents zero
              account-opening and mutual-fund commission fees and flat ₹20 brokerage per order (CP009). Secondary
