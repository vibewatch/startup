  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and earnings shocks are visible; segment exposure is not reconciled
        blocks:
          - type: paragraph
            body: >-
              Entrackr reports FY25 revenue from operations of Rs 8,847 crore, down from Rs 9,993 crore in FY24, and net
              profit of Rs 4,237 crore, down from Rs 5,496 crore. A separate report says brokerage revenue in the June
              2025 quarter declined about 40% year over year after regulatory changes and lower activity. These are
              historical reported figures, not a forecast or a cash burn measure. UpGrowth describes 2024 SEBI changes
              to exchange-charge treatment and derivatives rules; a separate source asserts that active F&O and intraday
              traders contribute roughly three-quarters of revenue, but provides no segment reconciliation. Treat that
              concentration estimate as unverified. The evidence supports high residual exposure to market rules and
              trading activity, but does not disclose a current segment bridge or a quantified mitigation plan.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR010
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR010
              - CR011
      - number: '7.2'
        title: Competitive pressure meets a self-funded operating model
        blocks:
          - type: paragraph
            body: >-
              OneVision's case study describes falling active-client share while TechResearchOnline reports Kamath's
              view that the brokerage market is crowded. These are secondary reports, not independent market benchmarks;
              the client measures and dates should not be conflated. Entrackr reports FY25 cash and bank balances of Rs
              22,679 crore, while Debtsify says the broking business carries no debt. Neither statement establishes how
              much cash is unrestricted, available to every group entity, or sufficient under a severe stress scenario.
              The buffer may support resilience, but should not be treated as proof that competition or rule changes are
              immaterial. Track subsequent reported revenue, profit, active-client definitions and segment mix on
              consistent periods.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR014
      - number: '7.3'
        title: Technology controls and counterparties remain evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The assigned sources do not establish a Zerodha-specific outage, cyber incident, control failure, or
              effective control maturity. SEBI's circular index lists August 2026 items on cyber-incident reporting and
              an IT Resilience Index for market infrastructure institutions; this is a regulatory-monitoring signal, not
              evidence of an incident or proof that a particular Zerodha entity falls within scope. The sources also do
              not identify material cloud, exchange, bank, depository, settlement, or other partner concentrations.
              Likelihood and mitigation maturity for these operational and dependency scenarios therefore remain
              unknown, not zero. Request entity-to-license mapping, incident and availability records, control
              attestations, vendor inventories, concentration measures, and tested recovery evidence before assigning a
              lower residual rating.
            claimRefs:
              - CR005
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR013
      - number: '7.4'
        title: Use observable disclosures as escalation triggers, not invented thresholds
        blocks:
          - type: paragraph
            body: >-
              FY25 revenue and profit declines provide a measurable baseline, and the reported June 2025 brokerage
              decline makes rule-driven volume sensitivity a specific monitoring item. The evidence does not support a
              numeric failure threshold or a probability estimate for unobserved legal, technology, or partner events.
              Escalate for investment review if a later comparable filing reports another year-over-year decline in
              revenue from operations or net profit, if brokerage revenue falls again after a rule change, or if a
              regulator publishes an operative requirement whose entity scope is confirmed. Treat these as diligence
              triggers, not automatic thesis-break conclusions; request the underlying financial, entity, and control
              records before changing the risk rating.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR015
              - CR016
