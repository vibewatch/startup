      - number: '6.3'
        title: Customer proof, service friction and open diligence
        blocks:
          - type: paragraph
            body: >-
              The reviewed pool contains company-level customer-count statements and descriptions of products, but no
              independently attributable named deployment with production status and a measured customer outcome. Nor
              does it provide retention, churn, renewal, cohort activity, or top-customer concentration data. One 2023
              secondary article reports order-management glitches during heavy activity and reduced satisfaction at
              times; a separate encyclopedia summary describes a June 2024 access disruption and a resolved
              withdrawal-restriction controversy. These are bounded reports of service friction, not evidence of
              incident frequency or current service quality. The adoption thesis therefore rests on aggregate scale and
              an organic-acquisition narrative, while durability, customer economics and the quality of named references
              remain unverified.
            claimRefs:
              - CU009
