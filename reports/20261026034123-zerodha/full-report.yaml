  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Define the market by broker revenue, not investor assets
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the revenue earned by securities brokers for execution and related services, rather
              than the value of securities held by investors, exchange turnover, or the number of accounts. Mordor
              Intelligence defines its India securities-brokerage market as annual broker revenue from securities
              brokerage plus related margin funding, distribution, and wealth services. That definition is broader than
              pure trade commissions and means adjacent services should not be counted again as a separate market
              without reconciling the publisher's scope. Zerodha's reported product range spans several instruments, but
              the assigned sources do not provide a revenue split by instrument or service. Accordingly, public-market
              estimates are directional context, not a company-level TAM. [CM001, CM012, CM013]
            claimRefs:
              - CM001
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM012
              - CM013
      - number: '2.2'
        title: Published estimates are comparable only at a high level
        blocks:
          - type: paragraph
            body: >-
              Two publisher summaries place India's securities-brokerage market at USD 6.98 billion in 2026, but their
              forecast horizons differ: Research and Markets lists USD 13.09 billion by 2031, while Mordor Intelligence
              forecasts USD 14.47 billion by 2032. Their stated CAGRs also cover different periods. Mordor describes a
              proprietary estimation framework using nine months of actuals and a Q4 projection for its 2026 base; the
              fetched Research and Markets page does not expose a comparable methodology. The shared 2026 number is not
              independent confirmation of a measured market, and neither estimate supplies a Zerodha-specific SAM or
              SOM. Treat the forecasts as publisher-defined scenarios rather than audited revenue totals. [CM002, CM003,
              CM004, CM005, CM016]
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM009
              - CM016
      - number: '2.3'
        title: Retail investors occupy distinct usage and payment paths
        blocks:
          - type: paragraph
            body: >-
              The primary buyer and user evidenced in this pool is the self-directed retail investor; the investor is
              also the fee payer where the broker charges per order. Within that population, delivery-focused investors
              and active traders have different activity and fee profiles: UpGrowth reports zero brokerage on equity
              delivery and capped or flat per-order brokerage for intraday, futures, and options as of September 2026.
              These prices do not include statutory charges, and they do not establish total customer economics.
              Traditional full-service brokerage is a status-quo alternative described as relationship-manager-led,
              while digital discount models compete on lower transaction friction. Assigned sources do not quantify
              segment budgets, willingness to pay, or conversion between registrations and active clients. [CM011,
              CM012, CM013, CM014]
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: FY26 active-client contraction tempers the growth narrative
        blocks:
          - type: paragraph
            body: >-
              Exchange-client reporting shows a demand constraint alongside the longer-term market forecasts: NSE active
              client accounts declined from 4.92 crore in March 2025 to 4.57 crore in March 2026. CNBC TV18 and The
              Hindu BusinessLine both report Zerodha's NSE active-client share falling from 16.03% to 15.08%; the latter
              attributes the contraction to a mix of tighter F&O rules, market volatility, and investor inactivity.
              UpGrowth separately reports 67.97 lakh Zerodha NSE active clients for August 2026, a monthly activity
              measure that should not be conflated with the 1.8 crore registered-client figure it cites from Zerodha's
              About page. These data argue for tracking retention and active usage, not registrations alone. They do not
              establish churn among all users or predict future market revenue. [CM006, CM007, CM008, CM009, CM010,
              CM015]
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Share shifts reveal a more contested retail-broker market
        blocks:
          - type: paragraph
            body: >-
              NSE active-client counts are a useful measure of monthly trading participation, not a proxy for assets
              under management, revenue, or customer retention. CNBC-TV18 reports that total active accounts declined 7%
              from March 2025 to March 2026, while Groww increased its share and Zerodha, Angel One, and Upstox lost
              share (CP001-CP004). ICICI Securities and SBI Securities gained share in the same period, suggesting the
              competitive set extends beyond app-first discount brokers (CP005). The Hindu BusinessLine reports that
              Groww added 5.7 lakh active clients in H1 2026 while Zerodha's active base slipped; that period-specific
              movement is consistent with pressure on incumbents but does not show which customers switched or why
              (CP006-CP007). The landscape table therefore distinguishes observed market-share evidence from unsupported
              product, funding, and customer-segment comparisons.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
