              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: Distribution and switching advantages remain hypotheses to test
        blocks:
          - type: paragraph
            body: >-
              An upGrowth teardown argues that flat pricing was copied and that platform depth and reliability take
              longer to reproduce; this is the author's analysis, not comparative reliability data or measured switching
              behavior (CP012). A TechResearchOnline article attributes to Zerodha co-founder Nithin Kamath the view
              that the market is crowded and that a new entrant repeating the same model would struggle (CP013). Taken
              with the FY26 share movements, these are signals of competitive intensity, not proof of a durable moat.
              The assigned evidence does not compare active-user cohorts, customer acquisition costs, account
              portability, platform uptime, trust outcomes, or customer overlap. Those gaps prevent a defensible ordinal
              positioning score or conclusion that any one broker has stronger lock-in; obtain matched broker-level
              disclosures and customer references before underwriting durability.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Share gains are not a retention or moat measure
            body: >-
              The active-client evidence shows relative market movement, while customer retention, multi-homing,
              switching costs, and product reliability remain unmeasured in this pool.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP003
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Public reporting describes Zerodha as monetizing several distinct activities rather than charging every
              investor in the same way. Kuvera and UpGrowth describe zero brokerage on equity delivery and flat
              order-based charges for active trading, while Entrackr identifies brokerage as the primary revenue stream
              and also lists investment-management fees, software services, and interest income. Inc42 describes newer
              lending, asset-management, and wealth initiatives, but the assigned evidence does not quantify the
              contribution of those lines. These are reported mechanisms, not a reconciled revenue mix: the sources do
              not disclose realized prices after discounts, per-stream revenue, or gross profit by product.
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
