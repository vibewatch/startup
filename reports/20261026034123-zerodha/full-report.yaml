              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.4'
        title: Exit readiness and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Before pricing an investment, request the latest audited consolidated statements and segment schedules;
              reconcile FY24 revenue from operations with the different FY24 consolidated-revenue and total-income
              figures reported by Entrackr and Inc42; and obtain monthly active, funded, and transacting client cohorts.
              Confirm any post-June-2025 primary, employee, or secondary transaction, including share class,
              preferences, transfer restrictions, and implied fully diluted value. Test downside against further
              declines in brokerage activity, regulatory changes, and margin compression, while treating adjacencies as
              unproven until their revenue and returns are separately disclosed. A sustained deterioration in revenue or
              active clients, an adverse regulatory change to core monetization, or a price unsupported by normalized
              earnings should trigger a thesis reset. Exit readiness and public-peer comparability remain unresolved
              rather than presumed.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No transaction-quality entry price
            body: >-
              Track and request current price-and-terms evidence before underwriting a return; the cited public
              estimates are not financing or secondary transaction marks.
