        title: Exhibits
        blocks:
          - type: callout
            title: Profitability is visible; durability is not
            body: >-
              FY25 results remain substantial, but public evidence does not resolve revenue-line concentration, the
              inconsistent FY24 revenue base, or how much reported cash is available after client-related obligations.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
              - CI009
              - CI010
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and user jobs
        blocks:
          - type: paragraph
            body: >-
              Zerodha's Kite page describes a trading interface with instrument search, charts, market-depth
              information, orders, alerts, and risk nudges; it claims search across 90,000+ stocks and F&O contracts, a
              company-stated coverage figure rather than an independently tested inventory or latency measure (CE001,
              CE002, CE003). The page also says Console processes tens of billions of historical trade-breakdown rows
              for portfolio profit-and-loss reporting, another company description rather than an audited accuracy or
              performance result (CE004). Strategy Boffins lists Coin and Varsity alongside Kite and Console, but
              supplies no adoption or outcome measures for those adjacent surfaces (CE005). Sensibull separately
              describes options-strategy and analysis tools, and its page identifies a Rainmatter relationship with
              Zerodha (CE006, CE007). The matrix therefore distinguishes first-party product descriptions, partner
              claims, and less authoritative secondary product listings.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE008
      - number: '5.2'
        title: Workflow, partner tools, and integration
        blocks:
          - type: paragraph
            body: >-
              The evidenced workflow moves from instrument discovery and chart review in Kite to conditional or basket
              orders, alerts, and Nudge prompts; the company page documents those functions but not execution quality,
              user outcomes, or the effectiveness of the prompts (CE003). Console provides a described reporting
              surface, while Sensibull presents strategy construction, payoff curves, Greeks, option-chain analysis, and
              open-interest tools for options users (CE004, CE006). Zerodha invites users to build applications through
              Kite Connect; an independent UpGrowth article describes the API as HTTP and JSON, but neither source
              supplies API service levels or evidence of production adoption (CE008). A current TradingQnA announcement
              says US stocks and ETFs were in public beta, which is a dated rollout signal, not proof of general
              availability (CE014). The figure groups these visible surfaces by user job; it does not imply a technical
              dependency chain or reveal the internal system architecture.
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE008
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
              - CE008
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE008
      - number: '5.3'
        title: Architecture disclosures and operational risk
        blocks:
          - type: paragraph
            body: >-
              The only detailed infrastructure account in this assigned pool is a Baidu Baike article, which reports a
              migration from virtual machines toward containers and Kubernetes, and names Prometheus and NATS in
              monitoring and real-time data delivery (CE009, CE010). The same article reports Cloudflare WAF and DDoS
              protection; these are secondary descriptions, not current configuration evidence, independent testing, or
              a certification (CE011). It also reports that Zerodha web and mobile access was disrupted on June 3, 2024,
              leaving some users unable to execute trades, but the excerpt does not establish root cause, duration,
              affected-user count, recovery time, or a post-incident control change (CE012). The table preserves those
              attributions and separates a reported past event from unknown present-day service performance.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Differentiation and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The retrieved material supports breadth of described functionality and a partner/API ecosystem, but it
              does not provide comparative performance tests, attributable retention or adoption outcomes, or technical
              evidence that would establish an enduring product moat (CE005, CE007, CE008, CE016). The current
              TradingQnA snapshot exposes an “Algos, strategies, code” category and a small related discussion; because
              the forum is company-operated, this is a limited practitioner-community signal rather than independent
              evidence of API use (CE013). A 2018 Economic Times archive item attributes to Zerodha's CTO a goal of
              helping users better understand capital markets and improve user experience; this is historical intent,
              not a current roadmap or outcome measure (CE015). Diligence should request current architecture and API
              documentation, independent security assurance, service-level and incident records, and anonymized usage or
              integration evidence before treating the marketed feature set as validated technical differentiation.
            claimRefs:
