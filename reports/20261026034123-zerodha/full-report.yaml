  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a high-quality operating business, not a defensible entry price. Hurun's Global
              Unicorn Index 2025 places Zerodha at US$8.2 billion, but its stated index cut-off is 1 January 2025 and
              its release was 26 June 2025; it is an estimate, not evidence of a recent share transaction. WorthScale's
              May 2026 page says approximately US$8 billion while also presenting a materially different Hurun India 500
              figure, without an evident valuation method. Those references are context, not interchangeable price
              observations. FY25 revenue and profit declined from FY24, while Entrackr reported substantial cash and
              bank balances. Given the missing current price, share-class terms, and FY26 audited segment data, the
              decision is research-more / track, with low valuation confidence and high risk rather than a buy
              recommendation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
