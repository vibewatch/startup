              - CV004
              - CV005
              - CV006
              - CV014
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is a bootstrapped brokerage with a sizable client franchise, high historical profitability, and
              reported liquidity: Zerodha's own About page says it serves over 1.8 crore clients and contributes over
              15% of Indian retail trading volumes, while Entrackr reports FY25 revenue from operations of Rs 8,847
              crore and profit of Rs 4,237 crore. The anti-thesis is that both FY25 measures fell year over year and NSE
              active-client data show a smaller industry and lower Zerodha share in FY26. Registered clients and monthly
              active accounts are different denominators, so neither should substitute for paid activity or retention.
              The available pool does not establish segment margins, retention cohorts, or the share of revenue exposed
              to derivatives regulation; claims about these exposures from the UpGrowth teardown are not relied on as
              verified financial facts.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios and valuation method
        blocks:
          - type: paragraph
            body: >-
              A defensible valuation would triangulate a current primary or secondary transaction, audited earnings and
              segment economics, and genuinely comparable public broker or private fintech evidence. The assigned pool
              provides one dated unicorn-index estimate and one unsourced commercial estimate, but no disclosed
              transaction terms, current capitalization table, preference stack, or comparable-company financial set. It
              also mixes revenue from operations, consolidated revenue, and total income across sources and periods;
              those are not interchangeable multiples denominators. Consequently, bull, base, and bear operating
              assumptions can be identified, but neither an absolute valuation range nor a probability-weighted return
              can be responsibly calculated from these materials. TV003 records the conditions that would change that
              result.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
