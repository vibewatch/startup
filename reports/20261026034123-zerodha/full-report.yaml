chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Zerodha is described as an Indian online discount brokerage founded in 2010 by brothers Nithin and Nikhil
              Kamath and headquartered in Bengaluru (CO001, CO002). Its core proposition is digital retail brokerage
              through Kite, with equity delivery described as zero-brokerage and intraday and derivatives orders priced
              at a flat fee or capped percentage (CO003, CO004). Those prices are reported by secondary business
              profiles rather than a current official tariff in the assigned evidence, so they should not be treated as
              a verified October 2026 rate card. Multiple third-party profiles call the company bootstrapped and say it
              has not raised external venture capital (CO005); this does not replace a complete financing and ownership
              ledger. The evidence portrays a focused brokerage-and-platform business, while public material in this
              pool does not quantify current segment economics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
