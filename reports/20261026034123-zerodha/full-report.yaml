              here against each broker's current official schedule, and TradingCritique and StockCalc report different
              Zerodha percentage caps (CP010-CP011). These pages are useful as leads, not as independent benchmarks. The
              capability and pricing tables preserve the source and status of each comparison rather than implying that
              list prices capture statutory charges, realized economics, or equivalent product scope.
            claimRefs:
