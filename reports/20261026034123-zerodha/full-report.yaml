              - CO016
      - number: '1.2'
        title: Founders, leadership, and control
        blocks:
          - type: paragraph
            body: >-
              The assigned sources identify Nithin and Nikhil Kamath as co-founders; Netfigo describes Nithin as having
              spent nearly a decade as a sub-broker and trader before founding Zerodha (CO001, CO006). Netfigo also
              reports a 2021 employee ESOP liquidation in which Kamath sold a small stake and employees received
              liquidity, assigning the company an approximately $2 billion valuation for that exercise (CO007). That
              historical employee event is not evidence of the current cap table, founder ownership percentage, or an
              arm's-length company sale. No retained source supplies a current board roster, executive responsibilities,
              succession plan, or independently verified ownership breakdown. The resulting governance and key-person
              assessment is therefore incomplete rather than proof of founder control or dependence.
            claimRefs:
              - CO001
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
              - CO007
      - number: '1.3'
        title: Scale, valuation, and operating resilience
        blocks:
          - type: paragraph
            body: >-
              Entrackr reports revenue from operations of ₹8,847 crore in FY25, down from ₹9,993 crore in FY24, and net
              profit of ₹4,237 crore in FY25, down from ₹5,496 crore; it also reports cash and bank balances of ₹22,679
              crore as of FY25 (CO008, CO009, CO010). These are dated financial measures, not ARR or a measure of
              unrestricted cash available for deployment. Knowelth reports 7.3+ million active clients for an FY24–FY25
              milestone without an exact measurement date or a reproducible activity definition (CO011). Baike reports a
              June 3, 2024 access disruption during which some users could not execute trades, and identifies
              derivatives regulation as a business challenge (CO012, CO015). Hurun's June 2025 index assigns Zerodha a
              US$8.2 billion value, but that index estimate is not a transaction price or a current October 2026
              valuation (CO016). The dated timeline and snapshot distinguish reported figures from the private evidence
              still needed.
