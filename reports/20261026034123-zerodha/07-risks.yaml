artifact: risks
slug: zerodha
runDate: 2026-10-26
company:
  name: Zerodha
chapter:
  number: 7
  title: Risks
  summary: Public reporting documents a FY25 contraction and sensitivity to derivatives-related regulation, while the assigned evidence does not reconcile segment exposure or establish current operational controls. The most material diligence priorities are regulatory implementation, revenue resilience, and entity-level technology and counterparty dependencies.
sections:
  - id: regulatory-and-earnings
    title: Regulatory and earnings shocks are visible; segment exposure is not reconciled
    body: >-
      Entrackr reports FY25 revenue from operations of Rs 8,847 crore, down from Rs
      9,993 crore in FY24, and net profit of Rs 4,237 crore, down from Rs 5,496
      crore. A separate report says brokerage revenue in the June 2025 quarter
      declined about 40% year over year after regulatory changes and lower
      activity. These are historical reported figures, not a forecast or a cash
      burn measure. UpGrowth describes 2024 SEBI changes to exchange-charge
      treatment and derivatives rules; a separate source asserts that active
      F&O and intraday traders contribute roughly three-quarters of revenue, but
      provides no segment reconciliation. Treat that concentration estimate as
      unverified. The evidence supports high residual exposure to market rules
      and trading activity, but does not disclose a current segment bridge or a
      quantified mitigation plan.
    claimRefs: [CR001, CR002, CR003, CR004, CR006, CR010, CR015]
    tableRefs: [TR001]
  - id: competition-and-financial-buffer
    title: Competitive pressure meets a self-funded operating model
    body: >-
      OneVision's case study describes falling active-client share while
      TechResearchOnline reports Kamath's view that the brokerage market is
      crowded. These are secondary reports, not independent market benchmarks;
      the client measures and dates should not be conflated. Entrackr reports
      FY25 cash and bank balances of Rs 22,679 crore, while Debtsify says the
      broking business carries no debt. Neither statement establishes how much
      cash is unrestricted, available to every group entity, or sufficient
      under a severe stress scenario. The buffer may support resilience, but
      should not be treated as proof that competition or rule changes are
      immaterial. Track subsequent reported revenue, profit, active-client
      definitions and segment mix on consistent periods.
    claimRefs: [CR007, CR008, CR009, CR014]
  - id: operational-resilience-and-dependencies
    title: Technology controls and counterparties remain evidence gaps
    body: >-
      The assigned sources do not establish a Zerodha-specific outage, cyber
      incident, control failure, or effective control maturity. SEBI's
      circular index lists August 2026 items on cyber-incident reporting and
      an IT Resilience Index for market infrastructure institutions; this is
      a regulatory-monitoring signal, not evidence of an incident or proof
      that a particular Zerodha entity falls within scope. The sources also
      do not identify material cloud, exchange, bank, depository, settlement,
      or other partner concentrations. Likelihood and mitigation maturity for
      these operational and dependency scenarios therefore remain unknown,
      not zero. Request entity-to-license mapping, incident and availability
      records, control attestations, vendor inventories, concentration
      measures, and tested recovery evidence before assigning a lower
      residual rating.
    claimRefs: [CR005, CR011, CR012, CR013]
    tableRefs: [TR002, TR003]
  - id: monitoring-and-thesis-break
    title: Use observable disclosures as escalation triggers, not invented thresholds
    body: >-
      FY25 revenue and profit declines provide a measurable baseline, and the
      reported June 2025 brokerage decline makes rule-driven volume sensitivity
      a specific monitoring item. The evidence does not support a numeric
      failure threshold or a probability estimate for unobserved legal,
      technology, or partner events. Escalate for investment review if a later
      comparable filing reports another year-over-year decline in revenue
      from operations or net profit, if brokerage revenue falls again after
      a rule change, or if a regulator publishes an operative requirement
      whose entity scope is confirmed. Treat these as diligence triggers,
      not automatic thesis-break conclusions; request the underlying
      financial, entity, and control records before changing the risk rating.
    claimRefs: [CR001, CR002, CR003, CR015, CR016]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk and evidence status
      - Likelihood evidence
      - Severity and impact
      - Mitigation maturity
      - Residual exposure and monitor
    rows:
      - - "Derivatives and active-trading sensitivity; quarterly brokerage decline reported"
        - "Observed once: about 40% year-over-year decline in June 2025 quarter, per secondary reporting"
        - "High; brokerage is directly exposed to activity and rule changes"
        - "Diversification is discussed, but no reconciled segment bridge or control targets are disclosed"
        - "High; track brokerage revenue, order activity definitions, and operative SEBI changes"
      - - "Exchange-charge and derivatives rule changes"
        - "Observed: sources describe 2024 SEBI rule changes"
        - "High; revenue effects are reported, but the contribution of each rule is not isolated"
        - "No rule-by-rule stress test or mitigation owner evidenced"
        - "High; reconcile each rule's effective date, affected revenue line, and response"
      - - "Further regulatory change, including the scope of newer resilience measures"
        - "Regulatory agenda is visible; direct applicability to Zerodha entities is unverified"
        - "Potentially high if an operative requirement affects a licensed entity"
        - "Entity mapping and implementation evidence unavailable in this source set"
        - "Unresolved; verify entity scope, operative text, compliance owner, and deadlines"
      - - "Licensing, litigation, or enforcement posture"
        - "Unknown; assigned sources do not establish current entity-level status"
        - "Potentially high; consequences depend on the entity, matter, and procedural status"
        - "Not assessable from available evidence"
        - "Unresolved; obtain current regulator registers, court searches, and counsel confirmation"
    notes: >-
      Partial public-source register, not an exhaustive legal inventory. Reported
      figures and rule effects are secondary-source accounts; unknown means not
      established in the assigned evidence, not absent.
    enumerationScope:
      coverage: partial
      basis: "Public material retained for this chapter; not a complete inventory of Zerodha entities, licenses, proceedings, or rules."
    claimRefs: [CR003, CR004, CR005, CR010, CR011]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure and diligence path
    rows:
      - - "Trading-platform outage or degraded order handling"
        - "Unknown; no incident-rate or availability series in assigned sources"
        - "Potentially high for customer access and execution"
        - "Unknown; no recovery-test or service-level evidence"
        - "Unquantified; request uptime, incident, order-failure, and recovery records"
      - - "Cybersecurity, privacy, or customer-data incident"
        - "Unknown; no Zerodha-specific incident register or control evidence"
        - "Potentially high; impact depends on affected systems and customers"
        - "Unknown; SEBI index entry is not evidence of company controls"
        - "Unquantified; request independent control attestations, incident history, and remediation log"
      - - "Complaint handling and customer protection"
        - "Unknown; complaint volumes, severity, and resolution times are not supplied"
        - "Potentially material to regulatory standing and trust"
        - "Unknown; no grievance or remediation metrics"
        - "Unquantified; reconcile complaints by entity, type, aging, and resolution"
    notes: >-
      These are diligence scenarios, not findings that an outage, breach, or
      complaint-control failure occurred. The source set does not provide
      operating denominators or control test results.
    claimRefs: [CR005, CR012]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency to map
      - Failure scenario
      - Concentration evidence
      - Severity
      - Mitigation and diligence path
    rows:
      - - "Exchanges and market infrastructure"
        - "Rule, access, or service changes disrupt trading economics or availability"
        - "No entity-level exposure or concentration measure disclosed in assigned sources"
        - "Potentially high; effects depend on the affected service and rule"
        - "Map memberships, services, rule dependencies, fallback paths, and continuity tests"
      - - "Banks, depositories, settlement, and custody chain"
        - "A service interruption or counterparty restriction delays customer transactions"
        - "Counterparties, balances, and concentration are not identified"
        - "Potentially high; customer and settlement impact is unquantified"
        - "Obtain entity-level counterparty inventory, concentration, reconciliation, and contingency evidence"
      - - "Cloud, market data, and technology vendors"
        - "Vendor outage, cyber event, or contract termination degrades platform service"
        - "Vendor names, substitutability, and concentration are not evidenced"
        - "Potentially material to high; no incident likelihood can be estimated"
        - "Request vendor register, criticality tiers, exit plans, and tested recovery evidence"
    notes: >-
      The rows identify diligence categories only; they do not assert that any
      named or concentrated dependency exists. Exposure and mitigation remain
      unverified.
    claimRefs: [CR010, CR013]
figures:
  - id: FR001
    title: Evidence-bounded risk heatmap
    type: matrix
    summary: Reported financial and regulatory shocks are observable; operational and counterparty likelihoods remain unknown rather than assumed low.
    data:
      columns:
        - Likelihood evidence
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Trading and rule sensitivity
          values: ["Observed revenue declines", "High", "Not reconciled", "High"]
        - label: Further regulatory changes
          values: ["Ongoing monitoring; scope unclear", "Potentially high", "Entity mapping unavailable", "Unresolved"]
        - label: Platform or cyber incident
          values: ["Unknown; no incident rate supplied", "Potentially high", "Unknown", "Unknown"]
        - label: Partner or vendor disruption
          values: ["Unknown; no concentration data", "Potentially high", "Unknown", "Unknown"]
        - label: Licensing and litigation posture
          values: ["Current entity-level status not established", "Unknown; consequences depend on proceeding", "Not evidenced", "Unresolved"]
        - label: Revenue concentration
          values: ["Secondary F&O / intraday share estimate only", "Potentially high; estimate unverified", "Segment bridge unavailable", "Unresolved"]
    claimRefs: [CR001, CR002, CR004, CR005, CR006, CR009, CR011, CR012, CR013, CR016]
callouts:
  - calloutType: risk
    title: Rule sensitivity is demonstrated; the segment bridge is not
    body: FY25 revenue and profit declined, and secondary reporting attributes a quarterly brokerage decline to regulatory changes. Obtain a current segment and rule-impact reconciliation before treating the reported cash balance as protection against recurring earnings pressure.
    claimRefs: [CR001, CR002, CR003, CR009]
