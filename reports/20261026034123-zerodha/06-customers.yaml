  evidenceGaps:
    - type: missing-source
      severity: material
      topic: customer-durability
      missingEvidence: Period-defined retention, churn, renewal and cohort activity data, with active-account and revenue denominators, plus a top-customer or top-segment concentration schedule.
      whyItMatters: Aggregate account counts cannot establish durable monetizable usage or show whether trading revenue depends on a narrow customer segment.
      diligencePath: Request quarterly active-account cohorts, repeat-activity and revenue retention schedules, and customer-segment revenue concentration from company management.
      relatedQuestionRefs:
        - QU008
      relatedTableRefs:
        - TU003
    - type: missing-source
      severity: material
      topic: named-customer-proof
      missingEvidence: Independently verifiable named customer references identifying use case, production-versus-pilot status and attributable outcome.
      whyItMatters: Product descriptions and aggregate user counts do not establish implementation depth, customer value or reference quality.
      diligencePath: Obtain permissioned customer references and deployment documentation, then corroborate outcomes with the named customer.
      relatedTableRefs:
