company:
  name: Zerodha
chapter:
  number: 6
  title: Customers
  summary: Public evidence describes a large retail customer base spanning delivery investors and active traders, but the reported counts use inconsistent populations and periods. The assigned sources do not establish named production deployments, retention cohorts, or top-customer concentration, so scale should not be mistaken for durable monetizable activity.
sections:
  - id: customer-segments
    title: Customer segments and monetization
    body: >-
      The assigned evidence points to individual retail investors as the core user group, but distinguishes at least two economically different behaviors: delivery investors, for whom the sources describe zero brokerage, and intraday or futures-and-options traders, who pay per executed order. One secondary analysis estimates that active F&O and intraday users account for roughly three-quarters of revenue; that is a publisher-reported revenue mix, not a disclosed customer share, and it is not independently verified here. The sources also describe Varsity, Coin, Console and Kite Connect as adjacent learning, mutual-fund, reporting and developer surfaces. They do not report how many brokerage customers use each adjacent product, whether those users are active, or whether use expands account value. This supports a product-based segmentation, not a demonstrated retention or expansion thesis.
    claimRefs:
      - CU001
      - CU007
      - CU008
      - CU009
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-signals
    title: Adoption signals are not a retention series
    body: >-
      Public articles report substantial scale, but their measures cannot be joined into a reliable growth or retention curve. A 2023 Medium article gives an NSE active-client figure for March 2022; later accounts variously report active clients, platform clients, or users without a consistent denominator. Entrackr attributes one FY25 user and market-share figure to NSE data but does not specify the observation date in the reviewed text. Another source claims more than ten million active users by 2025, while an encyclopedia entry reports approximately eight million clients for FY24. These statements may reflect different snapshots and definitions, and some are low-quality secondary reporting. They are useful as evidence that Zerodha has operated at large reported scale, not as comparable cohort, activity-frequency, or monetization metrics.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU010
    tableRefs:
      - TU002
  - id: proof-and-durability
    title: Customer proof, service friction and open diligence
    body: >-
      The reviewed pool contains company-level customer-count statements and descriptions of products, but no independently attributable named deployment with production status and a measured customer outcome. Nor does it provide retention, churn, renewal, cohort activity, or top-customer concentration data. One 2023 secondary article reports order-management glitches during heavy activity and reduced satisfaction at times; a separate encyclopedia summary describes a June 2024 access disruption and a resolved withdrawal-restriction controversy. These are bounded reports of service friction, not evidence of incident frequency or current service quality. The adoption thesis therefore rests on aggregate scale and an organic-acquisition narrative, while durability, customer economics and the quality of named references remain unverified.
    claimRefs:
      - CU009
      - CU011
      - CU012
      - CU013
      - CU014
    tableRefs:
      - TU003
tables:
  - id: TU001
    title: Customer segments and available evidence
    columns:
      - Segment / user
      - Product or activity described
      - Fee or strategic value reported
      - Evidence limit
    rows:
      - - Self-directed delivery investor
        - Equity delivery through the brokerage platform; direct mutual-fund access is also described.
        - Secondary reporting describes zero brokerage on equity delivery; segment revenue is not disclosed.
        - No count of active delivery-only investors, assets, repeat activity or retention is provided.
      - - Active intraday or F&O trader
        - Intraday and derivatives orders through the brokerage platform.
        - Secondary reporting describes per-order fees and estimates a high share of revenue from active F&O / intraday activity.
        - The revenue estimate is not a customer share and is not independently corroborated.
      - - Investor using adjacent or developer products
        - Sources describe Coin, Varsity, Console and Kite Connect as mutual-fund, education, reporting and API surfaces.
        - These may broaden use cases, but no attach rate, customer count or incremental revenue by product is reported.
        - Product availability does not establish adoption, expansion or retention.
    notes: >-
      Product and fee descriptions are secondary-source reporting from the assigned pool; no account-level or product-level denominator is available. The F&O / intraday revenue estimate is not an audited customer-mix figure.
    claimRefs:
      - CU007
      - CU008
      - CU009
  - id: TU002
    title: Reported customer and activity signals
    columns:
      - Source and stated period
      - Metric as reported
      - Population wording
      - Interpretation limit
    rows:
      - - Medium article; as of 31 March 2022
        - 62.77 lakh active customers; 17.42% of NSE active clients
        - Active customers / NSE active clients
        - Secondary article warns its figures may differ from exact numbers; not a current cohort.
      - - Go Be Unicorn; 2023 milestone
        - 1 crore+ active clients
        - Active clients
        - No measurement date, denominator methodology or underlying filing is supplied in the fetched text.
      - - Baidu Baike; FY ended 31 March 2024
        - Approximately 8 million clients
        - Platform clients
        - Secondary encyclopedia entry; not defined as monthly active or revenue-generating accounts.
      - - Entrackr; FY25 article
        - 7.26 million users; 15.8% market share
        - “Users” and NSE market share
        - Article does not state the observation date or clarify the user denominator in the reviewed passage.
      - - Business Max; by 2025
        - Over 10 million active users; 15% of retail trading volume
        - Active users / retail trading volume
        - Publisher-reported claim without a cited measurement method in the fetched text.
    notes: >-
      Figures are transcribed as each secondary source labels them and are not a like-for-like time series. “Active clients,” “clients,” “users,” market share and trading-volume share have different or unspecified denominators; do not infer retention, unique individuals or revenue contribution from the apparent changes.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU010
  - id: TU003
    title: Named customer proof table
    columns:
      - Evidence category
      - What the assigned sources establish
      - Production / outcome evidence
      - Diligence limitation
    rows:
      - - Named customer reference
        - No named customer deployment was verified in the assigned source sample.
        - No production-versus-pilot status or customer-attributed outcome was established.
        - Obtain customer permission, reference contact and deployment records.
      - - Retention or cohort durability
        - Aggregate client or user counts appear in secondary reporting.
        - No NRR, GRR, churn, renewal, cohort activity or repeat-use measure was located.
        - Request period-defined cohort data with active-account and revenue denominators.
      - - Customer concentration
        - One source estimates revenue exposure to active F&O / intraday users.
        - No top-customer or top-segment revenue concentration schedule was located.
        - Request revenue by customer segment and largest-customer bands.
    enumerationScope:
      coverage: sample
      basis: Sample limited to the successful customer-relevant URLs assigned to this chapter; it is not an exhaustive public-source search.
    notes: >-
      This is a partial evidence-status inventory, not an enumeration of Zerodha customers. Absence means the assigned successful sources did not substantiate the item; it does not prove that no such evidence exists elsewhere.
    claimRefs:
      - CU013
      - CU014
figures:
  - id: FU001
    title: Illustrative customer touchpoints
    type: journey-map
    summary: Secondary sources describe multiple customer-facing products, but do not establish a measured or mandatory path between them.
    data:
      items:
        - label: Learn
          touchpoints:
            - Varsity education content is described as a discovery surface; acquisition volume is not reported.
        - label: Open or hold an account
          touchpoints:
            - Published accounts use different client and user definitions; account-opening conversion is not reported.
        - label: Trade or invest
          touchpoints:
            - Kite, delivery investing and intraday / F&O activity are described; active-use cohorts are not disclosed.
        - label: Use mutual-fund products
          touchpoints:
            - Coin is described as a direct mutual-fund surface; customer adoption and assets are not verified here.
        - label: Review activity
          touchpoints:
            - Console is described as an account-reporting surface; usage frequency and outcomes are not reported.
        - label: Build through an API
          touchpoints:
            - Kite Connect is described for developers; developer-customer counts and retention are not reported.
    approximationNotes: >-
      The order is an illustrative inventory of cited product surfaces, not an observed customer journey, conversion funnel or universal sequence. Product descriptions come from secondary sources; adoption and outcomes are unmeasured.
    claimRefs:
      - CU008
      - CU009
