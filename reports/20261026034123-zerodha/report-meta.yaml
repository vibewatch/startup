companyProfile:
  summary: >-
    Zerodha is a privately held Indian discount brokerage founded by brothers Nithin and Nikhil Kamath. Public profiles
    describe it as bootstrapped, with a digital retail brokerage model and adjacent investing, education, reporting, and
    developer products. FY25 reporting shows substantial revenue and profit but a year-on-year contraction; the
    available evidence does not resolve segment economics, customer durability, or a current transaction-quality
    valuation.
