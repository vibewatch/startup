  topStrengths:
    - Bootstrapped history and an established digital retail-brokerage platform.
    - FY25 reporting still shows substantial earnings and a large cash-and-bank balance.
    - Multiple adjacent product surfaces broaden the potential use cases beyond brokerage.
  topRisks:
    - FY25 revenue and profit contracted, with reported exposure to trading activity and derivatives-related regulation.
    - >-
      No current transaction-quality price, ownership terms, or suitable comparable set supports an investable
      valuation.
    - >-
      Customer counts use inconsistent definitions, while retention, segment economics, acquisition efficiency, and
      concentration remain undisclosed.
    - >-
      Reported cash does not establish unrestricted liquidity, and entity-level technology and counterparty controls
      remain unclear.
  unresolvedGaps:
    - A post-June-2025 primary or secondary transaction with price, share class, dilution, and preference terms.
    - Audited current consolidated and segment-level financials that reconcile revenue scope and earnings sensitivity.
    - >-
      Period-defined funded, active, and transacting customer cohorts, including retention, CAC/payback, and customer
      concentration.
    - >-
      Ownership and governance detail, unrestricted-cash reconciliation, and entity-level operational, vendor, and
      recovery evidence.
