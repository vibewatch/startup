  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Evidence-backed role or economic relevance
      - Current evidence limitation
      - Diligence ask
    rows:
      - - Nithin and Nikhil Kamath
        - Identified as co-founders; Nithin has a reported trading and sub-broker background
        - Current ownership and executive responsibilities are not established
        - Obtain current cap table, voting rights, roles, and succession plan
      - - Employee shareholders
        - A 2021 ESOP liquidation reportedly provided liquidity to employees
        - Number of participants, shares sold, and present ownership are not reported
        - Verify plan terms, remaining employee equity, and transfer restrictions
      - - Retail brokerage clients
        - A secondary case study reports 7.3+ million active clients for FY24–FY25
        - Exact date, activity threshold, and current active-client trend are absent
        - Obtain dated active, funded, and transacting client cohorts
      - - SEBI and market infrastructure
        - Baike identifies derivatives regulation as a challenge to the business
        - The retained pool has no regulator-issued notice or quantified current impact
        - Reconcile applicable rules and revenue sensitivity from primary records
      - - Valuation stakeholders
        - Hurun published an US$8.2 billion index estimate in 2025
        - No transaction-quality reference or current valuation is established
        - Request recent secondary, tender, or other priced transaction evidence
    enumerationScope:
      coverage: partial
