      - ["Console reporting", "Historical trade breakdown and portfolio profit/loss reporting", "Zerodha product page describes tens of billions of rows", "Reconciliation, accuracy controls, and reporting service levels are unknown"]
      - ["Kite Connect", "Application access through APIs", "Zerodha describes app-building access; UpGrowth reports HTTP and JSON", "Authentication design, versioning, support, security review, and production usage are unavailable"]
      - ["Runtime and monitoring", "Container/Kubernetes migration and named monitoring/data-delivery tools", "Reported by Baidu Baike; not independently verified as current", "Current topology, cloud/provider dependencies, failover, and deployment controls are unknown"]
      - ["Security and network protection", "Cloudflare WAF and DDoS protection are reported", "Reported by Baidu Baike; no primary configuration or assurance record in the pool", "Current scope, privacy controls, testing, certification, and control effectiveness are unknown"]
      - ["Availability incident", "Some users reportedly could not execute trades during a June 3, 2024 access disruption", "Reported by Baidu Baike", "Root cause, duration, impact, recovery, and remediation are not documented in the excerpt"]
    notes: >-
      This table distinguishes company feature descriptions from secondary
      infrastructure and incident reporting. It is not an exhaustive inventory or a
      verified internal architecture diagram; unknowns are not evidence of absence.
    claimRefs: [CE002, CE003, CE004, CE008, CE009, CE010, CE011, CE012]
