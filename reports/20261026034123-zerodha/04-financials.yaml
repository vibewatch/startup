    title: Reported revenue streams and monetization
    columns: [Stream, Mechanism or price, Reported value or status, Evidence quality, Underwriting implication, Diligence ask]
    rows:
      - [Equity delivery brokerage, "Third-party descriptions say zero brokerage", "Reported schedule; current official tariff not in assigned evidence", "Kuvera and UpGrowth commentary; UpGrowth page has a date inconsistency", "Acquisition and retention mechanism may not generate direct delivery brokerage", "Obtain current official tariff and realized-fee schedule"]
      - ["Intraday, futures, and options brokerage", "Third-party descriptions report per-order charges", "No revenue split by instrument or customer cohort", "Reported commentary, not a company filing", "Activity mix and fee realization drive sensitivity", "Obtain order counts, realized fees, and revenue by instrument"]
      - [Interest on client funds and lending, "Interest income is reported as a revenue stream", "FY26 amount in secondary commentary is not relied on because of its publication-date inconsistency", "Entrackr lists interest income; Inc42 describes lending expansion", "Rate, balances, funding cost, and credit losses are undisclosed", "Request revenue, average balance, yield, funding cost, and loss data"]
      - [Investment management and software services, "Entrackr lists both among contributing lines", "No segment amounts disclosed in assigned sources", "Secondary reporting; no segment statement retained", "Potential diversification cannot yet be sized", "Request audited segment revenue and contribution margin"]
      - [Margin trading facility, "Lending against securities, as described by Inc42", "Inc42 reports approximately ₹8,500 crore and separately cites ₹7,400 crore", "Conflicting secondary figures; do not treat either as a reconciled balance", "Growth creates both interest revenue and credit/capital exposure", "Reconcile book date, drawn balance, commitments, delinquency, and loss history"]
    notes: Values and mechanisms are attributed to the cited reports; no source in the assigned evidence provides a reconciled segment mix or realized pricing. The FY26 secondary figures with a publication-date inconsistency are not used as verified financial results.
    claimRefs: [CI001, CI002, CI008, CI014, CI015, CI016]
  - id: TI002
    title: Reported performance and operating-cost indicators
    columns: [Metric, Period and value, Source attribution, Interpretation, Key limitation]
    rows:
      - [Revenue from operations, "FY25: ₹8,847 crore", "Entrackr; also reported by Drudhh", "Reported down 11.5% year over year", "FY24 comparison base differs across sources"]
      - [Net profit, "FY25: ₹4,237 crore", "Entrackr; also reported by Drudhh", "Reported down 22.9% year over year", "Accounting profit is not cash burn or free cash flow"]
      - [Salary expense, "FY25: ₹539 crore; FY24: ₹410 crore", "Entrackr", "Reported increase of 31%", "No allocation by business line or employee cohort"]
      - [Other expense indicators, "FY25: fees and commissions ₹2,328 crore; professional and technical services ₹96 crore; advertising ₹47 crore", "Entrackr", "Shows material transaction-linked and operating costs", "Category totals do not establish unit cost or CAC"]
      - [Total costs, "FY25: ₹3,238 crore; FY24: ₹3,119 crore", "Entrackr", "Reported costs rose while reported revenue and profit declined", "No working-capital, capex, or gross-margin bridge"]
      - [Reported profitability metrics, "FY25 EBITDA margin: 63.78%; ROCE: 32%", "Entrackr", "Profitability remains high in reported figures", "Neither metric provides gross margin or product-level contribution"]
    notes: FY25 and FY24 figures are reported values, not a reconstructed income statement. Cost categories and margins are not mapped to individual products; advertising expense alone is not customer-acquisition cost.
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI011]
  - id: TI003
    title: Capital position and underwriting gaps
    columns: [Area, Publicly reported evidence, What it supports, What it does not establish, Diligence request]
    rows:
      - [Cash and bank balances, "₹22,679 crore as of FY25", "A large reported balance-sheet cash-and-bank line", "Unrestricted cash, client-fund segregation, or distributable liquidity", "Reconcile bank balances, restrictions, client funds, and obligations"]
      - [Current assets, "₹35,719 crore as of FY25", "Reported current-asset total", "Cash conversion, maturity, liquidity, or asset quality", "Provide audited current-asset schedule and maturity profile"]
      - [Runway and burn, "No cash-burn or runway figure in assigned sources", "A public-disclosure gap", "That the company has no burn or unlimited runway", "Provide monthly operating cash flow, capex, and stress-case runway"]
      - [Unit economics, "No CAC, payback, cohort retention, or product contribution margin in assigned sources", "Underwriting inputs remain unavailable", "Efficient acquisition or attractive marginal economics", "Provide acquisition cohorts, activity, retention, realized revenue, and allocated costs"]
    notes: FY25 balance-sheet values are attributed to Entrackr. Current assets and cash-and-bank balances must not be treated as cash available for operations without a client-funds and restrictions reconciliation.
    claimRefs: [CI010, CI011, CI012, CI013]
figures:
  - id: FI001
    title: Monetization pathways and reported financial output
    type: flow
    summary: Customer trading, cash balances, and lending can feed distinct reported revenue streams; available sources do not quantify their individual contributions.
    data:
      nodes:
        - id: client-activity
          label: Client trading and investing activity
          detail: Includes delivery investing and higher-frequency trading; activity levels are not split in the assigned evidence.
        - id: delivery
          label: Equity delivery
          detail: Secondary descriptions report zero brokerage; current official tariff was not retained.
        - id: active-trading
          label: Intraday, futures, and options
          detail: Per-order brokerage is reported, but revenue by instrument is unavailable.
        - id: balances-lending
          label: Client balances and secured lending
          detail: Interest income and MTF are described; balances, funding costs, and credit losses are not reconciled.
        - id: other-services
          label: Software and investment-management services
          detail: Listed as contributing revenue streams without segment values.
        - id: operating-revenue
          label: Operating revenue
          detail: FY25 reported at ₹8,847 crore; the FY24 comparison base requires reconciliation.
        - id: operating-costs
          label: Operating costs
          detail: FY25 total costs reported at ₹3,238 crore; allocation by revenue stream is unavailable.
        - id: net-profit
          label: Net profit
          detail: FY25 reported at ₹4,237 crore; it is not a measure of cash burn.
      edges:
        - from: client-activity
          to: delivery
          label: includes
        - from: client-activity
          to: active-trading
          label: includes
        - from: client-activity
          to: balances-lending
          label: generates balances and borrowing demand
        - from: client-activity
          to: other-services
          label: supports
        - from: delivery
          to: operating-revenue
          label: no direct brokerage reported
        - from: active-trading
          to: operating-revenue
          label: brokerage
        - from: balances-lending
          to: operating-revenue
          label: interest
        - from: other-services
          to: operating-revenue
          label: fees
        - from: operating-revenue
          to: net-profit
          label: less costs and other items
        - from: operating-costs
          to: net-profit
          label: deducted
    claimRefs: [CI001, CI003, CI005, CI008, CI014]
