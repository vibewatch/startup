artifact: financials
slug: zerodha
runDate: 2026-10-26
company:
  name: Zerodha
chapter:
  number: 4
  title: Financials
  summary: FY25 reporting shows substantial revenue and profit despite a year-on-year contraction, while FY25 cash and bank balances provide a notable liquidity buffer. Underwriting remains constrained by inconsistent FY24 revenue baselines, undisclosed segment economics and acquisition efficiency, and exposure to market activity and regulation.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Public reporting describes Zerodha as monetizing several distinct activities rather than
      charging every investor in the same way. Kuvera and UpGrowth describe zero brokerage on
      equity delivery and flat order-based charges for active trading, while Entrackr identifies
      brokerage as the primary revenue stream and also lists investment-management fees, software
      services, and interest income. Inc42 describes newer lending, asset-management, and wealth
      initiatives, but the assigned evidence does not quantify the contribution of those lines.
      These are reported mechanisms, not a reconciled revenue mix: the sources do not disclose
      realized prices after discounts, per-stream revenue, or gross profit by product.
    claimRefs: [CI001, CI002, CI008, CI014, CI015, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: performance-and-costs
    title: Reported performance, cost structure, and cyclicality
    body: >-
      Entrackr reports FY25 operating revenue of ₹8,847 crore and net profit of ₹4,237 crore,
      with declines of 11.5% and 22.9%, respectively. Drudhh independently repeats those FY25
      values, but the FY24 comparison base needs care: both sources use ₹9,993 crore for revenue,
      whereas The Hindu BusinessLine reports FY24 revenue from operations of ₹9,372 crore and
      total income of ₹9,994 crore. That difference may reflect scope or line-item labeling; it
      cannot be resolved from the assigned texts. Entrackr also reports rising total costs and
      salary expense in FY25. Inc42's reported industry F&O contraction and an executive's
      description of market and regulatory sensitivity make the decline a structural exposure,
      not evidence of a cash burn or a company-specific loss rate.
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI009, CI011]
    tableRefs: [TI002]
  - id: capital-and-efficiency
    title: Capital adequacy and unit-economics limits
    body: >-
      Entrackr reports ₹22,679 crore of cash and bank balances and ₹35,719 crore of current
      assets as of FY25. Those balance-sheet amounts are not equivalent to unrestricted cash,
      free cash flow, or runway: the assigned evidence does not provide a client-funds
      reconciliation, restrictions, maturity profile, or cash-burn measure. Nor does reported
      advertising expense establish customer-acquisition cost or payback; it excludes other
      acquisition channels and does not connect spend to activated, retained, or profitable
      cohorts. Tracxn's profile lists multiple Zerodha legal entities with separately dated
      revenue ranges, reinforcing the need to reconcile consolidated and entity-level scope
      before building a margin bridge.
    claimRefs: [CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting verdict and diligence priorities
    body: >-
      The reported FY25 profit and cash balance indicate substantial capacity to absorb a weaker
      trading period, but they do not settle durability or liquidity availability. Inc42 reports
      management's effort to diversify away from market-correlated revenue and reports two
      different MTF book figures, so the book size and associated credit exposure require
      reconciliation rather than a single point estimate. Hindustan Times describes a
      price-update issue that was resolved within minutes and says order placement was not
      affected; this is a specific operational incident, not proof of a broader outage pattern.
      Before underwriting, request audited revenue by stream and legal entity, realized pricing,
      contribution margins, customer activity cohorts, CAC/payback, MTF delinquencies and funding,
      and a cash bridge separating company liquidity from client balances and obligations.
    claimRefs: [CI009, CI010, CI013, CI015, CI016]
callouts:
  - calloutType: risk
    title: Profitability is visible; durability is not
    body: FY25 results remain substantial, but public evidence does not resolve revenue-line concentration, the inconsistent FY24 revenue base, or how much reported cash is available after client-related obligations.
    claimRefs: [CI003, CI004, CI009, CI010]
