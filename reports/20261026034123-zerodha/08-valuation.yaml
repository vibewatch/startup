company:
  name: Zerodha
chapter:
  number: 8
  title: Valuation
  summary: >-
    Zerodha's FY25 profitability and reported cash position support a strong
    business-quality case, but the assigned evidence contains no current
    transaction-quality price or fully comparable valuation basis. A
    research-more / track stance is more defensible than a buy or a numerical
    scenario range until current filings, ownership terms, and market
    benchmarks are verified.
sections:
  - id: decision-and-entry-discipline
    title: Decision and entry discipline
    body: >-
      The evidence supports a high-quality operating business, not a defensible
      entry price. Hurun's Global Unicorn Index 2025 places Zerodha at US$8.2
      billion, but its stated index cut-off is 1 January 2025 and its release
      was 26 June 2025; it is an estimate, not evidence of a recent share
      transaction. WorthScale's May 2026 page says approximately US$8 billion
      while also presenting a materially different Hurun India 500 figure,
      without an evident valuation method. Those references are context, not
      interchangeable price observations. FY25 revenue and profit declined
      from FY24, while Entrackr reported substantial cash and bank balances.
      Given the missing current price, share-class terms, and FY26 audited
      segment data, the decision is research-more / track, with low valuation
      confidence and high risk rather than a buy recommendation.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV014]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The thesis is a bootstrapped brokerage with a sizable client franchise,
      high historical profitability, and reported liquidity: Zerodha's own
      About page says it serves over 1.8 crore clients and contributes over
      15% of Indian retail trading volumes, while Entrackr reports FY25
      revenue from operations of Rs 8,847 crore and profit of Rs 4,237 crore.
      The anti-thesis is that both FY25 measures fell year over year and NSE
      active-client data show a smaller industry and lower Zerodha share in
      FY26. Registered clients and monthly active accounts are different
      denominators, so neither should substitute for paid activity or
      retention. The available pool does not establish segment margins,
      retention cohorts, or the share of revenue exposed to derivatives
      regulation; claims about these exposures from the UpGrowth teardown are
      not relied on as verified financial facts.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-valuation-method
    title: Scenarios and valuation method
    body: >-
      A defensible valuation would triangulate a current primary or secondary
      transaction, audited earnings and segment economics, and genuinely
      comparable public broker or private fintech evidence. The assigned pool
      provides one dated unicorn-index estimate and one unsourced commercial
      estimate, but no disclosed transaction terms, current capitalization
      table, preference stack, or comparable-company financial set. It also
      mixes revenue from operations, consolidated revenue, and total income
      across sources and periods; those are not interchangeable multiples
      denominators. Consequently, bull, base, and bear operating assumptions
      can be identified, but neither an absolute valuation range nor a
      probability-weighted return can be responsibly calculated from these
      materials. TV003 records the conditions that would change that result.
    claimRefs: [CV001, CV002, CV003, CV004, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-and-thesis-breaks
    title: Exit readiness and diligence priorities
    body: >-
      Before pricing an investment, request the latest audited consolidated
      statements and segment schedules; reconcile FY24 revenue from operations
      with the different FY24 consolidated-revenue and total-income figures
      reported by Entrackr and Inc42; and obtain monthly active, funded, and
      transacting client cohorts. Confirm any post-June-2025 primary,
      employee, or secondary transaction, including share class, preferences,
      transfer restrictions, and implied fully diluted value. Test downside
      against further declines in brokerage activity, regulatory changes, and
      margin compression, while treating adjacencies as unproven until their
      revenue and returns are separately disclosed. A sustained deterioration
      in revenue or active clients, an adverse regulatory change to core
      monetization, or a price unsupported by normalized earnings should
      trigger a thesis reset. Exit readiness and public-peer comparability
      remain unresolved rather than presumed.
    claimRefs: [CV004, CV005, CV007, CV008, CV011, CV012, CV013, CV014]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision dimension, Assessment, Evidence and limitation, Decision implication]
    rows:
      - [Recommendation, "Research more / track", "Strong FY25 reported earnings and cash coexist with falling FY25 revenue and profit; no current transaction price is in the assigned pool.", "Do not treat an index estimate as an investable entry price."]
      - [Confidence and risk, "Low valuation confidence; high risk", "No current cap table, preference terms, FY26 audited segment schedule, or current transaction evidence.", "Hold the call until price and earnings quality are verified."]
      - [Valuation stance, "Not rateable as cheap or expensive", "Hurun's US$8.2bn estimate is dated to its 2025 index; WorthScale's approximate US$8bn estimate has no evident method.", "No buy or target return is supportable from these marks."]
      - [Entry discipline, "Require price and terms evidence", "Obtain current primary or secondary price, share class, dilution, preferences, and normalized earnings.", "Reassess only after a transaction-quality reference and comparable basis are available."]
    notes: >-
      Decision synthesis from the cited dated estimates and FY25 reporting;
      reported company metrics are not independently audited here, and no
      investment price or return is inferred.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence, What would strengthen or weaken the view]
    rows:
      - ["Thesis: scaled franchise", "Zerodha's About page reports over 1.8 crore clients and over 15% of Indian retail trading volumes.", "Verify funded, active, and revenue-generating cohorts; registered clients are not monthly active accounts."]
      - ["Thesis: historically strong earnings and liquidity", "Entrackr reports FY25 revenue from operations of Rs 8,847 crore, profit of Rs 4,237 crore, and cash and bank balances of Rs 22,679 crore.", "Review audited statements, cash restrictions, and sustainable earnings after market and regulatory effects."]
      - ["Anti-thesis: operating momentum weakened", "Entrackr reports FY25 revenue from operations down 11.5% and profit down 22.9% year over year.", "Check FY26 audited results, segment mix, and whether declines stabilized or continued."]
      - ["Anti-thesis: activity and regulatory sensitivity", "CNBC TV18 reports NSE active-client accounts fell 7% across FY26 and Zerodha's share fell to 15.08% from 16.03%.", "Reconcile activity by venue and define verified revenue exposure to derivatives rules."]
    notes: >-
      Company-reported client/volume figures, financial-reporting figures, and
      NSE active-client measures have different sources, periods, and
      denominators; they should not be combined into one customer metric.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns: [Scenario, Explicit assumptions and triggers, Valuation / return logic, Probability signal]
    rows:
      - ["Bear", "Brokerage activity and revenue weaken further; regulation or competition pressures monetization; FY26 audited earnings confirm lower run-rate.", "Absolute value range and return are not estimable without a current transaction price, normalized earnings, and share-class terms; downside is material.", "Plausible downside, not quantified; monitor revenue, active clients, and regulation."]
      - ["Base", "FY25 declines stabilize; cash generation remains positive; adjacent products contribute only when separately evidenced.", "No defensible multiple or range from the available evidence; use a verified current price and audited segment earnings before underwriting.", "Central case cannot be probability-weighted from this source set."]
      - ["Bull", "Active-client activity and earnings recover; disclosed adjacencies diversify revenue without eroding margins.", "Upside range and target return are not estimable absent current price, segment economics, and comparable-company evidence.", "Possible but unverified; require cohort and segment proof."]
    notes: >-
      Scenarios are conditional diligence cases, not forecasts. No numerical
      valuation ranges or probabilities are supplied because the evidence
      lacks a current transaction-quality price, FY26 audited segment
      economics, and an appropriate comparable set.
    claimRefs: [CV001, CV002, CV004, CV005, CV007, CV008, CV011, CV012, CV013, CV014]
