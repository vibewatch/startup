slug: zerodha
runDate: "2026-10-26"
company:
  name: Zerodha
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    India securities-brokerage estimates indicate a large, growing revenue pool, but
    published forecasts use different horizons and do not isolate Zerodha's serviceable
    market. More recent exchange-client reporting shows FY26 contraction in active
    accounts, so market size alone overstates near-term adoption momentum.
sections:
  - id: market-boundary-and-spend
    title: Define the market by broker revenue, not investor assets
    body: >-
      The relevant market is the revenue earned by securities brokers for execution and
      related services, rather than the value of securities held by investors, exchange
      turnover, or the number of accounts. Mordor Intelligence defines its India
      securities-brokerage market as annual broker revenue from securities brokerage
      plus related margin funding, distribution, and wealth services. That definition
      is broader than pure trade commissions and means adjacent services should not be
      counted again as a separate market without reconciling the publisher's scope.
      Zerodha's reported product range spans several instruments, but the assigned
      sources do not provide a revenue split by instrument or service. Accordingly,
      public-market estimates are directional context, not a company-level TAM. [CM001,
      CM012, CM013]
    claimRefs: [CM001, CM012, CM013]
    tableRefs: [TM001]
  - id: published-market-estimates
    title: Published estimates are comparable only at a high level
    body: >-
      Two publisher summaries place India's securities-brokerage market at USD 6.98
      billion in 2026, but their forecast horizons differ: Research and Markets lists
      USD 13.09 billion by 2031, while Mordor Intelligence forecasts USD 14.47 billion
      by 2032. Their stated CAGRs also cover different periods. Mordor describes a
      proprietary estimation framework using nine months of actuals and a Q4 projection
      for its 2026 base; the fetched Research and Markets page does not expose a
      comparable methodology. The shared 2026 number is not independent confirmation
      of a measured market, and neither estimate supplies a Zerodha-specific SAM or
      SOM. Treat the forecasts as publisher-defined scenarios rather than audited
      revenue totals. [CM002, CM003, CM004, CM005, CM016]
    claimRefs: [CM002, CM003, CM004, CM005, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-and-budget-map
    title: Retail investors occupy distinct usage and payment paths
    body: >-
      The primary buyer and user evidenced in this pool is the self-directed retail
      investor; the investor is also the fee payer where the broker charges per order.
      Within that population, delivery-focused investors and active traders have
      different activity and fee profiles: UpGrowth reports zero brokerage on equity
      delivery and capped or flat per-order brokerage for intraday, futures, and
      options as of September 2026. These prices do not include statutory charges,
      and they do not establish total customer economics. Traditional full-service
      brokerage is a status-quo alternative described as relationship-manager-led,
      while digital discount models compete on lower transaction friction. Assigned
      sources do not quantify segment budgets, willingness to pay, or conversion
      between registrations and active clients. [CM011, CM012, CM013, CM014]
    claimRefs: [CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
  - id: adoption-and-constraints
    title: FY26 active-client contraction tempers the growth narrative
    body: >-
      Exchange-client reporting shows a demand constraint alongside the longer-term
      market forecasts: NSE active client accounts declined from 4.92 crore in March
      2025 to 4.57 crore in March 2026. CNBC TV18 and The Hindu BusinessLine both
      report Zerodha's NSE active-client share falling from 16.03% to 15.08%; the
      latter attributes the contraction to a mix of tighter F&O rules, market
      volatility, and investor inactivity. UpGrowth separately reports 67.97 lakh
      Zerodha NSE active clients for August 2026, a monthly activity measure that
      should not be conflated with the 1.8 crore registered-client figure it cites
      from Zerodha's About page. These data argue for tracking retention and active
      usage, not registrations alone. They do not establish churn among all users or
      predict future market revenue. [CM006, CM007, CM008, CM009, CM010, CM015]
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM015]
tables:
  - id: TM001
    title: Market boundary and included activity
    columns:
      - Segment or category
      - Included spend or activity
      - Exclusions or limits
      - Buyer / payer
      - Relevance to Zerodha
    rows:
      - - Securities brokerage and execution
        - "Broker revenue for securities execution; Mordor's market definition includes brokerage revenue."
        - "Trading turnover and investor asset balances are not broker revenue."
        - "Self-directed investor; per-order payer where brokerage applies."
        - "Core market category, but assigned sources do not isolate Zerodha revenue by instrument."
      - - Margin funding
        - "Included as a related service in Mordor's stated market definition."
        - "No market-wide or Zerodha-specific margin-funding amount is isolated in the assigned evidence."
        - "Investor using a financing service."
        - "Adjacent monetization; do not add a separate total without matching the market definition."
      - - Distribution and wealth services
        - "Included as related services in Mordor's stated market definition."
        - "No comparable service-level market values are provided in the assigned evidence."
        - "Retail investor using a distribution or wealth service."
        - "Potential adjacency, not a quantified Zerodha SAM."
      - - Discount and full-service brokerage
        - "Different service and delivery models within brokerage; R&M lists service-type categories and Markhub describes relationship-manager-led incumbents."
        - "Do not treat service models as incremental spend on top of total brokerage revenue."
        - "Retail investor or trader."
        - "Status quo and low-cost alternatives shape adoption and pricing."
      - - Accounts, securities holdings, and turnover
        - "Activity or population indicators only; not broker revenue."
        - "Not a spend pool and not an additive TAM."
        - "Investor / account holder."
        - "Useful demand context only when the metric's date and activity definition are retained."
    notes: >-
      Boundary follows Mordor's publisher-defined revenue scope; individual adjacent
      categories are not separately quantified here. Account counts, trading activity,
      and customer assets are not converted into revenue.
    claimRefs: [CM001, CM012, CM013]
  - id: TM002
    title: India securities-brokerage market estimates
    columns:
      - Publisher
      - Geography / base
      - Published values
      - CAGR and period
      - Methodology visible in fetched text
      - Confidence
      - Limitation
    rows:
      - - Research and Markets
        - "India; 2025 base estimate"
        - "USD 6.18bn (2025); USD 6.98bn (2026); USD 13.09bn (2031)"
        - "13.33% over 2026-2031"
        - "Methodology not visible in the fetched listing summary."
        - "Medium; publisher listing, not an audited industry total."
        - "Scope and forecast methods cannot be reconciled with Mordor from the assigned page."
      - - Mordor Intelligence
        - "India; 2026 base estimate"
        - "USD 6.98bn (2026); USD 7.91bn (2027); USD 14.47bn (2032)"
        - "12.84% over 2027-2032"
        - "Proprietary estimation framework; nine months of actuals plus Q4 projection for 2026 base."
        - "Medium; analyst-market estimate."
        - "Publisher-defined scope includes brokerage plus related margin funding, distribution, and wealth services."
    notes: >-
      Values are publisher estimates and forecasts, not reported company revenue or
      audited totals. The identical 2026 values do not prove independent corroboration;
      forecast endpoints and CAGR periods differ, and the Research and Markets page
      does not disclose methodology in the fetched summary.
    claimRefs: [CM002, CM003, CM004, CM005]
  - id: TM003
    title: Buyer, user, payer, and adoption map
    columns:
      - Segment
      - Buyer
      - User
      - Payer / budget owner
      - Workflow
      - Adoption trigger or constraint
    rows:
      - - Delivery-oriented retail investor
        - "Individual investor"
        - "Self-directed investor"
        - "Investor; equity-delivery brokerage may be zero, while statutory charges remain separate."
        - "Digital account and order workflow for buying and holding securities."
        - "Low transaction cost is a stated proposition; active conversion is not quantified."
      - - Active retail trader
        - "Individual trader"
        - "Trader placing intraday, futures, or options orders"
        - "Investor pays per-order brokerage where applicable."
        - "Repeated digital order execution and, where used, related funding services."
        - "Price and market activity matter; FY26 NSE active-client data contracted."
      - - Traditional full-service customer
        - "Retail investor seeking broker services"
        - "Investor using broker platform and/or relationship support"
        - "Investor; fee schedule not quantified by assigned sources."
        - "Relationship-manager-led model described as a historical/status-quo alternative."
        - "Discount brokers offer lower transaction friction; switching and willingness to pay are not measured."
      - - Zerodha addressable customer slice
        - "Retail customer"
        - "Registered or active platform user; metrics are not interchangeable."
        - "Unknown without segment revenue and activity data."
        - "Mix of delivery, active trading, and adjacent services."
        - "Company-specific SAM, retention cohorts, and monetizable activity remain unisolated."
    notes: >-
      This is a source-constrained segment map, not a complete customer enumeration.
      Buyer budgets, willingness to pay, and segment-level revenue are not disclosed
      in the assigned evidence.
    claimRefs: [CM009, CM010, CM011, CM012, CM013, CM014, CM015, CM016]
figures:
  - id: FM001
    title: Market sizing lenses and evidence boundary
    type: pyramid
    summary: >-
      Published market forecasts, exchange-active clients, and Zerodha-specific
      activity are distinct lenses, not convertible funnel stages or proportional
      market shares.
    data:
      items:
        - label: "India securities-brokerage market estimate"
          value: "USD 6.98bn (2026)"
          detail: "Same reported 2026 value in two publisher summaries; not an audited actual."
        - label: "Publisher forecast endpoints"
          value: "USD 13.09bn (2031) / USD 14.47bn (2032)"
          detail: "Different forecast horizons and CAGR periods; not one continuous estimate."
        - label: "NSE active-client base"
          value: "4.57 crore (March 2026)"
          detail: "Active NSE client accounts, not all Indian investors or broker revenue."
        - label: "Zerodha NSE active-client share"
          value: "15.08% (March 2026)"
          detail: "Reported market share; does not equal share of total brokerage revenue."
        - label: "Zerodha monthly NSE active clients"
          value: "67.97 lakh (August 2026)"
          detail: "Secondary report's monthly active measure; distinct from registered-client count."
        - label: "Zerodha-specific SAM / SOM"
          value: "Not isolated"
          detail: "No assigned source provides service-level revenue, cohort conversion, or an obtainable-share denominator."
    approximationNotes: >-
      Conceptual evidence layers only, not to scale. The figures use different
      definitions, units, and dates; do not interpret their order as a funnel,
      conversion rate, proportional width, or additive market total.
    claimRefs: [CM004, CM006, CM007, CM009, CM016]
