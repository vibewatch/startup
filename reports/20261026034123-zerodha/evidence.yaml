evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-and-ownership
    missingEvidence: A current cap table, board and executive roster, voting-rights schedule, ESOP share detail, and succession plan.
    whyItMatters: >-
      The retained public profiles identify founders and one historical employee liquidity event but cannot establish
      present control, economic ownership, or key-person dependence.
    diligencePath: >-
      Request current company-secretary-certified ownership and board materials, ESOP records, and documented executive
      succession coverage.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: transaction-quality-valuation
    missingEvidence: >-
      A dated primary financing, secondary sale, tender, or other transaction-quality price reference after the 2021
      employee liquidity event and Hurun's 2025 index estimate.
    whyItMatters: >-
      The reported historical ESOP exercise and an index estimate use different methods and cannot establish a current
      market-clearing equity value.
    diligencePath: >-
      Obtain transaction documents or a company-confirmed share price, date, security class, and fully diluted
      denominator.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: active-client-denominator
    missingEvidence: >-
      A dated client series that distinguishes registered accounts, funded accounts, monthly active clients, and trading
      clients under a consistent definition.
    whyItMatters: >-
      The only retained active-client figure lacks an exact as-of date and activity threshold, preventing a reliable
      scale or monetization comparison.
    diligencePath: >-
      Request a dated company or exchange series with definitions, period coverage, and reconciliation to total
      registered accounts.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: Zerodha-SAM-SOM
    missingEvidence: >-
      Zerodha-specific revenue by service, active and retained-client cohorts, conversion from registered users to
      transacting users, and a defensible serviceable-market and obtainable-share denominator.
    whyItMatters: >-
      India-wide brokerage forecasts and NSE active-account totals cannot be translated into Zerodha's serviceable
      spend, monetizable demand, or realistic market share without company-level segment and activity data.
    diligencePath: >-
      Obtain company filings and service-level revenue, internal cohort and activity definitions, and reconcile these
      with NSE and SEBI market data; do not derive Zerodha SAM or SOM from the broad market forecasts alone.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: broker-retention-and-switching
    missingEvidence: >-
      Comparable active-user retention cohorts, broker-to-broker transfers, customer overlap, and switching-cost
      evidence for Zerodha and its principal alternatives.
    whyItMatters: Active-client share changes do not establish retention, customer quality, or a durable distribution advantage.
    diligencePath: >-
      Request matched monthly active and funded-account cohorts, transfer data, and customer research from Zerodha and
      the major competing brokers.
    relatedQuestionRefs:
      - QP008
  - type: conflicting-data
    severity: material
    topic: broker-pricing
    missingEvidence: >-
      Current official rate cards for Zerodha, Groww, and Upstox, including applicable order-value thresholds and all
      statutory charges.
    whyItMatters: The two secondary Zerodha pricing claims differ, and the unusual Upstox delivery figure lacks a cited methodology.
    diligencePath: Verify the official rate cards and calculate comparable customer costs for identical order sizes and products.
    relatedQuestionRefs:
      - QP003
      - QP006
      - QP004
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Audited revenue, contribution margin, and realized pricing by brokerage, interest, lending, software, investment
      management, and wealth lines.
    whyItMatters: >-
      Without segment economics, the durability and concentration of reported group profit cannot be underwritten or
      stress-tested by revenue source.
    diligencePath: >-
      Request audited segment schedules, recognized revenue policies, monthly product-level activity, realized fees,
      funding costs, and product contribution margins.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI007
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: acquisition-efficiency
    missingEvidence: Customer-acquisition cost, payback, retention, and contribution by paid, referral, organic, and partner channels.
    whyItMatters: >-
      Advertising expense is only one cost category and cannot establish whether new or retained customers generate
      attractive economics.
    diligencePath: >-
      Request channel-level acquisition cohorts, onboarding conversion, retained active-user rates, referral payouts,
      and revenue less directly attributable costs.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: liquidity
    missingEvidence: >-
      Cash flow, unrestricted cash, client-fund segregation, restricted balances, debt and contingent obligations, and
      monthly burn or runway.
    whyItMatters: >-
      Reported cash and current assets do not show how much liquidity is available to fund operations or absorb a stress
      scenario.
    diligencePath: >-
      Obtain audited cash-flow statements, a bank-balance reconciliation, client-fund schedules, restrictions,
      obligations, and management's downside liquidity forecast.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: FY24-revenue-comparison
    missingEvidence: >-
      A consolidated FY24 statement that reconciles revenue from operations, total income, and legal-entity scope with
      the FY25 comparison.
    whyItMatters: >-
      The ₹9,993 crore comparison reported by Entrackr and Drudhh is not the same as The Hindu BusinessLine's ₹9,372
      crore FY24 revenue-from-operations figure, which it distinguishes from ₹9,994 crore total income.
    diligencePath: >-
      Compare the audited FY24 and FY25 consolidated filings, including entity perimeter, restatements, and exact
      income-statement line labels.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: internal-architecture
    missingEvidence: >-
      Current primary architecture documentation covering market-data and order-routing dependencies, deployment
      topology, failure isolation, and recovery design.
    whyItMatters: >-
      The assigned infrastructure account is secondary and historical, so it cannot establish present architecture,
      resilience, or operational dependencies for a regulated trading workflow.
    diligencePath: >-
      Request current architecture and data-flow diagrams, deployment and failover design, dependency inventory, and
      service-level objectives from engineering and operations.
    relatedQuestionRefs:
      - QE003
  - type: missing-source
    severity: material
    topic: reliability-incident-evidence
    missingEvidence: >-
      A primary incident record or independent status history documenting cause, duration, affected users, recovery, and
      remediation for the reported June 2024 access disruption.
    whyItMatters: >-
      A reported inability to execute trades is material to platform reliability, while the available account does not
      quantify impact or explain recovery.
    diligencePath: >-
      Request incident reports, historical availability and execution-error metrics, disaster-recovery test results, and
      evidence of corrective actions.
  - type: missing-source
    severity: material
    topic: security-and-privacy-assurance
    missingEvidence: >-
      Current primary evidence for security and privacy controls, independent assessments or certifications, and scope
      of the reported network protections.
    whyItMatters: >-
      A secondary statement about WAF and DDoS services does not establish control effectiveness, privacy governance,
      regulatory assurance, or the security of customer workflows.
    diligencePath: >-
      Request current security and privacy control documentation, assessment or certification reports, incident
      disclosures, and the applicable scope of third-party protections.
  - type: private-evidence-only
    severity: material
    topic: developer-adoption
    missingEvidence: >-
      Independent evidence or anonymized usage data showing active Kite Connect developers, production integrations, API
      reliability, and support commitments.
    whyItMatters: >-
      A public API description and a company-operated forum category do not establish external developer adoption or the
      durability of an integration ecosystem.
    diligencePath: >-
      Request API usage and service-level metrics, versioning and support documentation, and references from independent
      production integrations.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: customer-durability
    missingEvidence: >-
      Period-defined retention, churn, renewal and cohort activity data, with active-account and revenue denominators,
      plus a top-customer or top-segment concentration schedule.
    whyItMatters: >-
      Aggregate account counts cannot establish durable monetizable usage or show whether trading revenue depends on a
      narrow customer segment.
    diligencePath: >-
      Request quarterly active-account cohorts, repeat-activity and revenue retention schedules, and customer-segment
      revenue concentration from company management.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Independently verifiable named customer references identifying use case, production-versus-pilot status and
      attributable outcome.
    whyItMatters: >-
      Product descriptions and aggregate user counts do not establish implementation depth, customer value or reference
      quality.
    diligencePath: >-
      Obtain permissioned customer references and deployment documentation, then corroborate outcomes with the named
      customer.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: operational-resilience
    missingEvidence: >-
      Current entity-level outage and cyber incident history, service availability and order-failure measures,
      independent control testing, remediation status, and recovery-test results.
    whyItMatters: >-
      A brokerage platform failure or security event could affect customer access, transactions, regulatory standing,
      and trust; likelihood and mitigation maturity cannot be estimated from the assigned sources.
    diligencePath: >-
      Request the latest 24-month incident and availability register, control attestations, open remediation items, and
      dated business-continuity and disaster-recovery test results from the responsible legal entities.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: partner-dependency
    missingEvidence: >-
      A legal-entity-to-service map for exchanges, banks, depositories, settlement, cloud, market-data, and other
      critical vendors, with concentration and exit measures.
    whyItMatters: >-
      The report cannot rank counterparty failure likelihood or assess substitutability and continuity without knowing
      which entities provide critical services.
    diligencePath: >-
      Obtain the current critical-vendor and counterparty register, exposure shares, contract termination rights, tested
      fallbacks, and accountable owners.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: regulatory-entity-scope
    missingEvidence: >-
      Current entity-level registrations, operative regulatory obligations, and any open litigation, enforcement, or
      material compliance findings.
    whyItMatters: >-
      The SEBI index gives sector-level monitoring context but does not establish which Zerodha entities are in scope or
      their current legal posture.
    diligencePath: >-
      Reconcile each operating entity to current regulator registers, applicable circulars and effective dates, court
      records, and counsel-reviewed matter status.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: minor
    topic: risk-monitoring
    missingEvidence: >-
      Management's approved risk appetite, downside scenarios, escalation limits, and trigger owners tied to revenue and
