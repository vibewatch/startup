    title: NSE active-client share and FY26 share change
    type: quadrant
    summary: Groww gained active-client share as Zerodha, Angel One, and Upstox lost share; ICICI Securities and SBI Securities also gained.
    data:
      xAxis: NSE active-client share, March 2026 (%)
      yAxis: Change in NSE active-client share, March 2025 to March 2026 (percentage points)
      points:
        - label: Groww
          x: 28.31
          y: 2.05
          note: March 2025 share 26.26%; March 2026 share 28.31%.
        - label: Zerodha
          x: 15.08
          y: -0.95
          note: March 2025 share 16.03%; March 2026 share 15.08%.
        - label: Angel One
          x: 14.79
          y: -0.61
          note: March 2025 share 15.40%; March 2026 share 14.79%.
        - label: Upstox
          x: 4.35
          y: -1.23
          note: March 2025 share 5.58%; March 2026 share 4.35%.
        - label: ICICI Securities
          x: 4.57
          y: 0.61
          note: March 2025 share 3.96%; March 2026 share 4.57%.
        - label: SBI Securities
          x: 2.55
          y: 0.56
          note: March 2025 share 1.99%; March 2026 share 2.55%.
    approximationNotes: >-
      Each y-coordinate is the arithmetic difference between the March 2026 and March 2025
      active-client-share percentages reported by CNBC-TV18. The axes are observed market
      share and derived percentage-point change, not a ranking or quality score.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
