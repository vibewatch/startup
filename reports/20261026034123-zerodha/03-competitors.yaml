chapter:
  number: 3
  title: Competitors
  summary: FY26 NSE active-client data shows Groww gaining share while Zerodha and several discount-broker peers lost share; bank-backed brokers ICICI Securities and SBI Securities gained. Public evidence in the assigned pool suggests pricing has become easier to match, but it does not establish comparative retention, product quality, or switching costs, and competitor pricing claims require primary-source verification.
sections:
  - id: market-shifts
    title: Share shifts reveal a more contested retail-broker market
    body: >-
      NSE active-client counts are a useful measure of monthly trading participation, not a
      proxy for assets under management, revenue, or customer retention. CNBC-TV18 reports
      that total active accounts declined 7% from March 2025 to March 2026, while Groww
      increased its share and Zerodha, Angel One, and Upstox lost share (CP001-CP004).
      ICICI Securities and SBI Securities gained share in the same period, suggesting the
      competitive set extends beyond app-first discount brokers (CP005). The Hindu BusinessLine
      reports that Groww added 5.7 lakh active clients in H1 2026 while Zerodha's active base
      slipped; that period-specific movement is consistent with pressure on incumbents but
      does not show which customers switched or why (CP006-CP007). The landscape table
      therefore distinguishes observed market-share evidence from unsupported product,
      funding, and customer-segment comparisons.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: product-and-pricing
    title: Product breadth and pricing are not yet a verified basis for ranking
    body: >-
      Groww's 2020 acquisition of Indiabulls Asset Management Company, subject to SEBI
      approval at announcement, is evidence of an earlier move to add mutual-fund
      manufacturing alongside distribution; it is not proof of present scale or successful
      integration (CP008). 5paisa's own pricing page currently presents zero account-opening
      and mutual-fund commission fees and flat ₹20 brokerage per order (CP009). Secondary
      comparison pages make additional claims about Zerodha, Groww, and Upstox, but their
      rates are not verified here against each broker's current official schedule, and
      TradingCritique and StockCalc report different Zerodha percentage caps (CP010-CP011).
      These pages are useful as leads, not as independent benchmarks. The capability and
      pricing tables preserve the source and status of each comparison rather than implying
      that list prices capture statutory charges, realized economics, or equivalent product
      scope.
    claimRefs:
      - CP008
      - CP009
      - CP010
      - CP011
    tableRefs:
      - TP002
      - TP003
  - id: durability-and-gaps
    title: Distribution and switching advantages remain hypotheses to test
    body: >-
      An upGrowth teardown argues that flat pricing was copied and that platform depth and
      reliability take longer to reproduce; this is the author's analysis, not comparative
      reliability data or measured switching behavior (CP012). A TechResearchOnline article
      attributes to Zerodha co-founder Nithin Kamath the view that the market is crowded and
      that a new entrant repeating the same model would struggle (CP013). Taken with the
      FY26 share movements, these are signals of competitive intensity, not proof of a
      durable moat. The assigned evidence does not compare active-user cohorts, customer
      acquisition costs, account portability, platform uptime, trust outcomes, or customer
      overlap. Those gaps prevent a defensible ordinal positioning score or conclusion that
      any one broker has stronger lock-in; obtain matched broker-level disclosures and
      customer references before underwriting durability.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP012
      - CP013
tables:
  - id: TP001
    title: "Competitor landscape: measured reach versus unresolved profile fields"
    columns:
      - Competitor or alternative
      - Evidence in assigned pool
      - What it indicates
      - Important unknowns
    rows:
      - - Groww
        - NSE active-client share increased from 26.26% to 28.31% in FY26; added 5.7 lakh active clients in H1 2026; acquired an asset manager in 2020.
        - Strongest observed current share-gain signal in this evidence set; historical mutual-fund expansion.
        - Current pricing, economics, retention, and product integration are not established here.
      - - Zerodha
        - NSE active-client share declined from 16.03% to 15.08% in FY26; active clients slipped from 68.6 lakh to 68 lakh in H1 2026.
        - Large incumbent under pressure on monthly active participation.
        - AUM, profitability by product, retention, customer segment, and relative platform reliability are not compared here.
      - - Angel One
        - NSE active-client share declined from 15.40% to 14.79% in FY26.
        - Close in active-client share to Zerodha in March 2026.
        - Current product, pricing, funding, and segment-level positioning are not established here.
      - - Upstox
        - NSE active-client share declined from 5.58% to 4.35% in FY26.
        - Lost share during a contracting active-client market.
        - Current official pricing and causes of share movement are unknown.
      - - ICICI Securities and SBI Securities
        - NSE active-client shares increased from 3.96% to 4.57% and from 1.99% to 2.55%, respectively, in FY26.
        - Bank-backed incumbents gained share while several discount brokers lost share.
        - The assigned evidence does not explain distribution, product mix, or acquisition costs.
      - - Status quo and internal build
        - No assigned source quantifies customers staying with existing brokers, using multiple brokers, or building internal alternatives.
        - A meaningful alternative category remains outside the observed competitor data.
        - Demand, scale, and switching behavior are unmeasured.
    notes: >-
      Selected competitor evidence, not an exhaustive census. NSE active-client share is
      monthly active participation, not AUM, revenue, registered accounts, or retention.
      FY26 changes compare March 2025 with March 2026 in the CNBC-TV18 report.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
  - id: TP002
    title: "Capability and buyer-criteria matrix: evidence limits"
    columns:
      - Buying criterion
      - Evidence-backed signal
      - Evidence status
      - Diligence implication
    rows:
      - - Active-client reach
        - Groww led the cited FY26 share gains; Zerodha and Angel One remained close in March 2026 share.
        - Observed NSE monthly active-client data.
        - Do not infer assets, revenue, customer quality, or retention from this metric.
      - - Mutual-fund adjacency
        - Groww announced an acquisition of Indiabulls AMC in 2020; 5paisa's official page lists direct mutual funds at zero commission.
        - Historical competitor expansion plus one current company pricing statement.
        - Verify current offerings, assets, integration, and realized economics.
      - - Pricing and packaging
        - 5paisa lists flat ₹20 per order; secondary sources make conflicting claims about Zerodha and other brokers.
        - One company-issued rate page; secondary claims remain unverified.
        - Compare official schedules, statutory levies, and equivalent order scenarios.
      - - Distribution and trust
        - The pool contains no matched evidence on onboarding conversion, channel mix, platform uptime, or comparative trust outcomes.
        - Unknown.
        - Obtain like-for-like customer and operational evidence.
      - - Switching and multi-homing
        - No source quantifies broker transfers, multiple-account use, or cohort retention.
        - Unknown.
        - Treat lock-in and displacement resistance as open diligence questions.
    notes: >-
      Unknown cells are evidence gaps, not negative findings. The Groww acquisition announcement
      was subject to regulatory approval at that time; no current status is inferred.
    claimRefs:
      - CP002
      - CP003
      - CP006
      - CP008
      - CP009
      - CP010
      - CP011
      - CP012
      - CP013
  - id: TP003
    title: "Pricing evidence: official schedule versus unverified secondary comparisons"
    columns:
      - Broker
      - Public price statement in assigned source
      - Source and status
      - Comparison limitation
    rows:
      - - Zerodha
        - StockCalc lists zero delivery brokerage and ₹20 or 0.03% for intraday; TradingCritique says ₹20 or 0.01% for other trades.
        - Two third-party pages; conflicting percentage caps, neither checked against a current official schedule here.
        - Do not use as a definitive current rate or assume identical charge components.
      - - Groww
        - StockCalc lists ₹20 or 0.05% for equity delivery and intraday.
        - Third-party comparison only; no official Groww schedule in the assigned pool.
        - Rate, conditions, and period require verification.
      - - Upstox
        - StockCalc lists ₹20 or 2.5% for equity delivery and ₹20 or 0.05% for intraday.
        - Third-party comparison only; unusual reported delivery percentage is unverified.
        - Treat as a data-quality flag, not an actual price benchmark.
      - - 5paisa
        - Its pricing page states zero account-opening fees, zero mutual-fund commission, and flat ₹20 brokerage per order.
        - Company-issued pricing statement; access date 2026-10-26.
        - Statutory and exchange levies remain separate; no matched transaction example is provided.
    notes: >-
      Rates are reproduced as attributed claims, not normalized benchmarks. Verify each
      broker's current official pricing, applicable conditions, statutory levies, and the
      same order size and product before drawing a buyer-cost conclusion.
    claimRefs:
      - CP009
      - CP010
      - CP011
figures:
