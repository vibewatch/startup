  evidenceGaps:
    - type: missing-source
      severity: material
      topic: broker-retention-and-switching
      missingEvidence: Comparable active-user retention cohorts, broker-to-broker transfers, customer overlap, and switching-cost evidence for Zerodha and its principal alternatives.
      whyItMatters: Active-client share changes do not establish retention, customer quality, or a durable distribution advantage.
      diligencePath: Request matched monthly active and funded-account cohorts, transfer data, and customer research from Zerodha and the major competing brokers.
      relatedQuestionRefs:
        - QP008
    - type: conflicting-data
      severity: material
      topic: broker-pricing
      missingEvidence: Current official rate cards for Zerodha, Groww, and Upstox, including applicable order-value thresholds and all statutory charges.
