company:
  name: "BuildOps"
chapter:
  number: 4
  title: "Financials"
  summary: "BuildOps discloses rapid growth and customer operating outcomes, but the public record does not expose the vendor economics needed for underwriting. Custom pricing, a reported $220 million of funding raised, and customer workflow gains support commercial momentum; ARR, recognized revenue, gross margin, retention, cash, burn, runway, debt, CAC, and sales payback remain material gaps."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model and pricing evidence"
    body: "BuildOps sells an integrated operating platform spanning service, projects, and financial workflows, but the reviewed evidence does not establish a complete accounting revenue model. Its own pricing guide says BuildOps quotes each customer based on company size, users, and needed features. That supports a scope-based enterprise sale, not a public price card, and it does not reveal contract duration, billing cadence, discounts, implementation charges, or revenue-recognition policy. The same guide places construction software broadly in a $30 to $350-plus monthly per-user range, but that is an industry reference published by BuildOps, not BuildOps list or realized pricing. Projects and embedded AI may create expansion paths, yet no source isolates their revenue contribution or confirms separate monetization."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "traction-and-sales-efficiency"
    title: "Traction and sales-efficiency proxies"
    body: "Public traction is strong but mostly expressed through company-issued growth claims and customer operating outcomes rather than vendor financial statements. BuildOps says it serves more than 1,500 commercial contractors and reports 1,012% three-year revenue growth in a paid 2026 release. Its homepage reports 76% more revenue per technician, while a YesPress account of a 54-customer benchmark says 72% reported revenue growth, 76% better margins, and 75% faster invoicing after implementation. These are different metrics with different denominators: none is BuildOps ARR, recognized revenue, gross margin, or net retention. YesPress also describes roughly three months of implementation and cites G2 data for a nine-month average customer ROI, useful as adoption and value-realization proxies but not as BuildOps CAC payback or sales-cycle evidence."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI003"
  - id: "cost-and-margin-path"
    title: "Cost structure and margin path"
    body: "The source set indicates meaningful labor and implementation intensity without quantifying BuildOps cost of revenue. Two Built In company profiles list equity and performance bonuses, and a company-authored staff-engineer posting advertises a $160,000 to $200,000 base salary plus an annual bonus. One vacancy cannot establish average engineering compensation or total R&D expense, but it shows the cash and equity cost of senior technical capacity. On delivery, the reported implementation period and customer-review friction around learning, updates, mobile data, customization, and accounting synchronization imply onboarding and support demands. No public source separates hosting, implementation, support, or AI-inference expense, so neither gross margin nor the path from customer efficiency to BuildOps margin can be calculated."
    claimRefs:
      - "CI004"
      - "CI011"
      - "CI015"
      - "CI016"
  - id: "capital-adequacy-and-verdict"
    title: "Capital adequacy and financial verdict"
    body: "FundedIQ records $220 million raised across three rounds, including a $127 million Series C announced in March 2025. That is financing history, not cash on hand: it does not show how much remains, the burn rate, runway, debt, project-finance obligations, or the trigger for another round. Across the assigned public sources, there is also no disclosed ARR, recognized revenue, gross margin, net revenue retention, churn, CAC, sales payback, or customer concentration. The financial verdict is therefore conditional. BuildOps has credible demand and workflow-value signals, but revenue quality, capital efficiency, and margin durability are not underwriteable from public evidence. Investment diligence should treat the operating benchmarks as hypotheses to reconcile against audited financials, billing records, cohort retention, pipeline conversion, and a current capitalization and liquidity schedule."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
callouts:
  - calloutType: "risk"
    title: "Customer outcomes are not vendor unit economics"
    body: "Revenue per technician, customer revenue growth, better customer margins, and faster customer invoicing describe buyer outcomes. They do not establish BuildOps ARR, GAAP revenue, gross margin, retention, cash generation, or CAC payback."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI014"
  - calloutType: "recommendation"
    title: "Gate valuation work on private financial evidence"
    body: "Require audited revenue and gross-margin schedules, ARR and cohort retention bridges, customer concentration, CAC and sales-payback analysis, and a current cash, burn, runway, debt, and financing plan before assigning a defensible financial value."
    claimRefs:
      - "CI013"
      - "CI014"
