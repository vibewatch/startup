callouts:
  - calloutType: "insight"
    title: "Architectural Moat: The Continuous Equipment Asset Record"
    body: "The core technical moat of BuildOps lies in maintaining continuous asset identity across the trade lifecycle. Residential FSM software treats service visits as ephemeral transactions, while general contractor software tracks overall project milestones. By modeling industrial chillers, boilers, and electrical panels as persistent stateful assets from construction installation through decades of preventive maintenance, BuildOps creates high back-office switching costs and generates proprietary training data for OpsAI automation."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE010"
  - calloutType: "risk"
    title: "Integration Seam Fragility Across Legacy Accounting Protocols"
    body: "BuildOps positions real-time ERP synchronization as a critical sales driver, yet the technical seam between modern cloud microservices and legacy on-premise accounting software (such as Sage 300 CRE or older Viewpoint editions) represents a persistent point of failure. Verified customer reviews and technical job disclosures highlight that accounting reconciliation errors and sync delays require dedicated customer administrative overhead, making integration stability a top post-sale technical risk."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE012"
