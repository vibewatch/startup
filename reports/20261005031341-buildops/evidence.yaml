evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosures
    missingEvidence: Audited GAAP annual recurring revenue (ARR), gross margins, net revenue retention (NRR), and cash burn figures.
    whyItMatters: >-
      Without audited ARR and margin data, BuildOps' $1B unicorn valuation multiple and underlying unit economics cannot
      be independently validated.
    diligencePath: >-
      Review confidential information memorandum (CIM), audited GAAP financials, or management financial presentations
      under NDA.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: >-
      Independent, vendor-unbiased win/loss records and head-to-head churn metrics between BuildOps, ServiceTitan, and
      ServiceTrade in commercial mechanical contracting.
    whyItMatters: >-
      Without verified win/loss and displacement data, retention durability against ServiceTitan's upmarket push and
      ServiceTrade's customer portal advantage cannot be quantified.
    diligencePath: >-
      Request customer reference audits, cross-trade win/loss CRM logs, and formal exit interviews during customer due
      diligence.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited recognized revenue, ARR movements, contract duration, billing cadence, revenue mix, deferred revenue, and
      revenue-recognition policy.
    whyItMatters: >-
      Customer outcomes and a growth rate without a denominator cannot establish recurring revenue quality or accounting
      performance.
    diligencePath: >-
      Obtain audited financial statements, monthly revenue schedules, contracts, invoices, and an ARR bridge reconciled
      to GAAP revenue.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, hosting and AI costs, implementation and support costs, NRR, logo churn, CAC, sales cycle, and sales
      payback by cohort.
    whyItMatters: >-
      These inputs determine whether rapid growth compounds economically or depends on expensive acquisition and service
      delivery.
    diligencePath: >-
      Review cohort retention, COGS allocations, implementation labor, pipeline conversion, commissions, and fully
      loaded CAC and payback.
    relatedQuestionRefs:
      - QI003
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash and restricted cash, monthly burn, runway, debt and covenant schedule, planned uses of funds, and
      next-round trigger.
    whyItMatters: Funding raised is a historical financing flow and cannot establish current liquidity or financing dependency.
    diligencePath: >-
      Obtain the latest balance sheet, monthly cash-flow forecast, debt documents, board-approved operating plan, and
      financing scenarios.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current price book, representative contracts, realized ACV, discounts, module attach rates, services fees,
      renewals, and customer concentration.
    whyItMatters: >-
      Custom quoting prevents public assessment of price realization, expansion revenue, concentration, and discount
      pressure.
    diligencePath: >-
      Sample signed contracts and invoices by cohort and reconcile list price, discount, billed amount, modules, seats,
      renewal, and expansion.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: developer-ecosystem-gap
    missingEvidence: Public developer portal, SDKs, open API specification, or practitioner community forums for BuildOps.
    whyItMatters: >-
      Without public API documentation or an open developer platform, contractors and system integrators must rely
      entirely on proprietary internal BuildOps connectors for custom ERP integrations, raising platform lock-in and
      implementation fragility.
    diligencePath: >-
      Request BuildOps API documentation, rate limit specifications, and partner SDK access directly from the product
      team during technical diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion
    missingEvidence: >-
      Audited net revenue retention (NRR), gross retention rates, and annual logo churn rates for BuildOps across
      commercial trade cohorts.
    whyItMatters: >-
      Without verifiable retention and cohort expansion data, long-term customer lifetime value and expansion dynamics
      inside the 1,500-customer base cannot be modeled.
    diligencePath: >-
      Request audited revenue retention schedules, cohort waterfall analyses, and historical annual contract renewal
      rates under confidentiality.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: minor
    topic: named-customer-enumeration
    missingEvidence: >-
      Comprehensive roster of enterprise commercial contractor customers and contract ACV distribution across
      mechanical, electrical, and plumbing trades.
    whyItMatters: >-
      Customer proof is limited to vendor-curated benchmarks and select case studies, leaving trade-level concentration
      and customer scale distribution opaque.
    diligencePath: >-
      Obtain an anonymized customer ARR tier distribution and reference customer contact list spanning different
      specialty trade verticals.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-and-incident-history
    missingEvidence: >-
      Primary court, regulator, security-incident, certification, and status-page evidence sufficient to establish
      BuildOps' current legal and incident history.
    whyItMatters: >-
      The absence of a retained adverse result does not establish the absence of litigation, enforcement, breaches,
      outages, or material customer claims.
    diligencePath: >-
      Obtain litigation and compliance schedules, current security reports, penetration-test summaries, status history,
      and regulator searches.
    relatedQuestionRefs:
      - QR002
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: uptime-support-and-integration
    missingEvidence: >-
      Contracted uptime, severity response times, historical SLA attainment, incident frequency, connector error rates,
      and reconciliation workload.
    whyItMatters: >-
      These measures determine whether operational dependency produces tolerable customer risk or recurring interruption
      and finance-team rework.
    diligencePath: >-
      Review executed SLA and support schedules, twelve months of incident data, and references using the same ERP
      connectors and field conditions.
    relatedQuestionRefs:
      - QR003
      - QR009
    relatedTableRefs:
      - TR002
      - TR003
  - type: conflicting-data
    severity: material
    topic: capital-and-execution-capacity
    missingEvidence: >-
      Reconciled funding history, fully diluted cap table, cash, debt, burn, runway, payroll headcount, attrition, and
      support or implementation staffing.
    whyItMatters: >-
      Public funding and workforce records conflict, and neither funding raised nor a third-party employee estimate
      establishes available cash or delivery capacity.
    diligencePath: >-
      Reconcile bank statements, financing documents, audited financials, payroll, organization charts, hiring plans,
      and board-approved operating forecasts.
    relatedQuestionRefs:
      - QR004
      - QR005
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: customer-durability-and-concentration
    missingEvidence: >-
      Gross and net retention, logo churn, cohort expansion, top-customer concentration, production deployment counts,
      and benchmark methodology.
    whyItMatters: >-
      A customer-count claim cannot establish durable adoption, expansion quality, concentration resilience, or the
      repeatability of reported outcomes.
    diligencePath: >-
      Obtain contract-level cohort exports, customer concentration schedules, benchmark respondent selection, and
      references across trade and account size.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited GAAP gross margin, net revenue retention (NRR), and logo retention by cohort.
    whyItMatters: Without retention and margin metrics, the durability of the 19.2x revenue multiple cannot be verified.
    diligencePath: Request confidential historical cohort retention tables and gross margin breakdowns from management.
    relatedQuestionRefs:
      - QV009
  - type: private-evidence-only
    severity: material
    topic: cash-burn
    missingEvidence: Current cash burn rate, EBITDA loss profile, and remaining runway from the $127M Series C.
    whyItMatters: BuildOps remains unprofitable, and burn rate dictates whether additional dilutive financing will be required.
    diligencePath: Review monthly cash flow statements and audited management forecasts.
    relatedQuestionRefs:
      - QV009
