chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Commercial Trade Focus, and Leadership Evolution
        blocks:
          - type: paragraph
            body: >-
              BuildOps was founded in 2018 in Los Angeles by Alok Chanani, Steve Chew, and Neeraj Mittal to address
              operational fragmentation in commercial specialty trades including HVAC, electrical, plumbing, mechanical,
              and fire safety. Unlike residential field service software designed around high-frequency dispatching and
              ticket-based home service, BuildOps architected an all-in-one software platform tailored to complex
              commercial workflows, multi-month job management, submittals, and field-to-office financial control.


              Executive leadership is led by Co-Founder and Chief Executive Officer Alok Chanani, a former U.S. Army
              Captain and transportation unit commander in Iraq who previously established USA Commercial in real
              estate. Co-Founder Steve Chew serves as Chief Operating Officer, drawing on technical and operational
              product leadership across Microsoft, Nextag, and Fundly. Co-founder Neeraj Mittal, who previously served
              as director of engineering at ServiceTitan, departed the company prior to the Series C round, creating a
              notable leadership transition in technical governance. Following the $127M Series C financing, Paul
              Madera, general partner and co-founder of Meritech Capital, joined BuildOps' board of directors to provide
              institutional oversight.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: Financing History, Unicorn Valuation, and Operational Scale
        blocks:
          - type: paragraph
            body: >-
              BuildOps' capitalization progression reflects accelerated institutional backing within the industrial SaaS
              sector. In May 2022, the company announced a $43M Series A round led by Next47, a venture firm backed by
              Siemens, with participation from Founders Fund, StepStone Group, Fika Ventures, Global Founders Capital,
              and MetaProp VC. The company subsequently completed a $50M Series B in May 2023 along with a $36M internal
              top-up raise from existing insiders, before securing a $127M Series C in March 2025 led by Meritech
              Capital with new investors Bond Capital and SE Ventures, bringing cumulative funding to over $250M at a
              $1.0B post-money valuation.


              Operational metrics indicate rapid enterprise adoption across North America. The company expanded its
              customer base from over 1,000 commercial contractors in early 2025 to more than 1,500 contractors by late
              2026, serving enterprise trade operators such as J.H. Kelly, Haynes Mechanical, Dynamic Systems, and Baker
              Electric. Internal workforce headcount reached approximately 375 employees following a 50% year-over-year
              expansion. However, BuildOps operates on an annual per-user SaaS subscription model and remains not yet
              profitable, with executive management declining to publicly disclose audited GAAP revenue, ARR, gross
              margins, or cash burn.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
