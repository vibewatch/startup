  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Commercial Workflow Architecture
        blocks:
          - type: paragraph
            body: >-
              BuildOps defines its product footprint around the operational lifecycle of commercial specialty trade
              contractors, specifically serving mechanical, electrical, plumbing, HVAC, refrigeration, and fire and life
              safety enterprises. In contrast to residential field service software retrofitted for light commercial
              use, commercial contracting involves multi-asset industrial facilities, multi-month construction
              timelines, complex labor union compliance, and decentralized project accounting. The BuildOps platform
              operates as an end-to-end commercial operating system spanning two primary operating modules: Service and
              Projects. The Service module orchestrates call intake, automated dispatch, preventative maintenance
              agreements, work order execution, and mobile closeout. The Projects module manages construction-grade
              workflows including requests for information (RFIs), submittals, drawing document control, change orders,
              procurement, and real-time job costing. By unifying these traditionally siloed applications into a single
              cloud environment, the software replaces an average of 2.6 point solutions per contractor and maintains
              continuous asset history from initial capital project installation through multi-year service maintenance.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
