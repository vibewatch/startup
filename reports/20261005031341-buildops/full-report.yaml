  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary Definition and Operating Scope
        blocks:
          - type: paragraph
            body: >-
              The commercial specialty contracting technology market occupies an operationally demanding boundary
              between residential home services software and general contractor project management platforms. Commercial
              specialty contractors—principally mechanical, electrical, plumbing (MEP), and fire and life safety
              subcontractors—manage multi-site commercial assets, preventive maintenance service level agreements,
              complex work order closeouts, and progress billing. Generic residential field service management tools are
              architecturally ill-equipped for this operational reality because they emphasize rapid single-truck
              residential dispatch, consumer financing, and high-velocity lead intake rather than equipment service
              histories, complex multi-phase commercial job costing, and AIA progress billing workflows. Conversely,
              general contractor software platforms such as Procore focus primarily on the owner and general contractor
              perspective across an entire build site, lacking the granular labor-hour capture, technician routing,
              parts dispatch, and deep equipment maintenance logs required by the self-performing specialty trades that
              carry direct field labor and materials risk. BuildOps explicitly scopes its commercial boundaries around
              mechanical, electrical, plumbing, HVAC, and fire/life safety trade businesses, intentionally excluding
              lightweight residential-only workflows. As third-party buyer guides observe, BuildOps fits commercial-only
              operations where the workflow centers on recurring service agreements, multi-location commercial dispatch,
              complex asset tracking, and multi-trade bid management. While residential contractors prioritize flat-rate
              consumer books and self-serve web scheduling, commercial MEP subcontractors require enterprise grade
              workflows that directly integrate field technician time tracking and material requisitions with
              back-office construction accounting packages like Sage 300 CRE, Sage Intacct, and Viewpoint.
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
      - number: '2.2'
        title: 'Market Sizing Lenses: Global Estimates vs. Evidence-Constrained TAM'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for commercial specialty contractor software requires navigating
              multiple conflicting sizing methodologies, ranging from top-down macroeconomic forecasts to bottom-up
              account-based constraints. Third-party analyst reports estimate the broad global field service management
              (FSM) software market at approximately $6.1 billion in 2026, expanding at an estimated compound annual
              growth rate (CAGR) of 10.7% through 2034. In parallel, top-down market research across AI in the
              construction industry projects a global market sizing of $2,179.91 million in 2026, growing to $24,696.92
              million by 2035 at an estimated CAGR of 31.27%, with commercial projects representing an estimated 34.05%
              share of sector spending. However, diligence must rigorously separate these broad macroeconomic
              aggregations from the realistic serviceable addressable market (SAM) accessible to a specialized platform.
              BuildOps does not address the entire construction ecosystem or the broad mass of residential
              sole-proprietor contractors; instead, company leadership and third-party industry analyses define its core
              ideal customer profile (ICP) as commercial MEP subcontractors generating between $5M and $100M in annual
              revenue with fleets of 20 or more technicians. Within this bounded perimeter, software spend is governed
              not by macroeconomic construction output, but by software seat license subscriptions, module expansion
              into project management, and customer back-office integration fees. Because comprehensive North American
              specialty subcontractor census data with precise annual revenue tiering is not published by public
              statistical agencies, top-down TAM aggregations remain unvalidated proxies, requiring investors to rely on
              unit-economics constrained bottom-up sizing models.
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM010
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
