      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              FundedIQ records $220 million raised across three rounds, including a $127 million Series C announced in
              March 2025. That is financing history, not cash on hand: it does not show how much remains, the burn rate,
              runway, debt, project-finance obligations, or the trigger for another round. Across the assigned public
              sources, there is also no disclosed ARR, recognized revenue, gross margin, net revenue retention, churn,
              CAC, sales payback, or customer concentration. The financial verdict is therefore conditional. BuildOps
              has credible demand and workflow-value signals, but revenue quality, capital efficiency, and margin
              durability are not underwriteable from public evidence. Investment diligence should treat the operating
              benchmarks as hypotheses to reconcile against audited financials, billing records, cohort retention,
              pipeline conversion, and a current capitalization and liquidity schedule.
