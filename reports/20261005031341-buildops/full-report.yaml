      - number: '7.2'
        title: Legal, Regulatory, and Data Boundaries
        blocks:
          - type: paragraph
            body: >-
              BuildOps' published terms place several compliance boundaries on customers. Customers are responsible for
              account use, credential confidentiality, the content and accuracy of customer data, and the rights and
              consents needed to process that data [CR002]. The service is not intended to satisfy HIPAA obligations,
              BuildOps is not a HIPAA Business Associate, and prohibited data and high-risk uses sit outside the
              intended scope [CR001]. For AI features, BuildOps may use customer input and output to train its local
              models unless a customer opts out, while generated output is not warranted to be accurate, complete,
              current, or non-infringing [CR003, CR004]. No assigned source establishes the presence or absence of
              litigation, enforcement, certifications, or security incidents; those matters therefore remain open
              diligence rather than a clean-history conclusion.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
