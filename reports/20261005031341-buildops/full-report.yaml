      - number: '4.3'
        title: Cost structure and margin path
        blocks:
          - type: paragraph
            body: >-
              The source set indicates meaningful labor and implementation intensity without quantifying BuildOps cost
              of revenue. Two Built In company profiles list equity and performance bonuses, and a company-authored
              staff-engineer posting advertises a $160,000 to $200,000 base salary plus an annual bonus. One vacancy
              cannot establish average engineering compensation or total R&D expense, but it shows the cash and equity
              cost of senior technical capacity. On delivery, the reported implementation period and customer-review
              friction around learning, updates, mobile data, customization, and accounting synchronization imply
              onboarding and support demands. No public source separates hosting, implementation, support, or
              AI-inference expense, so neither gross margin nor the path from customer efficiency to BuildOps margin can
              be calculated.
            claimRefs:
