      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Drivers
        blocks:
          - type: paragraph
            body: >-
              Adoption of commercial specialty contracting platforms is dictated by an operational committee spanning
              executive leadership, field service dispatchers, accounting controllers, and field service technicians.
              The primary economic buyer is typically the commercial contractor owner, chief executive, or chief
              operating officer, whose primary business trigger is eliminating margin fade, accelerating billing cycles,
              and scaling contract volume without linearly increasing back-office overhead headcount. The chief
              financial officer or back-office controller acts as the gatekeeper of budget release and enterprise
              systems integrity, requiring seamless two-way synchronization between field service operations and core
              enterprise resource planning (ERP) packages. Service dispatchers and field service managers represent
              daily operational users who evaluate software based on dispatch board speed, technician skill matching,
              and asset maintenance history visibility. Field technicians represent the foundational data collection
              user group; platform adoption fails if field mobile workflows create administrative friction on the job
              site. Commercial specialty software adoption is heavily propelled by chronic skilled labor shortages, with
              national construction trade gaps approaching roughly 499,000 workers, forcing contractors to extract
              higher administrative leverage and technician productivity from existing crews. Conversely, adoption is
              constrained by multi-month implementation runways (typically 8 to 12 weeks), custom quoting structures
              ranging from $150 to $400+ per user per month, and the significant switching friction inherent in
              migrating deeply embedded legacy accounting integrations.
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Market Boundary Separation Protects Commercial Vertical Focus
            body: >-
              BuildOps maintains a disciplined market boundary by refusing to dilute its product architecture for the
              high-volume residential home services sector. By focusing exclusively on commercial specialty trade
              subcontractors running $5M to $100M operations, the company aligns its data model directly with complex
              commercial asset maintenance histories, AIA progress billing, and enterprise construction ERP
              integrations.
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
          - type: callout
            title: Contractor Implementation Complexity and TCO Inelasticity
            body: >-
              Custom quote-driven subscription pricing starting around $150 to $400+ per user per month, coupled with an
              8 to 12 week onboarding runway and multi-year contract commitments, creates an adoption ceiling. Smaller
              subcontractors running under 15 technicians are effectively priced out of the platform, leaving the lower
              90% of the field service contractor market to lower-cost competitors like QuoteIQ and Jobber.
            calloutType: risk
            claimRefs:
              - CM001
              - CM002
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Commercial Contracting Software Landscape and Competitor Segmentation
        blocks:
          - type: paragraph
            body: >-
              Commercial specialty contractors historically operated in an operational vacuum, coordinating high-value
              mechanical, electrical, and plumbing projects through fragmented spreadsheets, messaging applications, and
              disconnected on-premise accounting tools. The competitive arena has bifurcated between residential-origin
              field service platforms and enterprise general contractor suites. Market leader ServiceTitan validated
              trade software demand with a December 2024 initial public offering valued near nine billion dollars and
              over eleven thousand active customer businesses, yet its product architecture reflects its residential
              heritage. Meanwhile, Procore commands the general construction tier but lacks native service dispatch and
              ongoing maintenance agreements. BuildOps occupies the specialized middle, delivering purpose-built
              workflows for multi-trade commercial subcontractors.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
