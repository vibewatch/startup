      - number: '5.2'
        title: Technology Stack, Distributed Microservices, and Integration Platform
        blocks:
          - type: paragraph
            body: >-
              The core technical architecture of BuildOps is engineered for data integrity, multi-trade workflow
              coordination, and bidirectional back-office enterprise resource planning (ERP) synchronization. The web
              application frontend is constructed with React.js, TypeScript, and a customized Material-UI design system
              to deliver high-density operational dispatching and project management interfaces. The backend application
              layer comprises Node.js microservices exposing GraphQL APIs alongside RESTful endpoints for third-party
              service interoperability. Transactional persistence is anchored on relational SQL databases, primarily
              PostgreSQL and MySQL, designed to enforce strict schema consistency across complex multi-trade job cost
              codes, labor tracking, and tax jurisdictions. For resilient long-running distributed workflows—such as
              asynchronous multi-stage ERP synchronization, procurement approvals, and multi-day work order
              closeouts—BuildOps utilizes Temporal workflow orchestration. Cloud infrastructure is containerized using
              Docker and orchestrated via Kubernetes deployed across Amazon Web Services (AWS) and Google Cloud Platform
              (GCP). The Integration Platform maintains bidirectional connectors to tier-one construction and mid-market
              ERPs including Sage Intacct, NetSuite, QuickBooks, and Viewpoint.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
