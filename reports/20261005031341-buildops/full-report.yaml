  - id: TV001
    title: Recommendation Summary
    columns:
      - Metric / Dimension
      - Stance / Rating
      - Core Driver
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - Stretched valuation multiple alongside undisclosed retention and burn metrics
        - Monitor cohort retention and gross margin metrics before capital commitment
      - - Confidence
        - Medium
        - Strong external corroboration on funding and growth, but opaque unit economics
        - Require primary management disclosure on unit economics in full diligence
      - - Risk Rating
        - High
        - Multiple compression risk, unproven profitability, and ERP integration friction
        - Structure downside protections and anti-dilution provisions on secondary entry
      - - Valuation Stance
        - Stretched
        - 19.2x revenue multiple at Series C exceeds peer median valuation multiples
        - Seek entry discount or wait for operational scale to grow into $1B valuation
    notes: Recommendation and risk ratings synthesized from Series C pricing and commercial traction data.
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV008
  - id: TV002
    title: Investment Thesis and Anti-Thesis Framework
    columns:
      - Thesis Dimension
      - Core Argument
      - Counter-Argument / Anti-Thesis
      - Pivot Trigger / Diligence Test
    rows:
      - - Market Opportunity
        - Massive commercial specialty trade TAM historically neglected by residential tools
        - Niche market ceiling if general contractor software suites subsume subcontractors
        - Disclosed attach rate of Projects module among specialty trade customers
      - - Product Defensibility
        - Deep multi-handoff workflows and accounting synchronization create high switching costs
        - Adoption friction, ERP synchronization bugs, and 3-month setup delay time-to-value
        - Net revenue retention and logo churn benchmarks across 12-month customer cohorts
      - - Growth & Scale
        - 1,012% three-year revenue growth and rapid customer expansion to over 1,500 contractors
        - High cash burn from aggressive sales and R&D expansion while still unprofitable
        - Cash runway verification and capital efficiency metrics from Series C proceeds
      - - Valuation & Multiple
        - Category leader premium justified by vertical monopoly potential in commercial FSM
        - 19.2x revenue multiple leaves no margin of safety if ARR growth decelerates
        - Comparative multiple normalization against public vertical software comps
    notes: Thesis framework derived from customer benchmarks, growth rankings, and Series C transaction terms.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV010
  - id: TV003
    title: Bull, Base, and Bear Scenario Projections
    columns:
      - Scenario
      - Key Operating Assumptions
      - Implied ARR & Multiple
      - Estimated Valuation
      - Downside Triggers & Diligence Path
    rows:
      - - Bull Case
        - Projects module attach reaches 40%, OpsAI monetization expands, ARR exceeds $150M
        - 12x ARR multiple supported by 60%+ organic growth
        - $1.8B+
        - Execution failure in Projects module; inspect enterprise contract expansion
      - - Base Case
        - Service core maintains 35-45% ARR growth; Projects adoption follows typical vertical SaaS curve
        - 8.5x ARR multiple reflecting public peer normalization
        - $1.1B - $1.2B
        - Growth deceleration below 30%; verify gross margin stability above 70%
      - - Bear Case
        - ERP integration friction stalls enterprise deployments; customer churn rises above 15%
        - 5.0x ARR multiple on down-round or structured rescue round
        - $600M - $700M
        - Secondary price collapse; monitor Forge market liquidity and employee retention
    notes: Valuation projections based on $1B Series C base and normalized SaaS multiple ranges.
    claimRefs:
      - CV001
      - CV002
      - CV008
      - CV011
      - CV012
figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Chronological development of BuildOps from founding and Series A/B rounds to $1B unicorn Series C, Projects
      rollout, and Finance Hub launch.
    data:
      items:
        - label: Company Formation
          date: '2018-09-01'
          detail: >-
            BuildOps founded in Los Angeles by Alok Chanani, Steve Chew, and Neeraj Mittal to build purpose-built
            commercial contractor software.
          tone: positive
        - label: Commercial Platform Launch
          date: '2020-05-01'
          detail: >-
            Commercial platform officially launched, surpassing seven-figure annual revenue within its first operational
            year.
          tone: positive
        - label: Series A Financing ($43M)
          date: '2022-05-24'
          detail: >-
            Raised $43M Series A led by Next47 (backed by Siemens) with participation from Founders Fund, Fika, and
            StepStone Group.
          tone: positive
        - label: Series B Financing & Top-Up ($86M Total)
          date: '2023-05-15'
          detail: >-
            Announced $50M Series B financing followed by an internal $36M top-up round from existing institutional
            investors.
          tone: positive
        - label: Co-Founder Mittal Departure
          date: '2024-10-01'
          detail: >-
            Co-founder and former CTO Neeraj Mittal departs BuildOps, concluding executive tenure after foundational
            engineering buildup.
          tone: warning
        - label: Series C Unicorn Round ($127M)
          date: '2025-03-21'
          detail: >-
            Raised $127M Series C led by Meritech Capital at $1.0B post-money valuation; Paul Madera joins board of
            directors.
          tone: positive
        - label: Projects Module Launch
          date: '2026-05-07'
          detail: >-
            Launched Projects with embedded OpsAI to unify multi-month construction project management with field
