      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial-Only Focus as a Competitive Moat
            body: >-
              Unlike residential field service systems such as ServiceTitan that retrofitted light commercial workflows
              onto residential technician dispatch, BuildOps was architected strictly for commercial specialty trades.
              This vertical specificity accommodates AIA progress billing, prevailing wage compliance, multi-craft union
              dispatch, and complex retainage management, insulating the company from residential software competitors.
            calloutType: insight
            claimRefs:
              - CO001
              - CO006
              - CO007
          - type: callout
            title: Governance and Technical Succession Post-CTO Departure
            body: >-
              Co-founder Neeraj Mittal's departure prior to the March 2025 Series C represents a material organizational
              transition. Given Mittal's prior tenure as Director of Engineering at ServiceTitan, his exit leaves
              BuildOps' long-term engineering roadmap and enterprise architecture succession dependent on hired
              executive engineering leadership during a period of rapid product expansion.
            calloutType: risk
            claimRefs:
