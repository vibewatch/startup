  - id: FU001
    title: Commercial Contractor Adoption and Expansion Journey
    type: journey-map
    summary: >-
      Visualizing the progressive stages of commercial contractor onboarding, mobile adoption, multi-module expansion,
      and back-office financial integration.
    data:
      items:
        - label: 1. Initial Onboarding & ERP Integration
          description: >-
            8-12 week structured implementation mapping complex charts of accounts, job cost codes, and historical
            customer asset records into accounting software.
          touchpoints:
            - ERP connector configuration (Sage Intacct, NetSuite, Vista)
            - Historical customer & asset data cleansing
            - Office staff & dispatcher workflow training
        - label: 2. Core Field & Service Rollout
          description: >-
            Field technician mobile onboarding for automated dispatch, skill-based scheduling, and digital work order
            closeouts.
          touchpoints:
            - Technician mobile app activation
            - AI-driven skill & proximity dispatch
            - Digital timecards & on-site photo capture
        - label: 3. OpsAI Embedded Workflow Utilization
          description: >-
            Field crews adopt embedded AI capabilities to automate tedious documentation and identify follow-up
            maintenance opportunities.
          touchpoints:
            - Optical equipment nameplate scanning (100k+ monthly)
            - Smart field recap drafting & voice dictation
            - Automated deficiency quote generation
        - label: 4. Multi-Module Expansion (Projects & Finance)
          description: >-
            Account expansion into multi-month construction project tracking, submittals, RFIs, and pre-posting
            accounting controls.
          touchpoints:
            - Projects module activation for commercial builds
            - Finance Hub pre-posting ledger governance
            - Annual recurring maintenance agreement tracking
        - label: 5. Long-Term Durability & Vendor Locking
          description: >-
            Platform becomes the unified operational system of record, driving high customer switching costs balanced
            against renewal pricing pressures.
          touchpoints:
            - Executive Business Reviews with Named CSMs
            - Customer Advisory Board & advocacy participation
            - Multi-year enterprise contract renewals
        - label: 6. Advocate Activation & Community Feedback
          description: >-
            Satisfied contractor leadership participates in reference programs, user conferences, and product roadmap
            advisory panels.
          touchpoints:
            - Customer reference calls for prospective buyers
            - Forge user conference presentations
            - Customer Advisory Board roadmap prioritization
    approximationNotes: >-
      Lifecycle stages reflect typical 8-12 week commercial onboarding, field deployment, and subsequent module
      expansion sequences documented in customer success job descriptions and case histories.
    claimRefs:
