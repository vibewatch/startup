              - CU005
              - CU006
              - CU012
      - number: '6.3'
        title: Named Customer Proof and Operational Outcomes
        blocks:
          - type: paragraph
            body: >
              In its 2026 customer benchmark survey of 54 commercial trade contractors, BuildOps reported that 72% of
              respondents achieved revenue expansion following deployment, 76% realized higher gross margins, 75%
              expedited invoicing, and 80% expanded operational job volume without increasing administrative office
              headcount. Deployments demonstrate measurable operational turnaround: Layer One transitioned its
              work-in-progress job costing from a two-week lag to daily real-time visibility; another contractor
              compressed average accounts receivable aging from 120 days down to 30 days; Jolma Electric reported a 50%
              administrative efficiency improvement; and Rolls Mechanical achieved 44% top-line growth in its initial
              year on the platform. Customers replace an average of 2.6 legacy point tools upon consolidating operations
              onto BuildOps.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Retention Durability, Competitive Frictions, and Concentration
        blocks:
          - type: paragraph
            body: >
              While early venture backers and customer testimonials emphasize high satisfaction and renewal
              resilience—including statements that customers would tolerate price increases—BuildOps does not publicly
              report audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or logo churn cohorts.
              Implementation typically requires roughly three months and entails substantial process disruption, data
              migration, and field technician retraining. Direct competitor ServiceTrade aggressively targets commercial
              contractors by highlighting BuildOps's partial construction project management maturity, proprietary ERP
              sync nuances, and unverified platform uptime. Furthermore, BuildOps faces ongoing wallet-share competition
              against Procore and ServiceTitan, while Finance Hub adoption remains constrained by limited accounting
              connector support outside select platforms like Sage Intacct.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: High Switching Costs vs. Incomplete Financial Transparency
            body: >
              Commercial specialty contractors report deep operational dependency on BuildOps once workflows, asset
              histories, and accounting sync rules are configured across field and office personnel. This integration
              creates high switching barriers and strong customer retention sentiment. Nonetheless, the absence of
              public NRR, gross margin, and churn disclosures leaves critical questions regarding true net dollar
              expansion and long-term cohort economics.
            calloutType: insight
            claimRefs:
              - CU009
              - CU012
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked Residual Risk Posture
        blocks:
          - type: paragraph
            body: >-
              Third-party integration dependence is the highest-evidence operating risk: BuildOps' terms do not
              guarantee that integrations will remain available, compatible, uninterrupted, or error-free, while an
              independent comparison reports uneven accounting-sync quality across ERP stacks [CR005, CR009]. AI and
              data governance rank next because customers control credentials and data legality, may need to opt out of
              model training, and must independently verify AI output [CR002, CR003, CR004]. Field reliability and
              support are material but less measurable: independent review content reports mobile lag and says robust
              offline-first operation is not publicly demonstrated, while a public uptime SLA or support-hours matrix
              was not readily verifiable [CR010, CR011]. These are exposure signals, not proof of an outage, breach, or
              failed implementation.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR009
              - CR010
              - CR011
