  - id: FE001
    title: BuildOps Platform Technology Stack and System Architecture
    type: stack
    summary: >-
      Six-layer architectural stack diagram illustrating user interaction surfaces, backend services, durable workflow
      orchestration, and enterprise ERP integration endpoints.
    data:
      layers:
        - label: Client Interaction & Mobile Field Layer
          detail: >-
            React.js web application for office dispatch and native iOS/Android mobile clients for field service
            execution
          modules:
            - Office Web Console (React, TypeScript, Material-UI)
            - Field Technician App (Offline data capture, camera asset scanning)
          outputs:
            - Work order dispatches, time logs, and photographic asset records
        - label: API Gateway & Application Services Layer
          detail: Node.js microservices exposing GraphQL and RESTful endpoints for secure client-server communication
          modules:
            - GraphQL API Services (Apollo / Relay query layer)
            - RESTful Service Endpoints & Authentication Gateway
          outputs:
            - Validated API payloads and role-based access tokens
        - label: OpsAI Domain Automation Engine
          detail: Embedded intelligence layer powering real-time operational compression and document processing
          modules:
            - Smart Dispatch & Route Optimization Engine
            - Equipment Plate Computer Vision & Smart Recap Translation
          outputs:
            - Technician call matches, extracted serials, and draft work orders
        - label: Durable Orchestration & Messaging Layer
          detail: Temporal workflow engine and event-driven messaging pipelines ensuring reliable multi-step execution
          modules:
            - Temporal Distributed Workflow Engine
            - Event-Driven Messaging & Async Processing Queues
          outputs:
            - Stateful execution guarantees and retryable job transactions
        - label: Relational Persistence & Data Storage Layer
          detail: Structured transactional SQL database architecture managing core business entities and audit histories
          modules:
            - PostgreSQL & MySQL Transactional Databases
            - Encrypted Cloud Document & Media Storage
          outputs:
            - ACID-compliant job costing records, invoices, and asset histories
        - label: Enterprise Integration & ERP Adapter Layer
          detail: Bidirectional enterprise connectors bridging field operations with certified corporate accounting backbones
          modules:
            - Sage Intacct & Sage 300 CRE Connector
            - Oracle NetSuite, QuickBooks, and Viewpoint Adapters
          outputs:
            - Synchronized general ledger entries, purchase orders, and receivables
    approximationNotes: >-
      Architectural stack mapped from verified engineering hiring specifications, platform requirements, and third-party
      software reviews.
    claimRefs:
