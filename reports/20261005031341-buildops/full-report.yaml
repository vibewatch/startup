      - number: '1.3'
        title: Product Evolution, AI Commercial Modules, and Milestones
        blocks:
          - type: paragraph
            body: >-
              Since launching its initial commercial platform in 2020, BuildOps has methodically expanded beyond legacy
              dispatch and mobile service ticketing into comprehensive project operations and job financial controls. In
              May 2026, the company introduced Projects, a specialized construction management module powered by
              embedded OpsAI intelligence, designed to bridge service maintenance with multi-month commercial
              construction workflows. This was followed in September 2026 by Finance Hub, an automated financial control
              layer integrating field-level job costing with upstream accounting packages to eliminate discrepancy
              between field job estimates and general ledger accounting.


              These modular introductions reflect BuildOps' strategy to deepen operational lock-in within commercial
              trade enterprises, replacing an average of 2.6 disparate software point solutions per contractor. While
              commercial momentum remains robust across North America, independent diligence requires sustained
              monitoring of post-Series C capital efficiency, technical team stability following Mittal's departure, and
              the verification of underlying SaaS unit economics absent audited ARR and net revenue retention
              disclosures.
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO014
              - CO015
