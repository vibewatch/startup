chapter:
  number: 8
  title: "Valuation"
  summary: "BuildOps commands a $1B post-money valuation from its March 2025 Series C, implying an aggressive 19.2x revenue multiple on $52M reported revenue at round close. While top-line scale has expanded to over 1,500 contractors and three-year revenue growth reached 1,012% on the 2026 Inc. 5000 ranking, key unit economics including net revenue retention, GAAP gross margins, and cash burn remain undisclosed private data, warranting a disciplined Track recommendation."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "BuildOps presents an institutional investment thesis centered on purpose-built cloud vertical software for commercial specialty contractors in electrical, mechanical, plumbing, and fire safety. The core positive thesis rests on significant workflow stickiness, replacing disconnected spreadsheets and generic ERP modules with unified service dispatch, job costing, and embedded AI automation. However, the anti-thesis highlights that the private vertical SaaS multiple of ~19.2x revenue leaves minimal margin of safety against public comps if growth moderates or enterprise churn increases. Because key unit economics including net revenue retention, GAAP gross margins, and cash burn remain undisclosed private figures, investors face material execution and valuation risk at entry."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
    tableRefs:
      - "TV002"
  - id: "recommendation-and-valuation-context"
    title: "Financing Context, Entry Stance, and Recommendation"
    body: "The financing history of BuildOps reflects rapid post-money step-ups, culminating in the $126.6M to $127M Series C round in March 2025 led by Meritech Capital Partners at a $1B headline valuation. Total cumulative equity funding stands between $220M and $287.8M across institutional venture records. While the headline unicorn mark validated commercial contractor demand, the valuation stance is classified as stretched given the 19.2x multiple on $52M round-close revenue and lack of audited profitability. In Forge secondary marketplace trading, price matching and trading volume remain limited, indicating that private secondary liquidity cannot yet establish market-clearing price support. Consequently, the investment recommendation is Track with Medium confidence and High risk."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "scenario-analysis-and-diligence-path"
    title: "Scenario Analysis, Exit Readiness, and Diligence Asks"
    body: "Evaluating return paths across Bull, Base, and Bear scenarios illustrates the leverage of gross margins and multi-module expansion into the Projects suite. In the bull case, rapid adoption of Projects and OpsAI allows BuildOps to sustain premium vertical multiples toward an IPO exit above $1.8B. In the base case, multiple compression toward public comps (7x to 9x ARR) balances 40% growth, preserving value near $1.1B to $1.2B. In the bear case, workflow friction and delayed customer ERP integrations impair retention, causing down-round compression toward $650M. Confirmed diligence asks require primary disclosure of audited gross margin, cohort churn, and cash runway."
    claimRefs:
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
    tableRefs:
      - "TV003"
