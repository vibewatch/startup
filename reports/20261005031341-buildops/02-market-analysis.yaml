callouts:
  - calloutType: "insight"
    title: "Market Boundary Separation Protects Commercial Vertical Focus"
    body: "BuildOps maintains a disciplined market boundary by refusing to dilute its product architecture for the high-volume residential home services sector. By focusing exclusively on commercial specialty trade subcontractors running $5M to $100M operations, the company aligns its data model directly with complex commercial asset maintenance histories, AIA progress billing, and enterprise construction ERP integrations."
    claimRefs:
      - "CM001"
      - "CM004"
      - "CM005"
      - "CM006"
  - calloutType: "risk"
    title: "Contractor Implementation Complexity and TCO Inelasticity"
    body: "Custom quote-driven subscription pricing starting around $150 to $400+ per user per month, coupled with an 8 to 12 week onboarding runway and multi-year contract commitments, creates an adoption ceiling. Smaller subcontractors running under 15 technicians are effectively priced out of the platform, leaving the lower 90% of the field service contractor market to lower-cost competitors like QuoteIQ and Jobber."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM013"
      - "CM014"
