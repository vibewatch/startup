      - number: '5.2'
        title: 技术栈、分布式微服务与集成平台
        blocks:
          - type: paragraph
            body: >-
              BuildOps 的核心技术架构围绕数据完整性、多工种流程协同以及后台企业资源规划（ERP）双向同步打造。Web 应用前端采用 React.js、TypeScript 和定制 Material-UI 设计系统，
              支持高密度运营调度与项目管理界面。后端由 Node.js 微服务组成，同时提供 GraphQL API 和 RESTful 端点，便于第三方服务互操作。 交易持久化依托关系型 SQL 数据库，主要是
              PostgreSQL 和 MySQL，用于在复杂多工种作业成本代码、劳动力跟踪和税务辖区间保持严格的模式一致性。 对于异步多阶段 ERP
              同步、采购审批和多日工单结项等需要长期运行且具备韧性的分布式流程，BuildOps 使用 Temporal 工作流编排。 云基础设施用 Docker 容器化，并通过 Kubernetes 编排，部署在
              Amazon Web Services（AWS）和 Google Cloud Platform（GCP）上。 Integration Platform 维护与 Sage
              Intacct、NetSuite、QuickBooks 和 Viewpoint 等一线施工及中端 ERP 的双向连接器。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
