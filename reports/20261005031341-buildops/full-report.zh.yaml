      - number: '3.4'
        title: 差异化持久性、替代风险与竞争展望
        blocks:
          - type: paragraph
            body: >-
              BuildOps 的防御性护城河来自深度领域流程，横向平台和轻量 SMB 应用难以复制。Jobber 和 Housecall Pro 等 SMB 方案服务单车住宅工种，
              却无法支持工会薪资规则、复杂设备排程或商业保留款开票。不过，BuildOps 也面临明显采用摩擦：独立评价指出用户学习曲线、偶发移动同步延迟和同步后的会计差异。 尽管如此，客户基准数据表明，承包商采用后平均替换
              2.6 个旧工具，且八成在不增加后台员工的情况下扩大了运营量。
