  - id: FM001
    title: 商业专业承包商市场规模与目标细分层级
    type: pyramid
    summary: 展示市场规模漏斗：从广义全球现场服务管理市场，逐层缩小至可服务的商业 MEP 工种分包商核心市场。
    data:
      items:
        - label: 全球广义 FSM 市场（2026 年 $6.1B）
          value: 6100
          unit: USD M
          detail: Fortune Business Insights 的估计，覆盖住宅、商业和工业领域的全球现场服务管理软件。
        - label: 全球建筑业 AI 市场（2026 年 $2.18B）
          value: 2180
          unit: USD M
          detail: 覆盖设计优化、风险分析和现场运营的全球建筑业 AI 预计支出。
        - label: 美国建筑业 AI 细分市场（2026 年 $1.81B）
          value: 1810
          unit: USD M
          detail: 由云部署带动的北美建筑业 AI 技术预计支出。
        - label: 商业建筑类型份额（占建筑业 AI 的 34.05%）
          value: 742
          unit: USD M
          detail: 估计 2026 年全球建筑业 AI 支出中的商业部门分配比例。
        - label: 可服务的商业 MEP 分包商账户总盘
          value: null
