      - number: '1.2'
        title: 融资历史、独角兽估值与运营规模
        blocks:
          - type: paragraph
            body: >-
              BuildOps 的资本化进程显示，其在工业 SaaS 领域获得机构支持的速度很快。2022 年 5 月，公司宣布由 Siemens 支持的风险投资机构 Next47 领投 $43M A 轮， Founders
              Fund、StepStone Group、Fika Ventures、Global Founders Capital 和 MetaProp VC 参投。2023 年 5 月，公司完成 $50M B 轮，
              并由现有内部投资人追加 $36M；随后在 2025 年 3 月获得 Meritech Capital 领投的 $127M C 轮，Bond Capital 和 SE Ventures 成为新投资人， 累计融资超过
              $250M，投后估值达到 $1.0B。


              运营指标显示，公司在北美的企业客户采用速度很快。客户数量从 2025 年初的逾 1,000 家商业承包商增至 2026 年末的超过 1,500 家，服务 J.H. Kelly、Haynes
              Mechanical、Dynamic Systems 和 Baker Electric 等企业级工种运营商。 员工人数同比增长 50% 后达到约 375 人。不过，BuildOps 采用按用户按年计费的 SaaS
              订阅模式，尚未实现盈利；管理层拒绝公开披露经审计的 GAAP 收入、ARR、毛利率或现金消耗。
