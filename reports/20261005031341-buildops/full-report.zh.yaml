      - number: '2.2'
        title: 市场规模视角：全球估算与受证据约束的 TAM
        blocks:
          - type: paragraph
            body: >-
              评估商业专业承包商软件的可寻址市场，需要在多种相互冲突的规模测算方法中取舍，从自上而下的宏观经济预测到自下而上的账户约束都有涉及。 第三方分析师估计，全球现场服务管理（FSM）软件大市场在 2026 年约为
              $6.1 billion，预计到 2034 年复合年增长率（CAGR）为 10.7%。 同期，针对建筑业 AI 的自上而下市场研究预计，全球市场规模 2026 年为 $2,179.91 million，2035
              年增至 $24,696.92 million，预计 CAGR 为 31.27%， 商业项目约占行业支出的 34.05%。不过，尽调必须严格区分这些宏观经济汇总与专业平台实际可触达的可服务可寻址市场（SAM）。
              BuildOps 并不覆盖整个建筑生态，也不服务数量庞大的住宅个体承包商；公司管理层和第三方行业分析将其核心理想客户画像（ICP）定义为年收入 $5M–$100M、拥有至少 20 名技师的商业 MEP 分包商。
              在这个边界内，软件支出取决于软件席位许可订阅、向项目管理扩展的模块以及客户后台集成费，而不是宏观建筑产出。 由于公共统计机构没有发布包含精确年收入分层的北美专业分包商完整普查数据，自上而下的 TAM
              汇总仍是未经验证的代理指标，投资人只能依赖受单位经济性约束的自下而上测算模型。
            claimRefs:
              - CM002
