      - number: '3.2'
        title: 运营能力与多工种流程深度
        blocks:
          - type: paragraph
            body: >-
              评估竞争平台，关键是看运营生命周期的交接，而不是表面功能清单。ServiceTrade 为商业服务提供出色的客户门户和缺陷报价生成， 却无法覆盖大型安装项目和多阶段施工管理。Procore 能处理文档控制、RFI
              和施工报审，但迫使专业承包商另购调度及经常性预防维护软件。 BuildOps 把服务调度、资产跟踪和项目管理统一到一个行动系统，填补了这一断层。公司招募前 Procore 专业承包商产品负责人 Will
              Lehrmann， 进一步强化了端到端自动化商业工种运营的战略重点。
            claimRefs:
