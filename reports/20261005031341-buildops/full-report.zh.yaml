  - id: FE001
    title: BuildOps 平台技术栈与系统架构
    type: stack
    summary: 六层架构图展示用户交互界面、后端服务、持久化工作流编排，以及企业 ERP 集成端点。
    data:
      layers:
        - label: 客户端交互与移动现场层
          detail: 面向办公室调度的 React.js Web 应用，以及用于执行现场服务的原生 iOS/Android 移动客户端
          modules:
            - 办公室 Web 控制台（React、TypeScript、Material-UI）
            - 现场技术人员应用（离线数据采集、相机资产扫描）
          outputs:
            - 工单调度、工时日志和资产照片记录
        - label: API 网关与应用服务层
          detail: 通过 GraphQL 和 RESTful 端点提供服务的 Node.js 微服务，用于安全的客户端—服务器通信
          modules:
            - GraphQL API 服务（Apollo / Relay 查询层）
            - RESTful 服务端点与身份验证网关
          outputs:
            - 已验证的 API 载荷和基于角色的访问令牌
        - label: OpsAI 领域自动化引擎
          detail: 驱动实时运营压缩和文档处理的嵌入式智能层
          modules:
            - 智能调度与路线优化引擎
            - 设备铭牌计算机视觉与智能回顾翻译
          outputs:
            - 技术人员呼叫匹配、提取的序列号和草拟工单
        - label: 持久化编排与消息层
          detail: Temporal 工作流引擎和事件驱动消息管道，确保可靠执行多步骤任务
          modules:
            - Temporal 分布式工作流引擎
            - 事件驱动消息与异步处理队列
          outputs:
            - 有状态执行保障和可重试的作业事务
        - label: 关系型持久化与数据存储层
          detail: 管理核心业务实体和审计历史的结构化事务型 SQL 数据库架构
          modules:
            - PostgreSQL 与 MySQL 事务型数据库
            - 加密云文档与媒体存储
          outputs:
            - 符合 ACID 的作业成本记录、发票和资产历史
        - label: 企业集成与 ERP 适配层
          detail: 双向企业连接器将现场运营与经过认证的企业会计骨干系统连接起来
          modules:
            - Sage Intacct 与 Sage 300 CRE 连接器
            - Oracle NetSuite、QuickBooks 和 Viewpoint 适配器
          outputs:
            - 已同步的总账分录、采购订单和应收账款
    approximationNotes: 架构栈根据已核实的工程招聘要求、平台要求和第三方软件评测绘制。
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
  - id: FU001
    title: 商业承包商采用与扩张旅程
    type: journey-map
    summary: 展示商业承包商入驻、移动端采用、多模块扩张和后台财务集成的逐步阶段。
    data:
      items:
        - label: 1. 初始入驻与 ERP 集成
          description: 进行为期 8-12 周的结构化实施，将复杂的会计科目表、项目成本代码和历史客户资产记录映射至会计软件。
          touchpoints:
            - ERP 连接器配置（Sage Intacct、NetSuite、Vista）
            - 历史客户与资产数据清理
            - 办公室员工与调度员工作流培训
        - label: 2. 核心现场与服务上线
          description: 为现场技术人员提供移动端入驻，启用自动调度、按技能排班和数字化工单结案。
          touchpoints:
            - 技术人员移动应用激活
            - AI 驱动的技能与距离调度
            - 数字工时卡与现场照片采集
        - label: 3. OpsAI 嵌入式工作流应用
          description: 现场团队采用嵌入式 AI 能力，自动完成繁琐的文档工作，并识别后续维护机会。
          touchpoints:
            - 光学设备铭牌扫描（每月 100k+）
            - 智能现场回顾起草与语音听写
            - 自动生成缺陷报价
        - label: 4. 多模块扩张（Projects 与 Finance）
          description: 将账户扩展至跨月施工项目跟踪、提交材料、RFI 和过账前会计控制。
          touchpoints:
            - 商业建筑启用 Projects 模块
            - Finance Hub 过账前总账治理
            - 年度经常性维护协议跟踪
        - label: 5. 长期稳固与厂商锁定
          description: 平台成为统一的运营记录系统，带来较高客户切换成本，但也受到续约定价压力制衡。
          touchpoints:
            - 与指定 CSM 进行高管业务评审
            - 参与客户咨询委员会与倡导活动
            - 多年期企业合同续约
        - label: 6. 倡导者激活与社区反馈
          description: 满意的承包商管理层参与客户推荐项目、用户大会和产品路线图咨询小组。
          touchpoints:
            - 面向潜在买家的客户推荐电话
            - Forge 用户大会演讲
            - 客户咨询委员会参与路线图优先级排序
    approximationNotes: 生命周期阶段反映典型的 8-12 周商业入驻、现场部署和后续模块扩张流程，这些流程记录在客户成功岗位描述和案例历史中。
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 定性排序区分影响、公开可能性信号和缓解措施成熟度，不暗示经过测量的事件发生概率。
    data:
      columns:
        - 影响
        - 公开可能性信号
        - 缓解措施成熟度
      rows:
        - label: ERP 与集成依赖
          values:
            - 高
            - 评测证据显示偏高
            - 合同控制已披露；技术证明属于私有信息
        - label: AI 与数据治理
          values:
            - 高
            - 取决于功能使用
            - 提供退出和人工审查
        - label: 移动端与离线可靠性
          values:
            - 高
            - 负面评价信号；频率未知
            - 公开证据有限
        - label: 支持与 SLA 执行
          values:
            - 中高
            - 评价信号不一
            - 公开 SLA 细节不完整
        - label: 财务透明度与现金续航
          values:
            - 高
            - 融资记录相互矛盾
            - 需要私下尽调
        - label: 运营规模证据
          values:
            - 中
            - 客户数量口径与员工规模估计未经审计
            - 缺少留存率和产能证据
    approximationNotes: 影响和可能性信号是分析师基于所引用术语、公司陈述、独立评价内容及明确证据缺口作出的定性分类，并非数值预测。
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR011
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: BuildOps 估值决策逻辑
    type: flow
    summary: 将运营规模、融资倍数和证据缺口串成逻辑链，导向“跟踪”建议。
    data:
      nodes:
        - id: n1
          label: 高增长规模：1,500+ 名承包商，3 年增长 1,012%
        - id: n2
          label: C 轮独角兽里程碑：$127M 融资轮对应 $1B 估值
        - id: n3
          label: 估值阻力：收入倍数 19.2 倍，盈利能力未经审计
        - id: n4
          label: 信息不对称：NRR、毛利率和现金消耗未披露
        - id: n5
          label: 二级市场流动性不足：Forge 市场活动和定价信息有限
        - id: n6
