    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、商业工种聚焦与领导层演变
        blocks:
          - type: paragraph
            body: >-
              BuildOps 由 Alok Chanani、Steve Chew 和 Neeraj Mittal 于 2018 年在洛杉矶创立，旨在解决 HVAC、电气、管道、机械和消防等商业专业工种的运营割裂问题。
              与围绕高频调度和工单式家庭服务设计的住宅现场服务软件不同，BuildOps 从一开始就为复杂商业流程、数月期作业管理、报审文件以及现场到办公室的财务控制打造一体化平台。


              联合创始人兼 CEO Alok Chanani 负责公司管理；他曾任美国陆军上尉及伊拉克运输部队指挥官，此前在房地产领域创办 USA Commercial。 联合创始人 Steve Chew 担任 COO，曾在
              Microsoft、Nextag 和 Fundly 负责技术、运营及产品。联合创始人 Neeraj Mittal 曾任 ServiceTitan 工程总监， 在 C
              轮融资前离开公司，技术治理因此经历明显的领导层交接。$127M C 轮融资后，Meritech Capital 普通合伙人兼联合创始人 Paul Madera 加入 BuildOps 董事会，提供机构监督。
