            body: >-
              BuildOps 发布的条款对客户设置了若干合规边界。客户负责账户使用、凭证保密、客户数据的内容与准确性，以及处理这些数据所需的权利和同意 [CR002]。 该服务无意满足 HIPAA 义务，BuildOps
              不是 HIPAA 业务伙伴，禁止数据和高风险用途也不在预期范围内 [CR001]。 对于 AI 功能，除非客户退出，BuildOps
              可能使用客户输入和输出训练本地模型；同时，生成输出不保证准确、完整、最新或不侵犯权利 [CR003, CR004]。
              指定来源没有证明存在或不存在诉讼、执法、认证或安全事件，因此这些事项仍是待尽调问题，不能据此得出历史清白结论。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
