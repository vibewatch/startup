  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界定义与运营范围
        blocks:
          - type: paragraph
            body: >-
              商业专业承包技术市场处在住宅家庭服务软件与总承包商项目管理平台之间，这一边界的运营要求很高。商业专业承包商——主要是机械、电气、管道（MEP）以及消防和生命安全分包商——
              管理多地点商业资产、预防性维护服务等级协议、复杂工单结项和进度计费。通用住宅现场服务管理工具在架构上不适合这一场景，因为它们强调单车快速住宅调度、消费者融资和高速线索接入，
              而不是设备服务历史、复杂多阶段商业作业成本和 AIA 进度计费流程。反过来，Procore 等总承包商软件主要站在业主和总承包商角度管理整个工地，
              缺少自营专业工种所需的细粒度工时采集、技师路线规划、零件调度和深度设备维护日志，而这些工种直接承担现场人工和材料风险。BuildOps 明确把商业边界限定在机械、电气、管道、HVAC 以及消防 / 生命安全工种，
              有意排除轻量住宅专属流程。第三方买方指南也指出，BuildOps 适合以经常性服务协议、多地点商业调度、复杂资产跟踪和多工种投标管理为核心的纯商业运营。
              住宅承包商优先考虑统一费率的消费者账簿和自助网页排程，而商业 MEP 分包商需要企业级流程，把现场技师工时跟踪和材料请购直接接入 Sage 300 CRE、Sage Intacct 和 Viewpoint
              等后台施工会计软件。
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
