      - number: '3.3'
        title: 产品打包、ERP 同步与承包商切换成本
        blocks:
          - type: paragraph
            body: >-
              商业承包商采购软件需要投入大量资金，并经历数月组织变更。BuildOps 按席位按年订阅，报道价格约为每用户每月 150 美元， 价格包含上线和分包商协调，不另收席位费。Procore
              则按总建筑收入收取阶梯费用，使服务占比较高的企业承压。 真正的切换成本在数据同步和会计流程：BuildOps 把双向连接器嵌入 Sage Intacct、NetSuite 和 Viewpoint 等 ERP
              总账。 部署这些集成约需三个月的数据清理和运营变更管理，从而在客户账户中形成较强的上线后留存。
            claimRefs:
