figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间展示 BuildOps 从成立、Series A/B 轮融资，到估值 $1B 的独角兽 Series C、Projects 上线及 Finance Hub 发布的发展历程。
    data:
      items:
        - label: 公司成立
          date: '2018-09-01'
          detail: BuildOps 由 Alok Chanani、Steve Chew 和 Neeraj Mittal 在洛杉矶创立，旨在打造面向商业承包商的专用软件。
          tone: positive
        - label: 商业平台上线
          date: '2020-05-01'
          detail: 商业平台正式上线，在第一个运营年度内，年度收入就超过七位数。
          tone: positive
        - label: Series A 融资（$43M）
          date: '2022-05-24'
          detail: 完成 $43M Series A 融资，由 Next47（获 Siemens 支持）领投，Founders Fund、Fika 和 StepStone Group 参投。
          tone: positive
        - label: Series B 融资与追加轮（总额 $86M）
          date: '2023-05-15'
          detail: 宣布 $50M Series B 融资，随后由现有机构投资者完成内部 $36M 追加轮。
          tone: positive
        - label: 联合创始人 Mittal 离职
          date: '2024-10-01'
          detail: 联合创始人、前 CTO Neeraj Mittal 离开 BuildOps，结束其在公司基础工程建设后的高管任期。
          tone: warning
        - label: Series C 独角兽轮（$127M）
          date: '2025-03-21'
          detail: 完成 $127M Series C 融资，由 Meritech Capital 领投，投后估值 $1.0B；Paul Madera 加入董事会。
          tone: positive
        - label: Projects 模块上线
          date: '2026-05-07'
          detail: 发布内置 OpsAI 的 Projects，将跨月施工项目管理与现场服务统一起来。
          tone: positive
        - label: Finance Hub 上线
          date: '2026-09-15'
          detail: 引入 Finance Hub 财务控制层，把现场工作与现有总账系统连接起来，服务 1,500+ 家承包商。
          tone: positive
    approximationNotes: 日期依据官方新闻稿和 TechCrunch 报道；联合创始人 Mittal 的离职日期是根据 LinkedIn 记录估计的公开转变时间线。
