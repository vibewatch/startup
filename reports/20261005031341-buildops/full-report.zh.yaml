      - number: '1.3'
        title: 产品演进、商业 AI 模块与里程碑
        blocks:
          - type: paragraph
            body: >-
              自 2020 年推出最初的商业平台以来，BuildOps 有条理地从传统调度和移动服务工单扩展到完整的项目运营与作业财务控制。2026 年 5 月，公司推出 Projects， 这是由内置 OpsAI
              智能驱动的专业施工管理模块，用于把服务维护与数月期商业施工流程衔接起来。2026 年 9 月，公司又推出 Finance Hub，
              这一自动化财务控制层把现场作业成本核算与上游会计软件连接起来，消除现场作业估算与总账会计之间的差异。


              这些模块显示 BuildOps 正在加深商业工种企业的运营锁定，每家承包商平均替代 2.6 个彼此割裂的软件点解决方案。尽管公司在北美的商业业务势头仍然强劲， 独立尽调仍需持续跟踪 C
              轮后的资本效率、Mittal 离开后的技术团队稳定性，并在缺乏经审计 ARR 和净收入留存披露的情况下核实 SaaS 单位经济性。
