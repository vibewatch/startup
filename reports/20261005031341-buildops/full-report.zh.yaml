  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              BuildOps 的机构投资论点围绕为电气、机械、管道和消防商业专业承包商打造的云端垂直软件。正面论点在于工作流粘性强，用统一的服务调度、作业成本核算和内置 AI 自动化替代割裂的电子表格与通用 ERP 模块。
              但反论点指出，若增长放缓或企业客户流失增加，私有垂直 SaaS 约 19.2x 收入倍数相对于上市可比公司几乎没有安全边际。 净收入留存、GAAP
              毛利率和现金消耗等关键单位经济指标仍是未披露的私有数据，因此投资人在入场时面临重大执行和估值风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV010
      - number: '8.2'
        title: 融资背景、入场立场与建议
        blocks:
          - type: paragraph
            body: >-
              BuildOps 的融资历史显示，投后估值快速上跳，最终在 2025 年 3 月由 Meritech Capital Partners 领投 $126.6M–$127M C 轮，账面估值为 $1B。
              机构风险投资记录中的累计股权融资介于 $220M 和 $287.8M 之间。虽然独角兽估值验证了商业承包商需求，但考虑到 $52M 轮末收入对应 19.2x 倍数且缺乏经审计盈利，估值立场偏高。 Forge
              二级市场交易的价格撮合和成交量仍有限，表明私募二级流动性尚不能建立市场出清价格支撑。因此，投资建议为跟踪，信心中等，风险高。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV013
      - number: '8.3'
        title: 情景分析、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              比较 Bull、Base 和 Bear 情景的回报路径，可以看出毛利率和向 Projects 套件扩展多模块的杠杆作用。乐观情景下，Projects 和 OpsAI 快速采用，使 BuildOps
              能维持较高垂直倍数，走向超过 $1.8B 的 IPO 退出。 基准情景下，倍数向上市可比公司压缩（ARR 的 7x–9x），与 40% 增长相抵后，价值维持在约
              $1.1B–$1.2B。悲观情景下，工作流摩擦和客户 ERP 集成延迟损害留存，估值在下轮融资中压缩至约 $650M。 已确认的尽调要求包括由公司直接披露经审计毛利率、客户队列流失率和现金跑道。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV011
              - CV012
      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 倍数压缩风险
            body: C 轮投资人支付的 19.2x 收入倍数，隐含软件表现位居前列。在毛利率和净留存未披露的情况下，承包商采用一旦放缓，就可能向上市垂直软件平均水平大幅压缩倍数。
            calloutType: risk
            claimRefs:
              - CV001
              - CV007
          - type: callout
            title: 对二级市场配置保持纪律
            body: Forge 市场数据显示流动性有限且没有价格发现；在缺乏经审计单位经济性和可核验合同留存队列的情况下，潜在二级买方应避免按 $1B 账面估值支付。
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV009
