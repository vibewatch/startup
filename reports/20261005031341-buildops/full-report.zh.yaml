      - number: '7.3'
        title: 合作伙伴、资本与执行依赖
        blocks:
          - type: paragraph
            body: >-
              BuildOps 依赖外部集成、客户实施能力，以及私营公司规模下的持续执行。其买方指南把上线速度、培训负担、配置归属、会计数据流和离线可靠性列为采购核心测试 [CR007, CR008]。
              公开融资记录并未完全对上：Tracxn 报告五轮共 $226 million，FundedIQ 报告三轮共 $220 million；两者都确认 2025 年 3 月的 $127 million C 轮
              [CR012, CR013]。 差异可能来自覆盖方法不同，但因此不能把任何一个总额视为经审计的可用现金。员工规模估计也从 501–1,000 与 101–250 两个区间之间分歧 [CR014, CR015]，
              进一步降低了公众对实施和支持能力的可见性。
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
