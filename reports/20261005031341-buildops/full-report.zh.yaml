              - CR007
              - CR008
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: 缓释措施、监控与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              投资批准应以填补公开信息缺口的证据为前提，而不是只看营销规模。BuildOps 声称拥有 1,500+ 家商业承包商客户，但指定证据没有披露留存、集中度、生产环境与试点状态或基准方法 [CR016]。
              经确认的重大数据或监管事件、无法提供最新安全和正常运行时间证据、客户 ERP 参考中的重复对账失败，或留存与集中度数据不支持持久扩张，都应视为投资论点失效。
              财务尽调应核对融资总额，并直接取得现金、消耗、利润率和跑道数据；已募集资金不等于可用现金 [CR012, CR013]。 运营缓释需要审阅合同级 SLA、测试导出、集成回滚流程、人工复核 AI
              输出，并访谈使用相同 ERP 与现场连接条件的客户 [CR004, CR005, CR006, CR011]。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 不能推断“没有问题”
            body: 指定的反向检索没有返回留存 URL，但这不能证明 BuildOps 从未发生诉讼、执法行动、泄露、宕机或其他事件。法律、监管、安全和状态的一手证据仍是尽调要求。
            calloutType: risk
            claimRefs:
              - CR010
          - type: callout
            title: 评估剩余风险前必须取得的证据
            body: 在把已披露缓释措施视为成熟之前，要求取得安全和正常运行时间记录、使用相同 ERP 的客户参考、客户队列留存和集中度、经审计财务报表，以及核对后的现金和跑道表。
            calloutType: recommendation
