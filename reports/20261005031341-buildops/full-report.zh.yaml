  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与商业流程架构
        blocks:
          - type: paragraph
            body: >-
              BuildOps 围绕商业专业工种承包商的运营生命周期定义产品范围，具体服务机械、电气、管道、HVAC、制冷以及消防和生命安全企业。
              商业承包涉及多资产工业设施、数月施工周期、复杂工会用工合规和分散式项目会计，不同于改造后用于轻量商业场景的住宅现场服务软件。 BuildOps 平台是覆盖端到端商业运营的系统，主要模块为 Service 和
              Projects。Service 负责来电接入、自动调度、预防性维护协议、工单执行和移动结项； Projects 管理施工级流程，包括信息请求（RFI）、报审文件、图纸文档控制、变更单、采购和实时作业成本核算。
              软件把这些传统上彼此割裂的应用统一到一个云环境中，每家承包商平均替代 2.6 个点解决方案，并从最初资本项目安装一直保留到多年服务维护的连续资产历史。
            claimRefs:
              - CE001
