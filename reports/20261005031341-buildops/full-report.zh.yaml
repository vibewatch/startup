  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 商业承包软件格局与竞争者分层
        blocks:
          - type: paragraph
            body: >-
              过去，商业专业承包商处在缺乏系统支持的运营真空中，靠割裂的电子表格、消息应用和彼此断开的本地会计工具协调高价值机械、电气和管道项目。 竞争格局分成源自住宅的现场服务平台和企业级总承包套件两类。市场领导者
              ServiceTitan 在 2024 年 12 月以接近 90 亿美元的估值 IPO， 并拥有超过 11,000 家活跃客户企业，验证了工种软件需求，但其产品架构仍带有住宅基因。Procore
              则占据一般建筑层级，却缺少原生服务调度和持续维护协议。 BuildOps 位于两者之间，面向多工种商业分包商提供专门设计的工作流。
            claimRefs:
