schemaVersion: "report-v2"
artifact: risks
slug: buildops
runDate: 2026-10-05
company:
  name: BuildOps
chapter:
  number: 7
  title: Risks
  summary: >-
    BuildOps' clearest disclosed risks are third-party integration liability,
    customer-borne data and AI governance duties, and implementation friction.
    Public evidence does not establish incident frequency, uptime performance,
    retention, concentration, profitability, cash balance, or runway, so those
    items remain diligence conditions rather than inferred strengths.
sections:
  - id: ranked-risk-posture
    title: Ranked Residual Risk Posture
    body: >-
      Third-party integration dependence is the highest-evidence operating risk:
      BuildOps' terms do not guarantee that integrations will remain available,
      compatible, uninterrupted, or error-free, while an independent comparison
      reports uneven accounting-sync quality across ERP stacks [CR005, CR009].
      AI and data governance rank next because customers control credentials and
      data legality, may need to opt out of model training, and must independently
      verify AI output [CR002, CR003, CR004]. Field reliability and support are
      material but less measurable: independent review content reports mobile lag
      and says robust offline-first operation is not publicly demonstrated, while
      a public uptime SLA or support-hours matrix was not readily verifiable
      [CR010, CR011]. These are exposure signals, not proof of an outage, breach,
      or failed implementation.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR009
      - CR010
      - CR011
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: legal-regulatory-boundaries
    title: Legal, Regulatory, and Data Boundaries
    body: >-
      BuildOps' published terms place several compliance boundaries on customers.
      Customers are responsible for account use, credential confidentiality, the
      content and accuracy of customer data, and the rights and consents needed to
      process that data [CR002]. The service is not intended to satisfy HIPAA
      obligations, BuildOps is not a HIPAA Business Associate, and prohibited data
      and high-risk uses sit outside the intended scope [CR001]. For AI features,
      BuildOps may use customer input and output to train its local models unless a
      customer opts out, while generated output is not warranted to be accurate,
      complete, current, or non-infringing [CR003, CR004]. No assigned source
      establishes the presence or absence of litigation, enforcement, certifications,
      or security incidents; those matters therefore remain open diligence rather
      than a clean-history conclusion.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR006
      - CR010
    tableRefs:
      - TR001
  - id: dependency-and-execution
    title: Partner, Capital, and Execution Dependencies
    body: >-
      BuildOps depends on external integrations, customer implementation capacity,
      and continued execution at private-company scale. Its own buyer guidance
      frames rollout speed, training burden, configuration ownership, accounting
      data flow, and offline reliability as core procurement tests [CR007, CR008].
      Public funding records do not fully reconcile: Tracxn reports $226 million
      over five rounds, while FundedIQ reports $220 million over three recorded
      rounds; both identify a $127 million Series C in March 2025 [CR012, CR013].
      The difference may reflect coverage methodology, but it prevents treating
      either total as audited cash available. Workforce estimates also diverge
      between a 501-1,000 band and a 101-250 band [CR014, CR015], weakening public
      visibility into implementation and support capacity.
    claimRefs:
      - CR005
      - CR007
      - CR008
      - CR012
      - CR013
      - CR014
      - CR015
    tableRefs:
      - TR003
  - id: kill-criteria-and-diligence
    title: Mitigations, Monitoring, and Thesis-Break Triggers
    body: >-
      Investment approval should be conditional on evidence that closes the public
      gaps rather than on marketing scale alone. BuildOps claims 1,500+ commercial
      contractor customers, but the assigned evidence does not disclose retention,
      concentration, production-versus-pilot status, or benchmark methodology
      [CR016]. A thesis break would be a confirmed material data or regulatory
      incident, inability to produce current security and uptime evidence, repeated
      reconciliation failures in customer ERP references, or retention and
      concentration data inconsistent with durable expansion. Financial diligence
      should reconcile the funding totals and obtain cash, burn, margin, and runway
      directly; funding raised is not cash available [CR012, CR013]. Operational
      mitigation requires contract-specific SLA review, tested exports, integration
      rollback procedures, human review of AI output, and customer references using
      the same ERP and field-connectivity conditions [CR004, CR005, CR006, CR011].
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR011
      - CR012
      - CR013
      - CR016
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk or obligation
      - Jurisdiction / scope
      - Public status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - HIPAA and prohibited-data boundary
        - U.S. customers handling regulated data
        - Service is not intended to satisfy HIPAA obligations
        - Unknown; use-case dependent
        - High if regulated data is mishandled
        - Data classification, tenant controls, and contractual workflow restrictions
        - Customer bears responsibility for lawful data and consents
        - Review DPA, security policy, data maps, and healthcare-related customer workflows
      - - AI input, output, and training rights
        - Customers using AI features
        - Local-model training permitted unless the customer opts out
        - Medium where AI features are enabled
        - High for financial or operational reliance
        - Opt out where required and mandate human verification
        - Accuracy and IP risk remain customer-controlled under the terms
        - Test opt-out operation, model data boundaries, error logs, and review controls
      - - Account and credential control
        - All licensed users
        - Customer controls users, data, and credential confidentiality
        - Medium
        - Medium to high
        - SSO, least privilege, joiner-mover-leaver controls, and access reviews
        - Public sources do not establish enterprise identity-control depth
        - Obtain SSO, SCIM, audit-log, and privileged-access documentation
      - - Post-termination data export
        - Expired or terminated subscriptions
        - Written export request required within 30 days
        - Medium on termination
        - Medium
        - Contractual export plan and pre-termination backup test
        - Data access may cease before a delayed migration completes
        - Run a full export and restoration test before signing or renewal
    notes: >-
      Sample of investor-relevant obligations in BuildOps' published terms; likelihood
      and severity are qualitative analyst assessments, not observed incident rates,
      and no assigned source proves the presence or absence of litigation or enforcement.
    enumerationScope:
      coverage: sample
      basis: >-
        Selected material clauses from the current BuildOps terms plus independent
        public review evidence available in the assigned source pool.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR006
      - CR010
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood signal
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - ERP or accounting integration degradation
        - Independent review reports uneven sync quality
        - High for finance workflows
        - Contractual allocation is clear; technical evidence is private
        - Customer bears third-party availability and interoperability risk
        - Error frequency, reconciliation effort, and rollback performance
      - - Mobile or offline field interruption
        - Review content reports lag; offline-first proof is unclear
        - High for time, job, and closeout capture
        - Unverified
        - Public evidence does not quantify loss or duplicate-record rates
        - Device-level offline tests across representative field conditions
      - - Critical support escalation delay
        - Independent sources report mixed support consistency
        - Medium to high
        - Training resources exist; public SLA detail is incomplete
        - Complex incidents may require vendor escalation
        - Severity response times, support hours, credits, and historical attainment
      - - Rollout and configuration failure
        - Vendor guidance identifies training and configuration as adoption tests
        - Medium to high
        - Vendor-led support is described, but scope is contract-specific
        - Internal process change and terminology can delay value realization
        - Implementation plan, staffing, data migration, and acceptance criteria
    notes: >-
      Signals combine company contractual or buyer guidance with independent review
      content; labels are directional and do not represent measured outage, breach,
      defect, or implementation-failure probabilities.
    claimRefs:
      - CR005
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or input
      - Role
      - Concentration visibility
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Third-party integrations
        - ERP, accounting, and other connected providers
        - Move operational and financial data between systems
        - Not publicly quantified
        - Connector degradation creates reconciliation work or workflow interruption
        - High
        - Contract review, sandbox tests, monitoring, and rollback procedures
        - BuildOps disclaims integration availability and compatibility guarantees
      - - Customer implementation capacity
        - Finance, dispatch, field, and system-administration teams
        - Configure workflows, train users, and maintain data quality
        - Customer-specific
        - Weak adoption or configuration prevents system-of-record benefits
        - Medium to high
        - Phased rollout, acceptance gates, role-based training, and accountable owners
        - Public evidence does not quantify time-to-value or failed deployments
      - - Private capital and financial disclosure
        - Investors and company-reported operating information
        - Fund product investment and commercial scaling
        - Funding totals conflict across databases
        - Capital needs or burn exceed available cash despite prior fundraising
        - High
        - Reconcile cap table, cash, debt, burn, and board-approved plan
        - Revenue, margins, profitability, cash, and runway remain undisclosed
      - - Execution capacity
        - Employees and implementation or support resources
        - Deliver product, onboarding, and escalation coverage
        - Public workforce estimates materially diverge
        - Staffing capacity does not match customer or product expansion
        - Medium
        - Verify payroll headcount, attrition, open roles, and support ratios
        - Public profiles cannot establish current functional capacity
    notes: >-
      Dependency concentration is not publicly quantified; funding raised is not cash
      available, and workforce estimates are third-party records rather than audited
      staffing disclosures.
    claimRefs:
      - CR005
      - CR007
      - CR008
      - CR012
      - CR013
      - CR014
      - CR015
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Qualitative prioritization separates impact, public likelihood signal, and
      mitigation maturity without implying measured incident probabilities.
    data:
      columns:
        - Impact
        - Public likelihood signal
        - Mitigation maturity
      rows:
        - label: ERP and integration dependency
          values:
            - High
            - Elevated by review evidence
            - Contract controls disclosed; technical proof private
        - label: AI and data governance
          values:
            - High
            - Feature-use dependent
            - Opt-out and human review available
        - label: Mobile and offline reliability
          values:
            - High
            - Adverse review signal; frequency unknown
            - Public proof limited
        - label: Support and SLA execution
          values:
            - Medium to high
            - Mixed review signal
            - Public SLA detail incomplete
        - label: Financial transparency and runway
          values:
            - High
            - Funding records conflict
            - Private diligence required
        - label: Operating-scale evidence
          values:
            - Medium
            - Customer claim and workforce estimates are unaudited
            - Retention and capacity evidence missing
    approximationNotes: >-
      Impact and likelihood signals are qualitative analyst classifications derived
      from cited terms, company statements, independent review content, and explicit
      evidence gaps; they are not numerical forecasts.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR011
      - CR013
      - CR015
      - CR016
callouts:
  - calloutType: risk
    title: No clean-bill-of-health inference
    body: >-
      The assigned adverse query returned no retained URL, but that is not evidence
      that BuildOps has had no lawsuit, enforcement action, breach, outage, or other
      incident. Primary legal, regulatory, security, and status evidence remains a
      diligence requirement.
    claimRefs:
      - CR010
  - calloutType: recommendation
    title: Evidence required before underwriting residual risk
    body: >-
      Require security and uptime records, same-ERP customer references, cohort
      retention and concentration, audited financial statements, and a reconciled
      cash and runway schedule before treating the disclosed mitigations as mature.
    claimRefs:
      - CR005
      - CR009
      - CR010
      - CR012
      - CR013
      - CR016
