callouts:
  - calloutType: insight
    title: "The Architectural Moat of Commercial Handoffs"
    body: "BuildOps' primary competitive barrier is not raw feature volume but data persistence across the project-to-service lifecycle. By linking installed equipment directly to permanent asset service records and ERP cost codes, BuildOps eliminates administrative re-entry friction that horizontal construction platforms and residential dispatch tools fail to bridge."
    claimRefs:
      - CP009
      - CP012

