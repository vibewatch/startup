company:
  name: BuildOps
chapter:
  number: 1
  title: Company Overview
  summary: Founded in 2018 in Los Angeles by Alok Chanani, Steve Chew, and Neeraj Mittal, BuildOps develops an AI-native operational and financial software platform specifically engineered for commercial specialty trade contractors. In March 2025, the company secured a $127M Series C led by Meritech Capital valuing BuildOps at $1B post-money, scaling its customer footprint to over 1,500 contractors while managing leadership transitions following the departure of co-founder Neeraj Mittal.
sections:
  - id: company-identity-and-leadership
    title: Company Identity, Commercial Trade Focus, and Leadership Evolution
    body: |-
      BuildOps was founded in 2018 in Los Angeles by Alok Chanani, Steve Chew, and Neeraj Mittal to address operational fragmentation in commercial specialty trades including HVAC, electrical, plumbing, mechanical, and fire safety. Unlike residential field service software designed around high-frequency dispatching and ticket-based home service, BuildOps architected an all-in-one software platform tailored to complex commercial workflows, multi-month job management, submittals, and field-to-office financial control.

      Executive leadership is led by Co-Founder and Chief Executive Officer Alok Chanani, a former U.S. Army Captain and transportation unit commander in Iraq who previously established USA Commercial in real estate. Co-Founder Steve Chew serves as Chief Operating Officer, drawing on technical and operational product leadership across Microsoft, Nextag, and Fundly. Co-founder Neeraj Mittal, who previously served as director of engineering at ServiceTitan, departed the company prior to the Series C round, creating a notable leadership transition in technical governance. Following the $127M Series C financing, Paul Madera, general partner and co-founder of Meritech Capital, joined BuildOps' board of directors to provide institutional oversight.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
    tableRefs:
      - TO002
  - id: capitalization-and-scale-metrics
    title: Financing History, Unicorn Valuation, and Operational Scale
    body: |-
      BuildOps' capitalization progression reflects accelerated institutional backing within the industrial SaaS sector. In May 2022, the company announced a $43M Series A round led by Next47, a venture firm backed by Siemens, with participation from Founders Fund, StepStone Group, Fika Ventures, Global Founders Capital, and MetaProp VC. The company subsequently completed a $50M Series B in May 2023 along with a $36M internal top-up raise from existing insiders, before securing a $127M Series C in March 2025 led by Meritech Capital with new investors Bond Capital and SE Ventures, bringing cumulative funding to over $250M at a $1.0B post-money valuation.

      Operational metrics indicate rapid enterprise adoption across North America. The company expanded its customer base from over 1,000 commercial contractors in early 2025 to more than 1,500 contractors by late 2026, serving enterprise trade operators such as J.H. Kelly, Haynes Mechanical, Dynamic Systems, and Baker Electric. Internal workforce headcount reached approximately 375 employees following a 50% year-over-year expansion. However, BuildOps operates on an annual per-user SaaS subscription model and remains not yet profitable, with executive management declining to publicly disclose audited GAAP revenue, ARR, gross margins, or cash burn.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
    tableRefs:
      - TO001
      - TO003
  - id: product-expansion-and-governance-milestones
    title: Product Evolution, AI Commercial Modules, and Milestones
    body: |-
      Since launching its initial commercial platform in 2020, BuildOps has methodically expanded beyond legacy dispatch and mobile service ticketing into comprehensive project operations and job financial controls. In May 2026, the company introduced Projects, a specialized construction management module powered by embedded OpsAI intelligence, designed to bridge service maintenance with multi-month commercial construction workflows. This was followed in September 2026 by Finance Hub, an automated financial control layer integrating field-level job costing with upstream accounting packages to eliminate discrepancy between field job estimates and general ledger accounting.

      These modular introductions reflect BuildOps' strategy to deepen operational lock-in within commercial trade enterprises, replacing an average of 2.6 disparate software point solutions per contractor. While commercial momentum remains robust across North America, independent diligence requires sustained monitoring of post-Series C capital efficiency, technical team stability following Mittal's departure, and the verification of underlying SaaS unit economics absent audited ARR and net revenue retention disclosures.
    claimRefs:
      - CO006
      - CO007
      - CO010
      - CO014
      - CO015
      - CO016
    figureRefs:
      - FO001
