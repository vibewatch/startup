company:
  name: Revolut
chapter:
  number: 1
  title: Company Overview
  summary: 'Revolut is a London-headquartered global fintech founded in 2015 by Nik Storonsky and Vlad Yatsenko. It has grown
    into Europe''s most valuable private technology company at a $75 billion implied valuation (November 2025 secondary share
    sale), with $4 billion in revenue, $1.4 billion pre-tax profit, and 52.5 million retail customers as of year-end 2024.
    Revolut offers a super-app for personal and business banking across FX, payments, crypto, wealth, and lending in 40+ countries.

    '
sections:
- id: s1
  title: Identity and Business Model
  body: 'Revolut Group Holdings Ltd (registered in the United Kingdom) operates the Revolut digital banking super-app, launched
    commercially in July 2015 with a currency-exchange and prepaid card offering. Headquartered at Canary Wharf, London (moved
    from its original Shoreditch offices in 2024), Revolut is incorporated as a private limited company and holds banking
    licences or e-money authorisations across the UK, EU (via Bank of Lithuania), and a growing number of international jurisdictions
    including Australia, Singapore, Mexico, and Colombia. As of May 2026, Revolut remains private with no confirmed IPO timeline
    before 2028.

    The core business model is a financial super-app spanning: (1) consumer current accounts and debit cards, (2) foreign
    exchange and international transfers, (3) wealth products including stock trading, crypto exchange (Revolut X), bonds,
    ETFs, and robo-advisory, (4) subscription tiers (Standard, Plus, Premium, Metal, Ultra) generating recurring revenue,
    (5) Revolut Business for SME banking and payments, and (6) credit products including personal loans and mortgages in select
    markets. Revenue is diversified across card interchange, FX margin, subscription fees, interest income, and wealth trading
    commissions. The company describes its mission as "simplifying all things money" and publicly targets 100 million daily
    active users across 100 countries.

    '
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
