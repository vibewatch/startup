- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer
  - Technology / Tool
  - Maturity
  - Purpose
  - Risk / Dependency
  rows:
  - - Cloud infrastructure
    - GCP (Google Cloud Platform)
    - Production
    - All compute, storage, networking; multi-region
    - Single-cloud vendor lock-in; GCP outage = platform outage
  - - Backend services
    - Kotlin / Java microservices
    - Production
    - Business logic for each product domain
    - JVM memory tuning required at scale; Kotlin expertise scarce
  - - Event streaming
    - Apache Kafka
    - Production
    - Async service-to-service communication; audit log
    - Kafka cluster management complexity at 15M+ TPS
  - - Container orchestration
    - Kubernetes (GKE)
    - Production
    - Auto-scaling, deployment, service mesh
    - GKE upgrade path dependency on GCP]
  - - Databases
    - PostgreSQL (per-microservice)
    - Production
    - Relational storage per bounded context
    - Schema migrations challenging at scale; no global transaction support
  - - AI/ML compute
    - 200 NVIDIA H100 GPUs
    - Production
    - Fraud detection, credit scoring, Gemini fine-tuning
    - High capex; NVIDIA supply availability; model drift risk
  - - LLM platform
    - Google Gemini via GCP AI Platform
    - Production (2024)
    - AI assistant, support automation, financial coaching
    - GCP API dependency; prompt injection risk
  - - Mobile
    - React Native (iOS + Android)
    - Production
    - Single cross-platform codebase
    - React Native performance ceiling for complex animations
  - - Payment rails
    - SWIFT, SEPA, Faster Payments, BACS, Open Banking
    - Production
    - International and domestic payment settlement
    - Regulatory changes to payment rails by central banks
  - - Security / compliance
    - PCI DSS Level 1, SOC 2 Type II, GDPR, PRA
    - Certified
    - Trust, compliance, data protection
    - Annual recertification cost; regulatory change velocity
