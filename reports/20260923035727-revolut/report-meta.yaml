  topStrengths:
    - Massive consumer and business distribution at 80M+ personal customers and 800K+ business customers
    - A $75B valuation backed by strong investor demand and continuing expansion into new banking markets
    - A diversified super-app spanning consumer banking, business banking, FX, investing, crypto, and insurance
    - High operating scale with 10k+ employees and broad geographic reach across 160+ countries and regions
  topRisks:
