companyProfile:
  summary: >-
    Revolut Group Holdings Ltd is a London-headquartered digital banking super-app founded in 2015 by Nik Storonsky and
    Vlad Yatsenko. It offers consumer banking, FX, investing, crypto, insurance, and a substantial SMB platform across
    160+ countries and regions. By September 2026 the company described itself as serving 80+ million personal customers
    and 800K+ business customers, while maintaining a $75B private valuation and 10k+ employees.
  foundedDate: '2015-07-01'
  founders:
    - name: Nik Storonsky
      role: CEO and co-founder
      background: >
        Former Deutsche Bank and Credit Suisse equity derivatives trader; primary strategic decision-maker, investor
        relationship holder, and controlling shareholder. Committed to no IPO before 2028.
    - name: Vlad Yatsenko
      role: CTO and co-founder
      background: >
        Former Deutsche Bank technologist; core architecture authority responsible for platform engineering, payment
        infrastructure, and fraud systems.
  foundingLocation: London, UK
  headquarters: London, UK (Canary Wharf)
  productSummary: >
    Revolut's product suite spans retail banking (IBAN accounts, debit cards, savings, overdraft), international FX and
    transfers (interbank rate), crypto trading (200+ assets, staking, DeFi), equity/commodity investing, subscription
    plans (Standard to Ultra at £0–45/mo), travel insurance, device protection, eSIM, and a full-featured business
    banking suite (expense management, multi-currency payroll, treasury). AI assistant handles 80% of customer support
    queries.
  customerFocus: >
    Retail: urban mobile-first consumers aged 18–40 in UK/EEA, frequent travellers, digital nomads, and crypto
    enthusiasts. Business: micro-businesses (freelancers/startups), SMEs, and mid-market enterprises in 40+ countries
    (767K+ business customers).
  businessModel: >
    Diversified revenue streams: card interchange (~35%), FX/transfer (~25%), wealth/crypto (~20%), subscriptions
    (~12%), and Revolut Business (~8%). Revenue protected by high switching costs in Business, subscription lock-in, and
    65% organic/referral customer acquisition. Post-banking-licence NIM (net interest margin) will add a fifth pillar.
  stage: late-stage private
  fundingStatus: >-
    Total primary capital raised is approximately $3.7B across seed through late-stage rounds. The latest disclosed
    valuation remains $75B from the 2025 share sale.
  disclosureProfile: private-disclosed
