figures:
- id: FU001
  type: flow
  title: Customer journey map
  subtitle: Revolut retail customer lifecycle from discovery to primary banking relationship
  approximationNotes: Journey stages are representative of the modal customer path based on product structure and activation
    pattern analysis. Individual journeys vary significantly.
  claimRefs: []
  data:
    nodes:
    - id: n1
      label: Discovery
      detail: Referral from friend (65% organic) / app store search / travel need / social media
    - id: n2
      label: Download & KYC (<5 min)
      detail: Biometric onboarding; virtual card issued immediately; GBP/EUR IBAN created
    - id: n3
      label: 'First use: Travel FX / P2P'
      detail: International travel or P2P payment; experience with interbank rate vs bank; habit formation
    - id: n4
      label: Recurring usage (secondary account)
      detail: Card used for travel and online spending; FX top-up; ~80% of users stay at this stage
    - id: n5
      label: Product expansion
      detail: "Crypto/stocks discovery \u2192 investment activation; subscription upgrade trigger; salary advance use"
    - id: n6
      label: Paid tier upgrade
      detail: "15\u201320% of users upgrade to Plus/Premium/Metal/Ultra; ARPU jumps to $150\u2013300/yr"
    - id: n7
      label: Primary banking relationship
      detail: Salary directed to Revolut (post-UK licence + FSCS); savings + lending + mortgage engaged
    edges:
    - from: n1
      to: n2
      label: Convert
    - from: n2
      to: n3
      label: First transaction
    - from: n3
      to: n4
      label: Repeat use
    - from: n4
      to: n5
      label: In-app discovery
    - from: n5
      to: n6
      label: Upgrade trigger
    - from: n6
