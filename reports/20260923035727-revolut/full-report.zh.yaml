chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Revolut Group Holdings Ltd（注册于英国）运营 Revolut 数字银行超级应用。该应用在 July 2015 以货币兑换和预付卡产品商业化上线。公司总部位于伦敦 Canary
              Wharf（2024 年从最初的 Shoreditch 办公室迁入），以私人有限公司形式注册，在英国、欧盟（Bank of Lithuania
              牌照）以及越来越多的国际辖区持有银行牌照或电子货币许可，包括澳大利亚、新加坡、墨西哥和哥伦比亚。截至 May 2026，Revolut 仍为非上市公司，2028 年前没有确认的 IPO 时间表。

              核心商业模式是一款金融超级应用，覆盖：(1) 消费者活期账户和借记卡，(2) 外汇和国际转账，(3) 财富产品，包括股票交易、加密货币交易所（Revolut X）、债券、ETF 和智能投顾，(4)
              产生经常性收入的订阅层级（Standard、Plus、Premium、Metal、Ultra），(5) 面向 SME 银行和支付的 Revolut Business，以及 (6)
              部分市场的个人贷款和抵押贷款等信贷产品。收入分散在卡组织交换费、FX 价差、订阅费、利息收入和财富交易佣金。公司把使命表述为「simplifying all things money」，并公开瞄准 100
              million 日活用户、覆盖 100 个国家。
