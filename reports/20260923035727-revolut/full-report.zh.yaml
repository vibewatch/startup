      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Nik Storonsky（CEO 兼联合创始人）是核心战略驱动力。他曾任 Deutsche Bank 和 Credit Suisse 股权衍生品交易员，创立 Revolut
              是为了解决跨境金融服务的不透明和高成本。他的集中角色带来明显的关键人依赖；公司围绕他的产品愿景和风险偏好搭建。他持有显著股权，并在 April 2026 公开表示 IPO「at least two years
              away」，意味着公司还会维持私人控制。

              Vlad Yatsenko（CTO 兼联合创始人）领导技术，也处在同等重要的战略位置。Victor Stinga（CFO）来自银行业，对 2024 年年度报告披露和 2025 年二级交易推动很大。Aberdeen
              Asset Management 创始人 Martin Gilbert（自 2021 年起担任非执行主席）负责董事会监督。董事会包括来自 SoftBank Vision Fund、TCV
              及其他主要机构股东的投资人代表。

              2024 年，Revolut 将全球总部迁至伦敦 Canary Wharf 的 One Canada Square，作为品牌升级的一部分。公司还设立 Barcelona
              TechHub，加深欧洲工程能力。Revolut 重投内部人才，2024 年收到 1.6 million 份求职申请，并创下员工留存纪录。员工数 2024 年同比增长 20%，全球超过 8,000 人。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: 融资历史、估值与投资人
        blocks:
          - type: paragraph
            body: >
              自成立以来，Revolut 完成了六轮一级市场股权融资，披露的新股资本约 $1.71 billion。公司在 April 2018 由 DST Global 领投的 $250 million Series C
              中达到 $1.7 billion 估值，跻身独角兽。July 2021，由 SoftBank Vision Fund 和 Tiger Global Management 领投的 $800 million
              Series E 将估值推至 $33 billion——当时为英国史上规模最大的私人科技融资轮。

              随后两次二级股份出售确定了当前估值基准。August 2024，一笔二级交易隐含 $45 billion 估值，为员工提供流动性，也吸引新机构兴趣。November 2025，Revolut 在
              Coatue、Greenoaks、Dragoneer 和 Fidelity Management & Research Company 领投的 $2 billion
              新股融资同时完成第五次员工股份出售，Andreessen Horowitz、Franklin Templeton、T. Rowe Price 和 NVentures（NVIDIA 的风险投资部门）参投。这笔交易把
              Revolut 估到 $75 billion，是欧洲私营科技公司有史以来最高隐含估值。$75 billion 基于二级交易定价，并非一级股权融资轮。

              Revolut 没有在集团层面募集与其规模相称的外部债务融资，不过其立陶宛银行子公司在监管资本规则下吸收客户存款。平台持有的客户余额在 2024 年底达到 $38 billion，同比增长
              66%，是信贷产品的关键负债和资金来源。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.4'
        title: 规模、指标与里程碑
        blocks:
          - type: paragraph
            body: >
              Revolut 披露 FY2024（截至 31 December 2024）收入 $4.0 billion，较 2023 年的 $2.2 billion 同比增长 72%。税前利润为 $1.4
              billion（YoY +149%），净利润 $1.0 billion（净利率
              26%），连续第四年盈利。收入多元化明显：卡支付（$887M）、财富（$647M）、FX（$540M）、订阅（$541M）和企业业务（$592M）都有实质贡献。2025 年，公司预计收入约 $6.0
              billion，其中 Revolut Business 到 November 2025 单独达到 $1 billion 年化收入。

              客户增长极强。Revolut 2024 年新增 14.5 million 零售用户，年底达到 52.5 million（YoY +38%）。到 November 2025，零售用户超过 65 million；到
              2025 年底，达到 68.3 million。企业客户 2024 年底约 490,000，2025 年底增至 767,000。2024 年全年处理交易量达到 $1.3 trillion，同比增长 52%。

              英国银行牌照是决定性里程碑：三年申请之后，Revolut 在 July 2024 获得 PRA/FCA 有条件（受限制）批准，进入带有存款上限的「mobilisation
              phase」。由于监管机构持续审视风险控制，mobilisation phase 超过通常的 12 个月。Revolut 在 March 2026 取得完整英国银行牌照。
            claimRefs:
              - CO016
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 盈利型超级应用，以 $75B 估值为锚
            body: >
              Revolut 同时具备 72% 收入增长、$1.4 billion 税前利润和 November 2025 的 $75 billion
              二级估值，使其跻身全球财务可信度最高的大型私营金融科技公司。连续四年盈利、收入 $4 billion，证明其单位经济模型可规模化；这在高增长数字银行中并不常见。完整英国银行牌照（March
              2026）打开无限额吸收存款以及抵押贷款 / 放贷产品，显著扩大可服务收入基础。
            calloutType: strength
            claimRefs:
              - CO014
              - CO016
          - type: callout
            title: 监管悬顶与合规负担
            body: >
              英国银行牌照的 mobilisation phase 持续 14+ 个月（超过典型 12 个月窗口），反映 PRA/FCA 对 Revolut 风险管理和 AML 控制的担忧持续存在。公司有可记录的 AML
              相关问题历史，包括立陶宛罚款和大量 FOS 投诉。随着 Revolut 扩展至银行产品（抵押贷款、无担保贷款），其 40+ 个辖区的监管审查会加强，带来实质运营和声誉风险。
            calloutType: risk
            claimRefs: []
          - type: callout
            title: Nik Storonsky 关键人集中
            body: >
              Revolut 的战略方向、产品哲学和 IPO 节奏都与 Nik Storonsky 的偏好紧密绑定。他在 April 2026 表示 IPO「at least two years
              away」，意味着公司继续保持私人状态，投资人流动性继续被锁住。高管离任或创始人信念松动，都可能实质扰动增长战略和二级市场定价。
            calloutType: risk
            claimRefs:
              - CO005
              - CO006
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Revolut 覆盖多个重叠市场，边界取决于从哪个产品视角切入。最窄定义是全球数字银行（没有实体网点的纯数字银行），多家研究机构估计其 2024 年总收入可服务市场为 $96–128 billion，预计
              2025 年达到 $200–210 billion，并可能以 40–55% CAGR 增长至 2033 年的 $4+
              trillion。估算差异很大，原因在于定义不同：窄口径排除跨境支付和财富产品；宽口径纳入所有数字优先金融服务。

              Revolut 的核心产品覆盖：(1) 零售活期账户和支付（替代传统网点银行），(2) 外汇和汇款（与 Wise、Western Union 及银行外汇交易台竞争），(3) 加密货币和股票交易（与
              Coinbase、Robinhood、eToro 竞争），(4) 订阅银行（与高端银行账户竞争），以及 (5) SME 银行（与 Tide、Starling Business 和既有银行 SME
              部门竞争）。这种多垂直版图让 Revolut 可以从同一客户身上捕捉多条收入流，形成复利式超级应用价值主张。

              Revolut 的替代品包括传统银行（HSBC、Barclays、NatWest、BNP Paribas）、挑战者银行（Monzo、Starling、N26）、垂直金融科技公司（FX 领域的 Wise、交易领域的
              eToro）和加密货币交易所。仅跨境支付市场，2023 年交易量就超过 $156 trillion，手续费对应每年数千亿美元级机会。
