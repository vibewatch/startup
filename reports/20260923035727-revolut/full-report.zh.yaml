  - id: FU001
    type: flow
    title: 客户旅程图
    subtitle: Revolut 零售客户从发现到建立主力银行关系的生命周期
    approximationNotes: 旅程阶段基于产品结构和激活模式分析，代表典型客户路径。个体旅程差异很大。
    claimRefs: []
    data:
      nodes:
        - id: n1
          label: 发现
          detail: 朋友推荐（65% 自然获客）/ 应用商店搜索 / 旅行需求 / 社交媒体
        - id: n2
          label: 下载与 KYC（<5 min）
          detail: 生物识别完成开户；立即发放虚拟卡；创建 GBP/EUR IBAN
        - id: n3
          label: 首次使用：旅行换汇 / P2P
          detail: 国际旅行或 P2P 支付；体验银行间汇率与银行报价差异；使用习惯开始养成
        - id: n4
          label: 持续使用（副账户）
          detail: 卡用于旅行和线上消费；换汇充值；约 80% 用户停留在此阶段
        - id: n5
          label: 产品扩展
          detail: 发现加密资产 / 股票 → 激活投资；触发订阅升级；使用工资预支
        - id: n6
          label: 付费等级升级
          detail: 15–20% 用户升级到 Plus/Premium/Metal/Ultra；ARPU 跃升至 $150–300/yr
        - id: n7
          label: 主力银行关系
          detail: 工资转入 Revolut（拿到英国银行牌照 + FSCS 之后）；储蓄 + 贷款 + 房贷开始启用
      edges:
        - from: n1
          to: n2
          label: 转化
        - from: n2
          to: n3
          label: 首笔交易
        - from: n3
          to: n4
          label: 重复使用
        - from: n4
          to: n5
          label: App 内发现
        - from: n5
          to: n6
          label: 升级触发
        - from: n6
          to: n7
          label: 信任 + FSCS 解锁
  - id: FR001
    type: matrix
    title: 风险热力图
    subtitle: Revolut 关键风险评估——发生概率、影响与缓释成熟度
    approximationNotes: 发生概率与影响评级基于截至 2026 年 5 月的公开证据作定性评估，并非官方风险模型。
