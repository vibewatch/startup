      - number: '4.2'
        title: 单位经济模型与成本结构
        blocks:
          - type: paragraph
            body: >
              Revolut 估计 65–72% 的毛利率，来自以软件交付为主的收入模型；卡处理成本、合作伙伴费用和交换费支出构成主要收入成本。人员成本是最大运营费用（全球 ~10,000+
              员工），工程、合规和客户运营投入显著。[CI011] [CI012]

              **获客成本**估计为 $20–50，显著低于传统银行 £200+ 的 CAC，驱动因素是 65% 有机 / 推荐获客。按平均 ARPU $75 计算，客户回本周期约 6–18 个月，视层级而定；高端层级缩短至
              3–6 个月。按 7-year LTV 模型和 20% 折现率估算，**客户终身价值**为标准用户每人 $300–600，高端用户每人 $1,500–3,000。[CI013] [CI014]

              FY2024 在 $4.0 billion 收入上实现 $1.4 billion 税前利润，意味着 35% 税前利润率——对这一阶段公司来说非常突出。相比之下，Monzo 税前利润率约
              ~1.7%，Starling 约 ~44%；Revolut 的轨迹显示，收入基础增长快于固定成本基础设施，仍有利润率扩张空间。FY2024 每名员工收入约 $400,000，员工约 ~10,000
              人，体现强运营杠杆。[CI015] [CI016]

              **净利息收入（NII）机会**：在 $38 billion 客户存款基础上，完整英国银行牌照让 Revolut 能按 Bank of England 基准利率部署这些存款。若基准利率为 4%（2026
              年初水平），存款理论 NII 可能每年增加 ~$500–800M（扣除资金成本和准备金要求），完全部署后相当于 15–20% 收入增量。[CI017] [CI018]
            claimRefs: []
      - number: '4.3'
        title: 资本结构与融资
        blocks:
          - type: paragraph
            body: >
              自 2015 年创立以来，Revolut 累计股权融资约 $1.8–2.0 billion。最近一轮是 August 2024 作为更大范围 $45B 二级交易一部分完成的 $2 billion
              新股融资，随后又在 November 2025 发生一次融资事件，把公司估值推至 $75 billion。公司未上市，因此不公开披露手头现金总额或具体资产负债表指标。[CI019] [CI020]

              作为英国监管银行实体（March 2026 之后），Revolut 必须遵守 PRA 资本充足要求，包括 CET1（Common Equity Tier
              1）最低标准。银行牌照施加监管资本比率，约束杠杆、提高合规成本，并要求持续压力测试。2024 年 $2 billion 新股融资，部分定位就是为银行实体补充资本并满足 PRA 要求。[CI021] [CI022]

              **烧钱速度**：Revolut 已盈利且现金流为正，传统创业公司烧钱问题基本消失。CEO 在 April 2026 表述的 IPO 意向（不早于 2028
              年）说明公司不依赖近期资本市场通道。剩余主要融资依赖，是银行牌照所需监管资本、放贷扩张后的信用准备金要求，以及潜在收购资金。[CI023] [CI024]
            claimRefs: []
      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              Revolut 的财务画像处在私营金融科技公司最强梯队：收入 $4.0 billion 且 YoY 增长 72%、税前利润率 35%，并在 FY2023 和 FY2024
              证明盈利能力，说明财务轨迹已实质去风险。多数收入流质量不错——卡组织交换费和订阅具备经常性；FX 由交易驱动但可预测。[CI025] [CI026]

              **关键财务风险**：第一，财富 / 加密货币收入（$800M，占总收入 20%）对市场敏感，若加密货币 / 股票进入熊市，可能下滑 30–50%，形成 $240–400M 收入暴露。第二，Revolut
              没有发布带标准分部披露的经审计 IFRS 或 GAAP 财务报表；所有收入结构估算都来自分析师对管理层评论和选择性披露的推导。第三，随着 Revolut Credit 和 Pay Later
              放量，信用损失准备会成为损益表中的实质项目；当前 NPL 比率或拨备覆盖率没有公开数据。第四，$38 billion 存款基础带来资金集中风险：若监管行动或声誉事件触发挤兑，可能需要紧急流动性。[CI027]
              [CI028] [CI029]

              **尽调阻断项**：完整经审计财务报表及分部级 P&L（公开不可得）、按队列年份划分的 LTV/CAC 数据、信贷组合指标（NPL、拨备率）、银行牌照下的 NII 模型，以及管理层对 FY2025/26
              收入结构从加密货币转向更稳定收入流的指引。[CI030]
            claimRefs: []
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >
              Revolut 是一款垂直整合的金融超级应用，让消费者和企业在一个应用内管理支出、储蓄、投资、货币兑换、借贷和支付。在消费者工作流中，客户下载应用，在 5 分钟内完成生物识别 KYC（Know Your
              Customer）流程，并立即获得一张虚拟 Mastercard/Visa 卡、GBP/EUR 活期账户，以及 36 种货币的多币种储蓄金库。核心日常使用流程是：通过银行转账或 Open Banking 入金 →
              用卡消费 → 查看实时交易分析 → 接收智能消费通知。[CE001] [CE002]

              除核心活期账户外，Revolut 的产品目录覆盖五个垂直领域：**Payments**（卡、银行转账、国际电汇、P2P、Open Banking）、**Wealth**（通过 Revolut X 提供 200+
              种资产的加密货币交易、股票 / ETF 交易、大宗商品）、**Savings**（利率与货币市场利率挂钩的灵活储蓄金库）、**Lending**（Revolut Credit、Buy Now Pay
              Later、透支）和 **Insurance**（旅行保险、设备保护、捆绑在订阅计划中的宠物保险）。[CE003] [CE004] [CE005]

              Revolut Business 产品为 SME 和企业复刻消费者应用，并增加多实体管理、批量付款、团队费用卡、基于 API 的薪资集成和多币种资金管理。平台服务 767,000+ 企业客户，产生 $1
              billion 年化收入。[CE006]
