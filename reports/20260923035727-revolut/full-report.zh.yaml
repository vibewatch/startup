      - number: '8.2'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              Revolut 的主要上市可比公司是 **Nubank（NU）**——这家巴西数字银行基于 $2.9B FY2023 收入约以 19x P/S 交易，在巴西、墨西哥和哥伦比亚拥有 100M+ 客户。Nubank
              的 P/S 倍数高度相关：两家公司都是高增长数字银行，产品套件多元、获客经济性强，并具备新兴市场可选性。按 19x FY2024 收入（$4.0B），Revolut 的 $75B 估值与 Nubank
              倍数持平；考虑 Revolut 更高收入增长率（72% vs Nubank 的 ~30%），这一估值看起来合理，但也折让了 Nubank 更大的客户基础和在拉美市场更长的深度经营记录。 [CV007]
              [CV008]

              **Wise（WISE.L）**约以 10x P/S 交易，但它是更聚焦的 FX 纯业务公司，收入增长更低（~25% YoY）；Wise
              较低倍数部分反映产品范围更窄和收入增长更低，并不必然意味着结构性金融科技折价。**Adyen** 约以 22x EV/Revenue 交易——其溢价来自企业支付基础设施模式、较高准入壁垒和 40%+ EBITDA
              利润率。Revolut 在 $4.0B 收入上实现 35% 税前利润率，比 PayPal（18% EBITDA 利润率）或 Block（15% 毛利率）更接近 Adyen。 [CV009] [CV010]

              **私人市场可比**：Stripe 最近一次披露估值为 $65B，对应约 $15B 收入（2023）——P/S 为 4.3x，显著低于 Revolut 的 19x。不过，Stripe
              主要是基础设施业务（支付网关、API 优先），不是消费银行，两者不能直接按 P/S 比较。Stripe 更有参考意义的数据点是，其 2021 年峰值估值 $95B 当时约代表 36x
              P/S——说明在有利市场中，高溢价金融科技倍数可以实现。 [CV011] [CV012]
            claimRefs: []
      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景分析
        blocks:
          - type: paragraph
            body: >
              **乐观情景（2028 IPO 时 $105–144B）**：Revolut 维持 35–40% 收入 CAGR，FY2027E 收入达 $7–8B；英国银行牌照转化推动付费层渗透率超过
              25%；加密/财富收入在持续或温和偏牛的加密环境中保持高于 FY2024 水平；FCA 和 ECB 监管记录干净；IPO 按 15–18x FY2027E 收入定价。在此情景下，以 $75B 进入的投资者 3 年
              MOIC 为 1.4–1.9x（扣费前 IRR 约 13–24%）。 [CV013] [CV014]

              **基准情景（2028 IPO 时 $75–100B）**：Revolut 收入以 25–30% CAGR 增长，FY2027E 达 $6–7B；付费层转化温和改善；加密/财富收入从 FY2024
              牛市水平正常化为持平/温和增长；英国银行牌照落地且无重大不利监管事件；IPO 按 14–15x FY2027E 收入 定价。在此情景下，以 $75B 进入的投资者 3 年 MOIC 为 1.0–1.3x（IRR
              0–10%）。 [CV015]

              **悲观情景（$40–55B，无 2028 IPO 或 IPO 低于进入价）**：重大 FCA 执法行动限制开户或施加同意令；加密收入 在熊市中收缩 50%+，总收入 CAGR 仅
              10–15%；主账户转化未能大规模兑现；IPO 推迟至 2029–2030 年，或基于更低收入基数按 12–13x 前瞻收入发生。在此情景下，以 $75B 进入的投资者面临 0.5–0.75x MOIC（价值毁损
              25–50%）。 [CV016] [CV017]

              **概率加权隐含公允价值**：给乐观情景 25% 概率、基准情景 55%、悲观情景 20%，2028 年概率加权估值结果约为 $78–90B——仅略高于当前 $75B 进入价。这意味着在当前 $75B
              估值下安全边际有限；这笔投资适合高度相信监管记录和主账户转化逻辑的投资者，不适合追求宽安全边际的人。 [CV018] [CV019]
            claimRefs: []
      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              Revolut 的 **IPO 准备度**正在提升：CEO Nik Storonsky 于 2026 年 4 月确认，IPO 目标“不早于 2028 年”，偏好在美国上市（NASDAQ 或
              NYSE）。银行牌照在多个维度都是 IPO 前提：FSCS 覆盖降低股权投资者对客户风险的担忧，Pillar 3 披露 提高财务透明度，获牌后的审计意见让账目更可信。Goldman Sachs、Morgan
              Stanley 和 J.P. Morgan 据报已开始为 IPO 承销委任早期建立关系。 [CV020] [CV021]

              **稀释与优先权悬置**：Revolut 股权结构表包括 SoftBank Vision Fund（2021 年 $800M 轮、估值 $33B 的领投方），这类投资人通常持有带清算优先权的参与型优先股。按
              $75B 估值，早期轮次多数优先权结构已明显价内；不过，投资者应确认 2021–2024 轮次中的任何 IPO 棘轮条款或 MFN 条款，不会形成不利于后期二级买家的优先 IPO 配售结构。 [CV022]
              [CV023]

              **支撑 $75B 价格的公开证据**：该价格得到三点支撑：(1) Coatue/Greenoaks/Dragoneer/a16z/Fidelity/NVentures 联合体
              以该水平完成二级交易——这是一组成熟的跨界投资者，兼具公开和私人市场纪律；(2) FY2024 财务数据显示 $4.0B 收入和 $1.4B 税前利润，可从基本面独立支撑 $50–80B 估值；以及 (3)
              金融科技同行估值表明这一倍数并非结构性不理性。 [CV024] [CV025]

              **建议最终尽调问题**：(1) 银行牌照获批后所有 FCA/PRA 往来函件；(2) FY2024 经审计账目（约 2026 年 8 月起可通过 Companies House 获取）；(3) Q1 2026
              管理账，显示获银行牌照后的收入结构；(4) Consumer Duty 落地计划和时间表；(5) CCO 出具的 AML 合规证明；(6) 股权结构表和优先股堆叠细节；(7) GCP 合同条款和 DR
              计划；(8) 消费贷款 NPL 数据（1–12 个月账簿）；(9) 加密 CASP 授权申请状态；(10) CFO/CCO 留任承诺和股权头寸。 [CV026]
            claimRefs: []
