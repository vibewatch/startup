companyProfile:
  summary: >-
    Revolut Group Holdings Ltd 是一家总部位于伦敦的数字银行超级应用，2015 年由 Nik Storonsky 和 Vlad Yatsenko 创立。公司提供消费者银行、FX、投资、加密货币、保险，以及覆盖
    160+ 个国家和地区的大型 SMB 平台。到 September 2026，公司称已服务 80+ million 名个人客户和 800K+ 企业客户，同时维持 $75B 非上市估值和 10k+ 员工规模。
  foundedDate: '2015-07-01'
  founders:
    - name: Nik Storonsky
      role: CEO 兼联合创始人
      background: |
        曾任 Deutsche Bank 和 Credit Suisse 股权衍生品交易员；主要战略决策者、投资者关系负责人和控股股东。承诺 2028 年前不 IPO。
    - name: Vlad Yatsenko
      role: CTO 兼联合创始人
      background: |
        曾任 Deutsche Bank 技术专家；负责平台工程、支付基础设施和欺诈系统的核心架构。
  foundingLocation: London, UK
  headquarters: London, UK (Canary Wharf)
  productSummary: >
    Revolut 的产品套件覆盖零售银行（IBAN 账户、借记卡、储蓄、透支）、国际 FX 和转账（银行间汇率）、加密货币交易（200+ 种资产、质押、DeFi）、股票 / 大宗商品投资、订阅计划（Standard 至
    Ultra，£0–45/mo）、旅行保险、设备保护、eSIM，以及完整的企业银行套件（费用管理、多币种薪资、资金管理）。AI 助手处理 80% 的客服查询。
  customerFocus: |
    零售：英国 / EEA 18–40 岁、移动优先的城市消费者，常旅客、数字游民和加密货币爱好者。企业：40+ 个国家的微型企业（自由职业者 / 创业公司）、SME 和中端市场企业（767K+ 企业客户）。
