            - 中
            - 严重（20% 收入面临风险）
            - 低（市场风险，非监管风险）
            - 低（缺少自然对冲）
        - label: GCP 单一云中断
          values:
            - 低
            - 中（中断期间收入流失）
            - 高（FCA 通报；Consumer Duty）
            - 中
        - label: AI 冻结账户误判
          values:
