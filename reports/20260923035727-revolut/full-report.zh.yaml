        - 中（ISO 27001；漏洞赏金；渗透测试；专职 SOC）
        - 泄露后的声誉损害可能让客户流失加速 5–15%
        - 2022 年泄露复盘未完全公开；SOC 成熟度未经外部验证
      - - 运营扩张失败——快速增员导致合规断裂
