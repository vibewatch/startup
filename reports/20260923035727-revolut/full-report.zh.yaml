            - 高（Consumer Duty 违规风险）
            - 低
        - label: 网络安全泄露
          values:
            - 中
            - 高（ICO 罚款 + 用户流失）
            - 严重（FCA 执法）
            - 中
        - label: CEO 关键人物风险
          values:
            - 低
            - 高（估值 + IPO 时间表）
            - 中（监管关系）
            - 低
        - label: Visa/Mastercard 卡组织终止
          values:
