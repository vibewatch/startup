          value: 250
          detail: 英国银行牌照、按揭和透支可能在 FY2026 开始贡献
  - id: FE001
    type: flow
    title: 产品架构图
    subtitle: Revolut 从客户应用到支付轨道的分层技术架构
    approximationNotes: 架构根据工程博客、招聘信息和开发者文档重建。具体实现细节未公开披露。
    claimRefs: []
    data:
      nodes:
        - id: n1
          label: 客户应用（iOS / Android / Web）
          detail: React Native 移动端；React web；单一代码库；52.5M 用户
        - id: n2
          label: API 网关 / BFF
          detail: 前端后端（BFF）；限流；认证（OAuth 2.0 / JWT）；GraphQL + REST
        - id: n3
          label: 核心微服务（GCP 上的 Kotlin/Java）
          detail: 卡、外汇、加密货币、贷款、企业、储蓄、通知——独立集群
        - id: n4
          label: Kafka 事件总线
          detail: 异步通信；审计轨迹；事件溯源；15M+ 笔交易 / 日
        - id: n5
          label: PostgreSQL 数据库（按服务）
          detail: 每个微服务一个有界上下文；schema 独立演进
        - id: n6
          label: AI/ML 层（200 块 H100 GPU）
          detail: 欺诈检测；信用评分；Gemini LLM（AI 助手）；推荐引擎
        - id: n7
          label: 支付轨道
          detail: SWIFT、SEPA、Faster Payments、BACS、Mastercard、Visa、Open Banking PSD2（开放银行）
        - id: n8
