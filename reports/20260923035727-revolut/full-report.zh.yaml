      - number: '2.2'
        title: 市场规模 — TAM、SAM、SOM
        blocks:
          - type: paragraph
            body: >
              TAM（Total Addressable Market，总可用市场）：Revolut 的合并 TAM 横跨数字银行（$96–210B）、跨境支付（$100B+ 收入池）和财富 / 加密货币（$80B+
              费用池）。从自下而上视角看，OECD 市场约 1.4 billion 有银行账户成年人，乘以每名成年人每年 $500–600 的金融服务支出，得出高端金融服务理论 TAM 为
              $700B–$840B。Revolut 的目标是在其市场中拿下约 10%。

              SAM（Serviceable Addressable Market，可服务市场）：Revolut 的 SAM 主要是西欧、英国，以及其持有或正在申请银行牌照的新兴市场通道。欧洲约有 450 million
              成年人，数字银行采用率在 2024 年约 25–30%（2021 年约 ~15%）。按支付、FX 和信贷产品上的用户支出估算，欧洲数字银行年收入池约 $30–50 billion。把 Revolut
              已拿到早期牌照的美国、LATAM 和 APAC 通道（墨西哥、哥伦比亚、新加坡、澳大利亚）加入后，SAM 扩至 ~$120–180B。

              SOM（Serviceable Obtainable Market，可获取市场）：凭借 68.3 million 客户和 2025 年 $4 billion 收入，Revolut 已在核心市场拿下约 2–5% 的
              SAM。公司扩张 SOM 的主要机制，是在新地区取得银行牌照，同时提升高端订阅增购并上线信贷产品。最重要的 SOM 扩张机会，是完整英国银行业务（抵押贷款、透支、储蓄账户已自 March 2026
              起完整获牌）以及仍处获客早期的美国市场。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >
              Revolut 的客户基础跨越多个队列，需求和经济性各不相同。最大分层是 18–40 岁、数字原生的城市成年人；他们看重低 FX
              费用的旅行和汇款、即时卡到卡转账，以及单一应用里的整合财务管理。这个群体高度流动（频繁跨国、多币种需求），是核心增长引擎。

              第二类是懂金融的投资 / 储蓄用户（主要是 Premium 和 Metal 计划订阅者），他们用 Revolut 做加密货币、股票交易、储蓄账户和智能投顾。该分层 ARPU 比标准 / 免费层高
              4–6x，也是财富收入 FY2024 同比增长 298% 的主要来源。

              第三类是 Revolut Business——需要多币种企业账户、费用管理、薪资和 B2B 支付的 SME、创业公司和自由职业者。到 2025 年底，该分层拥有 767,000 企业客户，贡献集团收入约
              ~15%，同比增长 56%，是下一条主要增长向量。B2B 银行 ARPU 显著高于零售。

              从地域看，西欧（英国、法国、爱尔兰、西班牙、德国、立陶宛）主导客户基础；法国、意大利、西班牙和北欧在 2024 年增速最快。2024 年，Revolut 在 19 个国家的金融类下载排名第 #1，在 26
              个国家进入前三。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >
              关键增长驱动：(1) 全球 millennials 和 Gen Z 向移动优先银行长期迁移，OECD 市场银行网点访问量逐年下滑。(2) 旅客和移民承担的传统 FX 成本长期偏高——银行平均收取
              2–4%，Revolut 费率低于 1%——强化推荐动机。(3) 加密货币采用周期：受 Bitcoin、Ethereum 价格上涨和新产品推出驱动，Revolut 2024 年加密货币收入同比增长
              298%。(4) 英国和欧盟银行牌照扩展，允许完整吸收存款和放贷，打开净利息收入与抵押贷款收入流。(5) 带着银行授权进入 10+ 个新市场。

              关键约束：(1) 信任与监管合规：传统银行切换率仍低（英国年切换率 10–15%），因为多数客户把主账户留在既有银行。Revolut 的副卡 / 第二银行定位限制了平均存款余额和 ARPU。(2)
              监管升级：每进入一个新辖区，都要投入资本、搭建本地合规并维护监管关系。(3) 信用风险：进入放贷后，Revolut 暴露在信用损失下；经济下行时违约率可能实质压低利润率。(4)
              加密货币监管：MiCA（欧盟）、FCA 加密货币规则和全球监管分化带来合规成本与产品限制风险。(5) 既有超级应用竞争：Apple Pay、Google Pay 和大型银行应用正扩展金融功能，威胁 Revolut
              的入口。
            claimRefs:
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 多垂直 TAM 推动 ARPU 复合增长
            body: >
              Revolut 能从单一 FX 工具扩展为多垂直金融超级应用（银行、财富、加密货币、SME），显著抬高单客收入。FY2024 财富收入增长 298%，说明新产品被采用后，平台可以从同一用户基础提取高得多的
              ARPU。完整英国银行牌照通过净利息收入、抵押贷款和透支继续打开 ARPU 增长；在高利率环境中，这些产品的单位经济性很强。
            calloutType: strength
            claimRefs:
              - CM016
          - type: callout
            title: 主账户银行地位缺口限制长期收入天花板
            body: >
              对 68 million 客户中的多数人来说，Revolut 仍是第二银行——也就是说，多数用户不把薪资入账导向 Revolut，限制了单客平均余额。英国传统银行年切换率只有
              10–15%，既有银行通过薪资发放、抵押贷款和直接借记惯性留住主银行关系。除非 Revolut 赢得有实质意义的主账户银行地位，否则其存款基础和净利息收入潜力会长期低于既有银行同业。
            calloutType: risk
            claimRefs: []
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Revolut
              同时面对五类竞争者。**直接数字银行同业**（Monzo、Starling、N26、Bunq）在欧洲市场争夺零售存款、活期账户和日常银行使用。**拉美规模数字银行**（Nubank）拥有全球最大的数字银行客户基础，但与
              Revolut 的地域重叠很少。**FX 和转账专家**（Wise）在 Revolut
              最初也是最高频的用例——国际汇款——上竞争，模式透明且低成本。**相邻支付既有玩家**（PayPal/Venmo）争夺线上结账和 P2P
              支付流量。**传统银行既有玩家**（Barclays、HSBC、Lloyds、Santander）仍占据英国活期账户多数份额，但在 35 岁以下人群中正输给数字银行。[CP001] [CP002] [CP003]
              [CP004]

              一个关键结构性动态是**多栖持有常态**：约 35% 的英国数字银行客户同时持有多个数字银行账户 [CP022]，这意味着不同竞争者的客户数并不互斥。Revolut 的 52.5 million
              客户中，有相当一部分也持有 Monzo 账户，因此真正的战场是主账户地位——以工资直接入账为证据。大型科技威胁已经明显退潮：Apple 在 January 2025 宣布逐步关闭 Apple
              Card（Goldman Sachs 合作）和 Apple Savings；The Economist 在 February 2025 认为，大型科技系统性冲击银行业的风险已经显著下降。[CP017]
              [CP034]
