      - - IPO 路径
        - 2028 年 NASDAQ/NYSE IPO；Goldman/MS/JPM 关系；银行牌照提升可信度
        - 监管风险将 IPO 推迟至 2029–2030 年；财务数据更完整后，公开市场重估至 12–14x
