            - 高（EU 执法风险）
            - 中
        - label: 信贷损失恶化
          values:
            - 中
            - 高（拨备 + 资本消耗）
            - 高（PRA CET1 违规风险）
            - 低（跨周期数据有限）
  - id: FV001
    type: flow
    title: 投资建议逻辑
    subtitle: Revolut $75B 私有市场估值下的投资决策框架
    approximationNotes: 决策树仅作示意，基于本尽调报告识别的关键风险与回报因素。
    claimRefs: []
    data:
      nodes:
        - id: f1
          label: 进入估值：$75B（2025 年 11 月）
          detail: FY2024 收入的 19x；税前利润的 54x；英国银行牌照落地后
        - id: f2
          label: 关键问题：$75B 是否站得住？
          detail: 检验项：同业倍数、收入增长可持续性、监管风险
        - id: f3
          label: Nubank/Adyen 同业区间：19–22x
          detail: 按增长调整后的同业倍数区间支撑 $75B 入场
        - id: f4
          label: FY2024 基本面：$4B 收入，$1.4B 利润
          detail: 税前利润率 35%；同比增长 72%；两者支撑 $50–80B 内在估值区间
        - id: f5
          label: 监管风险：FCA 银行牌照
          detail: 已获无附加条件牌照；AML 历史问题仍有尾部风险；Consumer Duty 持续约束
        - id: f6
          label: 有条件买入
          detail: 若监管记录守得住、主账户转化继续推进——$65–75B 可买入
        - id: f7
          label: 持有 / 放弃
          detail: 若 FCA 执法落地，或加密资产收入下滑 >50%——等待 $45–55B 再入场
        - id: f8
          label: IPO 目标：2028 年 NASDAQ/NYSE
          detail: 基准情形：IPO 时 $75–100B；乐观情形：$110–150B；悲观情形：$40–55B
      edges:
        - from: f1
          to: f2
          label: 评估
        - from: f2
          to: f3
          label: 同业倍数检查
        - from: f2
          to: f4
          label: 基本面检查
        - from: f2
          to: f5
          label: 风险检查
        - from: f3
          to: f6
          label: 倍数站得住
        - from: f4
          to: f6
          label: 基本面支撑入场
        - from: f5
          to: f6
          label: 监管风险可控
        - from: f5
          to: f7
          label: 执法行动 / 监管不利
        - from: f6
          to: f8
          label: 持有至 IPO
