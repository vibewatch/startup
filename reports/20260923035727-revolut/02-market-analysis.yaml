- id: s2
  title: "Market Sizing \u2014 TAM, SAM, SOM"
  body: "TAM (Total Addressable Market): Revolut's combined TAM spans neobanking ($96\u2013210B), cross-border payments ($100B+\
    \ revenue pool), and wealth/crypto ($80B+ fee pool). Using a bottom-up lens, the global banked population of approximately\
    \ 1.4 billion adults in OECD markets multiplied by an annual financial services spend per adult of $500\u2013600 yields\
    \ a theoretical TAM of $700B\u2013$840B for premium financial services. Revolut targets approximately 10% of that pool\
    \ across its markets.\nSAM (Serviceable Addressable Market): Revolut's SAM is primarily Western Europe, the UK, and emerging-market\
    \ corridors where it holds or is pursuing banking licences. Europe has approximately 450 million adults, with neobank\
    \ adoption at roughly 25\u201330% in 2024 (up from ~15% in 2021). The European neobanking revenue pool is estimated at\
    \ $30\u201350 billion annually based on user spend across payments, FX, and lending products. Adding the US, LATAM, and\
    \ APAC corridors where Revolut holds early licences (Mexico, Colombia, Singapore, Australia) extends the SAM to ~$120\u2013\
    180B.\nSOM (Serviceable Obtainable Market): With 68.3 million customers and $4 billion in revenue in 2025, Revolut has\
    \ captured approximately 2\u20135% of its SAM in core markets. The company's strategy of banking licences in new geographies,\
    \ combined with premium subscription upsell and lending product launches, is its primary mechanism to expand SOM. The\
    \ most material SOM expansion opportunity is full UK banking (mortgages, overdrafts, savings accounts now fully licensed\
    \ from March 2026) and the US market where customer acquisition is nascent.\n"
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
- id: s3
  title: Buyer and User Segmentation
  body: "Revolut's customer base spans multiple cohorts with distinct needs and economics. The largest segment is digitally-native\
    \ urban adults aged 18\u201340, who value low FX fees for travel and remittances, instant card-to-card transfers, and\
    \ consolidated financial management in a single app. This segment is highly mobile (frequent country changes, multi-currency\
    \ needs) and serves as the core growth engine.\nA second segment comprises the financially savvy investor/saver cohort\
    \ (primarily Premium and Metal plan subscribers) who use Revolut for crypto, stock trading, savings accounts, and robo-advisory.\
    \ This segment delivers 4\u20136x higher ARPU than the standard/free tier and is responsible for the disproportionate\
    \ wealth revenue growth (298% YoY in FY2024).\nThe third segment is Revolut Business \u2014 SMEs, startups, and freelancers\
    \ needing multi-currency corporate accounts, expense management, payroll, and B2B payments. With 767,000 business customers\
    \ at end-2025, contributing ~15% of group revenue, this segment is growing 56% YoY and represents the next major growth\
    \ vector. B2B banking ARPU is materially higher than retail.\nGeographically, Western Europe (UK, France, Ireland, Spain,\
    \ Germany, Lithuania) dominates the customer base, with France, Italy, Spain, and the Nordics showing the fastest growth\
    \ in 2024. Revolut ranked #1 in the finance category by downloads in 19 countries in 2024 and top-3 in 26.\n"
  claimRefs:
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
- id: s4
  title: Growth Drivers and Constraints
  body: "Key growth drivers: (1) Secular shift to mobile-first banking among millennials and Gen Z globally, with bank branch\
    \ visits declining year-on-year across OECD markets. (2) Persistent high cost of traditional FX for travelers and migrants\
    \ \u2014 banks charge 2\u20134% on average versus Revolut's sub-1% rates \u2014 creating strong referral motivation. (3)\
    \ Crypto adoption cycles: Revolut's crypto revenue grew 298% YoY in 2024, driven by Bitcoin and Ethereum price appreciation\
    \ and new product launches. (4) Expanded UK and EU banking licences enabling full deposit-taking and lending, unlocking\
    \ net interest income and mortgage revenue streams. (5) International expansion into 10+ new markets with banking authorisations.\n\
    Key constraints: (1) Trust and regulatory compliance: Traditional bank switching remains low (10\u201315% annual switching\
    \ rate in the UK) because most customers maintain primary bank accounts at incumbents. Revolut's secondary-bank positioning\
    \ limits average deposit balances and ARPU. (2) Regulatory escalation: Each new jurisdiction requires capital investment,\
    \ local compliance build-out, and regulatory relationship management. (3) Credit risk: Moving into lending exposes Revolut\
    \ to credit losses; default rates in an economic downturn could materially impair margins. (4) Crypto regulation: MiCA\
    \ (EU), FCA crypto rules, and global regulatory divergence create compliance cost and product restriction risk. (5) Competition\
    \ from incumbent super-apps: Apple Pay, Google Pay, and major bank apps are expanding financial features, threatening\
    \ Revolut's entry points.\n"
  claimRefs:
  - CM015
  - CM016
