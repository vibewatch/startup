company:
  name: Revolut
chapter:
  number: 2
  title: Market Analysis
  summary: "Revolut operates at the intersection of neobanking, cross-border payments, wealth management, and business financial\
    \ services \u2014 a combined addressable opportunity exceeding $500 billion globally by broader definitions. The global\
    \ neobanking TAM was estimated at approximately $96\u2013128 billion in 2024, growing at a 30\u201355% CAGR, driven by\
    \ mobile-first demographics, underserved banking needs, and product expansion into lending and investment. Revolut's SAM\
    \ is concentrated in Europe, the UK, and high-migration corridors, where it is the #1 neobank by valuation and a leading\
    \ contender for primary banking status.\n"
sections:
- id: s1
  title: Market Boundary and Definitions
  body: "Revolut addresses multiple overlapping markets depending on the product lens applied. The narrowest definition \u2014\
    \ global neobanking (digital-only banks with no physical branch network) \u2014 is estimated by multiple research firms\
    \ at $96\u2013128 billion in total revenue addressable market in 2024, with projections of $200\u2013210 billion by 2025\
    \ and potential growth to $4+ trillion by 2033 at 40\u201355% CAGR. The wide variance in estimates reflects differing\
    \ definitions: narrower views exclude cross-border payments and wealth products; broader definitions encompass all digital-first\
    \ financial services.\nRevolut's core products span: (1) retail current accounts and payments (substituting traditional\
    \ high-street banking), (2) foreign exchange and remittances (competing with Wise, Western Union, and bank FX desks),\
    \ (3) crypto and stock trading (competing with Coinbase, Robinhood, eToro), (4) subscription banking (competing with premium\
    \ bank accounts), and (5) SME banking (competing with Tide, Starling Business, and incumbent bank SME units). This multi-vertical\
    \ footprint allows Revolut to capture multiple revenue streams from the same customer, creating a compounding super-app\
    \ value proposition.\nSubstitutes to Revolut include traditional banks (HSBC, Barclays, NatWest, BNP Paribas), challenger\
    \ banks (Monzo, Starling, N26), specialist fintechs (Wise for FX, eToro for trading), and crypto exchanges. The total\
    \ cross-border payments market alone exceeded $156 trillion in volume in 2023, with fees representing a multi-hundred-billion-dollar\
    \ annual opportunity.\n"
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM001
  - TM002
  - TM003
  figureRefs:
