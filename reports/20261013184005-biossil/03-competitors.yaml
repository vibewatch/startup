figures:
  - id: FP001
    title: "Competitive positioning: starting clinical maturity versus control of execution"
    type: quadrant
    summary: >-
      Ordinal placement shows how solution classes differ in starting evidence and downstream
      control; it is not a quantitative performance ranking.
    data:
      points:
        - label: Biossil
          x: 4
          y: 4
          detail: Buys or licenses failed clinical assets and assumes development responsibility.
        - label: Incumbent internal redevelopment
          x: 5
          y: 5
          detail: Begins with proprietary asset history and controls the internal development path.
        - label: External rescue specialist
          x: 4
          y: 3
          detail: Clinical maturity may be high, while control depends on transaction structure.
        - label: De novo AI discovery
          x: 1
          y: 3
          detail: Starts earlier in the molecule lifecycle and addresses a different discovery problem.
        - label: Academic or hospital repurposing
          x: 2
          y: 2
          detail: Clinical insight may be deep, but asset rights and commercialization control vary.
        - label: Abandonment or no restart
          x: 1
          y: 1
          detail: No new development path is funded or controlled.
    approximationNotes: >-
      Analyst-assigned ordinal scores from 1 (low) to 5 (high), based only on the workflow and
      control attributes described in the assigned sources; the coordinates are not measured
      company metrics, and named-peer data are unavailable.
    claimRefs: [CP007, CP008, CP009, CP010, CP012, CP015]
