    title: Valuation does not establish competitive proof
    body: >-
      The reported US$1 billion valuation reflects investor conviction, but assigned evidence
      does not show a marketed product, comparative approval rate, or head-to-head clinical outcome.
    claimRefs: [CP007, CP008, CP012]
  - calloutType: insight
    title: The potential lock-in is the asset and evidence package
    body: >-
      Biossil's defensibility is more likely to come from molecule rights, accumulated clinical
      learning, and trial execution than from exclusive access to broadly available language models.
    claimRefs: [CP003, CP006, CP010, CP011]
