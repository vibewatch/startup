  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: monetization
      missingEvidence: >-
        Executed asset purchase and licensing agreements showing upfront payments, milestones,
        royalties, exclusivity, territorial rights, and realized licensing revenue.
      whyItMatters: >-
        Without transaction economics, investors cannot compare Biossil's sourcing advantage,
        gross value capture, switching cost, or susceptibility to bidding pressure.
      diligencePath: >-
        Review the complete contract schedule, reconcile it to cash receipts and obligations,
        and benchmark terms against comparable failed-asset transactions.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: competitive-data-gaps
      missingEvidence: >-
        An independent cohort comparing Biossil-selected assets with internal pharma,
        conventional repurposing, and de novo AI programs on trial progression and approval outcomes.
      whyItMatters: >-
        Clinical conversion is the core test of whether the selection and redesign process is
        differentiated rather than a capitalized restatement of ordinary drug repurposing.
