callouts:
  - calloutType: "insight"
    title: "The Second-Chance Chemistry Strategy"
    body: "Biossil differentiates from traditional AI drug discovery by bypassing de novo molecular generation. Instead of synthesizing unproven chemical entities, it acquires de-risked molecules with established safety data that failed efficacy endpoints in prior indications, compressing early development timelines and lowering biological toxicity risks."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
  - calloutType: "risk"
    title: "Clinical Translation and Data Disclosure Gap"
    body: "While LLMs and multiomics endotyping accelerate molecule diligence by an estimated 70% to 80%, algorithmic identification cannot alter human biology. Biossil has not disclosed trial timelines, primary endpoints, or peer-reviewed algorithmic benchmarks for its active programs, leaving pipeline efficacy unverified."
    claimRefs:
      - "CE005"
