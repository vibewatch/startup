companyProfile:
  summary: Biossil is a Toronto-based clinical-stage biopharmaceutical company that uses its Excavate platform to identify and revive shelved drug candidates with large language models, multiomics analysis, and patient-subpopulation matching. The company acquires or licenses abandoned molecules, advances them through new clinical programs, and monetizes through licensing, milestones, and eventual commercial drug rights rather than SaaS subscriptions.
