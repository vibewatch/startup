evidenceGaps:
  - type: missing-source
    severity: material
    topic: commercial-revenue-and-burn
    missingEvidence: Audited recurring licensing revenues, upfront asset milestone receipts, and net operational cash burn rates.
    whyItMatters: >-
      While Biossil has confirmed milestone-based cash revenues, private disclosure prevents validating unit economics
      or measuring runway sustainability against the US$153M Series A.
    diligencePath: >-
      Request audited financial statements, historical milestone receipts, and projected clinical trial burn model
      during management diligence sessions.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: headcount-tracking
    missingEvidence: >-
      Reconciliation of operational headcount between Tracxn's tracked 5 employees, BetaKit's 30 employees, and
      directory estimates.
    whyItMatters: Headcount estimates inform corporate burn and development capacity across the 12 acquired pipeline programs.
    diligencePath: >-
      Request current organizational chart and payroll census verifying full-time clinical and software engineering
      staff.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing-dollar-value
    missingEvidence: >-
      Third-party market research estimates quantifying the annual transaction volume and dollar value of secondary
      pharmaceutical asset acquisitions.
    whyItMatters: >-
      Without independent transaction volume data, the total market sizing for abandoned molecule acquisition relies on
      top-down clinical attrition percentages rather than transacted dollar volume.
    diligencePath: >-
      Acquire specialized life science transaction databases (such as EvaluatePharma or Biomedtracker) covering
      historical Phase 1 and Phase 2 asset divestitures.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: monetization
    missingEvidence: >-
      Executed asset purchase and licensing agreements showing upfront payments, milestones, royalties, exclusivity,
      territorial rights, and realized licensing revenue.
    whyItMatters: >-
      Without transaction economics, investors cannot compare Biossil's sourcing advantage, gross value capture,
      switching cost, or susceptibility to bidding pressure.
    diligencePath: >-
      Review the complete contract schedule, reconcile it to cash receipts and obligations, and benchmark terms against
      comparable failed-asset transactions.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-data-gaps
    missingEvidence: >-
      An independent cohort comparing Biossil-selected assets with internal pharma, conventional repurposing, and de
      novo AI programs on trial progression and approval outcomes.
    whyItMatters: >-
      Clinical conversion is the core test of whether the selection and redesign process is differentiated rather than a
      capitalized restatement of ordinary drug repurposing.
    diligencePath: >-
      Obtain program-level stage histories, endpoints, discontinued programs, and regulator outcomes, then commission an
      independent matched-cohort analysis.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: >-
      Audited monthly operating cash burn, net clinical trial expenditure schedules, and cash balance figures
      post-September 2026 financing.
    whyItMatters: >-
      Without verified cash burn rates across its 12 molecule trials, underwriting forward capital adequacy and the
      timeline to the next dilutive financing round relies solely on gross capital raised rather than net burn.
    diligencePath: >-
      Request confidential management accounts, trial site payment schedules, and forward 24-month operating budget
      during Phase II data room review.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: realized-licensing-revenue
    missingEvidence: >-
      Disclosed dollar values of upfront license fees, recurring tech access fees, and commercial milestone payment
      terms from pharma partner agreements.
    whyItMatters: >-
      While management confirms cash and milestone-based revenue from licensing agreements, the absence of public
      financial statements prevents verifying revenue predictability, margin contribution, or partner concentration.
    diligencePath: Review redacted partner collaboration agreements and royalty schedules under bilateral NDA.
    relatedQuestionRefs:
      - QI001
  - type: private-evidence-only
    severity: material
    topic: clinical-endpoints-and-trial-data
    missingEvidence: >-
      Public disclosure of Phase 2/3 primary endpoints, trial registry identifiers (NCT numbers), patient cohort sizing,
      and readout timelines for Biossil's active programs.
    whyItMatters: >-
      Without registered trial protocols and objective efficacy endpoints, underwriting cannot evaluate whether
      Biossil's repurposed molecules demonstrate statistical significance in human clinical trials or merely replicate
      historical failure rates.
    diligencePath: >-
      Request confidential clinical investigator brochures, FDA/Health Canada investigational new drug (IND)
      correspondence, and study protocols under non-disclosure agreement.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: minor
    topic: developer-signal-and-technical-documentation
    missingEvidence: >-
      Public developer artifacts, open-source repositories, API documentation, or peer-reviewed algorithmic benchmark
      papers evaluating Excavate's interactome models.
    whyItMatters: >-
      Biossil operates as a closed biopharmaceutical entity without developer-facing documentation or public code
      repositories, preventing independent verification of computational pipeline architecture and algorithmic
      predictive accuracy.
    diligencePath: >-
      Review technical architecture whitepapers, patent application disclosures, and algorithmic benchmark validations
      during expert technical diligence.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: named-licensing-counterparties
    missingEvidence: >-
      Disclosed identities of pharmaceutical and biotechnology counterparties participating in Biossil's active
      licensing agreements, along with contract values and milestone schedules.
    whyItMatters: >-
      Without named partner disclosures, customer concentration and commercial durability cannot be independently
      verified prior to clinical trial readouts.
    diligencePath: >-
      Review executed licensing agreements, revenue ledgers, and counterparty term sheets during confidential diligence
      review under NDA.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: milestone-timelines-and-readouts
    missingEvidence: >-
      Audited milestone schedules, clinical trial completion dates, and primary endpoint readout targets for the two
      late-stage clinical programs.
    whyItMatters: >-
      Biossil's revenue durability and future cash inflows depend on developmental milestone triggers that currently
      lack public disclosure.
    diligencePath: >-
      Inspect clinical trial protocol documentation, regulatory filings (IND/CTA), and milestone payment trigger
