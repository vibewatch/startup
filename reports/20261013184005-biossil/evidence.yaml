    relatedQuestionRefs:
      - QU009
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: clinical-trial-endpoints
    missingEvidence: >-
      Granular Phase 2/3 primary clinical endpoints, trial protocols, and patient enrollment data across the five active
