callouts:
  - calloutType: risk
    title: Biological Translation Asymmetry in Algorithmic Drug Sourcing
    body: While large language models and computational platforms dramatically accelerate candidate filtering and literature mining, they do not alter human physiological complexity. An algorithmically identified molecule remains subject to the historical ninety-percent clinical trial failure rate until validated in prospective human studies.
    claimRefs:
      - CR005
      - CR006
  - calloutType: recommendation
    title: Key Diligence Asks for Asset In-Licensing and Pipeline Concentration
    body: Investors should verify freedom-to-operate secondary patent claims, audit historical FDA communication binders for safety caveats, and review multi-tier milestone encumbrances before crediting early pipeline assets with platform-level valuation multiples.
    claimRefs:
      - CR002
      - CR003
      - CR014
