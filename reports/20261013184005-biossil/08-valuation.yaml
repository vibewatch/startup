  - id: TV002
    title: Thesis / anti-thesis table
    notes: Key structural arguments evaluated against verifiable corporate milestones and counterfactual risk triggers.
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - What Would Change View
    rows:
      - - Platform & AI Sourcing
        - LLMs systematically scan abandoned molecules and trial data to identify viable rescue candidates 70-80% faster
        - Algorithmic identification does not fix underlying biology; repurposed molecules still face standard clinical failure rates
        - Phase 3 clinical trial readout demonstrating statistically significant efficacy in a revived asset
      - - Capital & Syndicate
        - Tier-1 backing from OpenAI Startup Fund and Founders Fund provides deep syndication and $153M cash runway
        - Over-reliance on AI hype multiple and preferred share liquidation preference overhang of US$28.69/share
        - Disclosure of clean capitalization structure and non-dilutive grant/partner milestone non-equity inflows
      - - Asset Acquisition Cost
        - Acquiring discarded molecules at low entry costs (e.g., US$500k upfront for Summit antibiotic) bypasses early R&D expense
        - Subsequent human clinical trials still require tens of millions per program with substantial burn across 5+ disease areas
        - Formal co-development partnerships where pharmaceutical counterparties fund late-stage trial costs
      - - Corporate Governance
        - Experienced leadership combining venture strategy background with clinical medicine and virology expertise
        - Aggressive parallel trials across five complex therapeutic indications stretch operational focus
        - Demonstrated program prioritization with clear go/no-go phase gate discipline
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV010
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    notes: Forward-looking scenario analysis modeling enterprise value outcomes, return multiples, and downside catalysts over a 3-year horizon.
    columns:
      - Scenario
      - Core Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Senicapoc or Summit antibiotic achieves Phase 3 primary endpoint; pharma licensing partnership signed
        - $2.5B-$3.5B exit via pharma acquisition or IPO; 2.5x-3.5x return on $1.0B valuation mark
        - Clinical trial delay or adverse safety signals in oncology/CNS programs
        - '20% probability: Dependent on unproven Phase 3 efficacy validation'
      - - Base Case
        - 1-2 programs show modest Phase 2 efficacy; capital burn requires follow-on raise at flat or modest valuation
        - $1.0B-$1.2B valuation; 1.0x-1.2x capital preservation with substantial dilution
        - High ongoing cash burn across 12 molecules forcing subsequent down-round
        - '50% probability: Reflects platform promise offset by long clinical timelines'
      - - Bear Case
        - Repurposed molecules fail to hit clinical endpoints in sponsored trials; AI screening premium collapses
        - $200M-$400M liquidation or fire-sale of IP assets; 60-80% capital impairment
        - Complete loss of investor appetite for unpartnered AI biotech platforms
        - '30% probability: Driven by historical 90% attrition rate in clinical-stage drug candidates'
    claimRefs:
