callouts:
  - calloutType: recommendation
    title: 'Disciplined Stance: Track Rather Than Buy at Peak Platform Multiple'
    body: Biossil's US$1.0 billion post-money valuation prices in substantial clinical trial success before Phase 3 efficacy or commercial licensing has been established for any of its 12 repurposed assets. Investors should avoid chasing the current headline multiple, maintaining a track stance until primary clinical endpoints are reported for lead programs.
    claimRefs:
      - CV001
      - CV005
  - calloutType: risk
    title: Preferred Share Liquidation Overhang & High Clinical Attrition
    body: The August 2026 authorization of 5.37 million preferred shares at US$28.69 per share creates a substantial liquidation preference stack that common equity must clear. Given historical 90 percent attrition rates in human clinical trials, failure in lead programs such as senicapoc could compress platform multiples and trigger down-round recapitalizations.
    claimRefs:
      - CV002
      - CV012
