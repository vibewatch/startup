      - - Risk Rating
        - high
        - Binary clinical risk across 12 repurposed molecules without commercial validation
        - Maintain strict exposure limits given high trial failure rate and heavy capital intensity
      - - Valuation Stance
        - stretched
        - $153M round at $1.0B post-money prices unapproved drug portfolio far above conventional biotech benchmarks
        - Demand significant discount or structural downside protection for secondary or prospective entry
