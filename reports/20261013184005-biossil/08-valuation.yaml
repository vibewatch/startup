    title: Recommendation summary table
    notes: Synthesized diligence view combining round terms, capital structure disclosures, and stage-adjusted biotech valuation benchmarks.
    columns:
      - Dimension
      - Assessment
      - Evidence Basis
      - Decision Implication
    rows:
