  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Architecture, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Biossil operates at the intersection of applied artificial intelligence, drug repurposing, and
              clinical-stage pharmaceutical development. The company defines its operational scope around clinical-stage
              compounds that have previously demonstrated initial human safety (such as Phase 1 clearance) but were
              subsequently abandoned or shelved by original developers due to strategic portfolio reprioritization,
              capital exhaustion, patent cliff timing, or efficacy failure in an initial indication. This structural
              positioning establishes explicit boundaries for addressable spend and operational activity. Specifically,
              included spend encompasses upfront cash and equity asset acquisitions, milestone and royalty licensing
              arrangements with incumbent biopharmaceutical firms, external contract research organization (CRO)
              operational expenditures, clinical trial execution, patient matching infrastructure, and regulatory filing
              processes across North America. Conversely, excluded spend comprises de novo chemical synthesis,
              high-throughput computational molecular design from scratch, and early discovery biology—stages where
              conventional computational biology vendors spend four to seven years and hundreds of millions of dollars
              before human dosing. The primary status-quo substitutes in this market remain incumbent pharmaceutical
              internal pipeline deprioritization (shelving molecules as written-off intellectual property), academic and
              non-profit rare disease drug repurposing initiatives, and de novo AI drug discovery platforms such as
              those run by tech-bio companies generating novel chemical matter. By acquiring full or partial asset
              ownership, Biossil positions itself as an asset-owning drug sponsor rather than a discovery software
              provider.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
              - CM010
              - CM011
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
