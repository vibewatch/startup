            title: Key Diligence Asks for Asset In-Licensing and Pipeline Concentration
            body: >-
              Investors should verify freedom-to-operate secondary patent claims, audit historical FDA communication
              binders for safety caveats, and review multi-tier milestone encumbrances before crediting early pipeline
              assets with platform-level valuation multiples.
            calloutType: recommendation
