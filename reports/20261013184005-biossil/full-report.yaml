      - number: '7.3'
        title: Strategic Partner Concentration and Lead Counterparty Exposures
        blocks:
          - type: paragraph
            body: >-
              Biossil operates with pronounced strategic partner and capital concentration risks. The OpenAI Startup
              Fund co-led consecutive financing rounds, embedding the company within OpenAI's platform ecosystem while
              exposing Biossil to lead-investor concentration. While backing from prominent venture firms, Duke
              University's endowment, and the Abu Dhabi Investment Council validates investor interest, heavy reliance
              on specialized machine learning infrastructure creates vendor lock-in. If foundational AI tooling
              undergoes proprietary changes or architectural deprecation, core screening workflows could face
              operational friction. Additionally, Biossil depends entirely on third-party pharmaceutical developers for
              ongoing candidate deal flow, as well as external contract research organizations for clinical execution.
              Securing off-balance-sheet financing provides non-dilutive capital flexibility, but counterparty reliance
              remains an acute vulnerability if originating developers choose to retain secondary rights or restrict
              compound access.
