              - CV010
              - CV012
      - number: '8.3'
        title: Capital Structure, Scenario Modeling & Comparable Analysis
        blocks:
          - type: paragraph
            body: >-
              An examination of Biossil's capital structure reveals meaningful liquidation preference overhang that
              complicates common equity returns. Regulatory disclosures with Corporations Canada from August 2026 show
              the creation of 5.37 million preferred shares valued at US$28.69 each, tripling the valuation of shares
              issued in the prior financing round. In our scenario analysis, a bull case (20% probability) assumes lead
              assets like senicapoc or the Summit antibiotic clear Phase 2/3 primary endpoints, catalyzing major
              pharmaceutical co-development partnerships and supporting an exit valuation of US$2.5 billion to US$3.5
              billion. The base case (50% probability) anticipates modest clinical progress with ongoing cash burn,
              requiring extension financing at flat to modestly higher valuations (US$1.0 billion to US$1.2 billion)
              with significant common dilution. The bear case (30% probability) models clinical trial failure across
              lead indications, triggering multiple collapse and asset fire-sales at US$200 million to US$400 million.
              Trading comps from public healthcare software and specialty biopharma show revenue multiples clustering
              between 2.0x and 10.3x, but clinical biotechs remain valued on binary developmental milestones rather than
              software multiples.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV012
              - CV013
      - number: '8.4'
        title: Exit Pathways, Diligence Asks & Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Biossil's ultimate path to liquidity will depend on either pharmaceutical trade acquisition or a
              cross-border public listing once human trial readouts are established. The company has sponsored active
              clinical trials across five indications, including sickle cell disease trials at SickKids and McGill
              University, as well as glioblastoma trials in Germany and Denmark for senicapoc, a molecule originally
              abandoned by Johnson & Johnson. However, with an operating team of 30 to 50 employees distributed between
              Toronto and Boston, scaling regulatory and commercial capabilities remains a critical operational hurdle.
              Key diligence asks for confirmatory review include auditing primary data from the Corporations Canada
              share authorization, reviewing full cap table liquidation preferences, and verifying Phase 2 enrollment
              velocities. Crucial thesis-break triggers that would mandate an immediate downgrade to avoid include any
              adverse safety signal or clinical trial halt in the senicapoc program, failure to secure a co-funded
              pharmaceutical partner within 24 months, or unexpected executive turnover in the scientific leadership
              team.
            claimRefs:
              - CV008
              - CV009
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Disciplined Stance: Track Rather Than Buy at Peak Platform Multiple'
            body: >-
              Biossil's US$1.0 billion post-money valuation prices in substantial clinical trial success before Phase 3
              efficacy or commercial licensing has been established for any of its 12 repurposed assets. Investors
              should avoid chasing the current headline multiple, maintaining a track stance until primary clinical
              endpoints are reported for lead programs.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
          - type: callout
            title: Preferred Share Liquidation Overhang & High Clinical Attrition
            body: >-
              The August 2026 authorization of 5.37 million preferred shares at US$28.69 per share creates a substantial
              liquidation preference stack that common equity must clear. Given historical 90 percent attrition rates in
              human clinical trials, failure in lead programs such as senicapoc could compress platform multiples and
              trigger down-round recapitalizations.
            calloutType: risk
            claimRefs:
              - CV002
              - CV012
