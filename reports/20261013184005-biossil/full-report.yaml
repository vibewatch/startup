      - Biossil Excavate Workflow
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Candidate Discovery
        - De novo high-throughput screening and chemical synthesis across millions of compounds
        - LLM parsing of shelved clinical trials, regulatory documents, and scientific literature
        - 70% to 80% reduction in candidate identification and diligence time
        - Bounded by quality and accessibility of historical trial disclosures
      - - Target & Endotype Matching
        - Broad disease classification based on clinical symptoms and standard pathology
        - Trillion-point multiomics interactome modeling and population-scale EMR parsing
        - Identification of biologically defined responder sub-populations
        - High computational complexity and risk of biological overfitting in silico
      - - Safety De-Risking
        - Multi-year Phase 1 preclinical toxicology, animal modeling, and healthy volunteer dosing
        - Direct in-licensing of molecules with established human Phase 1 safety profiles
        - Bypasses early toxicology friction; accelerates timeline into efficacy trials
        - Prior toxicity data may not hold at modified dosages or in new disease populations
      - - Trial Design & Execution
        - Empirical patient recruitment across unselected, heterogeneous populations
        - Biomarker-guided patient stratification and optimized trial protocol modeling
        - Compressed trial timelines and enhanced potential response rates
        - Requires access to specialized clinical cohorts; cannot eliminate biological failure risks
    notes: >-
      Workflow comparisons reflect reported company capabilities versus standard industry drug development timelines.
      Time-reduction estimates are internal company figures reported in press coverage.
