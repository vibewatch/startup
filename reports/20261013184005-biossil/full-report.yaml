    notes: >-
      Forward-looking scenario analysis modeling enterprise value outcomes, return multiples, and downside catalysts
      over a 3-year horizon.
    columns:
      - Scenario
      - Core Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
