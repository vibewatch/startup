      - number: '6.4'
        title: Contract Durability, Expansion Loops & Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Because Biossil does not operate an enterprise subscription model, traditional software retention metrics
              such as annual recurring revenue, net revenue retention, and gross churn are structurally inapplicable.
              Revenue durability is instead governed by binary clinical trial milestones, regulatory review approvals,
              and lumpy licensing disbursements. This deal structure creates substantial revenue concentration risk: if
              lead clinical programs fail to meet primary endpoints in human trials, associated milestone disbursements
              and downstream commercial royalties are permanently lost. Furthermore, Biossil achieved a $1 billion
              unicorn valuation without an announced anchor partnership from a major global pharmaceutical manufacturer,
              meaning capital market expectations are heavily reliant on algorithmic repurposing claims before human
              trial efficacy data is established.
