      - number: '3.2'
        title: Differentiation comes from controlling the rescued asset
        blocks:
          - type: paragraph
            body: >-
              Biossil's model begins after a candidate has accumulated safety, efficacy, regulatory, and trial-design
              history. That can shorten the path relative to discovering a new molecule, but it does not remove the
              biological or clinical translation risk that caused or followed the original failure. The strongest public
              distinction is therefore not exclusive access to a foundation model; it is the combination of licensed
              molecule rights, a patient or endpoint hypothesis, and responsibility for a new clinical program. Biossil
              reported a ten-molecule portfolio at stealth exit, with two candidates in advanced trials and three
              preparing for regulatory approval, while coverage also described programs spanning five disease areas.
              That breadth diversifies shots on goal but raises execution complexity for a young organization.
