      - number: '6.2'
        title: Clinical Pipeline Deployment & Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              Adoption in Biossil’s operating model is measured through clinical asset deployment, trial progression,
              and molecule acquisition rather than customer account counts or software seat expansion. Over three years
              in stealth, Biossil quietly amassed a portfolio of ten rescued drug molecules, with two candidates
              advancing into late-stage clinical trials and three molecules currently seeking regulatory clearances to
              enter market testing. The company’s active trial deployment spans five major disease indications: sickle
              cell disease, idiopathic pulmonary fibrosis, glioblastoma, breast cancer, and Alzheimer's disease.
              Supported by $223 million in cumulative equity capital following an OpenAI-led $153 million financing
              round in September 2026, Biossil deploys its 30-person team in Toronto and Boston to expand clinical
              development throughput and scale candidate acquisition.
