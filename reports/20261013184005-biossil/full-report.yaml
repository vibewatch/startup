      - number: '3.3'
        title: Capital and clinical networks matter more than software distribution
        blocks:
          - type: paragraph
            body: >-
              Competitive power in this category is likely to come from access to shelved assets, hospital
              investigators, regulatory execution, and financing for trials rather than conventional software seats.
              Biossil reported about thirty employees and approximately US$70 million of equity funding at its April
              2026 stealth exit; later reporting described a US$153 million financing intended to expand clinical
              capacity and acquire more candidates. Another report cited relationships with more than twenty
              universities and research hospitals. These resources may improve sourcing and execution, but no assigned
              source quantifies exclusivity, switching cost, acquisition pricing, royalties, milestone obligations, or
              realized economics. Publicly reported licensing revenue is therefore a monetization signal, not evidence
              of attractive pricing or margins.
