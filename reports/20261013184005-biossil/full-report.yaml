              - CE003
          - type: callout
            title: Clinical Translation and Data Disclosure Gap
            body: >-
              While LLMs and multiomics endotyping accelerate molecule diligence by an estimated 70% to 80%, algorithmic
              identification cannot alter human biology. Biossil has not disclosed trial timelines, primary endpoints,
              or peer-reviewed algorithmic benchmarks for its active programs, leaving pipeline efficacy unverified.
            calloutType: risk
            claimRefs:
              - CE005
