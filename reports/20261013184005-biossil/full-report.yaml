      - number: '7.4'
        title: Capital Intensity, Valuation Overhang, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Biossil closed a US$153 million financing round in September 2026 at a US$1.0 billion post-money
              valuation, attaining unicorn status well ahead of public Phase 3 efficacy readouts or commercial
              partnerships. Clinical-stage biopharma companies rarely achieve ten-figure valuations without pivotal
              data, creating valuation overhang if subsequent Phase 2 readouts miss endpoints. Advancing ten molecules
              across multi-center human trials demands substantial multi-year capital, risking steep dilution in
              down-round scenarios if broader macroeconomic appetite for platform biotech wanes. Clear thesis-break
              triggers for Biossil include: (1) biological failure of its lead repurposed molecule in Phase 2/3 trials,
              demonstrating that algorithmic rescue does not overcome historical failure rates; (2) loss of access to
              OpenAI infrastructure or key AI talent; (3) intellectual property invalidation on secondary-use patent
              claims; and (4) prohibitive royalty stacking that destroys unit economic viability upon eventual
              commercial approval.
            claimRefs:
              - CR013
              - CR014
