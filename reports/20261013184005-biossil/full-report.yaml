        title: Exhibits
        blocks:
          - type: callout
            title: The Second-Chance Chemistry Strategy
            body: >-
              Biossil differentiates from traditional AI drug discovery by bypassing de novo molecular generation.
              Instead of synthesizing unproven chemical entities, it acquires de-risked molecules with established
              safety data that failed efficacy endpoints in prior indications, compressing early development timelines
              and lowering biological toxicity risks.
            calloutType: insight
            claimRefs:
              - CE001
