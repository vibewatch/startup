  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Excavate Computational Architecture and Multiomics Platform
        blocks:
          - type: paragraph
            body: >-
              Biossil's technical foundation centers on Excavate, a proprietary computational discovery platform
              designed to overcome the historical limitations of population variability in clinical trials. Rather than
              predicting de novo molecular structures, Excavate combines a trillion-point multiomics biological pipeline
              with population-scale Electronic Medical Records (EMR) datasets. The system maps interactome-scale disease
              modules to translate complex, heterogeneous disease sub-phenotypes into biologically distinct molecular
              endotypes. By pairing patient molecular stratification with large language models that parse historical
              trial literature and regulatory filings, Biossil identifies biological mechanisms where shelved drug
              candidates can succeed in specific sub-populations. The core engineering organization comprises roughly 30
              employees split between computational platform operations and dedicated asset development teams based in
              Toronto and Boston.
            claimRefs:
              - CE001
