      - number: '1.4'
        title: Corporate Trajectory, Strategic Milestones, and Clinical Development
        blocks:
          - type: paragraph
            body: >-
              Since its incorporation in May 2023, Biossil has executed a deliberate sequence of licensing transactions
              and clinical study initiations. The company has secured rights to twelve shelved molecules across five
              principal disease domains: sickle cell disease, idiopathic pulmonary fibrosis, glioblastoma, breast
              cancer, and Alzheimer's disease. Notable transactions include a July 2026 acquisition of an abandoned
              precision antibiotic candidate for Clostridioides difficile from Summit Therapeutics for US$500,000
              upfront plus downstream regulatory and commercial milestones. In sickle cell disease, Biossil is
              sponsoring trials for senicapoc, a potassium channel blocker previously shelved by Johnson & Johnson after
              failing pain-relief endpoints, which Biossil's platform identified as effective at preventing red blood
              cell hemolysis. Active trial recruiting is underway at Toronto's Hospital for Sick Children (SickKids),
              Centre hospitalier de l'Université de Montréal, and McGill University, alongside oncology trials in
              glioblastoma with Heidelberg University Hospital in Germany and Aarhus University in Denmark.
