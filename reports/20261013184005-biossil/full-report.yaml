  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Commercial Archetypes & Customer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Biossil departs from the commercial model of software-as-a-service artificial intelligence companies by
              operating as a direct asset owner and biopharmaceutical developer. Rather than licensing software access
              or collecting recurring seat-based platform fees from enterprise customers, Biossil identifies
              discontinued clinical molecules and acquires or licenses them directly from original developers. The
              company monetizes these assets by advancing them through clinical re-evaluation and out-licensing them to
              commercial pharmaceutical partners, capturing upfront cash considerations alongside milestone-based
              developmental revenues. Biossil’s customer and counterparty base divides across three functional segments:
              commercial pharmaceutical out-licensees seeking late-stage drug pipelines, original pharmaceutical
              developers selling off shelved chemical assets, and clinical research organizations executing ongoing
              trials across five therapeutic programs.
