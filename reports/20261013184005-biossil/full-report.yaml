      - number: '1.2'
        title: Leadership, Scientific Founders, and Board Governance
        blocks:
          - type: paragraph
            body: >-
              Biossil was co-founded by Chief Executive Officer Anthony Mouchantaf and Chief Scientific Officer Dr.
              Alexander Mosa. Mouchantaf is a technology attorney and venture entrepreneur who previously served as
              Director of Venture Capital at RBCx, where he formulated and led Royal Bank of Canada's venture capital
              investment strategy. Dr. Mosa is a University of Toronto alumnus and medical doctor with formal internal
              medicine training who spearheaded the design of the Excavate platform's multi-omics data pipeline and
              molecular endotype mapping. The executive bench also includes Head of Medical Kevin Kuo, who coordinates
              clinical trial protocols and institutional investigator networks across major academic hospitals.
              Governance oversight is anchored by independent board members including Janet Bannister, Managing Partner
              of Staircase Ventures, who led Biossil's initial seed financing, alongside co-founder Dr. Alexander Mosa
              and independent governance personnel. Early operational headcount expanded from an initial core team to
              approximately thirty specialized personnel across core platform architecture, legal licensing, regulatory
              quality, and program-specific asset development teams.
