      - number: '5.3'
        title: Pipeline Composition and Clinical Asset Maturity
        blocks:
          - type: paragraph
            body: >-
              Over three years of stealth operation, Biossil accumulated a proprietary portfolio of 10 acquired
              molecules across oncology, rare genetic disorders, respiratory disease, and neurodegeneration. Active
              clinical programs target sickle cell disease, idiopathic pulmonary fibrosis, glioblastoma, breast cancer,
              and Alzheimer's disease, with nearly a dozen additional therapeutic programs in preparation. According to
              reported company disclosures, two acquired molecules have advanced into late-stage clinical trials, and
              three programs are preparing regulatory submissions to enter the market. The portfolio strategy balances
              wholly owned programs with out-licensing partnerships, generating non-dilutive milestone payments while
              Biossil finances clinical trials for its most promising pipeline assets.
            claimRefs:
              - CE006
