      - number: '2.2'
        title: 'Addressable Market Sizing: Total Abandoned Pipeline vs. Repurposing Opportunity'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market potential for Biossil requires analyzing the structural attrition rates of clinical
              drug development rather than relying on a single top-down total addressable market (TAM) estimate.
              Historically, approximately 90 percent of molecules that enter human clinical trials fail to reach market
              approval. Because thousands of clinical trials are conducted globally across biopharma pipelines, the
              cumulative inventory of shelved molecules numbers in the thousands of compounds. This broad pool
              represents an enormous sunk capital base where hundreds of millions of dollars per compound were expended
              on preclinical safety and toxicology. When filtering this historical asset universe through Biossil's
              operational constraints, the serviceable addressable market (SAM) narrows to clinical-stage molecules with
              intact safety profiles, clear intellectual property chain of title, and accessible trial documentation
              across targeted therapeutic categories such as oncology, neurodegeneration, and rare non-malignant
              hematology. Disclosed therapeutic indications targeted by Biossil's pipeline include Alzheimer's disease,
              sickle cell disease, glioblastoma, breast cancer, and idiopathic pulmonary fibrosis. Each of these
              indication areas represents an addressable patient population with significant unmet medical need.
              Biossil's serviceable obtainable market (SOM) is governed by its balance sheet and internal operational
              capacity: with $223 million USD in cumulative equity funding raised across two disclosed financings, the
              company currently maintains an active pipeline of 10 acquired or licensed drug candidates, including two
              in advanced clinical trials and three approaching regulatory submissions for conditional marketing
              approval. However, independent analyst sizing estimates for the exact dollar value of the global discarded
              molecule acquisition market remain unavailable in public filings, representing an ongoing diligence gap.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
