      - number: '3.4'
        title: Clinical proof, not valuation, will determine moat durability
        blocks:
          - type: paragraph
            body: >-
              The adverse case is straightforward: finding a plausible rescue candidate with an algorithm does not
              change its biology, and the approximately ninety-percent failure rate cited for drug candidates entering
              human trials remains the category backdrop. One source argued that Biossil's US$1 billion valuation
              exceeds what conventional biotech benchmarks would support without a late-stage asset or named
              pharmaceutical partnership, making the premium a bet on the platform improving trial outcomes. Incumbents
              can also retain attractive shelved assets, while competitors can use broadly available models and public
              literature. Durable advantage would require evidence that Biossil repeatedly secures overlooked assets,
              designs better trials, and converts them into approvals or valuable licenses; the assigned evidence
              contains no comparative outcome benchmark yet.
