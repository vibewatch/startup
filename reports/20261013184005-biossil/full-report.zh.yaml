      - number: '2.3'
        title: 资产收购动力、交易对手与商业结构
        blocks:
          - type: paragraph
            body: >-
              Biossil
              的商业引擎依靠双边市场结构：供给侧是企业资产出售方，变现侧是商业许可伙伴或医疗支付方。在资产收购端，交易对手是资产负债表上持有已终止项目的上市或风险投资支持的生物制药研发商。这些企业的业务开发高管和首席商务官希望靠前期现金、结构化里程碑收益或保留特许权使用费盘活沉睡资产，把会计核销转化为流动性，同时不再承担持续研发开销。
              Biossil 与 Summit Therapeutics 的交易说明了这套模式：Summit 将失败的抗生素候选药物剥离给 Biossil，协议价值 $105M。在下游变现端，Biossil
              不卖软件订阅，而是通过结构化对外许可协议、里程碑付款和潜在商业制药销售创造收入。管理层披露称，Biossil
              已与成熟制药和生物科技伙伴签订许可协议，并产生现金和基于里程碑的收入。获批药物最终的商业支付方将是公共和商业医疗保险机构，采用取决于临床疗效、已证明的安全性差异化和正式监管上市许可。
            claimRefs:
              - CM004
              - CM006
              - CM008
              - CM010
              - CM011
              - CM014
