      - number: '1.2'
        title: 管理层、科学创始人与董事会治理
        blocks:
          - type: paragraph
            body: >-
              Biossil 由首席执行官 Anthony Mouchantaf 和首席科学官 Alexander Mosa 博士共同创立。Mouchantaf 是科技律师和风险投资创业者，曾任 RBCx
              风险投资总监，并在任内制定和领导 Royal Bank of Canada 的风险投资策略。Mosa 博士是 University of Toronto 校友和医学博士，接受过正式内科培训，主导了
              Excavate 平台多组学数据管线与分子内型映射的设计。 管理团队还包括医疗负责人 Kevin Kuo，他负责协调主要学术医院的临床试验方案和机构研究者网络。治理由独立董事牵头，其中包括 Staircase
              Ventures 管理合伙人 Janet Bannister；她曾主导 Biossil 的首轮种子融资，董事会同时包括联合创始人 Mosa 博士及其他独立治理人员。 公司早期运营团队从最初的核心班底扩展到约 30
              名专业人员，覆盖核心平台架构、法律许可、监管质量和按项目划分的资产开发团队。
