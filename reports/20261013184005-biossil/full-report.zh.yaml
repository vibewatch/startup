  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别结构与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Biossil 位于应用型人工智能、药物再定位和临床阶段制药开发的交叉地带。公司的运营范围聚焦于已初步证明人体安全性（例如通过 Phase
              1）的临床阶段化合物，但原始开发商后来因战略性调整管线、资金耗尽、专利悬崖时点或首个适应症疗效失败而放弃或搁置这些化合物。
              这一定位明确了可触达支出和运营活动的边界。纳入范围包括前期现金和股权资产收购、与现有生物制药公司的里程碑及特许权使用费许可安排、外部合同研究组织（CRO）运营支出、临床试验执行、患者匹配基础设施，以及北美监管申报流程。排除范围则包括全新化学合成、从零开始的高通量计算分子设计和早期发现生物学；传统计算生物学供应商通常要在这些阶段投入
              4 至 7 年和数亿美元，才会进入人体给药。
              该市场的主要现状替代方案仍是大型制药公司内部降低管线优先级、将分子作为已核销知识产权搁置，学术和非营利罕见病药物再定位项目，以及由科技生物公司运行、生成新化学实体的全新 AI
              药物发现平台。通过取得全部或部分资产所有权，Biossil 把自己定位为拥有资产的药物赞助方，而不是发现软件供应商。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
              - CM010
              - CM011
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM008
              - CM010
              - CM011
      - number: '2.2'
        title: 可触达市场规模：全部搁置管线与再定位机会
        blocks:
          - type: paragraph
            body: >-
              评估 Biossil 的市场潜力，需要分析临床药物开发的结构性淘汰率，而不能只依赖单一的自上而下 TAM 估算。历史上，进入人体临床试验的分子约有 90%
              无法获得上市批准。全球生物制药管线每年开展数千项临床试验，因此搁置分子的累计库存达到数千种化合物。这一庞大池子代表巨额沉没资本基础：每种化合物在临床前安全性和毒理学上都投入了数亿美元。按 Biossil
              的运营约束筛选这一历史资产宇宙后，SAM 会收窄至安全性档案完整、知识产权权属链清晰、且在肿瘤学、神经退行性疾病和罕见非恶性血液病等目标治疗类别中能够取得试验文件的临床阶段分子。Biossil
              管线披露的目标适应症包括阿尔茨海默病、镰状细胞病、胶质母细胞瘤、乳腺癌和特发性肺纤维化；每个适应症都对应着未满足医疗需求显著的可触达患者群体。 Biossil 的 SOM
              受资产负债表和内部运营能力约束：公司通过两次披露的融资累计获得 $223M 股权资金，目前维持一条由 10 个收购或许可候选药物组成的活跃管线，其中 2 个已进入后期临床试验，3
              个接近提交条件性上市批准申请。然而，独立分析师对全球废弃分子收购市场确切美元规模的估算仍未见于公开文件，构成持续的尽调缺口。
            claimRefs:
