      - number: '2.4'
        title: 宏观增长催化剂与临床采用的核心约束
        blocks:
          - type: paragraph
            body: >-
              Biossil
              运营模式的扩张受益于显著的宏观经济和技术顺风，但也受到临床药物开发固有的严重结构性约束。主要增长动力是大语言模型和向量嵌入架构快速进步，它们能够摄取海量非结构化临床试验文件、生物医学文献和证券申报文件。Biossil
              的 AI 平台映射化合物之间的语义和生物学接近度，据估计可将候选分子的筛选和尽调时间缩短 70 至 80%，同时识别试验设计有缺陷、患者选择不佳或公司资不抵债等非生物学失败模式。
              此外，生物制药估值承压已迫使老牌公司精简管线，扩大折价临床资产的可供给量。但公司也面临重大的运营和监管约束。最关键的是，算法筛选无法改变人体药理学：再定位化合物仍受临床试验的基本生物学风险影响，历史淘汰率约为
              90%。每个获救候选药物还带着此前临床挫折造成的声誉包袱，令监管审查和伙伴谈判更加复杂。安全档案干净的优质失败资产供给天然有限；随着竞争科技生物公司进入市场，收购估值可能上升，进而削弱 Biossil
              的资本效率。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM009
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资产所有权与软件即服务商业模式
            body: >-
              不同于向大型制药研发商许可发现软件或提供筛选即服务、赚取按服务收费利润的 AI 生物科技平台，Biossil
              直接在资产负债表上持有药物资产。这种模式需要大量前期收购资本并承担显著临床试验风险，但若被放弃的候选药物获得监管许可，就能捕获可观的生物制药企业价值。
            calloutType: insight
            claimRefs:
              - CM008
              - CM010
              - CM011
          - type: callout
            title: 生物学转化仍由临床试验淘汰率决定
            body: 大语言模型和向量嵌入可以大幅加快候选筛选与试验文献解析，但算法选择不会改变基本的人体药理学。获救分子仍暴露于临床试验历史上 90% 的淘汰率，因此严谨的临床试验执行才是估值能否持续的最终决定因素。
            calloutType: risk
            claimRefs:
              - CM001
              - CM009
              - CM014
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局是一套工作流，而非整齐的同业群组
        blocks:
          - type: paragraph
            body: >-
              Biossil
              收购或许可此前被原持有人搁置的候选药物，再通过重新设计的开发项目推进，把自己置于软件驱动发现和资产持有型生物科技之间，而不完全属于任何一类。因此，相关替代方案包括能够重新评估自身分子的制药公司团队、外部资产救援或许可专家、全新
              AI 发现平台、学术再定位项目，以及直接放弃资产。 公开数据库中的可比公司并不能可靠替代这张功能地图：一份指定来源把无关的工业和软件企业标成 Biossil
              的竞争者。因此，下述定位是分析师对工作流责任和起始临床成熟度的序数判断，而不是经过测量的市场份额排名。
            claimRefs:
