      - number: '6.4'
        title: 合同持久性、扩张循环与集中风险
        blocks:
          - type: paragraph
            body: >-
              由于 Biossil
              不采用企业订阅模式，年度经常性收入、净收入留存率和总流失率等传统软件留存指标在结构上不适用。收入持续性反而由二元临床试验里程碑、监管审查批准和不均匀的许可付款决定。这种交易结构带来显著收入集中风险：若主要临床项目未能达到人体试验的主要终点，相关里程碑付款和后续商业特许权使用费将永久消失。
              此外，Biossil 在没有宣布与全球大型制药厂商建立锚定伙伴关系的情况下取得 10 亿美元独角兽估值，意味着资本市场预期高度依赖算法再定位主张，而人体试验疗效数据尚未建立。
            claimRefs:
              - CU004
              - CU005
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资产驱动的收入模式缺少企业合同底线
            body: 不同于能产生可预测重复订阅收入的企业软件初创公司，Biossil 依靠临床阶段资产对外许可和里程碑付款。若没有锚定的商业制药分销伙伴或 FDA 批准分子，近期收入持续性仍取决于 5 个治疗领域的临床试验读出。
            calloutType: risk
            claimRefs:
              - CU004
              - CU005
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、许可义务与知识产权脆弱性
        blocks:
          - type: paragraph
            body: >-
              Biossil 收购并复活被丢弃药物分子的核心模式，带来独特的监管、许可和知识产权挑战。由于底层化合物此前由其他制药研发商合成并搁置，Biossil
              面临复杂的可专利性障碍。公司不拥有化合物本身的独占权，只能依靠针对次级患者亚群的方法用途、剂量或配方专利权利要求。 Osler, Hoskin & Harcourt LLP
              的法律代理帮助公司完成早期企业融资，但持续商业成功取决于能否与原始制药赞助方谈妥可持续的许可合同。此外，内许可交易经常附带累积里程碑义务和特许权使用费负担，药物获批后会压缩商业利润。向 FDA 和 Health
              Canada 提交临床试验用新药申请，还需要证明此前临床试验挫折并非源于无法克服的毒性或不可逆安全风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 临床转化失败与管线执行瓶颈
        blocks:
          - type: paragraph
            body: >-
              Biossil 最大的运营风险，在于把算法筛选的药物分子转化为人体临床疗效。在整个生物制药行业，进入临床试验的候选药物约有九成
              无法获得监管批准，通常是在安全性、疗效或特定患者队列上表现不足。用计算模型和大语言模型寻找被放弃的分子可以加快候选筛选，但计算匹配无法改变基本人体生物机制。初始临床研究失败的分子仍承受更高的生物学风险。
              与此同时，Biossil 的运营足迹仍很精简，约 30 名员工要管理核心平台基础设施和 5
              个不同治疗领域的开发项目。在阿尔茨海默病、胶质母细胞瘤和镰状细胞病等复杂疾病领域同时协调试验，会造成严重运营分散；尤其是公开临床管线数据库 Patsnap Synapse 截至 2026 年 10
              月仍显示零项已发布开发里程碑。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
