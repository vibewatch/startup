  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 商业类型与客户分层
        blocks:
          - type: paragraph
            body: >-
              Biossil 不同于软件即服务 AI
              公司的商业模式，而是直接持有资产并开发生物制药。公司不向企业客户许可软件访问权，也不收取按席位重复计费的平台费用，而是识别已终止的临床分子，直接从原始开发商处收购或取得许可。
              公司通过重新推进临床评估并向商业制药伙伴对外许可这些资产变现，获得前期现金对价和基于里程碑的开发收入。Biossil
              的客户和交易对手分为三个功能类别：寻找后期药物管线的商业制药被许可方、出售搁置化学资产的原始制药研发商，以及在 5 个治疗项目中执行当前试验的临床研究组织。
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
