  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Excavate 计算架构与多组学平台
        blocks:
          - type: paragraph
            body: >-
              Biossil 的技术基础是 Excavate，一套为克服临床试验中人群差异历史局限而设计的专有计算发现平台。Excavate
              不预测全新分子结构，而是把万亿级多组学生物管线与大规模电子病历（EMR）数据集结合起来。系统将互作组规模的疾病模块映射到复杂且异质的疾病亚表型，再转化为生物学上不同的分子内型。
              通过把患者分子分层与解析历史试验文献和监管文件的大语言模型结合，Biossil 找出搁置候选药物可能在特定亚群中成功的生物学机制。核心工程团队约 30
              人，分别负责位于多伦多和波士顿的计算平台运营及专门资产开发团队。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
              - CE013
