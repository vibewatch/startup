  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与许可变现
        blocks:
          - type: paragraph
            body: >-
              Biossil 的商业模式有别于标准计算生物科技和平台软件即服务模式。公司不通过出售算法软件订阅或收取前期费用提供湿实验室发现服务，而是靠生物制药许可协议和知识产权所有权变现。联合创始人兼首席执行官
              Anthony Mouchantaf 确认，Biossil 已与制药和生物科技伙伴签订双边许可协议，取得前期现金收入和与临床执行挂钩的里程碑付款。
              由于公司收购的是被放弃分子的实体权利或独家许可，而不是提供合同研究筛选，收入确认遵循标准生物制药对外许可会计惯例：许可执行时收取前期现金，阶段转换或监管许可时收取或有里程碑付款，疗法商业化后收取长期商业特许权使用费。

              公司的商业组合包括 12 个已收购或获许可的分子资产，覆盖镰状细胞病、特发性肺纤维化、胶质母细胞瘤和阿尔茨海默病等疾病类别。管理层确认许可交易已经带来实际现金流入，但 Biossil
              没有在公开声明中披露单独收入、交易前期金额或伙伴集中度。作为一家非上市临床阶段生物科技公司，Biossil
              目前主要依靠投入的风险资本，而不是自我维持的商业运营现金流；这反映出把获救分子推进医院支持的临床验证需要多年时间。
            claimRefs:
              - CI003
              - CI011
              - CI012
