      - number: '6.3'
        title: 商业证明与对外许可伙伴关系
        blocks:
          - type: paragraph
            body: >-
              商业采用的可验证证据，集中在 Biossil 与成熟制药和生物科技公司签订的双边许可协议上。首席执行官 Anthony Mouchantaf 确认，Biossil
              已签订结构化许可协议，可获得前期现金收入和开发里程碑付款，但公司对具体客户身份和交易价值保密。 行业媒体报道，公司与两家大型制药企业开展合作探索项目，评估已终止资产；但 Biossil
              尚未公开披露具名企业参考客户或锚定商业共同开发联合体。因此，公开交易结构验证了商业许可兴趣，但独立尽调无法审计交易对手集中度、合同续期条款或各交易对手的管线承诺。
            claimRefs:
