              会在商业批准前失败，原因往往是患者选择不足、剂量不佳或商业优先级下降，而非不可逆毒性。Biossil 解析数十年的结构化和非结构化试验文件，筛出在 Phase 1
              试验中安全性良好、但在未分层队列中未达到统计显著性的资产。找到高概率目标适应症后，Biossil 以失败后折价取得分子内许可或直接收购。公司内部估计，这种计算分流可将候选识别和尽调时间缩短 70 至
              80%，使公司能够把 $153M 风险投资直接投入临床执行。
