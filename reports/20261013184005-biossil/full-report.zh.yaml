              负面情形很明确：算法找到可信的获救候选药物，并不会改变其生物学；针对进入人体试验候选药物所引用的约九成失败率，仍是该类别的背景。一个来源认为，在没有后期资产或明确制药伙伴的情况下，Biossil 的 US$1B
              估值高于传统生物科技基准能够支持的水平，溢价押注的正是平台改善试验结果的能力。老牌公司也可以保留有吸引力的搁置资产，竞争者则可以使用广泛可得的模型和公开文献。要形成持久优势，Biossil
