      - number: '4.2'
        title: 单位经济与资产收购成本结构
        blocks:
          - type: paragraph
            body: >-
              Biossil 商业模式的核心经济逻辑，是在临床开发漏斗顶端实现极高资本效率。传统制药发现和开发极其烧钱：行业基准显示，从全新发现到监管批准开发一种新化学实体，平均需要超过 $2B 和 10
              多年临床前及临床试验。早期阶段的高淘汰率构成传统生物制药组合绝大多数沉没成本。Biossil 只瞄准已证明人体安全性和药代动力学可行性的后期临床失败项目，从而绕过数亿美元级的早期发现和临床前毒理支出。
              公司从已经核销开发成本的原始赞助方手中收购分子，以困境资产价格取得专有药物资产。例如，2026 年 7 月，Biossil 向 Summit Therapeutics 支付 US$500,000
              前期现金费用，取得一款此前在 Phase 3 艰难梭菌试验中失利的精准抗生素候选药物全球权利；其余财务负债严格取决于未来监管批准和商业入市。公司在多伦多和波士顿约 30
              名专业人员组成的精干跨职能组织下运营，将内部费用分配给核心机器学习基础设施和专门资产开发团队。主要运营资本用于扩大临床开发、监管申报和与 SickKids
              等学术医疗中心的医院试验合作，而不是维持昂贵的内部湿实验室合成业务。
            claimRefs:
              - CI004
              - CI007
              - CI009
              - CI010
