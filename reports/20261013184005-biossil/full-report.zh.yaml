      - number: '1.4'
        title: 公司轨迹、战略里程碑与临床开发
        blocks:
          - type: paragraph
            body: >-
              自 2023 年 5 月注册成立以来，Biossil 有计划地推进许可交易和临床研究启动。公司已在五个主要疾病领域取得 12 个搁置分子的权利：镰状细胞病、特发性肺纤维化、胶质母细胞瘤、乳腺癌和阿尔茨海默病。
              重要交易包括 2026 年 7 月从 Summit Therapeutics 收购一款被放弃的艰难梭菌精准抗生素候选药物，前期支付
              US$500,000，另加后续监管和商业里程碑付款。在镰状细胞病领域，Biossil 正为 senicapoc 推进试验；这是一种钾通道阻滞剂，Johnson & Johnson
              曾因其未达到缓解疼痛终点而搁置，但 Biossil 平台发现它可能有效阻止红细胞溶血。 目前，Toronto's Hospital for Sick Children（SickKids）、Centre
              hospitalier de l'Université de Montréal 和 McGill University 正在招募试验受试者；德国 Heidelberg University Hospital
              和丹麦 Aarhus University 也在开展胶质母细胞瘤肿瘤学试验。
