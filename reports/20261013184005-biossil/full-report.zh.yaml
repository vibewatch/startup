      - number: '4.3'
        title: 资本充足性、融资轨迹与估值溢价
        blocks:
          - type: paragraph
            body: >-
              Biossil 的资产负债表在 2026 年获得大幅资本补充，从早期隐身试验阶段进入机构化独角兽阶段。公司此前各轮累计获得 US$70M 股权融资，包括 Founders Fund 于 2024 年领投的
              US$22M 和 Founders Fund 与 OpenAI 于 2025 年联合领投的 US$43M；随后在 2026 年 9 月 28 日完成 US$153M 全股权融资。该交易由 OpenAI
              Startup Fund 领投，联合 Founders Fund、Modern Capital、Golden Ventures、Panache Ventures、Quiet Capital、Duke
              University 捐赠基金和 Abu Dhabi Investment Council 等多元联合体，投后估值达到 $1B。Multiples 的交易跟踪记录显示，公司累计终身股权融资为 $223M。
              2026 年 8 月向 Corporations Canada 提交的一份监管公司文件显示，公司创设了 5.37M 股优先股，每股定价
              US$28.69，将优先股估值推至上一轮融资水平的三重。从资本结构看，管理层没有发行传统公司债务工具，但正在评估结构化表外融资机制，为资本密集型 Phase 2 和 Phase 3
              试验提供资金。虽然这笔资金为近期活跃管线的临床试验带来较长续航，Biossil 的 $1B
              估值倍数仍远高于传统生物科技基准。没有获批商业产品或后期跨国商业分销伙伴的临床阶段生物制药公司很少达到十亿美元级估值，说明市场定价高度依赖其 AI 再定位平台被认为能够处理的项目量。
