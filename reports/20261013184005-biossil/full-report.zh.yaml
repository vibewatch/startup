        - 多轮股权融资中的连续银团领投方
        - 高
        - 下行轮 / 延期融资情景下领投方疲劳或治理冲突
        - 高
        - 引入机构捐赠基金和主权财富基金，扩大投资者银团
        - 早期银团中的稀释悬垂和主导性优先权
      - - 外部临床试验执行
        - 第三方合同研究组织（CRO）
        - 多中心临床运营和患者招募管理
        - 中
        - 运营延误、数据完整性问题或监管方案不合规
        - 高
        - 内部临床运营团队监督和多 CRO 供应商策略
        - 在内部仅 30 人的精简组织架构下，执行脆弱性较高
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
  - id: TV001
    title: 建议总结表
    notes: 综合轮次条款、资本结构披露和按阶段调整的生物科技估值基准形成的尽调判断。
    columns:
      - 维度
      - 评估
      - 证据依据
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 尽管投后估值为 $1.0B，管线仍处于早期，III 期疗效尚未得到证实
        - 在投入资本前跟踪临床进展；当前峰值倍数下避免直接进入
      - - 信心
        - 中
        - 公开报道涵盖轮次条款和优先股类别，但试验读出和单位经济性仍未验证
        - 在升级判断前，要求领军项目提供原始试验数据
      - - 风险评级
        - 高
        - 12 个再利用分子均面临二元临床风险，且尚无商业验证
        - 鉴于试验失败率高、资本密集度高，维持严格的风险敞口上限
      - - 估值立场
        - 偏高
        - $153M 轮次以 $1.0B 投后估值为未经批准的药物组合定价，远高于传统生物科技基准
        - 对二级或前瞻性进入要求大幅折价或结构性下行保护
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV011
  - id: TV002
    title: 正论 / 反论表
    notes: 依据可验证的公司里程碑和反事实风险触发条件，评估关键结构性论点。
    columns:
      - 支柱
      - 正论
      - 反论
      - 什么会改变判断
    rows:
      - - 平台与 AI 选源
        - LLM 系统性扫描已放弃分子和试验数据，识别可挽救候选药物的速度快 70-80%
        - 算法识别无法修复底层生物学问题；再利用分子仍面临标准临床失败率
        - 复活资产的 III 期临床试验读出显示具有统计显著性的疗效
      - - 资本与银团
        - OpenAI Startup Fund 和 Founders Fund 的一线支持带来深厚银团和 $153M 现金跑道
        - 过度依赖 AI 热潮倍数，以及 US$28.69/股的优先股清算优先权悬垂
        - 披露清晰的资本结构，以及非稀释性补助 / 合作伙伴里程碑带来的非股权资金流入
      - - 资产收购成本
        - 以低价收购已放弃分子（例如以 US$500k 前期费用收购 Summit 抗生素），绕过早期研发支出
        - 后续人体临床试验每个项目仍需数千万美元，且 5 个以上疾病领域都会产生大量烧钱
        - 制药交易对手为后期试验成本提供资金的正式共同开发合作
      - - 公司治理
        - 经验丰富的领导层将风险投资策略背景与临床医学和病毒学专长结合起来
        - 五个复杂治疗适应症并行推进激进试验，拉伸运营注意力
        - 以清晰的项目继续 / 终止阶段闸门纪律证明项目优先级排序能力
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV010
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    notes: 以 3 年为期限，对企业价值结果、回报倍数和下行催化剂进行前瞻性情景分析。
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 关键下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - Senicapoc 或 Summit 抗生素达到 III 期主要终点；签署制药许可合作
        - 通过制药收购或 IPO 实现 $2.5B-$3.5B 退出；相对 $1.0B 估值实现 2.5x-3.5x 回报
        - 临床试验延误，或肿瘤 / CNS 项目出现不利安全信号
        - 20% 概率：取决于未经证实的 III 期疗效验证
      - - 基准情景
        - 1-2 个项目显示适度 II 期疗效；现金消耗迫使公司以持平或略低估值进行后续融资
        - $1.0B-$1.2B 估值；在大幅稀释下实现 1.0x-1.2x 资本保值
        - 12 个分子持续高额烧钱，迫使后续下行轮融资
        - 50% 概率：平台潜力被漫长临床周期抵消
      - - 悲观情景
        - 再利用分子在赞助试验中未达到临床终点；AI 筛选溢价崩塌
        - $200M-$400M 清算或 IP 资产甩卖；资本损失 60-80%
        - 投资者对未建立合作的 AI 生物科技平台完全失去兴趣
        - 30% 概率：由临床阶段候选药物历史上 90% 的淘汰率驱动
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV012
      - CV013
