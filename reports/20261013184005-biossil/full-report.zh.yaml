chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与核心运营模式
        blocks:
          - type: paragraph
            body: >-
              Biossil Inc. 是一家 2023 年成立、总部位于加拿大安大略省多伦多的 AI 原生生物制药公司。它不从化学基础出发重新发现分子，而是专门挽救临床上已被放弃的候选药物，走出了一条资产复活路径。
              进入人体临床试验的分子约有九成会失败，常见原因是适应症过窄、试验终点选得不佳或患者队列没有分层，并非生化机制本身存在根本缺陷。Biossil
              用大语言模型扫描数十年的结构化试验记录、监管文件和学术出版物，从中寻找可行的新适应症，接手制药行业丢弃的这批资产。Excavate 计算平台筛出有潜力的分子后，Biossil
              以失败后的折价从原始制药研发商手中收购或取得许可，再由内部负责后续临床开发。这样既绕过多年的早期临床前优化，也大幅压低前期开发支出，同时保留完整资产权益。
            claimRefs:
              - CO001
              - CO004
              - CO005
