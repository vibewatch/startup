      - number: '6.2'
        title: 临床管线部署与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Biossil 的运营模式以临床资产部署、试验推进和分子收购衡量采用情况，而不是客户账户数或软件席位扩张。经过 3 年隐身运营，公司低调积累了 10 个获救药物分子，其中 2 个候选药物进入后期临床试验，3
              个分子正在寻求监管许可进入市场测试。公司活跃试验覆盖 5               个主要疾病适应症：镰状细胞病、特发性肺纤维化、胶质母细胞瘤、乳腺癌和阿尔茨海默病。在 OpenAI 领投、2026 年 9
              月完成 $153M 融资后，公司累计股权资本达到 $223M；Biossil 依托多伦多和波士顿的 30 人团队，扩大临床开发吞吐量并增加候选药物收购。
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU007
              - CU008
