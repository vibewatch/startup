      - number: '4.4'
        title: 财务结论与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              从投资判断角度看，Biossil 呈现出不对称的风险回报：资产收购效率极高，但私人公司运营披露不透明。公司的战略套利是用适度前期对价购买已搁置、通过 Phase 1
              的化学资产，把早期临床失败成本转嫁给原开发商；相比传统生物科技发现公司，这创造了有吸引力的理论单位经济。如果 12 个获救资产中的一小部分——例如镰状细胞病的 senicapoc 或 Summit
              抗生素——能够跨过新适应症的门槛，Biossil 就可能以适度投入取得巨额许可里程碑和特许权使用费回报。 但关键尽调障碍使机构投资者无法严格评估财务状况。Biossil
              的月度现金消耗、试验成本计划和精确的未来续航仍是未披露的私人运营指标。此外，2026 年 9 月融资带来约 1.53
              亿美元新流动股权，但在北美和欧洲学术网络同时推进多项临床试验，必然加快运营现金消耗。在没有披露现金消耗的经审计财务报表，也看不到具有约束力的里程碑负债之前，投资者必须把 Biossil
              看作高倍数临床平台风险投资，而不是资产支持的商业企业；其财务可行性完全取决于近期临床试验读出。
