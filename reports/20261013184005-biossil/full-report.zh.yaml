        title: 资本形成、投资人联合体与估值变化
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月，Biossil 完成由 OpenAI Startup Fund 领投的 US$153M 全股权 Series A 融资，将公司估值推至
              US$1.0B，并成为加拿大最新的科技独角兽。此次融资建立在此前 3 年低调开发期间积累的 US$70M 种子期资本之上，其中包括 Staircase Ventures 于 2023 年领投的 US$3.7M
              首轮种子轮、Peter Thiel 的 Founders Fund 于 2024 年领投的 US$22M 扩展轮，以及 2025 年由 OpenAI 和 Founders Fund 支持的 US$43M
              隐形联合领投轮。 由此形成的股东名册汇集了一级硅谷风险资本、顶尖大学捐赠基金和全球主权财富，投资方包括 Duke University、Abu Dhabi Investment Council、Quiet
              Capital、Modern Capital、Golden Ventures 和 Panache
              Ventures。然而，独立市场分析师指出，一家没有获批商业产品或大型制药共同开发伙伴的临床阶段生物制药公司获得十位数估值，意味着明显溢价；估值能否站住，很大程度取决于即将到来的试验里程碑。
