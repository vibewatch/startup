callouts:
  - calloutType: strength
    title: Capital Efficiency of Repurposing Validated Clinical Molecules
    body: >-
      Biossil's core structural advantage stems from acquiring clinically derisked pharmaceutical assets at post-failure
      discounts, circumventing years of early discovery expense while leveraging OpenAI large language models to
      identify responsive patient sub-populations.
    claimRefs:
      - CO002
      - CO007
  - calloutType: risk
    title: Valuation Premium Dependent on Unproven Platform Translation
    body: >-
      Valued at US$1.0 billion without an approved commercial therapy or reported revenue, Biossil carries a substantial
      valuation premium over traditional clinical-stage biotech peers, creating acute exposure to Phase 2 and Phase 3
      trial readouts across its repurposed indications.
    claimRefs:
      - CO006
      - CO014
