callouts:
  - calloutType: "insight"
    title: "Asset Ownership vs. Software-as-a-Service Business Model"
    body: "Unlike AI biotech platforms that license discovery software or provide screening-as-a-service to incumbent pharmaceutical developers for fee-for-service margins, Biossil takes direct balance sheet ownership of drug assets. This model requires heavy upfront acquisition capital and absorbs significant clinical trial risk, but captures substantial biopharma enterprise value if an abandoned candidate secures regulatory clearance."
    claimRefs:
      - "CM008"
      - "CM010"
      - "CM011"
  - calloutType: "risk"
    title: "Biological Translation Remains Governed by Clinical Trial Attrition"
    body: "While large language models and vector embeddings can dramatically accelerate candidate screening and trial literature parsing, algorithmic selection does not alter fundamental human pharmacology. Rescued molecules remain exposed to the historical 90 percent attrition rate of clinical trials, making rigorous clinical trial execution the ultimate determinant of valuation durability."
    claimRefs:
      - "CM001"
      - "CM009"
      - "CM014"
      - "CM016"
