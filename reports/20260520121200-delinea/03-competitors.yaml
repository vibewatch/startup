  evidenceGaps:
  - type: missing-source
    severity: material
    topic: win-rates
    missingEvidence: Reliable Delinea win-rate and displacement data versus CyberArk, BeyondTrust, Microsoft, and bundle competitors by segment.
    whyItMatters: Competitive positioning remains partly narrative without evidence on actual field outcomes.
    diligencePath: Request field win-rate dashboards, lost-deal analysis, and segment-specific displacement examples from the GTM team.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing-posture
    missingEvidence: Current negotiated pricing bands, implementation scope, and discount levels for Delinea and direct incumbents.
    whyItMatters: Pricing posture is central to whether Delinea wins against bundled or incumbent options.
    diligencePath: Request anonymized quotes, ASP by segment, and implementation SOW benchmarks.
    relatedQuestionRefs:
