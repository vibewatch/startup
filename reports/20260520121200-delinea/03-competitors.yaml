chapter:
  number: 3
  title: Competitors
  summary: 'Delinea’s clearest direct rivals remain CyberArk and BeyondTrust, but the real competitive field is wider: Microsoft, Okta, SailPoint, and Saviynt pressure from broader identity suites, while StrongDM, Teleport, Silverfort, and endpoint-led identity vendors attack from adjacent flanks. Delinea’s advantage is that it still offers recognizable PAM depth while moving toward a broader platform story, yet that middle position is also the main risk because bundles and narrower entrants can squeeze it from both sides. The public record therefore supports a moderate — not dominant — moat.'
sections:
- id: competitive-landscape
  title: 'Landscape: direct incumbents, adjacent suites, and flank entrants'
  body: 'Delinea’s competitive landscape is broader than a simple three-vendor PAM fight, but it still has a recognizable center of gravity. CyberArk and BeyondTrust are the clearest direct incumbents because they sell privileged-access depth as a primary enterprise control category. Around that core sit broader-suite competitors such as Microsoft, Okta, SailPoint, and Saviynt, which can absorb parts of the buying criteria through identity, governance, and threat tooling already present in enterprise estates. A third ring contains flank entrants: CrowdStrike and SentinelOne from endpoint-driven identity security, Teleport and StrongDM from infrastructure access and runtime authorization, Silverfort from agentless identity security, and 1Password from extended-access-management style workforce access. Delinea’s own StrongDM acquisition confirms that management also sees those flank categories as strategically real. The competitive question is therefore not whether Delinea has rivals, but
    which layer of rival it faces in each buying motion.'
