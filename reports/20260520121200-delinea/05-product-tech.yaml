  - type: missing-source
    severity: material
    topic: architecture-depth
    missingEvidence: A deeper public or private architecture map showing Delinea’s core control plane, data stores, eventing, and tenant-isolation design.
    whyItMatters: Feature pages describe outcomes but not enough internal architecture to judge scalability, failure modes, or data-plane risk in detail.
    diligencePath: Request architecture diagrams, trust-architecture review, and engineering walkthroughs covering control plane, data plane, and tenant isolation.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: certification-artifacts
    missingEvidence: SOC 2 reports, FedRAMP package status documents, and any detailed control mappings that are not public today.
    whyItMatters: Headline certifications are helpful, but diligence needs scoped evidence and exceptions to judge trust posture accurately.
    diligencePath: Request SOC 2 report and bridge letter, FedRAMP milestone package, and security-control exception logs.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: integration-depth
    missingEvidence: Implementation-time, support-boundary, and failure-mode details for the named integrations and connectors.
    whyItMatters: Shallow integration summaries do not reveal how hard the system is to deploy or maintain in complex environments.
    diligencePath: Request connector catalog with supported versions, deployment guides, support SLAs, and escalation paths by integration.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: incident-postmortem
    missingEvidence: A detailed root-cause analysis and permanent-control changes for the 2024 Secret Server SOAP API issue.
    whyItMatters: Public reporting confirms the issue, but not the depth of the remediation or residual product-security risk.
    diligencePath: Request postmortem, remediation timeline, secure-SDLC changes, and current exploit-detection controls.
