company:
  name: Delinea
chapter:
  number: 5
  title: Product & Technology
  summary: Delinea’s public product surface supports a real identity-security platform thesis rather than a narrow PAM-only story. The company documents meaningful feature depth in privileged-account discovery, session control, endpoint and server least privilege, identity-threat monitoring, and automation tooling, while also exposing a visible developer ecosystem through SDKs, Terraform, GitHub Actions, and operator CLIs. Its trust posture is comparatively strong in public—99.995% SLA language, SOC 2 Type 2 recertification claims, and an in-progress FedRAMP High path—but public materials still stop short of a true deep architecture disclosure. The result is a platform that looks operationally mature and extensible from the outside, but still needs engineering diligence on internal topology, integration depth, and post-incident controls.
sections:
- id: product-surface-and-core-modules
  title: Product definition and core module map
  body: 'Delinea no longer presents itself as a single privileged-password vault vendor. Its public product surface is now clearly a platform-plus-modules story: identity threat protection, secret discovery and vaulting, session management, server privilege, endpoint privilege, governance controls, remote access, and AI-driven authorization all sit inside the same commercial frame. The product value proposition centers on discovering identities and privileged accounts, applying least privilege, monitoring activity, and responding to threats across cloud and traditional infrastructure. At the module level, the pages are fairly concrete. Identity Threat Protection focuses on continuous monitoring, context building, anomaly detection, and response. Secret Server materials emphasize discovery, dependency mapping, and vaulted access. Privilege Control for Servers and Privilege Manager extend control over operating-system privilege and endpoint applications. The result is a credible module map
    for customers who want both traditional PAM depth and newer identity-security coverage. What remains less public is the exact commercial boundary between these modules: the pages show what exists, but not how much of it is standard, add-on, or deeply integrated at the control-plane level.'
