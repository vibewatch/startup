- id: scale-momentum-and-milestones
  title: Scale, momentum, and milestone trajectory
  body: 'The public operating arc is strong even though not every metric is disclosed with current precision. Delinea closed 2022 with $250 million in ARR and 1,300+ new customers added, then a January 2025 leadership release said the business had passed $350 million in ARR as of Q2 2024 while supporting more than 8,500 organizations worldwide. Two later 2025 releases pushed the picture further: fiscal 2024 ARR was said to be approaching $400 million with 95% recurring revenue, and by August 2025 ARR had surpassed $400 million with SaaS still the majority of the mix. The company paired those financial milestones with operating signals such as 99.995% uptime, 500+ integrations, and 1M+ identities secured daily. Milestones since 2024 also show Delinea expanding on several fronts at once: a global partner program, Mexico City expansion, the FedRAMP High process for Secret Server, new regional leaders in EMEA/APAC, and the StrongDM acquisition to bring runtime authorization into the Delinea
    Platform. Together those milestones support a company that is scaling beyond legacy PAM toward a broader identity-security platform story.'
