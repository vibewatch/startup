  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: Current board roster, committee structure, observer rights, and control-right allocations for Delinea’s post-merger governance.
    whyItMatters: Governance visibility is required to assess key-person risk, sponsor influence, and board-level oversight of any IPO or exit process.
    diligencePath: Request the current board list, committee charters, and governance side letters in management diligence or data room materials.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: valuation-disclosure
    missingEvidence: Post-2021 valuation marks, any 2024 sponsor recapitalization documents, and any current IPO-registration or banker mandate materials.
    whyItMatters: Without a post-2021 public valuation benchmark, it is hard to translate operating momentum into a current valuation stance or exit-readiness judgment.
    diligencePath: Ask management or sponsors for the latest board-approved valuation marks, financing memos, and any draft filing or bank engagement materials.
    relatedQuestionRefs:
    - QO014
    - QO015
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: material
    topic: investor-history
    missingEvidence: Documented evidence showing whether Francisco Partners holds any current Delinea stake or whether its relevance ended before the TPG-led formation.
    whyItMatters: Investor-history accuracy matters for cap-table reconstruction and for understanding which sponsors still influence economics or governance.
    diligencePath: Obtain the current cap table and shareholder ledger from the company or sponsor to confirm any legacy holdovers from predecessor owners.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: minor
    topic: customer-scale
    missingEvidence: A current exact customer-count disclosure for 2025 or 2026 and any segmentation by enterprise, mid-market, and public-sector cohort.
    whyItMatters: Public sources support meaningful scale, but customer concentration and logo distribution still matter for renewal quality and enterprise durability.
    diligencePath: Request a current customer-count bridge, top-customer concentration, and cohort retention metrics from management.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: minor
    topic: hq-headcount-reconciliation
    missingEvidence: A management-confirmed headquarters definition and current employee count reconciled against conflicting third-party directories.
    whyItMatters: Conflicting location and headcount signals complicate benchmarking of operating maturity, geographic mix, and public-company readiness.
    diligencePath: Ask management for the current corporate address, total employees by region, and the preferred external reference profile to use.
    relatedQuestionRefs:
    - QO003
    - QO020
    relatedTableRefs:
    - TO001
