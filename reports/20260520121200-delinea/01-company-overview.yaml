company:
  name: Delinea
chapter:
  number: 1
  title: Company Overview
  summary: Delinea is a TPG-backed identity-security platform created from the 2021 Thycotic/Centrify combination and launched under the Delinea brand in 2022. Current official sources show a broader platform story built on centralized authorization, Delinea Iris AI, and legacy PAM anchors such as Secret Server and Privilege Manager, while 2025 releases show ARR moving from roughly $400 million to above $400 million. The main unresolved overview issues are exact current customer count, board and cap-table transparency, whether any post-2021 valuation reset has occurred, and the significance of recurring product-security advisories after the 2024 disclosure controversy.
sections:
- id: identity-origin-and-product-scope
  title: Identity, origin, and product scope
  body: 'Delinea’s current official story is broader than traditional privileged access management. The about page, platform pages, and 2025-2026 releases describe an identity security control plane built around centralized authorization, Delinea Iris AI, and continuous governance across human, machine, and AI identities. That broader platform claim matters because the company still monetizes a recognizable PAM portfolio underneath it: Secret Server, Privilege Manager, Cloud Suite/Server PAM, DevOps Secrets Vault, Identity Threat Protection, and related control modules are all still live products or transition-era offerings. The company’s origin story also needs precision. Official launch materials say Delinea was formed in April 2021 from the Thycotic/Centrify merger and then publicly launched the Delinea brand in February 2022. Older dates such as 1999 or 2004 appear in third-party databases, but those look more like predecessor or legal-lineage artifacts than the clean commercial start
    date for the merged Delinea brand.'
