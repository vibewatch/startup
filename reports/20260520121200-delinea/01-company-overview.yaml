- id: leadership-governance-and-footprint
  title: Leadership, governance, and operating footprint
  body: 'The leadership record supports continuity at the top but also shows meaningful GTM and finance evolution. Art Gilliland has remained the clearest public face of the company from the merger period through the 2025-2026 growth releases, while James Legg initially served as president of the merged business before handing the role to Rick Hanson in 2022 and then to Chris Kelly in 2025 for go-to-market leadership. Stephanie Reiter emerges as the public financial voice in the 2025 ARR releases, and the reviewed company announcements also identify legal, product, channel, and regional expansion leaders across the post-merger bench. Governance visibility is weaker. Public materials name Pascal Van Dooren as a board member in 2021, but the current board roster and any observer or sponsor-control terms are not disclosed in reviewed public sources. Physical-footprint evidence is also imperfect: current directory-style profiles point to San Francisco, while earlier official releases used Redwood
    City and Washington, DC datelines. The practical conclusion is that San Francisco is the best-supported current HQ, but location history should be treated as a moving target rather than a single timeless fact.'
