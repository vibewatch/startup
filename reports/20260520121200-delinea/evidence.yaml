evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      Current board roster, committee structure, observer rights, and control-right allocations for Delinea’s
      post-merger governance.
    whyItMatters: >-
      Governance visibility is required to assess key-person risk, sponsor influence, and board-level oversight of any
      IPO or exit process.
    diligencePath: >-
      Request the current board list, committee charters, and governance side letters in management diligence or data
      room materials.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: valuation-disclosure
    missingEvidence: >-
      Post-2021 valuation marks, any 2024 sponsor recapitalization documents, and any current IPO-registration or banker
      mandate materials.
    whyItMatters: >-
      Without a post-2021 public valuation benchmark, it is hard to translate operating momentum into a current
      valuation stance or exit-readiness judgment.
    diligencePath: >-
      Ask management or sponsors for the latest board-approved valuation marks, financing memos, and any draft filing or
      bank engagement materials.
    relatedQuestionRefs:
      - QO014
      - QO015
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: investor-history
    missingEvidence: >-
      Documented evidence showing whether Francisco Partners holds any current Delinea stake or whether its relevance
      ended before the TPG-led formation.
    whyItMatters: >-
      Investor-history accuracy matters for cap-table reconstruction and for understanding which sponsors still
      influence economics or governance.
    diligencePath: >-
      Obtain the current cap table and shareholder ledger from the company or sponsor to confirm any legacy holdovers
      from predecessor owners.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: customer-scale
    missingEvidence: >-
      A current exact customer-count disclosure for 2025 or 2026 and any segmentation by enterprise, mid-market, and
      public-sector cohort.
    whyItMatters: >-
      Public sources support meaningful scale, but customer concentration and logo distribution still matter for renewal
      quality and enterprise durability.
    diligencePath: Request a current customer-count bridge, top-customer concentration, and cohort retention metrics from management.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: hq-headcount-reconciliation
    missingEvidence: >-
      A management-confirmed headquarters definition and current employee count reconciled against conflicting
      third-party directories.
    whyItMatters: >-
      Conflicting location and headcount signals complicate benchmarking of operating maturity, geographic mix, and
      public-company readiness.
    diligencePath: >-
      Ask management for the current corporate address, total employees by region, and the preferred external reference
      profile to use.
    relatedQuestionRefs:
      - QO003
      - QO020
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: delinea-sam
    missingEvidence: >-
      A CFO-grade breakdown of Delinea revenue or customer mix across classic PAM, platform bundles, AI identity, and
      adjacent governance workflows.
    whyItMatters: >-
      Without segment revenue mix, a Delinea-specific SAM or SOM remains much less precise than the headline IAM or PAM
      market estimates suggest.
    diligencePath: Request product-line revenue mix, attach rates, and average contract values by module during management diligence.
    relatedQuestionRefs:
      - QM010
      - QM024
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-estimates
    missingEvidence: >-
      A reconciled market-boundary memo that explains how each public IAM estimate treats PAM, CIAM, IGA, machine
      identity, and services.
    whyItMatters: Headline market numbers differ enough to distort valuation narratives if the denominator is not normalized.
    diligencePath: >-
      Normalize third-party estimates into software-only, broader IAM, and workflow-adjacent layers before using them in
      valuation work.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: deployment-benchmark
    missingEvidence: >-
      Independent implementation benchmarks for Delinea deployment time, staffing needs, and realized TCO versus
      CyberArk and BeyondTrust.
    whyItMatters: >-
      Go-to-market claims about faster deployment and lower resource intensity matter if ease of deployment is part of
      the market-adoption thesis.
    diligencePath: >-
      Request implementation case studies, system-integrator references, and third-party benchmark surveys with
      disclosed methodology.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Buyer interviews or procurement data showing how identity-security budgets are split among security, IAM, cloud,
      and compliance teams.
    whyItMatters: >-
      Budget ownership determines sales motion, sales-cycle length, and how vulnerable Delinea is to broader-suite
      bundling.
    diligencePath: Collect buyer interviews, RFPs, and partner channel feedback by vertical and company size.
    relatedQuestionRefs:
      - QM013
      - QM011
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: passwordless-vintage
    missingEvidence: >-
      A more recent cross-industry survey on passwordless transition timing and legacy constraints than Delinea’s 2023
      study.
    whyItMatters: >-
      The adoption-friction story is probably still valid, but investors should avoid over-weighting a 2023 sentiment
      snapshot in a 2026 run.
    diligencePath: Refresh with a 2025 or 2026 neutral survey or customer-interview sample on identity modernization blockers.
    relatedQuestionRefs:
      - QM019
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: win-rates
    missingEvidence: >-
      Reliable Delinea win-rate and displacement data versus CyberArk, BeyondTrust, Microsoft, and bundle competitors by
      segment.
    whyItMatters: Competitive positioning remains partly narrative without evidence on actual field outcomes.
    diligencePath: >-
      Request field win-rate dashboards, lost-deal analysis, and segment-specific displacement examples from the GTM
      team.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing-posture
