      - number: '2.2'
        title: 'Sizing lenses: bullish demand, messy denominators'
        blocks:
          - type: paragraph
            body: >-
              Public market estimates are directionally supportive but methodologically inconsistent. MarketsandMarkets
              puts IAM at roughly $26 billion in 2025 and $42.6 billion by 2030, while The Business Research Company
              shows $21.8 billion in 2025 and $25.2 billion in 2026 before reaching $45.2 billion by 2030. Identity
              Management Institute offers a separate more-than-$24 billion 2025 framing, and ISMG cites a much larger
              $61.7 billion figure by 2032. Research and Markets broadens the lens further with explicit TAM work,
              supply-chain analysis, and privileged access governance. None of those numbers is necessarily wrong, but
              they are not interchangeable. Some describe broad IAM, some emphasize software plus governance, and some
              lean heavily into future-adjacent categories such as non-human identity and AI-driven access. For Delinea,
              the clean conclusion is to preserve the range and resist false precision. The company clearly sits in a
              growing identity-control market, but open sources do not isolate a defensible Delinea-specific SAM or SOM.
