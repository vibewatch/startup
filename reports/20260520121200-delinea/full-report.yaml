      - number: '1.5'
        title: Adverse signals and remaining diligence questions
        blocks:
          - type: paragraph
            body: >-
              The clearest overview-level adverse signal is product-security process risk. SecurityWeek and Dark Reading
              both reported that Delinea appeared to ignore or inadequately handle weeks of responsible-disclosure
              outreach before a critical Secret Server SOAP API flaw became public in April 2024. NVD later documented
              CVE-2024-33891 as an authentication-bypass issue with high CNA severity, and Delinea’s own advisory page
              shows that Secret Server and Cloud Suite continued to accumulate additional CVEs in 2025 and 2026. That
              does not negate the business momentum described above; the company has also been public about advisories
              and has pursued FedRAMP High for Secret Server. But it does mean the downside case is not just
              theoretical. Public evidence still leaves major overview questions unresolved: exact current customer
              count, current board composition, post-2021 ownership percentages, and whether any 2024 sponsor
              recapitalization occurred. Those are material because they affect valuation confidence, exit-readiness
              assessment, and how much operational strength should be discounted for disclosure opacity.
