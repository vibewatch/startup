      - number: '5.2'
        title: Workflow, automation, and integration architecture
        blocks:
          - type: paragraph
            body: >-
              The most useful way to read Delinea’s technology is as an operating workflow rather than as a marketing
              feature list. Discovery finds privileged accounts, service accounts, and cloud identities; policy and
              least-privilege layers constrain what those identities can do; session controls proxy, monitor, and record
              risky activity; integrations connect Delinea into directory services, ticketing, SIEM, malware scanning,
              and other enterprise systems; and automation hooks let practitioners operationalize those controls in
              scripts and infrastructure pipelines. The technical-docs pages are strong on these workflow outcomes.
              Secret Server documents multicloud discovery and scriptable PowerShell extensions. Session-management
              pages document RDP and SSH proxying, real-time intervention, and searchable recording. Privilege Manager
              documents integration with Active Directory, ServiceNow, Secret Server, VirusTotal, SIEM, and SCCM, while
              enterprise-readiness materials add a public API, high availability, reverse proxying, and mobile
              administration. Still, the architecture stops short of a true deep dive. Public materials say enough to
              understand the workflow and dependency shape, but not enough to map internal services, event buses, or
              data-plane boundaries with precision.
