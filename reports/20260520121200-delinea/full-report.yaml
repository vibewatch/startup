    sections:
      - number: '6.1'
        title: Customer footprint and segment visibility
        blocks:
          - type: paragraph
            body: >-
              Delinea’s public customer evidence is much stronger than a bare logo wall, but it is still shaped by what
              the company chooses to showcase. The strongest pattern is segment quality, not precise cohort math. Public
              case studies and customer materials repeatedly place Delinea inside environments where privileged access,
              auditability, and compliance are material operating concerns: manufacturing IT operations at Robert Weed,
              retail and third-party access control at Boyner, Oracle Cloud SOX controls at The Trade Desk, J-SOX and
              critical infrastructure at TEPCO Systems, and public-company SOX reporting at SBA Communications. The
              broader case-study library extends that picture into telecom, mobility, media, travel, channel, and
              housing. That mix suggests Delinea wins where privileged-access control is tied to business continuity,
              audit defense, or regulated operations rather than where a buyer is simply shopping for a basic password
              vault. The open web therefore supports a diversified enterprise and upper-midmarket footprint, but it does
              not yet support a precise mix between SMB, mid-market, and enterprise revenue. Delinea’s dated public
              count of more than 8,500 organizations gives a floor for installed-base scale, yet the absence of a
              fresher count means the customer chapter has to focus more on proof quality and segment pattern than on
              current raw-account volume.
