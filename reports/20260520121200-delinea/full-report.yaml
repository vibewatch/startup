  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, privacy, and contract risk
        blocks:
          - type: paragraph
            body: >-
              Delinea’s public legal and privacy surfaces show a real compliance burden, not a generic cybersecurity
              boilerplate. The privacy policy says the company processes personal information across marketing, events,
              customer support, community forums, billing, and cloud-service delivery, and it explicitly references
              GDPR, CCPA, international transfers, and a processor role governed by the DPA. California and EU guidance
              raise the stakes further: CCPA creates deletion, correction, opt-out, and certain breach-liability rights,
              while EU data-protection guidance emphasizes binding GDPR obligations and cross-border transfer
              safeguards. Delinea’s public contracts are also materially relevant to risk. The terms of use choose
              California venue and broadly disclaim warranties and consequential damages for site-related materials. The
              MSLA is more operationally important: annual prepayment, auto-renewals, usage reporting, audit rights, and
              channel-partner purchase mechanics all create potential friction around renewals, billing, and disputes.
              None of this proves Delinea has suffered material enforcement or litigation, but it does prove the company
              operates inside a meaningful privacy-and-contract risk envelope. The correct underwriting conclusion is
              not that Delinea has a known legal problem; it is that the legal and regulatory obligations are visible
              while actual enforcement history remains incompletely disclosed.
            claimRefs:
