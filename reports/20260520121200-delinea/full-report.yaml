      - number: '7.2'
        title: Operational, security, and availability risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Delinea’s own surfaces show a more nuanced picture than its marketing posture alone. The
              DPA, trust center, and status center collectively show a mature control stack, but also a business exposed
              to the standard failure modes of modern identity-security SaaS. The DPA lays out multitenancy, annual
              assessments, third-party pentests, shared responsibility, and heavy use of AWS and Azure. Those are real
              mitigants. But the trust center also lists multiple recent Cloud Suite and Privileged Access Service
              vulnerabilities, including a 2026 SQL injection issue scored at CVSS 9.3, and it reminds on-prem customers
              that host-level compromise can expose both application data and encryption keys. Independent reporting and
              NVD preserve the memory of the 2024 Secret Server disclosure controversy, which matters because
              vendor-response quality is part of the product promise in security software. The status center proves the
              availability side is also real: emergency certificate rotation, EU secret-launch failures tied to a cloud
              provider outage, and US login timeouts tied to an upstream network-provider disruption all happened in May
              2026. Delinea has meaningful mitigations—regional hosting, uptime commitments, trust-center notices, and
              formal maintenance communication—but the open-web record still supports security-process and availability
              risk as top-tier residual exposures.
