        blocks:
          - type: paragraph
            body: >-
              Overview-level ownership evidence points first to TPG, not to a broad late-stage venture syndicate. The
              2021 combination release says TPG acquired Thycotic from Insight Partners, had already completed the
              Centrify acquisition, and combined the two businesses with minority support from Thoma Bravo and PSP
              Investments. Third-party profiles reinforce that story. Crunchbase records a $1.4 billion TPG acquisition
              benchmark in March 2021, Mergr separately logs a January 2021 acquisition from Thoma Bravo and Golub
              Capital, and PitchBook’s preview now labels Delinea private-equity-backed and in IPO registration. What
              public sources do not provide is equally important: the reviewed materials do not substantiate the
              prompt’s asserted 2024 TPG strategic growth investment, nor do they verify a current Francisco Partners
              stake in Delinea. Market-data sources also disagree on capital history and valuation, ranging from
              private-equity ownership narratives to legacy venture-round artifacts and low-confidence valuation
              estimates. The safest underwriting stance is that Delinea is a sponsor-backed private company with a
              strong historical control benchmark and current IPO signaling, but without a newly disclosed post-2024
              public valuation mark.
