companyProfile:
  summary: >-
    Delinea is a sponsor-backed identity-security platform created from the 2021 Thycotic/Centrify combination and
    relaunched under the Delinea brand in 2022. Public materials show a broad product surface spanning privileged access
    management, authorization, remote access, governance, and secrets workflows, anchored by products such as Secret
    Server, Privilege Manager, Fastpath, and newer AI-driven authorization capabilities. As of 2025, the company
    publicly described ARR above $400 million, a SaaS-majority mix, more than 8,500 organizations disclosed in prior
    milestone materials, and continued platform expansion through channel investment and acquisitions. What remains
    private are the most important underwriting details: current valuation, capital structure, retention quality, and
    audited unit economics.
  foundedDate: '2021-04-01'
  foundingLocation: Sponsor-led Thycotic/Centrify combination
  headquarters: San Francisco, California, USA
  productSummary: >-
    Identity-security platform covering privileged access management, endpoint and server privilege, remote access,
    identity threat protection, governance controls, secrets management, and AI-driven authorization across human and
    machine identities.
  customerFocus: >-
    Enterprise and upper-midmarket organizations with privileged-access, audit, compliance, and hybrid-infrastructure
    needs; public proof spans manufacturing, retail, utilities, telecom, media, and finance-control environments.
  businessModel: >-
    Predominantly recurring enterprise software sold through direct and partner channels; public evidence points to a
    SaaS-majority mix with quote-led packaging and module cross-sell across PAM, authorization, governance, and adjacent
    controls.
  stage: Sponsor-backed private company with IPO-registration-style signals but no current public price
  fundingStatus: >-
    Historical public benchmark: TPG acquisition at $1.4B in 2021. Current valuation, debt, and preference stack remain
    undisclosed in reviewed public sources.
