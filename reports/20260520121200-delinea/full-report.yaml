  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct incumbents, adjacent suites, and flank entrants'
        blocks:
          - type: paragraph
            body: >-
              Delinea’s competitive landscape is broader than a simple three-vendor PAM fight, but it still has a
              recognizable center of gravity. CyberArk and BeyondTrust are the clearest direct incumbents because they
              sell privileged-access depth as a primary enterprise control category. Around that core sit broader-suite
              competitors such as Microsoft, Okta, SailPoint, and Saviynt, which can absorb parts of the buying criteria
              through identity, governance, and threat tooling already present in enterprise estates. A third ring
              contains flank entrants: CrowdStrike and SentinelOne from endpoint-driven identity security, Teleport and
              StrongDM from infrastructure access and runtime authorization, Silverfort from agentless identity
              security, and 1Password from extended-access-management style workforce access. Delinea’s own StrongDM
              acquisition confirms that management also sees those flank categories as strategically real. The
              competitive question is therefore not whether Delinea has rivals, but which layer of rival it faces in
              each buying motion.
