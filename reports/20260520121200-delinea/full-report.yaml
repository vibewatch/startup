    type: bar
    layout: wide
    summary: >-
      Sensitivity of Delinea’s implied enterprise value to different revenue multiples using the public >$400M ARR
      milestone as the base.
    notes: >-
      This is intentionally simple. It shows how much the conclusion depends on multiple selection when price and
      capital structure are private.
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV012
    data:
      xAxis: Revenue / ARR multiple applied to $400M public ARR milestone
      yAxis: Implied enterprise value (USD million)
      items:
        - label: Bear floor — 4x
          value: 1600
          note: Weak retention, lower-quality economics, or heavy structure discount.
        - label: Low — 5.5x
          value: 2200
          note: Lower-end identity-platform outcome near bear-case ceiling.
        - label: Base low — 7x
          value: 2800
          note: Discounted but credible identity-security valuation.
        - label: Base high — 10x
          value: 4000
          note: Upper end of disciplined base case.
        - label: Sector premium — 13.8x
          value: 5520
          note: Multiples.vc cybersecurity median.
        - label: CyberArk-like — 15.9x
          value: 6360
          note: Premium public security benchmark; likely too generous without better disclosure.
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Historical benchmark and future scenario ranges for Delinea based on public-only valuation framing.
    notes: >-
      Ranges are scenario EVs, not guaranteed outcomes or equity values. The 2021 point is shown only as a historical
      anchor.
    claimRefs:
      - CV002
      - CV011
      - CV012
    data:
      items:
        - label: Historical 2021 benchmark
          low: 1400
          high: 1400
          unit: USD million
          note: Crunchbase transaction benchmark for the TPG acquisition.
        - label: Bear case
          low: 1600
          high: 2200
          unit: USD million
          note: 4.0x–5.5x on ~$400M ARR with weaker quality or structure drag.
        - label: Base case
          low: 2800
          high: 4000
          unit: USD million
          note: 7.0x–10.0x on ~$400M ARR with acceptable but not premium economics.
        - label: Bull case
          low: 5000
          high: 6400
          unit: USD million
          note: 12.5x–16.0x on >$400M ARR if Delinea proves premium-quality and exit-ready.
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scoring of Delinea’s investability based on public information only.
    notes: >-
      Low scores on valuation clarity and evidence quality reflect missing information, not a claim that operating
      quality is necessarily weak.
    claimRefs:
      - CV017
      - CV018
      - CV020
      - CV022
    data:
      items:
        - label: Market / Category Relevance
          value: 4 / 5
          note: Identity security remains a strategically important software category with premium public comps.
        - label: Product / Customer Proof
          value: 4 / 5
          note: Prior chapters support real platform breadth and named customer production use.
        - label: Competitive Moat
          value: 3 / 5
          note: Good category positioning, but not enough public proof to score near best-in-class.
        - label: Financial Visibility
          value: 2 / 5
          note: ARR milestone is helpful, but NRR, gross margin, debt, and cash flow remain private.
        - label: Valuation Clarity
          value: 1 / 5
          note: Current price is effectively unknown from public evidence.
        - label: Evidence Quality
          value: 2 / 5
          note: Peer framing exists, but too many critical inputs still require management materials.
        - label: Exit Readiness
          value: 2 / 5
          note: IPO or sponsor exit is plausible, yet public evidence does not disclose timing or process quality.
