  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and what Delinea is really selling
        blocks:
          - type: paragraph
            body: >-
              The first analytical task is not picking a TAM number but defining the right market. Delinea’s own
              platform story is no longer a simple password-vault story. Current product pages and platform collateral
              frame the company as an identity-security platform spanning human, machine, and AI identities, with
              centralized authorization and platformization as the strategic wedge. That creates a layered market
              position. Delinea still competes in classic privileged access management, but it also reaches into broader
              identity governance, non-human identity, and workflow-control budgets. Competitor framing supports that
              interpretation: CyberArk and Okta both position identity more broadly than vaulting, and Microsoft Entra
              places hybrid identity and governance in the same decision set. The practical implication is that the
              relevant market is narrower than the full IAM universe yet broader than legacy PAM alone. Buyers can also
              substitute native identity tools, scattered MFA and password controls, or governance suites before they
              buy a dedicated Delinea-like platform.
