            body: >-
              Delinea’s public trust posture is stronger than its public architecture depth. The platform SLA explicitly
              describes the Delinea Platform as a multi-tenant SaaS service and commits it to 99.995% availability
              across the regions where it is offered. The same document sets out service-credit remedies and references
              a public status page, which is consistent with a mature SaaS operating model. On certifications, Delinea
              says it is SOC 2 Type 2 recertified across six products and that Secret Server has entered the FedRAMP
              High authorization process for the public sector. Those signals matter commercially because they are often
              part of enterprise security procurement, but they are still summary-level signals rather than full audit
              transparency. The adversarial view is also real: SecurityWeek reported the April 2024 incident and NVD
              lists CVE-2024-33891 against Secret Server’s SOAP API. Together, those sources show a company with
              meaningful trust infrastructure and a visible disclosure surface, but not an absence of risk. For
              diligence, that means Delinea looks credible on compliance posture while still requiring deeper review of
