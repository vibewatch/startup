      - number: '3.4'
        title: Switching costs, multi-homing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The durable part of Delinea’s competitive position is not raw branding; it is the cost of replacing
              policies, privileged-account discovery, integrations, and governance processes once they are embedded.
              That creates meaningful but not impregnable switching costs. Buyers can and likely do multi-home Delinea
              with Microsoft, endpoint ITDR, or engineering-access tools, which means Delinea often competes as one
              control layer inside a larger stack rather than as the whole stack. That pattern cuts both ways: it helps
              Delinea coexist, but it also means some value can be squeezed by bundled platforms over time. Public
              sources do not yet show reliable win-rate or pricing evidence, so the safest conclusion is moderate moat
              durability. Delinea’s strongest defense is to stay clearly better than bundles on privileged-depth and
              clearly broader than point tools on identity-security platform value. Execution discipline in migrations,
              partner enablement, and customer expansion likely matters too. If it fails on either front, the middle
              layer becomes easier to commoditize.
