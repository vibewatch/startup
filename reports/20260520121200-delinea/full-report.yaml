      - number: '3.2'
        title: 'Competitor profiles: who wins which type of account'
        blocks:
          - type: paragraph
            body: >-
              The most useful competitor split is by account type and buyer framing rather than by vendor logo alone.
              CyberArk is strongest when the buyer wants a mature vault-first privileged-access stack with enterprise
              heritage. BeyondTrust competes when buyers want an equally broad PAM platform and trust its integrated
              positioning. Microsoft becomes most dangerous when the buyer already has enough Entra and Defender
              capability inside existing contracts, especially if the project is framed as identity protection or hybrid
              access rather than specialized PAM. Okta, SailPoint, and Saviynt matter more when governance and lifecycle
              control dominate the discussion. StrongDM and Teleport matter most in engineering-led access decisions,
              while Silverfort attacks with an agentless architectural story. Delinea’s best fit is the buyer who still
              values PAM depth but increasingly wants a wider identity-security platform without defaulting entirely to
              bundle-heavy suites.
