- id: people-and-model-risk
  title: People, execution, and financial-model risk
  body: 'The final risk bucket is execution under opacity. Delinea’s public releases show significant momentum—ARR above $400 million, continued service and customer-success investment, acquisitions, channel growth, and public-sector ambition—but none of that comes with the disclosure depth public investors would expect from a listed peer. CyberArk’s SEC filing is a useful benchmark because it shows how much more transparently a public identity-security vendor discusses recurring revenue, support and cloud cost drivers, and risk factors. Delinea does not provide that level of detail publicly. The company has also moved through meaningful GTM leadership transitions: James Legg to Rick Hanson, then later to Chris Kelly, alongside continuing hires in channels, services, and customer success. That can be healthy scaling, but it is still operating change. The key risk is therefore less about one single broken metric and more about cumulative execution load: integrating acquisitions, scaling partners,
    managing availability, satisfying privacy obligations, and preserving customer trust while disclosure remains partial. If that bundle of tasks goes well, the same changes can deepen Delinea’s moat; if it goes poorly, the downside will likely appear first in support burden, slower renewals, or delayed public-sector and cross-sell execution rather than in one dramatic headline event.'
