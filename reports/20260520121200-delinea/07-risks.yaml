  evidenceGaps:
  - type: missing-source
    severity: material
    topic: regulatory / legal risk register coverage
    missingEvidence: Litigation, enforcement, and privacy-complaint history beyond the public policies and generic regulator guidance reviewed here.
    whyItMatters: Privacy and contract obligations are visible, but the public record still does not show whether Delinea has faced enforcement or customer-dispute patterns tied to them.
    diligencePath: Request litigation list, regulatory inquiries, privacy complaints, and material customer disputes for the last five years.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR001
  - type: missing-metric
    severity: material
    topic: partner and concentration dependence
    missingEvidence: Partner-sourced bookings mix, distributor concentration, top-customer revenue concentration, and public-sector revenue share.
    whyItMatters: The public record shows meaningful partner and public-sector dependence paths, but not their actual financial weight.
    diligencePath: Request channel mix, top distributors, top customers, public-sector ARR, and renewal dependence by segment.
    relatedQuestionRefs:
    - QR021
    - QR022
    - QR024
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: acquisition integration milestones
    missingEvidence: Detailed integration plans, codebase rationalization milestones, retention of acquired teams, and synergy progress for Fastpath and StrongDM.
    whyItMatters: The acquisitions enlarge Delinea’s platform and TAM, but also raise real integration and execution risk that public launch narratives do not resolve.
    diligencePath: Request product integration roadmap, employee-retention stats, cross-sell metrics, and integration KPI scorecards.
    relatedQuestionRefs:
    - QR013
    relatedTableRefs:
    - TR004
  - type: missing-metric
    severity: critical
    topic: financial model opacity
    missingEvidence: Audited cash, debt, burn, insurance coverage, NRR, gross margin bridge, and incident-cost history.
    whyItMatters: Public ARR growth alone is not enough to underwrite the downside transmission of outages, compliance cost, acquisition integration, or customer-trust events.
    diligencePath: Request audited financial statements, debt schedule, cyber-insurance coverage, incident-cost ledger, and NRR/churn metrics.
    relatedQuestionRefs:
    - QR015
    - QR016
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: people succession depth
    missingEvidence: Succession plans for GTM, services, security, and product leadership plus attrition data across acquired teams.
    whyItMatters: The public record shows leadership transitions and continued hiring, but not whether the bench is deep enough for the pace of integration and expansion.
    diligencePath: Request org charts, succession plans, regretted attrition, and acquired-team retention.
    relatedQuestionRefs:
    - QR029
    - QR014
    relatedTableRefs:
    - TR004
