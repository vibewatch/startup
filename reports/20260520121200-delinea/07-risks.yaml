- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Security-process risk
    - High-severity vulnerability cadence
    - Another externally reported disclosure breakdown or exploitable high-severity CVE cluster without convincing postmortem
    - Escalate diligence; downgrade confidence until process repair is evidenced
  - - Cloud availability risk
    - Customer-facing outage frequency
    - Repeated regional outages or connector disruptions within a short window
    - Reassess uptime claims and support-cost assumptions
  - - FedRAMP / public-sector execution risk
    - Authorization milestone slippage
    - FedRAMP stalls without clear next milestone or UberEther execution issues emerge
    - Reduce public-sector upside and treat government motion as option value only
  - - Acquisition integration risk
    - Missed product-integration milestones
    - Fastpath or StrongDM integration slips materially or cross-sell remains weak
    - Lower platform-thesis confidence and adjust valuation for product sprawl
  - - Channel dependence risk
    - Partner-sourced pipeline quality
    - Distributor expansion adds low-conversion pipeline or partner churn
    - Demand direct-sales productivity proof before crediting channel growth
  - - Model-opacity risk
    - Disclosure remains thin in diligence
    - Management cannot produce audited retention, margin, debt, and incident-cost data
    - Treat opacity itself as a thesis break for aggressive underwriting
  notes: 'These kill criteria are designed for diligence use: each trigger is something management can either satisfy with data or fail with continuing opacity.'
