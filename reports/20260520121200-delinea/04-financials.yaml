- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact
  - Why it matters
  - Exact diligence path
  rows:
  - - Audited ARR and revenue bridge
    - Blocking
    - Needed to reconcile company milestones with external databases and to anchor valuation work
    - Request quarterly ARR / revenue bridge by product, region, and deployment model
  - - NRR, GRR, and renewal rates
    - Blocking
    - Without retention quality, ARR scale alone may overstate underlying health
    - Request cohort retention tables and renewal by segment
  - - Gross-margin bridge
    - Material
    - Public margin language is qualitative only
    - Request audited gross-margin detail across subscription, services, and support
  - - Cash, debt, and runway
    - Blocking
    - Capital adequacy cannot be modeled from sponsor ownership alone
    - Request latest balance sheet, debt schedule, and operating cash forecast
  - - CAC, payback, and sales efficiency
    - Material
    - Growth investment may be productive or expensive; public evidence cannot tell
    - Request pipeline conversion, CAC, payback, and quota attainment by segment
  - - Services revenue and margin
    - Material
    - Implementation load can distort software economics and deployment scalability
    - Request services P&L, utilization, and attach rate by product family
  notes: These are the main blockers to underwriting Delinea as a private identity-security software investment on public information alone.
