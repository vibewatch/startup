  name: Delinea
chapter:
  number: 4
  title: Financials
  summary: Public evidence suggests Delinea is now a sizeable recurring-revenue identity-security vendor with ARR above $400 million by the first half of 2025, a SaaS-majority mix, and an active strategy of product broadening, channel expansion, and cloud delivery investment. But the company remains privately held and sponsor-backed, so the metrics that matter most for underwriting—cash, debt, burn, NRR, CAC, and audited gross margin—remain undisclosed. The result is a strong public signal on revenue quality and growth momentum, paired with only a partial view on efficiency and capital adequacy.
sections:
- id: revenue-model-and-packaging
  title: Revenue model, packaging, and monetization posture
  body: 'Delinea’s public commercial surface looks like a recurring enterprise-software model built around multiple sellable control layers rather than one monolithic password-vault product. The company markets a platform, packaged bundles, and distinct module families such as Server Suite, Privileged Remote Access, Fastpath Access Control, and AI-driven authorization. That matters financially because it creates several credible ways to grow recurring revenue: land on core PAM, add adjacent authorization or governance modules, and expand accounts as cloud, compliance, and machine-identity requirements widen. Public pages do not publish usable list prices, which strongly suggests Delinea still sells primarily through quote-led enterprise contracts, demos, trials, partners, and negotiated scopes. That is common for upper-midmarket and enterprise cybersecurity, but it means the open web is not enough to derive ASP or discount behavior. The best public conclusion is therefore structural rather
    than precise: Delinea likely enjoys subscription-heavy revenue quality and cross-sell potential, but realized pricing remains a diligence item rather than a solved public fact.'
