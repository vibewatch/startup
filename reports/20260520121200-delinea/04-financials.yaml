  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: realized-pricing
    missingEvidence: Actual contract pricing, discount ladders, average contract value, and module attach rates by segment.
    whyItMatters: Without realized pricing, revenue mix and sales-efficiency analysis remain directional rather than underwriteable.
    diligencePath: Request anonymized quotes, current pricing book, and ASP / ACV data by segment and geography.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash balance, debt stack, covenant terms, monthly burn, and management runway plan.
    whyItMatters: Capital adequacy cannot be assessed from ARR milestones alone, especially under private-equity ownership and acquisition activity.
    diligencePath: Request board-approved operating plan, latest balance sheet, debt schedule, and runway scenarios.
    relatedQuestionRefs:
    - QI019
    - QI021
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Net revenue retention, gross revenue retention, CAC, CAC payback, and services gross margin.
    whyItMatters: These metrics determine whether ARR growth is efficient, durable, and margin-accretive.
    diligencePath: Request cohort retention, pipeline-to-close metrics, fully loaded CAC, segmented gross-margin bridge, and a breakout of professional-services revenue and margin.
    relatedQuestionRefs:
    - QI006
    - QI012
    - QI024
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: review-price-pressure
    missingEvidence: Independent pricing and implementation surveys specific to Delinea rather than the PAM category broadly.
    whyItMatters: Category review sites show evaluation friction but not enough precision to model price pressure or time-to-value.
    diligencePath: Collect customer interview transcripts, quote win/loss notes, and partner discounting data.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI002
  - type: missing-source
    severity: material
    topic: database-reliability
    missingEvidence: A reconciled management-approved history of revenue, ownership, employee count, and acquisitions to replace conflicting databases.
    whyItMatters: Public databases disagree enough that using them without reconciliation could distort underwriting.
    diligencePath: Request a management fact pack that reconciles ARR, revenue, ownership history, and operating footprint against third-party trackers.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI005
