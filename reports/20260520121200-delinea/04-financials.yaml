- id: cost-structure-and-capital-allocation
  title: Cost structure, margin path, and capital allocation
  body: 'Delinea does not publish an audited cost structure, so the public view has to triangulate from its own operating footprint and from mature identity-software peers. Delinea’s cloud-delivery footprint includes region-specific hosting such as the UK data centre for Secret Server Cloud, which implies ongoing infrastructure, compliance, and support expense. Its public GTM buildout and acquisition cadence imply continued spend on sales capacity, services, and integration work as well. SecurityWeek’s reporting on the April 2024 Secret Server incident is also financially relevant: incident response, patching, customer communications, and trust repair are real cost centers even when no tenant compromise is ultimately confirmed. CyberArk’s SEC filing offers the clearest public benchmark for what mature identity-security SaaS economics tend to look like. CyberArk says more than 90% of revenue is recurring, that subscription revenue has become the majority driver, and that cost of subscription
    revenue is driven by support personnel, cloud operations, infrastructure, and amortization. It also warns that subscription transition can improve long-term durability while still changing cash timing and near-term profitability. That benchmark does not prove Delinea’s exact gross margin, but it does support a sensible range in which recurring software quality is high while cloud, services, and support still matter materially.'
