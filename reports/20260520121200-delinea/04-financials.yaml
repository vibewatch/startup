- id: gtm-and-growth-capacity
  title: GTM motion and growth-capacity investment
  body: 'Delinea’s disclosures point to a growth engine that mixes direct enterprise selling with a meaningful channel and distributor layer. The 2024 partner-program launch explicitly offered tiered rewards, financial incentives, marketing support, and enablement across resellers, GSIs, and managed-service providers. The 2026 Climb expansion then extended that channel logic deeper into Europe, showing Delinea is still investing in geography expansion rather than only harvesting an installed base. Leadership changes reinforce the same story: Chris Kelly was hired to oversee global sales, channels, solution engineering, and customer success; the 2025 performance update also highlighted additional hires in channels, services, customer success, and regional sales. Publicly disclosed traction is notable. Delinea said ARR surpassed $350 million by Q2 2024 and $400 million by the first half of fiscal 2025, with SaaS making up the majority of ARR. Those are company claims rather than audited filings,
    but they are directionally stronger than the inconsistent values shown by third-party databases. The takeaway is that Delinea appears to be scaling as a sizeable recurring-revenue identity-security vendor, yet open sources still do not reveal CAC, payback, or quota-carrying productivity.'
