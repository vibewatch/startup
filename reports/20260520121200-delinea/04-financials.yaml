    - Confirmed product and bundle surface; no public pricing
    - High if renewal-heavy; exact mix undisclosed
    - Request module attach-rate and renewal breakdown
  - - Server PAM and privileged access modules
    - Recurring subscriptions for server privilege, remote access, and related controls
    - Per-contract enterprise scope
    - Confirmed via Server Suite and RPAM product pages
    - High recurring quality; realized pricing unknown
    - Request booked ARR by product family
  - - Governance / business application controls
    - Fastpath access-control subscriptions and governance upsell
    - Per-application / enterprise scope
    - Confirmed after 2024 acquisition
    - Medium to high; integration progress matters
    - Request Fastpath ARR and services attach
  - - AI-driven authorization and platform add-ons
    - Upsell for newer authorization and analytics capabilities
    - Add-on platform subscription
    - Emerging and merchandised publicly
    - Medium; monetization maturity still forming
    - Request attach rate, paid-vs-included packaging, and pipeline
  - - Professional services / implementation
    - Deployment, integration, onboarding, and customer enablement
    - Project or scoped services
    - Operationally implied but unquantified
    - Lower quality than software ARR; size unknown
    - Request services revenue and services gross margin
  - - Channel-sourced bookings
    - Bookings transacted or influenced through resellers, GSIs, MSPs, and distributors
    - Partner-led enterprise contract
    - Confirmed as an explicit GTM route
    - Varies with discounts and incentives
    - Request channel mix, MDF spend, and margin impact
  notes: Because Delinea does not publish price sheets or revenue mix, this table emphasizes publicly visible mechanisms and leaves exact contract economics as diligence items.
