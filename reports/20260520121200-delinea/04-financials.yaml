- id: capital-adequacy-and-underwriting-gaps
  title: Capital adequacy and underwriting blockers
  body: 'The hardest public limitation is not growth visibility; it is financing visibility. Delinea’s ownership history clearly points to sponsor backing, and that probably lowers immediate external-financing risk relative to a venture-backed company scrambling for a new round. But the same ownership structure means public cash, debt, covenant, and runway disclosure are essentially absent. Third-party databases add noise rather than clarity because they disagree on funding, valuation, founding history, and employee footprint. The strongest public facts are therefore milestone facts: revenue was already above $100 million before the 2021 merger era, ARR moved above $350 million by Q2 2024 and above $400 million in the first half of 2025, and management continues to fund acquisitions, channel expansion, and cloud delivery. The most defensible verdict is that Delinea probably has attractive recurring-revenue quality and meaningful scale, but investors still need direct access to retention,
    CAC, gross-margin bridge, debt schedule, and runway planning before underwriting a clean margin path or capital-intensity view. Public evidence alone supports momentum; it does not support precision.'
