- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public status
  - Implication
  - Confidence
  - Diligence ask
  rows:
  - - Sponsor backing
    - Private-equity sponsorship visible from public ownership history
    - Likely strategic support exists, but economics are opaque
    - Medium
    - Request ownership structure, board support, and capital-allocation priorities
  - - Cash balance
    - Not publicly disclosed
    - Cannot model runway directly
    - Low
    - Request latest balance sheet and unrestricted cash
  - - Debt / leverage
    - Not publicly disclosed
    - Potential covenant or refinancing risk unknown
    - Low
    - Request debt schedule, maturities, and covenant package
  - - Capital uses
    - Visible uses include acquisitions, channel expansion, cloud footprint, and growth hiring
    - Capital is being deployed for both organic and inorganic scale
    - Medium
    - Request annual budget by R&D, S&M, cloud ops, and M&A integration
  - - Next financing trigger
    - No public event or timeline disclosed
    - External investors cannot infer when a new capital decision is needed
    - Low
    - Request runway model and sponsor decision framework
  notes: This chapter intentionally avoids re-stating the full funding chronology from Company Overview. The focus here is current adequacy and opacity, not historical rounds.
