- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Representative proof
  - Scale / operating context
  - Strategic value
  - Gap
  rows:
  - - Manufacturing operations
    - IT/security operations / administrators / industrial business owner
    - Robert Weed using Secret Server for systems, workstations, and third-party access
    - Nearly 200 systems and 100+ workstations in a family-owned distributor/manufacturer
    - Shows Delinea fits mid-market operational environments where privileged access is tied to business continuity
    - No contract size, renewal term, or module attach disclosed
  - - Retail and consumer operations
    - CISO / security team / enterprise operations budget
    - Boyner using Secret Server plus Privileged Remote Access
    - 6 brands, 250+ stores, 8,000+ employees, third-party access and compliance requirements
    - Validates regulated retail and third-party remote-access workflows
    - No ACV, rollout duration, or renewal history disclosed
  - - Technology and finance-control teams
    - SOX/compliance leaders / finance users / enterprise IT budget
    - The Trade Desk using Fastpath around Oracle Cloud ERP
    - 1,200 global users and 100+ finance users across three geographies
    - Shows Delinea can cross-sell beyond PAM into finance-compliance controls
    - Public proof is strong on audit workflow but thin on commercial terms
  - - Critical infrastructure and utilities
    - Security leadership / operations admins / enterprise security budget
    - TEPCO Systems using Secret Server for J-SOX and zero trust
    - Power-group system integrator supporting critical infrastructure
    - Supports mission-critical regulated use cases where traceability matters
    - No long-term expansion economics disclosed
  - - Public-company telecom / infrastructure
    - CIO / auditors / IT admins / public-company compliance budget
    - SBA Communications using Fastpath for SOX reporting
    - Public operator with multiple legal entities and Dynamics GP complexity
    - Useful proof for audit-heavy buyers that need ongoing control reporting
    - No evidence of customer concentration or replication rate across similar accounts
  - - Broader enterprise case-study library
    - Security, audit, and operations buyers across sectors
    - Graebel, Hearst, Norwegian Cruise Line Holdings, Softcat, Clayton Homes, and others in the public library
    - Mobility, media, travel, channel, and housing verticals visible in official resources
    - Suggests Delinea’s reference set spans multiple verticals instead of one niche
    - Library breadth is visible, but many entries are not deep enough on outcomes without full PDF review
  notes: Segment mapping is anchored in named case studies and public customer program materials rather than a disclosed company segmentation table. Public proof skews toward referenceable enterprise and compliance-heavy examples; the true SMB/mid-market mix remains undisclosed.
