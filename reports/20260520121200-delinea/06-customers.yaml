company:
  name: Delinea
chapter:
  number: 6
  title: Customers
  summary: 'Delinea’s public customer record is materially stronger than a generic enterprise-security logo wall. The company documents a structured post-sale motion across onboarding, customer success, community, and renewal; it also exposes a real library of named case studies that show production use in manufacturing, retail, utilities, telecom, travel, media, and finance-control environments. The strongest named proofs—Robert Weed, Boyner, The Trade Desk, TEPCO Systems, and SBA Communications—show measurable operational or audit outcomes and, in several cases, clear cross-sell into adjacent modules such as Privileged Remote Access and Fastpath. What remains missing is the most important underwriting layer: current customer count, NRR, churn, concentration, and segment mix. Public evidence therefore supports real adoption and credible enterprise durability scaffolding, but not precise customer economics.'
sections:
- id: customer-footprint-and-segments
  title: Customer footprint and segment visibility
  body: 'Delinea’s public customer evidence is much stronger than a bare logo wall, but it is still shaped by what the company chooses to showcase. The strongest pattern is segment quality, not precise cohort math. Public case studies and customer materials repeatedly place Delinea inside environments where privileged access, auditability, and compliance are material operating concerns: manufacturing IT operations at Robert Weed, retail and third-party access control at Boyner, Oracle Cloud SOX controls at The Trade Desk, J-SOX and critical infrastructure at TEPCO Systems, and public-company SOX reporting at SBA Communications. The broader case-study library extends that picture into telecom, mobility, media, travel, channel, and housing. That mix suggests Delinea wins where privileged-access control is tied to business continuity, audit defense, or regulated operations rather than where a buyer is simply shopping for a basic password vault. The open web therefore supports a diversified
    enterprise and upper-midmarket footprint, but it does not yet support a precise mix between SMB, mid-market, and enterprise revenue. Delinea’s dated public count of more than 8,500 organizations gives a floor for installed-base scale, yet the absence of a fresher count means the customer chapter has to focus more on proof quality and segment pattern than on current raw-account volume.'
