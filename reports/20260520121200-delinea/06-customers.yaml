- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - Public signal
  - Impact
  - Current read
  - Diligence path
  rows:
  - - Land-and-expand through adjacent modules
    - Case studies show Secret Server expanding into PRA and Fastpath use cases
    - Higher ACV and deeper workflow lock-in
    - Positive but unquantified
    - Request module attach rates and expansion ARR by cohort
  - - Customer-success operating investment
    - Customer success, global services, community, newsletters, and conference surfaces are visible
    - Can support renewal and broader deployment
    - Positive procedural signal
    - Request retention impact and upsell conversion tied to these programs
  - - Enterprise / regulated-customer skew
    - Named public proof leans heavily toward enterprise and compliance-heavy buyers
    - Can raise ACV but may overstate broader base quality
    - Meaningful interpretive risk
    - Request customer mix by ACV, employee size, and vertical
  - - Top-customer concentration
    - No public concentration disclosure
    - Could amplify renewal or procurement shocks
    - Unknown / unresolved
    - Request top-10 customer ARR share and renewal calendar
  - - Customer trust / security-response risk
    - 2024 Secret Server disclosure controversy and CVE remain visible on the open web
    - Could slow procurement or weigh on renewals for risk-sensitive buyers
    - Real but not quantified
    - Request churn analysis, renewal objections, and incident-postmortem customer communications
  - - Price and implementation sensitivity
    - Review sites cite pricing, integration, setup, and UX friction
    - Can limit rollout pace or shrink deal size in budget-sensitive accounts
    - Moderate risk
    - Request competitive loss reasons and time-to-value distribution
  notes: Expansion appears credible from public case studies, but concentration and retention economics remain unresolved. This table mixes visible positive drivers with explicit underwriting gaps rather than forcing unsupported precision.
