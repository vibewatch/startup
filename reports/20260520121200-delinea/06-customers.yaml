    topic: retention metrics
    missingEvidence: NRR, GRR, logo churn, renewal rate, contract length, and cohort retention by segment and product.
    whyItMatters: Customer-success programming is visible, but the public record still does not reveal whether Delinea retains and expands customers at attractive SaaS levels.
    diligencePath: Request cohort retention data by segment, product, and deployment model plus renewal waterfall detail.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
    - FU004
  - type: missing-source
    severity: material
    topic: customer concentration
    missingEvidence: Top-customer ARR share, top-10 customer concentration, and any material procurement or renewal dependency data.
    whyItMatters: Public named proofs show credible enterprise use, but investors cannot yet judge whether Delinea depends heavily on a small number of large regulated accounts.
    diligencePath: Request top-customer concentration schedule, renewal calendar, and pipeline dependence on strategic accounts.
    relatedQuestionRefs:
    - QU014
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: enterprise versus smb mix
    missingEvidence: A customer segmentation breakdown by ACV band, employee count, geography, vertical, and product bundle.
    whyItMatters: Public case studies lean enterprise and compliance-heavy, but Delinea still says it serves organizations of all sizes, leaving real mix unresolved.
    diligencePath: Request customer segmentation by ACV and employee size plus named references for SMB, mid-market, and enterprise tiers.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU001
  - type: missing-metric
    severity: material
    topic: attach and expansion metrics
    missingEvidence: Cross-sell rates from core Secret Server/PAM into PRA, Fastpath, and platform bundles plus module-level attach by cohort.
    whyItMatters: Public case studies show multi-product expansion paths, but not enough data to measure how often Delinea actually lands and expands across the base.
    diligencePath: Request attach-rate data, multi-product customer share, and expansion ARR by module family.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: named customer proof coverage
    missingEvidence: A fuller reference set covering more named customers, reference-call contacts, and proof of renewals or multi-year durability for public references.
    whyItMatters: The public named proof is credible but still selective, which means the visible references may overrepresent Delinea’s best enterprise stories.
    diligencePath: Request a broader customer reference list by segment plus at least three renewal-verified references and one churn or loss review.
    relatedQuestionRefs:
    - QU002
    - QU024
    relatedTableRefs:
    - TU003
