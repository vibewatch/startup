- id: customer-risks-and-underwriting-gaps
  title: Customer risks and remaining underwriting gaps
  body: The customer chapter still leaves three underwriting gaps unresolved. First, concentration remains opaque. Public named references prove that Delinea can win and retain serious customers, but they do not reveal whether revenue is broadly distributed or concentrated in a handful of large enterprise accounts. Second, the visible customer base likely skews more enterprise and compliance-heavy than the company’s total account count, which means public proof may overrepresent high-value reference customers. Third, customer trust risk is no longer purely theoretical. The 2024 Secret Server disclosure controversy and CVE do not prove broad churn, but they are exactly the sort of vendor-response issue that security buyers, auditors, and procurement teams scrutinize at renewal. Taken together, the public record supports the idea that Delinea has real production adoption and meaningful customer-success infrastructure, but it does not yet support a clean conclusion on retention quality, concentration
    risk, or the exact mix of expansion versus replacement revenue. Investors should treat the customer story as materially positive on proof of use, yet still incomplete on durability economics.
