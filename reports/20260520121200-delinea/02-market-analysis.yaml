- id: growth-drivers-and-adoption-constraints
  title: Growth drivers and adoption constraints
  body: The market tailwinds are real. Zero-trust guidance from NIST and CISA continues to push identity and authorization toward the center of enterprise security architecture. Market-research pages repeatedly cite cloud adoption, hybrid work, and rising identity-driven attacks as reasons IAM and privileged-access spending keeps expanding. AI and non-human identity add another growth layer, because machine and AI identities multiply much faster than human accounts and often operate with poor visibility or standing privileges. But the adoption story is not frictionless. Delinea’s own passwordless survey shows how legacy systems and compliance obligations slow even widely discussed modernization efforts, while market commentary from Identity Management Institute and ISMG points to budget constraints, skills gaps, and integration complexity. That means category expansion alone is not enough. Delinea still needs to win by making governance, authorization, and operational simplicity credible
    enough that buyers fund one more control layer instead of defaulting to bundled or status-quo alternatives.
  claimRefs:
