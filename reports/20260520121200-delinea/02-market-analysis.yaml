- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  summary: The market usually converts from risk recognition to control sprawl, then to zero-trust or platformization programs and finally to a unified purchase only if buyers believe deployment friction is manageable.
  data:
    nodes:
    - id: risk
      label: Identity or privilege risk
      detail: Credential abuse, audit pressure, or cloud sprawl triggers the search.
    - id: sprawl
      label: Point-tool sprawl
      detail: Native controls, MFA, and manual audits prove insufficient.
    - id: program
      label: Zero-trust or modernization program
      detail: Security and IAM teams define the architecture and budget path.
    - id: pilot
      label: Platform or PAM evaluation
      detail: Buyers compare Delinea, CyberArk, BeyondTrust, and broader IAM suites.
    - id: scale
      label: Scaled deployment
      detail: Winning vendor must prove low-friction implementation and durable governance value.
    edges:
