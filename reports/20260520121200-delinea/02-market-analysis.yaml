tables:
- id: TM001
  title: Market definition table
  columns:
  - Market layer
  - Included spend
  - Excluded spend
  - Primary buyer or payer
  - Relevance to Delinea
  rows:
  - - Broad IAM
    - Authentication, governance, access control, CIAM, PAM, analytics, and some services
    - Unrelated security categories without identity-control content
    - CISO, CIO, IAM leadership
    - Useful outer ceiling but too broad for direct underwriting
  - - Privileged access management
    - Vaulting, privileged sessions, least privilege, credential rotation, admin workflows
    - General workforce identity that does not touch privileged or sensitive access
    - Security, infrastructure, audit
    - Still Delinea’s clearest historical core
  - - Identity-security platform
    - PAM plus discovery, authorization, posture, analytics, workflow control across identities
    - Consumer-only identity or generic access without control depth
    - Security architecture, IAM, platform teams
    - Best strategic frame for current Delinea narrative
  - - Non-human identity and AI control
    - Service accounts, machine identities, AI agents, runtime authorization, verification
    - Human-only SSO and basic directory administration
    - Platform engineering, security engineering, cloud teams
    - Fast-growing adjacency that can expand the story above classic PAM
  - - Status quo and bundled substitutes
    - Native directory controls, basic MFA, manual audit, broader-suite governance
    - Dedicated specialized controls not already owned by the buyer
    - Existing IT and identity budgets
    - Real competition for new-spend conversion
  notes: This table preserves layered market definitions because Delinea sits across more than one identity-control budget line; using only the broadest IAM figure would overstate the immediate wedge.
