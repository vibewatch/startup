company:
  name: Delinea
chapter:
  number: 8
  title: Valuation, Comparable Analysis, and Investment Thesis
  summary: 'Public evidence makes Delinea look like a strategically relevant identity-security asset, but not like a cleanly priceable one. The strongest hard fact is operational scale: Delinea said ARR surpassed $400 million in 2025 and that SaaS is the majority of the mix. Public identity/security comparables then provide a real but wide valuation envelope. CyberArk, Okta, SailPoint, and sector median data suggest roughly a 5x to 16x revenue band in May 2026, which would imply something like $2 billion to $6 billion for Delinea before capital-structure adjustments. That spread is too wide for a buy call because the most important underwriting inputs—current valuation mark, debt, preferences, NRR, gross margin, and a real exit process—remain private. The appropriate conclusion is Track: Delinea merits monitoring for a financing or IPO-quality disclosure event, but the open-web record does not support committing capital at an unknown price.'
sections:
- id: valuation-context-and-price-visibility
  title: Valuation context and price visibility
  body: 'The public valuation problem for Delinea is not lack of evidence on business quality; it is lack of evidence on today''s price. The cleanest transaction benchmark still appears to be historical. Crunchbase records TPG''s 2021 acquisition at $1.4 billion, and Mergr frames that deal as a secondary buyout rather than a conventional growth round. Since then, Delinea has disclosed operating momentum—most notably ARR above $400 million and a SaaS-majority mix—but it has not published a fresh valuation mark, a new round, or an IPO range. That gap matters because sponsor-backed software businesses can create value without giving outside observers any visibility into debt, preference stack, or recapitalization dynamics. Third-party databases do not solve the problem; they worsen it. GetLatka posts a dramatically lower valuation and revenue estimate that conflicts with both Delinea''s own ARR claim and the sponsor-backed ownership history. The safest public conclusion is therefore straightforward:
    Delinea may be more valuable than the 2021 benchmark, but the market still does not know the current price well enough to call it attractive or expensive with confidence.'
  claimRefs:
  - CV002
  - CV003
  - CV001
  - CV004
  - CV005
  - CV015
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: public-comparable-framework
  title: Public comparable framework
  body: Public comparables do offer a usable framework, just not a precise answer. The most relevant public anchors sit inside identity and security software rather than broad horizontal SaaS. Using May 2026 public market data, CyberArk trades near the high end of the relevant band, Okta sits much lower, and SailPoint lands between them. A sector view from Multiples.vc fills in the middle by showing cybersecurity and GRC software multiples that are still materially above generic software categories. That creates a sensible interpretation for Delinea. It should not be valued like the highest-disclosure, best-in-class public benchmark automatically, but neither should it be valued as if it were a weak generalist SaaS asset. The comp set therefore supports a wide but real zone of reasonableness rather than a single point estimate. In practical terms, Delinea looks more like a company that deserves identity-security peer framing, while still suffering a private-company and disclosure discount.
  claimRefs:
  - CV006
  - CV007
  - CV008
  - CV009
  - CV010
  - CV013
  - CV014
  tableRefs:
  - TV004
  figureRefs:
  - FV002
- id: scenario-analysis-and-range
  title: Scenario analysis and valuation range
  body: If Delinea's public >$400 million ARR milestone is used as the base input, the peer band produces a valuation range that is directionally useful but intentionally wide. The bear case assumes the market ultimately values Delinea closer to lower-multiple identity platforms or that hidden leverage and weaker retention compress the effective multiple into the 4x–5.5x area. That yields a roughly $1.6 billion to $2.2 billion range and would mean surprisingly little value creation since the 2021 sponsor transaction. The base case assumes a 7x–10x band, which implies roughly $2.8 billion to $4.0 billion and roughly fits a business with real scale and category relevance, but still notable opacity. The bull case assumes Delinea can earn something closer to premium cybersecurity multiples if its ARR quality, margin profile, and exit readiness prove strong, pointing to roughly $5.0 billion to $6.4 billion. Public evidence is strong enough to justify the three-scenario structure, but not strong
    enough to weight those scenarios precisely. The model should therefore be treated as a screening tool for price discipline, not as a substitute for a data room.
  claimRefs:
  - CV001
  - CV010
  - CV011
  - CV012
  - CV019
  tableRefs:
  - TV003
  figureRefs:
  - FV003
- id: investment-thesis-and-decision
  title: Investment thesis, anti-thesis, and decision
  body: 'The positive investment case is not hard to articulate. Delinea appears to have meaningful identity-security scale, a recurring SaaS-heavy revenue base, and a category context where public comps can still support mid- to high-single-digit or better revenue multiples. The negative case is also unusually clear: valuation visibility is poor, third-party databases are contradictory, public peers disclose far more than Delinea does, and the sponsor structure hides exactly the economics that matter most to outside investors. That combination blocks a buy recommendation. A disciplined investor can reasonably keep Delinea on a watchlist and be prepared to engage if a financing, IPO filing, or secondary process creates real price visibility. But until then, the correct posture is Track rather than Buy. The next step is not creative modeling; it is evidence collection on valuation mark, leverage, retention, margins, and exit readiness.'
  claimRefs:
  - CV017
  - CV018
  - CV016
