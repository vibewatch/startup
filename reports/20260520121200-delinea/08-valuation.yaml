  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Current valuation mark, cap table, and sponsor economics remain private
    missingEvidence: No public source discloses Delinea’s current valuation, debt schedule, preference stack, or exit waterfall after the 2021 TPG transaction.
    whyItMatters: Without the current price and structure, even a well-framed enterprise-value range cannot be translated into a real underwriting call for new investors.
    diligencePath: Request the latest board valuation materials, capitalization table, debt agreements, and waterfall summary under NDA.
    relatedQuestionRefs:
    - QV001
    - QV011
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: Comparable valuation table remains partial because Delinea’s own quality-of-revenue metrics are undisclosed
    missingEvidence: Public sources do not reveal Delinea’s NRR, GRR, gross margin, services mix, or cash generation, so public peer multiples cannot be calibrated precisely to Delinea’s actual economics.
    whyItMatters: The difference between a 7x and 14x multiple is several billion dollars at Delinea’s stated ARR scale, so calibration error is economically decisive.
    diligencePath: Obtain audited ARR, NRR, GRR, gross margin, and services-margin bridges and then re-cut the comp set.
    relatedQuestionRefs:
    - QV005
    - QV006
    - QV007
    relatedTableRefs:
    - TV003
    - TV004
  - type: restricted-data
    severity: material
    topic: Scenario weighting cannot be evidence-calibrated from the open web
    missingEvidence: There is no public basis for estimating the true probabilities of the bull, base, and bear cases without retention, margin, leverage, and process-readiness data.
    whyItMatters: Probability weighting changes expected value materially and determines whether Delinea is merely interesting or actually investable at a given future price.
    diligencePath: Use management-grade operating data and current process information to replace heuristic scenario weights with evidence-based probabilities.
    relatedQuestionRefs:
    - QV008
    relatedFigureRefs:
    - FV003
