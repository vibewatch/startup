- id: TV002
  title: Thesis / anti-thesis table
  type: enumeration
  layout: standard
  summary: Balanced investment arguments for and against underwriting Delinea today.
  notes: Each row states what would materially change the view rather than treating the thesis as static.
  enumerationScope:
    coverage: exhaustive
    basis: Enumerates two thesis and two anti-thesis arguments across scale, category positioning, disclosure, and capital-structure visibility.
  columns:
  - Argument
  - Evidence Base
  - What Changes the View
  rows:
  - - 'THESIS: Delinea has reached real identity-security scale'
    - Official ARR above $400M with SaaS-majority mix suggests material recurring revenue and strategic relevance.
    - View strengthens if audited ARR, NRR, and margin data confirm durable expansion rather than one-time milestone optics.
  - - 'THESIS: Public identity-security comps can support meaningful valuation upside from the 2021 benchmark'
    - CyberArk, SailPoint, Okta, and sector median data support mid- to high-single-digit or better revenue multiples for credible identity/security assets.
    - View strengthens if Delinea proves closer to premium cybersecurity economics than to lower-multiple platform peers.
  - - 'ANTI-THESIS: The current price is effectively unknown'
    - No fresh valuation mark, financing round, or IPO range is public; third-party databases conflict materially.
    - View improves only when a real price and cap-structure package are disclosed.
  - - 'ANTI-THESIS: Sponsor structure can hide downside even if the business is good'
    - Debt, preferences, recap terms, and waterfall economics are not visible in public sources.
    - View improves if leverage is modest and exit proceeds are not structurally impaired by sponsor economics.
