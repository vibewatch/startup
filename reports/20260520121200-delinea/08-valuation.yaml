- id: TV004
  title: Comparable valuation table
  type: enumeration
  layout: wide
  summary: Public comps and benchmark references used to frame Delinea’s valuation range.
  notes: Coverage is partial because public data does not expose every relevant private sponsor or M&A identity-security benchmark with enough transparency to use confidently.
  enumerationScope:
    coverage: partial
    basis: 'Includes the clearest public anchors reviewed in this run: three listed identity/security peers, a sector-median reference, and Delinea’s historical 2021 sponsor transaction benchmark.'
  columns:
  - Comparable / reference
  - Revenue or ARR basis
  - Valuation / multiple
  - Relevance
  - Limitation
  rows:
  - - CyberArk
    - $1.30B TTM revenue; public identity-security leader
    - ~15.9x revenue
    - High-end public benchmark for identity/security scarcity and premium security multiples.
    - Best-in-class disclosure and strategic position; likely a generous anchor for Delinea.
  - - Okta
    - $2.91B TTM revenue; public identity platform
    - ~5.2x revenue
    - Useful lower-end identity-platform benchmark for scale with more mature public scrutiny.
    - Broader identity category and different growth/margin profile; not a PAM-pure comp.
  - - SailPoint
    - $1.07B TTM revenue; identity-governance specialist
    - ~7.7x revenue
    - Middle reference for identity-governance exposure and a listed peer closer to compliance workflows.
    - Still not a clean Delinea analog across product mix, ownership history, or margins.
  - - Sector medians (Multiples.vc)
    - Public cybersecurity ~13.8x; GRC ~9.3x
    - Category revenue multiples
    - Helps place Delinea between cybersecurity premium and governance/compliance software bands.
    - Sector medians are not company-specific and cannot replace direct comps.
  - - Delinea 2021 TPG transaction benchmark
    - Historical transaction value
    - $1.4B (historical)
    - Useful floor-like milestone for how far value may have moved since sponsor consolidation.
    - Stale sponsor transaction; not a current market-clearing price and not directly comparable to a 2026 liquidity event.
