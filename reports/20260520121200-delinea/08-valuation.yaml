- id: TV003
  title: Bull / base / bear scenario table
  type: enumeration
  layout: wide
  summary: Three-scenario valuation frame for Delinea using the public >$400M ARR milestone and identity/security peer bands.
  notes: Ranges are illustrative enterprise-value scenarios, not equity values. Capital-structure adjustments could move realized equity outcomes materially.
  enumerationScope:
    coverage: exhaustive
    basis: Enumerates the standard bull, base, and bear cases required by the workflow, each with multiple band, valuation range, assumptions, and probability signal.
  columns:
  - Scenario
  - ARR assumption
  - Multiple band
  - Implied valuation range
  - Key assumptions
  - Probability signal
  rows:
  - - Bear
    - ≈$400M ARR treated as lower-quality or more burdened than peers
    - 4.0x–5.5x
    - $1.6B–$2.2B
    - NRR weak, gross margin underwhelming, leverage or preferences heavy, and market applies a lower identity-platform multiple.
    - Real downside case if disclosure reveals materially worse quality than the public story implies.
  - - Base
    - ≈$400M ARR with quality roughly in line with mid-tier identity/security peers
    - 7.0x–10.0x
    - $2.8B–$4.0B
    - Recurring mix is solid, margin profile acceptable, and exit readiness exists but still carries private-company discount.
    - Most plausible public-only range, but still low confidence without a data room.
  - - Bull
    - '>$400M ARR plus premium retention, strong margins, and credible IPO readiness'
    - 12.5x–16.0x
    - $5.0B–$6.4B
    - Delinea proves closer to premium cybersecurity comps and the market rewards identity-security scarcity plus scale.
    - Possible, but only if future disclosure materially upgrades confidence in quality and exit readiness.
