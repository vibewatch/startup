- id: TV005
  title: Thesis-break and kill triggers table
  type: enumeration
  layout: standard
  summary: Specific triggers that would downgrade or invalidate the Delinea watchlist thesis.
  notes: Thresholds are public-comparable-informed heuristics intended to force discipline before any future process.
  enumerationScope:
    coverage: exhaustive
    basis: Enumerates the five most material thesis-break triggers across retention, margins, leverage, valuation, and disclosure behavior.
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Net revenue retention
    - Below 100%
    - Would imply the installed base is not expanding enough to support premium identity-security multiples.
    - Downgrade from Track toward Avoid absent a much lower entry price.
  - - Gross margin quality
    - Materially below public identity peers after adjusting for services
    - Would suggest weaker software economics and lower long-term valuation support.
    - Re-cut valuation toward bear case or lower.
  - - Debt / preference overhang
    - Meaningful leverage or waterfall terms that absorb exit proceeds
    - Would weaken the equity value available to new investors even if enterprise value looks sound.
    - Require major discount or avoid the process.
  - - New pricing event
    - Above ~12x ARR without much better disclosure
    - Would ask investors to pay a premium multiple while still underwriting blind.
    - Pass unless the disclosure package improves materially.
  - - Disclosure behavior
    - No audited metrics shared in a serious process
    - Would confirm that price opacity is structural rather than temporary.
    - Do not advance beyond watchlist status.
  claimRefs:
  - CV021
  - CV020
- id: TV006
  title: Final diligence asks table
  type: enumeration
  layout: standard
  summary: The minimum diligence package needed to convert Delinea from a watchlist name into an underwritable opportunity.
  notes: These asks are deliberately practical and focused on the missing inputs that determine value, not generic curiosity questions.
  enumerationScope:
    coverage: exhaustive
    basis: Enumerates the five highest-value diligence requests for valuation, capital structure, economics, retention, and exit readiness.
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Diligence Path
  rows:
  - - Current valuation mark
    - Latest board-approved valuation, financing memo, or sponsor sale range
    - Without a current price there is no way to classify the opportunity as attractive, fair, or stretched.
    - Request the latest financing or valuation materials under NDA.
  - - Cap table, debt, and preference stack
    - Ownership %, leverage, maturities, covenants, and waterfall terms
    - Enterprise-value scenarios do not equal equity value when sponsor structures are complex.
    - Request capitalization table, debt schedule, and waterfall summary.
  - - ARR / NRR / GRR / gross-margin bridge
    - Audited recurring-revenue quality metrics and cost structure
    - These are the main drivers of where Delinea should sit inside the 5x–16x peer band.
    - Request audited historical metrics by year and by product or deployment mix.
  - - Customer concentration and cohort retention
    - Segment mix, top-account concentration, renewal history, and expansion behavior
    - Validates whether customer proof translates into durable value rather than isolated reference logos.
    - Request customer cohort files and concentration analysis.
  - - Exit readiness
    - IPO workstreams, banker engagement, public-company readiness, or sponsor exit timing
    - The route to liquidity affects both valuation multiple and timing assumptions.
    - Request board materials or formal process updates on strategic options.
  claimRefs:
  - CV022
  - CV015
  - CV020
