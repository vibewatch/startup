  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与价格可见度
        blocks:
          - type: paragraph
            body: >-
              Delinea 的公开估值问题，不是缺少业务质量证据，而是缺少当下价格证据。最干净的交易基准仍然是历史交易。Crunchbase 记录 TPG 在 2021 年以 $1.4 billion 收购，Mergr
              则把该交易描述成二级收购，而不是常规增长轮。此后，Delinea 披露了运营动能——最突出的是 ARR 超过 $400 million，且收入结构以 SaaS 为主——但它没有发布新的估值标记、新轮融资或 IPO
              区间。这个缺口重要，因为 PE 支持的软件公司可以创造价值，却不给外部观察者任何关于债务、优先权堆叠或再资本化动态的可见度。第三方数据库没有解决问题，反而恶化问题。GetLatka 发布的估值和收入估计低得多，与
              Delinea 自己的 ARR 主张和 PE 支持所有权历史都冲突。最稳妥的公开结论很直接：Delinea 可能比 2021 年基准更有价值，但市场仍不知道当前价格，无法有信心判断它有吸引力还是昂贵。
