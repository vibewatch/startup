        title: 所有权、资本历史与估值可见度
        blocks:
          - type: paragraph
            body: >-
              概览层面的所有权证据首先指向 TPG，而不是一个庞大的后期风险投资财团。2021 年合并公告称，TPG 从 Insight Partners 收购 Thycotic，此前已完成 Centrify 收购，并在
              Thoma Bravo 和 PSP Investments 少数股权支持下合并两家公司。第三方资料也强化了这个叙事。Crunchbase 记录 2021 年 3 月 TPG 以 $1.4 billion
              收购；Mergr 另行记录 2021 年 1 月从 Thoma Bravo 和 Golub Capital 手中收购；PitchBook 预览目前把 Delinea 标记为 PE 支持且处于 IPO
              注册中。公开来源没有提供的信息同样重要：已审阅材料不能证实提示词中所称 2024 年 TPG 战略增长投资，也无法验证 Francisco Partners 当前持有 Delinea
              股权。市场数据来源在资本历史和估值上也互相冲突，从 PE 所有权叙事到遗留风险轮次痕迹，再到低置信度估值估计都有。最稳妥的投资判断是：Delinea 是一家有资方支持的私人公司，具备强历史控制权交易基准和当前
              IPO 信号，但没有新近披露的 2024 年后公开估值标记。
