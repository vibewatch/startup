        - label: 基准低位 — 7x
          value: 2800
          note: 有折价但可信的身份安全估值。
        - label: 基准高位 — 10x
          value: 4000
          note: 克制基准情景的上沿。
        - label: 行业溢价 — 13.8x
          value: 5520
          note: Multiples.vc 网络安全中位数。
        - label: 类 CyberArk — 15.9x
          value: 6360
          note: 高溢价公开安全基准；若没有更好披露，可能过于慷慨。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于纯公开估值框架，为 Delinea 给出历史基准和未来情景区间。
    notes: 这些区间是情景企业价值，不是保证结果，也不是股权价值。2021 年点位只作为历史锚点展示。
    claimRefs:
      - CV002
      - CV011
      - CV012
    data:
      items:
        - label: 2021 年历史基准
          low: 1400
          high: 1400
          unit: USD million
          note: TPG 收购的 Crunchbase 交易基准。
        - label: 悲观情景
          low: 1600
          high: 2200
          unit: USD million
          note: 在约 $400M ARR 上取 4.0x–5.5x，对应质量较弱或结构拖累。
        - label: 基准情景
          low: 2800
          high: 4000
          unit: USD million
          note: 在约 $400M ARR 上取 7.0x–10.0x，对应可接受但非溢价的经济质量。
        - label: 乐观情景
          low: 5000
          high: 6400
          unit: USD million
          note: 若 Delinea 证明质量可拿溢价且具备退出条件，则在 >$400M ARR 上取 12.5x–16.0x。
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 仅基于公开信息，对 Delinea 的可投资性做 IC 风格评分。
    notes: 估值清晰度和证据质量得分偏低，反映的是信息缺口，并不是断言经营质量一定弱。
    claimRefs:
      - CV017
      - CV018
      - CV020
      - CV022
    data:
      items:
        - label: 市场 / 品类重要性
          value: 4 / 5
          note: 身份安全仍是战略重要的软件品类，公开同业享有溢价估值。
        - label: 产品 / 客户证明
          value: 4 / 5
          note: 前文支持平台宽度真实存在，且具名客户已在生产中使用。
        - label: 竞争护城河
          value: 3 / 5
          note: 品类卡位不错，但公开证据不足以给出接近同类最佳的评分。
        - label: 财务可见度
          value: 2 / 5
          note: ARR 里程碑有帮助，但 NRR、毛利率、债务和现金流仍未公开。
        - label: 估值清晰度
          value: 1 / 5
          note: 从公开证据看，当前价格实际上未知。
        - label: 证据质量
          value: 2 / 5
          note: 同业框架存在，但太多关键输入仍需要管理层材料。
        - label: 退出准备度
          value: 2 / 5
          note: IPO 或财务赞助方退出都有可能，但公开证据没有披露时间点或流程质量。
