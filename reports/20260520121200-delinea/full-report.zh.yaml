            body: >-
              客户章节仍留下三个未解决的投资判断缺口。第一，集中度不透明。公开具名参考证明 Delinea
              能赢下并留住严肃客户，但没有揭示收入是广泛分散，还是集中在少数大型企业账户。第二，可见客户基础很可能比公司总账户数更偏企业和合规密集，这意味着公开证明可能过度代表高价值参考客户。第三，客户信任风险不再只是理论风险。2024
              年 Secret Server 披露争议和 CVE 不能证明广泛流失，但正是安全买方、审计人员和采购团队会在续约时审视的厂商响应问题。合在一起，公开记录支持 Delinea
              确有生产采用和有意义的客户成功基础设施；但在留存质量、集中度风险，以及扩张收入与替换收入的准确组合上，还不能给出干净结论。投资人应把客户故事视为使用证明上实质正面，但耐久经济性上仍不完整。
