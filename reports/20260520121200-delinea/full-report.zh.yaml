  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户足迹与细分可见度
        blocks:
          - type: paragraph
            body: >-
              Delinea 的公开客户证据远强于一面简单标识墙，但仍受公司选择展示内容影响。最强模式是细分质量，而不是精确队列数学。公开案例研究和客户材料反复把 Delinea
              放进特权访问、可审计性和合规是重要运营问题的环境：Robert Weed 的制造业 IT 运营，Boyner 的零售和第三方访问控制，The Trade Desk 的 Oracle Cloud SOX
              控制，TEPCO Systems 的 J-SOX 与关键基础设施，以及 SBA Communications 的上市公司 SOX 报告。更宽的案例库还把这幅图延伸到电信、出行、媒体、旅游、渠道和住房。这个组合说明
              Delinea 在特权访问控制与业务连续性、审计防御或受监管运营绑定的场景中取胜，而不是只服务于寻找基础密码保险库的买方。因此，开放网页支持一个多元化企业和高端中型市场足迹，但尚不足以支持
              SMB、中型市场和企业收入之间的精确结构。Delinea 已过时的公开数量——超过 8,500 家机构——为装机基础规模给出下限；但缺少更新数量意味着客户章节必须更关注证据质量和细分模式，而不是当前原始账户量。
