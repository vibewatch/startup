companyProfile:
  summary: >-
    Delinea 是一家 PE 资方支持的身份安全平台，源于 2021 年 Thycotic/Centrify 合并，并在 2022 年以 Delinea
    品牌重新推出。公开材料显示，公司产品面很宽，覆盖特权访问管理、授权、远程访问、治理和机密工作流，以 Secret Server、Privilege Manager、Fastpath 以及较新的 AI 驱动授权能力等产品为支点。截至
    2025 年，公司公开称 ARR 超过 $400 million，收入结构以 SaaS 为主，此前里程碑材料披露服务超过 8,500
    家机构，并继续借助渠道投资和收购扩展平台。真正仍未公开的，是最关键的投资判断细节：当前估值、资本结构、留存质量和经审计单位经济。
  foundedDate: '2021-04-01'
