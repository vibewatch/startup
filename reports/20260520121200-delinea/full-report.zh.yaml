      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场顺风是真实存在的。NIST 和 CISA 的零信任指引继续把身份与授权推向企业安全架构中心。市场研究页面反复把云采用、混合办公和不断增加的身份驱动攻击，列为 IAM 与特权访问支出持续扩张的原因。AI
              和非人类身份又增加一层增长，因为机器和 AI 身份的增速远快于人类账户，且常常可见度差、保留常驻权限。但采用故事并非没有摩擦。Delinea
              自己的无密码调查显示，遗留系统和合规义务会拖慢即便被广泛讨论的现代化工作；Identity Management Institute 和 ISMG
              的市场评论也指出预算约束、技能缺口和集成复杂度。这意味着仅靠类别扩张不够。Delinea 仍要证明治理、授权和运营简单性足够可信，让买方愿意为又一层控制买单，而不是默认选择捆绑方案或维持现状。
