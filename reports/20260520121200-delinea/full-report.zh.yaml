  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：直接老牌厂商、相邻套件与侧翼进入者
        blocks:
          - type: paragraph
            body: >-
              Delinea 的竞争版图比简单的三家 PAM 厂商之争更宽，但仍有清晰重心。CyberArk 和 BeyondTrust 是最明确的直接老牌厂商，因为它们把特权访问深度作为主要企业控制类别来销售。核心之外，是
              Microsoft、Okta、SailPoint 和 Saviynt 等更宽套件型竞争者；它们可以借助企业资产中既有的身份、治理和威胁工具，吸收部分购买标准。第三圈是侧翼进入者：CrowdStrike 和
              SentinelOne 从端点驱动的身份安全切入，Teleport 和 StrongDM 从基础设施访问与运行时授权切入，Silverfort 以无代理身份安全切入，1Password
              则从扩展访问管理式员工访问切入。Delinea 自己收购 StrongDM，证明管理层也认为这些侧翼类别具备战略现实性。因此，竞争问题不是 Delinea 有没有对手，而是每一次购买动作中它面对哪一层对手。
