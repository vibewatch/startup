      - number: '6.3'
        title: 耐久度、扩张与公开评测信号
        blocks:
          - type: paragraph
            body: >-
              Delinea 的公开耐久性证据真实但不完整。正面看，公司不像一个初次销售后就消失的厂商：客户页面描述了入职资源、专属技术和客户成功角色、社区计划、路线图沟通，以及可在合同结束前 120
              天启动的续约互动。新宣布的 Delinea Edge 大会，把同一模式延伸到客户教育和同伴学习表面。公开评论也在较窄意义上支持耐久性。PeerSpot 和 TrustRadius 反复提到 Secret
              Server 在安全保险库、密码轮换、访问审批、审计轨迹和运营控制上有价值。这些核心工作流收益，一旦部署，往往会深嵌进 IT 和安全运营。但同一批评论也解释了为什么留存和扩张不能盲目假设。设置、报告、集成、API
              灵活性、定价和 UX 问题出现得足够频繁，值得重视。结果是一幅图景：厂商在核心 PAM 工作流中具备可信粘性，但仍暴露于部署摩擦，可能拖慢更广推出，或在复杂环境中制造买方挫败。没有公开 NRR、GRR
              或流失数据时，这些定性信号在方向上有帮助，但不能盖棺定论。
