        - 更成熟公开审视下，规模化身份平台的低端基准。
        - 更宽的身份类别和不同增长 / 利润率画像；不是纯 PAM 可比。
      - - SailPoint
        - $1.07B TTM 收入；身份治理专家
        - ~7.7x 收入
        - 身份治理敞口和更接近合规工作流的上市同业中间参考。
        - 在产品组合、所有权历史或利润率上仍不是干净的 Delinea 对照。
      - - 行业中位数（Multiples.vc）
        - 公开市场网络安全 ~13.8x；GRC ~9.3x
        - 品类收入倍数
        - 帮助把 Delinea 放在网络安全溢价和治理 / 合规软件区间之间。
        - 行业中位数不是公司特定数据，不能替代直接可比公司。
      - - Delinea 2021 年 TPG 交易基准
        - 历史交易价值
        - $1.4B（历史）
        - 作为里程碑式下限参考，有助于判断赞助方整合以来价值可能移动了多远。
        - 过时的赞助方交易；不是当前市场出清价格，也不能直接类比 2026 年流动性事件。
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV005
    title: 投资逻辑破裂与终止触发点表
    type: enumeration
    layout: standard
    summary: Specific triggers that would downgrade or invalidate the Delinea watchlist thesis.
    notes: 阈值参考公开可比公司得出，属于启发式规则，用来在任何未来流程前强制纪律。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Enumerates the five most material thesis-break triggers across retention, margins, leverage, valuation, and
        disclosure behavior.
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 净收入留存
        - 低于 100%
        - 说明存量客户扩张不足，撑不起高溢价身份安全倍数。
        - 除非入场价格低得多，否则从观察下调到回避。
      - - 毛利率质量
        - 按服务调整后，明显低于公开身份同业
        - 说明软件经济性更弱，长期估值支撑更低。
        - 把估值重切到悲观情景或更低。
      - - 债务 / 优先权包袱
        - 吸走退出收益的实质性杠杆或分配瀑布条款
        - 即使企业价值看起来合理，也会削弱新投资者可获得的股权价值。
        - 要求大幅折价，或回避该流程。
      - - 新定价事件
        - 超过 ~12x ARR，且披露没有明显改善
        - 相当于要求投资者在盲承销下支付溢价倍数。
        - 除非披露包实质改善，否则放弃。
      - - 披露行为
        - 严肃流程中不共享经审计指标
        - 确认价格不透明是结构性问题，而非暂时现象。
        - 不要推进到观察名单以外。
    claimRefs:
      - CV021
      - CV020
  - id: TV006
    title: 最终尽调要求表
    type: enumeration
    layout: standard
    summary: The minimum diligence package needed to convert Delinea from a watchlist name into an underwritable opportunity.
    notes: 这些要求刻意保持实用，聚焦决定价值的缺失输入，而不是泛泛的好奇问题。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Enumerates the five highest-value diligence requests for valuation, capital structure, economics, retention, and
        exit readiness.
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 当前估值标记
        - 最新董事会批准估值、融资备忘录或赞助方出售区间
        - 没有当前价格，就无法把机会归为有吸引力、合理或偏高。
        - 在 NDA 下要求最新融资或估值材料。
      - - 股权结构表、债务和优先股堆叠
        - 持股比例、杠杆、到期日、契约和分配瀑布条款
        - 赞助方结构复杂时，企业价值情景不等于股权价值。
        - 要求股权结构表、债务明细和分配瀑布摘要。
      - - ARR / NRR / GRR / 毛利率桥
        - 经审计的经常性收入质量指标和成本结构
        - 这些是判断 Delinea 应该落在 5x–16x 同业区间何处的主要驱动。
        - 要求按年份、产品或部署组合拆分的经审计历史指标。
      - - 客户集中度和队列留存
        - 细分市场组合、头部客户集中度、续约历史和扩张行为
        - 验证客户证明能否转化为持久价值，而不是孤立参考客户 Logo。
        - 要求客户队列文件和集中度分析。
      - - 退出准备
        - IPO 工作流、投行接触、上市公司准备或赞助方退出时间
        - 流动性路径会影响估值倍数和时点假设。
        - 要求董事会材料或战略选项正式流程更新。
    claimRefs:
      - CV022
      - CV015
      - CV020
