  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与 Delinea 真正销售的东西
        blocks:
          - type: paragraph
            body: >-
              首要分析任务不是挑一个 TAM 数字，而是界定正确市场。Delinea 自己的平台叙事已经不再是简单的密码保险库故事。当前产品页面和平台资料把公司定位为身份安全平台，覆盖人类、机器和 AI
              身份，并以集中式授权和平台化作为战略楔子。这让公司处在一个分层市场位置。Delinea 仍然参与经典特权访问管理竞争，但也延伸到更宽的身份治理、非人类身份和工作流控制预算。竞品表述支持这一判断：CyberArk
              和 Okta 都把身份定位得比保险库更宽，Microsoft Entra 则把混合身份和治理放进同一决策集合。实际含义是，相关市场比完整 IAM 宇宙更窄，但又比传统 PAM 更宽。买方在购买专门的
              Delinea 类平台前，也可以用原生身份工具、分散的 MFA 和密码控制，或治理套件来替代。
