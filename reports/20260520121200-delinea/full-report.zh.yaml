            body: >-
              Delinea 公开证据中较积极的意外之一，是它在 GitHub 暴露了不少面向从业者的工具。那些代码仓库不是核心产品，但确实显示平台周边有真实自动化层：公开平台示例代码仓库、面向 Secret Server 和
              Platform API 的 Python SDK、DevOps Secrets Vault 的 Terraform provider、用于 CI/CD 获取的 GitHub Action，以及可导出
              Terraform、Ansible 和防火墙格式的 network-requirements CLI。对一家商业产品为专有软件的安全厂商来说，这是有意义的开发者信号，因为它缩小了“我们有
              API”和“从业者真的能自动化它”之间的可信度缺口。它也支持一个判断：Delinea
              的技术差异化不只在保险库，还在把身份控制运营化到工作流和环境中。权衡点是，代码仓库和功能页面更清楚地呈现平台外部接口，而不是内部架构。公开成熟度看起来扎实；公开内部仍然选择性不透明。
