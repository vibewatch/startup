      - number: '2.5'
        title: 对 Delinea 的含义与剩余市场缺口
        blocks:
          - type: paragraph
            body: >-
              尽调层面的市场结论应刻意收窄。Delinea 处在一个好市场，但不是一个能被干净测量的市场。公开证据支持一个巨大且扩张中的身份安全机会、一个耐久的 PAM 核心，以及围绕机器和 AI
              身份控制的新相邻空间。缺失的是从这些自上而下叙事通向公司专属收入楔子的桥。公开来源没有显示产品线收入结构、平台模块 attach rate，也没有独立对标 Delinea
              的部署速度主张与最强替代方案。这个缺口重要，因为当一家有真实执行动能的公司被套进过于慷慨的 TAM 时，估值工作会被扭曲。因此，投资判断应同时保留多重镜头：用经典 PAM 保住下限现实性，用更宽的 IAM
              和治理体现战略上行，并明确标出 Delinea 专属市场捕获的证据缺口。这个框架足以支持继续研究的信心，但不足以支撑精确的公开 SAM 主张。
