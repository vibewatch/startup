    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、源流与产品范围
        blocks:
          - type: paragraph
            body: >-
              Delinea 当前官方叙事已经超出传统特权访问管理。关于页面、平台页面以及 2025-2026 年发布内容，把公司描述成一个身份安全控制平面，围绕集中式授权、Delinea Iris AI，以及跨人类、机器和
              AI 身份的持续治理构建。这个更宽的平台主张重要，因为公司底层仍在变现一套可识别的 PAM 组合：Secret Server、Privilege Manager、Cloud Suite/Server
              PAM、DevOps Secrets Vault、Identity Threat Protection 和相关控制模块，仍然是现役产品或转型期产品。公司的源流也需要说清楚。官方发布材料称，Delinea 于
              2021 年 4 月由 Thycotic/Centrify 合并而成，并在 2022 年 2 月公开推出 Delinea 品牌。第三方数据库里出现的 1999 或 2004
              等更早日期，更像是前身公司或法律沿革痕迹，而不是合并后 Delinea 品牌清晰的商业起点。
