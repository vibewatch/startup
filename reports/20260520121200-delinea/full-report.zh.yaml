      - number: '4.4'
        title: 资本充足性与投资判断阻断点
        blocks:
          - type: paragraph
            body: >-
              最难处理的公开限制，不是增长可见度，而是融资可见度。Delinea
              的所有权历史清晰指向资方支持；相较一家急着寻找新一轮融资的风投支持公司，这大概率降低了即时外部融资风险。但同一种所有权结构也意味着公开现金、债务、契约和 runway
              披露基本缺席。第三方数据库增加的是噪音而非清晰度，因为它们在融资、估值、创立历史和员工足迹上互相冲突。因此，最强公开事实是里程碑事实：2021 年合并期前收入已超过 $100 million，ARR 到 2024
              年 Q2 超过 $350 million，到 2025 年上半年超过 $400 million，管理层继续为收购、渠道扩张和云交付投入资金。最可辩护的判断是，Delinea
              可能拥有有吸引力的经常性收入质量和有意义规模；但在投资人能干净判断利润率路径或资本强度前，仍需要直接看到留存、CAC、毛利率桥、债务期限表和 runway 规划。单靠公开证据支持动能，不支持精确。
