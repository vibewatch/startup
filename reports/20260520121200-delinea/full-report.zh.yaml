      - number: '7.2'
        title: 运营、安全与可用性风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Delinea 自己的表面展示出比营销姿态更细腻的图景。DPA、信任中心和状态中心合在一起显示成熟控制栈，也显示业务暴露于现代身份安全 SaaS 的标准失效模式。DPA
              列明多租户、年度评估、第三方渗透测试、共同责任，以及大量使用 AWS 和 Azure。这些都是真实缓释项。但信任中心也列出多个近期 Cloud Suite 和 Privileged Access Service
              漏洞，包括一个 2026 年 CVSS 9.3 的 SQL 注入问题，并提醒本地部署客户，主机级入侵可能暴露应用数据和加密密钥。独立报道和 NVD 保留了 2024 年 Secret Server
              披露争议的记忆；这很重要，因为在安全软件中，厂商响应质量本就是产品承诺的一部分。状态中心证明可用性侧也真实存在：紧急证书轮换、与云服务商故障相关的 EU 区域密钥启动失败，以及与上游网络服务商中断相关的 US
              登录超时，都发生在 2026 年 5 月。Delinea 有有意义的缓释措施——区域托管、可用性承诺、信任中心通知和正式维护沟通——但开放网页记录仍支持把安全流程和可用性风险列为顶层剩余敞口。
