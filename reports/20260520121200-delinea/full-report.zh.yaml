      - number: '4.2'
        title: GTM 动作与增长能力投入
        blocks:
          - type: paragraph
            body: >-
              Delinea 的披露指向一个增长引擎：直接企业销售与有分量的渠道和分销层混合。2024 年合作伙伴计划发布明确向经销商、GSI 和托管服务商提供分层奖励、财务激励、营销支持和赋能。2026 年 Climb
              扩张又把这套渠道逻辑进一步带入欧洲，说明 Delinea 仍在投资地域扩张，而不是只收割既有客户。领导层变化也强化同一故事：Chris Kelly 被聘来统筹全球销售、渠道、解决方案工程和客户成功；2025
              年业绩更新还强调在渠道、服务、客户成功和区域销售上继续招聘。公开披露的牵引力值得注意。Delinea 称 ARR 在 2024 年 Q2 超过 $350 million，在 2025 财年上半年超过 $400
              million，且 SaaS 占 ARR 多数。这些是公司主张，而非经审计文件，但方向上强于第三方数据库里互相矛盾的数值。结论是，Delinea
              看起来正在作为一家相当规模的经常性收入身份安全厂商扩张；但公开来源仍没有揭示 CAC、回本周期或带配额销售产能。
