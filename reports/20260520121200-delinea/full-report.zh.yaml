      - number: '1.2'
        title: 领导层、治理与运营足迹
        blocks:
          - type: paragraph
            body: >-
              领导层记录既支持最高层连续性，也显示 GTM 和财务职能发生了实质演进。从合并期到 2025-2026 年增长发布，Art Gilliland 一直是公司最清晰的公开面孔；James Legg
              起初担任合并后业务总裁，之后在 2022 年把职责交给 Rick Hanson，2025 年又由 Chris Kelly 负责 GTM 领导。Stephanie Reiter 在 2025 年 ARR
              发布中成为公开财务声音；已审阅的公司公告也能看到法务、产品、渠道和区域扩张负责人，构成并购后管理梯队。治理可见度更弱。公开材料在 2021 年提到 Pascal Van Dooren
              为董事，但当前董事会名单以及任何观察员或资方控制条款，在已审阅公开来源中均未披露。实体足迹证据也不完美：当前目录式资料指向 San Francisco，早期官方发布则使用 Redwood City 和
              Washington, DC 日期线。实际结论是，San Francisco 是目前支持度最高的总部地点，但地点历史应视为动态信息，而不是一个永恒事实。
