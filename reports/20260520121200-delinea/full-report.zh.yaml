        title: 规模测算：需求偏多，分母杂乱
        blocks:
          - type: paragraph
            body: >-
              公开市场估计在方向上有利，但方法并不一致。MarketsandMarkets 预计 IAM 2025 年约为 $26 billion，到 2030 年达到 $42.6 billion；The Business
              Research Company 给出的数字是 2025 年 $21.8 billion、2026 年 $25.2 billion，并在 2030 年达到 $45.2 billion。Identity
              Management Institute 另给出一个 2025 年超过 $24 billion 的口径，ISMG 则引用到 2032 年 $61.7 billion 的更大数字。Research and
              Markets 又把视角进一步放宽，明确纳入 TAM 工作、供应链分析和特权访问治理。这些数字不一定错误，但不能互换。有些描述宽泛 IAM，有些强调软件加治理，有些大量押注非人类身份和 AI
              驱动访问等未来相邻类别。对 Delinea 来说，干净结论是保留区间，抵制虚假精确。公司显然处在增长中的身份控制市场，但公开来源无法拆出一个可辩护的 Delinea 专属 SAM 或 SOM。
