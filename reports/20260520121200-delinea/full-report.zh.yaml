      - number: '4.3'
        title: 成本结构、利润率路径与资本配置
        blocks:
          - type: paragraph
            body: >-
              Delinea 不发布经审计成本结构，因此公开视角只能从自身运营足迹和成熟身份软件同业倒推。Delinea 的云交付足迹包括 Secret Server Cloud
              的英国数据中心等区域托管，这意味着持续的基础设施、合规和支持开支。公开 GTM 扩建和收购节奏，也意味着销售产能、服务和集成工作仍在消耗资金。SecurityWeek 对 2024 年 4 月 Secret
              Server 事件的报道同样具有财务相关性：即便最终没有确认租户受损，事件响应、修补、客户沟通和信任修复也都是真实成本中心。CyberArk 的 SEC 文件提供了最清晰的公开基准，说明成熟身份安全 SaaS
              经济模型通常长什么样。CyberArk 称超过 90%
              收入为经常性收入，订阅收入已成为主要驱动，订阅收入成本由支持人员、云运营、基础设施和摊销驱动。它也提醒，订阅转型可以改善长期耐久性，同时仍会改变现金时点和近期盈利能力。这个基准不能证明 Delinea
              的准确毛利率，但支持一个合理区间：经常性软件质量较高，同时云、服务和支持仍然实质影响经济模型。
