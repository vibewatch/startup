            body: >-
              可比上市公司能给出可用框架，但给不出精确答案。最相关的公开锚点不在泛横向 SaaS，而在身份与安全软件里。按 2026 年 5 月公开市场数据，CyberArk 位于相关区间高端，Okta
              低得多，SailPoint 介于两者之间。Multiples.vc 的行业视角补上了中间地带：网络安全和 GRC 软件倍数仍显著高于通用软件类别。这给 Delinea
              留下一个合理解读。不能自动按披露最充分、质量最好的上市标杆给它估值，但也不应把它当成疲弱的通用 SaaS 资产定价。因此，这组可比公司支持的是一个宽但真实的合理区间，而不是单点估值。落到实操上，Delinea
              更像一家应放进身份安全同业框架的公司，同时仍要承受私有公司和披露折价。
