          - type: paragraph
            body: >-
              如果把 Delinea 公开披露的年经常性收入（ARR）超过 $400 million 这一里程碑作为基准输入，同业倍数区间能给出方向有用、但刻意保持较宽的估值范围。悲观情景假设市场最终按较低倍数的身份平台给
              Delinea 定价，或隐藏杠杆和较弱留存把有效倍数压到 4x–5.5x 区间。对应估值大约为 $1.6 billion 至 $2.2 billion，也意味着自 2021
              年控股方交易以来，价值创造少得意外。基准情景采用 7x–10x 区间，对应约 $2.8 billion 至 $4.0
              billion；这大致匹配一家已有真实规模、品类相关性强、但透明度仍明显不足的公司。乐观情景假设如果 Delinea 的 ARR
              质量、利润率画像和退出准备度经验证较强，它可以拿到更接近优质网络安全公司的倍数，指向约 $5.0 billion 至 $6.4
              billion。公开证据足以支撑三情景结构，但不足以精确赋权。因此，这个模型应被视为价格纪律的筛选工具，而不是数据室的替代品。
            claimRefs:
              - CV001
              - CV010
              - CV011
              - CV012
              - CV019
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV012
              - CV019
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV002
              - CV011
              - CV012
      - number: '8.4'
        title: 投资逻辑、反向逻辑和决策
        blocks:
          - type: paragraph
            body: >-
              正向投资逻辑不难讲清。Delinea 似乎已有可观的身份安全规模，收入基底以经常性 SaaS
              为主，所在品类的上市可比公司仍能支撑中高个位数、甚至更高的收入倍数。反向逻辑也异常清楚：估值可见度差，第三方数据库相互矛盾，上市同业披露远多于
              Delinea，控股方结构又遮住了外部投资者最在意的经济性。这组因素挡住了买入建议。纪律严明的投资者可以合理地把 Delinea 放进观察名单，并在融资、IPO
              申报或老股交易带来真实价格可见度时准备介入。但在那之前，正确姿态是观察，而不是买入。下一步不是发挥模型想象力，而是收集估值标记、杠杆、留存、利润率和退出准备度证据。
