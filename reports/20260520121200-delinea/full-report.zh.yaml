      - number: '5.2'
        title: 工作流、自动化与集成架构
        blocks:
          - type: paragraph
            body: >-
              阅读 Delinea 技术时，最有用的方法是把它看作运营工作流，而不是营销功能清单。发现层找到特权账户、服务账户和云身份；策略与最小权限层限制这些身份能做什么；会话控制代理、监控并记录高风险活动；集成把
              Delinea 接入目录服务、工单、SIEM、恶意软件扫描和其他企业系统；自动化钩子让从业者在脚本和基础设施流水线中把这些控制落地。技术文档页面在这些工作流结果上很强。Secret Server
              文档说明多云发现和可脚本化 PowerShell 扩展。会话管理页面说明 RDP 与 SSH 代理、实时干预和可搜索录制。Privilege Manager 文档说明与 Active
              Directory、ServiceNow、Secret Server、VirusTotal、SIEM 和 SCCM 的集成；企业就绪材料又加入公开
              API、高可用、反向代理和移动管理。不过，架构仍没到真正深潜层级。公开材料足以理解工作流和依赖形态，但不足以精确绘制内部服务、事件总线或数据平面边界。
