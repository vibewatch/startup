  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与核心模块地图
        blocks:
          - type: paragraph
            body: >-
              Delinea 已不再把自己呈现为单一的特权密码保险库厂商。它的公开产品表面已经很明确：平台加模块。身份威胁防护、机密发现与保险库、会话管理、服务器权限、端点权限、治理控制、远程访问和 AI
              驱动授权，都被放在同一个商业框架内。产品价值主张围绕发现身份和特权账户、施加最小权限、监控活动，并横跨云和传统基础设施响应威胁。模块层面，页面相当具体。Identity Threat Protection
              聚焦持续监控、上下文构建、异常检测和响应。Secret Server 材料强调发现、依赖映射和保险库访问。Privilege Control for Servers 与 Privilege Manager
              把控制延伸到操作系统权限和端点应用。结果是，一张可信的模块地图，适合既想要传统 PAM
              深度、又需要较新身份安全覆盖的客户。仍不够公开的是这些模块之间的准确商业边界：页面展示了有什么，但没有展示哪些是标准配置、哪些是附加模块，或在控制平面层面整合得有多深。
