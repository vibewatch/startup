        title: 人员、执行与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              最后一类风险，是不透明下的执行。Delinea 的公开发布显示强动能——ARR 超过 $400
              million，继续投资服务和客户成功，推进收购、渠道增长和公共部门野心——但这些都没有配套上市同业所需的披露深度。CyberArk 的 SEC
              文件是有用基准，因为它显示一家上市身份安全厂商会如何更透明地讨论经常性收入、支持和云成本驱动，以及风险因素。Delinea 没有公开提供这一层细节。公司也经历了有意义的 GTM 领导层更替：James Legg
              到 Rick Hanson，后来又到 Chris
              Kelly，同时继续在渠道、服务和客户成功上招聘。这可能是健康扩张，但仍是运营变化。因此，关键风险不太像某一个单独破损指标，更像累计执行负荷：整合收购、扩张伙伴、管理可用性、满足隐私义务，并在披露仍然部分缺失的情况下守住客户信任。如果这组任务推进顺利，同样的变化会加深
              Delinea 护城河；如果推进不顺，下行大概率先出现在支持负担、续约放慢，或公共部门和交叉销售执行延迟，而不是某个戏剧性头条事件。
