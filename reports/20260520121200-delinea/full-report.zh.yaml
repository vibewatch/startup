      - number: '1.4'
        title: 规模、动能与里程碑轨迹
        blocks:
          - type: paragraph
            body: >-
              公开运营曲线很强，尽管并非每个指标都以当前精度披露。Delinea 2022 年以 $250 million ARR 收官并新增 1,300+ 客户；2025 年 1 月领导层发布称，截至 2024 年
              Q2，业务 ARR 已超过 $350 million，并服务全球超过 8,500 家机构。之后两份 2025 年发布进一步抬高图景：fiscal 2024 ARR 据称接近 $400 million，经常性收入占
              95%；到 2025 年 8 月，ARR 已超过 $400 million，SaaS 仍占收入结构多数。公司把这些财务里程碑与运营信号并列呈现，包括 99.995% 可用性、500+ 集成，以及每天保护 1M+
              身份。2024 年以来的里程碑还显示 Delinea 同时向多个方向扩张：全球合作伙伴计划、Mexico City 扩张、Secret Server 的 FedRAMP High 流程、EMEA/APAC
              新区域负责人，以及收购 StrongDM，把运行时授权带入 Delinea Platform。合在一起，这些里程碑支持一个结论：公司正在从传统 PAM 向更宽的身份安全平台故事扩张。
