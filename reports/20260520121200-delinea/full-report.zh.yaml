  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与合同风险
        blocks:
          - type: paragraph
            body: >-
              Delinea 的公开法律和隐私表面显示的是真实合规负担，而不是泛泛网络安全套话。隐私政策称，公司在营销、活动、客户支持、社区论坛、计费和云服务交付中处理个人信息，并明确引用 GDPR、CCPA、国际传输以及受
              DPA 约束的处理者角色。California 和 EU 指引进一步抬高风险：CCPA 创设删除、更正、选择退出和某些数据泄露责任权利，EU 数据保护指引则强调有约束力的 GDPR
              义务和跨境传输保障。Delinea 的公开合同同样与风险实质相关。使用条款选择 California 作为管辖地，并对网站相关材料广泛排除保证和间接损害。MSLA
              在运营上更重要：年度预付、自动续约、用量报告、审计权和渠道伙伴采购机制，都可能在续约、计费和争议中制造摩擦。这些并不证明 Delinea
              遭遇过重大执法或诉讼，但证明公司处在有意义的隐私与合同风险包络内。正确的投资判断结论不是 Delinea 有已知法律问题；而是法律和监管义务可见，实际执法历史披露仍不完整。
