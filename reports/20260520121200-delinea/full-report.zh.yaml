      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              该类别的购买动作天然跨职能。安全负责人往往拥有问题定义权，因为特权访问和身份泄露显然是安全问题；但运营负责人常常是 IAM
              架构师、基础设施团队、云团队和审计人员。用户包括管理员、开发者、服务账户负责人和治理人员。付款方可能落在安全、IAM、云或合规预算中，取决于触发因素：零信任要求、审计发现、云迁移、AI agent
              控制，或无密码现代化。金融服务、医疗、政府和大型 IT
              环境等受监管垂直领域，反复出现在市场分层和厂商定位中，因为它们同时面对更高审计压力和更复杂的混合资产。采用通常从一个痛点切入——未管理的特权访问、机器身份蔓延，或控制碎片化——等买方意识到点工具无法在身份和环境之间提供足够可见性、最小权限或一致策略执行后，再转向更宽的平台决策。
