      - number: '6.2'
        title: 具名生产证明与可衡量客户结果
        blocks:
          - type: paragraph
            body: >-
              Delinea 公开客户记录中最好的部分，是若干参考案例超出泛泛推荐语，描述了带可衡量结果的真实工作流。Robert Weed 在近 200 个系统和超过 100 台工作站上使用 Secret
              Server，客户估计现在查找和管理凭据所需工作量约为过去的十分之一。Boyner 展示了更宽的平台故事：在 Delinea Platform 上使用 Secret Server 加 Privileged
              Remote Access，并声称特权账户管理时间和成本降低超过 40%，合规支持工作量减少 60%。The Trade Desk 证明了完全不同的买方动作：Fastpath 作为 Oracle Cloud
              ERP 内 SOX、职责分离和变更追踪的控制层。TEPCO Systems 和 SBA Communications 从另一个角度强化同一模式。在这两种情况下，Delinea
              的价值主张都不是抽象网络安全品牌，而是让任务关键环境中的审计、可追踪性和特权控制更可管理。这是强采用证据，因为它显示 Delinea
