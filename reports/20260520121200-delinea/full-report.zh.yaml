  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、包装与变现姿态
        blocks:
          - type: paragraph
            body: >-
              Delinea 的公开商业表面，看起来像一个围绕多个可销售控制层构建的经常性企业软件模式，而不是单一的密码保险库产品。公司营销一个平台、打包套件，以及 Server Suite、Privileged Remote
              Access、Fastpath Access Control 和 AI 驱动授权等独立模块家族。这在财务上重要，因为它创造了几条可信的经常性收入增长路径：从核心 PAM
              落地，增加相邻授权或治理模块，并在云、合规和机器身份需求扩张时扩展账户。公开页面不发布可用的标价，这强烈暗示 Delinea
              仍主要通过询价驱动的企业合同、演示、试用、合作伙伴和议定范围销售。这对高端中型市场和企业网络安全很常见，但也意味着开放网页不足以推导 ASP
              或折扣行为。因此，最好的公开结论是结构性的，而不是精确数字：Delinea 可能具备偏订阅的收入质量和交叉销售潜力，但实际定价仍是尽调事项，不是已经解决的公开事实。
