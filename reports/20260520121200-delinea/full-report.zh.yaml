      - number: '1.5'
        title: 反向信号与剩余尽调问题
        blocks:
          - type: paragraph
            body: >-
              最清晰的概览层面反向信号，是产品安全流程风险。SecurityWeek 和 Dark Reading 均报道称，在 2024 年 4 月一个关键 Secret Server SOAP API
              漏洞公开前，Delinea 似乎忽视或处理不充分，未能妥善回应持续数周的负责任披露沟通。NVD 后来把 CVE-2024-33891 记录为认证绕过问题，CNA 严重性为高；Delinea
              自己的公告页面也显示，Secret Server 和 Cloud Suite 在 2025 与 2026 年继续累积额外 CVE。上述情况不否定前文的业务动能；公司也公开发布安全公告，并推动 Secret
              Server 取得 FedRAMP High。但这意味着下行情景不只是理论风险。公开证据仍留下重大概览问题：当前准确客户数、当前董事会构成、2021 年后所有权比例，以及是否发生过任何 2024
              年资方再资本化。这些问题重要，因为它们影响估值信心、退出准备度判断，以及在披露不透明下应给运营强度打多大折扣。
