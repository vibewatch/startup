  topStrengths:
    - '>$400M ARR and a SaaS-majority mix indicate Delinea has reached real recurring-revenue scale in identity security.'
    - >-
      The product surface now spans PAM, authorization, governance, secrets, remote access, and identity-threat
      workflows rather than a single vault product.
