          detail: Use local methods, BNPL, and promotional offers.
        - label: Travel / experience
          detail: Third-party providers deliver the service.
        - label: Post-booking support
          detail: Refunds, changes, and issue resolution determine trust.
    claimRefs:
      - CU001
      - CU003
      - CU015
      - CU020
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: Public customer proof strengthens at the top of the funnel and weakens at retention depth.
    data:
      items:
        - label: Awareness / app installs
          value: 138
        - label: Active usage
          value: 40
        - label: Campaign engagement
          value: 35
        - label: Partner conversion support
          value: 50
        - label: Retention proof
          value: 1
    claimRefs:
      - CU003
      - CU010
      - CU011
      - CU007
      - CU019
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: standard
    summary: Traveloka has strong partner proof, moderate app proof, and weak public retention proof.
    data:
      columns:
        - Strong proof
        - Moderate proof
        - Weak proof
      rows:
        - label: Consumer scale
          values:
            - Downloads and MAUs
            - App ratings
            - Retention cohorts
        - label: Partner value
          values:
            - PwC sales uplift, Marriott, STB, Amadeus
            - Campaign anecdotes
            - Merchant churn
        - label: Trust / satisfaction
          values:
            - None
            - Reviews.io mixed evidence
            - Trustpilot and complaint forums
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU013
  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: standard
    summary: Indicative public-signal retention cohort using directional percentages rather than disclosed company cohorts.
    data:
      columns:
        - Year 1 retention
        - Year 2 retention
        - Year 3+ retention
      rows:
        - label: Double-digit-date repeat booking behavior
          values:
            - 65
            - 55
            - 50
        - label: App ratings and store polish
          values:
            - 70
            - 60
            - 55
        - label: Open review trust and support sentiment
          values:
            - 40
            - 35
            - 30
        - label: Direct cohort retention data
          values:
            - 0
            - 0
            - 0
    claimRefs:
      - CU004
      - CU009
      - CU010
      - CU018
    approximationNotes: >-
      Values are directional placeholders derived from public habit and sentiment signals, not disclosed company
      cohorts.
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: Supplier-side failures travel through Traveloka’s platform and reappear as customer trust risk.
    data:
      columns:
        - High likelihood
        - Lower likelihood
      rows:
        - label: High impact
          values:
            - Trust / support risk
            - Regulatory or data incident
        - label: Lower impact
          values:
            - Promotion-led margin slippage
            - Localized expansion miss
    claimRefs:
      - CR002
      - CR009
      - CR010
      - CR015
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: standard
    summary: >-
      Traveloka remains exposed to macro travel cycles while taking on incremental expansion risk outside its strongest
      markets.
    data:
      nodes:
        - id: competition
          label: Competition
          detail: Global and regional OTAs pressure price and take rate.
        - id: support
          label: Support failures
          detail: Refund and post-booking pain harms trust.
        - id: regulation
          label: Fintech regulation
          detail: BNPL oversight can constrain monetization.
        - id: margin
          label: Margin pressure
          detail: Lower take rate or higher servicing cost.
        - id: valuation
          label: Valuation discount
          detail: Lower confidence and wider discount.
        - id: growth
          label: Growth slowdown
          detail: Repeat demand and conversion weaken.
      edges:
        - from: competition
          to: margin
          label: compresses
        - from: support
          to: growth
          label: reduces
        - from: regulation
          to: margin
          label: adds cost
        - from: growth
          to: valuation
          label: weakens
        - from: margin
          to: valuation
          label: widens discount
    claimRefs:
      - CR005
      - CR006
      - CR009
      - CR028
  - id: FR003
    title: Dependency map
    type: dag
    layout: standard
    summary: Traveloka’s risk surface expands materially when travel commerce intersects with financing and user data.
    data:
      nodes:
        - id: travel
          label: Travel commerce
          detail: Bookings and marketplace operations.
        - id: payments
          label: Payments / BNPL
          detail: Checkout and financing.
        - id: data
          label: User data
          detail: Location, identifiers, usage data.
        - id: regulator
          label: Regulators
          detail: OJK and consumer-protection bodies.
        - id: customer
          label: Customers
          detail: Complain, repay, and share data.
      edges:
        - from: customer
          to: travel
          label: bookings
        - from: customer
          to: payments
          label: repayment and financing
        - from: customer
          to: data
          label: data generation
        - from: regulator
          to: payments
          label: financing rules
        - from: regulator
          to: data
          label: privacy scrutiny
    claimRefs:
      - CR003
      - CR004
      - CR011
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Traveloka likely deserves a discount to top public travel platforms, but not a distressed multiple, given scale
      and reported profitability progress.
    data:
      nodes:
        - id: scale
          label: Scale and market relevance
          detail: Large regional user base and product breadth.
        - id: economics
          label: Improving economics
          detail: Reported profitability and debt cleanup.
        - id: opacity
          label: Opacity and trust discount
          detail: Audits/cohorts missing; complaints persist.
        - id: result
          label: Pass with caution
          detail: Favorable but qualified view.
      edges:
        - from: scale
          to: economics
          label: supports
        - from: economics
          to: opacity
          label: offset by
        - from: opacity
          to: result
          label: drives stance
    claimRefs:
      - CV007
      - CV008
      - CV013
      - CV016
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Traveloka’s value is driven by market position and optionality, but pulled down by opacity and trust risk.
    data:
      items:
        - label: Durable profitability
          value: 5
        - label: Retention / repeat demand
          value: 4
        - label: Customer trust drag
          value: -3
        - label: Macro travel cyclicality
          value: -2
        - label: B2B / fintech optionality
          value: 2
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV020
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Valuation is most sensitive to profitability durability, trust quality, and macro travel conditions.
    data:
      items:
        - label: Bear
          low: 1800
          high: 2400
          note: Complaint drag or soft margins.
        - label: Base
          low: 2600
          high: 3200
          note: Recovery holds with moderate discounts.
        - label: Bull
          low: 3600
          high: 4800
          note: Durable profitability and optionality convert.
    claimRefs:
      - CV014
      - CV015
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Strategic relevance supports a pass, but missing audits and trust concerns limit conviction.
    data:
      items:
        - label: Market relevance
          value: 4
          note: Strong regional position
        - label: Proof depth
          value: 3
          note: Scale is public; audits are not
        - label: Moat
          value: 3
          note: Integration and payments help
        - label: Economics
          value: 3
          note: Reported but thinly audited
        - label: Risk
          value: 2
          note: Trust/regulation remain material
        - label: Valuation support
          value: 3
          note: Latest marks look plausible
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
