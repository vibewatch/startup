      - number: '1.2'
        title: Founders, leadership visibility, and governance opacity
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is one of the cleanest company-overview facts. Traveloka is consistently linked to
              Ferry Unardi, Derianto Kusuma, and Albert Zhang, with Ferry still serving as the most visible executive
              face in public coverage. Retained sources also show a broader but still relatively opaque senior bench:
              Caesar Indra appears as President in 2023 impact-study materials, while older fintech reporting quotes
              Henry Hendrawan on the ambition for Traveloka’s financial-services arm. The problem is not that public
              sources show contradictory founders; it is that they do not provide a correspondingly clear governance
              surface for a company of this scale. No reliable, current public board roster or committee map surfaced in
              the retained set, and recent materials emphasize commercial partnerships and destination marketing more
              than internal governance. That means the diligence burden on management access remains high: leadership
              credibility looks strong enough, but key-person dependence around founders and the absence of public board
              detail materially limit how much of the governance story can be underwritten from open sources alone.
