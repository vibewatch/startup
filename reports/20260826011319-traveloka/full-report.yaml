      - number: '3.3'
        title: Moat durability and attack surface
        blocks:
          - type: paragraph
            body: >-
              Traveloka’s moat is commercial and local rather than code-community driven. Its strongest wedges are
              Southeast Asian localization, a large installed app base, wide partner supply, and a financing layer that
              can improve checkout conversion. But those are not untouchable. Global OTAs can invest in local payments
              and supplier relationships, Klook can deepen into more trip components, and customer-trust complaints give
              rivals an easy narrative attack line. Because Traveloka remains private, outsiders still cannot separate
              durable repeat demand from paid traffic or promotional intensity with high confidence. The result is a
              moat that appears real but not impregnable: good enough to support continued relevance, not good enough to
              remove execution risk from the investment case. Traveloka competes in a crowded travel stack where no
              single rival mirrors every module, but several better-capitalized peers can challenge its strongest
              categories; its real edge is local breadth and payments fit, not unmatched global scale. This matters
              because Traveloka is private, cross-category, and dependent on partner execution, so public evidence has
              to be read as directional rather than definitive. Investors should interpret the open-source record as
