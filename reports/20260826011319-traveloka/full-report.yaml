              reaching human support, and poor accountability when third-party providers fail. The app-store rating
              shows the product can still delight a meaningful subset of users, and double-digit-date booking patterns
              hint at habit formation, but there is no public cohort retention dataset that settles the durability
              question. There is also no clean public breakdown of revenue or bookings by segment, geography, or
              partner, which means concentration risk remains mostly hidden. Traveloka therefore has plenty of customer
