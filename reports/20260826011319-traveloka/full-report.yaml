              2025-2026 framework makes financing controls more explicit, while privacy disclosures and app-store data
              labels show a meaningful user-data footprint. Liquidity risk has likely improved since the company drew a
              large 2022 credit facility and reportedly repaid most or all of it early in 2024, but that same episode
              underscores cyclical vulnerability in travel demand. Competition remains relentless. Global OTAs, local
              specialists, and direct-supplier channels all pressure take rates, marketing costs, and user loyalty,
