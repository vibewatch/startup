companyProfile:
  summary: >-
    Traveloka is a 2012-founded, Jakarta-centered private travel and lifestyle platform whose public evidence now
    supports a broader identity than a simple OTA. The retained source set shows a scaled consumer app, deep
    local-payment and pay-later adjacency, supplier and B2B API surfaces, and material regional distribution relevance
    across Southeast Asia with newer Japan expansion. The main diligence question is no longer whether Traveloka is
    strategically real; it is whether current profitability quality, repeat-demand durability, regulatory exposure, and
    cap-table or disclosure opacity justify paying materially above the latest multi-billion private marks.
