      - number: '1.4'
        title: Milestones, partnership-led expansion, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Traveloka’s milestone record shows a company moving from Indonesian startup to ecosystem orchestrator. The
              2017-2018 financing wave, the later PayLater financing structure, the 2023 profitability inflection, and
              the 2024 early debt repayment are all meaningful turning points. Japan’s 2024 office opening and 2025
              service launch matter because they demonstrate that Traveloka is still adding geographies rather than just
              deepening legacy Southeast Asian markets. Equally important, the current recovery story is
              partnership-heavy: Traveloka now uses destination boards, hotel chains, travel-tech vendors, and B2B APIs
              to extend reach. That is strategically positive, but it does not erase quality and trust concerns.
              Trustpilot, Reviews.io, and Mediakonsumen show repeated customer dissatisfaction around pricing changes,
              refund handling, and limited human support escalation. Those adverse signals do not negate Traveloka’s
              scale, but they do narrow the margin for error in a model where the platform mediates between consumers
              and third-party travel providers. Later chapters should therefore treat partner leverage and customer
              trust as two sides of the same operating equation.
