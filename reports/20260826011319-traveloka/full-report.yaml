      - number: '1.3'
        title: Capital stack, performance recovery, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Traveloka’s post-pandemic corporate narrative is strongest where it intersects with funding and
              balance-sheet repair. Tracker coverage points to a January 2024 $300 million corporate round and a July
              2022 round marked at a $3 billion valuation, while the private-credit story is independently useful
              because it shows capital discipline rather than mere fundraising capacity. Private Equity Wire reports
              that Traveloka used internal cash to repay the drawn portion of its 2022 BlackRock-led credit facility
              early in 2024, suggesting substantially improved liquidity relative to the pandemic trough.
              DealStreetAsia’s 2024 headline that Traveloka turned profitable in 2023 strengthens that read, while the
              Parsers VC news feed preserves a 2023 report of 2022 revenue at US$225.9 million with losses down 29%. The
              caveat is that private-company disclosure quality remains uneven. Funding databases disagree materially on
              lifetime capital raised, current valuation is stale, and current revenue, headcount, and active-customer
              disclosures are not sufficiently clean to treat as ground truth. Traveloka therefore looks stronger than a
              simple “still recovering OTA” story, but weaker than a company that already offers public-markets-grade
              transparency.
