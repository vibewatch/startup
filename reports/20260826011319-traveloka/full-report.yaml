chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform scope, and geographic footprint
        blocks:
          - type: paragraph
            body: >-
              Traveloka’s retained official and partner surfaces support treating the company as more than a narrow
              online ticketing intermediary. The archived about page, partner-facing Atlas API site, app-store listings,
              and JETRO’s Japan profile all describe an all-in-one travel platform spanning flights, accommodations,
              ground transport, airport transfers, attractions, cruises, and adjacent local services. The business also
              advertises financial-services touchpoints such as payments, pay-later financing, and insurance products,
              making the current identity closer to a regional travel-and-lifestyle platform than a single-purpose OTA.
              Geography is similarly broader than many older company profiles imply. JETRO and Traveloka’s own pages
              support active operations across Indonesia, Japan, Malaysia, the Philippines, Singapore, Thailand,
              Vietnam, and Australia. Official scale disclosures are large but not perfectly synchronized: Atlas cites
              138M+ downloads and 50M+ monthly active users, while JETRO says 140M+ downloads and 40M+ MAUs. The prudent
              read is not that one source is necessarily wrong, but that Traveloka’s public communications round metrics
              differently across surfaces and update at different cadences. What is clear is regional scale, product
              breadth, and a marketplace model built around third-party providers rather than wholly owned travel
              supply.
