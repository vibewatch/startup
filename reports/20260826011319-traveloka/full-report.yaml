        title: The most material risks are trust, regulation, and opacity
        blocks:
          - type: paragraph
            body: >-
              Traveloka’s public risk profile is not dominated by one existential flaw; it is dominated by a cluster of
              structural risks that matter because the company is a private, two-sided travel marketplace with financing
              adjacency. The most immediate risk is customer trust leakage around refunds, pricing clarity, and
              post-booking support. The most consequential medium-term risk is regulatory complexity, especially where
              payments and BNPL intersect with consumer-travel transactions. The most persistent investor risk is
              disclosure opacity: without listed-company reporting, it is difficult to prove the durability of
              profitability, margin quality, or cash generation. Traveloka’s biggest public risks are customer-trust
