  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition and directional sizing
        blocks:
          - type: paragraph
            body: >-
              Traveloka’s market should be defined as a consumer travel platform layered with experiences,
              travel-related financial services, and partner distribution rather than as a flights-only OTA. That
              broader definition matters because the company can potentially monetize more of the traveler wallet than
              point-solution booking sites, but it also means the public sizing problem becomes less precise. Retained
              third-party sources provide only range-based anchors. Research and Markets pegs Indonesia’s online travel
              and tourism platforms market at roughly US$10 billion, while PhocusWire frames a US$17 billion future for
              Indonesian online travel. Phocuswright’s Southeast Asia travel work confirms a strong regional recovery
              backdrop through 2026, but none of these sources independently prove Traveloka’s own market share. The
              most defensible approach is therefore to use public market data as directional context and Traveloka’s
              official platform-breadth and user-scale disclosures as evidence that the company sits on a large
              monetizable surface, without pretending open sources can produce a clean TAM / SAM / SOM stack for
              underwriting. Traveloka’s market opportunity is unquestionably large and still growing, but open sources
              narrow the addressable pool only directionally; the real valuation question is whether market growth
              converts into durable, profitable repeat bookings. This matters because Traveloka is private,
              cross-category, and dependent on partner execution, so public evidence has to be read as directional
              rather than definitive. Investors should interpret the open-source record as enough to form a working
              view, but not enough to eliminate diligence asks around economics, cohorts, compliance, or downside
              transmission.
