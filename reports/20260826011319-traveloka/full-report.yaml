        title: Unit economics proxies and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Traveloka’s open-source unit-economics picture is mostly a set of visible inputs wrapped around invisible
              margins. Traffic scale, inventory breadth, and financing attachment opportunities are all clearly present,
              but public sources do not reveal the take rate, blended gross margin, CAC, or repeat-booking profile that
              would let an investor translate scale into contribution margin. The strongest capital-adequacy signal is
              the early repayment of the 2022 private-credit facility from internal cash in 2024. That suggests a
              materially healthier cash-generation path than during the pandemic aftermath. But this is still a private
              company: current cash, burn, runway, and debt terms are not public, so one positive liquidity signal
              cannot substitute for a real treasury view. Public evidence supports a real recovery and a healthier
              balance-sheet posture than during the pandemic trough, but current private-company financials remain too
