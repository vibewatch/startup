- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk area
  - Public signal
  - Why it matters
  - Current read
  - Gap
  rows:
  - - End-customer concentration
    - No public cohort or segment revenue mix
    - Weakens underwriting of repeat demand
    - unknown
    - Need repeat-booker and revenue-by-segment data.
  - - Supplier concentration
    - Large named partners increasingly visible
    - Could improve supply or increase bargaining power
    - mixed
    - Need top-partner volume concentration.
  - - Destination-corridor concentration
    - Singapore, Japan, and SEA campaigns are prominent
    - May skew demand toward a few corridors
    - mixed
    - Need booking split by geography.
  - - Trust concentration
    - Support quality can dominate perception
    - One failure can push easy switching
    - negative
    - Need complaint-rate and resolution-time metrics.
  - - Promotion dependence
    - Sales events and double-digit-date campaigns matter
    - Could pull demand forward
    - mixed
    - Need repeat purchase without incentives.
  - - Partner-side proof skew
    - Most named proof points are partners, not end customers
    - Can hide end-user churn or dissatisfaction
    - negative
    - Need direct enterprise/consumer retention evidence.
  notes: Traveloka’s customer chapter shows proof of scale, but concentration and repeat-usage analytics are still mostly hidden from public view.
