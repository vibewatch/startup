- id: trust-retention-and-concentration
  title: Trust, retention, and concentration limits
  body: Where Traveloka’s customer chapter weakens is not scale, but quality of retention evidence and post-booking trust. Open review surfaces repeatedly cite refund friction, misleading pricing, difficulty reaching human support, and poor accountability when third-party providers fail. The app-store rating shows the product can still delight a meaningful subset of users, and double-digit-date booking patterns hint at habit formation, but there is no public cohort retention dataset that settles the durability question. There is also no clean public breakdown of revenue or bookings by segment, geography, or partner, which means concentration risk remains mostly hidden. Traveloka therefore has plenty of customer proof, but not enough to remove concerns about trust leakage or partner dependence. Traveloka has clear proof of scale and partner relevance, but open sources still leave customer retention, concentration, and post-booking trust quality underdetermined. This matters because Traveloka
    is private, cross-category, and dependent on partner execution, so public evidence has to be read as directional rather than definitive. Investors should interpret the open-source record as enough to form a working view, but not enough to eliminate diligence asks around economics, cohorts, compliance, or downside transmission. Repeat-use quality is therefore inferred rather than directly disclosed.
