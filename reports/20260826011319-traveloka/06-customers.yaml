  title: Customers
  summary: Traveloka has clear proof of scale and partner relevance, but open sources still leave customer retention, concentration, and post-booking trust quality underdetermined.
sections:
- id: who-uses-traveloka
  title: Who uses Traveloka and why
  body: Traveloka’s public customer surface spans both end-users and ecosystem customers. Consumer-facing evidence shows a mass-market travel app that serves domestic leisure, regional outbound, family experiences, and bundled trip-planning needs. Partner-facing evidence shows a second customer layer made up of hotel groups, destination boards, experience operators, and B2B distributors that want access to Traveloka’s reach, data, and booking infrastructure. That dual-customer structure matters because Traveloka is monetized not only by traveler bookings but also by the commercial value it provides to suppliers and tourism bodies. Traveloka has clear proof of scale and partner relevance, but open sources still leave customer retention, concentration, and post-booking trust quality underdetermined. This matters because Traveloka is private, cross-category, and dependent on partner execution, so public evidence has to be read as directional rather than definitive. Investors should interpret
    the open-source record as enough to form a working view, but not enough to eliminate diligence asks around economics, cohorts, compliance, or downside transmission. Traveloka has clear proof of scale and partner relevance, but open sources still leave customer retention, concentration, and post-booking trust quality underdetermined. This matters because Traveloka is private, cross-category, and dependent on partner execution, so public evidence has to be read as directional rather than definitive. Investors should interpret the open-source record as enough to form a working view, but not enough to eliminate diligence asks around economics, cohorts, compliance, or downside transmission.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU017
  - CU018
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: proof-of-scale-and-partner-value
  title: Proof of scale and partner value
  body: 'The strongest adoption proof is at the top of the funnel. Atlas and JETRO provide large download and MAU anchors, while Traveloka’s own booking-data and campaign releases show meaningful engagement intensity. On the partner side, the evidence is stronger than one might expect for a private consumer platform: Marriott, STB, Resorts World Sentosa, HBX, and Amadeus all publicly position Traveloka as a material channel. PwC’s 2023 study adds a broader supplier proof layer, with many participating businesses reporting meaningful sales uplift after partnering with the platform. This does not prove long-run cohort quality by itself, but it does prove Traveloka matters commercially to both consumers and merchants. Traveloka has clear proof of scale and partner relevance, but open sources still leave customer retention, concentration, and post-booking trust quality underdetermined. This matters because Traveloka is private, cross-category, and dependent on partner execution, so public evidence
    has to be read as directional rather than definitive. Investors should interpret the open-source record as enough to form a working view, but not enough to eliminate diligence asks around economics, cohorts, compliance, or downside transmission.'
