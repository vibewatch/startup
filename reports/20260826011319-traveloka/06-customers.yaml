    topic: retention
    missingEvidence: Repeat-booker rate, cohort retention, and customer lifetime value.
    whyItMatters: Scale without retention can be promotion-dependent and economically fragile.
    diligencePath: Request retention cohorts and repeat-purchase metrics by geography and category.
    relatedQuestionRefs:
    - QU006
    - QU018
    - QU025
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-partner, top-corridor, and segment booking concentration.
    whyItMatters: Concentration can materially change bargaining power and downside risk.
    diligencePath: Request booking/revenue concentration by partner and geography.
    relatedQuestionRefs:
    - QU012
    - QU021
    - QU025
