  - type: private-evidence-only
    severity: material
    topic: legal
    missingEvidence: Comprehensive litigation, enforcement, and regulatory inquiry record.
    whyItMatters: Private-company legal exposure can materially change downside risk.
    diligencePath: Run legal diligence and request outside counsel summary.
