    severity: material
    topic: complaint-resolution
    missingEvidence: Complaint-resolution rates, support SLAs, refund-cycle performance, and chargeback metrics.
    whyItMatters: Would determine whether trust issues are isolated anecdotes or a scalable operating problem.
    diligencePath: Request customer-service KPI deck and regulator complaint logs.
    relatedQuestionRefs:
