- id: what-is-mitigated-and-what-is-still-unknown
  title: What is mitigated and what is still unknown
  body: 'There are also clear mitigating signals. Traveloka has scale, major partners, broader category coverage than a narrow OTA, and signs that liquidity stress is less acute than in the immediate post-pandemic period. Those strengths reduce—but do not remove—risk. Public evidence still does not reveal lawsuit exposure in a dependable way, does not quantify complaint-resolution rates, and does not prove durable free-cash-flow quality. The most likely downside scenario is a grind: elevated support pain, competition-driven margin pressure, and only incremental monetization improvement. Tail risks are rarer but harsher, including fintech restrictions, a serious data/privacy incident, or another macro travel shock. Traveloka’s biggest public risks are customer-trust leakage, fintech regulation, and private-company opacity rather than immediate solvency concerns. This matters because Traveloka is private, cross-category, and dependent on partner execution, so public evidence has to be read
    as directional rather than definitive. Investors should interpret the open-source record as enough to form a working view, but not enough to eliminate diligence asks around economics, cohorts, compliance, or downside transmission.'
