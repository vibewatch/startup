- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Wedge / risk
  - Durability
  - Evidence
  - Why it helps or hurts
  - Current read
  rows:
  - - Southeast Asian localization
    - medium-high
    - Official Traveloka and partner surfaces
    - Improves relevance and payments fit
    - Helpful but replicable with investment.
  - - Large app scale
    - medium
    - Atlas / JETRO metrics
    - Improves conversion and partner bargaining
    - Strong asset if engagement quality holds.
  - - Experiences breadth
    - medium
    - Traveloka and Klook surfaces
    - Expands wallet share
    - Contested by Klook and Trip.com.
  - - Financial-services layer
    - medium
    - Traveloka / DailySocial / OJK context
    - Can improve conversion and AOV
    - Adds regulatory and credit risk.
  - - B2B/API rails
    - medium
    - Atlas / Connect surfaces
    - Creates partner-side switching cost
    - Still underdisclosed commercially.
  - - Global-supply competition
    - negative
    - Booking/Agoda, Trip.com
    - Compresses margin and pricing power
    - Persistent headwind.
  - - Customer trust complaints
    - negative
    - Trustpilot and review platforms
    - Raises multi-homing risk
    - Meaningful weakness.
  - - Private-company opacity
    - negative
    - No current full public metrics
    - Makes moat quality harder to verify
    - Limits valuation support.
  notes: Durability scores are qualitative because retained open sources do not expose switching-cost or retention data with audit quality.
