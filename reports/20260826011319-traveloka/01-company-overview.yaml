  - FO003
- id: founders-leadership-and-governance
  title: Founders, leadership visibility, and governance opacity
  body: 'Founder continuity is one of the cleanest company-overview facts. Traveloka is consistently linked to Ferry Unardi, Derianto Kusuma, and Albert Zhang, with Ferry still serving as the most visible executive face in public coverage. Retained sources also show a broader but still relatively opaque senior bench: Caesar Indra appears as President in 2023 impact-study materials, while older fintech reporting quotes Henry Hendrawan on the ambition for Traveloka’s financial-services arm. The problem is not that public sources show contradictory founders; it is that they do not provide a correspondingly clear governance surface for a company of this scale. No reliable, current public board roster or committee map surfaced in the retained set, and recent materials emphasize commercial partnerships and destination marketing more than internal governance. That means the diligence burden on management access remains high: leadership credibility looks strong enough, but key-person dependence
    around founders and the absence of public board detail materially limit how much of the governance story can be underwritten from open sources alone.'
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  tableRefs:
  - TO002
- id: capital-stack-performance-and-disclosure
  title: Capital stack, performance recovery, and disclosure quality
  body: Traveloka’s post-pandemic corporate narrative is strongest where it intersects with funding and balance-sheet repair. Tracker coverage points to a January 2024 $300 million corporate round and a July 2022 round marked at a $3 billion valuation, while the private-credit story is independently useful because it shows capital discipline rather than mere fundraising capacity. Private Equity Wire reports that Traveloka used internal cash to repay the drawn portion of its 2022 BlackRock-led credit facility early in 2024, suggesting substantially improved liquidity relative to the pandemic trough. DealStreetAsia’s 2024 headline that Traveloka turned profitable in 2023 strengthens that read, while the Parsers VC news feed preserves a 2023 report of 2022 revenue at US$225.9 million with losses down 29%. The caveat is that private-company disclosure quality remains uneven. Funding databases disagree materially on lifetime capital raised, current valuation is stale, and current revenue, headcount,
    and active-customer disclosures are not sufficiently clean to treat as ground truth. Traveloka therefore looks stronger than a simple “still recovering OTA” story, but weaker than a company that already offers public-markets-grade transparency.
