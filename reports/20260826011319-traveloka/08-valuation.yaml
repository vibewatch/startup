  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited revenue, EBITDA, free-cash-flow, and segment economics.
    whyItMatters: These are necessary to convert a strategic narrative into a high-confidence valuation view.
    diligencePath: Request audited statements, monthly KPIs, and segment-margin detail.
    relatedQuestionRefs:
    - QV004
    - QV013
    - QV019
  - type: private-evidence-only
    severity: material
    topic: cohorts
    missingEvidence: Retention, CAC/LTV, and booking-frequency cohorts by geography and category.
    whyItMatters: Without cohorts, value could be overestimated if demand is promotion-heavy or trust-fragile.
    diligencePath: Request customer-cohort pack and repeat-booking analysis.
    relatedQuestionRefs:
    - QV009
    - QV018
    - QV024
