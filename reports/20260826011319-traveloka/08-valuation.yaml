    severity: minor
    topic: primary-round-docs
    missingEvidence: Primary financing documents or management-confirmed valuation detail for the 2024 round.
    whyItMatters: Would tighten the current valuation anchor materially.
    diligencePath: Obtain investor or company documentation from the 2024 financing.
