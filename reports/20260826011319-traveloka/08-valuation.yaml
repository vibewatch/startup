- id: TV004
  title: Comparable valuation table
  columns:
  - Question
  - Current answer
  - Why
  - What would change it
  rows:
  - - Is Traveloka investable at a strategic level?
    - yes, with caution
    - Scale and category position are real
    - Evidence of durable margins would strengthen.
  - - Does public evidence support a clean premium?
    - 'no'
    - Disclosure and trust gaps remain
    - Audited financials and cohort data.
  - - Is a multi-billion value still defensible?
    - 'yes'
    - Latest marks and scale support it
    - Would weaken if profitability proves shallow.
  - - Should investors apply a private discount?
    - yes, material
    - Opacity and complaint risk
    - Could narrow after IPO-quality disclosure.
  - - Is the current stance pass / flag / fail?
    - pass with cautions
    - Strategic relevance outweighs visible weaknesses
    - Would shift to flag if trust/regulatory risk worsens.
  - - Main blockers to high confidence
    - audits, cohorts, segment economics
    - These are missing from public sources
    - Request management data room material.
  notes: The table expresses stance rather than a false sense of precision around a single point estimate.
