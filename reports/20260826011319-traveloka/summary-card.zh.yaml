  topStrengths:
    - Traveloka 确有区域规模，公开信号指向约 140M 下载量、40M-50M+ MAU 和 2.2M+ 住宿供给。
    - 平台不只是传统 OTA，还把旅行预订、支付或先买后付、目的地营销和 B2B/API 分发入口拼在一起。
    - 据报道 2023 年实现盈利，2024 年初还清偿债务，相比疫情期财务韧性明显增强。
  topRisks:
    - 公开信任信号好坏参半且偏负面，退款、价格清晰度和预订后支持反复被投诉。
    - BNPL 和支付邻近业务带来的监管与合规敞口，高于纯 OTA。
    - 经审计财务、分部经济性、客户队列和股权结构条款仍未公开。
  unresolvedGaps:
    - 经审计收入、EBITDA、自由现金流和分部利润率细节仍缺失。
    - 复购队列、CAC/LTV、投诉解决率和头部合作伙伴集中度仍未披露。
    - 当前估值支撑仍高度依赖二级市场数据库、追踪器汇总和间接市场锚，而不是一手融资文件。
    - 所有运营实体的诉讼、执法和正式监管历史仍需要专项法律尽调。
