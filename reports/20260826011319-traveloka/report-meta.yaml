  productSummary: Traveloka sells travel booking, accommodation, transport, attractions, cruises, payments, pay-later financing, and partner/API distribution services across a regional consumer and supplier ecosystem.
  customerFocus: Mass-market leisure travelers, regional outbound users, tourism partners, hotel and experience suppliers, and B2B distribution partners that need Southeast Asian demand access.
  businessModel: Primarily OTA-style transaction commissions and marketplace monetization, supplemented by destination campaigns, partner distribution/APIs, and payments or financing-related monetization where permitted.
  stage: late private
  fundingStatus: Public sources support a January 2024 $300 million corporate round and historical institutional backing from Expedia, GIC, JD.com, BlackRock, Allianz X, IIA, and QIA, but lifetime funding totals still conflict across trackers.
