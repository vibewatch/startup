  topStrengths:
    - Traveloka has real regional scale, with public signals pointing to roughly 140M downloads, 40M-50M+ MAUs, and 2.2M+ accommodations.
    - The platform is broader than a classic OTA, combining travel booking, payments or pay-later, destination campaigns, and B2B/API distribution surfaces.
    - Reported 2023 profitability and early 2024 debt repayment suggest materially improved financial resilience versus the pandemic period.
  topRisks:
    - Public trust signals are mixed to negative, with recurring complaints around refunds, pricing clarity, and post-booking support.
    - BNPL and payments adjacency raise regulatory and compliance exposure beyond what a pure OTA would face.
    - Audited financials, segment economics, customer cohorts, and cap-table terms remain unavailable publicly.
  unresolvedGaps:
    - Audited revenue, EBITDA, free cash flow, and segment-margin detail remain missing.
    - Repeat-booking cohorts, CAC/LTV, complaint-resolution rates, and top-partner concentration are still undisclosed.
    - Current valuation support still relies heavily on secondary databases, tracker roundups, and indirect market anchors rather than primary financing documents.
    - Litigation, enforcement, and formal regulatory history for all operating entities still require dedicated legal diligence.
