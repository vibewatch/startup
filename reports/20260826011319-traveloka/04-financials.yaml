- id: what-still-blocks-underwriting
  title: What still blocks high-conviction underwriting
  body: Traveloka’s financial due-diligence blocker set is unusually clear. Investors still lack a current revenue run-rate, a category-level margin bridge, current cash and runway, PayLater loss and funding-cost data, and the debt/cap-table detail needed to estimate true equity value. Funding databases even disagree on lifetime capital raised, which is a warning that historical financing needs careful reconciliation before any dilution or preference analysis. For that reason, Traveloka’s financial chapter can support a constructive “recovery and resilience” narrative, but not a high-conviction view on valuation or capital sufficiency. The right investment implication from public evidence is disciplined curiosity, not false precision. Public evidence supports a real recovery and a healthier balance-sheet posture than during the pandemic trough, but current private-company financials remain too opaque for high-conviction underwriting. This matters because Traveloka is private, cross-category,
    and dependent on partner execution, so public evidence has to be read as directional rather than definitive. Investors should interpret the open-source record as enough to form a working view, but not enough to eliminate diligence asks around economics, cohorts, compliance, or downside transmission.
