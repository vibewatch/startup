  - - Accommodation distribution
    - 2.2M+ accommodation inventory and hotel APIs
    - Commission and distribution economics
    - medium
    - Inventory breadth is not equal to booked nights.
  - - Attractions / experiences
    - Official app and about surfaces position them as core modules
    - Commission, merchandising, and campaign revenue
    - medium
    - Mix contribution not public.
  - - Financial services
    - PayLater, insurance, payments called out in public materials
    - Financing spread / fee / partner-sharing economics
    - medium
    - Loss rates and economics are private.
  - - B2B APIs / partner distribution
    - Atlas / Connect surfaces show bookable APIs
    - Commercial partner fees and distribution margins
    - medium
    - Commercial model not public.
  - - Promotions / campaigns
    - Destination and partner campaign releases recur frequently
    - Supplier-funded marketing and traffic monetization
    - low-medium
    - Campaign economics not quantified publicly.
  - - Loyalty / priority program
    - App pages mention Traveloka Priority points and rewards
    - Retention lever more than standalone revenue
    - low
    - Unit economics not public.
  notes: Revenue-stream table distinguishes visible commercial modules from unknown economic realization. Traveloka clearly sells many things; the unresolved question is how much net revenue each module retains after supplier costs and incentives.
