- id: buyer-map-and-demand-patterns
  title: Buyer map and demand patterns
  body: Traveloka’s buyer map is mixed. On the demand side, individual consumers use the app for domestic flights, hotels, attractions, regional breaks, and increasingly experience-led or family travel. On the supply side, hotel groups, tourism boards, cruise partners, and API resellers buy access to Traveloka’s demand, data, and distribution rails. Public materials make this visible through the mix of STB, Marriott, UOB Disney Cruise, Resorts World Sentosa, and B2B API announcements. These are not marginal PR embellishments; they show that Traveloka monetizes both consumer attention and partner distribution needs. The APAC trends study further suggests domestic trips remain important because of affordability and perceived safety, while Traveloka’s own double-digit-date data implies that some booking behavior has become habitual even outside major sale periods. The combination points to a market structure where consumer price sensitivity is high, but user habit, payment convenience, and
    supplier breadth still create room for scaled intermediaries. Traveloka’s market opportunity is unquestionably large and still growing, but open sources narrow the addressable pool only directionally; the real valuation question is whether market growth converts into durable, profitable repeat bookings. This matters because Traveloka is private, cross-category, and dependent on partner execution, so public evidence has to be read as directional rather than definitive. Investors should interpret the open-source record as enough to form a working view, but not enough to eliminate diligence asks around economics, cohorts, compliance, or downside transmission.
