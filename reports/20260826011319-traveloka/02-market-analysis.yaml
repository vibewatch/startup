- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Primary need
  - Budget owner
  - Why Traveloka fits
  - Key limitation
  rows:
  - - Domestic leisure traveler
    - Affordable planning and booking
    - Individual / household
    - Strong app-led demand and promotions
    - Price sensitivity is high.
  - - Short-haul regional traveler
    - Flights + hotels + attractions
    - Individual / household
    - Cross-border SEA relevance and local payment methods
    - Competitive OTA alternatives are abundant.
  - - Experience-led family traveler
    - Attractions, cruises, packages
    - Individual / household
    - Experiences inventory and partner campaigns
    - Higher support expectations.
  - - Destination / tourism board partner
    - Demand generation
    - Tourism-marketing budget
    - Traveloka offers data and reach into SEA travelers
    - Campaign ROI can be cyclical.
  - - Hotel and travel supplier partner
    - Distribution and occupancy
    - Commercial / channel budget
    - Marriott / HBX / Amadeus style integration proof
    - Supplier terms can compress margin.
  - - B2B reseller / affiliate partner
    - Inventory and booking API access
    - Partner business budget
    - Atlas / Connect / B2B platform
    - Requires onboarding and technical integration.
  notes: Traveloka’s buyer map is intentionally mixed because the platform sells to end-travelers while also monetizing supply and distribution relationships.
