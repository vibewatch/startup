    - Revenue remains shock-sensitive
    - Needs risk discount.
  - - Opaque market share and loyalty
    - Constraint
    - Gap in public evidence
    - Prevents precise underwriting
    - Supports research-more posture.
  notes: Drivers and constraints are ranked by relevance to Traveloka’s monetizable opportunity rather than broad tourism commentary.
