evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and investor-rights map.
    whyItMatters: Board composition and governance controls matter for IPO readiness and key-person risk assessment.
    diligencePath: Request the current board deck or governance summary from management.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: current-financial-scale
    missingEvidence: Current revenue run-rate, current headcount, and active-customer definitions.
    whyItMatters: Without current metrics, public-market comparability and underwriting confidence stay limited.
    diligencePath: Request the latest management KPI pack and audited consolidated financial statements.
    relatedQuestionRefs:
      - QO017
      - QO025
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: Reconciled lifetime capital raised figure that distinguishes equity, debt, and corporate financing.
    whyItMatters: Funding totals drive dilution, capital-intensity, and valuation context.
    diligencePath: Reconcile tracker totals against the cap table and debt schedule.
    relatedQuestionRefs:
      - QO012
      - QO014
  - type: stale
    severity: minor
    topic: valuation
    missingEvidence: A fresh 2025-2026 valuation mark or secondary transaction reference.
    whyItMatters: The last clean $3B valuation anchor is dated and may not reflect current economics or market appetite.
    diligencePath: Ask management or secondary-market brokers for the latest mark and transaction context.
    relatedQuestionRefs:
      - QO013
      - QO023
  - type: private-evidence-only
    severity: minor
    topic: public-evidence-closure
    missingEvidence: Certain questions remain only partially answered from public sources.
    whyItMatters: Private-company diligence limits certainty on the remaining questions.
    diligencePath: Request management materials or broader primary-source corroboration.
    relatedQuestionRefs:
      - QO010
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: Public sources do not support a complete enumeration for Leadership and founder table.
    whyItMatters: A partial table is still useful, but it understates long-tail entities or historical records.
    diligencePath: Expand source collection or request internal records.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: Public sources do not support a complete enumeration for Stakeholder or investor map.
    whyItMatters: A partial table is still useful, but it understates long-tail entities or historical records.
    diligencePath: Expand source collection or request internal records.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: Public sources do not support a complete enumeration for Milestone table.
    whyItMatters: A partial table is still useful, but it understates long-tail entities or historical records.
    diligencePath: Expand source collection or request internal records.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: market-share
    missingEvidence: Country-by-country market share or booking-share data for Traveloka versus peers.
    whyItMatters: Without share data, TAM context cannot be translated into defensible SOM ownership.
    diligencePath: Request management booking-share estimates or third-party OTA share datasets.
    relatedQuestionRefs:
      - QM021
  - type: private-evidence-only
    severity: material
    topic: loyalty-and-repeat
    missingEvidence: Repeat-booking rates, cohort behavior, and active-customer definitions.
    whyItMatters: Loyalty and repeat usage determine whether growth is durable or promotion-dependent.
    diligencePath: Request cohort retention and repeat-booker frequency by geography.
    relatedQuestionRefs:
      - QM022
      - QM023
      - QM024
  - type: stale
    severity: minor
    topic: tam-sam-som
    missingEvidence: Traveloka-specific top-down and bottom-up market sizing from management.
    whyItMatters: Public market reports support only directional ranges.
    diligencePath: Ask management for internal TAM / SAM / SOM model and corridor-level assumptions.
    relatedQuestionRefs:
      - QM020
      - QM021
  - type: private-evidence-only
    severity: material
    topic: pricing-economics
    missingEvidence: Like-for-like take rates, supplier commissions, and CAC by competitor.
    whyItMatters: Commercial rivalry matters only through economics, and open sources do not show them cleanly.
    diligencePath: Benchmark merchant terms, supplier contracts, and blended take rates against management data.
    relatedQuestionRefs:
      - QP008
      - QP019
      - QP024
  - type: missing-source
    severity: minor
    topic: tiket-comparison
    missingEvidence: A reliable official source for tiket.com scale and product breadth that is fetchable in this run.
    whyItMatters: Tiket.com is a locally relevant comparator but not essential to the core public comp set.
    diligencePath: Add a fetchable official or filing-grade tiket.com profile in a future refresh.
    relatedQuestionRefs:
      - QP001
  - type: private-evidence-only
    severity: material
    topic: moat-quantification
    missingEvidence: Retention, repeat-booking, and traffic-acquisition data by channel.
    whyItMatters: Without behavioral data, moat quality remains a strategic inference rather than a measured fact.
    diligencePath: Request cohort, NPS, acquisition-cost, and repeat-rate data from management.
    relatedQuestionRefs:
      - QP012
      - QP020
      - QP023
  - type: private-evidence-only
    severity: blocking
    topic: current-financials
    missingEvidence: Current revenue, gross margin, burn, runway, cash, and covenant package.
    whyItMatters: Without these basics, no high-confidence investment underwriting or valuation view is possible.
    diligencePath: Request latest audited or board-approved financial package and debt schedule.
    relatedQuestionRefs:
      - QI009
      - QI015
      - QI017
      - QI025
  - type: conflicting-data
    severity: material
    topic: lifetime-funding
    missingEvidence: Reconciled capital-raised figure across equity, debt, and corporate rounds.
    whyItMatters: Funding ambiguity distorts dilution, preference, and capital-intensity analysis.
    diligencePath: Reconcile cap-table, debt draw history, and tracker datasets.
    relatedQuestionRefs:
      - QI007
      - QI020
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, repeat-booking rate, take rate, gross margin, and PayLater loss rates.
    whyItMatters: These are the core variables that determine whether recovery translates into durable equity value.
    diligencePath: Request cohort, margin bridge, and credit-performance pack.
    relatedQuestionRefs:
