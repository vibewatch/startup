      - number: '7.3'
        title: 已缓释什么，仍未知什么
        blocks:
          - type: paragraph
            body: >-
              缓释信号也很清楚。Traveloka 有规模、主要合作伙伴、比狭义 OTA
              更宽的品类覆盖，以及流动性压力低于疫后初期的迹象。这些强项会降低风险，但不能消除风险。公开证据仍无法可靠揭示诉讼暴露，无法量化投诉解决率，也不能证明耐久自由现金流质量。最可能的下行情景是一场消耗战：支持痛点高企、竞争驱动利润率承压，变现改善只会渐进发生。尾部风险较少见但更严厉，包括
