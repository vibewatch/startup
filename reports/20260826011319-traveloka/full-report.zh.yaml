      - number: '1.3'
        title: 资本结构、业绩复苏与披露质量
        blocks:
          - type: paragraph
            body: >-
              Traveloka 疫后公司叙事最强的部分，落在融资与资产负债表修复的交叉点。追踪数据库指向 2024 年 1 月 $300 million 公司融资，以及 2022 年 7 月按 $3 billion
              估值标记的一轮融资；私募信贷故事也有独立价值，因为它显示的是资本纪律，而不只是募资能力。Private Equity Wire 报道称，Traveloka 在 2024 年初用内部现金提前偿还了 2022 年
              BlackRock 牵头信贷工具的已提取部分，说明流动性相较疫情低谷大幅改善。DealStreetAsia 在 2024 年的标题称 Traveloka 于 2023
              年转为盈利，进一步强化这一读法；Parsers VC 新闻流则保留了 2023 年一则报道，称 2022 年收入为 US$225.9 million，亏损下降
              29%。但私营公司披露质量仍不均衡。融资数据库对累计融资额分歧很大，当前估值已经陈旧，当前收入、员工数和活跃客户披露也不够干净，不能当作事实底稿。Traveloka 因此比一个简单的「仍在复苏的
              OTA」故事更强，但又弱于已经具备公开市场级透明度的公司。
