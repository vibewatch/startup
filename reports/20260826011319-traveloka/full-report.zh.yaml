              最强的采用证明在漏斗顶端。Atlas 和 JETRO 给出大型下载量与 MAU 锚点，Traveloka
              自身预订数据和营销活动发布则显示有意义的参与强度。合作伙伴侧证据比一家私营消费平台通常预期更强：Marriott、STB、Resorts World Sentosa、HBX 和 Amadeus 都公开把
              Traveloka 定位为重要渠道。PwC 2023 年研究又增加了一层更宽的供应商证明，许多参与企业报告与平台合作后销售额明显提升。这本身不能证明长期队列质量，但能证明 Traveloka
              对消费者和商户都有商业意义。Traveloka 已经清楚证明规模和合作伙伴相关性，但公开来源仍让客户留存、集中度和预订后信任质量悬而未决。关键在于 Traveloka
              是私营、跨品类且依赖合作伙伴执行，公开证据只能作方向性解读，而非定论。投资者可以把开源记录视为足以形成工作假设，但不足以取消对经济性、队列、合规和下行情景传导的尽调要求。
