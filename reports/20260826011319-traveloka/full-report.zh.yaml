        - label: 基准
          low: 2600
          high: 3200
          note: 复苏延续，并给出适度折价。
        - label: 乐观
          low: 3600
          high: 4800
          note: 盈利可持续性和期权价值兑现。
    claimRefs:
      - CV014
      - CV015
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 战略相关性支撑通过，但缺少审计和信任担忧会限制确信度。
    data:
      items:
        - label: 市场存在感
          value: 4
