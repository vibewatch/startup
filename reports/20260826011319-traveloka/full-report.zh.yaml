        - label: 证据深度
          value: 3
          note: 规模公开；审计不公开
        - label: 护城河
          value: 3
          note: 整合和支付有帮助
        - label: 经济性
          value: 3
          note: 已有披露，但审计支撑薄
        - label: 风险
          value: 2
          note: 信任 / 监管仍然关键
        - label: 估值支撑
          value: 3
          note: 最新估值标记看起来合理
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
