      - number: '1.4'
        title: 里程碑、合作驱动扩张与反向信号
        blocks:
          - type: paragraph
            body: >-
              Traveloka 的里程碑记录显示，公司正在从印尼创业公司走向生态编排者。2017-2018 年融资潮、后来的 PayLater 融资结构、2023 年盈利拐点，以及 2024
              年提前还债，都是有意义的转折点。日本在 2024 年开设办公室、2025 年上线服务也重要，因为它说明 Traveloka
              仍在增加地理市场，而不只是加深传统东南亚市场。同样关键的是，当前复苏故事高度依赖合作：Traveloka 现在借助目的地机构、酒店集团、旅游技术供应商和 B2B API
              扩大触达。这在战略上是正面的，但不能抹掉质量与信任担忧。Trustpilot、Reviews.io 和 Mediakonsumen 反复显示客户对价格变化、退款处理和人工客服升级受限的不满。反向信号不否定
              Traveloka 的规模，但会压缩模型的容错空间，因为平台需要在消费者和第三方旅游供应商之间居中撮合。后续章节因此应把合作伙伴杠杆和客户信任视为同一道运营方程的两面。
