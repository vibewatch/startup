            body: >-
              框定 Traveloka
              的正确方式，是拿它对照上市旅游平台同行——Booking、Airbnb、Trip.com、MakeMyTrip——同时承认没有一个公开可比公司与它完全匹配。相较最佳公开可比公司，Traveloka
              更小、透明度更低、地理集中度更高，也更暴露于新兴市场经营波动。这些事实支持折价。抵消折价的是，Traveloka 拥有有意义的平台广度、强区域认知、本地支付深度、合作伙伴 API，以及经典 OTA
              佣金之外的一些变现选择权。据报道 2023 年盈利和 2024 年债务清理有助于投资案例，但作用有限，因为两者都无法按上市公司深度公开审计。Traveloka
