      - number: '6.3'
        title: 信任、留存与集中度限制
        blocks:
          - type: paragraph
            body: >-
              Traveloka
              客户章节的弱点不在规模，而在留存证据质量和预订后信任。公开点评界面反复提到退款摩擦、误导性定价、难以触达人工客服，以及第三方供应商失约时平台问责不足。应用商店评分显示产品仍能取悦相当一部分用户，双位数日期预订模式也暗示习惯正在形成，但没有公开队列留存数据集能解决耐久性问题。也没有干净的公开拆分能按分部、地域或合作伙伴说明收入或预订量，因此集中度风险大多仍被遮住。Traveloka
              因此有大量客户证明，但不足以打消信任泄漏或合作伙伴依赖担忧。Traveloka 已经清楚证明规模和合作伙伴相关性，但公开来源仍让客户留存、集中度和预订后信任质量悬而未决。关键在于 Traveloka
              是私营、跨品类且依赖合作伙伴执行，公开证据只能作方向性解读，而非定论。投资者可以把开源记录视为足以形成工作假设，但不足以取消对经济性、队列、合规和下行情景传导的尽调要求。因此，复用质量更多来自推断，而非直接披露。
