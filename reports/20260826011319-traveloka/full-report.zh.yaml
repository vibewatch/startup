  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接与相邻竞争者组合
        blocks:
          - type: paragraph
            body: >-
              Traveloka 的直接竞争者很宽，但并不对称。Booking.com 和 Agoda 设定全球住宿基准，Trip.com 是最强的亚洲本土公开全栈对手，MakeMyTrip
              则是有用的新兴市场旅游平台类比。Airbnb 在住宿和旅行灵感上形成部分替代，Klook 在景点和体验上构成专门威胁。Tripadvisor
              更早介入漏斗，作为攻略和点评界面重要，而不是完整预订栈的对应物。正确结论不是 Traveloka 有一个完美对标对象，而是它面对分层竞争格局，不同对手攻击客户旅程的不同模块。Traveloka
              处在拥挤的旅游栈里，没有单一对手完全复刻它的所有模块，但多个资本更雄厚的同行都能挑战它最强的品类；它真正的优势是本地广度和支付适配，而不是无可匹敌的全球规模。关键在于 Traveloka
              是私营、跨品类且依赖合作伙伴执行，公开证据只能作方向性解读，而非定论。投资者可以把开源记录视为足以形成工作假设，但不足以取消对经济性、队列、合规和下行情景传导的尽调要求。Traveloka
              处在拥挤的旅游栈里，没有单一对手完全复刻它的所有模块，但多个资本更雄厚的同行都能挑战它最强的品类；它真正的优势是本地广度和支付适配，而不是无可匹敌的全球规模。关键在于 Traveloka
