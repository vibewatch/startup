      - number: '3.2'
        title: Traveloka 更宽在哪里，不宽在哪里
        blocks:
          - type: paragraph
            body: >-
              Traveloka 最清楚的商业优势，是在东南亚语境下的宽度。官方界面覆盖机票、住宿、地面交通、景点、邮轮、本地服务、融资和合作伙伴 API。相较 Klook 以体验为先、Airbnb
              以住宿为核心的价值主张，它都更宽。若看整体栈宽度，它更接近 Trip.com 和 MakeMyTrip，只是这些公开同行的财务透明度更强。主要限制在于，Traveloka
              的部分宽度会带来运营负担：一个拥有许多第三方供应商、支付方式和本地服务的 marketplace，支持复杂度可能高于更窄的品类专家。Traveloka
              处在拥挤的旅游栈里，没有单一对手完全复刻它的所有模块，但多个资本更雄厚的同行都能挑战它最强的品类；它真正的优势是本地广度和支付适配，而不是无可匹敌的全球规模。关键在于 Traveloka
              是私营、跨品类且依赖合作伙伴执行，公开证据只能作方向性解读，而非定论。投资者可以把开源记录视为足以形成工作假设，但不足以取消对经济性、队列、合规和下行情景传导的尽调要求。
