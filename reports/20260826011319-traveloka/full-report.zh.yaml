      - CU018
    approximationNotes: 这些值是根据公开习惯和情绪信号推导的方向性占位，并非公司披露的队列。
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 供应商侧失误会经由 Traveloka 平台传导，最终变成客户信任风险。
    data:
      columns:
        - 高概率
        - 较低概率
      rows:
        - label: 高影响
          values:
            - 信任 / 支持风险
            - 监管或数据事件
        - label: 较低影响
          values:
            - 促销带来的利润率下滑
            - 本地化扩张失手
    claimRefs:
      - CR002
      - CR009
      - CR010
      - CR015
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: Traveloka 仍暴露在宏观旅游周期中，同时在最强市场之外扩张，也承担增量风险。
    data:
      nodes:
        - id: competition
          label: 竞争
          detail: 全球和区域 OTA 压低价格，也压缩抽成率。
        - id: support
          label: 客服失灵
          detail: 退款和预订后痛点伤害信任。
        - id: regulation
          label: 金融科技监管
          detail: BNPL 监管可能约束变现。
        - id: margin
          label: 利润率压力
          detail: 抽成率下降或服务成本上升。
        - id: valuation
          label: 估值折价
          detail: 信心下降，折价拉大。
        - id: growth
          label: 增长放缓
          detail: 复购需求和转化走弱。
      edges:
        - from: competition
          to: margin
          label: 压缩
        - from: support
          to: growth
          label: 降低
        - from: regulation
          to: margin
          label: 增加成本
        - from: growth
          to: valuation
          label: 削弱
        - from: margin
          to: valuation
          label: 拉大折价
    claimRefs:
      - CR005
      - CR006
      - CR009
      - CR028
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: 当旅游交易与融资、用户数据交织时，Traveloka 的风险面会明显扩大。
    data:
      nodes:
        - id: travel
          label: 旅游交易
          detail: 预订和市场平台运营。
        - id: payments
          label: 支付 / BNPL
          detail: 结账和融资。
        - id: data
          label: 用户数据
          detail: 位置、标识符和使用数据。
        - id: regulator
          label: 监管机构
          detail: OJK 和消费者保护机构。
        - id: customer
          label: 客户
          detail: 投诉、还款、共享数据。
      edges:
        - from: customer
          to: travel
          label: 预订
        - from: customer
          to: payments
          label: 还款与融资
        - from: customer
          to: data
          label: 数据生成
        - from: regulator
          to: payments
          label: 融资规则
        - from: regulator
          to: data
          label: 隐私审查
    claimRefs:
      - CR003
      - CR004
      - CR011
      - CR016
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 鉴于规模和据报道的盈利能力改善，Traveloka 相比头部上市旅游平台可能应有折价，但不该落到困境估值倍数。
    data:
      nodes:
        - id: scale
          label: 规模和市场存在感
          detail: 区域用户基数大，产品宽度足。
        - id: economics
          label: 经济性改善
          detail: 据报道已盈利，债务清理推进。
        - id: opacity
          label: 不透明与信任折价
          detail: 审计 / 队列数据缺失；投诉仍在。
        - id: result
          label: 谨慎通过
          detail: 观点偏正面，但带条件。
      edges:
        - from: scale
          to: economics
          label: 支撑
        - from: economics
          to: opacity
          label: 被抵消
        - from: opacity
          to: result
          label: 决定立场
    claimRefs:
      - CV007
      - CV008
      - CV013
      - CV016
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Traveloka 的价值由市场地位和可选业务价值驱动，但不透明和信任风险会向下拉。
    data:
      items:
        - label: 可持续盈利
          value: 5
        - label: 留存 / 复购需求
          value: 4
        - label: 客户信任拖累
          value: -3
        - label: 宏观旅游周期性
          value: -2
        - label: B2B / 金融科技期权价值
          value: 2
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV020
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 估值最受盈利可持续性、信任质量和宏观旅游条件影响。
    data:
      items:
        - label: 悲观
          low: 1800
          high: 2400
