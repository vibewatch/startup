      - CE010
      - CE018
      - CE019
  - id: FE004
    title: 产品成熟度 / 能力地图
    type: matrix
    layout: standard
    summary: Traveloka 在消费者预订广度和合作伙伴分销上看起来最成熟，工程和安全细节披露更少。
    data:
      columns:
        - 高成熟度
        - 中等成熟度
        - 低透明度
      rows:
        - label: 能力
          values:
            - 机票 / 住宿 / 活动覆盖
