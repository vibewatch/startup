      - number: '1.2'
        title: 创始人、领导层可见度与治理不透明
        blocks:
          - type: paragraph
            body: >-
              创始人连续性是公司概况里最干净的事实之一。公开信息始终把 Traveloka 与 Ferry Unardi、Derianto Kusuma 和 Albert Zhang 关联在一起，Ferry
              仍是公开报道里最可见的高管面孔。留存来源也显示出一个更宽、但仍相对不透明的高管梯队：Caesar Indra 在 2023 年影响研究材料中以 President 身份出现，较早的 fintech 报道则引用
              Henry Hendrawan 对 Traveloka
              金融服务部门目标的表述。问题不是公开来源给出互相矛盾的创始人，而是它没有给出与公司规模相称的清晰治理界面。本次留存材料中，没有可靠且当前的公开董事会名单或委员会图谱；近期材料强调商业合作和目的地营销，多于内部治理。因此，管理层接触仍是尽调重负：领导层可信度看起来足够强，但创始人周边关键人依赖，以及公开董事会细节缺失，实质限制了仅靠公开来源能承保多少治理叙事。
