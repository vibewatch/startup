    title: 客户证据矩阵
    type: matrix
    layout: standard
    summary: Traveloka 的合作伙伴证据强，应用侧证据中等，公开留存证据弱。
    data:
      columns:
        - 强证据
        - 中等证据
        - 弱证据
      rows:
        - label: 消费者规模
          values:
