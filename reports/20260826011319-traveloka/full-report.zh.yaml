    layout: wide
    summary: Traveloka 的用户旅程横跨种草、预订、履约和预订后支持；付款之后，信任风险最集中。
    data:
      items:
        - label: 发现
          detail: 在应用内搜索、查看促销，探索目的地和体验项目。
        - label: 比较
          detail: 在一个应用里比较航班、住宿、景点和交通。
        - label: 预订并付款
          detail: 使用本地支付方式、先买后付（BNPL）和促销优惠。
        - label: 出行 / 体验
          detail: 第三方供应商交付服务。
        - label: 预订后支持
          detail: 退款、变更和问题处理决定信任。
