  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与方向性规模
        blocks:
          - type: paragraph
            body: >-
              Traveloka 的市场应定义为叠加体验、旅行相关金融服务和合作伙伴分发的消费者旅游平台，而不是仅做机票的
              OTA。更宽的定义重要，因为公司可能变现旅客钱包中更多环节，而不是只像点状预订网站一样收取单一场景价值；但这也让公开口径下的规模测算更不精确。留存第三方来源只提供区间式锚点。Research and
              Markets 估计印度尼西亚在线旅行和旅游平台市场约为 US$10 billion，PhocusWire 则描述印尼在线旅游未来达到 US$17 billion。Phocuswright 的东南亚旅游研究确认了
              2026 年前强劲的区域复苏背景，但这些来源都不能独立证明 Traveloka 自身市占率。因此，最稳妥的做法是把公开市场数据当作方向性背景，把 Traveloka
              官方披露的平台广度和用户规模当作公司占据大型可变现界面的证据，而不是假装公开来源能为投资测算拼出干净的 TAM / SAM / SOM 栈。Traveloka
              的市场机会无疑很大且仍在增长，但公开来源只能方向性缩小可触达池；真正的估值问题，是市场增长能否转成耐久、盈利的重复预订。关键在于 Traveloka
              是私营、跨品类且依赖合作伙伴执行，公开证据只能作方向性解读，而非定论。投资者可以把开源记录视为足以形成工作假设，但不足以取消对经济性、队列、合规和下行情景传导的尽调要求。
