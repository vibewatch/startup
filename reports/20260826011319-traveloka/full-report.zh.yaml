      - number: '2.3'
        title: 增长驱动、约束与估值关键点
        blocks:
          - type: paragraph
            body: >-
              Traveloka
              背后的市场顺风很清楚：疫后旅游复苏、印尼数字旅游渗透率仍在提升、国内旅行韧性，以及更丰富的供应商合作带来更宽库存并改善转化。但约束对估值同样关键。旅游仍有周期性，供应商经济性可能挤压抽佣率，关于客户忠诚度、促销依赖和实际市占率的公开证据仍然薄弱。Booking
              Holdings 和 Agoda 在全球住宿供给上、Airbnb 在住宿上、Trip.com 在亚洲旅游规模上、Klook 在体验上带来竞争，这意味着 Traveloka
              的市场机会不能按受保护的本地垄断流量来估值。真正重要的不是东南亚旅游是否增长——留存来源强烈显示它会增长——而是增长能否转成有耐久供应商经济性的盈利复购。因此，市场分析支撑正面的需求投资逻辑，但单独不足以支撑溢价估值逻辑。
