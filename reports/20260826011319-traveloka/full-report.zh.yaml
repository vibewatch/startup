      - number: '7.2'
        title: 监管、财务与竞争暴露
        blocks:
          - type: paragraph
            body: >-
              Traveloka 的 fintech 相邻业务，把监管暴露放大到纯 OTA 之外。OJK 的 2025-2026 框架让融资控制更明确，隐私披露和应用商店数据标签也显示公司拥有可观的用户数据足迹。公司曾提取大型
              2022 年信贷工具，并据报道在 2024 年初提前偿还其中大部分或全部，因此流动性风险很可能已经改善；但同一事件也凸显了旅游需求的周期脆弱性。竞争仍然无休止。全球
              OTA、本地专家和供应商直连渠道都会压迫抽佣率、营销成本和用户忠诚度，这意味着 Traveloka 不能只靠已安装规模。Traveloka 最大的公开风险是客户信任泄漏、fintech
