  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最重要的风险是信任、监管和不透明
        blocks:
          - type: paragraph
            body: >-
              Traveloka 的公开风险画像不是由一个生死攸关的缺陷主导，而是由一组结构性风险主导；这些风险之所以重要，是因为公司是一家私营双边旅游
              marketplace，并带有融资相邻业务。最直接的风险，是退款、价格清晰度和预订后支持上的客户信任泄漏。最有后果的中期风险，是监管复杂度，尤其是支付和 BNPL
              与消费者旅游交易交叉之处。最持久的投资者风险，是披露不透明：没有上市公司报告，就很难证明盈利耐久性、利润率质量或现金生成。Traveloka 最大的公开风险是客户信任泄漏、fintech
              监管和私营公司不透明，而不是即时偿付能力担忧。关键在于 Traveloka
              是私营、跨品类且依赖合作伙伴执行，公开证据只能作方向性解读，而非定论。投资者可以把开源记录视为足以形成工作假设，但不足以取消对经济性、队列、合规和下行情景传导的尽调要求。Traveloka
