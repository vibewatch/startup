chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台范围与地理版图
        blocks:
          - type: paragraph
            body: >-
              Traveloka 留存的官方与合作伙伴界面，支持把公司视为不止一家狭义在线票务中介。存档 About 页面、面向合作伙伴的 Atlas API 站点、应用商店列表，以及 JETRO
              的日本档案，都把它描述成一站式旅游平台，覆盖机票、住宿、地面交通、机场接送、景点、邮轮和相邻本地服务。公司还宣传支付、先买后付融资和保险产品等金融服务触点，因此当前身份更接近区域旅游与生活方式平台，而不是单一用途
              OTA。地理范围也比许多旧公司画像更宽。JETRO 和 Traveloka
              自有页面支持其在印度尼西亚、日本、马来西亚、菲律宾、新加坡、泰国、越南和澳大利亚运营。官方规模披露很大，但不同界面并不完全同步：Atlas 称下载量 138M+、月活用户 50M+，JETRO 则称下载量
              140M+、MAU 40M+。审慎读法不是判定某一来源一定错误，而是 Traveloka 的公开传播会在不同界面用不同方式取整指标，更新节奏也不同。清楚的是，Traveloka
              已有区域规模、产品广度，以及围绕第三方供应商而非自有旅行供给搭起来的 marketplace 模型。
