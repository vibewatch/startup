  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 市场似乎在说什么
        blocks:
          - type: paragraph
            body: >-
              Traveloka 当前估值图景不精确，但并非空白。多个公开市场参考页面聚集在约 $2.8B-$3.0B 的后周期标记附近，其中最可信的锚点来自 2024 年 1
              月战略融资，以及公司即使经历严酷疫情重置后仍能吸引成熟机构投资方的能力。这不意味着当前公允价值就精确等于该数字；它意味着市场似乎把 Traveloka
              视为真实的数十亿美元级战略资产，而不是困境复苏故事。Traveloka 看起来配得上数十亿美元级私营估值和有保留通过建议，但公开披露偏薄、信任 / 监管风险仍在，置信度因此受限。关键在于 Traveloka
              是私营、跨品类且依赖合作伙伴执行，公开证据只能作方向性解读，而非定论。投资者可以把开源记录视为足以形成工作假设，但不足以取消对经济性、队列、合规和下行情景传导的尽调要求。Traveloka
