companyProfile:
  summary: >-
    Traveloka 创立于 2012 年、以雅加达为中心。现有公开证据已经支撑一个比单纯 OTA 更宽的身份：规模化消费端 app、深度本地支付和先买后付相邻能力、供应商与 B2B API
    界面，以及横跨东南亚并延伸至日本的区域分发价值。核心尽调问题已经不是 Traveloka 是否具备战略真实性，而是当前盈利质量、复购需求韧性、监管暴露、股权结构或披露不透明度，能否支撑显著高于最近数十亿美元级私募标记的价格。
