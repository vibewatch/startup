      - number: '2.2'
        title: 买方地图与需求模式
        blocks:
          - type: paragraph
            body: >-
              Traveloka 的买方地图是混合型。需求端，个人消费者用 app 预订国内航班、酒店、景点、区域短途游，以及越来越多由体验或家庭场景驱动的旅行。供给端，酒店集团、旅游局、邮轮伙伴和 API 分销商购买的是进入
              Traveloka 需求、数据和分发轨道的通道。STB、Marriott、UOB Disney Cruise、Resorts World Sentosa 和 B2B API
              等公告，把这件事公开地呈现出来。这些不是边缘 PR 点缀；它们说明 Traveloka 同时变现消费者注意力和合作伙伴分发需求。APAC
              趋势研究进一步显示，国内旅行仍然重要，原因是负担能力和感知安全性；Traveloka
              自有的双位数日期数据也暗示，部分预订行为即使不在大型促销期也已形成习惯。组合起来看，市场结构是一边有高消费者价格敏感度，另一边又有用户习惯、支付便利和供应商广度，为规模化中介留出空间。Traveloka
              的市场机会无疑很大且仍在增长，但公开来源只能方向性缩小可触达池；真正的估值问题，是市场增长能否转成耐久、盈利的重复预订。关键在于 Traveloka
              是私营、跨品类且依赖合作伙伴执行，公开证据只能作方向性解读，而非定论。投资者可以把开源记录视为足以形成工作假设，但不足以取消对经济性、队列、合规和下行情景传导的尽调要求。
