        - label: 区域本地化
          value: High
          detail: 支付、语言和目的地适配。
        - label: 产品广度
          value: High
          detail: 从机票、邮轮到金融服务。
        - label: 合作伙伴分销
          value: Medium-High
          detail: API 与 B2B 能力可见。
        - label: 全球资本规模
          value: Low vs peers
          detail: 私营公司对比上市 / 全球巨头。
        - label: 客户信任
          value: Mixed
          detail: 负面评价面仍是实质风险。
        - label: 公开披露质量
          value: Low
          detail: 私营公司的不透明削弱外部护城河验证。
    claimRefs:
      - CP020
      - CP021
      - CP022
      - CP023
      - CP024
  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: Traveloka 通过连接消费者流量、供应商库存、支付层和合作伙伴分销，将旅行需求变现。
    data:
      nodes:
        - id: traffic
          label: 消费者流量
          detail: 下载量、MAU、活动和复购需求。
        - id: inventory
          label: 旅游库存
          detail: 机票、住宿、景点、邮轮、交通。
        - id: checkout
          label: 结账与支付
          detail: 本地支付方式、PayLater、保险。
        - id: partner
          label: 合作伙伴分销
          detail: API / B2B / 供应商渠道。
        - id: revenue
          label: 净收入
          detail: 佣金、费用、融资、活动。
      edges:
        - from: traffic
          to: inventory
          label: 搜索与选择
        - from: inventory
          to: checkout
          label: 预订流程
        - from: checkout
          to: revenue
          label: 交易与附加变现
        - from: partner
          to: revenue
          label: 分销变现
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI018
  - id: FI002
    title: 单位经济性桥
    type: flow
    layout: standard
    summary: Traveloka 公开的单位经济性图景，投入端可见，但贡献利润率不透明。
    data:
      nodes:
        - id: users
          label: 用户与会话
          detail: 漏斗顶部规模大。
        - id: conversion
          label: 预订转化
          detail: 由库存、定价和支付驱动。
        - id: basket
          label: 客单价
          detail: 旅游品类和融资产品可以抬高 AOV。
        - id: support
          label: 服务成本
          detail: 退款和支持质量都关键。
        - id: margin
          label: 贡献利润率
          detail: 未公开披露。
      edges:
        - from: users
          to: conversion
          label: 流量变现
        - from: conversion
          to: basket
          label: 交叉销售与附加
        - from: basket
          to: support
          label: 服务与故障处理
        - from: support
          to: margin
          label: 服务成本未知
    claimRefs:
      - CI014
      - CI015
      - CI016
      - CI017
      - CI038
  - id: FI003
    title: 财务估算区间
    type: range
    layout: wide
    summary: 公开来源只能支持当前财务规模的大致区间。
    data:
      items:
        - label: 公开收入锚点（USD M）
          low: 226
          mid: 300
          high: 450
          detail: 2022 披露快照对比可能但未验证的复苏路径
        - label: 累计融资额（USD M）
          low: 1020
          mid: 1665
          high: 2310
          detail: Tracxn 下限对比 TravelTradeToday 上限
        - label: 私有估值锚点（USD M）
          low: 2500
          mid: 2900
          high: 3000
          detail: 老股 / 追踪指标对比上次披露的 2022 年估值
    approximationNotes: 中点是用于展示不确定性的分析占位符。留存来源只直接给出 2022 年收入点和融资 / 估值锚点。
    claimRefs:
      - CI006
      - CI011
      - CI012
      - CI017
  - id: FI004
    title: 资本强度 / 现金流地图
    type: matrix
    layout: standard
    summary: 资产负债表风险已有改善，但开源信息对资本充足性的可见度仍弱。
    data:
      columns:
        - 公开信息支持
        - 模糊
        - 缺失 / 有风险
      rows:
        - label: 资本结构
          values:
            - 2024 年提前偿还
            - 2024 年新轮次追踪
            - 债务条款未公开
        - label: 盈利能力
          values:
            - 2023 年盈利标题
            - 2022 年收入反弹
            - 当前利润率未公开
        - label: 融资产品
          values:
            - 现有 PayLater 轨道
            - 监管清晰度上升
            - 违约 / 损失率缺失
    claimRefs:
      - CI008
      - CI013
      - CI020
      - CI021
  - id: FE001
    title: 产品架构地图
    type: stack
    layout: wide
    summary: Traveloka 的堆栈从消费者需求捕获，延伸到供应商连接和融资轨道。
    data:
      layers:
        - label: 需求层
          detail: 移动 App；促销；Priority 忠诚计划；目的地活动
        - label: 交易层
          detail: 搜索与预订；支付；BNPL；保险
        - label: 供给层
          detail: 机票；住宿；地面交通；景点；邮轮
        - label: 连接层
          detail: Atlas API；Connect API；Partner Network API；B2B 平台
        - label: 控制层
          detail: 隐私政策；条款；支持 / IVAN；OJK BNPL 合规背景
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE010
      - CE018
  - id: FE002
    title: 客户流程 / 运营流程
    type: flow
    layout: wide
    summary: Traveloka 同时支持直接旅客预订流程和合作伙伴分销流程。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: App / 店面或合作伙伴获客。
        - id: compare
          label: 比较
          detail: 库存、价格和房型数据。
        - id: pay
          label: 支付
          detail: 本地支付方式和融资选项。
        - id: fulfill
          label: 履约
          detail: 供应商交付服务。
        - id: post
          label: 预订后
          detail: 支持、退款、变更、忠诚计划。
        - id: partner
          label: 合作伙伴 API 闭环
          detail: 酒店 / 分销商推送内容、价格和预订。
      edges:
        - from: discover
          to: compare
          label: 搜索与个性化
        - from: compare
          to: pay
          label: 选择与结账
        - from: pay
          to: fulfill
          label: 票务 / 预订签发
        - from: fulfill
          to: post
          label: 支持、变更、忠诚计划
        - from: partner
          to: compare
          label: 库存与内容同步
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE011
      - CE023
  - id: FE003
    title: 关键依赖地图
    type: dag
    layout: standard
    summary: Traveloka 的产品质量取决于供应商、合作伙伴、支付和监管依赖。
    data:
      nodes:
        - id: suppliers
          label: 旅游供应商
          detail: 酒店、航司、景点、交通。
        - id: apis
          label: 合作伙伴 API
          detail: Atlas / Connect / Partner Network。
        - id: payments
          label: 银行与金融合作伙伴
          detail: 本地支付方式，Danamas / Caturnusa 背景。
        - id: regulators
          label: OJK 与旅游机构
          detail: BNPL 与可持续旅游框架。
        - id: users
          label: 用户
          detail: 移动 App 旅客和合作伙伴分销买家。
      edges:
        - from: suppliers
          to: apis
          label: 库存与价格
        - from: apis
          to: users
          label: 可用性与预订支持
        - from: payments
          to: users
          label: 结账与融资
        - from: regulators
          to: payments
          label: 许可与合规
        - from: suppliers
          to: users
          label: 服务交付
