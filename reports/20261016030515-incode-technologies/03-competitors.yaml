      - ["Automation model", "Publicly positioned as fully automated / zero-human-loop", "Mixed; at least some peers explicitly offer manual review or hybrid workflows", "Service-led verification and L1 review are part of the pitch", "High human effort and exception handling by default"]
      - ["Data-custody posture", "Company says some deployments can keep sensitive data on device, but critics still frame the model as centralized biometric custody", "Often described as centralized vendor cloud or traditional hosted stack", "Customer-held key plus fragmented storage is core differentiation", "Customer can retain custody, but must own controls and operating burden"]
      - ["Regulated-enterprise distribution", "Strong public bank, government, and telco orientation with FedRAMP progress", "Incumbent peers also target regulated buyers, but equivalent proof is thinner in assigned pool", "Relevant mainly where privacy requirements dominate", "Depends on buyer's own compliance team and vendor stack"]
      - ["Implementation and support", "Review evidence says rollout can be smooth and support strong once engaged", "Assigned pool does not provide equivalent implementation detail across peers", "Migration story is part of sales pitch", "Customization is flexible but slower and operationally heavier"]
      - ["Commercial transparency", "No public pricing; reviewers describe cost as high for small teams", "No normalized public price comparison retained in assigned pool", "Usage-based with no minimum is claimed", "Internal cost hides in staff, review queues, and engineering time"]
    notes: >-
      Cells marked as thin or unknown remain intentionally non-comparable where the assigned pool lacks neutral evidence; this table is about decision criteria, not unsupported product rankings.
    claimRefs: [CP001, CP007, CP008, CP011, CP012, CP013, CP015, CP016]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Option
      - Public pricing signal
      - Packaging / contract model
      - Included capability signal
      - Implication
    rows:
      - ["Incode", "Not publicly available", "Source says pricing is tied to performance outcomes and typically requires long-term 3-year agreements", "Broad automated IDV stack with biometrics, liveness, document analysis, and deepfake detection", "Fits large-account procurement better than self-serve or SMB-led motions"]
      - ["Reviewer view of Incode", "Perceived as expensive", "No public transaction schedule", "Support and automation can justify spend for some enterprises", "Price can become a disqualifier for smaller teams even when capability fit is strong"]
      - ["Zyphe", "Usage-based with no minimum", "Migration playbook and service-led verification/L1 review are part of the offer", "Privacy-first verification with reusable credentials and fragmented storage", "Alternative sales motion competes on architecture and switching ease rather than raw biometric scale"]
      - ["Onfido / Entrust class", "Unknown in assigned public evidence", "Manual-review flexibility emphasized more than a disclosed list price", "Hybrid review option is the visible packaging signal", "Useful substitute when exception handling matters more than maximum automation"]
      - ["Jumio / Sumsub / IDVerse class", "Unknown in assigned public evidence", "Enterprise contracting implied; no normalized public schedule retained here", "Broad KYC or document/biometric coverage", "Buyer still needs vendor-specific quotes and scope mapping to compare TCO"]
      - ["Internal / manual build", "No license fee benchmark in assigned pool", "Costs sit in headcount, tooling, and process ownership", "Can preserve control and manual overrides", "Economic comparison depends on review labor, fraud losses, and engineering cost rather than vendor list price"]
    notes: >-
      The assigned pool does not provide apples-to-apples per-check pricing across vendors, so this table compares disclosed commercial posture and packaging signals rather than claiming normalized cost leadership.
    claimRefs: [CP001, CP008, CP012, CP013]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Ordinal map of the main substitute classes surfaced in the assigned public evidence.
    data:
      xAxis:
        label: "Automation / platform breadth (ordinal)"
        min: 1
        max: 5
        low: "manual or narrow point solution"
        high: "fully automated, broad IDV stack"
        description: "Estimated from retained product descriptions, buyer reviews, and vendor/comparison pages."
        scale: ordinal
      yAxis:
        label: "Customer control over data / review path (ordinal)"
        min: 1
        max: 5
        low: "vendor-managed and centralized"
        high: "customer-held, fragmented, or manual-control-heavy"
        description: "Estimated from retained sources; not an audited benchmark."
        scale: ordinal
      points:
        - label: Incode
          x: 5
          y: 2
          note: "High on automation breadth from integrated biometrics/orchestration; lower on customer control because critics still frame the model as centralized custody."
        - label: Jumio / direct incumbent suites
          x: 4
          y: 1
          note: "Direct biometric/document incumbents appear in Gartner, Zyphe, and Growth Engineer evidence, but the assigned pool does not support stronger differentiation than incumbent centralized-suite status."
        - label: Onfido / Entrust hybrid workflow suites
          x: 3
          y: 3
          note: "Less automated than Incode because optional manual review is explicit; more customer-control-friendly for edge cases."
        - label: Sumsub-style broad compliance suites
          x: 3
          y: 1
          note: "Broad KYC/KYB/AML coverage is the appeal, but Zyphe still classifies the model as centralized vendor cloud."
        - label: Zyphe / privacy-first challenger
          x: 2
          y: 5
          note: "Competes on fragmented storage, customer-held keys, and reusable credentials rather than maximum centralized automation."
        - label: Internal / manual review status quo
          x: 1
          y: 5
          note: "Lowest platform breadth but highest direct control over exception handling, deletion obligations, and review policy."
    approximationNotes: >-
      Scores are ordinal estimates synthesized from retained qualitative evidence; they indicate positioning logic, not benchmarked product performance.
    claimRefs: [CP006, CP007, CP011, CP012, CP014, CP015, CP016]
callouts:
  - calloutType: insight
    title: Competitive set is bifurcating, not converging
    body: Incode's hardest competition is split between enterprise automation suites and privacy-first or manual-review substitutes, so feature parity alone will not decide most bids.
    claimRefs: [CP004, CP006, CP012, CP014]
  - calloutType: risk
    title: Public comparisons understate procurement friction
    body: The assigned pool supports a strong automation story, but it does not provide neutral price parity or shared false-positive benchmarks, so buyers still need live-traffic bakeoffs before underwriting moat or margin durability.
    claimRefs: [CP008, CP013, CP014]
