      - ["Sumsub", "Direct compliance suite", "Public scale signal not retained here", "Broad KYC, KYB, and AML platform buyers", "Broad product surface in one platform", "Zyphe classifies it as centralized vendor cloud; price parity not retained"]
      - ["Onfido / Entrust", "Direct incumbent / hybrid workflow suite", "Backed by larger security parent; no current commercial metrics retained here", "Enterprises already inside Entrust or needing flexible identity workflows", "Optional human review and larger security ecosystem", "Post-acquisition roadmap and public price parity not established in assigned pool"]
      - ["IDVerse / LexisNexis", "Incumbent document-authentication and biometrics suite", "Distributed via LexisNexis Risk Solutions; no fresh funding or pricing retained", "Regulated onboarding and document-authentication buyers", "Large parent distribution plus biometric verification", "Assigned pool does not show workflow or price detail comparable with Incode"]
      - ["Zyphe", "Adjacent privacy-first challenger", "Private; no public funding detail retained in assigned pool", "Regulated teams prioritizing data minimization and reusable credentials", "Customer-held keys, fragmented storage, reusable credentials", "Vendor-authored adverse comparison rather than independent benchmark"]
    notes: >-
      Unknown or absent fields indicate the assigned public evidence pool did not disclose the item; rows intentionally mix direct rivals and structurally different substitutes because the buyer's real short list spans both.
