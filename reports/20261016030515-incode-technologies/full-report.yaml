      - number: '3.2'
        title: Capability, pricing, and workflow trade-offs
        blocks:
          - type: paragraph
            body: >-
              Incode's strongest differentiation case is breadth plus automation. Official and third-party profiles
              describe a stack that combines facial recognition, liveness detection, document analysis, deepfake
              detection, and orchestration, with recent acquisitions used to widen the platform. That positioning
              compares best against centralized enterprise suites where buyers value speed, regulatory coverage, and one
              vendor relationship. The same evidence also shows where competitive pressure enters: reviewers describe
              pricing as high for smaller deployments, setup as potentially steep for beginners, and several
              alternatives explicitly pitch optional manual review, flexible workflows, or service-led operations
              instead of a zero-human-loop default.
            claimRefs:
              - CP001
              - CP003
