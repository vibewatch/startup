      - number: '5.3'
        title: Differentiation, trust controls, and unresolved technical risks
        blocks:
          - type: paragraph
            body: >-
              Incode's differentiation story is coherent but only partly substantiated in public. The favorable case is
              clear: full-stack ownership, more than 35 in-house detection models, production-scale verification volume,
              current government-facing releases, and external comparisons that position the company around automation
              and deepfake defense rather than manual-review flexibility. The more important diligence issue is what
              remains opaque. AI FinTech Index explicitly notes that public materials do not describe a manual review
              queue or customer-set override thresholds, and it also flags that biometric identifiers may train models
              where law and consent allow. Add a public cloud footprint with no disclosed region, access-controlled
              trust artifacts, and a competitor critique of centralized biometric custody, and the product looks
              technically ambitious but still dependent on closed-room diligence for governance, data-boundary, and
              deployment-risk questions.
