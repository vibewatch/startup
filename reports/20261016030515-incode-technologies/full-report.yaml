      - Assessment
      - Evidence
      - Decision implication
    rows:
      - - Recommendation
        - Track
        - Real category proof exists, but public evidence still does not verify the current price or terms.
        - Keep the company live in pipeline, but do not underwrite the rumored step-up yet.
      - - Confidence
        - Medium
        - The 2021 closed round is documented, while the 2025 process is reported but not confirmed closed.
        - Use the chapter for monitoring and diligence framing, not conviction sizing.
      - - Risk rating
        - Medium-high
        - >-
          Commercial transparency, economics disclosure, and governance/appeal mechanics remain incomplete in public
          sources.
        - Require term-sheet, cohort, and concentration diligence before moving forward.
      - - Valuation stance
        - Stretched
        - >-
          The reported up-to-$3B ask is materially above the last disclosed $1.25B benchmark without matching public
          disclosure depth.
        - Only revisit positively if economics and structure justify the premium.
    notes: >-
      Public-source-only recommendation summary; no audited financial package or term sheet is available in the assigned
      evidence pool.
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV011
      - CV013
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - What would change the view
    rows:
      - - 'Thesis: enterprise proof'
        - >-
          Independent and company-controlled sources both position Incode as a regulated-enterprise identity platform
          with meaningful scale signals.
        - >-
          Downgrade if customer concentration, churn, or false-positive economics are weaker than the product story
          implies.
      - - 'Thesis: scope expansion'
        - >-
          AuthenticID, agentic-identity positioning, and government-biometrics emphasis can widen use cases and
          strategic scarcity.
        - Upgrade only if newer modules convert into visible revenue quality rather than just narrative breadth.
      - - 'Anti-thesis: price support gap'
        - >-
          The latest price signal is a reported process seeking up to $3B, not a publicly documented close with clean
          terms.
        - Improve only after the lead investor, valuation, and preference stack are verified.
      - - 'Anti-thesis: commercial-transparency gap'
        - Independent sources say pricing is unpublished or unverified and still routed through enterprise sales.
        - Improve only after pricing architecture, contract length, and payback data are consistently disclosed.
    notes: >-
      Arguments summarize what the retained sources do and do not support; they are not substitutes for primary
      diligence on contracts or cap-table terms.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV009
      - CV010
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          The 2025 round closes near the reported top end, ARR scale is clean, and acquisitions lift cross-sell and
          government wins.
        - >-
          Only underwrite near the reported up-to-$3B ask if diligence validates premium software-like economics and
          clean terms.
        - Integration complexity, long public-sector cycles, and faster deepfake competition.
        - Lead investor, closing announcement, cohort data, and margin evidence all line up.
      - - Base
        - >-
          The business keeps compounding, but public evidence remains mostly company-controlled and economics disclosure
          stays incomplete.
        - >-
          Prefer entry between the last disclosed $1.25B mark and the rumored $3B ask until growth quality and structure
          are verified.
        - Round may clear below the headline or with investor-protective preferences.
        - Economic diligence is mixed, but product traction remains intact.
      - - Bear
        - The raise slips, reprices, or carries heavy preferences while transparency gaps persist.
        - >-
          Support falls back toward or below the last disclosed $1.25B benchmark because the public record would not
          justify the premium.
        - Opaque pricing power, unclear retention, and governance surprise risk.
        - No close confirmation, weaker growth signals, or adverse regulatory/customer evidence emerges.
    notes: >-
      Scenario logic is ordinal and benchmark-based; the assigned pool does not contain a verified public-comps set or
      enough audited financial data for a precision model.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV007
      - CV012
      - CV013
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Official milestones show a steady arc from founding to repeated external recognition and acquisition-led
      expansion, with a late-stage financing question still open.
    data:
      items:
        - date: '2015-06-17'
          label: Founded in San Francisco
          detail: Ricardo Amper founded Incode in San Francisco.
          tone: positive
        - year: '2017'
          label: First biometric authentication launch
          detail: The company says it launched its first AI-powered biometric authentication solution.
          tone: positive
        - year: '2019'
          label: First-passive-liveness milestone
          detail: Incode says it became the first company to pass iBeta Level 1 certification for passive liveness.
          tone: positive
        - year: '2021'
          label: Unicorn status after Series B
          detail: The about page ties unicorn status and a $1.25B valuation to the Series B round.
          tone: positive
        - year: '2022'
          label: Level 2 testing and spoof-resistance improvements
          detail: >-
            Official history says Incode developed advanced 3D-mask detection, improved 2D-attack resistance, and passed
            iBeta Level 2 testing.
          tone: positive
        - year: '2024'
          label: MetaMap acquisition and Gartner recognition
          detail: >-
            Official history says Incode was named a Leader in the inaugural Gartner Magic Quadrant for Identity
            Verification and completed its first acquisition with MetaMap.
          tone: positive
        - year: '2025'
          label: AuthenticID acquisition and reported new financing process
          detail: >-
            Official history says Incode made a second acquisition with AuthenticID, while Biometric Update later
            reported a new round was being sought.
          tone: warning
        - year: '2026'
          label: Identiq acquisition, privacy commitment, and Prism recognition
          detail: >-
            Official materials describe a third acquisition with Identiq, a $100M privacy-infrastructure commitment, and
            Prism recognition tied to more than seven billion identity trust checks.
          tone: positive
    approximationNotes: null
    claimRefs:
      - CO003
      - CO009
      - CO011
      - CO013
  - id: FM001
    title: Evidence-constrained market lens from broad identity reach to core regulated buyer penetration
    type: pyramid
    summary: >-
      The layers combine heterogeneous scope, throughput, and penetration proxies rather than a single additive TAM
      stack.
    data:
      items:
        - label: Global document coverage
          value: 190+ countries
          note: Product-scope proxy for how broadly Incode can support onboarding
        - label: Digital ID and eID support
          value: 30+ schemes
          note: Public-sector and cross-border wallet compatibility lens
        - label: Identity graph
          value: 400M profiles
          note: Installed-base signal rather than annual demand
        - label: Platform throughput
          value: 7.1B+ trust checks
          note: Company-defined volume metric, not spend
        - label: U.S. bank penetration
          value: 8 of top 10
          note: High-compliance enterprise segment traction
        - label: U.S. telco penetration
          value: 8 of top 9
          note: Adjacent regulated-enterprise adoption outside core banking
    approximationNotes: >-
      The values are intentionally non-additive and non-comparable; the pyramid orders broad scope and installed-base
      signals above narrower enterprise penetration signals and should not be read as a conversion funnel or
      share-of-market model.
    claimRefs:
      - CM008
      - CM009
      - CM011
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Ordinal map of the main substitute classes surfaced in the assigned public evidence.
    data:
      xAxis:
        label: Automation / platform breadth (ordinal)
        min: 1
        max: 5
        low: manual or narrow point solution
        high: fully automated, broad IDV stack
        description: Estimated from retained product descriptions, buyer reviews, and vendor/comparison pages.
        scale: ordinal
      yAxis:
        label: Customer control over data / review path (ordinal)
        min: 1
        max: 5
        low: vendor-managed and centralized
        high: customer-held, fragmented, or manual-control-heavy
        description: Estimated from retained sources; not an audited benchmark.
        scale: ordinal
      points:
        - label: Incode
          x: 5
          'y': 2
          note: >-
            High on automation breadth from integrated biometrics/orchestration; lower on customer control because
            critics still frame the model as centralized custody.
        - label: Jumio / direct incumbent suites
          x: 4
          'y': 1
          note: >-
            Direct biometric/document incumbents appear in Gartner, Zyphe, and Growth Engineer evidence, but the
            assigned pool does not support stronger differentiation than incumbent centralized-suite status.
        - label: Onfido / Entrust hybrid workflow suites
          x: 3
          'y': 3
          note: >-
            Less automated than Incode because optional manual review is explicit; more customer-control-friendly for
            edge cases.
        - label: Sumsub-style broad compliance suites
          x: 3
          'y': 1
          note: Broad KYC/KYB/AML coverage is the appeal, but Zyphe still classifies the model as centralized vendor cloud.
        - label: Zyphe / privacy-first challenger
          x: 2
          'y': 5
          note: >-
            Competes on fragmented storage, customer-held keys, and reusable credentials rather than maximum centralized
            automation.
        - label: Internal / manual review status quo
          x: 1
          'y': 5
          note: >-
            Lowest platform breadth but highest direct control over exception handling, deletion obligations, and review
            policy.
    approximationNotes: >-
      Scores are ordinal estimates synthesized from retained qualitative evidence; they indicate positioning logic, not
      benchmarked product performance.
    claimRefs:
      - CP006
      - CP007
      - CP011
      - CP012
      - CP014
      - CP015
      - CP016
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence suggests a recurring enterprise revenue bridge from regulated verification demand to custom
      contracts, with capital needs increasing as Incode adds scale, products, and government reach.
    data:
      nodes:
        - id: demand
          label: Regulated identity demand
          detail: >-
            Banks, fintechs, telecoms, marketplaces, and government buyers use Incode for onboarding, authentication,
            and fraud prevention workflows.
        - id: activity
          label: Verification volume
          detail: >-
            Public company claims cite 4.1 billion verifications in 2024 and more than 7.1 billion trust checks by March
            2026.
        - id: contracts
          label: Custom enterprise contracts
          detail: >-
            Public pricing is not posted; independent profiles describe negotiated, performance-linked, multi-year
            agreements.
        - id: recurring
          label: Recurring platform revenue
          detail: >-
            Multiples labels the model as subscription, and Biometric Update reported $170 million ARR from unnamed
            Bloomberg sourcing.
        - id: service-costs
          label: Delivery economics
          detail: >-
            Automation and in-house models can reduce manual-review labor intensity, but public sources do not quantify
            gross margin or payback.
        - id: reinvestment
          label: Reinvestment and financing need
          detail: >-
            A reported 2025 fundraising process and a 2026 $100 million privacy-infrastructure commitment point to
            continued capital demand.
      edges:
        - from: demand
          to: activity
          label: drives
        - from: activity
          to: contracts
          label: converted through
        - from: contracts
          to: recurring
          label: monetized as
        - from: recurring
          to: service-costs
          label: constrained by
        - from: service-costs
          to: reinvestment
          label: informs
    approximationNotes: >-
      This flow is directional rather than quantitative because public sources disclose activity scale and financing
      signals, but not realized price, gross margin, or per-check revenue.
    claimRefs:
      - CI001
      - CI004
      - CI006
      - CI011
      - CI015
      - CI016
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a layered identity stack from capture and orchestration through models, registries, and
      assurance controls.
    data:
      layers:
        - label: Customer channels
          detail: Web, mobile, kiosk, and in-branch surfaces collect document, selfie, and device inputs.
          outputs:
            - label: Hosted link / Web SDK / mobile SDK flows
            - label: Omnichannel capture inputs
        - label: Integration surface
          detail: REST APIs and SDKs expose the product inside customer onboarding and authentication journeys.
          modules:
            - label: REST API
            - label: iOS / Android / web SDKs
        - label: Workflow and decisioning
          detail: Orchestration tools shape routing, analytics, case handling, and configurable verification flows.
          modules:
            - label: Workflow Builder
            - label: Decisioning & Results
            - label: Fraud Analytics / Case Management
        - label: Core verification models
          detail: In-house model layer covers face matching, passive liveness, deepfake detection, and document analysis.
          modules:
            - label: Face match
            - label: Passive liveness
            - label: Deepfake / document checks
        - label: External data and network intelligence
          detail: Government, bureau, and acquired-network connectors extend identity proofing beyond image-only checks.
          modules:
            - label: GovDataMatch / AAMVA
            - label: eKYC sources and MetaMap registries
            - label: Identiq privacy-preserving signals
        - label: Assurance and compliance
          detail: Recovery targets, trust-center certifications, and FedRAMP readiness wrap the stack for regulated buyers.
          outputs:
            - label: Trust-center controls
            - label: FedRAMP Ready path
    approximationNotes: This stack is a synthesized operating model from retained public sources, not a vendor-authored system blueprint.
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE007
      - CE014
      - CE015
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      The observable journey moves from enterprise qualification and integration to end-user verification and adjacent
      workflow expansion, while renewal and concentration remain hidden.
    data:
      items:
        - label: Qualify enterprise need
          detail: Regulated or fraud-exposed buyer identifies a KYC, authentication, age, or identity-proofing requirement.
          touchpoints:
            - Fraud, compliance, digital-product, and agency procurement teams
            - Banks, fintechs, telcos, marketplaces, agencies, and hospitality operators
        - label: Configure workflow
          detail: Buyer integrates through REST APIs, SDKs, connectors, or no-code and low-code workflow tools.
          touchpoints:
            - Web, mobile, kiosk, and in-branch surfaces
            - Document, biometric, liveness, and decision modules
        - label: Enroll end user
          detail: Applicant, citizen, guest, subscriber, or marketplace participant completes the selected identity flow.
          touchpoints:
            - Document and selfie capture
            - On-device age estimation for privacy-sensitive checks
        - label: Produce identity decision
          detail: Automated checks return onboarding, authentication, or payment-verification results.
          touchpoints:
            - Company-reported approximately four-second average KYC check
            - No public distribution or customer-level denominator
        - label: Expand use cases
          detail: Customer can add channels, modules, geographies, or adjacent re-authentication and fraud workflows.
          touchpoints:
            - Public-sector and government biometrics opportunity
            - Reusable workflow tooling and multi-channel SDK coverage
        - label: Test durability
          detail: >-
            Renewal, expansion revenue, and account concentration determine whether deployment breadth becomes durable
            economics.
          touchpoints:
            - NRR, GRR, churn, renewal, and top-account share are undisclosed
            - Named references do not establish representative retention
    approximationNotes: >-
      Conceptual sequence inferred from documented customer segments, integration surfaces, and public use cases; it
      does not imply disclosed conversion rates, stage populations, contract duration, or renewal outcomes.
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU015
      - CU016
