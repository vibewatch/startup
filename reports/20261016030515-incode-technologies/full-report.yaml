  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct suites, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The public evidence in this worker pool shows that Incode's buyer does not evaluate one uniform competitor
              class. Gartner surfaces Jumio, Sumsub, Facephi/Digital Onboarding, and LexisNexis IDVerse as visible
              alternatives around the product, while Growth Engineer broadens the field to adjacent vendors such as
              HyperVerge, Meelo, Merkle Science, and Microblink. Zyphe's competitor-authored comparison pushes a
              different framing again: privacy-first architectures versus centralized vendor clouds. That means the real
              landscape spans direct biometric IDV suites, adjacent document/fraud tools, privacy-first challengers, and
              the status-quo substitute of internal/manual review.
