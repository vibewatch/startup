  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence places Incode inside the broader identity-verification and trust-infrastructure
              market, not inside a narrow document-check widget category. Across official and third-party summaries, the
              company is described as combining document verification, biometrics, passive liveness, government-record
              checks, KYC and KYB, age assurance, and newer digital-ID or agent-identity workflows. That boundary
              matters because buyers are not purchasing a single point API; they are choosing a control layer for
              regulated onboarding, authentication, and fraud prevention journeys. The same sources also define what
              should stay outside the market boundary: transaction monitoring, generic IAM suites, and unrelated
              payment-fraud tooling are adjacent controls, but not the same spend bucket.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM004
              - CM006
      - number: '2.2'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Buyer evidence is strongest in regulated enterprise segments where the cost of fraud, false rejection, or
              compliance failure is high enough to justify orchestration-heavy identity controls. Public descriptions
              repeatedly name banks, credit unions, neobanks, fintechs, government agencies, marketplaces, telecoms, and
              selected hospitality flows. The likely day-to-day user is an onboarding, fraud, or trust-and-safety team,
              while the payer is usually a risk, compliance, digital-channels, or identity-security budget owner.
              Adoption appears to start when a team needs to reduce abandonment without reopening fraud losses: the
              official product pages emphasize direct integrations with government systems of record, configurable
              workflows, and omnichannel deployment, while third-party sources say pricing is outcome-based and
              typically enterprise-contracted rather than self-serve.
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM012
              - CM014
      - number: '2.3'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              No retained source in the assigned pool publishes an independent, spend-based TAM or CAGR for Incode's
              precise category, so the safest sizing approach is to preserve several narrower lenses. First is
              installed-base penetration: official materials and the September 2026 profile say Incode serves 8 of the
              top 10 U.S. banks, 8 of the top 9 U.S. telcos, all 3 of the top global neobanks, and 4 of the top 5 global
              marketplaces. Second is throughput: company-controlled sources say the platform has run 7.1B+ trust checks
              and holds 400M identity profiles, while separate third-party summaries cite 4.1B+ annual identity checks,
              which supports large scale but uses a different denominator and time basis. Third is revenue: Biometric
              Update, citing Bloomberg, reported $170M ARR and a contemplated $150M-$300M round at up to a $3B valuation
              in late 2025. Together these lenses support a large regulated-enterprise opportunity, but they do not
              substitute for an independent market-spend benchmark.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM010
