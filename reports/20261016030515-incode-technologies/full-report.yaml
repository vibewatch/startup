        title: Milestones, expansion path, and refresh watchpoints
        blocks:
          - type: paragraph
            body: >-
              The milestone trail is strong enough to establish a reusable chronology for later chapters. The official
              about page provides dated anchors from founding through 2026, including product launches, liveness
