  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public evidence supports strategic relevance but not confident underwriting of the rumored 2025 valuation step-up.
    data:
      nodes:
        - id: proof
          label: Product and market proof
          note: Enterprise identity platform for regulated buyers.
        - id: traction
          label: Commercial traction claims
          note: Top-bank penetration and 7B+ trust checks indicate scale.
        - id: last-round
          label: Last closed valuation anchor
          note: $220M Series B at $1.25B valuation in 2021.
        - id: current-process
          label: Current financing context
          note: Reported 2025 process sought $150M-$300M at up to $3B.
        - id: gaps
          label: Missing underwriting inputs
          note: No public close confirmation, preferences, pricing sheet, or core economics package.
          tone: risk
        - id: recommendation
          label: Recommendation
          note: Track and diligence more; only move if price and quality-of-growth de-risk.
      edges:
        - from: proof
          to: traction
          label: explains relevance
        - from: traction
          to: last-round
          label: supports why capital was available
        - from: last-round
          to: current-process
          label: frames the valuation step-up
        - from: current-process
          to: gaps
          label: still needs verification
        - from: gaps
          to: recommendation
          label: keeps entry discipline high
    approximationNotes: The flow is qualitative and does not imply modeled conversion rates between nodes.
