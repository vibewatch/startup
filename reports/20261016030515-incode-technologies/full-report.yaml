              - CU014
      - number: '6.4'
        title: Product breadth supports expansion, but retention and concentration are opaque
        blocks:
          - type: paragraph
            body: >-
              Incode's REST APIs, mobile and web SDKs, pre-built connectors, and no-code or low-code workflow tools
              create a credible mechanism for landing in one verification flow and expanding into adjacent channels or
              use cases. On-device age estimation adds a privacy-sensitive adoption surface, and the company reports a
              92% first-try completion rate for that product. Public-sector expansion is strategically visible:
              Biometric Update linked Incode's sought capital to scale and government biometrics opportunities. That
              signal also adds risk, because expansion aspirations do not establish contracted demand. Across the
              assigned evidence, there is no disclosed active-customer count, NRR, GRR, churn, renewal rate,
              top-customer revenue share, or segmented contract economics. Those omissions prevent a supportable
              judgment on durability and concentration despite credible deployment breadth.
            claimRefs:
