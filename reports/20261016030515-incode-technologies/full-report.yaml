            body: >-
              Public sources do not give a clean income statement, but the combination of billions of verifications,
              penetration into major U.S. banks and telcos, and a reported $170 million ARR indicates Incode is well
              beyond pilot-stage revenue.
            calloutType: strength
            claimRefs:
