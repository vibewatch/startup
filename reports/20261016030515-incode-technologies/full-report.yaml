  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: The customer base is enterprise-led and concentrated in regulated workflows
        blocks:
          - type: paragraph
            body: >-
              Incode is positioned for large B2C enterprises operating in regulated or fraud-exposed environments,
              rather than for small businesses with light compliance needs. Partner listings identify financial
              services, fintech, government, retail, hospitality, gaming, banks, and resorts as customer settings, while
              a World Economic Forum profile also names marketplaces, hotels, and hospitals. In these deployments, the
              institutional customer is the buyer and payer, but the product is experienced by applicants, account
              holders, citizens, residents, guests, and marketplace users. Carahsoft and Industry Insider Texas provide
              a visible public-sector route, although both are channel-side descriptions rather than audited agency
              deployment records. Incode's global office footprint supports a multi-region sales narrative, but it does
              not reveal customer or revenue mix by geography.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU006
              - CU013
      - number: '6.2'
        title: Usage indicators show scale, but their denominators are not customer counts
        blocks:
          - type: paragraph
            body: >-
              The strongest scale indicators are transaction and cohort claims, not disclosed account counts. Incode's
              current official page says the platform has run 7.1B+ trust checks and is used by eight of the top ten
              U.S. banks, eight of the top nine U.S. telcos, all three cited top neobanks, and four of the top five
              marketplaces. Biometric Update separately reported that CEO Ricardo Amper said Incode processed more than
              4.1 billion identity checks in 2024 and served large bank and telco cohorts. These figures support
              substantial operational activity, but "trust checks" and "identity checks" are not a customer denominator
              and may not share the same definition or period. Company-reported completion and speed metrics strengthen
              the usage case, yet omit sample size, cohort, and production distribution.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
              - CU011
          - type: table
            tableRef: TU002
