      - number: '4.3'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The bullish case is that Incode has enough product breadth, customer penetration, and verification volume
              to support a substantial recurring-revenue base, with automation and an in-house model stack that should
              be economically better than labor-heavy review models. The bearish case is that almost every
              underwriting-grade metric still sits behind management access: there is no public gross margin, CAC,
              payback, burn, runway, retention, concentration, or realized pricing by vertical. That turns the recent
              fundraise signal and the company's own $100 million infrastructure commitment into the central financial
              risk. Until those private metrics are opened, the right verdict is commercially credible but not yet
              underwritten on efficiency or capital adequacy.
            claimRefs:
              - CI011
              - CI014
              - CI015
              - CI016
