            title: Deployment breadth is not retention proof
            body: >-
              The assigned evidence shows substantial usage and credible enterprise references, but it does not disclose
              active customers, renewal cohorts, NRR, GRR, churn, or top-account revenue share.
            calloutType: risk
            claimRefs:
