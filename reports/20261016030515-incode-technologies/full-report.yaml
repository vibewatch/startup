              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM008
              - CM009
              - CM011
      - number: '2.4'
        title: Growth drivers, adoption constraints, and remaining gaps
        blocks:
          - type: paragraph
            body: >-
              The pool points to three demand drivers: rising deepfake and synthetic-identity pressure, regulation-heavy
              onboarding and re-authentication flows, and a need to reduce friction versus manual review or legacy
              centralized systems. Incode's own narratives repeatedly frame automation, privacy-preserving biometrics,
              and government-record connectivity as the way to improve conversion while staying compliant. The same
              evidence also surfaces what can slow adoption. Privacy-law fragmentation, data-residency requirements, and
              explainability or oversight questions matter more in identity than in lighter fraud tooling, while opaque
              pricing and long-term enterprise contracts make low-volume or low-compliance buyers a weaker fit. The
              largest diligence gap is structural: without an independent spend benchmark, disclosed segment win rates,
              or transparent pricing bands, the chapter can show where Incode has traction but cannot defensibly convert
              that traction into a precise TAM, SAM, or SOM.
            claimRefs:
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Penetration evidence is stronger than TAM evidence
            body: >-
              The retained pool supports a convincing story about who buys Incode and why, but it does not support a
              clean external market-size number. Penetration, throughput, and revenue proxies are usable; a precise
              spend-based TAM is not.
            calloutType: insight
            claimRefs:
              - CM008
              - CM010
              - CM015
          - type: callout
            title: Enterprise fit creates a narrower practical market
            body: >-
              Public pricing opacity, long-term contracting, and privacy or data-residency complexity imply that the
              credible near-term market is regulated enterprise identity, not the entire long tail of SMB verification
              demand.
            calloutType: risk
            claimRefs:
