  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product scope and user workflows
        blocks:
          - type: paragraph
            body: >-
              The public footprint describes Incode as an omnichannel identity-security platform that spans onboarding,
              authentication, age assurance, payments, and fraud prevention rather than a single-step document checker.
              The strongest support is the official AI-info page, which lists workflow builder, decisioning, fraud
              analytics, case management, API, and SDK surfaces, plus external directories that enumerate document
              capture, face matching, passive liveness, deepfake detection, and government-record checks. The product
              map also shows a multi-asset estate instead of one monolith: MetaMap remains a distinct acquired
              orchestration/data-source layer, while recent 2026 releases added GovDataMatch, new eKYC sources, and
              integrations such as Greenhouse. That breadth is useful for enterprise buyers, but the retained public
              record still says more about available modules than about which modules are most deployed, what attach
              rates look like, or where customer outcomes come from a specific layer versus the combined stack.
            claimRefs:
