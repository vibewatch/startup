chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and current stage
        blocks:
          - type: paragraph
            body: >-
              Incode's current official positioning is broad but coherent: it presents itself as an identity platform
              spanning verification of people, businesses, and increasingly AI agents, with compliance and fraud tooling
              wrapped around that core. Across the official homepage, the about page, and a third-party vendor profile,
              the consistent through-line is an end-to-end biometric identity layer sold into banks, fintechs, telcos,
              marketplaces, and government-linked use cases rather than a narrow point solution. The most supportable
              stage description from the retained evidence is late-stage private and post-Series B, with a company still
              expanding product scope and inorganic footprint while preserving a private-market funding path instead of
              disclosing public-company style operating detail.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO015
      - number: '1.2'
        title: Leadership, founder dependence, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public leadership coverage is founder-led. The official about page clearly anchors the company around
              Ricardo Amper, while the strongest third-party founder roster in this pool comes from GrowthEngineer,
              which names three additional cofounders covering biometrics, AI, and finance. That gives enough evidence
              to describe functional founder-market fit, but not enough to describe board oversight with precision. The
              assigned sources do not expose a public board roster, committee structure, or decision-rights map, and the
              most skeptical independent profile in the pool explicitly criticizes the company's disclosed oversight
              model as underspecified. For diligence purposes, the company should be treated as highly dependent on
              founder-led narrative and execution until management, board, and appeals/governance processes are
              documented in primary materials.
