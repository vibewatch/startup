      - number: '6.3'
        title: Named proof exists, while production status and measured outcomes remain thin
        blocks:
          - type: paragraph
            body: >-
              Growth Engineer names Citibank, Chime, Amazon, Jumeirah Hotel & Resorts, Cibanamex, Viva Aerobús,
              Metallicus, and Motorway as notable customers. Its Jumeirah example is more useful than a logo because it
              describes mobile contactless check-in using facial recognition and document scanning. The same source
              describes a GSA and Login.gov relationship, but the assigned evidence does not include a procurement
              record or a customer-issued confirmation. Consequently, the named set establishes plausible deployments
              without establishing contract value, launch date, current status, rollout size, or renewal. No assigned
              source provides a customer-approved roster spanning the large cohorts claimed elsewhere. Logos and
              directory listings therefore demonstrate breadth of references, not representative production penetration
              or retention.
            claimRefs:
              - CU009
              - CU013
              - CU014
              - CU016
          - type: table
            tableRef: TU003
