              - CP008
              - CP012
              - CP013
      - number: '3.3'
        title: 'Moat durability: scale, distribution, and trust posture'
        blocks:
          - type: paragraph
            body: >-
              Incode's moat looks strongest when procurement prizes enterprise references, government readiness, and
              scale. Biometric Update reports a Bloomberg-sourced fundraising process at up to a $3 billion valuation
              with about $170 million of ARR, and the same reporting ties the company to major bank and telco
              penetration plus a FedRAMP push. Those signals matter because the market is not just feature comparison;
              distribution, compliance posture, and implementation credibility help determine which shortlist a buyer
              will trust. But the same moat is not universal. Privacy-first challengers attack centralized biometric
              custody directly, and manual-review-oriented peers appeal to buyers who want human escalation or more
              flexible exception handling.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP014
      - number: '3.4'
        title: Open questions and risk of displacement
        blocks:
          - type: paragraph
            body: >-
              The main diligence problem is not identifying alternatives; it is proving when Incode wins economically or
              operationally against them. The assigned pool does not contain apples-to-apples public transaction
              pricing, a shared benchmark for false accepts versus false rejects across peers, or neutral
              post-acquisition integration evidence covering MetaMap, AuthenticID, and Identiq under one commercial
              motion. A buyer should therefore treat public comparisons as routing signals, then run live-traffic
              bakeoffs focused on completion rate, manual-review load, privacy requirements, and deletion/data-custody
              obligations before treating the moat as underwritten.
            claimRefs:
              - CP008
              - CP011
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Competitive set is bifurcating, not converging
            body: >-
              Incode's hardest competition is split between enterprise automation suites and privacy-first or
              manual-review substitutes, so feature parity alone will not decide most bids.
            calloutType: insight
            claimRefs:
              - CP004
              - CP006
              - CP012
              - CP014
          - type: callout
            title: Public comparisons understate procurement friction
            body: >-
              The assigned pool supports a strong automation story, but it does not provide neutral price parity or
              shared false-positive benchmarks, so buyers still need live-traffic bakeoffs before underwriting moat or
              margin durability.
            calloutType: risk
            claimRefs:
              - CP008
              - CP013
              - CP014
