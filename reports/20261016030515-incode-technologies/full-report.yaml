      - number: '5.2'
        title: Operating architecture, integration surface, and release maturity
        blocks:
          - type: paragraph
            body: >-
              The architecture that emerges from retained sources is layered and integration-friendly. Incode publishes
              REST APIs plus iOS, Android, and web SDKs across web, mobile, kiosk, and in-branch journeys, while AI
              FinTech Index points to a current release cadence that touches both control-plane and data-plane
              capabilities. The best evidence for technical depth is not just the module list but the combination of
              workflow orchestration, government/commercial connectors, and in-house model ownership across biometric
              and document checks. At the same time, some maturity signals cut both ways: the September 2026 note about
              blocking uploaded images unless a flow explicitly permits them is a sensible anti-fraud hardening step,
              but it also shows how much implementation quality depends on customer configuration choices and on
              understanding the edge-case behavior of capture controls, registry connectors, and exception handling.
            claimRefs:
