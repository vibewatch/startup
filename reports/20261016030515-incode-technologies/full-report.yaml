      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is supported, not hypothetical
            body: >-
              The retained pool is strong enough to treat Incode as a real multi-layer platform: APIs and SDKs, workflow
              tooling, in-house models, government connectors, and live 2026 release changes all show up in public
              evidence rather than only in marketing adjectives.
            calloutType: strength
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE009
          - type: callout
            title: Control-plane diligence still has to happen off the page
            body: >-
              Public evidence does not resolve manual override design, customer-specific model isolation, hosting-region
              architecture, or whether FedRAMP has moved beyond the Ready milestone, so the product can look mature
              while still hiding implementation and governance risks.
            calloutType: risk
            claimRefs:
