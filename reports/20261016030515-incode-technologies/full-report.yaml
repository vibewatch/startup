  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Incode sells identity infrastructure into regulated, fraud-exposed workflows, so a privacy, availability,
              model-governance, or integration failure can interrupt customer onboarding and create legal or
              reputational costs. The evidence supports real mitigations: Incode lists a broad certification set, its
              hiring language requires incident command and regulated-account controls, and TrustGraph is designed to
              avoid a central customer-data pool. Those measures reduce but do not eliminate exposure. The public record
              does not provide company-specific incident frequency, certification scope, litigation status, customer
              concentration, or audited financial resilience. The heatmap therefore ranks privacy and model governance,
              tier-1 operating resilience, and capital discipline above generic product execution risk.
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR007
              - CR010
              - CR012
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR007
              - CR008
              - CR011
              - CR013
              - CR014
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and model risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory exposure is structural because the product processes biometric and identity data across
              jurisdictions. A company interview describes fragmented privacy regulation, while Incode's own FAQ tells
              buyers to confirm regional residency and compliance details directly. The listed SOC 2 and ISO credentials
              are useful mitigations, but the assigned evidence does not reveal their detailed scope or substitute for
              jurisdiction-specific consent, retention, appeal, and cross-border-transfer review. Agent identity also
              lacks an adopted industry standard as of September 2026. No primary court or regulator record was
              allocated, so this chapter does not infer an absence of litigation or enforcement; it treats that record
              as a diligence gap.
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR010
              - CR012
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR008
              - CR010
              - CR012
              - CR014
              - CR015
      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              The clearest operating evidence comes from Incode's own technical-account hiring requirements. The role
              must lead major incidents, assess business continuity and multi-region readiness, manage release gates,
              address client-side SDK injection, and understand model versioning, bias audits, and explainability. That
              is positive evidence that management recognizes the control surface, but a job specification is not proof
              of control effectiveness. Dependence on AWS architectures and customer-specific SDK, webhook, and API
              implementations creates shared-responsibility failure modes. Without uptime history, postmortems,
              false-accept and false-reject trends, penetration-test findings, or model-drift evidence, residual
              exposure remains material.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.4'
        title: Partner, financial, and execution risk
        blocks:
          - type: paragraph
            body: >-
              TrustGraph's architecture may improve cross-institution fraud detection without pooling customer data, but
              its value increases as more institutions participate; adoption and governance are therefore product
              dependencies rather than incidental go-to-market considerations. Commercial opacity compounds that risk.
              Incode says pricing and contract structures are not public, while an independent review describes
              performance-linked pricing and typical three-year agreements. Separately, 2025 reporting said the company
              was seeking $150 million to $300 million at up to a $3 billion valuation and cited $170 million of ARR. A
              sought round is not cash raised or available, and ARR is not revenue, cash flow, or runway, so financing
              close, burn, margin, and concentration remain required underwriting evidence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR011
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR009
              - CR011
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Pause or reject the investment if management cannot produce jurisdiction-level biometric controls and
              model-governance results; if material unresolved litigation, enforcement, or repeated severity-one
              incidents emerge; if a single customer exceeds 20% of revenue without contractual protection; or if the
              sought financing remains unclosed while verified runway falls below 12 months.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR010
              - CR012
              - CR013
              - CR015
          - type: callout
            title: Priority diligence package
            body: >-
              Request the certification and FedRAMP boundary documents, privacy and residency matrix, litigation and
              regulator search, four quarters of incident and model-performance data, top-customer concentration and
              retention, TrustGraph participation and independent uplift evidence, and signed financing documents with
              gross margin, burn, and runway.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR007
              - CR013
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The valuation call is price-sensitive, not a generic quality endorsement. Public sources support the view
              that Incode has built real enterprise relevance across regulated identity verification, with
              company-controlled materials claiming top-bank penetration and billions of trust checks, and the broader
              product story expanding through acquisitions and continuous-trust positioning. That keeps the company
              investable.


              The harder question is price. The last fully disclosed anchor is the 2021 Series B at a $1.25 billion
              valuation. By contrast, the latest independently reported financing context is only a 2025 process that
              sought $150 million to $300 million at up to a $3 billion valuation. With no public confirmation that the
              round closed, no disclosed preference stack, and no verified current pricing schedule or unit-economics
              package, the right call from public evidence is to track the asset, not underwrite the rumored step-up
              today.
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV011
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Financing context and scenario framing
        blocks:
          - type: paragraph
            body: >-
              The bullish case is understandable. Incode is positioned as a full-stack, in-house identity platform for
              banks, fintechs, government agencies, and other regulated buyers, and recent company materials emphasize
              broad transaction scale, 35-plus in-house models, and acquisitions intended to widen its fraud, document,
              and privacy stack. Biometric Update also reported a source saying the business was at up to $170 million
              of ARR when the 2025 raise was being discussed. If those economics are clean and repeatable, premium
              pricing can be argued.


              The base and bear cases are more constrained because public underwriting inputs are still thin. The 2021
              round also cited 6x revenue growth over the prior year, but independent sources still describe pricing as
              unpublished or unverified, and the available public record does not disclose margins, retention, customer
              concentration, or the closing terms for the rumored new round. That means the strongest public scenario
              framework is relative rather than precise: bull only near the headline ask if diligence validates the
              economics, base between the last disclosed mark and the headline, and bear back toward or below the last
              disclosed benchmark if the raise reprices or stalls.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV012
              - CV013
      - number: '8.3'
        title: Diligence gates and exit logic
        blocks:
          - type: paragraph
            body: >-
              The main reason not to move from track to buy is not lack of product proof; it is lack of valuation proof.
              Independent assessment is explicit that pricing transparency is weak, with no verified price sheet and no
              clear public benchmark for what customers pay beyond long-term enterprise contracting. The same
              independent assessment also highlights missing model-documentation, drift-monitoring, and appeal-mechanism
              disclosure, which matters because a premium multiple normally assumes not just category strength but lower
              execution and governance surprise risk.


              A constructive next step would be to treat Incode as an asset that may deserve a premium only after
              diligence closes the disclosure gap. The threshold items are straightforward: confirm whether the 2025
              financing actually closed and on what terms, obtain cohort-quality economics such as gross margin,
              retention, burn, and concentration, and determine whether the current scope-expansion story translates
              into cleaner exit options for growth-equity buyers or strategic acquirers. Until those items are
              available, exit-readiness is a strategic possibility rather than a priced fact.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence still argues for patience
            body: >-
              Track Incode as a high-quality identity asset, but do not underwrite the rumored valuation step-up until
              closing terms, pricing architecture, and quality-of-growth data are verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV012
              - CV013
              - CV014
