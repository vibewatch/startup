      - number: '4.2'
        title: Public traction proxies and capital signals
        blocks:
          - type: paragraph
            body: >-
              The public record shows meaningful scale, but mostly through operating proxies rather than audited
              financial statements. Incode said revenue grew 6x in the twelve months before the December 2021 Series B,
              later said it completed 4.1 billion identity verifications in 2024, and by March 2026 said it had
              processed more than 7.1 billion trust checks. Biometric Update, citing Bloomberg, reported $170 million
              ARR and a November 2025 fundraising process targeting $150 million to $300 million at up to a $3 billion
              valuation. The full round chronology belongs in Company Overview; financially, the important implication
              here is that Incode appears to have genuine enterprise scale, but still may be funding expansion,
              acquisitions, and government go-to-market ahead of any publicly disclosed profitability.
