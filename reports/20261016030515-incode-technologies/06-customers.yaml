        - Listed as a notable customer
        - Not disclosed
        - No measured outcome in assigned evidence
        - Directory-only proof; product modules and active status are absent
      - - Jumeirah Hotel & Resorts
        - Hospitality
        - Mobile contactless check-in using face and document verification
        - Described as in use, but not independently corroborated
        - Source claims faster check-in without a quantified result
        - No rollout size, launch date, contract value, or renewal evidence
      - - Login.gov / GSA
        - U.S. federal identity program
        - Identity proofing for government services
        - Described as a partnership or integration
        - Source claims verification at large citizen scale
        - No assigned procurement record or customer-issued confirmation
    notes: >-
      This is a sample of names and programs visible in the assigned evidence,
      not an exhaustive customer roster; production status is marked unknown
      where no customer or procurement source confirms it.
    enumerationScope:
      coverage: sample
      basis: >-
        Representative names from the assigned public sources reviewed through
