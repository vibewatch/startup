  evidenceGaps:
    - type: missing-source
      severity: material
      topic: adoption-scale
      missingEvidence: Active-customer count and a reconciled definition and period for trust checks, identity checks, unique users, and repeat usage.
      whyItMatters: >-
        Aggregate checks can grow through repeated activity at a small number of
        accounts, so they cannot establish customer breadth or adoption quality.
      diligencePath: >-
        Request monthly active enterprise accounts, unique verified users,
        checks per customer, and a metric dictionary reconciled to the reported
        2024 and 2026 scale figures.
      relatedQuestionRefs:
        - QU002
      relatedTableRefs:
        - TU002
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Customer-issued or procurement evidence confirming production status, deployment date, modules, scale, outcomes, and current contract status for named references.
      whyItMatters: >-
        Directory placement and vendor descriptions cannot distinguish a pilot,
        historical relationship, limited integration, or scaled production use.
      diligencePath: >-
        Obtain customer-approved references and contracts or purchase orders for
        a representative bank, telco, marketplace, government, and hospitality
        account, including measured outcomes and renewal status.
      relatedQuestionRefs:
        - QU003
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: customer-durability-gap
      missingEvidence: NRR, GRR, logo churn, renewal rates, contract length and termination terms, expansion revenue, top-customer share, and revenue mix by vertical and geography.
      whyItMatters: >-
        Without these metrics, broad usage and named references cannot establish
        durable recurring demand or rule out customer and channel concentration.
      diligencePath: >-
        Request audited customer and ARR cohorts for at least eight quarters,
        with top-10 concentration, renewals, downsells, churn, and expansion
        separated by vertical, geography, channel, and product module.
      relatedQuestionRefs:
        - QU004
        - QU005
        - QU009
        - QU010
