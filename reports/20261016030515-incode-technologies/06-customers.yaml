schemaVersion: report-v2
artifact: customers
slug: incode-technologies
runDate: 2026-10-16
company:
  name: Incode Technologies
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports real enterprise adoption across banks, telcos,
    marketplaces, public agencies, and hospitality, with company-reported scale
    reaching 7.1B+ trust checks. The evidence does not disclose active-customer
    count, retention, renewal, contract economics, or revenue concentration, so
    customer durability remains materially less proven than deployment breadth.
sections:
  - id: customer-segments
    title: The customer base is enterprise-led and concentrated in regulated workflows
    body: >-
      Incode is positioned for large B2C enterprises operating in regulated or
      fraud-exposed environments, rather than for small businesses with light
      compliance needs. Partner listings identify financial services, fintech,
      government, retail, hospitality, gaming, banks, and resorts as customer
      settings, while a World Economic Forum profile also names marketplaces,
      hotels, and hospitals. In these deployments, the institutional customer is
      the buyer and payer, but the product is experienced by applicants,
      account holders, citizens, residents, guests, and marketplace users.
      Carahsoft and Industry Insider Texas provide a visible public-sector route,
      although both are channel-side descriptions rather than audited agency
      deployment records. Incode's global office footprint supports a
      multi-region sales narrative, but it does not reveal customer or revenue
      mix by geography.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU013
    tableRefs:
      - TU001
  - id: adoption-trajectory
    title: Usage indicators show scale, but their denominators are not customer counts
    body: >-
      The strongest scale indicators are transaction and cohort claims, not
      disclosed account counts. Incode's current official page says the platform
      has run 7.1B+ trust checks and is used by eight of the top ten U.S. banks,
      eight of the top nine U.S. telcos, all three cited top neobanks, and four
      of the top five marketplaces. Biometric Update separately reported that
      CEO Ricardo Amper said Incode processed more than 4.1 billion identity
      checks in 2024 and served large bank and telco cohorts. These figures
      support substantial operational activity, but "trust checks" and
      "identity checks" are not a customer denominator and may not share the
      same definition or period. Company-reported completion and speed metrics
      strengthen the usage case, yet omit sample size, cohort, and production
      distribution.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
    tableRefs:
      - TU002
  - id: named-customer-proof
    title: Named proof exists, while production status and measured outcomes remain thin
    body: >-
      Growth Engineer names Citibank, Chime, Amazon, Jumeirah Hotel & Resorts,
      Cibanamex, Viva Aerobús, Metallicus, and Motorway as notable customers.
      Its Jumeirah example is more useful than a logo because it describes
      mobile contactless check-in using facial recognition and document
      scanning. The same source describes a GSA and Login.gov relationship, but
      the assigned evidence does not include a procurement record or a
      customer-issued confirmation. Consequently, the named set establishes
      plausible deployments without establishing contract value, launch date,
      current status, rollout size, or renewal. No assigned source provides a
      customer-approved roster spanning the large cohorts claimed elsewhere.
      Logos and directory listings therefore demonstrate breadth of references,
      not representative production penetration or retention.
    claimRefs:
      - CU009
      - CU013
      - CU014
      - CU016
    tableRefs:
      - TU003
  - id: durability-and-expansion
    title: Product breadth supports expansion, but retention and concentration are opaque
    body: >-
      Incode's REST APIs, mobile and web SDKs, pre-built connectors, and
      no-code or low-code workflow tools create a credible mechanism for landing
      in one verification flow and expanding into adjacent channels or use
      cases. On-device age estimation adds a privacy-sensitive adoption surface,
      and the company reports a 92% first-try completion rate for that product.
      Public-sector expansion is strategically visible: Biometric Update linked
      Incode's sought capital to scale and government biometrics opportunities.
      That signal also adds risk, because expansion aspirations do not establish
      contracted demand. Across the assigned evidence, there is no disclosed
      active-customer count, NRR, GRR, churn, renewal rate, top-customer revenue
      share, or segmented contract economics. Those omissions prevent a
      supportable judgment on durability and concentration despite credible
      deployment breadth.
    claimRefs:
      - CU010
      - CU012
      - CU015
      - CU016
    figureRefs:
      - FU001
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale signal
      - Strategic value
      - Diligence gap
    rows:
      - - Banks, neobanks, and fintechs
        - "Buyer/payer: fraud, compliance, or digital-product team; users: applicants and account holders"
        - KYC, account opening, authentication, and payment verification
        - Officially claimed penetration of leading U.S. banks and global neobanks
        - High-volume regulated workflows can anchor multi-module adoption
        - Named-account activity, revenue, renewal, and concentration are undisclosed
      - - Telcos and marketplaces
        - "Buyer/payer: trust, safety, or onboarding team; users: subscribers, sellers, buyers, and payout recipients"
        - Enrollment, age assurance, fraud screening, and re-authentication
        - Officially claimed penetration of leading U.S. telcos and global marketplaces
        - Large user populations can generate recurring verification volume
        - Cohort definitions, active-account status, and geography mix are undisclosed
      - - Government and public sector
        - "Buyer/payer: agency or procurement channel; users: citizens and residents"
        - Digital identity proofing, benefit access, and fraud reduction
        - Carahsoft and Industry Insider Texas position Incode for agency procurement
        - Government programs can provide scale and reference value
        - No assigned procurement record establishes award value, agency count, or renewal
      - - Hospitality, travel, and adjacent enterprises
        - "Buyer/payer: operations or digital-experience team; users: guests and travelers"
        - Contactless check-in and identity verification at service access
        - Jumeirah and Viva Aerobús appear in an independent customer directory
        - Extends adoption beyond financial-services workflows
        - Rollout size, measured outcome, and current production status are not established
    notes: >-
      The rows combine company claims, partner descriptions, and third-party
      directory evidence; scale signals are not comparable customer or revenue
      counts, and null commercial metrics remain undisclosed.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU006
      - CU013
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Period / date
      - Attribution
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Trust checks
        - 7.1B+
        - Page updated 2026-09-25
        - Incode official AI information page
        - Medium
        - Supports large cumulative or aggregate platform activity
        - Metric definition, time window, unique users, and active customers
      - - Identity checks
        - More than 4.1B
        - Calendar 2024, reported 2025-11-20
        - Biometric Update quoting CEO Ricardo Amper
        - Medium
        - Independently published evidence of substantial 2024 throughput
        - Number of customers, unique users, repeat checks, and geography mix
      - - Enterprise cohort penetration
        - "8/10 U.S. banks; 8/9 U.S. telcos; 3/3 neobanks; 4/5 marketplaces"
        - Page updated 2026-09-25
        - Incode official AI information page
        - Medium
        - Indicates adoption in large regulated and high-volume cohorts
        - Cohort ranking basis, named accounts, production status, and revenue share
      - - On-device age-check completion
        - 92% complete on first try
        - "2026-06-25"
        - Incode product blog
        - Medium
        - Suggests low-friction use for one privacy-sensitive workflow
        - Sample size, customer cohort, geography, and independent validation
      - - Average KYC check
        - Approximately 4 seconds
        - Page updated 2026-09-25
        - Incode official AI information page
        - Medium
        - Suggests a fast onboarding experience
        - Distribution, failure rate, test conditions, and production customer mix
    notes: >-
      Trust checks, identity checks, cohort penetration, completion, and latency
      use different units and populations; they are separate adoption indicators,
      not a funnel or a time series.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
