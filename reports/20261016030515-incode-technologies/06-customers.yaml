      - CU009
      - CU013
      - CU014
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      The observable journey moves from enterprise qualification and integration
      to end-user verification and adjacent workflow expansion, while renewal
      and concentration remain hidden.
    data:
      items:
        - label: Qualify enterprise need
          detail: Regulated or fraud-exposed buyer identifies a KYC, authentication, age, or identity-proofing requirement.
          touchpoints:
            - Fraud, compliance, digital-product, and agency procurement teams
            - Banks, fintechs, telcos, marketplaces, agencies, and hospitality operators
        - label: Configure workflow
          detail: Buyer integrates through REST APIs, SDKs, connectors, or no-code and low-code workflow tools.
          touchpoints:
            - Web, mobile, kiosk, and in-branch surfaces
            - Document, biometric, liveness, and decision modules
        - label: Enroll end user
          detail: Applicant, citizen, guest, subscriber, or marketplace participant completes the selected identity flow.
          touchpoints:
            - Document and selfie capture
            - On-device age estimation for privacy-sensitive checks
        - label: Produce identity decision
          detail: Automated checks return onboarding, authentication, or payment-verification results.
          touchpoints:
            - Company-reported approximately four-second average KYC check
            - No public distribution or customer-level denominator
        - label: Expand use cases
          detail: Customer can add channels, modules, geographies, or adjacent re-authentication and fraud workflows.
          touchpoints:
            - Public-sector and government biometrics opportunity
            - Reusable workflow tooling and multi-channel SDK coverage
        - label: Test durability
          detail: Renewal, expansion revenue, and account concentration determine whether deployment breadth becomes durable economics.
          touchpoints:
            - NRR, GRR, churn, renewal, and top-account share are undisclosed
            - Named references do not establish representative retention
    approximationNotes: >-
      Conceptual sequence inferred from documented customer segments, integration
      surfaces, and public use cases; it does not imply disclosed conversion
      rates, stage populations, contract duration, or renewal outcomes.
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU015
      - CU016
callouts:
  - calloutType: risk
    title: Deployment breadth is not retention proof
    body: >-
      The assigned evidence shows substantial usage and credible enterprise
      references, but it does not disclose active customers, renewal cohorts,
      NRR, GRR, churn, or top-account revenue share.
    claimRefs:
      - CU005
      - CU007
      - CU016
