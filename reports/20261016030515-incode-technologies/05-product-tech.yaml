            - label: FedRAMP Ready path
    approximationNotes: This stack is a synthesized operating model from retained public sources, not a vendor-authored system blueprint.
    claimRefs: [CE002, CE004, CE005, CE006, CE007, CE014, CE015]
callouts:
  - calloutType: strength
    title: Breadth is supported, not hypothetical
    body: >-
      The retained pool is strong enough to treat Incode as a real multi-layer platform: APIs and
      SDKs, workflow tooling, in-house models, government connectors, and live 2026 release
      changes all show up in public evidence rather than only in marketing adjectives.
    claimRefs: [CE002, CE005, CE006, CE009]
  - calloutType: risk
    title: Control-plane diligence still has to happen off the page
    body: >-
      Public evidence does not resolve manual override design, customer-specific model isolation,
      hosting-region architecture, or whether FedRAMP has moved beyond the Ready milestone, so the
      product can look mature while still hiding implementation and governance risks.
    claimRefs: [CE008, CE012, CE013, CE014]
