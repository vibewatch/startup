companyProfile:
  summary: >-
    Incode Technologies is a private identity-verification and authentication platform vendor focused on regulated
    enterprise B2C workflows. The company combines biometric verification, document analysis, liveness detection,
    workflow orchestration, and compliance-oriented controls for banks, fintechs, telcos, marketplaces, hospitality, and
    government buyers. Public evidence supports meaningful scale and continued platform expansion, but the company still
    withholds audited financial detail, customer concentration, and current financing terms.
