company:
  name: Incode Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Incode is a San Francisco-founded identity-verification platform vendor
    that positions itself as an in-house AI stack for biometric, document, and
    fraud workflows across regulated enterprise customers. The public evidence
    in this worker pool supports real scale signals and an active
    acquisition/fundraising narrative, but current governance, audited
    financial quality, customer count, and current headcount remain materially
    opaque.
sections:
  - id: company-identity
    title: Identity, product scope, and current stage
    body: >-
      Incode's current official positioning is broad but coherent: it presents
      itself as an identity platform spanning verification of people,
      businesses, and increasingly AI agents, with compliance and fraud
      tooling wrapped around that core. Across the official homepage, the
      about page, and a third-party vendor profile, the consistent
      through-line is an end-to-end biometric identity layer sold into banks,
      fintechs, telcos, marketplaces, and government-linked use cases rather
      than a narrow point solution. The most supportable stage description
      from the retained evidence is late-stage private and post-Series B, with
      a company still expanding product scope and inorganic footprint while
      preserving a private-market funding path instead of disclosing
      public-company style operating detail.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO007
      - CO015
  - id: leadership-and-governance
    title: Leadership, founder dependence, and governance visibility
    body: >-
      Public leadership coverage is founder-led. The official about page
      clearly anchors the company around Ricardo Amper, while the strongest
      third-party founder roster in this pool comes from GrowthEngineer, which
      names three additional cofounders covering biometrics, AI, and finance.
      That gives enough evidence to describe functional founder-market fit,
      but not enough to describe board oversight with precision. The assigned
      sources do not expose a public board roster, committee structure, or
      decision-rights map, and the most skeptical independent profile in the
      pool explicitly criticizes the company's disclosed oversight model as
      underspecified. For diligence purposes, the company should be treated as
      highly dependent on founder-led narrative and execution until
      management, board, and appeals/governance processes are documented in
      primary materials.
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO006
      - CO014
    tableRefs:
      - TO002
      - TO003
  - id: funding-and-scale
    title: Funding, scale signals, and what remains unverified
    body: >-
      The retained evidence supports a real but uneven operating snapshot.
      Official materials and a 2026 company blog post both emphasize large
      usage scale, while the strongest public financing datapoints come from
      the 2021 unicorn event on the about page, a secondary funding-history
      profile, and a 2025 Biometric Update article citing Bloomberg-sourced
      fundraising discussions. Those sources are directionally consistent with
      a scaled private company, but they do not convert into a clean, audited
      operating picture. The ARR figure is reported, not filed; the latest
      valuation is a fundraising target, not a confirmed close; and key
      diligence metrics such as customer count, gross margin, NRR, burn, and
      current headcount remain undisclosed or not recoverable from the
      assigned fetched text.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO016
    tableRefs:
      - TO001
  - id: milestone-arc
    title: Milestones, expansion path, and refresh watchpoints
    body: >-
      The milestone trail is strong enough to establish a reusable chronology
      for later chapters. The official about page provides dated anchors from
      founding through 2026, including product launches, liveness milestones,
      financing, and three successive years of external recognition. More
      recent retained evidence adds acquisition and privacy-infrastructure
      context: the company now frames itself around continuous trust, deepfake
      resistance, and privacy-preserving network intelligence, while outside
      reporting indicates it is also still pursuing additional capital. For
      refresh tracking, the most important watchpoints are whether the
      reported late-2025 financing actually closed, how recently announced
      acquisitions integrate into the core platform, and whether operational
      scale claims convert into audited financial or customer disclosures.
    claimRefs:
      - CO009
      - CO011
      - CO013
    figureRefs:
      - FO001
