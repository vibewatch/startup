figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Official milestones show a steady arc from founding to repeated external recognition and acquisition-led expansion, with a late-stage financing question still open.
    data:
      items:
        - date: "2015-06-17"
          label: Founded in San Francisco
          detail: Ricardo Amper founded Incode in San Francisco.
          tone: positive
        - year: "2017"
          label: First biometric authentication launch
          detail: The company says it launched its first AI-powered biometric authentication solution.
          tone: positive
        - year: "2019"
          label: First-passive-liveness milestone
          detail: Incode says it became the first company to pass iBeta Level 1 certification for passive liveness.
          tone: positive
        - year: "2021"
          label: Unicorn status after Series B
          detail: The about page ties unicorn status and a $1.25B valuation to the Series B round.
          tone: positive
        - year: "2022"
          label: Level 2 testing and spoof-resistance improvements
          detail: Official history says Incode developed advanced 3D-mask detection, improved 2D-attack resistance, and passed iBeta Level 2 testing.
          tone: positive
        - year: "2024"
          label: MetaMap acquisition and Gartner recognition
          detail: Official history says Incode was named a Leader in the inaugural Gartner Magic Quadrant for Identity Verification and completed its first acquisition with MetaMap.
          tone: positive
        - year: "2025"
          label: AuthenticID acquisition and reported new financing process
          detail: Official history says Incode made a second acquisition with AuthenticID, while Biometric Update later reported a new round was being sought.
          tone: warning
        - year: "2026"
          label: Identiq acquisition, privacy commitment, and Prism recognition
          detail: Official materials describe a third acquisition with Identiq, a $100M privacy-infrastructure commitment, and Prism recognition tied to more than seven billion identity trust checks.
          tone: positive
    approximationNotes: null
    claimRefs:
      - CO003
      - CO009
      - CO011
      - CO013
callouts:
  - calloutType: insight
    title: Evidence-supported core takeaway
    body: >-
      The retained pool supports a real category leader narrative in
      enterprise identity verification, but most of the strongest operating
      claims still originate from company-controlled surfaces rather than
      audited financial disclosure.
    claimRefs:
      - CO001
      - CO007
      - CO008
      - CO016
  - calloutType: risk
    title: Main diligence watchpoint
    body: >-
      Governance transparency and current financing clarity lag the company's
      scale story, so a refresh that confirms the reported 2025 financing
      outcome and exposes board-level oversight would materially improve
      confidence.
    claimRefs:
      - CO005
      - CO006
      - CO011
      - CO016
