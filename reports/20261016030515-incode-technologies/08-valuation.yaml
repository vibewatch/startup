    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence
      - Decision implication
    rows:
      - [Recommendation, Track, "Real category proof exists, but public evidence still does not verify the current price or terms.", "Keep the company live in pipeline, but do not underwrite the rumored step-up yet."]
      - [Confidence, Medium, "The 2021 closed round is documented, while the 2025 process is reported but not confirmed closed.", "Use the chapter for monitoring and diligence framing, not conviction sizing."]
      - [Risk rating, Medium-high, "Commercial transparency, economics disclosure, and governance/appeal mechanics remain incomplete in public sources.", "Require term-sheet, cohort, and concentration diligence before moving forward."]
      - [Valuation stance, Stretched, "The reported up-to-$3B ask is materially above the last disclosed $1.25B benchmark without matching public disclosure depth.", "Only revisit positively if economics and structure justify the premium."]
    notes: Public-source-only recommendation summary; no audited financial package or term sheet is available in the assigned evidence pool.
    claimRefs: [CV001, CV002, CV007, CV011, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - What would change the view
    rows:
      - ["Thesis: enterprise proof", "Independent and company-controlled sources both position Incode as a regulated-enterprise identity platform with meaningful scale signals.", "Downgrade if customer concentration, churn, or false-positive economics are weaker than the product story implies."]
      - ["Thesis: scope expansion", "AuthenticID, agentic-identity positioning, and government-biometrics emphasis can widen use cases and strategic scarcity.", "Upgrade only if newer modules convert into visible revenue quality rather than just narrative breadth."]
      - ["Anti-thesis: price support gap", "The latest price signal is a reported process seeking up to $3B, not a publicly documented close with clean terms.", "Improve only after the lead investor, valuation, and preference stack are verified."]
      - ["Anti-thesis: commercial-transparency gap", "Independent sources say pricing is unpublished or unverified and still routed through enterprise sales.", "Improve only after pricing architecture, contract length, and payback data are consistently disclosed."]
    notes: Arguments summarize what the retained sources do and do not support; they are not substitutes for primary diligence on contracts or cap-table terms.
    claimRefs: [CV001, CV006, CV007, CV009, CV010, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "The 2025 round closes near the reported top end, ARR scale is clean, and acquisitions lift cross-sell and government wins.", "Only underwrite near the reported up-to-$3B ask if diligence validates premium software-like economics and clean terms.", "Integration complexity, long public-sector cycles, and faster deepfake competition.", "Lead investor, closing announcement, cohort data, and margin evidence all line up."]
      - [Base, "The business keeps compounding, but public evidence remains mostly company-controlled and economics disclosure stays incomplete.", "Prefer entry between the last disclosed $1.25B mark and the rumored $3B ask until growth quality and structure are verified.", "Round may clear below the headline or with investor-protective preferences.", "Economic diligence is mixed, but product traction remains intact."]
      - [Bear, "The raise slips, reprices, or carries heavy preferences while transparency gaps persist.", "Support falls back toward or below the last disclosed $1.25B benchmark because the public record would not justify the premium.", "Opaque pricing power, unclear retention, and governance surprise risk.", "No close confirmation, weaker growth signals, or adverse regulatory/customer evidence emerges."]
    notes: Scenario logic is ordinal and benchmark-based; the assigned pool does not contain a verified public-comps set or enough audited financial data for a precision model.
    claimRefs: [CV001, CV002, CV004, CV006, CV007, CV012, CV013]
