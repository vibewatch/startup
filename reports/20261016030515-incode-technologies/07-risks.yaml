callouts:
  - calloutType: "risk"
    title: "Thesis-break triggers"
    body: "Pause or reject the investment if management cannot produce jurisdiction-level biometric controls and model-governance results; if material unresolved litigation, enforcement, or repeated severity-one incidents emerge; if a single customer exceeds 20% of revenue without contractual protection; or if the sought financing remains unclosed while verified runway falls below 12 months."
    claimRefs: ["CR004", "CR005", "CR007", "CR010", "CR012", "CR013", "CR015"]
  - calloutType: "recommendation"
    title: "Priority diligence package"
    body: "Request the certification and FedRAMP boundary documents, privacy and residency matrix, litigation and regulator search, four quarters of incident and model-performance data, top-customer concentration and retention, TrustGraph participation and independent uplift evidence, and signed financing documents with gross margin, burn, and runway."
    claimRefs: ["CR001", "CR003", "CR004", "CR005", "CR007", "CR013", "CR014", "CR015"]
