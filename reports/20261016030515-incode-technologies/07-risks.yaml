chapter:
  number: 7
  title: "Risks"
  summary: "Incode's highest residual risks sit at the intersection of biometric regulation, failure-intolerant enterprise deployments, network and cloud dependencies, and financing opacity. Public controls and operating requirements are visible, but company-specific litigation, incident, concentration, burn, runway, and model-governance evidence remains private or absent from the assigned public pool."
sections:
  - id: "ranked-risk-posture"
    title: "Ranked risk posture"
    body: >-
      Incode sells identity infrastructure into regulated, fraud-exposed workflows, so a
      privacy, availability, model-governance, or integration failure can interrupt customer
      onboarding and create legal or reputational costs. The evidence supports real mitigations:
      Incode lists a broad certification set, its hiring language requires incident command and
      regulated-account controls, and TrustGraph is designed to avoid a central customer-data
      pool. Those measures reduce but do not eliminate exposure. The public record does not
      provide company-specific incident frequency, certification scope, litigation status,
      customer concentration, or audited financial resilience. The heatmap therefore ranks
      privacy and model governance, tier-1 operating resilience, and capital discipline above
      generic product execution risk.
    claimRefs: ["CR002", "CR004", "CR005", "CR007", "CR010", "CR012", "CR013", "CR015"]
    figureRefs: ["FR001"]
  - id: "regulatory-legal-and-model-risk"
    title: "Regulatory, legal, and model risk"
    body: >-
      Regulatory exposure is structural because the product processes biometric and identity
      data across jurisdictions. A company interview describes fragmented privacy regulation,
      while Incode's own FAQ tells buyers to confirm regional residency and compliance details
      directly. The listed SOC 2 and ISO credentials are useful mitigations, but the assigned
      evidence does not reveal their detailed scope or substitute for jurisdiction-specific
      consent, retention, appeal, and cross-border-transfer review. Agent identity also lacks an
      adopted industry standard as of September 2026. No primary court or regulator record was
      allocated, so this chapter does not infer an absence of litigation or enforcement; it
      treats that record as a diligence gap.
    claimRefs: ["CR005", "CR007", "CR008", "CR010", "CR012", "CR015"]
    tableRefs: ["TR001"]
  - id: "operational-quality-and-security-risk"
    title: "Operational, quality, and security risk"
    body: >-
      The clearest operating evidence comes from Incode's own technical-account hiring
      requirements. The role must lead major incidents, assess business continuity and
      multi-region readiness, manage release gates, address client-side SDK injection, and
      understand model versioning, bias audits, and explainability. That is positive evidence
      that management recognizes the control surface, but a job specification is not proof of
      control effectiveness. Dependence on AWS architectures and customer-specific SDK,
      webhook, and API implementations creates shared-responsibility failure modes. Without
      uptime history, postmortems, false-accept and false-reject trends, penetration-test
      findings, or model-drift evidence, residual exposure remains material.
    claimRefs: ["CR004", "CR005", "CR006", "CR007"]
    tableRefs: ["TR002"]
  - id: "partner-financial-and-execution-risk"
    title: "Partner, financial, and execution risk"
    body: >-
      TrustGraph's architecture may improve cross-institution fraud detection without pooling
      customer data, but its value increases as more institutions participate; adoption and
      governance are therefore product dependencies rather than incidental go-to-market
      considerations. Commercial opacity compounds that risk. Incode says pricing and contract
      structures are not public, while an independent review describes performance-linked
      pricing and typical three-year agreements. Separately, 2025 reporting said the company
      was seeking $150 million to $300 million at up to a $3 billion valuation and cited
      $170 million of ARR. A sought round is not cash raised or available, and ARR is not
      revenue, cash flow, or runway, so financing close, burn, margin, and concentration remain
      required underwriting evidence.
    claimRefs: ["CR001", "CR002", "CR003", "CR009", "CR011", "CR013", "CR014"]
    tableRefs: ["TR003"]
