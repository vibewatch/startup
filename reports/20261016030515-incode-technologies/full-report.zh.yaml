  - id: TV002
    title: 正论 / 反论表
    columns:
      - 视角
      - 论点
      - 哪些信息会改变判断
    rows:
      - - 正论：企业级验证
        - 独立来源和公司控制的来源都将 Incode 定位为面向受监管企业的身份平台，并显示出有意义的规模信号。
        - 如果客户集中度、流失率或误报经济性弱于产品叙事所暗示的水平，应下调判断。
      - - 正论：范围扩张
        - AuthenticID、代理式身份定位以及政府生物识别重点，可能拓宽使用场景并提升战略稀缺性。
        - 只有新模块转化为可见的收入质量，而不只是叙事广度时，才应上调判断。
      - - 反论：价格支撑缺口
        - 最新价格信号是据报道寻求最高 30 亿美元的融资过程，而不是有清晰条款、公开记录的已完成交割。
        - 只有在核实领投方、估值和优先股堆叠后，判断才会改善。
      - - 反论：商业透明度缺口
        - 独立来源称定价未公开或未核实，且销售仍通过企业销售渠道进行。
        - 只有在定价架构、合同期限和回本数据得到一致披露后，判断才会改善。
    notes: 这些论点总结保留来源支持和不支持的内容，不能替代对合同或股权结构表条款的一级尽调。
