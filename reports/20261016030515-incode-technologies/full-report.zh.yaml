  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              Incode 将身份基础设施卖给受监管且暴露于欺诈的工作流，因此隐私、可用性、模型治理或集成失败都可能中断客户开户并造成法律或声誉成本。证据支持一些真实缓解措施：Incode
              列出广泛认证，招聘要求包含事故指挥和受监管账户控制，TrustGraph
              的设计避免建立集中式客户数据池。这些措施能降低但不能消除风险。公开记录没有公司特定的事故频率、认证范围、诉讼状态、客户集中度或经审计的财务韧性。因此，热力图将隐私与模型治理、一级运营韧性和资本纪律排在一般产品执行风险之上。
