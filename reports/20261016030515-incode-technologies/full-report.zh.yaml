      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              估值判断取决于价格，不是泛泛的质量背书。公开来源支持这样的看法：Incode
              已在受监管身份验证领域建立真实企业相关性，公司控制的材料声称覆盖头部银行并完成数十亿次信任检查，产品叙事也通过并购和持续信任定位扩大。因此，公司仍具备投资价值。


              更难的问题是价格。最近一次完整披露的锚点是 2021 年 B 轮 $1.25B 估值。相比之下，最新独立报道的融资背景只是 2025 年一轮寻求 $150M-$300M、最高 $3B
              估值的流程。没有公开确认融资已交割，也没有披露优先股堆叠、经验证的当前价目表或单位经济资料包；基于公开证据，正确做法是跟踪该资产，而不是今天就把传闻中的估值上调纳入投资判断。
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV011
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: 融资背景与情景框架
        blocks:
          - type: paragraph
            body: >-
              乐观情景有其道理。Incode 定位为服务银行、金融科技、政府机构及其他受监管买方的全栈自研身份平台；近期公司材料强调广泛交易规模、35
              个以上自研模型，以及用于扩大反欺诈、文件和隐私技术栈的并购。Biometric Update 还报道，有消息人士称公司在讨论 2025 年融资时 ARR 最高达
              $170M。若这些经济数据干净且可重复，溢价定价就有依据。


              基准和悲观情景更受限制，因为公开投资判断输入仍然很少。2021 年融资也提到收入同比增长 6
              倍，但独立来源仍称定价未公布或未验证，公开记录也没有披露利润率、留存、客户集中度或传闻新融资的交割条款。因此，公开证据最强的情景框架是相对而非精确：只有尽调验证经济性后，乐观情景才接近市场传闻价格；基准情景介于最近披露估值和传闻价格之间；若融资重新定价或停滞，悲观情景则回到或低于最近公开基准。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV012
              - CV013
      - number: '8.3'
        title: 尽调门槛与退出逻辑
        blocks:
          - type: paragraph
            body: >-
              不从跟踪转为买入的主要原因不是缺乏产品证明，而是缺乏估值证明。独立评估明确指出定价透明度弱，没有经验证的价目表，也没有除长期企业合同之外、说明客户付费水平的清晰公开基准。同一评估还指出模型文档、漂移监控和申诉机制披露不足；这很重要，因为溢价倍数通常不仅假设品类强势，也假设执行和治理意外风险较低。


              更建设性的下一步，是把 Incode 视为只有在尽调补上披露缺口后才可能享有溢价的资产。门槛事项很清楚：确认 2025
              年融资是否真正交割及条款，取得按客户群衡量的毛利率、留存、消耗率和集中度等经济数据，并判断当前扩大范围的叙事能否转化为成长股权买家或战略收购方更清晰的退出选项。在这些信息可得前，退出准备度只是战略可能性，而不是已计入价格的事实。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: 证据摘录
        blocks:
          - type: callout
            title: 公开证据仍支持保持耐心
            body: 将 Incode 作为高质量身份资产跟踪，但在交割条款、定价架构和增长质量数据得到验证前，不要把传闻中的估值上调纳入投资判断。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV012
              - CV013
              - CV014
