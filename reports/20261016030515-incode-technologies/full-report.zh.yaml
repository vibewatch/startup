        - 公开资料重点强调活体检测、人脸识别、文件分析和深度伪造检测
        - 直接竞品具备相关能力，但指定资料池未对相对深度做基准比较
        - 指定资料池没有将其定位为生物识别优先
        - 除非机构自建专业工具，否则通常较弱
      - - 自动化模式
        - 公开定位为全自动 / 零人工介入
        - 不一；至少部分竞品明确提供人工审核或混合工作流
        - 服务驱动的验证和 L1 审核属于其卖点
        - 默认需要大量人工和例外处理
      - - 数据保管方式
        - 公司称部分部署可以把敏感数据保留在设备上，但批评者仍将该模式描述为集中式生物识别数据保管
        - 通常被描述为集中式厂商云或传统托管技术栈
        - 客户持有密钥加分散式存储是核心差异化
        - 客户可以保留数据控制权，但也必须自行承担控制措施和运营负担
      - - 受监管企业分销能力
        - 公开资料显示其重点面向银行、政府和电信，并推进 FedRAMP
        - 老牌竞品也面向受监管买方，但指定资料池中的同等证据更薄弱
        - 主要适用于隐私要求占主导的场景
        - 取决于买方自身的合规团队和厂商技术栈
      - - 实施与支持
        - 评测称，接入后上线顺畅，支持响应也很强
        - 指定资料池没有提供各竞品可比的实施细节
        - 迁移叙事是销售卖点的一部分
        - 定制灵活，但速度更慢、运营负担更重
      - - 商业透明度
        - 没有公开定价；评测者认为小团队成本高
        - 指定资料池未保留标准化的公开价格比较
        - 据称按用量计费且无最低消费
        - 内部成本藏在人员、审核队列和工程时间中
    notes: 在指定资料池缺少中立证据的情况下，标为薄弱或未知的单元格有意保持不可比；本表讨论决策标准，不对产品做无依据排名。
