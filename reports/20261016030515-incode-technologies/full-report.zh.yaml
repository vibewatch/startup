    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 2025 年融资接近报道的上限完成，ARR 规模真实可靠，且收购带动交叉销售和政府客户拓展。
        - 只有在尽调验证了软件公司级别的溢价经济性和清晰条款后，才按接近报道的最高 $3B 要价进行投资判断。
        - 集成复杂度、公共部门周期过长，以及深度伪造竞争加剧。
        - 领投方、交割公告、cohort 数据和利润率证据彼此吻合。
      - - 基准
        - 业务继续复合增长，但公开证据仍主要受公司控制，经济性披露也不完整。
        - 在增长质量和结构得到核实前，优先考虑在上次披露的 12.5 亿美元估值与传闻中的 30 亿美元要价之间入场。
        - 融资轮可能低于 headline 估值完成，或附带保护投资人的优先权。
        - 经济性尽调结果不一，但产品牵引力仍在。
      - - 悲观
        - 融资延期、重新定价，或附带较重的优先权，同时透明度缺口持续存在。
        - 由于公开记录不足以支撑溢价，估值支撑回落至上次披露的 12.5 亿美元基准附近或以下。
        - 定价能力不透明、留存不清晰，以及治理意外风险。
        - 没有交割确认、增长信号转弱，或出现不利的监管 / 客户证据。
    notes: 情景逻辑是序数式、以基准为锚；指定证据池没有经核实的公开可比公司集合，也没有足够的经审计财务数据来建立精确模型。
