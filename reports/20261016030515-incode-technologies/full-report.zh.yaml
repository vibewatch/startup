  - id: FM001
    title: 从广泛身份触达到核心受监管买方渗透：受证据约束的市场视角
    type: pyramid
    summary: 这些层级组合的是异质的范围、吞吐量和渗透率代理指标，而不是一套可相加的 TAM。
    data:
      items:
        - label: 全球证件覆盖
          value: 190+ countries
          note: 衡量 Incode 能多广泛支持开户 / 入驻的产品范围代理指标
        - label: 数字身份与 eID 支持
          value: 30+ schemes
          note: 公共部门和跨境钱包兼容性视角
        - label: 身份图谱
          value: 400M profiles
          note: 装机基础信号，而非年度需求
        - label: 平台吞吐量
          value: 7.1B+ trust checks
          note: 公司自定义的数量指标，不代表支出
        - label: 美国银行渗透率
          value: 8 of top 10
          note: 高合规要求企业细分市场的牵引力
        - label: 美国电信渗透率
          value: 8 of top 9
          note: 核心银行业务之外、相邻受监管企业的采用情况
    approximationNotes: 这些数值有意设置为不可相加、不可比较；金字塔将广泛范围和装机基础信号置于更窄的企业渗透信号之上，不应解读为转化漏斗或市场份额模型。
    claimRefs:
      - CM008
      - CM009
      - CM011
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 指定公开证据中呈现的主要替代方案类别的序数定位图。
    data:
      xAxis:
        label: 自动化 / 平台广度（序数）
        min: 1
        max: 5
        low: 手工或窄点解决方案
        high: 全自动、广泛的 IDV 栈
        description: Estimated from retained product descriptions, buyer reviews, and vendor/comparison pages.
        scale: ordinal
      yAxis:
        label: 客户对数据 / 审核路径的控制力（序数）
        min: 1
        max: 5
        low: 厂商管理且集中式
        high: 客户持有、分散式或高度依赖人工控制
        description: Estimated from retained sources; not an audited benchmark.
        scale: ordinal
      points:
        - label: Incode
          x: 5
          'y': 2
          note: 集成生物识别与编排使其自动化广度较高；但客户控制力较低，因为批评者仍将该模式描述为集中式托管。
        - label: Jumio / 直接竞争的成熟套件
          x: 4
          'y': 1
          note: Gartner、Zyphe 和 Growth Engineer 的证据中出现了直接的生物识别 / 证件竞争者，但指定证据池不足以支持比集中式成熟套件更强的差异化判断。
        - label: Onfido / Entrust 混合工作流套件
          x: 3
          'y': 3
          note: 由于明确支持可选人工审核，其自动化程度低于 Incode；但在例外场景下更有利于客户控制。
        - label: Sumsub 式广泛合规套件
          x: 3
          'y': 1
          note: 广泛的 KYC/KYB/AML 覆盖是其吸引力所在，但 Zyphe 仍将该模式归类为集中式厂商云。
        - label: Zyphe / 隐私优先挑战者
          x: 2
          'y': 5
          note: 依靠分散式存储、客户持有的密钥和可复用凭证竞争，而不是追求最大化的集中式自动化。
        - label: 内部 / 人工审核现状
          x: 1
          'y': 5
          note: 平台广度最低，但对例外处理、删除义务和审核政策拥有最高的直接控制力。
    approximationNotes: 分数是根据保留的定性证据综合得出的序数估计，反映定位逻辑，不代表经过基准测试的产品表现。
    claimRefs:
      - CP006
      - CP007
      - CP011
      - CP012
      - CP014
      - CP015
      - CP016
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据显示，企业收入可能从受监管验证需求延伸到定制合同；随着 Incode 扩大规模、产品和政府覆盖，资本需求也在上升。
    data:
      nodes:
        - id: demand
          label: 受监管身份需求
          detail: 银行、金融科技公司、电信商、平台和政府买方使用 Incode 完成入驻、认证和反欺诈工作流。
        - id: activity
          label: 验证量
          detail: 公司公开口径称 2024 年完成 41 亿次验证，截至 2026 年 3 月完成超过 71 亿次信任检查。
        - id: contracts
          label: 定制企业合同
          detail: 公开定价未发布；独立资料将其描述为协商确定、与绩效挂钩的多年协议。
        - id: recurring
          label: 经常性平台收入
          detail: Multiples 将该模式标为订阅制，Biometric Update 则援引未具名的 Bloomberg 消息源，报道称 ARR 为 $170M。
        - id: service-costs
          label: 交付经济性
          detail: 自动化和自研模型可以降低人工审核的劳动强度，但公开来源没有量化毛利率或回本周期。
        - id: reinvestment
          label: 再投资与融资需求
          detail: 据报道，2025 年融资过程和 2026 年投入 $100M 建设隐私基础设施，显示资本需求仍将持续。
      edges:
        - from: demand
          to: activity
          label: 驱动
        - from: activity
          to: contracts
          label: 转化路径
        - from: contracts
          to: recurring
          label: 变现为
        - from: recurring
          to: service-costs
          label: 受……约束
        - from: service-costs
          to: reinvestment
          label: 提供依据
    approximationNotes: 这是一条方向性而非定量的流转路径，因为公开来源披露了活动规模和融资信号，却没有披露实际价格、毛利率或单次检查收入。
    claimRefs:
      - CI001
      - CI004
      - CI006
      - CI011
      - CI015
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据显示，这是一套分层身份栈，从采集和编排延伸到模型、登记库与保障控制。
    data:
      layers:
        - label: 客户渠道
          detail: Web、移动端、自助终端和网点界面采集证件、人脸自拍和设备输入。
          outputs:
            - label: Hosted link / Web SDK / mobile SDK flows
            - label: Omnichannel capture inputs
        - label: 集成界面
          detail: REST API 和 SDK 将产品嵌入客户的入驻与认证旅程。
          modules:
            - label: REST API
            - label: iOS / Android / Web SDK 开发包
        - label: 工作流与决策
          detail: 编排工具负责路由、分析、案件处理和可配置的验证流程。
          modules:
            - label: Workflow Builder
            - label: Decisioning & Results
            - label: Fraud Analytics / Case Management
        - label: 核心验证模型
          detail: 自研模型层覆盖人脸匹配、被动活体检测、深度伪造检测和证件分析。
          modules:
            - label: 人脸匹配
            - label: 被动活体检测
            - label: 深度伪造 / 证件检查
        - label: 外部数据与网络智能
          detail: 政府、征信机构和被收购网络连接器将身份验证延伸到纯图像检查之外。
          modules:
            - label: GovDataMatch / AAMVA
            - label: eKYC 来源和 MetaMap 登记库
            - label: Identiq 隐私保护信号
        - label: 保障与合规
          detail: 恢复目标、信任中心认证和 FedRAMP 就绪度为受监管买方包裹整套架构。
          outputs:
            - label: Trust-center controls
            - label: FedRAMP Ready path
    approximationNotes: 这套架构是根据保留的公开来源综合出的运营模型，并非厂商编写的系统蓝图。
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE007
      - CE014
      - CE015
  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: 可观察的旅程从企业资格评估和集成，推进到终端用户验证及相邻工作流扩张；但续约和客户集中度仍不可见。
    data:
      items:
        - label: 确认企业需求
          detail: 受监管或暴露于欺诈风险的买方识别出 KYC、认证、年龄或身份验证需求。
          touchpoints:
            - 反欺诈、合规、数字产品和代理采购团队
            - 银行、金融科技公司、电信商、平台、代理机构和酒店运营商
        - label: 配置工作流
          detail: 买方通过 REST API、SDK、连接器，或无代码 / 低代码工作流工具完成集成。
          touchpoints:
            - Web、移动端、自助终端和网点界面
            - 证件、生物识别、活体检测和决策模块
        - label: 录入终端用户
          detail: 申请人、公民、宾客、订阅用户或平台参与者完成选定的身份流程。
          touchpoints:
            - 证件和人脸自拍采集
            - 面向隐私敏感检查的设备端年龄估计
        - label: 生成身份决策
          detail: 自动检查返回入驻、认证或支付验证结果。
          touchpoints:
            - 公司称 KYC 检查平均耗时约 4 秒
            - 没有公开分布或客户级分母
        - label: 扩展使用场景
          detail: 客户可以增加渠道、模块、地域，或增加相邻的重新认证和反欺诈工作流。
          touchpoints:
            - 公共部门与政府生物识别机会
            - 可复用工作流工具和多渠道 SDK 覆盖
        - label: 测试持久性
          detail: 续约、扩张收入和客户集中度决定部署广度能否转化为持久的经济性。
          touchpoints:
            - NRR、GRR、流失率、续约率和头部客户占比均未披露
            - 指名客户背书不能证明留存具有代表性
    approximationNotes: 这是根据已记录的客户细分、集成界面和公开使用场景推断的概念性顺序，不代表已披露的转化率、阶段规模、合同期限或续约结果。
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU015
      - CU016
