            body: >-
              公开记录显示公司已具备一定规模，但主要来自运营代理指标，而非经审计财务报表。Incode 称 2021 年 12 月 B 轮前十二个月收入增长 6 倍，随后称 2024 年完成 41 亿次身份验证，并在 2026
              年 3 月称已处理超过 71 亿次信任检查。Biometric Update 引述 Bloomberg 报道，ARR 为 $170M，2025 年 11 月融资目标为 $150M-$300M、估值最高
              $3B。完整融资时间轴见公司概览；从财务角度看，关键含义是 Incode 似乎已有真实企业规模，但在公开披露盈利能力前，仍可能在为扩张、并购和政府市场进入融资。
