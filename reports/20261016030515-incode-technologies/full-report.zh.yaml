      - number: '3.3'
        title: 护城河韧性：规模、分销与信任姿态
        blocks:
          - type: paragraph
            body: >-
              当采购看重企业客户背书、政府准备度和规模时，Incode 的护城河最强。Biometric Update 引述 Bloomberg 称，公司融资估值最高 $3B、ARR 约
              $170M，并具备大型银行和电信客户渗透及推进 FedRAMP
              的动向。这些信号重要，因为市场不只是功能比较；分销、合规姿态和实施可信度决定买方信任哪份候选名单。但护城河并非普适：隐私优先挑战者直接攻击集中式生物特征托管，偏人工审核的同行则吸引需要人工升级或更灵活异常处理的买家。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP014
      - number: '3.4'
        title: 未决问题与被替代风险
        blocks:
          - type: paragraph
            body: >-
              主要尽调问题不是找出替代方案，而是证明 Incode 何时在经济或运营上胜出。现有证据没有可比的公开交易定价、同行误接受与误拒绝的共同基准，也没有覆盖 MetaMap、AuthenticID 和 Identiq
              在统一商业动作下整合情况的中立证据。因此，买方应把公开比较当作筛选信号，再用真实流量对比测试完成率、人工审核负担、隐私要求及删除/数据托管义务，之后才判断护城河是否足以纳入投资判断。
            claimRefs:
              - CP008
              - CP011
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 证据摘录
        blocks:
          - type: callout
            title: 竞争集合正在分化，而非收敛
            body: Incode 面临的最强竞争分成企业自动化套件与隐私优先或人工审核替代方案两类，因此多数竞标不会仅由功能对等决定。
            calloutType: insight
            claimRefs:
              - CP004
              - CP006
              - CP012
              - CP014
          - type: callout
            title: 公开比较低估了采购摩擦
            body: 指定证据支持强自动化叙事，却没有中立的价格对等或共同误报基准；买方仍需进行真实流量对比测试，才能判断护城河和利润率韧性。
            calloutType: risk
            claimRefs:
              - CP008
              - CP013
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现信号
        blocks:
          - type: paragraph
            body: >-
              尽管定价披露很少，公开证据仍支持一个直观的收入模式。Multiples 将 Incode 定义为订阅模式，独立简介也持续把它放在银行、金融科技、电信、市场平台和政府客户的企业身份工作流中，而不是自助式 SMB
              软件。其变现更像与大型合规和反欺诈预算绑定的协商式平台收入，而非消费或纯按用量结算。目录价仍未公布；独立简介称合同为定制报价、与业绩挂钩且多年期，这支持经常性收入潜力，但实际价格、折扣和模块附加率仍未验证。
