      - number: '4.3'
        title: 财务判断与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              乐观情景是，Incode
              的产品广度、客户渗透和验证量足以支撑可观的经常性收入基础，而自动化和自研模型栈的经济性应优于高人工审核模式。悲观情景是，几乎所有可用于投资判断的指标仍需管理层提供：公开信息没有毛利率、CAC、回收期、消耗率、现金
              runway、留存、集中度或按垂直行业划分的实际定价。近期融资信号和公司自有的 $100M 基础设施投入因此成为核心财务风险。在这些私有指标公开前，正确判断应是商业上可信，但效率和资本充足度尚不足以纳入投资判断。
