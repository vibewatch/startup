chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Incode 当前的官方定位宽泛但一致：它把自己描述为身份平台，覆盖个人、企业以及日益增多的 AI
              代理验证，并在核心能力外包裹合规和反欺诈工具。从官网、关于页面及第三方供应商简介来看，一条清晰主线是：面向银行、金融科技、电信、市场平台和政府相关场景销售端到端生物识别身份层，而非单一的点解决方案。基于现有证据，最稳妥的阶段判断是后期私有公司、B
              轮之后；公司仍在扩大产品范围和并购版图，同时保持私募融资路径，没有披露上市公司式的运营细节。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO015
      - number: '1.2'
        title: 领导层、创始人依赖与治理透明度
        blocks:
          - type: paragraph
            body: >-
              公开领导层信息以创始人为中心。官网关于页面明确以 Ricardo Amper 为核心；本组证据中最完整的第三方创始人名单来自 GrowthEngineer，列出另外三位分别负责生物识别、AI
              和财务的联合创始人。这足以支持“职能覆盖与创始人市场匹配度较好”的判断，但不足以精确描述董事会监督。现有来源没有公开董事会名单、委员会架构或决策权图谱；本组最谨慎的独立简介还明确批评公司披露的监督模式不够具体。在管理层、董事会及申诉/治理流程得到一手材料记录前，尽调应将公司视为高度依赖创始人叙事和执行。
