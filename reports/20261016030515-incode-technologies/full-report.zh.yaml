      - number: '3.2'
        title: 能力、定价与工作流取舍
        blocks:
          - type: paragraph
            body: >-
              Incode
              最强的差异化是广度加自动化。官方和第三方简介称，其技术栈结合面部识别、活体检测、文件分析、深度伪造检测和编排能力，近期并购又扩大了平台。这个定位最适合与集中式企业套件比较，因为买方看重速度、监管覆盖和单一供应商关系。但竞争压力也很明确：评测者认为小规模部署价格偏高、初次设置可能较难；一些替代方案则主打可选人工审核、灵活工作流或服务驱动运营，而非默认零人工环节。
            claimRefs:
