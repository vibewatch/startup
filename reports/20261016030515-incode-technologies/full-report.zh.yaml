figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 官方里程碑显示，公司从成立到多次获得外部认可，再到由收购驱动的扩张，路径较为稳定；但后期融资问题仍未解决。
    data:
      items:
        - date: '2015-06-17'
          label: 在旧金山成立
          detail: Ricardo Amper 在旧金山创立了 Incode。
          tone: positive
        - year: '2017'
          label: 首次推出生物识别认证
          detail: 公司称其推出了首个 AI 驱动的生物识别认证方案。
          tone: positive
        - year: '2019'
          label: 首次通过被动活体检测里程碑
          detail: Incode 称其成为首家通过 iBeta Level 1 被动活体检测认证的公司。
          tone: positive
        - year: '2021'
          label: Series B 后成为独角兽
          detail: 关于页面将独角兽地位和 12.5 亿美元估值归因于 Series B 轮。
          tone: positive
        - year: '2022'
          label: Level 2 测试与防欺骗能力提升
          detail: 官方历史称 Incode 开发了先进的 3D 面具检测能力，提升了对 2D 攻击的抵抗力，并通过了 iBeta Level 2 测试。
          tone: positive
        - year: '2024'
          label: 收购 MetaMap 并获 Gartner 认可
          detail: 官方历史称 Incode 被评为 Gartner 身份验证魔力象限首届报告的领导者，并完成了对 MetaMap 的首次收购。
          tone: positive
        - year: '2025'
          label: 收购 AuthenticID，并据报道启动新一轮融资
          detail: 官方历史称 Incode 完成了对 AuthenticID 的第二次收购；Biometric Update 随后报道称公司正在寻求新一轮融资。
          tone: warning
        - year: '2026'
          label: 收购 Identiq、承诺隐私建设并获 Prism 认可
          detail: 官方材料称公司完成了对 Identiq 的第三次收购，承诺投入 $100M 建设隐私基础设施，并因完成超过 70 亿次身份信任检查获得 Prism 认可。
          tone: positive
