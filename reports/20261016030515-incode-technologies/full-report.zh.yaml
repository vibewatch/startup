  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              指定证据将 Incode
              放在更广义的身份验证与信任基础设施市场，而不是狭窄的文件检查组件类别中。官方及第三方摘要都将公司描述为把文件验证、生物识别、被动活体检测、政府记录核验、KYC、KYB、年龄保障以及较新的数字身份或代理身份流程结合起来。这个边界很重要：买家购买的不是单点
              API，而是用于受监管开户、认证和反欺诈流程的控制层。同一批来源也界定了市场边界之外的部分：交易监控、通用 IAM 套件和无关的支付欺诈工具属于相邻控制，但不属于同一支出池。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM004
              - CM006
      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方证据在受监管企业领域最强：欺诈、误拒或合规失败的成本足够高，值得采用重编排的身份控制。公开描述反复提到银行、信用合作社、数字银行、金融科技、政府机构、市场平台、电信和部分酒店流程。日常用户大概率是开户、反欺诈或信任与安全团队；付款方则多为风险、合规、数字渠道或身份安全预算负责人。采用往往始于团队希望降低放弃率、又不重新放大欺诈损失：官方产品页面强调与政府权威记录系统直接集成、可配置工作流和全渠道部署；第三方来源称其定价按结果计费，通常采用企业合同而非自助服务。
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM012
              - CM014
      - number: '2.3'
        title: 受证据约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              指定证据中没有来源发布 Incode 精确品类的独立、按支出计算的 TAM 或 CAGR，因此最稳妥的做法是保留几个更窄的视角。第一是存量渗透率：官方材料和 2026 年 9 月的简介称，Incode
              服务美国前十大银行中的 8 家、美国前九大电信商中的 8 家、全球前三大数字银行以及全球前五大市场平台中的 4 家。第二是处理量：公司控制的来源称平台已完成 7.1B+ 次信任检查并持有 400M
              个身份档案；独立第三方摘要则引用 4.1B+ 的年身份检查量，说明规模很大，但分母和时间口径不同。第三是收入：Biometric Update 引述 Bloomberg 报道，2025 年末 ARR 为
              $170M，并考虑以最高 $3B 估值融资 $150M-$300M。这些视角共同支持一个较大的受监管企业机会，但不能替代独立的市场支出基准。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM008
              - CM009
              - CM011
      - number: '2.4'
        title: 增长驱动、采用约束与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              现有证据指向三个需求驱动：深度伪造和合成身份压力上升、监管密集型开户与重新认证流程，以及相较人工审核或传统集中式系统降低摩擦的需求。Incode
              自己反复强调，自动化、隐私保护型生物识别和政府记录连接可以在保持合规的同时提升转化率。证据也显示了采用阻力：隐私法碎片化、数据驻留要求、可解释性和监督问题在身份领域比轻量反欺诈工具更关键；定价不透明和长期企业合同也让低交易量或低合规需求买家不太匹配。最大尽调缺口是结构性的：没有独立支出基准、分部赢单率或透明价格区间，本章可以说明
              Incode 的牵引力，却不能有依据地将其转化为精确 TAM、SAM 或 SOM。
            claimRefs:
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: 证据摘录
        blocks:
          - type: callout
            title: 渗透率证据强于 TAM 证据
            body: 现有证据能有力说明谁在购买 Incode 以及原因，但无法支持一个干净的外部市场规模数字。渗透率、处理量和收入代理指标可以使用；精确的按支出计算 TAM 仍不可得。
            calloutType: insight
            claimRefs:
              - CM008
              - CM010
              - CM015
          - type: callout
            title: 企业适配带来更窄的实际市场
            body: 公开定价不透明、长期合同以及隐私和数据驻留复杂度意味着，可信的近期市场是受监管企业身份验证，而不是 SMB 验证需求的整个长尾。
            calloutType: risk
            claimRefs:
              - CM001
              - CM005
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接套件、相邻方案与替代品
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Incode 的买方不会只评估一种竞争者。Gartner 提到 Jumio、Sumsub、Facephi/Digital Onboarding 和 LexisNexis IDVerse；Growth
              Engineer 还列出 HyperVerge、Meelo、Merkle Science 和 Microblink 等相邻供应商。Zyphe
              的竞品比较则强调隐私优先架构与集中式供应商云的差异。因此，真实竞争格局包括直接生物识别 IDV 套件、相邻文件/反欺诈工具、隐私优先挑战者，以及内部人工审核这一现状替代方案。
            claimRefs:
              - CP004
