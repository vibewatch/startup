  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开证据支持其战略相关性，但不足以对传闻中的 2025 年估值跃升形成有把握的投资判断。
    data:
      nodes:
        - id: proof
          label: 产品与市场验证
          note: 面向受监管买方的企业身份平台。
        - id: traction
          label: 商业牵引力口径
          note: 头部银行渗透率和 7B+ 次信任检查显示出规模。
        - id: last-round
          label: 上次完成融资的估值锚点
          note: 2021 年 2.2 亿美元 Series B，估值 12.5 亿美元。
        - id: current-process
          label: 当前融资背景
          note: 据报道，2025 年融资过程寻求 $150M 至 $300M，估值最高 $3B。
        - id: gaps
          label: 缺失的投资判断输入
          note: 没有公开交割确认、优先权、价目表或核心经济性资料包。
          tone: risk
        - id: recommendation
          label: 建议
          note: 继续跟踪并深化尽调；只有当价格和增长质量风险下降时才推进。
      edges:
        - from: proof
          to: traction
          label: 解释相关性
        - from: traction
          to: last-round
          label: 支持资本为何可用
        - from: last-round
          to: current-process
          label: 说明估值跃升
        - from: current-process
          to: gaps
          label: 仍需核实
        - from: gaps
          to: recommendation
          label: 保持较高的入场纪律
    approximationNotes: 这条流转路径是定性的，不代表节点之间存在建模的转化率。
    claimRefs:
      - CV001
      - CV002
      - CV009
      - CV012
      - CV013
      - CV014
