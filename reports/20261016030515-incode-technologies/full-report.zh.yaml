companyProfile:
  summary: >-
    Incode Technologies 是一家面向受监管企业 B2C
    流程的私有身份验证与认证平台供应商。公司将生物识别验证、文件分析、活体检测、工作流编排和合规控制结合起来，服务银行、金融科技、电信、市场平台、酒店及政府客户。公开证据支持其已具备一定规模且平台仍在扩张，但公司仍未披露经审计的财务细节、客户集中度和当前融资条款。
  foundedDate: '2015-06-17'
  founders:
    - name: Ricardo Amper
      role: 创始人兼 CEO
      background: 公司创始人和公开代表；主导企业身份验证叙事。
    - name: Jovan Jovanović
      role: 联合创始人
      background: 早期技术贡献者，负责生物识别和身份系统相关工作。
    - name: Alex Golunov
      role: 联合创始人
      background: 早期技术贡献者，负责面部识别和 AI 相关工作。
    - name: Mariana Amper
      role: 联合创始人
      background: 早期贡献者，负责财务和运营支持。
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: 企业身份验证与认证平台，具备生物识别、文件采集、活体检测、工作流编排和欺诈防范能力。
  customerFocus: 银行、金融科技、电信、市场平台、酒店和政府领域的受监管企业 B2C 流程。
  businessModel: 企业订阅和协商式平台合同。
  stage: Late-stage private (Series B / pre-Series C)
  fundingStatus: 2021 年完成 $1.25B 的 B 轮融资；据报道，2025 年末的融资流程寻求最高 $3B，但交易是否完成及其条款尚未公开确认。
