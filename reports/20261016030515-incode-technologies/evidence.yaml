evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-fundraising
    missingEvidence: >-
      Signed financing documents or management-confirmed disclosure showing whether the reported $150M-$300M round
      closed, at what valuation, and with which investors.
    whyItMatters: >-
      Current valuation and capital availability materially affect the refresh view on momentum, downside protection,
      and pricing discipline.
    diligencePath: Request the latest financing deck, cap table, and executed term documents from management.
    relatedQuestionRefs:
      - QO003
      - QO007
  - type: missing-source
    severity: material
    topic: governance-visibility
    missingEvidence: >-
      Board roster, committee structure, independent-director mix, and documented appeals or manual-review governance
      for declined identity decisions.
    whyItMatters: >-
      Founder concentration and opaque oversight increase execution and compliance risk in a business making identity
      decisions for regulated customers.
    diligencePath: >-
      Request board materials, governance docs, and product-governance process documentation tied to human review and
      appeals.
    relatedQuestionRefs:
      - QO002
      - QO006
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: disclosure-gaps
    missingEvidence: Audited revenue, gross margin, NRR, burn, runway, customer count, customer concentration, and current headcount.
    whyItMatters: >-
      The company has strong narrative scale signals, but investment judgment still depends on quality of revenue,
      retention, and operating leverage.
    diligencePath: Obtain audited financial statements, KPI reporting packs, and customer cohort analysis.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: footprint
    missingEvidence: >-
      A current authoritative office and workforce footprint that reconciles older secondary listings with the current
      official site.
    whyItMatters: >-
      Geographic scale informs customer support capacity, integration coverage, and post-acquisition operating
      complexity.
    diligencePath: Request an updated office list, regional headcount, and post-acquisition integration map.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      An independent market report or public-company disclosure that quantifies identity-verification or
      trust-infrastructure spend for Incode's core regulated-enterprise segment.
    whyItMatters: >-
      Without a spend-based benchmark, the chapter can show traction and scale proxies but cannot defend a precise TAM,
      SAM, SOM, or CAGR.
    diligencePath: >-
      Obtain a current Gartner, Forrester, IDC, or public-company category disclosure that breaks out
      identity-verification spend by buyer segment and geography.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-fit
    missingEvidence: >-
      Contract-level pricing bands, billing logic for successful versus failed verifications, and segment-level
      conversion or win-rate data.
    whyItMatters: >-
      These inputs determine which buyers can economically adopt the platform and whether public penetration can expand
      into adjacent segments.
    diligencePath: >-
      Request customer references, pricing schedules, and cohort-level sales or onboarding metrics from the company
      during diligence.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: scale
    missingEvidence: >-
      A reconciled definition of trust checks, annual identity checks, and identity profiles across Incode's public
      materials and third-party summaries.
    whyItMatters: >-
      Scale is clearly large, but the denominators differ enough that readers should not treat 7.1B+ trust checks and
      4.1B+ annual checks as interchangeable market-size inputs.
    diligencePath: Ask Incode for a metric glossary and time-series definitions before using throughput as a valuation input.
    relatedQuestionRefs:
      - QM004
  - type: missing-source
    severity: material
    topic: pricing-parity
    missingEvidence: >-
      Neutral, current, per-transaction or per-contracted-user pricing across Incode, Jumio, Sumsub, Onfido/Entrust,
      IDVerse, and privacy-first challengers.
    whyItMatters: >-
      Without normalized price evidence, public positioning cannot answer whether Incode's automation breadth earns
      better unit economics or simply a higher enterprise price tag.
    diligencePath: >-
      Request live quotes and redlined pricing schedules for the same traffic profile, geography mix, and fraud workflow
      assumptions from the finalist vendors.
    relatedQuestionRefs:
      - QP004
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: benchmarked-accuracy-and-review-load
    missingEvidence: >-
      A shared benchmark showing false accepts, false rejects, completion rate, and manual-review rate across Incode and
      the named alternatives.
    whyItMatters: >-
      Public marketing and reviews show directionally strong signals, but they do not establish which platform wins
      under the buyer's real document mix, geography mix, and fraud pressure.
    diligencePath: >-
      Run a parallel bakeoff on live traffic with identical pass/fail thresholds and review policies, then compare
      completion, fraud catch, and manual-review burden.
    relatedQuestionRefs:
      - QP002
      - QP006
      - QP009
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: minor
    topic: post-acquisition-platform-convergence
    missingEvidence: >-
      Neutral evidence on how MetaMap, AuthenticID, and Identiq are being sold, integrated, and operationalized under
      one commercial and support motion.
    whyItMatters: >-
      Acquisition breadth may create moat, but it can also create integration drag that shifts implementation risk back
      to the customer.
    diligencePath: >-
      Ask for current product maps, SKU packaging, support ownership, and reference calls from customers running
      multi-product deployments after the acquisitions.
    relatedQuestionRefs:
      - QP008
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, verification cost per check, manual review rate, CAC, and payback by segment.
    whyItMatters: >-
      These metrics determine whether Incode's automation story translates into durable software economics rather than
      expensive enterprise implementation.
    diligencePath: >-
      Request a segment-level unit-economics pack with gross margin, cost-to-serve, CAC, payback, and services burden by
      product family.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, runway, debt obligations, covenant headroom, and the board-approved financing
      plan.
    whyItMatters: >-
      Without capital-adequacy data, investors cannot judge whether current growth and acquisition plans require another
      round on favorable or defensive terms.
    diligencePath: Request the latest monthly cash bridge, debt schedule, fundraising memo, and management's downside runway case.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Net dollar retention, churn, concentration by top account, and realized pricing by vertical and geography.
    whyItMatters: >-
      Revenue quality is the difference between a high-multiple recurring platform and a concentrated enterprise
      business with hidden discounting or renewal risk.
    diligencePath: Request cohort retention, top-customer exposure, and realized-price waterfalls by product and segment.
    relatedQuestionRefs:
      - QI003
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer-signal or practitioner-community proof such as repo activity, package usage, implementation forum
      traffic, or partner engineer commentary for current production adopters.
    whyItMatters: >-
      The chapter brief explicitly asks for technical maturity and dependencies, and the assigned pool does not contain
      a strong proxy for implementer depth or community traction.
    diligencePath: >-
      Request implementation references, changelog access, partner engineer calls, and any public SDK/package telemetry
      that management is willing to share.
    relatedQuestionRefs:
      - QE008
  - type: access-blocked
    severity: material
    topic: federal-compliance
    missingEvidence: >-
      Current FedRAMP boundary artifacts, authorization status, sponsor details, and trust-center documents behind
      access control.
    whyItMatters: >-
      FedRAMP Ready is meaningful, but federal procurement diligence needs proof of the current state, scope, and
      controls rather than a milestone press release alone.
    diligencePath: >-
      Obtain trust-center access, ask for the latest authorization roadmap, and verify system boundary and sponsoring
      agency directly.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: governance-boundaries
    missingEvidence: >-
      Customer-specific model-isolation policy, manual-review / override workflow design, subprocessor list, and
      explicit rules for cross-client learning.
    whyItMatters: >-
      These controls determine whether the product's automation and data moat create operational leverage or hidden
      model-governance and privacy liabilities.
    diligencePath: >-
      Review security/privacy appendices, subprocessor documentation, model-governance policy, and live
      exception-handling playbooks in management diligence.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: hosting-residency
    missingEvidence: >-
      Region-specific hosting architecture, data-residency options, disaster-recovery topology, and jurisdiction-level
      retention/deletion practices.
    whyItMatters: >-
      Regulated identity workloads are often won or lost on locality, residency, and deletion controls rather than on
      raw model accuracy.
    diligencePath: >-
      Ask for architecture diagrams and contractual residency commitments by geography before underwriting
      regulated-enterprise expansion.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: missing-source
    severity: material
    topic: adoption-scale
    missingEvidence: >-
      Active-customer count and a reconciled definition and period for trust checks, identity checks, unique users, and
      repeat usage.
    whyItMatters: >-
      Aggregate checks can grow through repeated activity at a small number of accounts, so they cannot establish
      customer breadth or adoption quality.
    diligencePath: >-
      Request monthly active enterprise accounts, unique verified users, checks per customer, and a metric dictionary
      reconciled to the reported 2024 and 2026 scale figures.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Customer-issued or procurement evidence confirming production status, deployment date, modules, scale, outcomes,
      and current contract status for named references.
    whyItMatters: >-
      Directory placement and vendor descriptions cannot distinguish a pilot, historical relationship, limited
      integration, or scaled production use.
    diligencePath: >-
      Obtain customer-approved references and contracts or purchase orders for a representative bank, telco,
      marketplace, government, and hospitality account, including measured outcomes and renewal status.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-durability-gap
    missingEvidence: >-
      NRR, GRR, logo churn, renewal rates, contract length and termination terms, expansion revenue, top-customer share,
      and revenue mix by vertical and geography.
    whyItMatters: >-
      Without these metrics, broad usage and named references cannot establish durable recurring demand or rule out
      customer and channel concentration.
    diligencePath: >-
      Request audited customer and ARR cohorts for at least eight quarters, with top-10 concentration, renewals,
      downsells, churn, and expansion separated by vertical, geography, channel, and product module.
    relatedQuestionRefs:
      - QU004
      - QU005
      - QU009
      - QU010
  - type: missing-source
    severity: material
    topic: litigation-and-enforcement
    missingEvidence: >-
      Primary court, regulator, and administrative records covering biometric privacy litigation, enforcement, consent,
      retention, and government authorization.
    whyItMatters: >-
      The assigned pool cannot establish either the presence or absence of material legal exposure, and absence of a
      recorded incident is not proof of absence.
    diligencePath: >-
      Search relevant federal and state dockets, regulator databases, and the FedRAMP Marketplace; obtain management's
      claims and enforcement schedule.
    relatedQuestionRefs:
      - QR001
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-resilience
    missingEvidence: >-
      Four quarters of uptime, severity-one incidents, recovery performance, SDK security findings, model drift,
      subgroup error rates, and appeal outcomes.
    whyItMatters: Company-issued job requirements demonstrate control intent but do not verify control effectiveness in production.
    diligencePath: >-
      Review SLA reports, postmortems, failover tests, penetration tests, model cards, bias audits, release logs, and
      customer escalation metrics.
    relatedQuestionRefs:
      - QR002
      - QR005
      - QR008
  - type: private-evidence-only
    severity: material
