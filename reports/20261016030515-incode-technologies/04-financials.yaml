schemaVersion: report-v2
artifact: financials
slug: incode-technologies
runDate: 2026-10-16
company:
  name: Incode Technologies
chapter:
  number: 4
  title: Financials
  summary: >-
    Incode shows public evidence of a real enterprise subscription business with large-scale
    transaction volume, but the revenue-quality and margin picture is still mostly private.
    The best external signal is a late-2025 report of $170 million ARR, while current capital
    adequacy remains hard to underwrite because the company was reportedly fundraising again in
    2025 and separately committed $100 million to privacy infrastructure in 2026 without public
    cash, burn, or runway disclosure.
sections:
  - id: revenue-model-monetization
    title: Revenue model and monetization signals
    body: >-
      Public evidence supports a straightforward top-line model even though pricing disclosure is
      thin. Multiples labels Incode's model as subscription, and independent profiles consistently
      place the company in enterprise identity workflows for banks, fintechs, telecoms,
      marketplaces, and government buyers rather than in self-serve SMB software. That matters
      because the monetization signature looks more like negotiated platform revenue tied to large
      compliance and fraud-prevention budgets than like consumer or usage-only checkout revenue.
      The gap is that list pricing remains unpublished: independent profiles describe custom quote,
      performance-linked, multi-year contracts, which supports recurring revenue potential but
      leaves realized pricing, discounts, and attach rates by module unverified.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-capital-needs
    title: Public traction proxies and capital signals
    body: >-
      The public record shows meaningful scale, but mostly through operating proxies rather than
      audited financial statements. Incode said revenue grew 6x in the twelve months before the
      December 2021 Series B, later said it completed 4.1 billion identity verifications in 2024,
      and by March 2026 said it had processed more than 7.1 billion trust checks. Biometric
      Update, citing Bloomberg, reported $170 million ARR and a November 2025 fundraising process
      targeting $150 million to $300 million at up to a $3 billion valuation. The full round
      chronology belongs in Company Overview; financially, the important implication here is that
      Incode appears to have genuine enterprise scale, but still may be funding expansion,
      acquisitions, and government go-to-market ahead of any publicly disclosed profitability.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: verdict-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The bullish case is that Incode has enough product breadth, customer penetration, and
      verification volume to support a substantial recurring-revenue base, with automation and an
      in-house model stack that should be economically better than labor-heavy review models. The
      bearish case is that almost every underwriting-grade metric still sits behind management
      access: there is no public gross margin, CAC, payback, burn, runway, retention,
      concentration, or realized pricing by vertical. That turns the recent fundraise signal and
      the company's own $100 million infrastructure commitment into the central financial risk.
      Until those private metrics are opened, the right verdict is commercially credible but not
      yet underwritten on efficiency or capital adequacy.
    claimRefs: [CI011, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Enterprise identity onboarding
        - Subscription platform revenue from KYC, document, liveness, and onboarding workflows
        - Customer program / verification volume
        - Core monetization path; subscription model is publicly stated
        - Medium; model is public but realized pricing is not
        - Break out share of revenue from onboarding versus other modules by vertical
      - - Authentication and re-authentication
        - Ongoing identity and trust checks after onboarding
        - Auth flow / trust check
        - Public sources show scale and recurring usage but no revenue split
        - Medium; usage scale is public, economics are not
        - Provide attach rate, pricing basis, and renewal dependence for authentication modules
      - - Government and regulated-sector programs
        - Enterprise and agency deployments requiring high-assurance identity proofing
        - Agency or enterprise contract
        - FedRAMP Ready broadens eligibility, but no contract revenue is disclosed
        - Medium; channel direction is visible, monetization is not
        - Disclose pipeline, contract sizes, procurement cycle, and public-sector concentration
      - - Privacy and fraud-network add-ons
        - Expansion modules enabled by Identiq, MetaMap, and other acquired capabilities
        - Add-on module / bundled platform sale
        - Strategic expansion path; standalone pricing and attach rates undisclosed
        - Low to medium; roadmap visible, monetization still opaque
        - Show attach rate, gross margin, and integration cost of acquired products
    notes: >-
      Public sources support revenue mechanisms and channel direction, but not product-level
      revenue mix, realized pricing, or contribution margin by stream.
    claimRefs: [CI001, CI002, CI008, CI013]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offering / contract lens
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Public list pricing
        - No public list price verified
        - All realized pricing unknown
        - No published tiers, trial path, or public quote benchmarks
        - Growth Engineer; AI FinTech Index
      - - Enterprise contract structure
        - Typically described as performance-linked and multi-year
        - Realized pricing unknown
        - Contract length, minimums, and outcome metrics are not public
        - Growth Engineer
      - - Government / federal motion
        - Security qualification milestone rather than a disclosed pricing sheet
        - Realized pricing unknown
        - FedRAMP Ready does not disclose contract economics or authorization timing
        - Yahoo Finance press release
      - - Acquired platform modules
        - MetaMap / Identiq broaden bundleable scope
        - Realized pricing unknown
        - No public standalone price, upsell rate, or margin by acquired product
        - Incode press release; AI FinTech Index
    notes: >-
      Every row contains a pricing opacity qualifier because the public record shows sales motion
      and packaging direction, not a verified realized price book.
    claimRefs: [CI003, CI004, CI008, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR
        - $170M
        - Medium
        - Best recent external top-line proxy, but attributed to an unnamed Bloomberg source
        - Confirm audited ARR, GAAP revenue, and revenue mix by geography and vertical
      - - Historical growth proxy
        - 6x revenue growth over the 12 months before Dec 2021 Series B
        - Medium
        - Shows historical expansion rate but is too old to underwrite current efficiency
        - Provide annual revenue bridge from 2021 through the latest quarter
      - - Operating scale proxy
        - 4.1B verifications in 2024; >7.1B trust checks by Mar 2026
        - Medium
        - Volume suggests meaningful installed base and data scale, not necessarily monetization quality
        - Show revenue per verification and paid versus unpaid workflow mix
      - - Gross margin
        - null
        - Low
        - Core measure of whether automation actually translates into durable software economics
        - Provide gross margin by major product line and services burden
      - - CAC / payback
        - null
        - Low
        - Needed to judge enterprise GTM efficiency and whether growth is value-accretive
        - Provide sales and marketing spend, new ARR, CAC, and payback by segment
      - - Cash / burn / runway
        - null
        - Low
        - Without these numbers, capital adequacy and next-round timing cannot be underwritten
        - Provide current cash, monthly burn, debt schedule, runway, and board fundraising plan
    notes: >-
      Null values mean the metric is not publicly disclosed in the assigned source pool, not that
      the company lacks the metric internally.
    claimRefs: [CI005, CI006, CI007, CI010, CI011, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence suggests a recurring enterprise revenue bridge from regulated verification
      demand to custom contracts, with capital needs increasing as Incode adds scale, products, and
      government reach.
    data:
      nodes:
        - id: demand
          label: Regulated identity demand
          detail: >-
            Banks, fintechs, telecoms, marketplaces, and government buyers use Incode for
            onboarding, authentication, and fraud prevention workflows.
        - id: activity
          label: Verification volume
          detail: >-
            Public company claims cite 4.1 billion verifications in 2024 and more than 7.1 billion
            trust checks by March 2026.
        - id: contracts
          label: Custom enterprise contracts
          detail: >-
            Public pricing is not posted; independent profiles describe negotiated, performance-linked,
            multi-year agreements.
        - id: recurring
          label: Recurring platform revenue
          detail: >-
            Multiples labels the model as subscription, and Biometric Update reported $170 million ARR
            from unnamed Bloomberg sourcing.
        - id: service-costs
          label: Delivery economics
          detail: >-
            Automation and in-house models can reduce manual-review labor intensity, but public sources
            do not quantify gross margin or payback.
        - id: reinvestment
          label: Reinvestment and financing need
          detail: >-
            A reported 2025 fundraising process and a 2026 $100 million privacy-infrastructure
            commitment point to continued capital demand.
      edges:
        - from: demand
          to: activity
          label: drives
        - from: activity
          to: contracts
          label: converted through
        - from: contracts
          to: recurring
          label: monetized as
        - from: recurring
          to: service-costs
          label: constrained by
        - from: service-costs
          to: reinvestment
          label: informs
    approximationNotes: >-
      This flow is directional rather than quantitative because public sources disclose activity
      scale and financing signals, but not realized price, gross margin, or per-check revenue.
    claimRefs: [CI001, CI004, CI006, CI011, CI015, CI016]
callouts:
  - calloutType: strength
    title: Commercial scale is visible even without audited statements
    body: >-
      Public sources do not give a clean income statement, but the combination of billions of
      verifications, penetration into major U.S. banks and telcos, and a reported $170 million ARR
      indicates Incode is well beyond pilot-stage revenue.
    claimRefs: [CI006, CI007, CI012, CI013]
  - calloutType: risk
    title: Capital adequacy is still the key underwriting blind spot
    body: >-
      The public record shows a fresh fundraising effort and a sizable product-investment
      commitment, but no disclosed cash balance, burn, runway, debt burden, or profitability,
      making financing dependency the chapter's main risk.
    claimRefs: [CI008, CI011, CI014, CI016]
