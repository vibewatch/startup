  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, verification cost per check, manual review rate, CAC, and payback by segment.
      whyItMatters: These metrics determine whether Incode's automation story translates into durable software economics rather than expensive enterprise implementation.
      diligencePath: Request a segment-level unit-economics pack with gross margin, cost-to-serve, CAC, payback, and services burden by product family.
      relatedQuestionRefs: [QI004, QI007]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash balance, monthly burn, runway, debt obligations, covenant headroom, and the board-approved financing plan.
      whyItMatters: Without capital-adequacy data, investors cannot judge whether current growth and acquisition plans require another round on favorable or defensive terms.
      diligencePath: Request the latest monthly cash bridge, debt schedule, fundraising memo, and management's downside runway case.
      relatedQuestionRefs: [QI008]
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: Net dollar retention, churn, concentration by top account, and realized pricing by vertical and geography.
      whyItMatters: Revenue quality is the difference between a high-multiple recurring platform and a concentrated enterprise business with hidden discounting or renewal risk.
      diligencePath: Request cohort retention, top-customer exposure, and realized-price waterfalls by product and segment.
      relatedQuestionRefs: [QI003, QI007]
      relatedTableRefs: [TI001, TI002]
