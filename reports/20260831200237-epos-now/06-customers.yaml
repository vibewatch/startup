- id: expansion-and-risk
  title: Expansion logic is visible, concentration risk is not
  body: 'Epos Now’s public customer journey appears to begin with affordability, operational simplicity, and a practical all-in-one
    POS offer. From there, the merchant can deepen usage into reporting, inventory, payments, loyalty, ecommerce, and finance
    products. Adyen’s partner evidence is especially important because it demonstrates repeat use inside the capital product
    and implies at least some customer willingness to expand beyond the core POS layer. The Canada capital launch adds a geographic
    proof point that expansion is not just conceptual.


    That said, public sources still do not reveal the concentration picture. The fragmented SMB story makes extreme enterprise
    concentration less likely than in many B2B SaaS businesses, but neither top-account dependence nor channel concentration
    can be ruled out from public sources alone. The same goes for renewal quality: the existence of retention roles and broad
    review volume is encouraging, yet it is not a substitute for cohort data.


    The net result is a favorable but incomplete customer verdict: Epos Now clearly has real adoption and reasonable expansion
    avenues, but the investor still needs direct retention, concentration, and unit-economics data before treating that adoption
    as durable cash flow.


    The chapter therefore supports a pragmatic diligence stance. Customer reality is not the problem: there is enough proof
    to conclude Epos Now is used in production by many merchants. The unresolved question is the quality of that installed
    base once renewals, complaints, support cost, and finance-product monetization are measured cohort by cohort.'
