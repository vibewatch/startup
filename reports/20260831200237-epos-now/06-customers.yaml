chapter:
  number: 6
  title: Customers
  summary: Public evidence supports that Epos Now serves a broad SMB merchant base across retail and hospitality with real
    named deployments and large review-platform visibility. The main customer-quality limitation is not proof of existence;
    it is the lack of disclosed churn, retention, concentration, or reconciled active-customer denominators for the core POS
    base.
sections:
- id: segments-and-scale
  title: Customer proof points to a broad SMB merchant footprint
  body: 'The customer evidence is directionally strong on breadth. Epos Now’s official surfaces and success stories span pubs,
    bars, salons, pet stores, cafés, wine sellers, and other small business formats across the UK and North America. That
    mix suggests a fragmented SMB merchant base rather than a narrow single-vertical or enterprise-heavy model. Public contact
    and about pages also support a real operating footprint across the UK, US, Canada, and Australia.


    Scale claims are clearly material but not fully reconciled. Depending on the surface and date, Epos Now and its partners
    cite 80,000+ business locations, 80,000 businesses, 90,000+ businesses, or 100,000 merchants. Those differences are not
    unusual for growth-stage companies that count locations, merchants, and supported businesses differently, but they do
    mean investors should not treat any one number as a clean denominator without management reconciliation.


    Even so, the public record supports the core conclusion that this is not a handful-of-customers story. Epos Now has wide
    merchant exposure.


    The breadth of categories shown in stories and review platforms is important because it supports repeatability across
    merchant formats rather than dependence on one unusual use case. For a POS business, that kind of horizontal SMB spread
    can matter as much as any one large logo.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU021
  - CU029
