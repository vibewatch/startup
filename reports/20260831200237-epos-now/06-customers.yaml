- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: The most supportable public customer path runs from search-led discovery into reporting-led daily use and then
    financial-product expansion.
  data:
    items:
    - label: Discover
      detail: Merchant finds an affordable all-in-one POS through search, sales outreach, or comparison sites.
    - label: Evaluate
      detail: Buyer compares hardware, price, and ease of use against Square, Toast, Lightspeed, or status quo.
    - label: Deploy
      detail: Merchant installs POS, sets catalog, and begins daily checkout and reporting.
    - label: Trust
      detail: If support and operations hold up, the merchant relies on the system for live trade and reporting.
    - label: Expand
      detail: Payments, loyalty, ecommerce, or capital products deepen account value.
