- id: named-proof-and-satisfaction
  title: Named stories and reviews prove adoption, but durability remains mostly inferred
  body: 'The chapter’s strongest direct customer proof comes from official success-story pages and third-party review platforms.
    Success stories for Brucan Pubs, Gonzo’s, Cowpens Coffee and Creamery, and WA Pubs all read like active production use
    rather than abstract logo placement: they describe live hospitality or retail operations, reporting, or growth support.
    Those stories should be read as curated references, not statistical averages, but they do confirm real merchant use cases.


    Broader review sources add scale. Trustpilot, Capterra, Software Advice, GetApp, and FeaturedCustomers all provide substantial
    customer-signal volume, generally pointing to strong aggregate sentiment. That is useful because it widens the evidence
    base beyond company-owned pages. At the same time, adverse review and complaint sources matter just as much. Mobile Transaction,
    Resolver, ComplaintsBoard, BBB, and the Financial Ombudsman all show that support, billing, or contract friction can damage
    trust materially when merchants depend on the system during live trade.


    What remains missing is retention math. Public sources do not disclose GRR, NRR, churn, or core POS cohorts, so durability
    is inferred from proof quality, review volume, and finance-product repeat usage rather than measured directly.'
  claimRefs:
  - CU006
  - CU007
  - CU008
