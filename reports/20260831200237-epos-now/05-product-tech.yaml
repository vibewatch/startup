  - FE002
- id: architecture-and-dependencies
  title: APIs and partners are real, but so is dependency on external providers
  body: 'The clearest hard technical signal is the public developer surface. Epos Now’s developer site confirms a REST API
    and an integration model built to exchange data with third-party applications. That matters strategically even if the
    documentation is introductory rather than deeply operational, because it shows the platform is designed to connect outward.
    ERP Research and official partner materials reinforce the same picture: integrations and channel relationships are part
    of how the product is extended and distributed.


    Partnership announcements also reveal important product dependencies. Adyen underpins payments and embedded-finance layers.
    Duda expands ecommerce connectivity. Factor4 extends gift-card and loyalty functionality. Volcora supports hardware and
    peripheral supply. These are positive signals for breadth, but they also mean the product’s merchant experience depends
    on outside providers remaining reliable, compliant, and well-integrated.


    In other words, Epos Now’s architecture looks commercially modular even if its internal infrastructure is not publicly
    documented in depth.


    That partner-led extensibility is strategically sensible for a company of Epos Now’s scale. It lets the platform widen
    merchant functionality without building every surface fully in-house. But it also means diligence should not stop at feature
    presence. Investors need to know which partners are mission-critical, how quickly incidents are resolved, and how much
    revenue concentration sits behind each relationship.'
  claimRefs:
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE019
  - CE020
  - CE023
