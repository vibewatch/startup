  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-and-sla
    missingEvidence: A public or shared trust centre with uptime history, security certifications, incident-response commitments,
      and service-level terms.
    whyItMatters: The current public record is strong on commercial surfaces but weak on operational assurance for buyers
      who depend on live trading uptime.
    diligencePath: Request status history, SLO/SLA documents, pen-test cadence, and certification scopes.
    relatedQuestionRefs:
    - QE015
    - QE022
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: module-level-adoption
    missingEvidence: Usage, retention, and monetization by module including payments, capital, ecommerce, and loyalty adjacencies.
    whyItMatters: Breadth only creates value if merchants actually adopt and keep the adjacent modules.
    diligencePath: Request product telemetry and gross-profit contribution by module and geography.
    relatedQuestionRefs:
    - QE007
    - QE024
    relatedTableRefs:
    - TE001
    - TE002
  - type: private-evidence-only
    severity: material
    topic: internal-architecture
    missingEvidence: Internal systems architecture, deployment model, observability practices, release cadence, and recovery
      objectives.
    whyItMatters: Public API and partner pages show extensibility, but they do not prove resilience or development discipline.
    diligencePath: Request architecture review, SDLC policies, release logs, and dependency concentration analysis.
    relatedQuestionRefs:
    - QE016
    - QE017
    relatedTableRefs:
    - TE003
    - TE005
