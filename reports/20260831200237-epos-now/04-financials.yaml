- id: capital-adequacy
  title: The HSBC facility improves flexibility but confirms financing dependence
  body: 'The strongest hard financial fact in public view is the June 2026 HSBC UK credit package. Official company communications,
    FinTech Futures, and Companies House filings all align that Epos Now secured up to £90 million consisting of a £55 million
    committed revolving credit facility and a £35 million accordion. That is meaningful because it shows a major bank was
    willing to extend structured credit against the business. It also means the company is still private and using debt as
    a growth-enabling instrument rather than relying on public equity markets.


    But debt is not a substitute for transparency. The facility improves near-term liquidity flexibility and may help fund
    international growth, product expansion, or finance-product scaling. At the same time, it introduces classic credit dependency:
    refinancing risk, potential covenant pressure, and the need for underlying cash generation to justify leverage. Companies
    House charge filings are especially important here because they corroborate real security arrangements rather than leaving
    the story at headline level.


    Investors should therefore read the facility as a positive signal on financing access, not as proof of underlying profitability
    or strong unit economics.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI029
