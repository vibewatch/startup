  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: equity-ownership
    missingEvidence: A current cap table, investor list, board roster, and preference stack.
    whyItMatters: Unicorn status and debt capacity do not reveal control rights, dilution risk, or governance quality.
    diligencePath: Request the latest cap table, board materials, and shareholder agreement summary from management.
    relatedQuestionRefs:
    - QO014
    - QO015
    - QO024
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: A consistent management definition for locations, merchants, customers, and active embedded-finance users.
    whyItMatters: Different public pages alternate between 80,000 locations and 100,000 merchants, which affects scale interpretation.
    diligencePath: Ask management for a metric dictionary and time series tying locations, merchant accounts, and active payment
      users together.
    relatedQuestionRefs:
    - QO018
    - QO025
    relatedTableRefs:
    - TO002
    - TO004
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Audited revenue, margin, cash, and covenant disclosures for the latest period.
    whyItMatters: Overview confidence on scale is high, but financial quality and lender dependence cannot be judged from
      top-line marketing alone.
    diligencePath: Obtain the FY2025 accounts package and lender presentation supporting the June 2026 facility.
    relatedQuestionRefs:
    - QO014
    - QO016
    relatedTableRefs:
    - TO001
