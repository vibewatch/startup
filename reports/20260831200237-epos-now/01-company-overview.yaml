company:
  name: Epos Now
chapter:
  number: 1
  title: Company Overview
  summary: Epos Now is a Norwich-founded private POS and business-management software company that has grown into a global
    SMB merchant platform spanning cloud point of sale, payments, and embedded finance. The public record clearly supports
    its founder-led identity, unicorn status, and June 2026 HSBC facility, but leaves meaningful gaps around audited financials,
    equity ownership, and the exact definition of several scale metrics.
sections:
- id: identity-and-scale
  title: Identity, scope, and present-day footprint
  body: 'Epos Now’s current company story is unusually coherent across its official website, about pages, and partner materials.
    The business presents itself as an AI-powered point-of-sale and embedded-finance platform built for retail, hospitality,
    and other small-to-mid-sized merchants that need more than a standalone cash register. The workflow emphasis matters.
    Epos Now is not just selling software screens; it is selling the operating layer through which merchants process transactions,
    manage stock and staff, run reports, and increasingly access financial products without leaving the platform. That makes
    the company more comparable to a merchant operating system than to a legacy till vendor.


    The strongest official scale markers are geographic and product breadth rather than audited financial disclosure. Current
    company pages say Epos Now serves merchants in more than 70 countries, supports more than 80,000 business locations, and
    integrates with more than 130 apps. The home page also shows distinct go-to-market lanes for retail, hospitality, and
    multi-site enterprise operators, which supports the view that Epos Now has matured beyond a single-country SMB niche.
    The physical-office footprint published on the US About page — Norwich, Orlando, and Australia — reinforces the company’s
    cross-market ambitions, even if legal-entity disclosure remains centered on the UK parent.


    That identity framing also helps reconcile why Epos Now has kept investing in payments and embedded finance. Public official
    and partner sources both show a company trying to own more of the merchant relationship over time, moving from POS software
    and hardware toward payments, capital, accounts, and card products. This chapter therefore treats Epos Now first as a
    merchant workflow platform and only second as a payments story.'
