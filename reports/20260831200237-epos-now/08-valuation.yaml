    sourceRefs:
    - SV002
    - SV001
    confidence: medium
    freshness: recent
    type: company-claimed
    answersQuestionRefs:
    - QV007
  - id: CV004
    statement: That evidence shows status, not fair value.
    topic: valuation-context
    sourceRefs:
    - SV002
    - SV001
    confidence: medium
    freshness: current
    type: company-claimed
    answersQuestionRefs:
    - QV007
  - id: CV005
    statement: The June 2026 HSBC facility shows financing access and lender confidence, but it is debt, not price discovery.
    topic: valuation-context
    sourceRefs:
    - SV001
    - SV003
    confidence: medium
    freshness: recent
    type: company-claimed
    answersQuestionRefs:
    - QV008
  - id: CV006
    statement: The facility therefore modestly strengthens the financing narrative without validating equity valuation directly.
