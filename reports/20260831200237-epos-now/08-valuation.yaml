  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: TV004 comparable valuation normalization
    missingEvidence: A full comp sheet with current EV, revenue, gross margin, growth, and peer-set normalization versus Epos
      Now.
    whyItMatters: Public comps are helpful, but without normalized financial inputs they cannot support committee-grade pricing
      discipline.
    diligencePath: Build a proper comp set from live market data and audited Epos Now metrics.
    relatedQuestionRefs:
    - QV015
    - QV016
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: core-valuation-pack
    missingEvidence: Audited revenue mix, margins, retention, cash burn, runway, and facility covenants.
    whyItMatters: These are the variables that determine whether the unicorn headline is conservative, fair, or too rich.
    diligencePath: Request CFO pack, lender materials, and cohort-level operating metrics before price negotiation.
    relatedQuestionRefs:
    - QV022
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Audit quality, reporting cadence, board governance, and any IPO or strategic-exit preparation artifacts.
    whyItMatters: Exit path quality changes both required return and acceptable entry price for a late-stage private company.
    diligencePath: Review board materials, auditor history, and financial-control maturity.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV005
