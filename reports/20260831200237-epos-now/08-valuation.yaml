- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Real installed base plus finance attachment could create strong platform economics
    - Verified take rates, retention cohorts, and audited margins would strengthen conviction
  - - Private unicorn status and lender backing show external confidence
    - If lender terms reveal tight dependence or weak covenant headroom, conviction would fall
  - - Embedded finance can materially raise value beyond POS subscriptions
    - Weak actual merchant attach or poor risk-adjusted economics would damage the thesis
  - - Service-quality and disclosure gaps can make the current price too rich
    - Improved operational metrics and audited financials would justify tighter discounting
  notes: The anti-thesis is not that Epos Now is fake; it is that paying too much on partial evidence is avoidable.
