- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Service-quality deterioration
    - Rising complaints / dispute outcomes without credible remediation
    - Damages trust, retention, and platform expansion narrative
    - Pause or reprice
  - - Weak finance attachment
    - Payments or capital take-up materially below partner narrative
    - Removes highest-value upside lever
    - Cut upside case and tighten valuation
  - - Debt dependence rises
    - More leverage without better disclosure or cash proof
    - Raises downside asymmetry
    - Demand structure or walk away
  - - Partner disruption
    - Payments / finance rail issue materially affects merchants
    - Exposes concentration risk
    - Reassess business resilience
  - - Disclosure remains weak after diligence access
    - Management cannot support core metrics
    - Keeps price anchored to narrative, not evidence
    - Do not invest at premium valuation
  notes: Kill triggers are framed as measurable diligence outcomes rather than vague unease.
