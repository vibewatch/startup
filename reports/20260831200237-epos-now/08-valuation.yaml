company:
  name: Epos Now
chapter:
  number: 8
  title: Valuation
  summary: Epos Now merits investor attention, but not valuation complacency. Public evidence supports a real late-stage private
    merchant platform with embedded-finance upside and lender backing; it does not support paying a unicorn headline on faith
    while core revenue, margin, retention, and covenant variables remain opaque.
sections:
- id: thesis-and-recommendation
  title: The thesis is real, but the recommendation must stay disciplined
  body: 'The favorable case for Epos Now is not imaginary. Public evidence supports a real multi-country merchant platform,
    credible product breadth, a meaningful installed-base narrative, and fresh expansion into higher-value financial services.
    Adyen’s evidence is especially important because it shows repeat usage and real capital-product adoption rather than merely
    aspirational product messaging. The June 2026 HSBC package adds another positive signal: third-party lender confidence
    and added liquidity flexibility.


    But none of those facts alone resolve the most important valuation question: whether outside investors should accept a
    private unicorn framing without direct evidence on audited revenue quality, margin structure, retention, or runway. The
    best interpretation of the unicorn evidence is that Epos Now crossed a symbolic valuation threshold, not that every future
    entry point deserves that price. Private prestige is not price discovery.


    The right recommendation is therefore conditional rather than enthusiastic. Epos Now belongs on an investor’s active watch
    list or diligence track, but the price paid should fall materially as disclosure quality falls.


    That discipline should extend beyond price to structure. If investors cannot obtain audited cohort, margin, and covenant
    evidence pre-close, the right response is not optimism but either more downside protection or more patience. Late-stage
    private rounds can hide substantial economic variance behind a prestigious headline.'
