- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: sample
    basis: Sample of the most relevant public merchant-platform comparables and Epos Now’s own private valuation context;
      not an exhaustive comp set.
  columns:
  - Comparable
  - Metric lens
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Epos Now private context
    - Private valuation threshold
    - Unicorn status (>£1B) plus debt-backed growth support
    - Direct company context
    - No public audited revenue or margin pack
  - - Block / Square
    - Public merchant ecosystem
    - Publicly traded, filing-rich broad SMB POS/payments comp
    - Best broad cross-vertical benchmark
    - Mix includes Cash App and broader ecosystems
  - - Toast
    - Restaurant-led merchant platform
    - Publicly traded, fintech-heavy vertical SaaS comp
    - Best proof that financial services can dominate economics
    - Restaurant focus is narrower than Epos Now
  - - Lightspeed
    - Retail/hospitality software platform
    - Publicly traded, disclosure-rich retail/hospitality comp
    - Useful for cross-vertical software comparison
    - Different geography, scale, and governance mix
  - - NCR Voyix
    - Mature merchant-tech operator
    - Publicly traded legacy merchant-tech reference
    - Useful for public reporting discipline and sector context
    - Older and broader business mix than Epos Now
  notes: The table is about relevance and disclosure discipline, not about importing live trading multiples mechanically.
