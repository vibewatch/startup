- id: kill-triggers-and-verdict
  title: The downside is overpaying before the evidence catches up
  body: 'The most damaging mistake here would not be missing the company entirely; it would be paying a valuation that assumes
    strong recurring economics before those economics are proven. That is why the chapter’s kill triggers center on deterioration
    in service quality, weak actual finance attachment, or growing debt reliance without accompanying disclosure improvement.
    These are not theoretical concerns. They connect directly to the strongest public downside signals in the broader report.


    Exit readiness is also only partial from public evidence. Epos Now may have private-market stature, but public-market
    readiness depends on audited reporting quality, disclosure discipline, and resilience metrics that are not yet visible.
    Investors should therefore treat this as a company that may deserve structured engagement, not as one where the existing
    headline validates the next round’s price automatically.


    The valuation verdict is straightforward: interesting company, meaningful upside, medium confidence, medium-high risk,
    and a firmly price-sensitive posture until fuller disclosure or more investor-friendly structure closes the evidence gap.


    From an IC perspective, the question is whether the investor is being paid for the uncertainty. If the answer is no, patience
    is the superior strategy. If the answer is yes through structure, price, or new disclosure, Epos Now could become attractive
    quickly because the underlying commercial story is already substantial.'
