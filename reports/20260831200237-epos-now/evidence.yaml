evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: equity-ownership
    missingEvidence: A current cap table, investor list, board roster, and preference stack.
    whyItMatters: Unicorn status and debt capacity do not reveal control rights, dilution risk, or governance quality.
    diligencePath: Request the latest cap table, board materials, and shareholder agreement summary from management.
    relatedQuestionRefs:
      - QO014
      - QO015
      - QO024
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: A consistent management definition for locations, merchants, customers, and active embedded-finance users.
    whyItMatters: >-
      Different public pages alternate between 80,000 locations and 100,000 merchants, which affects scale
      interpretation.
    diligencePath: >-
      Ask management for a metric dictionary and time series tying locations, merchant accounts, and active payment
      users together.
    relatedQuestionRefs:
      - QO018
      - QO025
    relatedTableRefs:
      - TO002
      - TO004
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Audited revenue, margin, cash, and covenant disclosures for the latest period.
    whyItMatters: >-
      Overview confidence on scale is high, but financial quality and lender dependence cannot be judged from top-line
      marketing alone.
    diligencePath: Obtain the FY2025 accounts package and lender presentation supporting the June 2026 facility.
    relatedQuestionRefs:
      - QO014
      - QO016
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: eposnow-specific-market-model
    missingEvidence: A management-built TAM, SAM, and SOM model with segment assumptions and attach-rate logic.
    whyItMatters: >-
      Public macro market reports are helpful context but do not show which portions Epos Now can actually win
      profitably.
    diligencePath: Request board or lender materials showing segment mix, geography, and conversion assumptions by vertical.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: market-boundaries
    missingEvidence: >-
      A single normalized framework that reconciles global POS, terminals, hospitality POS, and embedded-finance
      adjacency figures.
    whyItMatters: Investors can overstate opportunity by mixing incompatible category numbers without a clear boundary statement.
    diligencePath: Normalize external market reports into one scope and keep excluded spend explicit in the model.
    relatedQuestionRefs:
      - QM014
      - QM024
  - type: private-evidence-only
    severity: material
    topic: segment-win-rates
    missingEvidence: Actual win rates, sales-cycle lengths, and churn by merchant segment.
    whyItMatters: A growing category does not prove Epos Now can capture share efficiently across all subsegments.
    diligencePath: Review CRM cohort data and close-lost reasons by vertical, size, and geography.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
  - type: private-evidence-only
    severity: material
    topic: win-loss-by-vertical
    missingEvidence: Actual win/loss data against Square, Toast, Lightspeed, and restaurant specialists by segment and geography.
    whyItMatters: >-
      The public landscape shows plausible rivalry, but only internal conversion data can prove where Epos Now really
      wins.
    diligencePath: Request CRM close-lost reasons, competitor tags, and gross-win rates by segment.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: revel-current-official-proof
    missingEvidence: Cleaner current official Revel product and pricing pages without anti-bot or challenge wrappers.
    whyItMatters: >-
      Revel remains a buyer reference in comparisons, but direct official evidence was partially blocked during this
      run.
    diligencePath: Obtain direct access or a cached product sheet to validate current positioning and pricing.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-discounting
    missingEvidence: Realized contract terms, payments take rates, hardware financing, and support-attach economics.
    whyItMatters: >-
      List pricing does not reveal whether Epos Now can match peers profitably or whether it wins only through
      discounting.
    diligencePath: Review customer contracts and sales policies across UK, US, and Australia.
    relatedQuestionRefs:
      - QP010
      - QP011
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: quality-of-revenue-pack
    missingEvidence: Audited revenue by stream, geography, and merchant cohort with gross-margin split.
    whyItMatters: Without a stream-level quality-of-revenue pack, the model cannot be valued or stress-tested confidently.
    diligencePath: Request lender or board materials showing revenue mix, margins, and retention by stream.
    relatedQuestionRefs:
      - QI020
      - QI025
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Cash balance, monthly burn, runway, and covenant headroom under the HSBC facility.
    whyItMatters: Fresh debt improves flexibility, but absent cash data the company’s true financing dependency remains unknowable.
    diligencePath: Request treasury dashboard, borrowing-base mechanics, and facility covenant package.
    relatedQuestionRefs:
      - QI012
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: payments-and-capital-unit-economics
    missingEvidence: >-
      Payments attach, take rate, capital approval rates, default losses, revenue share, and repeat behavior by
      geography.
    whyItMatters: >-
      The chapter’s core upside thesis depends on financial-services attachment, which is economically attractive only
      if risk-adjusted returns are strong.
    diligencePath: Request product P&Ls and cohort-level performance for payments and capital.
    relatedQuestionRefs:
      - QI005
      - QI019
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: reliability-and-sla
    missingEvidence: >-
      A public or shared trust centre with uptime history, security certifications, incident-response commitments, and
      service-level terms.
    whyItMatters: >-
      The current public record is strong on commercial surfaces but weak on operational assurance for buyers who depend
      on live trading uptime.
    diligencePath: Request status history, SLO/SLA documents, pen-test cadence, and certification scopes.
    relatedQuestionRefs:
      - QE015
      - QE022
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: module-level-adoption
    missingEvidence: Usage, retention, and monetization by module including payments, capital, ecommerce, and loyalty adjacencies.
    whyItMatters: Breadth only creates value if merchants actually adopt and keep the adjacent modules.
    diligencePath: Request product telemetry and gross-profit contribution by module and geography.
    relatedQuestionRefs:
      - QE007
      - QE024
    relatedTableRefs:
      - TE001
      - TE002
  - type: private-evidence-only
    severity: material
    topic: internal-architecture
    missingEvidence: >-
      Internal systems architecture, deployment model, observability practices, release cadence, and recovery
      objectives.
    whyItMatters: Public API and partner pages show extensibility, but they do not prove resilience or development discipline.
    diligencePath: Request architecture review, SDLC policies, release logs, and dependency concentration analysis.
    relatedQuestionRefs:
      - QE016
      - QE017
    relatedTableRefs:
      - TE003
      - TE005
  - type: private-evidence-only
    severity: material
    topic: core-retention-cohorts
    missingEvidence: GRR, NRR, logo churn, and renewal cohorts for the core POS base by geography and segment.
    whyItMatters: Broad adoption and review volume do not prove durable revenue or healthy renewals.
    diligencePath: Request retention dashboards, churn reasons, and renewal cohorts by product and region.
    relatedQuestionRefs:
      - QU012
      - QU023
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue, top-10 concentration, partner-channel concentration, and segment revenue mix.
    whyItMatters: A fragmented SMB story lowers perceived concentration risk but does not eliminate it.
    diligencePath: Request revenue concentration tables and channel-source mix.
    relatedQuestionRefs:
      - QU018
    relatedTableRefs:
      - TU005
  - type: conflicting-data
    severity: minor
    topic: active-customer-denominator
    missingEvidence: >-
      One reconciled definition for merchants, business locations, customers, and supported businesses across all public
      materials.
    whyItMatters: Different scale labels can overstate or understate adoption when investors compare chapters or benchmark peers.
    diligencePath: Request one KPI glossary aligned to board reporting and public communications.
    relatedQuestionRefs:
      - QU004
      - QU005
    relatedTableRefs:
      - TU002
      - TU003
  - type: private-evidence-only
    severity: material
    topic: TR001 legal-regulatory completeness
    missingEvidence: A complete litigation, SAR, ICO, AML, and incident log review rather than the public-source sample used here.
    whyItMatters: >-
      Public pages can confirm the existence of a risk perimeter, but not the full volume or severity of underlying
      events.
    diligencePath: Request legal docket summary, regulator correspondence, SAR metrics, and incident registers.
    relatedQuestionRefs:
      - QR018
      - QR028
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-assurance-pack
    missingEvidence: Uptime history, SLA/SLO terms, incident metrics, complaint-resolution metrics, and support queue performance.
    whyItMatters: >-
      The top public adverse signal is service friction, so investors need formal operational evidence before assuming
      the issue is manageable.
    diligencePath: Request reliability dashboard, status history, and support-performance pack.
    relatedQuestionRefs:
      - QR006
      - QR019
    relatedTableRefs:
      - TR002
      - TR005
  - type: private-evidence-only
    severity: material
    topic: partner-and-financing-contingencies
    missingEvidence: Adyen contingency plans, partner concentration metrics, facility covenants, and cash/runway headroom.
    whyItMatters: Payments/finance dependence and fresh debt are among the chapter’s highest-impact risks.
    diligencePath: Request partner contracts, contingency planning, and lender covenant package.
    relatedQuestionRefs:
      - QR010
      - QR011
      - QR012
      - QR020
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: TV004 comparable valuation normalization
    missingEvidence: A full comp sheet with current EV, revenue, gross margin, growth, and peer-set normalization versus Epos Now.
    whyItMatters: >-
      Public comps are helpful, but without normalized financial inputs they cannot support committee-grade pricing
      discipline.
    diligencePath: Build a proper comp set from live market data and audited Epos Now metrics.
    relatedQuestionRefs:
      - QV015
      - QV016
    relatedTableRefs:
      - TV004
  - type: private-evidence-only
    severity: material
    topic: core-valuation-pack
    missingEvidence: Audited revenue mix, margins, retention, cash burn, runway, and facility covenants.
    whyItMatters: These are the variables that determine whether the unicorn headline is conservative, fair, or too rich.
    diligencePath: Request CFO pack, lender materials, and cohort-level operating metrics before price negotiation.
    relatedQuestionRefs:
      - QV022
    relatedTableRefs:
      - TV001
