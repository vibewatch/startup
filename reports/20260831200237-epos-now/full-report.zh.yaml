  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 正确的市场边界比标题式 POS TAM 更窄
        blocks:
          - type: paragraph
            body: >-
              在 POS 尽调里，最容易做的是引用一个很大的全球市场数字，然后止步。但对 Epos Now 来说，这会是错误。公司并不面向所有商业基础设施、所有零售软件预算或所有支付工作流。它所处的是更窄的一块：POS
              同时也是商户运营层，覆盖收银、目录和库存、员工协同、报表，以及日益集成的金融服务。这块市场与硬件和收单重叠，但并不等同于任一者。


              公开市场数据确认该品类很大。Research and Markets 预计 2026 年全球 POS 市场约为 $64.61 billion；The Business Research Company 预计
              2026 年 POS 终端市场超过 $118 billion；Research and Markets 估算 2026 年餐饮 POS 软件约为 $9.16
              billion。这些数字并非错误，但边界不同。有些重硬件，有些偏软件，有些收窄到餐饮。正确的分析动作不是情绪化地选一个数字，而是保留边界差异，再追问 Epos Now 能合理服务哪一部分。


              这个可服务切片仍然有吸引力。Epos Now 自身横跨零售、餐饮和多门店商户的定位，说明它想抓住的是需要一套实用系统的跨垂直 SMB 运营者，而不只是需要一个简单读卡器或单一功能应用的商户。
