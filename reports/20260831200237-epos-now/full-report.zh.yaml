  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 模型不只是 POS 订阅收入
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一种比简单 POS 订阅更宽的商业模式。Epos Now 销售软件、硬件、支付受理，以及越来越多嵌入商户工作流的嵌入式金融产品。官网强调可负担和一体化功能；Adyen 与 Epos Now
              自己的融资沟通也清楚表明，支付和资本产品如今已是核心战略触点，而不是边缘附加项。


              这一点重要，因为商户软件的经济性，往往会在平台内捕获更多支付和金融附着后改善。Apideck 嵌入式金融报告的第三方行业证据，加上 Toast 和 Square
              的公开案例，都强化了这个模式：软件常负责获客，而金融产品推动不成比例的收入和留存。Epos Now 看起来也在走同一套打法，只是没有披露自己的抽成率或收入结构。


              因此，这是一个财务上有意思、但并不完全透明的模型。标价证明订阅收入存在，却看不出实际成交价、折扣、支付价差，或商户层面的金融变现。


              这种定价模糊很重要，因为 Epos Now
              所在品类里，商户并不只按软件价格购买。硬件包、支持覆盖、处理商经济性和资本产品资格，都可能显著改变客户终身价值。没有合同层级数据，表面便宜的入门套餐不能被假定会转化为强或弱的单位经济性。
