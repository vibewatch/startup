      - - 服务质量恶化
        - 投诉或争议结果上升，且没有可信补救方案
        - 伤害信任、留存和平台扩张叙事
        - 暂停或重新定价
      - - 金融产品挂载偏弱
        - 支付或融资产品采用率显著低于合作伙伴叙事
        - 移除最高价值的上行杠杆
        - 下调上行情景并收紧估值
      - - 债务依赖上升
        - 杠杆增加，但披露或现金证明没有改善
        - 抬高下行不对称性
        - 要求结构保护或放弃
      - - 合作伙伴中断
        - 支付 / 金融通道问题显著影响商户
        - 暴露集中风险
        - 重新评估业务韧性
      - - 尽调开放后披露仍弱
        - 管理层无法支撑核心指标
        - 价格仍锚定叙事，而非证据
        - 不以溢价估值投资
    notes: 否决触发项按可衡量的尽调结果定义，而不是模糊不安。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入结构
        - 按收入流、地域和队列拆分的收入
        - 估值和情景概率的核心输入
        - 管理层 / 贷款人资料包
      - - 留存与流失
        - GRR、NRR、logo 流失、挽留率
        - 检验安装基盘质量所需
        - 客户成功 + 财务复核
      - - 支付与金融经济性
        - 挂载率、抽佣率、损失率、收入分成
        - 最高价值上行杠杆也可能是关键风险
        - 产品 + 合作伙伴尽调
      - - 融资工具条款
        - 契约、余量、资金用途、担保
        - 误读债务会放大下行
        - 贷款人 / 资金管理尽调
      - - 运营韧性
        - 可用性历史、投诉处理、SLA 指标
        - 避免为脆弱基础设施支付增长倍数
        - 运营 + 支持尽调
      - - 治理与退出准备度
        - 审计纪律、报告节奏、IPO 准备度
        - 决定相对上市可比公司的折价
        - 董事会 / CFO 尽调
    notes: 任何严肃价格谈判前，都应先拿到这些材料。
    claimRefs:
      - CV039
      - CV040
      - CV041
