  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户证据指向广泛的 SMB 商户足迹
        blocks:
          - type: paragraph
            body: >-
              客户证据在宽度上方向性很强。Epos Now 的官方触点和成功案例覆盖英国和北美的酒吧、酒馆、美发沙龙、宠物店、咖啡馆、葡萄酒卖家和其他小企业形态。这种组合显示的是分散的 SMB
              商户基础，而不是狭窄的单一垂直或企业客户偏重模型。公开联系方式和关于页面也支持公司在英国、美国、加拿大和澳大利亚拥有真实运营足迹。


              规模主张明显重要，但尚未完全对齐。视页面和日期不同，Epos Now 及其合作伙伴引用的是 80,000+ 个营业地点、80,000 家企业、90,000+ 家企业，或 100,000
              家商户。成长阶段公司常会分别统计地点、商户和受支持企业；但这确实意味着，在管理层对账前，投资者不应把任何单一数字当作干净分母。


              即便如此，公开记录支持核心结论：这不是只有少数客户的故事。Epos Now 拥有广泛商户触达。


              故事和评论平台展示的品类宽度很重要，因为它支持跨商户形态的可复制性，而不是依赖某个异常用例。经营 POS 生意时，这种横向 SMB 覆盖可能和任何一个大型客户标识一样重要。
