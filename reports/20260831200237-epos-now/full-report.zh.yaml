      - number: '3.2'
        title: 能力宽度帮到 Epos Now，但深度和透明度仍让同行分化
        blocks:
          - type: paragraph
            body: >-
              无论看官方供应商页面还是独立评测对比，这个品类的核心购买标准都高度一致：支付、库存、报表、硬件匹配、餐饮流程、易用性和支持。Epos Now
              的吸引力在于宽度。它定位一套商户栈，可服务零售、餐饮和多门店运营者，同时纳入支付、集成和相邻金融。想要一个实用供应商的买方会认可这种价值主张。


              但宽度不等于品类领导力。Toast 的餐厅身份更清晰，垂直叙事更深。Lightspeed 展现了更强的库存和多地点运营资质。Square 保留了入驻和简单性优势，尤其适合较小商户。TouchBistro
              在餐厅专属工作流细节最重要的场景仍有可信度。当商户比较套餐和实施负担，而不只是功能清单时，这些差异会更尖锐。


              定价页面也重要。Square 相对透明，并与交易挂钩。Lightspeed 和 Toast 发布结构化套餐，但实际经济性仍取决于组合包、支付、硬件和服务。Epos Now
              公布入门价格，但评测证据显示，商户仍可能在条款、附加项或支持预期上遇到不确定性。
