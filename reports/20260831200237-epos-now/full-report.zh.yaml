  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 示意区间锚定公开证据质量，而不是一个假精确的市场倍数。
    data:
      items:
        - label: 悲观情景估值姿态
          low: 1
          mid: 2
          high: 3
          unit: x confidence discount
          detail: 如果服务、债务或绑定率担忧占主导，需要较高折价
        - label: 基准情景估值姿态
          low: 4
          mid: 6
          high: 8
          unit: x evidence score
          detail: 相比独角兽光环，需要结构化或折价入场
        - label: 乐观情景估值姿态
          low: 8
          mid: 10
          high: 12
          unit: x evidence score
          detail: 只有经审计的经济性和绑定率验证叙事后才成立
    approximationNotes: 这些只是示意性的姿态区间，不是实时收入倍数；它们体现若要接受更紧的估值，需要多少披露和执行证明。
    claimRefs:
