      - number: '2.2'
        title: 买方、用户和付款方角色解释了为什么工作流匹配重要
        blocks:
          - type: paragraph
            body: >-
              谁购买现代 POS 系统，和这个品类有多大同样重要。在 Epos Now 的核心细分市场里，买方很少是追求架构纯粹性的
              CIO。通常是商户老板、总经理、财务负责人或运营负责人，他们要解决肉眼可见的日常问题：收银慢、库存控制弱、员工效率低、报表碎片化，或支付摩擦。用户可能是一线服务人员或门店经理，但付款方往往是直接为现金流和服务质量负责的人。


              这种结构解释了品类采用路径。商户常从收银痛点入手；初始工作流证明可靠后，再把使用深化到库存、报表和集成支付。Square、Toast、Lightspeed 和 TouchBistro
              的公开竞品页面都强化了同一模式：买方越来越期待核心 POS 提供多地点可见性、全渠道处理和快速运营报表。因此，Epos Now
              的机会不只是出现在一个增长品类里，而是赢下那些想要一套栈、而非几种工具拼接起来的运营者。


              同时，这个品类并非没有摩擦。切换往往需要重新培训员工、重建商品目录、重连外设，有时还要接受新的支付条款。因此，采用触发点和信任比宽泛的总可用市场（TAM）更重要。
