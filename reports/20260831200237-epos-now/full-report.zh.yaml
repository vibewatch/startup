      - number: '6.3'
        title: 扩张逻辑可见，集中度风险不可见
        blocks:
          - type: paragraph
            body: >-
              Epos Now 的公开客户旅程看起来从可负担、运营简单和实用的一体化 POS 方案开始。随后，商户可以把使用深化到报表、库存、支付、忠诚度、电商和金融产品。Adyen
              的合作伙伴证据尤其重要，因为它证明资本产品内部存在重复使用，也暗示至少部分客户愿意从核心 POS 层向外扩张。加拿大资本发布又增加了一个地理证明点，说明扩张并不只是概念。


              不过，公开来源仍未揭示集中度图景。分散的 SMB 故事，使极端企业客户集中度低于许多 B2B SaaS
              生意的可能性较大；但仅凭公开来源，既不能排除头部客户依赖，也不能排除渠道集中度。续约质量同样如此：留存岗位和广泛评论量令人鼓舞，但不能替代队列数据。


              净结果是一个有利但不完整的客户结论：Epos Now 显然有真实采用和合理扩张路径，但投资者在把这种采用视为持久现金流前，仍需要直接的留存、集中度和单位经济性数据。


              因此，本章支持一种务实的尽调立场。客户真实性不是问题：已有足够证据说明，许多商户在生产环境中使用 Epos Now。未解决的问题是，当续约、投诉、支持成本和金融产品变现按队列衡量后，这个装机基础的质量如何。
