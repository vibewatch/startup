      - number: '1.3'
        title: 规模信号真实，但多项收入线指标仍受定义影响
        blocks:
          - type: paragraph
            body: >-
              第三方和合作伙伴来源大体同意 Epos Now 已是一门有体量的生意，但细节分歧足以让投资者保持谨慎。Latka 估计 2025 年 ARR 为 $48.8 million，员工数约 444；Tracxn 则显示
              2026 年 7 月员工数为 462。Adyen 合作材料称，有 80,000 个 SMB 营业地点使用 Epos Now，9,000 多家企业使用过 Epos Now Capital，且 83%
              会回来申请第二笔贷款。与此同时，一些 Epos Now 新闻稿和合作材料使用的是 100,000 家商户，而不是 80,000
              个地点。这些数字在方向上支持规模判断，但也说明公司公开指标定义在不同页面和语境中并不完全稳定。


              解读这些规模信号时，反向记录同样重要。Mobile Transaction 把长期合同、支持附加项和账单摩擦列为真实问题；Financial Ombudsman 支持了一起关于不准确账单和结算延迟的投诉；归档的
              Trustpilot 和投诉门户显示，围绕入驻、退款、取消和支持质量存在反复争议。这些并不推翻公司的核心故事，但提醒投资者不要把广泛客户基础误读成一致低摩擦的服务交付。


              因此，合理的概览结论是平衡的。Epos Now 显然已具备真实规模，仍为私营公司，并拥有可信融资和嵌入式金融牵引力。但公开记录仍未达到投资者在承销精确估值、留存或利润率主张前所需的披露质量。
