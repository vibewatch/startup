    data:
      items:
        - label: 支付 / 金融绑定证明
          value: 9
          unit: sensitivity-index
        - label: 留存 / 流失披露
          value: 9
          unit: sensitivity-index
        - label: 经审计的利润率质量
          value: 8
          unit: sensitivity-index
        - label: 融资额度契约清晰度
          value: 7
          unit: sensitivity-index
        - label: 服务质量趋势
          value: 8
          unit: sensitivity-index
        - label: 可比公司估值框架适配度
          value: 5
          unit: sensitivity-index
