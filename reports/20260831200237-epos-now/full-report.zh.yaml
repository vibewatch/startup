  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局覆盖直接对手、专门玩家和低端现状方案
        blocks:
          - type: paragraph
            body: >-
              Epos Now 的竞争集合比一对一供应商对比显示的更宽。最接近的直接对手是 Square、Toast 和 Lightspeed，因为三者都把 POS 软件与支付、硬件和运营工具结合起来。TouchBistro
              也属于这个集合，但角色更像专门玩家：它在餐厅场景里做深，而不是横跨商户类型铺宽。评论和对比来源仍把 Revel 类系统放进买方考虑范围，即使本轮中部分官方页面较难访问。


              真实格局还包括更低端的现状方案。很小的商户可以用简单收银机、以银行卡为中心的收银产品或手工报表来推迟平台决策。成长中的多门店运营者不能把这些当作等价替代品，但它们确实压住定价权，并延缓漏斗底部采用。相比之下，内部自建对
              SMB 商户基本只是理论选项；集成和维护负担使其不可能成为常见替代方案。


              这意味着，Epos Now 的输赢主要发生在专门软件供应商及其生态之间，而不是与定制技术团队竞争。


              另一个现实点是地理。Epos Now 以英国为基地向美国、加拿大和澳大利亚销售，而几家更大的竞争对手已经拥有更深的本地营销、渠道和产品资源。这并不消除 Epos Now
              的机会，但意味着公司经常进入的购买流程里，商户预期已被更大品牌或更专门的餐厅现任供应商塑造。
