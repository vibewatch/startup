      - number: '5.3'
        title: 公开证据更能证明产品触达，而不是工程透明度
        blocks:
          - type: paragraph
            body: >-
              信任和运营成熟度证据是混合的。隐私政策相当实质且有用：它描述了控制方 / 处理方角色、数据保护姿态，以及涉及
              AML、卡组织和第三方银行合作伙伴的支付特定合规义务。这比泛泛的营销文案更好。公开工程招聘也是有帮助的信号，说明公司在 2026 年仍在投入软件、平台和云能力。


              但重要技术问题仍未在公开层面得到回答。本轮没有确认专门的实时状态页、广泛的安全认证细节、模块级变更日志纪律，或明确的正常运行时间和事故响应承诺。评论来源提供了可用性和服务反馈，部分抵消这一点，但它们不能替代正式可靠性透明度。本章的关键张力很直接：Epos
              Now 看起来真实、连接充分且商业上有用；但外界更容易看到平台承诺什么，而不是审计它在底层交付得有多稳。


              这仍然留下一个可用的产品结论。平台显得连贯且可扩展，具备有意义的金融和集成深度。尽调负担转向内部架构、可靠性指标和合作伙伴依赖管理。


              这种区别对商户软件很重要。产品可以让买方感觉完整，同时仍向投资者隐藏重要工程或依赖风险。Epos Now 看起来站在产品连贯性的正确一侧；剩下的问题是，它的内部运营纪律是否和外部工作流故事一样强。
