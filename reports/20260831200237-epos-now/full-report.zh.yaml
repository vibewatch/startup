      - number: '7.3'
        title: 执行质量决定可管理风险能否保持可管理
        blocks:
          - type: paragraph
            body: >-
              剩余风险大多收敛到一个核心问题：管理层能否足够干净地执行，让产品宽度、合作伙伴依赖和融资野心不跑到运营纪律前面？面向工程、平台、云、留存和催收相关岗位的招聘，说明这些是活跃的管理问题，而不是已经解决的后台职能。这不自动是负面；成长型公司本就应投入这些领域。但这意味着公司结局仍高度取决于执行。


              Square、Toast 和 Lightspeed 的竞争压力进一步提高门槛。资本更雄厚的对手，可以在服务质量滑坡或商户对定价和支持失去信任时乘虚而入。反过来，Epos Now
              广泛装机基础证据、正式隐私姿态、公开支持触点和合作伙伴质量信号，也是真实缓释因素。


              正确的风险立场因此是有条件的，而不是二元的。仅凭公开证据，Epos Now
              还不到应直接放弃的程度；但也绝不是一家投资者可以跳过投诉、合作伙伴集中度、债务条款或可靠性证据尽调的公司。这些是决定上行空间能否经受运营考验的关键雷区。


              因此，风险尽调不应只测试政策和条款是否存在，还要测试它们是否真正落到支持、实施和催收工作流里。公司可以有正式法律语言，但如果客户在实践中感受到的是另一套关系，仍会积累本可避免的信任损伤。
