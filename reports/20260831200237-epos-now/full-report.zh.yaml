chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、范围和当前业务足迹
        blocks:
          - type: paragraph
            body: >-
              Epos Now 目前的公司叙事，在官网、关于页面和合作伙伴材料之间异常一致。公司把自己定位为面向零售、餐饮及其他中小型商户的 AI 驱动 POS
              与嵌入式金融平台；这些商户需要的不只是一个独立收银机。工作流重点很关键。Epos Now
              卖的不是几块软件界面，而是商户处理交易、管理库存和员工、跑报表，并越来越多地在平台内获得金融产品的运营层。因此，它更像商户操作系统，而不是传统收银机供应商。


              最强的官方规模标记来自地域和产品宽度，而不是经审计财务披露。当前公司页面称，Epos Now 服务 70 多个国家的商户，支持 80,000 多个营业地点，并集成 130
              多个应用。首页还展示了零售、餐饮和多门店企业运营商的不同进入市场路径，支持 Epos Now 已经走出单一国家 SMB 细分市场的判断。美国关于页面披露的实体办公室足迹——Norwich、Orlando 和
              Australia——进一步强化了公司的跨市场野心，即使法律实体披露仍集中在英国母公司。


              这种身份框架也解释了 Epos Now 为什么持续投入支付和嵌入式金融。官方与合作伙伴公开来源都显示，公司在尝试长期掌握更多商户关系，从 POS 软件和硬件走向支付、资本、账户和银行卡产品。因此，本章首先把
              Epos Now 视为商户工作流平台，其次才是支付故事。
