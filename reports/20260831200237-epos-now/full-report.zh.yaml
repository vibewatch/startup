      - number: '8.2'
        title: 情景比单点估值数学更重要
        blocks:
          - type: paragraph
            body: >-
              公开来源没有提供足够干净的数据，无法做精确内在估值。但它们足以搭建决策树。在乐观情景中，Epos Now
              把广泛装机基础复利到更深的支付和嵌入式金融经济性，使当前私募估值更容易被捍卫。在基准情景中，公司仍然商业真实并继续增长，但投资者在获得更好披露前，坚持对独角兽光环打折。在悲观情景中，服务质量问题、合作伙伴集中度或杠杆暴露出一门不如标题定位稳健的业务。


              公开可比公司有助于框定讨论，但不应机械套用。Block、Toast、Lightspeed 和 NCR Voyix 都提供有用的方向性背景，因为它们与
              POS、商户软件、支付或报表纪律有重叠。但它们是上市公司，有正式申报文件基础设施和更清晰的市场参考点。Epos Now 不是。这种披露不对称本身就是估值变量，不是脚注。


              实际结果是，情景思考和价格纪律比表面精确性更重要。


              同样逻辑也适用于治理。公开申报文件和年度报告基础设施不会让上市公司变便宜，但会让它们更容易被承销。因此，评估 Epos Now 时，不仅要对照商户平台可比公司做什么，还要对照这些可比公司每季度已经承担的报告负担。
