      - number: '7.2'
        title: 运营和合作伙伴风险会快速传导到收入和品牌
        blocks:
          - type: paragraph
            body: >-
              POS
              和商户金融产品的失败会暴露在公众面前。系统不可靠、支持太慢，或账单制造不信任，商户都会在现场交易中感到痛。这就是为什么没有确认公开状态页值得关注，也解释了为什么投诉驱动来源应被认真对待。评论平台仍显示许多满意客户，但也说明，在这个品类里，运营摩擦如何变成品牌伤害；替换决策往往由挫败感触发，而不只来自年度规划周期。


              合作伙伴依赖进一步抬高风险。Adyen 看起来是支付和嵌入式金融工作流的核心；Duda
              和其他合作伙伴扩展电商、忠诚度或硬件宽度。这些关系扩大了平台，但也制造集中度和集成风险。合作伙伴事故、合规故障或商业分歧，都可能直接影响商户体验。


              债务支持的增长会放大这些担忧。2026 年 HSBC 授信是正面融资信号，但也增加杠杆，并让投资者依赖仍未掌握的信息，例如现金烧钱、现金跑道和财务约束余量。


              条款还凸显实际运营依赖：互联网可靠性、网络隔离、员工培训、备份和硬件状况都部分推给商户。商业上这可能合理，但事故发生后会让责任归属更复杂；如果销售时没有把客户预期设清楚，也会加剧争议风险。
