      - number: '2.3'
        title: 增长驱动真实存在，SME 采用障碍也同样真实
        blocks:
          - type: paragraph
            body: >-
              2026 年的政策和市场环境仍有利于商户数字化供应商，但不是简单直线上行。英国公共政策材料反复把 SME 数字采用描述为仍在发生的生产率问题。GOV.UK
              的专责小组和配套研究指出，采用不均、认知和技能缺口持续存在，并且仍需要支持基础设施。从需求角度看，这是利好，因为市场尚未饱和。但这也是警示：供应商仍需靠入驻质量、清晰度和实际 ROI，说服仍犹豫的商户转化。


              产品驱动更清楚。非接触式支付、全渠道订单处理、远程报表和联网后台工作流，在 2026 年仍是活跃的品类顺风。嵌入式金融正在成为这些基础能力之上的二阶驱动：Adyen 与 Epos Now 的合作，以及 Adyen
              的嵌入式金融市场研究，都指向商户对已使用软件内金融产品的真实需求。不过，即便这些驱动存在，也抹不掉合同、支持和迁移工作量这些更硬的约束。SMB 可能想要更好的系统，但仍会惩罚制造账单混乱或运营停摆的供应商。


              归根结底，Epos Now 身处一个大而持久的市场，但真正的竞争是本地化、运营型的。份额会在工作流层面赢得——靠匹配商户任务、降低切换难度、谨慎叠加金融——而不是靠身处一个巨大 TAM。
