    layout: standard
    summary: 公开证据最能支撑的客户路径，是从搜索驱动的发现进入报表驱动的日常使用，再延伸到金融产品扩张。
    data:
      items:
        - label: 发现
          detail: 商户通过搜索、销售触达或比价网站找到价格可承受的一体化 POS。
        - label: 评估
          detail: 买方把硬件、价格和易用性拿来对比 Square、Toast、Lightspeed 或现有方案。
        - label: 部署
          detail: 商户安装 POS、配置商品目录，并开始日常结账和报表。
        - label: 信任
          detail: 如果支持和运营顶得住，商户就会把实时交易和报表交给该系统。
        - label: 扩展
