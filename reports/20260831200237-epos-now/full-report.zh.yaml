      - number: '4.3'
        title: 公开披露仍是建立承销信心的主要障碍
        blocks:
          - type: paragraph
            body: >-
              核心财务限制不是缺少野心，而是缺少披露。本轮没有找到公开现金余额、月度烧钱、现金跑道、毛利率、贡献利润率、获客成本（CAC）、回本周期、流失率或净留存率（NRR）。收入背景主要来自 Latka 和 Growjo
              等方向性第三方聚合器；它们对收入水平存在分歧，应作为粗略外边界，而不是承销级数字。


              这些估计仍有一个用途：它们指向一家有真实规模的公司，背后有多地区运营、开发者基础设施，以及面向销售、留存和工程的活跃招聘。它们也暗示 Epos Now 采用销售辅助模式，而不是纯自助 SaaS
              模型；这可能抬高获客和支持成本，同时打开更大商户关系的入口。硬件部署、支持覆盖和支付合规都强化了这种成本形态。


              因此，财务结论是混合的，但只有在纪律下才可投资。Epos Now
              看起来是一家真实的商户平台，拥有可信融资渠道和有意义的金融科技附着上行空间。但仅凭公开记录，还不能有把握承销收入质量、利润率耐久性或现金跑道；仍需直接的贷方、管理层或合同层级尽调。


              有纪律的投资者应坚持拿到贷方尽调级财务包，再去依赖表层增长叙事。公开记录足以说明平台商业上真实，并在战略上走向价值更高的金融科技附着；但还不足以判断这一策略是否已经高效复利。
