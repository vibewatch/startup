  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律和监管风险可见，但尚未构成否决项
        blocks:
          - type: paragraph
            body: >-
              本轮最强的公开反向证据，更多与客户伤害和投诉有关，而不是大型监管执法行动。Financial Ombudsman
              的决定很重要，因为它说明争议严重到需要更正账单、补救延迟付款并支付赔偿。结合评论和投诉平台，它把服务质量和合同处理风险从传闻噪音提升为真实尽调议题。


              数据和支付合规同样重要。Epos Now 的隐私通知明确提到控制方 / 处理方责任、跨境数据处理、AML 义务、卡组织要求和合作银行安排。这比浅层合规姿态更好，但也确认公司处在不低的风险边界内。ICO
              注册和多司法辖区语言进一步说明，这是一家承担正式数据治理义务的业务，而不是轻量应用供应商。


              本轮没有出现重大公开罚款或执法行动，这是正面信号。不过，未见执法只能算不完整的安慰，不能当作完整健康证明。


              新获取的法律条款让这一判断更尖锐，而不是更温和。Epos Now 的条款与条件强调仲裁、硬件退回义务、支付挂钩套餐的最低交易水平、提前终止经济性，以及把多项运营责任明确分配给客户。这些条款对 SMB
              基础设施供应商并不罕见，但确实显示，商业、合规和服务风险不仅会经由技术，也会经由合同设计传导。
