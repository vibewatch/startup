      - number: '6.2'
        title: 具名案例和评论证明采用，但耐久性大多仍靠推断
        blocks:
          - type: paragraph
            body: >-
              本章最强的直接客户证据来自官方成功案例页面和第三方评论平台。Brucan Pubs、Gonzo’s、Cowpens Coffee and Creamery 和 WA Pubs
              的成功案例，看起来都是活跃生产使用，而不是抽象标识摆放：它们描述了真实餐饮或零售运营、报表或增长支持。这些案例应被视为经筛选的参考，而不是统计平均值，但确实确认了真实商户用例。


              更广泛的评论来源增加了规模感。Trustpilot、Capterra、Software Advice、GetApp 和 FeaturedCustomers
              都提供了大量客户信号，总体指向较强的综合情绪。这有用，因为它把证据基础扩展到公司自有页面之外。同时，反向评论和投诉来源同样重要。Mobile
              Transaction、Resolver、ComplaintsBoard、BBB 和 Financial Ombudsman 都显示，当商户在现场交易中依赖系统时，支持、账单或合同摩擦可能显著损害信任。


              缺失的仍是留存数学。公开来源没有披露总留存率（GRR）、净留存率（NRR）、流失率或核心 POS 队列，因此耐久性只能从证明质量、评论量和金融产品重复使用来推断，而不是直接测得。
