      - number: '1.2'
        title: 创始人控制、治理可见度和资本里程碑
        blocks:
          - type: paragraph
            body: >-
              创始人连续性是公开记录里较清楚的一点。Jacyn Heavens 仍然支撑公司叙事，出现在官方融资评论中，并在 Companies House
              记录里继续作为公司设立时任命的活跃董事。官方起源故事称，Heavens 因亲历糟糕的传统收银软件而创建 Epos Now；这显然是公司自我呈现，但也与登记证据相符：从 2011 年到 2026
              年申报文件，公司始终与同一位创始人绑定。这一点重要，因为 Epos Now 当前战略仍带有创始人塑形痕迹：快速推进，打包更多商户服务，并靠易用性、覆盖度和支持竞争，而不是押注单一狭窄模块。


              资本和治理记录可见，但不完整。Tech East 报道 Epos Now 于 2024 年 7 月进入 UK Unicorn Council；该组织只接纳估值超过 £1 billion
              的私营金融科技公司。Epos Now 自己在 2026 年 6 月的融资公告中也重复了这一里程碑。2026 年 6 月，公司披露获得 £90 million HSBC UK 融资包，由 £55 million
              承诺循环信贷额度和 £35 million 增额条款组成。随后 Companies House 显示 2026 年 6
              月有三项抵押登记，支持这是真实有担保债务，而不是随意的营销文案。但完整的股权投资者或董事会图景远不够清楚。公开来源没有清晰列出风投式股权结构表、完整董事会名单，或可让外部人士有把握判断稀释和治理纪律的经审计盈利数据。


              这一缺口很重要，因为债务支持的增长和独角兽身份，并不等于透明的投资级披露。公开证据足以确认 Epos Now 的后期私营状态和贷方信心，但还不足以重建完整所有权地图。
