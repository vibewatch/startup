      - number: '4.2'
        title: HSBC 授信提升灵活性，但也确认了融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开视野中最硬的财务事实，是 2026 年 6 月的 HSBC UK 信贷包。公司官方沟通、FinTech Futures 和 Companies House 申报文件都一致显示，Epos Now 获得最高
              £90 million，由 £55 million 承诺循环信贷额度和 £35 million
              增额条款组成。这很有意义，因为它说明一家大银行愿意向这门业务提供结构化信贷。也意味着公司仍为私营，并把债务用作支持增长的工具，而不是依赖公开股票市场。


              但债务不能替代透明度。该授信提高了近期流动性灵活度，可能帮助资助国际增长、产品扩张或金融产品放量。同时，它也引入经典信贷依赖：再融资风险、潜在财务约束压力，以及底层现金生成必须足以支撑杠杆。Companies
              House 抵押登记在这里尤其重要，因为它证明存在真实担保安排，而不是只停留在标题层面。


              因此，投资者应把该授信解读为融资渠道的正面信号，而不是底层盈利能力或强单位经济性的证明。
