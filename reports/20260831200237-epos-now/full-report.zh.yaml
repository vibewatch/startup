      - number: '5.2'
        title: API 和合作伙伴真实存在，对外部供应商的依赖也同样真实
        blocks:
          - type: paragraph
            body: >-
              公开开发者接口给出了最清晰的硬技术信号。Epos Now 的开发者网站确认了 REST
              API，以及一个用于与第三方应用交换数据的集成模型。即使文档偏介绍性、没有深入到运营层面，这一点仍有战略意义，因为它说明平台被设计为向外连接。ERP Research
              和官方合作伙伴材料强化了同一图景：集成和渠道关系是产品扩展和分销的一部分。


              合作公告也揭示了重要产品依赖。Adyen 支撑支付和嵌入式金融层。Duda 扩展电商连接。Factor4 延伸礼品卡和忠诚度功能。Volcora
              支持硬件和外设供应。这些都是产品宽度的正面信号，但也意味着商户体验取决于外部供应商保持可靠、合规，并且集成良好。


              换句话说，即使 Epos Now 没有公开深入披露内部基础设施，它的架构看起来也具备商业模块化。


              以 Epos Now
              的规模看，合作伙伴驱动的可扩展性在战略上合理。平台可以拓宽商户功能，而不必完全自建每个功能面。但这也意味着尽调不能止步于功能是否存在。投资者需要知道哪些合作伙伴是任务关键型，事故能多快解决，以及每段关系背后有多少收入集中度。
