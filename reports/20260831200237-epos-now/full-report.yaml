  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The landscape spans direct rivals, specialists, and low-end status quo
        blocks:
          - type: paragraph
            body: >-
              Epos Now’s competitive set is broader than one-for-one vendor comparisons suggest. The closest direct
              rivals are Square, Toast, and Lightspeed because each combines point-of-sale software with payments,
              hardware, and operational tooling. TouchBistro belongs in the set too, but as a specialist: it goes deep
              in restaurants rather than broad across merchant types. Review and comparison sources continue to keep
              Revel-like systems in buyer consideration as well, even if some official pages were difficult to access
              during this run.


              The real landscape also includes lower-end status quo options. Very small merchants can defer a platform
              decision with simple tills, card-led checkout products, or manual reporting. Those are not equal
              substitutes for a growing multi-site operator, but they do cap pricing power and delay adoption at the
              bottom of the funnel. Internal build, by contrast, is mostly theoretical for SMB merchants; the
              integration and maintenance burden makes it implausible as a common alternative.


              That means Epos Now wins or loses mostly against purpose-built software vendors and their ecosystems, not
              against bespoke technology teams.


              Another practical point is geography. Epos Now is selling from a UK base into the US, Canada, and
              Australia, while several larger rivals already operate with deeper local marketing, channel, and product
              resources. That does not eliminate Epos Now’s opportunity, but it does mean the company often enters
              buying processes where merchant expectations have already been shaped by bigger brands or more specialized
              restaurant incumbents.
