  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory risk is visible but not yet disqualifying
        blocks:
          - type: paragraph
            body: >-
              The strongest public adverse evidence in this run is customer-harm and complaint-related rather than a
              large regulatory enforcement action. The Financial Ombudsman decision matters because it shows a dispute
              severe enough to require corrected statements, delayed-payment remediation, and compensation. Combined
              with review and complaint platforms, it elevates service-quality and contract-handling risk from anecdotal
              noise to a real diligence topic.


              Data and payments compliance are also material. Epos Now’s privacy notice explicitly references
              controller/processor responsibilities, cross-border data handling, AML obligations, card-scheme
              requirements, and partner-bank arrangements. That is better than a shallow compliance posture, but it also
              confirms the company operates inside a non-trivial risk perimeter. The ICO registration and
              multi-jurisdiction language reinforce that this is a business with formal data-governance duties rather
              than a lightweight app vendor.


              No major public fine or enforcement action surfaced in this run, which is positive. Still, the absence of
              visible enforcement should be treated as an incomplete comfort, not as a full clean bill of health.


              The newly fetched legal terms sharpen this view rather than soften it. Epos Now’s terms and conditions
              highlight arbitration, hardware-return obligations, minimum transaction levels for payments-linked plans,
              early-termination economics, and explicit allocation of several operational responsibilities to the
              customer. Those provisions are not unusual for SMB infrastructure vendors, but they do show how
              commercial, compliance, and service risk can travel through contract design as well as through technology.
            claimRefs:
