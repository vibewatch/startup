  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The product is a merchant workflow stack, not just a POS terminal
        blocks:
          - type: paragraph
            body: >-
              Public materials consistently position Epos Now as more than a cash register replacement. The company
              sells a merchant operating stack spanning checkout, reporting, stock visibility, payments, support, and
              increasingly embedded finance. Hardware is part of the offer, not an incidental accessory, which matters
              because device deployment affects installation complexity, cost structure, and support burden.


              The most credible product story is therefore workflow-based. Merchants sell, sync activity back into
              reporting and stock tools, connect payments, and then expand into adjacent services such as capital or
              ecommerce. Customer-facing proof on pricing and success-story pages reinforces that interpretation by
              emphasizing ease of reporting, operational simplification, and stock control more than highly technical
              product language.


              This is a sensible design for SMB buyers. It makes the product easier to understand commercially, even if
              it leaves technical observers wanting more implementation detail.


              It also explains why the product can be attractive to independent merchants without a dedicated IT team. A
              modular but commercially legible stack lowers the burden of stitching together separate vendors for
              reporting, payments, loyalty, and funding. The downside is that a broad promise creates more dependency on
              smooth implementation and support across many surfaces.
