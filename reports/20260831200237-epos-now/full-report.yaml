      - number: '7.2'
        title: Operational and partner risks can transmit quickly into revenue and brand
        blocks:
          - type: paragraph
            body: >-
              POS and merchant-finance products fail in public. If the system is unreliable, if support is slow, or if
              billing creates distrust, merchants feel the pain during live trade. That is why the lack of a confirmed
              public status page matters, and why complaint-led sources deserve real weight. Review platforms still show
              many satisfied customers, but they also show how operational friction can become brand damage in a
              category where replacement decisions are triggered by frustration rather than by annual planning cycles
              alone.


              Partner dependency raises the stakes further. Adyen appears central to payments and embedded-finance
              workflows; Duda and other partners extend ecommerce, loyalty, or hardware breadth. These relationships
              expand the platform, but they also create concentration and integration risk. A partner incident,
              compliance breakdown, or commercial disagreement could affect merchant experience directly.


              Debt-backed growth compounds these concerns. The 2026 HSBC facility is a positive financing signal, yet it
              also adds leverage and leaves investors dependent on information they still do not have, such as cash
              burn, runway, and covenant headroom.


              The terms also underscore practical operating dependencies: internet reliability, network segregation,
              staff training, backups, and hardware condition are all pushed partly onto the merchant. That may be
              commercially sensible, but it complicates blame assignment after incidents and can intensify dispute risk
              if customer expectations were not set clearly at sale.
