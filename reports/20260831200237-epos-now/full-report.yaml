      - number: '2.3'
        title: Growth drivers are real, but so are SME adoption barriers
        blocks:
          - type: paragraph
            body: >-
              The policy and market environment in 2026 remains favorable to merchant-digitization vendors, but not in a
              simplistic straight line. UK public-policy materials repeatedly describe SME digital adoption as a live
              productivity issue. GOV.UK’s taskforce and supporting research point to uneven uptake, persistent
              awareness and skills gaps, and the continued need for support infrastructure. That is good for demand in
              one sense, because it means the market is not saturated. But it is also a caution, because vendors still
              need onboarding quality, clarity, and practical ROI to convert merchants that remain hesitant.


              The product drivers are clearer. Contactless payments, omnichannel order handling, remote reporting, and
              connected back-office workflows remain active category tailwinds in 2026. Embedded finance is becoming a
              second-order driver on top of those basics: Adyen’s work with Epos Now and its embedded-finance market
              research point to meaningful appetite for financial products inside software merchants already use. Yet
              even those drivers do not erase the harder constraints of contracts, support, and migration effort. SMBs
              may want better systems, but they still punish vendors that create billing confusion or operational
              downtime.


              The net takeaway is that Epos Now participates in a large, durable market, but its actual contest is local
              and operational. Share will be won at the workflow level — by fitting merchant jobs, easing changeover,
              and layering finance carefully — not by merely existing inside a large TAM.
