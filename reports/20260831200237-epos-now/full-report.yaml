      - number: '1.3'
        title: Scale signals are real, but several top-line metrics remain definition-sensitive
        blocks:
          - type: paragraph
            body: >-
              Third-party and partner sources broadly agree that Epos Now is a meaningful business, but they disagree on
              enough details to justify caution. Latka estimates 2025 ARR at $48.8 million and headcount around 444,
              while Tracxn shows headcount at 462 in July 2026. Adyen’s partnership materials say 80,000 SMB locations
              use Epos Now, that more than 9,000 businesses have used Epos Now Capital, and that 83% return for a second
              loan. Meanwhile, some Epos Now press and partnership materials refer to 100,000 merchants rather than
              80,000 locations. Those figures are directionally supportive of scale, but they also show that the
              company’s public metric definitions are not perfectly stable across pages and contexts.


              The adverse record is equally important for interpreting those scale signals. Mobile Transaction flags
              long contracts, support add-ons, and billing friction as real issues; the Financial Ombudsman upheld a
              complaint over inaccurate statements and delayed settlement; archived Trustpilot and complaint portals
              show recurring disputes over onboarding, refunds, cancellations, and support quality. None of that
              disproves the core company story, but it does warn investors not to confuse a broad customer base with
              uniformly low-friction service delivery.


              The right overview verdict is therefore balanced. Epos Now clearly exists at real scale, remains private,
              and has credible financing and embedded-finance traction. But the public record still stops short of the
              disclosure quality an investor would want before underwriting precise valuation, retention, or margin
              claims.
