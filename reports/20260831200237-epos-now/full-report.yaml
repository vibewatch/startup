      - - Audited revenue mix
        - Revenue by stream, geography, and cohort
        - Core input for valuation and scenario probabilities
        - Management / lender pack
      - - Retention and churn
        - GRR, NRR, logo churn, save rates
        - Needed to test installed-base quality
        - Customer success + finance review
      - - Payments and finance economics
        - Attach, take rate, loss rates, revenue share
        - Highest-value upside lever may also be the key risk
        - Product + partner diligence
      - - Facility terms
        - Covenants, headroom, use of proceeds, security
        - Debt can amplify downside if misunderstood
        - Lender / treasury diligence
      - - Operational resilience
        - Uptime history, complaint resolution, SLA metrics
        - Protects against paying growth multiples for brittle infrastructure
        - Ops + support diligence
      - - Governance and exit readiness
        - Audit discipline, reporting cadence, IPO readiness
        - Determines discount versus public comps
        - Board / CFO diligence
    notes: These asks should precede any serious price negotiation.
    claimRefs:
      - CV039
      - CV040
      - CV041
