      - number: '8.2'
        title: Scenarios matter more than single-point valuation math
        blocks:
          - type: paragraph
            body: >-
              Public sources do not provide enough clean data for a precise intrinsic valuation. They do provide enough
              to structure a decision tree. In the bull case, Epos Now compounds a broad installed base into deeper
              payments and embedded-finance economics, making the current private valuation easier to defend. In the
              base case, the company remains commercially real and continues growing, but investors insist on a discount
              to the unicorn aura until better disclosure is shared. In the bear case, service-quality issues, partner
              concentration, or leverage reveal a business less robust than headline positioning suggests.


              Public comparables help frame the discussion but should not be used mechanically. Block, Toast,
              Lightspeed, and NCR Voyix all provide useful directional context because they overlap with POS, merchant
              software, payments, or reporting discipline. Yet they are public companies with formal filing
              infrastructure and clearer market reference points. Epos Now is not. That disclosure asymmetry is itself a
              valuation variable, not a footnote.


              The practical result is that scenario thinking and price discipline matter more than apparent precision.


              The same logic applies to governance. Public filing and annual-report infrastructure do not make public
              companies cheap, but they do make them easier to underwrite. Epos Now should therefore be assessed not
              only against what merchant-platform comps do, but against the reporting burden those comps already meet
              every quarter.
