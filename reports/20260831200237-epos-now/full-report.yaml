      - number: '7.3'
        title: Execution quality determines whether manageable risks stay manageable
        blocks:
          - type: paragraph
            body: >-
              The remaining risks mostly collapse into one core question: can management execute cleanly enough to keep
              product breadth, partner dependence, and financing ambition from outrunning operational discipline? Hiring
              for engineering, platform, cloud, retention, and collections-related roles implies that these are active
              management problems, not solved background functions. That is not automatically negative; growth
              businesses should invest in these areas. It does mean the company’s outcome remains highly
              execution-sensitive.


              Competitive pressure from Square, Toast, and Lightspeed raises the bar further. Better-capitalized rivals
              can exploit moments when service quality slips or when merchants lose trust in pricing and support.
              Conversely, Epos Now’s broad installed-base proof, formal privacy posture, public support surface, and
              partner-quality signals are real mitigants.


              The right risk stance is therefore conditional rather than binary. Epos Now is not a walk-away purely from
              public evidence, but nor is it a company where investors should waive diligence on complaints, partner
              concentration, debt terms, or reliability evidence. Those are the kill zones that determine whether the
              upside survives contact with operations.


              For that reason, risk diligence should test not just whether policies and terms exist, but whether they
              are actually operationalized in support, implementation, and collections workflows. A company can have
              formal legal language and still accumulate avoidable trust damage if customers experience the relationship
              differently in practice.
