      - number: '1.2'
        title: Founder control, governance visibility, and capital milestones
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is one of the clearer points in the public record. Jacyn Heavens still anchors the
              company narrative, appears in official financing commentary, and remains listed in Companies House as an
              active director appointed at incorporation. The official origin story — Heavens building Epos Now after
              experiencing poor legacy till software firsthand — is obviously self-presented, but it also matches the
              registry evidence that the business has remained tied to the same founder from 2011 through the 2026
              filings. That is important because Epos Now’s current strategy still looks founder-shaped: move quickly,
              bundle more merchant services, and compete on ease, coverage, and support rather than on a single narrow
              module.


              The capital and governance record is visible but incomplete. Tech East reported Epos Now’s July 2024
              inclusion in the UK Unicorn Council, which only admits privately held fintechs valued above £1 billion,
              and Epos Now’s own June 2026 financing announcement repeated that milestone. In June 2026, the company
              disclosed a £90 million HSBC UK package made up of a £55 million committed revolving credit facility and a
              £35 million accordion. Companies House then showed three June 2026 charges, supporting the view that this
              was real secured debt rather than casual marketing copy. What is much less visible is the full
              equity-investor or board picture. Public sources do not clearly enumerate a venture-style cap table, a
              full board roster, or audited earnings that would let outsiders judge dilution or governance discipline
              with confidence.


              That gap matters because debt-backed growth and unicorn status are not the same as transparent
              investor-grade disclosure. Public evidence is strong enough to confirm Epos Now’s late-stage private
              status and lender confidence, but not strong enough to reconstruct its complete ownership map.
