  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: The model is broader than POS subscription revenue
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a business model that is broader than a simple POS subscription. Epos Now sells
              software, hardware, payment acceptance, and increasingly embedded-finance products layered into the
              merchant workflow. The official site emphasizes affordability and all-in-one functionality, while Adyen
              and Epos Now’s own financing communications make clear that payments and capital products are now central
              strategic surfaces rather than peripheral add-ons.


              That matters because the economics of merchant software often improve as more payment and finance
              attachment is captured inside the platform. Third-party sector evidence from Apideck’s embedded-finance
              report, plus public examples from Toast and Square, reinforces the pattern: software often acquires the
              customer, while financial products drive a disproportionate share of revenue and retention. Epos Now
              appears to be pursuing the same playbook, though without disclosing its own take rates or mix.


              The result is a financially interesting model but not a fully transparent one. List pricing establishes
              that subscription revenue exists, yet it does not show realized pricing, discounting, payment spreads, or
              finance monetization at merchant level.


              That pricing ambiguity is important because Epos Now is not operating in a category where merchants buy on
              software price alone. Hardware bundles, support coverage, processor economics, and capital-product
              eligibility can all change lifetime value materially. Without contract-level data, a cheap-looking entry
              plan cannot be assumed to translate into strong or weak unit economics.
