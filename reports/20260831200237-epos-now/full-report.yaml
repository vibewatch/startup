      - number: '4.3'
        title: Public disclosure is still the main blocker to underwriting confidence
        blocks:
          - type: paragraph
            body: >-
              The central financial limitation is not lack of ambition; it is lack of disclosure. This run found no
              public cash balance, monthly burn, runway, gross margin, contribution margin, CAC, payback, churn, or NRR.
              Instead, revenue context comes from directional third-party aggregators such as Latka and Growjo, which
              disagree on revenue levels and should be treated as rough outer bounds rather than underwriting-grade
              numbers.


              Those estimates are still useful in one sense: they indicate a company of real scale, supported by
              multi-geography operations, developer infrastructure, and active hiring for sales, retention, and
              engineering. They also suggest a sales-assisted motion rather than a purely self-serve SaaS model, which
              likely raises acquisition and support cost while opening the door to larger merchant relationships.
              Hardware deployment, support coverage, and payments compliance all reinforce that cost shape.


              The financial verdict is therefore mixed but investable only with discipline. Epos Now looks like a real
              merchant platform with credible financing access and meaningful fintech-attachment upside. It does not yet
              look like a company whose public record alone can support confident underwriting of revenue quality,
              margin durability, or runway without direct lender, management, or contract-level diligence.


              A disciplined investor should therefore insist on a lender-style financial pack before leaning on
              surface-level growth narratives. The public record is enough to say the platform is commercially real and
              strategically moving toward higher-value fintech attachment. It is not enough to conclude whether that
              strategy is already compounding efficiently.
