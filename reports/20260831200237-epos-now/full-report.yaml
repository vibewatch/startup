  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Illustrative range anchored to public evidence quality rather than to one false-precision market multiple.
    data:
      items:
        - label: Bear case valuation posture
          low: 1
          mid: 2
          high: 3
          unit: x confidence discount
          detail: High discount required if service, debt, or attach concerns dominate
        - label: Base case valuation posture
          low: 4
          mid: 6
          high: 8
          unit: x evidence score
          detail: Structured or discounted entry versus unicorn halo
        - label: Bull case valuation posture
          low: 8
          mid: 10
          high: 12
          unit: x evidence score
          detail: Only if audited economics and attach rates validate the story
    approximationNotes: >-
      These are illustrative posture bands, not live revenue multiples. They encode how much disclosure and execution
      proof would be required to pay tighter valuations.
