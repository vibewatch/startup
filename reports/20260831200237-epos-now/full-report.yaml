      - number: '5.3'
        title: Public evidence is stronger on product reach than on engineering transparency
        blocks:
          - type: paragraph
            body: >-
              Trust and operating-maturity evidence is mixed. The privacy policy is substantive and useful: it describes
              controller/processor roles, data-protection posture, and payments-specific compliance obligations
              involving AML, card schemes, and a third-party banking partner. That is better than generic marketing
              copy. Public engineering hiring is also a helpful signal that the company is still investing in software,
              platform, and cloud capabilities in 2026.


              Yet important technical questions remain unanswered publicly. This run did not confirm a dedicated
              real-time status page, broad security-certification detail, module-level changelog discipline, or explicit
              uptime and incident-response commitments. Review sources partly offset that by providing usability and
              service feedback, but they are not a substitute for formal reliability transparency. The chapter’s key
              tension is therefore straightforward: Epos Now looks real, connected, and commercially useful, but it is
              easier to see what the platform promises than to audit how robustly it delivers under the hood.


              That still leaves a workable product verdict. The platform appears coherent and extensible, with
              meaningful finance and integration depth. The diligence burden moves to internal architecture, reliability
              metrics, and partner-dependency management.


              For merchant software, that distinction matters. A product can feel complete to the buyer and still hide
              important engineering or dependency risks from the investor. Epos Now looks to be on the right side of
              product coherence; the remaining question is whether its internal operating discipline is as strong as its
              external workflow story.
