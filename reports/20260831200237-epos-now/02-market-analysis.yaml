  evidenceGaps:
  - type: missing-source
    severity: material
    topic: eposnow-specific-market-model
    missingEvidence: A management-built TAM, SAM, and SOM model with segment assumptions and attach-rate logic.
    whyItMatters: Public macro market reports are helpful context but do not show which portions Epos Now can actually win
      profitably.
    diligencePath: Request board or lender materials showing segment mix, geography, and conversion assumptions by vertical.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: market-boundaries
    missingEvidence: A single normalized framework that reconciles global POS, terminals, hospitality POS, and embedded-finance
      adjacency figures.
    whyItMatters: Investors can overstate opportunity by mixing incompatible category numbers without a clear boundary statement.
    diligencePath: Normalize external market reports into one scope and keep excluded spend explicit in the model.
    relatedQuestionRefs:
    - QM014
    - QM024
  - type: private-evidence-only
    severity: material
    topic: segment-win-rates
    missingEvidence: Actual win rates, sales-cycle lengths, and churn by merchant segment.
    whyItMatters: A growing category does not prove Epos Now can capture share efficiently across all subsegments.
    diligencePath: Review CRM cohort data and close-lost reasons by vertical, size, and geography.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
    - TM004
