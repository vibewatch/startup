chapter:
  number: 2
  title: Market Analysis
  summary: Epos Now participates in a large but definition-sensitive market where the relevant wedge is SMB merchant-operating
    software rather than all global POS spend. Public evidence supports continued category growth in 2026 and ongoing SME
    digitization needs, but also shows that switching friction, trust, and workflow fit still matter more than raw market
    size.
sections:
- id: boundary-and-sizing
  title: The right market boundary is narrower than headline POS TAM
  body: 'The temptation in a POS diligence case is to cite one very large global market number and stop there. That would
    be a mistake for Epos Now. The company does not sell into every form of commerce infrastructure, every retail-software
    budget, or every payments workflow. It sits in a narrower wedge where the point of sale is also the merchant operating
    layer: checkout, catalog and stock, staff coordination, reporting, and increasingly integrated financial services. That
    wedge overlaps with hardware and acquiring, but it is not identical to either one.


    Public market data confirms the category is large. Research and Markets projects the global point-of-sale market at roughly
    $64.61 billion in 2026, while The Business Research Company projects the POS terminals market above $118 billion in 2026
    and Research and Markets sizes hospitality POS software at about $9.16 billion in 2026. Those figures are not wrong, but
    they use different boundaries. Some include hardware heavily, some focus on software, and some narrow to hospitality.
    The correct analytical move is not to choose one number emotionally; it is to preserve the boundary differences and then
    ask which portion Epos Now can plausibly serve.


    That serviceable slice is still attractive. Epos Now’s own positioning across retail, hospitality, and multi-site merchants
    suggests it wants the cross-vertical SMB operator that needs one practical system, not just a simple card reader or a
    single-function app.'
