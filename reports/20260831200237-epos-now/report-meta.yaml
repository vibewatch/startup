companyProfile:
  summary: Epos Now is a Norwich-founded merchant technology company that sells cloud point-of-sale software, connected hardware,
    payments, and embedded-finance products to SMB retail and hospitality businesses. Public evidence supports meaningful
    geographic reach, real customer adoption, and growing fintech ambitions, while leaving core financial disclosure and governance
    visibility materially incomplete.
