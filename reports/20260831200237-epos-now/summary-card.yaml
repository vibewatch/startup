  topStrengths:
    - >-
      Broad merchant operating stack spanning POS, hardware, payments, and embedded finance rather than a single-feature
      SMB tool.
    - >-
      Real scale signals across 70+ countries, roughly 80,000 business locations, and visible customer adoption in
      retail and hospitality.
    - >-
      Fresh lender support via the June 2026 HSBC facility plus partner evidence that finance products already have
      meaningful user adoption.
  topRisks:
    - >-
      Audited revenue, margin, retention, concentration, and runway metrics remain materially under-disclosed in public
      sources.
    - >-
      Customer-service, billing, and complaint evidence shows trust can be damaged if support and contract execution
      slip.
    - >-
      Embedded-finance and payments strategy increases dependence on external partners and adds compliance and
      credit-risk complexity.
    - >-
      A unicorn headline risks overstating fair value if investors pay premium pricing before disclosure quality
      improves.
  unresolvedGaps:
    - Audited revenue mix, gross margins, and merchant cohort retention by geography and product line.
