  - - Payments / partner concentration
    - Partner incident affecting merchant workflows
    - Material payments or capital disruption
    - Escalate partner diligence and contingency planning
  - - Debt / financing dependence
    - Borrowing increases without disclosure improvement
    - Debt reliance grows while cash/runway remain opaque
    - Tighten valuation discipline or defer
  - - Competitive execution risk
    - Win rates worsen as support complaints rise
    - Evidence of churn to larger peers
    - Reassess moat and merchant stickiness
  - - Reliability transparency gap
    - No uptime / SLA evidence despite diligence requests
    - Management cannot provide operational assurance pack
    - Treat as thesis-break for operational confidence
  notes: These triggers convert a broad risk list into decision-useful monitors.
