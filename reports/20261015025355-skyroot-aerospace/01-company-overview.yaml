company:
  name: "Skyroot Aerospace"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Skyroot now has a real orbital proof point: third-party coverage and launch-tracking sources show
    Vikram-1 reached orbit in July 2026 after the company's 2022 Vikram-S suborbital milestone. The
    public narrative on funding and stature is stronger than the public operating disclosure, though:
    retained sources support unicorn status, named investors, and at least one commercial launch buyer,
    but they still do not quantify cumulative funding, revenue, headcount, backlog quality, or board
    control.
sections:
  - id: "identity-and-stage"
    title: "Identity and current stage"
    body: >-
      The assigned official surfaces position Skyroot as an on-demand launch provider selling the
      Vikram family for small-satellite missions, while independent launch tracking confirms the company
      has moved beyond suborbital proof into an orbital operating stage. The strongest ground-truth
      sequence is now consistent on the milestone itself: Mission Prarambh established an early launch
      credential in November 2022, and Vikram-1 reached orbit on July 18, 2026. The remaining caution
      is around specification consistency rather than existence. Skyroot's own site and Space Launch
      Schedule align on a 350 kg LEO / 260 kg SSO figure for Vikram-I, but one January 2026 profile
      published higher payload numbers, so later chapters should preserve source-specific numbers rather
      than assume a single uncontested canonical payload spec.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO006", "CO010"]
    tableRefs: ["TO001"]
    figureRefs: ["FO001"]
  - id: "founders-governance-and-control"
    title: "Founders, governance, and control surfaces"
    body: >-
      The retained public record is strong enough to anchor founding year, location, and at least part
      of the founder roster, but not strong enough to underwrite the full governance stack. Independent
      coverage ties Skyroot to Hyderabad and a 2018 start, with Pawan Kumar Chandana still serving as
      the most visible operator and spokesperson; one profile also names Naga Bharath Daka as the other
      co-founder. The official governance evidence in this worker pool is narrower. It shows a formal
      whistleblower commitment with confidentiality, investigation, and anti-retaliation language, but
      it does not disclose board composition, committee structure, investor rights, or succession depth.
      That means the chapter can support key-person dependence as a diligence theme, while treating
      board independence and control mechanics as unresolved.
    claimRefs: ["CO007", "CO008", "CO009", "CO014"]
    tableRefs: ["TO002"]
  - id: "capital-and-commercial-signals"
    title: "Capital signals and early commercial proof"
    body: >-
      Public evidence around Skyroot's financing story is directionally positive but still thin on the
      numbers that matter most for underwriting. IndiaToday reported that Skyroot became India's first
      space-tech unicorn in May 2026 and quoted Chandana saying the latest round was co-led by GIC and
      Sherpalo Ventures. Those facts establish external capital quality and a valuation threshold above
      $1 billion, but they do not disclose cumulative capital raised, exact post-money, dilution, or
      governance terms. The clearest commercial signal in the assigned pool is Reflect Orbital's
      purchase of two Skyroot launches, yet even that evidence withholds pricing and firm mission dates.
      Taken together, the retained sources show customer interest and investor support, but not backlog
      quality, revenue conversion, or margin structure.
    claimRefs: ["CO011", "CO012", "CO013", "CO016"]
    tableRefs: ["TO003"]
  - id: "execution-milestones-and-open-gaps"
    title: "Milestones, roadmap, and open diligence gaps"
    body: >-
      The evidence set supports a credible milestone spine from founding through orbital execution:
      2018 founding, the November 2022 Vikram-S test, Infinity Campus inauguration in late 2025,
      pre-launch orbital positioning in early 2026, unicorn status in May 2026, and orbital success in
      July 2026. Just as important, the same retained sources preserve the uncertainty around that
      progress. Launch-tracking records show the orbital debut moved several times before lifting off,
      and the assigned public pack still leaves core cover metrics blank: there is no corroborated
      public number here for cumulative capital raised, revenue or run-rate, headcount, broad customer
      count, or backlog conversion. The result is a company with stronger technical and signaling
      evidence than operating disclosure evidence.
    claimRefs: ["CO005", "CO006", "CO010", "CO013", "CO015", "CO016"]
