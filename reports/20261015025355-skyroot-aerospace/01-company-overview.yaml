callouts:
  - calloutType: "strength"
    title: "Orbital proof is now real"
    body: >-
      Skyroot is no longer only a pre-launch story: retained independent evidence shows a suborbital
      milestone in 2022 and a successful first orbital mission in July 2026, which materially upgrades
      its credibility versus earlier roadmap-only positioning.
    claimRefs: ["CO006", "CO010"]
  - calloutType: "risk"
    title: "Public signaling is ahead of public economics"
    body: >-
      Unicorn status, named investors, and one disclosed launch buyer are meaningful positives, but the
      assigned public evidence still does not show cumulative funding, revenue, headcount, pricing, or
      backlog conversion quality, so diligence cannot infer operating leverage from the headline status.
    claimRefs: ["CO011", "CO012", "CO013", "CO016"]
