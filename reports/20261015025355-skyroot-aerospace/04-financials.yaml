      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Realized revenue / ARR, null, low, "Without booked revenue by mission type, revenue quality and repeatability cannot be underwritten", "Monthly recognized revenue, deferred revenue, and mission-level billing history"]
      - [Gross margin per launch, null, low, "Gross margin determines whether launch cadence can self-fund operations", "Per-launch cost stack including propulsion, range, logistics, insurance, and mission operations"]
      - [Cash balance and runway, null, low, "Capital adequacy cannot be judged from cumulative funding alone", "Latest cash balance, monthly burn, runway bridge, and minimum-cash policy"]
      - [Debt burden, "$10.75M NCD financing in March 2026", medium, "Debt introduces fixed obligations that could tighten runway if launch cadence slips", "Coupon, maturity, collateral, covenants, and amortization profile"]
      - [Public backlog proxy, "Two Reflect Orbital launches disclosed; price and flight timing withheld", medium, "Named demand matters, but backlog quality depends on value, schedule, and cancellation protections", "Signed backlog by launch year, deposits, cancellation rights, and customer concentration"]
      - [Cadence target, "4-6 launches this financial year; 72-hour assembly goal; one rocket per month production target", medium, "Cadence drives fixed-cost absorption and potential revenue run rate", "Actual throughput, bottlenecks, working-capital needs, and capex to reach steady cadence"]
    notes: Null means the public source pool did not disclose the metric; non-null rows are proxies rather than audited unit-economics outputs.
