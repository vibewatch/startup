company:
  name: Skyroot Aerospace
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a credible launch-services revenue model and unusually strong access to growth capital, but it still does not show realized
    launch revenue, gross margin, cash runway, or a contract-backed backlog large enough to underwrite the current scale plan. The near-term financial
    question is therefore less whether Skyroot can raise capital and more whether Vikram-1 can convert development-flight momentum into repeatable,
    profitable launch cadence before more capital is required.
sections:
  - id: monetization-and-commercial-status
    title: Monetization and commercial status
    body: >-
      Skyroot's public monetization story is centered on launch services rather than software-like recurring revenue. Brandhopper attributes list pricing of
      $12-18 million for a dedicated Vikram-1 mission, $2-5 million for a 50-100 kg rideshare slot, and additional mission-services revenue, but those are
      list or scenario figures rather than realized contract economics. Public evidence also shows the business is not yet in steady-state commercial
      operations: Brandhopper describes the July 2026 Vikram-1 orbital flight as the first of three development missions before 2027 commercial service,
      while PayloadSpace's reported Reflect Orbital deal is the clearest named demand signal and still omits contract value and mission timing. That means
      the chapter can explain how the revenue engine is supposed to work, but cannot yet confirm conversion from public pricing to booked revenue or cash
      collection.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI013
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: scale-proxies-and-unit-economics
    title: Scale proxies and unit-economics visibility
    body: >-
      The available operating proxies are ambitious but still management- or commentator-led rather than audited operating data. Via Satellite reports a
      target of four to six launches in the financial year, with management caveating that cadence may change after the first flight, and also cites a
      72-hour assembly-to-launch goal supported by a 250,000 square foot Hyderabad footprint. Brandhopper layers on a one-rocket-per-month production
      target and an illustrative $144-216 million annual dedicated-launch run-rate scenario, but that scenario is explicitly dependent on achieving both
      cadence and list pricing. These disclosures are directionally useful for modeling fixed-cost absorption and market ambition, yet they leave core unit
      economics blank: no public source in the pool discloses CAC, sales cycle, deposit structure, launch gross margin, insurance burden, or working-capital
      intensity.
    claimRefs:
      - CI009
      - CI010
      - CI012
      - CI014
      - CI015
    tableRefs:
      - TI003
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      On funding, the evidence is stronger than on revenue quality. Satellite Today and Moneycontrol both report a May 2026 $60 million round that lifted
      total funding to roughly $160 million and valuation to $1.1 billion, while Clay's April 2026 dossier still showed only about $109 million of
      disclosed funding before the later Series C announcements. The same sources show that Skyroot added debt in March 2026 via a ₹100 crore
      non-convertible-debenture placement and intends to spend fresh capital on launch cadence, manufacturing expansion, and Vikram-2 development. That
      combination indicates continued access to equity and debt capital, but it still does not answer the underwriting questions that matter most: current
      cash balance, debt terms, monthly burn, per-launch gross profit, cancellation protections on backlog, or how many more developmental flights the
      company can fund before recurring launch revenue becomes dependable.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI011
      - CI014
