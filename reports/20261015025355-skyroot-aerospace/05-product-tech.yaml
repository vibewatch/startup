  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: mission-assurance
      missingEvidence: Public mission-assurance materials covering subsystem qualification, failure-response process, launch insurance assumptions, and customer SLA commitments for repeat launches.
      whyItMatters: Launch buyers need more than one successful mission to underwrite reliability, schedule certainty, and recourse if a launch slips or fails.
      diligencePath: Request the latest qualification matrix, anomaly-closeout package from Mission Aagaman, and standard commercial launch contract terms.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: launch-cadence
      missingEvidence: Externally verified schedule, payload manifest, and readiness gates for the second and third Vikram-1 flights.
      whyItMatters: The investment case depends on moving from milestone hardware to repeatable launch throughput, and public roadmap claims are not enough.
      diligencePath: Obtain signed launch manifests, range-approval milestones, and vehicle-closeout timelines for the next two flights.
      relatedQuestionRefs: [QE005]
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Public documentation of quality certifications, supplier-acceptance controls, cybersecurity posture, export-control process, and payload-integration assurance for customers.
      whyItMatters: Product trust in launch services depends on governance and process controls as much as on rocket performance.
      diligencePath: Request QA manuals, key certifications, supplier audit summaries, payload ICDs, and security/compliance documentation used in customer diligence.
      relatedQuestionRefs: [QE008]
