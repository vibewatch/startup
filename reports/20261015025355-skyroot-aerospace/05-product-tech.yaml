artifact: product-tech
slug: skyroot-aerospace
runDate: 2026-10-15
company:
  name: Skyroot Aerospace
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Skyroot has moved beyond concept-stage launch hardware: Vikram-1 reached orbit on its July
    2026 debut, public sources describe a four-stage small-launch architecture with 350 kg LEO
    capacity, and the next vehicle is already being sold and built. The technical story is real but
    still early, because public evidence supports first-flight capability and manufacturing intent
    far better than repeatability, mission assurance, or externally documented quality controls.
sections:
  - id: vehicle-family
    title: Launch vehicle family and delivered product
    body: >-
      The delivered product is not a generic "space platform"; it is a family of small-launch
      services anchored on Vikram-1 and stretched upward through the marketed Vikram-1U and
      Vikram-2 roadmap. Public reporting shows Vikram-1 reached orbit on its first mission in July
      2026, carried multiple customer and demonstration payloads, and is sold around a 350 kg to
      LEO / 260 kg to SSO performance envelope rather than an open-ended heavy-lift promise.
      Skyroot's nearer-term monetizable assets also include launch-adjacent hardware and
      space-systems components, which matters because the company is still proving repeat launch
      cadence while already selling orbital access windows and related hardware output.
    claimRefs: [CE001, CE005, CE006, CE008, CE010, CE011, CE014]
    tableRefs: [TE001, TE002]
  - id: architecture-and-operations
    title: Architecture, manufacturing, and deployment model
    body: >-
      The public architecture is specific enough to describe a real operating stack. Independent
      sources consistently frame Vikram-1 as a carbon-composite launcher that uses three solid
      propulsion stages followed by a liquid upper stage for orbital insertion, while Skyroot's
      broader technology stack extends to in-house solid, liquid, and cryogenic propulsion families.
      Manufacturing and deployment are also no longer abstract: Infinity Campus is presented as the
      orbital-vehicle factory, the second Vikram-1 hardware has already shipped from that site, and
      launch operations still depend on ISRO-linked national spaceport infrastructure for present
      missions and planned high-inclination expansion.
    claimRefs: [CE002, CE003, CE004, CE012, CE015, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-risks
    title: Maturity, roadmap, and product risks
    body: >-
      The core product risk is not whether Skyroot can build interesting hardware; it is whether the
      company can turn a successful debut into a repeatable launch service with enough mission
      assurance to win sustained commercial payload demand. The public roadmap still contemplates
      additional development flights before full commercialization, while the marketed Vikram-1U and
      Vikram-2 variants extend capability before external sources show completed qualification. That
      leaves diligence focused on repeat-flight reliability, quality gates, turnaround bottlenecks,
      launch-operations dependency on public infrastructure, and the absence of public service-level
      or trust-control disclosures that sophisticated launch buyers would usually want. The public
      record is milestone-rich, but still qualification-light for buyers.
    claimRefs: [CE007, CE009, CE010, CE011, CE013, CE016]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset / product line
      - User / buyer
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - [Vikram-S suborbital demonstrator, Internal proof and ecosystem signaling, Flown in 2022 and now legacy proof point, First privately built Indian rocket to reach space and precursor to later propulsion and avionics stack, Does not prove orbital cadence or commercial payload operations]
      - [Vikram-1 orbital launcher, Smallsat operators and rideshare payload customers, Reached orbit on first flight in July 2026; still in early operational proof, Carbon-composite small launcher with three solid stages plus liquid upper-stage insertion and 350 kg LEO capacity, Public record still lacks repeat-flight reliability and disclosed service-level metrics]
      - [Vikram-1U upgraded launcher, Operators needing more payload than baseline Vikram-1, Marketed and sold ahead of first public mission, Adds strap-on boosters and higher payload class while staying inside same family, No public qualification evidence or completed-flight proof yet]
      - [Vikram-2 roadmap launcher, Customers needing heavier dedicated small-launch capacity, In development for late-2027 target, Extends family toward roughly 900 kg LEO with cryogenic upper-stage architecture, Timeline and subsystem qualification still depend on future test evidence]
    notes: Public product-line snapshot from independent reporting; status reflects public milestone maturity, not a contracted performance guarantee.
    claimRefs: [CE001, CE006, CE010, CE011, CE014]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - [Get a small payload to a dedicated orbit without waiting for a large rideshare manifest, Buy a dedicated or semi-dedicated launch slot from an established provider, Vikram-1 dedicated launch service, Public sources cite ~350 kg LEO capability and successful debut payload deployment, Repeatability and on-time cadence remain unproven]
      - [Secure a rideshare window in India-linked launch infrastructure, Compete for scarce global small-launch or rideshare inventory, Vikram-1 rideshare windows listed for Q4 2026 and Q1 2027, Public sales pages and independent reporting show near-term sellable windows, Window availability does not equal completed commercial service]
      - [Book more payload mass without moving to a much larger rocket, Combine payloads or wait for alternative vehicles, Vikram-1U upgrade path, Public reporting says ~550 kg LEO capability is intended for the upgraded variant, First mission timing and qualification remain roadmap claims]
      - [Source launch-adjacent space hardware before launch cadence matures, "Buy structures, adaptors, or propulsion hardware from specialist suppliers", Space-systems hardware business alongside launch vehicles, Public FY26 reporting shows hardware revenue and order book outside launch services, "Evidence does not separate margins, recurring mix, or customer concentration"]
    notes: Benefits reflect public payload-capacity, booking, and milestone disclosures; commercialization and realized schedule quality remain open diligence items.
    claimRefs: [CE001, CE005, CE007, CE008, CE010]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Carbon-composite primary structure, Lowers mass and supports faster manufacturing claims for launch vehicles, In-house composite design and fabrication capacity at Hyderabad campuses, Public sources do not disclose independent structural qualification data]
      - [Kalam solid-motor stages, Provide primary ascent thrust across the lower stages, "Propellant manufacturing, stage testing, and repeatable production quality", Stage performance is milestone-backed but cadence proof is still limited]
      - [Raman liquid upper-stage insertion, Delivers orbital insertion and deployment flexibility after solid ascent, Upper-stage ignition reliability and integration with payload deployment sequence, One successful orbital mission is encouraging but not yet a reliability distribution]
      - [Dhawan cryogenic propulsion roadmap, Enables Vikram-2 payload-class expansion beyond current vehicle limits, Successful cryogenic development and integration into a future flight article, Public evidence is still developmental and timeline-sensitive]
      - [Infinity Campus plus launch-site integration flow, Moves hardware from Hyderabad manufacturing into Sriharikota launch operations, "Factory throughput, transport, range access, and final integration approvals", One-rocket-per-month ambition is not yet backed by demonstrated delivered cadence]
    notes: This architecture table mixes verified hardware layers with roadmap subsystems; risks capture what public sources still do not verify externally.
    claimRefs: [CE002, CE003, CE004, CE009, CE012]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public evidence shows a concrete launch stack from manufacturing through orbital service, but only the baseline vehicle has completed a flight.
    data:
      layers:
        - label: Commercial launch offer
          detail: Dedicated and rideshare smallsat launches sold around specific LEO/SSO payload envelopes.
          outputs:
            - Vikram-1 dedicated launch
            - Vikram-1 rideshare windows
            - Future heavier-family offers
        - label: Vehicle family
          detail: Baseline orbital launcher is operationally demonstrated once; upgraded variants are marketed but not yet flight-proven.
          modules:
            - Vikram-1
            - Vikram-1U
            - Vikram-2
        - label: Orbital insertion layer
          detail: Liquid upper-stage capability supports orbital insertion and payload deployment after solid ascent.
          modules:
            - Restartable upper stage
            - Payload deployment sequence
        - label: Primary propulsion stack
          detail: Public reporting consistently describes three solid ascent stages as the core lift architecture.
          modules:
            - Kalam-1200
            - Kalam-250
            - Kalam-100
        - label: Manufacturing and test base
          detail: Hyderabad campuses anchor composite fabrication, propulsion work, integration, and next-vehicle buildout.
          modules:
            - Infinity Campus
            - Max-Q campus
        - label: Launch and range infrastructure
          detail: Current operations depend on national spaceport access and future expansion into a second integration corridor.
          outputs:
            - Sriharikota launch access
            - Thoothukudi / Kulasekarapattinam expansion path
    approximationNotes: Public architecture is synthesized from milestone reporting and sales disclosures; subsystem-level qualification data is not fully public.
    claimRefs: [CE002, CE003, CE004, CE010, CE011, CE012]
callouts:
  - calloutType: strength
    title: Real hardware milestone, not just concept branding
    body: >-
      Vikram-1's orbital debut and the shipment of second-flight hardware make the product stack
      materially more credible than a pre-launch startup narrative, even if commercial cadence is
      still being proven.
    claimRefs: [CE001, CE004, CE014]
  - calloutType: risk
    title: Repeatability is still the gating technical proof
    body: >-
      Public evidence shows first-flight success and a marketed roadmap, but buyers still lack
      public mission-assurance, reliability-distribution, and service-level evidence for repeat
      launches.
    claimRefs: [CE009, CE010, CE013]
