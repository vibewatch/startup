  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: A reconciled third-party market model that isolates the launch segment inside India's broader space-economy estimates.
      whyItMatters: Conflicting top-down sector figures can make valuation narratives look more precise than the public evidence actually supports.
      diligencePath: Request the underlying Arkam methodology and compare it against government sector definitions before using either figure as a valuation anchor.
    - type: private-evidence-only
      severity: material
      topic: pricing-and-backlog
      missingEvidence: Named customers, launch pricing, backlog by mission type, and renewal or repeat-booking data.
      whyItMatters: Demand quality matters more than macro sector growth if Skyroot is to convert technical milestones into durable revenue.
      diligencePath: Ask management for booked launches, option structures, average selling price, cancellation terms, and customer concentration by segment.
    - type: missing-source
      severity: material
      topic: sam-som
      missingEvidence: A public serviceable market estimate for dedicated small-launch missions that separates Skyroot's likely wedge from India's total space-economy value.
      whyItMatters: Without a constrained SAM/SOM, public market sizing overstates the precision of valuation-relevant demand.
      diligencePath: Build a bottoms-up model from target satellite classes, likely launch cadence, orbit types, and disclosed customer mission profiles.
