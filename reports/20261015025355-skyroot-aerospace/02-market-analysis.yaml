company:
  name: Skyroot Aerospace
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Skyroot's practical market is narrower than the headline India space-economy narrative: the
    company is competing for dedicated small-satellite launch demand where schedule certainty,
    orbit control, and sovereign access matter. Public sources support strong macro tailwinds and
    real early buyer interest, but they do not yet isolate Skyroot's serviceable obtainable market,
    pricing, or recurring contracted backlog.
sections:
  - id: market-boundary
    title: Market boundary and the actual wedge
    body: >-
      The broadest available market narratives describe a fast-forming Indian private-space
      ecosystem, but that is not the same thing as Skyroot's addressable revenue pool. Public
      evidence points to a narrower wedge: dedicated launch services for small satellites, first in
      India and then internationally, where customers value schedule certainty, orbit control, and a
      domestic launch option. Vikram-1's 350 kg LEO profile anchors that wedge much more clearly
      than the much larger sector-value estimates cited for Indian space overall. That distinction is
      important for valuation work because the company can benefit from the sector's policy opening
      and investor momentum without capturing more than a small slice of the broad "space economy"
      figures cited in public reporting.
    claimRefs: [CM001, CM002, CM003, CM004, CM015, CM016]
    tableRefs: [TM001]
  - id: buyers-and-demand
    title: Buyer segments and demand signals
    body: >-
      The clearest public buyer signal is not a disclosed multiyear backlog but the combination of
      demo payload demand, explicit schedule-certainty messaging, and one disclosed two-launch
      purchase from Reflect Orbital. Independent reporting suggests Skyroot may start with domestic
      demand while also marketing to global operators that want dedicated insertion rather than
      rideshare delay. That points to several buyer classes: Indian startups and sovereign missions
      seeking domestic access, global small-satellite operators seeking timing and orbital precision,
      and niche constellations willing to pay for reserved capacity when launch supply tightens. The
      market logic is therefore buyer-workflow specific, not a generic "all space spending" story.
    claimRefs: [CM002, CM003, CM010, CM011, CM015]
    tableRefs: [TM003]
  - id: sizing-and-constraints
    title: Sizing lenses, drivers, and constraints
    body: >-
      Public sizing data is useful mainly as a set of lenses rather than a clean TAM/SAM/SOM stack.
      Government-linked reporting cited by IEEE Spectrum puts India's space sector at US$8.4
      billion, while Business Today cited an Arkam Ventures estimate of roughly US$13 billion today
      and nearly US$40 billion by 2030; these figures are directionally supportive but not directly
      comparable. More decision-relevant are the launch-specific signals: Business Today reported
      that small satellites account for more than 75% of global launches, and that 219 private
      launches were expected in 2025 while only 33 were serviced by providers outside China and
      SpaceX. Those indicators support a real demand backdrop for dedicated small launch, but the
      adoption constraints are equally material. Skyroot has only one orbital launch on the board,
      cadence is unproven, and independent observers explicitly question whether demand is deep
      enough to support several Indian private launch companies at once.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM009, CM012, CM013, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Primary buyer / payer
      - Relevance
    rows:
      - - Dedicated small-satellite launch services
        - Launch fees, mission integration, and reserved orbital insertion for payloads that fit small-lift profiles
        - Satellite manufacturing, downstream analytics, and non-launch space software revenue
        - Satellite operators, constellation startups, and sovereign mission owners
        - Closest match to Skyroot's currently disclosed product and buyer value proposition
      - - Global dedicated launch alternative to rideshare
        - Faster launch access and orbit-specific missions for customers avoiding shared manifests
        - Missions comfortable with generic rideshare timing or very large launch vehicles
        - Global smallsat operators and mission procurement teams
        - Export upside if Skyroot can prove cadence and reliability
      - - India space economy headline lens
        - Broad launch, satellite, infrastructure, and space-application activity counted in sector-value estimates
        - Not all sectors are monetizable by a launch provider
        - Mixed public and private budgets
        - Useful as context only, not as Skyroot's direct TAM
      - - ISRO-enabled private launch ecosystem
        - Access to facilities, testing, and ecosystem infrastructure that makes private launch feasible
        - End-customer launch revenue
        - Government institutions and the private vendors they enable
        - Market enabler rather than a standalone revenue pool
    notes: >-
      Boundary table mixes sourced facts with analyst synthesis to distinguish Skyroot's product
      wedge from broader ecosystem or policy context.
    claimRefs: [CM001, CM002, CM003, CM004]
  - id: TM002
    title: TAM/SAM/SOM or sizing lens table
    columns:
      - Publisher / lens
      - Year
      - Geography
      - Value / indicator
      - Methodology lens
      - Confidence
      - Limitation
    rows:
      - - IEEE Spectrum citing government estimate
        - "2026"
        - India
        - US$8.4B space-sector value
        - Broad current sector estimate
        - medium
        - Includes far more than the launch segment Skyroot can address directly
      - - Business Today citing Arkam Ventures
        - "2026"
        - India
        - ~$13B sector value today
        - Venture market-sizing lens
        - medium
        - Not directly comparable to the government estimate above
      - - Business Today citing Arkam Ventures
        - "2030"
        - India
        - ~$40B sector value by 2030
        - Forward scenario for sector expansion
        - low
        - Projection rather than booked or current demand
      - - Business Today launch-supply indicator
        - "2025"
        - Global
        - 219 expected private launches; 33 serviced outside China and SpaceX
        - Independent launch-capacity gap signal
        - medium
        - Operational indicator, not a revenue TAM
      - - Business Today demand-mix indicator
        - "2026"
        - Global
        - Small satellites are >75% of global launches
        - Payload-class demand proxy
        - medium
        - Share of launches, not spend or margin
    notes: >-
      Public sources do not isolate Skyroot's SAM or SOM, so this table preserves multiple sizing
      lenses and their limitations instead of presenting a false precision number.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM014]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer / budget owner
      - Workflow / need
      - Adoption trigger
    rows:
      - - Indian startup missions
        - Domestic satellite startups and mission founders
        - Engineering and mission-operations teams
        - Venture-backed program budgets
        - First orbital access, demo payload deployment, and domestic launch coordination
        - Faster local launch access after reforms opened ISRO-linked infrastructure
      - - Global smallsat operators
        - Constellation or single-satellite operators
        - Payload and mission-planning teams
        - Operator procurement or program office
        - Dedicated orbit and timing rather than rideshare delay
        - Schedule certainty when shared launch capacity is constrained
      - - Sovereign and defense-linked users
        - Government or strategic mission sponsors
        - Mission operators and public-space agencies
        - Public budgets
        - Domestic launch access tied to sovereignty and resilience needs
        - Strategic autonomy in communications, disaster response, logistics, and security
      - - Specialty constellation operators
        - Niche commercial operators such as Reflect Orbital
        - Constellation deployment teams
        - Mission-specific program capital
        - Reserved dedicated launches for time-sensitive deployment plans
        - Launch-capacity shortages and need for launch-slot certainty
    notes: >-
      Buyer map is an evidence-backed synthesis from reported payloads, operator quotes, and public
      policy narratives; Skyroot has not publicly disclosed segment-by-segment revenue mix.
    claimRefs: [CM003, CM010, CM011, CM015]
figures:
