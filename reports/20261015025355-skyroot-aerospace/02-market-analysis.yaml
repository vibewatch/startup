    title: Market sizing lens
    type: pyramid
    summary: Public market evidence supports a layered opportunity narrative, but not a precise public SAM/SOM for Skyroot.
    data:
      items:
        - label: Global space economy backdrop
          value: $1T+
          unit: next decade
          note: India Today described this as the broadest macro ceiling for the sector.
          claimRefs: [CM014]
        - label: India space sector (government lens)
          value: $8.4B
          unit: current estimate
          note: IEEE Spectrum cited a government estimate for the overall sector.
          claimRefs: [CM005]
        - label: India space sector (Arkam current lens)
          value: ~$13B
          unit: current estimate
          note: Business Today cited Arkam Ventures and produced a higher current market lens.
          claimRefs: [CM006, CM007]
        - label: India space sector (Arkam 2030 scenario)
          value: ~$40B
          unit: 2030 projection
          note: Forward scenario, not current addressable demand.
          claimRefs: [CM006]
        - label: Small-satellite demand mix
          value: ">75%"
          unit: share of global launches
          note: Supports Skyroot's payload-class focus rather than a broad all-space wedge.
          claimRefs: [CM008]
        - label: Dedicated-launch supply gap
          value: 219 vs 33
          unit: expected 2025 private launches vs serviced launches outside China and SpaceX
          note: Signals why launch-slot certainty matters to buyers.
          claimRefs: [CM009, CM010]
        - label: Skyroot's current product wedge
          value: 350 kg
          unit: Vikram-1 LEO capacity
          note: Public evidence still does not isolate Skyroot's pricing, SAM/SOM, or multiyear backlog.
          claimRefs: [CM002, CM012]
    approximationNotes: >-
      Ordered from broadest sector context to the closest publicly supported Skyroot demand lens;
      these layers are not a strict TAM/SAM/SOM waterfall because the public sources mix sector
      value estimates, payload-class demand indicators, and supply-gap proxies.
    claimRefs: [CM002, CM005, CM006, CM007, CM008, CM009, CM010, CM014, CM016]
callouts:
  - calloutType: insight
    title: The real wedge is dedicated small launch, not the whole space economy
    body: >-
      The headline India space-sector numbers are useful for momentum, but Skyroot's investable
      market case depends on whether it can win dedicated small-satellite launches where timing,
      orbit specificity, and domestic launch access matter.
    claimRefs: [CM001, CM002, CM005, CM006]
  - calloutType: risk
    title: Demand exists, but depth and repeatability are still unproven
    body: >-
      Public demand signals now include one disclosed two-launch purchase and clear supply-gap
      language, yet independent observers still question whether multiple Indian private launch
      companies can all find enough sustained demand.
    claimRefs: [CM009, CM010, CM012, CM013]
