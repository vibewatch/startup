company:
  name: Skyroot Aerospace
chapter:
  number: 7
  title: Risks
  summary: >-
    Skyroot has crossed the first-orbit threshold, but one recorded orbital success does not yet
    establish repeatable reliability, launch cadence, or manufacturing yield. The most material
    residual risks are execution at scale, dependence on public launch and test infrastructure,
    opaque customer economics and capital obligations, and regulatory or export-control evidence
    that remains unavailable in the assigned public-source set.
sections:
  - id: ranked-risk-profile
    title: Ranked risk profile and investment implication
    body: >-
      The central risk has shifted from whether Vikram-1 can reach orbit to whether Skyroot can
      repeat that result safely and economically. The available launch record shows one orbital
      launch and one success, while management has described a much faster production and launch
      ambition. That gap makes cadence and reliability a high-impact, medium-likelihood residual
      risk rather than a proven weakness: there is no recorded failure in the retained evidence,
      but there is also no multi-flight reliability history. Capital risk ranks next because the
      latest financing included structured debt while revenue, backlog, and contract economics
      remained undisclosed. Regulatory, export-control, facility, and supplier risks are material
      but not quantifiable from the public record reviewed here. The investment implication is to
      condition conviction on repeat missions, auditable customer conversion, and documentary
      approval evidence rather than on the valuation milestone or a single successful flight.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal-and-safety
    title: Regulatory, legal, export-control, and safety exposure
    body: >-
      The allocated sources indicate that IN-SPACe handled launch authorization and that India has
      opened public facilities to private launch companies, but the source set does not include the
      underlying authorization, license conditions, environmental approvals, range-safety record,
      insurance terms, or an authoritative company-specific export-control determination.
      Wassenaar materials establish that participating states use national policies to control
      transfers of conventional arms and dual-use goods and technologies; they do not establish a
      Skyroot violation or even the precise controls applicable to each vehicle, component, or
      customer. The UNOOSA page fetched for the Outer Space Treaty currently redirects to a general
      page warning that some registry submissions are unavailable, so it cannot close treaty or
      registration diligence. No retained source identifies litigation, enforcement, sanctions, or
      a safety incident, but absence from this bounded pool is not evidence that none exists.
    claimRefs: [CR008, CR009, CR010, CR011]
    tableRefs: [TR001]
  - id: operational-quality-and-scale
    title: Operational reliability, quality, and industrialization
    body: >-
      Vikram-1's recorded July 2026 mission reached a successful payload-deployment outcome, which
      materially lowers technical feasibility risk. It does not resolve repeatability, launch
      insurance, quality escape, or ramp risk. Management stated before the flight that Skyroot
      aimed for four to six launches in the financial year, subject to launch-port availability,
      manufacturing readiness, and observations from the first mission. The same interview claimed
      installed capacity for twelve rockets per year and acknowledged that scaling requires a
      transition from an R&D organization to a production organization. Public evidence in the
      assigned pool does not disclose yield, supplier defect rates, test acceptance criteria,
      anomaly history, insurance premiums, or the post-flight cadence plan. A competitor's own
      marketing page claims a much larger flight history, but that company-issued comparison is a
      maturity reference only, not an independent performance benchmark.
    claimRefs: [CR004, CR005, CR006, CR007, CR015]
    tableRefs: [TR002]
  - id: dependencies-financial-and-monitoring
    title: Partner, facility, customer, and financial dependencies
    body: >-
      Skyroot's execution model relies on infrastructure and counterparties outside the company.
      The recorded orbital mission used the Satish Dhawan Space Centre, and secondary reporting
      describes ISRO support spanning test, integration, safety, and launchpad functions. A planned
      294.67-acre integrated facility could reduce capacity constraints, but it adds a construction,
      commissioning, permitting, and capital-allocation program before that mitigation is proven.
      Reflect Orbital's purchase of two launches is useful demand evidence, yet price and mission
      dates were not disclosed, preventing assessment of cancellation protection, margin, or timing.
      The financing mix supplies growth capital but includes structured debt, while cash balance,
      runway, debt covenants, backlog quality, and launch-level unit economics remain private.
      Monitoring should therefore focus on consecutive mission outcomes, schedule intervals,
      facility milestones, customer deposits and cancellations, insurance availability, and
      liquidity headroom. A thesis break would be a serious safety event, approval suspension,
      repeated mission delay or failure, loss of infrastructure access, or financing stress before
      repeatable commercial cadence is demonstrated.
    claimRefs: [CR001, CR002, CR003, CR008, CR009, CR012, CR013, CR014]
    tableRefs: [TR003]
