  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: launch-authorization
      missingEvidence: >-
        Primary IN-SPACe authorization, license conditions, range-safety closeout, environmental
        approvals, payload registration responsibilities, and insurance requirements.
      whyItMatters: >-
        These records determine whether launches can continue, what conditions can suspend
        operations, and which liabilities remain with Skyroot.
      diligencePath: >-
        Obtain the complete approval and renewal package, regulator correspondence, range-safety
        closeout, insurance binders, and a counsel-prepared compliance matrix.
      relatedQuestionRefs: [QR001, QR008]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: export-controls
      missingEvidence: >-
        Company-specific export classifications, licenses, customer-screening controls, sanctions
        checks, technology-control plans, and compliance audit results.
      whyItMatters: >-
        International customers and dual-use technology can expose missions, components, and data
        transfers to national controls not established by the general framework source.
      diligencePath: >-
        Commission specialist export counsel to review the product-by-jurisdiction matrix and test
        a sample of international customer and supplier files.
      relatedQuestionRefs: [QR001, QR008]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: >-
        Flight-readiness reviews, anomaly logs, acceptance criteria, reliability model, launch
        insurance terms, post-flight report, and schedule for consecutive missions.
      whyItMatters: >-
        A single successful mission cannot quantify failure probability or demonstrate repeatable
        commercial cadence.
      diligencePath: >-
        Review independent mission-assurance materials and trend consecutive flight outcomes,
        anomaly closure, premiums, and launch intervals.
      relatedQuestionRefs: [QR002, QR006]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: supplier-dependency
      missingEvidence: >-
        Bill-of-materials concentration, sole-source components, supplier qualification, inventory
        buffers, public-infrastructure agreements, and alternative test or launch access.
      whyItMatters: >-
        One unavailable component, test facility, or range slot could interrupt the planned cadence.
      diligencePath: >-
        Review the top twenty suppliers and critical-path facilities with contracts, lead times,
        qualification status, alternatives, and business-continuity plans.
      relatedQuestionRefs: [QR003, QR006]
      relatedTableRefs: [TR002, TR003]
    - type: private-evidence-only
      severity: material
      topic: capital-risk
      missingEvidence: >-
        Cash balance, monthly burn, runway, structured-debt covenants, security, maturity, interest
        cost, committed facility capex, and downside financing plan.
      whyItMatters: >-
        Capital obligations may come due before repeat launches and customer receipts make the
        operating model self-funding.
      diligencePath: >-
        Obtain current management accounts, cash bridge, debt documents, capex schedule, and a
        twenty-four-month liquidity stress test tied to launch delays.
      relatedQuestionRefs: [QR004]
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: material
      topic: customer-contract
      missingEvidence: >-
        Signed backlog by mission, price, deposit, cancellation and delay rights, payload-readiness
        conditions, launch insurance allocation, recognized revenue, and gross margin.
      whyItMatters: >-
        A named purchase does not establish binding backlog, launch timing, cash conversion, or
        attractive unit economics.
      diligencePath: >-
        Inspect the Reflect Orbital agreements and a representative contract sample, reconcile
        deposits to cash, and model cancellation and delay scenarios.
      relatedQuestionRefs: [QR005]
      relatedTableRefs: [TR003]
    - type: enumeration-incomplete
      severity: material
      topic: adverse-record
      missingEvidence: >-
        Authoritative litigation, enforcement, sanctions, environmental, worker-safety, launch
        incident, cyber incident, and recall searches across relevant jurisdictions.
