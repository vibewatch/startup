  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments are real but still narrow in public evidence
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to three customer buckets rather than a broad disclosed installed base. First,
              Skyroot explicitly pitches Vikram-1 as dedicated and customizable launch access for global satellite
              operators, which implies smallsat developers and constellation operators are the intended paying buyers
              rather than a generalized defense or services audience. Second, the first orbital demo mission carried a
              handful of payload developers that prove technical onboarding but not yet a scaled paying customer
              franchise. Third, government-backed launch options in India already market ride-share and dedicated
              missions, which means Skyroot still has to win procurement against established state-backed alternatives
              instead of selling into an empty market.
