      - number: '5.3'
        title: Maturity, roadmap, and product risks
        blocks:
          - type: paragraph
            body: >-
              The core product risk is not whether Skyroot can build interesting hardware; it is whether the company can
              turn a successful debut into a repeatable launch service with enough mission assurance to win sustained
              commercial payload demand. The public roadmap still contemplates additional development flights before
              full commercialization, while the marketed Vikram-1U and Vikram-2 variants extend capability before
              external sources show completed qualification. That leaves diligence focused on repeat-flight reliability,
              quality gates, turnaround bottlenecks, launch-operations dependency on public infrastructure, and the
              absence of public service-level or trust-control disclosures that sophisticated launch buyers would
              usually want. The public record is milestone-rich, but still qualification-light for buyers.
            claimRefs:
              - CE007
              - CE009
              - CE010
              - CE011
              - CE013
