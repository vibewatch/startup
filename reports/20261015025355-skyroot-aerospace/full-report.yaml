    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and current stage
        blocks:
          - type: paragraph
            body: >-
              The assigned official surfaces position Skyroot as an on-demand launch provider selling the Vikram family
              for small-satellite missions, while independent launch tracking confirms the company has moved beyond
              suborbital proof into an orbital operating stage. The strongest ground-truth sequence is now consistent on
              the milestone itself: Mission Prarambh established an early launch credential in November 2022, and
              Vikram-1 reached orbit on July 18, 2026. The remaining caution is around specification consistency rather
              than existence. Skyroot's own site and Space Launch Schedule align on a 350 kg LEO / 260 kg SSO figure for
              Vikram-I, but one January 2026 profile published higher payload numbers, so later chapters should preserve
              source-specific numbers rather than assume a single uncontested canonical payload spec.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
