  - id: FR001
    title: Risk heatmap by evidence-supported likelihood, impact, and mitigation maturity
    type: matrix
    summary: >-
      Execution risks dominate because one successful mission materially reduces feasibility risk but leaves cadence,
      manufacturing, dependencies, and economics incompletely evidenced.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative assessment from current public evidence, not an actuarial probability
        - label: Impact
          detail: Potential effect on safe commercial launch and financing
        - label: Mitigation maturity
          detail: Observed, company-claimed, planned, or not publicly evidenced
        - label: Residual severity
          detail: Exposure remaining after the evidenced mitigation
      rows:
        - label: Repeat launch reliability
          note: One successful orbital mission; repeat flight evidence absent
          values:
            - value: Medium
              note: No failure evidenced, but only one orbital observation
            - value: Critical
              note: Payload loss or serious safety event could impair authorization, demand, and financing
            - value: Early
              note: Successful first orbital launch is observed
            - value: High
              note: Multi-flight reliability remains unproven
        - label: Manufacturing and cadence
          note: Management targets exceed the demonstrated flight cadence
          values:
            - value: Medium
              note: R&D-to-production transition is explicitly acknowledged
            - value: High
              note: Cadence underpins revenue conversion and customer trust
            - value: Planned
              note: Twelve-unit capacity is company-claimed, without yield disclosure
            - value: High
              note: No public production-yield or repeat-interval evidence
        - label: Public-infrastructure dependency
          note: Launch, test, integration, and safety support rely on public institutions
          values:
            - value: Medium
              note: Dependence is evidenced; disruption probability is not
            - value: High
              note: Loss or delay of access can stop missions
            - value: Observed
              note: The first orbital mission successfully used the public launch site
            - value: Material
              note: Alternative access and priority rights are not disclosed
        - label: Customer and unit economics
          note: Named demand exists, but price, timing, backlog, and revenue remain private
          values:
            - value: Medium
              note: A two-launch purchase is reported without commercial terms
            - value: High
              note: Conversion and margin determine capital sustainability
            - value: Early
              note: Named purchase is evidence of interest, not realized economics
            - value: High
              note: Backlog quality and launch-level margin are unresolved
        - label: Regulatory and export compliance
          note: Authorization is reported secondarily; primary conditions and export records are absent
          values:
            - value: Unassessed
              note: No company-specific violation or complete compliance record was retained
            - value: High
              note: Suspension or denied transfer could block launches or customers
            - value: Partially evidenced
              note: Authorization support is reported, but underlying records are missing
            - value: Material
              note: Primary approvals and export-control matrix require diligence
        - label: Integrated facility buildout
          note: Land and planned investment are reported, but permits and commissioning are not
          values:
            - value: Medium
              note: Large construction and commissioning program remains ahead
            - value: High
              note: Delay could constrain production, testing, and storage
            - value: Planned
              note: Land allotment is evidenced; operating readiness is not
            - value: Material
              note: Permit, schedule, capex, and safety evidence require diligence
    approximationNotes: >-
      Labels are qualitative and evidence-bounded; "unassessed" is not converted to zero or a low probability, and no
      cell implies that an unrecorded incident or violation is absent.
    claimRefs:
      - CR002
      - CR004
      - CR005
      - CR006
      - CR008
      - CR011
      - CR012
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Orbital proof and emerging demand improve strategic value, but economics opacity still dominates the
      price-sensitive investment call.
    data:
      nodes:
        - id: proof
          label: Orbital proof
          note: Vikram-I flew in July 2026 with four payloads and 350 kg LEO capacity.
        - id: demand
          label: Named demand signal
          note: Reflect Orbital bought two launches including a Vikram-1U slot.
        - id: scale
          label: Capital plus scale-up
          note: Fresh funding and the Infinity Campus support launch operations and manufacturing expansion.
        - id: opacity
          label: Economics opacity
          note: Public sources still do not disclose Skyroot launch pricing, backlog value, or margins.
        - id: risk
          label: Execution risk
          note: Commercial revenue is guided only after initial trial launches and round terms remain private.
        - id: call
          label: 'Recommendation: research-more / stretched'
          note: Wait for contract economics and repeat-cadence proof before treating the unicorn mark as underwritten value.
      edges:
        - from: proof
          to: demand
          label: Demonstrated flight credibility helps sales
        - from: demand
          to: scale
          label: Demand matters more if production can scale
        - from: scale
          to: opacity
          label: Capacity without pricing still leaves valuation unanswered
        - from: opacity
          to: risk
          label: Missing economics magnify execution sensitivity
        - from: risk
          to: call
          label: Price discipline dominates the decision
    approximationNotes: null
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
      - CV016
