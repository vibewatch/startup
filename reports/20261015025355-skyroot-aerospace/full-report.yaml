      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The real wedge is dedicated small launch, not the whole space economy
            body: >-
              The headline India space-sector numbers are useful for momentum, but Skyroot's investable market case
              depends on whether it can win dedicated small-satellite launches where timing, orbit specificity, and
