  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and commercial status
        blocks:
          - type: paragraph
            body: >-
              Skyroot's public monetization story is centered on launch services rather than software-like recurring
              revenue. Brandhopper attributes list pricing of $12-18 million for a dedicated Vikram-1 mission, $2-5
              million for a 50-100 kg rideshare slot, and additional mission-services revenue, but those are list or
              scenario figures rather than realized contract economics. Public evidence also shows the business is not
              yet in steady-state commercial operations: Brandhopper describes the July 2026 Vikram-1 orbital flight as
              the first of three development missions before 2027 commercial service, while PayloadSpace's reported
              Reflect Orbital deal is the clearest named demand signal and still omits contract value and mission
              timing. That means the chapter can explain how the revenue engine is supposed to work, but cannot yet
              confirm conversion from public pricing to booked revenue or cash collection.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
