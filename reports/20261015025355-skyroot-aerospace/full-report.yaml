      - number: '4.2'
        title: Scale proxies and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              The available operating proxies are ambitious but still management- or commentator-led rather than audited
              operating data. Via Satellite reports a target of four to six launches in the financial year, with
              management caveating that cadence may change after the first flight, and also cites a 72-hour
              assembly-to-launch goal supported by a 250,000 square foot Hyderabad footprint. Brandhopper layers on a
              one-rocket-per-month production target and an illustrative $144-216 million annual dedicated-launch
              run-rate scenario, but that scenario is explicitly dependent on achieving both cadence and list pricing.
              These disclosures are directionally useful for modeling fixed-cost absorption and market ambition, yet
              they leave core unit economics blank: no public source in the pool discloses CAC, sales cycle, deposit
              structure, launch gross margin, insurance burden, or working-capital intensity.
            claimRefs:
              - CI009
              - CI010
              - CI012
              - CI014
              - CI015
