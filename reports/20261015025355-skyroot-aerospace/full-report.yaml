              - CI007
              - CI009
              - CI012
              - CI015
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              On funding, the evidence is stronger than on revenue quality. Satellite Today and Moneycontrol both report
              a May 2026 $60 million round that lifted total funding to roughly $160 million and valuation to $1.1
              billion, while Clay's April 2026 dossier still showed only about $109 million of disclosed funding before
              the later Series C announcements. The same sources show that Skyroot added debt in March 2026 via a ₹100
              crore non-convertible-debenture placement and intends to spend fresh capital on launch cadence,
              manufacturing expansion, and Vikram-2 development. That combination indicates continued access to equity
              and debt capital, but it still does not answer the underwriting questions that matter most: current cash
              balance, debt terms, monthly burn, per-launch gross profit, cancellation protections on backlog, or how
              many more developmental flights the company can fund before recurring launch revenue becomes dependable.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI011
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting blocker
            body: >-
              The core blocker is not lack of funding announcements but lack of disclosed revenue quality. Public
              materials do not yet show realized launch pricing, gross margin, cash runway, or contract-backed backlog
              quality, so the current financing story is stronger than the operating-cash-flow story.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Launch vehicle family and delivered product
        blocks:
          - type: paragraph
            body: >-
              The delivered product is not a generic "space platform"; it is a family of small-launch services anchored
              on Vikram-1 and stretched upward through the marketed Vikram-1U and Vikram-2 roadmap. Public reporting
              shows Vikram-1 reached orbit on its first mission in July 2026, carried multiple customer and
              demonstration payloads, and is sold around a 350 kg to LEO / 260 kg to SSO performance envelope rather
              than an open-ended heavy-lift promise. Skyroot's nearer-term monetizable assets also include
              launch-adjacent hardware and space-systems components, which matters because the company is still proving
              repeat launch cadence while already selling orbital access windows and related hardware output.
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE008
              - CE010
              - CE011
