              - CO009
              - CO014
      - number: '1.3'
        title: Capital signals and early commercial proof
        blocks:
          - type: paragraph
            body: >-
              Public evidence around Skyroot's financing story is directionally positive but still thin on the numbers
              that matter most for underwriting. IndiaToday reported that Skyroot became India's first space-tech
              unicorn in May 2026 and quoted Chandana saying the latest round was co-led by GIC and Sherpalo Ventures.
              Those facts establish external capital quality and a valuation threshold above $1 billion, but they do not
              disclose cumulative capital raised, exact post-money, dilution, or governance terms. The clearest
              commercial signal in the assigned pool is Reflect Orbital's purchase of two Skyroot launches, yet even
              that evidence withholds pricing and firm mission dates. Taken together, the retained sources show customer
              interest and investor support, but not backlog quality, revenue conversion, or margin structure.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO015
              - CO016
      - number: '1.4'
        title: Milestones, roadmap, and open diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence set supports a credible milestone spine from founding through orbital execution: 2018
              founding, the November 2022 Vikram-S test, Infinity Campus inauguration in late 2025, pre-launch orbital
              positioning in early 2026, unicorn status in May 2026, and orbital success in July 2026. Just as
              important, the same retained sources preserve the uncertainty around that progress. Launch-tracking
              records show the orbital debut moved several times before lifting off, and the assigned public pack still
              leaves core cover metrics blank: there is no corroborated public number here for cumulative capital
              raised, revenue or run-rate, headcount, broad customer count, or backlog conversion. The result is a
              company with stronger technical and signaling evidence than operating disclosure evidence.
            claimRefs:
              - CO005
              - CO006
              - CO010
              - CO013
              - CO015
              - CO016
