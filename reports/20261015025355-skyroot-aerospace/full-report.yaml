      - number: '3.3'
        title: The moat is real but still vulnerable to faster cadence, heavier payloads, and better-funded follow-ons
        blocks:
          - type: paragraph
            body: >-
              Skyroot's strongest current differentiators are timing and packaging: it has already achieved orbital
              proof, it is trying to scale toward recurring dedicated service, and it now has at least one externally
              reported post-debut launch purchase. Those advantages are meaningful, but they are not obviously durable.
              Agnikul is marketing a distinct manufacturing and propulsion stack around 3D-printed semi-cryogenic
              engines and vertical integration, while RFA and the wider European launcher cohort show that
              venture-backed small-launch competition is global, not local. The biggest unresolved underwriting issue is
              that public sources still do not reveal the realized launch price, discounting behavior, or sustained
              cadence economics that would prove Skyroot can defend margin as more launchers arrive.
            claimRefs:
