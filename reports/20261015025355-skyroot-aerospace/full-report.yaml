figures:
  - id: FO001
    title: Skyroot milestone timeline
    type: timeline
    summary: >-
      Public milestones show real launch progress, but the cadence from first orbit to scaled operations is still
      roadmap-heavy.
    data:
      items:
        - date: '2018'
          label: Company founded
          detail: >-
            Independent coverage ties Skyroot's founding to 2018 and names Pawan Kumar Chandana and Naga Bharath Daka as
            founders.
          tone: positive
        - date: November 2022
          label: Mission Prarambh / Vikram-S
          detail: Skyroot's homepage says Vikram-S marked the beginning of India's private space launch industry.
          tone: positive
        - date: November 2025
          label: Infinity Campus inaugurated
          detail: >-
            A January 2026 profile says Prime Minister Narendra Modi inaugurated the Hyderabad Infinity Campus and
            unveiled the flight-ready Vikram-1 in November 2025.
          tone: positive
        - date: January 6, 2026
          label: Orbital debut still pending
          detail: >-
            SpaceLaunchIndex described Vikram-1 as targeting an early-2026 orbital debut, with integration and testing
            still in progress.
          tone: warning
        - date: May 2026
          label: Unicorn threshold reached
          detail: >-
            IndiaToday reported Skyroot became India's first space-tech unicorn during the sector's May 2026 momentum
            wave.
          tone: positive
        - date: July 18, 2026
          label: Vikram-1 reaches orbit
          detail: >-
            SpaceNews and launch-tracking evidence say Vikram-1 became the first commercial Indian rocket to reach
            orbit.
