              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Single-flight evidence is not a reliability curve
            body: >-
              The July 2026 success is a major de-risking event, but investment underwriting should wait for consecutive
              missions, disclosed anomaly handling, and evidence that production and range access can sustain the
              promised cadence.
            calloutType: risk
            claimRefs:
