      - number: '7.3'
        title: Operational reliability, quality, and industrialization
        blocks:
          - type: paragraph
            body: >-
              Vikram-1's recorded July 2026 mission reached a successful payload-deployment outcome, which materially
              lowers technical feasibility risk. It does not resolve repeatability, launch insurance, quality escape, or
              ramp risk. Management stated before the flight that Skyroot aimed for four to six launches in the
              financial year, subject to launch-port availability, manufacturing readiness, and observations from the
              first mission. The same interview claimed installed capacity for twelve rockets per year and acknowledged
              that scaling requires a transition from an R&D organization to a production organization. Public evidence
              in the assigned pool does not disclose yield, supplier defect rates, test acceptance criteria, anomaly
              history, insurance premiums, or the post-flight cadence plan. A competitor's own marketing page claims a
              much larger flight history, but that company-issued comparison is a maturity reference only, not an
              independent performance benchmark.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
              - CR013
              - CR016
      - number: '7.4'
        title: Partner, facility, customer, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              Skyroot's execution model relies on infrastructure and counterparties outside the company. The recorded
              orbital mission used the Satish Dhawan Space Centre, and secondary reporting describes ISRO support
              spanning test, integration, safety, and launchpad functions. A planned 294.67-acre integrated facility
              could reduce capacity constraints, but it adds a construction, commissioning, permitting, and
              capital-allocation program before that mitigation is proven. Reflect Orbital's purchase of two launches is
              useful demand evidence, yet price and mission dates were not disclosed, preventing assessment of
              cancellation protection, margin, or timing. The financing mix supplies growth capital but includes
              structured debt, while cash balance, runway, debt covenants, backlog quality, and launch-level unit
              economics remain private. Monitoring should therefore focus on consecutive mission outcomes, schedule
              intervals, facility milestones, customer deposits and cancellations, insurance availability, and liquidity
              headroom. A thesis break would be a serious safety event, approval suspension, repeated mission delay or
              failure, loss of infrastructure access, or financing stress before repeatable commercial cadence is
              demonstrated.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
