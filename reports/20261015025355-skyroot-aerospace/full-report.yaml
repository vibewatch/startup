      - number: '5.2'
        title: Architecture, manufacturing, and deployment model
        blocks:
          - type: paragraph
            body: >-
              The public architecture is specific enough to describe a real operating stack. Independent sources
              consistently frame Vikram-1 as a carbon-composite launcher that uses three solid propulsion stages
              followed by a liquid upper stage for orbital insertion, while Skyroot's broader technology stack extends
              to in-house solid, liquid, and cryogenic propulsion families. Manufacturing and deployment are also no
              longer abstract: Infinity Campus is presented as the orbital-vehicle factory, the second Vikram-1 hardware
              has already shipped from that site, and launch operations still depend on ISRO-linked national spaceport
              infrastructure for present missions and planned high-inclination expansion.
            claimRefs:
