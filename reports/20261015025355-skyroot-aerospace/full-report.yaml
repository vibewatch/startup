  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The buyer-facing competitive set is narrower than a generic space-tech ecosystem map
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a focused launch-procurement landscape rather than a broad "Indian space
              startup" peer group. Space.com frames Skyroot's target job as dedicated smallsat launch to precise orbital
              destinations, explicitly using Rocket Lab as the benchmark service model rather than a generic aerospace
              comparator. PayloadSpace then shows what the status-quo substitute looks like in practice: operators still
              use rideshare, but capacity constraints and limited orbit control can push buyers toward dedicated
              vehicles. PrivateCircle's broader Indian startup landscape is useful ecosystem context, but because it
              mixes launchers with propulsion, satellite, and downstream-data companies, it should not be mistaken for
              the actual procurement-time alternative set.
            claimRefs:
