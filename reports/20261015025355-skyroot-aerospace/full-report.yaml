      - number: '7.2'
        title: Regulatory, legal, export-control, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              The allocated sources indicate that IN-SPACe handled launch authorization and that India has opened public
              facilities to private launch companies, but the source set does not include the underlying authorization,
              license conditions, environmental approvals, range-safety record, insurance terms, or an authoritative
              company-specific export-control determination. Wassenaar materials establish that participating states use
              national policies to control transfers of conventional arms and dual-use goods and technologies; they do
              not establish a Skyroot violation or even the precise controls applicable to each vehicle, component, or
              customer. The UNOOSA page fetched for the Outer Space Treaty currently redirects to a general page warning
              that some registry submissions are unavailable, so it cannot close treaty or registration diligence. No
              retained source identifies litigation, enforcement, sanctions, or a safety incident, but absence from this
              bounded pool is not evidence that none exists.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR001
