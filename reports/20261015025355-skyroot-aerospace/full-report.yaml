      - number: '6.2'
        title: Adoption proof moved from concept to flown payloads and one named buyer
        blocks:
          - type: paragraph
            body: >-
              The best public customer evidence is now tied to actual missions rather than logos alone. Independent
              coverage and mission trackers show Vikram-I reached orbit in July 2026 and carried four payloads, giving
              Skyroot a concrete deployment artifact for prospective buyers. Separate reporting then named Reflect
              Orbital as a two-launch customer spanning the current Vikram-1 vehicle and the upgraded Vikram-1U. That is
              meaningful because it converts abstract market interest into a disclosed purchase, but the public record
              is still thin: the launch costs, mission dates, and any broader booked backlog remain undisclosed.
            claimRefs:
