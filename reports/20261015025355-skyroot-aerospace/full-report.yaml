  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the actual wedge
        blocks:
          - type: paragraph
            body: >-
              The broadest available market narratives describe a fast-forming Indian private-space ecosystem, but that
              is not the same thing as Skyroot's addressable revenue pool. Public evidence points to a narrower wedge:
              dedicated launch services for small satellites, first in India and then internationally, where customers
              value schedule certainty, orbit control, and a domestic launch option. Vikram-1's 350 kg LEO profile
              anchors that wedge much more clearly than the much larger sector-value estimates cited for Indian space
              overall. That distinction is important for valuation work because the company can benefit from the
              sector's policy opening and investor momentum without capturing more than a small slice of the broad
              "space economy" figures cited in public reporting.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Buyer segments and demand signals
        blocks:
          - type: paragraph
            body: >-
              The clearest public buyer signal is not a disclosed multiyear backlog but the combination of demo payload
              demand, explicit schedule-certainty messaging, and one disclosed two-launch purchase from Reflect Orbital.
              Independent reporting suggests Skyroot may start with domestic demand while also marketing to global
              operators that want dedicated insertion rather than rideshare delay. That points to several buyer classes:
              Indian startups and sovereign missions seeking domestic access, global small-satellite operators seeking
              timing and orbital precision, and niche constellations willing to pay for reserved capacity when launch
              supply tightens. The market logic is therefore buyer-workflow specific, not a generic "all space spending"
              story.
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM011
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM015
      - number: '2.3'
        title: Sizing lenses, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Public sizing data is useful mainly as a set of lenses rather than a clean TAM/SAM/SOM stack.
              Government-linked reporting cited by IEEE Spectrum puts India's space sector at US$8.4 billion, while
              Business Today cited an Arkam Ventures estimate of roughly US$13 billion today and nearly US$40 billion by
              2030; these figures are directionally supportive but not directly comparable. More decision-relevant are
              the launch-specific signals: Business Today reported that small satellites account for more than 75% of
              global launches, and that 219 private launches were expected in 2025 while only 33 were serviced by
              providers outside China and SpaceX. Those indicators support a real demand backdrop for dedicated small
              launch, but the adoption constraints are equally material. Skyroot has only one orbital launch on the
              board, cadence is unproven, and independent observers explicitly question whether demand is deep enough to
              support several Indian private launch companies at once.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
              - CM013
              - CM014
