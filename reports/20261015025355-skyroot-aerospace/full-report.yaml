  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Ordinal scores place Skyroot between pre-orbital challengers and the mature dedicated-launch benchmark.
    data:
      xAxis:
        label: Mission control / orbit specificity
        min: 1
        max: 5
        lowLabel: Shared / constrained
        highLabel: Dedicated / tailored
        description: Evidence-backed ordinal score; not price or market share.
      yAxis:
        label: Execution proof
        min: 1
        max: 5
        lowLabel: Pre-orbital / developmental
        highLabel: Operationally demonstrated
        description: Evidence-backed ordinal score based on public launch proof in the assigned pool.
      points:
        - label: Skyroot Vikram-1
          x: 4
          'y': 3
          detail: Reached orbit in Jul 2026 and is selling dedicated missions, but still on a validation-to-cadence path.
        - label: Skyroot Vikram-1U
          x: 4
          'y': 2
          detail: Packaging expansion is announced, but first flight is still future-facing in assigned evidence.
        - label: Agnikul
          x: 4
          'y': 2
          detail: Buyer value proposition is clear, but orbital proof was still pending in end-2026 guidance.
        - label: Rocket Lab analogue
          x: 5
          'y': 5
          detail: Used by Space.com as the existing dedicated-launch reference model that Skyroot wants to emulate.
        - label: RFA / European entrants
          x: 3
          'y': 2
          detail: Heavier-lift and well-funded, but still working toward first orbital attempts in assigned evidence.
        - label: SpaceX rideshare status quo
          x: 1
          'y': 5
          detail: Highly proven access to orbit, but weaker schedule and orbit specificity for a single payload customer.
    approximationNotes: >-
      Scores are ordinal summaries of source-backed flexibility and execution proof; they are not inferred prices, win
      rates, or market-share estimates.
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP006
      - CP009
      - CP010
      - CP015
      - CP016
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how Skyroot intends to convert launch demand into revenue, while leaving realized pricing
      and margin undisclosed.
    data:
      nodes:
        - label: Demand signal
          value: Named first-flight payloads plus Reflect Orbital's two-launch purchase
          detail: Public demand is visible, but backlog value remains sparse.
        - label: Contract form
          value: Dedicated launch, rideshare slot, and mission services
          detail: Monetization mixes mission-scale and ancillary service revenue.
        - label: Vehicle path
          value: Vikram-1 now, Vikram-1U next, Vikram-2 later
          detail: Product ladder expands payload capacity and price points over time.
        - label: Readiness gate
          value: Three development flights before 2027 commercial operations
          detail: Revenue scale depends on converting development proof into repeat launch service.
        - label: Public price points
          value: $12-18M full launch; $2-5M per 50-100 kg rideshare slot
          detail: Public figures are list pricing rather than realized contract values.
        - label: Scale target
          value: 4-6 launches in the financial year; one rocket per month production target
          detail: Cadence ambition drives the scenario revenue bridge.
        - label: Missing proof
          value: Realized price, margin, cash conversion, and contract timing undisclosed
          detail: Public disclosures still stop short of underwriting-quality unit economics.
    approximationNotes: >-
      The sequence describes publicly disclosed commercialization steps and gaps; it is not a recognized-revenue
      waterfall.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI009
      - CI012
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence shows a concrete launch stack from manufacturing through orbital service, but only the baseline
      vehicle has completed a flight.
    data:
      layers:
        - label: Commercial launch offer
          detail: Dedicated and rideshare smallsat launches sold around specific LEO/SSO payload envelopes.
          outputs:
            - Vikram-1 dedicated launch
            - Vikram-1 rideshare windows
            - Future heavier-family offers
        - label: Vehicle family
          detail: >-
            Baseline orbital launcher is operationally demonstrated once; upgraded variants are marketed but not yet
            flight-proven.
          modules:
            - Vikram-1
            - Vikram-1U
            - Vikram-2
        - label: Orbital insertion layer
          detail: Liquid upper-stage capability supports orbital insertion and payload deployment after solid ascent.
          modules:
            - Restartable upper stage
            - Payload deployment sequence
        - label: Primary propulsion stack
          detail: Public reporting consistently describes three solid ascent stages as the core lift architecture.
          modules:
            - Kalam-1200
            - Kalam-250
            - Kalam-100
        - label: Manufacturing and test base
          detail: Hyderabad campuses anchor composite fabrication, propulsion work, integration, and next-vehicle buildout.
          modules:
            - Infinity Campus
            - Max-Q campus
        - label: Launch and range infrastructure
          detail: >-
            Current operations depend on national spaceport access and future expansion into a second integration
            corridor.
          outputs:
            - Sriharikota launch access
            - Thoothukudi / Kulasekarapattinam expansion path
    approximationNotes: >-
      Public architecture is synthesized from milestone reporting and sales disclosures; subsystem-level qualification
      data is not fully public.
    claimRefs:
