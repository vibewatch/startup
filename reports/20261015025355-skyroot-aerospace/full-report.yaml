      - number: '6.3'
        title: Expansion logic is plausible, but concentration risk remains high
        blocks:
          - type: paragraph
            body: >-
              The commercial narrative is clear: more cadence, larger vehicles, and a market shortage of regular launch
              access should create room for expansion. Management and investor-facing reporting tie the May 2026 funding
              round to higher Vikram cadence, larger follow-on vehicles, and a broader customer set, while independent
              industry reporting still describes launch scarcity as severe enough to push some operators into buying
              dedicated missions. Even so, the public customer ledger remains concentrated in one disclosed future buyer
              plus the first demo manifest. Until Skyroot shows additional named contracts, repeat bookings, or a
              broader multi-mission schedule, land-and-expand remains a thesis rather than a demonstrated cohort
              pattern.
            claimRefs:
              - CU002
              - CU007
              - CU008
              - CU009
              - CU013
              - CU014
      - number: '6.4'
        title: Durability and repeatability are still the biggest open questions
        blocks:
          - type: paragraph
            body: >-
              Public sources do not disclose NRR, GRR, churn, contract lengths, average selling price, or customer
              count, so retention quality cannot be tested directly. Operationally, Skyroot was still discussing a
              launch window with IN-SPACe and ISRO before Vikram-I flew, and management said the first few test launches
              would carry only partial payloads before the system reached fuller utilization. Those facts do not negate
              demand, but they do show that customer durability still depends on two unproven things: repeatable launch
              execution and conversion of early interest into a disclosed base of paying missions.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Best current proof is "one flown mission plus one named buyer"
            body: >-
              That is materially better than a logo wall, but it is still too concentrated to prove durable customer
              expansion or pricing power.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU014
          - type: callout
            title: Retention quality remains unverified
            body: >-
              No public NRR, GRR, churn, contract-length, or customer-count disclosure appears in the assigned source
              pool, so durability must remain a diligence gap rather than an assumption.
            calloutType: risk
            claimRefs:
              - CU008
