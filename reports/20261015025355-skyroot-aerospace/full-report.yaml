              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: Skyroot now has independent proof that Vikram-I can fly, a visible
              manufacturing campus sized for scale-up, and a disclosed customer contract that suggests the product can
              move from demo credibility toward repeat missions. Those facts make the company more than a concept-stage
              launch startup. The anti-thesis is equally clear. Management still guides to commercial revenue only after
              initial trial launches, the company disclosed no public pricing or unit-economics data with the Reflect
              deal, and external benchmark pricing from SpaceX implies that small-launch affordability is a narrow
              target rather than a marketing slogan. At $1.1 billion, investors are underwriting cadence, conversion,
              and margin structure that public evidence has not yet demonstrated.
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV015
      - number: '8.3'
        title: Scenario framing and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Because public evidence does not expose revenue multiples, launch margins, or round protections, scenario
              work has to anchor on milestone underwriting instead of false precision. The bull case needs fast
              follow-on launches, conversion of named demand into scheduled paid missions, and evidence that Vikram-1U
              and Vikram-2 broaden payload economics without blowing out capital intensity. The base case assumes
              technical credibility improves faster than revenue transparency, which can preserve strategic value but
              leave late investors paying for optionality they cannot price. The bear case follows naturally from the
              current gaps: a launch slip, weak backlog conversion, or undisclosed pricing discipline could compress the
              private-market narrative well before Skyroot proves recurring launch economics.
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next step is not a broad market study; it is a narrow underwriting package. Investors need signed
              customer contracts, realized or contracted launch pricing, gross-margin build by vehicle, insurance
              assumptions, and the exact rights attached to the May 2026 round. Without those materials, the valuation
              case is effectively a bet that technical momentum will outrun pricing opacity. The thesis breaks if
              Skyroot cannot translate the first orbital mission into a visible paid manifest, if Vikram-1U or Vikram-2
              scale requires materially more capital than the current round implies, or if the undisclosed financing
              stack contains preference or control terms that make the headline $1.1 billion mark a weak proxy for
              common-equity entry value.
            claimRefs:
              - CV003
              - CV007
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive recommendation
            body: >-
              Research more rather than chase the unicorn mark; the valuation case still leans on future cadence and
              contract conversion more than on disclosed economics.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV007
              - CV015
              - CV016
          - type: callout
            title: What would change the call
            body: >-
              Signed launch pricing, repeat paid missions, and visibility into preference overhang would move the
              chapter from stretched optionality toward underwritten value.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV015
