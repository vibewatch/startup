      - number: '3.2'
        title: Packaging and capability comparisons still rely more on mission design than on price transparency
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong enough to compare what Skyroot is selling, but not yet strong enough to compare
              what it earns per mission. Vikram-1 has now reached orbit and is documented as a four-stage launcher with
              350 kg LEO capacity, while PayloadSpace reports that the planned Vikram-1U upgrade would expand that to
              roughly 550 kg. Agnikul's public pitch is similar in buyer language—mission-specific access, rapid
              turnaround, and orbit specificity—but its first full orbital launch was still a late-2026 objective in the
              assigned evidence. That leaves Skyroot with a real proof advantage in India, but not yet with transparent
              public economics.
