      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Skyroot now has proof that most domestic launch peers still lack
            body: >-
              The step from pre-orbital promise to actual orbit matters: it makes Skyroot's sales motion more concrete
              than Agnikul's current public posture and gives the company a better chance to convert dedicated-launch
              demand into backlog.
            calloutType: strength
            claimRefs:
