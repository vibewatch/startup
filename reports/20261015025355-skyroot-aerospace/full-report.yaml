  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a more serious technical and commercial posture than Skyroot had in the prior
              report window: the company raised nearly $60 million at a $1.1 billion valuation in May 2026, completed
              the first Vikram-I orbital mission in July, and now has at least one named customer that bought two
              launches. That progress matters because launch credibility and launch availability are scarce assets in
              small launch. Even so, the public record still lacks Skyroot's realized launch price, gross margin,
              backlog value, round terms, and any demonstrated revenue conversion. With the latest financing occurring
              before operating revenue and before steady launch cadence has been proven, the investable question is not
              whether Skyroot is real, but whether the current price already discounts too much of the next two years'
              execution.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV008
              - CV011
