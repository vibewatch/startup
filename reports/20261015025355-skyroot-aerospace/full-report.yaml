  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile and investment implication
        blocks:
          - type: paragraph
            body: >-
              The central risk has shifted from whether Vikram-1 can reach orbit to whether Skyroot can repeat that
              result safely and economically. The available launch record shows one orbital launch and one success,
              while management has described a much faster production and launch ambition. That gap makes cadence and
              reliability a high-impact, medium-likelihood residual risk rather than a proven weakness: there is no
              recorded failure in the retained evidence, but there is also no multi-flight reliability history. Capital
              risk ranks next because the latest financing included structured debt while revenue, backlog, and contract
              economics remained undisclosed. Regulatory, export-control, facility, and supplier risks are material but
              not quantifiable from the public record reviewed here. The investment implication is to condition
              conviction on repeat missions, auditable customer conversion, and documentary approval evidence rather
              than on the valuation milestone or a single successful flight.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
