      - number: '1.2'
        title: Founders, governance, and control surfaces
        blocks:
          - type: paragraph
            body: >-
              The retained public record is strong enough to anchor founding year, location, and at least part of the
              founder roster, but not strong enough to underwrite the full governance stack. Independent coverage ties
              Skyroot to Hyderabad and a 2018 start, with Pawan Kumar Chandana still serving as the most visible
              operator and spokesperson; one profile also names Naga Bharath Daka as the other co-founder. The official
              governance evidence in this worker pool is narrower. It shows a formal whistleblower commitment with
              confidentiality, investigation, and anti-retaliation language, but it does not disclose board composition,
              committee structure, investor rights, or succession depth. That means the chapter can support key-person
              dependence as a diligence theme, while treating board independence and control mechanics as unresolved.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO014
