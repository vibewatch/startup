  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: Public NRR, GRR, churn, renewal, cohort, or contract-duration data for Skyroot launch customers.
      whyItMatters: Without durability metrics, the chapter cannot distinguish one-off launch wins from a sticky repeat-purchase customer base.
      diligencePath: Request booked backlog by customer, renewal behavior, contract terms, and any churned or delayed missions from management or data room materials.
      relatedQuestionRefs: [QU005]
    - type: missing-source
      severity: material
      topic: backlog
      missingEvidence: A public customer count, signed backlog value, and mission schedule beyond Reflect Orbital and the Vikram-I demo manifest.
      whyItMatters: The current public proof is too concentrated to size revenue durability or customer concentration risk.
      diligencePath: Obtain launch manifest, contracted payload list, and backlog waterfall with timing, value, and probability-weighted conversion.
      relatedQuestionRefs: [QU003, QU006]
      relatedTableRefs: [TU002, TU003]
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Launch pricing, deposit structure, cancellation terms, and schedule commitments for Reflect Orbital or any other commercial buyer.
      whyItMatters: Pricing and contract structure determine whether named demand is economically attractive or merely headline validation.
      diligencePath: Review customer contracts, pricing sheets, and board materials showing launch margin assumptions and schedule commitments.
      relatedQuestionRefs: [QU004]
      relatedTableRefs: [TU003]
    - type: enumeration-incomplete
      severity: minor
      topic: named customer proof table completeness
      missingEvidence: A fuller public enumeration of paying customers beyond one disclosed buyer and a launch-demo payload list.
      whyItMatters: The named-customer table currently demonstrates existence, not breadth, of commercial adoption.
      diligencePath: Expand the table with customer case studies, procurement awards, and signed launch announcements as they become available.
      relatedQuestionRefs: [QU002, QU006]
      relatedTableRefs: [TU003]
