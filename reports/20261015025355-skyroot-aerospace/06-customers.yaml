figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence shows a path from market access pain to flown demo payloads and one named repeat-style buyer, with renewal still unproven.
    data:
      nodes:
        - label: Market pain is limited launch access
          detail: Independent reporting ties demand to regular affordable access and launch scarcity.
          touchpoints:
            - Customers describe regular affordable access as challenging
            - Launch-capacity shortages push some operators toward dedicated missions
        - label: Skyroot targets global satellite operators
          detail: The product pitch centers on dedicated and customizable orbital launches.
          touchpoints:
            - Vikram-1 positioned for global satellite operators
            - Offering framed as dedicated/customizable access
        - label: Demo payload onboarding
          detail: The first orbital mission carried four public payloads.
          touchpoints:
            - Grahaa Space SOLARAS S3
            - Cosmoserve Embrace robotic arm
            - DCUBED in-orbit demonstration
            - Skyroot SCOPE satellite
        - label: Orbital proof point
          detail: Independent sources reported Vikram-I reached orbit in July 2026.
          touchpoints:
            - First commercial Indian rocket to reach orbit
            - Launch tracker later marked mission success and payload deployment
        - label: Named expansion buyer appears
          detail: Reflect Orbital disclosed two purchased launches spanning Vikram-1 and Vikram-1U.
          touchpoints:
            - One launch on Vikram-1
            - One launch on Vikram-1U
            - Cost and schedule still undisclosed
        - label: Repeatability remains the gating step
          detail: Public evidence still lacks retention metrics, customer count, and realized high cadence.
          touchpoints:
            - First few test launches carry only partial payloads
            - One-rocket-per-month goal remains forward looking
    approximationNotes: >-
      Ordered qualitatively from demand formation to repeatability; the nodes summarize evidenced stages
      rather than a quantified conversion funnel.
    claimRefs: [CU001, CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU013, CU014]
