company:
  name: Skyroot Aerospace
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer proof has improved from a prelaunch story to a post-orbit record: Skyroot now has a
    documented four-payload Vikram-I demo mission and one named commercial buyer, Reflect Orbital, for
    two future launches. The evidence still does not show a broad disclosed backlog, retention metrics, or
    multi-customer renewal behavior, so durability remains inferred from market demand and launch-capacity
    scarcity rather than from a mature customer cohort.
sections:
  - id: buyer-segments-and-fit
    title: Buyer segments are real but still narrow in public evidence
    body: >-
      Public evidence points to three customer buckets rather than a broad disclosed installed base. First,
      Skyroot explicitly pitches Vikram-1 as dedicated and customizable launch access for global satellite
      operators, which implies smallsat developers and constellation operators are the intended paying
      buyers rather than a generalized defense or services audience. Second, the first orbital demo mission
      carried a handful of payload developers that prove technical onboarding but not yet a scaled paying
      customer franchise. Third, government-backed launch options in India already market ride-share and
      dedicated missions, which means Skyroot still has to win procurement against established state-backed
      alternatives instead of selling into an empty market.
    claimRefs: [CU001, CU003, CU004, CU011, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof moved from concept to flown payloads and one named buyer
    body: >-
      The best public customer evidence is now tied to actual missions rather than logos alone. Independent
      coverage and mission trackers show Vikram-I reached orbit in July 2026 and carried four payloads,
      giving Skyroot a concrete deployment artifact for prospective buyers. Separate reporting then named
      Reflect Orbital as a two-launch customer spanning the current Vikram-1 vehicle and the upgraded
      Vikram-1U. That is meaningful because it converts abstract market interest into a disclosed purchase,
      but the public record is still thin: the launch costs, mission dates, and any broader booked backlog
      remain undisclosed.
    claimRefs: [CU005, CU006, CU007, CU008, CU010]
    tableRefs: [TU002, TU003]
  - id: expansion-and-concentration
    title: Expansion logic is plausible, but concentration risk remains high
    body: >-
      The commercial narrative is clear: more cadence, larger vehicles, and a market shortage of regular
      launch access should create room for expansion. Management and investor-facing reporting tie the May
      2026 funding round to higher Vikram cadence, larger follow-on vehicles, and a broader customer set,
      while independent industry reporting still describes launch scarcity as severe enough to push some
      operators into buying dedicated missions. Even so, the public customer ledger remains concentrated in
      one disclosed future buyer plus the first demo manifest. Until Skyroot shows additional named
      contracts, repeat bookings, or a broader multi-mission schedule, land-and-expand remains a thesis
      rather than a demonstrated cohort pattern.
    claimRefs: [CU002, CU007, CU008, CU009, CU013, CU014]
  - id: durability-and-procurement-friction
    title: Durability and repeatability are still the biggest open questions
    body: >-
      Public sources do not disclose NRR, GRR, churn, contract lengths, average selling price, or customer
      count, so retention quality cannot be tested directly. Operationally, Skyroot was still discussing a
      launch window with IN-SPACe and ISRO before Vikram-I flew, and management said the first few test
      launches would carry only partial payloads before the system reached fuller utilization. Those facts
      do not negate demand, but they do show that customer durability still depends on two unproven things:
      repeatable launch execution and conversion of early interest into a disclosed base of paying missions.
    claimRefs: [CU008, CU009, CU010, CU013, CU014]
