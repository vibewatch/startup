callouts:
  - calloutType: recommendation
    title: Price-sensitive recommendation
    body: Research more rather than chase the unicorn mark; the valuation case still leans on future cadence and contract conversion more than on disclosed economics.
    claimRefs: [CV005, CV007, CV015, CV016]
  - calloutType: risk
    title: What would change the call
    body: Signed launch pricing, repeat paid missions, and visibility into preference overhang would move the chapter from stretched optionality toward underwritten value.
    claimRefs: [CV010, CV011, CV015]
