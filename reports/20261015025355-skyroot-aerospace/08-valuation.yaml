company:
  name: Skyroot Aerospace
chapter:
  number: 8
  title: Valuation
  summary: >-
    Skyroot has moved from a pre-launch promise to a post-orbital-flight launch company with fresh capital, one disclosed repeat customer, and visible manufacturing build-out, but public evidence still stops well short of revenue, margin, launch-pricing, and round-term proof. The May 2026 $1.1 billion unicorn mark therefore looks supportable only as an execution-option valuation, not as a fundamentals-underwritten price, which keeps the investment call at research-more with a stretched stance.
sections:
  - id: valuation-call
    title: Recommendation and valuation stance
    body: >-
      Public evidence supports a more serious technical and commercial posture than Skyroot had in the prior report window: the company raised nearly $60 million at a $1.1 billion valuation in May 2026, completed the first Vikram-I orbital mission in July, and now has at least one named customer that bought two launches. That progress matters because launch credibility and launch availability are scarce assets in small launch. Even so, the public record still lacks Skyroot's realized launch price, gross margin, backlog value, round terms, and any demonstrated revenue conversion. With the latest financing occurring before operating revenue and before steady launch cadence has been proven, the investable question is not whether Skyroot is real, but whether the current price already discounts too much of the next two years' execution.
    claimRefs: [CV001, CV002, CV005, CV007, CV008, CV011, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-balance
    title: Thesis and anti-thesis
    body: >-
      The bull case is straightforward: Skyroot now has independent proof that Vikram-I can fly, a visible manufacturing campus sized for scale-up, and a disclosed customer contract that suggests the product can move from demo credibility toward repeat missions. Those facts make the company more than a concept-stage launch startup. The anti-thesis is equally clear. Management still guides to commercial revenue only after initial trial launches, the company disclosed no public pricing or unit-economics data with the Reflect deal, and external benchmark pricing from SpaceX implies that small-launch affordability is a narrow target rather than a marketing slogan. At $1.1 billion, investors are underwriting cadence, conversion, and margin structure that public evidence has not yet demonstrated.
    claimRefs: [CV003, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV015, CV016]
    tableRefs: [TV002]
  - id: scenario-framing
    title: Scenario framing and entry discipline
    body: >-
      Because public evidence does not expose revenue multiples, launch margins, or round protections, scenario work has to anchor on milestone underwriting instead of false precision. The bull case needs fast follow-on launches, conversion of named demand into scheduled paid missions, and evidence that Vikram-1U and Vikram-2 broaden payload economics without blowing out capital intensity. The base case assumes technical credibility improves faster than revenue transparency, which can preserve strategic value but leave late investors paying for optionality they cannot price. The bear case follows naturally from the current gaps: a launch slip, weak backlog conversion, or undisclosed pricing discipline could compress the private-market narrative well before Skyroot proves recurring launch economics.
    claimRefs: [CV005, CV007, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: diligence-asks
    title: Final diligence asks and thesis-break triggers
    body: >-
      The next step is not a broad market study; it is a narrow underwriting package. Investors need signed customer contracts, realized or contracted launch pricing, gross-margin build by vehicle, insurance assumptions, and the exact rights attached to the May 2026 round. Without those materials, the valuation case is effectively a bet that technical momentum will outrun pricing opacity. The thesis breaks if Skyroot cannot translate the first orbital mission into a visible paid manifest, if Vikram-1U or Vikram-2 scale requires materially more capital than the current round implies, or if the undisclosed financing stack contains preference or control terms that make the headline $1.1 billion mark a weak proxy for common-equity entry value.
    claimRefs: [CV003, CV007, CV010, CV011, CV015, CV016]
tables:
