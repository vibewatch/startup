        - id: scale
          label: Capital plus scale-up
          note: Fresh funding and the Infinity Campus support launch operations and manufacturing expansion.
        - id: opacity
          label: Economics opacity
          note: Public sources still do not disclose Skyroot launch pricing, backlog value, or margins.
        - id: risk
          label: Execution risk
          note: Commercial revenue is guided only after initial trial launches and round terms remain private.
        - id: call
