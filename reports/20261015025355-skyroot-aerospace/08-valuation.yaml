        - from: demand
          to: scale
          label: Demand matters more if production can scale
        - from: scale
          to: opacity
          label: Capacity without pricing still leaves valuation unanswered
        - from: opacity
          to: risk
          label: Missing economics magnify execution sensitivity
        - from: risk
          to: call
          label: Price discipline dominates the decision
    approximationNotes: null
