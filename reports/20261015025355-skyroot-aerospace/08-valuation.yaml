    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - [Recommendation, research-more, Do not underwrite the May 2026 price without direct diligence on economics and terms.]
      - [Confidence, medium, "Technical and customer proof improved, but key economics remain undisclosed."]
      - [Risk rating, high, Launch cadence and commercial conversion still need to be demonstrated after the first orbital success.]
      - [Valuation stance, stretched, The $1.1 billion mark arrived before operating revenue and before public unit-economics proof.]
      - [Entry discipline, milestone-gated, "Revisit after contracted pricing, launch cadence, and financing terms are available."]
    notes: Public evidence supports the labels, but not a precise fair-value number or target return math.
    claimRefs: [CV001, CV002, CV005, CV007, CV008, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Direction
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Orbital proof is now real because Vikram-I completed its July 2026 demo mission with four payloads and 350 kg LEO capability.", Two or more follow-on paid launches on disclosed timelines would upgrade confidence.]
      - [Thesis, Fresh capital and the Infinity Campus give Skyroot a credible path to manufacturing scale and Vikram-2 development, Evidence of repeat cadence without another large capital raise would strengthen the case.]
      - [Anti-thesis, "Public evidence still shows no operating revenue and management framed the first two or three launches as trial missions.", Demonstrated paid launches and revenue recognition would remove the biggest commercialization objection.]
      - [Anti-thesis, "The market cannot price Skyroot's economics because launch prices, backlog value, margins, and round protections remain undisclosed.", Signed contract economics and term-sheet visibility would materially improve underwriting quality.]
    notes: This table separates proof-of-technology from proof-of-economics to avoid mixing milestone progress with valuation support.
    claimRefs: [CV003, CV005, CV006, CV007, CV008, CV010, CV011, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Vikram-I follow-on launches occur on schedule, Reflect-style demand converts into a broader paid manifest, and scale-up supports Vikram-1U or Vikram-2 without a dilutive reset.", The current valuation can work only if execution closes the gap between milestone proof and recurring launch economics, A launch slip or weak contract conversion would unwind the premium quickly, Successive launches and newly disclosed paying customers.]
      - [Base, "Technical credibility improves but public pricing and margin evidence lags while customers sign selectively.", Strategic scarcity can preserve a premium but limits upside for new investors entering at unicorn pricing, Investors may fund optionality before they can model returns, One to two additional missions and more customer logos but limited economics disclosure.]
      - [Bear, "Revenue timing slips beyond management's stated 2027 target, cadence stays thin, or financing terms prove more investor-protective than the headline valuation suggests.", The $1.1 billion mark compresses because it was anchored to expectation rather than cash-flow proof, Down-round risk and common-equity dilution become more salient than orbital-first-mover narrative, "Delayed launches, no disclosed contract pricing, or a need for another large round before steady operations."]
    notes: These are milestone-based scenarios rather than precise valuation ranges because public revenue, margin, and term data are absent.
    claimRefs: [CV005, CV007, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
