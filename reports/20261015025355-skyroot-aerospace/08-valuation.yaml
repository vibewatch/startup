      severity: material
      topic: launch-economics
      missingEvidence: Signed launch pricing, backlog value, gross margin build, insurance assumptions, and cancellation terms for Vikram-1 and Vikram-1U.
      whyItMatters: Without contract economics, investors cannot test whether the current valuation is justified by future cash generation rather than technical scarcity.
