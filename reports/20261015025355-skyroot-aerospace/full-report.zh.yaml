  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与真正切口
        blocks:
          - type: paragraph
            body: >-
              最宽泛的市场叙事描述了一个快速成形的印度私人航天生态，但这不等于 Skyroot
              可触达的收入池。公开证据指向更窄的切口：先在印度、再向国际市场提供小卫星专属发射服务，客户看重确定的发射时间、轨道控制和本土发射选项。相较公开报道中对印度整体太空产业的更大规模估算，Vikram-1 的 350
              kg LEO 能力更能锚定这个切口。这一差别对估值很重要：公司可以受益于政策开放和投资人热情，却不可能拿走公开报道所称广义“太空经济”的大部分。
