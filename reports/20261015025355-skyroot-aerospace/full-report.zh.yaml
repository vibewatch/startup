    Skyroot Aerospace 是一家总部位于 Hyderabad 的私人发射公司，由前 ISRO 工程师创立，设计并销售 Vikram
    系列小卫星运载火箭。公司已经从亚轨道验证走向入轨飞行，但对定价、利润率、积压订单转化和资本结构仍披露很少。
