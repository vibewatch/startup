              billion；而 Clay 在 2026 年 4 月的 dossier 中，在后续 Series C 公告前仍只显示约 $109 million 的已披露融资。相同来源显示，Skyroot 于 2026 年 3
              月通过 ₹100 crore 非可转换债券配售增加债务，并计划将新增资本用于发射频次、制造扩张和 Vikram-2
