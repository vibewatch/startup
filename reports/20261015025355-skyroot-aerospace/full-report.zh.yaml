            - 可重启上面级
            - 载荷部署序列
        - label: 主推进系统
          detail: 公开报道一致将三级固体助推级描述为核心运力架构。
          modules:
            - Kalam-1200
            - Kalam-250
            - Kalam-100
        - label: 制造与测试基地
          detail: 海得拉巴园区承载复合材料制造、推进系统工作、集成和下一款飞行器的建造。
          modules:
            - Infinity Campus
            - Max-Q 园区
        - label: 发射与测控基础设施
          detail: 当前运营依赖国家航天发射场的使用权，未来还计划扩展至第二条集成走廊。
          outputs:
            - Sriharikota 发射场使用权
            - Thoothukudi / Kulasekarapattinam 扩展路径
    approximationNotes: 公开架构综合自里程碑报道和销售披露；子系统级鉴定数据尚未完全公开。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，需求从市场准入痛点走向已飞行的演示载荷，并出现一名具备重复购买特征的明确买方；续约仍未得到验证。
    data:
      nodes:
        - label: 市场痛点是发射资源有限
          detail: 独立报道将需求与常规、可负担的发射机会不足联系起来。
          touchpoints:
            - Customers describe regular affordable access as challenging
            - Launch-capacity shortages push some operators toward dedicated missions
        - label: Skyroot 瞄准全球卫星运营商
          detail: 产品宣传的核心是专属且可定制的轨道发射。
          touchpoints:
            - Vikram-1 positioned for global satellite operators
            - Offering framed as dedicated/customizable access
        - label: 演示载荷上线
          detail: 首次入轨任务搭载了四个公开载荷。
          touchpoints:
            - Grahaa Space SOLARAS S3
            - Cosmoserve Embrace robotic arm
            - DCUBED in-orbit demonstration
            - Skyroot SCOPE satellite
        - label: 入轨证明点
          detail: 独立来源报道 Vikram-I 于 2026 年 7 月成功入轨。
          touchpoints:
            - First commercial Indian rocket to reach orbit
            - Launch tracker later marked mission success and payload deployment
        - label: 出现明确的扩展买方
          detail: Reflect Orbital 披露购买了两次发射，覆盖 Vikram-1 和 Vikram-1U。
          touchpoints:
            - One launch on Vikram-1
            - One launch on Vikram-1U
            - Cost and schedule still undisclosed
        - label: 可重复性仍是关键门槛
          detail: 公开证据仍缺少留存指标、客户数量和实际高发射频次。
          touchpoints:
            - First few test launches carry only partial payloads
            - One-rocket-per-month goal remains forward looking
    approximationNotes: 按需求形成到可重复性的定性顺序排列；这些节点概括的是有证据支持的阶段，而非量化转化漏斗。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU013
      - CU014
  - id: FR001
    title: 按证据支持的可能性、影响和缓释成熟度绘制的风险热力图
    type: matrix
    summary: 执行风险占主导：一次成功任务显著降低了可行性风险，但发射频次、制造、依赖关系和经济性仍缺乏完整证据。
    data:
      columns:
        - label: 可能性
          detail: 基于当前公开证据的定性评估，不是精算概率
        - label: 影响
          detail: 对安全商业发射和融资的潜在影响
        - label: 缓释成熟度
          detail: 已观察到、公司自述、已计划，或无公开证据
        - label: 剩余严重度
          detail: 采取有证据支持的缓释措施后仍剩余的风险敞口
      rows:
        - label: 重复发射可靠性
          note: 一次成功入轨任务；缺少重复飞行证据
          values:
            - value: Medium
              note: 尚无失败证据，但目前只有一次入轨观察
            - value: Critical
              note: 载荷损失或严重安全事件可能损害许可、需求和融资
            - value: Early
              note: 已观察到首次成功入轨
            - value: High
              note: 多次飞行的可靠性仍未得到验证
        - label: 制造与发射频次
          note: 管理层目标超过已展示的飞行频次
          values:
            - value: Medium
              note: 已明确承认正从研发转向生产
            - value: High
              note: 发射频次是收入转化和客户信任的基础
            - value: Planned
              note: 公司自称产能为 12 架，但未披露良率
            - value: High
              note: 没有公开的生产良率或重复间隔证据
        - label: 公共基础设施依赖
          note: 发射、测试、集成和安全支持依赖公共机构
          values:
            - value: Medium
              note: 依赖关系有证据支持，但中断概率未知
            - value: High
              note: 使用权丧失或延迟可能使任务停摆
            - value: Observed
              note: 首次入轨任务成功使用了公共发射场
            - value: Material
              note: 替代使用权和优先权未披露
        - label: 客户与单位经济性
          note: 已有明确需求，但价格、时间、积压订单和收入仍属非公开信息
          values:
            - value: Medium
              note: 据报道有两次发射采购，但没有商业条款
            - value: High
              note: 转化率和利润率决定资本能否持续
            - value: Early
              note: 明确采购证明了兴趣，不代表已实现的经济性
            - value: High
              note: 积压订单质量和单次发射利润率仍未解决
        - label: 监管与出口合规
          note: 授权仅有二手报道；缺少一手条件和出口记录
          values:
            - value: Unassessed
              note: 未保留公司特定违规或完整合规记录
            - value: High
              note: 暂停或转让被拒可能阻断发射或客户合作
            - value: Partially evidenced
              note: 有报道称获得授权支持，但缺少底层记录
            - value: Material
              note: 一手审批和出口管制矩阵仍需尽调
        - label: 综合设施建设
          note: 有土地和计划投资的报道，但许可和投产调试尚未公开
          values:
            - value: Medium
              note: 大规模建设和投产调试计划仍在前方
            - value: High
              note: 延迟可能限制生产、测试和存储
            - value: Planned
              note: 有土地分配证据，但尚无运营准备度证据
            - value: Material
              note: 许可、进度、资本开支和安全证据仍需尽调
    approximationNotes: 标签是定性的，并受证据范围约束；“未评估”不会被转换为零或低概率，任何单元格也不意味着不存在未记录的事故或违规。
    claimRefs:
      - CR002
      - CR004
      - CR005
      - CR006
      - CR008
      - CR011
      - CR012
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 入轨证明和新兴需求提升了战略价值，但经济性不透明仍主导着对价格敏感的投资判断。
    data:
      nodes:
        - id: proof
          label: 入轨证明
          note: Vikram-I 于 2026 年 7 月搭载四个载荷完成飞行，LEO 运力为 350 kg。
        - id: demand
          label: 明确需求信号
          note: Reflect Orbital 购买了两次发射，其中包括一个 Vikram-1U 发射位。
        - id: scale
          label: 资本与扩张
          note: 新融资和 Infinity Campus 支持发射运营及制造扩张。
        - id: opacity
          label: 经济性不透明
          note: 公开来源仍未披露 Skyroot 的发射定价、积压订单价值或利润率。
        - id: risk
          label: 执行风险
          note: 只有在完成初始试验发射后才会给出商业收入指引，而本轮融资条款仍属非公开信息。
        - id: call
          label: 推荐：继续研究 / 估值偏高
          note: 在把独角兽标志视为已被投资判断支持的价值之前，应等待合同经济性和可重复发射频次的证明。
      edges:
        - from: proof
          to: demand
          label: 已展示的飞行可信度有助于销售
        - from: demand
          to: scale
          label: 生产能规模化时，需求才更有价值
        - from: scale
          to: opacity
          label: 只有产能没有定价，估值仍无答案
        - from: opacity
          to: risk
          label: 经济性缺口放大执行敏感度
        - from: risk
          to: call
          label: 价格纪律主导决策
    approximationNotes: null
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
      - CV016
