        - 瓦森纳安排确立国家管制目标；公司具体分类与许可证 未留存
        - Unassessed
        - High
        - 公开来源没有公司特定缓释措施的证据
        - 重大事项：取得出口管制矩阵、受制方筛查流程、许可证及合规审计结果
      - - 空间物体登记与条约合规
        - 印度 / 联合国框架
        - 未验证；抓取的 UNOOSA 页面警告，部分登记提交暂时无法使用
        - Unassessed
        - Medium
        - 未留存公司特定登记文件
        - 待核实：用一手记录确认载荷与发射登记责任
      - - 设施环境、土地与安全审批
        - 安得拉邦 / 地方及国家主管机构
        - 据报道已分配土地；建设、环境、储存及投产审批未留存
        - Medium
        - High
        - 政府批准用于一体化制造、测试和储存的土地分配
        - 重大事项：审查许可证、危险材料控制、建设进度及应急预案
    notes: 截至 2026-10-15 的部分公开记录样本；当指定证据无法支持概率判断时，可能性标为未评估；没有引用案例不等于不存在案例。
