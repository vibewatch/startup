  - id: TV002
    title: 正论 / 反论表
    columns:
      - 方向
      - 论点
      - 改变判断的条件
    rows:
      - - 正论
        - 入轨证明已经成立：Vikram-I 在 2026 年 7 月完成演示任务，搭载四个载荷，并具备 350 kg 近地轨道能力。
        - 按已披露时间表完成两次或以上后续付费发射，将提升置信度。
      - - 正论
        - 新增资本与 Infinity Campus 为 Skyroot 走向制造规模化并开发 Vikram-2 提供了可信路径
        - 若无需再次大额融资就能证明重复发射节奏，论据会更有力。
      - - 反论
        - 公开证据仍显示没有经营收入，管理层也把最初两三次发射定位为试验任务。
        - 经证明的付费发射与收入确认将消除商业化方面最大的质疑。
      - - 反论
        - 由于发射价格、订单储备价值、利润率和融资轮保护条款仍未披露，市场无法给 Skyroot 的经济性定价。
        - 已签合同的经济条件与条款清晰度将显著提升投资判断质量。
    notes: 这张表把技术证明与经济性证明分开，避免将里程碑进展与估值支撑混为一谈。
    claimRefs:
