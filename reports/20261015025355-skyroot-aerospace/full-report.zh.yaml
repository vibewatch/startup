      - number: '3.3'
        title: 护城河存在，但仍易受更快频次、更大载荷和资金更足的后续竞争者冲击
        blocks:
          - type: paragraph
            body: >-
              Skyroot 当前最强的差异化在于时间和产品包装：已经完成入轨验证，正尝试扩大到可重复的专属服务，并且至少有一次外部报道的 debut 后发射采购。这些优势有意义，但显然还不牢固。Agnikul 正围绕 3D
              打印半低温发动机和垂直整合营销不同的制造与推进体系；RFA
              及更广泛的欧洲发射器群体则说明，风险投资支持的小型发射竞争是全球性的，而非本地竞争。最大的未决投资判断问题是，公开来源仍未揭示实际发射价格、折扣行为或持续发射频率下的经济性，无法证明 Skyroot
              能在更多发射器进入市场后守住利润率。
