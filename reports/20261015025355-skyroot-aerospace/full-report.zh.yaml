      - number: '2.2'
        title: 买方分层与需求信号
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开买方信号不是已披露的多年积压订单，而是演示载荷需求、明确的发射时间确定性宣传，以及 Reflect Orbital 已披露的两次发射采购。独立报道显示，Skyroot
              可能先从国内需求起步，同时面向希望获得专属入轨而非承受拼车延迟的全球运营商营销。对应的买方包括：寻求本土发射能力的印度初创公司和主权任务；寻求时间与轨道精度的全球小卫星运营商；以及在发射供给收紧时愿意为预留运力付费的细分星座。市场逻辑因此取决于买方工作流，而不是泛泛的“所有太空支出”。
