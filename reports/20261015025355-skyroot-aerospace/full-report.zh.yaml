      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV015
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Vikram-I 后续发射按计划进行，Reflect 式需求转化为更广泛的付费任务清单，规模化支持 Vikram-1U 或 Vikram-2，且无需稀释性重置。
        - 只有执行落地，弥合里程碑证明与经常性发射经济性之间的差距，当前估值才有成立空间
        - 发射延误或合同转化疲弱会迅速抹去估值溢价
        - 连续发射与新披露的付费客户。
      - - 基准
        - 技术可信度提升，但公开价格与利润率证据落后，客户仍在选择性签约。
        - 战略稀缺性可以维持溢价，但会限制按独角兽价格入场的新投资者上行空间
        - 投资者可能在能够测算回报前先为期权价值提供资金
        - 新增一至两次任务和更多客户标识，但经济数据披露有限。
      - - 悲观
        - 收入实现时间晚于管理层所述的 2027 年目标，发射节奏持续稀疏，或融资条款对投资者的保护强于表面估值所暗示的程度。
        - $1.1 billion 的估值会收缩，因为它锚定的是预期而非现金流证明
        - 下轮融资风险与普通股稀释会比“轨道先发者”叙事更突出
        - 发射延迟、没有披露合同价格，或在运营稳定前需要再次大额融资。
    notes: 这些是基于里程碑的情景，而非精确估值区间，因为公开收入、利润率和条款数据缺失。
    claimRefs:
      - CV005
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: Skyroot 里程碑时间线
    type: timeline
    summary: 公开里程碑显示发射确有进展，但从首次入轨到规模化运营的节奏仍高度依赖路线图。
    data:
      items:
        - date: '2018'
          label: 公司成立
          detail: 独立报道将 Skyroot 的成立追溯至 2018 年，并称 Pawan Kumar Chandana 与 Naga Bharath Daka 为创始人。
          tone: positive
        - date: November 2022
          label: Mission Prarambh / Vikram-S
          detail: Skyroot 官网称，Vikram-S 标志着印度私人航天发射业的起点。
          tone: positive
        - date: November 2025
          label: Infinity Campus 落成
          detail: 2026 年 1 月的一篇专访称，印度总理 Narendra Modi 为海得拉巴 Infinity Campus 揭幕，并于 2025 年 11 月展示已具备飞行条件的 Vikram-1。
          tone: positive
        - date: January 6, 2026
          label: 首次入轨仍待实现
          detail: SpaceLaunchIndex 称，Vikram-1 的目标是 2026 年初首次入轨，目前仍在进行集成和测试。
          tone: warning
        - date: May 2026
          label: 达到独角兽门槛
          detail: IndiaToday 报道称，Skyroot 在 2026 年 5 月行业势头上升期间成为印度首家航天科技独角兽。
          tone: positive
        - date: July 18, 2026
          label: Vikram-1 成功入轨
          detail: SpaceNews 和发射追踪证据称，Vikram-1 成为首枚入轨的印度商业火箭。
          tone: positive
        - date: Q1 2027
          label: Vikram-1U 预计执行首次任务
          detail: Payload 称，Skyroot 升级后的 Vikram-1U 预计在 2027 年第一季度执行首次任务。
          tone: warning
        - date: '2027'
          label: Vikram-II 路线图目标
          detail: 官方主页将 Vikram-II 定位为下一款更重型运载火箭，并称其将于 2027 年发射。
          tone: warning
    approximationNotes: 未来事项是保留来源中的路线图表述，并非已经完成的里程碑；应将其理解为公开预期，而不是已确定的执行结果。
