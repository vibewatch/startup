  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 面向买方的竞争集合比泛化的太空科技生态图更窄
        blocks:
          - type: paragraph
            body: >-
              现有证据支持的是聚焦于发射采购的竞争图景，而不是宽泛的“印度太空初创公司”同业组。Space.com 将 Skyroot 的目标任务定义为把小卫星送入精确轨道，并明确以 Rocket Lab
              作为服务模式基准，而非泛泛的航空航天对手。PayloadSpace 展示了现实中的现状替代方案：运营商仍使用拼车，但运力约束和有限的轨道控制可能把买方推向专属运载火箭。PrivateCircle
              更广的印度初创公司版图可作为生态背景，但其中混合了发射器、推进、卫星和下游数据公司，不能当作实际采购时的替代集合。
