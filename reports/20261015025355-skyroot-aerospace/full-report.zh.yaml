      - 交易对手方
      - 作用 / 集中度证据
      - 失败情景
      - 严重程度
      - 缓释证据
      - 剩余风险
    rows:
      - - 发射与测试基础设施
        - ISRO / Satish Dhawan Space Centre
        - 已有任务地点与广泛公共设施支持的证据；没有替代使用权
        - 靶场、集成或测试使用权延迟或撤回
        - High
        - 成功使用公共发射场；管理层讨论过印度第二座发射台的能力
        - 在审查合同使用权、优先级、冗余及排期权利前属于重大风险
      - - 组件与制造供应商
        - 未披露的供应商集合
        - 管理层称外包范围已确定；供应商名称与集中度未公开
        - 关键组件延误或质量逃逸会阻断发射节奏
        - High
        - 公司自称火箭大部分由内部制造
        - 重大事项：要求提供物料清单集中度、单一来源图、库存及资质状态
      - - 发射客户转化
        - Reflect Orbital 及未披露客户
        - 据报道已购买两次发射；价格、日期、定金与取消权未披露
        - 载荷准备度或取消会改变排期和现金回款
        - High
        - Vikram-1 与 Vikram-1U 的具名采购
        - 在核实签署的订单储备、定金、终止权与任务日期前维持高风险
      - - 成长资本与债务
        - 股权投资者与 BlackRock 关联基金
        - 据报道，最新一轮包含约 $10 million 结构化债务
        - 商业发射节奏形成前，偿债或契约压力上升
        - High
        - 同一轮据报道约有 $50 million 的新增股权
        - 重大事项：现金、消耗、跑道、契约、担保、到期日和再融资能力仍未披露
    notes: 交易对手方与集中度仅限于留存来源披露的名称和作用；没有公开供应商排期、基础设施合同、客户合同或债务协议。
