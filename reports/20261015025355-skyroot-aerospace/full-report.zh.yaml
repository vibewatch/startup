            body: >-
              现有运营代理指标很有野心，但仍由管理层或评论者提出，并非审计后的运营数据。Via Satellite 报道，财年目标为发射 4 至 6 次；管理层同时提醒，首次飞行后频次可能调整，并提出在 Hyderabad 约
