    rows:
      - - 后续任务发射失败或载荷损失
        - Medium
        - 极高
        - 早期：记录过一次成功入轨
        - 在连续多次任务建立可重复性前维持高风险
        - 跟踪连续成功次数与异常披露；严重安全事件或反复失败将 击穿投资论点
      - - 首次入轨任务后的节奏不足
        - Medium
        - High
        - 计划中：管理层目标为发射 4 至 6 次，取决于港口、生产和首飞观察结果
        - 风险高，因为尚无重复间隔的证据
        - 跟踪发射间隔与任务清单延误；反复延迟且未披露补救措施将击穿投资论点
      - - 制造爬坡或质量良率不足
        - Medium
        - High
        - 据称年产能为 12 枚火箭；未留存良率或验收数据
        - 在研发转向生产期间维持高风险
        - 在评估发射节奏前，要求提供良率、返工、验收测试和供应商缺陷看板
      - - 设施建设或危险品储存延误
        - Medium
        - High
        - 已分配土地；未留存投产里程碑证据
