              列为另一位联合创始人。现有官方治理证据范围更窄：它展示了包含保密、调查和反报复条款的正式举报人承诺，却没有披露董事会构成、委员会架构、投资人权利或继任梯队。因此，本章可以把关键人依赖列为尽调主题，但董事会独立性和控制机制仍应视为未解决问题。
