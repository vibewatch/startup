        title: 身份与当前阶段
        blocks:
          - type: paragraph
            body: >-
              官方材料将 Skyroot 定位为按需发射服务商，面向小卫星任务销售 Vikram 系列；独立发射跟踪也确认，公司已经越过亚轨道验证，进入入轨运营阶段。如今最扎实的里程碑链条已经一致：Mission
              Prarambh 于 2022 年 11 月建立了早期发射资历，Vikram-1 于 2026 年 7 月 18 日进入轨道。剩余疑点在规格一致性，而非里程碑是否存在。Skyroot 官网和 Space
              Launch Schedule 都将 Vikram-I 的 LEO / SSO 载荷写为 350 kg / 260 kg，但一篇 2026 年 1
              月的资料给出了更高载荷数字，因此后续章节应保留各来源的数字，不要假定存在唯一且无争议的标准规格。
