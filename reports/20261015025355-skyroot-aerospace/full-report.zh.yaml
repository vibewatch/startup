      - number: '8.3'
        title: 情景框架与入场纪律
        blocks:
          - type: paragraph
            body: >-
              由于公开证据没有展示收入倍数、发射利润率或融资轮保护条款，情景分析必须锚定里程碑投资判断，而不能制造虚假的精确度。乐观情景需要快速跟进发射、把已点名需求转成排期明确的付费任务，并证明 Vikram-1U 和
              Vikram-2
              能拓宽载荷经济性而不让资本强度失控。基准情景假设技术可信度提升快于收入透明度，这可以保留战略价值，却可能让后进入的投资人支付无法定价的期权价值。悲观情景自然来自当前缺口：发射延期、积压订单转化疲弱或未披露的定价纪律，都可能在
              Skyroot 证明经常性发射经济性前压缩私募市场叙事。
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 最终尽调要求与论点破裂触发条件
        blocks:
          - type: paragraph
            body: >-
              下一步不是做一份泛泛的市场研究，而是准备一套狭窄的投资判断材料包。投资人需要已签署客户合同、已实现或已签约的发射价格、按型号拆分的毛利构建、保险假设，以及 2026 年 5
              月融资所附的准确权利。没有这些材料，估值逻辑实际上是在押注技术势头会跑赢定价不透明。如果 Skyroot 不能把首次入轨任务转成可见的付费任务清单，或 Vikram-1U / Vikram-2
              扩张所需资本显著超过当前融资所暗示的规模，或未披露的融资结构包含优先权、控制权条款，使 headline $1.1 billion 成为普通股进入价值的薄弱代理，论点就会破裂。
            claimRefs:
              - CV003
              - CV007
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的建议
            body: 继续研究，不要追逐独角兽估值；当前估值逻辑更多依赖未来发射频次和合同转化，而不是已披露的经济性。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV007
              - CV015
              - CV016
          - type: callout
            title: 哪些变化会改变判断
            body: 已签署的发射定价、重复付费任务，以及对优先权悬垂的清晰度，会把本章从高估的期权性推向有依据的价值判断。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV015
