      - number: '1.3'
        title: 资本信号与早期商业验证
        blocks:
          - type: paragraph
            body: >-
              Skyroot 的融资故事方向上偏正面，但对投资判断最关键的数字仍披露不足。IndiaToday 报道称，Skyroot 于 2026 年 5 月成为印度首家太空科技独角兽，并引述 Chandana 称最新一轮由
              GIC 和 Sherpalo Ventures 共同领投。这些事实证明外部资本质量和超过 $1B 的估值门槛，却没有披露累计融资、准确的投后估值、稀释比例或治理条款。现有材料中最清晰的商业信号，是 Reflect
              Orbital 购买了两次 Skyroot 发射；但定价和确定的任务日期同样没有公开。综合来看，现有来源显示客户兴趣和投资人支持，却不能证明积压订单质量、收入转化或利润结构。
