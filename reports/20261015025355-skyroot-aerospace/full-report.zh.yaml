      - number: '2.3'
        title: 规模口径、驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              公开规模数据更适合作为多组观察口径，而不是干净的 TAM/SAM/SOM 框架。IEEE Spectrum 引述政府口径称印度太空产业为 US$8.4B；Business Today 引述 Arkam
              Ventures 估算，当前约 US$13B、2030 年接近 US$40B。这些数字方向上支持增长，但不可直接比较。更有决策价值的是发射专属信号：Business Today 报道，小卫星占全球发射量超过
              75%；2025 年预计有 219 次私人发射，但由中国和 SpaceX 以外的供应商承接的只有 33 次。这些指标支持专属小型发射存在真实需求，但采用约束同样明显：Skyroot
              目前只有一次入轨发射，发射频率尚未验证，独立观察者也明确质疑需求是否足以同时支撑多家印度私人发射公司。
