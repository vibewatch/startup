evidenceGaps:
  - type: missing-source
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      A public or management-supplied table quantifying cumulative capital raised, exact current valuation, headcount,
      customer count, and revenue or run-rate.
    whyItMatters: These are core cover metrics that determine whether the unicorn label is matched by operating scale.
    diligencePath: >-
      Request the latest board deck or financing memo and reconcile it to investor announcements and management
      interviews.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: commercial-demand
    missingEvidence: Booked backlog by vehicle, contracted launch pricing, and expected mission timing for named customers.
    whyItMatters: A disclosed launch buyer proves interest, but not revenue quality, margin, or concentration.
    diligencePath: >-
      Request a customer and backlog bridge by vehicle with signed contract dates, launch windows, and cancellation
      terms.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board roster, observer rights, committee structure, and explicit succession coverage below the founder-CEO.
    whyItMatters: Without governance and bench detail, key-person risk and investor control cannot be properly sized.
    diligencePath: >-
      Request the board deck index, governance documents, and an org chart covering engineering, finance, and launch
      operations leadership.
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A reconciled third-party market model that isolates the launch segment inside India's broader space-economy
      estimates.
    whyItMatters: >-
      Conflicting top-down sector figures can make valuation narratives look more precise than the public evidence
      actually supports.
    diligencePath: >-
      Request the underlying Arkam methodology and compare it against government sector definitions before using either
      figure as a valuation anchor.
  - type: private-evidence-only
    severity: material
    topic: pricing-and-backlog
    missingEvidence: Named customers, launch pricing, backlog by mission type, and renewal or repeat-booking data.
    whyItMatters: >-
      Demand quality matters more than macro sector growth if Skyroot is to convert technical milestones into durable
      revenue.
    diligencePath: >-
      Ask management for booked launches, option structures, average selling price, cancellation terms, and customer
      concentration by segment.
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      A public serviceable market estimate for dedicated small-launch missions that separates Skyroot's likely wedge
      from India's total space-economy value.
    whyItMatters: Without a constrained SAM/SOM, public market sizing overstates the precision of valuation-relevant demand.
    diligencePath: >-
      Build a bottoms-up model from target satellite classes, likely launch cadence, orbit types, and disclosed customer
      mission profiles.
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Realized launch prices, discounting rules, contract minima, and backlog conversion terms for Skyroot and named
      peers.
    whyItMatters: >-
      Without real contract economics, moat durability can be described functionally but not underwritten on margin or
      payback.
    diligencePath: >-
      Request customer contracts, launch order forms, or management-supplied pricing corridors for Vikram-1, Vikram-1U,
      Agnibaan, and comparable substitute options.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: revenue-recognition
    missingEvidence: Realized contract prices, payment milestones, deposits, and revenue-recognition policy by mission type.
    whyItMatters: List pricing does not establish revenue quality, customer willingness to pay, or cash conversion.
    diligencePath: Obtain executed customer contracts or board-ready bookings and revenue bridge by mission.
    relatedQuestionRefs:
      - QI001
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: launch-margin
    missingEvidence: Per-launch variable cost, insurance cost, gross margin, and mission-operations overhead.
    whyItMatters: Launch cadence can destroy value if the gross-profit profile is weak or negative.
    diligencePath: Request mission-level unit-economics pack with actual or budgeted contribution margin by vehicle variant.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, runway, NCD coupon and covenant terms, and minimum-liquidity thresholds.
    whyItMatters: Cumulative capital raised is not the same thing as capital still available to fund development and launch cadence.
    diligencePath: Review latest management accounts, treasury schedule, debt documents, and monthly cash forecast.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: backlog-quality
    missingEvidence: Contracted backlog by launch year, cancellation rights, customer concentration, and launch schedule confidence.
    whyItMatters: >-
      A named two-launch deal is helpful, but underwriting needs value, timing, and enforceability to judge demand
      conversion.
    diligencePath: Request signed backlog roll-forward with customer names, contract value, mission dates, and deposit status.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Sales cycle, CAC, payback, bid-to-win ratios, and international channel economics.
    whyItMatters: Management demand targets do not establish how efficiently Skyroot can fill launch inventory at target pricing.
    diligencePath: Review pipeline funnel, sales staffing plan, partner economics, and cohort-style booking conversion metrics.
    relatedQuestionRefs:
      - QI004
      - QI007
