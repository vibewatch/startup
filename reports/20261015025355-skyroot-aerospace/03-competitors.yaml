company:
  name: "Skyroot Aerospace"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Skyroot has crossed the line from prospective launcher to active dedicated-launch contender by
    reaching orbit with Vikram-1 and landing at least one post-launch customer announcement, but the
    moat is still easier to defend on mission flexibility than on public pricing or proven cadence.
    The most relevant pressure comes from Agnikul's differentiated domestic stack, the Rocket
    Lab-like dedicated-launch benchmark, European venture-backed entrants, and the cheaper but less
    customized rideshare status quo.
sections:
  - id: "competitive-set"
    title: "The buyer-facing competitive set is narrower than a generic space-tech ecosystem map"
    body: >-
      The assigned evidence supports a focused launch-procurement landscape rather than a broad
      "Indian space startup" peer group. Space.com frames Skyroot's target job as dedicated smallsat
      launch to precise orbital destinations, explicitly using Rocket Lab as the benchmark service
      model rather than a generic aerospace comparator. PayloadSpace then shows what the status-quo
      substitute looks like in practice: operators still use rideshare, but capacity constraints and
      limited orbit control can push buyers toward dedicated vehicles. PrivateCircle's broader Indian
      startup landscape is useful ecosystem context, but because it mixes launchers with propulsion,
      satellite, and downstream-data companies, it should not be mistaken for the actual
      procurement-time alternative set.
    claimRefs: ["CP001", "CP006", "CP014"]
    tableRefs: ["TP001"]
  - id: "offer-structure"
    title: "Packaging and capability comparisons still rely more on mission design than on price transparency"
    body: >-
      Public evidence is strong enough to compare what Skyroot is selling, but not yet strong enough
      to compare what it earns per mission. Vikram-1 has now reached orbit and is documented as a
      four-stage launcher with 350 kg LEO capacity, while PayloadSpace reports that the planned
      Vikram-1U upgrade would expand that to roughly 550 kg. Agnikul's public pitch is similar in
      buyer language—mission-specific access, rapid turnaround, and orbit specificity—but its first
      full orbital launch was still a late-2026 objective in the assigned evidence. That leaves
      Skyroot with a real proof advantage in India, but not yet with transparent public economics.
    claimRefs: ["CP003", "CP004", "CP005", "CP007", "CP009", "CP016"]
    tableRefs: ["TP002", "TP003"]
  - id: "durability"
    title: "The moat is real but still vulnerable to faster cadence, heavier payloads, and better-funded follow-ons"
    body: >-
      Skyroot's strongest current differentiators are timing and packaging: it has already achieved
      orbital proof, it is trying to scale toward recurring dedicated service, and it now has at
      least one externally reported post-debut launch purchase. Those advantages are meaningful, but
      they are not obviously durable. Agnikul is marketing a distinct manufacturing and propulsion
      stack around 3D-printed semi-cryogenic engines and vertical integration, while RFA and the
      wider European launcher cohort show that venture-backed small-launch competition is global, not
      local. The biggest unresolved underwriting issue is that public sources still do not reveal the
      realized launch price, discounting behavior, or sustained cadence economics that would prove
      Skyroot can defend margin as more launchers arrive.
    claimRefs: ["CP005", "CP008", "CP010", "CP011", "CP015", "CP016"]
    figureRefs: ["FP001"]
