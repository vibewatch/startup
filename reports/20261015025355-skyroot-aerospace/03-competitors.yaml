callouts:
  - calloutType: "strength"
    title: "Skyroot now has proof that most domestic launch peers still lack"
    body: >-
      The step from pre-orbital promise to actual orbit matters: it makes Skyroot's sales motion
      more concrete than Agnikul's current public posture and gives the company a better chance to
      convert dedicated-launch demand into backlog.
    claimRefs: ["CP003", "CP005", "CP015"]
  - calloutType: "risk"
    title: "Public pricing opacity leaves moat durability unproven"
    body: >-
      Buyers clearly value schedule certainty and custom orbits, but the assigned public evidence
      still does not reveal the prices, discounts, or gross economics that would show whether that
      value proposition can survive as more launchers reach market.
    claimRefs: ["CP006", "CP007", "CP010", "CP016"]
