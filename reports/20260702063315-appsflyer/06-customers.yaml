figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      AppsFlyer customers generally move from fragmented measurement pain to mobile attribution deployment, then expand
      into deep linking, audiences, data collaboration, CTV, fraud protection, and AI-assisted workflows.
    data:
      items:
        - label: "Measurement pain"
          note: "Buyer sees fragmented mobile, web, CTV, and app data, platform privacy changes, and pressure to prove ROAS and LTV."
        - label: "MMP evaluation"
          note: "Growth and analytics teams compare AppsFlyer with Adjust, Branch, Kochava, Singular, and internal platform reporting."
        - label: "Initial deployment"
          note: "SDK/API, partner integrations, OneLink, attribution dashboards, and fraud tools go live for app or web campaigns."
        - label: "Operational usage"
          note: "Teams monitor campaigns, cohorts, raw reports, SSOT, and channel quality; review evidence supports repeat workflow use."
        - label: "Expansion modules"
          note: "Accounts can add CTV, audiences, retention/LTV workflows, data clean rooms, incrementality, and AI-driven insights."
        - label: "Renewal and reference"
          note: "Public proof shows satisfaction and case studies, while renewal cohorts and NRR remain private diligence asks."
    approximationNotes: >-
      Journey stages synthesize official solution pages and review evidence; exact conversion rates between stages are not
      public.
    claimRefs:
      - CU001
      - CU011
      - CU012
      - CU013
      - CU017
      - CU020
      - CU023

