  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: customer-count-definition
      missingEvidence: "A management reconciliation of 15,000+ brands versus 80,000+ companies, including active paying customers, free or historical accounts, and partner accounts."
      whyItMatters: "Customer-count ambiguity can materially overstate or understate penetration, ARPA, and retention if the denominator is misused."
      diligencePath: "Request a customer-count bridge by year, product, active status, ARR band, and billing relationship."
      relatedQuestionRefs: [QU008]
    - type: private-evidence-only
      severity: material
      topic: retention-private
      missingEvidence: "NRR, GRR, logo churn, renewal rate, contract length, and cohort retention by vertical and ARR band."
      whyItMatters: "Retention economics determine whether the customer base is durable SaaS or primarily new-logo and usage-volume driven."
      diligencePath: "Review data-room revenue cohorts and speak with five renewal-stage customers across gaming, ecommerce, finance, entertainment, and agencies."
      relatedQuestionRefs: [QU016, QU020]
      relatedTableRefs: [TU004]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: "A complete, current customer list with production module, contract status, ARR band, geography, and reference willingness."
      whyItMatters: "The public named-customer table is only a sample and cannot prove concentration, renewal, or current deployment status."
      diligencePath: "Request anonymized top-50 customer schedule plus named reference calls for eBay, Visa, Nike, Playtika, Macy's, and Albertsons if available."
      relatedQuestionRefs: [QU011, QU012, QU014, QU015]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: concentration-private
      missingEvidence: "Top-customer ARR concentration, top-10 and top-25 revenue share, vertical ARR mix, and direct versus agency/partner channel mix."
      whyItMatters: "Customer and channel concentration could materially change downside risk, valuation multiple, and strategic buyer fit."
      diligencePath: "Request ARR concentration schedules, channel-sourced bookings, partner revenue-share terms, and churn by vertical."
      relatedQuestionRefs: [QU022, QU023, QU024]
      relatedTableRefs: [TU005]
    - type: access-blocked
      severity: minor
      topic: review-coverage
      missingEvidence: "Gartner Peer Insights review content and any FeaturedCustomers case-study count or metadata, including dates and named-customer details."
      whyItMatters: "Additional review and case-study directories could confirm or contradict G2, TrustRadius, PeerSpot, and company-lobby evidence."
      diligencePath: "Use licensed Gartner access or management-provided review exports; verify external directory claims directly before citing."
      relatedQuestionRefs: [QU017, QU019]
    - type: stale
      severity: material
      topic: customer-freshness
      missingEvidence: "Current active-use confirmation for older named customers including eBay, Macy's, Nike, HBO, Tencent, NBC Universal, Minecraft, and US Bank."
      whyItMatters: "Older logo lists prove historical access but can mislead investors if churned logos are treated as current production references."
      diligencePath: "Run customer reference calls and request renewal dates, modules used, and latest invoice or ARR band for each older logo."
      relatedQuestionRefs: [QU014, QU015]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: security-to-retention-link
      missingEvidence: "Post-March-2026 Web SDK incident customer churn, renewal objections, security-questionnaire outcomes, and remediation attestations."
      whyItMatters: "A customer-facing supply-chain event can affect expansion and retention even if internal infrastructure was not breached."
      diligencePath: "Review incident communications, customer escalations, security-control changes, and before/after renewal rates for Web SDK customers."
      relatedQuestionRefs: [QU027]
      relatedTableRefs: [TU005]
