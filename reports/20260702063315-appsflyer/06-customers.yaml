schemaVersion: "report-v2"
artifact: customers
slug: appsflyer
runDate: '2026-07-02'
company:
  name: AppsFlyer
chapter:
  number: 6
  title: Customers
  summary: >-
    AppsFlyer's public customer evidence supports a broad enterprise and mid-market base across gaming, ecommerce,
    finance, entertainment, agencies, and app-first brands, with company-reported scale rising from 12,000+ customers
    in 2020 to 15,000+ brands in 2026 and a much broader 80,000-company marketing claim on solution pages. The named
    proof is real but uneven: eBay, Macy's, Nike, Visa, and others appear as named customer or logo proof, Playtika has
    a current CTV case study, and review sites show strong satisfaction, while NRR, GRR, churn, contract duration,
    top-customer concentration, and renewal cohorts remain private diligence gaps.
sections:
  - id: customer-segmentation
    title: Customer base segmentation
    body: >-
      AppsFlyer's customer base should be underwritten as a multi-segment marketing-measurement platform rather than a
      single mobile-app vertical. The payer is usually a marketing, growth, user-acquisition, analytics, or agency team;
      the users are campaign managers, performance marketers, CRM operators, product analysts, and occasionally security
      or compliance stakeholders; and the economic sponsor is normally the executive accountable for paid media ROI,
      customer acquisition cost, and lifetime value. Official materials position the platform for startups through global
      brands and claim 1 in 3 Fortune 500 companies plus more than 80,000 companies on several solution pages, while the
      2026 investment announcement uses the narrower and more defensible 15,000+ brand-customer figure. The strongest
      vertical proof is in gaming, ecommerce and shopping, finance and fintech, entertainment and streaming, and agencies;
      those segments map directly to use cases such as mobile attribution, web-to-app deep linking, CTV measurement,
      fraud protection, audiences, data clean rooms, and AI-assisted analytics. TU001 frames the buyer/user/payer split,
      use-case breadth, scale evidence, revenue value, and diligence gaps; FU001 shows how these segments move from
      measurement pain to deployment and expansion.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU011
      - CU012
      - CU013
      - CU027
      - CU038
      - CU040
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-trajectory
    title: Adoption trajectory and usage signals
    body: >-
      Public adoption data is directional, not cohort-grade. AppsFlyer disclosed 12,000+ customers and a large partner
      ecosystem in 2020, disclosed that 2019 customers made $28 billion of marketing decisions using the platform, and
      disclosed 15,000+ brands in June 2026; together these points support durable category penetration, but not a clean
      active-account denominator, ARR-per-customer trend, product-seat count, or net-new logo cohort. The 2026 customer
      pages also use an 80,000-company claim, which is likely a broader marketing-reach or company-served metric and
      should not be treated as the same unit as the 15,000+ brand-customer figure until management reconciles the
      definitions. Review pages provide active-use texture: G2 cites a three-month implementation average and hundreds
      of current reviews, TrustRadius users describe day-to-day SSOT reporting, segmentation, push/in-app engagement,
      and retention analytics, and PeerSpot users describe enterprise deployments that connect attribution with
      onboarding and retention journeys. TU002 separates each supportable adoption signal from its missing denominator;
      FU002 converts the public evidence into a diligence funnel from logo discovery through deployment, usage, and
      expansion.
    claimRefs:
      - CU004
      - CU005
      - CU014
      - CU015
      - CU017
      - CU018
      - CU020
      - CU039
      - CU041
    tableRefs:
      - TU002
    figureRefs:
      - FU002

  - id: named-customer-proof
    title: Named customer proof and reference quality
    body: >-
      The named-customer file is credible enough to prove production exposure, but it varies materially by freshness and
      outcome specificity. The most current and concrete reference is Playtika, where AppsFlyer's own case study says
      the gaming company used AppsFlyer's CTV-to-mobile measurement to run and analyze CTV campaigns, measure installs
      and post-install actions, and continue optimization with its CSM; the case study reads like a live solution-design
      partnership, although it also states the work began with tests and does not publish a scaled spend or revenue
      denominator. Visa appears on the customer-story lobby with quantified app-download and registration-cost outcomes,
      while eBay, Macy's, Nike, HBO, Tencent, NBC Universal, Minecraft, US Bank, Coca-Cola, Waze, and Alibaba are named
      in older company or press materials primarily as logos or customer lists. That is still valuable: it demonstrates
      blue-chip procurement access across ecommerce, finance, media, and consumer apps. It is not enough to infer
      current production status, renewal, or concentration. TU003 enumerates representative named proof and its limits;
      FU003 grades references by segment, production clarity, outcome specificity, and freshness.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU042
      - CU043
    tableRefs:
      - TU003
    figureRefs:
      - FU003

  - id: retention-and-satisfaction
    title: Retention, durability, and satisfaction
    body: >-
      Retention is the weakest public component of the customer chapter. AppsFlyer markets retention and LTV workflows,
      and reviews contain user-level evidence that customers use the product repeatedly for cohort tables, SSOT reports,
      segmentation, push/in-app engagement, fraud prevention, and budget optimization. G2's 4.5 rating across 741
      reviews and PeerSpot's 8.4/10 rating are strong satisfaction signals, and TrustRadius examples cite increased app
      retention, DAU/MAU gains, and ongoing UA manager workflows. However, these signals cannot substitute for NRR, GRR,
      logo churn, customer renewal rates, gross retention by ARR band, average contract length, or cohort survival curves.
      Several reviews also point to friction: high pricing as event volume scales, reporting complexity, UI learning
      curve, and support responsiveness. The analysis therefore treats satisfaction as positive but incomplete and uses
      nulls for private retention metrics. TU004 lists every supportable retention or satisfaction proxy next to a direct
      diligence ask, while FU004 visualizes the evidence cohort as available, partial, or private rather than inventing
      percentages.
    claimRefs:
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: expansion-and-concentration
    title: Expansion and concentration risk
    body: >-
      AppsFlyer's expansion motion is a plausible land-and-expand model: a customer can begin with mobile measurement,
      add fraud protection and OneLink deep linking, expand into web, CTV, PC/console, incrementality, audiences, data
      clean rooms, and then consume AI-assisted or agentic workflows as the marketing stack becomes more autonomous.
      This matters because the 2026 strategic investment narrative explicitly ties measurement to richer AI-era signals,
      while solution pages promote first-party data collaboration, audience activation, retail media measurement, and
      privacy-preserving analytics for higher-value enterprise use cases. The concentration risks are mostly hidden.
      Gaming appears historically important through Playtika and the MMP category's gaming strength, but top-customer
      ARR, vertical ARR mix, customer-number definitions, partner-channel dependence, agency resale dependence, and
      walled-garden exposure are not disclosed. The March 2026 Web SDK compromise is a separate durability risk because
      customers embedding a third-party measurement script can be exposed even when their own code does not change.
      TU005 summarizes expansion drivers, concentration risks, impact, and diligence paths.
    claimRefs:
      - CU001
      - CU011
      - CU012
      - CU013
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU035
      - CU036
      - CU044
    tableRefs:
      - TU005
