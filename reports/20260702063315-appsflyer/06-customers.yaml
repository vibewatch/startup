callouts:
  - calloutType: strength
    title: Named enterprise proof confirms procurement access across high-value verticals
    body: >-
      AppsFlyer can point to large brands in ecommerce, finance, media, gaming, and consumer categories, including eBay,
      Visa, Nike, Playtika, Macy's, and other blue-chip logos. The diligence value is not that every logo proves current
      renewal; it is that the platform has already cleared procurement and technical adoption hurdles in segments with
      meaningful paid-media budgets.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
  - calloutType: risk
    title: Retention economics are private despite strong satisfaction proxies
    body: >-
      Review scores and customer-story outcomes are positive, but the public record does not disclose NRR, GRR, churn,
      renewal rates, contract length, top-customer exposure, or ARR cohorts. Any valuation or financing diligence should
      treat these as must-have data-room items rather than infer durability from logos or review ratings.
    claimRefs:
      - CU015
      - CU020
      - CU023
      - CU024
  - calloutType: insight
    title: The 15,000-brand and 80,000-company figures are not interchangeable
    body: >-
      AppsFlyer's 2026 investment release uses 15,000+ brands worldwide, while multiple solution pages say more than
      80,000 companies. The latter may include broader served, partner, free, historical, or marketing-reach accounts;
      management should reconcile definitions before investors use either as an active-paying-customer count.
    claimRefs:
      - CU002
      - CU003
  - calloutType: risk
    title: Web SDK trust incident can affect customer durability even without direct data compromise
    body: >-
      Feroot's March 2026 analysis warned that websites loading the AppsFlyer JavaScript SDK could serve malicious code
      to visitors, illustrating how a vendor script can become a customer-facing supply-chain risk. Customer diligence
      should test whether the incident created churn, security-questionnaire friction, or delayed expansions.
    claimRefs:
      - CU035
      - CU036
