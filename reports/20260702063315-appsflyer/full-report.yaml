        title: Switching cost and distribution power
        blocks:
          - type: paragraph
            body: >-
              Switching cost in this category is practical rather than purely contractual. The buyer embeds SDKs, event
              schemas, attribution windows, partner postbacks, fraud rules, dashboards, data exports, and budget
              processes around the measurement vendor, so changing providers risks reporting discontinuity even when the
              customer can technically multi-home. Multi-homing is common because advertisers still compare MMP output
              with Google, Meta, Apple, TikTok, DSP, BI, and finance data, but that does not eliminate vendor
              stickiness; it often increases the need for a trusted normalization layer. AppsFlyer's 10,000+ partner
              footprint and enterprise customer base create a real distribution advantage, yet partner access is not
              exclusive, and Kochava's 5,000+ integrations demonstrate that serious peers can maintain substantial
              supply. Distribution power is shifting toward platforms and AI-optimized ad buying systems whose signals
              feed campaign automation. TP003 therefore matters beyond budget: unknown realized pricing, volume
