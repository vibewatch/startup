      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional recommendation at the $2.7B entry mark
            body: >-
              AppsFlyer is investable only as a price- and evidence-conditional opportunity. The $2.7B round is
              defensible given scale and strategic validation, but it is not cheap enough to ignore private financial
              gaps or the 2026 SDK trust event.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
              - CV026
              - CV040
          - type: callout
            title: Strategic investors validate neutrality if ring-fencing holds
            body: >-
              Moloco, Google, Meta, and Unity taking minority, non-controlling stakes while accepting no preferential
              API, signal, or commercial access strengthens the independent-measurement thesis, provided diligence
              confirms side letters do not dilute the covenant.
            calloutType: strength
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV033
          - type: callout
            title: SDK trust is the primary valuation discount
            body: >-
              The March 2026 Web SDK compromise hit the exact trust surface AppsFlyer monetizes. A buyer should require
              independent forensic closure, customer impact data, legal reserve analysis, and hard security controls
              before underwriting IPO-style multiples.
            calloutType: risk
            claimRefs:
              - CV026
              - CV027
              - CV028
