  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than mobile attribution logos. Direct MMP peers include Adjust,
              Branch, Kochava, Singular, and smaller alternatives such as Tenjin, Airbridge, ByteBrew, Firebase,
              Trackier, RevenueCat, and Affise in the source market list. Incumbent pressure comes from AppLovin through
              its ownership of Adjust and from platform owners such as Apple, Google, Meta, TikTok, and Unity whose
              privacy rules or self-attribution data determine how much signal any independent MMP can see. Adjacent
              substitutes include MMM, clean-room, cost aggregation, ASO/search-automation, and in-house
              data-engineering stacks. AppsFlyer's differentiation is strongest when buyers want a neutral third-party
              layer across many partners rather than relying on one media seller's own reporting. The landscape map
              therefore treats neutrality and omnichannel breadth as separate axes, because a scaled ad platform can be
              powerful distribution without being a trusted referee. FP001 positions that tension and shows why the
              default status quo is still multi-homing across platform dashboards plus spreadsheets.
