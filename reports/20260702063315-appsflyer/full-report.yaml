      - number: '1.4'
        title: Scale, milestones, and external validation
        blocks:
          - type: paragraph
            body: >-
              Public scale metrics are a mix of company disclosures and third-party estimates that do not always share a
              common as-of date. Wikipedia's 2026 infobox lists AppsFlyer headcount at approximately 1,500 employees
              across more than 20 global office locations including San Francisco, New York, London, Berlin, Kyiv,
              Bengaluru, and Tokyo, while a Times of Israel report on the 2025 layoffs cited roughly 1,400 employees
              across 20 offices before the cut of 100 roles (about 7% of staff) — a gap the company has not reconciled
              in public materials. AppsFlyer states it serves more than 15,000 brand customers worldwide as of its June
              2026 announcement, up from the 12,000+ customers and 5,000+ technology partners it reported at its 2020
              Series D round, when its Series D materials also stated that 2019 customers made $28 billion worth of
              marketing decisions on the platform. Times of Israel reported AppsFlyer's annual revenue at approximately
              $400 million as of 2025; as a privately held company with no public financial filings, this figure — like
              headcount and total funding — originates from company statements or independent press estimates rather
              than audited financial statements.

              Milestones include the May 2018 acquisition of the Yodas development team, and two acquisitions within a
              single month in late 2023: Devtodev (gaming and app analytics) in November and oolo (AI-based
              user-acquisition and monetization, whose 15 employees all joined AppsFlyer) in December. The company has
              also collected industry recognition, including the 2019 Pocket Gamer Mobile Games Award for Best Analytics
              and Data Tool, the 2022 MarTech Breakthrough Award for Mobile Marketing Company of the Year, several 2023
              awards (Frost & Sullivan, Ventana Research, and an AWS Partner of the Year award), and five appearances on
              the Forbes Cloud 100 list through 2025. Independent market coverage from MobileAction's 2026 comparison of
              Mobile Measurement Partners lists AppsFlyer alongside Adjust, Singular, Branch, and Kochava as a leading
              Google Play-certified MMP, describing it as the category's "market leader."
