      - number: '1.5'
        title: Adverse events, litigation, and security risk
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer conducted a workforce reduction in 2025, cutting approximately 100 jobs (about 7% of staff), a
              decision CEO Oren Kaniel attributed to organizational streamlining and increased AI investment even though
              the company said it had become profitable for the first time, had been cash-flow positive for more than
              two years, and was exceeding its revenue, ARR, and EBITDA goals. Times of Israel's coverage placed the
              cuts within a broader wave of Israeli tech restructuring and noted they followed a similarly sized layoff
              at rival Adjust (owned by AppLovin) at the end of the prior year; affected employees reportedly received a
              special pay package and other transition benefits.

              In a June 6, 2022 order, the U.S. District Court for the Northern District of California dismissed with
              leave to amend all claims against AppsFlyer, Inc. in In re Flo Health, Inc. Consumer Privacy Litigation
              (No. 3:21-cv-00757-JD), where AppsFlyer had been named alongside Facebook, Google, and Flurry over alleged
              undisclosed sharing of Flo Health app user data collected via SDKs. The court distinguished AppsFlyer from
              the other defendants, finding the complaint did not allege AppsFlyer used the data for advertising or
              marketing — only for unspecified "AppsFlyer's own purposes" — which was insufficient to establish
              standing; the sources reviewed do not show a subsequent amended-complaint outcome or final disposition.

              Between approximately March 9-10, 2026, an attacker compromised AppsFlyer's domain registrar account
              through social engineering, disabled multi-factor authentication, and used the resulting access to
              redirect the websdk.appsflyer.com content-delivery domain to attacker infrastructure. For roughly 14
              hours, the hijacked Web SDK served obfuscated malicious JavaScript that intercepted and silently replaced
              cryptocurrency wallet addresses (Bitcoin, Ethereum, Solana, Ripple, TRON) entered by end users, using
              network-request interception, DOM mutation observers, and clipboard monitoring while preserving legitimate
              analytics functionality to evade detection. AppsFlyer stated its internal infrastructure, application
              servers, and customer data environments were not directly compromised, and that its mobile SDKs (distinct
              from the Web SDK) were unaffected; security researchers estimated the Web SDK is loaded by more than
              15,000 businesses and 100,000+ apps, though no specific victim was publicly confirmed with documented
              financial loss in the sources reviewed.
            claimRefs:
              - CO037
              - CO038
              - CO039
              - CO040
              - CO041
              - CO042
              - CO043
              - CO044
              - CO045
              - CO046
              - CO047
              - CO048
              - CO049
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Tri-party 2026 investment signals ecosystem-wide reliance on independent measurement
            body: >-
              Google, Meta, Unity, and Moloco each taking a minority, non-controlling stake at a $2.7 billion valuation
              is a strong signal that major advertising and platform players see continued value in a neutral,
              third-party measurement layer even as AI reshapes ad buying. The structure explicitly denies any investor
              preferential access to AppsFlyer's APIs, signals, or commercial terms, which if honored in practice
              preserves the independence claim that has been central to AppsFlyer's positioning since its earliest
              funding rounds.
            calloutType: strength
            claimRefs:
              - CO022
              - CO023
              - CO029
          - type: callout
            title: Revenue, headcount, and cap table remain undisclosed ahead of a possible IPO
            body: >-
              As a private company with no public filings, AppsFlyer does not disclose audited revenue, EBITDA, or exact
              ownership percentages, and press estimates of its ~$400 million revenue and ~1,500 headcount are not
              reconciled with earlier company-reported figures. Given reported IPO preparation involving Goldman Sachs,
              JPMorgan, and Bank of America, any diligence process should request a full financial data room, cap table,
              and board governance package directly from the company before drawing valuation conclusions.
            calloutType: risk
            claimRefs:
              - CO013
              - CO027
              - CO030
              - CO031
          - type: callout
            title: March 2026 domain-registrar attack shows security perimeter gaps outside the application layer
            body: >-
              The March 2026 incident did not stem from a breach of AppsFlyer's own application code or customer data
              environment, but from a compromised domain registrar account that let an attacker redirect the Web SDK's
              content-delivery domain for roughly 14 hours. Because the Web SDK is loaded by an estimated 15,000+
              businesses and 100,000+ apps, the episode illustrates how a single third-party trust-boundary failure —
              outside the vendor's own infrastructure — can expose a very large downstream customer base to a
              crypto-theft payload.
            calloutType: risk
            claimRefs:
              - CO037
              - CO038
              - CO041
          - type: callout
            title: Fifteen-year founder-CEO continuity is a strength but concentrates key-person risk into an IPO window
            body: >-
              Oren Kaniel's uninterrupted tenure as CEO since 2011 has coincided with every major financing,
              acquisition, and crisis-response decision, including the 2025 restructuring and the March 2026 incident
              response, and Times of Israel's reporting places AppsFlyer in active IPO exploration with Goldman Sachs,
              JPMorgan, and Bank of America. That combination rewards continuity but leaves the company unusually
              exposed to single-executive risk at precisely the moment institutional and public-market scrutiny is set
              to increase.
            calloutType: insight
            claimRefs:
              - CO009
              - CO015
              - CO028
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The diligence boundary should start with the job AppsFlyer is hired to do: independent measurement,
              attribution, fraud protection, deep linking, and privacy-safe optimization for app and omnichannel
              marketers, not the full gross media market. Mobile ad spend, connected-TV performance media, and marketing
              analytics are demand pools, but they are not all revenue available to MMP vendors. The included spend is
              software subscription, usage, and conversion-linked spend paid to measurement platforms; excluded spend
              includes media buying, agency fees, app-store fees, cloud hosting, and internal marketing headcount.
              Status quo substitutes matter because a buyer can keep using platform dashboards, spreadsheets,
              Google/Firebase-style analytics, self-attributing network reports, or a custom data warehouse. AppsFlyer's
              own positioning as a Modern Marketing Cloud expands the adjacency, but the market definition table keeps
              the core MMP layer separate from broader analytics so valuation work does not accidentally capitalize
              media spend as software revenue.
            claimRefs:
