  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis is that AppsFlyer remains one of the few scaled neutral measurement layers in a
              market where AI-driven advertising needs independent signals more, not less. Public evidence supports a
              15,000+ brand base, a 10,000+ partner ecosystem, broad product surfaces across measurement, deep linking,
              fraud, data collaboration, and agentic AI, and a 2026 strategic investment by Moloco, Google, Meta, and
              Unity that explicitly preserves non-control and no-preference principles. That gives the company a
              credible neutrality moat and a path to broaden from core MMP into a Modern Marketing Cloud. The
              anti-thesis is equally concrete: the narrow MMP market is publicly sized in the hundreds of millions,
              privacy rules and walled gardens constrain deterministic attribution, customer reviews flag price and
              complexity, and the March 2026 Web SDK compromise struck the trust boundary customers embed in their own
              properties. The resulting view is conditional rather than unconditional: TV002 and FV004 show a strong
              franchise that still needs proof that trust, disclosure, and growth can support the valuation.
