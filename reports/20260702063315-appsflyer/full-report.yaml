            body: >-
              Retention is the weakest public component of the customer chapter. AppsFlyer markets retention and LTV
              workflows, and reviews contain user-level evidence that customers use the product repeatedly for cohort
              tables, SSOT reports, segmentation, push/in-app engagement, fraud prevention, and budget optimization.
