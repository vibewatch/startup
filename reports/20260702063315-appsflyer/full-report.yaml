      - number: '8.5'
        title: Comparables, exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The comparable set supports discipline more than precision. AppLovin is a useful public adtech reference
              because it is scaled, public, and owns Adjust, but it is not a clean MMP multiple because its advertising
              network economics and public-market liquidity differ from AppsFlyer's private SaaS measurement model.
              Adjust, Branch, Kochava, and Singular define the direct MMP and marketing-measurement peer set, but their
              private metrics are mostly unavailable. The reported private-equity acquisition interest around $3.5
              billion to $4.5 billion is therefore a more practical exit-readiness signal than a fully observable
              transaction comp, while the IPO track remains optional until an S-1, audited metrics, and market timing
              are visible. TV004 marks the comparable table as a partial enumeration, TV005 translates the downside into
              kill criteria, and TV006 lists final diligence asks. The exit call is conditional: M&A interest offers
              downside support, IPO can create upside, but only if financial disclosure and security trust are strong
              enough for public-company or sponsor scrutiny.
