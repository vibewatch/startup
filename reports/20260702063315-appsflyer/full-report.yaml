      - number: '7.2'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >-
              Legal exposure is broad because AppsFlyer processes marketing and attribution data in a privacy-regulated
              category while relying on customer configuration and partner data flows. Its Services Privacy Policy says
              it receives technical identifiers, engagement information, and other end-user data; it also acknowledges
              that such data may be treated as personal data in some jurisdictions and that customers have technical
              ability to configure the service to collect PII despite contractual limits. That structure leaves residual
              GDPR, CCPA, cross-border transfer, DPF, and controller/processor-allocation risk. The ClassAction.org
              AppsFlyer category is best treated as a monitoring signal, not proof of a material judgment, because the
              visible page does not establish an adjudicated AppsFlyer-specific liability. TR001 therefore uses partial
              enumeration and ranks privacy/data-protection, SDK-incident claims, and investor-round regulatory approval
              above routine IP/licensing unknowns. The diligence path is legal-led: litigation docket searches,
              DPA/insurance review, incident notification chronology, and regulator inquiry confirmations.
            claimRefs:
