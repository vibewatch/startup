      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The cleanest public MMP sizing lens is narrow and modest: one analyst page reports $284 million in 2024,
              $320 million in 2025, and $639 million by 2032 at a 12.5% CAGR, while another reports $518 million by 2031
              at a 7.1% CAGR. Those are not interchangeable forecasts, and they sit awkwardly beside reports that
              AppsFlyer alone may be generating roughly $400-$500 million of revenue or ARR by 2025-2026. The most
              plausible reconciliation is that AppsFlyer revenue includes broader marketing-cloud, analytics,
              data-collaboration, fraud, deep-linking, and AI workflow modules beyond a narrowly defined MMP line item,
              or that public market pages understate the category. For diligence, the TAM should therefore be shown as a
              layered range: core MMP software, broader mobile attribution and analytics software, and a much larger
              mobile advertising spend pool that creates demand but is not addressable revenue. TM002 is intentionally
              an enumeration table with partial coverage rather than a market census.
