            body: >-
              Deployment appears to be SaaS plus instrumentation: marketers and developers install SDKs or web tools,
              configure events and links, enable partner integrations in the dashboard, and consume outputs through
              dashboards, APIs, clean-room reports, and partner activations. Public customer reviews suggest the product
              can simplify attribution and third-party integration, but also that dashboards can feel complex and that
              pricing can be difficult for smaller or low-revenue apps. Roadmap evidence is unusually current: AppsFlyer
              launched MCP in July 2025, announced eight AI and measurement products in November 2025, and was covered
              in early 2026 for an OpenAI-powered Dynamic Query Engine for its Data Clean Room. The roadmap direction is
              clear — AI access, privacy-safe collaboration, incrementality, cross-platform journeys, and enterprise
              security — but public sources do not disclose SLA, uptime, implementation-time distribution, support
