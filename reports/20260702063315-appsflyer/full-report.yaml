  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in marketer workflow terms
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer is best understood as a workflow layer for growth, performance, product, and martech teams that
              need to turn campaign touchpoints into trusted actions: attribute installs and in-app events, link users
              into the right app destination, detect fraud, segment audiences, collaborate on privacy-restricted data,
              and increasingly ask AI agents to surface insights or execute operational tasks. The company's own
              positioning says it moved from a mobile measurement pioneer into a Modern Marketing Cloud as journeys
              fragmented across devices, platforms, and privacy rules; the current workflow starts with marketer or
              developer instrumentation, then normalizes signals into dashboards, reports, partner integrations, APIs,
              clean-room outputs, and AI-assisted workflows. That makes AppsFlyer less a single point solution than a
              measurement operating system, but the value proposition still depends on customers accepting SDK and API
              integration work and trusting a third-party data-processing layer after the March 2026 Web SDK compromise.
