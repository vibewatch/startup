          - type: callout
            title: Bull case requires paid AI and data-collaboration expansion
            body: >-
              The bull range assumes the Modern Marketing Cloud and agentic AI launches convert into measurable ARR
              expansion, not merely messaging. Without SKU-level attach and NRR proof, the core MMP market alone does
              not justify aggressive upside multiples.
            calloutType: assumption
            claimRefs:
