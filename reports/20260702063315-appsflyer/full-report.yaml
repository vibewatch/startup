            body: >-
              The company is strategically dependent on platforms it does not control. Apple ATT, IDFA scarcity,
              SKAN/AdAttributionKit evolution, Google Privacy Sandbox, and walled-garden data limits can reduce
              attribution determinism and force MMPs toward modeled, aggregate, and incrementality products. That is
              simultaneously a demand driver and a risk: marketers need help navigating signal loss, but an MMP's
              measured value can compress if customers trust platform self-reporting, privacy APIs narrow data fields,
              or integration maintenance costs rise faster than pricing. Partner risk is more nuanced after the 2026
              round because Google, Meta, Unity, and Moloco are minority investors, partners, and in some cases platform
              or advertising competitors. AppsFlyer's neutrality covenant matters, but it must be tested in customer
