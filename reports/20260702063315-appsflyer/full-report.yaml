      - number: '8.4'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario work should use ranges rather than a single point estimate because the most important inputs are
              private. The bear case values AppsFlyer around $1.5 billion to $2.0 billion if the Web SDK event causes
              measurable churn, procurement friction, legal reserve needs, or a lower public-market multiple while IPO
              timing slips. The base case holds the $2.7 billion entry value and allows movement toward $3.5 billion if
              management proves profitable scale, remediation, no preferential strategic-investor rights, and continued
              customer demand for neutral measurement. The bull case reaches roughly $4.5 billion to $6.0 billion if AI,
              clean-room, incrementality, and cross-platform measurement products become real paid expansion vectors and
              public markets reward a profitable independent measurement infrastructure story. TV003 records explicit
              assumptions and probability signals, while FV003 converts them into valuation and return ranges. The cases
              are not forecasts; they are diligence-backed price bands that identify what would move the IC from
              conditional support to buy, hold, or avoid.
