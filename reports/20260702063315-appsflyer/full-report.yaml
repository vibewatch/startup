      - number: '1.3'
        title: Funding history, ownership, and valuation
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer's funding history spans five priced rounds. It raised $7.1 million in Series A funding in 2014
              from Pitango Venture Capital and Magma Venture Partners; $20 million in Series B funding in January 2015
              led by Fidelity Growth Partners Europe (now Eight Roads Ventures), bringing total funding to $28 million;
              and $56 million in Series C funding in January 2017 led by Qumra Capital with Goldman Sachs Private
              Capital Investing, Deutsche Telekom Capital Partners, and Pitango Growth participating, at which point its
              SDK had been installed on more than 2.5 billion unique devices. In January 2020, AppsFlyer raised a $210
              million Series D round led by General Atlantic at a $1.6 billion valuation, becoming — per its own
              announcement — the first unicorn in the attribution category, with existing investors Qumra Capital,
              Goldman Sachs Growth, DTCP, Pitango Venture Capital, and Magma Venture Partners also participating.

              In June 2026, AppsFlyer announced a signed definitive agreement for an investment of more than $1 billion
              from Google, Meta, Unity, and Moloco at a $2.7 billion post-money valuation, up from the $2 billion level
              reached after the 2020 round. The company stated each 2026 investor stake is minority, non-controlling,
              and non- exclusive, with no preferential treatment on APIs, measurement signals, attribution logic, or
              commercial terms, and that customers retain full control over which measurement partners they use.
              Calcalist reported that much of the 2026 capital was structured through secondary share sales, that
              General Atlantic — the largest institutional shareholder since 2020 — holds an estimated 15%-20% stake,
              and that several existing investors sold significant or complete positions in the transaction. Goldman
              Sachs acted as exclusive financial advisor to AppsFlyer on the 2026 deal, with Meitar and Latham & Watkins
              as legal advisors. Aggregating disclosed rounds, total priced equity funding through the 2020 Series D is
              approximately $294-300 million, and press coverage of the 2026 round frames lifetime capital raised
              (including secondaries) at more than $1.3 billion, though no single audited source itemizes every dollar.
              Times of Israel separately reported that, alongside 2025 layoffs, AppsFlyer was working with Goldman
              Sachs, JPMorgan, and Bank of America to explore a U.S. IPO targeting roughly $300 million in proceeds,
              citing a Bloomberg report.
