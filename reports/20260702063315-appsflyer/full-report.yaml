  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer's customer base should be underwritten as a multi-segment marketing-measurement platform rather
              than a single mobile-app vertical. The payer is usually a marketing, growth, user-acquisition, analytics,
              or agency team; the users are campaign managers, performance marketers, CRM operators, product analysts,
              and occasionally security or compliance stakeholders; and the economic sponsor is normally the executive
              accountable for paid media ROI, customer acquisition cost, and lifetime value. Official materials position
              the platform for startups through global brands and claim 1 in 3 Fortune 500 companies plus more than
              80,000 companies on several solution pages, while the 2026 investment announcement uses the narrower and
              more defensible 15,000+ brand-customer figure. The strongest vertical proof is in gaming, ecommerce and
              shopping, finance and fintech, entertainment and streaming, and agencies; those segments map directly to
              use cases such as mobile attribution, web-to-app deep linking, CTV measurement, fraud protection,
              audiences, data clean rooms, and AI-assisted analytics. TU001 frames the buyer/user/payer split, use-case
              breadth, scale evidence, revenue value, and diligence gaps; FU001 shows how these segments move from
              measurement pain to deployment and expansion.
