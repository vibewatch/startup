        title: Revenue model and mix
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer's revenue model is best read as enterprise SaaS plus usage-sensitive marketing-measurement
              economics, not as a pure ad network or media reseller. The official description frames AppsFlyer as a
              Modern Marketing Cloud spanning omnichannel measurement, deep linking, data collaboration, and autonomous
              AI workflows, while independent reporting describes annual revenue as coming from the sale of software as
              a service for advertising management. Public evidence supports the existence of multiple monetizable
              product surfaces: core attribution and measurement, OneLink/deep linking, fraud protection,
              privacy/data-collaboration products, and AI-powered measurement workflows. What is not public is the mix
              across those streams, the realized price per customer, and the revenue-recognition policy for usage spikes
              or multi-year enterprise contracts. The Revenue streams table and Revenue model bridge therefore
              distinguish sourced revenue mechanisms from unsupported mix estimates, preserving the conflict between
              roughly $400 million reported revenue and about $500 million ARR-style estimates rather than forcing a
