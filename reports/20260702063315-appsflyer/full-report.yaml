  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and severity ranking
        blocks:
          - type: paragraph
            body: >-
              The severity ranking should start with the March 2026 Web SDK incident rather than with ordinary SaaS
              execution risk. Multiple independent security researchers describe a March 9-11 compromise of the Web SDK
              distribution path that delivered obfuscated JavaScript, intercepted cryptocurrency wallet addresses,
              preserved legitimate analytics behavior, and potentially exposed a very large installed base. That is a
              trust event in the exact surface AppsFlyer sells: neutral, privacy-aware measurement embedded in customer
              properties. The base case is not that the incident destroys the business; AppsFlyer has official trust,
              privacy, and incident-response posture and remains large enough to attract Google, Meta, Unity, and Moloco
              investment. The investment implication is instead diligence gating: require forensic closure,
              customer-notification evidence, cyber-insurance limits, registrar/DNS control proof, and churn/cohort data
              before underwriting an IPO-style multiple. FR001 summarizes likelihood versus impact, while TR005 converts
              the ranked risks into monitorable kill criteria.
