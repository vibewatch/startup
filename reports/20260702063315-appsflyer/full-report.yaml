      - number: '8.2'
        title: Recommendation, confidence, risk rating, and decision stance
        blocks:
          - type: paragraph
            body: >-
              The recommended verdict is cautious-positive / conditional, equivalent to track-to-buy only if the
              investor can enter near the $2.7 billion 2026 mark and receive company-level proof on remediation,
              financial quality, and preference structure. Confidence is medium because the public record is rich on
              financing, product, market, and incident evidence but thin on the metrics that determine valuation
              quality: audited revenue, ARR bridge, gross margin, NRR, churn, customer concentration, cash, primary
              proceeds, and post-incident cohort performance. Risk is medium-high because a trusted SDK distribution
              event, platform signal dependence, strategic investor conflict perception, and IPO-window uncertainty can
              all transmit directly into retention and exit multiple. Valuation stance is fair-to-full at $2.7 billion
              rather than cheap. The decision implication in TV001 is to proceed only with price protection,
              breach-remediation covenants, full financial disclosure, and a clear walk-away path; FV001 visualizes the
              logic from franchise strength through downside gates to a conditional recommendation.
            claimRefs:
              - CV002
              - CV003
