      - number: '7.3'
        title: Operational, quality, and security risks
        blocks:
          - type: paragraph
            body: >-
              Operational risk is concentrated in client-side code distribution, security controls, and execution
              capacity after restructuring. The Web SDK compromise shows that third-party marketing scripts can fail as
              supply-chain infrastructure even where the vendor's core cloud is not breached: cside described a
              registrar-level DNS hijack, silent SDK downgrade, polymorphic payloads, fetch replacement, DOM monitoring,
              and exfiltration endpoints. Feroot and Reflectiz emphasize that customer sites could have served malicious
              code without local code changes and that ordinary allowlists, WAFs, firewalls, and endpoint agents were
              poorly positioned to see the behavior. The mitigation maturity is improving if AppsFlyer has fully moved
              clean builds, tightened registrar controls, and audited customer impact, but public evidence does not yet
              prove those actions end-to-end. TR002 ranks these operational modes, including layoff and facilities
              complexity, and FR002 shows how an infrastructure fault travels into customer trust, legal spend, churn,
