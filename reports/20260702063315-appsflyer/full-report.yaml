      - number: '8.3'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The June 2026 transaction provides a real valuation anchor but not a complete underwriting answer.
              AppsFlyer announced investments above $1 billion at a $2.7 billion post-money valuation, and independent
              coverage says much of the transaction involved secondary liquidity while the official release describes
              both shareholder liquidity and new long-term strategic equity participation. That structure validates
              demand for the asset and helps existing holders, but it does not reveal how much cash entered the balance
              sheet, what liquidation preferences or side letters exist, or whether ordinary investors can obtain the
              same economics as strategic participants. Publicly reported revenue and ARR anchors of roughly $400
              million to $500 million imply about 5.4x to 6.8x revenue/ARR at $2.7 billion; if lower internal revenue
              applies, the multiple is meaningfully higher. FV002 frames the sensitivity: the same price is supportable
              with audited profitability and clean retention, stretched with unresolved incident impact, and
              unattractive if the core MMP market matures faster than adjacent AI products monetize.
            claimRefs:
