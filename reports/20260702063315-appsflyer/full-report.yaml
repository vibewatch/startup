      - number: '2.5'
        title: Preserved sizing gaps and conflicts
        blocks:
          - type: paragraph
            body: >-
              The chapter deliberately preserves contradictions instead of forcing a false precision TAM. The two public
              MMP market estimates diverge on terminal year, value, and CAGR; customer-review and vendor pages confirm
              product utility but do not reveal paid-seat penetration or net retention; and AppsFlyer is private, so
              segment revenue, gross retention, vertical mix, and module attach rates are not auditable from public
              filings. This matters because a $400-$500 million revenue run-rate can imply category dominance, category
              misdefinition, or revenue pulled from adjacent marketing-cloud modules. Diligence should request
              management's market bridge from core MMP to broader cloud, a source-of-revenue split by product family,
              top vertical mix, cohort retention after ATT/SKAN changes, competitive win/loss against Adjust, Kochava,
              Singular, Branch, and internal build, and security remediation evidence after the SDK incident. Until
              those paths are closed, market analysis should support a favorable strategic narrative but only medium
              confidence in precise SAM/SOM conversion.
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM038
              - CM039
              - CM040
              - CM041
              - CM042
