      - number: '5.5'
        title: Differentiation, trust, and product-technology risks
        blocks:
          - type: paragraph
            body: >-
              The strongest product-technology differentiation is AppsFlyer's neutral measurement role across many ad
              platforms, its integration surface, mature attribution franchise, privacy-preserving collaboration story,
              and rapid AI roadmap. Its June 2026 financing announcement reinforces this positioning by stating that
              Google, Meta, Unity, and Moloco are minority, non-controlling investors without preferential API, signal,
              methodology, or commercial access. Product trust is more mixed. The company markets privacy-by-design,
              privacy-preserving measurement, differential privacy and clean-room approaches, and the November 2025
              Enterprise-Grade Security Package adds SAML SSO, SCIM, audit logs, IP allow lists, granular RBAC, and Zero
              Trust alignment. However, the March 2026 Web SDK incident is a major control failure at a distribution
              trust boundary; even if AppsFlyer's internal cloud and mobile SDKs were not the source of compromise,
              diligence must verify registrar controls, domain lock processes, script integrity monitoring, customer
              notification, and incident closure.
