      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Oren Kaniel has served as CEO and co-founder of AppsFlyer continuously since the company's 2011 founding,
              through its 2020 Series D round, its 2025 workforce reduction, the March 2026 security incident, and the
              June 2026 investment round — a fifteen-year tenure with no succession plan or co-CEO arrangement disclosed
              in any public material reviewed. Co-founder Reshef Mann remains listed as CTO in current company
              leadership materials as of 2026. Other named 2026 executives include Gal Ekstein (Chief Business Officer),
              Nachum Falek (Chief Financial Officer), Oren Levy (Chief Strategy Officer), Barak Witkowski (Chief Product
              Officer), and Ziv Peled (Chief AI Officer); the creation of a dedicated Chief AI Officer role reflects the
              company's stated strategic pivot toward agentic AI and AI-powered measurement products.

              AppsFlyer's official and investor-facing materials reviewed for this chapter do not publish a full board
              of directors roster or governance charter beyond individual director appointments tied to specific
              financing events. In January 2020, Alex Crisses (Managing Director) and Anton Levy (Co-President and
              Global Head of Technology) of General Atlantic joined AppsFlyer's board in connection with the Series D
              round, and Calcalist's 2026 reporting indicates General Atlantic continues to hold board representation.
              Key-person concentration is significant: Kaniel has been the sole CEO across every disclosed financing
              event, the 2025 restructuring, and the company's public response to the March 2026 security incident,
              which raises meaningful continuity risk for any prospective investor or acquirer evaluating the business
              ahead of a possible IPO.
