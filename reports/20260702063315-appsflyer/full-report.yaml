  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Security remediation failure
        - No independent forensic closure, repeat trusted-script incident, or material customer claims
        - Neutral trusted-infrastructure thesis breaks
        - Avoid or require a materially lower valuation and indemnity
      - - Financial disclosure miss
        - Audited revenue, ARR, NRR, gross margin, or FCF materially below underwriting case
        - Reported scale/profitability no longer supports $2.7B
        - Reprice or move to research-more
      - - Platform signal shock
        - Apple, Google, or walled gardens materially reduce usable attribution data
        - Product value and customer ROI compress
        - Cut growth/multiple and require roadmap proof
      - - Strategic investor conflict
        - Preferential data, API, board, or commercial terms contradict neutrality covenant
        - Independent referee positioning weakens
        - Treat as thesis break unless ring-fenced contractually
      - - IPO window shuts
        - No S-1 path, weak market receptivity, or sponsor bids below entry for 12-18 months
        - Exit optionality falls and holding-period risk rises
        - Require lower entry price or structured downside protection
      - - Customer trust erosion
        - Enterprise churn, procurement holds, or security audit failures exceed management plan
        - Retention and NRR assumptions fail
        - Pause closing pending cohort proof
    notes: >-
      Thresholds are monitorable diligence conditions, not public company guidance; several require private company
      records or third-party verification.
