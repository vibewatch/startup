      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest structural driver is privacy-driven complexity: ATT, IDFA scarcity, SKAdNetwork, and
              walled-garden limits made deterministic user-level attribution harder and increased the value of tools
              that combine consented identifiers, aggregate postbacks, probabilistic modeling, incrementality, and
              media-mix measurement. A second driver is spend fragmentation: marketers need one neutral view across
              Meta, Google, TikTok, Apple Search Ads, CTV, and emerging channels. A third is AI-driven optimization,
              because automated bidding agents need trusted signals rather than self-interested platform reporting. The
              constraints are equally material. Buyers worry about cost, SDK fatigue, engineering effort, reporting
              complexity, and whether a third-party script or SDK increases security and privacy exposure. Public
              customer reviews praise attribution and integrations but also mention price, complexity, and support
              latency, while the 2026 JavaScript SDK compromise creates a trust diligence item that could slow
              procurement in regulated verticals.
            claimRefs:
