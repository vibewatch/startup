      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is normally the CMO, VP Growth, performance-marketing leader, or user-acquisition owner
              who must allocate spend across mobile networks and prove ROAS. The day-to-day users are growth marketers,
              UA managers, marketing analysts, data engineers, fraud analysts, and sometimes agency teams running
              campaigns on behalf of app publishers. Payers vary by maturity: indie games may start with free or
              conversion-priced plans, scale-ups graduate into paid MMP tooling when paid acquisition expands, and
              enterprises buy custom contracts because they need raw data, security reviews, privacy support, and
              integrations across thousands of partners. Adoption is rarely purely top-down; the product enters through
              a campaign, SDK integration, SKAN need, fraud concern, or channel expansion, then becomes sticky because
              attribution history, partner mappings, dashboards, and raw-data exports become part of budget planning.
              The segment map therefore treats gaming, ecommerce, fintech, entertainment, and agencies as different
              buying motions rather than one generic marketer.
