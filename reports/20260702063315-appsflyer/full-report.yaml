chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and business model
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer is a software-as-a-service company providing marketing measurement, attribution, deep linking,
              data collaboration, and analytics tools, which it now markets as the "Modern Marketing Cloud." The company
              was founded in Israel in 2011 by CEO Oren Kaniel and CTO Reshef Mann, after participating in the Microsoft
              Ventures Accelerator program in its early stages. Its global headquarters is at 100 First Street in San
              Francisco's SoMa district, an 11,000-square-foot office the company opened in February 2018 after
              outgrowing earlier space following its 2017 Series C round; AppsFlyer retains major operations in Herzliya
              and Haifa, Israel, dating to its founding.

              The core business model is SaaS subscription and usage-based pricing: marketers, publishers, and platforms
              pay for measurement, attribution, deep-linking, fraud-protection, and AI-driven analytics products
              spanning mobile, web, CTV, and PC/console channels. In November 2025, the company announced its evolution
              from a mobile- attribution pioneer into the broader Modern Marketing Cloud, expanding its stated scope to
              unified omnichannel measurement, data collaboration, and AI-driven marketing. Its own materials describe
              the mission as delivering "AI-powered, privacy-first measurement technologies that turn data into growth
              opportunities," without disclosing specific revenue, profit, or independent financial metrics. AppsFlyer's
              partner marketing states that "1 in 3 Fortune 500 companies" use its platform and that it serves more than
              80,000 companies in total, though this is a company claim not independently corroborated in the sources
              reviewed for this chapter.
            claimRefs:
