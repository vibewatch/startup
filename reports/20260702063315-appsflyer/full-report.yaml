figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      AppsFlyer's public record spans a 2011 Israeli founding, four venture rounds through 2020, two acquisitions in
      late 2023, a 2025 restructuring, a March 2026 security incident, and a June 2026 investment at a $2.7B valuation.
    data:
      items:
        - date: '2011'
          label: AppsFlyer founded
          detail: Oren Kaniel and Reshef Mann found the company in Israel.
          tone: positive
        - date: 2015-01
          label: Series B ($20M)
          detail: Led by Fidelity Growth Partners Europe; funds SF, Beijing, and Tel Aviv offices.
          tone: positive
        - date: 2017-01
          label: Series C ($56M)
          detail: SDK reaches 2.5B+ devices; revenue reported tripling annually.
          tone: positive
        - date: 2018-02
          label: Opens San Francisco HQ
          detail: 11,000 sq ft office signals deepened U.S. commitment.
          tone: positive
        - date: 2020-01
          label: Series D ($210M / $1.6B valuation)
          detail: Led by General Atlantic; first unicorn in the attribution category.
          tone: positive
        - date: 2022-06
          label: Flo Health litigation claims dismissed
          detail: Court finds no adequately alleged injury caused specifically by AppsFlyer; dismissed with leave to amend.
          tone: neutral
        - date: 2023-11
          label: Acquires Devtodev
          detail: Gaming and app analytics firm joins the platform.
          tone: positive
        - date: 2023-12
          label: Acquires oolo
          detail: AI-based UA/monetization platform; second acquisition within a month.
          tone: positive
        - date: '2025'
          label: Cuts ~100 jobs (7%)
          detail: Restructuring despite reported profitability; framed as IPO preparation.
          tone: negative
        - date: 2026-03
          label: Web SDK supply-chain attack
          detail: Domain-registrar compromise serves crypto-stealing JavaScript for ~14 hours.
          tone: negative
        - date: 2026-06
          label: Google, Meta, Unity, Moloco invest $1B+ ($2.7B valuation)
          detail: Minority, non-controlling strategic investment with secondary liquidity.
          tone: positive
    approximationNotes: >-
      Series A (2014) and the May 2018 Yodas acquisition are omitted from the visual timeline for legibility but are
      captured in the milestone table; deal values for both 2023 acquisitions were not disclosed.
