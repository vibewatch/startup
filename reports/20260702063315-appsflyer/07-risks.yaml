callouts:
  - calloutType: risk
    title: "Top residual risk: trust-layer SDK compromise"
    body: "Even if the root cause was registrar/DNS rather than AppsFlyer cloud infrastructure, the customer-facing failure mode is a trusted AppsFlyer endpoint serving malicious code."
    claimRefs: [CR001, CR002, CR003, CR008, CR011]
  - calloutType: assumption
    title: "Neutrality covenant must be diligenced, not accepted"
    body: "The minority, non-controlling, no-preference covenant reduces investor-platform conflict risk, but side letters and information rights remain private."
    claimRefs: [CR024, CR025]
  - calloutType: recommendation
    title: "Price risk only after evidence pack is complete"
    body: "Do not underwrite an IPO multiple until audited financials, incident postmortem, regulator/litigation checks, and renewal cohorts close the material gaps."
    claimRefs: [CR036, CR037, CR039, CR040, CR041]
  - calloutType: insight
    title: "Privacy shifts are both demand driver and constraint"
    body: "ATT, Privacy Sandbox, SKAN, and walled-garden limits increase demand for privacy-safe measurement while lowering deterministic attribution confidence."
    claimRefs: [CR027, CR030, CR031]
