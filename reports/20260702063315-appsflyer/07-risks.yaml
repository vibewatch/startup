schemaVersion: "report-v2"
artifact: risks
slug: appsflyer
runDate: '2026-07-02'
company:
  name: AppsFlyer
chapter:
  number: 7
  title: Risks
  summary: >-
    AppsFlyer's risk stack is led by the March 2026 Web SDK supply-chain compromise, which converted a trusted measurement dependency into a client-side crypto-stealer and creates residual trust, customer notification, and legal exposure even if the company attributes the root cause to a registrar-level domain compromise rather than its own production cloud. The other IC-relevant risks are privacy litigation and enforcement, platform signal loss from Apple/Google/walled gardens, partner-investor neutrality conflict, private financial opacity, layoff execution risk, fraud prevalence, and IPO/market-timing risk.
sections:
  - id: risk-overview-and-ranking
    title: Risk overview and severity ranking
    body: >-
      The severity ranking should start with the March 2026 Web SDK incident rather than with ordinary SaaS execution risk. Multiple independent security researchers describe a March 9-11 compromise of the Web SDK distribution path that delivered obfuscated JavaScript, intercepted cryptocurrency wallet addresses, preserved legitimate analytics behavior, and potentially exposed a very large installed base. That is a trust event in the exact surface AppsFlyer sells: neutral, privacy-aware measurement embedded in customer properties. The base case is not that the incident destroys the business; AppsFlyer has official trust, privacy, and incident-response posture and remains large enough to attract Google, Meta, Unity, and Moloco investment. The investment implication is instead diligence gating: require forensic closure, customer-notification evidence, cyber-insurance limits, registrar/DNS control proof, and churn/cohort data before underwriting an IPO-style multiple. FR001 summarizes likelihood versus impact, while TR005 converts the ranked risks into monitorable kill criteria.
    claimRefs: [CR001, CR002, CR003, CR007, CR010, CR011, CR018, CR024, CR037, CR039]
    tableRefs: [TR005]
    figureRefs: [FR001]
  - id: regulatory-and-legal
    title: Regulatory and legal risks
    body: >-
      Legal exposure is broad because AppsFlyer processes marketing and attribution data in a privacy-regulated category while relying on customer configuration and partner data flows. Its Services Privacy Policy says it receives technical identifiers, engagement information, and other end-user data; it also acknowledges that such data may be treated as personal data in some jurisdictions and that customers have technical ability to configure the service to collect PII despite contractual limits. That structure leaves residual GDPR, CCPA, cross-border transfer, DPF, and controller/processor-allocation risk. The ClassAction.org AppsFlyer category is best treated as a monitoring signal, not proof of a material judgment, because the visible page does not establish an adjudicated AppsFlyer-specific liability. TR001 therefore uses partial enumeration and ranks privacy/data-protection, SDK-incident claims, and investor-round regulatory approval above routine IP/licensing unknowns. The diligence path is legal-led: litigation docket searches, DPA/insurance review, incident notification chronology, and regulator inquiry confirmations.
    claimRefs: [CR012, CR013, CR014, CR015, CR016, CR017, CR024, CR025, CR045]
    tableRefs: [TR001]
  - id: operational-and-security
    title: Operational, quality, and security risks
    body: >-
      Operational risk is concentrated in client-side code distribution, security controls, and execution capacity after restructuring. The Web SDK compromise shows that third-party marketing scripts can fail as supply-chain infrastructure even where the vendor's core cloud is not breached: cside described a registrar-level DNS hijack, silent SDK downgrade, polymorphic payloads, fetch replacement, DOM monitoring, and exfiltration endpoints. Feroot and Reflectiz emphasize that customer sites could have served malicious code without local code changes and that ordinary allowlists, WAFs, firewalls, and endpoint agents were poorly positioned to see the behavior. The mitigation maturity is improving if AppsFlyer has fully moved clean builds, tightened registrar controls, and audited customer impact, but public evidence does not yet prove those actions end-to-end. TR002 ranks these operational modes, including layoff and facilities complexity, and FR002 shows how an infrastructure fault travels into customer trust, legal spend, churn, and valuation.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR008, CR009, CR010, CR020, CR021, CR022, CR023]
    tableRefs: [TR002]
    figureRefs: [FR002]
  - id: partner-and-platform-dependency
    title: Partner and platform dependency risks
    body: >-
      The company is strategically dependent on platforms it does not control. Apple ATT, IDFA scarcity, SKAN/AdAttributionKit evolution, Google Privacy Sandbox, and walled-garden data limits can reduce attribution determinism and force MMPs toward modeled, aggregate, and incrementality products. That is simultaneously a demand driver and a risk: marketers need help navigating signal loss, but an MMP's measured value can compress if customers trust platform self-reporting, privacy APIs narrow data fields, or integration maintenance costs rise faster than pricing. Partner risk is more nuanced after the 2026 round because Google, Meta, Unity, and Moloco are minority investors, partners, and in some cases platform or advertising competitors. AppsFlyer's neutrality covenant matters, but it must be tested in customer contracts, API governance, data-sharing logs, and board/observer rights. TR003 and FR003 map the dependencies to failure scenarios and residual exposure.
    claimRefs: [CR024, CR025, CR026, CR027, CR028, CR029, CR030, CR031, CR032, CR033, CR043, CR044]
    tableRefs: [TR003]
    figureRefs: [FR003]
  - id: financial-and-mitigations
    title: Financial, people, and thesis-break mitigations
    body: >-
      Financial/model risk is mostly opacity rather than visible distress. Public sources report a June 2026 financing above $1 billion at a $2.7 billion valuation, some secondary liquidity, IPO ambition, and revenue or ARR figures ranging from roughly $400 million revenue to about $500 million ARR, but no audited statements, gross margin, retention, burn, working capital, or net revenue retention are available in public evidence. That makes valuation sensitive to disclosure surprises, market multiple compression, and the degree to which the incident or platform changes affect renewal cohorts. Execution risk also matters: the September 2025 reduction of about 100 roles, or 7%, may improve operating leverage, but it can impair product velocity during an AI and IPO repositioning. TR004 ranks people risks. The mitigation posture is acceptable only if diligence receives audited financials, incident postmortem materials, regulator/litigation clearance, platform-roadmap evidence, and employee retention data.
    claimRefs: [CR020, CR021, CR034, CR035, CR036, CR037, CR038, CR039, CR040, CR041, CR042]
    tableRefs: [TR004]
