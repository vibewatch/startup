  topStrengths:
    - 独立移动测量基本盘规模大、品类定义清晰，拥有 10,000+ 集成；其中立性护城河不是 walled-garden 自归因可以轻易复制
    - 战略背书和退出可选性强：2026 年 6 月 Google、Meta、Unity、Moloco 以 $2.7B 估值入轮，公司据称已盈利，并在 Goldman/JPMorgan/BofA 辅导下推进 IPO 路线
    - 产品从归因延伸到 Data Clean Room、反欺诈 Protect360、audiences 和 agentic AI 套件，有机会扩大客户钱包份额
  topRisks:
    - 2026 年 3 月 Web SDK 供应链被攻破，registrar/DNS 层面的 crypto-stealer 可能触达 100,000+ 网站，留下长期信任、安全和潜在法律风险
    - 私有且相互冲突的财务信息——没有经审计收入、ARR、利润率、NRR、烧钱或客户集中度披露——无法有把握地承销 $2.7B 估值
    - 公司结构性依赖 Apple（ATT/SKAN/AdAttributionKit）和 Google 信号政策；核心 MMP 市场趋于成熟，同时 Google、Meta、Unity 这些投资方兼竞争者也带来渠道冲突观感
  unresolvedGaps:
    - 经审计收入、ARR 桥、毛利率、NRR/GRR、流失率、烧钱、现金跑道，以及 2026 轮新股 / 老股拆分均未披露
    - 2026 年 3 月 SDK 事件后客户留存、修复完整性、取证结案，以及任何诉讼或监管跟进仍未知
    - 按垂直行业和头部账户划分的客户 / 收入集中度，以及 $2.7B 投后估值背后的优先权 / 清算堆叠条款仍未公开
