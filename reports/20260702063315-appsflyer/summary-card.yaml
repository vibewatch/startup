  topStrengths:
    - >-
      Scaled, category-defining independent mobile measurement franchise with 10,000+ integrations and a neutrality moat
      that walled-garden self-attribution cannot easily replicate
    - >-
      Strong strategic validation and exit optionality — a June 2026 $2.7B round from Google, Meta, Unity, and Moloco,
      reported profitability, and an active Goldman/JPMorgan/BofA-advised IPO track
    - >-
      Product breadth beyond attribution into Data Clean Room, fraud protection (Protect360), audiences, and an agentic
      AI suite that can expand wallet share
  topRisks:
    - >-
      March 2026 Web SDK supply-chain compromise (registrar/DNS-level crypto-stealer reaching potentially 100,000+
      sites) creates lasting trust, security, and potential legal exposure
    - >-
      Private and conflicting financials — no audited revenue, ARR, margin, NRR, burn, or customer-concentration
      disclosure — prevent confident underwriting of the $2.7B mark
    - >-
      Structural dependence on Apple (ATT/SKAN/AdAttributionKit) and Google signal policy, a maturing core MMP market,
      and channel-conflict perception with investor-competitors Google, Meta, and Unity
  unresolvedGaps:
    - >-
      Audited revenue, ARR bridge, gross margin, NRR/GRR, churn, burn, runway, and primary-vs-secondary split of the
      2026 round are undisclosed
    - >-
      Post-incident customer retention, remediation completeness, forensic close-out, and any litigation or regulatory
      follow-through from the March 2026 SDK breach are unknown
    - >-
      Customer and revenue concentration by vertical and top accounts, plus preference/liquidation-stack terms behind
      the $2.7B post-money valuation, remain non-public
