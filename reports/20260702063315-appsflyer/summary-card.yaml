summary:
  headline: >-
    AppsFlyer is a scaled, profitable, independent measurement leader whose June 2026 $2.7B strategic round validates
    the franchise, but a March 2026 SDK trust event, opaque financials, and platform dependency make it a disciplined
    track-to-conditional-buy rather than a clean entry.
