company:
  name: AppsFlyer
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    AppsFlyer's product is a SaaS Modern Marketing Cloud built from a mobile-attribution core into measurement,
    deep-linking, data-collaboration, fraud-protection, and agentic-AI workflows. Public evidence supports a broad
    SDK/API/integration architecture and meaningful differentiation from independence, partner breadth, clean-room data
    collaboration, and AI releases, but diligence must treat reliability, certification detail, remediation closure,
    and the March 2026 Web SDK supply-chain compromise as material product-technology gaps.
sections:
  - id: product-overview
    title: Product definition in marketer workflow terms
    body: >-
      AppsFlyer is best understood as a workflow layer for growth, performance, product, and martech teams that need to
      turn campaign touchpoints into trusted actions: attribute installs and in-app events, link users into the right
      app destination, detect fraud, segment audiences, collaborate on privacy-restricted data, and increasingly ask AI
      agents to surface insights or execute operational tasks. The company's own positioning says it moved from a
      mobile measurement pioneer into a Modern Marketing Cloud as journeys fragmented across devices, platforms, and
      privacy rules; the current workflow starts with marketer or developer instrumentation, then normalizes signals
      into dashboards, reports, partner integrations, APIs, clean-room outputs, and AI-assisted workflows. That makes
      AppsFlyer less a single point solution than a measurement operating system, but the value proposition still
      depends on customers accepting SDK and API integration work and trusting a third-party data-processing layer after
      the March 2026 Web SDK compromise.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE006
      - CE031
      - CE032
    tableRefs:
      - TE002
    figureRefs:
      - FE002

  - id: module-map
    title: Product-line and capability map
    body: >-
      Public materials support four named suites — Measurement, Deep Linking, Data Collaboration, and Agentic AI — with
      important sub-products inside each suite. The Measurement Suite covers mobile, web, CTV, PC and console
      attribution, cross-platform journeys, ROI measurement, marketing analytics, incrementality, audiences, fraud
      protection, product analytics, dashboards, and creative optimization. Deep Linking is centered on OneLink and
      web-to-app, QR-to-app, email-to-app, text-to-app, referral-to-app, social-to-app, deferred deep-linking, and link
      management journeys. Data Collaboration includes Data Clean Room, Signal Hub, audience activation, data
      management, and retail-media measurement. Agentic AI includes Agent Hub, MCP, AI Assistant, pre-built agents, and
      natural-language dashboards. The matrix should be treated as a public-surface enumeration rather than a complete
      SKU list because packaging, tiering, pricing, and feature entitlement boundaries are not disclosed in the
      allocated sources.
