  - id: architecture-and-sdk
    title: SDK, data pipeline, and architecture implications
    body: >-
      The public architecture can be described with confidence only at the operating-model level: client SDKs and
      scripts on mobile, web, gaming, and CTV surfaces capture installs, events, links, and campaign metadata; server,
      API, and partner integrations enrich those signals; AppsFlyer's attribution and analytics services process the
      signals into dashboards, reports, audiences, postbacks, clean-room outputs, and AI or MCP access. The developer
      hub confirms Android, iOS, Unity, in-app events, SmartScript, Smart Banner, gaming and CTV SDKs, React Native,
      Flutter, Cordova, Xamarin, Capacitor, Unreal, Cocos2d, Adobe, and Segment surfaces. The architecture is powerful
      precisely because it sits in the customer journey and partner workflow, but that same position creates a high
      trust boundary: a compromised web script can execute in browser context, while privacy changes and walled gardens
      constrain attribution fidelity. Exact internal stack, latency, uptime, data-retention, and disaster-recovery
      commitments are not public.
    claimRefs:
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
      - CE026
      - CE027
      - CE028
      - CE030
      - CE033
