callouts:
  - calloutType: strength
    title: Neutral measurement remains the central product moat
    body: >-
      AppsFlyer's strongest technology claim is not a single algorithm but a neutral operating position across brands,
      media partners, platforms, and privacy-constrained data sources. The 2026 strategic-investor terms explicitly say
      Google, Meta, Unity, and Moloco receive no preferential API, signal, attribution-logic, or commercial access,
      which helps preserve the product's independence narrative if enforceable in practice.
    claimRefs:
      - CE035
      - CE036
      - CE037
      - CE038

  - calloutType: risk
    title: The Web SDK incident turns distribution security into a first-order diligence item
    body: >-
      The March 2026 compromise shows that AppsFlyer's product risk is not limited to application code or cloud
      infrastructure. A trusted script and DNS/registrar boundary can expose downstream customer sites, so diligence
      should request the incident report, registrar hardening proof, customer-notification record, and ongoing script
      integrity controls before accepting the trust story.
    claimRefs:
      - CE026
      - CE027
      - CE028
      - CE029
      - CE030

  - calloutType: insight
    title: AI roadmap is credible but still adoption-light in public evidence
    body: >-
      MCP, pre-built agents, Dynamic Query, natural-language dashboards, Signal Hub, and creative automation create a
      coherent AI roadmap for privacy-constrained marketing operations. Public sources prove launch timing and product
      intent, but not production penetration, expansion revenue, hallucination controls, or customer-retention lift.
    claimRefs:
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
      - CE023
      - CE024
      - CE025

  - calloutType: recommendation
    title: Ask for a product-risk data room before relying on enterprise security claims
    body: >-
      The diligence package should include SLA/uptime history, SOC/ISO reports if available, API and audit-log
      documentation, SSO/RBAC default controls, DCR privacy assessments, LLM data-handling terms, SDK version adoption,
      and March 2026 remediation evidence. Without those items, public materials support product breadth but not an
      enterprise-grade control conclusion.
    claimRefs:
      - CE021
      - CE040
      - CE041
      - CE042

