  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: module-map
      missingEvidence: "Complete current SKU, packaging, entitlement, and inactive-module list for AppsFlyer's product catalog."
      whyItMatters: "The public module matrix is partial and may overstate or understate what customers can actually buy in each tier."
      diligencePath: "Request current product catalog, order forms, packaging matrix, price book, and feature-entitlement documentation from AppsFlyer."
      relatedQuestionRefs: [QE003]
      relatedTableRefs: [TE001]
    - type: private-evidence-only
      severity: material
      topic: deployment-support
      missingEvidence: "Implementation-time distribution, support-tier commitments, customer migration data, and quantified deployment effort."
      whyItMatters: "Deployment friction affects sales cycles, expansion, churn, and customer implementation risk but is only lightly visible in public reviews."
      diligencePath: "Review implementation SOWs, support SLAs, onboarding metrics, support-ticket cohorts, and customer references by segment."
      relatedQuestionRefs: [QE012]
    - type: missing-source
      severity: material
      topic: reliability-gap
      missingEvidence: "Public or private uptime history, SLA terms, incident-response objectives, disaster-recovery posture, and status-page history."
      whyItMatters: "AppsFlyer sits in attribution, linking, and data workflows where outages or delayed postbacks can distort spend decisions."
      diligencePath: "Request status-page exports, SLA schedules, SOC reports, DR test evidence, and incident postmortems covering the last 24 months."
      relatedQuestionRefs: [QE025]
    - type: missing-source
      severity: material
      topic: compliance-gap
      missingEvidence: "Named SOC, ISO, privacy, or regional compliance reports and audit scopes applicable to the product stack and DCR."
      whyItMatters: "Public pages describe privacy-first controls, but enterprise buyers need independently audited scope and control evidence."
      diligencePath: "Request security portal access, SOC 2 Type II report, ISO certificates, subprocessor list, DPIA templates, and DCR assessment materials."
      relatedQuestionRefs: [QE019]
    - type: private-evidence-only
      severity: blocking
      topic: web-sdk-incident
      missingEvidence: "March 2026 incident report, registrar/DNS hardening proof, clean-build attestation, customer-notification logs, and remediation closure."
      whyItMatters: "The Web SDK incident is a major trust-boundary failure that could affect customer security, compliance, and renewal decisions."
      diligencePath: "Obtain the formal postmortem, registrar control evidence, domain-lock evidence, SRI/CSP guidance, customer notices, and board-risk materials."
      relatedQuestionRefs: [QE021]
      relatedTableRefs: [TE004]
    - type: private-evidence-only
      severity: material
      topic: ai-adoption-gap
