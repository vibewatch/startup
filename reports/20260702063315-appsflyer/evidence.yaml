      observers, and clipboard monitoring together, while preserving the SDK's legitimate analytics functionality, to
      evade detection during the exposure window, according to independent security researchers at the Cloud Security
      Alliance and Rescana.
    type: third-party-reported
    topic: security-incident
    sourceRefs:
