  - id: CO038
    statement: >-
      During the roughly 14-hour March 2026 exposure window, the compromised AppsFlyer Web SDK served obfuscated
      malicious JavaScript that intercepted cryptocurrency wallet addresses (Bitcoin, Ethereum, Solana, Ripple, and
      TRON) entered by end users on affected websites and apps, silently substituting attacker-controlled addresses to
      divert funds.
