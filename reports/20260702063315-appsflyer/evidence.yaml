evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Full board of directors roster, board charter, and governance rights for each institutional shareholder (General
      Atlantic, Salesforce Ventures, and the 2026 strategic investor group).
    whyItMatters: >-
      Board composition and governance rights shape oversight quality and control dynamics, and are material for any
      institutional investor or acquirer evaluating the company ahead of a possible IPO.
    diligencePath: >-
      Request board minutes, the shareholders' agreement, and a governance package directly from AppsFlyer or General
      Atlantic's counsel.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited revenue, EBITDA, gross margin, and cash-flow statements; the ~$400M revenue figure and
      'profitable/cash-flow-positive' claims rest on third-party or company statements only.
    whyItMatters: Valuation multiples, growth trajectory, and IPO readiness cannot be assessed without verified financials.
    diligencePath: Request a financial data room from AppsFlyer or its financial advisor (Goldman Sachs) ahead of any transaction.
    relatedQuestionRefs:
      - QO019
      - QO012
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: >-
      Exact cap table and precise ownership percentages for General Atlantic, Salesforce Ventures, founders, and the
      2026 investor group (Google, Meta, Unity, Moloco).
    whyItMatters: >-
      Ownership structure determines governance control, exit priority, and alignment between founders, employees, and
      institutional shareholders.
    diligencePath: >-
      Request the cap table and stock ledger via counsel; cross-check secondary-sale pricing referenced in press
      coverage.
    relatedQuestionRefs:
      - QO015
      - QO016
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: >-
      A single authoritative current headcount figure; Wikipedia's 2026 infobox (~1,500) and Times of Israel's 2025
      pre-layoff figure (~1,400) are the only public data points and do not share a common as-of date.
    whyItMatters: >-
      Headcount trend is a basic operating-scale indicator and the two available figures cannot be reconciled without a
      company-confirmed number.
    diligencePath: Request current headcount by function and geography directly from AppsFlyer HR or investor relations.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: reputation
    missingEvidence: >-
      Independently verified customer-review ratings (G2, Gartner Peer Insights, Trustpilot); all three review platforms
      blocked automated retrieval during this research.
    whyItMatters: >-
      Buyer sentiment and support-quality signals are a standard SaaS diligence input and could not be corroborated from
      primary review-site pages.
    diligencePath: >-
      Access G2 and Gartner Peer Insights via a licensed analyst seat or vendor-provided export rather than automated
      fetch.
    relatedQuestionRefs:
      - QO029
  - type: stale
    severity: minor
    topic: security-incident
    missingEvidence: >-
      A definitive AppsFlyer closure statement naming the attacker, confirming the forensic-investigation outcome, and
      disclosing whether any customer was confirmed to suffer financial loss from the March 2026 Web SDK compromise.
    whyItMatters: >-
      Without a closure statement, the incident's full customer impact and attribution remain open questions that could
      resurface as litigation or regulatory exposure.
    diligencePath: Request the final incident report and any customer notifications from AppsFlyer's security and legal teams.
    relatedQuestionRefs:
      - QO032
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: regulatory
    missingEvidence: >-
      Public record of any GDPR or other data-protection regulator investigation or enforcement action against AppsFlyer
      specifically; searches for this chapter surfaced only the U.S. Flo Health litigation, not EU regulatory
      proceedings.
    whyItMatters: >-
      AppsFlyer processes user data at scale across the EU and other GDPR-covered jurisdictions, so the absence of a
      found enforcement record should be confirmed as a true absence rather than a search gap.
    diligencePath: >-
      Search national data-protection-authority enforcement registers (e.g., Israel PPA, Ireland DPC) and request
      compliance attestations directly from AppsFlyer.
    relatedQuestionRefs:
      - QO026
  - type: private-evidence-only
    severity: material
    topic: company-scale
    missingEvidence: >-
      Audited or management-certified split of AppsFlyer revenue by core MMP, fraud, deep linking, data collaboration,
      AI workflow, and other cloud modules.
    whyItMatters: >-
      Without a revenue bridge, public MMP market estimates cannot be reconciled with the company's reported revenue or
      ARR scale.
    diligencePath: >-
      Request product-line ARR, gross retention, NRR, attach-rate, and cohort-expansion schedules from management and
      test them in customer calls.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Comparable bottom-up and top-down market models using the same geography, terminal year, category boundary, and
      revenue definition.
    whyItMatters: The public MMP market range changes materially depending on source and can distort valuation multiples.
    diligencePath: >-
      Commission or build an independent TAM/SAM/SOM model from vendor revenue, customer counts, app-advertiser counts,
      and pricing curves.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-owner
    missingEvidence: >-
      Representative customer interviews or procurement records showing budget owner, purchase trigger, implementation
      time, and annual contract size by vertical.
    whyItMatters: >-
      Buyer economics determine whether privacy complexity turns into durable software expansion or remains a narrow
      expert-tool budget.
    diligencePath: >-
      Interview at least ten customers across gaming, ecommerce, fintech, entertainment, and agencies, including churned
      or multi-homing accounts.
    relatedQuestionRefs:
      - QM029
  - type: missing-source
    severity: material
    topic: trust-risk
    missingEvidence: >-
      Evidence of customer churn, delayed renewals, procurement objections, and remediation acceptance after the 2026
      JavaScript SDK compromise.
    whyItMatters: >-
      Security trust is central to third-party measurement adoption, especially for fintech, healthcare, and ecommerce
      buyers.
    diligencePath: >-
      Request incident RCA, customer notification logs, renewal impact, penetration-test results, and updated
      vendor-security questionnaires.
    relatedQuestionRefs:
      - QM026
  - type: missing-source
    severity: minor
    topic: retention
    missingEvidence: Publicly verifiable retention or expansion metrics after ATT, SKAN, and AI-product launches.
    whyItMatters: >-
      Market drivers are more investable if they translate into higher retention and module expansion rather than
      one-time implementation demand.
    diligencePath: >-
      Ask management for cohort NRR by privacy-change period and corroborate with reference customers and
      partner-channel telemetry.
    relatedQuestionRefs:
      - QM030
