  - id: adverse-events-legal-risk
    title: Adverse events, litigation, and security risk
    body: >-
      AppsFlyer conducted a workforce reduction in 2025, cutting approximately 100 jobs (about 7% of staff), a
      decision CEO Oren Kaniel attributed to organizational streamlining and increased AI investment even though the
      company said it had become profitable for the first time, had been cash-flow positive for more than two years,
      and was exceeding its revenue, ARR, and EBITDA goals. Times of Israel's coverage placed the cuts within a
      broader wave of Israeli tech restructuring and noted they followed a similarly sized layoff at rival Adjust
      (owned by AppLovin) at the end of the prior year; affected employees reportedly received a special pay package
      and other transition benefits.

      In a June 6, 2022 order, the U.S. District Court for the Northern District of California dismissed with leave
      to amend all claims against AppsFlyer, Inc. in In re Flo Health, Inc. Consumer Privacy Litigation (No.
      3:21-cv-00757-JD), where AppsFlyer had been named alongside Facebook, Google, and Flurry over alleged
      undisclosed sharing of Flo Health app user data collected via SDKs. The court distinguished AppsFlyer from the
      other defendants, finding the complaint did not allege AppsFlyer used the data for advertising or marketing —
      only for unspecified "AppsFlyer's own purposes" — which was insufficient to establish standing; the sources
      reviewed do not show a subsequent amended-complaint outcome or final disposition.

      Between approximately March 9-10, 2026, an attacker compromised AppsFlyer's domain registrar account through
      social engineering, disabled multi-factor authentication, and used the resulting access to redirect the
      websdk.appsflyer.com content-delivery domain to attacker infrastructure. For roughly 14 hours, the hijacked Web
      SDK served obfuscated malicious JavaScript that intercepted and silently replaced cryptocurrency wallet
      addresses (Bitcoin, Ethereum, Solana, Ripple, TRON) entered by end users, using network-request interception,
      DOM mutation observers, and clipboard monitoring while preserving legitimate analytics functionality to evade
      detection. AppsFlyer stated its internal infrastructure, application servers, and customer data environments
      were not directly compromised, and that its mobile SDKs (distinct from the Web SDK) were unaffected; security
      researchers estimated the Web SDK is loaded by more than 15,000 businesses and 100,000+ apps, though no
      specific victim was publicly confirmed with documented financial loss in the sources reviewed.
