callouts:
  - calloutType: strength
    title: Tri-party 2026 investment signals ecosystem-wide reliance on independent measurement
    body: >-
      Google, Meta, Unity, and Moloco each taking a minority, non-controlling stake at a $2.7 billion valuation is a
      strong signal that major advertising and platform players see continued value in a neutral, third-party
      measurement layer even as AI reshapes ad buying. The structure explicitly denies any investor preferential
      access to AppsFlyer's APIs, signals, or commercial terms, which if honored in practice preserves the
      independence claim that has been central to AppsFlyer's positioning since its earliest funding rounds.
    claimRefs:
      - CO022
      - CO023
      - CO029

  - calloutType: risk
    title: Revenue, headcount, and cap table remain undisclosed ahead of a possible IPO
    body: >-
      As a private company with no public filings, AppsFlyer does not disclose audited revenue, EBITDA, or exact
      ownership percentages, and press estimates of its ~$400 million revenue and ~1,500 headcount are not
      reconciled with earlier company-reported figures. Given reported IPO preparation involving Goldman Sachs,
      JPMorgan, and Bank of America, any diligence process should request a full financial data room, cap table, and
      board governance package directly from the company before drawing valuation conclusions.
    claimRefs:
      - CO013
      - CO027
      - CO030
      - CO031

  - calloutType: risk
    title: March 2026 domain-registrar attack shows security perimeter gaps outside the application layer
    body: >-
      The March 2026 incident did not stem from a breach of AppsFlyer's own application code or customer data
      environment, but from a compromised domain registrar account that let an attacker redirect the Web SDK's
      content-delivery domain for roughly 14 hours. Because the Web SDK is loaded by an estimated 15,000+ businesses
      and 100,000+ apps, the episode illustrates how a single third-party trust-boundary failure — outside the
      vendor's own infrastructure — can expose a very large downstream customer base to a crypto-theft payload.
    claimRefs:
      - CO037
      - CO038
      - CO041

  - calloutType: insight
    title: Fifteen-year founder-CEO continuity is a strength but concentrates key-person risk into an IPO window
    body: >-
      Oren Kaniel's uninterrupted tenure as CEO since 2011 has coincided with every major financing, acquisition, and
      crisis-response decision, including the 2025 restructuring and the March 2026 incident response, and Times of
      Israel's reporting places AppsFlyer in active IPO exploration with Goldman Sachs, JPMorgan, and Bank of
      America. That combination rewards continuity but leaves the company unusually exposed to single-executive
      risk at precisely the moment institutional and public-market scrutiny is set to increase.
    claimRefs:
      - CO009
      - CO015
      - CO028
