company:
  name: AppsFlyer
chapter:
  number: 1
  title: Company Overview
  summary: >-
    AppsFlyer is a San Francisco-headquartered, Herzliya-founded SaaS mobile and omnichannel marketing measurement
    and attribution company founded in 2011 by Oren Kaniel and Reshef Mann, which grew through five priced funding
    events to a $2.7 billion valuation following a June 2026 investment from Google, Meta, Unity, and Moloco. The
    company reports roughly 1,500 employees and 15,000+ brand customers, but as a private company with no audited
    filings its precise revenue, headcount, and cap table remain undisclosed, and 2025-2026 brought both a
    profitability-era layoff round and a March 2026 domain-registrar security incident that briefly weaponized its
    Web SDK.
sections:
  - id: identity-founding-model
    title: Identity, founding, and business model
    body: >-
      AppsFlyer is a software-as-a-service company providing marketing measurement, attribution, deep linking, data
      collaboration, and analytics tools, which it now markets as the "Modern Marketing Cloud." The company was
      founded in Israel in 2011 by CEO Oren Kaniel and CTO Reshef Mann, after participating in the Microsoft Ventures
      Accelerator program in its early stages. Its global headquarters is at 100 First Street in San Francisco's SoMa
      district, an 11,000-square-foot office the company opened in February 2018 after outgrowing earlier space
      following its 2017 Series C round; AppsFlyer retains major operations in Herzliya and Haifa, Israel, dating to
      its founding.

      The core business model is SaaS subscription and usage-based pricing: marketers, publishers, and platforms pay
      for measurement, attribution, deep-linking, fraud-protection, and AI-driven analytics products spanning mobile,
      web, CTV, and PC/console channels. In November 2025, the company announced its evolution from a mobile-
      attribution pioneer into the broader Modern Marketing Cloud, expanding its stated scope to unified omnichannel
      measurement, data collaboration, and AI-driven marketing. Its own materials describe the mission as delivering
      "AI-powered, privacy-first measurement technologies that turn data into growth opportunities," without
      disclosing specific revenue, profit, or independent financial metrics. AppsFlyer's partner marketing states
      that "1 in 3 Fortune 500 companies" use its platform and that it serves more than 80,000 companies in total,
      though this is a company claim not independently corroborated in the sources reviewed for this chapter.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO006
      - CO007
      - CO008
      - CO050
    figureRefs:
      - FO002

  - id: leadership-founders-governance
    title: Founders, leadership, and governance
    body: >-
      Oren Kaniel has served as CEO and co-founder of AppsFlyer continuously since the company's 2011 founding,
      through its 2020 Series D round, its 2025 workforce reduction, the March 2026 security incident, and the
      June 2026 investment round — a fifteen-year tenure with no succession plan or co-CEO arrangement disclosed in
      any public material reviewed. Co-founder Reshef Mann remains listed as CTO in current company leadership
      materials as of 2026. Other named 2026 executives include Gal Ekstein (Chief Business Officer), Nachum Falek
      (Chief Financial Officer), Oren Levy (Chief Strategy Officer), Barak Witkowski (Chief Product Officer), and Ziv
      Peled (Chief AI Officer); the creation of a dedicated Chief AI Officer role reflects the company's stated
      strategic pivot toward agentic AI and AI-powered measurement products.

      AppsFlyer's official and investor-facing materials reviewed for this chapter do not publish a full board of
      directors roster or governance charter beyond individual director appointments tied to specific financing
      events. In January 2020, Alex Crisses (Managing Director) and Anton Levy (Co-President and Global Head of
      Technology) of General Atlantic joined AppsFlyer's board in connection with the Series D round, and Calcalist's
      2026 reporting indicates General Atlantic continues to hold board representation. Key-person concentration is
      significant: Kaniel has been the sole CEO across every disclosed financing event, the 2025 restructuring, and
      the company's public response to the March 2026 security incident, which raises meaningful continuity risk for
      any prospective investor or acquirer evaluating the business ahead of a possible IPO.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
