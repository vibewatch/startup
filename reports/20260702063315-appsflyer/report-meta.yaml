companyProfile:
  summary: AppsFlyer Ltd. is a late-stage private marketing-technology company founded in Israel in 2011 that pioneered independent mobile attribution and has since expanded into a self-described "Modern Marketing Cloud" spanning measurement, deep linking, fraud protection (Protect360), data collaboration (Data Clean Room), audience segmentation, and agentic AI across mobile, web, CTV, and PC/console. It sells subscription and usage-based SaaS to marketers, publishers, and platforms, and its core differentiation is measurement neutrality anchored by 10,000+ partner integrations. In June 2026 it announced an investment of over $1 billion from Google, Meta, Unity, and Moloco at a $2.7 billion post-money valuation while exploring a U.S. IPO, months after a March 2026 Web SDK supply-chain compromise tested its security and trust posture.
  foundedDate: '2011-01-01'
  founders:
    - name: Oren Kaniel
      role: Co-Founder & CEO
      background: Sole CEO of AppsFlyer since its 2011 founding, through the 2020 Series D, the 2025 restructuring, and the 2026 investment.
      claimRefs: [CO002, CO009]
    - name: Reshef Mann
      role: Co-Founder & CTO
      background: Co-founder and Chief Technology Officer, still listed among current company leadership as of 2026.
      claimRefs: [CO002, CO010]
  foundingLocation: Israel
  headquarters: San Francisco, California, USA (global HQ) with major operations in Herzliya, Israel
  productSummary: A marketing measurement and attribution platform that determines which campaigns drive installs, purchases, and in-app events, plus deep linking (OneLink), fraud protection (Protect360), privacy-preserving data collaboration (Data Clean Room), audience segmentation, SKAdNetwork/AdAttributionKit and incrementality support, and an agentic AI suite, delivered via SDKs and dashboards with 10,000+ integrations.
  customerFocus: Enterprise and mid-market app publishers and brands across gaming, ecommerce/shopping, finance/fintech, entertainment, and agencies (named customers include eBay, Visa, Nike, Playtika, Macy's, and Albertsons).
  businessModel: Subscription and usage-based SaaS priced on measurement/attribution volume, seats, and add-on suites (Data Clean Room, Protect360, Audiences, agentic AI).
  stage: Late-stage private (pre-IPO); reportedly profitable
  fundingStatus: $7.1M Series A (2014), $20M Series B (2015), $56M Series C (2017), $210M Series D at a $1.6B valuation (2020, ~$294M cumulative priced equity), and a June 2026 investment of over $1B from Google, Meta, Unity, and Moloco at a $2.7B post-money valuation, with lifetime capital (including secondaries) framed at more than $1.3B.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO006, CO009, CO019, CO020, CO022, CO024, CO029, CO037]
summary:
  headline: AppsFlyer is a scaled, profitable, independent measurement leader whose June 2026 $2.7B strategic round validates the franchise, but a March 2026 SDK trust event, opaque financials, and platform dependency make it a disciplined track-to-conditional-buy rather than a clean entry.
  overallScore: 6.5
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: fair
  keyMetrics:
    valuationUsdM: 2700
    revenueRunRateUsdM: 400
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 1300
    customerCount: 15000
    headcount: 1500
  topStrengths:
    - Scaled, category-defining independent mobile measurement franchise with 10,000+ integrations and a neutrality moat that walled-garden self-attribution cannot easily replicate
    - Strong strategic validation and exit optionality — a June 2026 $2.7B round from Google, Meta, Unity, and Moloco, reported profitability, and an active Goldman/JPMorgan/BofA-advised IPO track
    - Product breadth beyond attribution into Data Clean Room, fraud protection (Protect360), audiences, and an agentic AI suite that can expand wallet share
  topRisks:
    - March 2026 Web SDK supply-chain compromise (registrar/DNS-level crypto-stealer reaching potentially 100,000+ sites) creates lasting trust, security, and potential legal exposure
    - Private and conflicting financials — no audited revenue, ARR, margin, NRR, burn, or customer-concentration disclosure — prevent confident underwriting of the $2.7B mark
    - Structural dependence on Apple (ATT/SKAN/AdAttributionKit) and Google signal policy, a maturing core MMP market, and channel-conflict perception with investor-competitors Google, Meta, and Unity
  unresolvedGaps:
    - Audited revenue, ARR bridge, gross margin, NRR/GRR, churn, burn, runway, and primary-vs-secondary split of the 2026 round are undisclosed
    - Post-incident customer retention, remediation completeness, forensic close-out, and any litigation or regulatory follow-through from the March 2026 SDK breach are unknown
    - Customer and revenue concentration by vertical and top accounts, plus preference/liquidation-stack terms behind the $2.7B post-money valuation, remain non-public
disclaimer: This analysis is based solely on publicly accessible materials retrieved as of 2026-07-02. AppsFlyer is a private company that files no audited financial statements; revenue, ARR, margins, retention, and capital-structure figures are company statements, press estimates, or analyst inferences rather than verified filings, and several conflict. Nothing here is investment advice.
