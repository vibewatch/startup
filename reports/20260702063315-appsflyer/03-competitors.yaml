schemaVersion: "report-v2"
artifact: competitors
slug: appsflyer
runDate: '2026-07-02'
company:
  name: AppsFlyer
chapter:
  number: 3
  title: Competitors
  summary: >-
    AppsFlyer competes in a maturing MMP category where Adjust, Branch, Kochava, and Singular each own defensible
    slices of the attribution, linking, analytics, fraud, and cost-data workflow, while walled gardens and internal
    stacks remain the buyer's most credible substitutes. Its main edge is not a single feature but the combination of
    neutral positioning, 10,000+ partner connectivity, enterprise brand scale, and a widening product suite; the main
    risk is that platform privacy rules, AppLovin/Adjust vertical integration, price pressure, and the 2026 Web SDK
    incident weaken trust faster than new AI and clean-room products can deepen lock-in.
sections:
  - id: competitive-landscape
    title: Competitive landscape
    body: >-
      The relevant competitive set is broader than mobile attribution logos. Direct MMP peers include Adjust, Branch,
      Kochava, Singular, and smaller alternatives such as Tenjin, Airbridge, ByteBrew, Firebase, Trackier, RevenueCat,
      and Affise in the source market list. Incumbent pressure comes from AppLovin through its ownership of Adjust and
      from platform owners such as Apple, Google, Meta, TikTok, and Unity whose privacy rules or self-attribution data
      determine how much signal any independent MMP can see. Adjacent substitutes include MMM, clean-room, cost
      aggregation, ASO/search-automation, and in-house data-engineering stacks. AppsFlyer's differentiation is strongest
      when buyers want a neutral third-party layer across many partners rather than relying on one media seller's own
      reporting. The landscape map therefore treats neutrality and omnichannel breadth as separate axes, because a
      scaled ad platform can be powerful distribution without being a trusted referee. FP001 positions that tension and
      shows why the default status quo is still multi-homing across platform dashboards plus spreadsheets.
    claimRefs: [CP001, CP002, CP015, CP016, CP032, CP035, CP036, CP038, CP039, CP043, CP044, CP045]
    figureRefs: [FP001]
  - id: competitor-profiles
    title: Competitor profiles
    body: >-
      The profiles show a fragmented but not weak field. Adjust is a scaled MMP whose AppLovin ownership gives it an
      ad-network parent and gaming/performance-adjacent distribution, but that same structure creates neutrality
      questions for customers buying AppLovin media. Branch is the clearest specialist: its own site emphasizes mobile
      measurement and attribution for 3.5 billion users and 100,000 brands, while independent comparisons call out
      deep linking and web-to-app journeys as its reference use case. Kochava appears more independent and
      omnichannel, with official claims around measurement across all channels, devices, and platforms plus 5,000+
      integrated media partners. Singular is not merely an attribution vendor; it positions around cost aggregation,
      ROI analytics, data movement, and AI-assisted marketing decisions. AppsFlyer sits as the broad enterprise
      default, backed by public evidence of 15,000+ brands, strategic minority investors, and an expanded Modern
      Marketing Cloud. TP001 is intentionally partial because private scale, realized pricing, renewal terms, and churn
      are not public for most peers.
    claimRefs: [CP003, CP004, CP005, CP006, CP007, CP014, CP017, CP018, CP019, CP020, CP021, CP022, CP023, CP024, CP025]
    tableRefs: [TP001]
  - id: capability-and-pricing-comparison
    title: Capability and pricing comparison
    body: >-
      Capability differences are visible, but the cleanest lesson is that no vendor is categorically complete. AppsFlyer
      has the most explicit breadth in the reviewed evidence: measurement, deep linking, data collaboration, agentic AI,
      incrementality, fraud protection, and integrations. Adjust is repeatedly framed as strong in fraud prevention,
      real-time protection, and analytics, with AppLovin ownership as a strategic differentiator and possible conflict.
      Branch is strongest where linking itself is the growth engine, particularly referrals, QR campaigns, re-engagement,
      and web-to-app journeys. Kochava has a credible omnichannel and offline/advanced-TV story, plus MMM and ASO
      adjacency. Singular is strongest in cost aggregation, ROI analytics, data movement, and self-claimed G2 category
      leadership. Pricing is materially less transparent: independent comparisons describe MAU, event, or custom
      enterprise models, while SourceForge reports no detailed pricing information. TP002 marks unsupported capability
      cells plainly instead of guessing, FP002 visualizes relative breadth rather than market share, and TP003 keeps
      unknown prices as null with diligence paths.
    claimRefs: [CP012, CP013, CP019, CP020, CP021, CP022, CP023, CP024, CP025, CP026, CP027, CP028, CP031, CP033]
    tableRefs: [TP002]
    figureRefs: [FP002]
  - id: switching-cost-and-distribution
    title: Switching cost and distribution power
    body: >-
      Switching cost in this category is practical rather than purely contractual. The buyer embeds SDKs, event schemas,
      attribution windows, partner postbacks, fraud rules, dashboards, data exports, and budget processes around the
      measurement vendor, so changing providers risks reporting discontinuity even when the customer can technically
      multi-home. Multi-homing is common because advertisers still compare MMP output with Google, Meta, Apple,
      TikTok, DSP, BI, and finance data, but that does not eliminate vendor stickiness; it often increases the need for
      a trusted normalization layer. AppsFlyer's 10,000+ partner footprint and enterprise customer base create a real
      distribution advantage, yet partner access is not exclusive, and Kochava's 5,000+ integrations demonstrate that
      serious peers can maintain substantial supply. Distribution power is shifting toward platforms and AI-optimized
      ad buying systems whose signals feed campaign automation. TP003 therefore matters beyond budget: unknown
      realized pricing, volume discounts, and data-export rights could determine whether customers consolidate on one
      MMP or continue to run multiple measurement sources.
    claimRefs: [CP006, CP007, CP021, CP027, CP028, CP029, CP030, CP032, CP033, CP040, CP041]
    tableRefs: [TP003]
  - id: moat-durability-and-adverse
    title: Moat durability and adverse evidence
    body: >-
      AppsFlyer's moat is durable only if neutrality remains scarce, partner integrations stay costly to replicate, and
      the company converts attribution data into broader clean-room, AI, and decisioning workflows. The adverse record
      is meaningful. The MMP market is growing, but it is small relative to overall mobile ad spend and increasingly
      shaped by privacy restrictions, platform data silos, and walled-garden reporting. Intel Market Research describes
      IDFA opt-in around 30%, large untrackable journey segments, and platform restrictions that reduce deterministic
      accuracy. AppLovin's Adjust ownership adds vertical integration pressure from a public ad ecosystem. Singular's
      public G2 claims create evidence that competitors can win on support, ROI speed, AI categories, and product
      direction, not just price. The March 2026 AppsFlyer Web SDK compromise is the sharpest trust issue because
      third-party script trust is part of the product's implicit promise. TP004 converts these threats into diligence asks,
      and FP003 summarizes the readiness KPIs that should govern follow-up.
    claimRefs: [CP005, CP006, CP024, CP025, CP034, CP035, CP036, CP037, CP042, CP046]
    tableRefs: [TP004]
    figureRefs: [FP003]
