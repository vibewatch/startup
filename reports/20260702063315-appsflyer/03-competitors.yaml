      - ["Broad partner/integration graph", "Kochava claims 5,000+ integrations and platforms may restrict data sharing", Medium, "Test top-100 spend partner coverage, postback reliability, and time-to-add-new-partner SLA"]
      - ["Enterprise suite breadth", "Branch, Singular, and Kochava each specialize in high-value wedges", Medium, "Run win/loss by use case: deep links, cost aggregation, CTV/offline, fraud-heavy gaming"]
