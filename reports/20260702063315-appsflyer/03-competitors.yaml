figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    layout: wide
    summary: "AppsFlyer's strategic position is broad and neutral, while peers cluster around specialist depth, platform power, or buyer-owned status quo workflows."
    data:
      points:
        - {label: AppsFlyer, x: 8, y: 9, detail: "Broad product suite with high neutrality claim and strategic minority investor covenant"}
        - {label: Adjust, x: 7, y: 5, detail: "Strong MMP depth, but AppLovin ownership lowers perceived neutrality"}
        - {label: Branch, x: 5, y: 8, detail: "Independent specialist with strongest evidence around linking and journeys"}
        - {label: Kochava, x: 7, y: 8, detail: "Independent omnichannel MMP with advanced-channel and MMM adjacency"}
        - {label: Singular, x: 7, y: 8, detail: "Independent analytics and cost-data specialist with AI/LLM positioning"}
        - {label: "Walled gardens", x: 8, y: 2, detail: "Powerful distribution and native data but self-attributing platform incentives"}
        - {label: "Internal build", x: 4, y: 7, detail: "High buyer control but low external partner network leverage"}
    approximationNotes: "Ordinal map based on source-backed product scope and ownership, not a numeric market-share chart."
    claimRefs: [CP002, CP006, CP014, CP015, CP016, CP017, CP019, CP020, CP023, CP039]
  - id: FP002
    title: Feature breadth / capability map
    type: matrix
    layout: wide
    summary: "Relative breadth favors AppsFlyer, but each peer has a credible wedge that can win focused buying criteria."
    data:
      columns: [AppsFlyer, Adjust, Branch, Kochava, Singular]
      rows:
        - label: "Attribution breadth"
          values: ["Strong", "Strong", "Medium", "Strong", "Strong"]
        - label: "Deep linking"
          values: ["Strong", "Supported", "Strongest", "Supported", "Supported"]
        - label: "Fraud protection"
          values: ["Strong", "Strongest", "Supported", "Supported", "Supported"]
        - label: "Cost / ROI analytics"
          values: ["Strong", "Supported", "Medium", "Strong", "Strongest"]
        - label: "AI / data workflow"
          values: ["Strong", "Unknown", "Unknown", "Partial", "Strong"]
    approximationNotes: "Labels are ordinal summaries of allocated public evidence; unknown means not evidenced in the source block."
    claimRefs: [CP003, CP013, CP018, CP019, CP020, CP022, CP023, CP025, CP031, CP042]
  - id: FP003
    title: Moat / readiness KPIs
    type: kpi
    layout: standard
    summary: "AppsFlyer has strong competitive readiness on breadth and neutrality but needs diligence on trust recovery and realized pricing power."
    data:
      items:
        - {label: "Neutrality covenant", value: "Minority / no preferential terms", note: "Investors publicly lack preferential API, signal, attribution, or commercial rights", score: 8}
        - {label: "Partner graph", value: "10,000+ partners cited", note: "Large footprint, though Kochava also claims 5,000+ integrations", score: 8}
        - {label: "Trust overhang", value: "Mar-2026 SDK compromise", note: "Security incident requires customer-renewal and control remediation review", score: 4}
        - {label: "Pricing transparency", value: null, note: "Public sources do not disclose realized enterprise pricing or discounting", score: 3}
        - {label: "Market maturity", value: "12.5% CAGR / >60% top-three share", note: "Growth remains but category is concentrated and privacy-constrained", score: 6}
    approximationNotes: "Scores are 1-10 diligence readiness scores derived from evidence strength, not company KPIs."
    claimRefs: [CP006, CP007, CP021, CP026, CP027, CP034, CP035, CP036]
callouts:
  - calloutType: strength
    title: "Neutrality is the core competitive story"
    body: "The 2026 strategic-investor round is defensible only if AppsFlyer can prove the no-preferential-treatment covenant operationally, because neutrality is the buyer problem it is selling."
    claimRefs: [CP005, CP006]
  - calloutType: risk
    title: "Walled gardens can weaken every MMP"
    body: "Apple privacy rules and platform data-sharing limits reduce deterministic attribution and can force customers to reconcile MMP output with self-attributing networks and internal models."
    claimRefs: [CP032, CP033, CP036]
  - calloutType: insight
    title: "Specialist peers are not feature-poor"
    body: "Branch, Kochava, and Singular each own credible wedges, so AppsFlyer should be underwritten as a broad enterprise suite rather than as an unbeatable product in every buying criterion."
    claimRefs: [CP019, CP020, CP021, CP023, CP024]
  - calloutType: recommendation
    title: "Make pricing and security diligence gating"
    body: "Before crediting moat durability, request realized renewal cohorts, discounting, data-export rights, SDK incident remediation, and win/loss data against Adjust, Branch, Kochava, and Singular."
    claimRefs: [CP029, CP034, CP041, CP042]
