schemaVersion: "report-v2"
artifact: financials
slug: appsflyer
runDate: '2026-07-02'
company:
  name: AppsFlyer
chapter:
  number: 4
  title: Financials
  summary: >-
    AppsFlyer's public financial profile looks like a scaled, profitable private SaaS/adtech infrastructure company, but the underwriting surface is uneven: official and independent sources support 15,000+ brands, a June 2026 strategic financing above $1 billion at a $2.7 billion post-money valuation, 2019 ARR above $150 million, and 2025-2026 revenue or ARR estimates ranging from roughly $400 million to about $500 million. Cash, burn, runway, gross margin, NRR, CAC/payback, customer concentration, debt, and precise primary-versus-secondary proceeds are not disclosed, so the chapter treats those as diligence gates rather than model inputs.
sections:
  - id: revenue-model-and-mix
    title: Revenue model and mix
    body: >-
      AppsFlyer's revenue model is best read as enterprise SaaS plus usage-sensitive marketing-measurement economics, not as a pure ad network or media reseller. The official description frames AppsFlyer as a Modern Marketing Cloud spanning omnichannel measurement, deep linking, data collaboration, and autonomous AI workflows, while independent reporting describes annual revenue as coming from the sale of software as a service for advertising management. Public evidence supports the existence of multiple monetizable product surfaces: core attribution and measurement, OneLink/deep linking, fraud protection, privacy/data-collaboration products, and AI-powered measurement workflows. What is not public is the mix across those streams, the realized price per customer, and the revenue-recognition policy for usage spikes or multi-year enterprise contracts. The Revenue streams table and Revenue model bridge therefore distinguish sourced revenue mechanisms from unsupported mix estimates, preserving the conflict between roughly $400 million reported revenue and about $500 million ARR-style estimates rather than forcing a single point value.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: gtm-and-sales-efficiency
    title: GTM motion and sales efficiency proxies
    body: >-
      The available evidence points to a global enterprise and mid-market sales motion sold into app owners, brands, gaming, ecommerce, finance, and media teams that need independent measurement across major advertising platforms. AppsFlyer reported more than 12,000 customers in 2020 and more than 15,000 brands in 2026, while customer-review evidence shows a three-month implementation median, a 12-month ROI proxy, and repeated comments that pricing can become expensive as event volume scales. These are useful sales-efficiency proxies but not substitutes for private CAC, payback, sales-cycle, win-rate, NRR, or channel-margin data. Customer case studies showing fraud savings and acquisition improvements indicate value-based selling, yet the buyer still needs contract cohorts and expansion data to know whether the company is adding efficient net new ARR or merely harvesting a mature installed base. The Unit economics bridge uses these public proxies while marking the missing CAC/payback and retention inputs explicitly.
    claimRefs: [CI008, CI009, CI035, CI036, CI037, CI038, CI039, CI044]
    tableRefs: [TI003]
    figureRefs: [FI002]
  - id: cost-structure-and-margins
    title: Cost structure and margin path
    body: >-
      AppsFlyer's cost structure should be underwritten as a data-infrastructure SaaS model with meaningful product, cloud, privacy, security, partner-integration, and customer-success obligations. Public sources do not disclose gross margin, cloud cost, support cost, R&D capitalization, or sales-and-marketing efficiency, but the company has acknowledged past investments in privacy-enhancing technologies and ecosystem support that created tighter margins and operational inefficiencies. The 2025 workforce reduction was framed as an efficiency and AI-investment move rather than a liquidity crisis, and independent coverage reported positive cash flow and profitability. That combination supports a plausible path to healthy SaaS margins, but it does not prove a 70-85% gross margin band for AppsFlyer specifically. Investors should treat the SaaS benchmark as a scenario assumption only, then diligence infrastructure COGS, support burden for enterprise integrations, incident-response costs after the 2026 Web SDK compromise, and the margin contribution of newer AI products.
    claimRefs: [CI017, CI018, CI019, CI020, CI040, CI041, CI042, CI043]
    figureRefs: [FI003]
  - id: traction-vs-private-gaps
    title: Public traction versus private-metric gaps
    body: >-
      Public traction is substantial but not clean enough for a full financial model. AppsFlyer disclosed ARR above $150 million in 2019 after growing from $1 million to $100 million over five years, and 2025-2026 reporting places annual revenue around $400 million while other sources and analyst-style summaries cite about $500 million ARR. Those metrics can all be directionally true if they reflect different vintages, revenue-recognition conventions, or ARR versus GAAP-like revenue, but they cannot be reconciled from public evidence. The 15,000+ brand figure supports broad penetration, while the customer-count history and review data show a product with durable utility. Still, the most important underwriting metrics remain private: ARR bridge, NRR, logo retention, gross retention, customer concentration, gross margin by module, sales efficiency, cohort expansion, realized pricing, and security-incident churn. The Public financial gaps table is intentionally partial and carries the diligence path for each missing private metric.
    claimRefs: [CI008, CI010, CI011, CI012, CI013, CI014, CI016, CI029, CI030, CI031, CI032, CI048, CI049]
    tableRefs: [TI005]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      The Company Overview chapter owns the full round-by-round history; Financials uses only the financing facts needed to assess forward capital adequacy. The June 2026 transaction brings strategic investors into the cap table at a $2.7 billion post-money valuation and is reported above $1 billion, but official language says it combines shareholder liquidity with new long-term strategic equity participation, and independent coverage says much of it was secondary. That means headline funding is not the same as incremental cash on the balance sheet. Positive-cash-flow reporting reduces apparent financing dependency, yet cash on hand, burn, runway, debt, and the primary proceeds amount are undisclosed. The most likely next liquidity trigger is IPO readiness rather than survival capital, given public-market preparation and the CEO's framing of the round as a step toward being public. The Capital adequacy table and cash-flow map therefore rate capital intensity as moderate for SaaS operations but diligence risk as high until the balance sheet, proceeds allocation, and post-incident cost envelope are reviewed.
    claimRefs: [CI021, CI022, CI023, CI024, CI025, CI026, CI027, CI028, CI033, CI034, CI045, CI046, CI047, CI050]
    tableRefs: [TI004]
    figureRefs: [FI004]
tables:
  - id: TI001
    title: Revenue streams table
    columns: [stream, mechanism, unit, current value/status, quality, diligence ask]
    rows:
      - [Core attribution and measurement, SaaS platform sold to marketers and app owners, Contract plus measured activity, Publicly supported as core business but mix undisclosed, High-quality recurring software if retention is proven, Obtain ARR by cohort and module]
      - [Deep linking and OneLink, Product suite that guides users from web/offline to app experiences, Contracted module or bundled SKU, Public product surface; revenue contribution unknown, Expansion lever tied to cross-platform journeys, Request SKU-level attach and renewal data]
      - [Fraud protection and Protect360, Fraud-free attribution and invalid-traffic prevention, Add-on module and measured events, Customer cases show savings but product revenue not disclosed, Value-based add-on with ROI proof, Obtain attach rate and gross margin by module]
      - [Data collaboration and privacy products, Data clean room and privacy-preserving measurement, Enterprise contract or add-on suite, Publicly positioned as growth area; mix unknown, Strategic for post-ATT measurement, Review customer adoption and infrastructure cost]
      - [Agentic AI and autonomous workflows, AI-powered measurement and workflow layer, New suite or upsell motion, 2026 financing use-of-funds emphasizes AI, Early expansion option; pricing and adoption not public, Diligence AI SKU pipeline and paid conversion]
    notes: Public evidence supports product surfaces and broad SaaS revenue, but revenue mix, recognition, and realized pricing are not disclosed; rows are underwriting categories rather than audited segments.
    claimRefs: [CI001, CI002, CI003, CI021, CI038, CI044]
  - id: TI002
    title: Pricing / monetization table
    columns: [price/unit/contract, list vs realized pricing, discounts/unknowns, source]
    rows:
      - ["Annual enterprise software contract", "List pricing not publicly posted", "Realized ACV and discounting unknown", "G2 and news describe SaaS sale"]
      - ["Usage/event-volume scaling", "Public reviews say costs can scale quickly with event volume", "Volume tiers and overage mechanics unknown", "Customer reviews"]
      - ["MMP market benchmark", "Mid-tier commitments reported at $15k-$50k annually", "AppsFlyer-specific realized pricing unknown", "Independent market report"]
      - ["Add-on suites and premium modules", "Likely module packaging for fraud, deep linking, data collaboration, and AI", "Attachment and bundling unknown", "Official product positioning"]
    notes: No official AppsFlyer rate card was found in the allocated sources; pricing entries combine customer-review proxies, market benchmarks, and public product packaging signals.
    claimRefs: [CI003, CI004, CI005, CI006, CI007]
  - id: TI003
    title: Unit economics table
    columns: [metric, value/null, confidence, why it matters, diligence ask]
    rows:
      - ["CAC payback", null, "low", "Determines whether enterprise growth is efficient", "Request cohort CAC payback by segment and geography"]
      - ["G2 ROI proxy", "12 months", "medium", "User-reported buying-value proxy but not company CAC", "Validate against sales cycle and implementation costs"]
      - ["Implementation time", "3 months", "medium", "Proxy for onboarding cost and sales-to-value cycle", "Request implementation hours and time-to-live distribution"]
      - ["Gross margin", "null; scenario benchmark only 70-85%", "low", "Core driver of SaaS valuation and cash generation", "Obtain audited gross margin and COGS breakdown"]
      - ["NRR / gross retention", null, "low", "Tests pricing power and durable expansion", "Request NRR, GRR, churn, and expansion by customer cohort"]
    notes: Unit economics are mostly private; public proxies are customer-review or market-benchmark indicators and should not be inserted into a model without company data.
    claimRefs: [CI036, CI037, CI038, CI041, CI048]
  - id: TI004
    title: Capital adequacy table
    columns: [cash on hand, monthly burn, runway months, planned use of funds, next-round trigger, debt/project-finance obligations]
    rows:
      - [null, null, null, AI-powered ad measurement and cross-platform attribution, IPO readiness or delayed liquidity event, null]
      - [Primary proceeds not disclosed, Positive cash flow reported but burn not quantified, null, Autonomous marketing and agentic workflows, Regulatory close and public-market timing, Not disclosed]
      - [Secondary-heavy round limits inference, Not disclosed, null, Shareholder liquidity plus strategic equity participation, Need S-1 or company balance sheet, No debt or project-finance disclosure found]
    notes: The June 2026 financing headline is not equivalent to cash added to the balance sheet because official and independent reports describe shareholder liquidity and secondary components.
    claimRefs: [CI021, CI022, CI023, CI024, CI029, CI030, CI031, CI032, CI033, CI034]
  - id: TI005
    title: Public financial gaps table
    columns: [missing private metric, impact, exact diligence path]
    rows:
      - ["ARR bridge and revenue recognition", "Cannot reconcile $300-350M brief range with $400M revenue and ~$500M ARR sources", "Request audited 2024-2026 revenue, ARR, deferred revenue, and recognition policy"]
      - ["Gross margin and cloud COGS", "Determines whether AI and privacy workloads expand or compress margin", "Request audited gross margin, hosting cost, support cost, and R&D capitalization"]
      - ["CAC/payback and sales cycle", "Determines whether growth is efficient enough for IPO investors", "Request cohort-level CAC, payback, pipeline conversion, and quota productivity"]
      - ["NRR, GRR, churn, and concentration", "Determines quality of recurring revenue and platform dependency risk", "Request NRR/GRR by vertical and top-10 customer revenue share"]
      - ["Cash, burn, runway, and primary proceeds", "Determines financing dependency after secondary-heavy round", "Request board package showing cash, burn, debt, proceeds allocation, and runway"]
      - ["Security incident financial impact", "Determines churn, credits, insurance, and remediation costs after Web SDK compromise", "Request incident cost ledger, churn analysis, and cyber-insurance recoveries"]
    notes: Enumeration is partial because only public and allocated sources were reviewed; each row is a missing metric that should be closed in management diligence or an S-1.
    enumerationScope:
      coverage: partial
      basis: Publicly observable financial metrics and diligence blockers in allocated AppsFlyer chapter sources
    claimRefs: [CI015, CI016, CI029, CI030, CI031, CI032, CI041, CI042, CI048]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: Customer activity flows from measured marketing events into recurring SaaS contracts and premium add-on modules, but public sources do not disclose mix or recognition.
    data:
      nodes:
        - {id: brand_activity, label: Brand/app marketing activity, detail: Installs, purchases, web-to-app journeys, CTV, and campaign events require measurement.}
        - {id: platform_measurement, label: Attribution and measurement platform, detail: AppsFlyer tracks and analyzes which channels drive profitable users.}
        - {id: recurring_contract, label: Recurring SaaS contract, detail: Public reporting describes annual revenue from software-as-a-service sales.}
        - {id: add_on_suites, label: Add-on suites, detail: Fraud, deep linking, data collaboration, and AI workflows may expand contract value.}
        - {id: gross_profit_pool, label: Gross profit pool, detail: Margin is undisclosed and depends on infrastructure, support, and privacy/security costs.}
      edges:
        - {from: brand_activity, to: platform_measurement, label: generates events and attribution jobs}
        - {from: platform_measurement, to: recurring_contract, label: converts to platform subscription or contract}
        - {from: recurring_contract, to: add_on_suites, label: expands through modules and usage}
        - {from: add_on_suites, to: gross_profit_pool, label: contributes after service-delivery costs}
    approximationNotes: Flow is qualitative because pricing, mix, deferred revenue, and gross margin are not public.
    claimRefs: [CI001, CI002, CI003, CI005, CI040]
  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: standard
    summary: Public proxies indicate customer value and implementation friction, but CAC, payback, retention, and expansion remain private.
    data:
      nodes:
        - {id: enterprise_sale, label: Enterprise sale, detail: Global brands and app owners buy independent measurement and privacy-safe analytics.}
        - {id: implementation, label: Implementation, detail: G2 reports a three-month time-to-implement average.}
        - {id: roi_proxy, label: ROI proxy, detail: G2 pricing insights show 12-month ROI based on purchase data.}
        - {id: expansion, label: Expansion and retention, detail: Add-ons and event volume can raise spend, but NRR is not disclosed.}
      edges:
        - {from: enterprise_sale, to: implementation, label: onboarding and integrations}
        - {from: implementation, to: roi_proxy, label: time-to-value proxy}
        - {from: roi_proxy, to: expansion, label: renewal and upsell potential}
    approximationNotes: CAC, sales cycle, logo retention, and NRR are unavailable; this bridge should be replaced with cohort data in diligence.
    claimRefs: [CI035, CI036, CI037, CI038]
  - id: FI003
    title: Financial estimate range
    type: range
    layout: wide
    summary: Public financial estimates span a wide band because sources mix revenue, ARR, funding, and valuation conventions.
    data:
      items:
        - {label: 2024 revenue brief conflict, low: 300, mid: 325, high: 350, note: USD millions; provided brief cites company-stated range but local allocation lacks a direct corroborating source.}
        - {label: 2025 annual revenue reports, low: 400, mid: 400, high: 400, note: USD millions reported by Times of Israel and Calcalist-style sources.}
        - {label: 2026 ARR estimates, low: 400, mid: 450, high: 500, note: USD millions; guide and several sources cite roughly $500M ARR.}
        - {label: Total known funding, low: 294, mid: 300, high: 1300, note: USD millions; 2020/2025 totals conflict with 2026 Crunchbase known-funding figure.}
        - {label: Latest valuation, low: 2700, mid: 2700, high: 2700, note: USD millions post-money in June 2026 strategic round.}
    approximationNotes: Values combine revenue, ARR, and funding conventions; do not add or average them without company reconciliation.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015, CI016, CI025, CI026, CI027, CI028, CI049]
  - id: FI004
    title: Capital intensity / cash-flow map
    type: flow
    layout: standard
    summary: AppsFlyer appears less capital intensive than hardware or marketplace models, but primary proceeds and cash runway are undisclosed.
    data:
      nodes:
        - {id: recurring_revenue, label: Recurring SaaS revenue, detail: Reported revenue/ARR scale and positive cash flow reduce survival-financing pressure.}
        - {id: operating_costs, label: Operating costs, detail: R&D, cloud, privacy, security, integrations, support, and GTM remain key cash uses.}
        - {id: strategic_round, label: 2026 strategic round, detail: More than $1B headline at $2.7B valuation includes shareholder liquidity and new equity.}
        - {id: ipo_path, label: IPO path, detail: Public-market readiness is the likely liquidity trigger if growth and market conditions support it.}
      edges:
        - {from: recurring_revenue, to: operating_costs, label: funds software operations and innovation}
        - {from: strategic_round, to: operating_costs, label: new equity portion supports AI and attribution roadmap}
        - {from: strategic_round, to: ipo_path, label: secondary liquidity reduces pressure while preserving public option}
    approximationNotes: Cash on hand, burn, debt, and primary proceeds are not disclosed; this map shows capital logic, not a cash model.
    claimRefs: [CI017, CI021, CI022, CI023, CI033, CI034, CI047, CI050]
callouts:
  - calloutType: strength
    title: Scaled recurring platform with public profitability signals
    body: >-
      AppsFlyer has credible scale signals: 15,000+ brands, reported $400M revenue or ~$500M ARR ranges, positive cash flow, and public profitability statements.
    claimRefs: [CI008, CI012, CI014, CI017]
  - calloutType: risk
    title: Secondary-heavy headline funding can overstate balance-sheet strength
    body: The June 2026 round was above $1B, but reports describe substantial shareholder liquidity, so primary cash proceeds and runway still require diligence.
    claimRefs: [CI022, CI023, CI029, CI031]
  - calloutType: insight
    title: Pricing power appears real but unquantified
    body: Customer reviews describe high and event-volume-sensitive pricing, while market reports show meaningful annual MMP commitments; realized AppsFlyer ACV and discounts remain private.
    claimRefs: [CI004, CI005, CI006]
  - calloutType: recommendation
    title: Underwrite with a gap-first financial model
    body: Build scenarios around disclosed scale and profitability, but block investment committee approval until ARR bridge, gross margin, NRR, CAC/payback, and cash runway are provided.
    claimRefs: [CI015, CI016, CI041, CI048]
