    - type: conflicting-data
      severity: material
      topic: revenue-conflict
      missingEvidence: Audited 2024-2026 revenue, ARR, deferred revenue, and revenue-recognition policy that reconciles the supplied $300-350M brief range with public $400M and ~$500M reports.
      whyItMatters: Revenue quality and valuation multiples cannot be underwritten if ARR, GAAP-like revenue, and historical company statements are mixed.
      diligencePath: Request management's audited revenue bridge, ARR waterfall, deferred revenue schedule, and recognition memo by product line.
      relatedQuestionRefs: [QI004, QI024]
      relatedTableRefs: [TI005]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: CAC, sales cycle, CAC payback, NRR, GRR, logo churn, expansion ARR, and customer concentration by cohort.
      whyItMatters: Public scale does not prove that new ARR is efficient or that the installed base expands without pricing pressure.
      diligencePath: Obtain board KPI packs and cohort exports by acquisition year, vertical, region, and contract size.
      relatedQuestionRefs: [QI025]
      relatedTableRefs: [TI003, TI005]
    - type: private-evidence-only
      severity: material
      topic: margin
      missingEvidence: Gross margin, hosting cost, support cost, incident-response costs, and R&D capitalization by product suite.
      whyItMatters: The financial verdict depends on whether AI, privacy, and SDK security investments improve or compress margin.
      diligencePath: Request audited income statements, COGS allocation, cloud invoices, support staffing, and security-remediation cost ledger.
      relatedQuestionRefs: [QI009, QI027]
      relatedTableRefs: [TI003, TI005]
    - type: private-evidence-only
      severity: blocking
      topic: capital-gap
      missingEvidence: Cash on hand, monthly burn, runway months, debt, credit facilities, primary proceeds, and use-of-proceeds allocation from the 2026 round.
      whyItMatters: A secondary-heavy financing headline cannot determine balance-sheet strength or financing dependency.
      diligencePath: Review treasury schedules, debt agreements, closing funds flow, board-approved budget, and 24-month cash forecast.
      relatedQuestionRefs: [QI018, QI026]
      relatedTableRefs: [TI004, TI005]
