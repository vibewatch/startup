    claimRefs: [CV010, CV011, CV012, CV014, CV015, CV018, CV020, CV021, CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV032, CV034, CV035, CV036, CV037]
  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: sample
