      Partial/sample enumeration: public company market values, private peer ARR, transaction terms, and sponsor bid details require market-data and banker diligence before being used as hard valuation multiples.
    claimRefs: [CV015, CV019, CV020, CV021, CV022, CV023, CV025, CV035, CV043, CV044, CV045]
  - id: TV005
    title: Thesis-break and kill triggers table
    columns: [trigger, threshold, transmission to thesis, action implication]
    rows:
