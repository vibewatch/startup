  - id: TV003
    title: Bull / base / bear scenario table
    columns: [case, assumptions, valuation/return logic, key risks, probability signal]
    rows:
      - [Bear, "SDK trust erosion, weak disclosure, slower AI monetization, IPO window shuts", "$1.5B-$2.0B; implies below-entry outcome and potential down-round/M&A reset", "Churn, legal exposure, multiple compression, platform signal loss", "Incident claims, weak NRR, or sponsor bid below $2.7B"]
      - [Base, "Reported profitability and $400M-$500M scale hold; remediation proves adequate; neutral moat persists", "$2.7B-$3.5B; entry is protected but not obviously cheap", "Private financial surprises, secondary/preference overhang, modest growth", "Audited ARR bridge, clean churn data, no adverse legal reserve"]
      - [Bull, "AI/data collaboration attach, public-market readiness, and sponsor/IPO demand expand multiple", "$4.5B-$6.0B; upside from PE interest high end plus IPO premium", "Execution, market timing, competition from Adjust/Branch/Kochava/Singular", "S-1-quality metrics, accelerating NRR, verified new-product ARR"]
    notes: >-
