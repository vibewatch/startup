      missingEvidence: "Audited 2024-2026 revenue, ARR bridge, deferred revenue, gross margin, EBITDA, FCF, NRR, GRR, churn, and concentration data."
      whyItMatters: "These metrics determine whether $2.7B is fair or stretched and whether public revenue and ARR reports are comparable."
      diligencePath: "Request CFO data room, audit workpapers, cohort schedules, customer concentration analysis, and board-approved forecast."
