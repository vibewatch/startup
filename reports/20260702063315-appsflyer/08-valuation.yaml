          value: "Medium"
          note: "Reported profitable $400M-$500M scale, but unaudited and partly conflicting."
          score: 6
        - label: "Risk posture"
          value: "Medium-low"
          note: "SDK incident, platform dependency, and private gaps remain material."
          score: 4
        - label: "Valuation attractiveness"
          value: "Medium"
          note: "$2.7B is defensible but not cheap without disclosure and remediation proof."
          score: 6
    approximationNotes: >-
      Scores are 1-10 diligence judgments from public evidence and should be recalibrated after management data-room review.
    claimRefs: [CV001, CV013, CV014, CV015, CV016, CV017, CV018, CV024, CV026, CV027, CV028, CV032]
callouts:
  - calloutType: recommendation
    title: Conditional recommendation at the $2.7B entry mark
    body: >-
      AppsFlyer is investable only as a price- and evidence-conditional opportunity. The $2.7B round is defensible given scale and strategic validation, but it is not cheap enough to ignore private financial gaps or the 2026 SDK trust event.
    claimRefs: [CV002, CV003, CV010, CV011, CV026, CV040]
  - calloutType: strength
    title: Strategic investors validate neutrality if ring-fencing holds
    body: >-
      Moloco, Google, Meta, and Unity taking minority, non-controlling stakes while accepting no preferential API, signal, or commercial access strengthens the independent-measurement thesis, provided diligence confirms side letters do not dilute the covenant.
    claimRefs: [CV002, CV003, CV004, CV033]
  - calloutType: risk
    title: SDK trust is the primary valuation discount
    body: >-
      The March 2026 Web SDK compromise hit the exact trust surface AppsFlyer monetizes. A buyer should require independent forensic closure, customer impact data, legal reserve analysis, and hard security controls before underwriting IPO-style multiples.
    claimRefs: [CV026, CV027, CV028, CV041]
  - calloutType: assumption
    title: Bull case requires paid AI and data-collaboration expansion
    body: >-
      The bull range assumes the Modern Marketing Cloud and agentic AI launches convert into measurable ARR expansion, not merely messaging. Without SKU-level attach and NRR proof, the core MMP market alone does not justify aggressive upside multiples.
    claimRefs: [CV014, CV015, CV024, CV032]
