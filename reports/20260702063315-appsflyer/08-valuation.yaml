      - ["Financial disclosure miss", "Audited revenue, ARR, NRR, gross margin, or FCF materially below underwriting case", "Reported scale/profitability no longer supports $2.7B", "Reprice or move to research-more"]
      - ["Platform signal shock", "Apple, Google, or walled gardens materially reduce usable attribution data", "Product value and customer ROI compress", "Cut growth/multiple and require roadmap proof"]
      - ["Strategic investor conflict", "Preferential data, API, board, or commercial terms contradict neutrality covenant", "Independent referee positioning weakens", "Treat as thesis break unless ring-fenced contractually"]
      - ["IPO window shuts", "No S-1 path, weak market receptivity, or sponsor bids below entry for 12-18 months", "Exit optionality falls and holding-period risk rises", "Require lower entry price or structured downside protection"]
      - ["Customer trust erosion", "Enterprise churn, procurement holds, or security audit failures exceed management plan", "Retention and NRR assumptions fail", "Pause closing pending cohort proof"]
    notes: >-
      Thresholds are monitorable diligence conditions, not public company guidance; several require private company records or third-party verification.
    claimRefs: [CV003, CV004, CV015, CV026, CV027, CV028, CV030, CV031, CV033, CV040, CV041]
  - id: TV006
    title: Final diligence asks table
    columns: [topic, missing evidence, why it matters, owner/diligence path]
    rows:
      - ["Audited financial model", "2024-2026 revenue, ARR, gross margin, EBITDA/FCF, NRR, GRR, churn, top-customer concentration", "Determines whether price is fair or stretched", "CFO / data room; reconcile to tax and audit workpapers"]
      - ["Cap table and preferences", "Primary proceeds, secondary sellers, liquidation preference, side letters, information rights, strategic investor rights", "Dilution and preference overhang determine entry economics", "Company counsel / financing docs; review all side letters"]
      - ["SDK incident closure", "Independent forensic report, customer notification list, claims/reserves, insurance, registrar/DNS controls", "Trust event is the top valuation discount", "CISO / outside counsel; obtain nonprivileged RCA and control evidence"]
      - ["Customer cohort impact", "Renewal, churn, expansion, procurement delay, support ticket, and concession data after March 2026", "Tests whether incident affected revenue durability", "Customer success / sample top customers and renewal cohorts"]
      - ["AI and adjacent product monetization", "Paid ARR and attach rate for AI, clean room, incrementality, cross-platform journeys, Signal Hub", "Bull case depends on revenue beyond core MMP", "Product/CRO; review SKU-level pipeline and cohort expansion"]
      - ["Exit readiness", "S-1 readiness, banker materials, sponsor bid history, legal/regulatory approvals", "Determines hold period and realizable exit value", "Board/bankers/counsel; validate IPO and M&A paths"]
    notes: >-
      The asks intentionally focus on private evidence unavailable from public sources; each row should be a closing condition or post-LOI diligence workstream.
    claimRefs: [CV005, CV006, CV009, CV010, CV011, CV012, CV024, CV025, CV026, CV027, CV028, CV036, CV037, CV038]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from strong franchise evidence through trust and disclosure gates into a conditional entry decision at the $2.7B mark.
    data:
      nodes:
        - id: franchise
          label: "Scaled independent franchise"
          detail: "15,000+ brands, broad partner footprint, and neutral measurement positioning."
        - id: strategic_validation
          label: "Strategic validation"
          detail: "Moloco, Google, Meta, and Unity invest on minority, non-controlling terms."
        - id: financial_scale
          label: "Reported profitable scale"
          detail: "$400M-$500M public revenue/ARR proxies, but no audited statements."
        - id: trust_gate
          label: "SDK trust gate"
          detail: "March 2026 Web SDK compromise requires independent remediation proof."
        - id: valuation_gate
          label: "Entry discipline"
          detail: "$2.7B is fair-to-full; upside requires AI monetization and exit readiness."
        - id: recommendation
          label: "Conditional recommendation"
          detail: "Proceed only with disclosure, remediation, and downside protections."
      edges:
        - {from: franchise, to: strategic_validation, label: "supports ecosystem relevance"}
        - {from: strategic_validation, to: financial_scale, label: "validates but does not audit"}
        - {from: financial_scale, to: valuation_gate, label: "sets multiple range"}
        - {from: trust_gate, to: valuation_gate, label: "creates risk discount"}
        - {from: valuation_gate, to: recommendation, label: "conditional entry"}
        - {from: trust_gate, to: recommendation, label: "kill if unresolved"}
    approximationNotes: >-
      Flow is qualitative and should be replaced by an IC model once private financials, churn, and cap-table terms are disclosed.
    claimRefs: [CV002, CV003, CV010, CV011, CV012, CV013, CV026, CV027, CV028, CV034, CV040]
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      AppsFlyer's value is most sensitive to ARR quality, security trust, and exit multiple rather than to the headline financing amount alone.
    data:
      items:
        - label: "Audited ARR/revenue quality"
          value: 30
          note: "Largest swing factor because $400M-$500M public proxies are unaudited."
        - label: "SDK trust remediation"
          value: 25
          note: "Incident can affect churn, legal reserves, procurement, and IPO disclosure."
        - label: "Exit multiple / IPO window"
          value: 20
          note: "M&A interest and public-market receptivity set realizable value."
        - label: "AI / adjacent attach rate"
          value: 15
          note: "Bull case requires paid expansion beyond core MMP."
        - label: "Cap-table preference overhang"
          value: 10
          note: "Secondary-heavy round and side letters determine investor economics."
    approximationNotes: >-
      Values are percentage sensitivity weights summing to 100; they are IC judgment weights, not a regression or audited model output.
    claimRefs: [CV005, CV006, CV010, CV011, CV012, CV024, CV025, CV026, CV027, CV028, CV034]
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Scenario ranges span a bear reset below entry, a base case around the latest round, and a bull case tied to PE interest and IPO-quality growth.
    data:
      items:
        - label: "Bear"
          low: 1.5
          mid: 1.75
          high: 2.0
          note: "USD billions; trust erosion, weak disclosure, or IPO window closure."
        - label: "Base"
          low: 2.7
          mid: 3.1
          high: 3.5
          note: "USD billions; entry supported by reported scale and successful remediation."
        - label: "PE interest support"
          low: 3.5
          mid: 4.0
          high: 4.5
          note: "USD billions; reported sponsor range, not a signed price."
        - label: "Bull / IPO-ready"
          low: 4.5
          mid: 5.25
          high: 6.0
          note: "USD billions; AI monetization, audited metrics, and public-market receptivity."
    approximationNotes: >-
      Ranges are valuation scenarios in USD billions; return depends on entry security, preference stack, dilution, and hold period.
    claimRefs: [CV002, CV010, CV011, CV012, CV024, CV025, CV026, CV035, CV036, CV037, CV038]
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      The KPI scorecard supports a conditional positive view: franchise and strategic relevance score high, while evidence quality and trust risk cap the recommendation.
