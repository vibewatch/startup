schemaVersion: "report-v2"
artifact: valuation
slug: appsflyer
runDate: '2026-07-02'
company:
  name: AppsFlyer
chapter:
  number: 8
  title: Valuation & Recommendation
  summary: >-
    AppsFlyer earns a cautious-positive, conditional recommendation: the company has a scaled independent measurement franchise, strategic validation from Moloco, Google, Meta, and Unity, reported profitability, and credible IPO or M&A optionality, but the March 2026 Web SDK trust event, private financial opacity, platform dependency, and a maturing core MMP market make price discipline essential. Entry at the June 2026 $2.7 billion post-money valuation is defensible but fair-to-full, with upside requiring breach remediation, audited financial disclosure, and evidence that AI and data-collaboration products expand beyond the core attribution market.
sections:
  - id: thesis-and-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The investment thesis is that AppsFlyer remains one of the few scaled neutral measurement layers in a market where AI-driven advertising needs independent signals more, not less. Public evidence supports a 15,000+ brand base, a 10,000+ partner ecosystem, broad product surfaces across measurement, deep linking, fraud, data collaboration, and agentic AI, and a 2026 strategic investment by Moloco, Google, Meta, and Unity that explicitly preserves non-control and no-preference principles. That gives the company a credible neutrality moat and a path to broaden from core MMP into a Modern Marketing Cloud. The anti-thesis is equally concrete: the narrow MMP market is publicly sized in the hundreds of millions, privacy rules and walled gardens constrain deterministic attribution, customer reviews flag price and complexity, and the March 2026 Web SDK compromise struck the trust boundary customers embed in their own properties. The resulting view is conditional rather than unconditional: TV002 and FV004 show a strong franchise that still needs proof that trust, disclosure, and growth can support the valuation.
    claimRefs: [CV001, CV004, CV013, CV014, CV015, CV016, CV017, CV018, CV020, CV024, CV029, CV032, CV039]
    tableRefs: [TV002]
    figureRefs: [FV004]
  - id: recommendation-and-stance
    title: Recommendation, confidence, risk rating, and decision stance
    body: >-
      The recommended verdict is cautious-positive / conditional, equivalent to track-to-buy only if the investor can enter near the $2.7 billion 2026 mark and receive company-level proof on remediation, financial quality, and preference structure. Confidence is medium because the public record is rich on financing, product, market, and incident evidence but thin on the metrics that determine valuation quality: audited revenue, ARR bridge, gross margin, NRR, churn, customer concentration, cash, primary proceeds, and post-incident cohort performance. Risk is medium-high because a trusted SDK distribution event, platform signal dependence, strategic investor conflict perception, and IPO-window uncertainty can all transmit directly into retention and exit multiple. Valuation stance is fair-to-full at $2.7 billion rather than cheap. The decision implication in TV001 is to proceed only with price protection, breach-remediation covenants, full financial disclosure, and a clear walk-away path; FV001 visualizes the logic from franchise strength through downside gates to a conditional recommendation.
    claimRefs: [CV002, CV003, CV005, CV006, CV009, CV010, CV011, CV012, CV026, CV027, CV028, CV030, CV031, CV033, CV040, CV041]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      The June 2026 transaction provides a real valuation anchor but not a complete underwriting answer. AppsFlyer announced investments above $1 billion at a $2.7 billion post-money valuation, and independent coverage says much of the transaction involved secondary liquidity while the official release describes both shareholder liquidity and new long-term strategic equity participation. That structure validates demand for the asset and helps existing holders, but it does not reveal how much cash entered the balance sheet, what liquidation preferences or side letters exist, or whether ordinary investors can obtain the same economics as strategic participants. Publicly reported revenue and ARR anchors of roughly $400 million to $500 million imply about 5.4x to 6.8x revenue/ARR at $2.7 billion; if lower internal revenue applies, the multiple is meaningfully higher. FV002 frames the sensitivity: the same price is supportable with audited profitability and clean retention, stretched with unresolved incident impact, and unattractive if the core MMP market matures faster than adjacent AI products monetize.
    claimRefs: [CV002, CV003, CV005, CV006, CV007, CV008, CV010, CV011, CV012, CV025, CV030, CV031, CV034, CV042]
    figureRefs: [FV002]
  - id: scenarios
    title: Bull, base, and bear scenarios
    body: >-
      Scenario work should use ranges rather than a single point estimate because the most important inputs are private. The bear case values AppsFlyer around $1.5 billion to $2.0 billion if the Web SDK event causes measurable churn, procurement friction, legal reserve needs, or a lower public-market multiple while IPO timing slips. The base case holds the $2.7 billion entry value and allows movement toward $3.5 billion if management proves profitable scale, remediation, no preferential strategic-investor rights, and continued customer demand for neutral measurement. The bull case reaches roughly $4.5 billion to $6.0 billion if AI, clean-room, incrementality, and cross-platform measurement products become real paid expansion vectors and public markets reward a profitable independent measurement infrastructure story. TV003 records explicit assumptions and probability signals, while FV003 converts them into valuation and return ranges. The cases are not forecasts; they are diligence-backed price bands that identify what would move the IC from conditional support to buy, hold, or avoid.
    claimRefs: [CV014, CV015, CV018, CV020, CV021, CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV032, CV034, CV035, CV036, CV037, CV038]
    tableRefs: [TV003]
    figureRefs: [FV003]
  - id: comparables-and-exit
    title: Comparables, exit readiness, diligence asks, and thesis-break triggers
    body: >-
      The comparable set supports discipline more than precision. AppLovin is a useful public adtech reference because it is scaled, public, and owns Adjust, but it is not a clean MMP multiple because its advertising network economics and public-market liquidity differ from AppsFlyer's private SaaS measurement model. Adjust, Branch, Kochava, and Singular define the direct MMP and marketing-measurement peer set, but their private metrics are mostly unavailable. The reported private-equity acquisition interest around $3.5 billion to $4.5 billion is therefore a more practical exit-readiness signal than a fully observable transaction comp, while the IPO track remains optional until an S-1, audited metrics, and market timing are visible. TV004 marks the comparable table as a partial enumeration, TV005 translates the downside into kill criteria, and TV006 lists final diligence asks. The exit call is conditional: M&A interest offers downside support, IPO can create upside, but only if financial disclosure and security trust are strong enough for public-company or sponsor scrutiny.
    claimRefs: [CV019, CV020, CV021, CV022, CV023, CV025, CV026, CV027, CV028, CV035, CV036, CV037, CV038, CV043, CV044, CV045]
    tableRefs: [TV004, TV005, TV006]
tables:
