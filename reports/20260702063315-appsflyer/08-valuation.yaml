  claims:
    - {id: CV001, statement: "AppsFlyer describes its mission as delivering AI-powered, privacy-first measurement technologies that turn data into growth opportunities.", type: company-claimed, topic: product-positioning, sourceRefs: [SV001, SV022], confidence: high, freshness: current, answersQuestionRefs: [QV001]}
    - {id: CV002, statement: "AppsFlyer announced a definitive agreement for investments from Moloco, Google, Meta, and Unity in June 2026 at a reported $2.7 billion valuation.", type: company-claimed, topic: financing, sourceRefs: [SV022, SV003, SV004], confidence: high, freshness: current, answersQuestionRefs: [QV007]}
    - {id: CV003, statement: "The 2026 investors are minority, non-controlling, and non-exclusive with no preferential API, signal, attribution-logic, or commercial-term access.", type: company-claimed, topic: governance, sourceRefs: [SV022, SV003], confidence: high, freshness: current, answersQuestionRefs: [QV024]}
    - {id: CV004, statement: "AppsFlyer's neutrality covenant is central to the investment thesis because customers must trust measurement that is not shaped by one interested ad platform.", type: inferred, topic: moat, sourceRefs: [SV022, SV003], confidence: medium, freshness: current, answersQuestionRefs: [QV001, QV024]}
    - {id: CV005, statement: "The official 2026 announcement says the transaction combines shareholder liquidity with new long-term strategic equity participation.", type: company-claimed, topic: financing-structure, sourceRefs: [SV022], confidence: medium, freshness: current, answersQuestionRefs: [QV008]}
    - {id: CV006, statement: "Calcalist reported that much of AppsFlyer's 2026 funding was through secondary deals.", type: third-party-reported, topic: financing-structure, sourceRefs: [SV003], confidence: medium, freshness: current, answersQuestionRefs: [QV008]}
    - {id: CV007, statement: "Crunchbase News reported that AppsFlyer has raised about $1.3 billion in known funding since inception after the latest round.", type: third-party-reported, topic: financing, sourceRefs: [SV004], confidence: medium, freshness: current, answersQuestionRefs: [QV007]}
    - {id: CV008, statement: "Calcalist reported that General Atlantic remained AppsFlyer's largest institutional investor with an estimated 15%-20% stake after the 2026 transaction.", type: third-party-reported, topic: ownership, sourceRefs: [SV003], confidence: medium, freshness: current, answersQuestionRefs: [QV010]}
    - {id: CV009, statement: "Times of Israel reported that AppsFlyer had been working with Goldman Sachs, JPMorgan, and Bank of America to explore a U.S. IPO targeting roughly $300 million.", type: third-party-reported, topic: exit-readiness, sourceRefs: [SV005], confidence: medium, freshness: recent, answersQuestionRefs: [QV020]}
    - {id: CV010, statement: "Times of Israel reported AppsFlyer generates about $400 million in annual revenue from software-as-a-service advertising management.", type: third-party-reported, topic: financials, sourceRefs: [SV005], confidence: medium, freshness: recent, answersQuestionRefs: [QV006, QV009]}
    - {id: CV011, statement: "Calcalist reported that AppsFlyer is profitable, generates positive cash flow, and has approximately $500 million of ARR.", type: third-party-reported, topic: financials, sourceRefs: [SV003], confidence: medium, freshness: current, answersQuestionRefs: [QV006, QV009]}
    - {id: CV012, statement: "AppsFlyer's 2020 Series D announcement stated that ARR exceeded $150 million in 2019 after five-year growth from $1 million to $100 million.", type: company-claimed, topic: financials, sourceRefs: [SV023, SV009], confidence: high, freshness: historical, answersQuestionRefs: [QV009]}
    - {id: CV013, statement: "AppsFlyer states it serves more than 15,000 brands worldwide as of the June 2026 investment announcement.", type: company-claimed, topic: customer-scale, sourceRefs: [SV022, SV003], confidence: high, freshness: current, answersQuestionRefs: [QV001, QV023]}
    - {id: CV014, statement: "AppsFlyer's partner page states that the company has more than 10,000 partner integrations and helps more than 80,000 companies.", type: company-claimed, topic: ecosystem, sourceRefs: [SV015], confidence: medium, freshness: current, answersQuestionRefs: [QV001, QV023]}
    - {id: CV015, statement: "Intel Market Research sizes the global MMP market at $320 million in 2025 and $639 million by 2032 at a 12.5% CAGR.", type: third-party-reported, topic: market-size, sourceRefs: [SV007], confidence: medium, freshness: recent, answersQuestionRefs: [QV025]}
    - {id: CV016, statement: "Intel Market Research reports that AppsFlyer, Adjust, and Kochava collectively held more than 60% MMP revenue share in 2024.", type: third-party-reported, topic: market-share, sourceRefs: [SV007], confidence: medium, freshness: recent, answersQuestionRefs: [QV025]}
    - {id: CV017, statement: "Apple's App Tracking Transparency and broader identifier restrictions have made privacy-safe attribution and aggregate measurement more important while reducing deterministic signal quality.", type: inferred, topic: platform-dependency, sourceRefs: [SV012, SV007], confidence: high, freshness: current, answersQuestionRefs: [QV001, QV025]}
    - {id: CV018, statement: "G2 review evidence shows AppsFlyer has a 4.5 rating from 741 reviews while customers praise attribution and also cite high pricing, complexity, and support latency.", type: third-party-reported, topic: customer-proof, sourceRefs: [SV008], confidence: medium, freshness: current, answersQuestionRefs: [QV001, QV002, QV023]}
    - {id: CV019, statement: "AppLovin is a public adtech comparable and AppLovin-related evidence is relevant because Adjust is owned by AppLovin.", type: inferred, topic: comparables, sourceRefs: [SV011, SV026, SV030], confidence: medium, freshness: current, answersQuestionRefs: [QV016]}
    - {id: CV020, statement: "Techmagnate's 2026 comparison describes Adjust as owned by AppLovin since 2021 and as strong in fraud-sensitive user acquisition and analytics.", type: third-party-reported, topic: comparables, sourceRefs: [SV030], confidence: medium, freshness: current, answersQuestionRefs: [QV017, QV018]}
    - {id: CV021, statement: "Branch's official site claims mobile measurement and attribution for 3.5 billion users and trust from 100,000 brands since 2014.", type: company-claimed, topic: comparables, sourceRefs: [SV027], confidence: medium, freshness: current, answersQuestionRefs: [QV017]}
    - {id: CV022, statement: "Kochava's official site positions the company as measuring campaigns across marketing channels, devices, and platforms.", type: company-claimed, topic: comparables, sourceRefs: [SV028], confidence: medium, freshness: current, answersQuestionRefs: [QV017]}
    - {id: CV023, statement: "Singular's official site claims cost aggregation from more than 1,200 sources and omnichannel measurement across mobile, web, CTV, PC, and console.", type: company-claimed, topic: comparables, sourceRefs: [SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV017]}
    - {id: CV024, statement: "AppsFlyer launched eight products in late 2025 across agentic AI, incrementality, cross-platform journeys, Signal Hub, enterprise security, attribution, dashboards, and creative management.", type: third-party-reported, topic: product-expansion, sourceRefs: [SV016, SV017], confidence: medium, freshness: recent, answersQuestionRefs: [QV013, QV014]}
    - {id: CV025, statement: "MobileMarketingReads reported that AppsFlyer was in advanced discussions with private-equity investors at reported valuations ranging from $3.5 billion to $4.5 billion.", type: third-party-reported, topic: exit-readiness, sourceRefs: [SV017], confidence: medium, freshness: recent, answersQuestionRefs: [QV018, QV020]}
    - {id: CV026, statement: "Cloud Security Alliance reported that malicious JavaScript was served from websdk.appsflyer.com for roughly fourteen hours between March 9 and March 10, 2026.", type: third-party-reported, topic: security, sourceRefs: [SV014, SV006], confidence: medium, freshness: current, answersQuestionRefs: [QV002, QV005, QV011, QV015]}
