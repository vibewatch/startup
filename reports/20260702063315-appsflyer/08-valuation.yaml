    columns: [comparable, metric, multiple/valuation/status, relevance, limitation]
    rows:
      - ["AppLovin", "Public adtech / Adjust owner", "Public issuer; market multiple not sourced in this chapter", "Scaled public adtech reference and owner of Adjust", "Different model with ad-network economics, public liquidity, and no clean MMP-only multiple"]
      - ["Adjust", "MMP peer", "Acquired by AppLovin in 2021 per comparison evidence", "Closest direct MMP M&A reference", "Deal price and current stand-alone metrics are not available in this source set"]
      - ["Branch", "Private MMP/deep-linking peer", "Claims 3.5B users and 100,000 brands", "Shows independent deep-linking and measurement alternative", "Private valuation, ARR, and churn are not disclosed"]
      - ["Kochava", "Private MMP/omnichannel peer", "Private; omnichannel measurement positioning", "Independent competitor with cross-channel measurement capability", "Private scale and valuation unavailable"]
      - ["Singular", "Private MMP/marketing data peer", "Claims 1,200+ cost sources", "Relevant for cost aggregation and ROI analytics adjacency", "Vendor-authored evidence and private metrics limit comparability"]
      - ["Broader martech SaaS / MMP market", "Market model", "$320M 2025 core MMP market to $639M 2032", "Sets category-growth ceiling for core MMP underwriting", "Narrow market definitions may exclude AppsFlyer's broader marketing-cloud modules"]
