      - [Confidence, Medium, "Public sources triangulate financing, scale, product and risks, but private metrics are unavailable", "Upgrade only after audited financials and customer cohort proof"]
      - [Risk rating, Medium-high, "SDK trust event, platform dependency, private financials, and IPO timing can all hit valuation", "Require explicit kill criteria before IC approval"]
      - [Valuation stance, "Fair-to-full at $2.7B", "Implied 5.4x-6.8x on reported $400M-$500M revenue/ARR proxies", "Attractive only if breach remediation and ARR quality are proven"]
      - [Target return / hold / exit, "Hold-to-upside with M&A support", "$3.5B-$4.5B PE interest and IPO preparation provide exit paths", "Do not underwrite IPO until S-1-quality metrics are available"]
    notes: >-
      Conclusions are IC judgments using public evidence and scenario math; target return is directional because entry terms, dilution, liquidation preferences, and audited financials are private.
    claimRefs: [CV002, CV003, CV009, CV010, CV011, CV012, CV025, CV026, CV027, CV028, CV030, CV031, CV040, CV041]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [argument, evidence direction, what would change the view, decision weight]
    rows:
      - ["Neutral measurement moat", "Strategic investors endorse independent attribution while accepting no preferential API or commercial terms", "Side letters or customer objections showing preferential influence", High]
      - ["Scale and partner density", "15,000+ brands and 10,000+ partner ecosystem support distribution advantage", "Churn, declining partner usage, or loss of major platform integrations", High]
      - ["Product expansion", "Eight AI-oriented products and Modern Marketing Cloud positioning broaden the revenue surface", "Low paid conversion for AI, clean-room, incrementality, or cross-platform modules", Medium]
      - ["Market tailwinds", "Privacy shifts and AI bidding increase need for trusted independent signals", "Platform reporting becomes sufficient or privacy APIs reduce measurable ROI", High]
      - ["Financial quality", "Reported profitability, positive cash flow and $400M-$500M revenue/ARR support scale", "Audited ARR, margin, NRR, or FCF materially below reported proxies", High]
      - ["Security trust overhang", "March 2026 Web SDK compromise directly affects embedded third-party trust", "Independent forensic closure and no customer churn would reduce the discount", High]
      - ["Market maturation", "Core MMP market estimates are modest relative to reported AppsFlyer revenue", "Management proves adjacent modules drive durable net expansion", Medium]
      - ["Exit optionality", "M&A interest and IPO advisers provide paths to liquidity", "IPO window closes or sponsor bids reprice below entry", Medium]
    notes: >-
      Decision weights are qualitative; rows synthesize market, product, customer, financial, competitive, and risk evidence rather than independently sourced scorecard values.
