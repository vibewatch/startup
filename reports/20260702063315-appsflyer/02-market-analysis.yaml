callouts:
  - calloutType: insight
    title: "Narrow market, large control point"
    body: "The public MMP revenue pool is small relative to mobile ad spend, but attribution controls budget allocation decisions, making the category strategically more important than its direct software TAM suggests."
    claimRefs: [CM003, CM004, CM007, CM016]
  - calloutType: risk
    title: "Market-size contradiction needs management bridge"
    body: "Public MMP estimates are lower than reported AppsFlyer revenue/ARR proxies, so diligence must separate core MMP, broader marketing-cloud modules, and non-recurring or secondary narratives before using TAM multiples."
    claimRefs: [CM005, CM008, CM009, CM010]
  - calloutType: strength
    title: "Privacy disruption is demand creation"
    body: "ATT, IDFA scarcity, SKAN, and walled-garden reporting make measurement harder, but that complexity also increases demand for neutral infrastructure able to combine aggregate, probabilistic, and incrementality methods."
    claimRefs: [CM028, CM029, CM030, CM031]
  - calloutType: recommendation
    title: "Diligence the buyer economics"
    body: "Prioritize evidence on budget owner, implementation time, renewal drivers, vertical mix, and security-review outcomes; these determine whether market growth converts into durable net revenue retention."
    claimRefs: [CM024, CM026, CM036, CM037]
