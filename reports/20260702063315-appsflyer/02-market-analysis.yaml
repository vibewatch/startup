  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: company-scale
      missingEvidence: "Audited or management-certified split of AppsFlyer revenue by core MMP, fraud, deep linking, data collaboration, AI workflow, and other cloud modules."
      whyItMatters: "Without a revenue bridge, public MMP market estimates cannot be reconciled with the company's reported revenue or ARR scale."
      diligencePath: "Request product-line ARR, gross retention, NRR, attach-rate, and cohort-expansion schedules from management and test them in customer calls."
      relatedQuestionRefs: [QM020]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: "Comparable bottom-up and top-down market models using the same geography, terminal year, category boundary, and revenue definition."
      whyItMatters: "The public MMP market range changes materially depending on source and can distort valuation multiples."
      diligencePath: "Commission or build an independent TAM/SAM/SOM model from vendor revenue, customer counts, app-advertiser counts, and pricing curves."
      relatedQuestionRefs: [QM020]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: budget-owner
      missingEvidence: "Representative customer interviews or procurement records showing budget owner, purchase trigger, implementation time, and annual contract size by vertical."
      whyItMatters: "Buyer economics determine whether privacy complexity turns into durable software expansion or remains a narrow expert-tool budget."
      diligencePath: "Interview at least ten customers across gaming, ecommerce, fintech, entertainment, and agencies, including churned or multi-homing accounts."
      relatedQuestionRefs: [QM029]
