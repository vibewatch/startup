              具名客户档案足以证明生产环境触达，但新鲜度和结果具体性差异很大。最新且最具体的参考是 Playtika：AppsFlyer 自有案例称，这家游戏公司使用 AppsFlyer 的 CTV 到移动端衡量来投放和分析
