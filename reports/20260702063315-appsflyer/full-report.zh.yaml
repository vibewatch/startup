        - 独立取证闭环且客户不流失，将降低折价
        - 高
      - - 市场成熟
        - 相比 AppsFlyer 已报告收入，核心 MMP 市场估算偏小
        - 管理层证明邻近模块能驱动持久净扩张
        - 中
