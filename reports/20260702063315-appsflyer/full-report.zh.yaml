        - 2024-2026 年收入、ARR、毛利率、EBITDA / FCF、NRR、GRR、流失、头部客户集中度
        - 决定价格是公允还是偏满
        - CFO / 数据室；与税务和审计工作底稿核对
      - - 股权结构表与优先权
        - 新股融资额、老股出售方、清算优先权、补充协议、信息权、战略投资者权利
        - 稀释和优先权压力决定入场经济性
        - 公司律师 / 融资文件；审阅所有补充协议
      - - SDK 事件闭环
        - 独立取证报告、客户通知名单、索赔 / 准备金、保险、注册商 / DNS 控制
        - 信任事件是最大估值折价项
        - CISO / 外部律师；取得非特权 RCA 和控制证据
      - - 客户分群影响
        - 2026 年 3 月之后的续约、流失、扩张、采购延迟、支持工单和让步数据
        - 检验事件是否影响收入韧性
        - 客户成功 / 抽样头部客户和续约分群
      - - AI 与邻近产品变现
