  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险总览和严重性排序
        blocks:
          - type: paragraph
            body: >-
              严重性排序应从 2026 年 3 月 Web SDK 事件开始，而不是普通 SaaS 执行风险。多名独立安全研究人员描述，3 月 9-11 日 Web SDK 分发路径被攻破，投放混淆
              JavaScript、拦截加密货币钱包地址、保留合法分析行为，并可能暴露极大的安装基数。这是一起信任事件，发生在 AppsFlyer
              所售卖的核心表面：嵌入客户资产的中立、隐私敏感衡量。基准情形不是该事件摧毁业务；AppsFlyer 具备官方信任、隐私和事件响应姿态，规模也足以吸引 Google、Meta、Unity 和 Moloco
              投资。投资含义是尽调闸门：在按 IPO 式倍数承保前，要求取证关闭、客户通知证据、网络保险限额、注册商 / DNS 控制证明和流失 / 队列数据。FR001 汇总可能性与影响，TR005
              则把排序后的风险转成可监控的终止标准。
