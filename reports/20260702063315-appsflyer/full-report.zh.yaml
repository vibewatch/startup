        - 为核心 MMP 投资测算设定品类增长上限
        - 狭窄市场定义可能排除 AppsFlyer 更广义的营销云模块
      - - 私募股权 M&A 兴趣
        - 已报道财务买家区间
        - 已报道 $3.5B-$4.5B 意向
        - 相对于 $2.7B 入场价，提供现实的下行 / 上行支撑
