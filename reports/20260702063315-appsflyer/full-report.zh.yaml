      - number: '1.5'
        title: 不利事件、诉讼与安全风险
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer 2025 年裁员约 100 人（约员工的 7%）。CEO Oren Kaniel 将该决定归因于组织精简和增加 AI 投资，
              尽管公司称自己首次实现盈利、现金流为正已超过两年，并且收入、ARR、EBITDA 均超目标。Times of Israel 将这次裁员放在以色列科技行业更大范围重组潮中， 并指出其发生在竞争对手
              Adjust（AppLovin 旗下）上一年底规模相近的裁员之后；受影响员工据称获得了特别薪酬包和其他过渡福利。

              2022 年 6 月 6 日，美国加州北区联邦地区法院在 In re Flo Health, Inc. Consumer Privacy Litigation （No.
              3:21-cv-00757-JD）中驳回了针对 AppsFlyer, Inc. 的全部诉请，但允许修改后重诉。该案中，AppsFlyer 因涉嫌通过 SDK 未披露共享 Flo Health 应用用户数据，与
              Facebook、Google、Flurry 一起被列为被告。法院将 AppsFlyer 与其他被告区分开来， 认为起诉状没有主张 AppsFlyer
              将数据用于广告或营销，只称用于未具体说明的「AppsFlyer 自身目的」，不足以确立诉讼资格； 所审阅来源没有显示后续修订起诉状的结果或最终处置。

              约在 2026 年 3 月 9-10 日，攻击者通过社会工程攻破 AppsFlyer 的域名注册商账户，关闭多因素认证，并用取得的权限将 websdk.appsflyer.com
              内容分发域重定向到攻击者基础设施。约 14 小时内，被劫持的 Web SDK 分发了混淆后的恶意 JavaScript，
              在终端用户输入加密货币钱包地址（Bitcoin、Ethereum、Solana、Ripple、TRON）时拦截并静默替换；攻击同时使用网络请求拦截、 DOM
              变更观察器和剪贴板监控，并保留合法分析功能以逃避检测。AppsFlyer 称其内部基础设施、应用服务器和客户数据环境没有被直接攻破， 移动 SDK（不同于 Web SDK）未受影响；安全研究人员估计 Web
              SDK 被 15,000+ 企业和 100,000+ 应用加载， 但所审阅来源没有公开确认具体受害者或有记录的财务损失。
