              公司概览章节负责完整的逐轮融资历史；财务章节只使用评估前瞻资本充足性所需的融资事实。2026 年 6 月交易把战略投资人引入股权结构， 投后估值为 $2.7 billion，报道金额超过 $1
              billion；但官方表述称该交易结合了股东流动性和新的长期战略股权参与，独立报道也称其中很大一部分是老股。
              因此，标题融资额不等于资产负债表上的新增现金。现金流为正的报道降低了表面融资依赖，但在手现金、烧钱、跑道、债务和一级发行所得金额都未披露。 鉴于公开市场准备和 CEO
              将该轮描述为走向上市的一步，下一次流动性触发点最可能是 IPO 准备，而不是生存资本。资本充足性表和现金流地图 因此把 SaaS
