      - number: '8.3'
        title: 融资背景和进入纪律
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月交易提供了真实估值锚，但不是完整承保答案。AppsFlyer 宣布以 $2.7B 投后估值获得超过 $1B
              投资；独立报道称交易很大部分涉及二级流动性，官方新闻稿则称既有股东流动性，也有新的长期战略股权参与。该结构验证了资产需求，也帮助既有持有人，但没有披露进入资产负债表的现金金额、是否存在清算优先权或附函，或普通投资者能否获得与战略参与方相同的经济条款。公开报道的约
              $400M 至 $500M 收入 / ARR 锚，意味着在 $2.7B 估值下约 5.4x 至 6.8x 收入 / ARR；如果内部收入更低，倍数会显著更高。FV002
              描绘敏感性：同一价格在经审计盈利和干净留存下可支撑，在事件影响未解决时偏拉伸；若核心 MMP 市场成熟速度快于相邻 AI 产品变现，则缺乏吸引力。
