  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与结构
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer 的收入模式更像企业 SaaS 加用量敏感的营销衡量经济，而不是纯广告网络或媒体转售商。官方描述把 AppsFlyer 定位为覆盖全渠道衡量、 深度链接、数据协作和自主 AI 工作流的
              Modern Marketing Cloud；独立报道则称其年收入来自销售广告管理 SaaS。公开证据支持多个可变现产品面： 核心归因与衡量、OneLink / 深度链接、反欺诈保护、隐私 / 数据协作产品，以及
              AI 驱动的衡量工作流。尚未公开的是这些收入流之间的结构、 每个客户的实际价格，以及用量激增或多年企业合同下的收入确认政策。因此，收入流表和收入模式桥接区分有来源支持的收入机制与缺乏支持的结构估计， 保留约
              $400 million 披露收入与约 $500 million ARR 式估计之间的冲突，而不是强行给出单点值。
