          detail: 公司在 2026 年 6 月投资公告中披露的客户基数。
          tone: positive
        - id: keyperson
          label: 创始人 CEO 延续掌舵（Oren Kaniel）
          detail: 自 2011 年创立以来一直单独担任 CEO；未披露接班计划。
