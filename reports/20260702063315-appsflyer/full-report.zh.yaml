      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              经济买方通常是 CMO、VP Growth、效果营销负责人或用户获取负责人，他们要在各移动网络之间分配预算并证明 ROAS。 日常用户是增长营销人员、UA
              经理、营销分析师、数据工程师、欺诈分析师，有时也包括代表应用发行商投放活动的代理团队。 付款方随成熟度不同而变化：独立游戏可能从免费或按转化计价方案起步；付费获客扩大后，成长型公司会升级到付费 MMP 工具；
              企业则购买定制合同，因为它们需要原始数据、安全审查、隐私支持，以及跨数千伙伴的集成。采用很少完全自上而下； 产品常从一个投放活动、SDK 集成、SKAN
              需求、欺诈担忧或渠道扩张切入，随后因归因历史、伙伴映射、仪表盘和原始数据导出进入预算规划而变得黏性很强。 因此，细分市场地图把游戏、电商、金融科技、娱乐和代理机构视为不同采购动作，而不是一个泛化的营销主类别。
