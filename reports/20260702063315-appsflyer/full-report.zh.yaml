      - number: '4.2'
        title: GTM 动作与销售效率替代指标
        blocks:
          - type: paragraph
            body: >-
              现有证据指向全球企业和中端市场销售动作，卖给需要跨主要广告平台做独立衡量的应用所有者、品牌、游戏、电商、金融和媒体团队。 AppsFlyer 2020 年披露客户超过 12,000 家，2026 年披露品牌超过
              15,000 个；客户评价证据显示实施时间中位数为 3 个月、 ROI 替代指标为 12 个月，并反复提到事件量扩大后定价会变贵。这些是有用的销售效率替代指标，但不能替代私有 CAC、回本周期、
              销售周期、胜率、NRR 或渠道利润率数据。客户案例中呈现的反欺诈节省和获客改善，说明公司在做价值销售；但买方仍需要合同 cohort 和扩张数据， 才能判断公司是在高效增加净新
              ARR，还是只是在收割成熟安装基础。单位经济模型桥接使用这些公开替代指标，同时明确标出缺失的 CAC / 回本和留存输入。
