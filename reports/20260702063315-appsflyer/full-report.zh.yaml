      - number: '8.4'
        title: 牛市、基准和熊市情景
        blocks:
          - type: paragraph
            body: >-
              情景分析应使用区间，而不是单点估算，因为最重要的输入都是私有信息。熊市情形下，如果 Web SDK 事件造成可衡量流失、采购摩擦、法律准备金需求或更低公开市场倍数，同时 IPO 时间推迟，AppsFlyer
              估值约为 $1.5B 至 $2.0B。基准情形维持 $2.7B 进入价值，并在管理层证明盈利规模、整改、无优先战略投资者权利，以及客户对中立衡量的持续需求后，允许估值向 $3.5B 移动。牛市情形下，如果
              AI、数据洁净室、增量衡量和跨平台衡量产品成为真实付费扩张向量，且公开市场奖励一个盈利的独立衡量基础设施叙事，估值可达约 $4.5B 至 $6.0B。TV003 记录明确假设和概率信号，FV003
              把它们转成估值与回报区间。这些情景不是预测，而是尽调支撑的价格带，用来识别哪些事实会让 IC 从有条件支持转向买入、持有或回避。
