  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐从强业务版图证据出发，经信任和披露门槛，落到 $2.7B 点位的有条件入场决定。
    data:
      nodes:
        - id: franchise
          label: 规模化独立业务
          detail: 15,000+ 品牌、广泛合作伙伴覆盖和中立监测定位。
        - id: strategic_validation
          label: 战略背书
          detail: Moloco、Google、Meta 和 Unity 以少数股权、非控股条款投资。
        - id: financial_scale
          label: 公开口径的盈利规模
          detail: $400M-$500M 公开收入 / ARR 代理指标，但没有审计报表。
        - id: trust_gate
          label: SDK 信任门槛
          detail: 2026 年 3 月 Web SDK 被攻陷，需要独立整改证据。
        - id: valuation_gate
          label: 入场纪律
          detail: $2.7B 属于合理至偏满；上行需要 AI 变现和退出准备度。
        - id: recommendation
          label: 有条件建议
          detail: 只有拿到披露、整改和下行保护，才继续推进。
      edges:
        - from: franchise
          to: strategic_validation
          label: 支撑生态相关性
        - from: strategic_validation
          to: financial_scale
          label: 背书但不审计
        - from: financial_scale
          to: valuation_gate
          label: 确定倍数区间
        - from: trust_gate
          to: valuation_gate
          label: 带来风险折价
        - from: valuation_gate
          to: recommendation
          label: 有条件入场
        - from: trust_gate
          to: recommendation
          label: 未解决则放弃
    approximationNotes: 流程是定性判断；私有财务、流失率和股权结构条款披露后，应由 IC 模型替代。
