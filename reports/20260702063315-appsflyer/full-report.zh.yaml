companyProfile:
  summary: >-
    AppsFlyer Ltd. 是一家 2011 年创立于以色列的后期未上市营销技术公司，率先开拓独立移动归因， 此后扩展为自称的 Modern Marketing Cloud，覆盖衡量、深度链接、反欺诈保护（Protect360）、
    数据协作（Data Clean Room）、受众分群，以及横跨移动、Web、CTV、PC/console 的智能体 AI。 公司面向营销主、发行商和平台销售订阅与按用量计费的 SaaS；核心差异化是中立衡量，背后由 10,000+
    伙伴集成支撑。2026 年 6 月，公司宣布 Google、Meta、Unity、Moloco 按 $2.7 billion 投后估值投资超过 $1 billion，同时探索美国 IPO；几个月前的 2026 年 3 月 Web
    SDK 供应链攻击， 刚刚考验过它的安全与信任底座。
