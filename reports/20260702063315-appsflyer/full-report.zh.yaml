  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点和反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是，AI 驱动广告更需要独立信号，而不是更少；在这样的市场里，AppsFlyer 仍是少数有规模的中立衡量层。公开证据支持 15,000+ 品牌基础、10,000+
              伙伴生态，产品面覆盖衡量、深度链接、反欺诈、数据协作和智能体 AI；Moloco、Google、Meta 和 Unity 在 2026
              年的战略投资也明确保留非控制和无优待原则。这给公司提供了可信的中立护城河，也让它有机会从核心 MMP 拓宽为现代营销云。反论点同样具体：狭义 MMP
              市场的公开规模只有数亿美元，隐私规则和围墙花园限制确定性归因，客户评论指出价格和复杂度，2026 年 3 月 Web SDK
              被攻破还击中了客户嵌入自有资产的信任边界。因此，结论是有条件的，而非无条件看多：TV002 和 FV004 显示的是强势业务根基，但仍需要证明信任、披露和增长足以支撑估值。
