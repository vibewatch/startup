      - number: '2.5'
        title: 保留的规模缺口与冲突
        blocks:
          - type: paragraph
            body: >-
              本章刻意保留矛盾，而不是强行给出虚假的精确 TAM。两组公开 MMP 市场估计在终止年份、数值和 CAGR 上分歧明显； 客户评价和供应商页面确认产品有用，但没有透露付费席位渗透率或净留存；AppsFlyer
              又是私营公司，分部收入、总留存、垂直行业结构和模块附加率都无法从公开申报审计。 这很关键，因为 $400-$500 million
              的收入运行率可能意味着类别主导、类别定义错误，或收入来自相邻营销云模块。尽调应要求管理层提供从核心 MMP 到更广义云业务的市场桥接、按产品家族拆分的收入来源、头部垂直行业结构、ATT/SKAN 变化后的
              cohort 留存、对 Adjust、Kochava、 Singular、Branch 和内部自建的竞争赢 / 输，以及 SDK 事件后的安全整改证据。在这些路径关闭前，市场分析可以支持有利的战略叙事， 但对精确
              SAM/SOM 转化只能给中等置信度。
