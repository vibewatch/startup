figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: AppsFlyer 公共记录跨越了 2011 年在以色列创立、截至 2020 年的四轮风险融资、2023 年底两次收购、2025 年重组、2026 年 3 月安全事件，以及 2026 年 6 月以 $2.7B 估值获得投资。
    data:
      items:
        - date: '2011'
          label: AppsFlyer 成立
          detail: Oren Kaniel 和 Reshef Mann 在以色列创立公司。
          tone: positive
        - date: 2015-01
          label: Series B 轮（$20M）
          detail: Fidelity Growth Partners Europe 领投；资金用于旧金山、北京和特拉维夫办公室。
          tone: positive
        - date: 2017-01
          label: Series C 轮（$56M）
          detail: SDK 覆盖 2.5B+ 设备；据报道收入每年增长三倍。
          tone: positive
        - date: 2018-02
          label: 开设旧金山总部
          detail: 11,000 sq ft 办公室显示对美国市场投入加深。
          tone: positive
        - date: 2020-01
          label: Series D 轮（$210M / $1.6B 估值）
          detail: General Atlantic 领投；成为归因类别首个独角兽。
          tone: positive
        - date: 2022-06
          label: Flo Health 诉讼请求被驳回
          detail: 法院认为原告未充分主张由 AppsFlyer 具体造成的损害；驳回并允许修改诉状。
          tone: neutral
        - date: 2023-11
          label: 收购 Devtodev
          detail: 游戏和应用分析公司并入平台。
          tone: positive
        - date: 2023-12
          label: 收购 oolo
          detail: 基于 AI 的 UA / 变现平台；一个月内第二次收购。
          tone: positive
        - date: '2025'
          label: 裁撤约 100 个岗位（7%）
          detail: 尽管据报道已盈利，公司仍重组；管理层将其表述为 IPO 准备。
          tone: negative
        - date: 2026-03
          label: Web SDK 供应链攻击
          detail: 域名注册商遭入侵，约 14 小时内向用户加载窃取加密货币的 JavaScript。
          tone: negative
        - date: 2026-06
          label: Google、Meta、Unity、Moloco 投资 $1B+（估值 $2.7B）
          detail: 少数股权、非控股的战略投资，并包含二级市场流动性。
          tone: positive
    approximationNotes: 为保证视觉时间线可读性，未放入 Series A 轮（2014）和 2018 年 5 月收购 Yodas，但里程碑表已覆盖； 2023 年两笔收购的交易金额均未披露。
    claimRefs:
      - CO002
      - CO017
      - CO018
      - CO019
      - CO032
      - CO034
      - CO043
      - CO046
      - CO037
      - CO022
