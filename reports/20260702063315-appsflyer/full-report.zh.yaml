        - id: finance
          label: 财务模型
          detail: ARR、NRR、利润率和盈利假设
        - id: ipo
          label: IPO / 退出窗口
          detail: 披露负担和市场接受度
        - id: valuation
          label: 估值
          detail: 倍数和风险折价
      edges:
        - from: sdk
          to: trust
          label: 信任冲击
        - from: sdk
          to: legal
          label: 索赔与通知
        - from: trust
          to: churn
          label: 续约阻力
        - from: legal
          to: finance
          label: 准备金与支出
        - from: churn
          to: finance
          label: ARR / NRR 压力
        - from: finance
          to: ipo
          label: 披露质量
        - from: ipo
          to: valuation
          label: 退出时点
        - from: legal
          to: valuation
          label: 风险折价
    approximationNotes: 边代表由事故、隐私和融资证据支持的因果尽调假设。
