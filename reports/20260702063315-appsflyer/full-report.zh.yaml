  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 安全整改失败
        - 没有独立取证闭环、受信任脚本事件重演，或出现重大客户索赔
        - 中立可信基础设施逻辑破裂
        - 放弃，或要求显著更低估值和赔偿保障
      - - 财务披露落差
        - 经审计收入、ARR、NRR、毛利率或 FCF 明显低于投资测算基准
        - 已报告规模 / 盈利能力不再支撑 $2.7B
        - 重新定价或转为继续研究
      - - 平台信号冲击
        - Apple、Google 或围墙花园大幅减少可用归因数据
        - 产品价值和客户 ROI 被压缩
        - 下调增长 / 倍数，并要求路线图证据
      - - 战略投资者冲突
        - 数据、API、董事会或商业条款优待与中立性契约相冲突
        - 独立裁判定位削弱
        - 除非通过合同隔离，否则视为投资逻辑破裂
      - - IPO 窗口关闭
        - 12-18 个月内没有 S-1 路径、市场接受度弱，或财务买家报价低于入场价
        - 退出可选性下降，持有期风险上升
        - 要求更低入场价或结构化下行保护
      - - 客户信任受侵蚀
        - 企业客户流失、采购暂停或安全审计失败超过管理层计划
        - 留存和 NRR 假设失效
        - 暂停交割，等待分群证据
    notes: 阈值是可监控的尽调条件，不是上市公司指引；其中几项需要私有公司记录或第三方验证。
