      - number: '7.2'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              法律暴露很宽，因为 AppsFlyer 在受隐私监管的品类里处理营销和归因数据，同时依赖客户配置和伙伴数据流。其 Services Privacy Policy
              称公司接收技术标识符、互动信息和其他终端用户数据；也承认这些数据在部分法域可能被视为个人数据，且客户虽受合同限制，技术上仍有能力把服务配置为收集 PII。该结构留下 GDPR、CCPA、跨境传输、DPF
              以及控制者 / 处理者责任分配的残余风险。ClassAction.org 的 AppsFlyer 分类页最好视为监控信号，而不是重大判决证据，因为可见页面未证明已有经裁判的 AppsFlyer
              特定责任。TR001 因此采用部分枚举，并把隐私 / 数据保护、SDK 事件索赔和投资轮监管批准排在常规 IP / 许可未知项之上。尽调路径应由法律牵头：诉讼案卷检索、DPA /
              保险审查、事件通知时间线和监管问询确认。
