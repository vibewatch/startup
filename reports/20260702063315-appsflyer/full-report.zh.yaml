    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: General Atlantic 和 2026 年战略投资方出资支持一个以 AI 和隐私优先的统一测量平台，服务 15,000+ 品牌客户，覆盖四个产品套件；创始人 CEO 延续掌舵，披露缺口也与平台并存，构成持续结构性风险。
    data:
      nodes:
        - id: ownership
          label: General Atlantic + 2026 年战略投资方（Google、Meta、Unity、Moloco）
          detail: 少数股权、非控股持股；General Atlantic 自 2020 年起拥有董事会席位。
          tone: positive
        - id: platform
          label: AppsFlyer — 现代营销云
          detail: 统一的测量、深度链接、数据协作和智能体式 AI 平台。
          tone: positive
        - id: products
          label: 测量、深度链接、数据协作、智能体式 AI 套件
          detail: 面向营销人员、发布商和平台销售的四个产品套件。
          tone: positive
        - id: customers
