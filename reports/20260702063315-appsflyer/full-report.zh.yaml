            body: >-
              财务 / 模型风险主要是信息不透明，而非可见困境。公开来源报道，2026 年 6 月融资超过 $1B、估值 $2.7B，包含部分二级流动性，公司有 IPO 目标，收入或 ARR 口径从约 $400M 收入到约
              $500M ARR 不等；但公开证据没有经审计报表、毛利率、留存、烧钱、营运资本或净收入留存。这让估值对披露意外、市场倍数压缩，以及事件或平台变化对续约队列的影响程度高度敏感。执行风险也重要：2025 年 9
              月裁减约 100 个岗位、约 7%，或许能改善经营杠杆，但也可能在 AI 与 IPO 重新定位期削弱产品速度。TR004 对人员风险排序。只有在尽调拿到经审计财务、事件复盘材料、监管 /
              诉讼清场、平台路线图证据和员工留存数据后，缓释姿态才算可接受。
