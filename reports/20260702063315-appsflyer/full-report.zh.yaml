            - 跨投放媒介直达 App 目的页，并支持延迟深度链接
            - 链接治理和迁移证据
            - 审查链接量、治理和支持承诺
        - label: 数据协作 / DCR / Signal Hub
          values:
            - 增长期
            - PETs、聚合报告、Dynamic Query、洁净室与身份解析技术
            - 具名认证和客户审计证据
            - 索取 DCR 安全、隐私和数据驻留文档
        - label: 智能体 AI / MCP / 仪表盘
          values:
            - 较新路线图
            - 面向 LLM 的 MCP、预构建智能体、AI 仪表盘、自然语言查询
            - 生产采用情况和输出质量控制
            - 测试权限、日志、幻觉控制和数据处理
        - label: 企业安全包
          values:
            - 新增高级套餐
            - SAML、SCIM、token 治理、审计日志、IP 允许列表、RBAC、Zero Trust 对齐
            - 默认控制项与付费包
            - 确认基线控制集和独立评估
        - label: Web SDK / 脚本分发
          values:
            - 信任边界承压
            - 高触达浏览器埋点
            - 2026 年 3 月注册商 / DNS 被攻陷并暴露加密货币窃取程序
            - 获取事故报告、加固证据和客户通知记录
    approximationNotes: 成熟度标签是定性判断，基于公开发布时间和观察到的产品功能面广度，而非收入贡献或客户采用指标。
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE008
      - CE009
      - CE015
      - CE016
      - CE018
      - CE021
      - CE026
  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: AppsFlyer 客户通常从监测碎片化痛点出发，先部署移动归因，再扩展到深度链接、受众、数据协作、CTV、反欺诈和 AI 辅助工作流。
    data:
      items:
        - label: 监测痛点
          note: 买方面对移动、Web、CTV 和 App 数据割裂、平台隐私规则变化，还要证明 ROAS 和 LTV。
        - label: MMP 评估
          note: 增长和分析团队会把 AppsFlyer 与 Adjust、Branch、Kochava、Singular 以及内部平台报告对比。
        - label: 初始部署
          note: SDK / API、合作伙伴集成、OneLink、归因仪表盘和反欺诈工具随 App 或 Web 投放上线。
        - label: 运营使用
          note: 团队跟踪投放活动、用户分群、原始报告、SSOT 和渠道质量；评论证据显示这些工作流会反复使用。
        - label: 扩展模块
          note: 账户可增加 CTV、受众、留存 / LTV 工作流、数据洁净室、增量效果和 AI 驱动洞察。
        - label: 续约与背书
          note: 公开证据显示客户满意度和案例研究，但续约队列与 NRR 仍需在私下尽调中索取。
    approximationNotes: 旅程阶段综合官方解决方案页面和评论证据；各阶段之间的准确转化率并不公开。
    claimRefs:
      - CU001
      - CU011
      - CU012
      - CU013
      - CU017
      - CU020
      - CU023
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开漏斗在认知和部署证据上最强，但付费客户转化、活跃使用和续约分母薄弱。
    data:
      items:
        - label: 市场认知
          value: 100
          note: 独立评论市场能见度和 MMP 市场领导者引用支持发现阶段。
        - label: 具名客户考量
          value: 85
          note: 具名客户证据验证其能进入企业采购流程。
        - label: 签约品牌
          value: 70
          note: 2026 年官方与媒体来源披露了目前最好的客户数量口径。
        - label: 运营部署
          value: 55
          note: 评论证据显示实施后工作流有活跃使用。
        - label: 可衡量决策
          value: 35
          note: 历史指标显示其影响预算决策，但缺少当前分母。
        - label: 续约 / 扩张
          value: 10
          note: 扩张叙事可信，但留存经济性必须靠资料室证据确认。
    approximationNotes: 漏斗数值是描述性公开证据，不是转化率，也不是各阶段实际客户数量。
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU015
      - CU017
      - CU020
      - CU023
      - CU039
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 证据矩阵区分当前案例研究证据、较早具名客户证据和仅来自评论的满意度证据。
    data:
      columns:
        - 细分市场
        - 生产使用清晰度
        - 结果具体度
        - 新鲜度
        - 尽调权重
      rows:
        - label: Playtika
          values:
            - 游戏
            - 中高：测试活动转为持续 CTV 监测工作
            - 中：描述了监测能力，未披露量化收入
            - 当前 2026 年来源
            - 强定性背书；要求客户访谈
        - label: Visa
          values:
            - 金融 / 支付
            - 中：官网展示页案例故事证据
            - 高：官网展示页披露 App 下载和每注册成本数据
            - 当前官网展示页；未审查完整案例细节
            - 良好结果证据；验证分母
        - label: eBay / Macy's / Nike（客户 logo）
          values:
            - 电商 / 零售 / 消费
            - 中低：具名客户列表
            - 低：已审来源没有当前结果
            - 多数为 2020 年或 2025 年媒体报道
            - 证明能触达客户，不证明当前留存
        - label: 评论网站客户
          values:
            - 规模与行业混合
            - 中：第一人称评论
            - 中：ROI、留存、归因和支持轶事
            - 2026 年新近评论
            - 有用的满意度代理指标；样本偏差风险
    approximationNotes: 各行评估公开证据质量，不评估客户信用质量或 ARR 贡献。
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU015
      - CU019
      - CU020
