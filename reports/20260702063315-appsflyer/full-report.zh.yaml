      - number: '6.5'
        title: 扩张和集中度风险
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer 的扩张动作可以成立为先落地、再扩张：客户先从移动衡量起步，再加入反欺诈和 OneLink 深度链接，扩展到 Web、CTV、PC / 主机、增量衡量、受众、数据洁净室，随后在营销栈更自主时消费
              AI 辅助或智能体工作流。这很重要，因为 2026 年战略投资叙事明确把衡量与 AI
              时代更丰富的信号连接起来，解决方案页面也推广面向高价值企业场景的第一方数据协作、受众激活、零售媒体衡量和隐私保护型分析。集中度风险大多被遮住。Playtika 和 MMP
              品类在游戏中的强势显示，游戏历史上可能很重要；但头部客户 ARR、垂直 ARR 结构、客户数量定义、伙伴渠道依赖、代理商转售依赖和围墙花园暴露都未披露。2026 年 3 月 Web SDK
              被攻破是另一项耐久性风险，因为客户嵌入第三方衡量脚本后，即使自身代码不变，也可能暴露。TU005 汇总扩张驱动、集中度风险、影响和尽调路径。
