        title: 受证据约束的市场规模口径
        blocks:
          - type: paragraph
            body: >-
              最干净的公开 MMP 规模口径很窄，也不大：一个分析页面报告 2024 年为 $284 million、2025 年为 $320 million， 到 2032 年达 $639 million，CAGR 为
              12.5%；另一个页面报告到 2031 年为 $518 million，CAGR 为 7.1%。 这些预测不能互换，而且与 AppsFlyer 单独在 2025-2026 年可能已产生约 $400-$500
              million 收入或 ARR 的报道并列时显得别扭。 最合理的调和是：AppsFlyer 收入包含狭义 MMP 之外的更广义营销云、分析、数据协作、反欺诈、深度链接和 AI 工作流模块；
              或者公开市场页面低估了这个类别。尽调中，TAM 因此应按层展示：核心 MMP 软件、更广义的移动归因与分析软件，以及规模大得多、 能创造需求但不是可服务收入的移动广告支出池。TM002
