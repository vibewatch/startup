      - number: '1.4'
        title: 规模、里程碑与外部验证
        blocks:
          - type: paragraph
            body: >-
              公开规模指标混合了公司披露和第三方估计，统计时点并不总一致。Wikipedia 2026 年信息框列示 AppsFlyer 员工约 1,500 人，分布在 20 多个全球办公室，包括 San
              Francisco、New York、London、Berlin、Kyiv、Bengaluru、Tokyo； Times of Israel 关于 2025 年裁员的报道则称裁员前约有 1,400 名员工、20
              个办公室，随后削减 100 个岗位（约员工的 7%）。公司未在公开材料中解释这一差异。AppsFlyer 在 2026 年 6 月公告中称服务全球 15,000+ 品牌客户，高于 2020 Series D
              时披露的 12,000+ 客户和 5,000+ 技术伙伴；2020 Series D 材料还称，2019 年客户通过平台作出了价值 $28 billion 的营销决策。Times of Israel 报道
              AppsFlyer 2025 年年收入约 $400 million；作为没有公开财务申报的私营公司， 这一数字和员工数、总融资一样，来自公司陈述或独立媒体估计，而非审计财报。

              里程碑包括 2018 年 5 月收购 Yodas 开发团队，以及 2023 年末一个月内完成的两笔收购：11 月收购 Devtodev （游戏与应用分析），12 月收购 oolo（基于 AI 的用户获取与变现，其
              15 名员工全部加入 AppsFlyer）。公司也获得过行业认可， 包括 2019 Pocket Gamer Mobile Games Award 最佳分析与数据工具奖、2022 MarTech
              Breakthrough Award 年度移动营销公司、 2023 年多项奖项（Frost & Sullivan、Ventana Research，以及 AWS Partner of the Year），并截至
              2025 年五次入选 Forbes Cloud 100。MobileAction 2026 年对 MMP 的独立市场比较，将 AppsFlyer 与 Adjust、 Singular、Branch、Kochava
              一起列为领先的 Google Play 认证 MMP，并称其为该类别的「市场领导者」。
