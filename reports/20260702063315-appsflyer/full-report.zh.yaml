      - number: '7.3'
        title: 运营、质量和安全风险
        blocks:
          - type: paragraph
            body: >-
              运营风险集中在客户端代码分发、安全控制和重组后的执行能力。Web SDK 被攻破说明，第三方营销脚本即便在供应商核心云没有被入侵时，也可能作为供应链基础设施失效：cside 描述了注册商层面的 DNS 劫持、静默
              SDK 降级、多态载荷、fetch 替换、DOM 监控和外泄端点。Feroot 和 Reflectiz
              强调，客户网站无需本地代码变更就可能投放恶意代码，而普通允许列表、WAF、防火墙和端点代理很难看到这些行为。若 AppsFlyer
              已完全迁移干净构建、收紧注册商控制并审计客户影响，缓释成熟度在改善，但公开证据尚未端到端证明这些动作。TR002 对这些运营模式排序，包括裁员和设施复杂度；FR002
