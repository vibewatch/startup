      - number: '8.5'
        title: 可比公司、退出准备度、尽调问题和打破论点触发器
        blocks:
          - type: paragraph
            body: >-
              可比公司集合更能支撑纪律，而不是精确性。AppLovin 是有用的公开广告技术参考，因为它已规模化、上市且拥有 Adjust，但它不是干净的 MMP 倍数，因为其广告网络经济性和公开市场流动性不同于
              AppsFlyer 的私有 SaaS 衡量模型。Adjust、Branch、Kochava 和 Singular 定义了直接 MMP 与营销衡量同行集，但它们的私有指标大多不可得。因此，媒体报道的 $3.5B 至
              $4.5B 私募股权收购兴趣，比完全可观察的交易可比更能作为退出准备度信号；IPO 路径则在 S-1、经审计指标和市场时点可见前仍是可选项。TV004 将可比表标为部分枚举，TV005
              把下行转成终止标准，TV006 列出最终尽调问题。退出判断是有条件的：M&A 兴趣提供下行支撑，IPO 能创造上行，但前提是财务披露和安全信任足以经受上市公司或财务赞助方审查。
