  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与商业模式
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer 是一家 SaaS 公司，提供营销衡量、归因、深度链接、数据协作和分析工具， 现在以 Modern Marketing Cloud 对外营销。公司由 CEO Oren Kaniel 和 CTO
              Reshef Mann 于 2011 年在以色列创立，早期曾参加 Microsoft Ventures Accelerator 项目。全球总部位于 旧金山 SoMa 区 100 First Street；2017
              Series C 之后原办公室不够用，公司于 2018 年 2 月 启用这处 11,000 平方英尺办公室。AppsFlyer 仍在以色列 Herzliya 和 Haifa 保留主要运营，
              这些据点可追溯到公司创立时期。

              核心商业模式是 SaaS 订阅和按用量计费：营销主、发行商和平台为覆盖移动、Web、CTV、 PC/console 渠道的衡量、归因、深度链接、反欺诈和 AI 驱动分析产品付费。2025 年 11 月，
              公司宣布从移动归因先行者演进为更广义的 Modern Marketing Cloud，将口径扩展到统一全渠道衡量、 数据协作和 AI 驱动营销。其自有材料把使命表述为交付「AI
              驱动、隐私优先的衡量技术，把数据变成增长机会」， 但没有披露具体收入、利润或独立财务指标。AppsFlyer 的伙伴营销称，「每 3 家 Fortune 500 公司就有 1 家」 使用其平台，总服务公司超过
              80,000 家；不过这是公司口径，本章审阅的来源没有独立佐证。
