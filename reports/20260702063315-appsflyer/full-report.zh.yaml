      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Oren Kaniel 自 2011 年创立 AppsFlyer 起一直担任 CEO 和联合创始人，经历 2020 Series D、 2025 年裁员、2026 年 3 月安全事件和 2026 年 6
              月投资轮；这是一段 15 年任期，公开材料中没有披露接班计划或 联席 CEO 安排。截至 2026 年，联合创始人 Reshef Mann 仍在公司现任领导材料中列为 CTO。其他具名的 2026 年高管包括
              Gal Ekstein（首席商务官）、Nachum Falek（首席财务官）、Oren Levy（首席战略官）、 Barak Witkowski（首席产品官）和 Ziv Peled（首席 AI 官）；单设首席
              AI 官，反映公司称正战略转向智能体 AI 和 AI 驱动衡量产品。

              本章审阅的 AppsFlyer 官方与投资人材料没有发布完整董事会名单或治理章程，只披露了与特定融资事件绑定的个别董事任命。 2020 年 1 月，General Atlantic 的 Alex
              Crisses（董事总经理）和 Anton Levy（联席总裁兼全球技术负责人） 因 Series D 加入 AppsFlyer 董事会；Calcalist 2026 年报道显示 General Atlantic
              仍保留董事会席位。 关键人物集中度很高：Kaniel 是所有已披露融资事件、2025 年重组，以及公司公开回应 2026 年 3 月安全事件时的唯一 CEO。任何在潜在 IPO
              前评估该公司的投资人或收购方，都要把这视为实质性的连续性风险。
