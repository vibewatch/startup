      - number: '1.3'
        title: 融资历史、所有权与估值
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer 的融资历史包括五轮定价融资。2014 年，公司从 Pitango Venture Capital 和 Magma Venture Partners 获得 $7.1 million Series
              A；2015 年 1 月，由 Fidelity Growth Partners Europe（现 Eight Roads Ventures） 领投 $20 million Series B，使总融资达到 $28
              million；2017 年 1 月，由 Qumra Capital 领投 $56 million Series C，Goldman Sachs Private Capital
              Investing、Deutsche Telekom Capital Partners 和 Pitango Growth 参投，当时其 SDK 已安装在超过 2.5 billion 台独立设备上。2020 年 1
              月，AppsFlyer 以 $1.6 billion 估值完成由 General Atlantic 领投的 $210 million Series D；按公司公告，它成为归因类别的首个独角兽，老股东 Qumra
              Capital、 Goldman Sachs Growth、DTCP、Pitango Venture Capital 和 Magma Venture Partners 也参与了该轮。

              2026 年 6 月，AppsFlyer 宣布已签署最终协议，Google、Meta、Unity、Moloco 将按 $2.7 billion 投后估值投资超过 $1 billion，高于 2020 轮后的 $2
              billion 水平。公司称每个 2026 年投资方持股均为少数、非控股、非排他， 不在 API、衡量信号、归因逻辑或商业条款上享有优先待遇，客户也保留对衡量伙伴的完全选择权。Calcalist 报道称，
              2026 年资金中很大一部分通过老股转让完成；General Atlantic 作为 2020 年以来最大的机构股东，估计持股 15%-20%；若干现有投资人在该交易中出售了大量或全部持仓。Goldman
              Sachs 担任 AppsFlyer 2026 年交易的独家财务顾问， Meitar 与 Latham & Watkins 担任法律顾问。汇总已披露轮次，截至 2020 Series D 的定价股权融资总额约为
              $294-300 million；媒体对 2026 年轮次的报道则把累计融资（含老股转让）表述为超过 $1.3 billion，但没有单一审计来源逐项列明每一美元。 Times of Israel
              另行报道，AppsFlyer 在 2025 年裁员的同时，正与 Goldman Sachs、JPMorgan、Bank of America 合作探索美国 IPO，目标募资约 $300 million，报道引用了
              Bloomberg 消息。
