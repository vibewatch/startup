      - number: '1.6'
        title: 图表
        blocks:
          - type: callout
            title: 2026 年三方投资表明生态系统广泛依赖独立衡量
            body: >-
              Google、Meta、Unity、Moloco 分别按 $2.7 billion 估值取得少数、非控股权益，是一个强信号：即使 AI 正在重塑广告购买，
              大型广告与平台玩家仍认为中立第三方衡量层有持续价值。该结构明确否认任何投资人可优先访问 AppsFlyer 的 API、信号或商业条款； 只要实际履行，就能保住 AppsFlyer
              自早期融资以来一直倚重的独立性主张。
            calloutType: strength
            claimRefs:
              - CO022
              - CO023
              - CO029
          - type: callout
            title: 可能 IPO 之前，收入、员工数与股权结构仍未披露
            body: >-
              AppsFlyer 没有公开申报，仍是私营公司，因此不披露审计收入、EBITDA 或精确持股比例；媒体估计的约 $400 million 收入和约 1,500 名员工，也没有与早期公司披露数字对齐。鉴于报道中的
              IPO 准备涉及 Goldman Sachs、JPMorgan、Bank of America， 任何尽调都应先直接向公司索取完整财务数据室、股权结构表和董事会治理资料，再下估值结论。
            calloutType: risk
            claimRefs:
              - CO013
              - CO027
              - CO030
              - CO031
          - type: callout
            title: 2026 年 3 月域名注册商攻击显示应用层之外的安全边界缺口
            body: >-
              2026 年 3 月事件并非 AppsFlyer 自有应用代码或客户数据环境被攻破，而是域名注册商账户被攻破，让攻击者将 Web SDK 的内容分发域重定向约 14 小时。由于 Web SDK 估计被
              15,000+ 企业和 100,000+ 应用加载，该事件说明：供应商自有基础设施之外，只要一个第三方信任边界失守， 就可能让极大的下游客户群暴露在加密货币盗窃载荷之下。
            calloutType: risk
            claimRefs:
              - CO037
              - CO038
              - CO041
          - type: callout
            title: 15 年创始人 CEO 连续任职是优势，也把关键人物风险集中到 IPO 窗口
            body: >-
              Oren Kaniel 自 2011 年以来一直担任 CEO，贯穿每一次重大融资、收购和危机响应决策，包括 2025 年重组和 2026 年 3 月事件响应； Times of Israel
              报道也显示，AppsFlyer 正与 Goldman Sachs、JPMorgan、Bank of America 积极探索 IPO。这一组合奖励连续性，
              却也让公司在机构和公开市场审查即将加强的时点，异常暴露于单一高管风险。
