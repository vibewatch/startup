            body: >-
              应把 AppsFlyer 的成本结构按数据基础设施 SaaS 模型承销，其中产品、云、隐私、安全、伙伴集成和客户成功义务都很重。公开来源没有披露毛利率、 云成本、支持成本、R&D
              资本化或销售与营销效率，但公司承认过去投入隐私增强技术和生态支持，压缩了利润率并造成运营低效。 公司把 2025 年裁员表述为效率和 AI
              投资动作，而非流动性危机；独立报道也称公司现金流为正并实现盈利。这个组合支持健康 SaaS 利润率路径的可能性， 但不能证明 AppsFlyer 本身有 70-85% 毛利率区间。投资人应只把 SaaS
              基准当作情景假设，然后尽调基础设施 COGS、企业集成带来的支持负担、 2026 年 Web SDK 事件后的响应成本，以及新 AI 产品的利润贡献。
