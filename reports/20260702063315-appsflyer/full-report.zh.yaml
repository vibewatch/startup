  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >-
              研判 AppsFlyer 的客户群，应把它看成跨细分市场的营销衡量平台，而不是单一移动 App 垂直。付费方通常是营销、增长、用户获取、分析或代理商团队；使用者是营销活动经理、效果营销人员、CRM
              运营、产品分析师，偶尔也包括安全或合规利益相关方；经济决策人通常对付费媒体 ROI、获客成本和生命周期价值负责。官方资料把平台覆盖到从创业公司到全球品牌，并在多个解决方案页面声称每 3 家 Fortune 500
              公司有 1 家使用、服务 80,000+ 家公司；2026 年投资公告则采用更窄、也更可辩护的 15,000+
              品牌客户口径。最强的垂直证据在游戏、电商与购物、金融与金融科技、娱乐与流媒体、代理商；这些细分直接对应移动归因、Web 到 App 深度链接、CTV 衡量、反欺诈、受众、数据洁净室和 AI
              辅助分析等场景。TU001 拆分买方 / 使用者 / 付费方、用例广度、规模证据、收入价值和尽调缺口；FU001 展示这些细分如何从衡量痛点走向部署与扩张。
