      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的结构性驱动因素是隐私带来的复杂度：ATT、IDFA 稀缺、SKAdNetwork 和围墙花园限制，让确定性的用户级归因更难， 也提高了能组合同意标识符、聚合
              postback、概率建模、增量衡量和媒体组合衡量的工具价值。第二个驱动因素是支出碎片化： 营销主需要一套横跨 Meta、Google、TikTok、Apple Search Ads、CTV
              和新兴渠道的中立视图。第三个驱动因素是 AI 驱动优化， 因为自动出价智能体需要可信信号，而不是平台自利的报告。约束同样重要。买方担心成本、SDK 疲劳、工程投入、报告复杂度， 也担心第三方脚本或 SDK
              是否增加安全与隐私暴露。公开客户评价肯定归因和集成，也提到价格、复杂度和支持延迟； 2026 年 JavaScript SDK 事件则成为信任尽调事项，可能拖慢受监管垂直领域的采购。
