  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              尽调边界应从 AppsFlyer 被买来完成的任务开始：为应用和全渠道营销主提供独立衡量、归因、反欺诈、深度链接和隐私安全优化，
              而不是把整个总媒体市场都纳入。移动广告支出、联网电视效果媒体和营销分析都是需求池，但不全是 MMP 厂商可获得的收入。
              应纳入的软件支出，是支付给衡量平台的订阅、用量和转化挂钩费用；应排除的支出包括媒体采买、代理费、应用商店费用、云托管和内部营销人员成本。
              现状替代方案很重要，因为买方可以继续使用平台仪表盘、电子表格、Google/Firebase 式分析、自归因网络报告或自建数据仓库。 AppsFlyer 自称 Modern Marketing
              Cloud，确实扩大了相邻空间；但市场定义表仍把核心 MMP 层与更广义分析分开， 避免估值时把媒体支出误资本化为软件收入。
            claimRefs:
