      - number: '7.6'
        title: 图表
        blocks:
          - type: callout
            title: 最高残余风险：信任层 SDK 被攻破
            body: 即使根因是注册商 / DNS 而非 AppsFlyer 云基础设施，面向客户的失效模式仍是受信任的 AppsFlyer 端点投放恶意代码。
