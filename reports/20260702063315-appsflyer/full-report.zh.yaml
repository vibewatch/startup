      - number: '8.2'
        title: 建议、置信度、风险评级和决策立场
        blocks:
          - type: paragraph
            body: >-
              推荐结论是谨慎正面 / 有条件，相当于只在投资者能以接近 2026 年 $2.7B
              标记进入、并获得公司层面的整改、财务质量和优先权结构证明时，才跟踪到买入。置信度为中等，因为公开记录在融资、产品、市场和事件证据上丰富，但决定估值质量的指标很薄：经审计收入、ARR
              桥接、毛利率、NRR、流失、客户集中度、现金、一级融资所得以及事件后队列表现。风险为中高，因为受信任 SDK 分发事件、平台信号依赖、战略投资者冲突观感和 IPO
              窗口不确定性，都能直接传导到留存和退出倍数。$2.7B 估值不是便宜，而是公允偏满。TV001 给出的决策含义是：只有带价格保护、违约 / 整改契约、完整财务披露和清晰退出路径时才继续；FV001
              可视化了从业务根基强度、下行闸门到有条件建议的逻辑。
