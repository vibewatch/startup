  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合比移动归因厂商名单更宽。直接 MMP 同行包括 Adjust、Branch、Kochava、Singular，以及来源市场清单中的较小替代者， 如
              Tenjin、Airbridge、ByteBrew、Firebase、Trackier、RevenueCat、Affise。存量压力来自 AppLovin 对 Adjust 的所有权， 也来自
              Apple、Google、Meta、TikTok、Unity 等平台所有者；它们的隐私规则或自归因数据决定任何独立 MMP 能看到多少信号。 相邻替代方案包括 MMM、洁净室、成本聚合、ASO /
              搜索自动化和内部数据工程栈。当买方想要一个跨许多伙伴的中立第三方层， 而不是依赖某一家媒体卖方自己的报告时，AppsFlyer 的差异化最强。因此，格局地图把中立性和全渠道广度作为两条独立轴线，
              因为规模化广告平台可以有强分发，却未必是可信裁判。FP001 呈现了这种张力，也说明为什么默认现状仍是平台仪表盘加电子表格的多家并用。
