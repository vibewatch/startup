  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Scaled enterprise product with real customer proof in a growing skills market
    - Need current retention, runway, and valuation evidence to upgrade conviction
  - - Opaque financials and stale financing make the business hard to price
    - Fresh financing, cap-table clarity, and durable renewal metrics would reduce the discount
  - - Bundling and content commoditization threaten pricing power
    - Proof that customers pay a durable premium for Degreed's skills layer would help
  - - Regulatory and governance overhangs sit behind the public curtain
    - AI-governance, bias testing, and management clarity would reduce execution risk
  notes: The recommendation only changes if price and evidence move together, not if one improves without
    the other.
