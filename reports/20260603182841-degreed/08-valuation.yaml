  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - AI and mobility expansion deepen platform value; later-round terms are disciplined; retention is
      strong
    - Premium multiple survives relative to HR-tech peers
    - Execution and regulation still matter
    - Requires several currently missing facts
  - - Base
    - Company is solid but slower-growing; disclosure remains incomplete; valuation anchored by reset
      SaaS market
    - Mid-single-digit to low-double-digit ARR logic at best
    - Opaque runway and retention keep discount intact
    - Most consistent with public evidence
  - - Bear
    - Bundling, regulation, or runway pressure compress strategic value
    - Down-round or weak financing outcomes possible
    - Customer durability and financing become core issues
    - Would be triggered by adverse diligence findings
  notes: Scenario table is qualitative because the public record does not support precise ownership-adjusted
    return math.
