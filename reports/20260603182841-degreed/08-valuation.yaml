    - Public enterprise learning platform
    - Public market valuation dynamic
    - Closest software peer
    - Still not identical to Degreed
  - - Coursera
    - Content + platform at public scale
    - Public market valuation dynamic
    - Useful scale and content reference
    - Different business mix
  - - Skillsoft
    - Legacy public learning-tech company
    - Turnaround / restructuring context
    - Useful downside or maturity context
    - Not a premium-growth comp
  - - Generic SaaS / HR-tech multiples
    - ARR or revenue multiple commentary
    - 3.8x index low to AI-premium pockets
    - Sets environment for private pricing
    - Not company-specific
  notes: Comparables are used to bound the market conversation, not to produce a faux-precision fair value.
