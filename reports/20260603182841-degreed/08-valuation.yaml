sections:
- id: thesis-antithesis
  title: Investment thesis and anti-thesis
  body: 'The case for Degreed is real. The company sits in a credible enterprise software category, appears
    to have genuine product depth beyond content discovery, and has enough named enterprise proof to deserve
    serious attention. The anti-thesis is equally real: in 2026 a good company is not automatically a
    good investment, especially when the public record leaves valuation-critical issues unresolved. Degreed
    could be a durable late-stage platform with meaningful upside from AI and mobility workflows. It could
    also be a solid but ordinary enterprise software company whose last confirmed valuation came from
    a much hotter market and whose current disclosure is too sparse to justify aggressive pricing. This
    is why the recommendation cannot be derived from “quality vibes.” It has to be derived from what is
    actually knowable. Public evidence supports the existence of a real business. It does not support
    a clean underwriting model yet.'
  claimRefs:
  - CV040
  - CV041
  - CV021
  - CV022
  - CV039
  tableRefs:
  - TV002
  figureRefs:
  - FV001
- id: valuation-context
  title: Valuation context and comparable set
  body: The valuation context is shaped by three facts. First, the last confirmed anchor is the 2021 $1.4
    billion Series D. Second, third-party data points to around $100 million ARR in 2025. Third, 2026
    software multiples are much lower than 2021 and reward only a subset of AI-labeled software companies
    with clear durability. That means the simple combination of “AI narrative + enterprise customers”
    is not enough to justify paying a historical premium multiple. Public comps help, but only imperfectly.
    Docebo is the closest software comp; Coursera helps bracket scale and content overlap; Skillsoft helps
    frame maturity and downside; and broader multiple sources define the market backdrop. None of these
    produce a precise fair value by themselves. What they do produce is a clear warning against casual
    optimism. On public evidence alone, Degreed should be priced with a meaningful discount for opacity
    and only a measured premium for strategic relevance.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  - CV010
  - CV034
  tableRefs:
  - TV004
  figureRefs:
  - FV003
- id: scenarios-and-discipline
  title: Scenarios, sensitivity, and entry discipline
  body: 'The bull, base, and bear cases are best understood as evidence scenarios rather than spreadsheet
    outputs. The bull case needs proof that Degreed is both durable and still growing into adjacent workflows
    at economics that justify a premium. The base case assumes the company is solid but not sufficiently
    transparent, which means a mid-range valuation logic at best and a research-more posture. The bear
    case is not “the company disappears”; it is that bundling, regulation, or financing pressure compresses
    strategic value and forces a downshift in price or ambition. Sensitivity is highest to three variables:
    current valuation / cap table, retention quality, and runway. Those are exactly the variables the
    public record does not resolve. That is why entry discipline matters so much. An investor should either
    insist on a valuation that already discounts these unknowns, or insist on evidence that closes them.
    Paying first and verifying later is not justified by the current evidence set.'
  claimRefs:
  - CV018
  - CV019
  - CV020
  - CV029
  - CV030
  - CV032
  - CV035
  tableRefs:
  - TV003
  figureRefs:
  - FV002
- id: final-recommendation
  title: Final recommendation and decision rules
  body: 'The final recommendation is research-more with medium confidence, high risk rating, and a stretched
    valuation stance. That is a disciplined middle ground, not indecision. Degreed is too substantial
    for an avoid call based on public evidence alone: the market exists, the product is mature, and the
    customer proof is credible. But the company is also too opaque for a buy recommendation when the most
    important valuation and downside variables—runway, retention, concentration, cap table, and current
    pricing of the asset—are all still behind the curtain. In practical terms, the investment decision
    should hinge on a short list of diligence asks and explicit kill triggers. If management can close
    the evidence gaps cleanly and the price reflects residual uncertainty, the case can improve materially.
    If not, the right move is patience. That is the correct end-state for a diligence report: not generic
    enthusiasm, but a clear statement of what would need to be true for capital to go in with conviction.'
  claimRefs:
  - CV025
  - CV026
  - CV027
  - CV028
  - CV036
  - CV042
  tableRefs:
  - TV001
  - TV005
  - TV006
  figureRefs:
  - FV004
