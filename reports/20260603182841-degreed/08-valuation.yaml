chapter:
  number: 8
  title: Valuation
  summary: 'Degreed has enough market relevance, product depth, and customer proof to merit serious diligence,
    but the public evidence does not support paying an aggressive AI-premium price without fresh financing,
    retention, and runway data. The last confirmed valuation is the April 2021 $1.4 billion Series D,
    while third-party data points to roughly $100 million ARR in 2025—numbers that would look rich against
    most 2026 SaaS and HR-tech multiple benchmarks if treated literally. The correct investment posture
    is therefore price-sensitive and evidence-sensitive: continue diligence and engage only at a discount
    or after management closes the biggest evidence gaps.'
