- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Weak-term financing round
    - Unexpected capital raise at down or flat terms
    - Undercuts financial resilience thesis
    - Re-underwrite downside immediately
  - - AI fairness / privacy issue
    - Enforcement or serious customer workflow issue
    - Undercuts trust and growth thesis
    - Pause investment process
  - - Flagship customer loss
    - Major churn or negative renewal signal
    - Undercuts customer-durability thesis
    - Reassess market and product quality
  - - Reliability / security incident
    - Material outage or breach
    - Undercuts trust and implementation thesis
    - Reassess risk rating and valuation
  - - Management clarity remains weak
    - No clean current leadership picture in diligence
    - Undercuts governance confidence
    - Maintain or widen discount
  notes: Kill triggers convert the recommendation from abstract caution into monitorable decision rules.
  claimRefs:
  - CV032
  - CV031
  - CV033
  - CV027
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Runway and cash
    - Cash balance, burn, runway, debt
    - Controls financing risk and downside
    - Finance diligence with management
  - - Retention and concentration
    - NRR, churn, top-customer share
    - Controls revenue durability and downside
    - Customer / finance diligence
  - - Current valuation and cap table
    - Any later round, current share count, preference stack
    - Controls entry price and return math
    - Legal / finance diligence
  - - AI governance and fairness
    - Bias testing, use-case restrictions, documentation
    - Controls regulatory and reputational risk
    - Product / legal diligence
  - - Management clarity
    - Current CEO, bench depth, succession picture
    - Controls execution confidence
    - Management reference and org-chart review
  notes: These are the smallest set of asks most likely to move the investment decision materially.
  claimRefs:
  - CV036
  - CV029
  - CV030
