sections:
- id: market-boundary
  title: Market boundary and category definition
  body: 'The most useful way to frame Degreed''s market is not “all learning” or “all edtech,” but the
    narrower enterprise software layer that connects learning content, role context, skills data, and
    workforce development workflows. Public category labels remain messy: legacy LMS vendors talk about
    content delivery and workforce readiness, HCM suites package learning inside broader HR platforms,
    and content libraries increasingly add pathways and AI tools. That means Degreed is selling into a
    market with blurry edges by design. The correct diligence move is to define included spend explicitly.
    Included spend covers enterprise subscriptions for learning orchestration, personalization, skill
    mapping, pathwaying, and related workflow automation. Excluded spend covers general education, pure
    content production, and training programs that do not depend on a software layer. This framing matters
    because it prevents the report from inflating Degreed''s addressable market with unrelated education
    or services spend while still recognizing adjacent substitutes such as LMS products, suite-native
    learning modules, and internal-build approaches.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM028
  - CM035
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: market-sizing
  title: Sizing lenses and growth profile
  body: Public market data is clearly supportive on growth, but not clean enough to justify a single definitive
    TAM number. Mordor Intelligence puts the LXP market at $3.25 billion in 2025, $3.76 billion in 2026,
    and $8.35 billion by 2031, implying 17.3% CAGR over 2026-2031. Technavio offers a smaller 2025 base
    of $1.72 billion but a faster 25.1% CAGR through 2030, while also highlighting North America as 34.1%
    of incremental growth and the cloud deployment segment at $773.4 million in 2024. The divergence should
    not be hand-waved away; it reflects real methodology differences, including what each publisher counts
    as LXP software versus adjacent content or talent-tech spend. For diligence purposes, the key conclusion
    is not the exact midpoint between the reports. It is that Degreed is exposed to a fast-growing enterprise
    category with enough scale to matter, but one where valuation work must use evidence-constrained market
    logic rather than a single glossy TAM slide.
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM016
  tableRefs:
  - TM002
  figureRefs:
  - FM002
- id: buyers-and-adoption
  title: Buyer, user, payer, and adoption path
  body: 'Category demand is driven by real organizational pain, but purchase and deployment are multi-stakeholder.
    The natural buyer is usually the learning, talent, or HR organization, while users span employees,
    managers, and talent teams. Payers vary: some deals sit squarely in L&D budgets, others in HRIT modernization,
    and some in broader AI-transformation programs. That complexity explains why best-fit customers tend
    to be large enterprises with fragmented content estates, inconsistent role architecture, and a genuine
    need to connect learning to business capability gaps. Deployment also matters. A dedicated platform
    like Degreed typically has to integrate with HRIS, content providers, identity systems, and sometimes
    suite-native tools before it can deliver credible personalization or skills visibility. That means
    category attractiveness comes with implementation friction. In practice, a buyer is not comparing
    only “Degreed versus another LXP”; it is often comparing best-of-breed software versus making do with
    the incumbent suite, the existing LMS, or a hybrid stack stitched together internally.'
  claimRefs:
  - CM023
  - CM024
  - CM025
  - CM026
  - CM027
  - CM028
  - CM033
  tableRefs:
  - TM003
  figureRefs:
  - FM003
  - FM004
- id: drivers-constraints
  title: Growth drivers, constraints, and market implications
  body: 'The tailwinds behind this market are strong and current. Microsoft, the World Economic Forum,
    Coursera, Udemy, and Degreed itself all point to the same macro theme: AI is changing work fast enough
    that employers need continuous reskilling, not periodic training refreshes. At the same time, the
    evidence also shows why adoption is not automatic. Buyers need to trust the skills-data layer, clear
    integration hurdles, and prove business impact rather than just engagement. Dedicated LXP vendors
    also face a structural threat from suites and productivity platforms that can bundle learning into
    broader workflow products, making vendor-count reduction part of the buying calculus. This is why
    the market should be treated as attractive but not frictionless. Degreed benefits from real demand
    drivers—AI fluency, human-skills development, personalization, and internal mobility—but it competes
    in a category where the best buyer problems are valuable precisely because they are operationally
    hard to solve. Later chapters should therefore treat market growth as supportive context, not as a
    substitute for customer, product, or valuation proof.'
  claimRefs:
  - CM017
  - CM018
  - CM019
  - CM020
  - CM021
  - CM022
  - CM029
  - CM030
  - CM031
  - CM032
  - CM036
  - CM037
