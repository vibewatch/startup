  evidenceGaps:
  - type: missing-source
    severity: material
    topic: som-estimate
    missingEvidence: Customer-count, win-rate, and segment-share data sufficient to estimate Degreed's
      realistic serviceable obtainable market.
    whyItMatters: Without SOM evidence, TAM claims stay strategically interesting but not valuation-grade.
    diligencePath: Request segment-level customer distribution, average contract size by buyer type, and
      win/loss data.
    relatedQuestionRefs:
    - QM022
  - type: stale
    severity: minor
    topic: regional-sam
    missingEvidence: A region-by-region SAM for skills platforms, especially North America versus Europe.
    whyItMatters: North America is clearly important, but a company-specific regional revenue lens is
      missing.
    diligencePath: Ask management for regional ARR mix and expansion priorities.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: buyer-conversion
    missingEvidence: Pipeline conversion and sales-cycle data by buyer type and deployment pattern.
    whyItMatters: The category may be large, but adoption friction matters more than abstract TAM in enterprise
