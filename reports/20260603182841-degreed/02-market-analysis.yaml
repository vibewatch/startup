  title: Market Analysis
  summary: Degreed sits inside the enterprise learning experience platform and skills-intelligence market,
    a category that is expanding as companies shift from static compliance learning toward AI-enabled
    workforce capability systems. Public market lenses diverge materially on size because some publishers
    scope only LXP software while others blend broader workforce transformation spend, but both Mordor
    Intelligence and Technavio point to a fast-growing market with North America as the key profit pool.
    The practical takeaway is that Degreed sells into a large but still definition-fragmented market where
    budget ownership spans L&D, HR, and business transformation teams.
