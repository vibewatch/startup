sections:
- id: revenue-model
  title: Revenue model and public topline evidence
  body: Public evidence supports the conclusion that Degreed is a real enterprise software business, but
    only weakly supports the details of how the economics actually work. Company materials show a platform
    sold into large enterprises, not a consumer or self-serve model. That strongly suggests enterprise
    subscription revenue as the core stream, likely layered with implementation and integration services
    for complex deployments. The only clean public topline datapoint in the fetched set is GetLatka's
    roughly $100 million ARR or revenue figure for late 2025, which should be treated as directional rather
    than audited. That is enough to establish that Degreed is not an early-stage company. It is not enough
    to establish revenue quality. The absence of public customer count, contract length, retention, or
    mix data means the topline cannot yet be translated into a durable value-creation profile. This chapter
    therefore treats ARR as a scale marker, not as a complete underwriting fact.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI011
  - CI012
  - CI025
  - CI024
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: unit-economics
  title: Unit economics and efficiency proxies
  body: 'The best public efficiency proxy available is a simple one: if GetLatka''s figures are directionally
    right, Degreed sits around $177,000 of ARR per employee. That is a useful framing device, but it should
    not be over-read. ARR per employee without gross margin, services mix, burn, or retention can mislead.
    A software company can look efficient at the topline while still carrying heavy implementation costs,
    customer-success load, or R&D intensity. The fetched source set does not reveal gross margin, CAC,
    payback, NRR, or free cash flow. It also does not reveal whether Degreed is running a lean, profitable
    software model or a more services-intensive enterprise-change model. What public comparables do show
    is that the market now rewards efficiency more than narrative. That is why the unit-economics read
    must remain provisional: the company has enough scale to deserve serious diligence, but not enough
    disclosure to deserve confident unit-economics claims from public materials alone.'
  claimRefs:
  - CI004
  - CI005
  - CI009
  - CI010
  - CI035
  - CI026
  - CI030
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: capital-and-market-context
  title: Capital adequacy and public-market context
  body: 'The last confirmed capital datapoint is still the April 2021 Series D at a $1.4 billion valuation.
    That is valuable as history, but dangerous if treated as current value. Software multiple sources
    repeatedly stress that the 2021 market no longer exists. L40 tracks a sharp collapse in ARR multiples
    from the 2021 peak, while broader 2026 multiple commentary emphasizes dispersion, selectivity, and
    a premium only for truly durable AI software. Public comps reinforce the same message. Coursera is
    already operating at nearly $200 million of quarterly revenue and still trades in a sober public market.
    Docebo demonstrates that a direct learning-software peer can reach meaningful public-company scale.
    Skillsoft shows how unforgiving the market is to weaker or older models. The central implication for
    Degreed is simple: absent proof of a later financing round, cash balance, or runway, the company must
    be analyzed as a scaled private SaaS asset facing a much tighter funding market than the one in which
    its last confirmed round was priced.'
  claimRefs:
  - CI006
  - CI007
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  - CI023
  - CI032
  tableRefs:
  - TI004
  figureRefs:
  - FI003
  - FI004
- id: financial-verdict
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is not bearish on Degreed''s existence or topline relevance; it is cautious
    on underwriteability. A company at roughly $100 million ARR and 565 employees is clearly beyond the
    venture experiment phase. But the crucial variables that separate a durable compounder from an overcapitalized
    transformation vendor remain private. There is no public runway view, no disclosed margin profile,
    no retention history, no concentration data, and no confirmed later financing after 2021. That combination
    means the right frame for the next step is not to argue over a spreadsheet with invented numbers.
    It is to identify the smallest set of management materials needed to move the judgment. Specifically:
    current cash and burn, subscription-versus-services mix, customer durability metrics, and the true
    post-2021 capitalization table. Until those are available, Degreed should be treated as financially
    credible but financially opaque—a company with real scale and real uncertainty in equal measure.'
  claimRefs:
  - CI028
  - CI029
  - CI034
  - CI031
  - CI036
  - CI037
  tableRefs:
  - TI005
