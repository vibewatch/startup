chapter:
  number: 4
  title: Financials and Unit Economics
  summary: 'Degreed looks like a scaled but still opaque late-stage SaaS business: third-party databases
    point to about $100 million ARR and roughly 565 employees in 2025, but the company does not publicly
    disclose gross margin, burn, cash, or retention. Public learning-tech comparables show buyers will
    pay for enterprise learning software, yet 2026 valuation multiples are far below the 2021 peak and
    public peers now operate in a much harsher efficiency environment. The financial verdict is therefore
    not that Degreed lacks scale; it is that the key underwriting variables remain private, and capital
    adequacy cannot be judged confidently without fresh financing evidence.'
