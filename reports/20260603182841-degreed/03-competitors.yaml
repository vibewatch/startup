chapter:
  number: 3
  title: Competitor Landscape
  summary: Degreed competes in a crowded workforce-learning stack where direct LXP peers, legacy LMS vendors,
    content-led platforms, and HCM suites all attack the same budget from different angles. The sharpest
    peer set is Docebo, 360Learning, and LearnUpon on the software side, but the most important strategic
    threats come from bundled suites such as Microsoft Viva Learning, SAP, and Workday plus content-heavy
    offerings from Coursera and Udemy. Degreed's moat is therefore not just feature breadth; it depends
    on whether buyers continue to value a dedicated skills layer and cross-platform orchestration over
    cheaper bundling or content-centric alternatives.
