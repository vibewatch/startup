sections:
- id: landscape-structure
  title: Landscape structure and direct peers
  body: Degreed's competitor set is broader than a standard one-category software market because buyers
    can solve the same workforce-learning problem through several routes. The direct software peer set
    is Docebo, 360Learning, and LearnUpon. These products compete most cleanly on learning-platform software,
    with different emphases on enterprise breadth, collaboration, and operational simplicity. But legacy
    incumbents such as Cornerstone and Skillsoft still matter because they bring installed bases, content
    libraries, and enterprise familiarity into the evaluation. The competitive landscape therefore needs
    to be segmented into direct peers, legacy incumbents, content-led platforms, and suite-native substitutes
    rather than treated as one flat list. The most strategically relevant peer is Docebo because it combines
    public-company scale with a similar “AI-era workforce” narrative. 360Learning and LearnUpon matter
    more as price and simplicity anchors. Cornerstone and Skillsoft matter because they shape how buyers
    think about migrations from older learning stacks into newer skills-oriented systems.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  - CP006
  - CP014
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: pricing-capabilities
  title: Capabilities, pricing, and software overlap
  body: 'Capability overlap is real, but it is uneven. Dedicated platforms such as Degreed and Docebo
    compete on skills layers, pathwaying, and enterprise orchestration. Content-led competitors such as
    Coursera and Udemy attack from another angle: they make it easy to buy access to broad skill inventory,
    increasingly with AI tools and pathways, and can therefore commoditize the content-discovery layer
    of the buyer problem. Public pricing signals are limited. 360Learning publishes entry pricing at $8
    per user per month, Udemy Business publishes a $30 per user per month team plan, while Docebo and
    many enterprise platforms keep pricing custom. That means list-price comparisons are directionally
    useful but not decisive. The more important question is what the buyer actually needs: a content source,
    a simpler LMS, or a system that becomes the orchestration layer for skills, mobility, and personalized
    development. Degreed can still differentiate on that last point, but only if buyers believe the added
    software layer produces enough value to justify standalone spend.'
  claimRefs:
  - CP012
  - CP013
  - CP015
  - CP016
  - CP017
  - CP019
  - CP031
  - CP032
  - CP035
  tableRefs:
  - TP002
  - TP003
  figureRefs:
  - FP002
- id: distribution-and-lockin
  title: Distribution power, switching costs, and suite pressure
  body: The single biggest strategic threat to Degreed is not a cheaper LXP—it is bundling by platforms
    that already own employee workflow surfaces, identity, and HR data. Microsoft Viva Learning is the
    clearest example because it can ride on top of an existing Microsoft estate. SAP and Workday play
    a similar game when learning is purchased as part of a broader HCM transformation. This matters because
    switching costs in enterprise learning come less from content than from integrations, permissions,
    HR data flows, manager workflows, and the degree to which a platform becomes the operating layer for
    skill and mobility decisions. Dedicated platforms therefore need to outperform suites enough on functionality
    and neutrality to justify another vendor in the stack. Multi-homing is possible on content providers,
    but much harder on the orchestration layer. That dynamic is precisely why Degreed's real moat question
    is not whether it has many features, but whether customers continue to want a vendor-neutral skills
    layer outside any one suite.
  claimRefs:
  - CP009
  - CP010
  - CP011
  - CP020
  - CP021
  - CP022
  - CP023
  - CP024
  - CP027
  - CP026
  figureRefs:
  - FP003
- id: moat-and-implications
  title: Moat durability and implications for the thesis
  body: Degreed's strongest plausible moat is cross-platform orchestration plus a dedicated skills layer
    that sits above content providers and outside any one HCM or productivity suite. That is a valid moat
    candidate, but it is not automatically durable. Buyers could decide that “good enough” suite-native
    learning, paired with content subscriptions, is sufficient. Content vendors could continue to add
    pathwaying and AI tools until the orchestration premium narrows. Public peers such as Docebo also
    show that the software side of the market is competitive and well capitalized. The implication is
    that Degreed should not be underwritten as though it owns a clean category. It should be underwritten
    as a best-of-breed platform competing in a crowded stack where bundling, commoditization, and distribution
    power matter as much as product quality. Later chapters therefore need to test whether customers are
    buying Degreed because it is mission-critical or because it is currently one attractive option among
    many.
  claimRefs:
  - CP028
  - CP029
  - CP030
  - CP031
  - CP032
  - CP033
  - CP036
  - CP037
  tableRefs:
  - TP004
