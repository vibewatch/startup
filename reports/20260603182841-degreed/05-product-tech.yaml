  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: SLA history, uptime metrics, and incident history for the production platform and
      APIs.
    whyItMatters: Enterprise workflow depth only matters if reliability is strong, and the public surface
      does not prove it.
    diligencePath: Request uptime reports, incident history, and API usage metrics.
    relatedQuestionRefs:
    - QE020
  - type: private-evidence-only
    severity: material
    topic: model-performance
    missingEvidence: Measured precision, recall, or recommendation-quality metrics for skills inference
      and AI guidance.
    whyItMatters: Differentiation claims around skills and AI cannot be technically underwritten without
      performance evidence.
    diligencePath: Request offline evaluation metrics, customer validation, and human-review workflows.
    relatedQuestionRefs:
    - QE024
    - QE017
  - type: missing-source
    severity: minor
    topic: implementation-effort
    missingEvidence: Independent implementation-time benchmarks by customer size and use case.
    whyItMatters: Implementation complexity can erase product advantage if deployment is slow or brittle.
    diligencePath: Request deployment case studies and time-to-value benchmarks.
    relatedQuestionRefs:
    - QE019
    - QE018
  - type: private-evidence-only
    severity: material
