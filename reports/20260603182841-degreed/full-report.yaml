  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The case for Degreed is real. The company sits in a credible enterprise software category, appears to have
              genuine product depth beyond content discovery, and has enough named enterprise proof to deserve serious
              attention. The anti-thesis is equally real: in 2026 a good company is not automatically a good investment,
              especially when the public record leaves valuation-critical issues unresolved. Degreed could be a durable
              late-stage platform with meaningful upside from AI and mobility workflows. It could also be a solid but
              ordinary enterprise software company whose last confirmed valuation came from a much hotter market and
              whose current disclosure is too sparse to justify aggressive pricing. This is why the recommendation
              cannot be derived from “quality vibes.” It has to be derived from what is actually knowable. Public
              evidence supports the existence of a real business. It does not support a clean underwriting model yet.
            claimRefs:
              - CV040
