chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Degreed's public materials consistently describe the company as an enterprise learning experience platform
              that now emphasizes skills intelligence and workforce transformation rather than a narrow content-delivery
              tool. The founding narrative is important because it predates the current wave of AI skills marketing:
              Degreed says it was founded in 2012 to recognize learning that happens outside formal degrees, and the
              product has since expanded from aggregation into personalization, skill tracking, and capability planning.
              Public financing and acquisition announcements place the company in Pleasanton, California, and position
              it as a long-lived category pioneer rather than a newly formed AI startup. That longevity matters for
              diligence because it implies a meaningful installed base and product depth, but it also means the market
              will judge Degreed against a decade of execution, not just a current marketing message. The strongest
              current identity read is therefore: late-stage private enterprise LXP with a skills-first operating
              thesis, meaningful ecosystem integrations, and a product narrative increasingly wrapped around AI-enabled
              workforce transformation.
