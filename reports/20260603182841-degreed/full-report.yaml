      - number: '3.4'
        title: Moat durability and implications for the thesis
        blocks:
          - type: paragraph
            body: >-
              Degreed's strongest plausible moat is cross-platform orchestration plus a dedicated skills layer that sits
              above content providers and outside any one HCM or productivity suite. That is a valid moat candidate, but
              it is not automatically durable. Buyers could decide that “good enough” suite-native learning, paired with
              content subscriptions, is sufficient. Content vendors could continue to add pathwaying and AI tools until
              the orchestration premium narrows. Public peers such as Docebo also show that the software side of the
              market is competitive and well capitalized. The implication is that Degreed should not be underwritten as
              though it owns a clean category. It should be underwritten as a best-of-breed platform competing in a
              crowded stack where bundling, commoditization, and distribution power matter as much as product quality.
              Later chapters therefore need to test whether customers are buying Degreed because it is mission-critical
              or because it is currently one attractive option among many.
