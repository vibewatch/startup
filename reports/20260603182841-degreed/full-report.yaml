companyProfile:
  summary: >-
    Degreed was founded in 2012 in Pleasanton, California by David Blake and Eric Sharp to recognize and organize
    learning beyond formal degrees. Over time it evolved into a broader enterprise learning experience and
    skills-intelligence platform that connects plans, pathways, skills inference, workflow automation, and career
    mobility. The company targets large enterprises that want to connect learning to workforce capability planning
    rather than just course delivery. Public evidence supports real scale, customer relevance, and mature platform
    infrastructure, but also leaves important diligence questions on current leadership clarity, post-2021 financing,
    retention, and runway.
