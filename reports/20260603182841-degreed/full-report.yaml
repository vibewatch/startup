        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is not bearish on Degreed's existence or topline relevance; it is cautious on
              underwriteability. A company at roughly $100 million ARR and 565 employees is clearly beyond the venture
              experiment phase. But the crucial variables that separate a durable compounder from an overcapitalized
              transformation vendor remain private. There is no public runway view, no disclosed margin profile, no
              retention history, no concentration data, and no confirmed later financing after 2021. That combination
              means the right frame for the next step is not to argue over a spreadsheet with invented numbers. It is to
              identify the smallest set of management materials needed to move the judgment. Specifically: current cash
              and burn, subscription-versus-services mix, customer durability metrics, and the true post-2021
              capitalization table. Until those are available, Degreed should be treated as financially credible but
              financially opaque—a company with real scale and real uncertainty in equal measure.
            claimRefs:
              - CI028
              - CI029
              - CI034
              - CI031
