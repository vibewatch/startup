      - number: '5.3'
        title: Trust, privacy, and enterprise governance posture
        blocks:
          - type: paragraph
            body: >-
              Degreed presents a comparatively mature public trust posture for a private software vendor. The trust
              center highlights SOC 2 Type 2, ISO 27001, and ISO 9001, and the company pairs those badges with a more
              specific list of security controls including testing, risk assessment, code review, training, and incident
              response planning. The privacy policy and published DPA are also useful because they show the company
              understands the enterprise controller-versus-processor split and the contract mechanics that larger buyers
              expect, including subprocessor and breach-notification provisions. That said, public trust surfaces are
              not the same thing as completed diligence. The reports, scopes, exceptions, and subprocessor details
              remain private. The right read is therefore not “risk solved,” but “trust posture looks enterprise-ready
              enough to merit deeper diligence.” For product underwriting, that is a positive signal because it reduces
              the likelihood that Degreed is a thin consumer-style application dressed up for enterprise use.
