      - number: '3.3'
        title: Distribution power, switching costs, and suite pressure
        blocks:
          - type: paragraph
            body: >-
              The single biggest strategic threat to Degreed is not a cheaper LXP—it is bundling by platforms that
              already own employee workflow surfaces, identity, and HR data. Microsoft Viva Learning is the clearest
              example because it can ride on top of an existing Microsoft estate. SAP and Workday play a similar game
              when learning is purchased as part of a broader HCM transformation. This matters because switching costs
              in enterprise learning come less from content than from integrations, permissions, HR data flows, manager
              workflows, and the degree to which a platform becomes the operating layer for skill and mobility
              decisions. Dedicated platforms therefore need to outperform suites enough on functionality and neutrality
              to justify another vendor in the stack. Multi-homing is possible on content providers, but much harder on
              the orchestration layer. That dynamic is precisely why Degreed's real moat question is not whether it has
              many features, but whether customers continue to want a vendor-neutral skills layer outside any one suite.
            claimRefs:
