        title: Capitalization, scale, and current operating snapshot
        blocks:
          - type: paragraph
            body: >-
              The last confirmed financing benchmark on the public record remains the April 2021 Series D: $153 million
              raised at a $1.4 billion valuation, co-led by Sapphire Ventures and Riverwood Capital. That round is well
              corroborated. What is much less clean is the current operating and capitalization snapshot. Tracxn points
              to roughly $367 million of cumulative funding, which is directionally plausible for a company that raised
              multiple rounds before 2021. GetLatka, by contrast, shows only $75.9 million across two rounds, a figure
              that is obviously incomplete because it is lower than the publicly announced Series D alone. The same
              GetLatka profile reports about $100 million of ARR and roughly 565 employees in late 2025; those numbers
              are useful directional markers but should still be treated as database estimates until management provides
              audited or board-level support. The overall read is that Degreed has enough external profile to establish
              scale, but not enough current disclosure to underwrite economics from chapter one alone. Later financial
              and valuation work therefore has to carry explicit confidence discounts.
