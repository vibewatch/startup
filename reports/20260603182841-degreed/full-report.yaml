      - number: '6.2'
        title: Named proof and adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              The named customer set is genuinely useful. Capgemini's 150,000-employee AI-skills push in 10 weeks is one
              of the strongest public proof points in the whole research set because it combines scale, speed, and a
              current AI use case. BT Group provides a second strong anchor with 100,000-plus employees and a branded
              internal environment. Cigna adds a 70,000-employee healthcare-scale reference, and State Street provides a
              longevity signal by citing five years of use and a central role in experiential learning. Other
              stories—Travelers, Exness, Ericsson, 84.51°, Citi, and Mastercard—fill in workflow breadth across AI
              transformation, internal mobility, data-driven learning, and operating-model redesign. The main caution is
              not that the stories are fake. It is that they are unevenly quantified. Some provide hard scale numbers,
              others mostly narrate use cases. That means the chapter can confidently claim real enterprise adoption,
              but not a standardized dashboard of customer usage or commercial outcomes.
