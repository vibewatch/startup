  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation and fit
        blocks:
          - type: paragraph
            body: >-
              Degreed's public customer evidence points to a very specific kind of buyer: large, complex organizations
              using learning as a workforce-transformation lever rather than as a narrow compliance function. The logo
              mix spans financial services, telecom, consulting, healthcare, insurance, and analytics-heavy businesses.
              That pattern matters because it suggests Degreed works best where role architecture, skill visibility, and
              internal mobility are strategically important. The strongest fit appears to be large knowledge-work
              organizations in regulated or transformation-heavy environments. This is also where a vendor-neutral
              skills layer is more valuable than a simple course library. The evidence base is not broad in a quantified
              sense—there is no published customer count or segment split—but it is broad enough in named references to
              conclude that Degreed is not dependent on one niche vertical. The right interpretation is
              “large-enterprise focused with horizontal applicability,” not “mass-market platform with transparent
              denominator data.” That distinction matters for every later commercial judgment in the report.
            claimRefs:
