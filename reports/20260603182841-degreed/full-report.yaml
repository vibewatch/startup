      - number: '8.2'
        title: Valuation context and comparable set
        blocks:
          - type: paragraph
            body: >-
              The valuation context is shaped by three facts. First, the last confirmed anchor is the 2021 $1.4 billion
              Series D. Second, third-party data points to around $100 million ARR in 2025. Third, 2026 software
              multiples are much lower than 2021 and reward only a subset of AI-labeled software companies with clear
              durability. That means the simple combination of “AI narrative + enterprise customers” is not enough to
              justify paying a historical premium multiple. Public comps help, but only imperfectly. Docebo is the
              closest software comp; Coursera helps bracket scale and content overlap; Skillsoft helps frame maturity
              and downside; and broader multiple sources define the market backdrop. None of these produce a precise
              fair value by themselves. What they do produce is a clear warning against casual optimism. On public
              evidence alone, Degreed should be priced with a meaningful discount for opacity and only a measured
              premium for strategic relevance.
            claimRefs:
