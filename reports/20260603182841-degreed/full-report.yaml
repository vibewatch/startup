      - number: '8.4'
        title: Final recommendation and decision rules
        blocks:
          - type: paragraph
            body: >-
              The final recommendation is research-more with medium confidence, high risk rating, and a stretched
              valuation stance. That is a disciplined middle ground, not indecision. Degreed is too substantial for an
              avoid call based on public evidence alone: the market exists, the product is mature, and the customer
              proof is credible. But the company is also too opaque for a buy recommendation when the most important
              valuation and downside variables—runway, retention, concentration, cap table, and current pricing of the
              asset—are all still behind the curtain. In practical terms, the investment decision should hinge on a
              short list of diligence asks and explicit kill triggers. If management can close the evidence gaps cleanly
              and the price reflects residual uncertainty, the case can improve materially. If not, the right move is
              patience. That is the correct end-state for a diligence report: not generic enthusiasm, but a clear
              statement of what would need to be true for capital to go in with conviction.
