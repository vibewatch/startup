      - number: '2.4'
        title: Growth drivers, constraints, and market implications
        blocks:
          - type: paragraph
            body: >-
              The tailwinds behind this market are strong and current. Microsoft, the World Economic Forum, Coursera,
              Udemy, and Degreed itself all point to the same macro theme: AI is changing work fast enough that
              employers need continuous reskilling, not periodic training refreshes. At the same time, the evidence also
              shows why adoption is not automatic. Buyers need to trust the skills-data layer, clear integration
              hurdles, and prove business impact rather than just engagement. Dedicated LXP vendors also face a
              structural threat from suites and productivity platforms that can bundle learning into broader workflow
              products, making vendor-count reduction part of the buying calculus. This is why the market should be
              treated as attractive but not frictionless. Degreed benefits from real demand drivers—AI fluency,
              human-skills development, personalization, and internal mobility—but it competes in a category where the
              best buyer problems are valuable precisely because they are operationally hard to solve. Later chapters
              should therefore treat market growth as supportive context, not as a substitute for customer, product, or
              valuation proof.
