      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Category demand is driven by real organizational pain, but purchase and deployment are multi-stakeholder.
              The natural buyer is usually the learning, talent, or HR organization, while users span employees,
              managers, and talent teams. Payers vary: some deals sit squarely in L&D budgets, others in HRIT
              modernization, and some in broader AI-transformation programs. That complexity explains why best-fit
              customers tend to be large enterprises with fragmented content estates, inconsistent role architecture,
              and a genuine need to connect learning to business capability gaps. Deployment also matters. A dedicated
              platform like Degreed typically has to integrate with HRIS, content providers, identity systems, and
              sometimes suite-native tools before it can deliver credible personalization or skills visibility. That
              means category attractiveness comes with implementation friction. In practice, a buyer is not comparing
              only “Degreed versus another LXP”; it is often comparing best-of-breed software versus making do with the
              incumbent suite, the existing LMS, or a hybrid stack stitched together internally.
