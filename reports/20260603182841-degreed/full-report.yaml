      - number: '7.4'
        title: Mitigations, monitoring, and final risk view
        blocks:
          - type: paragraph
            body: >-
              The most reassuring feature of the risk profile is that several mitigants are real. Degreed does publish
              trust artifacts, privacy terms, a DPA, and enough product / developer detail to show that the business is
              more mature than a thin marketing shell. There is also no obvious public fraud, scandal, or active
              enforcement event in the fetched set. The least reassuring feature is that the biggest remaining questions
              all sit behind the public curtain: model-governance controls, customer concentration, actual runway,
              reliability history, and management clarity. That is why the risk framework for diligence should focus on
              thesis-break triggers rather than generic caution. A weak-term financing round, a serious reliability
              event, an AI-governance challenge, or loss of a flagship customer would each force a real reset in
              underwriting. The final risk view is therefore balanced but firm: Degreed does not show a public fatal
              flaw, but it does show enough medium-to-high risks that any investment decision should remain conditional
              on direct diligence closing the most important operational, regulatory, and capital questions.
