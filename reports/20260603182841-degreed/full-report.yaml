  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape structure and direct peers
        blocks:
          - type: paragraph
            body: >-
              Degreed's competitor set is broader than a standard one-category software market because buyers can solve
              the same workforce-learning problem through several routes. The direct software peer set is Docebo,
              360Learning, and LearnUpon. These products compete most cleanly on learning-platform software, with
              different emphases on enterprise breadth, collaboration, and operational simplicity. But legacy incumbents
              such as Cornerstone and Skillsoft still matter because they bring installed bases, content libraries, and
              enterprise familiarity into the evaluation. The competitive landscape therefore needs to be segmented into
              direct peers, legacy incumbents, content-led platforms, and suite-native substitutes rather than treated
              as one flat list. The most strategically relevant peer is Docebo because it combines public-company scale
              with a similar “AI-era workforce” narrative. 360Learning and LearnUpon matter more as price and simplicity
              anchors. Cornerstone and Skillsoft matter because they shape how buyers think about migrations from older
              learning stacks into newer skills-oriented systems.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
