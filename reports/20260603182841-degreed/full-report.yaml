  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public topline evidence
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports the conclusion that Degreed is a real enterprise software business, but only
              weakly supports the details of how the economics actually work. Company materials show a platform sold
              into large enterprises, not a consumer or self-serve model. That strongly suggests enterprise subscription
              revenue as the core stream, likely layered with implementation and integration services for complex
              deployments. The only clean public topline datapoint in the fetched set is GetLatka's roughly $100 million
              ARR or revenue figure for late 2025, which should be treated as directional rather than audited. That is
              enough to establish that Degreed is not an early-stage company. It is not enough to establish revenue
              quality. The absence of public customer count, contract length, retention, or mix data means the topline
              cannot yet be translated into a durable value-creation profile. This chapter therefore treats ARR as a
              scale marker, not as a complete underwriting fact.
