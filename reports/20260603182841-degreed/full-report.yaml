        title: Unit economics and efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The best public efficiency proxy available is a simple one: if GetLatka's figures are directionally right,
              Degreed sits around $177,000 of ARR per employee. That is a useful framing device, but it should not be
              over-read. ARR per employee without gross margin, services mix, burn, or retention can mislead. A software
              company can look efficient at the topline while still carrying heavy implementation costs,
              customer-success load, or R&D intensity. The fetched source set does not reveal gross margin, CAC,
              payback, NRR, or free cash flow. It also does not reveal whether Degreed is running a lean, profitable
              software model or a more services-intensive enterprise-change model. What public comparables do show is
              that the market now rewards efficiency more than narrative. That is why the unit-economics read must
              remain provisional: the company has enough scale to deserve serious diligence, but not enough disclosure
              to deserve confident unit-economics claims from public materials alone.
