      - number: '8.3'
        title: Scenarios, sensitivity, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The bull, base, and bear cases are best understood as evidence scenarios rather than spreadsheet outputs.
              The bull case needs proof that Degreed is both durable and still growing into adjacent workflows at
              economics that justify a premium. The base case assumes the company is solid but not sufficiently
              transparent, which means a mid-range valuation logic at best and a research-more posture. The bear case is
              not “the company disappears”; it is that bundling, regulation, or financing pressure compresses strategic
              value and forces a downshift in price or ambition. Sensitivity is highest to three variables: current
              valuation / cap table, retention quality, and runway. Those are exactly the variables the public record
              does not resolve. That is why entry discipline matters so much. An investor should either insist on a
              valuation that already discounts these unknowns, or insist on evidence that closes them. Paying first and
              verifying later is not justified by the current evidence set.
            claimRefs:
              - CV018
              - CV019
