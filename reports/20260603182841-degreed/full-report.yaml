      - number: '6.4'
        title: Customer judgment and remaining gaps
        blocks:
          - type: paragraph
            body: >-
              The customer chapter supports a constructive but incomplete conclusion. Degreed has enough named logos and
              enough scaled deployments to show that the product solves real problems for serious enterprises. It is not
              a startup with only pilot references or one marquee account. The case-study mix also reinforces the
              broader thesis that the product can expand from learning into adjacent workflows such as mobility,
              performance, and AI transformation. What remains missing is the commercial denominator: total customer
              count, concentration, renewal behavior, and customer-level economics. External review and employee-comment
              surfaces are useful reminders not to confuse polished references with full customer truth, but they do not
              solve the underlying evidence gap either. For later chapters, the right carry-forward view is that Degreed
              has credible adoption and credible expansion pathways, yet still needs direct diligence to prove
              durability, satisfaction, concentration risk, and contract-level commercial depth at an investable level
