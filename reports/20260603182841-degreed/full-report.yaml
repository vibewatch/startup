      - number: '3.2'
        title: Capabilities, pricing, and software overlap
        blocks:
          - type: paragraph
            body: >-
              Capability overlap is real, but it is uneven. Dedicated platforms such as Degreed and Docebo compete on
              skills layers, pathwaying, and enterprise orchestration. Content-led competitors such as Coursera and
              Udemy attack from another angle: they make it easy to buy access to broad skill inventory, increasingly
              with AI tools and pathways, and can therefore commoditize the content-discovery layer of the buyer
              problem. Public pricing signals are limited. 360Learning publishes entry pricing at $8 per user per month,
              Udemy Business publishes a $30 per user per month team plan, while Docebo and many enterprise platforms
              keep pricing custom. That means list-price comparisons are directionally useful but not decisive. The more
              important question is what the buyer actually needs: a content source, a simpler LMS, or a system that
              becomes the orchestration layer for skills, mobility, and personalized development. Degreed can still
              differentiate on that last point, but only if buyers believe the added software layer produces enough
              value to justify standalone spend.
