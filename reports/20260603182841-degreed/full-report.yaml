  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and workflow scope
        blocks:
          - type: paragraph
            body: >-
              Degreed's public product surface makes it clear that the company is not just selling a learning homepage.
              The platform bundles skills intelligence, plans and pathways, workflow automation, assessments, AI
              coaching, and a mobility-oriented extension that links development to real opportunities. That breadth
              matters because it explains why Degreed can occupy a strategic position in workforce transformation
              programs rather than only in course discovery. The unifying design principle is skills: the platform is
              meant to identify what people need, target learning, and then connect development to career movement. That
              logic is visible across both the main platform overview and the Career Mobility / Skills I/O materials. In
              practical terms, Degreed looks like a system that sits between enterprise people data, learning content,
              and talent processes. That is a stronger product position than a generic LMS. It also means implementation
              quality and data quality are core parts of the product itself, not secondary operational details.
