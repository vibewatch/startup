  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category definition
        blocks:
          - type: paragraph
            body: >-
              The most useful way to frame Degreed's market is not “all learning” or “all edtech,” but the narrower
              enterprise software layer that connects learning content, role context, skills data, and workforce
              development workflows. Public category labels remain messy: legacy LMS vendors talk about content delivery
              and workforce readiness, HCM suites package learning inside broader HR platforms, and content libraries
              increasingly add pathways and AI tools. That means Degreed is selling into a market with blurry edges by
              design. The correct diligence move is to define included spend explicitly. Included spend covers
              enterprise subscriptions for learning orchestration, personalization, skill mapping, pathwaying, and
              related workflow automation. Excluded spend covers general education, pure content production, and
              training programs that do not depend on a software layer. This framing matters because it prevents the
              report from inflating Degreed's addressable market with unrelated education or services spend while still
              recognizing adjacent substitutes such as LMS products, suite-native learning modules, and internal-build
              approaches.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM028
              - CM035
