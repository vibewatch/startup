      - number: '1.2'
        title: Leadership, founders, and governance clarity
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is a major positive for Degreed, but the public record on who actually leads the
              business today is not clean. The company's 2021 financing announcement said Dan Levin would become CEO,
              replacing Chris McCarthy. Josh Bersin's 2022 coverage of the LearnIn acquisition then framed the move as
              David Blake returning to CEO, and a November 2025 GetLatka profile also names Blake as CEO. Meanwhile, the
              clearest current company-issued updates concern product and technology leadership: co-founder Eric Sharp
              returned to the CTO role in January 2025, and Elizabeth Tan Levy was hired as chief product officer to
              push the AI-powered skills platform strategy. That combination suggests renewed founder influence over
              product and engineering, which can be strategically useful in a category being reset by AI and skills
              data. It also creates a real diligence item: before using any management-quality judgment downstream, an
              investor should confirm the current CEO, the broader executive bench, and the board composition directly
              rather than relying on stale or conflicting public breadcrumbs.
