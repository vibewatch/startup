  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, privacy, and legal risk
        blocks:
          - type: paragraph
            body: >-
              Degreed's regulatory risk is less about one existing enforcement action and more about where the product
              sits in the direction of travel for workforce AI rules. The EU AI Act is directly relevant because
              learning, skills, mobility, and opportunity workflows can move close to employment decision support. The
              EEOC's AI focus matters for the same reason in the U.S. The FTC inquiry into generative-AI partnerships
              and claims matters because Degreed is actively marketing AI-driven skills and coaching capabilities.
              Against that backdrop, Degreed's privacy posture is a real mitigant. The company clearly states the
              controller-versus-processor split and publishes a DPA with enterprise-grade mechanics. That is better than
              many private software vendors provide. But it does not close the risk. What matters is how the company
              actually constrains, tests, and documents AI-linked workflows that could affect opportunity, mobility, or
              talent decisions. Those materials are not public. The right regulatory read is therefore “meaningful but
              diligencable risk,” not “problem solved by a privacy policy.”
            claimRefs:
