      - number: '4.3'
        title: Capital adequacy and public-market context
        blocks:
          - type: paragraph
            body: >-
              The last confirmed capital datapoint is still the April 2021 Series D at a $1.4 billion valuation. That is
              valuable as history, but dangerous if treated as current value. Software multiple sources repeatedly
              stress that the 2021 market no longer exists. L40 tracks a sharp collapse in ARR multiples from the 2021
              peak, while broader 2026 multiple commentary emphasizes dispersion, selectivity, and a premium only for
              truly durable AI software. Public comps reinforce the same message. Coursera is already operating at
              nearly $200 million of quarterly revenue and still trades in a sober public market. Docebo demonstrates
              that a direct learning-software peer can reach meaningful public-company scale. Skillsoft shows how
              unforgiving the market is to weaker or older models. The central implication for Degreed is simple: absent
              proof of a later financing round, cash balance, or runway, the company must be analyzed as a scaled
              private SaaS asset facing a much tighter funding market than the one in which its last confirmed round was
              priced.
