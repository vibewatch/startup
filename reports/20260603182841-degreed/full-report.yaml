      - number: '7.3'
        title: Commercial, dependency, and financial risk
        blocks:
          - type: paragraph
            body: >-
              The commercial and financial risk stack is driven by opacity as much as by adverse evidence. Public
              sources do not reveal concentration, runway, burn, or a confirmed post-2021 financing event. That means no
              outside analyst can tell whether Degreed is comfortably financed or quietly dependent on new capital.
              Large-enterprise focus increases the relevance of this gap because concentration can matter meaningfully
              even when logos look strong. At the same time, dependency risk is real: Microsoft and SAP ecosystem
              compatibility can help Degreed win, but those same ecosystems can also bundle away some of the need for a
              standalone vendor. Public peers sharpen the point. Docebo, Coursera, and Skillsoft show that the category
              is competitive, capital-sensitive, and strategically unstable in different ways. The tech-layoff
              environment adds one more layer by suggesting buyers are still disciplined on budget. This does not make
              Degreed uninvestable. It means capital dependency, customer dependency, and partner dependency should be
              treated as a connected risk chain, not as separate footnotes.
