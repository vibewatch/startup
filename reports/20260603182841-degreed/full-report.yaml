      - number: '7.2'
        title: Operational, security, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Degreed looks like a product that can create value only when several difficult pieces work
              together: HR data, skills taxonomies, content mappings, permissions, integrations, and user adoption. That
              makes implementation quality a first-order risk, not an afterthought. The trust center and ISO
              certifications are strong positives, and the company discloses a more mature security-control surface than
              many private software firms. But there is still no detailed public reliability history, no incident log,
              and no evidence on model quality or bias testing. The developer surface shows living APIs and status
              endpoints, which is a sign of platform maturity, yet it also confirms that integrations are critical to
              value delivery. In a platform like this, technical failure rarely looks like a total shutdown; it looks
              like data drift, weak recommendations, broken connectors, or slow deployment that quietly erodes customer
              outcomes. Investors should therefore treat security and implementation as linked risks rather than
              separate checkboxes.
