      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The public proof set suggests expansion potential more clearly than it proves durability. Many cases show
              Degreed moving beyond basic learning discovery into skills, performance, AI fluency, and internal
              mobility. That is exactly the type of land-and-expand motion investors want to see in an enterprise
              platform. But none of the fetched public materials provide NRR, GRR, churn, top-customer share, or renewal
              timing. Even the better long-duration proof, like State Street, does not give revenue expansion detail.
              The risk here is straightforward: polished referenceability can coexist with weak economics if the product
              is strategically admired but commercially narrow inside the account. Concentration risk is also unknowable
              from public materials. Given the company's clear large-enterprise focus, the absence of concentration data
              matters more than it would in a broad-based SMB business. The correct diligence stance is therefore
              positive on expansion possibility, but explicitly cautious on retention and concentration until management
              opens the books.
