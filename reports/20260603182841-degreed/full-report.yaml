      - number: '2.2'
        title: Sizing lenses and growth profile
        blocks:
          - type: paragraph
            body: >-
              Public market data is clearly supportive on growth, but not clean enough to justify a single definitive
              TAM number. Mordor Intelligence puts the LXP market at $3.25 billion in 2025, $3.76 billion in 2026, and
              $8.35 billion by 2031, implying 17.3% CAGR over 2026-2031. Technavio offers a smaller 2025 base of $1.72
              billion but a faster 25.1% CAGR through 2030, while also highlighting North America as 34.1% of
              incremental growth and the cloud deployment segment at $773.4 million in 2024. The divergence should not
              be hand-waved away; it reflects real methodology differences, including what each publisher counts as LXP
              software versus adjacent content or talent-tech spend. For diligence purposes, the key conclusion is not
              the exact midpoint between the reports. It is that Degreed is exposed to a fast-growing enterprise
              category with enough scale to matter, but one where valuation work must use evidence-constrained market
              logic rather than a single glossy TAM slide.
