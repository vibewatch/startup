chapter:
  number: 7
  title: Risks
  summary: 'Degreed''s main risks do not come from one catastrophic red flag already visible in public
    sources; they come from the interaction of workforce-AI regulation, implementation complexity, large-enterprise
    concentration, and stale financial disclosure. The company presents a strong public trust posture
    through ISO certifications, a trust center, and published privacy / DPA terms, but those are mitigants
    rather than proof that the harder questions—AI-governance controls, reliability history, customer
    concentration, and runway—are solved. The risk verdict is therefore “investigable, not dismissible”:
    there are no obvious public-company-ending signals, but multiple medium-to-high risks must be tested
    directly in diligence before an investor can treat the thesis as robust.'
