sections:
- id: regulatory
  title: Regulatory, privacy, and legal risk
  body: Degreed's regulatory risk is less about one existing enforcement action and more about where the
    product sits in the direction of travel for workforce AI rules. The EU AI Act is directly relevant
    because learning, skills, mobility, and opportunity workflows can move close to employment decision
    support. The EEOC's AI focus matters for the same reason in the U.S. The FTC inquiry into generative-AI
    partnerships and claims matters because Degreed is actively marketing AI-driven skills and coaching
    capabilities. Against that backdrop, Degreed's privacy posture is a real mitigant. The company clearly
    states the controller-versus-processor split and publishes a DPA with enterprise-grade mechanics.
    That is better than many private software vendors provide. But it does not close the risk. What matters
    is how the company actually constrains, tests, and documents AI-linked workflows that could affect
    opportunity, mobility, or talent decisions. Those materials are not public. The right regulatory read
    is therefore “meaningful but diligencable risk,” not “problem solved by a privacy policy.”
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR005
  - CR006
  - CR007
  - CR030
  tableRefs:
  - TR001
- id: operational
  title: Operational, security, and implementation risk
  body: 'Operationally, Degreed looks like a product that can create value only when several difficult
    pieces work together: HR data, skills taxonomies, content mappings, permissions, integrations, and
    user adoption. That makes implementation quality a first-order risk, not an afterthought. The trust
    center and ISO certifications are strong positives, and the company discloses a more mature security-control
    surface than many private software firms. But there is still no detailed public reliability history,
    no incident log, and no evidence on model quality or bias testing. The developer surface shows living
    APIs and status endpoints, which is a sign of platform maturity, yet it also confirms that integrations
    are critical to value delivery. In a platform like this, technical failure rarely looks like a total
    shutdown; it looks like data drift, weak recommendations, broken connectors, or slow deployment that
    quietly erodes customer outcomes. Investors should therefore treat security and implementation as
    linked risks rather than separate checkboxes.'
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR031
  - CR027
  - CR028
  tableRefs:
  - TR002
  figureRefs:
  - FR003
- id: commercial-financial
  title: Commercial, dependency, and financial risk
  body: 'The commercial and financial risk stack is driven by opacity as much as by adverse evidence.
    Public sources do not reveal concentration, runway, burn, or a confirmed post-2021 financing event.
    That means no outside analyst can tell whether Degreed is comfortably financed or quietly dependent
    on new capital. Large-enterprise focus increases the relevance of this gap because concentration can
    matter meaningfully even when logos look strong. At the same time, dependency risk is real: Microsoft
    and SAP ecosystem compatibility can help Degreed win, but those same ecosystems can also bundle away
    some of the need for a standalone vendor. Public peers sharpen the point. Docebo, Coursera, and Skillsoft
    show that the category is competitive, capital-sensitive, and strategically unstable in different
    ways. The tech-layoff environment adds one more layer by suggesting buyers are still disciplined on
    budget. This does not make Degreed uninvestable. It means capital dependency, customer dependency,
    and partner dependency should be treated as a connected risk chain, not as separate footnotes.'
  claimRefs:
  - CR015
  - CR021
  - CR019
  - CR020
  - CR022
  - CR035
  - CR025
  - CR026
  - CR024
  tableRefs:
  - TR003
  - TR004
  figureRefs:
  - FR002
- id: mitigations
  title: Mitigations, monitoring, and final risk view
  body: 'The most reassuring feature of the risk profile is that several mitigants are real. Degreed does
    publish trust artifacts, privacy terms, a DPA, and enough product / developer detail to show that
    the business is more mature than a thin marketing shell. There is also no obvious public fraud, scandal,
    or active enforcement event in the fetched set. The least reassuring feature is that the biggest remaining
    questions all sit behind the public curtain: model-governance controls, customer concentration, actual
    runway, reliability history, and management clarity. That is why the risk framework for diligence
    should focus on thesis-break triggers rather than generic caution. A weak-term financing round, a
    serious reliability event, an AI-governance challenge, or loss of a flagship customer would each force
    a real reset in underwriting. The final risk view is therefore balanced but firm: Degreed does not
    show a public fatal flaw, but it does show enough medium-to-high risks that any investment decision
    should remain conditional on direct diligence closing the most important operational, regulatory,
    and capital questions.'
  claimRefs:
  - CR033
  - CR042
  - CR037
  - CR038
  - CR039
  - CR040
  - CR041
  - CR043
  tableRefs:
  - TR005
  figureRefs:
  - FR001
