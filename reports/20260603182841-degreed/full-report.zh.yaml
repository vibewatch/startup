      - number: '7.4'
        title: 缓释因素、监测与最终风险判断
        blocks:
          - type: paragraph
            body: >-
              风险画像中最令人安心的一点，是几个缓释因素真实存在。Degreed 发布信任材料、隐私条款、DPA，以及足够的产品 /
              开发者细节，证明业务比一个单薄营销壳成熟。抓取来源中也没有明显公开欺诈、丑闻或正在进行的执法事件。最不安心的是，最大剩余问题都在公开帷幕之后：模型治理控制、客户集中度、实际现金续航、可靠性历史和管理层清晰度。因此，尽调风险框架应聚焦破坏投资论点的触发点，而不是泛泛谨慎。弱条款融资轮、严重可靠性事件、AI
              治理挑战或失去旗舰客户，都将迫使承销真正重置。最终风险判断 因此平衡但明确：Degreed 没有显示公开致命缺陷，但中高风险足够多，任何投资决定都应以直接尽调关闭最重要的运营、监管和资本问题为条件。
