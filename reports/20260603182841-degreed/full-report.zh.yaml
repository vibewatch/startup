  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资 Degreed 的理由真实存在。公司处在可信企业软件品类，产品深度看起来超过内容发现，也有足够具名企业证明，值得认真关注。反论点 同样真实：到 2026
              年，好公司并不自动等于好投资，尤其当公开记录仍留下估值关键问题。Degreed 可能是一家耐久的后期平台，能从 AI
              和流动工作流获得有意义上行空间。它也可能只是一家扎实但普通的企业软件公司，最后确认估值来自热得多的市场，当前披露又稀薄到不足以支撑激进定价。因此，建议不能来自「质感印象」，必须来自实际可知的信息。公开证据支持存在一门真实业务，但还不支持干净的承销模型。
            claimRefs:
              - CV040
              - CV041
              - CV021
              - CV022
              - CV039
          - type: table
            tableRef: TV002
            claimRefs:
              - CV040
              - CV041
              - CV021
              - CV022
          - type: figure
            figureRef: FV001
            claimRefs:
