  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >-
              框定 Degreed 市场最有用的方式，不是「全部学习」或「全部教育科技」，而是更窄的企业软件层：它连接学习内容、岗位语境、技能数据和员工发展工作流。公开品类标签仍然混乱：传统 LMS
              厂商谈内容交付和员工队伍就绪，HCM 套件把学习打包进更宽的 HR 平台，内容库也越来越加入路径和 AI 工具。这意味着 Degreed
              本来就卖在一个边界模糊的市场里。正确的尽调动作，是明确界定纳入的支出。纳入支出包括学习编排、个性化、技能映射、路径化和相关工作流自动化的企业订阅。排除支出包括通用教育、纯内容生产，以及不依赖软件层的培训项目。这个框架重要，因为它避免报告用无关教育或服务支出夸大
              Degreed 的可触达市场，同时仍承认相邻替代品：LMS 产品、套件原生学习模块、内部自建方案。
