      - number: '4.3'
        title: 资本充足性与公开市场语境
        blocks:
          - type: paragraph
            body: >-
              最后确认的资本数据点仍是 2021 年 4 月 Series D，估值 $1.4B。作为历史，这很有价值；若当作当前价值，就很危险。软件倍数来源反复强调，2021 年市场已经不存在。L40 追踪到 ARR 倍数从
              2021 年峰值急剧坍塌；更广泛的 2026 年倍数评论也强调分化、选择性，以及只有真正耐久的 AI 软件 才享有溢价。公开可比公司强化了同一信息。Coursera 已经做到近 $200M
              季度收入，却仍在冷静的公开市场交易。Docebo 证明直接学习软件同业可以达到有意义的上市公司规模。Skillsoft 则显示市场对较弱或较旧模式有多无情。Degreed
              的核心含义很简单：如果没有后续融资轮、现金余额或现金续航 的证据，就必须把公司视为一项有规模的私营 SaaS 资产，面对的融资市场比其最后确认轮定价时紧得多。
