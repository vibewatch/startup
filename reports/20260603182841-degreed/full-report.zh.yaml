          - type: figure
            figureRef: FV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
      - number: '8.3'
        title: 情景、敏感性与进入纪律
        blocks:
          - type: paragraph
            body: >-
              牛市、基准和熊市场景，最好理解为证据情景，而不是表格输出。牛市场景需要证明 Degreed
              既耐久，又仍在向相邻工作流增长，且经济性足以支持溢价。基准场景假设公司扎实但透明度不足，因此最多只能用中档估值逻辑，并保持继续研究姿态。熊市场景不是「公司消失」，而是捆绑、监管或融资压力压缩战略价值，迫使价格或目标下调。敏感性最高的三个变量是当前估值
              / 股权结构表、留存质量和现金续航。这些正是公开记录未解决的变量。因此，进入纪律极其重要。投资人要么坚持一个已折扣这些未知项的估值，要么坚持拿到能关闭这些问题的证据。在当前证据集下，先付钱、后验证并不合理。
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV029
              - CV030
              - CV032
              - CV035
          - type: table
            tableRef: TV003
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV032
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV004
              - CV030
              - CV032
              - CV013
              - CV031
      - number: '8.4'
        title: 最终建议与决策规则
        blocks:
          - type: paragraph
            body: >-
              最终建议是继续研究，置信度中等、风险评级高、估值立场偏紧。这是有纪律的中间地带，不是犹豫不决。仅凭公开证据，不应给 Degreed
              回避建议：市场存在，产品成熟，客户证明可信。但公司也过于不透明，不足以支持买入建议；最重要的估值和下行变量——现金续航、留存、集中度、股权结构表和资产当前定价——仍都在帷幕之后。实际操作上，投资决定应取决于一小组尽调要求和明确否决触发点。如果管理层能干净关闭证据缺口，且价格反映剩余不确定性，投资理由可以明显改善。否则，正确动作是耐心等待。这才是一份尽调报告应有的结论状态：不是泛泛热情，而是清楚说明哪些条件成立后，资本才可有确信度地进入。
            claimRefs:
