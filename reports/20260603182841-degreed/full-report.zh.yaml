        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              财务结论并不看空 Degreed 的存在或营收相关性；谨慎点在于能否承销。一家 ARR 约 $100M、员工 565
              人的公司，显然已经越过风险投资试验阶段。但区分持久复利型公司与过度融资的转型厂商的关键变量仍属私密：没有公开现金续航视图、没有披露利润率画像、没有留存历史、没有集中度数据，也没有 2021
              年后的确认融资。这个组合意味着下一步的正确框架，不是用虚构数字争论电子表格，而是找出能推进判断的最小管理层材料清单。具体包括：当前现金和 现金消耗、订阅与服务收入结构、客户耐久性指标，以及真实的 2021
              年后股权结构表。在这些材料可得之前，Degreed 应被视为财务上可信但不透明——一家规模真实、不确定性也同样真实的公司。
