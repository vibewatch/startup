              具名客户集合确实有用。Capgemini 在 10 周内推动 150,000 名员工的 AI 技能计划，是整套研究中最强的公开证明点之一，因为它同时结合了规模、速度和当前 AI 使用场景。BT Group
              提供第二个强锚点：超过 100,000 名员工和有品牌的内部环境。Cigna 增加了 70,000 名员工的医疗规模参考；State Street
              通过引用五年使用和在体验式学习中的中心角色，提供长期使用信号。其他案例——Travelers、Exness、Ericsson、84.51°、Citi 和 Mastercard——补上了 AI
              转型、内部流动、数据驱动学习和运营模式重设计等工作流宽度。主要提醒 不是这些故事虚假，而是量化程度不均。有些给出硬规模数字，有些主要叙述使用场景。因此，本章可以有信心地说 Degreed
