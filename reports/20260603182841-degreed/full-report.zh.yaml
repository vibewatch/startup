  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - AI 和人才流动场景扩张，加深平台价值；后续轮融资条款克制；留存强
        - 相对 HR 科技同行的溢价倍数得以维持
        - 执行和监管仍然关键
        - 需要补上几项当前缺失事实
      - - 基准
        - 公司稳健但增长放慢；披露仍不完整；估值受重置后的 SaaS 市场锚定
        - 最好也只是中个位数到低双位数 ARR 倍数逻辑
        - 现金跑道和留存不透明，折价仍在
        - 最符合公开证据
      - - 悲观
        - 捆绑销售、监管或现金跑道压力压缩战略价值
        - 可能出现降价轮或弱融资结果
        - 客户韧性和融资变成核心问题
        - 会由反向尽调发现触发
    notes: 情景表保持定性，因为公开记录不足以支撑精确的、按持股调整后的回报测算。
