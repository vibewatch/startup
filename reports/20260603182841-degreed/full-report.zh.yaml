  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图结构与直接同业
        blocks:
          - type: paragraph
            body: >-
              Degreed 的竞争集合比标准单品类软件市场更宽，因为买方可以用几条路径解决同一个员工学习问题。直接软件同业是 Docebo、360Learning 和
              LearnUpon。这些产品最直接地在学习平台软件上竞争，但侧重点分别落在企业宽度、协作和运营简单性上。Cornerstone、Skillsoft
              等传统既有厂商仍重要，因为它们把存量客户、内容库和企业熟悉度带进评估。因此，竞争格局需要分成直接同业、传统既有厂商、内容驱动平台和套件原生替代品，而不能当作一张平面清单。战略上最相关的同业是
              Docebo，因为它结合了上市公司规模和类似的「AI 时代员工队伍」叙事。360Learning 和 LearnUpon 更像价格与简单性的锚。Cornerstone 和 Skillsoft
              的重要性在于，它们塑造买方如何思考从旧学习栈迁移到更新的技能导向系统。
