      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              品类需求来自真实组织痛点，但采购和部署涉及多方。自然买方通常是学习、人才或 HR 组织；用户横跨员工、经理和人才团队。付款方不一：有些交易直接落在 L&D 预算，有些落在 HRIT 现代化，有些进入更宽的 AI
              转型项目。这种复杂性解释了为什么最佳客户往往是大型企业：内容资产碎片化、岗位架构不一致，并且确实需要把学习接到业务能力缺口。部署同样重要。像 Degreed 这样的专用平台，通常必须先与
              HRIS、内容提供商、身份系统，有时还要与套件原生工具集成，才能交付可信的个性化或技能可视化。因此，品类吸引力伴随实施摩擦。实践中，买方比较的不是单纯「Degreed 对另一家
              LXP」；更常见的是比较单点最佳软件、继续凑合使用既有套件、现有 LMS，或内部拼接的混合技术栈。
