      - number: '2.4'
        title: 增长驱动、约束与市场含义
        blocks:
          - type: paragraph
            body: >-
              这个市场背后的顺风强且仍在当下。Microsoft、World Economic Forum、Coursera、Udemy 和 Degreed 本身都指向同一宏观主题：AI
              改变工作的速度足够快，雇主需要持续再技能化，而不是周期性培训翻新。与此同时，证据也显示采用不会自动发生。买方需要信任 技能数据层，跨过集成障碍，并证明业务影响，而不只是证明参与度。专用 LXP
              厂商还面临结构性威胁：套件和生产力平台可以把学习打包进更宽的工作流产品，让减少供应商数量成为购买考量的一部分。因此，市场应被视为有吸引力但不顺滑。Degreed 受益于真实需求驱动——AI
              熟练度、人类技能发展、个性化和内部流动——但它所在品类中，最好的买方问题之所以有价值，正因为运营上难解决。后续章节因此应把市场增长当作支持性背景，而不是客户、产品或估值证明的替代品。
