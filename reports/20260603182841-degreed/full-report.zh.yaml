      - number: '7.3'
        title: 商业、依赖与财务风险
        blocks:
          - type: paragraph
            body: >-
              商业和财务风险栈由不透明驱动，不亚于由不利证据驱动。公开来源没有披露集中度、现金续航、现金消耗，也没有确认 2021 年后的融资事件。这意味着外部分析师无法判断 Degreed
              是资金充裕，还是静默依赖新资本。大企业聚焦提高了这个缺口的重要性，因为即使客户标识 看起来强，集中度也可能很重要。同时，依赖风险真实存在：Microsoft 和 SAP 生态兼容性可以帮助 Degreed
              赢单，但同一批生态也可能通过捆绑削弱对独立供应商的需求。公开同业进一步凸显这一点。Docebo、Coursera 和 Skillsoft
              显示，这个品类竞争激烈、资本敏感，并以不同方式处在战略不稳定中。科技裁员环境又加一层，说明买方预算仍有纪律。这并不让 Degreed
              不可投资。它意味着资本依赖、客户依赖和伙伴依赖应被视为一条相连的风险链，而不是分散脚注。
            claimRefs:
