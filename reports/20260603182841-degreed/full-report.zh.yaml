  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与匹配度
        blocks:
          - type: paragraph
            body: >-
              Degreed 的公开客户证据指向一种很具体的买方：大型复杂组织，把学习用作员工队伍转型杠杆，而不是狭义合规职能。客户标识组合横跨金融服务、电信、咨询、医疗、保险和分析密集型业务。这个模式重要，因为它暗示
              Degreed 最适合岗位架构、技能可视化和内部流动具有战略意义的场景。最强匹配看起来是大型知识工作组织，尤其是受监管或转型任务重的环境。在这些地方，供应商中立技能层
              比简单课程库更有价值。证据基础在量化意义上并不宽——没有公布客户数量或分层拆分——但具名参考案例已足够广，可以判断 Degreed
              不依赖某一个小众垂直领域。正确解读是「大企业聚焦，具备横向适用性」，而不是「大众市场平台，且分母数据透明」。这个区别会影响报告后续每一个商业判断。
