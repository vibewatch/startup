        title: 收入模式与公开营收证据
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Degreed
              是一家真实企业软件公司，但对其经济模型细节支持较弱。公司材料显示，平台卖给大型企业，不是消费者或自助模式。这强烈指向企业订阅收入是核心流，复杂部署可能叠加实施和集成服务。本轮抓取中唯一干净的公开营收数据点，是
              GetLatka 对 2025 年末 ARR 或收入约 $100M 的数字；应视为方向性，而非审计口径。它足以证明 Degreed
              不是早期公司，但不足以证明收入质量。公开缺少客户数量、合同期限、留存或收入结构数据，意味着营收端还不能转化为持久价值创造画像。因此，本章把 ARR 当作规模标记，而不是完整承销事实。
