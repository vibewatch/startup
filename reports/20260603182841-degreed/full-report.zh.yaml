              - CV021
              - CV025
      - number: '8.2'
        title: 估值语境与可比集合
        blocks:
          - type: paragraph
            body: >-
              估值语境由三点塑造。第一，最后确认锚点是 2021 年 $1.4B Series D。第二，第三方数据指向 2025 年 ARR 约 $100M。第三，2026 年软件倍数远低于 2021 年，只有少数带 AI
              标签且耐久性清楚的软件公司获得奖励。这意味着，「AI 叙事 + 企业客户」的简单组合，不足以证明支付历史溢价倍数合理。公开可比公司有帮助，但都不完美。Docebo 是最接近的软件可比对象；Coursera
              帮助框定规模和内容重叠；Skillsoft 帮助界定成熟度和下行；更广泛的倍数来源定义市场背景。它们本身都无法给出精确公允价值，却共同发出清楚警告：不要随意乐观。仅凭公开证据，Degreed
              的定价应为不透明性打入有意义折扣，只为战略相关性给出有限溢价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV034
