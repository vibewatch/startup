            body: >-
              公开记录中最后确认的融资基准仍是 2021 年 4 月 Series D：由 Sapphire Ventures 和 Riverwood Capital 共同领投，融资 $153M，估值
              $1.4B。这一轮证据充分。真正不清楚的是当前经营和资本结构快照。Tracxn 指向累计融资约 $367M；对于一家 2021 年前已完成多轮融资的公司，这在方向上说得通。相反，GetLatka 只显示两轮共
              $75.9M；这个数字明显不完整，因为低于公开宣布的 Series D 本身。同一份 GetLatka 资料报告，2025 年末 ARR 约 $100M、员工约 565
              人；这些数字有方向性价值，但在管理层提供经审计或董事会级支持前，仍只能作为数据库估算。总体判断是：Degreed
              外部能见度足以证明规模，但当前披露不足以在第一章就承销经济性。因此，后续财务和估值工作必须显式加入置信度折扣。
