        - 需要当前留存、现金跑道和估值证据，才能上调确信度
      - - 财务不透明、融资信息过旧，让业务难以定价
        - 新融资、清晰股权结构表和稳定续约指标会降低折价
      - - 捆绑销售和内容商品化威胁定价权
        - 如果能证明客户愿意为 Degreed 技能层长期支付溢价，会改善判断
      - - 监管和治理压力藏在公开信息之后
        - AI 治理、偏见测试和管理层清晰度会降低执行风险
    notes: 建议只有在价格和证据一起变化时才会改变；单边改善不够。
