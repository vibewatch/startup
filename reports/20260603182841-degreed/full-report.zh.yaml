    title: 资本强度 / 现金流图
    type: flow
    data:
      nodes:
        - id: seriesd
          label: 2021 年 Series D 资本基础
        - id: opex
          label: 565 人运营基础
        - id: product
          label: AI / 技能平台投入
        - id: macro
          label: 2026 年更紧的软件融资环境
        - id: risk
          label: 稀释 / 融资依赖风险
      edges:
        - from: seriesd
          to: opex
        - from: opex
          to: risk
        - from: product
          to: risk
        - from: macro
          to: risk
    claimRefs:
      - CI006
      - CI029
      - CI020
      - CI037
    summary: 即便未披露现金余额，融资逻辑也很清楚：公司规模和产品野心都让新资本证据变得重要。
  - id: FE001
    title: 产品架构图
    type: stack
    data:
      layers:
        - label: 信任与治理层
          detail: 安全控制、隐私条款、认证
        - label: API 与集成层
          detail: OAuth、内容摄取、管理员控制的访问
        - label: 流动与机会工作流
          detail: Career Mobility 和 Skills I/O
        - label: 学习体验与个性化
          detail: 计划、路径、辅导、自动化
        - label: 技能数据与推断
          detail: 技能映射、推断、评估
    claimRefs:
      - CE002
      - CE036
      - CE007
      - CE035
    summary: Degreed 的架构更适合理解为分层的企业工作流栈，而不是单一内容门户。
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    data:
      nodes:
        - id: data
          label: 导入 HR 和用户数据
        - id: skills
          label: 映射技能并推断缺口
        - id: learning
          label: 推荐计划、路径和内容
        - id: mobility
          label: 把成长连接到机会
        - id: feedback
          label: 跟踪进展并迭代
      edges:
        - from: data
          to: skills
        - from: skills
          to: learning
        - from: learning
          to: mobility
        - from: mobility
          to: feedback
    claimRefs:
      - CE002
      - CE004
      - CE008
      - CE030
    summary: 产品工作流依赖高质量上游数据，也依赖企业愿意把基于技能的流程落到运营中。
  - id: FE003
    title: 关键依赖图
    type: dag
    data:
      nodes:
        - id: hris
          label: HR / 人员数据
        - id: content
          label: 内容提供商和目录
        - id: identity
          label: 身份和 API 权限
        - id: trust
          label: 安全、隐私和 DPA 控制
        - id: product
          label: Degreed 平台结果
      edges:
        - from: hris
          to: product
        - from: content
          to: product
        - from: identity
          to: product
        - from: trust
          to: product
    claimRefs:
      - CE031
      - CE022
      - CE012
      - CE030
    summary: Degreed 嵌入客户的数据、内容和治理环境后，产品效果最好。
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    data:
      columns:
        - 可见度
        - 集成深度
        - 治理成熟度
        - 差异化
      rows:
        - label: 核心学习 / 路径
          values:
            - 高
            - 中
            - 中
            - 中
        - label: 技能层
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 职业流动
          values:
            - 中
            - 中
            - 中
            - 高
        - label: 开发者 / API 界面
          values:
            - 高
            - 高
            - 中
            - 中
        - label: 信任 / 合规
          values:
            - 高
            - 中
            - 高
            - 中
    claimRefs:
      - CE029
      - CE036
      - CE035
      - CE007
      - CE027
    summary: 能力成熟度来自公开表面评估，而非内部实现或正常运行时间数据。
  - id: FU001
    title: 客户旅程图
    type: journey-map
    data:
      items:
        - label: 识别能力缺口
        - label: 部署学习和技能层
        - label: 个性化发展
        - label: 延伸到流动 / AI 用例
        - label: 追求可衡量的业务结果
    claimRefs:
      - CU021
      - CU028
      - CU034
    summary: 具名客户证据显示，Degreed 往往作为多步骤劳动力转型旅程的一部分被采购。
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    data:
      items:
        - label: 大型企业兴趣
          value: 100
        - label: 具名证据 / 公开引用
          value: 60
        - label: 有硬数字的大规模部署
          value: 20
        - label: 公开留存证据
          value: 5
    claimRefs:
      - CU001
      - CU024
      - CU025
    summary: 公开证据在 logo 上很丰富，在留存上很稀薄，这是营销主导客户证据的典型特征。
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    data:
      columns:
        - 规模具体性
        - 结果具体性
        - 新鲜度
        - 工作流广度
      rows:
        - label: Capgemini / BT / Cigna
          values:
            - 高
            - 中
            - 高
            - 高
        - label: State Street / Exness / Travelers
          values:
            - 中
            - 中
            - 高
            - 高
        - label: Ericsson / 84.51°
          values:
            - 中低
            - 中
            - 中
            - 中
        - label: Citi / Mastercard
          values:
            - 中
            - 中
            - 低
            - 中
    claimRefs:
      - CU003
      - CU007
      - CU009
      - CU012
      - CU033
    summary: 证据基础多元且可信，但新鲜度并不一致，量化程度也不均衡。
  - id: FU004
    title: 客户扩张路径
    type: flow
    data:
      nodes:
        - id: learning
          label: 学习体验
        - id: skills
          label: 技能可见度
        - id: ai
          label: AI 熟练度 / 转型
        - id: mobility
          label: 职业流动和机会
        - id: performance
          label: 绩效和人才流程
      edges:
        - from: learning
          to: skills
        - from: skills
          to: mobility
        - from: skills
          to: ai
        - from: mobility
          to: performance
    claimRefs:
      - CU028
      - CU005
      - CU010
      - CU011
      - CU008
    summary: 公开客户故事反复显示，使用范围会从学习扩展到相邻的劳动力工作流。
  - id: FR001
    title: 风险热力图
    type: matrix
    data:
      columns:
        - 低概率
        - 中概率
        - 高概率
      rows:
        - label: 监管 / 法律
          values:
            - '-'
            - EU AI / FTC / EEOC
            - '-'
        - label: 运营 / 数据质量
          values:
            - '-'
            - 集成 / 模型质量
            - 数据质量依赖
        - label: 财务 / 资本
          values:
            - '-'
            - 融资不透明
            - 现金跑道未知
        - label: 商业 / 集中度
          values:
            - '-'
            - 捆绑压力
            - 集中度未知
    claimRefs:
      - CR002
      - CR003
      - CR011
      - CR020
      - CR015
      - CR021
    summary: 热力图按可能的实际影响排序公开风险，而不是按单独听起来多戏剧化排序。
  - id: FR002
    title: 风险传导图
    type: dag
    data:
      nodes:
        - id: reg
          label: 监管 / AI 公平性
        - id: ops
          label: 集成 / 可靠性
        - id: cust
          label: 客户信任和续约
        - id: fin
          label: 增长 / 现金跑道
        - id: val
          label: 估值和融资条款
      edges:
        - from: reg
          to: cust
        - from: ops
          to: cust
        - from: cust
          to: fin
        - from: fin
          to: val
        - from: reg
          to: val
    claimRefs:
      - CR002
      - CR011
      - CR021
      - CR020
      - CR038
    summary: 多数风险之所以重要，是因为它们会传导到续约、增长，并最终传导到融资条款。
  - id: FR003
    title: 依赖图
    type: dag
    data:
      nodes:
        - id: hris
          label: HR 和身份系统
        - id: content
          label: 内容生态
        - id: suite
          label: 平台 / 套件合作伙伴
        - id: controls
          label: 信任和隐私控制
        - id: degreed
          label: Degreed 客户结果
      edges:
        - from: hris
          to: degreed
        - from: content
          to: degreed
        - from: suite
          to: degreed
        - from: controls
          to: degreed
    claimRefs:
      - CR012
      - CR014
      - CR033
      - CR036
    summary: 平台依赖数据、集成和信任系统，而这些系统有一部分不在 Degreed 直接控制之内。
  - id: FV001
    title: 建议逻辑
    type: flow
    data:
      nodes:
        - id: market
          label: 真实市场和企业相关性
        - id: product
          label: 产品和客户证据
        - id: risk
          label: 剩余风险和不透明度仍高
        - id: price
          label: 需要价格纪律
        - id: rec
          label: 建议：继续研究
      edges:
        - from: market
          to: product
        - from: product
          to: price
        - from: risk
          to: price
        - from: price
          to: rec
    claimRefs:
      - CV040
      - CV041
      - CV021
      - CV025
    summary: 建议来自真实公司质量与未解决的估值关键不透明性这两者的组合。
  - id: FV002
    title: 估值敏感性
    type: bar
    data:
      items:
        - label: 当前估值清晰度
          value: 10
        - label: 留存质量
          value: 9
        - label: 现金跑道 / 资本充足性
          value: 9
        - label: 捆绑 / 竞争压力
          value: 7
        - label: 监管 / AI 治理
          value: 7
    claimRefs:
      - CV004
      - CV030
      - CV032
      - CV013
      - CV031
    summary: 建议最敏感的变量是缺失的商业和融资数据，而不是广义市场规模。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    data:
      items:
        - label: 最近确认估值
          low: 1400
          high: 1400
          unit: USD m
        - label: 示意性 ARR 锚点
          low: 100
          high: 100
          unit: USD m
        - label: 公开市场倍数环境
          low: 3.8
          high: 10
          unit: ARR x
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV007
    summary: 该区间图呈现输入项，而不是假装输出精确公允价值。
  - id: FV004
    title: 投资 KPI
    type: kpi
    data:
      items:
        - label: 建议
          value: research-more
        - label: 置信度
          value: medium
        - label: 风险评级
          value: high
        - label: 估值立场
          value: stretched
        - label: 最重要缺口
          value: runway / retention / cap table
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV036
    summary: 面向 IC 的 KPI 视角把证据压缩成最关键的决策变量。
