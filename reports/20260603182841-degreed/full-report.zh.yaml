            body: >-
              公开市场数据清楚支持增长，但不干净到足以给出一个确定 TAM 数字。Mordor Intelligence 估计 LXP 市场 2025 年为 $3.25B，2026 年为 $3.76B，2031 年达
              $8.35B，隐含 2026-2031 年 CAGR 为 17.3%。Technavio 给出的 2025 年基数更小，为 $1.72B，但 2030 年前 CAGR 更快，达 25.1%；同时指出北美占增量增长
              34.1%，云部署板块 2024 年为 $773.4M。不能把这种分歧轻轻带过；它反映真实方法论差异，包括各发布方把哪些算作 LXP 软件、哪些算作相邻内容或
              人才科技支出。尽调中，关键结论不是几份报告的精确中点，而是 Degreed 暴露在一个高速增长、规模足以重要的企业品类中；但估值工作必须使用受证据约束的市场逻辑，而不是一页光鲜的 TAM 幻灯片。
