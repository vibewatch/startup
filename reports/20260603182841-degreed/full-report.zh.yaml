        title: 领导层、创始人与治理清晰度
        blocks:
          - type: paragraph
            body: >-
              创始人延续性是 Degreed 的一大利好，但公开记录并不能清楚说明今天到底谁在带业务。公司 2021 年融资公告称 Dan Levin 将接任 CEO，替代 Chris McCarthy。Josh Bersin
              在 2022 年对 LearnIn 收购的报道又把这次交易描述为 David Blake 回归 CEO；2025 年 11 月 GetLatka 资料也称 Blake 为
              CEO。与此同时，当前最清晰的公司发布更新集中在产品和技术领导层：联合创始人 Eric Sharp 于 2025 年 1 月回任 CTO，Elizabeth Tan Levy 被任命为首席产品官，推进 AI
              驱动的技能平台战略。这个组合暗示创始人对产品和工程的影响力重新增强；在 AI 和技能数据重塑品类时，这具备战略价值。它也形成一个真实尽调项：在后续使用任何管理层质量判断前，投资人应直接确认当前
              CEO、更宽的高管梯队和董事会构成，而不是依赖过期或相互冲突的公开线索。
