    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Degreed 的公开材料始终把公司描述为企业学习体验平台；现在叙事重点已从狭义内容交付工具，转向技能智能和员工队伍转型。创始叙事很重要，因为它早于当前这一波 AI 技能营销：Degreed 称公司创立于
              2012 年，目的是识别发生在正式学位之外的学习；产品随后从聚合扩展到个性化、技能追踪和能力规划。公开融资和收购公告显示公司位于加州 Pleasanton，也把它放在长期品类先行者位置，而不是新成立的 AI
              初创公司。尽调中，这种时间跨度很关键：它意味着有意义的存量客户基础和产品深度，但市场也会按十年执行表现评判 Degreed，而不只是看当前营销话术。因此，当前最强的身份判断是：后期私营企业
              LXP，以技能优先为运营论点，具备有意义的生态集成，产品叙事越来越围绕 AI 赋能的员工队伍转型展开。
