            body: >-
              客户章节支持一个建设性但不完整的结论。Degreed
              有足够多的具名客户标识和规模化部署，说明产品在严肃企业中解决真实问题。它不是只有试点背书或单一招牌客户的初创公司。案例组合也强化了更宽论点：产品可以从学习扩展到流动、绩效和 AI
              转型等相邻工作流。缺失的是商业分母：总客户数量、集中度、续约行为和客户级经济性。外部评论 和员工评论表面提醒我们，不要把精致客户背书和完整客户真相混为一谈，但它们也无法解决底层证据缺口。带入后续章节的正确看法
              是：Degreed 有可信采用和可信扩张路径，但仍需直接尽调，才能以可投资的置信水平证明耐久性、满意度、集中度风险和合同层面的商业深度。
            claimRefs:
              - CU029
              - CU030
              - CU035
              - CU032
              - CU033
              - CU037
          - type: figure
            figureRef: FU002
            claimRefs:
              - CU001
              - CU024
              - CU025
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与法律风险
        blocks:
          - type: paragraph
            body: >-
              Degreed 的监管风险不太来自某个既有执法行动，更来自员工队伍 AI 规则的演进方向。EU AI Act 直接相关，因为学习、技能、流动和机会工作流可能靠近就业决策支持。EEOC 对 AI
              的关注在美国出于同一原因重要。FTC 对生成式 AI 合作和宣称的调查也相关，因为 Degreed 正在主动营销 AI 驱动的技能和教练能力。在这个背景下，Degreed
              的隐私姿态是真实缓释因素。公司清楚陈述控制者与处理者分工，并发布具备企业级机制的 DPA。这优于许多私营软件厂商。但它没有关闭风险。关键在于，公司如何真正约束、测试和记录可能影响机会、流动或人才决策的 AI
              关联工作流。这些材料并不公开。因此，正确监管判断是「风险有意义但可尽调」，不是「隐私政策已解决问题」。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
              - CR030
          - type: table
            tableRef: TR001
            claimRefs:
