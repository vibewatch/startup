            body: >-
              目前最好的公开效率代理指标很简单：如果 GetLatka 数字方向正确，Degreed 每名员工 ARR 约 $177,000。这是有用框架，但不能过度解读。没有 毛利率、服务收入占比、现金消耗或留存，单看人均
              ARR 会误导。软件公司可以在营收端显得高效，同时仍背负沉重实施成本、客户成功负担或 R&D 强度。本轮抓取来源没有披露毛利率、CAC、回收期、NRR 或自由现金流，也没有说明 Degreed
              是在跑轻量、盈利的软件模式，还是更偏服务密集的企业变革模式。公开可比公司确实说明，市场现在奖励效率超过叙事。因此，单位经济判断必须保持临时性：公司规模足以值得认真尽调，但公开材料披露不足，不足以给出有信心的单位经济主张。
