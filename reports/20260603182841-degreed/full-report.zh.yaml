        - 新融资披露
        - 计划外弱条款融资
        - 重新评估估值和下行保护
      - - 监管 / AI 公平性
        - 执法行动或重大合规审查
        - 涉及 Degreed 或旗舰用例的公开行动
        - 暂停投资逻辑，重新评估法律风险
      - - 客户韧性
        - 背书流失或流失信号
        - 旗舰客户流失或负面续约数据
        - 重新评估集中度和收入质量逻辑
      - - 可靠性 / 安全
