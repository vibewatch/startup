              - CR002
              - CR003
              - CR006
              - CR007
      - number: '7.2'
        title: 运营、安全与实施风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Degreed 看起来只有在几块困难拼图一起跑通时才能创造价值：HR 数据、技能分类体系、内容映射、权限、集成和用户采用。因此，实施质量 是一阶风险，不是事后补充。信任中心和 ISO
              认证是强正面信号，公司披露的安全控制面也比许多私营软件公司成熟。但仍没有详细公开可靠性历史、事故日志，也没有模型质量或偏差测试证据。开发者界面展示了活跃 API
              和状态端点，这是平台成熟度的信号；同时也确认集成对价值交付至关重要。在这样的平台中，技术故障很少表现为完全宕机；它更像数据漂移、推荐薄弱、连接器故障或部署缓慢，悄悄侵蚀客户结果。投资人应把安全和实施
              视为相连风险，而不是两个独立勾选项。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
