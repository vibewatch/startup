companyProfile:
  summary: >-
    Degreed 于 2012 年由 David Blake 和 Eric Sharp 在加州 Pleasanton
    创立，初衷是识别并组织正式学位之外的学习。此后，公司演化为更宽的企业学习体验与技能智能平台，把学习计划、路径、技能推断、工作流自动化和职业流动连接起来。Degreed
    面向希望把学习接到员工能力规划的大型企业，而不是只交付课程。公开证据支持其具备真实规模、客户相关性和成熟的平台基础设施，但当前领导层清晰度、2021 年后融资、留存和现金续航仍留下关键尽调问题。
