      - number: '3.3'
        title: 分发力量、切换成本与套件压力
        blocks:
          - type: paragraph
            body: >-
              Degreed 最大的单一战略威胁不是更便宜的 LXP，而是已经掌握员工工作流入口、身份和 HR 数据的平台进行捆绑。Microsoft Viva Learning 是最清楚的例子，因为它可以借助现有
              Microsoft 存量环境。SAP 和 Workday 在学习作为更宽 HCM 转型一部分采购时，也玩类似游戏。这很重要，因为企业学习的切换成本更少来自内容，更多来自集成、权限、HR
              数据流、经理工作流，以及平台在多大程度上成为技能和流动决策的运营层。专用平台因此必须在功能和中立性上足够胜过套件，才能让客户在技术栈里再加一个供应商。内容提供商可以 多方并用，但编排层要难得多。这个动态正是
              Degreed 真正护城河问题所在：不是功能多不多，而是客户是否继续想要一个位于任何单一套件之外的供应商中立技能层。
