        title: 信任、隐私与企业治理姿态
        blocks:
          - type: paragraph
            body: >-
              在私营软件厂商里，Degreed 展示出相对成熟的公开信任姿态。信任中心突出 SOC 2 Type 2、ISO 27001 和 ISO
              9001；公司还用更具体的安全控制清单配套，包括测试、风险评估、代码审查、培训和事件响应规划。隐私政策和已发布 DPA
              也有用，因为它们说明公司理解企业控制者与处理者分工，以及大型买方期待的合同机制，包括子处理方和违规通知条款。话虽如此，公开信任材料不等于完成尽调。报告、范围、例外和子处理方细节仍未公开。正确判断不是「风险已解决」，而是「信任姿态看起来足够企业级就绪，值得继续深挖」。对产品承销而言，这是正面信号，因为它降低了
              Degreed 只是披着企业外衣的轻薄消费级应用的可能性。
