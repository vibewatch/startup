      - number: '3.4'
        title: 护城河耐久性与对论点的含义
        blocks:
          - type: paragraph
            body: >-
              Degreed 最强的潜在护城河，是跨平台编排加一个专用技能层，坐在内容提供商之上，也位于任何单一 HCM
              或生产力套件之外。这是有效的护城河候选项，但并不会自动持久。买方可能认定「够用」的套件原生学习配合内容订阅已经足够。内容厂商也可能继续加入路径化和 AI 工具，直到编排溢价收窄。Docebo
              等公开同业也说明，市场的软件侧竞争激烈且资本充足。含义是：承销 Degreed
              时，不能假设它拥有清晰品类。应把它视为在拥挤技术栈中竞争的单点最佳平台；捆绑、商品化和分发力量与产品质量同样重要。后续章节需要检验客户买 Degreed，是因为它任务关键，还是因为它只是当前多个有吸引力选项之一。
