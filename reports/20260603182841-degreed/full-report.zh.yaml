              也无法从公开材料判断。考虑到公司明显聚焦大企业，缺少集中度数据的问题比在广泛 SMB 业务中更重要。因此，正确尽调姿态 是看好扩张可能性，但在管理层开账前，对留存和集中度明确保持谨慎。
