      - number: '3.2'
        title: 能力、定价与软件重叠
        blocks:
          - type: paragraph
            body: >-
              能力重叠真实存在，但并不均匀。Degreed、Docebo 等专用平台在技能层、路径化和企业编排上竞争。Coursera、Udemy
              等内容驱动竞争者从另一个角度进攻：它们让买方容易获得广泛技能库存，并且越来越多地叠加 AI 工具和路径，因此可能商品化买方问题中的内容发现层。公开定价信号有限。360Learning 公布入门价格为每用户每月
              $8，Udemy Business 公布团队版每用户每月 $30；Docebo 和许多企业平台仍采用定制定价。因此，标价比较有方向性价值，但不能决定胜负。更重要的问题是买方真正需要什么：内容来源、更简单的
              LMS，还是一个成为技能、流动和个性化发展编排层的系统。Degreed 仍可在最后一点上区分出来，但前提是买方相信新增软件层产生的价值足以证明单独支出合理。
