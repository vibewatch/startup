evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: current-ceo
    missingEvidence: >-
      A direct company statement or updated leadership page confirming whether Dan Levin or David Blake is serving as
      CEO in 2026.
    whyItMatters: >-
      Leadership clarity matters because management credibility and succession stability are reused across every later
      chapter and the current public record is inconsistent.
    diligencePath: Request the current executive roster from management or confirm against a dated company leadership page.
    relatedQuestionRefs:
      - QO006
      - QO024
  - type: missing-source
    severity: material
    topic: series-e-2025
    missingEvidence: >-
      Any public term sheet, press release, or credible news report confirming the rumored ~$110 million 2025 Series E
      mentioned in research notes.
    whyItMatters: >-
      If a post-2021 round exists, it materially changes the valuation anchor, dilution math, and stage assessment for
      the report.
    diligencePath: >-
      Request the 2025 financing deck or cap-table update; failing that, search state filings and investor portfolio
      disclosures.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, cash balance, and burn data for 2024-2026.
    whyItMatters: Chapter-one cover metrics otherwise rely on third-party databases and cannot support underwriting by themselves.
    diligencePath: Request board-approved financial statements and monthly management reporting.
    relatedQuestionRefs:
      - QO012
      - QO013
      - QO022
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: A complete board list, investor ownership percentages, and formal governance structure.
    whyItMatters: Governance rights, board composition, and preference stack affect control and future financing risk.
    diligencePath: Request the current board deck and cap table.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO003
      - TO002
  - type: stale
    severity: minor
    topic: customer-scale
    missingEvidence: An updated customer-count or logo disclosure after the 2021 Fortune 50 claim.
    whyItMatters: The 2021 customer-scale claim is directionally useful but too stale to stand alone as a current scale measure.
    diligencePath: Request a current customer and enterprise-logo summary or use later customer case studies as partial replacement.
    relatedQuestionRefs:
      - QO014
      - QO023
      - QO025
  - type: missing-source
    severity: material
    topic: som-estimate
    missingEvidence: >-
      Customer-count, win-rate, and segment-share data sufficient to estimate Degreed's realistic serviceable obtainable
      market.
    whyItMatters: Without SOM evidence, TAM claims stay strategically interesting but not valuation-grade.
    diligencePath: Request segment-level customer distribution, average contract size by buyer type, and win/loss data.
    relatedQuestionRefs:
      - QM022
  - type: stale
    severity: minor
    topic: regional-sam
    missingEvidence: A region-by-region SAM for skills platforms, especially North America versus Europe.
    whyItMatters: North America is clearly important, but a company-specific regional revenue lens is missing.
    diligencePath: Ask management for regional ARR mix and expansion priorities.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: buyer-conversion
    missingEvidence: Pipeline conversion and sales-cycle data by buyer type and deployment pattern.
    whyItMatters: The category may be large, but adoption friction matters more than abstract TAM in enterprise software.
    diligencePath: Request CRM funnel data split by L&D-led, HRIT-led, and suite-displacement deals.
    relatedQuestionRefs:
      - QM012
      - QM018
  - type: missing-source
    severity: minor
    topic: suite-displacement
    missingEvidence: Independent win/loss studies showing how often dedicated LXPs beat suite-native learning modules.
    whyItMatters: Replacement risk is one of the main strategic questions for Degreed and cannot be settled from vendor pages alone.
    diligencePath: Request win/loss analysis or speak with channel partners and buyers.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: material
    topic: win-loss
    missingEvidence: >-
      Independent win-loss data showing where Degreed consistently beats suites, direct peers, or content-led
      alternatives.
    whyItMatters: Competitive position cannot be underwritten confidently from vendor pages and public results alone.
    diligencePath: Request internal win-loss analysis and customer references from displaced deals.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: multi-homing
    missingEvidence: >-
      Customer-level evidence on whether Degreed commonly coexists with Coursera, Udemy, Microsoft Viva, or suite-native
      learning.
    whyItMatters: Multi-homing changes how much displacement risk should be priced into the thesis.
    diligencePath: Request implementation diagrams and renewal notes from enterprise accounts.
    relatedQuestionRefs:
      - QP018
  - type: missing-source
    severity: minor
    topic: realized-pricing
    missingEvidence: Realized enterprise price, discounting, and attach-rate data across the core competitor set.
    whyItMatters: List prices are weak proxies for strategic pricing power in enterprise software.
    diligencePath: Collect procurement data or customer references with contract detail.
    relatedQuestionRefs:
      - QP010
      - QP012
      - QP014
  - type: missing-source
    severity: minor
    topic: feature-parity
    missingEvidence: A neutral third-party feature benchmark comparing skills graphs, mobility workflows, and recommendation quality.
    whyItMatters: Marketing pages and category grids overstate parity and hide execution differences.
    diligencePath: Use expert interviews or hands-on product testing in diligence.
    relatedQuestionRefs:
      - QP015
      - QP019
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Cash balance, monthly burn, runway months, and any debt covenant package.
    whyItMatters: This is the central financial underwriting variable for a private company with stale funding disclosure.
    diligencePath: Request the latest board-approved budget, balance sheet, and cash bridge.
    relatedQuestionRefs:
      - QI008
      - QI009
      - QI020
      - QI023
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: margin
    missingEvidence: Gross margin, subscription gross margin, and services mix.
    whyItMatters: Without margin data, ARR quality and operating leverage cannot be judged.
    diligencePath: Request revenue mix and gross-margin bridge.
    relatedQuestionRefs:
      - QI007
      - QI019
    relatedTableRefs:
      - TI003
      - TI001
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, and customer concentration data.
    whyItMatters: ARR without durability metrics is not enough for late-stage underwriting.
    diligencePath: Request cohort tables and top-customer exposure.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: post-2021-financing
    missingEvidence: Any confirmed financing after Series D, including amount, valuation, and dilution.
    whyItMatters: Later-round evidence changes capital adequacy, price discipline, and return math.
    diligencePath: Request cap table and financing timeline through 2026.
    relatedQuestionRefs:
      - QI009
      - QI022
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: SLA history, uptime metrics, and incident history for the production platform and APIs.
