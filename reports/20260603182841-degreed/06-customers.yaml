sections:
- id: customer-base
  title: Customer base segmentation and fit
  body: 'Degreed''s public customer evidence points to a very specific kind of buyer: large, complex organizations
    using learning as a workforce-transformation lever rather than as a narrow compliance function. The
    logo mix spans financial services, telecom, consulting, healthcare, insurance, and analytics-heavy
    businesses. That pattern matters because it suggests Degreed works best where role architecture, skill
    visibility, and internal mobility are strategically important. The strongest fit appears to be large
    knowledge-work organizations in regulated or transformation-heavy environments. This is also where
    a vendor-neutral skills layer is more valuable than a simple course library. The evidence base is
    not broad in a quantified sense—there is no published customer count or segment split—but it is broad
    enough in named references to conclude that Degreed is not dependent on one niche vertical. The right
    interpretation is “large-enterprise focused with horizontal applicability,” not “mass-market platform
    with transparent denominator data.” That distinction matters for every later commercial judgment in
    the report.'
  claimRefs:
  - CU001
  - CU002
  - CU018
  - CU019
  - CU034
  - CU021
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-proof
  title: Named proof and adoption trajectory
  body: The named customer set is genuinely useful. Capgemini's 150,000-employee AI-skills push in 10
    weeks is one of the strongest public proof points in the whole research set because it combines scale,
    speed, and a current AI use case. BT Group provides a second strong anchor with 100,000-plus employees
    and a branded internal environment. Cigna adds a 70,000-employee healthcare-scale reference, and State
    Street provides a longevity signal by citing five years of use and a central role in experiential
    learning. Other stories—Travelers, Exness, Ericsson, 84.51°, Citi, and Mastercard—fill in workflow
    breadth across AI transformation, internal mobility, data-driven learning, and operating-model redesign.
    The main caution is not that the stories are fake. It is that they are unevenly quantified. Some provide
    hard scale numbers, others mostly narrate use cases. That means the chapter can confidently claim
    real enterprise adoption, but not a standardized dashboard of customer usage or commercial outcomes.
  claimRefs:
  - CU003
  - CU007
  - CU009
  - CU012
  - CU005
  - CU008
  - CU013
  - CU014
  - CU015
  - CU017
  - CU024
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU003
- id: durability-and-expansion
  title: Durability, expansion, and concentration
  body: 'The public proof set suggests expansion potential more clearly than it proves durability. Many
    cases show Degreed moving beyond basic learning discovery into skills, performance, AI fluency, and
    internal mobility. That is exactly the type of land-and-expand motion investors want to see in an
    enterprise platform. But none of the fetched public materials provide NRR, GRR, churn, top-customer
    share, or renewal timing. Even the better long-duration proof, like State Street, does not give revenue
    expansion detail. The risk here is straightforward: polished referenceability can coexist with weak
    economics if the product is strategically admired but commercially narrow inside the account. Concentration
    risk is also unknowable from public materials. Given the company''s clear large-enterprise focus,
    the absence of concentration data matters more than it would in a broad-based SMB business. The correct
    diligence stance is therefore positive on expansion possibility, but explicitly cautious on retention
    and concentration until management opens the books.'
  claimRefs:
  - CU028
  - CU025
  - CU026
  - CU027
  - CU031
  - CU036
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: customer-judgment
  title: Customer judgment and remaining gaps
  body: 'The customer chapter supports a constructive but incomplete conclusion. Degreed has enough named
    logos and enough scaled deployments to show that the product solves real problems for serious enterprises.
    It is not a startup with only pilot references or one marquee account. The case-study mix also reinforces
    the broader thesis that the product can expand from learning into adjacent workflows such as mobility,
    performance, and AI transformation. What remains missing is the commercial denominator: total customer
    count, concentration, renewal behavior, and customer-level economics. External review and employee-comment
    surfaces are useful reminders not to confuse polished references with full customer truth, but they
    do not solve the underlying evidence gap either. For later chapters, the right carry-forward view
    is that Degreed has credible adoption and credible expansion pathways, yet still needs direct diligence
    to prove durability, satisfaction, concentration risk, and contract-level commercial depth at an investable
    level of confidence.'
  claimRefs:
  - CU029
  - CU030
  - CU035
  - CU032
  - CU033
  - CU037
  figureRefs:
  - FU002
