chapter:
  number: 6
  title: Customers and Adoption
  summary: 'Degreed''s customer evidence is strongest at the named-logo level: public case studies span
    consulting, financial services, telecom, insurance, healthcare, and enterprise technology, with multiple
    examples of the platform being used as a skills and mobility layer rather than only a course portal.
    The best public adoption datapoints include Capgemini''s 150,000-employee AI-skills push, BT Group''s
    100,000+ employee deployment, and Cigna''s 70,000-employee learning scale. What remains missing is
    equally important: there is no public retention, NRR, concentration, or customer-count disclosure
    robust enough to underwrite revenue durability from public evidence alone.'
