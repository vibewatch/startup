sections:
- id: identity-business-model
  title: Identity and business model
  body: 'Degreed''s public materials consistently describe the company as an enterprise learning experience
    platform that now emphasizes skills intelligence and workforce transformation rather than a narrow
    content-delivery tool. The founding narrative is important because it predates the current wave of
    AI skills marketing: Degreed says it was founded in 2012 to recognize learning that happens outside
    formal degrees, and the product has since expanded from aggregation into personalization, skill tracking,
    and capability planning. Public financing and acquisition announcements place the company in Pleasanton,
    California, and position it as a long-lived category pioneer rather than a newly formed AI startup.
    That longevity matters for diligence because it implies a meaningful installed base and product depth,
    but it also means the market will judge Degreed against a decade of execution, not just a current
    marketing message. The strongest current identity read is therefore: late-stage private enterprise
    LXP with a skills-first operating thesis, meaningful ecosystem integrations, and a product narrative
    increasingly wrapped around AI-enabled workforce transformation.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO031
  - CO032
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-governance
  title: Leadership, founders, and governance clarity
  body: 'Founder continuity is a major positive for Degreed, but the public record on who actually leads
    the business today is not clean. The company''s 2021 financing announcement said Dan Levin would become
    CEO, replacing Chris McCarthy. Josh Bersin''s 2022 coverage of the LearnIn acquisition then framed
    the move as David Blake returning to CEO, and a November 2025 GetLatka profile also names Blake as
    CEO. Meanwhile, the clearest current company-issued updates concern product and technology leadership:
    co-founder Eric Sharp returned to the CTO role in January 2025, and Elizabeth Tan Levy was hired as
    chief product officer to push the AI-powered skills platform strategy. That combination suggests renewed
    founder influence over product and engineering, which can be strategically useful in a category being
    reset by AI and skills data. It also creates a real diligence item: before using any management-quality
    judgment downstream, an investor should confirm the current CEO, the broader executive bench, and
    the board composition directly rather than relying on stale or conflicting public breadcrumbs.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO016
  - CO034
  - CO030
  tableRefs:
  - TO002
- id: capital-scale
  title: Capitalization, scale, and current operating snapshot
  body: 'The last confirmed financing benchmark on the public record remains the April 2021 Series D:
    $153 million raised at a $1.4 billion valuation, co-led by Sapphire Ventures and Riverwood Capital.
    That round is well corroborated. What is much less clean is the current operating and capitalization
    snapshot. Tracxn points to roughly $367 million of cumulative funding, which is directionally plausible
    for a company that raised multiple rounds before 2021. GetLatka, by contrast, shows only $75.9 million
    across two rounds, a figure that is obviously incomplete because it is lower than the publicly announced
    Series D alone. The same GetLatka profile reports about $100 million of ARR and roughly 565 employees
    in late 2025; those numbers are useful directional markers but should still be treated as database
    estimates until management provides audited or board-level support. The overall read is that Degreed
    has enough external profile to establish scale, but not enough current disclosure to underwrite economics
    from chapter one alone. Later financial and valuation work therefore has to carry explicit confidence
    discounts.'
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO020
  - CO019
  - CO017
  - CO018
  - CO021
  - CO035
  - CO036
  tableRefs:
  - TO003
  figureRefs:
  - FO003
- id: milestones-open-questions
  title: Milestones, trust signals, and open questions
  body: Degreed's milestone record is constructive even if the financing trail has gone stale. The company
    has stayed active through the LearnIn acquisition, renewed founder technical leadership, a fresh CPO
    hire, 2026 ISO 27001 and ISO 9001 certifications, and category-recognition items such as the TIME
    list and Fosway strategic-leader placement. Public marketplace listings with Microsoft, Workday, and
    SAP also reinforce that Degreed is embedded in the enterprise HR and productivity stack rather than
    selling as a standalone niche app. The most important unresolved issue is the possibility of a post-Series-D
    financing event. Research notes mention a roughly $110 million 2025 Series E, but there is no fetched
    public source in this run that substantiates that round, its terms, or its valuation. Because of that
    gap, the report should anchor on the confirmed 2021 valuation while explicitly carrying the later-round
    question forward. This chapter therefore establishes Degreed as a scaled, credible, still-relevant
    platform company—but one whose current capitalization and leadership details need direct diligence
    before an investor treats them as settled facts.
  claimRefs:
  - CO015
  - CO010
