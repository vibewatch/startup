chapter:
  number: 1
  title: Company Overview
  summary: Degreed is a Pleasanton-based enterprise learning experience platform founded in 2012 that
    has evolved from content aggregation into a skills intelligence and workforce transformation platform.
    The last publicly confirmed financing is the April 2021 $153 million Series D at a $1.4 billion valuation,
    while third-party profile pages point to roughly $100 million ARR and about 565 employees in 2025.
    Leadership, however, warrants fresh diligence because the 2021 CEO transition to Dan Levin conflicts
    with a 2025 GetLatka profile naming founder David Blake as CEO.
