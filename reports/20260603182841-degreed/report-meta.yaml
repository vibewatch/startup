  claimRefs: [CO001, CO013, CO020, CV025]
summary:
  headline: >-
    Degreed has enough market relevance, customer proof, and product depth to merit continued diligence, but
    the public record is still too opaque on retention, runway, cap table, and current valuation to justify a
    buy recommendation in the tougher 2026 software multiple environment.
