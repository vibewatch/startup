  foundingLocation: Pleasanton, California, USA
  headquarters: Pleasanton, California, USA
  productSummary: >-
    Degreed sells an enterprise learning experience and skills platform that helps employers map skill gaps,
    personalize development pathways, aggregate external and internal content, automate learning workflows,
    and connect learning to internal mobility and workforce transformation initiatives.
  customerFocus: >-
    Large enterprises in complex knowledge-work environments, especially organizations pursuing workforce
    transformation, skills visibility, internal mobility, and AI upskilling at scale.
  businessModel: >-
    Enterprise software subscription model with likely implementation and integration services overlays. The
    company appears to sell through a sales-led motion rather than transparent self-serve pricing.
  stage: Late-stage private (Series D+)
  fundingStatus: >-
