      - number: '1.2'
        title: Founders and Leadership Team
        blocks:
          - type: paragraph
            body: >-
              EvenUp was co-founded by three individuals who remained in executive roles as of the report date. CEO Rami
              Karabibar drives the company's strategic vision and is its primary external spokesperson; his founding
              motivation was shaped by observing a family member navigate a personal injury claim without adequate legal
              resources. COO Raymond (Ray) Mieszaniec brings operational and entrepreneurial depth, having previously
              co-founded fintech startup EquitySim and worked in PwC's risk consulting practice in Hong Kong. The third
              co-founder, Saam Mashhad, holds the unusual dual title of Chief of Product and Legal Operations,
              reflecting the company's thesis that product decisions and legal operations expertise are inseparable in
              this market. All three co-founders were confirmed on EvenUp's investor pages and in executive interviews
              as of late 2025. EvenUp also maintains a 300+ person legal operations team that underpins its
              human-in-the-loop review process, ensuring AI outputs meet the evidentiary standards required by plaintiff
              attorneys. No material leadership departures were identified during the research period.
