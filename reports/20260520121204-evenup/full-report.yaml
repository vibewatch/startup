  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >
              EvenUp's addressable market is plaintiff personal injury legal operations software and AI—a vertical
              within the broader US legal technology sector defined by three characteristics: (1) buyers are
              plaintiff-side PI law firms operating on contingency fees, not hourly-billed corporate or defense
              practices; (2) core workflows are demand preparation, medical-record analysis, case valuation, intake
              triage, and treatment tracking for bodily-injury claims; and (3) the economic return is measured in
              settlement improvement and paralegal-hour savings, not in billable-hour efficiency. Personal injury law
              encompasses automobile accidents, workplace injuries, medical malpractice, product liability, and toxic
              torts—all cases where an injured plaintiff retains counsel on a percentage-of-recovery basis.

              This boundary explicitly excludes: (a) defense-side legal AI used by insurance companies and defense
              counsel; (b) corporate legal-department tools such as contract lifecycle management and eDiscovery; (c)
              InsurTech claims processing platforms sold to insurance carriers; and (d) general-purpose AI coding
              assistants or broad research tools not calibrated to PI case types. Adjacent markets include legal case
              management systems (CMS) such as Filevine and Clio, medical-record retrieval services, and litigation
              financing— all of which EvenUp interfaces with but does not directly compete in.

              Status-quo substitutes currently displaced by EvenUp include: manual paralegal demand drafting (typically
              5–20 hours per demand letter), generic word-processor templates, medical-chronology vendors that only
              return structured summaries, and off-the-shelf large language models (Claude, ChatGPT) that lack
              PI-specific training data and confidentiality controls required under ABA Rules and HIPAA.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM019
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
