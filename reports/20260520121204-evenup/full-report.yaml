      - number: '2.5'
        title: Adoption Constraints and Adverse Evidence
        blocks:
          - type: paragraph
            body: >
              Legal AI adoption in PI law faces a distinct set of structural constraints that do not apply equally to
              other software categories. ABA Model Rule 1.1 (Competence) requires attorneys to maintain sufficient
              understanding of technology they use in client representations, which the ABA's comment on technological
              competence (Comment 8) extends to AI tools— meaning attorneys cannot simply delegate judgment to an AI
              platform without adequate supervision. ABA Model Rule 1.6 (Confidentiality) prohibits disclosure of client
              information without consent, requiring that any AI platform handling case data—especially medical
              records—operate under strict data-isolation and contractual confidentiality guarantees. ABA Rule 5.5
              further prohibits assisting in unauthorized practice of law, raising questions about AI-generated legal
              strategies that are not reviewed and approved by a licensed attorney. EvenUp has addressed these
              compliance obligations by achieving SOC 2 Type 2 recertification and HIPAA attestation, but compliance
              maintenance is an ongoing operational cost.

              AI hallucinations represent a specific and well-documented risk in legal contexts. Confidently incorrect
              citations or fabricated case law embedded in demand letters could expose attorneys to malpractice claims,
              disciplinary action, or sanctions. EvenUp's line-level citation model attempts to mitigate this by tying
              every assertion to a source document, but the risk is not eliminated and cannot be fully automated away.
              Above the Law's commentary on EvenUp explicitly notes ongoing concerns about algorithmic bias, data
              privacy, and the risk that AI-generated demand letters could "gum up" court systems with standardized
              filings. There is a plausible adverse scenario in which insurance adjusters begin discounting demands that
              follow a recognizable AI-generated template, reducing EvenUp's settlement-improvement value proposition
              over time.

              Small-firm budget constraints present a final structural friction: the majority of PI firms operate with
              fewer than 10 attorneys and limited technology budgets. Integration with incumbent case management systems
              (Filevine, MyCase, Clio) requires implementation investment and staff training that may deter adoption
              among the smallest firms.
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
              - CM038
              - CM040
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Contingency Fees Create a Structurally Stronger AI ROI Case Than Hourly Markets
            body: >
              PI law firms operate on a pure outcome basis: every hour of paralegal or attorney time invested in a case
              that does not increase the settlement value is a direct cost with no offsetting billing. This is
              fundamentally different from hourly-billed markets where AI time savings reduce revenue proportionally. In
              PI law, AI efficiency compounds: faster case prep enables more cases, and better demand documentation can
              directly raise settlement values. This is why EvenUp's customer testimonials consistently cite percentage
              improvements in settlement outcomes rather than billing efficiency—the metric that matters in a
              contingency model.
            calloutType: insight
            claimRefs:
              - CM003
              - CM023
          - type: callout
            title: Homogenized AI Demand Letters Could Be Discounted by Insurance Adjusters
            body: >
              As EvenUp penetrates 30%+ of the top 100 PI firms and processes 10,000+ cases per week, a plausible
              adverse scenario emerges: insurance adjusters learn to recognize EvenUp-generated demand templates and
              develop systematic response strategies. If demands begin to look identical across firms, insurers may
              discount them relative to bespoke attorney-drafted letters. This risk is acknowledged by Above the Law
              commentary and is consistent with how insurance companies respond to plaintiff-side commoditization.
              EvenUp's Mirror Mode (firm-specific style replication) is a direct product response to this risk, but its
              effectiveness at scale has not been independently tested.
            calloutType: risk
            claimRefs:
              - CM034
              - CM039
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              EvenUp operates in a competitive environment spanning five distinct categories, each posing a different
              type of displacement threat. The market for PI legal operations AI is nascent and expanding rapidly: as of
              2026, only a handful of purpose-built PI AI platforms exist, but the broader legal AI sector is crowded
              and well-funded, increasing the risk that horizontal or adjacent players extend into EvenUp's vertical.

              Category one—direct PI specialist AI peers—is the most proximate competitive threat and currently
              comprises primarily Supio, a Seattle/San Francisco-based platform founded in 2021 that, like EvenUp,
              focuses on plaintiff PI law firms with demand drafting, medical chronologies, intake-to-settlement
              workflow, and mass torts. No other independently funded PI-specific AI company of similar scale has been
              identified as of May 2026; Darrow AI operates in legal exposure management upstream of litigation and is
              not a direct demand- workflow competitor.

              Category two—workflow-platform incumbents—comprises the case management systems (CMS) that PI firms
              already use: Filevine (enterprise/mid-market), Litify (Salesforce-native, enterprise PI), Clio (SMB and
              mid-market), CasePeer (PI-specialist SMB CMS), and SmartAdvocate (PI/workers' comp specialist,
              mid-market). Each has launched or expanded AI features in 2024–2026, including AI medchrons, demand
              drafting assistants, and agentic intake workflows. Their structural advantage is deep data access and
              daily workflow ownership; their disadvantage is that AI is a feature addition rather than the core
              product, and none has trained on a PI-specific dataset of EvenUp's scale.

              Category three—horizontal legal AI platforms—includes Harvey (BigLaw/corporate counsel), CoCounsel
              (Thomson Reuters, litigation and research), and Lexis+ with Protégé (LexisNexis, research and drafting).
              These are well-funded and technically sophisticated, but not calibrated to PI plaintiff workflows,
              contingency-fee economics, or medical-record analysis.

              Category four—general-purpose LLMs—represents the DIY alternative: attorneys using ChatGPT, Claude, or
              similar tools to draft demands without PI-specific training. EvenUp explicitly addresses this threat in
              product positioning: generic LLMs lack PI case data, HIPAA-compliant data isolation, and line-level
              citation traceability.

              Category five—manual status-quo substitutes—remains the largest "competitor" by revenue displaced:
              in-house demand writers, paralegals, and offshore legal-support vendors represent the workflows EvenUp
              replaces, with manual demand drafting requiring five to twenty hours per demand letter.
