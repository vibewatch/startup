      - number: '3.2'
        title: Direct PI AI Competitors
        blocks:
          - type: paragraph
            body: >
              Supio is the most direct and best-resourced PI AI competitor to EvenUp. Founded in 2021 by Jerry Zhou
              (CEO) and Kyle Lam (CTO) in Seattle, with a San Francisco office opened in early 2026, Supio describes
              itself as "the only agentic legal AI platform built for plaintiff law and mass torts cases." Its May 2026
              launch of Supio Agent—covering both case-level and firm-level agentic workflows—and its April 2026
              partnership with Thomson Reuters for Westlaw Advantage access position it as a capable full-spectrum
              rival. Supio offers medical chronologies, demand preparation, intake-to-settlement workflows, Case Bench
              for litigation, and firm-level analytics. Its pricing model offers two tiers (Case Subscription for volume
              firms; Unlimited Firm Access for the lowest per-case cost) with no lock-in contracts or platform fees,
              directly paralleling EvenUp's per-case pricing shift announced in May 2025.

              Supio's website states "join hundreds of personal injury firms" as of May 2026—meaningfully fewer than
              EvenUp's 2,000+, suggesting Supio is roughly 5–10× smaller by customer count. Supio has not disclosed
              venture funding publicly; its product cadence (Supio Agent, Supio Intake, Thomson Reuters integration, SF
              office opening in February 2026) indicates ongoing investment in go-to-market and product. Supio's
              distinguishing positioning is that its platform was built natively for agentic workflows rather than
              retrofitting AI onto document generation.

              Supio's Thomson Reuters/Westlaw Advantage integration (announced April 2026) is a strategic
              differentiation: by embedding verified legal-citation capability directly in the platform, Supio addresses
              the AI-hallucination risk in legal citations that EvenUp has not yet matched with an external database
              integration. EvenUp provides line-level citations to source documents (HIPAA-compliant and highly accurate
              for medical facts), but does not integrate a verified external legal-citation database. This gap may
              matter to compliance- sensitive large firms as courts impose stricter AI disclosure requirements in 2026.

              Beyond Supio, no other independently funded PI-specialist AI company of comparable scale has been publicly
              identified. Darrow AI focuses on legal exposure management upstream of litigation—surfacing regulatory
              risk and litigation signals before harm materializes—and is not a direct PI plaintiff demand-workflow
              competitor. The effective direct-peer competitive set is therefore EvenUp (scale leader) versus Supio
              (agentic-native challenger).
