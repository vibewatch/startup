  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >
              EvenUp's primary customers are US personal injury law firms of all sizes, from solo practitioners and
              regional boutiques to large multi-state operations and Top-100 national firms. As of May 2026 the company
              serves more than 2,000 firms—a figure confirmed across the LawNext PLAAS launch article, the Above the Law
              $2B profile, and EvenUp's own platform messaging—representing roughly 30% of the top 100 PI firms by case
              volume. The customer mix skews toward the mid-to-large segment: named case studies feature firms with 50
              to 180+ attorneys and staff (Mama Justice, John K. Zaid & Associates, J&Y Law, ELG Injury Lawyers), while
              the long tail of smaller firms contributes to breadth of coverage.

              Within firms the platform serves multiple roles. Founding attorneys and managing partners make the
              adoption decision; COOs and legal ops leaders drive change management and integration; paralegals and case
              managers are the daily power users for demand drafting, medical management, and communication agents; and
              demand writers and settlement negotiators use AI Drafts and Negotiation Sheets. This multi-role deployment
              is important: it means upsell and expansion can occur within a single firm account as headcount grows or
              product suite broadens, reducing dependence on net-new firm acquisition for revenue growth.

              Geographic coverage is national. Documented customers span Oregon and Florida (ELG), Texas (John K. Zaid),
              Mississippi, Alabama and Tennessee (Mama Justice), California (J&Y Law, Fielding Law, Lerner and Rowe),
              and other markets. The majority of customers operate in the pre-litigation phase where demand letter
              volume is highest, but growing litigation-stage usage (J&Y Law uses AI Playbooks for deposition-ready
              facts and discovery automation) extends the addressable workflow. Channel-dependent acquisition through
              CMS integrations—Filevine, Litify, SmartAdvocate, CasePeer—connects EvenUp to the existing technology
              stacks of PI firms, providing a distribution multiplier but also a channel concentration risk.
