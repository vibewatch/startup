      - number: '1.3'
        title: Products, Technology, and Platform
        blocks:
          - type: paragraph
            body: >-
              EvenUp's flagship offering is the Claims Intelligence Platform, a suite of AI-powered tools designed to
              automate the pre-litigation workflow for personal injury law firms. At its core is Piai™, EvenUp's
              proprietary AI model trained on hundreds of thousands of PI cases, which drives automated medical record
              analysis, damages quantification, and demand letter drafting. As of May 2025, the company launched the AI
              Drafts Suite, bundling Smart Workflows, Medical Bill Summary, and Express Demands under a per-case pricing
              model. Additional products include Mirror Mode (which adapts output to firm style), Case Companion (an
              in-case AI assistant), Voice Agent (for client intake), and AI Playbooks (standardized firm-level
              automation). In December 2025, EvenUp added Medical Management, a tool that identifies treatment gaps in
              ongoing PI cases to help attorneys optimize client recoveries. The most recent product launch — announced
              in May 2026 — is PLAAS (Pre-Litigation as a Service), in which EvenUp effectively acts as an outsourced
              legal operations partner rather than merely a software vendor. PLAAS generated $10M in pre-sold
              subscriptions at launch, signaling strong demand for a higher-touch service model. The platform enforces
              SOC 2 Type II and HIPAA controls throughout the data pipeline.
