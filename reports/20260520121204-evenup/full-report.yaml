      - number: '7.2'
        title: Operational & Quality Risk
        blocks:
          - type: paragraph
            body: >-
              EvenUp's core product risk is AI-output quality: medical-chronology errors, hallucinated treatment dates,
              inflated or incorrect damages calculations, and OCR ingestion failures on low-quality medical-record
              scans. The company acknowledges that general-purpose LLMs hallucinate and emphasises its human-reviewer
              layer and proprietary feedback loop as mitigations. Its 2025 benchmarks report found PI firms miss an
              average of five documents per 10 cases before EvenUp, and that EvenUp's Missing Docs Check delivers a 75%
              reduction; this implies residual error rates that could still cause material under-valuation in a minority
              of cases.


              PLAAS magnifies operational risk: as EvenUp staffs 300+ legal-ops personnel (per company claims) to manage
              outsourced pre-litigation workflows, quality control depends on human reviewers scaling proportionally to
              case volume. Any reviewer-to-case-load deterioration produces systematic downstream errors. Cloud and
              infrastructure outages affecting the SaaS platform — authentication failures, API downtime, third-party
              model provider interruptions — can halt demand-letter production for client firms with time-sensitive
              deadlines (statutes of limitations, adjuster response windows). EvenUp's DPA requires breach notification
              within 72 hours but does not guarantee uptime. Security incidents — ransomware targeting a legal-tech
              platform holding PHI and confidential case strategy — would trigger HIPAA breach reporting, potential OCR
              fines, and severe reputational harm with firm clients.
            claimRefs:
