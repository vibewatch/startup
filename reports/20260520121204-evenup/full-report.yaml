          score: 4
          maxScore: 5
          detail: $61.7B US PI market; $3.11B and growing legal AI software market
        - label: Customer proof
          score: 4
          maxScore: 5
          detail: 2,000+ firms; 30% top-100; $14B+ damages; $10M+ PLAAS sales validated
        - label: Competitive moat
          score: 3
          maxScore: 5
          detail: Proprietary dataset strong; commoditization risk from Harvey/OpenAI moderate
        - label: Unit economics
          score: 1
          maxScore: 5
          detail: No ARR/margin disclosed; PLAAS cost structure opaque; blocking for full pass
        - label: Risk profile
          score: 2
          maxScore: 5
          detail: 'High: HIPAA/ethics, legal-ops cost floor, RELX conflict, AI commoditization'
        - label: Valuation discipline
          score: 2
          maxScore: 5
          detail: Expensive at $2B+ without disclosed ARR; multiple range 13-40x unverifiable
        - label: Evidence quality
          score: 3
          maxScore: 5
          detail: Strong qualitative evidence; financial opacity limits quantitative judgment
    approximationNotes: Scores are analyst judgment (1=poor, 5=excellent) based on publicly available evidence as of 2026-05-20.
