      - number: '6.4'
        title: Retention and Durability
        blocks:
          - type: paragraph
            body: >
              EvenUp has disclosed no public NRR, GRR, or customer churn data, making direct retention measurement
              impossible. Durability must therefore be inferred from proxies: multi-year customer longevity,
              multi-product expansion within existing accounts, and growing top-100 firm penetration. The longevity
              signal is meaningful: ELG Injury Lawyers has been an active customer for more than four years (May 2021 to
              May 2026), and J&Y Law explicitly expanded from an earlier Demands-only engagement to EvenUp's full
              platform suite, indicating upsell success within existing accounts. John K. Zaid & Associates described
              EvenUp as "more than a technology provider—it's a long-term partner," with Zaid citing the company's
              evolving roadmap commitment as the basis for sustained trust and broad internal adoption.

              Product architecture creates structural switching costs. PLAAS—which embeds EvenUp's US-based case
              management staff directly into firm pre-litigation workflows—creates a significantly higher exit barrier
              than SaaS-only tools. Once a firm migrates case lifecycle management to a managed-service model, replacing
              the provider requires both technology migration and operational rebuilding. CMS integrations with
              Filevine, Litify, SmartAdvocate, and CasePeer further entrench EvenUp within existing technology
              ecosystems. In July 2025, EvenUp's analysis of 200+ firms found that 30% engage in follow-up prompting to
              refine AI outputs—indicating interactive, habitual usage rather than passive consumption.

              The absence of disclosed retention metrics is the chapter's central diligence gap. Without NRR or GRR, it
              is impossible to assess whether the 2,000+ firm count represents net additions with high gross retention
              or rapid gross additions masking significant churn in the long tail of smaller firms. The Pioneer Awards
              and Customer Advisory Board programs address retention risk among top accounts but do not speak to the
              broader base. Contract length, renewal rates, and cohort-level expansion percentages remain unknown.
