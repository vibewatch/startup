chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Mission
        blocks:
          - type: paragraph
            body: >-
              EvenUp was founded in late 2019 in San Francisco, California, by three co-founders with complementary
              legal, operational, and technical backgrounds. The company's stated mission is to level the playing field
              for personal injury claimants — a motivation rooted in CEO Rami Karabibar's personal experience with a
              family member's PI case, where he observed first-hand how resource-constrained law firms struggle to
              marshal the evidence and documentation needed to achieve fair settlements. EvenUp's platform sits at the
              intersection of legal technology and AI-powered workflows, offering PI firms an end-to-end suite for case
              intake, medical record analysis, damages quantification, and demand letter generation. The company is
              incorporated and headquartered in San Francisco and employs a flexible hybrid work model. EvenUp operates
              in the broader legal AI and legaltech market, which has attracted significant institutional capital
              following the generative AI wave of 2023–2025. EvenUp holds SOC 2 Type II and HIPAA compliance
              certifications, enabling deployment in law firm environments where client data privacy is a core
              requirement. The company is privately held and has not disclosed annual revenue; it operates as a
              high-growth, late-stage venture-backed startup with unicorn-plus ($2B+) valuation status.
