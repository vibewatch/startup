        title: Financial & Model Risk
        blocks:
          - type: paragraph
            body: >-
              EvenUp is private and does not disclose ARR or burn rate, creating opacity for investors. With $385M
              raised at a $2B+ valuation (Series E October 2025), the company has a $385M capital base, but PLAAS —
              which involves staffing 300+ legal-ops personnel — is fundamentally more capital- and headcount-intensive
              than pure SaaS, compressing gross margins. If gross margins settle below 50% (plausible for a
              managed-services hybrid), the business requires significant revenue scale to fund continued R&D and AI
              infrastructure.


              Per-case pricing creates revenue volatility tied to PI caseload, which correlates with economic cycles,
              litigation trends, and insurance-adjuster practices. If insurance companies adapt to AI-generated demand
              letters by systematically discounting or scrutinising EvenUp-style documents, the revenue per case could
              erode. Competition from Harvey (valued at $11B in 2026), Anthropic and OpenAI entering legal verticals,
              and well-capitalised incumbents like Thomson Reuters (CoCounsel) and LexisNexis could price-compress the
              market. Future financing risk is real: a valuation correction or AI-sector downturn could impair the
              ability to raise at current terms, and the company has not disclosed a path to profitability.
