      - number: '8.5'
        title: Thesis-Break Triggers and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              The EvenUp investment thesis rests on three structural claims: (1) EvenUp is the durable category leader
              in PI legal AI with a self-reinforcing data moat, (2) PLAAS creates a new high-value revenue line that
              converts fixed labor cost into subscription revenue, and (3) the company has a credible path to IPO or
              strategic exit at a valuation that justifies the $2B+ Series E price. All three are consistent with
              available public evidence but none is independently verifiable without confidential financial disclosure.


              The primary thesis-break triggers are: (a) PLAAS gross margin below 45%, indicating the managed-services
              component cannot absorb legal-ops labor cost at scale; (b) customer churn above 15% annually for top-100
              PI firms, signaling that product lock-in is weaker than represented; (c) a competitive entrant (Harvey,
              OpenAI, or Filevine) deploying a materially comparable PI demand-letter workflow at substantially lower
              cost, undermining EvenUp's per-case pricing power; and (d) a material HIPAA breach or attorney-ethics
              enforcement action affecting EvenUp or a customer firm using EvenUp AI output, which could trigger
              regulatory and reputational damage that accelerates churn.


              The Supio AI competitor blog explicitly highlights the hallucination risk in legal AI and the importance
              of source-linked verification—the same quality risk that applies to EvenUp's demand-letter and medical
              chronology outputs. While EvenUp claims a human-reviewer layer as its quality mitigation, the Mata v.
              Avianca sanctions case (S.D.N.Y. 2023) established that attorney supervision does not insulate AI vendors
              from reputational harm when output errors surface in court. A single high-profile adversarial legal
              challenge to an EvenUp- generated demand letter could accelerate customer scrutiny and lengthen PLAAS
              sales cycles.


              The final diligence asks are: audited ARR and gross-margin disclosure (at minimum for the trailing twelve
              months before Series E close); PLAAS unit economics (revenue per firm per year, gross margin per PLAAS
              subscriber, legal-ops headcount per contract, and case yield per staff member); customer net revenue
              retention for both the SaaS and PLAAS lines; the governance terms of RELX/REV's investment (anti-compete
              provisions, data-sharing rights, right-of-first-offer); and the IP ownership and licensing structure for
              the Piai model (particularly any third-party LLM provider dependencies, fine-tuning data rights, and
              portability provisions that would survive a change of control). Without these five data sets, a full pass
              at $2B+ cannot be supported with the evidence available as of May 2026.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
