      - number: '6.2'
        title: Adoption Trajectory
        blocks:
          - type: paragraph
            body: >
              EvenUp's documented customer growth follows a clear acceleration curve tied to major funding milestones
              and product launches. ELG Injury Lawyers became the company's second customer in May 2021, establishing an
              early adoption inflection point. By October 2024, at the Series D announcement, EvenUp disclosed serving
              1,000+ firms—a threshold the company cited as evidence of product-market fit at scale. The AI Drafts Suite
              launch in May 2025 catalyzed the next cohort: EvenUp reported 1,500+ firms at that launch, representing
              50% customer growth within approximately seven months. By October 2025 the company had crossed 2,000+
              firms (confirmed across the Series E coverage and the Unite.ai COO interview), a number maintained as of
              the May 2026 PLAAS launch disclosure.

              Case throughput grew in parallel with firm count. By October 2025, EvenUp had resolved over 200,000
              cumulative PI cases (COO Raymond Mieszaniec, Unite.ai interview), generating more than $10B in victim
              recoveries at that point. As of May 2026, weekly case throughput stands at 10,000+ cases per week,
              representing $14B+ in aggregate damages across the platform. These volume metrics indicate that average
              case load per firm has increased alongside firm count—consistent with deeper penetration into existing
              customer workflows rather than purely new-firm-driven growth.

              The Lightspeed portfolio profile confirms EvenUp reached $10M ARR within two years of founding, an early
              indicator of rapid go-to-market traction. In July 2025, EvenUp analyzed thousands of AI interactions
              across more than 200 firms, finding that 69% of prompts focused on medical treatment analysis and injury
              assessment and 30% of firms engaged in follow-up prompting—evidence of deep, interactive platform usage
              rather than surface-level adoption. The PLAAS launch in May 2026 generated $10M+ in subscription sales
              during early testing, adding a managed-services revenue vector on top of the existing per-case SaaS base.
