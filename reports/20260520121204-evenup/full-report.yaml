      - number: '2.4'
        title: Growth Drivers
        blocks:
          - type: paragraph
            body: >
              The most structural driver is the contingency fee model itself: PI attorneys are paid only on case
              resolution and earn a percentage of the settlement, meaning every hour of associate or paralegal time
              saved on administrative tasks directly improves firm profitability. Unlike hourly-billed firms where AI
              savings partially reduce revenue, PI firms capture AI efficiency gains entirely as margin or capacity to
              take more cases. EvenUp's customer testimonials consistently reflect this dynamic: one Houston firm
              reported 300% settlement improvement, another reported saving 3,500 hours and a 34% increase in demand
              efficiency.

              A second driver is medical-record volume: per EvenUp's platform analysis, 43% of PI cases experience
              treatment gaps longer than 30 days that weaken claim value, and 16.8% develop a 30-day gap within the
              first three months. Managing these gaps manually is labor-intensive; AI-assisted monitoring directly
              converts to case value preserved. Insurance companies have also grown more sophisticated in claims
              processing, requiring better-documented demands to set reserves accurately—creating demand for
              higher-quality, data-backed demand packages.

              The legal AI investment climate also supports market growth. EvenUp's October 2025 Series E ($150M at $2B+
              valuation, led by Bessemer and RELX/REV) and broader legal-tech investment trends confirm that capital is
              available to fund go-to-market expansion. Labor shortages in legal support roles have intensified since
              2020, accelerating appetite for automation.
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
              - CM039
          - type: table
            tableRef: TM004
