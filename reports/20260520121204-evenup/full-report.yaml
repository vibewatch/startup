      - number: '3.3'
        title: Workflow-Platform Incumbents
        blocks:
          - type: paragraph
            body: >
              The five major PI-oriented case management systems—Filevine, Litify, Clio, CasePeer, and
              SmartAdvocate—represent EvenUp's integration partners and potential platform-encroachment rivals
              simultaneously. Each has launched AI capabilities in 2024–2026 that encroach on segments of EvenUp's core
              workflow.

              Filevine is the largest enterprise legal AI platform in this group. Its LOIS AI layer provides
              medical-record analysis (FilevineAI for medchrons, April 2025), court-reporting and deposition-management
              (August 2025), deadline management (October 2025), document generation, and real-time matter analysis.
              Filevine's 2026 positioning as the "2026 Legal AI Trust Index" platform argues that AI trust comes from a
              firm's own data and workflows— a direct counter-positioning to EvenUp's specialized-dataset thesis.
              Filevine's pricing is fully custom-built per team, indicating enterprise sales motion.

              Litify (Salesforce-native) targets enterprise PI firms with its Plaintiff Practice Management module,
              augmented by "Litify ACE" (Agentic Case Expert): AI intake agents, source-linked medical chronologies,
              demand packet drafting, case-value forecasting, and settlement scenario modeling. Litify's Salesforce
              lineage provides strong enterprise integration and analytics, but creates higher implementation lift for
              SMB firms.

              Clio dominates the SMB legal practice management market across all practice areas including PI. Clio's
              2025/2026 product expansion includes Clio Work (AI matter analysis, research integration, drafting
              grounded in case facts and law), Clio Draft (document automation), and its acquisition of CasePeer
              (PI-specialist CMS). Clio Work's positioning as "the only AI that understands your cases, their context,
              and the law" directly overlaps with EvenUp's platform vision, though Clio's training is
              cross-practice-area rather than PI-specific. Clio's 250+ integration ecosystem and widespread SMB adoption
              create natural distribution for its own AI features.

              CasePeer is a PI-specialist CMS (Clio subsidiary) with a turnkey SMB value proposition. Its AI
              capabilities follow Clio's product roadmap rather than PI-specific training. SmartAdvocate offers
              SmartIntelligence (built-in AI for case summarization, medical-record analysis, email polishing,
              translation, and transcription) and currently integrates with EvenUp—per EvenUp's own blog—while adding
              its own native AI capabilities.

              The key strategic tension: EvenUp integrates with Filevine, Litify, CasePeer, and SmartAdvocate to power
              its AI workflows via CMS data access. As these CMS platforms add proprietary AI features that replicate
              EvenUp's core capabilities, their incentive to maintain integration openness declines. This creates a
              platform-dependency risk that is compounded by each CMS vendor's ability to leverage the same case data
              with lower incremental cost.
