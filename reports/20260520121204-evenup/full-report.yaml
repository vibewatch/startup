      - number: '5.5'
        title: Trust, Security, and Regulatory Compliance
        blocks:
          - type: paragraph
            body: >
              EvenUp handles Protected Health Information (PHI) across tens of thousands of active cases, creating a
              material compliance surface. Its published Data Processing Agreement (DPA) documents the contractual
              framework for personal data handling and describes Schedule 2 Technical Measures that govern PHI
              protection.

              EvenUp commits to executing a Business Associate Agreement (BAA) covering HIPAA obligations for firms
              operating in a healthcare data context. Under the DPA, EvenUp processes personal data solely at the
              customer's instruction, does not sell or share customer personal data with third parties beyond disclosed
              subprocessors, and provides data deletion upon contract termination. Security incident notification is
              contractually required within 72 hours of discovery. EvenUp makes SOC 2-equivalent third-party audit
              reports available to customers upon request under its DPA audit rights provisions.

              Technical security controls documented in the DPA include: logical data segregation and role-based access
              controls; encryption for customer personal data at rest and in transit; enterprise firewall and intrusion
              detection infrastructure; change management procedures; and business continuity and disaster recovery
              procedures. Customer authentication credentials are the customer's responsibility under the DPA.

              The ABA Model Rule 1.1 (Competence) and state bar guidance on technology competence require attorneys to
              understand and supervise AI tools used in client representations. This creates a structural compliance
              obligation for EvenUp's firm customers, not for EvenUp directly, but EvenUp's human review layer and
              line-level citation system are the primary product mechanisms enabling attorney supervision of AI outputs.
            claimRefs:
