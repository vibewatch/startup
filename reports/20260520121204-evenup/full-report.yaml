      - number: '7.6'
        title: Mitigations, Monitoring, & Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              EvenUp has several structural mitigations in place: (1) BAAs and a published DPA covering CCPA and
              data-processing obligations, with breach notification within 72 hours; (2) a human-reviewer layer (legal
              ops + attorney sign-off) interposed between AI output and client delivery; (3) a proprietary feedback loop
              ingesting thousands of daily expert corrections to re-train domain models; (4) vertical specialisation in
              PI (rather than general legal AI) that reduces hallucination rates relative to general-purpose LLMs; (5)
              multiple CMS integrations reducing single-platform lock-in.


              Despite these mitigations, several thesis-break triggers would materially impair the investment case: (a)
              a confirmed HIPAA breach at scale triggering OCR fines and client attrition; (b) a court sanction or bar
              complaint naming EvenUp AI output as the proximate cause of attorney misconduct, generating adverse
              precedent that triggers firm-wide adoption bans; (c) a strategic shift by Filevine or Clio to bundle
              competing demand-generation AI natively, disintermediating EvenUp at point of intake; (d) RELX/LexisNexis
              using its board access to replicate EvenUp's PI dataset and launch a competing product under the
              LexisNexis brand; (e) gross margins persistently below 40% as PLAAS scales, signalling the business cannot
              achieve SaaS-like economics. Monitoring indicators include OCR complaint filings naming EvenUp,
              bar-association guidance explicitly flagging AI demand-letter services, CMS platform pricing or API-policy
              changes, and RELX public statements about PI product expansion.
