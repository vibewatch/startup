  - id: TE003
    title: 'Piai™ Architecture: Layer, Role, Dependency, and Risk'
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Technical Risk
    rows:
      - - Reading Layer — OCR & document normalization
        - Converts PDFs, scans, handwriting, tables, images to normalized text with structure preserved
        - Document quality at intake; CMS upload completeness
        - Poor-quality scans or non-standard medical record formats degrade downstream extraction accuracy
      - - Reading Layer — Entity extraction models
        - >-
          Extracts case entities (provider names, ICD codes, dates, treatments, amounts) using specialized models per
          entity type
        - Daily user correction data stream (thousands of edits/day)
        - >-
          Entity model drift if correction signal volume drops; single-entity model failure propagates to all downstream
          documents citing that entity
      - - Reading Layer — Multi-modal RL pipeline (image summarization)
        - >-
          Converts accident diagrams, radiology images to persistent structured text summaries using PPO reinforcement
          learning
        - Vision-language model for grounded Q&A supervision; compute for RL training cycles
        - >-
          Edge cases (unusual diagram formats, novel injury types) may produce low-confidence summaries that propagate
          silently
      - - System of Record (SoR)
        - Persistent normalized case-entity store with provenance graph, correction ledger, and relationship timelines
        - Schema evolution management; entity linking accuracy across provider name variants
        - >-
          Schema changes across millions of historical cases create migration risk; correction-ledger integrity critical
          for model training quality
      - - Writing Layer — Grounded document generation
        - >-
          Drafts legal documents (demands, complaints, interrogatories) from SoR facts rather than open LLM world
          knowledge
        - Reading Layer accuracy (garbage in → garbage out); line-citation traceability infrastructure
        - >-
          Foundation model commoditization narrows moat; over-constrained generation may produce stilted language at the
          margins
      - - Human review layer (100+ staff)
        - Validates Piai™ outputs before delivery; corrections feed back into Reading Layer model retraining
        - US-based staffing scalability; training quality consistency across growing team
        - PLAAS growth requires linear headcount expansion; quality dilution risk if hiring outpaces training
    notes: >-
      Architecture described based on EvenUp's published blog post 'Building Trustworthy, Scalable Document AI for Legal
      Tech' (Haixun Wang, VP Engineering/Head of AI) and Piai™ product page. Technical risks are author assessments
      based on system design patterns described.
    claimRefs:
      - CE017
      - CE018
      - CE019
      - CE020
      - CE021
      - CE023
      - CE031
