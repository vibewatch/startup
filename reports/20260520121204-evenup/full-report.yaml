  - id: FE002
    title: 'EvenUp PLAAS Operating Flow: Intake to Resolution'
    type: flow
    layout: wide
    summary: >-
      End-to-end case lifecycle flow showing how Piai™ AI layers and human review interact from CMS intake through
      settlement.
    data:
      nodes:
        - id: intake
          label: Case Intake & CMS Sync
          details: >-
            Firm submits case; CMS auto-syncs client data, policy numbers, intake transcripts into EvenUp in <1 business
            day
        - id: ingest
          label: Piai™ Record Ingestion
          details: >-
            Reading Layer OCRs PDFs, scans, handwriting; extracts medical entities, ICD codes, treatment timelines,
            accident diagrams into System of Record
        - id: analyze
          label: AI Playbooks™ Auto-Analysis
          details: >-
            Playbooks scan each new document upload; flags liability gaps, TBI indicators, missing records, and
            high-value case signals without attorney prompting
        - id: medmgmt
          label: Medical Management & Communication Agents
          details: >-
            Medical Management tracks real-time treatment; Comms Agents check in with clients via voice/SMS; gaps and
            missed appointments surfaced to case managers
        - id: draft
          label: AI Drafts™ Generation
          details: >-
            Writing Layer generates demands, complaints, interrogatories grounded in SoR facts; every claim linked to
            source document/page/line via Smart Citations
        - id: review
          label: Human QA & Expert Review
          details: >-
            100+ nurses, paralegals, adjusters validate AI outputs; corrections feed back into Reading Layer model
            retraining; line-level citation review by attorney
        - id: negotiate
          label: Negotiation Preparation
          details: >-
            Case Companion™ provides real-time case Q&A; Settlement Repository benchmarks comparable settlement outcomes
            by injury/treatment/policy
        - id: resolve
          label: Settlement / PLAAS Resolution
          details: >-
            Firm settles or litigates; PLAAS subscribers have EvenUp staff handle claim negotiation and optional lien
            resolution end-to-end
      edges:
        - from: intake
          to: ingest
          label: CMS sync
        - from: ingest
          to: analyze
          label: SoR populated
        - from: analyze
          to: medmgmt
          label: Case strategy flags
        - from: medmgmt
          to: draft
          label: Treatment verified
        - from: draft
          to: review
          label: AI draft queued
        - from: review
          to: negotiate
          label: Reviewed demand delivered
        - from: negotiate
          to: resolve
          label: Negotiation prepared
    approximationNotes: >-
      PLAAS flow shown for managed-service clients; SaaS-only clients exit at 'review → negotiate → resolve' without
      EvenUp staff involvement beyond AI output delivery.
    claimRefs:
      - CE004
      - CE011
      - CE016
      - CE022
      - CE031
