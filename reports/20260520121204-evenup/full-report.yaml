      - number: '6.5'
        title: Expansion and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              EvenUp's land-and-expand motion is visible across all documented customer case studies: firms begin with
              Demands or Express Demands and progressively adopt Medical Management, AI Playbooks, Communication Agents,
              Companion, and Executive Analytics as operational confidence grows. J&Y Law's trajectory—from Demands only
              to full-platform with custom AI Playbooks for litigation discovery—exemplifies this pattern. PLAAS
              represents the deepest expansion stage: a managed-services subscription that converts EvenUp from a
              software vendor into an outsourced operations partner, with early testing generating $10M+ in subscription
              sales as of May 2026.

              Concentration risk exists at multiple levels. Top-100 PI firm penetration (30%) means a significant share
              of case volume and likely revenue is concentrated among large clients; losing even a handful of top-100
              accounts would have disproportionate impact on key metrics. Channel dependence on CMS partners—Filevine,
              Litify, SmartAdvocate, CasePeer—means that changes to those platforms' integration policies, pricing, or
              competitive positioning could disrupt customer acquisition pipelines. EvenUp's own product expansion into
              PLAAS may also canibalize referral relationships with legal finance partners if the managed-services model
              overlaps with third-party pre-settlement financing offerings.

              Multi-homing risk is real. Competitors Supio and Filevine AI target the same PI workflow and are building
              comparable document-generation and case-management capabilities. Supio's blog post explicitly critiques
              general-purpose AI accuracy and positions Westlaw integration as a differentiator—a direct competitive
              wedge. Smaller PI firms facing tight margins may adopt multiple platforms simultaneously rather than
              committing exclusively to EvenUp, particularly given the per-case pricing model where incremental case
              volume on a competing tool has low switching cost. Insurance adjuster adaptation poses an additional
              systemic risk: as AI-generated demand letters become ubiquitous, adjusters may develop counter-measures
              that reduce the negotiating premium that firms currently derive from EvenUp's data-grounded demands.

              The LawNext PLAAS launch article raised a pointed question about whether PLAAS "represents a genuinely new
              category or a repackaging of existing services with an AI wrapper"—a framing that underscores the
              diligence requirement to validate PLAAS outcomes at scale over a longer horizon before treating its $10M
              early sales figure as durable ARR evidence.
