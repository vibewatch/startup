            title: EvenUp's Greatest Competitive Risk Is Its Own Integration Partners
            body: >
              EvenUp's go-to-market strategy depends critically on deep integration with CMS platforms— Filevine,
              Litify, CasePeer, and SmartAdvocate—to access the case data that powers its AI. These same platforms are
              rapidly adding AI features that replicate EvenUp's core capabilities: Filevine added medchron generation
              in April 2025; Litify launched ACE (agentic intake and demand) in 2025; Clio launched Clio Work (full AI
              matter analysis) in late 2025; SmartAdvocate has SmartIntelligence built-in. As each CMS platform's AI
              depth increases, its incentive to maintain open integration with EvenUp—a direct competitor for AI wallet
              share—declines. EvenUp's defense is its proprietary dataset advantage and workflow depth, but the
              structural conflict between "integration partner" and "competitor" will sharpen over the next two to three
              years and represents the highest-severity moat risk in the competitive landscape.
