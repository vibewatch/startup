        title: Exhibits
        blocks:
          - type: callout
            title: Dominant early-mover advantage in PI legaltech
            body: >-
              With 30% penetration of the top 100 US PI firms and 200,000+ cases resolved, EvenUp has established a
              flywheel that is difficult for entrants to replicate: each incremental case improves Piai™ model quality,
              and the 300+ legal ops team provides a human-review backstop that pure-software competitors cannot easily
