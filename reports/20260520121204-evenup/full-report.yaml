  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Claims Intelligence Platform: Product Suite and Module Map'
        blocks:
          - type: paragraph
            body: >
              EvenUp's Claims Intelligence Platform™ is the commercial surface through which Piai™ capabilities reach PI
              law firms. As of May 2026, the platform encompasses twelve distinct modules spanning the full
              pre-litigation case lifecycle from intake through settlement negotiation.

              Express Demands™, introduced January 2025, was EvenUp's first AI Draft template and generates
              professionally formatted demand letters drawn directly from case-file content. The broader AI Drafts
              Suite™ launched in May 2025 and extends demand generation to complaints, medical summaries, negotiation
              sheets, and responses to interrogatories—all grounded in case-file data rather than open-domain LLM
              generation. Smart Workflows accompanies AI Drafts™ and provides data-driven case lifecycle automation: it
              monitors case events, computes demand-readiness based on EvenUp's proprietary dataset (which shows 42% of
              demands are sent more than 100 days after last treatment), and triggers staff alerts when conditions are
              met. Medical Bill Summary automates charge tracking and validates expenses against policy limits within
              Case Financials.

              MedChrons™ organizes raw medical records into interactive, professionally reviewed chronologies that
              attorneys can navigate and interrogate. Medical Management, launched December 2025, extends the chronology
              into a real-time treatment-tracking system: it surfaces gaps (EvenUp data shows 43% of PI cases experience
              30-day treatment gaps) and powers AI Communication Agents™ that conduct automated client check-ins via
              voice and SMS.

              AI Playbooks™ (launched July 2025) auto-analyzes newly uploaded case files to surface liability flags, TBI
              indicators, commercial defendants, and coverage issues without attorney prompting. Case Companion™ is an
              AI assistant that answers questions against raw case documents with line-level citations. Settlement
              Repository™ ingests the firm's historical settlement data and benchmarks outcomes against comparable cases
              using Piai™ injury/treatment/policy matching. Executive Analytics™ provides firm-level KPI dashboards
              filterable by time, office, role, and individual staff.

              Voice Agent™ is available in early access as a 24/7 conversational AI for client outreach across the full
              case lifecycle. PLAAS (Pre-Litigation as a Service), launched May 2026, is a managed-services subscription
              that combines Piai™ automation with US-based EvenUp case management staff for the complete pre-litigation
              workflow.

              Pricing transitioned in May 2025 to a per-case model: one all-inclusive price for the full Claims
              Intelligence Platform replaces prior feature-tier licensing. PLAAS is priced as a separate subscription
              covering all firm cases through pre-litigation.
