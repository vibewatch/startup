      - number: '2.2'
        title: Market Sizing Lenses
        blocks:
          - type: paragraph
            body: >
              No analyst firm publishes a standalone market-size estimate for PI plaintiff legaltech AI. Two top-down
              lenses from the broader legal AI market are available and exhibit meaningful divergence: Grand View
              Research sized the global legal AI market at $1.45 billion in 2024 with a projected CAGR of 17.3% to $3.90
              billion by 2030, anchored in eDiscovery, legal research, and contract review. MarketsandMarkets reported
              the legal AI software market at $3.11 billion in 2025 with a CAGR of 28.3% to $10.82 billion by 2030—a
              substantially broader boundary that includes generative AI agents and industry-specific drafting tools.
              The gap between these two estimates reflects definitional differences rather than empirical disagreement,
              and both should be treated as upper-bound reference points rather than PI-specific sizing.

              A bottom-up estimation for the US PI sub-market begins with scale indicators: BLS reports 864,800 licensed
              lawyers in the US (2024), a fraction of whom specialize in PI plaintiff work. EvenUp's own data implies
              approximately 30,000–60,000 active PI plaintiff attorneys (based on "thousands of firms" and "2,000+
              firms" served). Assuming a rough SAM of 30,000 PI firms addressable by AI-first platforms, with ARPU of
              roughly $5,000–$20,000 per year, yields a US PI AI SAM of $150M–$600M at current price points. EvenUp's
              2026 PLAAS launch, which generated $10M+ in early subscriptions, suggests pricing traction at the higher
              end of this range for managed-service offerings. These estimates contain significant uncertainty and
              should be treated as illustrative rather than definitive. The absence of a published PI-specific market
              size is itself a material evidence gap, preserved here as a diligence ask rather than a resolved figure.
