      - number: '4.3'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >
              EvenUp's cost profile is materially different from a pure-software SaaS company because of its 300+
              US-based legal operations headcount, which forms the backbone of both its PLAAS offering and its ongoing
              dataset and quality-assurance operations. This labor-intensive component creates structural gross margin
              pressure that is unusual among AI startups raising at a $2B+ valuation.

              At the time of the Series D (October 2024), EvenUp disclosed that its workforce had doubled in the prior
              twelve months and that it employed approximately 100+ engineers and product professionals. The 300+ legal
              operations team is explicitly US-based, which implies fully-loaded annual labor costs in the range of
              $45M–$75M per year at standard US legal operations compensation levels ($100K–$150K fully loaded per
              employee), before accounting for engineering, go-to-market, and infrastructure costs.

              The launch of PLAAS in May 2026 converts the legal operations team from a cost center (QA, dataset
              curation, support) into a revenue-generating managed-services workforce. If PLAAS generates sufficient
              revenue to cover the legal ops team's fully-loaded cost, the unit economics of the underlying SaaS
              platform could approach typical SaaS gross margins (70–80%+). However, if PLAAS adoption is slow or
              pricing fails to cover legal ops cost, EvenUp's blended gross margin will remain significantly below
              pure-software levels.

              AI infrastructure costs—GPU compute for Piai model training and inference across 200,000+ cases—are a
              second significant cost line. EvenUp has not disclosed cloud provider or compute spend. Based on
              comparable legal AI companies, inference costs at 200K+ cases/year could range from $5M–$20M depending on
              model architecture and prompt complexity.

              Compliance and trust investments represent a third cost dimension: SOC2 Type II audits, HIPAA Business
              Associate Agreement (BAA) compliance programs, and the cybersecurity infrastructure needed for PHI
              (Protected Health Information) handling add meaningful overhead relative to non-healthcare SaaS.

              No revenue, gross margin, EBITDA, or burn data has been publicly disclosed for any period. Total capital
              raised ($385M) and late-stage valuation ($2B+) suggest investors are funding substantial ongoing losses
              while scaling toward a defensible long-term margin structure.
