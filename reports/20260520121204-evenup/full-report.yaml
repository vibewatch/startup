        - label: AI Services — Writing Layer (System of Intelligence)
          modules:
            - Express Demands™ document generator
            - AI Drafts Suite™ (complaints, interrogatories, negotiation sheets)
            - Medical Bill Summary generator
            - MedChrons™ chronology renderer
            - AI Playbooks™ case analysis engine
        - label: Communication & Workflow Automation
          modules:
            - Communication Agents™ (voice + SMS)
            - Voice Agent™ (24/7 client outreach)
            - Smart Workflows rules engine
            - PLAAS human-AI case ops layer
        - label: AI Services — Reading Layer (System of Record Build)
          modules:
