company:
  name: "EvenUp"
chapter:
  number: 3
  title: "Competitors"
  summary: >
    EvenUp competes across five distinct categories: (1) direct PI-specialist AI peers—principally
    Supio (founded 2021, Seattle/SF), which mirrors EvenUp's demand-generation and medical-chronology
    focus but competes with an agentic-native architecture and a Thomson Reuters/Westlaw partnership;
    (2) workflow-platform incumbents—Filevine, Litify, Clio, CasePeer, and SmartAdvocate—which
    control deep CMS data and distribution relationships but have only recently added purpose-built
    PI AI modules; (3) horizontal legal AI platforms—Harvey, CoCounsel (Thomson Reuters), and
    Lexis+ with Protégé—which target BigLaw and corporate counsel rather than PI plaintiff firms
    and lack PI training data; (4) general-purpose LLMs (ChatGPT, Claude, Gemini) as a
    do-it-yourself substitute; and (5) the status-quo manual alternative of in-house demand
    writers, paralegals, and offshore legal-support vendors. EvenUp's primary moat is a
    proprietary PI case dataset (250,000+ verdicts/settlements), category-defining brand among
    the top 100 PI firms (30% penetration as of May 2026), and a full-lifecycle platform that
    extends well beyond document drafting to proactive workflow agents. The key commoditization
    risk is that workflow-platform incumbents—already embedded in PI firms' daily operations—add
    AI layers that are "good enough," narrowing EvenUp's standalone value proposition and creating
    channel-conflict risk with its CMS integration partners.

sections:
  - id: "landscape-overview"
    title: "Competitive Landscape Overview"
    body: >
      EvenUp operates in a competitive environment spanning five distinct categories, each posing
      a different type of displacement threat. The market for PI legal operations AI is nascent
      and expanding rapidly: as of 2026, only a handful of purpose-built PI AI platforms exist,
      but the broader legal AI sector is crowded and well-funded, increasing the risk that
      horizontal or adjacent players extend into EvenUp's vertical.

      Category one—direct PI specialist AI peers—is the most proximate competitive threat and
      currently comprises primarily Supio, a Seattle/San Francisco-based platform founded in 2021
      that, like EvenUp, focuses on plaintiff PI law firms with demand drafting, medical
      chronologies, intake-to-settlement workflow, and mass torts. No other independently funded
      PI-specific AI company of similar scale has been identified as of May 2026; Darrow AI
      operates in legal exposure management upstream of litigation and is not a direct demand-
      workflow competitor.

      Category two—workflow-platform incumbents—comprises the case management systems (CMS) that
      PI firms already use: Filevine (enterprise/mid-market), Litify (Salesforce-native,
      enterprise PI), Clio (SMB and mid-market), CasePeer (PI-specialist SMB CMS), and
      SmartAdvocate (PI/workers' comp specialist, mid-market). Each has launched or expanded AI
      features in 2024–2026, including AI medchrons, demand drafting assistants, and agentic
      intake workflows. Their structural advantage is deep data access and daily workflow
      ownership; their disadvantage is that AI is a feature addition rather than the core product,
      and none has trained on a PI-specific dataset of EvenUp's scale.

      Category three—horizontal legal AI platforms—includes Harvey (BigLaw/corporate counsel),
      CoCounsel (Thomson Reuters, litigation and research), and Lexis+ with Protégé (LexisNexis,
      research and drafting). These are well-funded and technically sophisticated, but not
      calibrated to PI plaintiff workflows, contingency-fee economics, or medical-record analysis.

      Category four—general-purpose LLMs—represents the DIY alternative: attorneys using
      ChatGPT, Claude, or similar tools to draft demands without PI-specific training. EvenUp
      explicitly addresses this threat in product positioning: generic LLMs lack PI case data,
      HIPAA-compliant data isolation, and line-level citation traceability.

      Category five—manual status-quo substitutes—remains the largest "competitor" by revenue
      displaced: in-house demand writers, paralegals, and offshore legal-support vendors
      represent the workflows EvenUp replaces, with manual demand drafting requiring five to
      twenty hours per demand letter.
