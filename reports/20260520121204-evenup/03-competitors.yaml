  - id: "horizontal-legal-ai"
    title: "Horizontal Legal AI Platforms"
    body: >
      Three well-funded horizontal legal AI platforms represent potential future competitors
      if they expand into the PI plaintiff vertical: Harvey, CoCounsel (Thomson Reuters), and
      Lexis+ with Protégé (LexisNexis).

      Harvey AI (founded 2022, San Francisco) has raised an estimated $300M+ through 2025 and
      targets AmLaw 200 firms, BigLaw practice groups, and corporate counsel with legal research,
      contract drafting, litigation document preparation, and M&A diligence. Harvey's 2026
      product direction includes "Legal Agents for Every Matter, Tailored to You"—agentic
      workflows customizable per matter type. Harvey is not publicly marketed to PI plaintiff
      firms and lacks a PI-specific training corpus; its strategic focus on high-revenue BigLaw
      buyers makes PI entry economically unattractive in the near term.

      CoCounsel by Thomson Reuters (acquired from Casetext in 2023 for ~$650M) is positioned
      as an enterprise AI assistant grounded in Westlaw and Practical Law databases, handling
      legal research, contract analysis, deposition prep, and document review for litigation
      and corporate work. Notably, Thomson Reuters simultaneously partners with Supio (Westlaw
      Advantage integration) while competing in the broader legal AI space—a potential constraint
      on EvenUp's future access to Thomson Reuters' research infrastructure.

      Lexis+ with Protégé (formerly Lexis+ AI, rebranded in 2026) is LexisNexis's integrated
      legal AI offering combining the Protégé AI assistant with Shepard's citation verification,
      iManage/NetDocuments DMS integrations, and mobile access. Its explicit capabilities include
      drafting discovery documents, deposition questions, and litigation documents from uploaded
      materials—overlapping conceptually with EvenUp's document suite. However, it is not trained
      on PI-specific medical records and verdict data, limiting competitiveness in PI demand
      workflows requiring ICD-coded injury analysis and settlement-value benchmarking.

      The horizontal legal AI threat is primarily a long-term commoditization risk: if model
      capabilities continue to improve and foundational AI providers train on legal data at scale,
      the differentiation that requires PI-specific training today may erode. EvenUp's response—
      platform depth, proactive agents, and a proprietary dataset of 250,000+ PI verdicts and
      settlements—is defensible but not permanent without continuous data accumulation.
