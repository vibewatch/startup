  - id: "moat-durability"
    title: "Moat Durability and Adverse Competitive Evidence"
    body: >
      EvenUp's competitive moat rests on four interlocking pillars, each with a distinct
      durability profile and threat vector.

      Pillar 1—Proprietary PI Dataset: EvenUp's Piai system is trained on 250,000+ verdicts
      and settlements, millions of medical visits, and data from 2,000+ firms. This dataset
      creates a training advantage that new entrants cannot immediately replicate—estimated
      at three to five years to match at scale. The dataset moat faces a long-term threat
      from LLM providers that could acquire or license equivalent data, and from Supio's
      Thomson Reuters integration providing a legal-citation verification layer. No competitor
      has disclosed a comparable PI-specific verdict/settlement corpus.

      Pillar 2—Network Effect and Brand: EvenUp's penetration of 30% of the top 100 PI firms
      (May 2026) creates a reference-customer moat. As EvenUp processes more cases, its
      settlement benchmark data improves, generating a data network effect. This dynamic is
      evidenced by growth from roughly 1,500 firms (mid-2025) to 2,000+ (May 2026) and from
      20% of top-100 firms (October 2025 Series E) to 30% (May 2026). The adverse case: Supio
      and CMS incumbents are signing the same top-tier PI firms, potentially diluting EvenUp's
      data-exclusivity advantage through multi-homing.

      Pillar 3—Workflow Integration Depth: EvenUp's proactive agent model—continuously scanning
      case data, triggering demand-timing alerts, managing treatment follow-ups, flagging
      documentation gaps—creates switching costs once a firm standardizes its case processes
      around EvenUp's agents. However, CMS incumbents own the data layer where all case data
      originates; if Filevine, Litify, or Clio achieves comparable AI depth, the incremental
      value of a separate EvenUp subscription erodes.

      Pillar 4—Compliance and Trust: EvenUp's SOC2 certification and HIPAA attestation address
      the primary legal-ethics barriers to AI adoption. However, Supio has also achieved SOC2
      Type 2 and HIPAA/GDPR compliance, and all major CMS platforms maintain equivalent
      certifications. Compliance parity reduces this moat to table-stakes qualification.

      The primary adverse competitive evidence: (1) CMS platform encroachment—SmartAdvocate's
      integration with EvenUp (confirmed in EvenUp's blog) shows the co-opetition dynamic; as
      SmartAdvocate's built-in AI improves, the need for a separate EvenUp layer decreases;
      (2) demand-letter commoditization—insurance adjusters encountering EvenUp-generated demands
      at scale may develop systematic response protocols reducing settlement-improvement advantage,
      a risk EvenUp acknowledges through Mirror Mode; and (3) Supio's Westlaw integration, which
      provides legal-citation verification absent from EvenUp's platform.

      Net assessment: EvenUp is the scale leader with a durable dataset moat providing a three-to-
      five-year runway against direct peers. Its most serious medium-term threat is not Supio or
      horizontal AI players, but the organic AI evolution of Filevine, Litify, and Clio—platforms
      that already own EvenUp's distribution channel and can leverage the same case data with
      lower incremental cost.
