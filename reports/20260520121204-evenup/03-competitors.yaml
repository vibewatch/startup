  - id: "status-quo-substitutes"
    title: "Status-Quo and Manual Substitutes"
    body: >
      The largest competitive force EvenUp displaces is the status quo: manual paralegal and
      demand-writer workflows, supplemented by generic document templates and, more recently,
      general-purpose LLMs used without PI-specific calibration.

      A typical pre-EvenUp demand letter in a PI case required five to twenty hours of paralegal
      or staff-attorney time: reviewing medical records, constructing a chronology, drafting
      narrative, incorporating ICD codes, and iterating with the supervising attorney. At
      paralegal rates of $50–$100 per hour, the labor cost per demand letter alone represents
      $250–$2,000 of internal cost per case. EvenUp's per-case pricing model is designed to be
      priced below or close to this displacement value. EvenUp's customer testimonials
      corroborate ROI claims: Jeffcoat Injury Lawyers generated 3× more demand letters and
      settled cases 30 days faster using Express Demands; ELG Injury Lawyers achieved 400%+
      revenue growth; John K. Zaid & Associates reported 300% settlement improvement.

      Offshore legal support vendors represent a hybrid substitute: companies providing document
      processing and basic chronology services at $15–$40 per hour equivalent. These services
      lack AI-driven settlement benchmarking, ICD coding, treatment-gap detection, and case-
      financial analysis. EvenUp's per-case pricing targets the same economic slot, but delivers
      higher quality and faster turnaround.

      General-purpose LLMs (ChatGPT, Claude, Gemini) are an increasingly relevant DIY
      substitute, particularly for attorneys comfortable with prompt engineering. EvenUp's blog
      explicitly addresses this competition, noting five reasons generic LLMs are inadequate:
      lack of PI-specific training data, absence of HIPAA-compliant data isolation, no line-
      level citations traceable to source documents, no PI verdict benchmark data for settlement
      valuation, and no proactive workflow agents. EvenUp's Smart Workflows and proactive agents
      represent functionality that cannot be replicated by prompt-based LLM use without
      substantial custom engineering—specifically the 42% statistic (demands sent >100 days after
      last treatment) that drives EvenUp's demand-timing alerts.

      The adverse scenario: improving general-purpose AI tools eliminate most of the productivity
      gap in document generation, leaving EvenUp competing primarily on compliance, dataset
      quality, and workflow integration rather than speed of output.
