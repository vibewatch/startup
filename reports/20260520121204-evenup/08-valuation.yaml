  - id: "financing-context"
    title: "Current Financing Context and Entry Discipline"
    body: >
      EvenUp's financing history spans five disclosed rounds from Seed through Series E, with
      the Series D ($135M, October 2024 announced, publicly reported June 2024, $1B+ valuation)
      and Series E ($150M, October 2025, $2B+ valuation) fully corroborated across Bloomberg Law,
      EvenUp's own blog, and multiple trade publications. The GlobeNewswire Series D press release
      and EvenUp's own blog post on October 8, 2024 both confirm the $135M raise, $1B+ valuation,
      and $235M cumulative capital at that point. The Series E raised total disclosed equity to
      $385M. An EDGAR full-text search for "EvenUp, Inc." returns four ServiceTitan DRS/A filings
      (CIK 0001638826) that identify EvenUp, Inc. as a Delaware private company with board
      representation from April 2023—no independent Form D for EvenUp itself has been identified,
      consistent with a Regulation D exemption not requiring Form D filing or an entity name
      variant not yet located.


      The $2B valuation implies a step-up of approximately 100% from the $1B+ Series D in roughly
      twelve months. Series E participants include Bessemer (lead), REV (the RELX/LexisNexis VC
      arm), B Capital, and Bain Capital continuing from prior rounds. The RELX/REV participation
      is strategically notable: RELX, parent of LexisNexis, has independent competitive interests
      in legal AI research tools (Lexis+ AI, now Lexis+ Protégé). While the investment signals
      strategic optionality for EvenUp—potentially a future acquisition path—it also introduces
      a conflict-of-interest dynamic that deserves scrutiny in governance and IP terms.


      The preferred capital stack of $385M creates meaningful liquidation preference overhang.
      If EvenUp were acquired at $1B, simple preferred liquidation preferences would likely
      absorb the entire proceed, depending on participation features and conversion mechanics
      that are not publicly disclosed. Entering at the Series E price ($2B+ valuation) requires
      a meaningful exit premium to generate venture-level returns. The co-founder's explicit
      reference to an IPO as a possibility (per Axios reporting in October 2025) suggests
      management is managing toward a public exit, but no S-1 or IPO process has been initiated
      as of May 2026. Filevine, Litify, CasePeer/Clio, and SmartAdvocate are the primary case-
      management distribution integrations; any platform exclusivity or pricing change could
      degrade revenue predictability ahead of a public listing.
