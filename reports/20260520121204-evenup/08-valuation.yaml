  - id: "comparable-valuation"
    title: "Comparable Valuation Analysis"
    body: >
      EvenUp sits at an intersection of legal AI (software-centric) and legal managed services
      (human-capital-intensive), making peer selection difficult. The most relevant comparable
      set spans purpose-built legal AI startups, legal workflow SaaS platforms, M&A reference
      points, and vertical SaaS analogs. All comparables are directional; EvenUp's opaque
      financials prevent rigorous revenue-multiple analysis.


      Harvey AI (general legal AI, ~$3B valuation, $300M Series D in February 2025 per Bloomberg
      Law) is the closest public-market-adjacent analog as a late-stage private legal AI company,
      though Harvey serves BigLaw and enterprise clients rather than PI plaintiffs firms, has no
      managed-services component in its revenue model, and does not handle PHI at scale. The
      Harvey comparison suggests the market assigns premium multiples to purpose-built legal AI
      platforms with clear enterprise traction—but it does not solve for EvenUp's mixed
      software/services economics. At $3B, Harvey is valued 50% above EvenUp at $2B+ despite
      serving a different (and arguably broader) addressable market; this implies EvenUp may be
      valued on par or at a modest discount to Harvey on a relative-scale basis once market
      differences are adjusted for.


      Casetext/CoCounsel (legal research AI, acquired by Thomson Reuters for $650M in June 2023)
      is a relevant M&A reference. At $650M, the acquisition valued a pre-ARR-scale, pre-
      profitability legal AI company at a substantial premium—but far below EvenUp's current $2B+
      valuation. Casetext was primarily legal research (less operationally complex, no PHI, no
      legal ops staff), while EvenUp's integrated PLAAS offering is structurally different and
      arguably harder to replicate, but also harder to value. The Casetext exit validates M&A
      exit optionality for legal AI but sets a lower-water mark that EvenUp's valuation has
      already exceeded by 3x.


      Clio (legal practice management SaaS, $3B valuation as of 2021 Series F per LawNext) is
      the most prominent legal workflow SaaS independent. Clio serves general law firms broadly,
      has disclosed revenue growth and profitability milestones, and achieved $3B at roughly $100M+
      ARR. EvenUp at $2B+ without disclosed ARR implies either (a) a comparable or larger ARR
      scale, (b) a higher growth multiple reflecting faster growth, or (c) a premium for the
      managed-services overlay that Clio does not have. The Clio reference sets a rough
      "comparable SaaS" benchmark of ~30x ARR at $3B.


      ServiceTitan (vertical SaaS for home/commercial services, ~$8B IPO valuation, December 2024
      per SEC DRS/A filings) is a relevant vertical SaaS analog. ServiceTitan is operationally
      more complex than pure-software SaaS—it integrates with field service workflows—and was
      valued at roughly 12-16x forward revenue at IPO. The ServiceTitan multiple, applied to
      EvenUp's estimated ARR, implies that EvenUp's $2B+ valuation requires ARR in the $125-170M
      range at a 12-16x multiple—a figure materially above any publicly disclosed EvenUp revenue
      metric and consistent with a management projection, not confirmed actuals.


      The Grand View Research legal AI market forecast ($1.45B in 2024, growing to $3.90B by 2030
      at 17.3% CAGR) and MarketsAndMarkets legal AI software forecast ($3.11B in 2025, $10.82B
      by 2030, 28.3% CAGR) both suggest robust market tailwinds, but EvenUp's $2B+ valuation
      already embeds a significant share of a young and fragmented market. At the higher CAGR
      estimate, EvenUp would need to capture and sustain a meaningful percentage of a ~$3-11B
      legal AI software market by 2030 to justify its current implied valuation at exit.
