  - id: "scenarios-and-sensitivity"
    title: "Bull / Base / Bear Scenarios and Valuation Sensitivity"
    body: >
      Three scenarios bracket the EvenUp investment case as of May 2026. All are based on
      estimation; no company-disclosed ARR, margin, or growth rate is available to anchor the
      numbers. Revenue estimates are derived from $385M total capital raised, disclosed growth
      trajectories (>100% YoY at Series D), Lightspeed's published ARR trajectory ($0 to $10M
      in less than two years), and the PLAAS $10M+ early subscription figure.


      In the bull case, PLAAS scales rapidly to cover the 300+ legal-ops headcount cost, driving
      blended ARR to $150–200M by end of 2026 at 65–70% gross margins. In this scenario, revenue
      growth at 80%+ compresses the revenue multiple to 10–13x, comparable to high-growth vertical
      SaaS at IPO. An IPO or strategic acquisition (most likely by RELX/LexisNexis, Thomson
      Reuters, or a major insurance carrier) at $4–6B enterprise value would generate 2–3x
      returns on the Series E entry price. The data moat from 200,000+ cases and $14B+ in damages
      becomes a structural barrier that commoditizing LLM providers cannot easily replicate.


      In the base case, PLAAS gains traction with 50–100 enterprise PI firms by end of 2026,
      generating $50–80M in blended ARR at 55–60% gross margins. Revenue growth moderates to
      40–60% as PLAAS sales cycles lengthen and the per-case SaaS platform reaches saturation
      in its current top-100 firm cohort. An IPO at $3–4B enterprise value (realistic for 2027–
      2028 given current market conditions) would generate 1.5–2x returns at Series E. Risk of
      multiple compression increases as the managed-services component grows as a share of revenue.


      In the bear case, PLAAS adoption is slower than expected due to attorney-client privilege
      concerns, HIPAA compliance friction, and competing in-house build-vs-buy decisions at larger
      PI firms. ARR stagnates at $40–60M. A concurrent AI commoditization cycle—OpenAI legal
      AI tools, Filevine's LOIS AI, and Harvey potentially expanding to PI—compresses pricing
      power on the per-case SaaS product. The $45–75M annual legal-ops cost creates operating
      losses of $20–40M per year. A strategic exit at $800M–$1.2B (below Series E valuation)
      or a down round would produce a loss for Series E investors.


      The valuation sensitivity analysis centers on three drivers: (1) PLAAS ARR ramp speed,
      (2) blended gross margin (driven by the legal-ops cost absorption), and (3) market
      exit multiple. A 10-percentage-point change in gross margin (e.g., 55% vs. 65%) at
      $100M ARR changes the implied enterprise value by $300–500M at a 10x revenue multiple.
      This margin sensitivity is the dominant risk factor and the most important unverified
      variable in the investment case.
