callouts:
  - calloutType: "recommendation"
    title: "Research-More: Disclose Before Committing"
    body: >
      EvenUp demonstrates category leadership in a large, under-automated market, with strong
      customer proof and a novel managed-services expansion. The investment case is blocked by
      financial opacity: no ARR, gross margin, or PLAAS unit economics are publicly available.
      A new investor at $2B+ should require audited financial disclosure before committing.
      The valuation is expensive relative to disclosed evidence; downside risk is material
      if PLAAS margins disappoint or AI commoditization accelerates.
    claimRefs:
      - CV001
      - CV003
      - CV004

  - calloutType: "risk"
    title: "PLAAS Margin Is the Dominant Unknown"
    body: >
      The single most important unresolved variable is the blended gross margin on the PLAAS
      managed-services offering. If PLAAS revenues cover the $45–75M annual cost of 300+ US
      legal-ops staff plus AI infrastructure, EvenUp's economics approach SaaS. If not, EvenUp
      is a services company at software multiples—a structural mismatch that justifies a
      materially lower valuation.
    claimRefs:
      - CV033
      - CV034

  - calloutType: "insight"
    title: "RELX Investment: Strategic Option or Competitive Risk"
    body: >
      The RELX/REV Series E participation gives a LexisNexis parent a minority stake in EvenUp.
      This creates a strategic optionality upside (potential LexisNexis acquisition at premium)
      but also a governance risk (board access to EvenUp's proprietary PI dataset and PLAAS
      playbook). Investors should review the terms of REV's investment, including any co-investor
      anti-compete provisions, data-sharing restrictions, and right-of-first-offer terms.
    claimRefs:
      - CV014
      - CV015
      - CV039

