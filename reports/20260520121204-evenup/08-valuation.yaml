chapter:
  number: 8
  title: "Valuation"
  summary: >
    EvenUp's $2B+ Series E valuation (October 2025) implies a revenue multiple that is difficult
    to evaluate because no ARR, EBITDA, or gross-margin figure has been publicly disclosed.
    The only concrete revenue data point is $10M+ in early PLAAS subscription sales announced
    at the May 2026 product launch. Against a $61.7B US personal injury market, a growing
    legal AI sector, category leadership at 2,000+ firms and 30% of top-100 PI firms, and
    $385M in total capital from Bessemer, RELX, Bain, and others, the bull case rests on
    PLAAS converting a fixed legal-ops cost center into a recurring managed-services revenue
    stream. The bear case centers on margin compression from 300+ US legal-ops staff, AI
    commoditization from Harvey, Filevine, and OpenAI, and regulatory exposure that limits
    the pace of PLAAS adoption. Recommendation: research-more. Valuation stance: expensive.

sections:
  - id: "investment-recommendation"
    title: "Investment Recommendation and Valuation Stance"
    body: >
      EvenUp occupies a defensible position as the category leader in purpose-built personal
      injury AI, but the investment decision is clouded by an opaque financial profile.
      The company has raised $385M in total disclosed equity capital, most recently a $150M
      Series E led by Bessemer Venture Partners in October 2025 at a valuation exceeding $2
      billion. No ARR, gross margin, EBITDA, burn rate, or customer net revenue retention
      figure has appeared in any public source. The only concrete revenue data point is EvenUp's
      own announcement of $10M+ in early PLAAS subscription sales at the May 2026 product launch,
      which speaks more to pipeline validation than to scale.


      The recommendation is research-more. Confidence is medium: the product evidence and
      category leadership are strong, but the valuation cannot be stress-tested without
      disclosed unit economics. The risk rating is high, driven primarily by margin compression
      from 300+ US-based legal operations staff (estimated $45–75M annual labor cost at standard
      US legal-ops compensation), regulatory exposure under HIPAA and attorney-ethics rules, and
      the possibility that PLAAS represents a structural shift toward services-heavy economics
      that suppresses software-like gross margins indefinitely.


      The valuation stance is expensive. A $2B+ post-money valuation requires either (a) ~$100M+
      in ARR growing at 50%+, (b) a credible path to a $10B+ exit via IPO or strategic acquisition,
      or (c) a material rerating of legal AI multiples as the sector matures. None of these
      conditions is verifiable with available public evidence as of May 2026. Bessemer's Roads to
      $100M ARR playbook for legal AI implies the sector can produce very large software businesses,
      but EvenUp's managed-services pivot introduces cost-structure uncertainty that pure-software
      peers do not face. The Lightspeed portfolio page reveals EvenUp reached $10M ARR in less
      than two years from founding—suggesting high early velocity—but that trajectory was at a
      pre-PLAAS, lower-cost-structure stage of the company.


      The investment discipline implication is that a new investor at $2B+ should demand audited
      ARR, gross-margin, and burn-rate disclosure before committing, and should price the round
      assuming blended gross margins of 50–65% (vs. 70–80% for pure SaaS) to reflect PLAAS's
      managed-services component. Dilution from $385M in preferred capital and unquantified
      option-pool grants must also be modeled before computing return scenarios.
