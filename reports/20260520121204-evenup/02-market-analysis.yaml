  - id: "buyer-segmentation"
    title: "Buyer, User, and Payer Segmentation"
    body: >
      The PI law firm is the unit of purchase, but buying authority and daily use are distributed
      across distinct roles. Firm owners and managing partners are the economic buyers who sign
      contracts and control software budgets; for contingency-fee firms, the decision calculus
      is direct: can this tool improve settlement outcomes or reduce time-per-case enough to
      justify the subscription cost? Case managers and paralegals are the primary daily users
      who process intake documents, coordinate medical records, and send client communication—
      the highest-volume workflows EvenUp automates. Demand writers (staff attorneys and senior
      paralegals) use AI drafting tools to prepare and review demand packages, the highest-value
      document type in a PI case. Intake teams and legal-ops managers use AI for case triage,
      identifying which incoming files are high-value or near statute-of-limitations risk.

      EvenUp's expansion into Pre-Litigation as a Service (PLAAS) adds a new buyer relationship:
      firm owners who want an outsourced case-management partner rather than a software license,
      shifting the payer from a per-seat SaaS model to a per-case managed-service contract.
      This substantially widens the addressable market segment to firms that lack internal
      capacity to implement software tools independently.

      PI firms are overwhelmingly small: the vast majority practice with fewer than 10 attorneys.
      Large national firms (e.g., Lerner & Rowe, Morgan & Morgan) represent a small share of
      firm count but a disproportionate share of annual case volume and EvenUp's most visible
      reference customers. The 30% penetration of the top 100 PI firms (as of May 2026) indicates
      that EvenUp has successfully moved up-market, but the long tail of smaller firms represents
      the bulk of the untapped SAM.
