callouts:
  - calloutType: "insight"
    title: "Contingency Fees Create a Structurally Stronger AI ROI Case Than Hourly Markets"
    body: >
      PI law firms operate on a pure outcome basis: every hour of paralegal or attorney time
      invested in a case that does not increase the settlement value is a direct cost with no
      offsetting billing. This is fundamentally different from hourly-billed markets where
      AI time savings reduce revenue proportionally. In PI law, AI efficiency compounds:
      faster case prep enables more cases, and better demand documentation can directly raise
      settlement values. This is why EvenUp's customer testimonials consistently cite percentage
      improvements in settlement outcomes rather than billing efficiency—the metric that matters
      in a contingency model.
    claimRefs:
      - CM003
      - CM023

  - calloutType: "risk"
    title: "Homogenized AI Demand Letters Could Be Discounted by Insurance Adjusters"
    body: >
      As EvenUp penetrates 30%+ of the top 100 PI firms and processes 10,000+ cases per week,
      a plausible adverse scenario emerges: insurance adjusters learn to recognize EvenUp-generated
      demand templates and develop systematic response strategies. If demands begin to look
      identical across firms, insurers may discount them relative to bespoke attorney-drafted letters.
      This risk is acknowledged by Above the Law commentary and is consistent with how insurance
      companies respond to plaintiff-side commoditization. EvenUp's Mirror Mode (firm-specific
      style replication) is a direct product response to this risk, but its effectiveness at
      scale has not been independently tested.
    claimRefs:
      - CM034
      - CM039

