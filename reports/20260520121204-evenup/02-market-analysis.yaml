  - id: "adoption-constraints"
    title: "Adoption Constraints and Adverse Evidence"
    body: >
      Legal AI adoption in PI law faces a distinct set of structural constraints that do not apply
      equally to other software categories. ABA Model Rule 1.1 (Competence) requires attorneys
      to maintain sufficient understanding of technology they use in client representations,
      which the ABA's comment on technological competence (Comment 8) extends to AI tools—
      meaning attorneys cannot simply delegate judgment to an AI platform without adequate
      supervision. ABA Model Rule 1.6 (Confidentiality) prohibits disclosure of client
      information without consent, requiring that any AI platform handling case data—especially
      medical records—operate under strict data-isolation and contractual confidentiality
      guarantees. ABA Rule 5.5 further prohibits assisting in unauthorized practice of law,
      raising questions about AI-generated legal strategies that are not reviewed and approved
      by a licensed attorney. EvenUp has addressed these compliance obligations by achieving
      SOC 2 Type 2 recertification and HIPAA attestation, but compliance maintenance is an
      ongoing operational cost.

      AI hallucinations represent a specific and well-documented risk in legal contexts.
      Confidently incorrect citations or fabricated case law embedded in demand letters
      could expose attorneys to malpractice claims, disciplinary action, or sanctions.
      EvenUp's line-level citation model attempts to mitigate this by tying every assertion
      to a source document, but the risk is not eliminated and cannot be fully automated away.
      Above the Law's commentary on EvenUp explicitly notes ongoing concerns about algorithmic
      bias, data privacy, and the risk that AI-generated demand letters could "gum up" court
      systems with standardized filings. There is a plausible adverse scenario in which
      insurance adjusters begin discounting demands that follow a recognizable AI-generated
      template, reducing EvenUp's settlement-improvement value proposition over time.

      Small-firm budget constraints present a final structural friction: the majority of PI
      firms operate with fewer than 10 attorneys and limited technology budgets. Integration
      with incumbent case management systems (Filevine, MyCase, Clio) requires implementation
      investment and staff training that may deter adoption among the smallest firms.
