company:
  name: "EvenUp"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    EvenUp operates in a narrowly defined market—plaintiff personal injury (PI) legal operations AI—
    that sits inside the broader legal AI sector but is distinguished by contingency-fee economics,
    medical-record complexity, and the specific demand-letter workflow. Global legal AI analyst
    estimates range from $1.45 billion (2024, Grand View Research) to $3.11 billion (2025,
    MarketsandMarkets), growing at 17–28% CAGR, but neither isolates the PI-specific sub-market.
    A bottom-up lens anchored in EvenUp's own data (2,000+ firms, 10,000 cases/week, $14B+ in
    damages) and BLS lawyer-count statistics points to a US PI AI SAM in the low hundreds of
    millions of dollars today and potentially $500M–$1B+ at full penetration. The market is driven
    by labor shortages, contingency-fee ROI pressure, settlement-cycle compression, and growing
    medical-record volume, but is constrained by ABA professional-conduct rules, HIPAA compliance
    obligations, AI-hallucination risk, and small-firm budget limits. Both the growth thesis and
    the constraint case are well-evidenced; sizing remains imprecise because no analyst publisher
    tracks the PI sub-vertical independently.

sections:
  - id: "market-boundary"
    title: "Market Boundary and Scope"
    body: >
      EvenUp's addressable market is plaintiff personal injury legal operations software and AI—a
      vertical within the broader US legal technology sector defined by three characteristics:
      (1) buyers are plaintiff-side PI law firms operating on contingency fees, not hourly-billed
      corporate or defense practices; (2) core workflows are demand preparation, medical-record
      analysis, case valuation, intake triage, and treatment tracking for bodily-injury claims;
      and (3) the economic return is measured in settlement improvement and paralegal-hour savings,
      not in billable-hour efficiency. Personal injury law encompasses automobile accidents,
      workplace injuries, medical malpractice, product liability, and toxic torts—all cases
      where an injured plaintiff retains counsel on a percentage-of-recovery basis.

      This boundary explicitly excludes: (a) defense-side legal AI used by insurance companies
      and defense counsel; (b) corporate legal-department tools such as contract lifecycle
      management and eDiscovery; (c) InsurTech claims processing platforms sold to insurance
      carriers; and (d) general-purpose AI coding assistants or broad research tools not
      calibrated to PI case types. Adjacent markets include legal case management systems (CMS)
      such as Filevine and Clio, medical-record retrieval services, and litigation financing—
      all of which EvenUp interfaces with but does not directly compete in.

      Status-quo substitutes currently displaced by EvenUp include: manual paralegal demand
      drafting (typically 5–20 hours per demand letter), generic word-processor templates,
      medical-chronology vendors that only return structured summaries, and off-the-shelf
      large language models (Claude, ChatGPT) that lack PI-specific training data and
      confidentiality controls required under ABA Rules and HIPAA.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM019
    tableRefs:
      - TM001
    figureRefs: []

  - id: "market-sizing"
    title: "Market Sizing Lenses"
    body: >
      No analyst firm publishes a standalone market-size estimate for PI plaintiff legaltech AI.
      Two top-down lenses from the broader legal AI market are available and exhibit meaningful
      divergence: Grand View Research sized the global legal AI market at $1.45 billion in 2024
      with a projected CAGR of 17.3% to $3.90 billion by 2030, anchored in eDiscovery, legal
      research, and contract review. MarketsandMarkets reported the legal AI software market at
      $3.11 billion in 2025 with a CAGR of 28.3% to $10.82 billion by 2030—a substantially
      broader boundary that includes generative AI agents and industry-specific drafting tools.
      The gap between these two estimates reflects definitional differences rather than empirical
      disagreement, and both should be treated as upper-bound reference points rather than
      PI-specific sizing.

      A bottom-up estimation for the US PI sub-market begins with scale indicators: BLS reports
      864,800 licensed lawyers in the US (2024), a fraction of whom specialize in PI plaintiff
      work. EvenUp's own data implies approximately 30,000–60,000 active PI plaintiff attorneys
      (based on "thousands of firms" and "2,000+ firms" served). Assuming a rough SAM of
      30,000 PI firms addressable by AI-first platforms, with ARPU of roughly $5,000–$20,000
      per year, yields a US PI AI SAM of $150M–$600M at current price points. EvenUp's 2026
      PLAAS launch, which generated $10M+ in early subscriptions, suggests pricing traction at
      the higher end of this range for managed-service offerings. These estimates contain
      significant uncertainty and should be treated as illustrative rather than definitive.
      The absence of a published PI-specific market size is itself a material evidence gap,
      preserved here as a diligence ask rather than a resolved figure.
