  claims:
    - id: "CM001"
      statement: "EvenUp's addressable market is plaintiff personal injury legal operations AI, defined as software for demand preparation, case valuation, medical-record analysis, intake triage, and treatment tracking for contingency-fee PI firms."
      type: "observed"
      topic: "market boundary"
      sourceRefs: ["SM001", "SM022", "SM009"]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: ["QM002"]

    - id: "CM002"
      statement: "The PI legaltech AI market explicitly excludes defense-side legal AI, corporate contract-review tools, insurance-carrier claims platforms, and general-purpose AI assistants not calibrated to PI workflows."
      type: "inferred"
      topic: "market boundary"
      sourceRefs: ["SM001", "SM003"]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: ["QM002", "QM024"]

    - id: "CM003"
      statement: "The contingency fee model means PI attorneys earn a percentage of settlement recovery, so AI tools that increase settlement values or reduce hours-per-case produce direct margin gains with no billable-hour revenue offset."
      type: "inferred"
      topic: "market boundary"
      sourceRefs: ["SM011", "SM009"]
      confidence: "medium"
      freshness: "historical"
      answersQuestionRefs: ["QM025", "QM026"]

    - id: "CM004"
      statement: "Status-quo substitutes that EvenUp displaces include manual paralegal demand drafting, generic word-processor templates, standalone medical-record summary vendors, and off-the-shelf LLMs used without PI-specific training or HIPAA controls."
      type: "inferred"
      topic: "market boundary"
      sourceRefs: ["SM001", "SM011", "SM006"]
      confidence: "medium"
      freshness: "current"
      answersQuestionRefs: ["QM003"]

