  - id: "integrations-and-deployment"
    title: "CMS Integrations, Deployment, and Data Dependency Map"
    body: >
      EvenUp's integration strategy targets the dominant personal injury case management
      systems: Filevine, Litify, SmartAdvocate, and CasePeer. The company claims full
      implementation in less than one business day through automatic case metadata
      synchronization—client details, policy numbers, and intake transcripts flow from the
      CMS into EvenUp at onboarding and update continuously as new records arrive.

      The Litify integration delivers generated drafts as a direct link within the CMS
      immediately upon document creation, eliminating context switches for litigation staff.
      Smart Workflows leverages the CMS connection to monitor case status fields and
      automatically trigger alerts and actions when firm-defined conditions are met (e.g.,
      time elapsed since last treatment, missing record flags). Communication Agents™ sync
      results—call recordings, structured summaries, claim numbers, adjuster assignments—
      directly to the CMS case file, requiring no separate login.

      The dependency topology creates a two-sided risk. On the data-ingestion side, EvenUp
      depends on the quality and completeness of records uploaded by firms and synced from
      CMS platforms; poor data hygiene at intake degrades Piai™ accuracy downstream. On the
      platform-dependency side, CMS vendors can alter APIs, restrict third-party integrations,
      or build competing AI features—a dynamic already visible in Filevine's own AI roadmap.
      EvenUp mitigates this partly by spanning four major CMS platforms, but a single dominant
      CMS partner's API deprecation would disrupt service continuity for a material share of
      the installed base.

      PLAAS introduces a third dependency: the US-based case management staff of 300+ who
      handle pre-litigation workflow for subscribing firms. This creates material operational
      scalability constraints—onboarding new PLAAS clients requires hiring, training, and
      quality-assuring legal operations staff at rates that exceed typical SaaS capacity
      expansion.
