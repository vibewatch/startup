  - id: "product-and-technical-risks"
    title: "Product Risks and Adverse Technical Assessment"
    body: >
      EvenUp's product and technology profile carries four material risk categories that
      require investor diligence beyond the company-sourced performance claims.

      LLM commoditization is the existential technology risk. EvenUp's Writing Layer
      capabilities—document drafting, question answering, negotiation sheet generation—
      are partially replicable by fine-tuned versions of general-purpose models from OpenAI,
      Google, and Anthropic applied to PI workflows. EvenUp's defensible moat resides in the
      Reading Layer and the proprietary PI dataset, not in the Writing Layer itself. As
      foundation models improve at document understanding and specialized fine-tuning becomes
      cheaper, the gap between EvenUp's Writing Layer and a well-prompted general-purpose LLM
      will narrow. Harvey AI, Clio Duo, and LexisNexis Protégé are already applying general
      LLMs to legal document generation.

      Data dependency and accuracy risk: Piai™'s accuracy is directly proportional to the
      quality of uploaded case materials. EvenUp's own analysis shows that 16.8% of cases
      develop a 30-day treatment gap within three months and 43% eventually experience such
      gaps—meaning the input data itself is frequently incomplete, creating downstream
      accuracy risk in generated documents. Attorneys retain final responsibility under
      ABA Rule 1.1 for verifying AI outputs, and a single material error in a demand letter
      can expose a firm to malpractice risk.

      CMS/platform concentration risk: EvenUp's integrations depend on API access to four
      CMS vendors. Any one of these vendors could restrict API access, introduce competing
      AI features, or alter pricing in ways that increase EvenUp's costs. The RELX/LexisNexis
      strategic investment creates a complex incentive: LexisNexis Protégé competes with
      EvenUp in AI-assisted legal work, raising questions about long-term commercial terms.

      PLAAS scalability risk: early PLAAS sales of $10M+ suggest demand, but the model
      requires linear headcount scaling of US-based legal ops staff. Whether EvenUp can
      maintain output quality and profitability while rapidly expanding the PLAAS workforce
      remains unvalidated at scale; LawNext flagged the fundamental question of whether PLAAS
      represents a genuine new category or a repackaged AI-wrapped managed service.
    claimRefs:
      - CE040
      - CE041
      - CE044
      - CE045

