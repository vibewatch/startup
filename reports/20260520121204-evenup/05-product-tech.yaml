  - id: "differentiation-and-data-moat"
    title: "Differentiation: Proprietary Dataset, Feedback Loop, and Human Review Layer"
    body: >
      EvenUp's core defensible advantages are its proprietary PI dataset, its expert
      annotation feedback loop, and its human review layer—three elements that compound
      into a data flywheel unavailable to general-purpose AI competitors.

      The proprietary dataset was built by convincing early PI firm customers to contribute
      anonymized settlement and case-outcome data. This crowdsourced corpus—now spanning
      hundreds of thousands of injury cases and millions of medical records—forms the
      training foundation for every Piai™ model. It includes not just publicly available
      verdict data but also the pre-settlement negotiation outcomes and case-strategy patterns
      that constitute EvenUp's most defensible competitive differentiator.

      The expert feedback loop operates daily: thousands of user corrections to Reading Layer
      model outputs (medical provider name normalizations, date corrections, treatment
      categorizations, bill reconciliations) feed back directly into fine-tuning cycles.
      Senior ML engineers describe a deliberate annotation pipeline that ingests these
      corrections and continuously updates individual entity models. This creates a precision
      advantage for specialized PI entities—hospital system name variants, regional insurance
      adjuster behavioral patterns, PI-specific ICD code clusters—that no general-purpose
      LLM can replicate without access to EvenUp's ground-truth corpus.

      The human review layer—100+ US-based nurses, paralegals, experienced adjusters, and
      case managers—validates Piai™ outputs before delivery to firm clients. This layer
      serves two functions: quality assurance (catching errors before they reach the firm)
      and training signal generation (corrections become supervised training data for the
      next model iteration). EvenUp positions this as "precision and accuracy far exceeding
      what LLMs alone can achieve," and it is the structural reason PLAAS can offer
      performance guarantees (95% of available policy limits recovered in early testing).

      Customer ROI disclosures—while all company-sourced—suggest the platform delivers
      measurable acceleration: Jeffcoat Injury Lawyers produced 3× more demand letters and
      settled 30 days faster; early PLAAS cohorts retrieved medical records 66 days faster
      and delivered demands 47 days faster than industry norms.
