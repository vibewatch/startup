callouts:
  - calloutType: strength
    title: "Proprietary PI Dataset Is the Core Moat"
    body: >
      EvenUp's crowdsourced settlement corpus—hundreds of thousands of anonymized PI cases
      and millions of medical records—is the foundational competitive advantage that general
      LLM competitors cannot replicate without years of similar data-partnership development.
      The daily expert correction signal (thousands of entity-model updates per day) compounds
      this advantage over time and creates an improving model quality trajectory unavailable
      to point-in-time fine-tuned competitors.
    claimRefs:
      - CE029
      - CE032

  - calloutType: risk
    title: "Human Review Layer Is Both Moat and Structural Cost Risk"
    body: >
      The 100+ US-based human reviewers are the quality backstop that enables EvenUp to make
      accuracy commitments beyond what LLMs alone can deliver—and the engine of the training
      data flywheel. But PLAAS requires linear headcount expansion of this layer to serve more
      managed-service clients, creating both scalability constraints and gross margin pressure.
      If the human review layer is reduced to cut costs, model quality and the hallucination
      controls that differentiate Piai™ from generic LLMs degrade simultaneously.
    claimRefs:
      - CE031
      - CE044

  - calloutType: risk
    title: "RELX/LexisNexis Strategic Investment Creates Dual Incentives"
    body: >
      RELX's venture arm (REV) participated in EvenUp's $150M Series E while LexisNexis—
      RELX's core product—develops Protégé and other AI-assisted legal tools that compete with
      EvenUp's document drafting and case research capabilities. This creates an incentive
      conflict: LexisNexis gains competitive intelligence through board-level visibility while
      retaining the option to outcompete EvenUp in PI-adjacent legal AI markets. Diligence
      should clarify what data-sharing restrictions, non-compete provisions, and information-
      barrier agreements govern the RELX investment relationship.
    claimRefs:
      - CE041
      - CE040

