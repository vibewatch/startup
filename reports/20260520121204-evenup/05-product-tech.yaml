  - id: "piai-architecture"
    title: "Piai™ Architecture: From Raw Records to Actionable Intelligence"
    body: >
      Piai™ is EvenUp's proprietary AI system—not a single model but a coordinated stack of
      specialized models designed exclusively for PI legal workflows. Its architecture
      progresses through three functional layers that map directly to EvenUp's
      System of Record → System of Intelligence → System of Action framework.

      The Reading Layer is the foundational ingestion stage. It normalizes and extracts
      structured information from the full spectrum of PI case materials: PDFs with varied
      layouts, scanned documents, handwritten notes, tables, ICD-coded medical forms, police
      reports, and multi-page medical charts. The Reading Layer maintains a roster of highly
      specialized models—one per extracted entity type (medical provider names, dates of
      service, ICD codes, treatment descriptions, court identifiers, vehicle metadata)—each
      continuously retrained by thousands of daily user-correction signals. For visual content
      (accident diagrams, radiology images), EvenUp uses PPO-based reinforcement learning to
      train image-to-text summarizers: the system generates image-grounded question sets,
      evaluates whether a text-only QA model can answer them from the summary, and trains the
      summarizer until answerability matches pixel-grounded accuracy. Summaries are stored once
      at ingestion with full provenance (page region, model version, timestamp), eliminating
      costly repeated vision-model inference.

      The Writing Layer grounds document generation in the facts extracted by the Reading Layer
      rather than in general world knowledge. This means AI Drafts™ outputs cite exact provider
      names, ICD codes, treatment counts, and dollar amounts extracted from the case record,
      not hallucinated plausible values. Every output includes line-level citations linking
      each assertion to the document, page, and line of origin—enabling human review teams and
      courts to trace claims back to source material.

      Above the two core layers, the System of Record (SoR) persists normalized case entities
      (claimant, providers, encounters, procedures, bill line items, vehicles) with relationship
      graphs and timelines. The System of Intelligence (SoI) plans query execution—factual
      lookups run against the SoR; tone and rationale queries use retrieval over original
      documents. The System of Action (SoA) enables proactive automation: missing record
      requests, demand-timing alerts, treatment-gap notifications, and client outreach are
      all triggered from the SoR at the right moment in the case timeline.

      EvenUp's VP of Engineering and Head of AI is Haixun Wang, ACM Fellow and IEEE Fellow
      recognized for foundational work on graph-based systems and knowledge bases, bringing
      research lineage from Microsoft, Google, Amazon, Meta, and Instacart. The ML engineering
      team includes PhDs specializing in NLP, document understanding, and optimization.
