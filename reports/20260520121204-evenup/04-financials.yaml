  - id: "financial-opacity"
    title: "Financial Disclosure Gaps and Diligence Risks"
    body: >
      EvenUp's financial profile is materially opaque for a company at its funding stage and
      valuation. No ARR, revenue, gross margin, operating loss, burn rate, runway, or EBITDA
      figures have been disclosed in any public source across its five-year operating history.
      This opacity is structurally typical for private venture-backed companies—especially those
      planning a future IPO that would benefit from controlling the initial financial narrative—
      but it creates specific diligence risks that must be addressed before any institutional
      investment.

      The single concrete revenue datapoint ($10M+ in PLAAS subscriptions) represents a new
      product in early testing rather than core platform ARR, making it an unreliable proxy for
      EvenUp's total recurring revenue base. All customer ROI figures (300% revenue growth,
      $500M+ Sweet James results) are sourced from EvenUp's own marketing materials without
      independent corroboration or methodology disclosure.

      The RELX/LexisNexis venture arm (REV) participation in the Series E creates a strategic
      conflict-of-interest concern: RELX is the parent company of LexisNexis, a direct or
      proximate competitor to EvenUp in legal AI workflows. Diligence should confirm whether
      REV participation includes any data-access provisions, right-of-first-offer for acquisition,
      or board information rights that could give RELX/LexisNexis competitive intelligence.

      AboveTheLaw's coverage of the Series E raised standard AI-practice concerns: algorithmic
      bias in demand generation, data privacy for PHI in the pipeline, and the risk that
      EvenUp's AI-driven demand inflation "will further gum up the court system" by systematically
      inflating initial demand figures, training insurance adjusters to discount them, and
      eroding the ROI advantage at scale. These risks are real and structurally present for any
      high-volume legal AI platform; their financial impact (churn from disillusioned customers,
      regulatory intervention, insurance-company counter-technology) has not been quantified.

      Whether PLAAS represents a genuine new product category or a repackaging of existing AI
      with an organizational services wrapper is an open question; LawNext's May 2026 coverage
      noted that PLAAS' long-term value would depend on depth of firm integration and scale of
      outcomes, which cannot be assessed from early-testing data alone.
