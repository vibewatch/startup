callouts:
  - calloutType: "risk"
    title: "PLAAS Changes EvenUp's Margin Profile Structurally"
    body: >
      EvenUp's 300+ US-based legal operations team was historically a cost center required for
      dataset curation and AI quality assurance. PLAAS converts this team into a managed-services
      revenue unit. The financial viability of PLAAS depends on whether subscription pricing
      covers the approximately $45M–$75M estimated annual fully-loaded cost of 300+ US legal
      operations staff, plus AI infrastructure overhead. If PLAAS pricing is insufficient or
      adoption is slow, EvenUp's blended gross margins will remain materially below the 70–80%+
      levels typical of pure SaaS companies at this valuation stage. The $10M+ in early
      subscription sales is encouraging but not sufficient to assess steady-state margin
      contribution from PLAAS at scale.
    claimRefs:
      - CI016
      - CI017
      - CI018
      - CI021
      - CI033

  - calloutType: "risk"
    title: "REV/LexisNexis Series E Investment Creates a Structural Conflict"
    body: >
      The participation of REV—the venture arm of RELX plc, parent of LexisNexis—in EvenUp's
      Series E represents the most material undisclosed governance risk in the financial profile.
      LexisNexis competes directly with EvenUp in legal AI workflow products, and RELX also
      invests in legal AI infrastructure that EvenUp may rely on. Any board observer rights, ROFR
      provisions, or data-access commitments in the REV investment agreement would need to be
      reviewed. At a minimum, REV's information rights under standard venture terms could provide
      RELX/LexisNexis with non-public financial and product data that constitutes competitive
      intelligence. This risk should be explicitly addressed in the term sheet review.
    claimRefs:
      - CI013
      - CI015
      - CI036
      - CI037

  - calloutType: "insight"
    title: "100%+ Revenue Growth at Series D Implies $30M–$120M+ ARR Range"
    body: >
      Although EvenUp has not disclosed ARR, working backward from its funding history and growth
      rate provides a plausible range. At Series D (October 2024), EvenUp stated revenue grew
      more than 100% YoY with over 1,000 active firms. Assuming $2,000–$10,000 ARPU per firm,
      Series D revenue was approximately $2M–$10M run-rate—implying that at >100% YoY growth
      into October 2025 (Series E at $2B+ valuation), ARR likely reached $40M–$120M before
      the Series E. Bessemer's published "Roads to $100M ARR" thesis in legal AI positions
      EvenUp as an exemplar of that trajectory. This range implies a 16–50× ARR multiple at
      the $2B valuation—aggressive by 2025 SaaS multiples but not implausible for a hypergrowth
      vertical AI leader with no disclosed deceleration.
    claimRefs:
      - CI005
      - CI022
      - CI025
      - CI031
      - CI040

