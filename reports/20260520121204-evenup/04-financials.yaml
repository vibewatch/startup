chapter:
  number: 4
  title: "Financials"
  summary: >
    EvenUp has raised $385M in total disclosed venture funding—$135M Series D (October 2024, Bain
    Capital Ventures, $1B+ valuation) and $150M Series E (October 2025, Bessemer Venture Partners,
    $2B+ valuation)—making it the best-capitalized purpose-built personal injury AI company by a
    wide margin. Revenue model transitioned in May 2025 from tiered feature licensing to per-case
    SaaS (one predictable price for the full Claims Intelligence Platform), and the company launched
    PLAAS (Pre-Litigation as a Service) in May 2026—a hybrid managed-services model combining AI
    with 300+ US-based legal operations staff. PLAAS generated $10M+ in early subscription sales
    during testing, representing the only concrete revenue figure disclosed in any public source.
    Revenue growth exceeded 100% YoY at the Series D, workforce doubled in the twelve months prior
    to October 2024, and EvenUp reached 2,000+ PI firms and ~30% of the top 100 PI firms by May
    2026. No ARR, EBITDA, gross margin, burn rate, or runway has been publicly disclosed; the
    financial diligence picture is materially incomplete. EvenUp's cost structure is unusually
    capital-intensive for a software company given its 300+ US-based legal operations headcount,
    creating structural margin pressure that distinguishes it from pure-play AI SaaS peers.

sections:
  - id: "revenue-model"
    title: "Revenue Model and Monetization Architecture"
    body: >
      EvenUp's monetization strategy evolved substantially between its founding and May 2026,
      culminating in two parallel revenue tracks: a per-case SaaS model for its AI-driven Claims
      Intelligence Platform and a subscription managed-services model for PLAAS.

      Prior to May 2025, EvenUp sold access to its platform under a tiered feature licensing
      model—distinct pricing for demand letter generation, medical chronologies, and other modules.
      In May 2025, EvenUp launched its restructured Claims Intelligence Platform with "one clear,
      predictable cost per case," consolidating the full product suite (AI Drafts, Smart Workflows,
      Medical Bill Summary, Express Demands) into a unified per-case unit. This transition aligns
      EvenUp's pricing with the contingency-fee economics of its PI firm customers: firms pay per
      case processed rather than per user seat or feature access, enabling direct ROI measurement.
      Per-case price is not publicly disclosed and is set through a sales conversation; analyst
      estimates place average revenue per firm (ARPU) in the $5,000–$20,000 per year range based
      on firm count, total capital raised, and disclosed customer-count trajectories, but this is
      not a company-disclosed figure.

      In May 2026, EvenUp launched PLAAS—Pre-Litigation as a Service—the most significant revenue
      model expansion since founding. PLAAS combines EvenUp's AI technology with a US-based legal
      operations team of 300+ staff who handle the full pre-litigation case management lifecycle:
      claim setup, care coordination, medical records retrieval, demand preparation, settlement
      negotiation, and optional lien resolution. Unlike the per-case SaaS product, PLAAS is sold
      as a subscription arrangement covering all firm cases through the pre-litigation stage. Early
      testing generated $10M+ in PLAAS subscription sales, according to LawNext reporting on the
      May 2026 launch—the only concrete revenue figure available in any public source.

      A third revenue stream, AI Drafts Suite, bundles specialized document-generation capabilities
      (AI Drafts discovery documents, Medical Bill Summary, Smart Workflows automation) as part of
      the consolidated platform. EvenUp's about page and newsroom indicate PLAAS optionally includes
      lien resolution services, suggesting a future upsell layer for settlement-stage monetization.

      Revenue is entirely US-based as of May 2026; EvenUp has not disclosed international expansion
      plans, and its legal operations workforce is described as US-based throughout all public
      sources.
