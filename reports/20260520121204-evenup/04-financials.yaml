  - id: "traction-and-growth"
    title: "Revenue Traction and Growth Indicators"
    body: >
      Although EvenUp has not disclosed ARR or revenue figures, a set of operational and funding
      metrics provides indirect evidence of financial trajectory. These signals are consistently
      positive but carry the caveat that all are company-claimed or derived from company-controlled
      marketing materials rather than independently audited data.

      At Series D (October 2024), EvenUp disclosed: revenue growth exceeding 100% year-over-year;
      more than 1,000 demand documents processed per week; 20% of customers using multiple
      products; and a workforce that had doubled in twelve months. By Series E (October 2025),
      Bloomberg Law and AboveTheLaw reported the firm count at approximately 1,500+ (Series D
      baseline) to more than 2,000+ firms (May 2026). The Unite.ai interview with COO Raymond
      Mieszaniec (October 2025) disclosed: $10B+ in aggregate damages recovered for clients'
      customers, 200,000+ cases processed, and more than $14B in damages by May 2026.

      The PLAAS launch (May 2026) generated the only concrete revenue figure available in any
      public source: $10M+ in subscription sales during early testing, per LawNext reporting.
      Early outcome data reported by LawNext and EvenUp's own materials: 95% achievement of
      available third-party policy limits; records retrieved 66 days faster than industry norm;
      demand packets prepared 47 days faster; $1,000 per case in cost savings to PI firms.

      Customer ROI disclosures (company-sourced only): Sweet James PI firm reported $500M+ in
      annual results with 70% year-over-year growth attributed in part to EvenUp; Jeffcoat Injury
      Lawyers reported producing 3× more demand letters and settling cases 30 days faster;
      law firm customer Dwuan Hammond reported 300% top-line revenue growth. Clio's 2025 Legal
      Trends Report, while not EvenUp-specific, documents the legal AI adoption wave that
      provides the market context for EvenUp's customer growth.

      EvenUp's May 2026 website homepage describes the company as serving 2,000+ PI firms and
      processing approximately 10,000 cases per week, up from 1,000+ per week at Series D.
      These growth indicators are consistent with the 100%+ YoY revenue claim made at Series D
      if maintained at a similar pace into 2025–2026, but the actual revenue trajectory cannot
      be independently verified.
