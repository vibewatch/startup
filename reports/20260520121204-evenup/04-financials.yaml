  - id: "funding-history"
    title: "Funding History and Capital Structure"
    body: >
      EvenUp has raised $385M in total disclosed venture funding across at least five rounds (Seed
      through Series E), with round details publicly confirmed for the Series D and Series E only.
      The company remains private as of May 2026; no Form D filings have been identified in SEC
      EDGAR under any EvenUp name variant, consistent with a Regulation D exemption not requiring
      filed Form Ds or with an inadvertent filing under an unretrieved entity name.

      The Series D was announced October 8, 2024—$135M led by Bain Capital Ventures. Participants
      included Premji Invest, Lightspeed Venture Partners, Bessemer Venture Partners, SignalFire,
      and B Capital Group. The post-money valuation exceeded $1 billion, making EvenUp a unicorn.
      At the time, total raised was approximately $235M, implying approximately $100M raised across
      Seed through Series C. EvenUp's blog stated its workforce doubled in the twelve months
      preceding the Series D, and revenue grew more than 100% year-over-year.

      The Series E was announced October 1, 2025—$150M led by Bessemer Venture Partners. New
      participants included REV (the venture arm of RELX/LexisNexis), with B Capital Group and
      Bain Capital participating as existing investors. The post-money valuation exceeded $2 billion.
      The RELX/LexisNexis investment through REV is strategically significant: it represents the
      parent company of a major legal research and workflow competitor (LexisNexis) taking a
      minority ownership stake in EvenUp, which may reflect partnership optionality or competitive
      intelligence—a dual-edged dynamic that warrants diligence on any co-investment or data-sharing
      terms.

      Bloomberg Law, Reuters, and AboveTheLaw reported the Series E consistently as a $2B+ valuation,
      $150M equity round. The GlobeNewswire press release from EvenUp and the ServiceTitan DRS/A
      filing on SEC EDGAR, which identifies EvenUp's legal entity as EvenUp, Inc. (a privately held
      software company with board representation beginning April 2023), both corroborate EvenUp's
      status as a Delaware-incorporated private company.

      No debt financing, convertible notes, or secondary transactions have been publicly disclosed.
      Total disclosed equity capital is $385M. No cash-on-balance-sheet, runway, or burn-rate
      figures have been disclosed for any period.
