    missingEvidence: 'Net Revenue Retention, Gross Revenue Retention, and customer churn rate broken down by firm size band
      and acquisition vintage (Series C, D, E cohorts)

      '
    whyItMatters: 'Without NRR/GRR, it is impossible to determine whether 2,000+ active firms reflects high gross retention
      or high gross additions masking significant churn in the SMB long tail; this is the single most important missing metric
      for durability assessment

      '
    diligencePath: 'Request cohort-level NRR and GRR from management or investor data room; compare against legal-tech SaaS
      benchmarks (Clio reports NRR >100%); ask for monthly gross adds vs. churns since Series D close

