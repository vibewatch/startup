callouts:
- calloutType: strength
  title: Rich Named Customer Proof Across Firm Sizes
  body: 'EvenUp has published detailed, named case studies with specific outcome metrics across at least seven PI firms spanning
    solo to Top-100 scale, geographic regions from Texas to California to Mississippi, and use cases from Express Demands
    to PLAAS managed services. Multiple customers report 30%–400% revenue or throughput improvements; John K. Zaid & Associates''
    Communication Agent results (37% issue-flag rate across 2,000 cases and 7,500 contacts) are independently corroborated
    in LawNext''s December 2025 coverage.

    '
  claimRefs:
  - CU018
  - CU020
  - CU023
- calloutType: risk
  title: No Disclosed Retention Metrics — Durability Is Unverified
  body: 'EvenUp has not disclosed NRR, GRR, customer churn, or cohort-level retention data. The absence of these metrics makes
    it impossible to determine whether 2,000+ active firms reflects high gross retention or high gross acquisition masking
    churn in the SMB long tail. Diligence should request cohort-level data by firm-size band and acquisition vintage before
    treating the headline count as a durable retention signal.

    '
  claimRefs:
  - CU030
  - CU035
- calloutType: risk
  title: All Customer ROI Claims Are Company-Sourced — Cherry-Picking Risk
  body: 'With the exception of Fielding Law and Lerner and Rowe (LawNext), every named customer outcome metric originates
    from EvenUp-published case studies. No independent third-party audit of any ROI claim exists. The 400% (ELG), 300% settlement
    uplift (Zaid), and 400% revenue growth claims represent the highest- performing accounts; publication bias systematically
    excludes underperformers. Investors should commission independent customer interviews across a representative sample before
    relying on these figures for revenue modeling.

    '
  claimRefs:
  - CU042
- calloutType: insight
  title: PLAAS Creates Structural Lock-In That SaaS Alone Cannot
  body: 'The PLAAS managed-service model embeds EvenUp''s US-based case management staff directly into firm pre-litigation
    operations. This goes beyond software switching costs to operational co-dependence: migrating away from PLAAS requires
    rebuilding both the technology layer and the staffed workflow simultaneously. Early adoption by named top-100 firms (Lerner
    and Rowe) and $10M+ in early subscription sales suggest the model resonates with the highest-value customer segment.

    '
  claimRefs:
  - CU033
  - CU036
