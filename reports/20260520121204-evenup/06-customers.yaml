- id: named-customer-proof
  title: Named Customer Proof
  body: 'EvenUp has published detailed production case studies across at least five named customers, each citing verifiable
    outcome metrics. ELG Injury Lawyers, the company''s second customer (May 2021), reported 400% revenue growth within one
    year of full-platform adoption, with demand turnaround dropping from several months to a matter of days using Express
    Demands. ELG''s founder David Eltringham provided direct quotes confirming production use across demand drafting, AI-powered
    rebuttals via Companion, and Medical Management for care timeline tracking. J&Y Law (Los Angeles) reclaimed 320 hours
    per week of case manager time by automating negotiation data-gathering with Companion and AI Playbooks, achieved a 25%
    decrease in case lifecycle timelines, and reduced medical chronology review time by 50%. The firm doubled its monthly
    signed cases after deploying AI Playbooks at intake.

    John K. Zaid & Associates (Houston, 180 attorneys and staff) sends 30% more demands month-over-month without adding headcount,
    and secured settlements 300% higher on cases that previously received under $10,000. Across 2,000 cases and 7,500 AI-conducted
    client calls and texts, EvenUp''s Communication Agent flagged acute issues proactively in 37% of clients and identified
    missed appointments in 20%. Mama Justice (Mississippi/Alabama/Tennessee) achieved 40% higher settlements and 14% faster
    case resolution; 70% of their demands now go through Express Demands at 10 minutes each versus the prior one-plus hour
    per demand. Sweet James PI firm grew to $500M+ in annual results with 70% year-over-year growth, cited by COO Raymond
    Mieszaniec as a flagship example of AI-amplified scale without proportional headcount growth.

    Additional named proof includes Fielding Law (California), whose founding principal Clark Fielding cited 100% case readiness
    using Medical Management ("We can pull up information in real time during depositions"), and Lerner and Rowe founding
    partner Glen Lerner, an early PLAAS customer who reported the service frees senior staff to focus on higher-value work.
    All outcome claims originate from company-published materials; no independent third-party audit of these ROI figures exists,
    a limitation noted explicitly in the adverse evidence section.

    EvenUp''s March 2025 Pioneer Awards program—honoring ten PI firms for AI-driven innovation—creates a formal customer recognition
    and advocacy channel. Awardees receive co-branded marketing, an invitation to EvenUp''s Customer Advisory Board, and joint
    events. This mechanism generates publicly visible customer endorsement while deepening organizational ties, reducing churn
    risk for top accounts.

    '
