      coreProducts: AI Playbooks, Medical Management, Express Demands, Companion
      expansionPath: Full suite including Communication Agents and Settlement Repository
      trigger: COO-led evaluation; scaling case volume without headcount growth
      label: 'Segment: Mid-Market Firm (11-49 attorneys)'
    - stage: 'Segment: Top-100 PI Firm (50+ attorneys)'
      entryPoint: Pioneer Awards network; Bessemer/investor introduction; direct sales
      coreProducts: Full Claims Intelligence Platform; Executive Analytics
      expansionPath: SaaS → PLAAS managed service; Customer Advisory Board
      trigger: Competitive pressure; ROI proof from peer firms; top-100 peer adoption signal
      label: 'Segment: Top-100 PI Firm (50+ attorneys)'
    - stage: 'Expansion Loop: Multi-Product Deepening'
      entryPoint: Internal champion (attorney or COO) advocates for broader rollout
      coreProducts: Adding Communication Agents, AI Playbooks, MedChrons across all case staff
      expansionPath: Per-case volume growth + new product tiers = ARPU expansion
      trigger: Demonstrated ROI on first product; leadership endorsement; advisory board engagement
      label: 'Expansion Loop: Multi-Product Deepening'
