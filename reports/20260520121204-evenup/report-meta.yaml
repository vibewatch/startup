companyProfile:
  summary: EvenUp is a San Francisco-based legal AI company founded in 2019 by Rami Karabibar, Raymond Mieszaniec, and Saam Mashhad. It sells a Claims Intelligence Platform for plaintiff personal injury law firms, using its Piai model and human review workflows to automate medical-record analysis, demand drafting, case monitoring, settlement benchmarking, and managed pre-litigation operations. The company has expanded from software into PLAAS, a higher-touch subscription service that embeds EvenUp legal-operations staff into firm workflows. Public evidence shows strong customer adoption and late-stage financing, but limited disclosure on economics.
  founders:
    - name: Rami Karabibar
      role: CEO & Co-Founder
      background: Founded EvenUp after seeing how difficult it was for personal injury claimants to obtain consistent legal support.
      claimRefs: [CO002, CO015]
    - name: Raymond Mieszaniec
      role: COO & Co-Founder
      background: Previously co-founded fintech startup EquitySim and worked in PwC's risk consulting practice in Hong Kong.
      claimRefs: [CO002, CO016]
    - name: Saam Mashhad
      role: Chief of Product & Legal Operations & Co-Founder
      background: Product and legal-operations leader whose dual role reflects EvenUp's thesis that workflow design and legal ops expertise are inseparable.
      claimRefs: [CO002, CO017]
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: Claims Intelligence Platform centered on the Piai AI model, spanning demand generation, medical chronology, case companion workflows, settlement analytics, communication agents, and PLAAS managed pre-litigation services.
  customerFocus: Plaintiff-side personal injury law firms in the United States, with particular penetration among high-volume PI practices.
  businessModel: Per-case software pricing for the Claims Intelligence Platform plus subscription managed-services revenue from PLAAS and related pre-litigation support.
