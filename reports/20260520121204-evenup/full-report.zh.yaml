      - number: '4.5'
        title: 财务披露缺口与尽调风险
        blocks:
          - type: paragraph
            body: >
              以 EvenUp 所处融资阶段和估值来看，其财务画像明显不透明。公司五年经营历史中，没有任何公开来源披露 ARR、收入、毛利率、经营亏损、烧钱速度、现金跑道或
              EBITDA。这种不透明在私营风险投资支持公司中结构上常见，尤其是未来可能 IPO、希望掌控初始财务叙事的公司；但在任何机构投资前，它会制造必须处理的具体尽调风险。

              唯一具体收入数据（PLAAS 订阅 $10M+）来自早期测试中的新产品，而不是核心平台 ARR，因此不能可靠代表 EvenUp 的整体经常性收入基础。所有客户 ROI 数字（300% 收入增长、Sweet
              James $500M+ 结果）都来自 EvenUp 自有营销材料，没有独立佐证，也没有披露方法论。

              RELX/LexisNexis 的风险投资部门 REV 参与 Series E，带来战略利益冲突隐忧：RELX 是 LexisNexis 的母公司，而 LexisNexis 在法律 AI 工作流上与 EvenUp
              直接或近似竞争。尽调应确认 REV 入股是否包含任何数据访问条款、收购优先要约权，或董事会信息权；这些安排可能让 RELX/LexisNexis 获得竞争情报。

              AboveTheLaw 对 Series E 的报道提出了 AI 实践中的标准担忧：需求生成中的算法偏见、流程中 PHI 的数据隐私，以及 EvenUp 由 AI
              驱动的索赔金额膨胀可能「进一步堵塞法院系统」——系统性抬高初始需求数字，让保险理赔员学会打折对待这些数字，并在规模化后侵蚀 ROI 优势。这些风险真实存在，也是任何高容量法律 AI
              平台的结构性风险；其财务影响（失望客户流失、监管介入、保险公司反制技术）尚未量化。

              PLAAS 究竟是真正的新产品类别，还是把既有 AI 套上组织化服务外壳重新包装，仍是开放问题；LawNext 2026 年 5 月报道指出，PLAAS
              的长期价值取决于律所整合深度和结果规模，仅凭早期测试数据无法评估。
