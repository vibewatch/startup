  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监控触发信号
      - 阈值 / 事件
      - 行动含义
    rows:
      - - HIPAA 数据泄露
        - HHS OCR 泄露门户公开列名 EvenUp；或媒体报道 EvenUp 数据事件
        - 任何已向 OCR 报告、影响 500+ 人的确认泄露
        - 全面暂停尽调；评估影响范围、客户通知义务、OCR 和解风险；考虑退出或重新定价
      - - AI 幻觉导致律师被制裁
        - 法院命令、律师协会投诉或公开判决意见点名 EvenUp 输出是制裁原因
        - 任何公开的不利裁定明确引用 EvenUp 索赔函内容
        - 立即复查产品；重做律师监督流程；投资人可能面临责任敞口
      - - CMS 平台捆绑竞品 AI
        - Filevine、Clio 或 Litify 在产品路线图中宣布原生索赔函 AI
        - 前三大 CMS 平台任一家正式发布竞品原生功能
        - 模型转向情景：评估 EvenUp 的工作流优势是否耐久；重新评估护城河
      - - RELX/LexisNexis 产品冲突
        - LexisNexis 大规模推出面向 PI 的索赔函或法律运营产品
        - 公开产品公告披露拿下 PI 律所客户
        - 评估董事会观察员权利和 IP 保护条款；评估战略替代方案
      - - 毛利率压缩至 40% 以下
        - 任何披露的财务数据表明 PLAAS 服务成本超过 PLAAS 收入的 60%
        - 毛利率连续两个季度低于 40%
        - 重新评估 PLAAS 单位经济；判断 SaaS 分层定价能否抵消服务拖累
      - - AI 法律工具监管规则制定
        - ABA、州律师协会或联邦机构发布有约束力规则，要求律师披露或限制 AI 生成法律文件
        - 有约束力规则，合规期限在 12 个月内
        - 评估合规成本；判断规则会形成护城河（合规级产品）还是构成障碍
    notes: 否决标准不是数学确定性；每个触发信号都需要按严重性和可恢复性做定性判断。阈值只是供投资人复核的指示性监测阈值。
