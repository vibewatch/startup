  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与估值立场
        blocks:
          - type: paragraph
            body: >
              EvenUp 作为专为人身伤害打造的 AI 赛道领导者，位置有防御性；但财务画像不透明，让投资决策蒙上阴影。 公司累计披露股权融资 $385M，最近一轮是 2025 年 10 月由 Bessemer
              Venture Partners 领投的 $150M Series E 轮， 估值超过 $2 billion。任何公开来源都没有出现 ARR、毛利率、EBITDA、烧钱速度或客户净收入留存。
              唯一具体收入数据点，是 EvenUp 在 2026 年 5 月产品发布时自行宣布的 $10M+ PLAAS 早期订阅销售； 这更能证明管线验证，而不是证明规模。


              建议是继续研究。置信度为中：产品证据和品类领导力很强，但没有披露单位经济性，估值无法做压力测试。 风险评级为高，主要由三点驱动：300+
              名美国本土法律运营人员造成的毛利率压缩（按标准美国法律运营薪酬估计年人工成本 $45–75M）、 HIPAA 和律师职业伦理规则下的监管暴露，以及 PLAAS 可能代表公司向服务重型经济性发生结构性转向，
              从而长期压低软件式毛利率。


              估值立场为昂贵。$2B+ 投后估值要求至少满足一项：（a）~$100M+ ARR 且增长 50%+； （b）存在可信路径，通过 IPO 或战略收购实现 $10B+ 退出；或（c）随着赛道成熟，法律 AI
              倍数出现实质重估。 截至 2026 年 5 月，现有公开证据无法验证任何一项。Bessemer 面向法律 AI 的 Roads to $100M ARR playbook 暗示该赛道能够诞生很大的软件公司， 但
              EvenUp 转向托管服务带来纯软件同行没有的成本结构不确定性。Lightspeed 投资组合页面披露 EvenUp 创立不到两年就达到 $10M ARR—— 说明早期速度很快——但那是在 PLAAS
              之前、成本结构更轻的公司阶段。


              投资纪律上的含义是：新投资者若按 $2B+ 进入，应在承诺前要求经审计的 ARR、毛利率和烧钱速度披露； 定价时也应按 50–65% 的混合毛利率（而非纯 SaaS 的 70–80%）来反映 PLAAS
              的托管服务成分。 在计算回报情景前，还必须把 $385M 优先股资本和未量化期权池授予带来的稀释建模进去。
