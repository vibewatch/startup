      - number: '3.2'
        title: 直接 PI AI 竞争者
        blocks:
          - type: paragraph
            body: >
              Supio 是 EvenUp 最直接、资源最充足的 PI AI 竞争者。Supio 由 Jerry Zhou（CEO）和 Kyle Lam（CTO）于 2021 年在 Seattle 创立，并于 2026
              年初开设 San Francisco 办公室；它自称是“唯一为原告法律和群体侵权案件构建的智能体法律 AI 平台”。其 2026 年 5 月发布的 Supio Agent 覆盖案件级和律所级智能体工作流，2026
              年 4 月又与 Thomson Reuters 合作接入 Westlaw Advantage，上述动作把它定位成有能力的全谱系对手。Supio 提供医疗时间线、索赔准备、intake 到和解工作流、面向诉讼的
              Case Bench，以及律所级分析。其定价模式有两档（面向高案量律所的 Case Subscription；追求最低单案成本的 Unlimited Firm Access），没有锁定合同或平台费，直接对标
              EvenUp 于 2025 年 5 月宣布的按案件计价转向。

              截至 2026 年 5 月，Supio 官网称“已有数百家人身伤害律所加入”，明显少于 EvenUp 的 2,000+ 家，说明按客户数看 Supio 大约小 5–10 倍。Supio
              尚未公开披露风险融资；其产品节奏（Supio Agent、Supio Intake、Thomson Reuters 集成、2026 年 2 月开设 SF 办公室）显示其仍在投入 go-to-market
              和产品。Supio 的差异化定位在于平台原生构建于智能体工作流，而不是把 AI 改装到文档生成上。

              Supio 的 Thomson Reuters / Westlaw Advantage 集成（2026 年 4 月宣布）是一项战略差异化：把经过验证的法律引用能力直接嵌入平台后，Supio 回应了 EvenUp
              尚未通过外部数据库集成解决的法律引用 AI 幻觉风险。EvenUp 提供到源文件的逐行引用（对医疗事实而言 HIPAA 合规且高度准确），但没有集成经过验证的外部法律引用数据库。随着法院在 2026
              年施加更严格的 AI 披露要求，法律引用数据库缺口可能会影响合规敏感的大型律所。

              除 Supio 外，尚未公开发现其他规模相当、融资独立的 PI 专业 AI 公司。Darrow AI 聚焦诉讼上游的法律风险敞口管理——在损害发生前发现监管风险和诉讼信号——不是直接的 PI
              原告索赔函工作流竞争者。因此，有效的直接同行竞争集合就是 EvenUp（规模领导者）对 Supio（智能体原生挑战者）。
