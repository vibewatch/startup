      - number: '1.3'
        title: 产品、技术与平台
        blocks:
          - type: paragraph
            body: >-
              EvenUp 的旗舰产品是 Claims Intelligence Platform，一套 AI 驱动工具，面向人身伤害律所自动化诉前工作流。核心是 Piai™，这是 EvenUp 用数十万起 PI
              案件训练的自研 AI 模型，驱动自动化医疗记录分析、损害金额量化和索赔函起草。截至 2025 年 5 月，公司推出 AI Drafts Suite，把 Smart Workflows、Medical Bill
              Summary 和 Express Demands 打包在按案件计价模式下。其他产品包括 Mirror Mode（让输出适配律所风格）、Case Companion（案内 AI 助手）、Voice
              Agent（用于客户 intake）和 AI Playbooks（标准化律所级自动化）。2025 年 12 月，EvenUp 增加 Medical Management，这一工具识别进行中 PI
              案件的治疗缺口，帮助律师优化客户赔付。最新产品是 2026 年 5 月宣布的 PLAAS（Pre-Litigation as a Service）；在该模式下，EvenUp
              实际上成为外包法律运营伙伴，而不只是软件供应商。PLAAS 发布时预售订阅达到 $10M，表明市场对更高接触度服务模式有强需求。平台在整个数据管道中执行 SOC 2 Type II 和 HIPAA 控制。
