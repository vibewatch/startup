      - number: '7.4'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              EvenUp 的三位联合创始人（Rami Karabibar、Raymond Mieszaniec、Saam Mashhad）以及首席科学家 Haixun Wang（ACM Fellow）
              带来显著关键人物集中度。任何一位联合创始人离开，都会影响产品愿景、融资可信度和客户信心。 招募专业法律 AI 人才——具备 NLP 专长的 ML 工程师、愿意进入法律运营的前律师、符合 HIPAA
              要求的数据标注人员—— 竞争激烈且成本高。EvenUp 自己的工程博客文章（Emre Yamangil、Fatemeh Torabi Asr）显示公司有意识地建设文化、留住人才， 但火热 AI
              劳动力市场中的人才流失仍是持续风险。


              扩张 PLAAS 需要同步增加受训法律运营审核员。质量恶化是滞后指标：索赔函中的错误可能要到理赔员谈判暴露不准时才浮出水面， 届时系统性缺陷可能已经扩散到大量案件。监督律师带宽是约束因素——律所合伙人必须审核
              AI 输出以满足能力义务； 如果 EvenUp 的扩张速度快过客户律所的监督能力，伦理和执业过失暴露就会转嫁给这些律所， 从而拉低 EvenUp 的净推荐值和续约率。
