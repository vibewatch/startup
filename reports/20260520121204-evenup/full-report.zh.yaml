      - number: '5.2'
        title: Piai™ 架构：从原始记录到可行动智能
        blocks:
          - type: paragraph
            body: >
              Piai™ 是 EvenUp 的自研 AI 系统，不是单一模型，而是一套专门为 PI 法律工作流设计的专用模型协同栈。其架构沿着三个功能层推进，直接对应 EvenUp 的 System of Record →
              System of Intelligence → System of Action 框架。

              Reading Layer 是基础摄取阶段。它从各类 PI 案件材料中标准化并抽取结构化信息：版式各异的 PDF、扫描文档、手写笔记、表格、带 ICD 编码的医疗表格、警方报告和多页医疗图表。Reading
              Layer 维护一组高度专用模型，每一种抽取实体类型对应一个模型（医疗服务提供方名称、服务日期、ICD
              代码、治疗描述、法院标识、车辆元数据），并由每天数千条用户纠错信号持续再训练。对于视觉内容（事故示意图、放射影像），EvenUp 使用基于 PPO
              的强化学习训练图像转文本摘要器：系统生成基于图像的问题集，评估纯文本 QA
              模型能否根据摘要回答这些问题，并训练摘要器，直到可回答性达到基于像素的准确度。摘要在摄取时连同完整来源信息（页面区域、模型版本、时间戳）只存储一次，从而避免昂贵的重复视觉模型推理。

              Writing Layer 把文档生成锚定在 Reading Layer 抽取出的事实中，而不是一般世界知识。因此 AI Drafts™ 产出会引用从案件记录中抽取的精确医疗服务方名称、ICD
              代码、治疗次数和金额，而不是幻觉出的看似合理数值。每个产出都包含行级引用，把每个主张链接到原始文档、页面和行，便于人工审阅团队和法院把主张追溯回源材料。

              在两个核心层之上，System of Record（SoR）持久化标准化案件实体（索赔人、医疗服务方、就诊、手术 / 程序、账单行项目、车辆），并保留关系图和时间线。System of
              Intelligence（SoI）规划查询执行：事实查找跑在 SoR 上；语气和论证类查询则对原始文档做检索。System of
              Action（SoA）支持主动自动化：缺失记录请求、需求函时点提醒、治疗空档通知和客户触达，都会在案件时间线的正确时点由 SoR 触发。

              EvenUp 的工程副总裁兼 AI 负责人是 Haixun Wang，他是 ACM Fellow 和 IEEE Fellow，以图系统和知识库基础研究闻名，并带来
              Microsoft、Google、Amazon、Meta 和 Instacart 的研究脉络。机器学习工程团队包括专攻 NLP、文档理解和优化的博士。
