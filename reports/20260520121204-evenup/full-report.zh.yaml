      - number: '4.3'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >
              EvenUp 的成本画像与纯软件 SaaS 公司显著不同，关键原因是其 300+ 人美国法律运营团队。这支团队支撑 PLAAS，也支撑持续的数据集与质保运营。这种劳动密集环节带来结构性毛利率压力；在以 $2B+
              估值融资的 AI 初创公司中并不常见。

              Series D 时（2024 年 10 月），EvenUp 披露过去十二个月员工数翻倍，并拥有约 100+ 名工程和产品人员。300+
              人法律运营团队明确位于美国；按美国法律运营岗位的标准薪酬水平（每名员工全口径 $100K–$150K）估算，这意味着每年全口径人工成本约 $45M–$75M，且尚未计入工程、销售市场和基础设施成本。

              2026 年 5 月推出 PLAAS 后，法律运营团队从成本中心（质保、数据集整理、支持）转为创收的托管服务团队。如果 PLAAS 收入足以覆盖法律运营团队的全口径成本，底层 SaaS 平台的单位经济可能接近典型
              SaaS 毛利率（70–80%+）。但如果 PLAAS 采用速度慢，或定价无法覆盖法律运营成本，EvenUp 的混合毛利率会继续显著低于纯软件水平。

              AI 基础设施是第二条重要成本线：Piai 模型在 200,000+ 个案件上训练和推理，需要 GPU 算力。EvenUp 没有披露云服务商或算力支出。参考可比法律 AI 公司，200K+ 案件 /
              年的推理成本可能在 $5M–$20M 之间，取决于模型架构和提示词复杂度。

              合规与信任投入构成第三个成本维度：SOC2 Type II 审计、HIPAA Business Associate Agreement（BAA）合规计划，以及处理 PHI（Protected Health
              Information，受保护健康信息）所需的网络安全基础设施，相比非医疗 SaaS 都会增加实质性开销。

              任何时期的收入、毛利率、EBITDA 或烧钱数据都没有公开披露。累计融资 $385M、后期估值 $2B+ 表明，投资人在为可观的持续亏损提供资金，同时押注公司能扩张到可防守的长期利润率结构。
