      - number: '5.6'
        title: 产品风险与反向技术评估
        blocks:
          - type: paragraph
            body: >
              EvenUp 的产品与技术画像包含四类重要风险，需要投资人做超出公司口径业绩主张的尽调。

              LLM 商品化是生死攸关的技术风险。EvenUp 的 Writing Layer 能力——文档起草、问答、谈判表生成——可以被 OpenAI、Google 和 Anthropic
              的通用模型微调版本部分复制，并应用到 PI 工作流。EvenUp 可防守的护城河在 Reading Layer 和自有 PI 数据集，而不是 Writing Layer
              本身。随着基础模型文档理解能力提升、专用微调成本下降，EvenUp 的 Writing Layer 与提示词设计良好的通用 LLM 之间的差距会收窄。Harvey AI、Clio Duo 和 LexisNexis
              Protégé 已经在把通用 LLM 用于法律文档生成。

              数据依赖与准确性风险：Piai™ 的准确度直接取决于上传案件材料的质量。EvenUp 自有分析显示，16.8% 的案件会在三个月内出现 30 天治疗空档，43%
              最终会出现这类空档；也就是说，输入数据本身经常不完整，并在下游生成文档中制造准确性风险。根据 ABA Rule 1.1，律师仍对验证 AI
              输出承担最终责任，需求函中的一个重大错误就可能让律所暴露在法律过失风险下。

              CMS / 平台集中风险：EvenUp 的集成依赖四家 CMS 供应商的 API 访问。这些供应商中任何一家都可能限制 API 访问、推出竞争性 AI 功能，或调整定价并推高 EvenUp
              成本。RELX/LexisNexis 的战略投资制造了复杂激励：LexisNexis Protégé 在 AI 辅助法律工作上与 EvenUp 竞争，长期商业条款因此需要追问。

              PLAAS 扩展性风险：早期 PLAAS 销售额 $10M+ 显示有需求，但该模型要求美国法律运营人员线性扩张。EvenUp 能否在快速扩大 PLAAS
              团队时保持输出质量和盈利能力，仍未在规模化下验证；LawNext 点出了根本问题：PLAAS 是真正的新类别，还是一个重新包装、外包 AI 外壳的托管服务。
            claimRefs:
              - CE040
              - CE041
              - CE044
              - CE045
      - number: '5.7'
        title: 附录
        blocks:
          - type: callout
            title: 自有 PI 数据集是核心护城河
            body: >
              EvenUp 众包形成的和解语料覆盖数十万起匿名 PI 案件和数百万份医疗记录，是通用 LLM
              竞争者无法复制的基础竞争优势，除非它们花多年建立类似数据合作。每天的专家纠错信号（每天数千次实体模型更新）会随时间复利，形成持续改善的模型质量轨迹；一次性微调的竞争者拿不到这种轨迹。
            calloutType: strength
            claimRefs:
              - CE029
              - CE032
          - type: callout
            title: 人工审阅层既是护城河，也是结构性成本风险
            body: >
              100+ 名美国人工审阅员是质量兜底，让 EvenUp 能承诺超出单靠 LLM 可交付水平的准确性，也是训练数据飞轮的引擎。但 PLAAS
              需要这层人员线性扩张，才能服务更多托管服务客户，因此同时制造扩展约束和毛利率压力。如果为了降本削减人工审阅层，模型质量以及让 Piai™ 区别于通用 LLM 的幻觉控制能力会同步下降。
            calloutType: risk
            claimRefs:
              - CE031
              - CE044
          - type: callout
            title: RELX/LexisNexis 战略投资制造双重激励
            body: >
              RELX 的风险投资部门 REV 参与了 EvenUp $150M Series E，而 LexisNexis——RELX 的核心产品——正在开发 Protégé 和其他 AI 辅助法律工具，与 EvenUp
              的文档起草和案件研究能力竞争。这制造了激励冲突：LexisNexis 通过董事会层面的可见性获得竞争情报，同时保留在 PI 相邻法律 AI 市场与 EvenUp
              竞争的选项。尽调应厘清哪些数据共享限制、竞业条款和信息隔离协议约束 RELX 的投资关系。
            calloutType: risk
            claimRefs:
              - CE041
              - CE040
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >
              EvenUp 的核心客户是美国各类人身伤害律师事务所，从独立执业律师、区域精品所，到大型跨州机构和全国 Top-100 律所。截至 2026 年 5 月，公司服务超过 2,000 家律所；这一数字在
              LawNext 的 PLAAS 发布文章、Above the Law 的 $2B 估值报道以及 EvenUp 自有平台信息中得到交叉确认，约占按案件量计算的前 100 家 PI 律所的
              30%。客户组合偏向中大型：具名案例研究中的律所拥有 50 到 180+ 名律师和员工（Mama Justice、John K. Zaid & Associates、J&Y Law、ELG Injury
              Lawyers），而小型律所长尾贡献覆盖广度。

              在律所内部，平台服务多个角色。创始律师和管理合伙人决定是否采用；COO 和法律运营负责人推动变革管理与集成；律师助理和案件经理是需求起草、医疗管理和通信代理的日常重度用户；需求函撰写人和和解谈判人使用 AI
              Drafts 与 Negotiation Sheets。这种多角色部署很重要：它意味着随着单个律所账户员工增加或产品套件扩展，增购和扩张可以在账户内发生，从而降低收入增长对净新增律所获客的依赖。

              地理覆盖是全国性的。已记录客户横跨 Oregon 和 Florida（ELG）、Texas（John K. Zaid）、Mississippi、Alabama 和 Tennessee（Mama
              Justice）、California（J&Y Law、Fielding Law、Lerner and Rowe）及其他市场。多数客户在诉前阶段运营，因为需求函量最高；但诉讼阶段使用也在增长（J&Y Law 使用
              AI Playbooks 准备用于证词录取的事实和取证自动化），从而扩大可触达工作流。依赖 CMS 集成获客——Filevine、Litify、SmartAdvocate、CasePeer——把 EvenUp
              接入 PI 律所既有技术栈，带来分销倍增，也带来渠道集中风险。
