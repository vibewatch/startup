  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >
              EvenUp 的可服务市场，是面向原告方人身伤害法律运营的软件与 AI；它属于更广义的美国法律科技垂直赛道，由三点界定：（1）买方是按胜诉酬金收费的原告方 PI
              律所，而不是按小时计费的公司法务或辩护业务；（2）核心工作流是人身伤害索赔中的索赔函准备、医疗记录分析、案件估值、intake
              分诊和治疗跟踪；（3）经济回报用和解金额提升和律师助理工时节省衡量，而不是按计费小时效率衡量。人身伤害法涵盖机动车事故、工伤、医疗事故、产品责任和有毒侵权等案件——受伤原告都按赔付比例聘请律师。

              该边界明确排除：（a）保险公司和辩护律师使用的辩护方法律 AI；（b）合同生命周期管理和 eDiscovery 等公司法务部门工具；（c）销售给保险承运人的 InsurTech 理赔处理平台；以及（d）没有针对
              PI 案件类型校准的通用 AI 编码助手或广义研究工具。相邻市场包括 Filevine 和 Clio 等法律案件管理系统（CMS）、医疗记录调取服务和诉讼融资——EvenUp 会与它们对接，但并不直接竞争。

              EvenUp 目前替代的现状方案包括：人工律师助理起草索赔函（通常每封 5–20 小时）、通用文字处理模板、只返回结构化摘要的医疗时间线供应商，以及缺少 PI 专属训练数据和 ABA Rules 与 HIPAA
              要求的保密控制的现成大语言模型（Claude、ChatGPT）。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM019
