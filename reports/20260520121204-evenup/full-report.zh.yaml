            title: AI 偏见与法院系统担忧带来监管敞口
            body: >-
              Above the Law 和法律评论者指出，AI 索赔函可能引入算法偏见、抬高或锚定索赔价值，并给已经拥堵的法院案卷增加摩擦。如果原告律师群体的采用速度超过质量控制，EvenUp
              可能面临律师协会审查、其律所客户的执业过失风险，或限制产品采用的司法反弹。公司的 SOC 2 / HIPAA 认证解决数据隐私问题，但并不直接回应索赔膨胀或偏见担忧。
