  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >
              从创立到 2026 年 5 月，EvenUp 的商业化策略已经明显改道，最终形成两条并行收入线：面向 AI 驱动 Claims Intelligence Platform 的按案收费 SaaS 模式，以及面向
              PLAAS 的订阅式托管服务模式。

              2025 年 5 月以前，EvenUp 采用分层功能授权销售平台访问权——需求函生成、医疗时间线等模块分别定价。2025 年 5 月，EvenUp 推出重构后的 Claims Intelligence
              Platform，主打「每案一个清晰、可预测的成本」，把全套产品（AI Drafts、Smart Workflows、Medical Bill Summary、Express
              Demands）整合成统一的按案计费单元。这一转向让 EvenUp 的定价贴合人身伤害（PI）律所客户的胜诉收费经济模型：律所按处理案件付费，而不是按用户席位或功能访问付费，因此可以直接衡量
              ROI。单案价格没有公开披露，需要通过销售沟通确定；分析师基于律所数量、累计融资额和披露的客户数量轨迹，估计每家律所平均收入（ARPU）在每年 $5,000–$20,000 区间，但这不是公司披露数据。

              2026 年 5 月，EvenUp 推出 PLAAS（Pre-Litigation as a Service），这是创立以来最重要的收入模型扩张。PLAAS 把 EvenUp 的 AI 技术与一支 300+
              人的美国法律运营团队结合起来，覆盖完整诉前案件管理生命周期：索赔建档、护理协调、医疗记录调取、需求准备、和解谈判，以及可选的留置权处理。不同于按案计费的 SaaS 产品，PLAAS
              以订阅方式销售，覆盖律所在诉前阶段的全部案件。LawNext 对 2026 年 5 月发布的报道显示，早期测试带来 $10M+ 的 PLAAS 订阅销售额；这是所有公开来源中唯一具体的收入数字。

              第三条收入线 AI Drafts Suite 把专业文档生成能力（AI Drafts 证据开示文件、Medical Bill Summary、Smart Workflows 自动化）打包进整合平台。EvenUp
              的公司介绍页和新闻稿显示，PLAAS 可选包含留置权处理服务，意味着未来可能在和解阶段再叠加一层增购变现。

              截至 2026 年 5 月，收入完全来自美国市场；EvenUp 没有披露国际扩张计划，所有公开来源也都把法律运营团队描述为美国团队。
