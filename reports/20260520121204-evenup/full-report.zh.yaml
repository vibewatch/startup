      - number: '2.5'
        title: 采用约束与反向证据
        blocks:
          - type: paragraph
            body: >
              PI 法律中的法律 AI 采用面临一组独特的结构性约束，并非所有软件类别都同样适用。ABA Model Rule 1.1（Competence）要求律师对其在客户代理中使用的技术保持足够理解，ABA
              关于技术胜任力的注释（Comment 8）把该要求延伸到 AI 工具——也就是说，律师不能在缺少充分监督的情况下把判断简单委托给 AI 平台。ABA Model Rule
              1.6（Confidentiality）禁止未经同意披露客户信息，要求任何处理案件数据，尤其是医疗记录的 AI 平台，在严格的数据隔离和合同保密保证下运营。ABA Rule 5.5
              还禁止协助未经授权执业，引发关于 AI 生成且未由持牌律师审查批准的法律策略的疑问。EvenUp 通过取得 SOC 2 Type 2 再认证和 HIPAA 证明来回应这些合规义务，但维持合规是一项持续运营成本。

              AI 幻觉是法律场景中具体且已有充分记录的风险。索赔函中若嵌入看似自信但错误的引用或伪造判例，可能让律师面临执业过失索赔、纪律处分或制裁。EvenUp
              的逐行引用模型试图通过把每个主张绑定到源文件来缓解风险，但风险没有消失，也无法完全靠自动化消掉。Above the Law 对 EvenUp 的评论明确指出，算法偏见、数据隐私以及 AI
              生成索赔函可能用标准化文件“堵住”法院系统的风险仍然存在。一个可能的反向情景是：保险理算员开始压低可识别 AI 生成模板的索赔函估值，随着时间推移削弱 EvenUp 提升和解金额的价值主张。

              小律所预算约束是最后一个结构性摩擦：大多数 PI 律所少于 10 名律师，技术预算有限。与既有案件管理系统（Filevine、MyCase、Clio）集成需要实施投入和员工培训，可能劝退最小型律所。
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
