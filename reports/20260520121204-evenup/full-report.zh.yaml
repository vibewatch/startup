      - number: '8.5'
        title: 投资逻辑失效触发点与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              EvenUp 投资逻辑建立在三项结构性主张上：（1）EvenUp 是 PI 法律 AI 中可持续的品类领导者，拥有自我强化的数据护城河； （2）PLAAS
              创造一条新的高价值收入线，把固定人工成本转化为订阅收入；（3）公司存在可信路径， 可以通过 IPO 或战略退出，以足以支撑 $2B+ Series E 价格的估值实现退出。
              三项主张都与现有公开证据一致，但没有机密财务披露，任何一项都无法独立验证。


              主要投资逻辑失效触发点包括：（a）PLAAS 毛利率低于 45%，说明托管服务成分无法在规模化时吸收法律运营人工成本； （b）前 100 大 PI 律所年客户流失率超过 15%，表明产品锁定弱于公司表述；
              （c）竞争进入者（Harvey、OpenAI 或 Filevine）以显著更低成本推出实质可比的 PI 索赔函工作流， 削弱 EvenUp 按案定价权；以及（d）EvenUp 或使用 EvenUp AI
              输出的客户律所发生重大 HIPAA 泄露或律师伦理执法行动， 触发监管和声誉伤害并加速客户流失。


              Supio AI 竞争对手博客明确指出法律 AI 的幻觉风险，以及绑定来源核验的重要性——这也是 EvenUp 索赔函和医疗时间线输出面临的同一质量风险。 虽然 EvenUp 声称人工审核层是其质量缓释措施，但
              Mata v. Avianca 制裁案（S.D.N.Y. 2023）已经确立： 当输出错误在法庭浮出水面时，律师监督并不能让 AI 供应商免受声誉伤害。 一次高知名度、对 EvenUp
              生成索赔函的对抗性法律挑战，就可能加速客户审查并拉长 PLAAS 销售周期。


              最终尽调要求包括：经审计的 ARR 和毛利率披露（至少覆盖 Series E 交割前过去 12 个月）； PLAAS 单位经济性（每家律所每年收入、每个 PLAAS
              订户毛利率、每份合同所需法律运营人头，以及每名员工案件产出）； SaaS 和 PLAAS 两条线的客户净收入留存；RELX/REV 投资的治理条款（竞业限制、数据共享权、优先要约权）； 以及 Piai 模型的
              IP 归属和授权结构（尤其是任何第三方 LLM 提供商依赖、微调数据权利，以及控制权变更后仍可存续的可迁移条款）。 没有这五组数据，现有证据无法支持在 $2B+ 估值下完整放行。
            claimRefs:
