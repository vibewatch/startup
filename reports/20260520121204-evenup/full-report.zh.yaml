      - number: '8.2'
        title: 当前融资背景与进入纪律
        blocks:
          - type: paragraph
            body: >
              EvenUp 的融资历史横跨从种子轮到 Series E 的五轮已披露融资，其中 Series D（$135M，2024 年 10 月宣布，2024 年 6 月公开报道，估值 $1B+） 和 Series
              E（$150M，2025 年 10 月，估值 $2B+）在 Bloomberg Law、EvenUp 自家博客以及多家行业出版物中相互印证。 GlobeNewswire 的 Series D 新闻稿和
              EvenUp 2024 年 10 月 8 日博客都确认了 $135M 融资、$1B+ 估值， 以及当时累计资本 $235M。Series E 将已披露股权融资总额提高到 $385M。 对 “EvenUp,
              Inc.” 做 EDGAR 全文搜索，会返回四份 ServiceTitan DRS/A 文件（CIK 0001638826）， 其中把 EvenUp, Inc. 标识为一家 Delaware 私营公司，并自
              2023 年 4 月起有董事会代表——尚未识别出 EvenUp 自己独立提交的 Form D， 这与 Regulation D 豁免不要求提交 Form D，或实体名称变体尚未定位相一致。


              $2B 估值意味着大约 12 个月内较 $1B+ Series D 抬升约 100%。Series E 参与方包括 Bessemer（领投）、 REV（RELX/LexisNexis 的 VC 部门）、B
              Capital，以及从前几轮延续的 Bain Capital。 RELX/REV 的参与具有战略含义：LexisNexis 母公司 RELX 在法律 AI 研究工具（Lexis+ AI，现 Lexis+
              Protégé）上有独立竞争利益。 这笔投资一方面给 EvenUp 带来战略选择权信号——未来可能被收购；另一方面也引入利益冲突， 需要从治理和 IP 条款上审查。


              $385M 优先股堆叠带来有意义的清算优先权压力。如果 EvenUp 以 $1B 被收购， 单纯优先股清算优先权很可能吸收全部交易对价，具体取决于未公开的参与权和转换机制。 按 Series E 价格（$2B+
              估值）进入，需要可观退出溢价才能产生风险投资级回报。 联合创始人明确提到 IPO 是一种可能性（据 Axios 2025 年 10 月报道），说明管理层在朝公开退出管理公司； 但截至 2026 年 5 月，没有
              S-1 或 IPO 流程启动。Filevine、Litify、CasePeer/Clio 和 SmartAdvocate 是主要案件管理分发集成； 上市前，任何平台排他或定价变化都可能削弱收入可预测性。
