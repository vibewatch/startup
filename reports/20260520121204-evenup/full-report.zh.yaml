      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 继续研究：先披露，再承诺
            body: >
              EvenUp 在一个庞大且自动化不足的市场中展现出品类领导力，客户证据很强，并推出了新型托管服务扩张。 投资案例卡在财务不透明上：ARR、毛利率和 PLAAS 单位经济性都没有公开数据。 新投资者若按 $2B+
              进入，应在承诺前要求经审计的财务披露。 相对于已披露证据，估值昂贵；如果 PLAAS 毛利率不及预期，或 AI 商品化加速，下行风险很实质。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
          - type: callout
            title: PLAAS 毛利率是最大未知数
            body: >
              最重要的未解变量，是 PLAAS 托管服务产品的混合毛利率。 如果 PLAAS 收入能够覆盖 300+ 名美国法律运营人员的 $45–75M 年度成本以及 AI 基础设施成本， EvenUp 的经济性就接近
              SaaS。否则，EvenUp 就是一家按软件倍数估值的服务公司——结构错配，理应对应显著更低估值。
            calloutType: risk
            claimRefs:
              - CV033
              - CV034
          - type: callout
            title: RELX 投资：战略选项还是竞争风险
            body: >
              RELX/REV 参与 Series E，让 LexisNexis 母公司持有 EvenUp 少数股权。 这带来战略选择权上行（LexisNexis 可能以溢价收购），也带来治理风险（董事会可接触 EvenUp
              自有 PI 数据集和 PLAAS 作业手册）。 投资者应审查 REV 投资条款，包括任何共同投资者竞业限制、数据共享限制和优先要约权条款。
            calloutType: insight
            claimRefs:
              - CV014
              - CV015
              - CV039
