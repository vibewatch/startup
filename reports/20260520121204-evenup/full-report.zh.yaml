  - id: FE002
    title: EvenUp PLAAS 运营流程：从接案到解决
    type: flow
    layout: wide
    summary: 端到端案件生命周期流程，展示 Piai™ AI 层与人工复核如何从 CMS 接案一路协作到和解。
    data:
      nodes:
        - id: intake
          label: 案件接入与 CMS 同步
          details: 律所提交案件；CMS 在 <1 个工作日内把客户数据、保单号、接案访谈记录自动同步到 EvenUp
        - id: ingest
          label: Piai™ 记录摄取
          details: 阅读层对 PDF、扫描件、手写材料做 OCR；抽取医疗实体、ICD 编码、治疗时间线和事故示意图，写入 System of Record
        - id: analyze
          label: AI Playbooks™ 自动分析
          details: Playbooks 扫描每次新上传文档；无需律师提示，就标记责任缺口、TBI 指征、缺失记录和高价值案件信号
        - id: medmgmt
          label: Medical Management 与 Communication Agents
          details: Medical Management 实时跟踪治疗；Comms Agents 通过语音 / SMS 与客户联系；缺口和爽约会推送给案件经理
        - id: draft
          label: AI Drafts™ 生成
          details: 写作层基于 SoR 事实生成索赔函、起诉状、书面质询；每一项主张都通过 Smart Citations 链接到来源文档 / 页码 / 行号
        - id: review
          label: 人工 QA 与专家复核
          details: 100+ 名护士、律师助理、理赔员复核 AI 输出；校正结果回流到阅读层模型重训；律师逐行复核引证
        - id: negotiate
          label: 谈判准备
          details: Case Companion™ 提供实时案件问答；Settlement Repository 按伤情 / 治疗 / 保单基准对比可比和解结果
        - id: resolve
          label: 和解 / PLAAS 结案
          details: 律所选择和解或诉讼；PLAAS 订阅客户可由 EvenUp 团队端到端处理索赔谈判和可选留置权解决
      edges:
        - from: intake
          to: ingest
          label: CMS 同步
        - from: ingest
          to: analyze
          label: SoR 已填充
        - from: analyze
          to: medmgmt
          label: 案件策略标记
        - from: medmgmt
          to: draft
          label: 治疗已核验
        - from: draft
          to: review
          label: AI 草稿排队
        - from: review
          to: negotiate
          label: 已复核索赔函交付
        - from: negotiate
          to: resolve
          label: 谈判已准备
    approximationNotes: PLAAS 流程展示的是托管服务客户；仅使用 SaaS 的客户在「复核 → 谈判 → 解决」环节退出，EvenUp 员工除交付 AI 输出外不再介入。
    claimRefs:
      - CE004
      - CE011
      - CE016
      - CE022
      - CE031
