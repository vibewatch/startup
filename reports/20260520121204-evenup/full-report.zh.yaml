      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              EvenUp 位于法律 AI（偏软件）和法律托管服务（人力资本密集）的交叉点，同行选择很难。 最相关的可比集合横跨专用法律 AI 初创公司、法律工作流 SaaS 平台、M&A 参考点和垂直 SaaS 类比对象。
              所有可比都只具方向性；EvenUp 财务不透明，无法做严谨收入倍数分析。


              Harvey AI（通用法律 AI，据 Bloomberg Law 报道 2025 年 2 月 $300M Series D 后估值约 $3B）是最接近公开市场的类比对象， 同为后期私营法律 AI 公司；但
              Harvey 服务 BigLaw 和企业客户，而不是 PI 原告律所， 收入模型没有托管服务成分，也不大规模处理 PHI。Harvey 可比说明，市场会给有清晰企业牵引力的专用法律 AI 平台高溢价倍数；
              但它解释不了 EvenUp 的软件 / 服务混合经济性。Harvey 估值 $3B，比 EvenUp 的 $2B+ 高 50%， 虽然服务的可触达市场不同且可说更宽；这意味着在调整市场差异后，EvenUp
              可能按相对规模与 Harvey 持平或小幅折价估值。


              Casetext/CoCounsel（法律研究 AI，2023 年 6 月被 Thomson Reuters 以 $650M 收购）是相关 M&A 参考。 $650M 的收购价把一家尚未达到 ARR
              规模、尚未盈利的法律 AI 公司定在很高溢价上——但远低于 EvenUp 当前 $2B+ 估值。 Casetext 主要做法律研究（运营复杂度较低、无 PHI、无法律运营人员），而 EvenUp 的集成式
              PLAAS 产品结构不同， 可以说更难复制，但也更难估值。Casetext 退出验证了法律 AI 的 M&A 退出选择权，但也给出一个更低水位； EvenUp 的估值已经超过它 3x。


              Clio（法律执业管理 SaaS，据 LawNext 报道 2021 年 Series F 估值 $3B）是最突出的独立法律工作流 SaaS。 Clio 广泛服务普通律所，披露过收入增长和盈利里程碑，并在约
              $100M+ ARR 时达到 $3B 估值。 EvenUp 在未披露 ARR 的情况下估值 $2B+，意味着三种可能之一：（a）ARR 规模相当或更大； （b）更高增长倍数反映更快增长；或（c）市场为 Clio
              没有的托管服务叠加付溢价。 Clio 参考给出一个粗略“可比 SaaS”基准：$3B 估值约为 30x ARR。


              ServiceTitan（家居 / 商业服务垂直 SaaS，据 SEC DRS/A 文件，2024 年 12 月 IPO 估值约 $8B）是相关垂直 SaaS 类比。 ServiceTitan
              运营复杂度高于纯软件 SaaS——它嵌入现场服务工作流——IPO 时估值约为前瞻收入的 12–16x。 将 ServiceTitan 倍数应用到 EvenUp 估计 ARR，意味着 EvenUp 的 $2B+
              估值需要 ARR 处在 $125–170M 区间、收入倍数为 12–16x； 这一数字显著高于任何公开披露的 EvenUp 收入指标，更像管理层预测，而不是已确认实际值。


              Grand View Research 法律 AI 市场预测（2024 年 $1.45B，到 2030 年增至 $3.90B，CAGR 17.3%） 和 MarketsAndMarkets 法律 AI
              软件预测（2025 年 $3.11B，到 2030 年 $10.82B，CAGR 28.3%） 都显示市场顺风强劲；但 EvenUp 的 $2B+ 估值已经把一个年轻、分散市场中的重要份额嵌入进去。 按较高
              CAGR 估计，EvenUp 需要到 2030 年在约 $3–11B 的法律 AI 软件市场中拿下并守住有意义份额， 才能证明当前隐含退出估值合理。
