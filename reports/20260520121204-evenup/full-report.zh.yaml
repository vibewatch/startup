      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景与估值敏感性
        blocks:
          - type: paragraph
            body: >
              三个情景框住截至 2026 年 5 月的 EvenUp 投资案例。所有情景都基于估计； 没有公司披露的 ARR、毛利率或增长率可用来锚定数字。收入估计来自 $385M 累计融资、 已披露增长轨迹（Series D
              时 YoY >100%）、Lightspeed 发布的 ARR 轨迹（不到两年从 $0 到 $10M）， 以及 PLAAS $10M+ 早期订阅数字。


              乐观情景下，PLAAS 快速扩张，足以覆盖 300+ 名法律运营人员的人头成本， 到 2026 年底推动混合 ARR 达到 $150–200M，毛利率 65–70%。在这一情景中， 收入增长 80%+
              会把收入倍数压缩到 10–13x，与 IPO 时高增长垂直 SaaS 相当。 通过 IPO 或战略收购（最可能是 RELX/LexisNexis、Thomson Reuters 或大型保险公司）以 $4–6B
              企业价值退出， 会让 Series E 进入价产生 2–3x 回报。来自 200,000+ 个案件和 $14B+ 损害赔偿的数据护城河， 会成为商品化 LLM 提供商难以复制的结构性壁垒。


              基准情景下，PLAAS 到 2026 年底在 50–100 家企业级 PI 律所中获得牵引， 产生 $50–80M 混合 ARR，毛利率 55–60%。随着 PLAAS 销售周期拉长、 按案 SaaS
              平台在当前前 100 大律所客群中趋近饱和，收入增长放缓到 40–60%。 按 $3–4B 企业价值 IPO（考虑当前市场条件，2027–2028 年现实可行）， Series E 可产生 1.5–2x
              回报。托管服务成分在收入中占比上升后，倍数压缩风险增加。


              悲观情景下，受律师-客户特权顾虑、HIPAA 合规摩擦，以及大型 PI 律所自建还是购买的竞争决策影响， PLAAS 采用速度慢于预期。ARR 停滞在 $40–60M。与此同时，AI 商品化周期——OpenAI
              法律 AI 工具、 Filevine 的 LOIS AI，以及 Harvey 可能扩展到 PI——压缩按案 SaaS 产品的定价权。 $45–75M 年度法律运营成本造成每年 $20–40M 经营亏损。 以
              $800M–$1.2B（低于 Series E 估值）战略退出，或下轮降价融资，都会让 Series E 投资者亏损。


              估值敏感性分析集中在三个驱动因素：（1）PLAAS ARR 爬坡速度，（2）混合毛利率（由法律运营成本吸收情况驱动）， 以及（3）市场退出倍数。在 $100M ARR、10x 收入倍数下，毛利率变化 10
              个百分点（例如 55% 对 65%） 会让隐含企业价值变化 $300–500M。毛利率敏感性是主导风险因素，也是投资案例中最重要、尚未验证的变量。
