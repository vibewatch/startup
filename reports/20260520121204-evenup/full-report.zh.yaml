              - CU030
              - CU035
          - type: callout
            title: 所有客户 ROI 主张都来自公司——存在选择性披露风险
            body: >
              除 Fielding Law 和 Lerner and Rowe（LawNext）外，每一个具名客户成效指标都来自 EvenUp 发布的案例研究。 没有任何 ROI
              主张经过独立第三方审计。400%（ELG）、300% 和解额提升（Zaid）以及 400% 收入增长这些主张， 代表表现最好的客户；发布偏差系统性排除了表现较差的账户。投资者在用这些数字做收入建模前，
              应先委托对代表性样本做独立客户访谈。
            calloutType: risk
            claimRefs:
              - CU042
          - type: callout
            title: PLAAS 创造了单靠 SaaS 做不到的结构性锁定
            body: >
              PLAAS 托管服务模式把 EvenUp 的美国本土案件管理人员直接嵌入律所诉前运营。 这已经不只是软件切换成本，而是运营上的共同依赖：从 PLAAS 迁出，需要同时重建技术层和有人值守的工作流。 具名前 100
              大律所（Lerner and Rowe）的早期采用，以及早期订阅销售超过 $10M， 说明这一模式能打动价值最高的客户群。
            calloutType: insight
            claimRefs:
              - CU033
              - CU036
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              EvenUp 处在医疗数据法和律师职业行为规则的交叉口，PLAAS 会让这层层监管暴露进一步加深。 在 HIPAA 下，EvenUp
              代表人身伤害律所处理受保护健康信息（PHI）——医疗记录、治疗摘要、账单明细—— 这些数据由律所从受监管的医疗服务提供方取得。这使 EvenUp 成为 HIPAA 商业伙伴，
              必须签署商业伙伴协议（BAA），维护行政、物理和技术防护措施，并在发现违规后 72 小时内报告。 自 HITECH Act 以来，HHS OCR 可直接执法商业伙伴；罚款可达每个违规类别每年 $1.9M。
              2024 年医疗行业泄露受害者达到 289 million 人——最大单一事件（Change Healthcare）影响 192.7 million 人—— 说明商业伙伴泄露正是 OCR 的重点目标。


              律师职业伦理规则又叠加第二层。ABA Model Rule 1.1（能力）要求监督律师理解自己使用的技术； Rule 1.6（保密）限制在未经同意或缺乏运营必要性时向供应商披露客户数据； Rule 5.5
              禁止协助未获授权执业。随着 EvenUp 的 PLAAS 把法律运营人员推进到主动案件工作中， 多个州的监管者可能会审查非律师“法律运营”人员是否越界进入法律执业。Texas Bar
              和其他州律师协会已经发布伦理指引， 要求律师监督 AI 工具。Mata v. Avianca（S.D.N.Y. 2023）中，法院因律师提交含有虚构判例引用的 AI 生成简报而施加制裁， 说明在律师监督之前出现的
              AI 输出错误，会在下游变成职业责任。NIST AI Risk Management Framework 提供了自愿但越来越常被引用的 AI 治理标准， 监管者和法院可能把它用作基准。FTC 对生成式 AI
              供应链的竞争审查——尤其是云计算和模型集中度—— 也可能间接影响 EvenUp 的基础设施伙伴。
            claimRefs:
              - CR001
              - CR002
