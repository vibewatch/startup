      - number: '4.4'
        title: 收入牵引力与增长指标
        blocks:
          - type: paragraph
            body: >
              EvenUp 没有披露 ARR 或收入数字，但一组运营和融资指标间接勾勒出财务轨迹。这些信号持续偏正面，但必须加上限定：它们要么来自公司口径，要么来自公司控制的营销材料，而不是独立审计数据。

              Series D 时（2024 年 10 月），EvenUp 披露：收入同比增长超过 100%；每周处理超过 1,000 份需求文件；20% 客户使用多个产品；员工数在十二个月内翻倍。到 Series
              E（2025 年 10 月），Bloomberg Law 和 AboveTheLaw 报道的律所数量从约 1,500+（Series D 后基线）提升到 2,000+ 以上（2026 年 5 月）。COO
              Raymond Mieszaniec 在 Unite.ai 的访谈（2025 年 10 月）中披露：为客户的当事人累计追回 $10B+ 损害赔偿，处理 200,000+ 个案件，并在 2026 年 5 月达到超过
              $14B 的损害赔偿额。

              2026 年 5 月 PLAAS 发布带来了所有公开来源中唯一具体的收入数字：据 LawNext 报道，早期测试阶段订阅销售额超过 $10M。LawNext 和 EvenUp
              自有材料还披露了早期结果：取得可用第三方保单限额的 95%；记录调取比行业常态快 66 天；需求包准备快 47 天；PI 律所每案节省 $1,000 成本。

              客户 ROI 披露仅来自公司：Sweet James PI 律所报告年结果超过 $500M，收入同比增长 70%，并称 EvenUp 有部分贡献；Jeffcoat Injury Lawyers 报告需求函产出提升
              3×，案件和解快 30 天；律所客户 Dwuan Hammond 报告营收增长 300%。Clio 的 2025 Legal Trends Report 虽然不是 EvenUp 专属，但记录了法律 AI
              采用浪潮，为 EvenUp 的客户增长提供市场背景。

              EvenUp 2026 年 5 月的网站首页称，公司服务 2,000+ 家 PI 律所，每周处理约 10,000 个案件，高于 Series D 时每周 1,000+ 个案件。如果 2025–2026
