          - type: callout
            title: REV/LexisNexis 的 Series E 投资制造结构性冲突
            body: >
              REV 参与 EvenUp Series E，是财务画像中最重要的未披露治理风险。REV 是 RELX plc 的风险投资部门，而 RELX 是 LexisNexis 的母公司。LexisNexis 在法律 AI
