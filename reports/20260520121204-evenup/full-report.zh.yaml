      - number: '5.3'
        title: CMS 集成、部署与数据依赖图
        blocks:
          - type: paragraph
            body: >
              EvenUp 的集成策略瞄准主流人身伤害案件管理系统：Filevine、Litify、SmartAdvocate 和
              CasePeer。公司称可在不到一个工作日内完成完整实施，通过自动同步案件元数据完成上线——客户信息、保单号和接案访谈记录会在上线导入时从 CMS 流入 EvenUp，并在新记录到达时持续更新。

              Litify 集成会在文档生成后立刻把生成草稿以直接链接形式送入 CMS，减少诉讼人员切换上下文。Smart Workflows 借助 CMS
              连接监控案件状态字段，并在律所定义的条件满足时自动触发提醒和动作（例如距上次治疗经过的时间、缺失记录标记）。Communication Agents™
              会把结果——通话录音、结构化摘要、索赔编号、理赔员分配——直接同步到 CMS 案件文件，无需单独登录。

              这种依赖拓扑带来双边风险。数据摄取侧，EvenUp 依赖律所上传记录以及从 CMS 平台同步数据的质量和完整性；接案阶段数据卫生差，会在下游削弱 Piai™ 准确度。平台依赖侧，CMS 供应商可以修改
              API、限制第三方集成，或自建竞争性 AI 功能；Filevine 自身 AI 路线图已经显示出这种动态。EvenUp 通过覆盖四大 CMS 平台部分缓释风险，但若某个占主导地位的 CMS 伙伴弃用
              API，仍会影响已安装客户基础中相当一部分的服务连续性。

              PLAAS 引入第三重依赖：一支 300+ 人的美国案件管理团队，为订阅律所处理诉前工作流。这带来实质性的运营扩展约束——获取新的 PLAAS 客户，需要以高于典型 SaaS
              产能扩张的速度招聘、培训并质检法律运营人员。
