        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，EvenUp 服务超过 2,000 家人身伤害律所，包括美国前 100 大 PI 律所中的约 30%；该比例高于 2025 年 5 月 AI Drafts Suite 发布时披露的
              20%，当时整体客户为 1,500+ 家律所。公司累计解决超过 200,000 起 PI 案件，处理原告损害赔偿金额超过 $14 billion。PLAAS 发布时，EvenUp 报告每周处理约 10,000
              起案件。考虑到前 100 大 PI 律所占美国人身伤害和解量的份额不成比例地高，高端市场渗透尤其重要；EvenUp 在高端客户中的渗透率降低了被竞争替代的风险。公司的规模指标也形成护城河：Piai™
              模型随每个新增案件继续改善，EvenUp 的 300+ 人法律运营团队提供了纯软件竞争者缺少的人工复核兜底。2025 年入选 Forbes Cloud 100，为 EvenUp
              作为头部云软件公司的位置提供了第三方验证。公司的按案件计价模式把激励直接与律所吞吐量绑定，相比固定费用企业 SaaS 替代方案，摩擦更小。
