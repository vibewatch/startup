      - number: '7.7'
        title: 展示材料
        blocks:
          - type: callout
            title: HIPAA + AI 幻觉：叠加威胁
            body: >-
              EvenUp 最高严重度的两类风险——HIPAA 泄露和 AI 幻觉——会相互叠加。 AI 处理的病历带有 PHI；如果 OCR 准确性失败把错误 PHI 写入索赔函，可能同时构成 HIPAA 禁止的不当披露，
              也构成 AI 幻觉错误，让监督律师暴露在执业过失中。EvenUp 的 DPA 和已发布产品文档都没有完全覆盖这一交叉点。
            calloutType: risk
