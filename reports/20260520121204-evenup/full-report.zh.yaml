      - number: '5.4'
        title: 差异化：自有数据集、反馈闭环与人工审阅层
        blocks:
          - type: paragraph
            body: >
              EvenUp 的核心可防守优势来自自有 PI 数据集、专家标注反馈闭环和人工审阅层；三者叠加，形成通用 AI 竞争者拿不到的数据飞轮。

              自有数据集来自早期说服 PI 律所客户贡献匿名化和解与案件结果数据。这个众包语料如今覆盖数十万起伤害案件和数百万份医疗记录，是每个 Piai™
              模型的训练基础。它不只包含公开判决数据，也包含和解前谈判结果与案件策略模式；这些才是 EvenUp 最可防守的竞争差异。

              专家反馈闭环每天运转：用户对 Reading Layer 模型输出的数千条纠错（医疗服务方名称标准化、日期修正、治疗分类、账单核对）会直接回流到微调周期。资深 ML
              工程师描述了一条有意设计的标注流水线，摄取这些纠错并持续更新各个实体模型。这为专门的 PI 实体带来精度优势——医院系统名称变体、区域保险理赔员行为模式、PI 专属 ICD 代码簇——没有 EvenUp
              的真实标注语料，通用 LLM 无法复制。

              人工审阅层由 100+ 名美国护士、律师助理、资深理赔员和案件经理组成，会在交付给律所客户前验证 Piai™
              输出。它承担两个功能：质保（在错误到达律所前捕获）和训练信号生成（纠错成为下一轮模型迭代的监督训练数据）。EvenUp 把这一层定位为「远超单靠 LLM 可达到的精确度和准确性」，也是 PLAAS
              能提供绩效保证（早期测试追回可用保单限额的 95%）的结构性原因。

              客户 ROI 披露虽然全部来自公司，但显示平台确实带来可衡量加速：Jeffcoat Injury Lawyers 需求函产出提升 3×，和解快 30 天；早期 PLAAS 队列调取医疗记录比行业常态快 66
              天，交付需求函快 47 天。
