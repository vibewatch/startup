        title: 附录
        blocks:
          - type: callout
            title: PLAAS 从结构上改变 EvenUp 的利润率画像
            body: >
              EvenUp 的 300+ 人美国法律运营团队过去是数据集整理和 AI 质保所必需的成本中心。PLAAS 把这支团队转为托管服务收入单元。PLAAS 的财务可行性取决于订阅定价能否覆盖 300+
              名美国法律运营员工约 $45M–$75M 的估算年度全口径成本，再加上 AI 基础设施开销。如果 PLAAS 定价不足或采用缓慢，EvenUp 的混合毛利率会继续显著低于同估值阶段纯 SaaS 公司常见的
              70–80%+ 水平。早期订阅销售额 $10M+ 值得鼓励，但还不足以判断 PLAAS 规模化后的稳态利润率贡献。
