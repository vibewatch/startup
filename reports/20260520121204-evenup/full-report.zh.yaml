      - number: '1.2'
        title: 创始人与领导团队
        blocks:
          - type: paragraph
            body: >-
              EvenUp 由三人共同创立，截至本报告日期，三人仍担任高管。CEO Rami Karabibar
              推动公司战略愿景，也是主要对外发言人；他的创业动机来自目睹一位家庭成员在法律资源不足的情况下处理人身伤害索赔。COO Raymond（Ray）Mieszaniec 具备运营和创业经验，此前共同创办金融科技创业公司
              EquitySim，并在 PwC 香港风险咨询业务工作。第三位联合创始人 Saam Mashhad 的头衔少见，同时负责产品和法律运营，体现了公司的判断：在这个市场，产品决策离不开法律运营专业能力。截至 2025
              年末，EvenUp 投资人页面和高管访谈均确认三位联合创始人身份。EvenUp 还保有一支 300+ 人法律运营团队，支撑其 human-in-the-loop 复核流程，确保 AI
              输出达到原告律师要求的证据标准。研究期间未发现重大领导层离职。
