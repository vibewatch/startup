      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 胜诉酬金让 AI ROI 比按小时计费市场更强
            body: >
              PI 律所以纯结果为基础运营：投入到案件中的每一小时律师助理或律师时间，只要不能提高和解价值，就是没有计费抵消的直接成本。该模式与按小时计费市场根本不同，后者的 AI 节省时间会按比例减少收入。在 PI
              法律中，AI 效率会复合放大：更快的案件准备带来更多案件，更好的索赔文档可以直接抬高和解金额。因此，EvenUp 客户证言持续引用的是和解结果的百分比改善，而不是计费效率——前者才是胜诉酬金模式下真正重要的指标。
            calloutType: insight
            claimRefs:
              - CM003
              - CM023
          - type: callout
            title: 同质化 AI 索赔函可能被保险理算员打折
            body: >
              当 EvenUp 渗透前 100 大 PI 律所的 30%+，并每周处理 10,000+ 起案件时，一个可能的反向情景出现了：保险理算员学会识别 EvenUp
              生成的索赔模板，并形成系统性回应策略。如果不同律所的索赔函开始看起来一样，保险公司可能相较定制化律师起草函件打折处理。Above the Law
              评论承认了索赔函同质化风险，也符合保险公司面对原告方商品化时的应对方式。EvenUp 的 Mirror Mode（复制律所专属风格）是对该风险的直接产品回应，但其大规模有效性尚未经过独立测试。
            calloutType: risk
            claimRefs:
              - CM034
              - CM039
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              EvenUp 所处的竞争环境横跨五类玩家，每一类都带来不同类型的替代威胁。PI 法律运营 AI 市场仍处早期，并在快速扩张：截至 2026 年，专为 PI 构建的 AI 平台只有少数几家，但更广义的法律 AI
              赛道拥挤且融资充足，提高了横向或相邻玩家延伸进 EvenUp 垂直市场的风险。

              第一类——直接 PI 专业 AI 同行——是最接近的竞争威胁，目前主要是 Supio。该平台总部位于 Seattle / San Francisco、成立于 2021 年，和 EvenUp 一样聚焦原告方 PI
              律所，覆盖索赔函起草、医疗时间线、从 intake 到和解的工作流以及群体侵权。截至 2026 年 5 月，尚未发现其他融资独立、规模相近的 PI 专属 AI 公司；Darrow AI
              做的是诉讼上游的法律风险敞口管理，并不是直接的索赔函工作流竞争者。

              第二类——工作流平台既有厂商——包括 PI 律所已经使用的案件管理系统（CMS）：Filevine（企业 / 中端市场）、Litify（原生基于 Salesforce，企业级 PI）、Clio（SMB
              和中端市场）、CasePeer（PI 专业 SMB CMS）和 SmartAdvocate（PI / 工伤专业，中端市场）。上述公司都在 2024–2026 年推出或扩展 AI 功能，包括 AI
              medchrons、索赔函起草助手和智能体 intake 工作流。它们的结构性优势是深度数据访问和日常工作流所有权；劣势在于 AI 只是功能追加，而不是核心产品，且没有一家使用 EvenUp 这种规模的 PI
              专属数据集训练。

              第三类——横向法律 AI 平台——包括 Harvey（BigLaw / 公司法律顾问）、CoCounsel（Thomson Reuters，诉讼和研究）以及带 Protégé 的
              Lexis+（LexisNexis，研究和起草）。它们资金充足、技术成熟，但并未针对 PI 原告工作流、胜诉酬金经济性或医疗记录分析校准。

              第四类——通用 LLM——代表 DIY 替代方案：律师用 ChatGPT、Claude 或类似工具起草索赔函，但没有 PI 专属训练。EvenUp 在产品定位中明确回应通用 LLM 威胁：通用 LLM 缺少 PI
              案件数据、HIPAA 合规数据隔离，以及逐行引用可追溯性。

              第五类——人工现状替代方案——仍是被替代收入最大的“竞争者”：内部索赔函撰写者、律师助理和离岸法律支持供应商，都是 EvenUp 替换的工作流；人工起草每封索赔函需要 5–20 小时。
