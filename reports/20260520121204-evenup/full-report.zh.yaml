      - number: '3.7'
        title: 图表
        blocks:
          - type: callout
            title: EvenUp 最大竞争风险来自自己的集成伙伴
            body: >
              EvenUp 的 go-to-market 策略高度依赖与 CMS 平台——Filevine、Litify、CasePeer 和 SmartAdvocate——深度集成，以获取驱动其 AI
              的案件数据。上述平台正在迅速增加 AI 功能，复制 EvenUp 的核心能力：Filevine 于 2025 年 4 月增加 medchron 生成；Litify 于 2025 年推出 ACE（智能体
              intake 和索赔函）；Clio 于 2025 年末推出 Clio Work（完整 AI 案件分析）；SmartAdvocate 内置 SmartIntelligence。随着各 CMS 平台 AI
              深度提升，它们维持与 EvenUp 开放集成的动机会下降，因为 EvenUp 直接争夺 AI 预算份额。EvenUp
              的防御在于自有数据集优势和工作流深度，但“集成伙伴”与“竞争者”之间的结构性冲突会在未来两到三年加剧，并构成竞争格局中最高严重度的护城河风险。
            calloutType: insight
            claimRefs:
              - CP038
              - CP039
              - CP041
              - CP042
          - type: callout
            title: Supio 的 Westlaw 集成制造法律引用信任缺口
            body: >
              EvenUp 的 Piai 系统提供到案件源文件的逐行引用——这是抵御医疗事实幻觉的强防线——但没有集成经过验证的外部法律数据库。Supio 2026 年 4 月与 Thomson Reuters 的
              Westlaw Advantage 集成，直接解决法律引用验证，可能让 Supio 在合规团队严格审查 AI 生成法律文件的大型律所中获得合规可信度优势。随着法院在 2026 年施加更严格的 AI
              披露要求，EvenUp 平台缺少经过验证的法律引用层，已成为一个需要直接询问产品路线图的尽调问题。
