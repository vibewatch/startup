      - number: '5.5'
        title: 信任、安全与监管合规
        blocks:
          - type: paragraph
            body: >
              EvenUp 在数万起活跃案件中处理 Protected Health Information（PHI），合规面因此相当重要。其公开 Data Processing
              Agreement（DPA）记录了个人数据处理的合同框架，并描述了管理 PHI 保护的 Schedule 2 Technical Measures。

              EvenUp 承诺签署 Business Associate Agreement（BAA），覆盖在医疗数据场景中运营的律所所承担的 HIPAA 义务。根据 DPA，EvenUp
              仅按客户指示处理个人数据，不会向已披露分包处理方以外的第三方出售或共享客户个人数据，并在合同终止时删除数据。安全事件发现后 72 小时内通知，是合同要求。根据 DPA 审计权条款，EvenUp
              会应客户要求提供等同 SOC 2 的第三方审计报告。

              DPA 记录的技术安全控制包括：逻辑数据隔离和基于角色的访问控制；客户个人数据静态和传输中的加密；企业防火墙和入侵检测基础设施；变更管理流程；业务连续性和灾难恢复流程。DPA 规定，客户身份认证凭证由客户负责。

              ABA Model Rule 1.1（Competence）以及各州律师协会关于技术能力的指引，要求律师理解并监督客户代理中使用的 AI 工具。这为 EvenUp 的律所客户制造了结构性合规义务，而不是直接落在
              EvenUp 身上；但 EvenUp 的人工审阅层和行级引用系统，是让律师能够监督 AI 输出的主要产品机制。
            claimRefs:
