      - number: '7.2'
        title: 运营与质量风险
        blocks:
          - type: paragraph
            body: >-
              EvenUp 的核心产品风险在 AI 输出质量：医疗时间线错误、虚构治疗日期、损害赔偿计算虚高或出错， 以及低质量病历扫描件的 OCR 录入失败。公司承认通用 LLM
              会产生幻觉，并把人工审核层和自有反馈循环列为缓释措施。 其 2025 年基准报告发现，PI 律所在使用 EvenUp 前平均每 10 个案件遗漏 5 份文件， 而 EvenUp 的 Missing Docs
              Check 可减少 75%；这也意味着仍有残余错误率，少数案件仍可能被实质性低估。


              PLAAS 会放大运营风险：按照公司说法，EvenUp 配备 300+ 名法律运营人员管理外包诉前工作流， 质量控制取决于人工审核员能否随案件量同比例扩张。审核员与案件负载一旦恶化，就会在下游形成系统性错误。
              影响 SaaS 平台的云和基础设施故障——认证失败、API 停机、第三方模型提供商中断—— 会让有时效期限的客户律所停下索赔函生产（诉讼时效、理赔员响应窗口）。EvenUp 的 DPA 要求 72
              小时内通知泄露， 但不保证正常运行时间。安全事件——例如勒索软件攻击持有 PHI 和机密案件策略的法律科技平台—— 会触发 HIPAA 泄露报告、潜在 OCR 罚款，并严重伤害律所客户中的声誉。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
