              - CR013
          - type: callout
            title: PLAAS 扩大监管暴露面
            body: >-
              2026 年 5 月 PLAAS 发布后，EvenUp 从软件供应商变成外包法律运营伙伴。 这一转变同时扩大五类风险暴露：更多 PHI 流动（HIPAA）、非律师员工执行案件分析（UPL）、 更大的运营足迹（质量
              / 安全）、额外人头扩张压力（人员），以及服务占比更重的成本结构（财务）。 风险登记表应在每一个 PLAAS 合同里程碑重新评估。
            calloutType: risk
