      - number: '6.4'
        title: 留存与耐久性
        blocks:
          - type: paragraph
            body: >
              EvenUp 没有公开披露 NRR、GRR 或客户流失数据，因此无法直接衡量留存。耐久性只能从代理指标推断：多年客户寿命、既有账户内多产品扩张，以及 Top-100 律所渗透率上升。寿命信号有意义：ELG
              Injury Lawyers 已经活跃使用超过四年（2021 年 5 月至 2026 年 5 月），J&Y Law 明确从早期只用 Demands 扩张到 EvenUp 全平台套件，说明既有账户增购成功。John
              K. Zaid & Associates 把 EvenUp 描述为「不只是技术提供商——它是长期伙伴」，Zaid 称公司持续演进的路线图承诺是长期信任和广泛内部采用的基础。

              产品架构制造结构性切换成本。PLAAS 把 EvenUp 的美国案件管理人员直接嵌入律所诉前工作流，形成显著高于纯 SaaS
              工具的退出门槛。一旦律所把案件生命周期管理迁移到托管服务模式，更换供应商就同时需要技术迁移和运营重建。与 Filevine、Litify、SmartAdvocate 和 CasePeer 的 CMS 集成进一步把
              EvenUp 固化在既有技术生态内。2025 年 7 月，EvenUp 对 200+ 家律所的分析发现，30% 会通过后续提示词细化 AI 输出，说明使用是交互式、习惯性的，而不是被动消费。

              未披露留存指标是本章的核心尽调缺口。没有 NRR 或 GRR，就无法判断 2,000+ 家律所数量代表高总留存下的净新增，还是快速总新增掩盖了小型律所长尾的显著流失。Pioneer Awards 和
              Customer Advisory Board 项目可以缓释头部账户留存风险，但无法说明更广泛客户基础。合同期限、续约率和队列级扩张百分比仍未知。
