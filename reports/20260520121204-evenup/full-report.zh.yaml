      - number: '6.5'
        title: 扩张与集中风险
        blocks:
          - type: paragraph
            body: >
              EvenUp 的先落地再扩张动作在所有已记录客户案例中都很清楚：律所从 Demands 或 Express Demands 起步，随着运营信心增强，逐步采用 Medical Management、AI
              Playbooks、Communication Agents、Companion 和 Executive Analytics。J&Y Law 从只用 Demands 到使用带定制 AI Playbooks
              的全平台做诉讼取证，正是这种模式的样本。PLAAS 代表最深的扩张阶段：一种托管服务订阅，让 EvenUp 从软件供应商转为外包运营伙伴；截至 2026 年 5 月，早期测试已带来 $10M+ 订阅销售额。

              集中风险存在于多个层面。Top-100 PI 律所渗透率（30%）意味着大量案件量和可能收入集中在大客户中；哪怕流失少数 Top-100 账户，也会对关键指标造成不成比例影响。对 CMS
              伙伴的渠道依赖——Filevine、Litify、SmartAdvocate、CasePeer——意味着这些平台的集成政策、定价或竞争定位变化都可能扰乱客户获取管道。EvenUp 自身向 PLAAS
              的产品扩张也可能蚕食法律金融伙伴的推荐关系，尤其是托管服务模式与第三方诉前融资服务重叠时。

              多平台并用风险是真实存在的。竞争者 Supio 和 Filevine AI 瞄准同一 PI 工作流，并在构建可比的文档生成和案件管理能力。Supio 的博客文章明确批评通用 AI 的准确性，并把 Westlaw
              集成定位为差异点；这是一个直接竞争楔子。利润率紧张的小型 PI 律所可能同时采用多个平台，而不是只押注
              EvenUp，尤其是在按案定价模型下，把增量案件量放到竞争工具上的切换成本很低。保险理赔员适应也构成额外系统性风险：随着 AI 生成需求函变得无处不在，理赔员可能发展反制手段，削弱律所当前从 EvenUp
              数据锚定需求函中获得的谈判溢价。

              LawNext 的 PLAAS 发布文章提出了一个尖锐问题：PLAAS 是否「代表一个真正的新类别，还是把既有服务套上 AI 外壳重新包装」；这一定性凸显出尽调要求——在把 $10M 早期销售额视为耐久 ARR
              证据前，必须在更长周期内验证 PLAAS 的规模化结果。
