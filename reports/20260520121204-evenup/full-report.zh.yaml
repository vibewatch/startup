companyProfile:
  summary: >-
    EvenUp 是一家总部位于 San Francisco 的法律 AI 公司，2019 年由 Rami Karabibar、Raymond Mieszaniec 和 Saam Mashhad 创立。公司向原告方人身伤害律所销售
    Claims Intelligence Platform，借助 Piai 模型和人工复核流程，自动化处理医疗记录分析、索赔函起草、案件监控、和解基准比较和托管式诉前运营。公司已从软件扩展到 PLAAS，该订阅服务接触度更高，会把
    EvenUp 法律运营人员嵌入律所工作流。公开证据显示客户采用强劲、后期融资到位，但经济性披露有限。
