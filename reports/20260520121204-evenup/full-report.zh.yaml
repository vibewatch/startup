      - number: '2.3'
        title: 买方、用户与付款方细分
        blocks:
          - type: paragraph
            body: >
              PI
              律所是采购单位，但购买权和日常使用分散在不同角色中。律所所有者和管理合伙人是经济买方，负责签约并控制软件预算；对胜诉酬金律所而言，决策算式很直接：这个工具能否改善和解结果，或把单案耗时降到足以覆盖订阅成本？案件经理和律师助理是主要日常用户，处理
              intake 文件、协调医疗记录并发送客户沟通——这是 EvenUp 自动化的最高频工作流。索赔函撰写者（专职律师和资深律师助理）用 AI 起草工具准备和复核索赔包，这是 PI
              案件中价值最高的文档类型。Intake 团队和法律运营经理用 AI 做案件分诊，识别哪些新进文件价值高或接近诉讼时效风险。

              EvenUp 扩展到 Pre-Litigation as a Service（PLAAS）后，增加了一种新买方关系：律所所有者想要外包案件管理伙伴，而不是软件许可证，付款模式也从按席位 SaaS
              转为按案件托管服务合同。PLAAS 模式显著扩大了可触达市场，覆盖缺少内部能力独立落地软件工具的律所。

              PI 律所绝大多数很小：大部分执业团队少于 10 名律师。大型全国律所（例如 Lerner & Rowe、Morgan & Morgan）在律所数量中占比不高，却贡献了不成比例的年度案件量，也是 EvenUp
              最显眼的标杆客户。截至 2026 年 5 月，EvenUp 已渗透前 100 大 PI 律所的 30%，说明其已成功上探高端市场；但大量小型长尾律所仍构成未开发 SAM 的主体。
            claimRefs:
