  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Claims Intelligence Platform：产品套件与模块图谱
        blocks:
          - type: paragraph
            body: >
              EvenUp 的 Claims Intelligence Platform™ 是 Piai™ 能力触达 PI 律所的商业入口。截至 2026 年 5
              月，平台覆盖十二个不同模块，横跨从接案到和解谈判的完整诉前案件生命周期。

              Express Demands™ 于 2025 年 1 月推出，是 EvenUp 第一个 AI Draft 模板，可直接基于案件文件内容生成专业格式的需求函。更完整的 AI Drafts Suite™ 于
              2025 年 5 月发布，把需求生成延伸到起诉状、医疗摘要、谈判表和对询问书的回复；所有产出都锚定案件文件数据，而不是开放域 LLM 生成。Smart Workflows 与 AI Drafts™
              配套，提供数据驱动的案件生命周期自动化：它监控案件事件，基于 EvenUp 自有数据集计算需求准备度（该数据集显示，42% 的需求函在最后一次治疗后超过 100
              天才发出），并在条件满足时触发员工提醒。Medical Bill Summary 在 Case Financials 中自动跟踪费用，并按保单限额验证开支。

              MedChrons™ 把原始医疗记录组织成交互式、经专业审阅的时间线，律师可以浏览和追问。Medical Management 于 2025 年 12
              月推出，把时间线扩展为实时治疗跟踪系统：它暴露治疗空档（EvenUp 数据显示，43% 的 PI 案件会出现 30 天治疗空档），并驱动 AI Communication Agents™ 通过语音和 SMS
              自动回访客户。

              AI Playbooks™（2025 年 7 月推出）会自动分析新上传案件文件，在无需律师提示的情况下暴露责任标记、创伤性脑损伤（TBI）指标、商业被告和保险覆盖问题。Case Companion™ 是一个 AI
              助手，可基于原始案件文件回答问题，并提供行级引用。Settlement Repository™ 摄取律所历史和解数据，并用 Piai™ 对伤害、治疗和保单进行匹配，把结果与可比案件做基准对照。Executive
              Analytics™ 提供律所级 KPI 仪表盘，可按时间、办公室、角色和具体员工筛选。

              Voice Agent™ 处于早期访问阶段，是覆盖完整案件生命周期、用于客户触达的 24/7 对话式 AI。PLAAS（Pre-Litigation as a Service）于 2026 年 5
              月推出，是一项托管服务订阅，把 Piai™ 自动化与美国 EvenUp 案件管理人员结合起来，覆盖完整诉前工作流。

              定价在 2025 年 5 月转为按案模式：一个覆盖完整 Claims Intelligence Platform 的全包价格，取代此前按功能分层授权。PLAAS 作为单独订阅定价，覆盖律所诉前阶段的全部案件。
