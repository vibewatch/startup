      - number: '1.5'
        title: 融资历史与投资方格局
        blocks:
          - type: paragraph
            body: >-
              据 Bloomberg Law，截至 2025 年 10 月，EvenUp 已披露累计融资 $385 million。最近一轮是 2025 年 10 月的 $150 million Series E，由
              Bessemer Venture Partners 领投，将公司估值推高到 $2 billion 以上。Series E 的共同投资方包括 REV Ventures（RELX/LexisNexis
              的风险投资部门）、B Capital Group 和 Bain Capital Ventures。此前的 Series D 于 2024 年 6 月公开报道，随后在 2024 年 10
              月通过公司渠道公告；该轮融资 $135 million，估值约 $1 billion，Bain Capital Ventures 被列为领投方，Bessemer 参投。更早轮次包括 Lightspeed
              Venture Partners、SignalFire（领投种子轮）、NFX 和 DCM Ventures 参投。Bessemer 在后期轮次中重复参与值得注意，因为该机构深耕垂直 SaaS 和法律
              AI。RELX/LexisNexis 通过 REV 参投，提示潜在的战略数据和分发协同。公司未披露 ARR、收入增长或烧钱速度，财务尽调因此只能依赖融资轮披露。$385M 的累计融资对一家 Series E
              法律科技公司来说异常庞大，可能意味着 PLAAS 外包模式资本强度较高，也可能是在为潜在 IPO 路径显著延长现金跑道。
