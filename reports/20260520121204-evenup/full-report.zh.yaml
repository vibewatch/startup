              - CP028
              - CP029
      - number: '3.5'
        title: 现状与人工替代方案
        blocks:
          - type: paragraph
            body: >
              EvenUp 替代的最大竞争力量是现状：人工律师助理和索赔函撰写工作流，再加上通用文档模板，以及近来没有 PI 专属校准的通用 LLM。

              在 EvenUp 出现前，一封典型 PI 案件索赔函需要律师助理或专职律师投入 5–20 小时：审阅医疗记录、构建时间线、起草叙事、纳入 ICD 代码，并与监督律师反复修改。按律师助理 $50–$100 /
              小时费率计算，仅每封索赔函的人力成本就代表单案 $250–$2,000 的内部成本。EvenUp 的按案件计价模式，就是要定在低于或接近这一替代价值的位置。EvenUp 客户证言支持 ROI
              主张：Jeffcoat Injury Lawyers 使用 Express Demands 后生成 3 倍更多索赔函，案件和解快 30 天；ELG Injury Lawyers 实现 400%+
              收入增长；John K. Zaid & Associates 报告和解改善 300%。

              离岸法律支持供应商代表混合替代方案：这些公司以等同 $15–$40 / 小时的成本提供文档处理和基础时间线服务。它们缺少 AI 驱动的和解基准比较、ICD 编码、治疗缺口检测和案件财务分析。EvenUp
              的按案件计价瞄准同一经济位置，但提供更高质量和更快周转。

              通用 LLM（ChatGPT、Claude、Gemini）是越来越有分量的 DIY 替代方案，尤其对熟悉 prompt engineering 的律师而言。EvenUp 博客明确回应通用 LLM 竞争，列出通用
              LLM 不足的五个原因：缺少 PI 专属训练数据，没有 HIPAA 合规数据隔离，没有可追溯到源文件的逐行引用，没有用于和解估值的 PI 判决基准数据，也没有主动工作流智能体。EvenUp 的 Smart
              Workflows 和主动智能体提供了仅靠 prompt 型 LLM 使用无法复制的功能，除非投入大量定制工程——尤其是驱动 EvenUp 索赔时点提醒的 42% 统计数据（索赔函在最后一次治疗后 >100
              天才发送）。

              反向情景是：不断改善的通用 AI 工具消除了文档生成中的大部分生产力差距，让 EvenUp 的竞争重点从输出速度转向合规、数据集质量和工作流集成。
            claimRefs:
              - CP030
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
      - number: '3.6'
        title: 护城河耐久性与反向竞争证据
        blocks:
          - type: paragraph
            body: >
              EvenUp 的竞争护城河建立在四个相互扣合的支柱上，每个支柱都有不同的耐久性和威胁向量。

              支柱 1——自有 PI 数据集：EvenUp 的 Piai 系统用 250,000+ 起判决和和解、数百万次医疗就诊，以及来自 2,000+
              家律所的数据训练。该数据集创造了新进入者无法立即复制的训练优势，估计需要三到五年才能在规模上追平。数据集护城河的长期威胁，来自可能收购或授权同等数据的 LLM 供应商，也来自 Supio 的 Thomson
              Reuters 集成所提供的法律引用验证层。尚无竞争者披露可比的 PI 专属判决 / 和解语料。

              支柱 2——网络效应与品牌：EvenUp 渗透前 100 大 PI 律所的 30%（2026 年 5 月），形成了标杆客户护城河。随着 EvenUp
              处理更多案件，其和解基准数据会继续改善，产生数据网络效应。该动态由以下增长体现：律所客户从约 1,500 家（2025 年中）增至 2,000+ 家（2026 年 5 月），前 100 大律所渗透率从
              20%（2025 年 10 月 Series E）增至 30%（2026 年 5 月）。反向情景是：Supio 和 CMS 既有厂商也在签下同一批顶级 PI 律所，可能通过多归属削弱 EvenUp
              的数据独占优势。

              支柱 3——工作流集成深度：EvenUp 的主动智能体模型会持续扫描案件数据、触发索赔时点提醒、管理治疗跟进、标记文档缺口；一旦律所围绕 EvenUp 智能体标准化案件流程，切换成本就会形成。不过，CMS
              既有厂商掌握所有案件数据产生的数据层；如果 Filevine、Litify 或 Clio 达到相当的 AI 深度，单独购买 EvenUp 订阅的增量价值会被侵蚀。

              支柱 4——合规与信任：EvenUp 的 SOC2 认证和 HIPAA 证明回应了 AI 采用中的主要法律伦理障碍。不过，Supio 也取得 SOC2 Type 2 和 HIPAA / GDPR 合规，所有主要
              CMS 平台也维持等同认证。合规趋同后，合规护城河会降为准入门槛。

              主要反向竞争证据包括：（1）CMS 平台侵入——SmartAdvocate 与 EvenUp 的集成（EvenUp 博客确认）显示了竞合动态；随着 SmartAdvocate 内置 AI 改善，对单独
              EvenUp 层的需求会下降；（2）索赔函商品化——保险理算员大规模遇到 EvenUp 生成索赔函后，可能形成系统性回应规则，削弱和解改善优势，EvenUp 也通过 Mirror Mode
              承认这一风险；以及（3）Supio 的 Westlaw 集成提供了 EvenUp 平台缺少的法律引用验证。

              净评估：EvenUp 是规模领导者，拥有耐久的数据集护城河，可为其相对直接同行提供三到五年的跑道。它最严重的中期威胁不是 Supio 或横向 AI 玩家，而是 Filevine、Litify 和 Clio 的有机
              AI 演进——这些平台已经掌握 EvenUp 的分发渠道，并能用更低增量成本利用同一批案件数据。
