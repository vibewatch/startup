      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >
              最具结构性的驱动因素，是胜诉酬金模式本身：PI 律师只有案件解决后才收费，并按和解金额抽成，因此每省下一小时律师或律师助理的行政时间，都会直接改善律所盈利能力。按小时计费律所采用 AI
              后，节省时间会部分减少收入；PI 律所则把 AI 效率收益全部转化为利润率，或转化为承接更多案件的能力。EvenUp 客户证言持续印证这种经济性：一家 Houston 律所报告和解改善 300%，另一家报告节省
              3,500 小时，索赔效率提升 34%。

              第二个驱动因素是医疗记录量：据 EvenUp 平台分析，43% 的 PI 案件出现超过 30 天、会削弱索赔价值的治疗缺口，16.8% 在前三个月内形成 30 天缺口。人工管理这些缺口很费人力；AI
              辅助监控能直接转化为被保住的案件价值。保险公司在理赔处理上也变得更成熟，要求更完备的索赔材料来准确设定准备金，从而创造了对更高质量、数据支撑索赔包的需求。

              法律 AI 投资环境也支撑市场增长。EvenUp 2025 年 10 月 Series E（$150M，$2B+ 估值，由 Bessemer 和 RELX/REV
              领投）以及更广泛的法律科技投资趋势，都确认资本仍可用于资助 go-to-market 扩张。2020 年以来法律支持岗位劳动力短缺加剧，也加快了自动化需求。
