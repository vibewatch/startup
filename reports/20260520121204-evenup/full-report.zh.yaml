      - number: '3.3'
        title: 工作流平台既有厂商
        blocks:
          - type: paragraph
            body: >
              五大 PI 导向案件管理系统——Filevine、Litify、Clio、CasePeer 和 SmartAdvocate——同时是 EvenUp 的集成伙伴，也可能成为平台侵入型竞争者。每家公司都在
              2024–2026 年推出 AI 能力，切入 EvenUp 核心工作流的若干环节。

              Filevine 是该组中最大的企业法律 AI 平台。其 LOIS AI 层提供医疗记录分析（FilevineAI for medchrons，2025 年 4 月）、庭审记录和证言管理（2025 年 8
              月）、截止日期管理（2025 年 10 月）、文档生成和实时案件分析。Filevine 2026 年以“2026 Legal AI Trust Index”平台定位，主张 AI
              信任来自律所自己的数据和工作流——该定位直接反击了 EvenUp 的专属数据集论点。Filevine 定价完全按团队定制，显示其企业销售动作。

              Litify（原生基于 Salesforce）面向企业级 PI 律所，其 Plaintiff Practice Management 模块叠加“Litify ACE”（Agentic Case
              Expert）：AI intake 智能体、源链接医疗时间线、索赔包起草、案件价值预测和和解情景建模。Litify 的 Salesforce 血统带来强企业集成和分析能力，但也让 SMB 律所承担更高实施负担。

              Clio 在覆盖所有执业领域的 SMB 法律执业管理市场占据主导，也包括 PI。Clio 2025 / 2026 年产品扩展包括 Clio Work（AI 案件分析、研究集成、基于案件事实和法律的起草）、Clio
              Draft（文档自动化）以及收购 CasePeer（PI 专业 CMS）。Clio Work 以“唯一理解你的案件、案件背景和法律的 AI”定位，与 EvenUp 的平台愿景直接重叠，尽管 Clio
              的训练跨执业领域，而非 PI 专属。Clio 的 250+ 集成生态和广泛 SMB 采用，为其自有 AI 功能提供天然分发。

              CasePeer 是 PI 专业 CMS（Clio 子公司），面向 SMB 提供交钥匙价值主张。其 AI 能力跟随 Clio 产品路线图，而不是基于 PI 专属训练。SmartAdvocate 提供
              SmartIntelligence（内置 AI，用于案件摘要、医疗记录分析、邮件润色、翻译和转录），并且目前根据 EvenUp 自身博客与 EvenUp 集成，同时也在增加自有原生 AI 能力。

              核心战略张力在于：EvenUp 与 Filevine、Litify、CasePeer 和 SmartAdvocate 集成，借助 CMS 数据访问驱动其 AI 工作流。当这些 CMS 平台增加自有 AI
              功能、复制 EvenUp 的核心能力时，它们维持开放集成的动机会下降。由此产生的平台依赖风险，又被每家 CMS 供应商用更低增量成本利用同一批案件数据的能力进一步放大。
