  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从规模、证据、风险和估值证据推导到继续研究建议的链条。
    data:
      nodes:
        - id: scale
          label: 规模 / 证据
          detail: 2,000+ 家 PI 律所；前 100 大 PI 律所占 30%；$14B+ 损害赔偿；$10M+ PLAAS 销售额
        - id: moat
          label: 竞争护城河
          detail: Piai 模型；200,000+ 个案件数据集；PLAAS 托管服务锁定效应
        - id: risks
          label: 关键风险
          detail: 300+ 名美国法律运营人员成本；AI 商品化；HIPAA/伦理；RELX 冲突
        - id: valuation
          label: 估值缺口
          detail: 估值 $2B+，但未披露 ARR 或利润率；隐含收入倍数 13–40x
        - id: recommendation
          label: 建议：继续研究
          detail: 定性逻辑强；财务不透明，使当前价格下无法明确放行
    approximationNotes: 流程节点位置为示意；连接权重未量化。
    claimRefs:
      - CV001
      - CV004
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在 15x 收入倍数下，隐含企业价值对 ARR 水平和毛利率假设的敏感性。
    data:
      items:
        - label: ARR $50M / 毛利率 55%
          value: 750
          unit: $M implied EV
        - label: ARR $100M / 毛利率 60%
          value: 1500
          unit: $M implied EV
        - label: ARR $150M / 毛利率 65%
          value: 2250
          unit: $M implied EV
        - label: ARR $200M / 毛利率 70%
          value: 3000
          unit: $M implied EV
    approximationNotes: EV = ARR × 15x（基准倍数）；实际倍数随增长率和可比公司变化。所有 ARR 数值均为分析师估计；公司未披露 ARR。
    claimRefs:
      - CV027
      - CV028
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 低 / 基准 / 高退出估值，以及乐观、基准和悲观情景下 Series E 回报倍数示例。
    data:
      items:
        - label: 悲观退出
          low: 800
          mid: 1000
          high: 1200
          unit: $M enterprise value
        - label: 基准退出
          low: 3000
          mid: 3500
          high: 4000
          unit: $M enterprise value
        - label: 乐观退出
          low: 4000
          mid: 5000
          high: 6000
          unit: $M enterprise value
    approximationNotes: 所有估值均为分析师推导的估计，依据可比交易、增长轨迹和 PLAAS 采用假设。公司未披露财务目标。
    claimRefs:
      - CV029
      - CV030
      - CV031
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投委会可用评分，覆盖市场、证据、护城河、经济性、风险、估值和证据质量维度。
    data:
      items:
        - label: 市场规模
          score: 4
          maxScore: 5
          detail: 美国 PI 市场 $61.7B；法律 AI 软件市场 $3.11B 且在增长
        - label: 客户证据
          score: 4
          maxScore: 5
          detail: 2,000+ 家律所；前 100 大律所占 30%；$14B+ 损害赔偿；$10M+ PLAAS 销售额已验证
        - label: 竞争护城河
          score: 3
          maxScore: 5
          detail: 自有数据集强；来自 Harvey/OpenAI 的商品化风险中等
        - label: 单位经济性
          score: 1
          maxScore: 5
          detail: 未披露 ARR / 利润率；PLAAS 成本结构不透明；足以卡住直接通过
        - label: 风险画像
          score: 2
          maxScore: 5
          detail: 高：HIPAA/伦理、法律运营成本下限、RELX 冲突、AI 商品化
        - label: 估值纪律
          score: 2
          maxScore: 5
          detail: 未披露 ARR 时，$2B+ 估值偏贵；13-40x 倍数区间无法验证
        - label: 证据质量
          score: 3
          maxScore: 5
          detail: 定性证据强；财务不透明限制量化判断
    approximationNotes: 评分为分析师判断（1=差，5=优秀），依据截至 2026-05-20 的公开可得证据。
    claimRefs:
      - CV001
      - CV002
      - CV003
