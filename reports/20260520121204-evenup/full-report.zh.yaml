      - number: '4.2'
        title: 融资历程与资本结构
        blocks:
          - type: paragraph
            body: >
              EvenUp 已披露的风险投资融资总额为 $385M，至少横跨五轮（种子轮至 Series E），但公开确认轮次细节的只有 Series D 和 Series E。截至 2026 年 5 月，公司仍为私营公司；在
              SEC EDGAR 中用任何 EvenUp 名称变体都未找到 Form D 备案，这与无需提交 Form D 的 Regulation D 豁免相符，也可能是文件以尚未检索到的实体名称误提交。

              Series D 于 2024 年 10 月 8 日宣布，金额 $135M，由 Bain Capital Ventures 领投。参与方包括 Premji Invest、Lightspeed Venture
              Partners、Bessemer Venture Partners、SignalFire 和 B Capital Group。投后估值超过 $1B，EvenUp 因此成为独角兽。当时累计融资约
              $235M，意味着从种子轮到 Series C 合计约融资 $100M。EvenUp 博客称，Series D 前十二个月员工数翻倍，收入同比增长超过 100%。

              Series E 于 2025 年 10 月 1 日宣布，金额 $150M，由 Bessemer Venture Partners 领投。新投资方包括 RELX/LexisNexis 的风险投资部门 REV，B
              Capital Group 和 Bain Capital 作为既有投资方继续参与。投后估值超过 $2B。REV 代表 RELX/LexisNexis
              入股具有战略意义：这意味着一家重要法律研究和工作流竞争者（LexisNexis）的母公司持有 EvenUp 少数股权，可能反映合作选择权，也可能带来竞争情报；这一双刃结构需要对任何共同投资或数据共享条款做尽调。

              Bloomberg Law、Reuters 和 AboveTheLaw 对 Series E 的报道口径一致：估值 $2B+，股权融资 $150M。EvenUp 的 GlobeNewswire 新闻稿以及 SEC
              EDGAR 上 ServiceTitan 的 DRS/A 文件也相互印证；后者确认 EvenUp 的法律实体为 EvenUp, Inc.，是一家特拉华注册的私营软件公司，并自 2023 年 4
              月起拥有董事会代表。

              没有任何债务融资、可转债或老股交易被公开披露。已披露股权融资总额为 $385M。任何时期的账面现金、现金跑道或烧钱速度也都没有披露。
