      - number: '7.5'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              EvenUp 是私营公司，不披露 ARR 或烧钱速度，投资者视线受阻。公司已按 $2B+ 估值累计融资 $385M（2025 年 10 月 Series E 轮）， 资本底座达到 $385M；但 PLAAS
              需要配备 300+ 名法律运营人员，本质上比纯 SaaS 更吃资本和人头，压缩毛利率。 如果毛利率落在 50% 以下（对托管服务混合模式来说并非不合理），公司就需要相当大的收入规模， 才能继续支撑研发和 AI
              基础设施。


              按案定价让收入波动绑定 PI 案件量，而案件量又与经济周期、诉讼趋势和保险理赔员做法相关。 如果保险公司通过系统性折价或更严格审查 EvenUp 式文件来适应 AI 生成索赔函，每案收入可能被侵蚀。 来自
              Harvey（2026 年估值 $11B）、Anthropic 和 OpenAI 进入法律垂直领域，以及 Thomson Reuters（CoCounsel）和 LexisNexis 这类资本充足在位者的竞争，
              都可能压缩市场价格。未来融资风险真实存在：估值回调或 AI 板块下行，可能削弱公司按当前条款融资的能力； 公司也没有披露盈利路径。
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
      - number: '7.6'
        title: 缓释、监控与终止标准
        blocks:
          - type: paragraph
            body: >-
              EvenUp 已经布置了几项结构性缓释措施：（1）BAA 和公开 DPA，覆盖 CCPA 与数据处理义务，并承诺 72 小时内通知泄露； （2）在 AI 输出和客户交付之间插入人工审核层（法律运营 +
              律师签字）；（3）自有反馈循环每天吸收数千条专家修正，用于重新训练领域模型； （4）专注 PI 垂直（而不是通用法律 AI），相较通用 LLM 降低幻觉率；（5）多项 CMS 集成，降低单一平台锁定。


              即便有这些缓释，几项投资逻辑失效触发点仍会实质削弱投资案例：（a）确认发生大规模 HIPAA 泄露，引发 OCR 罚款和客户流失； （b）法院制裁或律师协会投诉点名 EvenUp AI
              输出是律师不当行为的近因，形成反向先例并触发律所级禁用； （c）Filevine 或 Clio 转向原生捆绑竞争性索赔生成 AI，在进件入口切走 EvenUp； （d）RELX/LexisNexis
              利用董事会访问权限复制 EvenUp 的 PI 数据集并以 LexisNexis 品牌推出竞争产品； （e）PLAAS 扩张后毛利率长期低于 40%，说明业务无法达到类 SaaS 经济性。监控指标包括点名
              EvenUp 的 OCR 投诉文件、 律师协会明确提示 AI 索赔函服务风险的指引、CMS 平台定价或 API 政策变化，以及 RELX 关于 PI 产品扩张的公开表态。
