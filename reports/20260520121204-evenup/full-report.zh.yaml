  - id: TE003
    title: Piai™ 架构：层级、角色、依赖和风险
    columns:
      - 层 / 组件
      - 角色
      - 关键依赖
      - 技术风险
    rows:
      - - 读取层——OCR 与文档规范化
        - 将 PDF、扫描件、手写内容、表格、图像转换为保留结构的规范化文本
        - 接案时的文档质量；CMS 上传完整性
        - 低质量扫描件或非标准医疗记录格式会拉低下游抽取准确率
      - - 读取层——实体抽取模型
        - 按实体类型使用专门模型抽取案件实体（服务方名称、ICD 代码、日期、治疗、金额）
        - 每日用户纠错数据流（每天数千次编辑）
        - 如果纠错信号量下降，实体模型会漂移；单个实体模型失败会传导到所有引用该实体的下游文档
      - - 读取层——多模态 RL 管线（图像摘要）
        - 用 PPO 强化学习将事故示意图、放射影像转换为可持久化的结构化文本摘要
        - 用于有依据 Q&A 监督的视觉语言模型；RL 训练周期所需算力
        - 边缘情况（非常规示意图格式、新型伤情）可能生成低置信度摘要，并静默传导
      - - 事实记录系统（SoR）
        - 持久化规范案件实体存储，包含溯源图、纠错台账和关系时间线
        - Schema 演进管理；跨服务方名称变体的实体链接准确率
        - 数百万历史案件上的 schema 变更会带来迁移风险；纠错台账完整性对模型训练质量至关重要
      - - 写作层——有依据文档生成
        - 基于 SoR 事实而非开放式 LLM 世界知识起草法律文件（索赔函、诉状、询问书）
        - 读取层准确率（垃圾进 → 垃圾出）；行级引用追溯基础设施
        - 基础模型商品化会压窄护城河；约束过强时，生成文本在边缘场景可能显得生硬
      - - 人工复核层（100+ 名员工）
        - 在交付前验证 Piai™ 输出；纠错回流到读取层模型再训练
        - 美国本土人员扩张能力；团队扩大时培训质量一致性
        - PLAAS 增长需要线性扩员；招聘快过培训会稀释质量
    notes: >-
      架构描述基于 EvenUp 发布的博客文章 'Building Trustworthy, Scalable Document AI for Legal Tech'（Haixun Wang，VP Engineering /
      Head of AI）和 Piai™ 产品页。技术风险为作者根据所述系统设计模式作出的评估。
