chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与使命
        blocks:
          - type: paragraph
            body: >-
              EvenUp 于 2019 年末在 California 州 San Francisco 创立，三位联合创始人的法律、运营和技术背景互补。公司公开表述的使命，是为人身伤害索赔人拉平竞争条件——创业动机来自 CEO
              Rami Karabibar 的个人经历：一位家庭成员处理 PI 案件时，他亲眼看到资源受限的律所很难组织足够证据和文档来争取公平和解。EvenUp 的平台处在法律科技与 AI 驱动工作流的交汇处，为 PI
              律所提供端到端工具，覆盖案件 intake、医疗记录分析、损害金额量化和索赔函生成。公司注册并总部位于 San Francisco，采用灵活的混合办公模式。EvenUp 所在的广义法律 AI 与法律科技市场，在
              2023–2025 年生成式 AI 浪潮后吸引了大量机构资本。EvenUp 持有 SOC 2 Type II 和 HIPAA
              合规认证，使其能在以客户数据隐私为核心要求的律所环境中部署。公司仍为私营，未披露年度收入；它是一家高增长、后期风投支持的创业公司，估值已达到 $2B+ 的独角兽以上水平。
