      - - PLAAS 毛利率低于阈值
        - < 45% PLAAS 收入混合毛利率
        - 托管服务组件无法自我覆盖法律运营团队成本；软件经济性逻辑失效
        - 暂停或缩小仓位；按服务公司倍数（3-5x 收入）重新承销
      - - 前 100 大 PI 律所流失率飙升
        - '> 15% 前 100 大 PI 律所队列年流失率'
        - 数据护城河和切换成本叙事失效；竞争替代已经启动
        - 立即要求披露 NRR；若无法进入可接受的数据室，降低仓位
      - - 竞品 PI AI 发布
        - Harvey、OpenAI 或 Filevine 部署质量相当的 PI 索赔函能力，价格 < $50/案
        - 单案定价权被侵蚀；EvenUp 在前 100 大律所的份额承压
        - 压力测试收入模型；若竞品签下 EvenUp 前 10 大参考客户律所，则重新评估
      - - 重大 HIPAA 泄露或伦理执法
        - OCR 执法行动或律师制裁可追溯到 EvenUp AI 输出
        - HIPAA 监管风险兑现；企业级 PI 市场可能冻结 PLAAS 采用
        - 若泄露影响 > 1,000 名客户，或监管制裁跨多个州，则全额退出持仓
      - - RELX 投资人冲突显性化
        - RELX 宣布竞品 PI AI 产品，并使用来自 EvenUp 董事会接触的数据洞察
        - 竞争护城河受损；数据权利和治理结构需要复核
        - 法律审查投资条款；与独立董事接触
    notes: 阈值是分析师建议的尽调基准，不是公司披露目标。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - ARR 与收入构成
        - 经审计的过去 12 个月 ARR，并拆分单案 SaaS 与 PLAAS 订阅
        - 没有 ARR，无法计算或对标 $2B+ 估值倍数
        - 要求进入数据室；要求经审计财报或 Big-4 商定程序
      - - 毛利率与 PLAAS 单位经济
        - 混合毛利率；PLAAS 每合同年收入；每个 PLAAS 订户对应的法律运营成本
        - 300+ 名美国法律运营员工意味着 $45-75M 年成本；若 PLAAS 毛利率 < 50%，软件经济性逻辑失效
        - CFO 单位经济说明材料；对标法律流程外包可比公司
      - - 客户净收入留存
        - 单案 SaaS 年度 NRR；前 100 大 PI 律所队列流失率；PLAAS 试点转合同率
        - NRR > 120% 可验证增购逻辑；< 100% 则推翻留存主张
        - 客户背调电话（5-10 家大型律所）；审阅合同续约数据
      - - RELX/REV 治理条款
        - REV 投资文件中的竞业限制条款、数据共享权和优先要约权
        - RELX 拥有 LexisNexis；条款可能限制 EvenUp 接触其他战略收购方
        - 索取并审阅投资人附函；独立法律审查共同投资人权利
      - - Piai 模型 IP 与依赖
        - 第三方 LLM 提供商合同、微调数据所有权、控制权变更时的可迁移性
        - 若模型被 OpenAI 或类似供应商锁定，收购或 IPO 时会产生成本和 IP 风险
        - 技术尽调模型架构；审阅 LLM 提供商 MSA 和数据处理附录
    notes: 尽调要求按对估值判断的重要性排序。第 1 和第 2 项为阻断项；第 3-5 项为重要项。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
