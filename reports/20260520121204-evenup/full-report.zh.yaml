      - number: '3.4'
        title: 横向法律 AI 平台
        blocks:
          - type: paragraph
            body: >
              三个资金充足的横向法律 AI 平台，如果扩展到 PI 原告垂直赛道，可能成为未来竞争者：Harvey、CoCounsel（Thomson Reuters）以及带 Protégé 的
              Lexis+（LexisNexis）。

              Harvey AI（2022 年成立于 San Francisco）估计到 2025 年已融资 $300M+，面向 AmLaw 200 律所、BigLaw
              业务组和公司法律顾问，提供法律研究、合同起草、诉讼文件准备和 M&A 尽调。Harvey 2026 年产品方向包括“为每个案件打造、按你需求定制的法律智能体”——可按案件类型定制的智能体工作流。Harvey
              未公开面向 PI 原告律所营销，也缺少 PI 专属训练语料；其战略重心在高收入 BigLaw 买方，使近期进入 PI 的经济吸引力有限。

              Thomson Reuters 的 CoCounsel（2023 年以约 $650M 从 Casetext 收购）定位为基于 Westlaw 和 Practical Law 数据库的企业 AI
              助手，处理法律研究、合同分析、证言准备，以及诉讼和公司业务的文档审查。值得注意的是，Thomson Reuters 同时与 Supio 合作（Westlaw Advantage 集成）并在更广泛法律 AI
              领域竞争——合作关系可能限制 EvenUp 未来接入 Thomson Reuters 研究基础设施。

              带 Protégé 的 Lexis+（原 Lexis+ AI，2026 年改名）是 LexisNexis 的一体化法律 AI 产品，把 Protégé AI 助手、Shepard's 引用验证、iManage /
              NetDocuments DMS 集成和移动访问结合起来。其明确能力包括从上传材料中起草证据开示文件、证言问题和诉讼文件——在概念上与 EvenUp 的文档套件重叠。不过，它没有用 PI
              专属医疗记录和判决数据训练，在需要 ICD 编码伤情分析和和解价值基准比较的 PI 索赔工作流中竞争力有限。

              横向法律 AI 威胁主要是长期商品化风险：如果模型能力持续提高，基础 AI 供应商又能大规模训练法律数据，今天需要 PI 专属训练才能形成的差异化可能会被侵蚀。EvenUp 的回应——平台深度、主动智能体和
              250,000+ PI 判决与和解的自有数据集——具备防御性，但如果不能持续积累数据，就并非永久优势。
            claimRefs:
              - CP023
              - CP024
              - CP025
              - CP026
