      - number: '2.2'
        title: 市场规模测算视角
        blocks:
          - type: paragraph
            body: >
              没有分析机构发布过独立的 PI 原告法律科技 AI 市场规模估计。广义法律 AI 市场可提供两个自上而下视角，且差异明显：Grand View Research 估计 2024 年全球法律 AI 市场为
              $1.45 billion，并预计以 17.3% CAGR 增至 2030 年 $3.90 billion，其口径锚定 eDiscovery、法律研究和合同审查。MarketsandMarkets 报告 2025
              年法律 AI 软件市场为 $3.11 billion，并以 28.3% CAGR 增至 2030 年 $10.82 billion——口径明显更宽，纳入生成式 AI
              智能体和行业专属起草工具。两项估计之间的差距反映定义差异，而非实证分歧；两者都应被视为上限参考点，而不是 PI 专属市场规模。

              美国 PI 子市场的自下而上估计，可以从规模指标开始：BLS 报告美国 2024 年有 864,800 名执业律师，其中一部分专做人身伤害原告业务。EvenUp 自身数据暗示活跃 PI 原告律师约
              30,000–60,000 名（基于“数千家律所”和“服务 2,000+ 家律所”）。若粗略假设 AI-first 平台可触达 30,000 家 PI 律所，ARPU 约 $5,000–$20,000 /
              年，则当前价格点下的美国 PI AI SAM 为 $150M–$600M。EvenUp 2026 年 PLAAS 发布并产生 $10M+
              早期订阅，提示托管服务产品在该区间高端具备定价牵引力。上述估计不确定性很高，应视为示意而非定论。缺少已发布的 PI 专属市场规模本身就是重大证据缺口，本报告将其保留为尽调问题，而不是已解决数字。
