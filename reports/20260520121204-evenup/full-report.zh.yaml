            body: >
              EvenUp 没有披露 NRR、GRR、客户流失或队列级留存数据。缺少这些指标，就无法判断 2,000+ 活跃律所代表高总留存，还是高总获客掩盖了 SMB
              长尾流失。尽调应在把头部数量视为耐久留存信号前，要求按律所规模带和获客年份拆分的队列级数据。
