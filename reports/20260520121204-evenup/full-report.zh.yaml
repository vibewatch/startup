      - number: '6.2'
        title: 采用轨迹
        blocks:
          - type: paragraph
            body: >
              EvenUp 已记录的客户增长呈现清晰加速曲线，并与主要融资节点和产品发布绑定。ELG Injury Lawyers 于 2021 年 5 月成为公司第二个客户，构成早期采用拐点。到 2024 年 10 月
              Series D 公告时，EvenUp 披露服务 1,000+ 家律所；公司把这一门槛作为规模化产品市场契合的证据。2025 年 5 月 AI Drafts Suite 发布催化下一批客户：EvenUp
              报告该发布时服务 1,500+ 家律所，约七个月内客户增长 50%。到 2025 年 10 月，公司已跨过 2,000+ 家律所（Series E 报道与 Unite.ai COO 访谈均确认），这一数字在
              2026 年 5 月 PLAAS 发布披露时仍保持。

              案件吞吐量与律所数量同步增长。到 2025 年 10 月，EvenUp 已累计解决超过 200,000 起 PI 案件（COO Raymond Mieszaniec，Unite.ai 访谈），当时为受害者追回超过
              $10B。截至 2026 年 5 月，每周案件吞吐量为 10,000+ 起，平台累计损害赔偿超过
              $14B。这些量级指标显示，平均每家律所的案件负载也随着律所数量增加而提升；这更符合对既有客户工作流的更深渗透，而不只是新律所驱动的增长。

              Lightspeed 投资组合介绍确认，EvenUp 在创立两年内达到 $10M ARR，是快速商业化牵引的早期信号。2025 年 7 月，EvenUp 分析了 200 多家律所的数千次 AI 互动，发现 69%
              的提示词聚焦医疗治疗分析和伤害评估，30% 的律所进行后续追问；这说明使用是深度、交互式的平台使用，而不是表层采用。2026 年 5 月 PLAAS 发布在早期测试中带来 $10M+ 订阅销售额，在既有按案
              SaaS 基础上增加一条托管服务收入向量。
