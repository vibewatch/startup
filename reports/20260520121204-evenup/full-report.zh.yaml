      - number: '6.3'
        title: 具名客户验证
        blocks:
          - type: paragraph
            body: >
              EvenUp 至少发布了五个具名客户的详细生产案例研究，每个都给出可验证结果指标。ELG Injury Lawyers 是公司第二个客户（2021 年 5 月），报告在全面采用平台一年内收入增长 400%，并通过
              Express Demands 把需求函周转从几个月压缩到几天。ELG 创始人 David Eltringham 直接引用确认，律所在需求起草、通过 Companion 做 AI 驱动反驳，以及用 Medical
              Management 跟踪护理时间线中都已生产使用。J&Y Law（Los Angeles）用 Companion 和 AI Playbooks 自动化谈判数据收集，每周收回 320
              小时案件经理时间，案件生命周期缩短 25%，医疗时间线审阅时间减少 50%。部署接案阶段 AI Playbooks 后，律所月签约案件翻倍。

              John K. Zaid & Associates（Houston，180 名律师和员工）在不增加人手的情况下，需求函月环比多发 30%，并在原本报价低于 $10,000 的案件上拿到高出 300% 的和解额。在
              2,000 起案件和 7,500 次 AI 执行的客户电话与短信中，EvenUp 的 Communication Agent 主动为 37% 的客户标记急性问题，并识别出 20% 的爽约。Mama
              Justice（Mississippi / Alabama / Tennessee）实现和解额提高 40%、案件解决快 14%；其 70% 的需求函现在通过 Express Demands 完成，每份耗时 10
              分钟，而此前每份需要 1 小时以上。Sweet James PI 律所年结果增长到 $500M+，同比增长 70%；COO Raymond Mieszaniec 把它列为 AI
              放大规模、但员工数不成比例增长的旗舰案例。

              其他具名验证包括 Fielding Law（California）：创始负责人 Clark Fielding 称使用 Medical Management 达到 100%
              案件准备度（「我们可以在证词录取中实时调出信息」）；以及 Lerner and Rowe 创始合伙人 Glen Lerner，他是早期 PLAAS
              客户，称该服务释放了资深员工，让他们专注于更高价值工作。所有结果主张都来自公司发布材料；没有独立第三方审计这些 ROI 数字，这是反向证据部分明确指出的限制。

              EvenUp 2025 年 3 月的 Pioneer Awards 项目表彰十家以 AI 驱动创新的 PI 律所，形成正式客户认可与倡导渠道。获奖者获得联合品牌营销、加入 EvenUp Customer
              Advisory Board 的邀请以及联合活动。这个机制生成公开可见的客户背书，同时加深组织关系，降低头部账户流失风险。
