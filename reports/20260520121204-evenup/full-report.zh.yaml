              tone: negative
        - label: Sweet James
          values:
            - label: 中（$500M 成果；同比增长 70%）
              tone: neutral
            - label: 低（COO 访谈自述）
              tone: negative
            - label: 高（全平台）
              tone: positive
            - label: 中（暗示多年）
              tone: neutral
    approximationNotes: |
      评级是基于来源独立性、指标具体性、部署时长和续约证据可得性的定性评估。未采用标准化评分方法。
    claimRefs:
      - CU028
      - CU029
      - CU036
      - CU025
      - CU026
  - id: FR001
    title: 风险热力图——EvenUp 风险栈
    type: matrix
    layout: wide
    summary: 以发生可能性 × 影响程度矩阵，呈现 EvenUp 五类主要风险。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 严重影响
      rows:
        - label: 高可能性
          values:
            - ''
            - AI 人才流失
            - 律师胜任能力风险；PLAAS 审核员质量下滑
            - ''
        - label: 中等可能性
          values:
            - ''
            - FTC 对基础设施的审查
            - OCR/HIPAA 错误；医疗时间线 OCR 错误；UPL 风险暴露
            - AI 幻觉——职业过失 / 制裁；HIPAA 泄露
        - label: 低可能性
          values:
            - ''
            - 云故障（短时）
            - CMS 平台捆绑；RELX 产品冲突
            - 安全事件 / 勒索软件；创始人离职
    approximationNotes: 可能性和影响为定性估计，依据行业先例、监管指引和公司披露的风险因素。没有可用的量化概率数据。
    claimRefs:
      - CR001
      - CR010
      - CR017
      - CR024
      - CR029
