      - number: '7.3'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              EvenUp 的分发高度依赖少数案件管理平台集成：Filevine、Litify、CasePeer/Clio 和 SmartAdvocate 合计覆盖多数中大型 PI 律所。 任何平台弃用
              API、调整定价或签排他安排，都可能打断 EvenUp 的数据摄取管线，并迫使公司付出高成本重新集成。 Filevine 已经搭建自有 AI 层（LOIS），让宿主平台和插件式 AI 供应商之间存在潜在冲突。
              EvenUp 的战略投资者之一 LexisNexis/RELX，是 Lexis+ AI（现 Lexis+ Protégé）的母公司； 该产品直接竞争 AI 辅助法律研究赛道，也有分发触达能力扩展到 PI
              索赔函生成。 RELX 的多数股权地位制造了利益冲突场景：该投资者可能复用 EvenUp IP 或客户数据学习， 也可能在投资周期结束后直接自建竞争产品。


              云和模型提供商集中度是另一层依赖。EvenUp 的 Writing Layer 依赖基础 LLM（很可能是 GPT-4 级或类似模型）； 任何模型提供商弃用、涨价，或服务条款变化限制使用 PHI
              相邻的法律数据，都会迫使公司付出高成本迁移模型。 FTC 已经指出，少数云提供商主导 AI 计算基础设施，给 AI 初创公司带来系统性集中风险。 EvenUp 客户集中在前 100 大 PI 律所中的
              30%，意味着即便流失两三个旗舰账户，也会对渠道背书和增长轨迹造成实质伤害。
