company:
  name: "EvenUp"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    EvenUp, founded in late 2019 in San Francisco by Rami Karabibar, Raymond Mieszaniec, and
    Saam Mashhad, has emerged as the dominant AI platform for personal injury law firms, serving
    2,000+ firms including 30% of the top 100 US PI practices and processing $14B+ in cumulative
    damages. With $385M raised at a $2B+ valuation, the company most recently launched PLAAS
    (Pre-Litigation as a Service) in May 2026, pivoting from pure software toward outsourced
    legal operations.

sections:
  - id: identity-and-mission
    title: "Identity, Headquarters, and Mission"
    body: >-
      EvenUp was founded in late 2019 in San Francisco, California, by three co-founders with
      complementary legal, operational, and technical backgrounds. The company's stated mission
      is to level the playing field for personal injury claimants — a motivation rooted in
      CEO Rami Karabibar's personal experience with a family member's PI case, where he observed
      first-hand how resource-constrained law firms struggle to marshal the evidence and
      documentation needed to achieve fair settlements. EvenUp's platform sits at the
      intersection of legal technology and AI-powered workflows, offering PI firms an end-to-end
      suite for case intake, medical record analysis, damages quantification, and demand letter
      generation. The company is incorporated and headquartered in San Francisco and employs a
      flexible hybrid work model. EvenUp operates in the broader legal AI and legaltech market,
      which has attracted significant institutional capital following the generative AI wave of
      2023–2025. EvenUp holds SOC 2 Type II and HIPAA compliance certifications, enabling
      deployment in law firm environments where client data privacy is a core requirement. The
      company is privately held and has not disclosed annual revenue; it operates as a
      high-growth, late-stage venture-backed startup with unicorn-plus ($2B+) valuation status.
    claimRefs: [CO001, CO002, CO025, CO015, CO010, CO026]
    figureRefs: [FO002]

  - id: leadership-and-founders
    title: "Founders and Leadership Team"
    body: >-
      EvenUp was co-founded by three individuals who remained in executive roles as of the
      report date. CEO Rami Karabibar drives the company's strategic vision and is its primary
      external spokesperson; his founding motivation was shaped by observing a family member
      navigate a personal injury claim without adequate legal resources. COO Raymond (Ray)
      Mieszaniec brings operational and entrepreneurial depth, having previously co-founded
      fintech startup EquitySim and worked in PwC's risk consulting practice in Hong Kong. The
      third co-founder, Saam Mashhad, holds the unusual dual title of Chief of Product and
      Legal Operations, reflecting the company's thesis that product decisions and legal
      operations expertise are inseparable in this market. All three co-founders were confirmed
      on EvenUp's investor pages and in executive interviews as of late 2025. EvenUp also
      maintains a 300+ person legal operations team that underpins its human-in-the-loop review
      process, ensuring AI outputs meet the evidentiary standards required by plaintiff
      attorneys. No material leadership departures were identified during the research period.
    claimRefs: [CO002, CO015, CO016, CO017, CO019]
    tableRefs: [TO002]

  - id: products-and-platform
    title: "Products, Technology, and Platform"
    body: >-
      EvenUp's flagship offering is the Claims Intelligence Platform, a suite of AI-powered
      tools designed to automate the pre-litigation workflow for personal injury law firms.
      At its core is Piai™, EvenUp's proprietary AI model trained on hundreds of thousands of
      PI cases, which drives automated medical record analysis, damages quantification, and
      demand letter drafting. As of May 2025, the company launched the AI Drafts Suite,
      bundling Smart Workflows, Medical Bill Summary, and Express Demands under a per-case
      pricing model. Additional products include Mirror Mode (which adapts output to firm
      style), Case Companion (an in-case AI assistant), Voice Agent (for client intake), and
      AI Playbooks (standardized firm-level automation). In December 2025, EvenUp added Medical
      Management, a tool that identifies treatment gaps in ongoing PI cases to help attorneys
      optimize client recoveries. The most recent product launch — announced in May 2026 — is
      PLAAS (Pre-Litigation as a Service), in which EvenUp effectively acts as an outsourced
      legal operations partner rather than merely a software vendor. PLAAS generated $10M in
      pre-sold subscriptions at launch, signaling strong demand for a higher-touch service
      model. The platform enforces SOC 2 Type II and HIPAA controls throughout the data pipeline.
    claimRefs: [CO012, CO027, CO022, CO023, CO032, CO033, CO034, CO010, CO021]
    figureRefs: [FO003]

  - id: customer-scale-and-market
    title: "Customer Scale and Market Position"
    body: >-
      As of May 2026, EvenUp serves more than 2,000 personal injury law firms, including
      approximately 30% of the top 100 US PI practices — up from 20% as reported at the AI
      Drafts Suite launch in May 2025 and 1,500+ firms overall. The company has cumulatively
      resolved more than 200,000 PI cases and processed over $14 billion in plaintiff damages.
      At PLAAS launch, EvenUp reported processing approximately 10,000 cases per week. This
      market penetration is particularly significant given that the top 100 PI firms account
      for a disproportionate share of US personal injury settlement volume, and EvenUp's
      penetration rate among them de-risks competitive displacement at the high end. The
      company's scale metrics also function as a moat: the Piai™ model improves with each
      incremental case processed, and EvenUp's 300+ legal ops team provides a human review
      backstop that pure-software competitors lack. The Forbes Cloud 100 recognition in 2025
      provided third-party validation of EvenUp's position as a leading cloud software
      company. The company's per-case pricing model aligns incentives directly with firm
      throughput, reducing friction relative to flat-fee enterprise SaaS alternatives.
    claimRefs: [CO003, CO004, CO008, CO009, CO013, CO011, CO014, CO035]
    tableRefs: [TO001]

  - id: funding-and-investors
    title: "Funding History and Investor Landscape"
    body: >-
      EvenUp has raised $385 million in total disclosed funding as of October 2025, per Bloomberg
      Law. The most recent round was a $150 million Series E in October 2025, led by Bessemer
      Venture Partners, which pushed the company's valuation above $2 billion. Co-investors in
      the Series E included REV Ventures (RELX/LexisNexis's venture arm), B Capital Group, and
      Bain Capital Ventures. The prior Series D was publicly reported in June 2024 and later
      announced on company channels in October 2024; it raised $135 million at approximately
      $1 billion valuation with Bain Capital Ventures named as lead investor and Bessemer as a
      participant. Prior rounds included participation from Lightspeed Venture Partners, SignalFire
      (which led the seed round), NFX, and DCM Ventures. Bessemer's repeat participation across the
      late-stage rounds is notable because the firm has deep expertise in vertical SaaS and legal
      AI. RELX/LexisNexis's participation through REV suggests potential strategic data and
      distribution alignment.
      The company has not disclosed ARR, revenue growth, or burn rate, which limits financial
      diligence to funding-round disclosures. The $385M total raised is unusually large for a
      Series E legal-tech company, suggesting either high capital intensity in the PLAAS
      outsourcing model or significant runway extension into a potential IPO trajectory.
    claimRefs: [CO005, CO006, CO007, CO018, CO028, CO029, CO036, CO037]
    tableRefs: [TO003, TO004]
    figureRefs: [FO001]

