callouts:
  - calloutType: strength
    title: "Dominant early-mover advantage in PI legaltech"
    body: >-
      With 30% penetration of the top 100 US PI firms and 200,000+ cases resolved, EvenUp has
      established a flywheel that is difficult for entrants to replicate: each incremental case
      improves Piai™ model quality, and the 300+ legal ops team provides a human-review backstop
      that pure-software competitors cannot easily match. Bessemer's repeated lead position
      across Series D and E signals high conviction in EvenUp's defensibility.
    claimRefs: [CO003, CO004, CO008, CO019, CO027]

  - calloutType: risk
    title: "AI bias and court-system concerns create regulatory exposure"
    body: >-
      Above the Law and legal commentators have flagged that AI demand letters may introduce
      algorithmic bias, inflate or anchor claim values, and add friction to already-congested
      court dockets. If plaintiffs' bar adoption outpaces quality controls, EvenUp could face
      bar-association scrutiny, malpractice exposure for its law firm customers, or judicial
      pushback that limits product adoption. The company's SOC 2 / HIPAA certifications address
      data privacy but do not directly address claim-inflation or bias concerns.
    claimRefs: [CO030, CO031, CO010]

  - calloutType: insight
    title: "PLAAS signals a SaaS-to-services pivot worth watching"
    body: >-
      The May 2026 PLAAS launch represents a meaningful business model evolution: EvenUp is
      moving from a software tool that law firms use to a legal operations outsourcing partner
      embedded in firm workflows. The $10M in pre-sold subscriptions validates demand, but
      services models carry higher unit economics complexity and scaling risk than pure SaaS.
      Whether PLAAS is a genuinely new revenue model or a repackaging of existing capabilities
      will be tested by firm retention and margin data not yet publicly available.
    claimRefs: [CO014, CO034, CO013]

  - calloutType: assumption
    title: "Pre-Series D funding history is partially reconstructed"
    body: >-
      Total capital raised ($385M) and investor names (Bessemer, BCV, Lightspeed, SignalFire,
      NFX, DCM) are confirmed from primary sources, but the specific round structure before
      Series D is not publicly disclosed. This overview treats the pre-Series D capital as a
      single block; later chapters relying on burn rate or dilution analysis will need primary
      source confirmation of intermediate round terms.
    claimRefs: [CO005, CO028, CO029, CO037]

