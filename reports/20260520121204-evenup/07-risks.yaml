- id: TR005
  title: Mitigation & Kill Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - HIPAA breach
    - HHS OCR breach portal public listing naming EvenUp; or press coverage of EvenUp data incident
    - Any confirmed breach affecting 500+ individuals reported to OCR
    - Full diligence pause; assess scope, client notification obligations, OCR settlement risk; consider exit or repricing
  - - AI hallucination producing attorney sanctions
    - Court order, bar complaint, or published opinion naming EvenUp output as cause of sanctions
    - Any published adverse ruling explicitly citing EvenUp demand content
    - Immediate product review; attorney-supervision protocol overhaul; potential liability exposure for investors
  - - CMS platform bundling competing AI
    - Filevine, Clio, or Litify announces native demand-letter AI in product roadmap
    - GA launch of competing native feature by any of the top 3 CMS platforms
    - 'Model shift scenario: assess whether EvenUp''s workflow superiority is durable; re-evaluate moat'
  - - RELX/LexisNexis product conflict
    - LexisNexis announces PI-focused demand-letter or legal-ops product at scale
    - Public product announcement with PI firm customer wins
    - Assess board observer rights and IP-protection covenants; evaluate strategic alternatives
  - - Gross margin compression below 40%
    - Any disclosed financial data showing PLAAS services cost exceeding 60% of PLAAS revenue
    - Gross margin below 40% persisting for two consecutive quarters
    - Re-evaluate PLAAS unit economics; consider whether SaaS-tier pricing offsets services drag
  - - Regulatory rulemaking on AI legal tools
    - ABA, state bar, or federal agency issuing binding rules requiring attorney disclosure or limiting AI-generated legal
      documents
    - Binding rule with compliance deadline within 12 months
    - Assess compliance cost; evaluate whether rule creates moat (compliance-grade product) or barrier
  notes: Kill criteria are not mathematical certainties; each trigger requires qualitative judgment about severity and recoverability.
    Thresholds are indicative monitoring thresholds for investor review.
