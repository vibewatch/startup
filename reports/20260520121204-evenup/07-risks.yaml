company:
  name: EvenUp
chapter:
  number: 7
  title: Risks
  summary: 'EvenUp''s risk profile is dominated by three interlocking threats: regulatory exposure from HIPAA and attorney-ethics
    rules governing AI-assisted legal documents; AI-output quality risks that could trigger attorney sanctions or malpractice
    claims if hallucinated facts reach demand letters; and partner-concentration risk from deep integration with a small set
    of case-management platforms and a strategic investor (RELX) with adjacent competitive interests. The PLAAS managed-services
    expansion sharpens all three by drawing EvenUp closer to the practice of law, increasing PHI exposure, and widening the
    supervisory chain between AI output and attorney review.'
sections:
- id: regulatory-legal-risk
  title: Regulatory & Legal Risk
  body: 'EvenUp operates at the intersection of healthcare data law and professional-conduct rules, creating layered regulatory
    exposure that intensifies with PLAAS. Under HIPAA, EvenUp processes protected health information (PHI) — medical records,
    treatment summaries, billing statements — on behalf of personal-injury law firms that obtain that data from covered health-care
    providers. This makes EvenUp a HIPAA business associate, obligating it to execute Business Associate Agreements, maintain
    administrative/physical/technical safeguards, and report breaches within 72 hours of discovery. The HHS OCR enforces directly
    against business associates since the HITECH Act; fines reach $1.9M per violation category per year. Healthcare experienced
    289 million breach victims in 2024 — the largest single breach (Change Healthcare) affected 192.7 million individuals
    — demonstrating that business-associate breaches are a primary OCR target.


    Attorney-ethics rules add a second layer. ABA Model Rule 1.1 (Competence) obligates supervising attorneys to understand
    the technology they use; Rule 1.6 (Confidentiality) restricts disclosure of client data to vendors without consent or
    operational necessity; Rule 5.5 prohibits assisting unauthorized practice of law. As EvenUp''s PLAAS offering moves legal-operations
    staff into active case work, regulators in several states may scrutinize whether non-attorney "legal ops" personnel cross
    into the practice of law. The Texas Bar and other state bars have issued ethics guidance calling for attorney supervision
    of AI tools. In Mata v. Avianca (S.D.N.Y. 2023), a court imposed sanctions on attorneys who submitted AI-generated briefs
    with hallucinated case citations, demonstrating that AI output errors upstream of attorney supervision can produce professional
    liability downstream. The NIST AI Risk Management Framework provides a voluntary but increasingly cited standard for AI
    governance that regulators and courts may use as a benchmark. FTC competition scrutiny of generative-AI supply chains
    — particularly cloud compute and model concentration — could indirectly affect EvenUp''s infrastructure partners.'
  claimRefs:
