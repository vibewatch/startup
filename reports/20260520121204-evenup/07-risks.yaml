- id: operational-quality-security-risk
  title: Operational & Quality Risk
  body: 'EvenUp''s core product risk is AI-output quality: medical-chronology errors, hallucinated treatment dates, inflated
    or incorrect damages calculations, and OCR ingestion failures on low-quality medical-record scans. The company acknowledges
    that general-purpose LLMs hallucinate and emphasises its human-reviewer layer and proprietary feedback loop as mitigations.
    Its 2025 benchmarks report found PI firms miss an average of five documents per 10 cases before EvenUp, and that EvenUp''s
    Missing Docs Check delivers a 75% reduction; this implies residual error rates that could still cause material under-valuation
    in a minority of cases.


    PLAAS magnifies operational risk: as EvenUp staffs 300+ legal-ops personnel (per company claims) to manage outsourced
    pre-litigation workflows, quality control depends on human reviewers scaling proportionally to case volume. Any reviewer-to-case-load
    deterioration produces systematic downstream errors. Cloud and infrastructure outages affecting the SaaS platform — authentication
    failures, API downtime, third-party model provider interruptions — can halt demand-letter production for client firms
    with time-sensitive deadlines (statutes of limitations, adjuster response windows). EvenUp''s DPA requires breach notification
    within 72 hours but does not guarantee uptime. Security incidents — ransomware targeting a legal-tech platform holding
    PHI and confidential case strategy — would trigger HIPAA breach reporting, potential OCR fines, and severe reputational
    harm with firm clients.'
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  tableRefs:
  - TR002
- id: partner-dependency-risk
  title: Partner & Dependency Risk
  body: 'EvenUp''s distribution depends critically on integration with a small set of case-management platforms: Filevine,
    Litify, CasePeer/Clio, and SmartAdvocate collectively cover most mid-to-large PI firms. Any API deprecation, pricing change,
    or exclusivity arrangement by a platform could disrupt EvenUp''s data ingestion pipeline and force costly re-integrations.
    Filevine has built its own AI layer (LOIS), creating a latent conflict between host platform and add-on AI vendor. LexisNexis/RELX
    — one of EvenUp''s strategic investors — is the parent of Lexis+ AI (now Lexis+ Protégé), which competes directly in the
    AI-assisted legal research space and has the distribution reach to expand into PI demand-letter generation. RELX''s majority
    stake creates a conflict-of-interest scenario where the investor could repurpose EvenUp IP or client data learnings, or
    simply build a competing product once the investment horizon expires.


    Cloud and model-provider concentration is a further dependency. EvenUp relies on foundational LLMs (likely GPT-4-class
    or similar) for its Writing Layer; any model provider deprecation, cost increase, or terms-of-service change restricting
    use of PHI-adjacent legal data would force a costly model migration. The FTC has flagged that a handful of cloud providers
    dominate AI compute infrastructure, creating systemic concentration risk for AI startups. Customer concentration among
    EvenUp''s 30% of top-100 PI firms means that losing even two or three flagship accounts would materially damage pipeline
    references and growth trajectory.'
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR020
