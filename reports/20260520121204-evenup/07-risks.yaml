callouts:
- calloutType: risk
  title: 'HIPAA + AI Hallucination: The Compounding Threat'
  body: EvenUp's two highest-severity risks — HIPAA breach and AI hallucination — compound each other. Medical records processed
    by AI carry PHI; an OCR accuracy failure that introduces incorrect PHI into a demand letter could simultaneously constitute
    a HIPAA impermissible disclosure and an AI-hallucination error that exposes the supervising attorney to malpractice. Neither
    EvenUp's DPA nor its published product documentation fully addresses this intersection.
  claimRefs:
  - CR001
  - CR010
  - CR013
- calloutType: risk
  title: PLAAS Expands Regulatory Surface
  body: 'The May 2026 PLAAS launch takes EvenUp from software vendor to outsourced legal-operations partner. This shift expands
    exposure across all five risk categories simultaneously: more PHI in motion (HIPAA), non-attorney staff performing case
    analysis (UPL), larger operational footprint (quality/security), additional headcount scaling pressures (people), and
    a services-heavy cost structure (financial). The risk register should be re-evaluated at each PLAAS contract milestone.'
  claimRefs:
  - CR004
  - CR016
  - CR028
  - CR034
- calloutType: insight
  title: 'Structural Mitigation: Human-in-the-Loop Is Load-Bearing'
  body: EvenUp's primary mitigation across regulatory, quality, and legal risks is the human reviewer layer — attorneys and
    trained legal-ops staff who review AI output before delivery. This layer is effective when capacity matches caseload,
    but becomes a bottleneck risk at PLAAS scale. Investors should monitor the reviewer-to-case ratio as a leading indicator
    of quality and ethics-compliance durability.
  claimRefs:
  - CR015
  - CR027
  - CR036
