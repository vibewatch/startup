- id: people-execution-risk
  title: People & Execution Risk
  body: 'EvenUp''s three co-founders (Rami Karabibar, Raymond Mieszaniec, Saam Mashhad) and its chief scientist Haixun Wang
    (ACM Fellow) represent significant key-person concentration. Loss of any co-founder would affect product vision, fundraising
    credibility, and client confidence. Recruiting specialized legal-AI talent — ML engineers with NLP expertise, former attorneys
    willing to work in legal ops, HIPAA-compliant data-annotation staff — is highly competitive and expensive. EvenUp''s own
    engineering blog posts (Emre Yamangil, Fatemeh Torabi Asr) illustrate a deliberate effort to build culture and retain
    talent, but attrition in a hot AI labour market remains a persistent risk.


    Scaling PLAAS requires a parallel ramp of trained legal-ops reviewers. Quality degradation is a lagging indicator: errors
    in demand letters may not surface until adjuster negotiations reveal inaccuracies, by which time systemic defects could
    already have propagated across many cases. Supervisory attorney bandwidth is a constraining factor — law-firm partners
    must review AI outputs to satisfy competence obligations, and if EvenUp scales faster than the supervisory capacity of
    its client firms, the ethics and malpractice exposure transfers to those firms, reducing EvenUp''s net promoter score
    and renewal rates.'
  claimRefs:
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  tableRefs:
  - TR004
- id: financial-model-risk
  title: Financial & Model Risk
  body: 'EvenUp is private and does not disclose ARR or burn rate, creating opacity for investors. With $385M raised at a
    $2B+ valuation (Series E October 2025), the company has a $385M capital base, but PLAAS — which involves staffing 300+
    legal-ops personnel — is fundamentally more capital- and headcount-intensive than pure SaaS, compressing gross margins.
    If gross margins settle below 50% (plausible for a managed-services hybrid), the business requires significant revenue
    scale to fund continued R&D and AI infrastructure.


    Per-case pricing creates revenue volatility tied to PI caseload, which correlates with economic cycles, litigation trends,
    and insurance-adjuster practices. If insurance companies adapt to AI-generated demand letters by systematically discounting
    or scrutinising EvenUp-style documents, the revenue per case could erode. Competition from Harvey (valued at $11B in 2026),
    Anthropic and OpenAI entering legal verticals, and well-capitalised incumbents like Thomson Reuters (CoCounsel) and LexisNexis
    could price-compress the market. Future financing risk is real: a valuation correction or AI-sector downturn could impair
    the ability to raise at current terms, and the company has not disclosed a path to profitability.'
  claimRefs:
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
  - CR034
- id: mitigations-and-kill-criteria
  title: Mitigations, Monitoring, & Kill Criteria
  body: 'EvenUp has several structural mitigations in place: (1) BAAs and a published DPA covering CCPA and data-processing
    obligations, with breach notification within 72 hours; (2) a human-reviewer layer (legal ops + attorney sign-off) interposed
    between AI output and client delivery; (3) a proprietary feedback loop ingesting thousands of daily expert corrections
    to re-train domain models; (4) vertical specialisation in PI (rather than general legal AI) that reduces hallucination
    rates relative to general-purpose LLMs; (5) multiple CMS integrations reducing single-platform lock-in.


    Despite these mitigations, several thesis-break triggers would materially impair the investment case: (a) a confirmed
    HIPAA breach at scale triggering OCR fines and client attrition; (b) a court sanction or bar complaint naming EvenUp AI
    output as the proximate cause of attorney misconduct, generating adverse precedent that triggers firm-wide adoption bans;
    (c) a strategic shift by Filevine or Clio to bundle competing demand-generation AI natively, disintermediating EvenUp
    at point of intake; (d) RELX/LexisNexis using its board access to replicate EvenUp''s PI dataset and launch a competing
    product under the LexisNexis brand; (e) gross margins persistently below 40% as PLAAS scales, signalling the business
    cannot achieve SaaS-like economics. Monitoring indicators include OCR complaint filings naming EvenUp, bar-association
    guidance explicitly flagging AI demand-letter services, CMS platform pricing or API-policy changes, and RELX public statements
    about PI product expansion.'
  claimRefs:
  - CR035
  - CR036
  - CR037
  - CR038
  - CR039
