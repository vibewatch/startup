  - - Client confidentiality — ABA Rule 1.6; sharing case data with AI vendor may require informed consent
    - All U.S. jurisdictions
    - State bar ethics opinions increasingly address AI vendor data sharing
    - Medium
    - High
    - DPA restricts EvenUp use of data to service delivery; no selling/sharing with third parties
    - State bar complaints possible if consent or implied-authorization analysis not documented by firms
    - Verify attorney-consent language in engagement letters of top 10 firm clients
  - - Unauthorized Practice of Law — ABA Rule 5.5 and state equivalents; PLAAS legal-ops staff performing legal tasks
    - State-level UPL statutes (all 50 states)
    - No enforcement action identified to date; PLAAS launched May 2026
    - Low–Medium
    - High
    - PLAAS presented as 'legal operations support' not legal advice; attorney supervision required
    - As PLAAS scope expands, UPL risk rises; regulatory guidance on AI-assisted legal work is evolving
    - Review PLAAS service contract scope; assess whether any deliverables constitute legal advice
  - - AI hallucination / court sanctions — Mata v. Avianca precedent; attorney sanctions for unverified AI output
    - Federal and state courts
    - 'Active: courts issuing AI-disclosure and AI-verification standing orders'
    - Medium
    - High
    - EvenUp's Writing Layer uses proprietary models; human reviewers trained to fact-check citations
    - If a demand letter with factual errors reaches litigation stage, attorney sanctions and malpractice
    - Request copy of EvenUp's internal QA policy for medical-chronology fact-checking
  - - FTC AI competition scrutiny — model-provider concentration risk; potential antitrust action affecting cloud supply
    - Federal (FTC)
    - FTC monitoring AI infrastructure concentration; no direct EvenUp action
    - Low
    - Medium
    - Multi-cloud strategy and vendor diversification (if any); unclear from public sources
    - If FTC restricts key model providers, EvenUp's AI infrastructure costs or access could be impaired
    - Diligence AI infrastructure vendor list and contractual protections against unilateral changes
  notes: Likelihood and severity are qualitative assessments based on published regulatory postures, enforcement data, and
