  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: HIPAA-BAA-coverage
    missingEvidence: Copy or summary of EvenUp's standard BAA template for PI law firm clients; confirmation that all 2,000+
      firm clients have executed a BAA for PHI processing.
