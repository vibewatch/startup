    - Medium
    - Critical
    - BAA + DPA executed with every firm client; 72h breach notification protocol in DPA; technical safeguards
    - Single breach could trigger OCR investigation, client attrition, reputational collapse
    - Verify BAA coverage for all firm clients; request SOC 2 Type II or third-party audit report
  - - Attorney competence obligation — ABA Model Rule 1.1; supervising attorneys must understand AI outputs
    - All U.S. jurisdictions (ABA model; adopted by most states)
    - Active enforcement; multiple state bars issuing AI-specific guidance
    - High
    - High
    - Human-reviewer layer; attorney sign-off on all demand letters before delivery
    - If review is perfunctory, attorney malpractice exposure transfers; EvenUp's brand associated
