      - CI002
      - CI003
      - CI004
  - calloutType: risk
    title: Main underwriting blocker
    body: >-
      Investors still cannot see recognized revenue, backlog conversion, gross
      margin, burn, or runway. That turns every valuation argument into a partial thesis.
