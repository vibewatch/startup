  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / program
      - Public price / contract model
      - List vs realized visibility
      - Source-backed signal
      - Implication
    rows:
      - - Archer under PBAS
        - Army target market is under $2,000 per system; realized Neros ASP undisclosed
        - Realized pricing unknown
        - Army cost target and IDIQ structure are public
        - Category economics are price-constrained from the start
      - - Archer IDIQ ceiling
        - Up to $500M over five years
        - Ceiling is not revenue
        - Task orders and funding set per order
        - Investors must not convert ceiling directly into forecast revenue
      - - Marine Archer Strike package
        - Delivery-order pricing undisclosed; includes training
        - Realized pricing unknown
        - Official source confirms systems plus training bundle
        - Service attach may help monetization but could also dilute margin
      - - Flatbow / control stack
        - Bundled with PBAS package; no separate public pricing
        - Unknown
        - Shows accessory/control monetization is part of offer
        - Neros is not selling bare airframes only
      - - Archer AI
        - Not publicly priced
        - Unknown
        - Fundraise says proceeds will accelerate production
        - Future premium depends on autonomy value and qualification success
      - - Bandit
        - Not publicly priced
        - Unknown
        - New c-UAS interceptor category and deployment target by end-2026
        - Could expand ASP, but economics are entirely unproven publicly
      - - Comparable bundle signal from DroneShield
        - Hardware + subscriptions + warranties + services
        - Public bundle, not unit-level price
        - Shows defense buyers often buy systems, not individual devices
        - Neros may need more service-layer monetization than airframe investors assume
    notes: >-
      Pricing visibility is weak across Neros and most peers. Public data is best
      at showing target cost constraints and bundle structure, not realized ASPs.
