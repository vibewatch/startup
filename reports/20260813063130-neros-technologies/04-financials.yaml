    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Army PBAS / IDIQ deliveries
        - Firm-fixed-price IDIQ and order-based hardware shipments
        - Drones, support equipment, testing, engineering, training
        - Up to $500M ceiling through June 2031; realized revenue not public
        - Medium
        - Request task-order history, shipped units, invoicing, and backlog conversion by quarter
      - - Marine Corps Archer Strike order
        - Delivery order plus training package
        - Systems + hands-on operator training
        - Multi-million official order; exact recognized revenue not public
        - Medium
        - Ask for delivery schedule, recognized revenue, and training attach economics
      - - Ukraine / allied deliveries
        - Direct deliveries and partner channels
        - Units delivered and replenishment orders
        - Public shipment signals exist; channel economics are opaque
        - Medium-Low
        - Break out Ukraine-related, allied, and U.S. government revenue separately
      - - Support / engineering / testing
        - Non-recurring engineering and program support
        - Contract line items and service work
        - Covered in Army contract language; actual revenue contribution unknown
        - Low-Medium
        - Provide mix of product versus services revenue by program
      - - Future Archer AI / Bandit programs
        - New-product deployments and follow-on procurement
        - Systems, autonomy features, and interceptor missions
        - Funded for development and ramp; commercial deployment economics not public
        - Low
        - Show qualification milestones, pilots, pricing, and expected gross margin by product
    notes: >-
      The public record supports the structure of Neros's revenue model much more
      strongly than the amount or timing of recognized revenue.
