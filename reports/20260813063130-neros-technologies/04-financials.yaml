  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Current Neros production rate
        - About 1,500 drones per month; >1,200 per week reported elsewhere
        - Medium
        - Indicates early output scale but not profitability
        - Reconcile weekly and monthly production, shipped units, and scrap rates
      - - Near-term Neros target
        - 10,000 drones per month by end-2026
        - Medium
        - Drives fixed-cost absorption assumptions
        - Show planned line yield, staffing, and component supply needed to hit target
      - - Long-term Neros target
        - One million drones per year by 2028
        - Medium
        - Defines the scale story behind valuation
        - Bridge required capex, working capital, and order demand to that target
      - - Neros gross margin
        - Not publicly disclosed
        - Low
        - Core measure of whether attritable pricing can still create equity value
        - Provide gross margin by program and by product family
      - - Neros operating cash burn
        - Not publicly disclosed
        - Low
        - Determines runway and next-round timing
        - Provide monthly cash burn and quarterly cash-flow statements
      - - Red Cat gross profit proxy
        - $1.3M gross profit on $40.7M revenue; 3% gross margin in 2025
        - High
        - Closest public small-drone warning on factory under-absorption
        - Explain why Neros will structurally outperform or match this proxy
      - - AV mature-scale proxy
        - 32% Q4 2026 gross margin at far larger scale
        - High
        - Shows upside of backlog and diversified scale, but not directly Neros-equivalent
        - Clarify which margin components Neros can realistically converge toward
      - - Warranty burden
        - Not publicly disclosed for Neros
        - Low
        - Rugged hardware economics can be damaged by field failures
        - Provide warranty reserve, failure rates, and RMA trends
    notes: >-
      Public unit-economics evidence for Neros is mostly null. The closest usable
      hard signals come from output claims and public-drone comparables.
