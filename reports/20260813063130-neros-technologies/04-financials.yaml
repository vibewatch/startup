  - id: TI004
    title: Capital adequacy table
    columns:
      - Item
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Latest Neros financing
        - $250M Series C at $2.5B post-money
        - High
        - Establishes near-term capital availability
        - Confirm net proceeds, closing timing, and any secondary or debt elements
      - - Use of proceeds
        - Archer AI and Bandit development plus production ramps
        - High
        - Tells investors funds are headed into both new products and capacity
        - Break proceeds by R&D, tooling, hiring, inventory, and facilities
      - - Neros cash on hand
        - Not publicly disclosed
        - Low
        - Without cash balance, runway cannot be underwritten
        - Provide quarter-end cash and unrestricted liquidity
      - - Neros runway months
        - Not publicly disclosed
        - Low
        - Valuation depends on whether this round funds proof points to the next financing event
        - Provide base and downside runway scenarios
      - - Red Cat comparator liquidity
        - $167.9M cash; $212.1M net working capital; sufficient for 12 months per 10-K
        - High
        - Shows how much liquidity a public small-drone company still needs during ramp
        - Compare Neros planned liquidity cushion to public peer practice
      - - AV comparator liquidity
        - $377.3M cash; $1.2B funded backlog; $312.9M inventories
        - High
        - Demonstrates scale requires both liquidity and working capital
        - Show expected inventory build and receivable profile at Neros scale
      - - Peer capital bar
        - Shield raised $2B; Anduril raised $5B; Skydio raised $110M with self-funded growth claims
        - Medium-High
        - Competitive response capacity depends on capital as much as on product quality
        - Explain where Neros needs capital parity and where it only needs niche execution
    notes: >-
      This table focuses on forward capital adequacy, not on re-listing the full
      funding chronology already covered in Company Overview.
    claimRefs:
      - CI011
      - CI020
      - CI024
      - CI025
      - CI026
      - CI032
      - CI033
  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing metric
      - Impact on underwriting
      - Exact diligence path
    rows:
      - - Recognized revenue by quarter and by customer class
        - Prevents underwriting of actual growth and seasonality
        - Request quarterly revenue bridge split across Army, Marines, Ukraine/allies, and services
      - - Backlog and task-order cadence
        - Ceiling contracts can be mistaken for secured revenue
        - Request order book, funded backlog, unfilled orders, and cancellation history
      - - Gross margin by product family
        - Impossible to know whether low-cost drones create attractive economics
        - Request BOM trend, factory absorption, field support burden, and gross margin by program
      - - Cash balance and monthly burn
        - Runway and next-round risk remain opaque
        - Request cash, restricted cash, debt, and 12- to 24-month burn scenarios
      - - Inventory and working-capital turns
        - Manufacturing scale may consume capital faster than expected
        - Request inventory aging, prepaid inventory, supplier terms, and receivable days
      - - Customer concentration and reorder rate
        - Revenue quality depends on repeat procurement, not only pilot wins
        - Request top-customer shares, reorder cadence, and cohort-style program tracking
      - - Warranty / failure cost
        - Field reliability can destroy hardware margins
        - Request reserve policy, field-return data, and remediation expense history
    notes: >-
      The central problem is not absence of demand signals; it is absence of the
      exact private operating metrics needed to turn demand into an investment case.
    claimRefs:
      - CI013
      - CI014
      - CI030
      - CI031
      - CI034
      - CI035
      - CI036
