  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: autonomy-assurance-for-archer-ai-and-bandit
    missingEvidence: A documented autonomy boundary, test plan, failure-handling logic, and operator-supervision concept for Archer AI and Bandit.
    whyItMatters: Roadmap products with terminal-guidance or interceptor behavior cannot be underwritten safely from marketing copy alone.
    diligencePath: Request CONOPS, V&V results, autonomy safety case, red-team findings, and weapon-review documentation tied to DoD 3000.09.
