    severity: material
    topic: reliability-and-sustainment-metrics
    missingEvidence: MTBF, sortie-success rate, maintenance burden, repair-cycle time, field return rates, and communications link-loss statistics for Archer, Crossbow, and derivative variants.
    whyItMatters: Battlefield relevance depends on repeatability and sustainment, not just payload/range or procurement eligibility.
    diligencePath: Request fleetwide reliability dashboard, depot/repair data, unit-level after-action summaries, and warranty or failure logs.
