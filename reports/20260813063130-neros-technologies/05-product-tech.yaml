tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Product / module
  - Primary user
  - Public maturity / status
  - Differentiation
  - Diligence gap
  rows:
  - - Archer
    - U.S. military and allied FPV operators
    - Production / BlueUAS-approved core platform
    - Modular payload FPV with resilient comms, domestic manufacturing, and China-free positioning
    - Public endurance, sortie success, and sustainment metrics are not disclosed
  - - Archer Strike
    - Strike units in Army, Marine, and allied workflows
    - Production / contract-backed strike variant
    - Kraken Terminus payload integration and >20 km strike framing for contested environments
    - Warhead integration safety data, payload mix, and field failure rates are not public
  - - Crossbow / Flatbow
    - Dismounted pilots and small tactical teams
    - Production / Block 2 shipping and PBAS fielding
    - Wearable 25 km control stack, dual receivers, ATAK feed, displaced antenna options
    - Waveform, crypto, battery duration, and repair-rate details remain opaque
  - - Archer Fiber
    - Operators in severe EW environments
    - Early deployment / ordering open
    - NDAA-compliant fiber-optic control path with low RF signature and anti-jam positioning
    - Cable robustness, maneuver envelope, and cost/range tradeoffs are only partially disclosed
  - - Archer AI
    - Operators needing assisted strike in GPS-denied conditions
    - Development / publicly launched August 2026
    - Terminal guidance and GPS-denied position hold layered onto the Archer family
    - No public autonomy assurance case, rules-of-use, or field metrics were retained
  - - Bandit
    - Counter-UAS operators defending bases and moving units
    - Development / public test campaign
    - Low-cost Class 2/3 interceptor concept built from Neros' small-drone manufacturing base
    - Sensor stack, kill mechanism, hit probability, and operator supervision model remain unclear
  notes: Rows reflect the publicly disclosed Neros product family as of the run date, grouped by mission role rather than by every internal variant or payload kit.
