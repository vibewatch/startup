- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Risk
  rows:
  - - Pilot control philosophy
    - Manual FPV control remains the baseline and shapes UI, video, and safety assumptions
    - Operator training and usable GCS ergonomics
    - Pilot workload remains high as mission complexity rises
  - - Flight computer and sensor layer
    - Custom flight computer plus integrated sensor architecture provide vehicle control and growth capacity
    - Hardware design and calibration discipline
    - Public sensor list and redundancy design are not fully disclosed
  - - Powertrain and propulsion
    - In-house motor drivers and propulsion components determine payload/range/performance envelope
    - Motor sourcing, battery quality, and test throughput
    - Thermal, durability, and service-life data are not public
  - - Radio / video link
    - Neros-built command and control plus video radios underpin long-range and jamming-resilient operation
    - Spectrum engineering, antenna design, and contested-EMI adaptation
    - Waveform security and real-world link-loss statistics are not public
  - - Autonomy / software layer
    - Software-defined hardware enables rapid iteration, manufacturing control, and limited onboard autonomy features
    - Compute budget, perception quality, and test coverage
    - Archer AI safety boundary and model update process are not described publicly
  - - Manufacturing / test systems
    - Project Millennium treats assembly, test, and subsystem production as part of the product moat
    - Factory ramp, MES discipline, and supplier localization
    - Scaling process control without quality slippage is execution-critical
  - - Partner payload integration
    - Kraken, CX2, and Kela integrations extend the same core airframe into strike, RF, and fiber missions
    - Mechanical/electrical interfaces and roadmap alignment
    - Partner roadmaps can create bottlenecks or version-fragmentation risk
  notes: The Neros architecture is best understood as a hardware-software-manufacturing system with partner payload adapters, not as a pure autonomy software stack.
