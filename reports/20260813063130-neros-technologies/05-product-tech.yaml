- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / requirement
  - Status
  - Scope
  - Public support
  - Gap
  rows:
  - - BlueUAS / ATO pathway
    - Present for Archer
    - Procurement, NDAA, and cyber vetting for government users
    - DIU refresh reporting and Neros marketing both reference Archer approval
    - Public access to the live cleared-list record is now less transparent after the DCMA transition
  - - NDAA / China-free component posture
    - Strong company claim
    - Electronics provenance plus friendly-nation sourcing for other subsystems
    - Neros essays, Archer Fiber launch coverage, and Tectonic reporting all emphasize no critical Chinese chips
    - Third-party component-by-component audit results are not public
  - - EMI-resilient communications prototyping
    - Externally corroborated
    - Radio/control resilience for sUAS in contested spectrum
    - DIU selected Neros for EMI prototype work in a 99-company process
    - Prototype selection does not prove final field performance
  - - Human judgment / autonomy governance
    - Policy-constrained
    - Applies most directly to Archer AI and Bandit evolution
    - DoD Directive 3000.09 requires human judgment, V&V, safety, anti-tamper, and cybersecurity
    - Neros has not published a detailed autonomy assurance case
  - - Battlefield testing and operator feedback
    - Strong but qualitative
    - Ukraine learning loop, Army/Marine training, and user feedback into product iterations
    - Official and independent sources repeatedly cite battlefield-informed iteration
    - No public aggregate reliability or mission-success dataset was retained
  - - Documentation and security artifacts
    - Publicly limited
    - User manuals, integration materials, cyber artifacts, and certification bundles
    - Protected Downloads page routes users to support contact for documentation
    - No public manuals, SBOMs, penetration-test summaries, or formal airworthiness records were retained
  notes: Neros has meaningful procurement and policy anchors, but assurance disclosure is still far thinner than the marketing and funding narrative.
