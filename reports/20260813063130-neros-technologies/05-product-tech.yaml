- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Prior / current workflow
  - Neros solution
  - Measurable benefit
  - Limitation
  rows:
  - - Platoon-level strike mission
    - Ad hoc commercial FPV kit or higher-echelon fires request
    - Archer / Archer Strike package under PBAS
    - Strike missions framed out to >20 km with standardized Army package
    - Real-world mission success rates and sortie economics are not public
  - - Small-unit live-fire standoff
    - Short-range direct fires with little organic air reach
    - Archer Strike with explosive payloads and operator standoff
    - Army and Marines publicly trained with live ordnance in Korea from safer stand-off positions
    - Payload safety, reuse rate, and weather tolerance are not disclosed
  - - Dismounted FPV control under EW pressure
    - Vehicle-bound or fixed control setup with short range
    - Crossbow Block 2 / Flatbow wearable control station
    - 25 km range, >50% size reduction, ATAK video, and 150 m pilot standoff
    - Actual link reliability in dense jamming is not published
  - - Hunt enemy drone operators via RF emissions
    - Separate EW team or indirect signal analysis infrastructure
    - Archer integrated with CX2 Vadris payload
    - RF awareness can ride on the same FPV mission workflow without separate truck-scale gear
    - Public data do not show detection range, false-positive rate, or field kill chain timing
  - - Operate when radio links are heavily jammed
    - Accept degraded RF performance or avoid the mission
    - Archer Fiber with Kela fiber-optic link
    - Manual control path that is effectively unjammable in the link layer
    - Current cable lengths and maneuver constraints limit flexibility versus RF systems
  - - Future assisted strike / multi-asset control
    - Pilot-only control with limited onboard assistance
    - Archer AI and multi-asset-control roadmap
    - Potential GPS-denied hold and terminal-guidance assistance without changing the product family
    - Roadmap claims are not yet backed by public test data or operator doctrine
  notes: This table emphasizes operator jobs and workflow changes rather than platform specifications, to show how Neros sells mission outcomes.
