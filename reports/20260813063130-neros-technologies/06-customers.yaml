- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named customer proof
  body: 'Neros'' customer adoption curve is unusually fast for a defense manufacturer this young. By late 2025 the company had already disclosed a Marine Corps purchase and Army PBAS selection. By early 2026 the Army-facing proof improved from selection to delivery, with DroneXL and A-Drones reporting early PBAS fulfillment and Archer Block 2 fielding. By mid-2026, the War Department had invited Neros into Drone Dominance Phase I, and branch-level fielding evidence expanded further through Army and Marine live-ordnance training in South Korea. This is not the clean, multiyear program-of-record maturity of an incumbent prime, but it is materially more than logo-wall evidence.


    The strongest individual customer proof points differ by segment. For the Army, the progression from PBAS supplier to ahead-of-schedule delivery to five-year IDIQ ceiling is the best production-grade proof. For the Marines, the proof is more operational and institutional: Neros had a multi-million delivery order with training, while the Corps simultaneously created a dedicated attack-drone team and carried the systems into training and competition. For Ukraine, the evidence is strongest on volume and urgency rather than disclosure depth: Defense News describes a 6,000-drone International Drone Coalition award and says most of Neros'' then-current output flowed there. For SOCOM and broader allied demand, the proof is credible but not equally attributable, which is why the named customer matrix below distinguishes strong public proof from probable but thinner evidence.'
