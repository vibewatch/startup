- id: expansion-vectors-and-concentration-risk
  title: Expansion vectors and concentration risk
  body: 'Neros does have visible expansion vectors. The UK subsidiary announcement moves the company from coalition supplier to localized allied presence, and Project Millennium describes future APAC production and even a possible domestic-OEM component/customer layer in which Neros becomes both manufacturer and anchor customer. Those are important because they imply a path beyond U.S. service-branch procurement and Ukraine-related wartime orders. The company is also expanding across user classes inside defense: conventional infantry, special operations, coalition users, and allied ministries all appear in the public record.


    The risk is that most of the named demand still clusters around a few defense channels. The Army is the single biggest disclosed customer concentration point, the Marines are the strongest second proof, and Ukraine/coalition demand remains tied to wartime funding priorities. Defense News adds the most important adverse customer signal: operator demand is real, but program-office funding and budget follow-through still lag. That means Neros may be strategically relevant before it is durably budget-line protected. The correct read is not that customer proof is weak; it is that customer proof is real but narrower than the company''s scale narrative suggests. Until exercised order values, customer counts, and renewal-quality metrics are disclosed, customer concentration remains one of the most important underwriting risks.'
