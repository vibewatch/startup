  - - Ukraine via coalition procurement
    - 'Buyer/payer: International Drone Coalition and associated coalition funds; user: Ukrainian forces'
    - High-volume FPV supply for wartime use
    - Largest named non-U.S. end-user proof and strongest urgency signal
    - Current award status, renewal cadence, and mission outcomes are not public
  - - U.S. Special Operations and other DoD early users
    - 'Buyer/payer: service components or specialized commands; user: SOF and early fielding units'
    - Fielded FPV systems and likely experimentation / operational use
    - Adds breadth beyond the Army-Marine duopoly
    - Proof is mostly quoted by management or reporters rather than documented through retained contract records
  - - Allied / UK expansion
    - 'Buyer/payer: UK MoD and future allied ministries; user: British and European forces'
    - Coalition deliveries plus future local manufacturing and allied support
    - Key diversification vector away from purely U.S.-Ukraine demand
    - Named allied customers beyond the UK are still sparse in public sources
