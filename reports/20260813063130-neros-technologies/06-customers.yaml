  - - U.S. Marine Corps
    - 'Buyer/payer: Marine Corps programs; user: Fleet Marine Force units and MCADT-linked operators'
    - Archer Strike systems plus training, support, competitions, and live-fire integration
    - Best proof of training-led doctrinal adoption and operator institutionalization
