- id: retention-service-model-and-durability
  title: Retention, service model, and durability
  body: 'Public retention disclosure is thin, but Neros does show repeat-usage proxies that matter in defense. The Army relationship appears to deepen across stages: PBAS selection, field deliveries, then a much larger IDIQ ceiling. The Marine relationship also looks durable because procurement is paired with training, doctrine-building, competition, and live-fire employment instead of a one-off shipment. These are not substitutes for cohort or renewal data, but they are meaningful in a military adoption context where procurement often follows experimentation, operator training, and branch-level endorsement before scaling into repeat orders.


    Neros'' service model is also visible in a way many early defense startups never expose. The Marine contract explicitly included operator training and support, the Army IDIQ includes support and engineering, and the company''s documentation surface routes customers into direct support rather than public self-service manuals. That suggests customer durability may depend partly on mission-success and training relationships, not just airframe sales. The tradeoff is external opacity. No retained source gave formal NRR, GRR, renewal rate, or churn, and no public customer success dashboard quantified mission outcomes. Investors can see that customers are coming back through procurement actions and institutionalization, but they still cannot measure satisfaction or repeat economics with public precision.'
