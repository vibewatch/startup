figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Neros usually reaches military users through a sequence of battlefield demand, evaluation, procurement packaging, training support, and then broader branch or allied expansion.
  data:
    items:
    - label: Demand signal
      detail: Urgent branch need or coalition wartime requirement emerges from frontline operators or defense ministries
    - label: Evaluation surface
      detail: Competitions, MCADT events, PBAS reviews, BlueUAS pathways, or Drone Dominance gauntlets vet the system
    - label: Procurement package
      detail: Buyer purchases not just drones but kits, controllers, training, support, and sometimes engineering services
    - label: Fielding / training
      detail: Systems reach units through branch-specific training and mission-success support rather than self-serve deployment
    - label: Repeat / scale decision
      detail: Delivery performance, operator feedback, and branch experimentation determine whether orders deepen into IDIQs or repeated demand
    - label: Allied localization loop
      detail: Successful wartime or coalition use can translate into UK or regional manufacturing and broader allied demand
  approximationNotes: This is a synthesis of Neros' visible customer acquisition path, not a single disclosed procurement workflow.
  claimRefs:
  - CU001
  - CU005
  - CU006
  - CU015
  - CU023
  - CU024
  - CU034
