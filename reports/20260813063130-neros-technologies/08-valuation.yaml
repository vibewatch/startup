- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Project Millennium slippage
    - Visible commissioning or throughput miss that undermines the scale narrative
    - Weakens both bull-case capacity and confidence in capital efficiency
    - Pause or reset valuation case downward
  - - Demand-conversion slowdown
    - Army / coalition / allied procurement pace stalls relative to current narrative
    - Converts customer proof from durable growth signal into episodic demand signal
    - Reduce return expectations and increase downside weight
  - - Policy / compliance tightening
    - 3000.09 interpretation, export-control friction, or legal issue materially narrows Neros-like use cases
    - Cuts autonomy upside and slows allied expansion
    - Re-underwrite roadmap and adjust recommendation toward avoid
  - - No economic disclosure progress
    - Management cannot provide revenue, margin, backlog, and cap-table package before the next financing decision
    - Prevents disciplined underwriting at private-market prices
    - Keep at watch / research-more only
  - - Founder or bench discontinuity
    - Leadership change without visible succession depth during scale-up
    - Raises governance and execution fragility at the exact wrong moment
    - Pause or materially widen discount requirements
  notes: These triggers define when strategic interest stops being enough to justify continued valuation patience.
  claimRefs:
