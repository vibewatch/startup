- id: recommendation
  title: 'Recommendation: track / research more at the current mark'
  body: The right recommendation from public evidence is Track / Research-more. This is not a dismissive call. It recognizes that Neros has enough strategic and operating proof to stay on a high-priority diligence list, but not enough economic proof to justify a clean Buy at $2.5 billion post-money. A buy case would require either better entry pricing or materially better evidence—especially financial disclosure, order conversion, factory execution, and broader customer durability. Today, the public record supports a high risk rating and medium confidence. Market attractiveness is strong, product/customer proof is already meaningful, and the strategic narrative is credible. But economic visibility is still low, policy and concentration risks remain live, and the valuation relies heavily on investors projecting successful execution into the future. In portfolio terms, that means patience is not hesitation; it is disciplined underwriting. Neros may still become a very strong asset, but the
    current evidence does not make it a price-insensitive one.
  claimRefs:
  - CV030
  - CV031
  - CV032
  - CV033
  - CV034
  - CV041
  tableRefs:
  - TV001
  figureRefs: []
- id: exit-readiness-and-final-diligence
  title: Exit readiness and final diligence asks
  body: 'Public evidence supports several plausible future monetization paths, but none is ready to be underwritten aggressively yet. A near-term IPO story is weak because investors still cannot see the core operating data that public-market buyers would demand. A later private round is more plausible if Neros can demonstrate revenue, margin, and factory proof over the next 12–24 months. A strategic sale is also conceivable because larger defense and autonomy players could value domestic production capability, operator relationships, and low-cost drone manufacturing assets. But those exit paths depend on the same missing package of evidence: real financial statements, backlog conversion, customer concentration detail, cap-table structure, and autonomy/compliance documentation. Without that package, investors are effectively paying now for diligence they have not yet received. This is exactly why the thesis-break triggers and final diligence asks matter so much. The path to upside exists,
    but it still runs directly through evidence that remains private.'
  claimRefs:
