  - CV021
  - CV022
  - CV033
  tableRefs: []
  figureRefs: []
- id: scenario-and-comparable-analysis
  title: Scenarios and comparables bound the valuation range
  body: 'Because public Neros economics are incomplete, the best way to reason about valuation is through scenario logic plus a mixed comparable set. Public drone and defense comps show a very wide multiple spread. Red Cat trades at a venture-like multiple despite much smaller revenue, reflecting scarcity and growth optionality. AeroVironment and Kratos trade at more moderate hardware-defense multiples with disclosed revenue scale. Axon and Palantir show what much richer public-market premiums look like when investors can see strong recurring economics or software-like margins. Private peers reinforce the same lesson in a different way: Shield AI, Skydio, and Anduril all command larger valuations, but they also come with more disclosed scale, broader platforms, or stronger economic claims. Neros therefore does not need to be valued like a public hardware prime, but it also cannot responsibly be valued like a public software leader. The range of plausible value is real; the precision is not.
    That is why the base case clusters around modest appreciation, the bull case requires multiple proof upgrades, and the bear case still contemplates real down-round risk.'
  claimRefs:
