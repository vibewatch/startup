company:
  name: Neros Technologies
chapter:
  number: 8
  title: Valuation
  summary: Neros looks strategically important and commercially promising, but the current $2.5B post-money mark is still more compelling as a tracked opportunity than as a clean buy. The strongest evidence supports real demand proof, a valuable domestic-production narrative, and room for significant upside if Project Millennium and customer conversion succeed. The strongest counter-evidence is the absence of public revenue, margin, backlog, and cap-table disclosure, which makes the mark look stretched and evidence-light relative to the quality of information available to outside investors.
sections:
- id: thesis-and-anti-thesis
  title: Investment thesis and anti-thesis are both real
  body: 'Neros deserves a live investment debate because the company has already cleared hurdles that many defense startups never clear in public. There is credible demand proof, a domestically oriented production narrative, a product line that is broadening rather than narrowing, and a macro backdrop that still favors mass-produced military drones and counter-UAS tools. Those are the ingredients of a real investment thesis, not just a fundraising story. The problem is that the current valuation asks investors to lean on that strategic thesis without the supporting financial evidence that usually turns a strategic story into a price-sensitive buy. Public sources still do not disclose revenue, backlog conversion, gross margin, burn, or cap-table terms. So the anti-thesis is not that Neros lacks relevance; it is that the valuation is ahead of the disclosure. The right framing is therefore evidence-sensitive: Neros may be good, but the question is whether enough proof exists to justify paying
    the current mark today.'
  claimRefs:
  - CV001
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV010
  tableRefs:
  - TV002
  figureRefs:
