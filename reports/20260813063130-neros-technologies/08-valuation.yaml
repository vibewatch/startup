- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  enumerationScope:
    coverage: sample
    basis: Mixed private and public defense/autonomy comparables chosen to bracket Neros across hardware-heavy, hybrid, and software-premium valuation regimes as of August 2026.
  rows:
  - - Neros Series C
    - $250M raise at $2.5B post
    - $2.5B current private anchor
    - Direct current entry price
    - No public revenue, margin, or preference-stack disclosure
  - - Shield AI
    - 2026 financing round
    - $12.7B private valuation
    - Closest late-stage autonomy-defense peer
    - Much larger capital base and broader disclosed platform scope
  - - Anduril
    - 2026 Series H
    - $61B private valuation
    - Upper-bound defense-autonomy manufacturing benchmark
    - Far broader scope and scale than Neros
  - - Skydio
    - 2026 Series F
    - $4.4B private valuation with hundreds of millions revenue claim
    - Useful private comp for disclosed unit economics and production narrative
    - Different customer mix and product architecture
  - - Red Cat
    - $40.7M 2025 revenue; ~$1.57B market cap
    - ~38.6x revenue
    - Best small public military-drone proxy
    - Public microcap volatility distorts clean comparability
  - - AeroVironment
    - $1.9768B FY2026 revenue; ~$9.8B market cap
    - ~5.0x revenue
    - Mature public drone / loitering munitions benchmark
    - Much more mature backlog, scale, and disclosure
  - - Kratos
    - $1.3468B 2025 revenue; ~$11.98B market cap
    - ~8.9x revenue
    - Broader defense systems hardware benchmark
    - Not a direct low-cost-drone pure play
  - - Axon
    - $2.8B 2025 revenue; ~$48.72B market cap
    - ~17.4x revenue
    - Govtech recurring-revenue benchmark
    - Higher software mix and better public financial quality
  notes: The comp set intentionally mixes private and public names because no single public comp captures Neros cleanly. Palantir remains an outer-bound software premium reference in the body text rather than a direct peer row.
