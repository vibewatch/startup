  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Project Millennium ramps cleanly, customer base broadens, revenue reaches several hundred million with improving margins, and policy/compliance stays manageable
    - Supports value materially above current mark; roughly $6B-$9B or ~2.4x-3.6x current value
    - Execution still depends on scale, policy, and concentration easing
    - Low-medium
  - - Base
    - Neros proves relevance and some revenue growth but remains hardware-heavy and only partially transparent on economics
    - Supports only modest appreciation; roughly $3B-$4.5B or ~1.2x-1.8x current value
    - Factory throughput, margins, and customer durability stay only partially proven
    - Medium-high
  - - Bear
    - Factory ramp slips, procurement pace cools, or policy/compliance friction rises before economics are visible
    - Pushes value below current mark; roughly $1B-$2B or ~0.4x-0.8x current value
    - Down-round risk, concentration, and strategy-to-economics gap become dominant
    - Medium
  notes: Scenario values are illustrative ranges derived from comparable company boundaries and current public evidence; they are not model outputs or management guidance.
