  - CV036
  - CV039
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Financial statements
    - Quarterly revenue, gross margin, opex, burn, and cash runway
    - Turns strategic relevance into priced underwriting
    - CFO / data room
  - - Backlog and order conversion
    - Funded backlog, task-order history, cancellation rates, and customer concentration by revenue
    - Separates ceiling headlines from durable cash generation
    - Commercial and finance diligence
  - - Cap table and preferences
    - Ownership, liquidation preferences, anti-dilution, and any structured terms
    - Determines real entry economics and downside protection
    - Legal / shareholder review
  - - Factory KPI pack
    - Throughput, utilization, yield, scrap, supplier redundancy, and working-capital intensity
    - Determines whether Project Millennium deserves a strategic premium
    - Operations diligence
  - - Autonomy / compliance package
    - Weapons review, export-control matrix, safety-case, and major-customer approval path
    - Needed to judge whether policy risk is manageable or value-destructive
    - Legal and technical diligence
  notes: These are the minimum asks required to move from interest to conviction at the current mark.
