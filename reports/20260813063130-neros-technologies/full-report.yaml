  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product line and battlefield jobs
        blocks:
          - type: paragraph
            body: >-
              Neros now presents a coherent battlefield system rather than a single expendable drone. The current public
              core is Archer, an FPV platform built for modular payloads, resilient communications, and BlueUAS-aligned
              procurement; Archer Strike adds lethal payload integration for strike missions; and Crossbow, now
              supplemented by the soldier-borne Flatbow/Crossbow Block 2 concepts, is the control layer that makes the
              airframe usable in contested environments. The PBAS package shows the offer as a bundled system of air
              vehicles plus ground-control equipment, not a bare quadcopter. That matters because it shifts Neros from
              hobby-derived hardware branding into a military workflow sale centered on operator survivability,
              standoff, and rapid field reconfiguration.


              The roadmap extends that stack in two directions. Archer Fiber adapts the core Archer platform to
              fiber-optic control for environments where radio links are too vulnerable to electronic warfare, while
              Archer AI and Bandit represent the next autonomy-heavy expansion: one adds terminal-guidance and
              GPS-denied position-hold features to the strike family, and the other tries to turn Neros' manufacturing
              playbook toward low-cost interceptors. The public record therefore supports a product thesis built around
              a shared control/manufacturing/supply-chain backbone with multiple mission kits layered on top. What it
              does not yet support is full public transparency on endurance, failure rates, seeker performance, or the
              autonomy boundary between pilot assistance and independent action.
