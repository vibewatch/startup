            body: >-
              Neros' customer adoption curve is unusually fast for a defense manufacturer this young. By late 2025 the
              company had already disclosed a Marine Corps purchase and Army PBAS selection. By early 2026 the
              Army-facing proof improved from selection to delivery, with DroneXL and A-Drones reporting early PBAS
