      - number: '8.4'
        title: 'Recommendation: track / research more at the current mark'
        blocks:
          - type: paragraph
            body: >-
              The right recommendation from public evidence is Track / Research-more. This is not a dismissive call. It
              recognizes that Neros has enough strategic and operating proof to stay on a high-priority diligence list,
              but not enough economic proof to justify a clean Buy at $2.5 billion post-money. A buy case would require
              either better entry pricing or materially better evidence—especially financial disclosure, order
              conversion, factory execution, and broader customer durability. Today, the public record supports a high
              risk rating and medium confidence. Market attractiveness is strong, product/customer proof is already
              meaningful, and the strategic narrative is credible. But economic visibility is still low, policy and
              concentration risks remain live, and the valuation relies heavily on investors projecting successful
              execution into the future. In portfolio terms, that means patience is not hesitation; it is disciplined
              underwriting. Neros may still become a very strong asset, but the current evidence does not make it a
              price-insensitive one.
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
