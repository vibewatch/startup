  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and the real Neros wedge
        blocks:
          - type: paragraph
            body: >-
              The easiest mistake in analyzing Neros is to equate it with the entire military-drone economy. Neros does
              not compete across the full span of unmanned aviation. Its present market sits in a much narrower slice:
              low-cost, attritable, short-range strike drones such as Archer and Archer Strike, plus the emerging
              counter-UAS interceptor category represented by Bandit. That wedge is closer to expendable tactical
              munitions, force-protection tools, and small-unit reconnaissance/strike kits than to the large fixed-wing
              UCAV, MALE, or HALE platforms that dominate many global drone-market reports.


              The relevant status quo substitutes are therefore not just other drone startups. For Archer-like systems,
              the practical substitutes include mortars, grenade or rocket effects delivered by human operators,
              loitering munitions, ISR quadcopters adapted for one-way attack, and other low-cost FPV systems. For
              Bandit, the substitutes include jammers, kinetic interceptors, base-defense radars, and layered
              counter-UAS stacks. This boundary matters because it keeps Neros' addressable market tied to rapidly
              replenished tactical demand and force-protection spending, not to the whole budget for unmanned aviation
              or aerospace modernization.
