  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, contract mechanics, and what the public record really proves
        blocks:
          - type: paragraph
            body: >-
              Neros's public revenue model is straightforward in structure even if the numbers are opaque. The company
              sells Archer-family drone systems under military contracts, and those contracts include more than
              airframes. The Army IDIQ covers support equipment, testing, engineering support, and training. The Marine
              Corps delivery order likewise bundles hands-on training with system deliveries. PBAS materials also show
              that Neros sells not only Archer variants but associated control equipment such as Flatbow. That means
              revenue should be thought of as a mix of product shipments, non-recurring engineering or integration work,
              and training/support services rather than pure hardware unit sales.

              The problem is conversion visibility. Public sources give a $500 million ceiling, disclosed orders in the
              thousands, and repeated production-rate claims, but they do not show recognized revenue, deferred revenue,
              backlog, or task-order cadence. The chapter therefore treats ceiling value and financing headlines as
              demand indicators, not as realized economics. The key adverse clue comes from Defense News: Neros's CEO
              says demand is strong, but not yet consistently backed by funding and program offices. That warning
              matters because defense interest can outrun budget authority, and that gap is exactly where late-stage
              private underwriting gets into trouble.
