      - number: '3.2'
        title: Capability overlap, mission fit, and where Neros is not the same product
        blocks:
          - type: paragraph
            body: >-
              The most direct apples-to-apples threat to Neros on the strike-drone side is Red Cat. Black Widow and FANG
              are aimed at the same broad Army and tactical-unit buyer set and already come with Army program-of-record
              proof, ATAK-linked control, GPS-compromised navigation work with Palantir, and a disclosed path to
              production volume. AeroVironment is also a real threat, but in a more mature loitering-munition category:
              Switchblade 300 Block 20 offers longer reach, proven lethality, and large Army delivery orders, which
              makes it stronger for higher-confidence precision effects but not necessarily for the lowest-cost
              expendable mission that Neros targets.

              Shield AI, Anduril, and Skydio are adjacent rather than identical. Shield's Hivemind and V-BAT show far
              deeper autonomy and maritime proof than Neros, while Skydio is more recoverable ISR and open-platform
              software than cheap expendable strike. Anduril matters because it can use scale, manufacturing, and
              counter-UAS adjacency to compress weaker startups even without matching every Neros mission one-for-one.
              That distinction matters: Neros is not trying to beat every vendor at everything; it is trying to win the
              narrow zone where low unit cost, domestic supply, and operator-ready strike kits matter most.
