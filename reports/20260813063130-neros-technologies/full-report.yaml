      - number: '5.2'
        title: Architecture, electronics, and production system
        blocks:
          - type: paragraph
            body: >-
              The most credible Neros technical differentiation is not a published autonomy stack comparable to a
              software company; it is a tightly coupled mix of custom flight control, in-house radios, supply-chain
              engineering, and manufacturing design. The official website says Neros builds its own flight computer
              architecture, integrated sensors, motor drivers, propulsion components, and command/video radios. DIU's
              EMI program independently corroborates that Neros is not merely marketing radio resilience but was
              selected to prototype solutions for electromagnetically contested sUAS operations. Project Millennium then
              broadens the architecture concept further by treating manufacturing systems themselves as part of the
              product: communications, sensors, autonomy, and manufacturing systems are explicitly named as the
              company's four investment pillars.


              This creates a distinctive operating model. Neros is trying to control the stack from silicon provenance
              through assembly/test and then feed battlefield lessons back into new revisions quickly. The American
              Drone Dominance essay and Tectonic reporting both reinforce that the company sees chip-level China
              exclusion, friendly-nation sourcing for motors and antennas, and onshoring of high-risk subsystems as
              technical features rather than procurement paperwork. The product architecture therefore has two
              intertwined layers: the fielded drone system and the factory/supply system that makes the drone repeatable
              at scale. The tradeoff is opacity. Public materials discuss philosophy and modules in detail, but they
              still do not publish open integration manuals, software interfaces, encryption architecture, or
              third-party performance benchmarks.
