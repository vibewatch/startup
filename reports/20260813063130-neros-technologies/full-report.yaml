      - number: '3.3'
        title: Distribution power, switching costs, and what buyers actually buy
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Neros's real problem is not feature parity alone; it is distribution and
              procurement gravity. Red Cat already has Army SRR program-of-record status. AeroVironment has a five-year
              Army IDIQ and large delivery orders. Shield AI has Coast Guard, Navy, Marine, and Ukraine proof tied to a
              reusable aircraft plus autonomy layer. DroneShield sells complete hardware, subscription, warranty, and
              service bundles, while Dedrone sells sensor-fusion command-and-control tied to jammers and expeditionary
              kits. These vendors are not just selling airframes. They are selling validated workflows, training,
              sustainment, and trust.

              That creates real switching costs. Buyers get locked into common control systems, integration with ATAK or
              similar environments, trained operators, established sustainment chains, and battle-tested
              electronic-warfare performance. For Neros, that means the next stage of competition is not simply getting
              Archer or Bandit to work; it is proving that units can adopt them without paying a hidden tax in
              retraining, integration, or fleet fragmentation. DroneXL's warning about a potential “Frankenstein fleet”
              is especially relevant here: low-cost drones can still lose if their ecosystem imposes too much
              operational complexity.
