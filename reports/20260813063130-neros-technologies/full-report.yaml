      - number: '5.4'
        title: Trust, safety, compliance, and open risks
        blocks:
          - type: paragraph
            body: >-
              Neros has stronger public compliance anchors than many early defense-drone startups, but those anchors are
              narrow. BlueUAS selection and ATO-related reporting show that Archer has cleared an important procurement
              and cybersecurity gate for U.S. government users. DoD Directive 3000.09 also provides the governing frame
              for any autonomy-heavy expansion: autonomous and semi-autonomous weapon systems must preserve appropriate
              human judgment, pass realistic verification and validation, and include safety, anti-tamper, and
              cybersecurity controls. Neros' own public language is notably pilot-centric—its website says the pilot
              should have ultimate control, and fiber-drone commentary emphasizes manual precision where radio links
              fail—which is directionally consistent with that policy environment.


              The open diligence gaps are still material. Neros does not publish public user manuals or open integration
              guides; its documentation page routes users to support contact, and no retained public source exposed a
              third-party cyber certification, public SBOM, failure-rate dataset, or airworthiness dossier for Archer,
              Crossbow, Archer AI, or Bandit. That does not mean those controls do not exist, but it does mean the
              public record is much better at proving intent than proving assurance. This matters most for Archer AI and
              Bandit, because autonomy claims and interceptor roles raise the bar for test evidence, operator
              supervision boundaries, and explainable failure modes. The product story is credible on battlefield
              usefulness and manufacturing pragmatism; it remains incomplete on public safety and assurance disclosure.
            claimRefs:
