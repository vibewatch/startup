  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk severity overview
        blocks:
          - type: paragraph
            body: >-
              Neros has crossed the threshold from concept-stage defense startup to real program participant, which
              changes the risk conversation. The public record now supports genuine customer proof, product breadth, and
              substantial capital access, so the biggest risks are no longer whether anyone wants the product. They are
              whether Neros can scale manufacturing, sustain a traceable non-China supply chain, navigate a shifting
              autonomy-policy regime, and convert a handful of government demand signals into durable, budget-backed
              revenue. Those risks also interact. If Project Millennium slips, customer concentration matters more
              because the company has less room for execution misses; if 3000.09 is tightened or interpreted more
              cautiously, Archer AI and Bandit become harder to field at speed; if coalition or branch budgets slow, the
              lack of commercial diversification becomes more visible. The most important conclusion is that Neros looks
              strategically relevant before it looks fully operationally de-risked. Investors should treat
              manufacturing, policy, and dependency risks as the primary underwriting gates rather than assuming the
              Series C solved them.
