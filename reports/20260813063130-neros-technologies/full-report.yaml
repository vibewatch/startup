  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, adjacent platforms, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Neros does not face one clean competitor set. Its Archer family sits in the low-cost attritable strike and
              tactical-small-UAS lane, where the most relevant public peers are Red Cat/Teal, Firestorm, and other
              Gauntlet-I entrants being evaluated for cheap one-way attack drones at scale. That is a different arena
              from the one occupied by Shield AI, Anduril, and even AeroVironment, which sell broader autonomy stacks,
              higher-end aircraft, or more mature loitering-munition families. At the same time, Bandit pushes Neros
              into a second contest against counter-UAS specialists such as DroneShield and Dedrone, where buyers may
              prefer layered detect-track-jam systems instead of drone-on-drone interceptors.

              The status quo also matters. Foreign-produced drones historically filled many low-end use cases, but the
              FCC's 2025 Covered List action against foreign-produced UAS and critical components materially improves
              the policy backdrop for U.S.-made alternatives. That does not remove price pressure; it simply means Neros
              now competes less against unrestricted Chinese import options and more against domestic suppliers that can
              satisfy security, sourcing, and program-office trust requirements.
