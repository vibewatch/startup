      - number: '4.2'
        title: Cost structure, output ramps, and unit-economics proxies from public comps
        blocks:
          - type: paragraph
            body: >-
              Neros is trying to solve a hard manufacturing equation: low-cost drones, delivered at military quality, in
              much larger quantities than U.S. suppliers have historically produced. Public evidence suggests the
              company is spending into that ramp well before it can show mature economics. Project Millennium frames the
              factory itself as the “ultimate product,” while hiring pages show open roles in supply-chain planning,
              manufacturing systems, autonomy, finance, and recruiting. Defense News and JOBSwithDOD point to current
              production around 1,500 Archers per month and a targeted jump to 10,000 per month by end-2026, with a
              one-million-per-year goal by 2028. Those are output ambitions that normally demand major inventory,
              workforce, tooling, testing, and working-capital commitments.

              Public peers show what can go wrong and what better scale can look like. Red Cat's 2025 10-K is the most
              relevant small-drone proxy: revenue rose meaningfully, but gross profit was only 3%, operating cash burn
              remained large, and management explicitly blamed underutilized capacity for weak margins. AeroVironment,
              by contrast, shows what mature scale and backlog look like, but even it saw gross-margin dilution when
              service mix and acquisition amortization increased. Neros's public record does not let us calculate gross
              margin or cash conversion directly, but it strongly implies that early margins are likely pressured until
              production and delivery volumes normalize.
