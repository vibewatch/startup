              live-ordnance training in South Korea. This is not the clean, multiyear program-of-record maturity of an
              incumbent prime, but it is materially more than logo-wall evidence.


              The strongest individual customer proof points differ by segment. For the Army, the progression from PBAS
              supplier to ahead-of-schedule delivery to five-year IDIQ ceiling is the best production-grade proof. For
              the Marines, the proof is more operational and institutional: Neros had a multi-million delivery order
              with training, while the Corps simultaneously created a dedicated attack-drone team and carried the
              systems into training and competition. For Ukraine, the evidence is strongest on volume and urgency rather
              than disclosure depth: Defense News describes a 6,000-drone International Drone Coalition award and says
              most of Neros' then-current output flowed there. For SOCOM and broader allied demand, the proof is
              credible but not equally attributable, which is why the named customer matrix below distinguishes strong
