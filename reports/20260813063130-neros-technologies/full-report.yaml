companyProfile:
  summary: >-
    Neros Technologies is a Southern California defense startup founded in 2023 by Soren Monroe-Anderson and Olaf
    Hichwa, both publicly described as competitive FPV-drone practitioners who turned battlefield lessons into a
    domestically focused manufacturing company. By August 2026, Neros had expanded its public product set from Archer
    and Archer Strike into Archer AI, Bandit, Archer Fiber, and the Project Millennium factory program, while also
    securing visible Army, Marine Corps, Ukraine-coalition, and allied proof points. The company closed a $250M Series C
    at a $2.5B post-money valuation to scale autonomous and interceptor drone programs, but it still does not publicly
    disclose the financial and cap-table detail required for a fully underwritten late-stage private entry.
