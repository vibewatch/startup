      - number: '7.5'
        title: People, execution, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The final risk layer is organizational. Neros is still founder-defined, and the public story remains
              heavily centered on Soren Monroe-Anderson's ability to align operators, investors, and manufacturing
              ambition around a single scale narrative. That is a strength while momentum is building, but it becomes
              fragility if the operating bench is thinner than the brand suggests. The hiring surface implies the
              company is still building depth across manufacturing, engineering, and program execution, which is normal
              for a fast-scaling defense startup but should not be confused with mature operating redundancy. UK
              localization and the stated APAC ambition add another layer of managerial complexity before the U.S. scale
              thesis is fully proven. The practical investment response is to define kill criteria in advance. A
              cautious investor should re-underwrite immediately if the autonomy-policy environment tightens materially
              against Neros' roadmap, if Project Millennium visibly misses ramp milestones, if Army/Marine/coalition
              demand pauses, if export-control issues surface, or if founder continuity breaks without credible
              succession depth. Those are all monitorable events; none should be treated as a surprise.
