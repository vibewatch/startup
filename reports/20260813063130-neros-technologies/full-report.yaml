      - number: '1.3'
        title: Capital formation, investors, and stakeholder alignment
        blocks:
          - type: paragraph
            body: >-
              Neros has raised capital at a pace that matches its wartime-manufacturing narrative. The official November
              2025 Series B announcement disclosed a $75 million round led by Sequoia Capital with participation from Vy
              Capital US and Interlagos, taking total disclosed capital above $120 million. Nine months later, the
              company announced a $250 million Series C at a $2.5 billion post-money valuation co-led by Sequoia and the
              American Strategic Technology Fund, with participation from Valor Equity Partners, Allen & Company, Thiel
              Capital, Spark Capital, Dylan Field, and others. The investor mix matters: it blends venture firms,
              strategic-national-interest capital, and high-profile individual backers rather than purely financial
              late-stage capital.


              That said, the capital story is still not fully transparent. Public announcements describe explosive
              growth, significant revenue expansion, and major contracts, but they do not publish audited revenue, cash
              burn, backlog, customer concentration, or detailed cap-table economics. For a company pitching one million
              drones per year by 2028, this means investors can verify momentum and valuation marks more easily than
              underlying unit economics. The strongest conclusion is that capital access is currently a strength, while
              disclosure depth remains below what a traditional industrial diligence process would prefer.
