          detail: Buyer purchases not just drones but kits, controllers, training, support, and sometimes engineering services
        - label: Fielding / training
          detail: >-
            Systems reach units through branch-specific training and mission-success support rather than self-serve
            deployment
        - label: Repeat / scale decision
          detail: >-
            Delivery performance, operator feedback, and branch experimentation determine whether orders deepen into
            IDIQs or repeated demand
        - label: Allied localization loop
          detail: >-
            Successful wartime or coalition use can translate into UK or regional manufacturing and broader allied
            demand
