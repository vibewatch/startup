      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Neros sits inside one of the most politically sensitive parts of defense technology: low-cost strike and
              counter-UAS systems that are becoming more autonomous over time. The retained policy record matters. DoD
              Directive 3000.09 still centers appropriate human judgment, testing, verification, validation, and
              controllability, while White House NSPM-11 forces a fresh rewrite on a compressed 2026 timeline. That
              combination creates two-sided risk. A more permissive review environment could speed Neros programs, but
              it could also raise scrutiny if observers think safeguards are weakening faster than testing evidence is
              improving. Export-control risk is similarly real. Neros is now publicizing UK expansion and allied
              deliveries, yet the retained sources do not disclose export-license history, commodity-jurisdiction
              rulings, or an internal weapons-review process for Archer AI and Bandit. Meanwhile, ICRC, Human Rights
              Watch, and Just Security all show that autonomy-related legal and normative scrutiny is intensifying
              rather than fading. The public record does not show an enforcement event against Neros, but it also does
              not provide enough direct compliance disclosure to score the company as low-risk on regulation or law.
            claimRefs:
              - CR006
              - CR007
