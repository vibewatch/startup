      - number: '4.3'
        title: Capital adequacy, balance-sheet inference, and what peers imply about runway
        blocks:
          - type: paragraph
            body: >-
              The strongest part of Neros's public financial case is capital access. The August 2026 Series C raised
              $250 million at a $2.5 billion valuation, and the company says the funds will accelerate Archer AI and
              Bandit production ramps. That round followed November financing and company claims of explosive
              core-business growth since then. In isolation, that sounds sufficient. In context, it looks necessary.
              Project Millennium describes a 100x capacity step-up, Defense News says the million-drone goal requires a
              manufacturing overhaul, and hiring signals show that Neros is staffing not only engineering but also
              planning, manufacturing execution, and accounting.

              Comparables make the capital question sharper. Red Cat ended 2025 with $167.9 million of cash and still
              produced a $72.1 million net loss and $89.1 million of operating cash use. AeroVironment held $377.3
              million of cash and $1.2 billion of funded backlog, but it also carried nearly $313 million of inventory
              and large receivables. Skydio claims that its $110 million 2026 round was intentionally small because
              strong unit economics and hundreds of millions of revenue now fund more of its operations. Shield and
              Anduril raised billions. That spectrum suggests Neros's new round may be enough for the near-term ramp,
              but there is still no public basis for calculating runway, burn, or capital sufficiency with precision.
