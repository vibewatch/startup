  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis are both real
        blocks:
          - type: paragraph
            body: >-
              Neros deserves a live investment debate because the company has already cleared hurdles that many defense
              startups never clear in public. There is credible demand proof, a domestically oriented production
              narrative, a product line that is broadening rather than narrowing, and a macro backdrop that still favors
              mass-produced military drones and counter-UAS tools. Those are the ingredients of a real investment
              thesis, not just a fundraising story. The problem is that the current valuation asks investors to lean on
              that strategic thesis without the supporting financial evidence that usually turns a strategic story into
              a price-sensitive buy. Public sources still do not disclose revenue, backlog conversion, gross margin,
              burn, or cap-table terms. So the anti-thesis is not that Neros lacks relevance; it is that the valuation
              is ahead of the disclosure. The right framing is therefore evidence-sensitive: Neros may be good, but the
              question is whether enough proof exists to justify paying the current mark today.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
