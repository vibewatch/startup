      - number: '8.5'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several plausible future monetization paths, but none is ready to be underwritten
              aggressively yet. A near-term IPO story is weak because investors still cannot see the core operating data
              that public-market buyers would demand. A later private round is more plausible if Neros can demonstrate
              revenue, margin, and factory proof over the next 12–24 months. A strategic sale is also conceivable
              because larger defense and autonomy players could value domestic production capability, operator
              relationships, and low-cost drone manufacturing assets. But those exit paths depend on the same missing
              package of evidence: real financial statements, backlog conversion, customer concentration detail,
              cap-table structure, and autonomy/compliance documentation. Without that package, investors are
              effectively paying now for diligence they have not yet received. This is exactly why the thesis-break
              triggers and final diligence asks matter so much. The path to upside exists, but it still runs directly
              through evidence that remains private.
