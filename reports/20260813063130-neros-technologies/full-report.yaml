      - number: '8.2'
        title: Financing context supports tracking, not complacency
        blocks:
          - type: paragraph
            body: >-
              The Series C matters because it is both a validation signal and a warning signal. It validates that
              sophisticated investors and defense-aligned capital believe Neros belongs in the top tier of the current
              drone-reindustrialization cycle. But it also means the easy cheap-entry phase is over. At $2.5 billion
              post-money, investors are no longer underwriting a tiny optionality ticket; they are underwriting a
              company that has to convert narrative, demand proof, and factory ambition into durable economics. Compared
              with Red Cat, Neros is already valued above a public small-drone specialist. Compared with Shield AI,
              Anduril, and Skydio, Neros is cheaper in absolute dollars but also less publicly mature on economics and
              platform scale. Compared with public software or govtech leaders like Palantir and Axon, Neros has none of
              the disclosure quality needed to borrow their multiple logic. That is why entry discipline matters so
              much: the right recommendation depends less on whether Neros is impressive than on whether the price
              already assumes too much progress on scale and economics.
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
              - CV013
              - CV019
              - CV021
              - CV022
              - CV033
      - number: '8.3'
        title: Scenarios and comparables bound the valuation range
        blocks:
          - type: paragraph
            body: >-
              Because public Neros economics are incomplete, the best way to reason about valuation is through scenario
              logic plus a mixed comparable set. Public drone and defense comps show a very wide multiple spread. Red
              Cat trades at a venture-like multiple despite much smaller revenue, reflecting scarcity and growth
              optionality. AeroVironment and Kratos trade at more moderate hardware-defense multiples with disclosed
              revenue scale. Axon and Palantir show what much richer public-market premiums look like when investors can
              see strong recurring economics or software-like margins. Private peers reinforce the same lesson in a
              different way: Shield AI, Skydio, and Anduril all command larger valuations, but they also come with more
              disclosed scale, broader platforms, or stronger economic claims. Neros therefore does not need to be
              valued like a public hardware prime, but it also cannot responsibly be valued like a public software
              leader. The range of plausible value is real; the precision is not. That is why the base case clusters
              around modest appreciation, the bull case requires multiple proof upgrades, and the bear case still
              contemplates real down-round risk.
            claimRefs:
