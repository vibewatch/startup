      - number: '5.3'
        title: Deployment maturity, roadmap, and differentiation
        blocks:
          - type: paragraph
            body: >-
              Neros' maturity is uneven in a way that is easy to miss if all products are grouped together. Archer and
              its control stack have the clearest maturity signals: BlueUAS placement, PBAS selection, live-fire
              military use, Gauntlet participation, and current field deliveries all point to a real production product.
              Crossbow Block 2 and Flatbow also look materially real rather than conceptual because outside coverage
              describes current deliveries, retained 25-kilometer control range, ATAK video integration, and operator
              standoff features. Archer Fiber sits one tier below that center of gravity: it appears to have real demos,
              partner validation, and order intake, but its public evidence is still dominated by launch coverage rather
              than broad operational disclosure.


              The newest programs are still roadmap stories. Archer AI is anchored to a short list of publicly claimed
              autonomy features—terminal guidance, GPS-denied position hold, and multi-asset control ambitions—but not
              to released doctrine, validation data, or operational safety cases. Bandit is even earlier. The market
              logic is strong, because low-cost interceptors fit Neros' existing airframe and supply-chain strengths,
              yet the engineering problem is harder than a one-way FPV strike drone and public testing remains sparse.
              The right maturity read is therefore portfolio-weighted: Neros already has a defendable core product
              cluster around Archer/Crossbow, but investors should not underwrite Archer AI or Bandit as
              equivalent-maturity assets simply because they share a brand and manufacturing narrative.
