      - number: '2.3'
        title: Buyer map and adoption funnel
        blocks:
          - type: paragraph
            body: >-
              The buyer map for Neros is layered. For Archer-like systems, the end users are platoons, infantry
              formations, Marines, special operations units, and trainers who want organic precision strike and
              reconnaissance tools at low cost. The actual buyers and payers sit higher up the chain: Army program
              offices, contracting commands, service-level innovation arms, the Marine Corps, SOCOM components, and
              allied defense ministries. Market demand is therefore operationally bottom-up but budgetarily top-down.
              Evidence from PBAS, the Marine Corps order, and South Korea live-fire training shows that user enthusiasm
              matters, but it still has to be translated into approved, verified, and funded procurement channels.


              The adoption path reflected in retained sources runs through operator demand, Blue UAS or similar
              verification, pilot or challenge participation, training and live-fire use, and then larger contracting
              vehicles. DIU's Blue UAS refresh and Replicator work show that the Pentagon is trying to speed up this
              funnel for attritable systems. For Bandit, the most plausible near-term buyers are installation-defense
              and force-protection organizations responding to counter-sUAS priorities, with civilian airports,
              stadiums, and infrastructure owners representing a later adjacency rather than the current core market.
