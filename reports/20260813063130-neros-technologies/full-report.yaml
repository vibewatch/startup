  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Neros usually reaches military users through a sequence of battlefield demand, evaluation, procurement packaging,
      training support, and then broader branch or allied expansion.
    data:
      items:
        - label: Demand signal
          detail: Urgent branch need or coalition wartime requirement emerges from frontline operators or defense ministries
        - label: Evaluation surface
          detail: Competitions, MCADT events, PBAS reviews, BlueUAS pathways, or Drone Dominance gauntlets vet the system
