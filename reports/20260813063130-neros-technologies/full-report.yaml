      - number: '4.4'
        title: Financial verdict, underwriting blockers, and the exact diligence asks
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is directionally positive but still diligence-bound. Public sources prove that Neros
              has meaningful customer traction, large strategic funding, and a coherent military revenue model built on
              drone deliveries plus training and support. They do not prove revenue quality, gross margin durability,
              backlog conversion, customer concentration, or free-cash-flow trajectory. The company should therefore be
              underwritten like a hardware-and-defense-production business whose key metrics are delivered units,
              backlog conversion, fill rate, inventory turns, training attach rate, warranty burden, and working-capital
              burn—not like a high gross-margin software platform.

              The main diligence blocker is that nearly every decisive metric remains private. Without recognized
              revenue, order cadence, cash balance, burn, and margin bridges by program, investors cannot tell whether
              the current financing is comfortably sufficient or merely the next step in a capital- intensive race. The
              public record establishes that Neros may become a very important defense manufacturer; it does not yet
              establish whether that importance converts cleanly into attractive private economics.
