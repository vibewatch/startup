  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation
        blocks:
          - type: paragraph
            body: >-
              Neros is not selling into a broad commercial drone market. The retained record shows a tightly
              concentrated government and coalition customer base where buyer, payer, and user are often different
              institutions. The U.S. Army is the clearest scale customer through PBAS and the later $500 million IDIQ;
              the U.S. Marine Corps is the clearest named training-and-fielding customer through its delivery order,
              MCADT institutionalization, and live-fire adoption; Ukraine is the clearest wartime end user through
              coalition-funded deliveries; and the UK appears as both a coalition conduit and an emerging
              sovereign-manufacturing customer footprint. Public sources also point to U.S. Special Operations Command
              usage, but that proof is materially thinner than the Army and Marine evidence.


              This matters because Neros' customer logic is closer to defense-platform selling than to ordinary hardware
              distribution. Programs are won through coalition funds, branch competitions, BlueUAS-qualified procurement
              pathways, and training organizations that translate battlefield lessons into doctrine. That means customer
              segmentation must distinguish who writes the check, who runs the procurement, and who actually flies the
              systems. For Neros, those layers frequently separate: coalition funds support Ukraine, service programs
              structure Army purchases, MCADT and Warfighting Lab organizations shape Marine uptake, and newly announced
              UK localization tries to convert coalition participation into a longer-duration allied manufacturing and
              procurement relationship.
