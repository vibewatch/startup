      - number: '2.4'
        title: Growth drivers, constraints, and what matters for Neros
        blocks:
          - type: paragraph
            body: >-
              The strongest drivers behind Neros' market are battlefield-proven demand for attritable mass, U.S. and
              allied urgency after Ukraine and Middle East drone campaigns, and defense budget lines that increasingly
              treat unmanned systems and counter-UAS as standard equipment rather than experiments. StartUs' budget
              synthesis and DIU's Replicator language both point in the same direction: the Pentagon wants scale, lower
              cost, and faster iteration. Counter-UAS is also growing quickly because low-cost threats now touch bases,
              borders, ports, public venues, and critical infrastructure.


              The constraints are just as important. C-UAS buyers still run into legal limits on jamming and active
              defeat; Soldier Systems flags open-architecture and interface-standard gaps in PBAS; and military-drone
              market studies repeatedly warn about export controls, cybersecurity, ethical debates around autonomy, and
              supply-chain bottlenecks. Price pressure is especially acute in Neros' category because the closer a
              system is to expendable battlefield use, the less room there is for exquisite margins. The investment
              conclusion is that Neros is exposed to a very attractive market, but it will win only if it can combine
              domestic manufacturing credibility, price discipline, interoperability, and operator pull inside concrete
              procurement programs rather than relying on global drone-TAM rhetoric.
