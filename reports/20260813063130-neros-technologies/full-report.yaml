    rows:
      - - Recognized revenue by quarter and by customer class
        - Prevents underwriting of actual growth and seasonality
        - Request quarterly revenue bridge split across Army, Marines, Ukraine/allies, and services
      - - Backlog and task-order cadence
        - Ceiling contracts can be mistaken for secured revenue
        - Request order book, funded backlog, unfilled orders, and cancellation history
      - - Gross margin by product family
        - Impossible to know whether low-cost drones create attractive economics
        - Request BOM trend, factory absorption, field support burden, and gross margin by program
      - - Cash balance and monthly burn
        - Runway and next-round risk remain opaque
        - Request cash, restricted cash, debt, and 12- to 24-month burn scenarios
      - - Inventory and working-capital turns
        - Manufacturing scale may consume capital faster than expected
        - Request inventory aging, prepaid inventory, supplier terms, and receivable days
      - - Customer concentration and reorder rate
        - Revenue quality depends on repeat procurement, not only pilot wins
        - Request top-customer shares, reorder cadence, and cohort-style program tracking
      - - Warranty / failure cost
        - Field reliability can destroy hardware margins
        - Request reserve policy, field-return data, and remediation expense history
