  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: realized-pricing-and-support-economics
      missingEvidence: Public sources do not disclose realized unit pricing, support burden, gross margins, or discounting for Neros or most peers.
      whyItMatters: Competitive advantage in attritable drones depends on true delivered cost, not only on contract headlines or fundraising.
      diligencePath: Request program-by-program pricing, hardware BOM trends, warranty burden, support staffing, and realized gross-margin data from management.
      relatedQuestionRefs:
        - QP015
        - QP024
      relatedTableRefs:
        - TP003
    - type: missing-source
      severity: minor
      topic: TP002 capability matrix unsupported cells
      missingEvidence: Several cells in TP002 remain directional or unknown because retained public sources do not provide clean comparable data for Anduril's exact low-cost strike fit or Firestorm's fielded product performance.
      whyItMatters: The matrix is useful for strategic pattern recognition, but not every competitor publishes enough detail for strict apples-to-apples scoring.
      diligencePath: Seek product briefings, direct demos, RFI responses, and program-office feedback for the under-documented peers.
      relatedTableRefs:
        - TP002
    - type: missing-source
      severity: minor
      topic: TP003 pricing / packaging comparison completeness
      missingEvidence: TP003 is intentionally partial because most retained sources disclose contract values or bundle components, not list price or realized per-air-vehicle price.
      whyItMatters: Investors can otherwise overstate or understate how much of Neros's apparent advantage comes from hardware cost versus bundle design.
      diligencePath: Request quote sheets, proposal templates, and customer pricing examples for Neros and the closest peers.
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: head-to-head-win-rates-and-reorder-patterns
      missingEvidence: The public record does not reveal Neros's true win rates, loss reasons, or reorder cadence against Red Cat, AV, Shield AI, or counter-UAS specialists.
      whyItMatters: A credible competitive map still does not prove repeatable share capture without actual pipeline and renewal data.
      diligencePath: Ask for named-opportunity pipeline, bid history, loss analysis, reorder behavior, and customer reference calls broken out by product line.
      relatedQuestionRefs:
        - QP019
        - QP025
