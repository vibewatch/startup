  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Evidence
      - Mitigation / diligence ask
    rows:
      - - Domestic manufacturing and trusted sourcing
        - Other U.S. suppliers now tell the same story and foreign substitutes face FCC limits
        - Medium
        - Red Cat, Skydio, Shield, and AV all market U.S.-trusted or defense-compliant supply positions
        - Ask for Neros's actual component-sourcing edge, not just branding
      - - Low-cost attritable scale
        - Drone Dominance explicitly pressures vendors toward lower prices and higher volume
        - High
        - War.gov and DroneXL both emphasize cost compression and speed
        - Request manufacturing cost curve, defect rates, and delivery cadence
      - - Counter-UAS differentiation through Bandit
        - Buyers may prefer layered detect-track-jam bundles from DroneShield or Dedrone
        - High
        - Counter-UAS specialists sell full-stack systems and fielded kits today
        - Validate where Bandit beats a full-stack alternative in cost or response time
      - - Tactical-unit product fit
        - Red Cat already has Army program-of-record status and family breadth
        - High
        - Black Widow program status plus FANG and WEB create direct procurement gravity
        - Request documented Neros head-to-head outcomes and reorder evidence
      - - Software and autonomy moat
        - Shield AI and Anduril can outspend Neros on autonomy, simulation, and ecosystem tooling
        - Medium-High
        - Shield financing and Hivemind proof show deeper software investment capacity
        - Determine whether Neros needs software parity or only mission-fit sufficiency
      - - Interoperability and control simplicity
        - Multi-vendor fleets can become fragmented and costly to operate
        - Medium
        - DroneXL explicitly warns about incompatible drone ecosystems after Gauntlet
        - Verify Neros control-stack compatibility, payload interfaces, and training burden
      - - Capital sufficiency
        - Better-capitalized peers can tolerate longer procurement cycles and faster iteration
        - Medium-High
        - Anduril and Shield raised orders of magnitude more capital in 2026 than Neros
        - Ask for runway, burn, and competitive-response budget under scale scenarios
    notes: >-
      The risk register tests whether Neros's claimed moat survives contact with
      program proof, full-stack bundles, software depth, and procurement gravity.
