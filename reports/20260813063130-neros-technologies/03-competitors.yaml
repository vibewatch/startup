  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Company
      - Public price or contract model
      - Included capabilities
      - Unknowns / discount opacity
      - Implication
    rows:
      - - Neros
        - Contract-driven military sales; realized pricing undisclosed
        - Archer systems, training, support, and Bandit concept expansion
        - No public realized unit price, gross margin, or bundle structure
        - Investors cannot yet tell whether Neros wins on true cost or only on narrative
      - - Red Cat
        - Program-of-record and system-family sales; unit price undisclosed
        - Black Widow, FANG, WEB, ATAK-linked control, support
        - No public list-versus-realized pricing or support burden
        - Bundle breadth may improve win rates even if airframe pricing is similar
      - - Firestorm Labs
        - Platform and expeditionary-manufacturing model; commercial terms undisclosed
        - xCell field-manufacturing system plus drone production capacity
        - No public per-unit drone economics
        - Could compete by changing the production model rather than airframe price alone
      - - AeroVironment
        - IDIQ and delivery-order model; $186M order disclosed, unit pricing not
        - Switchblade air vehicles, payloads, controls, training, sustainment
        - Per-munition realized pricing undisclosed
        - Buyers may pay more for procurement certainty and lethality proof
      - - Shield AI
        - Platform plus autonomy-software and services model; pricing undisclosed
        - V-BAT aircraft, Hivemind autonomy, maritime ISR features
        - No public software attach rate or aircraft price
        - Hard to compare directly to expendable-drone unit economics
      - - Anduril
        - System-contract model; product-level price transparency low
        - Counter-UAS, autonomy, and broader defense-system bundles
        - No public apples-to-apples airframe or interceptor pricing in retained sources
        - Anduril can compete through bundle power even when unit prices are opaque
      - - DroneShield
        - Mobile and fixed-site contract bundles; hardware, subscriptions, warranties, services
        - End-to-end counter-drone system plus third-party integrations
        - Unit economics by site, sensor, or jammer not public
        - Bandit may be compared against a broader managed-service-style spend envelope
      - - Dedrone
        - Platform-plus-sensor-plus-mitigation model; public pricing absent
        - DedroneTracker.AI, sensors, jammers, expeditionary kits
        - No public customer-specific pricing
        - Counter-UAS buyers may evaluate Bandit as one module inside a broader stack
    notes: >-
      Public pricing remains materially incomplete across the whole peer set.
      Contract values and bundles are visible more often than realized unit price.
