  - id: distribution-lock-in-and-switching-costs
    title: Distribution power, switching costs, and what buyers actually buy
    body: >-
      Public evidence suggests Neros's real problem is not feature parity alone;
      it is distribution and procurement gravity. Red Cat already has Army SRR
      program-of-record status. AeroVironment has a five-year Army IDIQ and large
      delivery orders. Shield AI has Coast Guard, Navy, Marine, and Ukraine proof
      tied to a reusable aircraft plus autonomy layer. DroneShield sells complete
      hardware, subscription, warranty, and service bundles, while Dedrone sells
      sensor-fusion command-and-control tied to jammers and expeditionary kits.
      These vendors are not just selling airframes. They are selling validated
      workflows, training, sustainment, and trust.

      That creates real switching costs. Buyers get locked into common control
      systems, integration with ATAK or similar environments, trained operators,
      established sustainment chains, and battle-tested electronic-warfare
      performance. For Neros, that means the next stage of competition is not
      simply getting Archer or Bandit to work; it is proving that units can adopt
      them without paying a hidden tax in retraining, integration, or fleet
      fragmentation. DroneXL's warning about a potential “Frankenstein fleet” is
      especially relevant here: low-cost drones can still lose if their ecosystem
      imposes too much operational complexity.
    claimRefs:
      - CP004
      - CP007
      - CP010
      - CP014
      - CP016
      - CP019
      - CP023
      - CP024
      - CP025
      - CP026
      - CP029
      - CP034
      - CP037
    tableRefs:
      - TP003
    figureRefs:
      - FP003
  - id: moat-durability-and-investment-takeaway
    title: Moat durability, commoditization risk, and the investment takeaway
    body: >-
      Neros's strongest moat claim is not software depth or program breadth. It
      is that the Pentagon increasingly wants domestic, low-cost drones in very
      large quantities, and Neros is explicitly organized around that thesis.
      The same public evidence that supports the bull case also limits it. The
      Drone Dominance program signals falling unit prices, rising volume
      expectations, and harsh operational selection pressure. That environment can
      reward Neros if it manufactures reliably and cheaply, but it can also turn
      the category into a brutal commoditization contest where capitalized players
      with better channels or bundled systems take share.

      The investment conclusion is therefore mixed but useful. Neros looks
      strongest against foreign status-quo substitutes and against smaller peers
      that lack a domestic-manufacturing story. It looks least insulated against
      Red Cat in tactical small-UAS, AeroVironment in proven loitering munitions,
      Shield AI in autonomy-heavy premium programs, and DroneShield or Dedrone in
      layered counter-UAS procurement. For underwriting, the key diligence issue
      is whether Neros can convert its domestic-mass narrative into repeat wins
      before better-capitalized ecosystems define the standards, data layers, and
      sustainment relationships of the category.
    claimRefs:
      - CP003
      - CP011
      - CP014
      - CP019
      - CP030
      - CP031
      - CP033
      - CP035
      - CP036
      - CP038
