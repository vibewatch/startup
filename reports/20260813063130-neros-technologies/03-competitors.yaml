    rows:
      - - Neros
        - Direct
        - $250M Series C at $2.5B valuation
        - Low-cost attritable strike drones plus Bandit interceptor
        - Domestic mass-production narrative and focus on expendable effects
        - Less disclosed program breadth and software depth than larger peers
      - - Red Cat / Teal
        - Direct
        - Public company with Army SRR program-of-record win
        - Small ISR + precision-effects kits for Army and allied users
        - Black Widow, FANG, WEB, and ATAK-linked family breadth
        - Public per-unit economics still undisclosed
      - - Firestorm Labs
        - Direct / emerging
        - $82M Series B; $153M total funding; Gauntlet participant
        - Attritable-drone and expeditionary-manufacturing buyers
        - xCell manufacturing-at-the-edge proposition
        - Less public fielded product proof than Red Cat or AV
      - - AeroVironment
        - Incumbent substitute
        - Public incumbent with $990M Army IDIQ and $186M 2026 order
        - Precision loitering-munition buyers across Army and allies
        - Combat-proven lethality, range, and procurement maturity
        - Higher-spec category than lowest-cost FPV attritable drones
      - - Shield AI
        - Adjacent / upmarket
        - $2B 2026 financing at $12.7B valuation
        - Maritime ISR, autonomy-heavy defense aviation, future strike
        - Hivemind autonomy and V-BAT maritime proof
        - Broader and more premium than Neros's current wedge
      - - Anduril
        - Adjacent / scale threat
        - $5B 2026 raise at $61B valuation
        - Counter-UAS, autonomy, defense-system modernization programs
        - Capital, manufacturing, and broad platform leverage
        - Not a clean direct FPV peer, so overlap is selective
      - - Skydio
        - Adjacent substitute
        - Domestic NDAA-compliant ISR platform with defense focus
        - ISR, mapping, and GPS-denied small-UAS missions
        - Open modular architecture, autonomy, and recoverable platform economics
        - Less aligned with expendable strike doctrine
      - - DroneShield
        - Bandit substitute
        - Public counter-drone vendor with $24.9M JIATF-401 award
        - Military, government, and infrastructure counter-UAS buyers
        - Layered fixed-site and mobile counter-drone bundles
        - Focuses on broader stack rather than interceptor airframe alone
      - - Dedrone
        - Bandit substitute
        - Large government footprint and Ukraine field proof
        - Government and military counter-UAS command-and-control buyers
        - Sensor fusion, jamming, and fielded expeditionary kits
        - Less evidence of its own interceptor-drone product than Bandit's concept
    notes: >-
      The profile table separates true direct strike-drone peers from adjacent
      autonomy, loitering-munition, ISR, and counter-UAS alternatives that can
      still win the same budget.
