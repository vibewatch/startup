company:
  name: Neros Technologies
chapter:
  number: 3
  title: Competitors
  summary: >-
    Neros competes in two adjacent but different arenas: low-cost domestic
    attritable strike drones and counter-UAS response. Its closest direct public
    peer is Red Cat on small-unit tactical drones, while AeroVironment,
    Shield AI, Anduril, Skydio, DroneShield, and Dedrone pressure it from
    loitering munitions, autonomy software, ISR, and layered counter-drone
    systems. The competitive takeaway is that Neros is best positioned where
    buyers value cheap domestic mass and fast fielding, but weaker where the
    buyer wants broader software ecosystems, maritime proof, or fully layered
    counter-UAS stacks.
sections:
  - id: direct-and-adjacent-landscape
    title: Direct peers, adjacent platforms, and status-quo substitutes
    body: >-
      Neros does not face one clean competitor set. Its Archer family sits in
      the low-cost attritable strike and tactical-small-UAS lane, where the most
      relevant public peers are Red Cat/Teal, Firestorm, and other Gauntlet-I
      entrants being evaluated for cheap one-way attack drones at scale. That is
      a different arena from the one occupied by Shield AI, Anduril, and even
      AeroVironment, which sell broader autonomy stacks, higher-end aircraft, or
      more mature loitering-munition families. At the same time, Bandit pushes
      Neros into a second contest against counter-UAS specialists such as
      DroneShield and Dedrone, where buyers may prefer layered detect-track-jam
      systems instead of drone-on-drone interceptors.

      The status quo also matters. Foreign-produced drones historically filled
      many low-end use cases, but the FCC's 2025 Covered List action against
      foreign-produced UAS and critical components materially improves the policy
      backdrop for U.S.-made alternatives. That does not remove price pressure;
      it simply means Neros now competes less against unrestricted Chinese import
      options and more against domestic suppliers that can satisfy security,
      sourcing, and program-office trust requirements.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP010
      - CP027
      - CP031
      - CP036
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: capability-overlap-and-mission-fit
    title: Capability overlap, mission fit, and where Neros is not the same product
    body: >-
      The most direct apples-to-apples threat to Neros on the strike-drone side
      is Red Cat. Black Widow and FANG are aimed at the same broad Army and
      tactical-unit buyer set and already come with Army program-of-record proof,
      ATAK-linked control, GPS-compromised navigation work with Palantir, and a
      disclosed path to production volume. AeroVironment is also a real threat,
      but in a more mature loitering-munition category: Switchblade 300 Block 20
      offers longer reach, proven lethality, and large Army delivery orders,
      which makes it stronger for higher-confidence precision effects but not
      necessarily for the lowest-cost expendable mission that Neros targets.

      Shield AI, Anduril, and Skydio are adjacent rather than identical. Shield's
      Hivemind and V-BAT show far deeper autonomy and maritime proof than Neros,
      while Skydio is more recoverable ISR and open-platform software than cheap
      expendable strike. Anduril matters because it can use scale, manufacturing,
      and counter-UAS adjacency to compress weaker startups even without matching
      every Neros mission one-for-one. That distinction matters: Neros is not
      trying to beat every vendor at everything; it is trying to win the narrow
      zone where low unit cost, domestic supply, and operator-ready strike kits
      matter most.
    claimRefs:
      - CP006
      - CP007
      - CP008
      - CP009
