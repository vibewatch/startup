  - type: missing-source
    severity: material
    topic: neros-specific-sam-quantification
    missingEvidence: A program-by-program market map showing the dollar value of tactical strike-drone and counter-UAS budgets that Neros can realistically pursue.
    whyItMatters: Broad military-drone TAMs are too loose to support a serious underwriting case for Neros' specific product mix.
    diligencePath: Build a bottoms-up procurement model from service budget books, active solicitations, and allied program announcements rather than from generic market reports.
