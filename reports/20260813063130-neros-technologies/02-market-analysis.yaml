company:
  name: Neros Technologies
chapter:
  number: 2
  title: Market Analysis
  summary: 'Neros sits inside a narrower market than broad military-drone headlines imply: its core wedge is low-cost attritable strike drones and adjacent counter-UAS interceptors procured through tactical, force-protection, and allied-defense budgets. Market reports support large category growth in both military drones and counter-UAS, but the real commercial takeaway is that Neros wins only where operator demand, Blue UAS/Replicator-style acceleration, price pressure, and open-architecture constraints all line up inside specific U.S. and allied procurement programs.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, adjacencies, and the real Neros wedge
  body: 'The easiest mistake in analyzing Neros is to equate it with the entire military-drone economy. Neros does not compete across the full span of unmanned aviation. Its present market sits in a much narrower slice: low-cost, attritable, short-range strike drones such as Archer and Archer Strike, plus the emerging counter-UAS interceptor category represented by Bandit. That wedge is closer to expendable tactical munitions, force-protection tools, and small-unit reconnaissance/strike kits than to the large fixed-wing UCAV, MALE, or HALE platforms that dominate many global drone-market reports.


    The relevant status quo substitutes are therefore not just other drone startups. For Archer-like systems, the practical substitutes include mortars, grenade or rocket effects delivered by human operators, loitering munitions, ISR quadcopters adapted for one-way attack, and other low-cost FPV systems. For Bandit, the substitutes include jammers, kinetic interceptors, base-defense radars, and layered counter-UAS stacks. This boundary matters because it keeps Neros'' addressable market tied to rapidly replenished tactical demand and force-protection spending, not to the whole budget for unmanned aviation or aerospace modernization.'
