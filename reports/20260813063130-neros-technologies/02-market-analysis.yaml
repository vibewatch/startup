- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Ukraine and Middle East combat lessons
    - Positive
    - Current
    - Battlefield proof makes attritable mass and counter-drone defense hard to treat as optional research projects
    - Which Neros demand signals are repeat orders versus urgency spikes tied to current conflicts?
  - - Replicator, Blue UAS, and rapid acquisition pressure
    - Positive
    - Current to near-term
    - Creates faster pathways for validated low-cost systems to reach operators
    - How much of the pipeline depends on special acceleration paths rather than enduring programs of record?
  - - Army small-UAS institutionalization
    - Positive
    - FY2026 onward
    - Turns tactical drones into recurring equipment lines rather than one-off experiments
    - Which budget lines are recurring and which are pilot or contingency-funded?
  - - Counter-UAS expansion beyond military bases
    - Positive
    - Current to medium-term
    - Broadens the Bandit opportunity set toward ports, airports, venues, and critical infrastructure
    - Is Neros building the compliance, sales, and integration stack needed for non-DoD buyers?
  - - Jamming and active-defeat legal restrictions
    - Negative
    - Current
    - Limits full-stack C-UAS adoption for many civilian or non-federal buyers
    - Which parts of Bandit's concept rely on authorities Neros does not yet have in civilian contexts?
  - - Open-architecture and interoperability gaps
    - Negative
    - Current
    - Missing interface standards can slow scale and trap buyers in fragmented payload and component stacks
    - What PBAS, Blue UAS, or MOSA standards will Neros have to satisfy to keep scale buyers comfortable?
  - - Price pressure on attritable systems
    - Negative
    - Persistent
    - Vendors must hit low unit economics or risk losing the core expendable-drone mission set
    - Can Neros hold domestic-content credibility while converging toward Army-like cost targets?
  - - Export-control, cyber, and autonomy-governance friction
    - Negative
    - Persistent
    - International scaling and advanced autonomy can be delayed by policy or compliance drag
    - Which target allied markets are easiest to serve without creating new compliance bottlenecks?
  notes: The main risk is not lack of strategic demand. It is whether budget authority, legal authorities, open architecture, and cost curves evolve quickly enough for Neros to convert urgency into repeatable procurement.
