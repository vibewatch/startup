- id: sizing-lenses-and-sam
  title: 'Sizing lenses: large TAMs, conflicting definitions, and a narrower SAM'
  body: 'Published market-size estimates do confirm that Neros sells into a real growth market, but they also show how easily broad TAMs can be misused. On the offensive-drone side, Research and Markets pegs the 2026 defense-drone market at $13.73 billion, Mordor sizes the 2026 UCAV market at $16.69 billion, and Fortune Business Insights places the broader military-drone market at $22.49 billion. On the defensive side, Mordor values the 2026 anti-drone market at $2.47 billion, while Fortune gives the 2026 counter-UAS market a much larger $14.41 billion figure. Those numbers are not false; they are simply built from different market definitions, end-user cuts, and product baskets.


    For Neros, the correct lesson is not to pick the biggest number. The company''s practical SAM is narrower than any of the headline global estimates because it depends on small tactical attack-drone budgets, force-protection and counter-UAS lines, and procurement programs willing to buy in munition-like volumes. The best public bottom-up anchor is therefore not a global industry TAM but U.S. defense budget and program evidence such as the FY2026 Army small-UAS request and the cost/volume logic embedded in PBAS, Replicator, and Blue UAS-linked adoption paths.'
