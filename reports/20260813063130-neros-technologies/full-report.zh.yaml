      - number: '4.4'
        title: 财务结论、承销阻碍和精确尽调清单
        blocks:
          - type: paragraph
            body: >-
              财务结论方向为正，但仍受尽调约束。公开来源证明 Neros
              有有意义的客户牵引、重大战略融资，以及建立在无人机交付加培训和支持之上的连贯军方收入模型。公开来源没有证明收入质量、毛利率耐久性、积压订单转化、客户集中度或自由现金流轨迹。因此，公司应被当作硬件与防务生产企业来承销，关键指标是已交付单位、积压订单转化、履约率、库存周转、培训附着率、保修负担和营运资本消耗，而不是高毛利软件平台。

              主要尽调阻碍是，几乎所有决定性指标仍为私有。没有已确认收入、订单节奏、现金余额、烧钱速度和按项目拆分的利润率桥，投资者无法判断当前融资是绰绰有余，还是资本密集竞赛中的下一步。公开记录证明 Neros
              可能成为很重要的防务制造商；它尚未证明这种重要性可以干净地转化为有吸引力的私营经济性。
