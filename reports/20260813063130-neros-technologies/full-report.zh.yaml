      - number: '4.2'
        title: 成本结构、产出爬坡和来自公开可比公司的单位经济代理
        blocks:
          - type: paragraph
            body: >-
              Neros 正试图解一道很难的制造方程：以军用品质、大幅高于美国供应商历史产量的数量，交付低成本无人机。公开证据表明，公司在能够展示成熟经济性之前，就已经为这轮爬坡投入资金。Project Millennium
              把工厂本身描述为「终极产品」，招聘页面显示，公司正在招聘供应链规划、制造系统、自主能力、财务和招聘等岗位。Defense News 和 JOBSwithDOD 指向当前每月约 1,500 架 Archer
              的产量，并以 2026 年底每月 10,000 架为目标，2028 年目标是一年一百万架。这些产出雄心通常需要重大库存、人力、工装、测试和营运资本投入。

              公开同业展示了可能出错的地方，也展示了更好规模可能长什么样。Red Cat 的 2025 10-K 是最相关的小型无人机代理：收入显著上升，但毛利只有
              3%，经营性现金消耗仍然很大，管理层明确把低毛利归因于产能利用不足。相比之下，AeroVironment 展示了成熟规模和积压订单的样子；但即便是它，在服务结构和收购摊销上升时也出现了毛利率稀释。Neros
              的公开记录无法让我们直接计算毛利率或现金转化，但强烈暗示，在产量和交付量正常化之前，早期利润率可能承压。
