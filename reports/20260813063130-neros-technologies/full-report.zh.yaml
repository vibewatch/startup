      - number: '7.3'
        title: 运营、质量和供应链风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Neros
              需要同时啃下两件难事：把极高产能目标工业化，同时在对抗环境里守住可接受的技术性能。生产端证据令人鼓舞，但还不完整。公开材料显示，公司有认真做制造的意图、有明确命名的工厂项目，也坚持国内或友好国家采购。公开材料没有给出经审计产量、节拍数据、良率、返工、供应商冗余，或完整
              BOM 可追溯性。这一点重要，因为 CSIS 和 RUSI 都认为，无人机规模化恰恰取决于电池、磁体、半导体、复合材料、传感器这些上游卡点仍很深的部件。产品端，Neros 显然在用 Archer Fiber
              和其他设计选择处理电子战与通信风险，但公开记录仍没有披露故障率、中止率、事故或现场可靠性。公司实际表现可能很好，尽调难点在于，外部投资者无法验证机队在持续作战压力下到底有多稳。因此，本章中，制造爬坡和供应链可追溯性风险高于单纯的产品概念风险。
