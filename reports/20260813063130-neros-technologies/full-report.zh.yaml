  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - 乌克兰和中东实战经验
        - 正向
        - 当前
        - 战场验证让可消耗规模化和反无人机防御很难再被当作可选研究项目
        - Neros 的需求信号中，哪些是重复订单，哪些只是当前冲突带来的紧急峰值？
      - - Replicator、Blue UAS 与快速采办压力
        - 正向
        - 当前至近期
        - 经过验证的低成本系统能更快到达一线操作员
        - 管线中有多大比例依赖特殊加速通道，而不是持久的正式项目？
      - - Army 小型 UAS 制度化
        - 正向
        - FY2026 起
        - 战术无人机从一次性试验变成可反复采购的装备线
        - 哪些预算科目可持续复现，哪些只是试点或应急资金？
      - - 反 UAS 扩展到军事基地之外
        - 正向
        - 当前至中期
        - Bandit 的机会集扩展到港口、机场、场馆和关键基础设施
        - Neros 是否在补齐非 DoD 买家所需的合规、销售和集成能力？
      - - 干扰与主动击毁的法律限制
        - 负向
        - 当前
        - 限制许多民用或非联邦买家采用全栈 C-UAS
        - Bandit 概念中哪些部分依赖 Neros 在民用场景尚未取得的授权？
      - - 开放架构与互操作缺口
        - 负向
        - 当前
        - 接口标准缺失会拖慢规模化，也会把买家锁进碎片化的载荷和组件栈
        - Neros 必须满足哪些 PBAS、Blue UAS 或 MOSA 标准，才能让规模买家安心？
      - - 可消耗系统的价格压力
        - 负向
        - 持续
        - 供应商必须把单机经济性打下来，否则可能失去可消耗无人机的核心任务集
        - Neros 在向 Army 式成本目标靠拢时，能否守住国产内容可信度？
      - - 出口管制、网络安全与自主治理摩擦
        - 负向
        - 持续
        - 政策或合规阻力可能拖慢国际扩张和高级自主能力落地
        - 哪些目标盟国市场最容易服务，且不会制造新的合规瓶颈？
    notes: 主要风险不是战略需求不足，而是预算权、法律授权、开放架构和成本曲线能否足够快地演进，让 Neros 把紧迫性转成可重复采购。
