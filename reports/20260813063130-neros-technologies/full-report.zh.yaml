      - number: '7.2'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              Neros 处在防务技术中政治最敏感的区域之一：低成本打击和反 UAS 系统，而且它们正随时间变得更自主。保留的政策记录很重要。DoD Directive 3000.09
              仍把适当人类判断、测试、验证、确认和可控性放在中心；White House NSPM-11 又要求在压缩的 2026 时间线上重新改写。这种组合带来双向风险。更宽松的审查环境可能加快 Neros
              项目，但如果观察者认为防护措施弱化快于测试证据改善，也可能抬高审查。出口管制风险同样真实。Neros 现在公开宣传英国扩张和盟国交付，但保留来源没有披露出口许可历史、商品管辖裁定，或 Archer AI 和
              Bandit 的内部武器审查流程。与此同时，ICRC、Human Rights Watch 和 Just Security 都显示，与自主能力相关的法律和规范审查正在增强，而不是消退。公开记录没有显示 Neros
              遭遇执法事件，但也没有提供足够直接的合规披露，无法把公司在监管或法律上评为低风险。
