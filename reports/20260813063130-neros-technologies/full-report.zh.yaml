  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险严重程度概览
        blocks:
          - type: paragraph
            body: >-
              Neros 已经跨过从概念期防务初创到真实项目参与者的门槛，风险讨论也因此改变。公开记录现在支持真实客户证明、产品宽度和大量资本获取，所以最大风险不再是有没有人想要产品，而是 Neros
              能否扩大制造、维持可追踪的非中国供应链、穿过不断变化的自主能力政策制度，并把少数政府需求信号转成耐久、有预算支持的收入。这些风险还会相互作用。如果 Project Millennium
              滞后，客户集中度会更重要，因为公司容错空间更小；如果 3000.09 收紧或被更谨慎地解释，Archer AI 和 Bandit
              就更难快速部署；如果联盟或军种预算放缓，缺少商业多元化会更明显。最重要的结论是，Neros 在战略上看起来相关，早于在运营上完全去风险化。投资者应把制造、政策和依赖风险视为主要承销关口，而不是假设 Series
              C 已经解决它们。
