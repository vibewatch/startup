  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议来自真实战略证据与不完整财务证据之间的碰撞。
    data:
      nodes:
        - id: a
          label: 真实需求和产品证据
        - id: b
          label: 大体量无人机 / 反无人机市场
        - id: c
          label: 本土生产期权价值
        - id: d
