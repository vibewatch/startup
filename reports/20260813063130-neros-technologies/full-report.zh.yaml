  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、合同机制和公开记录真正证明的东西
        blocks:
          - type: paragraph
            body: >-
              Neros 的公开收入模型在结构上很直接，哪怕数字仍不透明。公司根据军方合同出售 Archer 系列无人机系统，而这些合同包含的不止机体。Army IDIQ 覆盖支持设备、测试、工程支持和培训。Marine
              Corps 交付订单同样把实操培训与系统交付打包。PBAS 材料还显示，Neros 不只出售 Archer 变体，也出售 Flatbow
              等相关控制设备。这意味着收入应被视为产品交付、非经常性工程或集成工作，以及培训 / 支持服务的组合，而不是纯硬件单机销售。

              问题在于转化可见度。公开来源给出了 $500M
              额度上限、数千架已披露订单和反复出现的产能说法，但没有展示已确认收入、递延收入、积压订单或任务订单节奏。因此，本章把额度价值和融资标题视为需求指标，而不是已实现经济性。最关键的反向线索来自 Defense
              News：Neros 的 CEO 表示需求强劲，但尚未持续获得资金和项目办公室支持。这个警告重要，因为防务兴趣可能跑在预算授权前面，而这道缺口正是后期私募承销容易出问题的地方。
