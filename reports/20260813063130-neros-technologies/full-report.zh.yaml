  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 几个缺失变量比边际 TAM 争论更能主导 Neros 的估值分歧。
    data:
      items:
        - label: 收入和毛利率披露
          value: 32
          unit: impact score
        - label: 工厂吞吐量和单位经济性
          value: 29
          unit: impact score
        - label: 客户集中度 / 积压订单转化
          value: 26
          unit: impact score
        - label: 政策 / 出口管制清晰度
          value: 21
          unit: impact score
        - label: 股权结构 / 优先权透明度
          value: 18
          unit: impact score
    approximationNotes: 序数式影响条，不是回归模型。它们排序的是哪些尽调结果最能推动估值变化。
