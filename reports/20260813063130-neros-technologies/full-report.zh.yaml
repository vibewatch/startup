      - number: '1.2'
        title: 创始人、领导层和治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人与市场的匹配，是 Neros 最清晰的优势之一。多份保留来源都把 Soren Monroe-Anderson 和 Olaf Hichwa 描述为来自竞技 FPV
              无人机文化的创始人，而不是传统防务主承包商背景。Defense News 称 Monroe-Anderson 是年轻无人机赛车手转型武器制造者；Wikipedia
              和后续报道则把两位创始人刻画成直接从乌克兰战场用例中学习、再把经验规模化成正式公司的实践者。这样的起点解释了公司为什么强调快速迭代、战场反馈闭环和成本纪律。


              短板在于治理不透明。公开来源清楚标出 Monroe-Anderson 是 CEO，一些二级报道也称 Hichwa 为 CTO、Sean Wood 为 COO；但董事会、控制权、委员会结构，以及 Series C
              后投资者是否拥有特殊治理保护，都缺少容易取得的公开细节。对后期私营防务初创来说，这是真实的尽调缺口。公司看起来由执行牵引、创始人驱动，在战时采购周期中可能是竞争资产；但这也意味着关键人依赖显著，外部很难看清资本强度上升后，战略决策如何受到制衡。
