        title: 采用轨迹和具名客户证明
        blocks:
          - type: paragraph
            body: >-
              对这么年轻的防务制造商来说，Neros 的客户采用曲线异常快。到 2025 年底，公司已经披露 Marine Corps 采购和 Army PBAS 入选。到 2026 年初，面向 Army
              的证明从入选推进到交付，DroneXL 和 A-Drones 报道了早期 PBAS 履约和 Archer Block 2 部署。到 2026 年中，War Department 邀请 Neros 进入 Drone
              Dominance Phase I，军种层面的野战证据又通过 Army 和 Marine 在韩国的实弹训练进一步扩大。这不是老牌主承包商那种干净的多年正式采办项目成熟度，但明显不只是客户 logo 墙证据。


              各细分市场中，最强单个客户证明点不同。对 Army 来说，从 PBAS 供应商，到提前交付，再到五年期 IDIQ 额度，是最好的生产级证明。对 Marines 来说，证明更偏运营和制度化：Neros
              拥有包含培训的数百万美元交付订单，同时 Corps 组建专门攻击无人机团队，并把系统带入训练和竞赛。对乌克兰来说，证据在数量和紧迫性上最强，而非披露深度：Defense News 描述了 6,000 架无人机的
              International Drone Coalition 授标，并称 Neros 当时的大部分产出流向那里。对 SOCOM
              和更广盟国需求来说，证明可信但归因不一样充分，所以下方具名客户矩阵区分了强公开证明和可能但更薄的证据。
