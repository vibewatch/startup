        - from: ramp
          to: fielding
          label: 交付延误
        - from: supply
          to: margin
          label: 成本飙升 / 重新设计
        - from: budget
          to: conversion
          label: 订单推迟
        - from: fielding
          to: conversion
          label: 客户信心减弱
        - from: conversion
