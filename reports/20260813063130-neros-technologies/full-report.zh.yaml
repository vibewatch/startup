      - number: '2.3'
        title: 买方地图和采用漏斗
        blocks:
          - type: paragraph
            body: >-
              Neros 的买方地图是分层的。对 Archer
              类系统来说，终端用户是排级单位、步兵编队、Marines、特种作战单位和训练人员，他们想要低成本的有机精确打击和侦察工具。真正的购买方和付款方在链条更上方：Army
              项目办公室、合同司令部、军种级创新部门、Marine Corps、SOCOM 组件和盟国国防部。因此，市场需求在作战上自下而上，在预算上却自上而下。PBAS、Marine Corps
              订单和韩国实弹训练证明用户热情重要，但它仍必须转化为获批、经验证且有资金支持的采购渠道。


              保留来源反映的采用路径，依次经过操作员需求、Blue UAS 或类似验证、试点或挑战赛参与、培训和实弹使用，之后才进入更大的合同工具。DIU 的 Blue UAS 刷新和 Replicator
              工作表明，Pentagon 正试图加快可消耗系统的这条漏斗。对 Bandit 来说，近期最可能的买方是应对反小型 UAS
              优先事项的基地防御和部队防护组织；民用机场、体育场和基础设施业主更像后续相邻市场，而非当前核心市场。
