        - $61B 私募估值
        - 防务自主制造的上限基准
        - 范围和规模远大于 Neros
      - - Skydio
        - 2026 年 Series F
        - $4.4B 私募估值，并声称收入达数亿美元
        - 对披露单位经济性和产能叙事有用的私募可比
        - 客户组合和产品架构不同
      - - Red Cat
        - 2025 年收入 $40.7M；市值 ~$1.57B
        - ~38.6x 收入
        - 最好的小型上市军用无人机代理标的
        - 上市微盘股波动会扭曲干净可比性
      - - AeroVironment
        - FY2026 收入 $1.9768B；市值 ~$9.8B
        - ~5.0x 收入
        - 成熟上市无人机 / 巡飞弹基准
        - 积压订单、规模和披露成熟得多
      - - Kratos
        - 2025 年收入 $1.3468B；市值 ~$11.98B
        - ~8.9x 收入
        - 更宽泛的防务系统硬件基准
        - 不是直接的低成本无人机纯标的
      - - Axon
        - 2025 年收入 $2.8B；市值 ~$48.72B
        - ~17.4x 收入
        - 政府科技经常性收入基准
        - 软件占比更高，公开财务质量更好
    notes: 可比组合有意混合私有和上市公司，因为没有单一上市可比公司能干净映射 Neros。 Palantir 在正文中仍作为上限软件溢价参照，而不是直接同业行。
