      - number: '8.5'
        title: 退出准备度与最后尽调清单
        blocks:
          - type: paragraph
            body: >-
              公开证据支持几条可能的未来变现路径，但没有一条已经适合激进承销。近期 IPO 故事偏弱，因为投资人仍看不到公开市场买方会要求的核心运营数据。如果 Neros 能在未来 12–24
              个月证明收入、利润率和工厂执行，后续私募轮更可行。战略出售也可以想象，因为更大的防务和自主系统玩家可能看重本土生产能力、操作人员关系和低成本无人机制造资产。但这些退出路径都依赖同一组缺失证据：真实财务报表、积压订单转化、客户集中度细节、股权结构和自主
              / 合规文件。缺少这组证据时，投资人等于现在就为一份尚未收到的尽调买单。这正是命题失效触发条件和最后尽调问题如此重要的原因。上行路径存在，但它仍然直接穿过那些还未公开的证据。
