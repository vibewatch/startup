  - id: TV005
    title: 投资逻辑失效与否决触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Project Millennium 滑坡
        - 投产或吞吐明显落空，削弱规模叙事
        - 同时削弱牛市情景产能和资本效率信心
        - 暂停，或向下重置估值框架
      - - 需求转化放缓
        - 陆军 / 联盟 / 盟国采购节奏相对当前叙事停滞
        - 客户证据从耐久增长信号变成一次性需求信号
        - 下调回报预期，并提高下行情景权重
      - - 政策 / 合规收紧
        - 3000.09 解读、出口管制摩擦，或法律问题实质性压窄 Neros 式用例
        - 削弱自主化上行空间，并放慢盟友扩张
        - 重新测算路线图，并把建议调向回避
      - - 经济披露没有进展
        - 管理层无法在下一次融资决策前提供收入、毛利率、待交付订单和股权结构资料包
        - 私募市场价格下，无法做出有纪律的测算
        - 只维持观察 / 继续研究
      - - 创始人或管理梯队出现断层
        - 规模化阶段出现领导层变动，但看不到足够的继任深度
        - 在最不该脆弱的时候，放大治理和执行风险
        - 暂停，或大幅提高折价要求
    notes: 这些触发条件界定了什么时候战略兴趣已不足以支撑继续容忍估值。
    claimRefs:
      - CV008
      - CV009
      - CV028
      - CV035
      - CV036
      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 财务报表
        - 季度收入、毛利率、运营费用、烧钱速度和现金跑道
        - 把战略相关性转成可定价的投资测算
        - CFO / 数据室
      - - 待交付订单和订单转化
        - 已获资金支持的待交付订单、任务订单历史、取消率，以及按收入拆分的客户集中度
        - 把合同上限新闻和可持续现金生成能力分开
        - 商务与财务尽调
      - - 股权结构表和优先权
        - 所有权、清算优先权、反稀释条款，以及任何结构化条款
        - 决定真实入场经济性和下行保护
        - 法务 / 股东审查
      - - 工厂 KPI 包
        - 产出、利用率、良率、报废率、供应商冗余和营运资本强度
        - 决定 Project Millennium 是否配得上战略溢价
        - 运营尽调
      - - 自主化 / 合规资料包
        - 武器审查、出口管制矩阵、安全论证和主要客户审批路径
        - 用来判断政策风险是可管理，还是会毁掉价值
        - 法务与技术尽调
    notes: 这些是按当前估值从兴趣推进到确信所需的最低尽调要求。
    claimRefs:
      - CV004
      - CV038
      - CV039
      - CV042
