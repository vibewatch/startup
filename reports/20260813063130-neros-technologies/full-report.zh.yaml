      - number: '2.4'
        title: 增长驱动、约束和 Neros 真正要守住的东西
        blocks:
          - type: paragraph
            body: >-
              Neros 市场背后最强的驱动，是战场已经验证了对可消耗规模的需求、乌克兰和中东无人机战役后美国及盟国的紧迫感，以及越来越把无人系统和反 UAS 视为标准装备而不是实验项目的防务预算线。StartUs
              的预算综合和 DIU 的 Replicator 表述都指向同一方向：Pentagon 要规模、更低成本和更快迭代。反 UAS 也在快速增长，因为低成本威胁已经触及基地、边境、港口、公共场所和关键基础设施。


              约束同样重要。C-UAS 买方仍会撞上干扰和主动击败的法律限制；Soldier Systems 指出 PBAS
              存在开放架构和接口标准缺口；军用无人机市场研究也反复警示出口管制、网络安全、围绕自主能力的伦理争论，以及供应链瓶颈。Neros
              所在类别的价格压力尤其尖锐，因为系统越接近可消耗战场用途，就越没有空间赚取精致高毛利。投资结论是，Neros
              面对的市场很有吸引力，但它只有把美国本土制造可信度、价格纪律、互操作性和操作员拉动嵌入具体采购项目，才会赢；不能只靠全球无人机 TAM 叙事。
