      - number: '1.3'
        title: 资本形成、投资者和利益相关方一致性
        blocks:
          - type: paragraph
            body: >-
              Neros 的融资速度与其战时制造叙事相匹配。2025 年 11 月官方 Series B 公告披露，公司完成 $75M 融资，由 Sequoia Capital 领投，Vy Capital US 和
              Interlagos 参投，使已披露总融资超过 $120M。九个月后，公司宣布完成 $250M Series C，投后估值 $2.5B，由 Sequoia 和 American Strategic
              Technology Fund 共同领投，Valor Equity Partners、Allen & Company、Thiel Capital、Spark Capital、Dylan Field
              等参投。投资者组合很重要：它混合了风险投资、战略性国家利益资本和高知名度个人支持者，而不只是纯财务型后期资本。


              不过，资本故事仍未完全透明。公开公告描述了爆发式增长、显著收入扩张和重大合同，但没有公布经审计收入、现金消耗、积压订单、客户集中度或详细股权经济条款。公司主张到 2028
              年年产一百万架无人机，这意味着投资者更容易验证势头和估值标记，却更难验证底层单位经济。最稳妥的结论是，资本获取能力目前是优势；但披露深度仍低于传统工业尽调流程希望看到的水平。
