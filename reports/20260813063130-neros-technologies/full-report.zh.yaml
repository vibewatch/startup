      - number: '3.2'
        title: 能力重叠、任务匹配，以及 Neros 不是同一种产品的地方
        blocks:
          - type: paragraph
            body: >-
              在打击无人机一侧，Neros 最直接的一对一威胁是 Red Cat。Black Widow 和 FANG 面向同一大类 Army 与战术单位买方，已经具备 Army 正式采办项目证明、ATAK 相关控制、与
              Palantir 合作的 GPS 受损环境导航，以及已披露的量产路径。AeroVironment 也是真威胁，但它位于更成熟的巡飞弹类别：Switchblade 300 Block 20
              射程更长、杀伤力已验证，并有大量 Army 交付订单；这让它在更高确定性的精确效果上更强，但未必适配 Neros 瞄准的最低成本可消耗任务。

              Shield AI、Anduril 和 Skydio 是相邻而非同类。Shield 的 Hivemind 和 V-BAT 比 Neros 展现出深得多的自主能力和海上证明；Skydio 更偏可回收 ISR
              和开放平台软件，而不是廉价可消耗打击。Anduril 重要，是因为即便不逐项匹配 Neros 的每个任务，它也能用规模、制造能力和反 UAS 相邻优势挤压较弱初创。这个差别很关键：Neros
              不是要在所有事情上击败每个供应商，而是要拿下单位成本低、美国本土供应和操作员即用打击套件最重要的狭窄区域。
