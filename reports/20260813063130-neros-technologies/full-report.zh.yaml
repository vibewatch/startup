      - number: '8.2'
        title: 融资背景支持继续跟踪，而不是松懈
        blocks:
          - type: paragraph
            body: >-
              Series C 轮重要，因为它既是验证信号，也是警示信号。它验证了成熟投资人和防务导向资本相信，Neros 属于当前无人机再工业化周期的第一梯队。但它也意味着便宜入场的轻松阶段已经结束。投后 $2.5B
              时，投资人承销的已不再是一张小额期权票，而是一家公司：它必须把叙事、需求证明和工厂野心转成可持续经济性。与 Red Cat 相比，Neros 的估值已经高于一家公开市场小型无人机专精公司。与 Shield
              AI、Anduril 和 Skydio 相比，Neros 绝对估值更低，但在经济性和平台规模上的公开成熟度也更低。与 Palantir、Axon 这类公开软件或政府科技龙头相比，Neros
              完全没有足够的披露质量，不能借用它们的倍数逻辑。因此，入场纪律非常重要：正确建议更少取决于 Neros 是否令人印象深刻，更取决于价格是否已经假设了太多规模化和经济性进展。
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
              - CV013
              - CV019
              - CV021
              - CV022
              - CV033
      - number: '8.3'
        title: 用情景与可比公司框住估值区间
        blocks:
          - type: paragraph
            body: >-
              由于 Neros 公开经济性不完整，推演估值最好的办法，是用情景逻辑加一组混合可比对象。公开无人机和防务可比公司显示，倍数跨度很大。Red Cat
              收入小得多，却按类似风险投资的倍数交易，反映稀缺性和增长期权。AeroVironment 与 Kratos 已披露收入规模，倍数更接近中等硬件防务公司。Axon 和 Palantir
              则展示了另一端：投资人能看到强经常性经济性或软件式利润率时，公开市场会给出更高溢价。私有同行以另一种方式强化同一教训：Shield AI、Skydio 和 Anduril
              估值更大，但也伴随更多披露规模、更宽平台，或更强经济性主张。因此，Neros
              不需要按公开硬件主承包商估值，但也不能负责任地按公开软件龙头估值。合理价值区间确实存在，精确度并不存在。这就是为什么基准情景聚集在温和升值，牛市情景需要多项证明升级，而熊市情景仍要考虑真实的降价融资风险。
            claimRefs:
              - CV014
