companyProfile:
  summary: >-
    Neros Technologies 是一家南加州防务初创，2023 年由 Soren Monroe-Anderson 和 Olaf Hichwa 创立。公开叙事把两人都描述为竞技 FPV
    无人机玩家，他们把战场经验转成一家聚焦美国本土制造的公司。到 2026 年 8 月，Neros 的公开产品线已从 Archer 和 Archer Strike 扩展到 Archer AI、Bandit、Archer Fiber 以及
    Project Millennium 工厂计划，同时拿到 Army、Marine Corps、乌克兰联盟和盟国相关的可见证明。公司完成 $250M Series C，投后估值
    $2.5B，用于扩大自主无人机和拦截无人机项目，但仍未公开足以完整承销一笔后期私募进入的财务和股权结构细节。
