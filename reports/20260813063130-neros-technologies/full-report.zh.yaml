      - number: '5.2'
        title: 架构、电子设备和生产系统
        blocks:
          - type: paragraph
            body: >-
              Neros 最可信的技术差异化，不是类似软件公司的已发布自主堆栈，而是定制飞控、内部无线电、供应链工程和制造设计紧密耦合。官网称，Neros 自建飞控计算机架构、集成传感器、电机驱动、推进部件以及指挥 /
              视频无线电。DIU 的 EMI 项目独立印证，Neros 并不只是营销无线电韧性，而是被选中为电磁受争夺小型 UAS 作战原型化解决方案。Project Millennium
              又把架构概念进一步放大，把制造系统本身视为产品的一部分：通信、传感器、自主能力和制造系统被明确列为公司四个投资支柱。


              这形成了独特运营模型。Neros 试图从芯片来源一路控制到组装 / 测试，再把战场经验快速反馈进新版迭代。American Drone Dominance 文章和 Tectonic
              报道都强化了这一点：公司把芯片层面的中国排除、马达和天线的友好国家来源，以及高风险子系统在岸化，视为技术特性，而不只是采购文书。因此，产品架构有两个交织层：已部署的无人机系统，以及让无人机能够规模化重复生产的工厂
              / 供应系统。代价是不透明。公开材料详细讨论理念和模块，但仍没有发布开放集成手册、软件接口、加密架构或第三方性能基准。
