  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接同业、相邻平台和现状替代品
        blocks:
          - type: paragraph
            body: >-
              Neros 面对的不是一组干净的竞争对手。Archer 家族位于低成本可消耗打击和战术小型 UAS 赛道，最相关的公开同业是 Red Cat/Teal、Firestorm，以及其他参加
              Gauntlet-I、接受低价单向攻击无人机规模化评估的企业。这与 Shield AI、Anduril 甚至 AeroVironment
              所在战场不同，后者出售更宽的自主堆栈、更高端飞行器，或更成熟的巡飞弹家族。与此同时，Bandit 把 Neros 推入第二场竞争，对手是 DroneShield 和 Dedrone 等反 UAS
              专家；买方可能更偏好分层探测-跟踪-干扰系统，而不是无人机对无人机拦截。

              现状也很重要。外国生产的无人机过去填补了许多低端用例，但 FCC 2025 年针对外国生产 UAS 和关键部件的 Covered List
              行动，实质上改善了美国制造替代品的政策背景。这并没有消除价格压力；它只是意味着 Neros 现在较少与不受限制的中国进口选项竞争，更多与能够满足安全、来源和项目办公室信任要求的美国本土供应商竞争。
