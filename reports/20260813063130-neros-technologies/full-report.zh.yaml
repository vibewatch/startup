      - number: '2.2'
        title: 规模视角：大 TAM、定义冲突和更窄的 SAM
        blocks:
          - type: paragraph
            body: >-
              已发布的市场规模估算确实证明 Neros 面向的是一个真实增长市场，但也显示宽口径 TAM 多么容易被误用。在进攻型无人机一侧，Research and Markets 估计 2026 年防务无人机市场为
              $13.73B，Mordor 估算 2026 年 UCAV 市场为 $16.69B，Fortune Business Insights 则把更宽的军用无人机市场放在 $22.49B。在防御一侧，Mordor 估算
              2026 年反无人机市场为 $2.47B，而 Fortune 给出的 2026 年 counter-UAS 市场数字高得多，为 $14.41B。这些数字不是错的；它们只是来自不同市场定义、终端用户切分和产品篮子。


              对 Neros 来说，正确教训不是挑最大的数字。公司的实际 SAM 比任何头部全球估算都窄，因为它取决于小型战术攻击无人机预算、部队防护和反 UAS
              预算线，以及愿意以弹药式数量采购的项目。因此，最好的公开自下而上锚点不是全球行业 TAM，而是美国防务预算和项目证据，例如 FY2026 Army small-UAS 预算请求，以及嵌入
              PBAS、Replicator 和 Blue UAS 相关采用路径中的成本 / 数量逻辑。
