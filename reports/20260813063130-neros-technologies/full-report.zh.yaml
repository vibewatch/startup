  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正反命题都成立
        blocks:
          - type: paragraph
            body: >-
              Neros 值得进入真实的投资辩论，因为公司已经跨过了许多防务创业公司从未在公开层面跨过的门槛。它有可信的需求证明，有面向本土生产的叙事，产品线在变宽而不是收窄，宏观背景也仍然偏向大规模生产的军用无人机和反
              UAS
              工具。这些构成了真实的投资命题，而不只是融资故事。问题在于，当前估值要求投资人押注这套战略命题，却缺少通常能把战略故事转成价格敏感买点的财务证据。公开来源仍未披露收入、积压订单转化、毛利、烧钱速度或股权结构条款。因此，反向命题不是
              Neros 缺乏重要性，而是估值跑在披露前面。更合适的框架应当对证据敏感：Neros 可能很好，但问题是，今天是否已有足够证明，能支撑按当前标记价格买入。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
