      - number: '4.3'
        title: 资本充足性、资产负债表推断，以及同业对跑道的启示
        blocks:
          - type: paragraph
            body: >-
              Neros 公开财务案例中最强的一环是资本获取能力。2026 年 8 月 Series C 融资 $250M，估值 $2.5B，公司称资金将加速 Archer AI 和 Bandit 产能爬坡。这轮融资接在 11
              月融资以及公司关于核心业务此后爆发式增长的说法之后。单独看，这听起来足够；放在语境里，它更像必要条件。Project Millennium 描述了 100x 产能跃迁，Defense News
              称百万架无人机目标需要制造体系重构，招聘信号显示 Neros 不仅在补工程，也在补规划、制造执行和会计。

              可比公司让资本问题更尖锐。Red Cat 在 2025 年末持有 $167.9M 现金，但仍产生 $72.1M 净亏损和 $89.1M 经营性现金流出。AeroVironment 持有 $377.3M 现金和
              $1.2B 已获资金支持的积压订单，但也背着近 $313M 库存和大额应收账款。Skydio 称其 2026 年 $110M 融资刻意做小，因为强单位经济和数亿美元收入如今可以为更多运营提供资金。Shield 和
              Anduril 融资规模达到数十亿美元。这个光谱说明，Neros 新一轮融资可能足以支撑近期爬坡，但仍没有公开依据可以精确计算跑道、烧钱速度或资本充足性。
