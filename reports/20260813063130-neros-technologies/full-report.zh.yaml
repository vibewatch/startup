    title: 风险传导图——头部风险如何流向收入和估值
    type: dag
    layout: wide
    summary: Neros 最重要的风险通过列装放缓、订单转化下降、现金消耗期拉长，最终传导到估值压力。
    data:
      nodes:
        - id: policy
          label: 自主政策漂移
        - id: ramp
