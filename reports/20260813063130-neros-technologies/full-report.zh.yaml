      - number: '7.4'
        title: 合作伙伴、客户与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Neros
              已有足够客户证据，能证明这门生意不是纯投机，但客户结构仍然偏窄。公开记录里，陆军、海军陆战队、乌克兰联盟渠道和少数盟国路径承担了大部分证明。这种集中有战略价值，因为它验证任务匹配；但也危险，因为每条渠道都受项目办公室节奏、预算释放、联盟政治和出口管制处理影响。陆军
              IDIQ 上限就是好例子：它证明 Neros
              切中需求，但不能证明收入已经落地，也不能证明毛利健康。同样的逻辑也适用于乌克兰需求——需求真实存在，但更多绑定战时捐助方决策，而不是类似企业客户的经常性合同。合作伙伴风险更窄，但仍值得注意。Kela 和 CX2
              拉长了路线图，DIU/Blue UAS 提升了可信度；不过，每多一条集成路径，也会增加资质认证和支持复杂度。财务上，Series C 轮给了 Neros
              执行空间，但公司没有披露收入、利润率、烧钱速度或积压订单转化数据，因此这轮融资应被视为给执行买来的时间，而不是执行已经完成的证明。
