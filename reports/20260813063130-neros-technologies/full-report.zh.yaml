  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Neros 并不是面向宽泛商用无人机市场销售。保留记录显示，它的客户基础高度集中在政府和联盟渠道，而买方、付款方和用户常常是不同机构。U.S. Army 通过 PBAS 和后续 $500M
              IDIQ，是最清晰的规模客户；U.S. Marine Corps 通过交付订单、MCADT
              制度化和实弹采用，是最清晰的具名培训和野战客户；乌克兰通过联盟资金支持交付，是最清晰的战时终端用户；英国既作为联盟通道出现，也作为新兴主权制造客户布局出现。公开来源还指向 U.S. Special
              Operations Command 使用，但这一证明明显薄于 Army 和 Marine 证据。


              这一点重要，因为 Neros 的客户逻辑更接近防务平台销售，而不是普通硬件分销。项目靠联盟资金、军种竞赛、BlueUAS
              资质采购路径，以及把战场经验转成条令的培训组织赢下。因此，客户分层必须区分谁开支票、谁跑采购、谁真正飞系统。对 Neros 来说，这些层经常分离：联盟资金支持乌克兰，军种项目组织 Army 采购，MCADT 和
              Warfighting Lab 组织塑造 Marine 采用，新宣布的英国本地化则试图把联盟参与转化为更长周期的盟国制造和采购关系。
