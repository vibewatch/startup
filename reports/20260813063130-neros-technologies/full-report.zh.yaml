      - number: '5.4'
        title: 信任、安全、合规和开放风险
        blocks:
          - type: paragraph
            body: >-
              相比许多早期防务无人机初创，Neros 有更强的公开合规锚点，但这些锚点很窄。BlueUAS 入选和 ATO 相关报道显示，Archer 已为美国政府用户越过一个重要采购和网络安全门槛。DoD Directive
              3000.09 也为任何自主能力密集的扩展提供治理框架：自主和半自主武器系统必须保留适当人类判断，通过现实验证和确认，并纳入安全、防篡改和网络安全控制。Neros
              自己的公开措辞明显以飞行员为中心——官网称飞行员应拥有最终控制权，光纤无人机评论也强调无线电链路失效时的人工精确性——这与该政策环境方向一致。


              开放尽调缺口仍然重大。Neros 没有公开用户手册或开放集成指南；其文档页面把用户导向支持联系入口，保留的公开来源也没有给出第三方网络认证、公开 SBOM、故障率数据集，或
              Archer、Crossbow、Archer AI、Bandit 的适航档案。这不代表这些控制不存在，但确实说明公开记录更擅长证明意图，而不是证明保障能力。对 Archer AI 和 Bandit
              来说，这一点最重要，因为自主能力主张和拦截机角色抬高了测试证据、操作员监督边界和可解释故障模式的门槛。产品故事在战场有用性和制造务实性上可信；在公开安全和保障披露上仍不完整。
