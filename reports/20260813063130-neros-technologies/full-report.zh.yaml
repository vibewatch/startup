  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线和战场任务
        blocks:
          - type: paragraph
            body: >-
              Neros 现在呈现的是一套连贯的战场系统，而不是单一可消耗无人机。当前公开核心是 Archer：一个为模块化载荷、韧性通信和 BlueUAS 相关采购打造的 FPV 平台；Archer Strike
              为打击任务加入致命载荷集成；Crossbow 现在又有士兵携行的 Flatbow/Crossbow Block 2 概念补充，是让机体能在受争夺环境中使用的控制层。PBAS
              包显示，公司的报价是一套由飞行器加地面控制设备组成的打包系统，而不是裸四旋翼。这一点很重要，因为它把 Neros 从源于爱好者的硬件品牌，推向以操作员生存性、防区外距离和快速野外重构为中心的军方工作流销售。


              路线图沿两个方向延展这套堆栈。Archer Fiber 把核心 Archer 平台改造成光纤控制版本，用于无线电链路过于容易受到电子战攻击的环境；Archer AI 和 Bandit
              则代表下一步自主能力密集的扩展：前者向打击家族加入末段制导和 GPS 拒止环境定点悬停功能，后者尝试把 Neros 的制造打法用于低成本拦截机。因此，公开记录支持一个产品命题：共享控制 / 制造 /
              供应链骨架，上面叠加多个任务套件。公开记录尚未支持的，是续航、故障率、导引头性能，或飞行员辅助与独立行动之间自主边界的完整透明度。
