      - number: '3.4'
        title: 护城河耐久性、商品化风险和投资结论
        blocks:
          - type: paragraph
            body: >-
              Neros 最强的护城河主张，不是软件深度或项目宽度，而是 Pentagon 越来越想要大量美国本土、低成本无人机，而 Neros
              明确围绕这个命题组织公司。支持牛市案例的同一组公开证据，也限制了这个案例。Drone Dominance 项目意味着单位价格下行、数量预期上升，以及严苛的作战筛选压力。这个环境可以在 Neros
              可靠且低成本制造时奖励它，也可能把类别变成残酷的商品化竞赛，让渠道更强或系统打包能力更好的资本化玩家拿走份额。

              因此，投资结论是混合但有用的。Neros 面对外国现状替代品，以及缺少美国本土制造故事的小同业时最强；面对战术小型 UAS 中的 Red Cat、已验证巡飞弹中的
              AeroVironment、自主能力密集的高端项目中的 Shield AI，以及分层反 UAS 采购中的 DroneShield 或 Dedrone 时，保护最弱。承销时的关键尽调问题，是 Neros
              能否在资本更充足的生态系统定义该类别的标准、数据层和保障关系之前，把美国本土规模化叙事转成重复胜利。
