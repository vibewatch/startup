      - number: '6.3'
        title: 留存、服务模型和耐久性
        blocks:
          - type: paragraph
            body: >-
              公开留存披露很薄，但 Neros 展示了在防务领域重要的重复使用代理。Army 关系似乎逐阶段加深：PBAS 入选、野外交付，然后是更大的 IDIQ 额度。Marine
              关系看起来也有耐久性，因为采购与培训、条令建设、竞赛和实弹使用绑定，而不是一次性出货。这些不能替代 cohort
              或续约数据，但在军事采用语境里很有意义：采购通常先经过实验、操作员培训和军种级背书，之后才规模化成重复订单。


              Neros 的服务模型也比许多早期防务初创更可见。Marine 合同明确包含操作员培训和支持，Army IDIQ
              包含支持和工程，公司文档入口把客户导向直接支持，而不是公开自助服务手册。这说明客户耐久性可能部分取决于任务成功和培训关系，而不只是机体销售。代价是外部不透明。保留来源没有给出正式
              NRR、GRR、续约率或流失率，也没有公开客户成功仪表盘量化任务结果。投资者可以通过采购动作和制度化看到客户正在回来，但仍无法用公开精度衡量满意度或重复经济性。
