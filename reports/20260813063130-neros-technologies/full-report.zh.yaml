      - number: '7.5'
        title: 团队、执行与否决标准
        blocks:
          - type: paragraph
            body: >-
              最后一层风险在组织。Neros 仍然由创始人定义，公开叙事也高度围绕 Soren
              Monroe-Anderson：他把操作人员、投资人和制造野心拉到同一个规模化故事里。势头建立时，这是优势；但如果运营班底比品牌显得更薄，它就会变成脆弱点。招聘面显示，公司仍在补制造、工程和项目执行深度。快速扩张的防务创业公司都会这样，但不能把它误读成成熟的运营冗余。英国本地化和
              APAC 野心又增加了一层管理复杂度，而美国规模化命题还没有完全跑通。务实的投资动作，是先定义否决标准。谨慎投资人应在这些情况出现时立刻重做投资判断：自主政策环境明显收紧并压制 Neros 路线图，Project
              Millennium 明显错过爬坡里程碑，陆军 / 海军陆战队 / 联盟需求暂停，出口管制问题浮出水面，或创始人连续性中断且没有可信接班梯队。这些事件都能监测，不应被当成意外。
