chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、布局和商业模式
        blocks:
          - type: paragraph
            body: >-
              Neros Technologies 是一家防务无人机制造商，围绕军用低成本、可消耗第一人称视角系统搭建。公司公开材料一贯把 Archer 和 Archer Strike 放在当前核心产品的位置；2026 年 8
              月融资发布又把 Archer AI 和 Bandit
              拦截机加入下一步组合。公司讲述的使命不只是卖单一机体，而是用垂直整合的硬件、自主能力和制造系统重建美国无人机工业基础。这个表述很关键：工厂和供应链不再只是支撑基础设施，而是产品故事的一部分。


              地点信号显示，公司既有延续，也在转移。Neros 官网仍称总部在 El Segundo，但 2026 年的融资和制造报道越来越多地指向 Torrance 以及更大的洛杉矶地区设施。最干净的解读是：Neros
              起步于 El Segundo，在当地 15,000 平方英尺空间内扩张，如今正把运营中心转向 Torrance 的 Project
              Millennium，同时把南加州作为人才基地。这让公司拥有连贯的美国本土制造叙事；但也意味着外部资料提到总部时会不一致，取决于它们说的是早期办公室，还是规模化工厂计划。
