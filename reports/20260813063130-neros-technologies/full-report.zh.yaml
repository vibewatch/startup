      - CV008
      - CV019
      - CV028
      - CV038
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持围绕当前标记估值的一组情景区间，而不是单一精确内在价值。
    data:
      items:
        - label: 悲观估值观点
          low: 1000
          mid: 1500
          high: 2000
          unit: USD million
        - label: 基准估值观点
          low: 3000
          mid: 3750
          high: 4500
          unit: USD million
        - label: 乐观估值观点
          low: 6000
          mid: 7500
          high: 9000
          unit: USD million
        - label: 当前 Series C 锚点
          low: 2500
          mid: 2500
          high: 2500
          unit: USD million
    approximationNotes: 基于当前公开可比公司和证据质量的示意情景区间。乐观情景需要强得多的收入、利润率和客户证据；悲观情景反映真实的降估值轮风险。
    claimRefs:
      - CV001
      - CV023
      - CV024
      - CV025
      - CV026
      - CV033
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 风格总结：Neros 哪里看起来强，公开证据链又在哪里断裂。
    data:
      items:
        - label: 市场吸引力
          value: High
          note: 军用无人机和反无人机顺风仍强
        - label: 产品 / 客户证据
          value: Medium-high
          note: 陆军、海军陆战队、联盟和路线图证据都是真实的
        - label: 经济性可见度
          value: Low
          note: 收入、利润率、烧钱速度和股权结构条款仍未披露
        - label: 风险评级
          value: High
          note: 规模、政策和集中度风险仍未解除
        - label: 今日进入吸引力
          value: Medium-low
          note: 需要更好披露，或更好价格
        - label: 建议
          value: Track / research more
          note: 公司有吸引力，但当前价格下信心仍不完整
    claimRefs:
      - CV005
      - CV007
      - CV030
      - CV031
      - CV032
      - CV041
