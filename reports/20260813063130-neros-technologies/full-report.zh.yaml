      - number: '5.3'
        title: 部署成熟度、路线图和差异化
        blocks:
          - type: paragraph
            body: >-
              Neros 的成熟度并不均匀；如果把所有产品混在一起，很容易忽略这一点。Archer 及其控制堆栈的成熟度信号最清晰：BlueUAS 入列、PBAS 入选、军方实弹使用、Gauntlet
              参与和当前野外交付，都指向一个真实量产产品。Crossbow Block 2 和 Flatbow 看起来也明显不是概念，因为外部报道描述了当前交付、保留的 25 公里控制距离、ATAK
              视频集成和操作员防区外功能。Archer Fiber 位于这个重心的下一层：它似乎有真实演示、合作伙伴验证和订单流入，但公开证据仍以发布报道为主，而不是广泛运营披露。


              最新项目仍是路线图故事。Archer AI 锚定在一小组公开宣称的自主功能上——末段制导、GPS 拒止环境定点悬停和多资产控制雄心——但还没有锚定到已发布条令、验证数据或运营安全案例。Bandit
              更早期。市场逻辑很强，因为低成本拦截机契合 Neros 既有机体和供应链优势；但工程问题比单向 FPV 打击无人机更难，公开测试仍稀疏。因此，正确的成熟度判断应按组合权重来读：Neros 已经围绕
              Archer/Crossbow 拥有可防守的核心产品集群，但投资者不应只因为 Archer AI 或 Bandit 共用品牌和制造叙事，就把它们按同等成熟资产承销。
