      - number: '3.3'
        title: 分销权力、转换成本和买方实际购买的东西
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Neros 的真正问题不只是功能对等，而是分销和采购重力。Red Cat 已经拥有 Army SRR 正式采办项目身份。AeroVironment 拥有五年期 Army IDIQ
              和大量交付订单。Shield AI 的 Coast Guard、Navy、Marine 和乌克兰证明，绑定的是可复用飞行器加自主层。DroneShield 出售完整硬件、订阅、保修和服务包，Dedrone
              出售与干扰器和远征套件绑定的传感器融合指挥控制。这些供应商卖的不只是机体；它们卖的是已验证工作流、培训、保障和信任。

              这会产生真实转换成本。买方会被共同控制系统、与 ATAK 或类似环境的集成、训练好的操作员、既有保障链条，以及经战场检验的电子战表现锁住。对 Neros 来说，下一阶段竞争不只是让 Archer 或 Bandit
              能用，而是证明部队采用它们时，不必在再培训、集成或机队碎片化上支付隐性税。DroneXL 关于潜在「弗兰肯斯坦机队」的警告在这里尤其相关：低成本无人机如果生态系统带来过高运营复杂度，仍然会输。
