  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域和 Neros 的真实楔入点
        blocks:
          - type: paragraph
            body: >-
              分析 Neros 最容易犯的错误，是把它等同于整个军用无人机经济。Neros 并不在无人航空的全谱系竞争。它当前市场落在更窄的切片里：Archer 和 Archer Strike
              这类低成本、可消耗、短程打击无人机，加上 Bandit 所代表的新兴反 UAS 拦截机类别。这个楔入点更接近可消耗战术弹药、部队防护工具和小分队侦察 / 打击套件，而不是许多全球无人机市场报告里占主导的大型固定翼
              UCAV、MALE 或 HALE 平台。


              因此，相关的现状替代品不只是其他无人机初创。对 Archer 类系统来说，实际替代方案包括迫击炮、由人工操作员投送的榴弹或火箭效果、巡飞弹、改装成单向攻击的 ISR 四旋翼，以及其他低成本 FPV 系统。对
              Bandit 来说，替代方案包括干扰器、动能拦截器、基地防御雷达和分层反 UAS 堆栈。这个边界很重要，因为它把 Neros
              的可服务市场锚定在快速补充的战术需求和部队防护支出上，而不是整个无人航空或航空航天现代化预算。
