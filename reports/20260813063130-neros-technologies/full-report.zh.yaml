      - number: '1.4'
        title: 合同、里程碑和运营依赖
        blocks:
          - type: paragraph
            body: >-
              Neros 的里程碑记录显示，公司异常快速地从战场学习型初创，进入被认可的防务供应商位置。官方发布记录了 2025 年 11 月 Marine Corps 订单、同月入选 Army PBAS，以及 2026 年
              7 月最高可达 $500M 的 Army IDIQ。独立报道还补充了 International Drone Coalition 合同，将向乌克兰提供 6,000 架无人机；韩国的 Archer Strike
              实弹训练；以及覆盖 SOCOM 和盟国的更广客户集合。这些里程碑说明 Neros 已不只是概念期防务初创：它已经进入真实军方工作流。


              但运营规模说法仍然嘈杂。2025 年 7 月 Defense News 引述的产量约为每月 1,500 架 Archer，而 2025 年底外部报道引用的产量接近每天 2,000 架。员工规模信号也大幅分散，从
              2025 年底约 80 名员工，到后来面向招聘的报道中的 201 至 500 人区间。这些不一致并不否定公司的增长，但说明公开记录更擅长证明方向，而不是精确规模。因此，Neros
              在战略相关性上最强，在精确披露纪律上最弱，尤其是产能、员工和合同经济性相交的地方。
