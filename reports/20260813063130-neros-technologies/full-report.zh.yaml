      - number: '8.4'
        title: 建议：以当前估值继续跟踪 / 深入研究
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，正确建议是继续跟踪 / 进一步研究。这不是轻视 Neros。它承认 Neros 已有足够战略和运营证明，值得留在高优先级尽调名单上；但在 $2.5B
              投后估值下，公司还没有足够经济性证明，不能支撑干净的买入判断。买入判断需要更好的入场价格，或显著更好的证据，尤其是财务披露、订单转化、工厂执行和更宽客户耐久性。今天，公开记录支持高风险评级和中等置信度。市场吸引力强，产品
              / 客户证明已经有意义，战略叙事可信。但经济可见度仍低，政策与集中度风险仍然存在，估值高度依赖投资人把未来成功执行投射进去。放到投资组合里，这意味着耐心不是犹豫，而是有纪律的承销。Neros
              仍可能成为非常强的资产，但当前证据还不能让它变成一笔对价格不敏感的资产。
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV041
