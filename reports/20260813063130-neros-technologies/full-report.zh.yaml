      - number: '6.4'
        title: 扩张路径和集中度风险
        blocks:
          - type: paragraph
            body: >-
              Neros 确实有可见扩张路径。英国子公司公告让公司从联盟供应商变成本地化盟国存在；Project Millennium 描述了未来 APAC 生产，甚至还提出一种可能的美国本土 OEM 部件 / 客户层，即
              Neros 同时成为制造商和锚定客户。这些很重要，因为它们暗示公司有一条超越美国军种采购和乌克兰相关战时订单的路径。公司也在防务内部跨用户类别扩张：常规步兵、特种作战、联盟用户和盟国国防部都出现在公开记录中。


              风险在于，大部分具名需求仍聚集在少数防务渠道周围。Army 是单一最大已披露客户集中点，Marines 是最强第二证明，乌克兰 / 联盟需求仍与战时资金优先级绑定。Defense News
              给出了最重要的反向客户信号：操作员需求真实，但项目办公室资金和预算跟进仍滞后。这意味着 Neros
              可能先具备战略相关性，之后才获得耐久的预算线保护。正确解读不是客户证明弱；而是客户证明真实，但比公司规模叙事更窄。在行权订单价值、客户数量和续约质量指标披露之前，客户集中度仍是最重要的承销风险之一。
