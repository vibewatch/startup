- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Autonomy-policy drift
    - DoD 3000.09 rewrite outcome
    - Directive or implementing guidance materially narrows acceptable use cases for Neros-like systems
    - Re-underwrite product roadmap and haircut autonomy upside immediately
  - - Factory ramp miss
    - Project Millennium milestone updates
    - Visible delay to commissioning / throughput ramp or evidence that 1M-by-2028 is no longer credible
    - Reset scale assumptions and revenue timing
  - - Supply-chain traceability failure
    - Supplier disruption / component-origin disclosure
    - Loss of a critical non-China input or evidence that key traceability claims are weaker than marketed
    - Escalate diligence on BOM, margins, and delivery risk
  - - Government-channel concentration
    - Army / Marine / coalition procurement pace
    - Task-order slowdown, canceled demand, or coalition funding pause across core channels
    - Reduce near-term revenue confidence and extend cash-burn assumptions
  - - Export or compliance event
    - Regulatory notice, denied transfer, or public legal dispute
    - Any material export-control, policy, or compliance incident tied to Neros programs
    - Pause investment decision until root cause and remediation are clear
  - - Founder continuity break
    - Leadership announcement
    - Founder-CEO departure without disclosed bench and transition plan
    - Treat as immediate governance and execution review event
  notes: All six kill criteria are publicly monitorable within ordinary defense-tech newsflow or direct diligence requests.
