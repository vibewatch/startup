- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / case / issue
  - Jurisdiction
  - Status (2026-08-13)
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  enumerationScope:
    coverage: partial
    basis: Material public regulatory and legal risks identified from government policy, export-control, rights-law, and public-screening sources as of 2026-08-13; excludes classified reviews and contractor-internal compliance records.
  rows:
  - - DoD Directive 3000.09 rewrite under NSPM-11
    - U.S. Department of Defense / White House
    - Active 90-day rewrite window in 2026
    - High
    - Critical
    - Keep products operator-supervised, document V&V and human-judgment controls
    - A stricter interpretation or messy rewrite could slow Archer AI / Bandit fielding and increase review burden
    - Request product-level autonomy safety case, review memos, and any 3000.09 implementation mapping
  - - ITAR / EAR export-control licensing for allied growth
    - U.S. State / Commerce
    - Ongoing compliance obligation; no public license history disclosed
    - Medium
    - High
    - Use experienced counsel, product segmentation, and clean technical-data controls
    - Allied expansion timing can still be gated by export approvals and technical-data restrictions
    - Request DDTC registration, commodity-jurisdiction work, export matrix, and UK transfer approvals
  - - Blue UAS / defense procurement accreditation maintenance
    - DIU / DoD procurement
    - Helpful pathway exists, but future product changes can trigger fresh review
    - Medium
    - High
    - Maintain controlled change management and accreditation evidence
    - New autonomy or payload changes may outpace the current accreditation envelope
    - Request current Blue UAS status by SKU and change-control policy
  - - Human-rights / IHL pressure on autonomous weapons
    - International / advocacy / allied policy
    - Rising public pressure ahead of 2026 treaty push
    - Medium
    - Medium
    - Preserve human-in-the-loop doctrine and publish governance principles
    - Narrative or allied-policy tightening can narrow acceptable deployment envelopes
    - Request legal review memos, ROE assumptions, and customer policy guardrails
  - - China-related retaliation or screening exposure
    - PRC trade / export control regime
    - Sector-level risk visible; Neros-specific measure set not fully transparent
    - Low-Medium
    - High
    - Minimize China touchpoints and keep alternate sourcing outside PRC
    - Trade friction can hit suppliers, components, or market access with limited warning
    - Request supplier-origin map and any company legal memos on PRC exposure
  - - Public compliance disclosure gap
    - Company-wide
    - No public weapons-review or export-control disclosure found
    - High
    - Medium
    - Build disclosure package for investors and sensitive customers
    - Outside diligence cannot distinguish strong internal compliance from mere absence of public incidents
    - Request compliance org chart, audit cadence, and incident/escalation history
  notes: Rows are ordered by residual severity for the investment thesis rather than by legal novelty.
