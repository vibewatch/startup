- id: partner-customer-and-financial-risk
  title: Partner, customer, and financial-model risk
  body: 'Neros has enough customer evidence to demonstrate that the business is not speculative, but the customer set is still structurally narrow. Army, Marine Corps, Ukraine coalition channels, and a small number of allied pathways do most of the work in the public record. That concentration is strategically valuable because it validates mission fit, yet it is also dangerous because each channel depends on program-office pacing, budget releases, coalition politics, and export-control handling. The Army IDIQ ceiling is a good example: it proves relevance, but it does not prove exercised revenue or healthy gross margins. The same logic applies to Ukraine demand, which is real but tied to wartime donor decisions rather than recurring enterprise-like contracts. Partner risk is narrower but still notable. Kela and CX2 extend the roadmap, while DIU/Blue UAS helps credibility, yet each additional integration path also increases qualification and support complexity. Financially, the Series C gives
    Neros room to execute, but the lack of disclosed revenue, margin, burn, or backlog conversion data means the capital raise should be treated as time bought for execution—not as proof that execution is already complete.'
