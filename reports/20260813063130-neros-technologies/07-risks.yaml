- id: operational-supply-chain-risk
  title: Operational, quality, and supply-chain risk
  body: 'Operationally, Neros is being asked to do two hard things at once: industrialize a very high production ambition and keep technical performance acceptable in contested environments. The production-side evidence is encouraging but incomplete. Public materials show a serious manufacturing intent, a named factory program, and a philosophy of domestic or friendly-nation sourcing. They do not show audited throughput, cycle-time data, yield, rework, supplier redundancy, or full bill-of-material traceability. That matters because CSIS and RUSI both argue that drone mass depends on precisely the component classes—batteries, magnets, semiconductors, composites, and sensors—where upstream chokepoints still run deep. On the product side, Neros is clearly addressing EW and comms risk through Archer Fiber and other design choices, yet the public record still lacks failure-rate, abort-rate, incident, or field-reliability disclosure. The company may in fact be performing well, but the diligence
    problem is that outside investors cannot verify how robust the fleet is under sustained operational stress. In this chapter, manufacturing-ramp and supply-chain traceability risk therefore outrank pure product-concept risk.'
  claimRefs:
  - CR002
  - CR003
  - CR004
  - CR005
  - CR019
  - CR020
