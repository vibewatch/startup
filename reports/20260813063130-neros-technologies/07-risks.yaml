company:
  name: Neros Technologies
chapter:
  number: 7
  title: Risks
  summary: Neros now faces a classic defense-scale risk stack rather than an idea-stage one. The largest residual risks are manufacturing ramp execution, autonomy-policy drift under the 2026 rewrite of DoD Directive 3000.09, supply-chain traceability behind its China-free positioning, and concentration in a small number of government and coalition channels. The Series C lowers financing urgency, but it does not remove the need to prove factory throughput, compliance depth, and durable order conversion.
sections:
- id: risk-severity-overview
  title: Risk severity overview
  body: Neros has crossed the threshold from concept-stage defense startup to real program participant, which changes the risk conversation. The public record now supports genuine customer proof, product breadth, and substantial capital access, so the biggest risks are no longer whether anyone wants the product. They are whether Neros can scale manufacturing, sustain a traceable non-China supply chain, navigate a shifting autonomy-policy regime, and convert a handful of government demand signals into durable, budget-backed revenue. Those risks also interact. If Project Millennium slips, customer concentration matters more because the company has less room for execution misses; if 3000.09 is tightened or interpreted more cautiously, Archer AI and Bandit become harder to field at speed; if coalition or branch budgets slow, the lack of commercial diversification becomes more visible. The most important conclusion is that Neros looks strategically relevant before it looks fully operationally
    de-risked. Investors should treat manufacturing, policy, and dependency risks as the primary underwriting gates rather than assuming the Series C solved them.
  claimRefs:
  - CR001
  - CR002
  - CR007
  - CR019
  - CR025
  - CR029
  - CR041
  tableRefs: []
  figureRefs:
  - FR001
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: 'Neros sits inside one of the most politically sensitive parts of defense technology: low-cost strike and counter-UAS systems that are becoming more autonomous over time. The retained policy record matters. DoD Directive 3000.09 still centers appropriate human judgment, testing, verification, validation, and controllability, while White House NSPM-11 forces a fresh rewrite on a compressed 2026 timeline. That combination creates two-sided risk. A more permissive review environment could speed Neros programs, but it could also raise scrutiny if observers think safeguards are weakening faster than testing evidence is improving. Export-control risk is similarly real. Neros is now publicizing UK expansion and allied deliveries, yet the retained sources do not disclose export-license history, commodity-jurisdiction rulings, or an internal weapons-review process for Archer AI and Bandit. Meanwhile, ICRC, Human Rights Watch, and Just Security all show that autonomy-related legal and normative
    scrutiny is intensifying rather than fading. The public record does not show an enforcement event against Neros, but it also does not provide enough direct compliance disclosure to score the company as low-risk on regulation or law.'
  claimRefs:
  - CR006
  - CR007
  - CR008
  - CR009
  - CR011
