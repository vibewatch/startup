  topStrengths:
    - 公开客户证据真实存在，覆盖美国陆军、美国海军陆战队、乌克兰联盟需求，以及盟友扩张路径。
    - Project Millennium 和降低中国供应依赖的叙事，让 Neros 切入美国无人机再工业化投资逻辑。
    - 公司已经吸引到 Sequoia Capital、ASTF 等顶级风险资本和防务导向资本，融资规模也不小。
    - 路线图正从单一 FPV 产品扩展到自主化和反 UAS 邻近场景，包括 Archer AI 和 Bandit。
    - 如果 Neros 能把工厂规模、产品宽度和客户拉力转化成可披露的经济性，上行空间确实存在。
  topRisks:
    - 已确认收入、毛利率、现金消耗、已获资金支持的积压订单和 Series C 优先条款均未公开披露。
    - 制造爬坡是核心执行风险，因为公司公开目标是在 2028 年达到每年一百万架无人机。
    - 客户仍高度集中在政府和联盟渠道，尤其是陆军主导的采购路径。
    - Neros 向更自主的系统和盟友渠道扩张时，自主化政策和出口管制风险依然重要。
    - 在经审计的公开经济性还看不到这些进展之前，当前估值已经预设了相当大的执行进展。
  unresolvedGaps:
    - 没有公开季度财务报表、项目级毛利率、烧钱速度或现金跑道披露。
    - 没有公开股权结构表、清算优先权或 Series C 反稀释细节。
    - 没有公开积压订单转化节奏，或按收入计算的客户集中度。
    - 没有公开 Project Millennium 之下覆盖产能、利用率、良率、报废率或供应商冗余的工厂 KPI 包。
    - 没有足够详细的公开自主化安全论证或出口管制材料，无法充分承销路线图政策风险。
