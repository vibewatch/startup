  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: lifetime-capital-and-cash-position
    missingEvidence: A current cap table, cash balance, and reconciled lifetime-capital summary after the Series C.
    whyItMatters: Headline valuation is public, but investors cannot judge dilution, runway, or financing risk cleanly without balance-sheet context.
    diligencePath: Request management dataroom materials or audited financial statements that bridge the Series B, the Series C, and any interim debt or secondaries.
    relatedQuestionRefs:
    - QO012
  - type: missing-source
    severity: material
    topic: board-governance-structure
    missingEvidence: A current board roster, committee structure, and any investor control or observer rights.
    whyItMatters: Late-stage defense manufacturers often accumulate strategic investors whose rights can shape capital allocation and exit optionality.
    diligencePath: Request governance documents, investor-rights agreements, and an updated org/governance chart from management.
    relatedQuestionRefs:
    - QO021
  - type: conflicting-data
    severity: material
    topic: headcount-and-output-disclosure
    missingEvidence: A management-certified operating dashboard for employees, monthly output, and shipped units by quarter.
    whyItMatters: Public sources disagree sharply on both workforce and run-rate production, limiting confidence in claims about scale efficiency.
    diligencePath: Ask for monthly manufacturing KPIs, headcount by site/function, and a reconciliation between press quotes and actual production logs.
    relatedQuestionRefs:
    - QO022
    - QO024
    - QO025
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-backlog-and-customer-concentration
    missingEvidence: Booked revenue, backlog, reorder cadence, and customer concentration by service branch or allied customer.
    whyItMatters: Company-overview metrics can overstate maturity if contract ceilings and live trials are mistaken for realized recurring economics.
    diligencePath: Request customer-level pipeline and recognized-revenue bridge with separation between U.S. military, Ukraine-related channels, and allied sales.
    relatedQuestionRefs:
    - QO025
  - type: missing-source
    severity: minor
    topic: TO002 leadership and founder table public-governance completeness
    missingEvidence: A fuller public or management-provided roster of executives, board members, and governance roles tied to TO002.
    whyItMatters: TO002 is intentionally partial because public sources identify core operators but not a complete governance bench.
    diligencePath: Request an org chart, board roster, and management bios to complete the leadership enumeration.
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone table chronology completeness
    missingEvidence: A fuller internal chronology covering exact announcement dates, smaller customer milestones, and non-public operational milestones.
    whyItMatters: TO004 captures the highest-signal milestones but likely omits secondary events because the public record is selective.
    diligencePath: Ask management for an internal milestone timeline or dataroom chronology to complete the sequence.
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: minor
    topic: TO003 stakeholder or investor map ownership completeness
    missingEvidence: Investor ownership percentages, control rights, and a complete list of strategic counterparties tied to TO003.
    whyItMatters: The table captures the visible power centers, but late-stage diligence needs the actual cap table and customer concentration map.
    diligencePath: Request a current cap table, major-customer list, and investor-rights summary from management.
    relatedTableRefs:
    - TO003
