    - Led $75M Series B and co-led $250M Series C.
    - Confirm ownership, governance rights, and support for future factory capex.
  - - American Strategic Technology Fund (ASTF)
    - Series C co-lead with national-security orientation
    - Introduces quasi-strategic capital aligned with U.S. defense-industrial policy.
    - Named co-lead in August 2026 financing.
    - Clarify whether ASTF involvement brings procurement leverage, policy access, or restrictions.
  - - Interlagos / Vy Capital US / other repeat backers
    - Continuity capital from prior rounds
    - Repeat investors reduce signaling risk around execution between late 2025 and mid-2026.
    - Interlagos appears in both Series B and Series C; Vy in Series B only.
    - Map which investors doubled down versus were diluted.
  - - U.S. Marine Corps
    - Early operating customer / proof point
    - Marine order is one of the first concrete U.S. force-design validations of Archer Strike.
    - Official and BusinessWire releases disclose a multi-million-dollar order with training.
    - Validate contract duration, reorder cadence, and performance metrics in use.
  - - U.S. Army / PBAS program
    - Primary domestic scale customer path
    - Army selection and IDIQ ceiling matter more than publicity because they can pull factory utilization.
    - Official PBAS release and GovConWire/third-party contract coverage show supplier status and a $500M ceiling.
    - Separate ceiling value from funded orders and determine whether Neros is sole-source or one of several vendors.
  - - Ukraine / allied-nation channel partners
    - Battlefield feedback loop and foreign-demand hedge
    - Ukraine experience shaped the product and allied sales can smooth demand beyond one U.S. program.
    - Defense News, official Series B, and Series C materials cite Kyiv presence, Ukraine deliveries, UK Ministry of Defence, Europe, APAC, and other allies.
    - Quantify how much of demand is recurring, grant-funded, or one-off wartime urgency.
