- id: contracts-milestones-and-dependencies
  title: Contracts, milestones, and operating dependencies
  body: 'Neros'' milestone record shows a company moving from battlefield-learning startup to recognized defense supplier unusually quickly. Official releases document a Marine Corps order in November 2025, Army PBAS selection that same month, and a July 2026 Army IDIQ ceiling of up to $500 million. Independent coverage adds an International Drone Coalition contract to provide 6,000 drones to Ukraine, live-ordnance Archer Strike training in South Korea, and a broader customer set spanning SOCOM and allied nations. Those milestones make Neros more than a concept-stage defense startup: it is already in live military workflows.


    The caveat is that operating-scale claims are still noisy. July 2025 Defense News quoted output around 1,500 Archer drones per month, while late-2025 external coverage cited output nearer 2,000 per day. Headcount signals also vary sharply from roughly 80 employees in late 2025 to a 201-to-500 employee band in later hiring-oriented coverage. These inconsistencies do not negate the company''s growth, but they do mean the public record is better at proving direction than exact scale. Neros therefore looks strongest on strategic relevance and weakest on precise disclosure discipline, especially where production, workforce, and contract economics intersect.'
