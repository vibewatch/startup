company:
  name: Neros Technologies
chapter:
  number: 1
  title: Company Overview
  summary: Neros Technologies has moved from a 2023 FPV-drone startup in El Segundo into a heavily funded Southern California defense manufacturer with a $250 million Series C, a stated one-million-drone ambition, and visible Army and Marine Corps traction by mid-2026. The company now looks strategically important to U.S. drone-industrial policy, but public evidence still leaves material gaps around exact headcount, board governance, revenue mix, and how quickly its manufacturing claims translate into durable, contracted demand.
sections:
- id: identity-footprint-and-business-model
  title: Identity, footprint, and business model
  body: 'Neros Technologies is a defense-drone manufacturer built around low-cost, attritable first-person-view systems for military use. Public company materials consistently position Archer and Archer Strike as the present core products, while the August 2026 financing launch adds Archer AI and the Bandit interceptor as the next portfolio step. The company frames its mission less as selling a single airframe than as rebuilding an American drone industrial base with vertically integrated hardware, autonomy, and manufacturing systems. That framing matters because it makes the factory and supply chain part of the product story, not just supporting infrastructure.


    Location signals show both continuity and transition. Neros'' homepage still describes its headquarters in El Segundo, but 2026 financing and manufacturing coverage increasingly centers Torrance and a much larger Los Angeles-area facility. The cleanest read is that Neros began in El Segundo, scaled inside a 15,000-square-foot local footprint, and is now shifting its operating center toward Project Millennium in Torrance while keeping Southern California as the talent base. That gives the company a coherent domestic-manufacturing narrative, though it also means outside references to headquarters can differ depending on whether they describe legacy offices or the scaled factory program.'
