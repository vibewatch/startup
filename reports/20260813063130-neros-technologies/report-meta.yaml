  topStrengths:
  - Real public customer proof exists across the U.S. Army, U.S. Marine Corps, Ukraine-coalition demand, and allied expansion pathways.
  - Project Millennium and the China-light sourcing narrative give Neros strategic relevance in the U.S. drone reindustrialization thesis.
  - The company has already attracted top-tier venture and defense-aligned capital, including Sequoia Capital and ASTF, at a meaningful scale.
  - The roadmap is broadening beyond a single FPV product into autonomy and counter-UAS adjacencies such as Archer AI and Bandit.
  - The ceiling for upside is real if Neros can translate factory scale, product breadth, and customer pull into disclosed economics.
  topRisks:
  - Recognized revenue, gross margin, cash burn, funded backlog, and Series C preference terms are not publicly disclosed.
  - Manufacturing scale-up is the core execution risk because the company is publicly targeting one million drones per year by 2028.
  - Customer concentration remains high around government and coalition channels, especially the Army-led procurement path.
  - Autonomy-policy and export-control risk remain material as Neros expands into more autonomous systems and allied channels.
  - The current valuation already assumes significant execution progress before that progress is visible in audited public economics.
  unresolvedGaps:
  - No public quarterly financial statements, program-level margins, burn rate, or cash runway disclosure.
  - No public cap table, liquidation preference, or anti-dilution detail for the Series C.
  - No public backlog conversion schedule or customer concentration by revenue.
  - No public factory KPI pack covering throughput, utilization, yield, scrap, or supplier redundancy under Project Millennium.
  - No public autonomy safety-case or export-control package detailed enough to fully underwrite roadmap policy risk.
