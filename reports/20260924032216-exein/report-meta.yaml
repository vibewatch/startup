companyProfile:
  summary: >-
    Exein is a Rome-based Physical AI cybersecurity company founded in 2018 that sells embedded
    runtime security for device makers, silicon vendors, and operators in robotics, automotive,
    industrial, energy, healthcare, and semiconductor environments. Public materials describe a
    product stack centered on Runtime, Analyzer, and Photon, with a telemetry-driven security
    model roadmap, and the company says it protects more than two billion devices. The latest
    public financing put Exein at a $1.7 billion valuation after a $270 million round in
    September 2026.
