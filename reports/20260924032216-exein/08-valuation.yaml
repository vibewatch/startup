      - ["Valuation stance", "Stretched", "The $1.7B price sits on top of rapid multiple expansion and still-limited public financial detail.", "Entry discipline should require either a lower price or more proof."]
      - ["Decision implication", "Research more / hold", "The business looks strategic, but the price already assumes a lot of future success.", "Only step in on better evidence or a reset mark."]
    notes: "Synthesized from cited public announcements and market-data pages; assessment rows are directional and not management guidance."
    claimRefs: [CV001, CV003, CV007, CV008]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns: ["Argument", "What would change the view", "Evidence anchor"]
    rows:
      - ["Thesis: device-level runtime security maps well to physical AI", "If partner conversion stalls or the runtime layer proves easy to replicate, the moat shrinks.", "Photon, the 2B-device footprint, and the 5,000-attacks-per-week claim show real operating relevance."]
      - ["Thesis: the financing depth suggests strategic value", "If the oversubscribed round turns out to have weak follow-on support, the strategic signal weakens.", "The $270M round came with new blue-chip investors and an upsized credit facility."]
      - ["Anti-thesis: the mark may be ahead of public fundamentals", "If current ARR, gross margin, and customer concentration are stronger than implied, the discount narrows.", "Public sources still only show a prior $23M revenue snapshot and a 35x revenue multiple on the earlier mark."]
    notes: "Qualitative synthesis; the rows are valuation arguments, not a literal quote of market prices."
    claimRefs: [CV002, CV004, CV007, CV008, CV009, CV010]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bear", "ARR growth cools, public disclosure stays thin, and security multiples compress.", "Downside if the market decides the $1.7B mark was priced for perfection.", "Margin opacity, preference overhang, and slower commercial conversion.", "Use if follow-on data fail to match the headline growth."]
      - ["Base", "Device-scale adoption continues, but the company remains expensive because disclosure stays limited.", "The current mark mostly holds; upside comes from growth catching up to price.", "Current ARR and gross margin are not publicly grounded.", "Most consistent with today's evidence."]
      - ["Bull", "Physical-AI security becomes a default layer and Exein keeps converting chip and OEM relationships.", "A premium embedded-security multiple can persist or expand if execution stays strong.", "Execution risk remains, but category leadership offsets it.", "Needs sustained ARR growth and visible partner conversion."]
    notes: "Scenario bands are heuristic and anchored to disclosed funding marks, public revenue multiples, and qualitative growth signals; they are not management guidance."
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV012]
