      - number: '6.2'
        title: 采纳轨迹与规模信号
        blocks:
          - type: paragraph
            body: >-
              最显著的产品采纳信号来自规模声明，而非具名的标杆客户案例。Exein 称其保护超过二十亿台设备，每周监测到约 5,000 次新增非重复攻击，并将其归因为伴随 Physical AI
              市场扩容而爆发的机器级威胁激增。BusinessWire 与 EU-Startups 亦报道其 H1 2026 ARR 同比增长 4x，估值达到 $1.7 billion；TechCrunch
              补充指出，公司称该增长依托与 OEM 及芯片厂商的直接合作维系。因此，采纳叙事融合了装机规模触达、威胁密度上升与快速商业扩张，但信源仍未披露设备统计口径背后的分母，亦未透露从试点项目转化为长期生产部署的转化率。
