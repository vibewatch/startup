  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 客户客群与采购决策中心
        blocks:
          - type: paragraph
            body: >-
              Exein 的获客打法以设备制造商为核心，而非面向后期的纯软件采购方。最明确的公开商业化路径为 OEM 与芯片厂商主导的市场拓展方式：TechCrunch 报道称 Exein 自 2018
              年起便直接与制造商合作，Exein
              自身资料亦将产品描述为内置于设备内部的运行态防护。其覆盖行业同样广泛，但多停留在行业大类口径：航空航天、汽车、工业自动化、能源、医疗、半导体、机器人与互联基础设施在多份资料中反复出现。这种跨度显示，核心买方通常是设备制造商或运营商内部的工程或安全团队，采购决策与固件、合规及部署环节紧密绑定，而非作为独立的
              SaaS 工具采购。
