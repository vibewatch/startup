  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 风险全景与核心逻辑破局点
        blocks:
          - type: paragraph
            body: >
              Exein
              的首要风险不在于需求是否成立，而在于执行深度。公司在推进美国与亚太扩张的同时，同步发力内核级运行态产品、专有基础模型以及更大规模的并购议程。若产品能持续兼容各类异构嵌入式目标，这一组合将极具杀伤力；但一旦
              Agent 引入延迟、破坏设备工作流，或无法跟上 Exein
              自述监测到的庞大攻击量，下行情景的破坏力也将随之加剧。理性的判断是，业务增长本身扩大了爆炸半径：设备更多、遥测数据更大、司法管辖区更多，资本结构也更为复杂。任何表明公司在规模化过程中无法保持设备兼容性、部署可靠性或合规纪律的迹象，都将构成对投资核心逻辑的实质性破坏。[CR001,
              CR002, CR004, CR005, CR006]
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >
              法律与合规核心涉及欧盟《网络韧性法案》（EU Cyber Resilience Act，CRA）、遥测数据治理，以及将安全 Agent 委以观察并偶尔阻断机器行为权限时引发的产品责任问题。Exein
              自身资料显示客户需要 CRA
              对标映射与固件分析，但若映射不完备或现场升级工作流出现故障，该能力同样会招致法律责任。公司还宣称其基础模型将基于覆盖庞大设备集群的机器遥测数据进行训练，一旦系统在欧洲以外进行商业化推广，势必引发涉及数据最小化、数据留存与跨境传输的合规质疑。这一风险属于可控范围，前提是
              Exein 能够拿出完备的控制文档、区域化数据处理方案，以及可供客户与监管机构审计的标准化应急响应流程。[CR011, CR012, CR013, CR015, CR016]
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR013
              - CR015
              - CR016
              - CR003
              - CR005
              - CR011
              - CR012
      - number: '7.3'
        title: 运营、合作伙伴与融资风险
        blocks:
          - type: paragraph
            body: >
              运营风险在于 Exein 的产品必须同时适配各类运行环境：嵌入式 Linux、RTOS 邻接环境、低功耗硬件以及碎片化的内核版本。访谈资料明确指出公司重度依赖 eBPF、Rust、Linux 底层机制与内核级
              Hook；这固然构筑了坚实的技术壁垒，但也意味着可移植性
              Bug、验证器（verifier）失败以及过高的系统开销极易演变成直接波及客户的线上事故。第二层风险源于依赖性：公司正全面拓宽在半导体、工业计算与互联基础设施领域的合作关系，同时亚太地区似乎构成了重要的营收基本盘，且新增融资方案明确用于支持并购整合。在实操中，一票否决指标（kill
              criteria）清晰可见：若设备兼容性恶化、误报率激增，或合作伙伴与放贷机构延缓其扩张计划，增长叙事将变得极难维系。[CR003, CR004, CR005, CR006, CR007, CR008,
