      - number: '1.3'
        title: 资本基础、规模信号与里程碑路径
        blocks:
          - type: paragraph
            body: >-
              最新一轮融资是最明确的公开证据，显示 Exein 已从小众嵌入式安全厂商转变为资金充裕的赛道领跑者。公司称其以 $1.7 billion 估值完成 $270 million 融资，由 Headline
              领投，Sofina、Goldman Sachs、EIB Group（经由 ETCI）、KfW Capital、T.Capital 及老股东跟投，同时扩大了由 J.P. Morgan 牵头、KfW
              新增为贷款方的前期循环信贷额度。该笔融资伴随着极具进取性的产品与路线图声明：2026 年早些时候推出的内核级运行态架构 Photon；基于超过 2 billion 台设备遥测数据训练的专有基础模型；预计 2026
              年底前推出的 Agent 安全架构；以及定于 Q1 2027 发布的首批基础模型。Exein 还表示 H1 2026 ARR 达到上年同期的四倍，且每周监测到约 5,000
              次新增非重复攻击，这合理解释了公司进军美国与亚太市场、并以物理世界安全作为主打诉求的动因。当前尽调关注点并非故事真实性，而是资本结构、客户基础与董事会控制权究竟有多少仍隐蔽在未上市公司信息披露限制之后。
