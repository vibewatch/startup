  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争态势
        blocks:
          - type: paragraph
            body: >
              审阅资料勾勒出一个高度分散的市场，而非单一赛道正面对决。Tracxn 数据显示 Exein 拥有 316 家活跃竞争对手，其中 93 家获得融资，40 家实现退出；其排名前 10
              的对手涵盖物联网可见性、设备安全、供应链安全、PKI、车辆安全及边缘安全厂商。这种分散格局意味着买方可借助综合平台、单点方案、内部自研或相邻信任层解决部分相同诉求。Exein
              自身的定位更为聚焦深入：它直接防护设备端固件与运行态执行，而更广泛的市场仍充斥着位于设备层之上、或完全未能触达运行态边界的替代方案。
