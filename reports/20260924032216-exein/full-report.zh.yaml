      - number: '2.3'
        title: 买方图谱、采纳路径与未决盲点
        blocks:
          - type: paragraph
            body: >-
              可能的采纳路径主要穿透设备制造商及其工程组织。机器人、无人机、自动驾驶车辆、工业自动化、医疗、半导体、航空航天及互联基础设施频繁出现于公司叙事，但预算所有者通常是负责交付与防护设备本体的团队。这导致产品采纳高度依存于固件集成、验证周期以及与
              OEM
              平台团队建立的信任。最大的制约因素并非认知度，而是运行态安全必须接入既有硬件路线图，同时不能拖慢认证或部署流程。本章尚未解决的盲点在于缺乏独立测算：信息池包含较强的公司自报信号，但尚无第三方市场报告能够按行业与地域清晰量化
              Physical AI 运行态安全的 TAM、SAM 或 SOM。
