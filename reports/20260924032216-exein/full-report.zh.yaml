            body: >-
              相比具名的最终客户，公开佐证在合作伙伴与平台维度更为清晰。Arm 合作伙伴名录中收录了 Exein，Exein 官方材料亦宣称其已防护 600k 台 Arm 设备，并分析了 100k
              台独立设备。与此同时，审阅资料并未列出广泛的付费客户名单，亦未区分试点项目与生产环境部署，因此公开记录对渠道或生态合作叙事的支撑，明显强于对客户 Logo
              背书的支撑。这本身并不构成负面信号，但确实意味着客户验证维度的尽调标准依然严苛。
