      - number: '6.4'
        title: 业务持久度、扩张前景与集中度风险
        blocks:
          - type: paragraph
            body: >-
              客户维度的核心风险并非 Exein 缺乏触达能力，而是公开证据尚未证实这种触达的黏性究竟有多强。FoundedCEO
              的分析明确指出，营收、客户集中度、留存率、攻击拦截基准性能及商业运营表现均未公开，其余公开资料同样极少提及续约率或流失率数据。Exein
              向美国、亚太、日本、韩国的地域扩张以及未来设立的湾区办公室，展现出“客单拓展（land-and-expand）”态势，但也引发了集中度疑虑：若业务分散于各区域与 OEM
              渠道，或具较好韧性，但公开记录并未显示少数几家合作伙伴或细分行业是否贡献了绝大部分使用量或收入。因此，审慎的结论是：采纳迹象看似真实，但留存率与集中度仍基本未经证实。
