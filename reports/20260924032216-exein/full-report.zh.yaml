      - number: '8.3'
        title: 情景假设、可比公司与尽调清单
        blocks:
          - type: paragraph
            body: >
              严谨的估值框架须将赛道宏图与入场纪律审慎区分。在乐观情景（Bull Case）下，Exein 成为 Physical AI 的默认安全底座，市场持续给予该业务高溢价的嵌入式安全估值倍数。在中性基准情景（Base
              Case）下，业务持续扩张，但因公开证据仍存存疑空间，估值基本维持在现有水平。在悲观情景（Bear
              Case）下，营收增速放缓，市场压缩成长期安全标的的估值倍数，或在若干关键垂直行业的商业化受阻。资料库中的可比公司指向中后期未上市网络安全标的群体，但核心尽调核实点依然明确：当期
              ARR、毛利率、客户集中度，以及表面交易价格之下的底层资本结构。
