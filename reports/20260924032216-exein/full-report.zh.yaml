  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 收入模式与商业化
        blocks:
          - type: paragraph
            body: >-
              Exein 的财务画像更贴近具备多重变现层级的设备级软件企业，而非单纯的服务或硬件公司。资料始终强调固件内置的运行态安全、Photon
              内核级架构，以及未来基于装机遥测训练的安全模型，这些特征共同指向企业订阅或按设备授权模式，而非消费级打包形式。最明确的公开商业化替代指标是 ARR
              增速、已披露的地域收入结构，以及公司在美国与亚太地区的扩张规划。信源尚未透露的是 Exein
              是按设备、按项目、按部署计费，还是采用混合合同模式。这一信息的缺失至关重要，因为毛利率走向取决于业务规模化主要依赖纯软件分发，还是仰赖人力密集型的集成与支持。
