      - number: '5.3'
        title: 部署落地、技术路线图与工程风险
        blocks:
          - type: paragraph
            body: >
              在部署方式上，Exein 的资料显示其产品旨在融入既有 OEM
              与固件工作流，而非强推整体替换。公开报道称公司与固件团队及芯片级集成点协同合作，运行态组件可在极低系统开销下覆盖资源受限设备、智能手机、服务器与容器。这种广泛的适配能力固然引人瞩目，但也令尽调重点转向兼容性、可支持性，以及该安全模型能否跨设备品类和操作系统保持一致行为的实际证据。


              主要风险敞口不在于产品是否存在——其存在性毋庸置疑。真正的风险在于审阅证据在多大程度上能够证明其已具备生产就绪度。2023 年的 Pulsar
              文档描绘了宏大的路线图，但并未提供能够解答受监管客户落地疑问的公开认证矩阵、基准性能包或支持等级细节。同样，Physical AI 叙事高度依赖遥测数据规模与未来的自主
              Agent，虽具吸引力，却在模型治理、隐私保护以及区分前景路线图与成熟加固产品的管控措施上留下了未决疑问。这些正是技术买方仍须深入核实的盲点。
