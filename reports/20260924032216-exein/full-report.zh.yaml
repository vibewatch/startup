            body: >-
              既有证据尚不足以支撑单一明确的 TAM 数值，因此本章采用多重视角进行边界界定。第一个视角为装机量基数：Exein
              称其触达超过二十亿台联网设备，这代表可触达设备集群的上限，而非已商业化的付费客户数。第二个视角为紧迫性：公司称目前每周监测到约 5,000
              次新增非重复攻击，达到上年同期的五倍，证实了运行态响应的实用价值。第三个视角为商业 traction：融资轮次、$1.7 billion 估值以及据称 H1 2026 ARR 取得的 4x
              增长，显示买方已在为该品类买单。这些数据均不直接等同于市场规模，但共同勾勒出一个规模可观、活跃且仍处于早期阶段的服务可用市场。
