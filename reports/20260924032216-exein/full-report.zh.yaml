      - number: '4.3'
        title: 资本结构与融资依赖
        blocks:
          - type: paragraph
            body: >-
              基于现有证据，Exein 资金储备充足。公司于 2025 年募资 €100 million，随后在 2026 年宣布以 $1.7 billion 估值完成 $270 million 轮次融资，并扩大了与 J.P.
              Morgan 及 KfW
              合作的循环信贷额度。这种组合意味着其兼具股权与类债流动性支持，降低了短期融资风险，为持续招聘、深化合作以及开展并购提供了操作空间。需要警惕的是，这笔资金正投向高成本的扩张优先级：进军美国市场、扩大亚太规模、设立旧金山湾区办公室以及持续推进产品研发。最新行业评论亦指出，若公司无法将融资势能转化为稳固的市场份额，将面临稀释风险。由于资料未披露在手现金、跑道长度或契约条款，对其资本充足性的结论仅在方向上偏向积极，尚无法完成充分核验。
