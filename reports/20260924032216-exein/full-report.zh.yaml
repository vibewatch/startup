chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、业务版图与产品栈
        blocks:
          - type: paragraph
            body: >-
              Exein 当前的公开定位在非上市基础设施初创企业中表现出少有的清晰度：公司称其依托驻留设备端的运行态防护保障 Physical AI 系统安全，其官网将这一承诺落实为具体产品，而非空泛的品牌宣传语。官网首页将
              Exein Runtime 定位为面向 Physical AI 系统、Linux 环境及 RTOS 设备的实时安全层，Exein Analyzer 则专注于构建环境内部的固件分析与修复。相关资料同时将公司定位为
              Physical AI 安全厂商，在罗马、卡尔斯鲁厄、台北及旧金山设有分支机构，业务覆盖机器人、无人机、自动驾驶车辆、工业设备与关键基础设施。公司还给出了当前规模概览：About 页面显示员工 40+
              人，营销宣传中提及运行态保护设备超 1B+ 台，而在后续融资材料中则引用了更大的遥测数据基数。这些信息足以确认 Exein 是一家真实的嵌入式安全运营商，而非停留在概念阶段的 AI
              叙事，但关于规模的表述应视作公司单方口径，而非经审计的运营数据。
