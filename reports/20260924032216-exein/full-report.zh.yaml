            body: >-
              最强有力的财务证据偏向增长维度，但主要基于公司自述。Exein 声称营收同比增长 5x、H1 2026 ARR 同比增长
              4x，联网设备覆盖量超过二十亿台。这些数据反映出切实存在的市场需求拉动，但尚不足以支撑盈利能力判定，因为资料中未公开毛利率、现金消耗率或客户集中度数据。两年内估值攀升 30x
              进一步强化了市场叙事，但这属于资本市场信号，而非运营效率的佐证。关键未决问题在于营收质量的改善能否跟上规模扩张步伐。若软件经济模型成立，庞大的遥测基数理应带来复利式的产品壁垒与正向经营杠杆；反之，高速增长背后可能掩盖着昂贵的实施、渠道或数据成本。
