  - id: TV001
    title: 投资建议汇总表
    columns:
      - 评估维度
      - 研判结论
      - 证据锚点
      - 决策含义
    rows:
      - - 投资建议
        - 保持跟踪
        - 规模体量属实，但公开证据尚不足以支撑在当前估值下直接买入。
        - 等待更详尽的信息披露或更优入场时机。
      - - 置信度
        - 中
        - 融资与设备规模声明证据充分，但运营层面的商业模型仍不透明。
        - 列入观察名单，暂不作为充分核保的建仓标的。
      - - 风险评级
        - 高
        - 估值水位、优先清算权结构不透明以及商业化落地节奏均暗含实质性下行风险。
        - 在利润率与 ARR 披露改善前，审慎控制头寸规模。
      - - 估值立场
        - 偏高
        - $1.7B 定价建立在估值倍数迅速扩张且公开财务细节依然有限的基础之上。
        - 入场纪律要求更低价格或更充分的证据支撑。
      - - 决策含义
        - 深化尽调 / 观望
        - 业务具备战略价值，但该价格已过多透支未来预期。
        - 仅在出现更有力证据或估值回调时考虑介入。
    notes: 基于所引用的公开公告与市场数据页面综合提炼；研判行仅具方向参考意义，非管理层业绩指引。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
  - id: TV002
    title: 核心逻辑与反向逻辑对比表
    columns:
      - 论点
      - 观点反转触发条件
      - 证据锚点
    rows:
      - - 核心逻辑：设备级运行时安全契合物理 AI 需求
        - 若合作伙伴转化停滞，或运行时层被证实极易复刻，护城河将随之收窄。
        - Photon、2B 设备覆盖以及每周 5,000 起攻击的声明，印证其实际业务关联度。
      - - 核心逻辑：融资深度折射战略价值
        - 若超额认购轮次后续缺乏持续跟投支持，该战略信号将大打折扣。
        - $270M 融资引入了新增蓝筹投资方，并获得上调后的信贷额度。
      - - 反向逻辑：当前估值可能超前于公开基本面
        - 若当前 ARR、毛利率与客户集中度优于隐含预期，折价空间将收窄。
        - 公开信源仍仅显示前期 $23M 营收切片及上一轮估值对应的 35x 市销率。
    notes: 定性综合分析；各行属估值论证，非市场报价的逐字引用。
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景推演表
    columns:
      - 情景
      - 假设条件
      - 估值与回报逻辑
      - 核心风险
      - 概率倾向
    rows:
      - - 悲观
        - ARR 增长放缓，公开信息披露依然匮乏，网络安全行业估值倍数出现收缩。
        - 若市场认定 $1.7B 定价透支了完美预期，将面临下行压力。
        - 利润率不透明、清算优先权潜在稀释以及商业化转化放缓。
        - 若后续追踪数据不及头条宣传的高增速，可参考此情景。
      - - 基准
        - 设备规模化采纳持续推进，但因披露受限，估值依旧高企。
        - 当前估值基本维系；上行动力取决于业绩增长逐步消化高估值。
        - 当前 ARR 与毛利率缺乏公开扎实佐证。
        - 与当前已有证据最为契合。
      - - 乐观
        - 物理 AI 安全成为默认标准层，Exein 持续转化芯片与 OEM 合作关系。
        - 若执行力保持强劲，嵌入式安全领域的溢价估值倍数有望维系甚至进一步扩张。
        - 落地执行风险依然存在，但细分赛道领军地位可对冲该风险。
        - 需依赖持续的 ARR 增长及清晰可见的合作伙伴转化。
    notes: 情景区间属启发式测算，锚定已披露融资估值、公开市销率及定性增长信号；并非管理层业绩指引。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV007
      - CV012
