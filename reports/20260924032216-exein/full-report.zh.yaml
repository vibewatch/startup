      - number: '5.2'
        title: 架构与运行模式
        blocks:
          - type: paragraph
            body: >
              审阅资料中所述架构以内核为中心且具模块化特性。Exein 表示该产品借助内核边界的 eBPF 探针监控设备活动，随后将事件转发至用户空间规则引擎，将匹配项标记为威胁。Pulsar
              文档对此提供了佐证，包含具体的安装运行路径、对启用 BPF 与 BTF 的 Linux kernel 5.5
              或更高版本的硬性要求，以及旨在支持新模块与自定义规则的模块化设计。换言之，该平台的构建逻辑显现为优先保障设备深度可见性，其次提供策略编排。


              上述资料亦展示了清晰的分层策略：基础运行时负责观测与响应；Photon 在内核级补充先发制人的阻断能力；全新的 Physical AI 模型层则将机器遥测数据转化为面向未来的自主安全系统。这一区分十分重要，说明
              Exein 并非替代其原始产品，而是向上延伸能力。不过公开路线图仍需持续跟踪：虽然官方宣称支持广泛的硬件与操作系统，但审阅资料尚未完全记录各发布系列的具体适配范围。
