      - number: '1.2'
        title: 管理团队、治理架构与关键人员依赖
        blocks:
          - type: paragraph
            body: >-
              Exein 披露的管理层结构精简且以创始人为核心。About 页面列出 Gianni Cuozzo 担任 CEO 兼创始人，Giovanni Alberto Falcione 担任 CTO，Gerardo
              Gagliardo 担任 CFO，Gary Walshe 担任 CCO；此配置为向工业与物理世界系统销售嵌入式安全平台的公司提供了可靠运营骨干。团队披露在职能覆盖上较为完备：产品与技术方向由创始人及 CTO
              把控，财务由 CFO 负责，商业拓展由 CCO
              统领。该团队背后的治理层依然薄弱。本次审阅的公开资料并未披露现任董事会成员名单或专门委员会架构，外部尽调仍须结合融资公告与高管介绍推断控制权分配。随着公司募集大额成长期资金并扩大债务额度，接班人计划、董事会权利与人才留存深度相比规模较小的自筹资金软件公司更为关键。
