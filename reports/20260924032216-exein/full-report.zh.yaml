  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品形态与运维工作流
        blocks:
          - type: paragraph
            body: >
              Exein
              公开的产品叙事始于设备端安全运行环境，而非云端控制平面。最清晰的客户工作流是：OEM、开发者或设备运营商需要就地监控嵌入式系统，在代码运行时检测可疑行为，随后将信号直接输入应急响应流程，而非事后调取日志审查。审阅资料将
              Exein Runtime 描述为面向物联网与边缘设备的 Linux 及 RTOS 级产品，系统设计紧扣威胁检测、响应与低开销部署。这使产品紧贴固件、内核与运行态策略交汇的机器边界。


              该技术栈在更广维度上还包含开源生态。Pulsar 作为核心运行态安全 Agent 及面向开发者的开源项目呈现，工程师可通过代码、文档和仓库动态直观理解该产品家族。Exein 的对外宣传将该核心能力延展至
              Photon——一种旨在攻击发生前阻断恶意执行的先发制人式运行态架构，并融入强调机器人、无人机、自动驾驶车辆及各类物理世界执行系统的 Physical AI
              叙事。最终形成的产品线属于分层设计而非单体架构：一部分负责运行态强制执行，一部分负责可观测性，另一部分则面向未来的自主化安全。
            claimRefs:
              - CE001
              - CE002
              - CE004
