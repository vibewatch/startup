      - number: '8.2'
        title: 融资与运营佐证
        blocks:
          - type: paragraph
            body: >
              融资历程佐证了 Exein 已成长为赛道代表性资产，但也反映出其估值重定价的幅度之大。公司从 2025 年 7 月的 €70M Series C 轮，到 2025 年 12 月募资 €100M，再到 2026 年
              9 月完成 $270M 轮次。Exein 称最新一轮获得大幅超额认购，并搭配了上调额度的循环信贷；同时公司还声称全网保护超过 2B 台设备，每周监测到 5,000
              次新增攻击。这些提供了规模维度的有力佐证，然而投资承销的核心疑问在于，该规模能否转化为持久的定价权与利润率空间。
            claimRefs:
              - CV002
