  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资观点
        blocks:
          - type: paragraph
            body: >
              Exein 展现出扎实运营势能，属于高质量嵌入式安全标的；但当前入场价格要求保持耐心，而非盲目买入。最具说服力的看多依据在于设备级规模部署、新增 $270M 融资，以及管理层声称 H1 2026 ARR
              同比增长达四倍。主要的看空逻辑在于，公开记录仍未展现充分的当期运行率细节、利润率细节或清偿优先权结构，难以令人信服地对 $1.7B
              估值进行承销。综合评估，适宜的策略是保持跟踪：该业务极具战略价值，但现有估值已预支了大量未来预期。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
