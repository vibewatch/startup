  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              此处的市场并非通用企业网络安全。公司与第三方一致将 Exein 定位为面向 Physical AI
              的设备级或运行态安全产品：即直接驻留于联网机器内部固件或内核层、在代码实际执行处运行的软件。其核心意义在于，采购方通常是 OEM、嵌入式平台或产品安全团队，而非事件发生后采购云端工具的集中式
              SOC。纳入考量的支出主要集中在固件加固、运行态阻断、遥测驱动的安全响应与设备可信度。最直接的替代方案包括内部自研固件安全、芯片厂商安全栈，以及位于设备层之上的通用云或网络安全方案。实际的市场边界，由无法等待人工干预的自主或联网硬件所附属的安全预算决定。
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
