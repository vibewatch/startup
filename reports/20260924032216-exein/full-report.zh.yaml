      - number: '3.3'
        title: 护城河持久性与被替代风险
        blocks:
          - type: paragraph
            body: >
              竞争风险并不在于出现完全一致的竞品复制者，而在于捆绑销售压力、维持现状的内部自研习惯，以及相邻领域厂商向同一预算条目的逐步渗透。信源中未见公开标价，因此与买方的沟通更偏向定制报价而非固定刊例价；这使技术契合度与部署阻力相比标牌价格更为重要。与此同时，赛道足够拥挤，买方可以在不同层级间选用多家供应商，或联合采用设备可见性、PKI、供应链审查与
              OEM 内部控制来推迟整体替换。因此，护城河虽然真实存在，却附带前提条件：Exein 必须保持运行态层的黏性，同时证明自身绝非大型综合平台套件中的又一个附加工具。
