companyProfile:
  summary: >-
    Exein 成立于 2018 年，总部位于罗马，是一家 Physical AI 网络安全公司，向机器人、汽车、工业、能源、医疗及半导体领域的设备制造商、芯片厂商与运营商销售嵌入式运行态安全软件。公开资料显示其产品栈以
    Runtime、Analyzer 和 Photon 为核心，并规划了遥测驱动的安全模型路线图；公司称其保护超过二十亿台设备。2026 年 9 月完成 $270 million 轮次后，最新公开融资将 Exein 估值推至 $1.7
    billion。
