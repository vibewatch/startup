    title: Regulatory / legal risk register
    columns: [Rule, Jurisdiction / case, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["CRA compliance / product-liability failure if vulnerability mapping or runtime blocking misfires", "EU", "In force and expanding", "Medium", "High", "Signed update pipeline, legal review, and customer deployment gates", "High until independent validation of coverage and false-positive / false-negative rates", "Request CRA mapping memo, product assurance tests, and incident-handling playbook"]
      - ["Telemetry privacy and cross-border transfer risk for model training on device telemetry", "EU / UK / APAC / US", "Emerging as model training scales", "Medium", "High", "Data minimization, regional processing, retention controls, and DPA review", "Medium-high because no public controls are disclosed", "Ask for data-flow diagrams, DPA, retention, and model-training policy"]
      - ["Defense / critical-infrastructure procurement and export-control screening", "EU / US / APAC", "Evolving with new regions and sectors", "Medium-low", "Medium-high", "Counsel review, counterparty screening, and jurisdiction-specific sales controls", "Medium pending classification and end-user checks", "Request export-control classification and restricted-end-use policy"]
    notes: Regulatory rows are risk judgments, not disclosed company metrics; status reflects public evidence and current expansion plans, and null would mean the company has not publicly disclosed the control or process asked for.
    enumerationScope:
      coverage: partial
      basis: Publicly disclosed legal and compliance risks visible in the 2026 evidence pack and expansion coverage
    claimRefs: [CR013, CR015, CR016, CR003, CR005, CR011, CR012]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Kernel portability and verifier failures across fragmented embedded Linux kernels", "High", "High", "Medium", "High", "Representative kernel and architecture test matrix across target deployments"]
      - ["Runtime overhead, false positives, or event flooding on constrained devices", "Medium-high", "High", "Medium", "Medium-high", "Target-hardware benchmarks with drop-rate, CPU, and RSS evidence"]
      - ["Model or agentic-security rollout failure, including unsigned updates or bad rollback behavior", "Medium", "High", "Medium", "Medium-high", "Signed rollout, staged deployment, and rollback drills for field devices"]
    notes: These are inferred failure modes from the public architecture and hiring signals; likelihood and severity are qualitative, and the unresolved-gap column marks what is still not publicly demonstrated.
    claimRefs: [CR004, CR009, CR010, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty / ecosystem, Role, Concentration / exposure, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["OEM / semiconductor / industrial-computing integrations", "Device makers and channel partners", "Go-to-market and technical distribution", "High because product compatibility is a prerequisite", "A partner certification delay or integration bug slows deployments", "High", "Multiple integration paths and a broader support matrix", "Medium-high"]
      - ["APAC revenue and operating concentration", "APAC customers and regional offices", "Revenue base and execution footprint", "Around half of revenue is said to come from APAC", "Regional slowdown or compliance issue hits growth", "High", "Local entities, regional staffing, and broader pipeline diversification", "Medium"]
      - ["Credit facility and late-stage investor backing", "J.P. Morgan, KfW, and the wider syndicate", "Liquidity backstop and M&A support", "Important for acquisition pace and balance-sheet flexibility", "Refinancing or covenant pressure narrows the M&A window", "High", "Conservative acquisition sizing and alternative financing options", "Medium-high"]
      - ["Named customer validation versus true customer diversification", "Nvidia, Leonardo, AWS, Mediatek, Arm", "Reference value and sales proof", "Public logos are visible but dollar concentration is undisclosed", "A few logos overstate real diversification", "Medium-high", "Request revenue concentration and renewal data", "Medium"]
    notes: Exposure levels are inferred from public disclosure and expansion plans; concentration metrics are not publicly quantified, so the table distinguishes visible logos from undisclosed revenue mix.
    claimRefs: [CR001, CR005, CR006, CR007, CR008, CR010]
