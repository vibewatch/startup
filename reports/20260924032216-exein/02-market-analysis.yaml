company:
  name: "Exein"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Exein is selling device-level runtime security for physical-AI and connected systems, so the market boundary sits closer to embedded/OEM security budgets than to generic SOC or cloud security spend. The evidence in the pool supports a constrained sizing view: the reachable installed base is large, adoption is still early, and the most credible demand signals are company-reported device footprint, attack volume, and ARR acceleration rather than a single independent TAM figure."
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: "The market here is not general enterprise cybersecurity. The company and third parties consistently frame Exein as device-level or runtime security for physical AI: software that runs where code actually executes, on firmware or kernel layers inside connected machines. That matters because the buyer is usually an OEM, embedded-platform, or product-security team, not a central SOC buying cloud tools after an incident. The included spend therefore sits around firmware hardening, runtime blocking, telemetry-driven security response, and device trust. The closest substitutes are in-house firmware security work, chip-vendor security stacks, and generic cloud or network security that sits above the device. The practical market boundary is the security budget attached to autonomous or connected hardware that cannot wait for human remediation."
    claimRefs: [CM001, CM002, CM009, CM010, CM011]
    tableRefs: [TM001]
  - id: "sizing-lenses"
    title: "Sizing lenses and demand signals"
    body: "The assigned evidence does not justify a single clean TAM number, so the chapter uses constrained lenses instead. The first lens is the installed base: Exein says it reaches more than two billion connected devices, which is an upper bound on reachable fleets rather than monetizable accounts. The second lens is urgency: the company says it now sees about 5,000 new non-repetitive attacks a week, five times the prior year, which supports why runtime response is valuable. The third lens is commercial traction: the funding round, the $1.7 billion valuation, and the reported 4x H1 2026 ARR growth indicate that buyers are already paying for the category. None of these numbers equals market size, but together they bound a serviceable market that is large, active, and still early."
    claimRefs: [CM003, CM004, CM005, CM006, CM008, CM012]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: "buyers-and-gaps"
    title: "Buyer map, adoption path, and open gaps"
    body: "The likely adoption path runs through device makers and their engineering organizations. Robotics, drones, autonomous vehicles, industrial automation, healthcare, semiconductors, aerospace, and connected infrastructure all appear in the company narrative, but the budget owner is usually the team responsible for shipping and protecting the device itself. That makes adoption dependent on firmware integration, validation cycles, and trust with the OEM’s platform team. The biggest constraint is not awareness; it is that runtime security must slot into an existing hardware roadmap without slowing certification or deployment. The remaining gap in this chapter is independent sizing: the pool contains strong company-reported signals, but no third-party market report that cleanly quantifies TAM, SAM, or SOM for physical-AI runtime security by vertical and geography."
    claimRefs: [CM006, CM007, CM009, CM010, CM011, CM012]
    tableRefs: [TM003]
