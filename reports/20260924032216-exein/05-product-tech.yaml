figures:
  - id: FE001
    title: Product architecture stack
    type: stack
    layout: wide
    summary: A layered view of Exein’s device-side runtime, Photon, and telemetry-driven Physical AI roadmap.
    data:
      layers:
        - label: Device / OEM environment
          detail: Embedded Linux, RTOS, and connected devices where Exein is deployed.
        - label: Kernel boundary
          detail: eBPF probes intercept device activity before userspace policy runs.
        - label: Pulsar observability
          detail: Modular runtime modules collect process, file, and network events.
        - label: Rules engine
          detail: Userspace policy evaluation marks suspicious activity as threats.
        - label: Runtime response
          detail: Incident response and logging surface the threat to operators.
        - label: Photon preemption
          detail: Kernel-level blocking layer designed to stop malicious execution earlier.
        - label: Telemetry fabric
          detail: Behavioral data drawn from deployed devices and long-running operations.
        - label: Foundation-model training
          detail: Two years of telemetry inform the Physical AI security model.
        - label: Agentic security layer
          detail: Future autonomous security agents act on model outputs.
        - label: Firmware / OEM integration
          detail: Device and chipset teams fit the runtime into existing product stacks.
        - label: Community support surface
          detail: Docs, GitHub issues, discussions, and community channels for practitioners.
        - label: Roadmap extensions
          detail: Planned support spans FreeRTOS, Yocto, RISC-V, OpenWRT, Windows, Kubernetes, and OPA.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE010, CE011, CE012, CE013]
