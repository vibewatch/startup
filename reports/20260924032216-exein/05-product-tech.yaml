chapter:
  number: 5
  title: Product & Technology
  summary: Exein’s product stack is a device-side runtime security platform that spans open-source Pulsar, the Runtime product, and newer Photon and Physical AI layers. Public evidence supports a kernel-centric, telemetry-driven architecture, but the reviewed sources are still thin on formal certification detail, exact compatibility matrices, and model-governance specifics.
sections:
  - id: product-surface
    title: Product surface and operator workflow
    body: |
      Exein’s public product story starts with a device-side security runtime, not a cloud control plane. The clearest customer workflow is an OEM, developer, or device operator that needs to monitor embedded systems in place, detect suspicious behavior while code is running, and then route that signal into incident response rather than post-hoc log review. The reviewed sources describe Exein Runtime as a Linux- and RTOS-oriented product for IoT and edge devices, and they frame the system around threat detection, response, and low-overhead deployment. That puts the product closest to the machine boundary where firmware, kernels, and runtime policy meet.

      The broader stack also has an open-source surface. Pulsar is presented as the core runtime security agent and developer-facing project, which makes the product family legible to engineers through code, docs, and repository activity. Exein’s public messaging extends that core into Photon, a preemptive runtime architecture aimed at blocking malicious execution before an attack runs, and into a Physical AI narrative that emphasizes robots, drones, autonomous vehicles, and other systems that act in the physical world. The result is a product line that reads as layered rather than monolithic: one part runtime enforcement, one part observability, and one part future autonomy.
    claimRefs: [CE001, CE002, CE004, CE009, CE011, CE013]
    tableRefs: [TE001]

  - id: architecture-model
    title: Architecture and operating model
    body: |
      The architecture described in the reviewed materials is kernel-centric and modular. Exein says the product watches device activity through eBPF probes at the kernel boundary, then forwards those events into a userspace rules engine that tags matches as threats. The Pulsar documentation backs that up with a concrete install-and-run path, a requirement for Linux kernel 5.5 or newer with BPF and BTF enabled, and a modular design that is meant to support new modules and custom rules. In other words, the platform appears to be built for deep device visibility first and policy orchestration second.

      The same materials also show a clear layering strategy: the base runtime handles observation and response; Photon adds a preemptive blocking posture at the kernel level; and the newer Physical AI model layer turns machine telemetry into a future autonomous-security system. That is an important distinction because it suggests Exein is not replacing its original product so much as extending it upward. The public roadmap still matters here, though: support is announced across a broad set of hardware and OS surfaces, but the exact breadth of each release family is not fully documented in the reviewed sources.
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE008, CE010, CE013]
    figureRefs: [FE001]
    tableRefs: [TE002]

  - id: deployment-risk
    title: Deployment, roadmap, and technical risk
    body: |
      On deployment, Exein’s sources point to a product that is intended to fit into existing OEM and firmware workflows rather than force a wholesale replacement. Public coverage says the company works with firmware teams and chip-level integration points, and that the runtime is meant to span constrained devices, smartphones, servers, and containers with minimal overhead. That breadth is attractive, but it also shifts the diligence burden toward compatibility, supportability, and proof that the same security model behaves consistently across device classes and operating systems.

      The main risk surface is not whether the product exists; it clearly does. The risk is how far the reviewed evidence goes in proving operational readiness. The 2023 Pulsar documentation sketches a wide roadmap, but it does not give the kind of public certification matrix, benchmark pack, or support-level detail that would settle implementation questions for regulated customers. Likewise, the Physical AI narrative relies on telemetry scale and future autonomous agents, which is compelling but still leaves open questions about model governance, privacy, and the controls that separate a promising roadmap from a hardened product. Those are the gaps a technical buyer would still need to close.
    claimRefs: [CE008, CE010, CE012, CE013]
    tableRefs: [TE003]
