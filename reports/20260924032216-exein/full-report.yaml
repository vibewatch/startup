  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >
              The reviewed sources describe a fragmented market rather than a simple head-to-head lane. Tracxn says
              Exein has 316 active competitors, with 93 funded and 40 exited, and its top-10 includes a mix of IoT
              visibility, device security, supply-chain security, PKI, vehicle security, and edge security vendors. That
              spread matters because buyers can solve parts of the same job through broad platforms, point solutions,
              internal build, or adjacent trust layers. Exein's own positioning is narrower and deeper: it secures
              firmware/runtime execution on devices, while the broader market still includes substitutes that sit above
              the device layer or simply do not reach the runtime boundary at all.
