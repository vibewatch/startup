      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >
              The competitive risk is not one perfect clone. It is bundle pressure, status-quo internal build, and the
              slow creep of adjacent vendors into the same budget line. The sources do not show public list pricing, so
              the buyer conversation appears quote-driven rather than sticker-driven; that makes technical fit and
              deployment friction more important than posted price. At the same time, the landscape is crowded enough
              that a buyer can multi-home across layers or delay a full replacement by combining device visibility, PKI,
              supply-chain checks, and OEM-internal controls. The moat is therefore real but conditional: Exein needs to
              keep the runtime layer sticky while proving it is more than another tool in a broader platform bundle.
