  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The market here is not general enterprise cybersecurity. The company and third parties consistently frame
              Exein as device-level or runtime security for physical AI: software that runs where code actually
              executes, on firmware or kernel layers inside connected machines. That matters because the buyer is
              usually an OEM, embedded-platform, or product-security team, not a central SOC buying cloud tools after an
              incident. The included spend therefore sits around firmware hardening, runtime blocking, telemetry-driven
              security response, and device trust. The closest substitutes are in-house firmware security work,
              chip-vendor security stacks, and generic cloud or network security that sits above the device. The
              practical market boundary is the security budget attached to autonomous or connected hardware that cannot
              wait for human remediation.
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
              - CM011
