  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product stack
        blocks:
          - type: paragraph
            body: >-
              Exein’s current public identity is unusually coherent for a private infrastructure startup: the company
              says it secures Physical AI systems with runtime protection that lives on-device, and its site maps that
              promise to concrete products rather than vague brand language. The homepage describes Exein Runtime as a
              real-time security layer for Physical AI systems, Linux-based environments, and RTOS devices, while Exein
              Analyzer focuses on firmware analysis and remediation inside the build environment. The same materials
              frame the company as a Physical AI security vendor with offices in Rome, Karlsruhe, Taipei, and San
              Francisco, plus a mission that spans robots, drones, autonomous vehicles, industrial equipment, and
              critical infrastructure. The company also gives a current-scale snapshot: 40+ people on the about page and
              a runtime-protected base that is marketed as 1B+ devices, with later financing materials using a larger
              telemetry base. That mix is enough to define Exein as a real embedded-security operator rather than a
              concept-stage AI story, but the scale wording should be read as company messaging rather than audited
              operating data.
