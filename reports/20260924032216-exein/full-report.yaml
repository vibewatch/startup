      - number: '6.4'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The main customer-side risk is not that Exein lacks reach; it is that the public evidence does not yet
              prove how sticky that reach is. FoundedCEO’s analysis is explicit that revenue, customer concentration,
              retention, attack-blocking benchmarks, and commercial performance have not been disclosed, and the other
              public sources are similarly light on renewal or churn data. Exein’s geographic expansion into the US,
              APAC, Japan, South Korea, and a future Bay Area office points to a land-and-expand motion, but that also
              creates concentration questions: if the business is spread across regions and OEM channels, it may be
              durable, yet the public record does not show whether a few partners or sectors account for most usage or
              revenue. The right conclusion is therefore cautious: adoption looks real, but retention and concentration
              remain largely unverified.
