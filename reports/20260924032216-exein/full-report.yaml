      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >
              The architecture described in the reviewed materials is kernel-centric and modular. Exein says the product
              watches device activity through eBPF probes at the kernel boundary, then forwards those events into a
              userspace rules engine that tags matches as threats. The Pulsar documentation backs that up with a
              concrete install-and-run path, a requirement for Linux kernel 5.5 or newer with BPF and BTF enabled, and a
              modular design that is meant to support new modules and custom rules. In other words, the platform appears
              to be built for deep device visibility first and policy orchestration second.


              The same materials also show a clear layering strategy: the base runtime handles observation and response;
              Photon adds a preemptive blocking posture at the kernel level; and the newer Physical AI model layer turns
              machine telemetry into a future autonomous-security system. That is an important distinction because it
              suggests Exein is not replacing its original product so much as extending it upward. The public roadmap
              still matters here, though: support is announced across a broad set of hardware and OS surfaces, but the
              exact breadth of each release family is not fully documented in the reviewed sources.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE010
              - CE013
