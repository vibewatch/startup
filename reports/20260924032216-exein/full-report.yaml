      - number: '5.3'
        title: Deployment, roadmap, and technical risk
        blocks:
          - type: paragraph
            body: >
              On deployment, Exein’s sources point to a product that is intended to fit into existing OEM and firmware
              workflows rather than force a wholesale replacement. Public coverage says the company works with firmware
              teams and chip-level integration points, and that the runtime is meant to span constrained devices,
              smartphones, servers, and containers with minimal overhead. That breadth is attractive, but it also shifts
              the diligence burden toward compatibility, supportability, and proof that the same security model behaves
              consistently across device classes and operating systems.


              The main risk surface is not whether the product exists; it clearly does. The risk is how far the reviewed
              evidence goes in proving operational readiness. The 2023 Pulsar documentation sketches a wide roadmap, but
              it does not give the kind of public certification matrix, benchmark pack, or support-level detail that
              would settle implementation questions for regulated customers. Likewise, the Physical AI narrative relies
              on telemetry scale and future autonomous agents, which is compelling but still leaves open questions about
              model governance, privacy, and the controls that separate a promising roadmap from a hardened product.
              Those are the gaps a technical buyer would still need to close.
            claimRefs:
              - CE008
              - CE010
              - CE012
              - CE013
