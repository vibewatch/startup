            body: >-
              The assigned evidence does not justify a single clean TAM number, so the chapter uses constrained lenses
              instead. The first lens is the installed base: Exein says it reaches more than two billion connected
              devices, which is an upper bound on reachable fleets rather than monetizable accounts. The second lens is
              urgency: the company says it now sees about 5,000 new non-repetitive attacks a week, five times the prior
              year, which supports why runtime response is valuable. The third lens is commercial traction: the funding
              round, the $1.7 billion valuation, and the reported 4x H1 2026 ARR growth indicate that buyers are already
              paying for the category. None of these numbers equals market size, but together they bound a serviceable
              market that is large, active, and still early.
