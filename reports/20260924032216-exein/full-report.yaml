  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment view
        blocks:
          - type: paragraph
            body: >
              Exein reads as a high-quality embedded-security asset with real operating momentum, but the current entry
              price asks for patience rather than a reflexive buy. The strongest bullish evidence is the combination of
              device-scale deployment, a new $270M financing, and management's claim that H1 2026 ARR grew four-fold
              year over year. The main anti-thesis is that the public record still does not show enough current run-rate
              detail, margin detail, or preference-stack detail to underwrite the $1.7B mark with conviction. On
              balance, the right posture is track: the business looks strategic, but the valuation already discounts a
              lot of the future.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV009
              - CV011
      - number: '8.2'
        title: Financing and operating proof
        blocks:
          - type: paragraph
            body: >
              The financing path supports the idea that Exein has become a category-name asset, but it also shows how
              far the company has already been repriced. The firm moved from a July 2025 €70M Series C to a December
              2025 €100M raise and then to the September 2026 $270M round. Exein says the latest round was significantly
              oversubscribed and paired with an upsized revolver, while the company also claims more than 2B protected
              devices and 5,000 new attacks per week across its network. That is meaningful proof of scale, yet the
              underwriting question is whether that scale converts into durable pricing power and margins.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, comps, and diligence
        blocks:
          - type: paragraph
            body: >
              A disciplined valuation frame needs to separate category ambition from entry discipline. In a bull case,
              Exein becomes a default security layer for physical AI and the market keeps rewarding the business with a
              premium embedded-security multiple. In the base case, it keeps growing, but the valuation mostly holds
              where it is because public evidence still leaves room for skepticism. In the bear case, revenue growth
              slows, the market compresses late-stage security multiples, or commercialization stalls in a few key
              verticals. Comparable references in the source pool point to a late-stage private-security set, but the
              right diligence asks remain simple: current ARR, gross margin, customer concentration, and the capital
              stack beneath the headline price.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV012
