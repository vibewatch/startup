      - number: '4.3'
        title: Capital structure and funding dependency
        blocks:
          - type: paragraph
            body: >-
              Exein is well funded on the evidence available here. It raised €100 million in 2025, then announced a $270
              million round at a $1.7 billion valuation in 2026, and also expanded a revolving credit facility with J.P.
              Morgan and KfW. That combination implies access to both equity and debt-like liquidity, which lowers
              near-term financing risk and gives the company room to keep hiring, deepen partnerships, and pursue M&A.
              The caution is that the same capital is being directed at expensive growth priorities: US expansion, APAC
              scaling, a San Francisco Bay Area office, and further product development. The latest commentary also
              highlights dilution risk if the company cannot convert fundraising momentum into durable share gains.
