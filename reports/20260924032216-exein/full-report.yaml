      - number: '2.3'
        title: Buyer map, adoption path, and open gaps
        blocks:
          - type: paragraph
            body: >-
              The likely adoption path runs through device makers and their engineering organizations. Robotics, drones,
              autonomous vehicles, industrial automation, healthcare, semiconductors, aerospace, and connected
              infrastructure all appear in the company narrative, but the budget owner is usually the team responsible
              for shipping and protecting the device itself. That makes adoption dependent on firmware integration,
              validation cycles, and trust with the OEM’s platform team. The biggest constraint is not awareness; it is
              that runtime security must slot into an existing hardware roadmap without slowing certification or
              deployment. The remaining gap in this chapter is independent sizing: the pool contains strong
              company-reported signals, but no third-party market report that cleanly quantifies TAM, SAM, or SOM for
              physical-AI runtime security by vertical and geography.
