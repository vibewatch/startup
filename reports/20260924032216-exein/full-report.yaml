  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk stack and thesis-breakers
        blocks:
          - type: paragraph
            body: >
              Exein's headline risk is not demand formation but execution depth. The company is pushing a kernel-level
              runtime product, a proprietary foundation model, and a wider M&A agenda at the same time that it is
              expanding in the US and APAC. That combination is powerful if the product keeps working across
              heterogeneous embedded targets, but it also increases the downside if the agent adds latency, breaks
              device workflows, or fails to keep pace with the attack volume Exein says it sees. The right reading is
              that growth itself widens the blast radius: more devices, more telemetry, more jurisdictions, and more
              capital structure complexity. A thesis-break would be any sign that the company cannot preserve device
              compatibility, deployment reliability, or compliance discipline while scaling. [CR001, CR002, CR004,
              CR005, CR006]
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >
              The legal stack is anchored by the EU Cyber Resilience Act, telemetry governance, and product-liability
              questions that arise when a security agent is trusted to observe and sometimes block machine behavior.
              Exein's own materials suggest that customers want CRA mapping and firmware analysis, but the same
              capability can create liability if the mapping is incomplete or if update workflows fail in the field. The
              company also says its foundation model will be trained on machine telemetry from a very large device
              footprint, which raises data-minimization, retention, and cross-border transfer questions once the system
              is commercialized outside Europe. The risk is manageable, but only if Exein can show documented controls,
              regional data handling, and a repeatable incident-response path that customers and regulators can audit.
              [CR011, CR012, CR013, CR015, CR016]
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR013
              - CR015
              - CR016
              - CR003
              - CR005
              - CR011
              - CR012
      - number: '7.3'
        title: Operational, partner, and financing risk
        blocks:
          - type: paragraph
            body: >
              The operating risk is that Exein's product has to work everywhere at once: embedded Linux, RTOS-adjacent
              environments, low-power hardware, and fragmented kernel versions. The interview material makes clear that
              the company leans on eBPF, Rust, Linux internals, and kernel-level hooks; that is a strong technical moat,
              but it also means portability bugs, verifier failures, and excessive overhead can become customer-facing
              incidents. The second layer of risk is dependency: the company is broadening partnerships across
              semiconductors, industrial computing, and connected infrastructure, while APAC appears to be an important
              revenue base and the new financing stack explicitly supports acquisitions. In practice, the kill criteria
              are visible: if device compatibility degrades, false positives spike, or a partner or lender slows the
              expansion plan, the growth story becomes much harder to sustain. [CR003, CR004, CR005, CR006, CR007,
              CR008, CR009, CR010, CR014]
            claimRefs:
              - CR003
