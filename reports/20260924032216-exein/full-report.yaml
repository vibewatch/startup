      - number: '1.3'
        title: Capital base, scale signals, and milestone path
        blocks:
          - type: paragraph
            body: >-
              The newest financing round is the clearest public evidence that Exein has moved from niche
              embedded-security vendor to heavily funded category contender. The company says it raised $270 million at
              a $1.7 billion valuation, led by Headline and backed by Sofina, Goldman Sachs, the EIB Group through ETCI,
              KfW Capital, T.Capital, and returning investors, while also expanding an existing revolving credit
              facility led by J.P. Morgan with KfW added as a lender. That financing is paired with very aggressive
              product and roadmap claims: Photon, a kernel-level runtime architecture launched earlier in 2026; a
              proprietary foundation model trained on telemetry from more than 2 billion devices; an agentic security
              architecture due by end-2026; and first foundation models targeted for Q1 2027. Exein also says H1 2026
              ARR was four times the prior-year period and that it is seeing about 5,000 new non-repeating attacks per
              week, which helps explain why the company is pushing into US and APAC expansion and using physical-world
              security as its pitch. The remaining diligence gap is not whether the story is real, but how much of the
              capital stack, customer base, and board control is still hidden behind private-company disclosure limits.
