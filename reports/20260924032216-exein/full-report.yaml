  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and operator workflow
        blocks:
          - type: paragraph
            body: >
              Exein’s public product story starts with a device-side security runtime, not a cloud control plane. The
              clearest customer workflow is an OEM, developer, or device operator that needs to monitor embedded systems
              in place, detect suspicious behavior while code is running, and then route that signal into incident
              response rather than post-hoc log review. The reviewed sources describe Exein Runtime as a Linux- and
              RTOS-oriented product for IoT and edge devices, and they frame the system around threat detection,
              response, and low-overhead deployment. That puts the product closest to the machine boundary where
              firmware, kernels, and runtime policy meet.


              The broader stack also has an open-source surface. Pulsar is presented as the core runtime security agent
              and developer-facing project, which makes the product family legible to engineers through code, docs, and
              repository activity. Exein’s public messaging extends that core into Photon, a preemptive runtime
              architecture aimed at blocking malicious execution before an attack runs, and into a Physical AI narrative
              that emphasizes robots, drones, autonomous vehicles, and other systems that act in the physical world. The
              result is a product line that reads as layered rather than monolithic: one part runtime enforcement, one
              part observability, and one part future autonomy.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE009
              - CE011
              - CE013
