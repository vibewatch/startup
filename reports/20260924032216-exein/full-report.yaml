      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Exein’s disclosed leadership surface is compact and founder-centric. The about page names Gianni Cuozzo as
              CEO and founder, Giovanni Alberto Falcione as CTO, Gerardo Gagliardo as CFO, and Gary Walshe as CCO; that
              is a credible operating spine for a company selling an embedded security platform into industrial and
              physical-world systems. The team disclosures are strong on functional coverage: product and technical
              direction sit with the founder and CTO, finance with the CFO, and commercial expansion with the CCO. What
              is still thin is the governance layer behind that team. Public materials reviewed here do not lay out a
              current board roster or committee structure, so outside diligence still has to infer control from the
              financing announcements and leadership pages. That matters because the company is now raising large growth
              capital while also expanding debt capacity, which makes succession, board rights, and retention depth more
              material than they would be for a smaller bootstrapped software shop.
