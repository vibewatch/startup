evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Public list prices, contract examples, or reseller sheets for Exein and the closest peers.
    whyItMatters: Sticker price and packaging shape procurement friction, bundling risk, and the ability to compare runtime security against broader suites.
    diligencePath: Request buyer-side quotes, reseller sheets, or procurement documents from OEM and enterprise customers.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: Customer evidence showing renewal behavior, multi-homing, or how easily embedded runtime security can be swapped after deployment.
    whyItMatters: The chapter's moat judgment depends on whether runtime placement actually makes Exein sticky once embedded.
    diligencePath: Interview OEM security leads and review renewal or deployment contracts for the installed base.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP002
