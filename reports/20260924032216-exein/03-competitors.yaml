company:
  name: Exein
chapter:
  number: 3
  title: Competitors
  summary: >
    Exein competes in a crowded embedded-security field that spans IoT visibility,
    supply-chain analysis, PKI, vehicle cybersecurity, and status-quo in-house
    controls. The reviewed sources support Exein's differentiation in kernel-level
    runtime enforcement and telemetry depth, but the moat depends on integration
    depth, not category exclusivity.
sections:
  - id: competitive-landscape
    title: Competitive landscape
    body: >
      The reviewed sources describe a fragmented market rather than a simple
      head-to-head lane. Tracxn says Exein has 316 active competitors, with 93
      funded and 40 exited, and its top-10 includes a mix of IoT visibility,
      device security, supply-chain security, PKI, vehicle security, and edge
      security vendors. That spread matters because buyers can solve parts of the
      same job through broad platforms, point solutions, internal build, or
      adjacent trust layers. Exein's own positioning is narrower and deeper: it
      secures firmware/runtime execution on devices, while the broader market
      still includes substitutes that sit above the device layer or simply do not
      reach the runtime boundary at all.
    claimRefs:
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
      - CP010
      - CP011
      - CP012
      - CP013
    tableRefs:
      - TP001
  - id: differentiation-map
    title: Where Exein is differentiated
    body: >
      Exein's clearest edge is the layer it protects. The sources consistently
      place it at firmware/runtime level, not in a cloud console or a generic
      device-visibility layer, and they say its telemetry base spans more than
      two billion devices. That creates a plausible data flywheel and a more
      defensive product posture, especially for physical-AI devices that make
      decisions in the real world. The same sources also point to a channel
      story: Exein says it integrates with firmware teams and OEMs, which is the
      kind of implementation depth that can raise switching costs once embedded.
      But that depth is only a moat if customers actually buy the runtime layer
      instead of bundling adjacent controls into a larger security stack.
    claimRefs:
      - CP001
      - CP002
      - CP014
    tableRefs:
      - TP002
    figureRefs:
      - FP001
  - id: moat-and-risk
    title: Moat durability and displacement risk
    body: >
      The competitive risk is not one perfect clone. It is bundle pressure,
      status-quo internal build, and the slow creep of adjacent vendors into the
      same budget line. The sources do not show public list pricing, so the buyer
      conversation appears quote-driven rather than sticker-driven; that makes
      technical fit and deployment friction more important than posted price.
      At the same time, the landscape is crowded enough that a buyer can
      multi-home across layers or delay a full replacement by combining device
      visibility, PKI, supply-chain checks, and OEM-internal controls. The moat
      is therefore real but conditional: Exein needs to keep the runtime layer
      sticky while proving it is more than another tool in a broader platform
      bundle.
    claimRefs:
      - CP013
      - CP015
    tableRefs:
      - TP003
