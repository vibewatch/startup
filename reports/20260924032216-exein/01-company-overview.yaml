chapter:
  number: 1
  title: Company Overview
  summary: Exein presents itself as a Rome-based Physical AI cybersecurity company with a real embedded-runtime product stack, a founder-led management team, and a freshly enlarged financing base. The public record is strongest on product positioning, the September 2026 $270 million round at a $1.7 billion valuation, and the company’s rapid scale narrative, while board visibility, exact customer count, and fully reconciled cumulative capital remain less public.
sections:
  - id: identity-footprint-and-product
    title: Identity, footprint, and product stack
    body: >-
      Exein’s current public identity is unusually coherent for a private infrastructure
      startup: the company says it secures Physical AI systems with runtime protection that
      lives on-device, and its site maps that promise to concrete products rather than vague
      brand language. The homepage describes Exein Runtime as a real-time security layer for
      Physical AI systems, Linux-based environments, and RTOS devices, while Exein Analyzer
      focuses on firmware analysis and remediation inside the build environment. The same
      materials frame the company as a Physical AI security vendor with offices in Rome,
      Karlsruhe, Taipei, and San Francisco, plus a mission that spans robots, drones,
      autonomous vehicles, industrial equipment, and critical infrastructure. The company
      also gives a current-scale snapshot: 40+ people on the about page and a runtime-protected
      base that is marketed as 1B+ devices, with later financing materials using a larger
      telemetry base. That mix is enough to define Exein as a real embedded-security operator
      rather than a concept-stage AI story, but the scale wording should be read as company
      messaging rather than audited operating data.
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO011
      - CO012
    tableRefs:
      - TO001
  - id: leadership-governance-and-key-person-risk
    title: Leadership, governance, and key-person dependence
    body: >-
      Exein’s disclosed leadership surface is compact and founder-centric. The about page names
      Gianni Cuozzo as CEO and founder, Giovanni Alberto Falcione as CTO, Gerardo Gagliardo as
      CFO, and Gary Walshe as CCO; that is a credible operating spine for a company selling an
      embedded security platform into industrial and physical-world systems. The team disclosures
      are strong on functional coverage: product and technical direction sit with the founder and
      CTO, finance with the CFO, and commercial expansion with the CCO. What is still thin is the
      governance layer behind that team. Public materials reviewed here do not lay out a current
      board roster or committee structure, so outside diligence still has to infer control from the
      financing announcements and leadership pages. That matters because the company is now raising
      large growth capital while also expanding debt capacity, which makes succession, board rights,
      and retention depth more material than they would be for a smaller bootstrapped software shop.
    claimRefs:
      - CO001
      - CO002
      - CO005
      - CO012
    tableRefs:
      - TO002
  - id: capital-scale-and-milestones
    title: Capital base, scale signals, and milestone path
    body: >-
      The newest financing round is the clearest public evidence that Exein has moved from niche
      embedded-security vendor to heavily funded category contender. The company says it raised
      $270 million at a $1.7 billion valuation, led by Headline and backed by Sofina, Goldman
      Sachs, the EIB Group through ETCI, KfW Capital, T.Capital, and returning investors, while
      also expanding an existing revolving credit facility led by J.P. Morgan with KfW added as a
      lender. That financing is paired with very aggressive product and roadmap claims: Photon,
      a kernel-level runtime architecture launched earlier in 2026; a proprietary foundation model
      trained on telemetry from more than 2 billion devices; an agentic security architecture due
      by end-2026; and first foundation models targeted for Q1 2027. Exein also says H1 2026 ARR
      was four times the prior-year period and that it is seeing about 5,000 new non-repeating
      attacks per week, which helps explain why the company is pushing into US and APAC expansion
      and using physical-world security as its pitch. The remaining diligence gap is not whether
      the story is real, but how much of the capital stack, customer base, and board control is
      still hidden behind private-company disclosure limits.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO012
    tableRefs:
      - TO003
    figureRefs:
      - FO001
