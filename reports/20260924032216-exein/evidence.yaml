evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current public board roster, committee map, and any disclosed observer rights or vetoes.
    whyItMatters: >-
      Governance clarity matters because Exein is now raising large growth capital and expanding debt support while
      remaining founder-led.
    diligencePath: >-
      Review investor rights agreements, board materials, or a recent corporate registry filing that lists current
      directors.
    relatedTableRefs:
      - TO002
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: capital-stack
    missingEvidence: A clean public ledger for exact cumulative capital raised, prior-round amounts, and full debt facility terms.
    whyItMatters: >-
      The current story is clear on the latest round, but exact cumulative dilution and leverage are still not fully
      public.
    diligencePath: Request the cap table, debt term sheet summary, and any closing memorandum that reconciles all prior rounds.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: minor
    topic: customer-base
    missingEvidence: A verified customer-count figure or signed-deployment count rather than device telemetry and logo-wall proof.
    whyItMatters: >-
      The company’s market narrative is stronger than its customer-count disclosure, which limits precision on adoption
      depth.
    diligencePath: Ask for active-customer counts, renewal cohorts, and the number of production deployments by segment.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: physical-ai-tam
    missingEvidence: >-
      An independent market report that quantifies physical-AI runtime-security TAM, SAM, or SOM by vertical and
      geography.
    whyItMatters: >-
      Without a third-party sizing source, the chapter can only bracket the market with proxies rather than defend a
      precise market number.
    diligencePath: >-
      Pull an analyst report or public-budget dataset that isolates embedded/runtime security spend for connected
      devices.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Public pricing page, contract examples, or customer-facing SKU sheet showing per-device, per-site, or annual
      contract economics.
    whyItMatters: >-
      Without explicit pricing, the chapter cannot distinguish recurring software revenue from services-heavy
      monetization or model bundled into large enterprise deals.
    diligencePath: >-
      Request customer contracts, pricing sheets, or a management interview that breaks out list pricing versus realized
      pricing.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, cash on hand, burn rate, and any debt covenant or runway disclosure.
    whyItMatters: Those inputs are necessary to size financing dependency and determine whether current growth is capital efficient.
    diligencePath: Obtain management accounts or a lender/investor update that includes cash, burn, and margin bridge data.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Public third-party audit, certification matrix, or benchmark package for Photon and Runtime.
    whyItMatters: >-
      The chapter can describe the kernel enforcement model, but not independently verify the quality and trust controls
      buyers would expect for regulated deployments.
    diligencePath: >-
      Review the company site, technical docs, and partner or regulator channels for published certifications, audit
      letters, or benchmark reports.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: deployment
    missingEvidence: Public compatibility matrix for exact kernels, RTOSes, chipsets, and device classes.
    whyItMatters: >-
      It limits precise scoping for OEMs and firmware teams that need to know which environments are officially
      supported.
    diligencePath: Request a support matrix or integration guide from Exein's technical team.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: Named customer references or customer-quoted case studies tied to production deployments.
    whyItMatters: >-
      Without named customer proof, it is hard to tell whether public adoption is mostly pilot, partner, or true
      production usage.
    diligencePath: Request customer references, procurement records, or customer-quoted press releases that show live deployments.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Public GRR, NRR, renewal rates, churn, or cohort data.
    whyItMatters: Retention is the cleanest way to tell whether the installed base is durable or just a large one-time footprint.
    diligencePath: Ask for renewal cohorts, contract length distribution, or named customer renewal evidence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: access-blocked
    severity: material
    topic: telemetry-governance
    missingEvidence: >-
      Public data-flow, retention, and training-policy documentation for the telemetry used in foundation-model
      training.
    whyItMatters: >-
      That evidence is needed to judge whether the telemetry pipeline creates privacy, contractual, or cross-border
      transfer exposure.
    diligencePath: Request the DPA set, internal data-flow diagram, and model-training governance memo.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Public revenue concentration, renewal, and top-customer exposure data for the named customer set.
    whyItMatters: The public logo set does not show whether a few accounts or partners drive most revenue.
    diligencePath: Ask for top-customer revenue share, contract terms, and renewal calendar.
  - type: missing-source
    severity: minor
    topic: rollout-validation
    missingEvidence: A public kernel-compatibility matrix or target-hardware rollout benchmark for Photon and the runtime agent.
    whyItMatters: The risk profile depends on whether the product behaves consistently across the fragmented embedded stack.
    diligencePath: Request the compatibility matrix, benchmark report, and rollback test results.
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: The cap table, liquidation preferences, and any downside-protection terms from the September 2026 financing.
    whyItMatters: >-
      A $1.7B headline price is less informative without knowing whether late-stage investors received senior
      protections that change downside economics.
    diligencePath: Request the closing memo or a summarized cap-table waterfall from management and the lead investors.
    relatedQuestionRefs:
      - QV001
      - QV008
  - type: missing-source
    severity: material
    topic: current-unit-economics
    missingEvidence: Current run-rate revenue, gross margin, and customer concentration data.
    whyItMatters: Without these, the entry multiple and plausible downside are still only heuristic.
    diligencePath: Ask for a current board deck with ARR bridge, gross margin, and customer concentration.
    relatedQuestionRefs:
      - QV002
      - QV005
      - QV008
