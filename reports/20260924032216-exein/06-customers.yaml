company:
  name: Exein
chapter:
  number: 6
  title: Customers
  summary: Exein’s public customer story is broad at the segment level but thin at named-reference depth. The company reports a two-billion-device footprint, fast ARR growth, and expansion across OEM, silicon, and industrial channels, yet public evidence for retention, named end customers, and concentration remains limited.
sections:
  - id: customer-segment-map
    title: Customer segments and buying centers
    body: >-
      Exein’s customer motion is centered on device manufacturers rather than on
      a late-stage software buyer. The clearest public pattern is an OEM and
      silicon-vendor route to market: TechCrunch says Exein has worked directly
      with manufacturers since 2018, while Exein’s own materials describe the
      product as runtime protection that lives inside the device. The sector
      mix is likewise broad but still mostly segment-level: aerospace,
      automotive, industrial automation, energy, healthcare, semiconductors,
      robotics, and connected infrastructure recur across the sources. That
      breadth suggests the core buyer is usually an engineering or security
      team inside a device maker or operator, with procurement happening near
      firmware, compliance, and deployment decisions rather than as a standalone
      SaaS purchase.
    claimRefs:
      - CU001
      - CU004
      - CU009
      - CU010
      - CU011
      - CU012
      - CU014
      - CU015
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-trajectory
    title: Adoption trajectory and scale signals
    body: >-
      The strongest adoption signals are scale claims, not named reference
      accounts. Exein says it protects more than two billion devices and sees
      roughly 5,000 new, non-repetitive attacks each week, which it frames as
      machine-speed threat volume rising alongside the physical-AI market.
      BusinessWire and EU-Startups also report H1 2026 ARR up 4x year over year
      and a $1.7 billion valuation, while TechCrunch adds that the company says
      growth is sustained by direct work with OEMs and silicon vendors. The
      adoption story is therefore a mix of installed-base reach, rising threat
      density, and fast commercial expansion, but the sources still do not
      disclose the denominator behind device counts or the conversion rate from
      pilots to durable deployments.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU006
      - CU007
      - CU012
      - CU014
    tableRefs:
      - TU002

  - id: named-proof
    title: Named proof and public visibility
    body: >-
      Public proof is more visible at the partner and platform level than at the
      named end-customer level. Arm’s partner catalog lists Exein, and Exein’s
      own materials say it has secured 600k Arm devices and analyzed 100k unique
      devices. At the same time, the reviewed sources do not name a broad list
      of paying customers or distinguish pilots from production deployments, so
      the public record supports a channel or ecosystem story more strongly than
      a logo-based customer story. That is not a negative signal by itself, but
      it does mean the diligence bar for customer proof remains high.
    claimRefs:
      - CU007
      - CU008
      - CU013
      - CU015
      - CU016
    tableRefs:
      - TU003

  - id: durability-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The main customer-side risk is not that Exein lacks reach; it is that the
      public evidence does not yet prove how sticky that reach is. FoundedCEO’s
      analysis is explicit that revenue, customer concentration, retention,
      attack-blocking benchmarks, and commercial performance have not been
      disclosed, and the other public sources are similarly light on renewal or
      churn data. Exein’s geographic expansion into the US, APAC, Japan, South
      Korea, and a future Bay Area office points to a land-and-expand motion,
      but that also creates concentration questions: if the business is spread
      across regions and OEM channels, it may be durable, yet the public record
      does not show whether a few partners or sectors account for most usage or
      revenue. The right conclusion is therefore cautious: adoption looks real,
      but retention and concentration remain largely unverified.
    claimRefs:
      - CU005
      - CU008
      - CU011
      - CU012
      - CU013
      - CU014
      - CU016

tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Public use-case evidence
      - Scale / geography signal
      - Strategic value
      - Gap
    rows:
      - - OEMs and silicon vendors
        - Engineering, product, and security teams
        - Embed runtime security into firmware and device stacks before shipping
        - TechCrunch says Exein has worked directly with manufacturers since 2018
        - Channel access into device designs and bill-of-material decisions
        - Public named end customers are sparse
      - - Industrial, automotive, aerospace, healthcare, and energy operators
        - OT, security, and platform operators
        - Protect connected devices that move, sense, or control real systems
        - Sectors are repeated across the 2026 coverage
        - High operational criticality and compliance pull-through
        - No public renewal, churn, or concentration data
      - - Regional expansion accounts
        - US and APAC enterprise buyers plus local partners
        - Local support, local field sales, and acquisition support
        - APAC HQ in Taiwan, Japan entity, South Korea planned, Bay Area office planned
        - Supports multi-region deployments and partner-led growth
        - Regional concentration and partner dependence are unknown
      - - Ecosystem and platform partners
        - Partner managers, OEM alliances, and device ecosystems
        - Partner catalog visibility and embedded-device footprint
        - Arm catalog and Exein’s device-count claims
        - Distribution leverage and integration credibility
        - Partner proof is not the same as named customer proof
    notes: >-
      Segmenting from public OEM, partner, and expansion statements; no public
      source reviewed here discloses a complete named customer list, so this is
      a buyer-motion map rather than a logo roster.
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU009
