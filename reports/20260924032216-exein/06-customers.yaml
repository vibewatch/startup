        - Commercial expansion appears to be accelerating
        - Absolute ARR and cohort retention are not disclosed
    notes: >-
      The table uses company-reported or company-repeated growth metrics; it is
      directional, not a substitute for audited cohort or renewal data.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU007
      - CU013

  - id: TU003
    title: Named customer proof table
    columns:
      - Proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Arm partner catalog and Arm device footprint
        - Hardware ecosystem / channel
        - Embedded-device security distribution through Arm-aligned devices
        - Production channel proof, not a named end-customer deployment
        - Exein says it has secured 600k Arm devices
        - Partner proof does not identify the end buyer
      - - Company and media sector references
        - Aerospace, automotive, industrial, healthcare, energy
        - Runtime security for connected devices in regulated physical environments
        - Sector-level evidence only
        - Broad adoption thesis is credible
        - No public production logo list or contract term disclosure
      - - Public sales coverage signals
        - US / DACH / APAC field motion
        - Regional support for enterprise and partner deployment
        - Field motion, not a customer reference
        - Helps convert design wins into deployments
        - Does not prove a named customer relationship
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly visible customer-proof surfaces in the 2026 Exein source pool,
        limited to named partner and team signals rather than a complete logo
        roster.
    notes: >-
      The public record reviewed here surfaces partner and sector proof more
      clearly than named end-customer references; the table therefore records
      the visible proof surfaces and their limitations.
