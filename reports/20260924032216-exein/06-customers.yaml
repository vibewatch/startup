      - - Weekly attack volume
        - "~5,000 new non-repetitive attacks"
        - "2026-09-15"
        - Exein / Business Wire / TechCrunch
        - high
        - Threat density is rising at machine speed
        - Baseline and block-rate are not disclosed
      - - H1 2026 ARR growth
        - "4x YoY"
        - "2026-09-15"
