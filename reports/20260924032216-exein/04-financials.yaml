      severity: material
      topic: pricing
      missingEvidence: Public pricing page, contract examples, or customer-facing SKU sheet showing per-device, per-site, or annual contract economics.
      whyItMatters: Without explicit pricing, the chapter cannot distinguish recurring software revenue from services-heavy monetization or model bundled into large enterprise deals.
      diligencePath: Request customer contracts, pricing sheets, or a management interview that breaks out list pricing versus realized pricing.
      relatedQuestionRefs: [QI007]
      relatedTableRefs: [TI002]
    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, cash on hand, burn rate, and any debt covenant or runway disclosure.
      whyItMatters: Those inputs are necessary to size financing dependency and determine whether current growth is capital efficient.
      diligencePath: Obtain management accounts or a lender/investor update that includes cash, burn, and margin bridge data.
      relatedQuestionRefs: [QI004, QI007]
      relatedTableRefs: [TI003]
