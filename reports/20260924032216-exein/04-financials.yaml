    title: Revenue streams table
    columns: [stream, mechanism, current value/status, quality, diligence ask]
    rows:
      - ["Embedded runtime security", "Device/firmware security delivered at the kernel and runtime layer", "Core product line; public pricing not disclosed", "Likely recurring software revenue, but contract form is opaque", "Disclose billing unit, term, and ARR by product line"]
      - ["Photon / next-gen AI security", "Preemptive runtime security for physical AI systems and autonomous machines", "Launched or in development depending on source", "Strategic expansion line, not yet monetization-proven", "Show launch timing, attach rate, and revenue contribution"]
      - ["Implementation and integration", "Support for manufacturers, chipset partners, and device deployments", "Not separately disclosed", "Could be material if deployments need heavy support", "Break out services vs software revenue and margin"]
      - ["Regional enterprise expansion", "Sales and partnerships across Europe, APAC, and the US", "APAC disclosed as roughly half of revenue", "Shows international monetization, but not unit economics", "Disclose revenue by region and top customer concentration"]
      - ["M&A / platform expansion", "Capital used to add capabilities and broaden the product stack", "Planned use of funds", "Not revenue itself, but may widen monetization scope", "Explain which acquired capabilities are expected to monetize first"]
    notes: "Public sources describe product motion and expansion plans, but they do not disclose pricing, contract duration, or revenue by product line; 'current value/status' uses disclosed public proxies rather than audited financial statements."
    claimRefs: [CI001, CI003, CI008, CI009, CI010, CI011, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns: [price/unit/contract, list vs realized pricing, discounts/unknowns, source]
    rows:
      - ["Per-device or per-node price", "Undisclosed", "No public list price or SKU-level pricing in the packet", "SI001, SI002, SI003, SI004, SI005, SI006, SI008"]
      - ["Enterprise contract term", "Undisclosed", "No contract examples or minimum commitments disclosed", "SI001, SI002, SI003, SI005"]
      - ["ARR proxy", "H1 2026 ARR up 4x YoY", "Not a list price, but the clearest realized monetization proxy", "SI002, SI003, SI005"]
      - ["Regional mix", "About 50% of revenue from APAC", "Geographic mix is disclosed; pricing power is not", "SI002, SI004, SI006"]
      - ["Bundled platform pricing", "Undisclosed", "Potential premium pricing from Photon / foundation-model layers, but unproven", "SI001, SI002, SI008"]
    notes: "The packet contains monetization proxies, not published price cards. Null or undisclosed cells should be read as a disclosure gap, not as zero-value pricing."
    claimRefs: [CI001, CI005, CI007, CI008, CI009, CI010, CI011]
  - id: TI003
    title: Unit economics table
    columns: [metric, value/null, confidence, why it matters, diligence ask]
    rows:
      - ["ARR growth", "4x YoY H1 2026", "medium", "Primary evidence of monetization momentum", "Confirm whether ARR is audited and whether it is annualized run-rate or booked recurring revenue"]
      - ["Revenue growth", "5x YoY", "medium", "Shows accelerating demand but may not equal profitability", "Provide full-year revenue bridge and cohort retention"]
      - ["Valuation growth", "30x in two years", "medium", "Signals capital-market confidence and dilution pressure", "Map valuation steps to revenue and margin milestones"]
      - ["Gross margin", null, "low", "Needed to judge software leverage versus services burden", "Disclose gross margin by product and by geography if available"]
      - ["Cash / runway", null, "low", "Determines how much growth capital is still required", "Disclose cash, burn, and target runway after the latest raise"]
      - ["Customer concentration", null, "low", "Shows whether a few large OEMs or partners dominate economics", "Disclose active paying customers, top-10 share, and contract duration"]
    notes: "Null means not disclosed in the prefetched sources. This table intentionally separates public growth signals from missing underwriting inputs."
    claimRefs: [CI004, CI005, CI007, CI008, CI010, CI011, CI012]
