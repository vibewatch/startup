- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Named proof
  - Current proof quality
  - Strategic value
  - Gap
  rows:
  - - AI data centers
    - Hyperscalers, colocation power teams, data-center infrastructure owners
    - Unnamed major US hyperscalers; Houston AI push; GrapheneUPS and GrapheneBBU pages
    - Medium — scale claims are public, but end customers are unnamed
    - Likely largest near-term growth pool and rationale for US expansion
    - Need named references, contract values, and deployment sites
  - - Grid stabilization / power quality
    - Siemens, GE, Hitachi Energy, Hyosung, Marubeni, utilities / OEMs
    - Leipzig deliveries to Siemens, GE, Hitachi Energy; Hyosung/Marubeni e-STATCOM program
    - High for Siemens/GE/Hitachi delivery proof; medium for Hyosung because program is pre-commercial
    - Validates utility-grade and OEM-grade demand with channel partners
    - Need booked orders, utility end-customer names, and deployment economics
  - - Rail / mobility
    - Siemens Mobility US, Amtrak, rail-platform operators
    - Amtrak energy modules via Siemens Mobility US
    - Medium — named brand but only supplier-side proof retained
    - Shows fit in mission-critical transport power systems
    - Need platform name, production status, and direct customer confirmation
  - - Healthcare OEMs
    - GE Healthcare engineering / imaging teams
    - GE Healthcare MRI case study using SkelMod 131V
    - Medium-to-high — named use case and outcome, but public vintage appears older
    - Demonstrates non-commodity power-quality use inside medical equipment
    - Need current shipment status and revenue scale
  - - Motorsport / performance mobility
    - HRC US, INDYCAR teams, INDYCAR series
    - All IndyCar racecars run Skeleton-based ESS in hybrid system
    - High — customer-side and league-side proof both exist
    - Strong proof of fast-cycle, high-power reliability and public prestige
    - Race-program success does not reveal recurring commercial value outside motorsport
  - - Defense / aerospace
    - KNDS France, TEKEVER, allied government end-users indirectly
    - Eurosatory 2026 declarations with KNDS France and TEKEVER
    - Medium — named and current, but exploratory or development-stage
    - Opens French and NATO-aligned demand channels
    - Need programs of record, pilot budgets, and order timing
  - - Advanced energy / fusion
    - Leading US fusion company
    - ARC tokamak startup application using Skeleton modules
    - Low-to-medium — use case is specific but customer remains unnamed
    - Shows extreme-power niche relevance outside transport and grid
    - Need named counterparty, project stage, and commercial volume
  notes: Segments mix direct end customers, channel partners, and platform integrators; public proof quality is strongest when the source names the counterparty and the deployment context.
