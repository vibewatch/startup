- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - Type
  - Impact
  - Diligence path
  rows:
  - - US manufacturing for AI data center products
    - Expansion driver
    - Could convert 100+ MW deployment proof into larger named North American design wins
    - Request site plan, customer pipeline by named account, and booked orders tied to local manufacturing
  - - Hyosung / Marubeni e-STATCOM commercialization
    - Expansion driver
    - Could open Korea first, then broader Asia or US grid channels if the 2027 target holds
    - Request pilot schedule, utility counterparties, and commercialization milestones
  - - KNDS France and TEKEVER defense pathways
    - Expansion driver
    - Could create higher-value defense and aerospace programs with long program tails
    - Request funded pilot budgets, platform names, and probability-weighted revenue
  - - Unnamed hyperscalers potentially dominating AI revenue
    - Concentration risk
    - Could make North American revenue highly concentrated despite apparently broad demand
    - Obtain top-10 customer revenue split and identify how many accounts drive the 100+ MW base
  - - Siemens multi-role dependence
    - Concentration risk
    - A counterparty that is simultaneously customer, supplier, and capital ally can create strategic leverage but also dependency
    - Review revenue exposure, component dependence, and exclusivity or preferred-supplier terms
  - - Amtrak proof lacks customer-side corroboration
    - Concentration / proof-quality risk
    - A strong brand reference is harder to underwrite when only the supplier discusses it publicly
    - Request platform-level confirmation from Siemens Mobility US or Amtrak
  - - Leipzig ramp disruption
    - Execution risk
    - Manufacturing delays can defer deliveries, slow revenue recognition, or stress customer trust
    - Track line readiness, backlog conversion, and on-time delivery metrics by major account
  - - Opaque retention and contract terms
    - Durability risk
    - Without renewal data, even valid named proofs may not translate into sticky long-term revenue
    - Request contract summaries, churn logs, and renewal calendars
  notes: This table separates visible expansion vectors from the disclosure gaps that prevent a clean concentration analysis; impact is directional because public contract economics are absent.
