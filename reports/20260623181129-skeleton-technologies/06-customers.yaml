- id: adoption-trajectory-and-named-customer-proof
  title: Adoption Trajectory and Named Customer Proof
  body: 'The adoption trajectory is easiest to read through dated public proof points. By mid-2022 Siemens was already describing Skeleton as both a manufacturing partner and a user of Skeleton ultracaps. In 2023 the Siemens and Marubeni financing round reinforced that the relationship was strategic rather than transactional. In July 2024 Skeleton’s ESS entered live racing in every IndyCar car, and by May 2025 INDYCAR itself was recognizing the hybrid collaborators with the Louis Schwitzer Award. In December 2025 Skeleton said its Leipzig plant was already delivering to Siemens, General Electric, and Hitachi Energy and serving major US hyperscalers. In early 2026 the company shifted the narrative toward North American scale, saying 100+ MW were deployed in the US and that about half of revenue already came from North American customers.


    Named proof is therefore real, but it is not uniform. Siemens, GE Healthcare, and IndyCar/HRC offer the cleanest proof because the public record identifies the counterparty and the deployment context. Amtrak appears only through Skeleton-side disclosure, so it is directionally valuable but weaker than the stronger case-study-grade references. Hyosung/Marubeni, KNDS France, and TEKEVER are important because they show new vertical expansion in 2026, yet each remains closer to co-development or channel formation than to disclosed production revenue. Investors should treat those 2026 logos as credible adoption signals, not as equivalent to a disclosed multiyear production contract.'
