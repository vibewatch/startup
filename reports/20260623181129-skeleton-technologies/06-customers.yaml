- id: concentration-procurement-friction-and-adverse-evidence
  title: Concentration, Procurement Friction, and Adverse Evidence
  body: 'The most important missing field in Skeleton’s customer story is concentration. Public sources name a small number of industrial-grade counterparties — Siemens, GE Healthcare, GE Vernova, Hitachi Energy, HRC/IndyCar, Amtrak via Siemens Mobility US, Hyosung, Marubeni, KNDS France, TEKEVER, and an unnamed fusion company — but they do not reveal what share of revenue sits with each account or whether a few unnamed hyperscalers dominate North American revenue. That makes concentration risk plausibly material even though it is not yet quantifiable.


    Procurement friction also looks inherently high. AI power, grid stabilization, rail modules, MRI equipment, and defense power architectures all imply engineering qualification, safety review, and multi-party integration rather than fast transactional sales. That is a strength when the product wins — because the relationship can become sticky — but it means logo proof does not automatically translate into near-term recurring revenue. The chapter’s main adverse source reinforces that caution: ERR reported Leipzig ramp delays, supplier problems, and Estonia layoffs while management acknowledged disrupted production and missed growth goals, even as it insisted customer orders were still being met. The right read is that customer interest appears real, but manufacturing execution and disclosure opacity still block a clean underwriting of durability and concentration.'
