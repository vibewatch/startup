figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Skeleton’s journey typically starts with an engineering pain point and ends either in a sticky program or in a partner-led expansion path.
  data:
    nodes:
    - label: 1. Acute power problem
      detail: AI load spikes, rail restarting, MRI peak absorption, grid disturbance response, or high-intensity defense power demand create the entry point.
      tone: neutral
    - label: 2. Technical qualification
      detail: Customer or partner validates response speed, cycle life, footprint, and safety versus batteries or conventional power electronics.
      tone: neutral
    - label: 3. Integration partner selection
      detail: Counterparty chooses direct module use, OEM integration, or channel-led path through Siemens, Marubeni, Hyosung, KNDS France, or TEKEVER.
      tone: neutral
    - label: 4. Production or field deployment
      detail: Examples include IndyCar’s live ESS, GE Healthcare MRI modules, and Siemens-linked grid deliveries from Leipzig.
      tone: positive
    - label: 5. Continuity test
      detail: Only some relationships show multi-year public continuity; others remain first-announcement programs with no renewal proof yet.
      tone: risk
    - label: 6. Expansion loop
      detail: Successful proofs can expand into local manufacturing, regional channel sales, or larger defense and AI infrastructure programs.
      tone: positive
  approximationNotes: This journey map abstracts multiple verticals into one path and should be read as a synthesis of the retained proof set, not as a single universal sales process.
  claimRefs:
  - CU001
  - CU027
  - CU030
  - CU031
  - CU032
  - CU043
