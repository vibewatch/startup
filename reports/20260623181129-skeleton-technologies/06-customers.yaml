  evidenceGaps:
  - type: missing-source
    severity: material
    topic: hyperscaler-disclosure
    missingEvidence: Named hyperscaler customers, deployment sites, and purchase-order or design-win evidence for the AI data center accounts referenced in Skeleton’s 2025-2026 materials.
    whyItMatters: Unnamed hyperscalers may represent the largest future revenue pool, but anonymity prevents any outside assessment of concentration, renewal risk, or deployment scale.
    diligencePath: Request the customer reference list, booked pipeline by named AI account, and at least one customer-call or site-reference package under NDA.
    relatedQuestionRefs:
    - QU008
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal rates, and customer cohort data by segment or named account.
    whyItMatters: Without public durability metrics, the chapter cannot tell whether visible logos convert into repeat spending or remain one-off technical wins.
    diligencePath: Request board reporting for retention by segment, plus renewal calendars and historical revenue by top customer.
    relatedQuestionRefs:
    - QU017
    - QU024
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Top-customer revenue shares, contract values, term lengths, minimum-volume clauses, and channel versus direct-account mix.
    whyItMatters: The public record suggests a small set of industrial counterparties and unnamed hyperscalers could dominate revenue, but concentration cannot be quantified from public evidence alone.
    diligencePath: Obtain customer concentration tables from management, the top-10 account list, and current contract summaries with expiry dates and renewal terms.
    relatedQuestionRefs:
    - QU018
    - QU019
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: amtrak-direct-proof
    missingEvidence: Direct Amtrak or Siemens Mobility customer-side documentation confirming which train platform uses Skeleton modules and whether the program is in recurring production.
    whyItMatters: Amtrak is one of the strongest brand-name references in the 2026 North America narrative, but today it is supported only by Skeleton-side disclosure rather than customer-side testimony.
    diligencePath: Request the Siemens Mobility US platform name, customer acceptance status, and a customer-reference letter or case study.
    relatedQuestionRefs:
    - QU006
    relatedTableRefs:
    - TU003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: A complete list of named paying customers, active pilots, and partner-led channels by segment, geography, and stage.
    whyItMatters: The retained public record is rich enough to prove several marquee relationships, but it is not exhaustive enough to infer total customer count or segment balance.
    diligencePath: Ask management for the full customer list split by production, pilot, and partner-channel status; reconcile it to revenue concentration and renewals.
    relatedQuestionRefs:
    - QU004
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-procurement
    missingEvidence: Average selling prices, qualification timelines, and quote-to-close conversion data for AI, grid, mobility, healthcare, and defense programs.
    whyItMatters: Enterprise/contact-led sales can be attractive, but they also imply slow procurement cycles and delayed revenue recognition that public logo proof does not reveal.
    diligencePath: Request funnel conversion data, average qualification duration by segment, and recent won/lost deals with reasons.
    relatedQuestionRefs:
    - QU020
    - QU022
    - QU026
    relatedTableRefs:
    - TU002
