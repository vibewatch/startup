- id: durability-retention-and-expansion-signals
  title: Durability, Retention, and Expansion Signals
  body: 'Skeleton does not publicly disclose NRR, GRR, churn, or renewal schedules, so durability must be inferred from continuity signals rather than measured retention. On that basis Siemens is the clearest multi-year anchor: the operating relationship appears in 2022, the capital relationship in 2023, the delivery relationship in 2025, and the customer/supplier/partner framing again in 2026. IndyCar/HRC is the second-strongest continuity case because the deployment went live in 2024 and remained active enough in 2025 to underpin league and SAE-linked award coverage. GE Healthcare likely represents a durable relationship too, but the retained public evidence is sparser and older, with 2026 support coming mainly from Skeleton’s description of a longstanding supplier relationship rather than a fresh customer-side case study.


    Expansion logic is visible even without retention metrics. AI infrastructure could expand through Houston engineering and localized US manufacturing. Grid programs could scale via Hyosung and Marubeni if e-STATCOM is commercialized in Korea and exported elsewhere. Defense could widen through KNDS France and TEKEVER if exploratory frameworks become programs of record. The problem is that every one of those expansion paths still lacks public contract economics. Public continuity proxies therefore support the existence of durable relationships, but not the size, margin, or renewal value of those relationships.'
