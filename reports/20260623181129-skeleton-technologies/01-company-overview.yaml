company:
  name: Skeleton Technologies
chapter:
  number: 1
  title: Company Overview
  summary: Skeleton Technologies is a Tallinn-headquartered Estonian energy-storage company founded in 2009 that has evolved into a late-stage, pre-IPO supplier of high-power supercapacitor, SuperBattery, and AI-data-center power systems. The 2025-2026 record is defined by the Leipzig and Finland factory openings, a Houston engineering hub, the May 2026 €33 million pre-IPO first close that brought total disclosed venture funding to €392 million, and a burst of 2026 AI, grid, and defense partnerships. Those positives are real, but the 2025 Leipzig ramp delay and Estonia layoffs show that manufacturing execution remains the main chapter-1 risk signal.
sections:
- id: identity-and-product-scope
  title: Identity and Product Scope
  body: 'Skeleton Technologies is an Estonian deep-tech energy storage company whose identity has become more specific — not less — as it scaled. The company was founded in Tartu in 2009, is now headquartered in Tallinn, and operates manufacturing and engineering assets across Germany, Finland, and, as of 2026, Houston. Public sources consistently place Skeleton in the high-power end of energy storage rather than in long-duration battery storage: it develops curved-graphene supercapacitors, SuperBattery systems, and rack-level power products aimed at AI data centers, electrical-grid stability, heavy mobility, and defense uses.


    That positioning matters because the business model now extends beyond selling cells. By 2026 Skeleton was marketing GrapheneBBU rack backups and had launched GrapheneUPS for AI data centers, while also using the same materials-and-systems stack in grid and defense partnerships. The company’s own framing is that reliable power, not chips, has become the bottleneck in AI infrastructure; its commercial pitch is to smooth millisecond load spikes, shrink grid-connection requirements, and reduce thermal risk without relying on lithium-heavy chemistries. The result is a company that should be analyzed as an infrastructure enabler with a vertically integrated European supply base, not just as a component startup.'
