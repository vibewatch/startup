  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Post-money valuation, secondary pricing, and banker valuation range for the 2026 pre-IPO round.
    whyItMatters: Valuation discipline is central to any investment judgment and cannot be inferred from round size alone.
    diligencePath: Request the pre-IPO deck, board financing memo, and latest cap-table summary from management or lead investors.
    relatedQuestionRefs:
    - QO014
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A complete board roster, committee structure, and any investor board-rights summary.
    whyItMatters: A founder-led pre-IPO company selling mission-critical infrastructure should be evaluated on governance depth, not only founder quality.
    diligencePath: Request board list, observer rights, and governance documents; reconcile with shareholder agreements and financing terms.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current revenue, ARR, customer concentration, and gross-margin data for the AI, grid, and mobility businesses.
    whyItMatters: The company is presenting late-stage industrial scale, but public sources do not reveal whether commercial traction is broad, concentrated, or margin-accretive.
    diligencePath: Request audited financial statements, management accounts, and top-customer schedule with contracted volumes and pricing.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: minor
    topic: us-manufacturing-site
    missingEvidence: Exact location, capacity, capex, and commissioning status of the promised U.S. manufacturing footprint.
    whyItMatters: U.S. manufacturing is part of the IPO and sovereign-infrastructure narrative, but public evidence only confirms the Houston engineering hub and a plan statement.
    diligencePath: Request site-selection memo, incentive package, and commissioning timeline for U.S. manufacturing.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
    - TO004
