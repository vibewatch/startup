- id: capital-base-and-industrial-scale
  title: Capital Base and Industrial Scale
  body: 'Skeleton entered 2026 as a late-stage private company and used the May 2026 pre-IPO first close to make that explicit. The company said it raised €33 million in the first close and had reached €392 million of lifetime venture funding, with a 2027 U.S. IPO as the stated next milestone. Importantly, this was not an early-stage leap: the 2023 €108 million round had already brought in Siemens Financial Services, Marubeni, and CBMM, and partner-backed sources described Siemens as investor, supplier, customer, and factory-digitization partner. Marubeni likewise appears as both capital provider and commercial route-to-market ally in Asia.


    Industrial scale is the matching half of the capital story. By late 2025 Skeleton had opened its Leipzig SuperFactory and described Finland’s SuperBattery plant as part of a broader manufacturing network, while 2026 added the Houston engineering outpost and a stated plan for U.S. manufacturing. The disclosed numbers remain incomplete — valuation, revenue, and ARR are still not public — but the combination of repeated strategic investors, multiple factories, and a pre-IPO narrative indicates a company being financed as infrastructure-heavy deep tech rather than as a capital-light software bet.'
