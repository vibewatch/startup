callouts:
  - calloutType: risk
    title: Incumbent-procurement risk is the core competitive threat
    body: >-
      Skeleton's direct component rivals create price pressure, but the harder competitive problem is buyer substitution into incumbent UPS and modular-power stacks from Eaton and Vertiv, especially where service depth and qualification history matter more than chemistry novelty.
    claimRefs: [CP018, CP022, CP031, CP036]
