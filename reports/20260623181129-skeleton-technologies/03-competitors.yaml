schemaVersion: report-v2
artifact: competitors
slug: skeleton-technologies
runDate: '2026-06-23'
company:
  name: Skeleton Technologies
chapter:
  number: 3
  title: Competitors
  summary: >-
    Skeleton Technologies competes in three different arenas at once: direct supercapacitor and
    hybrid-capacitor vendors such as CAP-XX, Panasonic, KYOCERA AVX/KEMET, VINATech, and Yunasko;
    enterprise substitute architectures from Eaton and Vertiv that already own AI data-center UPS
    procurement; and the Maxwell/Tesla legacy that proves high-power ultracapacitors are not a new
    category. Skeleton's best wedge is not commodity component distribution but rack-to-grid AI
    power systems—GrapheneBBU and GrapheneUPS—yet the same focus exposes it to incumbent channel
    power, quote-based procurement, and adverse manufacturing-execution evidence.
sections:
  - id: competitive-landscape-and-buyer-alternatives
    title: Competitive Landscape and Buyer Alternatives
    body: >-
      Buyers do not evaluate Skeleton against one neat peer set. The direct component peer group is
      the supercapacitor and hybrid-capacitor vendor field: CAP-XX sells thin prismatic,
      cylindrical, coin-cell, and lithium-ion-hybrid parts; Panasonic and KYOCERA AVX/KEMET sell
      broad capacitor catalogs through authorized distribution; VINATech sells EDLC and LiC parts
      into UPS, automotive, telecom, and industrial applications; and Yunasko still markets power,
      energy, and hybrid ultracapacitor cells and modules, albeit with pilot-plant constraints. The
      substitute set is different: Eaton and Vertiv already sell AI-data-center power chains,
      modular UPS architectures, and high-power backup systems that can satisfy the same job
      Skeleton is attacking with GrapheneUPS and GrapheneBBU. A third reference class is the
      Maxwell/Tesla legacy, which matters because it demonstrates that million-cycle,
      high-power-density ultracapacitor performance is an established benchmark rather than a
      category that Skeleton invented. The result is a market where the customer can solve the same
      resilience problem with a cell vendor, a module vendor, or an incumbent power-integrator, and
      can often multi-home across those categories.
    claimRefs: [CP001, CP006, CP010, CP012, CP014, CP016, CP017, CP018, CP023, CP027, CP040]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: feature-and-capability-comparison
    title: Feature and Capability Comparison
    body: >-
      Skeleton's strongest differentiation is at the system layer, not the broadest component shelf.
      Official pages frame the company as an AI-infrastructure and grid-power provider with
      microsecond response, 100+ kW rack relevance, GrapheneBBU cabinets rated at 800 kW, and
      GrapheneUPS positioned as a no-break resilience layer near critical AI equipment. That is a
      different promise from CAP-XX, whose public product story is compact electronics and hybrid
      capacitor form factors, or from Panasonic and KYOCERA AVX, whose visible strengths are broad
      catalog availability, authorized distribution, and standard parts. VINATech is a closer
      technical adjacency because it openly markets EDLC and LiC products into UPS and power-quality
      applications. Yunasko publishes credible power and energy figures for modules, but the same
      page still warns of limited pilot-plant capacity, which weakens immediate competitive threat.
      Eaton and Vertiv, meanwhile, do not compete on cell chemistry marketing; they compete on
      installed-base trust, integrated design, and conventional buyer comfort with modular UPS and
      battery ecosystems. For investment purposes, that means Skeleton's wedge is best understood as
      application-level integration plus footprint and response claims, not as unassailable control
      of the underlying capacitor component category.
    claimRefs: [CP001, CP003, CP004, CP006, CP009, CP012, CP014, CP016, CP017, CP018, CP030, CP033, CP034, CP035, CP036]
    tableRefs: [TP002]
    figureRefs: [FP002]
  - id: pricing-packaging-and-channel-power
    title: Pricing, Packaging, and Channel Power
    body: >-
      Public pricing evidence sharply separates Skeleton from most component rivals. Distributor
      pages expose low-friction price discovery for CAP-XX, Panasonic, KYOCERA AVX, and VINATech,
      with published unit prices and volume breaks for parts ranging from sub-$1 small-form-factor
      CAP-XX and Panasonic components to double-digit-dollar high-capacitance VINATech modules.
      That transparency makes those vendors easy to sample, substitute, and benchmark. By contrast,
      the retained public Skeleton evidence is dominated by enterprise product pages and a legacy
      DigiKey listing for the obsolete SkelMod 51V module; no public list price appeared in the
      retained GrapheneBBU or GrapheneUPS materials, and the enterprise message is effectively
      quote-driven. Eaton and Vertiv show the same enterprise pattern: public architecture claims,
      no visible list pricing. Commercially, that cuts both ways. Skeleton avoids immediate
      commoditization on its current AI-power products because buyers cannot price-scrape them like
      commodity components, but it also means enterprise procurement teams may default to incumbent
      UPS vendors with broader channels, reference accounts, and financing relationships. Publicly
      visible distribution breadth today still favors the incumbents and catalog vendors over
      Skeleton.
    claimRefs: [CP008, CP009, CP011, CP013, CP015, CP031, CP039]
    tableRefs: [TP003]
    figureRefs: []
  - id: moat-durability-and-adverse-evidence
    title: Moat Durability and Adverse Evidence
    body: >-
      The durable part of Skeleton's moat is application fit: microsecond response, compact backup
      bridging, and a rack-to-grid story that makes sense for volatile AI loads and for buyers
      worried about footprint, thermal runaway, and fast recharge. But the moat is not cleanly
      protected from incumbent retaliation. Vertiv and Eaton already sell AI-ready UPS and modular
      power architectures, and they do so with global service organizations, familiar procurement
      motions, and chemistry-agnostic integration around lithium-ion, nickel-zinc, and broader
      backup portfolios. The Maxwell/Tesla lineage also undercuts any claim that long-cycle
      ultracapacitor reliability is novel; Clarios' 2025 Maxwell acquisition kept datacenter, grid,
      and industrial customer relationships alive under a large incumbent owner. The main adverse
      evidence is internal to Skeleton: ERR reported production disruption, missed 2024 growth
      goals, supplier issues, Leipzig delays, and layoffs in Estonia. That matters because buyers of
      mission-critical power systems care about manufacturing repeatability and service confidence as
      much as chemistry. In short, Skeleton's moat looks real but conditional: strongest where AI
      operators value footprint and power quality, weakest where buyers prioritize incumbent service
      depth, proven field fleets, and conventional UPS procurement.
    claimRefs: [CP017, CP018, CP022, CP026, CP027, CP028, CP029, CP036, CP037, CP038]
    tableRefs: [TP004]
    figureRefs: [FP003]
