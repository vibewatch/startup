        - { x: 5, y: 6, label: 'VINATech', detail: 'UPS-adjacent EDLC/LiC portfolio with public pricing' }
        - { x: 2, y: 5, label: 'Yunasko', detail: 'Interesting module specs but limited pilot capacity' }
        - { x: 10, y: 8, label: 'Eaton', detail: 'Grid-to-chip AI power, 160+ country reach' }
        - { x: 9, y: 8, label: 'Vertiv', detail: 'Trinergy/PowerNexus AI UPS and continuity stack' }
        - { x: 8, y: 6, label: 'Maxwell / Clarios legacy', detail: 'Established ultracap benchmark and incumbent relationships' }
    approximationNotes: >-
      X-axis is ordinal channel power / installed-base trust (1 low, 10 high). Y-axis is ordinal fit for Skeleton's target job of short-duration AI-load stabilization and backup bridging (1 low, 10 high). Scores synthesize retained public evidence rather than audited market share.
