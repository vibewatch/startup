  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing metric / document
      - Impact
      - Exact diligence path
    rows:
      -
        - Audited 2024-2025 group financial statements
        - Without audited revenue, gross profit, opex, and cash flow, revenue quality and runway cannot be underwritten
        - Request audited group accounts, statutory entity bridge, and management discussion pack
      -
        - Product-line revenue mix and realized ASPs
        - North America mix is known directionally, but stream economics are still opaque
        - Request revenue by components, GrapheneGPU, GrapheneUPS, GrapheneBBU, grid systems, and services
      -
        - Gross margin and warranty / service burden by product
        - Premium technical claims are meaningless if support and warranty erase margin
        - Request gross margin waterfall, warranty reserve policy, and field-service cost by deployment
      -
        - Cash balance, monthly burn, and runway plan
        - Capital adequacy cannot be assessed from round totals alone
        - Request monthly cash bridge, board runway target, and downside financing triggers
      -
        - Customer concentration and backlog conversion
        - Major U.S. hyperscaler and industrial references do not reveal concentration risk
        - Request top-10 customers, booked backlog, conversion timing, and cancellation rights
      -
        - U.S. manufacturing capex and financing package
        - Planned onshore expansion could require a new capital raise or leverage layer
        - Request site plan, total capex, subsidy stack, debt package, and commissioning timeline
      -
        - Registry-accessible parent filing set
        - Public filing access is incomplete, limiting external verification of statutory disclosures
        - Provide parent and subsidiary statutory filings or direct registry download links in the data room
    notes: >-
      These are the minimum missing documents and metrics that prevent this chapter from moving from
      public-source analysis to an underwritten financial view.
