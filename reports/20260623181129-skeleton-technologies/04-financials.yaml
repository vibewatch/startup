  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: liquidity
      missingEvidence: Current cash balance, monthly burn, and board runway plan.
      whyItMatters: These are the core variables needed to judge whether the 2026 first close is sufficient against ongoing factory and U.S. expansion spend.
      diligencePath: Request the latest board pack cash bridge, 13-week cash forecast, and function-level burn schedule.
      relatedQuestionRefs: [QI020, QI023]
      relatedTableRefs: [TI004, TI005]
    - type: private-evidence-only
      severity: blocking
      topic: revenue-mix
      missingEvidence: Product-line revenue mix, realized ASPs, discounts, and customer concentration data.
      whyItMatters: A company can have strong deployments and still have weak revenue quality if a few customers dominate or discounting is severe.
      diligencePath: Request 2024-2026 booked revenue by product line, top customers, geography, and realized ASP waterfall.
      relatedQuestionRefs: [QI024]
      relatedTableRefs: [TI001, TI002, TI005]
    - type: private-evidence-only
      severity: blocking
      topic: margins
      missingEvidence: Gross margin, warranty reserve, installation cost, and service burden by GrapheneGPU, GrapheneUPS, and GrapheneBBU.
      whyItMatters: Premium technical claims only matter financially if they survive post-sale support and installation economics.
      diligencePath: Request product-level gross margin bridge, warranty policy, field-service cost data, and recent deployment P&Ls.
      relatedQuestionRefs: [QI018, QI026]
      relatedTableRefs: [TI003, TI005]
    - type: missing-source
      severity: material
      topic: filing-access
      missingEvidence: Direct parent and subsidiary statutory filing downloads that expose financial statements or at least filed annual reports.
      whyItMatters: External verification of statutory disclosures is weak if investors cannot access the relevant filing set directly.
      diligencePath: Ask management for registry download links or PDF copies of the latest Estonian and German statutory filings.
      relatedQuestionRefs: [QI025]
      relatedTableRefs: [TI005]
    - type: private-evidence-only
      severity: material
      topic: us-capex-plan
      missingEvidence: Total U.S. manufacturing capex, financing stack, debt covenants, and incentive package.
      whyItMatters: Public disclosures confirm expansion intent but not whether it requires another raise or leverage layer.
      diligencePath: Request U.S. site budget, incentive letters, financing term sheets, and milestone-based draw schedule.
      relatedQuestionRefs: [QI020]
      relatedTableRefs: [TI004, TI005]
