company:
  name: Skeleton Technologies
chapter:
  number: 4
  title: Financials
  summary: >-
    Skeleton’s public financial picture is commercially credible but still too opaque for underwriting.
    The company now monetizes a mix of legacy components and higher-value AI and grid systems, yet the
    only explicit 2026 revenue-mix disclosure is management’s claim that roughly half of revenue comes
    from North American customers. Public evidence supports premium enterprise positioning, heavy factory
    capex, channel-assisted sales in Asia and grid markets, and substantial cumulative financing, but it
    does not disclose absolute revenue, realized ASPs, gross margin, cash, burn, or runway. The result
    is a business that looks demand-rich and capital-intensive, with clear diligence blockers around
    revenue quality, margin path, and near-term financing sufficiency.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing architecture
    body: >-
      Skeleton’s monetization stack is no longer a single supercapacitor-component story. The retained
      product evidence shows at least four commercial layers: legacy catalog cells and modules,
      GrapheneGPU power-smoothing systems for AI racks, GrapheneUPS no-break UPS systems for AI data
      centers, and GrapheneBBU / SuperBattery backup-bridging products for data-center operators.
      Public product pages consistently route current AI infrastructure buyers into direct sales rather
      than self-serve procurement, and the product-portfolio page explicitly says Skeleton does not
      service private customers. That is an important financial distinction: current growth products are
      being sold as engineered infrastructure solutions, not as commodity online SKUs.

      Pricing transparency is correspondingly uneven. The best list-price anchors are on legacy or
      component-adjacent distribution pages: DigiKey still shows an obsolete SKELMOD 51V module listing,
      while Octopart exposes current catalog-style pricing for older-format modules and cells such as
      SKELMOD 102V and SKELCAP SCA0300. By contrast, neither GrapheneUPS nor GrapheneBBU publishes a
      list price in the retained current evidence; both pages emphasize performance, footprint,
      grid-compliance, and contact-with-sales motions. That pattern supports a revenue-quality view in
      which Skeleton is trying to move away from price-transparent component sales and toward
      higher-ticket, custom-configured enterprise systems with negotiated pricing and potentially better
      gross-profit dollars per deployment.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
