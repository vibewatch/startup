- id: thesis-breaks-and-diligence
  title: Thesis-Break Triggers and Final Diligence Asks
  body: 'The key diligence conclusion is that Skeleton has already earned a place on the IC agenda, but not yet a clean valuation sign-off. The biggest thesis breakers are not scientific; they are disclosure and execution events. If 2027 commercialization milestones slip, if Leipzig/Finland utilization remains below expectations, if the company still refuses to disclose absolute revenue in IPO preparation, or if the cap table reveals a heavy preference stack, the current private narrative can de-rate very quickly. A delayed or pulled U.S. IPO would likely be interpreted less as patience and more as evidence that the public-ready metrics are not yet there.


    The most practical next steps are therefore diligence asks rather than more storytelling. Investors need exact post-money marks for the 2023 and 2026 rounds, the full liquidation waterfall, named customer concentration by revenue, audited gross margin and operating cash flow, and the committed rollout timetable for U.S. manufacturing and 2027 E-STATCOM commercialization. If those items come back strong, the case can move toward track or buy at the right price. If they remain hidden, the company may still be strategically important, but the investment case remains too evidence-light for conviction underwriting.'
