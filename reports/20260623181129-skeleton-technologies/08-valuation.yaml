- id: private-valuation-context
  title: Private Valuation Context and Disclosure Gaps
  body: 'The supportable private-market context is narrower than the marketing narrative. Company, industry-association, government, and startup-press coverage all agree that Skeleton announced a €33M first close in May 2026, lifted disclosed cumulative venture funding to €392M, added Axon Partners Group, SmartCap, and Taiwania Capital, and is preparing for a 2027 U.S. IPO. The 2023 E1 round is also well documented: Skeleton and Invest in Estonia describe a €108M financing involving Siemens Financial Services, Marubeni, and CBMM, and say total funding exceeded €300M after that round.


    What the public set does **not** disclose is the key valuation bridge: the exact post-money mark, liquidation preferences, anti-dilution terms, or a prospectus-grade revenue base. InforCapital labels Skeleton “Pre-IPO” and reports roughly $430M raised across seven rounds, which directionally corroborates the official €392M cumulative figure but still does not supply a verifiable post-money valuation. The often-repeated idea that the 2023 round was the “unicorn round” cannot be treated as a verified fact in this chapter because the reviewed public materials disclose financing size, not the post-money valuation.


    This matters because valuation is being asked to do all the work that operating disclosure is not doing. The more the case depends on private narrative—AI power bottlenecks, hyperscaler deliveries, sovereign-AI positioning, and future U.S. listings—the more investors need actual cap-table, margin, and customer-concentration evidence before underwriting a premium entry.'
