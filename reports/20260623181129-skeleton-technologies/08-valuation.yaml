- id: TV002
  title: Thesis / Anti-Thesis
  columns:
  - Side
  - Argument
  - Public support
  - What would change the view
  rows:
  - - Thesis
    - Skeleton has repositioned from component vendor to AI-power and grid-stability system supplier
    - GrapheneUPS, GrapheneGPU, E-STATCOM, U.S. expansion, hyperscaler-delivery claims
    - Evidence that products are still sold mainly as low-value components
  - - Thesis
    - Late-stage financing and planned 2027 U.S. IPO show sustained capital-market access
    - €33M May 2026 first close, €392M disclosed VC, new investors added
    - Pulled IPO plan or failed larger round close
  - - Thesis
    - North America and Asia partnerships support a platform-scale outcome
    - '>100 MW U.S. deployments, ~half of revenue from North America, Taiwania and Marubeni ties'
    - Partnerships fail to convert into named revenue or commercialization
  - - Anti-thesis
    - Public sources still do not disclose absolute revenue, EBITDA, or exact post-money valuation
    - Official and independent coverage cite funding size but not valuation or audited operating metrics
    - S-1 or private room provides revenue, margin, and cap-table clarity
  - - Anti-thesis
    - Execution slippage can collapse premium hardware narratives
    - ERR reports disrupted output, missed growth goals, and delayed Leipzig full production
    - Consistent plant utilization and clean delivery cadence
  - - Anti-thesis
    - Comparable-set outcomes vary too widely for blind premium underwriting
    - Vertiv 12.75x EV/revenue vs EnerSys 2.47x and CAP-XX negative EBITDA
    - Named hyperscalers and disclosed economics narrow the right multiple band
  notes: Arguments are evidence-backed and intentionally price-sensitive rather than generic quality statements.
