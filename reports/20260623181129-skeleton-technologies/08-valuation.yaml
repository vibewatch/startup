- id: TV005
  title: Thesis-Break and Kill Triggers
  columns:
  - Trigger
  - Threshold / event
  - Transmission to valuation
  - Action implication
  rows:
  - - IPO readiness slips
    - 2027 U.S. IPO target moves materially without compensating disclosure
    - Signals that public-ready metrics are weaker than the private narrative suggests
    - Pause underwriting and demand updated financing plan
  - - Execution slippage persists
    - Leipzig / Finland ramp continues to miss targeted delivery cadence
    - Pushes market view toward lower-multiple hardware comps
    - Re-rate comp set toward EnerSys / CAP-XX band
  - - No revenue disclosure
    - Management still avoids absolute revenue and gross-margin disclosure in late-stage materials
    - Prevents price-sensitive underwriting and blocks premium multiple case
    - Do not anchor to unicorn narrative without a discount
  - - Customer concentration disappoints
    - Named hyperscaler or major OEM exposure is absent or highly concentrated
    - Reduces confidence in repeatable AI-infrastructure demand
    - Tighten downside scenario and hold period assumptions
  - - Cap table is heavily senior
    - Preferences, ratchets, or PIK features absorb most upside
    - Common-equity return becomes unattractive even if IPO proceeds
    - Re-cut target return or walk away
  notes: Every trigger is monitorable and tied to disclosure or operating events rather than abstract narrative risk.
