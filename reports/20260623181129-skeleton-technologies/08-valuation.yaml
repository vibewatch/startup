- id: comparable-math-and-scenarios
  title: Comparable Valuation and Bull / Base / Bear Framing
  body: 'Because Skeleton’s public revenue base is undisclosed, the most supportable valuation method is not a fake precise enterprise value today; it is a comp-multiple hurdle analysis. The public comp set spans four distinct lenses. Vertiv, the highest-quality AI-power-infrastructure benchmark in the set, trades around 12.75x EV/revenue on roughly $10.84B of trailing revenue. Eaton trades around 6.67x EV/revenue on a much larger but more diversified electrical base. EnerSys trades around 2.47x EV/revenue as a more conventional power-storage hardware reference. CAP-XX is a useful small-cap supercapacitor check: about 5.75x EV/revenue on only £5.16M of trailing revenue and negative EBITDA.


    That spread lets us translate a unicorn-scale target into disclosed-revenue hurdles. A 1.0bn same-currency enterprise mark requires only about 78–125M of annual revenue if the market grants a bull-case Vertiv-like 8x–12.75x multiple. The base case—5.75x–8x—requires roughly 125–174M. A bear case that prices Skeleton closer to EnerSys-like 2.47x–5.75x hardware multiples requires roughly 174–405M. Public evidence today does not show where Skeleton lands inside those bands.


    That is why the valuation stance is **stretched**, not obviously wrong. If IPO materials reveal system-level AI-power adoption, named hyperscaler accounts, and margins consistent with infrastructure software-adjacent hardware, a premium can hold. If the company looks instead like a capital-intensive hardware manufacturer with intermittent execution slippage, public-market compression can be severe even if the technology is real.'
