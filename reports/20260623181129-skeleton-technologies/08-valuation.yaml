- id: TV006
  title: Final Diligence Asks
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Exact current post-money
    - Final May 2026 post-money valuation and share price by class
    - Required to test whether the current entry already assumes Vertiv-like outcomes
    - Company CFO / financing materials
  - - 2023 round valuation
    - Verified 2023 E1 post-money and whether it truly crossed unicorn level
    - Separates marketing shorthand from an audited valuation fact
    - Board materials, investor letters, or legal closing set
  - - Revenue and gross margin
    - Absolute revenue, gross margin, and operating cash flow by product line
    - Core input missing from every public comp bridge
    - S-1 draft, audit package, or management accounts
  - - Customer concentration
    - Named hyperscaler, OEM, and grid customers with revenue share
    - Distinguishes repeatable platform demand from pilot-heavy concentration
    - Commercial pipeline review and customer references
  - - Cap table and preference stack
    - Liquidation waterfall, anti-dilution, and any ratchets or PIK features
    - Late-stage downside can be driven more by seniority than by enterprise value
    - Legal due diligence and full cap-table export
  notes: These asks are the minimum package needed to move from research-more to an actual priced recommendation.
