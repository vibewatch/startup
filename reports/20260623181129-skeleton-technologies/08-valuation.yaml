  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-post-money
    missingEvidence: Exact May 2026 post-money valuation, share count by class, and security terms for the pre-IPO close.
    whyItMatters: Without the current post-money mark, investors cannot test whether the entry already assumes a Vertiv-like outcome.
    diligencePath: Request the financing deck, term sheet, and cap-table bridge from management or lead investors.
    relatedQuestionRefs:
    - QV001
  - type: private-evidence-only
    severity: material
    topic: 2023-unicorn-verification
    missingEvidence: Verified 2023 E1 post-money valuation and any board or investor materials that confirm or refute a unicorn step-up.
    whyItMatters: The 2023 round is frequently treated as the benchmark private mark, but the reviewed public sources do not prove that valuation fact.
    diligencePath: Obtain the 2023 closing set, investor update, or audited board materials.
    relatedQuestionRefs:
    - QV005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Absolute revenue, gross margin, EBITDA, and operating cash flow by product line or business unit.
    whyItMatters: Comparable-multiple underwriting is unreliable without knowing which revenue base and margin profile the market will actually price.
    diligencePath: Request audited financial statements, management accounts, and IPO-preparation materials.
    relatedQuestionRefs:
    - QV024
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: Full cap table, liquidation preferences, anti-dilution provisions, and any ratchets or PIK features.
    whyItMatters: Late-stage downside can be driven more by security seniority than by enterprise value, especially if IPO timing slips.
    diligencePath: Run full legal diligence on share classes and investor rights before underwriting a round.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: minor
    topic: customer-disclosure
    missingEvidence: Named hyperscaler or top-customer references with revenue contribution and renewal evidence.
    whyItMatters: The bull case depends on system-level customer quality, but current public materials cite deliveries without naming accounts.
    diligencePath: Request customer references, concentration tables, and contracted deployment schedules.
    relatedQuestionRefs:
    - QV019
