- id: architecture-controls-and-manufacturing
  title: Architecture, Controls, and Manufacturing
  body: 'The most credible part of Skeleton’s architecture story is that it is specific. The materials page says the group covers the entire value chain from microporous carbon material to cells, modules, systems, control algorithms, and software, with Curved Graphene produced by Skeleton Materials in Bitterfeld-Wolfen. The product datasheets then expose how that stack gets packaged. SkelGrid publishes a cabinet architecture with 1–10 modules, a ring-bus communications network, multiple temperature sensors, switchgear, and a master controller that calculates state-of-health and balancing logic. GrapheneBBU publishes integrated DC/DC conversion and BMS, while GrapheneUPS publishes a three-phase full-4Q SiC inverter, GaN-based DC/DC, Modbus TCP, HMI support, maintenance bypass, and optional SkelGrid-based storage up to 1500 VDC. Manufacturing is likewise legible enough to matter: Leipzig is tied to graphene-based supercapacitors, Varkaus to SuperBattery manufacturing, and independent reporting
    says those two plants now cover the company’s main product lines for AI, grid, mobility, and defense. That specificity is a strength, but it also makes execution traceable: any disruption at materials, Leipzig, or Varkaus directly touches named products rather than a generic platform.'
