figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Skeleton’s architecture stacks materials, cells, modules, power electronics, and application-specific systems rather than selling a single undifferentiated capacitor.
  data:
    layers:
    - label: Curved Graphene Materials
      detail: Bitterfeld-Wolfen subsidiary Skeleton Materials produces curved-graphene microporous carbon and protects the process with patent families.
    - label: Cell Layer
      detail: SkelCap supercapacitor cells and SuperBattery D35/D60 cells provide the core storage elements with different power-energy envelopes.
    - label: Module / Cabinet Layer
      detail: SkelMod, SkelGrid, GrapheneBBU modules, and related cabinets package cells into rail, grid, and AI-data-center form factors.
    - label: Power Electronics & Controls
      detail: Integrated BMS, DC/DC conversion, SkelGrid master controller, CAN, Modbus TCP, Redfish, and UPS inverter logic manage balancing and dispatch.
    - label: Application Systems
      detail: GrapheneGPU, GrapheneBBU, GrapheneUPS, and SkelGrid deploy the stack into AI, grid, mobility, and mission-critical workflows.
  claimRefs:
  - CE009
  - CE010
  - CE015
  - CE022
  - CE026
  - CE043
  - CE044
- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: In the AI-data-center workflow, Skeleton inserts different products at the peak-shaving, backup-bridging, and no-break UPS moments rather than selling only one rack type.
  data:
    nodes:
    - id: n1
      label: Base Grid Feed
      detail: Compute hall draws baseline power from the grid or upstream plant.
      type: step
    - id: n2
      label: Idle or Low-Load Window
      detail: GrapheneGPU charges while GPUs are not drawing peak load, preparing energy for the next spike.
      type: step
    - id: n3
      label: AI Compute Spike
      detail: GPU clusters swing sharply upward in power demand and would otherwise force dummy loads or oversizing.
      type: decision
    - id: n4
      label: GrapheneGPU Peak Shaving
      detail: Peak-shaving shelf discharges to smooth demand and cut the apparent peak seen by the grid.
      type: step
    - id: n5
      label: GrapheneBBU Backup Bridge
      detail: If the upstream feed sags or disappears, BBU modules bridge critical racks for roughly seconds-scale continuity.
      type: step
    - id: n6
      label: GrapheneUPS Ride-Through
      detail: UPS layer conditions power, maintains VRT/no-break operation, and integrates scalable energy-storage cabinets.
      type: step
  claimRefs:
  - CE013
  - CE017
  - CE019
  - CE021
  - CE023
