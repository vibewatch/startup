chapter:
  number: 5
  title: Product & Technology
  summary: 'Skeleton Technologies now presents a full stack from Curved Graphene materials and SkelCap/SkelMod components to SkelGrid cabinets, SuperBattery products, and AI-data-center power systems such as GrapheneGPU, GrapheneBBU, and GrapheneUPS. The strongest public evidence is technical rather than commercial: datasheets expose concrete voltages, power levels, control interfaces, and manufacturing-site/product-line links, while Varkaus holds current ISO 9001 and ISO 14001 certificates for SuperBattery production. The main chapter-5 risks are that public proof is still much stronger on specifications than on field reliability, pricing, named GrapheneUPS/GrapheneGPU deployments, or refreshed German quality certificates after their May 2026 expiry.'
sections:
- id: product-portfolio-from-cells-to-systems
  title: Product Portfolio From Cells to Systems
  body: 'Skeleton’s 2026 product surface is materially broader than a simple supercapacitor catalog. Public pages and datasheets show a stack that starts with SkelCap cells, extends through SkelMod modules and SkelGrid cabinets, and now reaches AI-data-center products such as GrapheneGPU peak-shaving shelves, GrapheneBBU backup-bridging units, GrapheneUPS systems, and SuperBattery cells, modules, and racks. That breadth matters because it changes the underwriting question from “is this a component vendor?” to “how much of the customer’s short-duration power workflow can Skeleton own?” The component layer is still real: SkelCap cells publish 2.85 V and 3.0 V options, while the SCF3400 and SCX5000 datasheet exposes million-cycle, high-power D60 cells. But the same public evidence also shows rail-capable and grid-capable modules, a modular SkelGrid cabinet, and purpose-built AI racks. Skeleton’s differentiation story is therefore less about one magic SKU and more about reusing the same materials
    and power-storage base across multiple product wrappers aimed at data centers, grids, rail, heavy transport, and other mission-critical power applications.'
