    - Controls conversion between grid/load/DC bus and storage
    - GrapheneBBU DC/DC, GrapheneUPS SiC inverter and GaN module converters
    - Converter field reliability and service procedures are not publicly documented
  - - Control / software layer
    - Balances cells, exposes SoH/SoC, and coordinates charging and discharge behavior
    - SkelGrid master controller, GrapheneGPU BMS, Modbus TCP, Redfish, CAN/RS-485
