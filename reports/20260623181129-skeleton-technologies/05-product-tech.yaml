    - Materials or process disruption would affect the whole stack
  - - Cell layer (SkelCap / SuperBattery)
    - Stores short-duration power with different power-energy trade-offs
    - Published cell chemistries, form factors, and production quality
    - Public sources do not expose yield, scrap, or warranty curves
  - - Module / cabinet layer (SkelMod / SkelGrid / BBU / CBU)
    - Packages cells into rail, grid, and AI-ready mechanical/electrical units
    - Module mechanical design, cooling, and switchgear
    - Public evidence is incomplete on exhaustive SKU transitions and field failure modes
