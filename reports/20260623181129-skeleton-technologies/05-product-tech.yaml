- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - Skeleton solution
  - Measurable benefit
  - Limitation
  rows:
  - - AI GPU peak shaving
    - GPU racks create spiky demand and operators burn energy on dummy loads
    - GrapheneGPU charges when GPUs are idle and discharges during compute spikes
    - Official and independent sources cite up to ~40% more compute and ~44-45% lower energy or peak-demand burden under test conditions
    - No public customer-specific savings study retained
  - - Rack backup bridging
    - Critical AI loads need seconds-scale backup close to the rack
    - GrapheneBBU modules and racks provide 400 VDC backup bridging
    - Up to 90-second duration, up to 800 kW single-cabinet positioning, lower footprint claim
    - No public installed-base reliability or RMA data retained
  - - No-break UPS / voltage ride-through
    - Traditional UPS footprints and response profiles can constrain AI halls
    - GrapheneUPS provides double-conversion UPS with VRT and close-to-load deployment
    - 50% lower footprint claim, 242 kW/m² UPS density claim, and scalable 500 kW+ classes in datasheet
    - No public production deployment references or quote examples retained
  - - Grid power quality and short backup
    - Renewables and industrial loads need fast frequency/voltage support
    - SkelGrid cabinet and grid modules support peak shaving, frequency regulation, and short-term backup
    - Up to 3 MW / 300 ms per full cabinet and modular scaling to containerized systems
    - Public evidence does not disclose realized project economics
  - - Rail and engine start
    - Vehicles need high-power starts and ruggedized modules in harsh conditions
    - SkelStart and SkelMod mobility modules
    - Rail-certified/IP65 public module plus -40°C to +65°C operation on the 51V datasheet
    - Current named operators are not retained in this chapter
  - - High-power battery use cases
    - Buyers need faster-cycling chemistry than conventional lithium-ion for mission-critical pulses
    - SuperBattery cells, modules, and racks
    - Up to 60C charging and 50,000-cycle life in the D35/D60 datasheet
    - Public evidence does not show detailed field aging or warranty curves
  notes: Benefits reflect retained public specification and news claims; they do not substitute for audited customer case studies.
