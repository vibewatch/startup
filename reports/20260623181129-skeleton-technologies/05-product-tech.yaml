- id: roadmap-differentiation-and-open-risks
  title: Roadmap, Differentiation, and Open Risks
  body: 'The 2025–2026 roadmap is visible enough to show momentum. GrapheneGPU’s 2025 launch and shipment timing, the November 2025 Varkaus and Leipzig plant openings, the 2026 GrapheneUPS product surface, and the Taiwania-backed industrial scale-up all point to a company trying to move from high-power components into a larger AI-infrastructure role. The differentiator claim is coherent: Curved Graphene avoids dependence on several critical raw materials, supports high micropore ratios, and underpins products that can respond in microseconds, sit close to critical loads, and avoid lithium-heavy thermal-runaway narratives. But the unresolved commercial and technical risks remain material. Public sources still do not provide list pricing or quote examples for GrapheneGPU, GrapheneBBU, GrapheneUPS, or SkelGrid. Independent field reliability, RMA, or uptime data for the AI products remain absent. Independent news also records that the Leipzig ramp was delayed and that 2024 output disruption
    and Estonia layoffs accompanied the scale-up. The right chapter-5 reading is therefore “specific and promising product stack, but commercial proof and manufacturing-confidence proof still lag the specification surface.”'
