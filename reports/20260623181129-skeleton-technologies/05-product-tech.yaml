- id: trust-quality-and-compliance
  title: Trust, Quality, and Compliance
  body: 'Trust evidence is mixed: public documentation is strong on technical paperwork, but uneven on whether every quality artifact is current. The clearest positive signal is Varkaus, where DNV certificates on Skeleton’s site show ISO 9001:2015 and ISO 14001:2015 validity through January 2029 for SuperBattery manufacturing. Product pages also publish concrete qualification language: GrapheneBBU claims OCP T4 alignment, while the GrapheneUPS datasheet lists EN IEC 62040-1/-2/-3 and multiple UL standards plus grid-code and voltage-ride-through features. Skeleton also maintains practitioner-facing proof through DigiKey training modules and a careers page that still recruits engineers, scientists, operators, and manufacturing staff around AI infrastructure and critical industries. The weaker signal is Germany. The public ISO 9001 and IATF 16949 certificates hosted on Skeleton’s downloads surface both show validity ending on 2026-05-10, which is before this run date, and no refreshed replacement
    certificate was retained in this chapter’s public evidence set. That does not prove a compliance lapse, but it does mean the public trust surface is incomplete precisely where the company is asking buyers to trust mission-critical power hardware.'
