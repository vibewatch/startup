- id: customer-workflows-and-use-cases
  title: Customer Workflows and Use Cases
  body: 'The highest-value customer workflow Skeleton describes is AI-data-center power conditioning close to the compute load. GrapheneGPU is presented as a peak-shaving shelf that charges while GPUs are idle and discharges during compute spikes, explicitly to eliminate dummy loads and smooth the grid draw of AI clusters. GrapheneBBU handles a different point in the workflow: short-duration backup bridging at the rack or cabinet level, with up to 90 seconds of support and a 400 VDC interface for OCP-style environments. GrapheneUPS sits one level up again as a double-conversion UPS that adds ride-through, grid-code support, and broader system resilience. Outside AI, Skeleton still points customers to SkelGrid for voltage and frequency regulation, short-term backup, and peak shaving on industrial and grid applications, while older module families remain tied to rail, engine start, bus, truck, and other heavy-duty use cases. In effect, Skeleton’s workflow strategy is to slot the same high-power
    storage logic into different operational moments: instantaneous peak smoothing, short backup bridging, and broader power-quality or ride-through support.'
