  topStrengths:
    - Differentiated high-power stack from Curved Graphene materials and supercapacitor modules to GrapheneUPS/BBU and SkelGrid systems aimed at AI, grid, and industrial loads.
    - Real industrial footprint with Leipzig and Varkaus factories plus public North America traction provides more scale proof than most deep-tech storage startups.
    - Named ecosystem proof across Siemens, GE/Hitachi Energy, GE Healthcare, IndyCar, Hyosung, and TEKEVER shows demand across infrastructure and mission-critical segments.
  topRisks:
    - Revenue, ARR, gross margin, cash, backlog, and exact post-money valuation remain undisclosed, limiting any priced underwriting case.
    - Leipzig ramp delays, supplier issues, and Estonia layoffs show manufacturing execution risk persists even after new factory launches.
    - The 2027 U.S. IPO narrative depends on converting largely unnamed AI data-center demand and partner announcements into durable, visible economics.
  unresolvedGaps:
    - Exact post-money valuation, share-price-by-class, and liquidation waterfall for the May 2026 pre-IPO round.
    - Absolute revenue, gross margin, cash burn, runway, and signed backlog by product line.
    - Named hyperscaler/customer concentration data, contract duration, and renewal behavior for AI and grid programs.
    - Updated Germany quality/compliance evidence after the May 2026 certificate expiries referenced in retained public materials.
