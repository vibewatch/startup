companyProfile:
  summary: >-
    Skeleton Technologies is an Estonian-founded, Tallinn-headquartered high-power energy
    storage company launched in 2009 by Taavi Madiberk and Oliver Ahlberg. It now spans
    Curved Graphene supercapacitors, SuperBattery products, SkelGrid cabinets, and AI-data-
    center power systems such as GrapheneGPU, GrapheneBBU, and GrapheneUPS. The company has
    scaled its manufacturing footprint through the Leipzig SuperFactory and the Varkaus
    SuperBattery plant while expanding into AI data center power, grid-stability
    infrastructure, industrial applications, and defense-adjacent programs. In May 2026 it
    announced a €33 million first close of a larger pre-IPO round that brought disclosed
    cumulative venture funding to €392 million ahead of a planned 2027 U.S. IPO, but public
    revenue, margin, and valuation disclosure remains limited.
  foundedDate: null
  founders:
    - name: Taavi Madiberk
      role: CEO & co-founder
      background: Public face across fundraising, product launches, U.S. expansion, and grid/defense partnerships in retained 2023-2026 sources.
      claimRefs: [CO022]
    - name: Oliver Ahlberg
      role: Co-founder
      background: Independent funding trackers and startup press continue to identify him as a co-founder since 2009, anchoring historical founder continuity.
