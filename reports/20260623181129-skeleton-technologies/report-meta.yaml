  productSummary: >-
    Skeleton sells high-power supercapacitor cells and modules, SuperBattery products,
    SkelGrid cabinets, and higher-level power systems including GrapheneGPU, GrapheneBBU,
    and GrapheneUPS for AI data centers, grid power quality, backup power, mobility, and
    industrial applications.
  customerFocus: >-
    Hyperscalers and AI data-center operators; grid and utility OEMs; rail, healthcare,
    industrial, and mobility OEMs; and defense/autonomous-systems partners.
  businessModel: >-
    Revenue appears to come from selling components, modules, cabinets, and integrated power
    systems through direct enterprise programs plus strategic partner/distributor channels
    such as Siemens, Marubeni, Hyosung, and defense-industry relationships.
  stage: late-stage private / pre-IPO
  fundingStatus: >-
