evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Post-money valuation, secondary pricing, and banker valuation range for the 2026 pre-IPO round.
    whyItMatters: Valuation discipline is central to any investment judgment and cannot be inferred from round size alone.
    diligencePath: Request the pre-IPO deck, board financing memo, and latest cap-table summary from management or lead investors.
    relatedQuestionRefs:
      - QO014
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A complete board roster, committee structure, and any investor board-rights summary.
    whyItMatters: >-
      A founder-led pre-IPO company selling mission-critical infrastructure should be evaluated on governance depth, not
      only founder quality.
    diligencePath: >-
      Request board list, observer rights, and governance documents; reconcile with shareholder agreements and financing
      terms.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current revenue, ARR, customer concentration, and gross-margin data for the AI, grid, and mobility businesses.
    whyItMatters: >-
      The company is presenting late-stage industrial scale, but public sources do not reveal whether commercial
      traction is broad, concentrated, or margin-accretive.
    diligencePath: >-
      Request audited financial statements, management accounts, and top-customer schedule with contracted volumes and
      pricing.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: us-manufacturing-site
    missingEvidence: Exact location, capacity, capex, and commissioning status of the promised U.S. manufacturing footprint.
    whyItMatters: >-
      U.S. manufacturing is part of the IPO and sovereign-infrastructure narrative, but public evidence only confirms
      the Houston engineering hub and a plan statement.
    diligencePath: Request site-selection memo, incentive package, and commissioning timeline for U.S. manufacturing.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: som-visibility
    missingEvidence: >-
      Segment revenue, ASP, customer concentration, and conversion rates from pilot to recurring production by end
      market.
    whyItMatters: Without those inputs, public market-share math for Skeleton is storytelling rather than diligence-grade analysis.
    diligencePath: >-
      Request booked revenue, backlog, and customer concentration by AI data centers, grid, and transport plus cohort
      gross margin and contract duration.
    relatedQuestionRefs:
      - QM022
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: eu-compliance-scope
    missingEvidence: >-
      A counsel-grade mapping of which EU obligations apply to standalone supercapacitor products versus battery-class
      modules or hybrid systems.
    whyItMatters: >-
      The policy backdrop is clearly tougher on storage compliance, but the retained public sources do not cleanly
      resolve the product-scope line for every Skeleton configuration.
    diligencePath: >-
      Obtain outside-counsel or notified-body guidance tying specific Skeleton SKUs to the relevant EU battery,
      product-safety, and grid-interconnection obligations.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM004
  - type: conflicting-data
    severity: material
    topic: tam-contradiction
    missingEvidence: >-
      Same-scope market datasets that separate AI/grid/transport spend from automotive, consumer, and other broad
