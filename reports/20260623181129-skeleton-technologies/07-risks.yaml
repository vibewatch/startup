  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: battery-regulation-applicability
    missingEvidence: Product-by-product legal classification and battery-regulation compliance roadmap for SuperBattery, GrapheneBBU, and GrapheneUPS packaged systems.
    whyItMatters: Investors cannot size regulatory cost, launch timing, or disclosure readiness without knowing which SKUs fall into which battery categories.
    diligencePath: Request external counsel memo, internal compliance matrix, and named owner for passport and carbon-footprint workstreams.
    relatedQuestionRefs:
    - QR014
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: leipzig-permit-status
    missingEvidence: Project-specific permit files, competent-authority correspondence, and any modification approvals for Leipzig operations.
    whyItMatters: General German law is clear, but the exact plant-level regulatory burden determines how easily Skeleton can modify processes or expand output.
    diligencePath: Request permit register extracts, modification notices, and environmental audit summaries from management.
    relatedQuestionRefs:
    - QR016
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: us-manufacturing-plan
    missingEvidence: Named U.S. site, capex budget, equipment plan, and start-of-production timeline for the promised U.S. manufacturing footprint.
    whyItMatters: The sovereign-AI and North America growth narratives become harder to underwrite if U.S. manufacturing remains a plan statement only.
    diligencePath: Request board-approved U.S. expansion plan with milestones, site status, and customer-linked demand forecast.
    relatedQuestionRefs:
    - QR008
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-backlog
    missingEvidence: Account-level revenue mix, backlog quality, contract duration, and renewal or pilot-to-production conversion data.
    whyItMatters: Public partner and customer names do not reveal whether one or two accounts dominate the economics or whether deployments are repeatable.
    diligencePath: Request customer concentration table, pipeline conversion rates, and top-account contract summaries.
    relatedQuestionRefs:
    - QR024
    - QR033
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: cybersecurity-assurance
    missingEvidence: Customer-facing cybersecurity, vulnerability-management, and secure-communications assurance materials for digitally controlled power systems.
    whyItMatters: Modbus TCP and HMI exposure mean cyber assurance is part of product risk, especially for critical AI and defense infrastructure buyers.
    diligencePath: Request security architecture overview, penetration-test summary, supported hardening standards, and incident-response process.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: succession-and-bench-depth
    missingEvidence: Formal succession plan, board committee map, and retention statistics for manufacturing and product leadership.
    whyItMatters: Capital and product complexity are scaling faster than public governance disclosure, which elevates key-person and execution risk.
    diligencePath: Request leadership-depth review, committee charters, and compensation or retention framework for critical operators.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR004
