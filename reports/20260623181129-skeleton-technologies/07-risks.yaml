- id: operational-product-and-factory-risks
  title: Operational, Product, and Factory Risks
  body: 'The strongest publicly evidenced risk is that Skeleton has already experienced execution slippage while trying to industrialize at speed. ERR reported that 2024 orders were strong but production disruption reduced output, Leipzig was not yet fully operational when full production had originally been expected, and a supplier issue involving Manz contributed to the delay. That is exactly the kind of evidence investors should weight heavily because it comes before the company is asking the market to believe in further scale-up across Leipzig, Varkaus, Houston, and eventually U.S. manufacturing. Even after the official Leipzig opening, the underwriting question is not whether the ribbon-cutting happened; it is whether yields, supplier resilience, and customer qualification at volume are repeatable.


    The product layer adds a second operational burden. GrapheneUPS and GrapheneBBU are now sold as mission-critical AI power infrastructure, with public claims around grid-code compliance, voltage ride-through, no thermal runaway, smaller footprint, and very high power density. Those claims are directionally attractive, but the retained public evidence does not include independent fleet-performance studies, warranty statistics, or public case studies from named hyperscalers showing how the systems perform under real AI duty cycles. The datasheet also makes clear that these are digitally controlled, liquid-cooled systems with communications interfaces and human-machine interfaces, which means the operational surface area includes cybersecurity, controls engineering, cooling, and serviceability—not just electrochemistry. Uptime Institute''s 2025 survey adds context: AI infrastructure is being built amid worsening power constraints, supply-chain delays, and staffing pressure. In that environment,
    any field failure, qualification miss, or cyber-control weakness would transmit quickly into customer trust because Skeleton is selling uptime, not optional efficiency. The risk is therefore not that the technology proposition is implausible; it is that the commercial promise may be outrunning public reliability proof.'
