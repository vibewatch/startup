- id: mitigations-monitors-and-kill-criteria
  title: Mitigations, Monitors, and Kill Criteria
  body: 'The most useful way to underwrite Skeleton is to separate encouraging signals from thesis-break signals. The encouraging signals are visible: fresh capital, multiple strategic partners, official factory openings, a non-lithium positioning that resonates in data-center safety conversations, and some governance deepening through the independent-board appointment. Those points justify continued diligence. They do not clear the company for a clean risk downgrade because the public record still leaves too many mission-critical questions unanswered. A risk-reduction path exists, but it is evidence-based rather than narrative-based: investors need operating proof, not just more partnership announcements.


    Near-term monitors should therefore be concrete. First, Leipzig and Varkaus need repeatable output, not just capacity claims; any renewed supplier disruption, delayed line qualification, or customer-quality issue should be treated as a high-priority warning. Second, U.S. manufacturing should move from plan language to site, capex, and start-of-production evidence. Third, GrapheneUPS and GrapheneBBU need externally visible proof of field performance, whether through named customer deployments, warranties, or referenceable uptime data. Fourth, the legal and regulatory surface must tighten: exact battery-regulation applicability, plant-permit status, export-control handling, and cybersecurity assurance should all be documented before investors ascribe public-market-grade confidence to the story. The kill criteria are therefore straightforward. A repeat of Leipzig-style line slippage, failure to convert partner activity into verifiable customer diversification, inability to substantiate
    performance claims with independent evidence, or a need to push the 2027 listing story forward without better disclosures should all be treated as reasons to pause or materially re-price the thesis.'
