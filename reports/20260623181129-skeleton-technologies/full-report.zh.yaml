      - number: '3.2'
        title: 功能与能力对比
        blocks:
          - type: paragraph
            body: >-
              Skeleton 最强差异化在系统层，而不是最宽的组件货架。官方页面把公司定位为 AI 基础设施和电网电力供应商，强调微秒级响应、100+ kW 机架相关性、额定 800 kW 的 GrapheneBBU
              机柜，以及作为关键 AI 设备附近不断电韧性层的 GrapheneUPS。这不同于 CAP-XX 的承诺，后者公开产品故事是紧凑电子和混合电容形态；也不同于 Panasonic 与 KYOCERA
              AVX，它们可见优势是宽目录供货、授权分销和标准部件。VINATech 技术上更接近，因为它公开把 EDLC 与 LiC 产品营销到 UPS 和电能质量应用。Yunasko
              公布的模组功率和能量数据可信，但同一页面仍提示试点工厂产能有限，削弱了即时竞争威胁。Eaton 和 Vertiv 则不在电芯化学营销上竞争；它们靠装机基础信任、一体化设计，以及买方对模块化 UPS
              和电池生态的传统舒适感竞争。用于投资判断时，Skeleton 的切入口更应理解为应用级集成叠加占地和响应宣称，而不是对底层电容组件品类的不可攻破控制。
