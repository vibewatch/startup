      - number: '1.3'
        title: 资本基础与工业规模
        blocks:
          - type: paragraph
            body: >-
              Skeleton 以晚期私营公司的身份进入 2026 年，并通过 2026 年 5 月 IPO 前首关融资把这一点公开化。公司称首关融资 €33 million，累计风险融资达到 €392 million，并把
              2027 年赴美 IPO 列为下一里程碑。关键是，这不是早期阶段的跃迁：2023 年 €108 million 融资已经引入 Siemens Financial Services、Marubeni 和
              CBMM；有伙伴背书的来源把 Siemens 描述为投资方、供应商、客户和工厂数字化伙伴。Marubeni 也同时是出资方和亚洲商业落地盟友。


              工业规模是资本故事的另一半。到 2025 年底，Skeleton 已开设 Leipzig SuperFactory，并把芬兰 SuperBattery 工厂描述为更广制造网络的一部分；2026 年又新增
              Houston 工程据点，并提出美国制造计划。披露数字仍不完整——估值、收入和 ARR 仍未公开——但反复出现的战略投资者、多座工厂和 IPO
              前叙事，说明市场按基础设施密集型深科技，而不是轻资产软件押注，来融资这家公司。
