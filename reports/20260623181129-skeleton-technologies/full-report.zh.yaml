      - number: '8.4'
        title: 打破投资论点的触发器与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              关键尽调结论是，Skeleton 已经值得进入 IC 议程，但还没有拿到干净的估值签字。最大的投资论点破坏因素不是科学问题，而是披露和执行事件。如果 2027 年商业化里程碑延迟，如果
              Leipzig/Finland 利用率仍低于预期，如果公司在 IPO 准备中仍拒绝披露绝对收入，或者股权结构显示沉重的优先权堆栈，当前私募叙事可能很快降级。美国 IPO
              延迟或撤回，市场很可能不会把它解读成耐心，而会解读成公开市场就绪指标还没到位。


              因此，最实际的下一步不是听更多故事，而是提出尽调要求。投资者需要 2023 年和 2026 年轮次的准确投后标记、完整清算瀑布、按收入划分的具名客户集中度、经审计毛利率和经营现金流，以及美国制造和 2027 年
              E-STATCOM 商业化的承诺 rollout 时间表。如果这些材料足够强，案例可以朝跟踪或合适价格买入推进。如果它们仍被隐藏，公司可能依然具有战略重要性，但投资案例仍然证据太轻，无法形成有确信度的承销。
