      - number: '6.3'
        title: 耐久性、留存与扩张信号
        blocks:
          - type: paragraph
            body: >-
              Skeleton 没有公开披露 NRR、GRR、流失率或续约时间表，因此关系耐久性只能靠连续性信号推断，而不能用留存指标直接衡量。按这个口径，Siemens 是最清晰的多年锚点：2022 年出现运营关系，2023
              年出现资本关系，2025 年出现交付关系，2026 年又以客户 / 供应商 / 合作伙伴的框架出现。IndyCar/HRC 是第二强的连续性案例，因为部署在 2024 年上线，2025 年仍足够活跃，支撑了联盟和
              SAE 相关奖项报道。GE Healthcare 也可能是一段耐久关系，但保留下来的公开证据更少且更旧；2026 年的支撑主要来自 Skeleton 对长期供应商关系的描述，而不是新的客户侧案例研究。


              即便没有留存指标，扩张逻辑也看得见。AI 基础设施可以借助 Houston 工程能力和美国本地化制造扩张。若 e-STATCOM 在韩国商业化并出口到其他市场，电网项目可以通过 Hyosung 和
              Marubeni 放大。若探索性框架转成正式采购项目，防务可以通过 KNDS France 和 TEKEVER
              拓宽。问题在于，每条扩张路径都仍缺少公开合同经济性。因此，公开连续性代理指标支持「存在耐久关系」这一点，但不能证明这些关系的规模、利润率或续约价值。
