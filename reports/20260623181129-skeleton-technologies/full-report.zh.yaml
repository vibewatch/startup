  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资 / 渠道信号
      - 目标细分
      - 差异化
      - 局限
    rows:
      - - CAP-XX
        - 直接超级电容器同业
        - 有公开市场投资人和监管披露；Newark 有公开经销商定价
        - 小型电子、嵌入式系统、薄型应用
        - 棱柱超薄、圆柱、纽扣电池和锂离子混合产品线
        - 小型化部件更强，AI 数据中心系统集成较弱
      - - Panasonic Industry
        - 直接组件既有厂商
        - 全球授权经销商网络；Avnet 有公开定价
        - 工业电子、备份、板级电源缓冲
        - 标准件供应广，授权渠道覆盖强
        - 竞争点在目录广度，而不是 AI 电力系统专精
      - - KYOCERA AVX / KEMET
        - 直接组件既有厂商
        - 大型目录平台，多类部件在 Avnet 有公开定价
        - 汽车、工业、医疗、消费电子
        - 电容器组合宽，组件分销成熟
        - 留存公开证据有限，难以支撑 AI 数据中心专属系统叙事
      - - VINATech
        - 直接模块 / EDLC / LiC 同业
        - Newark 可见经销商定价库存；DigiKey 有广泛应用主张
        - UPS、汽车、风电、电信、IoT、内存备份
        - 与 UPS 和电能质量场景明显重叠，并有更高电容部件
        - 主要在模块 / 组件层竞争，而不是机架到电网集成
      - - Yunasko
        - 规模有限的直接技术同业
        - 公开模块规格，但官网披露试验工厂供给受限
        - 高功率电芯和 16V / 48V 模块
        - 公开功率 / 能量指标强，混合和产品族宽
        - 产能有限，近期放量威胁较弱
      - - Eaton
        - 替代架构既有厂商
        - 2024 年收入近 $25B；客户遍布 160+ 个国家；有 AI 数据中心合作
        - 超大规模、模块化和预制 AI 数据中心
        - 从电网到芯片的电力栈，以及 800 VDC 模块化数据大厅架构
        - 传统既有厂商的技术栈可能挤出由新化学体系牵引的进入者
      - - Vertiv
        - 替代架构既有厂商
        - 全球 UPS 和连续性供应商，覆盖 130+ 个国家
