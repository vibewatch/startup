          - type: callout
            title: 1.0bn 标记在不同可比视角下需要完全不同的收入
            body: 按 12.75x EV/revenue，1.0bn 企业价值只需要约 78m 年收入；但按 2.47x，则需要约 405m。这个可比区间解释了为什么准确收入披露比另一句营销口号更重要。
            calloutType: insight
