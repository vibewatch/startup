  - id: FE001
    title: 产品架构地图
    type: stack
    layout: wide
    summary: Skeleton 的架构把材料、电芯、模块、电力电子和面向具体应用的系统层层叠起来，而不是只卖单一、无差异的电容器。
    data:
      layers:
        - label: Curved Graphene 材料
          detail: Bitterfeld-Wolfen 子公司 Skeleton Materials 生产曲面石墨烯微孔碳，并用专利族保护工艺。
        - label: 电芯层
          detail: SkelCap 超级电容电芯和 SuperBattery D35/D60 电芯提供核心储能单元，覆盖不同的功率—能量包络。
        - label: 模块 / 机柜层
          detail: SkelMod、SkelGrid、GrapheneBBU 模块及相关机柜把电芯封装成铁路、电网和 AI 数据中心形态。
        - label: 电力电子与控制
          detail: 集成 BMS、DC/DC 转换、SkelGrid 主控制器、CAN、Modbus TCP、Redfish 和 UPS 逆变器逻辑负责均衡和调度。
        - label: 应用系统
          detail: GrapheneGPU、GrapheneBBU、GrapheneUPS 和 SkelGrid 把这套栈部署到 AI、电网、出行和关键任务工作流。
    claimRefs:
      - CE009
      - CE010
      - CE015
      - CE022
      - CE026
      - CE043
      - CE044
  - id: FE002
    title: 客户工作流 / 运行流程
    type: flow
    layout: wide
    summary: 在 AI 数据中心工作流里，Skeleton 在削峰、备用桥接和不间断 UPS 等节点嵌入不同产品，而不是只卖一种机架类型。
    data:
      nodes:
        - id: n1
          label: 基础电网供电
          detail: 计算大厅从电网或上游电站汲取基线电力。
          type: step
        - id: n2
          label: 空闲或低负载窗口
          detail: GPU 未拉到峰值负载时，GrapheneGPU 充电，为下一次尖峰储能。
          type: step
        - id: n3
          label: AI 计算尖峰
          detail: GPU 集群功率需求急剧上冲，否则就会迫使客户使用假负载或过度配置。
          type: decision
        - id: n4
          label: GrapheneGPU 削峰
          detail: 削峰搁架放电，平滑需求，并降低电网看到的表观峰值。
          type: step
        - id: n5
          label: GrapheneBBU 备用桥接
          detail: 上游供电下陷或消失时，BBU 模块为关键机架桥接大约秒级连续性。
          type: step
        - id: n6
          label: GrapheneUPS 穿越
          detail: UPS 层调理电力，维持 VRT / 不间断运行，并集成可扩展储能机柜。
          type: step
    claimRefs:
      - CE013
      - CE017
      - CE019
      - CE021
      - CE023
      - CE037
