  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 当前确切投后估值
        - 2026 年 5 月最终投后估值，以及各类别股份价格
        - 用来检验当前入场价是否已假设 Vertiv 式结果
        - 公司 CFO / 融资材料
      - - 2023 轮估值
        - 已验证的 2023 年 E1 轮投后估值，以及是否确实跨过独角兽水平
        - 区分营销简写和经审计估值事实
        - 董事会材料、投资者信函或法律交割文件包
      - - 收入和毛利率
        - 按产品线拆分的绝对收入、毛利率和经营现金流
        - 每条公开可比公司桥都缺少这个核心输入
        - S-1 草稿、审计包或管理账
      - - 客户集中度
        - 具名超大规模客户、OEM 和电网客户及其收入占比
        - 区分可复制平台需求和大量试点造成的集中
        - 商业管线复核和客户访谈
      - - 股权结构和优先权栈
        - 清算瀑布、反稀释，以及任何棘轮或 PIK 特征
        - 后期下行更多可能由优先级驱动，而不是企业价值
        - 法律尽调和完整股权结构导出
    notes: 这些问题是从“继续研究”推进到实际定价建议所需的最低资料包。
