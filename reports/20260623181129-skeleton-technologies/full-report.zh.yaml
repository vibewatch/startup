  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开证明从宽泛的平台说法，收窄到更小一组具名、结果明确的部署，再收窄到有可见连续性的更小子集。
    data:
      nodes:
        - id: broad-demand
          label: 宽泛需求说法
          detail: 美国 100+ MW、北美贡献一半收入、主要 hyperscaler 交付、宽泛的多垂直行业叙事。
        - id: named-proof
          label: 具名对手方
          detail: Siemens、GE Healthcare、IndyCar/HRC US、Amtrak、Hyosung、Marubeni、KNDS France、TEKEVER、未具名聚变公司。
        - id: outcome-specific
          label: 结果明确的证明
          detail: MRI 图像质量和更低峰值取电；IndyCar 4.5s 循环和 60 hp；e-STATCOM 2027 年目标；Leipzig 交付。
        - id: continuity-proof
          label: 重复 / 连续性证明
          detail: Siemens 和 IndyCar 的可见连续性最好；较新的 2026 年项目缺少续约证据。
        - id: economic-proof
          label: 经济证明
          detail: 公开合同金额、收入占比和留存指标大多缺失。
      edges:
        - from: broad-demand
          to: named-proof
          label: 部分说法有具名主体，许多仍是汇总口径
        - from: named-proof
          to: outcome-specific
          label: 只有一个子集包含具体部署细节
        - from: outcome-specific
          to: continuity-proof
          label: 更少项目在多年中反复出现
        - from: continuity-proof
          to: economic-proof
          label: 续约和集中度数据大多仍属私有
    approximationNotes: 这张图是定性的；它展示证明质量如何从宽泛说法收窄到可用于经济承销的证据。
