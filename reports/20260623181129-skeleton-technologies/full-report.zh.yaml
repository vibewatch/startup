  - id: TV005
    title: 论点失效和终止触发器
    columns:
      - 触发器
      - 阈值 / 事件
      - 传导到估值
      - 行动含义
    rows:
      - - IPO 准备度下滑
        - 2027 年美国 IPO 目标出现实质性后移，且没有补偿性披露
        - 表明可面向公开市场的指标弱于私有市场叙事
        - 暂停承销，要求更新融资计划
      - - 执行滑坡持续
        - Leipzig / Finland 爬坡继续错过目标交付节奏
        - 市场看法会转向更低倍数的硬件可比公司
        - 将可比公司组重估至 EnerSys / CAP-XX 区间
      - - 没有收入披露
        - 管理层在后期材料中仍回避绝对收入和毛利率披露
        - 无法做价格敏感承销，也堵住了高溢价倍数案例
        - 没有折扣时，不应锚定独角兽叙事
      - - 客户集中度不及预期
        - 缺少具名超大规模客户或大型 OEM 敞口，或收入高度集中
        - 削弱对可复制 AI 基础设施需求的信心
        - 收紧下行情景和持有期假设
      - - 股权结构高度优先
        - 优先权、棘轮条款或 PIK 特征吃掉大部分上行
        - 即使 IPO 推进，普通股回报也会变得缺乏吸引力
        - 重切目标回报，或退出
    notes: 每个触发器都可监测，并与披露或经营事件挂钩，而不是抽象叙事风险。
