      - number: '1.4'
        title: 里程碑、伙伴关系与负面信号
        blocks:
          - type: paragraph
            body: >-
              2025-2026 年确立了后续章节应视为当前事实基础的经营形态。Skeleton 于 2025 年 11 月开设 Leipzig SuperFactory，并公开把它同时绑定欧洲电网应用和美国 AI
              数据中心需求；随后在 2026 年拓宽商业叙事：Houston 工程中心、GrapheneUPS 发布、Taiwania 主权 AI 投资合作、Hyosung/Marubeni e-STATCOM MoU，以及
              KNDS France 和 TEKEVER 防务协议，都在数月内落地。这一连串动作显示，公司正有意从证明组件性能，转向掌握更多系统栈和更多终端市场话语权。


              同一时间线也带着主要负面信号。ERR 报道称，供应商问题推迟了 Leipzig 全面投产，并伴随爱沙尼亚裁员；管理层也承认 2024
              年增长未达计划，尽管订单强劲。正确解读不是生存危机，而是执行风险：Skeleton 看起来能融资、能开厂，但工厂爬坡纪律仍然关键，因为公司向任务关键市场销售的是可靠性、主权性和工业就绪度。因此，后续章节应把
              2026 年伙伴势能视为真实存在，但不能假设制造执行已经毫无摩擦。
