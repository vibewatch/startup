      - number: '6.4'
        title: 集中度、采购摩擦与反向证据
        blocks:
          - type: paragraph
            body: >-
              Skeleton 客户叙事里最关键的缺口是集中度。公开来源点名了少数工业级交易对手——Siemens、GE Healthcare、GE Vernova、Hitachi Energy、HRC/IndyCar、经由
              Siemens Mobility US 的 Amtrak、Hyosung、Marubeni、KNDS
              France、TEKEVER，以及一家未具名的聚变公司——但没有披露每个账户占收入的比例，也没有说明是否有少数未具名 hyperscaler 主导北美收入。因此，集中度风险很可能有实质影响，只是目前还无法量化。


              采购摩擦本身也很高。AI 电力、电网稳定、铁路模块、MRI 设备和防务电力架构都意味着工程认证、安全审查和多方集成，而不是快速交易型销售。产品赢单后，这是一项优势，因为关系可能变得黏性很强；但它也意味着 logo
              证明不会自动转化为近期经常性收入。本章最主要的反向来源强化了这种谨慎：ERR 报道了 Leipzig 爬坡延迟、供应商问题和 Estonia
              裁员，管理层承认生产受扰、增长目标落空，同时坚称客户订单仍在交付。正确解读是：客户兴趣看起来真实，但制造执行和披露不透明仍然挡住了对耐久性和集中度的清晰承销。
