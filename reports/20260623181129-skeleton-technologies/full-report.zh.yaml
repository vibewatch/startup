      - number: '2.2'
        title: 规模测算视角与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              公开 TAM 数据适合用来定方向，不适合直接当投资真相。当前分析师摘要分歧很大：Coherent 估算 2026 年全球超级电容市场为 US$4.06 billion；Stratview 指向 2026 年
              US$8.5 billion；Kaiso 则把 2025 年市场放在 US$4.69 billion，并预计到 2035 年走向 US$32.89 billion。欧洲专项研究更窄，Market Data
              Forecast 估算 2026 年该地区为 US$1.22 billion。这些不是小数点级差异，而是汽车、消费、工业和电网用例纳入范围不同，再叠加起始年份和预测周期不同。


              对 Skeleton 来说，正确解读是：大类市场足够大，值得关注，但定义过于不一致，不能单独锚定估值。更可靠的视角，是把有证据支撑的邻近子市场叠起来：AI 数据中心电力调节、E-STATCOM
              等电网稳定资产，以及高循环交通或工业系统。即便这个 SAM 也只部分公开，因为没有保留来源把 AI UPS 或 BBU、构网响应、再生制动混合方案的支出池拆出来，并能直接映射到 Skeleton
              的收入机会。实际含义是，TAM 支撑叙事；SAM 和 SOM 则需要从合同、ASP 和部署转化做自下而上的尽调，而不能靠一条泛市场报告数字。
