      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公开领导层图景显示，公司仍由创始人主导，权力也相当集中。Taavi Madiberk 出现在融资、美国扩张、AI 产品发布和主权防务合作公告中，是公司明确的外部代表。Oliver Ahlberg
              仍被公开列为联合创始人；2026 年 3 月任命 Dr Kimmo Rauma 为独立董事，则是治理随芬兰制造扩张而走向专业化的最清晰证据。公开报道还突出 Priit Värk 负责制造执行、Arnaud
              Castaignet 参与战略和法国防务活动。


              尽调问题不是缺少领导者，而是治理深度仍不透明。保留来源没有给出完整公开董事会名单、委员会结构，或详细公开股权治理图谱。因此，即便公司在工业层面扩张，创始人 / CEO
              仍是实质性的关键人物依赖。对一家面向任务关键型基础设施的 IPO 前公司来说，这可以管理，但应持续跟踪：在更完整的治理披露出现前，投资者应假设执行判断、伙伴信号和公开可信度仍过度集中在少数具名领导者身上。
