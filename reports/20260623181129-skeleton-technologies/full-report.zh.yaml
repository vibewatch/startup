      - number: '2.4'
        title: 增长驱动、欧盟监管与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求侧逻辑很强。AI 数据中心用电需求在 2025 年增长 17%，AI 重点站点增长更快；保留材料中最好的技术综述称，机架级负载可超过 100
              kW，整座园区则可能进入数百兆瓦甚至吉瓦级。电网侧，欧洲正试图通过老化网络吸收更多电气化和可再生发电：欧盟委员会预计 2030 年前用电量将上升约 60%，称 40% 配电网已经超过 40 年，并估算本十年需要
              €584 billion 电网投资。这些条件正好创造出低惯量、对电能质量敏感的环境，快速响应和高循环寿命在这里有价值。


              约束同样真实。公用事业并网和加固周期可能长达四到十年，高压项目更久。铁路和其他重储能部署还面临安全工程、选址和应急响应障碍。欧盟政策顺风也更宽泛，并非定制化：已发布电网规划以技术中性方式强调灵活性和储能；电池制度则提高整个储能生态的合规预期，但没有给超级电容专门开快车道。最后，在长时任务上，超级电容的能量密度和每瓦时成本仍输给锂离子。这也是为什么当前市场论点最适合那些由停机、电力尖峰、电网规范合规、再生制动或循环强度主导购买决策的场景。
