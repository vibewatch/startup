chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品范围
        blocks:
          - type: paragraph
            body: >-
              Skeleton Technologies 是一家爱沙尼亚深科技储能公司，规模扩大后，它的定位反而更清楚了。公司 2009 年创立于 Tartu，如今总部在 Tallinn，并在德国、芬兰以及 2026 年起的
              Houston 拥有制造和工程资产。公开来源一致把 Skeleton 放在储能的高功率端，而不是长时储能电池：它开发曲面石墨烯超级电容器、SuperBattery 系统和机架级电力产品，目标场景是 AI
              数据中心、电网稳定、重型交通和防务。


              这个定位重要，因为商业模式如今已经不止卖电芯。到 2026 年，Skeleton 开始营销 GrapheneBBU 机架备份产品，并推出面向 AI 数据中心的
              GrapheneUPS，同时把同一套材料和系统栈用于电网与防务合作。公司自己的叙事是：AI
              基础设施的瓶颈已经从芯片转向可靠供电；商业卖点则是抹平毫秒级负载尖峰、缩小并网需求，并在不依赖高锂化学体系的情况下降低热风险。结果是，Skeleton
              更应被视为拥有欧洲垂直整合供应基础的基础设施赋能者，而不只是一个组件创业公司。
