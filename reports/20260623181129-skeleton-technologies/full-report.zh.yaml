      - number: '8.2'
        title: 私募估值背景与披露缺口
        blocks:
          - type: paragraph
            body: >-
              可支撑的私募市场背景比营销叙事更窄。公司、行业协会、政府和初创媒体报道都一致显示，Skeleton 于 2026 年 5 月宣布 €33M 首关，使披露累计风险融资升至 €392M，引入 Axon
              Partners Group、SmartCap 和 Taiwania Capital，并正在准备 2027 年美国 IPO。2023 年 E1 轮也有充分记录：Skeleton 和 Invest in
              Estonia 描述了一笔由 Siemens Financial Services、Marubeni 和 CBMM 参与的 €108M 融资，并称该轮后总融资超过 €300M。


              公开材料没有披露的是关键估值桥：准确投后标记、清算优先权、反稀释条款，或达到招股书级别的收入基础。InforCapital 将 Skeleton 标为「Pre-IPO」，并报道七轮累计融资约
              $430M，这在方向上印证了官方 €392M 累计数字，但仍没有提供可验证的投后估值。2023 年那轮融资是「独角兽轮」的常见说法，在本章不能当作已验证事实，因为审阅过的公开材料披露的是融资规模，而不是投后估值。


              这一点重要，因为估值正在承担运营披露没有承担的全部工作。投资案例越依赖私募叙事——AI 电力瓶颈、hyperscaler 交付、主权 AI
              定位和未来美国上市——投资者越需要真实的股权结构、利润率和客户集中度证据，才谈得上承销溢价入场。
            claimRefs:
