  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - AI 数据中心用电需求 2025 年增长 17%；AI 负载增速更快
        - 驱动
        - 当前 / 近期
        - 提高短时缓冲、合规电网备份和负载平滑的紧迫性
        - 将当前试点和出货映射到具名超大规模云或托管数据中心账户，以及对应 ASP
      - - AI 机架密度超过 100 kW，园区负载达到数百 MW
        - 驱动
        - 当前 / 近期
        - 有利于为快速瞬态控制优化的技术，而不只是长时备用
        - 索取客户侧架构图，说明 Skeleton 位于技术栈的哪一层
      - - 高可再生能源占比电网失去物理惯量
        - 驱动
        - 结构性 / 中期
        - 催生 E-STATCOM、虚拟惯量，以及快速电压 / 频率支撑需求
        - 验证旗舰 Mehrum 式用例之外的管线
      - - 欧盟用电需求到 2030 年 +60%；老化电网需要 €584B 投资
        - 驱动
        - 结构性 / 长期
        - 让电网灵活性和更快响应资产在欧洲具备战略重要性
        - 评估 Skeleton 能否以可接受利润率进入受监管公用事业采购周期
      - - 铁路电气化和混合储能采用
        - 驱动
        - 中期
        - 支撑再生制动和削峰场景，超级电容器可与电池互补
        - 确认具名铁路或重型出行设计定点，而不只是可寻址市场叙事
      - - 许可和接入积压长达 4-10 年
        - 约束
        - 当前 / 持续
        - 即便回报清楚，终端客户项目节奏也可能滞后于技术准备度
        - 将管线拆成许可前、已获许可、试点、产生收入四个阶段
      - - 安全工程、选址和应急响应要求
        - 约束
        - 当前 / 持续
        - 混合或重储能交通项目可能卡在合规和公众接受摩擦上
        - 记录非锂化架构在实践中是否实质降低审批负担
      - - 能量密度和每瓦时成本弱于锂离子
        - 约束
        - 结构性 / 持续
        - 阻止其在长时储能中独立胜出，也让市场边界保持狭窄
        - 量化超过多长时长后，Skeleton 会稳定输给电池替代方案
      - - 技术中立的欧盟储能政策和不断演变的电池合规负担
        - 约束
        - 中期
        - 给灵活性整体带来顺风，但不能保证超级电容器获得采购优势
        - 获取法律映射，说明哪些欧盟义务适用于独立超级电容器，哪些适用于电池类模块
      - - 细分收入和合同转化公开披露有限
        - 约束
        - 当前 / 持续
        - 投资人无法把部署叙事转换成可靠的 SOM 或利润率模型
        - 索取按终端市场划分的细分收入、队列毛利率和客户集中度
    notes: 最强的驱动因素来自外部基础设施需求；最难的约束是部署节奏、替代品经济性，以及 Skeleton 细分披露缺失。
