      - number: '7.4'
        title: 人员、资本与执行风险
        blocks:
          - type: paragraph
            body: >-
              相比多数欧洲硬件初创公司，Skeleton 的资本位置较强，但模型仍然重资本、且对执行敏感。公司披露累计风险融资 €392 million，并公开准备 2027 年美国
              IPO，这意味着公开表态现在一边要支撑当前合作伙伴和客户信心，另一边要支撑未来资本市场可信度。美国制造、AI
              部署或防务商业化这些公开里程碑一旦落空，代价会更高。事实图谱没有显示这是一家困境公司；它显示的是，在外部公众还看不到收入、利润率、积压订单或保修表现之前，公司已经进入了 IPO 前区间。


              人员风险更微妙，但仍有实质影响。任命 Dr Kimmo Rauma 为独立董事是积极的治理动作，Finland 团队增长也说明组织正在增加工业深度。即便如此，公开战略信号仍高度集中在 Taavi Madiberk
              身上，保留记录没有呈现完整继任图谱、委员会结构或职能流失统计。2025 年 Estonia 裁员进一步强化了这一点：Skeleton
              可能在一些地区招聘和扩张，同时在另一些地区裁撤；这在工业转型中常见，但仍会增加执行复杂度。因此，投资者应把管理层厚度、制造人才留存和 IPO
              前财务准备度视为真正的尽调事项，而不是假设更多资本已经自动解决了这些问题。
