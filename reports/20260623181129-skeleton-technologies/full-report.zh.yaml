  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              买方不会把 Skeleton 放进一个整齐的同业集合里评估。直接组件同业，是超级电容和混合电容供应商：CAP-XX 销售薄型棱柱、圆柱、纽扣电芯和锂离子混合部件；Panasonic 与 KYOCERA
              AVX/KEMET 通过授权分销销售宽目录电容；VINATech 向 UPS、汽车、电信和工业应用销售 EDLC 与 LiC 部件；Yunasko
              仍营销功率型、能量型和混合超级电容电芯与模组，尽管受试点工厂约束。替代集合不同：Eaton 和 Vertiv 已经销售 AI 数据中心电力链、模块化 UPS 架构和高功率备份系统，能够满足 Skeleton 用
              GrapheneUPS 和 GrapheneBBU 攻击的同一任务。第三个参照类是 Maxwell/Tesla 遗产，因为它说明百万次循环、高功率密度的超级电容表现已经是既有基准，而不是 Skeleton
              发明的新类别。结果是，客户可以用电芯供应商、模组供应商或既有电力集成商解决同一个韧性问题，并且往往能在这些类别之间多家采购。
