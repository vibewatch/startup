  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - AI 数据中心 UPS / BBU
        - 机架级桥接电力、符合电网规范的 UPS、短时备电、靠近计算负载的功率平滑
        - 柴油发电、长时园区备用、通用设施软件
        - Hyperscaler / colo 电气基础设施所有者
        - 当前核心市场；最贴近 GrapheneUPS 和 GrapheneBBU
      - - 电网稳定 / E-STATCOM
        - 无功支撑、虚拟惯量、电压和频率稳定、短时能量注入
        - 多小时套利电池、商用能源交易
        - TSO、公用事业或重电 OEM 项目预算
        - 核心邻近市场，有现场部署和具体公用事业痛点
      - - 铁路 / 运输混合储能
        - 再生制动捕获、加速支撑、峰值功率辅助、无接触网或车载混合储能
        - 全时长牵引电池替代
        - 交通主管机构、轨道车辆 OEM、车队运营商
        - 重要中期细分市场，循环寿命在其中很关键
      - - 工业电能质量 / 自动化
        - 毫秒级穿越、电能质量缓冲、敏感设备瞬态平滑
        - 与电能质量无关的普通工厂资本开支
        - 工厂所有者、工业 OEM、集成商
        - 真实存在，但在保留公开来源中不如 AI / 电网可见
      - - 长时固定储能
        - 不纳入，除非是由超级电容处理瞬态的混合搭配
        - 能量转移、可再生能源套利、多小时备用容量
        - 公用事业规模储能开发商
        - 排除在 Skeleton 主要市场边界之外
      - - 消费电子 / 大宗电容需求
        - 当前 Skeleton 投资论点不纳入
        - 手机、可穿戴设备、小型电子电容需求
        - 电子 OEM
        - 广义分析师 TAM 常包含这类支出；投资者应为 Skeleton 排除
    notes: 边界逻辑按任务定义：只纳入短时、高功率用例，即响应时间、循环寿命、安全或占地比能量时长更重要的场景。
