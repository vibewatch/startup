  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Skeleton 的变现栈已经不再是单一超级电容组件故事。保留的产品证据显示至少四个商业层级：传统目录电芯和模组、面向 AI 机架的 GrapheneGPU 功率平滑系统、面向 AI 数据中心的
              GrapheneUPS 不断电 UPS 系统，以及面向数据中心运营商的 GrapheneBBU / SuperBattery 备用桥接产品。公开产品页面持续把当前 AI
              基础设施买方导向直销，而不是自助采购；产品组合页面也明确称 Skeleton 不服务私人客户。这个财务差异很重要：当前增长产品是以工程化基础设施解决方案出售，而不是大宗线上 SKU。

              定价透明度也相应不均。最好的标价锚点来自传统或组件相邻分销页面：DigiKey 仍显示过时 SKELMOD 51V 模组列表，Octopart 则暴露 SKELMOD 102V 和 SKELCAP SCA0300
              等旧形态模组与电芯的当前目录式定价。相比之下，保留的当前证据中，GrapheneUPS 和 GrapheneBBU
              都未发布标价；两个页面都强调性能、占地、并网合规和联系销售流程。这种模式支撑一种收入质量判断：Skeleton
              正试图从价格透明的组件销售，转向票单更高、按客户配置的企业系统，靠谈判定价，并可能在每次部署上获得更好的毛利金额。
