      - number: '6.2'
        title: 采用轨迹与具名客户证明
        blocks:
          - type: paragraph
            body: >-
              采用轨迹最容易通过有日期的公开证明点来读取。到 2022 年中，Siemens 已把 Skeleton 描述为制造伙伴，也使用 Skeleton ultracaps。2023 年 Siemens 和
              Marubeni 参与的融资轮进一步证明，这段关系是战略性的，而非交易性的。2024 年 7 月，Skeleton 的 ESS 进入每一辆 IndyCar 赛车的现场比赛；到 2025 年 5 月，INDYCAR
              自身以 Louis Schwitzer Award 表彰混动合作方。2025 年 12 月，Skeleton 称 Leipzig 工厂已经向 Siemens、General Electric 和 Hitachi
              Energy 供货，并服务美国主要超大规模云厂商。2026 年初，公司把叙事转向北美规模，称美国已部署 100+ MW，约一半收入已经来自北美客户。


              因此，具名证明真实存在，但并不均匀。Siemens、GE Healthcare 和 IndyCar/HRC 提供最干净的证明，因为公开记录点出了对手方和部署语境。Amtrak 只通过 Skeleton
              侧披露出现，所以方向上有价值，但弱于更强的案例研究级参考。Hyosung/Marubeni、KNDS France 和 TEKEVER 重要，因为它们显示 2026
              年新增垂直扩张；不过每一项都更接近共同开发或渠道形成，而不是已披露生产收入。投资者应把这些 2026 年客户标识当作可信采用信号，而不是等同于已披露的多年生产合同。
