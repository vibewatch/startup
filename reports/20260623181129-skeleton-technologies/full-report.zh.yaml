  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代逻辑
        blocks:
          - type: paragraph
            body: >-
              不应把 Skeleton 放进整个储能栈里分析。保留的产品证据指向一个更窄的类别：短时、高功率系统，用来解决电能质量、备用桥接和电网响应问题，而电池和被动基础设施处理这些问题并不完美。在 AI
              数据中心，相关任务是穿越保护、机架级或靠近负载的缓冲，以及应对波动 GPU
              负载的并网合规。在电网里，任务是快速无功和有功支撑，包括虚拟惯量、电压稳定和扰动响应。在交通和工业场景里，适配点是再生制动、峰值功率瞬态和高频循环，而不是长时能量搬移。


              这条边界重要，因为它也说明哪些东西该排除。长时电池储能、大宗电力套利、传统备用发电机，以及多数消费电子电容需求，即便出现在泛超级电容预测中，也不属于 Skeleton 的直接市场。最强替代品反而是锂基 UPS 或
              BBU 机架、配套软件控制的站点级 BESS、同步调相机或 STATCOM
              类电网资产，以及过度建设并网容量或接受算力密度损失的现状方案。只有在毫秒到分钟级响应、高循环寿命，以及安全或占地优势比原始能量密度更值钱的地方，Skeleton 的价值主张才可信。
