      - number: '4.3'
        title: 资本强度与资本充足性
        blocks:
          - type: paragraph
            body: >-
              资本强度是核心财务事实。Skeleton 的融资方式更像建工厂的深科技公司，而不是轻资产软件供应商。官方和独立来源都指向 2026 年 IPO 前首关融资 €33 million、累计风险融资约 €392
              million；InforCapital 将总融资折算为约 $430 million。这一基础支持了一系列工业建设：设计年产最高 1200 万颗电芯的 €220 million Leipzig
              SuperFactory、产出一吉瓦功率的 €50 million Varkaus SuperBattery 工厂、近 €7 million 芬兰商业补助、此前收购的 9,400 平方米 Varkaus
              工厂且产出 0.1 GWh，如今还有美国工程团队和计划中的本地制造。

              已披露资金用途比融资时间线本身更重要。2023 年 €108 million 融资明确绑定超级电容和 SuperBattery 制造扩张；2026 年首关融资被定义为支持 AI 电力需求和美国扩张；历史上的
              €15 million EIB 准股权贷款则资助 R&D
              和工业扩张。公开层面，这足以说明公司反复吸引战略资本和类似非稀释性支持，但不足以承保资金跑道。没有保留来源披露在手现金、月度现金消耗、债务服务、美国制造的项目融资结构，或管理层资金跑道目标。面对一个已经暗示数亿欧元资本开支的工厂版图，新鲜的
              €33 million 首关融资有帮助，但单独看并不显然足够。因此，投资者必须把资本充足性视为可能成立但尚未证明，直到管理层分享现金、现金消耗和前瞻资本开支排期。
