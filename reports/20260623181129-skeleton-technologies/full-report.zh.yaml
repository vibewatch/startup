          label: 资本通道仍然打开
          detail: €33M 首次交割，并计划 2027 年在美国 IPO
          tone: positive
        - id: n3
          label: 执行已经滑坡
          detail: ERR 提到产出受扰、增长目标落空
          tone: negative
        - id: n4
          label: 绝对收入未披露
          detail: 没有公开收入、利润率或精确投后估值
          tone: negative
        - id: n5
          label: 可比公司倍数跨度很大
          detail: 从 EnerSys 的 2.47x 到 Vertiv 的 12.75x
          tone: negative
        - id: n6
          label: 估值判断：偏高
          detail: 溢价只有在 IPO 文件验证牛市情景时才站得住
          tone: negative
        - id: n7
          label: 建议：继续研究
          detail: 中等信心，高风险
          tone: neutral
    approximationNotes: 该流程概括主导估值的输入项，并未对每个经营变量建模。
    claimRefs:
      - CV001
      - CV006
      - CV014
      - CV018
      - CV022
      - CV041
  - id: FV002
    title: 公共可比公司倍数下的估值敏感性
    type: bar
    layout: standard
    summary: Skeleton 可承受的倍数区间，取决于投资者把它看成 AI 电力基础设施，还是传统储能硬件。
    data:
      items:
        - label: Vertiv EV/收入
          value: 12.75
        - label: Eaton EV/收入
          value: 6.67
        - label: CAP-XX EV/收入
          value: 5.75
        - label: EnerSys EV/收入
          value: 2.47
    approximationNotes: 倍数取自 Yahoo Finance 统计页面上的 2026 年 6 月公开市场快照。
    claimRefs:
      - CV014
      - CV016
      - CV018
      - CV019
      - CV020
  - id: FV003
    title: 支撑 10 亿企业价值所需收入区间
    type: range
    layout: standard
    summary: 独角兽级估值门槛只有在牛市情景下才低；到熊市情景里，要求会变得很高。
    data:
      items:
        - label: 牛市情景倍数区间
          low: 78
          high: 125
        - label: 基准情景倍数区间
          low: 125
          high: 174
        - label: 熊市情景倍数区间
          low: 174
          high: 405
    approximationNotes: 区间显示，在本章讨论的可比公司倍数区间下，支撑 10 亿企业价值所需的同币种年收入。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: wide
    summary: Skeleton 在市场紧迫性和技术叙事上得分较高，但披露质量和估值可承销性偏弱。
    data:
      items:
        - label: 市场紧迫性
          value: 8
        - label: 技术 / 护城河
          value: 7
        - label: 商业验证
          value: 6
        - label: 财务披露
          value: 3
        - label: 执行可靠性
          value: 4
        - label: 估值透明度
          value: 2
        - label: 当前整体可投性
          value: 5
    approximationNotes: 分数是分析师基于引用公开证据给出的 1-10 分判断，不是公司披露指标。
    claimRefs:
      - CV006
      - CV007
      - CV010
      - CV022
      - CV031
      - CV041
