      - number: '4.2'
        title: GTM 动作与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              公开 GTM 证据显示，销售更像长周期、基础设施驱动，而不是快速交易转化。GrapheneUPS 和 GrapheneBBU 的卖点围绕电网规范合规、正常运行保护、OCP
              标准、机柜密度、电压穿越，以及直接联系区域销售团队。这指向通过数据中心运营商、超大规模云厂商、电气 OEM，以及公用事业或工业伙伴采购，而不是通过分销商。区域渠道证据不是纯直销，而是混合的：Marubeni
              是日本和其他亚洲国家的独家分销商，也被描述为帮助 SuperBattery 获客；Hyosung-Marubeni e-STATCOM 协议则显示 Skeleton 把 HV 机架嵌入伙伴平台，再由
              Marubeni 在亚太支持。

              单位经济披露几乎全是间接的。没有保留来源披露已实现 ASP、毛利率、质保准备金、服务负担、CAC、回本期或按产品线的营运资本强度。最佳可用代理指标是客户 ROI 宣称。GrapheneUPS
              被描述为同等性能下体积降低 50%，并网需求最多缩小 44%。GrapheneBBU 宣称备用电源占地最多减少 67%，每机架 800 kW，充电少于 90 秒。GrapheneGPU 宣称能耗最多降低
              44%、算力提高 40%，并通过避免假负载、冷却浪费和部分电网升级支出降低资本开支与运营开支。这些是可信的溢价定价商业钩子，但不能替代已实现单位经济；尽调仍需要按产品族拿到已签
              ASP、部署毛利率、安装成本和售后支持负担。
