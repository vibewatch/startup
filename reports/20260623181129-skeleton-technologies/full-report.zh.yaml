            body: >-
              公开定价证据把 Skeleton 与多数组件对手明显分开。分销商页面为 CAP-XX、Panasonic、KYOCERA AVX 和 VINATech 提供低摩擦价格发现，公开单价和批量折扣，部件从低于 $1
              的小形态 CAP-XX 与 Panasonic 组件，到十几美元的高电容 VINATech 模组不等。这种透明度让这些供应商容易被试样、替代和对标。相比之下，保留的 Skeleton
              公开证据主要是企业产品页面，以及过时 SkelMod 51V 模组的旧 DigiKey 列表；保留的 GrapheneBBU 或 GrapheneUPS 材料没有出现公开标价，企业信息实际上由报价驱动。Eaton
              和 Vertiv 也呈现同一企业模式：公开架构宣称，但看不到标价。商业上，这有利有弊。Skeleton 当前 AI
              电力产品不容易被马上商品化，因为买方不能像抓取大宗组件价格那样抓取它们；但这也意味着企业采购团队可能默认选择渠道更广、参考客户更多、融资关系更成熟的既有 UPS
              供应商。今天公开可见的分销宽度仍偏向既有厂商和目录供应商，而不是 Skeleton。
