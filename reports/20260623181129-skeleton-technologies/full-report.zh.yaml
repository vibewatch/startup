      - number: '7.5'
        title: 缓释措施、监控项与叫停标准
        blocks:
          - type: paragraph
            body: >-
              承销 Skeleton
              最有用的方法，是把鼓舞人心的信号和打破投资论点的信号分开。鼓舞信号看得见：新资本、多家战略伙伴、官方工厂开业、在数据中心安全讨论中有共鸣的非锂定位，以及通过独立董事任命加深治理。这些点足以支持继续尽调。但它们还不能让公司获得干净的风险下调，因为公开记录仍留下太多任务关键型问题没有答案。风险降低路径存在，但必须以证据为基础，而不是以叙事为基础：投资者需要运营证明，而不只是更多合作伙伴公告。


              近期监控项应当具体。第一，Leipzig 和 Varkaus
              需要可重复产出，而不只是产能口径；任何新的供应商中断、产线认证延迟或客户质量问题，都应被视为高优先级警报。第二，美国制造应从计划语言推进到厂址、资本开支和投产证据。第三，GrapheneUPS 和
              GrapheneBBU 需要外部可见的现场表现证明，可以是具名客户部署、保修数据或可引用 uptime
              数据。第四，法律和监管面必须收紧：准确的电池监管适用性、工厂许可状态、出口管制处理和网络安全保障，都应在投资者给这个故事赋予公开市场级信心之前形成文件。叫停标准也很直接。若再次出现 Leipzig
              式产线滑坡、无法把伙伴活动转化为可验证的客户多元化、无法用独立证据支撑性能主张，或需要在披露没有改善的情况下继续推进 2027 年上市故事，都应被视为暂停或实质重估投资论点的理由。
