        title: 图表
        blocks:
          - type: callout
            title: 估值问题本质上是披露问题
            body: Skeleton 可能值得溢价，但公开证据仍看不出这个溢价应像 Vertiv、Eaton，还是 EnerSys。收入、毛利率和股权结构披露之前，正确动作是 research-more，而不是盲目按溢价承销。
