      - number: '2.3'
        title: 买方分层与预算归属
        blocks:
          - type: paragraph
            body: >-
              买方逻辑因细分市场而差异很大，这也是宽泛市场份额说法不够用的原因。在 AI
              数据中心，使用者通常是设施或电力工程团队，他们要让高密度算力负载持续在线并留在并网限制内；付款方则是为电气基础设施买单的超大规模云厂商、colo
              运营商或园区业主，而不是软件预算负责人。在电网中，直接买方是公用事业公司、TSO 和重电 OEM，他们能给快速电压支撑、频率响应和构网行为定价。在交通和工业应用中，路径通常经过车辆 OEM、公交 /
              轨交机构、工厂运营方或电能质量集成商，超级电容层用于吸收短脉冲、制动事件或瞬态峰值，电池或其他资产负责时长。


              这张买方地图支撑一个狭窄、由基础设施拉动的
              SAM。同一个产品不会因为“超级电容市场很大”而获胜；它获胜，是因为某个具体工程负责人能够证明占地节省、安全性、更快充电、更好穿越表现或更低电网升级支出合理。因此，采购周期更像电力设备认证，而不是软件自助采用。这也意味着伙伴渠道重要：Marubeni
              和 Hyosung 位于 Skeleton 与部分电网项目之间；OCP 或数据中心架构标准会塑造 BBU 采用；车辆或工业 OEM 则可能决定超级电容是被嵌入、被混合使用，还是被替代。
