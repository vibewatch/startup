      - number: '8.3'
        title: 可比估值与牛 / 基准 / 熊框架
        blocks:
          - type: paragraph
            body: >-
              由于 Skeleton 公开收入基础未披露，目前最可支撑的估值方法不是捏造一个精确企业价值，而是做可比倍数门槛分析。公开可比集覆盖四个不同视角。Vertiv 是集合中质量最高的 AI 电力基础设施基准，基于约
              $10.84B 的过去十二个月收入，EV/revenue 约 12.75x。Eaton 基于规模更大但更多元化的电气业务，EV/revenue 约 6.67x。EnerSys
              作为更传统的电力储能硬件参照，EV/revenue 约 2.47x。CAP-XX 是有用的小市值超级电容校验：过去十二个月收入仅 £5.16M、EBITDA 为负，EV/revenue 约 5.75x。


              这个区间可以把独角兽级目标转成需披露的收入门槛。若市场给予多头情景下类似 Vertiv 的 8x–12.75x 倍数，1.0bn 同币种企业价值只需要约 78–125M
              年收入。基准情景——5.75x–8x——需要约 125–174M。熊市情景若把 Skeleton 更接近 EnerSys 式 2.47x–5.75x 硬件倍数定价，则需要约
              174–405M。今天的公开证据还看不出 Skeleton 落在这些区间的哪里。


              因此，估值立场是 **stretched**，而不是明显错误。如果 IPO 材料披露系统级 AI 电力采用、具名 hyperscaler
              账户，以及与基础设施软件相邻硬件相一致的利润率，溢价可以维持。如果公司看起来更像一家重资本硬件制造商，并伴随间歇性执行滑坡，即便技术真实，公开市场压缩也可能很剧烈。
