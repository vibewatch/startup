      - number: '4.5'
        title: 财务判断
        blocks:
          - type: paragraph
            body: >-
              Skeleton 的收入质量方向上在改善，因为公司似乎正从目录超级电容销售，迁移到更一体化的 AI 和电网系统；这些系统的定价可谈判，客户 ROI 也可围绕正常运行时间、占地和避免电网支出来讲。管理层 2026
              年披露北美已约占收入一半，是商业化走出试点的最清晰信号。战略渠道图景也加分：Marubeni 分销和 Hyosung 集成表明，Skeleton 能触达一些市场，而单独搭建欧洲销售团队会更慢、更贵。

              反向压力是资本强度叠加披露单薄。公开披露的融资和工厂资本开支支撑这样一种看法：按深科技标准，Skeleton 资金相对充足；但它们不支撑资金跑道已安全锁定的看法。公司同时承担多地制造、材料、R&D
              和系统集成野心，而负面报道又显示生产中断和供应商问题已经影响增长。因此，投资结论不是“避开”，而是“带着偏财务的尽调清单继续研究”。最关键阻断点是经审计集团财务、按产品线收入结构和已实现
              ASP、按系统划分毛利率和质保负担、月度现金消耗与资金跑道、客户集中度，以及美国制造扩张的确切资本开支 / 融资计划。
