  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: Skeleton 的旅程通常从一个工程痛点开始，最终要么沉淀成黏性项目，要么进入伙伴主导的扩张路径。
    data:
      nodes:
        - label: 1. 急性电力问题
          detail: AI 负载尖峰、铁路重启、MRI 峰值吸收、电网扰动响应或高强度防务用电需求，构成进入点。
