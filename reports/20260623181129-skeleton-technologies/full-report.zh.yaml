      - number: '7.3'
        title: 合作伙伴、客户与供应链风险
        blocks:
          - type: paragraph
            body: >-
              Skeleton 的合作伙伴网络有战略价值，但结构上也是双刃剑。Siemens 在公开材料中同时是投资方、供应商、客户和 Leipzig 数字化合作伙伴；Marubeni
              是投资方、亚洲分销商和商业化伙伴；Hyosung 是韩国 e-STATCOM 推进中的硬件 OEM 交易对手；Taiwania 既是资本提供方，也是进入台湾 AI 硬件链条的桥梁；CBMM 不只是支持者，还通过
              SuperBattery
              中的铌氧化物成为化学体系赋能方。这些关系验证了市场相关性，但也带来依赖风险，因为其中多家同时扮演不止一个角色。因此，交易对手集中度更难拆分：如果某个伙伴放慢，影响可能同时打到融资观感、供应、分销和技术集成。


              客户集中度也没有商业叙事说得那么透明。公开来源点名 Siemens、General Electric、Hitachi Energy、Amtrak 和美国主要
              hyperscaler，美国扩张文章还称北美贡献了约一半收入。记录没有显示的是按账户划分的集中度、合同期限、积压订单质量、续约行为，或者 hyperscaler
              敞口究竟处于试点、设计定点还是规模化生产。这个披露缺口很重要，因为公司现在讲的是主权基础设施故事，AI 和电网客户都必须从兴趣转成耐久采购，故事才成立。材料侧，非锂叙事对超级电容是优势，但
              SuperBattery 产品线明确绑定 CBMM 的铌氧化物化学体系。净结论是，Skeleton
              已搭出一个令人印象深刻的生态，但承销时仍应把它看作一家在进入市场路径、化学体系和未具名客户上有实质依赖的公司，而不是完全多元化的基础设施供应商。
