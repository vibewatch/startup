      - number: '5.3'
        title: 架构、控制与制造
        blocks:
          - type: paragraph
            body: >-
              Skeleton 架构故事中最可信的部分，是它足够具体。材料页面称，集团覆盖从微孔碳材料到电芯、模组、系统、控制算法和软件的完整价值链，Curved Graphene 由 Bitterfeld-Wolfen 的
              Skeleton Materials 生产。产品数据表随后展示这套栈如何被封装。SkelGrid 公布了机柜架构，包括 1–10
              个模组、环形总线通信网络、多个温度传感器、开关设备，以及计算健康状态和均衡逻辑的主控制器。GrapheneBBU 公布了集成 DC/DC 转换和 BMS；GrapheneUPS 则公布三相 full-4Q SiC
              逆变器、基于 GaN 的 DC/DC、Modbus TCP、HMI 支持、维护旁路，以及最高 1500 VDC 的可选 SkelGrid 储能。制造也清晰到足以影响判断：Leipzig
              绑定石墨烯基超级电容器，Varkaus 绑定 SuperBattery 制造；独立报道称这两座工厂如今覆盖公司面向 AI、电网、交通和防务的主要产品线。这种具体性是优势，但也让执行可追踪：材料、Leipzig 或
              Varkaus 任何一处扰动，都会直接触及具名产品，而不是一个泛平台。
