      - number: '5.4'
        title: 信任、质量与合规
        blocks:
          - type: paragraph
            body: >-
              信任证据好坏参半：公开文档在技术材料上很强，但并不能均匀证明每一项质量文件都处于有效期。最清晰的正面信号来自 Varkaus，Skeleton 网站上的 DNV 证书显示，SuperBattery 制造的 ISO
              9001:2015 和 ISO 14001:2015 有效期至 2029 年 1 月。产品页面也发布了具体认证语言：GrapheneBBU 宣称符合 OCP T4；GrapheneUPS 数据表列出 EN IEC
              62040-1/-2/-3 和多项 UL 标准，以及电网规范和电压穿越功能。Skeleton 还通过 DigiKey 培训模块和招聘页面维持面向从业者的证明；招聘页面仍围绕 AI
              基础设施和关键行业招募工程师、科学家、操作员和制造人员。较弱信号在德国。Skeleton 下载区托管的公开 ISO 9001 和 IATF 16949 证书都显示有效期于 2026-05-10
              结束，早于本次运行日期；本章公开证据集中没有保留更新后的替代证书。这不能证明合规失效，但确实意味着，当公司要求买方信任任务关键电力硬件时，公开信任表面恰好在关键位置不完整。
