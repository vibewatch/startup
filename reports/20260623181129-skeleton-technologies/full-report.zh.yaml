  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与证明组合
        blocks:
          - type: paragraph
            body: >-
              Skeleton 的客户表面比收入披露更宽。公开记录至少支持七类经济上不同的买方或渠道：AI 数据中心基础设施买方、电网 / OEM 对手方、铁路和交通项目、医疗设备 OEM、赛车项目、防务主承包商，以及先进能源
              / 聚变用例。这个宽度重要，因为它显示 Skeleton 并不依赖一个狭窄的 EDLC 组件细分；同一个底层高功率储能平台正在被拿给超大规模云厂商、公用事业公司、列车项目、MRI 设备制造商和欧洲防务项目。


              问题在于，各细分市场的公开证明质量不均。最强证明不是简单客户墙，而是具名对手方加使用场景：Siemens 相关电网交付、GE Healthcare MRI 电能质量模组，以及 IndyCar ESS
              都达到这个门槛。相比之下，公司最大的未来 AI 机会以汇总口径描述——美国已部署 100+ MW、北美贡献一半收入、向主要超大规模云厂商交付——但没有点名超大规模云客户。2026
              年宣布的防务和电网伙伴关系进一步扩展细分市场地图，但其中若干仍由伙伴主导或处于商业化前，而不是清楚披露的经常性终端客户合同。
