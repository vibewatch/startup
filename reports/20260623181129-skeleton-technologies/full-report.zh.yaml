  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议摘要、投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Skeleton 的多头逻辑很直接。公司不再只卖超级电容电芯；2026 年公开材料把它定位成面向 AI 数据中心和电网的系统级电力基础设施供应商。管理层称美国已经是核心市场，部署超过 100
              MW，约一半收入来自北美客户；公司的 Leipzig 超级工厂已开始向 AI 数据中心 hyperscaler 交付。2026 年 5 月首关融资在计划 2027 年美国 IPO
              之前引入新投资者，这正是后期成长投资者希望看到的战略融资信号。


              反论点同样强。公开材料仍没有披露绝对收入、EBITDA、毛利率，或 2023 年 €108M E1 轮与 2026 年 €33M IPO 前首关的准确投后估值。审阅集中最强的反向来源——ERR——报道称，2024
              年订单创纪录，但生产受扰降低产出，增长未达到内部目标，且 Leipzig 在报道时尚未完全投产。没有披露收入，投资者无法判断 Skeleton 是否应获得类似 Vertiv 的 AI
              基础设施溢价，还是公开市场会把它更像 EnerSys 或微型市值组件供应商来定价。


              因此，本章结论落在
              **research-more**，而不是买入或放弃。公司已有足够战略证明、工厂规模和伙伴验证，可以继续跟进；但公开证据基础仍过于不完整，无法支撑价格敏感的承销判断。任何当前私募标记都隐含一个假设：IPO
              时代披露的收入将跨过系统级门槛，而不是只跨过储能硬件门槛。
