      - number: '7.2'
        title: 运营、产品与工厂风险
        blocks:
          - type: paragraph
            body: >-
              公开证据最强的风险是：Skeleton 在高速工业化时已经出现执行滑坡。ERR 报道称，2024 年订单强劲，但生产受扰压低了产出；在原本预计全面生产的时间点，Leipzig 尚未完全投产；涉及 Manz
              的供应商问题也导致了延误。投资者应该高度重视这类证据，因为公司现在还要求市场相信 Leipzig、Varkaus、Houston 以及最终美国制造能继续扩产。即便 Leipzig
              已正式开业，承销问题也不是剪彩是否发生，而是良率、供应商韧性和大规模客户认证能否反复跑通。


              产品层又增加了第二重运营负担。GrapheneUPS 和 GrapheneBBU 现在被作为任务关键型 AI
              电力基础设施销售，公开声称具备电网规范合规、电压穿越、无热失控、更小占地和极高功率密度。这些主张方向上有吸引力，但保留下来的公开证据不包括独立车队性能研究、保修统计，也没有来自具名 hyperscaler
              的公开案例研究，说明系统在真实 AI 工况下如何表现。数据表还明确显示，这些是带通信接口和人机界面的数字控制、液冷系统，也就是说运营面包括网络安全、控制工程、冷却和可维护性，而不只是电化学。Uptime
              Institute 的 2025 年调查提供了背景：AI 基础设施建设正遭遇更严重的电力约束、供应链延迟和人员压力。在这种环境下，任何现场故障、认证落空或网络控制弱点都会迅速传导到客户信任，因为 Skeleton
              卖的是 uptime，而不是可有可无的效率。因此，风险不是技术主张不可信，而是商业承诺可能跑在公开可靠性证据前面。
