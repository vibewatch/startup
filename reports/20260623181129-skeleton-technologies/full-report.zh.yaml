  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与主权风险
        blocks:
          - type: paragraph
            body: >-
              Skeleton 的法律和监管负担，正在变得比早期超级电容叙事所暗示的更复杂。核心问题不是目前有公开执法行动，而是公司现在同时向欧洲销售工业电池系统，推销任务关键型 AI
              基础设施，并扩展到防务和军民两用项目。EU Battery Regulation 2023/1542 为投放到欧盟市场的电池建立了覆盖全生命周期的合规制度，并对 2 kWh
              以上可充电工业电池引入具体可持续性义务。公开材料没有按 SKU 说明 Skeleton 如何把每个基于 SuperBattery 的系统归类到该框架下。这个模糊点很重要，因为投资者不应假设 2026
              年发布动能自动等于 2027 年合规就绪，尤其当电池护照、碳足迹和更广泛的全生命周期信息义务开始落地后。


              第二项法律敞口来自公司的防务扩张。KNDS France 和 TEKEVER 的材料把 Skeleton 从民用电网和数据中心叙事，推进到明显的军民两用和军事相邻应用。EUR-Lex 对 Regulation
              (EU) 2021/821 的摘要说得很清楚：出口、经纪、技术援助和部分军事最终用途可能需要授权。这并不能证明 Skeleton
              目前在未经批准的情况下出口受控物项；但它确实意味着合规面大幅扩大。德国环境法又加了一层。UBA 对以 BImSchG
              为中心的排放控制法的解释显示，可能伤害人员或环境的工业设施必须采取预防措施和最佳可用技术。公开来源确认了 Leipzig
              的规模，但没有披露项目特定许可文件、变更历史，也没有说明未来任何产品或工艺变化是否需要额外授权。最后，Skeleton 的公开隐私政策明显早于 2026 年商业扩张，仍需解释 German GmbH 和
              Estonian OÜ 两个主体下的 GDPR 控制者责任。这本身不是失败，但对一家越来越多向受监管基础设施销售联网、数字控制电力系统的公司来说，公开法律披露滞后是一个小但真实的治理落后信号。
