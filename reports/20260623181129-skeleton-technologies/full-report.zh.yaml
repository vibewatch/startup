  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从电芯到系统的产品组合
        blocks:
          - type: paragraph
            body: >-
              Skeleton 2026 年的产品表面明显宽于一个简单超级电容目录。公开页面和数据表显示，产品栈从 SkelCap 电芯开始，延伸到 SkelMod 模组和 SkelGrid 机柜，如今又触达
              GrapheneGPU 削峰架、GrapheneBBU 备用桥接单元、GrapheneUPS 系统，以及 SuperBattery 电芯、模组和机架等 AI
              数据中心产品。这个宽度重要，因为它把承保问题从“这是不是组件供应商？”改成“Skeleton 能吃下客户短时电力工作流中的多少环节？”组件层仍然真实：SkelCap 电芯公布 2.85 V 和 3.0 V
              选项，SCF3400 和 SCX5000 数据表则披露百万次循环、高功率 D60 电芯。但同一批公开证据也显示了可用于铁路和电网的模组、模块化 SkelGrid 机柜，以及为 AI 设计的机架。Skeleton
              的差异化故事因此不在于某个神奇 SKU，而在于把同一套材料和储能基础复用到多个产品外壳，面向数据中心、电网、铁路、重型交通和其他任务关键电力应用。
