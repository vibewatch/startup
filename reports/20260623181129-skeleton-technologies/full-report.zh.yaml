      - number: '4.4'
        title: 公开财务缺口与阻断点
        blocks:
          - type: paragraph
            body: >-
              最强公开牵引证据真实但不完整。Skeleton 称其在美国已部署超过 100 MW 系统，约一半公司收入来自北美客户；这对一家欧洲制造商来说，是重要的收入结构信号。Leipzig
              和芬兰工厂已经运营，Leipzig 据称正在向 Siemens、General Electric、Hitachi Energy
              和美国主要超大规模云厂商供货。这些披露显示需求、规模和通向有意义收入的合理路径。但它们没有揭示决定这门生意风险调整后是否有吸引力的变量：绝对收入、按流划分收入、订单积压转化、客户集中度、毛利率、burn、营运资本吸收、债务义务或质保经济性。

              负面证据让这些缺口不能被当作无害的隐私。ERR 报道称，2024 年订单创纪录，但生产受扰、增长未达计划、一个关键 Leipzig 供应商失败、工厂全面投产推迟，并且爱沙尼亚裁员 20
              人。这些都不能证明公司陷入困境，管理层也坚持称 2025
              年仍将是公司历史最好年份，但它确实抬高了执行层面的财务风险。对尽调来说，阻断点很直接：投资者能看到强产品和大工厂，却无法把它们对上经审计财务产出。在公司开放收入、利润率、现金、现金消耗、订单积压和资本开支分阶段安排的数据室之前，本章应被读作商业上有前景，但财务记录不足。
