        - label: 2. 技术验证
          detail: 客户或伙伴拿响应速度、循环寿命、占地和安全性，与电池或传统电力电子方案对比验证。
          tone: neutral
        - label: 3. 集成伙伴选择
          detail: 对手方选择直接使用模块、OEM 集成，或通过 Siemens、Marubeni、Hyosung、KNDS France、TEKEVER 等渠道路径推进。
          tone: neutral
        - label: 4. 生产或现场部署
          detail: 例子包括 IndyCar 的现场 ESS、GE Healthcare MRI 模块，以及来自 Leipzig 的 Siemens 相关电网交付。
          tone: positive
        - label: 5. 连续性测试
          detail: 只有部分关系公开显示多年连续性；其他项目仍停留在首次公告阶段，尚无续约证据。
          tone: risk
        - label: 6. 扩张循环
          detail: 成功验证可扩展为本地制造、区域渠道销售，或更大的防务和 AI 基础设施项目。
          tone: positive
    approximationNotes: 这张旅程地图把多个垂直行业抽象成一条路径，应视为对留存证明集的综合，而不是单一通用销售流程。
