      - number: '5.2'
        title: 客户工作流与使用场景
        blocks:
          - type: paragraph
            body: >-
              Skeleton 描述的最高价值客户工作流，是靠近算力负载的 AI 数据中心电力调节。GrapheneGPU 被呈现为削峰架：GPU 空闲时充电，算力尖峰时放电，明确目的是消除假负载，并平滑 AI
              集群对电网的拉取。GrapheneBBU 处理工作流中的另一点：在机架或机柜层做短时备用桥接，支持最长 90 秒，并为 OCP 式环境提供 400 VDC 接口。GrapheneUPS 再上一层，作为双变换
              UPS，增加穿越、电网规范支持和更广系统韧性。AI 之外，Skeleton 仍把客户导向
              SkelGrid，用于工业和电网应用中的电压与频率调节、短时备份和削峰；旧模组家族则仍绑定铁路、发动机启动、公交、卡车和其他重载用例。实际上，Skeleton
              的工作流策略，是把同一套高功率储能逻辑嵌入不同运营时刻：瞬时削峰、短时备用桥接，以及更广的电能质量或穿越支持。
