          detail: 制造用于电网和 AI 相关产品的石墨烯超级电容器；爬坡延误已经公开。
          type: dependency
        - id: d3
          label: Varkaus SuperBattery Factory
          detail: 制造 SuperBattery，并持有当前公开可见度最高的质量证书。
          type: dependency
        - id: d4
          label: 控制 / 接口层
          detail: Modbus、CAN、Redfish、BMS 和 UPS/PCS 逻辑是把电芯变成可部署系统的必要条件。
