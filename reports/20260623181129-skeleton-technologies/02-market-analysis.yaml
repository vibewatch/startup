- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI data-center electricity demand up 17% in 2025; AI loads growing faster
    - driver
    - current / near-term
    - Raises urgency for short-duration buffering, grid-compliant backup, and load smoothing
    - Map current pilots and shipments to named hyperscaler or colo accounts and resulting ASPs
  - - AI rack densities above 100 kW and campus loads reaching hundreds of MW
    - driver
    - current / near-term
    - Favors technologies optimized for fast transient control rather than only long-duration reserve
    - Request customer-side architecture diagrams showing where Skeleton sits in the stack
  - - Renewable-heavy grids losing physical inertia
    - driver
    - structural / medium-term
    - Creates demand for E-STATCOM, virtual inertia, and fast voltage / frequency support
    - Validate pipeline beyond the flagship Mehrum-style use case
  - - EU electricity demand +60% by 2030; aging grids require €584B investment
    - driver
    - structural / long-term
    - Makes grid flexibility and faster-response assets strategically important across Europe
    - Assess whether Skeleton can sell into regulated utility procurement cycles at acceptable margin
  - - Rail electrification and hybrid storage adoption
    - driver
    - medium-term
    - Supports regenerative-braking and peak-power use cases where supercapacitors complement batteries
    - Identify named rail or heavy-mobility design wins, not just addressable market narratives
  - - Permitting and connection backlogs of 4-10 years
    - constraint
    - current / ongoing
    - End-customer project timing can lag technology readiness even when payback is clear
    - Break pipeline into pre-permit, permitted, pilot, and revenue-generating stages
  - - Safety engineering, siting, and emergency-response requirements
    - constraint
    - current / ongoing
    - Hybrid or storage-heavy transport projects can stall on compliance and public-acceptance friction
    - Document whether non-lithiated architectures materially reduce approval burden in practice
  - - Energy-density and cost-per-watt-hour disadvantage vs lithium-ion
    - constraint
    - structural / ongoing
    - Prevents standalone wins in long-duration storage and keeps market boundary narrow
    - Quantify the duration threshold above which Skeleton consistently loses to battery alternatives
  - - Technology-neutral EU storage policy and evolving battery-compliance burden
    - constraint
    - medium-term
    - Provides a tailwind for flexibility generally, but not a guaranteed procurement advantage for supercapacitors
    - Obtain legal mapping of which EU obligations apply to standalone supercapacitors versus battery-class modules
  - - Limited public disclosure on segment revenue and contract conversion
    - constraint
    - current / ongoing
    - Prevents investors from converting deployment narratives into a reliable SOM or margin model
    - Request segment revenue, cohort gross margin, and customer concentration by end market
  notes: The strongest driver set is external and infrastructure-based; the hardest constraints are deployment timing, substitute economics, and the absence of public Skeleton segment disclosure.
