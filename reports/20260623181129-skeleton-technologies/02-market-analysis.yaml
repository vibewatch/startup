- id: sizing-lenses-and-contradictory-estimates
  title: Sizing Lenses and Contradictory Estimates
  body: 'The public TAM data is useful as orientation, not as an investable truth. Current analyst summaries disagree materially: Coherent pegs the global ultracapacitor market at US$4.06 billion in 2026, Stratview points to US$8.5 billion by 2026, and Kaiso places the market at US$4.69 billion in 2025 on a path to US$32.89 billion by 2035. Europe-specific work is narrower still, with Market Data Forecast valuing the region at US$1.22 billion in 2026. These are not small rounding differences; they reflect different inclusions of automotive, consumer, industrial, and grid use cases, plus different starting years and forecast horizons.


    For Skeleton, the right reading is that the broad category is large enough to matter, but too inconsistently defined to anchor valuation by itself. A more defensible lens is to stack adjacent, evidence-backed submarkets: AI data-center power conditioning, grid-stabilization assets such as E-STATCOM, and high-cycle transport or industrial systems. Even that SAM is only partially public, because no retained source isolates the spend pools for AI UPS or BBU, grid-forming response, and regenerative-braking hybrids in a way that can be mapped directly to Skeleton’s revenue opportunity. The practical implication is that TAM supports narrative, while SAM and SOM require bottom-up diligence on contracts, ASPs, and deployment conversion rather than one generic market-report line.'
