- id: buyer-segments-and-budget-owners
  title: Buyer Segments and Budget Owners
  body: 'Buyer logic differs sharply by segment, which is why broad market-share claims are not enough. In AI data centers, the user is usually the facilities or power-engineering team trying to keep dense compute loads online and within grid-connection limits; the payer is the hyperscaler, colo operator, or campus owner funding electrical infrastructure rather than a software budget owner. In grids, direct buyers are utilities, TSOs, and heavy-electrical OEMs that can value fast voltage support, frequency response, and grid-forming behavior. In transport and industrial applications, the path often runs through rolling-stock OEMs, transit agencies, factory operators, or power-quality integrators, with the supercapacitor layer used to absorb short bursts, braking events, or transient peaks while batteries or other assets cover duration.


    This buyer map supports a narrow, infrastructure-led SAM. The same product does not win because “the supercapacitor market is large”; it wins because a specific engineering owner can justify footprint savings, safety, faster recharge, better ride-through behavior, or lower grid-upgrade spend. That means procurement cycles are closer to power-equipment qualification than to software self-serve adoption. It also means partner channels matter: Marubeni and Hyosung sit between Skeleton and some grid projects; OCP or data-center architecture standards shape BBU adoption; and rolling-stock or industrial OEMs can determine whether the supercapacitor is embedded, hybridized, or displaced.'
