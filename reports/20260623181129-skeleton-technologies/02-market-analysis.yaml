  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: som-visibility
    missingEvidence: Segment revenue, ASP, customer concentration, and conversion rates from pilot to recurring production by end market.
    whyItMatters: Without those inputs, public market-share math for Skeleton is storytelling rather than diligence-grade analysis.
    diligencePath: Request booked revenue, backlog, and customer concentration by AI data centers, grid, and transport plus cohort gross margin and contract duration.
    relatedQuestionRefs:
    - QM022
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: eu-compliance-scope
    missingEvidence: A counsel-grade mapping of which EU obligations apply to standalone supercapacitor products versus battery-class modules or hybrid systems.
    whyItMatters: The policy backdrop is clearly tougher on storage compliance, but the retained public sources do not cleanly resolve the product-scope line for every Skeleton configuration.
    diligencePath: Obtain outside-counsel or notified-body guidance tying specific Skeleton SKUs to the relevant EU battery, product-safety, and grid-interconnection obligations.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM004
  - type: conflicting-data
    severity: material
    topic: tam-contradiction
    missingEvidence: Same-scope market datasets that separate AI/grid/transport spend from automotive, consumer, and other broad ultracapacitor categories.
    whyItMatters: The retained TAM estimates disagree too much to support one valuation anchor without a cleaner like-for-like market boundary.
    diligencePath: Rebuild a bottom-up SAM from named utility projects, rail programs, data-center power architectures, and known budget owners rather than relying on one generic market report.
    relatedQuestionRefs:
    - QM004
    - QM005
    - QM016
    relatedTableRefs:
