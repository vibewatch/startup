  rows:
  - - AI data-center UPS / BBU
    - Rack-level bridging power, grid-compliant UPS, short-duration backup, power smoothing near compute loads
    - Diesel generation, long-duration campus reserve, generic facility software
    - Hyperscaler / colo electrical infrastructure owner
    - Core current market; closest fit to GrapheneUPS and GrapheneBBU
  - - Grid stabilization / E-STATCOM
    - Reactive power support, virtual inertia, voltage and frequency stabilization, short-term energy injection
    - Multi-hour arbitrage batteries, merchant energy trading
    - TSO, utility, or heavy-electrical OEM project budget
    - Core adjacent market with live deployments and concrete utility pain
  - - Rail / transport hybrid storage
    - Regenerative braking capture, acceleration support, peak-power assistance, catenary-free or onboard hybrid storage
    - Full-duration traction battery replacement
    - Transit authority, rolling-stock OEM, fleet operator
    - Important medium-term segment where cycle life matters
  - - Industrial power quality / automation
    - Millisecond ride-through, power-quality buffering, transient smoothing for sensitive equipment
    - General factory capex unrelated to power quality
    - Factory owner, industrial OEM, integrator
    - Real but less visible than AI/grid in retained public sources
  - - Long-duration stationary storage
    - None beyond hybrid pairings where supercapacitors handle transients
    - Energy shifting, renewable arbitrage, multi-hour reserve capacity
    - Utility-scale storage developers
    - Exclude from primary Skeleton market boundary
  - - Consumer electronics / commodity capacitor demand
    - None in current Skeleton thesis
    - Phones, wearables, small electronics capacitor demand
    - Electronics OEMs
    - Broad analyst TAM often includes this spend; investors should exclude it for Skeleton
  notes: 'Boundary logic is job-based: include only short-duration, high-power use cases where response time, cycle life, safety, or footprint outrank energy duration.'
