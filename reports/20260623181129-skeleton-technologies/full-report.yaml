      - number: '3.3'
        title: Pricing, Packaging, and Channel Power
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence sharply separates Skeleton from most component rivals. Distributor pages expose
              low-friction price discovery for CAP-XX, Panasonic, KYOCERA AVX, and VINATech, with published unit prices
              and volume breaks for parts ranging from sub-$1 small-form-factor CAP-XX and Panasonic components to
              double-digit-dollar high-capacitance VINATech modules. That transparency makes those vendors easy to
              sample, substitute, and benchmark. By contrast, the retained public Skeleton evidence is dominated by
              enterprise product pages and a legacy DigiKey listing for the obsolete SkelMod 51V module; no public list
              price appeared in the retained GrapheneBBU or GrapheneUPS materials, and the enterprise message is
              effectively quote-driven. Eaton and Vertiv show the same enterprise pattern: public architecture claims,
              no visible list pricing. Commercially, that cuts both ways. Skeleton avoids immediate commoditization on
              its current AI-power products because buyers cannot price-scrape them like commodity components, but it
              also means enterprise procurement teams may default to incumbent UPS vendors with broader channels,
              reference accounts, and financing relationships. Publicly visible distribution breadth today still favors
              the incumbents and catalog vendors over Skeleton.
