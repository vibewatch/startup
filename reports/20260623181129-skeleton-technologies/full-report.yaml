      - number: '4.5'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Skeleton’s revenue quality is directionally improving because the company appears to be migrating from
              catalog supercapacitor sales toward more integrated AI and grid systems where pricing is negotiated and
              customer ROI can be framed around uptime, footprint, and avoided grid spend. Management’s 2026 disclosure
              that North America already represents roughly half of revenue is the clearest sign that commercialization
              has moved beyond pilots. The strategic channel picture also helps: Marubeni distribution and Hyosung
              integration suggest Skeleton can access markets where a standalone European sales force would be slower
              and more expensive to build.

              The counterweight is capital intensity plus disclosure thinness. Publicly disclosed financing and factory
              capex support the view that Skeleton is well funded by deep-tech standards, but not the view that runway
              is safely underwritten. The company is simultaneously carrying multi-site manufacturing, materials, R&D,
              and system-integration ambitions while admitting through adverse reporting that production disruption and
              supplier problems already affected growth. The investment takeaway is therefore not “avoid,” but “research
              more with a finance-heavy diligence list.” The top blockers are audited group financials, product-line
              revenue mix and realized ASPs, gross margin and warranty burden by system, monthly cash burn and runway,
              customer concentration, and the exact capex / financing plan for U.S. manufacturing scale-up.
