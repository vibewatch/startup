chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Skeleton Technologies is an Estonian deep-tech energy storage company whose identity has become more
              specific — not less — as it scaled. The company was founded in Tartu in 2009, is now headquartered in
              Tallinn, and operates manufacturing and engineering assets across Germany, Finland, and, as of 2026,
              Houston. Public sources consistently place Skeleton in the high-power end of energy storage rather than in
              long-duration battery storage: it develops curved-graphene supercapacitors, SuperBattery systems, and
              rack-level power products aimed at AI data centers, electrical-grid stability, heavy mobility, and defense
              uses.


              That positioning matters because the business model now extends beyond selling cells. By 2026 Skeleton was
              marketing GrapheneBBU rack backups and had launched GrapheneUPS for AI data centers, while also using the
              same materials-and-systems stack in grid and defense partnerships. The company’s own framing is that
              reliable power, not chips, has become the bottleneck in AI infrastructure; its commercial pitch is to
              smooth millisecond load spikes, shrink grid-connection requirements, and reduce thermal risk without
              relying on lithium-heavy chemistries. The result is a company that should be analyzed as an infrastructure
              enabler with a vertically integrated European supply base, not just as a component startup.
            claimRefs:
              - CO001
              - CO002
