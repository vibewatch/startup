      - number: '7.3'
        title: Partner, Customer, and Supply-Chain Risks
        blocks:
          - type: paragraph
            body: >-
              Skeleton's partner web is strategically valuable but structurally double-edged. Siemens appears in public
              materials as investor, supplier, customer, and Leipzig-digitization partner; Marubeni appears as investor,
              Asian distributor, and commercialization partner; Hyosung is the hardware OEM counterpart for Korea's
              e-STATCOM push; Taiwania is both a capital provider and a bridge into Taiwan's AI hardware chain; CBMM is
              not just a backer but a chemistry enabler through niobium oxides in SuperBattery. These relationships
              validate market relevance, yet they also create dependency risk because several of them span more than one
              role at once. That makes counterparty concentration harder to isolate: if a partner slows, the effect can
              hit financing optics, supply, distribution, and technical integration simultaneously.


              Customer concentration is also less transparent than the commercial narrative. Public sources name
              Siemens, General Electric, Hitachi Energy, Amtrak, and major U.S. hyperscalers, and the U.S. expansion
              post says roughly half of revenue comes from North America. What the record does not show is concentration
              by account, contract duration, backlog quality, renewal behavior, or whether the hyperscaler exposure sits
              in pilots, design wins, or scaled production. That disclosure gap matters because the company now tells a
              sovereign-infrastructure story that depends on both AI and grid customers converting from enthusiasm into
              durable procurement. On the materials side, the non-lithium message is a strength for supercapacitors, but
              the SuperBattery line is explicitly tied to CBMM's niobium-oxide chemistry. The net takeaway is that
              Skeleton has assembled an impressive ecosystem, but it should still be underwritten as a company with
              meaningful route-to-market, chemistry, and unnamed-customer dependence rather than as a fully diversified
              infrastructure vendor.
