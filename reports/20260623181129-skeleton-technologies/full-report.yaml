  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Sovereignty Risks
        blocks:
          - type: paragraph
            body: >-
              Skeleton's legal and regulatory burden is becoming more complex than its early supercapacitor narrative
              implied. The core issue is not a live public enforcement action; it is that the company is now
              simultaneously selling industrial battery systems into Europe, pitching mission-critical AI
              infrastructure, and widening into defense and dual-use programs. EU Battery Regulation 2023/1542 creates a
              broad lifecycle compliance regime for batteries placed on the Union market and introduces specific
              sustainability obligations for rechargeable industrial batteries above 2 kWh. Public materials do not
              resolve, at SKU level, exactly how Skeleton classifies every SuperBattery-based system against that
              framework. That ambiguity matters because investors should not assume that 2026 launch momentum
              automatically means 2027 compliance readiness once battery-passport, carbon-footprint, and wider lifecycle
              information duties become operational.


              A second legal exposure comes from the company's defense expansion. KNDS France and TEKEVER materials move
              Skeleton beyond civilian grid and data-center narratives into plainly dual-use and military-adjacent
              applications. EUR-Lex's summary of Regulation (EU) 2021/821 makes clear that exports, brokering, technical
              assistance, and some military end uses can require authorization. That does not prove Skeleton is
              currently exporting controlled items without approvals; it does mean the compliance surface has widened
              materially. German environmental law adds a third layer. UBA's explanation of BImSchG-centered immission
              control law shows that industrial facilities capable of harming people or the environment must apply
              precautionary measures and best available techniques. Public sources confirm Leipzig's scale, but not the
              project-specific permit files, modification history, or whether any future product-process changes will
              require additional authorizations. Finally, Skeleton's public privacy policy is materially older than its
              2026 commercial expansion and still carries the burden of explaining GDPR-controller responsibilities
              across both the German GmbH and Estonian OÜ. That is not a failure by itself, but for a company
              increasingly selling connected, digitally controlled power systems into regulated infrastructure, stale
              public legal disclosures are a small but real signal of governance lag.
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR047
              - CR050
