      - number: '1.4'
        title: Milestones, Partnerships, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The 2025-2026 period established the operating shape that later chapters should treat as current ground
              truth. Skeleton opened the Leipzig SuperFactory in November 2025, publicly tied it to both European grid
              applications and U.S. AI data center demand, and then used 2026 to widen its commercial narrative: the
              Houston engineering hub, the GrapheneUPS launch, the Taiwania sovereign-AI investment partnership, the
              Hyosung/Marubeni e-STATCOM MoU, and the KNDS France and TEKEVER defense agreements all landed within a few
              months. That sequence shows a deliberate move from proving component performance toward owning more of the
              system stack and more of the end-market conversation.


              The same timeline also carries the main adverse signal. ERR reported that supplier problems delayed
              Leipzig’s full production start and coincided with layoffs in Estonia, while management admitted that 2024
              growth missed plan even as orders were strong. The right reading is not existential distress but execution
              risk: Skeleton appears able to raise capital and open plants, yet plant-ramp discipline still matters
              because the company is selling reliability, sovereignty, and industrial readiness into mission-critical
              markets. Later chapters should therefore treat the 2026 partnership momentum as real, but not assume that
              manufacturing execution is already frictionless.
