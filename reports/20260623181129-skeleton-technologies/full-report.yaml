  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitute Logic
        blocks:
          - type: paragraph
            body: >-
              Skeleton should not be analyzed against the entire energy-storage stack. The retained product evidence
              points to a narrower category: short-duration, high-power systems that solve power-quality,
              backup-bridging, and grid-response problems that batteries and passive infrastructure handle imperfectly.
              In AI data centers, the relevant jobs are ride-through protection, rack-level or load-proximate buffering,
              and grid-connection compliance for volatile GPU loads. In grids, the job is fast reactive and active-power
              support, including virtual inertia, voltage stabilization, and disturbance response. In transport and
              industrial settings, the fit is regenerative braking, peak-power transients, and frequent cycling rather
              than long-duration energy shifting.


              That boundary matters because it also clarifies what to exclude. Long-duration battery energy storage,
              bulk energy arbitrage, conventional backup generators, and most consumer-electronics capacitor demand sit
              outside Skeleton’s immediate market even if they appear in generic supercapacitor forecasts. The strongest
              substitutes are instead lithium-based UPS or BBU racks, site-level BESS paired with software controls,
              synchronous-condensing or STATCOM-style grid assets, and the status quo of overbuilding grid connections
              or accepting lost compute density. Skeleton’s value proposition is credible only where
              milliseconds-to-minutes response, high cycle life, and safety or footprint advantages are worth more than
              raw energy density.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
              - CM009
