      - number: '7.4'
        title: People, Capital, and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Skeleton's capital position is strong relative to most European hardware startups, but the model is still
              capital-intensive and execution-sensitive. The company has disclosed €392 million of total venture funding
              and is openly preparing for a 2027 U.S. IPO, which means public statements are now doing double duty: they
              must support current partner/customer confidence and future capital-markets credibility at the same time.
              That increases the cost of missing public milestones around U.S. manufacturing, AI deployments, or defense
              commercialization. The fact pattern does not show a distressed company; it shows a company that has
              entered the pre-IPO zone before public outsiders can see revenue, margins, backlog, or warranty
              performance.


              The people risk is subtler but still material. Appointing Dr Kimmo Rauma as an independent board member is
              a positive governance step, and the Finland team growth shows the organization is adding industrial depth.
              Even so, public strategic signaling remains heavily centered on Taavi Madiberk, and the retained record
              does not surface a full succession map, committee structure, or functional turnover statistics. The 2025
              Estonia layoffs reinforce the point: Skeleton may be hiring and scaling in some geographies while cutting
              in others, which is typical of industrial transition but still increases execution complexity. Investors
              should therefore treat management depth, manufacturing talent retention, and pre-IPO finance readiness as
              genuine diligence items rather than assume that more capital automatically solved them.
            claimRefs:
