  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Skeleton’s monetization stack is no longer a single supercapacitor-component story. The retained product
              evidence shows at least four commercial layers: legacy catalog cells and modules, GrapheneGPU
              power-smoothing systems for AI racks, GrapheneUPS no-break UPS systems for AI data centers, and
              GrapheneBBU / SuperBattery backup-bridging products for data-center operators. Public product pages
              consistently route current AI infrastructure buyers into direct sales rather than self-serve procurement,
              and the product-portfolio page explicitly says Skeleton does not service private customers. That is an
              important financial distinction: current growth products are being sold as engineered infrastructure
              solutions, not as commodity online SKUs.

              Pricing transparency is correspondingly uneven. The best list-price anchors are on legacy or
              component-adjacent distribution pages: DigiKey still shows an obsolete SKELMOD 51V module listing, while
              Octopart exposes current catalog-style pricing for older-format modules and cells such as SKELMOD 102V and
              SKELCAP SCA0300. By contrast, neither GrapheneUPS nor GrapheneBBU publishes a list price in the retained
              current evidence; both pages emphasize performance, footprint, grid-compliance, and contact-with-sales
              motions. That pattern supports a revenue-quality view in which Skeleton is trying to move away from
              price-transparent component sales and toward higher-ticket, custom-configured enterprise systems with
              negotiated pricing and potentially better gross-profit dollars per deployment.
