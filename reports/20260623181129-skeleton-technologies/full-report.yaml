      - number: '4.2'
        title: GTM motion and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The public go-to-market evidence implies long-cycle, infrastructure-led selling rather than fast
              transactional conversion. GrapheneUPS and GrapheneBBU are pitched around compliance with grid codes,
              uptime protection, OCP standards, cabinet density, voltage ride-through, and direct contact with regional
              sales teams. That points to procurement through data-center operators, hyperscalers, electrical OEMs, and
              utility or industrial partners rather than through distributors. The regional channel evidence is mixed
              rather than purely direct: Marubeni is an exclusive distributor in Japan and other Asian countries and is
              also described as helping customer acquisition for SuperBattery, while the Hyosung-Marubeni e-STATCOM
              agreement shows Skeleton embedding its HV rack into a partner platform that Marubeni then supports across
              Asia-Pacific.

              Unit-economics disclosure remains almost entirely indirect. No retained source discloses realized ASP,
              gross margin, warranty reserve, service burden, CAC, payback, or working-capital intensity by product
              line. The best available proxies are customer-ROI claims. GrapheneUPS is framed as 50% lower volume for
              the same performance and up to 44% smaller grid connection requirements. GrapheneBBU claims up to 67% less
              backup-power footprint with 800 kW per rack and under-90-second recharge. GrapheneGPU claims up to 44%
              lower energy consumption and 40% more computing power, with lower capex and opex from avoiding dummy
              loads, cooling waste, and some grid-upgrade spend. Those are credible commercial hooks for premium
              pricing, but they are not a substitute for realized unit economics, so diligence still needs booked ASPs,
              deployment gross margins, installation costs, and post-sale support burden by product family.
