            body: >-
              Trust evidence is mixed: public documentation is strong on technical paperwork, but uneven on whether
              every quality artifact is current. The clearest positive signal is Varkaus, where DNV certificates on
              Skeleton’s site show ISO 9001:2015 and ISO 14001:2015 validity through January 2029 for SuperBattery
