      - number: '3.2'
        title: Feature and Capability Comparison
        blocks:
          - type: paragraph
            body: >-
              Skeleton's strongest differentiation is at the system layer, not the broadest component shelf. Official
              pages frame the company as an AI-infrastructure and grid-power provider with microsecond response, 100+ kW
              rack relevance, GrapheneBBU cabinets rated at 800 kW, and GrapheneUPS positioned as a no-break resilience
              layer near critical AI equipment. That is a different promise from CAP-XX, whose public product story is
              compact electronics and hybrid capacitor form factors, or from Panasonic and KYOCERA AVX, whose visible
              strengths are broad catalog availability, authorized distribution, and standard parts. VINATech is a
              closer technical adjacency because it openly markets EDLC and LiC products into UPS and power-quality
              applications. Yunasko publishes credible power and energy figures for modules, but the same page still
              warns of limited pilot-plant capacity, which weakens immediate competitive threat. Eaton and Vertiv,
              meanwhile, do not compete on cell chemistry marketing; they compete on installed-base trust, integrated
              design, and conventional buyer comfort with modular UPS and battery ecosystems. For investment purposes,
              that means Skeleton's wedge is best understood as application-level integration plus footprint and
              response claims, not as unassailable control of the underlying capacitor component category.
