      - number: '2.4'
        title: Growth Drivers, EU Regulation, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The demand-side case is strong. AI data-center electricity demand grew 17% in 2025, AI-focused sites are
              growing faster still, and the best technical review in the retained set says rack-level loads can exceed
              100 kW while whole campuses can move into the hundreds of megawatts or even gigawatt range. On the grid
              side, Europe is trying to absorb much more electrification and renewable generation through aging
              networks: the Commission expects electricity consumption to rise about 60% by 2030, says 40% of
              distribution grids are already more than 40 years old, and estimates €584 billion of grid investment is
              required this decade. Those conditions create exactly the sort of low-inertia, power-quality-sensitive
              environment where fast response and high cycle life matter.


              The constraints are equally real. Utility interconnection and reinforcement timelines can run four to ten
              years, and high-voltage projects longer. Rail and other storage-heavy deployments face safety engineering,
              siting, and emergency-response hurdles. The EU policy tailwind is also broad rather than bespoke:
              published grid plans emphasize flexibility and storage in technology-neutral terms, while the batteries
              regime raises compliance expectations for the wider storage ecosystem without offering a
              supercapacitor-specific fast lane. Finally, ultracapacitors still lose on energy density and
              cost-per-watt-hour versus lithium-ion for long-duration jobs. That is why the current market thesis works
              best where downtime, power spikes, grid-code compliance, regenerative braking, or cycling intensity
              dominate the buying decision.
            claimRefs:
              - CM012
              - CM013
              - CM015
