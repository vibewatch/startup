              alignment, while the GrapheneUPS datasheet lists EN IEC 62040-1/-2/-3 and multiple UL standards plus
              grid-code and voltage-ride-through features. Skeleton also maintains practitioner-facing proof through
              DigiKey training modules and a careers page that still recruits engineers, scientists, operators, and
              manufacturing staff around AI infrastructure and critical industries. The weaker signal is Germany. The
              public ISO 9001 and IATF 16949 certificates hosted on Skeleton’s downloads surface both show validity
              ending on 2026-05-10, which is before this run date, and no refreshed replacement certificate was retained
              in this chapter’s public evidence set. That does not prove a compliance lapse, but it does mean the public
              trust surface is incomplete precisely where the company is asking buyers to trust mission-critical power
              hardware.
