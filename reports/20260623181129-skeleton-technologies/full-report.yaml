  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Skeleton’s architecture stacks materials, cells, modules, power electronics, and application-specific systems
      rather than selling a single undifferentiated capacitor.
    data:
      layers:
        - label: Curved Graphene Materials
          detail: >-
