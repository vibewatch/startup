  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              Buyers do not evaluate Skeleton against one neat peer set. The direct component peer group is the
              supercapacitor and hybrid-capacitor vendor field: CAP-XX sells thin prismatic, cylindrical, coin-cell, and
              lithium-ion-hybrid parts; Panasonic and KYOCERA AVX/KEMET sell broad capacitor catalogs through authorized
              distribution; VINATech sells EDLC and LiC parts into UPS, automotive, telecom, and industrial
              applications; and Yunasko still markets power, energy, and hybrid ultracapacitor cells and modules, albeit
              with pilot-plant constraints. The substitute set is different: Eaton and Vertiv already sell
              AI-data-center power chains, modular UPS architectures, and high-power backup systems that can satisfy the
              same job Skeleton is attacking with GrapheneUPS and GrapheneBBU. A third reference class is the
              Maxwell/Tesla legacy, which matters because it demonstrates that million-cycle, high-power-density
              ultracapacitor performance is an established benchmark rather than a category that Skeleton invented. The
              result is a market where the customer can solve the same resilience problem with a cell vendor, a module
              vendor, or an incumbent power-integrator, and can often multi-home across those categories.
