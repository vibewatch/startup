      - number: '3.4'
        title: Moat Durability and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              The durable part of Skeleton's moat is application fit: microsecond response, compact backup bridging, and
              a rack-to-grid story that makes sense for volatile AI loads and for buyers worried about footprint,
              thermal runaway, and fast recharge. But the moat is not cleanly protected from incumbent retaliation.
              Vertiv and Eaton already sell AI-ready UPS and modular power architectures, and they do so with global
              service organizations, familiar procurement motions, and chemistry-agnostic integration around
              lithium-ion, nickel-zinc, and broader backup portfolios. The Maxwell/Tesla lineage also undercuts any
              claim that long-cycle ultracapacitor reliability is novel; Clarios' 2025 Maxwell acquisition kept
              datacenter, grid, and industrial customer relationships alive under a large incumbent owner. The main
              adverse evidence is internal to Skeleton: ERR reported production disruption, missed 2024 growth goals,
              supplier issues, Leipzig delays, and layoffs in Estonia. That matters because buyers of mission-critical
              power systems care about manufacturing repeatability and service confidence as much as chemistry. In
              short, Skeleton's moat looks real but conditional: strongest where AI operators value footprint and power
              quality, weakest where buyers prioritize incumbent service depth, proven field fleets, and conventional
              UPS procurement.
