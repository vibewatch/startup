      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The valuation question is really a disclosure question
            body: >-
              Skeleton may deserve a premium, but public evidence still does not show whether that premium should be
              Vertiv-like, Eaton-like, or EnerSys-like. Until revenue, gross margin, and the cap table are disclosed,
              the right action is research-more rather than blind premium underwriting.
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV016
              - CV018
              - CV022
              - CV041
          - type: callout
            title: A 1.0bn mark requires very different revenue depending on the comp lens
            body: >-
              At 12.75x EV/revenue a 1.0bn enterprise mark needs only about 78m of annual revenue, but at 2.47x it needs
              about 405m. That comp spread explains why exact revenue disclosure matters more than another marketing
              slogan.
            calloutType: insight
            claimRefs:
              - CV025
              - CV028
          - type: callout
            title: Execution slippage is the fastest route to multiple compression
            body: >-
              ERR’s report that production disruption reduced output and that growth missed internal goals is the
              cleanest adverse signal in the file. If those issues persist into IPO preparation, investors are more
              likely to price Skeleton as storage hardware rather than AI-power infrastructure.
            calloutType: risk
            claimRefs:
              - CV006
              - CV028
              - CV043
          - type: callout
            title: The 2023 “unicorn round” is still not a verified public fact
            body: >-
              The reviewed public materials clearly disclose a €108M 2023 round and more than €300M cumulative funding
              after that financing, but they do not disclose the post-money valuation. Treating 2023 as the verified
              unicorn step-up would overstate what the public evidence actually proves.
            calloutType: assumption
            claimRefs:
              - CV003
              - CV004
              - CV024
