  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Proof Mix
        blocks:
          - type: paragraph
            body: >-
              Skeleton’s customer surface is broader than its revenue disclosure. The public record supports at least
              seven economically distinct buyer or channel categories: AI data center infrastructure buyers, grid/OEM
              counterparties, rail and mobility programs, healthcare equipment OEMs, motorsport programs, defense
              primes, and an advanced-energy/fusion use case. That breadth matters because it shows Skeleton is not
              relying on one narrow EDLC component niche; the same underlying high-power storage platform is being
              presented to hyperscalers, utilities, train programs, MRI equipment makers, and European defense programs.


              The catch is that public proof quality is uneven across those segments. The strongest proof is not simply
              a logo wall but a named counterparty plus a use case: Siemens-linked grid deliveries, GE Healthcare MRI
              power-quality modules, and the IndyCar ESS all satisfy that threshold. By contrast, the company’s biggest
              future AI opportunity is described in aggregate terms — 100+ MW deployed in the US, half of revenue from
              North America, major hyperscaler deliveries — without naming the hyperscaler customers. Defense and grid
              partnerships announced in 2026 further expand the segment map, but several of those are still partner-led
              or pre-commercial rather than clearly disclosed recurring end-customer contracts.
