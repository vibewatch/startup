      - number: '4.4'
        title: Public financial gaps and blockers
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction evidence is real but incomplete. Skeleton says more than 100 MW of systems
              are already deployed in the United States and that about half of company revenue comes from North American
              customers, which is a material mix signal for a European manufacturer. The Leipzig and Finland factories
              are already operating, and Leipzig is said to be supplying Siemens, General Electric, Hitachi Energy, and
              major U.S. hyperscalers. Those disclosures show demand, scale, and a plausible path to meaningful revenue.
              But they do not reveal the variables that decide whether the business is attractive on a risk-adjusted
              basis: absolute revenue, revenue by stream, backlog conversion, customer concentration, gross margin,
              burn, working-capital absorption, debt obligations, or warranty economics.

              The adverse evidence keeps those gaps from being dismissed as harmless privacy. ERR reported that 2024 was
              a record year for orders but production was disrupted, growth missed plan, a critical Leipzig supplier
              failed, the plant’s full production start slipped, and 20 employees were laid off in Estonia. None of that
              proves distress, and management insisted 2025 would still be the best year in company history, but it does
              raise the financial stakes around execution. For diligence, the blocker is straightforward: investors can
              see strong products and large factories, yet cannot reconcile them to audited financial output. Until the
              company opens its data room on revenue, margins, cash, burn, backlog, and capex phasing, this chapter
              should be read as commercially promising but financially under-documented.
