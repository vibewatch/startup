  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation Summary, Thesis, and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Skeleton’s long case is straightforward. The company is no longer selling only supercapacitor cells;
              public 2026 materials position it as a system-level power-infrastructure supplier for AI data centers and
              grids. Management says the U.S. is already a core market, with more than 100 MW deployed and roughly half
              of revenue generated from North American customers, while the company’s Leipzig superfactory has started
              deliveries to AI-data-center hyperscalers. The May 2026 first close added new investors ahead of a planned
              2027 U.S. IPO, which is exactly the kind of strategic financing signal late-stage growth investors want to
              see.


              The anti-thesis is just as strong. Public materials still do not disclose absolute revenue, EBITDA, gross
              margin, or the exact post-money valuation for either the 2023 €108M E1 round or the 2026 €33M pre-IPO
              close. The strongest adverse source in the reviewed set—ERR—reports that 2024 was a record year for orders
              but that production disruption reduced output, growth missed internal goals, and Leipzig was not yet fully
              operational at the time of reporting. Without disclosed revenue, investors cannot determine whether
              Skeleton deserves a Vertiv-like AI-infrastructure premium or whether public markets would value it more
              like EnerSys or a micro-cap component vendor.


              The chapter therefore lands on **research-more**, not buy or pass. The company has enough strategic proof,
              factory scale, and partner validation to keep the file alive; however, the public evidence base is still
              too incomplete to support a price-sensitive underwriting view. Any current private mark implicitly
              requires investors to believe that disclosed IPO-era revenue will clear the system-level hurdle rather
              than the storage-hardware hurdle.
