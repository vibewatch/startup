      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture is founder-led and still fairly concentrated. Taavi Madiberk appears across
              fundraising, U.S. expansion, AI product launches, and sovereign-defense partnership announcements, making
              him the clear external face of the company. Oliver Ahlberg remains publicly identified as a co-founder,
              and the March 2026 appointment of Dr Kimmo Rauma as an independent board member is the clearest evidence
              that governance is being professionalized alongside manufacturing scale-up in Finland. Public reporting
              also highlights Priit Värk on manufacturing execution and Arnaud Castaignet on strategic and French
              defense activity.


              The diligence issue is not absence of leaders; it is incomplete transparency around governance depth. The
              retained sources do not provide a full public board roster, committee structure, or detailed public
              cap-table governance map. That means the founder/CEO remains a material key-person dependency even as the
              company broadens industrially. For a pre-IPO company pitching mission-critical infrastructure, that is
              manageable but worth carrying forward: investors should assume execution judgment, partner signaling, and
              public credibility are still disproportionately routed through a small number of named leaders until
              fuller governance disclosure emerges.
