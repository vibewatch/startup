      - number: '4.3'
        title: Capital intensity and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Capital intensity is the central financial fact. Skeleton has financed itself as a factory-building
              deep-tech company, not as a capital-light software vendor. Official and independent sources align on a
              2026 pre-IPO first close of €33 million and roughly €392 million of cumulative venture funding, while
              InforCapital translates the total raised to about $430 million. That base has funded a sequence of
              industrial build-outs: a €220 million Leipzig SuperFactory designed for up to 12 million cells a year, a
              €50 million Varkaus SuperBattery plant producing one gigawatt of power, a nearly €7 million Finnish
              business grant, prior acquisition of a 9,400 square meter Varkaus plant with 0.1 GWh output, and now U.S.
              engineering plus planned local manufacturing.

              The disclosed capital uses matter more than the round chronology itself. The 2023 €108 million financing
              was explicitly tied to supercapacitor and SuperBattery manufacturing expansion, the 2026 first close is
              framed as enabling AI-power demand and U.S. expansion, and the historical €15 million EIB quasi-equity
              loan funded R&D and industrial scale-up. Publicly, that is enough to say the company has repeatedly
              attracted strategic capital and non-dilutive-style support, but not enough to underwrite runway. No
              retained source discloses cash on hand, monthly burn, debt service, project-finance structure for U.S.
              manufacturing, or a management runway target. Against a factory footprint that already implies hundreds of
              millions of euros of capex, the fresh €33 million first close looks helpful but not self-evidently
              sufficient on its own. Investors therefore have to treat capital adequacy as plausible but unproven until
              management shares cash, burn, and forward capex schedules.
