            power-energy envelopes.
        - label: Module / Cabinet Layer
          detail: >-
            SkelMod, SkelGrid, GrapheneBBU modules, and related cabinets package cells into rail, grid, and
            AI-data-center form factors.
        - label: Power Electronics & Controls
          detail: >-
            Integrated BMS, DC/DC conversion, SkelGrid master controller, CAN, Modbus TCP, Redfish, and UPS inverter
            logic manage balancing and dispatch.
        - label: Application Systems
          detail: >-
            GrapheneGPU, GrapheneBBU, GrapheneUPS, and SkelGrid deploy the stack into AI, grid, mobility, and
            mission-critical workflows.
