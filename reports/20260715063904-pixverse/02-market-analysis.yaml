    {
      "id": "market-sizing",
      "title": "Multiple sizing lenses show a real category, but not yet a massive one",
      "body": "The strongest public consensus is not over the exact number, but over the rough scale. Fortune Business Insights values the AI video generator market at $847 million in 2026 after a $716.8 million 2025 base. Axis Intelligence offers a similar but slightly wider 2026 range of $847 million to $946 million, and The Business Research Company starts from a nominally close $0.85 billion 2025 base with a 2030 path to $2.07 billion. These estimates do not perfectly line up, which is important in itself: this is still an immature market whose definition and measurement vary by publisher. Even so, the disagreement happens within a bounded zone that is small relative to the broader generative-AI economy. Powerdrill's broader $67 billion generative-AI figure helps frame the point: AI video is an important growth category, but still only a thin slice of the overall AI spend pool. For PixVerse, that means future upside depends more on share capture and market expansion than on already enormous category size.",
