  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "PixVerse competes in an AI-video market that is clearly real but still surprisingly small in absolute dollars: major publishers cluster 2026 category size between roughly $847 million and just over $1 billion, even while adoption indicators for marketers and advertisers are rising sharply. The company's reachable wedge is narrower than the headline TAM because it sits at the intersection of creator tooling, enterprise video workflows, and still-emerging world-model use cases. The best evidence supports strong demand drivers and rapid workflow adoption, but not a clean public SAM or SOM for PixVerse's interactive-entertainment thesis."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary and what spend is actually in scope",
      "body": "The first analytical trap in AI video is to treat every generative-media dollar as if it were addressable by PixVerse today. Public market reports define the AI video generator category more narrowly: software that automates video creation from inputs such as text, images, or audio, typically with minimal human production overhead. That boundary includes text-to-video and image-to-video generation, multimodal references, API-driven video workflows, templates, lip-sync, and adjacent production tooling that is natively tied to generated video output. It does not automatically include all creator software, all editing suites, or the much larger generative-AI market. PixVerse's own product surfaces reinforce a specific reachable wedge: creator workflows, enterprise API workflows, and a newer world-model layer for interactive entertainment. The practical result is that PixVerse sits inside a subset of video-creation spend, not the whole creative-software universe. That narrower framing matters because it keeps later valuation work tied to a realistic denominator rather than to inflated TAM rhetoric.",
