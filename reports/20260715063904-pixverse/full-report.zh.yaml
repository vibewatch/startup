  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场视角
        blocks:
          - type: paragraph
            body: >-
              PixVerse 更适合给出跟踪 / 继续研究，而不是买入。多头逻辑并非空想：公司刚以超过 $2 billion 的估值完成新一轮融资，已累积超过 150 million 注册用户、约 15 million
              月活，并在销售一套覆盖消费者生成、专业工具和实时世界模型的宽产品栈。这些都是真资产，也解释了为什么即使竞争环境很恶劣，资本仍继续流入。问题在价格纪律。公开证据仍没有披露收入、ARR、付费用户数、毛利率或融资条款，当前估值无法锚定在经验证的盈利基础上。投资人只能把公司看作未来变现的期权，而不是已被证明的现金流资产。在这个姿态下，合理判断是估值偏紧但仍有意思：保持接触，索取尽调资料室，只有当变现证据追上估值动能时才上调判断。
