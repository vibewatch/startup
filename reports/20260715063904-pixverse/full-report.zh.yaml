              公开定价进一步说明，AI 视频很难形成持久锁定。Runway 从清晰的席位和积分套餐起步；Kling 混合订阅和按秒成本逻辑； Veo 覆盖免费访问、高级层和 API 层；Luma 明示积分阶梯；PixVerse
