      - number: '8.3'
        title: 情景承保与估值区间
        blocks:
          - type: paragraph
            body: >-
              PixVerse 不披露收入，讨论估值只能靠情景分析才算诚实。熊市情景假设消费者付费转化仍弱，R1 在战略上有意思但商业化仍早，且 AI 视频倍数在 Sora 关停暴露的算力成本警示下继续压缩。这组条件支持约
              $1.0-1.6 billion 的降轮或减记区间。基准情景假设现有用户规模守住，企业 / API 变现逐步拓宽，公司在没有重大运营或监管冲击下继续融资；沿这条路径，价值会聚在约 $1.8-2.4
              billion，接近今天的头部估值。牛市情景需要真正的变现杠杆：15 million MAU 带来更好转化，世界模型产品能吸引商业支出，企业扩张足以让 PixVerse
              更像规模化平台，而不是高互动创作者应用。若这些证据到位，约 $3.2-4.5 billion 的区间才有可能。
