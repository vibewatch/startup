      - number: '2.3'
        title: 买方分层、预算归属，以及采用为何变宽
        blocks:
          - type: paragraph
            body: >-
              买方地图的扩张速度，比单看市场规模报告更快。在分析机构、行业媒体和供应商材料中，最可见的细分人群是营销团队、代理商、内容工作室、创作者、 电影预演用户，以及越来越多的互动媒体开发者。Segmind 的
              PixVerse 评测尤其有用，因为它把类别落到真实买方工作流里，而不是抽象 TAM 语言： 营销代理商要快速制作广告，影视团队要预演和分镜，MCN 或创作者机构要可扩展的短视频生产。IAB
              相关报道解释了预算负责人为何开始投入。 广告主已经在数字视频创意中有意义地使用 GenAI；中小品牌采用最快，因为 AI 能弥合质量差距，又不需要传统制作预算。PixVerse 的 R1 信息再加一层：
              如果低延迟互动视频真正跑通，游戏、仿真、XR 和共享世界体验会打开另一条买方路径。这条路径更新、测量更少，但把市场叙事从传统片段生成继续拉宽。
