              公开耐久性证据是混合的。正面看，PixVerse 围绕创作者设计了明确粘性循环：CPP 申请滚动审核，超过三个月不活跃后福利可能暂停， 更高层级解锁更多积分、曝光和直接支持。这说明 PixVerse
