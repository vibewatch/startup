            body: >-
              PixVerse 的经济账未必与 Sora 相同，但这个品类已经证明，惊艳输出和病毒式使用可以与失衡的单位算力经济并存。PixVerse
              不披露付费用户、收入、毛利率或烧钱速度，投资人就不能假设它的规模能顺畅转化为可持续经济性。
