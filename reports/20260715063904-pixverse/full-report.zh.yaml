            body: >-
              在把 PixVerse 视为可投资的企业平台，而不只是高速增长的创作者应用之前，先索取四项材料：下架和标注 KPI 历史、安全 / 事件保障材料、包含 Alibaba 在内的客户集中度，以及付费用户 / 毛利率
