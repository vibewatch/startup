              PixVerse 的融资历史显示投资人信心在加速。2025 年 9 月，Alibaba 领投的 Series B 带来 $60M；2026 年 3 月， CDH Investments 领投的 Series C
              让公司进入独角兽行列；2026 年 7 月，Series C 被延展到公司披露的 $439M 总额。这组投资人名单混合了财务资本，以及媒体、技术和亚洲分发上的战略渠道，支持全球扩张，但也带来未来集中度问题。
              公开牵引力信号强，但口径并不统一。公司声明从 2025 年底的超过 1 亿用户、覆盖 175 个国家，推进到 2026 年 7 月的 超过 1.5 亿用户、覆盖 177 个以上国家；TechCrunch
              报道月活超过 1500 万，公司 2026 年 3 月新闻稿则称月活 1600 万。应用下载页又给出 5000 万以上下载和 441 万条评价。放在一起，这些数字说明公司确有规模和广泛消费端触达，
              但仍不足以让投资人承销收入质量或高效变现。
