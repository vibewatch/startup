  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 论点受损路径
      - 行动含义
    rows:
      - - 收入披露不及预期
        - 私下尽调显示变现远低于市场叙事暗示
        - 打破用户规模正转化为企业或付费需求的核心假设
        - 从跟踪转为放弃，或要求更低入场价
      - - 后续轮次重置定价
        - 新融资轮定价显著低于当前 >$2B 估值
        - 证明当前估值站不住
        - 视为降价轮信号，并按新参照重新测算
      - - R1 商业化失败
        - 世界模型使用停留在产品展示，没有企业支出
        - 抽掉乐观论点中的关键上行支柱
        - 按更拥挤的创作者视频应用来估值 PixVerse
      - - 集中度问题被证实严重
        - Alibaba 或少数客户贡献大部分可信企业需求
        - 压缩估值倍数支撑，也抬高交易对手风险
        - 先确认客户广度，再决定敞口规模
      - - AI 视频遭遇行业成本或政策冲击
        - 算力经济性或监管明显拖累品类情绪
        - 压缩整个同业组的估值倍数支撑
        - 推迟入场，或加大下行折扣
    notes: 这些否决标准是会改变投资判断的可监控事件，不是泛泛的经营风险。
    claimRefs:
      - CV007
      - CV031
      - CV042
      - CV048
      - CV049
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入与 ARR
        - 当前收入、ARR、增长、付费客户数与同期群留存
        - 没有这些数据，>$2B 估值标记无法用真实产出来校准
        - 向 CFO 或董事会索取 KPI 包
      - - 毛利率与烧钱速度
        - 算力成本、按产品线拆分的毛利率，以及烧钱速度 / 现金跑道
        - 用于判断下行保护和资本密集度
        - 索取财务模型和基础设施支出桥表
      - - 企业客户广度
        - 具名的非 Alibaba 企业客户、ACV 区间与续约证据
        - 用于测试集中度和 B2B 持续性
        - 索取客户名单和合同摘要
      - - R1 商业化
        - 世界模型产品的使用量、定价和销售管线
        - 用于判断上行假设是真实机会还是愿景
        - 按垂直行业索取产品 P&L 和管线
      - - 股权结构与优先权
        - 清算优先权、按比例跟投权、稀释与治理条款
        - 表面估值可能高估新进普通股投资者能拿到的价值
        - 索取投资条款清单和股权结构瀑布表
      - - 监管与内容风险准备
        - 审核、溯源和下架机制能随增长扩展的证据
        - 政策冲击可能同时打到收入和估值，因此必须核验
        - 与风险章节尽调清单交叉核对
    notes: 这些问题定义了从「跟踪」建议走向真正承销决策的最短路径。
    claimRefs:
      - CV011
      - CV012
      - CV041
      - CV048
      - CV050
