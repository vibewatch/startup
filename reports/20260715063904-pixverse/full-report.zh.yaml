        - id: trust
          label: 客户信任
        - id: churn
          label: 流失 / 增长放缓
        - id: economics
          label: 算力 / 变现不透明
        - id: margin
          label: 利润率质量
        - id: valuation
          label: 估值 / 融资风险
      edges:
        - from: laws
          to: moderation
          label: 提高合规负担
        - from: moderation
          to: trust
          label: 漏判侵蚀信任
        - from: support
          to: trust
          label: 计费 / 支持摩擦伤害信任
        - from: trust
          to: churn
          label: 信任下降推高流失
        - from: economics
          to: margin
          label: 单位经济性不透明挤压利润率
        - from: churn
          to: valuation
          label: 增长放缓压低倍数
        - from: margin
          to: valuation
          label: 利润率走弱压低价值
        - from: economics
          to: valuation
          label: 不透明削弱投资判断信心
