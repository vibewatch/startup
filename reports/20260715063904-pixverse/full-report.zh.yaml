      - number: '8.4'
        title: 可比公司纪律
        blocks:
          - type: paragraph
            body: >-
              可比公司集合支持纪律，而不是立刻给溢价。Runway 是最干净的私募参照：它在 2026 年 2 月融资时估值为 $5.3 billion，这意味着 PixVerse
              相对资金最充足的一线同行仍有折价。这个折价合理，因为 Runway 在资本形成和全球品牌认知上走得更远。Kuaishou 和 Kling 给出相反方向的教训。Kuaishou 的备案文件显示 AI
              视频可以真实变现，也展示了当 AI 视频嵌在大型商业生态里时，既有平台的优势。Alphabet 和 Adobe 提供类似的天花板参照：它们市值和披露质量都很高，但 Veo 和 Firefly
              是更大平台里的功能线，不是独立可比公司。换句话说，PixVerse 凭用户增长和品类聚焦应获得一定溢价，但相对披露更好、变现更多元或资本基础更强的同行，仍应折价。
