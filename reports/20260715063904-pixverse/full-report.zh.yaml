            body: PixVerse 如今同时处在美国 48 小时下架制度和欧盟深度伪造标注制度之下，但公开材料仍看不到信任中心、状态页、认证范围或运营合规指标。只有尽调能发现远强于公开网页暗示的私有信任包，这种错配才可控。
