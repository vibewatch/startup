            - label: 高
              tone: positive
              detail: 文档页面详尽。
            - label: 中低
              tone: neutral
              detail: 独立证据少于 V6。
            - label: 低
              tone: negative
              detail: 未公开保障细节。
        - label: R1
          values:
            - label: 高
              tone: positive
