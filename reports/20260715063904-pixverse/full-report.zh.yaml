  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品栈已覆盖创作者视频、专业工作流和实时世界
        blocks:
          - type: paragraph
            body: >-
              过去一年，PixVerse 公开产品叙事明显更结构化。官网和 R1 材料清楚表明，公司并不打算用一个无差异模型解决所有问题。 相反，它围绕待完成任务做分层：V-Series 模型用于标准视频生成，C1
              用于更接近电影和分镜的专业工作，R1 用于连续互动世界。 文档里的能力矩阵进一步证明，这不只是营销语言。矩阵显示，文本转视频、图像转视频、转场、参考转视频和延展工作流都有明确模型级支持； 同时又把
              restyle、modify、mimic 和 lip sync 等独立端点拆开。这种模块化很重要，因为它告诉买方和开发者，PixVerse 预期这套栈如何被使用。
              它也暗示了产品战略：公司试图同时拥有成片资产工作流和更新的有状态互动工作流，而不是强迫一个模型拙劣覆盖所有用例。
