      - number: '7.2'
        title: 运营、质量、安全与支持风险
        blocks:
          - type: paragraph
            body: >-
              PixVerse 把自己描述为可投产且速度很快，但公开文档同时暴露出一个比许多企业软件买方希望看到的更薄的信任界面。API 文档承诺可投产可靠性和约 10 秒平均渲染时间；支持和 FAQ
              页面却围绕持续存在的问题搭建，例如生成卡住、并发不匹配、URL 延迟、审核失败、退款问题，以及请求永远不返回响应。 这些本身并不致命——每个 API 产品都有支持边缘案例——但风险在于，本章保留来源中
              PixVerse 没有发布公开状态页、安全认证组合、信任中心或事件 SLA。 隐私和滥用风险也不可小看。PixVerse 政策承认跨境数据处理、设备和位置收集、cookies
              与广告技术，甚至对上传照片进行临时面部数据提取。 结合非常大的移动端触达和面向创作者的功能深度，这意味着审核、支持或事件响应一旦失败，可能很快沿消费端和企业声誉渠道扩散。
              围绕计费和退款处理的负面评测界面，也让支持质量应被视为尽调主题，而不是表面问题。
