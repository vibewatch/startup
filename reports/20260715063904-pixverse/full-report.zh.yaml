        - KAGAMIAI / TSUBASA 及类似 IP 持有人
        - 授权、使用控制和高端活动证明
        - 中
        - 权利争议或标注失误损害品牌合作
        - 高
        - 使用 KAGAMI 式控制，并明确伙伴流程
        - 中
      - - 监管 / 监督机构
        - EU AI Office、数字服务协调员、FTC
        - 合规扩张的看门人
        - 中
        - 不合规会带来执法、举证负担或市场摩擦
        - 高
        - 采用符合行为准则的控制，并把合规留痕
        - 中高
    notes: 各行聚焦一旦失效就会直接影响收入增长、分发或合法运营能力的依赖项。
