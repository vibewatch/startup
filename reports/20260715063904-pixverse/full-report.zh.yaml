      - number: '1.2'
        title: 创始人、领导层信号，以及治理透明度边界
        blocks:
          - type: paragraph
            body: >-
              创始人叙事是 PixVerse 最清晰的优势之一。公开来源稳定指向 Changhu Wang 和 Jaden Xie 两位联合创始人： Wang 带来 ByteDance 的深度计算机视觉和数据标注经验，Xie
              则带来 Lighthouse Capital 的资本市场和战略经验。 这组组合契合 PixVerse 当前故事：一家产品很重的公司，要一边全球扩张，一边从成熟的跨境投资人阵容中继续融资。
              不过，公开记录里的治理信息有限。TNGlobal 提到 Wang 与 Singapore Economic Development Board 创始人项目的关系， 公司也经常引用 Xie
              作为面向外部的战略发声者；但在本轮审阅的页面中，PixVerse 似乎没有发布详细董事会名单或独立治理说明。 对一家估值已超过 $2B、且有 Alibaba
              等战略投资人支持的私人公司来说，这个缺口重要，因为下一步尽调不再主要验证创始人可信度， 而是要看控制权、董事会监督和利益冲突管理。
