companyProfile:
  summary: >-
    PixVerse 是一家总部位于新加坡的 AI 视频生成创业公司，2023 年由 Changhu Wang 和 Jaden Xie 创立。公司把消费端与 API 视频生成、专业创意工作流，以及面向游戏和互动娱乐的 R-Series
    实时世界模型放在同一套产品版图里。到 2026 年 7 月， 公开融资报道称 PixVerse 服务超过 1.5 亿注册用户、约 1500 万月活用户；最近的 Series C 延展轮把公司估值推到 $2B 以上。
  foundedDate: '2023-01-01'
