      - number: '2.2'
        title: 多种规模测算口径显示类别真实存在，但还不是巨型市场
        blocks:
          - type: paragraph
            body: >-
              公开共识最强的地方不是精确数字，而是大致量级。Fortune Business Insights 认为 AI 视频生成器市场在 2025 年 $716.8M 的基础上，2026 年达到 $847M。Axis
              Intelligence 给出的 2026 年区间相近但略宽，为 $847M 至 $946M；The Business Research Company 则从名义上接近的 2025 年 $0.85B
              基数出发，给出到 2030 年 $2.07B 的路径。这些估算并不完全对齐，这本身就重要：市场仍不成熟，定义和测量随发布方而变。即便如此，分歧发生在一个有边界的区间里， 相比更广的生成式 AI
              经济体很小。Powerdrill 更宽口径的 $67B 生成式 AI 数字有助于框定这一点：AI 视频是重要增长类别， 但仍只是整体 AI 支出池中的薄片。对 PixVerse
              来说，未来上行空间更多取决于份额获取和市场扩张，而不是一个已经巨大的类别规模。
