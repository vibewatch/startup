  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: PixVerse 的旅程从低门槛创作者发现开始，随后分叉到创作者计划深化、品牌活动，以及更薄但明确的企业路径。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: 用户通过应用商店、Product Hunt、社交内容，以及围绕 R1、V6 和合作发布的官方消息找到 PixVerse。
          tone: positive
        - id: first-create
          label: 首次创作
          detail: 移动端和网页端用户用模板、文生视频或图生视频工具制作短视频。
          tone: positive
        - id: community
          label: 社区 / CPP
          detail: 重度用户只要持续发布 PixVerse 作品，就可加入 Creator Partner Program，获得积分、支持和曝光。
          tone: positive
        - id: public-proof
          label: 公开背书
          detail: 公开成果来自 Daria Grin、Zenith Apex 等创作者，也来自 UN AI for Good、Captain Tsubasa 等合作。
          tone: positive
        - id: enterprise
          label: 企业部署
          detail: 明确的企业路径经过 API 平台、新加坡销售办公室，以及公开点名的 Alibaba 部署。
          tone: neutral
        - id: friction
          label: 计费 / 支持摩擦
          detail: 二级评论提醒，不可结转的积分、取消订阅不清楚、支持响应质量，都会打断付费用户的重复使用。
          tone: warning
    claimRefs:
