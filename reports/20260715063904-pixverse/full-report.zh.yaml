  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 美国深度伪造下架合规
        - 受害者移除处理表现
        - 有证据显示有效通知未在 48 小时内解决
        - 暂停投资测算，直到公司证明法律和运营整改到位
      - - 欧盟透明度合规
        - 标注 / 检测上线
        - 执法日期前没有符合第 50 条的标注或检测架构
        - 视为欧盟扩张计划受损，并下调跨境增长假设
      - - 支持与计费质量
        - 投诉和退款指标
        - 退款争议、支持滞后或计费争议持续激增
        - 假设流失更高、信任更低、转化更弱
      - - Alibaba 集中度
        - 收入集中度明细
        - Alibaba 占企业预订收入比重过大，或带来限制性权利
        - 施加重大集中度折价，并要求多元化计划
      - - 变现不透明
        - 尽调数据室完整度
        - 管理层无法在尽调中提供付费用户、利润率或同期群指标
        - 根据轮次条款，从跟踪转为放弃 / 继续研究
    notes: 这些否决标准刻意设计成可监测指标，而不是抽象判断，方便推动具体尽调问题和投委会检查点。
