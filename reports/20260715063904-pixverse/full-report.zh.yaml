      - number: '7.4'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              PixVerse 的财务风险不明显在需求差，而在不透明。公开资料能支撑它有很大的用户触达、广泛的创作者使用，以及一定企业端野心；但 TechCrunch 明确写到，PixVerse
              不愿披露付费用户数。已保留的公开资料没有给出收入、ARR、烧钱速度、现金续航、毛利率或留存。投资人因此很难判断，PixVerse 的消费者规模到底在高效变现，还是靠高额补贴撑着。最强的外部警示不是
              PixVerse 自己说了什么，而是赛道历史：Sora 在 2026 年关停说明，即便是热度很高的 AI 视频产品，一旦算力经济账跑在客户付费意愿前面，也会失败；Digital Applied
              量化了这种错配，CNBC 也独立确认了战略收缩。PixVerse 的成本结构、产品组合和客户群可能不同，但这条教训仍相关，因为 PixVerse 同样强调规模、速度和内容量。公司自己的企业 ROI
              说法值得鼓励，但仍是公司口径，不是逐账户独立验证。管理层拿出分群经济性、企业 ACV 和毛利率披露之前，投资人应把算力强度和变现视为一阶剩余风险。
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
      - number: '7.5'
        title: 人员、治理与执行风险
        blocks:
          - type: paragraph
            body: >-
              PixVerse 规模仍不大，创始人集中度和跨境执行就格外重要。独立报道显示，团队约 150
              人，分布在新加坡、北京和上海，并计划继续招聘研究员和商业化人员。单看人数似乎可控，但公司同时推进的线很多：消费者增长、企业销售、世界模型研发、全球政策暴露、移动端审核、品牌合作。公司叙事核心仍高度围绕
              Changhu Wang 的技术和标注履历，以及 Jaden Xie
              在融资和商业定位中的角色，这意味着关键人风险不低。公司总部在新加坡、又与中国有连接，数据处理、招聘、治理协同和地缘政治叙事管理都会更复杂——尤其当客户或监管越来越要求说清数据在哪里处理、哪些团队接触数据、合规变更能多快在全球落地时。上述风险不能证明公司失序。但合在一起看，PixVerse
              的经营杠杆是双刃剑：同样的集中度能推高产品速度，也会放大控制失灵或执行失误。
            claimRefs:
              - CR015
              - CR024
              - CR038
              - CR039
              - CR040
          - type: table
            tableRef: TR004
            claimRefs:
              - CR019
              - CR038
              - CR039
              - CR040
      - number: '7.6'
        title: 缓释、监控与止损标准
        blocks:
          - type: paragraph
            body: >-
              PixVerse 确实有公开缓释措施，但它们更像方向性证据，还不是可承保的控制证明。社区准则给出可见的执法阶梯，KAGAMI Gate 为授权活动加入权利控制；如果 PixVerse
              选择签署或对标，欧盟委员会的实践准则也提供了 AI 标注合规路径。问题在于，公司尚未公开把这些控制与投资人想看的信任材料配套起来，例如事件
              SLA、认证范围、投诉指标或经审计的下架表现。监控因此尤其重要。能打破投资逻辑的事件会很具体，而不是停留在理论层面：未能遵守美国或欧盟的下架和标注义务；涉及逼真有害或侵权内容的严重审核丑闻；有证据显示
              Alibaba 在企业订单中占比过高；或尽调时无法披露变现和分群数据。这些触发点都可监测，不是哲学问题。因此，正确的尽调姿态既不是直接否定，也不是恐慌，而是在把 PixVerse
              的规模视为耐久而非脆弱之前，要求公司拿出真正的信任包、政策运营指标，以及更清晰的客户经济视图。
