  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: sample
      basis: >-
        Covers the most decision-relevant private and public valuation anchors available from retained public sources as
        of 2026-07-15; it is not a complete comp set for every creative-software or AI infrastructure company.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - PixVerse
        - 最新私募估值
        - '>$2B 投后估值，$439M Series C 扩展轮后'
        - 当前评估入场价的直接参照
        - 未公开收入或清算优先权披露
      - - Runway
        - 最新私募估值
        - 2026 年 2 月 $315M 轮后估值约 $5.3B
        - 最接近的规模化私营 AI 视频同行
        - 仍为私营公司，经济性披露不完全可比
      - - Kuaishou / Kling
        - 上市母公司市值 + 已披露 AI 视频收入
        - 市值约 $23.77B；Kling 2025 年 Q4 收入 RMB340M
        - 证明规模化变现可行，且有资本支撑
        - Kling 嵌在大得多的上市生态里
      - - Alphabet / Veo
        - 公开生态参照
        - 市值约 $4.36T，并有最新 2025 10-K 文件锚定
        - 给出平台资产负债表实力上限
        - Veo 只是巨头产品组合中的一个功能，不是纯 AI 视频可比公司
      - - Adobe / Firefly
        - 公开创意软件参照
        - 市值约 $91.66B，并有 SEC 文件锚定
        - 可用于理解创意工作流价值语境和披露纪律
        - Adobe 是业务覆盖更广的软件公司，不是独立 AI 视频公司
    notes: 可比组用于框定相对规模和披露质量，而不是给 PixVerse 硬套一个并不存在的直接倍数。
