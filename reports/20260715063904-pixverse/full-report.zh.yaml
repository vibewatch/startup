  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: PixVerse 维持在「跟踪」：真实规模和新资金支撑投资命题，但披露缺口与行业经济性把当前价格下的确定性封住。
    approximationNotes: 该流程为定性判断，映射截至 2026-07-15 从公开证据到推荐结论的尽调链条。
    data:
      nodes:
        - id: scale
          label: 用户规模
          detail: 注册用户 150M+，MAU 约 15M
          type: input
        - id: product
          label: 产品广度
          detail: V-Series、C-Series 和 R1 世界模型线
          type: input
        - id: capital
          label: 新资金
          detail: $439M 延伸轮和 >$2B 投后估值标记
          type: input
        - id: gap
          label: 披露缺口
          detail: 未公开收入、ARR、毛利率或优先权结构
          type: process
        - id: risk
          label: 行业谨慎
          detail: Sora 关闭和竞争对手激进融资
          type: process
        - id: decision
          label: 推荐
          detail: 跟踪 / 继续研究；估值偏高
          type: output
      edges:
        - from: scale
          to: decision
          label: 支撑关注
        - from: product
          to: decision
          label: 支撑上行
        - from: capital
          to: decision
          label: 验证需求
        - from: gap
          to: decision
          label: 限制确信度
        - from: risk
          to: decision
          label: 封住倍数
        - from: capital
          to: gap
          label: 头部估值超过披露支撑
    claimRefs:
      - CV001
      - CV006
      - CV011
      - CV031
      - CV039
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 价值敏感性显示，变现证据和企业客户广度是最大上行杠杆；披露失败和行业压缩是最大下行杠杆。
    approximationNotes: 柱状条是围绕当前 >$2B 锚点的方向性变动，单位为百万美元，且不可相加。
    data:
      items:
        - label: 审计后收入披露确认强变现能力
          value: 800
        - label: 企业客户广度延伸到 Alibaba 之外
          value: 500
        - label: R1 商业采用开始可见
          value: 400
        - label: 付费转化仍弱
          value: -350
        - label: 经济性冲击后行业倍数压缩
          value: -500
        - label: 未来轮次披露经济性更弱或条款更苛刻
          value: -700
    claimRefs:
      - CV007
      - CV031
      - CV041
      - CV042
      - CV048
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 熊市、基准和牛市区间显示，基准情形下 PixVerse 接近当前估值标记；若经济性不及预期则有下行，若变现追上参与度则有上行。
    approximationNotes: 区间是以十亿美元计的编辑估值估算，来自情景假设，而非完整财务模型。
    data:
      items:
        - label: 熊市情形估值
          low: 1
          base: 1.3
          high: 1.6
          unit: $B
        - label: 基准情形估值
          low: 1.8
          base: 2.1
          high: 2.4
          unit: $B
        - label: 牛市情形估值
          low: 3.2
          base: 3.8
          high: 4.5
          unit: $B
    claimRefs:
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 式评分支持观察名单姿态：市场和产品有吸引力，但证据质量、下行保护和价格纪律较弱。
    approximationNotes: 分数采用 1-10 编辑量表，基于截至 2026-07-15 保留下来的公开证据。
    data:
      items:
        - label: 市场关注度
          value: 8
          unit: /10
          note: AI 视频仍具战略重要性，也仍能吸引大额融资轮。
        - label: 产品差异化
          value: 7
          unit: /10
          note: R1 在标准创作者视频工具之外增加了差异化可选性。
        - label: 用户证据
          value: 8
          unit: /10
          note: 150M 注册用户和约 15M MAU 显示真实分发。
        - label: 经济性透明度
          value: 3
          unit: /10
          note: 收入、毛利率和现金消耗未公开。
        - label: 可比公司支撑
          value: 5
          unit: /10
          note: Runway 和 Kling 有参考价值，但不是干净的一对一估值可比。
        - label: 入场纪律
          value: 4
          unit: /10
          note: 价格刚更新，但证据质量落后于当前估值标记。
    claimRefs:
      - CV006
      - CV015
      - CV039
      - CV040
      - CV050
