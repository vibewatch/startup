  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              在 PixVerse 达到独角兽规模之前，面向消费者的生成式视频监管环境已经明显收紧。在美国，TAKE IT DOWN Act 已经成为法律， 要求覆盖平台在收到通知后 48
              小时内移除未经同意的亲密影像，包括计算机生成内容。在欧洲，DSA 已要求平台最小化非法和有害内容风险； AI Act 和 Commission 2026 年实践准则也通过 Article
              50，推动提供方和部署方走向清晰标识、检测和深度伪造标注。 Greenberg Traurig 的总结重要，因为它明确指出，即便没有欺骗意图，深度伪造标注义务也可能适用。在这个背景下，PixVerse
              的公开法律界面显示出真实控制， 但细节不多：社区准则禁止露骨、暴力、非法和侵权内容；条款与隐私政策把责任大量分配给用户，同时保留广泛修改条款和跨境处理用户数据的权利。 未解决的问题是来源可追溯性：公开来源和
              PixVerse 披露都没有解释训练数据权利、诉讼姿态，或公司将如何在规模化运营中落地 2026 年之后跨司法辖区的下架与透明度义务。
