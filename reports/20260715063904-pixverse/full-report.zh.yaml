  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及哪些支出真正落在范围内
        blocks:
          - type: paragraph
            body: >-
              分析 AI 视频的第一个陷阱，是把每一美元生成式媒体支出都当作 PixVerse 今天可触达的市场。公开市场报告对 AI 视频生成器类别的定义更窄：
              软件从文本、图像或音频等输入自动生成视频，通常只需要很少的人力制作开销。这个边界包含文生视频和图生视频、多模态参考、API 驱动的视频工作流、
              模板、口型同步，以及与生成视频输出原生绑定的相邻制作工具。它不会自动包含所有创作者软件、所有剪辑套件，或规模大得多的生成式 AI 市场。 PixVerse
              自身产品界面也强化了一个具体可触达切口：创作者工作流、企业 API 工作流，以及面向互动娱乐的更新世界模型层。实际结果是， PixVerse
              位于视频创作支出的一部分里面，而不是整个创意软件宇宙里。这个更窄的框架很重要，因为它把后续估值分析锚在现实分母上，而不是被夸大的 TAM 话术上。
