  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局结构：直接模型对手、工作流套件和生态型既有玩家
        blocks:
          - type: paragraph
            body: >-
              PixVerse 面对的不是一组整齐同质的对手。在直接模型层，它面对 Runway、Kling、Veo、Seedance、Pika 和 Luma。
              在工作流套件层，它面对把生成能力包进更广剪辑、协作或智能体体验的工具；今天 Runway 和 Luma 在这一层最强。 在生态层，它会撞上 Google、ByteDance/CapCut 和
              Kuaishou，这些公司都能把庞大既有用户基础导向自身视频模型， 不需要像独立创业公司一样做客户获取。最后，现状本身并不是空白；许多买方仍可以靠内部团队、传统制作或选择性 AI 增强解决问题，
              不必完全押注平台。RCTV 和 Rangy 的价值正在于它们拒绝点名一个通用赢家。相反，它们呈现的是一个买方越来越按用例选择工具的市场： 真实感、剪辑、角色一致性、消费端特效，或互动视频野心。这让
              PixVerse 的位置比一维基准竞赛更可信，但也更难靠单一产品信息守住。
