  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、运营足迹，以及 PixVerse 实际销售的东西
        blocks:
          - type: paragraph
            body: >-
              PixVerse 应被理解为一家高速扩张的 AI 视频平台：它试图把消费端传播、创作者工具和企业 API 接起来， 而不是只做一个单功能视频玩具。当前报道持续把公司描述为总部位于新加坡；公司自己 2026 年 3
              月的融资公告也把 新设的新加坡办公室定义为企业销售、合作伙伴和全球市场拓展的枢纽。这个运营姿态很关键，因为公司执行上似乎仍依赖
              新加坡、北京、上海之间更宽的区域足迹。公开产品话术也显示出一家三年公司少见的跨度。PixVerse 同时营销消费端和 API
              视频模型、专业工作流模型、实时世界模型；文档和官网又强调创作者易用性与可投产的企业部署。结果是，这家公司画像 同时带有社交媒体规模和明确的业务工作流、互动娱乐进攻意图，比标准文生视频创业公司的定位更激进。
