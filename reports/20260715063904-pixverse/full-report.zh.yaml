  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 付费转化改善，企业 / API 组合扩大，R1 显示商业牵引力
        - 支撑约 $3.2-4.5B 区间，相比当前估值有上行空间
        - 执行滑坡、监管冲击或企业采用偏弱
        - 需要变现杠杆证明，不只是用户活跃
      - - 基准
        - 消费者牵引力保持强劲，企业 / API 销售温和扩张，公司避开行业冲击
        - 支撑约 $1.8-2.4B，接近当前名义估值
        - 披露仍薄，公司未能获得重估
        - 最符合当前公开证据
      - - 悲观
        - 转化不及预期，R1 变现仍处早期，成本或政策冲击后行业倍数压缩
        - 支撑约 $1.0-1.6B，未来可能重置到当前估值以下
        - 降价融资、融资议价能力转弱和情绪反转
        - 由经济性不及预期或全市场压缩触发
    notes: 情景区间是基于公开证据和可比逻辑给出的编辑性估值带，不是完整 DCF 或经审计收入模型。
