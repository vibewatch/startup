  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 证据锚点
      - 决策含义
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - 新近 >$2B 融资估值，加上真实产品和用户规模；但公开收入披露为零
        - 保持跟进，但暂不按当前价格给出买入判断
      - - 置信度
        - 中
        - 融资和用户证据强，但经济性和条款不透明
        - 拿到非公开 KPI 包后，再上调信心
      - - 风险评级
        - 高
        - 算力、监管和披露缺口都可能传导为估值下行
        - 先测算下行，再看上行
      - - 估值立场
        - 偏高
        - 公司真实且在增长，但公开证据追不上名义估值
        - 要么价格纪律更强，要么披露更充分
      - - 主要支撑
        - 用户规模 + 世界模型差异化 + 新资金
        - 这些是 PixVerse 仍值得列入观察名单的主因
        - 支撑跟踪立场，而不是直接放弃
      - - 可能退出
        - 后续 crossover / IPO 路径、战略出售或继续私募扩张
        - 退出时间取决于商业化证明和品类情绪
        - 将流动性视为依赖里程碑
    notes: 本表是在当前公开证据水平下总结建议，不是对公司质量给出永久判断。
