  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: PixVerse 的法律、运营和经济风险会通过少数共同瓶颈传导到客户信任、流失、利润率和估值：审核质量、支持质量和变现可见度。
    data:
      nodes:
        - id: laws
          label: 美国 / EU AI 规则
