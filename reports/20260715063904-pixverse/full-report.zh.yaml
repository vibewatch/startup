      - number: '8.5'
        title: 什么会改变判断
        blocks:
          - type: paragraph
            body: >-
              PixVerse 仍有机会从跟踪走到买入，但上调路径取决于证据。第一，管理层需要披露经审计、或至少达到投资人级别的收入信息：总收入、增速、付费方结构、毛利率，以及消费者、API、企业和 R1
              相关销售之间的桥。第二，投资人需要合同层面的证明，确认公司不止一个灯塔企业账户，且 Alibaba
              没有在商业叙事里承担过高权重。第三，市场需要看到世界模型投入能转化为经常性需求，而不只是产品兴奋。最后，价格保护很重要。没有优先权栈披露，即使公司很强，也可能不是好入场点。若变现停滞、监管或算力冲击压缩行业，或未来轮次把价格重置到当前估值以下，投资逻辑就会破裂。这些问题关闭之前，有纪律的做法是密切跟踪，并只在尽调后承保。
