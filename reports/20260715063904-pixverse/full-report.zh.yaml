  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 框架
      - 论点
      - 重要性
      - 什么会改变判断
    rows:
      - - 正方论点
        - PixVerse 拥有超过 150M 注册用户和约 15M MAU
        - 规模降低了产品小众或无关紧要的风险
        - 披露付费转化可证明规模能否变现
      - - 正方论点
        - 公司刚在 2026 年 7 月完成 >$2B 融资事件
        - 新资金说明外部投资者仍有兴趣，并延长现金跑道
        - 公开运营 KPI 可把势能转为可测算证据
      - - 正方论点
        - R1 让 PixVerse 在互动娱乐里有差异化叙事
        - 世界模型的可选空间可能打开高价值收入触点
        - R1 的商业采用证据会显著强化正方论点
      - - 反方论点
        - 没有公开收入、ARR 或毛利率披露
        - 投资者无法把当前价格和已验证经济产出挂钩
        - 经审计或董事会级别指标可以补上这块缺口
      - - 反方论点
        - 企业端证据集中在围绕 Alibaba 的叙事
        - 商业覆盖面可能比融资叙事暗示的更窄
        - 具名企业客户和 ACV 区间会降低集中度风险
      - - 反方论点
        - 资产负债表更厚的大型对手仍在大力投入 AI 视频
        - 竞争压力会压制变现和倍数扩张
        - 持续定价权或粘性企业需求可以抵消这块压力
    notes: 将真实用户规模和产品差异化的正方逻辑，与阻挡买入判断的披露、集中度问题并列呈现。
    claimRefs:
      - CV001
