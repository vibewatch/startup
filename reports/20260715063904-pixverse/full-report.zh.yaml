      - CU006
      - CU008
      - CU016
      - CU018
      - CU020
      - CU021
      - CU029
      - CU035
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: wide
    summary: 可观察漏斗顶部很大，但从用户数走向具名部署和变现账户时，公开证据明显变薄。
    data:
      items:
