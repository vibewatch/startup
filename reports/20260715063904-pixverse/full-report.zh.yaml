      - number: '8.2'
        title: 为什么公开证据还够不上买入
        blocks:
          - type: paragraph
            body: >-
              PixVerse 显然有变现界面，但公开记录呈现的是结构，不是产出。公司披露了基于点数的定价、并发档位、自助和企业 API
              方案，以及区分主流视频创作和更高价值工作流的模型梯队。这足以说明公司设计上不是收入前状态，却不足以证明当前 >$2 billion 估值有耐久经济性支撑。已保留的 2026 年 7 月融资公告均未披露收入或
              ARR，也没有已保留公开资料披露毛利率、烧钱速度或现金续航。PixVerse
              已跨入独角兽定价区间，这些缺口比小型种子轮公司更重要。公开股权结构表或优先权披露缺失，又加重了问题：投资人知道头部估值，却不知道底层保护条款。最终，建议框架应锚定在证据缺口，而不只是市场热情。
