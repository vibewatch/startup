  topStrengths:
    - 差异化的 R1 世界模型路线图，让 PixVerse 不止是标准创作者视频工具。
    - 注册用户超过 150M、MAU 约 15M，说明这家未上市 AI 视频初创公司的漏斗顶部触达规模异常大。
    - 创始团队把 ByteDance 系计算机视觉经验和资本市场履历拼在一起。
    - 与 Alibaba 相关的企业验证和连续融资支持，说明公司已进入战略伙伴和投资人的视野。
  topRisks:
    - 公司没有公开收入、ARR、毛利率或烧钱速度，难以有把握地支撑当前估值。
    - Runway、Kling/Kuaishou、Google、Adobe 等资本充足的竞争者可以压低价格，或用投入压过 PixVerse。
    - AI 视频的算力经济性仍脆弱；Sora 在 2026 年关停，以及行业更广泛的谨慎情绪，都说明这一点。
    - 公开可见的企业验证很窄；如果 Alibaba 相关关系承担了过多商业化贡献，集中度风险会被放大。
    - Series C 的优先权条款和稀释结构未披露，账面估值可能高估新股东实际可获得的价值。
  unresolvedGaps:
