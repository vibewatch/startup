  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "PixVerse now looks more like a modular media platform than a single AI-video app. The public record supports three distinct product layers: core video-generation models such as V6 and C1, a real-time world-model stack centered on R1, and a widening developer surface that includes APIs, partner endpoints, and MCP-based tooling. The strongest gaps are not around feature breadth but around enterprise assurance and technical methodology, where public materials remain lighter than the product ambition suggests."
  },
  "sections": [
    {
      "id": "product-stack",
      "title": "Product stack now spans creator video, professional workflows, and real-time worlds",
      "body": "PixVerse's public product story has become notably more structured over the past year. The homepage and R1 materials make clear that the company is not trying to do everything with one undifferentiated model. Instead, it segments around job to be done: V-series models for standard video generation, C1 for more film-like and storyboarded professional work, and R1 for continuous interactive worlds. The docs capability matrix reinforces that this is not mere marketing language. It shows explicit model-level support across text-to-video, image-to-video, transition, reference-to-video, and extension workflows, while also separating standalone endpoints such as restyle, modify, mimic, and lip sync. That modularity matters because it tells buyers and developers how PixVerse expects the stack to be used. It also hints at product strategy: the company is trying to own both the finished-asset workflow and the newer stateful-interaction workflow rather than forcing one model to cover every use case poorly.",
      "claimRefs": [
        "CE001",
        "CE005",
        "CE009",
        "CE010",
