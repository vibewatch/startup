    {
      "id": "public-financial-gaps-and-risk",
      "title": "The core underwriting problem is not access to capital but lack of operating disclosure",
      "body": "PixVerse's financial blind spot is operating transparency. Public sources do not disclose revenue, ARR, gross margin, burn, runway, or paying-user count, even though the company is now priced and funded like a late-stage platform bet. That gap matters more in AI video than in many software categories because compute economics can destroy an apparently healthy top-line story. Sora's 2026 collapse is the most visible cautionary example: demand and hype were real, yet unit economics were unsustainable. PixVerse may not share that exact profile, but the category-wide price floor is falling and major rivals are forcing more aggressive competition on both quality and cost. The consequence for diligence is straightforward. PixVerse's capital base may be enough to keep scaling, but without verified payer, margin, and cash-burn data, investors are still underwriting a financing story and a pricing architecture more than a proven financial engine.",
      "claimRefs": [
