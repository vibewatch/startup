    {
      "id": "pricing-and-unit-economics",
      "title": "Pricing is explicit enough to show product logic, but not explicit enough to prove unit economics",
      "body": "Official docs make it possible to reason about PixVerse's pricing logic. The platform publishes credit consumption by model, duration, resolution, and audio settings, and even provides a simple starter-pack illustration that implies a low entry cost for short V6 clips. The jump from V6 to C1 is real but not extreme, suggesting management wants pro-quality usage to feel premium without putting it in a completely different economic bracket. Public comparators show the category-wide challenge. Atlas Cloud, Artificial Analysis, and the company's own pricing surfaces all frame different effective prices depending on access route, benchmark assumptions, and model settings. That variation is itself important: in AI video, the buyer rarely pays one stable list price. Instead, price is a moving function of resolution, audio, route, credits, and contract structure. The result is that PixVerse can plausibly be both cheap enough to drive adoption and too opaque for outside investors to confidently model margin capture.",
