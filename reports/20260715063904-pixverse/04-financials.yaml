    {
      "id": "capital-base-and-adequacy",
      "title": "Capital raised is large, but the exact lifetime total is still disputed",
      "body": "Funding is the one part of PixVerse's financial story that is both visible and confusing. The company officially disclosed a $60 million Alibaba-led Series B and later said total Series C fundraising reached $439 million after the July 2026 extension. A Tech Funding News article citing Bloomberg reported a $300 million March 2026 Series C, while ToolJunction adds a roughly $55 million Series A. Depending on how those pieces are combined, investors can defend at least three different totals: roughly $415 million before the extension, about $554 million if the $439 million is a total Series C figure, or well above that if the extension is mistakenly or deliberately treated as incremental. Ventureburn goes even further, describing investor bets above $700 million in aggregate. The safest conclusion is not to pick the biggest number; it is to treat total raised as a live diligence item. Capital availability clearly looks strong, but public sources do not yet provide a single clean financing bridge.",
