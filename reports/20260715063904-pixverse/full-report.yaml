            body: >-
              Official docs make it possible to reason about PixVerse's pricing logic. The platform publishes credit
              consumption by model, duration, resolution, and audio settings, and even provides a simple starter-pack
              illustration that implies a low entry cost for short V6 clips. The jump from V6 to C1 is real but not
