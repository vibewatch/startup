      - number: '1.3'
        title: Capital base, user-scale claims, and operating maturity signals
        blocks:
          - type: paragraph
            body: >-
              PixVerse's financing history shows accelerating investor conviction. The September 2025 Series B brought
              in $60 million led by Alibaba, then March 2026 added a unicorn-marking Series C led by CDH Investments,
              and July 2026 extended that Series C to a company-reported $439 million total. That investor roster mixes
              financial capital with strategic channels in media, technology, and Asian distribution, which is
              supportive for global expansion but also raises future concentration questions. Public traction signals
              are strong but heterogeneous. Company statements moved from more than 100 million users and 175 countries
              by late 2025 to more than 150 million users and 177-plus countries by July 2026, while TechCrunch reported
              over 15 million monthly active users and the March 2026 company release claimed 16 million. The
              app-download page adds 50 million-plus downloads and 4.41 million reviews. Together, these numbers suggest
              real scale and broad consumer reach, but they still stop short of the data an investor would need to
              underwrite revenue quality or efficient monetization.
