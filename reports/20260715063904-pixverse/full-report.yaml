      - number: '7.6'
        title: Mitigation, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              PixVerse does have public mitigations, but they are stronger as directional evidence than as
              underwriteable control proof. Community guidelines create a visible enforcement ladder, KAGAMI Gate adds
              rights controls for licensed campaigns, and the Commission's code of practice offers a path for
              AI-labeling compliance if PixVerse chooses to sign or mirror it. The problem is that the company has not
              publicly paired those controls with the trust artifacts investors would want, such as incident SLAs,
              certification scope, complaint metrics, or audited takedown performance. That makes monitoring especially
              important. A thesis-break event would be concrete rather than theoretical: failure to comply with U.S. or
              EU takedown and labeling obligations; a serious moderation scandal involving realistic harmful or
              infringing content; evidence that Alibaba accounts for a disproportionate share of enterprise bookings; or
              inability to disclose monetization and cohort data in diligence. These are monitorable, not philosophical,
              triggers. The right diligence posture is therefore neither dismissal nor panic, but a demand for a real
              trust pack, policy-operational metrics, and a much clearer view into customer economics before treating
              PixVerse's scale as durable rather than fragile.
            claimRefs:
