  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating footprint, and what PixVerse actually sells
        blocks:
          - type: paragraph
            body: >-
              PixVerse should be understood as a fast-scaling AI video platform that is trying to bridge consumer
              virality, creator tooling, and enterprise APIs rather than as a single-feature video toy. The company is
              consistently described in current reporting as Singapore-based, and its own March 2026 financing
              announcement framed the newly established Singapore office as the hub for enterprise sales, partnerships,
              and global market development. That operating stance matters because the company still appears to rely on
              a broader regional footprint across Singapore, Beijing, and Shanghai for execution. Public product
              language also shows unusual scope for a three-year-old company. PixVerse markets consumer and API video
              models, professional workflow models, and real-time world models, while its docs and homepage emphasize
              both creator usability and production-ready enterprise deployment. The result is a company profile that
              mixes social-media scale with an explicit push into business workflows and interactive entertainment,
              which is more ambitious than a standard text-to-video startup positioning.
