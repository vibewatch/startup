        title: 'Segmentation: creator-first distribution with an enterprise overlay'
        blocks:
          - type: paragraph
            body: >-
              PixVerse's public customer picture is broad but unevenly disclosed. The clearest visible base is consumer
              and prosumer creators who discover the product through the mobile app, the web product, and
              creator-community surfaces, then use text-to-video, image-to-video, and template-led workflows for
              short-form content. On top of that sits the structured Creator Partner Program, which selects creators
              with at least 1,000 followers, active PixVerse usage, and regular posting behavior, effectively turning a
              subset of power users into semi-managed accounts with credits, beta access, technical support, and
              paid-collaboration potential. A third segment is marketers, agencies, and small studios that need quick
              commercial clips rather than full broadcast pipelines, a use case supported by both official positioning
              and third-party reviews. Finally, PixVerse is explicitly pushing an enterprise/API layer: TechCrunch
              reports an Alibaba deployment, the Singapore office is tasked with enterprise sales, and the platform site
              markets a production-ready API stack. The result is a mixed customer base in which creator adoption is
              highly visible, but the actual payer mix between consumers, teams, and enterprises is not publicly broken
              out.
