  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry view
        blocks:
          - type: paragraph
            body: >-
              PixVerse merits a track / research-more recommendation rather than a buy. The bullish case is not
              imaginary: the company just closed a fresh financing event at a valuation above $2 billion, it has amassed
              more than 150 million registered users with roughly 15 million monthly active users, and it now markets a
              broad product stack that reaches from consumer generation to professional tools and real-time world
              models. Those are real assets, and they explain why capital has continued to flow despite a hostile
              competitive field. The problem is price discipline. Public evidence still does not disclose revenue, ARR,
              paying-user count, gross margin, or financing terms, so the current mark cannot be tied to a verified
              earnings base. That forces investors to treat the company as an option on future monetization rather than
              a proven cash-flow asset. In that posture, the right stance is stretched-but-interesting: stay engaged,
              request the data room, and upgrade only if monetization proof catches up to valuation momentum.
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV011
              - CV034
