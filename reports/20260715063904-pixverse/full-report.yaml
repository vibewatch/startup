  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      PixVerse's journey starts with low-friction creator discovery, then branches into creator-program deepening,
      branded campaigns, and a thinner but explicit enterprise path.
    data:
      nodes:
        - id: discover
          label: Discover
          detail: >-
            Users find PixVerse through the app stores, Product Hunt, social content, and official news around R1, V6,
            and partnerships.
          tone: positive
        - id: first-create
          label: First creation
          detail: Mobile and web users create short-form videos with templates, text-to-video, or image-to-video tools.
          tone: positive
        - id: community
          label: Community / CPP
          detail: >-
            Power users can join the Creator Partner Program for credits, support, and visibility if they keep
            publishing PixVerse work.
          tone: positive
        - id: public-proof
          label: Public proof
          detail: >-
            Named outcomes appear through creators like Daria Grin and Zenith Apex and through partnerships such as UN
            AI for Good and Captain Tsubasa.
          tone: positive
        - id: enterprise
          label: Enterprise deployment
          detail: >-
            The explicit enterprise path runs through the API platform, the Singapore sales office, and the publicly
            named Alibaba deployment.
          tone: neutral
        - id: friction
          label: Billing / support friction
          detail: >-
            Secondary reviews warn that non-rolling credits, cancellation confusion, and support response quality can
            interrupt repeat paid usage.
          tone: warning
    claimRefs:
      - CU004
      - CU006
      - CU008
      - CU016
      - CU018
      - CU020
      - CU021
      - CU029
      - CU035
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: wide
    summary: >-
      The observable funnel is huge at the top, but public evidence thins materially when moving from users to named
      deployments and monetized accounts.
    data:
      items:
        - label: Registered users
          value: 150000000
          tone: positive
          detail: TechCrunch and AI Insider report 150M+ registered users as of July 2026.
        - label: Monthly active users
          value: 15000000
          tone: positive
          detail: TechCrunch and AI Insider report 15M+ monthly active users.
        - label: Mobile installs
          value: 50000000
          tone: positive
          detail: Official app-download page and androidrank both support a 50M+ Android install base.
        - label: Named public proof entities
          value: 5
          tone: warning
          detail: >-
            Publicly named proofs in this chapter are Alibaba, Daria Grin, Zenith Apex, UN AI for Good, and Captain
            Tsubasa / KAGAMIAI.
    approximationNotes: >-
      This is an evidence funnel, not a strict revenue funnel: registered users, MAU, and installs come from different
      but related surfaces, while the final stage counts only the named proof entities this chapter could verify
      publicly.
