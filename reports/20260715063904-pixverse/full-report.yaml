  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape structure: direct model rivals, workflow suites, and ecosystem incumbents'
        blocks:
          - type: paragraph
            body: >-
              PixVerse is not competing against one clean peer set. At the direct-model layer it faces Runway, Kling,
              Veo, Seedance, Pika, and Luma. At the workflow-suite layer it faces tools that wrap generation inside
              broader editing, collaboration, or agent experiences, which is where Runway and Luma look strongest today.
              At the ecosystem layer it runs into Google, ByteDance/CapCut, and Kuaishou, all of which can route massive
              existing user bases toward their video models without needing the same customer-acquisition motion as a
              standalone startup. Finally, the status quo is not empty space; many buyers can still solve the job with
              internal teams, traditional production, or selective AI augmentation rather than full platform commitment.
              RCTV and Rangy are useful precisely because they refuse to name a universal winner. Instead they show a
              market where buyers increasingly route by use case: realism, editing, character consistency, consumer
              effects, or interactive-video ambition. That makes PixVerse's position more credible than a
              one-dimensional benchmark race but also harder to defend through a single product message.
            claimRefs:
              - CP001
              - CP030
              - CP031
              - CP033
              - CP034
