      - number: '8.2'
        title: Why public evidence stops short of a buy
        blocks:
          - type: paragraph
            body: >-
              PixVerse clearly has monetization surfaces, but the public record shows structure rather than output. The
              company documents credit-based pricing, concurrency tiers, self-serve and enterprise API plans, and a
              model ladder that distinguishes mainstream video creation from higher-value workflows. That is enough to
              show the company is not pre-revenue in design. It is not enough to prove that the current >$2 billion
              valuation is supported by durable economics. None of the retained July 2026 financing announcements
              disclosed revenue or ARR, and no retained public source disclosed gross margin, burn, or runway. Those
              omissions matter more here than they would in a smaller seed company because PixVerse has already crossed
              into unicorn pricing territory. The lack of public cap-table or preference disclosure compounds the
              problem: investors know the headline mark, but not the protection terms beneath it. The result is a
              recommendation framework anchored on proof gaps, not just on market enthusiasm.
            claimRefs:
              - CV008
