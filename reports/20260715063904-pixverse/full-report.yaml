      - number: '3.4'
        title: Moat durability depends more on distribution and trust than on a narrow quality edge
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence-backed moat risk for PixVerse is ecosystem power. Google can distribute Veo through
              Gemini and enterprise relationships. ByteDance can channel Seedance through CapCut. Kuaishou can back
              Kling with capital and massive short-video roots. Runway has already built a deep editing workflow and
              claims tens of millions of creatives. Against that backdrop, PixVerse's current advantages are real but
              selective: it is price-competitive, benchmark-credible, and differentiated on real-time world models. The
              problem is that falling price floors, rising model convergence, and inconsistent public compliance
              disclosure make it hard to convert a feature edge into a durable moat by itself. The post-Sora market
              described by Digital Applied is healthier because weak business models are being exposed, but that same
              discipline raises the bar for everyone. PixVerse therefore needs to win on workflow integration,
              enterprise trust, and fast world-model commercialization before larger ecosystems close the gap or route
              around its current strengths.
