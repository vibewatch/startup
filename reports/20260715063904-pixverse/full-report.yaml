      - number: '8.3'
        title: Scenario underwriting and valuation range
        blocks:
          - type: paragraph
            body: >-
              Because PixVerse does not disclose revenue, scenario analysis is the only honest way to discuss valuation.
              The bear case assumes consumer paid conversion stays weak, R1 remains strategically interesting but
              commercially early, and AI-video multiples compress further under the kind of compute-cost warning
              highlighted by Sora's shutdown. That combination supports a down-round or markdown band around roughly
              $1.0-1.6 billion. The base case assumes existing user scale holds, enterprise/API monetization broadens
              incrementally, and the company continues to finance itself without a major operating or regulatory shock;
              on that path, value clusters near roughly $1.8-2.4 billion, or around today's headline mark. The bull case
              requires genuine monetization leverage: better conversion from 15 million MAU, evidence that world-model
              products can attract commercial spend, and enough enterprise expansion to make PixVerse look more like a
              scaled platform and less like a high-engagement creator app. If those proofs arrive, a roughly $3.2-4.5
              billion range becomes plausible.
            claimRefs:
              - CV031
