          - type: callout
            title: Require a trust pack and concentration schedule before underwriting
            body: >-
              Before treating PixVerse as an investable enterprise platform rather than a fast-growing creator app,
              request four items: takedown and labeling KPI history, security / incident assurance materials, customer
              concentration including Alibaba, and paying-user / margin / cohort metrics. Without those, most of the
              chapter's top risks remain only partially bounded.
