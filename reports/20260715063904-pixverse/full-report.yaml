companyProfile:
  summary: >-
    PixVerse is a Singapore-based AI video generation startup founded in 2023 by Changhu Wang and Jaden Xie. The company
    combines consumer and API video generation, professional creative workflows, and an R-Series real-time world model
    aimed at gaming and interactive entertainment. By July 2026, public financing coverage described PixVerse as serving
    more than 150 million registered users with roughly 15 million monthly active users, while its latest Series C
    extension lifted the company to a valuation above $2 billion.
