        title: Product stack now spans creator video, professional workflows, and real-time worlds
        blocks:
          - type: paragraph
            body: >-
              PixVerse's public product story has become notably more structured over the past year. The homepage and R1
              materials make clear that the company is not trying to do everything with one undifferentiated model.
              Instead, it segments around job to be done: V-series models for standard video generation, C1 for more
              film-like and storyboarded professional work, and R1 for continuous interactive worlds. The docs
              capability matrix reinforces that this is not mere marketing language. It shows explicit model-level
              support across text-to-video, image-to-video, transition, reference-to-video, and extension workflows,
              while also separating standalone endpoints such as restyle, modify, mimic, and lip sync. That modularity
              matters because it tells buyers and developers how PixVerse expects the stack to be used. It also hints at
              product strategy: the company is trying to own both the finished-asset workflow and the newer
              stateful-interaction workflow rather than forcing one model to cover every use case poorly.
