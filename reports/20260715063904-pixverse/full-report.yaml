  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      PixVerse stays at track because real scale and fresh capital feed the thesis, while disclosure gaps and sector
      economics cap conviction at the current price.
    approximationNotes: This flow is qualitative and maps the underwriting chain from public evidence to recommendation as of 2026-07-15.
    data:
      nodes:
        - id: scale
          label: User scale
          detail: 150M+ registered users and ~15M MAU
          type: input
        - id: product
          label: Product breadth
          detail: V-Series, C-Series, and R1 world-model line
          type: input
        - id: capital
          label: Fresh capital
          detail: $439M extension and >$2B post-money mark
          type: input
        - id: gap
          label: Disclosure gap
          detail: No public revenue, ARR, gross margin, or preference stack
          type: process
        - id: risk
          label: Sector caution
          detail: Sora shutdown and aggressive competitor funding
          type: process
        - id: decision
          label: Recommendation
          detail: Track / research-more; stretched valuation stance
          type: output
      edges:
        - from: scale
          to: decision
          label: supports attention
        - from: product
          to: decision
          label: supports upside
        - from: capital
          to: decision
          label: validates demand
        - from: gap
          to: decision
          label: limits conviction
        - from: risk
          to: decision
          label: caps multiple
        - from: capital
          to: gap
          label: headline exceeds disclosure
    claimRefs:
      - CV001
      - CV006
      - CV011
      - CV031
      - CV039
      - CV040
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Value sensitivity shows that proof of monetization and enterprise breadth are the biggest upside levers, while
      disclosure failure and sector compression are the biggest downside levers.
    approximationNotes: Bars are directional deltas in USD millions around the current >$2B anchor and are not additive.
    data:
      items:
        - label: Audited revenue disclosure confirms strong monetization
          value: 800
        - label: Enterprise breadth extends beyond Alibaba
          value: 500
        - label: R1 commercial adoption becomes visible
          value: 400
        - label: Paid conversion remains weak
          value: -350
        - label: Sector multiple compression after economics shock
          value: -500
        - label: Future round discloses weaker economics or tougher terms
          value: -700
    claimRefs:
      - CV007
      - CV031
      - CV041
      - CV042
      - CV048
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Bear, base, and bull ranges show PixVerse clustered near today's mark in the base case, with downside if economics
      disappoint and upside if monetization catches up to engagement.
    approximationNotes: >-
      Ranges are editorial valuation estimates in USD billions derived from scenario assumptions rather than a full
      financial model.
    data:
      items:
        - label: Bear case valuation
          low: 1
          base: 1.3
          high: 1.6
          unit: $B
        - label: Base case valuation
          low: 1.8
          base: 2.1
          high: 2.4
          unit: $B
        - label: Bull case valuation
          low: 3.2
          base: 3.8
          high: 4.5
          unit: $B
    claimRefs:
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scoring supports a watchlist posture: the market and product are attractive, but evidence quality,
      downside protection, and price discipline are weaker.
    approximationNotes: Scores use a 1-10 editorial scale based on retained public evidence as of 2026-07-15.
    data:
      items:
        - label: Market attention
          value: 8
          unit: /10
          note: AI video remains strategically important and still attracts large funding rounds.
        - label: Product differentiation
          value: 7
          unit: /10
          note: R1 adds differentiated optionality beyond standard creator-video tools.
        - label: User proof
          value: 8
          unit: /10
          note: 150M registered users and ~15M MAU show real distribution.
        - label: Economics transparency
          value: 3
          unit: /10
          note: Revenue, gross margin, and burn are undisclosed publicly.
        - label: Comparable support
          value: 5
          unit: /10
          note: Runway and Kling are helpful but not clean one-to-one valuation comps.
        - label: Entry discipline
          value: 4
          unit: /10
          note: Price is fresh, but evidence quality lags the current headline mark.
    claimRefs:
      - CV006
      - CV015
      - CV039
      - CV040
      - CV050
