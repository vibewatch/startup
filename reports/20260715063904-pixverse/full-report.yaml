              different economic bracket. Public comparators show the category-wide challenge. Atlas Cloud, Artificial
              Analysis, and the company's own pricing surfaces all frame different effective prices depending on access
              route, benchmark assumptions, and model settings. That variation is itself important: in AI video, the
