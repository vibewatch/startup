              gross margin, burn, runway, or paying-user count, even though the company is now priced and funded like a
              late-stage platform bet. That gap matters more in AI video than in many software categories because
              compute economics can destroy an apparently healthy top-line story. Sora's 2026 collapse is the most
              visible cautionary example: demand and hype were real, yet unit economics were unsustainable. PixVerse may
              not share that exact profile, but the category-wide price floor is falling and major rivals are forcing
              more aggressive competition on both quality and cost. The consequence for diligence is straightforward.
