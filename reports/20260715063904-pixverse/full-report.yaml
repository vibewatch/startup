          - type: callout
            title: Sora's collapse makes PixVerse's monetization opacity more dangerous than its growth story implies
            body: >-
              PixVerse may not share Sora's economics, but the category has already shown that stunning outputs and
              viral usage can coexist with broken compute-unit economics. Because PixVerse does not disclose paying
              users, revenue, margin, or burn, investors cannot assume that its scale converts cleanly into sustainable
              economics.
            calloutType: risk
            claimRefs:
              - CR028
