            title: Kling proves monetization is possible, not that PixVerse has achieved it
            body: >-
              Kuaishou's public revenue disclosure for Kling is strategically important because it shows AI-video can
              monetize, while simultaneously making PixVerse's non-disclosure more glaring.
            calloutType: insight
