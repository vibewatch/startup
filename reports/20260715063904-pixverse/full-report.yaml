      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulation is moving faster than PixVerse's public trust surface
            body: >-
              PixVerse now sits inside a U.S. 48-hour takedown regime and an EU deepfake-labeling regime, yet its public
              materials still lack a visible trust center, status page, certification scope, or operational compliance
              metrics. That mismatch is manageable only if diligence uncovers a much stronger private trust pack than
              the public web suggests.
