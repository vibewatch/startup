        Covers the most decision-relevant private and public valuation anchors available from retained public sources as
        of 2026-07-15; it is not a complete comp set for every creative-software or AI infrastructure company.
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - PixVerse
        - Latest private mark
        - '>$2B post-money after $439M Series C extension'
        - Direct current entry point under review
        - No public revenue or preference disclosure
      - - Runway
        - Latest private mark
        - ~$5.3B valuation after $315M February 2026 round
        - Closest scaled private AI-video peer
        - Still private and not a perfect economic disclosure comp
      - - Kuaishou / Kling
        - Public parent market cap + disclosed AI-video revenue
        - ~$23.77B market cap; Kling Q4 2025 revenue RMB340M
        - Shows monetization is possible at scale and backed by capital
        - Kling sits inside a much larger listed ecosystem
      - - Alphabet / Veo
        - Public ecosystem reference
        - ~$4.36T market cap with current 2025 10-K filing
        - Sets the upper bound of platform balance-sheet power
        - Veo is a feature in a giant portfolio, not a pure-play comp
      - - Adobe / Firefly
        - Public creative-software reference
        - ~$91.66B market cap with SEC filing anchor
        - Useful for creative-workflow value context and disclosure discipline
        - Adobe is broader software, not a standalone AI-video company
    notes: >-
      The comp set is used to frame relative scale and disclosure quality rather than to force a false direct multiple
      onto PixVerse.
    claimRefs:
      - CV001
      - CV015
      - CV017
      - CV018
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV046
      - CV047
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue disclosure disappoints
        - Private diligence shows far lower monetization than market narrative implies
        - Breaks the core assumption that user scale is converting into enterprise or paid demand
        - Move from track to pass or demand a lower entry price
      - - Future round resets pricing
        - A new financing round prices materially below the current >$2B mark
        - Confirms that current valuation was not durable
        - Treat as a down-round signal and re-underwrite from the new reference
      - - R1 fails to commercialize
        - World-model usage remains product theater without enterprise spend
        - Removes a key upside leg in the bull thesis
        - Value PixVerse more like a crowded creator-video app
      - - Concentration proves acute
        - Alibaba or a small number of accounts drive most credible enterprise demand
        - Compresses multiple support and increases counterparty risk
        - Require customer breadth before sizing exposure
      - - Sector cost or policy shock hits AI video
        - Compute economics or regulation materially worsen category sentiment
        - Compresses multiple support across the whole peer set
        - Delay entry or increase downside haircut
    notes: Kill criteria are monitorable events that would change the investment call, not generic operating risks.
    claimRefs:
      - CV007
      - CV031
      - CV042
      - CV048
      - CV049
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue and ARR
        - Current revenue, ARR, growth, payer count, and cohort retention
        - Without it, the >$2B mark cannot be benchmarked against real output
        - Request CFO or board KPI package
      - - Gross margin and burn
        - Compute cost, gross margin by product line, and burn/runway
        - Needed to judge downside protection and capital intensity
        - Request finance model and infrastructure spend bridge
      - - Enterprise breadth
        - Named non-Alibaba enterprise customers, ACV bands, renewal evidence
        - Needed to test concentration and B2B durability
        - Request customer list and contract summary
      - - R1 commercialization
        - Usage, pricing, and pipeline for world-model products
        - Needed to decide whether the upside thesis is real or aspirational
        - Request product P&L and pipeline by vertical
      - - Cap table and preferences
        - Liquidation preferences, pro-rata rights, dilution, and governance terms
        - Headline valuation may overstate value available to new common-equity investors
        - Request term sheet and cap-table waterfall
      - - Regulatory and content risk preparedness
        - Evidence that moderation, provenance, and takedown operations can scale with growth
        - Needed because a policy shock can hit both revenue and valuation
        - Cross-check with risk-chapter diligence list
    notes: These asks define the shortest path from a track recommendation to a true underwriting decision.
    claimRefs:
      - CV011
      - CV012
      - CV041
      - CV048
      - CV050
