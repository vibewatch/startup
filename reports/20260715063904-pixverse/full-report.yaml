  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue surfaces are visible even though revenue is not
        blocks:
          - type: paragraph
            body: >-
              PixVerse provides unusually concrete documentation on how customers buy compute and capability, even while
              refusing to publish the financial output of that system. The company separates consumer web access from
              API memberships, sells credits against explicit model and resolution schedules, gates throughput through
              membership-based concurrency, and offers custom enterprise plans with higher limits and negotiated
              discounts. Those mechanics imply at least four monetization surfaces: consumer subscriptions or credits,
              self-serve API credits, enterprise custom plans, and newer premium workflows tied to higher-value models
              such as C1 or eventually world-model products. What remains absent is the thing investors actually want:
              how much money these surfaces produce and under what margin profile. The takeaway is that PixVerse is not
              pre-revenue in structure; it has a real pricing system and a real packaging ladder. But the public record
              supports only the shape of the revenue model, not its current scale or quality.
