      - number: '2.4'
        title: The demand drivers are strong, but economics and measurement still constrain the category
        blocks:
          - type: paragraph
            body: >-
              The positive case for AI video is easy to see: faster production, lower cost, creative versioning at
              scale, and expanding advertiser comfort with machine-generated assets. PixVerse itself claims meaningful
              enterprise ROI, and third-party summaries point to large time and cost reductions versus traditional
              filming. But the harder question is whether these adoption signals translate into durable, profitable
              market structure. The 2026 Sora shutdown is the clearest warning shot. Digital Applied and VoxBooster both
              frame the market as one where demand can be real while economics remain brutal for undifferentiated or
              under-monetized vendors. Pricing pressure is also rising as video generation gets benchmarked on cost per
              minute or even cost per second, while public market reports still cannot isolate a clean SAM or SOM for
              world-model products. The right conclusion is therefore constructive but guarded: PixVerse is entering a
              category with real growth and buyer urgency, yet one that remains noisy in measurement, aggressive in
              competition, and unproven in its newest interactive segments.
