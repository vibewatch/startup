      - number: '3.3'
        title: Pricing and packaging show multi-homing pressure rather than lock-in
        blocks:
          - type: paragraph
            body: >-
              Public pricing reinforces how difficult durable lock-in may be in AI video. Runway starts with clear
              seat-and-credit plans, Kling uses a mix of subscription and cost-per-second logic, Veo spans free access
              through premium and API tiers, Luma exposes explicit credit ladders, and PixVerse publicly advertises a
              low headline API price on its home page. Artificial Analysis adds a useful reality check: depending on the
              model and resolution, ranking leaders and price leaders do not line up perfectly. PixVerse V6 is priced
              more aggressively than Veo 3.1 and roughly in the same broad zone as high-volume alternatives, but Kling,
              Veo Lite, or bundled consumer access points can undercut or reframe the decision. Because buyers can test
              multiple providers through APIs, free tiers, or lightweight creator subscriptions, switching costs remain
              lower than they look from marketing pages. The market is therefore prone to multi-homing: teams can use
              one tool for editing, another for realism, another for social effects, and still keep PixVerse for
              stylized or world-model use cases.
