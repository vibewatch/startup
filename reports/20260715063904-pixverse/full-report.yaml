  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      PixVerse's public proof rows differ most on outcome specificity and concentration: creator and partnership
      evidence is visible, but retention visibility is absent and enterprise proof remains narrow.
    data:
      columns:
        - Production maturity
        - Outcome specificity
        - Retention visibility
      rows:
        - label: Alibaba
          values:
            - label: high
              tone: positive
              detail: Independent reporting describes an existing deployment agreement.
            - label: medium
              tone: neutral
              detail: Deployment is named, but spend and scope are not disclosed.
            - label: none
              tone: negative
              detail: No contract term, renewal, or expansion data is public.
        - label: Daria Grin
          values:
            - label: high
              tone: positive
              detail: Public creator outcome built with named PixVerse tools.
            - label: high
              tone: positive
              detail: '>20M views is a specific audience outcome.'
            - label: low
              tone: warning
              detail: No spend, tenure, or repeat-usage economics are disclosed.
        - label: Zenith Apex
          values:
            - label: high
              tone: positive
              detail: Named creator example tied to PixVerse workflow features.
            - label: medium
              tone: positive
              detail: '>2M viewers is specific but vendor-published.'
            - label: low
              tone: warning
              detail: No evidence on account longevity or monetization.
        - label: UN AI for Good / Captain Tsubasa
          values:
            - label: medium
              tone: neutral
              detail: Live 2026 partnerships and campaigns are visible.
            - label: medium
              tone: neutral
              detail: Public outcomes are strategic and brand-oriented more than financial.
            - label: none
