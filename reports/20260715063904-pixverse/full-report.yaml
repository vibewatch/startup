      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: track / research-more'
            body: >-
              Fresh financing, real user scale, and differentiated world-model positioning are enough to keep PixVerse
              on the active watchlist, but not enough to justify a buy without revenue and term-sheet disclosure.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV040
