    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      Customers move from selecting the right model family to generation, editing, and distribution depending on the
      workflow.
    data:
      nodes:
        - id: brief
          label: Prompt / creative brief
        - id: choose
          label: Choose V6, C1, or R1
        - id: generate
          label: Generate / iterate
        - id: edit
          label: Use endpoints or effects
        - id: deploy
          label: Publish, integrate, or interact live
      edges:
