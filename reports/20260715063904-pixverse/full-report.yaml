      - number: '3.2'
        title: Capability differentiation increasingly depends on workflow fit, not only model score
        blocks:
          - type: paragraph
            body: >-
              The capability story has fragmented into jobs to be done. Runway is less compelling because of one raw
              model metric than because it combines generation with an editing-centered creative suite and a large
              installed base of creators. Kling markets high-end multimodal capability and production-grade quality with
              an enterprise-style API surface. Veo leans into realism, native audio, and the advantages of Google's
              platform footprint. Seedance benefits from ByteDance's distribution and from benchmark strength on
              character consistency, while Luma is moving the conversation toward creative agents and collaborative
              workflows. Pika looks most differentiated in accessible short-form creativity rather than in enterprise
              posture. PixVerse sits somewhere between the consumer and professional poles: it has competitive benchmark
              pricing, broad creator reach, and a world-model narrative that most rivals cannot yet match directly. The
              challenge is that benchmark quality is converging fast enough that workflow breadth, distribution, and
              trust now matter as much as raw output quality.
