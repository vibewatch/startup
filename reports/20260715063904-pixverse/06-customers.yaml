    {
      "id": "adoption-trajectory",
      "title": "Adoption trajectory: massive top-of-funnel, with stronger mobile than revenue disclosure",
      "body": "PixVerse's public adoption footprint is large by private-startup standards. TechCrunch and AI Insider both report more than 150 million registered users and 15 million monthly active users as of July 2026, while PixVerse's own March communication described 16 million MAU and 2.1 billion cumulative videos generated. The best independently checkable usage surface is mobile: PixVerse's own app-download page shows 50 million-plus downloads and 4.41 million reviews, while androidrank independently reports 4.49-ish user satisfaction, 56.9 million estimated installs, and a move from 10 million installs in April 2025 to 50 million by February 2026. That install curve suggests customer acquisition accelerated sharply before the latest financing round rather than after it. Community traction also appears visible in launch behavior: the V6 release reached #2 Product of the Day on Product Hunt with 252 upvotes and 39 comments. What remains missing is the denominator that matters most for diligence -- how many of these users pay, how many are truly active creators versus dormant accounts, and how much of the usage sits in enterprise rather than self-serve channels.",
      "claimRefs": [
