    {
      "id": "retention-satisfaction-and-concentration",
      "title": "Retention, satisfaction, and concentration: enough signals to care, not enough to underwrite",
      "body": "Public durability evidence is mixed. On the positive side, PixVerse has designed an explicit stickiness loop around creators: CPP applications are reviewed on a rolling basis, benefits can be paused after more than three months of inactivity, and higher tiers unlock more credits, exposure, and direct support. That suggests PixVerse actively manages and rewards repeat usage among influential creators. App-store metrics are also directionally positive, with millions of reviews and a 4.48 Android rating on androidrank. But this is not the same as SaaS retention disclosure. No public source in this chapter provides NRR, GRR, churn, renewal rates, contract length, or even a paying-user count. The main adverse signal comes from secondary review coverage that aggregates complaints about unexpected charges, confusing cancellation, non-rolling credits, and poor support responsiveness. Concentration risk is also hard to dismiss: Alibaba is both investor and the only specifically named enterprise deployment in the independent reporting examined here. The chapter's bottom line is that PixVerse likely has real usage depth, but public evidence is not sufficient to score customer quality or revenue durability with high confidence.",
