    {
      "id": "named-customer-proof",
      "title": "Named proof: creator outcomes and branded partnerships are clearer than enterprise logos",
      "body": "PixVerse does have public named customer proof, but most of it sits outside the classic SaaS case-study mold. The strongest creator evidence comes from the UN AI for Good partnership announcement, where PixVerse names Daria Grin and Zenith Apex and gives outcome metrics: more than 20 million views for Daria's shorts and more than two million YouTube viewers for Zenith Apex's work. Those are real audience outcomes, but they do not reveal spend, retention, or contract structure. Branded and institutional proof is also visible. PixVerse partnered with the UN AI for Good Global Summit for a second consecutive year, hosted a workshop, and supported the film festival, while two Captain Tsubasa announcements show both a fan-facing licensed-template campaign and a deeper KAGAMI Gate PoC integrating TSUBASA IP controls into PixVerse generation. The one clearly named enterprise deployment surfaced in independent reporting is Alibaba. That asymmetry matters: public proof validates consumer reach, creator usefulness, and strategic partnership appeal, yet it still leaves a narrow independently verifiable roster of paying enterprise customers.",
      "claimRefs": [
        "CU004",
