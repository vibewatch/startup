    {
      "id": "regulatory-and-legal-risk",
      "title": "Regulatory and legal risk",
      "body": "The regulatory environment for consumer-facing generative video tightened materially before PixVerse reached unicorn scale. In the United States, the TAKE IT DOWN Act is now law and requires covered platforms to remove nonconsensual intimate depictions, including computer-generated ones, within 48 hours of notice. In Europe, the DSA already requires platforms to minimise risks from illegal and harmful content, while the AI Act and the Commission's 2026 code of practice push providers and deployers toward clear marking, detection, and deepfake labelling under Article 50. Greenberg Traurig's summary matters because it makes explicit that the deepfake labelling duty can apply even without deceptive intent. Against that backdrop, PixVerse's public legal surface shows real controls but not a lot of detail: community guidelines prohibit explicit, violent, illegal, and infringing content, and the terms and privacy policy allocate liability heavily toward users while reserving broad rights to change terms and process user data across borders. The unresolved question is provenance: neither public sources nor PixVerse disclosures explain training-data rights, litigation posture, or how the company will operationalize 2026-era cross-jurisdiction takedown and transparency duties at scale.",
