    "number": 7,
    "title": "Risks",
    "summary": "PixVerse's biggest residual risks are regulatory and economic rather than purely technical: deepfake and AI-transparency rules are tightening across the U.S. and EU while PixVerse's public trust surface remains relatively thin, and the company still discloses almost nothing about paying users, margins, or support SLAs. The Alibaba investor-customer overlap, cross-border Singapore-China operating footprint, and category-level compute economics highlighted by Sora's shutdown all amplify the downside if moderation, monetization, or enterprise execution disappoint."
  },
