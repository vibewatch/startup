    {
      "id": "founders-leadership-and-governance",
      "title": "Founders, leadership signals, and governance transparency limits",
      "body": "The founder narrative is one of PixVerse's clearest strengths. Public sources consistently identify Changhu Wang and Jaden Xie as the co-founders, with Wang bringing deep computer-vision and data-labeling experience from ByteDance and Xie contributing capital-markets and strategic experience from Lighthouse Capital. That combination fits PixVerse's current story: a product-heavy company trying to scale globally while still raising capital from a sophisticated cross-border investor set. There are, however, governance limits in the public record. TNGlobal noted Wang's connection to the Singapore Economic Development Board's founder program, and the company regularly quotes Xie as the public-facing voice on strategy, but PixVerse does not appear to publish a detailed board roster or independent-governance description on the pages reviewed in this run. For a private company now valued above $2 billion and backed by strategic investors such as Alibaba, that omission matters because the next diligence step is less about founder credibility and more about control rights, board oversight, and conflict management.",
