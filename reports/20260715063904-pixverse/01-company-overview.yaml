    {
      "id": "milestones-and-open-questions",
      "title": "Milestones that matter and the key open diligence questions",
      "body": "The 2025-2026 milestone record is what gives PixVerse credibility beyond a flashy funding headline. In less than a year, the company publicly tied together a large Alibaba-led Series B, a Singapore global office, the January 2026 launch of R1, the April 2026 shared-worlds update, a June 2026 Captain Tsubasa licensing partnership, a July 2026 UN AI for Good workshop, and the July 2026 Series C extension plus interactive-entertainment push. Those events show real shipping cadence, brand development, and product-scope expansion. At the same time, the main open questions are still the ones public sources avoid: what percentage of users pay, how revenue tracks against compute burden, which legal entities actually own the IP and operating contracts across Singapore and China, and how strategic investors influence governance. Digital Applied's post-Sora market critique is useful context here: large funding rounds and high user counts do not, by themselves, guarantee durable economics in AI video.",
