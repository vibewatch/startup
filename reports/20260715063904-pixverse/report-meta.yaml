companyProfile:
  summary: >-
    PixVerse is a Singapore-based AI video generation startup founded in 2023 by Changhu Wang and Jaden Xie.
    The company combines consumer and API video generation, professional creative workflows, and an R-Series real-time world model
    aimed at gaming and interactive entertainment. By July 2026, public financing coverage described PixVerse as serving more than
    150 million registered users with roughly 15 million monthly active users, while its latest Series C extension lifted the company
    to a valuation above $2 billion.
  foundedDate: '2023-01-01'
  founders:
    - name: Changhu Wang
      role: Co-founder and CEO
      background: Former ByteDance computer-vision leader associated with visual understanding technology behind TikTok.
      claimRefs: [CO009, CO010]
    - name: Jaden Xie
      role: Co-founder and President
      background: Former executive director at Lighthouse Capital with capital-markets and strategy experience.
      claimRefs: [CO009, CO011]
  foundingLocation: Singapore
  headquarters: Singapore
  productSummary: >-
    AI video generation platform spanning V-Series consumer and API tools, C-Series professional workflows,
    and the R-Series world model for real-time interactive environments.
  customerFocus: >-
    Consumers, creators, marketers, enterprises, and gaming or interactive-entertainment teams seeking AI-generated video
    and related world-model capabilities.
  businessModel: >-
    Hybrid monetization through consumer or creator usage, API credits and plans, enterprise custom contracts,
    and future higher-value world-model or professional workflows.
  stage: Series C
