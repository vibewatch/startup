  claimRefs: [CO001, CO004, CO009, CO010, CO011, CO019, CU002, CV001, CV002]
summary:
  headline: >-
    PixVerse has achieved a >$2B valuation on real product momentum, strong user growth, and world-model optionality,
    but the absence of public revenue disclosure and fierce AI-video competition keep the current mark in track territory.
  overallScore: 6.5
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
