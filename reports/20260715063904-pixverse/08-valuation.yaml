    {
      "id": "comparable-discipline",
      "title": "Comparable discipline",
      "body": "The comparable set argues for discipline rather than for an immediate premium call. Runway is the cleanest private reference: its February 2026 financing set a $5.3 billion valuation, which means PixVerse still trades at a discount to the best-funded top-tier peer. That discount is appropriate because Runway is farther along in capital formation and global brand recognition. Kuaishou and Kling show the opposite lesson. Kuaishou's filings reveal real AI-video monetization and a huge balance sheet, but they also demonstrate the advantage incumbents have when AI video sits inside a large commercial ecosystem. Alphabet and Adobe provide similar ceiling-side references: their market capitalizations and filing quality are enormous, yet Veo and Firefly are feature lines inside broader platforms, not standalone comps. Put differently, PixVerse deserves some premium for user growth and category focus, but it still deserves a discount to the peers with better disclosure, more diversified monetization, or stronger capital bases.",
