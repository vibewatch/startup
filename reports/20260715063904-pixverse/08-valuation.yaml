    {
      "id": "what-would-change-the-call",
      "title": "What would change the call",
      "body": "PixVerse can still earn its way from track to buy, but the upgrade path is evidence-dependent. First, management would need to disclose audited or at least investor-grade revenue information: total revenue, growth rate, payer mix, gross margin, and a bridge between consumer, API, enterprise, and R1-related sales. Second, investors need contract-level proof that the company has more than one lighthouse enterprise account and that Alibaba is not doing disproportionate work in the commercial narrative. Third, the market needs evidence that world-model investment can convert into recurring demand rather than only product excitement. Finally, price protection matters. Without preference-stack disclosure, even a strong company can be a poor entry. The thesis breaks if monetization stalls, if a regulatory or compute shock compresses the sector, or if a future round resets price below the current mark. Until those questions close, the disciplined move is to track closely and underwrite only after diligence.",
