evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: >-
      Public revenue run rate, ARR, paying-user count, and gross-margin disclosure remain absent from the sources
      reviewed.
    whyItMatters: >-
      Without monetization detail, company overview traction can only be underwritten as user scale rather than revenue
      quality or unit economics.
    diligencePath: Request investor deck pages showing payer mix, revenue concentration, and the most recent monthly revenue bridge.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO005
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      No public board roster, committee structure, or independent-governance disclosure was found on the company
      surfaces or financing coverage reviewed.
    whyItMatters: >-
      The board composition matters because Alibaba is simultaneously a strategic investor and enterprise counterparty,
      creating potential influence and concentration issues.
    diligencePath: >-
      Request the current cap table, board observer list, and any reserved-matter schedule from the latest financing
      documents.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount-breakdown
    missingEvidence: >-
      Public reporting gives only a combined employee estimate and office list, not function-by-function or city-by-city
      staffing.
    whyItMatters: >-
      The operating split determines whether PixVerse is primarily research-heavy, sales-heavy, or still centered on
      mainland engineering teams despite Singapore branding.
    diligencePath: Request an org chart or current employee census by location and function.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: user-scale-vintage
    missingEvidence: >-
      User metrics appear in multiple vintages: 100M users/175 countries by Sep 2025, 150M users/177 countries by Jul
      2026, and 15M versus 16M MAU.
    whyItMatters: >-
      These differences are directionally positive but they complicate any attempt to infer conversion, retention, or
      growth cadence without a common reporting basis.
    diligencePath: >-
      Ask management for a month-by-month user KPI sheet defining registered users, MAU, downloads, and generated videos
      on a consistent basis.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 chronology coverage
    missingEvidence: >-
      The milestone chronology is strong for 2025-2026 but still lacks fully sourced pre-Series-B founding, hiring, and
      any legal-entity milestones.
    whyItMatters: >-
      A fuller pre-2025 timeline would help separate genuine product acceleration from retrospective marketing
      compression.
    diligencePath: Request a company-approved historical milestone sheet or archived newsroom export covering 2023-2024.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: world-model-som
    missingEvidence: >-
      No public market report isolates the standalone world-model or interactive-entertainment revenue pool that
      PixVerse is targeting with R1.
    whyItMatters: >-
      Without a segment-specific denominator, any SAM or SOM for PixVerse's interactive thesis is necessarily judgmental
      rather than directly measured.
    diligencePath: >-
      Ask management for internal segmentation of revenue opportunity across creator, enterprise API, and
      interactive-world products.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-estimate-range
    missingEvidence: >-
      Public market reports disagree on exact 2025 and 2026 market bases and use different category boundaries and time
      horizons.
    whyItMatters: These differences matter when investors back-solve share or growth expectations from a valuation model.
    diligencePath: Normalize publisher assumptions before using any single market-size number in scenario work.
    relatedQuestionRefs:
      - QM025
  - type: stale
    severity: minor
    topic: survey-vintage
    missingEvidence: >-
      Several widely cited adoption surveys were fielded in 2025 and projected into 2026 rather than measured directly
      at the 2026 midpoint.
    whyItMatters: The market is moving fast enough that stale survey baselines can overstate or understate real current adoption.
    diligencePath: Prioritize 2026 publisher updates and request fresh advertiser or creator usage telemetry from platform partners.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: missing-source
    severity: material
    topic: standardized-compliance-comparison
    missingEvidence: >-
      Public sources do not expose a uniform security, moderation, or compliance disclosure set across PixVerse, Runway,
      Kling, Veo, Seedance, Pika, and Luma.
    whyItMatters: >-
      Enterprise buyers may care more about uptime, provenance, or safety controls than a small Elo gap, but the public
      record is too inconsistent to score every vendor cleanly.
    diligencePath: >-
      Request each vendor's security packet, moderation controls, provenance features, and enterprise contract
      commitments before final underwriting.
    relatedQuestionRefs:
      - QP021
      - QP025
  - type: missing-source
    severity: material
    topic: customer-and-retention-disclosure
    missingEvidence: Comparable customer-count, retention, and enterprise revenue data are not publicly disclosed across the field.
    whyItMatters: >-
      Without comparable customer-quality metrics, the landscape overweights product demos and underweights the
      durability of demand.
    diligencePath: >-
      Request internal win-loss data, top-customer concentration, and renewal evidence from PixVerse and peers where
      available.
    relatedQuestionRefs:
      - QP025
  - type: conflicting-data
    severity: minor
    topic: valuation-and-scale-bases
    missingEvidence: >-
