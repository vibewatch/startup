      one standardized database.
    whyItMatters: Those differences affect how aggressively investors should benchmark PixVerse against headline peer multiples.
    diligencePath: Normalize peer valuation data against primary fundraising announcements or investor documents where possible.
    relatedQuestionRefs:
      - QP024
      - QP025
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: >-
      No public revenue, ARR, gross margin, or burn-rate figures were found across official or independent sources
      reviewed for this chapter.
    whyItMatters: >-
      Without operating metrics, investors cannot judge whether PixVerse's financing pace is translating into efficient
