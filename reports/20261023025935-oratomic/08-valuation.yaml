company:
  name: Oratomic
chapter:
  number: 8
  title: Valuation
  summary: "Oratomic's reported October financing establishes substantial capital backing but not an underwritable entry: independent reports disagree between $5.4 billion and $5.5 billion for the latest valuation, while public evidence does not disclose ownership, preferences, burn, revenue, or exit terms. The evidence supports research-more with high risk and an expensive-to-unpriceable stance at the reported mark."
sections:
  - id: recommendation-and-entry
    title: Recommendation and entry discipline
    body: >-
      The recommendation is research-more, with low confidence in any price-specific return case and high execution risk. Company-issued and independent reports agree that Oratomic has raised $775 million in total, but the latest valuation is reported inconsistently: The Next Web says $5.4 billion, while SiliconANGLE says $5.5 billion. Neither figure reveals fully diluted ownership, liquidation preferences, option-pool dilution, cash available, or a secondary price. The July $300 million Series A and October $475 million financing demonstrate access to capital, not revenue or investor return. AInvest's adverse framing is directionally appropriate: a private financing funds an engineering program and is not itself a tradable valuation proof. Entry should wait for primary round documents and operating evidence.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV013, CV016]
    tableRefs: [TV001]
  - id: thesis-and-comparables
    title: Thesis, anti-thesis, and comparable context
    body: >-
      The thesis rests on a focused neutral-atom architecture and unusually concentrated scientific ambition. Oratomic says it is building utility-scale fault-tolerant systems using light and atoms; its launch materials describe a roughly 10,000-qubit threshold and cite a 6,000-atom experimental array. Management calls an end-of-decade machine plausible, not guaranteed, and the CEO has acknowledged that the eventual business models and applications remain unknown. Funding comparables are supportive but not valuation equivalents: Entangled Future lists Oratomic tenth by disclosed capital raised, while separately listing private-company valuations from $2 billion to $10 billion for companies with different architectures, ages, financing histories, and commercialization profiles. Those references bracket sector enthusiasm, not Oratomic's intrinsic value.
    claimRefs: [CV005, CV006, CV007, CV008, CV011, CV012]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, downside, and diligence gates
    body: >-
      The bull case requires independent evidence that logical-error performance, manufacturability, and scaling remain on the stated path, followed by paid customer or government demand. The base case is continued research progress funded by the existing capital while commercialization remains deferred; that supports tracking rather than buying at the reported $5.4-$5.5 billion mark. The bear case combines milestone slippage, additional dilution, and sector multiple compression. Gartner's forecast of more than half of quantum startups closing by 2030 is a material adverse signal even as it forecasts sector revenue growth. Public-sector investment validates strategic importance but does not solve engineering risk. Final diligence should require the cap table, preference stack, cash and burn bridge, milestone definitions, independent technical results, customer pipeline, and a credible liquidity route.
    claimRefs: [CV008, CV009, CV010, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
