    title: Recommendation summary
    columns: [Dimension, Evidence-based assessment, Decision implication]
    rows:
      - [Recommendation, research-more, "Defer investment until primary financing and operating evidence is available."]
      - [Confidence, low, "Funding is well reported, but ownership, preferences, cash, burn, and revenue are not."]
      - [Risk rating, high, "The outcome depends on unproven fault-tolerance, manufacturing, commercialization, and financing milestones."]
      - [Valuation stance, "expensive / unpriceable", "The reported $5.4-$5.5B mark cannot be converted into an entry return without security terms and operating forecasts."]
      - [Target return and exit, gap, "No supportable target return, holding period, or exit valuation is available from public evidence."]
    notes: "Judgments distinguish cumulative funding from valuation, cash available, revenue, and investor proceeds; gap means the retained public evidence does not support a quantified value."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV013, CV016]
  - id: TV002
    title: Thesis / anti-thesis and comparable references
    columns: [Argument, Current evidence, What would change the view]
    rows:
      - [Technical thesis, "Company materials describe utility-scale fault tolerance using light, atoms, and reconfigurable neutral-atom arrays.", "Independent logical-error, fidelity, uptime, and manufacturing-yield results."]
      - [Scale thesis, "The company describes a 10,000-qubit threshold and cites a 6,000-atom experimental array.", "A reproducible integrated-system demonstration rather than component-scale evidence."]
      - [Timing thesis, "Management calls an end-of-decade machine plausible but not guaranteed.", "Dated milestones with independent acceptance criteria and on-time delivery."]
      - [Commercial anti-thesis, "The CEO said the future business models and exact applications are not known.", "Named buyers, signed contracts, pricing, and a gross-margin path."]
      - [Funding comparable, "Entangled Future lists Oratomic tenth at $775M raised among companies with firm disclosed totals.", "Comparable security terms, burn, remaining cash, and milestone-adjusted capital needs."]
      - [Valuation comparables, "Entangled Future lists Quantinuum at $10B, SandboxAQ at $5.75B, Xanadu at $3.6B, and Pasqal at $2B.", "Like-for-like revenue, technical maturity, ownership, and transaction-vintage adjustments."]
    notes: "The peer figures are source-labelled private valuation references, not transaction-adjusted multiples; capital raised and valuation are shown as different metrics."
    claimRefs: [CV005, CV006, CV007, CV008, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Independent technical milestones validate the 10,000-qubit architecture; manufacturability and paid demand emerge.", "A premium to the reported $5.4-$5.5B mark could become supportable, but no numeric exit range is presently evidenced.", "Positive only after third-party technical proof and contracted demand.", "Failure to demonstrate integrated fault tolerance or low-cost manufacturing."]
      - [Base, "Research progresses, the company consumes existing funding, and commercialization remains deferred.", "Do not enter at the reported mark without a material risk discount and full security terms; exact range remains a gap.", "Most consistent with disclosed technical ambition and commercial uncertainty.", "Runway shortfall, repeated milestone delay, or preference-heavy financing."]
      - [Bear, "Technical milestones slip, financing conditions tighten, and the forecast sector shakeout reaches neutral-atom developers.", "Down round or impairment is plausible; loss severity cannot be quantified without ownership and preference data.", "Supported by adverse sector-closure and capital-intensity signals.", "More than half of sector startups closing by 2030, applied as a sector warning rather than an Oratomic forecast."]
    notes: "Scenarios are conditional, not probability estimates; unsupported entry, ownership, dilution, and exit quantities remain explicit gaps rather than invented values."
    claimRefs: [CV002, CV003, CV005, CV007, CV008, CV009, CV010, CV013, CV014, CV016]
