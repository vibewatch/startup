companyProfile:
  summary: >-
    Oratomic is a Pasadena-based quantum-computing startup founded around Caltech-linked neutral-atom and
    fault-tolerance research. It is pursuing a utility-scale, fault-tolerant machine rather than an intermediate noisy
    system, with public materials describing reconfigurable atomic qubits and a roughly 10,000-qubit target. Its
    disclosed team is research-heavy and its reported financing is substantial, but no public evidence establishes
    revenue, customers, cash runway, or a demonstrated commercial machine.
