company:
  name: Oratomic
chapter:
  number: 4
  title: Financials
  summary: Oratomic has disclosed substantial venture financing for a long-horizon hardware program, but public evidence does not establish revenue, realized pricing, gross margin, cash balance, burn, or customer contracts. The underwriting case therefore rests on capital sufficiency and technical execution rather than current financial traction.
sections:
  - id: capital-and-financing
    title: Capital raised funds a long, pre-commercial build
    body: Public reporting describes Oratomic as a private company pursuing fault-tolerant quantum computers rather than selling an intermediate product. The October financing brought reported cumulative funding to $775 million, comprising a $475 million Series B after a $300 million Series A. The company says the capital supports scientific and engineering personnel, laboratory infrastructure, and quantum-computing systems. Those disclosed uses are consistent with a capital-intensive research and hardware program, but they do not establish cash available after transaction costs, current burn, remaining runway, debt, liquidation preferences, or whether all reported commitments have closed. The financing chronology is useful context for capital adequacy, not proof that the company can fund delivery through commercialization.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]
  - id: revenue-and-monetization
    title: Revenue model remains an underwriting gap
    body: The strongest available financial evidence points to a company still building a machine, not a business with disclosed recurring revenue. The October release says Oratomic is focused exclusively on building a fault-tolerant quantum computer, while independent coverage quotes the CEO saying the business model and applications were not yet known. This makes SaaS-style ARR, NRR, CAC payback, and sales-efficiency calculations inappropriate without evidence of a commercial offering. Potential future monetization could include access to quantum computing, systems, or partnerships, but those are scenarios rather than reported revenue streams. List pricing, realized pricing, customer contracts, bookings, backlog, and revenue recognition policy remain unavailable.
    claimRefs: [CI006, CI007, CI008, CI009]
    tableRefs: [TI002]
  - id: cost-structure-and-unit-economics
    title: Cost drivers are visible; unit economics are not
    body: "Disclosed funding uses identify the main cost centers as scientific and engineering labor, laboratory infrastructure, hardware fabrication, algorithms, and quantum-computing systems. That makes payroll, specialized equipment, facility build-out, fabrication yield, cryogenic or optical systems, maintenance, and research-cycle duration the likely drivers of cash consumption, but the sources do not quantify any of them. There is no public gross margin, contribution margin, utilization, service-delivery cost, capex schedule, or customer-level economics. The absence of these metrics is material: a large financing balance cannot be translated into runway without a current cash balance and monthly cash-flow data, and funding raised is not cash available."
    claimRefs: [CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: "Financial verdict: financed, not yet underwritable"
    body: Oratomic has enough publicly reported capital to demonstrate investor conviction and to fund a substantial development effort, but the evidence does not support a revenue-quality or margin underwriting conclusion. The latest reported $5.5 billion post-money valuation is a financing mark, not an operating valuation supported by disclosed revenue or cash generation. Independent commentary also emphasizes that the company is private and that the financing reflects engineering costs rather than a liquid public-market investment. The central diligence decision is therefore whether investors can verify the cap table, cash balance, burn, runway, debt and obligations, technical milestones, and a credible path from a working machine to paid usage before another financing trigger.
    claimRefs: [CI001, CI006, CI014, CI015]
    figureRefs: [FI001]
