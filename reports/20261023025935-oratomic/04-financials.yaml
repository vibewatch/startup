    notes: "Null values mean the metric was not disclosed in the assigned evidence; they are not zeros and should not be inferred from funding or technical milestones."
    claimRefs: [CI007, CI008, CI009, CI015]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric or driver, Public value or status, Why it matters, Diligence ask]
    rows:
      - [Cash on hand, null, "Funding raised does not establish current liquidity", "Obtain latest balance sheet and restricted-cash schedule"]
      - [Burn and runway, null, "Cannot infer runway without cash flow and committed spend", "Obtain monthly burn, hiring plan, and runway case"]
      - [Gross margin, null, "Hardware, facilities, and service costs are unquantified", "Obtain unit cost, utilization, and support-cost model"]
      - [Debt and project obligations, null, "Debt, leases, and equipment commitments could reduce runway", "Obtain debt, lease, purchase-order, and covenant schedules"]
    notes: "The retained sources identify cost centers but provide no quantitative operating model; all nulls require primary diligence rather than estimation."
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
