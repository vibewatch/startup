callouts:
  - calloutType: strength
    title: Large disclosed financing base
    body: Reported cumulative financing of $775 million provides evidence of substantial investor commitment to the technical program, although the amount is not equivalent to current cash.
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: Capital adequacy cannot be tested publicly
    body: Cash, burn, runway, debt, and committed capital expenditures are not disclosed in the retained sources, so financing dependency remains a material underwriting blocker.
    claimRefs: [CI010, CI013, CI014]
  - calloutType: recommendation
    title: Require operating-finance evidence before underwriting
    body: Request a current balance sheet, monthly cash-flow forecast, cap table, obligations schedule, commercialization plan, and technical milestone budget before treating the financing as sufficient.
    claimRefs: [CI014, CI015]
