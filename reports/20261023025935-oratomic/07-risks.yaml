company:
  name: Oratomic
chapter:
  number: 7
  title: Risks
  summary: >-
    Oratomic's central risk is converting a theoretical fault-tolerant architecture and unusually large financing into independently demonstrated error correction, manufacturable hardware, and a viable commercial model. Export-control applicability, burn and runway, operating controls, customer demand, and company-specific legal status remain diligence gaps rather than resolved risks.
sections:
  - id: thesis-breaking-risks
    title: Thesis-breaking risks
    body: >-
      Oratomic is pursuing a technically difficult target: a utility-scale, fault-tolerant quantum computer based on reconfigurable neutral-atom arrays. Its launch materials present a 10,000-qubit resource estimate and an end-of-decade ambition, but Entangled Future characterizes the estimate as theoretical and says Oratomic has not published a quantum-error-correction demonstration. The primary break condition is therefore failure to convert the architecture into repeatable logical performance, not a missed publicity milestone. Financing risk is also material: the Wall Street Journal reported $775 million of total funding and a valuation increase from $1.5 billion to $5.4 billion, while SiliconANGLE reported $5.5 billion. That discrepancy is small in percentage terms but reinforces the need to reconcile deal documents, cash received, burn, and runway.
    claimRefs: [CR001, CR002, CR003, CR005, CR006, CR007]
    tableRefs: []
    figureRefs: [FR001]
  - id: legal-regulatory-security
    title: Legal, regulatory, and security exposure
    body: >-
      The legal and regulatory evidence establishes a diligence perimeter, not Oratomic's compliance status. Baker McKenzie describes U.S. export controls covering certain quantum computers under ECCN 4A906 and reporting or licensing conditions for specified quantum software and technology. Whether Oratomic's present systems, source code, technical data, personnel access, or transfers fall within those classifications is not disclosed in the assigned evidence. Separately, Oratomic says a sufficiently capable machine could run Shor's algorithm and put modern cryptography at risk. These facts create export-control, research-security, responsible-deployment, IP, and customer-assurance workstreams. Counsel should map exact classifications and jurisdictions; technical diligence should test access controls, incident response, and IP ownership.
    claimRefs: [CR008, CR009]
    tableRefs: [TR001]
  - id: operating-and-dependency-risks
    title: Operating and dependency risks
    body: >-
      Scaling neutral-atom hardware requires coordinated progress across atom trapping, optical control, error-correction software, packaging, laboratory infrastructure, and specialized scientific hiring. Series A coverage says capital was intended for hardware fabrication, algorithmic research, and physics and hardware teams; the syndicated company release adds laboratory infrastructure and systems. Independent coverage reports a roughly 6,000-atom array as a foundation, but that physical-qubit result is not a published Oratomic error-correction demonstration. Commercialization is equally exposed: SiliconANGLE quotes the CEO saying the business models and exact applications are unknown, while AInvest reports that the company is not pursuing intermediate commercial products or revenue before fault tolerance. This concentrates technical, financing, and demand risk in one long-duration milestone.
    claimRefs: [CR003, CR010, CR011, CR012, CR013, CR014]
    tableRefs: [TR002, TR003]
  - id: diligence-and-kill-criteria
    title: Mitigations, monitoring, and kill criteria
    body: >-
      The evidence supports staged diligence rather than a conclusion that these risks are mitigated. Management should provide a milestone ledger linking cash use to lab capacity, atom-array scale, logical error rates, fabrication yield, and reproducible demonstrations, with raw definitions reviewed independently. Financing diligence should reconcile announced rounds to cash received, preference terms, restrictions, monthly burn, and runway through the next technical gate. Legal diligence should classify hardware, software, technology, personnel access, and cross-border transfers under applicable export rules. Commercial diligence should test customer problems and willingness to pay rather than assuming that scientific utility becomes a business model. Pause the thesis if repeatable QEC progress, milestone-funded runway, classification controls, or credible customer validation cannot be shown.
    claimRefs: [CR009, CR010, CR014, CR015, CR016, CR017]
    tableRefs: []
