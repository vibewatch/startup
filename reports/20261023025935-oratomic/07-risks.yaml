callouts:
  - calloutType: risk
    title: Primary kill criterion
    body: >-
      Treat the roadmap as broken if Oratomic cannot independently demonstrate repeatable fault-tolerant progress at a scale and error rate consistent with its stated architecture, while also disclosing enough cash, burn, and ownership information to show that the next milestone is financeable.
    claimRefs: [CR003, CR015, CR016]
  - calloutType: assumption
    title: Public evidence is not compliance clearance
    body: >-
      The retained sources identify export-control categories and dual-use concerns, but they do not establish Oratomic's classifications, licenses, legal disputes, incident history, or control effectiveness.
    claimRefs: [CR008, CR009]
