  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Oratomic is positioned as high on fault-tolerance ambition but low on disclosed commercialization evidence
      relative to better-documented peers.
    data:
      xAxis: Commercialization evidence (0 = none disclosed, 10 = deployed/revenue evidence)
      yAxis: Fault-tolerance scale ambition (0 = not stated, 10 = explicit large-scale target)
      points:
        - label: Oratomic
          x: 2
          'y': 10
          rationale: Explicit utility-scale fault-tolerant mission, but no customer or revenue evidence in assigned sources
        - label: Infleqtion
          x: 9
          'y': 8
          rationale: Reported deployed products, revenue, government customers, and fault-tolerant roadmap
        - label: PsiQuantum
          x: 5
          'y': 10
          rationale: >-
            Million-qubit fault-tolerant target and major funding, with planned rather than delivered sites in the
            assigned source
        - label: Universal Quantum
