  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Oratomic's proposed path runs from neutral-atom hardware through dynamic control and error correction to
      benchmarked fault-tolerant workloads.
    data:
      layers:
        - label: Workloads and utility
          modules:
            - label: Cryptographically relevant algorithms
              detail: Shor's algorithm is the published motivating workload.
            - label: Scientific workloads
              detail: Materials science, chemistry, physics, and artificial intelligence are cited application areas.
        - label: Logical computation
          modules:
            - label: Error-corrected logical instructions
              detail: Logical operations require physical-qubit overhead and an error budget.
            - label: Resource estimation
              detail: Qubit count and runtime depend on application, architecture, and code assumptions.
        - label: Reconfigurable control
          modules:
            - label: Optical tweezers and atom transport
              detail: Atoms are dynamically rearranged to change connectivity during computation.
            - label: Calibration and classical control
              detail: Control fidelity, decoding, and sustained operation remain integration dependencies.
        - label: Physical substrate
          modules:
            - label: Neutral-atom array
              detail: Individual atoms serve as physical qubits.
            - label: Trapping and measurement
              detail: Loading, retention, gates, readout, and environmental isolation must operate together.
        - label: Operations and validation
          modules:
            - label: Laboratory infrastructure
              detail: Funding disclosures identify laboratory infrastructure as an operating requirement.
            - label: Independent benchmarks
              detail: Utility claims require defined workloads, error budgets, and reproducible measurements.
        - label: Trust and security
          modules:
            - label: Cryptographic transition risk
              detail: A capable fault-tolerant machine could affect vulnerable public-key cryptography.
            - label: Controls and incident response
              detail: Public security, compliance, and incident-control documentation is not disclosed.
    approximationNotes: >-
      Layer order is a conceptual operating model synthesized from public technical descriptions; it does not assert
      that Oratomic has completed each integration.
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE010
      - CE015
      - CE016
  - id: FU001
    title: Evidence-gated customer journey
    type: journey-map
    summary: >-
      The sequence is a diligence framework for a future commercialization path, not evidence of current Oratomic
      conversion or adoption.
    data:
      nodes:
        - id: application-hypothesis
          label: Application hypothesis
          detail: Select a customer problem where fault-tolerant computing could outperform classical methods.
          touchpoints:
            - Scientific use cases
            - economic-value hypothesis
        - id: independent-validation
          label: Independent validation
          detail: Demonstrate a reproducible advantage under external technical assessment.
          touchpoints:
            - Benchmarking center
            - government competition
        - id: system-availability
          label: System availability
          detail: Deliver a working system or controlled access surface for qualified users.
          touchpoints:
            - DOE facility route
            - user infrastructure
        - id: buyer-qualification
          label: Buyer qualification
          detail: Establish security, performance, integration, procurement, and commercial terms.
          touchpoints:
            - Partnership model
            - advance market commitment
        - id: production-workload
          label: Production workload
          detail: Run a named customer workload against agreed acceptance criteria.
          touchpoints:
            - Named deployment
            - verified outcome
        - id: renewal-expansion
          label: Renewal and expansion
          detail: Demonstrate repeat use, renewal, broader workloads, and manageable concentration.
          touchpoints:
            - Retention cohort
            - expansion revenue
    approximationNotes: >-
      This is an evidence sequence, not a time estimate, conversion funnel, or claim that Oratomic has completed any
      stage.
    claimRefs:
      - CU007
      - CU011
      - CU012
      - CU013
      - CU014
