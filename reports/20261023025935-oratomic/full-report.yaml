  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Oratomic's stated product is not a current cloud service or intermediate quantum appliance; it is a
              utility-scale, fault-tolerant quantum computer intended to execute workloads beyond classical machines.
              The company describes reconfigurable neutral-atom arrays as the hardware substrate and advanced quantum
              error correction as the route to reliable computation. Public descriptions connect the target to
              cryptographically relevant workloads, materials science, chemistry, physics, and artificial intelligence,
              but do not identify a paying customer, production deployment, supported interface, service-level
              commitment, or realized performance. The product therefore has a coherent technical destination but no
              publicly evidenced customer workflow from workload intake through production output. The most
              decision-useful distinction is between a published resource estimate and a working machine: the former is
              externally inspectable research, while the latter remains an engineering milestone.
