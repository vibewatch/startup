      - number: '6.2'
        title: Capital and ecosystem activity do not establish product adoption
        blocks:
          - type: paragraph
            body: >-
              Oratomic says its cumulative funding will expand the scientific and engineering team, laboratory
              infrastructure, and systems needed to build its computers. That is evidence of financed capacity, not
              customer-funded demand. Independent reporting says the company plans to skip interim NISQ products, while
              a more skeptical source reports that it is not pursuing intermediate products or revenue. The CEO has also
              acknowledged uncertainty about the eventual business models and exact applications. Meanwhile, BCG
              recorded enterprise proofs of concept and substantial public-sector purchasing across the wider quantum
              market. Those benchmarks demonstrate category interest, but they cannot be transferred to Oratomic as
              accounts, bookings, usage, or revenue.
            claimRefs:
              - CU003
