        title: Commercial proof, durability, and concentration remain open
        blocks:
          - type: paragraph
            body: >-
              The launch evidence was theoretical, and the reviewed sources disclose no active-account count,
              utilization, renewal, churn, NRR, GRR, contract term, expansion revenue, or customer concentration.
              Government initiatives provide a possible route from technical validation to procurement: current policy
              directs delivery of a scientifically useful system to a Department of Energy facility, contemplates
              private-sector partnerships and advance market commitments, and funds competitions and user
              infrastructure. None of those programs is evidence that Oratomic has been selected or purchased. The
              resulting customer journey is milestone-gated and binary: technical validation must precede availability,
