              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE010
              - CE015
              - CE016
      - number: '5.3'
        title: Deployment, trust, and roadmap risks
        blocks:
          - type: paragraph
            body: >-
              Public evidence describes a research-to-engineering program rather than a deployable product. Funding
              announcements say capital is being directed to hardware fabrication, scientific and engineering staff,
              laboratory infrastructure, and the systems needed to build the computer, while outside commentary says
              hardware has not shipped. The end-of-decade objective is explicitly characterized by the CEO as plausible
              but not guaranteed. That wording is consistent with a roadmap exposed to physics and integration
              uncertainty, not a committed delivery date. Trust and safety are also unusually material: the intended
              capability could affect modern public-key cryptography, so security posture must cover both the eventual
              machine and the research and control stack used to build it. Public sources do not establish
              certifications, security controls, uptime, incident history, export controls, or a customer-facing API.
              Independent benchmarking and reproducible resource accounting should precede any claim of product
              maturity.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Published technical thesis
            body: >-
              The 10,000-qubit thesis is tied to an openly accessible technical paper rather than only a roadmap
              statement, giving the product concept a testable analytical basis.
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
              - CE004
          - type: callout
            title: Integration remains unproven
            body: >-
              Public evidence supports important neutral-atom and error-correction ingredients, but not a shipped
              Oratomic machine, production workload, customer deployment, or verified end-to-end benchmark.
            calloutType: risk
            claimRefs:
              - CE007
              - CE010
              - CE016
          - type: callout
            title: Treat architecture claims as milestones
            body: >-
              The next credible product inflection is a reproducible, independently benchmarked integrated system with
              disclosed logical-error, runtime, and workload results.
            calloutType: recommendation
            claimRefs:
              - CE010
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Plausible buyers are visible, but actual accounts are not
        blocks:
          - type: paragraph
            body: >-
              Oratomic presents a future fault-tolerant computer for workloads in materials science, chemistry, physics,
              artificial intelligence, and cryptography. Independent market work points to technology, chemicals and
              agriculture, pharmaceuticals, defense and space, finance, and the public sector as likely beneficiaries of
              error-corrected quantum computing. These categories identify potential users, not Oratomic customers.
              Across the assigned prefetched evidence, there is no named paying account, paid pilot, production
              deployment, customer outcome, price, channel, or commercial access model. The best-supported near-term
              buyer hypothesis is therefore a technically sophisticated institution able to fund lengthy qualification,
              rather than a broad enterprise customer base.
            claimRefs:
              - CU001
