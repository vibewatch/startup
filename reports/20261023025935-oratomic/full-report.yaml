  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Thesis-breaking risks
        blocks:
          - type: paragraph
            body: >-
              Oratomic is pursuing a technically difficult target: a utility-scale, fault-tolerant quantum computer
              based on reconfigurable neutral-atom arrays. Its launch materials present a 10,000-qubit resource estimate
              and an end-of-decade ambition, but Entangled Future characterizes the estimate as theoretical and says
              Oratomic has not published a quantum-error-correction demonstration. The primary break condition is
              therefore failure to convert the architecture into repeatable logical performance, not a missed publicity
              milestone. Financing risk is also material: the Wall Street Journal reported $775 million of total funding
              and a valuation increase from $1.5 billion to $5.4 billion, while SiliconANGLE reported $5.5 billion. That
              discrepancy is small in percentage terms but reinforces the need to reconcile deal documents, cash
              received, burn, and runway.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR009
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
      - number: '7.2'
        title: Legal, regulatory, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory evidence establishes a diligence perimeter, not Oratomic's compliance status.
              Baker McKenzie describes U.S. export controls covering certain quantum computers under ECCN 4A906 and
              reporting or licensing conditions for specified quantum software and technology. Whether Oratomic's
              present systems, source code, technical data, personnel access, or transfers fall within those
              classifications is not disclosed in the assigned evidence. Separately, Oratomic says a sufficiently
              capable machine could run Shor's algorithm and put modern cryptography at risk. These facts create
              export-control, research-security, responsible-deployment, IP, and customer-assurance workstreams. Counsel
              should map exact classifications and jurisdictions; technical diligence should test access controls,
              incident response, and IP ownership.
            claimRefs:
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR008
              - CR009
      - number: '7.3'
        title: Operating and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Scaling neutral-atom hardware requires coordinated progress across atom trapping, optical control,
              error-correction software, packaging, laboratory infrastructure, and specialized scientific hiring. Series
              A coverage says capital was intended for hardware fabrication, algorithmic research, and physics and
              hardware teams; the syndicated company release adds laboratory infrastructure and systems. Independent
              coverage reports a roughly 6,000-atom array as a foundation, but that physical-qubit result is not a
              published Oratomic error-correction demonstration. Commercialization is equally exposed: SiliconANGLE
              quotes the CEO saying the business models and exact applications are unknown, while AInvest reports that
              the company is not pursuing intermediate commercial products or revenue before fault tolerance. This
              concentrates technical, financing, and demand risk in one long-duration milestone.
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR009
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
              - CR017
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.4'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The evidence supports staged diligence rather than a conclusion that these risks are mitigated. Management
              should provide a milestone ledger linking cash use to lab capacity, atom-array scale, logical error rates,
              fabrication yield, and reproducible demonstrations, with raw definitions reviewed independently. Financing
              diligence should reconcile announced rounds to cash received, preference terms, restrictions, monthly
              burn, and runway through the next technical gate. Legal diligence should classify hardware, software,
              technology, personnel access, and cross-border transfers under applicable export rules. Commercial
              diligence should test customer problems and willingness to pay rather than assuming that scientific
              utility becomes a business model. Pause the thesis if repeatable QEC progress, milestone-funded runway,
              classification controls, or credible customer validation cannot be shown.
            claimRefs:
              - CR009
              - CR010
              - CR014
              - CR015
              - CR016
              - CR017
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary kill criterion
            body: >-
              Treat the roadmap as broken if Oratomic cannot independently demonstrate repeatable fault-tolerant
              progress at a scale and error rate consistent with its stated architecture, while also disclosing enough
              cash, burn, and ownership information to show that the next milestone is financeable.
            calloutType: risk
            claimRefs:
              - CR003
              - CR015
              - CR016
          - type: callout
            title: Public evidence is not compliance clearance
            body: >-
              The retained sources identify export-control categories and dual-use concerns, but they do not establish
              Oratomic's classifications, licenses, legal disputes, incident history, or control effectiveness.
            calloutType: assumption
            claimRefs:
              - CR008
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with low confidence in any price-specific return case and high
              execution risk. Company-issued and independent reports agree that Oratomic has raised $775 million in
              total, but the latest valuation is reported inconsistently: The Next Web says $5.4 billion, while
              SiliconANGLE says $5.5 billion. Neither figure reveals fully diluted ownership, liquidation preferences,
              option-pool dilution, cash available, or a secondary price. The July $300 million Series A and October
              $475 million financing demonstrate access to capital, not revenue or investor return. AInvest's adverse
              framing is directionally appropriate: a private financing funds an engineering program and is not itself a
              tradable valuation proof. Entry should wait for primary round documents and operating evidence.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV013
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV013
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable context
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on a focused neutral-atom architecture and unusually concentrated scientific ambition.
              Oratomic says it is building utility-scale fault-tolerant systems using light and atoms; its launch
              materials describe a roughly 10,000-qubit threshold and cite a 6,000-atom experimental array. Management
              calls an end-of-decade machine plausible, not guaranteed, and the CEO has acknowledged that the eventual
              business models and applications remain unknown. Funding comparables are supportive but not valuation
              equivalents: Entangled Future lists Oratomic tenth by disclosed capital raised, while separately listing
              private-company valuations from $2 billion to $10 billion for companies with different architectures,
              ages, financing histories, and commercialization profiles. Those references bracket sector enthusiasm, not
              Oratomic's intrinsic value.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios, downside, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              The bull case requires independent evidence that logical-error performance, manufacturability, and scaling
              remain on the stated path, followed by paid customer or government demand. The base case is continued
              research progress funded by the existing capital while commercialization remains deferred; that supports
              tracking rather than buying at the reported $5.4-$5.5 billion mark. The bear case combines milestone
              slippage, additional dilution, and sector multiple compression. Gartner's forecast of more than half of
              quantum startups closing by 2030 is a material adverse signal even as it forecasts sector revenue growth.
              Public-sector investment validates strategic importance but does not solve engineering risk. Final
              diligence should require the cap table, preference stack, cash and burn bridge, milestone definitions,
              independent technical results, customer pipeline, and a credible liquidity route.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not buy
            body: >-
              The reported valuation cannot be underwritten to a target return until security terms, cash needs,
              commercial proof, and an exit path are disclosed.
