  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer architecture
        blocks:
          - type: paragraph
            body: >-
              The relevant market is quantum-computing hardware, software, and services that generate revenue from
              quantum processors, development platforms, cloud access, consulting, and applications. The Business
              Research Company explicitly defines the market as including hardware, software, services, on-premises and
              cloud deployment, technologies including trapped ions and superconducting qubits, applications such as
              optimization and simulation, and end users including healthcare, financial services, automotive, energy,
              chemicals, and manufacturing. That broad boundary includes adjacent vendors and service revenue that
              Oratomic does not currently disclose an intent to sell. Oratomic's own stated focus is narrower:
              neutral-atom hardware and error-correction architecture for a fault-tolerant machine. The practical status
              quo for buyers therefore includes classical high-performance computing, cloud quantum access, noisy
              intermediate-scale experiments, and internal research programs. The near-term buyer is more likely to be a
              government, research institution, or strategic technology partner funding capability than a conventional
              enterprise purchasing a production system.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Market sizing requires multiple lenses
        blocks:
          - type: paragraph
            body: >-
              Available estimates describe the total quantum-computing ecosystem rather than an Oratomic-specific
              addressable product market, and they disagree on both level and forecast. The Business Research Company
              reports $1.27 billion in 2025 and $4.64 billion in 2030 at a 29.2% CAGR, while BCC Research reports a $1.6
              billion 2025 market reaching $7.3 billion in 2030 at a 34.6% CAGR. Research and Markets' accessible report
              outline identifies forecast periods and segment dimensions but exposes no usable market value in the
              fetched text. The numeric forecasts should not be averaged: they use different segment boundaries, bases,
              and methodologies. A constrained Oratomic SAM would need to isolate fault-tolerant neutral-atom systems,
              required control and fabrication infrastructure, and eventual system sales or access revenue. No assigned
              source provides that cut, and the company's funding announcement states that it is focused exclusively on
              building a fault-tolerant computer, not a current commercial product. The broad TAM is therefore
              directional, while SAM and SOM remain evidence gaps.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM012
      - number: '2.3'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are real but back-loaded. Market sources identify growth in machine learning and AI,
              supply-chain optimization, cloud quantum solutions, healthcare adoption, and government and defense
              investment. Oratomic's technical thesis adds a potential cryptography catalyst: its reported research
              argues that reconfigurable neutral-atom systems could reduce the physical-qubit requirement for
              cryptographically relevant computation to roughly 10,000 to 20,000 qubits. The adoption constraint is
              execution, not awareness. HPCwire reports that the approach has so far been demonstrated only on paper and
              describes fault tolerance, error correction, and large-scale integration as substantial challenges.
              SiliconANGLE quotes Oratomic's CEO saying the business model and applications are not yet known and that a
              working, cheap, manufacturable computer is the necessary tipping point. This makes capital intensity,
              technical milestones, skills, and trust in performance the gating factors; valuation depends on converting
              a broad future market into a validated system and buyer path.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Implications for Oratomic's commercial path
        blocks:
          - type: paragraph
            body: >-
              Oratomic's market position is an option on the fault-tolerant segment, not a demonstrated share of today's
              quantum-computing revenue pool. The company's reported $775 million cumulative funding since launch
              signals investor willingness to finance a long engineering cycle, but it is not revenue, customer spend,
              or proof of demand. The company has said the funding will support its scientific and engineering team,
              laboratory infrastructure, and systems needed to build the computer. That supports a
              research-and-development adoption path: government and strategic partners may fund milestones before broad
              enterprise procurement. The strongest commercial unlock would be an independently verifiable working
              system, followed by a repeatable access, system-sale, or application model. Until those milestones exist,
              the market estimates support strategic relevance but do not support a company-specific SOM, revenue
              forecast, or valuation multiple. Investors should underwrite milestone evidence and customer budget
              ownership separately from the broad market CAGR.
            claimRefs:
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Large market, unproven capture
            body: >-
              The quantum-computing market is forecast to grow rapidly, but the assigned evidence does not isolate the
              fault-tolerant neutral-atom segment or show Oratomic customer revenue.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM012
          - type: callout
            title: Commercialization is downstream of engineering proof
            body: >-
              The key market risk is not lack of theoretical demand; it is whether Oratomic can turn a paper-level
              architecture into a cheap, manufacturable, fault-tolerant system with a known business model.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Oratomic's stated product scope is unusually concentrated: it is targeting a utility-scale, fault-tolerant
              quantum computer and is not presenting an intermediate NISQ product. Quantum Computing Report describes
              the company as using reconfigurable neutral-atom arrays and optical tweezers, while the company's launch
              material frames the technology as a direct path to fault tolerance. That creates a clear category
              distinction from neutral-atom incumbents that already sell systems or sensing products, but it also leaves
              Oratomic exposed if the long-horizon architecture does not reach a manufacturable machine. Universal
              Quantum is an adjacent trapped-ion architecture focused on modular chips and control integration;
              PsiQuantum is a photonic architecture using silicon chips and fiber networking with a million-qubit
              target. These are not interchangeable products, but they compete for the same strategic capital, scarce
              quantum engineering talent, government attention, and eventual enterprise workloads.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP009
              - CP010
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.2'
        title: Profiles, scale, and commercialization evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest observable separation is commercialization maturity, not a proven performance ranking.
              Infleqtion's public-market announcement says its neutral-atom portfolio spans quantum computers, clocks,
              RF receivers, and inertial sensors, and that its systems are already used by government customers and
              NVIDIA collaborations. Its transaction materials also report $29 million of trailing-twelve-month revenue
              as of June 30, 2025, three quantum computers sold, and a 1,600-physical-qubit array; those are
              company-reported figures, not an independent benchmark. PsiQuantum has a $1 billion Series E at a $7
              billion valuation and disclosed planned sites in Brisbane and Chicago, while Universal Quantum raised more
              than $100 million to scale a modular trapped-ion approach. Oratomic's disclosed financing is large, but
              its evidence remains primarily technical ambition and fundraising: the October 2026 company announcement
              carried by HPCwire says cumulative funding reached $775 million, with proceeds directed to team,
              laboratory infrastructure, and systems. Public evidence does not establish that Oratomic has customers,
              revenue, or a shipped system, so its differentiation remains an unvalidated technical thesis.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.3'
        title: Buying criteria, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              A buyer choosing among these platforms must underwrite more than qubit count. The relevant criteria are a
              credible path to error correction, manufacturability, control-stack integration, deployment and service
              capability, security and government trust, and evidence that the system can run useful workloads.
              Oratomic's reconfigurable arrays may reduce connectivity overhead and its 10,000-qubit thesis could lower
              the physical scale required, but the source record does not provide a customer contract, price sheet,
              uptime result, or independently reproduced benchmark. Infleqtion has the clearest distribution and trust
              signals in this pool because it reports government and industry deployments, while PsiQuantum has a
              semiconductor-manufacturing and fiber-networking story and committed sites. Switching costs are likely
              high once a customer commits algorithms, control software, cryogenic or optical infrastructure, and
              workforce training, but multi-homing remains rational while the technology is immature. That means
              partnerships, developer access, and public-sector procurement can matter as much as a claimed architecture
              advantage. Oratomic's decision to skip intermediate products concentrates both upside and execution risk.
              Its CEO's reported statement that the business models and exact applications remain unknown underscores
              why switching-cost capture is still a diligence question rather than an observed moat.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Displacement risk and unresolved competitive proof
        blocks:
          - type: paragraph
            body: >-
              The adverse case is not that neutral atoms are irrelevant; it is that several architectures can attract
              capital before any one platform proves durable economic superiority. SiliconANGLE explicitly places
              Oratomic's $475 million financing alongside Universal Quantum's more than $100 million Series A,
              illustrating simultaneous funding for different technical paths. AInvest warns that Oratomic is private
              and that the $775 million figure represents funding for engineering rather than a public investment, while
              its comparison of IonQ and D-Wave shows public quantum valuations can be detached from current revenue.
              PsiQuantum's disclosed $7 billion valuation and million-qubit target provide another well-capitalized
              alternative; Infleqtion's public listing and customer claims provide a nearer commercialization test. None
              of these sources proves which architecture will win, and the record does not disclose Oratomic pricing,
              customer conversion, manufacturing yield, logical-error performance, or an independently verified roadmap.
              The moat is therefore conditional: it could strengthen if the lower-qubit error-correction thesis becomes
              a reproducible machine, but it can be displaced by a rival that reaches deployable fault tolerance first.
            claimRefs:
              - CP007
              - CP012
              - CP015
              - CP016
      - number: '3.5'
        title: Evidence and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The comparison is evidence-constrained. Company-issued releases establish strategic intent and reported
              financing, but they do not establish realized customer economics. Independent coverage supplies useful
              competitor context, yet much of the sector's public record still consists of financing announcements and
              forward-looking technical claims. The practical underwriting test is whether Oratomic can demonstrate a
              repeatable logical-qubit or fault-tolerance milestone, a manufacturable system, and a buyer willing to pay
              for access. Until those observations exist, the company has a potentially differentiated architecture but
              no demonstrated distribution moat, switching-cost capture, or pricing power.
            claimRefs:
              - CP015
              - CP016
      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Focused architecture thesis
            body: >-
              Oratomic's reconfigurable neutral-atom and lower-qubit fault-tolerance thesis is differentiated in the
              assigned evidence, even though it remains unproven as a commercial system.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: callout
            title: Commercial proof gap
            body: >-
              Competitors already disclose products, customer references, revenue, public-market access, or planned
              sites; Oratomic's assigned evidence does not disclose comparable customer economics.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP013
          - type: callout
            title: Underwrite milestones, not funding totals
            body: >-
              The next competitive proof point should be a reproducible logical-qubit, manufacturing, or paid-customer
              milestone rather than another financing headline.
            calloutType: recommendation
            claimRefs:
              - CP007
              - CP012
              - CP015
  - number: 4
    title: Financials
    sections:
