  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The evidence chain moves from capital and technical ambition through missing commercial and security terms to a
      research-more decision.
    data:
      nodes:
        - id: capital
          label: $775M cumulative funding
          detail: Capital availability is not cash remaining or investor value.
        - id: technical
          label: 10,000-qubit thesis
          detail: The architecture and end-of-decade objective remain to be independently validated.
        - id: market
          label: Strategic sector support
          detail: Forecast revenue growth and government capital support the category.
        - id: downside
          label: Commercial and shakeout risk
          detail: Business model uncertainty and a forecast sector shakeout limit confidence.
        - id: price
          label: $5.4-$5.5B reported mark
          detail: Reported values conflict and omit security economics.
        - id: decision
          label: Research-more
          detail: Require primary financing, technical, customer, and runway evidence before entry.
      edges:
        - - capital
          - technical
        - - technical
          - market
        - - market
          - downside
        - - downside
          - price
        - - price
          - decision
    approximationNotes: >-
      The flow is qualitative; it does not assign probabilities, conversion rates, or a supportable intrinsic-value
      range.
    claimRefs:
      - CV001
      - CV007
      - CV008
