      - number: '5.2'
        title: Architecture, differentiation, and maturity
        blocks:
          - type: paragraph
            body: >-
              The architecture combines individual atoms held in optical tweezers, dynamic rearrangement during
              computation, and logical error correction. This design aims to improve connectivity and reduce the
              physical-qubit overhead required for useful fault-tolerant algorithms. The academic record supports
              important ingredients: a theoretical analysis reaches cryptographically relevant Shor estimates at 10,000
              reconfigurable atomic qubits, while prior neutral-atom work reports logical processing and
              scalable-control techniques. Oratomic's launch materials also point to a 6,000-atom trapping result by a
              co-founder. These are meaningful technical foundations, not proof that the complete system has been
              integrated. The remaining product risk sits at the interfaces among atom loading, transport, gate
              fidelity, measurement, decoding, classical control, packaging, calibration, and sustained runtime. No
              public benchmark reports an integrated Oratomic system against a defined application workload.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE006
