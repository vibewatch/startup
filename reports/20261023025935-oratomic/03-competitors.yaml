      - [Universal Quantum, "More than $100M Series A", "Modular trapped-ion systems and international expansion described", "Commercialize modular fault-tolerant architecture", "No comparable customer revenue or benchmark in assigned text"]
      - [IonQ, "About $15B market capitalization in AInvest comparison", "About $246M trailing revenue in AInvest comparison", "Public quantum pure-play benchmark", "AInvest comparison is not an audited filing excerpt"]
      - [D-Wave, "About $5.5B market capitalization in AInvest comparison", "About $12M trailing revenue in AInvest comparison", "Public quantum pure-play benchmark", "AInvest reports year-over-year revenue decline; no technical equivalence implied"]
    notes: >-
      Funding, valuation, revenue, and customer figures retain the periods and attribution stated
      by each source. They are not normalized to ARR, cash available, technical capability, or
      comparable accounting bases.
    claimRefs: [CP007, CP008, CP009, CP010, CP011, CP012]
  - id: TP003
    title: Capability and buying-criteria matrix
    columns: [Buying criterion, Oratomic, Infleqtion, PsiQuantum, Universal Quantum, Evidence status]
    rows:
      - [Fault-tolerance ambition, "Explicit company mission", "Reported logical-qubit application and fault-tolerant roadmap", "Million-qubit fault-tolerant target", "Fault-tolerant modular target", "Claims are not equivalent demonstrations"]
      - [Neutral-atom platform, "Yes", "Yes", "No; photonic", "No; trapped ion", "Architecture described by sources"]
      - [Commercial products, "Not disclosed", "Quantum computers and sensors reported in use", "Large test systems planned", "Commercialization stated", "Evidence is uneven and partly issuer-reported"]
      - [Government or enterprise distribution, "Not disclosed", "Government, NASA, UK, and NVIDIA references", "NVIDIA collaboration and planned sites", "International expansion described", "No common customer metric"]
      - [Pricing or packaging, "Not disclosed", "Not disclosed in assigned sources", "Not disclosed in assigned sources", "Not disclosed in assigned sources", "Pricing comparison is an evidence gap"]
      - [Manufacturing path, "Optical and laboratory infrastructure described", "Vertically integrated hardware and software claimed", "Silicon and fiber manufacturing path claimed", "Modular chip and control integration claimed", "No comparable yield or cost data"]
      - [Switching-cost signals, "Potentially high if a system is deployed; unproven", "Potentially higher due to deployed systems", "Potentially high due to site and software integration", "Potentially high due to modular control stack", "Analytical implication, not observed lock-in"]
      - [Multi-homing option, "Likely during pre-commercial phase", "Likely during pre-commercial phase", "Likely during pre-commercial phase", "Likely during pre-commercial phase", "No source documents customer exclusivity"]
    notes: >-
      “Not disclosed” and “unproven” are deliberate evidence gaps, not zero values. The matrix
      compares buyer-relevant evidence surfaced by the assigned sources and does not rank
      architectures without a common benchmark.
    claimRefs: [CP013, CP014, CP015, CP016]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Oratomic is positioned as high on fault-tolerance ambition but low on disclosed commercialization evidence relative to better-documented peers.
    data:
      xAxis: Commercialization evidence (0 = none disclosed, 10 = deployed/revenue evidence)
      yAxis: Fault-tolerance scale ambition (0 = not stated, 10 = explicit large-scale target)
      points:
        - {label: Oratomic, x: 2, y: 10, rationale: "Explicit utility-scale fault-tolerant mission, but no customer or revenue evidence in assigned sources"}
        - {label: Infleqtion, x: 9, y: 8, rationale: "Reported deployed products, revenue, government customers, and fault-tolerant roadmap"}
        - {label: PsiQuantum, x: 5, y: 10, rationale: "Million-qubit fault-tolerant target and major funding, with planned rather than delivered sites in the assigned source"}
        - {label: Universal Quantum, x: 5, y: 8, rationale: "Modular fault-tolerant ambition and more than $100M funding, with limited customer detail in the pool"}
        - {label: IonQ, x: 8, y: 7, rationale: "Public revenue benchmark in AInvest, but the assigned text does not establish equivalent fault-tolerant delivery"}
        - {label: D-Wave, x: 7, y: 4, rationale: "Public revenue benchmark and commercial positioning, without the same universal fault-tolerance claim in the assigned text"}
    approximationNotes: >-
      Ordinal scores are analyst classifications from the evidence summarized in this chapter,
      not measured performance, market share, or investment ratings. They should be replaced by
      common benchmark data if comparable results become public.
    claimRefs: [CP001, CP007, CP009, CP010, CP011, CP012]

callouts:
  - calloutType: strength
    title: Focused architecture thesis
    body: Oratomic's reconfigurable neutral-atom and lower-qubit fault-tolerance thesis is differentiated in the assigned evidence, even though it remains unproven as a commercial system.
    claimRefs: [CP001, CP002, CP003]
  - calloutType: risk
    title: Commercial proof gap
    body: Competitors already disclose products, customer references, revenue, public-market access, or planned sites; Oratomic's assigned evidence does not disclose comparable customer economics.
    claimRefs: [CP007, CP008, CP009, CP013]
  - calloutType: recommendation
    title: Underwrite milestones, not funding totals
    body: The next competitive proof point should be a reproducible logical-qubit, manufacturing, or paid-customer milestone rather than another financing headline.
    claimRefs: [CP007, CP012, CP015]

