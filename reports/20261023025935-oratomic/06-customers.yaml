      - ["Technology and compute platforms", "Cloud, computing, and technical product teams", "Quantum or hybrid compute services and platform access", "BCG identifies technology providers as prospective beneficiaries", "No access model, API, price, or account disclosed", "Delivery model, integration boundary, service level, and economics"]
