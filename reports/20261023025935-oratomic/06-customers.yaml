      - ["Defense, space, finance, and security", "Mission, modeling, risk, and cryptography teams", "Simulation, optimization, and cryptographic analysis", "Market analysis and government policy identify potential demand", "No commercial or government customer disclosed", "Security requirements, contracting vehicle, outcome threshold, and concentration"]
    notes: Segment evidence describes prospective market demand, not Oratomic customers, contracts, revenue, or production usage.
    claimRefs: [CU001, CU002, CU010, CU011, CU013]
  - id: TU002
