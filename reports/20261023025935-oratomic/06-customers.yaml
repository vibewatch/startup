schemaVersion: "report-v2"
artifact: customers
slug: oratomic
runDate: 2026-10-23
company:
  name: Oratomic
chapter:
  number: 6
  title: Customers
  summary: >-
    Oratomic remains pre-commercial in the reviewed evidence: no named customer, paid pilot,
    production deployment, usage metric, or retention measure is disclosed. Public-sector programs
    and enterprise quantum experiments define plausible future buyer groups, but the company is
    deliberately deferring commercial proof until it can deliver a fault-tolerant system.
sections:
  - id: buyer-map
    title: Plausible buyers are visible, but actual accounts are not
    body: >-
      Oratomic presents a future fault-tolerant computer for workloads in materials science, chemistry,
      physics, artificial intelligence, and cryptography. Independent market work points to technology,
      chemicals and agriculture, pharmaceuticals, defense and space, finance, and the public sector as
      likely beneficiaries of error-corrected quantum computing. These categories identify potential
      users, not Oratomic customers. Across the assigned prefetched evidence, there is no named paying
      account, paid pilot, production deployment, customer outcome, price, channel, or commercial access
      model. The best-supported near-term buyer hypothesis is therefore a technically sophisticated
      institution able to fund lengthy qualification, rather than a broad enterprise customer base.
    claimRefs: [CU001, CU002, CU005, CU010]
    tableRefs: [TU001]
  - id: adoption-evidence
    title: Capital and ecosystem activity do not establish product adoption
    body: >-
      Oratomic says its cumulative funding will expand the scientific and engineering team, laboratory
      infrastructure, and systems needed to build its computers. That is evidence of financed capacity,
      not customer-funded demand. Independent reporting says the company plans to skip interim NISQ
      products, while a more skeptical source reports that it is not pursuing intermediate products or
      revenue. The CEO has also acknowledged uncertainty about the eventual business models and exact
      applications. Meanwhile, BCG recorded enterprise proofs of concept and substantial public-sector
      purchasing across the wider quantum market. Those benchmarks demonstrate category interest, but
      they cannot be transferred to Oratomic as accounts, bookings, usage, or revenue.
    claimRefs: [CU003, CU004, CU005, CU006, CU008, CU009]
    tableRefs: [TU002]
  - id: proof-durability-and-route
    title: Commercial proof, durability, and concentration remain open
    body: >-
      The launch evidence was theoretical, and the reviewed sources disclose no active-account count,
      utilization, renewal, churn, NRR, GRR, contract term, expansion revenue, or customer concentration.
      Government initiatives provide a possible route from technical validation to procurement: current
      policy directs delivery of a scientifically useful system to a Department of Energy facility,
      contemplates private-sector partnerships and advance market commitments, and funds competitions
      and user infrastructure. None of those programs is evidence that Oratomic has been selected or
      purchased. The resulting customer journey is milestone-gated and binary: technical validation must
      precede availability, workload acceptance, procurement, production use, and only then renewal or
      expansion.
    claimRefs: [CU007, CU011, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
    figureRefs: [FU001]
