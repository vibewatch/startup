    columns: [Signal, Value, Period, Attribution and confidence, Implication, Missing denominator]
    rows:
      - ["Oratomic named customers", "None identified in the assigned evidence", "Through 2026-10-23", "Direct review of twelve assigned sources; medium confidence within that bounded set", "Customer traction cannot be underwritten", "Private customer list, contract status, and account count"]
      - ["Oratomic interim product or revenue", "Independent sources report no interim NISQ product and no intermediate revenue plan", "2026 reporting", "The Robotics Media and AInvest; medium confidence", "Commercial validation is deferred until fault tolerance", "Launch date, pipeline, bookings, and revenue"]
      - ["Wider-market enterprise experiments", "More than 100 Fortune 500 proofs of concept representing about $300 million of investment", "BCG's 2023 tracking", "BCG market analysis; medium confidence", "Category experimentation exists but is not Oratomic adoption", "Company participation, paid share, active projects, and outcomes"]
      - ["Wider-market public orders", "More than half of the provider market supported by public orders", "BCG 2024 analysis", "BCG estimate; medium confidence", "Government may be an early buyer class", "Oratomic eligibility, award share, contract value, and timing"]
    notes: Market benchmarks are explicitly non-company metrics. Funding and category investment are not Oratomic revenue, ARR, customers, or cash available.
    claimRefs: [CU002, CU003, CU004, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Public proof category, Named customer, Deployment or use case, Production vs pilot, Outcome, Limitation]
    rows:
      - ["Paying customer or signed contract", null, null, "Not disclosed", null, "No assigned source identifies a paying account or signed customer contract"]
      - ["Pilot, evaluation, or design partnership", null, null, "Not disclosed", null, "Research collaboration and market programs do not establish a customer pilot"]
      - ["Production deployment or customer workload", null, null, "Not disclosed", null, "The cited launch results were theoretical, and no customer outcome is reported"]
    enumerationScope:
      coverage: partial
      basis: The enumeration covers the assigned prefetched public sources through 2026-10-23, not Oratomic's private pipeline or contracts.
    notes: Null means no support in the assigned evidence, not proof that no private relationship exists.
    claimRefs: [CU002, CU003, CU004, CU015, CU016]
figures:
  - id: FU001
    title: Evidence-gated customer journey
    type: journey-map
    summary: The sequence is a diligence framework for a future commercialization path, not evidence of current Oratomic conversion or adoption.
    data:
      nodes:
        - id: application-hypothesis
          label: Application hypothesis
          detail: Select a customer problem where fault-tolerant computing could outperform classical methods.
          touchpoints: ["Scientific use cases", "economic-value hypothesis"]
        - id: independent-validation
          label: Independent validation
          detail: Demonstrate a reproducible advantage under external technical assessment.
          touchpoints: ["Benchmarking center", "government competition"]
        - id: system-availability
          label: System availability
          detail: Deliver a working system or controlled access surface for qualified users.
          touchpoints: ["DOE facility route", "user infrastructure"]
        - id: buyer-qualification
          label: Buyer qualification
          detail: Establish security, performance, integration, procurement, and commercial terms.
          touchpoints: ["Partnership model", "advance market commitment"]
        - id: production-workload
          label: Production workload
          detail: Run a named customer workload against agreed acceptance criteria.
          touchpoints: ["Named deployment", "verified outcome"]
        - id: renewal-expansion
          label: Renewal and expansion
          detail: Demonstrate repeat use, renewal, broader workloads, and manageable concentration.
          touchpoints: ["Retention cohort", "expansion revenue"]
    approximationNotes: This is an evidence sequence, not a time estimate, conversion funnel, or claim that Oratomic has completed any stage.
    claimRefs: [CU007, CU011, CU012, CU013, CU014]
callouts:
  - calloutType: risk
    title: No public customer proof
    body: The assigned evidence identifies no named paying customer, paid pilot, production deployment, customer outcome, usage metric, or retention measure. Private evidence may exist, but public traction is not underwritable.
    claimRefs: [CU002, CU016]
  - calloutType: insight
    title: Public programs are a route, not a win
    body: Federal competitions, user facilities, private-sector partnership models, and advance market commitments could create qualification and procurement paths, but no reviewed source ties Oratomic to an award or purchase.
    claimRefs: [CU011, CU012, CU013, CU014]
