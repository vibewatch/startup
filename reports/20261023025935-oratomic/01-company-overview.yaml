company:
  name: Oratomic
chapter:
  number: 1
  title: Company Overview
  summary: Oratomic is a Pasadena-based quantum-computing startup founded in 2025 around Caltech-linked neutral-atom and fault-tolerance research. Public evidence shows a March 2026 launch, $775 million of cumulative funding by October, and an independently reported $5.5 billion valuation, but not revenue, customers, runway, financing terms, or a demonstrated commercial machine.
sections:
  - id: identity-and-technical-thesis
    title: Identity and technical thesis
    body: >-
      Oratomic launched in March 2026 with a deliberately narrow ambition: build a
      utility-scale, fault-tolerant quantum computer rather than sell an
      intermediate noisy system. The official launch account identifies a
      Caltech-linked founding team and describes reconfigurable arrays of atomic
      qubits, dynamic rearrangement during computation, and an error-correction
      approach intended to reduce the hardware threshold for cryptographically
      relevant computation. Public technical statements report 10,000
      reconfigurable atomic qubits as the target scale and 6,000 trapped qubits
      demonstrated by co-founder Manuel Endres, while also qualifying an
      end-of-decade fault-tolerant machine as plausible but not guaranteed. These
      are company-originated technical claims or reporting of them, not an
      independently verified operating specification.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO007]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and key-person dependence
    body: >-
      The disclosed team is unusually research-heavy for an early-stage hardware
      company. Oratomic names Dolev Bluvstein as CEO and lists researchers and
      engineers associated with Caltech, Berkeley, Harvard, Amazon, Google, and
      other institutions; the launch materials specifically highlight Manuel
      Endres's neutral-atom work and John Preskill's long tenure in
      fault-tolerant-quantum-computing research. This gives the company strong
      apparent founder-market fit across physics, error correction, artificial
      intelligence, and optical engineering. The same concentration creates
      execution and key-person dependence: the public record identifies an
      initial team but does not disclose a board, operating leadership depth,
      succession plan, or individual equity and control arrangements.
    claimRefs: [CO006, CO008, CO014]
    tableRefs: [TO002]
  - id: capital-and-milestones
    title: Capitalization, milestones, and evidence gaps
    body: >-
      Oratomic's financing is the clearest externally visible scale signal, but
      it must not be confused with revenue or cash available. TechCrunch and The
      Quantum Insider reported a $300 million Series A in July 2026. SiliconANGLE
      then reported a $475 million Series B on October 8, taking cumulative
      funding to $775 million and the valuation to $5.5 billion from $1.5
      billion. The company said the new capital would support scientific and
      engineering hiring, laboratory infrastructure, and quantum-computer
      systems. These reports establish financing events, not current liquidity
      or commercial traction: no retained source supplies primary financing
      documents, customer contracts, revenue, current headcount, runway, debt,
      or board terms. The milestone record therefore supports substantial
      investor commitment while leaving commercial proof and capital structure
      as material diligence gaps.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: exhibits
    title: Exhibits
    body: >-
      The timeline separates founding, public launch, technical disclosure,
      financing, and stated future objectives. Dates are retained only where the
      assigned prefetched sources provide them; the absence of a public
      milestone is not treated as evidence that the underlying event did not
      occur. The sequence also distinguishes company objectives from completed
      operating milestones. The assigned evidence documents launch, research
      claims, and two financing rounds, but it does not document a commercial
      fault-tolerant machine, customer deployment, or revenue. The October
      valuation is third-party reporting rather than a disclosed term sheet, so
      it remains a diligence input rather than a verified capitalization fact.
    claimRefs: [CO001, CO003, CO004, CO005, CO007, CO010, CO011, CO012, CO016]
