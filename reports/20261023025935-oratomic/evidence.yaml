evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Primary cap-table, board, voting-rights, and preference-stack documentation.
    whyItMatters: The disclosed investor list does not establish control, dilution, liquidation preference, or governance exposure.
    diligencePath: Request the latest capitalization table, financing documents, board roster, and investor-rights summary under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Audited or management revenue, customer contracts, current headcount, burn rate, cash runway, and debt
      disclosures.
    whyItMatters: >-
      Funding raised is not cash available or operating traction, so commercial durability cannot be underwritten from
      the public record.
    diligencePath: >-
      Obtain management accounts, hiring plan, runway model, customer pipeline, and signed commercial or research
      agreements.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: technical-validation
    missingEvidence: >-
      Independent replication or engineering milestones demonstrating a fault-tolerant system at the claimed target
      scale.
    whyItMatters: >-
      The 10,000-qubit thesis and 6,000-qubit experimental result are not equivalent to a working fault-tolerant
      commercial machine.
    diligencePath: >-
      Request the underlying paper, reproducible benchmark data, roadmap gates, and third-party validation of
      error-correction performance.
    relatedQuestionRefs:
      - QO002
