      absence.
    diligencePath: Run a legal, sanctions, corporate-registry, and leadership-reference review before investment approval.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
