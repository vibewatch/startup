    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform
        blocks:
          - type: paragraph
            body: >-
              BigID is a private enterprise software company headquartered in New York. Most structured profiles date
              its founding to 2016, although narrative text on two of those same profile surfaces says 2015, so the
              incorporation and operating start dates should not be treated as settled without company records. The
              company describes a unified data security and compliance platform spanning discovery, classification,
              DSPM, DLP, access governance, privacy, labeling, deletion, remediation, and AI governance across cloud,
              SaaS, on-premises, and development environments. That breadth indicates an enterprise platform strategy
              rather than a single-purpose privacy tool, while the official claims remain vendor assertions rather than
              independently tested performance.
