  - id: TV001
    title: Recommendation summary table
    columns:
      - Metric / Dimension
      - Assessment
      - Evidence Base
      - Decision Implication
    rows:
      - - Investment Recommendation
        - Research-More
        - >-
          Severe divergence between historical $1B+ rounds and $187.6M secondary print; unverified NRR and margin
          metrics.
        - >-
          Withhold new growth capital; do not buy at headline unicorn marks without audited financial and cap-table
          disclosures.
      - - Confidence Level
        - Medium
        - Corroborated market signals from QuantLogix, Sacra, and SV Investclub, but zero public GAAP filings.
        - Underwrite only with substantial margin of safety; maintain strict secondary entry discipline.
      - - Risk Rating
        - High
        - Capital structure opacity, senior liquidation preference overhang, and high-multiple legacy valuation.
        - Requires explicit downside protections, liquidation waterfalls, and verified customer renewal metrics.
      - - Valuation Stance
        - Fair at Secondary Discount
        - Secondary model print of $187.6M to $271.9M reflects market-clearing multiple compression vs $1.25B peak.
        - Fair value only under secondary discount (<$250M EV); unsupportable at headline venture marks (> $500M).
    notes: >-
      Recommendation synthesizes secondary transaction data, third-party revenue models, and cap-table opacity; not
      investment advice.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV012
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis (Bull Case)
      - Anti-Thesis (Downside Risk)
      - What Would Change View
    rows:
      - - Market & Product Moat
        - >-
          Unified DSPM, data discovery, and AI governance platform protecting petabyte-scale hybrid environments across
          100s of data stores.
        - >-
          Crowded DSPM and cybersecurity market with aggressive competition from hyperscalers and specialized security
          vendors.
        - Independent customer churn data and head-to-head win-loss ratios in tier-1 enterprise bakeoffs.
      - - Financial & Revenue Scale
        - Third-party estimates show $108M to $139.5M ARR baseline with established enterprise software customer base.
        - Lack of audited GAAP financials, unknown gross margin profile, and potential services revenue inflation.
        - Audited financial statements showing software gross margins above 75% and positive operating cash flow.
      - - Valuation & Multiple Reality
        - >-
          Opportunity to enter high-growth data security asset at deep secondary market discount (<$250M EV vs $1.25B
          peak).
        - >-
          Earlier venture rounds established onerous senior liquidation preferences that leave junior equity impaired in
          mid-tier exits.
        - Full cap-table transparency demonstrating manageable liquidation preference stack for incoming equity.
      - - Regulatory Tailwinds
        - >-
          Proliferating global data privacy laws and new AI safety mandates (e.g., NY RAISE Act) compel enterprise
          budget allocation.
        - >-
          Regulatory compliance tools face commoditization and budget pressure when integrated into broader suite
          platforms.
        - Contract cohort analysis proving standalone DSPM module expansion and durable annual contract values.
    notes: Thesis evaluation contrasts company product positioning against third-party valuation prints and governance risks.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Operating Assumptions
      - Implied ARR & Multiple Logic
      - Valuation Range
      - Probability Signal & Downside Triggers
    rows:
      - - Bull Case
        - >-
          ARR accelerates above $160M driven by enterprise AI governance module adoption; NRR exceeds 115%; gross margin
          > 75%.
        - Re-rated at 5.0x–6.5x forward ARR multiple in line with top-tier cybersecurity software peers.
        - $800M – $1,050M
        - 15% probability; triggered by verified enterprise AI governance tier-1 deployments and successful IPO filing.
      - - Base Case
        - >-
          ARR grows moderately at 15–20% reaching $125M–$135M; NRR stabilizes at 100–105%; margin compression from cloud
          hosting costs.
        - Normalized software multiple of 3.0x–3.8x ARR reflecting growth-stage private cybersecurity comps.
        - $375M – $510M
        - >-
          55% probability; triggered by steady compliance renewals alongside competitive pressure on new enterprise
          logos.
      - - Bear Case
        - >-
          ARR stagnates below $100M amid DSPM commoditization and hyperscaler native tooling; customer churn increases;
          senior preferences overhang.
        - Distressed or fire-sale secondary multiple of 1.5x–2.0x ARR reflecting illiquidity and cap-table impairment.
        - $150M – $200M
        - >-
          30% probability; triggered by secondary market prints at $187.6M, executive departures, or enterprise vendor
          consolidation.
    notes: >-
      Scenario modeling assumes estimated $108M ARR base; multiples reflect private data-security comps as of October
      2026.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV012
      - CV014
