  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Enterprise adoption journey from dark data discovery through automated compliance to multi-cloud security and AI
      governance expansion.
    approximationNotes: >-
      Stages and expansion loops synthesized from BigID deployment patterns, pricing disclosures, and customer review
      feedback.
    claimRefs:
      - CU001
      - CU003
      - CU008
      - CU011
    data:
      items:
        - label: 1. Data Discovery & Audit
          stage: Evaluation & PoC
          buyer: CISO / Data Privacy Officer
          surface: Agentless scanning of structured databases and cloud storage (AWS, Snowflake)
          expansionLoop: Baseline discovery reveals unmapped PII and dark data exposure, justifying enterprise budget
          detail: Initial pilot typically focuses on sensitive data discovery and compliance readiness.
        - label: 2. Initial Production Deployment
          stage: Core Implementation
          buyer: SecOps / Compliance Lead
          surface: On-premises file shares, Microsoft 365, Box, and enterprise repositories
          expansionLoop: Cataloging personal data enables automated DSAR and regulatory mapping workflows
          detail: Organizations deploy core data intelligence platform at six-figure minimum commitment.
        - label: 3. Workflow Automation
          stage: Operationalization
          buyer: Privacy Operations / Legal
          surface: DSAR orchestration, consent tracking, and automated RoPA reporting
          expansionLoop: Compliance automation demonstrates immediate operational labor savings
          detail: Customers add specialized privacy modules, such as automated DSAR fulfillment.
        - label: 4. Data Lifecycle & Minimization
          stage: Optimization
          buyer: Data Engineering / Cloud FinOps
          surface: Azure Data Lake Gen2, NAS, and multi-cloud object storage
          expansionLoop: ROT data deletion yields direct infrastructure and cloud storage cost reductions
          detail: Decommissioning redundant data delivers measurable ROI, strengthening executive renewal buy-in.
        - label: 5. DSPM & Access Governance
          stage: Security Expansion
          buyer: CISO / IAM Architecture
          surface: User access monitoring, data access governance, and agentless DLP
          expansionLoop: Monitoring sensitive data movement prompts cross-functional expansion into active SecOps
          detail: Platform usage expands from passive classification to proactive access policy enforcement.
        - label: 6. AI Governance & Posture
          stage: Strategic Expansion
          buyer: Head of AI / Chief Data Officer
          surface: LLM training pipelines, vector databases, copilots, and shadow AI detection
          expansionLoop: GenAI initiatives require continuous model dataset cleansing and compliance auditing
          detail: Enterprises integrate BigID to govern conversational AI and agentic data access.
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative impact, likelihood, mitigation maturity, and residual severity for the four risks most material to the
      investment thesis.
    data:
      columns:
        - Impact
        - Likelihood
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Hybrid deployment and classifier tuning
          values:
            - label: High
              tone: negative
              detail: Schedule, cost, and data-coverage failures can delay production value.
            - label: High
              tone: negative
              detail: Independent guidance and one verified review identify complexity and false positives.
            - label: Low-medium
              tone: warning
              detail: Proof-of-concept testing helps, but cohort outcomes are unavailable.
            - label: High
              tone: negative
              detail: Requires measured accuracy, schedule, and services evidence.
        - label: Security-control assurance
          values:
            - label: Critical
              tone: negative
              detail: The product operates around sensitive data, identities, and permissions.
            - label: Medium
              tone: warning
              detail: No incident is established; exposure follows from the operating context.
            - label: Company-claimed
              tone: warning
              detail: Control and certification statements lack independent evidence in this pool.
            - label: Medium-high
              tone: negative
              detail: Independent assurance and incident history remain open.
        - label: Execution capacity after workforce reduction
          values:
            - label: High
              tone: negative
              detail: Connector maintenance, support, and roadmap delivery are labor dependent.
            - label: Elevated
              tone: warning
              detail: A profile reports lower headcount and a roughly 20% workforce cut.
            - label: Unverified
              tone: warning
              detail: No current functional staffing or service data is public here.
            - label: High
              tone: negative
              detail: Requires organization, backlog, roadmap, and SLA evidence.
        - label: Direct RAISE Act applicability
          values:
            - label: High if applicable
              tone: warning
              detail: Covered developers face framework and incident-reporting duties.
            - label: Conditional
              tone: neutral
              detail: BigID's commentary says ordinary enterprise use is not automatically covered.
            - label: Guidance only
              tone: warning
              detail: BigID expressly disclaims independent compliance certification.
            - label: Medium
              tone: warning
              detail: Counsel must resolve scope and product-claim implications.
        - label: Connector and API dependency
          values:
            - label: High
              tone: negative
              detail: Coverage gaps can create manual work and sensitive-data blind spots.
            - label: High
              tone: negative
              detail: Broad data-estate integration requires continuing maintenance.
            - label: Buyer-controlled
              tone: warning
              detail: Proof-of-concept tests and repair ownership can bound exposure.
            - label: High
              tone: negative
              detail: Connector uptime and recovery performance are not public here.
        - label: Financial and liquidity opacity
          values:
            - label: High
              tone: negative
              detail: Liquidity pressure could constrain roadmap, assurance, and support.
            - label: Unknown
              tone: warning
              detail: The assigned evidence lacks audited cash, burn, and runway.
            - label: Unverified
              tone: warning
              detail: Funding history does not establish cash available.
            - label: High
              tone: negative
              detail: Audited financials and a cash bridge are required.
    approximationNotes: >-
      All ratings are qualitative synthesis, not modeled probabilities; absence of a cited incident is not evidence that
      no incident occurred.
    claimRefs:
      - CR016
