        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Dimitri Sirota and Nimrod Vax remain the identifiable founder anchors. Public profiles list Sirota as
              chief executive and Vax as chief product officer, with finance, revenue, marketing, and customer functions
              represented in the broader executive roster. The founders' identity-management background is directly
              relevant to the original privacy and personal-data discovery thesis, but the accessible evidence does not
              establish decision-rights, succession depth, or a fully verified current board roster. Governance
              diligence should therefore distinguish visible functional coverage from actual authority and should test
