  - id: FE001
    title: Product architecture map
    type: stack
    summary: Six-tier architectural stack of the BigID Data Security Platform from infrastructure to AI governance.
    data:
      layers:
        - label: Enterprise Data Sources & Repositories
          detail: >-
            Multi-cloud object storage (AWS S3, Azure Blob, GCS), relational databases, SaaS platforms, and developer
            code repositories.
        - label: Agentless Ingestion & Connector Layer
          detail: >-
            Connector-based discovery operating without local host agents, avoiding cloud data backhaul and high
            endpoint overhead.
        - label: Classification & Intelligence Engine
          detail: >-
            Distributed microservices utilizing ML classifiers and MongoDB aggregation framework for contextual
            correlation.
        - label: Persistence & Data Services Layer
          detail: MongoDB Atlas cluster deployment with sharding, replica sets, and Terraform automation on Amazon EKS.
        - label: Policy, Remediation & Governance Workflows
          detail: >-
            Automated masking, redaction, data retention enforcement, access governance (DAG), and regulatory compliance
            reporting.
        - label: AI Governance & Developer Protection Surface
          detail: >-
            AI security posture management (AISPM), Markdown instruction scanning for vibe coding, and prompt exposure
            tracking.
