chapter:
  number: 7
  title: "Risks"
  summary: "The strongest public risk signals concern hybrid-deployment complexity, classifier tuning, implementation cost, and execution capacity after a reported workforce reduction. BigID publishes broad security and compliance claims, but the assigned evidence does not independently verify control effectiveness, incident history, private-company liquidity, or direct applicability of frontier-AI rules."
sections:
  - id: "ranked-risk-view"
    title: "Ranked Risk View and Investment Implication"
    body: >-
      BigID's highest residual risk is execution across complex enterprise data estates. Independent
      procurement guidance calls for buyer-specific validation of hybrid deployment, integrations,
      classifier accuracy, and post-launch ownership, while one verified reviewer reports a slow
      interface, false positives, and high cost. A separate company profile reports headcount falling
      from 724 in Q2 2025 to 639 in Q1 2026 and describes a roughly 20% workforce cut in 2026. Those
      figures do not establish distress, burn, or runway, but they raise the diligence burden around
      roadmap delivery and support capacity. The investment posture should therefore remain conditional
      on production references, control evidence, current staffing, and audited liquidity rather than
      treating product breadth or funding raised as proof that the risks are mitigated.
    claimRefs:
      - "CR001"
      - "CR004"
      - "CR006"
      - "CR013"
      - "CR014"
      - "CR016"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-and-control-assurance"
    title: "Regulatory, Legal, and Control-Assurance Exposure"
    body: >-
      BigID markets controls spanning privacy, compliance, access governance, and AI governance. Its
      website claims local deployment without backhaul or cloud copying and lists certifications and
      scoped access controls, but these are company-issued representations rather than independent
      assurance evidence in the assigned pool. Independent buyer guidance also says BigID's weak
      points include clunky UI, lack of pricing transparency, and long-term contractual commitments,
      so risk should be evaluated through control design, test results, incident history, and contract
      language. The New York RAISE Act is not a universal mandate for enterprise software vendors:
      BigID's legal commentary says direct duties depend on frontier-developer status and expressly
      says BigID does not certify compliance. Counsel should determine applicability; the evidence
      here supports neither a violation finding nor a clean bill of health.
    claimRefs:
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR015"
    tableRefs:
      - "TR001"
  - id: "operational-quality-and-security"
    title: "Operational, Quality, and Security Risk"
    body: >-
      Deployment quality is the most observable operating risk. RFP.wiki advises testing source
      coverage, classification accuracy, integration depth, and ownership with the buyer's own estate;
      its category guidance says implementation can range from two weeks for simpler SaaS deployments
      to more than six months for hybrid environments and that services and custom integration can add
      30-50% to software license cost. Those ranges are category guidance, not measured BigID averages.
      BigID-specific signals are still cautionary: RFP.wiki flags slow large-environment scans and false
      positives, and a verified SoftwareReviews reviewer independently describes a clunky interface,
      false positives, and high cost. Historical reporting also shows that BigID was designed around
      enterprise-controlled deployment, making current architecture and operating responsibility a
      critical diligence item rather than an assumption.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR010"
      - "CR012"
    tableRefs:
      - "TR002"
  - id: "partner-financial-and-monitoring-risk"
    title: "Partner, Financial, and Monitoring Risk"
    body: >-
      The platform's advertised breadth creates continuing dependency on customer systems, connector
      quality, APIs, specialist implementation resources, and policy maintenance. Independent buyer
      guidance warns that API changes can break automation and that ownership of integration repair
      must be established contractually. BigID's breadth claims increase the number of surfaces that
      require validation, but they do not quantify connector uptime, support response, or remediation
      success. Financial resilience is also unresolved: the assigned profile provides headcount and
      funding-history indicators, yet it does not provide audited cash, burn, runway, margins, retention,
      or customer concentration. Funding raised is not cash available. Monitoring should focus on
      production scan reliability, false-positive rates, critical-connector availability, support
      backlog, workforce stability, and liquidity; deterioration across those indicators would break
      the execution thesis.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR007"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR016"
    tableRefs:
      - "TR003"
