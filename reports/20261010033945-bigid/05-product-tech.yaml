  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current / Legacy Workflow
      - BigID Platform Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Sensitive Data Inventory
        - Manual sampling and regex-based database scripts
        - Continuous ML-driven discovery across multi-cloud stores
        - Automated cataloging of personal and sensitive data assets
        - Requires connector configuration and access credentials per source
      - - Excessive Access Remediation
        - Periodic static entitlement reviews via spreadsheets
        - Identity-aware access governance and activity monitoring
        - Flags overprivileged identities and dormant access paths
        - Relies on downstream IAM systems to execute permission revocations
      - - Developer AI Instruction Security
        - Uninspected Markdown instructions in developer repos
        - DSPM scanning for API keys and system context in .md files
        - Discovers shadow system prompts and embedded credentials
        - Limited to text and Markdown files; cannot inspect encrypted payloads
      - - Data Subject Rights (DSAR) Automation
        - Manual multi-database querying and custom exports
        - Automated correlation linking personal data to identity
        - Reduces response cycle time for privacy regulatory requests
        - Correlation accuracy depends on data relationship consistency
    notes: Operational benefits reflect platform automation capabilities compared to traditional manual audit workflows.
