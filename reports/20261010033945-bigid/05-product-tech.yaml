  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / Component
      - Technical Role
      - Underlying Dependency
      - Operational & Technical Risk
    rows:
      - - Containerized Microservices
        - Core application services and analytics execution
        - Docker containers managed on Amazon EKS Kubernetes
        - Cluster orchestration complexity and version upgrade maintenance
      - - Persistence & Computational Server
        - Data indexing, lookups, and aggregation framework
        - MongoDB / MongoDB Atlas with replica sets and sharding
        - Database query optimization and performance tuning under high concurrency
      - - Infrastructure as Code Orchestration
        - Automated provisioning and Atlas VPC cluster peering
        - HashiCorp Terraform MongoDB Atlas Provider plugin
        - Configuration drift and cloud provider credential lifecycle management
      - - Agentless Data Connectors
        - Direct API and native protocol querying of data stores
        - Cloud provider APIs (AWS, Azure, GCP) and database drivers
        - API throttling, network bandwidth overhead, and permission management
    notes: Architecture details sourced from BigID engineering disclosures and MongoDB architectural case study.
    claimRefs:
      - CE003
      - CE006
      - CE011
      - CE012
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Six-tier architectural stack of the BigID Data Security Platform from infrastructure to AI governance.
    data:
      layers:
        - label: Enterprise Data Sources & Repositories
          detail: Multi-cloud object storage (AWS S3, Azure Blob, GCS), relational databases, SaaS platforms, and developer code repositories.
        - label: Agentless Ingestion & Connector Layer
          detail: Connector-based discovery operating without local host agents, avoiding cloud data backhaul and high endpoint overhead.
        - label: Classification & Intelligence Engine
          detail: Distributed microservices utilizing ML classifiers and MongoDB aggregation framework for contextual correlation.
        - label: Persistence & Data Services Layer
          detail: MongoDB Atlas cluster deployment with sharding, replica sets, and Terraform automation on Amazon EKS.
        - label: Policy, Remediation & Governance Workflows
          detail: Automated masking, redaction, data retention enforcement, access governance (DAG), and regulatory compliance reporting.
        - label: AI Governance & Developer Protection Surface
          detail: AI security posture management (AISPM), Markdown instruction scanning for vibe coding, and prompt exposure tracking.
    claimRefs:
      - CE003
      - CE006
      - CE007
      - CE011
      - CE012
callouts:
  - calloutType: strength
    title: Agentless Architecture and Deep Microservices Correlation
    body: BigID separates itself from traditional agent-based endpoint discovery by running containerized discovery across multi-cloud environments via microservices and MongoDB, eliminating the need to install intrusive endpoint agents across enterprise infrastructure.
    claimRefs:
      - CE003
      - CE004
  - calloutType: risk
    title: Vibe Coding Instruction Exposure and AI Governance Boundaries
    body: While BigID has expanded DSPM to Markdown instructions and AI prompt monitoring, enterprise governance remains constrained because BigID provides data visibility and access intelligence rather than autonomous catastrophic-risk certification or runtime frontier model containment.
    claimRefs:
      - CE007
      - CE013
