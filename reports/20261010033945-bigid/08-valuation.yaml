company:
  name: BigID
chapter:
  number: 8
  title: Valuation
  summary: BigID demonstrates enterprise scale across data security posture management and AI governance, but recent secondary
    market prints at $187.6M reflect severe multiple compression against historical $1B+ unicorn valuations. With zero public
    GAAP disclosures regarding net revenue retention, gross margins, or cap-table liquidation preferences, the prudent investment
    recommendation is research-more, maintaining strict valuation discipline below a $250M enterprise value threshold.
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: BigID represents a strategically positioned enterprise software vendor bridging traditional privacy compliance and
    modern cloud data security. Founded in 2016 by Dimitri Sirota and Nimrod Vax to solve complex data privacy mandates, the
    company has expanded its core architecture into data security posture management (DSPM), data loss prevention, and artificial
    intelligence governance. The investment thesis rests on BigID's proven ability to perform deep, petabyte-scale data classification
    across hundreds of multi-cloud, SaaS, and on-premises data stores, positioning it as an indispensable layer for enterprise
    risk management. Moreover, accelerating regulatory mandates such as the European Union AI Act and New York's Responsible
    AI Safety and Education (RAISE) Act create persistent demand for automated data stewardship. Conversely, the anti-thesis
    emphasizes mounting competitive pressure from hyperscale cloud providers and agile cybersecurity specialists, alongside
    the risk that standalone discovery and compliance platforms face feature commoditization. Without verified gross margin
    and retention data, the sustainability of BigID's product moat remains an open diligence question.
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  - CV010
  - CV011
  tableRefs:
  - TV002
- id: financing-history-and-secondary-pricing
  title: Financing History and Secondary Pricing Dynamics
  body: BigID's capitalization trajectory reflects the broader boom-and-compression cycle of late-stage enterprise cybersecurity
    software. Following early seed backing of $2.1M in 2016, BigID raised successive institutional venture rounds, culminating
    in a reported $1.25B post-money valuation after its Series D and a $1.01B valuation during its March 2024 growth financing.
    However, market evidence indicates substantial valuation divergence. QuantLogix's private company valuation model places
    BigID's equity value at $271.85M as of October 2026, representing a 49% discount against its last disclosed private financing
    mark of $531.53M. More critically, an arms-length secondary market print was executed at an implied enterprise value of
    $187.63M in June 2026, receiving heavy weighting in private market index pricing. This steep multiple compression from
    peak unicorn levels demonstrates that liquidity providers and secondary buyers demand substantial valuation discounts
    in the absence of an immediate IPO path or audited financial disclosures.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV008
  - CV012
- id: scenario-analysis-and-returns
  title: Valuation Scenarios and Downside Return Profiles
  body: Underwriting BigID requires calibrating return expectations across distinct operating scenarios against its estimated
    $108M annual recurring revenue baseline. In a bull case scenario (15% probability), accelerated enterprise adoption of
    AI data governance modules and international expansion drive ARR above $160M, enabling a public exit or strategic acquisition
    at a premium software multiple of 5.0x to 6.5x ARR ($800M to $1,050M enterprise valuation). In the base case (55% probability),
    BigID maintains steady enterprise retention with revenue growing at 15% to 20% toward $125M–$135M ARR, commanding a normalized
    market multiple of 3.0x to 3.8x ARR ($375M to $510M valuation). In the bear case (30% probability), commoditization of
    basic DSPM capabilities, heightened customer churn, and hyperscaler bundling compress growth below 10%, forcing transactions
    into the secondary valuation band of $150M to $200M (1.5x to 2.0x ARR). Given the presence of senior liquidation preferences
    from later funding rounds, common equity holders face severe impairment in any downside outcome.
  claimRefs:
  - CV001
  - CV002
  - CV004
  - CV005
  - CV012
  - CV014
  tableRefs:
  - TV003
- id: recommendation-and-diligence-path
  title: Investment Recommendation and Diligence Action Items
  body: 'We assign BigID an investment recommendation of research-more with medium confidence, a high risk rating, and a valuation
    stance of fair at secondary discount. While BigID possesses undeniable technical depth in sensitive data discovery and
    automated compliance, current public evidence is insufficient to justify new capital allocation at headline venture marks.
    Investors should only consider participating at steep secondary market discounts below $250M enterprise value, where the
    entry multiple offers adequate compensation for liquidity and capital structure opacity. Prior to underwriting any transaction,
    institutional investors must complete three mandatory diligence tasks: first, verify an audited capitalization table to
    map senior liquidation preferences and potential dilution overhang; second, obtain cohort-level Net Revenue Retention
    and gross margin figures to confirm SaaS unit economics; and third, validate contract renewal rates among top enterprise
    logos.'
  claimRefs:
  - CV001
  - CV002
  - CV004
  - CV007
  - CV012
  - CV014
  tableRefs:
  - TV001
  figureRefs:
  - FV001
tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Metric / Dimension
  - Assessment
  - Evidence Base
  - Decision Implication
  rows:
  - - Investment Recommendation
    - Research-More
    - Severe divergence between historical $1B+ rounds and $187.6M secondary print; unverified NRR and margin metrics.
    - Withhold new growth capital; do not buy at headline unicorn marks without audited financial and cap-table disclosures.
  - - Confidence Level
    - Medium
    - Corroborated market signals from QuantLogix, Sacra, and SV Investclub, but zero public GAAP filings.
    - Underwrite only with substantial margin of safety; maintain strict secondary entry discipline.
  - - Risk Rating
    - High
    - Capital structure opacity, senior liquidation preference overhang, and high-multiple legacy valuation.
    - Requires explicit downside protections, liquidation waterfalls, and verified customer renewal metrics.
  - - Valuation Stance
    - Fair at Secondary Discount
    - Secondary model print of $187.6M to $271.9M reflects market-clearing multiple compression vs $1.25B peak.
    - Fair value only under secondary discount (<$250M EV); unsupportable at headline venture marks (> $500M).
  notes: Recommendation synthesizes secondary transaction data, third-party revenue models, and cap-table opacity; not investment
    advice.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV012
  - CV014
- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Investment Thesis (Bull Case)
  - Anti-Thesis (Downside Risk)
  - What Would Change View
  rows:
  - - Market & Product Moat
    - Unified DSPM, data discovery, and AI governance platform protecting petabyte-scale hybrid environments across 100s of
      data stores.
    - Crowded DSPM and cybersecurity market with aggressive competition from hyperscalers and specialized security vendors.
    - Independent customer churn data and head-to-head win-loss ratios in tier-1 enterprise bakeoffs.
  - - Financial & Revenue Scale
    - Third-party estimates show $108M to $139.5M ARR baseline with established enterprise software customer base.
    - Lack of audited GAAP financials, unknown gross margin profile, and potential services revenue inflation.
    - Audited financial statements showing software gross margins above 75% and positive operating cash flow.
  - - Valuation & Multiple Reality
    - Opportunity to enter high-growth data security asset at deep secondary market discount (<$250M EV vs $1.25B peak).
    - Earlier venture rounds established onerous senior liquidation preferences that leave junior equity impaired in mid-tier
      exits.
    - Full cap-table transparency demonstrating manageable liquidation preference stack for incoming equity.
  - - Regulatory Tailwinds
    - Proliferating global data privacy laws and new AI safety mandates (e.g., NY RAISE Act) compel enterprise budget allocation.
    - Regulatory compliance tools face commoditization and budget pressure when integrated into broader suite platforms.
    - Contract cohort analysis proving standalone DSPM module expansion and durable annual contract values.
  notes: Thesis evaluation contrasts company product positioning against third-party valuation prints and governance risks.
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007
  - CV010
  - CV011
  - CV012
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key Operating Assumptions
  - Implied ARR & Multiple Logic
  - Valuation Range
  - Probability Signal & Downside Triggers
  rows:
  - - Bull Case
    - ARR accelerates above $160M driven by enterprise AI governance module adoption; NRR exceeds 115%; gross margin > 75%.
    - Re-rated at 5.0x–6.5x forward ARR multiple in line with top-tier cybersecurity software peers.
    - $800M – $1,050M
    - 15% probability; triggered by verified enterprise AI governance tier-1 deployments and successful IPO filing.
  - - Base Case
    - ARR grows moderately at 15–20% reaching $125M–$135M; NRR stabilizes at 100–105%; margin compression from cloud hosting
      costs.
    - Normalized software multiple of 3.0x–3.8x ARR reflecting growth-stage private cybersecurity comps.
    - $375M – $510M
    - 55% probability; triggered by steady compliance renewals alongside competitive pressure on new enterprise logos.
  - - Bear Case
    - ARR stagnates below $100M amid DSPM commoditization and hyperscaler native tooling; customer churn increases; senior
      preferences overhang.
    - Distressed or fire-sale secondary multiple of 1.5x–2.0x ARR reflecting illiquidity and cap-table impairment.
    - $150M – $200M
    - 30% probability; triggered by secondary market prints at $187.6M, executive departures, or enterprise vendor consolidation.
  notes: Scenario modeling assumes estimated $108M ARR base; multiples reflect private data-security comps as of October 2026.
