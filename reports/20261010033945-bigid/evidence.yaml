evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Current ARR, recognized revenue, NRR, gross margin, services mix, customer count, concentration, burn, cash, and
      runway.
    whyItMatters: >-
      These metrics determine growth quality, capital efficiency, liquidity, and whether the dated private valuation
      remains economically relevant.
    diligencePath: >-
      Obtain audited financials, monthly management accounts, bank statements, ARR bridge, renewal cohorts, and
      customer-concentration schedules.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Verified current executive roster, board and committee membership, decision-rights, succession plans, and material
      leadership changes.
    whyItMatters: >-
      Public titles do not establish governance control, management depth, or resilience to founder or executive
      departure.
    diligencePath: >-
      Review the organization chart, employment records, board minutes, committee charters, delegated-authority matrix,
      and succession plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: >-
      Fully diluted ownership, current investor holdings, board rights, liquidation preferences, debt or structured
      terms, secondaries, and option overhang.
    whyItMatters: >-
      Named investors and gross funding totals do not reveal control, preference stacks, dilution, or proceeds available
      to the company.
    diligencePath: >-
      Obtain the certified cap table, charter, stock purchase agreements, debt schedules, side letters, option ledger,
      and secondary-transfer history.
    relatedQuestionRefs:
      - QO003
      - QO006
      - QO007
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: identity-and-funding
    missingEvidence: >-
      Reconciliation of the 2015 versus 2016 founding dates and the $246.1 million, $256.1 million, and $308 million
      cumulative-funding figures.
    whyItMatters: >-
      Conflicting dates and totals can distort company age, financing history, dilution analysis, and liquidity
      assumptions.
    diligencePath: >-
      Verify incorporation records and reconcile every financing close, extension, debt instrument, and secondary
      transaction to legal documents.
    relatedQuestionRefs:
      - QO001
      - QO003
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited segmentation of BigID's annual recurring revenue across DSPM, privacy compliance, and AI governance
      product modules.
    whyItMatters: >-
      Without module-level revenue attribution, calculating BigID's precise serviceable obtainable market (SOM) versus
      broader market TAM remains an estimate based on third-party estimates.
    diligencePath: >-
      Review internal management reporting on ACV by module, net retention by buyer segment, and product-level churn
      data during confidential diligence.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: market-share
    missingEvidence: >-
      Independent analyst consensus on market share across standalone DSPM vendors versus converged cybersecurity
      platforms.
    whyItMatters: >-
      Estimates of BigID's 8% market share in privacy compliance do not separate legacy compliance tool spend from
      greenfield cloud DSPM and AI governance investments.
    diligencePath: Acquire full Gartner MQ and IDC market scape research notes covering DSPM and AI-SPM platform market shares.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM001
  - type: private-evidence-only
    severity: material
    topic: pricing-tradeoffs
    missingEvidence: >-
      Audited enterprise discount schedules, modular price lists, and contract duration metrics across mid-market and
      enterprise customer cohorts.
    whyItMatters: >-
      Without transparent pricing schedules or realized discount data, buyers and underwriters cannot reliably model net
      revenue retention or total cost of ownership against alternatives like Cyera and Varonis.
    diligencePath: >-
      Request customer contract samples, standard rate cards, and modular add-on pricing tables from BigID sales
      leadership during formal diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cogs-breakdown
    missingEvidence: >-
      Detailed audited breakdown of subscription gross margins, cloud scanning infrastructure costs, and professional
      services delivery drag.
    whyItMatters: >-
      High compute intensity for scanning petabytes of data across customer hybrid clouds could compress software gross
      margins below the 75%+ standard for enterprise SaaS.
    diligencePath: >-
      Request audited GAAP income statements and management accounts segregating hosting compute, third-party connector
      licenses, and customer success personnel.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: net-revenue-retention-and-churn
    missingEvidence: Annual cohort-based net revenue retention, gross revenue retention, and expansion attach rates by product module.
    whyItMatters: >-
      Without disclosure of customer expansion and logo churn, underwriters cannot verify whether ARR growth is driven
      by efficient expansion or high-churn replenishment.
    diligencePath: >-
      Request multi-year cohort retention schedules, logo churn data, and module attach rate metrics from the virtual
      data room.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-operating-runway
    missingEvidence: Current cash balance, monthly net cash burn rate, credit facility obligations, and operating runway as of 2026.
    whyItMatters: >-
      While historical funding totaled $320M and 2020 commentary claimed multi-year runway, current cash position and
      operating burn determine immediate capital dependency and dilution risk.
    diligencePath: >-
      Examine latest balance sheet, monthly cash flow statements, and debt maturity schedules provided by company
      management.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: system-performance
    missingEvidence: >-
      Audited third-party performance benchmarks and resource consumption metrics for petabyte-scale agentless scanning
      across on-premises legacy data stores versus cloud data warehouses.
    whyItMatters: >-
      Without independent benchmarking, enterprise buyers cannot evaluate scan overhead, query latency impact on
      production databases, or cost tradeoffs of continuous vs scheduled discovery.
    diligencePath: >-
      Request customer deployment telemetry and vendor-led proof-of-concept runtimes measuring CPU, memory, and database
      I/O utilization during full initial crawl and incremental scans.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: commercial-durability
    missingEvidence: >-
      Verified disclosure of active enterprise customer counts, dollar-weighted net revenue retention (NRR), gross
      renewal rates (GRR), and top-ten customer revenue concentration.
    whyItMatters: >-
      Without audited retention and concentration metrics, underwriters cannot distinguish durable platform expansion
      from high customer churn masked by new logo acquisition.
    diligencePath: >-
      Request management's historical customer cohort bridge, annual renewal rate schedules, and customer concentration
      breakdown under non-disclosure agreement.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table sample limitations
    missingEvidence: >-
      Comprehensive production customer roster detailing deployment scale, active seat licenses, and contracted ARR
      across enterprise verticals.
    whyItMatters: >-
      Public case studies highlight successful flagship outcomes but represent a curated sample that may not reflect
      average customer deployment health or attrition rates.
    diligencePath: >-
      Review anonymized customer engagement telemetry and reference call list covering both successful and troubled
      customer implementations.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: primary-legal-records
    missingEvidence: >-
      Primary regulator, court, enforcement, and official statutory materials addressing BigID-specific legal or
      regulatory matters.
    whyItMatters: >-
      Company commentary and buyer guidance cannot establish litigation status, enforcement history, or legal
      applicability.
    diligencePath: >-
      Run jurisdiction-specific regulator and court-record review, obtain counsel's scope memo, and reconcile findings
      to customer contracts.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-and-operating-resilience
    missingEvidence: >-
      Audited cash, burn, runway, gross margin, retention, customer concentration, support performance, and staffing by
      function.
    whyItMatters: >-
      Funding history and headcount estimates do not establish liquidity, unit economics, customer durability, or
      execution capacity.
    diligencePath: >-
      Request audited financials, current management accounts, cap table, cash bridge, cohort retention, concentration
      schedule, organization chart, and service-level history.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: independent-control-assurance
    missingEvidence: >-
      Independent control reports, certification scope, penetration-test findings, material incident history, connector
      uptime, and remediation evidence.
    whyItMatters: Company-issued control statements do not prove operating effectiveness or the absence of incidents.
    diligencePath: >-
      Review current SOC and certification reports under NDA, sample exceptions, inspect incident and vulnerability
      logs, and validate remediation closure.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-retention-metrics
    missingEvidence: >-
      Audited cap-table detailing liquidation preferences, senior debt tranches, and Net Revenue Retention (NRR)
      cohorts.
    whyItMatters: >-
      Without senior preference disclosure, common and secondary equity valuation cannot be underwritten against
      down-round or liquidation scenarios.
    diligencePath: >-
      Request confidential cap-table breakdown, investor rights agreements, and audited trailing-twelve-month cohort
      retention tables.
    relatedQuestionRefs:
      - QV008
