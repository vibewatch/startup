callouts:
  - calloutType: risk
    title: Public scale metrics do not reconcile
    body: >-
      Cumulative funding differs by more than $60 million across retained sources,
      and current operating metrics are not publicly supported. Underwriting should
      use company records rather than selecting the most favorable public estimate.
    claimRefs: [CO007, CO008, CO009, CO010, CO011]
