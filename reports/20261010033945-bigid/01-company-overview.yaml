  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: >-
        Current ARR, recognized revenue, NRR, gross margin, services mix, customer
        count, concentration, burn, cash, and runway.
      whyItMatters: >-
        These metrics determine growth quality, capital efficiency, liquidity, and
        whether the dated private valuation remains economically relevant.
      diligencePath: >-
        Obtain audited financials, monthly management accounts, bank statements, ARR
        bridge, renewal cohorts, and customer-concentration schedules.
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO001]
    - type: enumeration-incomplete
      severity: material
      topic: leadership
      missingEvidence: >-
        Verified current executive roster, board and committee membership,
        decision-rights, succession plans, and material leadership changes.
      whyItMatters: >-
        Public titles do not establish governance control, management depth, or
        resilience to founder or executive departure.
      diligencePath: >-
        Review the organization chart, employment records, board minutes, committee
        charters, delegated-authority matrix, and succession plan.
      relatedQuestionRefs: [QO002]
      relatedTableRefs: [TO002]
    - type: enumeration-incomplete
      severity: material
      topic: stakeholders
      missingEvidence: >-
        Fully diluted ownership, current investor holdings, board rights, liquidation
        preferences, debt or structured terms, secondaries, and option overhang.
      whyItMatters: >-
        Named investors and gross funding totals do not reveal control, preference
        stacks, dilution, or proceeds available to the company.
      diligencePath: >-
        Obtain the certified cap table, charter, stock purchase agreements, debt
        schedules, side letters, option ledger, and secondary-transfer history.
      relatedQuestionRefs: [QO003, QO006, QO007]
      relatedTableRefs: [TO003]
    - type: conflicting-data
      severity: material
      topic: identity-and-funding
      missingEvidence: >-
        Reconciliation of the 2015 versus 2016 founding dates and the $246.1 million,
        $256.1 million, and $308 million cumulative-funding figures.
      whyItMatters: >-
        Conflicting dates and totals can distort company age, financing history,
        dilution analysis, and liquidity assumptions.
      diligencePath: >-
        Verify incorporation records and reconcile every financing close, extension,
        debt instrument, and secondary transaction to legal documents.
      relatedQuestionRefs: [QO001, QO003, QO007]
