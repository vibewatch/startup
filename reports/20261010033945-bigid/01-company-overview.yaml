company:
  name: BigID
chapter:
  number: 1
  title: Company Overview
  summary: >-
    BigID is a private, New York-based enterprise data security, privacy, compliance,
    and AI-governance software company led by co-founders Dimitri Sirota and Nimrod
    Vax. Public sources support a March 2024 financing near $60 million at a $1.01
    billion post-money valuation, but disagree materially on cumulative funding,
    founding year, and workforce scale.
sections:
  - id: identity-and-platform
    title: Identity and platform
    body: >-
      BigID is a private enterprise software company headquartered in New York. Most
      structured profiles date its founding to 2016, although narrative text on two
      of those same profile surfaces says 2015, so the incorporation and operating
      start dates should not be treated as settled without company records. The
      company describes a unified data security and compliance platform spanning
      discovery, classification, DSPM, DLP, access governance, privacy, labeling,
      deletion, remediation, and AI governance across cloud, SaaS, on-premises, and
      development environments. That breadth indicates an enterprise platform
      strategy rather than a single-purpose privacy tool, while the official claims
      remain vendor assertions rather than independently tested performance.
    claimRefs: [CO001, CO002, CO003, CO013, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Dimitri Sirota and Nimrod Vax remain the identifiable founder anchors. Public
      profiles list Sirota as chief executive and Vax as chief product officer, with
      finance, revenue, marketing, and customer functions represented in the broader
      executive roster. The founders' identity-management background is directly
      relevant to the original privacy and personal-data discovery thesis, but the
      accessible evidence does not establish decision-rights, succession depth, or
      a fully verified current board roster. Governance diligence should therefore
      distinguish visible functional coverage from actual authority and should test
      whether product vision, customer relationships, or fundraising remain
      unusually concentrated in either founder.
    claimRefs: [CO004, CO005, CO016]
    tableRefs: [TO002]
  - id: financing-scale-and-stakeholders
    title: Financing, scale, and stakeholders
    body: >-
      The clearest recent financing reference is the March 2024 round: Forge reports
      $61.44 million at a $1.01 billion post-money valuation, while another profile
      rounds the raise to $60 million at the same valuation. Cumulative funding is
      not comparably stable. Tracxn reports $308 million, Silicon Valley Investclub
      reports $256.1 million, and Forge narrative text reports $246.1 million; these
      are recorded totals, not cash available. Workforce estimates also differ by
      source and period, with 639 for Q1 2026 and a Tracxn display of 575 "as of Sep
      26" without an explicit year. ARR, NRR, margins, profitability, burn, cash,
      runway, active production customers, and concentration remain unsupported by
      the assigned evidence.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO016]
    tableRefs: [TO003]
  - id: milestones-and-diligence-implications
    title: Milestones and diligence implications
    body: >-
      The public chronology shows a 2016 seed launch, institutional rounds in 2018
      and 2019, a December 2020 Series D at a reported $1 billion post-money
      valuation, and the March 2024 growth financing at $1.01 billion. This sequence
      supports late-stage status, but it does not demonstrate present liquidity,
      growth quality, or IPO readiness. Forge states that BigID has not officially
      endorsed an IPO plan, and its page labels market activity limited while
      cautioning that private-market data are not audited. The most important next
      step is management-document reconciliation: incorporation records, the fully
      diluted cap table, financing documents, board minutes, audited financials,
      headcount by function, and a customer cohort export.
    claimRefs: [CO006, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
