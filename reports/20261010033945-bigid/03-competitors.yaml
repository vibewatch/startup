      - "CP006"
      - "CP009"
  - calloutType: "insight"
    title: "High Switching Barriers in Complex Hybrid Estates"
    body: "BigID's deep integrations with catalogs like Collibra and ServiceNow, combined with its rare support for legacy mainframes and on-premises file structures, create durable account stickiness that shields it from being easily displaced by cloud-only DSPM entrants."
