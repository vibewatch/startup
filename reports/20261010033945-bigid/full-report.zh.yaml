      - number: '7.4'
        title: 伙伴、财务与监测风险
        blocks:
          - type: paragraph
            body: >-
              平台宣称的广度意味着它持续依赖客户系统、连接器质量、API、专业实施资源和政策维护。独立买方指南警告，API 变化可能破坏自动化，集成修复责任必须写入合同。BigID
              的覆盖面越广，需要验证的接触面越多，但它没有量化连接器在线率、支持响应或修复成功率。财务韧性同样未解：指定资料提供员工数和融资历史指标，却没有经审计的现金、消耗、跑道、利润率、留存或客户集中度。已筹资金不等于可用现金。监测应聚焦生产扫描可靠性、误报率、关键连接器可用性、支持积压、人员稳定性和流动性；这些指标恶化会击穿执行逻辑。
