      - number: '5.4'
        title: AI 治理、开发者流程与技术风险
        blocks:
          - type: paragraph
            body: >-
              随着企业开发拥抱生成式 AI 和自主代理，BigID 将安全态势管理扩展到 AI 训练管线、向量数据库和开发环境。2026 年 4 月，BigID 把 DSPM 扩展到 Markdown（.md）指令文件，识别出
              vibe coding 流程中的关键安全暴露：开发者会把内部 API 密钥、数据库架构和专有架构写入 Claude skills、Cursor rules 和 Copilot
              系统提示词。除开发者文件外，BigID 的 AI 安全管理还能发现影子 AI 模型、评估训练数据暴露并监控代理权限。但尽调必须区分数据层态势情报与运行时模型遏制。BigID
              能看见已连接数据集和身份访问路径，但厂商明确承认，平台不会独立认证其符合纽约 RAISE Act 等前沿 AI 要求，也不开展灾难风险评估或提供运行时模型执行护栏。
            claimRefs:
              - CE007
              - CE013
              - CE014
      - number: '5.5'
        title: 展示
        blocks:
          - type: callout
            title: 无代理架构与深度微服务关联
            body: BigID 通过微服务和 MongoDB 在多云环境中运行容器化发现，与传统基于代理的端点发现拉开差距，也不必在企业基础设施中安装侵入式端点代理。
            calloutType: strength
            claimRefs:
