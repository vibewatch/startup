  - id: FE001
    title: 产品架构图
    type: stack
    summary: BigID Data Security Platform 从基础设施到 AI 治理的六层架构。
    data:
      layers:
        - label: 企业数据源与存储库
          detail: 多云对象存储（AWS S3、Azure Blob、GCS）、关系型数据库、SaaS 平台和开发者代码存储库。
        - label: 无代理数据摄入与连接器层
          detail: 基于连接器的发现无需本地主机代理运行，避免云数据回传和高额终端开销。
        - label: 分类与智能引擎
          detail: 分布式微服务利用 ML 分类器和 MongoDB 聚合框架进行上下文关联。
        - label: 持久化与数据服务层
          detail: MongoDB Atlas 集群部署，配合分片、副本集和 Amazon EKS 上的 Terraform 自动化。
        - label: 策略、修复与治理工作流
          detail: 自动掩码、编辑、数据保留执行、访问治理（DAG）和监管合规报告。
        - label: AI 治理与开发者保护面
          detail: AI 安全态势管理（AISPM）、针对 vibe coding 的 Markdown 指令扫描和提示词暴露跟踪。
    claimRefs:
      - CE003
      - CE006
      - CE007
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 企业采用路径：从暗数据发现，经自动化合规，扩展到多云安全和 AI 治理。
    approximationNotes: 阶段和扩张循环综合自 BigID 部署模式、定价披露和客户评论反馈。
    claimRefs:
      - CU001
      - CU003
      - CU008
      - CU011
    data:
      items:
        - label: 1. 数据发现与审计
          stage: 评估与 PoC
          buyer: CISO / Data Privacy Officer
          surface: Agentless scanning of structured databases and cloud storage (AWS, Snowflake)
          expansionLoop: Baseline discovery reveals unmapped PII and dark data exposure, justifying enterprise budget
          detail: 初始试点通常聚焦敏感数据发现和合规准备。
        - label: 2. 初始生产部署
          stage: 核心实施
          buyer: SecOps / Compliance Lead
          surface: On-premises file shares, Microsoft 365, Box, and enterprise repositories
          expansionLoop: Cataloging personal data enables automated DSAR and regulatory mapping workflows
          detail: 企业以至少六位数的承诺部署核心数据智能平台。
        - label: 3. 工作流自动化
          stage: 运营化
          buyer: Privacy Operations / Legal
          surface: DSAR orchestration, consent tracking, and automated RoPA reporting
          expansionLoop: Compliance automation demonstrates immediate operational labor savings
          detail: 客户增加专门的隐私模块，例如自动完成 DSAR。
        - label: 4. 数据生命周期与最小化
          stage: 优化
          buyer: Data Engineering / Cloud FinOps
          surface: Azure Data Lake Gen2, NAS, and multi-cloud object storage
          expansionLoop: ROT data deletion yields direct infrastructure and cloud storage cost reductions
          detail: 停用冗余数据带来可量化的 ROI，增强高管支持续约的意愿。
        - label: 5. DSPM 与访问治理
          stage: 安全扩张
          buyer: CISO / IAM Architecture
          surface: User access monitoring, data access governance, and agentless DLP
          expansionLoop: Monitoring sensitive data movement prompts cross-functional expansion into active SecOps
          detail: 平台使用从被动分类扩展到主动执行访问策略。
        - label: 6. AI 治理与态势
          stage: 战略扩张
          buyer: Head of AI / Chief Data Officer
          surface: LLM training pipelines, vector databases, copilots, and shadow AI detection
          expansionLoop: GenAI initiatives require continuous model dataset cleansing and compliance auditing
          detail: 企业接入 BigID，治理对话式 AI 和代理式数据访问。
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 对投资论点最关键的四项风险，进行影响、可能性、缓解措施成熟度和剩余严重性的定性评估。
    data:
      columns:
        - 影响
        - 可能性
        - 缓解措施成熟度
        - 剩余严重性
      rows:
        - label: 混合部署与分类器调优
          values:
            - label: 高
              tone: negative
              detail: 进度、成本和数据覆盖失败可能延迟生产价值。
            - label: 高
              tone: negative
              detail: 独立指引和一份经核实的评论都指出复杂性和误报问题。
            - label: 低-中
              tone: warning
              detail: 概念验证（PoC）有所帮助，但没有客户群结果。
            - label: 高
              tone: negative
              detail: 需要经测量的准确率、进度和服务证据。
        - label: 安全控制鉴证
          values:
            - label: 严重
              tone: negative
              detail: 产品围绕敏感数据、身份和权限运行。
            - label: 中
              tone: warning
              detail: 没有已确认的事件；暴露风险来自运营环境。
            - label: 公司声称
              tone: warning
              detail: 分配材料中没有控制措施和认证声明的独立证据。
            - label: 中高
              tone: negative
              detail: 独立鉴证和事件历史仍待核实。
        - label: 裁员后的执行能力
          values:
            - label: 高
              tone: negative
              detail: 连接器维护、支持和路线图交付依赖人力。
            - label: 偏高
              tone: warning
              detail: 一份资料称员工人数下降，裁员约 20%。
            - label: 未核实
              tone: warning
              detail: 这里没有当前职能人员或服务数据的公开信息。
            - label: 高
              tone: negative
              detail: 需要组织、积压、路线图和 SLA 证据。
        - label: RAISE Act 直接适用性
          values:
            - label: 适用时为高
              tone: warning
              detail: 受覆盖的开发者需承担框架和事件报告义务。
            - label: 有条件
              tone: neutral
              detail: BigID 的评论称，普通企业使用不会自动受到覆盖。
            - label: 仅为指引
              tone: warning
              detail: BigID 明确声明不提供独立合规认证。
            - label: 中
              tone: warning
              detail: 法务顾问必须厘清范围及产品声明所带来的影响。
        - label: 连接器与 API 依赖
          values:
            - label: 高
              tone: negative
              detail: 覆盖缺口可能带来手工工作，也可能让敏感数据陷入盲区。
            - label: 高
              tone: negative
              detail: 广泛接入数据资产需要持续维护。
            - label: 买方可控
              tone: warning
              detail: 概念验证（PoC）和修复责任归属可以把风险敞口控制在一定范围内。
            - label: 高
              tone: negative
              detail: 本报告没有公开连接器的正常运行时间和恢复表现。
        - label: 财务与流动性不透明
          values:
            - label: 高
              tone: negative
              detail: 流动性压力可能限制路线图、保障能力和支持服务。
            - label: Unknown
              tone: warning
              detail: 指定证据缺少经过审计的现金、现金消耗和现金跑道数据。
            - label: 未验证
              tone: warning
              detail: 融资历史不能证明有可用现金。
            - label: 高
              tone: negative
              detail: 需要经审计的财务报表和现金变动桥接表。
    approximationNotes: 所有评级均为定性综合判断，不是建模得出的概率；没有找到已引用的事故，并不代表事故没有发生。
    claimRefs:
      - CR016
  - id: FV001
    title: 建议决策逻辑流程
    type: flow
    summary: 五步决策链串起 BigID 的企业级规模、收入信号、二级市场折价、股权结构悬置因素，最终落到投资建议。
    data:
      nodes:
        - id: scale-proof
          label: 企业级规模与 DSPM 覆盖
          detail: 在 100 多个数据存储中开展 PB 级数据发现和 AI 治理。
        - id: revenue-signals
          label: 预估收入基线
          detail: $108M ARR 模型，历史风险投资估值为 $1.01B-$1.25B。
        - id: secondary-discount
          label: 二级市场定价现实
          detail: QuantLogix 估算为 $271.9M，二级市场成交价为 $187.6M（折价 -49%）。
        - id: cap-overhang
          label: 股权结构与优先权不确定性
          detail: 清算优先权未披露，且存在稀释悬置因素。
        - id: valuation-stance
          label: 审慎的估值立场
          detail: 只有在大幅二级市场折价下（<$250M EV）才算合理；$1B+ 的估值无法支撑。
        - id: decision-gate
          label: 建议：进一步研究
          detail: 在经审计的 NRR 和股权结构披露前，暂缓投入增长资本。
      edges:
        - from: scale-proof
          to: revenue-signals
        - from: revenue-signals
          to: secondary-discount
        - from: secondary-discount
          to: cap-overhang
        - from: cap-overhang
          to: valuation-stance
        - from: valuation-stance
          to: decision-gate
    approximationNotes: 综合市场信号与治理风险的定性决策流程。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV009
      - CV012
      - CV014
