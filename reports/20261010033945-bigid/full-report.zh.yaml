      - number: '3.4'
        title: 护城河韧性、转换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              BigID 的竞争护城河主要来自其对复杂企业数据织体的深度集成，以及替换已嵌入数据资产清单所需的高转换成本。它原生接入 Alation、Collibra 等企业数据目录，Snowflake、Databricks
              等云数据平台，以及 ServiceNow CMDB
              等运营系统，嵌入跨职能合规、安全和治理流程。但这层防御也面临明显替代风险。企业用户反馈和竞品评估反复指出：大型环境扫描性能下降、界面复杂、专业服务周期长，都是持续的运营负担。行业数据泄露研究还显示，漏洞利用和机器身份权限过大，正推动企业转向主动收缩访问权限和实时
              DLP，而不是静态发现目录。如果 BigID 的修复能力和云端运营速度跟不上，提供自动实时脱敏和即时 API 态势修复的新兴竞品可能把它降格为后台目录工具。
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 云原生挑战者带来的 DSPM 替代压力
            body: >-
              BigID 虽然深耕混合环境，但 Cyera（2026 年 6 月融资 6 亿美元后估值 120 亿美元）和 Sentra 提供摩擦更低的无代理部署及更快的云端见效速度，威胁 BigID
              在公有云优先企业中的续约扩张。
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP009
          - type: callout
            title: 复杂混合数据资产带来的高转换壁垒
            body: BigID 深度集成 Collibra、ServiceNow 等目录，并罕见地支持传统大型机和本地文件结构，因此形成持久的客户黏性，不易被纯云 DSPM 新进入者替代。
            calloutType: insight
            claimRefs:
