      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              部署质量是最直观的运营风险。RFP.wiki 建议用买方自身环境测试来源覆盖、分类准确性、集成深度和责任归属；其类别指南称，简单 SaaS
              部署可能需两周，混合环境可能超过六个月，服务和定制集成还可能使软件许可成本增加 30-50%。这些是类别指引，不是 BigID 的实测平均值。BigID 的具体信号仍需警惕：RFP.wiki
              标记大型环境扫描慢、误报多，一位经核实的 SoftwareReviews 评审者也独立指出界面笨重、误报多且成本高。历史报道还显示 BigID
              围绕企业控制部署设计，因此当前架构和运营责任必须作为关键尽调事项，而不是默认前提。
            claimRefs:
