  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别定义与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              界定 BigID 的市场边界，需要把自动化数据发现和数据安全态势管理（DSPM）与通用治理目录、网络安全边界及人工隐私流程区分开。BigID 将平台定位为覆盖多云、本地部署和 AI
              环境的敏感个人及企业数据识别、分类与修复工具。纳入的企业支出包括数据发现许可、DSPM 订阅、隐私合规自动化和新兴 AI
              数据安全治理模块；排除的支出包括交易数据库许可、硬件防火墙、端点检测设备以及为监管抗辩聘请的外部法律顾问。在企业环境中，现状替代方案通常不是直接软件竞品，而是云厂商原生标签、零散人工表格和临时扫描脚本，这些做法无法提供跨系统可见性或关联分析。
            claimRefs:
              - CM001
              - CM004
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM013
      - number: '2.2'
        title: 市场测算视角、增长速度与可触达支出
        blocks:
          - type: paragraph
            body: >-
              评估 BigID 的商业机会，需要多种测算视角，而不是一个笼统的总可寻址市场（TAM）。数据安全与隐私科技的行业风险投资在 2021 年达到 $15b（150 亿美元）高点，说明 GDPR 和 CCPA
              执行后，隐私与态势工具吸引了大量资本。独立分析师估计，更广义的隐私合规与数据管理软件 TAM 为 $4.0b-$5.5b（40 亿至 55 亿美元）；随着多司法辖区要求扩大，预计到 2026 年年复合增长率超过
              20%。其中，管理 PB 级数据资产的 Global 2000 企业，其自动化 DSPM 和 AI-SPM 服务可寻址市场（SAM）约为 $2.5b-$3.5b（25 亿至 35 亿美元）。Sacra 估计
              BigID 2024 年 ARR 为 $108m（1.08 亿美元），显示其在该类别已有较强存在感，并与同类厂商共同占据隐私合规软件约 8% 的市场份额。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
          - type: figure
