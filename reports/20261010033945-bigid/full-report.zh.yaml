            body: >-
              BigID 是一家总部位于纽约的私营企业软件公司。多数结构化资料将其成立年份记为 2016 年，但其中两份资料的叙述文字又写作 2015
              年；在拿到公司记录前，不能把注册和开始运营日期视为定论。公司称其提供覆盖云、SaaS、本地部署和开发环境的统一数据安全与合规平台，功能包括发现、分类、DSPM、DLP、访问治理、隐私、标记、删除、修复和 AI
              治理。这种覆盖面说明其走的是企业平台路线，而不是单一隐私工具；官方说法仍只是厂商自述，未经独立测试验证。
