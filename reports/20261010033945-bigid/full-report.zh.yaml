      - number: '2.3'
        title: 企业买方分层、采购渠道与预算归属
        blocks:
          - type: paragraph
            body: >-
              企业采购 BigID 时，预算分散在网络安全、法律合规和企业数据管理部门。新建安全部署的主要高管买方是首席信息安全官（CISO）或云安全副总裁，他们从网络安全运营预算中为 DSPM
              提供资金，以降低数据泄露影响面。隐私自动化模块则常由首席隐私官（CPO）或总法律顾问出资，用于自动处理数据主体访问请求（DSAR）并满足法定审计要求。在数据管理成熟的组织中，首席数据官（CDO）采购
              BigID，用自动分类标签丰富企业数据目录。采购路径越来越多地利用 AWS 和 Microsoft Azure 云市场私有报价，以及与 Thales 等基础设施伙伴的战略联盟，部署一体化数据令牌化和保护方案。
            claimRefs:
              - CM001
              - CM007
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM007
              - CM010
              - CM012
      - number: '2.4'
        title: 采用驱动因素、治理阻力与估值含义
        blocks:
          - type: paragraph
            body: >-
              BigID 的市场扩张受多项长期顺风推动，包括多司法辖区严格执行隐私法规、非结构化数据呈指数增长以及企业采用生成式 AI。EU AI Act 等复杂 AI 法规落地后，训练语料卫生和 copilot
              访问治理受到严格审视，也打开了 AI-SPM 的新增机会。但采用阻力同样明显。除非组织具备足够的运营治理成熟度和资源，能够修复发现的风险、分配数据所有权并追踪数据血缘，否则单独做敏感数据发现的 ROI
              有限。此外，OneTrust、Securiti 等成熟网络安全平台和治理套件竞争加剧，推动厂商整合。二级市场观察也反映出这一点：私募估值倍数已从早期独角兽高点压缩至更保守的成长阶段基准。
            claimRefs:
              - CM002
              - CM004
              - CM008
              - CM009
              - CM011
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 采用瓶颈：治理落地与单纯发现
            body: 敏感数据发现和 DSPM 能识别企业数据资产的风险态势，但如果不部署配套治理框架，买方往往难以落实修复、分配数据管理责任或自动追踪血缘。
            calloutType: risk
            claimRefs:
              - CM004
              - CM008
          - type: callout
            title: 监管要求演进推动 DSPM 与 AI 治理统一
            body: 企业合规支出正从 GDPR、CCPA 等区域数据隐私法规，扩展到 EU AI Act 等完整 AI 治理框架；BigID 的可触达范围也从监管合规延伸至主动式 AI 安全态势管理。
            calloutType: insight
            claimRefs:
              - CM002
              - CM007
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              BigID 面临四类竞争者：专门的 DSPM 平台、上市数据安全龙头、综合隐私与治理套件，以及实时修复或数据丢失防护（DLP）专家。BigID
              最初凭企业数据发现和隐私自动化建立市场地位；随着企业采购部门把预算从单纯合规目录转向主动降低数据风险和保护云数据，隐私运营与安全态势的边界逐渐融合。云原生 DSPM 挑战者 Cyera、Sentra
              等强调快速无代理接入、高保真非结构化数据分类和实时检测，避免传统目录软件沉重的部署负担。上市龙头 Varonis 则凭借本地文件系统和 Microsoft 365 的深厚基础，借 Atlas 框架进入 AI
              安全。企业替代方案名单还显示，中型市场买方常评估 DataGrail、MineOS、Enzuzo 等轻量隐私合规厂商及更广泛的基础设施管理商，替代路径非常多元。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP008
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: 核心竞品画像与市场规模
        blocks:
          - type: paragraph
            body: >-
              将 BigID 与主要市场替代方案比较，可以看到不同的架构理念和资本路径。上市竞品 Varonis 拥有经审计的企业收入和广泛分销，重点做文件活动监控、权限修复和 Microsoft Purview
              集成，并推出专门的 AI 安全态势模块。相比之下，Cyera 是数据安全领域资本最充足的私营挑战者之一：2026 年 6 月以 120 亿美元估值融资 6 亿美元，用于在公有云、AWS 环境和 SaaS
              应用中扩展 PB 级无代理发现。纯数据安全态势赛道的 Sentra 以安全为核心，提供持续发现、数据检测与响应（DDR）以及身份感知访问治理，瞄准被旧目录架构扫描疲劳困扰的组织。隐私治理领域的 OneTrust
              在合规框架覆盖、Cookie 同意和供应商风险能力上占优，但多模块部署往往也带来企业用户在 BigID 上指出的运营复杂度。Strac 等实时厂商则专注于 SaaS、端点和 GenAI
              流程中的实时数据检查与修复。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP011
      - number: '3.3'
        title: 能力矩阵与商业取舍
        blocks:
          - type: paragraph
            body: >-
              能力对标凸显了传统发现覆盖面与云优先运营敏捷性之间的取舍。包括 Forrester Wave 敏感数据发现与分类报告在内的独立评估，认可 BigID 在混合环境和传统大型机中的发现能力并将其列为 Leader；但
              Gartner 的 2026 Magic Quadrant 在 DSPM 中将 BigID 列为 Challenger，而非 Leader。BigID
              把自动生成处理活动记录（RoPA）、数据主体请求（DSR）和敏感数据分类结合起来，覆盖面很广，但商业套餐完全按报价销售，价格并不透明。相比之下，Cyera 在 AWS Marketplace
              公布了结构化容量档位：25 terabytes 的年费从 $50,000 起，250 terabytes 为 $250,000，采购团队更容易判断入场成本。Varonis 的云 DSPM 估计收费为 $3 至
              $6 per terabyte monthly；Enzuzo、Drata 等小型隐私工具的入门方案低于 $10,000 annually。竞品研究显示，BigID 的独立模块（如 DSAR 履行）可达
              $35,000 per year，给追求快速见效的中型团队带来采购阻力。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP010
