            title: Vibe coding 指令暴露与 AI 治理边界
            body: BigID 虽已把 DSPM 扩展到 Markdown 指令和 AI 提示词监控，但企业治理仍受限：它提供数据可见性和访问情报，而不是自主灾难风险认证或运行时前沿模型遏制。
            calloutType: risk
            claimRefs:
