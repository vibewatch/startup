  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键运营假设
      - 隐含 ARR 与倍数逻辑
      - 估值范围
      - 概率信号与下行触发因素
    rows:
      - - 乐观情景
        - 企业采用 AI 治理模块，推动 ARR 加速超过 $160M；NRR 超过 115%；毛利率 > 75%。
        - 参照顶级网络安全软件同行，按未来 ARR 的 5.0x–6.5x 倍数重估。
        - $800M – $1,050M
        - 15% 概率；由经核实的一线企业 AI 治理部署和成功提交 IPO 申请触发。
      - - 基准情景
        - ARR 温和增长 15–20%，达到 $125M–$135M；NRR 稳定在 100–105%；云托管成本挤压利润率。
        - 标准化软件倍数为 ARR 的 3.0x–3.8x，反映成长阶段私营网络安全公司的可比倍数。
        - $375M – $510M
        - 55% 概率；由合规续约保持稳定、同时新增企业客户承受竞争压力触发。
      - - 悲观情景
        - DSPM 商品化、超大规模云厂商原生工具挤压市场，ARR 停滞在 $100M 以下；客户流失增加，高级优先权形成拖累。
        - 反映流动性不足和股权表受损，按 ARR 的 1.5x–2.0x 困境或甩卖二级市场倍数计价。
        - $150M – $200M
        - 30% 概率；由二级市场成交价达到 $187.6M、高管离职或企业供应商整合触发。
    notes: 情景建模假设 ARR 基准估算为 $108M；倍数反映截至 2026 年 10 月的私营数据安全可比公司。
