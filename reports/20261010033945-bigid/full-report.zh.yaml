  - id: FM001
    title: BigID 可触达市场分层与市场捕获视角
    type: pyramid
    summary: 从广义隐私 / 安全资本流入延伸至当前 ARR 捕获量估算的分层测算视角。
    data:
      items:
        - label: 全球隐私与安全初创公司资本
          value: $15B
          detail: 隐私和网络安全初创公司的行业风险投资峰值（2021 年）。
        - label: 广义数据保护与隐私软件 TAM
          value: $10B+
          detail: 全球企业在隐私合规、发现和治理软件上的支出估算。
        - label: 核心企业 DSPM 与隐私 SAM
          value: $2.5B–$3.5B
          detail: 自动化敏感数据发现、分类和 DSPM 的可服务市场。
        - label: AI 治理与 AI-SPM 扩张层
          value: $1.0B–$1.5B
          detail: EU AI Act 和 LLM 数据管道安全推动的新兴企业预算分配。
        - label: BigID 高适配度企业目标 SOM
          value: $500M–$750M
          detail: 在拥有复杂混合云数据足迹的 Global 2000 企业中的可服务可获得市场。
        - label: BigID 估算收入运行率
          value: $108M
          detail: 据 Sacra 报道，2024 年 ARR 估算相当于可触达隐私合规份额的 ~8%。
    approximationNotes: 广义市场总额反映行业 VC 和分析师估算；公司 ARR 层来自 Sacra 对 2024 年的估算。
    claimRefs:
      - CM003
      - CM005
      - CM006
      - CM014
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 对数据安全平台作定位比较，考察数据发现与治理广度，以及云原生安全和实时修复能力。
    approximationNotes: 分数为序数评级（1-10 分），来自 2026 年分析师评测定位（Forrester、Gartner）、评论聚合平台和供应商能力范围。
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
    data:
      xAxis:
        label: 数据发现与治理广度
        min: 0
        max: 10
      yAxis:
        label: 云原生安全与实时修复
        min: 0
        max: 10
      points:
        - label: BigID
          x: 9
          'y': 5.5
          note: 覆盖混合环境和大型机的领先发现广度，结合原生隐私治理与新兴 DSPM。
        - label: Varonis
          x: 8
          'y': 7.5
          note: 拥有深厚的企业安装基础，数据保护和 Atlas AI 安全成熟，但传统部署足迹更重。
        - label: Cyera
          x: 7
          'y': 9
          note: 快速增长的云原生 DSPM 领导者，提供无代理 PB 级发现，并积极扩展安全平台。
        - label: Sentra
          x: 6.5
          'y': 8.5
          note: 专注于云和混合环境的数据安全平台，将 DSPM、检测与响应及身份感知访问控制结合起来。
        - label: OneTrust
          x: 8.5
          'y': 4
          note: 占据主导地位的企业隐私与合规套件，GRC 工作流广泛，但数据安全控制不够明确。
        - label: Strac
          x: 5
          'y': 9.2
          note: 现代实时 DLP 和 DSPM 专业厂商，专注于 SaaS 和浏览器中的即时修复与 GenAI 提示词保护。
  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 从企业数据资产发现到多模块 ARR 和毛利的递进路径。
    data:
      nodes:
        - id: node-1
          label: 企业数据资产
          detail: 客户接入云、SaaS 和本地数据源
        - id: node-2
