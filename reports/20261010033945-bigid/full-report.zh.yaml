              - CR016
      - number: '7.2'
        title: 监管、法律与控制保障风险
        blocks:
          - type: paragraph
            body: >-
              BigID 宣传覆盖隐私、合规、访问治理和 AI
              治理的控制。其网站称可本地部署、不回传或复制到云端，并列出认证和范围限定的访问控制，但这些是公司发布的表述，不是指定证据池中的独立保障证据。独立买方指南还指出其弱点包括界面笨重、定价不透明和长期合同承诺，因此应通过控制设计、测试结果、事故历史和合同条款评估风险。纽约
              RAISE Act 并非对企业软件厂商的普遍要求：BigID 法律评论称直接义务取决于是否属于前沿开发者，并明确表示 BigID 不认证合规。应由法律顾问判断适用性；现有证据既不能认定违规，也不能给出清白结论。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
          - type: table
            tableRef: TR001
