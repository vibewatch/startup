  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台范围与核心数据安全模块
        blocks:
          - type: paragraph
            body: >-
              BigID 将产品组织为综合数据安全平台（DSP），把原本分散的数据职能统一到一个控制面。平台不再分别提供发现、隐私运营和访问治理点状方案，而是协调
              DSPM、自动数据发现与分类、隐私和合规自动化、数据风险与修复及数据最小化。核心技术是 BigID 的专利分类引擎，部署数千个预训练、由机器学习监督的分类器，可用 100
              多种语言编目敏感、受监管和关键数据。引擎处理结构化关系表、半结构化对象存储和非结构化文档，覆盖 AWS、Azure、Google Cloud Platform 等多云环境以及本地数据中心。BigID
              把深度关联与内容分类结合起来，将数据资产映射到具体个人和业务领域，建立近似会计级的企业信息清单，无需人工标记或脆弱的模式匹配。
            claimRefs:
              - CE001
              - CE002
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
      - number: '5.2'
        title: 运营流程与企业用例
        blocks:
          - type: paragraph
            body: >-
              企业客户部署 BigID，用自动化政策执行和持续数据态势可见性替代耗时且易错的人工审计。传统环境依赖定期静态脚本发现敏感数据，安全团队因此看不到未编目的仓库、影子数据存储和凭据暴露。BigID
              将数据发现直接连接到数据访问治理（DAG）和数据活动监控（DAM），把防止数据泄露落到运营层面。其身份感知方法评估人类员工、机器身份、服务账户和自动化 AI
              代理的权限，标记凭据被盗时会扩大影响面的过度权限。平台还自动处理 DSAR、同意管理和数据保留执行等隐私合规义务。自动修复流程让安全与隐私团队能在分布式企业系统中执行动态遮蔽、选择性脱敏、限制访问和删除冗余数据。
            claimRefs:
              - CE004
              - CE005
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE007
              - CE010
      - number: '5.3'
        title: 底层架构与基础设施栈
        blocks:
          - type: paragraph
            body: >-
              BigID 是为混合多云和本地基础设施横向扩展而设计的分布式微服务平台。核心应用运行在 Amazon Elastic Kubernetes Service（EKS）编排的 Docker 容器中，并通过
              HashiCorp Terraform 基础设施即代码提供商自动化。架构上同时使用 MongoDB 和 MongoDB Atlas，作为灵活的文档持久层与计算服务器。BigID 大量依赖 MongoDB
              聚合框架、副本集和原生分片，在高吞吐数据流上执行涵盖关联、分类和元数据索引的深度发现管线。它采用无代理、基于连接器的模式，避免端点代理的部署负担和延迟。数据扫描与上下文推断在客户环境或云 VPC
              内本地进行，不把客户负载回传到厂商基础设施，从而满足严格的数据主权、FIPS 和 PCI 合规约束。
            claimRefs:
              - CE003
              - CE006
              - CE011
              - CE012
