  - id: funding-capital-structure
    title: Funding History and Capital Structure
    body: >
      Xingyun Group has raised approximately $950.9M in total funding across multiple rounds since
      2015. The angel round was provided by Zhongding Capital (钟鼎资本) for approximately 15M RMB,
      funding the initial SaaS system development. By November 2018, a Series B round of "tens of
      millions of USD" was co-led by Hongtai Aplus, Matrix Partners China, Eastern Bell Capital, and
      GSR United Capital. In August 2019, a Series B+ of $100M was raised from Matrix Partners China,
      Oriental Fortune Capital, Eastern Bell Capital, and Lan Fund. In September 2020, Xingyun closed
      a $200M Series C at a $2 billion post-money valuation, co-led by Taikang Insurance Group,
      Highlight Capital, and Zhongyuan Capital, with participation from GLP's Hidden Hill Capital,
      Morningside Venture Capital, Xingnahe Capital, C&D Group's investment arm, and Pantheon Asset.
      The largest round, Series C2 ($600M), closed in April 2021 led by Yunfeng Capital (云锋基金) with
      Crescent Point, Harvest Fund Management, 5Y Capital, Taikang, and Matrix China as
      participants—confirming unicorn status with a post-money valuation exceeding $2B (Grokipedia
      separately cites $3B, unconfirmed by other sources). A Later Stage VC round of undisclosed
      amount closed in July 2025, bringing estimated total funding to $950.9M and current valuation to
      $2.2B per secondary-market data. The investor base includes over 30 top-tier institutions,
      notably the National SME Development Fund (国家中小企业发展基金, a Ministry of Finance vehicle),
      reflecting both private and state-backed capital support. Xingyun's capital efficiency ratio is
      approximately 2.35x (valuation to funding). The Polibeli de-SPAC transaction (valued at $3.6B)
      provided an implied partial monetization of Xingyun's ~50% Polibeli stake, which as of August
      2025 was worth approximately $2.1B at market prices.
