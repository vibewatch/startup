company:
  name: Xingyun Group (行云集团)
chapter:
  number: 1
  title: Company Overview
  summary: >
    Xingyun Group (行云集团), legally 深圳市天行云供应链有限公司, is a Shenzhen-based B2B cross-border
    digital supply chain unicorn founded in May 2015 by Wang Wei (王维). The company has raised
    approximately $951M across multiple rounds, achieved a $2.2B valuation as of July 2025, and
    reached Fortune China 500 status for three consecutive years. Its subsidiary Polibeli Group Ltd
    completed a $3.6B de-SPAC merger and began trading on Nasdaq (PLBL) on August 8, 2025. Key risks
    include a 2026 CSRC enforcement action against founder Wang Wei for disclosure violations and
    ongoing governance controversies at its newly acquired A-share subsidiary 行云科技 (SZ300209).

sections:
  - id: identity-and-business-model
    title: Identity and Business Model
    body: >
      Xingyun Group (行云集团), whose legal entity is 深圳市天行云供应链有限公司 (Shenzhen Tianxingyun Supply
      Chain Co., Ltd.), was founded in May 2015 in Shenzhen, China. The company describes itself as
      "a global internet e-commerce leader and a leading comprehensive services platform for global
      commodities in China," with a stated mission of "让全球买卖变得更简单" ("Making global trade simpler").
      Xingyun operates a one-stop B2B digital supply chain covering cross-border import services
      (helping overseas brands enter the Chinese market), export services (helping Chinese brands go
      global), cross-border logistics, customs clearance, supply chain finance, and digital platforms.
      Its product portfolio includes LinkieBuy—a SaaS platform integrating WeChat and Alipay
      mini-programs for overseas brands in China—EC Mall, LinkieSCRM, and Flexcreate (print-on-demand,
      launched February 2025). The company's international holding structure uses Xingyun International
      Company Limited as the Cayman Islands parent; its Southeast Asia B2B arm Polibeli Group Ltd
      achieved a Nasdaq listing in August 2025. Xingyun operates from Shenzhen, Hangzhou, Shanghai,
      Hong Kong, and Singapore; has presence in 72 countries and one region; maintains 139
      self-operated or partner warehouses globally; and serves 3,000+ overseas brands and 160,000+
      domestic retailers. The company's revenue model blends agency fees, logistics margins, and SaaS
      subscription and service fees. GMV exceeded 500 billion RMB in 2025, though reported net
      revenue of approximately $42.3M in 2024 per GetLatka data, reflecting the difference between
      gross merchandise volume and fee-based revenue recognition.
