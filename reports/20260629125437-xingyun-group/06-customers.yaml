  - id: named-customer-proof
    title: Named Customer Proof and Deployment Evidence
    body: >
      Xingyun Group's strongest customer evidence comes from the LinkieBuy platform's published case
      studies for overseas brands entering China. BigC (Thailand), a BJC Group hypermarket chain with
      over 1,500 Thai stores, deployed LinkieBuy's WeChat mini-program and cross-border DTC solution and
      achieved a 60%+ repurchase rate from private-domain users, 3,711%+ month-on-month GMV growth, and
      60x AI+SCRM operation conversion year-on-year. These outcomes are self-reported in case studies on
      LinkieBuy's official website and corroborated by the IoT M2M Council's third-party coverage of
      LinkieBuy's Tencent Smart Retail partnership. Swisse (Australia), branded Australia's No. 1 health
      and nutrition brand, reached ¥100M+ annual GMV at scale through Xingyun's omni-channel layout
      including PDD, WeChat, and offline channels; its cranberry capsule SKU sold 7,000+ units in a single
      3.8 festival event. For Japanese fashion brand Yohji Yamamoto, LinkieBuy built a WeChat mini-program
      cross-border DTC channel that accumulated 150,000+ private domain users in six months, with 30%+
      monthly GMV growth in the first year. The entertainment case study for Star Siam (Thailand concerts)
      showed 75% conversion in the first month with 219,000 CNY in first-concert sales and zero operating
      cost. For Daimaru Matsuzakaya (Japan) and Seibu Department Store, LinkieBuy digitalized offline
      retail to capture Chinese tourist commerce through WeChat/mini-program solutions. On the Chinese
      export side, Deli Group, Bull, Muzen, Leqi, and others are named as production-deployment partners
      since 2021, primarily operating through TikTok overseas, Shopee/Lazada marketplace channels, and
      offline KA (key account) retail distribution. However, for export-side Chinese brands, no
      quantified outcome metrics have been published; partnerships are confirmed through official
      milestone pages and the Frost & Sullivan award citation but lack third-party outcome verification.
