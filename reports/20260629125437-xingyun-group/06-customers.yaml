  - id: retention-concentration
    title: Retention Proxies, Concentration Risks, and Adverse Signals
    body: >
      Xingyun Group's customer durability presents a bifurcated picture. On the import-side (overseas
      brands to China), the BigC case study's 60%+ repurchase rate from private domain users and the
      ongoing multi-year relationships with brands like Swisse and Yohji Yamamoto suggest meaningful
      retention, though these are company-reported metrics without independent audit. Contract lengths
      for SaaS and agency services have not been publicly disclosed, and no NRR figure has been
      published for the LinkieBuy segment. On the export-side SME channel (Polibeli), the adverse
      signals are more concrete: Polibeli's revenue declined 12.6% in FY2025 versus FY2024, and the
      20-F explicitly warns that "as many of Polibeli's customers are SMEs, they are more susceptible
      to changes in the general economic condition… Polibeli may experience a high turnover rate of
      its customers." This constitutes a first-party adverse admission. The geographic concentration
      risk is extreme: Japan contributed ~52% and Indonesia ~38% of Polibeli's 2024 revenue, meaning
      90%+ of Polibeli revenue derives from just two markets. Vietnam was launched in August 2023 to
      diversify but remains a minor contributor. An external regulatory adverse signal materialized in
      May 2026 when Indonesia's Trade Ministry announced plans to revise Minister of Trade Regulation
      No. 31/2023 following widespread MSME complaints about high administrative and logistics fees
      on digital platforms—a change that could directly affect Polibeli's cost structure and seller
      retention in its single largest growth market. Additionally, Polibeli's CFO Zhang Zhitian resigned
      in May 2026 for personal reasons, with CEO Hua Chen temporarily assuming finance responsibilities
      until a new CFO (Liang Meijun) was appointed in June 2026. The dual-class share structure
      maintained via the SPAC merger means Xingyun International controls 99.19% of Polibeli voting
      power, limiting independent board governance. For Xingyun Group's domestic retail channel,
      the 500,000 SME retailer figure has not been independently verified with active-user counts
      or cohort retention data, and there is no public evidence of average customer lifetime value
      or churn rate across segments.
