  - id: adoption-trajectory
    title: Adoption Trajectory and Scale Metrics
    body: >
      Xingyun Group's adoption trajectory shows strong historical GMV growth alongside evidence of
      monetization limitations and recent Polibeli revenue contraction. At the group level, Xingyun's
      reported GMV grew from ¥13.5B (2019) to ¥23B (2020) to over ¥500B (2025), though the gap between
      GMV and fee-based revenue (approximately $42.3M per GetLatka data for 2024) reflects the
      agency/intermediary nature of its business model. The 3,000+ brands served and ~500,000 SME
      retailers represents the cumulative platform enrollment figure confirmed at Xingyun's May 2025
      10th anniversary event (independently cited by Hurun Baijia present at the celebration) and
      in the Frost & Sullivan 2023 award citation. Polibeli—the most closely tracked revenue entity
      given its Nasdaq public disclosure—grew revenue 32.7% year-on-year in 2024 to $30.23M, but
      then declined 12.6% in 2025 to $26.42M. This contraction is a material adoption signal: the
      20-F attributes it to the use of a low-price strategy to build Indonesia market presence and
      the inherently high turnover rate of SME customers in emerging markets. The 20-F also notes that
      Polibeli remains loss-making, with net losses of $10.98M (2024) and $5.97M (2025), and identified
      two material weaknesses in internal controls as of December 31, 2025. Platform-level KPIs—
      registered users, monthly active users (MAU), repeat order frequency—have not been publicly
      disclosed by Polibeli or Xingyun, creating a key diligence gap. The membership tier system on
      Polibeli App and the Polisales App (field sales CRM targeting retention through daily tasks for
      sales representatives) represent structural retention mechanisms, but their efficacy is not
      quantified in any public disclosure.
