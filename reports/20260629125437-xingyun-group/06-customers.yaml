company:
  name: Xingyun Group (行云集团)
chapter:
  number: 6
  title: Customers
  summary: >
    Xingyun Group serves three distinct customer tiers across its cross-border digital supply chain
    ecosystem: 100+ overseas brands entering China via the LinkieBuy SaaS platform (with documented
    production deployments for BigC, Swisse, and Yohji Yamamoto), 400+ Chinese brands expanding
    globally via its OCP export platform (including Deli Group, Bull, Muzen), and ~500,000 SME
    retailers served through the Polibeli B2B digital wholesale platform in Southeast Asia and Japan.
    The most actionable adverse signal is Polibeli's 12.6% revenue decline from $30.23M (2024) to
    $26.42M (2025), disclosed in its NASDAQ-filed 20-F, combined with acknowledged internal-control
    material weaknesses and Indonesia's regulatory revision driven by MSME fee complaints in May 2026.

sections:
  - id: customer-segmentation
    title: Customer Segmentation and Ecosystem Map
    body: >
      Xingyun Group operates a three-tier customer ecosystem that spans both sides of the cross-border
      trade equation. The first tier—overseas brands entering China—is served by the LinkieBuy subsidiary,
      which provides WeChat mini-program SaaS storefronts, private-domain operation, CRM, logistics, and
      live-streaming marketing to help international brands capture Chinese consumer demand. As of its 2023
      strategic upgrade, LinkieBuy has signed cooperation agreements with over 100 well-known brands
      spanning Japan, Thailand, Australia, Europe, and Hong Kong, including Yohji Yamamoto, BigC (Thailand),
      Swisse (Australia), CATALO (Hong Kong), and TheNose/Fuji (Netherlands). LinkieBuy has also been
      formally recognized as a Tencent Smart Retail partner in the "Thousand Domains Program," enabling
      service to Japanese department stores including Daimaru Matsuzakaya and Seibu. The second tier—Chinese
      brands going global—is served through Xingyun's OCP (Omni-Channel Platform) export service. As of
      July 2021, Xingyun had established outbound strategic partnerships with over 400 well-known Chinese
      consumer brands, including Deli Group (得力), Bull (公牛), Muzen/Cat King (猫王), Leson (乐森), By-Health
      (汤臣倍健), 1MORE, Leqi (乐其), and New Zealand Mystery (纽西之谬). The third tier—SME retailers and
      distributors globally—is served by the Polibeli platform in Southeast Asia and Japan and by Xingyun's
      domestic channel in China. Polibeli's primary customer profile is offline SME store owners in
      Indonesia, Vietnam, and Japan who use the Polibeli App to digitize their procurement, manage inventory,
      and access supply chain finance. Indonesia represents approximately 38% of Polibeli's 2024 revenue
      and Japan approximately 52%, with Vietnam in active expansion since August 2023. Collectively, Xingyun
      claims to serve 3,000+ domestic and international brands and nearly 500,000 online and offline SME
      retailers across 72+ countries, supplying approximately 150,000 SKUs across consumer goods, beauty,
      maternal-infant, health, electronics, and lifestyle categories.
