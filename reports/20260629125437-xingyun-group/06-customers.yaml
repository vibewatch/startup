      - CU036

  - calloutType: insight
    title: 90%+ Geographic Concentration in Japan and Indonesia Creates Polibeli Fragility
    body: >
      Polibeli's Japan (52%) and Indonesia (38%) combined revenue share of 90%+ as of FY2024
      creates binary geographic risk. Vietnam was launched in August 2023 as a diversification
      move, but its revenue contribution remains immaterial. If Indonesian regulatory changes
      or Japan market conditions deteriorate simultaneously, Polibeli could face severe
      operating stress, particularly given ongoing net losses and the recent CFO resignation.
    claimRefs:
      - CU014
      - CU017
      - CU024
      - CU033

acknowledgedWarnings:
  - dimension: figureType
    reason: >
      The planned retention/repeat cohort figure (cohort type) requires time-series retention
      percentages by customer vintage; Xingyun Group and Polibeli have not published cohort
      retention data in any public filing or case study. A bar figure (FU004) showing Polibeli's
      available geographic revenue split and YoY trend was substituted as the best available
      quantitative retention proxy supported by audited SEC disclosure. No cohort data exists
      to populate a retention cohort figure without fabrication.

