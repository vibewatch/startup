        - label: Overseas Brand Discovery
          description: >
            International brand (Japan/Thailand/Australia/EU) identifies China market opportunity;
            engages LinkieBuy or Xingyun agent for DTC market entry assessment.
        - label: Platform Onboarding
          description: >
            Brand signs SaaS + agency contract; WeChat mini-program mall and AI SCRM deployed
            (2–4 week implementation); Xingyun logistics supply chain connected.
        - label: First-Touch Sales
          description: >
            Private domain seeding, live-streaming launch on RED/Douyin/WeChat; initial GMV
