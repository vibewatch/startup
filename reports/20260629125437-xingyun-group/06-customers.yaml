  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named customer proof table - production deployment list completeness
      missingEvidence: >
        Full list of all 100+ LinkieBuy-signed brands with deployment status, production
        confirmation, outcome metrics, and contract tenure; outcome data for Chinese export
        brand partners (Deli Group, Bull, Muzen, Haier, etc.) is entirely absent.
      whyItMatters: >
        The TU003 enumeration covers only 6 documented deployments out of 100+ signed
        LinkieBuy brands and 400+ OCP partners. The depth and durability of the broader
        customer base cannot be assessed without production confirmation and outcomes
        for a representative sample beyond the featured case studies.
      diligencePath: >
        Request Xingyun/LinkieBuy to provide a complete roster of signed brands with
        deployment status, annual GMV contribution tiers, and at least 5 brand-side
        references willing to confirm production use. For OCP export partners,
        request quarterly revenue per brand tier for at least the past 2 years.
      relatedTableRefs:
        - TU003
      relatedQuestionRefs:
        - QU010
        - QU023

    - type: private-evidence-only
      severity: material
      topic: Polibeli customer count and cohort retention
      missingEvidence: >
        Polibeli has not disclosed active monthly user counts, registered retailer count by market,
        cohort retention rates, or net revenue retention (NRR) in any public filing, presentation,
        or press release.
      whyItMatters: >
        Without cohort-level retention data or active user counts, it is impossible to determine
        whether Polibeli's FY2025 revenue decline reflects a shrinking active customer base,
        reduced spend per customer, or mix shift — which would have materially different
        investment implications.
      diligencePath: >
        Request from Polibeli investor relations: (1) monthly active user count by market
        Q1 2023 to Q2 2026; (2) cohort retention curves for Indonesia and Japan retailer cohorts;
        (3) average revenue per active retailer per quarter; (4) churn rate definition and measurement.
      relatedQuestionRefs:
        - QU005
        - QU009
        - QU022

    - type: private-evidence-only
      severity: material
      topic: LinkieBuy NRR and brand contract renewal rates
      missingEvidence: >
        Xingyun/LinkieBuy has not published any NRR, brand contract renewal rate, or logo churn
        rate for the overseas brand (import to China) segment; all retention evidence is a single
        GMV-repurchase metric for BigC from company-owned case studies.
      whyItMatters: >
        SaaS and agency retention are central to the import-side valuation case. Without NRR,
        renewal rates, or multi-year brand continuation evidence, the durability of the 100+
        brand customer base is unverified.
      diligencePath: >
        Request from Xingyun: (1) brand logo churn rate and average contract tenure for LinkieBuy;
        (2) NRR or GRR by brand tier; (3) independent brand references from BigC, Swisse, or
        Yohji Yamamoto confirming multi-year active deployment.
