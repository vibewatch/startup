  - id: TU005
    title: Expansion and Concentration Risk Table
    columns:
      - Expansion Driver
      - Concentration Risk
      - Impact
      - Diligence Path
    rows:
      - - Polibeli SEA geographic expansion (Vietnam, Malaysia)
        - Japan (52%) + Indonesia (38%) = 90%+ of Polibeli 2024 revenue
        - Revenue shock if Japan sourcing relationships or Indonesian regulatory environment deteriorates
        - Request 3-year geographic revenue disaggregation per market and per customer tier
      - - LinkieBuy overseas brand expansion (100+ to broader pipeline)
        - Undisclosed concentration; top-few brands likely generate majority of SaaS/agency revenue
        - If anchor clients (BigC, Swisse) exit, agency revenue could drop sharply
        - Request brand-level revenue share, contract renewal rate, and logo churn data
      - - OCP Chinese export brands (400+ partnerships)
        - No single brand confirmed as >10% of OCP revenue; structural diversification
        - Structural breadth reduces concentration but depth of integration unverified
        - Confirm revenue contribution by brand tier; verify exclusivity and switching costs
      - - Indonesia e-commerce regulatory revision (May 2026)
        - "Regulatory risk: Trade Regulation 31/2023 revision driven by MSME fee complaints"
        - New rules could mandate lower platform fees, increasing Polibeli's cost-to-serve
        - Monitor Trade Ministry revision finalization; model Polibeli unit economics under fee caps
      - - Polibeli governance concentration (99.19% voting control by Xingyun International)
        - Board cannot act independently of Xingyun International on major decisions
        - Limits minority shareholder protection; could affect Polibeli's capital allocation
        - Assess independence of audit committee; review related-party transaction disclosures
    notes: "Geographic concentration figures from Polibeli 20-F FY2024. Regulatory risk from Indonesia Trade Ministry announcements May 2026 (Tempo.co, ANTARA, WorldEF). Voting concentration from Polibeli SEC EDGAR F-1 registration."
