callouts:
  - calloutType: risk
    title: Polibeli Revenue Contraction and SME Customer Churn Risk
    body: >
      Polibeli's revenue fell 12.6% from $30.23M (FY2024) to $26.42M (FY2025), disclosed in its
      NASDAQ 20-F. The filing explicitly acknowledges "high turnover rate" risk for SME customers.
      Combined with two material control weaknesses identified as of December 31, 2025, and the
      May 2026 Indonesian regulatory revision driven by MSME fee complaints, this is the most
      material customer-durability risk in the Xingyun ecosystem. No cohort-level NRR data has
      been published to contextualize whether the decline reflects market conditions, competitive
      pressure, or structural customer churn.
    claimRefs:
      - CU013
      - CU015
      - CU016
      - CU022
      - CU041

  - calloutType: strength
    title: BigC and Swisse Case Studies Provide Strongest Customer Proof
    body: >
      Of all named customers, BigC (Thailand) and Swisse (Australia) provide the strongest
      evidence of production deployment with quantified outcomes: BigC's 60%+ repurchase rate
      and 3,711%+ GMV month-on-month growth, and Swisse's ¥100M+ annual GMV, anchor the
      platform's value proposition. The IoT M2M Council's independent coverage of Daimaru
      Matsuzakaya and Seibu deployment provides the only non-Xingyun-sourced confirmation of
      production deployment, adding credibility to the overseas brand entry use case.
    claimRefs:
      - CU005
      - CU006
