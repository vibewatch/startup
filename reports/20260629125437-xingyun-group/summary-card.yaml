summary:
  headline: >
    Xingyun Group has real cross-border infrastructure, brand relationships, and optionality through Polibeli, but
    opaque parent financials, active governance/regulatory disputes, and a stretched implied valuation keep the
    investment view at research-more rather than buy.
  overallScore: 4.6
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
