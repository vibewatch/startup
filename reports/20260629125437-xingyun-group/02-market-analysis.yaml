    title: Market Sizing Pyramid — TAM/SAM/SOM Proxy Layers (2025, USD Billion)
    type: pyramid
    layout: standard
    summary: >
      Three proxy sizing layers from broadest China CBEC market to SEA cross-border and to
      China logistics sub-market, illustrating the narrowing of Xingyun's addressable revenue pool.
    data:
      nodes:
        - label: "TAM – China CBEC Market (IMARC)"
          value: "USD 90.85B (2025)"
