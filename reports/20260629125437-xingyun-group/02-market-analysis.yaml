  - id: adoption-constraints-and-risks
    title: Adoption Constraints and Market Risks
    body: >
      Several material constraints temper the growth narrative. The most significant near-term shock is
      the US termination of the de minimis exemption in May 2025, which applied 120% tariffs or
      USD 100–200 per postal shipment on China-origin parcels, triggering Temu's shift to US domestic
      sellers and forcing Chinese exporters to reroute toward Europe and emerging markets. The EU
      Parliament's March 2026 China delegation found that 91% of all small parcels entering Europe
      originate from China; MEPs raised concerns about structural overcapacities, systemic product
      safety risks, and insufficient platform oversight. The EU is reviewing elimination of its €150
      de minimis threshold, currently allowing approximately 4.5 billion Chinese parcels annually to
      enter duty-free. Protectionist sentiment is spreading: Vietnam terminated Temu in December 2024;
      Indonesia sought its removal from app stores in October 2024 to protect domestic SMEs. On
      infrastructure, Red Sea disruptions in 2024 lifted freight costs 30% and exposed maritime
      dependency; China-Europe rail volumes rose 10% in response but cannot fully substitute at scale.
      China's Data Security Law historically required domestic storage of all CBEC user and transaction
      data, raising overseas warehouse compliance costs—partially addressed by the June 2026 guideline.
      SEA's fragmented de minimis rules and import VAT structures create landed-cost opacity that
      dampens impulse purchases, particularly in Indonesia. Platform concentration—Shopee, Lazada, and
      TikTok Shop (including Tokopedia) controlling 98.8% of SEA e-commerce—limits distribution channel
      diversity for smaller sellers.
