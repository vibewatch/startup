callouts:
  - calloutType: risk
    title: US and EU De Minimis Changes Signal Structural Re-routing of CBEC Flows
    body: >
      The May 2025 US de minimis elimination and the pending EU €150 threshold review represent the most
      significant structural disruptions to China-to-developed-market CBEC in over a decade. Together, these
      changes are redirecting Chinese export flows toward SEA, the Middle East, and Latin America—exactly
      the corridors where Xingyun and Polibeli operate. This creates a near-term demand tailwind for
      emerging-market CBEC infrastructure, but also increases competition as displaced flows concentrate
      in markets with less logistics maturity.
    claimRefs:
      - CM031
      - CM032
      - CM033

  - calloutType: insight
    title: SEA Content Commerce and Mobile Wallet Penetration Are Demand Multipliers
    body: >
      Content commerce (TikTok Shop, Shopee Live) generated USD 49.7 billion GMV in SEA in 2025—32% of
      total platform GMV, up from 20% in 2024. Mobile e-wallet users are projected to reach 2.6 billion
      by 2025. These two forces create a structural demand pull for Chinese-origin goods and cross-border
      logistics, particularly in Xingyun's Polibeli B2B distribution segment serving SEA retailers who
      source Chinese inventory to fulfil social-commerce orders.
    claimRefs:
      - CM029
      - CM030

  - calloutType: recommendation
    title: Market Sizing Should Use Logistics Sub-Market, Not Aggregate CBEC Trade Value
    body: >
      Analyst TAM estimates for China CBEC range from USD 28 billion (logistics only, Mordor) to USD 90
      billion (total trade value, IMARC). For valuing a logistics and supply chain platform like Xingyun,
      the logistics sub-market estimate (USD 28–58 billion depending on scope) is the more relevant
      addressable pool. Investors should avoid anchoring to aggregate CBEC trade-flow figures that
      include upstream trade value Xingyun does not capture as revenue.
    claimRefs:
      - CM007
      - CM008
      - CM015

