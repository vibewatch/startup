  evidenceGaps:
    - type: missing-source
      severity: minor
      topic: regulatory-framework
      missingEvidence: >
        The June 2026 nine-department CBEC data-flow guideline's specific compliance cost
        reduction quantification for overseas warehouse operators has not been independently
        verified; only secondary reporting of the policy announcement is available.
      whyItMatters: >
        If the data-flow liberalisation only partially reduces compliance overhead or is
        constrained by security audit requirements, its value as a growth driver for
        overseas warehouse operators like Xingyun may be overstated.
      diligencePath: >
        Obtain the full text of the June 2026 guideline from China MOFCOM official channels
        and assess the permitted data categories, security audit obligations, and
        implementation timeline for overseas warehouse operators.
      relatedQuestionRefs:
        - QM009

    - type: private-evidence-only
      severity: material
      topic: sea-market-sizing
      missingEvidence: >
        Xingyun's disclosed SEA addressable revenue breakdown by country, product category,
        or segment within the Polibeli B2B platform is not publicly available; the total
        SEA B2B addressable market for Polibeli specifically cannot be isolated from the
        broader China-ASEAN CBEC corridor.
      whyItMatters: >
        Without segment-level revenue data from Polibeli, it is not possible to validate whether
        the USD 45–85 billion SEA CBEC market is the right sizing anchor or whether Polibeli's
        actual TAM is a fraction of this figure.
      diligencePath: >
        Request Polibeli 20-F annual report from SEC EDGAR once filed; cross-reference with
        Xingyun annual reports and investor presentations.
      relatedQuestionRefs:
        - QM021

    - type: missing-source
      severity: material
      topic: regulatory-framework
      missingEvidence: >
        The WTO E-Commerce Agreement requires 45 member instruments of acceptance for entry into
        force; as of June 2026 it is unclear how many instruments have been deposited and whether
        China has completed its domestic ratification procedure.
      whyItMatters: >
        If the ECA is not in force for China's key trading partners, the digital trade rules
        benefit may be years away rather than near-term, reducing its value as a growth driver.
      diligencePath: >
        Monitor WTO acceptance instrument tracker at wto.org; check China MOFCOM announcements
        for domestic ratification legislation.
      relatedQuestionRefs:
        - QM008

    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: >
        Analyst estimates for China CBEC logistics and SEA cross-border e-commerce diverge by
        2–3× across sources; the methodological differences (scope definitions, B2B vs B2C
        inclusion, logistics-only vs full transaction value) have not been reconciled by any
        independent meta-analysis.
      whyItMatters: >
        A USD 28B versus USD 58B logistics market implies materially different revenue ceilings
        for Xingyun's achievable market share and pricing power.
      diligencePath: >
        Request primary analyst reports (Mordor full report, GII full report) to compare
        definitions; triangulate using China Customs export-declared logistics fee data if
        available through MOFCOM channels.

    - type: missing-source
      severity: minor
      topic: market-boundary
      missingEvidence: >
        The precise compliance obligations and operational differences across customs codes 9610,
        9710, 9810, and 1210 have not been fully documented from primary regulatory sources;
        only secondary synthesis sources describe these distinctions.
      whyItMatters: >
        Xingyun's ability to serve different SME export models depends on its compliance
        posture across all four codes; unknown code-specific restrictions could limit TAM.
      diligencePath: >
        Fetch and review China General Administration of Customs official circulars for
        each of the four CBEC customs codes from http://www.customs.gov.cn/.
      relatedQuestionRefs:
        - QM012

