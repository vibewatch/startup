  - id: buyer-user-payer-segmentation
    title: Buyer-User-Payer Segmentation
    body: >
      Xingyun's commercial model serves three distinct buyer archetypes with divergent budget ownership
      and adoption paths. First, Chinese SME export sellers are the primary buyers of outbound logistics,
      customs clearance, and digital platform services; in this segment the buyer-payer is typically the
      SME general manager or owner, while the user is operations or logistics staff managing inventory
      and shipments. Over 120,000 CBEC market participants operated in China as of end 2024, with
      16,000 holding high-tech enterprise certification and more than 30,000 independent overseas brands
      developed with platform support—the tail of this base constitutes Xingyun's core seller addressable
      market. Second, overseas brands seeking China-market access are buyers of import services, SaaS
      platforms, and bonded-warehouse logistics; payer is the brand's headquarters while the buyer is a
      regional team or China-market manager. China-based CBEC platforms (Tmall Global, JD Worldwide)
      collectively host over 46,000 foreign brands from 90+ countries; Tmall Global reaches over 100
      million import consumers. Third, SEA regional distributors and B2B buyers—served by Xingyun's
      Polibeli Group—are procurement-driven; payer is the business owner or CFO, while the adoption
      trigger is price advantage versus local sourcing. Platform users in China's CBEC import channel
      reached 188 million in 2023, nearly tripling in seven years; 80% of urban consumers have bought
      imported products online and Gen Z (18–34) accounts for 65% of CBEC transaction volume.
    claimRefs:
      - CM016
