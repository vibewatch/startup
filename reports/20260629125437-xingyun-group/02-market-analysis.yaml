company:
  name: Xingyun Group (行云集团)
chapter:
  number: 2
  title: Market Analysis
  summary: >
    China's cross-border e-commerce (CBEC) market reached USD 90.85 billion in 2025 and the logistics
    sub-segment was valued at USD 28.28 billion, with both growing at double-digit CAGRs toward 2031.
    Southeast Asia—Xingyun's core outbound territory via Polibeli—represented USD 45.39 billion in
    cross-border GMV, expanding at 10.97% CAGR. Growth is driven by RCEP tariff cuts, China's 178-zone
    pilot ecosystem, and a June 2026 data-flow liberalisation, while the US de minimis elimination, EU
    regulatory pressure, and SEA market fragmentation represent the most material near-term constraints.

sections:
  - id: market-boundary-and-scope
    title: Market Boundary and Scope
    body: >
      The market relevant to Xingyun Group spans B2B digital supply chain services that enable cross-border
      goods flows—primarily China-export-to-emerging-markets corridors and overseas-brand-to-China import
      channels. The boundary includes three principal service layers: (1) export-side logistics, customs
      clearance, supply chain finance, and digital platform services for Chinese SME sellers targeting
      Southeast Asia, the Middle East, Africa, and Latin America; (2) import-side services enabling
      overseas brands to access Chinese consumers through bonded-warehouse and B2C platform channels
      such as LinkieBuy and EC Mall; and (3) adjacent SaaS and print-on-demand services that deepen
      seller stickiness. Excluded are pure domestic e-commerce, traditional bulk freight not linked to an
      e-commerce transaction, and direct B2C consumer retail where Xingyun acts as enabling infrastructure,
      not the merchant of record. China Customs formally classifies CBEC under codes 9610, 9710, 9810,
      and 1210, each carrying distinct logistics and compliance obligations. China's combined CBEC
      import-export volume reached RMB 2.75 trillion in 2025 (up from RMB 2.63 trillion in 2024),
      representing 6.3% of total national goods trade and a 69.7% increase versus 2020. Exports dominate
      at approximately 79% of CBEC volume; consumer goods account for 97.8% of export content.
      B2B transactions hold a 67% market share by value while B2C grows faster at approximately 25%
      YoY—reflecting the accelerating shift toward direct-to-consumer export models. China's CBEC
      sector already covers 26 million domestic businesses and Silk Road E-Commerce partnerships
      with 36 countries.
