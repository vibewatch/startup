  - id: growth-drivers
    title: Growth Drivers
    body: >
      Six structural forces underpin the market expansion in Xingyun's operating territory. First,
      China's CBEC pilot-zone ecosystem expanded to 178 comprehensive zones by end 2025, covering
      all 31 provincial-level regions; these zones provide bonded-warehouse access, streamlined customs,
      and VAT incentives that materially reduce SME fulfilment costs. Second, RCEP tariff reductions
      cut average tariffs on Chinese and Korean goods entering SEA by 4–8% since 2024, improving
      landed-cost competitiveness; Guangxi's CBEC-to-ASEAN trade more than doubled, with RCEP support
      cutting costs 15–20% and reducing delivery times to three days. Third, China's April 2026
      MOFCOM guidelines (jointly issued with five other authorities) embed CBEC in industrial policy,
      explicitly expanding Silk Road E-Commerce to 36 countries and mandating stronger platform
      responsibilities. Fourth, the June 2026 nine-department joint guideline permits orderly
      cross-border data flows for CBEC operators under controllable security conditions, removing
      a compliance barrier that historically forced costly domestic data storage. Fifth, the WTO
      E-Commerce Agreement, adopted by 66 members covering approximately 70% of global trade at
      MC14 on 28 March 2026, provides a global digital trade rules pathway; WTO and OECD research
      estimates non-implementation leaves USD 159 billion in annual trade unrealised. Sixth, SEA
      content commerce surged to USD 49.7 billion GMV in 2025 (32% of total platform GMV, up from
      20% in 2024), and mobile e-wallet transaction values are projected to reach USD 636 billion—
      both factors deepening demand for Chinese-origin goods and integrated logistics infrastructure.
      Chinese-owned overseas warehouses now number over 2,500, covering 30 million m², and overseas
      warehouse floor space grew 40% YoY in 2025.
