  name: "Xingyun Group (行云集团)"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    Xingyun Group's platform is anchored by the "行云全球汇" (Xingyun Global Exchange) four-flow
    middleware integrating logistics, commerce, capital, and information flows across 170+ logistics
    centers and 200+ e-commerce channels. Its three main consumer-facing technology arms are the
    Polibeli Platform (Polibeli App launched 2022 + Polisales App launched 2023 per SEC 20-F
    disclosure), the LinkieBuy SaaS cross-border entry-to-China solution integrating WeChat/Alipay/
    Douyin/RED, and the OCP brand-export platform. AI and RPA tools are deployed across image
    processing, billing, customs reconciliation, and shopping guidance with quantified efficiency
    gains. Key limitations include near-total third-party logistics dependence disclosed in the
    Polibeli 20-F, absence of any public developer API, and a nascent stablecoin fintech pilot
    still under regulatory approval.

sections:
  - id: platform-architecture-service-stack
    title: Platform Architecture and Service Stack
    body: >
      Xingyun Group's technology foundation is the "行云全球汇" (Xingyun Global Exchange) supply
      chain middleware, which the company describes as a "四流合一" (four-flow integration) system
      unifying logistics flow, commerce flow, capital flow, and information flow within a single
      operational backbone. This middleware connects over 170 logistics centers globally and
      interfaces with more than 200 e-commerce channels, enabling real-time data sharing between
      upstream brand owners, warehouse nodes, customs authorities, payment processors, and
      downstream retailers. The system architecture comprises three primary commercial arms built
      atop this middleware. First, the Xingyun Global Exchange B2B2C import platform links over
      2,000 overseas brand owners and distributors to 500,000+ domestic Chinese small and medium
      retailers through a catalog exceeding 150,000 SKUs in categories including maternity/baby,
      health/beauty, household goods, and food/beverage. Second, the Polibeli Platform—Xingyun's
      export-facing and Southeast Asia market solution—consists of two proprietary applications:
      the Polibeli App, a one-stop procurement platform for SME retailers launched in 2022 in
      Indonesia, and the Polisales App, a mobile CRM and sales management tool for sales
      representatives launched in 2023, both disclosed in the Polibeli Group 20-F filing. Third,
      LinkieBuy is a SaaS cross-border e-commerce platform designed for overseas brands—primarily
      from Japan, Thailand, Southeast Asia, and Europe—to establish digital retail presence in
      China through customized WeChat mini-program malls, Alipay cross-border storefronts, Douyin
      global shopping (抖音全球购), and Xiaohongshu/RED malls, with integrated SCRM (AI-powered
      social CRM), private domain operations, live-streaming, and advertising services. The
      行云数科 (Xingyun Digital Tech) entity, a wholly owned tech-focused subsidiary, operates the
      product commercialization arm and offers additional tools including B2B foreign trade malls,
      external trade integrated service (外综服) platforms, influencer-matching distribution
      platforms, supply chain management (SCM) systems, and the 税智汇 (Tax Intelligence Hub)
      compliance solution.
