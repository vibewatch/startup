  - id: trust-compliance-operational-limitations
    title: Trust, Compliance, Quality Controls, and Operational Limitations
    body: >
      Xingyun Group holds China's National High-Tech Enterprise (国家高新技术企业) certification
      and serves as the chairman-unit of the China Cooperative Trade Enterprise Association's
      Supply Chain Finance Branch (中国合作贸易企业协会供应链金融分会), reflecting recognized
      expertise in cross-border trade finance. The company's registered legal entity (深圳市天行云
      供应链有限公司) holds an ICP filing (粤ICP备15060915号). However, multiple material
      operational limitations are evident from public evidence. First, Polibeli Group's 20-F
      (FY2025, filed April 2026) explicitly acknowledges heavy reliance on third-party logistics
      providers, noting risk of service disruption from shipping capacity shortages, weather events,
      strikes, piracy, fuel price spikes, and port closures. Second, the 20-F discloses that
      Polibeli's IT systems—described as "technology infrastructure supporting the Polibeli
      Platform, digital solutions and intelligence services, and other digital services"—are
      protected by backup and security measures, yet remain vulnerable to viruses, DDoS traffic
      spikes, and physical/electronic intrusions; Item 16.K identifies cybersecurity as a material
      risk, and no independent SOC 2 or ISO 27001 certification is disclosed. Third, Polibeli
      relies entirely on third-party payment processors for its multi-method payment stack (cash
      on delivery, telegraphic transfers, cheques, digital wallets, credit/debit cards), and any
      processor outage or regulatory change could interrupt operations. Fourth, no public API
      documentation, SDK, or official GitHub repository was found for Xingyun Group or any of
      its products; external integrations appear to be partner-specific. Fifth, the stablecoin
      pilot (海丝智链) operates under the Hong Kong regulatory pilot framework and requires
      full licensing compliance; Xingyun holds only a 13% stake and operational outcomes depend
      on Guangzhou state-owned enterprise partners. Sixth, the complex and innovative technologies
      in Polibeli's digital solutions and intelligence services are explicitly acknowledged in the
      20-F as "new and require more time to prove their reliability and effectiveness," flagging
      product maturity risk for the export-facing platform.
