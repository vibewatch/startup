  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: compliance-certifications
      missingEvidence: >
        Independent third-party security audit (SOC 2 Type II or ISO 27001 certification)
        for Polibeli Group / Xingyun Group IT infrastructure and data handling practices.
      whyItMatters: >
        The absence of independent security certification is a diligence blocker for enterprise
        brand clients that require vendor security assurance, and limits investor confidence
        in the group's IT governance maturity.
      diligencePath: >
        Request SOC 2 Type II or equivalent audit report from Polibeli/Xingyun; check whether
        any certification is held by the 深圳市天行云供应链有限公司 entity in China's MLPS
        (Multi-Level Protection Scheme) framework.
      relatedQuestionRefs: [QE024]

    - type: missing-source
      severity: material
      topic: operational-risks
      missingEvidence: >
        Independent competitive benchmarking comparing Xingyun/Polibeli's platform capabilities,
        cost structure, and market share versus dedicated cross-border logistics platforms
        (e.g., Cainiao, 4PX, JD Logistics International) or integrated e-commerce operators
        (e.g., Anchanto, Anchanto).
      whyItMatters: >
        Without an independent competitive analysis, it is difficult to assess whether
        Xingyun's technology differentiation claims (especially the middleware and AI/RPA
        capabilities) represent genuine and durable competitive advantages or can be replicated
        by better-capitalized rivals.
      diligencePath: >
        Source analyst coverage from Gartner, iResearch, or Bloomberg Intelligence on
        China cross-border digital supply chain platforms; request management presentation
        with competitive positioning data; conduct structured interviews with brand clients
        who have used multiple platform providers.
      relatedQuestionRefs: [QE020]

    - type: missing-source
      severity: minor
      topic: linkiebuy-services
      missingEvidence: >
        Formal verification from Ant Group (Alipay) or Tencent (WeChat Pay) confirming
        LinkieBuy's claimed exclusivity as the sole Alipay cross-border e-commerce partner
        and/or main WeChat Pay cross-border partner.
      whyItMatters: >
        If the exclusivity claim is inaccurate, LinkieBuy's channel differentiation narrative
        is substantially weakened and competitive entry barriers are lower than presented.
      diligencePath: >
        Request written confirmation from Ant Group and Tencent; review terms of partnership
        agreements; check Ant Group or Tencent official partner directory listings.
      relatedQuestionRefs: [QE004]

