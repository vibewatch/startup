  - id: brand-services-export-logistics-infrastructure
    title: Brand Services, Export/Fulfillment, and Logistics Infrastructure
    body: >
      Xingyun Group's logistics infrastructure consists of 139 global cooperative and
      self-operated warehouses, with strategically located bonded facilities that form the
      physical anchor of its cross-border clearance capability. Key domestic bonded warehouse
      sites include the Yiwu Bonded Zone warehouse (10,000 m²), the Hangzhou Xiasha Bonded Zone
      warehouse (20,000 m²), and the Shenzhen Qianhai Bonded Port Area facility (8,000 m²), with
      additional domestic hubs in Shanghai, Ningbo, Pinghu, Fuzhou, Dongguan, Zhengzhou, Chongqing,
      Chengdu, Guangzhou, and Dalian. The one-stop cross-border logistics service covers bonded
      warehousing, loading/unloading, sorting, packaging, drop-shipping (一件代发), cross-border
      customs clearance, and last-mile distribution. For the import arm (brand services for overseas
      brands entering China), the customer workflow flows from overseas brand onboarding via LinkieBuy
      SaaS → order placement and goods dispatch from origin → Xingyun-managed bonded customs
      clearance → domestic bonded warehousing → consumer fulfillment via mini-program mall or
      distribution to 160,000+ domestic online and offline retailers. For the export arm (OCP brand
      export platform), Chinese brands are onboarded → digital storefronts set up across target
      market channels (TikTok, KA offline, overseas e-commerce) → Polibeli platform facilitates
      distribution to local SME retailers → in-market last-mile uses local third-party logistics
      carriers. The 行云货仓 (Xingyun Cargo) WMS—a self-developed SaaS warehouse management
      system with an open API interface—enables external retail partners to API-connect their own
      mini-program stores to Xingyun's bonded inventory, bonded customs data, and fulfillment
      operations. One documented case (gdte.org.cn, 2023) shows a large offline hypermarket chain
      achieving 150% month-on-month sales growth after migrating to Xingyun Cargo's SaaS WMS
      and replacing an externally purchased mini-program store with the open API connection. For
      brand services directed at Chinese brands going overseas, Xingyun's OCP (One China Platform)
      integrates TikTok full-service, overseas e-commerce TP (third-party operations) services,
      overseas marketing, and offline KA (key account) channel services, covering markets where
      local channel structure differs substantially: e.g., Southeast Asia has ~50% of retail
      concentrated in traditional small-shop channels, requiring Polibeli's 1,000-person on-the-
      ground sales team in Indonesia for penetration.
