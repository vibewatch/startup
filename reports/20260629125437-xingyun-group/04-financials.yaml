  - id: capital-adequacy-and-financing
    title: Capital Adequacy, Balance Sheet, and Financing Structure
    body: >
      The most materially adverse financial finding in this chapter is Polibeli Group's negative
      shareholder equity of -$45.42 million as of December 31, 2025, against total assets of
      $17.53 million and total liabilities of $62.95 million. This severely negative book value
      is not a transient accounting artifact: it reflects cumulative net losses and, most
      importantly, a large related-party and debt load not offset by asset accumulation. Cash on
      hand was approximately $1.8 million at year-end 2025, against operating cash outflow of
      $6.35 million in the same year—implying less than four months of runway without new capital
      or revenue recovery. Interest expense of $1.36 million in FY2025 (down from $1.85 million
      in FY2024) indicates ongoing debt service. Short-term borrowings stood at approximately
      $3.46 million at year-end 2025. The combination of negative equity, negative working capital
      (-$2.35 million), current ratio below 1.0 (0.88), and persistent operating cash burn
      constitutes a textbook going-concern risk profile under U.S. GAAP standards, particularly
      absent external rescue capital or a decisive revenue turnaround.

      For 行云科技, cash at year-end 2025 was RMB 877 million (~$121 million), a healthier absolute
      position, but this declined by RMB 249 million during 2025 as operating cash flow ran at
      -RMB 164 million for the full year. In Q1 2026, operating cash outflow accelerated to
      -RMB 374 million—nearly matching the full-year 2025 drain in a single quarter—largely
      driven by working capital build in the newly injected B2B trading operations, where accounts
      receivable ballooned to 193.76% of prior-year revenue. Short-term debt at 行云科技 stood at
      RMB 40 million at FY2025 year-end. The company disclosed plans to borrow RMB 100 million
      from shareholders to purchase overseas computing servers as part of its AI hardware pivot,
      adding financing dependency on related-party lending.

      At the Xingyun Group parent level, the most recent disclosed capital raise was the $600
      million Series C2 round led by Yunfeng Capital in mid-2021, bringing total disclosed
      fundraising to approximately $953.5 million. No subsequent capital raise has been disclosed.
      Given the 2025 Nasdaq listing of Polibeli (the SPAC merger valued at $3.6 billion at
      announcement), the group accessed public market capital, but no proceeds disclosure
      to Xingyun parent has been made public. Financing-dependency risk at the consolidated
      level is therefore high but structurally opaque.
