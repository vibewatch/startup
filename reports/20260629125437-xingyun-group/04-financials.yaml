  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: xingyun-revenue
      missingEvidence: >
        Audited consolidated financial statements for Xingyun Group (parent), including
        group-level revenue by segment, gross margin, operating cash flow, and balance sheet.
      whyItMatters: >
        Without consolidated financials, revenue scale, unit economics, capital adequacy, and
        financial health of the group as a whole cannot be assessed; subsidiary disclosures
        (Polibeli and 行云科技) represent an unknown fraction of the group.
      diligencePath: >
        Request audited or management-reviewed consolidated P&L and balance sheet from Xingyun
        Group; cross-reference with inter-company balances disclosed in subsidiary filings.
      relatedQuestionRefs:
        - QI008
        - QI012
        - QI020

    - type: private-evidence-only
      severity: blocking
      topic: linkiebuy-saas-economics
      missingEvidence: >
        LinkieBuy ARR, NRR, churn rate, active brand count by tier, CAC, and LTV data.
      whyItMatters: >
        The SaaS platform is described as a core recurring revenue driver, but without ARR
        and retention data the quality and sustainability of this revenue stream cannot be judged.
      diligencePath: >
        Request ARR waterfall, cohort retention analysis, and CAC by acquisition channel
        from Xingyun/LinkieBuy management.
      relatedQuestionRefs:
        - QI002
        - QI027

    - type: private-evidence-only
      severity: material
      topic: supply-chain-finance
      missingEvidence: >
        Size of supply-chain-finance loan book, interest rate spread, non-performing loan
        ratio, funding cost, and credit quality of the borrower portfolio.
      whyItMatters: >
        Supply-chain finance is a material revenue stream with embedded credit risk; an
        undisclosed loan book could represent a significant contingent liability.
      diligencePath: >
        Request loan book summary, NPL schedule, credit ratings of top-10 borrowers, and
        funding-source details (bank lines, ABS, related-party) from Xingyun Group.
      relatedQuestionRefs:
        - QI001
        - QI026

    - type: missing-source
      severity: material
      topic: polibeli-going-concern
      missingEvidence: >
        Polibeli's auditor going-concern opinion text and management's plan to address
        negative equity and ongoing losses, including any recapitalization commitments.
      whyItMatters: >
        Negative equity of -$45.42M with sub-1.0 current ratio raises substantial going-concern
        doubt; without the auditor's formal assessment and management's remediation plan,
        the severity of the risk cannot be evaluated.
      diligencePath: >
        Review the full audit report section of Polibeli's Form 20-F (Item 8 financial
        statements, independent auditor's report); request board resolution on capital plan.
      relatedQuestionRefs:
        - QI016
        - QI013

    - type: missing-source
      severity: material
      topic: xingyun-gmv
      missingEvidence: >
        Independent verification of the claimed 500 billion RMB GMV in 2025, including
        a GMV-to-net-revenue bridge showing how fee streams are derived from gross volume.
      whyItMatters: >
        The GMV claim is the primary scale narrative for Xingyun Group but is entirely
        unreconciled to disclosed net revenues; without a bridge, the take-rate and revenue
        quality cannot be assessed.
      diligencePath: >
        Request a GMV-to-net-revenue bridge by segment (agency, logistics, SaaS, finance)
        from Xingyun Group management; cross-reference with known net revenues.
      relatedQuestionRefs:
        - QI009
        - QI012

    - type: conflicting-data
      severity: material
      topic: xingyun-revenue
      missingEvidence: >
        Reconciliation between GetLatka's $42.3M net revenue estimate and PrivCo's $380M
        estimate for Xingyun Group parent, including accounting convention documentation.
      whyItMatters: >
        The 9× discrepancy prevents any reliable sizing of the parent entity's financial scale;
