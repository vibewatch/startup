  - id: unit-economics-and-cost-structure
    title: Unit Economics, Cost Structure, and Working-Capital Signals
    body: >
      Xingyun Group's unit economics are structurally challenged across its publicly disclosed
      subsidiaries. Polibeli's gross margin of 7.35% in FY2025 is consistent with the asset-light
      digital distribution model—where the company earns a logistics and procurement spread rather
      than product ownership margin—but leaves virtually no contribution margin once fixed
      technology, sales, and G&A costs are absorbed. The SG&A load of $9.5 million against
      gross profit of $1.94 million confirms the company cannot yet cover operating costs from
      trading operations alone. For 行云科技, the gross margin improved marginally to 15.09% in
      FY2025 (up 0.50 percentage points from FY2024), driven by the shift in revenue mix from
      low-margin B2C e-commerce to software/IT services (49.21% of revenue at higher margin).
      However, Q1 2026 gross margin collapsed to 7.08% as new B2B supply-chain trading revenues—
      injected through new subsidiary businesses—entered the income statement at much lower
      contribution margins, demonstrating the margin dilution risk of revenue-mix pivots.

      Working capital provides additional adverse signals. Polibeli's working capital swung from
      +$6.29 million in FY2024 to -$2.35 million in FY2025, with the current ratio falling to
      0.88—below the conventional 1.0 threshold for operational liquidity. 行云科技's Q1 2026
      accounts receivable balance stood at 193.76% of latest annual revenue, an extremely elevated
      receivables-to-revenue ratio that reflects either aggressive recognition on long-payment-term
      B2B contracts or collection difficulty. The three-year average operating-cash-flow-to-current-
      liabilities ratio for 行云科技 is -30%, flagged as a concern by financial analysis tools.
      Polibeli's capex was only $155K in FY2025, confirming asset-light execution and low maintenance
      investment—but also meaning that the negative operating cash flow is pure operational cash
      burn, not capital investment. CAC, LTV, payback period, and SaaS NRR metrics for the
      LinkieBuy/parent group are not publicly disclosed and remain critical diligence gaps.
