callouts:
  - calloutType: risk
    title: Polibeli Faces Going-Concern-Level Financial Stress
    body: >
      Polibeli Group Ltd (Nasdaq: PLBL) reported negative shareholder equity of -$45.42 million
      at December 31, 2025, a current ratio of 0.88, cash of ~$1.8 million, and operating cash
      outflow of $6.35 million. These metrics collectively constitute a going-concern risk
      profile under standard U.S. GAAP criteria. The CFO resigned in May 2026. Absent a
      recapitalization, new credit facility, or decisive revenue turnaround, Polibeli's standalone
      viability is at risk within 12 months.
    claimRefs:
      - CI030
      - CI032
      - CI033
      - CI044

  - calloutType: risk
    title: Xingyun Parent Financial Opacity is a Hard Diligence Blocker
    body: >
      Xingyun Group's consolidated financials—group revenue, cash position, supply-chain-finance
      loan book, and working capital—are not publicly disclosed in any audited filing. The
      claimed GMV of 500 billion RMB cannot be reconciled to disclosed subsidiary revenues.
      GetLatka and PrivCo differ by nearly 9× on revenue estimates. No CAC, NRR, or cohort
      data exists for the platform layer. This level of opacity prevents meaningful financial
      underwriting of the parent entity.
    claimRefs:
      - CI006
      - CI009
      - CI043
      - CI047
      - CI048

  - calloutType: insight
    title: Asset-Light Structure Cuts Capex But Not Working-Capital Burn
    body: >
      Polibeli's $155K capex confirms genuinely asset-light execution. However, asset-lightness
      does not protect against working-capital burn in B2B procurement intermediation: as
      行云科技 Q1 2026 shows, rapid revenue growth driven by B2B supply-chain trading generates
      enormous receivables (193% of prior-year revenue) and accelerates operating cash outflow.
      The asset-light narrative should not be confused with capital-light at the working-capital level.
    claimRefs:
      - CI025
      - CI026
      - CI037

