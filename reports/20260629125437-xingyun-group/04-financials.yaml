  - id: financial-verdict-and-blockers
    title: Financial Verdict and Diligence Blockers
    body: >
      Xingyun Group's financial quality is low at the subsidiary level and unknown at the
      consolidated parent level—the worst possible combination for investment underwriting. At the
      publicly disclosed subsidiaries, gross margins are thin (7–15%), operating margins are deeply
      negative (-28% at Polibeli), cash is burning fast, and one subsidiary faces going-concern
      conditions. The revenue trend is declining at Polibeli (-12.6% YoY) and collapsing at
      行云科技 (-62.57% in FY2025), even though 行云科技 showed a dramatic sequential recovery
      in Q1 2026 (+397.86% YoY) via injection of new B2B businesses with very different economics.
      These new businesses carry lower margins and generate very large receivables, substituting
      revenue volume risk for cash-collection risk.

      The group's asset-light model—evidenced by Polibeli's $155K capex, distributed warehouse
      and logistics partnerships, and SaaS-delivered digital tools—is a structural advantage in
      that it limits fixed capital requirements. However, asset-lightness does not eliminate
      working-capital intensity: B2B procurement platforms must extend credit to retailers and
      receive payment terms from brands, creating a cash-conversion cycle that burns cash when
      scale increases faster than collections. The declared GMV of 500 billion RMB versus
      disclosed net revenues of tens of millions of dollars implies an extremely low aggregate
      take-rate—estimated at well below 1% of GMV—which is consistent with commodity-like
      procurement-and-logistics intermediation but leaves little room for error in fixed cost
      absorption. Key diligence blockers that prevent financial underwriting of the parent entity
      include: (1) no consolidated audited financials; (2) no disclosed group-level GMV-to-revenue
      bridge; (3) no disclosed CAC, payback, or cohort retention for any customer segment;
      (4) no disclosed cash position, burn rate, or runway at the Xingyun Group parent; and
      (5) no independently verified data on supply-chain-finance loan book size or credit quality.
