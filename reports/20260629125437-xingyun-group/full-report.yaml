          - type: callout
            title: 90%+ Geographic Concentration in Japan and Indonesia Creates Polibeli Fragility
            body: >
              Polibeli's Japan (52%) and Indonesia (38%) combined revenue share of 90%+ as of FY2024 creates binary
              geographic risk. Vietnam was launched in August 2023 as a diversification move, but its revenue
              contribution remains immaterial. If Indonesian regulatory changes or Japan market conditions deteriorate
              simultaneously, Polibeli could face severe operating stress, particularly given ongoing net losses and the
              recent CFO resignation.
