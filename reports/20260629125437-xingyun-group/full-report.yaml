  - id: TM004
    title: Growth Drivers and Adoption Constraints Register
    columns:
      - Factor
      - Direction
      - Timing
      - Implication for Xingyun
      - Diligence Ask
    rows:
      - - RCEP tariff cuts (4–8% on Chinese goods in SEA since 2024)
        - Tailwind
        - Ongoing; accelerating 2024–2026
        - Lower landed cost improves B2B margin and SME price competitiveness across SEA
        - Quantify per-category tariff savings for Xingyun's top product lines
      - - China 178 CBEC pilot zones with bonded-warehouse incentives
        - Tailwind
        - Established; 178 zones by end 2025 covering all 31 provinces
        - VAT reduction and faster clearance reduces per-shipment cost; expands SME access to export infrastructure
        - Verify Xingyun pilot-zone city coverage and utilisation rates
      - - WTO E-Commerce Agreement adopted March 2026 (66 members, ~70% of trade)
        - Tailwind
        - Medium-term; 45 instrument deposits needed for entry into force
        - >-
          Establishes baseline global digital trade rules; reduces regulatory uncertainty for logistics platform
          operators
        - Track China's domestic ratification timeline and deposit of acceptance instrument
      - - June 2026 CBEC data-flow liberalisation (9-department guideline)
        - Tailwind
        - Near-term; effective June 2026
        - Reduces compliance overhead for overseas warehouse data management; enables cross-border analytics
        - Confirm scope of permitted data categories and verify Xingyun's audit framework compliance
      - - US de minimis elimination (120% tariff or $100–200/parcel, May 2025)
        - Headwind
        - Immediate; structural shift in place
        - US-bound small-parcel model disrupted; Temu/Shein restructuring to US domestic fulfilment
        - Assess Xingyun's US route exposure and evaluation of bonded fulfilment centre shift
      - - EU de minimis review (€150 threshold; 91% of EU parcels from China)
        - Headwind
        - Near-term; EU reform proposal 2026–2027
        - If €150 threshold eliminated, EU-bound parcel economics fundamentally change for low-value goods
        - Monitor EU Customs Reform Regulation timeline and map Xingyun's EU volume exposure
      - - SEA emerging-market protectionism (Vietnam Temu ban Dec 2024; Indonesia app ban Oct 2024)
        - Headwind
        - Emerging; country-specific and episodic
        - Platform entry barriers require local partnerships, compliance investment, and local legal entities
        - Map country-level regulatory risk registry for Polibeli's active and planned SEA markets
      - - Red Sea disruption and freight cost volatility (30% spike in 2024)
        - Headwind
        - Episodic; structural geopolitical risk
        - Maritime cost volatility; China-Europe rail +10% in 2024 as modal substitute but capacity-constrained
        - Assess Xingyun's maritime-to-rail modal mix; quantify hedging via owned vs. contracted capacity
    notes: >-
      Direction (tailwind/headwind) reflects net impact on Xingyun's growth trajectory as of June 2026. Timing is author
      assessment based on publicly announced policy effective dates. Diligence asks are forward-looking research gaps.
