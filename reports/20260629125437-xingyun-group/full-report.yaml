      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Track Capital Strategy Unlocking Value
            body: >
              Xingyun Group has executed a sophisticated dual-track capital strategy: maintaining the core private group
              while spinning out Polibeli onto Nasdaq (PLBL, Aug 2025) and acquiring a controlling stake in A-share 行云科技
              (SZ300209). This positions Xingyun to access public-market capital in both the U.S. and China, while
              preserving the flexibility and speed of a private parent. The Polibeli stake (~50%) was valued at
              approximately $2.1B at market prices in August 2025—exceeding the total post-money valuation of Xingyun's
              last reported private round— suggesting significant embedded value even without a full group IPO.
            calloutType: strength
            claimRefs:
              - CO015
              - CO016
              - CO017
              - CO037
          - type: callout
            title: Governance and Regulatory Risk Concentrated in Founder
            body: >
              The 2026 CSRC enforcement action against Wang Wei (3.5M RMB fine for disclosure violations) and the
              ongoing corporate governance dispute at 行云科技 (SZ300209)—including alleged seal forgery and contested board
              transitions—introduce material key-person and regulatory risk. Wang Wei's shares in the listed company
              were fully frozen in January 2026, and the listed entity projected a 70–90M RMB operating loss for 2025.
              These issues, while formally described as unrelated to Xingyun Group's core operations, reflect on Wang
              Wei's management style and raise governance diligence questions for any institutional investor evaluating
              the Xingyun group of companies.
            calloutType: risk
            claimRefs:
              - CO019
              - CO032
              - CO033
              - CO034
              - CO040
          - type: callout
            title: GMV vs. Net Revenue Divergence Requires Clarification
            body: >
              Xingyun Group reports GMV of over 500 billion RMB (approximately $68B) annually, while third-party data
              sources estimate net revenue at approximately $42.3M in 2024. The ~1,600x ratio between GMV and net
              revenue implies an extremely thin take-rate (less than 0.1%) or a discrepancy in how revenue is recognized
              vs. transaction-facilitated volumes. Without audited financials, investors cannot determine whether the
              "revenue" figure represents only SaaS/service fees, agency margins, or a fuller income statement. This gap
              is a primary diligence risk.
            calloutType: insight
            claimRefs:
              - CO021
              - CO022
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >
              The market relevant to Xingyun Group spans B2B digital supply chain services that enable cross-border
              goods flows—primarily China-export-to-emerging-markets corridors and overseas-brand-to-China import
              channels. The boundary includes three principal service layers: (1) export-side logistics, customs
              clearance, supply chain finance, and digital platform services for Chinese SME sellers targeting Southeast
              Asia, the Middle East, Africa, and Latin America; (2) import-side services enabling overseas brands to
              access Chinese consumers through bonded-warehouse and B2C platform channels such as LinkieBuy and EC Mall;
              and (3) adjacent SaaS and print-on-demand services that deepen seller stickiness. Excluded are pure
              domestic e-commerce, traditional bulk freight not linked to an e-commerce transaction, and direct B2C
              consumer retail where Xingyun acts as enabling infrastructure, not the merchant of record. China Customs
              formally classifies CBEC under codes 9610, 9710, 9810, and 1210, each carrying distinct logistics and
              compliance obligations. China's combined CBEC import-export volume reached RMB 2.75 trillion in 2025 (up
              from RMB 2.63 trillion in 2024), representing 6.3% of total national goods trade and a 69.7% increase
              versus 2020. Exports dominate at approximately 79% of CBEC volume; consumer goods account for 97.8% of
              export content. B2B transactions hold a 67% market share by value while B2C grows faster at approximately
              25% YoY—reflecting the accelerating shift toward direct-to-consumer export models. China's CBEC sector
              already covers 26 million domestic businesses and Silk Road E-Commerce partnerships with 36 countries.
            claimRefs:
              - CM001
              - CM002
              - CM003
