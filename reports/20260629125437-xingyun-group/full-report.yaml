      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: US and EU De Minimis Changes Signal Structural Re-routing of CBEC Flows
            body: >
              The May 2025 US de minimis elimination and the pending EU €150 threshold review represent the most
              significant structural disruptions to China-to-developed-market CBEC in over a decade. Together, these
              changes are redirecting Chinese export flows toward SEA, the Middle East, and Latin America—exactly the
              corridors where Xingyun and Polibeli operate. This creates a near-term demand tailwind for emerging-market
              CBEC infrastructure, but also increases competition as displaced flows concentrate in markets with less
              logistics maturity.
            calloutType: risk
            claimRefs:
              - CM031
              - CM032
              - CM033
          - type: callout
            title: SEA Content Commerce and Mobile Wallet Penetration Are Demand Multipliers
            body: >
              Content commerce (TikTok Shop, Shopee Live) generated USD 49.7 billion GMV in SEA in 2025—32% of total
              platform GMV, up from 20% in 2024. Mobile e-wallet users are projected to reach 2.6 billion by 2025. These
              two forces create a structural demand pull for Chinese-origin goods and cross-border logistics,
              particularly in Xingyun's Polibeli B2B distribution segment serving SEA retailers who source Chinese
              inventory to fulfil social-commerce orders.
            calloutType: insight
            claimRefs:
              - CM029
              - CM030
          - type: callout
            title: Market Sizing Should Use Logistics Sub-Market, Not Aggregate CBEC Trade Value
            body: >
              Analyst TAM estimates for China CBEC range from USD 28 billion (logistics only, Mordor) to USD 90 billion
              (total trade value, IMARC). For valuing a logistics and supply chain platform like Xingyun, the logistics
              sub-market estimate (USD 28–58 billion depending on scope) is the more relevant addressable pool.
              Investors should avoid anchoring to aggregate CBEC trade-flow figures that include upstream trade value
              Xingyun does not capture as revenue.
            calloutType: recommendation
            claimRefs:
              - CM007
              - CM008
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              Xingyun Group competes across three overlapping competitive layers in cross-border digital supply chain:
              (1) full-stack logistics infrastructure providers—Cainiao, JD Logistics, SF Holding, and J&T Express—who
              handle massive parcel volumes and are rapidly expanding overseas warehousing and brand-enablement
              capabilities; (2) niche cross-border logistics and overseas fulfillment specialists—Zongteng Group (纵腾集团),
              4PX Express (递四方), and YunExpress—who serve the SME and platform-seller segment with warehousing,
              last-mile, and customs services; and (3) intra-city on-demand platforms such as Lalamove/Lalatech, which
              compete tangentially for supply chain logistics budget but serve a different workflow. The China
              cross-border e-commerce logistics market was valued at USD 33.15 billion in 2026 and is projected to grow
              at 12.83% CAGR through 2031 (Mordor Intelligence), with B2B the fastest-growing sub-segment at 12%+ CAGR.
              Within this landscape, Xingyun's primary differentiation is its brand-enablement model: serving overseas
              brands entering China (import services) and Chinese brands going global (export services), with an
              integrated SaaS platform (LinkieBuy), supply chain finance, and WeChat CRM tools. Status-quo
              alternatives—manual freight forwarders, branded agency distributors, and direct channel builds on
              Tmall/JD— represent the real competitive floor for the overseas brands Xingyun targets. The main concern
              is that both Alibaba's Cainiao and JD Logistics are investing in brand-service overlays that encroach on
              Xingyun's differentiated position, while J&T and SF dominate the commodity logistics layer on which
              Xingyun partially depends.
