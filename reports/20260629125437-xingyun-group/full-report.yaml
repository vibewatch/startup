      - number: '7.3'
        title: Governance Concentration, Financing Dependence, and Capital Structure Risks
        blocks:
          - type: paragraph
            body: >
              Wang Wei's emergence as the sole actual controller of both Xingyun Group (private) and Xingyun Technology
              (listed) creates a key-person concentration risk with limited institutional checks. Wang Wei and his
              concerted parties hold 18% of Xingyun Technology with no comparable institutional block, and Xiao Siqing's
              stake was passively diluted to 3.28% with his removal from management in October 2025. The A-share
              subsidiary carries the legacy of a four-year 4.4-billion yuan cumulative loss (2020–2023) from Youkeshu's
              distribution-model collapse after the 2021 Amazon mass store closure event; Q3 2025 revenue fell 83.59%
              YoY to 16.4 million yuan and Q1–Q3 2025 cumulative revenue was 58.97 million yuan (down 82% YoY),
              threatening a second consecutive annual loss. The transition exposes unfinished subsidiary handovers: as
              of December 31, 2025, subsidiaries with total assets of 64.7 million yuan and negative net assets of −10.6
              million yuan had not completed business handover to the new management team. Xingyun Group itself has
              raised approximately $951 million across multiple rounds and carries a $2.2 billion group valuation (2025)
              alongside a $3.6 billion Polibeli SPAC valuation — a wide bid-ask spread between private-round marks and
              listed-entity trading realities. China's corporate default risk is projected to rise 7–10% in 2026 as
              tighter global funding conditions persist. The PBOC's draft supply chain finance guidelines (early 2025)
              signal regulatory tightening on cross-border platform-embedded financing, which is central to Xingyun's
              margin model; credit losses from SME counterparties could erode take-rates and trigger covenant or reserve
              requirements in any senior financing facility secured against trade receivables.
