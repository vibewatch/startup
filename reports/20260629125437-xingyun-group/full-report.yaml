chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Xingyun Group (行云集团), whose legal entity is 深圳市天行云供应链有限公司 (Shenzhen Tianxingyun Supply Chain Co., Ltd.),
              was founded in May 2015 in Shenzhen, China. The company describes itself as "a global internet e-commerce
              leader and a leading comprehensive services platform for global commodities in China," with a stated
              mission of "让全球买卖变得更简单" ("Making global trade simpler"). Xingyun operates a one-stop B2B digital supply
              chain covering cross-border import services (helping overseas brands enter the Chinese market), export
              services (helping Chinese brands go global), cross-border logistics, customs clearance, supply chain
              finance, and digital platforms. Its product portfolio includes LinkieBuy—a SaaS platform integrating
              WeChat and Alipay mini-programs for overseas brands in China—EC Mall, LinkieSCRM, and Flexcreate
              (print-on-demand, launched February 2025). The company's international holding structure uses Xingyun
              International Company Limited as the Cayman Islands parent; its Southeast Asia B2B arm Polibeli Group Ltd
              achieved a Nasdaq listing in August 2025. Xingyun operates from Shenzhen, Hangzhou, Shanghai, Hong Kong,
              and Singapore; has presence in 72 countries and one region; maintains 139 self-operated or partner
              warehouses globally; and serves 3,000+ overseas brands and 160,000+ domestic retailers. The company's
              revenue model blends agency fees, logistics margins, and SaaS subscription and service fees. GMV exceeded
              500 billion RMB in 2025, though reported net revenue of approximately $42.3M in 2024 per GetLatka data,
              reflecting the difference between gross merchandise volume and fee-based revenue recognition.
