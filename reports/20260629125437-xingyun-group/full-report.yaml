      - number: '8.4'
        title: Recommendation, Confidence, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              The weight of evidence points to a research-more recommendation at medium confidence and a high risk
              rating. The valuation stance is stretched: whether measured against PLBL's 108x P/S, the $2.2B private
              mark's implied 52x on estimated group net revenue, or any precedent transaction in the Chinese logistics
              or cross-border supply chain sector, the current pricing requires revenue growth that has not yet been
              demonstrated at the consolidated group level.

              The thesis can move to buy under three conditions: (1) a new primary financing round at or above the
              existing mark from credible institutional investors, validating the current price; (2) disclosure of
              consolidated audited financial statements showing group-level revenue, margin, and cash flow, sufficient
              to compute a realistic multiple; and (3) resolution of the CSRC investigation without material sanction
              against Wang Wei, and the unfreeze of the Xingyun Technology shares. Absent at least two of these three
              conditions, entry at the current implied valuation would require relying on speculative market premiums
              that have historically been fragile in post-SPAC tech-logistics names.

              Hurun 2025 Global Unicorn Index confirms Xingyun Group's continued unicorn status among China's 343
              unicorns (total China unicorn universe growing 22% YoY), placing it within the mid-range of the cohort.
              China's private tech sector has seen multiple compression since the 2021 peak; the Cainiao IPO withdrawal
              in 2024 and persistent discount to private marks in HK logistics listings suggest the current public
              market is unlikely to validate the full $2.2B mark for Xingyun in a near-term primary offering without
              material revenue proof.
