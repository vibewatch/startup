      - number: '1.4'
        title: Milestones, Scale, and Strategic Expansion
        blocks:
          - type: paragraph
            body: >
              Xingyun Group's growth trajectory from a Shenzhen startup to a global supply chain unicorn spans eleven
              years of operational milestones. In 2016, facing a catastrophic tax policy shock that shuttered 99% of
              cross-border e-commerce competitors, Wang Wei retained 63 employees and continued building out digital
              infrastructure. By 2017, five overseas branches had been established and GMV reached 1.2 billion RMB
              (+344% year-on-year). In August 2021, the company expanded to Kenya. In July 2022, Polibeli was launched
              in Indonesia as a B2B wholesale platform for SME retailers. By 2023, Xingyun entered the Fortune China 500
              (ranked 372nd) and achieved annual GMV exceeding hundreds of billions of RMB. In February 2025, Flexcreate
              (print-on-demand) was launched, extending the digital product portfolio. In March 2025, Wang Wei formed
              the 海丝智链 (Haisi Zhi Chain) joint venture with four Guangzhou state-owned enterprises to develop
              cross-border stablecoin payment infrastructure under Hong Kong's new Stablecoin Ordinance. On August 8,
              2025, Polibeli Group Ltd commenced trading on the Nasdaq Global Market (PLBL) following the completion of
              its de-SPAC merger with Chenghe Acquisition II Co. The Nasdaq listing represents a milestone in Xingyun's
              dual-track strategy: domestic cross-border supply chain via Xingyun Group, and overseas B2B market
              penetration via Polibeli. As of August 2025, Xingyun holds approximately 50% of Polibeli, with a market
              value of approximately $2.1B. Polibeli's revenue grew 32.7% to over $30M in 2024, with Japan (~52%) and
              Indonesia (~38%) as the core revenue markets. Xingyun Group was ranked 339th on the Fortune China 500 in
              2025 (3rd consecutive year) and included in the 2025 World Unicorn Enterprises list.
