      - number: '1.2'
        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: >
              Xingyun Group was founded and is chaired by Wang Wei (王维, also known as Billy), born in 1981 in Shanghai.
              Wang Wei holds a PhD from City University of Hong Kong under Professor Yang Zhilin (with research
              published in the Journal of Business Research) and a further PhD from Tsinghua University; he is also an
              Associate Professor at CityU Hong Kong and a Visiting Scholar at Waseda University in Japan. Prior to
              founding Xingyun in 2015, Wang Wei spent approximately nine years at ZTE (中兴通讯), serving as PMO Global
              Project Management System Head and then as Overseas Division General Manager. He started Xingyun in 2015
              with five former ZTE colleagues from a rented apartment in Shenzhen, at one point mortgaging personal
              property to meet payroll during the 2016 cross-border e-commerce tax shock. In 2021, he was included in
              Fortune's China 40 Under 40 list. By October 2025, his personal wealth was reported at 16.5 billion RMB
              (ranked 399th on Hurun Rich List); by March 2026, the Hurun Global Rich List reported 17 billion RMB
              (ranked 1952nd). A data conflict exists: GetLatka lists the CEO/Founder as "Leon Zhang," which is
              unverified by any Chinese or English primary source; all primary and credible secondary sources confirm
              Wang Wei (王维/Billy) as founder and chairman. In March 2025, Wang Wei became controlling shareholder (≥18%)
              of the A-share listed company 有棵树科技 (SZ300209) via judicial enforcement during its bankruptcy
              restructuring; in February 2026 the listed company was renamed 行云科技. This acquisition triggered a
              contested governance battle with former founder Xiao Siqing. In April 2026, the Hunan CSRC issued an
              enforcement decision fining Wang Wei 3.5M RMB for information disclosure violations connected to that
              restructuring—an adverse regulatory finding that introduces key-person governance risk for Xingyun Group
              proper.
