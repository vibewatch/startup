  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Disclosure Opacity, CSRC Enforcement, and Legal Risks
        blocks:
          - type: paragraph
            body: >
              The most acute near-term risk is the live China Securities Regulatory Commission (CSRC) enforcement action
              against Wang Wei, Xiao Siqing, and Shenzhen Tianxingyun Supply Chain Co., Ltd. — the operating entity of
              Xingyun Group. In September 2025 the CSRC issued a formal Notice of Case Filing (立案告知书) against all three
              parties for suspected failure to disclose material information as required under Chinese securities law.
              The core allegation centres on a control-transfer agreement executed between late 2024 and early 2025 that
              shifted actual control of Xingyun Technology (300209.SZ) from Xiao Siqing to Wang Wei — an agreement the
              parties allegedly concealed from public shareholders during the restructuring process. By April 2026 an
              administrative penalty decision (行政处罚决定书) had been issued and the Shenzhen Stock Exchange issued a
              concurrent public censure, creating direct legal liability for Wang Wei as actual controller of both
              Xingyun Group (private) and Xingyun Technology (A-share listed), and indirectly exposing Polibeli Group
              Ltd (PLBL, Nasdaq) to reputational and governance overhang. The 2026 CSRC enforcement campaign is the most
              aggressive in recent memory: the Commission's first 2026 penalty notices included a record 10.22 billion
              yuan fine for market manipulation and simultaneous actions against multiple Shenzhen audit firms for
              governance failures; post-delisting accountability actions confirm the regulator will not allow market
              exit to shield parties from consequences. Separately, Xingyun Technology disclosed an arbitration case
              involving approximately 96.4 million yuan in unpaid logistics service fees — adding material legal risk.
              Polibeli Group's 2025 annual report (Form 20-F filed April 2026) acknowledges material weaknesses in
              internal control over financial reporting and discloses the company's intent to follow home-country
              (Cayman Islands) corporate governance exemptions rather than full Nasdaq standards, limiting shareholder
              protections for international investors. The prolonged boardroom power struggle at Xingyun Technology —
              which required Wang Wei to convene two extraordinary general meetings before finally unseating the
              incumbent board in October 2025 — caused a delayed Q3 2025 financial disclosure, itself a regulatory
              violation risk. These overlapping adverse signals establish disclosure opacity as the single highest-
              severity risk for this investment thesis.
