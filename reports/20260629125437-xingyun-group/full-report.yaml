            title: SPAC Premium Warning — PLBL P/S of ~108x Is Structurally Unsustainable
            body: >
              Polibeli Group's ~$2.9B market cap on $26.4M TTM revenue produces a P/S of approximately 108x and an
              EV/Revenue of ~110x. For context, JD Logistics trades at 0.23x EV/Revenue, SF Holding at 0.3–0.4x, and
              even the high-growth platform Lalamove commands only ~5x on $2.1B revenue. PLBL's current pricing implies
              the company will grow to $580M+ in revenue at a sustainable margin profile while maintaining current share
              count and sentiment — a 22x revenue increase from current TTM levels in an opaque market. Investors in
              Xingyun Group at the $2.2B private mark are effectively underwriting this scenario implicitly through
              their exposure to the PLBL price.
            calloutType: risk
