      - number: '3.2'
        title: Major Competitor Profiles
        blocks:
          - type: paragraph
            body: >
              Cainiao Network, wholly owned by Alibaba since February 2025 after Alibaba withdrew the HK IPO in March
              2024 and fully acquired minority shares for up to $3.75B, is the world's largest cross-border e-commerce
              logistics platform by volume. Cainiao's revenue reached RMB 99.02 billion in FY2024 (year to March 2024),
              up 28% YoY; Q1 FY2025 revenue was RMB 26.81 billion (+16% YoY). The network handles 5M+ cross-border
              parcels daily across 200+ countries via 1,100+ warehouses, 18 overseas sorting centers, and 170+ weekly
              chartered flights. Critically, its re-integration into Alibaba's platform ecosystem means Cainiao now
              bundles brand landing and onboarding services for AliExpress, Lazada, and Trendyol—directly overlapping
              Xingyun's overseas brand import service. JD Logistics (HKEX:2618) reported RMB 217.15 billion revenue for
              FY2025, +18.8% YoY, with integrated supply chain revenue of RMB 116.2 billion (+33%) and 91,161 external
              customers (+13%). JD operates 200 bonded/overseas warehouses in 25 countries, launched JoyExpress in Saudi
              Arabia and Europe, and completed the Deppon (德邦) acquisition (99.7% held) in 2025–2026. SF Holding
              (002352.SZ, 6936.HK) reported RMB 308.2 billion revenue for FY2025 (+8.4%); supply chain and international
              revenue was RMB 72.9 billion (+3.5%), with April 2026 international segment revenue of RMB 6.99B
              (+18.25%). SF is Asia's largest and the world's 4th-largest logistics provider, serving 2.35M+ corporate
              clients and 800M+ consumers. J&T Express (01519.HK) reported US$12.2 billion revenue for FY2025 (+18.5%)
              and 30.1 billion total parcels (+22.2%), with Southeast Asia market share at 34.4% (#1 for 6 years). Q1
              2026 volume reached 8.33 billion parcels (+26.2% YoY). J&T is B2C-focused and primarily serves e-commerce
              platforms (SHEIN, Temu, TikTok, AliExpress); its Guangzhou self-built sorting center is the company's
              largest globally. Lalamove/Lalatech reported $2.14B revenue (+34.3%) and $560M adjusted net profit in
              2025, with 1B+ orders and 53.1% market share in global closed-loop freight GTV—but its model is intra-city
              on-demand trucking, not cross-border brand enablement. Zongteng Group operates 3.6M sqm overseas warehouse
              space under YunExpress and GOODCANG brands, ranking first in China's cross-border logistics TOP50. 4PX
              Express handles 1M+ parcels daily across 200+ countries, serving primarily SME e-commerce sellers via its
              Global Parcel and Fulfillment networks.
