  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              Xingyun Group's investment thesis rests on three inter-dependent pillars: scale, platform, and
              optionality. The company intermediates more than 500 billion RMB in gross merchandise volume through a
              proprietary supply-chain infrastructure spanning 72 countries and 139 warehouses—a capital deployment that
              would cost multiples of the current private mark to replicate. Polibeli's Nasdaq listing (PLBL) has
              created a public market price-discovery anchor and a new capital-raising pathway, providing runway that
              private peers lack. Yunfeng Capital's lead in the 2021 Series C2, alongside Crescent Point, Harvest Fund,
              Taikang Insurance, 5Y Capital, and Matrix Partners, signals institutional validation of the cross-border
              B2B supply chain model. Wang Wei's estimated personal wealth of RMB 17B (Hurun 2026) implies ongoing
              founder-operator alignment through personal financial exposure.

              The anti-thesis is equally forceful. The $2.2B private mark is over five years stale, validated by no new
              primary financing since April 2021; in the current higher-rate, risk-averse private market environment,
              stale marks routinely overstate fair value. PLBL's P/S ratio of approximately 108x on $26.4M TTM revenue
              is indefensible by logistics-sector comparables, suggesting speculative excess rather than fundamental
              pricing. More critically, no consolidated audited financial statements are publicly available for the
              holding entity, making revenue, margin, and leverage analysis impossible on a group-wide basis. Active
              CSRC enforcement against Wang Wei and Tianxingyun Supply Chain—for alleged failure to disclose significant
              information—and a court-ordered freeze of all controlling-shareholder shares in the A-share subsidiary
              introduce material headline and operational risk. The April 2026 penalty against Xingyun Technology for
              concealing a control-transfer agreement demonstrates that governance failures are not historical: they are
              unresolved and ongoing.
