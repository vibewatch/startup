  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Observable Event
      - Transmission to Investment Thesis
      - Action Implication
    rows:
      - - CSRC imposes formal sanction on Wang Wei
        - Administrative fine, market ban, or travel restriction issued against Wang Wei personally
        - >-
          Key-person and Xingyun Group leadership credibility destroyed; institutional investors exit; PLBL price
          collapses
        - Exit or halt deployment immediately; thesis breaks
      - - PLBL market cap falls below $200M
        - PLBL stock price < $0.55/share (current shares outstanding basis)
        - >-
          Polibeli capital pathway closes; ongoing losses trigger going-concern disclosures; Xingyun loses public market
          funding option
        - Reassess thesis; SPAC premium fully eroded; PLBL becomes a liability, not an asset
      - - No new consolidated revenue disclosure above $100M by end-2027
        - Confirmed by audited group financials or SEC filing for PLBL parent
        - Revenue base confirms no scalable monetisation beyond GMV facilitation; 52x P/S unsustainable
        - Downgrade to avoid; revenue model is agency-only and structurally thin at current scale
      - - Polibeli raises equity at implied PLBL valuation below $500M
        - PLBL rights issue, PIPE, or secondary priced below $1.35/share
        - Down-round signal; existing $2.2B private mark cannot be sustained; write-down cascade
        - Down-round confirmed; demand immediate valuation reset; reduce exposure
      - - Share freeze extended or new major civil/criminal action against Wang Wei
        - Court renewal of Jan 2026 freeze beyond Jan 2029, or new criminal investigation filed
        - Control risk escalates; business continuity and cross-border asset transfers impaired
        - Pause deployment; escalate legal diligence in China; seek management response
    notes: >
      Trigger thresholds are observable market or regulatory events, not internal milestones. Action implications assume
      the investor holds a minority private position.
