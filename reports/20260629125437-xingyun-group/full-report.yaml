  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Scale, Mix, and the GMV-to-Net-Revenue Gap
        blocks:
          - type: paragraph
            body: >
              Xingyun Group's revenue scale is contested by competing data sources and accounting conventions. GetLatka
              estimated Xingyun Group parent revenue at approximately $42.3 million net as of its December 2024
              snapshot, treating fee-based agency income as the revenue line. PrivCo's estimate of $380 million for 2024
              likely uses a gross-merchandise-value or group-consolidated gross accounting convention, given the 9×
              magnitude difference. The company itself claims GMV exceeding 500 billion RMB (~$69 billion at mid-2025
              rates) in 2025, a figure that is entirely unverifiable against any disclosed net revenue or audited
              statements. The gap between GMV and net revenue reflects Xingyun's agency-and-platform model: logistics
              margins, SaaS subscription fees, commission percentages, and supply-chain-finance spreads collectively
              determine take-rate, which public data suggests is well below 1% of gross transaction value on the
              procurement side.

              Four distinct revenue streams feed the consolidated entity: (1) cross-border import/export agency services
              and procurement, which generate logistics margins; (2) logistics and warehousing fees for the group's 139
              self-operated or partner warehouses across 72 countries; (3) supply-chain trade financing, providing
              working capital to brands and retailers at undisclosed spread margins; and (4) SaaS platform fees from
              LinkieBuy and EC Mall—annual subscriptions ranging from RMB 10,000 (Basic) to RMB 50,000 (Flagship) plus
              an 8% transaction commission on all orders processed. Flexcreate, the print-on-demand product launched in
              February 2025, represents a nascent fifth stream with no disclosed revenue contribution. The publicly
              disclosed subsidiary financials—Polibeli (Southeast Asia and Japan operations) and 行云科技 (domestic A-share
              operations)—together represent a fraction of the group's declared 3,000-brand, 160,000-retailer scale,
              underscoring how much of the financial story is structurally inaccessible to outside investors without a
              consolidated audit.
