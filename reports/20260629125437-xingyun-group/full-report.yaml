companyProfile:
  summary: >
    Xingyun Group is a Shenzhen-founded cross-border digital supply-chain company built around brand entry to China,
    Chinese brand export, warehousing, logistics, customs/compliance workflows, and commerce SaaS. Founded in May 2015
    by former ZTE executive Wang Wei, the group scaled through a platform-plus-service model rather than a pure
    asset-owning carrier model, adding LinkieBuy, EC Mall, supply-chain finance, and overseas warehousing capabilities
    to connect brands and SME retailers. The company remains privately held at the parent level, but two public-side
    anchors now shape diligence: Polibeli Group's Nasdaq listing in 2025 and the A-share subsidiary 行云科技, where
    governance disputes and CSRC enforcement have created meaningful headline risk.
  foundedDate: '2015-05-01'
  founders:
    - name: Wang Wei
      role: Founder and chairman
      background: >
        Former ZTE global project-management and overseas-division executive with CityU Hong Kong and Tsinghua doctoral
        credentials; founded Xingyun in Shenzhen with ex-ZTE colleagues.
      claimRefs:
        - CO001
        - CO006
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: >
    The group sells an integrated cross-border supply-chain stack: import agency and brand-entry services for overseas
    brands, export and channel-building services for Chinese brands, cross-border logistics and warehousing,
    customs/compliance support, and software products such as LinkieBuy, EC Mall, and related digital retail tooling.
  customerFocus: >
    Primary users are overseas consumer brands entering China, Chinese brands exporting to Southeast Asia and other
    emerging markets, and SME retailers/distributors buying through Xingyun-operated or partner marketplaces and sales
    networks.
  businessModel: >
    Revenue comes from agency and service fees, logistics margins, warehousing and fulfillment charges, SaaS
    subscriptions, and transaction commissions. The business is high-volume and low-take-rate: company-claimed GMV
    exceeds 500 billion RMB, but public fee-based revenue evidence is only tens of millions of U.S. dollars.
