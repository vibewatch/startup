      - number: '2.2'
        title: Market Sizing — Multiple Lenses and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >
              Multiple methodologies and geographic scopes produce significantly divergent estimates; all sizings carry
              material uncertainty and are preserved as diligence evidence. Using IMARC Group's aggregate CBEC measure
              (import plus export), China's CBEC market reached USD 90.85 billion in 2025, on a trajectory to USD 312.12
              billion by 2034 at a 14.7% CAGR. The logistics sub-market—more directly addressable by a supply chain
              operator like Xingyun—was valued at USD 28.28 billion in 2025 (Mordor Intelligence), growing to USD 33.15
              billion in 2026 and USD 60.62 billion by 2031 at a 12.83% CAGR. Pltfrm.com.cn provides a divergent
              logistics estimate of USD 58.61 billion at an 8.3% CAGR—roughly double Mordor's figure, likely
              attributable to a broader scope that bundles warehousing and fulfilment infrastructure alongside pure
              logistics fees. For Southeast Asia, GII Research values the cross-border e-commerce segment at USD 45.39
              billion (2025), forecasting a CAGR of 10.97% to USD 84.74 billion by 2031. A narrower estimate from Source
              of Asia places SEA cross-border at USD 13.5 billion in 2023 at a 5.7% CAGR—reflecting purchases strictly
              from outside the buyer's home country rather than all intra-regional cross-border flows. Momentum Works
              reports SEA total platform e-commerce GMV at USD 157.6 billion in 2025, growing 22.8% YoY—the fastest pace
              in four years—but this includes domestic SEA sellers and is not a cross-border-only figure. China's CBEC
              exports reached approximately USD 1.1 trillion (7.8 trillion yuan) in 2025, a 24% YoY increase, with B2B
              cross-border exports alone reaching USD 25.1 billion, up 75%. These contradictory estimates are preserved:
              methodological divergence is itself a diligence signal that reflects competing scope conventions across
              analysts.
