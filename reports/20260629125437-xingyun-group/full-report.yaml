      - number: '7.4'
        title: Operational, Competitive, Partner, and Data Security Risks
        blocks:
          - type: paragraph
            body: >
              Xingyun's operations depend on a set of platform, logistics, and financial partners whose concentration
              creates correlated failure modes. Distribution relies on WeChat mini-program commerce (LinkieBuy),
              Alibaba/Tmall, Amazon, and regional marketplace channels — any policy or algorithm change from these
              platforms immediately affects discovery, settlement, and fulfillment economics. Third-party logistics
              depend on 4PX, SF Holding, JD Logistics, and Cainiao, all of which compete directly in the cross-border
              supply chain segment and are investing aggressively in overlapping Southeast Asian warehouse and
              fulfillment capacity. JD Logistics and SF Holding disclosed record or near-record 2025 revenues, while
              Cainiao returned to Alibaba full ownership and is scaling globally — directly compressing Xingyun's
              logistics-service margin. Polibeli's 20-F identifies the inability to attract and retain retail customers
              as a material business risk. Xingyun Technology serves approximately 500,000 SME retailers and 3,000+
              brands — a highly fragmented customer base where collective churn sensitivity to tariff and cost shocks is
              high. Polibeli's IT systems are concentrated in Singapore with stated backup arrangements; no material
              outages were reported as of the 20-F date, but the rapid integration of 26 Youkeshu subsidiaries through
              end-2025 introduces unaudited legacy system and data-compliance risk. China's Cybersecurity Law amendments
              (effective January 1, 2026) raise fines for data mishandling to up to RMB 10 million per serious
              violation, eliminate the prior "warning first" requirement enabling immediate enforcement, and extend
              extraterritorial reach to overseas parties harming China's cybersecurity. Cross-border personal
              information transfers now require one of three CAC mechanisms — security assessment, standard contractual
              clauses, or certification — with narrow exemptions for contract performance. Arnold & Porter analysis
              confirms the CAC narrowed these exemptions further in October 2025, requiring explicit separate consent
              and mandatory personal information protection impact assessments even for routine cross-border ecommerce
              data flows. Non-compliance exposure for a platform of Xingyun's scale is material.
