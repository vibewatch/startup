          - type: callout
            title: Active CSRC Enforcement — Governance Risk Is Not Historical
            body: >
              As of the report date, the CSRC investigation against Wang Wei, Xiao Siqing, and Tianxingyun Supply Chain
              remains active (filed September 2025). Wang Wei's and Tianxingyun's shares in Xingyun Technology are
              court-ordered frozen through January 19, 2029. An April 2026 regulatory penalty was issued for concealing
              a control-transfer agreement — a fresh violation, not a legacy one. These are not legacy governance issues
              that have been cleaned up; they are live regulatory proceedings. Any investor due diligence program must
              engage China-qualified counsel and obtain a current CSRC register status before committing capital.
            calloutType: risk
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
          - type: callout
            title: Research-More — Three Conditions Required Before Buy
            body: >
              Current evidence supports research-more, not buy. The three conditions required for upgrade to buy: (1) a
              new primary financing round at or above the $2.2B mark by credible institutional investors, closing the
              5-year gap in market validation; (2) publication of consolidated audited group financials with verifiable
              revenue, margin, and leverage; and (3) resolution of the CSRC investigation without material sanction
              against Wang Wei, and formal lifting of the share freeze. Absent two of three, entry at current implied
              pricing carries asymmetric downside given the adverse governance and valuation evidence.
            calloutType: recommendation
            claimRefs:
              - CV041
              - CV043
              - CV044
              - CV045
