      - number: '4.2'
        title: 'Polibeli Group Ltd (Nasdaq: PLBL) — Public Subsidiary Financial Detail'
        blocks:
          - type: paragraph
            body: >
              Polibeli Group Ltd, Xingyun's Southeast Asia and Japan B2B distribution arm, is the only entity filing
              audited U.S. GAAP financials. Its Form 20-F for fiscal year 2025, filed with the SEC on April 24, 2026,
              shows full-year revenue of $26.42 million—a 12.6% decline from $30.23 million in FY2024, which itself grew
              32.7% from $22.79 million in FY2023. Japan remained the dominant market at $10.81 million (approximately
              41% of FY2025 revenue), followed by Indonesia at $5.82 million (22%), Hong Kong at $4.74 million, Europe
              at $4.32 million, and other markets at $0.73 million. The FY2025 revenue decline reflects a deliberate
              low-price strategy to build the Indonesia market that compressed margins, combined with slowing demand in
              Japan.

              The income statement reveals the structural fragility of the distribution model. Cost of revenue was
              $24.48 million (92.65% of revenue), leaving gross profit of only $1.94 million and a gross margin of
              7.35%. SG&A of $9.5 million (36% of revenue) was roughly 5× gross profit, producing an operating loss of
              $7.56 million and an operating margin of -28.6%. EBITDA was -$7.4 million. Net loss narrowed to $5.97
              million from $10.98 million in FY2024, but the improvement reflects cost efficiencies, not revenue growth.
              Operating cash flow was -$6.35 million; free cash flow was -$6.5 million with capex of only $155K,
              confirming the asset-light execution model. The company reported a financial health score of 10 out of 100
              by third-party analysis and passed only 3 of 9 standard financial strength tests.

              In May 2026, Polibeli's CFO Zhitian Zhang resigned, effective May 15, 2026, citing personal reasons with
              no stated GAAP disagreements; CEO Hua Chen assumed interim principal financial officer duties. The company
              operates under a dual-class share structure limiting minority governance protections. A-share subsidiary
              行云科技 posted FY2025 revenue of RMB 144.77 million (~$20 million), down 62.57% year-on-year, and a net loss
              of RMB 83.18 million, driven by the collapse of B2C e-commerce revenue (down 98.16% to RMB 5.56 million)
              and impairment provisions of RMB 37.05 million on receivables and other assets.
