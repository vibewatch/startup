  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Consolidated Revenue
        - Audited group-level P&L for Xingyun International (Cayman holding entity) FY2024 and FY2025
        - >-
          Valuation multiples are meaningless without a verified revenue base; GetLatka estimate unverified; PLBL
          revenue covers only one subsidiary
        - Request from management; cross-reference PLBL 20-F vs 行云科技 A-share filings vs GetLatka estimate
      - - Cap Table and Preference Stack
        - >-
          Current capitalization table: share counts, investor ownership percentages, preference terms, and
          anti-dilution provisions for all Series A through C2 investors
        - >-
          Key for understanding governance, control, liquidation waterfall, and real equity value available to new
          investors
        - >-
          Engage directly with company; review any disclosed shareholder agreements; verify Wang Wei stake vs disclosed
          18%
      - - CSRC Investigation Status
        - >-
          Current disposition of CSRC investigation against Wang Wei, Xiao Siqing, and Tianxingyun Supply Chain
          (September 2025 filing)
        - >-
          An active enforcement proceeding may restrict Wang Wei's ability to operate, transfer assets, or lead new
          fundraising
        - >-
          Monitor CSRC filings at csrc.gov.cn; retain China counsel; request management disclosure and written
          representation
      - - Polibeli Path to Profitability
        - PLBL's FY2025 20-F (awaited), management's revenue roadmap, and audited plan to operating breakeven
        - >-
          PLBL's -22% net margin and negative equity make near-term going-concern a risk without capital injection;
          $2.9B market cap cannot survive a going-concern disclosure
        - Review PLBL 20-F annual report when filed; analyse 2025 earnings disclosure; management discussion section
      - - 行云科技 Integration and Lease Rationality
        - >-
          Strategic rationale and independent business assessment for the RMB 3B+ server-leasing contract (280%+ of last
          audited assets) and subsidiary integration plan
        - >-
          A bet equal to 3x the company's audited asset base on an unproven computing-power leasing segment represents
          material capital risk outside core competency
        - >-
          Review 行云科技 (300209) A-share disclosures; request independent board assessment; legal review of lease
          counterparty
      - - Private Mark Validation
        - >-
          Any secondary transaction, investor mark update, or fresh primary financing after the July 2025 PremierAlts
          timestamp that confirms or updates the $2.2B mark
        - >-
          The 2021 Series C2 provided the actual transaction; July 2025 appears to be a data provider re-stamp, not a
          new round; a 5-year stale mark carries high uncertainty in the current environment
        - >-
          Engage PremierAlts, PitchBook, and VC investors directly; request company for most recent investor letter or
          409A appraisal
    notes: >
      Diligence items are ranked by materiality. Items 1 and 3 are blocking for any investment decision at the current
      implied valuation. Items 4 and 5 relate to subsidiary-level risks that affect consolidated group valuation through
      both direct financial impact and reputational contagion. All items should be addressed before a Series D or
      secondary transaction.
