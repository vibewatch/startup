  - id: governance-risks-and-adverse-evidence
    title: Governance Risks, Adverse Evidence, and Downside Scenarios
    body: >
      The single most material risk to Xingyun Group's valuation is the concentration of adverse
      governance events around its founder Wang Wei and the listed A-share subsidiary Xingyun
      Technology (formerly Youkeshu, SZ300209). On January 19, 2026, the Guangdong Provincial
      Shenzhen Intermediate People's Court froze all shares held by Wang Wei (91.85M shares) and
      Tianxingyun Supply Chain (25.64M shares) in Xingyun Technology, covering 117M shares in
      aggregate—12.65% of the company's total capital—for a period through January 19, 2029. In
      September 2025, the CSRC filed formal investigation notices against Wang Wei, Xiao Siqing,
      and Tianxingyun Supply Chain for alleged failure to disclose significant information as
      required under securities law. In April 2026, Xingyun Technology received a regulatory
      penalty for concealing a control-transfer agreement signed in late 2024/early 2025—the
      hidden pact at the core of the Xiao Siqing/Wang Wei control dispute. The same month, Xingyun
      Technology announced a five-year server-leasing agreement totaling over RMB 3B (more than
      280% of the company's last audited total assets), representing a radical pivot into computing
      power leasing with no established operating track record. Separately, Polibeli's CFO resigned
      in the period since the Nasdaq listing.

      On the financial front, Xingyun Technology's 2025 performance forecast projects a net loss of
      RMB 70–90M, reversing a RMB 56.76M profit in 2024, driven by impairment charges (RMB 55M
      provision), revenue decline (82% YoY in first three quarters), and incomplete subsidiary
      integrations. Polibeli (PLBL) carries negative book value per share, a -22.6% TTM net margin,
      and negative return on equity—making it functionally dependent on capital injections or
      sustained market confidence to continue operating as a standalone entity. An adverse correction
      in PLBL's multiple from 108x to a logistics-sector norm of 1–5x P/S would reduce its market
      cap to approximately $26–130M, shrinking Xingyun's implied stake value to near zero and
      rendering the $2.2B private mark materially impaired.
