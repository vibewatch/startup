  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: consolidated-group-financials
      missingEvidence: >
        Audited consolidated P&L, balance sheet, and cash-flow statement for Xingyun International
        Company Limited (Cayman holding entity) for FY2024 and FY2025.
      whyItMatters: >
        Without verified group-level revenue, all P/S-based valuation multiples are speculative;
        the current estimate range of $26M (PLBL only) to $42M (GetLatka unverified) differs by
        60%, making any valuation conclusion unreliable. This is the single most material information
        gap in the entire diligence process.
      diligencePath: >
        Request audited financials directly from Xingyun management; cross-reference PLBL 20-F
        consolidated revenue with 行云科技 A-share quarterly disclosures and any available group-level
        investor reporting.
      relatedQuestionRefs:
        - QV010
        - QV026
        - QV030
      relatedTableRefs:
        - TV004

    - type: private-evidence-only
      severity: material
      topic: cap-table-and-dilution
      missingEvidence: >
        Full capitalization table for Xingyun International showing investor ownership percentages,
        preference terms, anti-dilution provisions, and vesting schedules for all Series A through C2.
      whyItMatters: >
        The dilution and preference stack determines the real equity available to new investors;
        given $953.5M raised, preference multiples could materially reduce the effective equity
        value available to common or late-round investors at exit.
      diligencePath: >
        Request from management or primary VC investors; look for any disclosed shareholder
        agreements in Polibeli's SEC filings (which may include Xingyun International as holding
        company disclosures).
      relatedQuestionRefs:
        - QV023

    - type: missing-source
      severity: material
      topic: secondary-market-transactions
      missingEvidence: >
        Evidence of any secondary market transaction, tender offer, or LP-to-LP transfer in
        Xingyun Group equity after April 2021 that would establish an arm's-length mark for the
        private equity between 2021 and 2026.
      whyItMatters: >
        A secondary transaction at or above the $2.2B mark would significantly strengthen the
        investment case; a transaction below it would trigger a re-evaluation of entry discipline.
      diligencePath: >
        Canvass secondary brokers (e.g., Forge, EquityZen, Nasdaq Private Market) for transaction
        history; enquire with prior-round investors whether any LP or institutional secondaries
        occurred post-2021.
      relatedQuestionRefs:
        - QV033

    - type: missing-source
      severity: material
      topic: plbl-ownership-percentage
      missingEvidence: >
        Exact ownership percentage of Polibeli Group held by Xingyun International Company Limited
        as of the most recent SEC filing, post any lock-up expiries or secondary sales.
      whyItMatters: >
        The implied-stake calculation is sensitive to the ownership fraction; the range of 87–98%
        based on float estimates translates to a $350M+ difference in implied value at current
        PLBL prices, which is material relative to the $2.2B overall private mark.
      diligencePath: >
        Review latest PLBL 20-F (when filed) and most recent 6-K filings for shareholding disclosures;
        check Nasdaq beneficial ownership filings (SC 13G/13D equivalent for foreign private issuers).
      relatedQuestionRefs:
        - QV005
        - QV022

    - type: stale
      severity: minor
      topic: csrc-investigation-current-status
      missingEvidence: >
        The current procedural status of the September 2025 CSRC investigation against Wang Wei,
        Xiao Siqing, and Tianxingyun Supply Chain — specifically whether the case has progressed
        to formal charges, penalty notice, or administrative sanction since initial filing.
      whyItMatters: >
        Escalation from case filing to formal administrative penalty or market ban would constitute
        a thesis-break trigger; absence of further news is not confirmation of resolution.
      diligencePath: >
        Monitor CSRC public enforcement database at csrc.gov.cn; retain China capital-markets
        counsel to obtain current case status; request management to provide written confirmation
        of no new enforcement actions.
      relatedQuestionRefs:
        - QV013

