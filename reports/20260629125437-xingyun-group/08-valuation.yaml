  - id: valuation-context-and-plbl-market-discovery
    title: Valuation Context, PLBL Market Discovery, and Comparable Analysis
    body: >
      Xingyun Group's private valuation of $2.2B as of July 1, 2025 reflects a capital efficiency
      ratio of 2.35x against $950.9M in total disclosed funding (PremierAlts). CBInsights classifies
      the company as a unicorn at Series C-II stage with $953.5M raised, consistent with the public
      record. PitchBook lists the last funding date as July 2025, though the actual transaction
      structure is unclear—no public announcement of a new round has been identified, suggesting this
      may reflect the Polibeli de-SPAC completion rather than a new primary equity raise for the group.

      The August 2025 Polibeli (PLBL) Nasdaq listing following the $3.6B de-SPAC merger with Chenghe
      Acquisition II provides the most direct market signal on part of Xingyun Group's value. With
      Xingyun International Company Limited as PLBL's controlling shareholder (estimated 87–98% of
      shares based on the ~2% institutional and public float), Xingyun's implied value from this stake
      alone is approximately $2.5–2.8B at PLBL's June 2026 market cap of roughly $2.87–2.94B. This
      exceeds the $2.2B private mark, but is entirely contingent on PLBL sustaining a P/S ratio of
      ~108x on $26.4M TTM revenue—a multiple that logistics sector comps at 0.1–0.4x (JD Logistics
      at 0.23x EV/Rev 2025, SF Holding at 0.3–0.4x estimated) cannot support on fundamentals. Even
      Lalamove, an asset-light, high-growth platform with $2.1B 2025 revenue and $0.56B adjusted
      profit, commands a rumored pre-IPO mark of approximately $10B, implying ~5x on revenue—a far
      cry from PLBL's 108x. Cainiao's $10.3B buyout valuation by Alibaba (2024) translates to
      approximately 0.7x on estimated revenue, further underscoring how extreme PLBL's current
      pricing is relative to any precedent transaction.

      Against GetLatka's unverified estimate of $42.3M 2024 group-level net revenue, the $2.2B
      private mark implies approximately 52x P/S—itself extreme. If revenue is closer to the $26.4M
      TTM disclosed by PLBL (which covers only the Southeast Asia subsidiary), then the implied P/S
      for the overall group is well above 80x. Both figures confirm the valuation is driven by
      growth optionality and platform potential, not near-term income generation.
