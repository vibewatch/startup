      Opportunity: large addressable market confirmed. Platform: PLBL listing validated but revenue
      thin. Moat: logistics network valuable but replicable. Unit Economics: PLBL negative margin;
      group unverified. Governance: CSRC enforcement and share freeze are active negatives.
      Valuation: 52–108x P/S is extreme. Evidence Quality: partial from PLBL filings; group opaque.
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045

callouts:
  - calloutType: risk
    title: SPAC Premium Warning — PLBL P/S of ~108x Is Structurally Unsustainable
    body: >
      Polibeli Group's ~$2.9B market cap on $26.4M TTM revenue produces a P/S of approximately
      108x and an EV/Revenue of ~110x. For context, JD Logistics trades at 0.23x EV/Revenue,
      SF Holding at 0.3–0.4x, and even the high-growth platform Lalamove commands only ~5x on
      $2.1B revenue. PLBL's current pricing implies the company will grow to $580M+ in revenue at
      a sustainable margin profile while maintaining current share count and sentiment — a 22x
      revenue increase from current TTM levels in an opaque market. Investors in Xingyun Group
      at the $2.2B private mark are effectively underwriting this scenario implicitly through their
      exposure to the PLBL price.
    claimRefs:
      - CV013
      - CV020
      - CV021
      - CV026

  - calloutType: risk
    title: Active CSRC Enforcement — Governance Risk Is Not Historical
    body: >
      As of the report date, the CSRC investigation against Wang Wei, Xiao Siqing, and Tianxingyun
      Supply Chain remains active (filed September 2025). Wang Wei's and Tianxingyun's shares in
      Xingyun Technology are court-ordered frozen through January 19, 2029. An April 2026 regulatory
      penalty was issued for concealing a control-transfer agreement — a fresh violation, not a
      legacy one. These are not legacy governance issues that have been cleaned up; they are live
      regulatory proceedings. Any investor due diligence program must engage China-qualified counsel
      and obtain a current CSRC register status before committing capital.
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033

  - calloutType: recommendation
    title: Research-More — Three Conditions Required Before Buy
    body: >
      Current evidence supports research-more, not buy. The three conditions required for upgrade
      to buy: (1) a new primary financing round at or above the $2.2B mark by credible institutional
      investors, closing the 5-year gap in market validation; (2) publication of consolidated audited
      group financials with verifiable revenue, margin, and leverage; and (3) resolution of the CSRC
      investigation without material sanction against Wang Wei, and formal lifting of the share freeze.
      Absent two of three, entry at current implied pricing carries asymmetric downside given the
      adverse governance and valuation evidence.
    claimRefs:
      - CV041
      - CV043
      - CV044
      - CV045

