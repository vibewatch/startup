      - number: '5.2'
        title: 品牌服务、出口 / 履约与物流基础设施
        blocks:
          - type: paragraph
            body: >
              Xingyun Group 的物流基础设施由 139 个全球合作和自营仓组成，其中战略位置上的保税设施构成其跨境清关能力的实体锚点。关键国内保税仓包括义乌综合保税区仓（10,000
              m²）、杭州下沙综合保税区仓（20,000 m²）和深圳前海保税港区设施（8,000
              m²），另在上海、宁波、平湖、福州、东莞、郑州、重庆、成都、广州和大连设有国内枢纽。一站式跨境物流服务覆盖保税仓储、装卸、分拣、包装、一件代发、跨境清关和末端配送。进口线（为进入中国的海外品牌提供品牌服务）的客户流程是：海外品牌通过
              LinkieBuy SaaS 入驻 → 下单并从原产地发货 → Xingyun 管理保税清关 → 国内保税仓储 → 通过小程序商城向消费者履约，或分销给 160,000 多家国内线上和线下零售商。出口线（OCP
              品牌出海平台）的流程是：中国品牌入驻 → 在目标市场渠道（TikTok、KA 线下、海外电商）搭建数字店铺 → Polibeli 平台推动向当地 SME 零售商分销 →
              市场内末端配送使用当地第三方物流承运商。行云货仓（Xingyun Cargo）WMS 是一套自研 SaaS 仓库管理系统，带开放 API 接口，使外部零售合作伙伴可以把自己的小程序店铺通过 API 接入
              Xingyun 的保税库存、保税清关数据和履约运营。一个已记录案例（gdte.org.cn，2023）显示，某大型线下大卖场连锁在迁移到 Xingyun Cargo 的 SaaS WMS、并用开放 API
              连接替换外采小程序店铺后，实现月环比销售增长 150%。面向中国品牌出海的品牌服务中，Xingyun 的 OCP（One China Platform）整合 TikTok 全托管、海外电商
              TP（第三方运营）服务、海外营销和线下 KA（key account）渠道服务，覆盖本地渠道结构差异很大的市场：例如东南亚约 50% 零售集中在传统小店渠道，因此 Polibeli 需要在印尼配置 1,000
              人地面销售团队来打穿市场。
