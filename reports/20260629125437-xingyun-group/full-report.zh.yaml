      - number: '2.3'
        title: 买方-用户-付款方分层
        blocks:
          - type: paragraph
            body: >
              Xingyun 的商业模式服务三类买方原型，预算归属和采用路径各不相同。第一，中国中小出口卖家是出境物流、清关和数字平台服务的主要买方；在这个分层中，买方 /
              付款方通常是中小企业总经理或业主，用户则是负责库存和发货的运营或物流人员。截至 2024 年底，中国有超过 120,000 个 CBEC 市场参与者，其中 16,000
              家拥有高新技术企业认证，平台支持下发展出的独立海外品牌超过 30,000 个——这部分长尾构成 Xingyun 的核心卖家可服务市场。第二，寻求进入中国市场的海外品牌购买进口服务、SaaS
              平台和保税仓物流；付款方是品牌总部，买方是区域团队或中国市场负责人。中国境内 CBEC 平台（Tmall Global、JD Worldwide）合计承载来自 90+ 个国家的 46,000
              多个外国品牌；Tmall Global 覆盖超过 1 亿进口消费者。第三，SEA 区域分销商和 B2B 买方由 Xingyun 的 Polibeli Group 服务，采购驱动明显；付款方是企业主或
              CFO，采用触发点是相较本地采购的价格优势。中国 CBEC 进口渠道的平台用户在 2023 年达到 1.88 亿，七年内接近三倍；80% 城市消费者在线购买过进口产品，Gen Z（18–34 岁）占 CBEC
              交易量的 65%。
