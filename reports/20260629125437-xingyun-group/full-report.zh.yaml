  - id: FR003
    title: 依赖图谱：关键伙伴、平台与监管机构
    type: dag
    layout: wide
    summary: |
      梳理行云集团在资本、平台、物流和监管交易对手上的关键依赖关系；每条边代表一项实质运营或财务依赖，并标出风险向量。
    data:
      nodes:
        - id: xingyun_group
