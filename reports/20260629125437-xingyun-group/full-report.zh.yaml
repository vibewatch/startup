              合作的第三方报道佐证。Swisse（Australia）被称为澳大利亚第一健康与营养品牌，通过 Xingyun 包括 PDD、微信和线下渠道在内的全渠道布局，年 GMV 规模达到 ¥100M+；其蔓越莓胶囊
              SKU 在单场 3.8 节活动中售出 7,000+ 件。针对日本时尚品牌 Yohji Yamamoto，LinkieBuy 搭建微信小程序跨境 DTC 渠道，六个月积累 150,000+ 私域用户，首年月 GMV
