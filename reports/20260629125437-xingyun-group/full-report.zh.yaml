      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 美国和 EU De Minimis 变化预示 CBEC 流量结构性改道
            body: >
              美国 2025 年 5 月取消 de minimis，以及 EU 正在审议的 €150 门槛，是十多年来中国至发达市场 CBEC 面临的最重大结构性扰动。两项变化合力把中国出口流量导向
              SEA、中东和拉丁美洲——正是 Xingyun 和 Polibeli 运营的走廊。这会给新兴市场 CBEC 基础设施带来短期需求顺风，但被挤出的流量集中到物流成熟度较低的市场，也会加剧竞争。
