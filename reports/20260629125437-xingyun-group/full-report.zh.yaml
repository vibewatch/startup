      - number: '6.3'
        title: 采用轨迹与规模指标
        blocks:
          - type: paragraph
            body: >
              Xingyun Group 的采用轨迹显示历史 GMV 增长强劲，同时也暴露出变现限制和近期 Polibeli 收入收缩。集团层面，Xingyun 披露的 GMV 从 ¥13.5B（2019）增至
              ¥23B（2020），再到超过 ¥500B（2025）；但 GMV 与收费型收入（GetLatka 2024 年数据约 $42.3M）之间的差距，反映其商业模式偏代理 / 中介属性。服务 3,000+ 品牌和约
              500,000 家 SME 零售商，是 Xingyun 2025 年 5 月十周年活动确认的累计平台开户数（由出席庆典的 Hurun Baijia 独立引用），也出现在 Frost & Sullivan 2023
              年奖项引文中。Polibeli 是因 Nasdaq 公开披露而最便于跟踪的收入实体，其 2024 年收入同比增长 32.7% 至 $30.23M，但 2025 年又下滑 12.6% 至
              $26.42M。这次收缩是重要的采用信号：20-F 将其归因于用低价策略建立印尼市场存在感，以及新兴市场 SME 客户天然的高流失率。20-F 还指出 Polibeli 仍在亏损，2024 年和 2025
              年净亏损分别为 $10.98M 和 $5.97M，并截至 2025 年 12 月 31 日识别出两项内部控制重大缺陷。平台级 KPI——注册用户、月活用户（MAU）、复购频率——Polibeli 或
              Xingyun 均未公开披露，形成关键尽调缺口。Polibeli App 的会员等级系统和 Polisales App（面向外勤销售 CRM，用每日任务提升留存）是结构性留存机制，但其效果没有任何公开披露量化。
