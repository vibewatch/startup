      - number: '2.2'
        title: 市场规模——多重视角与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >
              不同方法和地理范围给出差异显著的估算；所有规模测算都带有实质不确定性，因此作为尽调证据一并保留。按 IMARC Group 的 CBEC 汇总口径（进口加出口），中国 CBEC 市场 2025 年达到 USD
              90.85 billion，并按 14.7% CAGR 走向 2034 年的 USD 312.12 billion。物流子市场更直接对应 Xingyun 这类供应链运营商的可服务空间；Mordor
              Intelligence 估算其 2025 年为 USD 28.28 billion，2026 年增至 USD 33.15 billion，2031 年达 USD 60.62 billion，CAGR 为
              12.83%。Pltfrm.com.cn 给出差异明显的物流估算：USD 58.61 billion，CAGR 8.3%——约为 Mordor
              数字的两倍，可能因为其范围更宽，把仓储和履约基础设施与纯物流费用一并打包。东南亚方面，GII Research 将跨境电商板块估值为 USD 45.39 billion（2025 年），预测到 2031 年以
              10.97% CAGR 增至 USD 84.74 billion。Source of Asia 的较窄估算认为 SEA 跨境市场 2023 年为 USD 13.5 billion，CAGR
              5.7%——只统计买家从本国以外采购，而非所有区域内跨境流动。Momentum Works 报告 SEA 平台电商总 GMV 2025 年为 USD 157.6 billion，同比增长
              22.8%，为四年来最快；但其中包括 SEA 本土卖家，并非纯跨境数字。中国 CBEC 出口 2025 年约达 USD 1.1 trillion（7.8 万亿元人民币），同比增长 24%，其中仅 B2B
              跨境出口就达到 USD 25.1 billion，增长 75%。这些相互矛盾的估算被保留：方法差异本身就是尽调信号，反映了分析师之间相互竞争的范围口径。
