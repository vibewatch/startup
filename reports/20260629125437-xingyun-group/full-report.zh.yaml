  - id: FE001
    title: Xingyun Group 产品架构栈
    type: stack
    layout: standard
    summary: |
      五层架构从全球物流基础设施延伸到 AI / fintech 服务，全部通过行云全球汇“四流合一”中间件整合。
    data:
      layers:
        - label: AI 与 Fintech 服务
          modules:
            - AI 图像商品搜索（计算机视觉）
            - AI 导购助手（行为驱动，20-30% CTR）
            - RPA 自动化（图像处理、计费、海关对账）
            - 供应链贸易金融（订单 / 库存 / 保理，自 2017 年起）
            - 海丝智链稳定币支付试点（HKD 离岸人民币，2025 年 3 月）
        - label: 品牌与零售渠道应用
          modules:
            - LinkieBuy SaaS——面向海外品牌的 WeChat / Alipay / Douyin / RED 店铺
            - Polibeli App——SME B2B 采购平台（印尼 / 日本，2022）
            - Polisales App——外勤销售 CRM 和渠道管理（2023）
            - FlexCreate——按需印刷，600+ 产品类型，Ecwid marketplace（2025）
        - label: SaaS 平台与数字运营层
          modules:
            - 行云货仓 Xingyun Cargo WMS——自研 SaaS WMS，开放 API
            - OCP 品牌出海平台——TikTok 全服务、TP 运营、KA 线下渠道
            - 行云数科产品套件——外综服、SCM、税智汇、B2B 外贸商城
        - label: 行云全球汇供应链中间件（四流合一）
          modules:
            - 物流流——全球连接 170+ 物流中心
            - 商流——接入 200+ 电商渠道 API
            - 资金流——供应链金融和支付结算
            - 信息流——业务中台和数据中台（数据闭环）
        - label: 全球物流与保税仓基础设施
          modules:
            - 139 个全球合作和自营仓
            - 国内保税区：义乌 10K m²、杭州 20K m²、深圳前海 8K m²
            - 一站式跨境物流：仓储、分拣、清关、末端配送
    approximationNotes: |
      层级顺序代表逻辑抽象，不是字面的网络拓扑。架构根据公司官方描述推断；未找到第三方验证。
    claimRefs:
