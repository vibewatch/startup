      - number: '3.2'
        title: 主要竞争对手画像
        blocks:
          - type: paragraph
            body: >
              Cainiao Network 自 2025 年 2 月起由 Alibaba 全资持有；此前 Alibaba 于 2024 年 3 月撤回 Cainiao 的 HK IPO，并以最高 $3.75B
              全面收购少数股权。按包裹量计，Cainiao 是全球最大的跨境电商物流平台。Cainiao FY2024（截至 2024 年 3 月）收入达到人民币 990.2 亿元，同比增长 28%；FY2025 Q1
              收入为人民币 268.1 亿元（同比 +16%）。网络每天在 200+ 个国家处理 5M+ 个跨境包裹，依托 1,100+ 个仓、18 个海外分拣中心和每周 170+ 班包机。关键在于，重新整合进 Alibaba
              平台生态后，Cainiao 现在把 AliExpress、Lazada 和 Trendyol 的品牌落地与入驻服务打包，直接重叠 Xingyun 的海外品牌进口服务。JD
              Logistics（HKEX:2618）FY2025 收入人民币 2171.5 亿元，同比 +18.8%；一体化供应链收入人民币 1162 亿元（+33%），外部客户 91,161 个（+13%）。JD 在 25
              个国家运营 200 个保税 / 海外仓，在 Saudi Arabia 和 Europe 上线 JoyExpress，并于 2025–2026 年完成 Deppon（德邦）收购（持股 99.7%）。SF
              Holding（002352.SZ，6936.HK）FY2025 收入人民币 3082 亿元（+8.4%）；供应链及国际收入人民币 729 亿元（+3.5%），2026 年 4 月国际分部收入 RMB
              6.99B（+18.25%）。SF 是亚洲最大、全球第四大物流服务商，服务 2.35M+ 企业客户和 800M+ 消费者。J&T Express（01519.HK）FY2025 收入 US$12.2
              billion（+18.5%），总包裹量 30.1 billion 件（+22.2%），东南亚市场份额 34.4%（连续 6 年第一）。2026 年 Q1 包裹量达到 8.33 billion 件（同比
              +26.2%）。J&T 聚焦 B2C，主要服务电商平台（SHEIN、Temu、TikTok、AliExpress）；其广州自建分拣中心是公司全球最大分拣中心。Lalamove/Lalatech 2025
              年报告收入 $2.14B（+34.3%）、调整后净利润 $560M，订单 1B+，全球闭环货运 GTV 市场份额 53.1%；但它的模式是同城即时货运，不是跨境品牌赋能。Zongteng Group 以
              YunExpress 和 GOODCANG 品牌运营 3.6M sqm 海外仓面积，在中国跨境物流 TOP50 中排名第一。4PX Express 每天在 200+ 个国家处理 1M+ 个包裹，主要通过
              Global Parcel 和 Fulfillment 网络服务中小电商卖家。
