            body: >
              Xingyun Group 最强的客户证据来自 LinkieBuy 平台为海外品牌进入中国发布的案例研究。BigC（Thailand）是 BJC Group 旗下拥有 1,500 多家泰国门店的大卖场连锁，部署
              LinkieBuy 的微信小程序和跨境 DTC 解决方案后，实现私域用户 60%+ 复购率、GMV 月环比增长 3,711%+，以及 AI+SCRM 运营转化同比 60 倍。这些结果来自 LinkieBuy
