      - 可监测触发项
      - 门槛 / 否决事件
      - 对投资论点的传导
      - 建议行动
    rows:
      - - CSRC 执法升级
        - CSRC 执法登记；Xingyun Technology / Wang Wei 公开披露
        - Wang Wei 被市场禁入，或被刑事移送，或 300209 停牌超过 30 天
        - 实控人失能；境内资本市场平台冻结；Polibeli 上市完整性承压
        - 退出，或在完全解决前硬性暂停；重新进入前要求独立治理评估
      - - A 股子公司结构性减值
        - 300209 季报；2025 全年及 2026 年 Q1–Q2 业绩
        - 2025 全年净亏损，且 2026 年 Q1–Q2 累计收入同比下降超过 60%
        - 证明转型叙事失真；触发 SZSE 星级观察名单；境内资本通道受损
        - 下调 A 股协同价值在投资论点中的权重；重估 Xingyun Group NAV
      - - 中美关税升级至结构性上限
        - USTR Section 301 税率表；Section 122 续期 / 到期
        - 电子 / 服装综合实际关税超过 150%，或美国立法在 3 年以上取消全部 de minimis
        - SME 客户大规模退出美国出口渠道；LinkieBuy SaaS ARR 损失超过 30%
        - 下一次融资事件前要求披露美国渠道收入拆分；建模中国 / SEA 对冲情景
      - - CAC 数据执法行动或重大数据泄露
        - CAC 执法公告；Polibeli / Xingyun Group 公开申报
        - CAC 对 Polibeli 或 Xingyun 实体发出执法通知，或数据泄露影响 >100,000 名用户
        - 即时罚款最高 RMB 10M；存在停业风险；触发 Nasdaq 披露义务
        - 暂停推出新数据产品，直至 CAC 合规审计完成；要求提供 SCC 备案证据
      - - 供应链金融信用恶化
        - Polibeli 季度财务；中国企业违约率指数
        - 平台 NPL 率超过 5%，或 PBOC 供应链金融指引要求 20%+ 拨备
        - Take-rate 被压缩；营运资金流失；可能触发优先债务契约
        - 要求独立复核 SCF 账簿规模、NPL 率和拨备；要求披露准备金
    notes: >
      否决标准门槛是基于公开披露风险因素和作者风险评估提出的监测水平；并非合同契约。「建议行动」适用于持有 Polibeli Group Ltd（PLBL）仓位的投资者，或作为 Pre-IPO 投资者直接持有 Xingyun
      Group 的投资者。触发项监测需要持续访问中国监管公告平台（CSRC、SZSE）和 SEC EDGAR 申报。
    claimRefs:
      - CR001
      - CR013
      - CR022
      - CR027
      - CR033
      - CR043
  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 理由
    rows:
      - - 投资建议
        - 继续研究
        - 私募估值陈旧、治理争议仍在、PLBL 倍数带有投机性、集团财务缺位；这些问题解决前，无法建立高确信度多头仓位。
      - - 置信度
        - 中
        - 规模和市场位置已确认；估值驱动因素（集团收入、股权结构、前瞻倍数）仍不透明。
      - - 风险评级
        - 高
        - CSRC 调查仍在进行；法院已裁定股份冻结；PLBL 净资产为负；行云科技有未决诉讼；CFO 离任。
      - - 估值立场
        - 偏贵
        - 私募估值相当于 GetLatka 估算集团收入 $42.3M 的约 52x；PLBL P/S 约 108x，远高于中国上市物流同业的 0.1–0.4x。
      - - 投资含义
        - 暂缓进入
        - 等待治理问题解决、合并收入披露得到确认，以及新的融资估值；或等 PLBL 倍数正常化至低于 20x P/S。
    notes: |
      建议由证据驱动，且对价格敏感；所有评估均由截至 2026-06-29 的公开证据推断。置信度和风险评级反映现有证据的质量与完整性，不只反映管理层质量。
    claimRefs:
      - CV027
      - CV040
      - CV041
      - CV043
      - CV044
      - CV045
  - id: TV002
    title: 投资论点与反论点
    columns:
      - 论点
      - 类别
      - 确信度
      - 什么会改变判断
    rows:
      - - GMV >500B RMB，验证了大规模贸易量和平台规模化采用
        - 正面论点
        - 高
        - 持续证明净收入转化，并且 take-rate 改善（证据：经审计的集团 P&L）
      - - Polibeli（PLBL）Nasdaq 上市，提供公开市场定价锚和资本通道
        - 正面论点
        - 中
        - PLBL 倍数正常化或持续亏损会削弱这一优势；关注收入增长
      - - Yunfeng Capital、Taikang Insurance、5Y Capital、Matrix Partners 以 $2B+ 估值支持
        - 正面论点
        - 中
        - 5 年以上没有新一轮融资，削弱信号价值；后续融资轮可恢复信号
      - - Wang Wei 的 Hurun 财富 RMB 17B，显示创始人财务利益绑定
        - 正面论点
        - 低
        - CSRC 执法和股份冻结削弱治理信心；利益绑定必要，但不充分
      - - Lalamove（$10B）和 Cainiao（$10.3B 收购）可比案例显示物流科技可获得平台溢价
        - 正面论点
        - 低
        - 两个可比公司的已披露收入都是 Polibeli 的 50–100x；当前收入规模下，溢价不能直接迁移
      - - 私募估值 $2.2B（Jul 2025）已陈旧 5 年以上，且没有主融资轮验证
        - 反论点
        - 高
        - 若新一轮融资估值达到或高于前轮，判断会立即改变
      - - PLBL 基于 $26.4M 收入的 P/S 约 108x，显著高于 0.1–0.4x 的物流板块可比公司
        - 反论点
        - 高
        - PLBL 收入 2 年内增长到 >$200M，且利润率改善，才能缩小差距
      - - 活跃的 CSRC 执法和股份冻结，带来重大舆情与运营风险
        - 反论点
        - 高
        - CSRC 调查完全解决、股份冻结正式解除，并取得干净的治理认证
      - - 没有公开可得的经审计集团合并财务
        - 反论点
        - 极高
        - 管理层发布经审计的集团层面财务，并披露收入拆分和分部间抵消
    notes: |
      确信度评级是分析师对证据强度的判断，不是对公司质量的判断。高确信度反论点需要管理层直接回应或第三方验证，判断才可能改变。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV022
      - CV023
      - CV026
      - CV027
      - CV040
      - CV041
      - CV043
      - CV044
  - id: TV003
    title: 牛市 / 基准 / 熊市情景估值
    columns:
      - 情景
      - 关键假设
      - 隐含 Xingyun Group 价值（USD）
      - 概率信号 / 关键风险
    rows:
      - - 牛市（25% 权重）
        - >-
          PLBL 收入到 2028 年增长至 $150M+（50%+ CAGR）；P/S 压缩至 20x，对应 PLBL $3B；Xingyun 保留 90%+ 股权（约 $2.7B）；核心业务稳定在 $0.8B
          价值；治理风险出清
        - $3.0B–$4.5B
        - CSRC 案件有利解决；PLBL 2026 年收入显著超过 $50M；没有进一步负面治理事件
      - - 基准（50% 权重）
        - PLBL 收入到 2027 年达到 $60–80M；P/S 为 10–15x，对应 $600M–$1.2B；Xingyun 90%+ 股权约 $540M–$1.1B；核心私有业务价值 $800M–$1.2B；治理部分解决
        - $1.5B–$2.5B
        - PLBL 收入温和增长；治理稳定但未解决；私募估值持平至小幅压缩
      - - 熊市（25% 权重）
        - PLBL 收入停滞在 $35M 以下；P/S 压缩至 1–3x；PLBL 市值 $35–$105M；Xingyun 持股价值接近零；需要以 down-round 进行新融资；CSRC 制裁 Wang Wei
        - $0.4B–$0.8B
        - CSRC 正式制裁；PLBL 未能完成后续融资；Polibeli 持续经营警告；行云科技亏损加速
    notes: |
      情景是基于公开可比公司和已披露部分财务作出的概率估计。隐含价值为推断值，并非基于已披露集团财务。概率权重是分析师基于截至 2026-06-29 现有证据作出的主观判断。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV028
      - CV029
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类型
      - 2025 年收入（USD）
      - 市场 / 隐含估值（USD）
      - EV/Revenue 或 P/S
      - 关键相关性
      - 局限
    rows:
      - - Polibeli Group（PLBL，Nasdaq）
        - 上市子公司
        - $26.4M TTM
        - 约 $2.87B 市值（Jun 2026）
        - 约 108x P/S
        - 直接上市子公司；最接近 Xingyun Group 的市场定价代理
        - 收入基数极小；SPAC 炒作溢价；净资产为负；流通股约 2%
      - - JD Logistics（HKEx 2618）
        - 上市物流
        - ~$31.8B
        - 约 $14.5B EV（2025）
        - 约 0.23x EV/Rev
        - 中国最大纯物流上市公司；规模和效率基准
        - 重资产既有玩家；收入约为 Polibeli 的 1,200x；商业模式完全不同
      - - SF Holding（SZ002352）
        - 上市快递物流
        - ~$43.9B
        - 约 $17B EV（估计）
        - 约 0.3–0.4x EV/Rev
        - 市场领先快递；高质量运营；中国境内基准
        - 传统快递模式；跨境 B2B 供应链重叠有限
      - - Lalamove / Lalatech
        - 私有 Pre-IPO
        - 约 $2.1B（2025）
        - 约 $10B（最近披露估值）
        - 约 5x EV/Rev（估计）
        - 轻资产科技物流；平台模式；2025 年调整后利润 $0.56B；最可比的平台溢价
        - 核心地域不同（中国 + SEA 城配）；私募估值；没有交易流动性
      - - Cainiao Smart Logistics
        - 私有（Alibaba 收购）
        - 约 $10B+（估计）
        - 约 $10.3B（2024 年以 $0.62/股收购）
        - 约 1x EV/Rev（估计）
        - 电商绑定的跨境物流；2024 年 3 月以市场环境为由撤回 IPO
        - 完全处在 Alibaba 生态内；没有公平交易定价；IPO 失败显示板块倍数压缩
      - - J&T Express（HKEx 6936）
        - 上市物流
        - 约 $7B+（2025 估计）
        - 约 $3.0–4.0B 市值
        - 约 0.4–0.6x EV/Rev
        - 跨境 B2B 配送；东南亚足迹；与 Polibeli 市场存在结构性重叠
        - 包裹量驱动模式；供应链平台溢价有限；利润率结构不同
      - - Xingyun Group（标的）
        - 私有独角兽
        - 约 $42M 估计（GetLatka，未验证）
        - $2.2B（Jul 2025 私募估值）
        - 约 52x P/S（估计）
        - 本报告标的；资本效率 2.35x；估值陈旧 5 年
        - 收入未验证；没有经审计合并财务；估值陈旧；与 Polibeli 估值重叠
    notes: >
      可比收入、EV 和倍数来自 MarketScreener、Stock Analysis、Yahoo Finance、Minichart、ACN Newswire 与 Alibaba Group 投资者材料。PLBL P/S 为
      2026 年 6 月 26–29 日的实时市场数据。Lalamove 倍数和 Cainiao 估值由部分公开披露及 Alibaba 收购公告推断，属于近似值。Xingyun Group
      收入是未经验证的第三方估计；实际收入未披露。
    enumerationScope:
      coverage: partial
      basis: >
        Public and late-stage private comparable companies in China, Southeast Asia, and global cross-border B2B
        logistics and supply-chain platform segments, selected from analyst databases and market reports as of June
        2026, representing major peers by business model overlap, market cap, or disclosed valuation.
