      - number: '8.4'
        title: 建议、置信度与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              证据权重指向「继续研究」建议，置信度为中等，风险评级为高。估值已经偏紧：无论看 PLBL 的 108x P/S、$2.2B 私募估值对应的 约 52x
              预估集团净收入，还是中国物流或跨境供应链行业的任何先例交易，当前定价都需要集团合并层面拿出尚未证明的收入增长。

              只有三项条件成立，投资判断才可能上调为买入：（1）可信机构投资者以不低于现有估值完成新一轮一级融资，验证当前价格； （2）披露合并审计财务报表，展示集团层面的收入、利润率和现金流，足以计算现实倍数；（3）CSRC
              调查在未对王维作出重大处罚的情况下解决， 且 Xingyun Technology 股份解冻。若三项中至少两项没有兑现，以当前隐含估值进入，就必须押注投机性市场溢价；而这类溢价在 post-SPAC
              科技物流公司里历来脆弱。

              Hurun 2025 Global Unicorn Index 确认 Xingyun Group 仍是独角兽，位列中国 343 家独角兽公司之中（中国独角兽总量同比增长 22%），
              处在队列中段。中国民营科技公司的估值倍数自 2021 年峰值后持续压缩；Cainiao 2024 年撤回 IPO，以及香港物流上市公司相对私募估值长期折价，
              都说明如果没有实质收入证明，当前公开市场近期不太可能在一级发行中认可 Xingyun 完整的 $2.2B 估值。
