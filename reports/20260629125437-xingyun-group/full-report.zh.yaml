      - number: '3.3'
        title: 能力对比与定价
        blocks:
          - type: paragraph
            body: >
              按采购标准映射——跨境物流（出口和进口）、B2B 品牌赋能、SaaS / 数字平台、供应链金融、海外仓，以及 WeChat CRM 集成——Xingyun 只在进口 / 品牌落地和 WeChat / SaaS
              维度突出。跨境出口物流（把电商商品运出中国）方面，Cainiao、JD Logistics、SF Express、J&T 和 Zongteng 在网络密度和成本效率上均优于 Xingyun。SF 和 JD
              在高价值、时效敏感快递上占优；J&T 在东南亚拥有 B2C 件量优势；Cainiao 主导平台卖家
              GMV。行业定价不透明——所有主要承运商都会按重量、目的地和服务等级发布商业费率，但批量折扣通过双边谈判确定。DHL 在其跨境电商方案中给出中国到 Germany 4–5 天送达报价；SF 和 JD
              提供有竞争力的分区定价。纯包裹物流中，Xingyun 采用轻资产外包网络，相比 SF、JD 和 J&T 的自营车队，成本竞争力受限。数字服务（SaaS 品牌管理）方面，Xingyun 的 LinkieBuy
              是真正的差异化点，纯物流玩家没有直接等价产品。LinkieBuy SaaS 订阅费或 Xingyun 供应链金融利率没有公开标价，形成证据缺口。
