      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >
              六股结构性力量支撑 Xingyun 运营区域内的市场扩张。第一，截至 2025 年底，中国 CBEC 试验区生态已扩至 178 个综试区，覆盖全部 31 个省级地区；这些区域提供保税仓准入、简化海关流程和 VAT
              激励，实质降低中小企业履约成本。第二，自 2024 年以来，RCEP 关税减让使进入 SEA 的中韩商品平均关税下降 4–8%，提升到岸成本竞争力；广西对 ASEAN 的 CBEC 贸易增长超过一倍，RCEP
              支持使成本下降 15–20%，配送时间缩短至三天。第三，中国 2026 年 4 月 MOFCOM 指引（与其他五个部门联合发布）将 CBEC 嵌入产业政策，明确把 Silk Road E-Commerce 扩至
              36 个国家，并要求平台承担更强责任。第四，2026 年 6 月九部门联合指引允许 CBEC 运营商在安全可控条件下有序开展跨境数据流动，移除了过去迫使企业承担高成本境内数据存储的合规障碍。第五，WTO
              E-Commerce Agreement 于 2026 年 3 月 28 日 MC14 由覆盖约 70% 全球贸易的 66 个成员采纳，为全球数字贸易规则提供路径；WTO 和 OECD
              研究估算，若不执行，每年会留下 USD 159 billion 的未实现贸易。第六，SEA 内容电商 2025 年 GMV 飙升至 USD 49.7 billion（占平台总 GMV 32%，高于 2024 年的
              20%），移动电子钱包交易额预计达到 USD 636 billion——这两项因素都加深了对中国源商品和一体化物流基础设施的需求。中国企业拥有的海外仓已超过 2,500 个，覆盖 3000 万 m²；2025
              年海外仓面积同比增长 40%。
