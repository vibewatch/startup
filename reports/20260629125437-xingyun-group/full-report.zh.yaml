  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与服务栈
        blocks:
          - type: paragraph
            body: >
              Xingyun Group 的技术底座是「行云全球汇」（Xingyun Global
              Exchange）供应链中间件。公司称其为「四流合一」系统，把物流、商流、资金流和信息流统一到同一套运营骨干里。该中间件连接全球 170 多个物流中心，并接入 200
              多个电商渠道，使上游品牌方、仓库节点、海关机构、支付处理方和下游零售商之间可以实时共享数据。系统架构上，这套中间件之上承载三条主要商业线。第一，Xingyun Global Exchange B2B2C
              进口平台通过超过 150,000 个 SKU 的目录，把 2,000 多个海外品牌方和分销商连接到中国国内 500,000 多家中小零售商，品类覆盖母婴、健康 / 美妆、家居用品和食品 /
              饮料。第二，Polibeli Platform 是 Xingyun 面向出口和东南亚市场的解决方案，由两款自有应用组成：Polibeli App 是面向 SME 零售商的一站式采购平台，2022
              年在印尼推出；Polisales App 是面向销售代表的移动 CRM 和销售管理工具，2023 年推出，二者均在 Polibeli Group 20-F 文件中披露。第三，LinkieBuy 是面向海外品牌的
              SaaS 跨境电商平台，主要服务来自日本、泰国、东南亚和欧洲的品牌，帮助其通过定制化微信小程序商城、支付宝跨境店铺、Douyin global shopping（抖音全球购）和 Xiaohongshu/RED
              商城在中国建立数字零售触点，并集成 SCRM（AI 驱动的社交 CRM）、私域运营、直播和广告服务。行云数科（Xingyun Digital Tech）是全资技术子公司，负责产品商业化，并提供更多工具，包括
              B2B 外贸商城、外贸综合服务（外综服）平台、达人匹配分销平台、供应链管理（SCM）系统和税智汇（Tax Intelligence Hub）合规方案。
