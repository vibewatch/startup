companyProfile:
  summary: >
    行云集团是一家起家于深圳的跨境数字供应链公司，业务围绕品牌入华、中国品牌出海、仓储、物流、海关 / 合规流程和商业 SaaS 展开。集团由前 ZTE 高管王维于 2015 年 5
    月创立，走的是平台加服务模式，而不是纯自有资产承运商模式；随后加入 LinkieBuy、EC Mall、供应链金融和海外仓能力，连接品牌与中小零售商。母公司层面仍为非上市公司，但如今有两个公开侧锚点影响尽调：Polibeli
    Group 于 2025 年登陆 Nasdaq，以及 A 股子公司行云科技；后者的治理争议和 CSRC 执法已带来实质性舆情风险。
