  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              行云集团在跨境数字供应链中面对三层相互重叠的竞争：（1）全栈物流基础设施商——Cainiao、JD Logistics、SF Holding 和 J&T
              Express——它们处理海量包裹，并快速扩张海外仓和品牌赋能能力；（2）垂直跨境物流与海外履约专家——Zongteng Group（纵腾集团）、4PX Express（递四方）和
              YunExpress——它们以仓储、末端配送和海关服务覆盖中小企业与平台卖家；（3）Lalamove/Lalatech 等同城即时平台，侧面争夺供应链物流预算，但服务的是不同工作流。2026
              年，中国跨境电商物流市场规模为 USD 33.15 billion，预计到 2031 年按 12.83% CAGR 增长（Mordor Intelligence），其中 B2B 是增长最快的子板块，CAGR 超过
              12%。在这个格局中，Xingyun 的主要差异化是品牌赋能模式：服务进入中国的海外品牌（进口服务）和走向全球的中国品牌（出口服务），并整合 SaaS 平台（LinkieBuy）、供应链金融和 WeChat
              CRM 工具。对 Xingyun 瞄准的海外品牌而言，真正的竞争底线是现状替代方案——人工货代、品牌代理分销商，以及在 Tmall/JD 上自建直营渠道。主要担忧在于，Alibaba 的 Cainiao 和 JD
              Logistics 都在投资品牌服务叠层，侵蚀 Xingyun 的差异化位置；同时 J&T 和 SF 主导了 Xingyun 部分依赖的商品化物流层。
