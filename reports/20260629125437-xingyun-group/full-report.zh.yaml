chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              行云集团（Xingyun Group），法律主体为深圳市天行云供应链有限公司，2015 年 5
              月创立于中国深圳。公司自称是「中国全球互联网电商领导者和全球商品综合服务平台龙头」，使命是「让全球买卖变得更简单」。Xingyun 运营一站式 B2B
              数字供应链，覆盖跨境进口服务（帮助海外品牌进入中国市场）、出口服务（帮助中国品牌走向全球）、跨境物流、清关、供应链金融和数字平台。产品组合包括 LinkieBuy——一个为海外品牌在中国整合 WeChat 与
              Alipay 小程序的 SaaS 平台——EC Mall、LinkieSCRM，以及 Flexcreate（按需打印，2025 年 2 月上线）。公司的国际控股架构以 Xingyun International
              Company Limited 为 Cayman Islands 母公司；其东南亚 B2B 业务 Polibeli Group Ltd 于 2025 年 8 月完成 Nasdaq 上市。Xingyun
              在深圳、杭州、上海、香港和新加坡运营；业务覆盖 72 个国家和 1 个地区；全球拥有 139 个自营或合作仓；服务 3,000+ 个海外品牌和 160,000+
              个国内零售商。公司的收入模型混合代理费、物流价差、SaaS 订阅和服务费。2025 年 GMV 超过 5000 亿元人民币，但 GetLatka 数据显示 2024 年净收入约
              $42.3M，反映了商品交易总额与收费型收入确认之间的差异。
