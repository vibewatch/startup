      - number: '8.3'
        title: 治理风险、负面证据与下行情景
        blocks:
          - type: paragraph
            body: >
              Xingyun Group 估值里最实质的风险，是围绕创始人王维以及 A 股上市子公司 Xingyun Technology（原 Youkeshu，SZ300209）集中爆发的负面治理事件。2026 年 1 月
              19 日，广东省深圳市中级人民法院冻结了王维持有的 Xingyun Technology 全部股份（91.85M 股），以及 Tianxingyun Supply Chain 持有的全部股份（25.64M
              股），合计 117M 股，占公司总股本 12.65%，冻结期至 2029 年 1 月 19 日。2025 年 9 月，CSRC 因涉嫌未按证券法要求披露重大信息， 对王维、肖四清和 Tianxingyun
              Supply Chain 正式立案调查。2026 年 4 月，Xingyun Technology 因隐瞒 2024 年底 / 2025 年初签署的控制权转让协议收到监管处罚；这份未披露协议正是肖四清 /
              王维控制权争议的核心。同月，Xingyun Technology 宣布一项五年期服务器租赁协议，总额超过 RMB 3B（超过公司最近一期经审计总资产的 280%），等于在没有成熟运营记录的情况下，
              激进转向算力租赁。另一个信号是，Polibeli 在 Nasdaq 上市后的一段时间里，CFO 已经离任。

              财务端，Xingyun Technology 2025 年业绩预告预计净亏损 RMB 70–90M，较 2024 年 RMB 56.76M 盈利转为亏损，主因是减值计提 （RMB 55M
              拨备）、收入下滑（前三季度同比 -82%）以及子公司整合不完整。Polibeli（PLBL）每股账面价值为负，TTM 净利率
              -22.6%，股本回报率为负；要作为独立实体继续运营，实质上依赖资本注入或市场信心持续支撑。若 PLBL 的估值倍数从 108x 回落到物流行业 1–5x P/S 的常态，其市值会降至约
              $26–130M，Xingyun 持股的隐含价值接近归零，$2.2B 私募估值也会出现实质减值。
