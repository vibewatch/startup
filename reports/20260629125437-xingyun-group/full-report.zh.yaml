      - number: '7.5'
        title: 缓释框架、监测触发器与投资否决标准
        blocks:
          - type: paragraph
            body: >
              Xingyun 已采取若干结构性缓释措施，降低但无法消除剩余敞口。Polibeli 的 Nasdaq 上市提供了一个独立于 CSRC A 股执法拖累的国际资本市场锚点；170+
              海外仓网络使面对美国关税的品牌方客户可以采用大宗预进口清关策略；Xingyun 的 B2B 模式服务品牌和 SME 零售商，而非直接服务终端消费者，相比纯 DTC 平台更能隔离 de minimis
              直接冲击。但五大主要风险类别的剩余敞口仍高。CSRC 执法行动尚未解决，并有升级为 300209.SZ 停牌的风险，届时会冻结 Xingyun Group
              的主要国内资本市场载体。监测方面，投资者应跟踪四项否决标准阈值：（1）CSRC 将王维处罚升级为市场禁入或刑事移送，这会使控股股东失能并迫使紧急治理过渡；（2）星云科技 2025 或 2026
              全年净亏损，并伴随经营持续恶化，显示问题是结构性减值而非过渡期扰动；（3）美国电子商品有效关税率超过 150%，或欧盟对 €30 以上亚洲原产包裹正式征收关税，触发客户大规模退出西方出口渠道；（4）Xingyun
              或 Polibeli 平台发生重大 CAC 执法行动或数据泄露。下方否决标准表将这些触发器、阈值、传导路径和尽调建议动作正式化。
