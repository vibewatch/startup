      - number: '8.2'
        title: 估值背景、PLBL 市场发现与可比分析
        blocks:
          - type: paragraph
            body: >
              Xingyun Group 截至 2025 年 7 月 1 日的 $2.2B 私募估值，对应相对 $950.9M 已披露总融资额（PremierAlts）的资本效率倍数 2.35x。CBInsights
              将公司归类为 Series C-II 阶段独角兽，累计融资 $953.5M，与公开记录一致。PitchBook 列示最近融资日期为 2025 年 7
              月，但实际交易结构不清楚——未发现新一轮公开公告，说明这可能反映 Polibeli de-SPAC 完成，而非集团新的一级股权融资。

              2025 年 8 月，Polibeli（PLBL）通过与 Chenghe Acquisition II 的 $3.6B de-SPAC 合并在 Nasdaq 上市，为 Xingyun Group
              部分价值提供了最直接的市场信号。Xingyun International Company Limited 是 PLBL 控股股东（基于约 2% 机构和公众流通股，估计持股 87–98%），按 PLBL 2026
              年 6 月约 $2.87–2.94B 市值，仅该持股隐含给 Xingyun 的价值约为 $2.5–2.8B。这高于 $2.2B 私募估值，但完全取决于 PLBL 能否在 $26.4M TTM 收入上维持约
              108x P/S；物流板块可比公司的 0.1–0.4x 倍数（JD Logistics 2025 EV/Rev 为 0.23x，SF Holding 估计 0.3–0.4x）无法从基本面支撑这一水平。即便
              Lalamove 作为轻资产高增长平台，2025 年收入 $2.1B、调整后利润 $0.56B，传闻 pre-IPO 估值约 $10B，对应收入约 5x——与 PLBL 的 108x 相距甚远。Alibaba
              2024 年以 $10.3B 估值回购 Cainiao，折合估计收入约 0.7x，进一步凸显 PLBL 当前定价相对任何先例交易都极端。

              按 GetLatka 未验证的 2024 年集团层面净收入估计 $42.3M，$2.2B 私募估值隐含约 52x P/S，本身已极端。如果收入更接近 PLBL 披露的 $26.4M
              TTM（仅覆盖东南亚子公司），则整个集团隐含 P/S 远高于 80x。两个数字都说明，估值由增长可选性和平台潜力驱动，而非近期收入生成。
