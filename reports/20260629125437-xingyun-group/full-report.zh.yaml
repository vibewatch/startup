      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              Xingyun Group 子公司层面的财务质量偏低，合并母公司层面的财务状况又不透明——这是投资承销最难处理的组合。已公开披露的子公司毛利率很薄（7–15%），经营利润率深度为负（Polibeli 为
              -28%），现金消耗很快，且一家子公司面临持续经营压力。收入趋势也不乐观：Polibeli 同比下滑 -12.6%，行云科技 FY2025 收入骤降 -62.57%；尽管行云科技在 2026 年 Q1
              借助新注入的 B2B 业务实现环比大幅修复（同比 +397.86%），但这些业务经济模型差异很大。 新业务毛利更低，并带来规模很大的应收账款，相当于用回款风险替代收入规模风险。

              集团的轻资产模式确有结构性优势：Polibeli 的资本开支只有 $155K，仓储和物流靠分布式合作伙伴，数字化工具以 SaaS 交付，固定资本需求因此受限。但轻资产不等于没有营运资本压力：B2B
              采购平台必须给零售商授信，同时从品牌方获得账期；当规模扩张快于回款时，现金转换周期会吞噬现金。公司宣称 GMV 达 5000 亿元人民币，而已披露净收入只有数千万美元，意味着整体抽佣率极低——估计远低于 GMV
              的 1%。这与商品化采购和物流中介的定位相符，却几乎不给固定成本吸收留下容错空间。阻止对母公司做财务承销的关键尽调卡点包括：（1）没有合并审计财务报表；（2）没有披露集团层面 GMV
              到收入的桥接；（3）任何客户分群都没有披露 CAC、回本期或 cohort 留存；（4）Xingyun Group 母公司没有披露现金头寸、烧钱速度或
              runway；（5）供应链金融贷款余额和信贷质量没有独立验证数据。
