  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: wide
    summary: |
      从规模证据出发，经过产品、财务、治理风险和估值，最终落到 research-more 建议。
    data:
      nodes:
        - id: market
          label: 规模：GMV >500B RMB；72 个国家；3,000+ 品牌；139+ 仓库
        - id: product
          label: 平台：Polibeli（PLBL Nasdaq）+ LinkieBuy SaaS + 物流 + SCF
        - id: financials
          label: 财务：PLBL 按 $26M TTM 收入计 P/S 约 108x；净资产为负；无集团合并账目
        - id: risks
          label: 风险：CSRC 执法；12.65% 股份冻结；CFO 离职；行云科技亏损；转向算力
        - id: valuation
          label: 估值：私募标记 $2.2B（2025 年 7 月，5 年未更新）；按估算收入隐含 P/S 约 52x
        - id: recommendation
          label: RESEARCH-MORE：等待治理问题解决、收入披露和新一轮标记后再推进
    approximationNotes: |
      流程图为示意；箭头代表分析推理，而非因果顺序。
    claimRefs:
      - CV040
      - CV041
      - CV044
      - CV045
  - id: FV002
    title: 对 PLBL 收入倍数的估值敏感性
    type: bar
    layout: standard
    summary: |
      在五个 PLBL P/S 倍数情景下，行云集团隐含总价值（百万美元）；核心运营价值按保守 $600M 固定。
    data:
      items:
        - label: 熊市：PLBL 1x P/S（市值 $26M）
          value: 650
        - label: 温和熊市：PLBL 5x P/S（市值 $132M）
          value: 730
        - label: 基准：PLBL 15x P/S（市值 $396M）
          value: 960
        - label: 牛市：PLBL 30x P/S（市值 $792M）
          value: 1310
        - label: 当前：PLBL 约 108x P/S（市值 $2.9B）
          value: 3210
    approximationNotes: >
      核心运营假设为 $600M（保守综合：中国业务 + 行云科技持股价值，扣除治理风险折价）。各情景中 PLBL 持股按市值 90% 计算。所有价值均为分析师基于截至 2026-06-29
      公开市场数据作出的估算；没有已确认的集团财务数据支撑这些数字。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV038
  - id: FV003
    title: 分情景估值与回报区间
    type: range
    layout: standard
    summary: |
      截至 2026 年 6 月，在熊市、基准和牛市情景下，行云集团隐含总价值（百万美元）的低值、中值和高值。
    data:
      items:
        - label: 熊市
          low: 400
          high: 800
        - label: 基准
          low: 1500
          high: 2500
        - label: 牛市
          low: 3000
          high: 4500
    approximationNotes: |
      所有数字均为分析师情景估算，依据公开可比公司倍数、PLBL 市场数据和部分集团披露；目前没有经审计的集团财务数据。情景概率权重：熊市 25%、基准 50%、牛市 25%。数字代表行云集团控股实体的隐含总企业价值。
    claimRefs:
      - CV037
      - CV038
      - CV039
  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: standard
    summary: |
      基于截至 2026 年 6 月的可用证据，对七个维度按 0–10 分打分，可直接用于 IC。综合评分指向 research-more。
    data:
      items:
        - label: 市场机会
          value: 7
        - label: 平台 / 产品证明
          value: 5
        - label: 竞争护城河
          value: 5
        - label: 单位经济
          value: 2
        - label: 治理 / 风险
          value: 2
        - label: 估值纪律
          value: 2
        - label: 证据质量
          value: 3
    approximationNotes: >
      分数是分析师基于证据作出的评估（0=很差，10=优秀）。市场机会：大体量可服务市场已确认。平台：PLBL 上市提供验证，但收入薄。护城河：物流网络有价值但可复制。单位经济：PLBL 利润率为负；集团未验证。治理：CSRC
      执法和股份冻结是当前负面因素。估值：52–108x P/S 极端。证据质量：部分来自 PLBL 文件；集团不透明。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
