      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: 双轨资本战略释放价值
            body: >
              行云集团执行了一套复杂的双轨资本战略：一边保留核心私有集团，一边将 Polibeli 分拆至 Nasdaq（PLBL，2025 年 8 月），并收购 A 股行云科技（SZ300209）控股权。这使 Xingyun
              能同时接入美国和中国公开市场资本，又保留私有母公司的灵活性和速度。2025 年 8 月，Polibeli 持股（约 50%）按市价约值 $2.1B——高于 Xingyun
              最后一次披露私募轮的总投后估值——即便集团整体不 IPO，也显示出可观的内含价值。
            calloutType: strength
            claimRefs:
              - CO015
              - CO016
              - CO017
              - CO037
          - type: callout
            title: 治理与监管风险集中在创始人身上
            body: >
              2026 年 CSRC 对王维采取执法行动（因披露违规罚款 350
              万元人民币），叠加行云科技（SZ300209）仍在持续的公司治理争议——包括被指公章伪造和董事会换届争夺——引入了实质性的关键人物与监管风险。王维在上市公司的股份已于 2026 年 1 月全部冻结，上市实体预计
              2025 年经营亏损 7000–9000 万元人民币。尽管这些问题在形式上被描述为与行云集团核心运营无关，但它们折射出王维的管理风格，也给任何评估 Xingyun 系公司的机构投资者提出治理尽调问题。
            calloutType: risk
            claimRefs:
              - CO019
              - CO032
              - CO033
              - CO034
              - CO040
          - type: callout
            title: GMV 与净收入背离需要澄清
            body: >
              行云集团报告年度 GMV 超过 5000 亿元人民币（约 $68B），而第三方数据源估算 2024 年净收入约 $42.3M。GMV 与净收入之间约 1,600x 的比例，意味着抽成率极低（低于
              0.1%），或收入确认方式与促成交易规模之间存在口径差异。没有经审计财务报表，投资者无法判断「revenue」数字只代表 SaaS / 服务费、代理价差，还是更完整的利润表口径。这个缺口是首要尽调风险。
            calloutType: insight
            claimRefs:
