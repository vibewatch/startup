            body: >
              分析师对中国 CBEC TAM 的估算从 USD 28 billion（仅物流，Mordor）到 USD 90 billion（总贸易额，IMARC）不等。给 Xingyun
              这样的物流与供应链平台估值时，物流子市场估算（视范围为 USD 28–58 billion）才是更相关的可服务池。投资者不应锚定 CBEC 贸易流总额；其中包含 Xingyun 无法作为收入捕获的上游贸易价值。
