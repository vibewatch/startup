      - number: '6.4'
        title: 留存代理、集中度风险与负面信号
        blocks:
          - type: paragraph
            body: >
              Xingyun Group 的客户耐久性呈现分化。进口侧（海外品牌进入中国）中，BigC 案例的私域用户 60%+ 复购率，以及与 Swisse、Yohji Yamamoto
              等品牌持续多年的关系，提示有一定留存；但这些都是公司自报指标，未经独立审计。SaaS 和代理服务的合同期限未公开披露，LinkieBuy 分部也未发布 NRR。出口侧 SME
              渠道（Polibeli）的负面信号更具体：Polibeli FY2025 收入较 FY2024 下滑 12.6%，20-F 明确警告「由于 Polibeli 许多客户为
              SME，他们更易受到总体经济状况变化影响……Polibeli 可能经历较高客户流失率。」这是来自第一方的负面承认。地域集中风险极端：日本贡献 Polibeli 2024 年收入约 52%，印尼约 38%，意味着
              Polibeli 90%+ 收入只来自两个市场。越南于 2023 年 8 月启动以分散风险，但仍是小贡献者。2026 年 5 月出现外部监管负面信号：印尼贸易部宣布计划修订 Trade Regulation
              No. 31/2023，背景是 MSME 普遍抱怨数字平台行政和物流费用过高；该变化可能直接影响 Polibeli 在其最大增长市场的成本结构和卖家留存。此外，Polibeli CFO Zhang Zhitian
              于 2026 年 5 月因个人原因辞任，CEO Hua Chen 暂时接管财务职责，直到 2026 年 6 月任命新 CFO Liang Meijun。通过 SPAC 合并维持的双重股权结构意味着 Xingyun
              International 控制 Polibeli 99.19% 投票权，限制独立董事会治理。对 Xingyun Group 国内零售渠道而言，500,000 家 SME 零售商这一数字尚未由活跃用户数或
              cohort 留存数据独立验证，也没有公开证据说明各分部的平均客户生命周期价值或流失率。
