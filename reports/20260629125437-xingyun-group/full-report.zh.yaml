      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >
              行云集团由王维（Wang Wei，也称 Billy）创立并担任董事长；王维 1981 年出生于上海。他在 City University of Hong Kong 师从 Yang Zhilin
              教授取得博士学位（研究发表于 Journal of Business Research），并另有 Tsinghua University 博士学位；他也是 CityU Hong Kong 副教授、日本
              Waseda University 访问学者。2015 年创办 Xingyun 之前，王维在 ZTE（中兴通讯）任职约九年，曾任 PMO 全球项目管理系统负责人，后任海外事业部总经理。2015 年，他与五名前
              ZTE 同事在深圳一间租来的公寓里启动 Xingyun；2016 年跨境电商税改冲击期间，他一度抵押个人房产来发工资。2021 年，他入选 Fortune 中国 40 Under 40。到 2025 年 10
              月，其个人财富据报为 165 亿元人民币（Hurun Rich List 第 399 位）；到 2026 年 3 月，Hurun Global Rich List 报告为 170 亿元人民币（第 1952
              位）。数据存在冲突：GetLatka 将 CEO/Founder 列为「Leon Zhang」，但没有任何中英文一手来源验证；所有一手和可信二手来源均确认王维（Wang
              Wei/Billy）为创始人兼董事长。2025 年 3 月，王维通过破产重整中的司法执行，成为 A 股上市公司有棵树科技（SZ300209）的控股股东（≥18%）；2026 年 2
              月，该上市公司更名为行云科技。这笔收购引发了与前创始人肖四清之间的治理争夺。2026 年 4 月，Hunan CSRC 因该重整相关信息披露违规，对王维作出罚款 350
              万元人民币的执法决定——这是一项负面监管认定，也给 Xingyun Group 本体引入了关键人物治理风险。
