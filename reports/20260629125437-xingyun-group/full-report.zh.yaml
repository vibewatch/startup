          - type: callout
            title: 结构性风险：美中关税不可逆
            body: >
              de minimis 取消和关税叠加不是周期性逆风，而是结构性政策选择；2026 年 2 月 Section 122 行政令已确认这一点，并经受住 Supreme Court IEEPA
              裁决。以中国直邮免税发货建立业务的出口型 SME 客户，很难轻易回头。Xingyun 的出口赋能收入线与该客户群的存续能力直接相关。即便达成美中贸易协议，考虑到美国两党均支持取消 de
              minimis，原待遇也不太可能完全恢复。
            calloutType: risk
            claimRefs:
              - CR019
              - CR021
              - CR022
              - CR023
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              Xingyun Group 的投资论点建立在三个相互依赖的支柱上：规模、平台和可选性。公司通过自有供应链基础设施撮合超过 5000 亿元人民币 GMV，网络覆盖 72 个国家和 139
              个仓库；若从头复制，资本投入会是当前私募估值的数倍。Polibeli 在 Nasdaq 上市（PLBL）创造了公开市场价格发现锚点和新的融资路径，提供了私有同行不具备的 runway。Yunfeng
              Capital 在 2021 年 Series C2 领投，Crescent Point、Harvest Fund、Taikang Insurance、5Y Capital 和 Matrix Partners
              同投，释放了机构对跨境 B2B 供应链模型的认可。王维估计个人财富为 RMB 17B（Hurun 2026），意味着创始人运营者仍通过个人财务敞口与公司绑定。

              反论点同样强。$2.2B 私募估值已经陈旧超过五年，2021 年 4 月以来没有新一轮一级融资验证；在当前利率更高、风险偏好更低的私募市场环境中，陈旧估值通常会高估公允价值。PLBL 在 $26.4M TTM
              收入上的 P/S 约 108x，用物流行业可比公司无法辩护，更像投机溢价而非基本面定价。更关键的是，控股实体没有公开的合并审计财务报表，集团层面收入、利润率和杠杆分析都无法展开。CSRC
              正在对王维和天行云供应链执法——指控涉嫌未披露重大信息——且法院冻结 A 股子公司全部控股股东股份，带来重大舆情和运营风险。2026 年 4
              月星云科技因隐瞒控制权转让协议受到处罚，说明治理失灵不是历史问题：它尚未解决，并且仍在持续。
