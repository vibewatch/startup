      - number: '2.5'
        title: 采用约束与市场风险
        blocks:
          - type: paragraph
            body: >
              若干实质约束削弱了增长叙事。最重要的短期冲击，是美国在 2025 年 5 月终止 de minimis 豁免，对中国原产小包征收 120% 关税或每件 USD 100–200 邮政包裹费用，促使 Temu
              转向美国本土卖家，并迫使中国出口商改道欧洲和新兴市场。EU Parliament 2026 年 3 月中国代表团发现，进入欧洲的所有小包中 91% 来自中国；MEPs
              对结构性产能过剩、系统性产品安全风险和平台监管不足提出担忧。EU 正在评估取消 €150 de minimis 门槛，目前该门槛允许每年约 45 亿个中国包裹免税进入。保护主义情绪正在扩散：Vietnam 于
              2024 年 12 月终止 Temu；Indonesia 2024 年 10 月要求将其从应用商店下架，以保护国内 SMEs。基础设施方面，2024 年 Red Sea 中断推高运费
              30%，暴露海运依赖；China-Europe rail 运量随之增长 10%，但规模上无法完全替代。中国 Data Security Law 过去要求所有 CBEC
              用户和交易数据存储在境内，抬高海外仓合规成本——2026 年 6 月指引部分缓解了这一问题。SEA 零散的 de minimis 规则和进口 VAT 结构造成到岸成本不透明，压低冲动购买，尤其是在
              Indonesia。平台集中度也限制小卖家的分销渠道多样性：Shopee、Lazada 和 TikTok Shop（包括 Tokopedia）控制 SEA 电商的 98.8%。
