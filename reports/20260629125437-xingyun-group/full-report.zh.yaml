  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 披露不透明、证监会执法与法律风险
        blocks:
          - type: paragraph
            body: >
              最急迫的近期风险，是中国证券监督管理委员会（CSRC）正在对王维、肖四清和深圳市天行云供应链有限公司——Xingyun Group 运营实体——采取执法行动。2025 年 9 月，CSRC
              对三方出具正式《立案告知书》，原因是涉嫌未按中国证券法要求披露重大信息。核心指控围绕 2024 年末至 2025
              年初签署的一份控制权转让协议，该协议把星云科技（300209.SZ）的实际控制权从肖四清转移给王维——而相关方据称在重组过程中向公众股东隐瞒了这份协议。到 2026 年 4
              月，行政处罚决定书已经出具，深圳证券交易所同步公开谴责，王维作为 Xingyun Group（私有）和星云科技（A 股上市）的实际控制人因此承担直接法律责任，Polibeli Group Ltd（PLBL,
              Nasdaq）也间接受到声誉和治理拖累。2026 年 CSRC 执法行动是近年最激进的一轮：证监会 2026 年首批处罚通知包括一笔创纪录的 102.2
              亿元市场操纵罚款，并同时针对多家深圳审计机构的治理失灵采取行动；退市后追责行动也确认，监管不会允许市场退出成为规避后果的屏障。另一个独立风险是，星云科技披露一宗涉及约 9640
              万元未付物流服务费的仲裁案件，增加重大法律风险。Polibeli Group 2025 年年报（2026 年 4 月提交的 Form
              20-F）承认财务报告内部控制存在重大缺陷，并披露公司有意采用母国（Cayman Islands）公司治理豁免，而非完全遵守 Nasdaq 标准，这削弱国际投资者的股东保护。星云科技长期董事会权力斗争——王维在
              2025 年 10 月最终罢免原董事会前，不得不召开两次临时股东大会——导致 2025 年 Q3 财务披露延迟，本身也有监管违规风险。这些重叠的负面信号使披露不透明成为该投资逻辑中严重性最高的单一风险。
