      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              自 2015 年以来，行云集团多轮融资累计约 $950.9M。天使轮由 Zhongding Capital（钟鼎资本）提供，约 1500 万元人民币，用于初始 SaaS 系统开发。到 2018 年 11 月，B
              轮「数千万美元」由 Hongtai Aplus、Matrix Partners China、Eastern Bell Capital 和 GSR United Capital 联合领投。2019 年 8
              月，公司从 Matrix Partners China、Oriental Fortune Capital、Eastern Bell Capital 和 Lan Fund 融得 $100M B+ 轮。2020 年
              9 月，Xingyun 完成 $200M C 轮，投后估值 $2 billion，由 Taikang Insurance Group、Highlight Capital 和 Zhongyuan Capital
              联合领投，GLP 的 Hidden Hill Capital、Morningside Venture Capital、Xingnahe Capital、C&D Group 投资平台和 Pantheon Asset
              参投。最大一轮 C2 轮（$600M）于 2021 年 4 月完成，由 Yunfeng Capital（云锋基金）领投，Crescent Point、Harvest Fund Management、5Y
              Capital、Taikang 和 Matrix China 参投——确认其独角兽地位，投后估值超过 $2B（Grokipedia 另称 $3B，未获其他来源确认）。2025 年 7 月又完成一笔金额未披露的
              Later Stage VC 轮，使估算累计融资达到 $950.9M，二级市场数据给出的当前估值为 $2.2B。投资方超过 30 家头部机构，尤其包括 National SME Development
              Fund（国家中小企业发展基金，财政部相关载体），体现了民营与国资背景资本的共同支持。Xingyun 的资本效率比约 2.35x（估值 / 融资额）。Polibeli de-SPAC 交易（估值 $3.6B）为
              Xingyun 约 50% 的 Polibeli 持股提供了隐含的部分变现锚点；截至 2025 年 8 月，该持股按市价约值 $2.1B。
