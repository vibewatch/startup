      - number: '7.2'
        title: 地缘政治、关税与海关合规风险
        blocks:
          - type: paragraph
            body: >
              美国 $800 de minimis 豁免取消——中国原产商品自 2025 年 5 月 2 日起取消，所有原产地商品自 2025 年 8 月 29 日起取消——对 Xingyun
              关键增长向量之一的中国品牌出口渠道构成结构性威胁。所有从中国发往美国消费者的包裹现在都需要正式报关、HTS 归类并缴纳全额关税。中国原产商品进入美国的有效关税率目前为 40% 至 145%，由基准 MFN
              关税、Section 301 对华专项关税（25–125%）和 Section 122 对等附加费（15%，2026 年 2 月 24 日生效）组成。全球 de minimis 取消后四个月内，进入美国的
              $800 以下包裹量约下降 54%，Shein 和 Temu 等主要平台转向美国大宗仓储，以避免逐包裹关税敞口。Xingyun 的 LinkieBuy SaaS 和出口品牌赋能服务会在 SME
              客户重新定价或退出美国渠道时面临利润率压缩。欧盟也带来平行逆风：自 2026 年 7 月起，来自亚洲的低价值直邮包裹每件需缴纳 €3 固定处理费，侵蚀直发欧盟的经济性。中国央行还发布了 2026 年 2 月 1
              日生效的修订版《银行间外汇市场管理规定》，扩大交易和清算要求，并要求跨境支付平台执行更严格的「穿透式」KYC；这直接影响 Xingyun 的供应链金融和跨境支付产品。转运执法进一步增加关税环境复杂度：CBP
              正在强力审计经越南、墨西哥和其他第三国转运货物的原产地声明，清除 Xingyun SME 出口客户常用的规避路径。
