      - number: '4.3'
        title: 单位经济、成本结构与营运资金信号
        blocks:
          - type: paragraph
            body: >
              行云集团在已公开披露子公司中的单位经济都面临结构性挑战。Polibeli FY2025 7.35% 的毛利率符合轻资产数字分销模式——公司赚的是物流与采购价差，而不是商品所有权利润——但固定技术、销售和 G&A
              成本吸收后，几乎没有贡献利润。$9.5 million SG&A 对 $1.94 million 毛利的负担，确认公司仅靠交易业务尚无法覆盖运营成本。行云科技 FY2025 毛利率小幅改善至 15.09%（较
              FY2024 增加 0.50 个百分点），由收入结构从低毛利 B2C 电商转向更高毛利的软件 / IT 服务（占收入 49.21%）驱动。不过，2026 年 Q1 毛利率坍塌至
              7.08%，因为通过新子公司业务注入的新增 B2B 供应链贸易收入，以更低贡献利润率进入利润表，显示收入结构切换的利润率稀释风险。

              营运资金给出额外反向信号。Polibeli 营运资金从 FY2024 的 +$6.29 million 摆到 FY2025 的 -$2.35 million，流动比率降至 0.88，低于常规 1.0
              运营流动性门槛。行云科技 2026 年 Q1 应收账款余额达到最近年度收入的 193.76%，这是极高的应收 / 收入比例，反映出长期账期 B2B
              合同上的激进确认，或回款困难。财务分析工具将行云科技三年平均经营现金流 / 流动负债比率 -30% 标为担忧。Polibeli FY2025 capex 仅
              $155K，确认轻资产执行和低维护投入——但也意味着负经营现金流是纯运营现金消耗，而非资本投资。LinkieBuy / 母集团的 CAC、LTV、回本期和 SaaS NRR 指标均未公开披露，仍是关键尽调缺口。
