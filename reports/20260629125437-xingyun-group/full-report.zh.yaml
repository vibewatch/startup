  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与生态图谱
        blocks:
          - type: paragraph
            body: >
              Xingyun Group 运营一个三层客户生态，覆盖跨境贸易等式的两端。第一层是进入中国的海外品牌，由 LinkieBuy 子公司服务；LinkieBuy 提供微信小程序 SaaS
              店铺、私域运营、CRM、物流和直播营销，帮助国际品牌捕捉中国消费者需求。截至 2023 年战略升级，LinkieBuy 已与 100 多个知名品牌签署合作协议，覆盖日本、泰国、澳大利亚、欧洲和香港，包括
              Yohji Yamamoto、BigC（Thailand）、Swisse（Australia）、CATALO（Hong Kong）和 TheNose/Fuji（Netherlands）。LinkieBuy
              还被正式认定为 Tencent Smart Retail「Thousand Domains Program」合作伙伴，可服务 Daimaru Matsuzakaya 和 Seibu
              等日本百货。第二层是出海的中国品牌，通过 Xingyun 的 OCP（Omni-Channel Platform）出口服务承接。截至 2021 年 7 月，Xingyun 已与 400
              多个知名中国消费品牌建立出海战略合作，包括 Deli Group（得力）、Bull（公牛）、Muzen/Cat King（猫王）、Leson（乐森）、By-Health（汤臣倍健）、1MORE、Leqi（乐其）和
              New Zealand Mystery（纽西之谬）。第三层是全球 SME 零售商和分销商，由东南亚和日本的 Polibeli 平台，以及 Xingyun 在中国的国内渠道服务。Polibeli
              的核心客户画像是印尼、越南和日本的线下 SME 店主，他们用 Polibeli App 数字化采购、管理库存并获取供应链金融。印尼约占 Polibeli 2024 年收入的 38%，日本约占 52%，越南自
              2023 年 8 月起处于积极扩张中。合计来看，Xingyun 声称服务 3,000 多个国内外品牌和近 500,000 家线上线下 SME 零售商，覆盖 72 多个国家，供应约 150,000 个
              SKU，品类涵盖消费品、美妆、母婴、健康、电子和生活方式。
