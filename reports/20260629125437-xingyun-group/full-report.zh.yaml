      - number: '4.2'
        title: 'Polibeli Group Ltd（Nasdaq: PLBL）——公开子公司财务细节'
        blocks:
          - type: paragraph
            body: >
              Polibeli Group Ltd 是 Xingyun 的东南亚和日本 B2B 分销业务，也是唯一提交经审计 U.S. GAAP 财务报表的实体。其 2026 年 4 月 24 日向 SEC 提交的 2025
              财年 Form 20-F 显示，全年收入 $26.42 million，较 FY2024 的 $30.23 million 下降 12.6%；FY2024 本身较 FY2023 的 $22.79 million
              增长 32.7%。日本仍是最大市场，收入 $10.81 million（约占 FY2025 收入 41%），其后为 Indonesia $5.82 million（22%）、Hong Kong $4.74
              million、Europe $4.32 million，以及其他市场 $0.73 million。FY2025 收入下滑，反映出公司为建设 Indonesia
              市场而有意采取低价策略、压缩利润率，同时日本需求放缓。

              利润表揭示了分销模式的结构性脆弱。收入成本为 $24.48 million（占收入 92.65%），只留下 $1.94 million 毛利，毛利率仅 7.35%。SG&A 为 $9.5 million（占收入
              36%），约为毛利的 5×，导致经营亏损 $7.56 million，经营利润率 -28.6%。EBITDA 为 -$7.4 million。净亏损从 FY2024 的 $10.98 million 收窄至
              $5.97 million，但改善来自成本效率，而不是收入增长。经营现金流为 -$6.35 million；自由现金流为 -$6.5 million，capex 仅
              $155K，确认其轻资产执行模式。第三方分析给出的公司财务健康分为 10/100，9 项标准财务强度测试仅通过 3 项。

              2026 年 5 月，Polibeli CFO Zhitian Zhang 辞任，2026 年 5 月 15 日生效，理由为个人原因，未表示存在 GAAP 分歧；CEO Hua Chen
              暂代首席财务官职责。公司采用双层股权结构，限制少数股东治理保护。A 股子公司行云科技 FY2025 收入为人民币 1.4477 亿元（约 $20 million），同比下降 62.57%，净亏损人民币 8318
              万元，主要由 B2C 电商收入坍塌（下降 98.16% 至人民币 556 万元）以及对应收款和其他资产计提人民币 3705 万元减值推动。
