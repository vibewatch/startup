  - id: FM001
    title: 市场规模金字塔——TAM/SAM/SOM 代理层（2025，USD Billion）
    type: pyramid
    layout: standard
    summary: |
      三层代理规模从最宽的中国 CBEC 市场，到东南亚跨境市场，再到中国物流子市场，展示 Xingyun 可触达收入池如何收窄。
    data:
      nodes:
        - label: TAM – 中国 CBEC 市场（IMARC）
          value: USD 90.85B (2025)
          detail: 中国 CBEC 进出口总额；预计 2034 年达 USD 312B，CAGR 14.7%
        - label: SAM – 东南亚跨境电商（GII）
          value: USD 45.39B (2025)
          detail: 东南亚 CBEC，含 B2B+B2C；预计 2031 年达 USD 84.74B，CAGR 10.97%
        - label: SOM – 中国 CBEC 物流服务（Mordor）
          value: USD 28.28B (2025)
          detail: 中国 CBEC 物流子市场；预计 2031 年达 USD 60.62B，CAGR 12.83%
    approximationNotes: |
      金字塔各层并非严格同心子集：TAM 以中国为中心（进出口），SAM 以东南亚为中心（仅跨境），SOM 是覆盖所有中国 CBEC 的物流服务。这些代理层用于框定 Xingyun 的可触达机会，不应解读为嵌套市场子集。
    claimRefs:
      - CM007
      - CM008
      - CM009
