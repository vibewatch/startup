      - number: '7.4'
        title: 运营、竞争、合作伙伴与数据安全风险
        blocks:
          - type: paragraph
            body: >
              Xingyun 运营依赖一组平台、物流和金融伙伴，其集中度会制造相关性失效模式。分销依赖微信小程序电商（LinkieBuy）、Alibaba/Tmall、Amazon
              和区域市场渠道——这些平台任何政策或算法变化都会立即影响获客、结算和履约经济性。第三方物流依赖 4PX、SF Holding、JD Logistics 和
              Cainiao，而这些公司都在跨境供应链赛道直接竞争，并积极投资重叠的东南亚仓储和履约能力。JD Logistics 和 SF Holding 披露了创纪录或接近纪录的 2025 年收入，Cainiao 回归
              Alibaba 全资后也在全球扩张——直接挤压 Xingyun 的物流服务利润率。Polibeli 20-F 将无法吸引并留住零售客户列为重大业务风险。星云科技服务约 500,000 家 SME 零售商和
              3,000+ 品牌——客户基础高度碎片化，对关税和成本冲击的集体流失敏感度很高。Polibeli 的 IT 系统集中在新加坡，并披露有备份安排；截至 20-F 日期未报告重大宕机，但到 2025 年底快速整合
              26 家 Youkeshu 子公司，引入未经审计的遗留系统和数据合规风险。中国《网络安全法》修订案（2026 年 1 月 1 日生效）把严重违法的数据处理罚款提高到最高 1000
              万元人民币，取消此前「先警告」要求从而允许立即执法，并把域外适用延伸到损害中国网络安全的海外主体。跨境个人信息传输现在必须满足 CAC
              三种机制之一——安全评估、标准合同条款或认证——只有很窄的合同履行豁免。Arnold & Porter 分析确认，CAC 在 2025 年 10
              月进一步收窄这些豁免，即便是常规跨境电商数据流，也要求单独明示同意并强制开展个人信息保护影响评估。以 Xingyun 这种规模的平台，不合规敞口是重大的。
