        - id: platform_channels
          label: WeChat / Alibaba / Amazon 渠道
        - id: logistics_3pl
          label: 3PL 物流（4PX / SF / JD / Cainiao）
        - id: csrc_pboc_cac
          label: CSRC / PBOC / CAC 监管机构
      edges:
        - source: wang_wei
          target: xingyun_group
