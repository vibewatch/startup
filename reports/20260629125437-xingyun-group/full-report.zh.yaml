      - number: '8.5'
        title: 图表资料
        blocks:
          - type: callout
            title: SPAC 溢价警报——PLBL 约 108x P/S 在结构上不可持续
            body: >
              Polibeli Group 以 $26.4M TTM 收入支撑约 $2.9B 市值，P/S 约 108x，EV/Revenue 约 110x。作为参照，JD Logistics 的 EV/Revenue 为
              0.23x，SF Holding 为 0.3–0.4x，即便是高增长平台 Lalamove，$2.1B 收入对应的倍数也只有约 5x。PLBL 当前定价隐含的前提是：在维持现有股本和市场情绪的同时，公司收入增长到
              $580M+，并形成可持续的利润率结构——这等于在不透明市场里， 从当前 TTM 水平增长 22 倍。按 $2.2B 私募估值投资 Xingyun Group 的投资人，实质上通过 PLBL
              价格敞口默默承销了这个情景。
            calloutType: risk
            claimRefs:
              - CV013
              - CV020
              - CV021
              - CV026
          - type: callout
            title: CSRC 执法仍在进行——治理风险不是历史问题
            body: >
              截至报告日，CSRC 对王维、肖四清和 Tianxingyun Supply Chain 的调查仍在进行（2025 年 9 月立案）。王维和 Tianxingyun 持有的 Xingyun Technology
              股份被法院冻结至 2029 年 1 月 19 日。2026 年 4 月的监管处罚指向隐瞒控制权转让协议——这是新近违规，
              不是历史遗留。这些治理问题没有被清理掉，而是仍在监管程序中。任何投资人尽调都必须聘用具备中国资质的律师，并在出资前取得最新的 CSRC 登记状态。
            calloutType: risk
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
          - type: callout
            title: 继续研究——买入前必须满足三项条件
            body: >
              现有证据支持继续研究，而不是买入。上调至买入需要三项条件：（1）可信机构投资者以不低于 $2.2B 估值完成新一轮一级融资， 补上 5
              年市场验证空档；（2）发布合并审计后的集团财务，收入、利润率和杠杆可验证；（3）CSRC 调查解决，未对王维作出重大处罚，
              且股份冻结正式解除。若三项中没有两项兑现，在当前隐含定价进入，面对负面治理与估值证据，下行风险不对称。
