              Department Store，LinkieBuy 用微信 / 小程序方案数字化线下零售，以承接中国游客消费。中国出口侧，Deli Group、Bull、Muzen、Leqi 等自 2021
              年起被列为生产部署合作伙伴，主要通过 TikTok overseas、Shopee/Lazada 市场渠道和线下 KA（key
