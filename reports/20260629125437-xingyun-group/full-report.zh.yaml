  - id: TM004
    title: 增长驱动因素与采用约束清单
    columns:
      - 因素
      - 方向
      - 时点
      - 对 Xingyun 的含义
      - 尽调问题
    rows:
      - - RCEP 关税下调（自 2024 年起，SEA 中国商品关税下降 4–8%）
        - 顺风
        - 持续中；2024–2026 年加速
        - 更低的落地成本提升东南亚 B2B 利润率，也增强 SME 价格竞争力
        - 量化 Xingyun 核心品类可节省的关税
      - - 中国 178 个跨境电商综试区，配套保税仓激励
        - 顺风
        - 已落地；到 2025 年底 178 个综试区覆盖全部 31 个省份
        - VAT 降低、清关更快，压低单票成本；SME 更容易接入出口基础设施
        - 核实 Xingyun 覆盖的综试区城市及利用率
      - - WTO E-Commerce Agreement 于 2026 年 3 月通过（66 个成员，约占贸易额 70%）
        - 顺风
        - 中期；需 45 份文书交存后生效
        - 建立全球数字贸易规则底线；降低物流平台运营商面对的监管不确定性
        - 跟踪中国国内批准时间表及接受文书交存进度
      - - 2026 年 6 月跨境电商数据流动放宽（9 部门指引）
        - 顺风
        - 近期；2026 年 6 月生效
        - 降低海外仓数据管理的合规负担；支持跨境分析
        - 确认允许流动的数据类别范围，并核实 Xingyun 审计框架是否合规
      - - 美国取消小额豁免（120% 关税或每包裹 $100–200，2025 年 5 月）
        - 逆风
        - 立即生效；结构性变化已经形成
        - 发往美国的小包模式被打断；Temu / Shein 转向美国本土履约
        - 评估 Xingyun 美国线路敞口，以及转向保税履约中心的可行性
      - - 欧盟小额豁免审查（€150 门槛；欧盟包裹 91% 来自中国）
        - 逆风
        - 近期；欧盟改革提案预计 2026–2027 年
        - 如果 €150 门槛取消，发往欧盟的低值商品包裹经济性将出现根本变化
        - 跟踪 EU Customs Reform Regulation 时间表，并映射 Xingyun 欧盟货量敞口
      - - 东南亚新兴市场保护主义（越南 2024 年 12 月禁用 Temu；印尼 2024 年 10 月禁用应用）
        - 逆风
        - 正在出现；因国家而异、阶段性爆发
        - 平台进入壁垒要求本地合作、合规投入和本地法律实体
        - 为 Polibeli 已进入和计划进入的东南亚市场建立国家级监管风险台账
      - - 红海扰动与运费波动（2024 年上涨 30%）
        - 逆风
        - 阶段性；结构性地缘政治风险
        - 海运成本波动；中欧班列 2024 年增长 10%，可作替代运力但受容量约束
        - 评估 Xingyun 海运与铁路的运输组合；量化自有与签约运力带来的对冲效果
    notes: 方向（顺风 / 逆风）反映截至 2026 年 6 月对 Xingyun 增长轨迹的净影响。时点为作者基于公开宣布的政策生效日期作出的判断。尽调问题是前瞻性研究缺口。
