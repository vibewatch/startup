      - number: '5.4'
        title: 信任、合规、质量控制与运营限制
        blocks:
          - type: paragraph
            body: >
              Xingyun Group
              持有中国国家高新技术企业（国家高新技术企业）认证，并担任中国合作贸易企业协会供应链金融分会（中国合作贸易企业协会供应链金融分会）会长单位，体现其在跨境贸易金融领域获得认可的专业性。公司注册法律实体（深圳市天行云
              供应链有限公司）持有 ICP 备案（粤ICP备15060915号）。但公开证据显示多项重大运营限制。第一，Polibeli Group 的 20-F（FY2025，2026 年 4
              月提交）明确承认高度依赖第三方物流服务商，并提示航运运力短缺、天气事件、罢工、海盗、燃油价格飙升和港口关闭可能造成服务中断。第二，20-F 披露 Polibeli 的 IT 系统——描述为「支撑 Polibeli
              Platform、数字解决方案和智能服务及其他数字服务的技术基础设施」——虽有备份和安全措施保护，但仍容易受到病毒、DDoS 流量峰值和物理 / 电子入侵影响；Item 16.K
              将网络安全列为重大风险，且未披露独立 SOC 2 或 ISO 27001 认证。第三，Polibeli 的多方式支付栈（货到付款、电汇、支票、数字钱包、信用卡 /
              借记卡）完全依赖第三方支付处理方，任何处理方故障或监管变化都可能打断运营。第四，未发现 Xingyun Group 或任何产品的公开 API 文档、SDK 或官方 GitHub
              仓库；外部集成看起来是按合作伙伴定制。第五，稳定币试点（海丝智链）在香港监管试点框架下运行，必须满足完整牌照合规；Xingyun 仅持股 13%，运营结果取决于广州国企伙伴。第六，Polibeli 20-F
              明确承认，其数字解决方案和智能服务中的复杂创新技术「较新，需要更多时间证明其可靠性和有效性」，提示面向出口平台的产品成熟度风险。
