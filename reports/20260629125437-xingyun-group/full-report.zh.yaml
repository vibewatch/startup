  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入规模、结构与 GMV 到净收入缺口
        blocks:
          - type: paragraph
            body: >
              行云集团的收入规模受到不同数据源和会计口径的争夺。GetLatka 在 2024 年 12 月快照中估算 Xingyun Group 母公司净收入约 $42.3
              million，把收费型代理收入视作收入线。PrivCo 对 2024 年 $380 million 的估算，很可能采用商品交易总额或集团合并总额会计口径，因为二者相差 9×。公司自身宣称 2025 年 GMV
              超过 5000 亿元人民币（按 2025 年中汇率约 $69 billion），但该数字无法与任何披露净收入或经审计报表相互验证。GMV 与净收入之间的缺口，反映了 Xingyun
              的代理加平台模式：物流价差、SaaS 订阅费、佣金比例和供应链金融利差共同决定抽成率；公开数据暗示，采购端抽成率远低于交易总额的 1%。

              四条不同收入流汇入合并实体：（1）跨境进出口代理服务和采购，产生物流价差；（2）集团在 72 个国家的 139
              个自营或合作仓带来的物流与仓储费用；（3）供应链贸易融资，以未披露利差向品牌和零售商提供营运资金；（4）LinkieBuy 和 EC Mall 带来的 SaaS 平台费——年订阅从人民币 10,000
              元（Basic）到人民币 50,000 元（Flagship），并对全部处理订单收取 8% 交易佣金。2025 年 2 月上线的按需打印产品 Flexcreate
              代表一条早期第五收入流，但尚无披露收入贡献。已公开披露财务的子公司——Polibeli（东南亚和日本业务）与行云科技（国内 A 股业务）——合计只代表集团宣称的 3,000 个品牌、160,000
              个零售商规模中的一小部分，凸显外部投资者若没有合并审计，很难接近集团财务故事的大部分内容。
