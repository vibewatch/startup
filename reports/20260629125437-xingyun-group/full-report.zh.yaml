      - number: '7.3'
        title: 治理集中、融资依赖与资本结构风险
        blocks:
          - type: paragraph
            body: >
              王维成为 Xingyun Group（私有）和星云科技（上市）唯一实际控制人，带来关键人集中风险，且机构制衡有限。王维及其一致行动人持有星云科技 18% 股权，没有可比的机构大股东；肖四清在 2025 年 10
              月被移出管理层后，持股被动稀释至 3.28%。A 股子公司背负 Youkeshu 分销模式崩塌后的遗留问题：2021 年 Amazon 大规模封店事件后，2020–2023 年累计亏损 44 亿元；2025 年
              Q3 收入同比下降 83.59% 至 1640 万元，2025 年 Q1–Q3 累计收入为 5897 万元（同比下降 82%），威胁第二个连续年度亏损。过渡过程暴露出未完成的子公司交接：截至 2025 年 12
              月 31 日，总资产 6470 万元、净资产为 -1060 万元的子公司尚未向新管理团队完成业务交接。Xingyun Group 本身已多轮融资约 $951 million，并拥有 $2.2 billion
              集团估值（2025），同时 Polibeli SPAC 估值为 $3.6 billion——私募轮标记与上市实体交易现实之间存在很宽的买卖价差。随着全球融资条件持续收紧，中国企业违约风险预计在 2026 年上升
              7–10%。中国央行 2025 年初的供应链金融指引草案释放出跨境平台内嵌融资监管收紧信号，而这正是 Xingyun 利润率模型的核心；SME
              交易对手带来的信用损失可能侵蚀抽佣率，并在任何以贸易应收账款作抵押的优先融资安排中触发 covenant 或准备金要求。
