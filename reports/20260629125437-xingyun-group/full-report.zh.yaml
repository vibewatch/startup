  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >
              与行云集团相关的市场，是支撑跨境商品流动的 B2B
              数字供应链服务，主要包括中国出口至新兴市场走廊，以及海外品牌进入中国的进口通道。边界包含三层主要服务：（1）面向瞄准东南亚、中东、非洲和拉丁美洲的中国中小卖家，提供出口端物流、清关、供应链金融和数字平台服务；（2）面向海外品牌，通过保税仓和
              LinkieBuy、EC Mall 等 B2C 平台渠道进入中国消费者的进口端服务；（3）相邻的 SaaS 和按需打印服务，用来加深卖家粘性。纯国内电商、不与电商交易挂钩的传统大宗货运，以及 Xingyun
              作为赋能基础设施而非登记商户的直接 B2C 消费零售，均不纳入。China Customs 将 CBEC 正式归入 9610、9710、9810 和 1210 等代码，每类都有不同物流和合规义务。2025
              年，中国 CBEC 进出口合计规模达到人民币 2.75 万亿元（高于 2024 年的人民币 2.63 万亿元），占全国货物贸易总额 6.3%，较 2020 年增长 69.7%。出口约占 CBEC 规模的
              79%，消费品占出口内容的 97.8%。按价值计，B2B 交易拥有 67% 市场份额；B2C 增速更快，约 25% YoY，反映出直接面向消费者的出口模式正在加速迁移。中国 CBEC 板块已覆盖 2600
              万家国内企业，并与 36 个国家建立 Silk Road E-Commerce 伙伴关系。
