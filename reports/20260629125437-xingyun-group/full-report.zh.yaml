      - number: '3.4'
        title: 护城河耐久性、替代风险与反向证据
        blocks:
          - type: paragraph
            body: >
              Xingyun 的竞争护城河建立在四根支柱上：（1）双边品牌-零售商网络（3,000+ 海外品牌 × 160,000+ 国内零售商），两端都嵌入转换成本；（2）通过 LinkieBuy 集成 WeChat
              生态，提供小程序、私域 CRM
              和社交电商工具，品牌独立复制成本高；（3）供应链金融嵌入平台工作流，形成纯物流承运商不提供的粘性金融关系；（4）十年关系驱动型跨境进口赋能积累的先发品牌信任。不过，每根支柱都面对可信威胁。Cainiao 于
              2024–2025 年重新整合进 Alibaba，意味着其品牌服务和入驻工具（面向 AliExpress 和 Lazada）如今在母公司层面协调，直接争夺 Xingyun 培养的海外品牌关系。JD
              Logistics 正在强势扩张外部客户基础（2025 年 91,161 个，+13%）；其供应链服务开放平台战略明确瞄准那些寻求 JD 零售生态之外物流与履约的品牌。SF Holding 自 2025 年 Q3
              起转向「价值驱动」物流，释放出争夺更高利润率品牌供应链合同的信号。商品化方面：J&T 2025 年中国单票成本降至 $0.28，创历史新低，逐步把物流运输层商品化，侵蚀 Xingyun
              物流组件的利润。治理风险同样实质：2026 年 CSRC 对创始人王维披露违规（与 A 股重整相关）的执法行动，引入关键人物风险，并可能削弱企业客户信任。纯物流多归属摩擦低（品牌可轻松把货量拆给多家承运商），但
              Xingyun 销售的一体化 SaaS-金融-物流组合多归属摩擦更高——这种粘性是 Xingyun 最好的护城河防线。
