  - id: TV005
    title: 论点破裂与否决触发项
    columns:
      - 触发项
      - 门槛 / 可观察事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - CSRC 对 Wang Wei 实施正式制裁
        - 对 Wang Wei 个人作出行政罚款、市场禁入或出行限制
        - 关键人物和 Xingyun Group 领导层公信力被摧毁；机构投资者退出；PLBL 股价崩塌
        - 立即退出或暂停部署；投资论点破裂
      - - PLBL 市值跌破 $200M
        - PLBL 股价 < $0.55/股（按当前流通股本）
        - Polibeli 资本通道关闭；持续亏损触发持续经营披露；Xingyun 失去公开市场融资选项
        - 重估投资论点；SPAC 溢价完全消失；PLBL 从资产变为负担
      - - 2027 年底前没有披露超过 $100M 的新合并收入
        - 由经审计集团财务或 PLBL 母公司的 SEC 申报确认
        - 收入基数证明 GMV 撮合之外没有可规模化变现；52x P/S 不可持续
        - 下调至回避；收入模式只靠代理，且当前规模下结构性偏薄
      - - Polibeli 以低于 $500M 的隐含 PLBL 估值融资
        - PLBL 配股、PIPE 或二级发行价格低于 $1.35/股
        - Down-round 信号；现有 $2.2B 私募估值无法维持；触发连锁减记
        - Down-round 得到确认；要求立即重置估值；降低敞口
      - - 股份冻结延长，或针对 Wang Wei 出现新的重大民事 / 刑事行动
        - 法院将 Jan 2026 冻结续期至 Jan 2029 之后，或立案新的刑事调查
        - 控制权风险升级；业务连续性和跨境资产转移受阻
        - 暂停部署；升级中国法律尽调；要求管理层回应
    notes: |
      触发阈值是可观察的市场或监管事件，不是内部里程碑。行动含义假设投资者持有少数股权的私人头寸。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
      - CV039
      - CV042
  - id: TV006
    title: 最终尽调追问
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 合并收入
        - Xingyun International（Cayman 控股实体）FY2024 和 FY2025 经审计的集团层面损益表
        - 没有经过核验的收入基数，估值倍数就没有意义；GetLatka 估算尚未验证；PLBL 收入只覆盖一家子公司
        - 要求管理层提供；交叉核对 PLBL 20-F、行云科技 A 股披露和 GetLatka 估算
      - - 股权结构和优先权栈
        - 当前资本结构表：所有 Series A 至 C2 投资者的股份数、投资者持股比例、优先权条款和反稀释条款
        - 这是理解治理、控制权、清算顺位，以及新投资者真正可获得股权价值的关键
        - 直接接触公司；审阅任何已披露的股东协议；核验王维持股与已披露的 18% 是否一致
      - - CSRC 调查状态
        - CSRC 对王维、肖四清和天行云供应链调查的当前处置结果（2025 年 9 月文件）
        - 正在进行的执法程序可能限制王维经营、转移资产或主导新融资的能力
        - 监控 csrc.gov.cn 上的 CSRC 披露；聘请中国律师；要求管理层披露并出具书面陈述
      - - Polibeli 盈利路径
        - PLBL FY2025 20-F（待发布）、管理层收入路线图，以及经审计的经营盈亏平衡计划
        - PLBL -22% 的净利率和负权益意味着，若没有资本注入，近期持续经营会构成风险；一旦披露持续经营疑虑，$2.9B 市值难以支撑
        - 20-F 年报提交后审阅；分析 2025 年业绩披露；审阅管理层讨论章节
      - - 行云科技整合和租赁合理性
        - RMB 3B+ 服务器租赁合同（超过最近一期经审计资产的 280%）的战略理由和独立业务评估，以及子公司整合计划
        - 在未经验证的算力租赁板块押注相当于公司经审计资产基数 3 倍的金额，构成核心能力之外的重大资本风险
        - 审阅行云科技（300209）A 股披露；要求独立董事会评估；对租赁交易对手做法律审查
      - - 私有市场估值验证
        - 2025 年 7 月 PremierAlts 时间戳之后，任何能确认或更新 $2.2B 估值的二级交易、投资者估值更新或新一轮一级融资
        - 2021 年 Series C2 是实际交易；2025 年 7 月看起来是数据提供商重新打标，不是新一轮融资；5 年未更新的估值在当前环境下不确定性很高
        - 直接接触 PremierAlts、PitchBook 和 VC 投资者；向公司索取最新投资者信或 409A 估值报告
    notes: |
      尽调事项按重要性排序。第 1 和第 3 项是按当前隐含估值做任何投资决策的阻断项。第 4 和第 5 项涉及子公司层面风险，会通过直接财务影响和声誉传导影响合并集团估值。Series D 或二级交易前，所有事项都应解决。
    claimRefs:
      - CV041
      - CV043
      - CV032
      - CV033
      - CV035
      - CV042
      - CV045
figures:
  - id: FO001
    title: Xingyun Group 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 从 2015 年创立，到 2025 年 8 月 Polibeli 在 Nasdaq 上市，再到 2026 年 4 月 CSRC 执法，列出关键有日期里程碑。
    data:
      items:
