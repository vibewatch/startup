      - number: '1.4'
        title: 里程碑、规模与战略扩张
        blocks:
          - type: paragraph
            body: >
              行云集团从深圳创业公司成长为全球供应链独角兽，历经十一年的运营里程碑。2016 年，灾难性的税收政策冲击使 99% 的跨境电商竞争者停摆，王维仍保留 63 名员工，继续建设数字基础设施。到 2017
              年，公司已设立五个海外分支，GMV 达到 12 亿元人民币（同比 +344%）。2021 年 8 月，公司扩展至 Kenya。2022 年 7 月，Polibeli 在 Indonesia
              上线，定位为服务中小零售商的 B2B 批发平台。到 2023 年，Xingyun 进入 Fortune China 500（第 372 位），年度 GMV 超过数千亿元人民币。2025 年 2
              月，Flexcreate（按需打印）上线，延展数字产品组合。2025 年 3 月，王维与四家广州国企成立海丝智链（Haisi Zhi Chain）合资公司，在 Hong Kong 新 Stablecoin
              Ordinance 框架下开发跨境稳定币支付基础设施。2025 年 8 月 8 日，Polibeli Group Ltd 完成与 Chenghe Acquisition II Co. 的 de-SPAC
              合并后，在 Nasdaq Global Market（PLBL）开始交易。Nasdaq 上市是 Xingyun 双轨战略的里程碑：国内跨境供应链通过 Xingyun Group 推进，海外 B2B 市场渗透通过
              Polibeli 推进。截至 2025 年 8 月，Xingyun 持有 Polibeli 约 50% 股权，市值约 $2.1B。Polibeli 2024 年收入增长 32.7%，超过 $30M，日本（约
              52%）和 Indonesia（约 38%）是核心收入市场。行云集团在 2025 年 Fortune China 500 中位列第 339 位（连续第三年入榜），并入选 2025 World Unicorn
              Enterprises 名单。
