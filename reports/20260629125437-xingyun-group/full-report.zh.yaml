      - number: '4.4'
        title: 资本充足性、资产负债表与融资结构
        blocks:
          - type: paragraph
            body: >
              本章最重大的负面财务发现，是 Polibeli Group 截至 2025 年 12 月 31 日股东权益为 -$45.42 million，而总资产为 $17.53 million、总负债为 $62.95
              million。如此严重的负账面价值不是暂时性会计噪音：它反映了累计净亏损，更重要的是，存在大量关联方和债务负担，却没有相应资产积累抵消。2025 年末现金约 $1.8 million，而同年经营现金流出
              $6.35 million——意味着若没有新资本或收入恢复，跑道不足四个月。FY2025 利息费用 $1.36 million（低于 FY2024 的 $1.85 million），显示仍需持续偿债。2025
              年末短期借款约 $3.46 million。负权益、负营运资金（-$2.35 million）、低于 1.0 的流动比率（0.88）和持续经营现金消耗叠加，构成 U.S. GAAP
              标准下教科书式的持续经营风险画像，尤其是在缺少外部救助资本或明确收入扭转的情况下。

              行云科技方面，2025 年末现金为人民币 8.77 亿元（约 $121 million），绝对水平更健康，但 2025 年内减少人民币 2.49 亿元，全年经营现金流为 -人民币 1.64 亿元。2026 年
              Q1，经营现金流出加速至 -人民币 3.74 亿元——单季度几乎追平 2025 年全年消耗——主要由新注入 B2B 贸易业务中的营运资金堆积驱动，其中应收账款膨胀至上一年收入的 193.76%。行云科技
              FY2025 年末短期债务为人民币 4000 万元。公司披露计划向股东借款人民币 1 亿元，用于购买海外算力服务器，作为其 AI 硬件转型的一部分，增加了对关联方借款的融资依赖。

              Xingyun Group 母公司层面，最近一次披露融资是 2021 年中由 Yunfeng Capital 领投的 $600 million C2 轮，使披露累计融资约 $953.5
              million。此后没有披露新的融资。鉴于 Polibeli 于 2025 年完成 Nasdaq 上市（SPAC 合并公告估值 $3.6 billion），集团接入了公开市场资本，但没有公开披露流向
              Xingyun 母公司的所得款。因此，合并层面的融资依赖风险很高，但结构上不透明。
