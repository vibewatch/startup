summary:
  headline: |
    Xingyun Group 确实有跨境基础设施、品牌关系，也握着 Polibeli 带来的选择权；但母公司财务不透明，治理和监管争议仍在发酵，隐含估值偏高，投资结论只能停在继续研究，而不是买入。
