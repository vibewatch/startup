  topStrengths:
    - 网络规模已经铺开：72 个国家加 1 个地区、139 个仓库构成真实运营底盘，小型跨境 SME 平台很难复制。
    - 双边生态有深度：平台连接 3,000+ 个品牌和庞大的 SME 零售商网络，让 Xingyun 在货源、分销和渠道数据上不只是做货代。
    - 平台选择权多：LinkieBuy、EC Mall、出口服务和 Polibeli 覆盖软件、贸易赋能、物流、市场进入服务，变现路径不止一条。
    - 资本和伙伴支撑较强：股权结构表里有 Yunfeng、Matrix、Taikang 和国资关联基金，Polibeli 登陆 Nasdaq 至少提供了一个公开资本市场锚点。
  topRisks:
    - 母公司不透明：控股主体没有合并审计财报，收入、杠杆、单位经济和现金跑道都存在结构性验证不足。
    - 治理和执法阴影仍在：Wang Wei、Tianxingyun 及关联上市主体卷入 CSRC 执法、信披违规和股份冻结争议，可能伤及融资能力和交易对手信任。
    - 估值和证据脱节：$2.2B 私募估值以及由 PLBL 推出的隐含价值，建立在稀薄且波动的收入证据和极端倍数上，和上市物流同行相比很难自圆其说。
    - 客户和政策敏感度高：模式依赖 SME 零售商、跨境贸易规则、平台 / 渠道伙伴，以及中国和东南亚的海关、支付监管。
    - 公开子公司经济性偏薄：Polibeli 和 行云科技都显示盈利能力弱或为负，提示集团层面的抽佣率和营运资本风险可能比增长叙事更差。
  unresolvedGaps:
    - 没有合并母公司审计报告，也没有类似贷方信息包披露集团收入、EBITDA、债务、现金或分部结构。
    - 2025 年 7 月估值标记出现在二级数据库中，但未找到有清晰文件支撑的一级融资轮次或交易条款。
    - Polibeli 通过 de-SPAC 上市后，Xingyun 仍持有的具体股比和经济权利披露并不一致。
    - 关键品牌和零售商分部的客户集中度、留存和队列经济性未公开报告。
    - CSRC 案件、股份冻结和 行云科技 控制权争议带来的运营与法律后果仍在演变。
