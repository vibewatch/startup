  - id: capability-and-pricing
    title: Capability Comparison and Pricing
    body: >
      When mapped across buying criteria—cross-border logistics (export and import), B2B brand
      enablement, SaaS/digital platform, supply chain finance, overseas warehousing, and WeChat
      CRM integration—Xingyun stands out only in the import/brand-landing and WeChat/SaaS
      dimensions. In cross-border export logistics (moving goods out of China for e-commerce),
      Cainiao, JD Logistics, SF Express, J&T, and Zongteng all outperform Xingyun on network
      density and cost efficiency. SF and JD hold advantage in high-value time-sensitive express;
      J&T holds B2C volume advantage in Southeast Asia; Cainiao dominates platform-seller GMV.
      Pricing across the sector is opaque—all major carriers publish commercial rates by weight,
      destination, and service tier but negotiate volume discounts bilaterally. DHL quotes 4–5
      day delivery from China to Germany in its cross-border e-commerce solution; SF and JD
      offer competitive zone-based pricing. Xingyun's cost competitiveness in pure parcel
      logistics is constrained by its asset-light outsourced network versus self-operated fleets
      at SF, JD, and J&T. For digital services (SaaS brand management), Xingyun's LinkieBuy
      is a real differentiator with no direct equivalent among the pure logistics players. No
      public list pricing exists for LinkieBuy SaaS subscription fees or Xingyun's supply chain
      finance rates, creating an evidence gap.
    claimRefs:
