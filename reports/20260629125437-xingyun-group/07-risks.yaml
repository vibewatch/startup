  - id: geopolitical-tariff-customs-risks
    title: "Geopolitical, Tariff, and Customs Compliance Risks"
    body: >
      The elimination of the US $800 de minimis exemption — for Chinese-origin goods on May 2, 2025,
      and for all origins on August 29, 2025 — constitutes a structural threat to the Chinese-brand
      export channel that is among Xingyun's key growth vectors. Every parcel shipped from China to
      US consumers now requires formal customs entry, HTS classification, and full duty payment.
      Effective tariff rates on Chinese-origin goods to the US now range from 40% to 145%, comprising
      the baseline MFN duty, Section 301 China-specific tariffs (25–125%), and the Section 122
      reciprocal surcharge (15%, effective February 24, 2026). Sub-$800 parcel volume entering the
      US fell approximately 54% within four months of global de minimis elimination, with major
      platforms such as Shein and Temu pivoting to bulk US warehousing to avoid per-parcel duty
      exposure. Xingyun's LinkieBuy SaaS and export brand-enablement services face margin compression
      as SME customers reprice or exit US channels. The EU adds a parallel headwind: starting July
      2026, a €3 flat processing fee per low-value parcel applies to direct shipments from Asia,
      eroding the economics of direct EU distribution. China's PBOC also issued revised Interbank
      Foreign Exchange Market Regulations effective February 1, 2026, expanding trading and clearing
      requirements and mandating stricter "look-through" KYC for cross-border payment platforms;
      this directly affects Xingyun's supply chain finance and cross-border payment products. The
      tariff environment is further complicated by transshipment enforcement: CBP is aggressively
      auditing country-of-origin claims on goods routed through Vietnam, Mexico, and other third
      countries, eliminating a common workaround for Xingyun's SME export customers.
