callouts:
  - calloutType: risk
    title: "Kill Criterion: CSRC Enforcement Escalation"
    body: >
      If the CSRC escalates Wang Wei's administrative penalty to a market ban or makes a criminal
      referral — or if Xingyun Technology (300209.SZ) is placed under trading suspension — the
      investment thesis for both Polibeli (PLBL) and Xingyun Group direct exposure breaks. There
      is no disclosed succession plan for the actual controller, no comparable institutional block
      to step in, and the A-share listed entity is the primary domestic capital market tool.
      Investors should require a copy of the full administrative penalty decision and an independent
      legal opinion on escalation probability before committing or maintaining significant exposure.
    claimRefs:
      - CR001
      - CR002
      - CR009
      - CR016

  - calloutType: risk
    title: "Structural Risk: US-China Tariff Irreversibility"
    body: >
      The de minimis elimination and tariff stacking are not cyclical headwinds — they are structural
      policy choices confirmed by the February 2026 Section 122 executive order that survived the
      Supreme Court IEEPA ruling. Export-oriented SME customers who built their business on duty-free
      direct-from-China shipments cannot easily reverse course. Xingyun's export-enablement revenue
      line is directly correlated with this customer segment's viability. Even a US-China trade
      deal would be unlikely to fully restore de minimis treatment given bipartisan political
      support for its elimination.
    claimRefs:
      - CR019
      - CR021
      - CR022
      - CR023

