  - id: mitigation-kill-criteria
    title: "Mitigation Framework, Monitoring Triggers, and Investment Kill Criteria"
    body: >
      Xingyun has undertaken several structural mitigations that reduce but do not eliminate residual
      exposure. The Polibeli Nasdaq listing provides an international capital market anchor independent
      of the CSRC A-share enforcement overhang; the 170+ overseas warehouse network enables bulk
      pre-import clearing strategies for brand-owner clients facing US tariffs; and Xingyun's B2B
      model (serving brands and SME retailers rather than end consumers directly) provides more
      insulation from direct de minimis impact than pure direct-to-consumer platforms. However,
      residual exposure remains high across all five principal risk categories. The CSRC enforcement
      action is unresolved and carries escalation risk to a trading suspension at 300209.SZ, which
      would freeze Xingyun Group's primary domestic capital market vehicle. For monitoring, investors
      should track four kill-criterion thresholds: (1) CSRC escalation of Wang Wei's penalty to a
      market ban or criminal referral, which would disable the controlling shareholder and force an
      emergency governance transition; (2) full-year 2025 or 2026 net loss at Xingyun Technology
      combined with continued operating deterioration signalling structural impairment rather than
      transition; (3) US effective tariff rate on electronic goods exceeding 150% or EU imposing a
      formal customs duty on Asian-origin parcels above €30, triggering mass client exit from
      Western export channels; and (4) a material CAC enforcement action or data breach at Xingyun
      or Polibeli platforms. The kill criteria table below formalizes these triggers with thresholds,
      transmission paths, and recommended action implications for diligence purposes.
