company:
  name: Nord Security
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Nord Security's retained evidence supports a broader market definition than
    "consumer VPN": the company is selling across consumer privacy subscriptions
    and adjacent business security workflows. The public pool supports scale and
    adoption proxies such as customer reach, retention, and expected growth, but
    it still does not support a clean third-party TAM/SAM/SOM stack or a
    disclosed consumer-versus-enterprise revenue split.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The retained pool supports defining Nord Security's market as a privacy
      and cybersecurity bundle that spans both consumer subscriptions and
      selected business-security workflows, rather than as a single-purpose VPN
      vendor. Invest Lithuania describes a growing ecosystem of B2C and B2B
      products that includes NordVPN, NordPass, NordLocker, NordLayer,
      NordStellar, NordProtect, and Saily, while the 2021 Atlas VPN release
      shows management using acquisitions to widen the funnel into freemium and
      developing-market users. Euronomy adds a useful positioning lens by
      framing NordVPN as a European-built, privacy-first alternative to US and
      offshore offerings, which makes trust and jurisdiction part of the
      substitute set alongside features and price.
    claimRefs: [CM001, CM002, CM003, CM011]
    tableRefs: [TM001]
  - id: sizing-and-scale
    title: Sizing lens, scale proxies, and what remains unsupported
    body: >-
      The assigned evidence does not justify a conventional TAM/SAM/SOM stack,
      so the defensible sizing approach is to anchor on observed scale proxies
      and explicitly preserve the missing pieces. Fitch's 2025 rating note says
      Nord Security serves more than 15 million customers in 130 countries and
      assumes 19% organic revenue CAGR from 2024 to 2027, supported by pricing
      power, positive market fundamentals, and product launches. Datarails'
      2024 interview with the CFO adds a historical traction marker: management
      entered the first institutional raise only after the business was already
      doing more than $100 million of revenue. Those datapoints support a large
      and still-growing opportunity, but they are not a substitute for an
      external category-spend model or a disclosed split between consumer VPN
      subscriptions and business-security revenue.
    claimRefs: [CM004, CM005, CM006, CM009, CM010, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-and-constraints
    title: Buyers, adoption drivers, and adoption constraints
    body: >-
      The buyer map in public evidence has two clear poles. On the consumer
      side, Fitch describes a prepaid subscription business with high retention,
      suggesting adoption depends on recurring renewals rather than one-time
      software purchases. On the business side, Nord Security's own B2B hiring
      language and IT Goat's reseller packaging point to security and IT teams
      buying bundles that cover access, passwords, browser activity, files, and
      external exposure. Adoption drivers therefore include trusted branding,
      bundled cross-sell, and Lithuania-based engineering scale, but the same
      evidence set also shows the constraints: consumer cybersecurity is more
      macro-sensitive than stickier corporate software, and public sources in
      this pool do not disclose who ultimately owns the budget or renewals for
      each business product line.
    claimRefs: [CM006, CM007, CM008, CM012, CM014]
    tableRefs: [TM003]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Consumer privacy subscriptions
        - VPN, password management, encrypted storage, and privacy-oriented add-ons sold as subscriptions.
        - Endpoint, email, backup, and broad enterprise cyber platforms outside the retained bundle evidence.
        - Individual or household buyer, user, and payer are usually the same account.
        - Core demand engine and the base from which Nord Security built brand scale.
      - - Business access and identity security
        - Secure access, password sharing, browser protection, file protection, and exposure monitoring for teams.
        - Full SOC, endpoint, backup, or every specialized enterprise security category.
        - Security, IT, or operations admin buys; company budget pays; employees use the controls.
        - Establishes the enterprise adjacency that matters for multiple expansion.
      - - Freemium and developing-market acquisition funnel
        - Atlas VPN-style free or low-cost privacy entry points that widen top-of-funnel reach.
        - Evidence does not support treating this as the whole business or as current standalone revenue.
        - End users adopt first; monetization path depends on later conversion or cross-sell.
        - Shows Nord Security has pursued segment expansion beyond premium VPN subscriptions.
      - - Geography / trust positioning
        - European-built, privacy-first positioning as part of the product choice set.
        - No retained evidence supports country-specific market-share calculations.
        - Buyer weighs jurisdiction and trust alongside features and price.
        - Helps explain substitution against US and offshore privacy tools.
      - - Status quo and point-tool substitutes
        - Existing password managers, consumer VPNs, SASE tools, dark-web monitoring, and internal administration.
        - Spend remains outside Nord Security's served market unless a Nord product displaces or consolidates it.
        - Individual users, IT administrators, and security teams can retain incumbent tools or defer consolidation.
        - Makes switching cost, bundle value, and trust proof central to adoption rather than assuming all category spend is addressable.
    notes: >-
      Boundary logic is synthesized from retained product, channel, and
      positioning evidence; excluded categories remain out of scope unless they
      are explicitly named in the retained source text.
    claimRefs: [CM001, CM002, CM003, CM011, CM012]
  - id: TM002
    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value / metric
      - CAGR / retention
      - Methodology lens
      - Confidence
      - Limitation
    rows:
      - - Fitch Ratings
        - 2025
        - Global
        - ">15 million customers across 130 countries"
        - 19% revenue CAGR assumption for 2024-2027
        - Credit-analysis view of observable operating scale and expected market growth
        - Medium
        - Not a category-spend TAM; it is company-scale evidence inside Fitch's rating case.
      - - Fitch Ratings
        - 2025
        - Global
        - Prepaid subscription model with 97% of subscription billings from monthly, one-year, and two-year plans
        - ">80% retention rate and >75% user retention"
        - Subscription-economics lens for adoption durability
        - Medium
        - Does not isolate consumer versus enterprise retention or product-level renewal quality.
      - - Datarails interview with Nord Security CFO
        - 2024
        - North America
        - About half of revenue, according to the CFO interview
        - n/a
        - Management-reported geographic mix
        - Medium
        - Period and accounting basis were not specified, so this is not directly comparable with Fitch's 44% billings share.
      - - Fitch Ratings
        - 2025
        - North America
        - About 44% of billings
        - n/a
        - Credit-analysis geographic concentration lens
        - Medium
        - Billings are not revenue, and the statement does not disclose product-line mix.
      - - Fitch Ratings
        - 2025
        - Europe
        - About 37% of billings
        - n/a
        - Credit-analysis geographic concentration lens
        - Medium
        - Billings are not revenue, and country-level concentration is not disclosed.
      - - Surfshark company post
        - 2023
        - Global
        - $3 billion valuation after $100 million Warburg Pincus investment
        - n/a
        - Management framing of market breadth and investor appetite
        - Low
        - Company-issued valuation framing, not an independent market-sizing study.
    notes: >-
      The retained pool supports scale and adoption proxies rather than a clean
      TAM/SAM/SOM stack; rows should be read as evidence-constrained sizing
      lenses, not interchangeable market-size estimates.
    claimRefs: [CM004, CM005, CM006, CM009, CM010, CM013, CM015, CM016]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner / adoption trigger
    rows:
      - - Consumer VPN and privacy bundle
        - Individual subscriber
        - Same end user or household
        - Same individual or household account
        - Private browsing, identity/privacy protection, password and storage add-ons
        - Consumer discretionary spend; adoption triggered by privacy/trust needs and bundle value
      - - Team credential and browser-security controls
        - IT or security administrator
        - Employees and contractors
        - Employer
        - Password sharing, browser security, and access hygiene
        - Likely IT/security budget, but public retained evidence does not disclose the precise owner
      - - Business network / secure-access controls
        - Security or IT operations lead
        - Remote employees and company systems
        - Employer
        - Secure access and business data protection
        - Triggered by business-protection needs; precise renewal owner remains undisclosed in this pool
      - - Channel-led SMB bundle
        - MSP, reseller, or IT service provider
        - SMB end customer
        - End customer under a managed-service or software contract
        - Bundled access, password, browser, file, and exposure controls
        - Channel packaging reduces category complexity, but public pricing and attach-rate evidence are absent
    notes: >-
      Buyer and budget-owner rows combine direct product descriptions with
      channel packaging; public evidence is strong enough to map workflows but
      still weak on named enterprise procurement ownership and renewals.
    claimRefs: [CM002, CM006, CM012, CM014]
figures:
  - id: FM001
    title: Evidence-constrained market sizing pyramid
    type: pyramid
    summary: >-
      Six operating-scale indicators bound Nord Security's demonstrated reach
      without presenting them as TAM, SAM, SOM, or a conversion funnel.
    data:
      nodes:
        - label: Customer reach
          value: ">15 million"
          unit: customers
          detail: Fitch's 2025 issuer profile says Nord Security serves a customer base of over 15 million.
        - label: Geographic span
          value: 130
          unit: countries
          detail: Fitch says the company serves customers in 130 countries.
        - label: Growth case
          value: 19
          unit: "% revenue CAGR, 2024-2027"
          detail: Fitch assumes sustained organic growth at a 19% CAGR between 2024 and 2027.
        - label: Renewal engine
          value: ">80%"
          unit: retention
          detail: Fitch says Nord Security generates strong recurring revenue with over 80% retention.
        - label: North America concentration
          value: 44
          unit: "% of billings"
          detail: Fitch says about 44% of billings come from North America.
        - label: Europe concentration
          value: 37
          unit: "% of billings"
          detail: Fitch says about 37% of billings come from Europe.
    approximationNotes: >-
      These are separate operating-scale indicators with different units and
      denominators, not nested market layers or comparable conversion stages.
      The assigned pool does not contain an independent spend-based TAM/SAM/SOM
      model; values are reproduced from Fitch rather than transformed.
    claimRefs: [CM001, CM004, CM005, CM006, CM015, CM016]
