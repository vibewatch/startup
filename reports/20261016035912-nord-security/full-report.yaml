      - number: '2.2'
        title: Sizing lens, scale proxies, and what remains unsupported
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not justify a conventional TAM/SAM/SOM stack, so the defensible sizing approach
              is to anchor on observed scale proxies and explicitly preserve the missing pieces. Fitch's 2025 rating
              note says Nord Security serves more than 15 million customers in 130 countries and assumes 19% organic
              revenue CAGR from 2024 to 2027, supported by pricing power, positive market fundamentals, and product
              launches. Datarails' 2024 interview with the CFO adds a historical traction marker: management entered the
              first institutional raise only after the business was already doing more than $100 million of revenue.
              Those datapoints support a large and still-growing opportunity, but they are not a substitute for an
              external category-spend model or a disclosed split between consumer VPN subscriptions and
              business-security revenue.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
              - CM013
