        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is real, but enterprise durability is still less visible than consumer reach
            body: >-
              Public evidence supports platform breadth across consumer and business security workflows, but the most
              concrete scale disclosures still lean toward aggregate user/customer counts rather than named enterprise
              economics or segment-level retention.
            calloutType: insight
            claimRefs:
              - CO005
