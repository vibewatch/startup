chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and public scale markers
        blocks:
          - type: paragraph
            body: >-
              Retained current evidence supports a straightforward identity anchor: Fitch describes Nord Security as a
              Lithuania-based cybersecurity provider focused on privacy, identity, and threat protection, while the
              company presents a broader digital-security suite rather than a single-product VPN vendor. The official
              site now markets consumer privacy, password management, storage, business access, browser, and identity
              offerings, and a partner positioning page reinforces that breadth. Fitch establishes a Lithuania base, but
              the retained evidence does not identify the current legal headquarters city or registered parent. Public
              scale markers are directionally strong but not perfectly comparable: the homepage lists 20M+ protected
              users, 25K+ businesses covered, and a workforce of 2000+ people, while Fitch's 2025 note cites over 15
              million customers in 130 countries and over 80% retention under a prepaid subscription model. Those
              numbers and the 2023 growth-equity round support a growth-stage private-company classification, but the
              definitional mismatch between "protected users," "customers," and disclosed business coverage means later
              chapters should not collapse them into one headline metric without qualification.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO011
