  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix is still consumer-heavy, with a documented but thinly quantified business layer
        blocks:
          - type: paragraph
            body: >-
              The strongest customer evidence still points to Nord as a scaled consumer-subscription business rather
              than a transparently disclosed enterprise-security vendor. Fitch says Nord served more than 15 million
              customers across 130 countries in 2025, with about 44% of billings from North America and about 37% from
              Europe. Public company-issued sources also keep positioning Nord as broader than a single-product VPN
              company: the 2022 and 2023 funding releases say businesses such as Calendly, Adobe, Shutterstock, and
              Vinted use Nord products, CybersecTools describes Nord as serving both consumers and businesses, and IT
              Goat frames the stack around business access, passwords, browser activity, files, VPN, and external
              exposure. That mix establishes segment breadth, but not the split between consumer revenue and business
              revenue.
