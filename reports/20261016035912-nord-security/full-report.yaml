      - number: '1.2'
        title: Founders, leadership surface, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Nord Security's current public leadership surface remains founder-led and functionally broad, but still
              incomplete from a governance diligence standpoint. The official about page names Tomas Okmanas, Eimantas
              Sabaliauskas, and Jonas Karklys as co-founders, and it identifies Laurynas Zabulis as CFO plus Dina Lurje
              as General Counsel & Head of Public Policy. That matters because later financing, regulatory, and
              product-expansion judgments appear to run through a relatively concentrated operating bench. Datarails'
              profile of Zabulis suggests the finance function has become more institutional since outside capital
              arrived, yet public materials retained here still do not disclose a fresh board roster, equity splits, or
              veto rights. For diligence purposes, the public record is good enough to identify key people and
              functional owners, but not to underwrite governance resiliency or founder/control dynamics.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Funding history, valuation markers, and stakeholder importance
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence indicates Nord Security stayed bootstrapped to substantial scale before taking
              institutional capital, then layered on both growth equity and leverage. A Datarails interview says the
              first outside round raised $100 million after revenue had already exceeded $100 million. Surfshark's 2023
              announcement then describes another $100 million from Warburg Pincus and says valuation doubled from $1.6
              billion to $3 billion. Fitch adds a later credit inflection: Nord Security entered 2025 with USD128
              million of cash and no leverage before a USD550 million term loan that funded shareholder distributions
              and fees, a policy choice Fitch explicitly cites as a rating constraint. Together these sources imply
              meaningful scale, but they also show why capital-structure diligence cannot stop at headline valuation:
              the public record still leaves shareholder rights, board influence, debt covenants, and any secondary
              liquidity economics materially under-specified.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO009
              - CO010
              - CO013
              - CO014
      - number: '1.4'
        title: Milestones, portfolio expansion, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Nord Security's own chronology shows sustained product and platform expansion, from the 2012 NordVPN
              launch to 2019 multi-product expansion, 2022 unicorn financing, 2023 follow-on funding, 2024 launches
              including NordStellar and Saily, and 2026 launches including NordLayer Browser and HangUp. That cadence
              supports a broadening strategic narrative rather than a static VPN story. Still, the adverse record
              matters: ZDNet questioned whether the Lithuania/Panama/Cyprus legal structure fully insulated user data
              from legal discovery, and it also reported Nord Security's disclosure of an earlier breach followed by
              remediation and a bug bounty program. Those issues do not negate the growth story, but they do mean later
              judgments should test legal structure, privacy posture, and operating controls rather than relying only on
              brand strength or launch velocity.
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
