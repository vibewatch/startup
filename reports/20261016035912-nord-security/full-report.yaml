              - CI013
              - CI014
              - CI015
      - number: '4.3'
        title: Liquidity looks serviceable, but leverage and disclosure still cap conviction
        blocks:
          - type: paragraph
            body: >-
              The strongest current financing evidence comes from Fitch's term-loan rating. Fitch says Nord ended 2024
              with $128 million of cash, expects annual cash balances to remain above $100 million, and assumes an
              undrawn $100 million revolver remains available after the new USD550 million term loan. That gives the
              company visible liquidity, but the same report says the debt raise funds a shareholder distribution and
              fees, and it explicitly constrains the rating because product diversification is still limited and
              financial policy is more aggressive than a simple deleveraging story would imply. Taken together, the
              public record supports a view that Nord can fund growth and debt service in a base case, but not a
              high-conviction underwriting case without audited revenue mix, current cash burn, covenant detail, and
              enterprise-specific retention and margin data.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI006
              - CI007
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public revenue quality is stronger than public revenue visibility
            body: >-
              Recurrence, prepayment, and retention are all visible in the public record, but current segment revenue,
              realized pricing, and enterprise contract quality are not. That makes the revenue model more legible than
              the actual valuation inputs.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI016
          - type: callout
            title: The new debt package improves scale but complicates the equity story
            body: >-
              Fitch's rating work supports a serviceable liquidity position, yet the same document says the USD550
              million term loan funds a shareholder distribution and that financial policy remains a rating constraint.
              That is compatible with growth, but it is not the same as self-funded expansion.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio scope and user jobs
        blocks:
          - type: paragraph
            body: >-
              The product surface now looks like a portfolio strategy, not a single-point VPN product. Nord
              Security-controlled releases and independent directories consistently show NordVPN, NordPass, NordLocker,
              and NordLayer as the core suite, with newer surfaces such as NordStellar, NordProtect, and Saily
              broadening the buyer conversation from privacy into identity, business access, and external-exposure
              monitoring. That matters because the user workflow spans distinct jobs: consumer privacy, credential
              management, encrypted file handling, business network access, and security posture monitoring. The product
              map is therefore broad enough to support bundling and land-and-expand motions, but the public record still
              provides much better proof of product breadth than of product-by-product deployment depth or realized
              customer outcomes.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE009
