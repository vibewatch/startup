  - id: FM001
    title: Evidence-constrained market sizing pyramid
    type: pyramid
    summary: >-
      Six operating-scale indicators bound Nord Security's demonstrated reach without presenting them as TAM, SAM, SOM,
      or a conversion funnel.
    data:
      nodes:
        - label: Customer reach
          value: '>15 million'
          unit: customers
          detail: Fitch's 2025 issuer profile says Nord Security serves a customer base of over 15 million.
        - label: Geographic span
          value: 130
          unit: countries
          detail: Fitch says the company serves customers in 130 countries.
        - label: Growth case
          value: 19
          unit: '% revenue CAGR, 2024-2027'
          detail: Fitch assumes sustained organic growth at a 19% CAGR between 2024 and 2027.
        - label: Renewal engine
          value: '>80%'
          unit: retention
          detail: Fitch says Nord Security generates strong recurring revenue with over 80% retention.
        - label: North America concentration
          value: 44
          unit: '% of billings'
          detail: Fitch says about 44% of billings come from North America.
        - label: Europe concentration
          value: 37
          unit: '% of billings'
          detail: Fitch says about 37% of billings come from Europe.
    approximationNotes: >-
      These are separate operating-scale indicators with different units and denominators, not nested market layers or
      comparable conversion stages. The assigned pool does not contain an independent spend-based TAM/SAM/SOM model;
      values are reproduced from Fitch rather than transformed.
    claimRefs:
      - CM001
      - CM004
      - CM005
      - CM006
      - CM015
      - CM016
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Assigned evidence places Nord between single-function privacy tools and admin-heavy enterprise access platforms:
      broader than password-only, monitoring, or consumer-VPN substitutes, but still narrower than a full-stack
      enterprise security platform.
    data:
      xAxis:
        label: Job breadth
        min: 1
        max: 5
        low: Narrow single job
        high: Broad multi-job suite
        description: Ordinal scoring derived from explicit capability scope in assigned comparison sources
        scale: ordinal
      yAxis:
        label: Deployment / administration load
        min: 1
        max: 5
        low: Low
        high: High
        description: Ordinal scoring derived from explicit operating-complexity language in assigned comparison sources
        scale: ordinal
      points:
        - label: Atlas VPN freemium
          x: 1.5
          'y': 1
          detail: Freemium VPN entry point that stayed operationally independent after acquisition.
          claimRefs:
            - CP006
        - label: Consumer VPN platforms
          x: 2
          'y': 1
          detail: Strong on encrypted internet access, but IT GOAT flags limited business policy and administration.
          claimRefs:
            - CP004
            - CP005
        - label: Dark-web monitoring
          x: 1.5
          'y': 1.5
          detail: Helps with leaked credentials and external exposure, but does not secure access or passwords directly.
          claimRefs:
            - CP007
        - label: Password-management platforms
          x: 2
          'y': 2
          detail: Strong on credentials, but limited on network or external-threat coverage.
          claimRefs:
            - CP008
        - label: Nord Security suite
          x: 4
          'y': 3
          detail: >-
            Broader suite across VPN, passwords, files, access, and external exposure, but still not a full replacement
            for every security layer.
          claimRefs:
            - CP002
            - CP007
            - CP012
        - label: SASE / zero-trust
          x: 5
          'y': 5
          detail: Broadest access-control scope in the assigned pool, but with heavier deployment and administration.
          claimRefs:
            - CP009
    approximationNotes: >-
      Axes are evidence-backed ordinal scores, not sourced market-share, satisfaction, or conversion metrics. The map
      reflects only explicit capability and administration language in the assigned pool.
