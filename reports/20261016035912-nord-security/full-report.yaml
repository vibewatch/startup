      - number: '4.2'
        title: Public pricing and unit-economics evidence is directional, not underwritable
        blocks:
          - type: paragraph
            body: >-
              Nord's public record reveals enough to sketch monetization mechanics but not enough to price risk with
              precision. Datarails' interview with the CFO says the company was already above $100 million in revenue
              when it first raised institutional capital and had built digital-payment collection across cards, PayPal,
              app stores, and crypto, which supports a scaled direct-to-consumer motion. Fitch adds that brand strength,
              bundle cross-sell, and the ability to cut marketing without a proportional hit to new billings support
              operating leverage. Even so, the assigned pool does not provide current list prices, realized net pricing,
              refund rates, segment gross margins, or product-level retention, and the only third-party revenue estimate
              in the pool is a very wide Owler range that is not suitable for underwriting.
            claimRefs:
              - CI004
