      - number: '3.3'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a real but not impregnable moat. Fitch describes a cost advantage from
              Lithuania-based software development and lower-cost organic acquisition channels, which helps explain why
              Nord can keep bundling across consumer security categories. Still, Fitch also flags limited product
              diversification and lower retention than traditional enterprise software, while IT GOAT says Nord does not
              replace endpoint, email, backup, or every specialized platform. Together those points suggest Nord can
              defend consumer privacy bundles and some SMB or mid-market access use cases, yet larger enterprise
              security budgets may still favor broader platforms or multi-vendor stacks until Nord publishes stronger
              win, renewal, and deployment proof for NordLayer and NordPass Business.
            claimRefs:
