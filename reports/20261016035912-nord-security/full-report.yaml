      - number: '6.2'
        title: Adoption proof exists, but most named-customer evidence remains issuer-controlled
        blocks:
          - type: paragraph
            body: >-
              Nord can show real adoption signals, but most of them are still company selected rather than independently
              audited. The clearest public proof is the repeated official claim that Calendly, Adobe, Shutterstock, and
              Vinted are business customers, plus the 2021 Atlas VPN acquisition announcement stating that Atlas already
              had more than 6 million users worldwide. The 2023 funding announcement from Yahoo's GlobeNewswire feed and
              Surfshark's own blog both say the combined group served millions of users worldwide, which is consistent
              with very broad consumer reach. However, the public record still does not disclose seat counts,
              implementation depth, reference dates for each named logo, or customer outcomes tied to NordLayer,
              NordPass Business, or other business SKUs.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Durability looks solid on subscriptions, while concentration risk sits in product mix opacity
        blocks:
          - type: paragraph
            body: >-
              Independent evidence is better on subscription durability than on named enterprise depth. Fitch says Nord
              generates high recurring revenue with retention above 80%, user retention above 75%, and 97% of
              subscription billings tied to monthly, one-year, and two-year plans. Fitch also says Nord's more than
              10-product portfolio and bundle structure create cross-selling opportunities, which supports a
              land-and-expand narrative inside the consumer base and into adjacent identity and access products. The
              main concentration concern is that Fitch still constrains the rating for limited product diversification,
              while public materials do not reveal top-customer exposure, partner dependence, GRR, NRR, or
              business-product renewal rates. That means durability is evidenced at the portfolio level more clearly
              than at the enterprise-account level.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU010
              - CU011
              - CU012
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU009
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Consumer scale is well evidenced
            body: >-
              Independent coverage is strong enough to support scale and subscription durability at the portfolio level,
              especially for the core consumer base.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
          - type: callout
            title: Public enterprise proof is still logo-heavy
            body: >-
              Nord can name recognizable business customers, but public materials still do not show seat counts, renewal
              curves, channel concentration, or independent case studies for the business stack.
            calloutType: risk
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Financial policy and business concentration lead the risk ranking because Fitch ties them to a BB issuer
              rating, a USD550 million first-lien term loan, and explicit downgrade sensitivities. Fitch calculates 5.1x
              leverage on Fitch-defined 2025 EBITDA of USD108 million and expects deleveraging rather than reporting it
              as achieved; a sustained ratio above 3.0x is one of its negative triggers. The same analysis identifies
              limited product diversification and technology disruption as constraints. Subscription retention and cash
              generation mitigate those exposures, but the available margin and free-cash-flow figures are Fitch
              forecasts, not audited results supplied in this evidence set. The heatmap therefore treats leverage and
              concentration as high-priority risks and leaves regulatory visibility unscored where primary evidence is
              absent.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a financing-contract risk and one narrow candidate-data practice, but it
              does not contain a regulator decision, court record, data-protection authority finding, license inventory,
              or complete incident register. Fitch reports a global customer footprint spanning 130 countries, which
              increases the number of potentially relevant legal regimes without identifying a specific violation. Nord
              Security's recruitment page says an AI-assisted review tool may be used, that a recruiter ultimately
              reviews every application, and that candidates may opt out; those are disclosed controls, not proof of
              full compliance. The absence of an enforcement or incident record in this bounded pool is not evidence
              that none exists. Primary legal diligence remains necessary before reducing residual exposure.
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR016
      - number: '7.3'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Consumer-subscription economics create both resilience and sensitivity. Fitch reports that monthly,
              one-year, and two-year plans represent 97% of subscription billings and describes an over-80% retention
              rate, while also warning that consumer cybersecurity retention is below traditional enterprise software. A
              Nord B2B engineering posting describes cross-suite microservices and lists AWS plus several database,
              queue, container, and application technologies for that role. This is evidence of role-level complexity,
              not a complete production architecture or proof of an outage. The operating risk cannot be quantified
              without service-level history, incident severity, recovery tests, vendor concentration, and control-audit
              results. Management should be tested against those records rather than marketing descriptions.
            claimRefs:
              - CR005
              - CR007
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR015
      - number: '7.4'
        title: Dependencies, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows mitigation work but uneven maturity. The CFO described upgrading enterprise resource
              planning, reporting, expense, and treasury systems while a procure-to-pay system was still being
              implemented; this indicates progress after acknowledged data-readiness weaknesses. The Atlas VPN
              acquisition release required third-party audits but also said the team would continue to operate
              independently and did not disclose transaction terms. A partner listing further states that Nord Security
              does not replace endpoint, email, backup, or every specialized security platform, leaving customers
              dependent on adjacent controls. Investment kill criteria should include sustained Fitch-defined leverage
              above 3.0x, interest coverage below 5.0x, organic growth near or below mid-single digits, a material
              unremediated incident, or evidence that integration and control testing cannot keep pace with portfolio
              expansion.
            claimRefs:
              - CR004
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR013
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The strongest public facts point in two directions at once. On the positive side, Nord Security has
              already shown it can raise institutional capital after bootstrapping, management said it was profitable
              before the first round, and Fitch described a large recurring subscription base with strong retention,
              organic growth, and improving margins. On the negative side, the last disclosed equity mark is a September
              2023 joint Nord Security/Surfshark valuation, not a current standalone valuation, and Fitch's 2025 rating
              note says the new debt package funds shareholder distributions while leverage starts high. That
              combination leaves public markets evidence good enough to justify continued diligence, but not good enough
              to justify a premium entry price or a clean buy recommendation today.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
          - type: figure
            figureRef: FV001
            claimRefs: []
      - number: '8.2'
        title: Why the business is interesting but not yet underwritten at price
        blocks:
          - type: paragraph
            body: >-
              The bull case starts with scale and breadth. Fitch says Nord serves more than 15 million customers across
              130 countries with subscription retention above 80%, while Scalable and current company materials point to
              a broader footprint spanning consumer privacy tools, business access products, and an actively hiring
              global team. Product adjacency also matters: the 2021 Atlas VPN acquisition, NordLayer hiring, and
              partner-facing platform positioning all suggest management is trying to expand beyond a single consumer
              VPN product. The anti-thesis is that public evidence still does not show how much of current value comes
              from durable enterprise security versus a large but more consumer-oriented VPN base, and Fitch explicitly
              says diversification, scale, and financial policy constrain the rating. That gap is the main reason the
              valuation stance remains price-disciplined rather than aggressive.
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario framing and comparable context
        blocks:
          - type: paragraph
            body: >-
              The available comparable context is directional rather than precise. Fitch places Nord against larger
              listed software and cyber names such as Gen Digital, RingCentral, and TriNet, and says Nord is smaller and
              lower margin than the best consumer-cyber comp even though it is growing faster. That supports a framework
              where upside comes from proving enterprise mix, retention durability, and successful deleveraging, while
              downside comes from the market treating Nord as a concentrated consumer-security asset with
              recapitalization overhang. Because the public record does not disclose a current standalone equity
              valuation, the scenarios below use the last disclosed $3 billion joint mark only as a reference anchor,
              not as a fair-value conclusion.
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV009
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              A move from research-more to buy requires evidence that can change both underwriting confidence and entry
              discipline. The most important missing items are a current standalone revenue mix by product and customer
              type, audited or management-certified retention and margin detail, and the exact rights and dilution
              implications of the 2022 and 2023 financing plus the 2025 debt-funded shareholder distribution. Without
              that package, a numeric target return or exit timing would be false precision. The thesis breaks if
              updated diligence shows the enterprise expansion story is still too small to offset concentration in
              consumer VPN, if leverage stays high because cash is distributed instead of delevered, or if current
              private pricing already assumes outcomes that the public evidence has not yet proven.
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not buy
            body: >-
              Public evidence is strong enough to continue diligence, but too incomplete on current price, capital
              structure, and enterprise mix to justify a buy call.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV006
              - CV007
          - type: callout
            title: The key underwriting risk is price support, not product relevance
            body: >-
              The company looks real and scaled; the unresolved problem is whether today's unseen private-market entry
              terms already capitalize more diversification and deleveraging than the public record can prove.
            calloutType: risk
            claimRefs:
              - CV003
              - CV007
              - CV009
              - CV012
