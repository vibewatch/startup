    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and substitute paths
        blocks:
          - type: paragraph
            body: >-
              Nord's competitive set is broader than a direct-VPN peer list. Preqin and Nord's own materials show the
              company selling VPN, network access, password management, encrypted storage, and VPN tooling, while IT
              GOAT frames the main alternatives as single-function password tools, consumer VPNs, dark-web monitoring
              products, and broader SASE or zero-trust stacks. In practice, that means the substitute path in the
              assigned pool is often a fragmented stack or a more admin-heavy incumbent platform rather than one named
              rival. The same evidence also implies that status-quo buyers can assemble overlapping coverage across
              multiple vendors without adopting the full Nord suite.
