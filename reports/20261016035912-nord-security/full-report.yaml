  - id: FR001
    title: 'Risk heatmap: impact, likelihood, and mitigation maturity'
    type: matrix
    summary: >-
      Financial policy and product concentration have the strongest independent support, while regulatory and
      operational likelihoods remain uncertain.
    data:
      columns:
        - label: Likelihood
          detail: Ordinal assessment from retained evidence; unknown where no frequency record exists.
        - label: Impact
          detail: Potential effect on credit quality, operations, or trust.
        - label: Mitigation maturity
          detail: Publicly evidenced control maturity, not a control-effectiveness audit.
      rows:
        - label: Financial policy and leverage
          note: Fitch supplies numeric thresholds and forecasts.
          values:
            - value: High
              tone: negative
            - value: High
              tone: negative
            - value: Developing
              tone: warning
        - label: Product and consumer concentration
          note: Fitch constrains the rating for limited diversification.
          values:
            - value: Medium-high
              tone: warning
            - value: High
              tone: negative
            - value: Developing
              tone: warning
        - label: Subscriber economics
          note: Retention supports the case, but cohort and CAC evidence is missing.
          values:
            - value: Medium
              tone: warning
            - value: High
              tone: negative
            - value: Partial
              tone: warning
        - label: Cloud and microservices operations
          note: A role posting is not an architecture or incident audit.
          values:
            - value: Unknown
              tone: neutral
            - value: High
              tone: negative
            - value: Unknown
              tone: neutral
        - label: Portfolio integration
          note: Atlas governance commitments are company-issued.
          values:
            - value: Medium
              tone: warning
            - value: Medium
              tone: warning
            - value: Partial
              tone: warning
        - label: Regulatory and incident visibility
          note: No primary regulator or complete incident record was assigned.
          values:
            - value: Unknown
              tone: neutral
            - value: High
              tone: negative
            - value: Unknown
              tone: neutral
    approximationNotes: >-
      Ordinal labels are analytical classifications, not measured probabilities; unknown values are intentionally not
      converted to low risk.
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strong scale and recurring economics are offset by leverage and missing current price support, leading to a
      research-more call.
    data:
      nodes:
        - id: scale
          label: Category scale proven
          note: >-
            15M+ customers in 130 countries; 20M+ protected users and 25K+ businesses reported in secondary current
            profiles.
          claimRefs:
            - CV008
            - CV014
        - id: economics
          label: Recurring model attractive
          note: Fitch expects 19% CAGR through 2027 and EBITDA margin expansion from roughly 11% in 2025 to 16.5% by 2029.
          claimRefs:
            - CV006
        - id: breadth
          label: Platform adjacency exists
          note: >-
            Atlas VPN, NordLayer hiring, and partner positioning suggest broader security ambitions than a single VPN
            product.
          claimRefs:
            - CV010
            - CV012
            - CV013
        - id: overhang
          label: Capital structure overhang
          note: >-
            Fitch says scale, diversification, and financial policy constrain the rating; the 2025 term loan funds
            shareholder distribution.
          claimRefs:
            - CV007
        - id: price
          label: Current price support incomplete
          note: >-
            The latest disclosed valuation is a 2023 joint Nord/Surfshark mark, and the split between primary,
            secondary, and current standalone value is unverified.
          claimRefs:
            - CV002
            - CV003
        - id: decision
          label: Recommendation = research-more
          note: >-
            Continue diligence, but require updated standalone financial, cap-table, and segment evidence before
            underwriting a buy.
          claimRefs:
            - CV003
            - CV006
            - CV007
      edges:
        - from: scale
          to: economics
          label: Scale helps explain recurring cash-generation potential.
          claimRefs:
            - CV008
        - from: economics
          to: breadth
          label: Growth and margin upside matter more if adjacent products are real.
          claimRefs:
            - CV006
            - CV012
        - from: breadth
          to: overhang
          label: Breadth helps the thesis, but does not remove leverage and policy risk.
          claimRefs:
            - CV007
            - CV012
        - from: overhang
          to: price
          label: Debt and distribution terms raise the bar for paying up.
          claimRefs:
            - CV007
        - from: price
          to: decision
          label: Incomplete current valuation support keeps the call at research-more.
          claimRefs:
            - CV003
