  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is recurring, prepaid, and broader than a single VPN SKU
        blocks:
          - type: paragraph
            body: >-
              The clearest public revenue signal is Fitch's 2025 credit analysis, which describes Nord Security as a
              prepaid subscription business where monthly, one-year, and two-year plans account for 97% of subscription
              billings and retention is above 80%. That matters because it points to cash collection ahead of service
              delivery and a revenue base that is more repeatable than one-off software sales. Public materials also
              show the company is not only monetizing a consumer VPN: Nord, Surfshark, and partner materials all frame
              the portfolio as a broader mix of privacy, identity, access, password, file, and exposure-management
              products, while Nord's own careers page explicitly describes a B2B team building cybersecurity products
              for businesses. However, the assigned evidence does not disclose how much revenue comes from consumer
              subscriptions versus business contracts, bundles, or freemium acquisition funnels.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
              - CI014
              - CI015
