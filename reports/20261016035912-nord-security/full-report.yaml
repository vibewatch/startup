      - number: '2.3'
        title: Buyers, adoption drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer map in public evidence has two clear poles. On the consumer side, Fitch describes a prepaid
              subscription business with high retention, suggesting adoption depends on recurring renewals rather than
              one-time software purchases. On the business side, Nord Security's own B2B hiring language and IT Goat's
              reseller packaging point to security and IT teams buying bundles that cover access, passwords, browser
              activity, files, and external exposure. Adoption drivers therefore include trusted branding, bundled
              cross-sell, and Lithuania-based engineering scale, but the same evidence set also shows the constraints:
              consumer cybersecurity is more macro-sensitive than stickier corporate software, and public sources in
              this pool do not disclose who ultimately owns the budget or renewals for each business product line.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM012
              - CM014
