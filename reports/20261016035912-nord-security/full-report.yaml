  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Nord's public customer journey starts with large-scale consumer VPN demand and extends into bundle expansion and
      lightly evidenced business adoption.
    data:
      items:
        - label: Consumer privacy entry point
          actor: Individual subscriber
          channel: NordVPN-led self-serve acquisition
          touchpoints:
