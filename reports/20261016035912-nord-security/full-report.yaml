      - number: '5.2'
        title: Architecture and delivery model
        blocks:
          - type: paragraph
            body: >-
              The clearest current technical evidence comes from Nord Security's own B2B engineering recruiting. The
              company states that its teams build secure, scalable business products and collaborate on microservices
              used across the suite, while the named stack includes PHP, Go, MySQL, Redis, RabbitMQ, Docker, AWS, and
              standard CI/CD plus integration-testing disciplines. Fitch adds that proprietary software development is
              mainly in Lithuania, which implies that a meaningful share of engineering remains centralized in-house
              rather than fully outsourced. Together, those signals support a reasonably mature software operating model
              with shared platform services and reusable components. What they do not prove is the exact customer-facing
              architecture by product, the degree of codebase reuse across brands, or the live reliability posture of
              each major service.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE008
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
