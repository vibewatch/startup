      - number: '3.2'
        title: Nord positioning by buyer job
        blocks:
          - type: paragraph
            body: >-
              Nord's strongest public positioning still starts in consumer VPN, where Fitch calls it the leading global
              player and highlights brand awareness around both NordVPN and the value-for-money Surfshark line. But the
              same pool also shows why management is pushing beyond that base: Preqin says the 2022 funding was meant to
              expand the enterprise footprint, Nord's B2B hiring page says the business builds products for companies,
              and the listed packaging spans consumer subscriptions plus a per-user NordLayer price. Atlas VPN adds a
              freemium entry point that can widen the funnel, but the public record here still shows portfolio expansion
              more clearly than it shows durable enterprise share capture.
