  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained pool supports defining Nord Security's market as a privacy and cybersecurity bundle that
              spans both consumer subscriptions and selected business-security workflows, rather than as a
              single-purpose VPN vendor. Invest Lithuania describes a growing ecosystem of B2C and B2B products that
              includes NordVPN, NordPass, NordLocker, NordLayer, NordStellar, NordProtect, and Saily, while the 2021
              Atlas VPN release shows management using acquisitions to widen the funnel into freemium and
              developing-market users. Euronomy adds a useful positioning lens by framing NordVPN as a European-built,
              privacy-first alternative to US and offshore offerings, which makes trust and jurisdiction part of the
              substitute set alongside features and price.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
