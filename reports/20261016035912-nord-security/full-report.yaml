            title: Public proof of enterprise displacement is still thin
            body: >-
              The assigned pool shows credible enterprise intent and packaging, but it does not provide named win-loss,
              renewal, or deployment evidence proving NordLayer or NordPass Business consistently displace broader
              enterprise security incumbents.
            calloutType: risk
            claimRefs:
