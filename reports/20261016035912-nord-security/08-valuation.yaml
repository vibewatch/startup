  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: enterprise-mix
      missingEvidence: Current revenue, margin, and renewal split across consumer VPN, business security, and adjacent products.
      whyItMatters: Without segment mix, the market cannot tell whether the valuation should be anchored to consumer subscriptions or a broader enterprise-security platform story.
      diligencePath: Request current management reporting by product, customer type, gross margin, and renewal performance.
      relatedQuestionRefs: [QV007]
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-preferences
      missingEvidence: Current cap table, liquidation preferences, shareholder rights, and exact economics of the 2022 and 2023 rounds.
      whyItMatters: Entry price discipline and return modeling depend on dilution, seniority, and whether disclosed rounds included meaningful secondary liquidity.
      diligencePath: Obtain the latest financing documents, cap-table summary, and board-approved shareholder rights schedule.
    - type: missing-source
      severity: material
      topic: current-standalone-valuation
      missingEvidence: A current standalone Nord Security equity valuation or financing mark after the 2025 leveraged transaction.
      whyItMatters: The public record only shows a September 2023 joint valuation anchor, which is too stale and too aggregated to support a present-day buy decision.
      diligencePath: Request the latest primary transaction materials, secondary marks, lender decks, or board valuation papers.
    - type: private-evidence-only
      severity: material
      topic: cash-allocation-policy
      missingEvidence: Management's current policy for debt paydown, acquisitions, and shareholder distributions after the 2025 term loan.
      whyItMatters: Return compression risk depends on whether growth cash is reinvested, used to delever, or extracted by shareholders.
      diligencePath: Review current budget, debt documents, and board materials covering capital allocation and covenant headroom.
