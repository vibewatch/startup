schemaVersion: report-v2
artifact: valuation
slug: nord-security
runDate: 2026-10-16
company:
  name: Nord Security
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports Nord Security as a scaled, still-growing cyber asset with real subscription economics,
    but it does not support paying through the last disclosed 2023 joint valuation without updated standalone
    revenue mix, cap-table, and post-recap cash-allocation data. The chapter therefore lands on research-more with
    medium confidence, high risk, and a price-disciplined stance rather than a buy call.
sections:
  - id: recommendation
    title: Recommendation and valuation stance
    body: >-
      The strongest public facts point in two directions at once. On the positive side, Nord Security has already
      shown it can raise institutional capital after bootstrapping, management said it was profitable before the first
      round, and Fitch described a large recurring subscription base with strong retention, organic growth, and
      improving margins. On the negative side, the last disclosed equity mark is a September 2023 joint Nord
      Security/Surfshark valuation, not a current standalone valuation, and Fitch's 2025 rating note says the new
      debt package funds shareholder distributions while leverage starts high. That combination leaves public markets
      evidence good enough to justify continued diligence, but not good enough to justify a premium entry price or a
      clean buy recommendation today.
    claimRefs: [CV001, CV002, CV004, CV006, CV007]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-balance
    title: Why the business is interesting but not yet underwritten at price
    body: >-
      The bull case starts with scale and breadth. Fitch says Nord serves more than 15 million customers across
      130 countries with subscription retention above 80%, while Scalable and current company materials point to a
      broader footprint spanning consumer privacy tools, business access products, and an actively hiring global team.
      Product adjacency also matters: the 2021 Atlas VPN acquisition, NordLayer hiring, and partner-facing platform
      positioning all suggest management is trying to expand beyond a single consumer VPN product. The anti-thesis is
      that public evidence still does not show how much of current value comes from durable enterprise security versus
      a large but more consumer-oriented VPN base, and Fitch explicitly says diversification, scale, and financial
      policy constrain the rating. That gap is the main reason the valuation stance remains price-disciplined rather
      than aggressive.
    claimRefs: [CV003, CV007, CV008, CV010, CV012, CV013, CV014]
    tableRefs: [TV002]
  - id: scenario-framing
    title: Scenario framing and comparable context
    body: >-
      The available comparable context is directional rather than precise. Fitch places Nord against larger listed
      software and cyber names such as Gen Digital, RingCentral, and TriNet, and says Nord is smaller and lower
      margin than the best consumer-cyber comp even though it is growing faster. That supports a framework where
      upside comes from proving enterprise mix, retention durability, and successful deleveraging, while downside
      comes from the market treating Nord as a concentrated consumer-security asset with recapitalization overhang.
      Because the public record does not disclose a current standalone equity valuation, the scenarios below use the
      last disclosed $3 billion joint mark only as a reference anchor, not as a fair-value conclusion.
    claimRefs: [CV002, CV003, CV006, CV007, CV009]
    tableRefs: [TV003]
  - id: diligence-asks
    title: Final diligence asks and thesis-break triggers
    body: >-
      A move from research-more to buy requires evidence that can change both underwriting confidence and entry
      discipline. The most important missing items are a current standalone revenue mix by product and customer type,
      audited or management-certified retention and margin detail, and the exact rights and dilution implications of
      the 2022 and 2023 financing plus the 2025 debt-funded shareholder distribution. Without that package, a numeric
      target return or exit timing would be false precision. The thesis breaks if updated diligence shows the
      enterprise expansion story is still too small to offset concentration in consumer VPN, if leverage stays high
      because cash is distributed instead of delevered, or if current private pricing already assumes outcomes that
      the public evidence has not yet proven.
    claimRefs: [CV003, CV006, CV007, CV010, CV011, CV012]
callouts:
  - calloutType: recommendation
    title: Research-more, not buy
    body: >-
      Public evidence is strong enough to continue diligence, but too incomplete on current price, capital structure,
      and enterprise mix to justify a buy call.
    claimRefs: [CV003, CV006, CV007]
  - calloutType: risk
    title: The key underwriting risk is price support, not product relevance
    body: >-
      The company looks real and scaled; the unresolved problem is whether today's unseen private-market entry terms
      already capitalize more diversification and deleveraging than the public record can prove.
    claimRefs: [CV003, CV007, CV009, CV012]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - [Recommendation, research-more, "Scale and financing history are real, but current standalone price support is incomplete.", Keep the company in diligence but do not underwrite a buy on public evidence alone.]
      - [Confidence, medium, "Core scale and financing facts are visible, but current standalone valuation support is incomplete.", Avoid false precision until private diligence closes the main gaps.]
      - [Risk rating, high, "Leverage, shareholder-distribution policy, and product-mix uncertainty can compress returns.", Underwrite downside first and require tighter entry discipline.]
      - [Valuation stance, fair-at-best with strict entry discipline, "No public basis supports paying through the last disclosed 2023 joint mark.", Treat any premium ask as unsupported until refreshed private evidence arrives.]
      - [Return / exit posture, not supportable numerically yet, "Current price, terms, and standalone economics are not publicly disclosed in enough detail.", Do not set a target return or exit timing until those materials are reviewed.]
    notes: >-
      Assessment uses only public sources in the assigned pool; the latest disclosed valuation is a 2023 joint
      Nord Security/Surfshark figure rather than a current standalone mark.
    claimRefs: [CV002, CV003, CV006, CV007]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Evidence-backed view
      - What would change the view
    rows:
      - [Scale, "15M+ customers, 130 countries, and 20M+ protected users indicate category relevance.", "Need audited or management-certified customer-quality, churn, and cohort detail."]
      - [Economics, "Fitch expects 19% CAGR through 2027 and EBITDA margin expansion from about 11% in 2025 to 16.5% by 2029.", "Need audited revenue, margin, and cash-conversion data by product to confirm the forecast path."]
      - [Platform breadth, "Atlas VPN, NordLayer hiring, and partner positioning imply a broader platform than a single VPN SKU.", "Need clearer proof that enterprise and adjacent products are materially affecting revenue mix and renewal quality."]
      - [Capital structure, "The adverse public signal is the 2025 debt raise tied to shareholder distribution and slower debt reduction.", "Need cap-table, preference, and shareholder-distribution terms plus updated leverage policy."]
    notes: >-
      The table separates observable public proof from the private evidence still needed to turn a company-quality
      story into a price-supported investment case.
    claimRefs: [CV006, CV007, CV008, CV010, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - [Bull, "Enterprise mix proves meaningful, retention stays strong, Fitch-style margin expansion lands, and deleveraging follows growth rather than new distributions.", "Could justify a premium to the last disclosed $3B joint valuation reference, but only with current standalone numbers and terms.", "Would require fresh proof of segment mix, margin quality, and disciplined capital allocation.", "Enterprise revenue remains immaterial or leverage stays elevated despite growth."]
      - [Base, "Consumer scale remains healthy, adjacent products expand, but public evidence still cannot cleanly separate standalone Nord value from the joint group history.", "Supports continued diligence and a price-disciplined entry around or below the last disclosed joint reference, not a premium.", "Best fit with today's evidence: real growth plus incomplete valuation support.", "Private round terms imply a richer mark than the public record can justify."]
      - [Bear, "Consumer VPN concentration persists, product diversification disappoints, or debt-funded shareholder returns outrun deleveraging.", "Would support a discount to the last disclosed joint reference and raise the risk of return compression or a future down-round.", "Fitch's explicit concerns on diversification and financial policy are already present in public evidence.", "Weak renewal quality, slower growth, or additional balance-sheet extraction."]
    notes: >-
      Scenario ranges are expressed relative to the last disclosed $3B joint valuation because no current standalone
      Nord Security equity valuation is publicly verified in the assigned evidence pool.
    claimRefs: [CV002, CV003, CV006, CV007, CV009]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Strong scale and recurring economics are offset by leverage and missing current price support, leading to a research-more call.
    data:
      nodes:
        - id: scale
          label: Category scale proven
          note: 15M+ customers in 130 countries; 20M+ protected users and 25K+ businesses reported in secondary current profiles.
          claimRefs: [CV008, CV014]
        - id: economics
          label: Recurring model attractive
          note: Fitch expects 19% CAGR through 2027 and EBITDA margin expansion from roughly 11% in 2025 to 16.5% by 2029.
          claimRefs: [CV006]
        - id: breadth
          label: Platform adjacency exists
          note: Atlas VPN, NordLayer hiring, and partner positioning suggest broader security ambitions than a single VPN product.
          claimRefs: [CV010, CV012, CV013]
        - id: overhang
          label: Capital structure overhang
          note: Fitch says scale, diversification, and financial policy constrain the rating; the 2025 term loan funds shareholder distribution.
          claimRefs: [CV007]
        - id: price
          label: Current price support incomplete
          note: The latest disclosed valuation is a 2023 joint Nord/Surfshark mark, and the split between primary, secondary, and current standalone value is unverified.
          claimRefs: [CV002, CV003]
        - id: decision
          label: Recommendation = research-more
          note: Continue diligence, but require updated standalone financial, cap-table, and segment evidence before underwriting a buy.
          claimRefs: [CV003, CV006, CV007]
      edges:
        - from: scale
          to: economics
          label: Scale helps explain recurring cash-generation potential.
          claimRefs: [CV008]
        - from: economics
          to: breadth
          label: Growth and margin upside matter more if adjacent products are real.
          claimRefs: [CV006, CV012]
        - from: breadth
          to: overhang
          label: Breadth helps the thesis, but does not remove leverage and policy risk.
          claimRefs: [CV007, CV012]
        - from: overhang
          to: price
          label: Debt and distribution terms raise the bar for paying up.
          claimRefs: [CV007]
        - from: price
          to: decision
          label: Incomplete current valuation support keeps the call at research-more.
          claimRefs: [CV003]
