callouts:
  - calloutType: "insight"
    title: "Breadth is real, but enterprise durability is still less visible than consumer reach"
    body: >-
      Public evidence supports platform breadth across consumer and business security workflows, but
      the most concrete scale disclosures still lean toward aggregate user/customer counts rather
      than named enterprise economics or segment-level retention.
    claimRefs: ["CO005", "CO011"]
  - calloutType: "risk"
    title: "Governance and downside protections remain under-disclosed"
    body: >-
      The retained public record is enough to identify founders, capital inflections, and a new debt
      layer, but not enough to underwrite cap-table rights, board control, or creditor constraints
      with confidence.
    claimRefs: ["CO013", "CO014"]
