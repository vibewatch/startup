    title: "Snapshot KPI table"
    columns:
      - "Metric"
      - "Public value/status"
      - "Date"
      - "Confidence"
      - "Gap / diligence ask"
    rows:
      - ["Identity", "Nord Security, private cybersecurity platform", "2026 evidence review", "high", "Fitch corroborates the Lithuania-based privacy, identity, and threat-protection focus; obtain the current legal entity chart."]
      - ["Operating base / headquarters", "Lithuania-based; exact legal headquarters city not substantiated", "2025-2026 evidence", "medium", "Confirm registered parent, legal headquarters, and current operating locations from corporate records."]
      - ["Founded / origin", "NordVPN launch history begins in 2012", "2012", "medium", "Company chronology and a syndicated company release support the date; confirm parent-company incorporation separately."]
      - ["Current stage", "Private growth-stage company; latest disclosed valuation $3.0B", "2023 valuation, reviewed 2026", "medium", "Stage is an analytical classification, not a company-issued financing label; update from the latest cap table."]
      - ["Business model", "Prepaid subscriptions; Fitch says monthly, one-year, and two-year plans account for 97% of subscription billings", "2025-10-27", "medium", "Request current product and B2C/B2B revenue mix; subscription billings are not ARR or revenue."]
      - ["Protected users", "20M+", "2026 site snapshot", "medium", "Company-reported metric; reconcile definition against other customer counts before using as a cross-chapter anchor."]
      - ["Businesses covered", "25K+", "2026 site snapshot", "medium", "Company-reported business count; public sources here do not define whether it is paying customers, covered seats, or logos."]
      - ["Headcount", "2000+ employees", "2026 site snapshot", "medium", "Recruiting language, not an audited workforce disclosure."]
      - ["Disclosed external equity raised", "At least $200M across the two published $100M rounds", "2022-2023", "medium", "Visible total sums disclosed rounds only; does not address secondaries, venture debt, or undisclosed financing."]
      - ["Last disclosed valuation", "$3.0B", "2023-09-28", "medium", "Retained public evidence is company-related and stale for 2026; confirm with management and latest shareholder marks."]
      - ["Term debt", "USD550M first-lien term loan due 2032", "2025-10-27", "high", "Review covenants, restricted-payment capacity, interest cost, and refinancing assumptions."]
      - ["Current revenue / ARR", "Not publicly supported in retained current sources", "2026 gap", "low", "Request audited FY2025 or TTM revenue, ARR, gross margin, and retention pack before using a headline multiple."]
    notes: >-
      Mixes current company-reported scale markers with third-party financing references; rows that
      show status rather than a numeric value indicate unsupported public metrics, not zero values.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO008", "CO009", "CO010", "CO011", "CO013", "CO016"]
