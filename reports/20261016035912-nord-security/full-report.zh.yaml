          - type: paragraph
            body: >-
              从“继续研究”转为“买入”，需要能够同时改变投资判断信心和入场纪律的证据。最重要的缺失项是按产品和客户类型拆分的当前独立收入结构、经审计或经管理层认证的留存和利润率细节，以及 2022 年和 2023 年融资加上
              2025 年债务融资股东分配所带来的确切权利与稀释影响。没有这一整套资料，给出数字化目标回报或退出时间就是虚假的精确。如果更新后的尽调显示企业扩张仍小得不足以抵消消费级 VPN
              的集中度、杠杆因现金被分配而非用于去杠杆而持续偏高，或当前私募定价已经计入公开证据尚未证明的结果，投资论点就失效。
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 继续研究，不是买入
            body: 公开证据足以继续尽调，但当前价格、资本结构和企业业务结构披露太不完整，不足以支持买入判断。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV006
              - CV007
          - type: callout
            title: 核心投资判断风险在价格支撑，而非产品相关性
            body: 公司本身真实且已有规模；尚未解决的问题是，当前看不见的私募市场入场条款，是否已经计入了公开记录无法证明的更多多元化和去杠杆成果。
            calloutType: risk
            claimRefs:
              - CV003
              - CV007
              - CV009
              - CV012
