        title: 展示项
        blocks:
          - type: callout
            title: 产品广度真实存在，但企业业务韧性仍不如消费者触达清晰
            body: 公开证据支持其覆盖消费者和企业安全流程的平台广度，但最具体的规模披露仍偏向总体用户／客户数，而不是具名企业经济指标或分部留存。
