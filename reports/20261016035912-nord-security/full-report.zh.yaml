      - number: '2.3'
        title: 买方、采用驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              公开证据中的买方图谱有两个清晰极点。消费者侧，Fitch 描述的是高留存的预付订阅业务，说明采用依赖持续续费，而不是一次性软件购买。企业侧，Nord Security 自身的 B2B 招聘语言和 IT Goat
              的经销商包装，都指向安全与 IT
              团队购买覆盖访问、密码、浏览器活动、文件和外部暴露的组合。采用驱动因素包括可信品牌、组合交叉销售和立陶宛工程规模；但同一组证据也显示出约束：消费者网络安全比粘性更强的企业软件更受宏观环境影响，而这里的公开来源未披露每条企业产品线最终由谁掌握预算或续费。
            claimRefs:
