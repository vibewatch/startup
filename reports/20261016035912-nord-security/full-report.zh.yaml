        title: 公开定价与单位经济证据只能指方向，尚不足以投资判断
        blocks:
          - type: paragraph
            body: >-
              Nord 的公开记录足以勾勒变现机制，却不足以精确给风险定价。Datarails 对 CFO 的访谈称，公司首次获得机构资本时收入已超过 $100
              million，并已通过银行卡、PayPal、应用商店和加密货币建立数字支付收款，说明直达消费者的动作已具规模。Fitch
              补充称，品牌强度、组合交叉销售，以及削减营销而不同比例影响新开票额的能力，支撑运营杠杆。即便如此，指定资料没有当前标价、实际净价、退款率、分部毛利率或产品级留存；资料中唯一的第三方收入估计是跨度很大的 Owler
              区间，不适合用于投资判断。
