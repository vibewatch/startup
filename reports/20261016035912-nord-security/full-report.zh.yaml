  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 企业业务组合被证明具有实质规模，留存保持强劲，Fitch 式利润率扩张落地，去杠杆跟随增长而不是新的分配。
        - 这可能支持相对最近披露的 $3B 联合估值参考价获得溢价，但前提是有当前的独立经营数据和条款。
        - 需要企业业务组合、利润率质量和资本配置纪律方面的新证据。
        - 企业收入仍微不足道，或尽管增长杠杆仍处于高位。
      - - 基准
        - 消费者规模保持健康，相邻产品扩大，但公开证据仍无法清晰区分 Nord 的独立价值与联合集团历史。
        - 支持继续尽调，并在最近披露的联合参考价附近或以下、按价格纪律入场，而不是支付溢价。
        - 与当前证据最相符：确有增长，但估值支撑不完整。
        - 私募轮条款隐含的估值高于公开记录能够支持的水平。
      - - 悲观
        - 消费者 VPN 集中度持续，产品多元化令人失望，或债务融资支持的股东回报跑在去杠杆前面。
        - 这将支持相对最近披露的联合参考价打折，并提高回报被压缩或未来下轮融资的风险。
        - Fitch 对多元化和财务政策的明确担忧，已经出现在公开证据中。
        - 续约质量走弱、增长放缓或资产负债表被进一步抽取。
    notes: 情景区间均相对于最近披露的 $3B 联合估值表述，因为在指定证据池中，没有公开验证过当前 Nord Security 的独立股权估值。
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV007
      - CV009
