      - number: '2.2'
        title: 规模视角、规模代理指标与未获支持之处
        blocks:
          - type: paragraph
            body: >-
              指定证据不足以支撑传统 TAM／SAM／SOM 结构，因此更稳妥的规模方法是锚定已观察到的规模代理指标，并明确保留缺失项。Fitch 2025 年评级报告称 Nord Security 在 130 个国家服务超过
              15m 客户，并假设 2024 至 2027 年有机收入 CAGR 为 19%，依据是定价能力、积极的市场基本面和产品发布。Datarails 2024 年对 CFO
              的访谈补充了历史牵引力指标：公司直到收入已经超过 $100 million 后才进行首轮机构融资。这些数据支持一个规模大且仍在增长的机会，但不能替代外部类别支出模型，也不能替代消费者 VPN
              订阅与企业安全收入的披露拆分。
