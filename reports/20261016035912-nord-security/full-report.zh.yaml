      - number: '4.3'
        title: 流动性看起来够用，但杠杆和披露仍限制信心
        blocks:
          - type: paragraph
            body: >-
              最有力的当前融资证据来自 Fitch 的定期贷款评级。Fitch 称 Nord 2024 年末拥有 $128 million 现金，预计年度现金余额维持在 $100 million 以上，并假设新增 USD550
              million 定期贷款后仍有一笔未提取的 $100 million
              循环信贷可用。这让公司拥有可见流动性；但同一报告称募债用于股东分配和费用，并明确因产品多元化仍有限、财务政策比单纯去杠杆故事更激进而限制评级。综合而言，公开记录支持这样一个判断：在基准情景下，Nord
              能够为增长和偿债提供资金；但在没有经审计收入结构、当前现金消耗、契约细节以及企业客户留存和利润率数据之前，尚不足以形成高置信度的投资判断。
