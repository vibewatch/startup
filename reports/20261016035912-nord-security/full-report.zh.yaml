        title: 产品组合范围与用户任务
        blocks:
          - type: paragraph
            body: >-
              如今的产品面更像组合战略，而不是单点 VPN 产品。Nord Security 控制的发布和独立目录持续显示，NordVPN、NordPass、NordLocker 和 NordLayer
              是核心套件；NordStellar、NordProtect 和 Saily
              等新产品则把买方对话从隐私扩展到身份、企业访问和外部暴露监控。用户工作流因此覆盖多个不同任务：消费者隐私、凭证管理、加密文件处理、企业网络访问和安全姿态监控。产品图谱足以支撑组合销售和从单点切入再扩张，但公开记录对产品广度的证明，远强于对各产品部署深度或实际客户成果的证明。
