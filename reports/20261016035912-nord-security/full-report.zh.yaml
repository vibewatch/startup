  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              留存资料支持将 Nord Security 的市场定义为覆盖消费者订阅和部分企业安全流程的隐私与网络安全组合，而不是单一用途 VPN 厂商。Invest Lithuania 描述了不断壮大的 B2C 和 B2B
              产品生态，包括 NordVPN、NordPass、NordLocker、NordLayer、NordStellar、NordProtect 和 Saily；2021 年 Atlas VPN
              公告则显示管理层借助收购，把漏斗扩展到免费增值和发展中市场用户。Euronomy 提供了另一种定位视角：它把 NordVPN
              描述为欧洲打造、隐私优先的美国及离岸产品替代者，因此信任和司法管辖区与功能、价格一样，都是替代选择的一部分。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
