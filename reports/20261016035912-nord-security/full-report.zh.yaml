        title: Nord 按买方任务的定位
        blocks:
          - type: paragraph
            body: >-
              Nord 最强的公开定位仍始于消费级 VPN：Fitch 称其为全球领先者，并强调 NordVPN 以及性价比 Surfshark 产品线的品牌认知。但同一组资料也说明管理层为何要超越这一基础：Preqin 称
              2022 年融资用于扩大企业版图，Nord 的 B2B 招聘页称业务为企业打造产品，现有包装覆盖消费者订阅和按用户计费的 NordLayer 价格。Atlas VPN
              提供免费增值入口，可以扩大漏斗；但这里的公开记录更清楚地展示了产品组合扩张，而非持续的企业份额获取。
