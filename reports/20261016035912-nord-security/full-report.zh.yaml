      - number: '3.3'
        title: 韧性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个真实但并非不可攻破的护城河。Fitch 称其拥有立陶宛软件开发和较低成本有机获客渠道带来的成本优势，这有助于 Nord 在多个消费安全类别持续做组合销售。但 Fitch
              也指出产品多元化有限、留存率低于传统企业软件；IT GOAT 则表示 Nord 无法替代终端、邮件、备份或所有专业化平台。综合来看，Nord 能守住消费者隐私组合和部分 SMB／中端市场访问场景；但在 Nord
              发布更强的 NordLayer、NordPass Business 赢单、续费和部署证据前，大型企业安全预算仍可能偏向更广的平台或多供应商架构。
            claimRefs:
              - CP010
              - CP011
              - CP012
