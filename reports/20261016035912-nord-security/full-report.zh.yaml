          label: 覆盖访问、身份、隐私、文件和暴露面的产品组合交叉销售
        - id: freemium-funnel
          label: Atlas VPN 免费增值获客漏斗
        - id: billings
          label: 订阅账单与数字支付收款
        - id: customer-advances
          label: 客户预付款与预收款
        - id: recurring-revenue
          label: 确认的经常性收入
        - id: gross-profit-cash
          label: 可用于增长和偿债的毛利与自由现金流
      edges:
        - from: consumer-subscriptions
          to: billings
        - from: business-products
          to: billings
        - from: multi-product-suite
          to: billings
        - from: freemium-funnel
          to: billings
        - from: billings
          to: customer-advances
        - from: billings
          to: recurring-revenue
        - from: customer-advances
          to: gross-profit-cash
        - from: recurring-revenue
          to: gross-profit-cash
    approximationNotes: 本图只展示有证据支持的商业流转；由于指定证据未披露相关数值，不对转化率、附加销售、利润率或业务组合进行量化。
    claimRefs:
      - CI001
      - CI011
      - CI013
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据支持一个分层套件：包含面向客户的产品、共享服务和现代云软件栈。
    data:
      layers:
        - label: 消费者隐私层
          detail: 核心 VPN 品牌仍是公开证据中覆盖最广的支点
          items:
            - NordVPN
            - Surfshark
        - label: 身份与文件层
          detail: 相邻的凭据和安全存储产品
          items:
            - NordPass
            - NordLocker
        - label: 企业访问层
          detail: 当前招聘和合作伙伴材料强调 B2B 工作流
          items:
            - NordLayer
        - label: 新兴相邻层
          detail: 监控、保护和旅行扩展拓宽了产品版图
          items:
            - NordStellar
            - NordProtect
            - Saily
        - label: 共享套件服务
          detail: 产品之间共享产品、工程和数据协作
          modules:
            - 套件共用的微服务
            - 套装打包与产品组合交叉销售
            - 产品 / 工程 / 销售 / 市场 / 数据协同
        - label: 交付平台
          detail: 当前 B2B 招聘中列出的工程技术栈
          modules:
            - PHP
            - Go
            - MySQL
            - Redis
            - RabbitMQ
            - Docker
            - AWS
          outputs:
            - CI/CD
            - 单元测试
            - 集成测试
    approximationNotes: 本图总结公开可见的架构信号，不是逐产品系统图。
    claimRefs:
      - CE004
      - CE005
      - CE006
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Nord 的公开客户旅程从大规模消费者 VPN 需求开始，延伸到套装扩张和证据较少的企业采用。
    data:
      items:
        - label: 消费者隐私入口
          actor: 个人订阅者
          channel: 以 NordVPN 为主导的自助获客
          touchpoints:
            - 15m 以上客户，覆盖 130 个国家
            - 消费者规模仍是最清晰的公开证据
          tone: positive
        - label: 套装驱动的产品扩张
          actor: 现有消费者客户
          channel: 订阅套装
          touchpoints:
            - Fitch 称 NordVPN 和 Surfshark 主要以套装形式销售
            - 产品组合覆盖隐私、身份和威胁防护等 10 多种产品
          tone: opportunity
        - label: 续约经济性
          actor: 订阅客户
          channel: 预付月付、一年期和两年期方案
          touchpoints:
            - Fitch 引用的留存率超过 80%
            - 用户留存率超过 75%，订阅账单的 97% 与期限方案相关
          tone: positive
        - label: 企业使用场景扩张
          actor: IT 或安全管理员
          channel: 访问、密码、浏览器、文件、VPN 和暴露面控制
          touchpoints:
            - IT Goat 将 Nord Security 定位在以工作为核心的安全品类
            - CybersecTools 也把 Nord 定位为同时服务消费者和企业
          tone: opportunity
        - label: 具名客户证据
          actor: 尽调审阅者
          channel: 公司选定的客户参考
          touchpoints:
            - Calendly、Adobe 和 Vinted 被公开列为企业客户
            - 指定来源池未披露席位数量或经验证的结果
          tone: risk
        - label: 集中度观察点
          actor: 投资者
          channel: 独立信用分析
          touchpoints:
            - Fitch 称评级受产品多元化有限所制约
            - 公开证据对产品组合留存的支持强于对企业账户深度的支持
          tone: risk
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
      - CU013
      - CU014
      - CU015
  - id: FR001
    title: 风险热力图：影响、可能性与缓释成熟度
    type: matrix
    summary: 财务政策和产品集中度获得最强的独立支持，而监管和运营风险的可能性仍不确定。
    data:
      columns:
        - label: 可能性
          detail: 基于留存证据的序数评估；没有频率记录时标为未知。
        - label: 影响
          detail: 对信用质量、运营或信任的潜在影响。
        - label: 缓释成熟度
          detail: 有公开证据支持的控制成熟度，不是控制有效性审计。
      rows:
        - label: 财务政策与杠杆
          note: Fitch 提供数值阈值和预测。
          values:
            - value: High
              tone: negative
            - value: High
              tone: negative
            - value: Developing
              tone: warning
        - label: 产品与消费者集中度
          note: Fitch 因多元化有限而限制评级。
          values:
            - value: Medium-high
              tone: warning
            - value: High
              tone: negative
            - value: Developing
              tone: warning
        - label: 订阅者经济性
          note: 留存支持这一判断，但缺少客户群组和 CAC 证据。
          values:
            - value: Medium
              tone: warning
            - value: High
              tone: negative
            - value: Partial
              tone: warning
        - label: 云与微服务运营
          note: 一则岗位招聘信息不能替代架构或事故审计。
          values:
            - value: Unknown
              tone: neutral
            - value: High
              tone: negative
            - value: Unknown
              tone: neutral
        - label: 产品组合整合
          note: Atlas 治理承诺由公司发布。
          values:
            - value: Medium
              tone: warning
            - value: Medium
              tone: warning
            - value: Partial
              tone: warning
        - label: 监管与事故可见度
          note: 指定来源中没有主要监管机构或完整事故记录。
          values:
            - value: Unknown
              tone: neutral
            - value: High
              tone: negative
            - value: Unknown
              tone: neutral
    approximationNotes: 序数标签是分析分类，不是测得的概率；未知值不会被刻意换算成低风险。
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR012
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 强劲的规模和经常性经济性被杠杆与当前价格支撑不足所抵消，因此建议继续研究。
    data:
      nodes:
        - id: scale
          label: 品类规模已获证明
          note: 15m 以上客户覆盖 130 个国家；二手的当前简介称有 20M+ 受保护用户和 25K+ 企业。
          claimRefs:
            - CV008
            - CV014
        - id: economics
          label: 经常性模式具吸引力
          note: Fitch 预计截至 2027 年 CAGR 为 19%，EBITDA 利润率将从 2025 年约 11% 提升至 2029 年的 16.5%。
          claimRefs:
            - CV006
        - id: breadth
          label: 平台相邻能力存在
          note: Atlas VPN、NordLayer 招聘和合作伙伴定位，显示其安全业务野心超出单一 VPN 产品。
          claimRefs:
            - CV010
            - CV012
            - CV013
        - id: overhang
          label: 资本结构形成上方压力
          note: Fitch 称规模、多元化和财务政策限制评级；2025 年定期贷款用于股东分配。
          claimRefs:
            - CV007
        - id: price
          label: 当前价格支撑不完整
          note: 最近披露的估值是 2023 年 Nord / Surfshark 联合估值；一级、二级和当前独立价值之间的拆分尚未验证。
          claimRefs:
            - CV002
            - CV003
        - id: decision
          label: 推荐 = 继续研究
          note: 继续尽调，但在把买入纳入投资判断前，要求更新后的独立财务、资本表和业务分部证据。
          claimRefs:
            - CV003
            - CV006
            - CV007
      edges:
        - from: scale
          to: economics
          label: 规模有助于解释经常性现金生成潜力。
          claimRefs:
            - CV008
        - from: economics
          to: breadth
          label: 如果相邻产品确有实质规模，增长和利润率上行空间更值得重视。
          claimRefs:
            - CV006
            - CV012
        - from: breadth
          to: overhang
          label: 广度有助于论点成立，但不能消除杠杆和政策风险。
          claimRefs:
            - CV007
            - CV012
        - from: overhang
          to: price
          label: 债务与分配条款提高了愿意支付溢价的门槛。
          claimRefs:
            - CV007
        - from: price
          to: decision
          label: 当前估值支撑不完整，使推荐维持在继续研究。
          claimRefs:
            - CV003
