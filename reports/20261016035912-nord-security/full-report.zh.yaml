  - id: TP001
    title: 竞争替代品概况表
    columns:
      - 竞争者 / 替代品
      - 类别
      - 规模 / 融资信号
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Nord Security 套件
        - 多产品隐私与访问平台
        - 2023 年投后估值 $3B；130 个国家拥有 15M 客户
        - 消费者及企业买方
        - 捆绑 VPN、密码、存储、网络访问和 VPN 工具
        - 不能替代终端、电子邮件、备份或所有专门的安全平台
      - - Surfshark
        - 消费级 VPN / 高性价比产品线
        - 2022 年与 Nord 合并；合并后公司 2023 年员工超过 2,000 人
        - 个人 VPN 买方
        - Fitch 称，与 NordVPN 捆绑后，该高性价比 VPN 产品线能改善交叉销售
        - 仍围绕整体个人 VPN 市场，而不是完整企业技术栈
      - - Atlas VPN
        - 免费增值 VPN
        - 截至 2021 年收购公告，全球用户超过 6M
        - 免费增值及发展中市场的 VPN 用户
        - 在保留独立运营团队的同时，为 Nord 提供更低价入口
        - 交易条款未披露；证据未显示企业市场进展
      - - 密码管理平台
        - 替代品类别
        - 指定材料池未量化
