            body: >-
              财务政策和业务集中度排在风险首位，因为 Fitch 将它们与 BB 发行人评级、USD550 million 第一顺位定期贷款和明确的降级敏感因素相联系。Fitch 按其定义的 2025 年 EBITDA
              USD108 million 计算出 5.1x 杠杆，并预计去杠杆，而不是称其已经完成；持续高于 3.0x
              是其负面触发因素之一。同一分析还将产品多元化有限和技术颠覆列为约束。订阅留存和现金生成可以缓解这些风险，但现有利润率和自由现金流数字是 Fitch
              的预测，并非本证据集提供的经审计结果。因此，热力图把杠杆和集中度列为高优先级风险；在缺少一手证据处，监管透明度不评分。
