  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式是经常性、预付式，且不止一个 VPN SKU
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开收入信号来自 Fitch 2025 年信用分析：Nord Security 是预付订阅业务，月度、一年期和两年期方案占订阅开票额的 97%，留存率超过
              80%。因此，公司先收钱后交付，收入基础比一次性软件销售更可重复。公开材料也显示，公司变现的不只是消费级 VPN：Nord、Surfshark
              和合作伙伴材料都把组合描述为涵盖隐私、身份、访问、密码、文件和暴露管理产品；Nord 招聘页还明确提到一支为企业构建网络安全产品的 B2B
              团队。不过，指定证据没有披露消费者订阅、企业合同、组合销售和免费增值获客漏斗各自贡献多少收入。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
              - CI014
              - CI015
