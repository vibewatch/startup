  - id: TM001
    title: 市场定义表
    columns:
      - 分部／类别
      - 纳入支出
      - 排除支出
      - 买方／付款方
      - 相关性
    rows:
      - - 消费者隐私订阅
        - 以订阅形式销售的 VPN、密码管理、加密存储和隐私附加产品。
        - 留存组合证据之外的终端、邮件、备份和广泛企业网络安全平台。
        - 个人或家庭买方、用户和付款方通常是同一账户。
        - 核心需求引擎，也是 Nord Security 建立品牌规模的基础。
      - - 企业访问与身份安全
        - 面向团队的安全访问、密码共享、浏览器防护、文件防护和暴露监控。
        - 完整 SOC、终端、备份或所有专业化企业安全类别。
        - 安全、IT 或运营管理员购买；公司预算付款；员工使用控制措施。
        - 构成与估值倍数扩张相关的企业邻接业务。
      - - 免费增值与发展中市场获客漏斗
        - 类似 Atlas VPN 的免费或低价隐私入口，扩大漏斗顶部触达。
        - 证据不足以支持将其视为完整业务或当前独立收入。
        - 终端用户先采用；变现路径取决于后续转化或交叉销售。
        - 这说明 Nord Security 已将业务扩展到高端 VPN 订阅之外。
      - - 地理 / 信任定位
        - 欧洲构建、隐私优先的定位，是产品选择的一部分。
        - 留存证据不足以支持按国家计算市场份额。
        - 买方会把司法辖区和信任，与功能、价格一起权衡。
        - 有助于解释其为何能替代美国及离岸隐私工具。
      - - 现状与单点工具替代品
        - 现有密码管理器、消费级 VPN、SASE 工具、暗网监测和内部管理。
        - 除非 Nord 产品将其替代或整合，否则这部分支出仍在 Nord Security 的服务市场之外。
        - 个人用户、IT 管理员和安全团队可以继续使用现有工具，或推迟整合。
        - 这使切换成本、捆绑价值和信任证明成为采用的核心，而不能假定整个品类支出都可触达。
    notes: 边界逻辑综合自留存的产品、渠道和定位证据；除非留存源文本明确点名，被排除的品类均不在范围内。
