chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、范围与公开规模指标
        blocks:
          - type: paragraph
            body: >-
              留存的当前证据足以确定基本身份：Fitch 将 Nord Security 描述为一家总部位于立陶宛、专注隐私、身份和威胁防护的网络安全服务商；公司自身呈现的则是更宽的数字安全套件，而非单一产品的 VPN
              厂商。官网目前营销消费者隐私、密码管理、存储、企业访问、浏览器和身份产品，合作伙伴定位页也强化了这一广度。Fitch
              确认其立陶宛基地，但留存证据未说明当前法定总部城市或注册母公司。公开规模指标方向上很强，却并非完全可比：首页列出 20M+ 受保护用户、25K+ 覆盖企业和 2000+ 员工；Fitch 2025 年报告则称其在
              130 个国家拥有超过 15m 客户，预付订阅模式下留存率超过 80%。这些数字和 2023
              年成长型股权融资支持将其归为成长阶段私营公司，但“受保护用户”“客户”和披露的企业覆盖量定义不同，后续章节不能未经限定地压成一个 headline 指标。
            claimRefs:
