      - number: '1.2'
        title: 创始人、领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              Nord Security 当前的公开领导层仍由创始人主导、职能覆盖面较广，但从治理尽调角度看仍不完整。官网关于页面列出 Tomas Okmanas、Eimantas Sabaliauskas 和 Jonas
              Karklys 为联合创始人，并列出 Laurynas Zabulis 为 CFO、Dina Lurje
              为总法律顾问兼公共政策负责人。后续融资、监管和产品扩张判断似乎都要经过这支相对集中的运营班底，因此这一点很重要。Datarails 对 Zabulis
              的介绍显示，外部资本进入后财务职能更趋机构化；但这里留存的公开材料仍未披露最新董事会名单、股权分配或否决权。就尽调而言，公开记录足以识别关键人物和职能负责人，却不足以评估治理韧性或创始人控制动态。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: 融资历史、估值标记与利益相关方重要性
        blocks:
          - type: paragraph
            body: >-
              公开融资证据显示，Nord Security 在做到相当规模后才引入机构资本，随后叠加成长股权和杠杆。Datarails 访谈称，公司首轮外部融资为 $100 million，当时收入已经超过 $100
              million。Surfshark 2023 年公告称 Warburg Pincus 又投入 $100 million，并表示估值从 $1.6 billion 翻倍至 $3 billion。Fitch
              还记录了后续信用拐点：Nord Security 进入 2025 年时拥有 USD128 million 现金且没有杠杆，之后取得 USD550 million 定期贷款，用于股东分配和费用；Fitch
              明确将这一政策选择视为评级约束。综合来看，这些来源说明公司规模不小，也说明资本结构尽调不能停留在 headline 估值：公开记录对股东权利、董事会影响力、债务契约和任何二级流动性经济安排仍交代不足。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO009
              - CO010
              - CO013
              - CO014
      - number: '1.4'
        title: 里程碑、组合扩张与负面信号
        blocks:
          - type: paragraph
            body: >-
              Nord Security 自身时间线显示，产品和平台持续扩张：从 2012 年推出 NordVPN，到 2019 年多产品扩张、2022 年独角兽融资、2023 年后续融资、2024 年推出
              NordStellar 和 Saily，以及 2026 年推出 NordLayer Browser 和 HangUp。这一节奏支持“战略版图变宽”，而不是静态 VPN 故事。但负面记录同样重要：ZDNet
              质疑立陶宛／巴拿马／塞浦路斯法律结构能否完全隔离用户数据与法律取证，并报道 Nord Security
              披露过早期安全漏洞，之后采取补救措施并推出漏洞赏金计划。这些问题不否定增长故事，但意味着后续判断应检验法律结构、隐私姿态和运营控制，不能只看品牌强度或发布速度。
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
