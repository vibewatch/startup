figures:
  - id: "FR001"
    title: "Risk heatmap: impact, likelihood, and mitigation maturity"
    type: "matrix"
    summary: >-
      Financial policy and product concentration have the strongest independent
      support, while regulatory and operational likelihoods remain uncertain.
    data:
      columns:
        - label: "Likelihood"
          detail: "Ordinal assessment from retained evidence; unknown where no frequency record exists."
        - label: "Impact"
          detail: "Potential effect on credit quality, operations, or trust."
        - label: "Mitigation maturity"
          detail: "Publicly evidenced control maturity, not a control-effectiveness audit."
      rows:
        - label: "Financial policy and leverage"
          note: "Fitch supplies numeric thresholds and forecasts."
          values:
            - value: "High"
              tone: "negative"
            - value: "High"
              tone: "negative"
            - value: "Developing"
              tone: "warning"
        - label: "Product and consumer concentration"
          note: "Fitch constrains the rating for limited diversification."
          values:
            - value: "Medium-high"
              tone: "warning"
            - value: "High"
              tone: "negative"
            - value: "Developing"
              tone: "warning"
        - label: "Subscriber economics"
          note: "Retention supports the case, but cohort and CAC evidence is missing."
          values:
            - value: "Medium"
              tone: "warning"
            - value: "High"
              tone: "negative"
            - value: "Partial"
              tone: "warning"
        - label: "Cloud and microservices operations"
          note: "A role posting is not an architecture or incident audit."
          values:
            - value: "Unknown"
              tone: "neutral"
            - value: "High"
              tone: "negative"
            - value: "Unknown"
              tone: "neutral"
        - label: "Portfolio integration"
          note: "Atlas governance commitments are company-issued."
          values:
            - value: "Medium"
              tone: "warning"
            - value: "Medium"
              tone: "warning"
            - value: "Partial"
              tone: "warning"
        - label: "Regulatory and incident visibility"
          note: "No primary regulator or complete incident record was assigned."
          values:
            - value: "Unknown"
              tone: "neutral"
            - value: "High"
              tone: "negative"
            - value: "Unknown"
              tone: "neutral"
    approximationNotes: >-
      Ordinal labels are analytical classifications, not measured probabilities;
      unknown values are intentionally not converted to low risk.
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR012
