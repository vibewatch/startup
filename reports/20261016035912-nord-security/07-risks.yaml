        - "Debt funding, distributions, and strategic flexibility"
        - "USD550 million first-lien term loan; lender detail is not in the assigned evidence."
        - "Additional distributions or weak performance delay deleveraging and pressure the BB rating."
        - "Strong forecast cash generation and a USD100 million revolving facility assumed undrawn by Fitch."
        - "High until executed documents and a board-approved distribution policy are reviewed."
      - - 2
        - "Acquired-brand integration and governance"
        - "Atlas VPN and other portfolio teams"
        - "Portfolio expansion and operating execution"
        - "Transaction terms were undisclosed; the release said Atlas would operate independently day to day."
        - "Control fragmentation, duplicated systems, or inconsistent audit remediation across brands."
        - "The acquisition release required Atlas to follow transparency principles and regular third-party audits."
        - "Medium; audit scope, findings, ownership, and integration milestones are not public in this pool."
      - - 3
        - "Adjacent security-control coverage"
        - "Endpoint, email, backup, and specialist-platform providers"
        - "Controls outside Nord Security's stated suite coverage"
        - "Not quantified."
        - "Customers assume the suite replaces controls that a partner listing says remain outside its coverage."
        - "Position the suite as one layer and validate integrations and shared-responsibility boundaries."
        - "Medium-high until dependency mapping, attach rates, and integration testing are verified."
    notes: >-
      Partial dependency map based on credit analysis, a company-issued acquisition
