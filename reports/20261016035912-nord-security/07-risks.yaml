company:
  name: "Nord Security"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    The clearest evidenced risk is financial policy: Fitch says a USD550 million
    term loan funds a shareholder distribution and constrains Nord Security's
    rating alongside limited product diversification. Operating scale and
    recurring subscriptions provide mitigants, but public evidence does not close
    regulatory, incident-history, architecture, covenant, or concentration gaps.
sections:
  - id: "ranked-risk-posture"
    title: "Ranked risk posture"
    body: >-
      Financial policy and business concentration lead the risk ranking because
      Fitch ties them to a BB issuer rating, a USD550 million first-lien term loan,
      and explicit downgrade sensitivities. Fitch calculates 5.1x leverage on
      Fitch-defined 2025 EBITDA of USD108 million and expects deleveraging rather
      than reporting it as achieved; a sustained ratio above 3.0x is one of its
      negative triggers. The same analysis identifies limited product
      diversification and technology disruption as constraints. Subscription
      retention and cash generation mitigate those exposures, but the available
      margin and free-cash-flow figures are Fitch forecasts, not audited results
      supplied in this evidence set. The heatmap therefore treats leverage and
      concentration as high-priority risks and leaves regulatory visibility
      unscored where primary evidence is absent.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR007
      - CR008
    figureRefs:
      - FR001
  - id: "regulatory-and-legal-exposure"
    title: "Regulatory and legal exposure"
    body: >-
      The assigned evidence supports a financing-contract risk and one narrow
      candidate-data practice, but it does not contain a regulator decision,
      court record, data-protection authority finding, license inventory, or
      complete incident register. Fitch reports a global customer footprint
      spanning 130 countries, which increases the number of potentially relevant
      legal regimes without identifying a specific violation. Nord Security's
      recruitment page says an AI-assisted review tool may be used, that a
      recruiter ultimately reviews every application, and that candidates may
      opt out; those are disclosed controls, not proof of full compliance. The
      absence of an enforcement or incident record in this bounded pool is not
      evidence that none exists. Primary legal diligence remains necessary before
      reducing residual exposure.
    claimRefs:
      - CR002
      - CR004
      - CR006
      - CR016
    tableRefs:
      - TR001
  - id: "operational-and-security-exposure"
    title: "Operational, quality, and security exposure"
    body: >-
      Consumer-subscription economics create both resilience and sensitivity.
      Fitch reports that monthly, one-year, and two-year plans represent 97% of
      subscription billings and describes an over-80% retention rate, while also
      warning that consumer cybersecurity retention is below traditional
      enterprise software. A Nord B2B engineering posting describes cross-suite
      microservices and lists AWS plus several database, queue, container, and
      application technologies for that role. This is evidence of role-level
      complexity, not a complete production architecture or proof of an outage.
      The operating risk cannot be quantified without service-level history,
      incident severity, recovery tests, vendor concentration, and control-audit
      results. Management should be tested against those records rather than
      marketing descriptions.
    claimRefs:
      - CR005
      - CR007
      - CR015
    tableRefs:
      - TR002
  - id: "dependencies-mitigation-and-kill-criteria"
    title: "Dependencies, mitigations, and thesis-break triggers"
    body: >-
      Public evidence shows mitigation work but uneven maturity. The CFO described
      upgrading enterprise resource planning, reporting, expense, and treasury
      systems while a procure-to-pay system was still being implemented; this
      indicates progress after acknowledged data-readiness weaknesses. The Atlas
      VPN acquisition release required third-party audits but also said the team
      would continue to operate independently and did not disclose transaction
      terms. A partner listing further states that Nord Security does not replace
      endpoint, email, backup, or every specialized security platform, leaving
      customers dependent on adjacent controls. Investment kill criteria should
      include sustained Fitch-defined leverage above 3.0x, interest coverage below
      5.0x, organic growth near or below mid-single digits, a material unremediated
      incident, or evidence that integration and control testing cannot keep pace
      with portfolio expansion.
    claimRefs:
      - CR004
      - CR009
      - CR010
      - CR012
      - CR013
      - CR014
    tableRefs:
      - TR003
