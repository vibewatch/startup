  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: architecture
      missingEvidence: Current product-by-product architecture diagrams, service-boundary definitions, and integration documentation for NordVPN, NordPass, NordLayer, and adjacent products.
      whyItMatters: Public hiring copy shows stack choices but not how the systems actually interoperate, fail over, or isolate incidents across brands.
      diligencePath: Request current technical architecture packs, platform ownership maps, and integration diagrams from product and engineering leadership.
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Primary trust-center, certification, audit, uptime, and incident-response disclosures covering the current core suite.
      whyItMatters: Product underwriting for a cybersecurity vendor requires more than brand-level marketing or secondary review summaries.
      diligencePath: Obtain SOC or ISO scope summaries, independent audit attestations, incident history, and status/SLA materials for each major product.
    - type: missing-source
      severity: material
      topic: b2b-maturity
      missingEvidence: Named enterprise deployment references, integration case studies, and renewal evidence for NordLayer and other business-oriented products.
      whyItMatters: The public record supports B2B intent and positioning but not enough customer-proof to underwrite enterprise product maturity.
      diligencePath: Request reference calls, customer case studies with measurable outcomes, and product-level deployment counts by segment.
