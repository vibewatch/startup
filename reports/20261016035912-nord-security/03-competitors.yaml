  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: enterprise-head-to-head-proof
      missingEvidence: Named enterprise win-loss, renewal, or deployment evidence showing NordLayer or NordPass Business displacing broader enterprise security incumbents.
      whyItMatters: Without customer-level proof, the public record shows strategic intent and packaging, but not durable enterprise differentiation or renewal strength.
      diligencePath: Request named customer references, renewal cohorts, and redacted competitive bake-off or RFP outcomes for NordLayer and NordPass Business.
      relatedQuestionRefs:
        - QP008
    - type: missing-source
      severity: material
      topic: realized-pricing-and-discounts
      missingEvidence: Realized enterprise pricing, discount bands, contract length, and upsell data for NordLayer and business versions of NordPass.
      whyItMatters: List pricing is enough to frame packaging, but not enough to judge pricing power or whether Nord can hold margin against broader enterprise platforms.
      diligencePath: Request cohort pricing by contract term, average discounts, and renewal uplift data; compare against a current pipeline or renewal dashboard.
      relatedTableRefs:
        - TP003
