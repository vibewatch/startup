  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offering / class
      - Price / unit / contract model
      - Included capabilities
      - Competitive read-through
      - Unknowns / caution
    rows:
      - - NordVPN
        - INR 909 per month
        - Consumer VPN privacy and traffic protection
        - Maintains a mass-market anchor in the personal VPN segment
        - Realized pricing, retention by plan, and discounting are not public in the assigned pool
      - - NordPass
        - INR 379 per month
        - Password management
        - Lets Nord compete inside a password-only buying motion
        - Enterprise adoption and realized seat pricing are not public in the assigned pool
      - - NordLocker
        - INR 249 per month with 500 GB storage
        - Encrypted file storage and sharing
        - Extends the bundle beyond VPN and credential management
        - Attach rate and enterprise usage are not public in the assigned pool
      - - NordLayer
        - USD 11 per user per month
        - Network access security
        - Shows Nord can sell on a business per-seat basis, not only via consumer subscriptions
        - Contract length, volume discounts, and renewal evidence are not public in the assigned pool
      - - Atlas VPN
        - Freemium; transaction terms undisclosed
        - Free VPN with an independent team inside Nord's structure
        - Gives Nord a lower-price or no-price entry point versus paid-only VPN competitors
        - Public monetization detail is absent from the assigned pool
      - - SASE / zero-trust class
        - Pricing not evidenced in assigned pool
        - Network, web, and application access
        - Competes on broader control and administration rather than consumer-style packaging
        - No head-to-head price card is available in the assigned pool
    notes: Only Nord family list pricing is disclosed in the assigned pool; competitor-class rows preserve the lack of public price comparability instead of guessing.
