          claimRefs:
            - CP007
        - label: Password-management platforms
          x: 2
          y: 2
          detail: Strong on credentials, but limited on network or external-threat coverage.
          claimRefs:
            - CP008
        - label: Nord Security suite
          x: 4
          y: 3
          detail: Broader suite across VPN, passwords, files, access, and external exposure, but still not a full replacement for every security layer.
          claimRefs:
            - CP002
            - CP007
            - CP012
        - label: SASE / zero-trust
          x: 5
          y: 5
          detail: Broadest access-control scope in the assigned pool, but with heavier deployment and administration.
          claimRefs:
            - CP009
    approximationNotes: Axes are evidence-backed ordinal scores, not sourced market-share, satisfaction, or conversion metrics. The map reflects only explicit capability and administration language in the assigned pool.
