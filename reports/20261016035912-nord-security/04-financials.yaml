company:
  name: Nord Security
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a recurring, prepaid subscription model with broad
    consumer and business product cross-sell, but not a clean segment-by-segment
    underwriting model. Fitch's 2025 credit work suggests workable liquidity and
    improving cash generation after the new term loan, while public revenue mix,
    realized pricing, CAC/payback, and current cash burn remain material gaps.
sections:
  - id: recurring-revenue-model
    title: Revenue model is recurring, prepaid, and broader than a single VPN SKU
    body: >-
      The clearest public revenue signal is Fitch's 2025 credit analysis, which
      describes Nord Security as a prepaid subscription business where monthly,
      one-year, and two-year plans account for 97% of subscription billings and
      retention is above 80%. That matters because it points to cash collection
      ahead of service delivery and a revenue base that is more repeatable than
      one-off software sales. Public materials also show the company is not only
      monetizing a consumer VPN: Nord, Surfshark, and partner materials all frame
      the portfolio as a broader mix of privacy, identity, access, password, file,
      and exposure-management products, while Nord's own careers page explicitly
      describes a B2B team building cybersecurity products for businesses.
      However, the assigned evidence does not disclose how much revenue comes from
      consumer subscriptions versus business contracts, bundles, or freemium
      acquisition funnels.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI013
      - CI014
      - CI015
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: pricing-and-unit-economics
    title: Public pricing and unit-economics evidence is directional, not underwritable
    body: >-
      Nord's public record reveals enough to sketch monetization mechanics but not
      enough to price risk with precision. Datarails' interview with the CFO says
      the company was already above $100 million in revenue when it first raised
      institutional capital and had built digital-payment collection across cards,
      PayPal, app stores, and crypto, which supports a scaled direct-to-consumer
      motion. Fitch adds that brand strength, bundle cross-sell, and the ability
      to cut marketing without a proportional hit to new billings support operating
      leverage. Even so, the assigned pool does not provide current list prices,
      realized net pricing, refund rates, segment gross margins, or product-level
      retention, and the only third-party revenue estimate in the pool is a very
      wide Owler range that is not suitable for underwriting.
    claimRefs:
      - CI004
      - CI005
      - CI010
      - CI011
      - CI012
      - CI016
    tableRefs:
      - TI002
    figureRefs: []
  - id: capital-adequacy-and-verdict
    title: Liquidity looks serviceable, but leverage and disclosure still cap conviction
    body: >-
      The strongest current financing evidence comes from Fitch's term-loan rating.
      Fitch says Nord ended 2024 with $128 million of cash, expects annual cash
      balances to remain above $100 million, and assumes an undrawn $100 million
      revolver remains available after the new USD550 million term loan. That gives
      the company visible liquidity, but the same report says the debt raise funds a
      shareholder distribution and fees, and it explicitly constrains the rating
      because product diversification is still limited and financial policy is more
      aggressive than a simple deleveraging story would imply. Taken together, the
      public record supports a view that Nord can fund growth and debt service in a
      base case, but not a high-conviction underwriting case without audited revenue
      mix, current cash burn, covenant detail, and enterprise-specific retention and
      margin data.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
    tableRefs:
      - TI003
    figureRefs: []
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Revenue quality
      - Diligence ask
    rows:
      - - Consumer subscription base
        - Prepaid monthly, one-year, and two-year subscriptions
        - Subscription billings
        - Fitch says these plans account for 97% of subscription billings
        - High recurrence, but still consumer-oriented and renewal-sensitive
        - Need audited revenue by product, cohort retention, and refund data
      - - Bundle and cross-sell layer
        - Cross-sell across a portfolio of privacy, identity, and threat products
        - Bundle attach / ARPU
        - Fitch cites over 10 products and bundle-led organic growth; no public attach rate
        - Helps retention and monetization breadth if attach is real
        - Need product-level mix and realized bundle discounting
      - - Business security subscriptions
        - B2B cybersecurity products sold to companies
        - Contract / seat / account economics
        - Public evidence confirms the B2B motion exists, but not revenue share
        - Potentially higher-quality contracts than pure consumer subscriptions
        - Need enterprise ARR, ACV, logo count, renewal, and channel mix
      - - Freemium acquisition layer
        - Free-to-paid conversion from Atlas VPN
        - Conversion to paid users
        - Nord said Atlas VPN was freemium, but did not disclose terms or contribution
        - Could widen top-of-funnel, but current economics are opaque
        - Need MAUs, paid conversion, CAC, and cannibalization evidence
    notes: >-
      Public evidence supports mechanisms and status, not segment revenue values;
      unknown cells reflect missing disclosure in the assigned source pool rather than zero activity.
    claimRefs:
      - CI001
      - CI003
      - CI013
      - CI014
      - CI015
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public price or unit
      - Contract model
      - Public signal
      - What remains unknown
    rows:
      - - Consumer subscriptions
        - Not disclosed in assigned evidence
        - Prepaid monthly / 1-year / 2-year plans
        - Fitch says these plans drive 97% of subscription billings
        - List pricing, realized ARPU, refund behavior, and geography mix
      - - Bundle cross-sell
        - Not disclosed
        - Multi-product bundle upsell
        - Fitch cites bundle-led growth across more than 10 products
        - Attach rates, bundle discounts, and margin by bundle
      - - B2B cybersecurity products
        - Not disclosed
        - Subscription-style business products for companies
        - Nord careers page confirms an active B2B product organization
        - Seat metric, contract length, services content, and reseller economics
      - - Atlas VPN freemium
        - Free tier visible; paid economics undisclosed
        - Freemium acquisition and upsell
        - Yahoo/GlobeNewswire says Atlas VPN was a freemium VPN solution
        - Conversion, retention, and current strategic importance
    notes: >-
      This table distinguishes monetization format from realized pricing; the assigned evidence pool did not include live pricing pages or customer contracts.
    claimRefs:
      - CI001
      - CI011
      - CI013
      - CI014
      - CI015
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Retention
        - Over 80% retention; user retention above 75%
        - Medium
        - Supports recurrence and payback durability
        - Need cohort retention by product, geography, and acquisition channel
      - - EBITDA margin path
        - About 11% in 2025E improving to 16.5% by 2029E
        - Medium
        - Shows leverage potential if acquisition efficiency holds
        - Need audited gross margin, opex split, and capitalization policy
      - - FCF margin path
        - About 11.5% of sales in 2025E improving to 20% by 2028E
        - Medium
        - Tests whether growth converts into cash after marketing spend
        - Need historical CFO, capex, taxes, and working-capital detail
      - - Capex intensity
        - Around 0.5% of sales
        - Medium
        - Suggests a software-like capital-intensity profile
        - Need cloud-infrastructure and software-capitalization detail
      - - Liquidity buffer
        - USD128m cash at end-2024 plus USD100m revolver assumed undrawn
        - Medium
        - Indicates runway and debt-service flexibility
        - Need 2025/2026 cash balances, minimum-cash policy, and covenant headroom
      - - Leverage and policy risk
        - 5.1x 2025 leverage projected to 2.9x by 2027; debt funds shareholder distribution and fees
        - Medium
        - A leveraged recap changes the equity story from purely bootstrapped growth
        - Need lender materials, distribution guardrails, and downside cases
    notes: >-
      All numeric unit-economics fields in this table come from Fitch's forward credit assumptions rather than audited management reporting.
    claimRefs:
      - CI002
      - CI004
      - CI005
      - CI006
      - CI007
