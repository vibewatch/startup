callouts:
  - calloutType: insight
    title: Public revenue quality is stronger than public revenue visibility
    body: >-
      Recurrence, prepayment, and retention are all visible in the public record,
      but current segment revenue, realized pricing, and enterprise contract quality
      are not. That makes the revenue model more legible than the actual valuation
      inputs.
    claimRefs:
      - CI001
      - CI002
      - CI016
  - calloutType: risk
    title: The new debt package improves scale but complicates the equity story
    body: >-
      Fitch's rating work supports a serviceable liquidity position, yet the same
      document says the USD550 million term loan funds a shareholder distribution
      and that financial policy remains a rating constraint. That is compatible with
      growth, but it is not the same as self-funded expansion.
    claimRefs:
      - CI006
      - CI007
