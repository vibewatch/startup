evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-scale-metrics
    missingEvidence: Audited FY2025 or TTM revenue, ARR, gross margin, retention, and segment mix.
    whyItMatters: >-
      Headline scale exists, but valuation and quality-of-revenue judgment remain weak without current financial
      disclosures.
    diligencePath: >-
      Request management financial pack and board-approved KPI definitions before using any revenue multiple or
      segment-growth claim.
    relatedQuestionRefs:
      - QO003
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Current board composition, material leadership changes, cap table, investor rights, founder ownership, secondary
      transactions, and term-loan covenant package.
    whyItMatters: >-
      Public sources identify visible stakeholders but do not show who controls downside protections, restricted
      payments, or governance outcomes.
    diligencePath: Obtain charter, shareholder agreements, debt documents, and the latest board/governance schedule in data room.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: legal-headquarters
    missingEvidence: Current registered parent, legal headquarters city, and authoritative operating-location roster.
    whyItMatters: >-
      A Lithuania operating base is well supported, but the legal domicile and headquarters address govern corporate,
      tax, and enforcement diligence.
    diligencePath: >-
      Obtain an official registry extract and current legal-entity chart, then reconcile them to product operating
      entities.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent TAM/SAM/SOM or category-spend estimates that separate consumer VPN/privacy subscriptions from
      business-security adjacencies and explain the methodology.
    whyItMatters: >-
      Without that split, valuation discussions risk overstating category size or assuming enterprise expansion that
      public evidence has not quantified.
    diligencePath: >-
      Obtain a current analyst-market report or management-backed board material that breaks Nord Security's served
      market into consumer and enterprise spend buckets.
    relatedQuestionRefs:
      - QM002
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-gap
    missingEvidence: >-
      Named enterprise customer, procurement, or case-study evidence that shows who signs, pays, and renews NordLayer,
      NordPass Business, or adjacent business-security products.
    whyItMatters: >-
      The market may be attractive, but budget-owner ambiguity makes it hard to judge adoption friction, sales-cycle
      length, and durability of B2B expansion.
    diligencePath: >-
      Collect enterprise case studies, procurement records, or management disclosures that identify buyer persona,
      budget owner, and renewal motion by product line.
    relatedQuestionRefs:
      - QM003
      - QM006
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: enterprise-head-to-head-proof
    missingEvidence: >-
      Named enterprise win-loss, renewal, or deployment evidence showing NordLayer or NordPass Business displacing
      broader enterprise security incumbents.
    whyItMatters: >-
      Without customer-level proof, the public record shows strategic intent and packaging, but not durable enterprise
      differentiation or renewal strength.
    diligencePath: >-
      Request named customer references, renewal cohorts, and redacted competitive bake-off or RFP outcomes for
      NordLayer and NordPass Business.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: realized-pricing-and-discounts
    missingEvidence: >-
      Realized enterprise pricing, discount bands, contract length, and upsell data for NordLayer and business versions
      of NordPass.
    whyItMatters: >-
      List pricing is enough to frame packaging, but not enough to judge pricing power or whether Nord can hold margin
      against broader enterprise platforms.
    diligencePath: >-
      Request cohort pricing by contract term, average discounts, and renewal uplift data; compare against a current
      pipeline or renewal dashboard.
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: segment-revenue-mix
    missingEvidence: Audited consumer versus business revenue mix, bundle attach rates, and product-level realized pricing.
    whyItMatters: >-
      Without segment mix and realized pricing, public evidence cannot support a durable gross-margin or valuation
      multiple view.
    diligencePath: Request management revenue bridges by product, channel, geography, and customer segment for 2024-2026.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, payback, refund rates, gross margin by product, enterprise renewal, and customer concentration data.
    whyItMatters: >-
      Public recurrence signals are not enough to underwrite sales efficiency, contribution margin, or resilience under
      slower growth.
    diligencePath: Request cohort retention, channel CAC, payback, and product P&L detail from finance and growth teams.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: current-liquidity
    missingEvidence: 2025-2026 monthly cash burn, covenant package, shareholder distribution policy, and debt amortization detail.
    whyItMatters: >-
      Fitch's base case supports liquidity, but equity underwriting still depends on downside runway and lender
      constraints.
    diligencePath: Request lender presentation, debt documents, monthly cash bridge, and board-approved capital-allocation plan.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: conflicting-data
    severity: minor
    topic: public-revenue-estimates
    missingEvidence: >-
      A management-certified current revenue run rate or audited financial statements that reconcile historical and
      current scale.
    whyItMatters: >-
      The assigned pool contains one low-quality public estimate and one older management statement, which is
      insufficient for current underwriting.
    diligencePath: Request current audited or management-certified revenue, ARR, and gross margin disclosures.
    relatedQuestionRefs:
      - QI003
  - type: private-evidence-only
    severity: material
    topic: architecture
    missingEvidence: >-
      Current product-by-product architecture diagrams, service-boundary definitions, and integration documentation for
      NordVPN, NordPass, NordLayer, and adjacent products.
    whyItMatters: >-
      Public hiring copy shows stack choices but not how the systems actually interoperate, fail over, or isolate
      incidents across brands.
    diligencePath: >-
      Request current technical architecture packs, platform ownership maps, and integration diagrams from product and
      engineering leadership.
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Primary trust-center, certification, audit, uptime, and incident-response disclosures covering the current core
      suite.
    whyItMatters: >-
      Product underwriting for a cybersecurity vendor requires more than brand-level marketing or secondary review
      summaries.
    diligencePath: >-
      Obtain SOC or ISO scope summaries, independent audit attestations, incident history, and status/SLA materials for
      each major product.
  - type: missing-source
    severity: material
    topic: b2b-maturity
    missingEvidence: >-
      Named enterprise deployment references, integration case studies, and renewal evidence for NordLayer and other
      business-oriented products.
    whyItMatters: >-
      The public record supports B2B intent and positioning but not enough customer-proof to underwrite enterprise
      product maturity.
    diligencePath: >-
      Request reference calls, customer case studies with measurable outcomes, and product-level deployment counts by
      segment.
  - type: missing-source
    severity: material
    topic: enterprise-retention
    missingEvidence: Public GRR, NRR, churn, renewal-rate, or cohort data for NordLayer and NordPass Business.
    whyItMatters: >-
      Without business-only retention disclosure, the durability story rests on portfolio-level subscription metrics
      rather than enterprise-account evidence.
    diligencePath: Request cohort retention, renewal, and seat-expansion data by business SKU from management or a data room.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Independent case studies or customer-authored references for the named business logos.
    whyItMatters: Repeated company-issued logo mentions do not prove deployment depth, production breadth, or realized outcomes.
    diligencePath: >-
      Seek customer-authored talks, procurement records, marketplace references, or direct reference calls for Calendly,
      Adobe, Vinted, and other Nord business accounts.
    relatedQuestionRefs:
      - QU002
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: >-
      Top-customer exposure, channel dependence, and product-level revenue mix between consumer VPN and business
      security.
    whyItMatters: >-
      The biggest unresolved concentration risk is not geographic scale but whether the business stack is materially
      diversifying the consumer VPN core.
    diligencePath: Request revenue mix by product family, top-customer concentration, and partner-channel exposure from management.
    relatedQuestionRefs:
      - QU008
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk
    missingEvidence: >-
      Primary regulator, court, licensing, privacy, sanctions, intellectual-property, and enforcement records for each
      material jurisdiction.
    whyItMatters: >-
      The current legal register is a bounded sample and cannot establish the absence, frequency, or financial impact of
      legal events.
    diligencePath: >-
      Run jurisdiction-by-jurisdiction regulator and court checks, then reconcile findings to management's litigation
      and compliance schedules.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: incidents-outages
    missingEvidence: >-
      A complete three-year register of outages, security incidents, breaches, notifications, root causes, and
      remediation status.
    whyItMatters: >-
      Without event frequency, severity, and recovery data, operational likelihood and residual security exposure cannot
      be quantified.
    diligencePath: >-
      Obtain management's incident register, status-page export, insurer loss runs, customer notices, and independent
      control reports.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: debt-covenants
    missingEvidence: >-
      Executed loan documents, covenant definitions, restricted-payment capacity, hedging, amortisation, and quarterly
      compliance data.
    whyItMatters: >-
      Fitch's rating case cannot establish actual covenant headroom or prevent a more aggressive
      shareholder-distribution policy.
    diligencePath: >-
      Review the credit agreement and compliance certificates and stress the exact covenant EBITDA definition against
      downside cases.
    relatedQuestionRefs:
      - QR002
      - QR004
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: architecture-controls
    missingEvidence: >-
      Production architecture, cloud and vendor concentration, service levels, disaster-recovery tests, penetration
      tests, and audit findings.
    whyItMatters: >-
      A role posting and partner listing identify dependencies but do not prove control design, effectiveness, or
      recovery performance.
    diligencePath: >-
      Conduct architecture and security-control diligence with system diagrams, SLO history, RTO/RPO evidence, vendor
      contracts, and remediation logs.
    relatedQuestionRefs:
      - QR006
      - QR007
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: enterprise-mix
    missingEvidence: Current revenue, margin, and renewal split across consumer VPN, business security, and adjacent products.
    whyItMatters: >-
      Without segment mix, the market cannot tell whether the valuation should be anchored to consumer subscriptions or
      a broader enterprise-security platform story.
    diligencePath: Request current management reporting by product, customer type, gross margin, and renewal performance.
    relatedQuestionRefs:
      - QV007
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Current cap table, liquidation preferences, shareholder rights, and exact economics of the 2022 and 2023 rounds.
    whyItMatters: >-
      Entry price discipline and return modeling depend on dilution, seniority, and whether disclosed rounds included
      meaningful secondary liquidity.
    diligencePath: Obtain the latest financing documents, cap-table summary, and board-approved shareholder rights schedule.
  - type: missing-source
    severity: material
    topic: current-standalone-valuation
    missingEvidence: A current standalone Nord Security equity valuation or financing mark after the 2025 leveraged transaction.
    whyItMatters: >-
      The public record only shows a September 2023 joint valuation anchor, which is too stale and too aggregated to
      support a present-day buy decision.
    diligencePath: Request the latest primary transaction materials, secondary marks, lender decks, or board valuation papers.
  - type: private-evidence-only
    severity: material
    topic: cash-allocation-policy
    missingEvidence: >-
      Management's current policy for debt paydown, acquisitions, and shareholder distributions after the 2025 term
      loan.
    whyItMatters: >-
      Return compression risk depends on whether growth cash is reinvested, used to delever, or extracted by
      shareholders.
    diligencePath: Review current budget, debt documents, and board materials covering capital allocation and covenant headroom.
