  evidenceGaps:
    - type: missing-source
      severity: material
      topic: enterprise-retention
      missingEvidence: Public GRR, NRR, churn, renewal-rate, or cohort data for NordLayer and NordPass Business.
      whyItMatters: Without business-only retention disclosure, the durability story rests on portfolio-level subscription metrics rather than enterprise-account evidence.
      diligencePath: Request cohort retention, renewal, and seat-expansion data by business SKU from management or a data room.
      relatedQuestionRefs: [QU009]
      relatedTableRefs: [TU002]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Independent case studies or customer-authored references for the named business logos.
      whyItMatters: Repeated company-issued logo mentions do not prove deployment depth, production breadth, or realized outcomes.
      diligencePath: Seek customer-authored talks, procurement records, marketplace references, or direct reference calls for Calendly, Adobe, Vinted, and other Nord business accounts.
      relatedQuestionRefs: [QU002, QU009]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer exposure, channel dependence, and product-level revenue mix between consumer VPN and business security.
      whyItMatters: The biggest unresolved concentration risk is not geographic scale but whether the business stack is materially diversifying the consumer VPN core.
      diligencePath: Request revenue mix by product family, top-customer concentration, and partner-channel exposure from management.
      relatedQuestionRefs: [QU008, QU009]
