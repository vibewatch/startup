schemaVersion: report-v2
artifact: customers
slug: nord-security
runDate: 2026-10-16
company:
  name: Nord Security
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports a very large, globally distributed consumer
    subscription base, with Fitch citing more than 15 million customers in 130
    countries and retention above 80%. The business-product expansion story is
    directionally credible because Nord repeatedly names a small set of
    enterprise customers and Fitch highlights bundle-led cross-sell, but the
    public record still lacks independent renewal, seat-count, and concentration
    disclosure for NordLayer or NordPass Business.
sections:
  - id: customer-mix-and-scale
    title: Customer mix is still consumer-heavy, with a documented but thinly quantified business layer
    body: >-
      The strongest customer evidence still points to Nord as a scaled
      consumer-subscription business rather than a transparently disclosed
      enterprise-security vendor. Fitch says Nord served more than 15 million
      customers across 130 countries in 2025, with about 44% of billings from
      North America and about 37% from Europe. Public company-issued sources
      also keep positioning Nord as broader than a single-product VPN company:
      the 2022 and 2023 funding releases say businesses such as Calendly,
      Adobe, Shutterstock, and Vinted use Nord products, CybersecTools describes
      Nord as serving both consumers and businesses, and IT Goat frames the
      stack around business access, passwords, browser activity, files, VPN, and
      external exposure. That mix establishes segment breadth, but not the split
      between consumer revenue and business revenue.
    claimRefs: [CU001, CU002, CU006, CU007, CU008, CU013, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-named-logos
    title: Adoption proof exists, but most named-customer evidence remains issuer-controlled
    body: >-
      Nord can show real adoption signals, but most of them are still company
      selected rather than independently audited. The clearest public proof is
      the repeated official claim that Calendly, Adobe, Shutterstock, and
      Vinted are business customers, plus the 2021 Atlas VPN acquisition
      announcement stating that Atlas already had more than 6 million users
      worldwide. The 2023 funding announcement from Yahoo's GlobeNewswire feed
      and Surfshark's own blog both say the combined group served millions of
      users worldwide, which is consistent with very broad consumer reach.
      However, the public record still does not disclose seat counts,
      implementation depth, reference dates for each named logo, or customer
      outcomes tied to NordLayer, NordPass Business, or other business SKUs.
    claimRefs: [CU006, CU007, CU008, CU009, CU016]
    tableRefs: [TU003]
  - id: durability-expansion-and-concentration
    title: Durability looks solid on subscriptions, while concentration risk sits in product mix opacity
    body: >-
      Independent evidence is better on subscription durability than on named
      enterprise depth. Fitch says Nord generates high recurring revenue with
      retention above 80%, user retention above 75%, and 97% of subscription
      billings tied to monthly, one-year, and two-year plans. Fitch also says
      Nord's more than 10-product portfolio and bundle structure create
      cross-selling opportunities, which supports a land-and-expand narrative
      inside the consumer base and into adjacent identity and access products.
      The main concentration concern is that Fitch still constrains the rating
      for limited product diversification, while public materials do not reveal
      top-customer exposure, partner dependence, GRR, NRR, or business-product
      renewal rates. That means durability is evidenced at the portfolio level
      more clearly than at the enterprise-account level.
    claimRefs: [CU003, CU004, CU005, CU010, CU011, CU012, CU015]
    tableRefs: [TU002]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Mass-market consumer privacy
        - Buyer, user, and payer are mostly the same individual subscriber
        - VPN, identity, and privacy protection
        - Over 15 million customers in 130 countries
        - Core B2C scale engine with global reach
        - No public split by product, cohort, or paid-versus-free mix
      - - Business security admins and employees
        - Buyer is an IT or security admin; users are employees; payer is the employer
        - Secure access, password, browser, file, and exposure management
        - Named businesses include Calendly, Adobe, Shutterstock, and Vinted
        - Expansion vector beyond consumer VPN into work use cases
        - No disclosed account count, seat count, or renewal rate
      - - Freemium and lower-price consumer funnel via Atlas VPN
        - User is a privacy-conscious consumer; monetization mix is not disclosed
        - Entry-level VPN access and reach into developing markets
        - Atlas VPN had over 6 million users at acquisition announcement
        - Broadens top-of-funnel reach and acquisition options
        - Current retained user base and monetization after integration are not disclosed
      - - Cross-brand bundle expansion
        - Buyer is an existing Nord or Surfshark subscriber; user can be a household or small team
        - Upsell from VPN into identity, password, storage, and threat-protection tools
        - Fitch says NordVPN and Surfshark are mostly sold in bundles
        - Supports land-and-expand without needing a new customer logo each time
        - No published attach rates or bundle-penetration data
    notes: >-
      Public segmentation is inferred from cited product descriptions and named
      customer references; Nord does not disclose a clean consumer-versus-business
      revenue split in the assigned source pool.
    claimRefs: [CU001, CU006, CU009, CU011, CU013, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Customer base
        - Over 15 million customers in 130 countries
        - '2025-10-27'
        - Fitch
        - Medium
        - Confirms global consumer scale
        - No split by product, geography, or paid versus free users
      - - Billing geography
        - About 44% North America and about 37% Europe
        - '2025-10-27'
        - Fitch
        - Medium
        - Shows commercial weight is concentrated in resilient developed markets
        - No country-level retention or product-mix breakout
      - - Subscription durability
        - Over 80% retention, user retention above 75%, and 97% of billings from monthly, one-year, and two-year plans
        - '2025-10-27'
        - Fitch
        - Medium
        - Portfolio-level renewal looks stronger than logo evidence alone
        - No public GRR, NRR, churn, or business-only renewal disclosure
      - - Combined-group user reach
        - Millions of users worldwide
        - '2023-09-28'
        - Yahoo / Surfshark
        - High
        - Supports broad adoption after the Surfshark tie-up
        - Active users, overlap, and paid-share definitions are not disclosed
      - - Acquired consumer reach
        - Atlas VPN had over 6 million users worldwide
        - '2021-10-15'
        - Yahoo
        - Medium
        - Indicates Nord used M&A to widen the consumer funnel
        - No post-acquisition retention or conversion data
    notes: >-
      This table mixes customer-count, geography, and retention metrics because
      the assigned pool lacks a single consistent customer cohort series; each
      row preserves its own denominator and scope.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU009, CU016]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Calendly
        - SaaS collaboration business
        - Officially named among businesses trusting Nord products for advanced threat protection
        - Production use is implied, but pilot status is not disclosed
        - Shows Nord can cite a recognizable software customer
        - Only company-issued references; no product SKU, seat count, or outcome metric
      - - Adobe
        - Global software business
        - Officially named among businesses trusting Nord products for advanced threat protection
        - Production use is implied, but pilot status is not disclosed
        - Signals relevance to a large software enterprise buyer
        - Only company-issued references; no timing, deployment depth, or renewal detail
      - - Vinted
        - Marketplace / consumer internet business
        - Officially named among businesses trusting Nord products for advanced threat protection
        - Production use is implied, but pilot status is not disclosed
        - Suggests Nord can win modern digital-native customers
        - Only company-issued references; no independent case study or quantified result
    notes: >-
      Logo proof is partial: the assigned pool repeats three named references
      across Nord's 2022 official funding announcement and a 2023 syndicated
      financing release, but it does not contain independent deployment or
      outcome validation for those logos.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial list limited to the named businesses Nord disclosed in its 2022
        official funding announcement and repeated in the 2023 syndicated
        financing release; no broader customer registry appears in the assigned
        source pool.
    claimRefs: [CU006, CU007, CU008]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Nord's public customer journey starts with large-scale consumer VPN demand
      and extends into bundle expansion and lightly evidenced business adoption.
    data:
      items:
        - label: Consumer privacy entry point
          actor: Individual subscriber
          channel: NordVPN-led self-serve acquisition
          touchpoints:
            - Over 15 million customers in 130 countries
            - Consumer scale remains the clearest public proof point
          tone: positive
        - label: Bundle-led product expansion
          actor: Existing consumer customer
          channel: Subscription bundles
          touchpoints:
            - Fitch says NordVPN and Surfshark are mostly sold in bundles
            - The portfolio spans more than 10 products across privacy, identity, and threat protection
          tone: opportunity
        - label: Renewal economics
          actor: Subscription customer
          channel: Prepaid monthly, one-year, and two-year plans
          touchpoints:
            - Fitch cites over 80% retention
            - User retention above 75% and 97% of subscription billings tied to term plans
          tone: positive
        - label: Business-use-case expansion
          actor: IT or security admin
          channel: Access, password, browser, file, VPN, and exposure controls
          touchpoints:
            - IT Goat frames Nord Security around work-focused security categories
            - CybersecTools also positions Nord as serving both consumers and businesses
          tone: opportunity
        - label: Named-logo proof
          actor: Diligence reviewer
          channel: Company-selected references
          touchpoints:
            - Calendly, Adobe, and Vinted are publicly named as business customers
            - The assigned source pool does not disclose seat counts or verified outcomes
          tone: risk
        - label: Concentration watchpoint
          actor: Investor
          channel: Independent credit analysis
          touchpoints:
            - Fitch says the rating is constrained by limited product diversification
            - Public evidence is stronger on portfolio retention than on enterprise-account depth
          tone: risk
    claimRefs: [CU001, CU003, CU004, CU005, CU006, CU007, CU008, CU010, CU011, CU013, CU014, CU015]
callouts:
  - calloutType: strength
    title: Consumer scale is well evidenced
    body: >-
      Independent coverage is strong enough to support scale and subscription
      durability at the portfolio level, especially for the core consumer base.
    claimRefs: [CU001, CU003, CU004, CU005]
  - calloutType: risk
    title: Public enterprise proof is still logo-heavy
    body: >-
      Nord can name recognizable business customers, but public materials still
      do not show seat counts, renewal curves, channel concentration, or
      independent case studies for the business stack.
    claimRefs: [CU006, CU007, CU008, CU015]
