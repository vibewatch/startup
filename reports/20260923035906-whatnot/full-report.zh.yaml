  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与货币化
        blocks:
          - type: paragraph
            body: >
              Whatnot 主要有两类收入：


              **1. 卖家佣金（主要）：** 卖家为每笔成交价支付 8%。这是 Whatnot 最主要的收入流。一张 $100 的交易卡通过直播拍卖售出，Whatnot 收入 $8。自 2021
              年以来，佣金率保持一致，仅在特定卖家品类或地区有选择性促销期（0% 佣金）。


              **2. 买方处理和运费（次要）：** Whatnot 向买家收取支付处理费（估计约 2–3%）外加运费。有些品类采用固定运费，其他品类由卖家设定费率。买方总费用估计把总抽成率推至 GMV 的约 12%。


              收入模式细节：（a）为吸引新卖家品类（复古服饰上线、新国际市场），部分品类在促销期为 0% 佣金。（b）Whatnot 不买入库存——它是无库存风险的纯市场平台。（c）固定佣金率下，收入随 GMV
              线性增长——没有按规模递减的阶梯折扣。


              8% 佣金不同于 eBay（总计 12–15%）和 StockX（8–10% + 费用），大致与 TikTok Shop 促销后 6–8% 持平。Whatnot
              的佣金显著低于服务不同买家的高端认证市场（GOAT、StockX）。


              分析师收入估算：2024E 约 $359M（Sacra/Pitchbook）；2025E 约 $720M+（按 $6B GMV、12% 抽成率推算）。这些来自分析师推导，并非公司披露。
