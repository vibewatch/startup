chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Whatnot
              是为收藏者和发烧友设计的直播拍卖与购物市场。卖家（平台称为「主播」）通过直播，把交易卡（Pokémon、体育卡）、运动鞋、复古服饰、漫画书及其他收藏品直接拍卖给买家，买家在移动应用上实时出价。平台把直播的娱乐性和现场拍卖的价格发现结合起来，形成不同于
              eBay（异步）和 TikTok Shop（算法信息流）的社交电商品类。Whatnot 向卖家收取 8%
              佣金外加支付处理费，买家支付运费处理费。公司的模式是双边的：每笔交易赚取毛利，但不持有库存、不负责履约，也不提供卖家融资。Whatnot 2019 年创立于 California 州 Los
              Angeles，总部位于 3440 Cahuenga Blvd West, Los Angeles (West Hollywood), CA 90068。公司业务覆盖美国（主市场）、德国、英国、加拿大和澳大利亚。


              Whatnot 的商业模式类似 eBay
              的市场平台模式，但聚焦「娱乐电商」细分市场——参与直播拍卖的体验本身就是产品，而不只是交易工具。卖家建立忠诚的复购买家社区，买家每周观看数小时内容，并与主播形成拟社会关系。这种参与动态带来高复购率，也让共享直播自然带动病毒式增长。
