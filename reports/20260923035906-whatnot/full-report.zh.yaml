      - number: '4.2'
        title: 单元经济与毛利率
        blocks:
          - type: paragraph
            body: >
              Whatnot 的单元经济符合市场平台特征：毛利率潜力高，但要维持社区并参与竞争，需要持续投入大量运营费用。


              **毛利率：** Sacra 估计 Whatnot 2024 年毛利率约为 45–50%。在纯市场平台模型中，COGS 包括支付处理成本（Stripe 约 2.9% + 每笔
              $0.30）、欺诈和拒付成本、客户支持、托管基础设施。在约 $359M 收入和 45–50% 毛利率下，2024 年毛利润约为 $161–$180M。


              **运营费用：** 主要费用类别包括工程（iOS/Android app 产品开发、拍卖基础设施、认证系统）、营销（卖家和买家获取）、运营（卖家支持、认证审核、客户服务）和 G&A。员工约 700
              人，假设平均全包成本约 $200K/人，年度人工成本约 $140M——约占毛利润 78%。若 GMV 不显著放大，经营杠杆空间有限。


              **国际单元经济：** 分析师估计德国和英国市场因 GMV 密度较低、本地客户支持成本较高、EU VAT 合规开销较大，单市场亏损显著。这些市场稀释了合并单元经济。


              **CAC 与回收期：** 买家 CAC 未公开披露。分析师推断：历史上，美国收藏品市场强有机社区驱动的买家增长让 CAC 保持较低；扩展到发烧友社区之外需要付费获客，CAC 会明显更高。


              **盈利路径：** 无公开指引。若 2025 年 GMV 预计达到 $6B+，毛利率 45–50%，经营盈利需要运营费用纪律。核心变量是营销支出——Whatnot
              是加速买家增长（成本），还是收割既有社区（利润）。
            claimRefs:
              - CI006
