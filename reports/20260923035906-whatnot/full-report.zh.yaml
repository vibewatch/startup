        - date: '2020'
          label: 种子轮
          detail: $3.7M 种子轮融资让公司成立，也把早期重心定在收藏者群体。
          tone: positive
        - date: '2021'
          label: Series A 轮 / YC W21
          detail: $4M 融资加上 Y Combinator 背书，帮助这个交易平台从爱好者圈层走向规模化。
          tone: positive
        - date: 2021-07
          label: Series B 轮，估值 $300M
          detail: Andreessen Horowitz 领投的 $50M 融资加速了品类扩张。
          tone: positive
        - date: 2021-09
          label: Series C 轮，估值 $1.5B
          detail: CapitalG 和 a16z 领投的 $150M 融资确认了机构需求。
          tone: positive
        - date: 2022-07
          label: Series D 轮，估值 $3.7B
          detail: $260M 融资支撑国际扩张，也加大卖家工具投入。
          tone: positive
        - date: 2025-01
          label: Series E 轮，估值 $5B
          detail: $265M 融资成为本次更新确认其独角兽身份的依据。
          tone: positive
        - date: 2025-10
          label: Series F 轮，估值 $11.5B
          detail: $225M 融资使公司的隐含估值再次大致翻倍。
          tone: positive
    approximationNotes: 估值单位为 $M。种子轮 / Series A 仍有部分为估算；Series B 至 F 已由多家新闻来源确认。
    claimRefs:
      - CO007
      - CO008
      - CO009
  - id: FM001
    title: 直播电商市场规模金字塔 — 从 TAM 到 SOM
    type: pyramid
    layout: standard
    summary: |
      这张分层市场规模图从全球直播电商总可用市场（TAM）拆到 Whatnot 在美国收藏品市场的可获取市场（SOM），显示 Whatnot 当前吃下的市场比例，以及剩余增长空间。
    data:
      items:
        - label: 全球直播电商总可用市场（TAM，2026 年达 $500B–$1T）
          value: 750
        - label: 美国直播电商总可用市场（TAM，2026 年达 $68B）
          value: 68
        - label: 直播拍卖收藏品可服务市场（SAM，全球 $40–60B）
          value: 50
        - label: Whatnot 可获取市场（SOM）2025E（GMV $6B+）
          value: 6
        - label: Whatnot 可获取市场（SOM）2024（GMV $3B）
          value: 3
        - label: Whatnot 可获取市场（SOM）2026E（GMV $7B）
          value: 7
    approximationNotes: >-
      金额单位为十亿美元。总可用市场（TAM）来自 McKinsey/Coresight；可服务市场（SAM）来自 Bloomberg Intelligence 估算；可获取市场（SOM）来自 Sacra/Pitchbook
      分析师估算。
