      - number: '2.2'
        title: 市场规模与增长驱动
        blocks:
          - type: paragraph
            body: >
              主要分析机构对美国直播电商的估算：

              - Coresight Research（2024）：美国 GMV 2023 年 $25B → 2026 年 $68B（CAGR 约 40%）

              - McKinsey（2023）：全球直播电商到 2026 年为 $500B–$1T

              - eMarketer（2024）：美国社交电商 2023 年 GMV $67B，至 2027 年年增约 25%

              - Bain（2023）：如果 TikTok/YouTube/Facebook 持续投入，美国直播电商到 2026 年为 $50–70B

              - Bloomberg Intelligence（2024）：美国收藏品 $30–40B；约 15–20% 通过直播拍卖交易


              增长驱动：（1）PSA 评级卡提交量 2023 年同比 +35%——收藏品长期增长；（2）购物娱乐：头部卖家吸引 50K–200K 观众，形成类似媒体的粘性；（3）创作者经济：头部 1,000 名卖家年收入
              $100K–$2M+，成为主要收入来源且粘性很强；（4）移动优先的 Gen Z/Millennial 买家群体（60%+ 买家低于 35 岁）；（5）TikTok Shop 2024 年美国 GMV
              $20B，验证直播电商是美国真实品类。


              制约因素：（1）TikTok Shop 2023–2024 年以 0% 佣金促销切入，威胁 Whatnot 的 8% 抽成率；（2）eBay Live 和 Amazon Live
              在收藏品领域竞争；（3）收藏品周期性（2021 年 Pokémon 卡泡沫、2022 年回调、2023–2024 年复苏）；（4）FTC 2023 年假货警示带来合规开销。
