      - number: '3.3'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >
              竞争者之间的关键差异化因素：


              **认证：** Whatnot 对评级卡和运动鞋有卖家验证 + 认证项目。eBay 有 Authenticity Guarantee（卡牌 >$750+ 需第三方评级）。TikTok Shop
              没有按品类设计的认证——这是 Whatnot 最强的品牌护城河。StockX 和 GOAT 有运动鞋实物认证中心；它们在认证运动鞋上优于 Whatnot，但缺少直播形式。


              **佣金结构：** Whatnot 向卖家收取 8% + 买方处理费。TikTok Shop 为 6–8%（促销后）。eBay 为 12–15%（加上支付处理后的全口径更高）。StockX 为 8–10% +
              $5 交易费。GOAT 为 9.5%+ 提现费。Whatnot 的 8% 有竞争力，但并非独一无二地低。


              **发现机制：** TikTok Shop 的算法发现把直播推给未订阅用户，可能在零关注关系下触达数百万人。Whatnot 依赖订阅通知和分类浏览。这是结构性的可发现性劣势，Whatnot 必须靠付费获客或
              SEO / 社交分发来弥补。


              **买家信任 / 品牌：** Whatnot 在收藏品社区中用 5+ 年建立了品牌信任。eBay 有 25+ 年品牌资产。TikTok Shop
              在美国市场与假货风险绑定。这种信任优势真实存在，但很脆弱——Whatnot 一旦发生重大认证失败，优势会迅速被侵蚀。
