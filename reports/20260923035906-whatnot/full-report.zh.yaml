              本章所有 Whatnot 财务数字都是分析师估算，来自基于 GMV
              估计反推抽成率。公司没有公开披露收入、毛利率、运营费用或现金状况。正式尽调必须把取得经审计财务作为闸门条件。任何基于分析师估算的投资决策，都承担估算不准确带来的实质下行风险。
