      - number: '2.4'
        title: 采纳约束与竞争动态
        blocks:
          - type: paragraph
            body: >
              美国直播电商采纳的关键结构性约束：（1）美国消费者在心理上把娱乐和交易型购物分开，直播电商习惯养成明显慢于中国；中国通过 WeChat 和 Alibaba 生态较早把二者合并。（2）TikTok Shop
              2024 年创造约 $20B 美国 GMV，并在 2024 年进入收藏品品类，直接竞争 Whatnot 的核心市场。（3）eBay 2023 年推出 eBay Live，瞄准 Whatnot
              的收藏品卖家基础，并拥有 150M+ 活跃买家的在位者优势。（4）Amazon 2024 年扩展 Amazon Live 联盟计划，主要切入泛商品相邻领域。


              收藏品周期性反复出现：交易卡市场在 2021 年 COVID 驱动的爱好通胀中见顶，2022 年大幅回调（Pokémon 卡价较峰值下跌 40–70%），2023–2024 年复苏。Whatnot 的 GMV
              增速在 2022 年回调期间放缓，暴露出真实敞口。Pokémon 和体育卡集中度（约占 Whatnot GMV 40–50%）带来宏观敏感性，单纯直播电商市场增长数字无法完全反映。


              国际摩擦包括 EU GDPR、英国《消费者权利法》、本地支付基础设施要求、跨司法辖区 VAT 合规，以及本地化卖家支持团队成本。分析师估计国际单元经济低于美国。主流（非收藏品）受众的买家 CAC
              偏高；迄今大部分获客由有机社区驱动，如果不投付费营销，可触达买家基数的增长会受限。
            claimRefs: []
