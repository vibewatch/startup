  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与核心流程
        blocks:
          - type: paragraph
            body: >
              Whatnot 的产品是移动市场平台，卖家开设直播视频拍卖，买家实时出价。核心用户流程：


              **卖家流程：** 创建直播排期 → 在 iOS/Android 开播 → 直播中上架商品（价格 + 拍卖计时器）→ 观众出价 → 最高出价者中标 → Whatnot 处理付款 →
              卖家发货。卖家也可以做「一口价」（固定价格、限量）和「拆包」（在密封卡包开包场次中出售份额）。


              **拆包机制：** 卖家在镜头前直播拆密封交易卡包。买家购买份额（绑定具体球队、位置或随机分配），并收到其份额对应的卡牌。该机制在体育卡品类拉动大量 GMV，是直播电商独有、静态商品页无法复制的形式。


              **买家流程：** 按品类 / 卖家浏览 → 关注喜欢的卖家 → 卖家开播时收到推送通知 → 观看直播 → 单击出价 → 卡牌进入待发货。买家可把同一场次多次中拍的商品合箱，以降低运费。


              **社区功能：** 卖家通过订阅者专享优惠、卖家组合包（精选多件组合）和直接聊天维护粉丝群。社区功能是 Whatnot 区别于 eBay 和 TikTok Shop 的核心。


              **规模基准：** 据报道，平台高峰期可处理 10,000+ 并发直播；个别头部卖家每场吸引 50,000–200,000 名并发观众。这些数字意味着显著的实时基础设施要求。
