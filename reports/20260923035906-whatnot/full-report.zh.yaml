  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >
              Whatnot 所在的「直播电商」指卖家通过实时视频流向现场观众拍卖或限时售卖商品。该模式把娱乐和交易结合起来，相比静态电商带来更高参与度和转化率。


              核心：直播拍卖收藏品——交易卡（Pokémon、体育卡、MTG）、运动鞋、复古服饰、漫画、硬币。对于成色、真伪和社会证明需要实时定价的品类，直播拍卖在结构上优于异步 eBay。全球规模估计为 $40–60B。


              相邻：泛直播电商（TikTok Shop、Amazon Live）。Whatnot 2024 年扩展至复古服饰，但尚未在这里全面竞争。Coresight 预计，美国更广义直播电商 TAM（全品类）到 2026
              年达到 $68B+。


              全球：2023 年中国 Taobao Live、Douyin 和 Pinduoduo 推动 $600B+ GMV。美国直播电商约占电商 4%，中国为 14–18%——结构性渗透明显不足。


              排除：传统拍卖行（价位不同）、同步点对点市场（StockX、GOAT）和批发 B2B。
            claimRefs:
              - CM001
              - CM002
