  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Whatnot 同时在三个竞争维度上作战：


              **维度 1——收藏品直播拍卖形式（直接）：** 竞争者为同一批 Whatnot 服务品类提供实时视频拍卖体验，包括 eBay Live（2023 年推出）、NTWRK（运动鞋 / 街头服饰，2018
              年起做直播电商）和 Popshop Live（泛直播电商）。这些平台目前没有一个在收藏品上达到 Whatnot 的规模，但 eBay 拥有 150M+ 活跃买家的在位者地位，这是 Whatnot
              不能忽视的结构性优势。


              **维度 2——直播电商平台（相邻）：** TikTok Shop（通过直播卖泛商品，2024 年美国 GMV 约 $20B）、Amazon Live（创作者带货）、Instagram Live Shopping
              和 YouTube Shopping。这些平台并不专攻收藏品，但凭借规模和可发现性吸引卖家注意力。TikTok Shop 2024 年进入交易卡和运动鞋，使这一路径从相邻竞争升级为直接竞争。


              **维度 3——静态收藏品市场（替代）：** eBay（异步拍卖、一口价）、StockX（运动鞋 / 卡牌市场指数 + 即时卖出）、GOAT（认证运动鞋和服饰）、TCGplayer（交易卡）和
              MySlabs（评级卡市场）。这些都是 Whatnot 直播拍卖的形式替代品——买家可能偏好无时间压力的浏览，卖家也可能偏好异步上架，而不是实时表演。


              最危险的竞争者是 TikTok Shop，因为它把庞大分发、视频原生形式和算法发现合在一起——这些都是 Whatnot 社区优先打法在收藏品发烧友圈之外尚未大规模匹配的能力。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
