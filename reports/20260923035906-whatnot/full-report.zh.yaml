              TikTok Shop 2023 年在美国上线时以 0% 卖家佣金（促销）切入，是近期最大的单一市场风险。贡献 Whatnot GMV 60–70%
              的专业卖家是理性的经济主体；若佣金节省超过重建受众的成本，他们会测试 TikTok。
