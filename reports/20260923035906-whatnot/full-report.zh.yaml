  - id: FV001
    title: 建议逻辑流 — 从证据到观察（TRACK）建议
    type: flow
    layout: standard
    summary: |
      流程图展示逻辑链条：Whatnot 的规模验证、护城河评估、竞争风险、估值和财务状况，如何共同导向观察（TRACK）建议。
    data:
      nodes:
        - id: scale
          label: $3B 商品交易总额（GMV）（2024）；40%+ 增长；直播收藏品第一
        - id: moat
          label: 卖家护城河：$1M–$5M+ 收入卖家；拆卡房独特性；鉴定徽章
        - id: market
          label: 总可用市场（TAM）：美国可服务市场（SAM）$40–60B；国际扩张；品类增长
        - id: competition
          label: TikTok Shop 威胁：算法优势 + 抽佣率补贴
        - id: cyclicality
          label: 收藏品周期性：2022 年回调先例
        - id: valuation
          label: $11.5B = 33× 收入；相对所有上市可比公司都偏贵
        - id: profitability
          label: 尚未盈利；隐含烧钱速度为 $50–90M；无明确时间表
        - id: recommendation
          label: 观察（TRACK）— 等待估值重置或增长放缓数据
      edges:
        - from: scale
          to: moat
          label: 验证模式
        - from: moat
          to: market
          label: 支撑总可用市场（TAM）论点
        - from: market
          to: competition
          label: 抵消因素
        - from: competition
          to: valuation
          label: 抬高风险溢价
        - from: cyclicality
          to: valuation
          label: 抬高风险溢价
        - from: valuation
          to: profitability
          label: 叠加
        - from: profitability
          to: recommendation
          label: 共同指向
        - from: competition
          to: recommendation
          label: 主要风险驱动因素
    approximationNotes: 该逻辑流由分析师构建，用于呈现估值判断。并非 Whatnot 官方文件。
    claimRefs:
      - CV002
      - CV009
