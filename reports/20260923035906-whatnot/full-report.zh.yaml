      - number: '3.4'
        title: 竞争护城河评估
        blocks:
          - type: paragraph
            body: >
              Whatnot 的护城河有三部分：


              **1. 供给侧网络效应（卖家社区）：** 头部卖家是各自社区里的名人。在 Whatnot 上建立 10,000–200,000 名粉丝的受众需要多年。迁移到 TikTok Shop
              意味着从零重建受众。对留住贡献 GMV 60–70% 的专业卖家来说，这是 Whatnot 最深的护城河。不过，TikTok 的算法能比 Whatnot
              的关注关系模型更快帮助卖家冷启动发现——这一优势可能随时间被削弱。


              **2. 买家社区深度：** 活跃收藏买家不能与泛直播电商买家互换。Whatnot 的买家社区包括评级者、认证者和品类专家，他们推动价格发现。TikTok Shop 或 Amazon Live
              没有这种社区文化。eBay 可以复制，但它的直播形式尚未做到。


              **3. 认证品牌信任：** 在收藏品中，真伪决定一切。Whatnot 的认证项目和卖家验证是品牌资产。FTC 对 TikTok Shop 及其他平台的审查强化了 Whatnot
              的相对定位。这个护城河有价值，但需要持续投资才能守住。


              护城河耐久性隐忧：（1）TikTok Shop 费率正常化后带来的佣金趋同；（2）TikTok 触达新买家的算法发现优势；（3）eBay
              有资金资源打造真正的直播电商产品；（4）如果交易卡市场从小众发烧友社区走向成熟，品类可能商品化；（5）Whatnot 能否在不稀释品牌身份的情况下扩展到收藏品之外。
            claimRefs: []
      - number: '3.5'
        title: 展品
        blocks:
          - type: callout
            title: TikTok Shop——类别重叠与佣金趋同下的关键竞争威胁
            body: >
              TikTok Shop 2024 年进入交易卡和运动鞋——Whatnot GMV 前两大品类——叠加佣金正常化至 6–8%，抹掉此前两个差异化点。TikTok 的算法发现能以规模触达非粉丝受众。Whatnot
              仅有的耐久优势是认证品牌信任和专业卖家社区粘性。如果 TikTok 建成认证项目，Whatnot 的护城河会显著收窄。
            calloutType: insight
            claimRefs:
