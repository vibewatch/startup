      - number: '3.2'
        title: 竞争对手画像
        blocks:
          - type: paragraph
            body: >
              **TikTok Shop（ByteDance）：** 2023 年 9 月在美国上线。2024 年美国 GMV $20B+（Bloomberg）。卖家佣金先 0%，随后
              6–8%。算法发现引擎把直播推给未订阅受众；Whatnot 需要用户主动关注。全球用户 1B+。核心弱点：假货和信任问题（2024 年美国参议院审查；FTC
              假货警示函）；没有面向收藏品的专门认证项目。Whatnot 的差异化：品牌信任、验证、社区深度。风险：TikTok 已开始直接招募 Whatnot 头部交易卡卖家。


              **eBay（NASDAQ: EBAY）：** 2023 年 GMV $73B。2023 年推出 eBay Live。活跃买家 150M+。在收藏品（交易卡、硬币、复古服饰）异步市场占主导。eBay
              Authenticity Guarantee 计划（2020 年）覆盖运动鞋和卡牌。核心弱点：直播形式是嫁接在传统 UX 上；没有原生直播社区文化。Whatnot 的差异化：为直播打造的
              UX、卖家社区身份、娱乐电商融合。


              **Amazon Live：** Amazon 的创作者带货直播购物功能。主要是泛商品。Amazon 不公开披露 Amazon Live GMV。与 Prime 生态整合（美国 Prime 订户
              150M+）。核心弱点：不专注收藏品；偏交易型，不偏社区。Whatnot 的差异化：品类深度、认证、社区。


              **NTWRK：** 面向运动鞋、街头服饰和收藏品的直播电商。2018 年创立。私营公司；估计 GMV $200–400M（远小于 Whatnot）。由 Goldman Sachs、Foot Locker
              支持。核心弱点：品类更窄、受众更小、规模不足。它不是 Whatnot 整体地位的一线威胁，但会争夺运动鞋卖家。


              **Popshop Live：** 泛直播电商市场平台。规模较小。卖家留存和买家增长吃力。2023 年后相关竞争威胁下降。


              **StockX：** 私营公司。估值 $2B（最近一次披露为 2021 年）。基于指数的交易卡 + 运动鞋交易与认证。非直播；异步。核心弱点：没有社区，也没有娱乐元素。对于偏好互动观众、而非 StockX
              即时卖出模式的卖家，Whatnot 构成替代。
