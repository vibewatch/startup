      - number: '4.5'
        title: 展品
        blocks:
          - type: callout
            title: 纯市场平台模式——无库存风险，毛利率潜力高
            body: >
              Whatnot 的纯市场平台模式（不自有库存）带来结构性毛利率优势：没有库存减记风险、没有仓储成本，收入随 GMV 线性扩张。在 45–50%
              毛利率下，单元经济按市场平台标准很强。盈利路径主要要求运营费用纪律，而不是结构性商业模式改变。
