  - id: FI001
    title: 收入模型桥 — Whatnot 从商品交易总额（GMV）到收入
    type: flow
    layout: standard
    summary: |
      这张流程图展示 Whatnot 如何靠卖家佣金和买家费用把商品交易总额（GMV）转成收入，以及 COGS 如何从收入中扣减后得到毛利。
    data:
      nodes:
        - id: gmv
          label: 商品交易总额（GMV）：约 $3B（2024E）
        - id: seller_comm
          label: 卖家佣金（8%）：约 $240M
        - id: buyer_fees
          label: 买家支付处理 + 配送：约 $90–120M
        - id: gross_revenue
          label: 总收入：约 $359M
        - id: payment_cogs
          label: 支付处理 COGS（Stripe 约 2.9%）：约 $87M
        - id: other_cogs
          label: 其他 COGS（欺诈、客服、基础设施）：约 $90–115M
        - id: gross_profit
          label: 毛利：约 $161–$180M（45–50% 毛利率）
      edges:
        - from: gmv
          to: seller_comm
          label: 8% 佣金
        - from: gmv
          to: buyer_fees
          label: 买家费用
        - from: seller_comm
          to: gross_revenue
          label: +
        - from: buyer_fees
          to: gross_revenue
          label: +
        - from: gross_revenue
          to: payment_cogs
          label: 扣减
        - from: gross_revenue
          to: other_cogs
          label: 扣减
        - from: gross_revenue
          to: gross_profit
          label: 净额
    approximationNotes: 所有数字均为分析师估算。Whatnot 未披露实际收入和利润率。
    claimRefs: []
  - id: FE001
    title: Whatnot 产品架构栈
    type: stack
    layout: standard
    summary: |
      分层栈图展示 Whatnot 的产品架构，从面向用户的移动应用，到实时基础设施，再到数据和合规层。
    data:
      layers:
        - label: 用户层：iOS + Android 原生 App（Swift / Kotlin）
          detail: 面向买家和卖家的移动原生应用；没有以网页端为主的交易市场产品
        - label: 产品层：直播拍卖、拆卡房、卖家工具、社区功能
          detail: 核心产品模块：直播拍卖引擎、拆卡房席位管理、卖家分析、买家社区功能，以及关注 / 通知系统
        - label: 交易层：实时竞价引擎 + Stripe 支付 + 配送
          detail: 自研、基于 WebSocket 的拍卖状态机，Stripe 支付处理，Apple Pay / Google Pay，物流合并（buyer bin）
        - label: 流媒体层：AWS IVS + 自研低延迟协议 + CDN
          detail: 流延迟低于 2 秒，把 AWS Interactive Video Service 与自研低延迟协议结合；CDN 负责全球视频分发
        - label: 数据层：PostgreSQL + Redis + Kafka + 欺诈检测 ML
          detail: PostgreSQL 主数据库，Redis 用于缓存和实时拍卖状态，Kafka 用于事件流，ML 模型用于欺诈检测和推荐
        - label: 基础设施层：AWS 微服务 + Kubernetes + Cloudflare
          detail: AWS 托管的微服务，使用 Kubernetes 做容器编排；Cloudflare 或同类方案负责 CDN 和 DDoS 防护
        - label: 信任层：真伪鉴定计划 + 内容审核 + 合规（GDPR、CCPA）
          detail: 分级卡牌鉴定徽章、卖家身份验证、自动化 + 人工内容审核，以及 GDPR/UK GDPR/CCPA 合规控制
    approximationNotes: 技术栈根据工程博客、招聘信息和新闻报道推断。Whatnot 未发布官方架构图。
    claimRefs: []
  - id: FU001
    title: 买家参与旅程 — Whatnot 客户旅程图
    type: journey-map
    layout: wide
    summary: |
      客户旅程图覆盖从初次发现到成为 Whatnot 复购买家的全过程，并标出各阶段的关键参与时刻和流失风险。
    data:
      items:
        - label: 发现：社交分享 / 卖家推广 / 口碑
        - label: 安装：App Store / Google Play 下载
        - label: 浏览：浏览品类、卖家、直播间
        - label: 首次出价：进入直播间，提交第一笔出价
        - label: 首次拍下：通过 Stripe 付款；确认发货
        - label: 关注卖家：接收后续直播推送通知
        - label: 复购：多直播间买家；核心收藏者
        - label: 流失：配送延迟 / 商品纠纷 / 产品不满意
    approximationNotes: 该旅程图由分析师根据产品文档和新闻报道构建。转化率为示意性估算。
