      - number: '1.3'
        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >
              Whatnot 的融资轨迹异常陡峭——五年内从 $3.7M 种子轮走到 $11.5B 估值：


              - Seed：$3.7M（2020），领投方：Y Combinator + Initialized Capital

              - Series A：$4M（YC W21 演示日，2021）

              - Series B：2021 年 7 月以 $300M 估值融资 $50M，领投方：Andreessen Horowitz

              - Series C：2021 年 9 月以 $1.5B 估值融资 $150M，领投方：CapitalG + a16z

              - Series D：2022 年 7 月以 $3.7B 估值融资 $260M，领投方：a16z

              - Series E：2025 年 1 月以 $5B 估值融资 $265M——本报告的合格独角兽证据

              - Series F：2025 年 10 月以 $11.5B 估值融资 $225M

              - 累计融资：截至 2025 年 10 月约 $995M


              2025 年 1 月的 $265M Series E 是本报告所需、带有 2024 年 5 月之后证据的合格独角兽融资。Series E 由 Andreessen Horowitz 和 CapitalG
              共同领投，老股东参与。2025 年 10 月的 Series F（$225M、估值 $11.5B）较 Series E 估值跃升 130%，背后是 GMV 从约 $3B（2024）翻倍至
              >$6B（2025E）以及持续国际扩张。
