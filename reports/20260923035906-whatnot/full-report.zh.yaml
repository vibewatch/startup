              - CP011
              - CP014
          - type: callout
            title: 认证品牌信任——Whatnot 最深的结构性护城河
            body: >
              收藏品的价值由真伪定义，Whatnot 的认证项目和卖家验证创造了 TikTok Shop 与 Amazon Live 没有的品牌信任护城河。FTC 对 TikTok
              假货的审查又强化了这一点，把担心假货的买家拉回 Whatnot。护城河需要持续投入，但真实存在，也能在社区行为中被观察到。
