      - number: '1.4'
        title: 关键里程碑与牵引力
        blocks:
          - type: paragraph
            body: |
              Whatnot 2021 至 2025 年规模加速：

              **2019：** 成立；最初聚焦 Pokémon 卡牌；2 名创始人、无收入。
              **2020：** COVID 封控期间转向直播拍卖；$3.7M 种子轮；首批卖家入驻。
              **2021：** Y Combinator W21；Series B（$50M，估值 $300M）；Series C（$150M，估值 $1.5B）；从 Pokémon 卡牌扩展至体育卡、运动鞋。
              **2022：** Series D（$260M，估值 $3.7B）；扩展至英国和德国；GMV $1.5B（估计）；约 350 名员工。
              **2023：** 上线加拿大和澳大利亚；新增复古服饰品类；GMV 约 $2B（估计）；美国核心卡牌市场首次出现盈利迹象。
              **2024：** GMV 约 $3B；收入约 $359M；推出 Whatnot Studios（创作者计划）；员工 680+；开始筹备 Series E。
              **2025（1 月）：** 以 $5B 估值完成 $265M Series E——合格独角兽证据。
              **2025（10 月）：** 以 $11.5B 估值完成 $225M Series F；GMV >$6B（估计）；约 700 名员工。

              不利事件：2023 年因未经授权的重复收费被提起集体诉讼（2024 年和解，金额未披露）。FTC 2023 年向直播电商平台发出关于收藏品市场假货的警示函；作为回应，Whatnot 推出认证项目。
