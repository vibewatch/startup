      - number: '2.3'
        title: 买卖双方分层
        blocks:
          - type: paragraph
            body: >
              卖家分层：（1）专业转售商（占卖家 25–35%，贡献 GMV 60–70%）：全职，每周 3–7 场直播，收入 $100K–$2M+，粘性极高；（2）小企业卖家（占卖家 40–50%，贡献 GMV
              25–30%）：兼职，同时在 eBay 上架，粘性中等；（3）偶发卖家（<20%，<10% GMV）：留存低。


              买家分层：（1）活跃收藏者（占买家 15–20%，约贡献 GMV 60%）：每月至少购买，复购高；（2）价值猎手（占买家 30–40%，约贡献 GMV 25%）：价格敏感，有流向 TikTok Shop
              的风险；（3）社区观看者（占注册用户 40–50%，<15% GMV）：经常观看，货币转化低。


              地理：美国占 GMV 70–75%；德国占 15–18%（第一大非美国市场，桌游 + Pokémon）；英国占 5–10%（运动鞋、复古）；加拿大 + 澳大利亚合计约 5%。国际扩张始于 2022–2023 年。
