            title: 美国直播电商结构性低渗透——SAM 获取率低于 5%
            body: |
              美国直播电商约占电商 4%，中国为 14–18%。Whatnot 在货币化最强的发烧友收藏品细分市场位居 #1，但 SAM 渗透率低于 5%。中国先例说明，在市场饱和前，GMV 存在数倍结构性增长空间。
            calloutType: insight
