claims:
  - id: CO001
    statement: >-
      Whatnot is a livestream auction marketplace where sellers host live shows on mobile to auction trading cards,
      sneakers, vintage clothing, and other collectibles to buyers who bid in real time.
    type: observed
    topic: Whatnot business model description
    sourceRefs:
      - SO001
      - SO002
    confidence: high
    freshness: recent
    answersQuestionRefs:
      - QO001
  - id: CO002
    statement: >-
      Whatnot charges sellers an 8% commission on every transaction plus payment processing fees; buyers pay a shipping
      and handling fee per auction won — Whatnot does not hold inventory or provide seller financing.
    type: observed
    topic: Whatnot commission and fee structure
    sourceRefs:
      - SO001
      - SO002
    confidence: high
    freshness: recent
    answersQuestionRefs:
      - QO002
  - id: CO003
    statement: >-
      Whatnot's model is two-sided: it connects seller-hosts with buyer-viewers through live auction streams, generating
      a gross take rate of approximately 12% (8% seller commission + buyer processing/shipping fees) on every GMV dollar
      transacted.
    type: estimated
    topic: Whatnot two-sided marketplace gross take rate
    sourceRefs:
      - SO001
    confidence: medium
    freshness: recent
    answersQuestionRefs:
      - QO003
  - id: CO004
    statement: >-
      Whatnot was co-founded in 2019 by Grant LaFontaine (CEO) and Logan Head (COO/CTO); LaFontaine previously was a
      product manager at Microsoft and Facebook; Head was an engineer at Amazon and Snapchat.
    type: observed
    topic: Whatnot co-founders background
    sourceRefs:
      - SO001
      - SO002
    confidence: high
    freshness: recent
    answersQuestionRefs:
      - QO004
  - id: CO005
    statement: >-
      Whatnot's board includes representatives from Andreessen Horowitz (a16z), CapitalG (Google Alphabet's independent
      growth fund), and Initialized Capital — no independent directors with consumer marketplace operating experience
      have been publicly disclosed.
    type: observed
    topic: Whatnot board composition
    sourceRefs:
      - SO001
    confidence: medium
    freshness: recent
    answersQuestionRefs:
      - QO005
  - id: CO006
    statement: >-
