companyProfile:
  summary: >-
    Whatnot is a Los Angeles-based live commerce marketplace founded in 2019 by Grant LaFontaine and Logan Head. The
    platform lets sellers run live video auctions and buy-now streams across collectibles, fashion, sneakers, luxury
    goods, and adjacent categories, while buyers participate in real time from mobile apps. By late 2026, Whatnot had
    crossed 1B lifetime orders, said it processed more than 20 orders per second, and reported more than 650k new
    sign-ups per week. The company completed a $545M Series G at a $20B valuation in August 2026, making it one of the
    most valuable private consumer commerce platforms.
  foundedDate: '2019-02-01'
  founders:
    - name: Grant LaFontaine
      role: CEO and Co-Founder
      background: Consumer product and marketplace founder focused on community-driven commerce and fundraising.
      claimRefs: []
    - name: Logan Head
      role: Co-Founder
      background: >-
