summary:
  headline: >-
    Whatnot has scaled into a $20B live-commerce platform with strong user growth, 1B+ lifetime orders, and meaningful
    seller-community depth, but the valuation now assumes continued category leadership and expansion without
    transparent public financials. TRACK: the business is clearly working, yet the risk/reward remains
    valuation-sensitive.
