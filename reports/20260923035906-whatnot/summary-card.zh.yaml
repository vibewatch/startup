summary:
  headline: Whatnot 已长成 $20B 的直播电商平台，用户增长强、累计订单 1B+，卖家社区也有深度；但在公开财务不透明的情况下，当前估值已经押注它继续保持品类领导并扩张。观察：业务显然跑通了，风险回报仍高度依赖估值。
