  topStrengths:
    - Whatnot 已成为定义品类的直播电商市场，累计订单 1B+，活跃卖家社区规模很大。
    - 平台用户增长仍强，管理层和合作伙伴表述都指向 2026 年注册和订单继续快速增长。
    - 公司已经从最初的收藏品垂类扩到更广的二手转售和相邻生活方式品类，同时没有丢掉核心受众。
    - 卖家工具、买家保护和直播拍卖产品深度共同抬高切换成本，跟随型直播电商产品很难快速复制。
  topRisks:
    - $20B 估值容错空间很小；一旦 GMV 增长回归常态，或公司无法把增长转成可持续盈利能力，估值会承压。
    - TikTok Shop、eBay Live 等直播电商进入者可能挤压 Whatnot 的品类领先位置和卖家获客经济性。
    - 收入、利润率和烧钱速度的公开可见度仍有限，盈利时间点更难承保。
    - 收藏品直播电商仍会因为类赌博机制、退款和消费者保护问题受到法律与监管审视。
  unresolvedGaps:
    - 实际财务指标：没有公开季度 GMV、收入、EBITDA 或烧钱速度数据，全部财务分析都依赖媒体报道和分析师估计
    - 卖家 GMV 集中度：没有公开数据说明前 100/500 名卖家贡献多少 GMV，最该量化的风险无法用公开信息量化
    - 买家队列留存：没有公开流失率、NRR 或队列留存数据，无法在 App Store 信号之外评估买家参与度能维持多久
    - 盈利时间表：管理层没有给出 EBITDA 盈亏平衡路径指引；缺少该数据后，现金跑道假设存在 2–3 年不确定性
    - TikTok Shop 美国结果：美国强制剥离监管流程仍在推进；结果对 Whatnot 竞争环境是二元变量（TikTok 被禁 = 乐观情景；TikTok 留存 = 持续竞争威胁）
    - 安全认证：未发布 SOC 2 或 ISO 27001；公开信息无法验证其 GDPR 技术和组织措施合规性
