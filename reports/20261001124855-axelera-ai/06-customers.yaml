callouts:
  - calloutType: "risk"
    title: "Channel Disintermediation and Distributor Alignment Risk"
    body: "Axelera relies heavily on industrial computing distributors like Advantech to reach mid-tier customers. Because Advantech concurrently bundles rival silicon from NVIDIA, Qualcomm, Intel, and Hailo into identical form-factors, Axelera must continuously defend its performance-per-watt advantage to prevent distributor displacement."
    claimRefs:
      - "CU014"
      - "CU016"
  - calloutType: "insight"
    title: "European Technological Sovereignty as a Buyer Catalyst"
    body: "Customer selection among defense and sovereign cloud buyers (e.g., Safran, Telefónica Tech, OVHcloud, EuroHPC) is heavily influenced by the strategic imperative to source non-US, non-Asian semiconductor architectures that keep sensitive training and inference data within local jurisdiction."
    claimRefs:
      - "CU011"
      - "CU012"
