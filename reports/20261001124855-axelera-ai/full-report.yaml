  - id: FE001
    title: Axelera AI End-to-End Technology Stack Architecture
    type: stack
    summary: >-
      Layered architecture diagram detailing the progression from silicon compute up through developer inference
      tooling.
    data:
      layers:
        - label: Application & Agentic Tooling Layer
          detail: >-
            Axelera Wingman natural language pipeline generation, computer vision, physical AI robotics, and edge
            generative AI applications.
        - label: Pipeline & Framework Layer
          detail: >-
            Declarative YAML pipeline definitions, Voyager Model Zoo with 100+ pre-trained models, and ONNX/PyTorch
            execution runtimes.
        - label: Compiler & Software SDK Layer
          detail: Voyager SDK quantization engine, model compilation graph optimizer, and custom Deploy conversion tooling.
        - label: Platform Management & Telemetry Layer
          detail: >-
            BMC/IPMI/Redfish out-of-band telemetry, UEFI/BIOS firmware, secure boot root-of-trust, and enterprise RAS
            controls.
        - label: System Integration & Board Form Factors
          detail: >-
            Metis M.2 2280 edge card, Metis M.2 Max, standard PCIe accelerator card, OAM modules, and 1U/2U server
            chassis.
        - label: Silicon Architecture & Execution Cores
          detail: >-
            Proprietary Digital In-Memory Computing (D-IMC) SRAM arrays, integrated RISC-V control cores, and high-speed
            SerDes interconnect.
    approximationNotes: >-
