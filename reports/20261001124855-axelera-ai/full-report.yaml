  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >
              Axelera's relevant market is narrower than the full AI semiconductor market. Its stated scope is inference
              acceleration across embedded devices, edge systems, and enterprise servers, with computer vision, machine
              vision, generative AI, vision-language models, and agentic workloads in view. Frontier-model training
              clusters, general cloud-compute consumption, and consumer-device neural processors fall outside this
              boundary. The practical substitutes are public-cloud inference, GPU-based on-premises systems, CPU-only
              processing, and delaying automation altogether. The strongest boundary logic is operational rather than
              categorical: workloads become relevant when latency, bandwidth, data control, power, or cooling makes
              local inference preferable. Standard PCIe products and reuse of installed cameras may reduce replacement
              work, but neither proves that buyers will switch at scale.
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM016
