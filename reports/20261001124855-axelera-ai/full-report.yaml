      - number: '4.2'
        title: Unit Economics, Cost Structure, and Gross Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              As a fabless hardware provider, Axelera AI outsources wafer fabrication, packaging, and testing to
              specialized semiconductor manufacturing partners, avoiding internal cleanroom capital intensity while
              incurring direct foundry costs, substrate procurement expenses, and packaging fees. Gross margin
              performance is fundamentally governed by silicon yield rates, packaging complexity (including digital
              in-memory computing integration), wafer allocation pricing, and bills of materials for passive components
              on peripheral PCIe and M.2 modules. Development-stage unit economics carry elevated absorption costs from
              chip tape-outs, mask sets, and low-volume pilot runs. Although management claims a 3-5x
              performance-per-watt and price-performance advantage over incumbent edge processors, realized gross
              margins, cost of goods sold breakdowns, and customer acquisition payback horizons are withheld from public
              disclosure. Consequently, commercial underwriting requires institutional access to audited unit margins,
              warranty reserves, and channel discount schedules.
