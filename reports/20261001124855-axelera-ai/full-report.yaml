  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Thesis evidence
      - Anti-thesis or limitation
      - What would change the view
    rows:
      - - Commercial signal
        - Company reported a $100M-plus pipeline in 2024 and shipment to a 500th customer in 2026
        - Pipeline is not revenue; customer count lacks order value, retention, and concentration
        - Audited revenue bridge, bookings conversion, customer cohorts, and concentration schedule
      - - Product adoption
        - Company says Voyager supports 100-plus models through one toolchain
        - Breadth of model support does not prove production utilization or switching economics
        - Independent deployment benchmarks and paid production usage by workload
      - - Organizational scale
        - Dealroom maps 287 employees and 16 investors
        - Team and syndicate size do not establish productivity, margin, or runway
        - Headcount plan, functional allocation, burn, and hiring-to-revenue productivity
      - - Capital access
        - Company reports more than $450M across equity, grants, and venture debt
        - Mixed financing categories obscure dilution, restrictions, leverage, and cash remaining
        - Fully diluted cap table, preference waterfall, debt schedule, grant terms, and cash balance
    notes: >-
      Company-issued commercial and product figures are preserved as claims rather than treated as independently
      verified performance.
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Required assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Customer count and pipeline convert into repeat production revenue; gross margin and working capital support
          scale
        - >-
          Upside to the $1B reference requires verified growth, durable margin, and limited dilution; no numeric range
          is supportable
        - Conversion shortfall, manufacturing commitments, software adoption, or new senior securities
        - Strengthens only after audited conversion, margin, and retention evidence
      - - Base
        - Product and customer activity continue, but operating economics remain only partly disclosed
        - The $1B reference remains unvalidated; target return cannot be calculated without entry and security terms
        - Slow diligence closure, capital intensity, and inability to distinguish pilots from production
        - Current central case while public operating evidence remains incomplete
      - - Bear
        - >-
          Pipeline converts slowly, cash consumption is high, or grants and debt provide less flexible capital than
          headlines imply
        - Down-round and preference-overhang risk dominate; no downside floor can be inferred from cumulative funding
        - Customer concentration, weak margin, financing restrictions, or need for near-term capital
        - Rises if runway, conversion, or preference diligence fails
    notes: >-
      Scenarios are qualitative because retained sources do not disclose audited revenue, profitability, cash burn,
      runway, entry terms, or a preference stack.
    claimRefs:
      - CV001
      - CV004
      - CV008
      - CV013
      - CV014
      - CV015
      - CV016
