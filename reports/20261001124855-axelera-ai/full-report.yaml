  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Monetization Structure
        blocks:
          - type: paragraph
            body: >-
              Axelera AI monetizes through a fabless semiconductor model pairing proprietary AI processing units (Metis
              AIPU, followed by Europa and future Titania architectures) with system-level hardware modules, PCIe
              accelerator cards, and software enablement tools. Commercial revenue streams originate primarily from
              physical product shipments, including evaluation systems, embedded modules, and server-grade acceleration
              hardware sold directly to OEMs, system integrators, and enterprise customers. The company complements
              silicon and board hardware sales with its Voyager SDK and developer toolchain, which provides model
              quantization, compilation, and runtime deployment pipelines. While list pricing for evaluation systems and
              development hardware is structured on a per-unit basis, volume commercial pricing is governed by custom
              OEM supply agreements, tier discounts, and co-development programs. Realized revenue per unit, long-term
              software licensing terms, and recurring maintenance revenue remain undisclosed private data points,
              preventing precise estimation of blended average selling prices across industrial edge versus datacenter
              configurations.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
