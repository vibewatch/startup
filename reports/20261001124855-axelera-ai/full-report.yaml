      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >
              Power and cooling limits, cloud operating cost, latency, privacy, security, and data-location requirements
              are the clearest demand drivers in the retained evidence. Axelera's company-reported deployment count
              above 600 customers and sales pipeline above $1.5 billion indicate breadth of engagement as of September
              2026, but they do not establish recognized revenue or durable production volume. The principal constraint
              is execution: enterprises need broad model support, predictable software behavior, validated systems, and
              independent proof that performance-per-watt claims persist across their own workloads. NetworkWorld
              specifically notes that Axelera's efficiency comparison combines internal testing with public competitor
              data and requires wider independent validation. Valuation should therefore distinguish a credible
              inference-demand thesis from unproven market share, conversion, pricing, and gross-margin assumptions.
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
              - CM014
              - CM015
