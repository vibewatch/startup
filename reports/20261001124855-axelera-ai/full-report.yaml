      - number: '2.3'
        title: Buyer Segments, Budget Ownership, and Adoption Path
        blocks:
          - type: paragraph
            body: >
              Buying authority changes by deployment. Embedded and edge products begin with OEM or product-engineering
              teams that must fit accelerator hardware, software, thermals, and model support into a device. Industrial,
              retail, security, robotics, and drone deployments add operations leaders and systems integrators because
              the accelerator is only one component of a working workflow. Enterprise inference shifts the decision
              toward infrastructure leadership, with security, compliance, and data-governance stakeholders influencing
              whether workloads remain on premises. Adoption therefore runs from workload qualification and model
              porting through hardware validation, systems integration, a production pilot, and fleet or server rollout.
              Standard PCIe form factors, validated OEM systems, software support, and reuse of existing cameras can
              shorten that path, while missing ROI and budget evidence remains a material diligence gap.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM013
              - CM016
