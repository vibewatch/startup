    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Axelera AI was incorporated in July 2021 and is headquartered in Eindhoven, the Netherlands. It develops
              AI acceleration hardware and associated software for inference workloads, positioning the Metis and Europa
              platforms across edge and data-centre applications. The Voyager SDK is the software layer used to compile,
              quantize and deploy models across Axelera product lines. This is therefore a semiconductor-platform
              business rather than a pure software vendor: product adoption depends on silicon availability, software
              usability and customer integration. Public materials establish the product category and headquarters, but
              they do not disclose current pricing, recognized revenue, gross margin or the mix of evaluation systems
              versus production deployments.
