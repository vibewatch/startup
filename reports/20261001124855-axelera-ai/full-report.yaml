  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Architectural Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The competitive arena for artificial intelligence acceleration divides into hyperscale cloud data centers
              and constrained edge deployments. While incumbent semiconductor providers historically optimized silicon
              for centralized data centers with unconstrained power envelopes, edge applications demand dedicated energy
              efficiency. In the edge AI inference segment, more than sixty billion dollars in venture funding has
              created a crowded landscape of early-stage chip ventures. Axelera AI competes against established graphics
              processing unit incumbents, particularly Nvidia, alongside specialized edge AI processor startups such as
              Hailo and SiMa.ai. Axelera seeks to transcend market fragmentation through its second-generation Europa
              architecture, shipping across PCIe form factors and custom boards to over five hundred commercial
              customers across industrial manufacturing, robotics, and defense.
            claimRefs:
              - CP001
              - CP002
              - CP012
              - CP013
              - CP014
