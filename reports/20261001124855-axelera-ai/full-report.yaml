  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Form Factors, and SKU Lineup
        blocks:
          - type: paragraph
            body: >-
              Axelera AI delivers purpose-built hardware acceleration platforms tailored for artificial intelligence
              inference at the network edge and in industrial environments. Rather than addressing the model training
              market dominated by high-power datacenter GPUs, the company focuses on running pre-trained computer vision
              and generative AI workloads with high energy efficiency. Its commercial edge hardware family is organized
              around the Metis AI Processing Unit, delivering starting performance of 214 TOPS at INT8 precision.
              Axelera packages this silicon into multiple standard form factors to address diverse deployment
              environments, including compact Metis M.2 accelerator cards for embedded systems, drones, and edge
              gateways, high-density Metis M.2 Max modules providing dual-compute capability for vision-language models,
              and standard Metis PCIe cards engineered for industrial PCs, edge servers, and multi-camera appliances. To
              reduce proof-of-concept friction for enterprise buyers, Axelera ships turnkey Metis Evaluation Systems in
              partnership with major system OEMs including Dell and Lenovo. By February 2026, the company reported
              shipments to its 500th global customer across physical AI sectors including robotics, manufacturing, and
              security, though volume production durability across diverse hardware ecosystems remains an ongoing
              technical validation point.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: 'Technology Architecture: Digital In-Memory Computing and Voyager SDK'
        blocks:
          - type: paragraph
            body: >-
              Axelera AI's core architectural differentiation rests on Digital In-Memory Computing (D-IMC) tightly
              integrated with open-standard RISC-V control cores. Traditional von Neumann computer architectures
              experience substantial latency and energy overhead moving weights and activations between discrete memory
              banks and processing elements, a constraint widely known as the memory wall. By executing matrix
              computations directly within SRAM storage arrays in the digital domain, Axelera's Metis AIPU achieves
              superior compute density and thermal performance without the noise sensitivity of analog in-memory compute
              approaches. The architectural concept was validated on the Thetis Core testbench taped out in December
              2021, which demonstrated 39.3 TOPS and 14.1 TOPS per Watt at INT8 precision in a compact die footprint
              under 9 square millimeters. On top of its silicon, Axelera layers the Voyager SDK, an end-to-end toolchain
              featuring a declarative YAML pipeline specification language, automated model quantization, and a Model
              Zoo spanning over 100 pre-trained vision models. To further accelerate pipeline development, the company
              introduced Axelera Wingman, a domain-specific agentic coding assistant designed to build and debug Voyager
              deployment graphs directly from natural language specifications.
            claimRefs:
              - CE007
              - CE008
              - CE010
              - CE012
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE007
              - CE008
              - CE010
      - number: '5.3'
        title: Deployment Workflows, Datacenter Expansion, and Platform Architecture
        blocks:
          - type: paragraph
            body: >-
              In production edge environments, Axelera AI accelerators handle high-throughput physical AI tasks such as
              multi-stream video surveillance analytics, assembly line visual inspection, and retail shelf monitoring
              where low latency and local data privacy are paramount. However, third-party technical evaluations have
              surfaced tangible platform integration friction. Hands-on testing revealed that while Metis M.2 cards
              operated reliably on standard Intel-based PCs, the accelerator was not recognized on tested AMD desktop
              configurations or NVIDIA Jetson embedded carrier boards, highlighting host firmware and PCIe root complex
              dependencies. In parallel with edge deployments, Axelera is executing a major strategic expansion into
              enterprise datacenter infrastructure. Following a $250 million funding round in early 2026, the company
              created an AI Infrastructure Systems engineering division tasked with delivering the next-generation
              Europa inference processor. This datacenter roadmap encompasses PCIe Gen6 and CXL accelerator cards, Open
              Accelerator Module (OAM) baseboards, and dense 1U/2U server chassis equipped with BMC-based telemetry,
              Redfish management, and advanced enterprise reliability, availability, and serviceability (RAS) features.
            claimRefs:
              - CE006
              - CE009
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE008
              - CE009
      - number: '5.4'
        title: Differentiation, Governance, and Technical Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Axelera AI differentiates against incumbent GPU vendors primarily through superior energy efficiency,
              predictable edge thermal budgets, and transparent list pricing across its developer store. Its European
              roots and technical advisory heritage from imec and leading academic institutions provide strategic
              differentiation in sovereign AI infrastructure initiatives. Nevertheless, significant technical and
              operational risks persist across the stack. On the software front, the Voyager SDK utilizes a
              pipeline-centric graph execution model analogous to NVIDIA DeepStream, requiring developers to construct
              workflows using pre-configured nodes rather than deploying raw ONNX or PyTorch weights directly. Technical
              reviewers note that this pipeline structure and the associated Deploy tool introduce a steep learning
              curve and uninformative error messaging when porting custom non-standard neural architectures.
              Furthermore, managing the dual roadmap of edge silicon sustaining engineering alongside datacenter server
              systems introduces profound execution complexity. Designing high-power server boards, CXL coherent
              fabrics, and direct liquid cooling systems requires specialized enterprise systems capabilities that
              remain unproven at volume scale compared to mature datacenter accelerator incumbents.
            claimRefs:
              - CE006
              - CE009
              - CE011
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Silicon Energy Efficiency via Digital In-Memory Computing
            body: >-
              By implementing Digital In-Memory Computing directly in SRAM arrays, Axelera AI circumvents the
              conventional von Neumann memory wall, delivering up to 214 TOPS of inference performance at substantially
              lower power consumption and thermal dissipation than traditional edge GPUs.
            calloutType: strength
            claimRefs:
              - CE001
              - CE007
          - type: callout
            title: Developer Friction from Pipeline Rigidity and Host Incompatibilities
            body: >-
              Axelera's proprietary Voyager SDK enforces a rigid pipeline-centric structure that complicates custom
              neural network deployment compared to native PyTorch runtimes, while documented detection failures on
              non-Intel host platforms introduce adoption friction for embedded device manufacturers.
            calloutType: risk
            claimRefs:
              - CE006
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Architecture
        blocks:
          - type: paragraph
            body: >-
              Axelera AI targets four primary buyer and deployment segments spanning edge physical devices to regional
              AI server infrastructure: Industrial and Embedded OEMs, Enterprise and Private Cloud Operators, Edge AI
              Solution Integrators, and Sovereign Infrastructure consortia. The initial customer base deployed the Metis
              AIPU in embedded PCIe and M.2 modules for real-time video analytics, automated optical inspection, and
              robotic vision where thermal dissipation and wattage ceilings prevent conventional GPU usage. With the
              launch of the Europa AIPU in September 2026, Axelera expanded into data center and private cloud
              environments, partnering with system vendors such as Dell Technologies, Supermicro, 2CRSi, and Advantech
              to target enterprise customers requiring local inference on controlled infrastructure. Economic buyers in
              these segments are primarily VP/Directors of Engineering, Embedded Systems Leads, and Chief Technology
              Officers seeking to eliminate cloud token latency and recurring API expenses while complying with strict
              European data residency mandates.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption Trajectory and Production Milestones
        blocks:
          - type: paragraph
            body: >-
              The company's commercial trajectory demonstrates rapid customer account expansion alongside substantial
              pipeline scaling, though disclosed metrics lack clear volume breakdown per customer account. At its Series
              B financing in June 2024, Axelera reported visibility into a commercial pipeline exceeding $100 million
              for its Metis platform. By February 2026, coincident with its $250 million funding round, the firm
              announced shipment to its 500th global customer across physical AI and edge deployments. By September
              2026, following the release of the Europa platform, Axelera claimed deployments with more than 600
              customers globally and a qualified sales pipeline surpassing $1.5 billion. However, because Axelera sells
              developer kits, individual PCIe evaluation cards, and system-level integrations through distribution
              partners like Advantech, the proportion of these 600 accounts operating at full industrial production
              scale versus early evaluation or single-unit prototyping remains unverified in public disclosures.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU007
              - CU009
              - CU010
      - number: '6.3'
        title: Named Customer Deployments and Integration Evidence
        blocks:
          - type: paragraph
            body: >-
              Axelera relies heavily on strategic OEM and systems integration partners to validate hardware performance
              and drive field deployments across regulated verticals. Industrial IoT leader Advantech deepened its
              collaboration by co-developing edge acceleration modules including the EAI-3841 series powered by Europa
              delivering up to 629 TOPS, complementing its established AIR-410/420/510 systems that integrate Metis
              cards. In enterprise servers, Axelera achieved validated system configurations with Dell Technologies
              (PowerEdge XE5) and Supermicro (111AD), as well as European server builder 2CRSi. Direct customer
              testimonials span aerospace and defense (a leading European aircraft manufacturer evaluating cabin
              electronics; Safran integrating Metis into optronic edge systems), telecommunications (Telefónica Tech
              deploying edge robotics nodes), and private cloud (OVHcloud evaluating sovereign inference hosting). While
              these named partnerships demonstrate reference quality across tier-one European enterprises, most
              disclosed engagements remain structured as early access programs, OEM integration partnerships, or
              co-engineering validations rather than multi-year committed volume procurement contracts.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Retention Durability, Channel Dependency, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Axelera's commercial expansion strategy faces notable structural risks regarding revenue concentration,
              net retention durability, and channel gatekeeping. The company does not publicly disclose Net Revenue
              Retention (NRR), Gross Revenue Retention (GRR), customer churn rates, or average contract values (ACV). A
              substantial portion of end-customer fulfillment is mediated by hardware OEMs and distributors—most
              prominently Advantech—which introduces channel concentration risk and insulates Axelera from direct
              visibility into end-user software workload renewal. Furthermore, Advantech simultaneously integrates
              competing accelerators from Intel, Qualcomm, NVIDIA, and Hailo, creating ongoing internal product
              competition within Axelera's primary distributor channel. In sovereign AI and regional data centers,
              European initiatives like EuroHPC and AI Factories provide meaningful pipeline opportunities through
              integrators like E4 Computer Engineering, but long sales cycles and dependency on EU subsidies represent
              potential revenue lumpiness for private investors.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Channel Disintermediation and Distributor Alignment Risk
            body: >-
              Axelera relies heavily on industrial computing distributors like Advantech to reach mid-tier customers.
              Because Advantech concurrently bundles rival silicon from NVIDIA, Qualcomm, Intel, and Hailo into
              identical form-factors, Axelera must continuously defend its performance-per-watt advantage to prevent
              distributor displacement.
            calloutType: risk
            claimRefs:
              - CU014
              - CU016
          - type: callout
            title: European Technological Sovereignty as a Buyer Catalyst
            body: >-
              Customer selection among defense and sovereign cloud buyers (e.g., Safran, Telefónica Tech, OVHcloud,
              EuroHPC) is heavily influenced by the strategic imperative to source non-US, non-Asian semiconductor
              architectures that keep sensitive training and inference data within local jurisdiction.
            calloutType: insight
            claimRefs:
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Residual risk is dominated by execution evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest risk signal is not a disclosed lawsuit or incident; the assigned evidence contains no
              regulator, court, recall, or independently documented security-incident record. That absence is an
              evidence gap, not proof that no event exists. The residual-risk ranking therefore emphasizes what can be
              tested: current product shipment and manufacturing quality, field accuracy in sensitive security use
              cases, privacy controls, liquidity, and concentration. Public evidence is weighted toward Axelera AI and
              related-party releases, while a current shipment, yield, failure-rate, customer-concentration, cash-burn,
              and runway package is unavailable. The heatmap is a qualitative diligence triage, not a probability model.
            claimRefs:
              - CR010
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.2'
        title: Privacy, biometric use, and sector rules need deployment-level proof
        blocks:
          - type: paragraph
            body: >-
              Axelera AI itself identifies data residency, biometric privacy, and evolving AI governance as constraints
              in physical-security deployments. Its demonstrated mitigation is architectural: raw footage remains on
              site and only event data is transmitted. That can reduce data movement, but it does not by itself
              establish lawful basis, retention controls, model-bias governance, certification, or compliance in each
              jurisdiction. The PwC collaboration likewise says proposed use cases will be considered within relevant
              governance, regulatory, and operational frameworks, but it is an announced approach rather than evidence
              of approvals. Investment should require a jurisdiction-by-use-case compliance matrix, incident history,
              DPA templates, and certification inventory.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR015
              - CR016
      - number: '7.3'
        title: Demonstration strength has not yet closed production and reliability risk
        blocks:
          - type: paragraph
            body: >-
              The 2026 security demonstration shows a complex system spanning three video streams, three PCIe cards,
              multiple models, and four software partners. It also acknowledges that false positives create operational
              disruption and alert fatigue while false negatives are more serious. Those disclosures make accuracy,
              calibration, and field monitoring core product risks rather than peripheral concerns. Voyager's
              one-toolchain and model-support claims are relevant mitigations, but they remain company claims without
              independent production reliability evidence in this pool. Historical launch and production targets,
              followed by an expected first-half 2026 Europa shipment date, make current shipment status, foundry
              capacity, yield, returns, and support burden decisive diligence items.
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR010
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Ecosystem breadth mitigates single-party risk but increases execution load
        blocks:
          - type: paragraph
            body: >-
              Financing and partner breadth provide some resilience: the company reported a $68 million Series B that
              brought total funds raised to $120 million, lists institutional and public-program backers, and
              demonstrated four ISV integrations. These facts do not reveal cash available, burn, runway, preference
              terms, or supplier concentration. Likewise, a reported pipeline above $100 million is not revenue or
              contracted backlog, and the PwC collaboration is an announced go-to-market mechanism without disclosed
              commercial terms or outcomes. Thesis break triggers are failure to substantiate qualified production,
              acceptable field error rates, at least 18 months of downside runway, manageable top-customer and supplier
              exposure, and deployment-specific compliance readiness.
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR011
              - CR012
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment kill criteria
            body: >-
              Pause investment if diligence cannot substantiate qualified production and supplier resilience, acceptable
              field error rates, deployment-specific compliance, manageable customer concentration, and at least 18
              months of downside liquidity after committed roadmap spend.
            calloutType: risk
            claimRefs:
              - CR010
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The appropriate decision is research-more, not buy or pass. An independent tear sheet reports a $1 billion
              valuation for February 2026, but the same source states that EV/revenue was not disclosed for any round
              and leaves revenue and profitability blank. Company-issued 2026 materials report more than $450 million of
              cumulative financing, but explicitly combine equity, grants, and venture debt; that total is therefore
              neither a clean equity capitalization measure nor evidence of cash currently available. Public evidence
              supports financing capacity and a meaningful commercial signal, but it does not support a revenue
              multiple, cash-flow method, or defensible fair-value range. Entry discipline should be tied to verified
              operating data and security terms rather than the headline private-company mark.
            claimRefs:
              - CV001
              - CV004
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV011
              - CV013
              - CV016
      - number: '8.2'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that a well-funded European inference-chip vendor has moved beyond formation into product
              and customer deployment. Axelera says its 2024 business pipeline exceeded $100 million, its 2026
              announcement marked shipment to a 500th global customer, and its current Voyager software supports more
              than 100 models through one toolchain. Dealroom independently maps 287 employees and 16 investors, which
              is consistent with an organization built for scale. The anti-thesis is evidentiary: pipeline is not
              revenue, a shipped-customer count does not disclose order size or retention, and the retained sources do
              not provide gross margin, burn, runway, signed backlog, or customer concentration. Financing scale can
              fund execution, but cannot by itself prove durable unit economics or an attractive entry price.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
      - number: '8.3'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              The financing history shows accelerating access to capital, but public summaries use different taxonomies.
              The company reported a $68 million Series B in June 2024 that brought total raised to $120 million,
              followed by a 2026 round of more than $250 million. Its syndicated 2026 release says lifetime financing
              exceeded $450 million across equity, grants, and venture debt. The independent tear sheet reports $446
              million-plus across seven rounds, while Tracxn reports $450 million across nine rounds. Those totals are
              directionally aligned, but the round counts are not; the difference likely reflects treatment of grants,
              credits, extensions, or seed events and should not be resolved by assumption. The $1 billion tear-sheet
              mark is a useful reference point, not independently verified transaction pricing.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV012
              - CV013
      - number: '8.4'
        title: Scenarios, Exit Readiness, and Diligence Gates
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should remain milestone-based until audited economics are available. A bull case
              requires the reported customer and pipeline signals to convert into repeat production revenue with
              sustainable gross margin and manageable working-capital needs. The base case is continued product and
              customer progress without enough disclosure to re-rate the February 2026 mark. The bear case is that
              financing masks slow conversion, high capital intensity, or preference overhang, producing a down round or
              weak common equity recovery. No numeric probability or valuation range is supportable from the retained
              evidence. Exit readiness depends on audited financials, cohort-level customer proof, cap-table and
              preference disclosure, debt and grant conditions, manufacturing commitments, and a credible path to public
              reporting or strategic acquisition diligence.
            claimRefs:
              - CV008
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research More; Do Not Underwrite the Headline Mark
            body: >-
              Treat the reported $1 billion valuation as a reference, not fair value. Require audited revenue, gross
              margin, burn, runway, backlog conversion, customer concentration, and security terms before setting an
              entry price or target return.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV013
              - CV016
          - type: callout
            title: Funding Is Not Cash Available
            body: >-
              The company-reported total above $450 million combines equity, grants, and venture debt. Without uses of
              funds, debt terms, grant restrictions, and current cash, it cannot establish runway or capital adequacy.
            calloutType: risk
            claimRefs:
              - CV004
              - CV015
