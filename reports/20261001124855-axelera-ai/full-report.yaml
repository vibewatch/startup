            title: The CUDA Moat and the Unverified Benchmark Deficit
            body: >-
              While Axelera claims up to 6x higher energy efficiency than incumbent GPUs, the absence of independent
              MLPerf inference benchmarks creates diligence friction for enterprise buyers. Furthermore, Nvidia's
              extensive software ecosystem, accumulated operator libraries, and developer familiarity represent a
              substantial barrier to displacing GPUs in production workflows.
            calloutType: risk
            claimRefs:
              - CP008
