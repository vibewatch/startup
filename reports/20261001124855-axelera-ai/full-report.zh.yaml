chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Axelera AI 于 2021 年 7 月注册成立，总部设在荷兰埃因霍温。公司开发针对推理负载的 AI 加速硬件及配套软件，将 Metis 和 Europa 平台定位于边缘及数据中心应用。Voyager
              SDK 属于软件层，用于在 Axelera
              各产品线中编译、量化和部署模型。因此，这属于半导体平台业务而非纯软件供应商：产品落地取决于芯片供应能力、软件易用性及客户集成度。公开资料确立了其产品类别与总部所在地，但未披露当前定价、确认营收、毛利率，亦未公开评估系统与量产部署的结构占比。
            claimRefs:
              - CO001
              - CO002
              - CO003
