            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO011
              - CO013
              - CO015
              - CO016
      - number: '1.2'
        title: 领导团队与公司治理
        blocks:
          - type: paragraph
            body: >-
              Fabrizio Del Maffeo 仍担任公开的首席执行官兼联合创始人，Jonathan Ballon 则出任董事长。现有证据证实两位高管职位的连续性，并显示其具备相关半导体与边缘 AI
              经验，但未提供当前完整高管名册、委员会架构、表决权或创始人持股比例。这导致公司在战略制定、融资叙事及商业化推进上，对首席执行官形成显著的关键人依赖。Ballon
              出任董事长增添了运营与治理经验，然而所分配证据集中没有任何信源能够证实董事会独立性、保留事项、继任计划，或创始人与机构投资者之间的控制权分配。
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
      - number: '1.3'
        title: 资本形成与运营规模
        blocks:
          - type: paragraph
            body: >-
              融资历程从 2021 年 $12 million 种子轮起步，历经 2022 年 $27 million A 轮、据报道 2023 年累计募资 $50 million，以及 2024 年 $68 million
              B 轮。2026 年 2 月，公司宣布完成一轮逾 $250 million 融资，由 Innovation Industries 领投，新投资方 BlackRock、SiteGround Capital
              以及现有战略与公共部门投资者参投。Axelera 另行表示自成立以来已累计吸引资金超 $450 million，明确涵盖股权、补贴和风险债务；该数字并非营收、在手现金或纯股权融资。公司还宣称已迎来第 500
              家全球客户，而 Dealroom 统计出 287 名员工，但这属于不透明的第三方统计，不应视作经公司确认的在职人数。
