  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与架构分类
        blocks:
          - type: paragraph
            body: >-
              人工智能加速芯片的竞争阵营分为超大规模云数据中心与严苛受限的边缘部署两大领域。传统半导体厂商历来针对供电充沛的集中式数据中心优化芯片，而边缘应用则对能效提出极端要求。在边缘 AI
              推理领域，超过六百亿美元的风险投资催生出大量早期初创芯片企业，竞争格局高度拥挤。Axelera AI 不仅直面传统 GPU 巨头（尤其是 Nvidia）的竞争，还要与 Hailo、SiMa.ai 等专注边缘 AI
              处理器的初创公司角逐。Axelera 试图借助其第二代 Europa 架构打破市场碎片化格局，通过 PCIe 规格形态与定制主板，向工业制造、机器人及国防领域的逾 500 家商业客户出货。
            claimRefs:
              - CP001
              - CP002
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: 硬件算力密度与基准测试验证
        blocks:
          - type: paragraph
            body: >-
              Axelera 依托数字存内计算并结合 16 颗 RISC-V 矢量核心实现芯片差异化，旨在最大限度减少持续推理任务中的内存数据搬运。公司宣称其 Europa 处理器基于 Samsung 5 纳米工艺制造，在
              45 watt 功耗预算下可提供 629 TOPS 算力。然而，独立技术评测强调，Axelera 尚未公布经审计且由第三方复现的基准测试套件（如
              MLPerf）。其发布的宣传图表仅依赖内部测试与竞品公开数据的对比。尽管架构指标表明其在视觉和语言工作负载上具备极高理论能效，但在关键企业级工作流中替换既有加速卡前，采购团队仍需要可核验的应用级基准测试数据。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP008
