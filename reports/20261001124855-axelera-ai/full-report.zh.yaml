        - from: commercial-signal
          to: product-signal
        - from: product-signal
          to: definition-risk
        - from: definition-risk
          to: valuation-gap
        - from: valuation-gap
          to: decision
    approximationNotes: 该序列为定性推导，未赋予数值权重、概率或隐含估值。
