        - 投资判断不确定性高
        - 中
        - 仅在经济模型与下行保护明晰后方可确定敞口规模
      - - 估值立场
        - $1B 参考基准；缺乏可支撑的公允价值区间
        - 中低
        - 基于已验证的基本面开展谈判，而非融资头条新闻
      - - 目标回报
        - 公开证据无法支撑
        - 低
        - 仅在获取入场价格、稀释比例及优先股堆叠后建立回报模型
      - - 持有与退出
        - 以里程碑为关口
        - 低
        - 要求具备重复性生产收入，并达到公开披露或战略退出就绪状态
    notes: 证据截至 2026-10-01；投资建议受限于缺失的运营财务数据、当前现金、股权结构表条款及经核实的客户经济模型。
    claimRefs:
      - CV001
      - CV004
      - CV013
      - CV014
      - CV015
      - CV016
  - id: TV002
    title: 投资论点与反方论点表
    columns:
      - 维度
      - 论点证据
      - 反方论点或局限
      - 改变观点的条件
    rows:
      - - 商业信号
        - 公司报道称 2024 年意向商机达 $100M+，且 2026 年向第 500 位客户出货
        - 意向商机不等于收入；客户数量缺乏订单金额、留存率及集中度数据
        - 经审计的收入桥接、订单转化、客户群组及集中度明细表
      - - 产品采用
        - 公司称 Voyager 通过单一工具链支持 100+ 种模型
        - 模型支持广度并不能证明生产环境利用率或替换经济性
        - 独立部署基准测试以及按工作负载划分的付费生产用量
      - - 组织规模
        - Dealroom 统计显示有 287 名员工和 16 家投资方
        - 团队和投资团规模并不能确立生产率、利润率或跑道长度
        - 人员编制计划、职能分配、资金消耗率以及招聘至收入的产出效率
      - - 资本获取能力
        - 公司报告称通过股权、补贴及风险债权累计筹集逾 $450M
        - 混合融资类别掩盖了股权稀释、限制条件、杠杆水平以及剩余现金
        - 完全稀释后的股权结构表、优先股堆叠、债务明细、补贴条款及现金余额
    notes: 公司发布的商业与产品数据按其主张保留，而不视作经过独立验证的实际业绩。
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 所需假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 客户数量与意向商机转化为持续的生产性收入；毛利率与营运资金支撑规模扩张
        - 相较于 $1B 参考基准，上行空间需要经核实的增长、可持续利润率以及有限稀释；目前无法支撑量化区间
        - 转化不及预期、制造产能承诺、软件采用阻力或新发优先证券
        - 仅在获得经审计的转化、利润率及留存证据后方能增强
      - - 基准
        - 产品与客户拓展持续推进，但运营经济模型仍仅部分披露
        - $1B 参考基准依然未获验证；在缺乏入场价格与证券条款的情况下无法计算目标回报
        - 尽职调查推进缓慢、资本密集度高，以及无法区分试点项目与正式投产
        - 在公开运营证据尚不充分的情况下的当前核心基准情景
      - - 悲观
        - 意向商机转化迟缓、现金消耗高企，或者补贴与债务所提供的资本灵活性低于头条新闻所暗示的水平
        - 降轮融资与优先清算积压风险占据主导；无法从累计融资金额中推断下行底部
        - 客户集中度高、利润率疲软、融资限制条款或近期资金需求
        - 若跑道、转化率或清算优先权尽调未达预期，该概率将上升
    notes: 情景分析为定性评估，因为保留来源未披露经审计的收入、盈利能力、资金消耗率、跑道、入场条款或优先股堆叠。
    claimRefs:
      - CV001
      - CV004
      - CV008
      - CV013
      - CV014
      - CV015
      - CV016
