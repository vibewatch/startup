  - id: FE001
    title: Axelera AI 端到端技术栈架构
    type: stack
    summary: 分层架构图，详述从芯片算力到开发者推理工具链的完整层级。
    data:
      layers:
        - label: 应用与智能体工具层
          detail: Axelera Wingman 自然语言流水线生成、计算机视觉、具身智能机器人及边缘生成式 AI 应用。
        - label: 流水线与框架层
          detail: 声明式 YAML 流水线定义、包含 100+ 预训练模型的 Voyager Model Zoo，以及 ONNX/PyTorch 执行运行时。
        - label: 编译器与软件 SDK 层
          detail: Voyager SDK 量化引擎、模型编译计算图优化器以及定制 Deploy 转换工具。
        - label: 平台管理与遥测层
          detail: BMC/IPMI/Redfish 带外遥测、UEFI/BIOS 固件、安全启动信任根与企业级 RAS 控制。
        - label: 系统集成与板卡规格层
          detail: Metis M.2 2280 边缘卡、Metis M.2 Max、标准 PCIe 加速卡、OAM 模块以及 1U/2U 服务器机箱。
        - label: 芯片架构与执行核心层
          detail: 专有数字存内计算（D-IMC）SRAM 阵列、集成 RISC-V 控制核心与高速 SerDes 互连。
    approximationNotes: 结构分层参考已发布的 Voyager SDK 文档、专利/白皮书披露的技术细节以及数据中心硬件招聘信息。
