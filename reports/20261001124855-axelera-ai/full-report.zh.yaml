      - number: '3.3'
        title: 分销渠道与地缘战略定位
        blocks:
          - type: paragraph
            body: >-
              缺乏可靠的服务器分销渠道和系统集成能力，单凭硬件性能参数无法赢得企业级客户。Axelera 通过与 Dell（基于 XE5 平台）及 Supermicro（基于 111AD
              服务器）建立服务器集成合作，降低了客户准入测试门槛。此外，公司在欧洲高性能计算生态中锁定了战略席位，包括在耗资 EUR290 million 的意大利 IT4LIA 超级计算机中与 SiPearl
              处理器协同构建专属推理分区。Axelera 将其欧洲总部身份和开放的 RISC-V
              指令集转化为差异化战略优势，为企业及主权买方提供有力工具，对冲单一地域供应链断裂、外国出口管制以及专有平台遥测不透明带来的潜在风险。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP011
      - number: '3.4'
        title: 软件生态锁定、商业定价与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              新兴半导体厂商面临的最严峻壁垒，在于 Nvidia 成熟的 CUDA 软件栈、庞大算子库以及广泛开发者生态所构筑的切换成本。Axelera 推出 Voyager 软件开发套件抗衡这种生态锁定，支持逾 100
              种模型在无需重训练的前提下进行声明式流水线配置。然而，Europa 加速卡与芯片的公开定价仍处于黑箱状态，完全依赖企业销售渠道与 OEM
              报价协商。缺乏透明的批量阶梯定价，直接阻碍了与成熟竞品开展总体拥有成本（TCO）的严密对比。归根结底，Axelera 的竞争壁垒能否持久，取决于其能效比优势与欧洲主权定位是否足以压倒现有软件生态的锁定效应。
            claimRefs:
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP009
              - CP012
              - CP015
      - number: '3.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: CUDA 护城河与基准测试未验赤字
            body: >-
              尽管 Axelera 宣称其能效最高可达主流 GPU 的 6 倍，但由于缺乏独立的 MLPerf 推理基准测试，导致企业采购面临尽调阻力。此外，Nvidia
