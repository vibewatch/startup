        title: 产品定义、硬件形态与 SKU 布局
        blocks:
          - type: paragraph
            body: >-
              Axelera AI 打造专为网络边缘与工业环境定制的人工智能推理加速硬件平台。公司避开功耗极高、由数据中心 GPU 主导的模型训练市场，转而专注于高能效运行预训练计算机视觉及生成式 AI
              任务。其商业化边缘硬件产品系列围绕 Metis AI 处理单元构建，在 INT8 精度下基础算力达 214 TOPS。Axelera
              将该芯片封装为多种标准物理形态，以适应不同的落地环境：包括面向嵌入式系统、无人机和边缘网关的紧凑型 Metis M.2 加速卡；为视觉语言模型提供双芯算力的高密度 Metis M.2 Max
              模块；以及专为工业电脑、边缘服务器和多路视频设备设计的标准 Metis PCIe 板卡。为降低企业买方的概念验证门槛，Axelera 与 Dell、Lenovo 等主流 OEM 厂商联合交付开箱即用的 Metis
              评估系统。截至 2026 年 2 月，公司公布已向全球第 500 家客户交付产品，涵盖机器人、工业制造和安防等物理 AI 领域，但在多元硬件生态中持续量产交付的可靠性仍有待技术实测检验。
