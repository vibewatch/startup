      - number: '5.3'
        title: 部署工作流、数据中心扩张与平台架构
        blocks:
          - type: paragraph
            body: >-
              在边缘生产环境中，Axelera AI 加速卡负责处理高吞吐量的物理 AI
              任务，例如多路视频监控分析、流水线视觉质检以及零售货架监控等对低延迟和本地数据隐私要求严苛的场景。然而，第三方技术评测揭示了实际的平台集成摩擦。实测表明，Metis M.2 卡在标准 Intel PC
              架构上运行稳定，但在测试的 AMD 桌面配置及 NVIDIA Jetson 嵌入式载板上均无法识别，暴露出对宿主机固件和 PCIe 根联合体的强依赖。在推进边缘部署的同时，Axelera
              正在向企业级数据中心基础设施推进重大战略扩张。在 2026 年初完成 $250 million 融资后，公司成立了 AI 基础设施系统工程部门，全力推进下一代 Europa 推理处理器交付。这一数据中心路线图涵盖
              PCIe Gen6 与 CXL 加速卡、开放加速模组（OAM）底板，以及集成了 BMC 遥测、Redfish 管理协议和高级企业级 RAS（可靠性、可用性、可维护性）特性的高密度 1U/2U 服务器机箱。
