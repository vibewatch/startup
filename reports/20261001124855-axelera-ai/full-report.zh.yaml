      - number: '5.2'
        title: 技术架构：数字存内计算与 Voyager SDK
        blocks:
          - type: paragraph
            body: >-
              Axelera AI 的核心架构差异化根植于数字存内计算（D-IMC）技术，并深度融合了开放标准的 RISC-V
              控制核心。传统冯·诺依曼计算机架构在独立存储单元与计算核心之间搬运权重和激活值时，会产生显著的延迟与能耗开销，这一瓶颈被称为「存储墙」。Axelera 的 Metis AIPU 直接在数字域的 SRAM
              存储阵列内部执行矩阵计算，兼具出色的算力密度与热性能，同时彻底规避了模拟存内计算方案的噪声敏感缺陷。该架构设计在 2021 年 12 月流片的 Thetis Core 试验芯片上获得验证，在小于 9
              平方毫米的紧凑裸片面积内实现了 INT8 精度下 39.3 TOPS 算力与 14.1 TOPS/W 的高能效。在芯片硬件之上，Axelera 构建了端到端工具链 Voyager SDK，具备声明式 YAML
              流水线描述语言、自动化模型量化能力，以及包含 100 多个预训练视觉模型的 Model Zoo。为进一步加速流水线开发，公司还推出了 Axelera
              Wingman，这是一款领域专用智能体编程助手，可直接根据自然语言指令构建和调试 Voyager 部署图。
            claimRefs:
              - CE007
              - CE008
              - CE010
              - CE012
              - CE014
