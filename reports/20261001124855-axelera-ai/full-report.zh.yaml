          label: 产品信号
          detail: Voyager 被展示为支持 100+ 种模型的统一工具链
        - id: definition-risk
          label: 口径定义风险
          detail: 公开追踪平台对于累计融资轮次究竟是 7 轮还是 9 轮存在分歧
        - id: valuation-gap
          label: 估值缺口
          detail: $1B 参考基准缺乏配套的营业收入、盈利能力或 EV/Revenue 估值倍数数据
