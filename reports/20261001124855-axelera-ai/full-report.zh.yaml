  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >
              Axelera 的目标市场相较于整体 AI 半导体市场更为收敛。其公开界定的业务范围涵盖嵌入式设备、边缘系统及企业级服务器的推理加速，重点面向计算机视觉、机器视觉、生成式
              AI、视觉语言模型以及智能体工作负载。前沿大模型训练集群、通用云端算力消耗和消费级设备神经处理单元均不在此范畴内。实际替代方案包括公有云推理、基于 GPU 的本地系统、纯 CPU
              处理以及完全推迟自动化改造。界定这一边界最强有力的逻辑在于运营考量而非抽象分类：当延迟、带宽、数据掌控力、功耗或散热条件促使本地推理成为更优解时，相关工作负载才具备切入价值。标准 PCIe
              产品与现有摄像头复用或许能减少替换成本，但两者都不能证明买方会发生大规模迁移。
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM016
      - number: '2.2'
        title: 基于有限证据的市场规模测算
        blocks:
          - type: paragraph
            body: >
              现有证据仅提供一项宏观金额基准、两份公司管线快照以及一项早期联网设备保有量预估；各指标间不可混为一谈。IDC 预测至 2027 年底全球 AI 半导体 IT 基础设施市场达 $193
              billion，这一规模包含了超出 Axelera 纯推理范围的支出。Axelera 于 2024 年 6 月公布商业商机管线超 $100 million，并在 2026 年 9 月公布销售管线超 $1.5
              billion，但商机管线既非营收、ARR、订单签约额，亦非现金储备或市场规模，且证据集未披露转化率。imec 在 2021 年预计到 2030 年联网设备将超 125 billion
              台，这属于需求背景指标而非实际芯片支出。根据当前证据，无法测算出具备充分依据的金额型 SAM、SOM 或 CAGR。
