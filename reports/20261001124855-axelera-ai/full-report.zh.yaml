      - number: '2.3'
        title: 买方细分、预算归属与落地路径
        blocks:
          - type: paragraph
            body: >
              采购决策权因部署场景而异。嵌入式与边缘产品通常始于 OEM
              或产品工程团队，他们必须在具体设备中适配加速器硬件、软件、热设计及模型支持。工业、零售、安防、机器人和无人机部署场景还会引入运营主管和系统集成商，原因在于加速器仅是完整工作流中的单一组件。企业级推理则将决策权转向基础设施负责人，同时安全、合规及数据治理利益相关方会影响工作负载是否保留在本地。因此，落地路径从工作负载评估、模型迁移，延伸至硬件验证、系统集成、量产试点，最终实现规模化设备或服务器交付。标准
              PCIe 规格形态、经认证的 OEM 系统、软件配套以及存量摄像头复用可缩短这一周期，但 ROI 和预算数据的缺失仍是关键尽调盲区。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM006
              - CM013
              - CM016
      - number: '2.4'
        title: 增长驱动力、落地瓶颈与估值关联
        blocks:
          - type: paragraph
            body: >
              在留存证据中，功耗与散热限制、云端运营成本、网络延迟、隐私、安全以及数据驻留要求构成最明确的需求驱动因素。截至 2026 年 9 月，Axelera 官方公布逾 600 家客户部署与超 $1.5 billion
              销售管线，显示出广泛客群接触面，但并未证实已确认营收或持续稳定的量产规模。核心阻碍在于落地执行：企业需要广泛模型支持、可预测软件表现、成熟验证系统，以及能够证明能效比宣称在其自身工作负载中切实成立的独立验证。NetworkWorld
              特别指出，Axelera 的能效对比数据融合了内部测试与公开竞品数据，亟需更广泛的独立实测检验。因此，估值模型必须将站得住脚的推理需求逻辑，与尚未经验证的市场份额、商机转化率、定价和毛利率假设严格区分开来。
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
              - CM014
              - CM015
      - number: '2.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 推理需求由物理与业务边界驱动
            body: 当推理任务必须受制于现有的功耗、散热、延迟、带宽或数据管控边界时，投资逻辑最为坚实。相比宽泛 AI 半导体预测报告中的自上而下渗透率推算，这类实际物理约束更能真实反映买方的采购紧迫度。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM014
          - type: callout
            title: 商业信号不能推导市场份额
            body: 官方通报逾 600 家客户部署及超 $1.5 billion 销售管线，反映出客群接触广度，但由于未披露商机阶段构成、转化率、定价水平、实际出货量和已确认营收，无法得出具备说服力的 SOM 或市场份额估算值。
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
