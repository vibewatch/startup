evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      A complete current executive and statutory-board roster with founder ownership, committee roles, reserved matters
      and succession arrangements.
    whyItMatters: The public record cannot establish control, board independence or resilience to key-person loss.
    diligencePath: >-
      Obtain the current organization chart, constitutional documents, board minutes, committee charters and founder
      employment agreements.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investors
    missingEvidence: The complete capitalization table, instrument schedule and investor-rights matrix after the 2026 financing.
    whyItMatters: Named participants do not reveal ownership, liquidation preferences, dilution, voting control or debt seniority.
    diligencePath: Review the fully diluted cap table, financing documents, side letters, debt agreements and grant covenants.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: Audited revenue, run-rate, gross margin, cash balance, burn, debt balance and transaction valuation.
    whyItMatters: Public funding announcements cannot establish operating performance, runway, liquidity or valuation.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, bank statements, debt schedules and the 2026
      term sheet.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Authoritative legal and regulatory checks for litigation, sanctions, outages, recalls, security incidents and
      material customer disputes.
    whyItMatters: No retained result from the adverse query does not prove that no adverse event exists.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, sanctions and incident-database searches and obtain management
      representations.
    relatedQuestionRefs:
      - QO006
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A company-confirmed current employee count and the methodology behind Dealroom's mapped-employee figure.
    whyItMatters: The third-party count may include stale profiles, contractors or incomplete geographic coverage.
    diligencePath: Reconcile HRIS records, payroll by legal entity and contractor rosters to the public profile.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent market data that isolates edge and enterprise inference accelerator spend by geography, workload, and
      buyer, plus a defensible CAGR.
    whyItMatters: >-
      Without a consistent spend denominator, a monetary SAM or growth rate would be fabricated from a broader
      AI-semiconductor forecast.
    diligencePath: >-
      Obtain an independent analyst dataset with segment definitions and reconcile it to Axelera's eligible products and
      geographies.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-conversion
    missingEvidence: >-
      Pipeline stage mix, probability weighting, average selling price, shipments, recognized revenue, renewal or
      repeat-order behavior, and customer concentration.
    whyItMatters: >-
      The reported customer and pipeline figures cannot establish production adoption, revenue quality, obtainable
      share, or valuation support without conversion evidence.
    diligencePath: >-
      Review CRM stage definitions, signed purchase orders, shipment records, cohort revenue, gross margins, and audited
      financial statements.
    relatedQuestionRefs:
      - QM007
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Customer-specific ROI, budget ownership, procurement timing, switching costs, and total-cost comparisons against
      cloud, GPU, CPU, and no-deployment alternatives.
    whyItMatters: >-
      Buyer urgency and deployment scale depend on realized economics rather than technical capability or a broad market
      forecast.
    diligencePath: >-
      Interview reference customers and inspect approved business cases, competitive bake-offs, implementation budgets,
      and production rollout plans.
    relatedQuestionRefs:
      - QM005
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: benchmark-validation
    missingEvidence: >-
      Independent, workload-matched benchmarks covering performance, accuracy, host-system power, software maturity, and
      total cost across production models.
    whyItMatters: >-
      Vendor-reported performance-per-watt may not persist across buyer workloads, and migration economics depend on the
      complete system and software stack.
    diligencePath: >-
      Commission independent benchmarks using customer models, identical precision and quality targets, complete host
      power, and end-to-end application measurements.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: benchmark-transparency
    missingEvidence: >-
      Audited, third-party reproduced MLPerf inference benchmark results for Europa silicon across standard computer
