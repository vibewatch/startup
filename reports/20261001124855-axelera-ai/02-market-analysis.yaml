callouts:
  - calloutType: "insight"
    title: "Inference Demand Is Constraint-Driven"
    body: "The investable market thesis is strongest where inference must fit existing power, cooling, latency, bandwidth, or data-control constraints. Those constraints define buyer urgency more reliably than a top-down share of the broad AI-semiconductor forecast."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM014"
  - calloutType: "risk"
    title: "Commercial Signals Do Not Establish Market Share"
    body: "More than 600 reported customer deployments and a sales pipeline above $1.5 billion show breadth of engagement, but undisclosed stage mix, conversion, pricing, shipments, and recognized revenue prevent a defensible SOM or market-share estimate."
    claimRefs:
