  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Case"
      - "Required assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - - "Bull"
        - "Customer count and pipeline convert into repeat production revenue; gross margin and working capital support scale"
        - "Upside to the $1B reference requires verified growth, durable margin, and limited dilution; no numeric range is supportable"
        - "Conversion shortfall, manufacturing commitments, software adoption, or new senior securities"
        - "Strengthens only after audited conversion, margin, and retention evidence"
      - - "Base"
        - "Product and customer activity continue, but operating economics remain only partly disclosed"
        - "The $1B reference remains unvalidated; target return cannot be calculated without entry and security terms"
        - "Slow diligence closure, capital intensity, and inability to distinguish pilots from production"
        - "Current central case while public operating evidence remains incomplete"
      - - "Bear"
        - "Pipeline converts slowly, cash consumption is high, or grants and debt provide less flexible capital than headlines imply"
        - "Down-round and preference-overhang risk dominate; no downside floor can be inferred from cumulative funding"
        - "Customer concentration, weak margin, financing restrictions, or need for near-term capital"
        - "Rises if runway, conversion, or preference diligence fails"
    notes: "Scenarios are qualitative because retained sources do not disclose audited revenue, profitability, cash burn, runway, entry terms, or a preference stack."
    claimRefs:
