  - id: TP003
    title: Commercial Packaging, Pricing Models, and Channel Implications
    columns:
      - Vendor & Product
      - Packaging / Form Factor
      - Commercial & Contract Model
      - Included Capabilities
      - Public Pricing & Discount Transparency
      - Buyer TCO Implication
    rows:
      - - Axelera Europa (Edge 232p & Server 250p)
        - PCIe add-in cards & custom AIPU boards
        - Direct enterprise sales, OEM server bundling (Dell/Supermicro)
        - Silicon, Voyager SDK, reference drivers, Partner Network
        - Undisclosed publicly; custom quotation via enterprise sales
        - Low recurring operational cost; capital investment dependent on volume pricing
      - - Nvidia (L40 / L4 / Jetson Orin)
        - Standard PCIe cards & embedded developer kits
        - Hardware purchase via authorized distributor & OEM tier
        - CUDA toolkit, TensorRT compiler, enterprise drivers
        - List pricing public via distributors ($2,500-$9,000 per card)
        - High hardware acquisition cost offset by immediate software compatibility
      - - Specialized Edge ASICs (Hailo-8 / SiMa.ai)
        - M.2 modules, PCIe cards, and embedded boards
        - Component purchase via distributors & industrial integrators
        - Chip, compilation tools, pre-trained model zoo
        - Partially disclosed ($150-$500 for modules depending on volume)
        - Cost-effective for dedicated vision; expensive if multi-modal retraining is required
      - - Cloud Hyperscaler Inference (AWS / Azure)
        - Virtual instances and serverless inference APIs
        - Pay-per-token or hourly GPU compute consumption
        - Fully managed infrastructure, load balancing, autoscaling
        - Fully transparent per-hour and per-million-token published rates
        - Zero upfront capex but high, unpredictable ongoing opex at sustained volume
    notes: Axelera pricing is not publicly published; unit economic comparisons rely on industry standard channel packaging and disclosed OEM server relationships.
