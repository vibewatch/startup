        - Dedicated dataflow / MLSoC NPU
        - Centralized cloud accelerator clusters
      - - Compute Density & Thermal Budget
        - 629 TOPS at 45W TDP (14 TOPS/W claimed)
        - "Varies: 300W (L40) to 15-60W (Jetson Orin)"
        - 26-50 TOPS at sub-20W power envelope
        - Elastic cloud compute; no on-premise thermal footprint
      - - Standard Server Packaging
        - Half-height half-length PCIe; Dell & Supermicro validated
        - Full PCIe and SXM cards; ubiquitous server OEM support
        - M.2, PCIe, and embedded system-on-module cards
        - No on-premise hardware; REST/gRPC API integration
      - - Software Ecosystem & Tooling
        - Voyager SDK & Wingman (100+ models; early maturity)
        - CUDA, TensorRT, Triton; comprehensive industry standard
        - Proprietary SDKs and model compilers (vision-focused)
        - Managed cloud SDKs, containerized endpoints, SaaS APIs
      - - Data Sovereignty & Local Privacy
        - High (on-premise edge; EU origin, RISC-V design)
        - High to Medium (local execution, but US vendor governance)
        - High (local execution; Israeli/US vendor governance)
        - Low (data transmitted and stored in centralized public cloud)
      - - Independent Benchmark Verification
        - Unverified (internal vendor tests only; no MLPerf submission)
        - Verified (extensive public MLPerf inference audit records)
        - Partially verified (published MLPerf edge benchmark scores)
        - Verified (standardized cloud throughput & latency benchmarks)
    notes: Axelera TOPS and efficiency figures represent vendor-reported peak ratings; Axelera has not submitted audited MLPerf benchmarks. Matrix cells reflect shipping hardware specifications as of 2026.
