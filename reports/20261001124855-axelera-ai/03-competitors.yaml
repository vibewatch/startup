callouts:
  - calloutType: risk
    title: The CUDA Moat and the Unverified Benchmark Deficit
    body: While Axelera claims up to 6x higher energy efficiency than incumbent GPUs, the absence of independent MLPerf inference benchmarks creates diligence friction for enterprise buyers. Furthermore, Nvidia's extensive software ecosystem, accumulated operator libraries, and developer familiarity represent a substantial barrier to displacing GPUs in production workflows.
    claimRefs:
      - CP008
      - CP009
  - calloutType: insight
    title: OEM Server Channels as the Qualification Accelerator
    body: By validating the Europa Edge 232p accelerator directly inside standard Dell XE5 and Supermicro 111AD servers, Axelera avoids requiring enterprises to deploy non-standard chassis architectures. This standard PCIe integration significantly compresses hardware qualification cycles across defense, robotics, and industrial manufacturing accounts.
    claimRefs:
      - CP002
      - CP006
