  notes: "Module status and maturity derived from Saviynt product pages and press releases (self-reported); analyst recognition covers IGA only; PAM, ISPM, EIM, and AAG maturity are author judgments from available evidence."

- id: TE002
  title: Workflow / use-case table
  columns:
  - User Job
  - Current Workflow (without Saviynt)
  - Saviynt Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Quarterly access certification campaign
    - Manual spreadsheets or siloed IGA tool reviews
    - SaviAI-assisted certification with risk-ranked reviewer queues
    - Reduced reviewer fatigue; faster completion cycles (magnitude not published)
    - Saviynt-reported outcomes; no independent time-savings benchmark available
  - - Privileged access for cloud infrastructure
    - Standing privileged accounts; VPN-based access; email approvals
    - Cloud PAM with JIT access grants; session recording; audit trail
    - Reduced standing privilege exposure; audit-ready session logs
    - PAM functionality depth gaps vs. CyberArk reported by reviewers
  - - Governing AI agent access to enterprise systems
    - Ad-hoc API keys; no identity lifecycle for AI agents
    - Agent Access Gateway enforcing policy in 5 supported AI ecosystems
    - Governed runtime access; AI agent identity lifecycle management
    - Launched March 2026; limited real-world deployment evidence
  - - SAP role governance and migration (2027 sunset)
    - Legacy SAP role management in BusinessObjects/GRC
    - "Saviynt for SAP: dedicated IGA module for SAP authorization objects"
    - Migration path ahead of SAP BO sunset; audit-ready SAP access reports
    - SAP module scope; requires SAP connector deployment and testing
  - - Third-party contractor onboarding and offboarding
    - Shared portal accounts; delayed deprovisioning; no lifecycle visibility
    - External Identity Management with vendor-self-service onboarding
    - Lifecycle governance; reduced dormant external accounts
