    - Shadow admin detection; AI identity misconfiguration signals
    - Limited independent production proof outside company announcements
  - - External Identity Management (EIM)
    - Procurement, vendor management, HR
    - GA; multi-org lifecycle governance
    - Contractor/supplier onboarding automation with SSO federation
    - Feature parity vs. Saviynt IGA for external personas unclear
  - - Agent Access Gateway (AAG)
    - AI ops teams, CISO, platform engineering
    - GA launch March 24, 2026; early commercial stage
    - Governs AI agents in 5 ecosystems (Bedrock, Copilot Studio, Vertex AI, ServiceNow AI, Agentforce)
