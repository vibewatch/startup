chapter:
  number: 5
  title: Product & Technology
  summary: "Saviynt's Enterprise Identity Cloud (EIC) converges five modules — Identity Governance and Administration (IGA), Cloud Privileged Access Management (PAM), Identity Security Posture Management (ISPM), External Identity Management (EIM), and Application Identity Security (Agent Access Gateway) — into a single SaaS platform claiming 100 million+ identities protected across 500+ enterprise customers. The March 2026 launch of Identity Security for AI introduced a three-pillar AI agent governance framework targeting agentic AI ecosystems (Amazon Bedrock, Microsoft Copilot Studio, Google Vertex AI, ServiceNow AI, Salesforce Agentforce). The platform holds FedRAMP Moderate authorization, ISO 27001:2022, ISO 27017, SOC 1/2 Type II, and PCI-DSS v4.0 certifications and is named Gartner Peer Insights Customers' Choice for IGA for the fifth consecutive time (April 2026). Material product risks include: Cloud PAM's de-emphasized go-to-market (no dedicated product page), documented user complaints about implementation complexity and support quality, Saviynt's absence from VentureBeat's RSAC 2026 top-five AI agent governance vendor analysis, a thin public developer footprint (three GitHub repos, six Terraform provider stars), and unverified connector breadth claims beyond the 750+ marketing figure."

sections:
- id: platform-architecture-modules
  title: Enterprise Identity Cloud — Five-Module Architecture
  body: "Saviynt's Enterprise Identity Cloud (EIC) is a cloud-native SaaS platform that converges identity governance, privileged access, posture management, external identity management, and AI agent identity governance into a single multi-tenant service. The platform claims no on-premise deployment option, distinguishing it from legacy IGA vendors that maintain hybrid architectures. Five discrete modules make up the EIC: (1) Identity Governance and Administration (IGA), the core module covering provisioning, access certification, RBAC/ABAC policy management, and SoD enforcement; (2) Cloud PAM, covering privileged access control with just-in-time access for cloud infrastructure; (3) Identity Security Posture Management (ISPM), which detects misconfigurations, shadow admin, and excessive standing privileges; (4) External Identity Management (EIM), which governs the identity lifecycle of third-party workforce including contractors, partners, and suppliers; and (5) Application Identity Security (Agent Access Gateway, AAG), the newest module governing non-human and AI agent identities at runtime.\n\nThe platform is underpinned by the SaviAI engine, which Saviynt describes as four distinct AI agent types embedded across modules: lifecycle management AI, application onboarding AI, security operations AI, and identity administration AI. The Saviynt Exchange marketplace provides self-service access to 750+ out-of-the-box application connectors and partner-built integrations, including risk signal feeds from CrowdStrike, Zscaler, Wiz, and Cyera. KuppingerCole analysts cited Saviynt as having the 'broadest list of out-of-the-box integration use cases amongst all vendors' in the IGA segment, a claim that remains analytically unverified from this review.\n\nThe five-module architecture is presented as a converged alternative to point-solution IGA+PAM stacks, but Cloud PAM's lack of a dedicated product page and user feedback citing PAM feature depth gaps relative to specialist vendors (CyberArk, BeyondTrust) suggest the convergence story is stronger in IGA and ISPM than in PAM."
