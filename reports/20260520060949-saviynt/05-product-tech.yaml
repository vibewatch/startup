- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: standard
  summary: "End-to-end flow for an enterprise user requesting access and for an AI agent requesting runtime access through the Agent Access Gateway."
  data:
    nodes:
    - id: user-request
      label: User / AI Agent Access Request
      detail: "Human user requests app access via self-service portal; AI agent initiates API call to governed system via Bedrock, Copilot Studio, Vertex AI, ServiceNow AI, or Agentforce"
      group: input
    - id: policy-evaluation
      label: EIC Policy Engine
      detail: "Evaluates SoD rules, RBAC/ABAC policies, risk score from SaviAI, approval workflow routing"
      group: core
    - id: saviai-risk
      label: SaviAI Risk Scoring
      detail: "AI engine scores access risk based on entitlement history, peer group analysis, and anomaly detection; surfaces high-risk items to reviewer queue"
      group: core
    - id: approval-workflow
      label: Approval / Certification Workflow
      detail: "Manager or data owner certifies access; AI-prioritized queue reduces reviewer fatigue; automated approvals for low-risk requests"
      group: process
    - id: access-grant
      label: Access Provisioned / Denied
      detail: "Connector framework provisions entitlement in target system (AD, SAP, Salesforce, AWS IAM, etc.); AAG enforces JIT policy for AI agents"
      group: output
    - id: audit-log
      label: Audit & Compliance Log
      detail: "Immutable audit trail for all access decisions; feeds SOC 2, FedRAMP, and PCI-DSS reporting; triggers ISPM alerts for posture drift"
      group: output
    edges:
    - from: user-request
      to: policy-evaluation
      label: Access request submitted
    - from: policy-evaluation
      to: saviai-risk
      label: Risk assessment requested
    - from: saviai-risk
      to: approval-workflow
      label: Risk score returned; high-risk flagged
    - from: approval-workflow
      to: access-grant
      label: Approved or auto-approved
    - from: policy-evaluation
      to: access-grant
      label: Low-risk auto-provisioned
    - from: access-grant
      to: audit-log
      label: Decision logged

