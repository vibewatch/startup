  notes: "Workflow benefits are company-claimed unless otherwise indicated; no independent benchmark data for time-savings or cost-reduction metrics has been published by Saviynt."

- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / Component
  - Role
  - Dependency
  - Risk
  rows:
  - - EIC SaaS Application Layer
    - Identity governance UI, REST APIs, workflow engine, reporting
    - AWS cloud infrastructure (multi-tenant); no on-prem option
    - Single cloud provider concentration; AWS region outage = full outage
  - - SaviAI Engine
    - AI-driven access risk scoring, certification prioritization, anomaly detection
    - Third-party LLMs (vendor not publicly disclosed)
    - LLM hallucination in access decisions; data residency compliance risk; vendor lock-in
  - - Connector Framework / Saviynt Exchange
    - Application integration with 750+ OOB connectors; partner-contributed apps
    - Vendor API stability (ServiceNow, SAP, AWS, Salesforce, etc.)
    - Connector version drift; API deprecation breaks provisioning workflows
  - - Identity Data Repository
    - Master identity record store; access entitlement history; audit log
    - Customer directory services (Active Directory, LDAP, SCIM endpoints)
    - Directory sync lag; AD schema dependencies; multi-forest complexity
  - - Agent Access Gateway
    - Runtime policy enforcement for AI agents; just-in-time access grants
    - AI vendor APIs (Amazon Bedrock, Copilot Studio, Vertex AI, ServiceNow AI, Agentforce)
    - Vendor API changes break governance; AI agent identity schema not standardized
  - - Trust & Compliance Layer
    - Certification audit trails; FedRAMP authorization boundary; SOC controls
    - Third-party auditors (KPMG or equivalent); FedRAMP PMO
    - FedRAMP scope limited to Moderate; High not achieved; HIPAA BAA not published
  notes: "Architecture inferred from official product pages, trust portal, GitHub, and press releases; internal cloud topology, multi-tenancy design, and LLM vendor identity are not publicly disclosed."

