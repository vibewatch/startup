company:
  name: Saviynt
chapter:
  number: 1
  title: Company Overview
  summary: Saviynt is a late-stage private identity security company founded in 2010 in El Segundo, California. Its cloud-native Enterprise Identity Cloud (EIC) platform combines IGA, Cloud PAM, ISPM, Application Access Governance, and External Identity Management in a single SaaS product. The company reported 35%+ ARR growth, 111% NRR, and EBITDA profitability for FY2024, with contracted ARR exceeding $185 million as of Q3 2024. Saviynt has raised at least $1.075 billion across its major disclosed financing rounds, culminating in a December 2025 $700 million KKR-led growth equity round at approximately $3 billion valuation. The company has over 500 enterprise customers globally. A 2021 CEO transition went unannounced, and some customers cite support quality and customization gaps as concerns, though consecutive Gartner Peer Insights Customers' Choice wins and a 4.8/5 rating from 249 reviews reflect strong overall satisfaction.
sections:
- id: section-1
  title: Identity, mission, and market position
  body: 'Saviynt was founded in 2010 by Sachin Nayyar and Vibhuti Sinha and is headquartered in El Segundo, California. The company positions itself under the tagline "Identity Security for AI. AI for Identity Security.™" and describes its mission as enabling enterprises to secure digital transformation through intelligent identity governance. As of mid-2026, Saviynt''s LinkedIn profile lists the company in the 1,001–5,000-employee range, and the company states it protects more than 100 million identities across its global customer base. Saviynt competes in the Identity Governance and Administration (IGA) market alongside SailPoint and Oracle, but differentiates through a single cloud-native platform that converges IGA, Privileged Access Management, Application Access Governance, Identity Security Posture Management, and External Identity Management. The company also positions itself at the emerging intersection of AI and identity, launching purpose-built AI-agent governance capabilities
    in early 2026. Analyst recognition from Gartner Peer Insights (five consecutive Customers'' Choice distinctions) and KuppingerCole (Overall Leader in IGA and PAM) underscores Saviynt''s standing as a tier-one vendor in the enterprise identity security market.

    '
