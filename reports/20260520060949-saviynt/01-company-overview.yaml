- id: section-7
  title: Risks, adverse signals, and diligence gaps
  body: 'Several risk factors and adverse signals are documented. First, a Gartner Peer Insights review published in August 2025 by a Director of Identity and Access Management at a mid-market bank awarded Saviynt a 2.0 out of 5 score, describing support as "abysmal" and citing "massive turnover in the organization" affecting service management. A second critical theme from PeerSpot reviews is Saviynt''s limited customization relative to SailPoint: multiple users note that complex configuration requiring development work remains a friction point, and some customers report onboarding projects delayed by slow response times from the vendor. These adverse signals contrast with the 4.8/5 Gartner Peer Insights aggregate rating, suggesting satisfaction variance correlated with customer size and implementation complexity.

    Second, the CEO transition from Amit Saha to Sachin Nayyar occurred between April 2022 and December 2023 without a public announcement, which is atypical for a company of Saviynt''s scale and raises questions about the circumstances. Third, the GRR figure of "approximately 98% excluding downsell" implies a disclosed GRR of greater than 95% when downsell is included, indicating some customers have reduced their contracted scope. Fourth, all financial figures are company-disclosed only; no independent audit has been confirmed. Finally, a purported "$205 million Series B financing led by Goldman Sachs Asset Management" (BusinessWire/PRNewswire, October 2024) has not been verifiable despite multiple URL attempts; it is treated as unconfirmed and distinct from the verified December 2025 $700 million KKR-led round at approximately $3 billion valuation.

    '
