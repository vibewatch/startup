  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Current equity valuation and ownership cap table; the $1.375B valuation inferred from third-party coverage of the 2021 $130M round has not been updated, and a purported $205M Series B from Goldman Sachs Asset Management (October 2024) could not be confirmed despite multiple URL retrieval attempts.
    whyItMatters: Without a current valuation anchor, relative valuation, dilution, and exit scenario analysis cannot be completed reliably. The unresolved Series B also means the post-money capital structure is unknown.
    diligencePath: Request current cap table and investor schedule from Saviynt directly; verify Goldman Sachs Asset Management investment via their press room or LP correspondence; search SEC Form D filings for recent Saviynt equity issuances.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: CEO transition
    missingEvidence: Public announcement or internal memo confirming the exact date and circumstances of Sachin Nayyar succeeding Amit Saha as CEO; no press release was found despite comprehensive newsroom and third-party archive searches.
    whyItMatters: An unannounced CEO succession at a late-stage growth company can signal board disputes, founder concerns, or executive contract terminations that are material to governance risk.
    diligencePath: Ask Saviynt management directly for the transition date; request board minutes or a succession explanation; check LinkedIn change history for both executives.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO002
    - TO004
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: GAAP revenue, operating expenses, cash position, and debt schedule; all Saviynt financial data is company-disclosed ARR and operating metrics only. No independent audit, CFO letter, or revenue confirmation from investors is available publicly.
    whyItMatters: ARR-based metrics can diverge from recognised revenue under GAAP. Without an audit, deferred revenue, contract modifications, and capitalised costs cannot be verified.
    diligencePath: Request audited financials (or management accounts) and debt schedule from Saviynt data room; confirm EBITDA margin via CFO.
    relatedQuestionRefs: []
  - type: missing-source
    severity: minor
    topic: competitive benchmarking
    missingEvidence: Published NRR benchmarks for the enterprise IGA / IAM software segment for 2023–2025; Saviynt's 111% NRR cannot be contextualised without peer comparisons from SailPoint, Microsoft Entra, or Okta at equivalent scale.
    whyItMatters: A 111% NRR may be exceptional or merely in-line with segment norms; without context it cannot be used as a standalone indicator of competitive strength.
    diligencePath: 'Benchmark against reported SailPoint (NYSE: SAIL) metrics in quarterly earnings; use Battery Ventures or Bessemer SaaS benchmarks for identity security NRR norms.'
    relatedQuestionRefs:
    - QO022
  - type: missing-source
    severity: minor
    topic: competitive position
    missingEvidence: Head-to-head win/loss data against SailPoint and Oracle Identity Governance in IGA competitive evaluations; Saviynt's relative share of new enterprise logo wins versus incumbent SailPoint is unknown from public sources.
    whyItMatters: IGA market share and win rates are central to assessing whether Saviynt's growth is coming from net-new market expansion or displacement of incumbents.
    diligencePath: Ask Saviynt for win/loss analysis by competitor; consult recent Gartner or Forrester Wave reports on IGA for competitive positioning framework.
    relatedQuestionRefs:
    - QO023
acknowledgedWarnings:
- dimension: tableNotes
  reason: TO001 is a pure factual snapshot table drawn entirely from company-disclosed press release data; the notes field documents the unaudited, company-disclosed nature of all figures as required.
- dimension: unverifiedSource
  reason: SO026 (LinkedIn company page for Saviynt) was accessed via the Jina AI reader proxy; the canonical linkedin.com URL logged in the fetch trail differs from the source URL cited here because Jina prefixes the target URL. Content retrieved is authentic LinkedIn company page data for Saviynt.
- dimension: paywallRisk
  reason: SO030 (KuppingerCole Leadership Compass IGA page) returned HTTP 404 during retrieval and is marked accessStatus:broken. KuppingerCole reports are paywalled analyst reports; the citation corroborates analyst recognition already confirmed via the Saviynt press release (SO008). The single broken source represents less than 4% of total sources, well below the 30% report-level ceiling.
