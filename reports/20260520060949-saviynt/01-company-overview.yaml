- id: section-6
  title: Partner ecosystem and strategic alliances
  body: 'Saviynt operates a broad partner ecosystem with more than 400 channel partners globally. The most significant strategic alignment is with Amazon Web Services: Saviynt signed an AWS Strategic Collaboration Agreement (SCA) in July 2025, creating a preferred-partner relationship for co-selling identity security capabilities to AWS customers. KPMG Australia is cited as a key channel partner in the APAC region. In July 2021 Saviynt and Deloitte expanded their strategic alliance to offer turnkey managed identity services, enabling Deloitte to deliver Saviynt EIC implementations as a managed service. Saviynt is also a member of the Microsoft Intelligent Security Association and was selected in December 2023 for Microsoft''s Security Copilot Partner Private Preview, giving it early integration access to Microsoft''s AI-powered security platform. In June 2025, Steve Blacklock — formerly of Palo Alto Networks and Citrix — joined as SVP Global Partners to accelerate partner ecosystem growth.
    Technical integrations cover CrowdStrike, Zscaler, ServiceNow, and Wiz, among others.

    '
