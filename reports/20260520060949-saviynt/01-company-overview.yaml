- id: section-3
  title: Financial performance and growth trajectory
  body: 'Saviynt''s FY2024 results, reported in February 2025, represent the company''s strongest annual performance on record. Annual Recurring Revenue grew more than 35% year-over-year, with SaaS ACV new bookings reaching approximately $60 million, also up 35%+ YoY. The company''s Net Revenue Retention improved to 111% from 104% in the prior year, indicating meaningful upsell and expansion from the existing customer base. Gross Revenue Retention exceeded 95%, or approximately 98% when standard downsell categories are excluded. Subscription gross margin was approximately 80%, and subscription revenue as a share of total revenues reached 88%.

    A key inflection point in FY2024 was the achievement of EBITDA profitability, a notable milestone for a company that has been investing aggressively in headcount and product development. Contracted ARR surpassed $185 million as of Q3 2024, with Q3 bookings growing more than 45% year-over-year. Saviynt crossed the 500-customer and 1,000-employee thresholds during 2024, adding roughly 350 net new employees in a single year. All financial figures are company-disclosed and unaudited, as Saviynt is a private company with no obligation to publish GAAP financial statements.

    '
