callouts:
- calloutType: strength
  title: Retention economics signal durable competitive positioning
  body: A 111% NRR combined with a >95% GRR in FY2024 indicates that Saviynt is both retaining existing revenue and expanding wallet share within its customer base. This combination — particularly the NRR improvement from 104% to 111% in a single year — is consistent with a platform expanding into adjacent identity use cases (PAM, ISPM, AAG) within existing accounts rather than growing solely through new customer acquisition.
  claimRefs:
  - CO006
  - CO007
  - CO011
- calloutType: insight
  title: AI agent governance may be a near-term differentiator
  body: The March 2026 launch of Saviynt Identity Security for AI positions the company at the convergence of identity governance and AI orchestration. As enterprises deploy LLM-powered agents with access to production systems, IGA vendors that can govern non-human identities with the same rigor applied to human ones gain a structural advantage. Saviynt's claim of being the first enterprise-grade platform for AI agent governance — if sustained through 2026-2027 product cycles — could accelerate win rates in competitive evaluations.
  claimRefs:
  - CO027
  - CO028
- calloutType: risk
  title: Silent CEO transition and support complaints introduce diligence uncertainty
  body: The unannounced CEO change between Amit Saha and Sachin Nayyar (estimated April 2022 to December 2023) is an atypical disclosure pattern for a company at Saviynt's scale and funding level. Combined with the August 2025 Gartner Peer Insights critical review describing support as "abysmal" with "massive turnover" in the service management team, there is a plausible operational quality narrative worth scrutinising in reference checks.
  claimRefs:
  - CO036
  - CO038
