callouts:
  - calloutType: risk
    title: PANW/Idira Platformization Is the Primary Structural Risk
    body: >
      Palo Alto Networks' completed acquisition of CyberArk and the May 2026 Idira launch represent the most consequential
      competitive shift in Saviynt's market since its founding. PANW's 70,000+ customer base, cross-portfolio bundling power
      (identity + network + cloud + SOC), and CORA AI capabilities embedded in Idira create a platform-economics advantage
      that Saviynt cannot replicate as a standalone identity-cloud vendor. The primary near-term risk is PANW using identity
      as a loss-leader or sub-market-rate bundle to retain security platform customers who otherwise would evaluate Saviynt
      independently. Saviynt's AWS SCA and unified IGA+PAM positioning are partial counters, but the structural size
      asymmetry warrants ongoing monitoring.
    claimRefs:
      - CP008
      - CP011
      - CP014
      - CP036
      - CP044

  - calloutType: insight
    title: Agentic Identity Is the Next Battleground
    body: >
      RSA Conference 2026 saw Cisco, CrowdStrike, Palo Alto Networks, and Microsoft each launch agentic identity
      capabilities. VentureBeat and William Blair analysis confirm that enterprises will gravitate toward trusted platform
      vendors for agentic identity governance. Saviynt has entered this space with ISPM for AI Agents and a MCP Server;
      however, PANW/Idira (agentic registry + Prisma AIRS 3.0), Microsoft (Entra non-human identity + Sentinel MCP),
      and Cisco (Duo Agentic Identity) each launched at RSAC. Saviynt's ability to establish analyst and customer proof
      points for agentic identity governance before the 2026–2027 buying cycle is a key competitive timing risk.
    claimRefs:
      - CP041
      - CP042
      - CP015

