chapter:
  number: 3
  title: Competitors
  summary: >
    Saviynt competes in a rapidly consolidating identity security market dominated by SailPoint (NASDAQ: SAIL) in IGA,
    and newly by Palo Alto Networks' Idira platform—created from the completed acquisition of CyberArk in 2026 and
    rebranded on May 12, 2026—in PAM and expanded identity. Microsoft Entra ID Governance poses a structural bundling
    threat at $12 per user per month within the Entra Suite. Saviynt's primary differentiation is its unified cloud-native
    IGA+PAM+ISPM+EIM platform versus best-of-breed point solutions, but SailPoint's Fortune 500 dominance, Idira's
    PANW platform bundling, and Microsoft's distribution make the competitive environment demanding.

sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >
      Saviynt operates in three overlapping competitive segments: Identity Governance and Administration (IGA), Privileged
      Access Management (PAM), and the emerging Identity Security Platform category that unifies both. In IGA, SailPoint
      (NASDAQ: SAIL) is the declared revenue leader, claiming 53 percent of Fortune 500 penetration and recognition as a
      2026 Gartner Peer Insights Customers' Choice. In PAM, Palo Alto Networks' Idira—built on CyberArk's legacy and
      launched May 12, 2026—commands the deepest enterprise installed base with approximately 10,000 customers and now
      benefits from PANW's full security portfolio distribution. Adjacent identity platforms include One Identity (IGA+PAM+AM
      unified), Omada Identity Cloud (cloud-native IGA, EMEA-led), and Ping Identity (Thales Group, AI-driven IGA). Legacy
      incumbents Oracle Identity Governance and IBM Verify Identity Governance represent declining on-premises alternatives
      creating a migration-driven tailwind. Microsoft Entra ID Governance, bundled at $12 per user per month in the Entra
      Suite, exerts structural pricing pressure in mid-market and existing Microsoft 365 accounts. Internally built solutions
      and manual role-management via spreadsheets and Active Directory groups remain the status quo Saviynt displaces at
      first sale. The most consequential structural shift since 2024 is the PANW acquisition of CyberArk (announced July
      2025, completed early 2026), which enlarged the identity security battlespace and set a platformization trajectory
      directly competing with Saviynt's unified Enterprise Identity Cloud positioning.
