  - id: moat-and-competitive-risks
    title: Moat, Switching Costs, and Competitive Risk
    body: >
      Enterprise IGA implementations create substantial switching costs through deep integrations with HR systems, application
      connectors, certification workflows, SoD policies, and access review audit trails. Analyst evidence and buyer reviews
      suggest migration timelines of 12 to 24 months, making rip-and-replace scenarios rare absent a major incident or
      consolidation mandate. SailPoint explicitly addresses this with its Modernization Flex pricing track designed to retain
      IdentityIQ customers during cloud migration—confirming the lock-in reality that protects Saviynt's own installed base
      symmetrically. Saviynt's moat sources include: (1) integration depth across 1,000+ enterprise application connectors,
      (2) regulatory workflow complexity embedded in SoD policies and audit trails accumulated over deployment lifecycles,
      (3) the AWS SCA co-sell channel providing preferential positioning in cloud-native deployments, and (4) dual analyst
      leadership recognition in IGA and PAM from KuppingerCole. The primary commoditization risks are Microsoft Entra's
      distribution bundling in M365 enterprise agreements, Idira/PANW's platformization bundling across network and identity
      security, and possible open-source or API-driven challengers reducing connector moat. Multi-homing risk is material:
      large enterprises often deploy SailPoint for enterprise IGA alongside CyberArk/Idira for PAM—a two-vendor status quo
      that Saviynt directly challenges with its unified platform. The PANW/Idira platformization strategy is the most adverse
      structural dynamic because PANW's 70,000+ customer relationships (per PANW investor materials) represent a potential
      Idira cross-sell base that dwarfs Saviynt's current footprint, and the bundled pricing economics of a platform deal
      would differ fundamentally from standalone IGA procurement.
