  - id: pricing-and-gtm-dynamics
    title: Pricing, GTM, and Adjacent Platform Threats
    body: >
      Microsoft Entra ID Governance poses the most significant structural pricing threat to Saviynt in Microsoft-centric
      enterprises. Included in the Microsoft Entra Suite at $12 per user per month on annual commitment, Entra ID Governance
      bundles lifecycle management, entitlement management, access reviews, and identity verification alongside conditional
      access and network access capabilities. Microsoft's 300+ million commercial user base and M365/Azure enterprise
      agreements give it distribution leverage no standalone IGA vendor can replicate. TrustRadius buyer reviews confirm that
      Saviynt commands a meaningfully lower price point than CyberArk for comparable IGA+PAM functionality, supporting its
      value-for-cost positioning in mid-market enterprise. Saviynt's pricing is not publicly disclosed; contracts are
      customized by organization size, deployment scope, and module selection. Oracle Identity Governance (on-premises,
      Kubernetes-deployable) and IBM Verify Identity Governance serve organizations with deep legacy environments that are not
      yet migrating to cloud IGA; both are in secular decline for net-new logos but defend installed bases through ERP and
      middleware integrations. William Blair analyst Jonathan Ho, writing from RSA Conference 2026, noted that "the difficulty
      of securing agentic AI is likely to push customers toward trusted platform vendors that can offer broader coverage across
      the expanding attack surface"—a dynamic that benefits PANW/Idira and Microsoft over standalone vendors, but also
      rewards Saviynt if its unified platform thesis is validated in enterprise procurement processes. The emergence of
      agentic identity as a purchasing criterion—illustrated by RSAC 2026 where Cisco (Duo Agentic Identity), CrowdStrike
      (Falcon AIDR), PANW (Prisma AIRS 3.0), and Microsoft (Entra + Purview) all launched agentic identity capabilities—
      elevates competition for the category Saviynt entered with its ISPM for AI Agents and MCP Server.
