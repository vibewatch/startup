evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Current equity valuation and ownership cap table; the $1.375B valuation inferred from third-party coverage of the
      2021 $130M round has not been updated, and a purported $205M Series B from Goldman Sachs Asset Management (October
      2024) could not be confirmed despite multiple URL retrieval attempts.
    whyItMatters: >-
      Without a current valuation anchor, relative valuation, dilution, and exit scenario analysis cannot be completed
      reliably. The unresolved Series B also means the post-money capital structure is unknown.
    diligencePath: >-
      Request current cap table and investor schedule from Saviynt directly; verify Goldman Sachs Asset Management
      investment via their press room or LP correspondence; search SEC Form D filings for recent Saviynt equity
      issuances.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: CEO transition
    missingEvidence: >-
      Public announcement or internal memo confirming the exact date and circumstances of Sachin Nayyar succeeding Amit
      Saha as CEO; no press release was found despite comprehensive newsroom and third-party archive searches.
    whyItMatters: >-
      An unannounced CEO succession at a late-stage growth company can signal board disputes, founder concerns, or
      executive contract terminations that are material to governance risk.
    diligencePath: >-
      Ask Saviynt management directly for the transition date; request board minutes or a succession explanation; check
      LinkedIn change history for both executives.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO002
      - TO004
