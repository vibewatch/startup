      company-disclosed ARR and operating metrics only. No independent audit, CFO letter, or revenue confirmation from
      investors is available publicly.
    whyItMatters: >-
      ARR-based metrics can diverge from recognised revenue under GAAP. Without an audit, deferred revenue, contract
      modifications, and capitalised costs cannot be verified.
    diligencePath: >-
