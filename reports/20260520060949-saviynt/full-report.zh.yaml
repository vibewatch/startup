  - id: TV006
    title: 最终尽调提问表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 2025 年融资结构
        - 新股 / 老股比例、资金用途、优先股堆叠、反稀释条款、MFN 条款和董事会权利。
        - 决定 $3B 标记对今天入场的新资金是否具有真实经济含义。
        - 律师数据室；KKR / Carrick / Sixth Street 融资文件。
      - - 当前 ARR 与增长桥接
        - 从 FY2024 签约 ARR（报告为 >$185M）桥接到 2026 年当前 ARR，并拆出增长和流失。
        - $3B 估值下的隐含倍数完全取决于 ARR 分母。
        - CFO 尽调包；季度 ARR 导出数据。
      - - 客户集中度与留存
        - 前 10 大客户 ARR 占比、Logo 流失、按队列拆分的 NRR，以及超出管理层 96% 口径的总留存率证明。
        - 收入集中时，一旦大客户流失或降购，公司估值可能很快重定价。
        - 客户队列导出数据和具名客户访谈。
      - - IPO 与退出路径
        - 董事会层面对 IPO 准备度、战略买家接触，以及两条路径下最低可接受估值的判断。
        - 在 $3B 估值下，持有期和 IRR 是硬性经济约束。
        - 董事会材料、投行公平性分析和管理层退出计划。
      - - Goldman Sachs 2024 年融资轮核查
        - 直接确认或否认 2024 年是否存在 Goldman Sachs 作为主投、跟投或安排方参与的融资。
        - 校准公开记录中的融资历史，并剔除一条流传但未经验证的叙事。
        - 管理层和外部律师提供的 2024 日历年融资时间表。
      - - 公开披露升级
        - 达到 CFO 级别的投资者更新，披露深度对齐 SailPoint，包括分部收入和单位经济模型。
        - 如果公开经济指标支撑隐含倍数，建议可从继续研究转向买入。
        - 投资者关系路线图，以及达到可对外发布财务纪律的时间表。
    notes: 这些问题范围很窄，但对投资至关重要，并与 TV005 的触发项绑定。每一项都可能改变建议或可接受入场价。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV014
      - CV025
      - CV030
      - CV037
      - CV044
      - CV045
