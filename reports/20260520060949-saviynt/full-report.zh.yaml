      - number: '8.2'
        title: 资本结构：五轮融资合计 $1.04B，2025 年轮承担主要价格发现
        blocks:
          - type: paragraph
            body: >-
              Saviynt 的融资历史在形态上简单，顶部越来越重。SecurityWeek 报道称，公司在 2018 年融资 $40 million，2021 年融资 $130 million，2023 年 1 月融资
              $205 million，然后是 2025 年 12 月一轮；BankInfoSecurity 则把累计终身融资列为约 $1.04 billion。2023 年一轮是由 AllianceBernstein 关联方
              AB Private Credit Investors 领投的战略融资，用于扩展云平台，而不是公开标记新的股权估值。因此，2025 年 12 月融资是多年来第一轮可作为清晰外部定价的融资。


              2025 年交易机制决定了 $3 billion 价格到底意味着什么。KKR 通过 Next Generation Technology Growth Fund III 领投，Sixth Street
              Growth、TenEleven 和现有投资方 Carrick Capital Partners 共同投资。Piper Sandler 担任 Saviynt 顾问，Cooley 担任法律顾问，Latham &
              Watkins 为 Carrick 提供顾问，Gibson Dunn 为 KKR 提供顾问，Moelis 和 Kirkland & Ellis 为 Sixth Street
              提供顾问。这些都是重量级顾问，符合一场复杂交易流程，但也暗示该轮更像复杂结构化融资，而不是简单的 pre-IPO 新股融资。多次搜索一笔据称由 Goldman Sachs 领投的 2024
              年融资，都没有找到可相互印证的公开证据；该说法仍未核验，应作为开放数据点，而不是确认的上一轮定价。
