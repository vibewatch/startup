      - number: '3.2'
        title: 直接 IGA 竞争对手
        blocks:
          - type: paragraph
            body: >
              SailPoint 是 Saviynt 最直接的企业 IGA 竞争对手。SailPoint 以 SAIL 为代码在 NASDAQ 重新 IPO，并将其 Identity Security
              Cloud（ISC）定位为 AI 驱动的自适应身份平台，覆盖生命周期管理、访问认证、数据访问安全、CIEM 和非员工风险管理。2025 年 12 月，SailPoint 推出
              Navigators，这是一种灵活定价模型，补充其 ISC Standard、Business 和 Business Plus 套件。Navigators 提供三条 Flex 路径——Digital
              identity Flex（机器和智能体身份）、Premier Flex（更广平台能力）和 Modernization Flex（IdentityIQ
              客户迁移到云）——在不被按席位锁死的情况下支持按消耗访问。SailPoint 的规模优势相当明显：公司自称 2024 年按 IGA 收入排名第一，并覆盖 53% 的 Fortune 500。TrustRadius
              买方对比指出，SailPoint 在生命周期管理定制和合规自动化上更强，但访问复核工作流可配置性有限，偶尔使用者学习曲线陡峭。Quest Software 旗下 One Identity 将 IGA、PAM 和
              Access Management 统一起来，内置 AI 预测洞察，并提供覆盖 Entra ID 的「Enhanced Active Directory Governance」。总部位于 Copenhagen 的
              Omada Identity Cloud 面向寻求云原生 IGA 的组织，承诺 90 天部署，并提供 AI 驱动的角色管理；它在 EMEA 中型企业中的竞争力强于北美大型企业。Thales Group 旗下
              Ping Identity 提供云 IGA，具备 AI/ML 驱动的访问请求、访问复核和 SoD 执行能力，并借助 Thales 在政府和金融服务市场中的强监管合规背书。Saviynt 在该细分的优势，是一个覆盖
              IGA、PAM 和 ISPM 的统一云原生架构，能降低供应商整合摩擦；另一个优势是 AWS Strategic Collaboration Agreement，使其在云优先和云原生部署中获得优先位置。
