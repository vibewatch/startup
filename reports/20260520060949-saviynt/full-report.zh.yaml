          - type: callout
            title: 智能体身份是下一个战场
            body: >
              RSA Conference 2026 上，Cisco、CrowdStrike、Palo Alto Networks 和 Microsoft 各自发布智能体身份能力。VentureBeat 和 William
              Blair 的分析确认，企业会向可信平台厂商靠拢，以治理智能体身份。Saviynt 已凭 ISPM for AI Agents 和 MCP Server 进入这一空间；但 PANW/Idira（智能体注册表 +
              Prisma AIRS 3.0）、Microsoft（Entra 非人类身份 + Sentinel MCP）和 Cisco（Duo Agentic Identity）也都在 RSAC 发布。Saviynt 能否在
              2026–2027 采购周期前，为智能体身份治理建立分析师和客户证据点，是一个关键竞争时点风险。
