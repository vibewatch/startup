      - number: '5.3'
        title: 集成生态与技术合作伙伴
        blocks:
          - type: paragraph
            body: >-
              Saviynt 的集成生态是主要竞争杠杆。平台声称通过 Saviynt Exchange 市场提供 750+
              开箱即用连接器，覆盖企业应用（SAP、Salesforce、ServiceNow、Oracle）、云基础设施（AWS、Azure、GCP）和安全工具（CrowdStrike、Wiz、Zscaler、Cyera）。KuppingerCole
              独立确认了其相对 IGA 同业的广度优势。ServiceNow 连接器被强调为旗舰集成，可支持基于身份工单的工作流；AWS 集成支持多账户 AWS 环境中的 IAM 角色治理。2025 年 7 月 AWS
              Strategic Collaboration Agreement 使更深层集成正式化，并在 Amazon Q Business 中加入面向身份感知 AI 查询的原生 Data Accessor。


              Cyera 战略集成（2026 年 3 月 19 日宣布）是最近一次生态扩张，将 Saviynt IGA 与 Cyera 的 Data Security Posture
              Management（DSPM）结合，把身份访问权限与数据敏感性关联起来——补上分析机构称零信任架构中至关重要的用例缺口。Deloitte 的 Digital Identity+ 托管服务平台纳入
              Saviynt，把平台触达延伸到大型企业的外包身份运营。面向 SAP 的专门模块把 SAP BusinessObjects 退场（2027 年）作为迁移触发因素，服务那些需要用云 IGA 替代传统 SAP
              角色管理的客户。


              面向开发者的集成工具有限。Saviynt 的公开 GitHub 组织（github.com/saviynt）仅托管三个公开仓库：一个 LangChain 文档 fork、Terraform
              provider（terraform-provider-saviynt）和 SaviyntArtifacts。Terraform provider（Go，MPL-2.0 许可证）最后更新于 2026 年 4
              月，自发布以来累计 6 个 star、4 个 fork——相对一线身份平台供应商（Okta 的 Terraform provider 超过 400 个
              star），社区参与度极低。本次审查中，docs.saviynt.com 的 API 参考返回 HTTP 400 错误，引发对 Saviynt 开发者文档基础设施稳定性和可访问性的疑问。
