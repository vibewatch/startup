      - number: '4.2'
        title: ARR 增长与客户留存
        blocks:
          - type: paragraph
            body: >
              对一家达到这一规模的私营公司而言，Saviynt 的 ARR 轨迹是最强的单一业务健康信号。2024 年 Q3 末（截至 2024 年 12 月 10 日），合同 ARR 超过 $185
              million；FY2024 全年业绩确认，年度 ARR 连续第二年增长超过 35%。公司 FY2020 ARR 增长 46%，FY2021 SaaS 收入增长
              42%，显示产品成熟周期中持续的高增长模式。SiliconAngle 对 FY2024 业绩的独立报道佐证了 >35% ARR 增长，但没有给出更多具体数字，这也符合私营公司披露方向性而非绝对指标的做法。


              FY2024 净留存率从上一年的 104% 提升至 111%，这是一个有意义的跃升，说明装机基础扩张速度快于流失速度。总体总留存率超过 95%；若剔除标准降售类别（如重新谈判席位数），约为
              98%。这些留存指标符合处在健康、粘性、合规驱动市场中的企业 SaaS 公司特征。作为背景，SailPoint（最接近的上市可比公司）报告总留存率超过 90%，其 NRR 在 IPO
              准备周期中持续改善（SailPoint 于 2025 年 5 月重新 IPO）。2024 年 Q3 新客户订单同比增长超过 45%，Q3 年初至今订阅收入较上年增长超过 30%，两者都高于 FY2024
              混合数字，暗示 2024 年 Q4 相比 Q3 订单水平可能略有放缓。
