  - id: TV005
    title: 投资逻辑打破点和触发项表
    columns:
      - 触发项
      - 证据 / 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 确认以老股交易为主
        - 新股募资用途低于 $700M 的 50%，或融资结构披露创始人 / 早期投资人大额套现。
        - 新资金的有效入场价比 $3B 标称估值暗示的更差。
        - 除非新股条款明显改善，否则在 $3B 估值下从继续研究转为放弃。
      - - ARR 明显低于沿用估计
        - 披露后当前 ARR 被证实低于 $200M，低于本文采用的 $250M-$300M。
        - 隐含倍数跳到 15x 以上，却没有战略协同支撑，开始与 CyberArk 战略交易重叠。
        - 只按悲观情景重新测试建议；$3B 估值下不支持新资金入场。
      - - 打包竞争抢走份额
        - 到 2026 年，Microsoft Entra ID Governance、PANW-CyberArk 或 SailPoint 对 Saviynt 的胜率明显提高。
        - 增长被压到接近 20%，倍数环境也比基准情景假设更快回归常态。
        - 立场从「偏高但可辩护」转为昂贵；重新介入需要价格重置或新证据。
      - - 实施和支持恶化
        - 独立评价来源（Gartner、PeerSpot、TrustRadius）显示支持和部署评分持续恶化。
        - NRR 跌破 110%，总留存率从 96% 下滑，扩张收入停滞。
        - 重置为放弃；TV003 中的下行情景成为工作基准情景。
      - - 治理或 IPO 延迟
        - 到 2027-2028 年仍看不到可信 IPO 或战略退出信号，公开披露也没有改善。
        - 持有期假设拉长，IRR 明显下降，价格纪律进一步收紧。
        - 维持仅观察姿态；没有核心催化因素，不重新介入。
    notes: 每个触发项都对应 TV003 中的具体假设。一旦触发，会直接削弱支撑该建议的情景逻辑。
    claimRefs:
