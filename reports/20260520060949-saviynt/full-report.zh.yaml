      - number: '1.4'
        title: 融资历史与投资方基础
        blocks:
          - type: paragraph
            body: >
              Saviynt 的资本结构体现了成长股权模式，而非传统风险投资模式。聚焦科技的成长股权机构 Carrick Capital Partners 领投最初的 $40 million Series
              A，估值未披露；随后在 2019 年 10 月追加 $10 million。2021 年 9 月，HPS Investment Partners 领投 $130 million 成长融资，PNC Bank
              参投，披露总融资增至约 $170 million。

              2023 年 1 月，Saviynt 获得 AB Private Credit Investors（AllianceBernstein 旗下机构）领投的 $205 million；公告同时披露创始人 Sachin
              Nayyar 回任 CEO，本轮使披露总融资增至 $375 million。外传另有一轮「Goldman Sachs Asset Management 领投的 $205 million Series
              B」（BusinessWire 和 PRNewswire，2024 年 10 月）尚未得到核实——所有抓取尝试均返回 404 错误，也未找到相互印证的 Saviynt
              新闻稿；该传闻融资被视为未确认信号，不计入融资总额。

              2025 年 12 月 9 日，Saviynt 宣布完成 $700 million Series B 成长股权融资，估值约 $3 billion，由 KKR 领投，Sixth Street
              Growth、TenEleven Ventures 和现有投资方 Carrick Capital Partners 参投。这是最近且规模最大的已确认融资。主要披露融资轮累计资本（$40M + $10M +
              $130M + $205M + $700M）至少为 $1.075 billion。2025 年 12 月本轮中新股与老股交易的比例尚未公开披露。
