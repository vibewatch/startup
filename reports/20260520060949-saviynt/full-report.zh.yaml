  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 因素
      - 描述
      - 风险 / 机会等级
      - 影响
      - 尽调路径
    rows:
      - - 先落地再扩张架构
        - IGA 是初始模块；Cloud PAM、ISPM、EIM、AI 治理作为增购模块
        - 高机会
        - 111% NRR 的结构性驱动；每个模块都把单客户平台边界拉宽
        - 验证模块组合间扩张率；使用 2+ 模块的客户占比
      - - SI 渠道依赖
        - Deloitte、KPMG、Accenture 推动大多数大型企业实施
        - 中等风险
        - SI 交付约束或竞争变化可能拖慢客户部署
        - 索要 SI 收入占比；确认大客户备用实施路径
      - - 客户集中度（未知）
        - 未披露前 10 大客户 ARR 占比
        - 中等风险
        - 如果前 10 大客户占比过高，客户流失风险会集中
        - 尽调中索要前 10 大客户收入集中度
      - - 行业集中度
        - 金融服务、保险、医疗合计占点名客户标识的多数
        - 中等风险
        - 监管周期性或这些行业下行会压缩续约意愿
        - 索要按垂直行业拆分的 ARR
      - - 监管合规粘性
        - SOX、HIPAA、PCI-DSS 推动强制性 IGA 续约；切换成本高
        - 高机会（防御性护城河）
        - 降低受监管垂直行业客户流失；合同与合规挂钩
        - 验证平均合同期限；索要合规驱动买家与可选买家的续约率
      - - AI 平台扩张路径
        - March 2026 发布 Identity Security for AI，创造新的扩张增购
        - 高机会（新兴）
        - 设计伙伴 Hertz、Auto Club Group、UKG 可能成为早期案例
        - 在 H1 2026 跟进中监测生产环境采用率
      - - 合同期限 / 切换成本
        - SaaS 合同；通常为多年期，但期限未披露
        - 中等机会
        - 更长合同降低流失；高实施沉没成本抑制切换
