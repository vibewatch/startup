      - number: '4.4'
        title: 成本结构、利润率与盈利能力
        blocks:
          - type: paragraph
            body: >
              约 80% 的订阅毛利率，是 Saviynt 披露的唯一成本结构指标。该水平符合规模化良好的企业 SaaS 平台，也意味着相对于订阅收入，基础设施、托管和客户成功成本适中。作为参考，上市同行 SailPoint
              在 FY2026（1 月财年）报告总毛利率处于 70% 出头至中段区间，反映其订阅和服务收入的组合。Saviynt 88% 的订阅收入占比和约 80% 的订阅毛利率，意味着纳入较低毛利专业服务后，混合毛利率可能在
              68–74% 区间，但该估计尚未确认。


              运营费用——包括 R&D、销售与营销、G&A——未披露。不过，FY2024 实现正现金 EBITDA，是一家一直重金投入产品扩展和全球员工增长的公司取得的重要财务里程碑。EBITDA 盈利与 >35% ARR
              增长同时出现；若能持续，将代表增长与资本效率的罕见组合。公司没有说明 EBITDA
              利润率幅度，盈利可能很薄，也可能受时点因素驱动（递延佣金、资本化软件成本）。自由现金流、净利润和具体运营费用率均未披露。作为公开基准，SailPoint 仅在 FY2026 的 R&D 上就花费 $223.1
              million，约占其 $1.1 billion 收入基础的 20%，凸显规模化竞争产品开发的资本强度。
            claimRefs:
