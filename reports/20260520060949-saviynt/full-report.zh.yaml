  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >
              Saviynt 面向身份与合规需求复杂的大型企业。其官网公开列出八个垂直行业定位：能源、联邦 / 政府、医疗、高等教育、金融服务、制造、零售和保险。公司合作伙伴生态由 Deloitte、KPMG 和
              Accenture 牵头，把实施能力集中在大型企业客户中，也把买方画像推向 Fortune 500 和 Global 2000 账户。公开具名 logo 覆盖综合企业（Koch
              Industries）、能源巨头（BP、Phillips 66）、消费品牌（Kraft Heinz、VF Corporation）、金融服务（MassMutual）、汽车 / 保险（Auto Club
              Group、Hertz）和 HR-tech SaaS（UKG）。地域上，美国是主要市场；Saviynt 在 London 和 Sydney 设有办公室，并在 2024 年披露 APAC 和 EMEA
              扩张。定价采用按身份计费模型，分白金、黄金、白银 层级——公开无标价，但用户评论持续称其相对 SailPoint 和 Microsoft Entra ID Governance 有竞争力，相对小型 IGA
              厂商则偏贵。云原生、多租户 SaaS 交付模型吸引从本地传统平台（Oracle OIM、IBM ISIM、SailPoint IdentityIQ）迁移出来的买家；Deloitte 和 KPMG
              都运营迁移加速器来推动这一过程。官网列出 Federal 垂直行业，显示政府部门存在使用可能，但截至运行日期，公开案例研究中没有具名联邦机构客户。
