      - number: '8.3'
        title: 可比公司组：SailPoint 和 Okta 显得便宜，CyberArk 和 ForgeRock 更适合作锚
        blocks:
          - type: paragraph
            body: >-
              对 Saviynt 最有用的可比框架，是身份安全上市可比公司和近期身份 M&A 的组合。上市可比方面，stockanalysis.com 截至 2026 年 5 月 19–20 日的数据把 SailPoint
              市值列为 $8.21 billion、追踪收入 $1.07 billion；Okta 市值 $15.16 billion、收入 $2.92 billion；CyberArk 市值 $20.64
              billion、追踪收入 $1.36 billion（Palo Alto Networks 已于 2026 年 2 月完成收购）；Palo Alto Networks 自身市值 $194.75
              billion、收入 $9.89 billion。该区间意味着 SailPoint 约 7.7x、Okta 约 5.2x、CyberArk 独立口径约 15.2x、Palo Alto Networks 约
              19.7x。交易口径上，Palo Alto Networks 以 $25 billion 完成 CyberArk 收购，隐含约 18.4x 追踪收入，也确认战略身份安全溢价可以显著高于公开市场常态。


              近期私有化交易位于上市公司和战略收购锚之间。Thoma Bravo 于 2022 年 10 月以约 $2.8 billion 将 Ping Identity 私有化，对应约 $299 million 2021
              年收入（约 9.4x）；又于 2023 年 8 月以约 $2.3 billion 收购 ForgeRock，对应约 $218 million 2022 年收入（约 10.5x）。这两笔交易可以说是与
              Saviynt 规模最匹配、最干净的身份治理可比交易，合起来指向赞助方主导身份治理收购的 9x–11x 追踪收入区间。把 Saviynt 的 $3 billion 定价放在一个可辩护的 $250
              million–$300 million 当前 ARR 上，对应隐含 10x–12x 区间，正好落在 Ping / ForgeRock 区间内，低于 CyberArk 战略交易，略高于 SailPoint
              公开市场定价。
