    columns:
      - 层 / 组件
      - 作用
      - 依赖
      - 风险
    rows:
      - - EIC SaaS 应用层
        - 身份治理 UI、REST API、工作流引擎、报表
        - AWS 云基础设施（多租户）；无本地部署选项
        - 单一云服务商集中风险；AWS 区域故障 = 全面宕机
      - - SaviAI 引擎
        - AI 驱动访问风险评分、认证优先级排序、异常检测
        - 第三方 LLM（供应商未公开披露）
        - 访问决策中的 LLM 幻觉；数据驻留合规风险；供应商锁定
      - - 连接器框架 / Saviynt Exchange
        - 用 750+ 个开箱即用连接器集成应用；合作伙伴贡献应用
        - 供应商 API 稳定性（ServiceNow、SAP、AWS、Salesforce 等）
        - 连接器版本漂移；API 废弃会打断账号开通工作流
      - - 身份数据存储库
        - 主身份记录库；访问权限历史；审计日志
        - 客户目录服务（Active Directory、LDAP、SCIM 端点）
        - 目录同步滞后；依赖 AD schema；多林复杂度
      - - Agent Access Gateway
        - AI 智能体运行时策略执行；JIT 访问授权
        - AI 供应商 API（Amazon Bedrock、Copilot Studio、Vertex AI、ServiceNow AI、Agentforce）
        - 供应商 API 变更会打断治理；AI 智能体身份 schema 尚未标准化
      - - 信任与合规层
        - 认证审计轨迹；FedRAMP 授权边界；SOC 控制
        - 第三方审计机构（KPMG 或同等机构）；FedRAMP PMO
        - FedRAMP 范围仅限 Moderate；尚未达到 High；未发布 HIPAA BAA
    notes: 架构根据官方产品页、信任门户、GitHub 和新闻稿推断；内部云拓扑、多租户设计和 LLM 供应商身份未公开披露。
