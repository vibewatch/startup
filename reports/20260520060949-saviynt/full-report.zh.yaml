      - number: '3.5'
        title: 护城河、切换成本与竞争风险
        blocks:
          - type: paragraph
            body: >
              企业 IGA 实施通过与 HR 系统、应用连接器、认证工作流、SoD 策略和访问复核审计轨迹的深度集成，形成很高的切换成本。分析师证据和买方评价显示，迁移周期通常为 12 到 24
              个月；除非发生重大事件或整合指令，推倒重来并不常见。SailPoint 通过 Modernization Flex 定价路径明确应对这一点，旨在云迁移期间留住 IdentityIQ
              客户——这也证实了锁定效应的现实，而同样现实也对称地保护 Saviynt 自身装机基础。Saviynt 的护城河来源包括：（1）跨 1,000+ 企业应用连接器的集成深度；（2）部署生命周期中累积在 SoD
              策略和审计轨迹中的监管工作流复杂度；（3）AWS SCA 联合销售渠道在云原生部署中提供优先位置；（4）KuppingerCole 在 IGA 和 PAM 上给予的双重分析师领导者认可。主要商品化风险包括
              Microsoft Entra 在 M365 企业协议中的分发捆绑、Idira/PANW 横跨网络和身份安全的平台化捆绑，以及开源或 API 驱动挑战者可能削弱连接器护城河。多栖部署风险实质存在：大型企业常常用
              SailPoint 做企业 IGA，同时用 CyberArk/Idira 做 PAM；这种双供应商现状正是 Saviynt 以统一平台直接挑战的对象。PANW/Idira 平台化策略是最不利的结构性动态，因为
              PANW 的 70,000+ 客户关系（据 PANW 投资者材料）代表一个潜在的 Idira 交叉销售基盘，其规模远超 Saviynt 当前足迹；平台交易中的捆绑定价经济学，也会与独立 IGA 采购有根本差异。
