      - number: '2.5'
        title: 综合判断与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场证据支持对 Saviynt 的有利自上而下判断，但前提是严格排除不相关支出。最干净的标题结论是：Saviynt 参与的是一个约 $9.6-$10.7 billion 的 2026 年 IGA 核心市场；PAM
              和非人类身份安全带来额外机会，明确扩大了品类，也增加了重叠和重复计算风险。大型企业、云优先项目和受监管垂直行业，看起来是最相关的支出池。近期最强的增长叙事不是泛泛的「更多网络安全」需求，而是合规驱动的
              IGA、最小权限 PAM，以及机器 / 智能体身份治理的汇合。


              未解决的问题主要关乎精度，而不是方向。公开来源无法隔离 Saviynt 的份额，也没有披露足够的细分收入来构建公开 SOM。公开资料也不能清楚拆分：更广泛的 IAM 或 PAM 支出中，究竟有多少真正可由
              Saviynt 触达，多少已经锁进访问管理、CIAM
              或既有厂商套件预算。预算归属也仍部分依赖私有证据：公开材料展示了采购委员会，但没有展示真实交易中的准确支出负责人。这些缺口会影响承保判断，但并不推翻更大的结论：Saviynt
              身处一个真实增长的身份治理市场，最有吸引力的切入口是企业级、受监管、且越来越以非人类身份为中心。
