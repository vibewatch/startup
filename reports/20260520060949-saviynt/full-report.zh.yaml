      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              推动 Saviynt 市场需求的，更多是结构性的安全与合规力量，而不只是可选的 IT 现代化。NIST 的零信任架构指南把安全重点转向用户、资产和资源；CISA
              的成熟度模型把最小权限和按请求访问决策落到运营层；OMB M-22-09 则在联邦环境中明确强调更强的企业身份与访问控制。SEC
              的网络安全治理披露规则又在董事会和上市公司层面增加治理压力。合在一起，这些来源强化了一个判断：身份治理是控制平面要求，而不是附加功能。云交付和非人类身份崛起进一步扩大需求基础：MarketsandMarkets
              称 PAM 是增长最快的 IAM 技术细分，非人类 IAM 的增长也快于其他身份类型。


              主要约束同样重要。公开 TAM 受 IGA、IAM、PAM 及相邻非人类身份工具之间重叠品类边界影响而被放大，简单相加会误导判断。预算归属是共享的，且常常需要政治性协商，尤其当项目横跨安全、合规和 IT
              运营时。最新增长相邻性——AI 智能体身份——前景可观但仍不成熟：VentureBeat 报道称，85% 的企业在跑智能体试点，只有 5% 进入生产；VentureBeat 和 CSO
              都指出治理、归因和控制缺口仍未解决。Technavio 还指出，通胀和 IT 预算压力仍是 PAM 项目的实施约束。增长是真实的，但采用仍取决于信任、部署纪律和清晰的责任归属。
