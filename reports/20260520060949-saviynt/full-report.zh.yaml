      - number: '6.5'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >
              111% NRR 证明了净扩张的落地后扩张动态：客户通常先从 IGA 起步，随着平台成熟，再扩展到 Cloud PAM、ISPM、External Identity Management 和新的 AI
              治理模块。收敛的 EIC 平台架构在结构上奖励扩张，因为每个模块都会拓宽治理边界（自然人 → 特权 → 第三方 → AI 智能体），为每个客户创造多个扩张向量。Deloitte Digital Identity+
              托管服务模型、KPMG 实施加速器和 Accenture 交付能力，共同把平台触达延伸到那些由深度 SI 关系影响技术选择的客户，也在渠道杠杆之外引入渠道依赖。关键集中度风险仍不透明：公司未公开前 10 或前
              25 大客户收入占比、平均合同价值，也未披露 500+ 个 logo 中有多少贡献了 ARR 大部分。SI 依赖还引入实施风险——如果主要 SI 伙伴自身遇到交付限制，Saviynt
              客户部署可能停滞，PeerSpot 评论中提到的 Saviynt 侧上线阻塞就支持这一点。公司未公开披露流失率或 logo 流失数据。披露的 GRR 超过 95% 确实意味着总体 logo
              流失较低，但无法从现有数据推导出流失或收缩客户的绝对数量。监管垂直行业集中（金融服务、保险、医疗）受益于合规驱动采购的耐久性，但也让客户基础对这些行业的监管变化或企业预算周期更敏感。
