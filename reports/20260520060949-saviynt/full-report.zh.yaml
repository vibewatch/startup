      - number: '1.3'
        title: 财务表现与增长轨迹
        blocks:
          - type: paragraph
            body: >
              Saviynt 于 2025 年 2 月披露的 FY2024 业绩，是公司有记录以来最强的年度表现。年经常性收入（ARR）同比增长超过 35%，SaaS ACV 新签订单约 $60 million，同样同比增长
              35% 以上。公司的净留存率（NRR）从上一年的 104% 提升至 111%，说明现有客户中的增购和扩张相当明显。总留存率（GRR）超过 95%；若剔除标准降售类别，约为 98%。订阅毛利率约
              80%，订阅收入占总收入的比例达到 88%。

              FY2024 的关键拐点是实现 EBITDA 盈利；对于一家一直在大力投入人员和产品开发的公司，这是重要里程碑。截至 2024 年 Q3，合同 ARR 超过 $185 million，Q3 订单同比增长超过
              45%。2024 年内，Saviynt 跨过 500 客户和 1,000 员工两道门槛，单年净增约 350 名员工。所有财务数据都由公司披露且未经审计；Saviynt 是私营公司，没有义务发布 GAAP
              财务报表。
