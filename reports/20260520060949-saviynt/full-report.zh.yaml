  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险栈
        blocks:
          - type: paragraph
            body: >-
              Saviynt
              的首要风险更多是执行型、传导型，而不是源于明显法律危机。独立评论来源反复指出实施复杂、支持响应、文档缺口、发布管理摩擦和客户体验分化；与此同时，产品在部分部署中仍获得好评。这一运营画像很重要，因为公司正在同时把产品范围扩展到
              AI 智能体治理，依赖合作伙伴和 AWS
              加速交付，并与更激进捆绑相邻身份控制的平台厂商竞争，而独立厂商很难同样捆绑。结果是一个风险栈：产品执行一旦滑坡，就可能迅速传导为部署周期拉长、扩张放慢、定价压力和估值压缩。最大未解不确定性不是 Saviynt
              是否具备市场相关性，而是它能否把执行质量维持在足以支撑 2025 年融资重定价（约 $3 billion 估值）的水平，同时保持足够透明，让外部尽调能够承销集中度、事故历史和资本结构细节。
