            body: >
              所有客户数、NRR 和 GRR 均由公司披露且未经审计。前几大客户收入集中度数据未公开。PeerSpot
              的负面评论反复指出支持响应和大规模稳定性问题，可能损害最复杂部署中的留存。这些缺口合在一起，意味着没有直接尽调访问就无法独立评估流失风险和集中度风险。
