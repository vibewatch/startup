      - number: '6.3'
        title: 具名客户证明
        blocks:
          - type: paragraph
            body: >
              截至运行日期，Saviynt 官网有两个详细生产案例研究：Auto Club Group 和 VF Corporation。两者均由 Saviynt
              自行发布，包含具名高管和量化结果，比泛泛推荐语更有价值，但仍属于公司控制的叙事。第三个部署（Advanced Drainage Systems）出现在 Saviynt 的 KPMG
              合作伙伴页面，但没有详细指标。更广泛的具名名单——BP、MassMutual、Kraft Heinz、Koch Industries、Phillips 66、Hertz 和 UKG——出现在 Saviynt
              主网站和新闻稿中，但没有发布案例研究细节。Hertz、Auto Club Group 和 UKG 被指定为 2026 年 3 月 Identity Security for AI
              平台发布的设计伙伴，至少说明当时存在活跃早期采用关系。截至运行日期，公开来源无法独立确认大多数具名 logo 的生产状态、合同范围或部署健康度。PeerSpot
              评论者报告的样本多为匿名企业部署，身份规模从数千到数万不等。PeerSpot 评论显示，高身份量（超过数万账户）下会出现性能挑战；这对解读 100 million-plus
