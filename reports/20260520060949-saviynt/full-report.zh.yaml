      - - Okta（NASDAQ:OKTA）
        - 市值 / TTM 收入
        - 市值 ~$15.16B / 收入 ~$2.92B = ~5.2x
        - 广泛覆盖员工身份和客户身份的基准公司，经营表现盈利。
        - 业务组合不同（CIAM 和员工 SSO 比 IGA 更重）；2023 年事件余波后倍数受压。
      - - Palo Alto Networks（NASDAQ:PANW，安全平台）
        - 市值 / TTM 收入
        - 市值 ~$194.75B / 收入 ~$9.89B = ~19.7x
        - 刻画大型安全平台可获得的估值；作为身份买方基准具相关性。
        - 多元化网络和云安全厂商；身份只是业务中的小切片。
      - - Ping Identity（Thoma Bravo 私有化，2022 年 10 月）
        - 交易价值 / 交易前收入
        - 交易价值 ~$2.8B / 收入 ~$299M = ~9.4x
        - 身份治理和访问领域最接近的同规模财务买方私有化可比交易。
        - 2022 年标记；倍数环境和交易条款已有变化。
      - - ForgeRock（Thoma Bravo，2023 年 8 月；与 Ping 合并）
        - 交易价值 / 交易前收入
        - 交易价值 ~$2.3B / 收入 ~$218M = ~10.5x
        - 按规模和业务组合看，最直接可比的身份治理财务买方交易。
        - 财务买方合并协同抬高了支付意愿；交易在不同利率环境下完成。
      - - Saviynt（KKR 领投，2025 年 12 月）
        - 融资金额 / 隐含 ARR 区间
        - $700M 融资、约 $3B 估值 / 估计 ARR ~$250M-$300M = ~10x-12x
        - 本章的直接锚点；反映 2025 年成长股权轮，而非公开市场清算价。
        - ARR 估计沿用前几章，且未公开披露；老股占比未知。
    notes: >-
      可比集混合了上市公司、私有化和战略交易，因为没有单一上市同业能完全匹配 Saviynt 偏 IGA 的组合和成长股权阶段。SailPoint、Ping 和 ForgeRock 是业务组合最接近的可比对象；CyberArk 和
      PANW 则框定上行天花板。
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-useful identity-security public and transaction comparables with accessible
        May 2026 evidence. It does not list every adjacent IAM or PAM vendor (BeyondTrust, Delinea, Omada, One Identity,
        Securonix) because revenue and valuation disclosures for those firms are inconsistent or gated.
