      - number: '5.5'
        title: 产品缺口与摩擦信号
        blocks:
          - type: paragraph
            body: >-
              独立用户评论信号显示出一组稳定的产品摩擦点。在 Gartner Peer Insights 上，一名评论者在 2025 年 8 月给 Saviynt 打出
              2.0/5，称产品「非常难学」，支持「糟糕透顶」，组织存在「大规模人员流失」。PeerSpot 评论者把相对专门 PAM 厂商的 PAM
              功能缺口、大规模身份量下的性能问题、上线复杂度列为最常见限制。TrustRadius 评论也印证了上线摩擦：高级配置缺少拖拽式配置能力，从零复制 AD 权限结构困难，都是反复出现的主题。


              Cloud PAM 模块的上市姿态是一个结构性问题。截至 2026 年 5 月，专门的 Cloud PAM 产品 URL 返回 404 错误，该模块也未在 Saviynt
              主要平台营销中突出呈现。这说明公司可能在刻意重新定位（把 PAM 纳入 AAG 叙事），也可能存在产品投入缺口，导致 PAM 买家缺少强有力的产品专属入口。CyberArk、BeyondTrust 等专业 PAM
              厂商在专门 PAM 评估中仍比 Saviynt 更占位。


              开发者生态足迹很小。三个公开 GitHub 仓库的 star 数均为个位数，公共 API 文档门户不可访问，也没有公开 SDK 或开发者计划；这些都给评估自助集成或自动化能力的客户留下实质缺口。Saviynt
              缺席 VentureBeat RSAC 2026 AI 智能体治理综述（该综述覆盖 Cisco、CrowdStrike、Microsoft、Palo Alto Networks 和 Cato
              Networks），说明即便 2026 年 3 月发布了产品，Saviynt 在新兴 AI 智能体身份治理领域尚未与安全平台既有巨头建立同等思想领导力。
