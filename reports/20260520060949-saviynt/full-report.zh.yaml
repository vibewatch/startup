      - number: '3.4'
        title: 定价、GTM 与相邻平台威胁
        blocks:
          - type: paragraph
            body: >
              在以 Microsoft 为中心的企业中，Microsoft Entra ID Governance 对 Saviynt 构成最重要的结构性定价威胁。Entra ID Governance
              包含在按年承诺、每用户每月 $12 的 Microsoft Entra Suite 中，把生命周期管理、权限管理、访问复核和身份验证，与条件访问和网络访问能力打包在一起。Microsoft 的 300+
              million 商业用户基础，以及 M365/Azure 企业协议，带来任何独立 IGA 厂商都无法复制的分发杠杆。TrustRadius 买方评价确认，相比 CyberArk 的可比 IGA+PAM
              功能，Saviynt 价格点明显更低，支撑了其中端企业中的性价比定位。Saviynt 未公开定价；合同会按组织规模、部署范围和模块选择定制。Oracle Identity Governance（本地部署，可部署在
              Kubernetes）和 IBM Verify Identity Governance 服务于深度遗留环境、尚未迁往云 IGA 的组织；两者在净新增客户上长期下行，但通过 ERP
              和中间件集成守住装机基础。William Blair 分析师 Jonathan Ho 在 RSA Conference 2026 期间写道，「保护智能体 AI
              的难度，很可能推动客户转向可信平台厂商；这些厂商能够在不断扩大的攻击面上提供更广覆盖」——这一动态让 PANW/Idira 和 Microsoft 相比独立厂商受益；但如果 Saviynt
              的统一平台逻辑能在企业采购流程中得到验证，也会奖励 Saviynt。智能体身份成为采购标准——RSAC 2026 上 Cisco（Duo Agentic Identity）、CrowdStrike（Falcon
              AIDR）、PANW（Prisma AIRS 3.0）和 Microsoft（Entra + Purview）都发布智能体身份能力——抬高了 Saviynt 凭 ISPM for AI Agents 和 MCP
              Server 进入的这一品类的竞争强度。
