      - number: '1.2'
        title: 创立历程、领导层演进与里程碑
        blocks:
          - type: paragraph
            body: >
              Sachin Nayyar 和 Vibhuti Sinha 于 2010 年共同创立 Saviynt，当时多数既有厂商仍依赖本地部署架构，他们希望打造一个云原生身份平台。Carrick Capital
              Partners 领投公司最初的 $40 million Series A，随后在 2019 年 10 月追加 $10 million。2019 年，Saviynt 因早期增长入选 Deloitte
              Technology Fast 500。2021 年 9 月，公司完成由 HPS Investment Partners 和 PNC Bank 领投的 $130 million 成长融资，披露总融资增至约
              $170 million。2023 年 1 月，Saviynt 又获得 AB Private Credit Investors（AllianceBernstein 旗下机构）领投的 $205
              million；同时，创始人 Sachin Nayyar 回任 CEO，披露总融资增至 $375 million。2025 年 12 月 9 日，Saviynt 宣布完成 $700 million Series
              B 成长股权融资，估值约 $3 billion，由 KKR 领投，Sixth Street Growth、TenEleven Ventures 和现有投资方 Carrick Capital Partners
              参投——主要披露融资轮累计资本至少达到 $1.075 billion。

              公司经历了显著的领导层变化。Amit Saha 至少在 2022 年 4 月仍担任 CEO，当时公司发布 2021 年度业绩并以他为 CEO。到 2023 年 12 月，原始创始人 Sachin Nayyar
              已确认担任 CEO，但尚未找到宣布这一交接的公开新闻稿。此后直到 2026 年，每一份后续新闻稿都持续称 Nayyar 为 创始人兼 CEO。2024 年 2 月，Saviynt 增补 Tomer
              Weingarten（SentinelOne CEO）和 Jesper Andersen（Infoblox 前 CEO）进入董事会。2024–2026 年，高管团队继续扩张，先后聘任
              CMO、CRO、CISO、战略高级副总裁，并在 2026 年 5 月新设 CCO 和首席客户官职位。
