      - number: '3.3'
        title: PAM 与扩展身份平台
        blocks:
          - type: paragraph
            body: >
              PANW 收购 CyberArk 的交易于 2025 年 7 月宣布、2026 年初完成，这是 Saviynt 经营史上最具结构性意义的竞争事件。合并平台于 2026 年 5 月 12 日更名为
              Idira，如今把传统 PAM、机器身份安全、密钥管理、IGA（通过 CyberArk 收购前完成的 Zilla Security 集成）和智能体身份治理，整合到 Palo Alto Networks
              横跨网络安全、云安全和 SOC 的安全伞下。这给了 Idira 跨产品组合捆绑能力，Saviynt 作为独立厂商无法匹配。CyberArk 的 CORA AI 提供异常检测、AI
              会话摘要和策略建议能力，Idira 也继承了这些能力。PANW 旗下 Idira 的定价结构，把传统 PAM（IT Standard 层）和现代 PAM（IT Enterprise 与 Dev
              层）同员工访问、机器身份和智能体身份产品分开。RSA Conference 2026 上，PANW 展示了带有智能体注册表和 MCP 网关的 Prisma AIRS
              3.0，作为对智能体身份治理的竞争性回应；Saviynt 已凭 ISPM for AI Agents 和 MCP Server 能力进入这一空间。BeyondTrust 以 Pathfinder 平台竞争
              PAM，借助 AI 驱动的「True Privilege Graph」整合 PAM、ITDR、Cloud Identity Management 和
              CIEM，并映射包括影子管理员在内的间接特权路径。Delinea 由 Thycotic 与 Centrify 合并而来，提供 PAM，并通过 Iris AI 层持续发现身份、量化风险并控制 JIT
              访问。BeyondTrust 和 Delinea 主要竞争在 PAM，而非完整 IGA；在买方希望从一个供应商获得统一 IGA+PAM 覆盖的交易中，这给了 Saviynt 优势。
