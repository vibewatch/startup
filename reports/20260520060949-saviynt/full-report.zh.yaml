    type: matrix
    layout: wide
    summary: 从产品成熟度、分析师认可度、竞争差异化和 GTM 重点四个维度，评估 Saviynt EIC 五个模块的成熟度与竞争强度。
    data:
      columns:
        - IGA
        - Cloud PAM
        - ISPM
        - 外部身份管理
        - Agent Access Gateway
      rows:
        - label: 产品成熟度
          values:
            - 高 — 2011 年起 GA；核心收入引擎
            - 中 — 已 GA 但优先级下降；PAM 页面 404
            - 中高 — 已 GA；2026 年 3 月加入 AI 态势层
            - 中 — 已 GA；市场宣传中较小的用例
            - 中低 — 2026 年 3 月 GA 发布；商业化早期
        - label: 分析师认可度
          values:
            - 强 — Gartner Customers' Choice 5 次（IGA）
            - 弱 — 未在 PAM Magic Quadrant 中单独定位
            - 新兴 — 未引用独立分析师报告
            - 弱 — 独立分析师覆盖很少
            - 缺席 — 未进入 RSAC 2026 AI 治理盘点（VentureBeat）
        - label: 竞争差异化
          values:
            - 高 — SaviAI、750+ 连接器、FedRAMP、融合叙事
            - 低 — 相比 CyberArk、BeyondTrust 深度不足；JIT 访问已成标准
            - 中 — AI 配置错误检测区别于基础 IGA
            - 中 — 供应商 / 承包商生命周期在 IGA 套件中较少见
            - 高（潜力）— 若规模化，多生态 AAG 覆盖具有独特性
        - label: GTM 重点
          values:
            - 高 — 首页主信息、Gartner 徽章、新闻稿
            - 低 — 无专门产品页；被平台叙事吸收
            - 中 — AI 发布中重点露出；面向 CISO 的信息
            - 低 — 平台页提及；不是主要营销支柱
            - 高 — 2026 年 3 月发布活动；设计伙伴点名；高管层信息
  - id: FU001
    title: Saviynt 客户旅程图
    type: journey-map
    layout: wide
    summary: |
      展示企业买家如何从传统 IGA 痛点出发，经过 Saviynt 评估、上线，再走向多模块扩展；有公开客户证据时以该证据锚定。
    data:
      nodes:
        - id: pain
          label: 传统 IGA 痛点
          description: |
            手工开通、频繁宕机、维护成本高、合规审计负担重（准备期以月计）。 M&A、云迁移或监管变化会触发采购。
          stage: trigger
        - id: evaluation
          label: 供应商评估
          description: |
            在 1–2 家入围供应商之间做价值验证或概念验证。VF Corp 测试了 150+ 个用例；Auto Club Group 依照 Gartner Magic Quadrant，与两家领导者做对比。
          stage: evaluation
        - id: onboarding
          label: 初始 IGA 部署
          description: |
            在 SI 协助或内部团队主导下部署 Saviynt IGA。先集成 HR 系统（Workday）和 AD 开通。应用逐步迁移，避免打断业务。
          stage: onboarding
        - id: production
          label: 生产稳态
          description: |
            全生命周期管理、访问认证、SoD 执行上线。旧平台退役（VF Corp、Auto Club Group）。合规审计员获得平台直接访问权限。
          stage: production
        - id: expansion-pam
          label: PAM 扩展
          description: |
            在 IGA 之上叠加 Cloud PAM，治理云工作负载中的特权访问。安全事件或云迁移里程碑常常触发这一步。
          stage: expansion
        - id: expansion-ispm
          label: ISPM / EIM 扩展
          description: |
            ISPM 覆盖混合环境中的身份态势；EIM 覆盖承包商和第三方身份。推动现有账户继续扩席。
          stage: expansion
        - id: expansion-ai
          label: AI 身份治理
          description: |
            Agent Access Gateway 和面向 AI Agent 的 ISPM 负责治理 AI 工作负载。截至 2026 年 3 月，已有早期采用设计伙伴（Hertz、Auto Club Group、UKG）。
          stage: expansion
    claimRefs:
      - CU013
      - CU014
      - CU017
      - CU018
      - CU019
      - CU033
      - CU034
  - id: FU002
    title: 采用与部署漏斗
    type: funnel
    layout: standard
    summary: |
      从认知到多模块扩展的近似漏斗，展示公开证据出现在哪里、缺口仍在哪里。
    data:
      items:
        - label: 认知 / 市场存在感
          value: 100
          note: |
            IGA 市场：全球约 3,000+ 家企业有复杂身份需求（分析师估算）。Saviynt 活跃覆盖 8 个具名垂直行业；Gartner/KuppingerCole 领导者地位带来入站评估。
        - label: 活跃评估（PoV/PoC）
          value: 60
          note: |
            从合作伙伴页面引用和销售周期披露看，相当一部分潜在客户会走到 PoV 阶段。公开资料没有胜率数据。
        - label: 初始 IGA 部署
          value: 40
          note: |
            截至 FY2024，已披露 500+ 家企业客户在生产环境使用。增长率和管线健康度无法公开验证。
        - label: 多模块扩展
          value: 20
          note: |
            111% 的 NRR 暗示明显交叉销售 / 追加销售，但使用 2 个以上模块的客户占比未披露。SI 合作伙伴生态支撑多模块交付。
        - label: AI 身份治理（新兴）
          value: 5
          note: |
            截至 2026 年 3 月，有三家具名设计伙伴（Hertz、Auto Club Group、UKG）。GA 和更广泛采用尚未量化。
    approximationNotes: |
      阶段数值是示意比例，不是绝对客户数。漏斗形态根据已披露客户数（500+）、合作伙伴页面引用和 NRR 轨迹推断。Saviynt 没有公开胜率或管线转化数据。
