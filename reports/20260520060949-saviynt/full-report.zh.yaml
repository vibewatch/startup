          components:
            - Self-service Access Portal
            - Admin Console
            - Compliance Reporting
            - AI Agent Runtime Interface
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    summary: 展示企业用户申请访问，以及 AI Agent 通过 Agent Access Gateway 申请运行时访问的端到端流程。
    data:
      nodes:
        - id: user-request
          label: 用户 / AI Agent 访问请求
          detail: 人类用户通过自助门户申请应用访问；AI Agent 通过 Bedrock、Copilot Studio、Vertex AI、ServiceNow AI 或 Agentforce 向受治理系统发起 API 调用
          group: input
        - id: policy-evaluation
          label: EIC 策略引擎
          detail: 评估 SoD 规则、RBAC/ABAC 策略、SaviAI 风险评分，并路由审批流程
          group: core
        - id: saviai-risk
          label: SaviAI 风险评分
          detail: AI 引擎基于权限历史、同组人群分析和异常检测给访问风险打分； 将高风险事项推送到审核队列
          group: core
        - id: approval-workflow
          label: 审批 / 认证流程
          detail: 经理或数据所有者认证访问；AI 优先级队列降低审核疲劳；低风险请求自动审批
          group: process
        - id: access-grant
          label: 访问开通 / 拒绝
          detail: 连接器框架在目标系统（AD、SAP、Salesforce、AWS IAM 等）中开通权限；AAG 对 AI Agent 执行 JIT 策略
          group: output
        - id: audit-log
          label: 审计与合规日志
          detail: 为所有访问决策保留不可篡改的审计轨迹；支撑 SOC 2、FedRAMP 和 PCI-DSS 报告；当态势漂移时触发 ISPM 告警
          group: output
      edges:
        - from: user-request
          to: policy-evaluation
          label: 访问请求已提交
        - from: policy-evaluation
          to: saviai-risk
          label: 请求风险评估
        - from: saviai-risk
          to: approval-workflow
          label: 返回风险评分；标记高风险
        - from: approval-workflow
          to: access-grant
          label: 已批准或自动批准
        - from: policy-evaluation
          to: access-grant
          label: 低风险自动开通
        - from: access-grant
          to: audit-log
          label: 记录决策
