  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Enterprise Identity Cloud——五模块架构
        blocks:
          - type: paragraph
            body: >-
              Saviynt 的 Enterprise Identity Cloud（EIC）是一套云原生 SaaS 平台，把身份治理、特权访问、态势管理、外部身份管理和 AI
              智能体身份治理收敛到一个多租户服务中。平台声称不提供本地部署选项，这一点把它与仍维持混合架构的传统 IGA 厂商区分开来。EIC 由五个独立模块构成：（1）Identity Governance and
              Administration（IGA），核心模块，覆盖配置开通、访问认证、RBAC / ABAC 策略管理和 SoD 执行；（2）Cloud PAM，覆盖云基础设施的特权访问控制和即时访问；（3）Identity
              Security Posture Management（ISPM），检测错误配置、影子管理员和过量常驻权限；（4）External Identity
              Management（EIM），治理承包商、合作伙伴和供应商等第三方劳动力的身份生命周期；（5）Application Identity Security（Agent Access
              Gateway，AAG），最新模块，在运行时治理非人类身份和 AI 智能体身份。


              平台底层由 SaviAI 引擎支撑。Saviynt 称，SaviAI 将四类不同 AI 智能体嵌入各模块：生命周期管理 AI、应用上线 AI、安全运营 AI、身份管理 AI。Saviynt Exchange
              市场提供对 750+ 开箱即用应用连接器和合作伙伴构建集成的自助访问，其中包括来自 CrowdStrike、Zscaler、Wiz 和 Cyera 的风险信号源。KuppingerCole
              分析师称，Saviynt 在 IGA 领域拥有「所有供应商中最广的开箱即用集成用例列表」，但本次审查未能从分析上验证这一说法。


              五模块架构被包装成相对于点状 IGA+PAM 堆栈的收敛替代方案；但 Cloud PAM 缺少专门产品页，且用户反馈称其 PAM 功能深度不及专业厂商（CyberArk、BeyondTrust），说明收敛叙事在
              IGA 和 ISPM 上更强，在 PAM 上较弱。
