      - number: '6.2'
        title: 采用轨迹与增长信号
        blocks:
          - type: paragraph
            body: >
              Saviynt 在 2024 年突破 500 家企业客户——公司在披露员工数超过 1,000 人时同时披露了这一里程碑。更早披露的基准显示，FY2020 新客户同比增长 50%，2024
              年多个季度持续创纪录。截至 2026 年 1 月，Gartner Peer Insights 上记录的 249 条评价，是该平台所有 IGA 厂商中经验证评论数量最高；LinkedIn 343,110
              名关注者，也显示企业心智相对同业在提升。VF Corporation 在平台中上线 35,000 个自然人身份和 17,000 个非人类身份，并在 18 个月内迁移 230
              个应用——这是部署深度的应用级指标。Auto Club Group 是北美第二大 AAA 俱乐部，拥有 13 million 会员；它在 12 个月内完全停用传统身份平台，目前所有关键配置开通均通过
              Saviynt 处理。100 million-plus 的身份保护数字覆盖整个已部署客户群，由公司披露且未经独立审计；分母（所有客户企业员工总数）未知，因此该指标难以独立对标。Q3 2024
              被描述为预订额创纪录季度，FY2024 年度结果披露预订额同比增长超过 45%。公司未发布按客户队列、地域或垂直行业拆分的 ARR。
