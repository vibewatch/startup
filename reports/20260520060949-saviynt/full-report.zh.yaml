              AB Private Credit Investors 领投的 $205M 融资，把当时累计资本推至 $375M。主要披露轮次的累计资本目前至少为 $1.075B。仍有两项未解决：（1）2025 年融资的新股 /
              老股拆分和投资者优先权结构，它决定 $3B 对新资金投资者是否是经济上真实的定价；（2）一笔据称由 Goldman Sachs Asset Management 领投的独立 $205M
