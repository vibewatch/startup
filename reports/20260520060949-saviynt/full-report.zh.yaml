      - number: '2.2'
        title: 多视角市场测算
        blocks:
          - type: paragraph
            body: >-
              公开市场数据支持这是一个大品类，但并不能给出一个干净的 Saviynt TAM。Mordor Intelligence 将 2026 年身份治理与管理市场规模估为 $9.57 billion，Fortune
              Business Insights 则将同一 2026 年品类估为 $10.7 billion。这个区间方向一致，但仍足够宽，尽调应保留区间，而不是压成虚假的共识。更广泛的 IAM 品类大得多：The
              Business Research Company 预计 2026 年 IAM 为 $25.23 billion，MarketsandMarkets 则预计该品类从 2025 年的 $25.96 billion
              增至 2030 年的 $42.61 billion。这些更宽的 IAM 数字不能当作 Saviynt 的 TAM，因为其中包含了位于 Saviynt 核心 IGA 切入口之外的相邻访问管理和客户身份支出。


              特权访问管理是最相关的相邻市场。Fortune Business Insights 预计 2026 年 PAM 市场为 $5.58 billion；The Business Research Company
              将该细分从 2025 年 $4.87 billion 基数描绘到 2030 年 $17.26 billion；Technavio 则报告 2024 至 2029 年期间增长极快。因此，保守的可服务切入口应从核心
              IGA 出发，只加入与 Saviynt 现有产品范围重叠的 PAM 和非人类身份需求子集。用 Mordor 的 70.63% 大型企业支出占比作为约束，可得到约 $6.76-$7.56 billion 的公开证据
              SAM，且尚未施加任何份额假设；由于 Saviynt 不披露模块收入、细分组合或市场份额，精确的公开 SOM 仍不可得。
