    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与市场位置
        blocks:
          - type: paragraph
            body: >
              Saviynt 由 Sachin Nayyar 和 Vibhuti Sinha 于 2010 年创立，总部位于加州 El Segundo。公司以「Identity Security for AI. AI for
              Identity Security.™」作为标语，并称其使命是借助智能身份治理，帮助企业保护数字化转型。截至 2026 年中，Saviynt 的 LinkedIn 资料显示员工规模为 1,001–5,000
              人；公司称其在全球客户群中保护超过 1 亿个身份。Saviynt 与 SailPoint、Oracle 同场竞争于身份治理与管理（IGA）市场，但差异化在于一个云原生单一平台，把
              IGA、特权访问管理、应用访问治理、身份安全态势管理和外部身份管理汇聚起来。公司也把自己放在 AI 与身份的交汇点，2026 年初推出专为 AI 智能体治理打造的能力。Gartner Peer Insights
              连续五次授予 Customers' Choice，KuppingerCole 将其列为 IGA 和 PAM 的 Overall Leader，这些分析师认可支撑了 Saviynt
              作为企业身份安全市场一线厂商的地位。
