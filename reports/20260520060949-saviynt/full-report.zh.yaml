      - number: '4.3'
        title: 单位经济与销售效率
        blocks:
          - type: paragraph
            body: >
              Saviynt 不披露获客成本（CAC）、CAC 回本周期、客户终身价值（LTV），或销售与营销费用占收入比例。这些指标只能从可得代理数据推断。公司的 111% NRR 和 >95% GRR
              意味着有效流失率为负：每个客户队列会随时间增长，不需要额外新客户获取也能维持 ARR。相较于披露的 >35% 新客户订单增长，这一动态显著改善了隐含 CAC 回本经济性。


              员工增长提供了成本代理：Saviynt 从 2022 年初约 850 名员工（FY2021 公告后）增至 2024 年 Q3 超过 1,000 名，意味着增长阶段净增 150+ 名员工。2026 年 5 月
              LinkedIn 数据显示约 1,626 名员工，说明 2025–2026 年仍在投入人力。高管招聘模式——来自 Similarweb 和 Appian（均为 IPO 前科技公司）的 CMO、新设 Chief
              Commercial Officer 职位（Pete Angstadt），以及 2026 年 5 月聘任的 Chief Customer Officer（Brad Myers）——显示组织正在搭建更清晰的 GTM
              动作。AWS Strategic Collaboration Agreement（2025 年 7 月）和 Deloitte 联盟提供由伙伴贡献的管线，CAC
              低于直接销售，契合公司对生态驱动增长的强调。上市可比公司 SailPoint 报告称，超过 90% 的新交易经由伙伴网络流入；Saviynt 看起来也在复制这一模式。
