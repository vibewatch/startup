  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >
              Saviynt 的收入主要来自多年期 SaaS 订阅合同，按身份数量（按席位）计价。公司的 Enterprise Identity
              Cloud（EIC）把五大产品支柱——身份治理与管理（IGA）、云特权访问管理、身份安全态势管理、应用访问治理和外部身份管理——打包成统一平台，并提供白金、黄金、白银三个服务层级。FY2024 订阅收入占总收入的
              88%，高于前几年，说明公司有意从实施和专业服务转向订阅。剩余 12% 来自专业服务、实施项目和培训；随着 SaaS 组合成熟，这些收入占比预计会下降。


              Saviynt 不公布标价。企业交易通过商业谈判确定，价格受身份总数、授权产品模块、多年承诺长度和服务层级影响。PeerSpot 客户评价称，其定价模型可与 Microsoft Azure Entra ID
              Governance 相比，在企业 IGA 细分中整体有竞争力，不过也有评价认为，相比小型厂商它偏贵。FY2024 新 SaaS 年度合同价值（ACV）订单约 $60 million，同比增长超过
              35%，说明高价位上的新业务动能强劲。收入确认遵循标准 SaaS 订阅会计：已承诺合同价值在合同期内按比例确认，实施费用递延，并在预期客户生命周期内确认。
