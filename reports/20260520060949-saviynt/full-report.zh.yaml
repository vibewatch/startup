      - number: '5.2'
        title: SaviAI 与 AI 智能体身份安全
        blocks:
          - type: paragraph
            body: >-
              2026 年 3 月 24 日，Saviynt 发布 Identity Security for AI，这是一个三支柱框架，针对智能体 AI 系统带来的治理缺口。三大支柱为：ISPM for AI（检测 AI
              身份错误配置和过量 AI 权限）、Identity Lifecycle Management for AI（配置和注销 AI 智能体身份）以及 Agent Access
              Gateway（AAG），后者为运行在五个受支持智能体构建生态中的 AI 智能体执行访问策略：Amazon Bedrock、Microsoft Copilot Studio、Google Vertex
              AI、ServiceNow AI Agents 和 Salesforce Agentforce。Hertz、Auto Club Group 和 UKG 被列为发布时的设计伙伴。


              2026 Saviynt CISO AI Risk Report 提供了市场叙事支撑：71% 受访 CISO 称 AI 可访问核心业务系统，91% 称对 AI
              身份的可见性有限或没有可见性。这些由公司赞助的调查结果，与 CSO Online 对非人类身份治理问题的独立报道在方向上相符；但 Saviynt 声称自己能独特地解决该问题，这一点存在争议。VentureBeat
              的 RSAC 2026 AI 智能体治理框架综述列出五家供应商（Cisco、CrowdStrike、Microsoft、Palo Alto Networks 和 Cato Networks），没有包括
              Saviynt——这是一个有意义的独立信号：截至 2026 年 5 月，Saviynt 的 AI 治理叙事尚未打入该领域一线分析师和媒体覆盖。


              在 2026 年 3 月发布之前，Saviynt 已在 AI 工具生态中建立定位：2023 年 12 月入选 Microsoft Security Copilot 合作伙伴私有预览，并于 2025 年 7 月宣布
              AWS Strategic Collaboration Agreement，其中包括与 Amazon Q Business 的原生 Data Accessor 集成。SaviAI 引擎底层依赖哪些 LLM
              未公开披露；缺少明确 LLM 供应商归属，构成围绕访问决策路径中模型可靠性、数据驻留和幻觉风险的尽调缺口。
