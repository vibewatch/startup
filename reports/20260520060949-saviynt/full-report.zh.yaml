    title: 估值
    sections:
      - number: '8.1'
        title: 建议：在 $3B 定价下继续研究，老股比例是摇摆因素
        blocks:
          - type: paragraph
            body: >-
              Saviynt 不是一笔投机性押注。公司持续签下企业客户，报告 EBITDA 盈利，并刚从 KKR 这个战略身份安全买家那里获得多十亿美元定价，Sixth Street 和 TenEleven 同轮参与。2025
              年融资是 Saviynt 迄今获得的最强外部背书，而且明确定价为成长股权交易，而非困境交易；这会影响投委会如何框定估值。


              话虽如此，建议必须对价格敏感，而不是对声誉敏感。SecurityWeek 指出，$700 million 中大部分「unlikely to go directly into the
              business」，这意味着存在显著老股成分，而公司拒绝披露细节。Saviynt 总裁也告诉
              BankInfoSecurity，该交易被设计为一项少数股权投资，让现有股东保留控制权；这与老股占比较高的成长轮相符。在投资者看到新股 / 老股拆分、优先权堆叠，以及能锚定隐含倍数的当前 ARR
              之前，正确姿态是中等信心的继续研究，而不是买入。$3 billion 打印价是工作锚点，不是已证明底部。
