  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 方向
      - 哪些证据会改变判断
    rows:
      - - KKR 领投的 $700M 融资、约 $3B 估值，是来自可信身份安全投资人的强外部定价。
        - 投资逻辑
        - 若结构中老股占比较高，或新股资金用途偏弱，会削弱该标记的信号价值。
      - - KKR 过往身份安全退出（Ping Identity、ForgeRock、Semperis）显示其有可信退出打法。
        - 投资逻辑
        - 若多年内没有任何退出信号，该打法与本持有期的相关性会下降。
      - - 据前几章，Saviynt 已实现 EBITDA 转正，ARR 增长 >35%，净收入留存率 111%。
        - 投资逻辑
        - ARR 增长若持续降至约 25% 以下，或 NRR 滑向 100% 线，将削弱基准情景。
      - - 管理层披露的 96% 总收入留存率，对企业 IGA 来说异常强。
        - 投资逻辑
        - 任何对 GRR 的独立否定，或客户集中度证据，都会削弱耐久性判断。
      - - 隐含 10x-16x ARR 倍数明显高于 SailPoint 和 Okta 公开倍数。
        - 反向逻辑
        - 若转向可用于申报级别的公开 ARR 披露，或增长加速，溢价会更容易辩护。
      - - 公开证据未披露新股 / 老股拆分、优先股堆叠或 IPO 时间表。
        - 反向逻辑
        - 披露融资结构，并给出 CFO 级投资者更新，会显著提高可承销性。
      - - Microsoft、交易后的 PANW-CyberArk，以及 SailPoint 的捆绑式身份治理可能压缩价格。
        - 反向逻辑
        - 若持续拿出对捆绑竞争对手的胜率证据，这一论点会明显改观。
    notes: 这些论点有意保持价格敏感。它们描述 $3B 标记已经包含的假设，而不只是底层公司本身成立的事实。
