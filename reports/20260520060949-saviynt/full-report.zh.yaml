          - type: callout
            title: IPO 准备信号正在加速
            body: >-
              从 pre-IPO 科技公司（Similarweb、Appian）引入 CMO，任命新的 Chief Commercial Officer 和 2026 年的 Chief Customer Officer，再叠加
              AWS 与 Deloitte 的战略合作，符合一家组织准备在 12–36 个月窗口内上市的画像。IPO 将提供经审计财务、分析师覆盖和老股流动性，从而解决当前大部分财务尽调缺口。
            calloutType: insight
