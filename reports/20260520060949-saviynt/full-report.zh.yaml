      - number: '4.6'
        title: 财务结论与尽调优先事项
        blocks:
          - type: paragraph
            body: >
              Saviynt 披露的财务指标呈现出一家高质量、正在规模化的 SaaS 公司画像：年经常性收入（ARR）增长 >35%、净留存率（NRR） 111%、订阅毛利率约 80%、FY2024 EBITDA
              转正。若按表面值看，这些指标足以让 Saviynt 在企业 SaaS 公司中进入增长质量前十分位。私营公司约束——没有经审计财务、没有 GAAP
              利润表、没有资产负债表披露——使任何数字都无法独立核验。本章引用的每一项指标均来自公司披露。


              重大尽调缺口包括：（1）确切美元收入和 ARR（只披露 >35% 的方向性增长；基于 Q3 >$185M 的最佳估算，年末 ARR 为 $200–220M）；（2）净利润或 GAAP
              经营亏损；（3）自由现金流；（4）资产负债表和现金跑道；（5）超过「500+」之外的精确客户数；（6）CAC、LTV 和销售效率比率；（7）2025 年 12 月 $700M 融资的新股 /
              老股比例和优先权结构。最近的估值锚点是 2025 年 12 月 KKR 领投融资给出的约 $3 billion——较 2021 年一轮隐含的约 $1.375B
              明显抬升，但新旧资金比例不明，意味着新资金投资者获得的经济价值仍需进一步尽调。作出任何投资决定前，都需要一个财务尽调数据室，提供经审计财务、股权结构瀑布和队列留存数据。


              2025 年 12 月 $700M 融资，加上 FY2024 EBITDA 盈利，给 Saviynt 提供了厚实资本底座，并把 $3B 定为当前工作估值。IPO 相关招聘信号（pre-IPO CMO、2026
              年新任 CCO 和 Chief Customer Officer）显示管理层正在为 12–36 个月窗口内的流动性事件做准备，届时将提供经审计的公开财务。战略风险在于执行：公司要在吸收 >1,600 名员工、部署
              $700M 新资本、扩张进入新的 AI 智能体治理产品线的同时，维持 >30% ARR 增长；这需要严格的单位经济模型，而该模型尚无法独立核验。
