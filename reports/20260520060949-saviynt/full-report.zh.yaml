  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 只有当前 ARR 达到或高于约 $250M，$3B 标记才算舒适；更低 ARR 会把隐含倍数推入战略交易区间，却没有战略协同。
    data:
      items:
        - label: $185M ARR 下的隐含倍数
          value: 16.2
          detail: 使用前文报告的 FY2024 合同 ARR，作为保守锚点。
          tone: negative
        - label: $250M ARR 下的隐含倍数
          value: 12
          detail: 2024 财年披露后继续增长 >35%，以此作为 2025 年末 ARR 基准情形。
          tone: warning
        - label: $300M ARR 下的隐含倍数
          value: 10
          detail: 匹配持续 >35% 增长和扩展预订的上沿估算。
          tone: neutral
        - label: $350M ARR 下的隐含倍数
          value: 8.6
          detail: 乐观 ARR 假设；会让 Saviynt 站到 Ping/ForgeRock 区间上沿。
          tone: positive
    approximationNotes: 倍数只是 $3B / ARR 的简单比值；不是折现现金流输出，并且取决于 Saviynt 截至 2026-05-20 运行日期尚未公开披露的 ARR 数字。
