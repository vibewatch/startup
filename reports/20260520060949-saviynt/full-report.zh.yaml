      - number: '8.4'
        title: 情景逻辑：乐观情景像 CyberArk，悲观情景像 SailPoint
        blocks:
          - type: paragraph
            body: >-
              Saviynt 的乐观情景是，公司维持 30%+ ARR 增长，执行 2026 年 3 月新闻稿中描述的 AI 智能体和非人类身份扩张，并最终吸引战略收购方支付类似 CyberArk
              的溢价。在这一路径下，Saviynt 有现实机会在两到三年内把 ARR 推向 $500 million，并在战略退出中获得 12x–15x 追踪倍数，支撑 $6–7 billion 结果，大致让 2025
              年进入价上的新股投资者翻倍。KKR 过去在 Ping Identity、ForgeRock 和 Semperis 上的身份安全成功案例，说明领投方对这一终局有可信打法。


              基准情景是，Saviynt 继续增长，但公开市场倍数环境正常化。ARR 两年内扩至 $350–$400 million，公司出售或 IPO 时面对更接近 SailPoint 和 Okta
              倍数的公开可比环境（7x–10x），最终股权价值落在 $3–4 billion 左右。这对耐心战略投资者可以接受，但除非新股 / 老股组合有利，对 2025 年定价进入的新资金上行有限。


              悲观情景很直接：实施复杂性、支持压力，以及来自 Microsoft、SailPoint 和 Palo Alto Networks 的捆绑竞争，把增长压向 15%–20%；留存跌破当前 96%
              总留存水平；未来融资或退出把 Saviynt 重新定价到更接近 SailPoint 的 5x–7x 倍数，且 ARR 基数更温和。这一路径意味着 $1.5–$2 billion 股权价值，显著低于 2025
              年定价；这也是本章即便尊重该轮融资，仍不提出买入建议的原因。
