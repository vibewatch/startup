      - number: '1.5'
        title: 产品、技术平台与 AI 战略
        blocks:
          - type: paragraph
            body: >
              Saviynt 的 Enterprise Identity Cloud（EIC）是一个云原生 SaaS 平台，汇聚五大主要产品支柱：身份治理与管理（IGA）、云特权访问管理（Cloud
              PAM）、身份安全态势管理（ISPM）、应用访问治理（AAG），以及面向第三方访问的外部身份管理。这个统一架构让客户可以整合过去通常需要多个供应商、多个点状解决方案才能覆盖的身份工具。

              Saviynt 的 AI 战略是双向的：一方面用 AI 增强身份决策（智能访问建议、风险评分、异常检测），另一方面为 AI 智能体本身搭建治理基础设施。2026 年 3 月推出的「Saviynt Identity
              Security for AI」被公司描述为首个从发现到运行时治理 AI 智能体的企业级平台，它把 EIC 扩展到非人类身份，包括 LLM 驱动的智能体、服务账号和自动化工作流。2025 年 7 月，一个 MCP
              Server 被列入 AWS Marketplace 的 AI Agents and Tools 类别，使 AI 助手能够接入身份工作流。Hertz、Auto Club Group、UKG 等客户在发布时提到了
              AI 智能体治理能力。
            claimRefs:
              - CO026
              - CO027
              - CO028
              - CO035
          - type: figure
            figureRef: FO002
            claimRefs:
              - CO026
              - CO027
              - CO028
      - number: '1.6'
        title: 合作伙伴生态与战略联盟
        blocks:
          - type: paragraph
            body: >
              Saviynt 运营着一个覆盖全球 400 多家渠道合作伙伴的广泛生态。最重要的战略协同来自 Amazon Web Services：Saviynt 于 2025 年 7 月签署 AWS Strategic
              Collaboration Agreement（SCA），建立优先合作伙伴关系，向 AWS 客户共同销售身份安全能力。KPMG Australia 被列为 APAC 区域的关键渠道伙伴。2021 年 7
              月，Saviynt 与 Deloitte 扩大战略联盟，提供交钥匙式托管身份服务，使 Deloitte 能以托管服务方式交付 Saviynt EIC 实施。Saviynt 也是 Microsoft
              Intelligent Security Association 成员，并于 2023 年 12 月入选 Microsoft 的 Security Copilot Partner Private
              Preview，获得对 Microsoft AI 安全平台的早期集成权限。2025 年 6 月，曾任职 Palo Alto Networks 和 Citrix 的 Steve Blacklock 加入，担任
              SVP Global Partners，以加速伙伴生态增长。技术集成覆盖 CrowdStrike、Zscaler、ServiceNow、Wiz 等。
            claimRefs:
              - CO031
              - CO032
              - CO033
              - CO034
      - number: '1.7'
        title: 风险、反向信号与尽调缺口
        blocks:
          - type: paragraph
            body: >
              已有若干风险因素和反向信号。第一，2025 年 8 月，一位中端市场银行的身份与访问管理总监在 Gartner Peer Insights 发布评价，给 Saviynt 打出 2.0/5
              分，称支持「糟糕透顶」，并提到「组织内人员大规模流失」影响服务管理。PeerSpot 评价中的第二个批评主题，是 Saviynt 相对 SailPoint
              的定制能力有限：多名用户指出，复杂配置仍需要开发工作，是一个摩擦点；也有客户称，供应商响应慢导致上线项目延期。这些反向信号与 Gartner Peer Insights 4.8/5
              的总体评分形成对照，说明满意度差异可能与客户规模和实施复杂度相关。

              第二，Amit Saha 到 Sachin Nayyar 的 CEO 交接发生在 2022 年 4 月至 2023 年 12 月之间，但没有公开公告；对 Saviynt
              这一级别的公司而言并不常见，也引出对交接背景的疑问。第三，「剔除降售后约 98%」的 GRR 意味着，包含降售时披露的 GRR 高于
              95%，说明部分客户减少了合同范围。第四，所有财务数据均仅由公司披露；尚未确认有独立审计。最后，外传「Goldman Sachs Asset Management 领投的 $205 million Series
              B 融资」（BusinessWire/PRNewswire，2024 年 10 月）虽经多次 URL 尝试仍无法验证；本报告将其视为未确认事项，并与已验证的 2025 年 12 月 KKR 领投、估值约 $3
              billion 的 $700 million 融资区分开。
            claimRefs:
              - CO036
              - CO037
              - CO038
              - CO039
      - number: '1.8'
        title: 图表与补充材料
        blocks:
          - type: callout
            title: 留存经济显示竞争位置有韧性
            body: >-
              FY2024 的 111% NRR 叠加 >95% GRR，说明 Saviynt 既守住了现有收入，也在客户群内部扩大钱包份额。这一组合——尤其是 NRR 在一年内从 104% 提升至
              111%——更像是平台在现有账户中扩展到相邻身份用例（PAM、ISPM、AAG），而不是只靠新客户获取来增长。
            calloutType: strength
            claimRefs:
              - CO006
              - CO007
              - CO011
          - type: callout
            title: AI 智能体治理可能成为近期差异化点
            body: >-
              2026 年 3 月发布 Saviynt Identity Security for AI，让公司站到了身份治理和 AI 编排的交汇处。企业部署能够访问生产系统的 LLM
              智能体之后，能以治理人类身份同等严格度治理非人类身份的 IGA 厂商，会获得结构性优势。Saviynt 自称是首个 AI 智能体治理企业级平台；若能在 2026–2027
              年产品周期中守住这一说法，可能会加快其在竞争性评估中的胜率。
            calloutType: insight
            claimRefs:
              - CO027
              - CO028
          - type: callout
            title: CEO 静默交接与支持投诉带来尽调不确定性
            body: >-
              Amit Saha 与 Sachin Nayyar 之间未公告的 CEO 更替（估计发生在 2022 年 4 月至 2023 年 12 月之间），对一家达到 Saviynt
              规模和融资水平的公司而言，是不典型的披露模式。再叠加 2025 年 8 月 Gartner Peer Insights
              负面评价称支持「糟糕透顶」、服务管理团队「人员大规模流失」，一个值得在客户访谈中细查的运营质量叙事就成立了。
            calloutType: risk
            claimRefs:
              - CO036
              - CO038
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Saviynt
              首先应被视为企业身份治理与管理厂商，并在特权身份和非人类身份安全上具备重要相邻性，而不是整个身份与访问管理市场的代理。外部产品和分析师定义对核心问题集基本一致：生命周期开通和停用、访问审批、权限治理、可审计性、职责分离控制和持续合规。IBM
              Verify Identity Governance、SailPoint Identity Security Cloud、Oracle IAM 和 MarketsandMarkets
              对品类边界的描述，都比一次性认证更宽，但比完整 IAM 技术栈更窄；后者还可能包括 CIAM、访问管理和更广泛的员工身份工具。


              做市场测算时，这一区分很关键。应纳入的支出包括企业 IGA 平台、合规驱动的访问认证、特权账号治理，以及治理服务账号、机器人和 AI 关联非人类身份的扩展需求。应排除的支出包括消费者 IAM、纯认证或 SSO
              预算，以及买方并未采购生命周期治理或合规控制的独立访问管理工具。因此，现状替代方案不是单一厂商，而是手工访问复核流程、点状 PAM 工具，以及已覆盖部分工作流的更广泛 IAM
              套件的混合体。当买方希望把这些碎片化控制收拢到一个云原生身份安全控制平面上时，Saviynt 的切入口最强。
