      - number: '5.4'
        title: 安全态势、认证与合规
        blocks:
          - type: paragraph
            body: >-
              Saviynt 为企业 SaaS 持有较强合规组合：FedRAMP Moderate 授权（2022 年 7 月取得，称获批时为首个 IGA+PAM 组合的 FedRAMP Moderate 授权）、ISO
              27001:2022、ISO 27017、SOC 1 Type II、SOC 2 Type II 和 PCI-DSS v4.0——这些认证的 2025
              年审计完成情况均通过信任门户（trust.saviynt.com）确认。信任门户 不公开实时 uptime 仪表盘或事故历史，限制了外部对 SLA 和可靠性的审计能力。


              Saviynt 于 2024 年 5 月签署 CISA 的 Secure by Design pledge，是最早签署的 100 家公司之一。该承诺自愿且不具约束力；CISA 也未定义执行机制。Saviynt
              2026 年 4 月获得 Gartner Peer Insights Customers' Choice for IGA（连续第五次获评），是最突出的第三方质量信号：截至 2026 年 1 月，249
              条经验证客户评价，平均 4.8/5，在该类别获评厂商中评价数量最高。少数 Gartner 评论给出 2.0/5 评分，理由包括实施困难和支持质量差；这部分抵消了该认可，也与 PeerSpot
              评论中浮现的复杂度信号一致。


              这套合规栈适合受监管行业企业买家（FSI、医疗、联邦），但公开安全页面不包含 HIPAA BAA 文档、HITRUST 认证或 FedRAMP
              High，因而限制了部分需要更高安全基线的联邦机构和医疗用例的可服务市场。
