  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Saviynt 处在三个相互重叠的竞争细分中：身份治理与管理（IGA）、特权访问管理（PAM），以及把二者统一起来的新兴身份安全平台品类。在 IGA 中，SailPoint（NASDAQ:
              SAIL）是公开宣称的收入领先者，称其覆盖 53% 的 Fortune 500，并获评 2026 Gartner Peer Insights Customers' Choice。在 PAM 中，Palo Alto
              Networks 的 Idira——基于 CyberArk 遗产打造，并于 2026 年 5 月 12 日推出——拥有最深的企业装机基础，约 10,000 名客户，且如今受益于 PANW
              完整安全产品组合的分发。相邻身份平台包括 One Identity（IGA+PAM+AM 统一）、Omada Identity Cloud（云原生 IGA，以 EMEA 为主）和 Ping
              Identity（Thales Group 旗下，AI 驱动 IGA）。Oracle Identity Governance 和 IBM Verify Identity Governance
              这些传统既有厂商代表正在下行的本地部署替代方案，也制造了迁移驱动的顺风。Microsoft Entra ID Governance 包含在每用户每月 $12 的 Entra Suite 中，对中端市场和既有
              Microsoft 365 账户形成结构性定价压力。内部自建方案，以及通过电子表格和 Active Directory 组进行的手工角色管理，仍是 Saviynt 首次销售要替代的现状。2024
              年以来最关键的结构性变化，是 PANW 收购 CyberArk（2025 年 7 月宣布，2026 年初完成）：它扩大了身份安全战场，并设定了直接竞争 Saviynt 统一 Enterprise Identity
              Cloud 定位的平台化轨迹。
