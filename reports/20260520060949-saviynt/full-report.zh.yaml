          detail: AWS 多租户 SaaS 托管；FedRAMP Moderate 边界；SOC 1/2 Type II 审计控制；ISO 27001:2022 / 27017 认证；PCI-DSS v4.0 范围
          components:
            - AWS Cloud Infrastructure
            - FedRAMP Authorization Boundary
            - Audit & Compliance Controls
        - label: SaviAI 引擎
          detail: 四类 AI Agent：生命周期管理 AI、应用接入 AI、安全运营 AI、身份管理 AI；底层 LLM 未披露
          components:
            - Lifecycle Management AI
            - App Onboarding AI
            - Security Operations AI
            - Identity Administration AI
        - label: 身份治理模块
          detail: 五个融合 EIC 模块：IGA（核心）、Cloud PAM（特权）、ISPM（态势）、EIM（外部）、AAG（AI Agent）
          components:
            - Identity Governance & Administration (IGA)
            - Cloud Privileged Access Management (PAM)
            - Identity Security Posture Management (ISPM)
            - External Identity Management (EIM)
            - Agent Access Gateway (AAG)
        - label: 集成与连接器层
          detail: >-
            通过 Saviynt Exchange 提供 750+ 个开箱即用连接器；Terraform provider（Go，MPL-2.0）；REST API；ServiceNow、SAP、AWS、
            Salesforce、CrowdStrike、Cyera 连接器
          components:
            - Saviynt Exchange (750+ connectors)
            - Terraform Provider
            - REST API
            - Partner Integrations (Cyera, Deloitte Digital Identity+)
        - label: 使用界面
