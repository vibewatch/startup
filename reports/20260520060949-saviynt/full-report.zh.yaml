      - number: '8.5'
        title: 触发因素与尽调问题：老股比例、ARR 证明和捆绑竞争决定结论
        blocks:
          - type: paragraph
            body: >-
              如果以下三个条件中任何一个变得明显，投资逻辑就会破裂。第一，如果 2025 年 12
              月融资最终多数为老股、且新增长资本有限，新资金的有效进入价格就比标题数字更差，该轮更像早期投资者的流动性事件，而不是成长融资。第二，如果 Saviynt 当前 ARR 被证明明显低于本章敏感性分析使用的
              $250–$300 million 区间，隐含倍数将上跳，$3 billion 定价会从可辩护变为明显偏高。第三，如果 Microsoft Entra、Palo Alto Networks-CyberArk
              收购后组合，或 SailPoint 由 IPO 资金支持的路线图在身份治理捆绑上拿走有意义份额，增长可能在任何退出发生前就被压缩。


              将继续研究转化为明确结论所需的尽调包很窄。投资者需要 2025 年融资的新股 / 老股比例和资金用途细节、优先权堆叠以及任何 ratchet 或 MFN 条款、按产品线拆分的干净 ARR 桥、前 10
              大客户集中度表、新董事会给出的 IPO 时间表或退出计划，以及当前按队列拆分的流失和净收入留存。Saviynt 只要发布一份 CFO 级投资者更新，披露水平接近 SailPoint
              公开文件，就能显著提高可承销性。在此之前，理性姿态是保持接触，明确断裂触发条件，并在更多融资结构变得可见时重新测试建议。
