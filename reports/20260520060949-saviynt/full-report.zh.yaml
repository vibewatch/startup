      - number: '4.5'
        title: 资本形成与财务充足性
        blocks:
          - type: paragraph
            body: >
              Saviynt 已在四次确认的主要融资中筹集资金。最初的 $40 million Series A 由 Carrick Capital Partners 在 2018 年领投（2019 年 10 月又追加 $10
              million）。2021 年 9 月，公司完成一轮 $130 million 成长融资，由 HPS Investment Partners 领投，PNC Bank 参投；该轮把已披露累计融资推至 $170
              million，财经和科技媒体广泛报道其隐含估值约为 $1.375 billion。第三轮确认融资为 2023 年 1 月宣布的 $205 million，由全球投资管理公司 AllianceBernstein
              旗下 AB Private Credit Investors 的 Tech Capital Solutions group 领投，使累计融资达到 $375 million；Sachin Nayyar 回任 CEO
              与 2023 年 1 月融资同时宣布。


              第四轮、也是最近一轮确认融资于 2025 年 12 月 9 日宣布：KKR 通过 Next Generation Technology Growth Fund 领投 $700 million Series B
              Growth Equity，估值约 $3 billion；共同投资方包括 Sixth Street Growth 和 TenEleven Ventures，现有投资方 Carrick Capital
              Partners 继续参与。按 $40M Series A 计算，四次确认主要融资的累计资本至少为 $1.075 billion；若按 $50M Series A+A1 合计计算，则至少为
              $1.085B。2025 年 12 月这一轮的新股与老股比例、投资者优先权结构尚未公开披露。


              另有一笔据称由 Goldman Sachs Asset Management 领投的 $205 million 融资（BusinessWire 和 PRNewswire，2024 年 10
              月）无法核验——所有检索尝试均返回 404 错误，也未找到 Saviynt 的配套新闻稿；该据称融资被视为未确认事项，并排除在累计融资总额之外。


              已确认轮次的投资方构成——Carrick（成长股权）、HPS（机构信贷 / 股权）、AllianceBernstein（私人信贷）和 KKR（成长股权）——显示 Saviynt
              的资本结构并未出现传统风投。2025 年 12 月 KKR 领投、估值约 $3 billion 的融资，是 Saviynt 迄今最重要的外部定价，也是当前尽调的工作估值锚点。确切资产负债表状况（账上现金、早期
              HPS / AB 融资中是否存在债务约束、剩余烧钱速度）仍未公开。
