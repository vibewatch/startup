      - number: '6.4'
        title: 留存与耐久性
        blocks:
          - type: paragraph
            body: >
              Saviynt 的净收入留存率（NRR）从 FY2021 的 97% 提升至 FY2023 的 104% 和 FY2024 的 111%，显示现有客户内的增购和交叉销售动能稳定。FY2024
              总收入留存率（GRR）超过 95%，若排除标准 downsell 类别约为 98%——这意味着正常市场条件下 logo 流失较低，但部分客户正在缩减合同身份量。公司未公开按签约年份或垂直行业拆分的队列级
              GRR。Gartner Peer Insights 249 条评论给出 4.8/5 评分——在 IGA 厂商类别中经验证评论数量最高——提供了广泛满意度信号，但 Gartner Peer Insights
              评分偏向愿意提交评论的客户，可能高估满意用户占比。PeerSpot 汇总的定性结论把 Saviynt 稳定性评为 6 到 8 分（满分 10），标记客户支持响应是反复出现的改进领域，并指出部分上线项目因
              Saviynt 侧响应问题延迟。TrustRadius Enterprise IAM 评论者强调全球企业部署的整合价值和可扩展性，但指出相对传统平台仍缺少拖拽式配置能力。111% NRR 与超过 95% GRR
              的组合，符合一个净扩张客户群；但 NRR 与 GRR 之间的差距也显示，部分存量客户在收缩支出，只是被净新增客户部分抵消。任何留存指标都无法独立核验；所有数字均由公司披露。
