  - id: FI001
    title: Saviynt 收入模型 — 订阅流架构
    type: flow
    layout: wide
    summary: 说明 Saviynt 的按身份计费 SaaS 定价如何从客户身份数流向 ARR 确认，再流向毛利；专业服务则是占比下降的低利润率组成部分。
    data:
      nodes:
        - id: identity-pool
          label: 客户身份基数
          detail: 覆盖 500+ 企业客户、保护 100M+ 身份；按身份计费模型驱动 ARR
          group: input
        - id: arr
          label: 签约 ARR
          detail: 多年期 SaaS 合同；Q3 2024 达 >$185M；订阅占比 88%；收入按期确认
          group: core
        - id: subscription-gp
          label: 订阅毛利
          detail: 订阅毛利率 ~80%；覆盖云托管、客户成功和支持成本
          group: output
        - id: services-revenue
          label: 专业服务
          detail: 占总收入 ~12%；利润率较低；随着 SaaS 渗透率提高，占比下降
          group: secondary
        - id: ebitda
          label: EBITDA（现金口径）
          detail: FY2024 首次转正；未披露具体规模；不含股权激励费用
          group: output
      edges:
        - from: identity-pool
          to: arr
          label: 按身份订阅定价
        - from: arr
          to: subscription-gp
          label: ~80% 毛利率
        - from: services-revenue
          to: ebitda
          label: 较低利润率贡献
        - from: subscription-gp
          to: ebitda
          label: OpEx 后的经营杠杆
    approximationNotes: 所有利润率数字均为公司披露估计。EBITDA 不含股权激励，且可能不含其他非现金项目。准确美元金额未公开。
    claimRefs:
      - CI006
      - CI007
      - CI041
  - id: FI002
    title: Saviynt 单位经济模型 — CAC 与留存代理流
    type: flow
    layout: standard
    summary: 梳理关键单位经济联动：高 NRR 降低 CAC 回本压力；合作伙伴获客降低获客成本；80% 订阅毛利率为 LTV 留出空间。
    data:
      nodes:
        - id: new-logo
          label: 新 Logo 获取
          detail: FY2024 SaaS ACV 预订额 ~$60M；增长 >35%；CAC 未披露；合作伙伴主导的 GTM 降低成本
          group: input
        - id: expansion
          label: 扩张 / 增购
          detail: NRR 111% 意味着现有基数每年带来 ~$20M+ 净扩张（估计）
          group: expansion
        - id: retention
          label: 留存引擎
          detail: GRR >95% / 剔除降购 ~98%；合规驱动粘性；连续五次获 Gartner 客户之选
          group: core
        - id: ltv
          label: 客户 LTV
          detail: '>95% GRR 和 111% NRR 暗示高 LTV；未披露准确数值'
          group: output
      edges:
        - from: new-logo
          to: retention
          label: 多年合同锁定
        - from: retention
          to: expansion
          label: 平台广度支撑交叉销售（PAM、ISPM、AAG）
        - from: expansion
          to: ltv
          label: NRR 无需新增 CAC 即可复利推动 ARR
    approximationNotes: CAC 回本和 LTV 未披露。~$20M+ 扩张收入基于 111% NRR 套用 ~$185M ARR 基数估计。实际数值需要财务数据室验证。
