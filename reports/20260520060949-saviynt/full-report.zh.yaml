      - number: '7.2'
        title: 法律、监管与透明度风险
        blocks:
          - type: paragraph
            body: >-
              Saviynt 的公开足迹显示其在合规上投入不小，但透明度只有部分到位。公司在公开安全网站上强调 ISO 27001、ISO 27017、SOC 相关控制和 FedRAMP Moderate 声明；它还签署
              CISA 的 Secure by Design pledge，并向受 SEC 式网络安全治理预期影响的客户销售。这些都是正面因素，但也抬高了要求：企业买家会期待可衡量的 secure-by-design
              进展、严谨的事故治理和清晰合同条款，且这些要求应与一家运营在访问治理和 AI 时代身份控制领域的供应商相匹配。Saviynt 隐私政策和订阅协议可公开访问，但详细安全材料和报告似乎放在客户 trust
              portal 背后，而不是完全公开的资料库中。由于已审查来源没有识别出公开诉讼、执法或事故历史包，法律 / 监管结论不是存在可见危机；而是外部尽调必须在公司明显合规姿态之外，承销剩余透明度缺口。
