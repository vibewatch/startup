      - number: '3.6'
        title: 图表与补充材料
        blocks:
          - type: callout
            title: PANW/Idira 平台化是首要结构性风险
            body: >
              Palo Alto Networks 完成收购 CyberArk，并在 2026 年 5 月推出 Idira，这是 Saviynt 创立以来其市场中最关键的竞争变化。PANW 的 70,000+
              客户基础、跨产品组合捆绑能力（身份 + 网络 + 云 + SOC），以及嵌入 Idira 的 CORA AI 能力，形成了 Saviynt 作为独立身份云厂商无法复制的平台经济优势。近期首要风险是，PANW
              把身份作为亏损引流产品，或以低于子市场价格的捆绑包留住安全平台客户；这些客户本来可能独立评估 Saviynt。Saviynt 的 AWS SCA 和统一 IGA+PAM
              定位能部分对冲，但结构性的体量不对称值得持续监控。
            calloutType: risk
            claimRefs:
