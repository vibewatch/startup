      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              最可信的 Saviynt 买方，是已经把身份视为治理和审计问题、而不只是登录问题的大型企业和受监管组织。Mordor 显示，大型企业占 IGA 支出的 70.63%，BFSI 是 2025 年最大垂直行业，占
              29.26%，这契合 Saviynt 偏大型企业的 GTM。此类环境中，身份团队、内部审计、安全和基础设施负责人都会关心开通质量、权限控制和合规复核证据。实践中，日常用户通常是 IAM
              或安全运营团队，但付款方可能落在 CISO、CIO，或共享 IT/合规预算之下，取决于项目被定位为合规自动化、特权访问压降，还是更广泛的身份安全整合。


              采用通常从一个具体治理工作流开始：访问认证、入转离自动化，或特权 /
              非人类身份控制。当平台能够证明审计响应更快、长期特权更少，并能跨人类和机器身份收紧生命周期控制时，采用范围就会扩大。Okta、IBM、SailPoint 和 Oracle
              都围绕治理、合规、生命周期和最小权限结果来定义市场，这进一步说明 Saviynt 不需要赢下每一笔 IAM
              预算，也能赢下自己的核心市场。因此，最适配的账户是大型、云优先的企业：它们已经感受到监管压力，并开始把身份治理从员工扩展到承包商、共享账号、机器人、服务账号和 AI 关联身份。
