- id: arr-growth-and-retention-metrics
  title: ARR Growth and Customer Retention
  body: "Saviynt's ARR trajectory is the strongest single signal of business health available for a private company of this scale. Contracted ARR exceeded $185 million at the end of Q3 2024 (as of December 10, 2024), with full-year FY2024 results confirming annual ARR growth above 35% for the second consecutive year. The company grew ARR 46% in FY2020 and 42% in SaaS revenue in FY2021, demonstrating a consistent high-growth pattern across the product maturity cycle. SiliconAngle's independent coverage of the FY2024 results corroborated the >35% ARR growth figure without adding additional specificity, consistent with the private-company practice of disclosing directional rather than absolute metrics.\n\nNet Revenue Retention improved to 111% in FY2024 from 104% in the prior year — a meaningful step-up that indicates the installed base is expanding faster than it is churning. Gross Revenue Retention exceeded 95% overall, or approximately 98% when standard downsell categories (such as renegotiated seat counts) are excluded. These retention metrics are consistent with enterprise SaaS companies in healthy, sticky compliance-driven markets. For context, SailPoint (the closest publicly traded peer) reported 90%+ gross retention and its NRR improved throughout its IPO preparation cycle (SailPoint re-IPO'd in May 2025). New customer bookings in Q3 2024 grew more than 45% year-over-year, and Q3 year-to-date subscription revenue grew more than 30% versus the prior year, both ahead of the FY2024 blended figure and suggesting Q4 2024 may have moderated slightly from Q3 bookings levels.\n"
