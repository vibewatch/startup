  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: exact-dollar-revenue
    missingEvidence: "GAAP annual revenue and ARR in absolute dollar terms for FY2024 and FY2023"
    whyItMatters: "Without exact dollar revenue, it is impossible to compute revenue multiples, gross margin in dollars, or verify whether the >35% growth rate is consistent across all periods."
    diligencePath: "Request audited GAAP financial statements (income statement, balance sheet, cash flow statement) for FY2022, FY2023, and FY2024 in a financial data room."
    relatedQuestionRefs:
    - QI001
    - QI020
    relatedTableRefs:
    - TI005

  - type: private-evidence-only
    severity: blocking
    topic: net-income-and-operating-loss
    missingEvidence: "GAAP operating income/loss, stock-based compensation expense, and free cash flow for FY2024"
    whyItMatters: "The EBITDA profitability claim excludes non-cash items. Without knowing SBC and D&A adjustments, the cash EBITDA claim may represent a substantially different operating result than GAAP net income."
    diligencePath: "Request GAAP income statement and reconciliation from EBITDA to GAAP operating income and net income, including a breakdown of stock-based compensation."
    relatedQuestionRefs:
    - QI005
    relatedTableRefs:
    - TI005

  - type: private-evidence-only
    severity: blocking
    topic: balance-sheet-and-runway
    missingEvidence: "Cash and cash equivalents, total debt, and estimated cash runway as of Q1 2026 (post $700M KKR round)"
    whyItMatters: "At least $1.075B has been raised across major disclosed rounds but was deployed over a multi-year period; the December 2025 $700M round adds fresh capital whose deployment timeline and use-of-proceeds are not publicly disclosed. Without a current balance sheet, it is unknown what share is primary vs. secondary and whether any covenant obligations remain from the earlier HPS and AllianceBernstein instruments."
    diligencePath: "Request balance sheet and debt schedule in data room; confirm whether the HPS and AllianceBernstein rounds included debt instruments with covenants; request use-of-proceeds detail for the December 2025 KKR round."
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI005

  - type: private-evidence-only
    severity: material
    topic: exact-customer-count-and-cohort-data
    missingEvidence: "Exact customer count as of year-end 2024 or Q1 2025, plus cohort-level NRR and logo churn by vintage year"
    whyItMatters: "The disclosure of '>500 customers' provides a floor but not a meaningful estimate. Cohort NRR data would validate whether the 111% NRR is broad-based or concentrated in a few large accounts."
    diligencePath: "Request customer list, average contract value by cohort, and NRR bridge by vintage year in the data room."
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI005

