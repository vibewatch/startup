- id: capital-formation-and-funding-history
  title: Capital Formation and Financial Adequacy
  body: "Saviynt has raised capital across four major confirmed financing events. The initial $40 million Series A was led by Carrick Capital Partners in 2018 (with a $10 million extension in October 2019). A $130 million growth financing round followed in September 2021, led by HPS Investment Partners with PNC Bank participating; this round brought total disclosed capital to $170 million and was widely covered by financial and technology press at a reported implied valuation of approximately $1.375 billion. The third confirmed round was a $205 million financing led by AB Private Credit Investors' Tech Capital Solutions group, an affiliate of global investment management firm AllianceBernstein, announced in January 2023, which brought total raised to $375 million; Sachin Nayyar's return as CEO was announced simultaneously with the January 2023 financing.\n\nThe fourth and most recent confirmed round was announced December 9, 2025: a $700 million Series B Growth Equity financing at approximately $3 billion valuation, led by KKR through its Next Generation Technology Growth Fund, with co-investors Sixth Street Growth and TenEleven Ventures, and continued participation from existing investor Carrick Capital Partners. This round brings cumulative capital across the four major confirmed financing events to at least $1.075 billion (using the $40M Series A figure; or at least $1.085B using the $50M Series A+A1 total). The primary-versus-secondary mix and investor preference structure of the December 2025 round have not been publicly disclosed.\n\nA separately reported $205 million round purportedly led by Goldman Sachs Asset Management (BusinessWire and PRNewswire, October 2024) could not be verified — all retrieval attempts returned 404 errors, and no corroborating Saviynt press release was located; that purported round is treated as unconfirmed and excluded from cumulative totals.\n\nThe investor composition across confirmed rounds — Carrick (growth equity), HPS (institutional credit/equity), AllianceBernstein (private credit), and KKR (growth equity) — reflects a capital structure without traditional venture capital. The December 2025 KKR-led round at approximately $3 billion valuation is the most significant external mark Saviynt has received and is the working valuation anchor for current diligence. The exact balance sheet position (cash on hand, any debt covenants from the earlier HPS/AB rounds, and remaining burn) remains non-public.\n"
