- calloutType: strength
  title: High NRR and Gross Margin Indicate SaaS Quality at Scale
  body: "NRR of 111% with GRR >95% and subscription gross margin ~80% are metrics consistent with top-quartile enterprise SaaS companies. If verified through audited financials, these would support a premium revenue multiple and demonstrate that Saviynt's growth is driven by genuine product value rather than aggressive discounting or short-term retention tactics."
  claimRefs:
  - CI003
  - CI004
  - CI005

- calloutType: risk
  title: All Financial Metrics Are Company-Disclosed and Unaudited
  body: "Every financial figure in this chapter — ARR, NRR, GRR, gross margin, and EBITDA profitability — is reported by Saviynt without independent audit or regulatory verification. As a private company, Saviynt has no obligation to publish GAAP financials. The risk is not that the figures are incorrect, but that they cannot be verified without data-room access, creating a meaningful gap between marketing claims and investable financial fact."
  claimRefs:
  - CI001
  - CI003
  - CI007

- calloutType: risk
  title: December 2025 KKR Round Confirmed; Primary-vs-Secondary Mix and October 2024 Goldman Sachs Round Remain Unresolved
  body: "The December 2025 $700M Series B Growth Equity round at approximately $3B valuation, led by KKR with Sixth Street Growth, TenEleven, and Carrick Capital, is confirmed via Saviynt's official press release and the Carrick Capital Partners announcement (Dec 9, 2025). The prior January 2023 $205M round led by AllianceBernstein's AB Private Credit Investors brought total capital to $375M at that time. Cumulative capital across major disclosed rounds is now at least $1.075B. Two items remain unresolved: (1) the primary-versus-secondary split and investor preference structure of the 2025 round, which determines whether the $3B is an economically real mark for new-money investors; and (2) a purported separate $205M round led by Goldman Sachs Asset Management (BusinessWire/PRNewswire, October 2024) could not be verified — all source URLs returned 404 errors. Investors should request the complete cap table, preference waterfall, and use-of-proceeds for the 2025 round in due diligence."
  claimRefs:
  - CI020
  - CI021
  - CI022

- calloutType: recommendation
  title: Require Audited Financials and Cohort Data Before Investment Decision
  body: "A financial data room with (1) two years of GAAP-audited financial statements, (2) cohort-level NRR by customer vintage year, (3) free cash flow bridge from EBITDA to cash, (4) complete cap table and debt schedule, and (5) ARR bridge from Q4 2024 to current should be conditions precedent to any formal investment or partnership commitment. The quality signals are strong, but the private disclosure ceiling prevents independent verification of any headline metric."
  claimRefs:
  - CI001
  - CI003
  - CI005
  - CI007

- calloutType: insight
  title: IPO Preparation Signals Are Accelerating
  body: "The hiring of a CMO from pre-IPO technology companies (Similarweb, Appian), a new Chief Commercial Officer, and a Chief Customer Officer in 2026 — combined with AWS and Deloitte strategic partnerships — is consistent with an organization preparing for a public market listing within a 12-36 month window. An IPO would provide audited financials, analyst coverage, and secondary liquidity, resolving the majority of current financial diligence gaps."
  claimRefs:
  - CI042
  - CI043

