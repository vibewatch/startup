figures:
- id: FU001
  title: Saviynt Customer Journey Map
  type: journey-map
  layout: wide
  summary: |
    Illustrates how enterprise buyers move from legacy IGA pain points through Saviynt evaluation, onboarding, and multi-module expansion, anchored to documented customer evidence where available.
  data:
    nodes:
    - id: pain
      label: Legacy IGA Pain
      description: |
        Manual provisioning, frequent outages, high maintenance cost, compliance audit burden (months of prep). Triggered by M&A, cloud migration, or regulatory change.
      stage: trigger
    - id: evaluation
      label: Vendor Evaluation
      description: |
        Proof-of-value or proof-of-concept against 1–2 shortlisted vendors. VF Corp tested 150+ use cases; Auto Club Group conducted Gartner Magic Quadrant-guided comparison with two leaders.
      stage: evaluation
    - id: onboarding
      label: Initial IGA Deployment
      description: |
        SI-assisted or in-house deployment of Saviynt IGA. First integrations with HR systems (Workday) and AD provisioning. Migration of applications incrementally to avoid disruption.
      stage: onboarding
    - id: production
      label: Production Steady State
      description: |
        Full lifecycle management, access certification, SoD enforcement live. Legacy platform decommissioned (VF Corp, Auto Club Group). Compliance auditors given direct platform access.
      stage: production
    - id: expansion-pam
      label: PAM Expansion
      description: |
        Cloud PAM layered on top of IGA for privileged access governance across cloud workloads. Often triggered by security incident or cloud migration milestone.
      stage: expansion
    - id: expansion-ispm
      label: ISPM / EIM Expansion
      description: |
        ISPM for identity posture across hybrid environments; EIM for contractor and third-party identities. Drives additional seat growth within existing account.
      stage: expansion
    - id: expansion-ai
      label: AI Identity Governance
      description: |
        Agent Access Gateway and ISPM for AI Agents governing AI workloads. Early-adopter design partners as of March 2026 (Hertz, Auto Club Group, UKG).
      stage: expansion
  claimRefs:
  - CU013
  - CU014
  - CU017
  - CU018
  - CU019
  - CU033
  - CU034
