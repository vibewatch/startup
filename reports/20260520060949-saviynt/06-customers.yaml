  evidenceGaps:
  - id: EGU001
    topic: Logo concentration and top-customer revenue share
    description: |
      No public disclosure of top-10 or top-25 customer revenue concentration, average contract value, or ARR breakout by customer cohort exists. This is a material gap for assessing churn risk and financial durability.
    severity: high
    relatedQuestionRefs:
    - QU006
    - QU024
  - id: EGU002
    topic: Independent audit of 500-plus customer count and 100M+ identities
    description: |
      All customer count and identity-count metrics are company-disclosed and unaudited. No third-party verification from auditors, bankers, or regulatory filings supports the 500-plus figure. The 100 million-plus identities metric includes methodological ambiguity (human, NHI, third-party definitions vary by vendor).
    severity: high
    relatedQuestionRefs:
    - QU001
  - id: EGU003
    topic: Cohort-level GRR and churn by vintage
    description: |
      Saviynt has disclosed only aggregate annual GRR (FY2024: >95%). No per-cohort, per-vertical, or per-vintage retention data is available, preventing assessment of whether retention is improving or declining for newer customer cohorts.
    severity: high
    relatedQuestionRefs:
    - QU013
    - QU025
    relatedTableRefs:
    - TU004
  - id: EGU004
    topic: Named government and federal customers
    description: |
      The Federal vertical is listed on Saviynt's website, but no named federal agency customer appears in public case studies or press releases. FedRAMP authorisation status is not confirmed. This limits independent assessment of the federal opportunity.
    severity: medium
    relatedQuestionRefs:
    - QU014
    - QU022
  - id: EGU005
    topic: Multi-module adoption rate and cross-sell depth
    description: |
      The proportion of the 500-plus customer base that has deployed 2 or more Saviynt modules (e.g., IGA + Cloud PAM, or IGA + ISPM) is not publicly disclosed. This is necessary to validate the sustainability of the 111 percent NRR beyond simple new-module upsell to a narrow subset.
    severity: medium
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU005
  - id: EGU006
    topic: NPS or CSAT score
    description: |
      No Net Promoter Score or Customer Satisfaction score has been publicly published by Saviynt. The Gartner 4.8/5 and PeerSpot aggregates are the closest proxies but cover voluntary review populations and may not reflect the full customer base.
    severity: medium
    relatedQuestionRefs:
    - QU019
  - id: EGU007
    topic: ROI study methodology for 269% ROI claim
    description: |
      Saviynt's April 2026 blog headline claims 269% ROI for customers. The underlying study methodology, sample size, time horizon, and whether it was independently conducted are not publicly verifiable from the blog post URL. Cannot be used as a quantified claim without primary source evidence.
    severity: medium
    relatedQuestionRefs:
    - QU015
  - id: EGU008
    topic: Named customer proof for healthcare, government, and higher-education verticals
    description: |
      No named case studies or quantified outcomes for healthcare, higher-education, or federal/government customers appear in public sources. These are material verticals listed on Saviynt's website and represent potential growth opportunities, but evidence quality is currently category-level only.
    severity: medium
    relatedQuestionRefs:
    - QU014
    - QU008
    relatedTableRefs:
    - TU003
  - id: EGU009
    topic: Sector-level ARR and vertical revenue mix
    description: |
      No ARR breakout by industry vertical is available. The customer base composition by revenue (as opposed to logo count) is unknown, preventing independent assessment of sector concentration and cyclicality risk.
    severity: medium
    relatedQuestionRefs:
    - QU008
  - id: EGU010
    topic: Peer NRR comparison coverage
    description: Saviynt discloses its own NRR trend, but comparable public NRR disclosures for direct IGA peers such as SailPoint and Omada were not assembled in this chapter, so the peer-relative position remains only partially supported.
    severity: medium
    relatedQuestionRefs:
    - QU007
  - id: EGU011
    topic: Direct versus partner-led acquisition mix
    description: Partner alliances clearly matter in Saviynt enterprise delivery, but public sources do not quantify what share of new logos is sourced directly versus through SI or channel relationships.
    severity: medium
    relatedQuestionRefs:
    - QU009
    relatedTableRefs:
    - TU005
  - id: EGU012
    topic: Documented churn and competitive displacement examples
    description: Public review sources surface support and deployment friction, but no verified public case study or press report documents a named customer fully churning off Saviynt or switching to another IGA vendor.
