company:
  name: Saviynt
chapter:
  number: 6
  title: Customers
  summary: |
    Saviynt discloses 500-plus enterprise customers protecting 100-million-plus identities as of 2024 — both figures company-claimed and unaudited. Gartner Peer Insights reflects a 4.8/5 average from 249 reviews with five consecutive Customers' Choice recognitions, providing the strongest independent third-party signal of satisfaction at scale. Named production deployments (Auto Club Group, VF Corporation) demonstrate measurable ROI in regulated-enterprise and retail contexts. NRR of 111 percent in FY2024 confirms net expansion within the existing base. Critical gaps remain: no public logo-concentration data, no independently audited customer count, limited cohort-level churn visibility, and adverse signals from PeerSpot on support responsiveness and stability at high identity volumes.
sections:
- id: customer-base-segmentation
  title: Customer Base and Segmentation
  body: |
    Saviynt targets large enterprises with complex identity and compliance needs, positioning across eight verticals listed publicly on its website: Energy, Federal/Government, Healthcare, Higher Education, Financial Services, Manufacturing, Retail, and Insurance. The company's partner ecosystem — led by Deloitte, KPMG, and Accenture — concentrates implementation capacity among large-enterprise clients, which shapes the buyer profile toward Fortune 500 and Global 2000 accounts. Named public logos span conglomerates (Koch Industries), energy majors (BP, Phillips 66), consumer brands (Kraft Heinz, VF Corporation), financial services (MassMutual), automotive/insurance (Auto Club Group, Hertz), and HR-tech SaaS (UKG). Geographically, the U.S. is the primary market; Saviynt has offices in London and Sydney and disclosed APAC and EMEA expansion in 2024. Pricing follows a per-identity model with platinum, gold, and silver tiers — no list pricing is public, but user reviews consistently describe pricing as competitive with SailPoint and Microsoft Entra ID Governance while expensive relative to smaller IGA vendors. The cloud-native, multi-tenant SaaS delivery model attracts buyers migrating off on-premises legacy platforms (Oracle OIM, IBM ISIM, SailPoint IdentityIQ), which Deloitte and KPMG both operate migration accelerators to facilitate. Government sector use is indicated by the Federal vertical listing but no named federal agency customers appear in public case studies as of the run date.
