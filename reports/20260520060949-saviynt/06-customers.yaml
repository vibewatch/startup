callouts:
- calloutType: strength
  title: Five Consecutive Gartner Customers' Choice Awards
  body: |
    Saviynt's 4.8/5 Gartner Peer Insights score from 249 verified reviews — the most in the IGA category — and five consecutive Customers' Choice recognitions provide the strongest independent third-party endorsement of broad customer satisfaction available in this market. This signal is difficult to manufacture and tracks a real buyer-sentiment trend.
  claimRefs:
  - CU029
  - CU030
- calloutType: risk
  title: Customer Concentration and Retention Data Gaps
  body: |
    All customer count, NRR, and GRR figures are company-disclosed and unaudited. No top-customer revenue concentration data is public. PeerSpot's adverse reviews flag support responsiveness and stability at scale as recurring issues that could impair retention in the most complex deployments. These combined gaps mean churn risk and concentration risk cannot be independently assessed without direct diligence access.
  claimRefs:
  - CU036
  - CU037
  - CU038
  - CU031
- calloutType: insight
  title: Regulatory Stickiness as Retention Moat
  body: |
    The majority of Saviynt's named customers operate in SOX-, HIPAA-, and PCI-DSS-driven environments where IGA platform switching costs are extremely high — compliance evidence chains, custom connectors, and audit-trail continuity create multi-year lock-in even before formal contract renewal. This structural stickiness, confirmed by Saviynt's own GRR disclosure and by PeerSpot reviewers who note they stay despite improvement areas, likely inflates reported GRR above what would be expected in less-regulated markets.
  claimRefs:
  - CU005
  - CU028
  - CU035
