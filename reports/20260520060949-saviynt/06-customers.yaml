- id: retention-durability
  title: Retention and Durability
  body: |
    Saviynt's Net Revenue Retention improved from 97 percent in FY2021 to 104 percent in FY2023 and 111 percent in FY2024, demonstrating consistent upsell and cross-sell momentum within the existing base. Gross Revenue Retention exceeded 95 percent in FY2024, or approximately 98 percent when excluding standard downsell categories — implying low logo churn under normal market conditions but some customers are reducing contracted identity volumes. No cohort-level GRR by signing year or vertical is publicly available. The Gartner Peer Insights score of 4.8 out of 5 from 249 reviews — the highest verified-review count in the IGA vendor category — provides a broad-based satisfaction signal, though Gartner Peer Insights ratings skew toward customers willing to submit reviews and may overrepresent satisfied users. PeerSpot's aggregated qualitative synthesis rates Saviynt stability at 6 to 8 out of 10, flags customer support responsiveness as a recurring improvement area, and notes that some onboarding projects have been delayed due to Saviynt-side response issues. TrustRadius Enterprise IAM reviewers highlight consolidation value and scalability for global enterprise deployments but note drag-and-drop configuration gaps versus legacy platforms. The combination of 111 percent NRR and above-95 percent GRR is consistent with a net-expanding customer base, but the gap between NRR and GRR also reveals that a portion of the base is contracting spend, partially offset by net new customers. Independent verification of any retention metric is unavailable; all figures are company-disclosed.
  claimRefs:
