- id: adoption-trajectory
  title: Adoption Trajectory and Growth Signals
  body: |
    Saviynt passed 500 enterprise customers in 2024 — a milestone the company disclosed alongside surpassing 1,000 employees. Earlier disclosed benchmarks show 50 percent year-over-year new-customer growth in FY2020 and consistently record quarters in 2024. The 249 Gartner Peer Insights reviews logged by January 2026 represent the highest verified-review count among all IGA vendors on that platform, and the 343,110 LinkedIn followers signal growing enterprise mindshare relative to peers. VF Corporation onboarded 35,000 human and 17,000 non-human identities within the platform and migrated 230 applications in 18 months — an application-level indicator of deployment depth. Auto Club Group, the second-largest AAA club in North America with 13 million members, achieved full decommissioning of its legacy identity platform within 12 months and now processes all critical provisioning through Saviynt. The identity-protection figure of 100 million-plus covers the full deployed customer base and is company-disclosed without independent audit; the denominator (total enterprise employees at all customers) is unknown, making the metric difficult to benchmark independently. Q3 2024 was described as a record quarter for bookings, with greater than 45 percent year-over-year bookings growth disclosed in the FY2024 annual results. No ARR breakout by customer cohort, geography, or vertical has been published.
