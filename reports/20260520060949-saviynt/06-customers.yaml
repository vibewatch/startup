- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Factor
  - Description
  - Risk / Opportunity Level
  - Impact
  - Diligence Path
  rows:
  - - Land-and-expand architecture
    - IGA as initial module; Cloud PAM, ISPM, EIM, AI governance as add-ons
    - High opportunity
    - Structural driver of 111% NRR; each module extends platform per-customer
    - Verify expansion rates across module pairs; % of customers on 2+ modules
  - - SI channel dependency
    - Deloitte, KPMG, Accenture drive most large-enterprise implementations
    - Moderate risk
    - SI delivery constraints or competitive shifts can delay customer deployments
    - Request SI revenue share; confirm backup implementation routes for top accounts
  - - Logo concentration (unknown)
    - Top-10 customers' ARR share not disclosed
    - Moderate risk
    - If top 10 are disproportionate, customer churn risk is concentrated
    - Request top-10 customer revenue concentration in diligence
  - - Sector concentration
    - FS, insurance, healthcare collectively represent majority of named logos
    - Moderate risk
    - Regulatory cyclicality or downturn in these sectors compresses renewal appetite
    - Request ARR breakout by vertical
  - - Regulatory compliance stickiness
    - SOX, HIPAA, PCI-DSS drive mandatory IGA renewal; switching cost is high
    - High opportunity (defensive moat)
    - Reduces logo churn in regulated verticals; compliance-linked contracts
    - Verify average contract length; request renewal rate by compliance-driven vs optional buyers
  - - AI platform expansion vector
    - March 2026 launch of Identity Security for AI creates new expansion upsell
    - High opportunity (emerging)
    - Design partners Hertz, Auto Club Group, UKG may be early case studies
    - Monitor production adoption rates in H1 2026 follow-up
  - - Contract length / switching cost
    - SaaS contracts; typical multi-year but length not disclosed
    - Moderate opportunity
    - Longer contracts reduce churn; high implementation sunk cost deters switching
    - Request average contract duration and renewal lag in diligence
  notes: |
    Risk/opportunity levels are qualitative assessments based on available public data. Logo concentration, contract length, and segment-level ARR are not publicly available and require direct diligence engagement. The SI channel dependency assessment is based on partner page disclosures and is directional only.
