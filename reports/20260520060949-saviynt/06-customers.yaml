- id: named-customer-proof
  title: Named Customer Proof
  body: |
    Two detailed production case studies appear on Saviynt's public website as of the run date: Auto Club Group and VF Corporation. Both are self-published by Saviynt and include named executives and quantified outcomes, elevating them above generic testimonials while remaining company-controlled narratives. A third deployment (Advanced Drainage Systems) is referenced on Saviynt's KPMG partner page without detailed metrics. The broader named list — BP, MassMutual, Kraft Heinz, Koch Industries, Phillips 66, Hertz, and UKG — appears on Saviynt's main website and in press releases but without published case-study detail. Hertz, Auto Club Group, and UKG were designated design partners for the March 2026 Identity Security for AI platform launch, indicating at minimum an active early-adopter relationship at the time. Independent third-party confirmation of production status, contract scope, or deployment health for most named logos is unavailable in public sources as of the run date. PeerSpot reviewers report a sample of mostly anonymous enterprise deployments ranging from thousands to tens of thousands of identities. Performance challenges emerge in PeerSpot reviews at high identity volumes (above tens of thousands of accounts), which is relevant context for interpreting the 100 million-plus aggregate identities claim — that figure aggregates across the full customer base rather than reflecting any single large deployment.
