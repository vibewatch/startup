  evidenceGaps:
  - type: missing-source
    severity: material
    topic: saviynt som / market share
    missingEvidence: Saviynt does not publicly disclose segment revenue, module mix, or market share that would support a defensible public SOM.
    whyItMatters: Without share data, top-down market size cannot be translated into revenue capture, penetration, or competitive position with precision.
    diligencePath: Request management-level revenue mix, competitive win-rate, and module attach data by segment during diligence.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: material
    topic: market overlap between IGA IAM and PAM
    missingEvidence: Independent public sources do not reconcile overlapping boundaries across IGA, IAM, PAM, and non-human identity categories.
    whyItMatters: Adding the largest published numbers together would overstate TAM and distort valuation assumptions.
    diligencePath: Rebuild TAM from the bottom up using Saviynt product scope, actual module attach, and management-provided revenue mix rather than additive analyst totals.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: exact budget ownership by persona
    missingEvidence: Public materials identify the buying committee but do not reveal which persona consistently owns final budget authority in live Saviynt deals.
    whyItMatters: Go-to-market efficiency, sales-cycle risk, and pricing power all depend on whether the durable payer is the CISO, CIO, audit sponsor, or a shared committee.
    diligencePath: Use customer and prospect reference calls to map who signs, who pays, and what narrative unlocks budget in multi-module identity deals.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: vertical and public-sector spend precision
    missingEvidence: Retained public sources show that regulated verticals matter, but they do not isolate 2026 spend pools that map tightly to Saviynt's exact wedge.
    whyItMatters: Underwriting sector-specific execution requires more than a general statement that regulated enterprises buy IGA and PAM.
    diligencePath: Request pipeline, ARR, and logo concentration by vertical, geography, and public-sector cohort, then compare to win-rate data and reference accounts.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
    - TM003
