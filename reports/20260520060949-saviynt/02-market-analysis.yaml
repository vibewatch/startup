- id: market-sizing-and-range-preservation
  title: Market Sizing With Multiple Lenses
  body: |-
    Public market data supports a large category, but not a single clean Saviynt TAM. Mordor Intelligence sizes the 2026 identity governance and administration market at $9.57 billion, while Fortune Business Insights places the same 2026 category at $10.7 billion. That spread is directionally consistent but still wide enough that diligence should preserve the range rather than collapse it into a false consensus. The broader IAM category is much larger: The Business Research Company puts IAM at $25.23 billion in 2026, and MarketsandMarkets projects the category from $25.96 billion in 2025 to $42.61 billion by 2030. Those broader IAM numbers cannot be treated as Saviynt's TAM because they include adjacent access-management and customer-identity spend that sits outside Saviynt's core IGA wedge.

    Privileged access management is the most relevant adjacency. Fortune Business Insights projects the PAM market at $5.58 billion in 2026, while The Business Research Company frames the segment from a $4.87 billion 2025 base to $17.26 billion in 2030 and Technavio reports exceptionally fast growth between 2024 and 2029. A conservative serviceable wedge therefore starts with core IGA, then adds only the subset of PAM and non-human-identity demand that overlaps with Saviynt's existing product scope. Using Mordor's 70.63% large-enterprise share as a constraint produces a public-evidence SAM of roughly $6.76-$7.56 billion before any share assumptions, while a precise public SOM remains unavailable because Saviynt does not disclose module revenue, segment mix, or market share.
