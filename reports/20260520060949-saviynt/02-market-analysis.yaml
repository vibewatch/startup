- id: synthesis-and-diligence-gaps
  title: Synthesis and Remaining Diligence Gaps
  body: |-
    The market evidence supports a favorable top-down view for Saviynt, but only with disciplined exclusions. The cleanest headline is that Saviynt participates in a roughly $9.6-$10.7 billion 2026 IGA core, with additional opportunity in PAM and non-human identity security that clearly expands the category but also increases overlap and double-count risk. Large enterprises, cloud-first programs, and regulated verticals appear to be the most relevant spend pools. The strongest near-term growth narrative is not generic "more cybersecurity" demand; it is the convergence of compliance-led IGA, least-privilege PAM, and machine/agent identity governance.

    The unresolved questions are mostly about precision, not direction. Public sources do not isolate Saviynt's share or disclose enough segment revenue to build a public SOM. They also do not cleanly separate how much of broader IAM or PAM spend is truly addressable by Saviynt versus already locked into access-management, CIAM, or incumbent bundle budgets. Budget ownership also remains partly private evidence: public materials show the buying committee, but not the exact spend owner in live deals. Those gaps matter for underwriting, yet they do not negate the broader conclusion that Saviynt is operating inside a real, growing identity-governance market whose most attractive wedge is enterprise, regulated, and increasingly non-human identity-centric.
