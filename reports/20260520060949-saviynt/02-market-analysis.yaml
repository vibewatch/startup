  title: Market definition table
  columns:
  - Segment/Category
  - Included Spend
  - Excluded Spend
  - Buyer/Payer
  - Relevance
  rows:
  - - Identity governance and administration (IGA)
    - Lifecycle provisioning, deprovisioning, access certification, entitlement management, SoD controls, audit and compliance workflows
    - Pure login/authentication spend, stand-alone SSO without governance, consumer identity
    - IAM/security leaders; CISO/CIO shared budgets
    - Core Saviynt market and most defensible boundary
  - - Privileged and non-human identity governance
    - Privileged account governance, service-account control, bot/non-human identity governance, least-privilege workflows
    - Legacy vault-only tools with no lifecycle governance or enterprise identity context
    - Security engineering, PAM owners, CISO budget
    - High-value adjacency because Saviynt competes into PAM and machine-identity control
  - - Broader IAM platform spend
    - Access management, workforce identity platforms, directory and authentication controls that support IGA programs
    - CIAM-only, B2C identity, developer auth infrastructure without governance
    - Identity platform owners; CIO/CISO
    - Relevant context but too broad to count fully as Saviynt TAM
  - - Compliance-led identity operations
    - Audit response, certification evidence, segregation-of-duties review, policy attestation
    - General GRC software with no identity workflow execution
    - Audit, compliance, IAM program office
    - Important budget trigger for regulated verticals and large enterprises
  - - Status-quo substitutes
    - Manual access reviews, spreadsheets, ticket-driven provisioning, point PAM or broader IAM suites already installed
    - N/A
    - Existing IT, security, and audit owners
    - Defines the replacement path Saviynt must displace rather than a greenfield market
  - - Excluded adjacent categories
    - Consumer IAM, standalone access management, authentication-only tools, unrelated security controls
    - N/A
    - Different application, digital, or customer-experience budget lines
    - Avoids overstating TAM by counting markets Saviynt does not directly serve today
  notes: Included spend is limited to identity-governance, privileged, and non-human identity workflows that overlap with Saviynt's product scope; broader IAM and CIAM are context, not full TAM.
