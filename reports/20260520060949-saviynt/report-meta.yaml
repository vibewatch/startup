companyProfile:
  summary: Saviynt is a private identity-security company founded in 2010 in El Segundo, California. Its Enterprise Identity Cloud combines IGA, PAM, ISPM, Application Access Governance, External Identity Management, and AI-agent governance in a cloud-native SaaS platform. The company disclosed FY2024 ARR growth above 35%, 111% NRR, and positive EBITDA, then announced a $700M KKR-led round at an approximately $3B valuation in December 2025.
