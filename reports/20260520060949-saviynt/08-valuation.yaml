  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: Public sources do not disclose the primary-versus-secondary split, use of proceeds, preference stack, or investor rights for the December 2025 round.
      whyItMatters: A secondary-heavy round or preference overhang would materially change the effective entry price for new money at the $3B mark.
      diligencePath: Request financing documents, cap table, investor-rights summary, and board materials covering the December 2025 round directly from management.
      relatedQuestionRefs:
        - QV005
        - QV025
    - type: missing-source
      severity: material
      topic: current-arr
      missingEvidence: Saviynt has not publicly disclosed a current ARR figure since the FY2024 contracted ARR of >$185M referenced in prior chapters.
      whyItMatters: The implied multiple at the $3B mark depends entirely on the ARR denominator; without it, the chapter must rely on estimated ranges.
      diligencePath: Request a quarterly ARR bridge and current contracted ARR figure under NDA.
      relatedQuestionRefs:
        - QV004
        - QV022
        - QV032
      relatedTableRefs:
        - TV004
    - type: conflicting-data
      severity: minor
      topic: goldman-2024
      missingEvidence: A purported 2024 Goldman Sachs-led Saviynt financing surfaced in informal conversation but no public source corroborates such a round.
      whyItMatters: An unverified prior mark in the funding history would change the trajectory between the 2023 AB Private Credit financing and the December 2025 KKR round.
      diligencePath: Ask management to confirm or deny any 2024 financing with Goldman Sachs and provide supporting documentation if applicable.
      relatedQuestionRefs:
        - QV003
    - type: enumeration-incomplete
      severity: material
      topic: comparable-set
      missingEvidence: The comparable valuation table does not include adjacent IAM or PAM vendors (BeyondTrust, Delinea, Omada, One Identity, Securonix) because revenue and valuation disclosures for those firms are inconsistent or gated.
      whyItMatters: A broader comp set could either tighten or widen the implied multiple range and would reduce reliance on the SailPoint/Ping/ForgeRock cluster.
      diligencePath: Source updated private-market data from PitchBook or CB Insights and request peer benchmarks from investment-banking coverage.
      relatedQuestionRefs:
        - QV008
        - QV013
      relatedTableRefs:
        - TV004
    - type: missing-source
      severity: material
      topic: exit-path
      missingEvidence: Public sources do not provide an explicit IPO timeline, strategic-exit plan, or minimum acceptable exit valuation for Saviynt.
      whyItMatters: Hold-period economics at the $3B mark depend on exit type and timing more than on near-term operating execution.
      diligencePath: Request board-level exit-path memo, banker fairness analyses, and management's hold-horizon assumptions.
      relatedQuestionRefs:
        - QV028
        - QV031
