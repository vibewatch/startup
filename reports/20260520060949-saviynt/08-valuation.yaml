  - id: comparable-valuation-set
    title: 'Comparable set: SailPoint and Okta look cheap, CyberArk and ForgeRock look like the right anchors'
    body: >-
      The most useful comparable framework for Saviynt is a mix of identity-security public comparables and recent
      identity M&A. On public comparables, stockanalysis.com data as of May 19-20, 2026 puts SailPoint at an $8.21
      billion market cap on $1.07 billion of trailing revenue, Okta at $15.16 billion on $2.92 billion, CyberArk at
      $20.64 billion on $1.36 billion of trailing revenue (with Palo Alto Networks having completed its acquisition in
      February 2026), and Palo Alto Networks itself at $194.75 billion on $9.89 billion. That spread implies roughly
      7.7x for SailPoint, 5.2x for Okta, 15.2x for CyberArk on a standalone basis, and 19.7x for Palo Alto Networks. On
      a deal basis, Palo Alto Networks completed its CyberArk acquisition for $25 billion, implying roughly 18.4x
      trailing revenue and confirming that strategic identity-security premiums can stretch well past public-market
      norms.


      Recent take-private transactions sit between the public and strategic anchors. Thoma Bravo took Ping Identity
      private for approximately $2.8 billion in October 2022 on roughly $299 million of 2021 revenue (about 9.4x) and
      acquired ForgeRock for about $2.3 billion in August 2023 on roughly $218 million of 2022 revenue (about 10.5x).
      Those two transactions are arguably the cleanest size-matched, identity-governance comparables to Saviynt and
      together point to a 9x-11x trailing revenue zone for sponsor-led identity governance buyouts. Sitting Saviynt's
      $3 billion mark against a defensible $250 million-$300 million current ARR yields an implied 10x-12x range that
      lines up directly with the Ping/ForgeRock zone, sits below the CyberArk strategic deal, and runs slightly above
      the SailPoint public mark.
