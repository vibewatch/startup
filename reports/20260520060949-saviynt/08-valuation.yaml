  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - 2025 financing structure
        - Primary-versus-secondary split, use of proceeds, preference stack, ratchets, MFN clauses, and board rights.
        - Determines whether the $3B mark is economically real for new money entering today.
        - Counsel data room; KKR/Carrick/Sixth Street financing documents.
      - - Current ARR and growth bridge
        - Bridge from FY2024 contracted ARR (>$185M reported) to a current 2026 ARR figure with growth and churn components.
        - Implied multiple at $3B depends entirely on the ARR denominator.
        - CFO diligence pack; quarterly ARR exports.
      - - Customer concentration and retention
        - Top-10 customer ARR share, logo churn, NRR by cohort, gross retention proof beyond the 96% management figure.
        - Concentrated revenue can re-rate the company quickly if a top customer leaves or down-sells.
        - Customer cohort exports and named customer references.
      - - IPO and exit path
        - Board-level view of IPO readiness, strategic-buyer outreach, and minimum acceptable valuation in either path.
        - Hold-period and IRR are the binding economic constraints at the $3B mark.
        - Board materials, banker fairness work, and management exit plan.
      - - Goldman Sachs 2024 round inquiry
        - Direct confirmation or denial of any 2024 financing involving Goldman Sachs as lead, co-investor, or arranger.
        - Aligns the public-record financing history and removes a circulating but unverified narrative.
        - Management and outside-counsel financing schedule covering 2024 calendar year.
      - - Public disclosure upgrade
        - CFO-grade investor update at SailPoint-level disclosure depth, including segment revenue and unit economics.
        - The recommendation can move from research-more toward buy if the public economics support the implied multiple.
        - Investor relations roadmap and timeline to publishable financial discipline.
    notes: >-
      These asks are narrow, investment-critical, and tied to the triggers in TV005. Each could move the
      recommendation or the acceptable entry price.
