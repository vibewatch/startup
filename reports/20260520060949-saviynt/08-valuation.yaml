  - id: TV005
    title: Thesis-break and break triggers table
    columns:
      - trigger
      - evidence / threshold
      - transmission to thesis
      - action implication
    rows:
      - - Secondary-heavy structure confirmed
        - Primary use of proceeds <50% of the $700M, or significant founder/early-investor liquidity disclosed in the financing structure.
        - The effective entry price for new money is worse than the headline $3B implies.
        - Move from research-more to pass at $3B unless primary terms materially improve.
      - - ARR materially below carryforward estimate
        - Current ARR proves to be <$200M when disclosed, versus the $250M-$300M used here.
        - Implied multiple jumps above 15x and overlaps the CyberArk strategic deal without strategic synergies.
        - Re-test the recommendation against the bear scenario only; no new-money support at $3B.
      - - Bundle competition takes share
        - Microsoft Entra ID Governance, PANW-CyberArk, or SailPoint win rate against Saviynt visibly improves through 2026.
        - Growth compresses toward 20% and the multiple environment normalizes faster than the base case assumes.
        - Shift stance from stretched-but-defensible to expensive; require a price reset or new evidence to re-engage.
      - - Implementation and support deterioration
        - Independent review sources (Gartner, PeerSpot, TrustRadius) show sustained worsening of support and deployment scores.
        - NRR slips below 110%, gross retention erodes from 96%, and expansion revenue stalls.
        - Reset to pass; downside scenario in TV003 becomes the working base case.
      - - Governance or IPO delay
        - No credible IPO or strategic-exit signal by 2027-2028 and no improvement in public disclosure.
        - Hold-period assumptions extend, IRR drops materially, and price discipline tightens further.
        - Maintain track-only posture; do not re-engage without primary catalyst.
    notes: >-
      Each trigger is mapped to a specific assumption in TV003. They directly impair the scenario logic supporting
      the recommendation if tripped.
