  - id: bull-base-bear-scenarios
    title: 'Scenario logic: bull case rhymes with CyberArk, bear case rhymes with SailPoint'
    body: >-
      The bull case for Saviynt is that the company sustains 30%+ ARR growth, executes the AI-agent and non-human
      identity expansion described in its March 2026 press releases, and ultimately attracts a strategic acquirer that
      pays a CyberArk-style premium. Under that path, Saviynt could realistically grow ARR toward $500 million within
      two to three years and earn a 12x-15x trailing multiple in a strategic exit, supporting a $6-7 billion outcome
      that would roughly double the 2025 entry mark for primary investors. KKR's prior identity-security wins with Ping
      Identity, ForgeRock, and Semperis show that the lead investor has a credible playbook for that endgame.


      The base case is that Saviynt continues to grow but the public multiple environment normalizes. ARR scales to
      $350-$400 million over two years, the company sells or IPOs into a public-comp environment closer to SailPoint and
      Okta multiples (7x-10x), and the resulting equity value lands close to $3-4 billion. That is acceptable for
      patient strategic investors but offers limited upside for new money entering at the 2025 mark unless the
      primary-secondary mix is favorable.


      The bear case is straightforward: implementation complexity, support pressure, and bundle competition from
      Microsoft, SailPoint, and Palo Alto Networks compress growth toward 15%-20%, retention slips below current 96%
      gross levels, and a future financing or exit re-marks Saviynt closer to a 5x-7x SailPoint-like multiple on a more
      modest ARR base. That path implies $1.5-$2 billion of equity value, materially below the 2025 mark, and is the
      reason this chapter does not issue a buy recommendation despite respecting the round.
