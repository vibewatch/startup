  - id: TV004
    title: Comparable valuation table
    columns:
      - comparable
      - metric
      - multiple / valuation / status
      - relevance
      - limitation
    rows:
      - - SailPoint (NASDAQ:SAIL)
        - Market cap / TTM revenue
        - ~$8.21B / ~$1.07B = ~7.7x
        - Closest public identity-governance pure-play; post-IPO February 2025.
        - Larger revenue base and public disclosure; carries -$293.84M FY2026 losses that affect multiple framing.
      - - CyberArk (acquired by Palo Alto Networks)
        - Strategic deal value / TTM revenue
        - ~$25B / ~$1.36B = ~18.4x
        - Strategic identity-security premium paid by a security platform vendor; closed February 2026.
        - Strategic premium and PANW-specific synergies inflate the multiple versus standalone fair value.
      - - Okta (NASDAQ:OKTA)
        - Market cap / TTM revenue
        - ~$15.16B / ~$2.92B = ~5.2x
        - Broad workforce and customer-identity benchmark with profitable operating performance.
        - Different mix (CIAM and workforce SSO heavier than IGA); compressed multiple post-2023 incident overhang.
      - - Palo Alto Networks (NASDAQ:PANW)
        - Market cap / TTM revenue
        - ~$194.75B / ~$9.89B = ~19.7x
        - Frames what large-cap security platforms can earn; relevant as identity buyer benchmark.
        - Diversified network and cloud security vendor; identity is a small slice of the business.
      - - Ping Identity (Thoma Bravo take-private, Oct 2022)
        - Deal value / pre-deal revenue
        - ~$2.8B / ~$299M = ~9.4x
        - Closest size-matched sponsor take-private comp in the identity governance and access space.
        - 2022 mark; multiple environments and deal terms have shifted since.
      - - ForgeRock (Thoma Bravo, August 2023; merged with Ping)
        - Deal value / pre-deal revenue
        - ~$2.3B / ~$218M = ~10.5x
        - Most directly comparable identity-governance sponsor transaction by size and mix.
        - Sponsor merger synergies inflate willingness to pay; deal closed under different rate environment.
      - - Saviynt (KKR-led, December 2025)
        - Round value / implied ARR range
        - $700M raised at ~$3B / ~$250M-$300M est. ARR = ~10x-12x
        - Direct anchor for this chapter; reflects 2025 growth-equity round, not a public market clearing.
        - ARR estimate carried from prior chapters and not publicly disclosed; secondary mix unknown.
    notes: >-
      Comparable set mixes public, take-private, and strategic deals because no single public peer perfectly matches
      Saviynt's IGA-heavy mix and growth-equity stage. SailPoint, Ping, and ForgeRock are the closest mix-matched
      comps; CyberArk and PANW frame the upside ceiling.
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-useful identity-security public and transaction comparables with accessible
        May 2026 evidence. It does not list every adjacent IAM or PAM vendor (BeyondTrust, Delinea, Omada,
        One Identity, Securonix) because revenue and valuation disclosures for those firms are inconsistent or
        gated.
