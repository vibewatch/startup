  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - argument
      - direction
      - what would change the view
    rows:
      - - KKR-led $700M round at ~$3B is a strong external mark from a credible identity-security investor.
        - thesis
        - Evidence of a secondary-heavy structure or weak primary use of proceeds would weaken the mark's signal value.
      - - KKR's prior identity-security exits (Ping Identity, ForgeRock, Semperis) suggest a credible exit playbook.
        - thesis
        - A multi-year delay before any exit signal would erode the playbook's relevance to this hold period.
      - - Saviynt is already EBITDA-positive with >35% ARR growth and 111% net-revenue retention per prior chapters.
        - thesis
        - Sustained deceleration of ARR growth below ~25% or a slip in NRR toward the 100% line would undermine the base case.
      - - 96% gross revenue retention reported by management is unusually strong for enterprise IGA.
        - thesis
        - Any independent disconfirmation of GRR or evidence of customer concentration would weaken the durability case.
      - - Implied 10x-16x ARR multiple sits well above SailPoint and Okta public multiples.
        - anti-thesis
        - A move to filing-grade public ARR disclosure or accelerating growth would make the premium easier to defend.
      - - Public evidence does not disclose primary-versus-secondary split, preference stack, or IPO timeline.
        - anti-thesis
        - Publishing financing structure and a CFO-grade investor update would materially improve underwriteability.
      - - Bundled identity governance from Microsoft, post-deal PANW-CyberArk, and SailPoint can compress price.
        - anti-thesis
        - Sustained win-rate evidence against bundle competitors would meaningfully change this argument.
    notes: >-
      Arguments are intentionally price-sensitive. They describe what the $3B mark already assumes, not just what is
      true about the underlying company.
