callouts:
  - calloutType: recommendation
    title: 'Current call: research-more, not buy at ~$3B'
    body: Saviynt is investible in principle, but the public disclosure does not yet support price-insensitive underwriting at the December 2025 mark.
    claimRefs:
      - CV001
      - CV007
      - CV044
  - calloutType: strength
    title: The 2025 round is a genuine external validation
    body: A KKR-led $700M growth round with Sixth Street and TenEleven at ~$3B is a meaningful third-party signal even after accounting for likely secondary structure.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
  - calloutType: risk
    title: Downside can come from structure, not just execution
    body: A secondary-heavy round, weaker-than-expected current ARR, or accelerating bundle competition can each compress value before any exit can occur.
    claimRefs:
      - CV002
      - CV007
      - CV025
      - CV030
      - CV044
      - CV045
  - calloutType: assumption
    title: Base case assumes late-2025 ARR is ~$250M-$300M
    body: The implied 10x-12x multiple depends on ARR being at or above ~$250M; lower ARR moves the multiple into strategic-deal territory without strategic synergies.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
