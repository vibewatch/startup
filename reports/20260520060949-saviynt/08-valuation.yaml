  - id: thesis-break-triggers-and-diligence-asks
    title: 'Trigger and diligence asks: secondary mix, ARR proof, and bundle competition decide the call'
    body: >-
      The thesis breaks if any of three conditions becomes evident. First, if the December 2025 round turns out to be
      majority secondary with limited new growth capital, the effective entry price for new money is worse than the
      headline implies and the round looks more like a liquidity event for early investors than a growth financing.
      Second, if Saviynt's current ARR proves materially below the $250-$300 million range used in this chapter's
      sensitivity work, the implied multiple jumps and the $3 billion mark moves from defensible to clearly stretched.
      Third, if bundled identity governance from Microsoft Entra, the post-acquisition Palo Alto Networks-CyberArk
      combination, or SailPoint's IPO-funded roadmap takes meaningful share, growth could compress before any exit can
      occur.


      The diligence package needed to convert research-more into a definitive call is narrow. Investors need
      primary-versus-secondary mix and use-of-proceeds detail for the 2025 round, the preference stack and any ratchets
      or MFN terms, a clean ARR bridge by product line, the top-10 customer concentration schedule, an IPO timeline or
      exit plan from the new board, and current churn and net-revenue-retention by cohort. Saviynt could substantially
      improve underwriteability simply by publishing a CFO-grade investor update at the same disclosure level as
      SailPoint's public filings. Until that happens, the rational stance is to stay engaged, define the break triggers
      explicitly, and re-test the recommendation when more of the financing structure becomes visible.
