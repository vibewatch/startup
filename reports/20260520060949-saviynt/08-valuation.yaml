    title: Recommendation summary table
    columns:
      - decision field
      - current view
      - decision implication
    rows:
      - - Recommendation
        - research-more
        - Stay engaged, but do not underwrite new money at the $3B mark without secondary-mix and ARR detail.
      - - Confidence
        - medium
        - The $700M round is a real third-party mark, but implied multiple and structure are still partially opaque.
      - - Risk rating
        - high
        - Bundle competition, implementation execution risk, and secondary-heavy structure can compress value quickly.
      - - Valuation stance
        - stretched but defensible
        - Implied 10x-16x ARR sits above SailPoint/Okta and below the CyberArk strategic deal.
      - - Target return / hold posture
        - 3-5 year hold; ~2x upside in a strategic exit, modest upside in a normalized IPO
        - Returns depend more on exit type than on near-term operating execution.
      - - Price discipline
        - No price-insensitive buy at ~$3B without structural detail
        - Require either materially better terms, secondary clarity, or better public ARR disclosure.
    notes: >-
      The recommendation reflects the current entry mark, not a generic view that Saviynt is a weak company. Strong
      operating evidence cannot fully substitute for missing capital-structure detail.
