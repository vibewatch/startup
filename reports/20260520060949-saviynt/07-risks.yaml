  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: legal-regulatory-register
    missingEvidence: A public-facing schedule of litigation, enforcement inquiries, export-control matters, privacy complaints, and customer-specific contract exceptions was not available in reviewed sources.
    whyItMatters: The legal register can only cover public and self-disclosed obligations, so hidden disputes or regulator correspondence could materially change risk severity.
    diligencePath: Run court and regulator database searches, request a litigation / claims schedule, and review customer DPAs plus any regulator correspondence in the data room.
    relatedQuestionRefs:
    - QR006
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 or top-25 customer ARR share, logo churn counts, renewal cohorts, and customer-level concentration schedules are not public.
    whyItMatters: A concentrated base or rising churn could transmit quickly into slower ARR growth, weaker NRR, and reduced resilience in a competitive market.
    diligencePath: Request cohort ARR bridge, concentration schedule, top-customer contract metadata, and churn / contraction history.
    relatedQuestionRefs:
    - QR013
  - type: access-blocked
    severity: minor
    topic: community-feedback-access
    missingEvidence: Direct G2, Reddit, and Trustpilot complaint pages were not fully accessible in retained public evidence at the run date.
    whyItMatters: Open community channels can surface implementation pain or support issues that curated review platforms under-sample.
    diligencePath: Use authenticated review accounts, direct customer references, or manual browsing sessions to sample G2, Reddit, and Trustpilot sentiment.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Public sources do not disclose the primary-versus-secondary split, preference stack, investor rights, or other structured terms for the 2025 round.
    whyItMatters: Preference overhang or heavy secondary liquidity could change effective entry price and create stronger pressure for near-term growth or liquidity events.
    diligencePath: Request financing documents, cap table, investor-rights summary, and board materials covering the December 2025 round.
    relatedQuestionRefs:
    - QR021
    - QR022
  - type: missing-source
    severity: material
    topic: incident-transparency
    missingEvidence: No public uptime page, postmortem archive, or outside-visible incident-history package was identified; detailed trust artifacts appear gated.
    whyItMatters: Without operational-history evidence, diligence cannot calibrate resiliency, outage handling, or whether secure-by-design commitments translated into observable controls.
    diligencePath: Request SLA history, incident log, customer communication templates, recent postmortems, and secure-by-design progress evidence.
    relatedQuestionRefs:
    - QR006
