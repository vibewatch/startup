- id: governance-financing-and-kill-criteria
  title: Governance, Financing, and Kill Criteria
  body: 'Saviynt’s governance and financing profile creates both support and pressure. The company has added strategic bench strength through board appointments and leadership hires, and its public footprint suggests a globally distributed operating model with meaningful scale. That can be a strength, but it also introduces coordination risk as the platform and partner ecosystem expand. The bigger underwriting issue is the interaction between scale and opacity: a $700 million financing at roughly $3 billion valuation implies substantial performance expectations, yet public sources do not disclose the primary-versus-secondary mix, any investor preference stack, or an IPO timeline. Public sources also do not disclose customer concentration or churn in a way that would let an investor calibrate downside from a few large accounts. The practical implication is that diligence should focus on monitorable kill criteria: support deterioration, delayed deployments, partner underperformance, bundling-driven
    price compression, or evidence that the financing round created hidden pressure for liquidity or aggressive growth trade-offs.'
