- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Support and implementation risk
    - Independent review deterioration
    - Two or more credible independent 2026-2027 reviews cite support failure, delayed fixes, or failed deployments in large accounts.
    - Pause or re-underwrite customer-expansion assumptions; demand support KPI package.
  - - Release-management risk
    - Upgrade / hotfix friction becomes systematic
    - Customers report repeated forced re-testing, unclear release communication, or production-impacting regressions.
    - Treat execution quality as a thesis-break candidate unless management provides corrective process evidence.
  - - Partner dependency risk
    - SI ecosystem underperforms
    - Named SI partners stop co-selling, or reference implementations show repeated delivery slippage.
    - Discount sales-efficiency assumptions and request direct-vs-partner pipeline split.
  - - Bundling / competition risk
    - Price compression in strategic accounts
    - Microsoft or larger platform rivals begin winning on bundle economics in referenceable enterprise deals.
    - Lower medium-term margin and win-rate assumptions.
  - - Capital-structure opacity risk
    - Financing terms prove more aggressive than public narrative suggests
    - Secondary-heavy round, strong preference stack, or IPO timing pressure surfaces in diligence.
    - Reprice entry discipline and scrutinize growth-vs-governance trade-offs.
  - - Security / transparency risk
    - Public incident or missing secure-by-design proof
    - Material incident occurs, or Saviynt cannot evidence progress against security commitments and trust claims.
    - Escalate to full security diligence, incident forensics, and customer-reference refresh.
  notes: Kill criteria are intentionally monitorable and tied to observable events rather than generic “watch execution” language.
