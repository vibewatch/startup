- id: implementation-and-customer-feedback
  title: Implementation, Quality, and Customer Feedback Risk
  body: 'Customer-feedback evidence is directionally consistent on a core risk theme: Saviynt can deliver meaningful governance value, but the operational burden of getting there is non-trivial. Gartner pages show both favorable production experiences and sharp critiques that cite heavy development effort, poor support, and service-management instability. PeerSpot repeatedly highlights documentation gaps, UI and customization limitations, logging constraints, and performance concerns under load. TrustRadius adds that Saviynt can scale and consolidate multiple identity functions, but occasional users may find the interface unintuitive and advanced configuration still lacks simplicity. That pattern matters more in 2026 because Saviynt is broadening the platform into AI-agent, non-human-identity, and MCP-oriented features. Rapid product expansion can be strategically correct while still increasing risk that release cadence, customer onboarding, and partner-delivered implementations outpace
    the company’s support and quality-control capacity.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
