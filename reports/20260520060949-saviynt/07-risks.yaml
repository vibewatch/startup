company:
  name: Saviynt
chapter:
  number: 7
  title: Risks
  summary: 'Saviynt’s biggest underwriting risks are executional and compounding: independent reviews repeatedly point to implementation complexity, support responsiveness, release-management friction, and logging/documentation gaps even while some customers report strong value. Those issues sit on top of partner and AWS dependency, aggressive platform competition from SailPoint, Microsoft, and Palo Alto Networks, and residual opacity around customer concentration, incident transparency, and the capital-structure detail behind the 2025 $700 million round.'
sections:
- id: severity-ranked-risk-stack
  title: Severity-Ranked Risk Stack
  body: Saviynt’s top risks are executional and transmission-heavy rather than rooted in an obvious legal crisis. Independent review sources repeatedly flag implementation complexity, support responsiveness, documentation gaps, release-management friction, and mixed customer experience even while the product wins favorable reviews in some deployments. That operational profile matters because the company is simultaneously expanding product scope into AI-agent governance, relying on partners and AWS to accelerate delivery, and competing against platform vendors that bundle adjacent identity controls more aggressively than a standalone vendor can. The result is a risk stack where product-execution slippage can quickly transmit into longer deployments, slower expansion, pricing pressure, and valuation compression. The largest unresolved uncertainty is not whether Saviynt has market relevance, but whether it can keep execution quality high enough to justify a 2025 funding reset at roughly a $3
    billion valuation while remaining transparent enough for outside diligence to underwrite concentration, incident history, and capital-structure detail.
  claimRefs:
  - CR014
  - CR019
  - CR026
  - CR034
  - CR037
  - CR039
