      - number: '3.2'
        title: Direct IGA Competitors
        blocks:
          - type: paragraph
            body: >
              SailPoint is Saviynt's most direct enterprise IGA competitor. SailPoint re-IPO'd on NASDAQ under ticker
              SAIL and positions its Identity Security Cloud (ISC) as an AI-driven adaptive identity platform covering
              lifecycle management, access certification, data access security, CIEM, and non-employee risk management.
              In December 2025, SailPoint introduced Navigators, a flexible pricing model complementing its ISC
              Standard, Business, and Business Plus suites. Navigators offers three Flex tracks—Digital identity Flex
              (machine and agent identities), Premier Flex (broader platform capabilities), and Modernization Flex
              (IdentityIQ customers migrating to cloud)—enabling consumption-based access without per-seat locks.
              SailPoint's scale advantage is substantial: self-reported #1 by IGA revenue in 2024 and 53 percent Fortune
              500 penetration. TrustRadius buyer comparisons note SailPoint's strength in lifecycle management
              customization and compliance automation but flag limited access-review workflow configurability and a
              steep learning curve for occasional users. One Identity, a Quest Software subsidiary, unifies IGA, PAM,
              and Access Management with built-in AI predictive insights and "Enhanced Active Directory Governance"
              covering Entra ID. Omada Identity Cloud (Copenhagen-headquartered) targets organizations seeking
              cloud-native IGA with a guaranteed 90-day deployment commitment and AI-powered role management; it
              competes more strongly in EMEA mid-enterprise than in North American large enterprise. Ping Identity
              (owned by Thales Group) delivers cloud IGA with AI/ML-driven access requests, access reviews, and SoD
              enforcement, drawing on Thales' strong regulatory compliance credentials in government and financial
              services markets. Saviynt's advantages in this segment are its unified cloud-native architecture spanning
              IGA, PAM, and ISPM in a single platform—reducing vendor consolidation friction—and its AWS Strategic
              Collaboration Agreement that positions it preferentially in cloud-first and cloud-native deployments.
