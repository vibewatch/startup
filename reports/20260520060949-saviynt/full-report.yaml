      - number: '4.6'
        title: Financial Verdict and Diligence Priorities
        blocks:
          - type: paragraph
            body: >
              Saviynt's disclosed financials present a picture of a high-quality, scaling SaaS business: >35% ARR
              growth, 111% NRR, ~80% subscription gross margin, and positive EBITDA in FY2024. These metrics, taken at
              face value, would position Saviynt among the top decile of enterprise SaaS companies by quality of growth.
              The private company constraint — no audited financials, no GAAP income statement, no balance sheet
              disclosure — prevents independent verification of any of these figures. Every metric cited in this chapter
              is company-disclosed.


              Material diligence gaps include: (1) exact dollar revenue and ARR (only directional >35% growth disclosed;
              best estimate $200–220M year-end ARR based on >$185M at Q3); (2) net income or GAAP operating loss; (3)
              free cash flow; (4) balance sheet and cash runway; (5) exact customer count beyond '500+'; (6) CAC, LTV,
              and sales efficiency ratios; and (7) primary-versus-secondary mix and preference structure of the December
              2025 $700M round. The most recent valuation anchor is approximately $3 billion from the December 2025
              KKR-led financing — a meaningful step up from the ~$1.375B implied in the 2021 round, though the exact
              secondary-to-primary split means the economic value to new-money investors requires further diligence. A
              financial due-diligence data room providing audited financials, cap table waterfall, and cohort retention
              data would be required before any investment decision.


              The December 2025 $700M round — combined with EBITDA profitability in FY2024 — provides Saviynt with a
              substantial capital base and establishes the $3B mark as the current working valuation. The IPO hiring
              signals (pre-IPO CMO, new CCO and Chief Customer Officer in 2026) indicate management is preparing for a
              liquidity event within a 12-36 month window, which would provide audited public financials. The strategic
              risk is execution: maintaining >30% ARR growth while absorbing >1,600 employees, deploying $700M in fresh
              capital, and expanding into new AI agent governance product lines requires disciplined unit economics that
              are not yet independently verifiable.
