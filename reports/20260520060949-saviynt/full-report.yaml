      - number: '1.2'
        title: Founding history, leadership evolution, and milestones
        blocks:
          - type: paragraph
            body: >
              Sachin Nayyar and Vibhuti Sinha co-founded Saviynt in 2010 with the intent of building a cloud-native
              identity platform at a time when most incumbents relied on on-premises architectures. Carrick Capital
              Partners led the company's initial Series A round of $40 million, followed by a $10 million extension in
              October 2019. Saviynt's early growth was recognised in 2019 with a Deloitte Technology Fast 500 ranking.
              In September 2021 the company closed a $130 million growth financing round led by HPS Investment Partners
              and PNC Bank, bringing disclosed total capital to approximately $170 million. In January 2023, Saviynt
              raised a further $205 million led by AB Private Credit Investors (an AllianceBernstein affiliate),
              simultaneously with the return of founder Sachin Nayyar as CEO, bringing total disclosed capital to $375
              million. On December 9, 2025, Saviynt announced a $700 million Series B Growth Equity financing at
              approximately $3 billion valuation, led by KKR with participation from Sixth Street Growth, TenEleven
              Ventures, and existing investor Carrick Capital Partners — bringing cumulative capital across the major
              disclosed rounds to at least $1.075 billion.

              The company has experienced notable leadership evolution. Amit Saha served as CEO through at least April
              2022, when the 2021 annual results were announced with him in the role. By December 2023, Sachin Nayyar —
              the original founder — was confirmed as CEO, though no public press release announcing the transition has
              been located. Nayyar has since been consistently cited as Founder and CEO in every subsequent press
              release through 2026. In February 2024, Saviynt strengthened its board with the additions of Tomer
              Weingarten (CEO of SentinelOne) and Jesper Andersen (former CEO of Infoblox). The executive team expanded
              further in 2024–2026 with the hiring of a CMO, CRO, CISO, SVP Strategy, and the creation of new CCO and
              Chief Customer Officer roles in May 2026.
