chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and market position
        blocks:
          - type: paragraph
            body: >
              Saviynt was founded in 2010 by Sachin Nayyar and Vibhuti Sinha and is headquartered in El Segundo,
              California. The company positions itself under the tagline "Identity Security for AI. AI for Identity
              Security.™" and describes its mission as enabling enterprises to secure digital transformation through
              intelligent identity governance. As of mid-2026, Saviynt's LinkedIn profile lists the company in the
              1,001–5,000-employee range, and the company states it protects more than 100 million identities across its
              global customer base. Saviynt competes in the Identity Governance and Administration (IGA) market
              alongside SailPoint and Oracle, but differentiates through a single cloud-native platform that converges
              IGA, Privileged Access Management, Application Access Governance, Identity Security Posture Management,
              and External Identity Management. The company also positions itself at the emerging intersection of AI and
              identity, launching purpose-built AI-agent governance capabilities in early 2026. Analyst recognition from
              Gartner Peer Insights (five consecutive Customers' Choice distinctions) and KuppingerCole (Overall Leader
              in IGA and PAM) underscores Saviynt's standing as a tier-one vendor in the enterprise identity security
              market.
