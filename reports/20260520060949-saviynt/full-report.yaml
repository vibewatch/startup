      - number: '1.5'
        title: Products, technology platform, and AI strategy
        blocks:
          - type: paragraph
            body: >
              Saviynt's Enterprise Identity Cloud (EIC) is a cloud-native SaaS platform that converges five primary
              product pillars: Identity Governance and Administration (IGA), Cloud Privileged Access Management (Cloud
              PAM), Identity Security Posture Management (ISPM), Application Access Governance (AAG), and External
              Identity Management for third-party access. This unified architecture allows customers to consolidate
              identity tooling that has historically required separate point solutions from multiple vendors.

              Saviynt's AI strategy is two-directional: deploying AI to enhance identity decisions (intelligent access
              recommendations, risk scoring, anomaly detection) and building governance infrastructure for AI agents
              themselves. The March 2026 launch of "Saviynt Identity Security for AI" — described by the company as the
              first enterprise-grade platform to govern AI agents from discovery through runtime — extends the EIC to
              non-human identities including LLM-powered agents, service accounts, and automated workflows. An MCP
              Server was listed in the AWS Marketplace AI Agents and Tools category in July 2025, enabling AI assistant
              integration with identity workflows. Customers including Hertz, Auto Club Group, and UKG cited the AI
              agent governance capabilities at launch.
            claimRefs:
              - CO026
              - CO027
              - CO028
              - CO035
          - type: figure
            figureRef: FO002
            claimRefs:
              - CO026
              - CO027
