      platform by 2024, with two growth-equity rounds and an expanding hyperscaler partnership footprint.
    data:
      items:
        - date: '2010'
          label: Founded in El Segundo, CA
          detail: Sachin Nayyar and Vibhuti Sinha launch cloud-native IGA platform.
          tone: positive
        - date: '2019'
          label: Series A + A1 complete; Deloitte Fast 500
          detail: Carrick Capital total investment reaches ~$50M; early market validation.
          tone: positive
        - date: '2021'
          label: $130M growth financing; 850 employees
          detail: HPS Investment Partners leads; total capital ~$170M; SaaS +42%, Cloud PAM +138%.
          tone: positive
        - date: '2023'
          label: $205M AB Private Credit round; Sachin Nayyar returns as CEO
          detail: AllianceBernstein affiliate leads $205M round; total capital ~$375M; Microsoft Copilot partner.
          tone: positive
        - date: 2024-02
          label: Board expanded with Weingarten and Andersen
          detail: SentinelOne CEO and former Infoblox CEO join board.
          tone: positive
        - date: '2024'
          label: FY2024 — EBITDA profitable; NRR 111%; ARR >35% growth
          detail: Crossed 500-customer and 1,000-employee milestones; subscription GM ~80%.
          tone: positive
        - date: 2025-07
          label: AWS Strategic Collaboration Agreement
          detail: Preferred co-sell relationship with AWS established.
          tone: positive
        - date: 2025-12
          label: $700M KKR-led Series B at ~$3B valuation
          detail: KKR leads with Sixth Street Growth, TenEleven, Carrick; cumulative capital >$1.0B.
