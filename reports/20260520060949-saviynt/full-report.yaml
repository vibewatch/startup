      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The most credible Saviynt buyers are large enterprises and regulated organizations that already treat
              identity as a governance and audit problem, not just a login problem. Mordor shows large enterprises as
              70.63% of IGA spend and BFSI as the largest 2025 vertical at 29.26%, which fits Saviynt's enterprise-heavy
              go-to-market. These are environments where identity teams, internal audit, security, and infrastructure
              leaders all care about provisioning quality, entitlement controls, and evidence for compliance reviews. In
              practice the day-to-day user is often an IAM or security-operations team, but the payer can sit under the
              CISO, CIO, or a shared IT/compliance budget depending on whether the project is sold as compliance
              automation, privileged-access reduction, or broader identity-security consolidation.


              Adoption typically starts with a concrete governance workflow: access certification, joiner-mover-leaver
              automation, or privileged/non-human identity control. It expands when the platform can show faster audit
              response, fewer standing privileges, and tighter lifecycle controls across human and machine identities.
              Okta, IBM, SailPoint, and Oracle all frame the market around governance, compliance, lifecycle, and
              least-privilege outcomes, reinforcing that Saviynt does not need to win every IAM budget to win its core
              market. The best fit accounts are therefore large, cloud-forward enterprises that already feel regulatory
              pressure and are starting to extend identity governance beyond employees into contractors, shared
              accounts, bots, service accounts, and AI-linked identities.
