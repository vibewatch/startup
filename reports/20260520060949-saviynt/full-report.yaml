  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Enterprise Identity Cloud — Five-Module Architecture
        blocks:
          - type: paragraph
            body: >-
              Saviynt's Enterprise Identity Cloud (EIC) is a cloud-native SaaS platform that converges identity
              governance, privileged access, posture management, external identity management, and AI agent identity
              governance into a single multi-tenant service. The platform claims no on-premise deployment option,
              distinguishing it from legacy IGA vendors that maintain hybrid architectures. Five discrete modules make
              up the EIC: (1) Identity Governance and Administration (IGA), the core module covering provisioning,
              access certification, RBAC/ABAC policy management, and SoD enforcement; (2) Cloud PAM, covering privileged
              access control with just-in-time access for cloud infrastructure; (3) Identity Security Posture Management
              (ISPM), which detects misconfigurations, shadow admin, and excessive standing privileges; (4) External
              Identity Management (EIM), which governs the identity lifecycle of third-party workforce including
              contractors, partners, and suppliers; and (5) Application Identity Security (Agent Access Gateway, AAG),
              the newest module governing non-human and AI agent identities at runtime.


              The platform is underpinned by the SaviAI engine, which Saviynt describes as four distinct AI agent types
              embedded across modules: lifecycle management AI, application onboarding AI, security operations AI, and
              identity administration AI. The Saviynt Exchange marketplace provides self-service access to 750+
              out-of-the-box application connectors and partner-built integrations, including risk signal feeds from
              CrowdStrike, Zscaler, Wiz, and Cyera. KuppingerCole analysts cited Saviynt as having the 'broadest list of
              out-of-the-box integration use cases amongst all vendors' in the IGA segment, a claim that remains
              analytically unverified from this review.


              The five-module architecture is presented as a converged alternative to point-solution IGA+PAM stacks, but
              Cloud PAM's lack of a dedicated product page and user feedback citing PAM feature depth gaps relative to
              specialist vendors (CyberArk, BeyondTrust) suggest the convergence story is stronger in IGA and ISPM than
              in PAM.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
