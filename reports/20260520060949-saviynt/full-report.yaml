      - number: '1.6'
        title: Partner ecosystem and strategic alliances
        blocks:
          - type: paragraph
            body: >
              Saviynt operates a broad partner ecosystem with more than 400 channel partners globally. The most
              significant strategic alignment is with Amazon Web Services: Saviynt signed an AWS Strategic Collaboration
              Agreement (SCA) in July 2025, creating a preferred-partner relationship for co-selling identity security
              capabilities to AWS customers. KPMG Australia is cited as a key channel partner in the APAC region. In
              July 2021 Saviynt and Deloitte expanded their strategic alliance to offer turnkey managed identity
              services, enabling Deloitte to deliver Saviynt EIC implementations as a managed service. Saviynt is also a
              member of the Microsoft Intelligent Security Association and was selected in December 2023 for Microsoft's
              Security Copilot Partner Private Preview, giving it early integration access to Microsoft's AI-powered
              security platform. In June 2025, Steve Blacklock — formerly of Palo Alto Networks and Citrix — joined as
              SVP Global Partners to accelerate partner ecosystem growth. Technical integrations cover CrowdStrike,
              Zscaler, ServiceNow, and Wiz, among others.
            claimRefs:
              - CO031
              - CO032
              - CO033
              - CO034
      - number: '1.7'
        title: Risks, adverse signals, and diligence gaps
        blocks:
          - type: paragraph
            body: >
              Several risk factors and adverse signals are documented. First, a Gartner Peer Insights review published
              in August 2025 by a Director of Identity and Access Management at a mid-market bank awarded Saviynt a 2.0
              out of 5 score, describing support as "abysmal" and citing "massive turnover in the organization"
              affecting service management. A second critical theme from PeerSpot reviews is Saviynt's limited
              customization relative to SailPoint: multiple users note that complex configuration requiring development
              work remains a friction point, and some customers report onboarding projects delayed by slow response
              times from the vendor. These adverse signals contrast with the 4.8/5 Gartner Peer Insights aggregate
              rating, suggesting satisfaction variance correlated with customer size and implementation complexity.

              Second, the CEO transition from Amit Saha to Sachin Nayyar occurred between April 2022 and December 2023
              without a public announcement, which is atypical for a company of Saviynt's scale and raises questions
              about the circumstances. Third, the GRR figure of "approximately 98% excluding downsell" implies a
              disclosed GRR of greater than 95% when downsell is included, indicating some customers have reduced their
              contracted scope. Fourth, all financial figures are company-disclosed only; no independent audit has been
              confirmed. Finally, a purported "$205 million Series B financing led by Goldman Sachs Asset Management"
              (BusinessWire/PRNewswire, October 2024) has not been verifiable despite multiple URL attempts; it is
              treated as unconfirmed and distinct from the verified December 2025 $700 million KKR-led round at
              approximately $3 billion valuation.
            claimRefs:
              - CO036
              - CO037
              - CO038
              - CO039
      - number: '1.8'
        title: Exhibits
        blocks:
          - type: callout
            title: Retention economics signal durable competitive positioning
            body: >-
              A 111% NRR combined with a >95% GRR in FY2024 indicates that Saviynt is both retaining existing revenue
              and expanding wallet share within its customer base. This combination — particularly the NRR improvement
              from 104% to 111% in a single year — is consistent with a platform expanding into adjacent identity use
              cases (PAM, ISPM, AAG) within existing accounts rather than growing solely through new customer
              acquisition.
            calloutType: strength
            claimRefs:
              - CO006
              - CO007
              - CO011
          - type: callout
            title: AI agent governance may be a near-term differentiator
            body: >-
              The March 2026 launch of Saviynt Identity Security for AI positions the company at the convergence of
              identity governance and AI orchestration. As enterprises deploy LLM-powered agents with access to
              production systems, IGA vendors that can govern non-human identities with the same rigor applied to human
              ones gain a structural advantage. Saviynt's claim of being the first enterprise-grade platform for AI
              agent governance — if sustained through 2026-2027 product cycles — could accelerate win rates in
              competitive evaluations.
            calloutType: insight
            claimRefs:
              - CO027
              - CO028
          - type: callout
            title: Silent CEO transition and support complaints introduce diligence uncertainty
            body: >-
              The unannounced CEO change between Amit Saha and Sachin Nayyar (estimated April 2022 to December 2023) is
              an atypical disclosure pattern for a company at Saviynt's scale and funding level. Combined with the
              August 2025 Gartner Peer Insights critical review describing support as "abysmal" with "massive turnover"
              in the service management team, there is a plausible operational quality narrative worth scrutinising in
              reference checks.
            calloutType: risk
            claimRefs:
              - CO036
              - CO038
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Saviynt should be analyzed first as an enterprise identity governance and administration vendor, with
              meaningful adjacency into privileged and non-human identity security, rather than as a proxy for the
              entire identity-and-access-management market. External product and analyst definitions align on the core
              problem set: lifecycle provisioning and deprovisioning, access approvals, entitlement governance,
              auditability, separation-of-duties controls, and continuous compliance. IBM Verify Identity Governance,
              SailPoint Identity Security Cloud, Oracle IAM, and MarketsandMarkets all describe a category boundary that
              is broader than one-time authentication but narrower than the full IAM stack, which can also include CIAM,
              access management, and broader workforce identity tools.


              That distinction matters for market sizing. Included spend should cover enterprise IGA platforms,
              compliance-led access certification, privileged-account governance, and the expanding need to govern
              service accounts, bots, and AI-linked non-human identities. Excluded spend should include consumer IAM,
              pure authentication or SSO budgets, and stand-alone access-management tools where the buyer is not
              purchasing lifecycle governance or compliance controls. The status-quo substitute is therefore not one
              vendor alone; it is a mix of manual access review processes, point PAM tools, and broader IAM suites that
              already cover part of the workflow. Saviynt's wedge is strongest where a buyer wants to collapse those
              fragmented controls into one cloud-native identity-security control plane.
            claimRefs:
              - CM001
              - CM002
              - CM003
