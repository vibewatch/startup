  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              Saviynt generates revenue primarily through multi-year SaaS subscription contracts priced on a
              per-identity (per-seat) basis. The company's Enterprise Identity Cloud (EIC) bundles five product pillars
              — Identity Governance and Administration (IGA), Cloud Privileged Access Management, Identity Security
              Posture Management, Application Access Governance, and External Identity Management — into a unified
              platform offered at platinum, gold, and silver service tiers. Subscription revenue constituted 88% of
              total revenues in FY2024, up from prior years, indicating a deliberate transition away from implementation
              and professional services. The remaining 12% derives from professional services, implementation
              engagements, and training, all of which are expected to decline as a percentage of revenue as the SaaS mix
              matures.


              Saviynt does not publish list pricing. Enterprise deals are negotiated commercially, with pricing
              influenced by total identity count, product modules licensed, multi-year commitment length, and service
              tier. Customer reviews on PeerSpot describe the pricing model as comparable to Microsoft Azure Entra ID
              Governance and broadly competitive within the enterprise IGA segment, though some reviewers characterize
              it as expensive relative to smaller vendors. New SaaS Annual Contract Value (ACV) bookings reached
              approximately $60 million in FY2024, up more than 35% year-over-year, indicating strong new business
              momentum at premium price points. Revenue recognition follows standard SaaS subscription accounting:
              committed contract value is recognized ratably over the term, with implementation fees deferred and
              recognized over the expected customer life.
