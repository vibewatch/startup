    layout: wide
    summary: >-
      DAG of Saviynt EIC's critical external dependencies — infrastructure, AI, directory, ecosystem, and compliance —
      with associated risk tiers.
    data:
      nodes:
        - id: eic-platform
          label: Saviynt EIC Platform
          detail: Core SaaS platform; all modules and AI engine; multi-tenant
          group: core
        - id: aws-infra
          label: AWS Cloud Infrastructure
          detail: Primary cloud hosting provider; FedRAMP boundary; Data Accessor for Amazon Q Business via AWS SCA
          group: dependency
        - id: llm-vendors
          label: Third-Party LLM Vendors (undisclosed)
          detail: SaviAI engine relies on external LLMs for risk scoring and AI agent capabilities; vendor not publicly named
          group: dependency
        - id: directory-services
          label: Customer Directory Services (AD/LDAP/SCIM)
          detail: >-
            Identity master data source; EIC syncs from AD/LDAP or SCIM-enabled IdPs; multi-forest AD complexity
            documented
          group: dependency
        - id: saas-apps
          label: Target SaaS Applications (SAP, Salesforce, ServiceNow, etc.)
          detail: 750+ connectors via Saviynt Exchange; connector health depends on vendor API stability
          group: dependency
        - id: ai-ecosystems
          label: AI Agent Ecosystems (Bedrock, Copilot Studio, Vertex AI, ServiceNow AI, Agentforce)
          detail: Agent Access Gateway enforces policy at runtime; dependency on 5 AI vendor APIs
          group: dependency
        - id: fedramp-pmo
          label: FedRAMP PMO / Third-Party Auditors
          detail: Annual FedRAMP continuous monitoring; ISO/SOC audit cycles; compliance certification renewal
          group: dependency
        - id: partner-channel
          label: SI / MSP Partners (Deloitte, KPMG, Accenture)
          detail: Major deployments delivered through SI partners; Deloitte Digital Identity+ platform incorporates Saviynt
          group: dependency
      edges:
        - from: eic-platform
          to: aws-infra
          label: Hosted on; FedRAMP boundary
        - from: eic-platform
          to: llm-vendors
          label: SaviAI runtime dependency
        - from: eic-platform
          to: directory-services
          label: Identity master data sync
        - from: eic-platform
          to: saas-apps
          label: Provisioning and governance via connectors
        - from: eic-platform
          to: ai-ecosystems
          label: AAG policy enforcement
        - from: eic-platform
          to: fedramp-pmo
          label: Annual compliance audits
        - from: eic-platform
          to: partner-channel
          label: Delivery and managed services
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Maturity and competitive strength assessment across Saviynt EIC's five modules on four dimensions: product
      maturity, analyst recognition, competitive differentiation, and go-to-market emphasis.
    data:
      columns:
        - IGA
        - Cloud PAM
        - ISPM
        - External Identity Mgmt
        - Agent Access Gateway
      rows:
        - label: Product Maturity
          values:
            - High — GA since 2011; core revenue driver
            - Medium — GA but de-emphasized; PAM page 404
            - Medium-High — GA; AI posture layer added Mar 2026
            - Medium — GA; smaller marketed use case
            - Low-Medium — GA launch Mar 2026; early commercial stage
        - label: Analyst Recognition
          values:
            - Strong — Gartner Customers' Choice 5× (IGA)
            - Weak — not separately positioned in PAM Magic Quadrant
            - Emerging — no independent analyst report cited
            - Weak — minimal independent analyst coverage
            - Absent — not in RSAC 2026 AI governance roundup (VentureBeat)
        - label: Competitive Differentiation
          values:
            - High — SaviAI, 750+ connectors, FedRAMP, convergence story
            - Low — lacks depth vs. CyberArk, BeyondTrust; JIT access standard
            - Medium — AI misconfiguration detection differentiates from basic IGA
            - Medium — vendor/contractor lifecycle less common in IGA suite
            - High (potential) — multi-ecosystem AAG coverage unique if scaled
        - label: GTM Emphasis
          values:
            - High — primary homepage messaging, Gartner badge, press releases
            - Low — no dedicated product page; subsumed under platform narrative
            - Medium — featured in AI launch; CISO-targeting messaging
            - Low — mentioned on platform page; not a primary marketing pillar
            - High — March 2026 launch event; design partner names; C-suite messaging
  - id: FU001
    title: Saviynt Customer Journey Map
    type: journey-map
    layout: wide
    summary: >
      Illustrates how enterprise buyers move from legacy IGA pain points through Saviynt evaluation, onboarding, and
      multi-module expansion, anchored to documented customer evidence where available.
    data:
      nodes:
        - id: pain
          label: Legacy IGA Pain
          description: >
            Manual provisioning, frequent outages, high maintenance cost, compliance audit burden (months of prep).
            Triggered by M&A, cloud migration, or regulatory change.
          stage: trigger
        - id: evaluation
          label: Vendor Evaluation
          description: >
            Proof-of-value or proof-of-concept against 1–2 shortlisted vendors. VF Corp tested 150+ use cases; Auto Club
            Group conducted Gartner Magic Quadrant-guided comparison with two leaders.
          stage: evaluation
        - id: onboarding
          label: Initial IGA Deployment
          description: >
            SI-assisted or in-house deployment of Saviynt IGA. First integrations with HR systems (Workday) and AD
            provisioning. Migration of applications incrementally to avoid disruption.
          stage: onboarding
        - id: production
          label: Production Steady State
          description: >
            Full lifecycle management, access certification, SoD enforcement live. Legacy platform decommissioned (VF
            Corp, Auto Club Group). Compliance auditors given direct platform access.
          stage: production
        - id: expansion-pam
          label: PAM Expansion
          description: >
            Cloud PAM layered on top of IGA for privileged access governance across cloud workloads. Often triggered by
            security incident or cloud migration milestone.
          stage: expansion
        - id: expansion-ispm
          label: ISPM / EIM Expansion
          description: >
            ISPM for identity posture across hybrid environments; EIM for contractor and third-party identities. Drives
            additional seat growth within existing account.
          stage: expansion
        - id: expansion-ai
          label: AI Identity Governance
          description: >
            Agent Access Gateway and ISPM for AI Agents governing AI workloads. Early-adopter design partners as of
            March 2026 (Hertz, Auto Club Group, UKG).
          stage: expansion
    claimRefs:
      - CU013
      - CU014
      - CU017
      - CU018
      - CU019
      - CU033
      - CU034
  - id: FU002
    title: Adoption and Deployment Funnel
    type: funnel
    layout: standard
    summary: >
      Approximate funnel from awareness through multi-module expansion, illustrating where public evidence exists and
      where gaps remain.
    data:
      items:
        - label: Awareness / Market Presence
          value: 100
          note: >
            IGA market: ~3,000+ global enterprises with complex identity needs (analyst estimate). Saviynt actively
            present in 8 named verticals; Gartner/KuppingerCole leader status drives inbound evaluation.
        - label: Active Evaluation (PoV/PoC)
          value: 60
          note: >
            Significant portion of prospects reach PoV stage based on partner-page references and sales cycle
            disclosures. No public win rate data.
        - label: Initial IGA Deployment
          value: 40
          note: >
            500+ disclosed enterprise customers in production as of FY2024. Growth rate and pipeline health not publicly
            verifiable.
        - label: Multi-Module Expansion
          value: 20
          note: >
            NRR of 111% implies substantial cross-sell/upsell, but % of customers on 2+ modules not disclosed. SI
            partner ecosystem enables multi-module delivery.
        - label: AI Identity Governance (emerging)
          value: 5
          note: >
            Three named design partners (Hertz, Auto Club Group, UKG) as of March 2026. General availability and broader
            adoption not yet quantified.
