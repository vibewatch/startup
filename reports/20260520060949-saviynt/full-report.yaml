      - number: '5.2'
        title: SaviAI and Identity Security for AI Agents
        blocks:
          - type: paragraph
            body: >-
              On March 24, 2026, Saviynt launched Identity Security for AI, a three-pillar framework addressing the
              governance gap created by agentic AI systems. The three pillars are: ISPM for AI (detecting AI identity
              misconfigurations and excessive AI permissions), Identity Lifecycle Management for AI (provisioning and
              deprovisioning AI agent identities), and Agent Access Gateway (AAG), which enforces access policy for AI
              agents operating within five supported agent-builder ecosystems: Amazon Bedrock, Microsoft Copilot Studio,
              Google Vertex AI, ServiceNow AI Agents, and Salesforce Agentforce. Hertz, Auto Club Group, and UKG were
              named as design partners on the launch announcement.


              The 2026 Saviynt CISO AI Risk Report provided supporting market framing: 71% of surveyed CISOs report AI
              has access to core business systems, and 91% report limited or no visibility over AI identities. These
              company-sponsored survey findings are directionally consistent with independent CSO Online coverage of the
              non-human identity governance problem, though Saviynt's claim that it is uniquely positioned to solve this
              is contested. VentureBeat's RSAC 2026 roundup of AI agent governance frameworks named five vendors (Cisco,
              CrowdStrike, Microsoft, Palo Alto Networks, and Cato Networks) without including Saviynt — a meaningful
              independent signal that Saviynt's AI governance narrative had not, as of May 2026, broken through in
              tier-one analyst and press coverage of the space.


              Prior to the March 2026 launch, Saviynt had established positioning in AI tooling ecosystems: it was
              selected for Microsoft Security Copilot's partner private preview in December 2023 and announced an AWS
              Strategic Collaboration Agreement in July 2025 that includes a native Data Accessor integration with
              Amazon Q Business. The SaviAI engine's underlying LLM dependencies are not publicly disclosed; the absence
              of explicit LLM vendor attribution creates a diligence gap around model reliability, data residency, and
              hallucination risk in access decision paths.
            claimRefs:
