      - number: '5.5'
        title: Product Gaps and Friction Signals
        blocks:
          - type: paragraph
            body: >-
              Independent user review signals reveal a consistent set of product friction points. On Gartner Peer
              Insights, a reviewer in August 2025 gave Saviynt a 2.0/5 rating, characterizing the product as 'very
              difficult to learn', support as 'abysmal', and the organization as experiencing 'massive turnover'.
              PeerSpot reviewers cite PAM functionality gaps relative to dedicated PAM vendors, performance issues under
              large identity volumes, and onboarding complexity as the most common limitations. TrustRadius reviewers
              corroborate the onboarding friction: the absence of drag-and-drop configuration for advanced setups and
              difficulty replicating AD entitlement structures from scratch are recurring themes.


              The Cloud PAM module's go-to-market posture is a structural concern. The dedicated Cloud PAM product URL
              returns a 404 error as of May 2026, and the module is not prominently featured in Saviynt's primary
              platform marketing. This suggests either a deliberate repositioning (subsuming PAM into the AAG narrative)
              or a product investment gap that leaves PAM buyers without a strong product-specific entry point.
              Specialist PAM vendors such as CyberArk and BeyondTrust continue to out-position Saviynt in dedicated PAM
              evaluations.


              The developer ecosystem footprint is minimal. Three public GitHub repositories with single-digit star
              counts, an inaccessible public API documentation portal, and the absence of a public SDK or developer
              program create a material gap for customers evaluating self-service integration or automation
              capabilities. The absence of Saviynt from the VentureBeat RSAC 2026 AI agent governance roundup (which
              covered Cisco, CrowdStrike, Microsoft, Palo Alto Networks, and Cato Networks) suggests Saviynt has not yet
              established thought-leadership parity with security platform incumbents in the emerging AI agent identity
              governance segment, despite the March 2026 product launch.
            claimRefs:
              - CE029
              - CE030
              - CE031
              - CE032
