      - number: '1.4'
        title: Funding history and investor base
        blocks:
          - type: paragraph
            body: >
              Saviynt's capital structure reflects a growth-equity model without traditional venture capital. Carrick
              Capital Partners, a technology-focused growth equity firm, led the original Series A investment of $40
              million at an undisclosed valuation, followed by a $10 million supplemental tranche in October 2019. In
              September 2021, HPS Investment Partners led a $130 million growth financing round with PNC Bank
              participating, bringing disclosed total capital to approximately $170 million.

              In January 2023, Saviynt raised $205 million led by AB Private Credit Investors (an affiliate of
              AllianceBernstein), announced concurrently with the return of founder Sachin Nayyar as CEO; this round
              brought total disclosed capital to $375 million. A purported separate "$205 million Series B led by
              Goldman Sachs Asset Management" (BusinessWire and PRNewswire, October 2024) has not been verified — all
              retrieval attempts returned 404 errors and no corroborating Saviynt press release has been located; that
              purported round is treated as an unconfirmed signal and not included in the capital totals.

              On December 9, 2025, Saviynt announced a $700 million Series B Growth Equity financing at approximately $3
              billion valuation, led by KKR with participation from Sixth Street Growth, TenEleven Ventures, and
              existing investor Carrick Capital Partners. This is the most recent and largest confirmed round.
              Cumulative capital across the major disclosed rounds ($40M + $10M + $130M + $205M + $700M) totals at least
              $1.075 billion. The primary-versus-secondary mix of the December 2025 round has not been publicly
              disclosed.
