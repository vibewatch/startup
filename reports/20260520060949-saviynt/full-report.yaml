  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Strong financing and operating proof meet stretched implied multiples and partial structural opacity, with
      secondary-mix as the swing factor.
    data:
      nodes:
        - id: round
          label: $700M KKR-led round
          detail: December 2025 growth equity at ~$3B valuation; minority structure per management.
          tone: positive
        - id: ops
          label: Operating proof
          detail: EBITDA-positive, >35% ARR growth, 96% GRR, 111% NRR carried in from prior chapters.
          tone: positive
        - id: comps
          label: Comparable anchors
          detail: SailPoint 7.7x, Okta 5.2x, CyberArk deal 18.4x, Ping/ForgeRock 9-10x.
          tone: neutral
        - id: structure
          label: Structure opacity
          detail: Primary-secondary mix, preference stack, and ARR denominator not publicly disclosed.
          tone: warning
        - id: competition
          label: Bundle competition
          detail: Microsoft Entra, post-deal PANW-CyberArk, SailPoint roadmap pressure multiple over time.
          tone: warning
        - id: decision
          label: Research-more
          detail: Stay engaged; require structural detail or price reset before underwriting new money.
          tone: neutral
      edges:
        - from: round
          to: decision
        - from: ops
          to: decision
        - from: comps
          to: decision
        - from: structure
          to: decision
        - from: competition
          to: decision
    approximationNotes: null
    claimRefs:
