      - number: '8.2'
        title: 'Capital structure: $1.04B raised across five rounds, with the 2025 round doing most of the price discovery'
        blocks:
          - type: paragraph
            body: >-
              Saviynt's funding history is straightforward in shape and increasingly heavy at the top. SecurityWeek
              reports the company raised $40 million in 2018, $130 million in 2021, and $205 million in January 2023
              before the December 2025 round, and BankInfoSecurity puts total lifetime funding at approximately $1.04
              billion. The 2023 round was a strategic financing led by AB Private Credit Investors, an AllianceBernstein
              affiliate, and was used to extend the cloud platform rather than to mark a new equity valuation publicly.
              The December 2025 round is therefore the first round in years to function as a clean external mark.


              The 2025 mechanics matter for what the $3 billion price actually means. KKR led through its Next
              Generation Technology Growth Fund III, with co-investment from Sixth Street Growth, TenEleven, and
              existing investor Carrick Capital Partners. Piper Sandler advised Saviynt, with Cooley as legal counsel,
              Latham & Watkins advising Carrick, Gibson Dunn advising KKR, and Moelis and Kirkland & Ellis advising
              Sixth Street. Those are heavyweight advisors consistent with a sophisticated process, but they also
              suggest a complex structured round rather than a simple pre-IPO primary raise. Several searches for a
              purported 2024 Goldman Sachs-led financing returned no corroborating public evidence; that claim remains
              unverified and is treated as an open data point rather than a confirmed previous mark.
            claimRefs:
              - CV005
              - CV006
