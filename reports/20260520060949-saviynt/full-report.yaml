  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The $3B mark is comfortable only if Saviynt's current ARR is at or above ~$250M; lower ARR pushes the implied
      multiple into strategic-deal territory without strategic synergies.
    data:
      items:
        - label: Implied multiple at $185M ARR
          value: 16.2
          detail: Uses FY2024 contracted ARR reported in prior chapters as the conservative anchor.
          tone: negative
        - label: Implied multiple at $250M ARR
          value: 12
          detail: Base case for late-2025 ARR after >35% growth from FY2024 disclosure.
          tone: warning
        - label: Implied multiple at $300M ARR
          value: 10
          detail: Upper-range estimate consistent with continued >35% growth and expansion bookings.
          tone: neutral
        - label: Implied multiple at $350M ARR
          value: 8.6
          detail: Optimistic ARR assumption; would put Saviynt on top of the Ping/ForgeRock zone.
          tone: positive
    approximationNotes: >-
      Multiples are simple $3B / ARR ratios; they are not discounted cash-flow outputs and depend on ARR figures not
      publicly disclosed by Saviynt as of the 2026-05-20 run date.
    claimRefs:
      - CV001
      - CV019
      - CV020
      - CV021
      - CV022
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Scenario-based equity-value ranges show meaningful asymmetry between strategic-exit upside and bundle-driven
      downside.
    data:
      items:
        - label: Bear case
          low: 1500
          high: 2000
          midpoint: 1750
          unit: USD millions
          note: Growth slows to 15-20%, NRR slips below 110%, future mark at 5x-7x SailPoint-like multiple.
        - label: Base case
          low: 3000
          high: 4000
          midpoint: 3500
          unit: USD millions
          note: ARR scales to $350M-$400M; SailPoint/Okta-style 7x-10x environment at IPO or sponsor exit.
        - label: Bull case
          low: 6000
          high: 7000
          midpoint: 6500
          unit: USD millions
          note: ARR reaches ~$500M; CyberArk-style strategic acquirer pays 12x-15x.
    approximationNotes: >-
      Ranges are revenue-multiple scenario outputs designed for IC discussion, not management guidance. Outcomes depend
      on current ARR proving close to the estimated range and on exit type.
    claimRefs:
      - CV015
      - CV017
      - CV019
      - CV023
      - CV025
      - CV026
      - CV030
      - CV037
      - CV038
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Saviynt scores well on financing access and operating proof, but lower on disclosure depth and valuation support
      at the current mark.
    data:
      items:
        - label: Financing access
          value: 9 / 10
          detail: KKR-led $700M round with Sixth Street and TenEleven is elite for growth-stage identity security.
          tone: positive
        - label: Operating proof
          value: 8 / 10
          detail: EBITDA-positive, >35% growth, 96% GRR, 111% NRR carried in from FY2024 disclosures.
          tone: positive
        - label: Market position
          value: 7 / 10
          detail: Strong IGA brand; trailing SailPoint on mindshare per peer-comparison sources used in prior chapters.
          tone: positive
        - label: Comparable support
          value: 6 / 10
          detail: Implied multiple sits in the Ping/ForgeRock zone and below CyberArk strategic deal.
          tone: neutral
        - label: Disclosure depth
          value: 3 / 10
          detail: No public ARR figure, financing structure, or preference stack as of the run date.
          tone: negative
        - label: Valuation support
          value: 4 / 10
          detail: Defendable but stretched at $3B without current ARR proof and secondary-mix detail.
          tone: warning
        - label: Risk-adjusted return profile
          value: 5 / 10
          detail: Strategic-exit upside is real but conditional on M&A market and exit type.
          tone: warning
    approximationNotes: Scores are 0-10 IC ordinal judgments synthesized from the public evidence set; they are not third-party ratings.
    claimRefs:
      - CV001
      - CV007
      - CV015
      - CV023
      - CV025
      - CV026
      - CV030
      - CV037
      - CV044
      - CV045
