      - number: '3.3'
        title: PAM and Expanded Identity Platforms
        blocks:
          - type: paragraph
            body: >
              The completed PANW acquisition of CyberArk, announced in July 2025 and closed in early 2026, is the most
              structurally significant competitive event in Saviynt's operating history. Rebranded as Idira on May 12,
              2026, the combined platform now integrates traditional PAM, machine identity security, secrets management,
              IGA (via the Zilla Security integration CyberArk made prior to the acquisition), and agentic identity
              governance under Palo Alto Networks' security umbrella spanning network security, cloud security, and SOC.
              This gives Idira cross-portfolio bundling power that Saviynt cannot match as a standalone vendor.
              CyberArk's CORA AI provides anomaly detection, AI session summarization, and policy-recommendation
              capabilities that Idira inherits. Idira's pricing structure under PANW separates traditional PAM (IT
              Standard tier) and modern PAM (IT Enterprise and Dev tiers) from workforce access, machine identity, and
              agentic identity products. At RSA Conference 2026, PANW showcased Prisma AIRS 3.0 with an agentic registry
              and MCP gateway as the competitive answer to agentic identity governance—a space Saviynt has entered with
              its ISPM for AI Agents and MCP Server capabilities. BeyondTrust competes on PAM through its Pathfinder
              platform, which integrates PAM, ITDR, Cloud Identity Management, and CIEM via an AI-driven "True Privilege
              Graph" that maps indirect privilege paths including shadow admins. Delinea, product of the merger of
              Thycotic and Centrify, offers PAM with its Iris AI layer for continuous identity discovery, risk
              quantification, and JIT access controls. Both BeyondTrust and Delinea compete primarily in PAM rather than
              full IGA, giving Saviynt an advantage in deals where buyers seek unified IGA+PAM coverage from one vendor.
