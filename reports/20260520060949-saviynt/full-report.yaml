      - number: '4.3'
        title: Unit Economics and Sales Efficiency
        blocks:
          - type: paragraph
            body: >
              Saviynt does not disclose Customer Acquisition Cost (CAC), CAC payback period, Lifetime Value (LTV), or
              sales and marketing expense as a percentage of revenue. These metrics must be inferred from available
              proxy data. The company's 111% NRR and >95% GRR imply a negative effective churn rate: each cohort of
              customers grows over time without requiring additional new-logo acquisition to maintain ARR. This dynamic
              substantially improves implied CAC payback economics relative to the reported new-logo bookings growth of
              >35%.


              Headcount growth provides a cost proxy: Saviynt grew from approximately 850 employees in early 2022
              (post-FY2021 announcement) to more than 1,000 by Q3 2024, implying an addition of 150+ net employees
              during the growth phase. LinkedIn data as of May 2026 shows approximately 1,626 employees, indicating
              continued headcount investment through 2025-2026. Executive hiring patterns — CMO from Similarweb and
              Appian (both pre-IPO technology companies), a newly created Chief Commercial Officer role (Pete Angstadt),
              and Chief Customer Officer (Brad Myers) hired in May 2026 — suggest an organizational build toward a more
              defined go-to-market motion. The AWS Strategic Collaboration Agreement (July 2025) and Deloitte alliance
              provide partner-sourced pipeline at lower CAC than direct sales, consistent with the company's emphasis on
              ecosystem-driven growth. SailPoint (public comparator) reports that over 90% of new transactions flow
              through its partner network, a pattern Saviynt appears to emulate.
