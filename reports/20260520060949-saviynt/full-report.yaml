      - number: '4.4'
        title: Cost Structure, Margins, and Profitability
        blocks:
          - type: paragraph
            body: >
              Subscription gross margin of approximately 80% is the only disclosed cost-structure metric from Saviynt.
              This figure is consistent with well-scaled enterprise SaaS platforms and implies modest infrastructure,
              hosting, and customer success costs relative to subscription revenue. For reference, SailPoint (public
              peer) reported total gross margin in the low-to-mid 70s percentage range in FY2026 (January fiscal year),
              reflecting its combination of subscription and services revenue. Saviynt's 88% subscription revenue mix
              with ~80% subscription gross margin implies a blended gross margin likely in the 68–74% range after
              incorporating lower-margin professional services, though this estimate is unconfirmed.


              Operating expenses — including R&D, sales and marketing, and G&A — are not disclosed. However, the
              achievement of positive cash EBITDA in FY2024 is a significant financial milestone for a company that had
              been investing heavily in product expansion and global headcount. EBITDA profitability was achieved
              concurrently with >35% ARR growth, which, if sustained, represents a rare combination of growth and
              capital efficiency. The company did not characterize the EBITDA margin magnitude, and it is possible the
              profitability is thin or driven by timing effects (deferred commissions, capitalized software costs). Free
              cash flow, net income, and specific operating expense ratios are not disclosed. SailPoint, as a public
              benchmark, spent $223.1 million on R&D alone in FY2026 — approximately 20% of its $1.1 billion revenue
              base — highlighting the capital intensity of competitive product development at scale.
            claimRefs:
              - CI005
