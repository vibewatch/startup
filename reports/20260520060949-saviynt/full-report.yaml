      - number: '5.4'
        title: Security Posture, Certifications, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Saviynt holds a strong compliance portfolio for enterprise SaaS: FedRAMP Moderate authorization (achieved
              July 2022, claimed as the first combined IGA+PAM FedRAMP Moderate authorization at time of award), ISO
              27001:2022, ISO 27017, SOC 1 Type II, SOC 2 Type II, and PCI-DSS v4.0 — all with 2025 audit completions
              confirmed via the trust portal (trust.saviynt.com). The trust portal does not expose a real-time uptime
              dashboard or incident history, limiting external SLA and reliability auditability.


              Saviynt signed CISA's Secure by Design pledge in May 2024, as one of the first 100 companies to do so. The
              pledge is voluntary and non-binding; CISA has not defined an enforcement mechanism. Saviynt's April 2026
              Gartner Peer Insights Customers' Choice for IGA (fifth consecutive recognition) is the most prominent
              third-party quality signal: 249 verified customer reviews with an average rating of 4.8/5 as of January
              2026, the highest review count among recognized vendors in the category. This recognition is partially
              offset by a minority of Gartner reviews awarding 2.0/5 ratings citing implementation difficulty and poor
              support quality, which are consistent with the complexity signals surfaced in PeerSpot reviews.


              The compliance stack is appropriate for regulated-industry enterprise buyers (FSI, healthcare, federal)
              but does not include HIPAA BAA documentation on the public security page, HITRUST certification, or
              FedRAMP High, which limits addressable market for some federal agency and healthcare use cases requiring
              higher security baselines.
