      - number: '6.5'
        title: Expansion and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              The 111 percent NRR demonstrates a net land-and-expand dynamic: customers start primarily with IGA and
              expand into Cloud PAM, ISPM, External Identity Management, and the new AI governance modules as the
              platform matures. The converged EIC platform architecture structurally rewards expansion because each
              module extends the governance perimeter (human → privileged → third-party → AI agents), creating multiple
              expansion vectors per customer. The Deloitte Digital Identity+ managed-services model, KPMG implementation
              accelerators, and Accenture delivery capacity collectively extend the platform's reach into customers
              where deep SI relationships govern technology selection, creating channel dependency alongside channel
              leverage. Key concentration risks remain opaque: no public disclosure of top-10 or top-25 customer revenue
              share, average contract value, or how many of the 500-plus logos account for a majority of ARR.
              SI-dependence also introduces implementation risk — if a major SI partner faces its own delivery
              constraints, Saviynt customer deployments can stall, as suggested by PeerSpot reviews referencing
              Saviynt-side onboarding blockages. No publicly disclosed churn rate or logo attrition data is available.
              The disclosed GRR of greater than 95 percent does imply low gross logo churn, but the absolute number of
              customers lost or contracted is not derivable from the available data. Regulatory-vertical concentration
              (financial services, insurance, healthcare) benefits from compliance-driven purchase durability but also
              makes the base sensitive to regulatory change or enterprise budget cycles in those sectors.
