  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: research-more at the $3B mark, with secondary mix as the swing factor'
        blocks:
          - type: paragraph
            body: >-
              Saviynt is not a speculative bet. The company has consistently signed enterprise customers, reports
              profitable EBITDA, and just attracted a multi-billion-dollar mark from a strategic identity-security buyer
              in KKR alongside Sixth Street and TenEleven. The 2025 round is the strongest external validation Saviynt
              has ever received and was explicitly priced as a growth-equity transaction rather than a distress deal,
              which matters for how IC should frame the valuation.


              That said, the recommendation has to be price-sensitive rather than reputation-sensitive. SecurityWeek
              noted that most of the $700 million is "unlikely to go directly into the business," which signals a
              meaningful secondary component the company has declined to detail. Saviynt's President also told
              BankInfoSecurity the deal was structured as a minority investment that lets existing shareholders retain
              control, which is consistent with a secondary-heavy growth round. Until investors can see the
              primary-versus-secondary split, the preference stack, and a current ARR figure that anchors the implied
              multiple, the right posture is research-more with medium confidence rather than buy. The $3 billion print
              is the working anchor, not a proven floor.
