      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Demand in Saviynt's market is being pushed by structural security and compliance forces more than
              discretionary IT modernization alone. NIST's zero-trust architecture guidance shifts security focus toward
              users, assets, and resources; CISA's maturity model operationalizes least-privilege, per-request access
              decisions; and OMB M-22-09 explicitly emphasizes stronger enterprise identity and access controls in
              federal environments. The SEC's cybersecurity-governance disclosure rule adds more governance pressure at
              the board and public-company level. Together these sources reinforce identity governance as a
              control-plane requirement rather than a feature add-on. Cloud delivery and the rise of non-human
              identities extend the demand base further: MarketsandMarkets says PAM is the fastest-growing IAM
              technology segment and that non-human IAM is growing faster than other identity types.


              The main constraints are equally important. Public TAMs are inflated by overlapping category boundaries
              across IGA, IAM, PAM, and adjacent non-human identity tooling, which makes naive market addition
              misleading. Budget ownership is shared and often politically negotiated, especially when projects cross
              security, compliance, and IT operations. The newest growth adjacency — AI-agent identity — is promising
              but immature: VentureBeat reports that 85% of enterprises are running agent pilots while only 5% have
              reached production, and both VentureBeat and CSO identify unresolved governance, attribution, and control
              gaps. Technavio also notes that inflation and IT-budget pressure remain implementation constraints for PAM
              programs. Growth is real, but adoption still depends on trust, deployment discipline, and clear ownership.
