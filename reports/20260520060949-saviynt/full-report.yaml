        - Ask how much of Saviynt's pipeline is explicitly tied to zero-trust or federal-style mandates
      - - Compliance and governance disclosure pressure
        - Driver
        - Current
        - Raises the value of audit trails, certification workflows, and board-visible governance controls
        - Request win stories where identity governance displaced manual evidence collection
      - - Cloud delivery becoming default in IGA
        - Driver
        - Current / structural
        - Supports cloud-native platforms such as Saviynt and weakens legacy on-prem deployment assumptions
        - Measure deployment mix, migration pace, and partner-led implementation demand
      - - Non-human and AI-linked identities
        - Driver
        - Current / accelerating
        - Expands the addressable problem from employees to service accounts, bots, and agents
        - Request module attach and pipeline data for machine/service-account governance
      - - PAM growing faster than the broader IAM stack
        - Driver
        - Current / medium-term
        - Makes privileged identity a meaningful expansion vector beyond classic IGA
        - Quantify how often Saviynt wins when PAM is in scope versus IGA-only deals
      - - Overlapping TAM definitions across IGA, IAM, and PAM
        - Constraint
        - Current
        - Can materially overstate opportunity if diligence adds overlapping categories together
        - Rebuild TAM with management using product revenue mix and attach rates
      - - Shared budget ownership across CIO, CISO, audit, and IAM teams
        - Constraint
        - Current
        - Slows buying cycles because the user, approver, and payer are not always the same function
        - Ask who becomes the durable economic buyer in multi-module deployments
      - - Immature agent-identity governance and budget pressure
        - Constraint
        - Current / near-term
        - Pilot activity is high, but production and trust remain limited; implementation budgets still matter
        - Ask for production references, measurable ROI, and attach rates for AI-governance features
    notes: >-
      Drivers are strongest where compliance, least privilege, and non-human identity growth overlap; the main
