chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与当前阶段
        blocks:
          - type: paragraph
            body: >-
              当前公开来源一致将 TARS Robotics 描述为一家总部位于上海、2025 年成立、专注于工业自动化通用人形和轮式机器人的 具身智能公司。其产品叙事并非单一机器人 SKU：来源提到 A
              系列轮式工业机器人、T 系列人形机器人、DexHand 灵巧 操作硬件、AWE 3.0 具身模型栈和 SenseHub 数据采集流程。这一宽度很重要：它把 TARS 定位成完整的物理 AI 平台，
              而不只是零部件供应商。最强的阶段信号来自融资而非商业化：InforCapital 将 TARS 列为 Pre-A，三轮融资合计约
              $697M。然而，同一公开记录仍未披露收入、具名客户、员工人数、董事会结构或投后估值，因此后文应把规模说法理解为 融资和产品势头，而不是已经验证的商业牵引力。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO006
              - CO015
      - number: '1.2'
        title: 领导班子强，但治理透明度有限
        blocks:
          - type: paragraph
            body: >-
              已披露的领导班子是乐观情景的核心。公开资料将董事长 Li Zhenyu 与百度 Apollo 项目、CEO Chen Yilun 与华为自动 驾驶体系、联合创始人兼首席科学家 Ding Wenchao
              与机器人及具身 AI 研究联系起来。这为一家试图把高精度操作、数据
              采集和模型训练结合起来的机器人公司提供了可信的创始团队匹配度，但也带来关键人物集中风险：公开叙事反复聚焦同一小群资深技术负责人。缺失的是治理深度。所审来源未说明更广泛的董事会、独立董事或三名核心领导之下的运营团队。因
              此，当前对 TARS 的技术履历比对管理冗余或正式治理成熟度更容易形成投资判断。
            claimRefs:
              - CO003
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO015
      - number: '1.3'
        title: 融资能力非同寻常，但完整的股权结构叙事仍未理顺
        blocks:
          - type: paragraph
            body: >-
              融资史是外部最清晰的势头信号。公开来源一致显示 TARS 披露了三轮融资：2025 年 3 月 $120M、2025 年 7 月 $122M， 以及据报道于 2026 年 4 月完成的 $455M
              Pre-A。来源也都提到最新一轮同时引入财务投资人、战略支持者和带有政府背景 的资本。这类投资组合不只是为研发提供资金，也可能带来制造合作、本地政策支持和工业部署渠道。主要疑点在于公开记录 对 Pre-A
              领投方并不一致：一份来源称 GL Ventures 与 Sequoia China 联合领投、Meituan 为基石股东，另一些来源则把 Hillhouse/Hillhouse Ventures
              列为领投方。这不影响已披露的轮次规模，但意味着所有权、董事会权利和估值机制应以原始 融资文件核实，不能只依赖二手报道。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.4'
        title: 2025-2026 年里程碑显示技术进步，商业化仍是开放问题
        blocks:
          - type: paragraph
            body: >-
              对一家 2025 年成立的公司而言，TARS 的里程碑节奏很快：快速融资、2025 年底向研究机构开放 WIYH 数据集、2026 年 3 月获得 Guinness 认可的线束组装纪录，以及在 ICRA 2026
              发布 DexHand，均把公司定位在操作能力和具身基础模型上。 Gasgoo 还称 A1 机器人在 LogiMAT 完成海外亮相并产生购买意向，这一方向是正面的，但仍不是具名客户或签约收入。外部
              市场背景则形成更重要的制衡：Goldman Sachs 仍认为量产通用人形机器人的可行性尚未得到证明。结合 TARS 薄弱的公开商业
              披露，本章结论应保持平衡：公司资金异常充足、技术野心很大，但公开证据尚未验证规模化客户采用或财务韧性。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO011
              - CO012
              - CO013
              - CO014
