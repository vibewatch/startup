        - 更低的入场倍数，或经验证更快的商业化，会改善风险调整后的上行空间。
      - - 公开市场下行风险仍然真实
        - CompaniesMarketCap 显示 Symbotic 2026 年 10 月市值为 $23.46B，尽管处于品类领先地位，仍较 2025 年下跌 31.73%。
        - 上市可比公司倍数企稳，以及 TARS 特定收入披露，会降低估值压缩风险。
    notes: 该表区分支持继续尽调的证据与使估值判断保持条件性、而非精确结论的证据。
