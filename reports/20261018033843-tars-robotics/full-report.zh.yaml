            body: >-
              留存资料中最强的商业化信号，是 Gasgoo 报道 TARS 在海外首发 A1 后于 LogiMAT 产生购买意向。这是有方向性的帮助，但不等于已签订单、 确认收入或披露的平均售价。OriginOfBots
              还称公司部署有限、电池续航约三小时，说明真实运营成熟度可能仍落后于融资规模。更广泛地看， JD.com 2026
              年推动机器人服务，说明中国机器人商业化既依赖核心研发，也依赖训练、服务和分销基础设施。因此，公开记录支持市场兴趣 和技术潜力，但还不能支撑完整的单位经济模型。
