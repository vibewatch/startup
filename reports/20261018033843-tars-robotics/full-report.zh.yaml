              融资背景显示资本获取能力强，但价格发现弱。F4、InforCapital 和 Gasgoo 都支持 TARS 自 2025 年以来融资约 $697M；第三方轮次表却把估值字段
              留空，没有披露投后估值或清算结构。这很重要：公开和私募可比公司足以描绘上行空间，也足以提醒投资者不要假装精确。Yahoo Finance 显示 UBTECH 市值 39.79B HKD、滚动销售倍数
              12.40x，但净利润和杠杆自由现金流仍为负。CompaniesMarketCap 显示 Symbotic 于 2026 年 10 月市值 $23.46B，较 2025 年同比下降
              31.73%。TechCrunch 另获悉 Apptronik 扩大的 Series A 隐含约 $5.3B 投后估值，并明确指出双足机器人
              的制造成本很高。这些可比公司支持对该类别保持纪律性兴趣，却不能证明任何未披露的 TARS 轮次价格天然有吸引力。
            claimRefs:
