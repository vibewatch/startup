              - CO009
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              留存证据支持对 TARS 采用较窄的市场定义：面向精密制造和柔性材料流程的工业人形机器人，而不是泛化的“所有具身 AI” 机会。最强的公开验证是手工刺绣、线束式操作和面向工厂的柔性制造演示，因此 TARS
              首先要与人工精细操作劳动和 难以重构的固定自动化竞争。只有当流程对传统工装而言过于多变、但又有足够价值支撑机器人硬件、具身 AI 软件和集成成本 时，人形形态才有资格获得预算。
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM015
      - number: '2.2'
        title: 市场规模视角指向大行业，但不能推出 TARS 专属 SAM
        blocks:
          - type: paragraph
            body: >-
              公开市场规模仍是不同口径的参考，而非精确估算。Robozaps 引用 Markets and Markets 预测：人形机器人类别将从 2025 年的 $2.9B 增至 2030 年的 $15.3B，CAGR 为
              39%；同一数据库称其跟踪 7 个国家的 26 款人形机器人，其中 14 款已商业化， 行业投资超过 $5B。另据 MIIT/Xinhua，2025 年是中国人形机器人量产元年，国内制造商超过 140
              家、机型达到 330 款。这些 数据支持一个真实且在扩张的市场，但在缺少客户、价格和部署数据的情况下，仍无法单独划出 TARS 在精密制造中可获取的收入池。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM013
      - number: '2.3'
        title: 早期买家可能是工厂自动化团队和研究机构
        blocks:
          - type: paragraph
            body: >-
              证据最充分的买家路径始于负责高资本支出、易出错、劳动密集或频繁重构流程的制造组织。公开描述一贯把 TARS 放在精密工厂 场景中；估算的 $95,000 价格高于消费机器人，但仍低于 Robozaps
              为许多同业列出的工业价格区间。另一条路径是生态播种： InforCapital 称 TARS 于 2025 年 12 月向研究机构开放 WIYH 数据集，而公司在 Hugging Face
              组织中已经公开四个数据集。这 说明 TARS 可能同时在争取工厂采用，并围绕其具身 AI 栈建立外部数据和研究社区。
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM012
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM012
              - CM015
      - number: '2.4'
        title: 采用驱动因素真实存在，但商业化证据仍薄弱
        blocks:
          - type: paragraph
            body: >-
              看多逻辑很直接：劳动密集型灵巧作业、快速扩张的中国供应基础和行业标准化，都提高了人形机器人从展示走向预算内自动化 项目的概率。限制因素同样重要。中国新标准把安全、模型生命周期和应用要求直接放进商业化路径，而留存的
              TARS 来源仍未披露 具名付费客户、机群部署或 ROI 指标。融资记录本身也有数据质量问题，InforCapital 的叙事与 FAQ 对最新轮次时间线存在分歧。
              市场可能足够大，但现有公开证据还不足以支持精确的 TARS SAM、SOM 或采用时间表。
            claimRefs:
              - CM006
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 精密制造才是实际切入口
            body: 留存证据不足以把 TARS 视为广泛的消费机器人或通用服务机器人项目。最有支持的入口是传统自动化仍难以解决的高价值精细工业作业。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
          - type: callout
            title: 证明市场规模比证明需求捕获容易
            body: 行业增长、融资和中国供应扩张都很清晰，但留存公开记录仍没有展示 TARS 的具名客户、机群规模或经验证 ROI，因此 SAM/SOM 和采用时间仍未定。
            calloutType: risk
            claimRefs:
              - CM003
              - CM005
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争边界与基准组
        blocks:
          - type: paragraph
            body: >-
              相关基准组比其他 Pre-A 人形机器人初创公司更广。Humanoids Daily 将该行业描述为由 Figure（已确认估值 $39B）领衔的数十亿美元 资本竞赛，Apptronik、Unitree 和
              AgiBot 也已达到数十亿美元估值或具备 IPO 目标。因此，TARS 不只是在比拼演示新鲜感， 还要面对资金更雄厚、分销伙伴更强或两者兼具的公司。TARS 对 2025
              年成立的公司而言仍然资金异常充足，RobotHub 与 InforCapital 都列出三轮合计融资 $697M，但其资本位置仍低于全球头部玩家。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
