      - number: '4.3'
        title: 融资能力强，但资本充足性尚未证明
        blocks:
          - type: paragraph
            body: >-
              多个留存来源都称 TARS 自 2025 年以来三轮融资约 $697M，其中包括 2026 年 4 月 $455M 的 Pre-A；行业报道将其称为中国具身智能 领域创纪录融资。Gasgoo
              称资金将用于自研模型和全球人才招募。即使刚完成大额融资，算力和招聘支出仍可能很高。生态层面， 上海 2026 年 8 月的具身智能计划为算力、数据、试点平台及销售或租赁提供补贴；中国 2026 年 3
              月的国家标准体系则要求规模部署 承担合规和应用要求。              这些因素能帮助行业，但不能替代公司层面的现金、烧钱速度或现金续航披露。
