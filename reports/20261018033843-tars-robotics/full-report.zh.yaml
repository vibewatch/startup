          detail: SenseHub 和 WIYH 表明，训练闭环以人类数据为中心，而非只依赖仿真。
          outputs:
            - 人体动作捕捉与映射
            - 用于具身训练的 VLTA 数据集
    approximationNotes: 该图反映公开资料对层级和接口的描述，并非完整披露的生产架构或软件物料清单。
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 观察到的公开证据对应一条从认知到未经验证的扩张的早期客户漏斗。
    data:
      items:
        - label: 技术认知
          actor: 行业领袖、学者、机器人观察者
          phase: 漏斗顶部
          touchpoints:
            - ICRA 2026 DexHand 发布
            - 聚焦灵巧性演示的新闻报道
          note: 外部关注度可见，但这是评估者的关注，不是买方证明。
          tone: neutral
        - label: 能力评估
          actor: 制造业和自动化评估者
          phase: 评估
          touchpoints:
            - DexHand 手语与操作演示
            - A1 包装和线束插入演示
          note: 公开叙事仍由功能和演示驱动。
          tone: neutral
        - label: 商业探索
          actor: 潜在工业买家
          phase: 潜客开发
          touchpoints:
            - LogiMAT 海外首秀
            - 未具名客户据报道提出购买意向
          note: 这是审阅材料中最清晰的商业信号。
          tone: positive
        - label: 产品包装与定价
          actor: 采购和商务团队
          phase: 报价 / 提案
          touchpoints:
            - ui44 未记录数值价格
            - 未披露公开买方条款
          note: 商业包装尚未公开标准化。
          tone: risk
        - label: 生产部署
          actor: 具名工厂或物流场地
          phase: 上线
          touchpoints:
            - 未找到具名公开部署
            - 未找到合同期限或场地数量披露
          note: 公开证据尚未验证生产参考客户。
          tone: risk
        - label: 扩张与续约
          actor: 已部署客户的运营方和财务负责人
          phase: 规模化
          touchpoints:
            - 未披露 NRR、GRR、流失或续约数据
            - 未披露客户集中度或渠道结构数据
          note: 业务持续性仍是待解的尽调问题。
          tone: risk
    claimRefs:
      - CU003
      - CU004
      - CU006
      - CU008
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险最高的单元集中在商业化证明、行业经济性，以及对少数战略渠道的依赖上。
    data:
      columns:
        - label: 中等影响
        - label: 高影响
        - label: 极高影响
      rows:
        - label: 较低可能性
          notes:
            - >-
              Risks that are not yet evidenced as active failures but would become important if customer rollouts
              broaden quickly.
          values:
            - text: 事故披露缺口
              tone: warning
              note: DEPLOY 显示档案中没有活动事故，但未披露公开保修或召回数据集。
            - text: IP 或 FTO 尽调缺口
              tone: warning
              note: 审阅的公开来源不包含专利清单或自由实施分析。
            - text: 严重监管挫折
              tone: warning
              note: 若 TARS 披露合规技术栈之前出口或安全规则收紧，影响将会上升。
        - label: 较低可能性（观察名单）
          values:
            - text: 采购周期延误
              tone: neutral
              note: 即使演示效果出色，工业买家也可能延长验证周期。
            - text: 保修准备金意外
              tone: warning
              note: 指定材料池中未披露公开服务成本或更换率数据。
            - text: 跨境合规审查
              tone: warning
              note: 海外客户兴趣仍需经过有文件支持的供应商和出口管制尽调。
        - label: 中等可能性
          values:
            - text: 合作伙伴集中度
              tone: medium
              note: Meituan 和市级项目在公开材料中似乎具有战略重要性。
            - text: 估值不透明
              tone: risk
              note: 公开来源对于 2026 年 4 月投后估值是否已披露存在冲突。
            - text: 出口管制或供应商敞口
              tone: risk
              note: 指定证据中没有公开 BOM 或芯片供应商披露。
        - label: 中等可能性（转化）
          values:
            - text: 试点转付费延迟
              tone: medium
              note: 公开来源仍强调收入前或试点状态，而非经常性合同。
            - text: 政策驱动的展示风险
              tone: risk
              note: 市级集群部署可能先验证品牌，再验证独立客户 ROI。
            - text: 融资与牵引力错配
              tone: risk
              note: 相对于有限的公开运营证明，已融资资本规模异常庞大。
        - label: 高可能性
          notes:
            - Risks supported directly by current public evidence and therefore most relevant before the next financing.
          values:
            - text: 已验证部署缺口
              tone: high
              note: 截至 2026 年 10 月，DEPLOY 仍显示档案中没有已验证部署。
            - text: 演示转生产风险
              tone: high
              note: 公开报道强调演示和购买意向，而非已签署的生产合同。
            - text: 人形机器人商业论证负担
              tone: critical
              note: IFR 称，安全标准、训练和维护成本，以及薄弱的商业论证，仍在限制大规模采用。
        - label: 高可能性（近期）
          values:
            - text: 缺少具名合同
              tone: high
              note: RobotToday 称，TARS 尚未公布收入或客户名称。
            - text: 战略渠道依赖
              tone: high
              note: Meituan 和市级项目在公开材料中似乎重要性失衡。
            - text: A 轮证明负担
              tone: critical
              note: 下一轮融资可能在正常运行时间、利润率和部署指标公开之前到来。
    approximationNotes: 根据当前公开证据得出的定性热力图；单元格表示剩余风险，而非数值概率。
    claimRefs:
      - CR005
      - CR007
      - CR009
      - CR010
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 该推荐取决于定价不透明和商业化不确定性是否超过技术证明与融资深度带来的支撑。
    data:
      nodes:
        - id: proof
          label: 技术证明
          detail: WIYH 数据集规模和灵巧操作证据支撑一个真实的技术故事。
        - id: capital
          label: 融资深度
          detail: 三轮融资合计约 $697M，显示投资者获取能力很强。
        - id: demand
          label: 早期需求信号
          detail: 公开证据提到购买意向，而非已披露的合同收入。
        - id: opacity
          label: 缺少轮次条款
          detail: 没有留存来源披露投后估值、清算优先权或稀释。
        - id: comps
          label: 昂贵且波动的可比公司
          detail: 私营可比公司估值昂贵，上市可比公司仍显示亏损或估值回撤。
        - id: call
          label: 继续研究
          detail: 保持关注，但只有在条款清单和客户证明得到核实后才评估投资价值。
      edges:
        - from: proof
          to: capital
          label: 支撑兴趣
        - from: capital
          to: demand
          label: 延长资金续航
        - from: demand
          to: opacity
          label: 仍不完整
        - from: opacity
          to: comps
          label: 迫使价格自律
        - from: comps
          to: call
          label: 确定当前判断
    approximationNotes: 该图是逻辑序列，不是量化加权模型。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
