      - number: '3.2'
        title: 能力、定价与买方权衡
        blocks:
          - type: paragraph
            body: >-
              留存资料支持技术差异化叙事，却还不能支撑采购判断。公司及后续报道把 TARS 描述为结合 AWE 3.0、SenseHub 和 21-DoF DexHand 平台的全栈具身 AI 供应商，OriginOfBots
              与 Robozaps 则把 TARS 放在工业人形机器人价格带，而非低价消费层。买方的问题在于 透明度：OriginOfBots 只有估算的 $95,000
              价格，不是官方价目表，留存资料也没有合同结构、维护条款或具名客户。相比之下， Robozaps 显示若干竞争对手已经公布至少一个目标价或起售价，因此即便实际企业价格仍不确定，客户也更容易对标。
