              - CV013
      - number: '8.3'
        title: 情景框架、下行触发因素与最终要求
        blocks:
          - type: paragraph
            body: >-
              TARS 的可支持情景框架必须保持条件性，因为关键投资变量没有公开证据。乐观情景要求当前客户转化、相对于上市和私募同业仍留有空间的披露估值， 以及 TARS
              数据集和灵巧操作优势正在转化为可重复工业部署的证明。基准情景是假设公司仍具战略吸引力但尚不能定价，因为公开证据仍显示购买意向、
              技术里程碑和融资深度，而非签约收入和单位经济。悲观情景很直接：如果下一轮定价在收入披露前、且缺乏清晰条款透明度时靠近头部私人人形机器人
              基准，那么一旦公开市场倍数压缩或商业化延迟，可能出现下轮融资风险。最终尽调应聚焦轮次条款、签约客户经济、毛利率走势和每次部署的资本需求， 而不是更多泛化的产品演示。
            claimRefs:
