      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，TARS 目前是一家资金充足、但仍难以进行投资承保判断的机器人公司。公开证据足以说明其阶段性融资能力异常强、商业兴趣
              确实存在，却不足以有把握地评估收入质量、毛利率路径、现金转化或下一轮依赖。因此投资判断必须转向私下尽调：审阅管理层报表、客户合同、 投后估值、毛利桥接和当前现金
              runway，之后才能比“持续观察并核实”更坚定地判断估值。
