            body: >-
              对一家 Pre-A 机器人公司而言，公开技术栈异常具体。第三方规格汇总都指向由 RGBD 视觉、惯性传感、触觉/力传感、工业网络和 Linux/ROS 式控制构成的感知控制层；2026 年发布报道又加入
              DexHand、AWE 3.0 和 SenseHub 这一命名明确的操作与学习栈。综合来看，TARS 卖的并不是单个机器人外壳，而是一条垂直整合的具身 AI
              流程：采集人体运动数据，用专有基础模型训练并控制，再在面向柔性制造的 灵巧硬件上执行。这种架构把数据采集、模型训练和机械臂设计绑在一起，方向上很强，但公开记录仍缺少基准方法、延迟披露和安全论证文件。
