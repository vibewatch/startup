        title: 展示项
        blocks:
          - type: callout
            title: 就披露阶段而言，融资规模远超常态
            body: 很少有 2025 年成立的机器人初创公司能在约一年内公开展示近 $700M 的披露融资，这显著增强了 TARS 招募人才、在收入披露前持续投入的能力。
            calloutType: strength
            claimRefs:
              - CO004
              - CO006
              - CO010
          - type: callout
            title: 商业验证落后于资本故事
            body: 公开来源仍未披露具名客户、收入、员工人数或投后估值，因此尽调不应把融资规模等同于商业验证。
            calloutType: risk
            claimRefs:
              - CO014
              - CO015
              - CO016
          - type: callout
            title: 从原始文件核实融资叙事
            body: 二手报道对轮次规模和投资人广度大体一致，但对确切领投阵容并不一致，因此股权结构表和治理安排应成为早期尽调重点。
            calloutType: insight
