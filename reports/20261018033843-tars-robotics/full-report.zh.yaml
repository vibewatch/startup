  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - TARS 将技术领先转化为已披露的付费部署，公布可信的收入和利润率证据，并以低于最热门私有人形机器人估值的价格进行下一轮融资。
        - 上行空间来自缩小当前信息不透明与 Apptronik 等规模化私有可比公司已获估值标准之间的差距。
        - 制造、部署可靠性和定价纪律必须同时达标。
        - 只有在尽调中出现已签客户经济性和清晰的条款清单披露时，这一情景才合理。
      - - 基准
        - TARS 继续吸引资本和技术关注，但公开证据仍局限于融资、演示和早期需求信号。
        - 无法精确评估回报潜力，因此理性做法是跟踪公司，只根据经验证的运营证据谈判。
        - 投资者可能为品类热度买单，而不是为公司特定证明买单。
        - 最符合今天的证据集。
      - - 看跌
        - 公司在披露收入、利润率或优先权稀释之前，寻求接近头部私营人形机器人可比公司的估值。
        - 入场价可能同时跑赢公开市场可比公司的倍数和实际商业化速度，因此下行风险上升。
        - 倍数收缩、意向转收入的速度放缓，以及资本密集度，都可能迫使估值日后重置。
        - 若尽调确认价格上涨却没有相应的商业化证明，则触发。
      - - 否决 / 尽调失败
        - 轮次条款仍不透明，客户经济性也无法核实。
        - 不存在可支撑的投资判断模型，因此该轮决策应从观察名单转为放弃。
        - 未知的稀释、优先权级别和烧钱速度，可能压过所有技术上行空间。
        - 若管理层不愿在 NDA 下披露估值机制，则触发。
    notes: 区间为定性判断，因为留存的公开证据没有披露 TARS 当前的投后估值或清算结构。
    claimRefs:
      - CV003
      - CV005
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
