      - number: '3.3'
        title: 持久性、进入者压力与反向核查
        blocks:
          - type: paragraph
            body: >-
              指定证据中最强的风险是 TARS 尚未把技术演示转化为持久商业护城河。SlashGear 明确指出，刺绣演示依赖一段公开视频、没有完整
              录制，也没有公开公司网站承载验证材料包，这削弱了对旗舰能力主张的独立核验。同时，上海正在有意做深本地产业集群：Pudong 目标是在 2027 年形成 100 家龙头企业、100 个应用场景和 100
              个全球有竞争力的产品。因此，地理位置和政策支持是产业集群 的共享资产，而非 TARS 的专属护城河。悬而未决的问题是，在资金更充足的同业和平台型进入者压缩差异化前，TARS 能否把早期兴趣 转化为可披露客户。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP015
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 演示能力领先于商业验证
            body: 留存资料支持 TARS 是技术野心很大的全栈人形机器人项目，但尚不足以支持持久客户护城河。最清晰的公开反向证据质疑演示的可验证性， 最清晰的商业证据也只是购买意向，而非具名合同。
            calloutType: risk
            claimRefs:
              - CP011
              - CP014
              - CP015
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现入口可见，收入披露不可见
        blocks:
          - type: paragraph
            body: >-
              公开来源清楚展示了 TARS 的产品入口：工业及通用人形机器人、具身 AI 模型，以及相关感知和操作工具。但留存证据没有说明这些入口
              如何转化为确认收入、软件是否独立于硬件收费，或合同如何安排。这一区分很重要：集成密集型机器人 OEM 的经济模型，可能与高毛利平台 供应商完全不同。公开定价也很有限：OriginOfBots 称 TARS
              尚未公布 A 系列或 T 系列人形机器人的价格，另一页面只有第三方对 TARS 人形机器人的估算价。结果是产品目录清晰，变现栈却不透明。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI009
