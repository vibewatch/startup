figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest-residual-risk cells cluster around commercialization proof,
      sector economics, and dependence on a small set of strategic channels.
    data:
      columns:
        - label: Moderate impact
        - label: High impact
        - label: Very high impact
      rows:
        - label: Lower likelihood
          notes:
            - Risks that are not yet evidenced as active failures but would
              become important if customer rollouts broaden quickly.
          values:
            - text: Incident disclosure gap
              tone: warning
              note: DEPLOY shows no active incidents on file, but no public warranty or recall dataset is disclosed.
            - text: IP or FTO diligence gap
              tone: warning
              note: Public sources reviewed do not include patent schedules or freedom-to-operate analysis.
            - text: Acute regulatory setback
              tone: warning
              note: Impact would rise if export or safety rules tighten before TARS discloses its compliance stack.
        - label: Lower likelihood (watchlist)
          values:
            - text: Procurement-cycle slippage
              tone: neutral
              note: Industrial buyers may extend validation cycles even after a strong demo.
            - text: Warranty reserve surprise
              tone: warning
              note: No public service-cost or replacement-rate data is disclosed in the assigned pool.
            - text: Cross-border compliance review
              tone: warning
              note: Overseas customer interest will still require documented supplier and export-control diligence.
        - label: Medium likelihood
          values:
            - text: Partner concentration
              tone: medium
              note: Meituan and municipal programs appear strategically important in public materials.
            - text: Valuation opacity
              tone: risk
              note: Public sources conflict on whether the April 2026 post-money valuation was disclosed.
            - text: Export-control or supplier exposure
              tone: risk
              note: No public BOM or chip-supplier disclosure is available in the assigned evidence.
        - label: Medium likelihood (conversion)
          values:
            - text: Pilot-to-paid delay
              tone: medium
              note: Public sources still emphasize pre-revenue or pilot status rather than recurring contracts.
            - text: Policy-led showcase risk
              tone: risk
              note: Municipal cluster deployments could validate branding before they validate independent customer ROI.
            - text: Financing-to-traction mismatch
              tone: risk
              note: Capital raised is unusually large relative to the limited public operating proof.
        - label: High likelihood
          notes:
            - Risks supported directly by current public evidence and therefore
              most relevant before the next financing.
          values:
            - text: Verified deployment gap
              tone: high
              note: DEPLOY still shows no verified deployments on file as of October 2026.
            - text: Demo-to-production conversion risk
              tone: high
              note: Public coverage highlights demos and purchase intentions rather than signed production contracts.
            - text: Humanoid business-case burden
              tone: critical
              note: IFR says safety standards, training and maintenance cost, and weak business cases still limit widespread adoption.
        - label: High likelihood (near-term)
          values:
            - text: Missing named contracts
              tone: high
              note: RobotToday says TARS had not yet announced revenue or customer names.
            - text: Strategic-channel dependence
              tone: high
              note: Meituan and municipal programs appear disproportionately important in public materials.
            - text: Series A proof burden
              tone: critical
              note: The next round could arrive before uptime, margin, and deployment metrics are public.
    approximationNotes: >-
      Qualitative heatmap derived from current public evidence; cells indicate
      residual risk, not numeric probability.
    claimRefs: [CR005, CR007, CR009, CR010, CR013, CR015, CR016]
callouts:
  - calloutType: risk
    title: Kill criteria before the next round
    body: >-
      Treat the thesis as broken for new-money participation if TARS reaches its
      next financing without at least one named production deployment, a
      reconciled cap table and post-money valuation, and a diligence package
      covering customer-site safety, incident handling, and export-sensitive
      components.
    claimRefs: [CR004, CR005, CR006, CR015, CR016]
  - calloutType: insight
    title: The mitigation path is operational, not narrative
    body: >-
      Another dexterity demo can support the story, but the real de-riskers are
      signed contracts, deployment uptime and scrap data, disclosed service or
      margin economics, and a supplier/compliance review that stands up to
      industrial procurement.
    claimRefs: [CR006, CR007, CR008, CR011, CR016]
