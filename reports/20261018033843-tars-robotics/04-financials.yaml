  evidenceGaps:
    - type: missing-source
      severity: material
      topic: revenue-model
      missingEvidence: Management-level breakout of revenue streams, contract structure, revenue-recognition policy, and backlog by robot family or software component.
      whyItMatters: Without revenue mix and recognition rules, it is not possible to judge whether TARS resembles a hardware vendor, a software platform, or a services-heavy integrator.
      diligencePath: Request booking, revenue, and backlog schedules tied to signed customer contracts and deployment milestones.
      relatedQuestionRefs: [QI001]
      relatedTableRefs: [TI001]
    - type: private-evidence-only
      severity: material
      topic: runway
      missingEvidence: Current cash balance, monthly burn, hiring plan, and management runway case through the next financing trigger.
      whyItMatters: Capital adequacy cannot be underwritten from total capital raised alone because proceeds use, burn, and cash conversion remain undisclosed.
      diligencePath: Review monthly management accounts, board materials, and treasury schedules covering cash, burn, and scenario runway.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: margin-path
      missingEvidence: Gross-margin bridge, bill of materials, field-service burden, warranty assumptions, and utilization assumptions for early deployments.
      whyItMatters: Humanoid robotics economics can deteriorate quickly if deployments require high service intensity or expensive component stacks.
      diligencePath: Request unit-level contribution margin analysis for pilot and production configurations, including service and support costs.
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: pricing-realization
      missingEvidence: Realized ASPs, discounting practice, lease-versus-sale mix, and any named paying customer references.
      whyItMatters: A third-party estimated robot price is not sufficient to judge whether commercial demand supports the implied cost base or valuation narrative.
      diligencePath: Review signed quotes, purchase orders, and pilot conversion data by geography and customer segment.
      relatedQuestionRefs: [QI003, QI006]
      relatedTableRefs: [TI002, TI003]
