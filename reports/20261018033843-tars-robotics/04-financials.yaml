      - [Embodied AI / model stack, "AWE / AI World Engine, SenseHub, and related data assets improve robot capability", "Technology is public; standalone monetization is undisclosed", "Could support software-like economics, but no attach rate or license evidence is retained", "Disclose whether models and data are licensed separately, bundled into robots, or used only internally"]
      - [Pilot and integration work, "Purchase intentions and manufacturing demonstrations imply implementation work around deployments", "Demand signal exists; contract economics are undisclosed", "Services may aid adoption but can compress margin if customization is heavy", "Disclose pilot-to-production conversion, implementation scope, and service labor content"]
    notes: "Rows distinguish public product evidence from undisclosed monetization; unknown means no retained source disclosed revenue realization."
    claimRefs: [CI004, CI007, CI009, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public price signal
      - Disclosure quality
      - Source basis
    rows:
      - ["TARS humanoid robot", "USD 95,000 estimated", "Third-party estimate rather than company-published list price", "OriginOfBots robot page"]
      - ["A Series humanoid", "Not publicly priced", "OriginOfBots says prices have not been published", "OriginOfBots company page"]
      - ["T Series humanoid", "Not publicly priced", "OriginOfBots says prices have not been published", "OriginOfBots company page"]
      - ["Sector-level demand support", "Shanghai sales/leasing incentive up to 5% of contract value; compute vouchers up to 40 million yuan per year", "Policy support can change customer economics, but it is not company revenue", "Jiemian policy article"]
    notes: "The only numeric price retained is a third-party estimate; sector subsidies are included as market support rather than company pricing."
    claimRefs: [CI005, CI006, CI010]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Total capital raised", "$697M across 3 rounds since 2025", "Medium", "Establishes unusual financing capacity for a pre-scale robotics company", "Reconcile exact round dates, round names, and cap table across investor records"]
      - ["Latest round / use of funds", "$455M pre-A in April 2026; proceeds earmarked for model development and hiring", "Medium", "Shows runway could be extended, but also that compute and talent spend may stay elevated", "Provide current cash balance, monthly burn, and funded operating horizon"]
      - ["Commercial traction", "Purchase intentions reported at LogiMAT; no retained public source names paying contracts or recognized revenue", "Medium", "Signals interest but does not underwrite conversion, realized pricing, or backlog quality", "Provide signed contracts, ASPs, and pilot-to-deployment conversion"]
      - ["Prototype operating proxy", "About 3 hours of battery runtime and limited deployments noted in retained third-party coverage", "Low", "Runtime and deployment depth can shape utilization, service costs, and gross-margin path", "Provide duty-cycle data, uptime, service intervals, and customer support staffing"]
      - ["Core underwriting metrics", "Revenue, ARR, gross margin, burn, runway, customer count, and post-money valuation remain undisclosed in retained public sources", "Medium", "Without these figures, the financial verdict remains evidence-constrained", "Open the data room with historical P&L, cash flow, customer concentration, and current valuation materials"]
    notes: "This table mixes disclosed figures with explicitly undisclosed metrics; undisclosed values are diligence blockers, not zeroes."
    claimRefs: [CI001, CI002, CI003, CI007, CI008, CI009, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence shows how TARS moves from embodied-AI R&D into demos and early commercial interest, but the pricing-to-gross-profit handoff remains undisclosed.
    data:
      nodes:
        - id: data
          label: Human task data + SenseHub
          note: Publicly described data capture and sensing inputs improve embodied training but have no disclosed standalone revenue stream.
        - id: model
          label: AWE / embodied models
          note: Pre-A proceeds are earmarked partly for proprietary model development.
        - id: hardware
          label: A-series / T-series / TARS hardware
          note: Hardware platforms are public, while official list pricing remains largely undisclosed.
        - id: demos
          label: Precision manufacturing demos
          note: Public proof centers on wire-harness assembly, hand embroidery, and other dexterous manufacturing tasks.
        - id: interest
          label: Purchase intentions / pilots
          note: Gasgoo reports purchase intentions after the LogiMAT debut, but contract value and conversion are not disclosed.
        - id: revenue
          label: Recognized revenue / gross profit
          note: No retained public source discloses bookings, revenue, margin, or cash conversion.
      edges:
        - from: data
          to: model
          label: training data informs model capability
        - from: model
          to: hardware
          label: models are embedded in the robot platform
        - from: hardware
          to: demos
          label: demos evidence task capability
        - from: demos
          to: interest
          label: commercialization signal
        - from: interest
          to: revenue
          label: conversion economics remain undisclosed
    approximationNotes: null
    claimRefs: [CI004, CI007, CI009, CI012]
callouts:
  - calloutType: risk
    title: Funding is visible; revenue quality is not
    body: TARS has unusually strong fundraising for its age, but the retained public record still stops short of the metrics needed to underwrite gross margin, burn, runway, or customer concentration.
    claimRefs: [CI001, CI009, CI014]
