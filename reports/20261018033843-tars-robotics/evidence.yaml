evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: investor-lineup
    missingEvidence: >-
      Primary financing documents showing the definitive lead investors, board rights, and post-money valuation for the
      April 2026 Pre-A round.
    whyItMatters: >-
      The current public record conflicts on lead-investor attribution, which affects sponsorship quality, governance
      expectations, and valuation framing.
    diligencePath: >-
      Request the signed round announcement, cap table, and board-rights summary from management and reconcile them
      against secondary reporting.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: commercialization-metrics
    missingEvidence: Named customers, signed contract values, revenue or ARR, and pipeline conversion data.
    whyItMatters: >-
      Without commercial proof, the chapter can only validate capital access and technical signaling, not durable
      demand.
    diligencePath: >-
      Request customer references, signed order forms, current revenue dashboard extracts, and a cohort view of pilots
      versus paid deployments.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-depth
    missingEvidence: A full board list, observer rights, executive org chart, and current headcount by function.
    whyItMatters: >-
      Leadership pedigree is visible, but the company cannot yet be underwritten for governance maturity or managerial
      redundancy.
    diligencePath: Request the current board deck, cap table rights summary, executive roster, and a functional headcount breakdown.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: sam-som-gap
    missingEvidence: Named paying customers, unit deployment counts, and segment-level pipeline data for TARS's factory use cases.
    whyItMatters: >-
      Without real customer and deployment evidence, sector TAM can be described but TARS-specific SAM and SOM remain
      speculative.
    diligencePath: Request customer references, pilot conversion data, and a segmented commercial pipeline by workflow and geography.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Payback periods, labor-savings assumptions, integration costs, and uptime metrics for the precision-manufacturing
      workflows TARS highlights.
    whyItMatters: Buyer willingness to budget for a humanoid pilot depends on ROI, not just technical feasibility or demo quality.
    diligencePath: >-
      Review pilot business cases, plant-level ROI models, and post-installation operating metrics from reference
      deployments.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: conflicting-data
    severity: minor
    topic: capital-intensity
    missingEvidence: An authoritative financing chronology that resolves InforCapital's internal conflict on TARS's latest round.
    whyItMatters: >-
      Capital availability shapes commercialization runway and valuation framing, and conflicting public round history
      weakens confidence in adjacent market signals.
    diligencePath: >-
      Verify round dates and amounts from signed financing documents or lead-investor announcements before using the
      figures in valuation work.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: official-pricing
    missingEvidence: >-
      An official TARS pricing page, quote template, or contract example showing robot price, service terms, and
      maintenance structure.
    whyItMatters: >-
      Without company-published pricing or contract structure, it is hard to compare TARS against Unitree, AgiBot, or
      Apptronik on total cost of ownership or switching cost.
    diligencePath: >-
      Request a current quotation pack, maintenance SLA, and deployment pricing assumptions directly from TARS sales or
      from a procurement document.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named customers, signed contracts, pilot-to-production conversion data, or repeat deployment evidence.
    whyItMatters: >-
      Technical demos can support awareness, but durable advantage in industrial robotics depends on verified customer
      adoption, integration success, and renewal behavior.
    diligencePath: >-
      Request customer references, site-level deployment counts, and any signed backlog or annualized contract value
      disclosures.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: missing-source
    severity: minor
    topic: status-quo-alternatives
    missingEvidence: Buyer-side comparisons versus manual precision labor, fixed automation, and in-house robotics development.
    whyItMatters: >-
      The chapter can identify likely rival vendors and entrants, but it cannot quantify the real switching hurdle
      without status-quo cost and workflow benchmarks.
    diligencePath: >-
      Collect plant-automation ROI cases, labor-cost baselines, and any competitive bake-off documents from prospective
      buyers.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: revenue-model
    missingEvidence: >-
      Management-level breakout of revenue streams, contract structure, revenue-recognition policy, and backlog by robot
      family or software component.
    whyItMatters: >-
      Without revenue mix and recognition rules, it is not possible to judge whether TARS resembles a hardware vendor, a
      software platform, or a services-heavy integrator.
    diligencePath: Request booking, revenue, and backlog schedules tied to signed customer contracts and deployment milestones.
    relatedQuestionRefs:
      - QI001
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Current cash balance, monthly burn, hiring plan, and management runway case through the next financing trigger.
    whyItMatters: >-
      Capital adequacy cannot be underwritten from total capital raised alone because proceeds use, burn, and cash
      conversion remain undisclosed.
    diligencePath: >-
      Review monthly management accounts, board materials, and treasury schedules covering cash, burn, and scenario
      runway.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: margin-path
    missingEvidence: >-
      Gross-margin bridge, bill of materials, field-service burden, warranty assumptions, and utilization assumptions
      for early deployments.
    whyItMatters: >-
      Humanoid robotics economics can deteriorate quickly if deployments require high service intensity or expensive
      component stacks.
    diligencePath: >-
      Request unit-level contribution margin analysis for pilot and production configurations, including service and
      support costs.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing-realization
    missingEvidence: Realized ASPs, discounting practice, lease-versus-sale mix, and any named paying customer references.
    whyItMatters: >-
