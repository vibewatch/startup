company:
  name: "TARS Robotics"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Public customer evidence for TARS still sits near the top of the commercial funnel: conference attention,
    prototype directories, and one report of unnamed purchase intentions are visible, but no reviewed source names
    a production customer, contract, or renewal. The pattern supports interest in industrial automation use cases,
    not durable adoption or expansion.
sections:
  - id: "customer-segments"
    title: "Industrial automation is the intended buyer surface, but the public segment map is still broad"
    body: |-
      The reviewed sources consistently place TARS in industrial and precision-manufacturing automation rather than a
      consumer or general retail channel. Dealroom and InforCapital both describe the company as an embodied-intelligence
      or robotics startup for industrial applications, while OriginOfBots frames TARS around hand embroidery, wire harness
      assembly, and flexible manufacturing. That is enough to identify likely buyer groups—factory automation leaders,
      manufacturing engineering teams, and logistics operators—but not enough to separate buyer, end user, and budget
      owner with confidence. Public evidence also does not disclose whether TARS sells directly, through systems
      integrators, through pilot partnerships, or via distributor relationships.
    claimRefs: ["CU001", "CU002", "CU013"]
    tableRefs: ["TU001"]
  - id: "adoption-signals"
    title: "Public adoption signals are real, but they remain pre-production"
    body: |-
      The strongest external commercial signal is Gasgoo's report that TARS' LogiMAT debut generated purchase intentions
      from clients across multiple industries and European countries. Separately, RobotToday says the ICRA 2026 DexHand
      launch attracted interest from industry leaders and academics. Those are useful signs that the company can attract
      evaluators and prospects, yet they fall short of proof of production deployment or revenue durability. ui44 still
      lists zero available records and no recorded numeric prices for the tracked A1 robot, and OriginOfBots shows no
      user reviews. Together, the evidence suggests a company moving from technical showcase toward commercial discovery,
      not one that has publicly demonstrated scaled field deployment.
    claimRefs: ["CU003", "CU004", "CU005", "CU006", "CU007", "CU008", "CU009", "CU012"]
    tableRefs: ["TU002", "TU003"]
    figureRefs: ["FU001"]
  - id: "durability-and-expansion"
    title: "Durability, expansion, and concentration remain the core diligence gaps"
    body: |-
      No reviewed source discloses a named production customer, contract length, renewal behavior, churn, NRR, GRR, or
      concentration by account or channel. That missing evidence matters more than the company's fundraising scale because
      customer durability is the bridge between impressive demos and an investable commercial engine. The absence of named
      accounts does not prove there are none, but it does mean external readers cannot verify whether TARS is winning
      pilots, converting them into production, or expanding within plants and logistics networks. Any investment case that
      depends on fast land-and-expand motion still needs direct management evidence rather than public-source inference.
    claimRefs: ["CU010", "CU011", "CU012"]
callouts:
  - calloutType: "risk"
    title: "Customer proof trails the capital narrative"
    body: >-
      TARS has unusually strong funding visibility for a pre-Series A robotics company, but public customer evidence still
      stops at prototypes, demos, and unnamed purchase intentions.
    claimRefs: ["CU002", "CU006", "CU012"]
  - calloutType: "recommendation"
    title: "Require named deployment and renewal evidence in diligence"
    body: >-
      Before underwriting commercial scale, request a customer list segmented by pilot versus production, contract size,
      renewal status, and share of revenue from the top five accounts.
    claimRefs: ["CU010", "CU011"]
