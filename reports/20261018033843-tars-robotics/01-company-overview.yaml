callouts:
  - calloutType: "strength"
    title: "Funding access is outsized for the disclosed stage"
    body: >-
      Few 2025-founded robotics startups publicly show nearly $700 million of disclosed
      financing within roughly one year, which materially strengthens TARS's ability to
      recruit talent and keep investing ahead of revenue disclosure.
    claimRefs: ["CO004", "CO006", "CO010"]
  - calloutType: "risk"
    title: "Commercial proof lags the capital story"
    body: >-
      Public sources still do not disclose named customers, revenue, headcount, or
      post-money valuation, so diligence should not equate fundraising scale with
      commercial validation.
    claimRefs: ["CO014", "CO015", "CO016"]
  - calloutType: "insight"
    title: "Verify the financing narrative from primary documents"
    body: >-
      Secondary coverage is directionally aligned on round size and investor breadth but
      not on the exact lead-investor lineup, making the cap table and governance package
      an early diligence priority.
    claimRefs: ["CO007", "CO008", "CO009"]
