companyProfile:
  summary: >-
    TARS Robotics is a Shanghai-based embodied-AI startup founded in 2025 that builds general-purpose humanoid and
    wheeled industrial robots alongside its AWE 3.0 model stack, DexHand manipulation hardware, and SenseHub
