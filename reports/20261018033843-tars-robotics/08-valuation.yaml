          detail: "WIYH dataset scale and dexterous-manipulation evidence support a real technical story."
        - id: capital
          label: "Funding depth"
          detail: "Roughly $697M raised across three rounds suggests strong investor access."
        - id: demand
          label: "Early demand signal"
          detail: "Public evidence cites purchase intentions, not disclosed contracted revenue."
        - id: opacity
          label: "Missing round terms"
          detail: "No retained source discloses post-money valuation, liquidation preferences, or dilution."
        - id: comps
          label: "Costly, volatile comparables"
          detail: "Private comps are expensive and listed comps still show losses or valuation drawdowns."
        - id: call
          label: "Research-more"
          detail: "Stay engaged, but underwrite only after term-sheet and customer proof are verified."
      edges:
        - from: proof
          to: capital
          label: "supports interest"
        - from: capital
          to: demand
          label: "extends runway"
        - from: demand
          to: opacity
          label: "still incomplete"
        - from: opacity
          to: comps
          label: "forces price discipline"
        - from: comps
          to: call
          label: "sets current call"
    approximationNotes: "This figure is a logical sequence, not a quantified weighting model."
    claimRefs: [CV001, CV002, CV005, CV009, CV010, CV011, CV012, CV014]
callouts:
  - calloutType: recommendation
    title: "Public evidence supports waiting for price, not walking away from the company"
    body: "TARS has enough technical and financing evidence to stay on the diligence list, but not enough public valuation and commercialization evidence to justify immediate conviction on entry price."
    claimRefs: [CV001, CV002, CV003, CV005, CV011, CV012]
  - calloutType: risk
    title: "Unknown term-sheet economics are the gating risk"
    body: "Without a disclosed post-money valuation, ownership dilution path, or liquidation preference stack, even strong category comps cannot tell an investor whether the current round offers acceptable downside protection."
    claimRefs: [CV003, CV009, CV010, CV011, CV014]
