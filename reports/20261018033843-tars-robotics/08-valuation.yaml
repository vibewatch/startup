    claimRefs: [CV002, CV003, CV005, CV011, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - argument
      - evidence
      - what would change the view
    rows:
      - ["Technical proof is real", "WIYH publishes large multimodal dataset statistics and third-party profiles describe dexterous industrial manipulation progress.", "Show repeatable customer ROI and deployment uptime, not only demonstrations."]
      - ["Financing depth is exceptional for stage", "Third-party sources converge on roughly $697M raised across three rounds, including a $455M Pre-A in April 2026.", "Disclose post-money valuation, liquidation preferences, and ownership dilution from the latest round."]
      - ["Commercial proof is still thin", "Gasgoo reports purchase intentions at LogiMAT, but retained public sources do not disclose signed customer contracts or revenue.", "Provide named customers, annualized revenue, and conversion from pilot or intention to paid deployment."]
      - ["Comparable appetite is strong but expensive", "TechCrunch reports Apptronik at about a $5.3B post-money valuation after $935M raised; Yahoo shows UBTECH trading on 12.40x sales while loss-making.", "A clearly lower entry multiple or verified faster commercialization would improve risk-adjusted upside."]
      - ["Public-market downside remains real", "CompaniesMarketCap shows Symbotic's market cap at $23.46B in October 2026, down 31.73% from 2025 despite category leadership.", "Stabilizing listed-comp multiples and TARS-specific revenue disclosure would reduce compression risk."]
    notes: "The table separates evidence that supports continued diligence from evidence that keeps the valuation call conditional rather than precise."
    claimRefs: [CV001, CV002, CV003, CV005, CV007, CV008, CV009, CV010, CV011, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - assumptions
      - valuation/return logic
      - key risks
      - probability signal
    rows:
      - ["Bull", "TARS converts technical lead into disclosed paid deployments, publishes credible revenue and margin evidence, and prices the next round below the hottest private humanoid marks.", "Upside comes from closing the gap between current opacity and the valuation standards already awarded to scaled private peers such as Apptronik.", "Execution on manufacturing, deployment reliability, and pricing discipline must all hold simultaneously.", "Only plausible if signed customer economics and clean term-sheet disclosure appear in diligence."]
      - ["Base", "TARS continues to attract capital and technical attention, but public evidence remains limited to financing, demos, and early demand signals.", "Return potential cannot be underwritten precisely, so the rational position is to track the company and negotiate only against verified operating evidence.", "Investors risk paying for category heat instead of company-specific proof.", "Best matches today's evidence set."]
      - ["Bear", "The company seeks a valuation close to top private humanoid comparables before disclosing revenue, margins, or preference overhang.", "Downside rises because entry price could outrun both public-comp multiples and actual commercialization speed.", "Multiple compression, slower conversion from intent to revenue, and capital intensity can force a later reset.", "Triggered if diligence confirms price escalation without matching commercial proof."]
      - ["No-go / diligence fail", "Round terms remain opaque and customer economics cannot be verified.", "No supportable underwriting model exists, so the decision should move from watchlist to pass for the round.", "Unknown dilution, preference seniority, and burn can dominate any technology upside.", "Triggered if management will not disclose valuation mechanics under NDA."]
    notes: "Ranges are qualitative because retained public evidence does not disclose TARS's current post-money valuation or liquidation structure."
    claimRefs: [CV003, CV005, CV009, CV010, CV012, CV013, CV014]
