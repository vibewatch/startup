callouts:
  - calloutType: strength
    title: Manufacturing-first dexterity thesis is coherent
    body: >-
      The public story is unusually consistent: TARS keeps returning to hard
      precision-manufacturing tasks, and the named stack—DexHand, AWE 3.0,
      SenseHub, and the WIYH dataset—fits that thesis instead of reading like a
      generic humanoid pitch.
    claimRefs:
      - CE005
      - CE007
      - CE008
      - CE009
      - CE011
  - calloutType: risk
    title: Deployment proof trails the demo narrative
    body: >-
      The most visible evidence still comes from prototype/spec directories,
      conference demos, and company-echoed launch coverage, so diligence still
      needs field reliability, customer rollout, safety validation, and control
      documentation before underwriting scaled industrial adoption.
    claimRefs:
      - CE002
      - CE012
      - CE013
