figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a vertically integrated stack from human-data capture
      through embodied-model control into dexterous hardware and manufacturing workflows.
    data:
      layers:
        - label: Applications
          detail: Manufacturing automation and industrial logistics are the explicit public target workloads.
          outputs:
            - Wire harness assembly
            - Two-hand stitching
            - Multi-step packing
        - label: Robot platforms
          detail: Public coverage points to both wheeled and bipedal product families.
          modules:
            - A-series wheeled industrial robots
            - T-series bipedal general-purpose robots
        - label: Manipulation hardware
          detail: DexHand is the named dexterous end-effector for fine-motor work.
          modules:
            - 21-DOF hand architecture
            - Human-hand-modeled thumb and joint structure
          outputs:
            - Sign-language and mirror-control demos
        - label: Perception and control
          detail: Public specs cite multimodal sensing plus industrial networking and control software.
          modules:
            - RGBD stereoscopic cameras
            - IMU, gyroscope, tactile and force sensing
            - 5G-A, Ethernet, Wi-Fi, Linux / ROS-style control
        - label: Embodied model layer
          detail: AWE 3.0 is the named model layer for tactile-aware manipulation.
          outputs:
            - Texture / hardness / slip interpretation
            - Live error correction in manipulation demos
        - label: Data and training
          detail: SenseHub and WIYH imply a human-data-centric training loop rather than simulation alone.
          outputs:
            - Human motion capture and mapping
            - VLTA dataset for embodied training
    approximationNotes: >-
      This map reflects public descriptions of layers and interfaces, not a fully
      disclosed production architecture or software bill of materials.
