    - Unknown / no public order form in retained evidence
    - Unknown service, maintenance, and realized pricing terms
    - Harder for buyers to benchmark total cost or switching economics
  - - Unitree
    - R1 $4,900; G1 $13,500; H1 contact for pricing
    - Available or pre-order depending on model
    - Mix of posted price and quote-only packaging
    - Sets a low-cost comparison anchor that TARS does not yet match publicly
  - - AgiBot X1
    - <$20,000
    - Available
    - Entry pricing visible; enterprise package unknown
    - Improves procurement comparability for a buyer screening Chinese options
  - - Figure 03
    - ~$20,000 target
    - Announced
    - Target price only; realized contract terms unknown
    - Shows willingness to publish a reference price even before scale
  - - Apptronik Apollo
    - <$50,000 target
    - Pre-order
    - Target price paired with scale-up narrative, not final contract structure
    - Creates a more benchmarkable story for industrial buyers than TARS currently offers
  notes: Robozaps states that only Unitree R1 and G1 prices are verified from official sources; other sector prices are announcements, targets, or estimates. TARS pricing is an external estimate from OriginOfBots, not company-published list pricing.
