  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named customers, signed contracts, pilot-to-production conversion data, or repeat deployment evidence.
    whyItMatters: Technical demos can support awareness, but durable advantage in industrial robotics depends on verified customer adoption, integration success, and renewal behavior.
    diligencePath: Request customer references, site-level deployment counts, and any signed backlog or annualized contract value disclosures.
