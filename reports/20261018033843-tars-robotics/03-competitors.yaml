company:
  name: TARS Robotics
chapter:
  number: 3
  title: Competitors
  summary: TARS sits in a humanoid-robotics field where capital scale and commercialization transparency matter as much as demo quality. Relative to Figure, Apptronik, Unitree, and AgiBot, TARS is unusually well funded for a 2025-founded company and claims a differentiated full-stack stack, but the retained evidence still shows estimated pricing, purchase-intent anecdotes, and limited named-customer proof.
sections:
- id: competitive-perimeter
  title: Competitive perimeter and benchmark set
  body: The relevant benchmark set is broader than other pre-Series A humanoid startups. Humanoids Daily describes the sector as a multi-billion-dollar capital race led by Figure at a confirmed $39 billion valuation, with Apptronik, Unitree, and AgiBot already operating at multi-billion-dollar valuation or IPO ambition. That matters because TARS is not competing only on demo novelty; it is competing against firms with larger war chests, stronger distribution partners, or both. TARS is still unusually well funded for a company founded in 2025, with RobotHub and InforCapital both listing $697 million raised across three disclosed rounds, but its capital position still sits below the top global leaders rather than above them.
