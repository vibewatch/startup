  figureRefs:
  - FP001
- id: capability-pricing-and-buyer-tradeoffs
  title: Capability, pricing, and buyer tradeoffs
  body: 'The retained pool supports a technical-differentiation story, but not yet a procurement-proof story. Company and follow-on coverage describe TARS as a full-stack embodied-AI vendor combining AWE 3.0, SenseHub, and the 21-DoF DexHand platform, while OriginOfBots and Robozaps place TARS inside the industrial humanoid price band rather than the low-cost consumer tier. The problem for buyers is transparency: OriginOfBots gives only an estimated $95,000 price, not an official list price, and the retained pool does not provide contract structure, maintenance terms, or public named customers. By contrast, Robozaps shows that several rivals already publish at least target or entry pricing, which makes them easier for customers to benchmark even when realized enterprise pricing remains uncertain.'
  claimRefs:
  - CP007
  - CP008
  - CP009
  - CP013
  - CP014
  tableRefs:
  - TP002
  - TP003
- id: durability-and-adverse-checks
  title: Durability, entrant pressure, and adverse checks
  body: 'The strongest risk in the assigned evidence is that TARS has not yet turned technical demonstrations into a durable commercial moat. SlashGear explicitly notes that the embroidery showcase relied on a single public video, lacked a complete recording, and did not have a public corporate site hosting the proof package, which weakens independent verification of a flagship capability claim. At the same time, Shanghai is deliberately deepening the local cluster: Pudong says the city wants 100 leading enterprises, 100 application scenarios, and 100 globally competitive products by 2027. That combination means geography and policy support are shared assets across the cluster, not a proprietary moat for TARS. The open question is whether TARS can convert early interest into disclosed customers before better-capitalized peers and platform entrants compress differentiation.'
  claimRefs:
  - CP010
  - CP011
  - CP012
  - CP015
