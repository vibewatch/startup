  - type: missing-source
    severity: material
    topic: official-pricing
    missingEvidence: An official TARS pricing page, quote template, or contract example showing robot price, service terms, and maintenance structure.
    whyItMatters: Without company-published pricing or contract structure, it is hard to compare TARS against Unitree, AgiBot, or Apptronik on total cost of ownership or switching cost.
    diligencePath: Request a current quotation pack, maintenance SLA, and deployment pricing assumptions directly from TARS sales or from a procurement document.
