- id: TP002
  title: Feature / capability matrix
  columns:
  - Buying criterion
  - TARS
  - China leaders (Unitree / AgiBot)
  - Western leaders (Figure / Apptronik)
  - Implication
  rows:
  - - Capital available for scale
    - $697M disclosed since founding
    - Multi-billion IPO or valuation ambitions already public
    - Multi-billion confirmed valuations and larger war chests
    - TARS is well funded for its age but not yet in the top capital tier
  - - Technical stack story
    - Full-stack AWE 3.0 + SenseHub + DexHand narrative
    - Hardware-first (Unitree) versus AI-first (AgiBot) specialization
    - Integrated AI, hardware, and strategic-partner ecosystems
    - TARS differentiates on technical density, but peers also have coherent strategic narratives
  - - Public commercialization signal
    - Gasgoo cites purchase intentions at LogiMAT; no named contracts in retained evidence
    - Public availability or IPO-readiness rhetoric appears ahead of detailed customer disclosure
    - Pre-order programs and named manufacturing/logistics partners are public
    - TARS has interest signals, but weaker proof of repeat deployment
  - - Adverse verification risk
    - SlashGear flags a single public embroidery video and no full recording
    - Unknown in retained evidence
    - Sector-wide valuations are still ahead of public revenue disclosure
    - Demo quality should not be treated as durable moat without customer proof
  notes: Cells are limited to retained evidence. Where rivals lack audited revenue, realized pricing, or customer depth in the assigned pool, the matrix preserves that ambiguity instead of inferring parity.
