  - type: missing-source
    severity: minor
    topic: status-quo-alternatives
    missingEvidence: Buyer-side comparisons versus manual precision labor, fixed automation, and in-house robotics development.
    whyItMatters: The chapter can identify likely rival vendors and entrants, but it cannot quantify the real switching hurdle without status-quo cost and workflow benchmarks.
    diligencePath: Collect plant-automation ROI cases, labor-cost baselines, and any competitive bake-off documents from prospective buyers.
