  - - Figure AI
    - Global capital leader / direct benchmark
    - $39B confirmed valuation after $1B+ Series C
    - General-purpose humanoids with logistics and delivery ambitions
    - Largest private war chest and blue-chip strategic backers
    - Private company disclosures still leave realized deployment economics unclear
  - - Unitree Robotics
    - China hardware-first peer
    - Up to $7B targeted IPO; claims profitability since 2020
    - Consumer-to-commercial humanoids
    - Low-cost hardware and mass-market posture
    - Targeted IPO valuation and profitability are not audited in retained evidence
  - - AgiBot (Zhiyuan Robotics)
    - China AI-first peer
    - Up to $6.4B targeted IPO valuation
    - General-purpose humanoids
    - AI-first positioning with major domestic backers
    - Public enterprise pricing and customer detail remain limited
  - - Apptronik
    - Western industrial peer
    - $5.47B confirmed valuation in 2025
    - Manufacturing and logistics
    - Apollo scale-up via Jabil manufacturing and Mercedes-Benz relationship
    - Pre-order status means commercial maturity is still developing
  - - Tesla / Samsung-style platform entrants
    - Likely entrant / internal-build benchmark
    - Backed by trillion- or hundred-billion-dollar balance-sheet war chests
    - Internal factory deployment first, then wider platform leverage
    - Vertical integration and ability to self-fund R&D
    - Not a pure-play comparable, but still a credible displacement threat
  notes: Valuation and funding figures mix confirmed rounds, public-market benchmarks, and targeted IPO valuations from retained sector analysis; they indicate competitive scale, not like-for-like enterprise value multiples.
