  title: Demo strength is ahead of commercial proof
  body: The retained pool supports TARS as a technically ambitious full-stack humanoid program, but it does not yet support a durable customer moat. The clearest public adverse evidence questions demo verifiability, while the clearest public commercial evidence is only purchase intent rather than named contracts.
