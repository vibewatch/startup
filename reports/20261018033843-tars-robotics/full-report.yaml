  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how TARS moves from embodied-AI R&D into demos and early commercial interest, but the
      pricing-to-gross-profit handoff remains undisclosed.
    data:
      nodes:
        - id: data
          label: Human task data + SenseHub
          note: >-
            Publicly described data capture and sensing inputs improve embodied training but have no disclosed
            standalone revenue stream.
        - id: model
          label: AWE / embodied models
          note: Pre-A proceeds are earmarked partly for proprietary model development.
        - id: hardware
          label: A-series / T-series / TARS hardware
          note: Hardware platforms are public, while official list pricing remains largely undisclosed.
        - id: demos
          label: Precision manufacturing demos
          note: Public proof centers on wire-harness assembly, hand embroidery, and other dexterous manufacturing tasks.
        - id: interest
          label: Purchase intentions / pilots
          note: >-
            Gasgoo reports purchase intentions after the LogiMAT debut, but contract value and conversion are not
            disclosed.
        - id: revenue
          label: Recognized revenue / gross profit
          note: No retained public source discloses bookings, revenue, margin, or cash conversion.
      edges:
        - from: data
          to: model
          label: training data informs model capability
        - from: model
          to: hardware
          label: models are embedded in the robot platform
        - from: hardware
          to: demos
          label: demos evidence task capability
        - from: demos
          to: interest
          label: commercialization signal
        - from: interest
          to: revenue
          label: conversion economics remain undisclosed
    approximationNotes: null
    claimRefs:
      - CI004
      - CI007
      - CI009
      - CI012
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a vertically integrated stack from human-data capture through embodied-model control
      into dexterous hardware and manufacturing workflows.
    data:
      layers:
        - label: Applications
          detail: Manufacturing automation and industrial logistics are the explicit public target workloads.
          outputs:
            - Wire harness assembly
            - Two-hand stitching
            - Multi-step packing
        - label: Robot platforms
          detail: Public coverage points to both wheeled and bipedal product families.
          modules:
            - A-series wheeled industrial robots
            - T-series bipedal general-purpose robots
        - label: Manipulation hardware
          detail: DexHand is the named dexterous end-effector for fine-motor work.
          modules:
            - 21-DOF hand architecture
            - Human-hand-modeled thumb and joint structure
          outputs:
            - Sign-language and mirror-control demos
        - label: Perception and control
          detail: Public specs cite multimodal sensing plus industrial networking and control software.
          modules:
            - RGBD stereoscopic cameras
            - IMU, gyroscope, tactile and force sensing
            - 5G-A, Ethernet, Wi-Fi, Linux / ROS-style control
        - label: Embodied model layer
          detail: AWE 3.0 is the named model layer for tactile-aware manipulation.
          outputs:
            - Texture / hardness / slip interpretation
            - Live error correction in manipulation demos
        - label: Data and training
          detail: SenseHub and WIYH imply a human-data-centric training loop rather than simulation alone.
          outputs:
            - Human motion capture and mapping
            - VLTA dataset for embodied training
    approximationNotes: >-
      This map reflects public descriptions of layers and interfaces, not a fully disclosed production architecture or
      software bill of materials.
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
