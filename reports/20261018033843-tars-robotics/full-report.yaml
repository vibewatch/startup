        title: Exhibits
        blocks:
          - type: callout
            title: Funding access is outsized for the disclosed stage
            body: >-
              Few 2025-founded robotics startups publicly show nearly $700 million of disclosed financing within roughly
              one year, which materially strengthens TARS's ability to recruit talent and keep investing ahead of
              revenue disclosure.
