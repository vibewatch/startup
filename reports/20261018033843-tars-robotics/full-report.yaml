      - number: '2.3'
        title: Early buyers are likely plant automation teams and research organizations
        blocks:
          - type: paragraph
            body: >-
              The best-evidenced buyer path starts with manufacturing organizations that own capex for error-prone,
              labor-intensive, or frequently reconfigured tasks. Public descriptions consistently position TARS for
              precision factory work, and the estimated $95,000 price point would place it in a budget range that is far
              above consumer robotics but still below the industrial pricing band Robozaps quotes for many peers. A
              secondary route is ecosystem seeding: InforCapital says TARS opened the WIYH dataset to research
              institutions in December 2025, and the company's Hugging Face organization already exposes four public
              datasets. That combination suggests TARS is trying to build both factory adoption and an external
              data-and-research community around its embodied-AI stack.
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM012
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM012
              - CM015
      - number: '2.4'
        title: Adoption drivers are real, but commercialization evidence is still thin
        blocks:
          - type: paragraph
            body: >-
              The bullish case is straightforward: labor-intensive dexterous work, a fast expanding Chinese supply base,
              and sector-wide standardization all improve the odds that humanoids move from showcases into budgeted
              automation programs. The constraints are just as important. China's new standards put safety, model
              lifecycle, and application requirements directly in the commercialization path, while the retained TARS
              sources still stop short of disclosing named paying customers, fleet deployments, or ROI metrics. Even the
              financing record shows a data-quality wrinkle, with InforCapital's own narrative and FAQ disagreeing on
              the latest round chronology. The market is likely large enough to matter, but present public evidence is
              not yet detailed enough to defend a precise TARS SAM, SOM, or adoption timetable.
            claimRefs:
              - CM006
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Precision manufacturing is the real wedge
            body: >-
              The retained evidence does not justify treating TARS as a broad consumer or general-service robot play.
              Its best-supported entry point is high-value, fine-motor industrial work where conventional automation
              still struggles.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
          - type: callout
            title: Market size is easier to prove than demand capture
            body: >-
              Sector growth, funding, and Chinese supply expansion are all visible, but the retained public record still
              does not show named customers, fleet scale, or verified ROI for TARS. That keeps SAM/SOM and adoption
              timing underdetermined.
            calloutType: risk
            claimRefs:
              - CM003
              - CM005
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive perimeter and benchmark set
        blocks:
          - type: paragraph
            body: >-
              The relevant benchmark set is broader than other pre-Series A humanoid startups. Humanoids Daily describes
              the sector as a multi-billion-dollar capital race led by Figure at a confirmed $39 billion valuation, with
              Apptronik, Unitree, and AgiBot already operating at multi-billion-dollar valuation or IPO ambition. That
              matters because TARS is not competing only on demo novelty; it is competing against firms with larger war
              chests, stronger distribution partners, or both. TARS is still unusually well funded for a company founded
              in 2025, with RobotHub and InforCapital both listing $697 million raised across three disclosed rounds,
              but its capital position still sits below the top global leaders rather than above them.
            claimRefs:
