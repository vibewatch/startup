          label: TARS
          x: 3
          'y': 1
          detail: $697M raised, estimated $95k external price point, and no named public customers in retained evidence.
        - name: Figure AI
          label: Figure AI
          x: 5
          'y': 2
          detail: $39B confirmed valuation and public target pricing, but limited public revenue or realized contract detail.
        - name: Unitree
          label: Unitree
          x: 4
          'y': 5
          detail: Targeted IPO path plus multiple publicly visible consumer/commercial price anchors.
        - name: AgiBot
          label: AgiBot
          x: 4
          'y': 4
          detail: IPO ambition and sub-$20k public price anchor improve comparability versus TARS.
        - name: Apptronik
          label: Apptronik
          x: 4
          'y': 3
