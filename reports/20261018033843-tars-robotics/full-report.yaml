            claimRefs:
              - CP008
              - CP009
              - CP013
      - number: '3.3'
        title: Durability, entrant pressure, and adverse checks
        blocks:
          - type: paragraph
            body: >-
              The strongest risk in the assigned evidence is that TARS has not yet turned technical demonstrations into
              a durable commercial moat. SlashGear explicitly notes that the embroidery showcase relied on a single
              public video, lacked a complete recording, and did not have a public corporate site hosting the proof
              package, which weakens independent verification of a flagship capability claim. At the same time, Shanghai
              is deliberately deepening the local cluster: Pudong says the city wants 100 leading enterprises, 100
              application scenarios, and 100 globally competitive products by 2027. That combination means geography and
              policy support are shared assets across the cluster, not a proprietary moat for TARS. The open question is
              whether TARS can convert early interest into disclosed customers before better-capitalized peers and
              platform entrants compress differentiation.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Demo strength is ahead of commercial proof
            body: >-
              The retained pool supports TARS as a technically ambitious full-stack humanoid program, but it does not
              yet support a durable customer moat. The clearest public adverse evidence questions demo verifiability,
              while the clearest public commercial evidence is only purchase intent rather than named contracts.
            calloutType: risk
            claimRefs:
              - CP011
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization surfaces are visible; revenue disclosure is not
        blocks:
          - type: paragraph
            body: >-
              TARS has clear product surfaces in public sources: industrial and general-purpose humanoid robots,
              embodied-AI models, and related sensing/manipulation tooling. What the retained evidence does not show is
              how those surfaces convert into recognized revenue, whether software is monetized separately from
              hardware, or how any contracts are structured. That distinction matters because a robot OEM with
              integration-heavy deployments can look very different economically from a higher-margin platform vendor.
              Public pricing evidence is also thin: OriginOfBots says TARS has not published prices for the A Series or
              T Series humanoids, while a separate OriginOfBots robot page offers only a third-party estimated price for
              the TARS humanoid. The result is a visible product catalog with an opaque monetization stack.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI009
          - type: table
            tableRef: TI001
            claimRefs:
              - CI004
              - CI007
              - CI009
