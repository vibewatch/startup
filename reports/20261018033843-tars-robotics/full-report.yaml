            - CM006
        - label: Research-channel lens
          displayValue: 4 public datasets
          note: >-
            TARS's Hugging Face presence and WIYH release show a parallel route through researchers and model
            developers.
          tone: neutral
          claimRefs:
            - CM012
            - CM015
        - label: TARS entry wedge
          displayValue: $95,000 estimated robot price
          note: >-
