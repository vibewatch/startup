              - CI009
              - CI012
      - number: '4.3'
        title: Funding access is strong, but capital adequacy is still unproven
        blocks:
          - type: paragraph
            body: >-
              Multiple retained sources converge on TARS having raised about $697 million across three rounds since
              2025, including a $455 million pre-A round in April 2026 that sector coverage described as record-setting
              for embodied intelligence in China. Gasgoo says the proceeds are intended for proprietary model
              development and global talent recruitment, which reinforces the likely intensity of compute and hiring
              spend even after a very large raise. At the ecosystem level, Shanghai's August 2026 embodied-intelligence
              plan offers meaningful subsidies for compute, data, pilot platforms, and sales or leasing, while China's
              March 2026 national standard system indicates that scale deployment will also carry compliance and
              application requirements. Those factors can help the sector, but they do not substitute for disclosed
              cash, burn, or runway at the company level.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI010
              - CI011
              - CI013
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Financially, TARS currently reads as a heavily financed but still hard-to-underwrite robotics company. The
              public evidence is sufficient to say capital access has been exceptional for the stage and that commercial
              interest exists, yet it remains insufficient to assess revenue quality, gross-margin path, cash
              conversion, or next-round dependency with conviction. That means the underwriting burden shifts to private
              diligence: management reporting, customer contracts, post-money valuation, gross-margin bridge, and
              current cash runway must all be reviewed before a valuation view can become more assertive than a
              watch-and-verify stance.
            claimRefs:
              - CI009
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is visible; revenue quality is not
            body: >-
              TARS has unusually strong fundraising for its age, but the retained public record still stops short of the
              metrics needed to underwrite gross margin, burn, runway, or customer concentration.
            calloutType: risk
            claimRefs:
              - CI001
              - CI009
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and public maturity
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently frames TARS around industrial automation, industrial logistics, and precision
              manufacturing rather than consumer or general home robotics. The most repeated proof points are hard
              fine-motor tasks—two-handed stitching, hand embroidery, and wire-harness assembly—which is strategically
              important because those tasks are harder to fake with a generic humanoid demo than walking or object
              pickup alone. At the same time, the assigned pool still portrays the product as early-stage: one public
              directory explicitly labels availability as prototype, and the visible pricing and configuration details
              come from third-party catalog and profile pages rather than official product documentation. That leaves a
              credible public product concept with a sparse deployment record: enough evidence to understand what TARS
              wants to automate, but not enough to underwrite repeatable factory rollout without management materials.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE010
              - CE013
