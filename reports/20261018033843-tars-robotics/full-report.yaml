          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI010
      - number: '4.2'
        title: Commercial signals exist, but they are still proxy signals
        blocks:
          - type: paragraph
            body: >-
              The strongest public commercialization signal in the retained pool is Gasgoo's report that TARS generated
              purchase intentions at LogiMAT after debuting the A1 robot overseas. That is directionally helpful, but it
              is not the same as signed backlog, recognized revenue, or a disclosed average selling price. OriginOfBots
              also frames the company as having limited deployments and about three hours of battery runtime, which
              suggests that real-world operating maturity may still be catching up with the scale of capital raised.
              More broadly, JD.com's 2026 robot-service push illustrates that commercialization in Chinese robotics can
              depend on training, service, and distribution infrastructure as much as on core robot R&D. For TARS, the
              public record therefore supports interest and technical promise, but not yet a complete unit-economics
              model.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI012
