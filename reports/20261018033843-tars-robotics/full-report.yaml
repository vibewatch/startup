      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The public stack is unusually specific for a pre-Series A robotics company. Third-party spec aggregators
              converge on a perception-and-control layer built from RGBD vision, inertial sensing, tactile/force
              sensing, industrial networking, and Linux/ROS-style control, while 2026 launch coverage adds a named
              manipulation and learning stack: DexHand, AWE 3.0, and SenseHub. Taken together, the evidence suggests
              TARS is not selling a single robot shell so much as a vertically integrated embodied-AI workflow: collect
              human motion data, train/manipulate with a proprietary foundation model, then execute on dexterous
              hardware aimed at flexible manufacturing. That architecture is directionally strong because it ties data
              collection, model training, and manipulator design together, but the public record still lacks benchmark
              methodology, latency disclosure, or safety-case documentation.
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
