  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a narrow market definition for TARS: industrial humanoids sold into
              precision-manufacturing and flexible-material workflows, not a generic "all embodied AI" opportunity. The
              strongest public proofs are task demonstrations around hand embroidery, wire-harness style manipulation,
              and factory-oriented flexible manufacturing, which implies TARS competes first against manual fine-motor
              labor and hard-to-reconfigure fixed automation. That boundary matters because a humanoid form factor only
              earns budget when the workflow is too variable for traditional tooling but still valuable enough to
              justify robot hardware, embodied-AI software, and integration spend.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM015
      - number: '2.2'
        title: Sizing lenses point to a large sector, but not a TARS-specific SAM
        blocks:
          - type: paragraph
            body: >-
              Public market sizing remains lens-based rather than precise. Robozaps cites a Markets and Markets forecast
              that moves the humanoid category from $2.9B in 2025 to $15.3B by 2030 at a 39% CAGR, while the same
              database says it tracks 26 humanoid robots across 7 countries, with 14 already commercially available and
              more than $5B of sector investment. Separately, MIIT/Xinhua frames 2025 as China's first year of humanoid
              mass production, with more than 140 domestic manufacturers and 330 models. Those data points support a
              real, scaling market, but they do not isolate the revenue pool TARS can capture in precision manufacturing
              without customer, pricing, and deployment data beyond demos.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
