      commercial transparency.
    data:
      xAxis:
        label: Capital access score
        min: 1
        max: 5
        lowLabel: constrained
        highLabel: abundant
        description: Ordinal score inferred from disclosed funding or valuation scale in retained evidence.
      yAxis:
        label: Public commercial transparency score
        min: 1
        max: 5
        lowLabel: opaque
        highLabel: benchmarkable
        description: >-
          Ordinal score inferred from public price anchors, partner/customer signals, and disclosed commercialization
          status in retained evidence.
      points:
