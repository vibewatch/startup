  - id: FM001
    title: Market sizing lens for TARS's initial wedge
    type: pyramid
    summary: >-
      The addressable market narrows from global humanoid-sector forecasts to China's fast-scaling industrial base and
      then to TARS's currently evidenced precision manufacturing wedge.
    data:
      items:
        - label: Global humanoid market lens
          displayValue: $15.3B by 2030
          note: Markets and Markets estimate cited by Robozaps, with 39% CAGR from $2.9B in 2025.
          tone: neutral
          claimRefs:
            - CM004
        - label: Current commercialization lens
          displayValue: 14 commercially available robots
          note: Robozaps tracks 26 humanoid robots across 7 countries and >$5B of total industry investment.
          tone: neutral
          claimRefs:
            - CM003
        - label: Industrial price-band lens
          displayValue: $150,000-$320,000
          note: >-
            Robozaps says industrial humanoid platforms sit far above consumer pricing, clarifying where enterprise
            budgets start.
          tone: warning
          claimRefs:
            - CM007
        - label: China ecosystem lens
          displayValue: '>140 manufacturers / >330 models'
          note: MIIT/Xinhua describes 2025 as China's first humanoid mass-production year.
          tone: opportunity
          claimRefs:
