      - number: '3.2'
        title: Capability, pricing, and buyer tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The retained pool supports a technical-differentiation story, but not yet a procurement-proof story.
              Company and follow-on coverage describe TARS as a full-stack embodied-AI vendor combining AWE 3.0,
              SenseHub, and the 21-DoF DexHand platform, while OriginOfBots and Robozaps place TARS inside the
              industrial humanoid price band rather than the low-cost consumer tier. The problem for buyers is
              transparency: OriginOfBots gives only an estimated $95,000 price, not an official list price, and the
              retained pool does not provide contract structure, maintenance terms, or public named customers. By
              contrast, Robozaps shows that several rivals already publish at least target or entry pricing, which makes
              them easier for customers to benchmark even when realized enterprise pricing remains uncertain.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP013
              - CP014
