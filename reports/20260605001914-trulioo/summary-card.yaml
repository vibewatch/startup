summary:
  headline: >-
    Trulioo is a high-quality global identity platform with re-accelerating revenue growth and strong enterprise proof,
    but the 4-year-stale $1.75B valuation anchor, unaudited financials, and leadership transition support a track rather
    than buy posture.
  overallScore: 5.8
  recommendation: track
  confidence: medium
  riskRating: medium
  valuationStance: fair
