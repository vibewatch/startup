    valuationUsdM: 1750
    revenueRunRateUsdM: 150.6
    arrUsdM: 150.6
    revenueGrowthYoYPct: 29
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 477
    customerCount: 450
    headcount: 375
  topStrengths:
    - >-
      Single-API multi-modal platform covering 195 countries with KYC, KYB, document, watchlist, and fraud in one
      integration — structurally harder to replicate than point-solution vendors.
    - >-
      Re-accelerating ARR growth (8% in 2023 to 29% in 2024) with 64% APAC revenue growth and 586% US KYB growth since
      2020 demonstrating product-mix expansion.
    - >-
      Named enterprise proof from J.P. Morgan Payments, Airwallex (seven-year, three-product relationship), and six of
      the top seven global payment processors validates platform quality at scale.
  topRisks:
    - >-
      Valuation anchor is 4+ years stale with no confirmed 409A, secondary transaction, or audited financials to
      underwrite the $1.75B mark with current data.
    - >-
      Leadership transition risk — Vicky Bindra is less than 14 months into the CEO role and a third executive
      transition within 24 months would materially break the thesis.
    - >-
      Preference overhang from $477M raised with no ISC filed in Canada leaves liquidation waterfall and control
      structure opaque for any secondary buyer.
    - >-
      Customer concentration is unverified — if the top account exceeds 25% of ARR the platform economics are materially
      riskier than the public narrative implies.
  unresolvedGaps:
    - >-
      Audited revenue, gross margin, EBITDA, and net revenue retention for 2023-2025 to confirm the third-party ARR
      trajectory and platform economics.
    - >-
      Cap-table detail including liquidation preferences, participation rights, and weighted-average anti-dilution terms
      by round.
    - Customer concentration data — top-1, top-5, and top-10 as share of ARR — and cohort-level net revenue retention.
    - Board-approved 409A or independent secondary transaction to refresh the valuation anchor from June 2021.
    - >-
      Runway confirmation — cash position, burn rate, and whether a new dilutive round is required within the next 18-24
      months.
