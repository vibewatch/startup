  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-control
    missingEvidence: Current cap table, shareholder percentages, board committees, and any secondary-share activity since the 2021 Series D.
    whyItMatters: Without updated ownership and governance detail, it is hard to assess control, investor influence, or downside protection in a refreshed valuation discussion.
    diligencePath: Request a current cap table, board observer list, shareholder rights summary, and any tender or secondary history from management and lead investors.
    relatedQuestionRefs:
    - QO010
    - QO023
    relatedTableRefs:
    - TO003
    - TO004
  - type: private-evidence-only
    severity: material
    topic: current-customer-count
    missingEvidence: Exact live customer count, ARR concentration by top accounts, and customer retention metrics by segment.
    whyItMatters: Named logos prove relevance, but without concentration and retention data it is impossible to judge revenue durability or exposure to a small number of enterprise accounts.
    diligencePath: Request cohort retention, top-20 customer exposure, and customer-count breakdown by banking, payments, marketplaces, crypto, and healthcare verticals.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: blocking
    topic: profitability-and-burn
    missingEvidence: Current gross margin, EBITDA or operating profit, burn rate, cash balance, and runway.
    whyItMatters: A late-stage private company with a stale 2021 valuation benchmark cannot be valued confidently without understanding profitability quality, burn discipline, and balance-sheet durability.
    diligencePath: Request audited 2024 and 2025 financial statements, management accounts, budget versus actuals, and 2026 operating plan.
    relatedQuestionRefs:
    - QO025
  - type: missing-source
    severity: minor
    topic: beneficial-ownership-disclosure
    missingEvidence: A public beneficial-ownership or individuals-with-significant-control filing that ties directors to economic control.
    whyItMatters: The federal filing shows no filed ISC information, which leaves a gap between visible directors and actual control or ownership.
    diligencePath: Check for more current federal filings, provincial records, or direct shareholder disclosure from the company and lead investors.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: current-valuation
    missingEvidence: A 2025 or 2026 primary source confirming whether the 2021 $1.75B valuation has held, been marked down, or been reset.
    whyItMatters: The stale price anchor creates risk of relying on a bull-market multiple that may no longer reflect current private-market conditions.
    diligencePath: Request board-approved 409A or internal valuation materials, latest preferred-share financing terms, and investor marks.
    relatedQuestionRefs:
    - QO010
