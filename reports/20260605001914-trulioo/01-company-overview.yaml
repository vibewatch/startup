- id: leadership-governance
  title: Leadership Transition and Governance Posture
  body: Leadership moved materially in 2025 and 2026. Trulioo appointed Vicky Bindra as chief executive officer on April 1, 2025, replacing Steve Munford, who the company credited with guiding the business through major expansion and a threefold revenue increase. Bindra came from senior roles at Nuvei, FIS, Visa, and Mastercard, which points to a payments-heavy operator profile rather than a founder-CEO profile. The March 2026 executive bench expansion added Chad Gerhardstein as chief risk and strategy officer, Danielle Holbrook Dunn as chief transformation officer, and Uri Zelmanovich as chief financial officer, which suggests the company is building a more mature enterprise operating layer as it pushes deeper into platform, risk, and credit decisioning use cases. Governance visibility is mixed. Corporations Canada lists Steve Munford, Stephen Ufford, Tanis Jorge, David Blumberg, Lisa Stanton, Mark Midle, and Andrew Lugsdin as directors, but the same filing shows no filed information on
    individuals with significant control. That missing beneficial-ownership visibility is not unusual for a private company, but it is a material diligence limitation when assessing control, board influence, and shareholder concentration.
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
