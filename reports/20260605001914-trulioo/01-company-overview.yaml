- id: milestones-and-customer-proof
  title: Milestones, Customer Signals, and Operating Momentum
  body: 'The company''s milestone pattern since 2022 shows broadening platform scope rather than a single-product narrative. Trulioo acquired HelloFlow in February 2022 to add no-code orchestration and workflow design to its GlobalGateway foundation, then launched a unified global identity platform in January 2023 with Workflow Studio, API Direct, and integrated person, business, document, and watchlist services. The December 2023 growth update reported that 65% of new customers selected workflow capabilities and that Trulioo served three of the five largest U.S. banks, six of the top seven global digital payment processors, and multiple leading marketplaces, brokers, and crypto exchanges. Named customer proof is stronger than many private infrastructure peers: official references include J.P. Morgan Payments, Public, Airwallex, Trust Payments, Phoenix Digital Health, Consensys, Nium, eToro, Stake, and Metal Pay. Recent releases also show continued momentum in APAC and KYB. Trulioo reported
    64% year-over-year APAC revenue growth in April 2025, then said 2025 APAC business-verification volume grew 51% year over year as new UBO-discovery capabilities improved ownership visibility in fragmented markets.'
