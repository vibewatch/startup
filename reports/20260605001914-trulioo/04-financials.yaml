- id: cost-structure-and-operating-leverage
  title: 'Cost structure and operating leverage: headcount efficiency signals; gross margin private'
  body: >-
    Trulioo's cost structure is only partially visible, but the available evidence points to improving operating
    leverage rather than unchecked spend growth. Headcount is the clearest proxy. The January 2023 platform
    launch said staffing had nearly doubled to 430 employees, while third-party profiles later showed about 405
    employees in 2024 and around 375 by 2026. If GetLatka's ARR figures are directionally correct, that implies
    revenue per employee improved materially from roughly $293,000 in 2021 to about $402,000 in 2024. That is
    a meaningful efficiency gain for a company still investing in platform breadth. The likely cost stack is not
    trivial: Trulioo relies on 450-plus global data sources, must pay for registry and watchlist access across
    many jurisdictions, runs AI and machine-learning models for document and business verification workflows, and
    supports customers from multiple regional offices including Vancouver, Dublin, and Singapore. Even so, recent
    product updates suggest some unit-cost improvement. The March 2025 AI and machine-learning release cited a
    60% reduction in job processing times and a 20% increase in verification rates, while the March 2026
    executive-appointments release said KYB processing time improved from six seconds to 3.3 seconds. The new
    CFO, Uri Zelmanovich, was explicitly hired to bring financial rigor, capital discipline, and operational
    leverage, reinforcing the interpretation that margin management is now a central operating priority.
  claimRefs:
