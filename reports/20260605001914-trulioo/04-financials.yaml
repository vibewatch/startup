  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-series-d-liquidity-context
    missingEvidence: >-
      Current cash balance, monthly burn, operating cash-flow profile, and any private credit facilities since the
      2021 Series D.
    whyItMatters: >-
      Without current liquidity evidence, the absence of a new equity round cannot be interpreted confidently as a
      sign of self-funding strength rather than delayed fundraising.
    diligencePath: >-
      Request the latest balance sheet, trailing twelve months of monthly burn, and any debt or credit agreements
      alongside management's next-financing or self-funding plan.
    relatedQuestionRefs:
    - QI016
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway-and-margin-stack
    missingEvidence: >-
      Gross margin by stream, cash on hand, burn rate, runway months, NRR, churn, CAC, and realized enterprise
      pricing by segment.
    whyItMatters: >-
      These metrics are the minimum operating pack needed to convert Trulioo's public traction into a finance-grade
      underwriting view.
    diligencePath: >-
      Request audited financial statements, a cohort retention deck, CAC and payback reporting, and a customer-
      concentration plus pricing realization schedule for the last two fiscal years.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
