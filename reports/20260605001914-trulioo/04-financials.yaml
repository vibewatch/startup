- id: gtm-motion-and-sales-efficiency
  title: 'GTM motion and sales efficiency: enterprise-direct model with limited public efficiency data'
  body: >-
    Public evidence points to an enterprise-direct GTM model layered on top of a flexible API platform rather
    than a pure self-serve SaaS motion. GetLatka attributes 53 quota-carrying sales representatives and roughly
    450 customers to Trulioo, implying only about eight to nine accounts per rep on a simple average basis.
    That ratio suggests a meaningful focus on named-account coverage, although the real book shape is probably
    skewed toward large regulated buyers. Logo quality supports that interpretation. J.P. Morgan Payments chose
    Trulioo for global person and business verification in 2023, while Airwallex has used Trulioo since 2017
    and expanded the relationship into KYB as it scaled to more than $100 billion of annual processing across
    181 countries. Product-adoption data also suggests Trulioo sells a broader workflow layer rather than only
    discrete checks: 65% of new customers in 2023 chose workflow capabilities and 40% adopted an end-to-end
    KYB-plus-KYC workflow including UBO discovery. The February 2022 HelloFlow acquisition fits that pattern by
    adding orchestration and lock-in to the core verification stack. A crude blended revenue-per-customer proxy
    of roughly $335,000 looks attractive at face value, but it is almost certainly distorted by enterprise
    concentration. CAC, payback, NRR, churn, and realized ASP remain private, so sales efficiency cannot be
    underwritten beyond directional signals.
  claimRefs:
  - CI010
  - CI011
  - CI013
