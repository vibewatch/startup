chapter:
  number: 4
  title: Financials
  summary: >-
    Trulioo's public financial record supports a consumption-based per-check revenue model with re-accelerating
    ARR momentum reaching a third-party-reported $150.6 million in 2024 (up ~29% from $116.9 million in 2023),
    driven by APAC geographic expansion (64% regional revenue growth) and a KYB product mix shift (586% US growth
    since 2020). The capital structure is anchored by a $394 million Series D (June 2021, $1.75 billion post-money
    valuation) with no confirmed follow-on as of June 2026. Headcount efficiency has improved materially — from
    ~$233K to ~$402K revenue per employee since 2021 — and a new CFO hired in March 2026 signals capital
    discipline. Gross margin, cash, burn, runway, NRR, churn, CAC, and realized enterprise pricing are all private
    and constitute the primary diligence blockers.
sections:
- id: revenue-model-and-public-traction
  title: 'Revenue model and public traction: per-check economics with re-accelerating ARR and KYB mix shift'
  body: >-
    Trulioo's public financial narrative is strongest where product mechanics and top-line traction intersect.
    In the CEO interview surfaced by GetLatka, management describes monetization as charging from cents to
    dollars per verification depending on country and complexity, which is consistent with a transactional,
    consumption-based model rather than a flat seat license. That matters because the company's reported ARR
    progression shows both scale and renewed momentum: roughly $20 million in 2017, $50 million in 2020,
    $100 million in 2021, $108.4 million in 2022, $116.9 million in 2023, and $150.6 million in 2024, all
    from a third-party unaudited profile. Read directionally, the growth curve slowed after the 2021 scaling
    step-up and then re-accelerated materially in 2024, moving from roughly 8% year-over-year growth in 2023
    to roughly 29% in 2024. The commercial architecture likely helps: Trulioo markets one contract and one API
    across person verification, business verification, document verification, watchlist screening, fraud
    intelligence, and workflows, which should make it easier to expand product usage inside an account without
    forcing a reintegration. Mix also appears to be shifting toward higher-value workflows. In April 2025,
    Trulioo reported 64% year-over-year APAC revenue growth, led by fintech and marketplace cohorts, and the
    company's KYB release said U.S. KYB adoption had grown 586% since 2020. Together those disclosures support
    a revenue engine tied to verification volumes, cross-sell breadth, and a richer KYB-heavy product mix.
  claimRefs:
