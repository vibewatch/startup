  summary: >-
    How Trulioo converts customer identity verification activity into revenue and gross profit; cost-side
    detail remains private.
  data:
    nodes:
    - id: customer-check
      label: Customer initiates KYC or KYB verification check
      detail: Verification demand starts inside a regulated onboarding or monitoring workflow.
      tone: positive
    - id: api-call
      label: Single API call to Trulioo platform
      detail: The customer uses one integration point rather than separate product-specific connectors.
      tone: neutral
    - id: product-routing
      label: Platform routes to optimal data source or docV engine
      detail: Trulioo chooses among data partners, registries, and document-verification logic.
      tone: neutral
    - id: per-check-fee
      label: Per-check fee applied (cents to dollars depending on product/country)
      detail: Pricing varies by geography, complexity, and product depth.
      tone: positive
    - id: revenue-pool
      label: Blended ARR pool (~$150.6M reported 2024, unaudited)
      detail: Third-party reporting suggests meaningful recurring scale built from transaction activity.
      tone: positive
    - id: data-source-cost
      label: Data source and registry fees (COGS component; amount private)
      detail: Underlying data access and registry usage likely form a major direct-cost bucket.
      tone: warning
    - id: inference-cost
      label: AI/ML inference and platform infrastructure costs (COGS; private)
      detail: Document verification, fraud scoring, and platform operations add compute and infrastructure cost.
      tone: warning
    - id: gross-profit
      label: 'Gross profit margin (undisclosed; industry proxy: 60–80% for API data businesses)'
      detail: Margin quality cannot be proven publicly because direct-cost disclosure is absent.
      tone: neutral
