- id: financial-verdict-and-diligence-gaps
  title: 'Financial verdict: improving efficiency, rising international mix, structural diligence gaps'
  body: >-
    The public financial verdict is directionally positive but still incomplete. On the favorable side, Trulioo
    appears to have re-accelerated ARR growth in 2024, posted 64% APAC revenue growth in 2025 disclosures,
    benefited from a KYB mix shift that should support higher price realization, and improved revenue per
    employee while reducing overall headcount from the 2023 peak. Those signals are consistent with a company
    that is prioritizing operating discipline without obviously retreating from growth. The 2026 CFO hire adds
    to that story by signaling more formal finance leadership at a time when the capital markets have become
    less forgiving of private-company opacity. But the adverse evidence is real. G2 reviewers describe pricing
    as higher than competitors, which suggests at least some customer price sensitivity. The valuation anchor is
    old, the absence of a new equity round since 2021 is ambiguous, and the headcount decline could reflect both
    efficiency gains and softer demand. Most importantly, the core underwriting stack is missing: gross margin,
    cash, burn, runway, NRR, churn, CAC, customer concentration, and realized enterprise pricing are all
    undisclosed. As a private Canadian company, Trulioo does not provide SEC-style or current SEDAR-like public
    financial reporting. Management data is therefore required before any serious financial underwriting case can
    be closed.
