- id: capital-adequacy-and-funding-context
  title: 'Capital adequacy and funding context: Series D unicorn from 2021, no confirmed follow-on'
  body: >-
    Trulioo's public capital base remains anchored to the June 2021 Series D, when the company raised
    $394 million at a reported $1.75 billion post-money valuation. Public sources consistently name TCV as
    lead investor and also cite participation from American Express Ventures, Citi Ventures, Blumberg Capital,
    and Mouro Capital, while third-party profiles put total disclosed funding at roughly $477 million across
    eight rounds. That gives Trulioo a substantial historical capital cushion, but it also means the valuation
    mark now looks stale: by June 2026, the last confirmed equity benchmark is more than four years old. The
    lack of a publicly confirmed follow-on round since 2021 can be read in two ways. Positively, ARR growth,
    headcount discipline, and continued product shipping may have extended runway enough to avoid a difficult
    fundraising market. More cautiously, public sources cannot prove whether the company is cash-flow positive,
    merely conserving capital, or using private credit not surfaced in the record. The federal corporate filing
    adds only structural context, showing a non-distributing corporation with 50 or fewer shareholders. Using
    the 2021 ARR anchor of about $100 million, the Series D valuation implies an ARR multiple in the high-
    single-digit range, roughly seven to ten times, which was defensible in 2021 but cannot be relied upon as
    a current private-market mark without fresh management materials.
  claimRefs:
