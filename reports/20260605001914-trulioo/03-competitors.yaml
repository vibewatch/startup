  - id: competitor-profiles
    title: Competitor profiles by class
    body: >-
      Jumio is the most direct global peer. Its platform processes 120 transactions per second, supports
      5,000+ government ID types, has processed 1B+ total transactions, and holds 300+ patents and patent
      applications. Its Jumio Identity Graph of 30M+ known identities is marketed as a cross-session
      network moat for proactive fraud detection. G2 reviewers rate Jumio more expensive than Trulioo,
      suggesting a premium pricing tier.


      Veriff, headquartered in Estonia, covers 230+ countries and territories with 12,500+ government
      document types, analyzing 1,000+ signals per session and claiming 99.6% accuracy and 6-second
      decision times. It serves 3,000+ businesses globally and positions its growing cross-session
      intelligence network as a data moat rivaling Jumio's Identity Graph.


      Socure has built the deepest North American footprint among digital-native peers: 3,000+ customers
      including 18 of 20 top US banks, 13 of 15 top US credit card issuers, 4 of 4 top HRIS platforms,
      and 4 of 5 top social networks. Its vertically integrated AI platform excels at automated consumer
      onboarding approval rates in the US but offers narrower cross-border country coverage and less
      developed KYB depth than Trulioo.


      Persona competes on modularity and developer experience. Its dynamic flow builder, Workflows engine,
      and Graph-based link analysis allow product teams to compose verification pipelines without deep
      integration work, lowering initial lock-in compared to integrated platforms.


      Alloy is trusted by 800+ financial institutions and fintechs and offers access to 270+ partner
      solutions via its vendor-neutral open data ecosystem. Its orchestration layer explicitly enables
      buyers to swap underlying verification providers, which positions Trulioo as one of many data
      sources rather than a primary platform vendor in Alloy-mediated deals.


      Sardine focuses on financial crime prevention with behavioral biometrics, device profiling, payment
      fraud detection, and AML automation agents. With 450+ enterprise customers and $1.36T+ in payments
      screened, Sardine is a functional complement rather than a direct substitute for Trulioo's global
      identity proofing scope. LexisNexis Risk Solutions (RELX subsidiary, RELX 2025 full-year revenue
      £9.2 billion) competes through watchlist screening, AML data, and deep enterprise data reseller
      channels. TransUnion's verification capability is primarily credit-bureau-driven and is stronger in
      US consumer credit identity matching than in cross-border, KYB, or document-verification workflows.
