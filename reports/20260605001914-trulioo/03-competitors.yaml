    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Key threat
      - Severity
      - Mitigation / diligence ask
    rows:
      - - 400+ global data partnerships across 195 countries
        - Competitor accelerates regional data-partnership build; hyperscaler adds domestic ID data at scale
        - Medium
        - Track competitor country-coverage expansions; diligence Trulioo's exclusive vs. non-exclusive data agreements
      - - Single-API multi-product platform (KYC+KYB+AML+Doc+Fraud)
        - Open-ecosystem orchestrators (Alloy) reduce primary-vendor dependency by routing around proprietary integrations
        - High
