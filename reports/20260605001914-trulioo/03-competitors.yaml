        - Medium
        - Measure consortium data recency, coverage depth, and false-positive rates vs. Jumio Identity Graph in independent benchmarks
    notes: >-
      Severity ratings (High/Medium/Low) are evidence-backed ordinal judgments. No quantitative displacement rates
