      whyItMatters: >-
        Without customer count, churn, and segment disclosure it is not possible to independently assess Trulioo's
        competitive scale versus Socure (3,000+) and Veriff (3,000+), or to evaluate whether revenue growth is
        driven by new customer acquisition or wallet share expansion in existing accounts.
