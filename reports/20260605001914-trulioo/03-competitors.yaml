callouts:
  - calloutType: risk
    title: Socure's US bank penetration is the most durable near-term competitive barrier for Trulioo
    body: >-
      Socure's 18-of-20-top-US-bank reference base creates both a data-network effect (more data improves its
      US consumer models) and a procurement reference moat. New enterprise buyers in US financial services face
      significant social proof pressure to evaluate Socure first. Trulioo's path to comparable US depth requires
      either a landmark US financial institution win or a distribution partnership—neither of which is publicly
      confirmed as of June 2026.
    claimRefs:
      - CP003
      - CP028
      - CP040
  - calloutType: insight
    title: Open-ecosystem orchestrators compress Trulioo's pricing power in mediated deals
    body: >-
      Alloy's vendor-neutral orchestration model with 270+ integrations positions Trulioo as one of many
      swappable data providers rather than a platform vendor in Alloy-mediated enterprise deals. This structural
      dynamic—also replicated by other orchestration layers—reduces Trulioo's ability to capture the full
      compliance workflow budget and makes account expansion dependent on outperforming peers on data quality
      metrics rather than relationship lock-in.
    claimRefs:
      - CP005
      - CP021
      - CP037
  - calloutType: strength
    title: Cross-border global fintech segment is Trulioo's most defensible position
    body: >-
      Customers like Nium ($60B+ in annual payments across 190+ payout markets) and EQ Bank that require
      multi-jurisdictional KYC and KYB cannot substitute Trulioo with a US-centric competitor or a single
      incumbent data provider. The cross-border fintech and regulated marketplace segment is where global
      data partnership breadth, single-API simplicity, and modular KYB depth combine into a competitive
      position that domestic-first competitors cannot match without multi-year data-partnership investment
      in each additional jurisdiction.
    claimRefs:
      - CP027
      - CP034
      - CP038
