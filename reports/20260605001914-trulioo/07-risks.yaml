      - - AMLA regulatory non-compliance by customers
        - AMLA issues replacement guidelines; customers report workflow gaps
        - Any AMLA rulemaking that Trulioo's platform cannot accommodate within 90 days
        - Escalate to product roadmap priority; activate regulatory update SLA (if exists); potential contract breach exposure
      - - Data breach or security incident
        - Any public disclosure of a breach, regulatory notification, or customer complaint about data exposure
        - Single confirmed breach impacting biometric or identity data of customers' end users
        - Immediate trust-and-safety review; assess customer indemnification obligations; evaluate ongoing platform reliability
      - - Major data registry access termination
        - Official government notice of API withdrawal or restriction in a top-5 market by Trulioo transaction volume
        - Coverage loss in any G10 jurisdiction or any jurisdiction representing >5% of estimated ARR
        - Reassess geographic coverage claims; evaluate competitive disadvantage; escalate to partnership team
      - - CEO or key executive departure within 24 months of appointment
        - Departure of Bindra, Zelmanovich, Gerhardstein, or key engineering leads
        - Departure of CEO or CFO within 12 months without announced successor
        - Material governance event; reassess strategic continuity and investor confidence
      - - Valuation markdown or forced secondary transaction
        - Any investor mark, secondary transaction disclosure, or board-approved 409A update
        - Valuation at or below $750M (50%+ markdown from 2021) or forced recapitalization
        - Thesis-break trigger; reassess return profile, investor incentive alignment, and commercial trajectory
      - - Revenue concentration customer loss
        - Non-renewal announcement or press release indicating a major Trulioo customer has switched vendors
        - Loss of any customer known to represent ≥10% of estimated ARR
        - Immediate concentration risk escalation; reassess revenue durability and GTM execution
      - - Regulatory enforcement action
        - Public enforcement action by DPA, FinCEN, FCA, or national AML supervisor against Trulioo directly
        - Any enforcement order, consent decree, or formal inquiry from a tier-1 regulator
        - Thesis-break if enforcement is material; evaluate legal costs, remediation obligations, and reputational impact
      - - Competitive displacement signal
        - Customer-facing announcement that a Trulioo named reference customer has publicly switched to a competitor
        - Two or more named reference customers (JP Morgan Payments, Airwallex, Trust Payments, Public, WEX) publicly terminate
        - Reassess IDP competitive moat; accelerate product differentiation diligence
    claimRefs:
      - CR001
      - CR017
      - CR028
      - CR033
      - CR037
      - CR013

