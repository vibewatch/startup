  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: >-
        Audited financial statements for 2023, 2024, and 2025; gross margin, operating profit, burn rate,
        cash balance, and runway to support any refreshed valuation analysis.
      whyItMatters: >-
        Without audited financials, it is impossible to confirm whether GetLatka's revenue estimates are
        accurate, what gross margins look like, or whether Trulioo is profitable or cash-burning. The 2021
        valuation benchmark cannot be refreshed without these inputs.
      diligencePath: >-
        Request audited 2023-2025 financial statements, management accounts, and 2026 operating plan with
        budget-versus-actuals from management. Ask for gross margin, EBITDA, and cash runway.
      relatedQuestionRefs:
        - QR018
        - QR023
      relatedTableRefs:
        - TR005

    - type: missing-source
      severity: material
      topic: litigation-absence
      missingEvidence: >-
        Independent legal database search confirming no material litigation against Trulioo in any
        jurisdiction, including PACER, Canadian eCourts, UK Companies House litigation register, or equivalent.
      whyItMatters: >-
        The absence of litigation in available public review and press sources is not equivalent to a clean
        legal record. Identity verification companies regularly face data-related claims; without a formal
        legal diligence search, this gap cannot be closed.
      diligencePath: >-
        Commission independent legal counsel to search PACER, provincial court databases, Canadian competition
        filings, and UK/EU regulatory registers for Trulioo-related filings.
      relatedQuestionRefs:
        - QR005
        - QR017
        - QR029

    - type: missing-source
      severity: material
      topic: cross-border-transfer
      missingEvidence: >-
        Trulioo's specific EU-to-US data transfer mechanism is not specified in publicly available privacy
        policies; the specific adequacy mechanism (EU-US DPF, SCCs, or BCRs) is unconfirmed.
      whyItMatters: >-
        Post-Schrems II enforcement by EU data protection authorities against US SaaS vendors has accelerated.
        If Trulioo relies on a mechanism that is subsequently invalidated, it would face immediate compliance
        disruption across its EU customer base.
      diligencePath: >-
        Request the full Data Processing Agreement; confirm the transfer mechanism, legal basis, and fallback
        mechanism; check whether adequacy decision reliance is primary or supplemental.
      relatedQuestionRefs:
        - QR006

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Top-10 customer revenue concentration data, net revenue retention by cohort, and gross revenue
        retention for enterprise versus mid-market segments.
      whyItMatters: >-
        If three of the five largest US banks account for a majority of ARR, the loss of any one would be
        a major adverse event. Without concentration data, revenue durability cannot be assessed.
      diligencePath: >-
        Request a customer concentration schedule showing top-10 customer revenue, ARR cohort analysis,
        and net/gross retention metrics from management.
      relatedQuestionRefs:
        - QR013
      relatedTableRefs:
        - TR003

    - type: missing-source
      severity: material
      topic: sla-availability
      missingEvidence: >-
        No publicly disclosed SLA, uptime commitment, or incident response timeline for Trulioo's
        identity verification API or workflow orchestration platform was found.
      whyItMatters: >-
        Regulated customers facing KYC/AML deadlines need documented uptime guarantees. The absence of
        a public SLA is a procurement blocker for risk-averse buyers and creates unquantified liability exposure.
      diligencePath: >-
        Request the standard enterprise contract template, including SLA terms, uptime credits, and
        incident response time commitments.
      relatedQuestionRefs:
        - QR011
      relatedTableRefs:
        - TR002

    - type: private-evidence-only
      severity: material
      topic: valuation-staleness
      missingEvidence: >-
        A board-approved 409A or current investor mark confirming Trulioo's intrinsic value in 2025 or 2026;
        no new equity financing, secondary transaction, or audit disclosure has been publicly made since 2021.
      whyItMatters: >-
        The 4+ year gap to the last valuation anchor means any new investment, secondary purchase, or exit
        could be priced at a substantial discount or premium to $1.75B with no public reference point.
      diligencePath: >-
        Request the most recent 409A valuation, board-approved enterprise value materials, and any
        investor secondary transaction details from management and lead investors.
      relatedQuestionRefs:
        - QR016
        - QR023
      relatedTableRefs:
        - TR005

    - type: missing-source
      severity: minor
      topic: biometric-privacy
      missingEvidence: >-
        The full text of Trulioo's Biometric Information Policy to confirm sufficiency under Illinois BIPA's
        specific consent, disclosure, retention schedule, and destruction requirements.
      whyItMatters: >-
        BIPA class-action litigation is active across the US technology sector. A policy that does not satisfy
        BIPA's specific requirements creates exposure to class-action claims with potential indemnification
        implications at Trulioo's customer level.
      diligencePath: >-
        Request the full Biometric Information Policy; compare to BIPA Section 15 requirements; obtain
        legal counsel review.
      relatedQuestionRefs:
        - QR008

    - type: missing-source
      severity: minor
      topic: kya-regulatory
      missingEvidence: >-
        There is currently no established regulatory framework for Know Your Agent (KYA) obligations;
        Trulioo's own CTO named this concept but no regulatory body has issued formal guidance.
      whyItMatters: >-
        When KYA regulation crystallises, Trulioo will face both a product obligation and a business opportunity;
        the timing and specific requirements are currently unforeseeable.
      diligencePath: >-
        Monitor AMLA, FinCEN, FCA, and FATF publications for any emerging guidance on AI agent verification;
        confirm Trulioo's product roadmap for KYA capability.
      relatedQuestionRefs:
        - QR019

    - type: missing-source
      severity: minor
      topic: corporate-structure-risk
      missingEvidence: >-
        Trulioo's inter-company structure, tax jurisdictions, and regulatory-entity footprint across its
        global operations are not publicly documented.
      whyItMatters: >-
        Transfer pricing, regulatory jurisdiction, and data-residency risks cannot be assessed without
        knowing which legal entities hold contracts, employees, and data in each jurisdiction.
      diligencePath: >-
        Request group structure chart, list of operating entities, and any transfer pricing or VAT/GST
        compliance documentation from management.
      relatedQuestionRefs:
        - QR004

    - type: missing-source
      severity: minor
      topic: boi-cta-coverage
      missingEvidence: >-
        Whether Trulioo's KYB product roadmap has been updated to cover US Corporate Transparency Act BOI
        reporting requirements is not confirmed in public product documentation.
      whyItMatters: >-
        FinCEN's CDD Rule obligations are well-supported by Trulioo's KYB product, but the CTA BOI
        requirements are technically distinct and cover a broader set of legal entities. If Trulioo's
        KYB does not address CTA workflows, customers may need supplemental solutions.
      diligencePath: >-
        Request product roadmap and confirm whether CTA BOI-specific reporting is on the product plan
        or in GA; ask about customer CTA compliance journeys.
      relatedQuestionRefs:
        - QR024

    - type: missing-source
      severity: minor
      topic: registry-contingency
      missingEvidence: >-
        Trulioo has not publicly documented contingency plans for government identity registry access
        disruption in specific jurisdictions, including rollback procedures, alternative source routing,
        and customer notification protocols.
      whyItMatters: >-
        Registry disruption in high-value markets (India, South Africa, Brazil) could degrade coverage
        quality without warning; customers with regulatory obligations may face compliance gaps.
      diligencePath: >-
        Request Trulioo's data source resilience documentation, contingency source mapping, and customer
        SLA provisions for geographic outages.
      relatedQuestionRefs:
        - QR021
      relatedTableRefs:
        - TR003

    - type: enumeration-incomplete
      severity: minor
      topic: regulatory-legal-risk-register
      missingEvidence: >-
        TR001 covers the most significant public-evidence-backed regulatory obligations but does not
        include all potential applicable regimes (e.g., DORA, PSD2, India DPDP Act, Brazil LGPD,
        Singapore PDPA, or MAS requirements) which may apply to Trulioo's customers in those markets.
      whyItMatters: >-
        Trulioo operates in 195 countries; regulatory gaps in jurisdictions outside the US and EU could
        create compliance exposure for Trulioo's customers and reputational risk for the platform.
      diligencePath: >-
        Extend regulatory analysis to APAC and LatAm regulatory frameworks; request compliance attestations
        for all jurisdictions where Trulioo claims authoritative identity verification coverage.
      relatedQuestionRefs:
        - QR001
        - QR003
      relatedTableRefs:
        - TR001


acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      Risk register tables (TR001–TR005) are prescriptive analytical frameworks assessing probability and
      severity; the cells are inherently evidence-based analysis rather than raw data extracts, and a separate
      data-source notes field would add redundancy. Sources are fully cited at the table-level claimRefs.
  - dimension: unverifiedSource
    reason: >-
      Sources SR003 (ICO UK GDPR guidance), SR004 (AMLA EU homepage), SR029 (Entrust Identity Verification),
      SR035 (California AG CCPA page), and SR036 (GDPR Article 22 reference) were fetched directly via curl
      during research and their content informed the claims and risk analysis; they were not routed through the
      fetch-url skill fetch trail due to the manual research workflow used for this chapter.
