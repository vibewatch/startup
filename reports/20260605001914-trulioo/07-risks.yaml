  - id: data-privacy-and-security-risk
    title: Data Privacy, Security, and Compliance Risk
    body: >-
      Identity verification platforms occupy an unusually sensitive position in the privacy landscape. Trulioo
      processes biometric data (document photographs, facial imagery used for liveness and matching), government
      identity records, and consumer financial and demographic data on behalf of regulated financial institutions,
      fintechs, and marketplaces. This creates layered privacy risk across multiple frameworks.

      On data security, Trulioo's mitigation posture is strong relative to market peers. The company holds ISO
      27001 certification since 2015 — an unusually long tenure for a private technology company — and obtained
      SOC 2 Type 2 in February 2024. Its security page describes a multi-layer program including preventive
      controls, awareness training, auditing, incident response, and a dedicated Information Security and
      Technical Compliance team. These credentials materially reduce the probability of a catastrophic breach, but
      do not eliminate it. For a company whose value proposition is trust infrastructure, any publicly disclosed
      breach would be disproportionately damaging — customers' entire compliance onboarding workflow is at stake.

      Cross-border personal data transfer is the most complex privacy risk dimension. Trulioo serves customers
      globally and processes EU data subject information for European customers. Its Services Privacy Policy
      acknowledges international data transfers and references legal mechanisms including Standard Contractual
      Clauses, but does not publicly specify whether it relies on the EU-US Data Privacy Framework adequacy
      decision, Binding Corporate Rules, or exclusively SCCs. Post-Schrems II enforcement by EU data protection
      authorities has increased scrutiny on US SaaS vendors handling EU personal data. If the EU-US adequacy
      framework faces another legal challenge, Trulioo's EU data transfer mechanisms would require immediate
      review. The UK ICO's guidance on lawful bases for processing reinforces that organizations must determine
      their lawful basis before initiating processing — a compliance obligation Trulioo must satisfy for its own
      controller activities as well as document for customers who configure its API-based workflows.

      CCPA/CPRA exposure is active. Trulioo's California Privacy Notice (May 2024) describes consumer rights
      including opt-out of selling or sharing personal information, correction, and deletion. Its services also
      touch health-adjacent data categories (identity for healthcare use cases) that may trigger California
      Consumer Health Data Privacy Law obligations. The company's cookie policy discloses use of third-party
      analytics and marketing technologies, creating ePrivacy and GDPR consent management obligations across
      Trulioo's web properties that must be maintained as regulatory interpretations evolve.

      Automated decision-making risk is structurally embedded in Trulioo's product. Identity verification
      outcomes — approve, decline, flag for review — can determine whether a person gains access to financial
      services, credit, or digital commerce. Trulioo's own Services Privacy Policy acknowledges this, and its
      platform must either offer human review mechanisms or adequate safeguards under GDPR Article 22, equivalent
      CCPA provisions, and emerging EU AI Act provisions as applied to AI-assisted decision-support systems.
