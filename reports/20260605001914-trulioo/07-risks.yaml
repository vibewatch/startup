callouts:
  - calloutType: risk
    title: AMLA Transition Creates Moving Compliance Target for Trulioo's EU Customers
    body: >-
      The January 2026 handover from EBA to AMLA is not a one-time event. AMLA will progressively replace EBA
      guidelines across AML/CFT supervision, CDD standards, and cross-border coordination — each replacement
      creating a new compliance adaptation requirement for Trulioo's platform. Trulioo's 2026 trends blog
      implicitly acknowledges this by calling out fraud and compliance acceleration as defining themes, but no
      public product roadmap confirms AMLA-specific workflow updates.
    claimRefs:
      - CR001
      - CR002
      - CR047
  - calloutType: risk
    title: Valuation and Investor Dynamics Present Structural Exit Risk
    body: >-
      The 4+ year gap since the last equity round, the absence of audited financials, and the 2021 investor
      syndicate's vintage return expectations combine to create a constrained and opaque exit environment.
      The appointment of a new CFO in March 2026 may signal pre-transaction preparation, but no timeline or
      structure has been publicly signalled.
    claimRefs:
      - CR037
      - CR038
      - CR041
      - CR043
  - calloutType: insight
    title: Privacy Policy Stack Width Signals Jurisdictional Compliance Awareness
    body: >-
      Trulioo's five-policy privacy stack — Website Policy, Services Policy, California Notice, Biometric
      Information Policy, and US Consumer Health Data Privacy Policy — demonstrates active jurisdictional
      compliance maintenance. This is above-average for a private company and reduces the probability of a
      US state biometric or health data enforcement surprise, but the Biometric Information Policy is not
      publicly detailed enough to assess its sufficiency under Illinois BIPA's consent and retention requirements.
    claimRefs:
      - CR010
      - CR016

