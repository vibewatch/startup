chapter:
  number: 7
  title: Risks
  summary: >-
    Trulioo's risk profile is moderate-to-high across regulatory, competitive, and financial dimensions.
    The five most consequential risks are: (1) the expanding and transitioning AML/CFT regulatory surface —
    with the EU's AMLA replacing EBA from January 2026 and FinCEN CDD obligations continuously evolving —
    placing persistent compliance obligations on Trulioo's customers and creating adaptation demands on
    Trulioo's platform; (2) data privacy and cross-border transfer exposure across GDPR, CCPA/CPRA, biometric
    privacy statutes, and automated-decision-making obligations that span Trulioo's dual controller/processor
    role; (3) competitive commoditization as Onfido (now Entrust), Jumio, Socure, Persona, and LexisNexis Risk
    — backed by significantly larger parent companies — intensify enterprise pressure in a 16.9% CAGR European
    IDV market; (4) valuation and exit risk stemming from a $1.75 billion benchmark now over four years stale
    with no new equity round since 2021, leaving burn rate, runway, and investor return expectations opaque;
    and (5) execution risk from a compressed leadership transition window in which a new CEO, CFO, CRO, and
    Chief Transformation Officer all joined within twelve months. Mitigations are substantive — ISO 27001 since
    2015, SOC 2 Type 2 since February 2024, updated privacy policies through 2026, and a five-policy privacy
    compliance stack. Residual exposures are highest in beneficial-ownership governance opacity (no ISC filed
    in Canada), absence of audited financials, and the absence of any confirmed SLA or public uptime commitment.

sections:
  - id: regulatory-and-legal-risk
    title: Regulatory and Legal Risk
    body: >-
      Trulioo's most structurally important risk is regulatory. The company operates at the centre of global
      AML/CFT, KYC, and KYB compliance — meaning that every shift in the regulatory frameworks its customers
      must satisfy creates a direct product and commercial obligation for Trulioo.

      The most material near-term regulatory change is the EU transition. From January 1, 2026, all EU-level
      AML/CFT supervisory responsibilities moved from the European Banking Authority to the new Anti-Money
      Laundering Authority (AMLA), headquartered in Frankfurt. AMLA directly supervises selected high-risk
      financial institutions and coordinates national Financial Intelligence Units. Under Article 54 of the AMLA
      Regulation, existing EBA AML/CFT guidelines remain valid until AMLA replaces them — but the timing
      and scope of replacements is not yet fully established, creating a window of evolving obligation for
      Trulioo's EU-based customers. Trulioo's platform must absorb regulatory changes as they propagate from
      AMLA into national supervisory expectations.

      In the US, FinCEN's Customer Due Diligence Rule requires covered financial institutions — including banks,
      broker-dealers, and mutual funds — to identify and verify beneficial owners of legal entity customers
      at 25% ownership threshold, understand customer risk profiles, and conduct ongoing monitoring for suspicious
      transactions. Trulioo's KYB product directly enables compliance with these obligations and its 2025 APAC
      KYB growth press releases confirm its role as a compliance infrastructure provider. The related Corporate
      Transparency Act BOI reporting rule adds another layer of beneficial ownership verification demand that
      Trulioo's customers must navigate; whether Trulioo's product roadmap currently covers CTA-compliant BOI
      workflows is not confirmed from public sources.

      Trulioo's legal and privacy posture is documented across five published policies — Website Privacy Policy
      (updated March 2026), Services Privacy Policy (updated October 2025), California Privacy Notice (updated
      May 2024), Biometric Information Policy, and US Consumer Health Data Privacy Policy. The Services Privacy
      Policy discloses that Trulioo processes personal data both as a data controller (for product development and
      operational purposes) and as a data processor on behalf of customers. Section 9 of that policy includes an
      Automated Decision Making section, acknowledging that identity verification outcomes can have legal or
      similarly significant effects — triggering GDPR Article 22 safeguard obligations and parallel obligations
      under CCPA/CPRA. The existence of a dedicated Biometric Information Policy signals Illinois BIPA exposure
      and awareness of biometric-specific privacy statutes in other US states.

      On corporate governance, the Corporations Canada federal filing lists seven directors including Steve Munford
      (the retiring CEO), but records no individuals with significant control. The absence of beneficial-ownership
      disclosure and the gap between the last confirmed filing period (2020) and the current date creates limited
      visibility into actual ownership and control structure. No public litigation, enforcement actions, regulatory
      citations, or adverse court records against Trulioo were located in available public sources — but the
      absence of public records should not be interpreted as a clean legal history without independent legal
      diligence.
