  - id: trust-security-compliance
    title: Trust, Security, and Compliance
    body: >-
      Trulioo's security posture is anchored by two formally verified certifications: ISO 27001, held
      continuously since 2015, and SOC 2 Type 2, obtained in February 2024. Both are confirmed in the
      company's security page and about-us materials, making them high-confidence, corroborated facts.
      ISO 27001 covers policies, procedures, training, monitoring, auditing, incident response, and
      communications. SOC 2 Type 2 validates how a third-party service provider stores and processes
      customer data to the AICPA cybersecurity framework standard — particularly relevant for enterprise
      buyers requiring evidence of data-handling maturity.

      The customer portal redesign announced in October 2025 added 60+ fraud-identifying signals to the
      transaction review interface, providing audit-trail transparency and risk-assessment support for
      compliance teams. For data residency and cross-border privacy, the Phoenix Digital Health case
      demonstrates Canadian data hosting as a documented deployment capability — Phoenix specifically cited
      PIPEDA compliance and data remaining within Canada as reasons for selecting Trulioo. The regulatory
      compliance page documents support for FinCEN, FINRA, FCA, FINTRAC, CySEC, and other jurisdiction-
      specific regimes, allowing customers to configure verification workflows by region. The company's
      privacy and cookie policies indicate it operates as both a data processor (for customer-of-customer
      verification events) and a data controller (for platform improvement purposes), which creates dual
      privacy-liability exposure the company manages through its services privacy policy.
    claimRefs:
      - CE025
      - CE032
      - CE038
      - CE041
    tableRefs:
      - TE004

  - id: product-tech-risks
    title: Product and Technology Risks
    body: >-
      Five risk themes are material for product and technology assessment. First, AI/ML claim inflation: all
      performance metrics (60% faster processing, 20% higher verification rates, 15% fraud reduction) are
      vendor-authored press release figures with no independent benchmark or academic validation. The company
      acknowledges that advanced fraud techniques including deepfakes account for 16% of all attacks it sees,
      which underscores the adversarial environment but does not provide reproducible model performance data.

      Second, implementation friction at enterprise scale: G2 reviews report a typical 2-month implementation
      time and high perceived cost. The Trust Payments case study shows a best-case deployment but is
      explicitly a partnership showcase. Enterprise customers integrating complex multi-region KYC, KYB, and
      DocV workflows over the existing API surface should budget significant professional services time.

      Third, legacy endpoint complexity: Trulioo operates two parallel authentication systems (Basic Auth for
      legacy v1 and v3 APIs; OAuth 2.0 for the Platform/Workflow Studio API), with four total credential
      mechanisms. This split requires customers to manage multiple credential sets and creates developer
      confusion. The v1 SDK repos are explicitly labelled legacy, suggesting some customers remain on the
      older surface.

      Fourth, privacy and compliance burden: Trulioo operates as both data processor and controller across
      jurisdiction-specific regimes (FinCEN, FCA, FINTRAC, CySEC, etc.). While this breadth is a
      commercial advantage, it also means customers must validate that Trulioo's regime-specific
      configurations match their actual compliance obligations — a review burden that falls on the buyer.

      Fifth, public reliability opacity: no public uptime/SLA commitments, status page URL, or reliability
      metrics were found in the developer documentation, limiting the ability of enterprise buyers to
      contractually anchor service-level requirements without a direct commercial conversation.
    claimRefs:
      - CE035
      - CE039
      - CE040
      - CE043
      - CE044
