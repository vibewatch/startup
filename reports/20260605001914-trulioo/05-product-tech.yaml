  - id: platform-architecture
    title: Platform Architecture and Delivery Model
    body: >-
      The Trulioo architecture centres on GlobalGateway as the routing layer. When a customer submits a Verify
      request, the platform normalizes the payload (PersonInfo, Communication, Location, NationalIds, Documents)
      and routes it across local data sources in the target country, returning a structured result with match
      status and transaction record. The API Evangelist catalog documents four distinct API groups — Verifications
      (KYC), Configuration, Connection, and Business — plus Document Verification, Person Fraud, and Workflow
      Studio APIs, totalling seven OpenAPI specifications. Configuration endpoints enable pre-verification
      discovery: customers query which countries, data sources, document types, and test entities are available
      before submitting live requests, supporting test-driven integration. Connection endpoints expose health-check
      and authentication-test primitives (sayhello and testauthentication) that allow pre-production credential
      validation.

      Four authentication mechanisms are confirmed in developer documentation: HTTP Basic (username/password,
      Authorization: Basic header) for the v3 Verifications, Configuration, Connection, Business, Document
      Verification, and Person Fraud APIs; OAuth 2.0 Client Credentials (two-legged flow at
      auth-api.trulioo.com) for the Platform/Workflow Studio API; HMAC request signing for integrity; and
      mutual TLS (mTLS) for enterprise clients requiring certificate-based authentication. The dual-auth
      architecture (Basic for legacy endpoints, OAuth 2.0 for the newer platform surface) reflects the
      company's evolving API maturity and may require customers to manage two credential sets simultaneously.

      Delivery options span three modes: (1) the hosted Workflow Studio path, where Trulioo manages the UI and
      flow; (2) a low-code Workflow Studio integration using embedded components; and (3) an API-first path
      for teams that want full control. The Document Verification SDK portal advertises integration in "as
      little as 15 minutes" for the SDK capture path. Multi-region hosting is documented in the developer
      portal, and webhooks are delivered via an Event Dispatcher mechanism.
    claimRefs:
      - CE009
      - CE010
