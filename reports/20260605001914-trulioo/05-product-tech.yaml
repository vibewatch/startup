  - id: developer-experience
    title: Developer Experience and Integration
    body: >-
      Trulioo's developer surface is organized around the developer portal at developer.trulioo.com, the SDK
      documentation portal at docs.verification.trulioo.com, and the Knowledge Hub at knowledgehub.trulioo.com.
      The developer portal homepage positions a "fast-track integration" experience with guides, API references,
      and recipes covering authentication, Event Dispatcher webhooks, HMAC signing, and API handshake patterns.
      However, the actual API reference pages for Configuration, Identity Verifications, and Business
      Verification returned minimal readable content in page extraction, indicating that deep API documentation
      is rendered through a JavaScript-heavy documentation platform not fully accessible to crawler-based
      readers. The github.com/api-evangelist/trulioo catalog provides the most accessible machine-readable
      summary of Trulioo's API surface: seven APIs, eleven Naftiko capabilities, JSON Schema for Verify
      Request/Result and Business Record, OpenAPI specifications, and a Spectral rules file.

      SDK coverage is broad: C# (v3), Java (v3), C# v1 legacy, Java v1 legacy, iOS native, Android, React
      Native, Web, and an MCP server for KYB AI agent integration. The llms.txt file at developer.trulioo.com
      indicates that Trulioo has begun positioning its API surface for AI-agent consumption. A sandbox
      environment (Trulidemo) is available for pre-production testing. Platform Update 6.7 is referenced as
      the latest release as of mid-2025, with a public changelog maintained in the developer portal. The
      Trust Payments case study showed the vendor can go live with a customer in record time for enterprise
      deployments, but G2 review data reports a 2-month typical implementation time and high perceived cost —
      the spread between case-study and peer-review data suggests integration complexity at enterprise scale.
