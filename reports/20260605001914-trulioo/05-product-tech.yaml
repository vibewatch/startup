  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: AI-ML-claim-validation
      missingEvidence: >-
        Third-party or independent benchmark results for Trulioo's document verification AI (false
        positive/negative rates, throughput benchmarks, comparative test sets vs Jumio, Onfido, Socure).
      whyItMatters: >-
        All published AI/ML performance improvements are vendor-authored. Enterprise buyers cannot
        calibrate model quality, compare to alternatives, or set contractual accuracy thresholds without
        independent validation data.
      diligencePath: >-
        Request a copy of any third-party DocV benchmark or internal test-set methodology; ask for
        anonymized held-out accuracy data by document type and country; compare against publicly
        benchmarked alternatives.
      relatedQuestionRefs:
        - QE022
        - QE021
      relatedTableRefs:
        - TE002

    - type: missing-source
      severity: material
      topic: SLA-transparency
      missingEvidence: >-
        Trulioo production SLA, uptime commitment, status page URL, and service recovery time objectives
        (RTO/RPO).
      whyItMatters: >-
        Enterprise customers cannot contractually anchor availability requirements without an SLA.
        The absence of a public status page also limits monitoring during incidents.
      diligencePath: >-
        Request a copy of the Master Service Agreement (MSA) SLA addendum; ask for the status page URL
        if one exists behind authentication; obtain historical uptime data for the previous 12 months.
      relatedQuestionRefs:
        - QE026
      relatedTableRefs:
        - TE004

    - type: private-evidence-only
      severity: material
      topic: KYC-KYB-match-rates
      missingEvidence: >-
        Per-country match-rate data for KYC Data and per-jurisdiction UBO coverage rates for KYB,
        benchmarked against disclosed production performance rather than vendor press releases.
      whyItMatters: >-
        Customers deploying in specific geographies need reliable match-rate expectations by country
        to evaluate onboarding cost and conversion forecasts.
      diligencePath: >-
        Request country-level match-rate breakdowns for top deployment markets; ask for UBO accuracy
        methodology for markets with incomplete registry data; review existing customer deployments
        with comparable geography.
      relatedQuestionRefs:
        - QE020
      relatedTableRefs:
        - TE001

    - type: private-evidence-only
      severity: minor
      topic: developer-documentation-depth
      missingEvidence: >-
        Full content of Trulioo's JavaScript-rendered API reference pages for Configuration, Identity
        Verifications, and Business Verification endpoints, which were not extractable from public
        crawls; full Known Faces enrollment requirements and image quality thresholds; details of the
        Platform Update 6.7 release contents.
      whyItMatters: >-
        Deep API documentation coverage assessment required enterprise integration scoping. The API
        Evangelist catalog partially compensates but does not substitute for vendor-managed reference
        documentation. Known Faces technical constraints affect deployment planning.
      diligencePath: >-
        Review the developer portal directly in a JavaScript-enabled browser; evaluate the Developer
        portal Guided Quickstart and Recipes sections for integration complexity signals; request
        Platform Update 6.7 release notes and Known Faces technical spec from Trulioo.
      relatedQuestionRefs:
        - QE014
        - QE015
        - QE016
        - QE027

    - type: missing-source
      severity: material
      topic: competitive-differentiation
      missingEvidence: >-
        Independent side-by-side comparison of Trulioo vs Jumio, Onfido, Socure, or LexisNexis Risk
        on coverage breadth, AI/ML accuracy, pricing, and SLA across key market segments.
      whyItMatters: >-
        Trulioo's differentiation claims are self-asserted. Without an independent analyst or buyer-
        commissioned comparison, the actual competitive edge cannot be quantified for diligence purposes.
      diligencePath: >-
        Commission a Forrester or Gartner evaluation; review identity verification market reports
        (Liminal BEV Index, Gartner Magic Quadrant equivalent); collect reference customer interviews
        across both Trulioo and competing vendors.
      relatedQuestionRefs:
        - QE020
        - QE021

    - type: missing-source
      severity: minor
      topic: privacy-incidents
      missingEvidence: >-
        Documented privacy incidents, regulatory sanctions, enforcement actions, or systemic customer
        complaints relating to Trulioo's data handling, verification accuracy, or platform reliability,
        from regulators, privacy commissioners, or consumer protection agencies.
      whyItMatters: >-
        Absence of public adverse events in the sources reviewed does not guarantee a clean record.
        Regulated customers (especially in financial services) need to verify directly with relevant
        authorities before onboarding a data processor.
      diligencePath: >-
        Search FCA, FinCEN, FINTRAC, PIPEDA/OPC, and other relevant regulatory databases for
        enforcement actions involving Trulioo; review CFPB and equivalent consumer protection records;
        request reference checks from existing regulated customers in the same jurisdiction.
      relatedQuestionRefs:
        - QE024
