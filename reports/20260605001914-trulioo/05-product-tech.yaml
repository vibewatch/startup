callouts:
  - calloutType: strength
    title: GlobalGateway Data-Source Network Breadth
    body: >-
      Trulioo's single-API access to 450+ data sources across 195 countries in 43 languages is the most
      frequently cited competitive moat in analyst commentary and enterprise customer case studies. The depth
      of partner deployments across diverse geographies (J.P. Morgan Payments, Airwallex, Nuvei, eToro,
      Consensys) provides corroborating signals that coverage is operational, not merely catalogued. No
      other single-vendor identity platform has publicly documented equivalent reach.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
  - calloutType: strength
    title: In-House AI/ML Model Stack with Documented Performance Gains
    body: >-
      Trulioo's assertion that it builds and continuously refines proprietary ML models — rather than
      licensing third-party document AI — is a meaningful differentiation signal. The March 2025 release
      delivered measurable improvements: 60% faster processing, 20% higher verification rates, and 20%
      more auto-approvals. The adversarial context (16% of attacks now involve deepfakes or ID alterations)
      makes model quality a recurring investment, which Trulioo appears to treat as a core capability.
    claimRefs:
      - CE015
      - CE016
      - CE017
      - CE027
      - CE028
      - CE035
  - calloutType: risk
    title: All AI/ML Performance Claims Are Vendor-Authored and Unverified
    body: >-
      Every performance metric attributed to Trulioo's AI/ML stack — processing speed, verification rates,
      auto-approval rates, fraud reduction — originates from Trulioo press releases and a single unnamed
      customer case study. No independent benchmark, academic paper, or third-party audit has been
      identified to corroborate these figures. Enterprise buyers should treat these as directional signals
      and request reproducible test-set data from Trulioo before making architecture decisions.
    claimRefs:
      - CE015
      - CE019
      - CE044
  - calloutType: risk
    title: Developer Documentation Partially Inaccessible via Standard Crawlers
    body: >-
      The Trulioo developer portal (developer.trulioo.com) is a JavaScript-rendered documentation
      platform. While the API Evangelist catalog provides an accessible machine-readable summary, the
      actual API reference pages for Configuration, Identity Verifications, and Business Verification
      returned navigation-only content. Enterprise teams evaluating integration complexity should expect
      to rely on the developer portal's rendered experience rather than downloadable specification files
      for initial scoping.
    claimRefs:
      - CE011
      - CE039
  - calloutType: recommendation
    title: Diligence Request Pack for Product and Technology Assessment
    body: >-
      For independent verification: (1) request a third-party DocV benchmark (false positive/negative
      rate on a held-out test set); (2) obtain the SOC 2 Type 2 report covering all Trust Service
      Criteria categories; (3) request a copy of the production SLA and uptime commitment; (4) ask for
      a per-country match-rate breakdown for KYC Data; (5) clarify the credential management
      requirements for deployments spanning both the v3 legacy API and the Platform/Workflow Studio OAuth
      surface; (6) obtain the UBO engine accuracy methodology for markets with incomplete official
      registry data.
    claimRefs:
      - CE043
      - CE044
      - CE025
      - CE039

