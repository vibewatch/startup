- id: drivers-and-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'The growth case is grounded in both regulation and economics. FinCEN''s customer due diligence rule requires financial institutions to identify and verify beneficial owners, develop risk profiles, and conduct ongoing monitoring, while the European Banking Authority notes that AML/CFT responsibilities moved to AMLA from January 2026, underscoring continued regulatory evolution rather than simplification. Trulioo''s 2026 trends report adds a second market driver: fraud is becoming more synthetic, AI-assisted, and lifecycle-wide, which increases demand for predictive risk signals, dynamic KYB, reusable KYC, and agent-era identity models. The constraints are equally important. Buyers still face vendor sprawl, cross-border data inconsistency, false-positive costs, switching friction, and the challenge of aligning legal, compliance, product, and engineering teams around one onboarding design. Competing vendors are also pushing different market shapes: Jumio emphasizes lifecycle identity
    intelligence, Persona modular orchestration, Socure U.S. decisioning depth, Veriff automated global coverage, Alloy open-ecosystem orchestration, Sardine financial-crime automation, and LexisNexis incumbent risk data. Market growth is therefore real, but so is the risk that customers keep multi-homing or internalizing orchestration instead of standardizing on one platform.'
