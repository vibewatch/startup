- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AML/KYC/KYB regulation expands
    - Positive
    - Current to medium term
    - Sustains onboarding-compliance spend
    - Which jurisdictions convert complexity into paid workflow volume?
  - - AMLA transition in Europe
    - Positive + complex
    - 2026 onward
    - Raises need for auditable, adaptable workflows
    - How fast do buyers re-platform versus patch existing tools?
  - - FinCEN beneficial-ownership duties
    - Positive
    - Current
    - Keeps KYB / UBO verification economically relevant
    - What share of spend stays with banks versus PSPs / marketplaces?
  - - AI-driven fraud and deepfakes
    - Positive
    - Current
    - Pushes buyers toward layered IDV plus risk scoring
    - How much budget shifts from point-fraud tools into integrated platforms?
  - - Reusable KYC and orchestration
    - Positive
    - Medium term
    - Rewards vendors that reduce friction and duplicate checks
    - Can Trulioo capture value from workflowing rather than only per-check fees?
  - - Vendor fragmentation
    - Negative
    - Current
    - Encourages multi-vendor stacks and slower consolidation
    - What proof exists that buyers replace, rather than add, vendors?
  - - Switching and integration cost
    - Negative
    - Current
    - Slows displacement of incumbents and in-house stacks
    - How portable are workflows, schemas, and audit logic across vendors?
  - - Cross-border data inconsistency
    - Negative
    - Persistent
    - Creates false positives and manual review costs
    - Which regions remain structurally hard to automate?
  - - Competitor convergence
    - Negative
    - Current to medium term
    - Document, data, and orchestration capabilities are converging fast
    - Where is durable differentiation versus table-stakes parity?
  - - Large-enterprise sales cycles
    - Negative
    - Current
    - Delays realization of top-down TAM
    - What is the average time from pilot to production deployment?
  notes: This table mixes category-level drivers with Trulioo-relevant adoption constraints because the market is governed as much by implementation friction as by raw top-down demand.
