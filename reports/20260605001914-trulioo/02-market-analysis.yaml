- id: sizing-lenses
  title: 'Sizing Lenses: Global Market, Regional Splits, and Serviceable Opportunity'
  body: Public sizing sources are directionally clear even if they are not perfectly consistent. MarketsandMarkets projects the global identity verification market from $14.34 billion in 2025 to $29.32 billion by 2030, implying a 15.4% CAGR. The same publisher shows Europe moving from $3.53 billion to $7.72 billion over the same period, APAC from $2.73 billion to $6.02 billion, and the U.S. from $4.34 billion to $8.16 billion. Trulioo's own June 2023 product release cited Liminal research on a larger integrated identity-platform TAM of $48.1 billion in 2023 growing to $115.9 billion by 2027, which is useful but clearly based on a broader platform framing than the narrower identity-verification market report. The right interpretation is that Trulioo's serviceable market sits between pure IDV and full-stack digital trust infrastructure. Its SAM is biggest where onboarding is cross-border, compliance-heavy, and business plus person verification are both required. Its SOM is then constrained
    by product fit, regulatory coverage, enterprise sales cycles, and displacement of incumbent or multi-vendor stacks rather than by the absolute size of top-down TAM estimates alone.
