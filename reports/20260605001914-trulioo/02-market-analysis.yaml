  evidenceGaps:
  - type: missing-source
    severity: material
    topic: bottoms-up-sam
    missingEvidence: A bottoms-up public source that links identity-verification spend to Trulioo-relevant verticals, customer counts, and workflow layers.
    whyItMatters: Top-down market estimates alone do not establish the portion of spend Trulioo can actually capture with its product mix and go-to-market motion.
    diligencePath: Build a bottoms-up model using customer counts, regulatory entities, and per-account verification volumes by vertical.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: vertical-arr-mix
    missingEvidence: ARR, gross margin, and customer count by segment such as banking, payments, marketplaces, wealth, crypto, and healthcare.
    whyItMatters: Without vertical mix, it is difficult to translate the broad market opportunity into Trulioo’s real SAM, concentration, and expansion vectors.
    diligencePath: Request segment revenue and customer-count disclosures from management or investors.
    relatedQuestionRefs:
    - QM024
  - type: conflicting-data
    severity: material
    topic: tam-definition
    missingEvidence: A reconciled framework explaining how pure identity-verification market reports map to integrated identity-platform TAM figures.
    whyItMatters: Using mismatched category definitions can materially overstate or understate the market that matters for valuation.
    diligencePath: Normalize the publisher definitions and classify each into IDV-only, onboarding-compliance, or integrated digital-trust buckets.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM001
    - TM002
  - type: stale
    severity: minor
    topic: ai-agent-spend
    missingEvidence: Independent 2026 data on how much KYA or AI-agent identity demand is incremental software spend rather than repositioned feature messaging.
    whyItMatters: KYA expands the narrative opportunity set, but the revenue impact is not yet measurable from public evidence.
    diligencePath: Track analyst reports, early customer launches, and contract language that separately prices AI-agent identity controls.
    relatedQuestionRefs:
    - QM025
