chapter:
  number: 6
  title: Customers
  summary: >-
    Trulioo's enterprise customer base spans global payments, fintech, banking, crypto, marketplaces, and digital
    health, with named production proof across at least 10 public accounts including Airwallex, J.P. Morgan Payments,
    Trust Payments, Public, Phoenix Digital Health, Nium, Consensys, eToro, and Stake. The strongest evidence is
    the multi-product, multi-year Airwallex relationship (seven years, three product lines, 181 countries), the
    Trust Payments vendor-consolidation case (five vendors replaced, 85% match rate), and the J.P. Morgan Payments
    partnership at payments infrastructure scale. Critical evidence gaps include total customer count, NRR, GRR,
    churn, and revenue concentration, which the public record does not disclose.
sections:
  - id: section-1
    title: >-
      Customer base spans global payments, banking, crypto, marketplaces, and emerging verticals
    body: >-
      Trulioo's enterprise customer base is anchored in global payments and fintech but extends across five or more
      distinct verticals. The December 2023 growth release reveals the shape of the installed base with specific
      claim sets: three of the five largest U.S. banks, six of the seven largest global digital payment processors,
      five of the world's leading online marketplaces, four of the five largest international foreign exchange
      brokers, and three of the four leading crypto exchanges. These are vendor-authored claims without named
      customers or independent confirmation, but they provide a structural view of where Trulioo has penetrated
      as of late 2023. The payments and fintech segment is the core ICP: the J.P. Morgan Payments partnership,
      the Airwallex relationship, Trust Payments, Nium, and Nuvei all represent payment-infrastructure or
      payment-platform buyers verifying their own onboarding pipeline.

      Beyond payments, crypto has been a meaningful early segment. Three of the four top crypto exchanges are
      cited as customers as of 2023, and eToro, a multi-asset trading platform used globally, is a named case
      study reference. The Singapore office opened in September 2022 partly to serve crypto-heavy APAC demand.
      Online marketplaces represent a third cluster: five of the world's leading online marketplaces are claimed,
      and at least one unnamed marketplace case study covers ten key markets for trust and safety. Consensys,
      the Ethereum and MetaMask infrastructure company, provides proof of crypto-adjacent KYB+KYC onboarding.

      APAC growth since 2023 has diversified the base. The April 2025 APAC growth announcement shows 64%
      year-over-year revenue growth, with marketplace transactions up 37% and fintech enterprise transactions
      up 55%. HG Insights installation data on TrustRadius shows Finance and Insurance as the most frequent
      vertical at 29.6% of 81 detected installations, followed by Information at 22.2% and Professional,
      Scientific, and Technical Services at 16%. Healthcare entered the named customer roster in April 2026
      with Phoenix Digital Health, Canada's leading telehealth platform, selecting Trulioo for patient identity
      verification. This vertical diversification—from fintech into healthcare—indicates Trulioo is expanding
      beyond its core ICP as compliance-driven onboarding requirements spread into new industries.
