callouts:
  - calloutType: strength
    title: Multi-product, multi-year anchor account proof spans global payments and banking
    body: >-
      The Airwallex (7 years, 3 products, 181 countries) and J.P. Morgan Payments (global scale, named VP
      quote) relationships are the strongest public enterprise proofs: they show Trulioo winning and retaining
      complex, compliance-intensive accounts at global scale, with named executives confirming the platform
      rationale.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU013
  - calloutType: insight
    title: Vendor consolidation and land-and-expand patterns are both visible in the named account set
    body: >-
      Trust Payments replacing five vendors and Airwallex expanding from KYC to KYB+IDV represent two
      distinct expansion vectors—consolidation wins and multi-product deepening—both of which imply
      growing switching costs and larger per-account economics over time.
    claimRefs:
      - CU008
      - CU015
      - CU035
      - CU036
      - CU038
  - calloutType: risk
    title: NRR, GRR, churn, and revenue concentration are all undisclosed and cannot be inferred from public data
    body: >-
      The absence of published retention and concentration metrics means durability underwriting depends
      entirely on management disclosure. Anchor accounts like Airwallex and JPM are plausibly large enough
      to create meaningful concentration risk if lost, and no public data resolves whether new account adds
      are replacing churned logos or compounding a growing base.
    claimRefs:
      - CU044
      - CU045
      - CU046
      - CU047
      - CU048
      - CU049
      - CU050

acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      The planned Retention / repeat cohort figure requires time-bucket retention percentages (month-1/3/6 or
      year-1/2). Trulioo does not publish NRR, GRR, churn, or any customer cohort retention data. A substitution
      table (TU006) covers the same scope with available proxies and explicit null disclosures. Acknowledging
      figureType rather than fabricating cohort data.

