  - id: section-4
    title: >-
      APAC expansion is the clearest customer growth signal; KYB adoption rate supports land-and-expand hypothesis
    body: >-
      Trulioo's APAC expansion provides some of the strongest available proxies for customer growth and
      product adoption. The April 2025 revenue announcement reports 64% year-over-year APAC revenue growth,
      driven by a 37% increase in marketplace verification transactions and a 55% increase among fintech
      enterprises. While these are revenue, not customer count, figures, they imply meaningful account
      penetration across two of Trulioo's largest segments. The April 2026 APAC press release on UBO
      discovery reports 51% year-over-year growth in APAC business verification volume in 2025, with
      specific UBO coverage improvements: 98% in Vietnam, 70% in the Philippines (69-point uplift),
      and 81% in Singapore (24-point uplift) for a large unnamed social media platform.

      KYB adoption provides a multi-year growth lens. Trulioo reported 586% growth in U.S. KYB adoption
      since 2020 as of June 2023, driven by financial services companies and e-commerce marketplaces
      adjusting to the INFORM Consumers Act and evolving AML/KYC requirements. Among 2023 new customers,
      40% specifically adopted KYB capability. These figures suggest that a growing share of the installed
      base uses Trulioo as a combined KYC+KYB platform rather than a single-product KYC vendor, which
      is exactly the profile that supports higher switching costs and larger per-account economics.

      The Singapore office, opened in September 2022, serves as a hub for APAC customer support and
      operations, signaling a deliberate geographic build-out rather than passive demand capture. This
      infrastructure investment supports the APAC growth claim, though the absolute size of the APAC
      customer count remains undisclosed. The combination of named named accounts like Airwallex
      (180 countries), Nium (190+ payout markets), and the unnamed social media platform with APAC
      UBO capabilities suggests Trulioo is serving global companies that require cross-border and
      multi-jurisdiction coverage—not just domestic players with simple single-country verification needs.
    claimRefs:
