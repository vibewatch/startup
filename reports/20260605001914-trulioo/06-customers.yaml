  - id: section-2
    title: >-
      Named customer proof is strongest in global payments and fintech, with growing evidence across crypto and healthcare
    body: >-
      The highest-quality public customer evidence involves multi-year, multi-product, multi-geography deployments.
      Airwallex is the flagship reference: the September 2024 partnership expansion announcement documents a
      seven-year relationship beginning in 2017 with Person Match and Identity Document Verification in APAC,
      later extended to the Americas and Europe, and further expanded in 2022 with Business Verification for
      KYB and beneficial-owner screening. Trulioo has verified passports from 162 countries, ID cards from 119
      countries, and 104 types of driver's licenses for Airwallex across 181 countries. Airwallex secures
      more than 100,000 global businesses and has an annual processing volume of over $100 billion. Airwallex's
      VP of IT and Information Security, Elliot Colquhoun, confirmed the dynamic nature of the partnership:
      Trulioo adapts identity workflows over time to outpace fraud and maintain compliance.

      J.P. Morgan Payments selected Trulioo in October 2023 to support global person and business verification
      for its clients. The JPM global head of Trust and Safety, Ryan Schmiedl, publicly cited Trulioo's breadth
      of PII data sources, match rates, and global footprint as the selection criteria. J.P. Morgan processes
      more than $9 trillion in payments per day across more than 160 countries. Trust Payments, a European
      payments company serving 20,000 businesses with over £1 billion in monthly volume, went live with
      Trulioo in June 2025. Prior to Trulioo, Trust Payments operated a fragmented stack spanning five vendors;
      after integration, the company achieved an 85% verification success rate in key markets and replaced
      its multi-vendor complexity with a single platform covering KYC, KYB, watchlist screening, and
      Workflow Studio. The CEO quote describes this as a "new digital direction for our onboarding."

      Public, the U.S. multi-asset investing platform, chose Trulioo Person Match for its U.K. launch in
      2023, citing the need for global capabilities to address AML and KYC requirements. Phoenix Digital
      Health, Canada's leading telehealth platform, selected Trulioo KYC Documents in April 2026 to verify
      patient identities and comply with PIPEDA, with Canadian data hosting as a specific requirement. The
      Phoenix partnership adds healthcare as a sector where identity-at-onboarding is a compliance obligation,
      consistent with Trulioo's stated expansion into new regulated verticals.

      In the case study library, Nium used Trulioo to navigate diverse regulatory requirements for
      cross-border payments, Consensys used Trulioo for KYB and KYC onboarding efficiency gains, eToro
      used Trulioo to expand to new markets with compliant onboarding, and Stake used Trulioo to open
      access to U.S. investment markets for its global customer base. Additional unnamed case studies
      include a crypto exchange that achieved a predicted 180,000 additional users annually and a 5%
      average performance increase, a remittance company that achieved $1.5 million in additional annual
      revenue attributable to Trulioo value optimization, and an unnamed fintech company that improved
      match rates by 18% after switching to Trulioo. These unnamed accounts are vendor-authored and
      cannot be independently verified, but the specificity of outcomes (dollar revenue, user counts,
      match-rate improvements) suggests verified case studies rather than fabricated testimonials.
