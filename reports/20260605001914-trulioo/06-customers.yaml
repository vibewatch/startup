figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Trulioo enterprise customers typically enter through a compliance-driven RFP or regulatory-event trigger,
      land on a single verification product, then expand to multi-product and multi-geography deployments
      driven by new market entry or regulatory mandate.
    data:
      nodes:
        - id: trigger
          label: Compliance trigger
          detail: >-
            A regulatory event (INFORM Act, CDD Rule, FCA AML mandate, PIPEDA), market expansion, or fraud
            incident creates urgency for a verified identity solution at enterprise scale.
          tone: neutral
        - id: evaluate
          label: Evaluate and RFP
          detail: >-
            Enterprises evaluate Trulioo against Jumio, Onfido, Socure, and internal builds on match rate,
            global coverage, API quality, and compliance breadth. G2 shows 2-month typical implementation.
          tone: neutral
        - id: land
          label: Land (single product)
          detail: >-
            Account lands on Person Match, IDV, or Business Verification via a regional or use-case-specific
            deployment. Airwallex began in APAC with KYC; Public landed with Person Match for UK AML compliance.
          tone: positive
        - id: embed
          label: Workflow embed and API integration
          detail: >-
            65% of 2023 new accounts chose Workflow Studio for configurable compliance workflows. API and SDK
            integration creates operational stickiness; audit trail and data-source configuration are expensive to migrate.
          tone: positive
        - id: expand
          label: Multi-product and geo expansion
          detail: >-
            Account adds KYB (Airwallex added BV in 2022, Trust Payments deployed KYB+KYC+Watchlist), expands
            to new geographies (Airwallex from APAC to Americas and Europe), or deepens to Fraud Intelligence.
          tone: positive
    approximationNotes: null
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU007
      - CU017
      - CU036
      - CU038

  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      Enterprise adoption follows a compliance-trigger entry, single-product landing, API integration, and
      multi-product expansion path; APAC is the fastest-scaling leg of the funnel.
    data:
      nodes:
        - id: awareness
          label: Regulatory trigger and awareness
          detail: >-
            Regulatory mandates (CDD, INFORM, FCA, PIPEDA), market expansion, or fraud incidents create enterprise
            demand; Trulioo is positioned as a global single-platform alternative to point solutions.
          tone: neutral
        - id: evaluation
          label: RFP and evaluation
          detail: >-
            Enterprise buyers evaluate match rate, coverage (195 countries, 14,000+ documents, 700M business
            entities), pricing, and integration complexity. G2 implementation cost rated $$$$$.
          tone: neutral
        - id: land
          label: Single-product go-live
          detail: >-
            Account goes live on KYC Person Match, IDV, or KYB; 65% choose Workflow Studio at landing;
            40% launch with KYB capability.
          tone: positive
        - id: expand
          label: Multi-product and geographic expansion
          detail: >-
            Anchor accounts add KYB, Watchlist Screening, Fraud Intelligence; APAC transactions +55% fintech,
            +37% marketplace YoY.
          tone: positive
        - id: renewal
          label: Renewal and concentration risk
          detail: >-
            No NRR or GRR disclosed; anchor accounts like Airwallex (7+ years) and JPM Payments signal durability
            but concentration risk exists without top-account revenue disclosure.
          tone: warning
      edges:
