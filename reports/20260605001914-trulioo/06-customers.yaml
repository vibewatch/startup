  - id: section-3
    title: >-
      Review signals are thin but confirm integration complexity; multi-product expansion is the most visible stickiness signal
    body: >-
      Third-party review platforms show limited but informative signals. FeaturedCustomers reports 27 customer
      reviews and testimonials alongside 29 case studies, suggesting a healthy reference base for a
      B2B enterprise product. G2's profile reflects high perceived cost ($$$$$ rating) and a typical
      implementation time of two months; notably, the profile indicated no new review had been received in
      two months as of a May 2026 snapshot. TrustRadius shows a single review with a perfect 10 out of 10
      score. Software Advice lists Trulioo as GlobalGateway with available reviews. These thin review signals
      are consistent with an enterprise product where procurement occurs through direct sales and RFP
      processes rather than self-serve, but they also mean there is limited independent evidence of
      post-implementation satisfaction or renewal behavior.

      The strongest visible stickiness is multi-product expansion within accounts. The Airwallex case shows a
      progression from two products in 2017 (Person Match and IDV) to three products in 2022 (adding Business
      Verification), covering an ever-expanding geography from APAC to Americas and Europe. Among the 2023
      new customer cohort, 65% chose Trulioo's workflow capabilities (Workflow Studio) specifically, and 40%
      adopted KYB capability—signals that accounts are landing on a broader platform rather than a single
      point solution. Trust Payments replaced a five-vendor stack with Trulioo, which represents the opposite
      of typical churn dynamics: customers are consolidating onto Trulioo, not away from it.

      Nuvei's Senior Vice President of Global Risk and Underwriting, Philippe Panneton, offered a direct
      product comparison in a 2023 press release: "With Trulioo, we can do both KYB and identity
      document-based KYC checks with one solution, turning a previously cumbersome onboarding process
      into one that is quick and easy. This has enabled us to remain compliant across multiple continents
      and provide payments solutions that accelerate our customers' businesses." This type of quote from
      a named VP with a specific workflow and compliance outcome is a higher-quality reference than a
      generic vendor mention. It also reinforces the land-and-expand thesis: customers land on one
      verification product and expand to the combined KYB+KYC platform. The switching cost comes from
      API integration depth, compliance workflow configuration, and the difficulty of migrating data
      sources and audit trails to a new vendor mid-deployment.
