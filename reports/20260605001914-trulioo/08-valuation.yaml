  - id: recommendation-exit-readiness-and-kill-triggers
    title: Recommendation, exit readiness, and kill triggers
    body: >-
      Recommendation: track. The correct posture at current evidence quality is not buy and not
      avoid, but rigorous monitoring combined with a structured diligence agenda. Trulioo is a
      high-quality platform asset in a fast-growing category, but the evidence base for
      underwriting the 2021 price is incomplete.

      The case for upgrading to buy requires: (1) audited financials confirming the ARR trajectory
      and gross margin profile; (2) customer concentration data confirming that the top five accounts
      do not drive more than 40-50% of ARR; (3) a confirmed 409A or board-approved enterprise value
      within the last 12 months; (4) net revenue retention data confirming expansion-led growth
      rather than churn-and-replace; and (5) runway confirmation that no new dilutive round is
      required in the next 18-24 months.

      Exit readiness is moderate. The company has credible paths: IPO in a constructive market (the
      new CFO and executive team signal preparation for public-company governance), strategic M&A
      (fintech-infrastructure buyers including RELX, Experian, Mastercard, TransUnion, and large
      payment processors are natural acquirers), or secondary tender (TCV and institutional co-investors
      may create secondary supply at some discount to the 2021 mark). The APAC growth story, new
      platform capabilities, and the J.P. Morgan Payments partnership create a fresh proof-point
      runway that management can use to build an updated investor narrative.

      Kill triggers are specific. A third CEO transition within 24 months — beyond the Munford-to-Bindra
      change — would break the thesis. A new equity round below $1.3 billion post-money would confirm
      a down round and re-anchor valuation materially. Regulatory enforcement action against Trulioo
      or a major customer citing Trulioo's verification as a compliance failure would create legal and
      reputational contagion. ARR growth falling below 10% year-over-year for two consecutive quarters
      would remove the growth premium. Customer concentration exceeding 50% in any single account
      (revealed through diligence) would add a binary revenue risk that the current price does not price.
