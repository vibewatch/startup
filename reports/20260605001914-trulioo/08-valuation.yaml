  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited financials
        - Independently audited revenue, gross margin, EBITDA, and burn rate for 2023 and 2024
        - Third-party ARR estimates (Latka) cannot be underwritten without audit; margin profile determines multiple
        - Request from management; engagement with audit firm
      - - Customer concentration schedule
        - Revenue from top-10 customers; ARR cohort analysis; NRR by vintage
        - Trulioo's 450-customer base could be highly concentrated; top-1 > 25% ARR would be a structural risk
        - Request from CFO (Uri Zelmanovich); cross-reference with enterprise account list
      - - 409A / board-approved enterprise value
        - Most recent 409A valuation or formal board-approved EV; any secondary transaction price
        - No arms-length price reference exists since June 2021; 4+ year gap leaves entry price unsupported
        - Request from management and lead investor TCV; review board minutes if accessible
      - - Preference stack and cap-table waterfall
        - Full cap-table by series; liquidation preferences; participation rights; anti-dilution terms
        - $477M raised across 8 rounds could create a preference structure that absorbs all common equity below $2B
        - Request legal documents from company counsel; review Series D certificate of incorporation
      - - Runway and financing plan
        - Cash position, monthly burn rate, and next 18-month capital plan
        - No new round since 2021; if burn is significant, a dilutive round may precede any exit
        - Request CFO financial model; review board-approved budget
      - - Beneficial ownership (ISC)
        - Individuals with significant control per Corporations Canada filing obligation
        - No ISC filed as of June 2026; ultimate beneficial ownership is opaque from a governance standpoint
        - Request ISC confirmation from management; consult Corporations Canada registry directly
    notes: Diligence asks are ranked by materiality; audited financials and 409A valuation are blocking items that should be resolved before any investment commitment.
