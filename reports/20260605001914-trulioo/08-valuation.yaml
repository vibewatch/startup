  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Third CEO transition within 24 months
        - Any confirmed CEO change before April 2027
        - Signals persistent leadership instability; undermines execution confidence
        - Exit or immediate diligence hold
      - - New equity round below $1.3B post-money
        - Any confirmed raise with post-money < $1.3B
        - Confirms down round; re-anchors fair value; compresses exit IRR
        - Exit at reduced conviction; re-evaluate exposure
      - - ARR growth below 10% for two consecutive quarters
        - Sustained single-digit growth vs 29% 2024 baseline
        - Removes growth premium; base-case slips toward bear
        - Downgrade to avoid; reprice exposure
      - - Regulatory enforcement naming Trulioo as compliance failure
        - Any formal regulatory action in EU, UK, US, or Canada
        - Creates liability, customer exits, and reputational contagion
        - Immediate exit trigger regardless of price
      - - Customer concentration above 50% in single account (revealed in diligence)
        - Top-1 account > 50% of ARR
        - Binary revenue risk; single-account churn is existential
        - Structural deal-breaker; cannot close without mitigation
      - - Preference overhang confirmed to absorb all exit proceeds below $2B
        - Cap-table waterfall showing < 15% common equity return at $1.75B exit
        - Liquidation preference math eliminates equity upside for secondary buyers
        - Reprice or decline secondary positions; preference terms control outcome
    notes: Kill triggers are forward-looking risk thresholds; current public evidence does not confirm any trigger has been breached as of June 2026. Preference waterfall cannot be verified without cap-table access.
