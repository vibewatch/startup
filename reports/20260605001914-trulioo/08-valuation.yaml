chapter:
  number: 8
  title: Valuation
  summary: >-
    Trulioo's last public anchor is a $1.75 billion post-money Series D (June 2021). At 2024's third-party-reported
    $150.6 million ARR that implies approximately 11.6x trailing revenue — a premium to public IDV comps but
    directionally defensible given 29% ARR re-acceleration, 64% APAC growth, and a new executive team signalling
    next-phase ambition. The investment case is structurally sound but materially constrained by private-company
    opacity: no audited financials, no post-2021 secondary transaction, no 409A disclosure, and a governance gap
    (no ISC filed with Corporations Canada). Valuation confidence is medium. The recommendation is to track with
    a structured diligence agenda before pricing any secondary position.

sections:
  - id: investment-thesis-and-anti-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive case for Trulioo is built on three converging forces. First, the market is large and
      structurally growing: the European identity verification segment alone is projected to expand from
      USD 3.53 billion in 2025 to USD 7.72 billion by 2030 at a 16.9% CAGR, and Trulioo's 29% ARR growth
      in 2024 significantly exceeds that market rate, implying share gain. Second, the product architecture
      — single API, single contract, 195-country coverage across person verification, business verification,
      document verification, watchlist screening, fraud intelligence, and workflow orchestration — is harder
      to replicate than a point solution, and the KYB mix shift (586% US growth since 2020, 51% APAC UBO
      volume growth in 2025) points to higher-value workflows replacing simpler identity checks. Third, the
      executive team that will execute the next chapter is new and fintech-credentialed: Vicky Bindra (formerly
      COO and CPO at Nuvei, with prior senior roles at FIS, Visa, and Mastercard) became CEO in April 2025,
      supported by a CFO, CRO, and Chief Transformation Officer all hired in March 2026.

      The anti-thesis is equally clearly defined. Trulioo's $1.75 billion valuation mark is now over four
      years stale. Revenue data comes from a third-party data service (Latka) rather than audited accounts.
      The capital structure carries $477 million in total raised — a substantial preference overhang that
      creates dilution pressure on common equity. Corporations Canada confirms no individuals with significant
      control (ISC) have been filed, meaning the beneficial ownership structure is opaque from a governance
      perspective. Competition is intensifying: Socure claims 3,000-plus customers including 18 of the top
      20 US banks, and Jumio processes 120 transactions per second with 300-plus patents. Headcount fell from
      approximately 405 in 2024 to approximately 375 in 2026, a trajectory that is ambiguous — it could reflect
      efficiency gains or growth-capacity compression. The current price requires trusting unaudited growth
      signals, an unexpired leadership transition, and a private-market illiquidity premium that has no
      confirmed secondary reference.
