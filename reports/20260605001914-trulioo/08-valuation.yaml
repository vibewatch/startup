  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials
      missingEvidence: >-
        Independently audited revenue, gross margin, EBITDA, burn rate, and net revenue retention for
        Trulioo's 2023 and 2024 financial years. Current ARR data comes exclusively from the third-party
        Latka platform, which derives revenue estimates from founder interviews rather than audit-verified accounts.
      whyItMatters: >-
        The $1.75 billion valuation cannot be underwritten without knowing whether reported ARR reflects
        GAAP revenue, and without gross margin and NRR data, the quality of that revenue and the platform
        economics cannot be assessed. This is the single most important diligence blocker.
      diligencePath: >-
        Request audited financial statements directly from management; confirm audit firm; review for
        revenue recognition policies, product-mix disclosure, and margin profile. Also request a financial
        model or bridge to audited figures.
      relatedQuestionRefs:
        - QV022
        - QV012
      relatedTableRefs:
        - TV006

    - type: private-evidence-only
      severity: material
      topic: cap-table-preferences
      missingEvidence: >-
        Full cap-table by financing round, including liquidation preferences, participation rights, weighted-average
        anti-dilution provisions, and conversion terms for all eight rounds. The preference waterfall
        determines how exit proceeds are distributed and whether common equity holders receive any return
        at a $1.75 billion exit price.
      whyItMatters: >-
        With $477 million total raised across eight rounds, the preference stack could consume all
        common equity proceeds at exit prices below $2 billion. A secondary investor entering at the
        2021 mark may receive a very poor common-equity return even in a base-case exit scenario.
      diligencePath: >-
        Request certificate of incorporation and any Series D or earlier financing documents from company
        counsel; model waterfall at various exit prices ($1.25B, $1.50B, $1.75B, $2.00B, $2.50B).
      relatedQuestionRefs:
        - QV009

    - type: missing-source
      severity: material
      topic: current-market-sentiment
      missingEvidence: >-
        A current analyst survey or report covering private-market sentiment for identity verification
        and regtech companies in 2025-2026, including observed private-round multiples and acquirer appetite.
        Available analyst data (MarketsandMarkets) covers market size but not private-company valuation multiples.
      whyItMatters: >-
        The multiple-compression assertion in the bear case and the base case relies on general inference
        from public-market comparable repricing rather than direct evidence of where private IDV companies
        are transacting in 2025-2026. If the private market has re-rated upward, the base case is conservative.
      diligencePath: >-
        Obtain Liminal, Pitchbook, or dedicated IDV-sector investor reports covering 2025-2026 transaction
        multiples; seek public filings from RELX or Experian that reference IDV investment activity.
      relatedQuestionRefs:
        - QV032

    - type: enumeration-incomplete
      severity: minor
      topic: comparable-valuation-table
      missingEvidence: >-
        Socure, Veriff, and Jumio do not publicly disclose audited revenue or confirmed post-money valuations;
        several European IDV vendors (Sumsub, AU10TIX, IDnow, iProov) and payment-infrastructure comparables
        are excluded from TV004 due to insufficient public financial data.
      whyItMatters: >-
        The comparable set is drawn from marketing materials rather than audited financials; the absence of
        confirmed private-round multiples for Socure, Veriff, and Jumio limits precision in comparable-set
        multiple triangulation, potentially widening the scenario range for Trulioo.
      diligencePath: >-
        Seek Pitchbook, Preqin, or CB Insights private-round data for Socure, Veriff, and Jumio;
        review any IPO filings or RELX/Experian acquisitions of comparable companies for revenue multiples.
      relatedQuestionRefs:
        - QV032
      relatedTableRefs:
        - TV004

