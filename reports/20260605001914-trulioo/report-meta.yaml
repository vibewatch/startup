  headquarters: Vancouver, British Columbia, Canada
  productSummary: >-
    Trulioo sells a modular global compliance platform through a single API and Workflow
    Studio, offering person identity verification, business entity verification with UBO
    discovery, AML watchlist screening, document verification, and risk-scoring services
    for regulated digital businesses.
  customerFocus: >-
    Regulated digital enterprises including banks, payment processors, fintechs,
    marketplaces, crypto exchanges, and digital health platforms that require multi-country
    KYC, KYB, AML, and fraud-prevention workflows.
  businessModel: >-
    Consumption-based per-check pricing model with workflow-based components; customers pay
    per verification transaction rather than a flat SaaS seat fee, creating revenue
    variability correlated with customer transaction volumes.
  stage: Series D private company
  fundingStatus: >-
    Last public funding event was the $394 million Series D in June 2021 at a $1.75 billion
    post-money valuation led by TCV, with participation from Goldman Sachs, American Express
    Ventures, Citi Ventures, and Blumberg Capital. No follow-on round or secondary
    transaction has been confirmed as of June 2026.
