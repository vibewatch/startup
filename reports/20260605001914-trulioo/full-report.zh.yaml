      - number: '4.4'
        title: 资本充足性与融资背景：2021 年 Series D 独角兽，未确认后续融资
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的公开资本基础仍锚定在 2021 年 6 月 Series D，当时公司融资 $394 million，据称投后估值 $1.75 billion。公开来源一致将 TCV 列为领投方，也提到
              American Express Ventures、Citi Ventures、Blumberg Capital 和 Mouro Capital 参投；第三方资料则称披露融资总额约 $477
              million、横跨八轮。这给 Trulioo 留下了可观的历史资本缓冲，但也意味着估值标记已经陈旧：到 2026 年 6 月，最后一次确认的股权基准已超过四年。2021
              年以来没有公开确认的后续融资，可以有两种读法。正面看，ARR
              增长、员工纪律和持续发货可能拉长了现金跑道，使公司避开艰难融资市场。更谨慎地看，公开来源无法证明公司是现金流为正、只是在保守用钱，还是使用了记录中未浮现的私人信贷。联邦公司文件只补充结构背景，显示它是一家不向公众发行证券、股东不超过
              50 人的公司。以 2021 年约 $100 million ARR 为锚，Series D 估值隐含 ARR 倍数为高个位数，大约 7 到 10 倍；这在 2021
              年可以辩护，但没有新的管理层材料，不能当作当前私募市场标记。
