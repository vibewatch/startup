    type: matrix
    layout: wide
    summary: 将 Trulioo 的主要风险按严重性放入 3×3 可能性—影响矩阵。最高严重性集群（中高可能性、高影响）包括监管暴露面扩大、数据源依赖和竞争商品化。
    data:
      columns:
