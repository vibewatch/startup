  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Private and public companies with direct overlap in identity verification, KYC/KYB, or risk-data infrastructure
        operating as of June 2026; excludes unlisted private companies without disclosed funding or valuation data.
    columns:
      - 可比公司
      - 类型
      - 指标 / 状态
      - 相关性
      - 局限
    rows:
      - - RELX (LexisNexis Risk Solutions)
        - 上市母公司 / 潜在收购方
        - 数十亿美元级上市公司；收入经审计
        - B2B 身份与风险数据领域最接近的大盘可比；战略收购方候选
        - 业务高度多元；IDV 只是众多业务单元之一；倍数不可直接比较
      - - Experian
        - 上市身份 / 信用数据
        - 已上市；全球信用与身份服务
        - IDV 产品有重叠；监管护城河可比
        - 信用数据占收入大头；IDV 组合与 Trulioo 明显不同
      - - TransUnion
        - 上市身份 / 信用
        - 已上市；身份验证与欺诈产品
        - 偏美国的 IDV 与欺诈同业；定位于监管合规
        - 地理覆盖小于 Trulioo 宣称的 195 个国家
      - - Socure
        - 私营 / 后期阶段
        - 3,000+ 客户；美国前 20 大银行中 18 家；VC 支持下估值较高
        - 美国市场最好的规模化企业 IDV 私营同业
        - 高度聚焦美国；公开 KYB 披露有限；产品组合不同
      - - Veriff
        - 私营 / 成长期
        - 3,000+ 企业；宣称 99.6% 准确率；欧洲背景
        - 欧洲 IDV 同业；差异化聚焦准确率
        - 规模小于 Trulioo；公开确认的美国银行渗透有限
      - - Jumio
        - 私营 / 成熟期
        - 120 TPS 处理能力；300+ 专利；企业 IDV
        - 产品架构最接近的可比（文档 + 生物识别 + KYB）
        - Centana Growth Partners 之后没有公开融资数据；估值不透明
      - - Mastercard
        - 合作伙伴 / 生态语境
        - 全球支付网络；布局身份领域
        - 说明企业支付生态对身份服务的需求
        - 不是直接的 IDV 收入可比；合作关系验证市场定位
    notes: 可比公司来自公开营销数据和第三方分析师画像；Socure、Veriff 或 Jumio 都没有经审计 收入或确认估值数据。可比范围不完整；若干未上市欧洲 IDV 厂商被排除。
