            body: >-
              Trulioo 声称其构建并持续打磨自有 ML 模型，而不是授权使用第三方文档 AI；这是一条有意义的差异化信号。2025 年 3 月发布带来可量化改善：处理速度快 60%、验证率高 20%、自动批准多
              20%。对抗背景（16% 的攻击现在涉及深度伪造或证件篡改）让模型质量成为反复投入的事项，Trulioo 看起来把它当作核心能力。
