  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、业务范围与核心产品
        blocks:
          - type: paragraph
            body: >-
              Trulioo
              给自己的定位不是点解决方案供应商，而是身份平台。公司官网和官方材料把业务锚定在受监管数字企业的全球开户、合规和欺诈防控，产品覆盖个人验证、企业验证、观察名单筛查、证件验证和风险评分。公司称平台可帮助企业在 195
              个国家验证超过 5 billion 个人和 700 million 企业实体；官网还强调「一个平台、一个 API」，连接 450 个数据源、支持 43 种语言。这个广度很关键：Trulioo
              卖的不只是验证覆盖面，也是在卖运营简化。客户不必拼接本地供应商，可以用一次集成承载 KYC、KYB、AML 和欺诈工作流。服务隐私政策进一步说明，Trulioo
              通常作为银行、市场平台、支付提供商等客户的数据处理者，同时也以数据控制者身份使用数据来改进产品和支撑平台运营。简言之，Trulioo 更像是通过软件和按交易计费验证工作流销售的全球合规基础设施。
