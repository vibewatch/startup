  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引：按次核验经济模型，ARR 重新加速且 KYB 组合上移
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的公开财务叙事，在产品机制与收入牵引交汇处最强。GetLatka 引出的 CEO
              访谈中，管理层称变现方式是按验证收费，视国家和复杂度从几美分到几美元不等；这符合交易型、用量型模式，而不是固定席位许可。这个点重要，因为公司披露的 ARR 进程同时显示规模和恢复动能：2017 年约 $20
              million，2020 年 $50 million，2021 年 $100 million，2022 年 $108.4 million，2023 年 $116.9 million，2024 年 $150.6
              million，全部来自第三方未审计资料。方向性看，增长曲线在 2021 年扩张跃升后放缓，2024 年又明显重新加速，同比增速从 2023 年约 8% 升至 2024 年约
              29%。商业架构大概率有帮助：Trulioo 围绕个人验证、企业验证、证件验证、观察名单筛查、欺诈情报和工作流销售一份合同、一个
              API，客户在同一账户内扩展产品使用更容易，不必重新集成。组合似乎也在转向更高价值工作流。2025 年 4 月，Trulioo 披露 APAC 收入同比增长 64%，由金融科技和市场平台队列带动；公司 KYB
              发布稿称，美国 KYB 采用量自 2020 年以来增长 586%。这些披露共同支撑了一个收入引擎：验证量、交叉销售广度和更重 KYB 的高价值产品组合。
