      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              增长逻辑同时来自监管和经济性。FinCEN 的客户尽职调查规则要求金融机构识别并验证受益所有人、建立风险画像并开展持续监控；European Banking Authority 指出，AML/CFT 职责自
              2026 年 1 月起转至 AMLA，说明监管仍在演进，而不是简化。Trulioo 的 2026 年趋势报告给出第二个市场驱动：欺诈正变得更合成化、AI 辅助化，并贯穿全生命周期，从而提高了对预测性风险信号、动态
              KYB、可复用 KYC
              和智能体时代身份模型的需求。约束同样重要。买方仍要面对供应商蔓延、跨境数据不一致、误报成本、切换摩擦，以及让法务、合规、产品和工程团队围绕同一开户设计达成一致的难题。竞争厂商也在推动不同市场形态：Jumio
              强调生命周期身份情报，Persona 强调模块化编排，Socure 强调美国决策深度，Veriff 强调自动化全球覆盖，Alloy 强调开放生态编排，Sardine 强调金融犯罪自动化，LexisNexis
              强调既有风险数据。市场增长是真实的，但客户继续多供应商并用或把编排内建，而不是标准化到单一平台上的风险也同样真实。
