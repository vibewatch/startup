      - number: '5.4'
        title: 开发者体验与集成
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的开发者体系围绕 developer.trulioo.com 的开发者门户、docs.verification.trulioo.com 的 SDK 文档门户，以及
              knowledgehub.trulioo.com 的 Knowledge Hub 展开。开发者门户首页主打“快速通道集成”体验，提供指南、API 参考和配方，覆盖认证、Event Dispatcher
              webhook、HMAC 签名和 API 握手模式。不过，Configuration、Identity Verifications 和 Business Verification 的实际 API
              参考页在页面抽取中只能读到极少内容，说明深层 API 文档依赖 JavaScript 较重的文档平台，基于爬虫的阅读器无法完整访问。github.com/api-evangelist/trulioo
              目录提供了最容易读取的机器可读 API 面摘要：七个 API、十一个 Naftiko 能力、Verify Request/Result 和 Business Record 的 JSON
              Schema、OpenAPI 规范，以及一个 Spectral 规则文件。

              SDK 覆盖较广：C# (v3)、Java (v3)、C# v1 legacy、Java v1 legacy、iOS 原生、Android、React Native、Web，以及用于 KYB AI 智能体集成的
              MCP 服务器。developer.trulioo.com 上的 llms.txt 文件显示，Trulioo 已开始把 API 面向 AI 智能体调用来定位。Trulidemo 沙盒可用于投产前测试。截至
              2025 年中，Platform Update 6.7 被引用为最新版本，开发者门户维护公开变更日志。Trust Payments 案例研究显示，厂商能让企业部署以创纪录速度上线；但 G2
              评论数据报告典型实施时间为 2 个月，且感知成本较高——案例研究与同行评论之间的差距，指向企业规模集成的复杂度。
