        blocks:
          - type: callout
            title: 用结构化尽调议程持续跟踪
            body: >-
              Trulioo 基本面有吸引力——市场强、平台可防守、增长重新加速，新高管团队也有相关金融科技深度。但 2021 年价格需要私下尽调，公开证据无法替代：审计财务、409A、NRR
              和股权结构分配瀑布都缺失。不要仅凭公开证据投入资本。现在就搭建尽调议程。
            calloutType: recommendation
