  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 以 2024 年披露的年经常性收入（ARR）USD 150.6 million 为基准，按不同 ARR 倍数推算估值，展示当前 $1.75B 标记在情景区间中的位置。
    data:
      items:
        - label: 悲观 5x ARR
          value: 753
          detail: USD M——悲观情景倍数下限
          tone: negative
        - label: 悲观 7x ARR
          value: 1054
          detail: USD M——悲观情景倍数上限
          tone: negative
        - label: 基准 9x ARR
          value: 1355
          detail: USD M——基准情景倍数下限
          tone: warning
        - label: 基准 12x ARR
          value: 1807
          detail: USD M——基准情景倍数上限 / 接近当前标记
          tone: warning
        - label: 当前标记
          value: 1750
          detail: USD M——2021 年 Series D 投后估值锚
          tone: neutral
        - label: 乐观 15x ARR
          value: 2259
          detail: USD M——乐观情景倍数下限
          tone: positive
        - label: 乐观 18x ARR
          value: 2711
          detail: USD M——乐观情景倍数上限
          tone: positive
    approximationNotes: $150.6M ARR 是 Latka 截至 2024 年 10 月的第三方估计；未经审计。倍数情景由分析师构建。
