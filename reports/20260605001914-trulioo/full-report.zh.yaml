    layout: wide
    summary: 有向图展示 Trulioo 的主要风险类别如何通过客户信任、平台可靠性、收入留存和监管地位，最终影响融资与退出估值。
    data:
      nodes:
        - id: r-reg
          label: 监管暴露面扩大
          detail: AMLA 过渡、FinCEN BOI、GDPR Article 22、EU AI Act——合规适配成本上升
        - id: r-privacy
          label: 数据隐私 / 传输风险
          detail: 跨境传输挑战；生物识别法规暴露；CCPA/CPRA 执法
        - id: r-breach
          label: 平台安全事件
          detail: 客户终端用户的身份与生物识别数据；信任与安全是核心产品风险
        - id: r-source
          label: 数据源中断
          detail: 政府注册体系访问被撤销；450+ 数据源有冗余，但司法辖区层面仍有覆盖缺口
        - id: r-compete
          label: 竞争替代
          detail: Onfido/Entrust、LexisNexis、Jumio 加码竞争；超大规模云厂商 ID 服务开始浮现
        - id: r-exec
          label: 执行风险
          detail: CEO/CFO/CRO 均在 12 个月内新上任；员工数净下降；未公开继任计划
        - id: r-govern
          label: 治理不透明
          detail: 2021 年估值过时；未提交 ISC；没有经审计财务；未披露 SLA
        - id: i-trust
          label: 客户信任侵蚀
          detail: 市场对 Trulioo 作为合规基础设施的信心受损；采购冻结
        - id: i-revenue
          label: 收入留存风险
          detail: 主要企业账户不续约、缩减采购或被竞争对手替代
        - id: i-platform
          label: 平台可靠性 / 覆盖
          detail: 覆盖缺口或决策质量下滑；存在 SLA 违约暴露
        - id: o-financing
          label: 融资与退出可选性
          detail: 退出区间受限；2021 年入场投资人有回报压力；下轮融资风险
        - id: o-valuation
          label: 估值压缩
          detail: 相对 2021 年基准的倍数压缩；没有新股权信号；409A 过时
      edges:
        - from: r-reg
          to: i-trust
          label: 合规缺口削弱平台可信度
        - from: r-privacy
          to: i-trust
          label: 执法或安全事件引发数据主体信任失灵
        - from: r-breach
          to: i-trust
          label: 身份数据泄露会独特地摧毁价值主张
        - from: r-source
          to: i-platform
          label: 注册体系流失拉低覆盖与匹配率
        - from: r-compete
          to: i-revenue
          label: 竞争替代削弱续约和新客户获取
        - from: r-exec
          to: i-revenue
          label: 领导层缺口拖慢企业 GTM 和客户留存
        - from: i-trust
          to: i-revenue
          label: 信任侵蚀加速流失
        - from: i-platform
          to: i-revenue
          label: 覆盖下滑触发客户 SLA 担忧
        - from: i-revenue
          to: o-financing
          label: 收入恶化引发资本市场担忧
        - from: r-govern
          to: o-valuation
          label: 不透明阻止估值刷新；过时基准延续
        - from: o-financing
          to: o-valuation
          label: 融资选项受限压缩退出倍数
    claimRefs:
      - CR001
      - CR017
      - CR028
      - CR033
      - CR037
      - CR042
      - CR043
  - id: FR003
    title: 依赖图 — 关键外部依赖
    type: dag
    layout: wide
    summary: 有向图梳理 Trulioo 的关键外部依赖——政府数据注册体系、企业客户、监管机构、资本提供方和被收购技术——展示每项依赖如何连接核心平台与客户交付。
    data:
      nodes:
        - id: d-gov
          label: 政府 ID 注册体系（195 个国家）
          detail: 国家 ID 注册体系、选民名册、DHA（SA）、Aadhaar（India）等；主要权威身份数据
        - id: d-credit
          label: 商业数据提供商
          detail: 消费者征信机构、移动运营商、公用事业公司；二级验证数据
        - id: d-amla
          label: AMLA / EBA（EU 监管机构）
          detail: 制定 Trulioo 面向 EU 产品必须满足的 AML/CFT 规则；截至 2026 年 1 月仍在积极制定规则
        - id: d-fincen
          label: FinCEN（US 监管机构）
          detail: CDD Rule 和 BOI 报告要求驱动 Trulioo KYB 产品需求
        - id: d-helloflow
          label: HelloFlow（收购技术）
          detail: Workflow Studio 与无代码编排；自 2022 年起已整合进核心平台
        - id: d-investors
          label: TCV / 机构投资人
          detail: 2021 年 Series D；基金年份带来回报压力；董事会影响退出时间表
        - id: d-banks
          label: 主要银行客户
          detail: 美国五大银行中的三家；全球前 7 大支付处理商中的六家；主要收入集中来源
        - id: d-ml
          label: ML 基础设施 / AI 提供商
          detail: 未披露的云端或内部 ML 基础设施，用于证件验证和欺诈评分
        - id: core
          label: Trulioo 身份平台
          detail: 核心 KYC/KYB/AML 平台；450+ 数据源；API 集成层
        - id: cust
          label: 终端客户（约 450）
          detail: 银行、金融科技公司、支付处理商、市场平台；将 Trulioo 用作合规基础设施
      edges:
        - from: d-gov
          to: core
          label: 权威身份数据输入
        - from: d-credit
          to: core
          label: 补充验证数据
        - from: d-helloflow
          to: core
          label: Workflow Studio 与编排层
        - from: d-ml
          to: core
          label: 用于证件和欺诈验证的 ML 模型推理
        - from: d-amla
          to: core
          label: 监管更新要求驱动产品适配
        - from: d-fincen
          to: core
          label: CDD/BOI 要求驱动 KYB 产品范围
        - from: d-investors
          to: core
          label: 资本配置与战略方向
        - from: core
          to: cust
          label: 通过 API 交付身份验证和合规服务
        - from: d-banks
          to: cust
          label: BFSI 领域主要客户收入集中
    claimRefs:
      - CR028
      - CR029
      - CR032
      - CR036
      - CR038
      - CR041
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从平台质量和财务轨迹，到风险画像和证据缺口，再推导出观察建议的证据链。
    data:
      nodes:
        - id: n1
          label: 平台广度——195 个国家、多模态 IDV+KYB+编排
        - id: n2
          label: 收入再加速——2024 年 ARR 增长 29%，APAC 增长 64%
        - id: n3
          label: 企业证明——J.P. Morgan Payments、Airwallex、450 个客户
        - id: n4
          label: 支持溢价估值立场
        - id: n5
          label: 不透明风险——无审计、无 409A、无 ISC、2021 年以来无老股交易
        - id: n6
          label: 竞争风险——Socure、Jumio、Veriff 已具规模
        - id: n7
          label: 优先权风险——累计融资 $477M，清算瀑布未知
        - id: n8
          label: 限制按 2021 年价格下注的确信度
        - id: n9
          label: 建议——观察，并设置结构化尽调议程
      edges:
        - from: n1
          to: n4
        - from: n2
          to: n4
        - from: n3
