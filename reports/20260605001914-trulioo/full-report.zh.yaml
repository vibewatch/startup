            title: 所有 AI/ML 绩效声称均来自厂商且未经验证
            body: >-
              归因于 Trulioo AI/ML 栈的每项绩效指标——处理速度、验证率、自动批准率、欺诈减少——都来自 Trulioo
              新闻稿和一个未具名客户案例研究。未找到独立基准测试、学术论文或第三方审计来佐证这些数字。企业买家在做架构决策前，应把这些视为方向性信号，并向 Trulioo 索取可复现的测试集数据。
