companyProfile:
  summary: >-
    Trulioo 是一家创立于 Vancouver 的私营身份验证公司，已经从全球 KYC 点解决方案演进为统一合规平台，覆盖个人验证、企业验证、AML 观察名单筛查、证件验证和欺诈风险评分。公司于 2021 年 6 月以 $1.75
    billion 投后估值完成 $394 million Series D 融资，并称单 API 架构覆盖 195 个国家的 5 billion 个人和 700 million 企业实体。第三方资料给出的 2024 年 ARR 为
    $150.6 million，较 2023 年的 $116.9 million 同比增长 29%，重新加速。2025 年 4 月，Vicky Bindra 接替 Steve Munford 出任 CEO；2026 年 3
    月，公司扩充高管层，新增 CFO、首席风险与战略官和首席转型官。
  foundedDate: '2011-01-01'
  founders:
    - name: Stephen Ufford
