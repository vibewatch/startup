  - id: FI001
    title: 收入模型桥
    type: flow
    layout: standard
    summary: Trulioo 如何把客户身份核验活动转化为收入和毛利润；成本侧细节仍未公开。
    data:
      nodes:
        - id: customer-check
          label: 客户发起 KYC 或 KYB 核验检查
          detail: 核验需求来自受监管的开户或监控工作流。
          tone: positive
        - id: api-call
          label: 对 Trulioo 平台发起单一 API 调用
          detail: 客户使用一个集成点，而不是分别连接各个产品。
          tone: neutral
        - id: product-routing
          label: 平台路由至最优数据源或 DocV 引擎
          detail: Trulioo 在数据伙伴、注册库和证件核验逻辑之间选择。
          tone: neutral
        - id: per-check-fee
          label: 按次收费（几美分到几美元，取决于产品 / 国家）
          detail: 定价随地域、复杂度和产品深度变化。
          tone: positive
        - id: revenue-pool
          label: 混合 ARR 池（2024 年据报约 $150.6M，未经审计）
          detail: 第三方报道显示，交易活动已经形成有意义的经常性规模。
          tone: positive
        - id: data-source-cost
          label: 数据源和注册库费用（COGS 组成；金额私有）
          detail: 底层数据访问和注册库使用可能构成主要直接成本。
          tone: warning
        - id: inference-cost
          label: AI / ML 推理和平台基础设施成本（COGS；私有）
          detail: 证件核验、欺诈评分和平台运营会增加计算与基础设施成本。
          tone: warning
        - id: gross-profit
          label: 毛利率（未披露；行业代理：API 数据业务 60–80%）
          detail: 直接成本披露缺失，公开资料无法证明利润率质量。
          tone: neutral
      edges:
        - from: customer-check
          to: api-call
          label: 触发
        - from: api-call
          to: product-routing
          label: 路由
        - from: product-routing
          to: per-check-fee
          label: 定价
        - from: per-check-fee
          to: revenue-pool
          label: 累积
        - from: revenue-pool
          to: data-source-cost
          label: 资助
        - from: revenue-pool
          to: inference-cost
          label: 资助
        - from: data-source-cost
          to: gross-profit
          label: 压低
        - from: inference-cost
          to: gross-profit
          label: 压低
    approximationNotes: 这条桥是定性的，因为公开记录支持按次核验变现逻辑，但不披露实际 COGS、毛利率或分产品抽成率。
