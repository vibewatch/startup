      - number: '8.2'
        title: 估值背景与倍数框架
        blocks:
          - type: paragraph
            body: >-
              2021 年估值锚是唯一硬性公开参考。2021 年 6 月 7 日，Trulioo 完成由 TCV 领投的 $394M Series D 轮，投后估值 $1.75B。该轮出售公司约 23% 股权。当时最近期
              ARR 约 $100M，意味着收入倍数 17.5x——偏高，但在 2021 年流动性浪潮中，对周期高点的 SaaS 成长公司来说并不罕见。如今，这一标记对应 2024 年报告 ARR
              $150.6M；在没有新一轮融资的情况下，隐含最近期 ARR 倍数降至约 11.6x。

              倍数压缩的算术很关键。即使今天按面值接受 $1.75B 标记，11.6x 最近期 ARR
              倍数仍明显高于可比上市公司的交易水平。大型上市身份和欺诈风险公司享有一系列倍数，取决于经常性软件收入、数据网络效应和监管护城河的组合。RELX——LexisNexis Risk Solutions
              的母公司——发布审计年报，代表规模化、多元化风险数据业务的上限；Experian 和 TransUnion 是主要纯粹可比对象。Trulioo 的私营公司身份限制了直接比较，但投资者应关注 2021
              年周期高点倍数与此后市场对私有基础设施软件重新定价之间的差距。

              相对于直接 ARR 倍数，Trulioo
              有三项结构性支撑，可以证明部分溢价。第一，收入模型按交易计费，增长绑定客户交易量而非席位扩张——验证平台一旦嵌入，就能受益于金融服务和数字商务的结构性交易量增长。第二，KYB 和 UBO
              组合迁移涉及更复杂的编排，单位经济性高于基础个人验证检查。第三，企业客户基础——包括 J.P. Morgan Payments 和 Airwallex——带来只做中型市场的平台不具备的交易量稳定性。

              与这些支撑相对，三项结构性风险足以要求明显折价。缺乏审计财务意味着 $150.6M ARR 没有私下尽调就无法验证。累计融资 $477M 带来的优先权包袱会稀释任何二级买家的普通股回报。且 2021
              年以来没有确认的二级交易或 409A 估值，意味着没有公平交易价格可锚定当前报价。
