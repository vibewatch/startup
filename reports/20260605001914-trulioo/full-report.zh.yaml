  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 截至 2026 年 6 月，在悲观、基准和乐观情景下给出 Trulioo 的低、中、高估值包络，并以 2021 年 Series D 的 USD 1.75 billion 标记为锚。
    data:
      items:
        - label: 悲观情景
          low: 800
          mid: 950
          high: 1100
          displayValue: $0.8B–$1.1B
          detail: 个位数 ARR 增长；倍数压缩至 5–7x；员工压力限制修复。
        - label: 基准情景
          low: 1400
          mid: 1600
          high: 1800
          displayValue: $1.4B–$1.8B
          detail: 温和增长（12–15% CAGR）；9–12x 尾随 ARR；接近当前标记。
        - label: 乐观情景
          low: 2000
          mid: 2250
          high: 2500
          displayValue: $2.0B–$2.5B
          detail: ARR 持续增长 20–25%；平台溢价；KYB 结构性占比提升；退出窗口干净。
        - label: 2021 年 Series D 标记
          low: 1750
          mid: 1750
          high: 1750
          displayValue: $1.75B
          detail: 最后一个公开估值锚；2021 年 6 月投后估值。
    approximationNotes: 情景区间由分析师基于公开 ARR 数据和可比公司倍数构建。不是正式估值意见。
    claimRefs:
      - CV001
      - CV002
      - CV011
      - CV042
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向 IC 的六项投资维度评分；分数反映公开证据带来的确信度，而非绝对业务质量。
    data:
      items:
        - label: 市场质量
          value: 7
          note: 欧洲 IDV CAGR 16.9%；全球监管顺风；大 TAM 已证实
        - label: 需求证明
          value: 7
          note: J.P. Morgan Payments、Airwallex、450 个客户、G2 40+ 条评价；Latka ARR $150.6M
        - label: 平台护城河
          value: 7
          note: 195 个国家覆盖；单一 API 多模态；KYB+UBO 差异化
        - label: 财务质量
          value: 4
          note: ARR 轨迹强，但完全未经审计；未披露 GM、NRR 或 burn 数据
        - label: 风险画像
          value: 5
          note: 估值标记过时、不透明、优先权悬置、领导层过渡、竞争
        - label: 估值纪律
          value: 5
          note: 基准情景接近当前标记；悲观情景意味着 40-50% 折价；尽调闸门仍未关闭
