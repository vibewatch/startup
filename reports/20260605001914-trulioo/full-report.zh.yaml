      - number: '2.2'
        title: 测算视角：全球市场、区域拆分与可服务机会
        blocks:
          - type: paragraph
            body: >-
              公开市场规模来源方向清晰，但口径并不完全一致。MarketsandMarkets 预计全球身份验证市场将从 2025 年的 $14.34 billion 增至 2030 年的 $29.32 billion，对应
              15.4% CAGR。同一发布方还显示，同期欧洲从 $3.53 billion 增至 $7.72 billion，APAC 从 $2.73 billion 增至 $6.02 billion，美国从 $4.34
              billion 增至 $8.16 billion。Trulioo 2023 年 6 月产品发布引用了 Liminal 研究，称更大的综合身份平台 TAM 将从 2023 年 $48.1 billion 增至
              2027 年 $115.9 billion；这个数字有参考价值，但明显采用了比狭义身份验证市场报告更宽的平台框架。更合理的解读是，Trulioo 的可服务市场介于纯 IDV
              和全栈数字信任基础设施之间。跨境开户、合规负担重、同时需要企业和个人验证的场景，构成其最大的 SAM。其 SOM
              则受产品契合度、监管覆盖、企业销售周期，以及替换既有或多供应商技术栈的难度约束，而不只取决于自上而下 TAM 估算的绝对规模。
