  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 隐含 ARR（2026E）
      - 隐含倍数
      - 估值区间
      - 概率信号
    rows:
      - - 乐观
        - ARR 复合年增长率 20-25%；KYB 占比加深；平台型退出享受溢价；CEO 交接顺利落地。
        - ~$190-200M
        - 往绩 ARR 的 14-18x
        - $2.0-2.5B
        - 有可能；前提是增长重新加速能持续，且没有重大流失。
      - - 基准
        - ARR 复合年增长率 12-15%；增长回落至接近市场 CAGR；竞争影响中等。
        - ~$170-180M
        - 往绩 ARR 的 9-12x
        - $1.4-1.8B
        - 从公开证据看最可信；接近当前估值标记。
      - - 悲观
        - ARR 增长降至个位数；竞争侵蚀企业客户份额；员工数下降限制交付能力。
        - ~$155-165M
        - 往绩 ARR 的 5-7x
        - $0.8-1.1B
        - 如果 2024 年重新加速只是单年冲高而非趋势，下行空间显著。
    notes: ARR 估计来自分析师基于 Latka 数据搭建的外推；倍数参考可比公司组分析。情景用于 投资委员会讨论，不是估值结论。
