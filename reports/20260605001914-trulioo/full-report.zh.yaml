      - number: '1.3'
        title: 融资历史、资本基础与披露规模
        blocks:
          - type: paragraph
            body: >-
              Trulioo 最重要的资本事件仍是 2021 年 6 月的 Series D。公司 2023 年平台发布稿和第三方融资资料一致显示，该轮融资 $394 million，由 TCV 领投，Goldman
              Sachs、American Express Ventures、Citi Ventures 和 Blumberg Capital 等投资方参投。Tracxn 称公司八轮融资累计约 $477
              million，Series D 投后估值 $1.75 billion；这仍是外部最常引用的估值锚点。按私营公司的披露水平看，Trulioo 报告出来的运营规模更强。GetLatka
              将其年经常性收入（ARR）列为 2022 年 $108.4 million、2023 年 $116.9 million、2024 年 $150.6 million；2023
              年官方平台发布稿称，不到两年员工数几乎翻倍至 430 人。GetLatka 后续给出的员工数为 2024 年约 405 人、2025 年末约 375
              人。这些数字只能作方向性参考，不能当作审计口径，但它们支撑了一个判断：Trulioo 是一家后期私营公司，收入规模真实、风险资本支持充足，组织厚度也足以支撑多产品全球合规平台。
