      - number: '7.6'
        title: 财务、估值与治理风险
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的财务风险主要由一个结构性问题主导：最后一次公开披露的估值是 2021 年 6 月 Series D 轮的 $1.75B，距今已超过四年，且定价发生在 2021 年私募市场倍数高点。此后，SaaS
              和身份技术可比公司在公开市场的估值倍数大幅压缩。Trulioo 最接近的公开可比代理——身份验证和 KYC 合规平台——估值已经实质性重置。没有新的股权融资、二级交易或经审计财务披露，就无法判断 Trulioo
              当前内在价值仍高于、等于还是低于 2021 年基准。

              GetLatka 收入数据给出 2024 年 ARR 为 $150.6M、累计融资 $477M；其中 2021 年 Series D 轮为 $394M，占历史总资本超过 80%。2021
              年以来没有新的股权融资，这既可能说明公司现金生成能力强（正面），也可能说明资本市场环境不利于融资（令人担忧）。没有审计财务，毛利率、经营利润、烧钱速度和现金余额都无法评估。Trulioo
              是加拿大私营非公开发行公司，不承担强制财务披露义务，因此不透明本可预期，但对投资尽调仍然重要。

              2021 年投资者集团——TCV、Goldman Sachs、American Express Ventures、Citi Ventures、Blumberg
              Capital——包含对特定基金年份回报有要求的参与方。2021 年基金年份以 $1.75B
              估值入场，会对退出或二级交易价格形成压力，必须给出可接受回报；持有越久，优先股清算优先权的隐性累积越大，能同时服务所有利益相关方的退出结果区间越窄。这种投资者动态可能约束商业灵活性，也可能让早期投资者与管理层在最佳退出时点上不一致。

              公司治理记录透明度有限。Corporations Canada 列出七名董事，但没有记录任何具重大控制权的个人，没有年度会议日期，最近确认的申报期止于 2020 年。2026 年任命 Uri
              Zelmanovich 为 CFO，说明公司可能在准备更结构化的财务报告和治理——与潜在 M&A 或公开市场路径一致——但尚无公开交易信号。估值、股权结构细节和投资者权利文件完全不在公开披露范围内。
