  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Trulioo 最具结构性的风险是监管风险。公司处在全球 AML/CFT、KYC 和 KYB 合规中心——这意味着客户必须满足的每一次监管框架变化，都会直接变成 Trulioo 的产品和商业义务。

              短期最重要的监管变化是欧盟过渡。自 2026 年 1 月 1 日起，所有欧盟层面的 AML/CFT 监督职责从 European Banking Authority 转移到位于法兰克福的新 Anti-Money
              Laundering Authority（AMLA）。AMLA 直接监督被选中的高风险金融机构，并协调各国 Financial Intelligence Unit。根据 AMLA Regulation 第 54
              条，现有 EBA AML/CFT 指南在 AMLA 替代前仍然有效——但替换的时间和范围尚未完全确定，为 Trulioo 的欧盟客户制造了义务仍在演化的窗口期。随着 AMLA
              要求传导到各国监督预期中，Trulioo 平台必须吸收这些监管变化。

              在美国，FinCEN 的 Customer Due Diligence Rule 要求受覆盖金融机构——包括银行、broker-dealer 和共同基金——在 25%
              所有权门槛识别并验证法律实体客户的受益所有人，理解客户风险画像，并对可疑交易进行持续监控。Trulioo 的 KYB 产品直接支持这些义务合规，其 2025 年 APAC KYB
              增长新闻稿也确认了它作为合规基础设施提供商的角色。相关 Corporate Transparency Act BOI reporting rule 又增加了一层受益所有权验证需求，Trulioo
              客户必须应对；公开来源尚未确认 Trulioo 当前产品路线图是否覆盖符合 CTA 的 BOI 工作流。

              Trulioo 的法律和隐私姿态记录在五份已发布政策中：Website Privacy Policy（2026 年 3 月更新）、Services Privacy Policy（2025 年 10
              月更新）、California Privacy Notice（2024 年 5 月更新）、Biometric Information Policy，以及 US Consumer Health Data
              Privacy Policy。Services Privacy Policy 披露，Trulioo 既作为数据控制者处理个人数据（用于产品开发和运营目的），也代表客户作为数据处理者处理个人数据。该政策第 9
              节包含 Automated Decision Making 部分，承认身份验证结果可能产生法律或类似重大影响——从而触发 GDPR Article 22 的保障义务，以及 CCPA/CPRA 下的平行义务。专门的
              Biometric Information Policy 存在，说明公司意识到 Illinois BIPA 暴露，以及美国其他州的生物识别特定隐私法规。

              公司治理方面，Corporations Canada 联邦备案列出七名董事，包括即将退休的 CEO Steve Munford，但没有记录任何具有重大控制权的个人。受益所有权披露缺失，加上最后确认备案期（2020
              年）与当前日期之间的时间差，使外部对真实所有权和控制结构的可见度有限。可用公开来源没有发现针对 Trulioo
              的公开诉讼、执法行动、监管传票或不利法院记录——但没有公开记录，不能在未做独立法律尽调前解读为干净的法律历史。
