              - CV041
          - type: callout
            title: 优先权包袱与治理不透明是结构性约束
            body: >-
              累计融资 $477M，且加拿大未申报 ISC，任何二级买家都面对两个结构性未知：退出收益中有多少被优先权吃掉，以及谁真正控制公司。这些不是小注脚——如果分配瀑布前置，即使入场价与 2021
              年标记持平，算术结果也可能转负。
            calloutType: risk
