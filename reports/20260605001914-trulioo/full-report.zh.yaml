              Trulioo 开发者门户（developer.trulioo.com）是一个 JavaScript 渲染的文档平台。API Evangelist 目录提供了可访问的机器可读摘要，但
              Configuration、Identity Verifications 和 Business Verification 的实际 API
              参考页只返回导航内容。评估集成复杂度的企业团队，初始范围界定时应预期依赖开发者门户的渲染体验，而不是可下载规范文件。
