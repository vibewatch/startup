      - number: '8.4'
        title: 可比公司集合与市场定位
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的估值可比对象分三层：大型上市风险数据公司、中型上市身份和支付验证公司，以及私募融资参考。

              大型市值层面，RELX 的 LexisNexis Risk Solutions 业务直接参与 B2B 身份和风险数据竞争，RELX 发布审计年报，市值达数百亿美元。RELX 也是一个合理的战略收购方：收购
              Trulioo 可增加 195 个国家的全球覆盖、现代 API 优先平台，以及 LexisNexis Risk 尚未领先的 KYB 能力。Experian 和 TransUnion
              是身份验证领域最直接的公开可比对象，但业务组合差异（信用数据与纯 IDV）限制了精确度。

              私营同业层面，Socure 是最相关的美国基准；它披露 3,000 多名客户，并覆盖美国前 20 大银行中的 18 家。Socure 最近一次披露融资隐含的估值显著高于
              Trulioo，原因在于银行渗透更深、披露客户基础更大。Veriff 称服务 3,000 多家企业，自动化准确率 99.6%；Jumio 每秒处理 120 笔交易，拥有 300
              多项专利。Persona、Alloy 和 Sardine 代表新兴层竞争者。Trulioo 相比所有这些公司的最强差异化在于地域范围（195 个国家，而非典型美国和欧盟聚焦）以及统一的 KYC + KYB +
              文件 + 编排平台。

              支付生态背景（Mastercard、Worldpay、Airwallex）对战略价值重要，而不是收入倍数对标。企业支付平台追求无摩擦开户和合规基础设施；Trulioo 通过扩大 Airwallex 合作以及入选
              J.P. Morgan Payments，证明了战略适配。这些关系说明收购兴趣是现实选项，即便当前没有披露。

              综合来看，可比集合支持 Trulioo 因平台宽度和地域护城河而相对上市可比对象获得 20-35% 的私营公司溢价，但该溢价被上文讨论的 20-25% 不透明折价部分抵消。净结果是，公允价值区间围绕当前
              $1.75B 标记居中，但上下两侧置信区间都很宽。
