      - number: '6.5'
        title: 留存和集中度证据缺口重大；公开记录不足以支撑队列或 NRR 判断
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的公开记录不足以支撑标准 SaaS 持久性判断。公司没有披露 NRR、GRR、流失率、队列留存曲线、合同期限、续约率或头部客户收入集中度。现有代理指标——APAC 收入增长、交易量增长、KYB
              采用率、锚定账户内多产品扩张——可以指示方向，但不能替代评估当前增长是否持久、客户账户是否在不同队列年份之间扩张所需的留存披露。

              总客户数同样未披露。最接近的第三方代理是 TrustRadius 上的 HG Insights 安装数据，显示检测到 81 个 Trulioo
              安装；但这个数字几乎肯定低估真实安装基础，也只反映有可检测公开信号的客户。FeaturedCustomers 列出 27 条评论和 29 个案例研究，Trulioo 自己的案例研究库展示 24
              个已发布案例，其中许多涉及未具名账户。2023 年 12 月增长公告使用“三家美国五大银行”这类汇总指标，而不是具体客户数量；这对企业软件厂商很常见，但让客户集中度分析变得不可能。

              公开证据无法评估收入集中度风险。Airwallex（年处理量 $100 billion）和 J.P. Morgan Payments（每日支付 $9 trillion）这类锚定账户是庞大而复杂的组织；如果
              Trulioo 只有一份合同，或少数续约窗口集中在同一时期，它们的身份验证需求可能转化为实质收入集中度。没有公开证据支持或反驳高集中度，但一家以 $1.75 billion
              估值获得风险投资阶段融资的公司缺少披露，这是尽调红旗，不是健康信号。

              切换成本在原则上是真实的——API 集成、合规工作流配置和审计轨迹连续性都会制造摩擦——但 G2 关于高实施成本和 2
              个月集成窗口的证据也意味着，如果竞争对手显著提升匹配率或价格，最初切入时的摩擦可能反向作用。Trust Payments 用 Trulioo 替换五家厂商，说明 Trulioo 能赢下整合型交易，但它不能直接证明
              Trulioo 不会在之后成为被整合掉的那家厂商。
