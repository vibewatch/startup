      - number: '6.4'
        title: APAC 扩张是最清晰的客户增长信号；KYB 采用率支持先落地再扩张假设
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的 APAC 扩张提供了一些最强的客户增长和产品采用代理指标。2025 年 4 月收入公告报告 APAC 收入同比增长 64%，由平台市场验证交易增长 37%、金融科技企业增长 55%
              驱动。虽然这些是收入数字，不是客户数，但它们暗示 Trulioo 在两个最大细分市场中有实质账户渗透。2026 年 4 月关于 UBO 发现的 APAC 新闻稿称，2025 年 APAC 企业验证量同比增长
              51%，并给出具体 UBO 覆盖率改善：一家大型未具名社交媒体平台在越南达到 98%，菲律宾达到 70%（提升 69 个百分点），新加坡达到 81%（提升 24 个百分点）。

              KYB 采用提供了多年增长视角。Trulioo 报告称，截至 2023 年 6 月，美国 KYB 采用自 2020 年以来增长 586%，由金融服务公司和电商平台市场适应 INFORM Consumers Act
              以及不断演变的 AML/KYC 要求驱动。2023 年新客户中，40% 明确采用 KYB 能力。这些数字说明，已安装客户中越来越多的份额把 Trulioo 当作 KYC+KYB 组合平台，而不是单产品 KYC
              厂商；这种画像正好支撑更高切换成本和更大单账户经济性。

              新加坡办公室于 2022 年 9 月开设，作为 APAC 客户支持和运营枢纽，传递出主动搭建地理覆盖的信号，而不是被动承接需求。这项基础设施投入支撑 APAC 增长说法，尽管 APAC
              客户数的绝对规模仍未披露。Airwallex（180 个国家）、Nium（190+ 付款市场）等具名账户，加上具备 APAC UBO 能力的未具名社交媒体平台，说明 Trulioo
              服务的是需要跨境和多辖区覆盖的全球公司，而不是验证需求简单、只在单一国家运营的本土玩家。
