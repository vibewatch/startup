  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与身份模块地图
        blocks:
          - type: paragraph
            body: >-
              Trulioo 将平台组织成 GlobalGateway 品牌下的统一身份栈：一个 API、一份合同、一个端点，覆盖六个主要产品模块：Person Verification（KYC Data）、Identity
              Document Verification（DocV）、Business Verification（KYB）、Watchlist and AML Screening、Fraud Intelligence，以及
              Workflow Studio 编排层。公司官网和解决方案页把它表述为「一个平台、一个 API、一次集成」，可在 195 个国家以 43 种语言解锁 450+
              数据源；这些说法在产品页、平台发布传播和开发者文档中反复出现。

              Person Verification 使用 500+ 个 PII 数据源，并按 KYC 数据页说明，以亚秒级延迟返回匹配 / 不匹配结果。Identity Document Verification 按
              2023 年 6 月能力公告支持 12,000+ 种证件类型（2025 年 3 月 AI/ML 发布稿更新为 14,000+），并通过 Web、Android、iOS 和 React Native SDK
              支持生物活体采集。Business Verification 通过官方登记册验证 700 million 企业实体，并用平台 AI 治理的实体解析引擎叠加 UBO 发现。Watchlist Screening
              检查 6,000+ 个观察名单和 20,000+ 个负面媒体来源。Fraud Intelligence 于 2024 年 10 月推出，借助联盟数据、速度监控和数百个欺诈信号提供预测性风险评分，全部通过同一个
              API token 交付。近期新闻定位提到信贷决策能力，但尚未作为具名模块记录。

              Workflow Studio 源自 2022 年 2 月 HelloFlow 收购，提供无代码、拖拽式开户工作流构建器。组织可以把 KYC、KYB、AML 和 DocV
              核验组合成可配置、托管的验证旅程，无需定制开发。案例研究伙伴 Trust Payments 用单一 Trulioo 集成替换了五家碎片化验证供应商——这是平台整合逻辑的具体落地证明。
