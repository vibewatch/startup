  - id: TV005
    title: 打破投资逻辑与退出触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 24 个月内第三次 CEO 交接
        - 2027 年 4 月前任何确认的 CEO 更替
        - 释放持续领导层不稳定信号；削弱执行信心
        - 退出或立即暂停尽调
      - - 新股权轮次投后估值低于 $1.3B
        - 任何确认融资且投后估值 < $1.3B
        - 确认下轮融资；重锚公允价值；压缩退出 IRR
        - 降低信心后退出；重新评估敞口
      - - 连续两个季度 ARR 增速低于 10%
        - 相比 2024 年 29% 基线，持续落在个位数增长
        - 增长溢价消失；基准情景滑向悲观
        - 下调至回避；重新定价敞口
      - - 监管执法点名 Trulioo 合规失效
        - 欧盟、英国、美国或加拿大的任何正式监管行动
        - 带来负债、客户流失和声誉传染
        - 无论价格如何，立即触发退出
      - - 尽调披露单一客户集中度高于 50%
        - 第一大客户 > 50% ARR
        - 收入风险二元化；单一客户流失会威胁生存
        - 结构性否决项；没有缓释措施不能交割
      - - 确认优先权悬顶会吸收 $2B 以下退出的全部回款
        - 股权结构瀑布显示，在 $1.75B 退出时普通股回报 < 15%
        - 清算优先权测算抹掉二级买家的股权上行
        - 重新定价或放弃二级仓位；优先权条款决定结果
    notes: 退出触发因素是前瞻性风险阈值；截至 2026 年 6 月，当前公开证据未确认任何触发 因素已被突破。没有股权结构表访问权限，无法验证优先权瀑布。
    claimRefs:
      - CV007
      - CV017
      - CV019
      - CV041
      - CV042
      - CV048
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务
        - 2023 年和 2024 年独立审计的收入、毛利率、EBITDA 和烧钱速度
        - 没有审计，第三方 ARR 估计（Latka）无法承销；利润率结构决定估值倍数
        - 向管理层索取；与审计机构接洽
      - - 客户集中度明细表
        - 前 10 大客户收入；ARR 队列分析；按年份分组的 NRR
        - Trulioo 的 450 个客户基数可能高度集中；第一大客户 > 25% ARR 会成为结构性风险
        - 向 CFO（Uri Zelmanovich）索取；与企业客户名单交叉核对
      - - 409A / 董事会批准的企业价值
        - 最近的 409A 估值或正式董事会批准的 EV；任何二级交易价格
        - 自 2021 年 6 月以来没有公平交易价格参照；4 年以上空档让入场价格缺乏支撑
        - 向管理层和领投方 TCV 索取；如可取得，审阅董事会会议纪要
      - - 优先权堆叠和股权结构瀑布
        - 按系列拆分的完整股权结构表；清算优先权；参与权；反稀释条款
        - 8 轮累计融资 $477M 可能形成优先权结构，吸收 $2B 以下的全部普通股价值
        - 向公司法律顾问索取法律文件；审阅 Series D 公司注册证书
      - - 现金跑道和融资计划
        - 现金余额、月度烧钱速度和未来 18 个月资本计划
        - 2021 年以来没有新一轮融资；如果烧钱显著，稀释性融资可能先于任何退出发生
        - 索取 CFO 财务模型；审阅董事会批准预算
      - - 受益所有权（ISC）
        - 根据 Corporations Canada 申报义务列示的重大控制个人
        - 截至 2026 年 6 月没有 ISC 申报；从治理角度看，最终受益所有权不透明
        - 向管理层索取 ISC 确认；直接查询 Corporations Canada 登记册
    notes: 尽调问题按重要性排序；经审计财务和 409A 估值是阻断项，应在任何投资承诺前 解决。
    claimRefs:
      - CV007
      - CV008
      - CV025
      - CV039
      - CV041
