      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              这个品类里，没有主要竞品公开完整价目表。Trulioo、Jumio、Veriff、Socure、Persona 和 Alloy 的定价普遍是联系销售或按量谈判。现有信号显示，按交易量或 API
              调用量计费是标准做法，企业合同按年谈判。G2 评价数据称 Jumio 比 Trulioo 更贵，Onfido 的 ROI 更慢，说明 Trulioo 处在中档价格 / 性能位置。SoftwareAdvice 确认
              Trulioo 定价没有公开列示，也符合该品类企业合同的惯例。


              能力范围上，Trulioo 2025 年 3 月 AML/AI 模型更新将任务处理时间最多降低 60%，验证率提升 20%，自动批准率最多提升 20%；这些改进缩小了与 Jumio
              规模优势之间的性能差距。Trulioo 2024 年 10 月推出 Fraud Intelligence，借助单一 API 在 195+
              个国家提供联盟风险指标、速度监控和实时信号，相比只在本土市场提供欺诈信号的竞品形成差异层。Trulioo 在美国的 KYB 采用量从 2020 年到 2023 年增长 586%，拿下了 Socure
              近来才开始扩张的高增长垂直。


              GTM 和分销方面，Socure 渗透美国前 20 大银行中的 18 家，在美国本土金融服务交易中形成参考壁垒和数据网络优势；Trulioo 尚未公开匹配这一点。Jumio 和 Veriff
              都凭数十亿笔已处理交易建立了全球品牌认知。Trulioo 的 GTM 差异在于单 API、单合同，覆盖 195 个国家，且模块化架构只启用所需服务；这吸引了全球金融科技、跨境支付公司，以及 Nium、EQ
              Bank 这类受监管市场平台，因为它们需要多司法辖区覆盖，又不想拼接多个供应商技术栈。
