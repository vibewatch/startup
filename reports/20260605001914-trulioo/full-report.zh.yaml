        - 经审计收入和 NRR 数据可补上第三方验证缺口。
      - - KYB 与 UBO 增长（美国自 2020 年以来增长 586%；APAC 2025 年增长 51%）推动产品组合转向更高价值。
        - 2025 年 4 月和 2026 年 4 月的官方新闻稿。
        - 按产品拆分收入可验证 KYB 毛利溢价。
      - - 反向逻辑。$1.75B 估值标记已陈旧 4 年以上，且没有确认的二级交易或 409A。
        - 2021 年之后没有股权轮次、没有二级交易、没有 409A 披露。
        - 当前董事会批准的估值标记或独立二级交易可解决这个问题。
      - - 反向逻辑。累计融资 $477M 带来的优先权悬顶会稀释普通股回报。
        - 融资表（Tracxn、Latka）确认。
        - 显示不同退出价格下普通股回报的股权结构瀑布表。
      - - 反向逻辑。Socure（3,000+ 客户、美国前 20 大银行中 18 家）竞争加剧。
        - Socure 和 Jumio 的公开营销数据确认其规模和投资水平。
        - 市占率数据和赢单 / 输单分析可澄清竞争定位。
    notes: 投资逻辑基于官方新闻稿和第三方分析师数据；反向逻辑来自治理和融资数据中的结构性 观察。
