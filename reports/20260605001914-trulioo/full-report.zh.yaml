  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正反论点
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的正面逻辑由三股力量汇合而成。第一，市场大且结构性增长：仅欧洲身份验证板块就预计从 2025 年的 USD 3.53B 增至 2030 年的 USD 7.72B，CAGR 为
              16.9%；Trulioo 2024 年 ARR 增长 29%，显著高于市场增速，意味着份额提升。第二，产品架构——单一 API、单一合同、覆盖 195
              个国家，横跨个人验证、企业验证、文件验证、观察名单筛查、欺诈情报和工作流编排——比点状解决方案更难复制；KYB 组合迁移（自 2020 年以来美国增长 586%，2025 年 APAC UBO 量增长
              51%）说明高价值工作流正在替代更简单的身份检查。第三，执行下一章的高管团队是新的，并有金融科技履历：Vicky Bindra（曾任 Nuvei COO 和 CPO，并在 FIS、Visa、Mastercard
              担任高级职位）于 2025 年 4 月出任 CEO，2026 年 3 月入职的 CFO、CRO 和首席转型官提供支持。

              反面逻辑同样清晰。Trulioo 的 $1.75B 估值标记已经超过四年未更新。收入数据来自第三方数据服务 Latka，而非审计账目。资本结构累计融资
              $477M，优先权包袱不小，会压低普通股回报。Corporations Canada 确认公司未申报任何具重大控制权个人（ISC），也就是说从治理角度看，受益所有权结构不透明。竞争在加剧：Socure 称拥有
              3,000 多名客户，包括美国前 20 大银行中的 18 家；Jumio 每秒处理 120 笔交易，拥有 300 多项专利。员工人数从 2024 年约 405 人降至 2026 年约 375
              人，这条轨迹含义不明——可能是效率提升，也可能是增长产能被压缩。当前价格要求投资者相信未经审计的增长信号、尚未跑完的领导层过渡，以及没有确认二级参考价的私募市场非流动性溢价。
