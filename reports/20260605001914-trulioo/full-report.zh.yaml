      - number: '1.2'
        title: 领导层更替与治理姿态
        blocks:
          - type: paragraph
            body: >-
              2025 年和 2026 年，Trulioo 领导层变化明显。公司于 2025 年 4 月 1 日任命 Vicky Bindra 为 CEO，接替 Steve Munford；公司称 Munford
              带领业务完成大幅扩张，收入增长至三倍。Bindra 曾在 Nuvei、FIS、Visa 和 Mastercard 担任高管，履历更像支付行业运营型高管，而不是创始人 CEO。2026 年 3
              月，公司扩充高管层，任命 Chad Gerhardstein 为首席风险与战略官、Danielle Holbrook Dunn 为首席转型官、Uri Zelmanovich 为
              CFO。随着公司向平台、风险和信贷决策用例推进，这表明 Trulioo 正在搭建更成熟的企业运营层。治理可见度则好坏参半。Corporations Canada 将 Steve Munford、Stephen
              Ufford、Tanis Jorge、David Blumberg、Lisa Stanton、Mark Midle 和 Andrew Lugsdin
              列为董事，但同一文件没有提交重大控制人信息。私营公司缺少受益所有权可见度并不罕见，但评估控制权、董事会影响力和股东集中度时，这是实质性尽调限制。
