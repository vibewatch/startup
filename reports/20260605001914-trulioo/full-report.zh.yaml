      - number: '8.5'
        title: 建议、退出准备度与否决触发条件
        blocks:
          - type: paragraph
            body: >-
              建议：跟踪。基于当前证据质量，正确姿态既不是买入，也不是回避，而是严格监控并配套结构化尽调议程。Trulioo 是高增长品类中的高质量平台资产，但用于承销 2021 年价格的证据基础并不完整。

              升级为买入需要：(1) 审计财务确认 ARR 轨迹和毛利率画像；(2) 客户集中度数据确认前五大账户贡献不超过 ARR 的 40-50%；(3) 过去 12 个月内确认的 409A 或董事会批准的企业价值；(4)
              净收入留存数据确认增长来自扩张，而非流失后替换；(5) 跑道确认未来 18-24 个月不需要新的摊薄性融资。

              退出准备度中等。公司有可信路径：在建设性市场中 IPO（新 CFO 和高管团队释放为上市公司治理做准备的信号）、战略 M&A（包括 RELX、Experian、Mastercard、TransUnion
              和大型支付处理商在内的金融科技基础设施买家是自然收购方），或二级要约（TCV 和机构共同投资者可能以低于 2021 年标记的某种折价提供二级供给）。APAC 增长故事、新平台能力和 J.P. Morgan
              Payments 合作关系提供了新的证明点储备，管理层可以借此搭建更新后的投资者叙事。

              否决触发条件很具体。24 个月内出现第三次 CEO 更替——超出 Munford 到 Bindra 的交接——将破坏投资论点。新的股权融资若投后估值低于 $1.3B，将确认降估融资，并实质性重锚估值。监管针对
              Trulioo 或主要客户采取执法行动，并指出 Trulioo 验证导致合规失败，将带来法律和声誉传染。ARR 同比增长连续两个季度低于 10%，将移除增长溢价。尽调披露任何单一账户集中度超过
              50%，会增加二元收入风险，而当前价格没有为此定价。
