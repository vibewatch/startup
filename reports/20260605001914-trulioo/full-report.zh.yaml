      - number: '8.3'
        title: 情景分析与概率加权区间
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的情景构建必须绕开狭窄的公开证据基础。收入估计来自第三方
              Latka，不是审计数据。增长率来自地域和产品组合新闻稿，而非利润表。以下情景基于公开指标和有依据的假设；它们是投委会讨论工具，不是公允价值意见。

              牛市情景假设 Trulioo 到 2026 年维持 20-25% ARR 增长——考虑到 2024 年重新加速至 29%、APAC 扩张和 KYB 组合迁移，这一假设有可行性。按 2026 年约 USD
              190-200M 的最近期 ARR 估计给予 14-18x，牛市估值 USD 2.0-2.5B 可以成立。该情景要求：CEO 过渡不引发明显流失；KYB 和 UBO
              工作流维持溢价定价；毛利率守住或扩大；平台叙事吸引高倍数战略退出或 IPO。

              基准情景假设 2024 年重新加速之后，ARR 复合增速放缓至 12-15%，与 16.9% 的底层市场 CAGR 大体一致，同时同业竞争加剧。按 2026 年约 USD 170-180M 的最近期 ARR
              估计给予 9-12x，基准区间 USD 1.4-1.8B 让公司大致贴近 2021 年标记，既没有明显升值，也不是降估融资。

              熊市情景假设增长降至个位数——如果 Socure 的银行集中策略、Jumio 的专利组合，或资金充足的新进入者夺走企业份额，这可能发生。按接近 USD 155-165M 的 2026 年估计 ARR（保守外推
              2024 年增长）给予 5-7x，熊市区间 USD 0.8-1.1B，意味着相对 2021 年标记出现实质减记。如果员工压缩反映增长天花板反应而不只是效率提升，且领导层过渡扰动关键客户关系，熊市情景最可能成立。

              基于可获得的公开证据，概率权重约为：牛市 20-25%、基准 55-60%、熊市 20-25%。由此得到的概率加权区间约为 USD 1.3-1.8B。
