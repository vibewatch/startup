      - number: '4.2'
        title: GTM 动作与销售效率：企业直销模式，公开效率数据有限
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Trulioo 是在灵活 API 平台之上叠加企业直销 GTM，而不是纯自助 SaaS。GetLatka 将 53 名背配额销售代表和约 450 名客户归于
              Trulioo；简单平均，每名销售代表只有约 8 到 9 个账户。这个比率说明公司明显重视具名账户覆盖，尽管真实账本大概率偏向大型受监管买方。客户标识质量也支持这一解读。J.P. Morgan Payments
              于 2023 年选择 Trulioo 做全球个人和企业验证；Airwallex 自 2017 年起使用 Trulioo，并随着年处理规模扩至超过 $100 billion、覆盖 181 个国家，将合作扩展到
              KYB。产品采用数据也说明，Trulioo 卖的是更宽的工作流层，而不只是离散核验：2023 年 65% 新客户选择工作流能力，40% 采用包含 UBO 发现的端到端 KYB 加 KYC 工作流。2022 年 2
              月收购 HelloFlow 也符合这一模式，把编排和锁定加入核心验证栈。粗略混合每客户收入代理值约 $335,000，表面上有吸引力，但几乎肯定被企业集中度扭曲。CAC、回本周期、NRR、流失、实际 ASP
              仍未公开，因此销售效率只能根据方向性信号承销。
