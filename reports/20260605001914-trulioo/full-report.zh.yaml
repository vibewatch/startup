      - number: '3.2'
        title: 按类别拆解竞品画像
        blocks:
          - type: paragraph
            body: >-
              Jumio 是最直接的全球同行。其平台每秒处理 120 笔交易，支持 5,000+ 种政府 ID 类型，累计处理 1B+ 笔交易，拥有 300+ 项专利和专利申请。Jumio 将覆盖 30M+ 已知身份的
              Jumio Identity Graph 包装为跨会话网络护城河，用于主动欺诈检测。G2 评价者认为 Jumio 比 Trulioo 更贵，指向更高端的价格层级。


              Veriff 总部位于爱沙尼亚，覆盖 230+ 个国家和地区，支持 12,500+ 种政府证件类型，每个会话分析 1,000+ 个信号，并声称准确率 99.6%、决策时间 6 秒。它服务全球 3,000+
              家企业，并把不断扩大的跨会话情报网络定位为可与 Jumio Identity Graph 对标的数据护城河。


              在数字原生同行中，Socure 已经建立最深的北美足迹：3,000+ 客户，包括美国前 20 大银行中的 18 家、前 15 大发卡机构中的 13 家、4 大 HRIS 平台中的 4 家，以及前 5
              大社交网络中的 4 家。其垂直整合 AI 平台擅长提升美国消费者自动开户批准率，但跨境国家覆盖更窄，KYB 深度也不如 Trulioo 成熟。


              Persona 以模块化和开发者体验竞争。动态流程构建器、Workflows 引擎和基于 Graph 的链接分析，让产品团队无需深度集成也能拼出验证流水线；与一体化平台相比，初始锁定更低。


              Alloy 受 800+ 家金融机构和金融科技公司信任，并通过供应商中立的开放数据生态接入 270+ 个伙伴解决方案。它的编排层明确让买方可以替换底层验证提供商，因此在 Alloy 介导的交易中，Trulioo
              更像众多数据源之一，而不是主平台供应商。


              Sardine 聚焦金融犯罪防控，能力包括行为生物识别、设备画像、支付欺诈检测和 AML 自动化代理。Sardine 拥有 450+ 企业客户，已筛查 $1.36T+ 支付；它更像功能补充，而不是 Trulioo
              全球身份核验范围的直接替代。LexisNexis Risk Solutions（RELX 子公司，RELX 2025 全年收入 £9.2 billion）通过观察名单筛查、AML
              数据和深层企业数据转售渠道竞争。TransUnion 的验证能力主要由征信局驱动，在美国消费者信用身份匹配上更强，但在跨境、KYB 或证件验证工作流上较弱。
