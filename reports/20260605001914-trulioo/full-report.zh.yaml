  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与真正要完成的任务
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的市场更适合定义为：面向开户和生命周期风险决策的数字身份验证与合规编排。这意味着可争取的预算不是全部网络安全、全部欺诈软件或全部 IAM，而是一组更窄的产品和工作流：帮助企业验证个人和企业、满足
              KYC/KYB/AML 义务、降低欺诈，并维持可接受的开户转化率。MarketsandMarkets 用 KYC、KYB、开户、访问控制和用户监控、身份欺诈合规与取证等应用来描述这个品类。Trulioo
              自身产品页也强化了类似边界：公司面向银行、汇款、加密、市场平台、支付和财富管理销售身份验证、企业验证、观察名单筛查、证件验证、工作流工具和区域合规支持。因此，现状替代方案既包括一体化平台，也包括由点供应商、数据提供商、观察名单工具和内部编排拼接出来的技术栈。核心任务不只是身份核验，而是在多个司法辖区满足不断变化的监管与反欺诈要求，同时把好用户和好企业转化进来。
