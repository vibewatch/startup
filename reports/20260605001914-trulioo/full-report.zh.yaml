  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Trulioo
        - 全球平台
        - $394M Series D 轮（TCV，2021）；估计 2024 年收入 $150.6M
        - 全球金融科技公司、跨境支付、受监管市场平台
        - 一个 API 覆盖 195 个国家的 KYC/KYB/AML/证件/欺诈；模块化启用
        - 美国企业客户背书深度低于 Socure；客户数未披露
      - - Jumio
        - 直接全球同业
        - 已处理 1B+ 笔交易；300+ 项专利
        - 全球金融服务、游戏、旅行、受监管入驻
        - Identity Graph（30M+ 个身份）；AI 生物识别；广泛专利库
        - G2 评论者认为价格高于 Trulioo；定价不透明
      - - Veriff
        - 直接全球同业
        - 3,000+ 家企业；覆盖 230+ 个国家和地区
        - 需要全球证件验证的金融科技公司、零工平台、受监管企业
        - 12,500+ 种证件类型；每次会话 1,000+ 个信号；99.6% 准确率
        - 美国银行渠道覆盖窄于 Socure；定价仅可联系销售
      - - Socure
        - 以美国为中心的 AI 身份平台
        - 3,000+ 家客户；美国前 20 大银行中 18 家；美国前 15 大发卡机构中 13 家
        - 美国银行、信用卡发行方、金融科技公司、零工平台、体育投注平台
        - 美国金融服务渗透最深；垂直整合 AI 决策
        - 跨境国家覆盖和 KYB 深度窄于 Trulioo
      - - Persona
        - 模块化编排 / 验证平台
        - 800+ 家客户（公司自称）；2018 年成立
        - 高增长金融科技公司、市场平台、合规需求演进的消费应用
        - 动态流程构建器；模块化 KYC/KYB/欺诈；集成锁定低
        - 全球数据合作广度较弱；2022 年后未披露收入或融资
      - - Alloy
        - 开放生态编排层
        - 800+ 家金融机构和金融科技公司；270+ 个数据合作伙伴集成
        - 需要多供应商风险编排的银行、金融科技公司和信用合作社
        - 供应商中立的数据市场降低对单一 IDV 提供商的依赖
        - 不拥有一手验证数据；把 Trulioo 定位为数据源
      - - Sardine
        - 金融犯罪 / 反欺诈邻近品类
        - 450+ 家企业客户；筛查 $1.36T+ 支付
        - 聚焦欺诈和 AML 合规的银行、金融科技公司和支付公司
        - 行为生物识别 + 设备画像 + AML 自动化智能体
        - 不是全覆盖全球 KYC/KYB 平台；更多是补充而非替代
      - - LexisNexis Risk Solutions
        - 既有风险数据提供商
        - RELX 子公司；RELX 2025 年收入 £9.2B
        - 已有数据合同的银行、保险、政府和法律企业
        - 数十年的名单、AML、欺诈和实体解析数据关系
        - API 集成较慢；定价和合同结构对开发者不够友好
      - - Onfido / Entrust
        - 被收购的专业厂商
        - 2024 年被 Entrust 收购；合并数字身份 + PKI + 证书组合
        - 需要将证件验证与 PKI/签名集成的受监管企业
        - 生物识别证件验证 + Entrust 更广的身份基础设施
        - G2 评论者认为 Onfido 在部分细分市场的 ROI 慢于 Trulioo
      - - TransUnion
        - 既有征信机构 / IDV 邻近厂商
        - 上市公司；消费者信用报告既有厂商
        - 有信用数据集成需求的美国消费金融
        - 在美国的征信机构关系和消费者 ID 画像深度
        - 跨境 KYB、证件验证或数字入驻能力更窄
      - - 现状 / 自建
        - 替代方案
        - 无专项融资；既有工程团队成本
        - 内部工程强、监管复杂度低的企业
        - 控制力最高；无供应商依赖；利用云 OCR/人脸识别 API
        - 集成负担更高；合规适配更慢；没有跨境数据网络
    notes: 各行覆盖截至 2026 年 6 月公开证据可见的重要直接、既有、邻近、替代和现状方案。规模 / 融资数字为公司自称或第三方估计， 除非来自一手文件。标注“仅可联系销售”的单元格表示定价未公开披露。
