      - number: '2.3'
        title: 买方、用户与预算归属分层
        blocks:
          - type: paragraph
            body: >-
              买方地图很宽，但结构仍然清楚。Trulioo
              的公开材料反复瞄准受监管、对信任敏感的数字企业：银行、支付服务提供商、在线市场平台、汇款公司、加密平台和财富管理机构。在这些组织里，直接用户通常是开户、欺诈、合规或运营团队；经济买方往往是合规、风险、欺诈或产品高管；技术实施者则是负责集成
              API、托管流程或工作流工具的工程或平台团队。客户案例也强化了这种分层。J.P. Morgan Payments 强调支付规模下的信任与安全，Airwallex 代表跨境金融科技，Trust Payments
              体现欧洲支付现代化，Public
              则落在投资平台开户场景。产品页和评价平台还显示，市场越来越看重编排和可配置工作流，而不只是原始证件或数据匹配。这使合规、欺诈、数字开户和平台工程团队之间出现预算重叠，也让工作流灵活性和广泛数据覆盖成为格外关键的采购标准。
