  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础覆盖全球支付、银行、加密、平台市场和新兴垂直行业
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的企业客户基础以全球支付和金融科技为锚，但已经延伸到五个或更多不同垂直领域。2023 年 12
              月增长公告用具体说法勾勒出已安装客户群：美国五大银行中的三家、全球七大数字支付处理商中的六家、全球领先在线平台市场中的五家、五大国际外汇经纪商中的四家，以及四大加密交易所中的三家。这些都是厂商自述，没有给出具名客户或独立确认，但它们提供了一个结构性视角：截至
              2023 年末，Trulioo 已经渗透到哪些客户群。支付和金融科技是核心 ICP：J.P. Morgan Payments 合作、Airwallex 关系、Trust Payments、Nium 和 Nuvei
              都代表支付基础设施或支付平台买方，它们用 Trulioo 验证自己的准入流程。

              支付之外，加密是有意义的早期客群。截至 2023 年，四大加密交易所中的三家被列为客户；全球使用的多资产交易平台 eToro 也是具名案例参考。新加坡办公室在 2022 年 9
              月开设，部分原因就是服务加密需求较重的 APAC。在线平台市场构成第三个集群：Trulioo 声称服务全球领先在线平台市场中的五家，且至少一个未具名平台市场案例研究覆盖十个信任与安全关键市场。Ethereum 与
              MetaMask 基础设施公司 Consensys，则提供了加密相邻 KYB+KYC 准入的证据。

              2023 年以来的 APAC 增长让客户基础更多元。2025 年 4 月 APAC 增长公告显示，APAC 收入同比增长 64%，其中平台市场交易增长 37%，金融科技企业交易增长 55%。TrustRadius
              上的 HG Insights 安装数据把 Finance and Insurance 列为最常见垂直行业，占 81 个检测到安装的 29.6%；Information 占 22.2%，Professional,
              Scientific, and Technical Services 占 16%。医疗在 2026 年 4 月进入具名客户名单，加拿大领先远程医疗平台 Phoenix Digital Health 选择
              Trulioo 做患者身份验证。这种从金融科技进入医疗的垂直多元化说明，随着合规驱动的准入要求扩散到新行业，Trulioo 正在走出核心 ICP。
