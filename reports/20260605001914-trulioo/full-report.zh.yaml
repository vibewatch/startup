      - number: '3.4'
        title: 切换成本、锁定效应、多供应商并用与分销权力
        blocks:
          - type: paragraph
            body: >-
              身份验证的切换成本中等，并不算高。Trulioo、Jumio、Veriff、Persona 和 Alloy 共同采用的 API
              优先集成模式意味着，当价格、合规姿态或数据质量变化时，技术能力强的团队可以在一个季度内评估并替换主 IDV
              供应商。更深的锁定来自工作流定制、锚定特定供应商输出格式的合规文档，以及在受监管环境中切换证件模型所需的重新验证负担。Trulioo 的 ISO 27001（2015 年起）和 SOC 2 Type 2（2024
              年 2 月）认证是企业采购必要条件，但不足以成为护城河：Jumio、Veriff、Socure 和 Alloy 也有类似合规栈。


              多供应商并用很常见。大型全球企业经常在跨境市场运行 Trulioo，同时用 Socure 这类聚焦美国的供应商补足本土深度，或用 Alloy 作为编排层，在多个供应商之间路由验证调用。Alloy 的 270+
              伙伴集成和供应商中立模式有意支持多供应商并用，压缩了任何单一供应商仅靠锁定效应收取溢价的能力。


              分销权力偏向已有企业关系的既有巨头和平台供应商。LexisNexis Risk 母公司 RELX 公布 2025 全年收入 £9.2 billion，说明其客户足迹和资产负债表远大于
              Trulioo。TransUnion 的征信局关系为其进入消费者金融提供现成分销渠道，不过对 Trulioo 最强的 KYB、跨境开户和数字市场平台细分来说，用处较小。Trulioo 的 $394M Series
              D（TCV 领投，2021 年 6 月）让它成为资本最雄厚的纯全球 IDV 平台之一，但与上市既有巨头相比，它在资产负债表和既有关系深度上仍更小。GetLatka 估计 Trulioo 2024 年收入为
              $150.6M（高于 2023 年的 $116.9M），显示持续增长；但不同于 Socure（3,000+）和 Veriff（3,000+），Trulioo
              没有披露客户数，这限制了外部对留存和细分渗透的独立评估。
            claimRefs:
              - CP016
              - CP020
              - CP025
              - CP026
              - CP027
              - CP028
