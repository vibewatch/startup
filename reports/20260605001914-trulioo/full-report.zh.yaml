      - number: '6.2'
        title: 具名客户证据在全球支付和金融科技最强，加密与医疗证据在增加
        blocks:
          - type: paragraph
            body: >-
              质量最高的公开客户证据，涉及多年、多产品、多地理区域部署。Airwallex 是旗舰参考：2024 年 9 月合作扩展公告记录了一段始于 2017 年的七年关系，最初在 APAC 使用 Person Match
              和 Identity Document Verification，随后扩展到美洲和欧洲，并在 2022 年进一步加入用于 KYB 和受益所有人筛查的 Business Verification。Trulioo
              已为 Airwallex 在 181 个国家验证来自 162 个国家的护照、来自 119 个国家的身份证件，以及 104 种驾照。Airwallex 服务超过 100,000 家全球企业，年处理量超过 $100
              billion。Airwallex IT 与信息安全副总裁 Elliot Colquhoun 确认了合作关系的动态特征：Trulioo 会随着时间调整身份工作流，以跑赢欺诈并保持合规。

              J.P. Morgan Payments 在 2023 年 10 月选择 Trulioo，为其客户支持全球个人与企业验证。JPM Trust and Safety 全球负责人 Ryan Schmiedl
              公开表示，选择标准是 Trulioo 的 PII 数据源广度、匹配率和全球足迹。J.P. Morgan 每天在 160 多个国家处理超过 $9 trillion 的支付。Trust Payments
              是一家欧洲支付公司，服务 20,000 家企业，月交易量超过 £1 billion；它在 2025 年 6 月上线 Trulioo。在采用 Trulioo 前，Trust Payments
              的堆栈分散在五家厂商；集成后，公司在关键市场达到 85% 验证成功率，并用一个覆盖 KYC、KYB、观察名单筛查和 Workflow Studio 的单一平台，替代了多厂商复杂度。CEO
              引述把这称为“准入的新数字方向”。

              美国多资产投资平台 Public 在 2023 年为英国上线选择 Trulioo Person Match，理由是需要全球能力来满足 AML 和 KYC 要求。加拿大领先远程医疗平台 Phoenix
              Digital Health 在 2026 年 4 月选择 Trulioo KYC Documents，用于验证患者身份并遵守 PIPEDA；加拿大数据托管是明确要求。Phoenix
              合作把医疗加入到身份验证即合规义务的行业范围内，与 Trulioo 自称向新受监管垂直行业扩张一致。

              在案例研究库中，Nium 使用 Trulioo 应对跨境支付的多样监管要求，Consensys 使用 Trulioo 提升 KYB 和 KYC 准入效率，eToro 使用 Trulioo
              以合规准入扩展到新市场，Stake 使用 Trulioo 为全球客户群开放美国投资市场。其他未具名案例研究包括：一家加密交易所预计每年增加 180,000 名用户，平均绩效提升 5%；一家汇款公司实现 $1.5
              million 额外年收入，归因于 Trulioo 价值优化；一家未具名金融科技公司转向 Trulioo 后匹配率提升
              18%。这些未具名叙述来自厂商，无法独立验证；但结果足够具体（美元收入、用户数量、匹配率提升），更像经过验证的案例研究，而不是凭空编造的客户证言。
