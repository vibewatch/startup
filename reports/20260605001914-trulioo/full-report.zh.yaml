      - number: '6.3'
        title: 评论信号稀薄但确认了集成复杂度；多产品扩张是最可见的粘性信号
        blocks:
          - type: paragraph
            body: >-
              第三方评论平台的信号有限，但仍有信息量。FeaturedCustomers 报告 27 条客户评论和客户证言，以及 29 个案例研究，说明 B2B 企业产品有一个健康的参考基础。G2
              档案显示感知成本很高（$$$$$ 评级），典型实施时间为 2 个月；值得注意的是，截至 2026 年 5 月快照，该档案显示过去 2 个月没有收到新评论。TrustRadius 显示一条评分 10/10
              的评论。Software Advice 把 Trulioo 列为 GlobalGateway，并显示有可用评论。这些稀薄评论信号与企业产品特征一致：采购多通过直销和 RFP
              流程，而不是自助式购买；但也意味着关于实施后满意度或续约行为的独立证据有限。

              最强的可见粘性来自账户内多产品扩张。Airwallex 案例展示了一条路径：2017 年两个产品（Person Match 和 IDV），到 2022 年三个产品（加入 Business
              Verification），地理覆盖从 APAC 扩到美洲和欧洲，且持续扩大。2023 年新客户队列中，65% 明确选择 Trulioo 的工作流能力（Workflow Studio），40% 采用 KYB
              能力——这些信号说明账户不是落在单一单点方案上，而是在更宽的平台上落地。Trust Payments 用 Trulioo 替换五家厂商，代表典型流失动态的反面：客户在向 Trulioo 集中，而不是离开它。

              Nuvei 全球风险与承保高级副总裁 Philippe Panneton 在 2023 年新闻稿中给出直接产品对比：“有了 Trulioo，我们可以用一个解决方案同时做 KYB 和基于身份证件的 KYC
              检查，把过去笨重的准入流程变得快速而简单。这让我们能够在多个大洲保持合规，并提供能加速客户业务的支付解决方案。”
              这种来自具名副总裁、带有具体工作流和合规结果的引述，质量高于泛泛的厂商提及。它也强化了先落地再扩张的逻辑：客户先落在一个验证产品上，再扩展到合并的 KYB+KYC 平台。切换成本来自 API
              集成深度、合规工作流配置，以及在部署中途把数据源和审计轨迹迁移到新厂商的难度。
