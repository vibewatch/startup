  productSummary: Trulioo 通过单一 API 和 Workflow Studio 销售模块化全球合规平台，为受监管数字企业提供个人身份验证、带 UBO 发现的企业实体验证、AML 观察名单筛查、证件验证和风险评分服务。
  customerFocus: 需要多国 KYC、KYB、AML 和反欺诈工作流的受监管数字企业，包括银行、支付处理商、金融科技公司、市场平台、加密交易所和数字健康平台。
  businessModel: 按次核验计费的用量模式，叠加基于工作流的组件；客户按每笔验证交易付费，而不是支付固定 SaaS 席位费，因此收入会随客户交易量波动。
