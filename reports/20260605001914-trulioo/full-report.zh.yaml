      - number: '1.4'
        title: 里程碑、客户信号与经营动能
        blocks:
          - type: paragraph
            body: >-
              2022 年以来，Trulioo 的里程碑更像是平台范围扩张，而不是单一产品叙事。公司 2022 年 2 月收购 HelloFlow，在 GlobalGateway 基础上加入无代码编排和工作流设计；2023 年
              1 月又推出统一全球身份平台，纳入 Workflow Studio、API Direct，以及个人、企业、证件和观察名单服务。2023 年 12 月增长更新称，65% 新客户选择了工作流能力；Trulioo
              服务了美国五大银行中的三家、全球七大数字支付处理商中的六家，以及多个领先市场平台、券商和加密交易所。具名客户证据强于许多私营基础设施同行：官方引用包括 J.P. Morgan
              Payments、Public、Airwallex、Trust Payments、Phoenix Digital Health、Consensys、Nium、eToro、Stake 和 Metal
              Pay。近期发布也显示 APAC 和 KYB 仍有动能。Trulioo 2025 年 4 月披露 APAC 收入同比增长 64%，随后又称 2025 年 APAC 企业验证量同比增长 51%，原因是新的 UBO
              发现能力改善了碎片化市场中的所有权可见度。
