      - number: '4.3'
        title: 成本结构与经营杠杆：员工效率有信号，毛利率未公开
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的成本结构只露出一部分，但现有证据指向经营杠杆改善，而不是开支失控。员工数是最清楚的代理指标。2023 年 1 月平台发布稿称员工数几乎翻倍至 430 人；第三方资料后续显示，2024 年约
              405 人，2026 年约 375 人。如果 GetLatka 的 ARR 数字方向正确，单员工收入就从 2021 年约 $293,000 明显提升到 2024 年约
              $402,000。对一家仍在投入平台广度的公司来说，这是有意义的效率提升。成本栈大概率并不轻：Trulioo 依赖 450+
              全球数据源，必须在多个司法辖区为登记册和观察名单访问付费，运行用于证件和企业验证工作流的 AI 与机器学习模型，并从 Vancouver、Dublin、Singapore
              等多个区域办公室支持客户。即便如此，近期产品更新仍暗示单位成本有所改善。2025 年 3 月 AI 与机器学习发布稿称任务处理时间减少 60%、验证率提升 20%；2026 年 3 月高管任命发布稿称 KYB
              处理时间从 6 秒降至 3.3 秒。新任 CFO Uri Zelmanovich 被明确聘来带入财务严谨性、资本纪律和经营杠杆，这进一步支持了一个判断：利润率管理已经成为核心运营优先事项。
