      - number: '4.5'
        title: 财务结论：效率改善、国际组合上升，结构性尽调缺口仍在
        blocks:
          - type: paragraph
            body: >-
              公开财务结论方向偏正面，但仍不完整。利好一侧，Trulioo 似乎在 2024 年重新加速 ARR 增长，2025 年披露 APAC 收入增长 64%，受益于 KYB
              组合上移并可能支撑更高价格实现，同时在员工总数低于 2023 年峰值的情况下提升了单员工收入。这些信号符合一家公司优先经营纪律、但并未明显退出增长的样子。2026 年聘任 CFO
              也强化了这个叙事：在资本市场对私营公司不透明度更不宽容时，公司开始引入更正式的财务领导。但反向证据也真实存在。G2 评价者称定价高于竞品，说明至少部分客户对价格敏感。估值锚点很旧，2021
              年以来没有新股权融资的含义并不清晰，员工数下降既可能反映效率提升，也可能反映需求走弱。最重要的是，核心承销栈缺失：毛利率、现金、烧钱速度、现金跑道、NRR、流失、CAC、客户集中度和实际企业定价都未披露。作为加拿大私营公司，Trulioo
              不提供 SEC 式或当前 SEDAR 式公开财务报告。因此，要关闭任何严肃的财务承销案例，必须拿到管理层数据。
