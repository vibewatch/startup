      - number: '7.2'
        title: 数据隐私、安全与合规风险
        blocks:
          - type: paragraph
            body: >-
              身份验证平台在隐私版图中处于异常敏感的位置。Trulioo
              代表受监管金融机构、金融科技公司和平台市场处理生物识别数据（证件照片、用于活体检测和匹配的人脸图像）、政府身份记录，以及消费者金融和人口统计数据。这在多个框架下叠加出隐私风险。

              数据安全方面，相比市场同行，Trulioo 的缓释姿态较强。公司自 2015 年起持有 ISO 27001 认证——对一家私营科技公司来说期限异常长——并在 2024 年 2 月取得 SOC 2 Type
              2。安全页面描述了一套多层计划，包括预防性控制、意识培训、审计、事件响应，以及专门的信息安全和技术合规团队。这些资质实质降低了灾难性泄露的概率，但不能消除风险。对一家价值主张是信任基础设施的公司来说，任何公开披露的泄露都会造成不成比例的伤害——客户整个合规准入工作流都押在上面。

              跨境个人数据传输是最复杂的隐私风险维度。Trulioo 服务全球客户，并为欧洲客户处理欧盟数据主体信息。其 Services Privacy Policy 承认国际数据传输，并引用包括 Standard
              Contractual Clauses 在内的法律机制，但没有公开说明它是否依赖 EU-US Data Privacy Framework 充分性决定、Binding Corporate Rules，还是只依赖
              SCCs。Schrems II 后，欧盟数据保护机构加大了对处理欧盟个人数据的美国 SaaS 厂商的审查。如果 EU-US 充分性框架再次遭遇法律挑战，Trulioo 的欧盟数据传输机制将需要立即复核。UK
              ICO 关于处理合法基础的指南也强调，组织必须在开始处理前确定合法基础——这是 Trulioo 自身控制者活动必须满足的合规义务，也必须为配置其 API 工作流的客户记录清楚。

              CCPA/CPRA 暴露已经存在。Trulioo 的 California Privacy Notice（2024 年 5
              月）描述了消费者权利，包括选择退出出售或共享个人信息、更正和删除。其服务也触及与健康相邻的数据类别（医疗场景下的身份），可能触发 California Consumer Health Data Privacy
              Law 义务。公司的 cookie policy 披露使用第三方分析和营销技术，在 Trulioo 的网站资产上制造 ePrivacy 和 GDPR 同意管理义务，而且这些义务必须随着监管解释演变持续维护。

              自动化决策风险结构性嵌入 Trulioo 产品。身份验证结果——通过、拒绝、标记复核——可能决定一个人能否获得金融服务、信贷或数字商业入口。Trulioo 自己的 Services Privacy Policy
              承认这一点；其平台必须提供人工复核机制，或在 GDPR Article 22、CCPA 等效条款，以及适用于 AI 辅助决策支持系统的新兴 EU AI Act 条款下提供充分保障。
