        - 仅 KYC；英国上线后没有扩展到 KYB 或更多市场的证据
      - - Phoenix Digital Health
        - 数字医疗 / 加拿大远程医疗
        - KYC Documents 用于患者身份验证；PIPEDA 合规；加拿大数据托管
