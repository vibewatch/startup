      - number: '5.6'
        title: 产品与技术风险
        blocks:
          - type: paragraph
            body: >-
              产品与技术评估中，有五类风险值得重点关注。第一，AI/ML 声称膨胀：所有绩效指标（处理速度快 60%、验证率高 20%、欺诈减少
              15%）都来自厂商新闻稿，没有独立基准测试或学术验证。公司承认，包括深度伪造在内的高级欺诈技术占其观察到的全部攻击的 16%；这凸显了对抗性环境，但没有提供可复现的模型绩效数据。

              第二，企业规模实施摩擦：G2 评论报告典型实施时间为 2 个月，且感知成本较高。Trust Payments 案例研究展示了最佳情形部署，但它明确是合作伙伴展示。企业客户如果要在现有 API 面上集成复杂的多区域
              KYC、KYB 和 DocV 工作流，应为大量专业服务时间留出预算。

              第三，旧端点复杂度：Trulioo 并行运行两套认证系统（旧 v1 和 v3 API 使用 Basic Auth；Platform/Workflow Studio API 使用 OAuth
              2.0），总计四种凭据机制。这种拆分要求客户管理多套凭据，也会制造开发者困惑。v1 SDK 代码库明确标为 legacy，说明部分客户仍留在旧 API 面上。

              第四，隐私和合规负担：Trulioo 在 FinCEN、FCA、FINTRAC、CySEC 等辖区制度下，同时作为数据处理者和控制者运行。这种广度是商业优势，但也意味着客户必须验证 Trulioo
              的辖区特定配置是否匹配自身真实合规义务——复核负担落在买方身上。

              第五，公开可靠性不透明：开发者文档中没有找到公开正常运行时间 / SLA 承诺、状态页 URL 或可靠性指标，企业买家若不直接进入商务谈判，就很难把服务级别要求写进合同。
            claimRefs:
              - CE035
              - CE039
              - CE040
              - CE043
              - CE044
      - number: '5.7'
        title: 证据项
        blocks:
          - type: callout
            title: GlobalGateway 数据源网络广度
            body: >-
              Trulioo 通过单一 API 访问 195 个国家、43 种语言、450+ 个数据源，这是分析师评论和企业客户案例中最常被提及的竞争护城河。J.P. Morgan
              Payments、Airwallex、Nuvei、eToro、Consensys 等合作伙伴部署横跨多个地理区域，给出佐证信号：覆盖已经在运行，不只是被收进目录。没有其他单一厂商身份平台公开记录了同等触达范围。
