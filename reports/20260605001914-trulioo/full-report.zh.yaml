      - number: '1.5'
        title: 优势、公开市场准备信号与未解问题
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一条可信的优势逻辑：地理覆盖广，统一开户技术栈，企业客户标识可见，产品组合也持续变宽，已经从身份验证延伸到欺诈情报、企业验证和信贷决策。安全和隐私姿态也被充分营销：2015 年起通过 ISO
              27001，2024 年 2 月起通过 SOC 2 Type 2，且 2025 年和 2026
              年多次更新隐私政策。问题在于，披露质量仍低于投资人完整承销增长阶段机会所需的水平。公开记录无法确认最新股权结构，最新估值仍追溯到 2021
              年，当前客户数、盈利能力和烧钱速度也没有在官方文件中披露。评价网站整体偏正面，但 G2 仍指出其相对替代方案存在价格敏感性，这提醒我们：平台广度不能消除拥挤 IDV 市场中的商业压力。因此，Trulioo
              看起来运营成熟，但财务仍不透明；这对私营公司可以接受，却意味着在任何刷新估值判断前，还要完成有分量的尽调工作。
