      - number: '7.4'
        title: 合作伙伴与数据源依赖风险
        blocks:
          - type: paragraph
            body: >-
              Trulioo 身份平台在结构上依赖一个由 450+ 个数据源构成的网络，横跨 195 个国家的政府登记处、商业征信机构、移动运营商和公用事业公司。这种广度是公司的核心竞争差异化——但也是最脆弱的运营表面。

              政府和国家身份登记访问权是关键性最高的依赖。如果某国政府限制或撤回其身份登记处的 API 访问权（印度 Aadhaar 生态、南非 DHA、阿根廷 RENAPER
              在数据隐私争议后都出现过类似情况），Trulioo 会失去在该辖区提供权威验证的能力——且没有同等权威的可替代来源。主要市场（印度、尼日利亚、巴西、东南亚）的监管变化，因此可能在 Trulioo
              没有任何动作的情况下让覆盖失效。公司的服务隐私政策承认其 KYC 数据网络包含政府登记处和选民名册，但没有披露哪些具体登记处处于活跃状态，也没有披露登记处中断时的应急计划。

              机器学习模型依赖带来第二层风险。Trulioo 平台使用 AI 和 ML 做文档验证、活体检测、欺诈评分和匹配率优化。合成企业欺诈——把真实和伪造数据组合成虚构商业实体——在 Trulioo 自己的 2026
              年趋势报告中被明确列为快速演变的威胁，需要持续模型更新。模型退化、跟不上对抗技术，或算法决策（尤其在受保护类别语境下）受到监管挑战，都会制造产品责任暴露。Trulioo CTO Hal Lonas 提到的新兴
              Know Your Agent（KYA）监管概念，又增加了一个尚无监管框架的未知合规表面。

              客户集中度是未量化但重要的风险。GetLatka 将大约 450 个客户和估计 2024 ARR $150.6M 归于 Trulioo。如果官方材料中提到的三家美国五大银行等企业账户占该 ARR
              的比例过高，失去任何单一大客户都会造成实质不利影响。Trulioo 没有公开披露客户集中度指标。

              HelloFlow 收购（2022 年 2 月）带来了工作流编排能力，也带来集成债务。随着 Trulioo 平台演进，要在 GlobalGateway、源自 HelloFlow 的 Workflow Studio
              能力和新产品扩展之间维持功能对等与向后兼容，会持续增加工程复杂度，可能放慢产品速度，或在集成边界引入缺陷。
