      - number: '5.3'
        title: 技术差异化
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的技术差异化靠四根支柱撑住：数据源网络广度、自研 AI/ML 模型、Known Faces 生物识别观察名单，以及由 AI 治理的 UBO 发现。

              数据源网络——覆盖 195 个国家、43 种语言、450+ 个来源——是底层护城河。许多单点方案只从少数征信局购买覆盖范围；Trulioo
              则声称自己直接接入数百个本地身份机构、公用事业数据提供方和官方商业登记处。覆盖范围说法来自厂商自述，没有经过独立审计，但 J.P. Morgan、Airwallex、Nuvei、eToro、Consensys
              等合作公告横跨多个地理区域，给出佐证信号：覆盖不是目录里列着，而是在实际运行。

              AI/ML 差异化主要集中在 Document Verification。2025 年 3 月发布称，作业处理时间减少 60%，验证率提升 20%，自动批准率提升 20%——公司把这些改善全部归因于自有、内部
              ML 模型的改进，而不是第三方 AI 工具。公司称，模型通过识别安全特征（全息图、水印、微缩印刷）的模式来检测证件篡改、深度伪造和数字操纵；高级人脸匹配则使用卷积神经网络和相似度分数的深度学习。2025 年 10
              月更新加入自动采集模式，可借助 ML 每秒捕获多张高质量图像。所有绩效数字都来自厂商自述；未找到独立基准测试或第三方审计来佐证这些具体改善百分比。

              Known Faces 于 2025 年 10
              月推出，把生物识别验证延伸到持续认证。该功能把客户图像库做一对多比对，用来标记重复欺诈者，或识别过往交易中的可信用户。来自一家未具名金融服务提供商的早期数据显示，重复欺诈减少 15%，人工复核减少 12%。UBO
              发现使用由 AI 治理的实体解析引擎，整合并调和来自多个全球来源的不完整或不一致所有权数据。在 APAC 部署中，Trulioo 称某大型社交媒体平台的 UBO 覆盖率提升 40%，具体国家结果达到越南
              98%、菲律宾 70%、新加坡 81%——即便考虑这些数字来自厂商，这也代表相比只依赖传统登记处的方法有实质运营提升。
