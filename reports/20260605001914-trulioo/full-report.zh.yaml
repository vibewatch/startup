        title: 证据展品
        blocks:
          - type: callout
            title: Socure 的美国银行渗透是 Trulioo 近期最耐久的竞争壁垒
            body: >-
              Socure 在美国前 20 大银行中拿下 18 家参考客户，既形成数据网络效应（更多数据改善其美国消费者模型），也形成采购参考护城河。新的美国金融服务企业买方会面临明显的同业背书压力，往往要先评估
              Socure。Trulioo 若要达到类似美国深度，需要赢下标志性美国金融机构，或拿到分销合作；截至 2026 年 6 月，两者都没有公开确认。
            calloutType: risk
            claimRefs:
              - CP003
              - CP028
              - CP040
          - type: callout
            title: 开放生态编排器压缩 Trulioo 在介导交易中的定价权
            body: >-
              Alloy 的供应商中立编排模式拥有 270+ 个集成，在 Alloy 介导的企业交易中，会把 Trulioo 放在众多可替换数据提供商之一的位置，而不是平台供应商。这种结构性动态——其他编排层也会复制——降低了
              Trulioo 捕获完整合规工作流预算的能力，并让账户扩张取决于数据质量指标上胜过同行，而不是关系锁定。
            calloutType: insight
            claimRefs:
              - CP005
              - CP021
              - CP037
          - type: callout
            title: 跨境全球金融科技细分是 Trulioo 最可防守的位置
            body: >-
              Nium（每年在 190+ 付款市场处理 $60B+ 支付）和 EQ Bank 这类客户需要多司法辖区 KYC 和 KYB，无法用美国中心竞品或单一既有数据提供商替代
              Trulioo。跨境金融科技和受监管市场平台细分中，全球数据伙伴广度、单 API 简洁性和模块化 KYB 深度合成了一个竞争位置；国内优先竞品若要匹配，需要在每个新增司法辖区投入多年数据伙伴建设。
            calloutType: strength
