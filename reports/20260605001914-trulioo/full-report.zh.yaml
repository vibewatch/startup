  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：直接同行、既有巨头、邻近玩家、替代方案、现状方案与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的竞争版图分为五层。Jumio、Veriff 和 Onfido（2024 年被收购后现为 Entrust）是直接全球同行，围绕个人身份验证竞争，能力包括全球证件覆盖、生物活体检测和 AML
              筛查。以 Socure 最典型的美国中心 AI 平台，在本土金融服务渗透上领先，但跨境覆盖更窄。Persona、Alloy 和 Sardine
              等模块化、编排导向玩家处在邻近层：它们在底层验证提供商之上提供工作流组合和数据聚合，即使 Trulioo 数据仍留在底层，也可能削弱 Trulioo 的主平台锁定效应。LexisNexis Risk（RELX
              子公司）和 TransUnion 等既有风险数据提供商，靠深厚企业关系、自有征信和观察名单数据竞争，但更快的 API 集成平台也在给它们带来替代压力。现状替代方案——人工验证、内部 KYC
              团队，或由点工具拼接的技术栈——对尚未整合到托管平台上的中端市场买方仍然重要。


              潜在新进入者包括把身份服务加入云捆绑包的超大规模云厂商（AWS Rekognition、Google Cloud Vision、Azure AI），以及扩张信任层的支付网络（Mastercard
              Identity）。这些玩家尚未以完整功能竞品形态覆盖 Trulioo 的平台范围，但每一家都可能降低搭建合规验证工作流的摩擦，让客户不一定需要专门 IDV 供应商。G2 评价数据（存档）把 Onfido 列为
              Trulioo 第一替代方案，Jumio 列为第二；MarketsandMarkets 则将 Jumio、Veriff、Trulioo、LexisNexis Risk 和 Entrust
              识别为欧洲身份验证市场关键玩家，说明独立分析师和评价来源对竞争框架的看法一致。
