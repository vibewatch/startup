      - number: '3.5'
        title: 护城河耐久性、商品化风险与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的耐久优势集中在三根支柱。第一，全球数据伙伴：来自 195 个国家 400+
              家提供商的个人和企业验证数据，需要按司法辖区投入多年监管和集成工作；这是一个供给准入护城河，国内优先的竞品不能只靠产品路线图复制。第二，平台广度：把 KYC、KYB、AML
              筛查、证件验证、欺诈情报和工作流编排放在单一 API 下，能降低多产品买方的集成负担；点解决方案竞品如果不收购，很难匹配。第三，AI 和模型投入：Trulioo 2025 年 3 月数据显示，deepfake 和
              ID 篡改占全部攻击的 16%，其模型将处理时间最多缩短 60%、自动批准率最多提高 20%，说明模型改进循环还在继续，也把竞品的质量门槛抬高了。


              最关键的反向证据来自北美分销。Socure 对美国前 20 大银行中 18 家的渗透，在美国本土金融服务企业交易中形成了 Trulioo 尚未公开匹配的参考壁垒。G2 评价数据称，在部分评价者群体中，Onfido
              更易管理，也更能满足要求；这提示了一个可用性缺口，对集成资源有限的产品团队很重要。商品化风险真实存在：Alloy 这类开放生态编排器把主验证供应商变成可互换数据源，长期压缩定价权。合成身份欺诈和 deepfake
              扩散有利于持续重训模型的供应商，但也意味着所有竞品的技术门槛都在提高，任何单轮创新领先都难以长期维持。


              Nium（每年处理 $60B+ 支付，覆盖 190+ 付款市场）和 EQ Bank 等全球金融科技、跨境支付客户，展示了 Trulioo
              全球个人与企业验证覆盖最难被替代的细分。这个细分里，没有本土供应商能在不拼接多供应商的情况下覆盖所需广度；全球数据伙伴广度、单 API 简洁性和模块化 KYB 深度在这里合成了 Trulioo
              最可防守的竞争位置，也构成最不容易被 Socure 或 LexisNexis 替代的收入组合。
