      - number: '5.2'
        title: 平台架构与交付模式
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的架构以 GlobalGateway 作为路由层。客户提交 Verify
              请求后，平台先标准化载荷（PersonInfo、Communication、Location、NationalIds、Documents），再按目标国家路由到本地数据源，并返回包含匹配状态和交易记录的结构化结果。API
              Evangelist 目录记录了四组独立 API——Verifications (KYC)、Configuration、Connection、Business——以及 Document
              Verification、Person Fraud 和 Workflow Studio API，合计七份 OpenAPI 规范。Configuration
              端点支持验证前发现：客户在提交真实请求前，可以查询可用国家、数据源、证件类型和测试实体，支撑测试驱动式集成。Connection 端点暴露健康检查和认证测试原语（sayhello 和
              testauthentication），让团队在投产前验证凭据。

              开发者文档确认了四种认证机制：v3 Verifications、Configuration、Connection、Business、Document Verification 和 Person Fraud API
              使用 HTTP Basic（用户名 / 密码，Authorization: Basic 头）；Platform/Workflow Studio API 使用 OAuth 2.0 Client
              Credentials（auth-api.trulioo.com 上的双腿流程）；HMAC 请求签名用于完整性校验；需要证书认证的企业客户可使用双向 TLS（mTLS）。双认证架构——旧端点用
              Basic，新平台面用 OAuth 2.0——反映出公司 API 成熟度仍在演进，也可能要求客户同时管理两套凭据。

              交付选项覆盖三种模式：（1）托管式 Workflow Studio 路径，由 Trulioo 管理 UI 和流程；（2）使用嵌入式组件的低代码 Workflow Studio 集成；（3）面向需要完全控制的团队的
              API 优先路径。Document Verification SDK 门户宣称，SDK 采集路径可在“短至 15 分钟”内完成集成。开发者门户记录了多区域托管能力，webhook 则通过 Event
              Dispatcher 机制交付。
