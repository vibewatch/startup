      - number: '2.5'
        title: 矛盾、缺口与市场数据的正确读法
        blocks:
          - type: paragraph
            body: >-
              市场分析的主要风险，是过度解读自上而下 TAM。不同发布方对市场定义不同：一份报告以纯身份验证为中心，Trulioo 自己引用的 Liminal
              口径则延展到综合身份平台。两者有关联，但不是同一个市场。公开来源也没有清晰拆分个人验证、企业验证、观察名单筛查、工作流编排、欺诈评分或持续监控分别对应多少支出。这个问题重要，因为 Trulioo
              真正的价值主张来自组合。另一个未解问题是买方集中度：全球银行和支付平台里有一些最大的细分机会，但公开客户证据没有披露精确客户数、细分组合、留存或钱包份额。最后，2026 年的 AI 驱动欺诈和 KYA
              叙事在概念上扩张了品类，但这些新兴支出有多少会成为增量软件预算，又有多少只是现有合同中的功能扩展，现在判断还早。正确结论是：市场足够大且在增长，但 Trulioo 的 SAM
              边界和单客户变现斜率仍需要自下而上的尽调，不能只靠叙事外推。
