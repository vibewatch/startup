      - number: '5.5'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              Trulioo 的安全姿态由两项正式验证的认证支撑：ISO 27001 自 2015 年起持续持有，SOC 2 Type 2 于 2024 年 2 月取得。两者都在公司安全页面和 about-us
              材料中得到确认，因此是高置信、相互佐证的事实。ISO 27001 覆盖政策、流程、培训、监控、审计、事件响应和沟通。SOC 2 Type 2 验证第三方服务提供商如何按照 AICPA
              网络安全框架标准存储和处理客户数据——这对需要数据处理成熟度证据的企业买家尤其重要。

              2025 年 10 月宣布的客户门户改版，在交易复核界面加入 60+ 个欺诈识别信号，为合规团队提供审计轨迹透明度和风险评估支持。数据驻留和跨境隐私方面，Phoenix Digital Health
              案例证明加拿大数据托管是已记录的部署能力——Phoenix 明确把 PIPEDA 合规和数据留在加拿大境内列为选择 Trulioo 的原因。监管合规页面记录了对
              FinCEN、FINRA、FCA、FINTRAC、CySEC 等辖区制度的支持，让客户可以按地区配置验证工作流。公司的隐私和 cookie
              政策显示，它既作为数据处理者运行（处理客户的客户验证事件），也作为数据控制者运行（用于平台改进目的），由此形成双重隐私责任暴露，公司通过其服务隐私政策来管理。
            claimRefs:
              - CE025
              - CE032
              - CE038
              - CE041
