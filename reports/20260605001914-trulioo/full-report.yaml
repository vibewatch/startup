  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Implied valuation at alternative ARR multiples on 2024 reported ARR of USD 150.6 million, showing where the
      current $1.75B mark sits across the scenario range.
    data:
      items:
        - label: Bear 5x ARR
          value: 753
          detail: USD M — bear-case multiple floor
          tone: negative
        - label: Bear 7x ARR
          value: 1054
          detail: USD M — bear-case multiple ceiling
          tone: negative
        - label: Base 9x ARR
          value: 1355
          detail: USD M — base-case multiple floor
          tone: warning
        - label: Base 12x ARR
          value: 1807
          detail: USD M — base-case multiple ceiling / near current mark
          tone: warning
        - label: Current mark
          value: 1750
          detail: USD M — 2021 Series D post-money anchor
          tone: neutral
        - label: Bull 15x ARR
          value: 2259
          detail: USD M — bull-case multiple floor
          tone: positive
        - label: Bull 18x ARR
          value: 2711
          detail: USD M — bull-case multiple ceiling
          tone: positive
    approximationNotes: >-
      ARR of $150.6M is a third-party Latka estimate as of October 2024; not audited. Multiple scenarios are
      analyst-constructed.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV011
      - CV043
      - CV044
      - CV045
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Low, base, and high valuation envelopes for Trulioo under bear, base, and bull scenarios as of June 2026, anchored
      against the 2021 Series D mark of USD 1.75 billion.
    data:
      items:
        - label: Bear case
          low: 800
          mid: 950
          high: 1100
          displayValue: $0.8B–$1.1B
          detail: Single-digit ARR growth; multiple compression to 5–7x; headcount pressure limits recovery.
        - label: Base case
          low: 1400
          mid: 1600
          high: 1800
          displayValue: $1.4B–$1.8B
          detail: Moderate growth (12–15% CAGR); 9–12x trailing ARR; near current mark.
        - label: Bull case
          low: 2000
          mid: 2250
          high: 2500
          displayValue: $2.0B–$2.5B
          detail: Sustained 20–25% ARR growth; platform premium; strong KYB mix shift; clean exit window.
        - label: 2021 Series D mark
          low: 1750
          mid: 1750
          high: 1750
          displayValue: $1.75B
          detail: Last public valuation anchor; June 2021 post-money.
    approximationNotes: >-
      Scenario ranges are analyst-constructed from public ARR data and comparable-set multiples. Not a formal valuation
      opinion.
    claimRefs:
      - CV001
      - CV002
      - CV011
      - CV042
      - CV046
