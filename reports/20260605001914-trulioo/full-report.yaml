        title: Exhibits
        blocks:
          - type: callout
            title: Platform breadth is the company's core moat signal
            body: >-
              The most credible part of the Trulioo story is not any single product metric, but the repeated evidence
              that the company has assembled person verification, business verification, watchlist screening, document
              capture, workflow tooling, and fraud intelligence into one global platform used by large regulated
              customers.
