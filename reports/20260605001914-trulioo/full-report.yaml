  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and What Counts as the Job to Be Done
        blocks:
          - type: paragraph
            body: >-
              Trulioo's market is best defined as digital identity verification and compliance orchestration for
              onboarding and lifecycle risk decisions. That means the relevant spend is not all cybersecurity, all fraud
              software, or all IAM; it is the narrower set of products and workflows that help enterprises verify people
              and businesses, satisfy KYC/KYB/AML obligations, reduce fraud, and keep onboarding conversion acceptable.
              MarketsandMarkets describes the category through applications such as KYC, KYB, onboarding, access control
              and user monitoring, and identity fraud compliance and forensics. Trulioo's own product pages reinforce a
              similar perimeter: the company markets identity verification, business verification, watchlist screening,
              document verification, workflow tooling, and region-specific compliance support for banking, remittances,
              crypto, marketplaces, payments, and wealth management. Status-quo substitutes therefore include both
              integrated platforms and stitched stacks of point vendors, data providers, watchlist tools, and internal
              orchestration. The central job is not simply identity proofing; it is converting good users and businesses
              while meeting evolving regulatory and fraud-control requirements across many jurisdictions.
            claimRefs:
