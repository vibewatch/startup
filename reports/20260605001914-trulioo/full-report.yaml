      - number: '5.5'
        title: Trust, Security, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Trulioo's security posture is anchored by two formally verified certifications: ISO 27001, held
              continuously since 2015, and SOC 2 Type 2, obtained in February 2024. Both are confirmed in the company's
              security page and about-us materials, making them high-confidence, corroborated facts. ISO 27001 covers
              policies, procedures, training, monitoring, auditing, incident response, and communications. SOC 2 Type 2
              validates how a third-party service provider stores and processes customer data to the AICPA cybersecurity
              framework standard — particularly relevant for enterprise buyers requiring evidence of data-handling
              maturity.

              The customer portal redesign announced in October 2025 added 60+ fraud-identifying signals to the
              transaction review interface, providing audit-trail transparency and risk-assessment support for
              compliance teams. For data residency and cross-border privacy, the Phoenix Digital Health case
              demonstrates Canadian data hosting as a documented deployment capability — Phoenix specifically cited
              PIPEDA compliance and data remaining within Canada as reasons for selecting Trulioo. The regulatory
              compliance page documents support for FinCEN, FINRA, FCA, FINTRAC, CySEC, and other jurisdiction- specific
              regimes, allowing customers to configure verification workflows by region. The company's privacy and
              cookie policies indicate it operates as both a data processor (for customer-of-customer verification
              events) and a data controller (for platform improvement purposes), which creates dual privacy-liability
              exposure the company manages through its services privacy policy.
