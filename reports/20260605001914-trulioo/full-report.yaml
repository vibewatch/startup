      - number: '7.4'
        title: Partner and Data-Source Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Trulioo's identity platform is structurally dependent on a network of 450+ data sources spanning
              government registries, commercial credit agencies, mobile operators, and utility companies across 195
              countries. This breadth is the company's core competitive differentiator — but it is also its most fragile
              operational surface.

              Government and national identity registry access is the highest-criticality dependency. If a national
              government restricts or withdraws API access to its identity registries (as has occurred with India's
              Aadhaar ecosystem, South African DHA, or Argentina's RENAPER following data privacy debates), Trulioo
              loses the ability to offer authoritative verification in that jurisdiction — with no substitutable source
              of equivalent authority. Regulatory change in major markets (India, Nigeria, Brazil, Southeast Asia) can
              therefore disable coverage without any action by Trulioo. The company's services privacy policy
              acknowledges that its KYC data network includes government registries and electoral rolls, but does not
              disclose which specific registries are active or contingency plans for registry disruption.

              Machine learning model dependency creates a second layer of risk. Trulioo's platform uses AI and ML for
              document verification, liveness detection, fraud scoring, and match-rate optimization. Synthetic business
              fraud — combining real and fabricated data to create fictitious business entities — is explicitly
              identified in Trulioo's own 2026 trends report as a rapidly evolving threat requiring continuous model
              updates. Model degradation, failure to keep pace with adversarial techniques, or regulatory challenge to
              algorithmic decision-making (particularly in protected-class contexts) creates product liability exposure.
              The emerging Know Your Agent (KYA) regulatory concept identified by Trulioo's CTO Hal Lonas adds a new
              uncharted compliance surface for which no regulatory framework yet exists.

              Customer concentration is an unquantified but material risk. GetLatka attributes approximately 450
              customers to Trulioo with $150.6M in estimated 2024 ARR. If enterprise accounts such as the three of the
              five largest US banks cited in official materials represent a disproportionate share of that ARR, the loss
              of any single major customer would be materially adverse. Trulioo does not disclose customer concentration
              metrics publicly.

              The HelloFlow acquisition (February 2022) introduced workflow orchestration capabilities but also
              integration debt. As Trulioo's platform evolves, maintaining feature parity and backward compatibility
              between GlobalGateway, HelloFlow-derived workflow studio capabilities, and new product extensions creates
              ongoing engineering complexity that could slow product velocity or introduce defects at integration
              boundaries.
