      - number: '5.3'
        title: Technical Differentiation
        blocks:
          - type: paragraph
            body: >-
              Trulioo's technical differentiation rests on four pillars: data-source network breadth, in-house AI/ML
              models, the Known Faces biometric watchlist, and AI-governed UBO discovery.

              The data-source network — 450+ sources across 195 countries in 43 languages — is the foundational moat.
              Unlike point-solution competitors that license coverage from a handful of bureaus, Trulioo claims direct
              integration with hundreds of local identity authorities, utility data providers, and official business
              registries. The coverage claim is vendor-authored and has not been independently audited, but the depth of
              partner announcements (J.P. Morgan, Airwallex, Nuvei, eToro, Consensys) across diverse geographies adds
              corroborating signals that the coverage is operational, not merely listed.

              AI/ML differentiation is concentrated in Document Verification. The March 2025 release reported a 60%
              reduction in job processing times, 20% increase in verification rates, and 20% rise in auto-approval rates
              — all attributed to improvements in proprietary, in-house ML models rather than third-party AI tooling.
              The company states that models detect ID alterations, deepfakes, and digital manipulation using pattern
              recognition on security features (holograms, watermarks, microprinting), and that advanced face matching
              uses deep learning with convolutional neural networks and a similarity score. The October 2025 update
              added an autocapture mode that captures multiple high-quality images per second using ML. All performance
              figures are vendor-authored; no independent benchmark or third-party audit has been identified to
              corroborate the specific improvement percentages.

              Known Faces, launched October 2025, extends biometric verification into ongoing authentication. The
              feature performs a one-to-many comparison against the customer's image library, flagging repeat fraudsters
              or recognizing trusted users from past transactions. Early data from an unnamed financial services
              provider showed a 15% reduction in repeat fraud and a 12% decrease in manual reviews. UBO discovery
              applies an AI-governed entity resolution engine that combines and reconciles incomplete or inconsistent
              ownership data from multiple global sources. In APAC deployments, Trulioo reported 40% improvement in UBO
              coverage for a major social media platform, with specific country results reaching 98% in Vietnam, 70% in
              the Philippines, and 81% in Singapore — figures that represent meaningful operational uplift over
              traditional registry-only approaches, even accounting for vendor-originated sourcing.
