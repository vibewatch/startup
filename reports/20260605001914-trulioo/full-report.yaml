      - number: '8.2'
        title: Valuation context and multiple framework
        blocks:
          - type: paragraph
            body: >-
              The 2021 valuation anchor is the only hard public reference. On June 7, 2021, Trulioo raised $394 million
              in a Series D led by TCV, at a post-money valuation of $1.75 billion. The round sold approximately 23% of
              the company. At the time, trailing ARR was approximately $100 million, implying a 17.5x revenue multiple —
              elevated but typical for peak-cycle SaaS growth companies during the 2021 liquidity surge. That mark now
              sits against 2024 reported ARR of $150.6 million, reducing the implied trailing multiple to approximately
              11.6x without any new round.

              The multiple-compression arithmetic is important. Even if the $1.75 billion mark is taken at face value
              today, an 11.6x trailing ARR multiple is meaningfully above where comparable public companies trade.
              Large-cap public identity and fraud risk businesses command a range of multiples reflecting their mix of
              recurring software revenue, data-network effects, and regulatory moat. RELX — the parent of LexisNexis
              Risk Solutions — publishes audited annual reports and represents the ceiling for a scaled, diversified
              risk data business; Experian and TransUnion are the primary pure-play comparables. Trulioo's
              private-company status limits direct comparison, but investors should be alert to the gap between the
              peak-cycle 2021 multiple and where the market has repriced private infrastructure software since then.

              Three structural supports justify a partial premium for Trulioo against a straight ARR multiple. First,
              the revenue model is transactional (per-check pricing), meaning growth is tied to customer transaction
              volume rather than seat expansion — once embedded, a verification platform benefits from structural volume
              growth in financial services and digital commerce. Second, the KYB and UBO mix shift, which involves more
              complex orchestration, commands higher per-unit economics than basic person-verification checks. Third,
              the enterprise customer base — including J.P. Morgan Payments and Airwallex — provides volume stability
              that a mid-market-only platform would not have.

              Set against those supports, three structural risks justify a meaningful discount. Absence of audited
              financials means the $150.6 million ARR is unverifiable without private diligence. Preference overhang
              from $477 million total raised dilutes the common equity return for any secondary buyer. And the lack of
              any confirmed secondary transaction or 409A valuation since 2021 means there is no arms-length price
              reference to anchor a current bid.
