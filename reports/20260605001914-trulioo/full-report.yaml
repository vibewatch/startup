      - number: '1.3'
        title: Funding History, Capital Base, and Reported Scale
        blocks:
          - type: paragraph
            body: >-
              Trulioo's most important capital event remains the June 2021 Series D. The company's 2023 platform-launch
              release and third-party funding profiles align on a $394 million round led by TCV, with participation from
              investors including Goldman Sachs, American Express Ventures, Citi Ventures, and Blumberg Capital. Tracxn
              reports total funding of roughly $477 million across eight rounds and a $1.75 billion post-money valuation
              for the Series D, which remains the last widely cited valuation benchmark. Reported operating scale is
              stronger than the company's private disclosure profile would normally imply. GetLatka attributes annual
              recurring revenue of $108.4 million in 2022, $116.9 million in 2023, and $150.6 million in 2024, while the
              2023 official platform launch said Trulioo had nearly doubled staffing to 430 employees in less than two
              years. GetLatka later places headcount around 405 in 2024 and roughly 375 by late 2025. These numbers
              should be treated as directional rather than audited, but they support a picture of a late-stage private
              company with real revenue scale, substantial venture backing, and enough organizational depth to support a
              multi-product global compliance platform.
