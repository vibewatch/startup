      - number: '8.4'
        title: Comparable set and market positioning
        blocks:
          - type: paragraph
            body: >-
              Valuation comparables for Trulioo span three tiers: large-cap public risk-data businesses, mid-cap public
              identity and payment-verification companies, and private-round references.

              At the large-cap tier, RELX — whose LexisNexis Risk Solutions business competes directly in B2B identity
              and risk data — publishes audited annual reports and carries a market capitalization in the tens of
              billions of dollars. RELX also represents a plausible strategic acquirer: a Trulioo acquisition would add
              global coverage across 195 countries, a modern API-first platform, and KYB capability that LexisNexis Risk
              does not lead in. Experian and TransUnion are the most direct public comparables for identity verification
              but carry business-mix differences (credit data versus pure-play IDV) that limit precision.

              At the private peer tier, Socure — which reports 3,000-plus customers and penetration across 18 of the top
              20 US banks — is the most relevant US benchmark. Socure's last reported funding implies a significantly
              higher valuation than Trulioo's, driven by heavier bank penetration and a larger disclosed customer base.
              Veriff claims 3,000-plus businesses and 99.6% automated accuracy; Jumio processes 120 transactions per
              second with 300-plus patents. Persona, Alloy, and Sardine represent the emerging-tier competitors.
              Trulioo's strongest differentiation against all of these is geographic scope (195 countries versus typical
              US and EU focus) and the unified KYC-plus-KYB-plus-document-plus-orchestration platform.

              The payment-ecosystem context (Mastercard, Worldpay, Airwallex) is relevant for strategic value rather
              than revenue-multiple benchmarking. Enterprise payment platforms seek frictionless onboarding and
              compliance infrastructure; Trulioo has demonstrated strategic fit through its expanded Airwallex
              partnership and J.P. Morgan Payments selection. These relationships suggest acquisition interest is a
              realistic option even if not currently disclosed.

              Taken together, the comparable set supports a private-company premium of 20-35% above public equivalents
              for Trulioo's platform breadth and geographic moat, partially offset by the 20-25% opacity discount
              discussed above. The net result is a fair-value range that centres around the current $1.75 billion mark
              but carries a wide confidence interval in both directions.
            claimRefs:
