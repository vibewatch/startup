      - number: '2.5'
        title: Contradictions, Gaps, and the Right Way to Read the Market Data
        blocks:
          - type: paragraph
            body: >-
              The main market-analysis risk is over-reading top-down TAM. Different publishers define the market
              differently: one report centers pure identity verification, while Trulioo's own Liminal citation stretches
              toward integrated identity platforms. Those are related but not identical markets. Public sources also do
              not cleanly separate the spend attributable to person verification, business verification, watchlist
              screening, workflowing, fraud scoring, or continuous monitoring. That matters because Trulioo's real value
              proposition is the combination. Another unresolved issue is buyer concentration: some of the largest
              segment opportunities sit in global banks and payment platforms, but public customer evidence does not
              disclose exact customer counts, segment mix, retention, or wallet share. Finally, 2026's AI-driven fraud
              and KYA narratives expand the category conceptually, but it is still early to know how much of that
              emerging spend becomes incremental software budget versus feature expansion inside existing contracts. The
              right conclusion is that the market is large and growing, but the exact boundary of Trulioo's SAM and the
              slope of monetization per customer still require bottoms-up diligence rather than narrative-only
              extrapolation.
            claimRefs:
              - CM013
              - CM015
              - CM019
              - CM037
              - CM038
              - CM039
              - CM040
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is buying orchestrated outcomes, not only point verification
            body: >-
              The strongest market signal is that buyers increasingly want one workflow layer that can combine data
              checks, document checks, business verification, sanctions screening, and fraud scoring across regions and
              customer types.
            calloutType: insight
            claimRefs:
              - CM003
              - CM018
              - CM027
              - CM031
              - CM032
              - CM039
          - type: callout
            title: Top-down TAM is real, but SAM depends on implementation friction
            body: >-
              Even with strong market growth, wallet capture is constrained by integration cost, incumbent entrenchment,
              multi-vendor habits, and region-specific compliance complexity. Market growth does not guarantee platform
              standardization.
