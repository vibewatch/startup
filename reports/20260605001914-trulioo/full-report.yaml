companyProfile:
  summary: >-
    Trulioo is a Vancouver-founded private identity-verification company that has evolved from a global KYC point
    solution into a unified compliance platform spanning person verification, business verification, AML watchlist
    screening, document verification, and fraud-risk scoring. The company raised a $394 million Series D at a $1.75
    billion post-money valuation in June 2021 and reports coverage of 5 billion individuals and 700 million business
    entities across 195 countries through a single-API architecture. Third-party profiles attribute $150.6 million in
    ARR for 2024, re-accelerating 29% year-over-year from $116.9 million in 2023. In April 2025, Vicky Bindra succeeded
    Steve Munford as CEO, and a March 2026 executive-bench expansion added a new CFO, chief risk and strategy officer,
    and chief transformation officer.
