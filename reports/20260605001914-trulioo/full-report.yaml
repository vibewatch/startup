  - id: FR001
    title: Risk Heatmap — Likelihood vs. Impact
    type: matrix
    layout: wide
    summary: >-
      Severity-ranked placement of Trulioo's primary risks across a 3×3 likelihood-impact matrix. The highest-severity
      cluster (medium-to-high likelihood, high impact) includes regulatory surface expansion, data source dependency,
      and competitive commoditization.
    data:
      columns:
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: High Likelihood
          values:
            - >-
              Competitive commoditization; AMLA/AML/CFT compliance evolution; pricing pressure from G2/TrustRadius
              review signals
            - Data source registry disruption in key market; customer AML/CFT compliance workflow gaps
            - null
        - label: Medium Likelihood
          values:
            - HelloFlow integration debt; headcount decline / talent attrition; CCPA/CPRA compliance gap
            - >-
              CEO / CFO execution risk during 12-month overlap; automated decision-making regulatory challenge; ML model
              degradation / synthetic fraud bypass; cross-border data transfer mechanism challenge
            - Platform security breach; major named customer loss; government registry access revoked in G10 market
        - label: Low Likelihood
          values:
            - Biometric statute class-action (at customer level); KYA regulatory obligation without product roadmap
            - Regulatory enforcement action (DPA, FinCEN); valuation markdown / forced secondary at material discount
            - Investor recapitalization; beneficial-ownership litigation arising from governance opacity
    claimRefs:
      - CR001
      - CR017
      - CR021
      - CR022
      - CR026
      - CR028
      - CR033
      - CR037
      - CR042
  - id: FR002
    title: Risk Transmission Map — How Risks Propagate to Valuation
    type: dag
    layout: wide
    summary: >-
      Directed graph showing how Trulioo's primary risk categories flow through customer trust, platform reliability,
      revenue retention, and regulatory standing to ultimately affect financing and exit valuation.
    data:
      nodes:
        - id: r-reg
          label: Regulatory Surface Expansion
          detail: AMLA transition, FinCEN BOI, GDPR Article 22, EU AI Act — increasing compliance adaptation cost
        - id: r-privacy
          label: Data Privacy / Transfer Risk
          detail: Cross-border transfer challenge; biometric statute exposure; CCPA/CPRA enforcement
        - id: r-breach
          label: Platform Security Breach
          detail: Identity and biometric data of customers' end users; trust-and-safety core product risk
        - id: r-source
          label: Data Source Disruption
          detail: Government registry access revoked; 450+ source redundancy but jurisdiction-level coverage gaps
        - id: r-compete
          label: Competitive Displacement
          detail: Onfido/Entrust, LexisNexis, Jumio intensify; hyperscaler ID services emerging
        - id: r-exec
          label: Execution Risk
          detail: CEO/CFO/CRO all new within 12 months; headcount net decline; no succession plan public
        - id: r-govern
          label: Governance Opacity
          detail: Stale 2021 valuation; no ISC filed; no audited financials; no SLA disclosure
        - id: i-trust
          label: Customer Trust Erosion
          detail: Loss of confidence in Trulioo as compliance infrastructure; procurement freeze
        - id: i-revenue
          label: Revenue Retention Risk
          detail: Non-renewal, downsell, or competitive displacement of major enterprise accounts
        - id: i-platform
          label: Platform Reliability / Coverage
          detail: Coverage gaps or decision-quality decline; SLA breach exposure
        - id: o-financing
          label: Financing and Exit Optionality
          detail: Constrained exit range; investor return pressure from 2021 vintage; down-round risk
        - id: o-valuation
          label: Valuation Compression
          detail: Multiple compression from 2021 benchmark; no new equity signal; stale 409A
      edges:
        - from: r-reg
          to: i-trust
          label: Compliance gaps undermine platform credibility
        - from: r-privacy
          to: i-trust
          label: Enforcement or breach creates data-subject trust failure
        - from: r-breach
          to: i-trust
          label: Identity breach uniquely destroys value proposition
        - from: r-source
          to: i-platform
          label: Registry loss degrades coverage and match rates
        - from: r-compete
          to: i-revenue
          label: Competitive displacement reduces renewals and new logos
        - from: r-exec
          to: i-revenue
          label: Leadership gaps slow enterprise GTM and customer retention
        - from: i-trust
          to: i-revenue
          label: Trust erosion accelerates churn
        - from: i-platform
          to: i-revenue
          label: Coverage decline triggers customer SLA concerns
        - from: i-revenue
          to: o-financing
          label: Revenue deterioration raises capital-market concern
        - from: r-govern
          to: o-valuation
          label: Opacity prevents refreshed valuation; stale benchmark persists
        - from: o-financing
          to: o-valuation
          label: Constrained financing options compress exit multiples
    claimRefs:
      - CR001
      - CR017
      - CR028
      - CR033
      - CR037
      - CR042
      - CR043
  - id: FR003
    title: Dependency Map — Critical External Dependencies
    type: dag
    layout: wide
    summary: >-
      Directed graph of Trulioo's critical external dependencies — government data registries, enterprise customers,
      regulatory bodies, capital providers, and acquired technology — showing how each dependency connects to the core
      platform and customer delivery.
    data:
      nodes:
        - id: d-gov
          label: Gov. ID Registries (195 Countries)
          detail: >-
            National ID registries, electoral rolls, DHA (SA), Aadhaar (India), etc.; primary authoritative identity
            data
        - id: d-credit
          label: Commercial Data Providers
          detail: Consumer credit agencies, mobile operators, utility companies; secondary verification data
        - id: d-amla
          label: AMLA / EBA (EU Regulator)
          detail: Sets AML/CFT rules that Trulioo's EU-facing products must satisfy; active rulemaking as of Jan 2026
        - id: d-fincen
          label: FinCEN (US Regulator)
          detail: CDD Rule and BOI reporting requirements drive Trulioo KYB product demand
        - id: d-helloflow
          label: HelloFlow (Acquired Tech)
          detail: Workflow Studio and no-code orchestration; integrated into core platform since 2022
        - id: d-investors
          label: TCV / Institutional Investors
          detail: 2021 Series D; fund-vintage return pressure; board influence on exit timeline
        - id: d-banks
          label: Major Bank Customers
          detail: Three of five largest US banks; six of top-7 global payment processors; primary revenue concentration
        - id: d-ml
          label: ML Infrastructure / AI Provider
          detail: Undisclosed cloud or internal ML infrastructure for document verification and fraud scoring
        - id: core
          label: Trulioo Identity Platform
          detail: Core KYC/KYB/AML platform; 450+ data sources; API integration layer
        - id: cust
          label: End Customers (~450)
          detail: Banks, fintechs, payment processors, marketplaces; use Trulioo as compliance infrastructure
      edges:
        - from: d-gov
          to: core
          label: Authoritative identity data feed
        - from: d-credit
          to: core
          label: Supplemental verification data
        - from: d-helloflow
          to: core
          label: Workflow Studio and orchestration layer
        - from: d-ml
          to: core
          label: ML model inference for document and fraud verification
        - from: d-amla
          to: core
          label: Regulatory update requirements drive product adaptation
        - from: d-fincen
          to: core
          label: CDD/BOI requirements drive KYB product scope
        - from: d-investors
          to: core
          label: Capital allocation and strategic direction
        - from: core
          to: cust
          label: API-delivered identity verification and compliance services
        - from: d-banks
          to: cust
          label: Major customer revenue concentration in BFSI
    claimRefs:
      - CR028
      - CR029
      - CR032
      - CR036
      - CR038
      - CR041
