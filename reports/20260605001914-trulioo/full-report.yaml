          Evidence gaps on retention and concentration are material; public record does not support cohort or NRR
          underwriting
        blocks:
          - type: paragraph
            body: >-
              Trulioo's public record does not support a standard SaaS durability underwrite. There is no published NRR,
              GRR, churn rate, cohort retention curve, contract length, renewal rate, or top-customer revenue
              concentration. The available proxies—APAC revenue growth, transaction volume growth, KYB adoption rate,
              and multi-product expansion within anchor accounts—are useful direction indicators but do not substitute
              for the retention disclosure required to assess whether current growth is durable or whether customer
              accounts are expanding between cohort vintages.

              Total customer count is also undisclosed. The closest third-party proxy is HG Insights installation data
              on TrustRadius, which shows 81 detected Trulioo installations, but this figure almost certainly
              undercounts the actual installed base and reflects only customers with detectable public signals.
              FeaturedCustomers lists 27 reviews and 29 case studies, and Trulioo's own case study library shows 24
              published case studies, many of which involve unnamed accounts. The December 2023 growth release uses
              aggregate metrics like "three of the five largest U.S. banks" rather than a specific count, which is a
              common practice for enterprise software vendors but makes customer concentration analysis impossible.

              Revenue concentration risk cannot be assessed from public evidence. Anchor accounts like Airwallex ($100
              billion annual processing volume) and J.P. Morgan Payments ($9 trillion daily payments) are large, complex
              organizations whose identity verification needs could translate into material revenue concentration if
              Trulioo has a single contract or a limited number of renewal windows concentrated in the same period.
              There is no public evidence for or against high concentration, but the absence of disclosure in a company
              with venture-stage funding at a $1.75 billion valuation is a diligence flag, not a signal of health.

              Switching cost is real in principle—API integrations, compliance workflow configuration, and audit trail
              continuity all create friction—but the G2 evidence of high implementation cost and a two-month integration
              window also means initial switching-in friction can reverse if a competitor substantially improves match
              rates or price. Trust Payments' replacement of five vendors with Trulioo suggests Trulioo can win
              consolidation deals, but it does not directly prove Trulioo is invulnerable to being the vendor that is
              later consolidated away.
