      - number: '2.3'
        title: Buyer, User, and Budget Ownership Segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map is broad but still structurally coherent. Trulioo's public materials repeatedly target
              regulated and trust-sensitive digital businesses: banks, payment service providers, online marketplaces,
              remittance companies, crypto platforms, and wealth managers. In these organizations, the direct user is
              often an onboarding, fraud, compliance, or operations team; the economic buyer is usually a compliance,
              risk, fraud, or product executive; and the technical implementer is an engineering or platform team
              integrating APIs, hosted flows, or workflow tooling. The customer proofs reinforce this segmentation. J.P.
              Morgan Payments highlights trust and safety at payments scale, Airwallex shows the cross-border fintech
              segment, Trust Payments represents European payments modernization, and Public maps to investment-platform
              onboarding. Product pages and review platforms also suggest that the market increasingly values
              orchestration and configurable workflows, not just raw document or data matching. That dynamic creates
              budget overlap across compliance, fraud, digital onboarding, and platform engineering teams, which makes
              workflow flexibility and broad data coverage especially relevant buying criteria.
