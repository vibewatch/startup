chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Scope, and Core Offering
        blocks:
          - type: paragraph
            body: >-
              Trulioo presents itself as an identity platform rather than a point-solution vendor. Its official company
              and homepage materials position the business around global onboarding, compliance, and fraud prevention
              for regulated digital businesses, with a product set spanning person verification, business verification,
              watchlist screening, document verification, and risk scoring. The company says the platform helps
              enterprises verify more than 5 billion people and 700 million business entities across 195 countries,
              while its homepage adds one-platform and one-API messaging around 450 data sources and 43 languages. That
              breadth matters because Trulioo is selling operational simplification as much as raw verification
              coverage: customers can route KYC, KYB, AML, and fraud workflows through one integration rather than
              stitching together local vendors. The services privacy policy reinforces that Trulioo typically operates
              as a processor for customers such as banks, marketplaces, and payment providers, while also using data as
              a controller for product improvement and platform operations. In short, the company's identity is best
              understood as global compliance infrastructure sold through software and transaction-based verification
              workflows.
