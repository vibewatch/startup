      - number: '3.4'
        title: Switching cost, lock-in, multi-homing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Switching costs in identity verification are moderate rather than high. The API-first integration model
              common to Trulioo, Jumio, Veriff, Persona, and Alloy means that technically capable teams can evaluate and
              replace a primary IDV vendor within a quarter when pricing, compliance posture, or data quality shifts.
              Deeper lock-in comes from workflow customization, compliance documentation anchored to a specific vendor's
              output format, and the re-validation burden of switching document models in regulated environments.
              Trulioo's ISO 27001 (since 2015) and SOC 2 Type 2 (February 2024) certifications are necessary for
              enterprise procurement but not sufficient as a moat: Jumio, Veriff, Socure, and Alloy hold comparable
              compliance stacks.


              Multi-homing is common. Large global enterprises often run Trulioo for cross-border markets alongside a
              US-focused provider such as Socure for domestic depth, or use Alloy as an orchestration layer to route
              verification calls across multiple vendors. Alloy's 270+ partner integrations and vendor-neutral model
              deliberately enable multi-homing, compressing any single vendor's ability to command premium pricing
              through lock-in alone.


              Distribution power favors incumbents and platform vendors with existing enterprise relationships.
              LexisNexis Risk's parent RELX reported £9.2 billion in full-year 2025 revenue, indicating a customer
              footprint and balance sheet that dwarfs Trulioo's. TransUnion's credit bureau relationships provide a
              ready distribution channel into consumer finance, though less relevant for KYB, cross-border onboarding,
              and digital marketplace segments where Trulioo is strongest. Trulioo's $394M Series D (led by TCV, June
              2021) positioned it as one of the most heavily capitalized pure-play global IDV platforms, but it remains
              smaller than public-company incumbents by balance sheet and established relationship depth. GetLatka
              estimates Trulioo's revenue at $150.6M in 2024 (up from $116.9M in 2023), demonstrating consistent growth,
              but the absence of a disclosed customer count—unlike Socure (3,000+) and Veriff (3,000+)—limits
              independent assessment of retention and segment penetration.
