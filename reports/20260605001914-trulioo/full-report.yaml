        - id: evaluation
          label: RFP and evaluation
          detail: >-
            Enterprise buyers evaluate match rate, coverage (195 countries, 14,000+ documents, 700M business entities),
            pricing, and integration complexity. G2 implementation cost rated $$$$$.
          tone: neutral
        - id: land
          label: Single-product go-live
          detail: >-
            Account goes live on KYC Person Match, IDV, or KYB; 65% choose Workflow Studio at landing; 40% launch with
            KYB capability.
          tone: positive
        - id: expand
          label: Multi-product and geographic expansion
          detail: >-
            Anchor accounts add KYB, Watchlist Screening, Fraud Intelligence; APAC transactions +55% fintech, +37%
            marketplace YoY.
          tone: positive
        - id: renewal
          label: Renewal and concentration risk
          detail: >-
            No NRR or GRR disclosed; anchor accounts like Airwallex (7+ years) and JPM Payments signal durability but
            concentration risk exists without top-account revenue disclosure.
          tone: warning
      edges:
        - from: awareness
          to: evaluation
        - from: evaluation
          to: land
        - from: land
          to: expand
        - from: expand
          to: renewal
    approximationNotes: null
    claimRefs:
      - CU001
      - CU007
      - CU036
      - CU040
      - CU044
      - CU045
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Trulioo's strongest public proofs score high on deployment maturity and outcome specificity but uniformly weak on
      retention and concentration visibility, which is the primary underwriting gap.
    data:
      columns:
        - Deployment maturity
        - Outcome specificity
        - Retention visibility
        - Concentration risk flagged
      rows:
        - label: Airwallex
          values:
            - label: high
              tone: positive
              detail: 7-year relationship; 3 products; 181 countries; 100,000+ businesses secured.
            - label: high
              tone: positive
              detail: Passports from 162 countries; ID cards from 119; 104 driver's license types; processing time reduced.
            - label: low
              tone: warning
              detail: No NRR, GRR, renewal schedule, or contract term disclosed for this account.
            - label: high
              tone: warning
              detail: Largest and longest-running account; could represent significant APAC and global revenue share.
        - label: J.P. Morgan Payments
          values:
            - label: medium
              tone: positive
              detail: Announced Oct 2023; no disconfirming signal by June 2026.
            - label: medium
              tone: neutral
              detail: Selection criteria cited (breadth, match rates, global footprint) but no operational outcome metrics.
            - label: low
              tone: warning
              detail: No renewal data; JPM publishes no details on verification vendor contracts.
            - label: high
              tone: warning
              detail: JPM Payments is one of the world's largest payment processors; could be a top-3 revenue account.
        - label: Trust Payments
          values:
            - label: medium
              tone: positive
              detail: Went live June 2025; deployed across KYB, KYC, Watchlist, Workflow Studio.
            - label: high
              tone: positive
              detail: 85% verification success rate; 5-vendor consolidation into single platform.
            - label: low
              tone: warning
              detail: Partnership is less than one year old; no renewal evidence yet.
            - label: low
              tone: positive
              detail: Company serves 20,000 businesses; likely a mid-tier rather than anchor account.
        - label: Public (investing)
          values:
            - label: high
              tone: positive
              detail: UK launch July 2023; Trulioo Person Match in production for AML/KYC compliance.
            - label: medium
              tone: neutral
              detail: Match rate described as industry-leading; no specific improvement numbers published.
            - label: low
              tone: warning
              detail: KYC-only deployment; no evidence of expansion since UK launch.
            - label: low
              tone: positive
              detail: Public is a mid-tier investment platform; limited concentration risk.
        - label: Phoenix Digital Health
          values:
            - label: medium
              tone: positive
              detail: Announced April 2026; KYC Documents deployed for patient verification.
            - label: low
              tone: neutral
              detail: Outcome described qualitatively; no quantified metrics from press release.
            - label: low
              tone: warning
              detail: Newest account; no retention or expansion data possible.
            - label: low
              tone: positive
              detail: Canadian telehealth; likely smallest revenue account in the named set.
    approximationNotes: null
