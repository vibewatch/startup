      - number: '3.3'
        title: Capability, pricing, and GTM comparison
        blocks:
          - type: paragraph
            body: >-
              No major competitor in this category publishes a full rate card publicly. Pricing across Trulioo, Jumio,
              Veriff, Socure, Persona, and Alloy is uniformly contact-sales or volume-negotiated. Available signals
              indicate transaction-volume-based or API-call-based models are standard, with enterprise contracts
              negotiated annually. G2 reviewer data shows Jumio is rated more expensive than Trulioo and Onfido is rated
              slower to ROI, suggesting Trulioo sits at a mid-tier price/performance position. SoftwareAdvice confirms
              that Trulioo pricing is not publicly listed, consistent with the enterprise-contract norm across the
              category.


              On capability scope, Trulioo's March 2025 AML/AI model update achieved up to 60% reduction in
              job-processing time, a 20% increase in verification rates, and up to 20% rise in auto-approval
              rates—improvements that narrow the performance gap with Jumio's scale advantage. Trulioo's October 2024
              launch of Fraud Intelligence added consortium risk indicators, velocity monitoring, and real-time signals
              across 195+ countries via a single API, creating a differentiation layer relative to competitors that
              provide fraud signals only for domestic markets. Trulioo's KYB adoption grew 586% in the United States
              from 2020 to 2023, capturing a high-growth vertical where Socure has only recently begun expanding.


              On GTM and distribution, Socure's penetration of 18 of 20 top US banks gives it a reference barrier and
              data-network advantage in domestic financial services deals that Trulioo has not yet publicly matched.
              Jumio and Veriff each have global brand recognition from billions of processed transactions. Trulioo's GTM
              is differentiated by its single-API, single-contract global reach across 195 countries and modular
              architecture that activates only required services—appealing to global fintechs, cross-border payment
              companies, and regulated marketplaces such as Nium and EQ Bank that need multi-jurisdictional coverage
              without stitching together multiple vendor stacks.
