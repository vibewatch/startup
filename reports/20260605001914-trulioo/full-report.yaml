      - number: '8.3'
        title: Scenario analysis and probability-weighted range
        blocks:
          - type: paragraph
            body: >-
              Scenario construction for Trulioo must work around a narrow public evidence base. Revenue estimates are
              third-party (Latka), not audited. Growth rates come from geographic and product-mix press releases rather
              than income statements. The scenarios below are constructed from public indicators and informed
              assumptions; they are committee-discussion tools, not fair-value opinions.

              The bull case assumes Trulioo sustains 20-25% ARR growth through 2026 — plausible given the 29%
              re-acceleration in 2024, APAC expansion, and KYB mix shift. At 14-18x trailing ARR on a 2026 estimate of
              roughly USD 190-200 million, a bull-case valuation of USD 2.0-2.5 billion is defensible. This scenario
              requires: the CEO transition to execute without meaningful churn; KYB and UBO workflows maintaining their
              premium pricing; gross margins holding or expanding; and the platform narrative attracting a
              premium-multiple strategic exit or IPO.

              The base case assumes growth moderates to 12-15% ARR compounding after the 2024 re-acceleration,
              consistent with the underlying market CAGR of 16.9% as peer competition intensifies. At 9-12x trailing ARR
              on a 2026 estimate of roughly USD 170-180 million, a base-case range of USD 1.4-1.8 billion keeps the
              company near its 2021 mark, reflecting neither meaningful appreciation nor a down round.

              The bear case assumes growth slows to single digits — possible if Socure's bank-concentration strategy,
              Jumio's patent portfolio, or a well-resourced new entrant takes enterprise share. At 5-7x ARR on a 2026
              estimate near USD 155-165 million (extrapolating 2024 growth conservatively), a bear-case range of USD
              0.8-1.1 billion implies a material write-down from the 2021 mark. The bear case is most plausible if
              headcount compression reflects a growth-ceiling response, not just efficiency, and if the leadership
              transition disrupts key account relationships.

              Probability weighting on available public evidence assigns roughly 20-25% to the bull case, 55-60% to the
              base case, and 20-25% to the bear case. The resulting probability-weighted range is approximately USD
              1.3-1.8 billion.
