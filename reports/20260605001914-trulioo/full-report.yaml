      - number: '7.6'
        title: Financial, Valuation, and Governance Risk
        blocks:
          - type: paragraph
            body: >-
              Trulioo's financial risk profile is dominated by a single structural problem: the last publicly disclosed
              valuation ($1.75 billion at the June 2021 Series D) is now over four years old and was set at the peak of
              2021 private-market multiples. Since then, SaaS and identity-technology comparables have experienced
              significant multiple compression in public markets. Trulioo's closest public comparable proxies — identity
              verification and KYC compliance platforms — have seen valuations reset materially. Without a new equity
              round, secondary transaction, or audited financial disclosure, it is impossible to determine whether
              Trulioo's current intrinsic value remains above, at, or below the 2021 benchmark.

              Revenue data from GetLatka attributes $150.6M ARR in 2024 and $477M in total lifetime funding, with the
              2021 Series D comprising $394M — over 80% of total historical capital. The absence of any new equity raise
              since 2021 is consistent with either strong cash generation (which would be positive) or capital market
              conditions unfavorable to a fundraise (which would be concerning). Without audited financials, gross
              margin, operating profit, burn rate, and cash balance cannot be assessed. Trulioo is incorporated as a
              private non-distributing Canadian corporation with no mandatory financial disclosure obligation, so this
              opacity is expected but material for investment diligence.

              The 2021 investor syndicate — TCV, Goldman Sachs, American Express Ventures, Citi Ventures, Blumberg
              Capital — includes participants with specific fund-vintage return expectations. A 2021 vintage at $1.75B
              creates pressure for an exit or secondary at a price that delivers acceptable returns; the longer the
              hold, the greater the implicit preferred-share liquidation preference accrual and the smaller the range of
              exit outcomes that serve all stakeholders. This investor dynamic may constrain commercial flexibility or
              create misalignment between early investors and management on optimal exit timing.

              The corporate governance record shows limited transparency. Corporations Canada lists seven directors but
              records no individuals with significant control, no annual meeting date, and a last confirmed filing
              period through 2020. The 2026 appointment of Uri Zelmanovich as CFO suggests the company is preparing for
              more structured financial reporting and governance — consistent with a possible M&A or public market path
              — but no transaction has been publicly signalled. Valuation, cap-table detail, and investor rights
              documentation remain entirely outside public disclosure.
