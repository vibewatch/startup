      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Track with structured diligence agenda
            body: >-
              Trulioo is fundamentally attractive — strong market, defensible platform, re-accelerating growth, new
              executive team with relevant fintech depth. But the 2021 price requires private diligence that public
              evidence cannot substitute for: audited financials, 409A, NRR, and cap-table waterfall are all missing. Do
              not commit capital on public evidence alone. Build the diligence agenda now.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV011
              - CV039
              - CV041
          - type: callout
            title: Preference overhang and governance opacity are structural constraints
            body: >-
              With $477M raised and no ISC filed in Canada, any secondary buyer faces two structural unknowns: how much
              of the exit proceeds are absorbed by preference, and who actually controls the company. These are not
              minor caveats — they could make the arithmetic negative even at a flat-to-2021-mark entry price if the
              waterfall is front-loaded.
            calloutType: risk
            claimRefs:
