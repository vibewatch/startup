      - number: '1.5'
        title: Strengths, Public-Market Readiness Signals, and Open Questions
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a credible strengths case: large geographic coverage, a unified onboarding
              stack, visible enterprise customer logos, and an increasingly broad product portfolio that now stretches
              from identity verification into fraud intelligence, business verification, and credit decisioning.
              Security and privacy posture are also well marketed, with ISO 27001 since 2015, SOC 2 Type 2 since
              February 2024, and multiple updated privacy policies in 2025 and 2026. That said, disclosure quality still
              lags what an investor would want for a fully underwritten growth-stage opportunity. Public records do not
              establish an up-to-date ownership structure, the latest valuation still traces back to 2021, and current
              customer count, profitability, and burn are not disclosed in official filings. Review sites are generally
              favorable, but G2 still notes pricing sensitivity relative to alternatives, a reminder that platform
              breadth does not eliminate commercial pressure in a crowded IDV market. The company therefore looks
              operationally mature but still financially opaque, which is acceptable for a private business yet leaves
              meaningful diligence work outstanding before any refreshed valuation call.
            claimRefs:
              - CO006
              - CO007
              - CO015
              - CO021
              - CO025
              - CO037
              - CO040
              - CO041
              - CO042
