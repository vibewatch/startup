  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite and Identity Module Map
        blocks:
          - type: paragraph
            body: >-
              Trulioo organizes its platform as a unified identity stack operating under the GlobalGateway brand, with a
              single API, single contract, and single endpoint spanning six primary product modules: Person Verification
              (KYC Data), Identity Document Verification (DocV), Business Verification (KYB), Watchlist and AML
              Screening, Fraud Intelligence, and the Workflow Studio orchestration layer. The company's homepage and
              solution pages present this as "one platform, one API, and one integration" unlocking 450+ data sources in
              43 languages across 195 countries — claims consistently repeated across product pages, platform launch
              communications, and developer documentation.

              Person Verification draws on 500+ PII data sources and returns a match/no-match result with sub-second
              latency per the KYC data page. Identity Document Verification supports 12,000+ document types per the June
              2023 capability announcement (updated to 14,000+ per the March 2025 AI/ML release), paired with biometric
              liveness capture via Web, Android, iOS, and React Native SDKs. Business Verification enables verification
              of 700 million business entities through official registries, with UBO discovery layered on top through
              the platform's AI-governed entity resolution engine. Watchlist Screening checks against 6,000+ watchlists
              and 20,000+ adverse media sources. Fraud Intelligence — launched October 2024 — adds predictive risk
              scoring through consortium data, velocity monitoring, and hundreds of fraud signals all delivered via the
              same API token. A credit decisioning capability is mentioned in recent press positioning but is not yet
              documented as a named module.

              The Workflow Studio, born from the February 2022 HelloFlow acquisition, provides a no-code, drag-and-drop
              onboarding workflow builder. It enables organizations to combine KYC, KYB, AML, and DocV checks into
              configurable, hosted verification journeys without custom development. Trust Payments, a case study
              partner, replaced five fragmented verification vendors with a single Trulioo integration — a concrete
              deployment proof of the platform consolidation thesis.
