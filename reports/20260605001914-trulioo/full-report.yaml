      - number: '7.5'
        title: People and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Trulioo's leadership has undergone its most significant reconstruction since the 2021 Series D. Within a
              twelve-month window (April 2025 to March 2026), four new C-suite members joined: CEO Vicky Bindra (April
              2025), CFO Uri Zelmanovich (March 2026), Chief Risk and Strategy Officer Chad Gerhardstein (March 2026),
              and Chief Transformation Officer Danielle Holbrook Dunn (March 2026). The scale of this leadership renewal
              introduces execution risk across the four critical functions those roles govern — commercial strategy,
              financial management, risk oversight, and organizational transformation.

              The CEO transition is the most significant individual risk. Bindra replaced the retiring Steve Munford,
              who led Trulioo through the period of greatest growth and the 2021 unicorn milestone. Bindra brings strong
              fintech credentials (Nuvei, FIS, Visa, Mastercard) and a payments-operator profile — appropriate for
              Trulioo's enterprise market — but has no prior CEO track record in an identity-verification company. The
              transition period is high-stakes: the company must simultaneously execute on platform expansion,
              geographic growth, and the new CFO's financial discipline mandate while sustaining enterprise customer
              relationships. No public succession planning document or interim operational continuity plan was found.

              Headcount dynamics suggest workforce pressure. GetLatka data shows Trulioo headcount declined from
              approximately 430 in early 2023 to approximately 375 by late 2025, a net reduction of roughly 13%. This
              may reflect deliberate efficiency optimization — consistent with the CFO and CRO appointments signalling a
              more disciplined operating posture — or it may reflect voluntary attrition in a competitive talent market,
              particularly in engineering and compliance roles. The March 2026 executive appointments press release
              emphasizes "accelerating demand" and "next phase of platform momentum," which is consistent with a
              growth-investment posture, but the net headcount decline contradicts a headcount-growth narrative.

              Key-person risk extends beyond the CEO. The company's data science, verification model, and global data
              partnership functions are not publicly documented at an individual level. Loss of key engineers or data
              partnership managers in specific jurisdictions could impair coverage quality or model accuracy without
              external visibility. There is no public documentation of retention programs, equity vesting structures, or
              competitive compensation benchmarks.
