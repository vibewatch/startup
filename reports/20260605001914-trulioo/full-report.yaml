      - number: '3.5'
        title: Moat durability, commoditization risk, and adverse competitive evidence
        blocks:
          - type: paragraph
            body: >-
              Trulioo's durable advantages cluster around three pillars. First, global data partnerships: person and
              business verification data from 400+ providers across 195 countries requires years of regulatory and
              integration work per jurisdiction—a supply-access moat that domestic-first competitors cannot replicate
              through product roadmap alone. Second, platform breadth: combining KYC, KYB, AML screening, document
              verification, fraud intelligence, and workflow orchestration under a single API reduces integration burden
              for multi-product buyers in ways that point-solution competitors cannot match without acquisitions. Third,
              AI and model investment: Trulioo's March 2025 data showing deepfakes and ID alterations account for 16% of
              all attacks—and its models cutting processing time by up to 60% and raising auto-approvals by up to
              20%—signals an ongoing model-improvement cycle that raises the quality floor for competitors.


              The most material adverse evidence concerns North American distribution. Socure's 18-of-20-top-US-bank
              penetration creates a reference barrier in domestic US financial services enterprise deals that Trulioo
              has not publicly matched. G2 reviewer data shows Onfido is rated easier to administer and better at
              meeting requirements in some reviewer segments, indicating a usability gap that matters for product teams
              with limited integration resources. The commoditization risk is real: open-ecosystem orchestrators like
              Alloy turn primary verification vendors into interchangeable data sources, compressing pricing power over
              time. Synthetic identity fraud and deepfake proliferation benefit vendors with continuous model retraining
              but also mean the technical bar is rising for all competitors, limiting the durability of any single-round
              innovation lead.


              Global fintech and cross-border payment customers such as Nium ($60B+ in payments processed annually in
              190+ payout markets) and EQ Bank illustrate the segment where Trulioo's global person-and-
              business-verification coverage is hardest to substitute. This segment—where no domestic provider covers
              the breadth required without multi-vendor stitching—represents Trulioo's most defensible competitive
              position and the revenue mix most resilient to Socure or LexisNexis displacement.
