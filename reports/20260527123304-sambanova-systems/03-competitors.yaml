  - id: incumbent-gpu-platforms
    title: Incumbent GPU Platforms — NVIDIA, AMD, and Intel Gaudi
    body: >-
      NVIDIA retains the dominant position in AI infrastructure: CUDA's developer ecosystem
      (millions of libraries, tools, and pre-trained integrations) remains the highest switching
      cost in the market. The DGX platform, featuring Blackwell B200 GPUs, delivers up to 4x
      higher inference throughput than H100 on FP4 workloads, with 192 GB HBM3e per GPU and
      approximately 3.35 TB/s bandwidth. NVIDIA serves 8 of the top 10 global telcos, 7 global
      pharma companies, 10 global car manufacturers, and 9 U.S. government institutions through
      its DGX platform, creating deep distribution entrenchment. The B200 has eliminated the
      performance premium that pure-play inference silicon once held on many mainstream LLM
      workloads, and the Rubin architecture (incorporating LPU elements from Groq) is projected
      to further close the gap in 2026-2027. AMD Instinct MI300X is the strongest GPU alternative:
      192 GB HBM3 memory (5.3 TB/s bandwidth) allows running 70B+ parameter models without
      sharding, achieving high throughput with a lower memory-bottleneck than H100. AMD's
      MI350 series (CDNA 4 architecture) extends this lead in 2026. ROCm software compatibility
      continues to improve but still lags CUDA's third-party library coverage. Intel Gaudi 3
      is the lowest-cost at-scale option: an 8-chip system is priced at approximately $125K
      including Ethernet networking, compared to $350K+ for an equivalent DGX H100 node. Gaudi 3
      uses native Ethernet interconnects (Ethernet-first, not InfiniBand), making it easier to
      integrate into standard data center fabrics—a property shared with SambaNova's on-prem
      deployment model. However, Intel's data center group is under restructuring pressure and
      Gaudi's commercial momentum remains uncertain relative to the GPU incumbents. For
      enterprise buyers comparing SambaNova to GPU platforms, the key tradeoffs are: NVIDIA
      offers unmatched software ecosystem and training flexibility but higher TCO for pure
      inference; AMD offers large memory pools at competitive pricing; Intel Gaudi offers lowest
      upfront cost but smallest ecosystem.
    claimRefs:
      - CP013
      - CP014
      - CP015
      - CP016
      - CP017
      - CP018
      - CP019
