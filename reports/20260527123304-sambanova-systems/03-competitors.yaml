company:
  name: SambaNova Systems

chapter:
  number: 3
  title: Competitors
  summary: >-
    SambaNova competes across three distinct layers: purpose-built inference silicon (Cerebras,
    Groq/NVIDIA), incumbent GPU platforms (NVIDIA, AMD, Intel Gaudi), and cloud-native inference
    providers (AWS Trainium, Google TPU, Together AI). Its differentiated full-stack RDU
    architecture, on-premise air-cooled deployment capability, and sovereign-AI partnerships
    give it a defensible niche against both hyperscaler lock-in and GPU commodity pressure,
    but the October 2025 reports of an exploratory sale, a thin CUDA-comparable software
    ecosystem, and accelerating GPU performance from NVIDIA Blackwell represent material risks
    to its long-term competitive durability.

sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >-
      SambaNova operates in a rapidly evolving AI infrastructure market where the dominant
      training-era framing—NVIDIA GPUs as the universal platform—is giving way to a more
      fragmented inference-era landscape. In 2026, at least three architectural bets compete
      for the inference workload: wafer-scale monolithic chips (Cerebras WSE-3), streaming
      language processing units (Groq LPU, now under NVIDIA), and reconfigurable dataflow
      units with tiered memory (SambaNova RDU). Simultaneously, incumbent GPU platforms led
      by NVIDIA Blackwell (B200) and AMD MI300X have closed the performance gap for many
      production inference workloads. Cloud hyperscalers—AWS Trainium3 and Google Cloud
      TPU Ironwood—offer captive inference infrastructure that is substantially cheaper per
      token but requires deep cloud commitment. A fourth layer of inference-as-a-service
      platforms (Together AI, Lambda Labs, Anyscale) runs on GPU clusters and competes at
      the API level with SambaCloud. The buyer's primary decision criteria in 2026 are
      inference throughput per user, time-to-first-token for agentic workloads, total cost
      of ownership, deployment model (cloud vs. on-premise), data-sovereignty requirements,
      and software ecosystem breadth. SambaNova is well-positioned on the deployment-model
      and sovereignty axes but faces acute pressure on ecosystem breadth and brand awareness
      relative to both NVIDIA and the two recently better-capitalized pure-play rivals.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
    tableRefs:
      - TP001
    figureRefs:
      - FP001

  - id: direct-inference-hardware-challengers
    title: Direct Inference Hardware Challengers — Cerebras and Groq
    body: >-
      Cerebras Systems (Menlo Park, CA; founded 2016) and Groq represent SambaNova's closest
      architectural peers: all three built custom silicon expressly for inference rather than
      training. Cerebras' Wafer-Scale Engine 3 (WSE-3) is the most extreme bet—a 46,225 mm²
      die with 4 trillion transistors, 900,000 AI cores, and 44 GB of on-chip SRAM, enabling
      1,000+ tokens per second on Llama 3.1 405B with sub-100 ms time-to-first-token. Cerebras
      completed its IPO on Nasdaq (ticker: CBRS) in mid-May 2026 at an initial valuation of
      approximately $26–27 billion on the back of $510 million in 2025 revenue (76% YoY growth)
      and a $20 billion compute deal with OpenAI. Its CS-3 on-premises system deploys in 16 RU
      and competes directly with SambaNova DataScale for sovereign and enterprise on-prem buyers.
      Customer concentration is a material risk: G42 and OpenAI together represent the majority
      of projected revenue through 2028. Groq's Language Processing Unit (LPU) architecture
      interleaves streaming compute and SRAM for industry-leading deterministic latency, achieving
      840 tokens per second on Llama 3.1 8B and 394 tokens per second on Llama 3.3 70B with
      the lowest time-to-first-token in the segment. NVIDIA reported a $20 billion IP licensing
      deal with Groq in late 2025, incorporating LPU technology into its Rubin GPU series, which
      simultaneously validates the architectural thesis and removes Groq as a fully independent
      competitive threat. Both Cerebras and Groq target the same enterprise and research-lab
      buyers as SambaNova. Cerebras' wafer-scale approach is harder to replicate at commodity
      scale while Groq's IP absorption by NVIDIA partially reduces its differentiation as a
      standalone vendor. SambaNova's differentiated response is the heterogeneous SN50 + Intel
      Xeon 6 blueprint for agentic AI decode, a workload pattern Cerebras (focused on large-batch
      throughput) is less optimized for.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
