callouts:
  - calloutType: strength
    title: Sovereign and Air-Cooled On-Prem Deployment — Defensible Niche
    body: >-
      SambaNova's ability to deploy in standard air-cooled data centers without the liquid-cooling
      infrastructure required by NVIDIA Blackwell clusters is a durable differentiator for
      government agencies, classified environments, and sovereign AI programs that cannot
      rebuild their facilities to accommodate next-generation GPU racks. The April 2026 Intel
      partnership extends this advantage to agentic AI decode workloads while preserving
      existing x86 ecosystem compatibility. Argonne DOE and four sovereign cloud programs
      represent validated institutional customers with long procurement cycles.
    claimRefs:
      - CP024
      - CP025
      - CP027
      - CP028

  - calloutType: risk
    title: Capital Constraint and Sale Exploration — Existential Risk Signal
    body: >-
      The October 2025 report that SambaNova explored a sale after failing to close a new
      funding round is the most material adverse signal in the competitive analysis. A company
      unable to raise capital on acceptable terms may be forced into a distressed sale,
      strategic pivot, or resource contraction that would compromise the long-term hardware
      roadmap and sovereign customer commitments. Investors evaluating SambaNova should treat
      the capital status as a blocking diligence item until a confirmed funding outcome or
      M&A resolution is public.
    claimRefs:
      - CP031
      - CP032

  - calloutType: risk
    title: NVIDIA Ecosystem Entrenchment — Structural Switching-Cost Barrier
    body: >-
      NVIDIA's CUDA developer ecosystem represents the deepest structural switching cost in AI
      infrastructure. SambaNova's SambaNova Suite and SambaStudio provide compiler and runtime
      abstractions, but the gap in third-party library coverage, pre-trained model integration,
      and developer familiarity versus the CUDA stack creates a persistent friction barrier for
      enterprise buyers evaluating RDU hardware. NVIDIA's Blackwell performance improvements
      and Rubin roadmap (incorporating Groq LPU elements) further reduce the throughput delta
      that once justified RDU adoption for cost-sensitive buyers.
    claimRefs:
      - CP013
      - CP014
      - CP030
      - CP036

