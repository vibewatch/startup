      - number: '7.2'
        title: Operational, Supply Chain & Technical Risk
        blocks:
          - type: paragraph
            body: >
              SambaNova's hardware roadmap depends entirely on TSMC for silicon manufacturing. TSMC's dominant market
              position means that any geopolitical disruption—most critically a Taiwan Strait conflict or a U.S.-China
              escalation affecting TSMC's access to ASML EUV equipment—could halt SambaNova's chip supply with no
              qualified fallback. SambaNova packages its RDU chips using HBM2E, sourcing from a concentrated set of DRAM
              suppliers. The company's stated mitigation is to evaluate Intel's foundry ecosystem as a secondary fab,
              but Intel Foundry Services has not demonstrated volume production of AI chip designs at competitive yields
              for any external customer. SN50 chip tape-out and volume ramp timelines have not been publicly disclosed;
              given typical TSMC advanced-node tape-out-to-volume schedules of 12–18 months, any delay would compress
              the competitive window against Nvidia's B200 and B300 successor roadmap. SambaFlow software stack
              reliability and AI-specific security certification also remain unverified by independent third parties.
            claimRefs: []
          - type: table
            tableRef: TR002
