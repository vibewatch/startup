  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >
              The AI chip and accelerator market encompasses specialized semiconductors designed for machine learning
              training and inference workloads across data centers, cloud platforms, and increasingly edge deployments.
              The market is not monolithic: definitional boundaries vary significantly across analysts, producing
              non-comparable estimates that must be interpreted with their scope stated explicitly.

              The largest definitional lens—adopted by Deloitte and WSTS—captures all AI-optimized semiconductors
              including logic processors, high-bandwidth memory (HBM), and networking silicon, yielding a 2026 estimate
              near $500B. A narrower lens, used by IDC for its "intelligent datacenter" segment (CPUs, AI accelerators,
              GPUs, custom ASICs, and networking silicon), arrives at $281B for that specific category within a total
              data center semiconductor revenue of $477B. The narrowest lens—merchant AI accelerator chips only (GPUs
              and alternatives sold externally)—is used by SiliconAnalysts and produces a $200B+ figure. The $118B
              figure cited by AllAboutAI for 2024 reflects the narrowest merchant-only GPU and AI chip category and does
              not include memory or networking.

              AI training workloads involve periodic, compute-intensive model development cycles; AI inference involves
              continuous, production-scale serving of model outputs to end users. By 2026, inference workloads account
              for approximately two-thirds of all AI compute cycles globally—up from one-third in 2023—making inference
              the dominant operational sub-segment by volume. Training still commands high per-accelerator spend
              (Nvidia's H100 and B200 lead for training) but represents a less frequent purchase event.

              Adjacent and included spend categories relevant to SambaNova's market context include: AI cloud inference
              services (SaaS layer), AI infrastructure systems and racks, enterprise on-premises AI deployments, and
              sovereign/government AI compute programs. Status-quo substitutes for enterprise AI inference include
              CPU-only inference, public cloud GPU services (AWS, Azure, GCP), and existing on-premises GPU clusters.
            claimRefs:
