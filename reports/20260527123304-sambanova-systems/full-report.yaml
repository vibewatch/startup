      - number: '3.2'
        title: Direct Inference Hardware Challengers — Cerebras and Groq
        blocks:
          - type: paragraph
            body: >-
              Cerebras Systems (Menlo Park, CA; founded 2016) and Groq represent SambaNova's closest architectural
              peers: all three built custom silicon expressly for inference rather than training. Cerebras' Wafer-Scale
              Engine 3 (WSE-3) is the most extreme bet—a 46,225 mm² die with 4 trillion transistors, 900,000 AI cores,
              and 44 GB of on-chip SRAM, enabling 1,000+ tokens per second on Llama 3.1 405B with sub-100 ms
              time-to-first-token. Cerebras completed its IPO on Nasdaq (ticker: CBRS) in mid-May 2026 at an initial
              valuation of approximately $26–27 billion on the back of $510 million in 2025 revenue (76% YoY growth) and
              a $20 billion compute deal with OpenAI. Its CS-3 on-premises system deploys in 16 RU and competes directly
              with SambaNova DataScale for sovereign and enterprise on-prem buyers. Customer concentration is a material
              risk: G42 and OpenAI together represent the majority of projected revenue through 2028. Groq's Language
              Processing Unit (LPU) architecture interleaves streaming compute and SRAM for industry-leading
              deterministic latency, achieving 840 tokens per second on Llama 3.1 8B and 394 tokens per second on Llama
              3.3 70B with the lowest time-to-first-token in the segment. NVIDIA reported a $20 billion IP licensing
              deal with Groq in late 2025, incorporating LPU technology into its Rubin GPU series, which simultaneously
              validates the architectural thesis and removes Groq as a fully independent competitive threat. Both
              Cerebras and Groq target the same enterprise and research-lab buyers as SambaNova. Cerebras' wafer-scale
              approach is harder to replicate at commodity scale while Groq's IP absorption by NVIDIA partially reduces
              its differentiation as a standalone vendor. SambaNova's differentiated response is the heterogeneous SN50
              + Intel Xeon 6 blueprint for agentic AI decode, a workload pattern Cerebras (focused on large-batch
              throughput) is less optimized for.
