              SambaNova's customer base spans five broad segments: (1) U.S. Department of Energy and NNSA national
              laboratories, which account for the largest cluster of named, production-grade deployments; (2) academic
              and government high-performance computing centers such as TACC and RIKEN; (3) global cloud and sovereign
              AI channel partners (SoftBank Japan, OVHcloud, SCX Australia, Argyll UK, Infercom Germany); (4) enterprise
              professional-services firms including Accenture and financial institutions such as OTP Bank; and (5)
              developer API users who access SambaNova Cloud's inference endpoints directly. The national-lab and
              research-HPC segment is the best-evidenced cohort, with multiple official DOE/NNSA announcements
              confirming production-grade DataScale installations. The channel-and-sovereign-AI segment has accelerated
              sharply since mid-2025, with three sovereign AI cloud announcements (SCX, Argyll, Infercom) in October
              2025 and OVHcloud's flagship AI Endpoints partnership announced in November 2025. The enterprise and
              financial-services segment is real but opaque: SambaNova marketing references "Fortune 500" accounts and
              financial-services deployments, yet no Fortune 500 client has publicly acknowledged an SN-series
              production installation. The developer API segment is proven by the SambaNova Cloud product's existence,
              free tier, and listed customers on the AWS Marketplace, but usage metrics remain undisclosed.
