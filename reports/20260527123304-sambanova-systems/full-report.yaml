            title: Research-More — Secondary Entry at $1.44B Merits Revisit
            body: >-
              The primary recommendation is research-more at the Series E-1 price (~$2.34B). The secondary market price
              of ~$1.44B (Forge, May 2026) implies an ~8x ARR multiple that is below sector median and more commensurate
              with execution risk. If an investor can access secondary shares at or near the $1.44B implied price with
              appropriate governance rights and information access, the risk-reward is more attractive — though still
              dependent on SN50 ramp, Intel partnership execution, and NRR confirmation.
