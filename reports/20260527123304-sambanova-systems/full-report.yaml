      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              AI inference infrastructure procurement is segmented across five distinct buyer archetypes, each with
              different budget ownership, purchasing criteria, risk tolerance, and switching costs.

              Hyperscalers (AWS, Azure, GCP, Meta) represent the largest absolute dollar buyers but are increasingly
              deploying captive custom silicon (Google TPU, AWS Trainium, Meta MTIA) that does not flow through the
              merchant chip market. Their procurement is led by infrastructure engineering teams, operates on multi-year
              supply agreements, and prioritizes throughput, power efficiency, and deep software integration. SambaNova
              does not currently target this segment.

              Large enterprises (financial services, healthcare, manufacturing, defense) are the primary addressable
              buyers for SambaNova. These organizations are running AI workloads at scale for fraud detection, clinical
              diagnostics, autonomous systems, and workflow automation, but face compliance requirements that make
              public cloud AI problematic. Azumo reports 87% of large enterprises implement AI solutions, but only 9%
              have achieved full AI maturity—indicating most are still in deployment ramp phases. Budget ownership
              typically sits with CTOs and CIOs, with procurement cycles of 6–24 months. Financial services, with 85–89%
              AI adoption rates, and healthcare, with 8x YoY usage growth, are priority verticals.

              Government and sovereign buyers are an accelerating segment. NTT DATA's 2026 Global AI Report (surveying
              ~5,000 senior decision-makers) found 95%+ of organizations consider private and sovereign AI important to
              strategy. Only 29% are prioritizing it concretely in the near term, but 96% are considering relocating AI
              infrastructure to specific regions due to geopolitical pressures. Forrester predicts half of G20 nations
              will mandate domestically tuned AI models for public-sector services by end-2026. SoftBank Corp.'s
              deployment of SambaNova's SN50 in Japan's sovereign AI data centers is a proof point in this segment.

              Neoclouds and AI inference service providers are a growing intermediary buyer: they purchase hardware
              (including SambaNova systems) and resell inference capacity to enterprise customers. The Intel-SambaNova
              collaboration explicitly targets this channel alongside direct enterprise sales.

              SMEs represent a lower-priority segment for SambaNova's current hardware model due to high capital
              intensity ($700K–$7M for on-premises AI clusters), though the SambaCloud service provides an entry point.
