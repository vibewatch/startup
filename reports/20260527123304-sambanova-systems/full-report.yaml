      - number: '8.3'
        title: Revenue Multiples, Capital Structure, and Valuation Range
        blocks:
          - type: paragraph
            body: >-
              The valuation picture for SambaNova is complicated by three overlapping data layers. First, primary-round
              data: the Series E-1 at $30.99/share implies ~$2.34B. Second, aggregator data: sources including Tracxn
              and user-context cite $4.8B post-money, which at ~$100M mid-2025 ARR implies ~48x EV/ARR — well above
              sector median and inconsistent with the share price evidence. Third, secondary market data: Forge's $1.44B
              estimate (May 26, 2026) implies ~8x ARR at $180M — below sector median and reflecting execution risk
              discounting.

              Using the more supportable E-1 primary price of $2.34B: against $100M mid-2025 ARR the multiple is ~23x;
              against $180M early-2026 ARR it drops to ~13x. This range brackets fair value for a high-growth AI
              infrastructure company with revenue momentum but persistent opacity. The more conservative $13x reflects
              improving ARR trajectory and makes the E-1 price look more defensible, contingent on the $180M figure
              being auditable.

              The capital structure introduces additional complexity. The preference stack from the 2021 Series D ($677M
              at $5.11B) means common equity and employees are deeply out of the money at all valuations below $5.11B.
              Series E investors at $30.99/share (E-1) are at a 67% discount to the Series D price ($95.02), giving them
              a structural preference advantage over earlier tranches. However, the E-2 at $21.70/share signals a
              blended cost of capital to the new cohort that is lower than E-1 headline, and there may be anti-dilution
              protections or ratchets that further compress effective returns for earlier investors.

              A Lincoln Variable Insurance Products Trust filing as of June 30, 2025 reported holding SambaNova shares
              at $44.47/share — 43% above the subsequent E-1 issue price — indicating that institutional mark-to-market
              sentiment deteriorated materially between mid-2025 and the Series E close. This is consistent with the
              late-2025 acquisition process and the Caplight/BlackRock markdown.
