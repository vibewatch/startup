  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              SambaNova operates in a rapidly evolving AI infrastructure market where the dominant training-era
              framing—NVIDIA GPUs as the universal platform—is giving way to a more fragmented inference-era landscape.
              In 2026, at least three architectural bets compete for the inference workload: wafer-scale monolithic
              chips (Cerebras WSE-3), streaming language processing units (Groq LPU, now under NVIDIA), and
              reconfigurable dataflow units with tiered memory (SambaNova RDU). Simultaneously, incumbent GPU platforms
              led by NVIDIA Blackwell (B200) and AMD MI300X have closed the performance gap for many production
              inference workloads. Cloud hyperscalers—AWS Trainium3 and Google Cloud TPU Ironwood—offer captive
              inference infrastructure that is substantially cheaper per token but requires deep cloud commitment. A
              fourth layer of inference-as-a-service platforms (Together AI, Lambda Labs, Anyscale) runs on GPU clusters
              and competes at the API level with SambaCloud. The buyer's primary decision criteria in 2026 are inference
              throughput per user, time-to-first-token for agentic workloads, total cost of ownership, deployment model
              (cloud vs. on-premise), data-sovereignty requirements, and software ecosystem breadth. SambaNova is
              well-positioned on the deployment-model and sovereignty axes but faces acute pressure on ecosystem breadth
              and brand awareness relative to both NVIDIA and the two recently better-capitalized pure-play rivals.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
