      - number: '5.4'
        title: Developer Ecosystem and Integration
        blocks:
          - type: paragraph
            body: >
              SambaNova maintains an active open-source developer footprint for a hardware-focused company. The
              ai-starter-kit repository on GitHub provides open-source Python examples organized into four categories:
              Data Ingestion and Preparation, Model Development and Optimization, Intelligent Information Retrieval, and
              Advanced AI Capabilities. Example kits cover enterprise knowledge retrieval (RAG), benchmarking, financial
              assistants, function calling, custom chat templates, and multimodal knowledge retrieval. The kit supports
              both SambaCloud API access (via SAMBANOVA_API_KEY) and on-premises SambaStack endpoint integration.

              The official sambanova Python SDK on PyPI (pip install sambanova) requires Python 3.9+ and exposes both
              synchronous and asynchronous clients via httpx, with aiohttp as an optional high-concurrency backend. The
              SDK covers chat completions, a Responses API, streaming (SSE), file uploads (audio transcription), typed
              request/response models via Pydantic, automatic retries with exponential backoff, and a full error
              hierarchy. The package version at time of authoring is not explicitly stated in public PyPI docs but the
              project is actively maintained. SambaNova's HuggingFace organization (sambanovasystems) hosts 32 model
              checkpoints including SambaLingo multilingual variants (Arabic, Turkish, Hungarian, Thai at 7B and 70B
              scales) and a draft model for the QwQ-0.5B-SFT architecture.

              Integration ecosystem breadth is substantial relative to SambaNova's size: LangChain
              (langchain-sambanova), LlamaIndex, CrewAI, AutoGen, OpenRouter, n8n, AWS, and approximately 50 third-party
              integrations are listed in the AI Starter Kit documentation. OpenAI-compatible endpoints mean existing
              codebases can switch inference providers by changing a base URL and API key without rewriting client code.
              Rate limits and context windows vary by tier (Free, Developer, Enterprise), with Enterprise offering
              dedicated support and higher rate limits for production workloads.
