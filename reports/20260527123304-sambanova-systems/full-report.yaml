  - id: TE003
    title: Technology and Operating Architecture Table
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Risk
    rows:
      - - SN40L / SN50 RDU chip
        - Core compute and inference execution; dataflow-based operator fusion
        - TSMC fabrication (5 nm for SN40L; process node for SN50 not publicly confirmed)
        - Foundry concentration at TSMC; geopolitical risk to advanced node allocation
      - - On-chip SRAM (520 MB per SN40L chip)
        - Holds active weights for immediate computation; eliminates repeated DDR/HBM fetches for fused operations
        - Custom SRAM cell design; tightly coupled to RDU microarchitecture
        - SRAM density limits scalability of on-chip tier; future models may require larger SRAM budgets
      - - HBM tier (64 GB per chip, SN40L-16 config)
        - Active model weight buffer between SRAM and DDR; high-bandwidth access for layers in flight
        - HBM supply from SK Hynix / Samsung / Micron; constrained by industry-wide HBM demand
        - HBM supply constraints can affect system availability; SambaNova uses less HBM per chip than H100 by design
      - - DDR DRAM tier (768 GB per chip, SN40L-16)
        - Capacity-tier storage for hundreds of models simultaneously; enables microsecond hot-swap to HBM
        - Standard DDR DRAM supply; commodity market, lower supply risk than HBM
        - Cache miss performance impact if model is not prefetched from DDR to HBM; eviction policy proprietary
      - - SambaFlow compiler
        - Compiles PyTorch / standard ML graphs to RDU dataflow programs; operator fusion; spatial layout optimization
        - MLIR compiler infrastructure; SambaNova proprietary compiler passes
        - >-
          Custom compiler creates vendor lock-in; model portability from SambaNova hardware to GPU requires
          recompilation or fallback
      - - SambaCloud API infrastructure
        - OpenAI-compatible API gateway; rate limiting, auth, model routing, streaming
        - Third-party hosting (SoftBank in APAC; colocation partners in US/EU)
        - API outages tied to partner data center reliability; no public SLA for free/developer tiers
    notes: >-
      TSMC process node for SN50 is not confirmed in public documentation. HBM per-chip figures are for the SN40L-16
      configuration per the Weicloud datasheet; SN50 HBM configuration is not publicly specified. SambaFlow compiler
      details are proprietary.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE009
