      - number: '8.5'
        title: Recommendation, Stance, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The overall recommendation is research-more with a stretched valuation stance. SambaNova has demonstrated
              impressive ARR growth momentum, secured a credible strategic partner in Intel, and launched a technically
              differentiated next-generation chip. However, the evidence base for a confident investment decision at the
              Series E-1 price ($30.99/share, ~$2.34B implied) is incomplete: gross margins, NRR, audited revenue,
              preference overhang, and SN50 production ramp remain undisclosed or unverifiable from public sources.

              The valuation context is adverse in several respects. The secondary market is pricing shares at a 39%
              discount to the E-1 issue price. The company required a 54% down-round from 2021 and explored a distressed
              sale at a further 60% discount. The $4.8B aggregator-cited figure remains inconsistent with primary share
              price data and should be treated as unverified until SambaNova discloses official round documents. The
              preference stack from the $5.11B Series D creates overhang that will suppress common equity returns and
              limit employee retention incentives.

              Risk rating is high, driven by capital intensity, competitive pressure from Cerebras and Nvidia,
              governance concerns (Lip-Bu Tan's dual role as Intel CEO and SambaNova Chairman), and the gap between
              primary-round and secondary-market pricing. Confidence is medium, limited by private-company opacity and
              the absence of audited financials.

              For investors already at the table (Series E participants): the priority diligence asks are audited ARR
              composition and NRR, SN50 production schedule and committed orders, preference waterfall analysis, and
              gross margin by revenue stream. For those evaluating secondary entry at the Forge price (~$1.44B, ~8x
              ARR): the discount to primary provides a more attractive entry point that partially compensates for
              opacity, but the illiquidity and governance risks persist.
