      - number: '4.3'
        title: Capital Structure and Funding History
        blocks:
          - type: paragraph
            body: >-
              SambaNova has raised approximately $1.49B in total venture capital across five reported primary rounds
              since its founding in 2017. The company's most recent primary raise was a $350M Series E in February 2026,
              led by Vista Equity Partners and Cambium Capital, with Intel Capital, Qatar's sovereign wealth fund (QIA),
              GV, Battery Ventures, and accounts advised by T. Rowe Price Associates also participating. This round was
              used to fund expanded manufacturing capacity for the SN50 chip and to scale cloud infrastructure.

              The valuation story is nuanced. The Series D in April 2021 was led by SoftBank Vision Fund 2 at a $5.1B
              post-money valuation. The company's SEC Form D filing confirms $677,999,515 raised in that round.
              SambaNova did not disclose a post-money valuation in its Series E press release; third-party data sources
              cite the post-money figure at approximately $4.8B, while BlackRock marked down its SambaNova position by
              17% in late 2025, implying an effective value closer to $2.4B. Secondary market trades referenced by
              ainvest placed implied valuation as low as ~$2.24B at certain points before the Series E closed. The
              discrepancy represents a material down-round risk signal relative to the 2021 peak.

              Prior to the Series E, SambaNova had gone approximately five years without a primary capital raise, during
              which time the company reportedly struggled to close new funding at a favorable valuation, explored a sale
              to Intel at an estimated $1.6B (including debt), and worked with investment bankers to evaluate strategic
              options. The decision to raise the Series E rather than sell to Intel reflects confidence in the
              standalone path but also underscores the depth of financial pressure the company faced heading into 2026.
            claimRefs:
              - CI015
