      - number: '2.5'
        title: Nvidia Dominance and Whitespace for Alternatives
        blocks:
          - type: paragraph
            body: >
              Nvidia commands approximately 75–80% of the AI accelerator market by revenue in 2026, down from a peak of
              ~87% in 2024 as the total market expands faster than Nvidia can capture. SiliconAnalysts projects Nvidia's
              FY2026 data center revenue at $150B+, with Blackwell (B200, GB200) as the primary growth driver. The H100
              manufacturing cost is approximately $3,320 to produce but sells for $28,000—an 88.1% gross margin that
              funds a structural R&D and supply chain advantage competitors cannot easily match. Nvidia has secured
              approximately 60% of TSMC's CoWoS advanced packaging capacity, creating a supply allocation moat.

              AMD is the only meaningful merchant alternative, holding approximately 6–10% of AI accelerator revenue in
              2026 with MI300X/MI355X products. Custom silicon from hyperscalers (Google TPU v5p/Trillium, AWS Trainium
              2, Microsoft Maia 200, Meta MTIA v2) collectively accounts for $25–50B+ in 2026 but is not available for
              external sale. Intel's Gaudi 3 holds approximately 1–3% of the merchant market.

              In AI inference specifically, Nvidia's share is estimated at 60–75%—materially lower than its 90%+
              training dominance—because inference workloads are more tolerant of alternative architectures, CPU-based
              inference is viable for smaller models, and economic optimization matters more in production than raw
              throughput. This inference whitespace is the primary commercial opportunity for SambaNova.

              SambaNova's SN50 chip (announced February 24, 2026) claims 5x maximum speed and 3x lower total cost of
              ownership versus Nvidia's Blackwell B200 on agentic inference workloads, based on internal benchmarking of
              models including Llama 3.3 70B, GPT-OSS 120B, and DeepSeek 671B. These claims have not yet been
              independently validated in production at the time of this report. Futurum's analyst assessment notes that
              "NVIDIA's inference software ecosystem, hyperscaler platform integration, and workload optimization for
              reasoning models create switching costs and inertia that specialized inference chips must overcome through
              demonstrable economic advantages."

