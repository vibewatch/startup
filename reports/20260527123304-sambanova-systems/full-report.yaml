  - id: FE001
    title: SambaNova Full-Stack Product Architecture
    type: stack
    layout: standard
    summary: >-
      Five-layer architecture from RDU silicon to deployed AI applications, showing how SambaNova's vertically
      integrated stack differentiates at each tier.
    data:
      layers:
        - label: Chip Layer
          detail: >-
            Proprietary RDU silicon with three-tier memory (SRAM + HBM + DDR). SN40L (4th gen, GA) and SN50 (5th gen,
            announced Feb 2026, H2 2026 shipment target) implement Reconfigurable Dataflow Architecture (RDA) for
            continuous pipeline execution.
          items:
            - SN40L RDU (4th gen, 520 MB SRAM/chip, 64 GB HBM/chip, 768 GB DDR/chip, 3-tier memory, TSMC 5nm)
            - SN50 RDU (5th gen, 5× compute vs SN40L, 4× network bandwidth, 256-chip interconnect, 10T+ params)
        - label: System Layer
          detail: >-
            SambaRack integrates 16 RDU chips per rack at 10–20 kW with air-cooling only. Multi-rack clusters scale to
            256 SN50 accelerators over a multi-terabyte-per-second fabric. No liquid cooling infrastructure required.
          items:
            - 'SambaRack SN40L: 16 chips/rack, 10 kW, 400/200 GbE networking, air-cooled'
            - 'SambaRack SN50: 16 chips/rack, 20 kW, air-cooled, H2 2026 GA target'
        - label: Compiler / Runtime Layer
          detail: >-
            SambaFlow compiles PyTorch graphs to RDU dataflow programs using spatial programming and operator fusion,
            eliminating GPU kernel-scheduling overhead. DDR-tier model scheduler enables microsecond model hot-swapping.
          items:
            - 'SambaFlow compiler: MLIR-based, operator fusion, spatial layout, PyTorch frontend'
            - 'Model hot-swap scheduler: microsecond switching between resident models via DDR tier'
        - label: Platform Layer
          detail: >-
            Three commercial tiers share the same hardware and SambaFlow software. SambaStack targets on-premises
