      - number: '8.2'
        title: Comparable Set — Public and Private AI Infrastructure
        blocks:
          - type: paragraph
            body: >-
              SambaNova's closest private analogues are Groq and Cerebras, both Nvidia challengers in the AI
              inference/accelerator space. Groq raised $750M in September 2025 at a $6.9B post-money valuation, having
              previously closed at $2.8B in August 2024 — more than doubling in roughly a year. With estimated 2024
              revenue around $90M, Groq's $6.9B valuation implies approximately 76x trailing revenue, a premium
              justified by investor optimism over its LPU architecture and rapidly expanding developer ecosystem.

              Cerebras has diverged even more starkly. The company raised $1B in a Series H in February 2026 at a $23B
              valuation, filed to go public on Nasdaq at a range of $115–$125 per share targeting $26.6B, and reported
              $510M in revenue and $87.9M in GAAP net income for 2025. Cerebras's $24.6B in remaining performance
              obligations (backlog) provides revenue visibility that SambaNova cannot currently match. At its IPO
              valuation, Cerebras trades at approximately 45–52x 2025 revenue.

              Among public companies, Nvidia's fiscal 2026 revenue of $215.9B against a ~$4.6T market cap implies a
              price-to-sales ratio of approximately 21x. AMD, at $34.6B in 2025 revenue and ~$397B market cap, trades at
              approximately 11.5x revenue. These public multiples serve as a gravity anchor: at scale, AI chip companies
              are valued at 10–25x revenue. The premium for private pre-revenue-scale peers like Groq and Cerebras
              reflects hypergrowth expectations, scarcity, and strategic optionality.

              Finro's Q1 2026 dataset across 575 AI companies finds a median EV/Revenue multiple of approximately 21.2x
              for AI infrastructure, with an average of 31.3x and a 25th–75th percentile range of 10.2x–39.6x. At the
              Series E-1 implied $2.34B and ~$100M mid-2025 ARR, SambaNova's ~23x multiple sits at median — reasonable
              in isolation but pressured by Cerebras's superior revenue scale, profitability, and backlog, and by Groq's
              faster valuation accretion.

              Capital efficiency is the sharpest differentiator. SambaNova's valuation/total-raised ratio is
              approximately 1.6x ($2.34B / $1.49B), versus Groq at ~9.2x ($6.9B / $750M raised) and Cerebras at
              approximately 14x ($23B / ~$1.6B raised). SambaNova has consumed far more capital per dollar of current
              valuation, a structural concern that makes the bull case dependent on a step-change in revenue efficiency.
            claimRefs:
