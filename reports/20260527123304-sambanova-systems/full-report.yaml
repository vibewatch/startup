      - number: '2.2'
        title: Market Sizing—TAM, SAM, and Multiple Analyst Lenses
        blocks:
          - type: paragraph
            body: >
              Global AI chip and accelerator market estimates for 2026 span a 2–3x range depending on market boundary
              definitions, making a single TAM figure misleading. The appropriate sizing lens for SambaNova depends on
              the segment it targets: enterprise and sovereign on-premises AI inference hardware and systems, not the
              full semiconductor market.

              The broadest TAM estimate is Deloitte's updated $500B for 2026 AI chips globally, revised upward in spring
              2026 from an initial $300B estimate after WSTS reported a December 2025 $175B global semiconductor market
              upward revision driven entirely by AI demand. IDC (April 2026) projects total semiconductor revenues at
              $1.29T in 2026, with data center semiconductor revenues at $477.1B—of which the "intelligent datacenter"
              segment (CPUs + AI accelerators + GPUs + ASICs + networking) is $281B. By 2030, IDC projects data center
              semiconductors will reach $843B and total semiconductor revenues $1.75T.

              AMD CEO Lisa Su (Reuters, November 2025) projected the AI data center chip market will exceed $500B by
              2028 and grow to $1 trillion by 2030. This figure is not corroborated by IDC, Gartner, or other
              independent analyst firms for that time horizon, and appears to encompass a broader definition than
              merchant silicon alone—illustrating that vendor-stated TAM claims require boundary scrutiny.

              For the inference sub-market specifically, Fortune Business Insights estimates the AI inference market at
              $117.8B–$126.2B in 2026, growing at approximately 17–19% CAGR. MarketsAndMarkets projects a similar range
              ($119–$126B) for 2026. Inference accounts for roughly two-thirds of AI compute cycles and 80–90% of the
              lifetime cost of a deployed AI system, making it the dominant operational spend category even if training
              chips carry higher unit prices.

              SambaNova's addressable market—enterprise and sovereign on-premises and partner-cloud AI inference—is a
              subset of the $200B+ merchant accelerator market and the $120B+ AI inference market. The company does not
              currently serve the hyperscaler internal capex segment (where custom silicon dominates) or the consumer
              device edge market. A conservative SAM estimate for SambaNova's segment (enterprise inference hardware
              excluding hyperscaler captive) is $30–$60B globally in 2026, based on applying a ~20–30% enterprise
              fraction to the $200B accelerator market, with substantial uncertainty.
