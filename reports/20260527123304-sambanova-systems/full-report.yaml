      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The most consequential growth driver for enterprise AI inference is the inference shift itself: as
              generative and agentic AI deployments scale from pilot to production, inference workloads compound in
              volume and cost. By 2026, inference is projected to represent 80–90% of the lifetime cost of a deployed AI
              system. The rise of agentic AI—autonomous, multi-step reasoning pipelines with sequential model
              calls—intensifies demand for low-latency inference specifically, because latency compounds
              multiplicatively across tool-calling sequences. Futurum's analyst assessment notes this creates an
              economic tension: GPU architectures optimized for training throughput struggle to deliver agentic
              inference speed at economics that enterprises can scale, creating the whitespace SambaNova targets.

              Sovereign AI regulation is a structural demand driver. The EU AI Act, Korea's AI Framework Act (effective
              January 2026), China's Generative AI Regulations, and US Executive Order 14179 collectively mandate data
              governance requirements that make fully cloud-based AI problematic for high-risk applications in regulated
              sectors. Polyglotsoft documents that 67% of enterprises cited sensitive data exposure as their top AI
              adoption concern in McKinsey's 2025 survey. CloudLatitude reports AWS launched its European Sovereign
              Cloud in 2026, and the US FedRAMP 20x initiative is finalizing security certification for federal cloud
              providers—confirming regulatory tailwinds for sovereign and on-premises deployments.

              On the constraint side, power availability has displaced budget as the primary barrier to scaling AI
              infrastructure. Flexential's 2026 State of AI Infrastructure Survey (350+ enterprise IT leaders) found 89%
              say reliable grid power influences AI deployment decisions, and 55% rank power cost differences as the top
              factor in AI workload location choices. AI data centers require 4x more power than the grid adds annually,
              creating physical deployment ceilings. The share of enterprises expecting measurable AI financial returns
              within one year dropped from 51% to 36% between 2025 and 2026 surveys, reflecting lengthening ROI
              timelines as infrastructure costs rise.

              CUDA ecosystem lock-in is the dominant switching-cost barrier for GPU alternatives. Nvidia's CUDA
              ecosystem spans 20+ years and 4M+ developers; every major ML framework is optimized for CUDA first.
              Switching to alternative architectures—including SambaNova's RDU—requires software re-engineering
              investment measured in months to years, not just hardware spend. Additionally, 62% of organizations have
              not moved AI projects beyond the pilot stage, creating uncertainty about which inference workloads will
              actually scale and warrant infrastructure investment decisions.

              Hyperscaler capex is a structural tailwind for the broader market but a competitive pressure for merchant
              silicon vendors: hyperscalers are expected to increase capex by approximately 40% in 2026 to ~$600B, but a
              growing share is directed toward captive custom silicon, directly reducing their addressable purchases
              from merchant chip vendors. US-China export controls have removed $5–10B in addressable Nvidia revenue,
              creating geopolitical complexity but also demand for non-US alternatives in some sovereign markets.
