      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiated RDU Architecture With Multi-Gen Track Record
            body: >
              SambaNova's Reconfigurable Dataflow Unit architecture is a purpose-built AI inference chip platform with
              five generations of silicon (SN10 through SN50) and a distinctive three-tier memory hierarchy (HBM + DDR5
              + SRAM) that enables up to 256 chips in a single memory space and approximately 90% HBM bandwidth
              utilization—substantially above typical GPU figures. The SN50, announced February 2026, delivers 2.5× more
              FP16 compute than the prior SN40L, supports FP8/FP4 precision, and offers 5× the speed of competitive
              chips per SambaNova claims. This technical differentiation is the foundation of the company's enterprise
              inference value proposition.
            calloutType: strength
            claimRefs:
              - CO010
              - CO012
              - CO013
              - CO039
              - CO040
          - type: callout
            title: Governance Conflict – Intel CEO as Executive Chairman
            body: >
              Lip-Bu Tan serves simultaneously as Intel's CEO and SambaNova's Executive Chairman, creating a persistent
              governance conflict. While Tan recused himself from the 2025 Intel acquisition discussions, the
              arrangement means SambaNova's board chair is the head of its most strategic corporate partner and an
              earlier potential acquirer. Post-Series E, with a multi-year Intel collaboration in place, this conflict
              remains unresolved and could constrain SambaNova's strategic flexibility, particularly if competitive
              dynamics shift between the two companies.
            calloutType: risk
            claimRefs:
