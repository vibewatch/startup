  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Valuation Context and Series E Financing
        blocks:
          - type: paragraph
            body: >-
              SambaNova's February 24, 2026 Series E round raised more than $350M, led by Vista Equity Partners and
              Cambium Capital. The round was structured in at least two tranches: Series E-1 at $30.99 per share and
              Series E-2 at $21.70 per share, totalling approximately $307.13M and $42.87M respectively per Yahoo
              Finance/Forge data. The E-1 pricing implies a post-money valuation of approximately $2.34B; however, some
              third-party sources including Tracxn and user-context data cite a $4.8B post-money figure — a significant
              discrepancy that the company has not publicly resolved.

              The $2.34B (E-1) primary price represents a 54% decline from the 2021 Series D peak of $5.11B, meeting the
              standard definition of a down round. Before the Series E closed, BlackRock had already marked its
              SambaNova stake down by approximately 17% per Caplight analysis, implying an effective value of ~$2.4B.
              Intel was simultaneously in advanced acquisition talks at approximately $1.6B including debt — a price
              that would have wiped out most equity value held by 2021 Series D investors.

              As of May 26, 2026, Forge's secondary market estimate places SambaNova's implied valuation at $1.44B, with
              shares trading at $19.05 — 39% below the Series E-1 primary price. This persistent secondary discount
              signals skepticism among market participants about execution relative to the primary-round price. Despite
              this, the 3-month Forge return tracker shows SambaNova up 38.53% vs. the index's 9.62%, indicating
              secondary sentiment has improved materially since the Series E closed in February 2026.

              CEO Rodrigo Liang described the round as "grossly, grossly oversubscribed," and Intel Capital committed
              approximately $100–$150M strategically alongside Vista. The dual-tranche structure (E-1 at $30.99, E-2 at
              $21.70) creates a blended all-in cost below the E-1 headline, with the tiered economics suggesting
              preferred price protection for senior investors. This capital structure complexity, combined with the deep
              preference overhang from the $5.11B Series D, creates material risk for common equity and later-series
              investors at or below the 2021 watermark.
