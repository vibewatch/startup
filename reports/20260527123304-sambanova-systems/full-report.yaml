      - number: '7.4'
        title: Financial, Capital & Governance Risk
        blocks:
          - type: paragraph
            body: >
              SambaNova's February 2026 Series E valued the company at approximately $2.4 billion—a 53% nominal markdown
              from the $5.1 billion peak Series D valuation in 2021. AI chip hardware startups are capital-intensive:
              SVB's 2025 research estimated median burn multiples of 2.0–3.0× for hardware-stage AI companies.
              SambaNova's total capital raised is approximately $1.49 billion with no publicly disclosed revenue.
              Governance risk is elevated by Intel CEO Lip-Bu Tan's dual role as a SambaNova board member, creating
              fiduciary conflicts in Intel foundry decisions and potential Intel acquisition discussions. If a
              subsequent round requires a down-round, liquidation preference structures could eliminate common equity
              for employees hired during the 2019–2022 peak era.
