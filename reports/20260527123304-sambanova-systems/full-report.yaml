          - type: callout
            title: Down Round, Preference Overhang, and Common Equity Risk
            body: >-
              The Series E-1 at ~$2.34B represents a 54% decline from the 2021 Series D at $5.11B. The preference stack
              from the Series D ($676M raised at $95.02/share) creates a substantial waterfall that must be cleared
              before any sub-$5.11B exit returns value to earlier common holders. Series E investors at E-1 pricing are
              structurally senior to earlier common stock but must still navigate anti-dilution provisions and the
              secondary market discount. Secondary market entry at $1.44B provides a more attractive buffer against the
              preference stack.
