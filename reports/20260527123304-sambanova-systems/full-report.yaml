      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Inference is the Market—Not Training
            body: >
              By 2026, inference workloads account for approximately two-thirds of all AI compute cycles and 80–90% of
              the lifetime cost of a deployed AI system. The AI chip market is structurally shifting from a
              training-capex story to an inference-operations story, and the fastest-growing sub-segment—agentic AI—has
              latency requirements that favor purpose-built inference architectures over GPU throughput machines.
              SambaNova's bet on inference and its SN50 architecture are aligned with this structural shift.
            calloutType: insight
            claimRefs:
              - CM039
              - CM042
          - type: callout
            title: Conflicting Market Estimates Create Sizing Uncertainty
            body: >
              Analyst estimates for the 2026 AI chip market range from $120B (AI inference sub-market) to $500B (all AI
              chips including memory and networking), a 4x spread. AMD's CEO-stated $1T market by 2030 is not
              corroborated by IDC, Deloitte, or other independent analysts for that time horizon. Investors and
              evaluators must normalize for market boundary before accepting any TAM figure at face value. SambaNova's
              addressable enterprise inference hardware market—excluding hyperscaler captive silicon—is plausibly
              $30–60B in 2026, not the headline $200B–$500B AI chip figures.
            calloutType: risk
            claimRefs:
              - CM044
              - CM011
              - CM010
          - type: callout
            title: Sovereign AI Regulation Tailwind Is Real and Near-Term
            body: >
              95% of enterprises in NTT DATA's May 2026 survey (nearly 5,000 respondents) say private and sovereign AI
              are important to strategy. Forrester projects half of G20 nations will mandate domestically tuned AI
              models for public services by end-2026. This is a structural demand driver for on-premises and sovereign
              AI infrastructure deployments—exactly the use case where SambaNova's combination of air-cooled power
              efficiency, multi-model support, and non-Nvidia architecture holds the most near-term competitive appeal.
            calloutType: strength
            claimRefs:
              - CM025
              - CM029
              - CM021
          - type: callout
            title: SambaNova Performance Claims Require Independent Validation
            body: >
              SambaNova's 5x speed and 3x TCO claims for SN50 vs. Nvidia B200 are based on internal benchmarking. No
              independent third-party validation of SN50 production performance has been published as of the runDate.
              Futurum's analyst coverage explicitly flags that "NVIDIA's inference software ecosystem, hyperscaler
              platform integration, and workload optimization for reasoning models create switching costs and inertia
              that specialized inference chips must overcome through demonstrable economic advantages." The SoftBank
              Japan deployment is an early proof point but not a market-representative benchmark.
