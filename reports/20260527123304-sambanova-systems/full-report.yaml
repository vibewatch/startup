  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Market & Competitive Risk
        blocks:
          - type: paragraph
            body: >
              SambaNova operates in an AI chip landscape dominated by Nvidia, which held roughly 70–80% of datacenter
              GPU revenue in 2025. Nvidia's CUDA ecosystem—more than a decade of software investment and community
              lock-in—creates asymmetric switching costs: enterprises running PyTorch, NCCL, and RAPIDS on Nvidia
              hardware face significant re-engineering to adopt SambaNova's SambaFlow stack. This lock-in is structural
              rather than accidental; CUDA now encompasses compiler toolchains, profiling tools, pre-trained model
              registries, and MLOps integrations that no challenger has fully replicated. Groq secured a $1.5 billion
              sovereign AI partnership in 2024–25; Cerebras raised $1.1 billion at an $8.1 billion valuation. SambaNova
              claims the SN50 chip delivers "5× better performance per watt" versus a Nvidia B200 configuration but
              independent benchmarks remain unavailable. Forbes described the competitive dynamics as likely producing
              only one large winner among Groq, Cerebras, and SambaNova by 2026–2027, heightening existential stakes.
            claimRefs: []
