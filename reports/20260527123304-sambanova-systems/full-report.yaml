      - number: '7.5'
        title: People, Execution & Regulatory Risk
        blocks:
          - type: paragraph
            body: >
              A workforce reduction of approximately 150 employees (roughly 15–20% of headcount) in 2024–2025 targeted
              engineering, sales, and operations roles, and a WARN Act notice filing confirms the reduction reached the
              statutory threshold. Key-person risk is significant: CEO Rodrigo Liang, CTO Kunle Olukotun, and Chief
              Scientist Christopher Ré are the public faces of technical differentiation. Ré's departure to an academic
              role or competitor would remove a visible signal of research credibility. In May 2026, BIS published
              revised export control rules targeting advanced AI chips; SambaNova's SN50 is likely subject to these
              controls, restricting sales to certain non-allied geographies. Wilson Sonsini's engagement of its national
              security and technology practice for the Series E closing signals FOCI compliance requirements.
