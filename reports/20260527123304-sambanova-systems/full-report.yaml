      - number: '7.3'
        title: Partner, Dependency & Customer Concentration Risk
        blocks:
          - type: paragraph
            body: >
              SambaNova's primary disclosed customers—Argonne National Laboratory, Lawrence Livermore, Lawrence
              Berkeley, Oak Ridge, and Los Alamos National Laboratories—are all part of the DOE/NNSA system, creating a
              60–80% estimated government revenue concentration. This extreme dependence means a single federal budget
              event or FOCI adverse determination could simultaneously affect multiple customer accounts. SoftBank is
              the most significant disclosed commercial customer, but contract terms and revenue volume were not
              disclosed, limiting confidence in commercial diversification claims. TSMC and HBM suppliers constitute
              structural manufacturing dependencies with no confirmed mitigation, while Vista Equity Partners provides
              the primary capital relationship as Series E lead. A DOE budget sequestration, FOCI adverse determination,
              or SoftBank contract termination could each individually cause a material revenue shock without near-term
              commercial offset.
            claimRefs: []
