              publicly named customer list is dominated by U.S. government and academic institutions; if these account
              for the majority of hardware-system revenue, SambaNova carries significant concentration in a segment
              where procurement cycles are long and successor contracts require re-competition. The October 2025 report
              that SambaNova had failed to close a new funding round and was exploring a sale — described as occurring
              despite the company's strong technology — raised legitimate questions about commercial revenue
              diversification: if enterprise Fortune 500 and financial-services deployments were generating robust
              repeatable revenue, the funding crisis would likely have been averted. SambaNova's November 2024 layoff of
