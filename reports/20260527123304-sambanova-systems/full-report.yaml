      - number: '3.4'
        title: Hyperscaler Custom Silicon — AWS Trainium and Google TPU
        blocks:
          - type: paragraph
            body: >-
              AWS Trainium and Google Cloud TPU represent the highest-volume segment of the non-NVIDIA inference market,
              but they are structurally inaccessible to on-premise buyers and impose deep cloud lock-in. AWS Trainium3
              (3nm; 2.52 PFLOPS FP8 per chip) delivers 30–40% better price-performance than GPU-based EC2 P5e/P5en
              instances and is used by Anthropic, Databricks, and Decart for frontier model inference. The AWS Neuron
              SDK requires model porting and integrates tightly with SageMaker, EKS, and ECS, creating a cloud-native
              deployment that has no on-premise analogue. Trn3 UltraServers (up to 144 chips) target the
              highest-throughput training and reasoning-model inference workloads. Google Cloud TPU Ironwood (7th
              generation) achieves 42.5 ExaFlops per pod across 9,216 liquid-cooled chips and 4x better performance per
              chip over its predecessor Trillium. TPU 8i (upcoming) targets low-latency MoE inference with an 80%
              performance-per-dollar improvement over prior generations. Google TPUs power Gemini and all of Google's
              consumer AI applications at scale, giving Google unmatched production validation. The Google XLA ecosystem
              (JAX, TF) creates a meaningful porting barrier for PyTorch-native enterprise teams. For SambaNova, the
              hyperscalers represent both a competitive threat (for cloud inference buyers) and an indirect validation:
              enterprises that require data sovereignty, classified environments, or air-cooled on-premise deployments
              cannot use AWS Trainium or Google TPU—and that segment is exactly where SambaNova and its sovereign AI
              partnerships (Australia SCX, Germany Infecom, UK Argyll, Japan SoftBank) are positioned. Inference
              accounts for roughly two-thirds of all AI compute in 2026, making hyperscaler custom silicon a growing
              competitive pressure even as the sovereign niche insulates SambaNova from the most direct displacement.
            claimRefs:
