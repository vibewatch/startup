  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: >-
              SambaNova generates revenue through three primary streams: hardware sales of its DataScale systems
              (powered by proprietary Reconfigurable Dataflow Units, or RDUs), cloud-based AI inference API
              subscriptions, and professional services including deployment, data preparation, and model optimization.
              The company pivoted materially toward cloud and inference services in 2024 after spending its earlier
              years focused on training workloads and hardware-led engagements.

              The cloud API product, SambaNova Cloud, launched in September 2024, offers token-based billing ranging
              from $0.10 to $4.50 per million tokens depending on model complexity. Three tiers exist: a free tier for
              experimentation, a developer pay-as-you-go tier for latency-critical workloads on open-weight models, and
              a custom enterprise tier for high-throughput production deployments with dedicated capacity, SLAs, and
              volume discounts. Enterprise and sovereign contracts for on-premise DataScale hardware deployments
              continue alongside the cloud offering, with professional services comprising an estimated 25–33% of new
              customer engagements according to Sacra's company analysis.

              Revenue recognition is complex: hardware deals generate upfront or milestone-based revenue while cloud API
              subscriptions generate recurring token-consumption revenue. The precise split between hardware, cloud, and
              services is not publicly disclosed. Government and national laboratory customers — including Lawrence
              Livermore, Los Alamos, Argonne, and Oak Ridge National Laboratories — are material contributors, though no
              segment breakdown is available.
