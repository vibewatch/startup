      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Data Conflict — $2.34B vs. $4.8B
            body: >-
              Primary share-price data (Yahoo Finance/Forge; Series E-1 at $30.99/share) implies a post-money valuation
              of approximately $2.34B. Third-party aggregators including Tracxn and user-context data cite $4.8B — more
              than double. Until SambaNova discloses official round documentation, the $4.8B figure should be treated as
              unverified and potentially reflecting a different instrument class (e.g., pre-money, fully diluted on
              different share count, or including future commitments). Investors should not anchor to $4.8B without
              confirmation from counsel.
            calloutType: risk
            claimRefs:
              - CV002
