          - type: callout
            title: Valuation Decline and History of Financial Stress
            body: >
              SambaNova's implied valuation has declined materially since its $5.1 billion Series D peak in 2021.
              BlackRock marked down its stake by ~17% (implying ~$2.4B), the company explored a sale in 2024–2025, and
