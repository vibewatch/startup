      - number: '1.4'
        title: Scale, Milestones & Adverse Events
        blocks:
          - type: paragraph
            body: >
              SambaNova progressed through five chip generations from founding through 2026, culminating in the SN40L
              (September 2023, TSMC 5nm, HBM3 + DDR5 + SRAM memory) and the SN50 (announced February 2026, shipping H2
              2026). The company launched SambaNova Cloud in September 2024 as part of a pivot from hardware-focused
              training systems to cloud-first AI inference services. This strategic pivot, however, required a painful
              workforce reduction: in early 2025 SambaNova laid off approximately 77 employees—roughly 15% of its
              ~500-person workforce—to realign the team toward inference and cloud. The layoffs were followed by a
              period of financial pressure and strategic optionality-seeking. In late 2024, the company began exploring
              a potential sale, hiring an investment bank to manage the process; reported acquirers included large cloud
              providers and private equity. By late 2025, Intel—whose CEO Lip-Bu Tan chairs SambaNova—had signed a
              non-binding term sheet for an approximately $1.6 billion acquisition. Those talks ultimately stalled, and
              in early 2026 SambaNova abandoned the Intel deal and chose independence via the Series E recapitalization.
              Customers include Hugging Face, Meta, major AI labs, and SoftBank (first customer for the SN50 chip in
              Japan). SambaNova has also announced sovereign AI partnerships in Germany, the UK, Australia, Japan, and
              France. Current headcount post-layoff is estimated at roughly 400–425 employees; the post-Series E hiring
              trajectory is not publicly disclosed.
