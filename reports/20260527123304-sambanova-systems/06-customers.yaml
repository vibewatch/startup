callouts:
  - calloutType: strength
    title: DOE / NNSA National Lab Cluster is Credibly Evidenced
    body: >-
      Five U.S. DOE/NNSA sites (Argonne, ORNL, TACC, LLNL, LANL) are confirmed hardware-platform customers, each backed by official DOE/NNSA announcements or lab press releases with named executive quotes. The Argonne multi-generation upgrade (SN30→SN40L) is the clearest proof of customer retention and technical satisfaction in the portfolio.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010

  - calloutType: risk
    title: Adverse Signal — Funding Failure and Commercial Revenue Uncertainty
    body: >-
      In October 2025, reports emerged that SambaNova had failed to close a new funding round and was exploring a sale — despite strong technology. This is an adverse customer signal: if enterprise revenue across Fortune 500 and financial-services accounts were large and recurring, the company would not have reached a cash-constraint inflection requiring sale exploration. The February 2026 Series E ($350M) appears to have resolved the near-term liquidity risk, but the underlying question of commercial revenue diversification beyond government-funded labs remains open.
    claimRefs:
      - CU026
      - CU027

  - calloutType: risk
    title: No Public Retention Metrics for Any Segment
    body: >-
      SambaNova has disclosed no NRR, GRR, customer churn rate, CSAT score, or cohort retention data for any segment. The only observable retention indicator is Argonne's hardware upgrade and SoftBank's SN50 expansion. Without structured retention data, durability of the customer base cannot be independently assessed.
    claimRefs:
      - CU029
      - CU030

