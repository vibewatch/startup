  - id: concentration-and-proof-quality
    title: Customer Concentration Risk, Proof Quality, and Adverse Signals
    body: >-
      Customer concentration risk is material and underinvestigated due to limited public disclosure. The publicly named customer list is dominated by U.S. government and academic institutions; if these account for the majority of hardware-system revenue, SambaNova carries significant concentration in a segment where procurement cycles are long and successor contracts require re-competition. The October 2025 report that SambaNova had failed to close a new funding round and was exploring a sale — described as occurring despite the company's strong technology — raised legitimate questions about commercial revenue diversification: if enterprise Fortune 500 and financial-services deployments were generating robust repeatable revenue, the funding crisis would likely have been averted. SambaNova's November 2024 layoff of 77 employees (approximately 15% of the workforce) to pivot from training to inference workloads indicates that the earlier customer base anchored on training use cases was not large enough to absorb the transition, suggesting that customer expansion into inference has required a reset. Proof quality varies substantially: national-lab deployments are confirmed by official DOE/NNSA press releases and named quotes from lab directors; SoftBank, OVHcloud, and Accenture deployments are confirmed by bilateral press releases with named executive quotes; the OTP Bank deployment is documented by CB Insights with a named executive quote; broader enterprise claims (Fortune 500, unnamed financial-services banks, multiple fortune-500 references in marketing) lack independent corroboration and should be treated as company-claimed rather than independently verified. No public NRR, GRR, or customer-cohort retention data has been disclosed for any segment.
    claimRefs:
