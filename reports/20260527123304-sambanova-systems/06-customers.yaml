  - id: enterprise-channel-partners
    title: Enterprise, Channel, and Sovereign AI Customers
    body: >-
      Outside the DOE ecosystem, SambaNova has built a distinct set of enterprise and channel-partner customers. Accenture deployed SambaNova Suite to enable enterprise generative AI solutions — Contact Center Intelligence and Document Intelligence — for its clients, positioning SambaNova as the on-premises and sovereign AI backbone for large regulated organizations. SoftBank Corp. (Japan) deployed SambaNova Cloud in a new AI data center in Japan in March 2025, offering fast inference to Japanese and APAC developers via the SambaNova Cloud API; SoftBank was also designated the first customer for SambaNova's new SN50 chip announced in February 2026. OVHcloud, Europe's largest cloud provider, selected SambaNova in November 2025 to power its flagship AI Endpoints service with SambaStack hardware and RDU technology, targeting financial-trading, cybersecurity, industrial-automation, and logistics use cases across the EU. OTP Bank (Hungary, Central and Eastern Europe) deployed an AI supercomputer co-built by OTP Group, ITM, and SambaNova to train GPT-3-level language models for CEE regional languages. Saudi Aramco signed a memorandum of understanding with SambaNova to explore AI capabilities and infrastructure deployment aligned with Vision 2030. Three sovereign AI cloud partnerships — SCX (Australia), Argyll (UK), and Infercom (Germany) — were announced in October 2025, establishing SambaNova-powered inference clouds running on SN40L systems at 10 kW per rack with renewable energy. On the developer API side, SambaNova Cloud is available on AWS Marketplace with consumption-based pricing and is used by companies such as Blackbox.AI (developer tools), Argyll Data Development (energy sector), and other developer-oriented firms documented by CB Insights.
    claimRefs:
