company:
  name: SambaNova Systems

chapter:
  number: 6
  title: Customers
  summary: >-
    SambaNova has assembled a publicly documented customer base anchored by at least five U.S. Department of Energy / NNSA national laboratories (Argonne, Oak Ridge, Texas Advanced Computing Center, Lawrence Livermore, and Los Alamos), supplemented by channel and sovereign-AI deployments with SoftBank Japan, OVHcloud (Europe), Accenture, OTP Bank, RIKEN, and a growing set of developer API users. Evidence quality is high for government and research-lab segments, supported by official DOE/NNSA announcements and lab press releases. Enterprise and financial-services customer claims are largely unverified beyond named logos; no public retention rates, NRR, or contract-renewal data have been disclosed for any segment. An adverse financial signal from October 2025 — SambaNova exploring a sale after failing to raise new capital — raises customer concentration and commercial durability risk.

sections:
  - id: customer-segmentation
    title: Customer Segments and Adoption Overview
    body: >-
      SambaNova's customer base spans five broad segments: (1) U.S. Department of Energy and NNSA national laboratories, which account for the largest cluster of named, production-grade deployments; (2) academic and government high-performance computing centers such as TACC and RIKEN; (3) global cloud and sovereign AI channel partners (SoftBank Japan, OVHcloud, SCX Australia, Argyll UK, Infercom Germany); (4) enterprise professional-services firms including Accenture and financial institutions such as OTP Bank; and (5) developer API users who access SambaNova Cloud's inference endpoints directly. The national-lab and research-HPC segment is the best-evidenced cohort, with multiple official DOE/NNSA announcements confirming production-grade DataScale installations. The channel-and-sovereign-AI segment has accelerated sharply since mid-2025, with three sovereign AI cloud announcements (SCX, Argyll, Infercom) in October 2025 and OVHcloud's flagship AI Endpoints partnership announced in November 2025. The enterprise and financial-services segment is real but opaque: SambaNova marketing references "Fortune 500" accounts and financial-services deployments, yet no Fortune 500 client has publicly acknowledged an SN-series production installation. The developer API segment is proven by the SambaNova Cloud product's existence, free tier, and listed customers on the AWS Marketplace, but usage metrics remain undisclosed.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: government-national-labs
    title: Government and National Laboratory Customers
    body: >-
      The U.S. government and DOE national-laboratory segment provides SambaNova's most credible and independently verifiable customer proof. A formal strategic partnership agreement between DOE/NNSA, Lawrence Livermore National Laboratory, and Los Alamos National Laboratory, announced jointly with SambaNova, established the first multi-lab commitment and anchored SambaNova's federal footprint. LLNL integrated SambaNova DataScale (SN10 RDUs) into the NNSA's Corona supercomputing cluster for cognitive-simulation work in inertial confinement fusion and COVID-19 drug discovery; LANL integrated the same platform into its Darwin cluster for quantum-chemistry modeling. Argonne National Laboratory (ALCF, DOE Office of Science) is SambaNova's most publicly active reference customer: it originally deployed DataScale SN30 hardware and in late 2024 expanded with a new SN40L inference cluster containing 16 RDUs, supporting AuroraGPT development and open-science access through the NAIRR Pilot. Oak Ridge National Laboratory (ORNL) selected SambaNova Suite with SN40L and Composition of Experts (CoE) in November 2024 for parallel scientific inferencing across its AI for Science portfolio, leveraging energy savings versus the Frontier supercomputer. Texas Advanced Computing Center (UT Austin, NSF-funded) deployed SambaNova Suite in November 2024 as its dedicated inference platform for scientific models trained on Frontera; TACC is also home to the upcoming NSF Leadership-Class Computing Facility (LCCF) linked to NAIRR. RIKEN Center for Computational Science (Japan) adopted SambaNova DataScale and integrated Fugaku-LLM into SambaNova's Samba-1 CoE platform in 2024. Carahsoft has listed SambaNova on federal, state, and local government contracts to facilitate agency procurement. Procurely data shows 3 state-level awards totaling approximately $2.5 million in recorded value, likely underrepresenting total government revenue given direct lab-level procurement channels.
    claimRefs:
