  topStrengths:
    - >-
      SambaNova owns a differentiated full-stack inference platform: proprietary RDU silicon, SambaFlow software, and
      cloud/on-prem deployment modes that target agentic and sovereign AI workloads.
    - >-
      The company has real reference traction in national labs and sovereign infrastructure, including Argonne, LLNL,
      LANL, and SoftBank-backed SN50 deployment in Japan.
    - >-
      Commercial momentum improved materially into 2025-2026, with ARR estimated to have reached roughly $100M in
      mid-2025 and more than $180M by the February 2026 financing.
  topRisks:
    - >-
      Nvidia's hardware-software moat and CUDA lock-in remain the central strategic threat, and independent
      production-scale proof of SambaNova's benchmark claims is still limited.
    - >-
      Publicly named customers remain concentrated in DOE, NNSA, and other government or academic institutions, while
      disclosed commercial Fortune 500 hardware customers are sparse.
    - >-
      Capital efficiency is weak relative to peers: about $1.49B of capital has produced a supportable implied valuation
      near $2.34B, and the February 2026 price remains far below the 2021 peak.
  unresolvedGaps:
    - Audited 2025-2026 revenue, gross margin, EBITDA, and cash figures are still unavailable.
    - >-
      Public evidence does not cleanly resolve whether the economically correct February 2026 post-money valuation is
      the E-1 implied ~$2.34B, the blended round value, or the third-party ~$4.8B figure.
    - Customer concentration by revenue, government share, and renewal durability are not publicly disclosed.
    - Net revenue retention, cloud-vs-hardware mix, and preference-stack terms remain opaque.
