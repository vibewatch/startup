  - id: software-stack-and-cloud
    title: "Software Stack, SambaCloud, and Deployment Modes"
    body: >
      SambaNova's software layer—SambaFlow—is a compiler-driven stack that maps neural network
      computation graphs directly onto RDU hardware through spatial programming and operator
      fusion. Rather than scheduling individual GPU kernels, SambaFlow generates dataflow patterns
      tailored to each layer's memory access requirements, achieving high hardware utilization by
      keeping data in flight through fused operations. SambaFlow supports Red Hat Enterprise Linux
      and Ubuntu, and exposes a Python SDK and REST API compatible with the OpenAI client
      interface.

      Three product tiers address distinct buyer segments. SambaStack is the on-premises full-stack
      platform: SambaRack hardware plus SambaFlow software plus pre-loaded model bundles, delivered
      with 90-day deployment commitments and integrated model hot-swapping at inference time.
      SambaManaged is a turnkey managed service where SambaNova operates the hardware—either in
      the customer's data center or a partner facility—and is available via AWS Marketplace.
      SambaCloud is the public API at cloud.sambanova.ai, fully OpenAI-API-compatible, with no
      credit card required for signup and $5 in free credits for new accounts. The API supports
      streaming (SSE), function calling, JSON mode, and audio transcription (Whisper-Large-v3).
      SambaCloud's model catalog as of May 2026 is selective: approximately 10 models including
      DeepSeek V3.1 (131K context), DeepSeek V3.2, Llama 4 Maverick, Llama 3.3 70B, MiniMax M2.7,
      and gpt-oss-120b in high and low tiers. Fine-tuning is not offered as a public cloud
      product.

      The Accenture partnership (signed 2023) targets regulated enterprise buyers requiring model
      ownership, data governance, and the ability to export model weights—use cases where GPU-cloud
      providers typically do not guarantee data sovereignty. Sovereign AI deployments in Japan
      (SoftBank/SambaCloud APAC), Australia (SouthernCrossAI), Germany (Infercom), and the UK
      (Argyll) demonstrate the on-premises product in production. The Argonne National Laboratory
      ALCF AI Testbed—which includes both a legacy SN30 training cluster and a newer SN40L
      inference cluster of 16 RDUs—makes the system available to the scientific research community
      under the NAIRR Pilot. TEPCO Systems (Japan) has selected SambaNova for inclusion in Japan's
      NEDO Post-5G R&D project (April 2026).
