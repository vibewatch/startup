callouts:
  - calloutType: "strength"
    title: "Best-in-Class Inference Speed on Large Models"
    body: >
      SambaNova's three-tier memory architecture is structurally well-suited to inference at 70B–671B
      parameter scale where GPU memory bandwidth becomes the bottleneck. Independent Artificial Analysis
      benchmarks confirm 132 t/s on Llama 3.1 405B at full 16-bit precision—the fastest on record at
      SambaCloud's September 2024 launch—and SambaNova is currently the only cloud provider offering
      DeepSeek R1 671B at full precision at production speed. This is a defensible technical advantage
      rooted in architecture, not just optimization.
    claimRefs:
      - CE022
      - CE024
      - CE027

  - calloutType: "risk"
    title: "Vendor-Controlled Benchmarks and Narrow Product Surface"
    body: >
      All published SN50 performance figures cite SemiAnalysis InferenceX (a vendor-engaged firm)
      rather than open-methodology benchmarks. SambaCloud's ~10-model catalog, absence of fine-tuning,
      and context window ceilings on large models are structural product gaps that reduce its
      addressable developer market relative to GPU-cloud competitors. Buyers should require
      independent hardware benchmarks and detailed SLA/compliance documentation before
      committing to large-scale inference contracts.
    claimRefs:
      - CE029
      - CE037
      - CE040

  - calloutType: "insight"
    title: "Air-Cooled Rack as Sovereign AI Enabler"
    body: >
      The SambaRack's 10–20 kW air-cooled form factor—operating in standard data center
      thermal and power envelopes—differentiates SambaNova from liquid-cooled GPU alternatives
      (DGX H100/H200 systems require 10–30 kW of liquid cooling infrastructure per system)
      in the sovereign AI market. Sovereign deployments in Japan, Germany, Australia, and the UK
      (and the upcoming SN50 deployment at SoftBank) validate this as a real procurement driver,
      not marketing.
    claimRefs:
      - CE010
      - CE021
      - CE036

