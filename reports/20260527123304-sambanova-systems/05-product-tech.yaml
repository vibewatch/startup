chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    SambaNova delivers a vertically integrated AI inference stack built on its proprietary
    Reconfigurable Dataflow Unit (RDU) architecture. The fourth-generation SN40L chip (three-tier
    SRAM/HBM/DDR memory) achieves 132 tokens/sec on Llama 3.1 405B at full 16-bit precision,
    outperforming GPU-based inference providers on large-model workloads. The fifth-generation SN50,
    announced February 2026, claims 5× compute improvement and 895 tokens/sec on Llama 3.3 70B;
    it targets H2 2026 shipping with SoftBank as the first customer. A narrow cloud model catalog
    (~10 models), no public fine-tuning API, and vendor-controlled benchmark methodology are
    material product gaps that buyers must verify independently.

sections:
  - id: rdu-hardware-platform
    title: "RDU Hardware Platform and Chip Architecture"
    body: >
      SambaNova's hardware foundation is the Reconfigurable Dataflow Unit (RDU), a purpose-built
      AI inference accelerator that replaces the instruction-set architecture (ISA) used by GPUs
      with a dataflow execution model. Instead of launching sequential GPU kernels that repeatedly
      load weights from external memory, the RDU configures a continuous processing pipeline
      aligned with the model's computational graph, reducing data movement and enabling operator
      fusion across entire transformer decoder layers in a single pass.

      The fourth-generation SN40L chip—announced 2023 and published at IEEE MICRO 2024—implements
      a three-tier memory hierarchy: 520 MB on-chip SRAM for immediate computation, HBM (64 GB per
      chip in the SN40L-16 configuration) for active model weights, and DDR DRAM (768 GB per chip)
      for capacity-tier storage that holds hundreds of models simultaneously. This architecture
      allows a 16-chip SambaRack to address roughly 12 TB of total DRAM plus 1 TB HBM, enabling
      trillion-parameter models—including Llama 3.1 405B and DeepSeek R1 671B at full 16-bit
      precision—without quantization. The IEEE Micro paper measuring Composition of Experts (CoE)
      workloads found that an eight-socket SN40L node achieves a 3.7× end-to-end speedup over a
      DGX H100 and a 6.6× speedup over a DGX A100, with model switching 15–31× faster than GPU
      baselines.

      The fifth-generation SN50, introduced February 2026, delivers five times the compute per
      accelerator and four times more network bandwidth than the SN40L. It supports up to 256
      interconnected accelerators over a multi-terabyte-per-second fabric, enabling models up to
      10 trillion parameters with up to 10 million token context lengths. The SambaRack SN50
      packs 16 chips per rack at 20 kW, is fully air-cooled, and does not require liquid-cooling
      infrastructure—a significant operational advantage for existing data centers. SoftBank Corp.
      is the first confirmed SN50 customer, targeting deployment in Japanese AI data centers in
      H2 2026. Intel, which has taken a strategic investment as part of the Series E, is
      co-developing a heterogeneous inference blueprint in which Intel GPUs handle the prefill
      (prompt processing) phase and SambaNova RDUs handle the decode (token generation) phase.
