  - id: roadmap-gaps-risks
    title: "Technology Roadmap, Product Gaps, and Strategic Risks"
    body: >
      SambaNova's product roadmap centers on three near-term deliverables: full SN50 hardware
      production and customer shipments (H2 2026), Intel-SambaNova heterogeneous inference
      clusters targeting enterprise and sovereign deployments (H2 2026), and expanded SambaCloud
      capacity on SN50 silicon. The Intel collaboration announced April 2026 specifies that
      Xeon 6 processors will serve as both the host CPU and the "action CPU" for agentic tool
      execution and code compilation, while Intel GPUs handle prefill and SambaNova RDUs handle
      decode—a three-way heterogeneous architecture that has no production deployments yet as of
      the run date.

      Material product gaps identified from independent review include: (1) No public fine-tuning
      API—customers requiring custom model adaptation must use a GPU cloud for fine-tuning and
      then switch to SambaNova for inference, introducing pipeline friction and multi-vendor
      dependency. (2) Narrow model catalog breadth (~10 models versus 50–200 at GPU competitors),
      with no image, video, or text-to-speech generation. (3) Context window ceilings: the
      standard DeepSeek V3.1 offering is limited to 131K input context with 7K completion tokens;
      the extended-context variant (DeepSeek V3.1-cb) has 32K completion tokens but only 32K
      input context, constraining long-document and agentic use cases. (4) SN50 production
      hardware is not yet fully commercially available at the run date. (5) No public compliance
      certifications (SOC 2, FedRAMP, ISO 27001) are listed on the SambaNova website; security
      posture relies on customer-facing controls (data-not-logged policy, on-premises deployment
      options) rather than third-party attestations.

      Strategic risks include: (a) SambaNova's enterprise-focus sales model involves long
      procurement and security review cycles, which limits scalability relative to GPU clouds
      and developer-friendly API competitors; (b) benchmark claims for both SN40L and SN50 are
      predominantly vendor-controlled, and independent third-party validation remains limited;
      (c) Nvidia's continued improvement in memory bandwidth (Blackwell B200: 192 GB HBM3e,
      8 TB/s bandwidth) may narrow the inference latency gap as GPU software batching improves;
      (d) the Intel collaboration creates a dependency on Intel supply chain and sales execution
      for a significant portion of the enterprise go-to-market.
