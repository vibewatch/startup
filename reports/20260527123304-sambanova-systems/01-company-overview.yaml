callouts:
  - calloutType: strength
    title: Differentiated RDU Architecture With Multi-Gen Track Record
    body: >
      SambaNova's Reconfigurable Dataflow Unit architecture is a purpose-built AI inference chip
      platform with five generations of silicon (SN10 through SN50) and a distinctive three-tier
      memory hierarchy (HBM + DDR5 + SRAM) that enables up to 256 chips in a single memory space
      and approximately 90% HBM bandwidth utilization—substantially above typical GPU figures.
      The SN50, announced February 2026, delivers 2.5× more FP16 compute than the prior SN40L,
      supports FP8/FP4 precision, and offers 5× the speed of competitive chips per SambaNova claims.
      This technical differentiation is the foundation of the company's enterprise inference value
      proposition.
    claimRefs:
      - CO010
      - CO012
      - CO013
      - CO039
      - CO040

  - calloutType: risk
    title: Governance Conflict – Intel CEO as Executive Chairman
    body: >
      Lip-Bu Tan serves simultaneously as Intel's CEO and SambaNova's Executive Chairman, creating
      a persistent governance conflict. While Tan recused himself from the 2025 Intel acquisition
      discussions, the arrangement means SambaNova's board chair is the head of its most strategic
      corporate partner and an earlier potential acquirer. Post-Series E, with a multi-year Intel
      collaboration in place, this conflict remains unresolved and could constrain SambaNova's
      strategic flexibility, particularly if competitive dynamics shift between the two companies.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO036

  - calloutType: risk
    title: Valuation Decline and History of Financial Stress
    body: >
      SambaNova's implied valuation has declined materially since its $5.1 billion Series D peak in
      2021. BlackRock marked down its stake by ~17% (implying ~$2.4B), the company explored a sale
      in 2024–2025, and the Intel acquisition was reportedly priced at ~$1.6 billion—a 69% discount
      from the 2021 peak. The February 2026 Series E was completed without a disclosed valuation.
      These signals indicate significant burn through the 2021–2025 period without corresponding
      revenue scale, and raise questions about the runway and long-term capital efficiency that later
      chapters should address.
    claimRefs:
      - CO019
      - CO023
      - CO027
      - CO028
      - CO029
      - CO031

