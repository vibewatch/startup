  - id: leadership-founders-governance
    title: Leadership, Founders & Governance
    body: >
      SambaNova was co-founded by three individuals whose complementary backgrounds—academic AI
      research and industry chip execution—represent strong founder-market fit for an AI systems
      company. Rodrigo Liang, the CEO, previously served as Senior Vice President at Oracle (formerly Sun
      Microsystems), where he led a team of approximately 1,000 chip designers across 12 major processor
      generations. Kunle Olukotun, the CTO, is a Professor of Electrical Engineering and Computer Science
      at Stanford University, renowned for pioneering multicore processor design with the Niagara chip.
      Christopher Ré, the third co-founder, is an Associate Professor of Computer Science at Stanford and
      a machine learning systems expert; he also co-founded Snorkel AI. A governance concern is the role
      of Lip-Bu Tan, Intel's CEO, who has served as SambaNova's Executive Chairman since the company's
      founding in 2017. Tan's venture firm, Walden International, led the Series A. Intel Capital is also
      an investor. This interlocking governance arrangement raised significant conflict-of-interest
      questions in late 2025 when Intel entered acquisition discussions with SambaNova. Tan recused
      himself from those deliberations, with Intel's data center chief Kevork Kechichian acting as
      executive sponsor. Key-person risk is high: both Liang (product and strategy) and Olukotun
      (technology roadmap) carry deep institutional knowledge with limited documented succession
      planning in public disclosures. Board composition beyond Lip-Bu Tan is not publicly detailed.
