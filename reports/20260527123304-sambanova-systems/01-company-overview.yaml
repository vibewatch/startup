company:
  name: SambaNova Systems

chapter:
  number: 1
  title: Company Overview
  summary: >
    SambaNova Systems is a Palo Alto, California AI chip and systems company founded in 2017 by Stanford
    professors Kunle Olukotun and Christopher Ré alongside former Oracle SVP Rodrigo Liang. The company
    designs Reconfigurable Dataflow Unit (RDU) chips, full-stack enterprise AI platforms, and a cloud
    inference service, and has raised approximately $1.49 billion in total capital—most recently a $350
    million Series E in February 2026 led by Vista Equity Partners—after navigating a 2025 workforce
    reduction and stalled Intel acquisition talks that tested both its independence and valuation.

sections:
  - id: identity-founding-business-model
    title: Identity, Headquarters & Business Model
    body: >
      SambaNova Systems, Inc. is a private AI chip and full-stack systems company headquartered in Palo
      Alto, California. It was founded in 2017 by three Stanford-affiliated technologists—Rodrigo Liang
      (CEO), Kunle Olukotun (CTO), and Christopher Ré—who set out to build a purpose-built AI processor
      architecture that could outperform general-purpose GPUs on modern AI workloads, particularly
      large-language-model inference. The company's core hardware is the Reconfigurable Dataflow Unit
      (RDU), a proprietary chip that executes AI workloads using a dataflow architecture, minimizing
      expensive memory movement and enabling multi-model serving at scale. Product lines include
      SambaRack (hardware rack systems), SambaNova Cloud (a cloud inference API offering token-level
      access to open-source LLMs), and SambaStack (the full-stack on-premises or hybrid AI platform).
      SambaNova targets enterprise and government customers—financial services, telecommunications,
      energy, healthcare, and sovereign AI programs—who require private, low-latency AI inference without
      relying solely on GPU-centric cloud providers. The company's business model spans hardware sales,
      subscription cloud services, and professional services. As of the February 2026 Series E close,
      SambaNova reported record bookings and revenue for 2025, though no specific revenue figures have
      been disclosed publicly.
