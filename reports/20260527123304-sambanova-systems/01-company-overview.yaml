  - id: funding-investors-capital
    title: Funding History, Investors & Capital Structure
    body: >
      SambaNova has raised approximately $1.49–$1.5 billion in total capital across five identified
      financing rounds since its founding. The first external capital came in March 2018 when GV (Google
      Ventures) and Walden International co-led a $56 million Series A—GV's first-ever investment in an
      AI chip startup. In 2020, a follow-on round of approximately $250 million from BlackRock, Intel
      Capital, and GV pushed the implied valuation to roughly $2.5 billion. The peak came in April 2021
      when SoftBank Vision Fund 2 led a $676 million Series D at a $5.1 billion post-money valuation,
      joined by Temasek, GIC, and existing investors. SambaNova did not raise again until February 2026,
      when it closed a $350 million Series E led by Vista Equity Partners and Cambium Capital, with
      additional participation from Intel Capital, Qatar Investment Authority (QIA), GV, Battery
      Ventures, T. Rowe Price Associates, Seligman Ventures, Assam Ventures, and sovereign wealth
      from Saudi Arabia. No post-money valuation was disclosed for the Series E; multiple reports indicate
      it is below the $5.1 billion Series D peak. BlackRock had already marked down its SambaNova
      holdings by approximately 17% by 2024–2025, implying a valuation of roughly $2.4 billion. CEO
      Rodrigo Liang described the Series E as "grossly, grossly oversubscribed," signalling strong
      investor interest despite the valuation uncertainty. No revenue figures, debt facilities, or
      secondary transactions have been publicly disclosed.
