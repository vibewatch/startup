  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: >
        Post-money valuation for the February 2026 Series E round; SambaNova declined to disclose
        and no credible secondary sources have confirmed the figure.
      whyItMatters: >
        Without a disclosed Series E valuation, it is impossible to assess whether the company has
        recovered from the ~$2.4B implied trough or whether the recapitalization priced the company
        fairly. This gap affects valuation stance and investment return analysis.
      diligencePath: >
        Request valuation disclosure from the company directly; reference cap table or secondary
        market data from PitchBook, Forge Global, or Caplight; cross-reference with comparable
        Series E AI chip company valuations in the same vintage.
      relatedQuestionRefs:
        - QO008

    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >
        SambaNova's revenue, ARR, gross margin, and burn rate are entirely private; the company
        cited "record bookings and revenue" for 2025 in the Series E press release without figures.
      whyItMatters: >
        Revenue scale determines whether the ~$1.49B in total capital is sustainable and whether
        the company is on a credible path to profitability. The absence of public financials is the
        primary information gap for this report.
      diligencePath: >
        Obtain audited or management financial statements through a commercial due diligence process;
        triangulate via enterprise customer win announcements, government contract registrations, or
        Bloomberg Second Measure / Thinknum data if available.
      relatedQuestionRefs:
        - QO024

    - type: missing-source
      severity: minor
      topic: headcount
      missingEvidence: >
        Current headcount in May 2026 after the Series E close and any post-round hiring ramp.
        The most recent figure is the pre-layoff ~500 (from April 2025); post-layoff is estimated
        ~400–425 but not confirmed, and post-Series E staffing plans are not disclosed.
      whyItMatters: >
        Headcount trajectory signals both operational momentum and cash burn rate assumptions.
        A post-Series E hiring ramp would confirm growth intent; a flat or declining count would
        suggest continued capital conservation.
      diligencePath: >
        Cross-reference LinkedIn headcount trend data; check SambaNova careers page for active role
        counts; request headcount confirmation from the company in a due diligence process.
