  - id: unit-economics-capital-adequacy
    title: Unit Economics and Capital Adequacy
    body: >-
      SambaNova's gross margin structure is not publicly disclosed. The company operates a
      hardware-software-services stack, where hardware margins are typically lower than pure
      software margins and capital-intensive manufacturing creates significant cost pressure.
      Peer AI chip companies and custom-silicon vendors generally operate at hardware gross
      margins in the 40–60% range before scaling, with software and cloud services commanding
      substantially higher gross margins. SambaNova's blended margin is estimated by analysts
      to be below 50%, weighted down by hardware components and manufacturing overhead.

      Capital intensity is high. SambaNova has deployed approximately $1.49B in total raised
      capital since 2017, against estimated cumulative revenue substantially below that figure.
      The $350M Series E was described as funding "expanded manufacturing and cloud capacity,"
      confirming continued capex obligations tied to chip production, datacentre infrastructure,
      and supply chain scale-up. Employee headcount was approximately 417 in late 2025, down
      from prior peak levels suggesting some cost discipline, but R&D and engineering spend
      remains material.

      Burn rate and cash position are not publicly disclosed. Based on Series E timing and
      management commentary about funding needs, independent analysts have estimated monthly
      burn in the $10–25M range. With $350M freshly raised and assuming similar burn levels,
      the company has an estimated runway of 14–35 months from the February 2026 close,
      though this depends heavily on revenue growth and capital deployment pace. Future
      financing dependency is expected: at current growth rates and capital deployment, a
      Series F or strategic partnership transaction is probable within the next 2–3 years.
