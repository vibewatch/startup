callouts:
  - calloutType: risk
    title: Valuation Discrepancy Is a Material Underwriting Risk
    body: >-
      SambaNova's official Series E post-money valuation is cited at $4.8B by Tracxn, while
      BlackRock's internal markdown implies $2.4B and secondary-market signals have been as
      low as $2.24B. This 2x gap between headline and implied values, combined with a near-sale
      process and five-year gap between primary rounds, creates significant uncertainty about
      true enterprise value. Any new investor entering at the headline valuation faces
      substantial dilution risk if the effective market value converges toward the markdown figure.
    claimRefs:
      - CI018
      - CI019
      - CI020
      - CI036

  - calloutType: risk
    title: High Capital Intensity With Undisclosed Burn Creates Financing Dependency
    body: >-
      SambaNova has raised $1.49B over nine years and remains pre-profitability by all
      available indicators. The Series E proceeds are earmarked for manufacturing and cloud
      infrastructure buildout — not operating profit — confirming continued high burn. Without
      audited financials, investors cannot verify runway assumptions. The company's history
      suggests a Series F or strategic exit will be required within 2–3 years.
    claimRefs:
      - CI027
      - CI028
      - CI029
      - CI030
      - CI037

  - calloutType: strength
    title: 4x ARR Growth in 2024 Validates Cloud Inference Pivot
    body: >-
      The reported fourfold ARR growth in 2024 following SambaNova's pivot toward cloud-based
      AI inference services — including the September 2024 launch of SambaNova Cloud — is
      the strongest positive financial signal in the public record. Combined with "record
      bookings" at end-2025 and SoftBank as the first SN50 deployment customer, the company
      appears to have found genuine product-market fit in the latency-sensitive inference
      market.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI013

