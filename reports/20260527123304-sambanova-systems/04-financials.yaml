company:
  name: SambaNova Systems
chapter:
  number: 4
  title: Financials
  summary: >-
    SambaNova's reported ARR reached approximately $100M in mid-2025 and surpassed $180M by
    February 2026, representing roughly 4x revenue growth in 2024. The company closed a $350M
    Series E in February 2026 led by Vista Equity Partners and Cambium Capital, bringing
    total raised to ~$1.49B. The official post-money valuation was cited at $4.8B, however
    BlackRock's 17% markdown implies an effective market value near $2.4B — a significant step
    down from the $5.1B Series D peak in 2021. Revenue model spans hardware sales, cloud API
    subscription, and professional services, with government and national-lab customers
    providing material but unquantified revenue contribution. Capital intensity is high,
    burn materially exceeds revenue, and gross margin, exact cash position, and revenue-mix
    breakdowns remain undisclosed private data.

sections:
  - id: revenue-model
    title: Revenue Model and Streams
    body: >-
      SambaNova generates revenue through three primary streams: hardware sales of its
      DataScale systems (powered by proprietary Reconfigurable Dataflow Units, or RDUs),
      cloud-based AI inference API subscriptions, and professional services including
      deployment, data preparation, and model optimization. The company pivoted materially
      toward cloud and inference services in 2024 after spending its earlier years focused
      on training workloads and hardware-led engagements.

      The cloud API product, SambaNova Cloud, launched in September 2024, offers token-based
      billing ranging from $0.10 to $4.50 per million tokens depending on model complexity.
      Three tiers exist: a free tier for experimentation, a developer pay-as-you-go tier for
      latency-critical workloads on open-weight models, and a custom enterprise tier for
      high-throughput production deployments with dedicated capacity, SLAs, and volume
      discounts. Enterprise and sovereign contracts for on-premise DataScale hardware
      deployments continue alongside the cloud offering, with professional services
      comprising an estimated 25–33% of new customer engagements according to Sacra's
      company analysis.

      Revenue recognition is complex: hardware deals generate upfront or milestone-based
      revenue while cloud API subscriptions generate recurring token-consumption revenue.
      The precise split between hardware, cloud, and services is not publicly disclosed.
      Government and national laboratory customers — including Lawrence Livermore, Los Alamos,
      Argonne, and Oak Ridge National Laboratories — are material contributors, though
      no segment breakdown is available.
