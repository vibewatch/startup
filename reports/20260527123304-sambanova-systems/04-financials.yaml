  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: >-
        Audited or investor-disclosed gross margin by revenue stream (hardware, cloud API,
        professional services) and blended gross margin with trend data.
      whyItMatters: >-
        Without gross margin, it is impossible to assess unit economics, path to profitability,
        or whether cloud ARR growth translates to margin improvement.
      diligencePath: >-
        Request audited P&L with full COGS breakdown and gross margin by segment in the
        data room under NDA.
      relatedQuestionRefs:
        - QI013

    - type: private-evidence-only
      severity: material
      topic: burn-rate
      missingEvidence: >-
        Actual monthly burn rate, cash on hand post-Series E, and 12-month cash flow
        statement showing operating vs. investing vs. financing cash flows.
      whyItMatters: >-
        Without verified burn and cash position, runway estimates are purely speculative
        and financing risk cannot be priced accurately.
      diligencePath: >-
        Request cash flow statements (trailing 12 months) and board-approved financial model
        including burn and runway projections in the data room.
      relatedQuestionRefs:
        - QI014

    - type: private-evidence-only
      severity: material
      topic: revenue-mix
      missingEvidence: >-
        Revenue breakdown by stream (hardware vs. cloud API vs. professional services)
        as a percentage and absolute figure for fiscal years 2023, 2024, and 2025.
      whyItMatters: >-
        Revenue mix determines revenue quality, growth durability, and gross margin
        trajectory. Cloud-heavy mix is positive; hardware-heavy mix creates lumpiness.
      diligencePath: >-
        Request revenue disaggregation in the data room; also verify ARR definition (is
        cloud ARR or total contract value?).
      relatedQuestionRefs:
        - QI021

    - type: missing-source
      severity: material
      topic: government-revenue-concentration
      missingEvidence: >-
        Government/sovereign contract revenue as a share of total revenue, top-10 customer
        concentration, and government contract renewal or extension terms.
      whyItMatters: >-
        High government concentration creates procurement-cycle risk and budget-dependency;
        without the share, customer concentration risk cannot be assessed.
      diligencePath: >-
        Search USAspending.gov for SambaNova contract awards; request customer concentration
        report and top-10 customer revenue table in the data room.
      relatedQuestionRefs:
        - QI012

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Customer acquisition cost (CAC), sales cycle length, net revenue retention (NRR),
        and LTV/CAC ratio by customer segment (enterprise, government, cloud developer).
      whyItMatters: >-
        Without CAC and NRR, it is impossible to model long-term unit economics or validate
        the scalability of the cloud pivot. CAC is especially important given long hardware
        sales cycles.
      diligencePath: >-
        Request sales efficiency metrics, cohort analysis, and CAC/NRR by segment in the
        data room.
      relatedQuestionRefs:
        - QI022

    - type: private-evidence-only
      severity: minor
      topic: gtm-efficiency
      missingEvidence: >-
        Detailed GTM metrics including sales cycle length, quota attainment, average
        contract value by segment, and channel mix (direct vs. partner vs. cloud marketplace).
      whyItMatters: >-
        GTM efficiency determines whether revenue growth is sustainable and whether
        the company's go-to-market can scale without proportional headcount growth.
      diligencePath: >-
        Request sales ops metrics in the data room; look for partner or marketplace
        announcements in public press for corroborating evidence.
      relatedQuestionRefs:
        - QI026

