              Accenture 在内的企业专业服务公司，以及 OTP Bank 等金融机构；（5）直接访问 SambaNova Cloud 推理端点的开发者 API 用户。国家实验室和研究型 HPC
              细分是证据最充分的客群，多份 DOE/NNSA 官方公告确认了生产级 DataScale 安装。渠道与主权 AI 细分自 2025 年中以来明显加速：2025 年 10 月有三项主权 AI
