      - - 智能体 / 多步推理工作流
        - GPU 推理延迟会在智能体多轮中叠加；1000-token 响应在 50 t/s 下需要 20 秒，而 1000 t/s 下为 1 秒
        - SambaCloud API 提供高速 token 生成；SN50 智能体缓存；多模型常驻内存
        - 70B 模型 461 t/s，使智能体循环延迟低于人类感知阈值；SN50 目标 895 t/s
        - 截至本报告日期，SN50 硬件尚未全面量产可用；智能体编排需要外部框架（LangChain、CrewAI）
      - - 主权 / 受监管 AI 部署
        - 数据不能离开本地或国家辖区；GPU 云 API 不足以满足 GDPR、ITAR 或国家 AI 要求
        - SambaStack 本地部署或 SambaManaged 受控设施；SambaCloud APAC 由 SoftBank 在日本托管
        - 完整模型所有权；模型权重可导出；风冷硬件可部署在既有数据中心
        - 无公开 SOC 2 / FedRAMP / ISO 27001 认证；合规证明必须通过直接审计取得
      - - 科学研究 / 大规模仿真
        - HPC 中心需要在科学工作流中快速推理大型基础模型（气候、药物发现、聚变）
        - ALCF AI Testbed 上的 SambaNova DataScale SN40L 推理集群；16 个 RDU 用于 AuroraGPT 微调和评估
        - 研究人员可快速评估和调整 AI 模型；模型可即时切换，而非 GPU 多分钟重载
        - 访问需要提交提案；ALCF AI Testbed 使用需排队并接受优先级安排
    notes: 除标注为 Artificial Analysis 独立数据的部分外，收益均来自供应商主张或供应商赞助基准。截至本报告日期，智能体工作流延迟改善和 SN50 主张的独立验证有限。
