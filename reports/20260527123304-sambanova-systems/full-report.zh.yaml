      - number: '4.5'
        title: 财务结论与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              SambaNova 的财务画像是一家高增长、深度资本密集的基础设施公司：收入动能为正，但信息长期不透明。收入质量有好有坏：云 API 收入具备经常性和可扩展性，硬件销售则波动大，依赖大型客户拿单。2024
              年年经常性收入（ARR）增长 4 倍、2025 年末据称“订单创纪录”都令人鼓舞；但公司始终没能长进 2021 年估值，且 2026 年 Series E 前一度接近困境出售，这些都让长期资本效率受到合理质疑。

              核心财务风险包括：（1）估值不确定性——$4.8B 官方投后估值与 BlackRock 的 $2.4B 标记差异极大，真实企业价值含混不清；（2）集中度风险——SoftBank 是首个 SN50
              客户，政府实验室也是已确认参考账户，说明客户集中度不可忽视；（3）资本强度——芯片制造、云建设和 R&D 都需要持续的大额资本注入；（4）竞争性定价压力——低至 $0.10/M tokens
              的价格暗示云推理存在商品化风险。

              完整投资判断所需但目前缺失的关键数据包括：经审计毛利率和 EBITDA、单元层面的经济模型（获客成本（CAC）、回本周期、净留存率（NRR））、分业务收入结构、政府合同占比与续约条款，以及 Series E
              后的实际现金余额。在这些数据进入资料室之前，财务建模只能依赖第三方估计，置信区间很宽。
