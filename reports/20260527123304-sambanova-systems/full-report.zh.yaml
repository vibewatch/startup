  - id: TV005
    title: 逻辑破裂与止损标准
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - SN50 量产延误
        - 按原计划，SN50 到 2026 年 Q4 仍未批量出货
        - 乐观情景收入爬坡落空；Intel 合作价值缩水；与 Cerebras 的差距进一步扩大
        - 降低仓位；若延误超过 6 个月，重新评估
      - - ARR 增长停滞
        - 2026 年 ARR 同比增长低于 30%（即 2026 年底 ARR < $240M）
        - 基准情景转为悲观情景；增长放缓压缩倍数；流动性风险上升
        - 退出或大幅降低敞口
      - - 新股与老股价差扩大
        - Forge 老股价格跌破 $10/股（隐含 ~$0.75B）
        - 市场开始计入悲观情景；优先股分配瀑布不足以覆盖 E-1 持有人
        - 立即升级尽调；若可行，考虑老股退出
      - - 治理反向事件
        - Lip-Bu Tan 卸任 Intel CEO 或 SambaNova 董事长；SambaNova-Intel 交易遭遇法律挑战
        - Intel 合作面临风险；战略融资理由变弱；向其他投资人传递声誉信号
        - 暂停部署新资金；评估合作连续性
      - - 竞争替代
        - 主要超大规模云厂商或 Nvidia 在 12 个月内推出与 SN50 TCO 主张相当的推理产品
        - 核心产品差异化减弱；云 API 和企业销售的定价压力上升
        - 重新评估产品护城河；若可利用的成本差距收窄，将建议调至回避
    notes: 触发因素和阈值为指示性。监测需要访问私营公司报告，公开来源无法获得。投资人应将合同性信息权作为参与条件。
