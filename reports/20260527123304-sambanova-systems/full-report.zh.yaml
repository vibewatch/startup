      - number: '8.3'
        title: 收入倍数、资本结构与估值区间
        blocks:
          - type: paragraph
            body: >-
              SambaNova 的估值图景被三层重叠数据复杂化。第一，新股轮数据：Series E-1 每股 $30.99，意味着 ~$2.34B。第二，聚合器数据：包括 Tracxn 和 user-context
              在内的来源引用 $4.8B 投后估值；若按 2025 年中约 $100M ARR 计算，相当于约 48x EV/ARR，显著高于行业中位数，也与股价证据不一致。第三，老股市场数据：Forge 的 $1.44B
              估计（2026 年 5 月 26 日）在 $180M ARR 下意味着约 8x ARR，低于行业中位数，并反映执行风险折价。

              采用更可支撑的 E-1 新股价格 $2.34B：相对 2025 年中 $100M ARR，倍数约 23x；相对 2026 年初 $180M ARR，则降至约 13x。这个区间为一家有收入动能但持续不透明的高增长
              AI 基础设施公司圈定了公允价值。更保守的 $13x 反映 ARR 轨迹改善，也让 E-1 价格显得更可辩护，前提是 $180M 数字可审计。

              资本结构又增加了一层复杂性。2021 年 Series D（$677M，估值 $5.11B）形成的优先股堆叠，意味着在低于 $5.11B 的所有估值下，普通股和员工都深度价外。以每股 $30.99 进入的
              Series E 投资人（E-1）较 Series D 价格（$95.02）折价 67%，相对早期批次具有结构性优先优势。不过 E-2 每股 $21.70 暗示新投资人队列 的混合资本成本低于 E-1
              名义价，且可能存在反稀释保护或棘轮条款，进一步压缩早期投资人的有效回报。

              Lincoln Variable Insurance Products Trust 截至 2025 年 6 月 30 日的文件显示，其持有 SambaNova 股票的价格为每股 $44.47，比后续 E-1
              发行价高 43%；这表明从 2025 年中到 Series E 交割，机构盯市情绪已明显恶化。这与 2025 年末收购流程以及 Caplight/BlackRock 减记相一致。
