      - number: '8.5'
        title: 建议、立场与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              整体建议是继续研究，估值立场偏高。SambaNova 已经证明年经常性收入（ARR）增长势头强劲，拿下可信的战略伙伴 Intel， 并推出技术上有差异化的新一代芯片。但按 Series E-1
              价格（$30.99/share，隐含估值约 $2.34B）作出高置信投资判断， 证据还不完整：毛利率、净留存率（NRR）、经审计收入、优先股堆叠、SN50 量产爬坡仍未披露，或无法从公开来源核验。

              估值背景有多处不利。老股市场较 E-1 发行价折价 39% 定价。公司不得不按较 2021 年下降 54% 的估值融资，并曾探索困境出售， 价格再打 60% 折。聚合平台引用的 $4.8B
              仍与一手股价数据不一致；在 SambaNova 披露官方轮次文件前，应视为未核实。 来自 $5.11B Series D 的优先股堆叠形成压顶，会压低普通股回报，并限制员工留任激励。

              风险评级为高，主要来自资本密集度、Cerebras 和 Nvidia 的竞争压力、治理顾虑（Lip-Bu Tan 同时担任 Intel CEO 和 SambaNova
              董事长），以及新股轮与老股市场价格之间的缺口。置信度为中；私有公司不透明，经审计财务缺位，限制了判断。

              已在牌桌上的投资者（Series E 参与方）应优先尽调：经审计 ARR 构成和 NRR、SN50 生产时间表和已承诺订单、 优先清算瀑布分析，以及按收入流拆分的毛利率。若评估按 Forge 价格买入老股（约
              $1.44B，约 8x ARR）， 相对新股的折价给了更有吸引力的入口，部分补偿了不透明性，但流动性不足和治理风险仍在。
