  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              AI
              芯片和加速器市场涵盖为机器学习训练和推理工作负载设计的专用半导体，应用场景覆盖数据中心、云平台，并越来越多延伸到边缘部署。这个市场并非单一整体：分析机构对边界定义差异很大，给出的估计不可直接比较，解读时必须明确口径。

              最宽的定义来自 Deloitte 和 WSTS，包含所有针对 AI 优化的半导体，包括逻辑处理器、高带宽内存（HBM）和网络芯片，由此得到接近 $500B 的 2026 年估计。IDC
              对其“智能数据中心”分部采用较窄口径（CPU、AI 加速器、GPU、自定义 ASIC 和网络芯片），在 $477B 数据中心半导体总收入中，对该特定类别给出 $281B。最窄口径只看商用 AI 加速器芯片（GPU
              及对外销售的替代产品），SiliconAnalysts 采用这一口径，给出 $200B+。AllAboutAI 引用的 2024 年 $118B 数字，反映的是最窄的商用 GPU 与 AI
              芯片类别，不包含内存或网络。

              AI 训练工作负载对应周期性、算力密集的模型开发；AI 推理则是持续、生产级地向终端用户提供模型输出。到 2026 年，推理工作负载约占全球所有 AI 计算周期的三分之二，高于 2023
              年的三分之一，按量看已成为最主要的运营子板块。训练仍有较高单加速器支出（Nvidia H100 和 B200 在训练上领先），但采购事件发生频率更低。

              与 SambaNova 市场语境相邻或被纳入的支出类别包括：AI 云推理服务（SaaS 层）、AI 基础设施系统和机柜、企业本地 AI 部署，以及主权 / 政府 AI 算力计划。企业 AI
              推理的现状替代方案包括纯 CPU 推理、公有云 GPU 服务（AWS、Azure、GCP）以及既有本地 GPU 集群。
