chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              SambaNova Systems, Inc. 是一家总部位于加州 Palo Alto 的私营 AI 芯片和全栈系统公司。公司由三位 Stanford 背景技术专家 Rodrigo
              Liang（CEO）、Kunle Olukotun（CTO）和 Christopher Ré 于 2017 年创立，目标是打造一套专为 AI 设计的处理器架构，在现代 AI
              工作负载、尤其是大语言模型推理上跑赢通用 GPU。公司的核心硬件是 Reconfigurable Dataflow Unit（RDU），这是一款自研芯片，用数据流架构执行 AI
              工作负载，减少昂贵的内存搬运，并支持多模型大规模服务。产品线包括 SambaRack（硬件机柜系统）、SambaNova Cloud（以 token 级访问开源 LLM 的云推理 API）和
              SambaStack（本地或混合部署的全栈 AI 平台）。SambaNova 面向企业和政府客户——金融服务、电信、能源、医疗以及主权 AI 计划——这些客户需要私有、低延迟的 AI 推理，不能只依赖以 GPU
              为中心的云厂商。公司的商业模式覆盖硬件销售、订阅式云服务和专业服务。截至 2026 年 2 月 E 轮完成，SambaNova 称 2025 年订单额和收入创纪录，但尚未公开披露具体收入数字。
