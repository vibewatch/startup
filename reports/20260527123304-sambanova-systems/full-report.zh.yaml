              将用于“扩大制造和云容量”，确认芯片生产、数据中心基础设施和供应链扩张仍绑定持续资本开支。2025 年末员工数约为 417，低于此前峰值，显示出一定成本纪律，但 R&D 和工程投入仍然可观。

