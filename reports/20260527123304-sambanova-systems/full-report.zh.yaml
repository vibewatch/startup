      - number: '5.2'
        title: 软件栈、SambaCloud 与部署模式
        blocks:
          - type: paragraph
            body: >
              SambaNova 的软件层 SambaFlow 是一个编译器驱动的技术栈，借助空间编程和算子融合，把神经网络计算图直接映射到 RDU 硬件上。它不是调度单个 GPU
              kernel，而是按每一层的内存访问需求生成数据流模式，通过融合操作让数据持续在途，从而拉高硬件利用率。SambaFlow 支持 Red Hat Enterprise Linux 和 Ubuntu，并暴露与
              OpenAI 客户端接口兼容的 Python SDK 和 REST API。

              三个产品层级面向不同买家。SambaStack 是本地部署的全栈平台：SambaRack 硬件、SambaFlow 软件和预加载模型包打包交付，承诺 90
              天部署，并在推理时集成模型热切换。SambaManaged 是交钥匙托管服务，由 SambaNova 运营硬件，地点可以在客户数据中心，也可以在合作伙伴设施，并可通过 AWS Marketplace
              获取。SambaCloud 是 cloud.sambanova.ai 上的公共 API，完全兼容 OpenAI API；注册无需信用卡，新账户获得 $5 免费额度。该 API
              支持流式传输（SSE）、函数调用、JSON mode 和音频转写（Whisper-Large-v3）。截至 2026 年 5 月，SambaCloud 的模型目录较为精选：约 10 个模型，包括 DeepSeek
              V3.1（131K 上下文）、DeepSeek V3.2、Llama 4 Maverick、Llama 3.3 70B、MiniMax M2.7，以及高、低两个档位的
              gpt-oss-120b。微调没有作为公共云产品提供。

              Accenture 合作伙伴关系签于 2023 年，目标客户是受监管企业买家：它们需要模型所有权、数据治理以及导出模型权重的能力，而 GPU
              云提供商通常无法保证这些用例所需的数据主权。日本（SoftBank/SambaCloud APAC）、澳大利亚（SouthernCrossAI）、德国（Infercom）和英国（Argyll）的主权 AI
              部署，证明本地部署产品已进入生产环境。Argonne National Laboratory ALCF AI Testbed 同时包含旧版 SN30 训练集群和更新的 16 个 RDU SN40L 推理集群，并在
              NAIRR Pilot 下向科学研究社区开放。TEPCO Systems（日本）已选择将 SambaNova 纳入日本 NEDO Post-5G R&D 项目（2026 年 4 月）。
