  - id: TE003
    title: 技术与运营架构表
    columns:
      - 层 / 组件
      - 角色
      - 关键依赖
      - 风险
    rows:
      - - SN40L / SN50 RDU 芯片
        - 核心计算与推理执行；基于数据流的算子融合
        - TSMC 代工（SN40L 为 5 nm；SN50 工艺节点未公开确认）
        - 代工集中在 TSMC；先进制程配额存在地缘政治风险
      - - 片上 SRAM（每颗 SN40L 芯片 520 MB）
        - 保存活跃权重以便即时计算；融合算子无需反复从 DDR/HBM 取数
        - 定制 SRAM 单元设计；与 RDU 微架构深度耦合
        - SRAM 密度限制片上层扩展；未来模型可能需要更大的 SRAM 预算
      - - HBM 层（每芯片 64 GB，SN40L-16 配置）
        - SRAM 与 DDR 之间的活跃模型权重缓冲；为运行中的层提供高带宽访问
        - HBM 供应来自 SK Hynix / Samsung / Micron；受全行业 HBM 需求约束
        - HBM 供应约束可能影响系统可用性；SambaNova 设计上每颗芯片用的 HBM 少于 H100
      - - DDR DRAM 层（每芯片 768 GB，SN40L-16）
        - 容量层可同时存放数百个模型；支持微秒级热切换到 HBM
        - 标准 DDR DRAM 供应；大宗商品市场，供应风险低于 HBM
        - 若模型未从 DDR 预取到 HBM，缓存未命中会拖慢性能；淘汰策略为专有
      - - SambaFlow 编译器
        - 将 PyTorch / 标准 ML 图编译为 RDU 数据流程序；算子融合；空间布局优化
        - MLIR 编译器基础设施；SambaNova 专有编译器 pass
        - 定制编译器造成供应商锁定；模型要从 SambaNova 硬件迁移到 GPU，需要重新编译或回退
      - - SambaCloud API 基础设施
        - 兼容 OpenAI 的 API 网关；限速、认证、模型路由、流式输出
        - 第三方托管（APAC 由 SoftBank 托管；美国 / 欧盟使用托管伙伴）
        - API 中断与合作伙伴数据中心可靠性绑定；免费 / 开发者层无公开 SLA
    notes: 公开文档未确认 SN50 的 TSMC 工艺节点。每芯片 HBM 数字基于 Weicloud 数据表中的 SN40L-16 配置；SN50 HBM 配置未公开说明。SambaFlow 编译器细节为专有。
