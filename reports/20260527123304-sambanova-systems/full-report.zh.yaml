      - number: '3.5'
        title: 竞争定位、护城河分析与反向证据
        blocks:
          - type: paragraph
            body: >-
              SambaNova 可防守的竞争优势建立在三根支柱上：（1）RDU 的三层内存架构（SRAM + HBM +
              DRAM），可让多个大模型常驻，并实现近零模型切换延迟，这一属性对智能体工作流很关键；（2）芯片、系统、软件和服务的全栈集成，降低主权 AI 计划的部署摩擦；（3）2026 年 4 月与 Intel
              发布的异构推理蓝图（GPU 负责 prefill、SambaNova RDU 负责 decode、Xeon 6 CPU 负责智能体工具执行），专为部署在既有风冷数据中心而设计，避开纯 GPU scale-out
              需要的液冷基础设施门槛。主权 AI 部署（Argonne DOE、SoftBank Japan、SCX Australia、Infecom Germany、Argyll
              UK）带来机构锚定客户，其多年采购周期提供一定收入可见性。反向证据同样重要。2025 年 10 月，The Information 报道称，SambaNova 在未能完成新融资后探索出售；公司 2021 年 D
              轮最后估值为 $5 billion，无法以或高于该估值融资，说明投资人怀疑其流动性路径或独立规模化能力。相较 NVIDIA 以及 AMD 不断改善的 ROCm 栈，SambaNova 的 CUDA
              等价软件生态仍处早期，给已有 GPU 工作流的企业买方带来集成风险。NVIDIA B200 性能改进部分弥合了过去支撑购买 RDU 硬件的吞吐差距。vLLM、SGLang 等开源推理运行时抽象硬件，也降低了
              SambaNova 软件栈在中间件层面的可防守性。云推理层多归属程度很高——SambaCloud 买方只需改一行代码就能切到 Groq 或 Cerebras API——因此云 API
              留存依赖持续的性能领先和定价，而非平台锁定。
