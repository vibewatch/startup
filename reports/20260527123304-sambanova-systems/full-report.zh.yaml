  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              SambaNova 所处的 AI 基础设施市场快速演化：训练时代“以 NVIDIA GPU 作为通用平台”的主导叙事，正在让位于更碎片化的推理时代格局。到 2026
              年，至少三种架构押注在竞争推理工作负载：晶圆级单体芯片（Cerebras WSE-3）、流式语言处理单元（Groq LPU，现已纳入 NVIDIA 体系）以及带分层内存的可重构数据流单元（SambaNova
              RDU）。与此同时，由 NVIDIA Blackwell（B200）和 AMD MI300X 领衔的既有 GPU 平台，已经在许多生产推理工作负载上缩小性能差距。云端超大规模厂商——AWS Trainium3 和
              Google Cloud TPU Ironwood——提供自用推理基础设施，按 token 成本显著更低，但要求深度绑定云。第四层是推理即服务平台（Together AI、Lambda
              Labs、Anyscale），它们运行在 GPU 集群上，并在 API 层与 SambaCloud 竞争。2026 年，买方的主要决策标准是单用户推理吞吐量、智能体工作负载的首 token
              延迟、总拥有成本、部署模式（云 vs. 本地）、数据主权要求和软件生态广度。SambaNova 在部署模式和主权两条轴线上位置较好，但相较 NVIDIA
              以及两家近期资本实力增强的纯推理对手，生态广度和品牌认知压力很大。
