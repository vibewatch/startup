              CEE 区域语言的 GPT-3 级语言模型。Saudi Aramco 与 SambaNova 签署谅解备忘录，探索与 Vision 2030 对齐的 AI 能力和基础设施部署。三项主权 AI
              云合作——SCX（澳大利亚）、Argyll（英国）和 Infercom（德国）——于 2025 年 10 月宣布，建立由 SambaNova 驱动的推理云，运行在每机架 10 kW、使用可再生能源的 SN40L
