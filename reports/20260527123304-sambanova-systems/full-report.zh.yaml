  - id: FE001
    title: SambaNova 全栈产品架构
    type: stack
    layout: standard
    summary: 从 RDU 硅片到已部署 AI 应用的五层架构，展示 SambaNova 垂直整合栈在每一层如何形成差异化。
    data:
      layers:
        - label: 芯片层
          detail: >-
            自研 RDU 硅片采用三级内存（SRAM + HBM + DDR）。SN40L（第 4 代，GA）和 SN50（第 5 代，2026 年 2 月发布，目标 2026 年 H2
            出货）实现可重构数据流架构（RDA），支持连续流水线执行。
          items:
            - SN40L RDU（第 4 代，520 MB SRAM/芯片，64 GB HBM/芯片，768 GB DDR/芯片，三级内存，TSMC 5nm）
            - SN50 RDU（第 5 代，算力较 SN40L 提升 5×，网络带宽提升 4×，256 芯片互连，10T+ 参数）
        - label: 系统层
          detail: SambaRack 每机架集成 16 颗 RDU 芯片，功耗 10–20 kW，仅用风冷。多机架集群通过每秒数 TB 级互连网络扩展到 256 个 SN50 加速器。不需要液冷基础设施。
          items:
            - SambaRack SN40L：16 芯片 / 机架，10 kW，400/200 GbE 网络，风冷
            - SambaRack SN50：16 芯片 / 机架，20 kW，风冷，目标 2026 年 H2 GA
        - label: 编译器 / 运行时层
          detail: SambaFlow 借助空间编程和算子融合，将 PyTorch 图编译为 RDU 数据流程序，消除 GPU kernel 调度开销。DDR 层模型调度器支持微秒级模型热切换。
          items:
            - SambaFlow 编译器：基于 MLIR、算子融合、空间布局、PyTorch 前端
            - 模型热切换调度器：通过 DDR 层在驻留模型之间微秒级切换
        - label: 平台层
          detail: 三个商业层级共用同一套硬件和 SambaFlow 软件。SambaStack 面向本地数据驻留要求；SambaManaged 加上交钥匙运营；SambaCloud 是开发者可访问的公共 API。
          items:
            - SambaStack：本地部署全栈（SambaRack + SambaFlow + 模型包），90 天部署 SLA
            - SambaManaged：SambaNova 运营的服务，可通过 AWS Marketplace 获取
            - SambaCloud：cloud.sambanova.ai 上的公共 OpenAI 兼容 API，免费层 + Developer + Enterprise
        - label: 应用 / 模型层
          detail: >-
            截至 2026 年 5 月，SambaCloud 托管约 10 个模型，全部采用完整 16-bit 精度。开发者接口包括 LangChain、LlamaIndex 和约 50 个集成。SambaLingo
            多语言模型检查点在 HuggingFace 上。
          items:
            - 模型：Llama 3.1/3.3/4、DeepSeek V3.1/V3.2/R1、MiniMax M2.5/M2.7、gpt-oss-120b、Gemma 3
            - 集成：LangChain（langchain-sambanova）、LlamaIndex、CrewAI、AutoGen、OpenRouter、n8n，总计约 50 个
            - 开发者工具：ai-starter-kit（GitHub）、sambanova SDK（PyPI）、32 个模型检查点（HuggingFace）
    approximationNotes: SN50 在芯片层的规格来自供应商公告；仍待生产出货后独立确认。SambaCloud 模型目录截至 2026 年 5 月，且频繁变化。
    claimRefs:
      - CE001
      - CE003
      - CE007
      - CE012
      - CE034
