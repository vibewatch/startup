            title: 估值下滑与财务压力历史
            body: >
              自 2021 年 $5.1 billion D 轮高点以来，SambaNova 隐含估值已大幅下行。BlackRock 将其持仓下调约 ~17%（指向约 ~$2.4B），公司在 2024–2025
              年探索出售，据报道 Intel 收购报价约 ~$1.6 billion——较 2021 年高点折价 69%。2026 年 2 月 E 轮完成时未披露估值。这些信号说明，公司在 2021–2025
              年间消耗了大量资本，却没有匹配的收入规模；后续章节需要回答现金跑道和长期资本效率问题。
