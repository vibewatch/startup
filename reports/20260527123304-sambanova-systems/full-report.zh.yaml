      - number: '3.3'
        title: 既有 GPU 平台——NVIDIA、AMD 与 Intel Gaudi
        blocks:
          - type: paragraph
            body: >-
              NVIDIA 仍占据 AI 基础设施主导地位：CUDA 开发者生态（数百万级库、工具和预训练集成）仍是市场里最高的切换成本。搭载 Blackwell B200 GPU 的 DGX 平台，在 FP4 工作负载上相较
              H100 最高可提供 4x 推理吞吐量，每颗 GPU 配 192 GB HBM3e 和约 3.35 TB/s 带宽。NVIDIA 通过 DGX 平台服务全球前 10 大电信运营商中的 8 家、7 家全球药企、10
              家全球车企和 9 家美国政府机构，形成深厚分销嵌入。B200 已经消除了纯推理芯片在许多主流 LLM 工作负载上曾经拥有的性能溢价；Rubin 架构（纳入 Groq LPU 元素）预计将在 2026–2027
              年进一步缩小差距。AMD Instinct MI300X 是最强的 GPU 替代方案：192 GB HBM3 内存（5.3 TB/s 带宽）可在不分片的情况下运行 70B+
              参数模型，以更低内存瓶颈实现高吞吐。AMD MI350 系列（CDNA 4 架构）将在 2026 年扩大这一优势。ROCm 软件兼容性持续改善，但第三方库覆盖仍落后于 CUDA。Intel Gaudi 3
              是成本最低的规模化选项：8 芯片系统含 Ethernet 网络约 $125K，而等效 DGX H100 节点为 $350K+。Gaudi 3 使用原生 Ethernet 互连（Ethernet-first，而非
              InfiniBand），更容易接入标准数据中心网络结构——这一属性与 SambaNova 本地部署模式相似。不过，Intel 数据中心业务组正承受重组压力，相较 GPU 既有厂商，Gaudi
              商业动能仍不确定。企业买方将 SambaNova 与 GPU 平台比较时，关键取舍是：NVIDIA 提供无可匹敌的软件生态和训练灵活性，但纯推理 TCO 更高；AMD 以有竞争力的价格提供大内存池；Intel
              Gaudi 前期成本最低，但生态最小。
