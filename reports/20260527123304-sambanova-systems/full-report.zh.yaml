      - number: '2.6'
        title: 关键证据
        blocks:
          - type: callout
            title: 推理才是市场，不是训练
            body: >
              到 2026 年，推理工作负载约占所有 AI 计算周期的三分之二，并占部署后 AI 系统全生命周期成本的 80–90%。AI 芯片市场正在从训练资本开支叙事，结构性转向推理运营叙事；增长最快的子板块——智能体
              AI——对延迟有要求，更偏好专用推理架构，而不是 GPU 吞吐机器。SambaNova 押注推理及其 SN50 架构，与这一结构性转向一致。
