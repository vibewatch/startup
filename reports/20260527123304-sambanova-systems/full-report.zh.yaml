  - id: FE003
    title: 关键依赖图
    type: dag
    layout: standard
    summary: SambaNova 在芯片供应、制造、云基础设施和软件生态上的关键外部依赖。
    data:
      nodes:
        - id: d1
          label: TSMC（5 nm 代工厂）
          detail: 代工 SN40L 芯片；先进制程代工集中在台湾，存在地缘政治集中风险
        - id: d2
          label: HBM 供应商（SK Hynix / Samsung / Micron）
          detail: 为 SN40L 封装内存供应高带宽内存；全行业供给受限
        - id: d3
          label: DDR DRAM 供应商
          detail: 容量层使用的通用 DRAM；供应风险低于 HBM
        - id: d4
          label: SN40L / SN50 RDU 芯片
          detail: 核心计算；整合 TSMC 芯片、HBM 封装和 DDR 接口
        - id: d5
          label: SambaFlow 编译器
          detail: 自研；依赖 MLIR / PyTorch 前端；模型可移植性会被供应商锁定
        - id: d6
          label: Intel（Xeon 6 + GPU）
          detail: 战略合作伙伴；为异构推理蓝图供应主机 CPU 和 GPU；同时也是投资方
        - id: d7
          label: SambaRack / SambaStack 系统
          detail: 整合芯片、内存、网络和 SambaFlow；交付给企业客户
        - id: d8
          label: SambaCloud API
          detail: 托管和可靠性依赖机房托管合作伙伴（SoftBank APAC、美国 / 欧洲伙伴）
      edges:
        - from: d1
          to: d4
