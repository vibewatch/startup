      - number: '5.6'
        title: 证据
        blocks:
          - type: callout
            title: 大模型推理速度同类领先
            body: >
              SambaNova 的三层内存架构，在 70B–671B 参数规模、GPU 内存带宽成为瓶颈的推理场景中，结构上很匹配。独立 Artificial Analysis 基准确认，SambaCloud 2024 年
              9 月发布时，在 Llama 3.1 405B 上以完整 16-bit 精度达到 132 t/s，是当时记录中的最快速度；SambaNova 目前也是唯一以完整精度和生产速度提供 DeepSeek R1 671B
              的云供应商。这是一项基于架构而不只是优化的可防守技术优势。
            calloutType: strength
            claimRefs:
              - CE022
              - CE024
              - CE027
          - type: callout
            title: 供应商主导基准与狭窄产品面
            body: >
              所有已发布 SN50 性能数字都引用 SemiAnalysis InferenceX（一家受厂商委托的公司），而不是开放方法论基准。SambaCloud 约 10
              个模型的目录、缺少微调、以及大模型上下文窗口上限，都是结构性产品缺口；相对 GPU 云竞争对手，它们压缩了可触达开发者市场。买家在签署大规模推理合同前，应要求独立硬件基准和详细 SLA / 合规文档。
            calloutType: risk
            claimRefs:
              - CE029
              - CE037
              - CE040
          - type: callout
            title: 风冷机架是主权 AI 的落地抓手
            body: >
              SambaRack 10–20 kW 的风冷形态可在标准数据中心散热和供电包络内运行，这让 SambaNova 在主权 AI 市场区别于液冷 GPU 替代方案（DGX H100/H200 系统每套需要 10–30
              kW 液冷基础设施）。日本、德国、澳大利亚和英国的主权部署，以及 SoftBank 即将部署的 SN50，都验证了这是真实采购驱动因素，而不是营销说法。
