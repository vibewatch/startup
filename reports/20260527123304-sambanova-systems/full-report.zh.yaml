              National Laboratory（ORNL）在 2024 年 11 月选择 SambaNova Suite、SN40L 和 Composition of Experts（CoE），用于其 AI for
              Science 组合中的并行科学推理，并利用相对 Frontier 超算的节能优势。Texas Advanced Computing Center（UT Austin，NSF 资助）在 2024 年 11 月部署
