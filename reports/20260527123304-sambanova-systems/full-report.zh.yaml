      - number: '5.3'
        title: 性能、基准与技术取舍
        blocks:
          - type: paragraph
            body: >
              SambaNova 最强的差异化，在于用完整 16-bit 精度为大模型（70B–671B 参数）提供持续的单用户推理吞吐。独立基准聚合方 Artificial Analysis 确认，在 2024 年 9 月
              SambaCloud 发布时，Llama 3.1 405B 输出速度达到 132 输出 tokens/sec，是当时该模型所有供应商中的最快速度。在 Llama 3.1 70B 模型上，SambaNova
              在该基准窗口测得 461 tokens/sec，Cerebras 为 445 tokens/sec，Groq 为 250 tokens/sec。对 DeepSeek R1 671B，SambaNova 报告完整
              16-bit 精度下为 231–255 tokens/sec；同一模型上的 GPU 供应商因内存带宽约束被迫量化，平均约 19 tokens/sec。SN50 基准（厂商提供，来源为 SemiAnalysis
              InferenceX）声称，在 Llama 3.3 70B 上达到 895 tokens/sec/user，而 Nvidia B200 为 184 tokens/sec。

              三个技术取舍限制了可比性。第一，SambaNova 所有性能数字都代表单用户（batch=1）延迟，而不是总吞吐；后者才是 GPU 系统优化的指标（例如 DGX H100 在 MLPerf 批量吞吐模式下处理
              Llama 2-70B 可达到 24,544 tokens/sec，但单用户只有 ~20 tokens/sec）。这是 SambaNova
              数据流架构的结构性结果：低延迟顺序执行很强，但没有发布等价的批量吞吐数据。第二，基准方法主要由厂商控制或赞助；除 Artificial Analysis 的 API 端点测量外，独立第三方验证有限。SN50
              声明引用的是商业基准公司 SemiAnalysis InferenceX，而不是开放方法论结果。第三，模型目录深度较窄：SambaCloud 约 10 个模型，而 GPU 云竞争对手有 50–200
              个，并且不支持图像或视频生成。若开发者工作流需要频繁切换模型或微调，在 SambaNova 生态内没有替代方案。

              GPU 内存带宽瓶颈是 SambaNova 三层内存设计要抓住的结构性条件。Cerebras CEO Andrew Feldman 曾描述这一瓶颈，Databricks 工程基准也确认：H100
              tensor-parallel 效率从 2 个 GPU 的约 60% 降至 8 个 GPU 的约 25%。在生产企业工作负载常见的小到中等批量大小下，这一优势是真实的。随着 Nvidia 和 AMD 在
              Hopper/Blackwell 后续产品中提升 HBM 容量和软件批处理效率，这一优势能否持续，仍是开放的技术问题。
