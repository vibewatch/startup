        title: 资本结构与融资历史
        blocks:
          - type: paragraph
            body: >-
              自 2017 年成立以来，SambaNova 据披露已完成五轮新股融资，累计获得约 $1.49B 风险资本。公司最近一轮新股融资是 2026 年 2 月的 $350M Series E，由 Vista
              Equity Partners 和 Cambium Capital 领投，Intel Capital、卡塔尔主权财富基金（QIA）、GV、Battery Ventures 以及 T. Rowe Price
              Associates 建议的账户也参投。该轮资金用于扩大 SN50 芯片制造产能，并扩展云基础设施。

              估值叙事并不单线条。2021 年 4 月的 Series D 由 SoftBank Vision Fund 2 领投，投后估值为 $5.1B。公司的 SEC Form D 文件确认该轮融资金额为
              $677,999,515。SambaNova 在 Series E 新闻稿中没有披露投后估值；第三方数据源引用的投后估值约为 $4.8B，而 BlackRock 在 2025 年末将其 SambaNova
              持仓下调 17%，意味着有效价值更接近 $2.4B。ainvest 引述的老股交易显示，在 Series E 交割前的某些时点，隐含估值低至 ~$2.24B。相对 2021 年峰值，这一差异构成了实质性的
              down-round 风险信号。

              Series E 之前，SambaNova 约五年没有完成新股融资。其间据称公司难以按有利估值完成新融资，也曾探索以估计 $1.6B（含债务）的价格出售给 Intel，并与投资银行合作评估战略选项。最终选择融资
              Series E 而非卖给 Intel，说明管理层仍相信独立发展路径，但也凸显公司进入 2026 年前承受的财务压力很深。
