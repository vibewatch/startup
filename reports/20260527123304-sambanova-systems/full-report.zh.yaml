  - id: FV003
    title: 估值 / 回报区间 — 按入场点划分的乐观、基准、悲观情景
    type: range
    layout: wide
    summary: 以 Series E-1 约 $2.34B 的入场价格为锚，推算三种情景下 2028 年估值区间。约 $1.44B 的二级市场入场点作为单独参考区间展示。
    data:
      items:
        - label: 2028 年退出估值 — 乐观情景（USD B）
          low: 8
          high: 12
          unit: USD B
          source: $500M+ ARR at 16–24x; Intel channel + SN50 ramp on schedule
        - label: 2028 年退出估值 — 基准情景（USD B）
          low: 4.5
          high: 7
          unit: USD B
          source: $380M ARR at 12–18x; steady execution; no major disruption
        - label: 2028 年退出估值 — 悲观情景（USD B）
          low: 1
          high: 2
          unit: USD B
          source: $150–200M ARR at 5–10x; SN50 delays; execution miss; Nvidia pressure
        - label: Series E-1 入场隐含估值（USD B）
          low: 2.34
          high: 2.34
          unit: USD B
          source: Yahoo Finance / Forge primary round data; E-1 at $30.99/share
        - label: Forge 老股隐含估值（USD B，2026 年 5 月）
          low: 1.44
          high: 1.44
          unit: USD B
          source: Forge derived price $19.05/share; as of May 26, 2026
    approximationNotes: 所有情景估值均为分析师基于可比倍数和预测 ARR 作出的估算；私营公司不透明，因此不确定性高。未分配概率权重。回报为稀释前口径，未计入清算优先权瀑布或反稀释条款。
    claimRefs:
      - CV012
      - CV013
      - CV025
      - CV028
      - CV039
  - id: FV004
    title: 投资 KPI — IC 可用评分卡
    type: kpi
    layout: standard
    summary: 从投资委员会七个维度为截至 2026 年 5 月的 SambaNova 打分，反映证据质量和估值分析。
    data:
      items:
        - label: 市场机会
          value: 7/10
          detail: AI 加速器 TAM 超过 $200B 且仍在增长；主权 AI 和企业推理渗透不足；可触达市场可信
        - label: 收入证据
          value: 5/10
          detail: $100–180M ARR（未经审计）；2024 年增长 4x；没有 NRR 或队列数据；依赖政府合同，收入波动更大
        - label: 产品 / 技术护城河
          value: 6/10
          detail: SN50 架构有差异；dataflow/RDU 声称性能 5x；但没有独立基准测试；生态不如 CUDA 成熟
        - label: 单位经济
          value: 3/10
          detail: 毛利率未披露；资本开支强；累计融资 $1.49B 对应 $2.34B 估值，资本效率差；没有公开盈利路径
        - label: 风险画像
          value: 3/10
          detail: 高：降价融资、M&A 失败、老股折价、治理冲突（Tan）、优先权悬顶、Nvidia 护城河
        - label: 估值吸引力
          value: 4/10
          detail: E-1 约 23x ARR，处于行业中位数；老股 8x 更有吸引力但流动性差；$4.8B 聚合平台口径未解
        - label: 证据质量
          value: 4/10
          detail: 私营公司；估值信号互相冲突；没有经审计财务；老股市场数据是最新外部信号
    approximationNotes: 分数是研究分析师基于可得证据作出的定性评估，并非量化模型。维度沿用本报告系列的 IC 评分框架。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV021
      - CV024
      - CV025
      - CV035
