      - number: '6.4'
        title: 客户集中风险、证据质量与反向信号
        blocks:
          - type: paragraph
            body: >-
              由于公开披露有限，客户集中风险很大且研究不足。公开具名客户名单由美国政府和学术机构主导；如果它们贡献了大部分硬件系统收入，SambaNova
              就在一个采购周期长、后续合同需要重新竞标的细分中承担显著集中度。2025 年 10 月的报道称，SambaNova
              未能完成新融资并在探索出售，且这一切发生在公司技术很强的情况下；这对商业收入多元化提出了合理问题：如果 Fortune 500 和金融服务客户部署能产生强劲、可重复收入，融资危机大概率可以避免。SambaNova
              2024 年 11 月裁员 77 人（约 15% 员工），从训练转向推理工作负载，这表明早期以训练用例为锚的客户基础不够大，无法吸收这一转型，也说明向推理扩张客户需要一次重置。证据质量差异很大：国家实验室部署由
              DOE/NNSA 官方新闻稿和实验室主任具名引言确认；SoftBank、OVHcloud 和 Accenture 部署由双方新闻稿和具名高管引言确认；OTP Bank 部署由 CB Insights
              和具名高管引言记录；更宽泛的企业声明（Fortune 500、未具名金融服务银行、营销材料中多处 Fortune 500 表述）缺少独立佐证，应视为公司声称，而不是独立验证。任何细分都没有披露公开 NRR、GRR
              或客户队列留存数据。
