      - number: '8.4'
        title: 投资逻辑——乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景建立在三根支柱上：（1）SN50 相对 SN40 声称性能提升 5x、相对 GPU 具备 3x 成本优势，使 SambaNova 有机会从 Nvidia 手中拿下 $200B+ AI
              加速器总可用市场（TAM） 的有意义份额；（2）ARR 在 2024 年增长 4x，并可能在 2026 年超过 $180M，意味着若沿类似增长曲线，到 2028 年可迈向 $500M+ ARR；（3）Intel
              战略合作提供分销、制造规模和联合营销触达，有可能显著压低 GTM 成本。如果 SambaNova 到 2028 年实现 $500M ARR，并按收入的 20x 交易，退出估值为 $10B，相当于 Series
              E-1 投资获得 4x 回报。

              基准情景假设 SambaNova ARR 年增速为 50–70%，到 2028 年达到 $400M。按收入的 15x 计算，估值为 $6B，对 E-1 定价意味着 2.5x 回报。这要求 SN50
              爬坡成功、持续赢得主权 AI 合同，并兑现 Intel 合作——可以做到，但没有保证。

              悲观情景假设 Nvidia 加深软件和硬件护城河，客户试点无法规模化转化，SN50 又遇到制造延误。收入停滞在 ~$150–200M ARR，且看不到盈利路径。按收入的 8–10x（老股市场折价）计算，公司价值为
              $1.2–$2B，意味着 Series E-1 投资人约在盈亏平衡到中等亏损之间。2025 年出售流程失败、资本消耗很深，以及 Cerebras 更强的执行画像，都支持这一风险情景。

              关键摇摆因素包括：SN50 部署速度（Intel 交易本意就是加速这一点）、SoftBank Japan 爬坡（首个已披露 SN50 客户），以及 SambaNova 能否把主权 AI
              管线转化为足够规模的经常性云订阅，从而证明净收入留存率高于 100%。
            claimRefs:
              - CV033
              - CV034
              - CV015
              - CV016
              - CV036
              - CV026
