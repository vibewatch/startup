      - number: '1.4'
        title: 规模、里程碑与反向事件
        blocks:
          - type: paragraph
            body: >
              从创立到 2026 年，SambaNova 推进了五代芯片，最新包括 SN40L（2023 年 9 月，TSMC 5nm，HBM3 + DDR5 + SRAM 内存）和 SN50（2026 年 2
              月发布，2026 年下半年出货）。公司于 2024 年 9 月推出 SambaNova Cloud，标志着从以硬件训练系统为中心，转向云优先的 AI 推理服务。但战略转向伴随痛苦裁员：2025
              年初，SambaNova 裁撤约 77 名员工——约占 ~500 人团队的 15%——将团队重心转向推理和云。裁员后，公司经历了一段财务压力和寻找战略选项的时期。2024
              年底，公司开始探索潜在出售，并聘请投资银行管理流程；据报道，潜在买方包括大型云厂商和私募股权。到 2025 年底，Intel——其 CEO Lip-Bu Tan 同时担任 SambaNova 董事长——已就约
              $1.6 billion 收购签署非约束性条款书。谈判最终停滞；2026 年初，SambaNova 放弃 Intel 交易，选择通过 E 轮再资本化保持独立。客户包括 Hugging Face、Meta、主要
              AI 实验室以及 SoftBank（日本 SN50 芯片首个客户）。SambaNova 还宣布在 Germany、UK、Australia、Japan 和 France 建立主权 AI
              合作。裁员后当前员工数估计约 400–425 人；E 轮后招聘轨迹未公开披露。
