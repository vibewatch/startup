        - from: d4
          to: d7
          label: 核心计算模块
        - from: d5
          to: d7
          label: 软件运行时层
        - from: d6
          to: d7
          label: 主机 CPU 和网络（异构蓝图）
        - from: d7
          to: d8
          label: 支撑云 API 基础设施
