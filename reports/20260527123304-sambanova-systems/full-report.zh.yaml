  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: RDU 硬件平台与芯片架构
        blocks:
          - type: paragraph
            body: >
              SambaNova 的硬件底座是 Reconfigurable Dataflow Unit（RDU），一款专为 AI 推理设计的加速器。它不用 GPU 的指令集架构（ISA），改走数据流执行模型。GPU
              通常顺序启动 kernel，并反复从外部内存加载权重；RDU 则按模型计算图配置连续处理流水线，减少数据搬运，并在单次遍历中把整个 Transformer 解码层的算子融合起来。

              第四代 SN40L 芯片在 2023 年发布，并于 IEEE MICRO 2024 发表，实现了三层内存层级：用于即时计算的 520 MB 片上 SRAM、用于活跃模型权重的 HBM（SN40L-16
              配置下每芯片 64 GB），以及用于容量层存储的 DDR DRAM（每芯片 768 GB），可同时容纳数百个模型。该架构让一台 16 芯片 SambaRack 可寻址约 12 TB 总 DRAM 加 1 TB
              HBM，从而在无需量化的情况下，以完整 16-bit 精度运行万亿参数模型，包括 Llama 3.1 405B 和 DeepSeek R1 671B。IEEE Micro 论文在 Composition of
              Experts（CoE）工作负载上的测量显示，八插槽 SN40L 节点相较 DGX H100 端到端速度提升 3.7×，相较 DGX A100 提升 6.6×，模型切换速度比 GPU 基线快 15–31×。

              第五代 SN50 于 2026 年 2 月推出，单个加速器计算能力是 SN40L 的 5 倍，网络带宽是其 4 倍。它支持通过每秒多 TB 级 fabric 互连最多 256 个加速器，可支持最高 10
              trillion 参数、最高 10 million token 上下文长度的模型。SambaRack SN50 每机架集成 16 颗芯片，功耗 20
              kW，完全风冷，不需要液冷基础设施；这对现有数据中心是显著的运营优势。SoftBank Corp. 是首个已确认 SN50 客户，目标是在 2026 年 H2 部署于日本 AI 数据中心。Intel 作为
              Series E 的战略投资方之一，正在共同开发异构推理蓝图：Intel GPU 处理 prefill（提示处理）阶段，SambaNova RDU 处理 decode（token 生成）阶段。
