            body: >
              SambaNova 主要已披露客户——Argonne National Laboratory、Lawrence Livermore、Lawrence Berkeley、Oak Ridge 和 Los Alamos
              National Laboratories——全部属于 DOE/NNSA 系统，造成估计 60–80% 的政府收入集中度。这种极端依赖意味着，单一联邦预算事件或 FOCI
              反向认定，就可能同时影响多个客户账户。SoftBank 是最重要的已披露商业客户，但合同条款和收入体量没有披露，商业多元化声明的可信度因此受限。TSMC 和 HBM
              供应商构成结构性制造依赖，且没有确认缓释措施；Vista Equity Partners 则作为 Series E 领投方提供主要资本关系。DOE 预算封存、FOCI 反向认定或 SoftBank
              合同终止，任何一个单独发生，都可能在短期没有商业对冲的情况下造成实质收入冲击。
