      - number: '5.5'
        title: 技术路线图、产品缺口与战略风险
        blocks:
          - type: paragraph
            body: >
              SambaNova 的产品路线图集中在三个近期交付项：SN50 硬件全面投产并向客户发货（2026 年 H2）、面向企业和主权部署的 Intel-SambaNova 异构推理集群（2026 年 H2），以及在
              SN50 硅片上扩展 SambaCloud 容量。2026 年 4 月宣布的 Intel 合作明确，Xeon 6 处理器将同时担任主机 CPU 和用于智能体工具执行、代码编译的“action CPU（动作
              CPU）”，Intel GPU 处理 prefill，SambaNova RDU 处理 decode。这是三方异构架构；截至运行日期还没有生产部署。

              独立审查识别出的实质产品缺口包括：（1）没有公共微调 API——需要定制模型适配的客户必须用 GPU 云微调，再切换到 SambaNova 做推理，带来流程摩擦和多供应商依赖。（2）模型目录较窄（约 10
              个模型，而 GPU 竞争对手有 50–200 个），且没有图像、视频或文本转语音生成。（3）上下文窗口上限：标准 DeepSeek V3.1 产品限制为 131K 输入上下文 和 7K 补全
              tokens；扩展上下文变体（DeepSeek V3.1-cb）有 32K 补全 tokens，但输入上下文只有 32K，限制长文档和智能体用例。（4）截至运行日期，SN50
              生产硬件尚未完全商业可得。（5）SambaNova 网站没有列出公开合规认证（SOC 2、FedRAMP、ISO 27001）；其安全姿态依赖面向客户的控制（不记录数据政策、本地部署选项），而不是第三方证明。

              战略风险包括：（a）SambaNova 聚焦企业的销售模式涉及漫长采购和安全审查周期，相比 GPU 云和开发者友好的 API 竞争对手，可扩展性受限；（b）SN40L 和 SN50
              的基准声明主要由厂商控制，独立第三方验证仍有限；（c）Nvidia 持续提升内存带宽（Blackwell B200：192 GB HBM3e、8 TB/s 带宽），随着 GPU
              软件批处理改善，推理延迟差距可能缩小；（d）Intel 合作让企业商业化路径的相当部分依赖 Intel 供应链和销售执行。
