      - number: '8.2'
        title: 可比公司——公开与私有 AI 基础设施
        blocks:
          - type: paragraph
            body: >-
              SambaNova 最接近的私有可比公司是 Groq 和 Cerebras，两者都是 AI 推理 / 加速器领域的 Nvidia 挑战者。Groq 2025 年 9 月以 $6.9B 投后估值融资
              $750M，此前在 2024 年 8 月以 $2.8B 估值完成融资，一年左右估值翻倍以上。以 2024 年估计收入约 $90M 计算，Groq 的 $6.9B 估值意味着约 76x 往绩收入；投资人对其 LPU
              架构和快速扩张的开发者生态保持乐观，因此给出溢价。

              Cerebras 的分化更为明显。公司在 2026 年 2 月以 $23B 估值完成 $1B Series H，随后申请在 Nasdaq 上市，定价区间为每股 $115–$125，目标估值 $26.6B，并报告
              2025 年收入 $510M、GAAP 净利润 $87.9M。Cerebras 剩余履约义务（backlog）为 $24.6B，提供了 SambaNova 当前无法匹配的收入可见性。按 IPO
              估值计算，Cerebras 约为 2025 年收入的 45–52x。

              在上市公司中，Nvidia 2026 财年收入 $215.9B，对应约 $4.6T 市值，意味着市销率约 21x。AMD 2025 年收入 $34.6B，市值约 $397B，交易价格约为收入的
              11.5x。这些上市公司倍数提供了重力锚：达到规模后，AI 芯片公司估值通常为收入的 10–25x。Groq 和 Cerebras
              等私有、尚未达到收入规模的同行享有溢价，反映的是超高增长预期、稀缺性和战略可选性。

              Finro 的 2026 年 Q1 数据集覆盖 575 家 AI 公司，显示 AI 基础设施的 EV/Revenue 倍数中位数约为 21.2x，平均值 31.3x，25th–75th 分位数 区间为
              10.2x–39.6x。按 Series E-1 隐含 $2.34B 和 2025 年中约 $100M ARR 计算，SambaNova 的约 23x 倍数落在中位数——孤立看合理，但受到 Cerebras
              更强收入规模、盈利能力和订单积压，以及 Groq 更快估值增值的挤压。

              资本效率是最尖锐的差异。SambaNova 的估值 / 累计融资比约为 1.6x（$2.34B / $1.49B），而 Groq 约为 9.2x（$6.9B / $750M 融资），Cerebras 约为
              14x（$23B / ~$1.6B 融资）。SambaNova 为每一美元当前估值消耗了多得多的资本；这是结构性担忧，使乐观情景取决于收入效率出现阶跃式改善。
