      - number: '1.3'
        title: 融资历史、投资方与资本结构
        blocks:
          - type: paragraph
            body: >
              自创立以来，SambaNova 在五轮已识别融资中累计募集约 $1.49–$1.5 billion。首笔外部资本来自 2018 年 3 月，GV（Google Ventures）与 Walden
              International 共同领投 $56 million A 轮——这是 GV 首次投资 AI 芯片初创公司。2020 年，BlackRock、Intel Capital 和 GV 跟投约 $250
              million，将隐含估值推至约 $2.5 billion。高点出现在 2021 年 4 月，SoftBank Vision Fund 2 领投 $676 million D 轮，投后估值 $5.1
              billion，Temasek、GIC 和既有投资方参投。直到 2026 年 2 月，SambaNova 才再次融资，完成由 Vista Equity Partners 和 Cambium Capital 领投的
              $350 million E 轮，Intel Capital、Qatar Investment Authority（QIA）、GV、Battery Ventures、T. Rowe Price
              Associates、Seligman Ventures、Assam Ventures 以及 Saudi Arabia 主权财富资金追加参投。E 轮未披露投后估值；多篇报道称其低于 $5.1 billion D
              轮高点。BlackRock 在 2024–2025 年前后已将 SambaNova 持仓下调约 17%，指向约 $2.4 billion 估值。CEO Rodrigo Liang 称 E
              轮“严重、严重超额认购”，说明尽管估值不确定，投资人兴趣仍强。公司未公开披露收入数字、债务融资或老股交易。
