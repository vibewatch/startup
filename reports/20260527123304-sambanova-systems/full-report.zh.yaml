  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 市场与竞争风险
        blocks:
          - type: paragraph
            body: >
              SambaNova 所处的 AI 芯片格局由 Nvidia 主导；2025 年，Nvidia 约占数据中心 GPU 收入的 70–80%。Nvidia 的 CUDA
              生态经历十多年软件投入和社区锁定，造成不对称切换成本：在 Nvidia 硬件上运行 PyTorch、NCCL 和 RAPIDS 的企业，若要采用 SambaNova 的 SambaFlow
              技术栈，需要显著重新工程化。锁定效应是结构性的，而不是偶然的；CUDA 如今覆盖编译器工具链、性能分析 工具、预训练模型注册表和 MLOps 集成，还没有挑战者完整复制。Groq 在 2024–25 年拿下
              $1.5 billion 主权 AI 合作；Cerebras 以 $8.1 billion 估值融资 $1.1 billion。SambaNova 声称 SN50 芯片相对 Nvidia B200
              配置可提供“每瓦性能提升 5×”，但独立基准仍不可得。Forbes 将竞争动态描述为，到 2026–2027 年 Groq、Cerebras 和 SambaNova
              中可能只会出现一个大型赢家，这抬高了生存级赌注。
