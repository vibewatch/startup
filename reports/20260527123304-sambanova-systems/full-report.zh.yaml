            - label: 高
              tone: positive
              detail: 客户控制设施；模型权重可导出；按厂商说法可空气隔离部署
            - label: 中
              tone: neutral
              detail: 由 SambaNova 运营的受控设施；DPA 条款和认证未完全公开
        - label: 开发者生态成熟度
          values:
            - label: 中
              tone: neutral
