      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              AI 推理基础设施采购分为五类清晰的买方画像，各自的预算归属、采购标准、风险容忍度和切换成本不同。

              超大规模云厂商（AWS、Azure、GCP、Meta）按绝对金额是最大买方，但它们越来越多部署自用定制芯片（Google TPU、AWS Trainium、Meta
              MTIA），并不流入商用芯片市场。其采购由基础设施工程团队主导，采用多年期供货协议，优先考虑吞吐量、能效和深度软件集成。SambaNova 目前不瞄准这一板块。

              大型企业（金融服务、医疗、制造、国防）是 SambaNova 主要可服务买方。这些组织在欺诈检测、临床诊断、自动驾驶系统和工作流自动化中大规模运行 AI 工作负载，但合规要求让公有云 AI 变得棘手。Azumo
              报告称，87% 的大型企业已实施 AI 解决方案，但只有 9% 达到完整 AI 成熟度——说明多数仍处在部署爬坡阶段。预算通常由 CTO 和 CIO 掌握，采购周期为 6–24 个月。金融服务（AI 采用率
              85–89%）和医疗（使用量同比 8x 增长）是优先垂直行业。

              政府和主权买方正在加速增长。NTT DATA 的 2026 Global AI Report（调查约 5,000 名高级决策者）发现，95%+ 的组织认为私有和主权 AI 对战略重要。近期只有 29%
              正在具体优先推进，但 96% 因地缘政治压力而考虑将 AI 基础设施迁移到特定地区。Forrester 预计，到 2026 年底，一半 G20 国家将要求公共部门服务采用本土调校的 AI 模型。SoftBank
              Corp. 在日本主权 AI 数据中心部署 SambaNova SN50，是该板块的一个验证点。

              Neocloud 和 AI 推理服务商是增长中的中介买方：它们采购硬件（包括 SambaNova 系统），再向企业客户转售推理容量。Intel-SambaNova 合作明确将这一渠道与直接企业销售并列为目标。

              由于当前硬件模式资本强度高（本地 AI 集群 $700K–$7M），中小企业对 SambaNova 来说优先级较低；但 SambaCloud 服务提供了一个入口。
