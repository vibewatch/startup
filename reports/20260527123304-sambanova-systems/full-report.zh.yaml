  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值背景与 Series E 融资
        blocks:
          - type: paragraph
            body: >-
              SambaNova 2026 年 2 月 24 日 Series E 融资超过 $350M，由 Vista Equity Partners 和 Cambium Capital 领投。该轮至少分为两档：Series
              E-1 每股 $30.99，Series E-2 每股 $21.70；根据 Yahoo Finance/Forge 数据，金额分别约为 $307.13M 和 $42.87M。E-1 定价意味着投后估值约
              $2.34B；不过包括 Tracxn 和 user-context 数据在内的一些第三方来源引用 $4.8B 投后估值——公司尚未公开解决这一重大差异。

              $2.34B（E-1）新股价格较 2021 年 Series D $5.11B 峰值下降 54%，符合 down round 的标准定义。Series E 交割前，BlackRock 已根据 Caplight
              分析将其 SambaNova 持仓下调约 17%，意味着有效价值约为 ~$2.4B。与此同时，Intel 正在就约 $1.6B（含债务）的收购进行高级阶段谈判；这一价格会抹去 2021 年 Series D
              投资者持有的大部分股权价值。

              截至 2026 年 5 月 26 日，Forge 的老股市场估计将 SambaNova 隐含估值定在 $1.44B，股票交易价为 $19.05，较 Series E-1 新股价格低
              39%。这一持续老股折价表明，市场参与者对公司能否兑现新股轮价格仍有疑虑。尽管如此，Forge 3 个月回报跟踪器显示 SambaNova 上涨 38.53%，而指数为 9.62%，说明 2026 年 2 月
              Series E 交割后，老股情绪已有实质改善。

              CEO Rodrigo Liang 称该轮“极度、极度超额认购”，Intel Capital 则与 Vista 一同战略投入约 $100–$150M。双档结构（E-1 为 $30.99，E-2 为
              $21.70）让混合全成本低于 E-1 名义价，分层经济条款暗示资深投资人获得优先价格保护。这一资本结构复杂性，再叠加 $5.11B Series D 留下的深厚优先权负担，使普通股以及 2021
              年水位线及以下的后续轮投资人面临实质风险。
