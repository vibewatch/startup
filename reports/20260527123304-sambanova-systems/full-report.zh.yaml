      - number: '8.6'
        title: 展项
        blocks:
          - type: callout
            title: 估值数据冲突——$2.34B vs. $4.8B
            body: >-
              一手股价数据（Yahoo Finance/Forge；Series E-1 为 $30.99/share）隐含投后估值约 $2.34B。Tracxn 等第三方聚合平台和用户上下文数据引用
              $4.8B，是前者两倍以上。在 SambaNova 披露官方轮次文件前，$4.8B 应视为未核实，且可能对应不同工具类别（例如投前估值、基于不同股本的完全摊薄估值，或包含未来承诺）。没有律师确认， 投资者不应锚定
              $4.8B。
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
          - type: callout
            title: 降价轮、优先股压顶与普通股风险
            body: >-
              约 $2.34B 的 Series E-1，较 2021 年 $5.11B 的 Series D 下降 54%。Series D 的优先股堆叠 （融资 $676M，发行价
              $95.02/share）形成一条很高的清算瀑布；任何低于 $5.11B 的退出，都要先跨过它， 早期普通股才有回报。按 E-1 定价进入的 Series E
              投资者，在结构上优先于早期普通股，但仍需处理反稀释条款和老股市场折价。 按 $1.44B 买入老股，对优先股堆叠提供了更有吸引力的缓冲。
            calloutType: risk
            claimRefs:
              - CV004
              - CV008
              - CV025
              - CV039
              - CV040
          - type: callout
            title: 继续研究——$1.44B 老股入口值得重新评估
            body: >-
              主建议是在 Series E-1 价格（约 $2.34B）下继续研究。老股市场价格约 $1.44B（Forge，2026 年 5 月）， 隐含约 8x ARR
              倍数，低于行业中位数，也更匹配执行风险。如果投资者能以 $1.44B 隐含价格或附近拿到老股， 并获得适当治理权和信息访问权，风险回报更有吸引力——但仍取决于 SN50 爬坡、Intel 合作落地和 NRR
              确认。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV012
