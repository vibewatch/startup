      - number: '7.2'
        title: 运营、供应链与技术风险
        blocks:
          - type: paragraph
            body: >
              SambaNova 的硬件路线图完全依赖 TSMC 制造硅片。TSMC 的市场主导地位意味着，任何地缘政治扰动——最关键的是台海冲突，或影响 TSMC 取得 ASML EUV 设备的美中升级——都可能让
              SambaNova 芯片供应停摆，且没有合格备用方案。SambaNova 使用 HBM2E 封装 RDU 芯片，来源集中于少数 DRAM 供应商。公司声称的缓释措施是评估 Intel 晶圆代工
              生态作为第二晶圆厂，但 Intel Foundry Services 尚未证明能为任何外部客户以有竞争力良率量产 AI 芯片设计。SN50 芯片流片和量产爬坡时间表没有公开披露；考虑到典型 TSMC
              先进节点从流片到量产需要 12–18 个月，任何延误都会压缩其对抗 Nvidia B200 和 B300 后续路线图的竞争窗口。SambaFlow 软件栈可靠性和 AI 专项安全认证也仍未被独立第三方验证。
            claimRefs: []
          - type: table
            tableRef: TR002
            claimRefs: []
