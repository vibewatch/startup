              - CM039
              - CM042
          - type: callout
            title: 市场估计冲突带来规模不确定性
            body: >
              分析师对 2026 年 AI 芯片市场的估计从 $120B（AI 推理子市场）到 $500B（包含内存和网络的全部 AI 芯片）不等，跨度达 4x。AMD CEO 提出的 2030 年 $1T 市场，并未得到
              IDC、Deloitte 或其他独立分析师在该时间维度上的佐证。投资人和评估者在接受任何 TAM 数字表面值之前，必须先按市场边界做归一化。SambaNova
              可服务的企业推理硬件市场——不含超大规模云厂商自用芯片——2026 年更可能是 $30–60B，而不是标题里的 $200B–$500B AI 芯片数字。
