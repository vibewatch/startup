            - label: 中
              tone: neutral
              detail: SambaFlow 需要学习成本；教程少于 GPU 原生替代方案
            - label: 中
              tone: neutral
              detail: 沿用 SambaStack API 接口面；开发者工具相同
        - label: 智能体 AI 准备度
          values:
            - label: 中
