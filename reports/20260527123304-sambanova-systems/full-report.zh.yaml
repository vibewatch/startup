      - number: '3.2'
        title: 直接推理硬件挑战者——Cerebras 与 Groq
        blocks:
          - type: paragraph
            body: >-
              Cerebras Systems（Menlo Park, CA；2016 年创立）和 Groq 是 SambaNova 最接近的架构同类：三家公司都专门为推理而非训练打造了定制芯片。Cerebras 的
              Wafer-Scale Engine 3（WSE-3）是最极端的押注——46,225 mm² 单颗 die、4 trillion 晶体管、900,000 个 AI 核心、44 GB 片上 SRAM，可在
              Llama 3.1 405B 上实现 1,000+ tokens per second，首 token 延迟低于 100 ms。Cerebras 于 2026 年 5 月中旬在 Nasdaq 完成
              IPO（ticker: CBRS），初始估值约 $26–27 billion；支撑来自 2025 年 $510 million 收入（同比增长 76%）以及与 OpenAI 的 $20 billion
              算力交易。其 CS-3 本地系统部署在 16 RU 中，与 SambaNova DataScale 直接争夺主权和企业本地买方。客户集中是实质风险：G42 与 OpenAI 合计代表了 2028
              年前预测收入的大部分。Groq 的 Language Processing Unit（LPU）架构交错流式计算与 SRAM，提供业内领先的确定性延迟，在 Llama 3.1 8B 上达到 840 tokens
              per second，在 Llama 3.3 70B 上达到 394 tokens per second，并实现该板块最低首 token 延迟。NVIDIA 据称在 2025 年底与 Groq 达成 $20
              billion IP 授权交易，将 LPU 技术纳入 Rubin GPU 系列；这既验证了架构论点，也让 Groq 不再是完全独立的竞争威胁。Cerebras 和 Groq 都瞄准与 SambaNova
              相同的企业和研究实验室买方。Cerebras 的晶圆级方案更难按商品规模复制；Groq IP 被 NVIDIA 吸收后，作为独立厂商的差异化有所削弱。SambaNova 的差异化回应，是面向智能体 AI
              decode 的异构 SN50 + Intel Xeon 6 蓝图；而 Cerebras 更聚焦大批量吞吐，对这种工作负载模式优化较弱。
