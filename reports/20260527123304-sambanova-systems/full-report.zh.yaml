              SambaNova 没有公开披露毛利率结构。公司经营的是硬件、软件、服务一体的技术栈；硬件毛利率通常低于纯软件，资本密集型制造也会带来明显成本压力。同类 AI 芯片公司和定制硅供应商在规模化前，硬件毛利率通常处于
              40–60% 区间；软件和云服务的毛利率则显著更高。分析师估计，SambaNova 的综合毛利率低于 50%，硬件组件和制造开销拉低了整体水平。

