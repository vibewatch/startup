      - number: '1.5'
        title: 关键证据
        blocks:
          - type: callout
            title: 差异化 RDU 架构，已有多代迭代记录
            body: >
              SambaNova 的 Reconfigurable Dataflow Unit 架构是一套专为 AI 推理设计的芯片平台，已经经历从 SN10 到 SN50 的五代硅片，并采用独特的三层内存层级（HBM +
              DDR5 + SRAM）。该架构可在单一内存空间内支持最高 256 颗芯片，并实现约 90% HBM 带宽利用率——显著高于典型 GPU 水平。2026 年 2 月发布的 SN50 相比上一代 SN40L 提供
              2.5× FP16 算力，支持 FP8/FP4 精度；按 SambaNova 说法，速度可达竞品芯片的 5×。这种技术差异化构成了公司企业推理价值主张的基础。
            calloutType: strength
            claimRefs:
              - CO010
              - CO012
              - CO013
              - CO039
              - CO040
          - type: callout
            title: 治理冲突：Intel CEO 兼任执行董事长
            body: >
              Lip-Bu Tan 同时担任 Intel CEO 和 SambaNova 执行董事长，形成持续治理冲突。虽然 Tan 回避了 2025 年 Intel 收购讨论，但这一安排意味着 SambaNova
              董事长同时也是其最重要战略企业伙伴的负责人，并且该伙伴此前还是潜在收购方。E 轮后，多年期 Intel 合作已经落地，这一冲突仍未解决；若两家公司竞争动态发生变化，SambaNova 的战略灵活性可能受限。
