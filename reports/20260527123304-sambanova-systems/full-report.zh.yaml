      - number: '2.5'
        title: Nvidia 主导地位与替代方案空白
        blocks:
          - type: paragraph
            body: >
              2026 年，Nvidia 按收入约占 AI 加速器市场 75–80%，低于 2024 年约 ~87% 的高点，因为总市场扩张速度快于 Nvidia 捕获份额的速度。SiliconAnalysts 预计
              Nvidia FY2026 数据中心收入为 $150B+，Blackwell（B200、GB200）是主要增长驱动。H100 制造成本约 $3,320，但售价 $28,000——毛利率
              88.1%，足以支撑竞争对手难以匹敌的结构性 R&D 和供应链优势。Nvidia 已锁定约 60% 的 TSMC CoWoS 先进封装产能，形成供给分配护城河。

              AMD 是唯一有实质意义的商用替代方，2026 年凭 MI300X/MI355X 产品持有约 6–10% 的 AI 加速器收入。超大规模云厂商的自研芯片（Google TPU v5p/Trillium、AWS
              Trainium 2、Microsoft Maia 200、Meta MTIA v2）合计在 2026 年贡献 $25–50B+，但不对外销售。Intel Gaudi 3 在商用市场约占 1–3%。

              仅看 AI 推理，Nvidia 份额估计为 60–75%——显著低于其 90%+ 的训练主导地位——因为推理工作负载更能容忍替代架构，小模型可用 CPU
              推理，生产环境也比原始吞吐量更看重经济性优化。这个推理空白是 SambaNova 最主要的商业机会。

              SambaNova 的 SN50 芯片（2026 年 2 月 24 日发布）声称，在智能体推理工作负载上，相比 Nvidia Blackwell B200 最高速度达 5x、总拥有成本低 3x；依据是对
              Llama 3.3 70B、GPT-OSS 120B 和 DeepSeek 671B 等模型的内部基准测试。截至本报告时间，这些主张尚未在生产环境中获得独立验证。Futurum 的分析师评估指出，“NVIDIA
              的推理软件生态、超大规模云平台集成，以及面向推理模型的工作负载优化，形成了切换成本和惯性；专用推理芯片必须拿出可证明的经济优势才能突破。”

              Intel-SambaNova 多年期合作（2026 年 2 月 24 日宣布）借助 Intel 的全球企业、云和伙伴渠道延伸 SambaNova 触达，缓解过去限制半导体初创公司的分销瓶颈。SoftBank
              Corp. 在日本主权 AI 数据中心部署 SN50，验证了主权 AI 板块可成为近期收入路径；但除主权部署外，更广泛的企业采用仍未得到证明。
