              Facility（LCCF）所在地。RIKEN Center for Computational Science（日本）在 2024 年采用 SambaNova DataScale，并将 Fugaku-LLM
              接入 SambaNova 的 Samba-1 CoE 平台。Carahsoft 已将 SambaNova 列入联邦、州和地方政府合同，以便机构采购。Procurely 数据显示，州级奖项有 3 项，记录总价值约
