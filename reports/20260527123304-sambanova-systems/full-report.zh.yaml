      - number: '1.2'
        title: 管理层、创始人与治理
        blocks:
          - type: paragraph
            body: >
              SambaNova 由三位背景互补的人士共同创立：学术 AI 研究叠加产业芯片落地，创始人和 AI 系统市场匹配度较强。CEO Rodrigo Liang 曾任 Oracle（前 Sun
              Microsystems）高级副总裁，负责约 1,000 名芯片设计师团队，横跨 12 代主要处理器。CTO Kunle Olukotun 是 Stanford University
              电气工程与计算机科学教授，以开创 Niagara 芯片的多核处理器设计而闻名。第三位联合创始人 Christopher Ré 是 Stanford 计算机科学副教授、机器学习系统专家，也共同创办了 Snorkel
              AI。治理层面的隐患在于 Intel CEO Lip-Bu Tan 的角色：自 SambaNova 2017 年创立以来，他一直担任公司执行董事长。Tan 的风险投资机构 Walden International
              领投了 A 轮，Intel Capital 也是投资方。2025 年底 Intel 与 SambaNova 讨论收购时，这种交叉治理安排引发了重大利益冲突问题。Tan 回避了相关讨论，由 Intel
              数据中心负责人 Kevork Kechichian 代表 Intel 牵头。关键人风险较高：Liang（产品和战略）与 Olukotun（技术路线图）都掌握深厚机构知识，而公开披露中几乎没有继任规划。除
              Lip-Bu Tan 外，董事会构成未公开详述。
