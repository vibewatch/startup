  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计 ARR 与收入结构
        - 经审计拆分云 API、硬件、服务 ARR；按队列拆分 NRR
        - 估值完全取决于 ARR 质量；没有审计，$100M–$180M 区间无法验证，NRR 可能掩盖流失
        - 向管理层索取；第三方收入审计机构
      - - 官方 Series E 投后估值
        - 公司披露官方投后估值和股数
        - 解决 $2.34B（新股价格）与 $4.8B（聚合方）之间的冲突；影响倍数计算和优先股分配瀑布
        - SambaNova 投资者关系；法律顾问（WSGR）交易文件
      - - 优先股分配瀑布和股权结构表
        - 完整股权结构表，按轮次和优先级列出清算优先权堆叠
        - 退出估值低于 $5.1B 时，普通股一文不值；理解 Series D 优先权决定 E-1 投资人在 M&A/困境情景下的回收
        - 向管理层索取；二级市场数据提供方（Forge、EquityZen）
      - - 按收入流拆分毛利率
        - 硬件毛利率、云 API 毛利率、服务毛利率
        - 综合毛利率决定盈利路径；当前规模下硬件毛利率可能为负，压缩总回报潜力
        - 向管理层索取；可比硬件公司基准（以 Cerebras S-1 为参考）
      - - SN50 客户管线和已承诺订单
        - SN50 具名管线、已承诺订单和收入确认时间表
        - 乐观情景取决于 SN50 爬坡；没有已承诺订单，时间表只是推测
        - 审阅销售管线；访谈核查 Intel 联合销售管线
      - - Intel 合作条款和排他性
        - Intel 合作的商业条款、排他条款和收入分成结构
        - 合作是关键价值驱动；如果 Intel 可以退出或转向，战略价值会迅速被侵蚀
        - 法律审阅合作协议；向 Intel IR 核实披露
    notes: 六项尽调均为只能通过私有证据解决的缺口，公开来源无法解决。每一项都对投资建议和估值立场具有重要性。
