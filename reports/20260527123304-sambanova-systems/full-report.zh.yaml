      - number: '5.4'
        title: 开发者生态与集成
        blocks:
          - type: paragraph
            body: >
              以硬件公司而言，SambaNova 保持了相当活跃的开源开发者足迹。GitHub 上的 ai-starter-kit 仓库提供开源 Python 示例，分为四类：数据摄取与准备、模型开发与优化、智能信息检索、高级
              AI 能力。示例 kit 覆盖企业知识检索（RAG）、基准测试、金融助手、函数调用、自定义聊天模板和多模态知识检索。该 kit 同时支持 SambaCloud API 访问（通过
              SAMBANOVA_API_KEY）和本地 SambaStack 端点集成。

              PyPI 上的官方 sambanova Python SDK（pip install sambanova）要求 Python 3.9+，通过 httpx 暴露同步和异步客户端，并可选 aiohttp
              作为高并发后端。SDK 覆盖聊天补全、Responses API、流式传输（SSE）、文件上传（音频转写）、通过 Pydantic 的类型化请求 / 响应模型、指数退避自动重试，以及完整错误层级。公开 PyPI
              文档没有明确写出撰写时的软件包版本，但项目仍在活跃维护。SambaNova 的 HuggingFace 组织（sambanovasystems）托管 32 个模型检查点，包括 SambaLingo
              多语言变体（阿拉伯语、土耳其语、匈牙利语、泰语，规模为 7B 和 70B）以及 QwQ-0.5B-SFT 架构的草稿模型。

              相对 SambaNova 的体量，集成生态覆盖面不小：AI Starter Kit 文档列出了
              LangChain（langchain-sambanova）、LlamaIndex、CrewAI、AutoGen、OpenRouter、n8n、AWS 以及约 50 个第三方集成。OpenAI
              兼容端点意味着现有代码库只需改 base URL 和 API
              key，就能切换推理供应商，不必重写客户端代码。速率限制和上下文窗口随层级（Free、Developer、Enterprise）变化，Enterprise 为生产工作负载提供专属支持和更高速率限制。
