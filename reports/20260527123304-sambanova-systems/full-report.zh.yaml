      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              企业 AI 推理最关键的增长驱动，是推理迁移本身：随着生成式和智能体 AI 从试点进入生产，推理工作负载的规模和成本会复合增长。到 2026 年，推理预计占部署后 AI 系统全生命周期成本的 80–90%。智能体
              AI 的兴起——自主、多步骤推理流水线，按顺序多次调用模型——进一步放大低延迟推理需求，因为工具调用链条越长，延迟会乘数式叠加。Futurum 的分析师评估指出，这会形成经济张力：为训练吞吐量优化的 GPU
              架构，很难以企业可扩展的经济性提供智能体推理速度，也就创造了 SambaNova 想打的空白地带。

              主权 AI 监管是结构性需求驱动。EU AI Act、Korea's AI Framework Act（2026 年 1 月生效）、China's Generative AI Regulations 以及 US
              Executive Order 14179，共同施加数据治理要求，使高风险应用在受监管行业完全基于云的 AI 变得困难。Polyglotsoft 记录称，McKinsey 2025 年调查中，67%
              的企业将敏感数据暴露列为采用 AI 的首要担忧。CloudLatitude 报道，AWS 于 2026 年推出 European Sovereign Cloud；美国 FedRAMP 20x
              项目正在为联邦云提供商敲定安全认证——这些都确认了主权和本地部署的监管顺风。

              约束端，电力可得性已经取代预算，成为扩张 AI 基础设施的首要障碍。Flexential 2026 State of AI Infrastructure Survey（350+ 名企业 IT 领导者）发现，89%
              受访者称稳定电网电力会影响 AI 部署决策，55% 将电力成本差异列为 AI 工作负载选址的最重要因素。AI 数据中心所需电力是电网年度新增量的 4x，形成物理部署天花板。预计一年内获得可衡量 AI
              财务回报的企业比例，在 2025 到 2026 年调查间从 51% 降至 36%，说明基础设施成本上升后 ROI 周期正在拉长。

              CUDA 生态锁定是 GPU 替代架构最主要的切换成本障碍。Nvidia 的 CUDA 生态已有 20+ 年积累和 4M+ 开发者；所有主流 ML 框架都优先针对 CUDA 优化。切换到替代架构——包括
              SambaNova 的 RDU——需要以数月到数年计的软件重构投入，而不只是硬件支出。此外，62% 的组织尚未把 AI 项目推进到试点之后，哪些推理工作负载会真正放大并支撑基础设施投资决策，仍有不确定性。

              超大规模云厂商资本开支是大市场的结构性顺风，但也是商用芯片厂商的竞争压力：预计超大规模云厂商将在 2026 年把资本开支提高约 40% 至
              ~$600B，但越来越多资金流向自用定制芯片，直接减少它们从商用芯片厂商采购的可服务市场。美国-中国出口管制移除了 $5–10B 可服务 Nvidia
              收入，带来地缘政治复杂性，也在部分主权市场催生了对非美国替代方案的需求。
