      - number: '3.4'
        title: 超大规模云定制芯片——AWS Trainium 与 Google TPU
        blocks:
          - type: paragraph
            body: >-
              AWS Trainium 和 Google Cloud TPU 代表非 NVIDIA 推理市场中出货量最高的板块，但它们在结构上无法触达本地买方，并会施加深度云锁定。AWS Trainium3（3nm；每芯片
              2.52 PFLOPS FP8）相较基于 GPU 的 EC2 P5e/P5en 实例，价格性能比高 30–40%，Anthropic、Databricks 和 Decart 用其进行前沿模型推理。AWS
              Neuron SDK 要求模型移植，并与 SageMaker、EKS 和 ECS 紧密集成，形成一种本地部署无法复刻的云原生部署。Trn3 UltraServers（最高 144
              芯片）面向最高吞吐训练，以及推理模型的推理工作负载。Google Cloud TPU Ironwood（第 7 代）在 9,216 颗液冷芯片组成的 pod 中达到 42.5 ExaFlops，相比前代
              Trillium 每芯片性能提升 4x。即将推出的 TPU 8i 面向低延迟 MoE 推理，单位美元性能较前代提升 80%。Google TPUs 大规模支撑 Gemini 和 Google 全部消费者 AI
              应用，给 Google 带来无可匹敌的生产验证。Google XLA 生态（JAX、TF）给 PyTorch 原生企业团队设置了有意义的迁移门槛。对 SambaNova
              来说，超大规模云厂商既是竞争威胁（面向云推理买方），也是间接验证：需要数据主权、涉密环境或风冷本地部署的企业无法使用 AWS Trainium 或 Google TPU——这一板块正是 SambaNova
              及其主权 AI 合作（Australia SCX、Germany Infecom、UK Argyll、Japan SoftBank）的定位。2026 年推理约占全部 AI 计算的三分之二，因此即便主权细分市场能让
              SambaNova 避开最直接替代，超大规模云定制芯片仍是越来越大的竞争压力。
