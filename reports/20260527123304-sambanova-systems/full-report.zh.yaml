      - number: '2.2'
        title: 市场规模——TAM、SAM 与多重分析口径
        blocks:
          - type: paragraph
            body: >
              全球 AI 芯片和加速器市场的 2026 年估计，因市场边界不同相差 2–3x，单一 TAM 数字容易误导。SambaNova 应采用哪种规模口径，取决于它真正瞄准的板块：企业和主权场景的本地 AI
              推理硬件与系统，而不是完整半导体市场。

              最宽的 TAM 估计是 Deloitte 更新后的 2026 年全球 AI 芯片 $500B。该数字在 2026 年春季从最初 $300B 上调，原因是 WSTS 报告 2025 年 12 月全球半导体市场上修
              $175B，增量完全由 AI 需求驱动。IDC（2026 年 4 月）预计 2026 年半导体总收入为 $1.29T，其中数据中心半导体收入为 $477.1B；“智能数据中心”板块（CPU + AI 加速器 +
              GPU + ASIC + 网络）为 $281B。到 2030 年，IDC 预计数据中心半导体将达到 $843B，总半导体收入达到 $1.75T。

              AMD CEO Lisa Su（Reuters，2025 年 11 月）预计 AI 数据中心芯片市场将在 2028 年超过 $500B，并在 2030 年增至 $1 trillion。IDC、Gartner
              或其他独立分析机构并未在这一时间维度上佐证该数字；该数字似乎也覆盖了比单纯商用芯片更宽的定义——这说明，厂商口径 TAM 需要先审边界。

              仅看推理子市场，Fortune Business Insights 估计 2026 年 AI 推理市场为 $117.8B–$126.2B，CAGR 约 17–19%。MarketsAndMarkets 预计
              2026 年也在相近区间（$119–$126B）。推理约占 AI 计算周期的三分之二，也占部署后 AI 系统全生命周期成本的 80–90%；即便训练芯片单价更高，推理仍是最大的运营支出类别。

              SambaNova 的可服务市场——企业和主权场景的本地及伙伴云 AI 推理——是 $200B+ 商用加速器市场和 $120B+ AI
              推理市场的一个子集。公司目前不服务超大规模云厂商内部资本开支板块（那里由自研芯片主导），也不服务消费设备边缘市场。对 SambaNova 所在板块（不含超大规模云厂商自用的企业推理硬件）做保守 SAM
              估计，2026 年全球约 $30–$60B；该数字基于将约 ~20–30% 的企业占比套用到 $200B 加速器市场，且不确定性很高。
