tables:
  - id: TR001
    title: "Regulatory / legal risk register"
    claimRefs:
      - CR025
      - CR027
      - CR028
      - CR032
      - CR035
      - CR046
    notes: >
      Partial coverage: compiled from public legal analyses (Finnegan, Mayer Brown), regulatory
      filings (WARNScan), Wilson Sonsini engagement disclosures, and SEC Form D filings. Formal DCSA
      FOCI determination, Intel partnership IP terms, Stanford IP licensing, and litigation history
      are not publicly confirmed and are noted as open gaps.
    enumerationScope:
      coverage: partial
      basis: >
        Register compiled from BIS final rule analysis (Finnegan, Mayer Brown), WARN Act
        public filing (WARNScan), Wilson Sonsini engagement disclosures, DCSA FOCI framework
        guidelines, SEC Form D filings, and press reporting. Classified contract details,
        specific FOCI investor identities, and litigation history are unavailable in public records.
    columns:
      - Risk ID
      - Risk Category
      - Description
      - Status
      - Primary Evidence
    rows:
      - - RG-1
        - Export Controls
        - "BIS May 2026 rule: SN50 likely subject to TPP license threshold; restricts Gulf/SEA sales"
        - Active / material
        - SR001, SR002
      - - RG-2
        - FOCI Review
        - "Non-U.S. Series E investors may trigger DCSA FOCI review; WSGR NS&T practice engaged"
        - Active / unresolved
        - SR003, SR028
      - - RG-3
        - WARN Act
        - "California WARN Act notice filed for ~150-employee reduction in 2024–25"
        - Closed / resolved
        - SR004, SR013
      - - RG-4
        - Governance Conflict
        - "Intel CEO Lip-Bu Tan on SambaNova board; foundry and acquisition conflict unresolved"
        - Active / material
        - SR006, SR007
      - - RG-5
        - IP Ownership
        - "Stanford co-founders; IP assignment and licensing terms not publicly confirmed"
        - Open / unverified
        - SR029
      - - RG-6
        - Down-round Dilution
        - "Series E at $2.4B (–53% from 2021 peak); further down-round risk if SN50 misses"
        - Active / material
        - SR028, SR018
      - - RG-7
        - BIS License Compliance
        - "No confirmed BIS license applications for Gulf/SEA SN50 sales as of May 2026"
        - Open / monitoring
        - SR001, SR002
      - - RG-8
        - Litigation
        - "No active litigation or SEC enforcement actions confirmed in public records (May 2026)"
        - Low / unconfirmed
        - SR029, SR018

