        awareness, but not the resolution or specific investor identities. This limits verification
        of whether SambaNova's classified contract eligibility is fully protected. The regulatory
        legal risk register (TR001) is therefore partial rather than exhaustive.
      relatedQuestionRefs:
        - QR008
      relatedTableRefs:
        - TR001
    - topic: secondary-foundry-arrangement-unconfirmed
      description: >
        SambaNova has not publicly confirmed any secondary foundry agreement with Intel Foundry
        Services or any other fab, leaving the TSMC single-source dependency unmitigated in
        public disclosure. QR012 cannot be resolved without company confirmation.
      relatedQuestionRefs:
        - QR012
    - topic: stanford-ip-ownership-unverified
      description: >
        The co-founders are Stanford faculty inventors. Stanford's standard IP assignment policies
        could result in university licensing obligations on foundational RDU patents. No public
        disclosure of IP ownership arrangements or Stanford licensing agreements has been identified,
        leaving QR009 unresolved.
      relatedQuestionRefs:
        - QR009
    - topic: customer-concentration-revenue-quantification-unavailable
      description: >
        The precise revenue share of SambaNova's top three government customers is not publicly
        disclosed. DOE contract databases confirm relationships but not dollar values or renewal
        terms. QR018 cannot be resolved without FOIA requests or data room access.
      relatedQuestionRefs:
        - QR018
    - topic: intel-partnership-terms-confidential
      description: >
        The specific financial and IP terms of any SambaNova-Intel foundry partnership are
        confidential and not publicly disclosed. Lip-Bu Tan's dual-role conflict and the potential
        foundry relationship remain opaque, leaving QR016 unresolved.
      relatedQuestionRefs:
        - QR016

