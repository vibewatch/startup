company:
  name: SambaNova Systems

chapter:
  number: 7
  title: Risks
  summary: >
    SambaNova Systems faces a cluster of reinforcing risks that, taken together, could constrain its
    path to viability as a standalone AI infrastructure company. The gravest are structural: Nvidia's
    near-monopoly on AI training and the CUDA software ecosystem means SambaNova must continually
    prove inference-only superiority, while sole-source TSMC manufacturing creates a single point of
    catastrophic supply failure. A 60–80% U.S. government revenue concentration, principally in DOE
    national-laboratory supercomputing programs, exposes the company to federal budget cycles and FOCI
    regulatory scrutiny. A valuation re-rating from a 2021 peak near $5 billion to roughly $2.4 billion
    in its February 2026 Series E confirms capital-market skepticism, raising the cost of future rounds.
    Governance conflicts—Intel CEO Lip-Bu Tan sits on both SambaNova's board and leads a direct
    competitor—add an unusual layer of strategic opacity. New BIS export-control rules that took effect
    in May 2026 restrict SambaNova's addressable international market. Unconfirmed Intel acquisition
    talks in 2025 and a workforce reduction of approximately 150 employees signal execution pressure.
    SN50 delivery timelines and benchmark claims remain partially unverified. These exposures make
    SambaNova a high-variance bet requiring close monitoring of SN50 commercial ramp, government-budget
    developments, and board governance.

