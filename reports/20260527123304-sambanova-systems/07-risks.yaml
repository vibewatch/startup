sections:
  - id: market-competition-risk
    title: Market & Competitive Risk
    body: >
      SambaNova operates in an AI chip landscape dominated by Nvidia, which held roughly 70–80% of
      datacenter GPU revenue in 2025. Nvidia's CUDA ecosystem—more than a decade of software investment
      and community lock-in—creates asymmetric switching costs: enterprises running PyTorch, NCCL, and
      RAPIDS on Nvidia hardware face significant re-engineering to adopt SambaNova's SambaFlow stack.
      This lock-in is structural rather than accidental; CUDA now encompasses compiler toolchains,
      profiling tools, pre-trained model registries, and MLOps integrations that no challenger has
      fully replicated. Groq secured a $1.5 billion sovereign AI partnership in 2024–25; Cerebras
      raised $1.1 billion at an $8.1 billion valuation. SambaNova claims the SN50 chip delivers
      "5× better performance per watt" versus a Nvidia B200 configuration but independent benchmarks
      remain unavailable. Forbes described the competitive dynamics as likely producing only one large
      winner among Groq, Cerebras, and SambaNova by 2026–2027, heightening existential stakes.
    figureRefs:
      - FR001

  - id: operational-supply-risk
    title: Operational, Supply Chain & Technical Risk
    body: >
      SambaNova's hardware roadmap depends entirely on TSMC for silicon manufacturing. TSMC's dominant
      market position means that any geopolitical disruption—most critically a Taiwan Strait conflict or
      a U.S.-China escalation affecting TSMC's access to ASML EUV equipment—could halt SambaNova's chip
      supply with no qualified fallback. SambaNova packages its RDU chips using HBM2E, sourcing from a
      concentrated set of DRAM suppliers. The company's stated mitigation is to evaluate Intel's foundry
      ecosystem as a secondary fab, but Intel Foundry Services has not demonstrated volume production of
      AI chip designs at competitive yields for any external customer. SN50 chip tape-out and volume ramp
      timelines have not been publicly disclosed; given typical TSMC advanced-node tape-out-to-volume
      schedules of 12–18 months, any delay would compress the competitive window against Nvidia's B200
      and B300 successor roadmap. SambaFlow software stack reliability and AI-specific security
      certification also remain unverified by independent third parties.
    tableRefs:
      - TR002

  - id: partner-dependency-risk
    title: Partner, Dependency & Customer Concentration Risk
    body: >
      SambaNova's primary disclosed customers—Argonne National Laboratory, Lawrence Livermore, Lawrence
      Berkeley, Oak Ridge, and Los Alamos National Laboratories—are all part of the DOE/NNSA system,
      creating a 60–80% estimated government revenue concentration. This extreme dependence means a
      single federal budget event or FOCI adverse determination could simultaneously affect multiple
      customer accounts. SoftBank is the most significant disclosed commercial customer, but contract
      terms and revenue volume were not disclosed, limiting confidence in commercial diversification
      claims. TSMC and HBM suppliers constitute structural manufacturing dependencies with no confirmed
      mitigation, while Vista Equity Partners provides the primary capital relationship as Series E lead.
      A DOE budget sequestration, FOCI adverse determination, or SoftBank contract termination could
      each individually cause a material revenue shock without near-term commercial offset.
    tableRefs:
      - TR003
    figureRefs:
      - FR003

  - id: financial-governance-risk
    title: Financial, Capital & Governance Risk
    body: >
      SambaNova's February 2026 Series E valued the company at approximately $2.4 billion—a 53% nominal
      markdown from the $5.1 billion peak Series D valuation in 2021. AI chip hardware startups are
      capital-intensive: SVB's 2025 research estimated median burn multiples of 2.0–3.0× for
      hardware-stage AI companies. SambaNova's total capital raised is approximately $1.49 billion with
      no publicly disclosed revenue. Governance risk is elevated by Intel CEO Lip-Bu Tan's dual role as
      a SambaNova board member, creating fiduciary conflicts in Intel foundry decisions and potential
      Intel acquisition discussions. If a subsequent round requires a down-round, liquidation preference
      structures could eliminate common equity for employees hired during the 2019–2022 peak era.
    tableRefs:
      - TR001
    figureRefs:
      - FR002

  - id: people-execution-regulatory-risk
    title: People, Execution & Regulatory Risk
    body: >
      A workforce reduction of approximately 150 employees (roughly 15–20% of headcount) in 2024–2025
      targeted engineering, sales, and operations roles, and a WARN Act notice filing confirms the
      reduction reached the statutory threshold. Key-person risk is significant: CEO Rodrigo Liang, CTO
      Kunle Olukotun, and Chief Scientist Christopher Ré are the public faces of technical
      differentiation. Ré's departure to an academic role or competitor would remove a visible signal
      of research credibility. In May 2026, BIS published revised export control rules targeting
      advanced AI chips; SambaNova's SN50 is likely subject to these controls, restricting sales to
      certain non-allied geographies. Wilson Sonsini's engagement of its national security and
      technology practice for the Series E closing signals FOCI compliance requirements.
    tableRefs:
      - TR004
      - TR005

