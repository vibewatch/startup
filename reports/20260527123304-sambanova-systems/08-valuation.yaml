  - id: investment-thesis-bull-bear
    title: Investment Thesis — Bull, Base, and Bear Cases
    body: >-
      The bull case rests on three pillars: (1) the SN50's claimed 5x performance
      improvement over the SN40 and 3x cost advantage vs. GPUs enables SambaNova to capture
      a meaningful slice of the $200B+ AI accelerator TAM from Nvidia; (2) ARR growing 4x
      in 2024 and likely to surpass $180M in 2026 implies a trajectory toward $500M+ ARR
      by 2028 on a similar growth curve; (3) the Intel strategic partnership provides
      distribution, manufacturing scale, and co-marketing reach that could collapse go-to-market
      costs. If SambaNova achieves $500M ARR by 2028 and trades at 20x revenue, the exit
      valuation is $10B — a 4x return on Series E-1 investment.

      The base case assumes SambaNova grows ARR at 50–70% annually, reaching $400M by 2028.
      At 15x revenue the valuation is $6B, implying a 2.5x return on E-1 pricing. This
      requires successful SN50 ramp, continued sovereign AI contract wins, and execution
      on the Intel partnership — achievable but not guaranteed.

      The bear case assumes Nvidia deepens its software-hardware moat, customer pilots fail
      to convert at scale, and the SN50 faces manufacturing delays. Revenue plateaus at
      ~$150–200M ARR with no path to profitability. At 8–10x revenue (secondary market
      discount), the company is worth $1.2–$2B — implying breakeven to moderate loss for
      Series E-1 investors. The failed 2025 sale process, deep capital consumption, and
      Cerebras's superior execution profile all support this risk scenario.

      The key swing factors: SN50 deployment velocity (the Intel deal is meant to
      accelerate this), SoftBank Japan ramp (the first disclosed SN50 customer), and
      whether SambaNova can convert its sovereign AI pipeline into recurring cloud
      subscriptions at sufficient scale to demonstrate net revenue retention above 100%.
