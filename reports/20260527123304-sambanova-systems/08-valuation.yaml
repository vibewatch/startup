callouts:
  - calloutType: risk
    title: Valuation Data Conflict — $2.34B vs. $4.8B
    body: >-
      Primary share-price data (Yahoo Finance/Forge; Series E-1 at $30.99/share) implies
      a post-money valuation of approximately $2.34B. Third-party aggregators including
      Tracxn and user-context data cite $4.8B — more than double. Until SambaNova discloses
      official round documentation, the $4.8B figure should be treated as unverified and
      potentially reflecting a different instrument class (e.g., pre-money, fully diluted
      on different share count, or including future commitments). Investors should not anchor
      to $4.8B without confirmation from counsel.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005

  - calloutType: risk
    title: Down Round, Preference Overhang, and Common Equity Risk
    body: >-
      The Series E-1 at ~$2.34B represents a 54% decline from the 2021 Series D at $5.11B.
      The preference stack from the Series D ($676M raised at $95.02/share) creates a
      substantial waterfall that must be cleared before any sub-$5.11B exit returns value
      to earlier common holders. Series E investors at E-1 pricing are structurally senior
      to earlier common stock but must still navigate anti-dilution provisions and the
      secondary market discount. Secondary market entry at $1.44B provides a more attractive
      buffer against the preference stack.
    claimRefs:
      - CV004
      - CV008
      - CV025
      - CV039
      - CV040

  - calloutType: recommendation
    title: Research-More — Secondary Entry at $1.44B Merits Revisit
    body: >-
      The primary recommendation is research-more at the Series E-1 price (~$2.34B). The
      secondary market price of ~$1.44B (Forge, May 2026) implies an ~8x ARR multiple
      that is below sector median and more commensurate with execution risk. If an investor
      can access secondary shares at or near the $1.44B implied price with appropriate
      governance rights and information access, the risk-reward is more attractive — though
      still dependent on SN50 ramp, Intel partnership execution, and NRR confirmation.
    claimRefs:
      - CV002
      - CV003
      - CV012
      - CV013
      - CV028
      - CV041

