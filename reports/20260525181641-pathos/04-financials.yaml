        - Needed to determine whether any revenue is recurring, milestone-based, or one-time
        - No public revenue line disclosed
        - Request audited P&L and policy memo by stream
        - Critical
      - - Inbound partnership economics
        - Needed to test whether collaborations create cash inflow or only strategic optics
        - Only outbound Tempus fee is disclosed publicly
        - Request contract summaries with upfronts, milestones, royalties, and revenue share
        - Critical
      - - Gross margin / cost per asset
        - Needed to judge unit economics and path to profitability
        - No public gross-profit or asset-cost disclosure
        - Request gross margin bridge and asset-level spend by program
        - Critical
      - - Series D investor identities and security terms
        - Needed to understand cap-table quality and future signaling
        - Generic 'new and existing investors' wording only
        - Request investor list, share class, price per share, and preference stack
        - High
      - - Cap table and ownership concentration
        - Needed to evaluate dilution, governance, and follow-on capacity
        - No public ownership schedule
        - Request fully diluted cap table and board rights summary
        - High
      - - Sales-efficiency / BD funnel metrics
        - Needed to translate partner interest into a financeable revenue outlook
        - Fundraising and partner logos act as rough proxies only
        - Request funnel conversion, cycle time, pipeline, and counterparties by stage
        - Medium
      - - Asset-level capital allocation
        - Needed to understand whether the platform is improving capital efficiency or merely adding programs
        - Four public portfolio decisions/assets and rough $/asset proxy
        - Request spend by asset, by platform, and by acquisition / licensing bucket
        - Medium
    notes: >-
      These are not edge-case asks; they are the minimum private-company disclosures required to move from narrative
      confidence to modelable financial conviction.
