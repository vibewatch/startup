callouts:
  - calloutType: risk
    title: Public economics show Pathos paying partners before it shows Pathos earning revenue
    body: >-
      The $200 million Tempus fee commitment is the clearest disclosed collaboration economics in the record. Until
      Pathos discloses inbound fees, milestones, royalties, or recognized revenue, public underwriting has to treat the
      platform's economic promise as strategic optionality rather than proven monetization.
    claimRefs:
      - CI009
      - CI016
      - CI047

  - calloutType: risk
    title: Runway is still a scenario, not a verified number
    body: >-
      The Series D is large, but investors still do not know Pathos's closing cash balance, actual burn, or the payment
      schedule for the Tempus commitment. That makes 18-36 months a directional framework rather than a verified runway.
    claimRefs:
      - CI033
      - CI034
      - CI035
      - CI049

  - calloutType: insight
    title: Capital efficiency is respectable on financing size, but hard to prove on outcomes
    body: >-
      Roughly $467 million of cumulative financing and about four public portfolio decisions imply around $117 million of
      capital per disclosed asset. That is not obviously excessive for oncology development, but it is still a very rough
      proxy because Pathos has not published asset-level spend or realized economic returns.
    claimRefs:
      - CI037
      - CI039
      - CI052

  - calloutType: recommendation
    title: The next diligence step is a cash bridge, not another market narrative
    body: >-
      To move from a story about AI-enabled drug development to a financeable model, Pathos should provide: closing cash,
      monthly burn by function, the Tempus payment schedule, revenue-recognition detail, and the Series D cap table with
      investor names and preference terms.
    claimRefs:
      - CI048
      - CI049
      - CI050
      - CI051
      - CI053

