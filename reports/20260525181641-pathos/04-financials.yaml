company:
  name: Pathos
chapter:
  number: 4
  title: Financials
  summary: >-
    Pathos has publicly disclosed about $467 million of equity financing across its 2023, 2024, and 2025 rounds,
    culminating in a $365 million Series D at an approximately $1.6 billion post-money valuation. Public evidence still
    reads as effectively pre-revenue: no ARR, revenue mix, pricing, cash balance, gross margin, or realized partnership
    inflows are disclosed, while the clearest hard economics are a $200 million Tempus fee commitment and peer burn
    benchmarks that imply Pathos remains capital intensive even after the Series D.
sections:
  - id: funding-history-and-capital-adequacy
    title: Funding History and Capital Adequacy
    body: >-
      Financial underwriting for Pathos starts with financing, not income statement quality, because the company has not
      published financial statements or a public cash balance. The capital record is nevertheless unusually well anchored
      for a private biotech. Pathos announced a $62 million Series C in October 2024 at a $600 million post-money
      valuation and a $365 million Series D in May 2025 at roughly $1.6 billion post-money. The SEC Form D record under
      CIK 0001967854 corroborates all three exempt offerings tied to the company: a 2023 filing with roughly a $40
      million total offering, a 2024 filing matching the Series C scale, and a 2025 filing showing a $399,999,933 total
      offering with $282,999,950 sold to 11 investors as of filing. That combination gives unusually strong primary-tier
      evidence for the core funding chronology.

      The more important underwriting question is forward capital adequacy. Pathos disclosed that the Series D proceeds
      would fund the clinical pipeline and continued investment in the oncology foundation model, while the April 2025
      Tempus/AstraZeneca announcement separately disclosed $200 million of fees payable to Tempus. No debt, warehouse
      facility, or project-finance obligation surfaced in the reviewed official and filing sources, so the balance sheet
      appears equity financed. But absent a closing cash balance, investors cannot tell how much of the prior capital base
      remained when the Series D closed, how quickly the Tempus commitment is paid, or what capital has already been
      committed to asset acquisitions and trial execution. The chapter therefore treats financing history as verified and
      cash sufficiency as estimated.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
