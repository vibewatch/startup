tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current status
      - Revenue quality
      - Diligence ask
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly inferable monetization avenues for Pathos as of 2026-05-25, compiled from company announcements,
        partnership disclosures, and sector comparables. Pathos has not published an official revenue breakdown.
    rows:
      - - Asset out-licensing / co-development
        - Upfront fees plus downstream development and regulatory milestones when a Pathos-controlled asset is partnered
        - Per asset deal
        - Plausible future stream; no public Pathos deal economics disclosed
        - Potentially high margin, but currently unverified
        - Request executed term sheets and historical BD pipeline by asset
      - - Royalties on commercialized assets
        - Percentage of future net sales after approval and launch by a partner or acquirer
        - '% of net sales'
        - Future only; no royalty schedule disclosed
        - Attractive long-tail economics if assets succeed, but entirely hypothetical publicly
        - Request royalty ranges, step-downs, and territory carve-outs
      - - Clinical development partnerships
        - Shared-development or option-style agreements with pharma counterparties
        - Per collaboration
        - Partnerships disclosed, inbound Pathos economics undisclosed
        - Could diversify risk, but public record does not show realized cash inflows
        - Request collaboration summaries with upfront, milestone, and cost-share terms
      - - AI / trial-design services
        - Service or software fees for trial design, biomarker analysis, or portfolio analytics
        - Per project or subscription
        - No public pricing, contracts, or revenue evidence
        - Currently unproven as a monetized business line
        - Request SOWs, price cards, and billable-customer count
      - - Internal asset value realization
        - Monetization through sale, spinout, or partnering of internally advanced assets
        - Per transaction
        - Pipeline-building underway; no public exits disclosed
        - Lumpy and event-driven rather than recurring
        - Request asset-level monetization plan and timing assumptions
      - - Foundation-model economics
        - Potential future revenue share or licensing tied to shared oncology model outputs
        - Unspecified
        - Collaboration exists; revenue split and ownership are undisclosed
        - High theoretical optionality but no public economics today
        - Request IP ownership matrix and downstream economic rights schedule
    notes: >-
      The public record supports future monetization pathways, not current recognized revenue. The clearest disclosed
      economics are outbound fees to Tempus rather than inbound revenue to Pathos.
    claimRefs:
