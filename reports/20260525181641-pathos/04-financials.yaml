  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: current-cash-and-runway
      missingEvidence: Exact closing cash balance, restricted cash, monthly net burn, and the payment schedule tied to the disclosed $200 million Tempus commitment.
      whyItMatters: Without those figures, runway can only be estimated from peer benchmarks rather than verified from Pathos' own treasury position.
      diligencePath: Request the Series D close statement, current treasury balances, 24-month cash bridge, and the executed Tempus payment schedule.
      relatedQuestionRefs:
        - QI016
      relatedTableRefs:
        - TI004
    - type: private-evidence-only
      severity: material
      topic: revenue-mix-and-inbound-economics
      missingEvidence: Recognized revenue by stream, any inbound collaboration fees, milestone schedules, royalty rates, and revenue-recognition policy.
      whyItMatters: This is the difference between a strategic story and a modelable revenue base with discernible quality and durability.
      diligencePath: Request audited P&L by stream, signed collaboration summaries, and a memo explaining how Pathos recognizes any partner or service revenue.
      relatedQuestionRefs:
        - QI008
        - QI011
      relatedTableRefs:
        - TI001
        - TI002
    - type: private-evidence-only
      severity: material
      topic: gross-margin-and-program-costs
      missingEvidence: Gross margin, cost per program, platform versus pipeline spend split, and shared-services allocation methodology.
      whyItMatters: Margin path and capital efficiency cannot be underwritten while the company reports only fundraising facts and no cost accounting.
      diligencePath: Request gross-profit bridge, asset-level spend, and internal management reporting by program and function.
      relatedQuestionRefs:
        - QI013
        - QI024
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: material
      topic: series-d-investor-syndicate
      missingEvidence: Full Series D investor list, share class, price per share, liquidation preferences, and governance rights.
      whyItMatters: Syndicate quality, ownership concentration, and term-stack structure affect both future fundraising capacity and downside protection.
      diligencePath: Request the final capitalization table, financing documents, and board rights summary for the Series D.
      relatedQuestionRefs:
        - QI023
        - QI024
      relatedTableRefs:
        - TI004
        - TI005
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency-and-bd-funnel
      missingEvidence: Partner funnel, conversion rates, sales-cycle timing, commercial staffing, and any CAC-like spend tied to business development.
      whyItMatters: Public sources suggest Pathos sells through strategic partnerships rather than a broad commercial motion, but there is not enough data to judge scalability or efficiency.
      diligencePath: Request business-development pipeline reporting, contract cycle data, partner concentration, and staffing/budget by go-to-market function.
      relatedQuestionRefs:
        - QI012
        - QI024
      relatedTableRefs:
        - TI003
        - TI005
    - type: enumeration-incomplete
      severity: minor
      topic: asset-level-capital-allocation
      missingEvidence: Internal capital allocation by asset, including Rain / milademetan, pocenbrodib, P-500, DO-2, and platform-wide model development.
      whyItMatters: The rough $ per asset proxy is useful, but it cannot distinguish whether Pathos is genuinely improving capital efficiency or merely broadening scope.
      diligencePath: Request a management schedule showing historical and planned spend by asset, acquisition, and shared platform workstream.
      relatedQuestionRefs:
        - QI017
        - QI018
      relatedTableRefs:
        - TI004
        - TI005
