      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              多个结构性力量推动 AI 赋能肿瘤药物发现需求。药物开发失败率仍极高——肿瘤药从 Phase 1 到监管批准的成功率约 5%——因此商业上强烈希望用 AI 改善资产选择和试验设计（Springer 2025
              综述）。IQVIA 报告 2024 年肿瘤试验启动数 2,162 项（较 2019 年 +12%），2024 年全球上市 25 种新型肿瘤活性物质，2020–2024 年平均每年 26 种，高于
              2015–2019 年每年 16 种，显示管线生产率持续，也延续了对 AI 优化工具的需求。FDA 的 Real-World Evidence Framework（2018）及后续指南正式打开 RWE
              作为某些申报证据标准的通道，形成监管顺风。NGS 测序成本下降，使大规模多组学数据集能以更低单样本成本形成；NGS 市场预计从 2023 年 $12.98B 增长到 2035 年 $97.81B，CAGR
              18.3%。Tempus–AstraZeneca–Pathos AI 合作构建最大多模态肿瘤基础模型（2025 年 4 月，向 Tempus 合计支付 $200M）说明大型制药正在主动共同投资 AI
              数据基础设施。GrandView Research 预计，临床试验中的 AI 将因更快入组、合成对照臂和生物标志物入组标准需求而显著增长。采用约束既重大又持久。HIPAA（美国）和
              GDPR（欧盟）限制跨机构数据流；联邦学习等隐私保护架构（Owkin 使用）正在成为商业前提。既有平台 Tempus AI 和 Caris Life Sciences
              已锁定制药关系，切换成本很高：多年期纵向研究项目将平台数据嵌入各治疗项目，迁移既昂贵又缓慢。FDA 尚未为 AI
              生成的药物发现假设定义明确监管路径，给平台衍生候选药物带来审批路径不确定性。自研多模态数据集组装资本强度高——Pathos AI 的数据集成本未披露——且 Pathos 200+ petabyte
              数据集主张缺乏独立验证，构成尽调缺口。Springer（2025）综述还指出，肿瘤 AI 主要在单中心数据上进行回顾性验证，限制了真实世界泛化能力。
