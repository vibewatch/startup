      - number: '7.2'
        title: 法律、监管和数据风险始于隐私、同意和仍未稳定的 AI 问责
        blocks:
          - type: paragraph
            body: >-
              法律与监管栈是结构上最重要的风险区，因为它横跨 Pathos 的每个项目。HHS 明确表示，去标识化健康数据并非无风险；即便正确遵守隐私规则，剩余再识别风险仍然存在。这一点很重要，因为 Pathos
              的公开投资逻辑依赖大规模、与患者关联的肿瘤数据池，以及一个用 Tempus 数据构建的基础模型。如果监管机构、交易对手或企业客户对现有去标识化做法的舒适度下降，Pathos
              的核心训练和证据层可能变得更贵、更慢或更受约束。


              与此同时，肿瘤特定 AI 的问责仍未稳定。The ASCO Post 把 AI 辅助诊断和治疗的责任标准称为一个正在演进的问题；Springer
              综述则提示自动化偏差、知情同意、可解释性以及训练数据自身偏差。NCI 还增加了另一个采用约束：生物标志物检测很重要，但对多数患者并非例行流程，这意味着 Pathos
              的生物标志物牵引逻辑仍会撞上真实世界工作流摩擦。FDA 的 DTC 指南并非直接针对 Pathos，但它强化了一个总体判断：数据驱动健康工具的证据质量和监督差异很大。最终结果是，法律和监管风险不是 Pathos
              的边缘问题，而是核心商业模式的一部分。
