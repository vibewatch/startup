      - number: '6.4'
        title: 集中度与扩张：Pathos 可能赢下更多伙伴，但今天公开客户画像仍然狭窄
        blocks:
          - type: paragraph
            body: >-
              集中度风险很直接。Tempus 在公开证据中反复出现，既是数据供应方、模型构建合作者、试验赋能网络，也是最清晰的客户证据式文档来源。AstraZeneca
              是另一个主要已命名战略交易对手。除这两家之外，公开故事更多是一组交易或自有资产，而不是多元化付费用户名册。由于 Pathos 是私有公司，也不披露收入分成细节，公开证据无法按美元或账户量化集中度，只能做定性判断。


              扩张仍有可能。Pathos 现在有正在进行的自发起试验、第二个已有 Phase 1 信号的资产、新的 MET 项目和新到位的 Series D
              资本。如果公司能证明其生物标志物逻辑提高了入组或响应概率，下一步自然是更多药企合作和更多申办方级研究。但这个市场已经挤满了仪表化更好的肿瘤平台。Tempus、Caris、Foundation
              Medicine、Flatiron、ConcertAI、PathAI、Owkin 和 Recursion 都发布了更清晰的商业或使用信号。Pathos
              仍可能胜出，但在客户章节成为明确优势之前，它需要把已命名证据转化为更广泛、可衡量的客户基础。
