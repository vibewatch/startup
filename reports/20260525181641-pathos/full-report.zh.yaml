  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构：PathOS 是运营模型，不只是单一模型
        blocks:
          - type: paragraph
            body: >-
              Pathos 公开材料始终将公司描述为不只是一家拥有单一领先资产的传统生物技术公司。核心产品主张是名为 PathOS 的运营模型，它围绕共同肿瘤数据层和湿实验室反馈回路，整合
              Foundry、Scout、Sprint 三个命名引擎。Foundry 被定位为共享 AI 核心，让跨项目学习复利；Scout 从多模态证据中优先排序资产和患者亚群；Sprint
              是执行层，将选定资产从一个临床里程碑推进到下一个。对尽调而言，关键在于技术故事与资产故事不可分割：Pathos 要投资人相信，同一套数据和决策系统可以反复寻源、筛选并推进外部肿瘤资产，效果优于传统生物技术工作流。


              公开记录中最强证据是模块描述具体，且主页、平台页和管线页上的运营模型叙事保持一致。Pathos 声称可接入超过 200 petabytes 多模态肿瘤数据，并将其与生物标志物发现、患者选择和试验设计结合。外部
              Tempus 合作提供了重要的第二见证：Tempus 表示，其去标识化肿瘤数据将用于构建共享基础模型；Pathos 则表示，完成后的模型将在三方之间共享。因此，下方产品架构图和模块矩阵将 PathOS
              视为一套集成栈，包含外部数据依赖、内部 AI 决策和资产级执行，而不是独立软件 SKU。
