        title: 公开资产图谱：Pathos 通过授权和收购的肿瘤项目证明系统
        blocks:
          - type: paragraph
            body: >-
              公开管线较窄，但足够具体。Pathos 在管线页列出 pocenbrodib 和 P-500，2026 年公告则通过 DeuterOncology 收购新增 DO-2，并保留 2024 年要约收购完成后对
              Rain 的 milademetan 遗留所有权。Pocenbrodib 是最清楚的运营证明，因为 Pathos 已经将它推进到一项由 Pathos 发起、面向转移性去势抵抗性前列腺癌的 Phase 1b/2a
              研究。公司称，该研究结合单药和三条联合用药组，目标约 203 名患者，并直接建立在早期 FT-7051/COURAGE 经验之上。Tempus TIME 案例研究又提供了一个运营证明点：Pathos
              如何借助外部试验赋能网络，识别前 10 名入组患者中的 6 名。


              P-500 和 DO-2 很重要，因为它们展示了公司的收购逻辑。P-500 在此前 Phase 1 工作显示 IDH 阳性高级别胶质瘤信号后获得授权；DO-2 则在 2026 年被收购，原因是 Foundry
              据称基于机制、药代动力学和竞争定位将其提升为优先候选。这些资产不是随机添加；Pathos
              明确声称平台可以寻找被低估的临床阶段药物，把它们重新映射到更好的生物标志物定义人群，再通过更数据驱动的开发路径推进。这个主张足够可信，值得持续跟踪，但距离端到端证明仍很远，因为公开证据重在交易和试验启动里程碑，缺少闭环表现指标。
