      - number: '4.4'
        title: 估值背景与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              Pathos 披露的融资路径让它处于私营 AI 生物技术融资上层，但尚未达到品类最高端。按公开披露资本，Pathos 已融资约 $467 million，显著高于 Variational AI $5.5
              million 种子轮追加融资等较小的 AI 药物发现融资，也高于 Insilico 据报 $110 million Series E，但仍远低于 Isomorphic Labs $2.1 billion
              Series B。更重要的比较是模型质量。Schrödinger 的官方策略将经常性软件收入与药物发现上行空间结合，而 Relay
              披露展示了更传统临床阶段治疗公司依靠大额现金储备和反复进入资本市场融资的经济学。按资本强度看，Pathos 更接近 Relay；按当前收入多元化看，则远不像 Schrödinger。

              这个框架重要，因为最重大的阻塞点不在于 Pathos 是否能再融资一次，而在于它能否在下一次融资前把资本转化成可衡量的商业或临床价值。Nature
              的融资评论提供反向提醒：即使复苏已经开始，生物技术融资环境也可能迅速收紧。公司层面，Pathos
              仍未披露手头现金、股权结构条款、清算优先权、已确认收入、利润率结构，或未来模型输出与合作伙伴的经济分成。Series D
              投资人身份也大多未披露。结果是一家公司看起来资金充足、战略上获得验证，但收入质量、真实现金跑道和利润率路径仍只能由私有证据验证。
