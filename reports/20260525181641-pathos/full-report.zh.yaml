      - number: '5.4'
        title: 成熟度评估：Pathos 已从概念进入试验运营，但平台证据仍不完整
        blocks:
          - type: paragraph
            body: >-
              成熟度画像并不单一，而这反而是成熟投资人更愿意看到的状态：公开证据足以说明 Pathos 真在推进业务，但还不足以证明平台优势已经跑通。积极的一面是，Pathos 已经授权并重塑了第一个临床资产，启动了公司发起的
              Phase 1b/2a 试验，组装出第二个已有 Phase 1 信号的临床资产，完成 Rain 收购，并在连续完成 Series C 和 Series D 融资的同时，为 DO-2 完成控股权收购。相比多数「AI
              药物发现」故事，这条路径更有运营实感。


              尚未解决的问题是，PathOS 到底是可复制的效率引擎，还是只是把标准生物科技资产套利和执行包了一层好用工具。Pathos
              没有公开披露资产排序精度、生物标志物选择命中率、试验周期压缩、验证吞吐量或模块级可靠性等指标。因此，模块成熟度矩阵把资产交易和试验启动层标为已有证据，把基础模型建设标为正在形成，把平台治理层标为披露不足。实际承销口径应是：Pathos
              的产品成熟度已经足以进入严肃尽调，但若没有私有资料室证据，公开仪表化程度还不足以把该系统按已验证的复利引擎承销。
