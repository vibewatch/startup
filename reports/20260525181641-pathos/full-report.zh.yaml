      - number: '5.3'
        title: 依赖与控制：最大的技术杠杆伴随外部数据、隐私和治理风险
        blocks:
          - type: paragraph
            body: >-
              Pathos 的技术优势也对应着最重的依赖结构。Tempus 和 AstraZeneca 合作具有战略吸引力，因为它把 Pathos 从自身内部数据范围扩展出去，但也带来重大交易对手风险。公开材料中，Pathos
              依靠 Tempus 获取去标识化肿瘤数据、企业级多模态基础设施，并且——通过 TIME Network 案例研究——甚至获得可衡量的试验入组帮助。这种集中度不一定是坏事，但意味着从模型到临床执行的路径并非完全由
              Pathos 单独控制。如果合作经济条款、数据权利或交付优先级变化，部分公开技术逻辑也会随之变化。


              审阅的公开材料也没有达到机构投资人理想中想看到的治理深度。HHS 提醒受监管实体，即使健康数据已合规去标识化，仍保留一定残余再识别风险；NCI 和多篇肿瘤 AI
              综述强调，生物标志物工作流、同意、隐私和模型可靠性仍是规模化采用的不小障碍。The ASCO Post 和 Springer
              综述尤其相关，因为它们追问责任、同意、可解释性和训练数据质量——当平台影响资产选择或试验设计时，这些类别会立刻变得尖锐。Pathos
              招聘页面显示有技术招聘和基础反欺诈控制，但公司没有公开信任中心、正常运行时间历史、公开模型卡或经验证的平台 KPI 仪表板。对尽调而言，控制叙事方向上说得通，但证据仍不足。
