      - number: '3.3'
        title: 数据平台与相邻替代品：最难察觉的竞争来自分发和证据
        blocks:
          - type: paragraph
            body: >-
              Pathos 面临的非显性威胁不只是另一家 AI 发现创业公司；肿瘤数据与工作流层同样可以塑造哪些资产获得证据、采用和制药关注。Tempus 已经嵌入分子分析，并证明它能直接集成进 Flatiron 的
              OncoEMR；Caris 和 Flatiron 已把基因组、影像和真实世界数据合并为商业研究产品。ConcertAI 正在从企业侧沿同一模式推进，为生命科学用户打包肿瘤数据集和智能体 AI
              工具，而不是面向单一管线的投资人。Foundation Medicine 在模态上更窄，但依然强势，因为 Roche 将其定位在 300 多个癌症驱动基因和全球 CGP 采用之上。相邻 AI 生物技术
              玩家拓宽了威胁面。Owkin 结合因果 AI、病理、空间组学和制药合作；Valo 推动 AI 赋能的人类因果生物学和闭环化学；Boundless 以 ecDNA 肿瘤学为切入点；Absci 展示 AI
              设计生物制品可能是什么样；Ikena 被 ImageneBio 吸收，则提醒市场资本回收可以在一个表面同业成为耐久竞争者前就将其抹去。对于
              Pathos，教训是数据访问、工作流分发和伙伴信任可能与模型质量同样重要。
