      - number: '1.5'
        title: 时间线、里程碑与反向背景
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 从 2022 年创立到 2026 年 5 月 DeuterOncology
              收购，时间线涵盖四次融资事件、四项资产新增、一次已完成收购和两项重大战略合作，不到四年完成；相对于公司规模，临床和公司发展节奏很快。里程碑表汇总了完整记录时间线。

              Rain Oncology 收购（2024 年 1 月 26 日完成）是第一笔重大外部交易。Pathos 全资子公司 WK Merger Sub, Inc. 以每股 $1.16 加每股一项或有价值权利，收购
              Rain 全部流通普通股；28,031,182 股被提交，约占流通股 77%。Rain 的 milademetan 是一种 p53-MDM2 复合体抑制剂，已进入 Phase 3，但收购后基本从 Pathos
              公开传播中消失，可能意味着管线重新排序或战略性搁置。

              2025 年 4 月 23 日宣布的 Tempus/AstraZeneca 合作，是资本强度最高的单一事件：$200 million 费用流向 Tempus，产出的基础模型将在三方之间共享。AstraZeneca
              同时作为客户和模型共同开发方直接参与，形成不寻常的利益一致性，需要对治理与利益冲突进行尽调。The ASCO Post 强调，在肿瘤决策场景部署 AI 工具存在法律与责任不确定性；这一问题广泛适用于 Pathos
              的目标。

              三类风险需要重点关注：第一，Huerga 的关键人物集中度（新任 CEO，尚无 Pathos 特定任期）；第二，Series D 投资人身份未披露；第三，AI 驱动临床试验设计的监管与责任框架在全球仍未定型。
