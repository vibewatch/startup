          detail: 已披露对 Tempus 的 $200M 费用承诺
        - id: asset_buildout
          label: 资产扩充与交易
          detail: Rain Oncology、DeuterOncology 等授权引进和收购扩大了范围，也很可能推高支出
        - id: platform_and_gna
          label: 平台研发和 G&A
          detail: 支撑平台投资逻辑需要持续投入组织、模型和运营费用
        - id: missing_cash_balance
          label: 缺失的交割后现金余额
          detail: 没有交割后现金、受限现金和义务履行节奏，真实现金跑道只能按情景估算
    claimRefs:
      - CI009
      - CI010
      - CI011
      - CI012
      - CI033
      - CI034
      - CI037
      - CI038
      - CI048
      - CI049
  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: PathOS 围绕具体资产，叠加外部肿瘤数据、共享 AI 核心、决策引擎和试验执行。
    data:
      layers:
        - label: 数据底座
          description: 临床、分子、影像和结局数据流入模型训练和亚组分析。
          detail: Pathos 声称拥有 >200 PB 数据，Tempus 合作扩大了可访问的肿瘤记录基础。
        - label: 核心智能
          description: Foundry 聚合多模态证据，并在多个项目间沉淀组合学习。
          detail: 公司把共享 AI 核心、因果建模和实验室闭环验证呈现为可复用护城河。
        - label: 决策引擎
          description: Scout 及配套工作流逻辑把模型输出转成资产和生物标志物选择。
          detail: 输出包括资产排序、患者亚组假设，以及生物标志物驱动试验设计输入。
        - label: 执行层
          description: Sprint 小队把筛选出的资产推进为可执行临床项目。
          detail: 嵌入式 AI 科学家、工程师和临床负责人推动资产跨过各个开发里程碑。
        - label: 项目输出
          description: PathOS 主张接受检验的公开资产组合。
          detail: Pocenbrodib、P-500、DO-2 和 Rain 衍生资产构成当前证据基础。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE012
      - CE013
      - CE024
      - CE034
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: Pathos 把药物开发描述为一套可重复流程：从数据和外部资产寻找出发，最后落到生物标志物指导的试验执行。
    data:
      nodes:
        - id: external-data
          label: 多模态肿瘤数据
        - id: foundry
          label: Foundry 分析
        - id: asset
          label: 外部资产或自有项目
        - id: biomarker
          label: 生物标志物策略
        - id: trial
          label: Pathos 发起的试验
        - id: learning
          label: 结果反馈
      edges:
        - source: external-data
          target: foundry
          label: 训练 / 打分
        - source: foundry
          target: asset
          label: 排序 / 收购
        - source: asset
          target: biomarker
          label: 将 MOA 匹配到亚组
        - source: biomarker
          target: trial
          label: 设计并入组
        - source: trial
          target: learning
          label: 观察结果
        - source: learning
          target: foundry
          label: 累积洞察
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE010
      - CE024
      - CE033
      - CE045
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 公开可见的 Pathos 技术栈高度依赖 Tempus 的数据和试验赋能，也依赖公共卫生规则允许在隐私安全边界内复用肿瘤数据。
    data:
      nodes:
        - id: pathos
          label: Pathos
        - id: tempus
          label: Tempus 数据 / TIME 网络
        - id: astrazeneca
          label: AstraZeneca 合作
        - id: hhs
          label: HIPAA 去标识化规则
        - id: sites
          label: 试验中心和研究者
        - id: patients
          label: 符合条件的生物标志物定义患者
      edges:
        - source: hhs
          target: tempus
          label: 隐私边界
        - source: tempus
          target: pathos
          label: 数据 + 费用 + 入组支持
        - source: astrazeneca
          target: pathos
          label: 共同开发背景
        - source: tempus
          target: sites
          label: 网络赋能
        - source: sites
          target: patients
          label: 筛选 / 入组
        - source: patients
          target: pathos
          label: 试验结果
    claimRefs:
      - CE011
      - CE013
      - CE014
      - CE041
      - CE045
      - CE046
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: standard
    summary: 公开证据最强的是交易和试验启动，较弱的是已量化的平台表现和治理。
    data:
      columns:
        - 公开证据深度
        - 运营验证
        - 剩余尽调负担
      rows:
        - label: 资产授权 / 收购
          values:
            - 高
            - 中
            - 中
        - label: Pathos 发起试验启动
          values:
            - 高
            - 中
            - 中
        - label: 生物标志物 / 亚组逻辑
          values:
            - 中
            - 低
            - 高
        - label: Foundry 决策质量
          values:
            - 中
            - 低
            - 高
        - label: 安全 / 模型治理
          values:
            - 低
            - 低
            - 高
