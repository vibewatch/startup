      - number: '7.3'
        title: 运营和伙伴风险被放大，因为最干净的公开证据都经过 Tempus
        blocks:
          - type: paragraph
            body: >-
              公开证据显示 Pathos 能执行，但也显示这种执行有多依赖外部基础设施。Tempus TIME 案例研究之所以有价值，正是因为它具体：早期研究会遇到站点和患者瓶颈，而 Tempus 称它帮助识别了 Pathos
              研究前十名匹配患者中的六名。这令人鼓舞，但也意味着 Pathos 的一个核心运营证据点并不在 Pathos 体内。同样，Tempus 与 AstraZeneca 的合作给了 Pathos
              自己难以轻易搭建的规模，但也把伙伴连续性变成一个正在发生的风险变量，而不是背景细节。


              临床风险同样不轻。pocenbrodib 仍要跨过早期安全性和疗效门槛，才能进入更成熟的价值故事。P-500 有早期信号潜力，也有明确不良事件历史；DO-2 仍是刚收购的新资产，基于小规模 Phase 1
              数据集，还需要在更广人群中独立确认。再加上 Rain 整合和组合优先级问题，运营画像就是：确有进展，但脆弱性不低。下方依赖图把 Tempus 视为当前 Pathos 风险栈中最重要的外部节点。
