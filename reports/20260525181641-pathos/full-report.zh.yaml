      - number: '6.2'
        title: 已命名外部证据：Tempus 是实时采用的最清晰证据，但主要证明 Pathos 是买方
        blocks:
          - type: paragraph
            body: >-
              最强的已命名外部证据是 Tempus 关系。第一，Tempus 与 AstraZeneca 的合作说明成熟交易对手愿意与 Pathos 一起构建肿瘤基础模型。第二，Tempus TIME
              案例研究提供了运营证据：Pathos 正在借助第三方网络运行早期试验。整章最具体的数据点是，pocenbrodib 研究前十名匹配患者中有六名来自 TIME 网络。Tempus 还引用 Iker Huerga
              的说法，称该网络帮助 Pathos 找到可能拥有合格患者的站点并快速激活。放在一起，这些事实把 Pathos 从概念性 AI 故事推向有记录的企业级使用。


              但同一组证据也暴露出重要的不对称：公开证据最清楚证明的是，Pathos 是 Tempus 数据、网络和商业化基础设施的客户。因此，已命名客户证据表把 Tempus 同时视为 Pathos
              最强的外部验证者和最大的商业依赖。AstraZeneca 增加了战略验证，但公开记录仍很少说明 Pathos
              对经济性或工作流到底拥有多少直接控制权。这也是为什么下方采用漏斗把当前牵引力解读为申办方级企业证据，而不是广泛的平台渗透。
