      - number: '4.2'
        title: 收入模型、GTM 路径与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              Pathos 不应按可观察商业队列的软件公司建模。公开故事是一家临床阶段肿瘤平台，收购或授权资产，利用多模态数据和 AI
              改善试验设计，最终通过合作、授权、里程碑、特许权使用费或资产退出寻求价值捕获。这种模式可能具备经济吸引力，但截至报告运行日，本章审阅的公开来源没有披露
              ARR、已确认收入、收入结构、软件定价、服务定价、续约率、客户数，或其他可支撑传统收入质量评估的当前变现指标。

              唯一公开披露的具体协作经济利益方向相反：Pathos 称其与 Tempus 和 AstraZeneca 的协议包含向 Tempus 支付 $200 million
              的数据授权和模型开发费用。这是真实经济承诺，但并不证明 Pathos 有流入收入。公开市场进入路径因此应理解为业务拓展和治疗资产策略，而不是企业销售。外部牵引力最佳证据是公司融资、签下重要交易对手并继续通过
              Rain Oncology 和 DeuterOncology 扩充管线的能力。这是有意义的战略验证，但并不等同于已验证、可重复的商业收入。
