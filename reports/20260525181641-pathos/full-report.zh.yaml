chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与阶段
        blocks:
          - type: paragraph
            body: >-
              Pathos AI, Inc. 是一家在 Delaware 注册的临床阶段人工智能与生物技术公司，总部位于 600 W. Chicago Ave., Suite 510, Chicago, Illinois
              60654。公司的 SEC CIK 为 0001967854，IRS EIN 为 852945509。Pathos 于 2022 年创立，站在技术、肿瘤学和癌症亲历经验的交汇处。官方网站为
              www.pathos.com，财年截止日为 12 月 31 日。

              公司宣称的使命是用自有患者数据和 AI 改造药物开发，大幅提高试验成功率，把新疗法带给传统治疗无效的患者。Pathos 将自身定位为 AI 赋能的生物技术公司，借助 AI
              技术、多模态真实世界数据和患者来源生物模型重塑药物开发。截至报告运行日，Pathos 仍处于临床阶段，主要项目 pocenbrodib 正在开展一项 Phase 1b/2a
              临床试验，管线还覆盖另外三项肿瘤资产。公司尚未披露公开员工数。

              Pathos 将其竞争差异定义为两项能力的组合：最大规模自研多模态肿瘤数据集（声称超过 200 petabytes，并与患者结局关联）和持续学习的 AI 平台——这让它区别于纯计算 AI
              公司和传统药企收购方。公司强调，每完成一项试验都会反哺下一项，形成学习飞轮，使效率和证据质量持续复利。
