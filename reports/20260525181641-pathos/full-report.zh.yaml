  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览：Pathos 面临集中的伙伴、治理和早期临床风险
        blocks:
          - type: paragraph
            body: >-
              Pathos 的风险还不是晚期生物科技公司的那种风险；它更像一个集中式 AI
              原生肿瘤运营模型的风险。公司试图把外部数据权利、模型构建、生物标志物逻辑、资产交易和试验执行合成一个自我改进系统。这个结构带来上行空间，但也把多个失败模式集中到同一条运营链上。如果伙伴数据权利收窄、生物标志物逻辑无法泛化、试验入组停滞，或治理标准不达标，系统可能在收入或关键疗效到来前就在多个位置断裂。因此，风险热力图把数据权利集中、法律和同意不确定性、早期临床执行以及融资依赖放在风险清单前列。


              这不是纯理论担忧。公开记录已经显示，Pathos 在数据规模和试验赋能上高度依赖 Tempus，多个收购或授权资产仍需要整合和优先级排序，而 PathOS
              输出在影响决策前如何验证，公开治理细节很少。公司仍是私有公司，投资人还看不到上市精准肿瘤公司会提供的那种风险因素密度。正确姿态是：除非私有尽调材料证明相反，否则假设剩余风险仍高。
