  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 投资建议来自融资强度、缺失的经济性、公开可比公司对照和情景分散度。
    data:
      nodes:
        - id: capital
          label: 大额私募融资跃升
        - id: proof
          label: 公开经济 / 临床证据有限
        - id: comps
          label: 公开可比公司估值接近或低于当前标记
        - id: dispersion
          label: 情景分散度大
        - id: track
          label: 观察建议
      edges:
        - source: capital
          target: proof
          label: 信号强但不完整
        - source: proof
          target: comps
          label: 需要交叉验证
        - source: comps
          target: dispersion
          label: 波动性重要
        - source: dispersion
