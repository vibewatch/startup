      - number: '8.4'
        title: 建议：观察，中等信心，估值立场偏高
        blocks:
          - type: paragraph
            body: >-
              这里的建议是观察，信心为中等，估值立场偏高。这不是否定公司。Pathos 已经融到有分量的资本，组建了可识别的战略伙伴关系，也搭出了比许多 AI
              生物科技故事更强的平台叙事。但当前公开记录在融资上远强于经济性，在战略野心上远强于已验证临床证据。因此，对一家可能变得很有价值、但尚未让当前入场价格易于承销的公司，观察是合适评级。


              什么会把评级推高？清晰证据显示 pocenbrodib 或后续资产正在受益于 PathOS
              驱动的患者选择；伙伴关系的经济性和耐久性更透明；资料室提供可信资料，覆盖现金、股权结构表、优先权和项目级支出。什么会把评级打低？融资环境转弱、Tempus
              伙伴关系受扰、临床失望，或迹象显示当前估值中嵌入了公开文件看不到的治理或稀释包袱。在这些变量解决前，入场纪律应继续收紧。
