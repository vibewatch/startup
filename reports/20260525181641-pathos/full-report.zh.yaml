figures:
  - id: FO001
    title: Pathos AI 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Pathos AI 不到四年就从成立走到临床阶段：拥有四项资产、两项合作、累计融资 $467M。AI 引导的资产筛选压缩了传统研发时间线。
    data:
      items:
        - date: '2022'
          label: 创立
          detail: Eric Lefkofsky 和 Ryan Fukushima 在芝加哥创立 Pathos AI，把 AI 用于肿瘤药物开发。
          tone: positive
        - date: 2023-03
          label: 首份 Form D — $40M
          detail: 从 Lightbank、Builders VC 等早期支持者处筹集初始资金。
          tone: positive
        - date: '2023'
          label: 从 Novo Nordisk 获得 Pocenbrodib 授权
          detail: CBP/P300 抑制剂 FT-7051（后更名为 P-300/pocenbrodib）成为首个管线资产。
          tone: positive
        - date: 2023-12
          label: 宣布 Rain Oncology 要约收购
          detail: Pathos 以每股 $1.16 加 CVR 要约收购 Rain Oncology 及其 MDM2 抑制剂 milademetan。
          tone: neutral
        - date: 2024-01
          label: 完成 Rain Oncology 收购
          detail: 77% 的 Rain 股票接受要约；Rain 从 Nasdaq 退市；milademetan 纳入管线。
          tone: neutral
        - date: 2024-08
          label: 从 Prelude Therapeutics 获得 P-500 授权
          detail: 可透过血脑屏障的 PRMT5 抑制剂，面向高级别胶质瘤和葡萄膜黑色素瘤；可进入 Phase 2。
          tone: positive
        - date: 2024-10
          label: $62M Series C — $600M 估值
          detail: NEA 领投，总融资增至约 $102M；Revolution Growth 和既有支持者参投。
          tone: positive
        - date: 2025-03
          label: Pocenbrodib 启动 Phase 1b/2a
          detail: NCT06785636 完成首例给药；203 名患者 mCRPC 试验启动。
          tone: positive
        - date: 2025-04
          label: Tempus / AstraZeneca 合作
          detail: 多年合作，建设最大的多模态肿瘤学基础模型；Tempus 获 $200M。
          tone: positive
        - date: 2025-05
          label: $365M Series D — 约 $1.6B 估值
          detail: 最大一轮融资；Iker Huerga 出任 CEO，接替 Ryan Fukushima。
          tone: positive
        - date: 2026-05
          label: 收购 DeuterOncology 多数股权
          detail: Foundry AI 识别并开发 DO-2 MET 抑制剂；Phase 1 显示，可评估 NSCLC 患者 100% 肿瘤缩小。
          tone: positive
    claimRefs:
      - CO004
      - CO007
      - CO010
      - CO011
      - CO013
      - CO021
      - CO024
      - CO025
      - CO028
      - CO030
  - id: FO002
    title: Pathos AI 公司快照逻辑
    type: flow
    layout: standard
    summary: Pathos AI 的业务模式把自研 AI 核心、外部数据合作、临床执行团队和不断扩大的管线连起来，全部回灌 Foundry 学习飞轮。
    data:
      nodes:
        - id: data
          label: 多模态肿瘤学数据
          detail: 公司声称拥有 200+ petabytes；数据来源包括 Tempus AI 合作（Tempus 去标识化数据库）和自研采集，是所有 AI 模型训练的底座。
          tone: positive
        - id: foundry
          label: Foundry — AI 核心
          detail: 与 AstraZeneca 和 Tempus 共建的肿瘤学基础模型；接入 lab-in-the-loop 验证，系统化识别并评估管线候选资产。
          tone: positive
        - id: scout
