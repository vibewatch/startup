  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 状态
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Pathos AI
        - AI 辅助肿瘤资产开发
        - 私有公司，临床阶段管线构建方
        - 生物标志物定义的肿瘤开发
        - 把资产分诊、生物标志物逻辑和肿瘤开发执行放在一起
        - 没有公开披露已完成的闭环成功案例或独立软件收入
      - - Recursion + Exscientia
        - AI 优先的端到端药物发现
        - 合并后的上市 AI 药物发现平台
        - 广泛发现合作和内部管线
        - 表型组学与生成式化学同属一个平台
        - 整合和烧钱风险仍然很大
      - - Insilico Medicine
        - AI 原生靶点到分子平台
        - 40+ 个项目；13 条 IND 获准管线；Lilly 验证
        - 多治疗领域发现与授权
        - 端到端 Pharma.AI 技术栈，授权信号强
        - 临床证据仍集中在早期项目
      - - BenevolentAI
        - 知识图谱 TechBio / 合作发现
        - 2024 年重置后走向重组和退市
        - 合作发现叠加较小内部组合
        - 生物医学知识图谱和靶点假设引擎
        - 战略收缩削弱竞争威胁
      - - Schrödinger
        - 基于物理的软件加管线
        - 上市软件 / 治疗混合体
        - 药企计算设计和内部肿瘤项目
        - 经常性软件授权叠加自有项目
        - 对试验执行或资产再开发关注较少
      - - Relay Therapeutics
        - 基于运动的精准肿瘤学
        - 上市临床阶段平台，选择性对外授权
        - 肿瘤和罕见病项目
        - Dynamo 平台用于基于运动的药物设计
        - 比数据平台护城河更窄
      - - Tempus AI
        - 临床基因组数据和肿瘤工作流
        - 上市 AI 医疗科技平台
        - 检测、诊断、药企数据、肿瘤诊所
        - 靠分型检测叠加 EMR 集成铺进工作流
        - 不拥有并运营肿瘤药物资产
      - - Foundation Medicine
        - CGP 诊断平台
        - Roche 关联公司
        - 伴随诊断和基因组分型
        - 300 多基因 CGP 覆盖面和 Roche 触达能力
        - 诊断属性更强，多模态程度弱于部分数据平台
      - - ConcertAI
        - 肿瘤数据和企业 AI
        - 私有企业平台
        - 生命科学研究和商业团队
        - 基于肿瘤数据集的 CARAai 和 Precision Suite
        - 更像软件 / 数据卖方，而非治疗开发方
      - - Flatiron Health
        - 肿瘤工作流和 RWE 引擎
        - 大型肿瘤工作流既有厂商
        - 肿瘤诊所和研究用户
        - OncoEMR 分发叠加研究规模
        - 自身不拥有治疗资产
      - - Caris Life Sciences
        - 分子分型和多模态研究数据
        - 大型精准肿瘤平台
        - 诊断和生物制药研究
        - DNA、RNA 和影像与伙伴工作流结合
        - 诊断优先定位削弱与 Pathos 的直接可比性
      - - Owkin
        - 端到端 AI 生物技术和诊断
        - 与药企合作的私有 AI 生物技术公司
        - 精准医疗、诊断和发现
        - 因果 AI 叠加病理学和空间组学合作
        - 疾病范围比 Pathos 当前切入口更宽
      - - Valo Health
        - AI 赋能的因果生物学生物技术公司
        - 由药企导向管理层领衔的私有平台
        - 广泛疾病领域和合作发现
        - 大规模人类数据上的闭环化学
        - 肿瘤专属性低于 Pathos
      - - Boundless Bio
        - 特定生物学方向的肿瘤替代项
        - 临床阶段精准肿瘤公司
        - ecDNA 扩增癌症
        - 鲜明的 ecDNA 生物学切入口
        - 单一生物学聚焦压窄可触达市场
      - - Ikena / ImageneBio
        - 原相邻肿瘤平台
        - 合并后 Ikena 不再独立
        - 合并后聚焦 anti-OX40 和免疫学
        - 展示资本如何回收到新实体
        - Ikena 不再作为独立实体威胁 Pathos
      - - Absci
        - 相邻 AI 设计生物药平台
        - AI 生物药管线，含 Phase 1/2a 资产
        - 生物药和炎症优先，不以肿瘤为先
        - 体现 AI 原生生物药设计的相邻性
        - 不在 Pathos 当前肿瘤小分子赛道内
    notes: 覆盖范围有意做成部分且战略性，而非穷尽；表格突出最贴近 Pathos 2026 年公开定位的同业和替代项。
