        title: 只有当 Pathos 持续把资本转化为可信证据点，财务和市场风险才算可控
        blocks:
          - type: paragraph
            body: >-
              Pathos 显然能融资，但这不等于融资风险低。SEC 文件显示，2023、2024 和 2025 年公司反复提交 Form D，最终在 2025 年形成大约 $400 million
              的发行。这段融资历史一方面是优势——投资人多次支持公司——另一方面也证明该模式仍依赖外部资本，而不是公开收入。只要公司仍处于商业化前、且客户变现不透明，每一次未来融资都高度依赖市场继续相信平台叙事，以及新的临床或运营证据。


              类别风险会叠加公司自身风险。Tempus 和 Caris 证明，规模化肿瘤数据公司同样要处理隐私、治理、AI 监管和执行复杂度；它们只是仪表化程度更高、公开披露更多。对 Pathos
              来说，实际打破投资逻辑的触发点很清楚：与 Tempus 的伙伴关系受扰、pocenbrodib 早期临床表现不佳、P-500 或 DO-2
              无法成为可信的下一波项目，或证据显示内部治理落后于成熟药企伙伴要求。在这些失败模式被私有尽调或公开运营指标证伪之前，剩余风险评级仍应维持偏高。
