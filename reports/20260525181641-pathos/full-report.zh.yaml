      - number: '8.3'
        title: 结果离散度极大，情景分析比点估值更重要
        blocks:
          - type: paragraph
            body: >-
              单一估值数字遮住了本案的核心事实：Pathos 的结果分布异常宽。乐观情景很容易写。如果肿瘤基础模型逻辑成立，Tempus/AstraZeneca 合作能产生可复制洞察，且 pocenbrodib、P-500
              和更新引入的资产显示真实临床杠杆，那么当前私募标记可能显得保守。在这种世界里，Pathos 会从 AI 药物开发叙事，升级为一个多资产、具备数据护城河的平台，足以支撑数十亿美元级上市估值。


              悲观情景也同样直接。如果早期临床项目令人失望，Pathos/Tempus 关系比预期更贵或更不持久，公开市场继续压缩 AI
              生物科技倍数，或隐藏融资条款稀释未来投资人，那么当前标记可能显得激进。因此，敏感性条和估值区间图使用粗略公开区间，而不是假精确的 DCF。在本章框架下，Pathos
              像一个应该跟踪的名字：上行空间真实，但当前价格已经假设了比公开记录目前能验证的更多成功。
