      - number: '4.3'
        title: 成本结构、烧钱基准与单位经济
        blocks:
          - type: paragraph
            body: >-
              Pathos 的公开单位经济大多缺失，因此本章采用生物技术优先的基准组合，而不是强套 SaaS 指标。可能的成本桶很直接：pocenbrodib 的持续临床执行、P-500 和 DO-2
              等其他资产准备、数据和模型开发相关付款，以及维持发现和临床开发组织的核心运营支出。肿瘤试验文献有助于解释为什么商业化前烧钱仍会维持高位。临床试验经济学综述强调，启动延迟、入组乏力和基础设施碎片化会吃掉大量预算；公开肿瘤试验入组证据显示，入组越慢，读出时间越长，融资窗口也随之拉长。

              公开可比公司强化了资本强度判断。Relay 披露 2025 年 Q1 现金约 $710 million、跑道延伸到 2029 年；随后依靠 ATM 发行后，2026 年 Q1 仍报告现金 $642.1
              million。Schrödinger 已经拥有软件收入和合作发现经济收益，但 2026 年 Q1 仍报告现金 $406 million、季度净亏损 $60 million。Insilico 报告现金
              $393.3 million、2025 年收入 $56.2 million，说明 AI 赋能发现公司即使已经建立比 Pathos
              更明确的商业收入流，仍会依赖资本。合在一起，这些基准支持一个合理公开烧钱区间：一家试图在肿瘤领域运行“平台加管线”模式的公司，每年大约烧掉 $120 million 到 $240 million。按这个基础看，仅
              Series D 就相当可观，但并不过度。
