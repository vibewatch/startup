  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局结构：Pathos 夹在发现引擎和肿瘤数据既有平台之间
        blocks:
          - type: paragraph
            body: >-
              Pathos 周边竞争地图比普通生物技术同业更宽，因为 Pathos 试图把多项工作压进一个运营模型。Pathos
              公开材料将公司描述为正在重新定义肿瘤药物开发、推进精准构建管线，而不是销售独立软件席位或从零发明每个分子。因此，直接可比公司不只是其他肿瘤生物技术公司。Pathos 在技术可信度、资本和差异化资产上，与
              Recursion/Exscientia、Insilico、Schrödinger、Relay 等 AI 优先的 发现平台竞争。同时，它又与 Tempus、Flatiron、Caris、ConcertAI 和
              Foundation Medicine 等肿瘤数据与工作流既有平台竞争，争夺多模态数据、真实世界证据和临床医生工作流分发。Owkin、Valo、Boundless、Absci 以及此前的 Ikena 平台等相邻
              AI 生物技术玩家也重要，因为它们显示赛道走向，以及资本、数据或证明点变化时竞争压力移动得有多快。结果是一个夹层位置：Pathos
              比多数发现类同业更临床整合，但商业化程度远低于它也必须学习或围绕合作的肿瘤数据既有平台。
