  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户可见度：公开证据显示的是企业关系，而不是广泛披露的客户基础
        blocks:
          - type: paragraph
            body: >-
              从客户披露角度看，Pathos
              不像传统软件公司或诊断公司。官网和融资材料没有披露客户数、年经常性收入（ARR）、留存或定价。公司把自己定位为与制药、生物科技、学术界和投资人合作，同时搭建肿瘤开发的新运营模式。这个表述很关键，因为它意味着短期买方更可能是企业级交易对手——战略药企合作者、数据网络或试验赋能伙伴——而不是大量肿瘤科医生或医院购买标准化产品。因此，客户分层表把
              Pathos 已命名的外部关系拆成共同开发伙伴、数据 / 试验赋能供应商、资产交易对手和临床用户。


              直接结论是：公开客户可见度仍低，但公开关系证据真实存在。Pathos 已有足够证据显示外部机构愿意与其合作，但还不足以勾勒出多元化客户账本。这与 Tempus、Flatiron、Foundation
              Medicine、Caris 和 ConcertAI 形成鲜明对比，后者都发布了更强的客户或使用规模声明。尽调中应把 Pathos
              视为由关系牵引的生物科技平台，外部需求信号正在出现；不要把它当作商业化规模已经透明的平台。
