  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景：Pathos 有较高的私募标记，但缺少公开财务遥测
        blocks:
          - type: paragraph
            body: >-
              Pathos 最新一轮公开融资是估值分析的起点。公司在 2025 年 5 月宣布完成 $365 million Series D，投后估值约 $1.6 billion；仅七个月前，它刚宣布以 $600
              million 投后估值完成 $62 million Series C。这意味着短时间内公开估值约上调
              2.7x。对一家仍不公布收入、年经常性收入（ARR）、利润率或现金消耗的公司来说，这是一次有分量的重定价。因此，估值故事主要由融资动能、战略叙事和平台可选性驱动，而不是传统财务证据。


              SEC 记录有方向性帮助，但不足以补齐缺口。Form D 文件确认公司在 2023、2024 和 2025
              年反复融资，但没有说明最新一轮中有多少是新股、多少是老股交易，也没有披露普通股之上有哪些优先权或投资人权利，或 Pathos 进入 Tempus 与 AstraZeneca 合作后还剩多少现金。因此，$1.6
              billion 标记是有用信号，但还不是完全可承销的价格。投资人应把它视为谈出来的私募标记，仍需用公开可比公司和情景分析做三角校验。
