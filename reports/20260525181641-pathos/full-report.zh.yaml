  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 位于三个分析上不同、战略上互锁的肿瘤市场交汇处。第一，AI
              辅助肿瘤药物发现：买方是大型和中型制药研发组织，寻求更高效地识别和验证临床资产；现状替代方案包括内部生物信息学团队、与癌症中心的学术合作，以及传统候选筛选统计方法。第二，肿瘤真实世界证据（RWE）：生物制药公司、健康技术评估机构和监管方采购回顾性或前瞻性患者数据集，用于支持监管申报、上市后监测和支付方谈判。第三，精准肿瘤诊断：下一代测序（NGS）、多组学分析和伴随诊断既承载临床诊疗，也为
              AI 训练提供数据底座。Pathos AI 的直接可触达市场排除药品制造、临床 CRO 运营服务、医院 EHR 软件和药品销售收入——这些相邻领域并不进入平台授权模式。癌症流行病学底盘很大：NCI 估计 2025
              年美国新增癌症诊断约 2.04M，WHO 报告 2022 年全球癌症死亡约 10M，SEER 预计 2026 年美国新增病例约 2.11M、癌症死亡 626K。患者量构成纵向数据机会，肿瘤 AI
              平台都在争夺聚合。市场边界高度有争议：Tempus AI 和 Caris Life Sciences 同时横跨诊断、RWE 和 AI 建模，竞争市场划分取决于假设；若不调整范围，分析师估算之间不可直接比较。
