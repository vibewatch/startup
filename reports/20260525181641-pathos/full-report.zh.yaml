      - number: '1.3'
        title: 资本历史、估值与投资人图谱
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 已通过四次披露融资筹集约 $467 million。2023 年 3 月 Form D（SEC filing number 021-474736）下的首笔 $40 million
              融资用于平台开发和首个资产收购。随后公司在 2024 年 10 月完成超额认购的 $62 million Series C，由 New Enterprise Associates 领投，投后估值 $600
              million；当时披露累计融资 $102 million，印证了 Series C 前 $40 million 的融资额。Series D 于 2025 年 5 月 15 日宣布融资 $365
              million，使投后估值达到约 $1.6 billion。对应的 2025 年 5 月 1 日 Form D 显示，总发行规模 $399,999,933，申报日已向 11 名投资者售出
              $282,999,950；考虑后续交割后，与公告金额一致。

              Series D 投资人身份尚未公开披露。Pathos 确认该轮同时包含老股东和新投资者。Series C 投资人基础（NEA、Revolution Growth、Lightbank、Builders
              VC）是目前文档最完整的一组。2025 年 4 月基础模型合作协议下向 Tempus AI 支付的 $200 million，是一项重大的关联方商业交易，需要单独尽调——资金从 Pathos 流向 Tempus
              这个交易对手方，并非股权付款。

              尚无债务融资、老股交易或信贷额度公开披露。Pathos 仍为私营公司，因未共享财务报表，被归入“私营未披露”类别。
