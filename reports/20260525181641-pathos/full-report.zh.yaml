  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历史与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Pathos 的财务承销应从融资而非利润表质量开始，因为公司尚未发布财务报表或公开现金余额。不过，对于一家私营生物技术公司，其资本记录锚点相当充分。Pathos 宣布 2024 年 10 月完成 $62
              million Series C，投后估值 $600 million；2025 年 5 月完成 $365 million Series D，投后估值约 $1.6 billion。CIK 0001967854 下的
              SEC Form D 记录佐证了与公司相关的三次豁免发行：2023 年申报约 $40 million 总发行规模，2024 年申报与 Series C 规模一致，2025 年申报显示总发行规模
              $399,999,933，申报时已向 11 名投资者售出 $282,999,950。这个组合为核心融资时间线提供了异常强的一手层级证据。

              更重要的承销问题是未来资本充足性。Pathos 披露 Series D 资金将用于临床管线和继续投资肿瘤基础模型；2025 年 4 月 Tempus/AstraZeneca 公告另行披露，应向 Tempus 支付
              $200 million 费用。审阅的官方和申报来源未出现债务、仓储融资额度或项目融资义务，因此资产负债表看起来由股权融资支撑。但如果没有交割现金余额，投资人无法判断 Series D
              交割时此前资本基础还剩多少，Tempus 承诺付款多快支付，以及资产收购和试验执行已承诺多少资本。本章因此将融资历史视为已验证，将现金充足性视为估计。
