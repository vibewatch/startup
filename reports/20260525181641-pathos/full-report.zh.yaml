  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间窗口
      - Pathos AI 影响
      - 尽调问题
    rows:
      - - 肿瘤药物失败率高（1 期到获批约 95% 流失）
        - 驱动
        - 当前
        - AI 辅助资产选择和试验优化因此有了紧迫商业需求
        - Pathos AI 是否验证过 Scout 选择的资产能跑赢行业基准流失率？
      - - FDA RWE Framework 与 RWE 指南持续获认可
        - 驱动
        - 当前 / 近期
        - 数据驱动型监管申报得以推进；RWE 解决方案市场扩大
        - Pathos 数据参与过哪些监管申报（如有）？
      - - NGS 测序成本下降，支撑大规模多组学数据集
        - 驱动
        - 当前 / 长期
        - 单样本数据获取成本下降；更大的训练数据集有了支撑
        - Pathos AI 单样本数据获取成本是多少，趋势如何？
      - - 精准医疗要求叠加伴随诊断增长
        - 驱动
        - 当前
        - 拉动临床端对多组学分型的需求，支撑 AI 模型训练
        - 有多少个 FDA 批准的伴随诊断引用了 PathOS 中的数据？
      - - HIPAA 和 GDPR 数据隐私法规
        - 约束
        - 当前 / 持续
        - 跨机构数据流动受限；架构必须保护隐私
        - PathOS 使用什么数据治理和去标识化架构？
      - - 既有厂商切换成本（Tempus、Caris 嵌入纵向数据）
        - 约束
        - 中期
        - 药企伙伴会在多年研究项目中嵌入平台数据；替换成本高
        - Tempus / Caris 与药企伙伴使用哪些合同锁定机制？
      - - AI 生成药物发现假设的 FDA 路径未定义
        - 约束
        - 近期 / 演进中
        - 平台衍生候选药物的审批路径因此不确定
        - Pathos 是否有任何候选药物面临 FDA 针对 AI 的监管审查？
      - - 多模态数据拼装和算力资本开支强度高
        - 约束
        - 当前
        - 烧钱速度高；数据集成本未披露；Series D 资金有限
        - Series D 后，Pathos AI 季度烧钱速度和现金跑道是多少？
