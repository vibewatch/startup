      - number: '3.2'
        title: 直接 AI 药物开发同业：发现深度更强，临床证明参差，耐久性不均
        blocks:
          - type: paragraph
            body: >-
              在直接 AI 药物开发同业中，没有一家完全对应 Pathos，但每家都压迫 Pathos 逻辑的不同部分。Recursion 加 Exscientia
              是最清晰的端到端发现重磅玩家：合并明确打出端到端能力组合领导者叙事，使其成为 AI 规模加生成化学同处一个屋檐下的最佳公开样本。Insilico 纸面上的 AI 平台广度最清楚，拥有 40 多个项目、13 条获
              IND 批准的管线，以及一笔规模足以构成真实生物制药验证事件的 Lilly 交易。Schrödinger 又不同：它是经济上最可读的同业，因为软件授权和合作经济收益可见，使其商业模型看起来比多数 AI 生物技术
              故事更耐久。Relay 的强项不是泛化 AI 叙事，而是基于运动的蛋白科学和正在临床推进的肿瘤管线，包括已对外授权资产。BenevolentAI 是警示案例。它与 Merck 的交易显示了真实伙伴验证，但
              2024 年战略重置和 2025 年退市路径说明，当资本市场与管线进展无法互相强化时，AI 生物技术 叙事会多快收缩。与这组公司相比，Pathos
              在临床资产分诊和生物标志物引导开发上更独特，但在分子设计深度上证据较弱。
