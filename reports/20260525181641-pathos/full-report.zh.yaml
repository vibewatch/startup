      - number: '2.2'
        title: 市场规模：多视角拆解
        blocks:
          - type: paragraph
            body: >-
              估算 Pathos AI 的可触达机会，需要把几个相互重叠的发布方市场估算拆开。IQVIA 的 Global Oncology Trends 2025 显示，2024 年全球肿瘤药支出为 $252B，预计
              2029 年达到 $441B，CAGR 约 11.9%——这是 AI 平台服务争夺部分研发预算所在的整体肿瘤经济。MarketsandMarkets 将专门的肿瘤 AI 市场估为 2024 年 $2.45B，到
              2030 年增至 $11.52B，CAGR 29.4%，单一宽边界覆盖药物发现、诊断、临床决策支持和影像 AI。药物发现技术市场（AI 是其中一个分部）另行估计为 2025 年 $30.58B，到 2030
              年增至 $51.51B，CAGR 11.0%（MarketsandMarkets，2026 年 1 月）。Mordor Intelligence 估计 2025 年全球 RWE 解决方案市场为
              $2.44B，其中肿瘤占行业份额 34.65%——意味着 2025 年肿瘤 RWE 分部约 $846M，并以 16.33% CAGR 增长，到 2031 年总市场达到 $6.04B。精准诊断与医学市场在 2024
              年达到 $145.53B（MarketsandMarkets），NGS 市场 2023 年为 $12.98B，并以 18.3% CAGR 增长（Allied Market Research）——两者都显示 AI
              药物发现依赖的数据底座市场本身正在快速扩张。这些估算不确定性很高：发布方采用不同市场边界，没有分析师独立验证竞争者方法论，肿瘤 AI 子赛道边界尤其多孔。IQVIA 还报告，随着 PD-1/PD-L1
              基石疗法的生物类似药竞争开始，2027 年后肿瘤支出增长预计放缓，为 2028–2029 年总可用市场增长增加结构性逆风。分析师市场规模估算相差超过 50×，从肿瘤 RWE 切片（约
              $846M）到完整肿瘤药物经济（$252B），说明市场边界定义必须解决的范围假设有多宽。
