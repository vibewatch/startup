      - number: '8.2'
        title: 公开可比公司显示，Pathos 已按严肃 AI 生物科技平台定价
        blocks:
          - type: paragraph
            body: >-
              最干净的公开可比组显示，在没有公开收入的情况下，Pathos 仍处于上市 AI 生物科技估值区间的中部。Tempus 在 2026 年 5 月下旬市值约 $8.29 billion，由 $348.1
              million 的 Q1 收入和接近 $1.6 billion 的全年收入指引支撑。Caris 报告 Q1 收入 $216.2 million，并在 2025 10-K 中披露非关联方持股总市值约 $3.87
              billion。Recursion 约为 $1.6 billion，大致与 Pathos 私募标记相当；Schrödinger 和 Absci 低于 $1.0 billion，Relay 则接近 $2.9
              billion。


              这个比较不能证明 Pathos 被高估，但能证明 Series D 要求投资人把公司当作早期实验载体之外的东西来承销。Pathos
              的估值更接近上市平台型生物科技同行，而不是典型不透明、尚无收入的早期私有生物科技。因此，可比公司表把判断推向「偏高但未离谱」区域：如果平台真的能跨多个资产复利，这个标记可以成立；但相对于当前公开运营披露水平，它的要求不低。
