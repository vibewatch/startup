      - number: '6.3'
        title: 耐久性与留存：公开记录证明关系存在，但不能证明关系会留存或扩张
        blocks:
          - type: paragraph
            body: >-
              这是公开客户故事最弱的一环。Pathos
              不披露净留存率（NRR）、总留存率（GRR）、流失、合同期限、客户满意度或扩张收入，也没有提供定价或包装细节，让投资人无法判断账户如何从试点走向持久支出。也就是说，本章能验证采用事件，但不能验证耐久性。留存表刻意保留大量空值，因为这才是公开证据的真实状态。


              相比成熟同行，这些缺失数据对 Pathos 更关键，因为少数已命名关系容易制造虚假的信心。一个合作标题可能代表长期项目、短期服务合同，也可能只是一次性交易。Novo Nordisk、Prelude、Rain 和
              Deuter 等资产交易对手也有同样问题：它们证明 Pathos 能做交易，但不能证明平台存在可重复的商业需求。除非 Pathos
              披露续约、重复范围扩张或客户可背书的结果，否则正确的分析口径是：从公开证据看，关系耐久性仍未证实。
