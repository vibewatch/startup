      - CE024
      - CE033
      - CE040
      - CE041
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Pathos 当前公开客户旅程，从战略引入和资产交易走到进行中的试验执行，但仍缺少透明的续约指标。
    data:
      items:
        - label: 战略关系
          detail: 在任何规模化客户指标可见之前，Pathos 先与药企、数据方和资产交易对手对齐。
        - label: 运营接入
          detail: 团队把关系转化为试验设计、生物标志物逻辑或资产整合工作。
        - label: 实际部署
          detail: 最清楚的公开案例是 Tempus 赋能的 pocenbrodib 研究，已经在主动匹配患者。
        - label: 结果生成
          detail: 运营结果必须先证明价值，才能假设更大范围的客户扩张。
        - label: 扩张决策
          detail: Pathos 仍需要公开证据证明续约、账户增长，或赢下更多类型客户。
    claimRefs:
      - CU003
      - CU007
      - CU008
      - CU011
      - CU031
      - CU038
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开采用漏斗很窄：从关系公告，收束到少数几个具名在跑验证点。
    data:
      items:
