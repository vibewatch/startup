      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 由 Eric Lefkofsky 和 Ryan Fukushima 于 2022 年联合创立。Eric Lefkofsky 同时是 Tempus AI, Inc.（Nasdaq:
              TEM）的创始人兼 CEO；Tempus 是一家专注 AI 赋能精准医疗的健康科技公司。这一公开关系解释了 Pathos 深度接入 Tempus 数据集的原因。Ryan Fukushima 担任公司创始 CEO
              兼临时 CEO 至 2025 年初。

              2025 年 5 月，Iker Huerga 加入 Pathos AI，担任 CEO 和董事会成员。Huerga 是癌症幸存者和生物技术老兵，此前最近担任 AstraZeneca 肿瘤研发首席数据科学家；考虑到
              Pathos 正在与 AstraZeneca 合作，这一经历直接相关。Dr. Jens Renstrup 担任首席医疗官，并主导 pocenbrodib 的临床策略。New Enterprise
              Associates（NEA）联席 CEO Mohamad Makhzoumi 被公开列为董事会成员。

              GenomeWeb 曾发表、随后更正一篇文章，最初将 Pathos 描述为 Tempus 分拆公司；更正说明 Pathos 由 Tempus 高管创立，但在法律上是独立且自主运营的公司。该事件显示，外部会审视
              Pathos–Tempus 关系，描述时必须谨慎：Pathos 不是 Tempus 实体，但人员与数据重叠对于独立性和利益冲突尽调是重大事项。

              关键人物集中度较高：2025 年 5 月 CEO 由 Fukushima 交棒 Huerga，与 Series D 交割同步，暗示这是一次融资前有意安排的管理层升级。除 Makhzoumi
              外，完整董事会构成尚未公开披露。
