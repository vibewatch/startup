      - number: '3.4'
        title: 护城河耐久性：Pathos 的位置有差异，但更多是可成立，尚未被证明
        blocks:
          - type: paragraph
            body: >-
              看多 Pathos 的最强理由是，它试图占住别人没有掌握的一层窄而有价值的环节：买入或授权临床相关肿瘤资产，用 AI
              和多模态证据选择最佳患者和试验设计，再把产出证据反哺下一次组合决策。这个战略位置真实存在。问题在于，公开可见的切换成本和定价权仍然偏弱。Tempus、Flatiron、Caris 和 ConcertAI
              更贴近临床工作流和生命科学预算。Schrödinger 在经常性软件变现上更清楚。Recursion、Insilico 和 Relay 在核心发现或设计上更深。因此，Pathos
              取决于能否展示市场看得见的闭环结果：一个由平台选择或重新设计的项目，实质性跑赢传统资产管理可能产生的结果。在公开证据出现前，护城河只能按新兴状态承销。这个利基具有战略吸引力，若得到证明很可能具备耐久性，但完成结果、重复合同或嵌入式工作流锁定效应中还看不到这种耐久性。
