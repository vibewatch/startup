      - number: '2.3'
        title: 买方与细分市场格局
        blocks:
          - type: paragraph
            body: >-
              肿瘤 AI 数据和药物发现平台的主要买方是大型制药公司，它们通过首席数字官和 VP 级研发负责人配置多年期数据授权费和平台费。商业规模证据较强：Tempus AI 报告 2026 年 Q1 收入
              $348.1M（同比 +36.1%），全年 2026 指引 $1.59–1.60B，其中包括与 Merck、Gilead、AstraZeneca 等公司围绕企业级肿瘤 AI 数据访问的多年战略合作。Caris
              Life Sciences 报告 2026 年 Q1 收入 $216.2M（同比 +79%），完成 52,800 个临床分析病例，数据库分析档案总量超过
              1.07M，说明大规模临床装机基础正在为分子分析服务付费。Tempus 和 Caris 合计意味着年化肿瘤数据服务市场约 $2.3B，为现实商业规模提供锚点。ConcertAI 是另一家肿瘤 RWE
              平台，2024 年 6 月以约 $1.9B 估值融资 $150M；Roche 2018 年以约 $1.9B 收购 Flatiron Health，则提供了更早的先例，证明生物制药愿意为肿瘤 RWD
              平台支付溢价。中型肿瘤生物技术公司构成第二层买方，用 AI 改善资产选择和试验设计效率，从而延展有限资本。学术癌症中心通过资助协议成为数据平台的量级买方，但很少产生商业规模合同。社区肿瘤网络和支付方（保险）是
              AI 导航服务的新兴买方——Humana 2025 年与 Thyme Care 合作——但对于 Pathos AI 当前销售动作仍属边缘。Pathos AI 声称拥有 200+ petabytes 多模态数据（约
              50× TCGA），但该数字似乎只出现在公司材料中且没有独立验证，因此很难评估数据集差异化主张。制药研发预算配置是关键闸门；已被证明的模式是多年期企业协议，预算项在 R&D（不是 COGS），由首席数字官或 AI
              官控制供应商选择。
