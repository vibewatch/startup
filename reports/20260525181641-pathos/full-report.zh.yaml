      - number: '1.4'
        title: 平台架构与管线
        blocks:
          - type: paragraph
            body: >-
              PathOS 平台围绕三个引擎组织。Scout 是 AI 赋能的资产筛选引擎，扫描所有在研疗法，将每项疗法匹配给最可能受益的患者亚群，并输出排序清单。Sprint 指小型自主临床执行团队（Sprint
              Pods），在 Pathos 内部像独立迷你生物技术公司一样运作，专注推动特定资产从一个里程碑走向下一个。Foundry 是共享 AI 核心，由与 Tempus 和 AstraZeneca
              合作构建的肿瘤基础模型驱动；Foundry 也连接 Pathos 的实验室闭环验证系统。

              截至报告运行日，Pathos 的管线包括四个项目。Pocenbrodib（P-300，前称 FT-7051）是一种 CBP/P300 抑制剂，2023 年从 Novo Nordisk
              授权引进（原开发方：Forma Therapeutics）。该药于 2025 年 3 月 20 日进入转移性去势抵抗性前列腺癌 Phase 1b/2a 临床试验（NCT06785636），目标入组约 203
              名患者。P-500（PRT811）是一种可入脑 PRMT5 抑制剂，2024 年 8 月从 Prelude Therapeutics 授权引进，Phase 1 已完成，并在 IDH+
              高级别胶质瘤中显示经确认的完全缓解；Pathos 计划开展生物标志物驱动的 Phase 2 试验。DO-2 是来自 DeuterOncology（Belgium）的氘代第三代 MET 激酶抑制剂，2026 年 5
              月在 Foundry 识别后通过取得多数股权收购；Phase 1 显示，在可评估 MET exon 14 skipping NSCLC 患者中肿瘤缩小率为 100%，外周水肿率 5%，竞争药物为
              62–82%。Milademetan（MDM2 抑制剂，来自 2024 年 1 月 Rain Oncology 收购）曾处 Phase 3 阶段，但收购后未再出现在 Pathos
              公开传播中，带来新鲜度和管线聚焦问题。

              Pathos 声称可接入超过 200 petabytes 多模态肿瘤数据，约为 The Cancer Genome Atlas（TCGA）的 50 倍。该说法来自公司自身，尚未独立验证。
