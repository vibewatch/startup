- id: named-proof
  title: 'Named external proof: Tempus is the clearest evidence of live adoption, but it mostly proves Pathos as a buyer'
  body: 'The strongest named external proof is the Tempus relationship. First, the Tempus and AstraZeneca collaboration shows that sophisticated counterparties are willing to build an oncology foundation model alongside Pathos. Second, the Tempus TIME case study provides operational proof that Pathos is using a third-party network to run an early-phase trial. The most concrete datapoint in the entire chapter is that six of the first ten matched patients on the pocenbrodib study came through the TIME network. Tempus also quotes Iker Huerga explaining that the network helped Pathos identify sites with likely eligible patients and activate quickly. Together, those facts move Pathos beyond a conceptual AI story into documented enterprise usage.


    However, the same evidence also reveals an important asymmetry: the public proof most clearly shows Pathos as the customer of Tempus'' data, network, and commercialization infrastructure. The named-customer-proof table therefore treats Tempus as both Pathos'' strongest external validator and its biggest commercial dependency. AstraZeneca adds strategic validation, but the public record still says little about how much of the economics or workflow Pathos owns outright. That is why the adoption funnel below interprets current traction as sponsor-grade enterprise proof rather than broad platform penetration.'
  claimRefs:
  - CU004
  - CU005
  - CU006
