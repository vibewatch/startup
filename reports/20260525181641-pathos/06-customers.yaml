- id: durability-gaps
  title: 'Durability and retention: the public record proves relationships exist, but not whether they stick or expand'
  body: 'This is the weakest part of the public customer story. Pathos does not disclose NRR, GRR, churn, contract duration, customer satisfaction, or expansion revenue. It also does not provide pricing or packaging detail that would let an investor infer how accounts progress from pilot to durable spend. That means the chapter can verify adoption events but cannot verify durability. The retention table is intentionally heavy on nulls because that is the truthful state of public evidence.


    The missing data matters more for Pathos than for mature peers because a handful of named relationships can create false confidence. A collaboration headline can represent a durable program, a short-term statement of work, or a one-time transaction. The same problem applies to asset counterparties such as Novo Nordisk, Prelude, Rain, and Deuter: these prove Pathos can transact, but they do not prove repeat commercial demand for the platform. Until Pathos discloses renewals, repeat-scope expansion, or reference-quality outcomes from customers, the right analytical stance is that relationship durability remains unproven from public evidence.'
  claimRefs:
  - CU027
  - CU028
  - CU029
  - CU030
