company:
  name: Pathos
chapter:
  number: 6
  title: Customers
  summary: 'Pathos has real external demand signals, but the public evidence is relationship-led rather than portfolio-level commercial transparency. The strongest proof is the Tempus relationship: Pathos and Tempus announced a multi-year collaboration with AstraZeneca, and Tempus later documented that six of the first ten matched patients in the Pathos pocenbrodib study came through the TIME network. What remains missing is the core commercial instrumentation — customer count, pricing, renewals, NRR, and concentration by revenue — that would let an investor treat Pathos as a clearly scaled customer franchise rather than an emerging enterprise-biotech platform.'
sections:
- id: visibility-and-segments
  title: 'Customer visibility: public evidence shows enterprise relationships, not a broad disclosed customer base'
  body: 'Pathos does not look like a traditional software or diagnostics company from a customer-disclosure standpoint. Its public site and financing materials do not disclose customer count, ARR, retention, or pricing. Instead, the company describes itself as partnering with pharma, biotech, academia, and investors while building a new operating model for oncology development. That framing matters because it implies the near-term buyer is likely an enterprise counterparty — a strategic pharma collaborator, a data network, or a trial-enablement partner — rather than a broad installed base of oncologists or hospitals purchasing a standardized product. The customer segmentation table therefore separates Pathos'' named external relationships into co-development partners, data / trial-enablement vendors, asset counterparties, and clinical users.


    The immediate conclusion is that public customer visibility remains low even though public relationship proof is real. Pathos has enough evidence to show external willingness to work with it, but not enough to map a diversified customer book. That is in sharp contrast to Tempus, Flatiron, Foundation Medicine, Caris, and ConcertAI, all of which publish stronger customer or usage scale claims. For diligence purposes, Pathos should be treated as a relationship-led biotech platform with emerging external demand signals, not as a transparently scaled commercial platform.'
