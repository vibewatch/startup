- id: concentration-and-expansion
  title: 'Concentration and expansion: Pathos may win more partners, but today the public customer picture is narrow'
  body: 'The concentration risk is straightforward. Tempus appears repeatedly in the public evidence as data supplier, model-building collaborator, trial-enablement network, and the clearest source of customer-proof style documentation. AstraZeneca is the other major named strategic counterparty. Outside those two, the public story becomes mostly a set of transactions or owned assets rather than a diversified roster of paying users. Because Pathos is private and silent on revenue-share detail, public evidence cannot quantify concentration by dollars or accounts; it can only show concentration qualitatively.


    Expansion is still plausible. Pathos now has a live sponsored trial, a second asset with prior phase 1 signal, a new MET program, and fresh Series D capital. If the company can show that its biomarker logic improves enrollment or response probability, the obvious next step is more pharma collaboration and more sponsor-grade studies. But the market is crowded with better-instrumented oncology platforms. Tempus, Caris, Foundation Medicine, Flatiron, ConcertAI, PathAI, Owkin, and Recursion all publish clearer commercial or usage signals. Pathos can still win, but it needs to convert named proof into a broader, measurable customer base before the customer chapter becomes an unequivocal strength.'
