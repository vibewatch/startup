- id: legal-regulatory-data
  title: Legal, regulatory, and data risks start with privacy, consent, and unsettled AI accountability
  body: 'The legal and regulatory stack is the most structurally important risk area because it reaches across every Pathos program. HHS is explicit that de-identified health data is not risk-free; residual re-identification risk remains even when privacy rules are followed correctly. That matters because Pathos’ public thesis depends on large patient-linked oncology data pools and a foundation model built with Tempus data. If regulators, counterparties, or enterprise customers become less comfortable with current de-identification practices, Pathos’ core training and evidence layer could become more expensive, slower, or more constrained.


    At the same time, oncology-specific AI accountability is still unsettled. The ASCO Post frames liability standards for AI-guided diagnosis and treatment as an evolving question, while the Springer review flags automation bias, informed consent, explainability, and bias in the training data itself. NCI adds another adoption constraint: biomarker testing is important, but it is not routine for most patients, which means Pathos’ biomarker-led thesis still runs into real-world workflow friction. FDA’s DTC guidance is not directly about Pathos, but it reinforces the general point that evidence quality and oversight vary widely in data-driven health tools. Net result: legal and regulatory risk is not a side issue for Pathos — it is part of the core business model.'
  claimRefs:
  - CR002
  - CR003
  - CR004
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
