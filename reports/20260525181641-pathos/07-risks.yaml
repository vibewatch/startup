- id: operational-and-partner
  title: Operational and partner risks are amplified because the cleanest public proof runs through Tempus
  body: 'The public evidence shows that Pathos can execute, but it also shows how dependent that execution is on external infrastructure. The Tempus TIME case study is valuable precisely because it is concrete: early-phase studies face site and patient bottlenecks, and Tempus says it helped identify six of the first ten matched patients in the Pathos study. That is encouraging, but it also means a core operational proof point for Pathos sits outside Pathos. Similarly, the Tempus and AstraZeneca collaboration gives Pathos scale it could not easily build alone, but it also makes partner continuity a live risk variable rather than a background detail.


    Clinical risk is similarly non-trivial. Pocenbrodib still has to clear early safety and efficacy thresholds before it graduates into a more mature value story. P-500 carries early-signal promise but also clear adverse-event history, and DO-2 remains a fresh acquisition based on a small phase 1 data set that still needs independent confirmation in broader populations. Add Rain integration and portfolio-prioritization questions, and the operational picture becomes one of real progress but meaningful fragility. The dependency map below treats Tempus as the single most important external node in the current Pathos risk stack.'
