  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-package
    missingEvidence: Model-governance package covering validation thresholds, human review, audit trails, and change control for PathOS outputs.
    whyItMatters: This is the core control set needed to lower legal, quality, and execution risk when AI outputs affect portfolio or trial decisions.
    diligencePath: Request SOPs, model cards, review-committee charters, and escalation thresholds.
    relatedQuestionRefs:
    - QR027
  - type: private-evidence-only
    severity: material
    topic: tempus-contingency
    missingEvidence: Contractual fallback and contingency plan if Tempus data access, TIME network support, or commercial terms change.
    whyItMatters: The public record shows a heavy dependency on Tempus; without fallback plans, supplier concentration risk remains high.
    diligencePath: Request data-rights summary, termination clauses, backup vendors, and internal migration plan.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: material
    topic: quality-metrics
    missingEvidence: Platform uptime, incident history, validation cadence, and post-deployment error monitoring for any Pathos decision-support workflow.
    whyItMatters: Without operational quality metrics, investors cannot tell whether the system is production-grade or still research-grade.
    diligencePath: Request reliability dashboards, QA tickets, and any CAPA or incident-review materials.
    relatedQuestionRefs:
    - QR018
  - type: enumeration-incomplete
    severity: minor
    topic: risk-register-coverage
    missingEvidence: A complete internal list of legal, regulatory, clinical, and partner risks beyond what is visible from public disclosures.
    whyItMatters: The public risk register is necessarily partial because Pathos does not publish detailed risk factors like a public company.
    diligencePath: Review board / diligence risk register and reconcile with this chapter.
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: portfolio-prioritization
    missingEvidence: Pathos has not publicly disclosed how it prioritizes or deprioritizes acquired assets such as milademetan after transactions close.
    whyItMatters: Opaque reprioritization raises the risk that capital and management attention are spread too thin or that hidden setbacks exist.
    diligencePath: Request current portfolio-review deck with stage, owner, spend, and rationale for each program.
    relatedQuestionRefs:
    - QR029
