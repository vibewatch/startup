chapter:
  number: 7
  title: Risks
  summary: Pathos’ biggest risks are concentrated, interconnected, and still only partially mitigated. The public record shows heavy dependency on Tempus for data and visible enrollment support, unsettled legal and privacy standards for oncology AI, early-clinical execution risk across pocenbrodib, P-500, and DO-2, and continued dependence on private financing rather than public revenue. The company may be building a differentiated operating system for oncology development, but until governance controls, partner contingencies, and clinical proof become more visible, the residual risk profile remains high.
sections:
- id: risk-overview
  title: 'Risk overview: Pathos carries concentrated partner, governance, and early-clinical risk'
  body: 'Pathos is not yet risky in the way a late-stage biotech is risky; it is risky in the way a concentrated AI-native oncology operating model is risky. The company is attempting to combine external data rights, model-building, biomarker logic, asset transactions, and trial execution into a self-improving system. That structure creates upside, but it also concentrates multiple failure modes in the same operating chain. If partner data rights narrow, if biomarker logic fails to generalize, if trial enrollment stalls, or if governance standards fall short, the system can break at several points before revenue or pivotal efficacy ever arrives. The risk heatmap therefore places data-rights concentration, legal and consent uncertainty, early-clinical execution, and financing dependence near the top of the register.


    This is not a purely theoretical concern. The public record already shows heavy dependence on Tempus for data scale and trial-enablement, multiple acquired or licensed assets that still require integration and prioritization, and sparse public governance detail about how PathOS outputs are validated before they influence decisions. Because the company remains private, investors do not yet get the risk-factor density that a public precision-oncology company would provide. The right posture is to assume residual risk remains high until private diligence materials prove otherwise.'
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR005
  - CR012
  - CR013
  - CR024
  - CR032
  - CR033
  - CR036
