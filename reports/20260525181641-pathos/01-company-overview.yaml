callouts:
  - calloutType: strength
    title: High-velocity asset acquisition through AI-powered deal sourcing
    body: >-
      Pathos AI has added four clinical-stage oncology assets in under four years (pocenbrodib, P-500,
      milademetan/Rain Oncology, DO-2/DeuterOncology) and executed a public-company tender offer. The
      DO-2 acquisition in May 2026 is the first claimed example of a clinical acquisition sourced,
      evaluated, and recommended entirely through the Foundry AI platform — a meaningful proof point
      for the Foundry value proposition if independently verifiable.
    claimRefs:
      - CO021
      - CO024
      - CO025
      - CO030
      - CO032

  - calloutType: risk
    title: Elevated key-person concentration and undisclosed investor roster
    body: >-
      Iker Huerga joined as CEO in May 2025 and has no prior Pathos-specific operating history; the
      CEO transition timing, coinciding with the Series D close, suggests a governance-triggered change.
      The Series D investor roster is entirely undisclosed, preventing external assessment of alignment
      and governance rights. Full board composition beyond Makhzoumi (NEA) has not been published.
    claimRefs:
      - CO007
      - CO010
      - CO017
      - CO036

  - calloutType: risk
    title: Milademetan pipeline status is opaque post-Rain acquisition
    body: >-
      Rain Oncology's lead asset milademetan (MDM2 inhibitor, Phase 3) was a central justification for
      the $1.16/share Rain acquisition, but the asset has not been mentioned in any Pathos press release
      since the acquisition closed in January 2024. This silence is a material disclosure gap — either
      the asset has been deprioritized, the CVR obligations remain in effect, or regulatory feedback has
      changed its development path. Later-chapter financials and pipeline diligence should attempt to
      resolve this.
    claimRefs:
      - CO025
      - CO027

  - calloutType: insight
    title: Tempus-AstraZeneca partnership is both the largest single cost item and strategic moat
    body: >-
      The $200 million in fees payable to Tempus AI under the April 2025 collaboration agreement is a
      significant cash commitment, likely absorbing a material portion of the Series D proceeds. At the
      same time, the resulting shared foundation model — co-owned by Pathos, Tempus, and AstraZeneca —
      represents a proprietary data and model advantage that could be difficult for later entrants to
      replicate. The net effect depends on the IP licensing terms and exclusivity scope, which are not
      publicly disclosed.
    claimRefs:
      - CO028
      - CO029
      - CO038

