company:
  name: Pathos
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Pathos AI is a Chicago-based, clinical-stage AI-enabled biotechnology company that applies multimodal
    oncology data and proprietary AI to re-engineer drug development, with $467 million raised across four
    rounds and a ~$1.6 billion post-money valuation as of its May 2025 Series D. The company's PathOS platform
    integrates three engines—Scout, Sprint, and Foundry—to systematically identify undervalued clinical assets,
    design biomarker-driven trials, and build the largest oncology foundation model in partnership with
    AstraZeneca and Tempus AI.
sections:
  - id: identity-and-stage
    title: Identity, Headquarters, and Stage
    body: >-
      Pathos AI, Inc. is a clinical-stage artificial intelligence and biotechnology company incorporated in
      Delaware and headquartered at 600 W. Chicago Ave., Suite 510, Chicago, Illinois 60654. The company's SEC
      CIK is 0001967854 and its IRS EIN is 852945509. Pathos was founded in 2022 at the intersection of
      technology, oncology, and lived cancer experience. Its official website is www.pathos.com and its
      fiscal year end is December 31.

      The company's stated mission is to transform drug development using proprietary patient data and AI to
      dramatically improve trial success rates and bring new therapies to patients who fail traditional
      treatments. Pathos describes itself as an AI-enabled biotechnology company focused on re-engineering
      drug development by leveraging AI technologies, multimodal real-world data, and patient-derived biological
      models. As of the run date, Pathos is a clinical-stage company with its lead program, pocenbrodib, in an
      active Phase 1b/2a clinical trial, and a pipeline that spans three additional oncology assets. No public
      employee count has been disclosed.

      Pathos defines its competitive differentiation as the combination of the largest proprietary multimodal
      oncology dataset (claimed at over 200 petabytes linked to patient outcomes) and a continuously learning AI
      platform—distinguishing it from both pure computational AI companies and traditional pharma acquirers.
      The company emphasizes that each completed trial feeds the next, creating a learning flywheel that compounds
      efficiency and evidence quality.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO035
      - CO037
      - CO040
    tableRefs:
      - TO001

  - id: founders-leadership-governance
    title: Founders, Leadership, and Governance
    body: >-
      Pathos AI was co-founded in 2022 by Eric Lefkofsky and Ryan Fukushima. Eric Lefkofsky is also the
      founder and CEO of Tempus AI, Inc. (Nasdaq: TEM), a health technology company specializing in AI-enabled
      precision medicine, which is a publicly disclosed relationship that explains Pathos's deep access to
      Tempus datasets. Ryan Fukushima served as the company's founding and interim CEO through early 2025.

      In May 2025, Iker Huerga joined Pathos AI as CEO and board member. Huerga is a cancer survivor and biotech
      veteran who most recently served as Chief Data Scientist for Oncology R&D at AstraZeneca—directly relevant
      given Pathos's ongoing AstraZeneca partnership. Dr. Jens Renstrup serves as Chief Medical Officer and has
      led the clinical strategy for pocenbrodib. Mohamad Makhzoumi, Co-CEO of New Enterprise Associates (NEA),
      is publicly identified as a board member.

      GenomeWeb published and subsequently corrected an article that initially described Pathos as a Tempus spinoff;
      the correction clarified that Pathos was founded by Tempus executives but is a legally distinct and
      independently operated company. This episode illustrates that the Pathos–Tempus connection is subject to
      external scrutiny and that the relationship should be characterized carefully: Pathos is not a Tempus entity,
      but the personnel and data overlap are material to diligence on independence and conflicts.

      Key-person concentration is elevated: the CEO transition from Fukushima to Huerga in May 2025 coincided with
      the Series D close, suggesting a deliberate pre-financing management upgrade. Full board composition beyond
      Makhzoumi has not been publicly disclosed.
    claimRefs:
