  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: >-
        Pathos AI has not publicly disclosed its employee headcount, team size, or any hiring or layoff
        announcements in SEC filings or press materials.
      whyItMatters: >-
        Headcount is a critical input to burn rate estimates and operational capacity assessments; without
        it, the burn against the Series D proceeds cannot be estimated and the organization's clinical
        execution capacity is opaque.
      diligencePath: >-
        Request employee count directly from company during due diligence; review LinkedIn headcount
        approximation as a triangulation; check any state employment filings.
      relatedQuestionRefs:
        - QO024
      relatedTableRefs:
        - TO002

    - type: missing-source
      severity: material
      topic: regulatory risk
      missingEvidence: >-
        No public guidance or precedent from FDA, EMA, or other regulatory agencies specifically addressing
        AI-guided patient selection and clinical trial design in oncology has been cited or confirmed.
      whyItMatters: >-
        Pathos AI's core value proposition (AI-driven biomarker selection and trial design) may be subject
        to emerging AI regulatory frameworks that could require additional validation, slow trial approval,
        or create liability if an AI-recommended patient selection strategy is later challenged.
      diligencePath: >-
        Review FDA's guidance on AI/ML-based software as a medical device; review EMA AI guidance;
        consult with regulatory counsel on applicability to clinical trial design tools.
      relatedQuestionRefs:
        - QO020

    - type: private-evidence-only
      severity: material
      topic: Series D investors
      missingEvidence: >-
        The identities of Series D investors have not been disclosed in press releases or SEC Form D
        filings; only investor count (11) is available from the Form D.
      whyItMatters: >-
        Unknown investor roster prevents assessment of board composition, governance alignment, information
        rights, liquidation preferences, or strategic investor conflicts of interest.
      diligencePath: >-
        Request cap table and investor rights agreement in due diligence; identify if any pharma companies
        (potential strategic investors or competitors) participated in the Series D.
      relatedTableRefs:
        - TO003

