  - id: milestones-and-context
    title: Chronology, Milestones, and Adverse Context
    body: >-
      Pathos AI's timeline from founding in 2022 to the May 2026 DeuterOncology acquisition spans four financing
      events, four asset additions, one completed acquisition, and two major strategic partnerships in under four
      years—a high-velocity clinical and corporate development pace relative to a company of its size. The
      milestone table consolidates the full chronology of record.

      The Rain Oncology acquisition (completed January 26, 2024) was the first major external transaction.
      Pathos's wholly owned subsidiary WK Merger Sub, Inc. acquired all outstanding Rain common shares at
      $1.16 per share plus a contingent value right per share; 28,031,182 shares were tendered, representing
      approximately 77% of outstanding shares. Rain's milademetan, a p53-MDM2 complex inhibitor, reached Phase 3
      but has largely disappeared from Pathos's public communications post-acquisition, which may indicate a
      pipeline reprioritization or a strategic hold.

      The Tempus/AstraZeneca collaboration announced April 23, 2025 is the most capital-intensive single event:
      $200 million in fees flow to Tempus, and the resulting foundation model will be shared among all three
      parties. AstraZeneca's direct involvement as both a customer and a co-developer of the model creates an
      unusual alignment of interests that warrants governance and conflict-of-interest diligence. The ASCO Post
      has highlighted the legal and liability uncertainties inherent in deploying AI tools in oncology decision
      contexts, which applies broadly to Pathos's ambitions.

      Three risk areas merit emphasis: first, key-person concentration in Huerga (newly installed CEO with no
      prior Pathos-specific tenure); second, the undisclosed Series D investor identities; and third, the
      regulatory and liability framework for AI-driven clinical trial design has not yet been settled globally.
