  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pathos-dataset-verification
    missingEvidence: No independent third-party audit or academic study has verified Pathos AI's claimed 200+ petabyte dataset size, multi-modal composition, de-identification methodology, or data quality metrics. All figures derive from company-authored press releases.
    whyItMatters: Dataset scale and quality are the core differentiator Pathos AI claims over competitors. Without independent verification, the claimed 50× TCGA scale advantage cannot be used as a high-confidence basis for competitive differentiation analysis, limiting the diligence conclusion on platform defensibility.
    diligencePath: 'Request independent data room review including: (1) methodology whitepaper on de-identification and consent framework; (2) comparison of dataset coverage to TCGA and comparable public benchmarks; (3) third-party audit or academic collaboration paper validating dataset composition and quality.'
    relatedQuestionRefs:
    - QM008
    - QM009
  - type: missing-source
    severity: material
    topic: pharma-partnership-deal-economics
    missingEvidence: No disclosed deal economics exist for individual pharma data partnerships with Tempus AI, Caris Life Sciences, or Pathos AI. Contract duration, per-sample pricing, minimum annual commitments, and revenue-share structures are not publicly available.
    whyItMatters: Without deal economics benchmarks, it is not possible to independently assess the revenue potential per biopharma partner for Pathos AI, the ramp to meaningful platform revenues, or the pricing leverage the company can command relative to Tempus and Caris incumbents.
    diligencePath: Request confidential partnership term sheets or revenue per pharma partner data in management presentations. Cross-reference with any Tempus AI or Caris Life Sciences investor disclosures that segment revenue by customer type. Check SEC filings of pharma counterparties for related-party disclosure of data partnership costs.
    relatedQuestionRefs:
    - QM015
    - QM025
acknowledgedWarnings: []
