- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication for Pathos AI
  - Diligence Ask
  rows:
  - - High oncology drug failure rates (~95% Phase-1-to-approval attrition)
    - Driver
    - Current
    - Creates urgent commercial demand for AI-assisted asset selection and trial optimization
    - Has Pathos AI validated that Scout-selected assets outperform industry baseline attrition?
  - - FDA RWE Framework and ongoing RWE guidance acceptance
    - Driver
    - Current / near-term
    - Enables data-driven regulatory submissions; expands the RWE solutions market
    - Which regulatory submissions has Pathos data contributed to, if any?
  - - Falling NGS sequencing costs enabling large-scale multi-omic datasets
    - Driver
    - Current / long-term
    - Lowers per-sample data acquisition cost; supports larger training datasets
    - What is Pathos AI's per-sample data acquisition cost and how does it trend?
  - - Precision medicine mandate and companion diagnostics growth
    - Driver
    - Current
    - Drives clinical demand for multi-omic profiling underpinning AI model training
    - How many FDA-approved companion diagnostics reference data in PathOS?
  - - HIPAA and GDPR data privacy regulations
    - Constraint
    - Current / persistent
    - Restricts cross-institutional data flows; requires privacy-preserving architectures
    - What data governance and de-identification architecture does PathOS use?
  - - Incumbent switching costs (Tempus, Caris embed longitudinal data)
    - Constraint
    - Medium-term
    - Pharma partners embed platform data across multi-year research programmes; displacement is costly
    - What contractual lock-in mechanisms do Tempus/Caris use with pharma partners?
  - - Undefined FDA pathway for AI-generated drug discovery hypotheses
    - Constraint
    - Near-term / evolving
    - Creates approval-path uncertainty for platform-derived drug candidates
    - Are any Pathos drug candidates subject to AI-specific FDA regulatory scrutiny?
  - - Capital intensity of multimodal data assembly and compute
    - Constraint
    - Current
    - High cash burn; dataset cost is undisclosed; Series D funds are finite
    - What is Pathos AI's quarterly cash burn and runway post-Series D?
