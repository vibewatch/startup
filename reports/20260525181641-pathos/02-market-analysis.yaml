- id: growth-drivers-and-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'Several structural forces drive demand for AI-enabled oncology drug discovery. Drug development failure rates remain extremely high — oncology drugs face approximately a 5% success rate from Phase 1 to regulatory approval — creating strong commercial motivation to improve asset selection and trial design with AI (Springer 2025 review). IQVIA reports 2,162 oncology trial starts in 2024 (+12% vs 2019), with 25 novel oncology active substances launched globally in 2024 at an average of 26 per year from 2020-2024 versus 16 per year in 2015-2019, indicating sustained pipeline productivity and continued need for AI optimization tools. The FDA''s Real-World Evidence Framework (2018) and subsequent guidance formally opened RWE as an evidentiary standard for certain submissions, creating regulatory tailwind. Falling NGS sequencing costs are enabling large-scale multi-omic datasets at declining per-sample cost; the NGS market is projected to grow from $12.98B in 2023 to $97.81B by 2035 at
    18.3% CAGR. The Tempus–AstraZeneca–Pathos AI partnership to build the largest multimodal oncology foundation model (April 2025, $200M combined payment to Tempus) illustrates active Big Pharma co-investment in AI data infrastructure. GrandView Research projects significant growth for AI in clinical trials driven by demand for faster enrollment, synthetic control arms, and biomarker eligibility criteria. Adoption constraints are material and durable. HIPAA (US) and GDPR (EU) restrict cross-institutional data flows; privacy-preserving architectures such as federated learning (as used by Owkin) are becoming commercial prerequisites. Incumbent platforms Tempus AI and Caris Life Sciences have entrenched pharma relationships with high switching costs: multi-year longitudinal research programs embed platform data across therapeutic programmes, making transitions expensive and slow. No defined FDA regulatory pathway exists for AI-generated drug discovery hypotheses, creating approval-path uncertainty
    for platform-derived drug candidates. Capital intensity of proprietary multimodal dataset assembly is high — Pathos AI''s dataset cost is not disclosed — and the absence of independent verification of Pathos''s 200+ petabyte dataset claim represents a due-diligence gap. The Springer (2025) review further notes that AI in oncology is predominantly validated retrospectively on single-centre data, limiting real-world generalizability.'
