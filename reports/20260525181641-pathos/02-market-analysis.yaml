chapter:
  number: 2
  title: Market Analysis
  summary: 'Pathos AI sits at the intersection of three overlapping oncology markets: AI-assisted drug discovery, real-world evidence (RWE) solutions, and precision oncology diagnostics. Global oncology medicine spending reached $252B in 2024 (IQVIA) and is forecast at $441B by 2029; the dedicated AI-in-oncology sub-segment was $2.45B in 2024, growing at 29.4% CAGR (MarketsandMarkets). Oncology RWE carries a ~$846M oncology slice in 2025 (Mordor). The primary buyers are Big Pharma R&D organizations paying multi-year data-licensing and platform fees; commercial incumbents Tempus AI ($348M Q1 2026 revenue) and Caris Life Sciences ($216M Q1 2026) already demonstrate at-scale demand. Growth is driven by high drug-failure rates, falling NGS costs, and regulatory acceptance of RWE; constraints include data privacy law, undefined AI-drug-discovery regulatory pathways, and high incumbent switching costs. Pathos AI is pre-commercial in therapeutics, creating significant uncertainty about revenue
    path and SOM capture.'
sections:
- id: market-boundary
  title: Market Boundary and Scope
  body: 'Pathos AI operates at the intersection of three analytically distinct but strategically interlocked oncology markets. First, AI-assisted oncology drug discovery: buyers are large and mid-size pharmaceutical R&D organizations seeking to identify and validate clinical assets more efficiently; status-quo substitutes include in-house bioinformatics teams, academic collaborations with cancer centres, and traditional statistical approaches to candidate screening. Second, oncology real-world evidence (RWE): biopharma companies, health technology assessors, and regulators purchase retrospective or prospective patient datasets to support regulatory submissions, post-market surveillance, and payer negotiations. Third, precision oncology diagnostics: next-generation sequencing (NGS), multi-omic profiling, and companion diagnostics serve as both a clinical care layer and the data substrate for AI training. Key exclusions from Pathos AI''s direct addressable market include drug manufacturing,
    clinical CRO operational services, hospital EHR software, and drug sales revenues — all adjacent but not captured by a platform-licensing model. The cancer epidemiology context is substantial: NCI estimates ~2.04M new US cancer diagnoses in 2025, while WHO reports ~10M global cancer deaths in 2022, and SEER projects ~2.11M new US cases and 626K cancer deaths in 2026. This patient volume creates the longitudinal data opportunity that oncology AI platforms compete to aggregate. Market boundary definition is highly contested: Tempus AI and Caris Life Sciences each span diagnostics, RWE, and AI modeling simultaneously, making competitive market delineation assumption- dependent and comparisons across analyst estimates unreliable without adjusting for scope.'
