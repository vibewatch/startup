  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preferences
    - Latest cap table, investor rights, liquidation preferences, anti-dilution terms
    - Determines true economic value beneath the headline mark
    - Management / legal data room
  - - Cash and runway
    - Cash balance, monthly burn, runway by scenario
    - Needed to judge financing risk and timing pressure
    - Finance team / board materials
  - - Revenue and contracts
    - Any paid platform, data, or partner revenue plus contract structure
    - Would materially change valuation method and confidence
    - Finance / commercial diligence
  - - Program budgets and milestones
    - Spend by asset and expected proof points
    - Needed to tie capital to value creation
    - R&D planning documents
  - - Series D composition
    - Primary vs secondary, participant list, strategic vs financial mix
    - Improves confidence in market signal quality
    - Financing documents / investor list
  notes: All five asks are required before treating the Series D mark as a fully underwritable entry price.
