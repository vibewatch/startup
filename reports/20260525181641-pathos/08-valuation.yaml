  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    missingEvidence: Current cash balance, cap table, investor rights, liquidation preferences, and whether the Series D included secondary sales.
    whyItMatters: These terms determine whether the published post-money valuation is economically relevant to new investors or heavily encumbered by preferences and insider structure.
    diligencePath: Request the latest capitalization table, financing documents, and board-approved use-of-proceeds plan.
    relatedQuestionRefs:
    - QV024
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Asset-level spend, platform spend, cash burn, and runway under base and downside scenarios.
    whyItMatters: Without cash-use detail, investors cannot tell whether the current financing gives enough time for proof creation before the next raise.
    diligencePath: Request budget by program, monthly burn, and scenario runway model.
  - type: private-evidence-only
    severity: material
    topic: revenue-model
    missingEvidence: Any paid software, data, or partner revenue already generated by Pathos, if any.
    whyItMatters: Even small revenue would materially change valuation framing and reduce reliance on pure optionality.
    diligencePath: Request current P&L or at least revenue-by-stream summary.
  - type: enumeration-incomplete
    severity: minor
    topic: comp-set
    missingEvidence: A fuller set of private rounds and M&A comparables for oncology AI and precision-medicine platforms.
    whyItMatters: The public comp set is informative but incomplete for private-market pricing.
    diligencePath: Augment with banker comparable-company deck and recent private transaction data.
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: governance-overhang
    missingEvidence: Board structure, investor vetoes, and governance provisions that could constrain future financing or exits.
    whyItMatters: Valuation without governance terms can materially overstate investability.
    diligencePath: Request charter, investor-rights agreement, and board observer list.
