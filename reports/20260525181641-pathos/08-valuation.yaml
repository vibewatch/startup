- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Tempus AI
    - ~$8.29B market cap; Q1 revenue $348.1M
    - Scaled public AI-precision-medicine platform
    - Best public reference for data-plus-AI oncology scale
    - Much more mature commercially than Pathos
  - - Caris Life Sciences
    - ~$3.87B aggregate market value; Q1 revenue $216.2M
    - Public precision-oncology diagnostics peer
    - Shows what revenue-bearing peers can look like
    - Different business mix and public-company obligations
  - - Recursion Pharmaceuticals
    - ~$1.6B market cap
    - Closest public market-cap analogue to current Pathos mark
    - Useful for AI-biotech platform comparison
    - Has public pipeline and market mark-to-market volatility
  - - Schrödinger
    - ~$0.99B market cap
    - Lower public benchmark for AI-enabled platform biotech
    - Useful downside anchor
    - Different model and software mix
  - - Relay Therapeutics
    - ~$2.90B market cap
    - Upper biotech platform reference without Tempus-scale revenue
    - Shows market willingness to pay for platform optionality
    - Not an exact AI-data analogue
  - - Absci
    - ~$795M market cap
    - Smaller AI-biotech benchmark
    - Useful lower bound for pre-scale optimism
    - Different modality and customer model
  notes: Partial but purposeful comp set emphasizing publicly traded or newly public companies with some AI / data / precision-oncology angle.
