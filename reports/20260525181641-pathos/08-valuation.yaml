- id: scenario-analysis
  title: Scenario analysis matters more than point estimates because outcome dispersion is extreme
  body: 'A single valuation number hides the core fact of the case: Pathos has unusually wide outcome dispersion. The bull case is easy to write. If the oncology foundation-model thesis works, if the Tempus/AstraZeneca collaboration produces repeatable insight, and if pocenbrodib, P-500, and newer sourced assets show real clinical leverage, then the current private mark could look conservative. In that world, Pathos graduates from an AI-drug-development narrative into a multi-asset, data-moat platform capable of supporting a multi-billion-dollar public valuation.


    The bear case is equally straightforward. If early clinical programs disappoint, if the Pathos/Tempus relationship proves more expensive or less durable than hoped, if public markets keep compressing AI-biotech multiples, or if hidden financing terms dilute future investors, then the current mark could prove aggressive. The sensitivity bar and valuation range figure therefore use rough public ranges rather than a false-precision DCF. In this chapter’s framework, Pathos screens as a track name whose upside is real but whose current price already assumes more success than the public record can yet verify.'
