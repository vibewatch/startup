- id: TV005
  title: Thesis-break and trigger table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Lead-program failure
    - Pocenbrodib fails to generate credible proof or is materially delayed
    - Undercuts platform credibility and next-fundraise narrative
    - Downgrade to avoid until proof or price resets
  - - Partner disruption
    - Tempus data / fee relationship weakens or changes materially
    - Damages core platform economics and supplier stability
    - Increase concentration discount immediately
  - - Down-round or insider-unfriendly terms
    - Next financing occurs below current mark or with heavy preference burden
    - Shows current valuation was too optimistic
    - Reprice expected returns materially lower
  - - Governance overhang
    - Data room reveals adverse preference stack or restrictive investor rights
    - Economic value to new capital is lower than headline mark
    - Pause underwriting until terms are renegotiated or fully modeled
  notes: Triggers focus on variables that would clearly change the investment call at or near the current price.
