- id: public-comp-set
  title: Public comparables suggest Pathos is already priced like a serious AI-biotech platform
  body: 'The cleanest public comp set puts Pathos in the middle of the public AI-biotech valuation pack despite the absence of public revenue. Tempus’ market cap was about $8.29 billion in late May 2026, supported by $348.1 million of Q1 revenue and full-year revenue guidance near $1.6 billion. Caris reported $216.2 million of Q1 revenue and disclosed an aggregate non-affiliate market value of about $3.87 billion in its 2025 10-K. Recursion sat around $1.6 billion, roughly equal to the Pathos private mark, while Schrödinger and Absci traded below $1.0 billion and Relay traded closer to $2.9 billion.


    This comparison does not prove that Pathos is overpriced, but it does prove that the Series D round asks investors to underwrite the company as something more than an early experimental vehicle. Pathos is being valued nearer to public platform biotech peers than to a typical opaque, pre-revenue private biotech. The comp table therefore pushes the judgment toward a stretched-but-not-crazy zone: the mark is plausible if the platform really compounds across multiple assets, but it is demanding relative to today’s level of public operating disclosure.'
