  topStrengths:
    - Odyssey has shipped a credible sequence of frontier world-model products in less than three years, including Odyssey-2 Max, Starchild-1, Agora-1, and PROWL.
    - The investor and partner base is unusually strong for the stage, with Natural Capital, Amazon, AMD Ventures, GV, EQT, and In-Q-Tel all validating the research direction.
    - The company sits in a large and still-forming physical-AI category where differentiated simulation quality could create strategic value for robotics, gaming, and defense buyers.
  topRisks:
    - No public revenue, ARR, customer count, burn rate, or gross-margin data exists, so the valuation cannot be tied to operating fundamentals.
    - The $1.45B price assumes future commercial scale despite limited named-customer proof and a still-young private-beta product surface.
    - Large-cap competitors such as NVIDIA, Google DeepMind, and other world-model startups could compress Odyssey's moat before commercial traction is proven.
  unresolvedGaps:
    - Actual ARR or recognized revenue, including any conversion from private beta users into paying enterprise accounts
    - Fully diluted cap table, board composition, legal entity details, and liquidation-preference terms for the Series B
    - AWS partnership economics, including minimum commitments, compute pricing, and whether the relationship creates durable GTM leverage
