companyProfile:
  summary: >-
    Odyssey is a Palo Alto-based AI research lab founded in 2023 by Oliver Cameron and Jeff Hawke to build general-purpose world models: causal,
    multimodal systems that simulate how the physical world evolves over long horizons. The company has rapidly released Odyssey-2 Max,
    Starchild-1, Agora-1, and PROWL while assembling a high-profile investor syndicate led by Natural Capital and including Amazon, AMD Ventures,
    GV, EQT, and In-Q-Tel. Public positioning is strongest in robotics, gaming, defense, healthcare, and scientific simulation, but the core diligence
    constraint is disclosure quality: Odyssey has not publicly disclosed revenue, ARR, customer count, board composition, or the economic terms of its AWS partnership.
  founders:
    - name: Oliver Cameron
      role: Co-Founder & CEO
      background: Previously co-founded Voyage and later served as VP of Product at GM's Cruise.
      claimRefs:
        - CO003
    - name: Jeff Hawke
      role: Co-Founder & CTO
      background: Former founding engineer at Wayve with direct world-model and autonomous-driving experience.
      claimRefs:
        - CO004
  foundingLocation: Palo Alto, California, USA
  headquarters: Palo Alto, California, USA
  productSummary: Odyssey-2 Max for physics-accurate world simulation, Starchild-1 for real-time multimodal world modeling, Agora-1 for shared multi-agent simulation, and PROWL for active-learning improvement of world models
  customerFocus: Frontier robotics teams, gaming and simulation developers, enterprise partners, and government/defense-adjacent users exploring physical-world simulation
  businessModel: Developer API and enterprise-partnership model anchored on private beta access, strategic cloud/computing relationships, and future simulation platform monetization
