  evidenceGaps:
    - type: "private-evidence-only"
      severity: "blocking"
      topic: "revenue-and-arr"
      missingEvidence: >-
        Odyssey has disclosed no revenue, ARR, MRR, or revenue growth rate in any public source.
        The company's financial viability rests entirely on investor conviction and research momentum
        rather than demonstrated commercial traction.
      whyItMatters: >-
        Without revenue data, the $1.45B valuation cannot be benchmarked to any standard multiple.
        A $50M ARR at $1.45B implies a 29× revenue multiple (aggressive but defensible for frontier AI);
        at $0 ARR the valuation is a pure research bet with no financial underwriting basis.
      diligencePath: >-
        Request audited or management-prepared P&L for the most recent completed fiscal year;
        obtain ARR bridge showing new ARR, expansion, and churn since founding; compare to
        comps at Series B stage (World Labs, Runway, Stability AI) when available.

    - type: "private-evidence-only"
      severity: "blocking"
      topic: "burn-rate-and-runway"
      missingEvidence: >-
        Monthly cash burn rate has not been disclosed by Odyssey. Author estimates of $2–5M/month
        carry a 2.5× uncertainty range, producing a runway estimate of 62–155 months — too wide
        to be operationally useful.
      whyItMatters: >-
        Burn rate determines Series C timing, operating leverage, and whether Odyssey needs
        significant revenue before raising again. A $5M/month burn exhausts the Series B in
        just over 5 years; a $2M/month burn provides 13+ years. The difference is material
        for any capital adequacy assessment.
      diligencePath: >-
        Obtain 3-month trailing cash burn schedule broken out by compute, headcount, data, and G&A;
        request board-approved 12-month budget; compare to Series B use-of-funds commitments.

    - type: "missing-source"
      severity: "material"
      topic: "sec-form-d-legal-entity"
      missingEvidence: >-
        No SEC Form D filing was found for any entity matching Odyssey ML in EDGAR as of June 22,
        2026. The company's legal entity name, state of incorporation, cap table, and regulatory
        disclosure history are unknown.
      whyItMatters: >-
        Without a legal entity name and cap table, dilution history, governance rights, and
        investor protections cannot be assessed. The absence of a Form D may indicate the filing
        has not yet been made (within the 15-day window for the Series B), the company uses a
        different legal name, or a non-Reg D exemption was used.
      diligencePath: >-
        Obtain certificate of incorporation (Delaware or applicable state); request fully diluted
        cap table including all option grants and warrants; search EDGAR under the exact legal
        entity name once disclosed; verify Regulation D exemption basis for all rounds.

    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-count-and-avc"
      missingEvidence: >-
        No customers, enterprise contracts, pilots, or letters of intent have been named in any
        public source. AWS go-to-market commitment is the only commercial channel signal.
      whyItMatters: >-
        Customer count, average contract value (ACV), and customer acquisition cost (CAC) are
        required inputs for LTV/CAC ratio and payback period calculations. Without at least one
        named reference customer, commercial viability is unverified.
      diligencePath: >-
        Request list of current and pipeline enterprise customers with ACV, start date, and
        stage (signed/pilot/LOI); obtain any AWS marketplace deal registration data; reference
        check at least 2 production deployment partners.

    - type: "private-evidence-only"
      severity: "material"
      topic: "compute-economics"
      missingEvidence: >-
        The per-simulation-second compute cost on AWS Trainium versus GPU baselines is not
        disclosed. The economic benefit of the AWS partnership (credits, discounted rates,
        or purely a distribution arrangement) is unknown.
      whyItMatters: >-
        Compute cost drives gross margin path. If Trainium provides 30–50% cost reduction vs
        H100 at comparable throughput, Odyssey's margin profile improves materially. If the
        partnership is primarily a GTM arrangement without cost advantages, the current
        high capital intensity may persist at scale.
      diligencePath: >-
        Request compute cost per simulation second on Trainium vs H100 baseline; obtain any
        committed spend schedule or compute credit allocation from the AWS partnership terms;
        benchmark against publicly available Trainium3 UltraServer pricing.
