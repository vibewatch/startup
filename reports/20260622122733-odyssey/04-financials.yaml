company:
  name: "Odyssey"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Odyssey has raised $337 million in total, with a $310 million Series B closed June 17, 2026 at a $1.45 billion
    post-money valuation, but operates in near-total financial opacity: no revenue, ARR, pricing, customers, burn rate,
    or gross margin have been publicly disclosed. The business model is developer API access plus enterprise partnerships
    routed through an AWS go-to-market channel, but no self-serve pricing page exists and no named customers or contracts
    have been announced. Capital intensity is extreme—approximately $6.1 million raised per employee—driven by
    compute-heavy world model training, confirmed by Amazon's description of world models as among "the most demanding
    workloads in AI." No SEC Form D filing for any Odyssey entity matching the AI world model company was found in
    EDGAR as of June 22, 2026. The primary underwriting blockers are: undisclosed ARR and burn rate, no commercial
    pricing structure, absence of named customers, undisclosed legal entity and cap table, and no basis for the
    $1.45B valuation beyond investor conviction in the research program.

sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue Model and Pricing"
    body: >-
      Odyssey's commercial architecture centers on two interdependent revenue channels: direct API/platform access for
      developers and custom enterprise agreements structured in partnership with Amazon Web Services. The company's
      public materials describe a portfolio of four models—Odyssey-2 Max, Starchild-1, Agora-1, and PROWL—all framed
      as developer-integrable products, yet as of June 22, 2026, odyssey.ml carries no pricing page, no subscription
      tiers, no credit or usage rates, and no self-serve checkout flow. The applications page enumerates more than
      twenty potential use cases spanning robotics, gaming, healthcare, defense, education, fitness, hospitality, and
      retail, but none of these are accompanied by commercial terms, case studies, or reference customers.

      The Series B announcement introduced a material structural development: AWS is now Odyssey's "preferred cloud
      provider" and the relationship includes explicit "go-to-market efforts," meaning Amazon's distribution
      infrastructure is involved in customer acquisition—not just compute delivery. This channel arrangement is
      economically common for AI inference startups that rely on hyperscaler marketplaces, but the deal economics
      (rev-share splits, minimum committed spend, customer ownership) are entirely undisclosed.

      Air Street Capital's public portfolio lists Odyssey as an "Interactive video (US/UK)" company, a framing
      that differs meaningfully from Odyssey's own general-purpose world model positioning and suggests early-stage
      investor classification may still be anchored in the narrow video-generation vertical rather than the broader
      simulation and robotics markets. No recognition policy has been disclosed; for any revenue that exists, it is
      likely usage-based (recognized on consumption) for API access or milestone/ratable for enterprise contracts.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI007
