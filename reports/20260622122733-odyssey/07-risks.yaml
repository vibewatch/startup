  - id: people-governance-execution-risks
    title: "People, Governance, and Execution Risks"
    body: >-
      Odyssey is a two-founder-led company with Oliver Cameron as CEO and Jeff Hawke as CTO. Both are
      publicly identified as the primary technical and strategic spokespersons; no deputy executives, chief
      product officer, chief legal officer, or general counsel have been publicly identified in any job posting,
      press release, or investor communication. The careers page confirms that HR infrastructure is "in early
      stages of development — it exists but isn't optimized, or it doesn't exist at all." No independent
      board members have been disclosed; the board composition remains entirely opaque from public sources.
      This governance deficit matters because Odyssey is targeting regulated verticals (defense, healthcare)
      that require compliance and legal infrastructure, entering GPAI regulatory oversight under the EU AI Act,
      and managing a $337 million capital base with no disclosed accountability structure beyond the two founders.

      Execution risk is amplified by the absence of a go-to-market function. No account executives, enterprise
      sales managers, or sales development representatives appear in Odyssey's open positions as of June 22,
      2026. AWS's go-to-market collaboration is the primary disclosed distribution mechanism, but this
      arrangement's commercial terms, exclusivity scope, and minimum commitment are not disclosed. The team's
      background in autonomous vehicles provides deep world-model research expertise but limited experience
      building enterprise compliance infrastructure or navigating multi-jurisdictional regulatory landscapes.
      Talent retention is a structural risk at 55 employees competing against DeepMind, Waymo, Tesla, and
      other frontier AI labs for the same scarce skill set.
