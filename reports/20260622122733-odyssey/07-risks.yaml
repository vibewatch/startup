chapter:
  number: 7
  title: "Risks"
  summary: >-
    Odyssey's most material risks concentrate in three areas: regulatory exposure (EU AI Act GPAI obligations
    effective August 2025 with full applicability August 2, 2026; BIS export controls triggered by IQT/defense
    use; API data-training clauses that raise GDPR compliance questions), operational dependency (entire compute
    infrastructure committed to AWS Trainium — an emerging, commercially unproven chip for world-model workloads
    — with no disclosed multi-cloud fallback), and execution risk (two-founder key-person concentration in a
    55-person team with no disclosed independent board, no head of product, and no enterprise sales force while
    pursuing a $1.45B valuation against zero disclosed revenue). Capital intensity is extreme ($6.1M raised per
    employee) but runway is likely adequate post-Series B. None of these risks are individually fatal; together
    they reflect a company in prototype-stage commercialization that has not yet built the compliance,
    governance, or go-to-market infrastructure required by its target verticals.

sections:
  - id: regulatory-legal-risks
    title: "Regulatory and Legal Risks"
    body: >-
      Odyssey operates at the intersection of multiple high-stakes regulatory regimes. The EU AI Act classifies
      general-purpose AI (GPAI) models — exactly the category Odyssey's world models occupy — as subject to
      mandatory transparency, copyright-traceability, and safety-evaluation obligations that became applicable
      on August 2, 2025. Full applicability of the AI Act is scheduled for August 2, 2026, a date only six
      weeks from this report's run date. Odyssey has offices in London and Zurich in addition to its Palo Alto
      headquarters, making UK GDPR, Swiss DSG, and EU GDPR all relevant data-protection frameworks. The API
      License Agreement, updated January 22, 2026, grants Odyssey a "worldwide, perpetual, irrevocable,
      royalty-free" license to use customer prompt data and output data to train its AI models — language that
      may conflict with GDPR requirements for limited-purpose data processing and the right to erasure in the
      absence of a publicly available Data Processing Agreement (DPA). No DPA is linked from Odyssey's public
      API documentation.

      Export-control risk is elevated by IQT's participation in the Series B. In-Q-Tel's public mission is to
      accelerate technologies for U.S. national security; its portfolio investments routinely precede
      intelligence-community procurement. Odyssey's declared warfighter-training and defense simulation use
      cases would require compliance with International Traffic in Arms Regulations (ITAR) and BIS Export
      Administration Regulations (EAR) if model weights, training techniques, or outputs are provided to
      foreign nationals or entities, including through the API. BIS has intensified enforcement of advanced
      computing export controls, issuing new guidance in May 2026 on license requirements for entities in
      Country Group D:5. No ITAR registration, export-control compliance program, or EAR classification
      opinion has been publicly disclosed by Odyssey. The FTC has also placed the AI compute sector on notice
      for antitrust risks arising from cloud-provider exclusive deals — directly relevant to the AWS preferred-
      cloud arrangement disclosed in the Series B.
