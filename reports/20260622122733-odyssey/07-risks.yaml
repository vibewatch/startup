  - id: operational-technical-security-risks
    title: "Operational, Technical, and Security Risks"
    body: >-
      The most immediate operational risk is the prototype status of the product. Odyssey's API License
      Agreement explicitly describes the API as a "prototype," with all warranties disclaimed and no uptime
      service-level agreement offered. This is a contractually documented constraint: enterprise customers in
      any regulated vertical — defense, healthcare, financial services — cannot accept a prototype-tier SLA.
      Five months of API availability provides no longitudinal reliability track record.

      Technical quality risks center on the inherent limitations of world-model generation. The PROWL paper,
      co-authored by Odyssey and UCL researchers, explicitly documents reward-hacking failure modes under
      weak behavioral constraints. Odyssey's physics-accuracy claims rest on the VBench 2 benchmark, which
      has not been independently audited and relies on metrics Odyssey helped popularize. No content-safety
      technical report, model card with bias evaluation, or AI safety framework has been published. GitHub
      community repositories using the API demonstrate creative but potentially unmoderated applications —
      including AI battle simulations — indicating that safety and moderation infrastructure has not been
      described publicly. Security posture is opaque: no SOC 2 Type II, FedRAMP, ISO 27001, or equivalent
      certification has been identified in any public documentation. World-model APIs that stream
      audiovisual output could expose prompt injection, adversarial input exploitation, or training-data
      extraction attacks. No incident-response policy is publicly disclosed.
    claimRefs:
      - CR004
      - CR014
      - CR015
      - CR016
