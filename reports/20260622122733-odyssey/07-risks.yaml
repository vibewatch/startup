callouts:
  - calloutType: risk
    title: "EU AI Act Full Applicability in Six Weeks — Odyssey Has Not Publicly Confirmed GPAI Compliance"
    body: >-
      The EU AI Act becomes fully applicable on August 2, 2026 — six weeks from this report's run date.
      Odyssey's world models qualify as General-Purpose AI systems under the Act's GPAI definition. The
      GPAI Code of Practice and training-data transparency template have been published since July 2025.
      No public statement, compliance report, or EU AI Office registration has been identified from Odyssey.
      Failure to comply could restrict access to the EU market and attract enforcement action from the EU AI
      Office starting August 2.
    claimRefs:
      - CR001
      - CR002
      - CR003
  - calloutType: risk
    title: "API Data-Training Clause Creates GDPR Tension"
    body: >-
      Odyssey's API License Agreement grants the company a worldwide, perpetual, irrevocable license to
      train its AI models on all customer-submitted prompt and output data. No GDPR Data Processing Agreement
      is publicly linked from the API documentation. This clause is in direct tension with GDPR Article 5
      (purpose limitation) and Articles 17/18 (erasure and restriction), and may require renegotiation before
      Odyssey can onboard EU enterprise customers at scale.
    claimRefs:
      - CR005
      - CR006
      - CR007
  - calloutType: risk
    title: "Single-Vendor Compute Concentration: AWS/Trainium at Series B Scale"
    body: >-
      With $310 million freshly raised and a declared plan to scale world-model training and inference,
      Odyssey's entire compute infrastructure is committed to AWS Trainium — a chip designed for training
      workloads that has not demonstrated commercial-scale world-model inference viability. No multi-cloud
      fallback, no disclosed SLA with AWS, and no contingency compute plan have been identified. This
      creates a single point of failure for both technical execution and commercial distribution.
    claimRefs:
      - CR012
      - CR013
      - CR041

