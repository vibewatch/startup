  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >-
              Odyssey's commercial architecture centers on two interdependent revenue channels: direct API/platform
              access for developers and custom enterprise agreements structured in partnership with Amazon Web Services.
              The company's public materials describe a portfolio of four models—Odyssey-2 Max, Starchild-1, Agora-1,
              and PROWL—all framed as developer-integrable products, yet as of June 22, 2026, odyssey.ml carries no
              pricing page, no subscription tiers, no credit or usage rates, and no self-serve checkout flow. The
              applications page enumerates more than twenty potential use cases spanning robotics, gaming, healthcare,
              defense, education, fitness, hospitality, and retail, but none of these are accompanied by commercial
              terms, case studies, or reference customers.

              The Series B announcement introduced a material structural development: AWS is now Odyssey's "preferred
              cloud provider" and the relationship includes explicit "go-to-market efforts," meaning Amazon's
              distribution infrastructure is involved in customer acquisition—not just compute delivery. This channel
              arrangement is economically common for AI inference startups that rely on hyperscaler marketplaces, but
              the deal economics (rev-share splits, minimum committed spend, customer ownership) are entirely
              undisclosed.

              Air Street Capital's public portfolio lists Odyssey as an "Interactive video (US/UK)" company, a framing
              that differs meaningfully from Odyssey's own general-purpose world model positioning and suggests
              early-stage investor classification may still be anchored in the narrow video-generation vertical rather
              than the broader simulation and robotics markets. No recognition policy has been disclosed; for any
              revenue that exists, it is likely usage-based (recognized on consumption) for API access or
              milestone/ratable for enterprise contracts.
