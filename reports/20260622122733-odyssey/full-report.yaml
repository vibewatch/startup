      - number: '5.3'
        title: Deployment, API, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Odyssey delivers all models through a REST API backed by AWS infrastructure and optimized for AWS Trainium
              chips. At launch in January 2026, three API endpoints were published: interactive streams for real-time
              embedded simulation, viewable streams for read-only multi-user distribution of a single interactive
              stream, and simulations for offline batch generation. Official JavaScript and Python SDKs are available,
              with iOS and Android SDKs described as forthcoming. Developers access the API via a portal at
              developer.odyssey.ml. The API license agreement, dated 2026-01-22 and governing access to the "prototype"
              Odyssey-2 API, is the primary published legal instrument; it disclaims all warranties and specifies no
              uptime SLA.

              From a roadmap perspective, the careers page signals investment in inference infrastructure "to scale to
              hundreds of thousands of users within a year" and optimization of TFLOPS per user and training compute
              cost. The Data Program Manager role references a "data flywheel" model for continuously expanding training
              data. The Head of Product role signals the transition from pure research to product platform. Odyssey has
              three engineering hubs: Palo Alto (headquarters), London, and Zurich. The rapid release cadence — three
              major model launches in six weeks (May–June 2026) — indicates active research velocity but also
              early-stage instability risk as products lack hardened production specifications.
