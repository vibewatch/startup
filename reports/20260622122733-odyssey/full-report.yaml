            body: >-
              Odyssey targets three primary customer archetypes. Developer-researchers are the immediate customer of
              record: the Odyssey-2 Pro API, launched January 23 2026, is addressable by any developer with API key
              access through developer.odyssey.ml. Intended enterprise customers span gaming studios, robotics OEMs,
              defence and intelligence agencies, healthcare simulation platforms, and education technology providers —
              all verticals named explicitly by Odyssey in product and blog materials. Strategic investor-partners
              (Amazon/AWS, Samsung Next, IQT) represent a third tier: entities whose commercial and technical alignment
              with Odyssey may eventually materialise into production deployments but have not yet been confirmed as
              paying customers.

              The product surface distinguishes tiers: Odyssey-2 Pro is the broadly accessible API model; Odyssey-2-Max
              targets higher-throughput enterprise workloads. The Broadcast API feature, launched alongside iterative
              product updates, enables multi-user shared simulation sessions — directly relevant for gaming and defence
              training use cases. At the time of this report the API is explicitly labelled a "prototype" in Odyssey's
              legal terms, constraining enterprise adoption under any compliance or uptime SLA requirement.

              No user counts, active developer figures, or API call volumes have been publicly disclosed. The API is
              approximately five months old at the run date, meaning any adoption trajectory must be treated as nascent
              and any cohort-retention data is structurally unavailable from public sources.
