  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite and Customer Delivery
        blocks:
          - type: paragraph
            body: >-
              Odyssey offers developers and enterprise partners access to a portfolio of four distinct AI systems,
              unified by a shared causal autoregressive architecture and delivered via the Odyssey API. The flagship
              product line is the Odyssey-2 series of general-purpose world models. Odyssey-2 (October 2025)
              demonstrated that a model trained purely on video and interaction data can learn basic physics, dynamics,
              and behaviors. Odyssey-2 Pro (January 2026) substantially expanded capacity, streaming 720P video at 22
              FPS in real time via three API endpoints: interactive streams (embed a live simulation), viewable streams
              (distribute one interactive stream to many users), and simulations (batch offline generation). Odyssey-2
              Max, announced alongside the Series B in June 2026, achieves the highest physics score among evaluated
              world models on VBench 2 and the Physical AI benchmark, while still running in real time.

              Beyond the core Odyssey-2 line, Odyssey has released two research-preview products: Starchild-1 (May
              2026), the world's first real-time multimodal world model generating synchronized audio and video, and
              Agora-1 (May 2026), a multi-agent world model enabling up to four participants to share a generated world
              simultaneously. The PROWL RL framework (May 2026, arXiv:2605.18803) underpins model improvement but is not
              itself a commercial product. All products are currently at research-preview or early API stage; no
              published production uptime or SLA commitment exists as of the run date. The declared target verticals are
