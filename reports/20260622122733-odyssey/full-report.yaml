      - number: '2.2'
        title: Market Sizing and Landscape
        blocks:
          - type: paragraph
            body: >-
              No independent analyst firm had, as of June 2026, published a market sizing for the general-purpose world
              models segment as a standalone tracked category. The category remains nascent and is captured only within
              broader adjacent markets. Odyssey's investor GV publicly described world models in June 2026 as a
              "multi-billion-dollar category," which is the most specific third-party market size statement available.

              Three broad boundary lenses bound the addressable opportunity. The simulation software market provides the
              narrowest applicable frame: Mordor Intelligence sized it at USD 15.46 billion in 2026, growing to USD
              28.59 billion by 2031 at a 13.08% CAGR, with AI-driven generative simulation workflows adding
              approximately 1.70 percentage points to that growth trajectory. The generative AI market provides the
              broadest frame: USD 28.45 billion in 2026 growing to USD 126.66 billion by 2031 at a 34.82% CAGR, with
              healthcare as the fastest-growing vertical at 36.36% CAGR. A combined boundary covering both markets
              yields a 2026 envelope of approximately USD 43.9 billion for the technology spend within which world
              models compete and eventually displace.

              Applying a conservative 5–15% penetration assumption for AI-first simulation approaches to the simulation
              software market yields an author-estimated SAM of USD 1.5–4.6 billion in 2026. This is consistent with
              GV's "multi-billion-dollar category" characterization but is not corroborated by independent sizing. The
              video game market (USD 326.47 billion in 2026, 12.68% CAGR) and medical simulation market (USD 3.01
              billion in 2026, 14.12% CAGR) represent distinct vertical sub-markets with their own procurement and
              pricing dynamics. These market estimates contain significant methodological variation and should be
              treated as directional rather than predictive. The sizing figures from Mordor Intelligence are proprietary
              estimates based on their internal framework as of January 2026 and have not been independently audited.
