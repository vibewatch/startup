  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              The general-purpose world models market encompasses AI systems trained through causal next-state
              prediction to simulate how physical environments evolve over time, using large-scale video and interaction
              data as the primary training signal. Odyssey positions its products within this segment, distinguishing
              them from two adjacent categories: narrow domain-specific simulators (hand-crafted physics engines that
              encode domain rules explicitly, such as rigid-body or finite-element solvers) and pure video generation
              models that produce photorealistic content without grounding in physical causality.

              Included spend covers developer API access to interactive world simulation, enterprise licensing for
              simulation infrastructure, research access for embodied AI agent training, and compute partnerships for
              running physics-accurate simulations at scale. Excluded spend includes traditional simulation software
              (Ansys, Siemens Xcelerator, MathWorks Simulink), physics game engines (Unity, Unreal Engine),
              text-to-image or text-to-video models without causal prediction objectives, and narrow autonomous-driving
              simulators that do not generalize across domains.

              Status-quo substitutes are diverse. In robotics, teams today use NVIDIA Isaac Gym, MuJoCo, or PyBullet for
              synthetic robot policy training, supplemented by expensive real-world data collection programs. In gaming,
              procedural generation engines and pre-scripted NPC behaviors substitute for learned world models. In
              defense and healthcare, purpose-built scenario simulators (VSTARS, VirtaMed) serve training needs within
              their prescribed domains. The adjacent spend in synthetic data generation, digital twins, and spatial AI
              is converging toward world models as capabilities mature, suggesting an expanding addressable boundary
              over a three-to-five year horizon. Google DeepMind's Genie 2 and Wayve's GAIA demonstrate that
              deep-pocketed incumbents are building competing general-purpose world models, validating the segment's
              significance while increasing the substitution risk.
