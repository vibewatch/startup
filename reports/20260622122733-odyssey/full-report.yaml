      - number: '1.3'
        title: Funding History and Investors
        blocks:
          - type: paragraph
            body: >-
              Odyssey has raised $337 million across multiple financing rounds from its 2023 founding through June 2026.
              Prior to the Series B, the company raised approximately $27 million (per TechFundingNews, corroborated by
              the $337M total minus the $310M Series B) through a series of early rounds. Initial backers included GV
              (Google Ventures), EQT, and Air Street Capital as institutional investors, joined by angel investors Jeff
              Dean, Elad Gil, Qasar Younis, Garry Tan, Guillermo Rauch, and Kyle Vogt. In February 2026,
              NVentures—NVIDIA's venture capital arm—and Samsung Next made a strategic investment alongside existing
              investors, marking what TechFundingNews designates as the Series A. The individual round sizes within the
              pre-Series B $27 million total are not publicly disclosed.

              The pivotal event is the $310 million Series B announced on June 17, 2026, at a $1.45 billion post-money
              valuation, led by Natural Capital. GP Jay Zaveri described it as Natural Capital's largest investment to
              date. Participating investors include Amazon, AMD Ventures, GV (follow-on), EQT (follow-on), and In-Q-Tel
              (IQT). A strategically significant development is that NVIDIA's NVentures did not participate in the
              Series B despite having backed the Series A just four months earlier. Instead, Amazon became Odyssey's
              preferred cloud provider with a commitment to use AWS Trainium chips, representing a deliberate shift in
              compute dependency from the NVIDIA GPU ecosystem toward Amazon and AMD architectures.

              The presence of In-Q-Tel signals meaningful government and defense sector engagement, as IQT invests in
              technologies of strategic importance to the U.S. intelligence community. No secondary transactions,
              convertible notes, or credit facilities have been publicly disclosed. The implied dilution across rounds
              is unknown since pre-Series B round documentation is private.
