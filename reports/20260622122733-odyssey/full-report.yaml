      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: EU AI Act Full Applicability in Six Weeks — Odyssey Has Not Publicly Confirmed GPAI Compliance
            body: >-
              The EU AI Act becomes fully applicable on August 2, 2026 — six weeks from this report's run date.
              Odyssey's world models qualify as General-Purpose AI systems under the Act's GPAI definition. The GPAI
              Code of Practice and training-data transparency template have been published since July 2025. No public
              statement, compliance report, or EU AI Office registration has been identified from Odyssey. Failure to
              comply could restrict access to the EU market and attract enforcement action from the EU AI Office
              starting August 2.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: API Data-Training Clause Creates GDPR Tension
            body: >-
              Odyssey's API License Agreement grants the company a worldwide, perpetual, irrevocable license to train
              its AI models on all customer-submitted prompt and output data. No GDPR Data Processing Agreement is
              publicly linked from the API documentation. This clause is in direct tension with GDPR Article 5 (purpose
              limitation) and Articles 17/18 (erasure and restriction), and may require renegotiation before Odyssey can
              onboard EU enterprise customers at scale.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: callout
            title: 'Single-Vendor Compute Concentration: AWS/Trainium at Series B Scale'
            body: >-
              With $310 million freshly raised and a declared plan to scale world-model training and inference,
              Odyssey's entire compute infrastructure is committed to AWS Trainium — a chip designed for training
              workloads that has not demonstrated commercial-scale world-model inference viability. No multi-cloud
              fallback, no disclosed SLA with AWS, and no contingency compute plan have been identified. This creates a
              single point of failure for both technical execution and commercial distribution.
            calloutType: risk
            claimRefs:
              - CR012
              - CR013
              - CR041
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Odyssey's investment thesis rests on five mutually reinforcing pillars. First, the world-model paradigm is
              a genuine emerging category: physical AI that simulates causal world dynamics is qualitatively different
              from LLMs, and Odyssey's founders built exactly this capability at Voyage and Wayve before pivoting to a
              general-purpose API product. Second, the founding team has already demonstrated the ability to ship
              research-grade systems at pace—Odyssey-2 Max, Starchild-1, Agora-1, and PROWL were all released within
              roughly eighteen months of the company's founding, and the VBench 2 physics-benchmark lead provides an
              independent quality signal. Third, the AWS preferred-cloud partnership and the IQT (In-Q-Tel)
              participation in the Series B signal two high-quality demand channels: large-enterprise compute and U.S.
              government/defense. Fourth, the capital position ($337M raised) provides at least two to five years of
              runway at plausible burn rates, enough time to convert research leadership into commercial scale. Fifth,
              the investor syndicate—Natural Capital, Amazon, AMD Ventures, GV, EQT, In-Q-Tel, plus angels including
              Jeff Dean, Elad Gil, Garry Tan, and Cruise founder Kyle Vogt—reflects genuinely high-conviction
              institutional support from parties with strong information advantages in AI infrastructure.

              The anti-thesis is equally compelling. Total financial opacity is the primary concern: not a single
              revenue metric, ARR figure, customer count, or burn rate has been disclosed in any press release, product
              announcement, or investor communication as of June 22, 2026. A $1.45B valuation with zero disclosed
              commercial traction is structurally comparable to pre-revenue research bets at the seed stage, not a
              traditional Series B that has begun validating commercial hypotheses. The competition risk is material and
              unfunded-by-comparison—NVIDIA Cosmos (backed by $3T+ market cap), Google DeepMind's Genie 2, and Wayve all
              have superior or comparable research teams plus far deeper compute/distribution advantages. The cost
              structure is extreme: ~$6.1M raised per employee implies an almost entirely compute-driven burn, and
              without disclosed pricing, COGS, or gross-margin guidance, the unit economics are entirely unknown. The
              IQT/defense channel introduces procurement-cycle latency of 12–24 months. And the AWS deal, while
              strategically meaningful, has no confirmed minimum-commitment or revenue-sharing terms—it reads as a
              strategic partnership, not a commercially binding forward contract.

              Balancing these, the thesis is viable but not yet evidenced: it warrants deep diligence and tracking, not
              immediate conviction at the current price.
