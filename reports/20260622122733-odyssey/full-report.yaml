        title: Exhibits
        blocks:
          - type: callout
            title: No Standalone World Models Market Sizing Exists
            body: >-
              As of June 2026, no major analyst firm (Gartner, IDC, Forrester, Mordor, Grand View) has published a
              standalone market sizing for general-purpose world models as a defined market category. Investors and
              company spokespeople describe it as a multi-billion-dollar category, but this characterization relies on
              the combined adjacent market proxy rather than a bottom-up analysis of named customers, ARR, or pipeline.
              This is both a diligence gap and a commercial opportunity: first-mover benefits accrue to companies that
              define the category before analysts do.
            calloutType: insight
            claimRefs:
              - CM017
              - CM018
          - type: callout
            title: NVIDIA Cosmos Open Models Create Free Substitution Risk in Developer Segment
            body: >-
              NVIDIA released Cosmos world foundation models under a permissive open model license in January 2025,
              making state-of-the-art world foundation models (4–14 billion parameters) freely available for commercial
              use. Physical AI leaders including 1X, Agility Robotics, XPENG, Uber, and Waabi are already using Cosmos.
              This directly competes with Odyssey's developer API tier, particularly for robotics and AV use cases, and
              limits the pricing power Odyssey can extract from early-stage experimentation. Odyssey's differentiation
              (real-time interactivity, multimodal audio, multi-agent coordination) must be compelling enough to justify
              a paid alternative to free open models.
