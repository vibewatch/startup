      - number: '4.2'
        title: GTM Motion and Sales Efficiency
        blocks:
          - type: paragraph
            body: >-
              Odyssey's go-to-market posture is early-stage and partner-anchored. The Series B blog confirmed that AWS
              will support joint go-to-market efforts, establishing a cloud marketplace channel as the primary
              distribution path. This model—where a hyperscaler's sales motion drives discovery and procurement of a
              third-party AI API—is consistent with how other frontier AI research labs (Anthropic on AWS Bedrock,
              Stability AI on AWS Marketplace) have initiated commercial relationships, but it introduces dependency on
              Amazon's strategic priorities and capacity planning for Odyssey's own pipeline.

              The careers page as of June 22, 2026 lists a VP GTM & Operations (Jessica Inman) among named leaders and
              is actively recruiting a Head of Product—a critical gap since product strategy drives pricing
              architecture, API packaging, and ICP definition. No account executives, sales development representatives,
              or enterprise sales managers appear in the open role list, confirming that Odyssey had not yet built a
              direct sales force at Series B. This is consistent with a pre-commercial or private-beta posture. The
              absence of a named enterprise customer in any press release, product announcement, or investor quote
              reinforces the inference that revenue from commercial deployments, if any, is nascent.

              The IQT (In-Q-Tel) investment creates a pipeline dimension that is structurally different from commercial
              sales: IQT investments typically precede or accompany U.S. government procurement, suggesting potential
              future defense or intelligence-community revenue that would be structured as contract work rather than API
              usage. The economic model for this channel—procurement vehicles, security clearance requirements, revenue
              magnitude—is not publicly documented. Sales cycle for defense customers is typically 12–24 months, meaning
              any IQT-facilitated revenue is unlikely to contribute to near-term financials.
