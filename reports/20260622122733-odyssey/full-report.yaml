        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              The June 2026 Series B raised $310 million, bringing total disclosed funding to approximately $337
              million. The funding history prior to the Series B is summarized in the Company Overview chapter;
              financials-relevant context is that NVIDIA NVentures participated in the Series A (February 2026) but did
              not join the Series B—a noted departure that TechFundingNews headlined as significant. This infrastructure
              pivot from NVIDIA GPUs to AWS Trainium/AMD may shift compute cost structure but introduces dependency on a
              single hyperscaler partner for both compute and commercial distribution.

              No debt facilities, credit lines, convertible notes, or project finance obligations have been publicly
              disclosed. No SEC Form D filing was found in EDGAR for any entity matching Odyssey ML—the California Form
              D search returned five California "Odyssey" entities (Odyssey Alvarado Asset, two Odyssey Co-Investment
              Partners funds, Odyssey Global Partners, and Odyssey Thera) but none matching the AI world model company.
              This absence may indicate: (a) Odyssey uses a different legal entity name not yet identified; (b) the
              Series B Form D has not yet been filed within the 15-day Regulation D window (announced June 17,
              2026—within window as of the run date); or (c) the offerings use an alternative exemption structure.

              Monthly burn rate is not disclosed. A conservative estimate based on 55 employees plus compute-intensive
              operations (world model training requires significant GPU/TPU allocation) suggests $2–5 million per month.
              At this range, the $310 million Series B provides 62–155 months of runway—a wide range underscoring the
              importance of obtaining actual burn data in any due diligence process. The AWS partnership may compress
              compute costs, but the magnitude of this offset is unknown.
