      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Odyssey was co-founded by Oliver Cameron (CEO) and Jeff Hawke (CTO), both veterans of the autonomous
              vehicle industry whose prior work directly informs the company's approach. Cameron previously co-founded
              Voyage, an autonomous vehicle startup spun out of Udacity, which was acquired by GM's Cruise in March
              2021; he subsequently served as VP of Product at Cruise. Hawke was a founding engineer at Wayve, the
              UK-based autonomous driving startup whose team contributed to the GAIA world model. Their shared
              background in physical AI—specifically building systems that learned next-state world models from sensor
              and video data for self-driving—anchors Odyssey's technical differentiation. Cameron holds an additional
              YC alumni affiliation.

              The extended leadership team, as publicly named on product blogs and the careers page, includes James
              Grieve (VP Engineering), Jessica Inman (VP GTM & Operations), and Fabian Güra (Distinguished Engineer).
              The research organization draws from DeepMind (contributors to Gemini language models and Veo video
              models), Tesla (Full Self-Driving), Waymo, Meta AI, Apple, and Wayve. Named contributors on published
              research include Aravind Kaimal, Sirish Srinivasan, Ahmad Nazeri, Ben Graham, Jonathan Sadeghi, Kaiwen
              Guo, and others identified on the Agora-1 and PROWL team credits. Notable backers whose names appear in
              the official about page as "supporters" include Jeff Dean (Google chief scientist), Soumith Chintala (Meta
              AI), Max Jaderberg, and Tim Rocktäschel.

              Key-person risk is material at this stage. Cameron is the primary fundraiser, external spokesperson, and
              public face of the company; Hawke leads the technical research program. Both co-founders appear on all
              major product announcements and investor communications. No formal board composition—independent directors
              or investor-appointed board seats—has been publicly disclosed. Governance opacity is typical for a private
              Series B company but represents a diligence gap, particularly given the participation of In-Q-Tel (IQT,
              the CIA-affiliated fund) which often requires security-related governance provisions. No material
              leadership changes or departures have been reported in public sources as of June 22, 2026.
