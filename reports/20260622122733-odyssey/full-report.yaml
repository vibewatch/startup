      - number: '4.3'
        title: Cost Structure, Margin Drivers, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              World model training and inference are compute-intensive workloads that create a structurally high cost of
              goods sold. Amazon itself—Odyssey's compute partner—described world models as requiring "massive compute
              throughput with tight latency constraints," directly corroborating that inference COGS is Odyssey's
              dominant operating expense. The careers page confirms this priority operationally: the ML Performance
              engineering role explicitly targets minimizing TFLOPS per user and training compute cost, and the
              infrastructure role seeks to build compute substrate for real-time inference at scale.

              The planned scale target of "hundreds of thousands of users within a year" implies near-term capital
              deployment for inference infrastructure, likely via AWS Trainium UltraServer capacity. AWS Trainium is
              positioned as offering "industry-leading price performance" versus NVIDIA GPUs, suggesting that the
              partnership was partly designed to reduce per-token/per-frame inference costs as Odyssey scales. However,
              whether this results in compute credits, preferential pricing, or revenue-sharing terms is unknown.

              Headcount costs are secondary but not trivial: 55 employees at a typical senior AI-researcher compensation
              level of $250–350K total compensation (blended across engineering, research, and operations) implies
              roughly $13.75–19.25 million in annual headcount costs. Beyond compute and headcount, the Data Program
              Manager role confirms a "data flywheel" requiring external vendor data acquisition as an ongoing COGS
              category. Gross margin at scale for comparable AI inference API providers (OpenAI, Anthropic, Runway at
              scale) is typically 60–80%, but Odyssey's current gross margin is unknown and likely negative or near zero
              if the company is still in research-primary mode with minimal revenue. Working capital requirements appear
              minimal (no inventory, no manufacturing), but deferred revenue, accounts receivable, and compute
              reservation deposits are not disclosed.
