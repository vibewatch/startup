      - number: '5.2'
        title: Architecture and Technical Design
        blocks:
          - type: paragraph
            body: >-
              The foundational architectural choice across Odyssey's model family is a causal, autoregressive
              formulation. Unlike bidirectional video models (Sora, Veo, Runway) that generate past, present, and future
              jointly from a fixed prompt, Odyssey's models predict each state from prior states and actions, enabling
              real-time interactive rollout. This causal structure forces the model to internalize physics as a
              byproduct of next-state prediction: to remain stable across forward rollout, the model must learn how
              objects move, interact, and change.

              Odyssey-2 Max uses a diffusion-based latent dynamics model and is evaluated against VBench 2's physics
              sub-score (mechanics, thermotics, materials, multi-view consistency) and the Physical AI benchmark.
              Starchild-1 extends the causal architecture to multimodal generation by introducing a causal distillation
              pipeline that adapts a bidirectional audio-video foundation model into a real-time autoregressive world
              model, combined with an asynchronous KV-cache architecture to handle the fundamentally different temporal
              frequencies of audio (higher info density, faster cadence) and video. Agora-1 decouples simulation from
              rendering: a discrete state model (trained on GoldenEye game state) learns world dynamics while a
              DiT-based rendering model generates consistent views of the shared state from multiple independent
              viewpoints. PROWL employs a KL-constrained adversarial curriculum in which an RL agent exposes high-error
              trajectories of the world model while remaining close to the behavior distribution; a Prioritized
              Adversarial Trajectory (PAT) buffer re-ranks discovered failures by prediction error, action fidelity, and
              learning progress. Training data originates from large-scale video and interaction datasets gathered via
              human camera operators, supplemented by game environments. AWS Trainium is the preferred compute platform.
            claimRefs:
