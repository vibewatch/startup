      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              World model adoption in 2026 follows five distinct buyer archetypes, each with different budget ownership,
              procurement paths, and value propositions. In robotics, the buyer is typically a physical AI or autonomy
              engineering team at a robotics company; the user is the engineer running synthetic training pipelines; the
              payer is the VP of Automation or Engineering controlling the R&D compute budget. The value driver is a
              "sim-first" approach: training robot policies in physics-accurate simulated environments before real-world
              deployment, reducing costly real-world iteration. Physical AI leaders including 1X, Agility Robotics, and
              XPENG are already using NVIDIA's Cosmos world foundation models for this workflow, confirming commercial
              demand exists at the robotics segment level.

              In gaming, the buyer is a game studio (AAA or indie) seeking to generate dynamic, interactive content at
              lower marginal cost; the payer is the head of production or CTO. Unity's 2025 gaming report found that 36%
              of studios were experimenting with AI-assisted workflows, though only 13% expected AI to improve game
              quality in the long run—a significant adoption friction signal for the gaming vertical. In healthcare
              simulation, buyers are hospital systems and academic medical centers, with budget controlled by simulation
              program directors; the North American market leads at 43.52% of global medical simulation revenue. In
              defense and intelligence, the buyer is a DoD program office or IC agency (IQT's participation in the
              Series B signals intelligence interest), and procurement requires cleared facilities, ITAR compliance, and
              contract vehicles, creating structurally longer sales cycles than commercial API deployments.

              The developer/API segment is the most accessible near-term channel: Odyssey launched a developer API on
              January 23, 2026 with three endpoints (interactive streams, viewable streams, simulations), JavaScript and
              Python SDKs, targeting individual developers and smaller teams building experimentation-stage
              applications. AWS serves as the preferred cloud provider and compute partner via Trainium chip
              co-optimization, suggesting an enterprise channel expansion beyond direct API access. Public pricing for
              enterprise production deployments was not disclosed as of June 2026.
