      - number: '7.3'
        title: Partner and Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Odyssey's compute infrastructure is committed almost entirely to AWS and its Trainium chips. Per the
              Series B announcement, AWS is the "preferred cloud provider" and Odyssey is collaborating with Amazon's
              Annapurna Labs to optimize models specifically for Trainium. AWS Trainium is a custom accelerator purpose-
              built for training rather than inference; its maturity for large-scale autoregressive world-model
              workloads is unproven commercially at Odyssey's scale. The dependency is strategic as well as technical:
              the AWS arrangement includes "go-to-market efforts," meaning Odyssey's commercial distribution is also
              coupled to Amazon's priorities. If Amazon were to reprice Trainium capacity, exit the co-marketing
              arrangement, or prioritize a competing world-model effort, Odyssey would face both compute disruption and
              distribution disruption simultaneously.

              The NVIDIA dimension compounds the risk. NVIDIA NVentures participated in Odyssey's seed and Series A but
              did not participate in the Series B, coinciding exactly with the AWS/Trainium commitment. This shift from
              NVIDIA-aligned to AMD/AWS compute infrastructure could create tension with the incumbent GPU ecosystem on
              which most AI inference infrastructure is built. IQT's participation creates a different concentration: as
              a strategic rather than purely financial investor, IQT's exit or de-prioritization of Odyssey would signal
              a change in defense-sector interest that could eliminate an entire potential customer segment. Natural
              Capital — the Series B lead — describes this as its "largest investment to date," exposing Odyssey to the
              risk that its primary lead investor is itself a young fund with concentrated exposure to a single
              pre-revenue company.
