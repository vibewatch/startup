          Request from CFO: trailing 3-month average burn, top-3 cost categories, board-approved FY2026 operating
          budget.
      - - Fully diluted cap table
        - No cap table, SAFE conversion schedule, warrant list, or option-pool size has been disclosed.
        - >-
          Liquidation preference stack determines effective per-share price; without it, the $1.45B post-money valuation
          is not interpretable.
        - >-
          Request from counsel; include all common, preferred, options, warrants, SAFEs, convertible notes, and any
          side-letter provisions.
      - - Legal entity and governance
        - Company legal name, state of incorporation, and board composition are not disclosed in any public source.
        - >-
          No Regulation D Form D has been found on SEC EDGAR for Odyssey's most recent rounds, raising questions about
          entity structure and regulatory compliance.
        - EDGAR Form D verification; state-of-incorporation search; board composition disclosure from company.
      - - AWS deal economics
        - >-
          AWS partnership terms—minimum commitments, revenue-share terms, co-sell provisions, Trainium pricing—are not
          disclosed.
        - AWS channel is cited as a primary commercial path; without terms, GTM revenue is unforecastable.
        - >-
          Request from CEO: AWS master agreement; confirm minimum revenue commitment, co-sell triggers, and pricing
          structure.
      - - Enterprise LOIs or signed contracts
        - No named enterprise customer, signed contract, ACV, or LOI has been made public.
        - >-
          Commercial validation is entirely absent; IQT participation implies government interest but not a signed
          contract.
        - >-
          Request from VP GTM: provide any executed LOIs, pilot agreements, or data-sharing contracts with customer
          names and ACV ranges.
    notes: >-
      Each item is a blocking diligence gap for a new investment at or near the $1.45B Series B price. Priority order:
      (1) ARR, (2) burn, (3) cap table, (4) legal entity, (5) AWS economics, (6) customer contracts.
    claimRefs:
      - CV041
      - CV042
