        - label: 'Less: Estimated Data Acquisition & Ops ($M) — author estimate'
          value: -7.5
        - label: Estimated Total Annual Burn ($M) — sum of above
          value: -72
        - label: Implied Capital Remaining End of Year 1 ($M) — estimate
          value: 238
    approximationNotes: >-
      All cost items are author estimates. Compute capex ($48M/year) assumes 55% of total cost base, benchmarked against
      frontier AI lab ratios and the careers page emphasis on compute-intensive workloads; AWS Trainium partnership may
      reduce this by an unknown discount. Headcount ($16.5M/year) assumes 55 FTEs at $300K average total compensation.
      Data acquisition ($7.5M/year) inferred from data flywheel hiring; G&A costs excluded from this simplified view.
      Total annual burn $72M/year is the sum of these estimates. Actual burn rate is not publicly disclosed; wide
      uncertainty range applies.
    claimRefs:
      - CI014
      - CI015
      - CI019
      - CI035
  - id: FE001
    title: Odyssey Product Architecture Stack
    type: stack
    layout: standard
    summary: Six-layer stack from raw training data through to developer-facing API and applications.
    data:
      layers:
        - label: Training Data
          detail: >-
            Proprietary first-person video (body-mounted cameras), game state data (GoldenEye, Minecraft/MineRL),
            large-scale general video corpus
          modules:
            - Proprietary video corpus
            - Game state data
            - Interaction logs
        - label: Foundation Model Core
          detail: >-
            Causal autoregressive diffusion-based world model; Odyssey-2 series; conditioned on prior states and
            actions; trained toward next-state prediction
          modules:
            - Odyssey-2 Max
            - Odyssey-2 Pro
            - Odyssey-2 (original)
        - label: Specialized Model Heads
          detail: >-
            Starchild-1 (multimodal AV distillation); Agora-1 (state model + DiT renderer); PROWL RL adversarial loop
            for model improvement
          modules:
            - Starchild-1 (AV)
            - Agora-1 (multi-agent)
            - PROWL (RL improvement)
        - label: Inference and Streaming
          detail: >-
            AWS Trainium hardware; real-time serving at 720P 22 FPS; async KV-cache for multimodal rollout; target
            scale: hundreds of thousands of concurrent users
          modules:
            - AWS Trainium compute
            - Async KV-cache
            - 720P 22 FPS streaming
        - label: API Layer
          detail: >-
            REST API: interactive streams, viewable streams, simulations; API key authentication; developer.odyssey.ml
            portal
          modules:
            - Interactive streams
            - Viewable streams
            - Simulations endpoint
        - label: Developer SDK and Applications
          detail: >-
            JavaScript + Python SDKs; iOS/Android SDKs forthcoming; applications: gaming, robotics, defense, healthcare,
            education, companionship
          modules:
            - JS SDK
            - Python SDK
            - Application ecosystem
    approximationNotes: >-
      Architecture reconstructed from public blog posts, legal agreement, and careers signals. Internal component
      boundaries and exact model architecture are not publicly disclosed.
    claimRefs:
      - CE008
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
  - id: FE002
    title: Developer Integration Workflow — Odyssey API
    type: flow
    layout: standard
    summary: End-to-end developer journey from API key registration through to end-user delivery of interactive simulations.
    data:
