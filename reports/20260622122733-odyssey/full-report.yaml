      - number: '8.4'
        title: Current Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Odyssey's Series B closed on June 17, 2026 at a $1.45 billion post-money valuation on $310 million raised,
              led by Natural Capital with Amazon, AMD Ventures, GV, EQT, and In-Q-Tel as named participants. The implied
              pre-money valuation was approximately $1.14 billion; the $310 million raise expanded total disclosed
              funding to $337 million. NVIDIA NVentures participated in the Series A (February 2026) but did not
              participate in the Series B—a potential signal of either cap-table management preference or a competitive
              conflict given NVIDIA's own Cosmos world-model investment.

              Entry discipline at the Series B price ($1.45B) is constrained by opacity. Without a fully diluted cap
              table, preference stack, or liquidation waterfall, the effective per-share price is unverifiable. Key
              structural considerations are: (1) $337 million raised implies aggressive dilution of common equity from
              prior rounds; (2) Natural Capital GP Jay Zaveri described this as the firm's "largest investment to date,"
              suggesting concentrated exposure; (3) AWS co-investment aligns the platform dependency with the
              infrastructure stack, limiting negotiating leverage; and (4) IQT participation as a strategic investor
              potentially subjects Odyssey to government contracting terms and CFIUS-related restrictions on investor
              composition at later rounds.

              New investors entering at or near the Series B price should demand: (a) audited or management-prepared
              financial statements showing ARR, burn rate, and gross margin for at least two trailing quarters; (b) a
              fully diluted cap table including all SAFEs, convertibles, warrants, and employee option pool; (c) a
              confirmed first-year revenue target and ARR bridge with named enterprise customers or LOIs; (d) the AWS
              deal economics including any minimum-commitment provisions; and (e) a legal-entity name, state of
              incorporation, and board composition disclosure. Until these are provided, committing at $1.45B is
              speculation rather than investment.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV040
      - number: '8.5'
        title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is materially limited. There is no evidence of a dedicated M&A team, no disclosed revenue
              history, no IPO readiness infrastructure (no audited financials, no governance disclosure, no publicly
              named independent board members), and no registered company name in public records as of June 22, 2026.
              The most realistic exit path in the near-to-medium term is strategic acquisition by a hyperscaler (Amazon
              given AWS alignment, Microsoft, Google) or a gaming/simulation platform operator (Epic Games, Unity). An
              IPO is a 5–8 year scenario at minimum and requires the company to generate publicly auditable revenue of
              $100M+ at acceptable gross margins.

              Thesis-break triggers are specific and monitorable: (1) NVIDIA Cosmos or Google DeepMind Genie 2 achieves
              demonstrable benchmark parity with Odyssey in physics-accuracy while offering lower API pricing; (2)
              Odyssey fails to disclose any commercial ARR within 18 months of the Series B close (i.e., by December
              2027); (3) the Series C round is priced at or below $1.45B, signaling investor reassessment; (4)
              co-founder departure (Cameron or Hawke) without a credible internal successor; (5) AWS Trainium
              performance benchmarks fail to demonstrate cost parity with Nvidia H100/H200, undermining the compute cost
              advantage thesis.

              The final diligence ask list is extensive but standard for a pre-revenue unicorn: actual ARR or
              revenue-to-date (priority #1), monthly burn rate for trailing three months (priority #2), fully diluted
              cap table (priority #3), legal entity name and state of incorporation, any committed enterprise ARR or
              executed LOIs, AWS deal economics, board composition disclosure, and any outstanding IP licensing
              obligations or government-security-clearance conditions that would restrict the investor base at later
              rounds.
            claimRefs:
