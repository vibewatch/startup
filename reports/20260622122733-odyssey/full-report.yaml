      - number: '7.5'
        title: Financial Risks, Mitigation Framework, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Odyssey's financial risk profile is dominated by capital intensity against zero disclosed revenue. With
              $337 million raised and 55 employees, capital deployed per employee is approximately $6.1 million — well
              above the $0.5–1.5 million typical for software startups — reflecting the extraordinary compute
              expenditure required to train and serve frontier world models. Monthly cash burn is estimated at $2–5
              million (conservative, based on senior AI lab compensation for 55 employees plus compute-intensive R&D),
              implying post-Series B runway of 62–155 months. This is long by venture standards, but the runway
              calculation masks two structural risks: compute costs are likely to scale non-linearly as model capability
              and serving volume increase, and there is no disclosed revenue denominator against which to measure burn
              efficiency.

              The $1.45 billion post-money valuation is a research-credibility premium with no revenue multiple to
              anchor it. The API launched five months ago in prototype form with no pricing, no self-serve checkout, and
              no disclosed commercial customers. Competitors with substantially larger compute budgets — NVIDIA Cosmos,
              Google Genie 2, World Labs (Fei-Fei Li's startup backed at $1B) — all have the capacity to commoditize
              world-model APIs and compress Odyssey's margin window before it can establish an enterprise moat. The
              combination of high compute COGS, no revenue track record, and a valuation predicated on future
              foundation-model dominance creates a narrow path to value creation that depends on rapid enterprise
              adoption in verticals where compliance and proof-of-quality barriers are highest.

              Kill criteria should focus on three threshold events: (1) a key-person departure (Cameron or Hawke)
              without a named successor, (2) an EU regulatory enforcement action or BIS export-control penalty requiring
              operational restructuring, or (3) AWS announcing a strategic competitor to Odyssey's world model product.
              Monitoring indicators should include public regulatory inquiries, API pricing announcement timing vs. the
              six-week EU AI Act full-applicability deadline, NVIDIA's competitive posture, and Odyssey's Series C
              timing and terms relative to disclosed ARR.
            claimRefs:
              - CR017
              - CR018
              - CR023
              - CR024
              - CR030
