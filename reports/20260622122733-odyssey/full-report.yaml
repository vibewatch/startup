  - id: FI001
    title: Revenue Model Bridge
    type: flow
    layout: standard
    summary: >-
      How developer/enterprise activity converts into revenue and gross profit for Odyssey's API/platform business
      model.
    data:
      nodes:
        - id: customer
          label: Developer / Enterprise Customer
          detail: API integration partner or contracted enterprise
        - id: api-request
          label: API Request to World Model
          detail: 'Simulation prompt: text, image, or multi-modal input'
        - id: inference
          label: World Model Inference (AWS Trainium)
          detail: Odyssey-2 Max / Starchild-1 / Agora-1 computation; TFLOPS per user = primary COGS driver
        - id: output
          label: Simulation Output Delivered
          detail: Video frames, interactive simulation stream, multi-agent session
        - id: revenue-event
          label: Revenue Event
          detail: API usage fee (per call / per second) or enterprise contract milestone; pricing NOT publicly disclosed
        - id: compute-cogs
          label: Compute COGS (Trainium / GPU)
          detail: AWS Trainium partnership targets industry-leading price performance; actual cost unknown
        - id: gross-profit
          label: Gross Profit
          detail: Revenue − Compute COGS; gross margin unknown; AI API comps suggest 55–80% at scale
        - id: net-burn
          label: Net Operating Burn
          detail: Gross Profit − R&D headcount − data acquisition − G&A; monthly burn rate not disclosed
      edges:
        - from: customer
          to: api-request
        - from: api-request
          to: inference
        - from: inference
          to: output
        - from: output
          to: revenue-event
        - from: revenue-event
          to: gross-profit
        - from: compute-cogs
          to: gross-profit
          label: minus
        - from: gross-profit
          to: net-burn
          label: minus R&D, data, G&A
    approximationNotes: >-
      Revenue event pricing is not publicly disclosed. Gross margin range (55–80%) is benchmarked from comparable AI API
      providers (OpenAI, Anthropic, Runway) at scale and does not represent Odyssey's current or target margin. AWS
      Trainium cost advantage is described qualitatively by Amazon but not quantified. All financial nodes are estimates
      or unknown.
