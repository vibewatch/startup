  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Odyssey operates in a newly formed but rapidly crowding market for AI world models. As of June 2026, the
              competitive landscape spans five distinct categories, each posing different kinds of threat.

              Direct world model startups include Runway (GWM-1, NYC-based) and World Labs (Marble, founded by Fei-Fei
              Li). Both companies describe their mission in terms strikingly similar to Odyssey's — Runway calls itself
              "building foundational General World Models" while World Labs frames its work as "spatial intelligence"
              for 3D world generation. The key distinction is emphasis: Runway's product roots are in creative video
              generation, World Labs focuses on navigable 3D spatial environments, while Odyssey prioritizes physics
              accuracy and multi-application general simulation.

              Incumbent big-tech labs represent the largest long-run threat. Google DeepMind released Genie 3, a
              general-purpose world model capable of real-time photorealistic environment generation; though still
              experimental, it is grounded in Google's proprietary Street View dataset and DeepMind's full compute
              capacity. Meta AI continues active video prediction and world model research but has not launched a
              comparable commercial product.

              Open-source platform providers, principally NVIDIA's Cosmos platform, create a commoditization baseline.
              NVIDIA Cosmos is freely available for commercial use under a permissive open model license and was trained
              on nine thousand trillion tokens from twenty million hours of real-world data. It directly addresses the
              robotics and autonomous vehicle applications that form a significant part of Odyssey's targeted verticals.

              Vertical-specific world models such as Wayve's GAIA-2 are purpose-built for autonomous driving and are not
              direct general-purpose competitors, though they compete for the same robotics and AV customer budgets.

              Status-quo and internal-build alternatives remain the largest barrier to new customer acquisition. Large
              companies with established ML teams — including Tesla, Google, and Meta — maintain proprietary in-house
              simulation stacks. Traditional simulation tools such as NVIDIA Isaac Sim (robotics), Unity ML Agents (game
              AI), and Unreal Engine (entertainment) represent the incumbent spend that any world model startup must
              displace.

              OpenAI's April 2026 discontinuation of Sora removes one high-profile competitor from the video/world
              simulation segment; the Sora API will also be discontinued in September 2026, effectively exiting OpenAI
              from this space entirely in the near term.
