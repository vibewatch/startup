      - number: '5.4'
        title: 差异化与知识产权
        blocks:
          - type: paragraph
            body: >-
              Odyssey 最主要的技术差异化，是因果、自回归世界模型架构——这与双向视频生成模型属于根本不同的范式。公开的 PROWL arXiv 论文和 Starchild-1 产品页记录了几项关键创新：PROWL 的
              KL 约束对抗课程，把罕见模型失败转化为结构化训练信号；Starchild-1 用因果蒸馏管线和异步 KV-cache 实现同步多模态实时生成；Agora-1
              用模拟—渲染解耦架构保证多智能体一致性。这些贡献以同行评审形式公开（arXiv:2605.18803），构成可防守的技术 IP。

              数据差异化同样重要：公司已部署佩戴身体摄像头的人类摄影操作者，大规模采集专有第一人称视频和动作数据，类似自动驾驶公司建立大型专有传感器数据集的路径。这个专有数据飞轮是结构性护城河，纯模型竞争者很难快速复制。与
              AWS（首选云和 Trainium 芯片优化）、NVIDIA（投资人和硬件伙伴）以及 AMD Ventures 的合作，带来算力访问和协同优化优势。创始团队来自 Voyage / Cruise（Cameron）和
              Wayve（Hawke），为公司带来行业可信度和可直接用于世界模型设计的自动驾驶架构经验。IQT 投资释放了国防 / 国家安全应用兴趣信号。尽调面未发现公司公开提交的正式专利；技术优势能否维持，取决于公司能否在
              Google DeepMind、NVIDIA Cosmos 等资源充足的既有巨头面前持续保持研究和工程领先。
            claimRefs:
              - CE023
              - CE024
              - CE025
              - CE026
              - CE027
              - CE028
              - CE029
      - number: '5.5'
        title: 信任、安全、安保与合规
        blocks:
          - type: paragraph
            body: >-
              相比企业标准，Odyssey 公开的信任与合规姿态很薄。这与其早期研究预览阶段一致，但会给受监管垂直领域（医疗、国防）的客户带来重大尽调风险。API 许可协议（ODYSSEY SYSTEMS, INC.，日期
              2026-01-22）明确排除所有担保，包括适用性、非侵权和无错误运行。公司没有发布 SLA 或 uptime 承诺。协议授予 Odyssey
              一项「全球、永久、不可撤销、免版税」许可，可将客户提示词和输出数据用于模型训练、分析和质量保证——这一宽泛数据权利授予可能与企业数据主权要求冲突。

              使用限制禁止向 API 提交个人数据，除非另有书面约定；协议还明确禁止使用 API 或输出数据训练竞争模型。内容限制禁止有害、非法、欺诈和侵犯隐私的应用。截至
              2026-06-22，尽调面未发现独立安全审计（SOC 2、ISO 27001）、公开的 GDPR / CCPA 合规机制、内容安全技术报告，或含偏见 / 安全评估的公开模型卡。国防应用场景（IQT
              投资、招聘中提到「warfighter training」）意味着出口管制和 ITAR 考量，但公司没有公开回应。GitHub 搜索显示社区开发者正在使用公开 API（谋杀悬疑游戏、时尚试穿、AI
              战斗竞技场），确认了开发者采用，也凸显创意用例中的审核挑战。开发者门户（developer.odyssey.ml）存在，但内容由 JavaScript 渲染，抓取时完整文档无法公开访问。
