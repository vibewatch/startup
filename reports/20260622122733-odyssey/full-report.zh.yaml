      - number: '3.2'
        title: 直接与主要竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Runway 是与 Odyssey 最直接可比的竞争者。两家公司都定位为构建通用世界模型，都服务开发者 / 企业 API 客户，也都瞄准游戏、机器人和创意用例。Runway 于 2025 年推出
              GWM-1，包含三个变体：GWM Worlds 面向可探索环境，GWM Avatars 面向对话角色智能体，GWM Robotics 面向机器人操作。Runway 还提供 Gen-4.5，内部称其为「the
              world's top-rated video model」，在世界模型研究之外形成创意视频生成产品线。Runway 截至 2025 年 9 月的已发表研究包括自回归到扩散的视觉语言模型、3D Gaussian
              splatting 技术和双过程图像生成——技术产出的宽度与 Odyssey 研究论文相近。Runway 总部位于 New York City。其融资历史未完整披露，但公司已通过数轮募集大量风险资本。

              World Labs 由 Stanford AI 教授 Fei-Fei Li 创立，于 2024 年 9 月以 $1B 估值融资 $230M。World Labs 于 2025 年 11 月推出前沿多模态世界模型
              Marble，并于 2026 年 1 月宣布 World API 面向公众使用。Marble 可从文本、图像、视频或 360 度全景生成空间一致、高保真、可持久存在的 3D
              世界，并具备强交互编辑和导出能力。World Labs 明确把这定位为「spatial intelligence」——把看见变成行动、把想象变成创造——而不是物理精确的世界仿真。World Labs 2026 年
              6 月的一篇研究文章提出了一个分类法，将世界模型空间区分为 Renderers、Simulators 和 Planners，表明公司意识到竞争者之间存在功能差异。

              Google DeepMind 的 Genie 3 是技术上最强的机构竞争者。Genie 3 被称为「a general-purpose world model」，可从文本提示实时生成 720p
              分辨率、20-24 帧每秒的逼真环境。它扎根于 Google Street View 数据集，并展示了物体可供性、多智能体 NPC 行为、物理建模（水效、烟雾、重力）和长时程记忆。不过，截至 2026 年 6
              月，DeepMind 将 Genie 3 描述为「an experimental research prototype」，并记录了有限动作空间、多智能体交互受限、交互持续时间以分钟而非小时计等局限。Genie 3
              对 Odyssey 的主要竞争风险在于，它享有 Google 基础设施、数据和分发，又没有商业化压力——一旦成熟，就可以免费或按边际成本发布。

              NVIDIA Cosmos 是开源既有玩家威胁。Cosmos 在 NVIDIA 宽松开放模型许可下可用（允许商用），提供一套用于物理感知视频生成的扩散和自回归 transformer 模型。模型训练数据来自 20
              million 小时真实世界数据、共 9,000 trillion tokens，参数规模从 4 到 14 billion 不等。1X、Agility Robotics、XPENG、Uber 和 Waabi
              等物理 AI 采用者已经在评估或使用 Cosmos。该平台与 NVIDIA Omniverse、DGX Cloud 和 NeMo 集成——这种方式把 Cosmos 采用锁定在 NVIDIA 硬件上，有利于
              NVIDIA 的整体平台战略，但也为 Odyssey 的机器人和 AV 客户目标制造了免费竞争者。
