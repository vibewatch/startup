          body: $1.45B with no revenue; stretched vs. public comps (Roblox 15× P/S)
          status: negative
        - id: recommendation
          label: 建议：继续研究
          body: Track; do not commit without ARR, burn, and cap-table disclosure
          status: neutral
      edges:
        - from: market
          to: recommendation
          label: 支撑长期潜力
        - from: tech
          to: recommendation
          label: 支撑技术可行性
        - from: team
          to: recommendation
          label: 支撑创始人风险缓释
        - from: commercial
          to: recommendation
          label: 阻碍形成确信——缺失
        - from: valuation
          to: recommendation
          label: 阻碍形成确信——偏高
    approximationNotes: null
    claimRefs:
      - CV003
      - CV040
  - id: FV002
    title: 估值对收入倍数和 ARR 的敏感性
    type: bar
    layout: standard
    summary: 在不同 EV/ARR 倍数下，反推 Odyssey 要支撑 $1.45B 估值所需的示意性 ARR，并以 Roblox 观察到的约 15× P/S 为基准。
    data:
      items:
        - label: 50× ARR（高增长 AI 溢价）
          value: 29
          unit: M USD ARR implied
        - label: 30× ARR（中期 AI 平台）
          value: 48
          unit: M USD ARR implied
        - label: 20× ARR（成熟 SaaS）
          value: 73
          unit: M USD ARR implied
        - label: 15× ARR（类似 Roblox 的 P/S）
          value: 97
          unit: M USD ARR implied
        - label: 10× ARR（折价 / 重资本）
          value: 145
          unit: M USD ARR implied
        - label: 7× ARR（公开市场底线）
          value: 207
          unit: M USD ARR implied
    approximationNotes: 所有数值都是示意性反推（估值 ÷ 倍数）；Odyssey 披露的 ARR 为零。倍数取自公开市场观察，不构成前瞻指引。
    claimRefs:
      - CV020
      - CV021
      - CV013
  - id: FV003
    title: 不同情景下的估值与回报区间
    type: range
    layout: standard
    summary: 投资者以 $1.45B Series B 价格进入时，熊市、基准、牛市情景下从低到高的退出估值区间。
    data:
      items:
        - label: 熊市情景退出估值
          low: 500
          high: 1450
          unit: M USD
          note: Series C 持平 / 下调；清算瀑布压顶；普通股受损；总 MOIC 为 0–1×
        - label: 基准情景退出估值
          low: 2000
          high: 4000
          unit: M USD
          note: 4–7 年内战略并购；Series B 资本总 MOIC 为 1.5–3×
        - label: 牛市情景退出估值
          low: 3000
          high: 6000
          unit: M USD
          note: 商业化突破 + 战略买家；总 MOIC 为 2–4×；需要多条线同时打赢
    approximationNotes: 退出价值是作者基于可比并购交易和私募市场轮次标记给出的示意性估算。Odyssey 没有给出指引。总 MOIC 估算不含未来轮次稀释。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的七维评分；技术和团队得分高，商业、经济性和证据质量得分则极低。
    data:
      items:
        - label: 市场机会
          value: 8
          unit: /10
          note: 物理 AI 2025 年规模 $78B；世界模型品类真实存在且在增长
        - label: 技术验证
          value: 7
          unit: /10
          note: VBench 2 领先；已发布 4 套系统；PROWL 有创新；仍缺独立基准确认
        - label: 团队质量
          value: 8
          unit: /10
          note: AV + 物理 AI 背景独特；网络强；关键人物集中风险限制得分
        - label: 竞争护城河
          value: 4
          unit: /10
          note: NVIDIA Cosmos 和 DeepMind Genie 2 是资源充足的直接威胁；护城河在数据和算力，不在平台锁定
        - label: 商业牵引
          value: 1
          unit: /10
          note: 披露的 ARR、客户和定价均为零；AWS 交易未量化；IQT 只能说明政府有兴趣，不等于合同
        - label: 单位经济性
          value: 1
          unit: /10
          note: ARR、CAC、LTV、毛利率、燃烧倍数等关键指标全部未披露
        - label: 估值吸引力
          value: 2
          unit: /10
          note: $1.45B 且尚无收入；相对公开可比公司偏高；没有收入可锚定倍数
    approximationNotes: 评分是作者按 1–10 分制给出的定性判断。Odyssey 没有财务披露，无法支撑商业或经济性维度的量化评分。
    claimRefs:
      - CV003
      - CV006
      - CV040
