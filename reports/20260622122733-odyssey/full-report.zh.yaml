        title: 图表材料
        blocks:
          - type: callout
            title: 通用世界模型尚无独立市场规模测算
            body: >-
              截至 2026 年 6 月，没有主要分析机构（Gartner、IDC、Forrester、Mordor、Grand
              View）把通用世界模型作为明确市场类别发布独立规模测算。投资人和公司发言人将其描述为数十亿美元级类别，但这一表述依赖相邻市场合并代理，而非基于具名客户、ARR
              或管线的自下而上分析。这既是尽调缺口，也是商业机会：分析师定义类别之前，先定义类别的公司会获得先发收益。
