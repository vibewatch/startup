      - number: '8.5'
        title: 退出准备度、论点失效触发器与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              退出准备度明显不足。截至 2026 年 6 月 22 日，未见专门 M&A 团队证据；未披露收入历史；没有 IPO
              准备基础设施（无审计财务、无治理披露、无公开具名独立董事）；公共记录中也没有注册公司名称。中短期最现实的退出路径，是由超大规模云厂商（考虑 AWS 绑定，Amazon、Microsoft、Google）或游戏 /
              仿真平台运营商（Epic Games、Unity）战略收购。IPO 至少是 5–8 年后的情形，且公司需要以可接受毛利率产生 $100M+ 可公开审计收入。

              论点失效触发器具体且可监测：（1）NVIDIA Cosmos 或 Google DeepMind Genie 2 在物理精度上达到可验证的基准同等水平，同时 API 定价更低；（2）Series B 完成后 18
              个月内（即到 2027 年 12 月），Odyssey 仍未披露任何商业 ARR；（3）Series C 定价等于或低于 $1.45B，显示投资者重估；（4）联合创始人离职（Cameron 或
              Hawke），且没有可信内部继任者；（5）AWS Trainium 性能基准无法证明与 Nvidia H100/H200 成本持平，削弱算力成本优势论点。

              最终尽调清单很长，但对一家收入前独角兽而言属于标准要求：实际 ARR 或截至目前收入（优先级 #1）、过去三个月月度烧钱速度（优先级 #2）、完全摊薄股权表（优先级 #3）、法律实体名称和注册州、任何已承诺企业
              ARR 或已签署 LOI、AWS 交易经济条款、董事会构成披露，以及任何会限制后续轮次投资者基础的未履行 IP 授权义务或政府安全许可条件。
            claimRefs:
              - CV036
              - CV037
