      - number: '1.4'
        title: 里程碑与发展轨迹
        blocks:
          - type: paragraph
            body: >-
              Odyssey 用大约两年半时间从创立走到独角兽状态。公司创立于 2023 年 11 月，这一点由 @odysseyml X 账号创建日期以及 Series B 公告中确认截至 2026 年 6
              月已有「three years」工作共同印证。GV、EQT、Air Street Capital 和一批知名天使投资人的早期机构资金在 2024 年前后到位。早期通用世界模型产品 Odyssey-2 Pro 于
              2025 年推出，同时获得 NVIDIA NVentures 和 Samsung Next 的额外战略投资。

              2026 年产品速度明显加快。Oliver Cameron 于 2026 年 2 月发表文章「Why We Must Build World Models」，公开阐述公司研究论点。2026 年 5 月 12
              日，由 Jeff Hawke 及同事撰写的 PROWL——RL 驱动的对抗式世界模型训练框架——发布。2026 年 5 月 18 日，Agora-1
              多智能体世界模型发布，这是首个支持多个参与者同时进入共享生成世界的系统。2026 年 6 月 12 日，Odyssey 发布技术文章「The Era of Multi-Agent Imagined
              Experience」，进一步加深研究叙事。2026 年 6 月 17 日，公司宣布 Series B 和 AWS 合作，既是融资里程碑，也是这一阶段的商业里程碑。

              截至 2026 年 6 月 22
              日，公开来源未显示不利事件——监管行动、诉讼、数据泄露、裁员或产品召回。这一空白符合早期研究实验室的状态：公司尚未把已部署商业产品扩到足以产生公开监管暴露的规模。主要负面信号来自结构层面：NVIDIA 未参与
              Series B 可能指向战略张力或竞争动态；同时，55 名员工对应 $337M 融资的高资本强度，意味着如果产品商业化不能提速，执行风险会放大。
