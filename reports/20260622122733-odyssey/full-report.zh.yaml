      - number: '4.4'
        title: 公开牵引力与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              公司完全没有公开披露财务指标。收入、ARR、客户数量、毛利率、CAC、LTV 和净美元留存全部缺失。唯一可量化的牵引力证据，是投资人在 Series B 中给出的 $1.45 billion 投后估值，以及
              2026 年 5 月至 6 月公开的四次产品发布。任何媒体报道中都没有引用第三方评测、客户证言或生产部署案例。

              这种信息真空对这个阶段的商业化前 AI 研究实验室并不罕见，但对承销判断构成重大障碍。Series B 条款——$310 million、$1.45 billion 估值、Natural Capital
              迄今最大一笔投资——说明投资人主要押注研究动能和团队，而不是收入指标。融资前隐含估值约 $1.14 billion，也就是说在没有披露收入基础的情况下，市场给了超过十亿美元的研究可信度溢价。

              现有公开信号包括：（1）招聘页提出一年内把推理扩展到数十万用户，说明公司预期会有商业 API 用户，而不只是研究合作者；（2）AWS 的 go-to-market 承诺，说明已有一定销售管线活动；（3）IQT
              参投，说明政府部门存在接触。但这些都不是传统意义上的收入牵引力。公司 HR 基础设施仍被描述为「处在早期建设阶段」，进一步印证组织尚未规模化，符合收入前阶段特征。
