      - number: '4.3'
        title: 成本结构、利润率驱动与资本强度
        blocks:
          - type: paragraph
            body: >-
              世界模型的训练和推理都高度吃算力，天然抬高销货成本。Amazon 本身就是 Odyssey 的算力伙伴；它把世界模型描述为需要「受严格延迟约束的大规模算力吞吐」，直接印证推理 COGS 是 Odyssey
              最大的经营开支。招聘页也从运营侧确认了这一优先级：ML Performance 工程岗位明确要压低每用户 TFLOPS 和训练算力成本，基础设施岗位则要为大规模实时推理搭建算力底座。

              公司计划「一年内服务数十万用户」，意味着近期就要为推理基础设施投入资本，可能通过 AWS Trainium UltraServer 产能实现。AWS Trainium 主打相对 NVIDIA GPU
              的「行业领先性价比」，说明这项合作部分目的在于随着 Odyssey 扩张，降低每 token / 每帧推理成本。但这种安排到底体现为算力抵扣、优惠定价，还是收入分成，目前未知。

              人员成本居次，但并不轻：55 名员工按资深 AI 研究人员常见的 $250–350K 总薪酬水平估算（工程、研究、运营混合口径），年人力成本约 $13.75–19.25 million。除算力和人力外，Data
              Program Manager 岗位确认公司有一个需要持续采购外部供应商数据的「数据飞轮」，这也是持续 COGS 项。可比 AI 推理 API 提供商（OpenAI、Anthropic、规模化后的
              Runway）规模化后的毛利率通常为 60–80%，但 Odyssey
              当前毛利率未知；如果公司仍处在以研究为主、收入极少的阶段，毛利率很可能为负或接近零。营运资本需求看起来很低（无库存、无制造），但递延收入、应收账款和算力预留押金均未披露。
