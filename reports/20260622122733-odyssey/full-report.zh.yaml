chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与业务概览
        blocks:
          - type: paragraph
            body: >-
              Odyssey 是一家 AI 研究实验室，总部位于 California 的 Palo Alto，并在 London 和 Zurich 设有办公室。公司由 Oliver Cameron 和 Jeff Hawke
              于 2023 年创立，公开使命是「learn the world to make it better」。它的技术判断是，通用世界模型——在视频上训练、用于预测并模拟世界如何演化的因果、多模态 AI
              系统——会成为一类新的基础模型，地位类似大语言模型，但扎根于物理和动态过程。截至 2026 年 6 月，Odyssey 处于 Series B 阶段，投后估值为 $1.45B。

              公司产品组合覆盖四套系统：Odyssey-2 Max 是物理精确的通用世界模型，公司称其在 VBench 2 物理基准上达到最先进水平；Starchild-1
              被定位为首个结合视觉和音频生成的实时多模态世界模型；Agora-1 是多智能体世界模型，最多支持四名参与者同时共享并互动于同一仿真；PROWL
              是由强化学习驱动的对抗式框架，通过主动探索失败案例来提升世界模型质量。公司通过开发者 API 访问和企业合作来商业化这些系统；2026 年 6 月 Series B 后，Amazon Web Services
              被指定为首选云交付伙伴。收入、客户数量和 ARR 均未公开披露；这些是任何估值评估中的实质尽调缺口。

              Odyssey 瞄准多个高价值垂直：机器人（世界模型可在部署前提供仿真预训练）、游戏（AI
              生成的交互式环境）、医疗（生物过程和照护路径仿真）、国防（用于训练的真实场景生成）、科学（物理仿真）和教育。商业模式围绕面向开发者的 API / 平台访问和战略计算合作展开。Odyssey 拥有 55
              名员工、已融资 $337M，是同代 AI 初创公司中人均资本强度最高的公司之一。
