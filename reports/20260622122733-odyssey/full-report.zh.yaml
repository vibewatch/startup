      - number: '1.3'
        title: 融资历史与投资人
        blocks:
          - type: paragraph
            body: >-
              从 2023 年创立到 2026 年 6 月，Odyssey 已通过多轮融资募集 $337M。Series B 之前，公司通过一系列早期轮次融资约 $27M（据 TechFundingNews，并由 $337M
              总额减去 $310M Series B 得到印证）。早期机构投资人包括 GV（Google Ventures）、EQT 和 Air Street Capital，天使投资人包括 Jeff Dean、Elad
              Gil、Qasar Younis、Garry Tan、Guillermo Rauch 和 Kyle Vogt。2026 年 2 月，NVIDIA 的风险投资部门 NVentures 与 Samsung Next
              跟投现有投资人并进行战略投资，TechFundingNews 将该轮标记为 Series A。Series B 前 $27M 总融资中的单轮规模未公开披露。

              关键事件是 2026 年 6 月 17 日宣布的 $310M Series B，投后估值 $1.45B，由 Natural Capital 领投。GP Jay Zaveri 称这是 Natural Capital
              迄今最大的一笔投资。参投方包括 Amazon、AMD Ventures、GV（跟投）、EQT（跟投）和 In-Q-Tel（IQT）。一个具有战略意义的变化是，NVIDIA 的 NVentures
              虽然四个月前投资了 Series A，却没有参与 Series B。相反，Amazon 成为 Odyssey 的首选云服务商，并承诺使用 AWS Trainium 芯片，意味着计算依赖有意从 NVIDIA GPU
              生态转向 Amazon 和 AMD 架构。

              In-Q-Tel 的出现表明政府和国防领域参与度不低，因为 IQT 投资的是对美国情报共同体具有战略重要性的技术。公司未公开披露二级交易、可转债或信贷额度。由于 Series B
              前轮次文件为私人文件，各轮隐含稀释比例未知。
