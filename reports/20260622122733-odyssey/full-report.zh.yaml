      - number: '3.3'
        title: 能力、定价与分发对比
        blocks:
          - type: paragraph
            body: >-
              Odyssey 的技术差异化建立在三项公开记录的主张上，这些主张在竞争者中没有直接等价物。第一，Odyssey-2 Max 被呈现为 VBench 2
              物理基准上的最先进表现者，该基准衡量仿真世界生成中的物理准确性——Runway GWM-1、World Labs Marble 或 Google Genie 3 都未公开宣称这一指标。第二，Odyssey 的
              Agora-1 支持最多四名参与者同时处于同一仿真世界中，使多智能体交互达到任何直接竞争者都未公开记录的规模。第三，PROWL——Odyssey
              的对抗式强化学习框架——会主动探索世界模型中的失败案例，并通过主动学习提升质量；公开竞争者研究未描述这种训练方法。

              定价方面，竞争格局几乎完全不透明。Runway 未公布 GWM-1 定价；视频生成定价可通过 Runway 既有订阅层获得，但不延伸至世界模型 API 访问。World Labs 未披露 World API
              定价。NVIDIA Cosmos 在开源许可下免费。Google DeepMind 的 Genie 3 尚未商业化。Odyssey 的定价也未公开，商业化通过直接企业 API 协议和 AWS
              合作推进。整个细分市场都缺少透明公开定价，竞争性定价比较只能依赖尽调阶段谈判。

              分发是既有玩家优势最清晰的地方。NVIDIA Cosmos 受益于与完整 NVIDIA 硬件栈的集成——已经运行在 NVIDIA H100 / Blackwell GPU 上的开发者，可以通过 Hugging
              Face 和 NGC catalog 访问 Cosmos，几乎没有新增基础设施成本。如果商业化发布，Google 的 Genie 3 会受益于 Google Cloud 分发和大规模消费者访问。Odyssey 的
              AWS 合作把 Amazon Web Services 指定为首选云交付伙伴，带来有意义的企业分发触达——但这不构成排他锁定。客户可以在 AWS 基础设施上以近零边际成本运行开放的 NVIDIA Cosmos
              模型，因此 Odyssey 的合作更像互补，而不是防御性排他。

              Wayve 的 GAIA-2 是自动驾驶训练细分中的垂直既有玩家。它用视频、文本和动作输入生成真实驾驶视频，并能细粒度控制自车行为、天气和多地理区域（UK、US、Germany）的道路条件。GAIA-2 为 AV
              训练量身打造，不是通用竞争者；不过，它确实会争夺原本可能用 Odyssey 做部署前仿真的自动驾驶客户。

              Google DeepMind 的 Veo 3.1 是视频生成模型（不是世界仿真平台），可生成原生音频，并在 MovieGenBench 基准上评分最高。它与 Runway Gen-4.5
              争夺创意视频内容，但未被定位为物理仿真或多智能体世界模型。
