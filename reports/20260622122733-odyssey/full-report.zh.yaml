      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              2026 年，世界模型采用由五类买方原型推动，每类都有不同预算归属、采购路径和价值主张。机器人领域，买方通常是机器人公司的物理 AI 或自主工程团队；用户是运行合成训练流水线的工程师；付费方是掌握 R&D
              计算预算的自动化或工程副总裁。价值驱动来自「sim-first」方法：真实世界部署前，先在物理精确的仿真环境中训练机器人策略，从而减少昂贵的真实世界迭代。1X、Agility Robotics 和 XPENG
              等物理 AI 领先者已经在这一工作流中使用 NVIDIA 的 Cosmos 世界基础模型，证明机器人细分市场层面存在商业需求。

              游戏领域，买方是希望以更低边际成本生成动态、交互内容的游戏工作室（AAA 或独立）；付费方是制作负责人或 CTO。Unity 的 2025 年游戏报告发现，36% 的工作室正在试验 AI 辅助工作流，但只有
              13% 预期 AI 长期会提升游戏质量——这是游戏垂直的显著采用摩擦信号。医疗仿真领域，买方是医院系统和学术医学中心，预算由仿真项目负责人控制；北美市场占全球医疗仿真收入的
              43.52%，处于领先。国防和情报领域，买方是 DoD 项目办公室或 IC 机构（IQT 参与 Series B 表明情报领域有兴趣），采购需要涉密设施、ITAR 合规和合同工具，因此销售周期在结构上长于商业
              API 部署。

              开发者 / API 细分是近期最容易进入的渠道：Odyssey 于 2026 年 1 月 23 日推出开发者 API，包含三个端点（interactive streams、viewable
              streams、simulations）以及 JavaScript 和 Python SDK，面向构建实验阶段应用的个人开发者和小团队。AWS 通过 Trainium
              芯片协同优化担任首选云服务商和计算伙伴，意味着在直接 API 访问之外还有企业渠道扩展。截至 2026 年 6 月，企业生产部署的公开定价未披露。
