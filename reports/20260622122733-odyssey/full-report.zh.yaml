      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的结构性驱动来自机器人行业加速部署。International Federation of Robotics 报告称，2025 年美国工业机器人安装量同比增长 11% 至 38,000 台，其中食品行业增长
              30%。中国 2024 年安装 295,000 台机器人（占全球市场 54%），且中国第十五个五年规划（2026–2030）把机器人置于国家 AI
              战略中心。每一次新增机器人部署都需要训练数据，而世界模型可以合成供应，形成需求乘数。NVIDIA 在 CES 2025 发布 Cosmos 世界基础模型——其训练数据来自 20 million
              小时机器人和驾驶视频、共 9,000 trillion tokens——验证了物理 AI 仿真作为核心基础设施的地位，也让行业更熟悉作为开发者原语的世界模型 API。

              云仿真采用也是结构性顺风。Mordor 发现，2025 年 60.11% 的仿真收入来自本地部署，而 cloud / SaaS 以 13.22% CAGR
              增长，是增长最快的部署模式；中型市场团队正转向订阅定价。Odyssey 的 AWS 合作和 Trainium 协同优化，使其有机会抓住这轮云迁移。

              采用约束同样实质。世界模型训练的计算强度极高：NVIDIA 的处理流水线需要 Hopper GPU 集群运行 40 天才能处理 20 million 小时视频；未优化 CPU
              工作流则需超过三年——这既形成高资本进入门槛，也给买方带来持续成本压力。国防和汽车买方偏好本地部署（担心 IP 防火墙），限制这些细分对云交付 API 的采用。EU AI Act
              治理义务会增加欧洲医疗和金融服务买方的合规成本。物理保真度缺口仍令人担忧：即便 Odyssey
              也把世界模型称为「nascent」，而安全关键行业需要认证制度（监管审批、独立审计），但学习型仿真系统尚未形成清晰制度。
