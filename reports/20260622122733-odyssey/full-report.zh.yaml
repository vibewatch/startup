      - number: '7.3'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Odyssey 的算力基础设施几乎完全押在 AWS 及其 Trainium 芯片上。根据 Series B 公告，AWS 是「首选云提供商」，Odyssey 正与 Amazon 的 Annapurna Labs
              合作，专门为 Trainium 优化模型。AWS Trainium 是为训练而非推理定制的加速器；在 Odyssey
              这种规模的大型自回归世界模型工作负载中，其成熟度尚未得到商业验证。这种依赖既是战略性的，也是技术性的：AWS 安排包含「商业拓展工作」，意味着 Odyssey 的商业分发也绑定 Amazon 的优先级。如果
              Amazon 重新定价 Trainium 产能、退出联合营销安排，或优先推进竞争性的世界模型项目，Odyssey 会同时遭遇算力中断和分发中断。

              NVIDIA 维度进一步放大风险。NVIDIA NVentures 参与了 Odyssey 种子轮和 Series A，却没有参与 Series B，而这正好与 AWS / Trainium 承诺同步。公司从
              NVIDIA 阵营转向 AMD / AWS 算力基础设施，可能与大多数 AI 推理基础设施所依赖的现有 GPU 生态产生张力。IQT 参与带来另一种集中：作为战略投资人而非纯财务投资人，如果 IQT 退出或下调
              Odyssey 优先级，将释放国防部门兴趣变化的信号，并可能消除整个潜在客户板块。Series B 领投方 Natural Capital 称这是其「迄今最大一笔投资」，使 Odyssey
              暴露于一个年轻基金对单一收入前公司的集中敞口风险。
