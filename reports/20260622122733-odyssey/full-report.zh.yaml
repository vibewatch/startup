      - number: '8.3'
        title: 牛市 / 基准 / 熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情形（概率信号：低至中等；需要多个正向进展同时落地）。未来 12 个月内，Odyssey 推出生产级机器人仿真 SDK，或接入游戏引擎，把当前开发者 API 私测转成有意义的 ARR。AWS Trainium
              合作加快推理成本下降，使定价相对 Runway 和开源模型具备竞争力。IQT 参与在 18 个月窗口内转成 $20–50M+ 政府合同。Series C 若以 2–3× 上调定价（隐含估值
              $3–4.5B），将给出明确上行标记；若 Nvidia、Google、Microsoft，或 Unity、Epic 等游戏引擎厂商这样的战略买方介入，收购溢价可能达到 Series B 估值的
              3–5×。牛市退出价值：2028–2030 年达到 $3–6B。

              基准情形（按现有证据最可能发生）。2026–2027 年，Odyssey 仍是领先的世界模型研究实验室，继续发布产品迭代，并在机器人或游戏领域签下 3–5 份企业试点协议，到 FY2027 末形成 $5–20M
              初始 ARR。Series C 只有在商业牵引力可验证时，才可能温和上调至 $1.8–2.5B 区间。资本强度仍高，算力成本压住毛利扩张。4–7 年窗口内，最可能的流动性事件是以 $2–4B
              被战略收购，前提是产品市场匹配得到确认。按 Series B 进入的基准投资回报：资本毛倍数 1.5–3×，持有 6–7 年 IRR 约 15–25%。回报明显后置，并取决于后续轮次能否避免稀释。

              熊市情形（概率信号：低，但在信息不透明下不能忽视）。24 个月内商业规模没有出现：Odyssey 未能把 API beta 用户按足够规模转成付费客户，无法支撑当前估值。NVIDIA Cosmos 或
              Google DeepMind 的 Genie 2 推出可商业使用的世界模型 API，在性能和价格上同时压过 Odyssey。Series C 按 Series B
              持平或下调定价（$1.2–1.45B），触发清算优先权瀑布，普通股权益受到实质损害。熊市情形下，只有高级优先股持有人可能回收；普通股接近全损。
