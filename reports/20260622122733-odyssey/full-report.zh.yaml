      - number: '8.4'
        title: 当前融资背景与进入纪律
        blocks:
          - type: paragraph
            body: >-
              Odyssey 于 2026 年 6 月 17 日完成 Series B，融资 $310M，投后估值 $1.45B；Natural Capital 领投，Amazon、AMD Ventures、GV、EQT 和
              In-Q-Tel 为披露参与方。隐含投前估值约 $1.14B；这笔 $310M 融资把已披露总融资额推至 $337M。NVIDIA NVentures 参与了 2026 年 2 月的 Series A，但未参与
              Series B——这可能说明公司偏好管理股权结构，也可能因为 NVIDIA 自身投资 Cosmos 世界模型而存在竞争冲突。

              按 Series B 价格（$1.45B）进入，纪律受信息不透明约束。缺少完全摊薄股权表、优先权层级和清算瀑布时，实际每股价格无法验证。几个关键结构问题是：（1）已融资
              $337M，意味着此前轮次已对普通股造成激进稀释；（2）Natural Capital GP Jay Zaveri 称这是该机构「迄今最大一笔投资」，提示敞口集中；（3）AWS
              共同投资把平台依赖与基础设施栈绑定，削弱议价能力；（4）IQT 作为战略投资方参与，可能使 Odyssey 后续受政府合同条款，以及 CFIUS 对投资者构成的限制约束。

              新投资者若按或接近 Series B 价格进入，应要求：（a）经审计或管理层编制的财务报表，至少覆盖过去两个季度的 ARR、烧钱速度和毛利率；（b）完全摊薄股权表，纳入所有
              SAFE、可转债、认股权证和员工期权池；（c）已确认的首年收入目标，以及带有具名企业客户或 LOI 的 ARR 桥；（d）AWS
              交易经济条款，包括任何最低承诺条款；（e）法律实体名称、注册州和董事会构成披露。在这些信息给出之前，以 $1.45B 承诺出资更像投机，不是投资。
