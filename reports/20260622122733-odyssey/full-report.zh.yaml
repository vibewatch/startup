      - number: '3.4'
        title: 护城河耐久度与竞争风险
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Odyssey 的竞争护城河来自技术深度（物理准确性、多智能体、对抗式 RL）、创始人在物理 AI
              的专业能力（自动驾驶背景）和早期机构投资人信号（In-Q-Tel、NVIDIA、Amazon、AMD）的组合。这些要素单独看都不是耐久锁定机制——资源更强的竞争者都可能复制。

              最尖锐的近期威胁是 Runway。它采用了几乎相同的定位语言（「building foundational General World Models」），也拥有可比的开发者侧产品策略（API
              访问、创意和机器人变体）。Runway 的优势是已经拥有 Gen-4.5 带来的视频生成客户基础和成熟企业关系，可向其交叉销售 GWM-1。

              最结构性的长期威胁来自 NVIDIA Cosmos 和大科技 R&D 的商品化。NVIDIA Cosmos 为物理 AI 开发者提供零成本通用世界仿真基线，消除了机器人和 AV 用例的价格底线。Google
              DeepMind 背靠 Google Street View 数据和近乎无限计算，在没有商业压力下开发 Genie 3——它一旦从实验转入生产，就会成为拥有规模分发、接近零边际成本的竞争者。Meta
              的视频预测和世界模型研究尚未产出商业产品，但 Meta 大规模出货的能力毋庸置疑。

              Odyssey 开发者客户的切换成本中等。主要锁定机制是 API 集成深度（在 Odyssey API 上构建流水线的开发者，切换时要付出重新工程化成本）、企业合同条款和专有输出质量优势。不过，Odyssey
              未开源模型权重，因此不存在权重层面的锁定——原则上，只要 Odyssey 的输出格式或延迟特征没有深度嵌入客户流水线，客户可以更换底层模型提供商，而无需重训自有栈。

              现状替代——既有仿真工具和内部自建——是初始采用中最耐久的竞争壁垒。拥有成熟 NVIDIA Isaac Sim 或 Unity 仿真流水线的大型企业客户，已在既有工作流中投入大量沉没成本。要说服它们迁移到世界模型
              API，Odyssey 必须证明自己相对当前栈有成本 - 质量优势，而不仅仅是强于其他世界模型 API。

              不利竞争证据包括：（1）NVIDIA Cosmos 免费且已被五家具名物理 AI 公司采用，威胁 Odyssey 在机器人和 AV 领域的定价权；（2）Runway 的 GWM-1 发布直接反驳了 Odyssey
              拥有独特通用世界模型定位的任何主张；（3）OpenAI 停止 Sora 虽然短期有利，却说明即使资源充足的既有玩家也很难在该市场变现；（4）Google DeepMind Genie 3
              表明构建高质量世界模型的技术壁垒正在快速下降，削弱任何单一能力优势的防御性。
