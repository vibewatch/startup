      - number: '4.6'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Odyssey 呈现的是典型研究驱动型 AI 独角兽估值：技术动能强、创始人可信、长期叙事有吸引力——但在任何公开商业证据出现前，就已按 $1.45 billion
              定价。收入质量无法验证（无披露收入），利润率路径仍是推测（大规模推理吃算力，但 AWS 合作可能带来成本优势），资本强度极高（每员工
              $6.1M），核心尽调卡点也很基础：无定价、无客户、无烧钱率、无法律实体名称、无 Form D 文件。

              单位经济完全未知：ARR、CAC、LTV、毛利率和 burn multiple 都无法从公开来源计算。AWS 合作既带来机会（更低推理成本、内置 GTM 渠道），也带来风险（单一供应商集中）。IQT
              参投释放了国防收入可选性的信号，但并不等同于已披露收入。

              现阶段投资人承销至少需要数据室提供：实际 ARR 或迄今收入、过去三个月月度烧钱率、完全稀释股权表、法律实体名称和注册州、已承诺企业 ARR 或 LOI，以及 AWS Trainium
              上每模拟秒算力成本相对基线的对比。缺少这些，财务章节只能是尽调缺口清单，而不是财务分析。
