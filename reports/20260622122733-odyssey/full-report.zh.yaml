      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月 Series B 融资 $310 million，使已披露总融资约达 $337 million。Series B 之前的融资历史已在公司概览章节总结；与财务相关的背景是，NVIDIA
              NVentures 曾参与 2026 年 2 月的 Series A，但没有加入 Series B——TechFundingNews 将这一退出作为重要变化写入标题。公司从 NVIDIA GPU 转向 AWS
              Trainium / AMD，可能改变算力成本结构，但也让算力和商业分发都依赖单一 hyperscaler 伙伴。

              公司没有公开披露任何债务融资、授信额度、可转债或项目融资义务。EDGAR 中未找到任何匹配 Odyssey ML 的实体提交 SEC Form D——加州 Form D
              检索返回五个加州「Odyssey」实体（Odyssey Alvarado Asset、两个 Odyssey Co-Investment Partners 基金、Odyssey Global Partners 和
              Odyssey Thera），但没有匹配这家 AI 世界模型公司。这一缺失可能意味着：（a）Odyssey 使用了尚未识别的不同法律实体名称；（b）Series B 的 Form D 还未在 Regulation
              D 的 15 天窗口内提交（融资于 2026 年 6 月 17 日宣布，截至本报告运行日仍在窗口内）；或（c）发行采用了其他豁免结构。

              月度烧钱率未披露。按 55 名员工加上高算力运营估算（世界模型训练需要大量 GPU / TPU 配额），保守区间为每月 $2–5 million。在这个区间内，$310 million Series B 可提供
              62–155 个月现金续航；区间很宽，凸显尽调中必须拿到真实烧钱数据。AWS 合作可能压缩算力成本，但抵消幅度未知。
