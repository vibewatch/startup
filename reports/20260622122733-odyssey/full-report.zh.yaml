  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Odyssey 所处的 AI 世界模型市场刚形成，却已快速拥挤。截至 2026 年 6 月，竞争格局横跨五类主体，每一类威胁不同。

              直接的世界模型初创公司包括 Runway（GWM-1，总部 NYC）和 World Labs（Marble，由 Fei-Fei Li 创立）。两家公司对使命的描述都与 Odyssey 极为相似——Runway
              称自己在「building foundational General World Models」，World Labs 则把工作定位为用于 3D 世界生成的「spatial
              intelligence」。关键区别在侧重点：Runway 的产品根基是创意视频生成，World Labs 聚焦可导航 3D 空间环境，Odyssey 则优先强调物理准确性和多应用通用仿真。

              大型科技实验室是最大的长期威胁。Google DeepMind 发布了 Genie 3，这是一种通用世界模型，能够实时生成逼真环境；虽然仍处实验阶段，但它扎根于 Google 专有 Street View
              数据集，并能调用 DeepMind 的完整计算能力。Meta AI 持续推进视频预测和世界模型研究，但尚未推出可比的商业产品。

              开源平台提供方，主要是 NVIDIA Cosmos 平台，建立了商品化基线。NVIDIA Cosmos 在宽松开放模型许可下可免费商用，训练数据来自 20 million 小时真实世界数据、共 9,000
              trillion tokens。它直接覆盖 Odyssey 目标垂直中相当重要的机器人和自动驾驶应用。

              Wayve 的 GAIA-2 等垂直专用世界模型为自动驾驶量身构建，不是直接的通用竞争者，但会争夺同一批机器人和 AV 客户预算。

              现状方案和自建替代仍是新客户获取的最大障碍。拥有成熟 ML 团队的大公司——包括 Tesla、Google 和 Meta——维护自有内部仿真栈。NVIDIA Isaac Sim（机器人）、Unity ML
              Agents（游戏 AI）和 Unreal Engine（娱乐）等传统仿真工具，代表任何世界模型初创公司都必须替代的既有支出。

              OpenAI 于 2026 年 4 月停止 Sora，移除视频 / 世界仿真细分中的一个高知名度竞争者；Sora API 也将在 2026 年 9 月停止，意味着 OpenAI 近期事实上完全退出这一空间。
