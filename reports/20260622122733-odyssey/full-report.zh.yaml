        title: 客户分层与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Odyssey 瞄准三类主要客户。开发者研究人员是眼下有记录的客户：2026 年 1 月 23 日推出的 Odyssey-2 Pro API，只要开发者通过 developer.odyssey.ml 获得 API
              key，就可以访问。目标企业客户横跨游戏工作室、机器人 OEM、国防和情报机构、医疗模拟平台、教育科技提供商——这些垂直领域都在 Odyssey 的产品和博客材料中被明确点名。战略投资伙伴（Amazon /
              AWS、Samsung Next、IQT）构成第三层：它们与 Odyssey 在商业和技术上方向一致，未来可能转化为生产部署，但尚未被确认是付费客户。

              产品表面区分了层级：Odyssey-2 Pro 是广泛可访问的 API 模型；Odyssey-2-Max 面向更高吞吐量的企业工作负载。随迭代产品更新一同发布的 Broadcast API
              功能，支持多用户共享模拟会话——这直接对应游戏和国防训练用例。本报告发布时，Odyssey 法律条款明确把 API 标为「原型」，在任何合规或正常运行时间 SLA 要求下都会限制企业采用。

