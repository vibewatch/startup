        title: 扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              Odyssey 面临显著客户集中风险：其全部公开具名的伙伴证明，只有三家投资人相邻实体——Amazon / AWS、Samsung Next 和 IQT——且都总部位于美国、也都是 Odyssey
