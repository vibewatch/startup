  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户交付
        blocks:
          - type: paragraph
            body: >-
              Odyssey 向开发者和企业伙伴提供四套不同 AI 系统，底层由共同的因果自回归架构统一，并通过 Odyssey API 交付。旗舰产品线是通用世界模型 Odyssey-2 系列。Odyssey-2（2025
              年 10 月）证明，仅用视频和交互数据训练的模型可以学到基础物理、动态和行为。Odyssey-2 Pro（2026 年 1 月）大幅扩容，可通过三个 API 端点实时流式输出 720P、22 FPS
              视频：interactive streams（嵌入实时模拟）、viewable streams（把一个交互流分发给多名用户）和 simulations（离线批量生成）。2026 年 6 月随 Series B
              一同发布的 Odyssey-2 Max，在 VBench 2 和 Physical AI benchmark 评测的世界模型中拿到最高物理分，同时仍能实时运行。

              除核心 Odyssey-2 产品线外，Odyssey 还发布了两个研究预览产品：Starchild-1（2026 年 5 月），号称全球首个可生成同步音视频的实时多模态世界模型；Agora-1（2026 年 5
              月），一个多智能体世界模型，最多支持四名参与者同时共享一个生成世界。PROWL RL 框架（2026 年 5
              月，arXiv:2605.18803）支撑模型改进，但本身不是商业产品。截至报告运行日，所有产品仍处在研究预览或早期 API 阶段；没有公开的生产可用性或 SLA
              承诺。公司声明的目标垂直领域包括游戏、机器人、国防、医疗、教育和陪伴。
