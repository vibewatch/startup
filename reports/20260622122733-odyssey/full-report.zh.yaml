      - number: '7.5'
        title: 财务风险、缓释框架与叫停标准
        blocks:
          - type: paragraph
            body: >-
              Odyssey 的财务风险主要来自零披露收入与高资本强度之间的错配。公司已融资 $337 million，员工 55 人，每员工已部署资本约 $6.1 million——远高于软件创业公司常见的 $0.5–1.5
              million，反映训练和服务前沿世界模型所需的异常算力开支。月度现金消耗估计为 $2–5 million（保守口径，按 55 名员工的资深 AI 实验室薪酬加高算力 R&D），意味着 Series B
              后现金续航为 62–155 个月。按风投标准这很长，但现金续航 计算掩盖了两个结构性风险：模型能力和服务量上升时，算力成本很可能非线性扩张；同时没有披露收入分母，无法衡量烧钱效率。

              $1.45 billion 投后估值是一种研究可信度溢价，没有收入倍数可锚定。API 五个月前以原型形式上线，没有定价、没有自助购买入口，也没有披露商业客户。算力预算大得多的竞争者——NVIDIA
              Cosmos、Google Genie 2、World Labs（Fei-Fei Li 创立、估值 $1B）——都有能力把世界模型 API 商品化，并在 Odyssey 建立企业护城河之前压缩其利润窗口。高算力
              COGS、无收入记录、估值建立在未来基础模型主导地位之上，这三者叠加，使价值创造路径很窄；公司必须在合规和质量证明门槛最高的垂直领域快速获得企业采用。

              叫停标准应聚焦三个阈值事件：（1）关键人物（Cameron 或 Hawke）离职且没有具名继任者；（2）欧盟监管执法行动或 BIS 出口管制处罚要求运营重组；或（3）AWS 宣布 Odyssey
              世界模型产品的战略竞争者。监控指标应包括公开监管问询、API 定价公告时点相对 EU AI Act 全面适用六周期限的进度、NVIDIA 的竞争姿态，以及 Odyssey Series C 的时点和条款相对披露
              ARR 的关系。
