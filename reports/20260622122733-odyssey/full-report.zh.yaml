            body: >-
              截至 2026 年 6 月，Odyssey 未公开点名任何企业生产客户。最强的公开客户证明，是 Amazon VP Distinguished Engineer Ron Diamant 在官方
              BusinessWire Series B 新闻稿中的直接引语：「Odyssey 团队一直在推动这个领域的可能性边界……我们很高兴在 Odyssey 下一阶段增长中提供支持，让 AWS 成为 Odyssey
              的首选云提供商，在我们的芯片上协作优化其模型，并共同加速机器人、游戏、科学及更多领域的应用。」这段话确认了与 AWS 的首选云提供商基础设施合作和共同开发意图，但不构成具名生产软件部署。

              与 CIA 有关联的战略投资基金 In-Q-Tel，在公开投资组合中把 Odyssey 列为「活跃」公司——这是国防和情报共同体兴趣的可靠信号，但不是政府合同或生产部署的确认。Samsung Next 投资总监
              Andy Duong 公开评价 Odyssey-2 Pro「技术进展很快」，并「朝交互式世界模拟取得了有前景的进展」，把 Samsung 定位为有兴趣的战略伙伴，而不是具名客户。

