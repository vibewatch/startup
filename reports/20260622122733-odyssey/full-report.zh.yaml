      - CV030
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类别
      - 估值 / 市值
      - 收入 / ARR 基础
      - 隐含倍数
      - 与 Odyssey 的相关性
      - 关键局限
    rows:
      - - Roblox Corp (RBLX)
        - 上市公司 — 游戏 / 仿真平台
        - 市值约 $74B（2025 年 6 月）
        - FY2025 收入 $4.87B（同比增长 36%；来自 SEC 10-K）
        - 约 15× 过去 12 个月 P/S
        - 面向消费者、带用户生成内容的游戏平台；是仿真 + 交互式 AI 产品最接近的上市代理。
        - 消费者 B2C 模式，拥有 127M DAU；Odyssey 是 B2B 开发者 API — 收入架构和利润率结构不同。
      - - World Labs AI
        - 私营 — 3D 世界模型初创公司（Fei-Fei Li）
        - 种子轮估值约 $1B（2024 年 9 月）；后续轮次未披露
        - 未披露 ARR；公开 World API 于 2026 年 1 月上线
        - 无法计算；与 Odyssey 一样处于研究阶段
        - 最直接竞争对手：通用空间 / 3D 世界模型，采取 API 优先产品策略。
        - 创始人是更知名的学者（Fei-Fei Li），天使网络更大；3D 空间世界模型与物理视频世界模型之间的产品差异不清晰。
      - - Wayve (Embodied AI / AV)
        - 私营 — 实体 AI/AV 公司
        - 4 轮累计融资 $2.8B（Wayve 披露）
        - 未公开披露 ARR；AV 商业化仍处收入前
        - 无法计算；基于信念
        - Wayve 的 GAIA 世界模型由 Odyssey CTO Jeff Hawke 共同开发；这是最接近的 AV / 物理 AI 对标。
        - AV 专用场景比 Odyssey 的多垂直定位更窄；累计融资 $2.8B，约为 Odyssey Series B 阶段总融资的 8 倍。
      - - FieldAI（物理 AI 机器人软件）
        - 私有公司 — 物理 AI 机器人软件
        - 估值 $2B（2026 年 Series A；据 CB Insights AI 100）
        - Series A 融资 $314M
        - 无法计算；尚未规模化
        - 物理 AI 软件，算力强度和商业化前阶段与 Odyssey 相近。
        - 相比 Odyssey 的多垂直定位，FieldAI 更聚焦机器人；Series A 即给到 $2B，说明投资人愿为边界清晰的垂直物理 AI 支付溢价。
      - - Runway ML（生成式视频 AI）
        - 私有公司 — AI 视频生成
        - 报道估值约 $1.5B（2024 年 Series C）
        - 已披露开发者 API 和公开定价档位（标准版 $12/user/month）
        - 无法精确计算；API 收入仍在早期
        - 开发者 API 视频生成产品与 Odyssey 重叠；Runway 是商业化最成熟的视频 AI API。
        - Runway 已披露定价和公开 API，Odyssey 尚未披露——Runway 商业成熟度更高，因此更像 Odyssey 当前合理估值的上限，而不是下限。
      - - NVIDIA Corporation（AI 基础设施）
        - 上市公司 — AI 基础设施 / 芯片
        - 市值约 $3T+（2025–2026）
        - 过去 12 个月收入 $130B+（FY2025）
        - 约 25–35× P/E；按 P/S 看意义不大
        - 占主导的 AI 算力平台，借 Cosmos 在世界模型基础层与 Odyssey 竞争。
        - 直接竞争者，资源规模完全不在一个量级；只能作为下行情境中的竞争压力参照，不能作为 Odyssey 的估值锚。
    enumerationScope:
      coverage: partial
      basis: >-
        Six comparables drawn from public SEC filings, CB Insights market data, and company disclosures reviewed June
        2026; excludes undisclosed private marks, international comparables, and early Odyssey rounds. No revenue
        multiples are computable for Odyssey given zero disclosed ARR.
    notes: >-
      可比公司组基于 SEC 文件（Roblox FY2025 10-K）、CB Insights AI 100 2026 数据，以及 2026 年 6 月查阅的公司投资者页面构建。上市公司倍数为过去 12
      个月口径；私有公司估值反映已知最新一轮价格，可能已经滞后。Odyssey 未披露 ARR，无法计算直接倍数。
