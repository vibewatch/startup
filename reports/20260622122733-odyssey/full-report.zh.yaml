  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Odyssey 位于多个高风险监管制度的交叉点。EU AI Act 将通用 AI（GPAI）模型——也正是 Odyssey 世界模型所属类别——纳入强制透明度、版权可追溯性和安全评估义务，这些义务已于 2025
              年 8 月 2 日适用。AI Act 的全面适用定在 2026 年 8 月 2 日，距离本报告运行日只有六周。Odyssey 除 Palo Alto 总部外，还在 London 和 Zurich 设有办公室，因此
              UK GDPR、Swiss DSG 和 EU GDPR 都是相关的数据保护框架。2026 年 1 月 22 日更新的 API 许可协议授予 Odyssey
              一项「全球、永久、不可撤销、免版税」许可，可使用客户提示词数据和输出数据训练其 AI 模型——在没有公开数据处理协议（DPA）的情况下，这种措辞可能与 GDPR
              对限定目的数据处理和删除权的要求冲突。Odyssey 公开 API 文档没有链接 DPA。

              IQT 参与 Series B 推高了出口管制风险。In-Q-Tel 的公开使命是加速服务美国国家安全的技术；其投资组合常常先于情报共同体采购。Odyssey 声明的 warfighter training
              和国防模拟用例，如果模型权重、训练技术或输出通过 API 提供给外国国民或实体，就需要遵守 International Traffic in Arms Regulations（ITAR）和 BIS Export
              Administration Regulations（EAR）。BIS 已加强先进计算出口管制执法，并在 2026 年 5 月发布关于 Country Group D:5 实体许可证要求的新指引。Odyssey
              未公开披露 ITAR 注册、出口管制合规计划或 EAR 分类意见。FTC 也已提醒 AI 算力行业注意云服务商排他交易带来的反垄断风险——这与 Series B 中披露的 AWS preferred-cloud
              安排直接相关。
