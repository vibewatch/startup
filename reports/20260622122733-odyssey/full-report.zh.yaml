      - number: '5.3'
        title: 部署、API 与路线图
        blocks:
          - type: paragraph
            body: >-
              Odyssey 通过由 AWS 基础设施支撑、并针对 AWS Trainium 芯片优化的 REST API 交付所有模型。2026 年 1 月发布时，公司公布了三个 API 端点：用于实时嵌入式模拟的
              interactive streams、用于把单个交互流只读分发给多用户的 viewable streams，以及用于离线批量生成的 simulations。官方 JavaScript 和 Python SDK
              已可用，iOS 和 Android SDK 被描述为即将推出。开发者通过 developer.odyssey.ml 门户访问 API。日期为 2026-01-22、管辖「原型」Odyssey-2 API 访问的
              API 许可协议，是已公开的主要法律文件；它排除所有担保，且没有规定正常运行时间 SLA。

              从路线图看，招聘页显示公司正在投入推理基础设施，以「一年内扩展到数十万用户」，并优化每用户 TFLOPS 和训练算力成本。Data Program Manager
              岗位提到用于持续扩展训练数据的「数据飞轮」模型。Head of Product 岗位显示公司正从纯研究转向产品平台。Odyssey 有三个工程中心：Palo Alto（总部）、London 和
              Zurich。快速发布节奏——六周内三次重大模型发布（2026 年 5–6 月）——显示研究推进很快，但产品缺少硬化后的生产规格，也带来早期不稳定风险。
