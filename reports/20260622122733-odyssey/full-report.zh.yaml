        - 收入前独角兽、算力强度极高、主导竞争者风险、治理不透明。
      - - 估值立场
        - 偏高
        - 零收入对应 $1.45B 估值；按市场倍数隐含 $95–105M ARR 收入，但公司未披露。
      - - 持有 / 退出周期
        - 4–7 年（基准情形）
        - 战略 M&A 是最可能路径；IPO 需要 $100M+ ARR 和审计基础设施，目前尚未到位。
      - - 准入纪律
        - 以尽调资料室为条件
        - 按 Series B 价格承销前，至少需要五项披露。
    notes: 评估反映截至 2026 年 6 月 22 日的公开证据状态。所有单元格均为作者判断，不是公司指引。
    claimRefs:
      - CV040
  - id: TV002
    title: 正向论点与反向论点
    columns:
      - 维度
      - 正向论点
      - 反向论点
      - 改变观点的条件
    rows:
      - - 技术差异化
        - VBench 2 物理基准领先；PROWL 对抗循环；实时多模态 Starchild-1；多智能体 Agora-1 — 18 个月内推出四套系统。
        - NVIDIA Cosmos 和 DeepMind Genie 2 免费 / 开放权重，背后基础设施更深；12–24 个月内很可能追平基准。
        - 独立同行评审确认 Odyssey 在生产规模下的商业相关准确率指标领先。
      - - 创始人质量
        - Cameron（Voyage/Cruise）和 Hawke（Wayve/GAIA）都有直接的实体 AI 背景；世界模型领域专长稀缺。
        - 关键人物集中度极高；公司未公开第二梯队领导深度或继任计划。
        - 尽调资料室披露经董事会批准的继任计划，或确认已任命技术 VP。
      - - 市场规模
        - 实体 AI 在 2025 年融资 $78B；机器人仿真和游戏 AI 合计可触达数千亿美元市场。
        - 没有公开证据显示 Odyssey 捕获了这个市场哪怕可忽略的份额；客户数量完全不透明。
        - 披露 $5M+ ARR，并在两个垂直领域披露具名试点客户。
      - - 投资者质量
        - Natural Capital、Amazon、GV、EQT、IQT — 声誉高的机构支持，且拥有信息优势。
        - NVIDIA NVentures 虽参与 Series A，但没有参与 Series B；可能存在竞争冲突。
        - 说明 NVIDIA 未再投资的原因；或引入具备盯市纪律的新投资者。
      - - 商业路径
        - AWS 首选云协议和 IQT 参与，释放两个可信需求渠道信号。
        - AWS 交易经济性未披露；IQT 投资意味着政府采购会滞后 12–24 个月；没有具名企业客户。
        - 已执行的企业 LOI，或披露 ACV 的签署合同。
    notes: 论点是作者基于 2026 年 6 月 22 日审阅的公开证据所做的综合。各行覆盖主要论点维度；没有单一维度具备决定性。
