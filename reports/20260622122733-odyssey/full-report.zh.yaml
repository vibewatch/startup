  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Odyssey 的商业架构围绕两条相互依赖的收入渠道展开：面向开发者的直接 API / 平台访问，以及与 Amazon Web Services
              合作设计的定制企业协议。公司公开材料描述了四个模型组合——Odyssey-2 Max、Starchild-1、Agora-1 和 PROWL——都被包装成可由开发者集成的产品；但截至 2026 年 6 月 22
              日，odyssey.ml
              没有定价页、没有订阅层、没有积分或用量费率，也没有自助结账流程。应用页面列出超过二十个潜在用例，横跨机器人、游戏、医疗、国防、教育、健身、酒店和零售，但没有任何用例附带商业条款、案例研究或参考客户。

              Series B 公告带来一个重要结构变化：AWS 现在是 Odyssey 的「preferred cloud provider」，合作关系包含明确的「go-to-market efforts」，意味着
              Amazon 的分发基础设施参与客户获取，而不只是交付计算。依赖 hyperscaler marketplace 的 AI
              推理初创公司常见这种渠道安排，但交易经济性（收入分成、最低承诺支出、客户归属）完全未披露。

              Air Street Capital 的公开 portfolio 将 Odyssey 列为「Interactive video (US/UK)」公司，这一框架与 Odyssey
              自身通用世界模型定位差异明显，也说明早期投资人的分类可能仍锚定在较窄的视频生成垂直，而不是更广的仿真和机器人市场。公司未披露收入确认政策；若已有收入，API
              访问很可能按用量确认，企业合同则可能按里程碑或按期确认。
