      - number: '4.2'
        title: GTM 动作与销售效率
        blocks:
          - type: paragraph
            body: >-
              Odyssey 的 go-to-market 姿态仍处早期，并由合作伙伴锚定。Series B 博客确认 AWS 将支持联合 go-to-market 工作，确立云市场渠道为主要分发路径。这种模式——由
              hyperscaler 的销售动作推动第三方 AI API 的发现和采购——与其他前沿 AI 研究实验室启动商业关系的方式一致（Anthropic 在 AWS Bedrock 上、Stability AI 在
              AWS Marketplace 上），但也让 Odyssey 自身管线依赖 Amazon 的战略优先级和容量规划。

              截至 2026 年 6 月 22 日，招聘页在具名领导层中列出 GTM 与运营副总裁 Jessica Inman，并正在招聘产品负责人——这是关键缺口，因为产品策略决定定价架构、API 打包和 ICP
              定义。公开职位列表中没有客户经理、销售开发代表或企业销售经理，确认 Odyssey 在 Series B 时尚未建立直接销售团队。这与商业化前或私人 beta
              姿态一致。任何新闻稿、产品公告或投资人引述中都没有具名企业客户，进一步支持一个推断：即便已有商业部署收入，也仍处萌芽状态。

              IQT（In-Q-Tel）投资创造了一条与商业销售结构不同的管线：IQT 投资通常先于或伴随美国政府采购，意味着未来可能出现国防或情报共同体收入，且会以合同工作而非 API
              用量形式组织。该渠道的经济模型——采购工具、安全许可要求、收入规模——没有公开记录。国防客户销售周期通常为 12–24 个月，意味着任何由 IQT 促成的收入都不太可能贡献近期财务。
