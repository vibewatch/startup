  - id: FI001
    title: 收入模型桥
    type: flow
    layout: standard
    summary: 开发者 / 企业活动如何转化为 Odyssey API / 平台业务模型中的收入和毛利。
    data:
      nodes:
        - id: customer
          label: 开发者 / 企业客户
          detail: API 集成伙伴或签约企业
        - id: api-request
          label: API 请求进入世界模型
          detail: 仿真提示：文本、图像或多模态输入
        - id: inference
          label: 世界模型推理（AWS Trainium）
          detail: Odyssey-2 Max / Starchild-1 / Agora-1 计算；每用户 TFLOPS = COGS 的主要驱动项
        - id: output
          label: 交付仿真输出
          detail: 视频帧、交互式仿真流、多智能体会话
        - id: revenue-event
          label: 收入事件
          detail: API 使用费（按次 / 按秒）或企业合同里程碑；定价未公开披露
        - id: compute-cogs
          label: 计算 COGS（Trainium / GPU）
          detail: AWS Trainium 合作瞄准行业领先的性价比；实际成本未知
        - id: gross-profit
          label: 毛利润
          detail: 收入 − 计算 COGS；毛利率未知；AI API 可比公司显示规模化后约 55–80%
        - id: net-burn
          label: 净经营烧钱
          detail: 毛利润 − 研发人力 − 数据采购 − G&A；月度烧钱率未披露
      edges:
        - from: customer
          to: api-request
        - from: api-request
          to: inference
        - from: inference
          to: output
        - from: output
          to: revenue-event
        - from: revenue-event
          to: gross-profit
        - from: compute-cogs
          to: gross-profit
          label: 减去
        - from: gross-profit
          to: net-burn
          label: 减去研发、数据、G&A
    approximationNotes: >-
      收入事件定价未公开披露。毛利率区间（55–80%）来自可比 AI API 提供商（OpenAI、Anthropic、Runway）规模化后的基准，不代表 Odyssey 当前或目标毛利率。Amazon 只定性描述 AWS
      Trainium 的成本优势，未量化。所有财务节点都是估算或未知项。
