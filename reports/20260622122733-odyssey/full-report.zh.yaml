      - number: '5.2'
        title: 架构与技术设计
        blocks:
          - type: paragraph
            body: >-
              Odyssey 模型家族最基础的架构选择，是因果、自回归表述。Sora、Veo、Runway 等双向视频模型会从固定提示词联合生成过去、现在和未来；Odyssey
              的模型则从先前状态和动作预测每一个状态，从而支持实时交互式 rollout。这种因果结构迫使模型在下一状态预测中内化物理规律：模型要在向前 rollout 中保持稳定，就必须学会物体如何移动、交互和变化。

              Odyssey-2 Max 使用基于 diffusion 的潜在动态模型，并用 VBench 2 的物理子分数（力学、热学、材料、多视角一致性）和 Physical AI benchmark
              评估。Starchild-1 通过引入因果蒸馏管线，把双向音视频基础模型改造成实时自回归世界模型，并结合异步 KV-cache 架构，处理音频（信息密度更高、节奏更快）和视频在时间频率上的根本差异。Agora-1
              将模拟与渲染解耦：离散状态模型（在 GoldenEye 游戏状态上训练）学习世界动态，基于 DiT 的渲染模型则从多个独立视角生成共享状态的一致画面。PROWL 使用受 KL 约束的对抗课程：RL agent
              在贴近行为分布的同时，暴露世界模型的高错误轨迹；Prioritized Adversarial Trajectory（PAT）buffer
              再按预测误差、动作保真度和学习进展，对发现的失败案例重新排序。训练数据来自人类摄影操作者采集的大规模视频和交互数据集，并辅以游戏环境。AWS Trainium 是首选算力平台。
