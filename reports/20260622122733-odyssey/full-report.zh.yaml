      - number: '8.2'
        title: 估值背景与可比集
        blocks:
          - type: paragraph
            body: >-
              给 Odyssey 的 $1.45B 估值做基准，需要合并三类证据：最接近行业可比公司的公开市场交易倍数、资金充足的 physical-AI 和世界模型同业的私募轮估值，以及融资时的宏观创投市场背景。

              公开可比并不完美，但有参考价值。Roblox Corporation——最大的上市沉浸式 3D 游戏平台——披露 FY2025 收入约 $4.87 billion（同比增长 36%），净亏损约 $1.07
              billion，平均日活用户 127 million。Roblox 截至 2025 年 6 月 30 日的非关联方总市值为 $65.5 billion，股价 $105.20，意味着 trailing P/S 约
              14–15×。这一倍数适用于一个高增长、面向消费者、且已证明 DAU 变现能力的平台——这些特质 Odyssey 还不具备。把同样的 14–15× 倍数套到 Odyssey 的 $1.45B
              估值上，意味着内嵌年经常性收入预期约 $95–105 million。公司没有披露任何此类收入。NVIDIA 是在基础模型层与 Odyssey 竞争的主导 AI 基础设施提供商，交易倍数约为 28–35×
              forward earnings，trailing revenue 超过 $130B；它对收入前创业公司不是相关参照，但可作为 AI 基础设施价值创造的上限参考。

              私有可比更相关，但噪音更大。Fei-Fei Li 领导的 World Labs 于 2024 年 9 月以约 $1 billion 估值融资 $230 million，随后又追加融资；其 2026 年 1
              月「World API」发布，是 API-first 世界模型产品最接近的直接竞争基准。Wayve 是英国 embodied-AI AV 公司，Odyssey CTO 曾共同开发其 GAIA 模型；Wayve
              四轮累计融资 $2.8 billion，反映投资人给予具备 physical-AI 血统团队的溢价。FieldAI 是 physical-AI 机器人软件公司，据 CB Insights 数据 2026 年以
              $2 billion 估值完成 $314 million Series A；考虑到类似算力强度和商业化前状态，它是更贴近的基准。Runway ML 是在生成视频层最直接竞争的 AI 视频生成平台，2024 年
              Series C 据报估值约 ~$1.5B；其公开定价层可作为开发者侧 AI 生成 API 在该规模下的商业阶段参照。

              截至 2026 年 Q1 的宏观创投背景进一步增加解释难度：季度创投融资在 2026 年 Q1 达到 $285.5 billion（历史新高），但其中 43% 来自单笔 OpenAI 交易；剔除该异常值后，融资为
              $163.5 billion。估值高企，且集中在头部十分位公司。全球 IPO 活动大幅下滑（2026 年 Q1 为 111 起，上一季度为 196 起），私募市场退出低迷，尽管 AI M&A
              接近历史高位。这意味着 $1.45B 标记是在卖方市场和集中需求下形成的；如果 Odyssey 在 Series C 窗口（估计 12–24 个月）前未披露商业牵引力，不能排除倍数压缩情景。
