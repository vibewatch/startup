      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 建议：继续研究 / 跟踪
            body: >-
              Odyssey 的世界模型论点在科学上可信，创始团队也出色，但 $1.45B 估值没有任何商业证据支撑。给出正面投资建议的最低条件是：（1）披露 $5M+ ARR，并有具名企业客户；（2）月度烧钱速度证明跑道至少
              24 个月；（3）完全摊薄股权表。在这三项披露完成前，任何按或接近 Series B 价格的投资，都是基于信念的投机，不是有证据支撑的承保。
            calloutType: recommendation
            claimRefs:
              - CV040
              - CV041
              - CV042
          - type: callout
            title: 下轮降价风险不可忽视
            body: >-
              2026 年 Q1 全球 IPO 活动大幅下滑（111 宗 IPO，接近两年低点）；除 AI M&A 外，私人市场退出处于近两年最低水平；风险投资高度集中——2026 年 Q1 风险投资资金中 43% 来自单笔
              OpenAI 交易。若 Odyssey 在 Series C 窗口前未能跑出商业牵引力，按 Series B 估值或更低估值退出就是现实下行情形，并会通过清算优先权瀑布损害普通股权益。
            calloutType: risk
