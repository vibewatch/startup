  - id: TV005
    title: 投资论点失效与终止触发因素
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 竞争者基准追平
        - NVIDIA Cosmos 或 DeepMind Genie 2 的 VBench 2 物理得分达到 Odyssey 的 ≥95%，且提供成本更低的 API
        - 技术差异化这个最核心的信心支柱消失；护城河只剩团队和数据飞轮。
        - 下调信心；要求 90 天内完成独立第三方基准复现。
      - - Series C 关口仍无商业披露
        - Series B 完成后 18 个月内（到 2027 年 12 月）仍未披露 ARR 或具名企业客户
        - 估值失去锚点；Series C 投资人可能要求平轮或降轮，引发清算优先权瀑布。
        - 任何跟投承诺前必须开放数据室；如有机会，考虑二级市场退出。
      - - Series C 降轮或平轮
        - Series C 投后估值定在或低于 $1.45B
        - 市场重估 AI 世界模型品类；说明投资人重新评估商业化时间线。
        - 评估优先权悬置压力；在清算优先权瀑布下建模回收情境。
      - - 联合创始人离职
        - Oliver Cameron 或 Jeff Hawke 宣布离职，且没有可信的内部继任者
        - 关键人风险是严重程度最高的单一运营风险；融资和伙伴关系落地都会严重受损。
        - 立即升级至董事会；审查投资文件中的继任条款。
      - - AWS 成本优势失效
        - AWS Trainium 基准显示，在世界模型负载上性价比低于 Nvidia H100/H200
        - 算力成本优势论点失效；COGS 压力可能让 Odyssey API 相比 Nvidia 原生竞争者失去价格竞争力。
        - 委托独立算力基准测试；评估 AWS 合同退出条款。
      - - IQT / 政府采购限制
        - CFIUS 或政府合同条款限制新投资人的国籍，或要求董事会席位访问具备安全许可
        - 限制 Series C 及之后的投资人池；排除非美国 hyperscaler 后，M&A 买方范围缩小。
        - 对投资协议做法律审查；确保符合任何既有 CFIUS 条件。
    notes: 触发因素和阈值是作者基于公开证据作出的判断。Odyssey 未披露内部 KPI 或正式终止标准。
    claimRefs:
      - CV038
      - CV039
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 与收入历史
        - 公开渠道和 Series B 公告均未披露 ARR、累计收入或收入桥。
        - 没有收入分母，就无法用任何市场倍数压力测试 $1.45B 估值；这是优先级最高的单一尽调事项。
        - 向 CEO / CFO 索取；最低要求：过去 12 个月 ARR、新增 ARR，以及自创立以来的流失。
      - - 月度烧钱率
        - 未披露烧钱率、运营预算或人均成本。
        - Runway 估算随烧钱假设不同落在 62–155 个月；不确定性过大，难以按 Series B 价格承销。
        - 向 CFO 索取：过去 3 个月平均烧钱、前三大成本类别、董事会批准的 FY2026 运营预算。
      - - 完全摊薄股权结构表
        - 未披露股权结构表、SAFE 转换安排、认股权证清单或期权池规模。
        - 清算优先权堆栈决定有效每股价格；没有这张表，$1.45B 投后估值无法解读。
        - 向法律顾问索取；包括全部普通股、优先股、期权、认股权证、SAFEs、可转债，以及任何附函条款。
      - - 法律实体与治理
        - 任何公开来源均未披露公司法定名称、注册州和董事会构成。
        - SEC EDGAR 上未找到 Odyssey 最新几轮融资的 Regulation D Form D，引发对实体结构和监管合规的疑问。
        - 核验 EDGAR Form D；检索注册州；由公司披露董事会构成。
      - - AWS 交易经济性
        - AWS 合作条款——最低承诺、收入分成、联合销售条款、Trainium 定价——均未披露。
        - AWS 渠道被列为主要商业路径；没有条款，无法预测 GTM 收入。
        - 向 CEO 索取：AWS 主协议；确认最低收入承诺、联合销售触发条件和定价结构。
      - - 企业 LOI 或已签合同
        - 未公开任何具名企业客户、已签合同、ACV 或 LOI。
        - 商业验证完全缺位；IQT 参与意味着政府有兴趣，但不等于已签合同。
        - 向 VP GTM 索取：提供任何已执行 LOI、试点协议或数据共享合同，并列明客户名称和 ACV 区间。
    notes: 若按或接近 $1.45B 的 Series B 价格做新投资，每一项都是阻塞性尽调缺口。优先级顺序：（1）ARR，（2）烧钱，（3）股权结构表，（4）法律实体，（5）AWS 经济性，（6）客户合同。
    claimRefs:
      - CV041
      - CV042
