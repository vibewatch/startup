      - number: '7.4'
        title: 人员、治理与执行风险
        blocks:
          - type: paragraph
            body: >-
              Odyssey 是一家双创始人主导的公司，Oliver Cameron 任 CEO，Jeff Hawke 任
              CTO。二人被公开识别为主要技术和战略发言人；任何招聘信息、新闻稿或投资人沟通中，都未公开出现副手高管、首席产品官、首席法务官或总法律顾问。招聘页确认 HR
              基础设施「处在早期建设阶段——要么已有但尚未优化，要么根本还不存在」。公司没有披露独立董事；董事会构成从公开来源看完全不透明。这个治理缺口很重要，因为 Odyssey
              正瞄准需要合规和法律基础设施的受监管垂直领域（国防、医疗），进入 EU AI Act 下的 GPAI 监管，并管理 $337 million 资本基础，但除了两名创始人外，没有披露问责结构。

              缺少商业拓展职能放大了执行风险。截至 2026 年 6 月 22 日，Odyssey 开放职位中没有客户经理、企业销售经理或销售开发代表。AWS
              商业拓展合作是唯一披露的主要分发机制，但这项安排的商业条款、排他范围和最低承诺均未披露。团队的自动驾驶背景带来深厚世界模型研究能力，但在建设企业合规基础设施或处理多司法辖区监管格局方面经验有限。55 人团队还要与
              DeepMind、Waymo、Tesla 和其他前沿 AI 实验室争夺同一批稀缺人才，人才留存是结构性风险。
