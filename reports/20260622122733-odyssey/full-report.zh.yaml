  - id: TV003
    title: 牛市 / 基准 / 熊市情景分析
    columns:
      - 情景
      - 关键假设
      - 隐含估值区间
      - 概率信号
      - 关键风险
    rows:
      - - 牛市
        - 12 个月内推出生产级机器人或游戏 SDK；到 2027 年底 ARR 达 $20–50M；获得 IQT 政府合同；Series C 按 2–3× 上调估值；潜在战略收购价为 Series B 的 3–5×。
        - 2028–2030 年达到 $3.0–6.0B
        - 低到中；需要多个胜利同时发生
        - 执行速度、算力成本轨迹、战略收购方时机。
      - - 基准
        - >-
          到 2027 年底达成 3–5 个企业试点协议；ARR 为 $5–20M；Series C 估值区间为 $1.8–2.5B；4–7 年内以 $2–4B 战略 M&A 退出；Series B 资本获得约 1.5–3×
          总回报倍数。
        - 终局 $2.0–4.0B；1.5–3× 总 MOIC
        - 中；符合商业化前 AI 基础设施先例。
        - 后续轮次稀释；算力成本逆风；竞争者 API 商品化。
      - - 熊市
        - 24 个月内没有商业 ARR；NVIDIA/Google API 在价格和性能上压低 Odyssey；Series C 以 $1.2–1.45B 持平或下调估值； 清算优先权瀑布损害普通股。
        - 终局 $0.5–1.4B；普通股 <1×
        - 低但不可忽视，因为透明度不足；每错过一次商业披露，概率都会上升。
        - 清算瀑布；关键人物离职；算力基础设施过时。
    notes: 估值是作者基于可比融资轮估值和市场倍数所做的示意性估算；Odyssey 未给出前瞻指引。概率信号为定性判断。
    claimRefs:
      - CV025
      - CV026
      - CV027
