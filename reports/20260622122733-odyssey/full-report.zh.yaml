      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Odyssey 由 Oliver Cameron（CEO）和 Jeff Hawke（CTO）联合创立。两人都来自自动驾驶行业，过往经历直接塑造了公司的方法。Cameron 曾联合创立从 Udacity
              拆出的自动驾驶初创公司 Voyage，后者于 2021 年 3 月被 GM 旗下 Cruise 收购；此后他在 Cruise 担任产品副总裁。Hawke 曾是英国自动驾驶初创公司 Wayve
              的创始工程师，Wayve 团队参与了 GAIA 世界模型。两人在物理 AI 领域的共同背景——尤其是为自动驾驶构建能从传感器和视频数据学习下一状态世界模型的系统——构成 Odyssey
              技术差异化的底座。Cameron 还拥有 YC 校友身份。

              公开产品博客和招聘页点名的扩展领导团队包括 James Grieve（工程副总裁）、Jessica Inman（GTM 与运营副总裁）和 Fabian Güra（杰出工程师）。研究组织成员来自
              DeepMind（参与 Gemini 语言模型和 Veo 视频模型）、Tesla（Full Self-Driving）、Waymo、Meta AI、Apple 和 Wayve。已发表研究中署名的贡献者包括
              Aravind Kaimal、Sirish Srinivasan、Ahmad Nazeri、Ben Graham、Jonathan Sadeghi、Kaiwen Guo，以及 Agora-1 和 PROWL
              团队名单中的其他成员。官方 about 页面以「supporters」列出的知名支持者包括 Jeff Dean（Google 首席科学家）、Soumith Chintala（Meta AI）、Max
              Jaderberg 和 Tim Rocktäschel。

              现阶段关键人物风险很高。Cameron 是主要融资人、外部发言人和公司公众面孔；Hawke
              负责技术研究项目。两位联合创始人都出现在所有主要产品发布和投资人沟通中。公司未公开披露正式董事会组成——无论是独立董事还是投资人委派席位。治理不透明对一家私营 Series B
              公司并不罕见，但仍是尽调缺口，尤其是 In-Q-Tel（IQT，CIA 关联基金）参与其中，IQT 往往要求安全相关治理安排。截至 2026 年 6 月 22 日，公开来源未显示重大领导层变动或离职。
