      - number: '2.2'
        title: 市场规模与格局
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，没有独立分析机构把通用世界模型作为独立跟踪类别发布市场规模测算。该类别仍处早期，只被纳入更广的相邻市场。Odyssey 的投资人 GV 于 2026 年 6
              月公开把世界模型称为「multi-billion-dollar category」，这是目前最具体的第三方市场规模表述。

              三种宽窄不同的边界视角框住可服务机会。仿真软件市场给出最窄但适用的框架：Mordor Intelligence 估计其 2026 年规模为 USD 15.46B，到 2031 年增长至 USD
              28.59B，CAGR 为 13.08%；AI 驱动的生成式仿真工作流为该增长轨迹额外贡献约 1.70 个百分点。生成式 AI 市场给出最宽框架：2026 年为 USD 28.45B，到 2031 年增长至
              USD 126.66B，CAGR 为 34.82%，其中医疗是增长最快垂直，CAGR 为 36.36%。把两个市场合并为边界，可得到 2026 年约 USD 43.9B
              的技术支出包络，世界模型在其中竞争并最终替代既有方案。

              对仿真软件市场采用保守的 5–15% AI-first 仿真渗透假设，可得到作者估算的 2026 年 SAM 为 USD 1.5–4.6B。这与 GV 对「multi-billion-dollar
              category」的描述一致，但没有独立规模测算佐证。视频游戏市场（2026 年 USD 326.47B，CAGR 12.68%）和医疗仿真市场（2026 年 USD 3.01B，CAGR
              14.12%）是各自独立的垂直子市场，有不同采购和定价动态。这些市场估算存在显著方法差异，应作为方向性参考，而非预测。Mordor Intelligence 的规模数据是其截至 2026 年 1
              月基于内部框架得出的专有估计，未经独立审计。
