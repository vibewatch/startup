      - number: '7.2'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: >-
              最迫近的运营风险，是产品仍处于原型状态。Odyssey 的 API 许可协议明确把 API 描述为「原型」，排除所有担保，也没有提供
              正常运行时间服务级别协议。这是合同层面的限制：任何受监管垂直领域——国防、医疗、金融服务——的企业客户都无法接受原型层级 SLA。API 只运行了五个月，无法提供纵向可靠性记录。

              技术质量风险集中在世界模型生成的内在限制上。Odyssey 和 UCL 研究人员共同署名的 PROWL 论文明确记录了弱行为约束下的 reward-hacking 失败模式。Odyssey 的物理准确性主张依赖
              VBench 2 benchmark；该 benchmark 未经独立审计，且依赖 Odyssey 帮助推广的指标。公司没有发布内容安全技术报告、带偏见评估的模型卡或 AI 安全框架。使用 API 的
              GitHub 社区仓库展示了创意但可能缺乏审核的应用——包括 AI 战斗模拟——说明安全与审核基础设施尚未被公开描述。安全姿态不透明：任何公开文档中都未发现 SOC 2 Type II、FedRAMP、ISO
              27001 或同等认证。流式输出视听内容的世界模型 API 可能暴露 prompt injection、对抗输入利用或训练数据抽取攻击。公司没有公开事件响应政策。
