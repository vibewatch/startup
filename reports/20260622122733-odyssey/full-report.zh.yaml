  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              通用世界模型市场涵盖一类 AI 系统：它们通过因果下一状态预测来训练，用大规模视频和交互数据作为主要训练信号，模拟物理环境如何随时间演化。Odyssey
              将自己的产品放在这一细分市场中，并与两个相邻类别区分开来：狭窄领域专用仿真器（手工物理引擎，显式编码领域规则，例如刚体或有限元求解器）和纯视频生成模型（生成逼真内容，但不扎根于物理因果）。

              纳入的支出包括交互式世界仿真的开发者 API 访问、仿真基础设施的企业授权、具身 AI 智能体训练的研究访问，以及规模化运行物理精确仿真的计算合作。排除的支出包括传统仿真软件（Ansys、Siemens
              Xcelerator、MathWorks Simulink）、物理游戏引擎（Unity、Unreal Engine）、没有因果预测目标的文生图或文生视频模型，以及无法跨领域泛化的狭窄自动驾驶仿真器。

              现状替代品很多。机器人领域，团队今天使用 NVIDIA Isaac Gym、MuJoCo 或 PyBullet 做合成机器人策略训练，并辅以昂贵的真实世界数据采集项目。游戏领域，程序化生成引擎和预脚本 NPC
              行为替代学习型世界模型。国防和医疗领域，专门构建的场景仿真器（VSTARS、VirtaMed）在各自规定领域内满足训练需求。随着能力成熟，合成数据生成、数字孪生和空间 AI
              的相邻支出正向世界模型汇合，意味着未来三到五年可服务边界会扩大。Google DeepMind 的 Genie 2 和 Wayve 的 GAIA
              表明资金雄厚的既有玩家正在构建竞争性通用世界模型，既验证了该细分市场的重要性，也提高了替代风险。
