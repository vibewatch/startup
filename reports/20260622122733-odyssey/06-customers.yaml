  - id: retention-adoption
    title: "Retention, Repeat Usage, and Satisfaction"
    body: >-
      No retention metrics, cohort data, churn rates, net promoter scores, gross revenue retention, or net revenue retention
      figures have been publicly disclosed by Odyssey. This absence is structurally unsurprising given the API's five-month
      age at the run date: enterprise-grade retention cohorts require at least six to twelve months of usage data to be
      meaningful, and Odyssey's API remains in prototype status with no announced production SLA commitments. The legal
      terms of service grant Odyssey broad rights to use content generated through its API for model training purposes — a
      clause that may deter enterprise customers with sensitive data or IP concerns.

      Developer community engagement exists but is thin. A Hacker News discussion thread related to Odyssey was accessible
      during the research period, though the thread content was limited. GitHub evidence shows two repositories using the
      Odyssey ML API, representing the sum of publicly observable developer integrations. No developer conference talks,
      API tutorials published by third parties, or blog posts describing production-grade Odyssey integrations were found.
      The Agora-1 GoldenEye multi-agent demo and the Starchild-1 multimodal model showcase serve as proof-of-concept
      deployments, but both are first-party demonstrations rather than external customer deployments.

      Supplementary tables below document the full set of observable adoption signals and the data gaps that prevent any
      quantitative retention assessment.
    claimRefs:
      - CU025
      - CU026
      - CU027
      - CU028
