  - id: concentration-risks
    title: "Expansion and Concentration Risks"
    body: >-
      Odyssey faces a significant customer concentration risk: its entire publicly-named partner-proof base consists of three
      investor-adjacent entities — Amazon/AWS, Samsung Next, and IQT — all of which are US-headquartered and all of which
      are also investors in Odyssey, raising a question of whether their endorsements reflect arm's-length customer intent
      or investor loyalty. No independent enterprise customer outside the investor syndicate has been publicly confirmed.

      NVentures (NVIDIA's venture arm) invested in Odyssey's Series A in February 2026, yet did not participate in the Series B
      announced in June 2026 despite NVIDIA being cited as an AMD/Intel competitor investing in adjacent world-model infrastructure
      (Cosmos). This non-participation has been characterised adversely by at least one press outlet as a signal of shifting
      priorities. If NVIDIA pursues its own Cosmos platform as a competing world-model API, Odyssey could face both a competitive
      displacement risk and a loss of the implied NVIDIA customer reference.

      The prototype API label poses a structural barrier to enterprise expansion: enterprise customers in regulated industries
      (defence, healthcare, financial services) cannot deploy a platform explicitly labelled as having no warranty or uptime
      guarantee. Until Odyssey transitions its API to a production label with SLA commitments and pricing transparency, the
      addressable enterprise customer base is effectively gated. The absence of any disclosed channel or reseller partners
      further limits geographic reach; all evidence suggests US-centric operations with no announced international expansion
      partnerships.
    claimRefs:
      - CU036
      - CU037
      - CU038
      - CU039
      - CU040
      - CU041
      - CU042
      - CU043
      - CU044
