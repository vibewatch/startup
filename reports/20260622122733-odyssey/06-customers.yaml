company:
  name: "Odyssey"

chapter:
  number: 6
  title: "Customers"
  summary: >-
    Odyssey's paying customer base is not publicly disclosed as of June 2026, five months after the API launched in prototype form.
    The strongest public customer-proof is Amazon VP Ron Diamant's Series B press release quote endorsing Odyssey for robotics, gaming,
    science, and beyond, paired with AWS's designation as preferred cloud provider — evidence of an infrastructure partnership but not
    a named enterprise production deployment. In-Q-Tel lists Odyssey as an active portfolio company, signalling a defence/IC pathway,
    and Samsung Next provided investor commentary on Odyssey-2 Pro capabilities. Only two third-party GitHub repositories using the
    Odyssey ML API were found; no customer case studies, ARR, user counts, or retention data have been disclosed.

sections:
  - id: customer-segmentation
    title: "Customer Segmentation and Adoption Trajectory"
    body: >-
      Odyssey targets three primary customer archetypes. Developer-researchers are the immediate customer of record: the Odyssey-2 Pro
      API, launched January 23 2026, is addressable by any developer with API key access through developer.odyssey.ml. Intended
      enterprise customers span gaming studios, robotics OEMs, defence and intelligence agencies, healthcare simulation platforms,
      and education technology providers — all verticals named explicitly by Odyssey in product and blog materials. Strategic investor-partners
      (Amazon/AWS, Samsung Next, IQT) represent a third tier: entities whose commercial and technical alignment with Odyssey may
      eventually materialise into production deployments but have not yet been confirmed as paying customers.

      The product surface distinguishes tiers: Odyssey-2 Pro is the broadly accessible API model; Odyssey-2-Max targets higher-throughput
      enterprise workloads. The Broadcast API feature, launched alongside iterative product updates, enables multi-user shared simulation
      sessions — directly relevant for gaming and defence training use cases. At the time of this report the API is explicitly labelled
      a "prototype" in Odyssey's legal terms, constraining enterprise adoption under any compliance or uptime SLA requirement.

      No user counts, active developer figures, or API call volumes have been publicly disclosed. The API is approximately five months
      old at the run date, meaning any adoption trajectory must be treated as nascent and any cohort-retention data is structurally
      unavailable from public sources.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs:
      - TU001
      - TU002
    figureRefs:
      - FU001
      - FU002

  - id: named-customer-proof
    title: "Named Customer Proof"
    body: >-
      Odyssey has not publicly named any enterprise production customer as of June 2026. The strongest on-record customer-proof
      is a direct quote from Ron Diamant, VP Distinguished Engineer at Amazon, in the official BusinessWire Series B press
      release: "Odyssey's team has been pushing the boundaries of what's possible in this space… We're excited to support this
      next phase of growth with AWS as Odyssey's preferred cloud provider, collaborate on optimising their models on our silicon,
      and work together to help accelerate applications in robotics, gaming, science, and beyond." This quote confirms a
      preferred-cloud-provider infrastructure partnership with AWS and co-development intent, but does not constitute a named
      production software deployment.

      In-Q-Tel, the CIA-affiliated strategic investment fund, lists Odyssey as an "Active" portfolio company in its public
      portfolio — a reliable signal of defence and intelligence community interest, but not confirmation of a government contract
      or production deployment. Samsung Next investment director Andy Duong publicly commented on Odyssey-2 Pro's "rapid
      technical advances" and "promising progress toward interactive world simulation," positioning Samsung as an interested
      strategic partner rather than a named customer.

      A GitHub search for repositories using the Odyssey ML API returned exactly two results, one of which is described as a
      "storyboard-to-video app built on Odyssey.ml API." This represents the only public third-party integration evidence found,
      and its production status is unknown. No customer case studies, customer logos with named organisations, testimonials,
      or ROI reports appear on Odyssey's public website. Logo walls on landing pages, where present, do not include named
      enterprise customers.
    claimRefs:
