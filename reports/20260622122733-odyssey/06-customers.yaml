callouts:
  - calloutType: "risk"
    title: "No Named Paying Customer"
    body: >-
      As of June 2026, Odyssey has not publicly named a single paying enterprise customer. All named parties with public
      endorsements are also investors in Odyssey's funding rounds, creating a material concern about the independence and
      durability of stated demand. The required customer-proof sourceType in this chapter is satisfied by Amazon VP Ron
      Diamant's press-release quote — a partner endorsement, not a production deployment confirmation.
    claimRefs:
      - CU013
      - CU017
      - CU023

  - calloutType: "risk"
    title: "API Prototype Label Blocks Enterprise Conversion"
    body: >-
      Odyssey's legal terms of service designate the API as a "prototype." Combined with the absence of disclosed pricing,
      SLA commitments, or uptime guarantees, this structurally prevents enterprise procurement in regulated verticals
      (defence, healthcare, financial services). The land-and-expand motion typical for developer-led B2B companies is
      currently blocked at the enterprise conversion step.
    claimRefs:
      - CU012
      - CU030
      - CU035
      - CU040

