  - id: "direct-competitor-profiles"
    title: "Direct and Major Competitor Profiles"
    body: >-
      Runway is the most directly comparable competitor to Odyssey. Both companies position themselves as building
      general-purpose world models, both serve developer/enterprise API customers, and both target gaming, robotics,
      and creative use cases. Runway launched GWM-1 in 2025, which comes in three variants: GWM Worlds for
      explorable environments, GWM Avatars for conversational character agents, and GWM Robotics for robotic
      manipulation. Runway also offers Gen-4.5, described internally as "the world's top-rated video model," which
      provides a creative video generation product line alongside its world model research. Runway's published
      research (as of September 2025) includes autoregressive-to-diffusion vision language models, 3D Gaussian
      splatting techniques, and dual-process image generation — a similar breadth of technical output to Odyssey's
      research publications. Runway is headquartered in New York City. Its funding history is not fully disclosed,
      but the company has raised substantial venture capital across several rounds.

      World Labs, founded by Stanford AI professor Fei-Fei Li, raised $230 million at a $1 billion valuation in
      September 2024. World Labs launched Marble, its frontier multimodal world model, in November 2025, and
      announced the World API for public use in January 2026. Marble generates spatially consistent, high-fidelity,
      persistent 3D worlds from text, images, videos, or 360-degree panoramas, with strong interactive editing and
      export capabilities. World Labs explicitly positions this as "spatial intelligence" — transforming seeing into
      doing and imagining into creating — rather than physics-accurate world simulation. A June 2026 research post
      from World Labs proposed a taxonomy distinguishing Renderers, Simulators, and Planners in the world model
      space, suggesting the company is aware of functional differentiation across competitors.

      Google DeepMind's Genie 3 is the most technically impressive institutional competitor. Described as "a
      general-purpose world model," Genie 3 generates photorealistic environments in real-time at 20-24 frames per
      second at 720p resolution from text prompts. It is grounded in Google's Street View dataset and demonstrates
      object affordances, multi-agent NPC behavior, physics modeling (water effects, smoke, gravity), and long-horizon
      memory. However, as of June 2026, Genie 3 is described by DeepMind as "an experimental research prototype"
      with documented limitations including a limited action space, constrained multi-agent interaction, and interaction
      duration measured in minutes rather than hours. Its predecessor Genie 2, announced December 2024, demonstrated
      similar capabilities at 3D world generation from single image prompts. Genie 3's primary competitive risk to
      Odyssey is that it benefits from Google's infrastructure, data, and distribution without commercialization
      pressure — it can be released free or at marginal cost once mature.

      NVIDIA Cosmos is the open-source incumbent threat. Available under NVIDIA's permissive open model license
      (commercial use permitted), Cosmos offers a suite of diffusion and autoregressive transformer models for
      physics-aware video generation. The models were trained on 9,000 trillion tokens from 20 million hours of
      real-world data and range from 4 to 14 billion parameters. Physical AI adopters including 1X, Agility
      Robotics, XPENG, Uber, and Waabi are already evaluating or using Cosmos. The platform integrates with NVIDIA
      Omniverse, DGX Cloud, and NeMo — locking Cosmos adoption to NVIDIA hardware in a way that benefits NVIDIA's
      overall platform strategy but creates a free competitor for Odyssey's robotics and AV customer targets.
