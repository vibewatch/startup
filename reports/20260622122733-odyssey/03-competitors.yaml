callouts:
  - calloutType: "risk"
    title: "Runway GWM-1: Direct Capability and Positioning Overlap"
    body: >-
      Runway's GWM-1 — launched with three variants (Worlds, Avatars, Robotics) and backed by Runway's
      existing video generation customer base — represents Odyssey's most immediate competitive threat. Runway
      describes its mission using language nearly identical to Odyssey's own positioning. Both companies target
      gaming, robotics, and creative use cases via developer APIs. Runway's advantage is an established video
      generation revenue stream and enterprise relationships from Gen-4.5 that can cross-sell GWM-1.
    claimRefs:
      - CP002
      - CP003
      - CP041
  - calloutType: "insight"
    title: "OpenAI Sora Discontinuation Reduces Near-Term Competitive Pressure"
    body: >-
      OpenAI discontinued the Sora web and app experiences on April 26, 2026, with the API also set for
      discontinuation on September 24, 2026. This removes a well-resourced competitor from the video/world
      simulation segment. However, it also signals that even OpenAI with its compute advantage could not find
      a durable commercial path for video/world simulation — a cautionary signal for the segment's monetization
      difficulty.
    claimRefs:
      - CP005
      - CP006
      - CP042
  - calloutType: "risk"
    title: "NVIDIA Cosmos Creates a Free Baseline for Physical AI Simulation"
    body: >-
      NVIDIA Cosmos, available at no cost under an open model license, provides world model capabilities for
      physical AI applications — directly overlapping with Odyssey's robotics and AV training use cases. Trained
      on 20 million hours of real-world data and integrated into NVIDIA's Omniverse/DGX Cloud ecosystem, Cosmos
      eliminates the cost floor in the physical AI simulation segment and creates a commoditization risk for
      Odyssey's enterprise API pricing in those verticals.
