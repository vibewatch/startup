  title: "Company Overview"
  summary: >-
    Odyssey is a Palo Alto-based AI research laboratory that raised $310 million at a $1.45 billion unicorn valuation in June 2026,
    bringing total funding to $337 million. Founded in late 2023 by AV pioneers Oliver Cameron (CEO) and Jeff Hawke (CTO),
    the company of 55 employees is building general-purpose world models—causal, physics-accurate AI systems that simulate
    how the world evolves—targeting robotics, gaming, healthcare, defense, and science applications.

sections:
  - id: "identity-and-business-overview"
    title: "Identity and Business Overview"
    body: >-
      Odyssey is an AI research laboratory headquartered in Palo Alto, California with offices in London and Zurich.
      The company was founded in 2023 by Oliver Cameron and Jeff Hawke with the stated mission to "learn the world to make it better."
      Its technology thesis is that general-purpose world models—causal, multimodal AI systems trained on video to predict and simulate
      how the world evolves—represent a new class of foundation model analogous to large language models but grounded in physics and dynamics.
      As of June 2026, Odyssey is at Series B stage with a $1.45 billion post-money valuation.

      The company's product portfolio spans four systems: Odyssey-2 Max, a physics-accurate general-purpose world model described by the
      company as achieving state-of-the-art scores on the VBench 2 physics benchmark; Starchild-1, presented as the first real-time
      multimodal world model combining visual and audio generation; Agora-1, a multi-agent world model enabling up to four simultaneous
      participants to share and interact within the same simulation; and PROWL, a reinforcement learning-driven adversarial framework
      that improves world model quality through active exploration of failure cases. The company commercializes these systems through
      developer API access and enterprise partnerships, with Amazon Web Services designated as the preferred cloud delivery partner
      following the June 2026 Series B. Revenue, customer count, and ARR are not publicly disclosed; these represent material
      diligence gaps for any valuation assessment.

      Odyssey targets multiple high-value verticals: robotics (where world models enable simulated pre-training before deployment),
      gaming (AI-generated interactive environments), healthcare (simulation of biological processes and care navigation),
      defense (realistic scenario generation for training), science (physical simulation), and education. The business model is
      centered on API/platform access for developers and strategic compute partnerships. With 55 employees and $337 million raised,
      Odyssey is among the most capital-intensive AI startups per employee in its cohort.
