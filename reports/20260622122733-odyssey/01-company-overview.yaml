  - id: "milestones-and-trajectory"
    title: "Milestones and Trajectory"
    body: >-
      Odyssey has progressed from founding to unicorn status in roughly two and a half years. The company was founded in November 2023,
      as corroborated by the @odysseyml X account creation date and the Series B announcement confirming "three years" of work as of June 2026.
      Early institutional funding from GV, EQT, Air Street Capital, and a roster of prominent angel investors was secured through 2024.
      An early general-purpose world model product, Odyssey-2 Pro, was launched in 2025, accompanied by additional strategic investment
      from NVIDIA NVentures and Samsung Next.

      Product velocity increased sharply in 2026. Oliver Cameron published the essay "Why We Must Build World Models" in February 2026,
      articulating the company's research thesis publicly. PROWL, the RL-driven adversarial world model training framework, was released
      on May 12, 2026, authored by Jeff Hawke and colleagues. On May 18, 2026, the Agora-1 multi-agent world model was released—the
      first such system to enable multiple simultaneous participants in a shared generated world. On June 12, 2026, Odyssey published
      the technical essay "The Era of Multi-Agent Imagined Experience," deepening the research discourse. The Series B and AWS partnership
      were announced on June 17, 2026, representing both the financing and commercial milestone capping this period.

      No adverse events—regulatory actions, lawsuits, data breaches, layoffs, or product recalls—appear in public sources as of
      June 22, 2026. This absence is consistent with an early-stage research lab that has not yet scaled a deployed commercial product
      to the extent that would create public regulatory exposure. The main adverse signal is structural: NVIDIA's non-participation in
      the Series B may indicate a strategic tension or competitive dynamic, and the high capital intensity ($337M for 55 employees)
      represents execution risk if product commercialization does not accelerate.
