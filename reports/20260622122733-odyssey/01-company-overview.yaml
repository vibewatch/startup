callouts:
  - calloutType: "strength"
    title: "Differentiated founder-market fit in physical AI"
    body: >-
      Both founders built autonomous vehicle systems—a narrow domain where world-model prediction was the core technical
      challenge. Oliver Cameron exited Voyage via acquisition by GM's Cruise; Jeff Hawke contributed to Wayve's GAIA world model.
      This gives Odyssey a credible, battle-tested research lineage that is difficult to replicate and is directly relevant
      to the company's stated mission.
    claimRefs:
      - CO003
      - CO004
      - CO036

  - calloutType: "risk"
    title: "No disclosed revenue or customers — commercialization path unverified"
    body: >-
      As of June 2026, Odyssey has not publicly disclosed any revenue, ARR, or named enterprise customers. The company
      raised $337 million—approximately $6.1 million per employee—making it one of the most capital-intensive AI bets
      per head in the market. The AWS partnership is a promising commercial signal but contract terms, revenue commitments,
      and customer traction remain private. The commercialization path from research lab to revenue-generating enterprise
      is the critical unverified dimension.
    claimRefs:
      - CO006
      - CO010
      - CO013
      - CO030
      - CO039

  - calloutType: "risk"
    title: "NVIDIA non-participation in Series B signals compute ecosystem tension"
    body: >-
      NVentures (NVIDIA) invested in Odyssey's Series A in February 2026 but did not participate in the June 2026
      Series B. Simultaneously, Odyssey committed to AWS Trainium chips as its primary compute path—Amazon's
      direct competitor to NVIDIA GPUs. TechFundingNews characterized this as a "pointed move." The long-term
      implications for Odyssey's model performance (if Trainium underperforms NVIDIA GPUs for world model
      workloads) and for any prior IP or commercial arrangements with NVIDIA are unknown.
    claimRefs:
      - CO012
      - CO013
      - CO014
      - CO029

  - calloutType: "insight"
    title: "IQT participation signals U.S. government and defense customer interest"
    body: >-
      In-Q-Tel (IQT) is the not-for-profit strategic investment arm of the U.S. intelligence community.
      Its participation in the Series B typically reflects both a technology interest and a pathway to
      government customer engagements. Given Odyssey's stated defense application (realistic scenario generation
