  - id: "growth-drivers-and-adoption-constraints"
    title: "Growth Drivers and Adoption Constraints"
    body: >-
      The most powerful structural driver is the robotics industry's accelerating deployment wave. The International
      Federation of Robotics reported that US industrial robot installations grew 11% year-on-year to 38,000 units
      in 2025, with the food industry surging 30%. China installed 295,000 robots in 2024 (54% of the global
      market), and China's 15th Five-Year Plan (2026–2030) places robotics at the center of national AI strategy.
      Each incremental robot deployment requires training data that world models can supply synthetically, creating
      a demand multiplier. NVIDIA's CES 2025 announcement of Cosmos world foundation models—trained on 9,000
      trillion tokens from 20 million hours of robotics and driving video—validates physical AI simulation as core
      infrastructure and broadens industry familiarity with world model APIs as a developer primitive.

      Cloud simulation adoption is also a structural tailwind: Mordor found that 60.11% of simulation revenue in
      2025 came from on-premises deployments, while cloud/SaaS was growing at 13.22% CAGR—the fastest-growing
      deployment mode—as mid-market teams shift to subscription pricing. Odyssey's AWS partnership and Trainium
      co-optimization position it to capture this cloud migration.

      Adoption constraints are material. The compute intensity of world model training is extreme: NVIDIA's
      processing pipeline required 40 days of Hopper GPU clusters to process 20 million hours of video, versus over
      three years for an unoptimized CPU workflow—creating a high capital barrier to entry and ongoing cost pressure
      for buyers. On-premises preference by defense and automotive buyers (IP firewall concerns) limits
      cloud-delivered API adoption in those segments. EU AI Act governance obligations add compliance costs for
      healthcare and financial services buyers in Europe. Physics fidelity gaps remain a concern: world models
      are described as "nascent" even by Odyssey, and safety-critical sectors require certification regimes
      (regulatory approval, independent audit) that are not yet defined for learned simulation systems.
