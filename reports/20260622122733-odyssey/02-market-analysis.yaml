chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Odyssey operates at the intersection of generative AI and simulation, targeting a nascent general-purpose world models
    segment that sits within a combined $43.9 billion 2026 addressable envelope spanning simulation software ($15.46 billion)
    and generative AI ($28.45 billion), both growing at double-digit CAGRs. The five core verticals—robotics, gaming,
    healthcare, defense, and developer infrastructure—each carry distinct buyer/payer dynamics, procurement cycles, and
    adoption constraints. Growth is propelled by an accelerating robotics deployment wave (US installations +11% in 2025,
    China 295,000 units in 2024), NVIDIA's validation of world foundation models as physical AI infrastructure, and a
    cloud-API monetization model that democratizes experimentation. Adoption is constrained by the absence of a standalone
    analyst-tracked world models category, the capital intensity of training, safety-certification gaps for regulated
    sectors, and long defense procurement cycles. No independent analyst has sized the world models segment specifically,
    leaving critical sizing diligence gaps.

sections:
  - id: "market-boundary-and-definition"
    title: "Market Boundary and Definition"
    body: >-
      The general-purpose world models market encompasses AI systems trained through causal next-state prediction
      to simulate how physical environments evolve over time, using large-scale video and interaction data as the
      primary training signal. Odyssey positions its products within this segment, distinguishing them from two
      adjacent categories: narrow domain-specific simulators (hand-crafted physics engines that encode domain rules
      explicitly, such as rigid-body or finite-element solvers) and pure video generation models that produce
      photorealistic content without grounding in physical causality.

      Included spend covers developer API access to interactive world simulation, enterprise licensing for simulation
      infrastructure, research access for embodied AI agent training, and compute partnerships for running
      physics-accurate simulations at scale. Excluded spend includes traditional simulation software (Ansys, Siemens
      Xcelerator, MathWorks Simulink), physics game engines (Unity, Unreal Engine), text-to-image or text-to-video
      models without causal prediction objectives, and narrow autonomous-driving simulators that do not generalize
      across domains.

      Status-quo substitutes are diverse. In robotics, teams today use NVIDIA Isaac Gym, MuJoCo, or PyBullet for
      synthetic robot policy training, supplemented by expensive real-world data collection programs. In gaming,
      procedural generation engines and pre-scripted NPC behaviors substitute for learned world models. In defense
      and healthcare, purpose-built scenario simulators (VSTARS, VirtaMed) serve training needs within their
      prescribed domains. The adjacent spend in synthetic data generation, digital twins, and spatial AI is converging
      toward world models as capabilities mature, suggesting an expanding addressable boundary over a three-to-five
      year horizon. Google DeepMind's Genie 2 and Wayve's GAIA demonstrate that deep-pocketed incumbents are building
      competing general-purpose world models, validating the segment's significance while increasing the substitution
      risk.
