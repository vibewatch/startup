  - id: "financing-context-and-entry-discipline"
    title: "Current Financing Context and Entry Discipline"
    body: >-
      Odyssey's Series B closed on June 17, 2026 at a $1.45 billion post-money valuation on $310 million raised,
      led by Natural Capital with Amazon, AMD Ventures, GV, EQT, and In-Q-Tel as named participants.
      The implied pre-money valuation was approximately $1.14 billion; the $310 million raise expanded total
      disclosed funding to $337 million. NVIDIA NVentures participated in the Series A (February 2026) but
      did not participate in the Series B—a potential signal of either cap-table management preference or
      a competitive conflict given NVIDIA's own Cosmos world-model investment.

      Entry discipline at the Series B price ($1.45B) is constrained by opacity. Without a fully diluted
      cap table, preference stack, or liquidation waterfall, the effective per-share price is unverifiable.
      Key structural considerations are: (1) $337 million raised implies aggressive dilution of common equity
      from prior rounds; (2) Natural Capital GP Jay Zaveri described this as the firm's "largest investment
      to date," suggesting concentrated exposure; (3) AWS co-investment aligns the platform dependency with
      the infrastructure stack, limiting negotiating leverage; and (4) IQT participation as a strategic
      investor potentially subjects Odyssey to government contracting terms and CFIUS-related restrictions
      on investor composition at later rounds.

      New investors entering at or near the Series B price should demand: (a) audited or management-prepared
      financial statements showing ARR, burn rate, and gross margin for at least two trailing quarters; (b) a
      fully diluted cap table including all SAFEs, convertibles, warrants, and employee option pool; (c) a
      confirmed first-year revenue target and ARR bridge with named enterprise customers or LOIs; (d) the
      AWS deal economics including any minimum-commitment provisions; and (e) a legal-entity name, state of
      incorporation, and board composition disclosure. Until these are provided, committing at $1.45B is
      speculation rather than investment.
