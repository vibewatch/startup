  - id: "exit-readiness-and-final-diligence-asks"
    title: "Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks"
    body: >-
      Exit readiness is materially limited. There is no evidence of a dedicated M&A team, no disclosed revenue
      history, no IPO readiness infrastructure (no audited financials, no governance disclosure, no publicly
      named independent board members), and no registered company name in public records as of June 22, 2026.
      The most realistic exit path in the near-to-medium term is strategic acquisition by a hyperscaler
      (Amazon given AWS alignment, Microsoft, Google) or a gaming/simulation platform operator (Epic Games,
      Unity). An IPO is a 5–8 year scenario at minimum and requires the company to generate publicly
      auditable revenue of $100M+ at acceptable gross margins.

      Thesis-break triggers are specific and monitorable: (1) NVIDIA Cosmos or Google DeepMind Genie 2
      achieves demonstrable benchmark parity with Odyssey in physics-accuracy while offering lower API
      pricing; (2) Odyssey fails to disclose any commercial ARR within 18 months of the Series B close
      (i.e., by December 2027); (3) the Series C round is priced at or below $1.45B, signaling investor
      reassessment; (4) co-founder departure (Cameron or Hawke) without a credible internal successor;
      (5) AWS Trainium performance benchmarks fail to demonstrate cost parity with Nvidia H100/H200,
      undermining the compute cost advantage thesis.

      The final diligence ask list is extensive but standard for a pre-revenue unicorn: actual ARR or
      revenue-to-date (priority #1), monthly burn rate for trailing three months (priority #2), fully
      diluted cap table (priority #3), legal entity name and state of incorporation, any committed
      enterprise ARR or executed LOIs, AWS deal economics, board composition disclosure, and any
      outstanding IP licensing obligations or government-security-clearance conditions that would
      restrict the investor base at later rounds.
