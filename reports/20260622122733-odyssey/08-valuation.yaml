callouts:
  - calloutType: "recommendation"
    title: "Recommendation: research-more / track"
    body: >-
      Odyssey's world-model thesis is scientifically credible and the founder team is exceptional, but the $1.45B
      valuation is unsupported by any commercial evidence. The minimum conditions for a positive investment
      recommendation are: (1) disclosed ARR of $5M+ with named enterprise customers, (2) monthly burn rate
      confirming runway of at least 24 months, and (3) a fully diluted cap table. Until those three disclosures
      are made, any investment at or near Series B price is conviction-based speculation rather than evidenced
      underwriting.
    claimRefs:
      - CV040
      - CV041
      - CV042

  - calloutType: "risk"
    title: "Down-Round Risk is Non-Trivial"
    body: >-
      Global IPO activity declined sharply in Q1 2026 (111 IPOs, near a two-year low), private-market exits are
      at their lowest in almost two years outside AI M&A, and venture concentration is extreme—43% of Q1 2026
      venture funding was a single OpenAI transaction. If Odyssey's commercial traction fails to materialise
      before the Series C window, an exit at or below the Series B valuation is a realistic downside scenario
      that would impair common equity through the liquidation-preference waterfall.
    claimRefs:
      - CV022
      - CV027
      - CV035

