  - id: "bull-base-bear-scenarios"
    title: "Bull / Base / Bear Scenarios"
    body: >-
      Bull case (probability signal: low–medium; requires multiple positive developments). Odyssey ships a
      production-grade robotics-simulation SDK or a gaming-engine integration within 12 months, converting
      the current developer-API private beta into meaningful ARR. The AWS Trainium collaboration accelerates
      inference cost reduction, enabling competitive pricing relative to Runway and open-source models. IQT
      participation converts into a government contract worth $20–50M+ in the 18-month horizon. A Series C
      round at 2–3× step-up (implied $3–4.5B valuation) would establish a clear upward mark; if a strategic
      acquirer (Nvidia, Google, Microsoft, or a game engine provider like Unity or Epic) engages, acquisition
      premium could be 3–5× the Series B valuation. Bull-case exit value: $3–6B by 2028–2030.

      Base case (most likely given available evidence). Odyssey remains a leading world-model research lab
      through 2026–2027, releases additional product iterations, and signs 3–5 pilot enterprise agreements
      in robotics or gaming, generating $5–20M in initial ARR by end of FY2027. The Series C round prices
      at a modest step-up ($1.8–2.5B range) conditional on demonstrable commercial traction. Capital
      intensity remains high and compute costs limit gross margin expansion. Exit via strategic acquisition
      at $2–4B is the most likely liquidity event in a 4–7 year horizon, contingent on product-market fit
      confirmation. Base-case investor return from Series B entry: 1.5–3× gross multiple on capital,
      IRR of ~15–25% over a 6–7 year hold. Returns are disproportionately back-loaded and depend on
      avoiding dilution at subsequent rounds.

      Bear case (probability signal: low but non-trivial given opacity). Commercial scale does not
      materialize within 24 months: Odyssey fails to convert API beta users to paying customers at
      sufficient volume to justify the current valuation. NVIDIA Cosmos or Google DeepMind's Genie 2
      releases a commercially available world-model API that undercuts Odyssey on both performance and
      price. The Series C round is priced flat or below Series B ($1.2–1.45B), triggering
      liquidation-preference waterfall that materially impairs common equity. Bear case: recoverable only
      for senior preferred holders; common equity faces near-total loss.
