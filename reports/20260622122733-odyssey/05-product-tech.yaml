callouts:
  - calloutType: strength
    title: "Causal Architecture Enables Real-Time Interactivity"
    body: >-
      Odyssey's causal autoregressive formulation is the architectural foundation for
      real-time interactive simulation — a capability bidirectional video models structurally
      cannot achieve. This design choice, validated by VBench-2 physics benchmarks and the
      PROWL arXiv paper, is a genuine technical differentiator.
    claimRefs:
      - CE008
      - CE009
  - calloutType: risk
    title: "Prototype API with No SLA and Broad Customer Data Rights"
    body: >-
      The API license agreement explicitly labels the API a 'prototype', disclaims all
      warranties, and grants Odyssey a perpetual license to use customer data for model
      training. Enterprise and regulated-sector customers will require material improvements
      to data governance, SLA commitments, and compliance certifications before broad
      adoption.
    claimRefs:
      - CE030
      - CE031
  - calloutType: risk
    title: "No Published Security Certifications or Independent Audit"
    body: >-
      No SOC 2, ISO 27001, or equivalent security audit has been identified in the
      public record. Defense and healthcare verticals explicitly targeted by the company
      will require independent security validation, and the current posture creates a
      potential sales blocker in regulated markets.
    claimRefs:
      - CE034

