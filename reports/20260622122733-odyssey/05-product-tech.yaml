  - id: trust-safety-compliance
    title: "Trust, Safety, Security, and Compliance"
    body: >-
      Odyssey's published trust and compliance posture is thin relative to enterprise
      standards, which is consistent with its early research-preview stage but creates
      material diligence risk for customers in regulated verticals (healthcare, defense).
      The API license agreement (ODYSSEY SYSTEMS, INC., dated 2026-01-22) explicitly
      disclaims all warranties including fitness for purpose, non-infringement, and error-
      free operation. No SLA or uptime commitment is published. The agreement grants
      Odyssey a "worldwide, perpetual, irrevocable, royalty-free" license to use customer
      prompt and output data for model training, analytics, and quality assurance — a broad
      data rights grant that may conflict with enterprise data-sovereignty requirements.

      Use restrictions prohibit personal data submission to the API unless separately
      agreed in writing, and explicitly forbid using the API or output data to train
      competing models. Content restrictions forbid harmful, illegal, fraudulent, and
      privacy-violating applications. No independent security audit (SOC 2, ISO 27001),
      no published GDPR/CCPA compliance mechanism, no content-safety technical report, and
      no published model card with bias or safety evaluation have been identified in the
      diligence surface as of 2026-06-22. The defense application use case (IQT investment,
      careers reference to "warfighter training") implies export-control and ITAR
      considerations that are unaddressed publicly. GitHub search shows community developer
      activity (murder-mystery games, fashion try-on, AI battle arenas) using the public
      API, confirming developer adoption but also highlighting moderation challenges across
      creative use cases. The developer portal (developer.odyssey.ml) exists but content is
      JavaScript-rendered and full documentation was not publicly accessible at fetch time.
