  topStrengths:
    - Odyssey 不到三年就连续发布了一组可信的前沿世界模型产品，包括 Odyssey-2 Max、Starchild-1、Agora-1 和 PROWL。
    - 以公司阶段看，投资人与合作伙伴基础异常强，Natural Capital、Amazon、AMD Ventures、GV、EQT 和 In-Q-Tel 都在验证其研究方向。
    - 公司所在的物理 AI 类别规模大、仍在成形；差异化仿真质量可能为机器人、游戏和国防买家创造战略价值。
  topRisks:
    - 公司没有公开收入、ARR、客户数、烧钱速度或毛利率数据，因此估值无法落到经营基本面上。
    - $1.45B 定价已经假设未来商业规模，但具名客户证明有限，产品也仍处在年轻的 private beta 阶段。
    - NVIDIA、Google DeepMind 等大公司和其他世界模型初创公司，可能在 Odyssey 证明商业牵引力之前压缩其护城河。
  unresolvedGaps:
    - 实际 ARR 或已确认收入，包括 private beta 用户是否转化为付费企业账户。
    - 完全摊薄股权结构表、董事会构成、法律实体细节，以及 Series B 的清算优先权条款。
    - AWS 合作的经济条款，包括最低承诺、算力定价，以及这段关系是否能形成持久的 GTM 杠杆。
