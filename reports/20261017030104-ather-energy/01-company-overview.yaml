company:
  name: Ather Energy
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Ather Energy is now a listed Indian electric two-wheeler OEM with a premium,
    software-led ownership model anchored in scooters, charging, and connected
    services. Official FY26 disclosures show strong revenue and unit growth, but
    the assigned pool still leaves gaps around lifetime capital raised,
    shareholder concentration, and a fully reconciled public-market valuation.
sections:
  - id: identity-and-model
    title: Identity, stage, and operating model
    body: >-
      Ather Energy is a Bengaluru-headquartered public EV OEM founded in 2013 by
      Tarun Mehta and Swapnil Jain. The official company narrative is consistent
      on three elements later chapters can treat as ground truth: Ather sells
      electric two-wheelers, it layers in-house software and charging
      infrastructure around the vehicle, and it positions the portfolio toward
      the premium end of the market rather than entry-level price competition.
      That strategy now spans performance-led 450 variants and the family-focused
      Rizta line, with management using the EL platform to widen addressable
      price points without abandoning the integrated ecosystem thesis.
    claimRefs: [CO001, CO002, CO003, CO005, CO006]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: >-
      Founder continuity remains a core diligence positive and a concentration
      risk. Investor-relations and annual-report disclosures still place Tarun
      Mehta in the CEO seat and Swapnil Jain in the CTO role, so product
      strategy, brand, and technical roadmapping remain tied to the founders.
      The broader listed-company control stack is now more formalized, with
      Sohil Parekh as CFO and Puja Aggarwal as company secretary and compliance
      officer, while the board had eight directors including three independents
      at March 31, 2026. Governance did change through the IPO year: Niranjan
      Gupta and Nilesh Shrivastava exited in May 2025, and Vivek Anand joined in
      November 2025, signaling an active post-listing board refresh rather than
      a static pre-IPO structure.
    claimRefs: [CO001, CO013, CO014, CO015]
    tableRefs: [TO002, TO003]
  - id: funding-scale-and-public-snapshot
    title: Funding, scale, and public-market snapshot
    body: >-
      The cleanest funding event in the assigned pool is the May 2025 IPO, which
      put Ather on the NSE and BSE and raised roughly ₹2,980 crore. FY26
      disclosures then showed meaningful scale-up: revenue from operations rose
      to ₹3,671.76 crore, vehicle sales reached 262,942 units, and the company
      reported 3,875 employees at year-end. Customer scale is directionally
      larger than those unit numbers alone suggest, with the homepage claiming
      4,00,000+ families in the installed base, but that is still a company
      marketing number rather than a filing-defined active-customer metric.
      Independent media coverage also illustrates why later valuation work should
      stay conservative: published 2026 share figures ran above the official
      17.1% FY26 market-share disclosure, and one analysis explicitly questioned
      whether a roughly 9x sales multiple was durable.
    claimRefs: [CO004, CO009, CO010, CO011, CO012, CO016]
    tableRefs: [TO001]
  - id: milestones-and-open-items
    title: Milestones, expansion markers, and unresolved items
    body: >-
      The milestone sequence in the assigned pool is coherent: Ather started in
      2013, launched Rizta in April 2024 to broaden beyond the original
      performance niche, listed in May 2025, unveiled the EL platform in August
      2025, and extended Rizta into Nepal and Sri Lanka during FY26 while
      crossing the 500,000-vehicle production mark. What is less complete is the
      financing and ownership history around those milestones. The worker pool
      does not cleanly reconcile pre-IPO private rounds, secondary liquidity, or
      current free float and strategic-holder concentration from exchange
      filings. For diligence purposes, the business has enough public evidence to
      establish identity and operating scale, but not enough in this chapter’s
      pool to treat the cap table and valuation base as fully settled.
    claimRefs: [CO001, CO004, CO005, CO006, CO007, CO008, CO015, CO016]
    figureRefs: [FO001]
