chapter:
  number: 6
  title: Customers
  summary: "Ather now serves a broader consumer mix than its original enthusiast niche: the FY26 volume engine was the family-oriented Rizta, while the company kept scaling its premium 450 line, direct retail footprint, and ownership ecosystem. Public adoption proof is real and current, but durability evidence is still weaker than growth evidence because cohort retention, churn, and concentration metrics remain largely undisclosed."
sections:
  - id: segment-broadening
    title: "Segment coverage has widened beyond early premium adopters"
    body: |
      Ather's customer story is no longer just a premium-performance niche. The current public product surface spans the performance-led 450 range and the family-oriented Rizta range, which matters because it shows the company intentionally broadening from enthusiast riders toward households seeking convenience, comfort, and practical urban mobility. FY26 made that pivot tangible: Rizta alone delivered 199,134 units, and outside observers also frame the addressable base more broadly than a single buyer persona. The retail model still keeps the brand close to customers through direct retail and partner-led expansion, but the core takeaway is that Ather now appears to be selling into at least three overlapping cohorts: premium performance riders, family buyers, and newer geographic cohorts reached through expanding physical access.
    claimRefs: [CU003, CU004, CU005, CU010, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: "Adoption proof is strongest in current volume and ownership-surface expansion"
    body: |
      The strongest public proof of real customer adoption is current unit volume plus the expansion of the ownership surface around those vehicles. Ather sold 262,942 scooters in FY26, up 69% year over year, while Rizta became the convenience-segment volume driver. The company also doubled its experience-centre and service-centre footprints and expanded charging access, which suggests the operating model is scaling alongside demand rather than relying on one-time launch momentum. Historical proof is available too: independent retellings of Ather's launch period describe Bengaluru and then Chennai selling through early supply, showing that customer pull existed before the business had today's national footprint. What remains thinner is fresh, independently named customer proof at the individual buyer level; most of the public record is cohort-level rather than account-level evidence.
    claimRefs: [CU001, CU002, CU003, CU006, CU011, CU012]
    tableRefs: [TU003]
  - id: durability-expansion-and-risk
    title: "Expansion loops are visible, but retention and concentration remain underdisclosed"
    body: |
      Ather's best public durability signal is not a disclosed churn or renewal metric; it is the way the company has built post-sale expansion hooks into charging, service, and software. Independent 2025-2026 profiles reported very high AtherStack Pro attachment, and the company's own materials keep emphasizing accessories, connected services, and recurring ownership touchpoints. That supports the thesis that Ather can monetize customers after the initial vehicle sale, but it does not prove renewal durability because public NRR, GRR, churn, repeat-purchase, and concentration disclosures are still missing. Expansion risk also matters: independent commentary argues that the direct-to-consumer model slows penetration in thinner markets, while price sensitivity in Middle India could make the next wave of buyers harder to win if subsidies fall or rivals trigger a price war.
    claimRefs: [CU007, CU008, CU009, CU014, CU015, CU016]
    tableRefs: [TU002]
