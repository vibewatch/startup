callouts:
  - calloutType: strength
    title: "Rizta turned segmentation into scale"
    body: "Ather's customer mix is visibly broader than in its early premium-only years: Rizta delivered 199,134 FY26 units, and current company messaging is explicitly family-oriented rather than only enthusiast-led."
    claimRefs: [CU003, CU004, CU010]
  - calloutType: risk
    title: "Durability proof trails adoption proof"
    body: "Public sources strongly support adoption and expansion hooks, but they do not yet prove retention durability because churn, renewal, repeat purchase, and customer concentration disclosures remain sparse while thinner-market demand could be more price-sensitive."
    claimRefs: [CU008, CU009, CU014, CU015]
