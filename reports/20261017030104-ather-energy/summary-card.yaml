  topStrengths:
    - FY26 revenue, volume, and gross margin all improved materially.
    - >-
      The integrated charging, software, and service ecosystem is more differentiated than a hardware-only scooter
      business.
    - Retail and product reach broadened beyond the original performance niche.
  topRisks:
    - Capital intensity and dilution risk remain the main valuation constraints.
    - Public disclosure is still thin on retention, payback, and stream-level economics.
    - Execution risk persists around factory ramp, charging utilisation, and partner-led expansion.
  unresolvedGaps:
    - Final financing terms, dilution math, and post-raise ownership effects remain unsettled.
