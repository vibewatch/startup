schemaVersion: "report-v2"
artifact: financials
slug: ather-energy
runDate: 2026-10-17
company:
  name: Ather Energy
chapter:
  number: 4
  title: Financials
  summary: >-
    Ather's FY26 public disclosures show a real step-up in scale and operating
    quality: revenue from operations reached ₹3,671.76 crore, adjusted gross
    margin improved to 24%, and operating cash flow turned positive. The
    financial story is still only partly underwritable because public evidence
    does not break out realized pricing, stream-level gross margins, store
    payback, or charger utilization in enough detail to judge durable
    economics.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing signals
    body: >-
      Public evidence shows that Ather is still primarily a scooter seller, but
      no longer only that. FY26 revenue from operations rose sharply with unit
      growth, and the official revenue split shows vehicle sales still dominate
      while non-vehicle revenue has become material enough to matter for margin
      mix and customer lifetime value. The public website adds a current list
      price lens for the 450, Rizta, and Konarc ranges, while the annual report
      gives only a blended average revenue realization per scooter. That means
      investors can see sticker pricing and aggregate realized revenue, but not
      the model-level discounting, financing support, or attach economics
      underneath each SKU and service bundle.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-margin-path
    title: Unit economics and margin path
    body: >-
      The strongest public underwriting signal is that FY26 improvement was not
      just a volume story. Ather said average revenue realization held at
      ₹1,21,386 per scooter despite competitive discounting, subsidy
      contribution fell to 3% of revenue, COGS per unit dropped to ₹1,10,199,
      and adjusted gross margin improved to 24% with 21% margin even without
      incentives. That combination suggests better product mix, engineering-led
      cost reduction, and more resilient pricing than a pure subsidy pass-through
      business. What remains missing is the split between hardware margin,
      service margin, software margin, and charging economics, so the public
      record supports directional improvement rather than full stream-by-stream
      unit economics.
    claimRefs: [CI003, CI004, CI006, CI007]
    tableRefs: [TI003]
  - id: liquidity-capital-needs-and-balance-sheet
    title: Liquidity, capital needs, and balance-sheet posture
    body: >-
      Funding chronology belongs in Company Overview; for Financials, the
      relevant question is whether the FY26 balance sheet reduces or merely
      postpones financing dependency. The annual report points to a much
      stronger current-asset base after the IPO, including term deposits and
      investments funded by unutilized proceeds, and it shows debt
      restructuring that moved the company away from higher-cost borrowings.
      At the same time, growth still consumes capital through plant expansion,
      network build-out, and working capital. Positive operating cash flow in
      FY26 is encouraging, but it was helped by payable expansion, while
      investing cash outflow and public expansion plans imply that self-funded
      growth has not yet been proven.
    claimRefs: [CI008, CI009, CI010, CI011, CI013, CI014]
  - id: verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial verdict is improving but not yet cleanly underwritable.
      Ather looks materially better than a year earlier on volume, margin, cash
      conversion, and access to capital, which is why the business now looks
      like a scaling public EV OEM rather than a subsidy-dependent startup.
      Independent commentary still flags the same core risk: expansion remains
      capital intensive, and public disclosures do not yet prove repeatable
      store payback, durable charger utilization, or recurring-software margin
      at maturity. For underwriting, that keeps the company in the zone where
      the trajectory is investable to watch, but the evidence set still falls
      short of a clean, bottoms-up conviction case.
    claimRefs: [CI010, CI011, CI012, CI013]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      -
        - Vehicle sales
        - Scooter sales through the 450 and Rizta portfolio
        - "₹ / scooter"
        - "FY26 vehicle revenue ₹3,191.74 crore; 262,942 units sold"
        - "High for aggregate revenue; weak for model-level mix"
        - "Disclose model-level ASP, discounting, and channel mix by quarter."
      -
        - Non-vehicle ecosystem revenue
        - Software and other non-vehicle monetization aggregated by the company
        - "% of revenue"
        - "FY26 non-vehicle revenue ₹480.02 crore; 13% of total"
        - "Medium; official aggregate but not segmented"
        - "Break out software, service, charging, accessories, and financing revenue separately."
      -
        - Software and subscription attach
        - AtherStack and related connected-service attachment
        - "% of new buyers"
        - "AtherStack attach rate 91% in FY26; non-current deferred revenue ₹160.96 crore"
        - "Medium; strong attach signal but no ARPU or churn"
        - "Provide subscription ARPU, renewal rate, and gross margin."
      -
        - Service, charging, accessories, and partner monetization
        - After-sales plans, warranties, charging fees, accessories, and financing or insurance referrals
        - "₹ / user / month"
        - Publicly described but not itemized enough to underwrite as separate lines
        - "Low-to-medium; directionally real but poorly quantified"
        - "Show run-rate revenue, contribution margin, and attach by stream."
    notes: "Source mix: FY26 annual report plus public product and ecosystem descriptions; null-equivalent gaps reflect undisclosed stream-level economics."
    claimRefs: [CI001, CI002, CI004, CI010]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      -
        - Ather Konarc
        - "₹99,999 or ₹1,964/m"
        - Current list price only; not tied to realized FY26 ASP
        - Public page does not show incentive, dealer, or financing subsidy waterfall
        - Ather website
      -
        - Ather 450
        - "₹135,999 or ₹2,671/m"
        - "List price sits above FY26 blended average revenue per scooter of ₹1,21,386"
        - Model mix, realized discounts, and finance support are undisclosed
        - Ather website + FY26 annual report
      -
        - Ather Rizta
        - "₹121,999 or ₹2,396/m"
        - List price broadly aligns with blended FY26 revenue realization but cannot be isolated by variant
        - No public realized price by variant or geography
        - Ather website + FY26 annual report
      -
        - Connected services and after-sales bundles
        - Subscription / warranty / service-plan pricing only partially public
        - Attach is visible; realized pricing is not
        - Public record lacks AtherStack ARPU, service-plan take rate, and charging yield
        - Annual report + external case studies
    notes: "List pricing is public marketing data, not realized revenue; the table separates run-date sticker prices from the company’s aggregated FY26 realization."
    claimRefs: [CI003, CI005]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      -
        - Average revenue realization per scooter
        - "₹1,21,386 in FY26"
        - official
        - Best public proxy for blended realized pricing across the scooter portfolio
        - Disclose ASP by model, city tier, and financing mix.
      -
        - COGS per unit
        - "₹1,10,199 in FY26 versus ₹1,48,918 in FY24"
        - official
        - Shows engineering and sourcing improvement at the unit level
        - Split battery, electronics, and warranty-cost reductions.
      -
        - Adjusted gross margin
        - 24% in FY26
        - official
        - Primary public proof that pricing and cost improvements are translating into gross profit
        - Provide gross margin by vehicle, software, and service streams.
      -
        - Adjusted gross margin without incentive
        - 21% in FY26
        - official
        - Tests whether the business can survive with lower subsidy support
        - Reconcile incentive exposure by model and state.
      -
        - EBITDA margin
        - "(7%) in FY26 versus (23%) in FY25"
        - official
        - Shows distance to operating breakeven after fixed-cost absorption
        - Disclose steady-state opex needed for growth vs maintenance.
      -
        - Operating cash flow / growth capex
        - "₹31.89 crore operating cash flow; ₹506.07 crore FY26 capex and intangibles spend"
        - official
        - Highlights that better cash conversion coexists with heavy reinvestment needs
        - Provide maintenance vs expansion capex and charger or store payback curves.
    notes: "Official FY26 figures show meaningful progress, but missing per-stream and per-channel detail prevents a full bottom-up margin bridge."
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a bridge from unit demand into blended scooter
      revenue, ecosystem attach, margin improvement, and still-heavy reinvestment.
    data:
      nodes:
        - id: units
          label: Demand converted to scooter units
          detail: "262,942 units sold in FY26."
        - id: vehicle-revenue
          label: Vehicle sales create the core revenue base
          detail: "Sale of finished goods reached ₹3,207.99 crore."
        - id: ecosystem
          label: Software and ecosystem attach adds secondary revenue
          detail: "Non-vehicle revenue was ₹480.02 crore and AtherStack attach was 91%."
        - id: gross-margin
          label: Better mix and cost reduction lift gross margin
          detail: "Adjusted gross margin reached 24%; ex-incentive margin reached 21%."
        - id: ebitda
          label: Operating leverage narrows EBITDA losses
          detail: "EBITDA margin improved to (7%) in FY26."
        - id: cash-and-capex
          label: Cash generation is improving but still funds heavy reinvestment
          detail: "Operating cash flow was ₹31.89 crore while FY26 capex and intangibles spend was ₹506.07 crore."
      edges:
        - { from: units, to: vehicle-revenue, label: "unit growth drives realized sales" }
        - { from: vehicle-revenue, to: ecosystem, label: "installed base supports attach and services" }
        - { from: ecosystem, to: gross-margin, label: "higher-margin mix supports blended profitability" }
        - { from: gross-margin, to: ebitda, label: "cost discipline and scale narrow losses" }
        - { from: ebitda, to: cash-and-capex, label: "operating improvement still sits below full self-funded expansion" }
    approximationNotes: "The bridge is conceptual rather than arithmetic because public reporting aggregates multiple revenue streams and does not disclose a full margin waterfall."
    claimRefs: [CI001, CI002, CI003, CI005, CI006, CI007, CI008]
callouts:
  - calloutType: risk
    title: Public liquidity is stronger than public underwritability
    body: >-
      FY26 disclosures make the balance sheet look materially safer after the
      IPO, but they still do not show unrestricted liquidity, store payback,
      charger utilization, or per-stream margins clearly enough to underwrite
      durable self-funded growth.
    claimRefs: [CI008, CI009, CI010, CI011, CI013, CI014]
