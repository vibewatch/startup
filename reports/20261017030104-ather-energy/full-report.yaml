              - CO015
      - number: '1.3'
        title: Funding, scale, and public-market snapshot
        blocks:
          - type: paragraph
            body: >-
              The cleanest funding event in the assigned pool is the May 2025 IPO, which put Ather on the NSE and BSE
              and raised roughly ₹2,980 crore. FY26 disclosures then showed meaningful scale-up: revenue from operations
              rose to ₹3,671.76 crore, vehicle sales reached 262,942 units, and the company reported 3,875 employees at
              year-end. Customer scale is directionally larger than those unit numbers alone suggest, with the homepage
              claiming 4,00,000+ families in the installed base, but that is still a company marketing number rather
              than a filing-defined active-customer metric. Independent media coverage also illustrates why later
              valuation work should stay conservative: published 2026 share figures ran above the official 17.1% FY26
              market-share disclosure, and one analysis explicitly questioned whether a roughly 9x sales multiple was
              durable.
            claimRefs:
              - CO004
              - CO009
              - CO010
              - CO011
              - CO012
              - CO016
