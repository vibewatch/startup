  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Ather's moat depends on how rider-facing SKUs sit on common software, charging, support, and manufacturing layers
      rather than on one scooter model alone.
    data:
      layers:
        - label: Customer surfaces
          detail: Current entry points cover performance riders family riders charging access and accessories.
          modules:
            - Ather 450 series — premium-performance scooter line
            - Ather Rizta series — family-oriented scooter line
            - Ather Halo — accessory surface connected to the ride experience
          outputs:
            - Shared ownership loop across more than one rider persona
        - label: Vehicle platform
          detail: 450 is the incumbent base while EL is the reusable architecture for the next product cycle.
          modules:
            - EL platform — common chassis powertrain and electronics
            - Ather Charge Drive Controller — integrated charger and motor-controller path
            - Rizta and 450 upgrade path — installed-base carryover with OTA support
          outputs:
            - Claimed 15% faster assembly and up to 2x faster periodic service
        - label: Software and intelligence
          detail: AtherStack is the in-house link between scooter cloud app and connected services.
          modules:
            - AtherStack 7.0 — natural-language voice interface
            - Alerts and controls — tyre-pressure prompts Pothole Alerts Crash Alerts ParkSafe LockSafe
            - Ather Intelligence Fabric — product enterprise and workforce intelligence layers
          outputs:
            - Same-day OTA feature velocity across the installed base
        - label: Charging and support
          detail: Charging service and retail are built as deployment infrastructure not add-ons.
          modules:
            - Ather Grid — 6,000+ charging points
          outputs:
            - Charger discovery and app-routed top-up behavior
        - label: Retail and service
          detail: Partner-led physical deployment is how the software and charging story becomes usable at scale.
          modules:
            - Service network — 548 service centres in FY26
            - Experience-centre formats — flagship midsize and compact
            - Partner-led operating model — expansion through retail partners
          outputs:
            - Maintenance access training consistency and geographic expansion
        - label: Manufacturing and control
          detail: The roadmap concentrates risk in factory ramp safety proof privacy controls and component resilience.
          modules:
            - Factory 3.0 — Chhatrapati Sambhajinagar phase-one expansion
            - Safety controls — AEBS SkidControl FallSafe Emergency Stop Signal
            - Control disciplines — DPDP-aligned privacy practices and battery or rare-earth flexibility
          outputs:
            - More in-house processes with execution risk concentrated in the ramp
    approximationNotes: null
    claimRefs:
