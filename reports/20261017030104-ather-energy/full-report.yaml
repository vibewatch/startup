      - number: '5.2'
        title: Ather's technical architecture is designed for reuse across products
        blocks:
          - type: paragraph
            body: >-
              The core architecture thesis is reuse. Ather says it built vehicles, charging, software, and core
              technologies in-house, then moved that stack into EL, its first new architecture since the 450, using
              common chassis, powertrain, and electronics to support more than one product path. Recent launch evidence
              shows the company layering AtherStack 7.0, voice and alert features, and a smaller 6 kW charger on top of
              that architecture, while Factory 3.0 is supposed to move more transmission, electronics, and painting work
              in-house. If execution holds, the model should reduce component complexity, tighten service loops, and
              increase launch cadence. The strategic point is that Ather is trying to compound value across platform,
              software, charging, and manufacturing simultaneously; the risk is that the same concentration makes ramp
              quality and integration discipline central to the whole roadmap.
            claimRefs:
