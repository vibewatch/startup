  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment coverage has widened beyond early premium adopters
        blocks:
          - type: paragraph
            body: >
              Ather's customer story is no longer just a premium-performance niche. The current public product surface
              spans the performance-led 450 range and the family-oriented Rizta range, which matters because it shows
              the company intentionally broadening from enthusiast riders toward households seeking convenience,
              comfort, and practical urban mobility. FY26 made that pivot tangible: Rizta alone delivered 199,134 units,
              and outside observers also frame the addressable base more broadly than a single buyer persona. The retail
              model still keeps the brand close to customers through direct retail and partner-led expansion, but the
              core takeaway is that Ather now appears to be selling into at least three overlapping cohorts: premium
              performance riders, family buyers, and newer geographic cohorts reached through expanding physical access.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU010
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU008
              - CU009
              - CU010
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
