          - type: callout
            title: Public proof lags the control narrative
            body: >-
              The assigned pool shows credible safety privacy and manufacturing intent, but independent public proof of
              uptime certifications audits or recall outcomes remains thin, so the next diligence step should
              stress-test EL and Grid in the field rather than accept the control story at face value.
            calloutType: risk
            claimRefs:
