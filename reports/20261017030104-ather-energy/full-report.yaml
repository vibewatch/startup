  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              The highest-conviction risks are the ones already visible in reported operating data rather than
              speculative downside cases. Ather is still loss-making and cash consumptive while it expands
              manufacturing, charging, software, and distribution, so any slip in demand, subsidy support, or execution
              can delay breakeven and force continued dependence on financing. The second cluster is execution and
              supply-chain risk: Ather has already disclosed a quantified revenue hit from rare-earth magnet disruption
              and is simultaneously ramping a new Maharashtra plant whose economics depend on preserving product quality
              and service standards at higher volume. The third cluster is ecosystem risk: partner-led experience-centre
              growth, insurance-adjacency execution, and expansion beyond metros all require outside counterparties to
              perform without diluting Ather's premium ownership experience.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR008
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, policy, and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Policy risk is already proven rather than merely theoretical. Ather tied FY24 revenue pressure to reduced
              FAME support, and current secondary coverage still frames subsidy withdrawal and imported-material
              disruption as downside risks for a price-sensitive scooter market. The regulatory surface is also
              widening. IRDAI has approved Ather Insurance Limited as a composite corporate agent, but the retained
              disclosures still do not spell out product range, launch timing, distribution structure, or expected
              earnings, so investors can see the permission but not the unit economics. More broadly, Ather remains
              exposed to evolving subsidy, tax, safety, import, and environmental rules that can change demand and costs
              faster than an integrated EV OEM can reprice its product mix.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.3'
        title: Operational and model risk
        blocks:
          - type: paragraph
            body: >-
              Ather's operating model creates real differentiation, but it also concentrates execution risk. The annual
              report says rare-earth export restrictions in Q2 FY26 disrupted supply and created a one-time revenue hit,
              which shows how upstream constraints can flow straight into reported numbers. Management's mitigation is
              credible but incomplete: diversified sourcing, multi-chemistry optionality, and vertical integration can
              shorten recovery time, yet they do not eliminate the need to execute a major factory ramp while holding
              quality and customer satisfaction. The DTC footprint compounds that burden. Third-party analysis
              characterizes Ather Space expansion as capital intensive, and scaling into smaller cities may require
              hybrid partner models that weaken the very consistency Ather uses to justify premium positioning.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: Dependency map and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The main dependencies are monitorable. If operating losses and negative operating cash flow persist
              despite volume growth, the financing need stays open-ended. If subsidy or safety-rule changes force
              another price reset before the company reaches self-funded scale, demand elasticity becomes the thesis
              break. If Bidkin phase-1 output slips or service quality deteriorates during expansion, the premium brand
              promise weakens exactly when legacy rivals can use deeper balance sheets and denser dealer networks to
              attack. And if insurance, retail-partner, or charging expansion lacks disclosed economics, those
              adjacencies should be treated as strategic options rather than de-risked profit pools.
            claimRefs:
              - CR003
              - CR008
              - CR010
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR008
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital burn remains the fastest thesis-break trigger
            body: >-
              Persistent losses, negative operating cash flow, and explicit management guidance that expansion spending
              may continue mean the investment case is still sensitive to financing conditions, not just vehicle demand.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR014
          - type: callout
            title: Mitigation exists, but it is mostly executional rather than structural
            body: >-
              Vertical integration, diversified sourcing, and repeat partner expansion can soften supply and rollout
              shocks, yet they do not remove exposure to subsidies, component bottlenecks, or service-consistency risk
              as the footprint widens.
            calloutType: insight
            claimRefs:
              - CR005
              - CR008
              - CR010
              - CR016
          - type: callout
            title: Best monitor set before a fresh underwriting decision
            body: >-
              Track quarterly operating cash flow, Bidkin ramp milestones, service and charging coverage outside metros,
              and first-year disclosure on Ather Insurance's partners and earnings contribution; each is concrete enough
              to tighten or loosen the risk case.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR010
              - CR013
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and decision posture
        blocks:
          - type: paragraph
            body: >-
              The operating case is stronger than it was a year ago: Ather sold 2,62,942 vehicles in FY26, lifted
              national market share to 17.1%, doubled its retail footprint to 700 experience centres, and improved both
              gross margin and EBITDA margin materially. Those are the kinds of proof points that justify keeping the
              company on an investment watchlist rather than dismissing it as a subsidy-led EV story. At the same time,
              the valuation decision is now inseparable from financing discipline because the company has both approved
              a ₹2,500 crore capital raise and already launched a ₹1,200 crore first tranche. The public evidence says
              the business quality is improving, but it does not yet justify underwriting fresh capital without seeing
              the final issue terms, dilution math, and whether the new money funds margin-accretive scale rather than
              another round of expensive market-share pursuit.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
      - number: '8.2'
        title: Why the case is improving but not yet obviously mispriced
        blocks:
          - type: paragraph
            body: >-
              The investable part of the thesis is not abstract EV demand; it is Ather's ability to convert distribution
              expansion, software attach, and charging-network depth into better unit economics. FY26 revenue reached
              ₹3,671.76 crore, the loss narrowed by more than one-third, adjusted gross margin reached 24%, and
              non-vehicle revenue plus a 91% AtherStack Pro attach rate suggest the company is building a more
              defensible revenue mix than a hardware-only OEM. The anti-thesis is equally clear: fresh capital usually
              helps only if it is raised on disciplined terms and deployed into profitable growth. Here the retained
              pool shows an approved ₹2,500 crore financing path, a first tranche already underway, and explicit
              investor concerns around dilution, cash burn, and use of proceeds. That combination argues for a fair
              valuation stance: the business deserves attention because execution is improving, but the evidence does
              not support paying up before the final financing economics and post-raise operating trajectory are
              clearer.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: Scenario framing, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The upside case depends on Ather proving that capital raised after the IPO accelerates distribution and
              platform expansion without resetting the cost base. The base case is more restrained: keep the company on
              a track list, assume the follow-on capital is useful but not inherently value-creating, and require
              evidence that the FY26 margin gains persist after the network doubles and new platforms launch. The
              downside case remains meaningful because a listed EV manufacturer can grow volumes and still destroy
              shareholder value if issue pricing is weak, dilution is heavy, or execution shifts back toward
              subsidy-and-discount-led growth. Before any upgrade to a buy posture, the next diligence gate should be
              the final QIP or equivalent terms, updated market-cap and multiple context, and proof that retail,
              charging, and software expansion continue to improve contribution economics rather than merely defend
              share.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              Ather now has enough operating proof to stay in active diligence, but the retained public evidence still
              points to a price-sensitive track stance rather than immediate conviction buying.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
          - type: callout
            title: The financing terms are the gating variable
            body: >-
              The most decision-relevant missing fact is not whether Ather can raise money, but at what pricing,
              dilution, and use-of-proceeds discipline the capital is ultimately raised.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV013
