              - CP007
              - CP008
      - number: '3.2'
        title: Ather's moat is ecosystem depth, not just scooter specs
        blocks:
          - type: paragraph
            body: >
              The strongest pattern in the evidence is that Ather's differentiation comes from bundling hardware,
              software, charging, and service into one ownership system. The FY26 annual report says Ather built
              vehicles, software, charging infrastructure, and core technologies in-house, and it reports 6,000+
              charging points, 700 Experience Centres, 548 service centres, and a 91% AtherStack Pro attach rate. That
              is not the profile of a brand competing on sheet-metal alone. Independent write-ups reinforce the same
              conclusion: Strategy Story frames Ather as a vertically integrated mobility ecosystem, while Arthnova
              argues the company won early by controlling the customer journey instead of outsourcing it to legacy
              dealer layers. Even the charging-standard evidence matters competitively: LECCS aligns Ather and Hero Vida
              on one connector family while Ola and River still use other standards, which helps define where
              interoperability is improving and where lock-in still exists.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP009
              - CP010
              - CP012
      - number: '3.3'
        title: Scale, service density, and price still favor incumbents
        blocks:
          - type: paragraph
            body: >
              Ather's ecosystem moat does not remove the two largest incumbent advantages: reach and willingness to
              fight on price. Arthnova explicitly calls out the capital intensity of Ather's controlled retail and
              charging model, and Founderpin says TVS and Bajaj still combine higher retail share with deeper pockets
              and larger dealer networks. The official annual report also shows that Ather's own expansion is already
              partner-led and asset-light rather than purely company-owned, which means part of the moat is an operating
              playbook, not literal ownership of every touchpoint. The next battleground is the sub-₹1 lakh and tier-2/3
              segment. MeraEV reports that the EL platform is designed to compete directly with TVS iQube, Bajaj Chetak,
              and Hero Vida; if that move works, Ather narrows its most obvious lineup hole, but if incumbents intensify
              price competition or out-service Ather outside its strongholds, the current premium edge can compress
              quickly.
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: The moat is real, but it is conditional rather than permanent
        blocks:
          - type: paragraph
            body: >
              The evidence supports a durable but conditional view of Ather's competitive position. What looks hardest
              to copy is not any single feature, but the combination of a strong premium brand, paid software usage,
              dense charging and service surfaces, and a product roadmap that still aims to preserve software-led
              economics as prices come down. What looks easiest to attack is the outer ring of that moat: city-by-city
              pricing, dealer access, and the ability to cover lower-density geographies profitably. That is why the
              right lens is not "Ather versus one rival," but whether Ather can keep converting ecosystem depth into
              broader market coverage faster than TVS, Bajaj, Hero, and the status quo can neutralize the
              ownership-experience gap.
            claimRefs:
              - CP003
              - CP005
              - CP008
              - CP011
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: What buyers struggle to replicate
            body: >-
              Ather's most defensible edge is the combination of paid software usage, charging access, and a controlled
              ownership journey rather than any one scooter feature.
            calloutType: strength
            claimRefs:
              - CP003
              - CP004
              - CP005
          - type: callout
            title: What could compress the moat
            body: >-
              If TVS, Bajaj, and Hero use larger networks and more aggressive pricing to narrow the ownership-experience
              gap, Ather's premium lead can shrink even if its product remains differentiated.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing signals
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows that Ather is still primarily a scooter seller, but no longer only that. FY26
              revenue from operations rose sharply with unit growth, and the official revenue split shows vehicle sales
              still dominate while non-vehicle revenue has become material enough to matter for margin mix and customer
              lifetime value. The public website adds a current list price lens for the 450, Rizta, and Konarc ranges,
              while the annual report gives only a blended average revenue realization per scooter. That means investors
              can see sticker pricing and aggregate realized revenue, but not the model-level discounting, financing
              support, or attach economics underneath each SKU and service bundle.
            claimRefs:
