              - CU007
              - CU013
              - CU014
      - number: '6.2'
        title: Adoption proof is strongest in current volume and ownership-surface expansion
        blocks:
          - type: paragraph
            body: >
              The strongest public proof of real customer adoption is current unit volume plus the expansion of the
              ownership surface around those vehicles. Ather sold 262,942 scooters in FY26, up 69% year over year, while
              Rizta became the convenience-segment volume driver. The company also doubled its experience-centre and
              service-centre footprints and expanded charging access, which suggests the operating model is scaling
              alongside demand rather than relying on one-time launch momentum. Historical proof is available too:
              independent retellings of Ather's launch period describe Bengaluru and then Chennai selling through early
              supply, showing that customer pull existed before the business had today's national footprint. What
              remains thinner is fresh, independently named customer proof at the individual buyer level; most of the
              public record is cohort-level rather than account-level evidence.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU010
              - CU011
              - CU012
              - CU013
              - CU016
      - number: '6.3'
        title: Expansion loops are visible, but retention and concentration remain underdisclosed
        blocks:
          - type: paragraph
            body: >
              Ather's best public durability signal is not a disclosed churn or renewal metric; it is the way the
              company has built post-sale expansion hooks into charging, service, and software. Independent 2025-2026
              profiles reported very high AtherStack Pro attachment, and the company's own materials keep emphasizing
              accessories, connected services, and recurring ownership touchpoints. That supports the thesis that Ather
              can monetize customers after the initial vehicle sale, but it does not prove renewal durability because
              public NRR, GRR, churn, repeat-purchase, and concentration disclosures are still missing. Expansion risk
              also matters: independent commentary argues that the direct-to-consumer model slows penetration in thinner
              markets, while price sensitivity in Middle India could make the next wave of buyers harder to win if
              subsidies fall or rivals trigger a price war.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU014
              - CU015
              - CU016
