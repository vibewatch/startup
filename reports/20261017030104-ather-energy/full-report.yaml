              - CO010
              - CO011
              - CO012
              - CO016
      - number: '1.4'
        title: Milestones, expansion markers, and unresolved items
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence in the assigned pool is coherent: Ather started in 2013, launched Rizta in April
              2024 to broaden beyond the original performance niche, listed in May 2025, unveiled the EL platform in
              August 2025, and extended Rizta into Nepal and Sri Lanka during FY26 while crossing the 500,000-vehicle
              production mark. What is less complete is the financing and ownership history around those milestones. The
              worker pool does not cleanly reconcile pre-IPO private rounds, secondary liquidity, or current free float
              and strategic-holder concentration from exchange filings. For diligence purposes, the business has enough
              public evidence to establish identity and operating scale, but not enough in this chapter’s pool to treat
              the cap table and valuation base as fully settled.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
