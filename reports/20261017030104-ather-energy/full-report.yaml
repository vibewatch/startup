  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: premium electric scooters plus the ownership ecosystem'
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports defining Ather's market as Indian electric two-wheelers plus the ownership layer
              that removes adoption friction, not scooter hardware alone. The company's own materials repeatedly bundle
              scooters, charging, software, accessories, and service, which is analytically important because charging
              availability and connected features are part of the adoption decision rather than downstream add-ons.
              Within that broader electric-mobility boundary, Ather is still not attacking the whole two-wheeler market.
              Current pricing, product labels, and third-party commentary all point to a served segment split between
              premium performance commuters and family or mass-premium households, with the Rizta widening the aperture
              beyond early enthusiasts instead of taking Ather down to entry-level price bands.
            claimRefs:
              - CM001
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: 'Sizing lenses: multiple public adoption views, but no clean public SAM/SOM'
        blocks:
          - type: paragraph
            body: >-
              The public record is strong enough to establish that the Indian E2W market is scaling, but it does so
              through overlapping lenses rather than one reconciled TAM/SAM/SOM stack. Ather's FY26 annual report cites
              0.14 crore E2W retail units and 6.6% two-wheeler penetration in FY26, then points to 0.60-0.62 crore units
              and 22-25% penetration by FY30. The FY25 AGM report uses a scooter-specific denominator and says scooter
              electrification was already 16% in FY25, with 70-75% possible by FY31, while the DRHP uses a broader FY31
              total-two-wheeler frame. Those official estimates mostly differ by horizon or denominator. FounderPin's
              claim that 2026 penetration already exceeded 25% directly conflicts with the 6.6% figure and lacks a
              disclosed method, so it is excluded from the base case. A public bottom-up SOM for Ather by price band,
              city tier, and budget owner also remains missing.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM014
              - CM015
      - number: '2.3'
        title: 'Buyer and budget path: clearer segment logic than audited buyer-mix data'
        blocks:
          - type: paragraph
            body: >-
              Buyer segmentation is clearer than spend segmentation. The 450 line is still positioned as a premium
              performance purchase, while Rizta is explicitly merchandised for family use, which implies a
              household-utility buying path rather than an enthusiast-only one. Ather's own FY26 commentary also says
              category growth is being helped by shared-mobility platforms, gig workers, and delivery fleets looking for
              lower operating costs, so incremental E2W demand is not purely affluent urban retail. The gap is that
              public sources do not disclose the actual mix of self-pay, financed household, fleet, or channel-driven
              demand by model or geography. That means the buyer map is useful for adoption logic, but not good enough
              to underwrite a precise budget-owner revenue bridge.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: 'Drivers and constraints: premiumisation helps, competition still caps certainty'
        blocks:
          - type: paragraph
            body: >-
              The most persuasive demand-side driver is that E2W adoption is no longer framed purely as subsidy
              arbitrage. Both official and independent sources describe a market being pulled by premiumisation, better
              ownership experience, charging access, and software depth, which plays directly into Ather's product
              architecture. Ather's FY26 regional expansion and rising Middle India share suggest this thesis can travel
              beyond the Southern base if access points and service density are present. The counterweight is equally
              real: Business Standard explicitly frames the category as near an inflection point, not through one, and
              ties the upside to cost parity, policy support, and ecosystem quality while still flagging competition and
              supply risks. That leaves Ather exposed to execution risk even in a growing market.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set is broader than EV-only peers
        blocks:
          - type: paragraph
            body: >
              Ather is not just competing against other venture-backed scooter brands. The retained evidence shows a
              layered field: legacy incumbents such as TVS and Bajaj already lead FY26 retail sales, Hero Vida is
              growing quickly off Hero MotoCorp's broader system, Ola remains a volatile EV-first rival, and the
              petrol-scooter status quo still matters because many buyers anchor on upfront price and ubiquitous
              refuelling. Moneycontrol says Ather still held about 70% of the premium electric scooter segment, but that
              premium niche sits inside a much larger market where TVS and Bajaj already have more scale. The practical
              implication is that Ather's buyer is often choosing among three solution paths at once: a premium
              software-led EV, a legacy-brand EV with denser service access, or no switch at all from ICE.
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
