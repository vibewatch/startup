  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface maps to a full ownership workflow
        blocks:
          - type: paragraph
            body: >-
              Ather's customer-facing offer now spans more than a premium scooter. The current surface includes the
              performance-oriented 450 line, the family-oriented Rizta line, the in-house AtherStack software layer, the
              Ather Grid charging network, and Halo accessories inside one ownership system rather than separate
              products. That matters because the workflow proposition is not just vehicle purchase; it is purchase,
              charging, ride planning, over-the-air updates, analytics, accessories, and service in one loop. Public
              materials still show Ather staying above entry-level price points even as EL is meant to widen coverage,
              so product breadth is coming from platform expansion and software-enabled experience instead of a
              low-price SKU blitz. For diligence, this means adoption quality depends on whether the integrated
              ownership layer keeps working after the sale, not just whether the company can ship another scooter
              variant.
            claimRefs:
