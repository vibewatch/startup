              - CU010
          - type: callout
            title: Durability proof trails adoption proof
            body: >-
              Public sources strongly support adoption and expansion hooks, but they do not yet prove retention
              durability because churn, renewal, repeat purchase, and customer concentration disclosures remain sparse
              while thinner-market demand could be more price-sensitive.
            calloutType: risk
