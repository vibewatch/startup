      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Rizta turned segmentation into scale
            body: >-
              Ather's customer mix is visibly broader than in its early premium-only years: Rizta delivered 199,134 FY26
              units, and current company messaging is explicitly family-oriented rather than only enthusiast-led.
            calloutType: strength
            claimRefs:
