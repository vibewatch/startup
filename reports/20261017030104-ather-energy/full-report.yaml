      - number: '4.2'
        title: Unit economics and margin path
        blocks:
          - type: paragraph
            body: >-
              The strongest public underwriting signal is that FY26 improvement was not just a volume story. Ather said
              average revenue realization held at ₹1,21,386 per scooter despite competitive discounting, subsidy
              contribution fell to 3% of revenue, COGS per unit dropped to ₹1,10,199, and adjusted gross margin improved
              to 24% with 21% margin even without incentives. That combination suggests better product mix,
              engineering-led cost reduction, and more resilient pricing than a pure subsidy pass-through business. What
              remains missing is the split between hardware margin, service margin, software margin, and charging
              economics, so the public record supports directional improvement rather than full stream-by-stream unit
              economics.
            claimRefs:
              - CI003
