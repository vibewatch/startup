chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and operating model
        blocks:
          - type: paragraph
            body: >-
              Ather Energy is a Bengaluru-headquartered public EV OEM founded in 2013 by Tarun Mehta and Swapnil Jain.
              The official company narrative is consistent on three elements later chapters can treat as ground truth:
              Ather sells electric two-wheelers, it layers in-house software and charging infrastructure around the
              vehicle, and it positions the portfolio toward the premium end of the market rather than entry-level price
              competition. That strategy now spans performance-led 450 variants and the family-focused Rizta line, with
              management using the EL platform to widen addressable price points without abandoning the integrated
              ecosystem thesis.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO006
      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Founder continuity remains a core diligence positive and a concentration risk. Investor-relations and
              annual-report disclosures still place Tarun Mehta in the CEO seat and Swapnil Jain in the CTO role, so
              product strategy, brand, and technical roadmapping remain tied to the founders. The broader listed-company
              control stack is now more formalized, with Sohil Parekh as CFO and Puja Aggarwal as company secretary and
              compliance officer, while the board had eight directors including three independents at March 31, 2026.
              Governance did change through the IPO year: Niranjan Gupta and Nilesh Shrivastava exited in May 2025, and
              Vivek Anand joined in November 2025, signaling an active post-listing board refresh rather than a static
              pre-IPO structure.
            claimRefs:
              - CO001
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO013
              - CO014
