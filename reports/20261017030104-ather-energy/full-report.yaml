          Improve only after the final instrument mix and issue price show disciplined dilution and clearly productive
          uses of capital.
      - - 'Anti-thesis: current proof is operational, not yet a precise entry-price edge.'
        - >-
          The retained pool shows improving execution and a live financing process, but not a clean public-market
          multiple set or final post-raise ownership math.
        - >-
          Upgrade if exchange disclosures and trading context show the stock is mispriced relative to durable
          unit-economics improvement.
    notes: >-
      The comparable set in this fast-profile chapter is milestone-based rather than a full peer multiple deck: IPO
      history, the authorized follow-on raise, and the contemporaneous EV capital-raising context.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV013
      - CV015
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          The authorized raise closes on disciplined terms, EL-platform and retail expansion convert into profitable
          volume, and software plus non-vehicle revenue keep lifting mix quality.
        - >-
          Public evidence would support rerating from fair to attractive because added capital would be financing
          profitable scale rather than plugging losses.
        - Execution slippage on new platforms, charging uptime, or service quality could still mute the rerating.
        - >-
          Would require post-raise disclosures and follow-on quarters that preserve or improve FY26 gross-margin and
          EBITDA trends.
      - - Base
        - >-
          The raise is strategically useful but not clearly cheap, and operating improvements continue at a slower pace
          while the company remains capital intensive.
        - >-
          This supports a fair valuation stance and a track recommendation: quality is real, but the expected return is
          not yet clearly asymmetric.
        - Dilution, competition, and cost creep can offset the operational progress.
        - >-
          Best fit for the retained pool because it combines strong FY26 proof with unresolved financing and
          price-setting questions.
      - - Bear
        - >-
          Issue pricing is weak, dilution is heavier than expected, or growth re-accelerates without sustaining margin
          gains.
        - >-
          The stock would screen as full-to-expensive because capital would be financing share defense instead of
          durable value creation.
        - Further losses, weak use-of-proceeds discipline, or poor platform execution would deepen downside.
        - >-
          The cautionary financing commentary in the retained pool makes this scenario credible until terms are
          disclosed.
    notes: >-
      The chapter intentionally uses stance-based scenario bands instead of a tight valuation range because the retained
      public pool does not contain a current market-cap, consensus, or peer multiple snapshot.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV013
      - CV016
