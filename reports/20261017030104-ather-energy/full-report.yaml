  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Ather's journey now starts with distinct rider segments, converts through direct retail, and expands through
      service, charging, and software, but thinner-market reach still faces D2C friction.
    data:
      items:
        - label: Enter through premium performance appeal
          stage: Discovery
          touchpoints:
            - Ather 450 line
            - Ather Space / website
          note: Original customer base was built around premium ride experience and connected features.
        - label: Broaden to family and convenience households
          stage: Segment expansion
          touchpoints:
            - Rizta family positioning
            - Household-focused messaging
          note: Rizta became the FY26 volume engine and widened the brand beyond enthusiasts.
        - label: Convert through direct retail and partner-led footprint
          stage: Purchase
          touchpoints:
            - 700 experience centres
            - '>75% of FY26 openings via existing dealer partners'
          note: Ather keeps high control over the buying experience while using partners to accelerate reach.
        - label: Support daily ownership with service and charging
          stage: Usage
          touchpoints:
            - 548 service centres
            - 6,000+ LECCS / neighbourhood chargers
          note: After-sales access is a visible part of the value proposition, not an afterthought.
        - label: Expand wallet share through software and services
          stage: Expansion
          touchpoints:
            - AtherStack Pro Pack
            - Connected diagnostics / services
          note: Independent profiles describe high attachment to paid software, but public renewal data is absent.
        - label: Push into newer regions with visible friction
          stage: Next cohort
          touchpoints:
            - Middle India
            - Nepal / Sri Lanka
            - Tier-2 / tier-3 expansion
          note: >-
            The same direct model that protects the brand can slow penetration where charging and dealer density remain
            thinner.
