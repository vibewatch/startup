      - number: '4.3'
        title: Liquidity, capital needs, and balance-sheet posture
        blocks:
          - type: paragraph
            body: >-
              Funding chronology belongs in Company Overview; for Financials, the relevant question is whether the FY26
              balance sheet reduces or merely postpones financing dependency. The annual report points to a much
              stronger current-asset base after the IPO, including term deposits and investments funded by unutilized
              proceeds, and it shows debt restructuring that moved the company away from higher-cost borrowings. At the
              same time, growth still consumes capital through plant expansion, network build-out, and working capital.
              Positive operating cash flow in FY26 is encouraging, but it was helped by payable expansion, while
              investing cash outflow and public expansion plans imply that self-funded growth has not yet been proven.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is improving but not yet cleanly underwritable. Ather looks materially better than a
              year earlier on volume, margin, cash conversion, and access to capital, which is why the business now
              looks like a scaling public EV OEM rather than a subsidy-dependent startup. Independent commentary still
              flags the same core risk: expansion remains capital intensive, and public disclosures do not yet prove
              repeatable store payback, durable charger utilization, or recurring-software margin at maturity. For
              underwriting, that keeps the company in the zone where the trajectory is investable to watch, but the
              evidence set still falls short of a clean, bottoms-up conviction case.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public liquidity is stronger than public underwritability
            body: >-
              FY26 disclosures make the balance sheet look materially safer after the IPO, but they still do not show
              unrestricted liquidity, store payback, charger utilization, or per-stream margins clearly enough to
              underwrite durable self-funded growth.
            calloutType: risk
            claimRefs:
