      - number: '5.3'
        title: Differentiation is credible, but public proof still trails the roadmap
        blocks:
          - type: paragraph
            body: >-
              Ather's moat story rests on three public signals: an R&D-heavy operating model, a growing patent base, and
              a support footprint that turns software and charging into everyday usage rather than brochure features.
              The FY26 annual report also adds explicit safety and privacy language, including AEBS, skid and fall
              controls, and Digital Personal Data Protection Act alignment for its AI-assisted systems. Those are useful
              signals, but they are still mostly self-described. The assigned pool does not provide independent uptime,
              certification, security-audit, recall, or charger utilization evidence for the post-2025 stack, so
              diligence should treat the controls as plausible design intent rather than fully field-verified proof. The
              biggest product risk is therefore not conceptual weakness; it is execution concentration across EL
              rollout, Factory 3.0 ramp, and supply resilience while the company asks the public market to underwrite a
              more software-defined mobility platform.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated ownership loop is the real product
            body: >-
              The strongest technical signal is not any one scooter specification; it is that Ather keeps vehicles
              software charging and support inside one operating loop, which can compound feature velocity and customer
              lock-in if the installed base keeps growing.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
