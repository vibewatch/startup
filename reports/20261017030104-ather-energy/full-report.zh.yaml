      - number: '8.3'
        title: 情景框架、尽调问题与逻辑击穿触发器
        blocks:
          - type: paragraph
            body: >-
              上行情景取决于 Ather 证明 IPO 后募集的资本能加速分销和平台扩展，而不重置成本基础。基准情景更克制：将公司留在观察名单，假设后续资本有用但并非天然创造价值，并要求网络翻倍、新平台发布后 FY26
              的利润率提升仍能持续。下行情景仍然重要，因为上市电动车制造商即使销量增长，也可能在发行定价弱、稀释重或执行重新转向补贴和折扣驱动增长时摧毁股东价值。在任何升级为买入之前，下一道尽调关口应是最终 QIP
              或同等条款、更新后的市值和倍数背景，以及零售、充电和软件扩张是否继续改善贡献经济性，而非只是在守住份额。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
