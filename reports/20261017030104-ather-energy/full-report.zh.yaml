  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价信号
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Ather 仍主要销售踏板车，但已经不只是卖车。FY26 经营收入随销量大幅增长；官方收入拆分显示车辆销售仍占主导，但非车辆收入已经足以影响利润率组合和客户生命周期价值。官网提供了
              450、Rizta 和 Konarc 系列当前标价，年报却只给出每辆踏板车的混合平均实现收入。因此，投资者能看到标价和总体实现收入，却看不到每个 SKU 与服务组合背后的车型折扣、融资支持或绑定经济性。
