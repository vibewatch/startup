      - number: '1.3'
        title: 融资、规模与公开市场概览
        blocks:
          - type: paragraph
            body: >-
              指定资料池中最清晰的融资事件是 2025 年 5 月 IPO，Ather 因此登陆 NSE 和 BSE，并募资约 ₹2,980 crore。FY26 披露显示业务明显放量：经营收入升至 ₹3,671.76
              crore，售出 262,942 辆车，年末员工数为 3,875 人。客户规模从方向上看大于单纯的车辆销量，官网声称装机基础已有 4,00,000+
              个家庭，但这仍是公司的营销数字，并非按申报口径定义的活跃客户指标。独立媒体也说明后续估值应保持保守：已发布的 2026 年市占率高于官方披露的 FY26 17.1%，一篇分析还明确质疑约 9
              倍销售额倍数能否持续。
