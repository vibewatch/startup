              - CP012
      - number: '3.3'
        title: 规模、服务密度和价格仍偏向传统巨头
        blocks:
          - type: paragraph
            body: >-
              Ather 的生态护城河无法消除传统巨头两项最大的优势：覆盖范围和价格战意愿。Arthnova 明确指出 Ather 受控零售和充电模式资本密集，Founderpin 则称 TVS 和 Bajaj
              同时拥有更高零售份额、更厚资本和更大的经销商网络。年报也显示，Ather 自身扩张已是合作伙伴驱动、轻资产，而非全部自营；因此护城河的一部分是运营打法，而不是字面意义上拥有每个触点。下一处战场是 ₹1 lakh
              以下及二、三线城市细分。MeraEV 报道称 EL 平台就是为直接竞争 TVS iQube、Bajaj Chetak 和 Hero Vida 而设计；如果成功，Ather
              能补上最明显的产品线空缺，但若传统巨头加剧价格竞争，或在 Ather 优势区域之外以服务能力压过 Ather，当前的高端优势可能迅速收窄。
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河真实存在，但有条件，并非永久
        blocks:
          - type: paragraph
            body: >-
              证据支持这样一个持久但有条件的判断：Ather
              的竞争地位确实存在。最难复制的并非某一个功能，而是强势高端品牌、付费软件使用、密集的充电与服务触点，以及在价格下降时仍试图保住软件经济性的产品路线。最容易遭到攻击的是护城河外圈：逐城定价、经销商触达和在低密度地区实现盈利覆盖的能力。因此，正确的观察角度不是“Ather
              对某一个对手”，而是 Ather 能否把生态深度转化为更广市场覆盖，且速度快于 TVS、Bajaj、Hero 和既有体系消除所有权体验差距的速度。
            claimRefs:
              - CP003
              - CP005
              - CP008
              - CP011
              - CP012
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 买家难以复制的部分
            body: Ather 最难守住的优势不是某一个踏板车功能，而是付费软件、充电触达和受控所有权旅程的组合。
            calloutType: strength
            claimRefs:
              - CP003
              - CP004
              - CP005
          - type: callout
            title: 可能压缩护城河的因素
            body: 如果 TVS、Bajaj 和 Hero 依靠更大网络和更激进的定价缩小所有权体验差距，即使 Ather 产品仍有差异化，其高端领先也会收窄。
            calloutType: risk
            claimRefs:
