  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据支持这样一条链路：单位需求转化为踏板车综合收入，再到生态搭载和利润率改善，但再投资负担仍然很重。
    data:
      nodes:
        - id: units
          label: 需求转化为踏板车销量
          detail: FY26 售出 262,942 辆。
        - id: vehicle-revenue
          label: 车辆销售构成核心收入基础
          detail: 成品销售达到 ₹3,207.99 crore。
        - id: ecosystem
          label: 软件和生态搭载增加第二收入来源
          detail: 非车辆收入为 ₹480.02 crore，AtherStack 搭载率为 91%。
        - id: gross-margin
          label: 组合改善和降本推高毛利率
          detail: 调整后毛利率达到 24%；剔除激励后的毛利率达到 21%。
        - id: ebitda
          label: 经营杠杆收窄 EBITDA 亏损
          detail: FY26 EBITDA 利润率改善至 (7%)。
        - id: cash-and-capex
          label: 现金创造在改善，但仍要支撑重投入
          detail: 经营现金流为 ₹31.89 crore，而 FY26 资本开支和无形资产投入为 ₹506.07 crore。
      edges:
        - from: units
          to: vehicle-revenue
          label: 销量增长推动实际销售
        - from: vehicle-revenue
          to: ecosystem
          label: 在用车辆基础支撑搭载和服务
        - from: ecosystem
          to: gross-margin
          label: 更高毛利的组合支撑综合盈利能力
        - from: gross-margin
          to: ebitda
          label: 成本纪律和规模收窄亏损
        - from: ebitda
          to: cash-and-capex
          label: 经营改善仍不足以支撑完全自筹扩张
    approximationNotes: 这张桥接图是概念性的，不是算术关系，因为公开报告将多条收入流合并披露，也没有给出完整的利润率瀑布。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI007
      - CI008
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Ather 的护城河取决于面向车主的 SKU 如何建立在共享的软件、充电、支持和制造层之上，而不是取决于某一款踏板车。
    data:
      layers:
        - label: 客户触点
          detail: 当前入口覆盖性能型骑手、家庭用户、充电接入和配件。
          modules:
            - Ather 450 系列 — 高性能踏板车产品线
            - Ather Rizta 系列 — 面向家庭的踏板车产品线
            - Ather Halo — 连接骑行体验的配件触点
          outputs:
            - 覆盖多个骑手画像的共享车主闭环
        - label: 车辆平台
          detail: 450 是在售基础，EL 则是下一产品周期可复用的架构。
          modules:
            - EL 平台 — 共享底盘、动力总成和电子系统
            - Ather Charge Drive Controller — 集成充电器和电机控制器路径
            - Rizta 与 450 升级路径 — 支持 OTA 的存量车主延续
          outputs:
            - 声称装配速度提升 15%，定期服务速度最高提升 2 倍
        - label: 软件与智能
          detail: AtherStack 是连接踏板车、云端、应用和联网服务的内部链路。
          modules:
            - AtherStack 7.0 — 自然语言语音界面
            - 警报与控制 — 胎压提示、Pothole Alerts、Crash Alerts、ParkSafe、LockSafe
            - Ather Intelligence Fabric — 产品、企业和员工智能层
          outputs:
            - 覆盖存量车辆的当日 OTA 功能迭代速度
        - label: 充电与支持
          detail: 充电服务和零售被作为部署基础设施建设，而不是附加项。
          modules:
            - Ather Grid — 6,000+ 个充电点
          outputs:
            - 充电器发现和应用引导的补能行为
        - label: 零售与服务
          detail: 合作伙伴驱动的线下部署，让软件和充电叙事在规模化下真正可用。
          modules:
            - 服务网络 — FY26 有 548 个服务中心
            - 体验中心形态 — 旗舰型、中型和紧凑型
            - 合作伙伴驱动的运营模式 — 通过零售合作伙伴扩张
          outputs:
            - 维护接入、培训一致性和地域扩张
        - label: 制造与控制
          detail: 路线图把风险集中在工厂爬坡、安全验证、隐私控制和零部件韧性上。
          modules:
            - Factory 3.0 — Chhatrapati Sambhajinagar 一期扩建
            - 安全控制 — AEBS、SkidControl、FallSafe、Emergency Stop Signal
            - 控制纪律 — 符合 DPDP 的隐私实践，以及电池或稀土材料的灵活性
          outputs:
            - 更多流程内制，但执行风险集中在爬坡期
    approximationNotes: null
    claimRefs:
      - CE005
      - CE006
      - CE008
      - CE010
      - CE013
      - CE016
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Ather 的旅程如今从不同骑手群体开始，通过直营零售转化，再靠服务、充电和软件扩张；但在市场更薄的地区，D2C 触达仍有摩擦。
    data:
      items:
        - label: 以高性能吸引用户进入
          stage: 发现
          touchpoints:
            - Ather 450 产品线
            - Ather Space / 网站
          note: 最初的客户基础建立在高端骑行体验和联网功能之上。
        - label: 拓展至家庭与便利型用户
          stage: 客群扩张
          touchpoints:
            - Rizta 家庭定位
            - 面向家庭的信息传递
          note: Rizta 成为 FY26 的销量引擎，让品牌走出发烧友圈层。
        - label: 通过直营零售和合作伙伴网络完成购买
          stage: 购买
          touchpoints:
            - 700 家体验中心
            - '>75% 的 FY26 新店由现有经销商伙伴开设'
          note: Ather 对购买体验保持较高控制，同时借助合作伙伴加快触达。
        - label: 以服务和充电支撑日常使用
          stage: 使用
          touchpoints:
            - 548 个服务中心
            - 6,000+ 个 LECCS / 社区充电器
          note: 售后接入是价值主张中显眼的一部分，并非事后补充。
        - label: 通过软件和服务提升钱包份额
          stage: 扩张
          touchpoints:
            - AtherStack Pro Pack
            - 联网诊断 / 服务
          note: 独立画像显示付费软件搭载率较高，但公开续费数据缺失。
        - label: 带着明显摩擦进入新区域
          stage: 下一批用户
          touchpoints:
            - 印度中部
            - 尼泊尔 / 斯里兰卡
            - 二线 / 三线城市扩张
          note: 同一套保护品牌的直营模式，在充电设施和经销商密度更薄的地区，可能放慢渗透。
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU013
      - CU014
