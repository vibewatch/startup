chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与运营模式
        blocks:
          - type: paragraph
            body: >-
              Ather Energy 是一家总部位于班加罗尔的上市电动车 OEM，2013 年由 Tarun Mehta 和 Swapnil Jain 创立。官方叙事在三点上保持一致，后续章节可以将其作为事实基础：Ather
              销售电动两轮车；围绕车辆叠加自研软件和充电基础设施；产品定位偏向市场高端，而非参与入门级价格竞争。如今，这套策略覆盖性能导向的 450 系列和面向家庭的 Rizta 产品线。管理层借助 EL
              平台拓宽可触达的价格区间，但没有放弃一体化生态的逻辑。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO006
      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              创始人延续既是尽调中的核心加分项，也是集中度风险。投资者关系和年报披露仍显示 Tarun Mehta 任 CEO、Swapnil Jain 任
              CTO，因此产品战略、品牌和技术路线仍与创始人绑定。上市公司控制体系已更正式：Sohil Parekh 任 CFO，Puja Aggarwal 任公司秘书和合规官；截至 2026 年 3 月 31 日，董事会有
              8 名董事，其中 3 名为独立董事。IPO 年度治理结构也发生变化：Niranjan Gupta 和 Nilesh Shrivastava 于 2025 年 5 月离任，Vivek Anand 于 2025 年
              11 月加入，说明上市后的董事会正在更新，而非沿用静态的 IPO 前结构。
            claimRefs:
              - CO001
              - CO013
              - CO014
              - CO015
