      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 观察，不买入
            body: Ather 的经营证明已足以进入主动尽调，但留存的公开证据仍指向对价格敏感的观察姿态，而不是立即高确信度买入。
