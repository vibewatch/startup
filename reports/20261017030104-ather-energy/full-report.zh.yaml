            body: >-
              融资时间线归入公司概览；财务部分真正要问的是，FY26 资产负债表降低了融资依赖，还是只是推迟了它。年报显示 IPO
              后流动资产基础明显增强，包括用未使用募资支持的定期存款和投资；债务重组也让公司摆脱了较高成本借款。同时，扩建工厂、建设网络和增加营运资金仍会消耗资本。FY26
              经营现金流为正令人鼓舞，但其中受应付款增长帮助；投资现金流出和公开扩张计划则意味着自筹增长尚未得到证明。
