  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：高端电动踏板车加所有权生态
        blocks:
          - type: paragraph
            body: >-
              公开证据支持将 Ather
              的市场定义为印度电动两轮车，加上降低采用摩擦的所有权层，而不只是踏板车硬件。公司材料反复把踏板车、充电、软件、配件和服务打包，这一点具有分析意义：充电可得性和联网功能是采用决策的一部分，而不是事后附加项。在更广义的电动出行边界内，Ather
              仍没有进攻整个两轮车市场。当前价格、产品标签和第三方评论都指向两个服务细分：高端性能通勤者，以及家庭或大众高端家庭；Rizta 扩大了早期爱好者之外的覆盖面，但没有把 Ather 带到入门级价格带。
            claimRefs:
              - CM001
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
