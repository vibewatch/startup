      - number: '4.2'
        title: 单位经济性与利润率路径
        blocks:
          - type: paragraph
            body: >-
              最强的公开投资判断信号是，FY26 的改善并非只有销量故事。Ather 称尽管竞争激烈、存在折扣，每辆踏板车的平均实现收入仍为 ₹1,21,386；补贴贡献降至收入的 3%，单位 COGS 降至
              ₹1,10,199，调整后毛利率升至 24%，即使没有激励也有 21%
              的利润率。这种组合说明产品组合改善、工程驱动的降本和定价韧性都强于单纯依赖补贴传导的业务。缺失之处在于硬件、服务、软件和充电经济性的利润拆分，因此公开记录只能支持方向性改善，尚不足以还原完整的分项单位经济性。
