              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: 规模测算视角：公开采用率口径不一，尚无清晰的公开 SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              公开记录足以证明印度 E2W 市场正在扩大，但不同口径彼此重叠，并未形成一套对账后的 TAM/SAM/SOM。Ather FY26 年报引用 FY26 的 E2W 零售量为 0.14 crore、两轮车渗透率为
              6.6%，并预计 FY30 达到 0.60-0.62 crore 辆和 22-25% 渗透率。FY25 AGM 报告采用踏板车专属分母，称 FY25 踏板车电动化已达 16%，FY31 可能达到
              70-75%；DRHP 则采用更宽的 FY31 全部两轮车口径。这些官方预测主要差异来自时间范围或分母。FounderPin 声称 2026 年渗透率已超过 25%，与 6.6%
              的数字直接冲突且没有披露方法，因此排除在基准情景之外。按价格带、城市层级和预算决策者拆分的 Ather 自下而上公开 SOM 也仍缺失。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM014
              - CM015
      - number: '2.3'
        title: 买家与预算路径：细分逻辑比经审计的买家组合数据更清楚
        blocks:
          - type: paragraph
            body: >-
              买家细分比支出细分更清楚。450 系列仍定位为高端性能购买，Rizta 则明确面向家庭使用，意味着其购买路径偏向家庭实用，而非只服务发烧友。Ather 的 FY26
              评论还称，共享出行平台、零工劳动者和希望降低运营成本的配送车队正在助推品类增长，因此新增 E2W
              需求并非纯粹来自富裕城市零售。问题在于，公开来源没有按车型或地域披露自费家庭、家庭融资、车队和渠道驱动需求的实际组合。因此，这张买家地图有助于理解采用逻辑，却不足以支撑精确的预算决策者收入桥接。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: 驱动因素与约束：消费升级有利，但竞争仍限制确定性
        blocks:
          - type: paragraph
            body: >-
              最有说服力的需求侧驱动是，E2W 采用已不再只是补贴套利。官方和独立来源都描述了一个由消费升级、更好的所有权体验、充电便利和软件深度拉动的市场，这直接契合 Ather
              的产品架构。如果接入点和服务密度跟得上，Ather FY26 的区域扩张和印度中部占比上升说明这套逻辑可以走出南部基地。反向因素同样真实：Business Standard
              明确称该品类接近拐点、尚未越过拐点，并将上行空间与成本平价、政策支持和生态质量挂钩，同时仍提示竞争和供应风险。因此，即使市场在增长，Ather 仍暴露于执行风险。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合不止 EV 同行
        blocks:
          - type: paragraph
            body: >-
              Ather 竞争的并不只是其他风险投资支持的踏板车品牌。留存证据显示，竞争格局分层明显：TVS、Bajaj 等传统巨头已在 FY26 零售销量中领先；Hero Vida 借助 Hero MotoCorp
              更大的体系快速增长；Ola 仍是波动较大的 EV 优先对手；汽油踏板车的既有格局也很重要，因为许多买家仍以首付价格和普遍可加油性为锚。Moneycontrol 称 Ather 仍占高端电动踏板车细分约
              70%，但这一高端细分嵌在更大的市场里，TVS 和 Bajaj 已拥有更大规模。实际情况是，Ather 买家往往同时在三条路径中选择：软件驱动的高端 EV、服务网络更密的传统品牌 EV，或完全不从 ICE 切换。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP010
