      - number: '1.4'
        title: 里程碑、扩张标志与未决事项
        blocks:
          - type: paragraph
            body: >-
              指定资料池中的里程碑顺序连贯：Ather 于 2013 年成立，2024 年 4 月推出 Rizta、走出原有性能细分市场，2025 年 5 月上市，2025 年 8 月发布 EL 平台，并在 FY26 将
              Rizta 扩展至尼泊尔和斯里兰卡，同时累计产量突破 500,000 辆。相较之下，里程碑周边的融资和所有权历史并不完整。工作资料池无法从交易所文件中清晰对账 IPO
              前私募轮、二级流动性、当前自由流通股以及战略持有人集中度。就尽调而言，公开证据足以确认公司身份和经营规模，但本章资料池不足以把股权结构表和估值基础视为完全确定。
