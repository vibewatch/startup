  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 运营证据足够强，可以继续把 Ather 视为可投资标的，但融资条款不确定性让建议停留在跟踪，而不是买入。
    data:
      nodes:
        - id: proof
          label: 运营证据
          detail: FY26 收入 ₹3,671.76 crore；亏损收窄至 ₹517.17 crore。
          tone: positive
        - id: scale
          label: 规模和份额
          detail: 2,62,942 辆车、FY26 份额 17.1%，以及 700 家体验中心。
          tone: positive
        - id: mix
          label: 更好的收入组合
          detail: 调整后毛利率 24%、EBITDA 利润率 -7%、非车辆收入占比 13%、软件搭载率 91%。
          tone: positive
        - id: capital
          label: 新增资本路径
          detail: 董事会批准最多 ₹2,500 crore；首批融资已宣布为 ₹1,200 crore。
          tone: neutral
        - id: pricing
          label: 对价格的敏感性
          detail: 发行价、稀释、现金消耗和资金用途仍是决定性因素。
          tone: risk
        - id: outcome
          label: 建议
          detail: 跟踪 / 中等置信度 / 高风险 / 公允估值立场。
          tone: neutral
      edges:
        - from: proof
          to: scale
          label: 更好的运营证据
        - from: scale
          to: mix
          label: 支撑利润率可信度
        - from: mix
          to: capital
          label: 形成可投资兴趣
        - from: capital
          to: pricing
          label: 但融资条款仍然重要
        - from: pricing
          to: outcome
          label: 因此保持价格纪律
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV013
