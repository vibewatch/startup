          note: 关于软件、充电和品牌化车主体验的保留证据最深，但覆盖范围仍落后于头部在位者。
        - label: TVS iQube
          x: 2
          'y': 5
          note: FY26 份额领先者，拥有在位者规模，但指定材料池中的专有生态证据较少。
        - label: Bajaj Chetak
          x: 2
          'y': 5
          note: 在位者拥有较大的覆盖和份额，优势集合更偏传统经销商驱动。
        - label: Hero Vida
          x: 3
          'y': 4
          note: 由在位者支持的快速增长 EV，也出现在 LECCS 连接器家族中。
        - label: Ola S1
          x: 2
          'y': 2
          note: 仍因历史销量保持相关性，但材料池中的独立来源强调服务和执行的波动性。
        - label: ICE 踏板车 / 现状
          x: 1
          'y': 5
          note: 默认替代方案，熟悉度和加油密度无人能比，但没有可比的软件驱动 EV 体系。
    approximationNotes: 点位分数是基于指定来源包的序数判断，不是实测坐标，也不是推算出的转化率。
    claimRefs:
