  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 已授权融资以克制的条款完成，EL 平台和零售扩张转化为盈利规模，软件及非车辆收入继续提升收入组合质量。
        - 公开证据将支持估值从公允重估至有吸引力，因为新增资本会用于融资实现盈利规模，而不是填补亏损。
        - 新平台执行延误、充电可用率或服务质量问题，仍可能压低重估幅度。
        - 需要融资后披露和后续季度数据继续保持或改善 FY26 毛利率与 EBITDA 趋势。
      - - 基准
        - 融资在战略上有用但不算明显便宜，经营改善以较慢速度持续，同时公司仍然资本密集。
        - 这支持公允估值立场和跟踪建议：质量真实存在，但预期回报还没有形成清晰的不对称性。
        - 稀释、竞争和成本攀升可能抵消运营进展。
        - 这是保留材料池最匹配的情景，因为它同时反映了强劲的 FY26 证据，以及尚未解决的融资和定价问题。
      - - 悲观
        - 发行定价疲弱、稀释幅度高于预期，或增长重新加速但无法维持利润率改善。
        - 股价会显得估值充足甚至昂贵，因为资本是在为守住份额输血，而不是创造持久价值。
        - 进一步亏损、资金用途缺乏纪律或平台执行不佳，都会加深下行风险。
        - 保留材料池中的融资警示评论使这一情景具备可信度，至少在条款披露前如此。
    notes: 本章有意采用基于立场的情景区间，而不是给出紧凑的估值范围，因为保留的公开材料池没有当前市值、市场共识或同行估值倍数快照。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV013
      - CV016
