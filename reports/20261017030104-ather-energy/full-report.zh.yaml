              在扩建制造、充电、软件和分销的同时仍在亏损并消耗现金，因此需求、补贴支持或执行出现任何偏差，都可能推迟盈亏平衡并迫使公司继续依赖融资。第二类是执行和供应链风险：Ather
              已披露稀土磁体供应中断造成的量化收入损失，同时正在爬坡一座新的马哈拉施特拉邦工厂，其经济性取决于高销量下仍能守住产品质量和服务标准。第三类是生态风险：合作伙伴驱动的体验中心增长、保险相邻业务执行和都市圈外扩张，都要求外部合作方在不稀释
