      - number: '8.2'
        title: 为什么逻辑在改善，但还不能说明显错价
        blocks:
          - type: paragraph
            body: >-
              这套逻辑可投资的部分不是抽象的 EV 需求，而是 Ather 能否把分销扩张、软件绑定和充电网络深度转化为更好的单位经济性。FY26 收入达到 ₹3,671.76
              crore，亏损收窄超过三分之一，调整后毛利率达到 24%；非车辆收入加上 91% 的 AtherStack Pro 绑定率，说明公司正在构建比纯硬件 OEM
              更有防守力的收入组合。反向逻辑同样清晰：新增资本通常只有在以有纪律的条款筹得、并投向盈利增长时才有帮助。留存资料显示已批准 ₹2,500 crore
              融资路径、首期已启动，以及投资者对稀释、现金消耗和募资用途的明确担忧。因此更合理的是持平的估值姿态：执行在改善，业务值得关注，但在最终融资经济性和募资后的经营轨迹更清楚前，证据不支持追高。
            claimRefs:
              - CV003
