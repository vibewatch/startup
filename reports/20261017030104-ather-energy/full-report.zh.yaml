      - 当前证据
      - 哪些变化会改变判断
    rows:
      - - 论点：规模开始转化为更好的经济性。
        - FY26 收入达到 ₹3,671.76 crore，亏损收窄至 ₹517.17 crore，调整后毛利率升至 24%，EBITDA 利润率改善至 -7%。
        - 如果融资后披露和后续季度数据显示，规模扩大时利润率增幅仍能守住，则上调判断。
      - - 论点：生态深度可以支撑溢价 EV 护城河。
        - Ather 报告 AtherStack Pro 搭载率为 91%、非车辆收入占比为 13%，更广泛的生态还包括规模可观的充电和体验中心基础设施。
        - 如果经常性收入和服务经济性持续提升，同时客户满意度和定价纪律不受损，则上调判断。
      - - 反论点：新增资本能为增长输血，但也会稀释股东。
        - 董事会批准最多 ₹2,500 crore 的融资；估值导向的报道认为，定价、稀释、现金消耗和资金用途仍是最关键的问题。
        - 只有最终融资工具组合和发行价显示稀释受控、资金用途确实能产生产出后，判断才会改善。
      - - 反论点：当前证据证明的是运营改善，还不是精准的入场价格优势。
        - 保留的材料池显示执行在改善、融资流程正在推进，但没有干净的公开市场估值倍数集合，也没有最终的融资后持股结构计算。
        - 如果交易所披露和交易背景显示，股价相对于可持续的单位经济性改善存在错价，则上调判断。
    notes: 这份快速画像章节的可比集合按里程碑构建，而不是完整的同行估值倍数材料包：包括 IPO 历史、已授权的后续融资，以及同期 EV 融资背景。
