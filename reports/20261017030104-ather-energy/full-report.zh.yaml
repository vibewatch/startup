      - number: '3.2'
        title: Ather 的护城河在生态深度，而不只是踏板车参数
        blocks:
          - type: paragraph
            body: >-
              证据中最强的共同模式是：Ather 将硬件、软件、充电和服务打包成一套所有权系统。FY26 年报称 Ather 自研车辆、软件、充电基础设施和核心技术，并披露 6,000+ 个充电点、700 个
              Experience Centres、548 个服务中心以及 91% 的 AtherStack Pro 绑定率。这不是只靠钣金竞争的品牌。独立文章也得出相同结论：Strategy Story 将 Ather
              描述为垂直一体化的出行生态，Arthnova 则认为公司早期胜出靠的是掌控客户旅程，而非把旅程外包给传统经销商层。充电标准的证据也具有竞争意义：LECCS 让 Ather 与 Hero Vida
              使用同一连接器家族，而 Ola 和 River 仍采用其他标准，这界定了互操作性改善的范围，也显示锁定仍在哪里存在。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP009
