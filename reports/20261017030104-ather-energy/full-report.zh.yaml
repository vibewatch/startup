        title: 建议与决策姿态
        blocks:
          - type: paragraph
            body: >-
              经营逻辑比一年前更强：Ather FY26 售出 2,62,942 辆车，全国市占率升至 17.1%，零售网络翻倍至 700 个体验中心，毛利率和 EBITDA
              利润率也明显改善。这些证明点足以让公司留在投资观察名单，而不是把它视为由补贴驱动的 EV 故事。但估值决策如今离不开融资纪律，因为公司既批准了 ₹2,500 crore 募资，也已经启动 ₹1,200 crore
              首期。公开证据说明业务质量正在改善，但在看到最终发行条款、稀释计算以及新资金是否投向增厚利润率的规模，而不是又一轮昂贵的抢份额之前，还不足以支持对新增资本作出投资判断。
