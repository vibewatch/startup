          detail: "Track / medium confidence / high risk / fair valuation stance."
          tone: neutral
      edges:
        - from: proof
          to: scale
          label: "Better operating evidence"
        - from: scale
          to: mix
          label: "Supports margin credibility"
        - from: mix
          to: capital
          label: "Creates investable interest"
        - from: capital
          to: pricing
          label: "But financing terms still matter"
        - from: pricing
          to: outcome
          label: "So stay price disciplined"
    claimRefs: [CV003, CV005, CV006, CV007, CV008, CV010, CV011, CV013]
callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: >-
      Ather now has enough operating proof to stay in active diligence, but the retained public
      evidence still points to a price-sensitive track stance rather than immediate conviction buying.
    claimRefs: [CV003, CV005, CV006, CV007, CV010, CV013]
  - calloutType: risk
    title: The financing terms are the gating variable
    body: >-
      The most decision-relevant missing fact is not whether Ather can raise money, but at what
      pricing, dilution, and use-of-proceeds discipline the capital is ultimately raised.
    claimRefs: [CV010, CV011, CV013]
