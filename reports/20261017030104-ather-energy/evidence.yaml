evidenceGaps:
  - type: missing-source
    severity: material
    topic: lifetime-capital-raised
    missingEvidence: >-
      A reconciled funding ledger covering private rounds, IPO fresh issue, OFS, and any founder or investor
      secondaries.
    whyItMatters: Funding history and dilution context affect ownership, exit overhang, and later valuation framing.
    diligencePath: >-
      Pull the offer documents and the latest exchange shareholding pattern from investor-relations filings, then
      reconcile primary versus secondary proceeds.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-share
    missingEvidence: A single canonical FY26 market-share definition with source methodology.
    whyItMatters: Current-market positioning is central to the growth narrative and later competitor benchmarking.
    diligencePath: >-
      Reconcile annual-report disclosures against exchange, SIAM, or Vahan-based datasets and restate the denominator
      explicitly.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: stakeholder-and-leadership-coverage-TO002-TO003
    missingEvidence: >-
      A clean post-IPO shareholder and free-float table showing strategic holders, public float, and promoter-linked
      ownership.
    whyItMatters: Control, liquidity, and overhang risk matter for governance assessment and public-market valuation.
    diligencePath: >-
      Review the latest exchange shareholding pattern and any lockup disclosures, then map them into the stakeholder
      table.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: debt-and-credit
    missingEvidence: A current debt, venture-debt, or credit-facility summary tied to balance-sheet obligations after the IPO.
    whyItMatters: Even modest leverage can affect plant-ramp flexibility and downside protection.
    diligencePath: >-
      Use the offer documents and annual financial notes to isolate borrowings, repayments, and any remaining secured
      facilities.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: ather-sam-som
    missingEvidence: >-
      Bottom-up demand by price band, city tier, and buyer type that isolates Ather's realistic served market rather
      than only category TAM.
    whyItMatters: >-
      The public record shows category growth clearly, but valuation work still needs a cleaner bridge from national E2W
      adoption to Ather's actual reachable volume and pricing envelope.
    diligencePath: >-
      Request management or sell-side materials that break the E2W market into premium, mass-premium, and entry-level
      price bands by geography, then map Ather's current and planned products to those bands.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-owners
    missingEvidence: Model-level split of retail cash, financed household, fleet, and channel-led purchases by region.
    whyItMatters: >-
      Buyer logic is visible in product framing, but budget ownership determines adoption elasticity, financing
      dependence, and how durable demand is if subsidies or discounting change.
    diligencePath: >-
      Obtain management disclosures or channel checks on model mix by financing source, fleet exposure, and repeat
      versus first-time EV buyers.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: charging-economics
    missingEvidence: >-
      Geography-level charger utilization, store payback, and contribution margin data for expansion outside mature
      Southern corridors.
    whyItMatters: >-
      Distribution and charging density are central to the bullish adoption case, but without local economics it is hard
      to judge how repeatable that playbook is in lower-density regions.
    diligencePath: >-
      Ask for internal cohort data on new-store maturation, charger utilization, and contribution margins by geography
      and city tier.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: conflicting-data
    severity: material
    topic: market-penetration-conflict
    missingEvidence: >-
      A regulator- or VAHAN-derived FY26 E2W penetration series with an explicit numerator, denominator, period, and
      treatment of registrations versus retail sales.
    whyItMatters: >-
      The low-reputation claim of more than 25% penetration is irreconcilable with the annual report's 6.6% figure and
      would materially change both category maturity and valuation assumptions if true.
    diligencePath: >-
      Rebuild FY26 penetration from monthly VAHAN registrations and SIAM total two-wheeler sales, documenting excluded
      states and vehicle classes before using either percentage.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: city-level-competitor-pricing
    missingEvidence: >-
      Verified 2026 city-level effective prices, finance bundles, and dealer discounts for TVS iQube, Bajaj Chetak, Hero
      Vida, and Ola S1 against Ather's current list prices.
    whyItMatters: >-
      Without verified realized pricing, the chapter can assess Ather's strategic gap but cannot quantify how hard
      incumbents are already competing at the point of sale.
    diligencePath: >-
      Collect current OEM pricing pages or dealer quotes for the same cities and reconcile them against Ather's official
      list prices and financing packages.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: actual-switching-costs
    missingEvidence: >-
      Cohort retention, repeat purchase, and charger-usage data that show whether Ather's ecosystem meaningfully reduces
      churn versus competing brands.
    whyItMatters: >-
      The retained evidence supports likely lock-in mechanisms, but it does not prove their realized effect on buyer
      retention or multi-homing behavior.
    diligencePath: >-
      Request internal retention cohorts, subscription renewal rates, and charger-utilization or app-engagement data
      segmented by product family and market.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: blocking
    topic: sales-efficiency
    missingEvidence: Channel-level CAC, lead conversion, store payback, and cohort payback by city or format.
    whyItMatters: >-
      Without those metrics, the chapter cannot underwrite whether Ather's distribution expansion is creating attractive
      incremental returns.
    diligencePath: >-
      Request board or lender materials showing store-opening cohorts, paid marketing efficiency, and channel conversion
      by region.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: stream-margins
    missingEvidence: >-
      Gross margin and contribution margin split across vehicle hardware, software subscriptions, charging, service, and
      accessories.
    whyItMatters: >-
      Aggregate gross margin improvement can hide weaker economics in important streams, especially if software or
      charging economics differ materially from hardware.
    diligencePath: Request segment-style management reporting or a bridge from gross margin to contribution margin by revenue stream.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: utilization-and-ramp
    missingEvidence: >-
      Ather Grid utilization, service-center utilization, and Maharashtra plant ramp assumptions versus current
      throughput.
    whyItMatters: >-
      Capital adequacy depends on whether recent fixed investments are filling fast enough to support margin expansion
      and cash generation.
    diligencePath: Request monthly utilization dashboards for chargers, workshops, and new plant lines with maturity cohorts.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public engineering repos package metrics practitioner-forum traffic or partner-developer documentation showing
      external engagement with AtherStack or Ather Grid.
    whyItMatters: >-
      The chapter brief explicitly asks for a developer-signal or practitioner proxy, and the assigned pool does not
      supply one, so the software moat is still being judged mostly through company and investor narratives.
    diligencePath: >-
      Request public engineering talks integration-partner documentation or community metrics that show real third-party
      usage of the software or charging stack.
    relatedQuestionRefs:
      - QE005
  - type: missing-source
    severity: material
    topic: reliability-proof
    missingEvidence: >-
      Independent uptime certification recall complaint or security-audit evidence for EL AtherStack and Ather Grid
      after the 2025 launch cycle.
    whyItMatters: >-
      Current trust and safety claims are mostly official disclosures or launch coverage, so diligence cannot yet
      separate marketed controls from field-proven reliability and compliance.
    diligencePath: >-
      Collect homologation or certification filings charger-status evidence complaint databases and third-party audit
      results before underwriting the control narrative.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: minor
    topic: post-launch-operating-metrics
    missingEvidence: >-
      Cohort-level data on AtherStack attachment renewal charger utilization service turnaround and warranty performance
      after EL-related launches.
    whyItMatters: >-
      The roadmap thesis depends on better serviceability and software-led ownership economics, but the assigned sources
      do not quantify whether the field data supports those benefits.
    diligencePath: >-
      Request city-level charger uptime and utilization dashboards software attach and renewal cohorts service
      turnaround reports and warranty claim trends.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: missing-source
    severity: material
    topic: customer-retention
    missingEvidence: Cohort-level renewal, repeat-purchase, churn, GRR, NRR, and software retention data by model and geography.
    whyItMatters: >-
      Ather's expansion thesis depends on lifetime value and ownership durability, but public evidence proves growth
      more clearly than retention.
    diligencePath: >-
      Request model-cohort retention tables covering active vehicles, repeat purchase, software renewal, and service
      retention by launch quarter.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: concentration-and-channel-economics
    missingEvidence: >-
      Regional revenue mix, store-level payback, same-store productivity, partner concentration, and geography-level
      contribution margins.
    whyItMatters: >-
      The partner-led D2C rollout is central to expansion, but the public record does not show whether newer markets are
      as efficient or durable as the core footprint.
    diligencePath: >-
      Request experience-centre cohort economics, partner concentration, and regional profitability disclosures for
      South India versus Middle India and newer markets.
    relatedQuestionRefs:
      - QU006
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      Fresh named customer references, user interviews, or third-party review cohorts tied to specific Ather buyer
      segments.
    whyItMatters: >-
      The strongest public proof is mostly cohort-level and company-framed, so the named customer table uses proxy
      cohorts rather than a current named roster.
    diligencePath: >-
      Collect recent buyer interviews, independent review cohorts, dealership conversion case studies, or
      marketplace-style owner feedback segmented by model.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: insurance-adjacency
    missingEvidence: First-year economics, partner list, attach-rate assumptions, and compliance controls for Ather Insurance Limited.
