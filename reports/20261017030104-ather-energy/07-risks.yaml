      - Current status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - EV subsidy and affordability reset
        - India / FAME and successor incentive design
        - Reduced FAME support already raised prices and hurt sales
        - High
        - High
        - Premium positioning and ecosystem stickiness offer some pricing power
        - Demand can still soften before cost structure fully scales
        - Reconcile 2026 state and central subsidy changes against current ASPs and order conversion
      - - Insurance corporate-agent expansion
        - India / IRDAI corporate-agent regulations
        - Approved on 15 Oct 2026, but revenue model and launch detail remain undisclosed
        - Medium
        - Medium
        - Regulatory approval and partner-carrier model reduce greenfield licensing risk
        - Economics, conduct obligations, and channel mix are still opaque
        - Obtain first-year product mix, carrier partners, commission structure, and compliance controls
      - - Safety, import, and environmental rule changes
        - India / battery safety, import, tax, and environmental frameworks
        - The assigned evidence does not establish current incident or cost exposure; external commentary flags a live cost and demand variable
        - Medium
        - High
        - Vertical integration and localization effort improve response speed
        - Rule changes can still move BOM cost and pricing faster than Ather can absorb
        - Track AIS/BIS battery-safety updates, localization requirements, and any import-duty changes
    notes: >-
      Partial register based on retained public evidence only; it ranks the live policy
      and compliance issues visible in the assigned source pool, not an exhaustive legal docket.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly retained October 2026 evidence on subsidy policy, insurance licensing,
        and compliance-rule exposure relevant to Ather's Indian EV business model.
    claimRefs: [CR011, CR012, CR013, CR016]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Current evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Rare-earth and critical-component disruption
        - Q2 FY26 magnet-export restrictions caused a ₹24.52 crore revenue impact
        - Medium
        - High
        - Medium
        - Ather can recover faster than peers, but revenue is still exposed to upstream shocks
        - Current single-source or country concentration by component is not publicly broken out
      - - Factory 3.0 quality and throughput ramp
        - Bidkin phase 1 adds 5 lakh units of annual capacity, and external commentary flags quality-at-scale risk
        - Medium
        - High
        - Medium
        - Delays or quality slippage would pressure brand trust and fixed-cost absorption
        - Public evidence does not show line-yield, scrap, or launch-ramp milestones by quarter
      - - Secondary-city charging and service execution
        - Pure DTC expansion is costly, while charging gaps outside metros still constrain adoption
        - High
        - Medium
        - Low
        - The model may need hybrid partner formats that dilute consistency
        - No public store-level payback or charger-utilization disclosure
    notes: >-
      Severity reflects observed operating impact where available; "security" remains folded
      into software, charging, and service execution because the assigned pool did not retain
      a verified standalone cyber-incident source.
    claimRefs: [CR004, CR005, CR006, CR007, CR009, CR010, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / ecosystem
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Retail footprint expansion
        - Existing dealer partners
        - Open and operate new Experience Centres
        - More than 75% of FY26 openings came from existing dealer partners
        - Partner execution slows rollout or weakens service consistency
        - High
        - Standardized formats and existing-partner repeat investment
        - Ather still depends on partner capital and operating discipline for speed
      - - Insurance adjacency
        - Insurance carriers and servicing partners
        - Underwrite and service EV-focused insurance through Ather Insurance
        - Product set and earnings contribution are still undisclosed
        - Approval exists but economics disappoint or conduct obligations add friction
        - Medium
        - IRDAI approval plus a partner-led model lower underwriting-capital burden
        - Counterparty economics and customer-attach assumptions remain unproven
      - - Financing runway
        - Equity, debt, and public-market funding sources
        - Offset operating cash burn during scale-up
        - FY25 financing inflows roughly matched operating cash outflows in retained coverage
        - Capital-market access tightens before the business reaches self-funded scale
        - High
        - IPO access and improving gross-margin narrative support fundraising optionality
        - The model still depends on external capital if losses persist
      - - Critical component sourcing
        - Magnet, cell, and electronics suppliers
        - Feed core vehicle and battery systems
        - Q2 FY26 already showed quantified revenue impact from supply disruption
        - Supplier or export shocks interrupt output or force higher-cost substitutions
        - High
        - Vertical integration plus diversified sourcing and chemistry optionality
        - Upstream concentration can still hit revenue before mitigation catches up
    notes: >-
      This register treats dealer, carrier, and capital-provider reliance as distinct
      dependencies because each can fail even if scooter demand remains intact.
    claimRefs: [CR002, CR008, CR012, CR013, CR014, CR016]
