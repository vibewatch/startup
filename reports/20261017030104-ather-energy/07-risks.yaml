callouts:
  - calloutType: risk
    title: Capital burn remains the fastest thesis-break trigger
    body: >-
      Persistent losses, negative operating cash flow, and explicit management guidance
      that expansion spending may continue mean the investment case is still sensitive
      to financing conditions, not just vehicle demand.
    claimRefs: [CR001, CR002, CR003, CR014]
  - calloutType: insight
    title: Mitigation exists, but it is mostly executional rather than structural
    body: >-
      Vertical integration, diversified sourcing, and repeat partner expansion can
      soften supply and rollout shocks, yet they do not remove exposure to subsidies,
      component bottlenecks, or service-consistency risk as the footprint widens.
    claimRefs: [CR005, CR008, CR010, CR016]
  - calloutType: recommendation
    title: Best monitor set before a fresh underwriting decision
    body: >-
      Track quarterly operating cash flow, Bidkin ramp milestones, service and charging
      coverage outside metros, and first-year disclosure on Ather Insurance's partners
      and earnings contribution; each is concrete enough to tighten or loosen the risk case.
    claimRefs: [CR006, CR010, CR013, CR014, CR015]
