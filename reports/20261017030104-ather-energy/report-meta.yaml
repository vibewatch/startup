companyProfile:
  summary: >-
    Ather Energy is a Bengaluru-based listed public EV OEM founded in 2013 by Tarun Mehta and Swapnil Jain. It sells
    premium electric two-wheelers and wraps them in a vertically integrated ownership stack that includes software,
    charging, service, accessories, and connected features. FY26 showed a more scaled business than the prior year, with
    stronger revenue, higher volume, better margins, and a broader customer mix that now includes family-focused buyers
    alongside the original performance segment.
