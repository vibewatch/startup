      - number: '1.2'
        title: Founding Leadership and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              ZaiNar was co-founded by Chief Executive Officer Daniel Jacker, a serial technology entrepreneur
              overseeing commercialization and corporate financing, and Chief Technology Officer Philip Kratz, Ph.D.,
              who developed the foundational signal-processing algorithms. The executive team's technical architecture
              centers on achieving sub-nanosecond phase synchronization across standard radio signals, translating
              constant wave propagation into sub-meter spatial coordinates. Governance and strategic oversight feature
              prominent deeptech and telecommunications figures, most notably venture capitalist Steve Jurvetson, who
              serves on the boards of both ZaiNar and SpaceX. Advisory relationships include former Yahoo chief
              executive Jerry Yang, former Amazon chief scientist Andreas Weigend, Siri co-founder Tom Gruber, and
              former Nokia chief technology officer Nishant Batra, providing unusual governance depth for an early
              commercialization venture.
