      - number: '5.2'
        title: SRS-based architecture shifts compute and control into the network
        blocks:
          - type: paragraph
            body: >-
              The 5G implementation is described as a network-side alternative to dedicated Positioning Reference
              Signals. ZaiNar says it reads Sounding Reference Signals that devices transmit for connectivity, with SRS
              occurring 100 to 500 times per second versus roughly once per second for the positioning approach
              discussed in its launch materials. This makes the radio access network, timing layer, and coordinate
              solver central dependencies rather than the tracked endpoint. The company separately reports operation on
              narrow spectrum and a demonstration on CBRS Band 48 with 20 MHz. Academic evidence supports the underlying
              caution: phase- and time-based indoor localization can be sensitive to multipath, frequency offset, noise,
              calibration, and synchronization quality. Public sources do not disclose the exact baseband interface,
              calibration process, data architecture, or controls required to reproduce ZaiNar's results.
