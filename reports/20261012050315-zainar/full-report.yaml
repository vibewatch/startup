  - id: FU001
    title: ZaiNar Customer Journey Map & Land-and-Expand Adoption Cycle
    type: journey-map
    summary: >-
      Six-stage enterprise customer adoption lifecycle detailing technical evaluation, pilot deployment, enterprise
      rollout, and secondary spatial data monetization.
    data:
      items:
        - label: 1. Network Qualification
          description: >-
            Technical assessment of existing carrier or private 5G/Wi-Fi wireless infrastructure to verify
            synchronization readiness on 10 to 20 MHz spectrum.
          touchpoints: Radio frequency audit, base station firmware compatibility check, spectrum qualification
        - label: 2. Paid Proof-of-Concept Pilot
          description: >-
            Initial single-facility deployment demonstrating sub-meter 3D tracking of hospital equipment, jobsite
            workers, or warehouse assets.
          touchpoints: Software-defined radio configuration, anchor-free calibration, baseline accuracy benchmarking
        - label: 3. Single-Site Production License
          description: >-
            Operational deployment across a primary commercial facility with real-time location integration into
            enterprise asset management platforms.
          touchpoints: Core network software installation, enterprise API integration, SLA verification
        - label: 4. Multi-Facility Enterprise Expansion
          description: >-
            Horizontal rollout across regional logistics hubs, factory campuses, or healthcare networks without
            incremental sensor hardware.
          touchpoints: Master services agreement execution, multi-site license scaling, systems integrator handover
        - label: 5. Carrier-Scale Ecosystem Distribution
          description: >-
            Tier-1 telecommunications carriers bundling ZaiNar network-side positioning into enterprise private cellular
            offerings.
          touchpoints: Carrier core network deployment, joint go-to-market packaging, telecom billing integration
        - label: 6. Environmental Memory Data Monetization
          description: >-
            Secondary monetization loop licensing aggregated historical spatial telemetry to train Physical AI models
            and coordinate robot swarms.
          touchpoints: Spatial API access, robotics simulator training feeds, digital twin data subscriptions
    approximationNotes: >-
      Adoption phases and operational touchpoints modeled from company go-to-market commentary, analyst profiles, and
      executive interviews as of October 2026. Conversion rates between phases are not publicly reported.
