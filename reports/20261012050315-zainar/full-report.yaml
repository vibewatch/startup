      - number: '5.3'
        title: Commercial claims are ahead of referenceable deployment proof
        blocks:
          - type: paragraph
            body: >-
              ZaiNar announced commercial availability of its 5G positioning technology on February 27, 2026 and says it
              is deployed across healthcare, construction, smart-city, logistics, and industrial settings on multiple
              continents. However, the retained sources provide no named carrier, named production customer, uptime
              history, installation duration, support model, or renewal evidence. Integration is also a material
              dependency: one secondary source describes a plan to embed the technology into carrier firmware and
              enterprise software stacks and expose data through APIs, while the company news index later lists an Arm
              Total Design announcement and a Tokyo expansion program. Those events indicate ecosystem activity, not
              proof that a repeatable carrier integration or enterprise rollout is complete. Diligence should focus on a
              reproducible deployment runbook, required network privileges, compatibility by radio vendor, and measured
              reliability under congestion and non-line-of-sight conditions.
            claimRefs:
