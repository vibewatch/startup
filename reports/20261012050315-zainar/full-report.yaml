              - CE008
              - CE009
              - CE012
      - number: '5.4'
        title: Infrastructure reuse is the wedge; validation and governance are the risks
        blocks:
          - type: paragraph
            body: >-
              The differentiation thesis is credible at the architectural level: reusing connectivity signals could
              reduce endpoint changes and dedicated sensor infrastructure, while central location context may support
              fleet coordination beyond a single robot's local perception. ZaiNar also says it has filed more than 100
              patents and received 90 grants, but the retained record does not independently map those patents to the
              marketed performance. The most important technical caveat is validation. The official launch page states a
              2+ kilometer range, while a syndicated version of the same company announcement states up to 1.5
              kilometers; neither is an independent benchmark. A separate public-record review found no technical white
              paper, third-party accuracy audit, or detailed live-deployment case study. Security and privacy are
              equally material because indoor localization research identifies spoofing, jamming, signal blockage,
              multipath, and unauthorized tracking as operational threats. ZaiNar's retained public materials do not
              specify authentication, consent, retention, encryption, audit, or incident-response controls.
            claimRefs:
              - CE004
              - CE005
              - CE009
              - CE010
              - CE013
