        title: Exhibits
        blocks:
          - type: callout
            title: Backlog Quality & Commercial Verification Gap
            body: >-
              While ZaiNar promotes a headline contract and MOU pipeline exceeding $450 million to $500 million, the
              absence of named commercial customers, disclosed revenue run rates, or public separation of binding
              purchase orders from non-binding letters of intent presents a significant diligence hurdle for growth
              underwriters.
            calloutType: risk
            claimRefs:
              - CU005
              - CU008
