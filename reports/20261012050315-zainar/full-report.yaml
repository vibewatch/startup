        blocks:
          - type: paragraph
            body: >-
              The company's capitalization history exhibits significant divergence across primary announcements and
              third-party venture tracking databases. While ZaiNar's February 2026 emergence release cited more than
              $100 million in cumulative investment and a $1 billion valuation, venture tracking databases such as
              Silicon Valley Investment Club record up to $211.7 million raised across six distinct financings,
              including seed rounds led by Alchemist Accelerator in 2018 and an $11.7 million Series A in 2021.
              Capitalization table participants include institutional deeptech funds Future Ventures and AME Cloud
