  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: A network-side location layer for physical operations
        blocks:
          - type: paragraph
            body: >-
              ZaiNar sells a positioning and spatial-awareness layer rather than a new tracking device. Its stated
              workflow begins with signals already emitted by connected phones, robots, vehicles, and IoT equipment; the
              network processes those signals and exposes location context to carrier or enterprise systems. The company
              says this avoids application installs, dedicated positioning hardware, and incremental tracked-device
              battery consumption. Public materials divide the offer into 5G positioning, Wi-Fi-based sensing described
              as Zero, asset tracking, and a broader Physical AI coordination layer. That definition is coherent for
              carrier, private-network, industrial, healthcare, construction, and logistics workflows, but the retained
              evidence does not establish packaging, service levels, deployment effort, or production outcomes for named
              users. Product maturity should therefore be read as commercial availability claimed by the company, not as
              independently verified scale.
