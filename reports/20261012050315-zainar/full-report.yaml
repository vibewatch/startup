      - number: '6.3'
        title: Named Accounts & Ecosystem Verification
        blocks:
          - type: paragraph
            body: >-
              Publicly verified organizational traction for ZaiNar is anchored in government market-entry initiatives
              and semiconductor ecosystem collaborations rather than named commercial enterprise customers. In April
              2026, the Tokyo Metropolitan Government selected ZaiNar for its Green Transformation foreign market-entry
              support program, establishing a municipal foothold in Japan dense manufacturing and private 5G robotics
              ecosystem. In September 2026, ZaiNar joined the Arm Total Design ecosystem to bring real-time location
              awareness to Arm-based robotics silicon architectures. To bolster carrier relationships, former Nokia
              Chief Strategy and Technology Officer Nishant Batra joined as an advisor. Crucially, as of August 2026,
              ZaiNar has published zero named commercial enterprise customer case studies, leaving production adoption
              across hospital wards and construction sites uncorroborated by external customer references.
            claimRefs:
              - CU003
              - CU004
