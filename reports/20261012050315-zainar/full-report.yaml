  - id: TV002
    title: Investment Thesis and Anti-Thesis
    columns:
      - pillar
      - thesis_view
      - anti_thesis_view
      - invalidation_trigger
    rows:
      - - Technology & IP
        - >-
          Sub-nanosecond synchronization of standard SRS signals turns existing 5G networks into sub-meter spatial
          sensors without new hardware
        - >-
          Real-world multipath reflection, carrier spectrum constraints, and environmental noise may degrade accuracy
          below commercial SLA requirements
        - >-
          Independent technical audit showing inability to sustain sub-meter accuracy in non-line-of-sight enterprise
          deployments
      - - Commercial Pipeline
        - >-
          Reported $450M to $500M+ in contracts and MOUs across logistics, construction, and healthcare demonstrates
          massive market pull
        - >-
          Pipelines dominated by non-binding MOUs and unpaid trials often fail to convert into recurring software
          revenue
        - Inability to announce named Fortune 500 enterprise or Tier-1 carrier commercial rollouts within 12 months
      - - Business Model & Margin
        - Protocol-agnostic software delivery enables pure-play SaaS gross margins exceeding 75% at carrier scale
        - >-
          Field deployment, RF calibration, and custom systems integration could burden economics with low-margin
          professional services
        - Audited gross margins falling below 50% due to ongoing on-site engineering requirements
      - - Regulatory & Privacy
        - >-
          Network-side processing bypasses mobile OS permissions and provides critical terrestrial PNT resilience
          against GPS jamming
        - >-
          Expanding FTC and global privacy enforcement against persistent device tracking threatens commercialization
          and data rights
        - Regulatory determination that network-level SRS positioning requires affirmative individual device opt-in
    notes: >-
      Structured investment thesis and anti-thesis evaluation across technical wedge, pipeline conversion, unit
      economics, and data compliance.
