      - number: '2.3'
        title: Buyer Segmentation, Workflow Economics, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Adoption of ZaiNar's positioning technology is distributed across distinct enterprise buyer segments with
              divergent workflow bottlenecks, economic justifications, and budget owners [CM006]. In healthcare
              environments, hospital operations executives and biomedical engineering leads face acute equipment
              utilization challenges, where nurses and clinical staff routinely lose 20% to 30% of their working shift
              searching for mobile medical devices such as IV pumps, telemetry monitors, and wheelchairs [CM006, CM007].
              Here, real-time location feeds deliver immediate labor productivity ROI and capital preservation by
              reducing redundant device procurement [CM007]. In heavy construction and infrastructure, general
              contractors and risk managers deploy location tracking for dynamic perimeter safety, preventing fatal
              worker collisions with heavy machinery in dynamic environments where optical cameras suffer dust
              obstruction [CM006]. In autonomous fulfillment logistics and smart manufacturing, fleet operators
              coordinate autonomous mobile robots (AMRs) using shared network positioning coordinates, offloading heavy
              localization compute from battery-constrained vehicles to the network [CM006, CM014]. Across all segments,
              enterprise buyers benefit from budget consolidation, allowing Chief Information Officers and operations
              leaders to absorb tracking requirements directly into enterprise 5G and IT connectivity capital budgets
              rather than managing siloed vendor contracts [CM010].
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM014
      - number: '2.4'
        title: Adoption Drivers, Carrier Bottlenecks, and Structural Constraints
        blocks:
          - type: paragraph
            body: >-
              The primary macro driver propelling network-side spatial intelligence is the rapid commercial
              proliferation of autonomous machines, robotics, and Physical AI systems that require precise spatial
              awareness to coordinate in shared human environments [CM014]. In September 2026, ZaiNar deepened this
              ecosystem alignment by joining Arm Total Design, integrating its location awareness algorithms directly
              into silicon partner architectures for next-generation edge robotics [CM014]. Nevertheless, the market
              faces significant structural and commercial adoption constraints [CM008, CM012]. On public wide-area
              cellular networks, mobile operating system gatekeepers—predominantly Apple and Google—enforce strict
              security policies that deny carrier access to device positioning reference signals (PRS and PSRS) by
              default, granting access only for mandated E911 emergency services [CM008]. This restriction has
              historically prevented telecommunications operators from monetizing high-accuracy location services on
              consumer handsets [CM008]. ZaiNar's SRS-based architectural workaround bypasses device operating system
              control by computing position from standard uplink connectivity signals, but market expansion remains
              constrained by private spectrum availability [CM008, CM009]. While ZaiNar reports functioning on as little
              as 10 MHz of bandwidth in private cellular networks, enterprise deployment velocity depends on carrier
              private 5G sales cycles and regulatory spectrum approvals across global jurisdictions [CM012].
            claimRefs:
              - CM008
              - CM009
              - CM012
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Budget Consolidation Wedge in Private Wireless
            body: >-
              By computing centimeter-level positioning from ambient uplink connectivity signals on the network side,
              enterprise buyers can eliminate dedicated UWB anchor hardware and proprietary tag infrastructure,
              consolidating separate RTLS and cellular network budgets into a unified private wireless deployment.
