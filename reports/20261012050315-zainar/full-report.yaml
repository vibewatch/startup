              - CV004
              - CV010
              - CV011
      - number: '8.2'
        title: Financing History and Cap Table Discipline
        blocks:
          - type: paragraph
            body: >-
              Public financing records for ZaiNar reflect substantial ambiguity regarding round structure and cumulative
              paid-in capital. Media reports and aggregators report a February 2026 capital raise of more than $100M
              that marked the company's valuation above $1B. However, public databases categorize this transaction
              alternately as an expanded Series A, a Series B, or generalized venture funding, with total lifetime
              capital raised cited variously as $100M, $118M, or $211.7M. Earlier filings indicate an August/September
              2021 Series A raising $11.71M at a post-money valuation of $579.37M, implying an unusually high valuation
              markup for an early venture round and an estimated ~2% dilution. The estimated 10% dilution in the 2026
              transaction suggests tight insider control, yet without access to the Delaware charter or liquidation
              preferences, investors cannot ascertain senior liquidity overhangs. Entry at the headline $1B mark without
              visibility into operating burn or trailing billings exposes new capital to severe down-round risk.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: Scenario Valuation and Public Market Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Valuing ZaiNar requires benchmarking its physical AI positioning proposition against public positioning,
              navigation, and timing peers. NextNav provides the closest public comparable as a specialized PNT operator
              utilizing terrestrial spectrum and network infrastructure, holding a market capitalization of
              approximately $2.08B in October 2026. While NextNav demonstrates multi-billion-dollar investor appetite
              for resilient PNT architectures, public multiples demand strict operational milestones. Under our bull
              case, ZaiNar converts 40% of its reported backlog into recurring high-margin network software licensing,
              achieving $75M ARR and justifying a $1.8B valuation. In our base case, carrier deployments encounter
              elongated qualification cycles, resulting in $25M in hybrid software and services revenue and a fair
              valuation mark of $500M to $600M. In the bear scenario, enterprise sales stall amid integration complexity
              and carrier inertia, dragging ARR below $10M and precipitating a severe down-round reset toward $200M.
            claimRefs:
              - CV003
              - CV005
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV011
              - CV012
      - number: '8.4'
        title: Regulatory Context, Downside Triggers, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              While geopolitical GPS jamming and spoofing create strategic tailwinds for terrestrial radio positioning
              alternatives, commercial location intelligence faces aggressive regulatory headwinds. Enforcement actions
              by the Federal Trade Commission, including orders prohibiting InMarket Media from monetizing precise
              consumer location histories without unambiguous affirmative consent, underscore the compliance friction
              inherent in network-side telemetry. Although ZaiNar emphasizes that its SRS architecture processes signals
              at the network edge rather than extracting handset sensor data, carrier partners will subject enterprise
              tracking platforms to stringent data governance audits. Before participating in secondary liquidity or
              future equity rounds, diligence must verify three critical gates: an audited breakdown of binding ARR
              versus non-binding MOUs, customer references from commercial deployments, and confirmation of partner
              gross margins.
            claimRefs:
              - CV004
              - CV010
              - CV011
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV010
              - CV011
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting Discipline on ZaiNar's $1B+ Post-Money Mark
            body: >-
              While ZaiNar's physical AI narrative and patented sub-nanosecond SRS timing demonstrate a compelling
              technical wedge, the public record lacks verified customer names, revenue run-rate, and
              contract-versus-MOU breakdowns for its reported $450M-$500M+ pipeline. Investors should maintain a
              research-more stance until binding revenue conversion and margin mix are audited.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV011
