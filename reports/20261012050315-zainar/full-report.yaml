  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Taxonomy and Severity Hierarchy
        blocks:
          - type: paragraph
            body: >-
              Underwriting ZaiNar's emerging Physical AI platform requires evaluating a complex hierarchy of technical,
              commercial, legal, and operational vulnerabilities. While ZaiNar claims its network-side RF positioning
              eliminates dedicated beacons, tags, and satellites by synchronizing wireless signals to sub-nanosecond
              precision, the venture's risk profile remains elevated across several dimensions. The foremost risk center
              is the unverified composition of its reported commercial pipeline: commercial commitments totaling over
              $450 million remain heavily weighted toward non-binding memoranda of understanding rather than
              non-cancellable recurring software licenses. Furthermore, the company's reliance on telecommunications
              carriers for enterprise distribution creates acute channel concentration, while entrenched networking
              incumbents possess formidable balance sheets and enterprise sales moats. Residual exposure is compounded
              by a total absence of third-party performance benchmarks under harsh industrial multipath interference,
              leaving early commercial deployments vulnerable to performance shortfalls.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
