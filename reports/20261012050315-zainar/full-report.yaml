  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Model
        blocks:
          - type: paragraph
            body: >-
              ZaiNar operates as a physical artificial intelligence infrastructure provider, converting ambient wireless
              networks into high-precision spatial awareness systems without requiring proprietary hardware or
              device-level modifications. The company pursues a dual commercial monetization strategy that bridges
              telecommunications carrier networks and enterprise facility deployments. In carrier environments, ZaiNar
              monetizes software-defined positioning utility, allowing telecom operators to offer centimeter-level
              real-time location services directly across existing 5G infrastructure. In enterprise and industrial
              settings, the platform provides subscription-based spatial sensing for asset tracking, worker safety, and
              autonomous robotics coordination. Public filings and venture disclosures describe ZaiNar's revenue model
              as a hybrid software-and-services framework. While the company announced in February 2026 that it had
              secured between $450 million and $500 million in commercial contracts and memoranda of understanding,
              detailed revenue recognition policies, contract duration schedules, and realized billings figures remain
              private.
