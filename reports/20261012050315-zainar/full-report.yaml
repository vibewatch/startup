chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Stealth Evolution
        blocks:
          - type: paragraph
            body: >-
              ZaiNar, Inc. is a venture-backed physical artificial intelligence and spatial intelligence infrastructure
              startup incorporated in Delaware in 2017 and headquartered in Belmont, California. After operating for
              nearly nine years in deep research-and-development stealth, the company publicly emerged in February 2026
              announcing a commercial platform that repurposes standard cellular and wireless networks into real-time
              sensing infrastructure. Rather than requiring dedicated hardware tags, optical cameras, or orbital
              satellite constellations, ZaiNar computes high-precision three-dimensional location on the network side by
              tracking radio-frequency signals of opportunity. The company simultaneously announced a headline
              post-money valuation exceeding $1 billion on over $100 million in cumulative invested capital, positioning
              itself as foundational infrastructure for autonomous robotics, industrial logistics, healthcare asset
              tracking, and defense applications where conventional GPS signals cannot penetrate.
            claimRefs:
              - CO001
              - CO002
              - CO003
