      - number: '6.2'
        title: Adoption Trajectory & Contract Pipeline Quality
        blocks:
          - type: paragraph
            body: >-
              ZaiNar emerged from stealth in early 2026 announcing over $450 million in commercial contracts and
              memoranda of understanding, with subsequent aggregator estimates tracking pipeline figures above $500
              million. The company reports active commercial deployments across healthcare, construction, and logistics
              operations on multiple continents. However, from a diligence perspective, the underlying backlog quality
              remains opaque: public disclosures provide no audited separation between legally binding commercial
              purchase contracts and exploratory, non-binding memoranda of understanding. Furthermore, ZaiNar discloses
              no annual recurring revenue, net revenue retention rates, customer logo counts, or cohort renewal metrics,
              preventing independent verification of whether initial paid trials successfully convert into durable
              recurring software subscriptions or experience post-pilot attrition.
            claimRefs:
