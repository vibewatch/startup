    title: Product architecture map
    type: stack
    summary: >-
      An evidence-bounded view of how existing network signals could become enterprise spatial context, with disclosed
      product layers separated from inferred interfaces.
    data:
      layers:
        - label: Connected phones, robots, vehicles, and IoT devices
          detail: >-
            Endpoints emit ordinary connectivity signals; ZaiNar says no client software or dedicated positioning
            hardware is required.
        - label: Existing 5G or Wi-Fi infrastructure
          detail: Carrier, private-network, or enterprise wireless infrastructure supplies the radio observations.
        - label: SRS / Wi-Fi observation interface
          detail: The 5G materials identify uplink SRS; the exact Wi-Fi and radio-vendor interfaces are not disclosed.
        - label: Timing and position computation
          detail: >-
            The company attributes precision to sub-nanosecond synchronization; calibration and multipath methods are
            not public.
        - label: Shared spatial context
