  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Relative evaluation of positioning technologies across deployment hardware overhead and spatial precision update
      rate.
    data:
      points:
        - label: ZaiNar (Network-native SRS)
          x: 2
          'y': 9
          detail: >-
            Network-side SRS processing eliminates device hardware while delivering high-frequency centimeter
            positioning.
        - label: NextNav (Terrestrial PNT)
          x: 6.5
          'y': 7
          detail: >-
            Requires dedicated terrestrial beacon infrastructure to deliver vertical z-axis and metropolitan
            geolocation.
        - label: Cisco Spaces (Wi-Fi / BLE)
          x: 3
          'y': 3.5
          detail: Leverages installed enterprise Wi-Fi but restricted to coarse room/zone level accuracy and low update rates.
        - label: Qualcomm & 3GPP Rel-18
          x: 4
          'y': 6
          detail: >-
            Standardized cellular positioning advancing toward sub-meter accuracy but constrained by PRS duty cycle and
            OS permissions.
        - label: Zebra / Ubisense (UWB RTLS)
          x: 9
          'y': 8.5
          detail: High precision industrial tracking requiring costly dedicated cabling, anchors, and active device tags.
        - label: GNSS / GPS Status Quo
          x: 5
          'y': 4
          detail: Global outdoor standard with zero indoor penetration, vulnerability to jamming, and slow 1 Hz update rate.
    approximationNotes: >-
      Scores represent ordinal positioning on a 1–10 scale based on reported infrastructure requirements (X-axis, lower
      is less hardware overhead) and positioning accuracy and update capability (Y-axis, higher is superior precision
      and frequency).
    claimRefs:
      - CP002
      - CP003
      - CP005
      - CP007
      - CP009
      - CP011
