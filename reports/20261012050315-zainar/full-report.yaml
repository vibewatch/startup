      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The range claim is not stable across the launch record
            body: >-
              ZaiNar's official page reports 2+ km, while a syndicated version of the company announcement reports up to
              1.5 km. Until a dated test protocol explains configuration, terrain, confidence interval, and endpoint
              conditions, the chapter treats both as unverified company claims rather than a single reconciled
              specification.
            calloutType: risk
            claimRefs:
              - CE004
              - CE005
          - type: callout
            title: Gate technical conviction on a reproducible acceptance test
            body: >-
              Require a carrier- or customer-witnessed test covering accuracy distribution, update rate, latency,
              coverage edge, congestion, non-line-of-sight behavior, spoofing and jamming response, privacy controls,
              and failover before underwriting the product as production-grade infrastructure.
            calloutType: recommendation
