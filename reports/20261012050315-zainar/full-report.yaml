      - number: '1.4'
        title: Commercial Milestones and Expansion Trajectory
        blocks:
          - type: paragraph
            body: >-
              Following its stealth emergence, ZaiNar accelerated commercialization announcements throughout 2026 across
              standard-setting bodies, international markets, and hardware partnerships. In late February 2026, the
              company launched its commercial 5G positioning capability, demonstrating sub-10cm location tracking on
              Band 48 CBRS networks without client-side software modifications by analyzing Sounding Reference Signals
              (SRS) rather than mobile operating system-restricted Positioning Reference Signals (PRS). International
              expansion followed in April 2026 with the establishment of a Tokyo corporate office following selection by
              the Tokyo Metropolitan Government for its Green Transformation Innovation Program. In September 2026,
              ZaiNar joined the Arm Total Design ecosystem to embed network spatial awareness into Physical AI
              semiconductor reference architectures, reinforced by a patent portfolio of over 90 issued patents with
              zero reported patent office rejections.
