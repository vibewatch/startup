      - number: '4.2'
        title: Pricing Architecture and Channel Economics
        blocks:
          - type: paragraph
            body: >-
              ZaiNar's commercial go-to-market motion relies on channel partnerships with telecom carriers, systems
              integrators, and industrial private network operators rather than a purely direct sales force. The
              platform is designed to operate on bandwidth-constrained private 5G and low-power IoT networks using as
              little as 10 MHz of spectrum, where precision location capabilities often command higher economic value
              than standard packet transport. By eliminating the need for dedicated tracking beacons or specialized
              tags, ZaiNar offers enterprise customers substantial capital expenditure avoidance. However, this
              software-centric approach contends with competitive price deflation in incumbent hardware markets, where
              standard ultra-wideband tags have fallen below fifty euros per unit. In the broader real-time location
              system market, software revenue is expanding rapidly at nearly twenty-five percent annually, yet ZaiNar's
              list pricing, realized contract discounts, and multi-year commitment terms remain undisclosed in public
              records.
            claimRefs:
