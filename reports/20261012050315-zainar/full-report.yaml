  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Economic Buyers
        blocks:
          - type: paragraph
            body: >-
              ZaiNar go-to-market architecture targets three primary commercial segments: tier-1 mobile network
              operators, enterprise private cellular networks, and large-scale industrial operations across healthcare,
              construction, and warehousing. In carrier architectures, the economic buyer is typically the head of
              network strategy or wholesale infrastructure, seeking to monetize existing 5G capital expenditures through
              premium enterprise positioning APIs. In private 5G and industrial deployments, economic buyers include
              plant IT directors, warehouse general managers, and hospital clinical engineering leaders. By extracting
              location telemetry directly from uplink Sounding Reference Signals rather than relying on handset
              operating system permissions, ZaiNar repositions location awareness as a network utility, theoretically
              shifting distribution leverage toward carrier partners and systems integrators while reducing procurement
              friction associated with dedicated beacon hardware.
            claimRefs:
              - CU001
              - CU009
              - CU010
              - CU014
