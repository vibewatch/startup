    - type: "missing-source"
      severity: "material"
      topic: "independent-validation"
      missingEvidence: "A dated independent benchmark with accuracy distribution, range, update rate, latency, topology, spectrum, line-of-sight conditions, and confidence intervals."
      whyItMatters: "Company-reported point claims cannot establish repeatable performance or reconcile the 1.5 kilometer and 2+ kilometer range statements."
      diligencePath: "Obtain a carrier- or customer-witnessed acceptance report and raw test protocol, then reproduce the test in a representative production environment."
      relatedQuestionRefs:
