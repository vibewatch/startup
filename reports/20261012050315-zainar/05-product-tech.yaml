    - type: "missing-source"
      severity: "material"
      topic: "developer-signal"
      missingEvidence: "A public repository, SDK, API documentation, package, release history, practitioner forum, engineering talk, or integration-partner implementation post."
      whyItMatters: "Without a developer or practitioner surface, implementation maturity, integration friction, and external technical adoption cannot be tested from public evidence."
      diligencePath: "Request SDK and API documentation, sandbox access, release notes, integration references, and engineering contacts; verify one implementation with a carrier or enterprise practitioner."
      relatedQuestionRefs:
        - "QE009"
    - type: "private-evidence-only"
      severity: "material"
      topic: "integration-dependencies"
      missingEvidence: "Radio-vendor compatibility, required baseband or firmware access, supported network topology, deployment runbook, and support responsibility."
      whyItMatters: "The software-only value proposition depends on practical access to carrier or enterprise network layers that are not documented publicly."
      diligencePath: "Review architecture and security documentation under NDA and interview the radio-vendor or carrier team responsible for one production deployment."
