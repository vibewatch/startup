company:
  name: "ZaiNar"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "ZaiNar's product is a network-side positioning layer that uses existing 5G and Wi-Fi signals to produce spatial data without software on tracked devices or dedicated positioning hardware. The public record explains the SRS-based mechanism and current product framing, but performance remains company-reported, the disclosed range is inconsistent across versions of the launch material, and security controls, integrations, and developer adoption are not publicly evidenced."
sections:
  - id: "product-and-workflow"
    title: "A network-side location layer for physical operations"
    body: "ZaiNar sells a positioning and spatial-awareness layer rather than a new tracking device. Its stated workflow begins with signals already emitted by connected phones, robots, vehicles, and IoT equipment; the network processes those signals and exposes location context to carrier or enterprise systems. The company says this avoids application installs, dedicated positioning hardware, and incremental tracked-device battery consumption. Public materials divide the offer into 5G positioning, Wi-Fi-based sensing described as Zero, asset tracking, and a broader Physical AI coordination layer. That definition is coherent for carrier, private-network, industrial, healthcare, construction, and logistics workflows, but the retained evidence does not establish packaging, service levels, deployment effort, or production outcomes for named users. Product maturity should therefore be read as commercial availability claimed by the company, not as independently verified scale."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE006"
      - "CE007"
      - "CE014"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-dependencies"
    title: "SRS-based architecture shifts compute and control into the network"
    body: "The 5G implementation is described as a network-side alternative to dedicated Positioning Reference Signals. ZaiNar says it reads Sounding Reference Signals that devices transmit for connectivity, with SRS occurring 100 to 500 times per second versus roughly once per second for the positioning approach discussed in its launch materials. This makes the radio access network, timing layer, and coordinate solver central dependencies rather than the tracked endpoint. The company separately reports operation on narrow spectrum and a demonstration on CBRS Band 48 with 20 MHz. Academic evidence supports the underlying caution: phase- and time-based indoor localization can be sensitive to multipath, frequency offset, noise, calibration, and synchronization quality. Public sources do not disclose the exact baseband interface, calibration process, data architecture, or controls required to reproduce ZaiNar's results."
    claimRefs:
      - "CE003"
      - "CE011"
      - "CE012"
      - "CE016"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "maturity-integration-and-roadmap"
    title: "Commercial claims are ahead of referenceable deployment proof"
    body: "ZaiNar announced commercial availability of its 5G positioning technology on February 27, 2026 and says it is deployed across healthcare, construction, smart-city, logistics, and industrial settings on multiple continents. However, the retained sources provide no named carrier, named production customer, uptime history, installation duration, support model, or renewal evidence. Integration is also a material dependency: one secondary source describes a plan to embed the technology into carrier firmware and enterprise software stacks and expose data through APIs, while the company news index later lists an Arm Total Design announcement and a Tokyo expansion program. Those events indicate ecosystem activity, not proof that a repeatable carrier integration or enterprise rollout is complete. Diligence should focus on a reproducible deployment runbook, required network privileges, compatibility by radio vendor, and measured reliability under congestion and non-line-of-sight conditions."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE012"
  - id: "differentiation-trust-and-evidence"
    title: "Infrastructure reuse is the wedge; validation and governance are the risks"
    body: "The differentiation thesis is credible at the architectural level: reusing connectivity signals could reduce endpoint changes and dedicated sensor infrastructure, while central location context may support fleet coordination beyond a single robot's local perception. ZaiNar also says it has filed more than 100 patents and received 90 grants, but the retained record does not independently map those patents to the marketed performance. The most important technical caveat is validation. The official launch page states a 2+ kilometer range, while a syndicated version of the same company announcement states up to 1.5 kilometers; neither is an independent benchmark. A separate public-record review found no technical white paper, third-party accuracy audit, or detailed live-deployment case study. Security and privacy are equally material because indoor localization research identifies spoofing, jamming, signal blockage, multipath, and unauthorized tracking as operational threats. ZaiNar's retained public materials do not specify authentication, consent, retention, encryption, audit, or incident-response controls."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE009"
      - "CE010"
      - "CE013"
      - "CE015"
