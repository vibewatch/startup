company:
  name: ZaiNar
chapter:
  number: 6
  title: Customers
  summary: >-
    ZaiNar positions its network-side positioning software as a hardware-free sensing utility for telecom carriers,
    private 5G networks, and industrial enterprises, citing a reported $450M-plus contract and MOU pipeline across
    healthcare, construction, and robotics. However, commercial adoption remains unverified by public named reference
    customers, disclosed ARR, or audited conversion rates, and hospital/industrial deployments face technical and
    privacy constraints.
sections:
  - id: customer-segmentation-and-target-buyers
    title: Customer Base Segmentation & Economic Buyers
    claimRefs:
      - CU001
      - CU009
      - CU010
      - CU014
    tableRefs:
      - TU001
    body: >-
      ZaiNar go-to-market architecture targets three primary commercial segments: tier-1 mobile network operators,
      enterprise private cellular networks, and large-scale industrial operations across healthcare, construction, and
      warehousing. In carrier architectures, the economic buyer is typically the head of network strategy or wholesale
      infrastructure, seeking to monetize existing 5G capital expenditures through premium enterprise positioning APIs.
      In private 5G and industrial deployments, economic buyers include plant IT directors, warehouse general managers,
      and hospital clinical engineering leaders. By extracting location telemetry directly from uplink Sounding
      Reference Signals rather than relying on handset operating system permissions, ZaiNar repositions location
      awareness as a network utility, theoretically shifting distribution leverage toward carrier partners and systems
      integrators while reducing procurement friction associated with dedicated beacon hardware.
  - id: commercial-traction-and-backlog-quality
    title: Adoption Trajectory & Contract Pipeline Quality
    claimRefs:
      - CU002
      - CU006
      - CU007
      - CU008
      - CU012
    tableRefs:
      - TU002
    body: >-
      ZaiNar emerged from stealth in early 2026 announcing over $450 million in commercial contracts and memoranda of
      understanding, with subsequent aggregator estimates tracking pipeline figures above $500 million. The company
      reports active commercial deployments across healthcare, construction, and logistics operations on multiple
      continents. However, from a diligence perspective, the underlying backlog quality remains opaque: public
      disclosures provide no audited separation between legally binding commercial purchase contracts and exploratory,
      non-binding memoranda of understanding. Furthermore, ZaiNar discloses no annual recurring revenue, net revenue
      retention rates, customer logo counts, or cohort renewal metrics, preventing independent verification of whether
      initial paid trials successfully convert into durable recurring software subscriptions or experience post-pilot
      attrition.
  - id: named-deployments-and-partner-programs
    title: Named Accounts & Ecosystem Verification
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU011
    tableRefs:
      - TU003
    body: >-
      Publicly verified organizational traction for ZaiNar is anchored in government market-entry initiatives and
      semiconductor ecosystem collaborations rather than named commercial enterprise customers. In April 2026, the Tokyo
      Metropolitan Government selected ZaiNar for its Green Transformation foreign market-entry support program,
      establishing a municipal foothold in Japan dense manufacturing and private 5G robotics ecosystem. In September
      2026, ZaiNar joined the Arm Total Design ecosystem to bring real-time location awareness to Arm-based robotics
      silicon architectures. To bolster carrier relationships, former Nokia Chief Strategy and Technology Officer
      Nishant Batra joined as an advisor. Crucially, as of August 2026, ZaiNar has published zero named commercial
      enterprise customer case studies, leaving production adoption across hospital wards and construction sites
      uncorroborated by external customer references.
  - id: customer-journey-and-retention-dynamics
    title: Adoption Surfaces, Expansion Loops & Concentration Dynamics
    claimRefs:
      - CU013
      - CU015
      - CU016
    figureRefs:
      - FU001
    body: >-
      The customer adoption journey progresses through network qualification, single-site pilot benchmarking,
      enterprise-wide campus licensing, and carrier-scale distribution. In active operational environments such as
      construction and healthcare facilities, the software coordinates mobile assets and establishes geofenced exclusion
      zones to enhance worker safety and eliminate staff equipment search times. As deployments scale across multiple
      facilities, ZaiNar envisions an expansion loop termed Environmental Memory, which aggregates continuous spatial
      telemetry into historical datasets to support autonomous machine training and digital twins. However, this
      expansion strategy encounters two structural headwinds: heavy channel concentration on carrier and systems
      integrator distribution, and regulatory privacy scrutiny surrounding continuous indoor tracking and unauthorized
      location surveillance in sensitive enterprise and healthcare environments.
