      - CU014
      - CU016
callouts:
  - calloutType: risk
    title: Backlog Quality & Commercial Verification Gap
    claimRefs:
      - CU005
      - CU008
      - CU012
    body: >-
      While ZaiNar promotes a headline contract and MOU pipeline exceeding $450 million to $500 million, the absence of
      named commercial customers, disclosed revenue run rates, or public separation of binding purchase orders from
      non-binding letters of intent presents a significant diligence hurdle for growth underwriters.
  - calloutType: insight
    title: Network-Side Control Shifts Carrier GTM Power
    claimRefs:
      - CU001
      - CU010
      - CU014
    body: >-
      By utilizing Sounding Reference Signals (SRS) emitted for connectivity rather than relying on handset OS
      positioning APIs that are restricted by Apple and Google, ZaiNar transfers location authority to network operators
      and enterprise facility managers, creating strong strategic incentives for carrier-led distribution.
