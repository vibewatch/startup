callouts:
  - calloutType: insight
    title: Budget Consolidation Wedge in Private Wireless
    body: >-
      By computing centimeter-level positioning from ambient uplink connectivity signals on the network side, enterprise
      buyers can eliminate dedicated UWB anchor hardware and proprietary tag infrastructure, consolidating separate RTLS
      and cellular network budgets into a unified private wireless deployment.
    claimRefs:
      - CM001
      - CM010
  - calloutType: risk
    title: Backlog Quality and Diligence Opacity
    body: >-
      While headline commercial momentum cites more than $450 million in contracts and memoranda of understanding,
      public filings do not disclose the proportion of binding recurring software billings versus non-binding pilot
      agreements, representing a material underwriting uncertainty.
    claimRefs:
      - CM013
      - CM015
