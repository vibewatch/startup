callouts:
  - calloutType: insight
    title: Network-Side Signal Triangulation as an Architectural Wedge
    body: >-
      By intercepting uplink Sounding Reference Signals rather than downlink positioning broadcasts, ZaiNar structurally
      circumvents mobile operating system permission barriers, potentially transforming carriers into location
      providers.
    claimRefs:
      - CP001
      - CP005
      - CP006
  - calloutType: risk
    title: 3GPP Standard Evolution and Incumbent Telecom Absorption
    body: >-
      The rapid advancement of 3GPP Release 18 positioning enhancements creates long-term commoditization pressure, as
      major telecom network vendors can bundle native carrier-phase positioning into standard base station software.
    claimRefs:
      - CP004
      - CP007
      - CP008
      - CP014
