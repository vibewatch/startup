callouts:
  - calloutType: risk
    title: The Carrier Gatekeeper Paradox and Distribution Vulnerability
    body: While ZaiNar circumvents handset operating system gatekeepers by computing location from network-side connectivity signals, this technical architecture substitutes one dependency for another. ZaiNar becomes critically dependent on telecommunications carriers and private network operators to bundle, deploy, and commercialize its positioning software across enterprise environments.
    claimRefs:
      - CR004
      - CR008
      - CR010
  - calloutType: insight
    title: Contract Backlog Quality as Primary Diligence Underwriting Pivot
    body: ZaiNar's reported $450 million commercial pipeline forms the primary economic justification for its $1 billion-plus post-stealth valuation. However, absent audited disclosures establishing the ratio of binding recurring software contracts to exploratory non-binding memoranda, investors face significant valuation downside if pipeline conversion stalls.
    claimRefs:
      - CR006
      - CR007
      - CR014
