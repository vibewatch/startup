companyProfile:
  summary: >-
    ZaiNar is a venture-backed spatial intelligence infrastructure company that repurposes existing 5G and Wi-Fi signals
    into network-side positioning for carriers and enterprises. Founded in 2017 and headquartered in Belmont,
    California, it emerged from stealth in February 2026 with a reported $1B-plus valuation and more than $100M of
    cumulative capital. The company frames its platform as a hardware-light layer for asset tracking, robotics
    coordination, healthcare, construction, and logistics workflows, but the public record still lacks named production
    customers and audited operating metrics.
