      - number: '5.4'
        title: 复用基础设施是切入点，验证与治理是风险
        blocks:
          - type: paragraph
            body: >-
              从架构看，差异化论点可信：复用连接信号可以减少终端改造和专用传感器基础设施，而集中的位置上下文可能支持超越单个机器人本地感知的车队协同。ZaiNar 还称已申请超过 100 项专利、获得 90
              项授权，但保留记录没有独立说明这些专利与营销性能之间的对应关系。最重要的技术警示是验证。官方发布页面称覆盖范围为 2+ 公里，而同一公司公告的转载版本称最高 1.5
              公里；两者都不是独立基准。另一份公开记录审查没有找到技术白皮书、第三方精度审计或详细的实时部署案例。安全与隐私同样重要，因为室内定位研究把欺骗、干扰、信号阻塞、多径和未经授权的追踪列为运营威胁。ZaiNar
              保留的公开材料没有说明身份认证、同意、留存、加密、审计或事件响应控制。
            claimRefs:
              - CE004
              - CE005
              - CE009
              - CE010
              - CE013
              - CE015
