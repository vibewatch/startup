      - number: '3.4'
        title: 护城河持久性、在位者反应与替代风险
        blocks:
          - type: paragraph
            body: >-
              ZaiNar 竞争护城河的长期持久性面临标准化电信演进、环境射频脆弱性和商业执行未经验证等结构性风险。3GPP Release 18 完成后，5G Advanced
              将加入载波相位测量、多层带宽聚合和面向低复杂度（RedCap）设备的跳频功能。Ericsson、Nokia 等大型网络设备在位者若把这些标准化定位算法直接整合进基站固件，ZaiNar
              的专有计时软件就可能商品化。此外，室内射频定位天生容易受到严重多径失真、非视距信号衰减以及恶意射频干扰或欺骗攻击影响，进而扰乱自动化工业工作流。最关键的是，ZaiNar 2026 年初结束隐身状态时称拥有超过
              四亿五千万美元的商业合同和谅解备忘录，但独立市场分析师指出，这些承诺没有一项得到具名生产部署或具有约束力的最低支出条款公开佐证，因此其商业防御力仍未验证。
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP012
              - CP013
              - CP014
