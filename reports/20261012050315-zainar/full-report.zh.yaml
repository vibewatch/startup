          - type: paragraph
            body: >-
              ZaiNar 销售的是定位和空间感知层，而不是新的追踪设备。其工作流从联网手机、机器人、车辆和 IoT
              设备已经发出的信号开始；网络处理这些信号，并把位置上下文暴露给运营商或企业系统。公司称，这种方式无需安装应用、无需专用定位硬件，也不会额外消耗被追踪设备的电池。公开材料将产品分为 5G 定位、称为 Zero 的
              Wi-Fi 感知、资产追踪，以及更广泛的 Physical AI
              协同层。对运营商、专用网络、工业、医疗、建筑和物流工作流而言，这一定义是连贯的，但保留的证据没有证明具名用户的产品打包、服务水平、部署工作量或生产结果。因此，产品成熟度应理解为公司宣称的商业可用性，而不是独立验证的规模化。
