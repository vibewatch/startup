  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、基础设施边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              ZaiNar 将市场机会定义在无线网络基础设施与自主系统空间感知的交叉点，把平台定位为 Physical AI 的基础软件层
              [CM001]。在传统实时定位系统（RTLS）中，企业运营方必须购买并部署专用物理基础设施，包括超宽带（UWB）无线电锚点、光学视线追踪摄像头或密集的低功耗蓝牙（BLE）信标网格
              [CM003]。这些现状方案资本开支高，还需要持续更换电池，并会随运营而退化：卫星 GPS 信号在室内和密集城市峡谷中会完全衰减，光学摄像头需要清晰视线且设备端计算负担重，专用 UWB
              网络则要在整个设施内安装硬件，成本高得难以接受 [CM002, CM003]。ZaiNar 的架构切入点是把现有无线连接网络——尤其是运营商和专用 5G、Wi-Fi
              接入点以及专用蜂窝部署——改造成集成式空间传感器 [CM001]。软件利用专利化的亚纳秒级信号同步，直接在网络侧用设备已经发射的无线电波计算三维位置
              [CM002]。这种架构无需购买专有标签硬件和独立传感器网关，同时承接原本会分散在不同硬件供应商之间的企业软件许可和基础设施赋能支出 [CM010]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
      - number: '2.2'
        title: 可服务市场规模、预测视角与估值关联
        blocks:
          - type: paragraph
            body: >-
              评估 ZaiNar 的可服务市场，必须区分有边界的近期室内 RTLS 支出与不设上限的长期 Physical AI 市场空间 [CM004, CM005]。根据市场研究估计，全球室内定位与导航系统市场 2024
              年规模为 $13.73B，预计 2025 年增至 $15.44B、2033 年达到 $39.62B，复合年增长率为 12.5% [CM004]。更激进的行业预测把自动化机器、智能建筑和无处不在的 IoT
              追踪纳入其中，预计 2035 年市场规模达到 $783.23B，CAGR 高达 35.17% [CM005]。ZaiNar 在隐身九年后于 2026 年 2 月亮相，累计融资超过 $100M、据报道估值超过
              $1B，反映出风险投资对这场更大转型的判断 [CM011]。公司报告的商业势头包括跨洲企业试点中的超过 $450M 合同和谅解备忘录 [CM013]。但机构投资者仍需保持分析纪律：公开资料显示 ZaiNar
              采用软硬件混合商业模式，而公开记录没有把这笔 $450M+ 订单储备拆分为具有法律约束力的经常性软件账单，还是有条件、无约束力的探索性试验 [CM013, CM015]。
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM013
              - CM015
