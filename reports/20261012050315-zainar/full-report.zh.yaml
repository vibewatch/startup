  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 将原始蜂窝连接转化为高毛利网络侧空间智能收入。
    approximationNotes: 商业架构示意基于已披露的平台能力；利润拆分代表目标区间。
    claimRefs:
      - CI006
      - CI008
      - CI009
    data:
      nodes:
        - id: signals
          label: 环境无线信号
          description: 现有用户和 IoT 设备默认发射的标准 5G SRS 与 Wi-Fi 帧。
        - id: network
          label: 网络基础设施
          description: 运营商基站、企业 Wi-Fi AP 或专用 5G 小区无需改造硬件即可采集原始 RF 信号。
        - id: synchronization
          label: 亚纳秒级同步
          description: ZaiNar 的专利相位算法在接收节点之间计算精确的网络级计时。
        - id: spatial-api
          label: 空间智能引擎
          description: 集中生成坐标，实时产出亚米级 3D 定位坐标。
        - id: enterprise-apps
          label: 企业与运营商工作流
          description: 将位置遥测数据交付给工业机器人、医疗资产地图和自动驾驶车辆。
        - id: gross-profit
          label: 经常性软件利润
          description: 高毛利率软件授权和公用事业费用不受设备侧硬件 COGS 拖累。
      edges:
        - from: signals
          to: network
        - from: network
          to: synchronization
        - from: synchronization
          to: spatial-api
        - from: spatial-api
          to: enterprise-apps
        - from: enterprise-apps
          to: gross-profit
