      - number: '3.3'
        title: 经济模型、产品打包与企业切换成本
        blocks:
          - type: paragraph
            body: >-
              定位市场的商业打包反映出资本密集型硬件部署与经常性网络软件许可之间不同的成本结构。Zebra Technologies、Ubisense 等供应商的专用工业 RTLS
              方案需要高额前期资本开支：每个固定锚点要花费数千美元，              每个资产追踪标签要花费五十至一百美元，另加持续的设施维护费。相比之下，Cisco Spaces 的企业 Wi-Fi
              定位叠加服务被打包为低边际成本的年度 SaaS 订阅，直接捆绑进园区网络协议，为非关键任务追踪形成显著采购锁定。ZaiNar
              计划通过软件订阅和运营商许可协议变现，收费可能与网络节点或吞吐能力挂钩，从而取得较高软件毛利率。然而，切换到网络侧定位要求运营商和专用网络运营方投入多年的评估周期；企业客户也会因放弃专业 RTLS
              标签、改用未经验证的蜂窝定位遥测而产生明显运营顾虑。
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP012
              - CP014
