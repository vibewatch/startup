      - number: '1.4'
        title: 商业里程碑与扩张轨迹
        blocks:
          - type: paragraph
            body: >-
              结束隐身状态后，ZaiNar 在 2026 年持续围绕标准制定机构、国际市场和硬件合作伙伴发布商业化公告。2026 年 2 月下旬，公司推出商业 5G 定位能力：在 Band 48 CBRS 网络上展示低于
              10cm 的位置追踪，无需修改客户端软件；其方法是分析 Sounding Reference Signals（SRS），而不是移动操作系统限制使用的 Positioning Reference
              Signals（PRS）。4 月，公司在东京设立企业办公室，完成国际扩张的下一步，此前东京 Metropolitan Government 选中其参加 Green Transformation
              Innovation Program。2026 年 9 月，ZaiNar 加入 Arm Total Design 生态，将网络空间感知嵌入 Physical AI 芯片参考架构；公司还拥有超过 90
              项已授权专利，且据报道没有遭到专利局驳回。
