  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 按层级比较经核实的室内定位基线、长期 Physical AI 发展空间和 ZaiNar 商业管线的市场规模。
    data:
      items:
        - level: 1
          label: ZaiNar 商业管线（即时 SOM）
          value: $450M+
          detail: 据报道，跨洲试点覆盖医疗、建筑和物流领域的企业合同及谅解备忘录。
        - level: 2
          label: 可服务可获得市场（网络侧软件）
          value: $1.20B
          detail: 面向较早采用专用 5G 和工业场地的高精度网络计算空间智能，近期可触达的软件授权市场。
        - level: 3
          label: 可服务地址市场（专用 5G 与工业 RTLS）
          value: $6.50B
          detail: 医疗设施、工业制造和物流仓库中高精度位置感知对应的受限企业支出。
        - level: 4
          label: 核心室内定位与导航市场（2024 基线）
          value: $13.73B
          detail: 覆盖所有商业垂直领域及底层无线模式的全球室内定位系统第三方估值基线。
        - level: 5
          label: 扩展室内定位市场（2033 年预测）
          value: $39.62B
          detail: 智慧城市建设、工业自动化和企业 IoT 集成推动的预计室内定位系统支出。
        - level: 6
          label: 广义 Physical AI 空间感知与机器人发展空间（2035 TAM）
          value: $783.23B
          detail: 面向所有自主机器、智能基础设施及物理环境空间智能数据流的宏观愿景空间。
    approximationNotes: 宏观市场边界来自已发布的行业预测；管线数据体现公司口径，未经审计核实。
    claimRefs:
      - CM001
      - CM004
      - CM005
      - CM013
      - CM015
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按部署硬件负担和空间精度更新率，对各类定位技术进行相对评估。
    data:
      points:
        - label: ZaiNar（网络原生 SRS）
          x: 2
          'y': 9
          detail: 网络侧 SRS 处理无需设备硬件，同时提供高频厘米级定位。
        - label: NextNav（地面 PNT）
          x: 6.5
          'y': 7
          detail: 需要专用地面信标基础设施，以提供垂直 z 轴和都市地理定位。
        - label: Cisco Spaces（Wi-Fi / BLE）
          x: 3
          'y': 3.5
          detail: 利用已部署的企业 Wi-Fi，但精度受限于粗粒度房间 / 区域级别，更新率也较低。
        - label: Qualcomm 与 3GPP Rel-18
          x: 4
          'y': 6
          detail: 标准化蜂窝定位正向亚米级精度推进，但受 PRS 占空比和操作系统权限限制。
        - label: Zebra / Ubisense（UWB RTLS）
          x: 9
          'y': 8.5
          detail: 高精度工业跟踪需要昂贵的专用布线、锚点和主动设备标签。
        - label: GNSS / GPS 现状
          x: 5
          'y': 4
          detail: 全球户外标准，无法覆盖室内，易受干扰，更新率仅 1 Hz。
    approximationNotes: 得分依据已报道的基础设施要求（X 轴，越低表示硬件负担越小）以及定位精度和更新能力（Y 轴，越高表示精度和频率越优），按 1–10 的序数尺度定位。
