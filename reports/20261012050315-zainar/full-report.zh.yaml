      - number: '3.2'
        title: 竞争者架构与能力对比
        blocks:
          - type: paragraph
            body: >-
              各类定位技术的架构差异，核心在于空间处理是在客户端手机上执行，还是在无线接入网络中集中计算。3GPP 标准中的传统蜂窝定位历来使用 Positioning Reference
              Signals（PRS），通常每秒只广播一次，因此无法满足动态机器人和高速移动工业机械的需求。此外，Apple iOS 和 Google Android
              默认限制访问设备级定位参考信号，阻止电信运营商独立商业化设备端位置流。相比之下，ZaiNar 用 Sounding Reference
              Signals（SRS）计算设备位置；为维持蜂窝链路质量，联网设备每秒必须发送 100 至 500 次 SRS。ZaiNar
              让基站间实现亚纳秒级时间同步，在没有客户端软件的情况下完全在网络侧三角定位设备。与此同时，Cisco 等成熟企业供应商利用无处不在的园区 Wi-Fi
              接入点提供区域级存在分析，无需增设无线电设备，因此在办公和零售环境中仍保持强势地位。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP012
