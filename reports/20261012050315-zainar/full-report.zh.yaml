      - number: '2.3'
        title: 买方分层、工作流经济性与预算归属
        blocks:
          - type: paragraph
            body: >-
              ZaiNar 定位技术的采用横跨多个企业买方群体，各群体的工作流瓶颈、经济理由和预算负责人都不同 [CM006]。在医疗场景，医院运营高管和生物医学工程负责人面临设备利用率难题：护士和临床人员经常把工作班次的
              20% 至 30% 花在寻找移动医疗设备上，例如输液泵、遥测监护仪和轮椅 [CM006, CM007]。实时定位数据可以减少重复采购设备，直接带来劳动力生产率回报和资本保全
              [CM007]。在重型建筑和基础设施领域，总承包商和风险经理利用定位追踪动态划定周界安全区域，避免工人在复杂环境中与重型机械发生致命碰撞；光学摄像头则容易被粉尘遮挡
              [CM006]。在自主履约物流和智能制造中，车队运营方利用共享网络定位坐标协调自主移动机器人（AMR），把沉重的定位计算从电池受限的车辆转移到网络 [CM006,
              CM014]。在所有细分市场，企业买方都能整合预算，让首席信息官和运营负责人直接把追踪需求纳入企业 5G 与 IT 连接资本预算，而不用分别管理孤立的供应商合同 [CM010]。
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
