        - 对标准 SRS 信号实现亚纳秒级同步，可将现有 5G 网络变成亚米级空间传感器，无需新增硬件
        - 真实环境中的多径反射、运营商频谱限制和环境噪声可能使精度降至商业 SLA 要求以下
        - 独立技术审计显示，在企业非视距部署中无法维持亚米级精度
      - - 商业管线
        - 据报道，物流、建筑和医疗领域的合同及谅解备忘录金额达到 $450M 至 $500M+，显示出巨大的市场拉力
        - 管线由不具约束力的谅解备忘录和未付费试验主导，往往无法转化为经常性软件收入
        - 无法在 12 个月内宣布某家《财富》500 强企业或一线运营商的商业化部署
      - - 商业模式与利润率
        - 协议无关的软件交付模式使纯 SaaS 业务在运营商规模下的毛利率有望超过 75%
        - 现场部署、RF 校准和定制系统集成可能让低利润率专业服务拖累经济性
        - 由于持续的现场工程要求，审计毛利率降至 50% 以下
      - - 监管与隐私
        - 网络侧处理绕过移动操作系统权限，并为抵御 GPS 干扰提供关键的地面 PNT 弹性
        - FTC 和全球隐私监管对持续设备跟踪的执法扩大，将威胁商业化和数据权利
        - 监管认定网络级 SRS 定位必须取得个人设备的明确主动选择
    notes: 结构化投资论点与反论点评估覆盖技术切入点、管线转化、单位经济性和数据合规。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV010
      - CV011
  - id: TV003
    title: 估值情景矩阵
    columns:
      - 情景
      - 假设里程碑
      - 隐含估值（百万美元）
      - 关键风险
      - 概率信号
    rows:
      - - 乐观情景
        - 管线转化率 40%；通过多运营商一线授权和全球物流合同实现 $75M ARR
        - 1800
        - 网络 OEM 快速回应；企业部署摩擦
        - 20%（需要已宣布的日本 GX 项目和 Tokyo Robotics 立即转化为高价值授权）
      - - 基准情景
        - 运营商销售周期拉长；混合软件 / 服务收入 $25M；企业采用专用 5G
        - 550
        - 现场集成服务压低毛利率；二级融资轮估值折价
        - 55%（与专用 5G 的采用速度及深科技基础设施通常较长的培育期一致）
      - - 悲观情景
        - 谅解备忘录到期而未转化；ARR 停滞在 $10M 以下；高烧钱迫使公司紧急过桥融资
        - 200
        - 下轮融资的清算优先权抹去次级股权；客户集中度流失
        - 25%（不透明的财务披露和资本密集型运营商概念验证使该概率上升）
    notes: 情景估值矩阵基于合同管线转化率、毛利率状况，以及相对于 NextNav 可比公司的倍数压缩。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV011
      - CV012
