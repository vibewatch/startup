              架构的结构性优势在于，网络计算定位把繁重的计算负载从资源受限的电池设备转移到集中式软件服务器。理论上，这使公司有机会取得类似软件的毛利率，因为它无需承担专有接收器标签或摄像头阵列的制造成本。但学术研究和实际部署研究显示，室内定位精度根本上取决于无线网络密度与环境几何。如果潜在企业客户必须增设无线接入点或专用小基站，才能达到宣传的厘米级精度，部署负担就可能拖慢销售速度并压缩客户层面的净利润。
