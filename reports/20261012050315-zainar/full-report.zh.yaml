  - id: FU001
    title: ZaiNar 客户旅程图与落地扩张采用周期
    type: journey-map
    summary: 六阶段企业客户采用生命周期，详述技术评估、试点部署、企业推广和二次空间数据变现。
    data:
      items:
        - label: 1. 网络资格评估
          description: 评估现有运营商或专用 5G / Wi-Fi 无线基础设施，核实其在 10 至 20 MHz 频谱上的同步准备度。
          touchpoints: Radio frequency audit, base station firmware compatibility check, spectrum qualification
        - label: 2. 付费概念验证试点
          description: 初次部署于单一设施，展示对医院设备、工地工人或仓库资产的亚米级 3D 跟踪。
          touchpoints: Software-defined radio configuration, anchor-free calibration, baseline accuracy benchmarking
        - label: 3. 单站点生产许可
          description: 在主要商业设施全面运营，并将实时定位集成至企业资产管理平台。
          touchpoints: Core network software installation, enterprise API integration, SLA verification
        - label: 4. 多设施企业扩张
          description: 横向推广至区域物流枢纽、工厂园区或医疗网络，无需增加传感器硬件。
          touchpoints: Master services agreement execution, multi-site license scaling, systems integrator handover
        - label: 5. 运营商规模生态分销
          description: 一线电信运营商将 ZaiNar 网络侧定位捆绑进企业专用蜂窝产品。
          touchpoints: Carrier core network deployment, joint go-to-market packaging, telecom billing integration
        - label: 6. 环境记忆数据变现
          description: 通过向 Physical AI 模型训练和机器人群协调授权聚合历史空间遥测数据，形成二次变现循环。
          touchpoints: Spatial API access, robotics simulator training feeds, digital twin data subscriptions
    approximationNotes: 采用阶段和运营触点基于截至 2026 年 10 月的公司 GTM 讨论、分析师资料和高管访谈建模。阶段之间的转化率尚未公开披露。
