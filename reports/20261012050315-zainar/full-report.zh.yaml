        title: 收入来源与变现模式
        blocks:
          - type: paragraph
            body: >-
              ZaiNar 是 Physical AI 基础设施供应商，把环境无线网络转化为高精度空间感知系统，无需专有硬件或设备端修改。公司采用双重商业变现策略，连接电信运营商网络与企业设施部署。在运营商环境中，ZaiNar
              将软件定义的定位能力变现，让电信运营商可以直接利用既有 5G 基础设施提供厘米级实时定位服务。在企业和工业场景，平台提供订阅式空间感知，用于资产追踪、工人安全和自主机器人协同。公开文件和风险投资披露将
              ZaiNar 的收入模式描述为软硬件结合的服务框架。公司 2026 年 2 月宣布已获得 $450M 至 $500M 的商业合同和谅解备忘录，但详细收入确认政策、合同期限安排和实际开票金额仍属私有信息。
