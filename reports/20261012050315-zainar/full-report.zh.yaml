  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境与替代定位方式
        blocks:
          - type: paragraph
            body: >-
              商业定位市场包含多种技术路径，解决卫星全球导航卫星系统（GNSS）在室内设施和密集城市峡谷中长期失效的问题。传统 GPS
              提供基础户外覆盖，但进入实体建筑后会严重衰减并出现多径信号失真，给室内工业工作流留下明显空白。因此，企业现有环境主要依赖专用超宽带（UWB）部署或电池供电的低功耗蓝牙（BLE）信标。UWB 系统可在 10 至
              30 厘米内实现高精度空间追踪，但需要大量资本投入、全设施布线和持续维护活跃标签。Xona Space Systems、TrustPoint 等公司的新兴低地球轨道（LEO）卫星方案可以从轨道提供高精度地面
              PNT 信号，但部署仍然资本密集，且室内穿透能力不可靠。ZaiNar 试图把既有蜂窝无线基础设施改造成环境定位网格，同时替代卫星和专用信标架构。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
