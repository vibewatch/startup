chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与隐身期演变
        blocks:
          - type: paragraph
            body: >-
              ZaiNar, Inc. 是一家获得风险投资支持的 Physical AI 和空间智能基础设施初创公司，2017 年在特拉华州注册成立，总部位于加州 Belmont。公司近九年一直处于深度研发隐身状态，直到
              2026 年 2 月公开亮相，宣布推出商业平台，把标准蜂窝和无线网络改造成实时感知基础设施。ZaiNar
              不依赖专用硬件标签、光学摄像头或轨道卫星星座，而是在网络侧追踪机会无线电频率信号，计算高精度三维位置。公司同时宣布，累计投入资本超过 $100M，投后估值超过
              $1B，并将自己定位为自主机器人、工业物流、医疗资产追踪和国防应用的基础设施；在这些场景中，传统 GPS 信号无法穿透。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO006
              - CO008
              - CO011
              - CO014
      - number: '1.2'
        title: 创始团队与治理结构
        blocks:
          - type: paragraph
            body: >-
              ZaiNar 由首席执行官 Daniel Jacker 和首席技术官 Philip Kratz, Ph.D. 共同创立。Daniel Jacker 是连续创业者，负责商业化和公司融资；Philip Kratz
              开发了基础信号处理算法。管理团队技术架构的核心目标是让标准无线电信号实现亚纳秒级相位同步，把持续波传播转化为亚米级空间坐标。治理和战略监督团队汇集了深科技与电信领域的重要人物，其中最突出的是风险投资人 Steve
              Jurvetson，他同时担任 ZaiNar 和 SpaceX 董事。顾问还包括前 Yahoo 首席执行官 Jerry Yang、前 Amazon 首席科学家 Andreas Weigend、Siri 联合创始人
              Tom Gruber，以及前 Nokia 首席技术官 Nishant Batra；对一家刚开始商业化的公司而言，这样的治理深度并不寻常。
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
      - number: '1.3'
        title: 资本结构、利益相关者图谱与估值可信度
        blocks:
          - type: paragraph
            body: >-
              公司资本化历史在主要公告与第三方风险投资数据库之间存在明显分歧。ZaiNar 2026 年 2 月的亮相公告称累计获得超过 $100M 投资、估值 $1B；而 Silicon Valley Investment
              Club 等风险投资追踪数据库记录的融资额最高达 $211.7M，分六轮完成，其中包括 2018 年由 Alchemist Accelerator 领投的种子轮和 2021 年 $11.7M 的 A 轮。股东包括
              Future Ventures、AME Cloud Ventures 等深科技机构基金，以及 Samsung、Samsung NEXT 和 SoftBank 的战略投资部门。商业势头的说法提到超过 $450M
              的合同和谅解备忘录，但没有公开点名主权运营商、医院网络或物流企业作为已签约的参考部署客户。此外，年度经常性收入、现金消耗率和毛利率仍完全保密。
