        blocks:
          - type: paragraph
            body: >-
              5G 实现被描述为专用 Positioning Reference Signals 的网络侧替代方案。ZaiNar 称其读取设备为保持连接而发送的 Sounding Reference Signals：SRS
              每秒出现 100 至 500 次，而其发布材料讨论的定位方式约每秒一次。这样一来，无线接入网络、计时层和坐标求解器就成为核心依赖，而不是被追踪终端。公司另称产品可在窄频谱上运行，并曾在 CBRS Band 48
              的 20 MHz 频段上演示。学术证据支持谨慎态度：基于相位和时间的室内定位可能对多径、频偏、噪声、校准和同步质量敏感。公开来源没有披露复现 ZaiNar 结果所需的具体基带接口、校准流程、数据架构或控制措施。
