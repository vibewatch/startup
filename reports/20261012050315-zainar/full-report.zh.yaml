      - number: '2.4'
        title: 采用驱动因素、运营商瓶颈与结构性约束
        blocks:
          - type: paragraph
            body: >-
              推动网络侧空间智能的主要宏观因素，是自主机器、机器人和 Physical AI 系统快速商业化；这些系统需要精确的空间感知，才能在人机共处环境中协同 [CM014]。2026 年 9 月，ZaiNar 加入
              Arm Total Design，进一步强化了生态协同，把位置感知算法直接整合进下一代边缘机器人芯片合作伙伴的架构 [CM014]。不过，市场仍面临显著的结构和商业采用约束 [CM008,
              CM012]。在公共广域蜂窝网络上，移动操作系统把关方——主要是 Apple 和 Google——执行严格安全政策，默认拒绝运营商访问设备定位参考信号（PRS 和 PSRS），只有法定 E911 紧急服务才能访问
              [CM008]。这一限制过去阻碍了电信运营商在消费者手机上实现高精度定位服务的商业化 [CM008]。ZaiNar 依靠 SRS
              的架构绕过设备操作系统控制，从标准上行连接信号计算位置，但市场扩张仍受专用频谱可用性限制 [CM008, CM009]。ZaiNar 称其在专用蜂窝网络中最低只需 10 MHz
              带宽即可运行，但企业部署速度取决于运营商专用 5G 销售周期和各国监管频谱审批 [CM012]。
            claimRefs:
              - CM008
              - CM009
              - CM012
              - CM014
