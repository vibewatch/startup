callouts:
  - calloutType: "insight"
    title: "Network-Side Positioning vs. Device Gatekeepers"
    body: "By processing Sounding Reference Signals (SRS) on the network rather than relying on handset-controlled Positioning Reference Signals (PRS), ZaiNar bypasses mobile operating system gatekeepers like Apple and Google, enabling carrier-level tracking without device-side app permissions."
    claimRefs:
      - "CO002"
      - "CO010"
  - calloutType: "risk"
    title: "Unverified Backlog and Private Revenue Structure"
    body: "ZaiNar's headline $450 million commercial pipeline lacks disclosed customer counterparties and audit verification, leaving substantial uncertainty regarding binding contract value, revenue run-rate, and gross margin economics."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO014"
