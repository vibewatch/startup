company:
  name: "ZaiNar"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2017 and emerging from stealth in February 2026, ZaiNar develops a network-side spatial intelligence platform that claims to convert existing 5G and Wi-Fi networks into high-precision 3D positioning sensors. Backed by tier-one investors at a reported $1B-plus valuation with more than $100M in capital raised, the company asserts $450M in commercial contracts and MOUs across multiple continents. However, commercial adoption remains unverified by named production reference customers, revenue and gross margins are private, and conflicting capital totals persist across industry trackers."
sections:
  - id: "corporate-identity-and-stealth-evolution"
    title: "Corporate Identity and Stealth Evolution"
    body: "ZaiNar, Inc. is a venture-backed physical artificial intelligence and spatial intelligence infrastructure startup incorporated in Delaware in 2017 and headquartered in Belmont, California. After operating for nearly nine years in deep research-and-development stealth, the company publicly emerged in February 2026 announcing a commercial platform that repurposes standard cellular and wireless networks into real-time sensing infrastructure. Rather than requiring dedicated hardware tags, optical cameras, or orbital satellite constellations, ZaiNar computes high-precision three-dimensional location on the network side by tracking radio-frequency signals of opportunity. The company simultaneously announced a headline post-money valuation exceeding $1 billion on over $100 million in cumulative invested capital, positioning itself as foundational infrastructure for autonomous robotics, industrial logistics, healthcare asset tracking, and defense applications where conventional GPS signals cannot penetrate."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO001"
  - id: "founding-leadership-and-governance-structure"
    title: "Founding Leadership and Governance Structure"
    body: "ZaiNar was co-founded by Chief Executive Officer Daniel Jacker, a serial technology entrepreneur overseeing commercialization and corporate financing, and Chief Technology Officer Philip Kratz, Ph.D., who developed the foundational signal-processing algorithms. The executive team's technical architecture centers on achieving sub-nanosecond phase synchronization across standard radio signals, translating constant wave propagation into sub-meter spatial coordinates. Governance and strategic oversight feature prominent deeptech and telecommunications figures, most notably venture capitalist Steve Jurvetson, who serves on the boards of both ZaiNar and SpaceX. Advisory relationships include former Yahoo chief executive Jerry Yang, former Amazon chief scientist Andreas Weigend, Siri co-founder Tom Gruber, and former Nokia chief technology officer Nishant Batra, providing unusual governance depth for an early commercialization venture."
    claimRefs:
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "capitalization-stakeholder-map-and-valuation-integrity"
    title: "Capitalization, Stakeholder Map, and Valuation Integrity"
    body: "The company's capitalization history exhibits significant divergence across primary announcements and third-party venture tracking databases. While ZaiNar's February 2026 emergence release cited more than $100 million in cumulative investment and a $1 billion valuation, venture tracking databases such as Silicon Valley Investment Club record up to $211.7 million raised across six distinct financings, including seed rounds led by Alchemist Accelerator in 2018 and an $11.7 million Series A in 2021. Capitalization table participants include institutional deeptech funds Future Ventures and AME Cloud Ventures alongside strategic corporate arms Samsung, Samsung NEXT, and SoftBank. Commercial momentum claims highlight over $450 million in contracts and memoranda of understanding, yet no sovereign carriers, hospital networks, or logistics enterprises have been publicly named as binding reference deployments. Furthermore, annual recurring revenue, cash burn rate, and gross margins remain entirely confidential."
    claimRefs:
      - "CO003"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "commercial-milestones-and-expansion-trajectory"
    title: "Commercial Milestones and Expansion Trajectory"
    body: "Following its stealth emergence, ZaiNar accelerated commercialization announcements throughout 2026 across standard-setting bodies, international markets, and hardware partnerships. In late February 2026, the company launched its commercial 5G positioning capability, demonstrating sub-10cm location tracking on Band 48 CBRS networks without client-side software modifications by analyzing Sounding Reference Signals (SRS) rather than mobile operating system-restricted Positioning Reference Signals (PRS). International expansion followed in April 2026 with the establishment of a Tokyo corporate office following selection by the Tokyo Metropolitan Government for its Green Transformation Innovation Program. In September 2026, ZaiNar joined the Arm Total Design ecosystem to embed network spatial awareness into Physical AI semiconductor reference architectures, reinforced by a patent portfolio of over 90 issued patents with zero reported patent office rejections."
    claimRefs:
      - "CO010"
      - "CO012"
      - "CO013"
    figureRefs:
      - "FO001"
