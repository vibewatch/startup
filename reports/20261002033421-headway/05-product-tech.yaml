chapter:
  number: 5
  title: "Product & Technology"
  summary: "Headway's public product surface links patient discovery, provider practice software, insurance administration, and payer-facing measurement. Hiring materials reveal a modern web, cloud, and data stack, but they are company-issued signals rather than independent benchmarks; reliability, security certification, AI quality, and integration performance remain material diligence gaps."
sections:
  - id: "product-and-workflow"
    title: "Product surfaces and customer workflow"
    body: >-
      Headway presents a multi-sided operating system rather than a single therapy directory. Public support materials expose provider onboarding and credentialing, scheduling and telehealth, clinical documentation, coding, claims, provider payments, audits, and client insurance workflows. Current hiring materials add patient matching, provider practice automation, payer outcomes measurement, and a platform layer for billing, claims, payments, and trust and safety. The evidence therefore supports a product map spanning patient, provider, payer, and internal platform users. It does not establish workflow conversion, utilization, or time savings, so the tables below describe disclosed functionality and mark measurable benefits as unverified rather than treating product availability as proof of outcomes.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "technical-architecture"
    title: "Technical and operating architecture"
    body: >-
      The strongest architecture evidence comes from Headway-authored job descriptions syndicated by recruiting and investor job boards. Those materials name React, Remix, Next.js, React Aria, Python 3, FastAPI, AWS Fargate, ECS, S3, Spark, Kafka, Datadog, PagerDuty, and Sentry. A separate data-infrastructure role describes Snowflake, ingestion tooling, AWS infrastructure, CI/CD, monitoring, and a developer platform serving analytics, product, and machine-learning teams. These disclosures indicate a web application and data-platform architecture built around managed cloud services and third-party observability. They do not reveal service boundaries, data lineage, recovery objectives, tenancy design, deployment frequency, or measured performance, and should not be mistaken for an audited production topology.
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "maturity-and-differentiation"
    title: "Maturity, differentiation, and roadmap signals"
    body: >-
      Headway's Helix design system is the clearest disclosed cross-product platform asset. Company-issued postings describe Helix as serving both the consumer marketplace and provider EHR, with semantic tokens, component APIs, accessibility practices, and documentation intended for designers, engineers, and coding agents. The same materials say the system is being rebuilt, which signals active investment but also migration risk: a rebuild is not evidence that every surface already uses the new components. Product differentiation appears to come from joining insurance administration to clinical workflow software and from feeding those workflows into payer measurement. Public evidence does not quantify switching costs, release cadence, support burden, roadmap delivery, or performance relative to alternative EHR and marketplace products.
    claimRefs:
      - "CE001"
      - "CE005"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
  - id: "trust-and-diligence"
    title: "Trust, safety, compliance, and technical diligence"
    body: >-
      Headway publicly documents two-factor authentication, identity verification, HIPAA and protected-health-information guidance, billing reviews, and documentation standards. Its compliance guide says clinicians may keep records on Headway or through another HIPAA-compliant method, while Headway templates can prefill prior notes or generate a progress note with AI. It also says the session-confirmation flow checks CPT codes and session details for compatibility. These are meaningful control and workflow claims, but the assigned evidence contains no independent security assessment, certification report, availability history, recovery testing, AI evaluation, or model-governance detail. Dataford's interview guide is only a practitioner signal and cannot validate production reliability. The investment case therefore requires direct technical diligence rather than extrapolation from help pages and hiring descriptions.
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE015"
      - "CE016"
