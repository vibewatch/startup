evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements confirming GAAP revenue, gross margin breakdown between software and payer fees, net
      operating burn, and cash runway.
    whyItMatters: >-
      Without audited financial disclosures, assessing Headway's path to profitability and valuation sustainability at a
      $2.3B+ valuation remains speculative.
    diligencePath: >-
      Request audited financial statements, unaudited interim income statements, and 24-month cash flow projections
      during formal management diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current independent U.S. denominator for covered outpatient mental-health spend, eligible visits, reimbursement
      by modality, and addressable provider volume.
    whyItMatters: >-
      Without compatible spend, utilization, and reimbursement denominators, the retained need and network metrics
      cannot support a dollar TAM or SAM.
    diligencePath: >-
      Obtain payer claims extracts, government utilization tables, and an independent market dataset with definitions
      that isolate outpatient psychotherapy and medication management.
    relatedQuestionRefs:
      - QM002
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: serviceable-market
    missingEvidence: >-
      Headway's payer contracts, reimbursement schedules, take rates, active-provider counts, completed visits, payer
      concentration, and geography-by-plan availability.
    whyItMatters: >-
      These private denominators determine monetizable volume, gross economics, concentration risk, and a defensible
      SOM.
    diligencePath: >-
      Request a payer-level contract and cohort data room, reconcile it to claims cash receipts, and sample
      active-provider and completed-visit definitions.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: provider-network
    missingEvidence: >-
      A reconciled time series defining registered, credentialed, active, and visit-producing providers across the
      33,000 and 50,000 disclosures.
    whyItMatters: Unreconciled headline network counts can overstate supply density and obscure inactivity or churn.
    diligencePath: >-
      Request monthly provider cohorts by credentialing status, appointment availability, completed visits, payer,
      specialty, and state.
    relatedQuestionRefs:
      - QM002
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: referral-conversion
    missingEvidence: >-
      Independent cohort evidence for referral-to-booking, booking-to-attendance, repeat-session, retention, denial,
      clawback, and net reimbursement rates.
    whyItMatters: >-
      Referral counts and appointment-speed claims do not establish realized care volume, durable adoption, or unit
      economics.
    diligencePath: >-
      Audit de-identified referral and claims cohorts by source, payer, modality, specialty, and month, including
      cancellations and denials.
    relatedQuestionRefs:
      - QM004
      - QM010
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitor-reimbursement
    missingEvidence: >-
      Side-by-side comparative CPT code fee schedules and reimbursement rate floors between Headway and Alma across
      identical geographic states.
    whyItMatters: >-
      Directly determines whether Headway's percentage take-rate yields higher or lower net hourly earnings for
      clinicians compared to Alma's subscription model.
    diligencePath: >-
      Obtain blinded state-by-state 90834 and 90837 CPT reimbursement schedules from credentialed practitioners across
      top five states.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: minor
    topic: provider-overlap
    missingEvidence: >-
      Empirical survey data quantifying the percentage of Headway's 80,000+ providers who actively multi-home on Alma or
      Grow Therapy simultaneously.
    whyItMatters: >-
      Reveals whether Headway's reported network size represents unique captive clinical capacity or overlapping shared
      industry supply.
    diligencePath: >-
      Execute cross-directory scraping and NPI deduplication across Headway, Alma, and Grow Therapy public provider
      listings.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited financial statements confirming net revenue, gross margin, operating expenses, and cash burn.
    whyItMatters: >-
      Without audited financial statements, underwriting cannot independently verify Headway's path to profitability or
      unit take-rate economics.
    diligencePath: Request confidential management financial package under non-disclosure agreement during formal diligence review.
    relatedQuestionRefs:
      - QI003
  - type: private-evidence-only
    severity: material
    topic: payer-concentration
    missingEvidence: Breakdown of gross session volume and net commission revenue by individual health insurance payer.
    whyItMatters: >-
      High concentration among top 3 commercial health plans creates contract renewal and fee-compression
      vulnerabilities.
    diligencePath: Review top payer master service agreements, fee schedules, and termination notice clauses.
    relatedQuestionRefs:
      - QI001
  - type: private-evidence-only
    severity: material
    topic: product performance and reliability
    missingEvidence: >-
      Comparable metrics for workflow conversion, utilization, latency, availability, incident history, support burden,
      and disaster recovery.
    whyItMatters: >-
      Feature breadth does not show that patient, provider, payer, and platform workflows perform reliably at production
      scale.
    diligencePath: >-
      Request product analytics, service-level objectives, twelve months of incident reports, recovery-test results, and
      customer support metrics by product surface.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE001
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: AI quality and clinical controls
    missingEvidence: >-
      Model inventory, evaluation sets, error and override rates, human-review controls, privacy boundaries, and
      change-management records for AI-assisted workflows.
    whyItMatters: >-
      AI use in matching, documentation, workflow automation, and anomaly detection creates clinical, privacy, and
      reimbursement risks that feature descriptions cannot quantify.
    diligencePath: >-
      Review model cards, evaluation reports, prompt and retrieval architecture, release approvals, clinician escalation
      procedures, and production monitoring.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: security assurance
    missingEvidence: >-
      Independent audit reports, certification scope, penetration-test summaries, subprocessors, data-flow diagrams,
      access-control testing, and breach or outage history.
    whyItMatters: >-
      A help-center reference to 2FA and HIPAA guidance does not establish control effectiveness or the absence of
      security incidents.
    diligencePath: >-
      Obtain the current security package, third-party audit reports, penetration-test remediation log, subprocessor
      inventory, and incident register.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: practitioner-economics
    missingEvidence: Audited net take-rate and average revenue share percentage deducted by Headway per commercial session.
    whyItMatters: >-
      Directly determines clinician net hourly earnings and competitive switching risk to competing platforms like Alma
      or direct billing.
    diligencePath: Request blinded provider payment distribution schedules and take-rate waterfalls during management review.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: material
    topic: institutional-deployments
    missingEvidence: Volume and revenue breakdown of health system referral partnerships relative to consumer directory matching.
    whyItMatters: >-
      Validates whether B2B2C health system and EAP partnerships represent meaningful economic diversification or remain
      nascent pilots.
    diligencePath: Review channel-specific cohort volume data and contract backlog for health system partnerships.
    relatedQuestionRefs:
      - QU004
      - QU005
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: clawback-indemnity-loss-ratio
    missingEvidence: >-
      Audited figures on annual insurance clawback recoupment claims and total indemnity costs absorbed by Headway under
      its documentation guarantee.
    whyItMatters: >-
      Directly determines the contingent liability on Headway's balance sheet resulting from retrospective commercial
      and Medicaid payer audits.
    diligencePath: Request historical payer recoupment schedules, clawback indemnity payouts, and dedicated balance sheet reserves.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: litigation-exposure-settlement-reserve
    missingEvidence: >-
      Disclosure of potential class size, settlement reserves, and insurance defense coverage for M.G. v. TherapyMatch,
      Inc.
    whyItMatters: >-
      A certified class under CCPA Section 1798.150 could yield statutory damages of $100 to $750 per consumer per
      incident, creating material financial exposure.
    diligencePath: >-
      Inspect litigation reserve audit disclosures and primary defense counsel assessment of class certification
      likelihood.
    relatedQuestionRefs:
      - QR001
      - QR002
      - QR008
    relatedTableRefs:
      - TR001
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register-coverage
    missingEvidence: >-
      Full comprehensive registry of all state-specific Medicaid managed care contract compliance audits and CMS review
      notices.
    whyItMatters: >-
      State Medicaid programs enforce stringent documentation and enrollment standards that differ markedly from
      commercial payer policies.
    diligencePath: Review state-level Medicaid audit reports and correspondence across top enrollment states.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: customer-service-billing-dispute-telemetry
    missingEvidence: >-
      Direct provider churn and patient billing dispute metrics for TherapyMatch dba Headway in independent consumer
      review repositories.
    whyItMatters: >-
      Verifies whether administrative billing friction or patient out-of-pocket surprise charges degrade provider and
      patient retention.
    diligencePath: Audit Better Business Bureau complaints, state attorney general consumer filings, and provider NPS surveys.
    relatedQuestionRefs:
      - QR007
  - type: private-evidence-only
    severity: material
    topic: valuation-input-gap
    missingEvidence: >-
      Audited current revenue, gross margin, operating expenses, cash flow, cash balance, and payer-level unit
      economics.
    whyItMatters: >-
      These inputs are required to choose a valuation method, test cash runway, and calculate a supportable entry price
      or target return.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, and payer-level contribution-margin schedules
      under NDA.
    relatedQuestionRefs:
      - QV002
      - QV005
      - QV007
  - type: private-evidence-only
    severity: material
    topic: ownership-and-preferences
    missingEvidence: >-
      Fully diluted capitalization, option and warrant schedules, seniority, liquidation preferences, participation
      rights, and conversion terms.
    whyItMatters: >-
      Preferred-round post-money values do not reveal the investor's effective ownership, dilution, or downside
      waterfall.
    diligencePath: Review the signed charter, financing documents, cap table, and modeled proceeds waterfall for each exit scenario.
    relatedQuestionRefs:
      - QV003
      - QV007
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Current secondary bids, matched trades, management exit plan, IPO readiness, and recent comparable transaction
      multiples.
    whyItMatters: >-
      Without an observable liquidity path, hold period and realizable exit value cannot be estimated from the financing
      marks.
    diligencePath: >-
      Request recent secondary indications, board-approved liquidity planning, banker materials, and consistent revenue
      or EBITDA multiples for named comparables.
    relatedQuestionRefs:
      - QV004
      - QV006
      - QV007
