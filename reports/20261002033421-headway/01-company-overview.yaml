callouts:
  - calloutType: "insight"
    title: "Structural Moat via Two-Sided Administrative Arbitrage"
    body: "Headway's primary structural advantage stems from eliminating administrative friction for solo practitioners—70% of whom historically avoided commercial insurance due to credentialing complexity and delayed reimbursement. By providing free practice-management software and fronting reimbursement payments, Headway creates high provider retention while aggregating distributed clinician supply into a consolidated network that commercial payers must contract with to meet mental health parity mandates."
    claimRefs:
      - "CO001"
      - "CO005"
  - calloutType: "risk"
    title: "Clinical Safety Oversight and Provider Network Disparity"
    body: "As Headway expands from an initial billing layer into a nationwide clinical platform spanning over 75,000 independent providers, quality control and risk management become existential operational challenges. The platform's recent recruitment of clinical risk leadership highlights increasing exposure to high-risk behavioral events, provider impairment, suicide crisis management, and commercial payer credentialing audit scrutiny."
    claimRefs:
      - "CO008"
      - "CO010"
