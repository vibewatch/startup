company:
  name: "Headway"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Headway operates a software-enabled mental healthcare provider network connecting solo and group behavioral health clinicians with commercial insurance payers across the United States. Founded by Andrew Adams, Jake Sussman, Dan Ross, and Kevin Chan, the company has raised over $325M to $406M across seed through Series D-2 funding rounds, reaching a reported $2.3B to $2.38B valuation while confronting operational and clinical risk challenges inherent in nationwide insurance-native scale."
sections:
  - id: "corporate-identity-and-operating-model"
    title: "Corporate Identity, Operating Model, and Network Scale"
    body: "Headway (incorporated as TherapyMatch, Inc.) was established to dismantle systemic administrative barriers preventing behavioral health practitioners from participating in commercial insurance networks [CO001]. Headquartered in New York, NY, the platform provides free practice-management software for therapists—automating clinical credentialing, client benefit verification, insurance billing, and upfront payment reconciliation [CO001, CO005]. In exchange, Headway contracts directly with commercial health plans, receiving reimbursement commissions for expanding participating clinician network access [CO005]. As of late 2024 through 2026, the company operates across all 50 U.S. states, with reporting indicating between 33,000 and 75,000 participating providers serving over one million patients across more than 25 commercial insurance plans [CO005, CO008]. However, unaudited metrics such as active recurring revenue, GAAP gross margins, and net provider churn remain undisclosed private figures [CO012]."
    claimRefs:
      - "CO001"
      - "CO005"
      - "CO008"
      - "CO012"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Founding Team, Leadership Evolution, and Clinical Governance"
    body: "Headway was founded by Chief Executive Officer Andrew Adams alongside co-founders Jake Sussman, Dan Ross, and Kevin Chan [CO002, CO004]. Leadership has undergone structural transitions as the business scaled toward institutional healthcare maturity [CO006]. Co-founder Jake Sussman transitioned away from active operational management at Headway to launch youth-focused behavioral health venture Marble, concentrating ongoing executive dependency on Adams [CO006]. To institutionalize execution, Headway expanded its executive suite, recruiting Arnaud Ferreri as Chief Technology Officer, Jake Poses (former LinkedIn and Thumbtack executive) as VP of Product, Rob Sadow (former Bain consultant and Scoop CEO) as VP of Strategy & Operations, and promoting Rutger Flohil to Chief Revenue Officer [CO003]. Governance oversight includes major institutional representation from Andreessen Horowitz, where managing partner Scott Kupor joined the board of directors following the company's Series B financing [CO009]. Simultaneously, the organization has had to formalize dedicated clinical risk management infrastructure to handle patient safety events, provider impairment, and crisis escalations [CO010]."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO006"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO002"
      - "TO003"
  - id: "capitalization-and-milestone-trajectory"
    title: "Financing History, Secondary Liquidity, and Execution Trajectory"
    body: "Headway's capitalization trajectory reflects rapid valuation expansion backed by tier-one venture capital and healthcare-specialist investors [CO004, CO007, CO009, CO011]. Following seed backing from Accel, the company closed a $26M Series A round in November 2020 led by Thrive Capital and GV, reaching $32M in cumulative funding [CO004]. In May 2021, Andreessen Horowitz led a $70M Series B financing at a $750M post-money valuation [CO009]. Headway subsequently closed a $125M Series C round in October 2023 led by Spark Capital, entering unicorn status at a $1.0B valuation [CO007, CO011]. In July 2024, Spark Capital led a $100M Series D round valuing the firm at $2.3B, followed by secondary share expansions (Series D-1 and D-2) in August 2024 pricing shares at $12.01 for a post-money valuation of $2.38B and total capital raised reaching $406.42M [CO005, CO011]. Despite this rapid capital formation, exact liquidation preference seniority, cap table waterfalls, and audited annual cash burn remain unverified private data [CO012]."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO007"
      - "CO009"
      - "CO011"
      - "CO012"
    figureRefs:
      - "FO001"
