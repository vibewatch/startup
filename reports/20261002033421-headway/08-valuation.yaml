company:
  name: "Headway"
chapter:
  number: 8
  title: "Valuation"
  summary: "The retained evidence supports a research-more recommendation rather than a priced investment call: third-party sources place Headway's latest disclosed 2024 financing marks at $2.3B-$2.38B, but Forge reports limited market activity and the source set does not disclose current audited operating economics. The mark is therefore a historical financing reference, not evidence of current fair value or achievable liquidity."
sections:
  - id: "recommendation-and-price-discipline"
    title: "Recommendation and Price Discipline"
    body: >-
      The recommendation is research-more, with medium confidence in the historical financing facts but low confidence in any present fair-value conclusion. Tracxn still identifies the July 2024 Series D as Headway's latest round, while Forge's later August 2024 D-2 record implies a $2.38B post-money mark but labels market activity limited and publishes neither a Forge Price nor a last matched price. Those observations establish reference points, not executable entry or exit prices. Without current audited revenue, profitability, cash flow, retention, or ownership data in the retained source set, neither a target return nor a defensible hold period can be calculated. Entry discipline should therefore require NDA diligence before price negotiation, rather than treating the last preferred-round mark as fair value.
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financing-history-and-thesis-balance"
    title: "Financing History and Thesis Balance"
    body: >-
      Historical evidence shows substantial capital formation and early operating momentum, but not enough current economics to underwrite the 2024 step-up. TechCrunch reported a $70M Series B at a $750M valuation in May 2021, and Crunchbase quoted Headway's chief executive saying net revenue had grown ninefold over the prior year. By July 2024, Behavioral Health Business reported that Headway was closing a $100M round at $2.3B, while also noting that Headway declined to comment. Funding totals are not fully reconciled: Tracxn reports $321M across five rounds, whereas Clay reports $325.5M across six rounds. These amounts measure financing raised, not cash currently available, revenue, or enterprise value independently validated by a transaction.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV009"
      - "CV010"
    tableRefs:
      - "TV002"
  - id: "scenario-framework"
    title: "Bull, Base, and Bear Framework"
    body: >-
      Public evidence does not support point estimates or probability percentages for bull, base, and bear outcomes, so the scenarios are decision rules rather than forecasts. A bull outcome requires audited operating improvement sufficient to justify value above the $2.38B historical reference. A base outcome requires the investor to verify economics that preserve the $2.3B-$2.38B financing band without assuming that preferred-round pricing equals common-equity value. A bear outcome is any evidence of a down round, weak margins, impaired retention, or compliance-driven economics that warrants a value below the $2.3B reference or a deferred investment. The governing probability signal is documentary proof, not an invented percentage.
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV012"
      - "CV013"
      - "CV015"
    tableRefs:
      - "TV003"
  - id: "comparables-exit-and-final-diligence"
    title: "Comparables, Exit Readiness, and Final Diligence"
    body: >-
      Tracxn names SonderMind, Lyra Health, Headspace, Cerebral, and Talkspace among Headway's ranked operating competitors, but the retained evidence does not provide a consistent revenue, EBITDA, transaction, or public-market multiple for those companies. They are therefore operating references rather than valuation benchmarks. Headway's own help and compliance materials show that the platform spans credentialing, payer agreements, provider payments, coding, billing, audits, and documentation reviews; that breadth can support defensibility, but it also makes margin quality and compliance performance central to exit readiness. Final diligence should obtain audited statements, current cohort retention, payer economics, the fully diluted cap table and preference waterfall, and evidence of secondary liquidity. A failed response on any of those items is a thesis-break trigger.
    claimRefs:
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV016"
