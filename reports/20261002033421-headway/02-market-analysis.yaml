    title: Insurance-native adoption hierarchy
    type: pyramid
    summary: "A qualitative hierarchy of conditions required to turn population need into completed, reimbursable outpatient care."
    data:
      items:
        - label: Documented patient need
          detail: "The broad need estimate is a starting population proxy, not an addressable revenue pool."
          tone: neutral
        - label: Insurance affordability and eligibility
          detail: "A patient must have usable coverage or another affordable payment route."
          tone: neutral
        - label: Clinician participation
          detail: "Clinicians must accept insurance and maintain available appointment capacity."
          tone: neutral
        - label: Payer and credentialing enablement
          detail: "Network participation, benefit verification, coding, and claims infrastructure must work."
          tone: neutral
        - label: Referral and matching workflow
          detail: "Patients or medical referrers must reach a suitable provider and schedule care."
          tone: positive
        - label: Completed, documented, reimbursable care
          detail: "Attendance, compliant documentation, and claims review determine realized activity."
          tone: warning
    approximationNotes: "Qualitative hierarchy only; item size is not proportional, and no conversion rates are inferred."
    claimRefs: [CM005, CM007, CM008, CM010, CM013, CM014]
callouts:
  - calloutType: insight
    title: Network counts are reach proxies, not market size
    body: >-
      The 33,000- and 50,000-provider figures come from different vintages and company-originated
      disclosures. Without active-provider, visit-volume, reimbursement, and take-rate
      denominators, they cannot be converted into revenue or market share.
    claimRefs: [CM012, CM016]
  - calloutType: risk
    title: Administrative leverage can become platform dependence
    body: >-
      The workflow removes real credentialing and billing friction, but independent reporting
      records concerns about rate opacity, data control, and the ability to leave without
      disruption. Contract and cohort evidence is required before treating scale as durable.
    claimRefs: [CM007, CM015]
