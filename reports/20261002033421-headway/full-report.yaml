      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Moat via Two-Sided Administrative Arbitrage
            body: >-
              Headway's primary structural advantage stems from eliminating administrative friction for solo
              practitioners—70% of whom historically avoided commercial insurance due to credentialing complexity and
              delayed reimbursement. By providing free practice-management software and fronting reimbursement payments,
              Headway creates high provider retention while aggregating distributed clinician supply into a consolidated
              network that commercial payers must contract with to meet mental health parity mandates.
            calloutType: insight
            claimRefs:
              - CO001
              - CO005
          - type: callout
            title: Clinical Safety Oversight and Provider Network Disparity
            body: >-
              As Headway expands from an initial billing layer into a nationwide clinical platform spanning over 75,000
              independent providers, quality control and risk management become existential operational challenges. The
              platform's recent recruitment of clinical risk leadership highlights increasing exposure to high-risk
              behavioral events, provider impairment, suicide crisis management, and commercial payer credentialing
              audit scrutiny.
            calloutType: risk
            claimRefs:
              - CO008
              - CO010
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing discipline
        blocks:
          - type: paragraph
            body: >-
              The investable market boundary is the U.S. infrastructure and services layer that makes outpatient
              psychotherapy and medication management discoverable, insurable, schedulable, documentable, and
              reimbursable. It includes patient matching, clinician credentialing, payer-network enablement, eligibility
              and benefit workflows, claims administration, and referral coordination. It excludes unrelated uses of the
              word “headway,” including transit regularity analytics and the separate consumer book-summary application.
              A generic segmentation primer is useful only as a method: narrow the segment and compare market size,
              sales-cycle speed, cost structure, and feasibility risk. It is not evidence about Headway.co. This
              discipline prevents false-positive search results from becoming an artificial TAM and separates the core
              insurance workflow from adjacent clinical delivery, employer benefits, direct-pay therapy, and broad
              digital wellness spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Available evidence supports need, supply-friction, and platform-reach lenses, not a bottom-up revenue
              pool. TechCrunch reported in 2021 that roughly 82 million U.S. people had treatable conditions, while
              citing Headway’s estimate that 70% of therapists did not accept insurance and noting that about 85% of
              therapists were solo practitioners. Those figures are historical, partly company-originated, and do not
              establish how many people seek covered outpatient care, eligible reimbursement per episode, or Headway’s
              take rate. Company-issued 2025 material described 50,000 providers; a 2024 news report had described about
              33,000 providers and more than 25 insurance plans. The direction suggests network expansion, but
              definitions, active-provider denominators, and period comparability are undisclosed. Accordingly, these
              are adoption and reach proxies rather than TAM, SAM, revenue, or ARR.
            claimRefs:
              - CM005
              - CM006
              - CM012
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM012
              - CM013
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Headway’s model is multi-sided. Patients use search, insurance verification, booking, and care navigation;
              clinicians use credentialing, scheduling, documentation, coding, billing, and payment workflows; insurers
              fund covered sessions and gain network capacity; and referring medical organizations use integrated
              referral pathways. The company’s 2025 release said partnerships represented more than 15,000 clinicians
              and had generated more than 10,000 referrals, while the help center shows that adoption continues beyond
              discovery into recurring administrative work. A 2021 company claim reported five-day appointment access
              versus a 30-day insurance-directory average. These figures are not independent conversion benchmarks, but
              they clarify the sequence of adoption: network contract, clinician enablement, patient or referrer entry,
              matching, completed care, and reimbursable documentation.
            claimRefs:
              - CM004
              - CM007
              - CM011
              - CM013
              - CM014
