  - id: FO001
    title: Headway Corporate Milestone and Capitalization Timeline
    type: timeline
    summary: >-
      Chronological trajectory of Headway from founding through Series D capitalization and clinical governance
      expansion.
    approximationNotes: >-
      Timeline events reflect verified equity financing announcements, corporate milestones, and organizational
