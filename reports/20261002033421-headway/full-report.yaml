  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Argument
      - Thesis evidence
      - Anti-thesis / uncertainty
      - What would change the view
    rows:
      - - Historical growth
        - Headway's chief executive reported ninefold net-revenue growth for the year ended around May 2021.
        - The evidence is historical and company-attributed rather than a current audited growth series.
        - Audited quarterly revenue and cohort growth through 2026.
      - - Operational integration
        - Official materials span credentialing, payer agreements, provider payments, coding, billing, and audits.
        - Operational breadth can add compliance cost and does not establish attractive margins.
        - Gross margin by payer and evidence that audit losses remain controlled.
      - - Capital formation
        - Third-party databases report $321M-$325.5M raised over five or six rounds.
        - The discrepancy is unresolved, and funding raised is not cash available.
        - A fully reconciled financing schedule, cash balance, and use-of-proceeds bridge.
      - - Private valuation
        - The latest retained round references are $2.3B in July 2024 and $2.38B in August 2024.
        - >-
          Forge reports limited activity and explains that its post-money value is an estimate based on
          company-submitted incorporation certificates.
        - A recent arm's-length transaction plus current audited operating performance.
    notes: >-
      The table uses only the retained source set; company statements are identified as such and financing totals are
      not treated as revenue or liquidity.
