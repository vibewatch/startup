chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Model, and Network Scale
        blocks:
          - type: paragraph
            body: >-
              Headway (incorporated as TherapyMatch, Inc.) was established to dismantle systemic administrative barriers
              preventing behavioral health practitioners from participating in commercial insurance networks [CO001].
              Headquartered in New York, NY, the platform provides free practice-management software for
              therapists—automating clinical credentialing, client benefit verification, insurance billing, and upfront
              payment reconciliation [CO001, CO005]. In exchange, Headway contracts directly with commercial health
              plans, receiving reimbursement commissions for expanding participating clinician network access [CO005].
              As of late 2024 through 2026, the company operates across all 50 U.S. states, with reporting indicating
              between 33,000 and 75,000 participating providers serving over one million patients across more than 25
              commercial insurance plans [CO005, CO008]. However, unaudited metrics such as active recurring revenue,
              GAAP gross margins, and net provider churn remain undisclosed private figures [CO012].
            claimRefs:
              - CO001
              - CO005
              - CO008
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO008
              - CO009
              - CO011
              - CO012
      - number: '1.2'
        title: Founding Team, Leadership Evolution, and Clinical Governance
        blocks:
          - type: paragraph
            body: >-
              Headway was founded by Chief Executive Officer Andrew Adams alongside co-founders Jake Sussman, Dan Ross,
              and Kevin Chan [CO002, CO004]. Leadership has undergone structural transitions as the business scaled
              toward institutional healthcare maturity [CO006]. Co-founder Jake Sussman transitioned away from active
              operational management at Headway to launch youth-focused behavioral health venture Marble, concentrating
              ongoing executive dependency on Adams [CO006]. To institutionalize execution, Headway expanded its
              executive suite, recruiting Arnaud Ferreri as Chief Technology Officer, Jake Poses (former LinkedIn and
              Thumbtack executive) as VP of Product, Rob Sadow (former Bain consultant and Scoop CEO) as VP of Strategy
              & Operations, and promoting Rutger Flohil to Chief Revenue Officer [CO003]. Governance oversight includes
              major institutional representation from Andreessen Horowitz, where managing partner Scott Kupor joined the
              board of directors following the company's Series B financing [CO009]. Simultaneously, the organization
              has had to formalize dedicated clinical risk management infrastructure to handle patient safety events,
              provider impairment, and crisis escalations [CO010].
