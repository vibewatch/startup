  - id: FU001
    title: Headway Multi-Stakeholder Customer Journey Map
    type: journey-map
    summary: >-
      Visualizes the dual-loop journey across clinician onboarding and patient booking through health system, EAP, and
      directory channels.
    data:
      items:
        - label: Clinician Panel Credentialing
          touchpoints:
            - Submit single application covering multiple commercial payers
            - Headway processes panel credentialing within weeks vs traditional 90-120 days
            - Clinician activates profile on directory and receives electronic billing portal access
        - label: Client Intake & Channel Routing
          touchpoints:
            - Patient searches directory or receives referral from health system Booking Assistant or EAP
            - Instant insurance eligibility and copay estimation verified before first appointment
            - Patient books virtual or in-person session directly into clinician schedule
        - label: Session Delivery & Identity Verification
          touchpoints:
            - Patient and prescriber complete facial scan and government ID verification via Persona
            - Therapy or psychiatric session conducted via integrated video or in-person
            - Clinician submits session note and CPT codes using Headway clinical templates
        - label: Claims Adjudication & Provider Remittance
          touchpoints:
            - Headway generates clean claim and submits directly to commercial insurer
            - Pre-audit checks ensure treatment plan and progress notes meet compliance deadlines
            - Predictable provider payment remitted on schedule with clawback protection
        - label: Ongoing Compliance & Audit Defense
          touchpoints:
            - Periodic proactive chart reviews ensure compliance with NCQA and AMA standards
            - Automated session coding flags incompatible CPT modifiers before billing submission
            - Protected reimbursement remittance shields compliant providers from audit clawbacks
        - label: Enterprise Referral Expansion
          touchpoints:
            - Health system discharge coordinators track referral completion via referrer dashboards
            - EAP partners analyze benefit session utilization rates across corporate cohorts
            - Commercial insurers expand regional panel allocations based on appointment fill rates
    approximationNotes: Workflow synthesized from Headway Help Center guides and channel job specifications.
    claimRefs:
      - CU001
      - CU003
      - CU007
      - CU013
