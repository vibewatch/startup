      - number: '1.3'
        title: Financing History, Secondary Liquidity, and Execution Trajectory
        blocks:
          - type: paragraph
            body: >-
              Headway's capitalization trajectory reflects rapid valuation expansion backed by tier-one venture capital
              and healthcare-specialist investors [CO004, CO007, CO009, CO011]. Following seed backing from Accel, the
              company closed a $26M Series A round in November 2020 led by Thrive Capital and GV, reaching $32M in
              cumulative funding [CO004]. In May 2021, Andreessen Horowitz led a $70M Series B financing at a $750M
              post-money valuation [CO009]. Headway subsequently closed a $125M Series C round in October 2023 led by
              Spark Capital, entering unicorn status at a $1.0B valuation [CO007, CO011]. In July 2024, Spark Capital
              led a $100M Series D round valuing the firm at $2.3B, followed by secondary share expansions (Series D-1
              and D-2) in August 2024 pricing shares at $12.01 for a post-money valuation of $2.38B and total capital
              raised reaching $406.42M [CO005, CO011]. Despite this rapid capital formation, exact liquidation
              preference seniority, cap table waterfalls, and audited annual cash burn remain unverified private data
              [CO012].
