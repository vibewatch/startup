  - id: TV001
    title: Recommendation Summary
    columns:
      - Decision field
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - >-
          Historical financing marks are observable, but current operating economics are not disclosed in the retained
          evidence.
        - Do not issue a priced investment recommendation before NDA diligence.
      - - Confidence
        - Medium on financing history; low on current fair value
        - Multiple third parties report the 2024 round, while Forge describes limited activity and no matched price.
        - Separate confidence in recorded rounds from confidence in realizable value.
      - - Risk rating
        - High
        - >-
          Private-market illiquidity, valuation-method limits, funding-total discrepancies, and missing current
          economics remain unresolved.
        - Require downside protection and documentary verification before term-sheet work.
      - - Valuation stance
        - Insufficient public support
        - $2.3B-$2.38B is a 2024 financing-reference band, not a current fair-value conclusion.
        - Use the band only as a negotiation reference until current performance is verified.
      - - Return / hold / exit
        - Not supportable from public evidence
        - >-
          The retained sources do not disclose current cash flows, ownership, dilution, or an executable secondary
          price.
        - Defer target-return and hold-period modeling until the cap table and operating model are available.
    notes: >-
      Assessments distinguish reported preferred-financing marks from current fair value; missing public inputs are
      treated as diligence gaps, not estimated.
