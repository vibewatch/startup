  - id: TV003
    title: Bull, Base, and Bear Decision Scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks and downside triggers
      - Probability signal
    rows:
      - - Bull
        - Audited growth, attractive payer-level margins, durable provider retention, and manageable compliance losses.
        - >-
          Value above $2.38B is considered only after verified operating improvement beyond the historical financing
          evidence.
        - Growth deceleration, adverse payer repricing, or weak retention breaks the case.
        - No public probability; signal is audited outperformance against the investment model.
      - - Base
        - Current economics validate the business while neither accelerating nor deteriorating materially.
        - >-
          $2.3B-$2.38B remains a reference band, subject to dilution and preference analysis; it is not assumed to be
          fair value.
        - Preference overhang, weak cash conversion, or no secondary liquidity requires a lower entry price.
        - No public probability; signal is verified performance consistent with the financing case.
      - - Bear
        - A down round, weak margins, impaired retention, or compliance-related losses undermine the financing case.
        - Value falls below the $2.3B reference or the investment is deferred; no precise floor is supportable.
        - Unreconciled economics, payer pressure, audit losses, or blocked liquidity are thesis-break triggers.
        - No public probability; signal is any verified breach of the base-case diligence thresholds.
    notes: >-
      These are conditional decision rules, not forecasts; the source pool does not support precise fair-value ranges,
      return targets, or scenario probabilities.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV012
      - CV013
      - CV015
