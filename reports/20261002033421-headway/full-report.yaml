    data:
      items:
        - label: Company Founding
          detail: Andrew Adams founds Headway in New York after personal frustrations navigating in-network therapy access.
          date: '2017-01-01'
          tone: positive
        - label: Founding Team Formation
          detail: >-
            Adams joins co-founders Jake Sussman, Dan Ross, and Kevin Chan to launch the software-enabled insurance
            platform.
          date: '2019-01-01'
          tone: positive
        - label: Series A Financing
          detail: Headway secures $26M in Series A funding led by Thrive Capital and GV, reaching $32M in total funding.
          date: '2020-11-18'
          tone: positive
        - label: Series B Financing
          detail: Raises $70M at a $750M valuation led by Andreessen Horowitz; Scott Kupor joins the board of directors.
          date: '2021-05-04'
          tone: positive
        - label: Series C Unicorn Round
          detail: Closes $125M Series C financing led by Spark Capital, achieving a $1.0B post-money valuation.
          date: '2023-10-05'
          tone: positive
        - label: National Network Expansion
          detail: Expands behavioral health network to all 50 states, reaching 33,000 providers across 25+ commercial plans.
          date: '2023-12-15'
          tone: positive
        - label: Co-Founder Transition
          detail: >-
            Co-founder Jake Sussman steps down from operational leadership to launch youth behavioral health venture
            Marble.
          date: '2024-06-21'
          tone: warning
        - label: Series D Financing
          detail: Secures $100M Series D round led by Spark Capital at a $2.3B valuation, doubling valuation year-over-year.
          date: '2024-07-23'
          tone: positive
        - label: Series D-2 Expansion
          detail: Completes Series D-2 secondary and equity expansion at $12.01 per share for a $2.38B post-money valuation.
          date: '2024-08-29'
          tone: positive
        - label: Executive Suite Expansion
          detail: >-
            Appoints Jake Poses as VP Product, Rob Sadow as VP Strategy, and promotes Rutger Flohil to Chief Revenue
            Officer.
          date: '2025-03-20'
          tone: positive
        - label: Clinical Risk Program Institutionalization
          detail: >-
            Establishes dedicated nationwide safety event and clinical risk governance infrastructure across 75,000+
            providers.
          date: '2026-09-21'
          tone: warning
