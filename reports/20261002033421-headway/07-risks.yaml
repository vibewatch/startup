    title: "The Clawback Guarantee as a Concentrated Contingent Liability"
    body: "Headway guarantees protection from insurer clawbacks for clinicians who maintain session documentation within its proprietary clinical templates. While this serves as a powerful acquisition hook for independent therapists, it aggregates retrospective audit liabilities onto Headway's balance sheet if commercial payers challenge clinical necessity at scale."
    claimRefs:
      - "CR008"
      - "CR010"
      - "CR012"
