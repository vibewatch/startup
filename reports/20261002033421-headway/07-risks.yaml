    title: "Statutory Privacy Litigation Creates Precedent for Digital Health Intake Portals"
    body: "The federal court ruling permitting CCPA Section 1798.150 and CIPA interception claims against TherapyMatch underscores that consumer mental health intake directories are subject to rigorous data governance standards regarding third-party client-side web analytics."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
