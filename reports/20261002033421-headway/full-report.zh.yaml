        title: 图表展台
        blocks:
          - type: callout
            title: 网络服务商数量仅为触达指标，不可等同于市场规模
            body: 33,000 和 50,000 名服务商这两组数据出自不同统计时期，且均源自公司单方面披露。在缺乏活跃服务商比例、接诊量、单次报销金额以及抽成率等分母数据的情况下，无法将其折算为实际收入或市场份额。
            calloutType: insight
            claimRefs:
              - CM012
              - CM016
          - type: callout
            title: 行政赋能杠杆或演变为平台依赖陷阱
            body: 这套业务流程确实消除了资质审核与账单理赔的实际阻碍，但独立报道记录了业界对费率不透明、数据掌控权以及能否平稳脱离平台的深层担忧。在将当前网络规模视为长期壁垒之前，必须掌握确凿的合同条款和留存队列数据作为佐证。
            calloutType: risk
            claimRefs:
              - CM007
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与结构性替代方案
        blocks:
          - type: paragraph
            body: >-
              Headway（TherapyMatch, Inc.）所面临的竞争格局横跨多种截然不同的运营模式，并非由单一同质化竞品构成。在核心的心理健康赋能领域，直接竞品 Alma 和 Grow Therapy
              同样针对门诊心理健康的核心痛点：此前逾 70% 的独立执业咨询师因行政繁复、理赔拒付和漫长的资质审批周期而避开医保。在直接做医保赋能的中间平台之外，临床医生还会在一体化临床电子病历（EHR）平台（如
              SimplePractice、TherapyNotes）、传统自费黄页名录（如 Psychology Today）以及诊所自建计费之间权衡选择。尽管 Headway
              不收取任何前期费用或月度订阅费，降低了入驻门槛，但竞品平台凭借更深度的临床 EHR 病历模板、内置的 HIPAA
              合规视频工具，或是更广泛的政府医保覆盖网络，形成了差异化价值主张。此外，在消费端和开发者市场，同名软件产品（如书籍摘要移动应用和开发者更新日志小组件）在各大搜索入口引发了严重的品牌混淆与干扰。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP007
              - CP013
      - number: '3.2'
        title: 竞品运营画像与商业变现模型
        blocks:
          - type: paragraph
            body: >-
              心理健康赋能平台最根本的结构性分歧，在于变现架构与技术集成的切入点不同。Headway
              采用间接变现模式，不向医生收取月度会员费，转而在核准结算的商业医保理赔款（claims）中抽取分成或赚取利差。相比之下，老对手 Alma 明确收取月度或年度会员订阅费，同时打包提供包含内置 EHR
              病历、HIPAA 合规远程诊疗和黄页推荐位在内的全套生态。在资质审批周期上，Alma 往往需要长达 45 天，而 Headway 主打极速入驻，通常在 2 至 4
              周内完成服务商审核。与此同时，同样有风投支持的直接竞品 Grow Therapy 在保险覆盖面上对 Headway 展开正面挤压，拿下逾 125 家商业保险、Medicaid 及 Medicare 计划的签约，而
              Headway 主要聚焦商业健康险与精选的 Medicare Advantage 险种。对于接诊量大的诊所，在 Headway
              上按比例持续被抽成，累计支出反而可能超过固定的软件订阅费，促使服务商在多个平台间脚踩多只船（multi-homing）。
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP008
