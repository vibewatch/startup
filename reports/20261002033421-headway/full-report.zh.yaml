      - number: '8.3'
        title: 乐观、基准与悲观情景推演框架
        blocks:
          - type: paragraph
            body: >-
              现有公开证据无法支撑针对乐观、基准和悲观情景的点位估算或发生概率测算，因此这里的推演仅作为决策准则，而非精确预测。乐观情景成立的前提是，经审计的经营数据出现显著改善，足以支撑估值超越 $2.38B
              的历史参考位。基准情景要求投资人通过核实实际财务数据，确认估值能够守住 $2.3B 至 $2.38B 的融资区间，同时切不可将优先股每股价格直接等同于普通股价值。悲观情景则是指出现流血轮（down
              round）、利润率疲软、留存恶化或合规风暴压制经济模型等证据，导致合理估值跌破 $2.3B 基准线，或促使投资人推迟决策。决定情景权重的唯一依据是确凿证据，而非凭空估算的概率百分比。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
