      - number: '1.4'
        title: 图表展台
        blocks:
          - type: callout
            title: 双边行政套利筑起的结构性壁垒
            body: >-
              Headway 最核心的结构性优势在于替个体从业者扫除行政障碍——此前有 70% 的咨询师因资质审批繁琐、回款周期冗长而避开商业医保。借助免费的诊所管理软件和垫付报销款机制，Headway
              锁定了极高的服务商留存率，同时把分散的医生供给聚合成规模化网络；商业保险机构为满足心理健康同等保障法定要求，不得不与这套网络签约。
            calloutType: insight
            claimRefs:
              - CO001
              - CO005
          - type: callout
            title: 临床安全监管压力与服务商网络离散风险
            body: >-
              随着 Headway 从最初的账单结算工具扩张为连接逾 75,000
              名独立服务商的全国性临床平台，质量把控与风险管理变成了生死攸关的运营考验。平台近期招募临床风险主管，凸显其正面临越来越重的暴露风险：高危心理异常事件、医生执业能力受损、自杀危机干预，以及来自商业保险机构的资质审核与核查压力。
            calloutType: risk
            claimRefs:
              - CO008
              - CO010
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算原则
        blocks:
          - type: paragraph
            body: >-
              可投资的市场边界，限定在让全美门诊心理咨询与药物管理能够被检索、纳入医保、排班预约、书写病历并完成报销的底层基础设施与服务层。该边界涵盖患者匹配、医生资质认证、支付方网络接入、医保资格与权益流转、理赔（claims）管理以及转诊协同。凡是与
              “headway”
              同名但不相关的领域均排除在外，例如公交准点率分析软件以及同名的个人读书摘要应用。通用的市场分段手册只能当作分析框架使用：收窄细分市场，并对比市场体量、销售周期、成本结构及落地可行性风险，它不能作为证明
              Headway.co 业务实况的依据。坚持这一划界原则，既能防止因同名误搜虚增 TAM，也能把核心医保工作流与周边的临床诊疗交付、雇主福利计划、自费心理咨询以及泛数字化健康支出清晰剥离开来。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
      - number: '2.2'
        title: 基于现有证据的市场测算视角
        blocks:
          - type: paragraph
            body: >-
              现有证据只能从需求端、供给摩擦以及平台触达面等维度提供测算参照，不足以拼出完整的自下而上收入池。TechCrunch 在 2021 年曾报道全美约有 8,200 万人患有可治疗的心理疾患，同时援引 Headway
              的估算称，70% 的心理咨询师不接医保，并指出约 85% 的咨询师属于独立执业者。这些数据属于历史信息，且部分出自公司自身口径，既无法推算出究竟有多少人会寻求医保覆盖的门诊诊疗，也无法证实单次就诊的合规报销额度或
              Headway 的抽成比例。公司在 2025 年发布的官方资料中称其拥有 50,000 名服务商；而 2024 年的一篇新闻报道则称其拥有约 33,000 名服务商和逾 25
              家保险计划。这一趋势反映出网络正在扩张，但指标统计口径、活跃服务商分母以及跨周期可比性均未公开。因此，这些指标只能作为采纳度与触达规模的替代参考，不能直接等同于 TAM、SAM、收入或 ARR。
            claimRefs:
              - CM005
              - CM006
              - CM012
              - CM016
