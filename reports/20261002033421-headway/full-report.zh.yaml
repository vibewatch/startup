      - number: '2.3'
        title: 买方、用户、支付方与推广采纳路径
        blocks:
          - type: paragraph
            body: >-
              Headway
              采用多边运作模式。患者端使用搜索、医保核验、预约和就诊导航；医生端使用资质审核、排期、病历记录、诊疗编码、账单理赔和回款工作流；保险机构出资覆盖受保诊疗并扩充网络接诊供给；转诊医疗机构则借由一体化转诊通道分流病患。公司在
              2025 年发布的信息称，合作渠道已覆盖逾 15,000 名临床医生，累计带来超过 10,000 次转诊；其帮助中心内容也表明，服务商使用早已超出最初获客查找，延伸到了日常行政事务中。公司曾在 2021
              年声称，平台预约等待时间仅为 5 天，远快于传统医保名录平均 30
              天的水平。这些数据并非独立第三方转化基准，但清晰勾勒出了业务采纳的递进链条：签约医保网络、赋能医生入驻、患者或转诊方接入、完成匹配、交付诊疗，最后形成可报销的医疗文档。
            claimRefs:
