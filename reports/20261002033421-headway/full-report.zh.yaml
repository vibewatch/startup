      - number: '3.3'
        title: 功能对比、切换成本与锁定效应
        blocks:
          - type: paragraph
            body: >-
              评估各平台能力可以发现，专业工作流工具与网络接入资格之间存在关键取舍。Headway 提供轻量级 EHR
              病历记录工具和自动化接诊账单核验，但医生若不使用其简易内置远程诊疗功能，就必须自行配备第三方视频软件。相比之下，SimplePractice 这类全栈 EHR
              套件提供更完备的治疗方案规划、患者门户以及归医生自主把控的计费工具，只是缺少统一谈判医保费率的杠杆。Headway 与 Alma
              共同面临的一大结构性屏障是合同可携带性：在平台统括团体合同下完成资质认证的咨询师，并不直接拥有底层的医保合作关系。一旦医生离开
              Headway，其在相应保险协议下的网内报销资格立即终止，迫使患者自费或被迫转诊。病历导出限制与合规审查压力，进一步推高了迁移成本。为化解审计风险，Headway 推行严格的临床病历规范，要求 14
              天内提交治疗方案、72 小时内写完随访记录，并承诺对符合规范的病案提供审计追偿赔付保障。
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP011
              - CP012
