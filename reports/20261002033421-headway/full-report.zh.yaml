      - number: '7.2'
        title: 运营、质量与审计风险：追偿兜底承诺带来的赔付暴露
        blocks:
          - type: paragraph
            body: >-
              在运营端，Headway 面向独立医生及诊所的核心价值主张是剥离行政事务，尤其是承诺：只要医生使用 Headway 规范的病历模板，就能免遭保险公司的追偿扣款（clawbacks）。在 Headway
              的运营模式下，平台按规律每两周向医务工作者提前垫付报销款，自行吸纳底层的收入周期（RCM）风险。当健康险机构为排查欺诈、浪费与滥用开展回溯性审计时，不当的最新医疗操作术语（CPT）编码或残缺的治疗方案都可能招致退款索赔。


              尽管 Headway 设有自动化就诊确认流程，能根据诊疗参数校验 CPT
              编码，但落实效果仍分散在数万名独立签约医生身上。一旦保险机构判定历史理赔存在系统性违规，这项追偿兜底承诺便会将个别医生的回溯审计损失全额转嫁到 Headway 自身的资产负债表上。此外，尽管 Headway
              大力推广 AI 辅助病程记录和病历预填工具来减轻行政负担，但在保险机构严格的医保利用度审查（utilization reviews）中，自动生成的文书极易因模板雷同化而引发合规质疑。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
