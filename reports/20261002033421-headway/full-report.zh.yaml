      - number: '6.4'
        title: 业务韧性、合规审查与生物识别引发的摩擦
        blocks:
          - type: paragraph
            body: >-
              平台的长期黏性与服务商留存率，取决于行政风控与临床风险管理规则。为防范审计追偿，Headway 推行严苛的心理健康病案标准，要求 14 天内提交治疗方案，随访记录最好在 24 小时内（最迟不超过 72
              小时）写完。为遏制远程医疗欺诈，Headway 引入供应商
              Persona，强制要求患者和医生进行面部生物识别扫描与政府身份证件核验；此举遭到心理治疗行动网络（PsiAN）等专业协会的强烈抵制，甚至引发服务商出走弃用的威胁。此外，与 Grow Therapy
              等竞品的正面比拼暴露出其结构性短板：Headway 仅在极少数方案中开放 Medicaid 和 Medicare 准入，且缺乏患者自助工具及自费支付通道。
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: 图表展台
        blocks:
          - type: callout
            title: 强制生物识别核身恶化医患双方信任
            body: >-
              通过第三方供应商 Persona
              强制推行面部几何特征扫描和官方身份证件核验，引发了临床从业人员与隐私维权人士的强烈抗议。医生指责这种客户监视手段违背职业伦理，且担忧就诊未通过核验将导致回款冻结，给服务商留存造成明显裂痕。
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
          - type: callout
            title: 摆脱黄页搜索依赖的机构化渠道多元布局
            body: 通过为医疗系统转诊、EAP 员工福利渠道及保险商联名合作开发专门的受理与预约系统，Headway 筑起了兼具防御力的企业级集成壁垒，相比 C 端广告投放大幅降低了获客成本。
            calloutType: strength
            claimRefs:
              - CU007
              - CU008
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险：隐私审查与健康数据合规治理
        blocks:
          - type: paragraph
            body: >-
              Headway（法定注册名称为 TherapyMatch, Inc.）面临严重的健康数据隐私监管执法风险与各州法定追责暴露。2024 年 9 月，加州联邦地区法院在一场集体诉讼（原告 M.G. 于 2023 年
              7 月首次提起）中部分驳回了 Headway
              的撤诉动议，裁定原告依据《加州消费者隐私法》（CCPA）与《加州侵犯隐私法》（CIPA）提出的指控继续审理，同时驳回依据《医疗信息保密法》（CMIA）提出的诉求并准予修改起诉状。该诉讼指控 Headway
              植入了第三方追踪技术（具体为未启用 IP 匿名化的 Google Analytics），在未获充分知情同意且未采取加密的情况下，将敏感的心理健康搜索词、联系方式及医保信息传输至外部服务器。鉴于 Headway
              是连接潜在患者与心理医生的首道受理门户，在各州不断收紧的隐私司法解释下，上传涉及特定精神病症的搜索条件已构成敏感数据泄露。


              除了消费者法定隐私诉讼，Headway
              还必须应对繁复的医疗监管病历标准。平台要求临床医疗记录同时满足联邦医疗保险与医疗补助服务中心（CMS）、美国医学会（AMA）、美国国家质量保证委员会（NCQA）及各商业健康险设定的规范。Headway
              强制要求就诊结束后 24 至 72 小时内补齐临床病历，商业医保的治疗方案每 180 天须重新评估一次，Medicaid 受保人则每 90
              天须更新一次。挂靠医生一旦未能遵守这些时限，将导致整个网络面临保险公司的审计处罚及追溯性理赔扣回。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
