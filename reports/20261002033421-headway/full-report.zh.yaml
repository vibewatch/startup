      - number: '8.2'
        title: 融资历程与投资逻辑权衡
        blocks:
          - type: paragraph
            body: >-
              历史证据表明公司具备强劲的融资格局与早期运营冲劲，但当前的财务数据尚不足以支撑 2024 年的大幅估值跳涨。TechCrunch 报道了 2021 年 5 月以 $750M 估值完成的 $70M B
              轮融资；Crunchbase 则引述 Headway 首席执行官的原话称，净收入较上一财年增长了九倍。到了 2024 年 7 月，Behavioral Health Business 报道称 Headway
              即将以 $2.3B 估值敲定一笔 $100M 融资，同时也提到 Headway 官方拒绝对此置评。第三方机构统计的累计融资金额未能完全对齐：Tracxn 显示五轮共计 $321M，而 Clay 记录六轮累计
              $325.5M。这些金额仅衡量历史融得资金总额，绝非账面现有资金头寸、实际营收，亦非经过公允交易独立验证的企业价值。
