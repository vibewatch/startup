      - number: '1.2'
        title: 创始团队、高管迭代与临床治理
        blocks:
          - type: paragraph
            body: >-
              Headway 由首席执行官 Andrew Adams 与联合创始人 Jake Sussman、Dan Ross 和 Kevin Chan 共同创办 [CO002,
              CO004]。随着业务向更成熟的医疗机构级运营迈进，管理团队经历了几轮结构性调整 [CO006]。联合创始人 Jake Sussman 退出 Headway 一线运营管理，转而创立主打青少年心理健康的创业项目
              Marble，这使得公司的日常高管依赖集中在 Adams 一人身上 [CO006]。为推进执行机制制度化，Headway 扩充了高管团队：聘请 Arnaud Ferreri 出任首席技术官，引入 LinkedIn
              与 Thumbtack 前高管 Jake Poses 担任产品副总裁，招募 Bain 前咨询顾问兼 Scoop 前 CEO Rob Sadow 担任战略与运营副总裁，并将 Rutger Flohil
              提拔为首席营收官 [CO003]。董事会治理层面引入了顶级机构代表，Andreessen Horowitz 管理合伙人 Scott Kupor 在公司 B 轮融资后加入董事会
              [CO009]。与此同时，公司不得不搭建专门的临床风险管理机制，用以处置患者安全事件、医生执业能力受损以及危机事件升级 [CO010]。
