  - id: FE001
    title: 公开披露的产品与技术架构
    type: stack
    summary: 六大已公开技术层串联起用户体验、保险业务运营、云端运行时、数据基础设施与控制面板。
    data:
      layers:
        - label: 患者端体验
          detail: C 端交易市场、医患匹配与就诊导航
          modules:
            - React
            - Next.js
            - Remix
        - label: 医生端体验
          detail: EHR、排班日程、远程医疗、病历记录与诊所日常运营
          modules:
            - Helix
            - React Aria
            - Tailwind
        - label: 保险业务运营
          detail: 资质准入、编码校验、理赔报销（claims）、款项支付与信任安全
          modules:
            - Python 3
            - FastAPI
        - label: 应用运行时
          detail: 托管计算、存储与事件流处理
          modules:
            - AWS Fargate
            - ECS
            - S3
            - Kafka
            - Spark
        - label: 数据平台
          detail: 数仓、数据摄取、任务编排、CI/CD 与开发者体验
          modules:
            - Snowflake
            - AWS
        - label: 监控与账户风控
          detail: 应用监控、故障告警、系统诊断与用户安全防护
          modules:
            - Datadog
