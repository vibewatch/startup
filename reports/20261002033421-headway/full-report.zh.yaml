              tone: positive
            - label: 薪酬集成系统停机
              tone: positive
            - label: 医生身份信息泄露
              tone: neutral
            - label: 州级 Medicaid 处罚
              tone: critical
            - label: 核心保司终止合作
              tone: critical
            - label: 全国网络瓦解
              tone: critical
    approximationNotes: 基于公开监管文件、集体诉讼案卷及合同架构评估。
