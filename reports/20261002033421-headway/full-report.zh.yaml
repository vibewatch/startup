      - number: '8.4'
        title: 可比公司、退出成熟度与终审尽调要项
        blocks:
          - type: paragraph
            body: >-
              Tracxn 将 SonderMind、Lyra Health、Headspace、Cerebral 和 Talkspace 列为 Headway
              的核心同业竞品，但现有留存证据未能提供这些公司在收入、EBITDA、私募交易或公开市场维度的统一估值倍数。因此，它们只能作为业务运营参考，无法充当严格的估值对标标尺。Headway
              自身的帮助文档与合规资料显示，其平台业务纵深跨越资质认证、保司签约、医生结算、编码、账单理赔、审计以及病历复核；这种业务跨度固然能加固护城河，但也让毛利质量与合规表现成为衡量其是否具备退出条件的焦点。终审尽调必须调取经审计的财务报表、最新的队列留存数据、支付方真实分成条款、完全稀释后的股权结构表与清算优先权分配细则（waterfall），以及二级老股交易流动性凭证。在上述任何一项上若出现负面反馈，均构成推翻投资逻辑（thesis-break）的触发信号。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: 图表展台
        blocks:
          - type: callout
            title: 切勿将上一轮融资定价直接等同于当前公允价值
            body: $2.3B 至 $2.38B 区间仅属于历史优先股融资参考点。二级老股交易寥寥、估值方法局限，加之最新运营经济数据的缺失，使得当下无法给出站得住脚的定价投资建议。
            calloutType: recommendation
