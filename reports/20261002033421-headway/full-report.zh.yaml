chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 法人主体、运营模式与网络规模
        blocks:
          - type: paragraph
            body: >-
              Headway（法定注册名称为 TherapyMatch, Inc.）成立初衷是打破阻碍心理健康从业者接入商业医保网络的系统性行政壁垒
              [CO001]。公司总部位于纽约州纽约市，为咨询师提供免费的诊所管理软件，将临床资质认证、客户报销权益核验、医保账单理赔和前期回款核对全流程自动化 [CO001, CO005]。作为交换，Headway
              直接与商业健康险计划签约，靠扩充入网医生资源抽取报销佣金 [CO005]。截至 2024 年底至 2026 年，公司业务已覆盖全美 50 个州；据报道，平台拥有 33,000 至 75,000
              名入网服务商，对接逾 25 家商业保险计划，累计服务超过 100 万名患者 [CO005, CO008]。不过，实际经常性收入、GAAP
              口径毛利率以及服务商净流失率等未经审计的核心指标，仍属于未公开披露的私密数据 [CO012]。
            claimRefs:
              - CO001
              - CO005
              - CO008
              - CO012
