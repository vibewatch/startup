  - id: FU001
    title: Headway 多方协同客户旅程图
    type: journey-map
    summary: 直观呈现医生入驻与患者预约的双环旅程，打通医疗系统、EAP 及名录引流等渠道。
    data:
      items:
        - label: 医生保司准入与资质认证
          touchpoints:
            - 单次提交申请即可覆盖多家商业保司
            - 传统准入需 90-120 天，Headway 数周内即可完成保司入网核准
            - 医生在名录激活个人主页，并开通电子账单门户权限
        - label: 患者接诊与渠道分流
          touchpoints:
            - 患者检索名录，或接收来自医疗系统预约助手及 EAP 的转诊
            - 首次面诊前实时核验医保资格并预估自付额
            - 患者直接预约医生日程中的线上或线下问诊
        - label: 就诊履约与身份认证
          touchpoints:
            - 患者与处方医生借助 Persona 完成人脸扫描与政府签发证件核验
            - 内置视频连线或面对面完成心理咨询与精神科诊疗
            - 医生使用 Headway 临床模板提交问诊记录与 CPT 编码
        - label: 理赔审核与款项划拨
          touchpoints:
            - Headway 生成合规理赔单（clean claim）并直连商业保司申报
            - 事前预审机制确保诊疗方案与病程记录符合合规时限要求
            - 按预定时间向医生准时付款，并提供保司追索保护
        - label: 持续合规与审计抗辩
          touchpoints:
            - 定期主动抽查病历，确保符合 NCQA 与 AMA 行业标准
            - 系统在账单申报前自动校验问诊编码，标记不兼容的 CPT 修饰符
            - 回款受保护机制为合规医生提供防火墙，免受事后审计追索冲击
        - label: 企业与机构转诊拓展
          touchpoints:
            - 医疗系统出院协调员在转诊看板上实时追踪转介闭环情况
            - EAP 合作伙伴按企业客群分析福利诊疗额度的使用率
            - 商业保司根据实际约诊完成率，动态扩容区域医生入网名额
    approximationNotes: 工作流根据 Headway 帮助中心操作指南及各渠道岗位规范整理而成。
    claimRefs:
      - CU001
      - CU003
      - CU007
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 比对主要风险类别的发生概率与运营影响严重程度的评估矩阵。
    data:
      columns:
        - 影响可忽略
        - 轻微影响
        - 中度影响
        - 显著影响
        - 严重影响
        - 致命影响
      rows:
        - label: 几乎必然发生
          values:
            - label: 日常摩擦
              tone: positive
            - label: 病历记录滞后
              tone: neutral
            - label: 资质认证积压
              tone: neutral
            - label: 审计款项追缴
              tone: critical
            - label: 监管严查
              tone: critical
            - label: 隐私诉讼风险敞口
              tone: critical
        - label: 高概率
          values:
            - label: 低风险敞口
              tone: positive
            - label: 中度摩擦
              tone: neutral
            - label: 高强度监管审视
              tone: neutral
            - label: 保司合同重新谈判
              tone: critical
            - label: 追索兜底担保敞口
              tone: critical
            - label: 法定集体诉讼风险
              tone: critical
        - label: 中等概率
          values:
            - label: 低影响
              tone: positive
            - label: 中等风险
              tone: neutral
            - label: 营运垫资周转滞后
              tone: neutral
            - label: 报销费率承压缩水
              tone: critical
            - label: 保司合同集中度过高
              tone: critical
            - label: 医生流失压力
              tone: critical
        - label: 低概率
          values:
