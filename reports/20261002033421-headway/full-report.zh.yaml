        - 据第三方数据库报告，公司通过 5 至 6 轮融资累计获得 $321M-$325.5M。
        - 该统计分歧仍未化解，且累计融资金额并不等同于可用现金。
        - 完全勾稽一致的融资明细表、现金余额以及募集资金用途对应表。
      - - 一级市场估值
        - 留存的最新轮次参考估值分别为 2024 年 7 月的 $2.3B 和 2024 年 8 月的 $2.38B。
        - Forge 报告称交易活跃度有限，并说明其投后估值系根据公司提交的公司注册证书所做的估计。
