  - id: TV003
    title: 乐观、基准与悲观决策情景
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 核心风险与下行触发条件
      - 概率信号
    rows:
      - - 乐观
        - 经审计的业绩增长、各支付方良好利润率、稳固的提供方留存率以及可控的合规损失。
        - 仅在证实运营改善已超出历史融资证据时，才考虑 $2.38B 以上的估值。
        - 增速放缓、支付方不利重定价或留存疲软均将推翻该逻辑。
        - 无公开概率；观察信号为经审计业绩超出投资模型预期。
      - - 基准
        - 当前实际财务表现印证商业模式，既未显著提速也未出现实质性恶化。
        - $2.3B-$2.38B 仍作为参考区间，具体取决于股权稀释与优先清算权分析；并不推定其为公允价值。
        - 优先股溢价负担、微弱的现金转化或老股缺乏流动性，均要求更低的入场价格。
        - 无公开概率；观察信号为经核实的业绩表现与融资预期相符。
      - - 悲观
        - 发生折价融资（down round）、利润率微薄、留存受损或合规相关损失，动摇融资逻辑。
        - 估值跌破 $2.3B 参考线或推迟投资；现有证据无法支撑明确的估值底线。
        - 财务数据无法勾稽、支付方施压、审计损失或流动性受阻，均构成逻辑破局触发点。
        - 无公开概率；观察信号为核实发现任何突破基准情景尽调底线的情况。
    notes: 此类内容属于前置决策规则，并非预测；信源储备并不支持给出精确的公允价值区间、回报目标或情景概率。
