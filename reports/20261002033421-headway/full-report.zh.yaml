  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              投资建议定级为继续研究（research-more）：对历史融资事实保持中等置信度，但对当前的公允价值判断置信度偏低。Tracxn 仍将 2024 年 7 月的 D 轮列为 Headway 的最新轮次；Forge
              随后在 2024 年 8 月记录的 D-2 轮虽然给出了 $2.38B 的投后参考线，但标注二级市场交易受限，且未公布 Forge 参考价（Forge
              Price）或最新成交价。这些公开信息仅能充当参考基准，并非可撮合执行的买入或卖出价格。在手头留存证据欠缺最新的经审计收入、盈利水平、现金流、留存率或股权结构数据的情况下，既无法推算目标回报率，也无法给出站得住脚的持有期限。入场纪律应严格要求在开启价格谈判前签署保密协议（NDA）展开排他尽调，绝不可直接将上一轮优先股估值视作公允价值。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
