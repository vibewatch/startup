figures:
  - id: FO001
    title: Headway 企业发展里程碑与资本化时间线
    type: timeline
    summary: 梳理 Headway 从创立、经历 Series D 资本化到建立临床治理体系的时间线轨迹。
    approximationNotes: 时间线事件反映了已核实的股权融资公告、企业里程碑与组织发展沿革。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO009
      - CO010
      - CO011
    data:
      items:
        - label: 公司成立
          detail: 在亲历寻找网络内心理治疗无门的痛点后，Andrew Adams 于纽约创立 Headway。
          date: '2017-01-01'
          tone: positive
        - label: 创始团队成型
          detail: Adams 联合 Jake Sussman、Dan Ross 和 Kevin Chan 共同启动该软件驱动型保险服务平台。
          date: '2019-01-01'
          tone: positive
        - label: Series A 轮融资
          detail: Headway 获得由 Thrive Capital 和 GV 领投的 $26M Series A 轮融资，累计融资额达 $32M。
          date: '2020-11-18'
          tone: positive
        - label: Series B 轮融资
          detail: 完成由 Andreessen Horowitz 领投的 $70M 融资，估值达 $750M；Scott Kupor 加入董事会。
          date: '2021-05-04'
          tone: positive
        - label: Series C 轮独角兽融资
          detail: 完成由 Spark Capital 领投的 $125M Series C 轮融资，投后估值达 $1.0B。
          date: '2023-10-05'
          tone: positive
        - label: 全国网络扩张
          detail: 将心理健康网络扩展至全美 50 州，覆盖 25+ 家商业保险计划，入驻提供方达 33,000 名。
          date: '2023-12-15'
          tone: positive
        - label: 联合创始人交接
          detail: 联合创始人 Jake Sussman 卸任运营管理职务，发起创立青少年心理健康项目 Marble。
          date: '2024-06-21'
          tone: warning
        - label: Series D 轮融资
          detail: 获得由 Spark Capital 领投的 $100M Series D 轮融资，估值达 $2.3B，估值同比翻倍。
          date: '2024-07-23'
          tone: positive
        - label: Series D-2 轮增资
          detail: 完成 Series D-2 轮老股转让与增资扩股，每股价格 $12.01，投后估值达 $2.38B。
          date: '2024-08-29'
          tone: positive
        - label: 高管团队扩充
          detail: 任命 Jake Poses 为产品副总裁，Rob Sadow 为战略副总裁，并提拔 Rutger Flohil 为首席营收官。
          date: '2025-03-20'
          tone: positive
        - label: 临床风险控制机制建制化
          detail: 面向 75,000+ 名医疗提供方，建立覆盖全美的安全事件与临床风险治理专职基础设施。
          date: '2026-09-21'
          tone: warning
  - id: FM001
    title: 保险原生采纳层级
    type: pyramid
    summary: 将人群就医需求转化为已完成且可报销门诊医疗所需的必要条件定性分级模型。
    data:
      items:
        - label: 有据可查的患者需求
          detail: 宽泛需求估算仅是人群基数代理指标，并非可变现的收入池。
          tone: neutral
        - label: 保险可负担性与参保资格
          detail: 患者必须拥有可用的保险覆盖或其他可负担的支付途径。
          tone: neutral
        - label: 临床医生参与度
          detail: 临床医生必须接受保险结算并维持可预约接诊名额。
          tone: neutral
        - label: 支付方准入与资质认证支持
          detail: 网络准入、保险待遇核验、编码以及理赔（claims）基础设施必须顺畅运转。
          tone: neutral
        - label: 转诊与匹配工作流
          detail: 患者或医疗转诊方必须能够触达合适医生并成功预约就诊。
          tone: positive
        - label: 已完成、有病历记录且可报销的诊疗服务
          detail: 实际完成的业务量取决于患者到诊、病历合规与理赔（claims）审核。
          tone: warning
    approximationNotes: 仅作定性层级展示；各模块尺寸不成比例，且未推算任何转化率。
    claimRefs:
      - CM005
