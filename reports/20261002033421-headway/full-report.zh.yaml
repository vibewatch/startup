      - CR015
  - id: FV001
    title: 投资建议逻辑链
    type: flow
    summary: 该决策链将历史经营证据、融资估值参照，与给出明确标价建议所需的关键缺失数据清晰剥离。
    data:
      nodes:
        - id: historical-growth
          label: 历史高增证据
          detail: 公司披露截至 2021 年 5 月左右的年度净收入增长九倍。
        - id: operating-platform
          label: 全流程运营覆盖
          detail: 官方材料覆盖资质认证、支付结算、保司协议、账单管理与服务评价。
        - id: financing-marks
          label: 2024 年融资参考
          detail: $2.3B D 轮与 $2.38B D-2 轮投后估值记录。
        - id: liquidity-caveat
          label: 二级市场证据有限
          detail: Forge 显示交易活跃度有限，未发布 Forge Price，亦无最近撮合成交价。
        - id: financial-opacity
          label: 当前财务指标缺失
          detail: 保留证据中缺乏经审计的当期收入、利润率、现金流、客户留存或股权结构表证据。
        - id: research-more
          label: 维持「继续研究」建议
          detail: 定价、回报率、持有期及退出等投资结论，需待签署保密协议（NDA）展开尽调后再行判断。
      edges:
        - from: historical-growth
          to: operating-platform
        - from: operating-platform
          to: financing-marks
        - from: financing-marks
          to: liquidity-caveat
        - from: liquidity-caveat
          to: financial-opacity
        - from: financial-opacity
          to: research-more
    approximationNotes: 仅代表有序的分析逻辑流，不包含量化转化率或概率推算。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV013
      - CV014
