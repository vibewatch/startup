  - id: FP001
    title: 行为健康赋能平台竞争定位图
    type: quadrant
    summary: 从临床软件深度与保险赋能杠杆两个维度，对比各大行为健康平台的竞争定位。
    data:
      xAxis: 临床软件与工作流深度（轻量级到全栈 EHR）
      yAxis: 保险赋能杠杆（自费直付到聚合保司网络）
      points:
        - label: Headway
          x: 4
          'y': 9
          note: 具备行业领先的保司网络杠杆，搭配轻量化临床 EHR
        - label: Alma
          x: 7
          'y': 8
          note: 保司准入网络杠杆强，打包整合全栈 EHR 与远程医疗
        - label: Grow Therapy
          x: 5
          'y': 9
          note: 保司准入覆盖面广，纳入州级 Medicaid 与 Medicare
        - label: SimplePractice
          x: 9
          'y': 2
          note: 临床与诊所管理 EHR 功能完备，但不提供保司签约
        - label: Psychology Today
          x: 2
          'y': 3
          note: 老牌自费名录平台，C 端流量高但毫无账单结算工具
        - label: 诊所自建账单
          x: 3
          'y': 5
          note: 由从业者直接持有保司合同，管理行政开销沉重
    approximationNotes: 评分基于临床功能深度与聚合保司杠杆的对比证据，采用 1-10 序数打分。
    claimRefs:
      - CP001
      - CP002
      - CP004
      - CP007
      - CP009
  - id: FI001
    title: Headway 收入模型与现金流转路径
    type: flow
    summary: 拆解患者预约、理赔（claims）裁决、医生结算与平台抽佣的全流程。
