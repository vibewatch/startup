      - number: '2.4'
        title: 增长驱动力、制约瓶颈与估值关联
        blocks:
          - type: paragraph
            body: >-
              核心驱动力源于各方协同机制的失灵：医生苦于繁杂的医保行政事务，患者面临自费压力和名录脱节障碍，基础医疗团队则缺乏可靠的闭环转诊通道。最大的制约因素在于，这套运营底座本身引入了合规、审计、报销追偿及信任层面的多重风险。Headway
              自行制定的指引要求及时撰写病历、定期更新治疗方案，并配合公司或保险机构的病案抽检。独立媒体报道也记录了咨询师的多重担忧：经济收益不透明、结算费率变动、数据控制权受限，以及对风投背景中间平台的过度依赖；与此同时也有报道指出，部分医生确实看重更优的结算费率和后台工作量的减少。因此在估值定价时，应重点犒赏经核实确凿的网络密度和实际完成的受保诊疗量，而非仅看公开宣传的注册服务商数字；对未经证实的支付方集中度、抽成比例、服务商活跃度、转诊转化率、留存表现以及经审计调整后的单体经济模型，则必须打上估值折价。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
              - CM016
