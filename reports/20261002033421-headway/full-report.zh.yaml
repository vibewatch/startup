      - number: '4.3'
        title: 资金充裕度、公开业务进展与尽调研判结论
        blocks:
          - type: paragraph
            body: >-
              Headway 历经五轮有定价的股权融资，累计吸纳 $326 million 股权新资金，并在 2024 年 7 月完成由 Spark Capital 领投的 $100 million D 轮融资，投后估值达
              $2.3 billion。尽管平台展现出迅猛的商用落地态势——服务商数量从 2021 年 5 月的 3,000 名激增至逾 75,000 名，服务患者达 100
              万人——但后续资金链的充裕程度重度依赖烧钱速度和业务开拓进展。根据 Headway 公布的战略，新资金将砸向 51 个区域市场的 Medicare Advantage 业务以及打入 Medicaid
              领域；这些板块监管合规要求更严苛、报销利润率更薄，且面临更高的审计抽检风险。在经审计的净利润、经营性现金流及资金跑道均未公开的前提下，机构投资研判必须对保险合同集中度及合规储备金展开针对性专项尽调。
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: 图表展台
        blocks:
          - type: callout
            title: 轻资产撮合模式放大经营杠杆的同时带来垫资风险
            body: >-
              相比 Alma 这类订阅制平台，Headway 对医生完全免费的策略极大加快了供给端扩张。然而，不等保险公司结算便承诺每月两次向咨询师刚性垫付账款，直接将营运资金垫资压力和拒赔（claims
              denial）坏账风险转移到了 Headway 自身的资产负债表上。
            calloutType: insight
            claimRefs:
              - CI002
              - CI006
              - CI007
          - type: callout
            title: 公共医保项目扩张中的支付方集中度与审计脆弱性
            body: >-
              业务从商业健康险向 Medicare Advantage 和 Medicaid 延伸，虽将 Headway 的潜在服务人群拓宽至 1
              亿人以上，但也带来了更为苛刻的单体经济模型和成倍增加的审计风险。保险机构的事后追偿或针对低码高编（downcoding）的合规彻查，对净抽成利润率的持续性构成了结构性威胁。
            calloutType: risk
            claimRefs:
              - CI014
              - CI015
