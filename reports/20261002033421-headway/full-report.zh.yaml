        - label: Headway 集中向保司申报理赔并半月向医生打款
        - label: 保司审核理赔并支付网络内赔付金
        - label: Headway 扣除平台抽成并承担营运资金垫付
    approximationNotes: 流程图基于公开帮助中心文档与分析师报告梳理，呈现 Headway 的理赔（claims）处理机制与现金周转流程。
