      - number: '6.3'
        title: 标杆落地案例与系统打通实证
        blocks:
          - type: paragraph
            body: >-
              在大型机构与健康险方案上的落地案例，展现出 Headway 广阔的业务纵深，跨越了各地区 Blue Cross Blue Shield 关联机构与全国性商业保险巨头。在明尼苏达州，Headway
              落地了一体化服务商对接通道，支持明尼苏达 Blue Cross Blue Shield 危机响应计划，让网内医生能够承接精准的危机转诊。在佛罗里达州和得克萨斯州，Headway 分别针对 Florida Blue
              和 BCBS TX 参保会员开设了专属的资质审核通道与服务商网络。在全美范围内，Aetna、Cigna 和 UnitedHealthcare 等主流商业险保司均与 Headway
              携手改善就诊预约，但独立评测指出，服务定价权牢牢掌控在平台手中。关于企业级合作的具体条款、服务商入网名额上限以及独立第三方测算的客户满意度，透明度依然极低；业务的核心命脉紧紧系于商业保险机构是否愿意长期下放服务网络的管理权。
            claimRefs:
              - CU001
              - CU010
              - CU011
              - CU012
