      - number: '1.3'
        title: 融资历程、老股流动性与业务推进轨迹
        blocks:
          - type: paragraph
            body: >-
              Headway 的资本化路径展现出在一线风险投资与医疗专项基金支持下的快速估值扩张 [CO004, CO007, CO009, CO011]。在获得 Accel 的种子轮投资后，公司于 2020 年 11
              月完成由 Thrive Capital 和 GV 领投的 $26M A 轮融资，累计融资金额达到 $32M [CO004]。2021 年 5 月，Andreessen Horowitz 领投 $70M B
              轮融资，投后估值达到 $750M [CO009]。随后在 2023 年 10 月，Headway 完成由 Spark Capital 领投的 $125M C 轮融资，以 $1.0B 估值跻身独角兽行列
              [CO007, CO011]。2024 年 7 月，Spark Capital 领投 $100M D 轮融资，公司估值达到 $2.3B；紧接着在 2024 年 8 月，公司通过老股增发（D-1 和 D-2
              轮）以每股 $12.01 定价，投后估值推高至 $2.38B，累计募资总额达到 $406.42M [CO005,
              CO011]。尽管融资推进极快，但具体的清算优先权层级、股权结构表分配细则（waterfall）以及经审计的年度烧钱规模，依然是未经核实的非公开数据 [CO012]。
