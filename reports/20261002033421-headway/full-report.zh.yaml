      - number: '4.2'
        title: 成本结构、毛利率驱动因素与单体经济模型
        blocks:
          - type: paragraph
            body: >-
              作为轻资产撮合平台，Headway 的核心单体经济模型取决于单次诊疗频次、资质审核效率以及理赔工作流的自动化程度。通过把资质审核周期从行业通行的 90 至 120 天大幅缩短至约 30
              天，并不等保险公司结款即每半月向医生垫付报酬，Headway
              实际上承担了短期营运资金垫资占用及理赔（claims）对账摩擦。由于服务商端免收订阅费，毛利主要取决于扣除信用卡手续费、医保追偿兜底保障、理赔交换所（clearinghouse）费用以及客服运维开支后的保险分成净抽成率。包括确切毛利率、净留存率（NRR）、单服务商获客成本（CAC）以及服务商流失率在内的关键私密单体指标，公开资料均未披露。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
