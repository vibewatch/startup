callouts:
  - calloutType: "insight"
    title: "Asset-Free Marketplace Model Creates Operating Leverage with Float Risk"
    body: "Headway's decision to offer software for free to clinicians drives rapid supply-side acquisition compared to subscription models like Alma. However, guaranteeing twice-monthly payment to therapists independent of payer adjudication timelines transfers working capital float and claims-denial risk onto Headway's balance sheet."
    claimRefs:
      - "CI002"
      - "CI006"
      - "CI007"
  - calloutType: "risk"
    title: "Payer Concentration and Audit Vulnerability in Public Program Expansion"
    body: "Expanding from commercial plans into Medicare Advantage and Medicaid broadens Headway's addressable market to over 100 million individuals, but introduces tighter unit economics and elevated audit exposure. Retrospective payer clawbacks or downcoding scrutiny represent structural risks to net take-rate margin sustainability."
    claimRefs:
      - "CI014"
      - "CI015"
