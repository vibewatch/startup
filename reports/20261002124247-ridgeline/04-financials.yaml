callouts:
  - calloutType: "insight"
    title: "Committed AUM vs. Realized Annual Recurring Revenue"
    body: "Ridgeline's marquee commercial metric—$750B+ in committed AUM/AUA—is a forward indicator of enterprise pipeline and implementation backlog rather than recognized GAAP revenue. Because enterprise migrations require replacing 6 to 9 mission-critical systems, implementation lead times defer realized cash collections, meaning top-line subscription run-rate lags headline commitment announcements."
    claimRefs:
      - "CI003"
      - "CI011"
      - "CI013"
  - calloutType: "risk"
    title: "Capital Intensity and Reliance on Insider Sponsorship"
    body: "With over 600 employees across multiple metropolitan offices and heavy ongoing R&D investments, Ridgeline operates at a substantial cash burn rate. While founder Dave Duffield's personal contribution of over $400 million and the latest $250 million Series E provide an enviable liquidity cushion, long-term self-sufficiency requires proving durable enterprise SaaS unit economics without perpetual equity subsidization."
    claimRefs:
      - "CI005"
      - "CI007"
      - "CI012"
      - "CI014"
