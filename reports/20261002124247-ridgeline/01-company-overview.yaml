company:
  name: Ridgeline
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Ridgeline is a founder-backed, Series E investment-management software company that
    reports rapid product and committed-asset growth, including a $250 million round at a
    $1.425 billion valuation in September 2026. The public record is much weaker on total
    funding, audited revenue, exact customers, reconciled headcount, ownership, debt, and
    board governance, while several scale metrics remain company-reported.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Ridgeline was founded in 2018 and is headquartered in the Lake Tahoe area, with
      public materials also identifying teams or offices in New York, Reno, the Bay Area,
      and Dublin. It positions itself as a front-to-back system of record for investment
      managers, combining portfolio, trading, accounting, compliance, reporting, and
      client-service workflows on a unified data model. The latest financing establishes
      its current stage as a private Series E company. Public sources do not disclose a
      pricing schedule, contract structure, audited revenue, or a precise customer count,
      so the business model can be described as enterprise investment-management
      software but not quantified as a particular recurring-revenue model.
    claimRefs: [CO001, CO002, CO003, CO007]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: >-
      Founder and Chairman Dave Duffield remains unusually central to Ridgeline's
      narrative and financing: he is credited with the clean-sheet product vision and led
      the invitation-only Series E. Dave Blair is the publicly identified chief executive
      and spokesperson for operating scale and product strategy. That combination gives
      the company experienced enterprise-software sponsorship, but the founder's capital
      role also creates a diligence question around influence, succession, and financing
      concentration. The reviewed public evidence does not identify a complete board,
      voting rights, ownership percentages, or formal control provisions, preventing a
      defensible governance assessment beyond the named roles.
    claimRefs: [CO004, CO005, CO009]
    tableRefs: [TO002]
  - id: capitalization-and-scale
    title: Capitalization and operating scale
    body: >-
      On September 16, 2026, Ridgeline announced a $250 million Series E at a $1.425
      billion valuation, led by Duffield with participation from customers and affiliates.
      That is a disclosed financing event, not evidence of total capital raised or cash
      currently available. The same announcement said more than $750 billion of AUM/AUA
      was committed to the platform, up from more than $650 billion in March, when a
      syndicated company release also said the platform processed billions in live trades
      monthly. Committed assets are not equivalent to live assets, revenue, or market
      share. A third-party revenue estimate and conflicting employee databases are useful
      leads, not investment-grade operating metrics.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO016]
    tableRefs: [TO003]
  - id: milestones-and-diligence-implications
    title: Milestones and diligence implications
    body: >-
      The 2026 sequence shows a company broadening both product scope and financing:
      Intelligent Operations was announced in February, committed assets and live trading
      activity were highlighted in March, Market Intelligence was released in April, and
      the Series E and a higher committed-asset figure followed in September. This cadence
      is directionally consistent with a scaling challenger, but nearly all adoption and
      asset figures originate in company-issued material. An independent Built In page
      explicitly cautions that committed AUM may include assets not yet live and that
      third-party validation remains limited. Diligence should therefore reconcile
      committed, contracted, implemented, and live assets before treating the timeline as
      proof of durable adoption.
    claimRefs: [CO001, CO007, CO010, CO011, CO014, CO015, CO016]
    figureRefs: [FO001]
