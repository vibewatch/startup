  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: funding-governance
      missingEvidence: >-
        Total funding history, debt or credit facilities, current cash, cap table,
        security terms, ownership percentages, voting rights, and complete board roster.
      whyItMatters: >-
        These records are required to assess runway, dilution, related-party financing,
        founder control, investor protections, and governance independence.
      diligencePath: >-
        Request the capitalization table, financing documents, debt schedule, board
        minutes, investor-rights agreements, and a current cash reconciliation.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002, TO003]
    - type: conflicting-data
      severity: material
      topic: headcount
      missingEvidence: >-
        A payroll-backed employee count with measurement date, employee/contractor split,
        and location breakdown.
      whyItMatters: >-
        The 633 and 702 database figures cannot both represent the same population and
        date, limiting operating-scale and cost-base analysis.
      diligencePath: >-
        Reconcile HRIS and payroll records to the run date and bridge employees,
        contractors, open roles, and recent hires or departures.
      relatedQuestionRefs: [QO005, QO007]
    - type: missing-source
      severity: material
      topic: financial-scale
      missingEvidence: >-
        Audited revenue, ARR, gross margin, cash burn, cash balance, customer count, and
        contracted-versus-live asset schedules.
      whyItMatters: >-
        Funding raised is not cash available, revenue is not ARR, and committed assets do
        not establish implementation, retention, or monetization.
      diligencePath: >-
        Obtain audited financials, the ARR waterfall, customer and asset activation
        cohorts, bank statements, and board-approved operating forecasts.
      relatedQuestionRefs: [QO005]
    - type: stale
      severity: minor
      topic: funding-conflict
      missingEvidence: >-
        A corrected timestamp and update methodology for the Tracxn funding classification.
      whyItMatters: >-
        The stale unfunded label demonstrates that aggregator classifications can lag
        primary financing disclosures.
      diligencePath: >-
        Ask Tracxn to reconcile the company profile to the September 2026 financing and
        rely on executed financing documents for underwriting.
      relatedQuestionRefs: [QO007]
