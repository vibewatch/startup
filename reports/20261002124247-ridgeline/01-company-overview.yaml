callouts:
  - calloutType: strength
    title: Experienced founder sponsorship
    body: >-
      Dave Duffield's enterprise-software history and leadership of the latest round
      provide strategic and financial sponsorship during Ridgeline's expansion.
    claimRefs: [CO004, CO007, CO009]
  - calloutType: risk
    title: Scale metrics need denominator reconciliation
    body: >-
      Committed AUM/AUA, live trade volume, revenue estimates, headcount estimates, and
      customer counts use different populations and levels of verification; none should
      be substituted for another.
    claimRefs: [CO010, CO011, CO012, CO013, CO016]
