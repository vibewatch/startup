            body: >-
              尽管 Ridgeline 重度依托 GraphQL Federation 供内部微服务高效组装数据，但其架构设计有意不对外暴露原始 GraphQL 接口。Ridgeline 将第三方集成限制在 AWS API
              Gateway 后的预编译持久化操作范围内，成功化解了公开发布企业级 GraphQL API 时常见的文档繁杂、校验困难与任意查询性能隐患。
