              - CO005
      - number: '1.3'
        title: 股本结构与运营规模
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月 16 日，Ridgeline 宣布完成由 Duffield 领投、客户及关联方参投的 $250 million Series E 轮融资，估值为 $1.425
              billion。该数据属公开披露的单笔融资事件，并非累计融资金额或当前账面现金储备的凭证。同期公告披露，平台承诺 AUM/AUA 规模已超过 $750 billion，高于 2026 年 3 月披露的超 $650
              billion；当时一份联合发布的新闻稿还指出平台每月处理数十亿美元实盘交易。承诺资产规模不等同于实盘上线资产、营业收入或市场份额。第三方营收估算与存在矛盾的员工数据库仅属参考线索，并非机构级投资尽调营运指标。
