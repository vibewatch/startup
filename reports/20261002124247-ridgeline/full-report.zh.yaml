          value: 60
    approximationNotes: 根据披露节省六位数整合成本的定性客户案例，将基准指数归一化为 100；公司未披露任何经审计的美元财务数据。
    claimRefs:
      - CI002
      - CI003
      - CI005
  - id: FE001
    title: Ridgeline 云原生技术与运营技术栈
    type: stack
    summary: 涵盖客户端访问、任务编排、应用微服务及 AWS 多模持久化存储的多层企业级架构。
    approximationNotes: null
    claimRefs:
      - CE004
      - CE005
      - CE008
    data:
      layers:
        - label: 客户端入口与公开 API
          detail: 公网 AWS API Gateway 负责终结外部 REST 请求、执行身份验证并代理预定义的持久化操作。
        - label: VPC 网关与联邦网格
          detail: 内部私有 API 网关采用 GraphQL Federation 将各业务小组的微服务图谱聚合成统一数据模型。
        - label: Serverless 执行层
          detail: 基于 AWS Lambda 的事件驱动计算，负责跨业务领域无状态微服务与业务逻辑执行。
        - label: 工作流编排引擎
          detail: AWS Step Functions 统一管理多步异步处理、复杂批量计算及长耗时任务。
        - label: 多模持久化存储层
          detail: Amazon Aurora 支撑具备 ACID 特性的关系型记录，Amazon DynamoDB 支撑低延迟键值状态，Amazon S3 负责文档存储。
        - label: 可观测性与安全基座
          detail: Amazon CloudWatch 遥测监控、分布式链路追踪与自动化 DevSecOps 护栏，共同支撑 SOC 2 Type II 合规。
  - id: FU001
    title: 公开客户生命周期与业务扩张闭环
    type: journey-map
    summary: 客户生命周期涵盖从合格需求到实施、采用、续约、扩张与倡导推广，但仅部分成果阶段具备公开佐证。
    data:
      nodes:
        - id: demand
          label: 合格需求
          description: Zabal 披露 60+ 个官网合格线索；向正式签约客户的转化率未披露。
          touchpoints:
            - Website
            - Demo request
        - id: implementation
          label: 客户导入与实施准备
          description: 客户成功团队负责客户导入并加速价值实现。
          touchpoints:
            - Account plan
            - Implementation readiness
        - id: adoption
          label: 培训与系统采用
          description: 标准或高级客户成功方案提供培训、功能采用引导和技术支持。
          touchpoints:
            - Training
            - Enablement
        - id: outcomes
          label: 运营成效
          description: 实名案例报告了对账、许可费用节约、差错率降低以及系统整合等成效。
          touchpoints:
            - Health monitoring
            - Outcome review
        - id: renewal
          label: 续约与留存
          description: 客户成功岗位主导续约策略，但公开 GRR、NRR 及流失率数据不可得。
          touchpoints:
            - Renewal
            - Risk mitigation
        - id: expansion
          label: 扩张与倡导推广
          description: 该岗位负责识别用量扩张机会，并推进客户推荐、案例研究与社区互动。
          touchpoints:
            - Expanded utilization
            - Customer reference
    approximationNotes: 该流程图基于披露的岗位职责与客户案例整理，并非实际测算的转化漏斗；不隐含各阶段转化率。
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU014
