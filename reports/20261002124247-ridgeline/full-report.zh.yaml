      - 概率预期
    rows:
      - - 乐观情景
        - $750B 签约 AUM 迅速转化为实盘企业级订阅；欧洲及加拿大扩张告捷
        - 凭借企业级市场领跑地位与潜在 IPO 预期，估值扩张至 $3.0B-$4.0B+
        - 企业销售周期放缓或欧洲监管阻力
        - 中 (30%)
      - - 基准情景
        - 中型资产管理机构平稳完成多系统替代；国际化落地温和推进
        - 维持 $1.425B-$2.0B 估值，支撑成长型投资者 15-20% IRR
        - 保守型 RIA 带来的利润率承压与销售周期拉长
        - 高 (50%)
      - - 悲观情景
        - 实施复杂性导致上线停滞；存量厂商构建同等 AI 层；高现金消耗
        - 估值降至 $1.0B 以下进行下调轮或平价轮融资，需重组资本结构
        - 头部客户流失或签约 AUM 未能转化为确认营收
        - 低至中 (20%)
      - - 否决触发情景
        - 交易或合规核心架构失效，或失去 Dave Duffield 资金支持
        - 估值倍数严重崩塌或被迫资产出售
        - 违反受托合规责任或核心系统宕机
        - 低 (<5%)
    notes: 情景估值与概率综合考量了一级市场估值基准、Duffield 资本支持以及签约 AUM 转化率。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV014
figures:
  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: 公开里程碑显示产品发布与公司口径业务规模显著加速，在 2026 年 9 月 Series E 轮达到顶峰。
    data:
      items:
        - date: '2018'
          label: 公司成立
          detail: 第三方资料显示 2018 年为 Ridgeline 成立年份。
          tone: neutral
        - date: '2026-02-02'
          label: 宣布推出 Intelligent Operations
          detail: Ridgeline 推出整合其平台、agentic 工作流及人工监督机制的产品。
          tone: positive
        - date: '2026-02-02'
          label: 结果导向型运营模式
          detail: 该方案宣称向平台客户开放，覆盖完整投资生命周期工作流。
          tone: neutral
        - date: '2026-03-09'
          label: 签约资产突破 $650 billion
          detail: 一份联合发布的公司公告报告了签约资产，但该指标并不等同于实盘运行资产。
          tone: positive
        - date: '2026-03-09'
          label: 披露实盘交易活跃度
          detail: 同期公告称 Ridgeline 每月处理数十亿美元实盘交易。
          tone: neutral
        - date: '2026-04-29'
          label: 发布 Market Intelligence
          detail: Ridgeline 宣布面向全体客户提供内嵌的市场资讯与分析功能。
          tone: positive
        - date: '2026-09-16'
          label: 宣布 $250 million Series E 轮融资
          detail: 此次定向受邀融资以 $1.425 billion 估值对外公布。
          tone: positive
        - date: '2026-09-16'
          label: 签约资产突破 $750 billion
          detail: 融资公告上调了公司披露的签约 AUM/AUA 数据。
          tone: positive
    approximationNotes: 事件均采用公告日期；签约资产按公司披露里程碑记录，未折算为实盘资产、营业收入或市场份额。
