      - number: '4.3'
        title: 资本充足度、流动性画像与尽调结论
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月完成 $250 million Series E 融资（估值达 $1.425 billion）后，Ridgeline 维持了卓越的短期资本充足度。该轮股权融资由创始人兼董事长 Dave
              Duffield 领投（其自创立以来已个人累计注资超 $400 million），并获得 Motley Fool Ventures、Smead Capital Management 关联方及 Patrick
              O'Shaughnessy 等客户与战略伙伴参投。平台承诺规模从 2026 年 3 月的 $650 billion 扩增至 2026 年 9 月的超 $750 billion AUM/AUA，管理层目标在
              2027 年 1 月突破 $1 trillion。然而外部市场评估强调，承诺 AUM
              属于厂商自主披露的营运统计指标，其中包含尚未投入生产实盘的资产，且缺乏经审计的第三方市场份额或营收数据验证。              从机构投资评估来看，Ridgeline
              展现出顶级赞助人托底的充裕资本缓冲与迅猛的平台签约势头，但必须权衡其对内部人资本的结构性依赖、尚未核实的现金消耗速度，以及在 GAAP 营业收入与合同续约留存率上的完全黑箱状态。
