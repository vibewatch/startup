    title: 公司概况
    sections:
      - number: '1.1'
        title: 机构定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              Ridgeline 成立于 2018 年，总部位于 Lake Tahoe 地区，公开资料亦显示其在 New York、Reno、湾区及 Dublin
              设有团队或分支机构。公司定位为投资管理机构的前中后台核心记录系统，依托统一数据模型整合投资组合、交易、核算、合规、报告与客户服务工作流。最新融资确立了其目前处于非上市 Series E
              阶段。公开渠道尚未披露定价细则、合同结构、经审计营收或确切客户数量，因此其商业模式可定性为企业级投资管理软件，但无法量化为具体的经常性收入模型。
