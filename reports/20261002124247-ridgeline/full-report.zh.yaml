      - CO015
  - id: FM001
    title: 投资管理市场规模分层架构
    type: pyramid
    summary: 从资管总体规模到可触达核心软件支出的市场空间分层结构呈现。
    data:
      items:
        - label: 资产全集规模
          value: Global Trillions
          description: 资产管理与财富管理机构的整体机构 AUM/AUA 规模
        - label: 可触达软件支出
          value: Multi-Billion TAM
          description: 分配至前、中、后台的年度 IT 与软件支出
        - label: 核心平台替代空间
          value: 6-9 Systems per Firm
          description: 涵盖 OMS、估值对账及合规等系统的既有替换预算
        - label: Ridgeline 签约覆盖规模
          value: '>$750B Committed'
          description: 截至 2026 年底 Ridgeline 平台签约的 AUM/AUA 总规模
        - label: 标杆客户投产规模
          value: $13B-$30B / Firm
          description: 已正式实盘上线的单体企业级客户资产规模
        - label: 已确认 ARR
          value: Undisclosed
          description: 非公开 SaaS 订阅收入；未经审计且未在公开材料中披露
    approximationNotes: 资产指标反映签约客户规模而非直接软件市场营收。图表展示各层级相对结构边界。
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM010
  - id: FP001
    title: 竞争格局定位图
    type: quadrant
    summary: 基于架构现代化程度与机构市场存在感绘制的竞争格局。
    data:
      points:
        - label: Ridgeline
          x: 8.5
          'y': 4.2
          detail: 具备现代统一数据模型的 AI 原生云架构，但机构市场占有率尚处于起步阶段。
        - label: BlackRock Aladdin
          x: 3.5
          'y': 9.6
          detail: 全球企业级市场占有率居统治地位，但底层保留较多传统大型机架构遗留。
        - label: State Street Alpha / CRD
          x: 3.8
          'y': 8.9
          detail: 拥有庞大托管资产规模及前后端一体化触达能力，但面临多系统协同复杂度。
        - label: Bloomberg AIM
          x: 4.2
          'y': 9.2
          detail: 前台交易席位渗透率极高，深度依赖以终端为中心的工作流。
        - label: SimCorp Dimension
          x: 4
          'y': 7.8
          detail: 欧洲及全球领先的资管核算引擎，带有显著的本地化部署历史包袱。
        - label: Refinitiv / LSEG Workspace
          x: 5.5
          'y': 7.2
          detail: 机构市场行情数据覆盖广泛，处于新旧平台过渡交替期。
    approximationNotes: 坐标系基于所披露的架构能力与装机客户规模综合评定的定序分值（1-10）。
    claimRefs:
