          label: 规模核实：$750B+ 签约 AUM 与 702 名员工
        - id: n2
          label: 客户验证：Smead Capital 与 Motley Fool 共同投资
        - id: n3
          label: 竞争环境：存量厂商壁垒深厚（Aladdin、SimCorp）
        - id: n4
          label: 信息摩擦：未经审计 GAAP 损益表与偏高的 $1.425B 估值
