      - number: '1.2'
        title: 领导层、治理架构与关键人风险
        blocks:
          - type: paragraph
            body: >-
              创始人兼董事长 Dave Duffield 在 Ridgeline 的企业叙事与融资进程中占据异乎寻常的核心地位：他奠定了从零构建的产品愿景，并领投定向邀请制的 Series E 轮融资。Dave Blair
              为公开披露的首席执行官，负责阐释运营规模与产品战略。这一配置为公司赋予了资深企业级软件背景背书，但创始人集中的资本角色也引发了关于控制权、接班规划及融资集中度的尽调疑虑。已审阅的公开证据未能展示完整的董事会席位、表决权结构、持股比例或正式控制权条款，除公开高管职务外，难以对其公司治理做出充分论证。
            claimRefs:
              - CO004
              - CO005
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
