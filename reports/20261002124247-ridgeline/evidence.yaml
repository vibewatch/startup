evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding-governance
    missingEvidence: >-
      Total funding history, debt or credit facilities, current cash, cap table, security terms, ownership percentages,
      voting rights, and complete board roster.
    whyItMatters: >-
      These records are required to assess runway, dilution, related-party financing, founder control, investor
      protections, and governance independence.
    diligencePath: >-
      Request the capitalization table, financing documents, debt schedule, board minutes, investor-rights agreements,
      and a current cash reconciliation.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A payroll-backed employee count with measurement date, employee/contractor split, and location breakdown.
    whyItMatters: >-
      The 633 and 702 database figures cannot both represent the same population and date, limiting operating-scale and
      cost-base analysis.
    diligencePath: >-
      Reconcile HRIS and payroll records to the run date and bridge employees, contractors, open roles, and recent hires
      or departures.
    relatedQuestionRefs:
      - QO005
      - QO007
  - type: missing-source
    severity: material
    topic: financial-scale
    missingEvidence: >-
      Audited revenue, ARR, gross margin, cash burn, cash balance, customer count, and contracted-versus-live asset
      schedules.
    whyItMatters: >-
      Funding raised is not cash available, revenue is not ARR, and committed assets do not establish implementation,
      retention, or monetization.
    diligencePath: >-
      Obtain audited financials, the ARR waterfall, customer and asset activation cohorts, bank statements, and
      board-approved operating forecasts.
    relatedQuestionRefs:
      - QO005
  - type: stale
    severity: minor
    topic: funding-conflict
    missingEvidence: A corrected timestamp and update methodology for the Tracxn funding classification.
    whyItMatters: The stale unfunded label demonstrates that aggregator classifications can lag primary financing disclosures.
    diligencePath: >-
      Ask Tracxn to reconcile the company profile to the September 2026 financing and rely on executed financing
      documents for underwriting.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited total annual software expenditure across RIA and institutional asset management TAM/SAM, and Ridgeline's
      recognized recurring revenue.
    whyItMatters: >-
      Vendor disclosures report committed AUM/AUA rather than software contract value, leaving precise software market
      share and revenue conversion opaque.
    diligencePath: >-
      Request audited revenue schedules, customer ACV distributions, and standard software take-rate percentages against
      committed asset tiers.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: incumbent-market-share
    missingEvidence: >-
      Audited market-share breakdown and GAAP revenue comparisons between Ridgeline and enterprise incumbents such as
      BlackRock Aladdin and Bloomberg AIM.
    whyItMatters: >-
      Without audited comparative financials, market traction relies primarily on company-reported committed AUM and
      trade volume milestones.
    diligencePath: >-
      Request audited revenue, annualized recurring revenue (ARR), net revenue retention (NRR), and customer account
      metrics during management diligence.
  - type: missing-source
    severity: minor
    topic: independent-technical-benchmarks
    missingEvidence: >-
      Independent latency, throughput, and system uptime benchmarks comparing front-to-back cloud execution against
      legacy on-premise trade routing.
    whyItMatters: >-
      Mission-critical institutional traders require verified uptime and execution reliability metrics prior to
      committing production trading volume.
    diligencePath: Review SOC2 Type II audit reports, disaster recovery SLA commitments, and customer trade-execution telemetry logs.
  - type: missing-source
    severity: material
    topic: faas-burst-throughput
    missingEvidence: >-
      Third-party benchmarks or latency percentiles measuring AWS Lambda execution and cold starts during market-open
      peak volume bursts.
    whyItMatters: >-
      Institutional asset managers require strict latency and execution guarantees during high-volatility market events
      to avoid slippage or compliance breaches.
    diligencePath: >-
      Request production APM latency telemetry (p95 and p99) and cold-start metrics for core order routing services
      under peak load.
    relatedQuestionRefs:
      - QE002
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: ai-hallucination-controls
    missingEvidence: >-
      Detailed technical architecture documentation on model evaluation, prompt grounding, and automated guardrails
      within Intelligent Outcomes.
    whyItMatters: >-
      Autonomous or agentic actions executing in regulated financial environments must provide deterministic audit
      trails and zero hallucination risks.
    diligencePath: >-
      Conduct architectural review of AI safety layers, human-in-the-loop checkpoints, and model audit logs in customer
      production environments.
    relatedQuestionRefs:
      - QE005
      - QE006
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Customer count, GRR, NRR, logo churn, contract duration, cohort expansion, and top-customer revenue concentration.
    whyItMatters: >-
      Committed assets and selected customer outcomes do not establish recurring revenue durability or exposure to a few
      large accounts.
    diligencePath: >-
      Request audited cohort retention schedules, renewal history, contract terms, expansion ARR, and top-10 customer
      revenue under NDA.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU001
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete roster of signed, implementing, live, renewed, and churned customers with deployment dates and
      measurable outcomes.
    whyItMatters: >-
      The public sample is company-selected and cannot establish the conversion rate from logo or commitment to durable
      production use.
    diligencePath: >-
      Obtain a blinded customer census by deployment stage and independently reference a stratified sample of live,
      implementing, and churned accounts.
    relatedQuestionRefs:
      - QU003
      - QU006
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: demand-conversion
    missingEvidence: >-
      Conversion from the 60+ qualified website leads into opportunities, signed customers, live deployments, and
      revenue.
    whyItMatters: Qualified leads measure demand generation, not product adoption or customer economics.
    diligencePath: Request CRM funnel conversion by cohort, segment, sales-cycle duration, and booked ARR.
    relatedQuestionRefs:
      - QU007
  - type: private-evidence-only
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Comprehensive non-public SOC2 Type II audit reports, penetration test summaries, and state-level business entity
      filings for all operating subsidiaries.
    whyItMatters: >-
      Public sources confirm high-level SOC2 Type II certification and absence of active federal litigation, but audit
      exceptions and state regulatory inquiries remain unverified without direct compliance disclosures.
    diligencePath: >-
      Request unredacted SOC2 Type II examination reports, recent penetration test remediations, and legal officer
      representation letters regarding pending state or foreign regulatory inquiries.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: offboarding-and-kill-criteria
    missingEvidence: >-
      Contractual SLA commitments, historical uptime metrics, formal data portability specifications, and customer
      offboarding timelines.
    whyItMatters: >-
      Without published historical uptime or audited offboarding runbooks, investors cannot verify technical resilience
      or transition costs if a customer decides to terminate service.
    diligencePath: >-
      Obtain standard master subscription agreements, SLA penalty schedules, and reference interviews with enterprise
      clients regarding historical feed downtime.
    relatedQuestionRefs:
      - QR010
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Audited GAAP income statement, balance sheet, and recurring software revenue figures rather than vendor-reported
      committed AUM.
    whyItMatters: >-
      Without audited ARR and gross margin data, revenue multiples and cash burn cannot be precisely benchmarked against
      public SaaS comps.
    diligencePath: >-
      Request confidential management financial package and revenue breakdown by customer cohort during private
      diligence.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV003
