company:
  name: "Ridgeline"
chapter:
  number: 6
  title: "Customers"
  summary: "Ridgeline publishes named asset- and wealth-management customer stories with quantified operational outcomes, while a September 2026 report identifies two additional adopters. The proof is still mostly company-selected: public NRR, GRR, churn, customer count, contract duration, and revenue concentration remain unavailable."
sections:
  - id: "customer-segments"
    title: "Customer segments and users"
    body: "Ridgeline's disclosed customer surface centers on investment managers and wealth managers rather than a broad horizontal software market. Company materials describe relationship managers, portfolio managers, traders, compliance teams, accounting teams, operations staff, and firm administrators working from a shared system, while a company-authored job repost identifies mid-enterprise and large investment and wealth management firms as the customer-success portfolio. This supports a multi-role, firm-wide deployment thesis, but it does not establish customer counts or revenue mix by segment. The commercial model may reduce seat-level adoption friction because Ridgeline says pricing is based on firm assets, employee count, and supported asset classes and strategies rather than licensed users."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU009"
      - "CU011"
    tableRefs:
      - "TU001"
  - id: "adoption-and-named-proof"
    title: "Adoption and named customer proof"
    body: "The strongest evidence is a set of named, company-published customer stories. Saratoga reports 11.4% more time in market each day and 33% faster daily reconciliation; Seizert reports six-figure annual seat-license savings; Cornerstone reports reclaiming more than two weeks of employee time annually and eliminating the cause of 50% of trading errors; and Argent reports consolidating 10 systems. These are specific operating outcomes, but the pages do not disclose measurement methodology, baselines, implementation cost, or outcome audit. Separate September 2026 reporting says Wasatch Global Investors went live and Cabot Wealth Management became the first customer to use Intelligent Outcomes. Ridgeline's more than $750 billion of committed AUM and AUA is a pipeline-and-scale indicator, not revenue, live assets, or customer count."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU015"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-and-expansion"
    title: "Durability and expansion mechanics"
    body: "Ridgeline describes a deliberate post-sale motion but publishes no outcome-level retention statistics. Its standard and premium Customer Success Plans include training, feature adoption, technical support, and dedicated advocates, while a current customer-success job repost assigns onboarding, account planning, adoption, renewals, retention, references, and expansion to the role. These disclosures show the intended mechanism for land-and-expand and customer advocacy; they do not prove renewal performance. Flexible contract duration and the absence of per-user pricing could support broader use inside an account, but no public cohort data connects those terms to higher GRR, NRR, utilization, or contract expansion. The journey map therefore distinguishes disclosed process from verified customer outcomes."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
    figureRefs:
      - "FU001"
  - id: "validation-and-concentration-risk"
    title: "Validation, implementation, and concentration risk"
    body: "External validation is the central weakness in the available evidence. Two RFP.wiki comparison pages state that public proof is strongest in vendor material, show no Ridgeline reviews from the listed third-party review sites, and warn that enterprise breadth implies material implementation work; these are low-reputation comparison signals, not independent benchmarks of satisfaction or retention. Built In's explicitly AI-generated candidate summary likewise cautions that committed AUM may include assets not yet live and that third-party validation remains limited. Zabal Media reports more than 60 qualified leads from Ridgeline's website project, but that supplier case study does not disclose conversion into customers. With no disclosed retention cohorts, account count, top-customer revenue share, or channel contribution, durability and concentration require direct diligence rather than inference from named logos."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU016"
