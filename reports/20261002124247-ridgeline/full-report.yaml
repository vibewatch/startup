      - number: '3.3'
        title: Pricing Structures and Total Cost of Ownership
        blocks:
          - type: paragraph
            body: >-
              Pricing and commercial packaging represent critical battlegrounds in the displacement of legacy financial
              technology providers. Traditional industry solutions rely heavily on per-seat terminal licenses, modular
              software add-ons, and recurring integration maintenance fees that scale directly with employee headcount.
              In contrast, Ridgeline positions its commercial model around enterprise platform consolidation, enabling
              investment management firms to eliminate user seat constraints and reduce total cost of ownership by
              retiring an average of six to nine legacy applications. Customer case studies published by Ridgeline
              indicate six-figure annual software savings and significant reductions in trade error costs following
              migration. Nevertheless, evaluating total cost of ownership requires factoring in the substantial internal
              change management and implementation investment required to transition an entire firm off historical
              accounting systems. Incumbents frequently leverage multi-year contract renewals and bundled custodial
              services to defend their pricing power against emerging modern platforms.
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
