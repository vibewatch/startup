            body: >-
              Ridgeline was founded in 2018 and is headquartered in the Lake Tahoe area, with public materials also
              identifying teams or offices in New York, Reno, the Bay Area, and Dublin. It positions itself as a
              front-to-back system of record for investment managers, combining portfolio, trading, accounting,
              compliance, reporting, and client-service workflows on a unified data model. The latest financing
              establishes its current stage as a private Series E company. Public sources do not disclose a pricing
              schedule, contract structure, audited revenue, or a precise customer count, so the business model can be
              described as enterprise investment-management software but not quantified as a particular
              recurring-revenue model.
