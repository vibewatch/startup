    data:
      layers:
        - label: Client Ingress & Public API
          detail: >-
            Public AWS API Gateway terminating external REST requests, enforcing authentication, and proxying named
            persisted operations.
        - label: VPC Gateway & Federation Mesh
          detail: >-
            Internal private API gateways meshing squad microservice graphs through GraphQL Federation into a unified
            data schema.
        - label: Serverless Execution Layer
          detail: >-
            Event-driven compute using AWS Lambda for stateless microservices and business logic execution across squad
            domains.
        - label: Workflow Orchestration Engine
          detail: >-
            AWS Step Functions managing multi-step asynchronous processing, complex batch calculations, and long-running
            jobs.
        - label: Polyglot Persistence Layer
          detail: >-
            Amazon Aurora for ACID relational records, Amazon DynamoDB for low-latency key-value state, and Amazon S3
            for documents.
        - label: Observability & Security Foundation
          detail: >-
            Amazon CloudWatch telemetry, distributed tracing, and automated DevSecOps guardrails supporting SOC 2 Type
            II compliance.
