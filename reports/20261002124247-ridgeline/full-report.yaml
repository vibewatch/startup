  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Architecture
        blocks:
          - type: paragraph
            body: >-
              The core addressable software boundary for Ridgeline encompasses enterprise investment management
              platforms serving institutional asset managers, registered investment advisors (RIAs), and wealth
              management firms. Historically, investment organizations operate on fragmented multi-vendor software
              stacks composed of distinct point applications spanning order and execution management (OMS/EMS),
              portfolio accounting (IBOR/ABOR), compliance monitoring, and client reporting. Ridgeline defines its
              operational domain as a unified front-to-back system of record that eliminates architectural handoffs and
              data reconciliation latency across these functional silos. Because broader search retrieval often surfaces
              homonymous terminology—ranging from consumer pickup trucks to outdoor equipment—diligent market boundary
              framing requires rigorously isolating institutional enterprise SaaS budgets from extraneous consumer
              products. Within this enterprise boundary, the prevailing status quo remains brittle integrations between
              entrenched legacy point solutions.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM010
      - number: '2.2'
        title: Market Sizing Dimensions, Segment Expansion, and Growth Trajectory
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market opportunity for unified investment management infrastructure requires
              analyzing platform adoption velocity alongside institutional asset metrics. Sizing can be viewed across
              total investable asset scale, software spend commitments, and enterprise platform penetration. Industry
              participants manage trillions in aggregate assets, but addressable software spend is dictated by
              technology budgets rather than raw AUM figures. Ridgeline's commercial traction serves as an operational
              proxy for core platform penetration, expanding from over $650 billion in committed assets under management
              across early 2026 to surpassing $750 billion in committed AUM and AUA by late 2026 following its $250
              million Series E round. However, published third-party figures often suffer from coverage gaps, and raw
              asset scale cannot be equated directly to vendor annual recurring revenue. The total addressable software
              spend remains capped by software-as-a-service budgets rather than overall asset valuations, requiring
              disciplined bottom-up sizing based on firm counts and displacement economics.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
