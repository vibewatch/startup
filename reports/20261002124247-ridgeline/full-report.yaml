      - number: '4.3'
        title: Capital Adequacy, Liquidity Profile, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Ridgeline maintains exceptional near-term capital adequacy following its $250 million Series E financing
              in September 2026, which valued the company at $1.425 billion. The equity round was anchored by founder
              and chairman Dave Duffield, who has personally injected more than $400 million since inception,
              complemented by strategic participation from customers and affiliates including Motley Fool Ventures,
              Smead Capital Management associates, and Patrick O'Shaughnessy. Platform commitments expanded from $650
              billion in March 2026 to more than $750 billion in AUM/AUA by September 2026, with management targeting $1
              trillion by January 2027. However, external market assessments stress that committed AUM is a
              vendor-stated operational proxy that includes assets not yet live in production, without audited
              third-party market share or revenue validation. For institutional underwriters, Ridgeline presents an
              elite sponsor-backed capital buffer and rapid platform adoption, balanced against structural dependency on
              insider capital, unverified cash burn velocity, and complete opacity regarding GAAP revenue and
              contractual renewal retention.
