        - Margin pressure and extended sales cycles among conservative RIAs
        - High (50%)
      - - Bear Case
        - Implementation complexity stalls go-lives; incumbents build equivalent AI layers; high cash burn
        - Down-round or flat extension below $1.0B valuation requiring recapitalization
        - Tier-1 customer attrition or failure to convert committed AUM into recognized revenue
        - Low-Medium (20%)
      - - Kill Trigger Case
        - Core architectural failure in trading/compliance or loss of Dave Duffield backing
        - Severe multiple collapse or forced asset sale
        - Breach of fiduciary compliance or critical system outage
        - Low (<5%)
    notes: >-
      Scenario valuations and probabilities reflect synthesized private market marks, Duffield capital support, and
      conversion rates of committed AUM.
    claimRefs:
