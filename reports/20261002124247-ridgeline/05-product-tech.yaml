callouts:
  - calloutType: "insight"
    title: "Strategic Trade-Off of Restricting External GraphQL Access"
    body: "While Ridgeline relies heavily on GraphQL Federation to allow internal microservices to compose data cleanly, the architecture intentionally does not expose raw GraphQL endpoints externally. By restricting third-party integrators to pre-compiled persisted operations via AWS API Gateway, Ridgeline avoids the massive documentation, validation, and arbitrary-query performance hazards typical of public enterprise GraphQL APIs."
    claimRefs:
      - "CE008"
      - "CE009"
  - calloutType: "risk"
    title: "Challenger Scale vs. Incumbent Infrastructure Depth"
    body: "Despite surpassing $750B in committed assets under management and administration by late 2026, Ridgeline remains an emerging challenger against entrenched legacy systems such as BlackRock Aladdin, SimCorp, and Charles River. Third-party industry assessments highlight that Ridgeline's rapid AI-led product velocity outpaces its referenceable enterprise base, requiring continuous validation of system stability and execution resilience under sustained high-volatility market events."
    claimRefs:
      - "CE013"
      - "CE015"
      - "CE016"
