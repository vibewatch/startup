  - id: "sec-recommendation-logic"
    title: "Synthesis, Diligence Asks, and Recommendation Chain"
    body: |
      Synthesizing platform scale, customer conviction, competitive reality, and valuation discipline yields a conclusive Buy recommendation with medium confidence and a medium risk rating. Customer co-investment from practicing portfolio managers represents an exceptional signal of software utility and workflow indispensability that rarely occurs in enterprise software financings. Furthermore, Dave Duffield's sponsorship and personal capital commitment provide unparalleled strategic and operational backstopping that de-risks execution and capital availability through multi-year enterprise adoption cycles.

      Nonetheless, medium confidence is warranted because Ridgeline remains an unquoted private company without disclosed GAAP financials, audited annual recurring revenue, or published gross retention figures. The $1.425 billion valuation multiple already discounts substantial future execution success. Therefore, prospective investors must demand explicit stage-gated diligence protections. Primary diligence asks include obtaining audited GAAP financial statements, verifying contractually committed versus live production ARR, evaluating net revenue retention across mature asset manager cohorts, and reviewing implementation lead times for European go-lives. As mapped in the accompanying decision framework, this staged diligence chain balances visionary platform potential against rigorous entry pricing.
    claimRefs:
      - "CV001"
