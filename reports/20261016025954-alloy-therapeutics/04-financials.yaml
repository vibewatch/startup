schemaVersion: report-v2
artifact: financials
slug: alloy-therapeutics
runDate: 2026-10-16
company:
  name: Alloy Therapeutics
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports Alloy's hybrid monetization model and confirms that
    the April 2026 Series E funded a push from discovery into downstream
    development and AI-enabled infrastructure. The same sources do not disclose
    revenue, margins, burn, cash, or realized pricing, and even cumulative
    funding totals disagree across external databases, so underwriting still
    depends on management-only financial data.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model and monetization
    body: >-
      Public materials describe Alloy as a hybrid biotech-infrastructure model
      rather than a single product company. The clearest disclosed pricing term
      is the Innovation Subscription described in the October 2022 Series D
      announcement: a flat annual fee for access to current and future Alloy
      platforms with no milestones or royalties. That official framing is
      directionally consistent with third-party profiles that describe the
      revenue model as contracted services plus technology licensing. Alloy's
      current target-rich joint-venture pitch adds a third economic surface:
      partners bring targets, while Alloy provides discovery services and
      company-creation support through 82VS. That mix implies multiple possible
      revenue streams, but the public record still does not quantify stream mix,
      realized pricing, or take rates.
    claimRefs: [CI001, CI002, CI003, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-proxies-and-cost-structure
    title: Traction proxies and cost structure
    body: >-
      Public traction signals are breadth metrics, not financial outputs. The
      April 2026 financing announcement says Alloy had more than 200 partners,
      more than 100 licensed therapeutic programs, and 22 programs in clinical
      development, versus over 130 partners cited in the October 2022 Series D
      announcement. PatSnap's October 2026 pipeline view still shows visible
      disclosed assets concentrated in discovery and preclinical stages, which
      suggests downstream value creation remains early and does not substitute
      for revenue disclosure. A September 2026 third-party company feed also
      lists a multi-target Biogen license and a multi-year AbbVie platform
      agreement, but provides no deal values. These operating and commercial
      proxies show breadth while leaving margins, utilization, sales efficiency,
      and conversion of partner activity into recognized revenue undisclosed.
    claimRefs: [CI005, CI006, CI007, CI008, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-blockers
    title: Capital adequacy and underwriting blockers
    body: >-
      The recent funding signal is clear even if the full capital history is
      not. Multiple sources agree Alloy raised $40 million at a $1 billion
      valuation in 2026, and the stated use of proceeds has expanded from
      modality-building in 2022 toward downstream preclinical and clinical
      services plus AI and data infrastructure in 2026. That change implies a
      broader capital envelope, but public datasets still disagree on total
      historical capital raised and omit the operating metrics needed to assess
      adequacy. Because retained sources do not disclose revenue, gross margin,
      burn, cash, runway, customer concentration, or backlog conversion, the
      chapter's financial verdict remains a gating diligence request rather than
      a completed underwriting view.
    claimRefs: [CI004, CI009, CI010, CI011, CI012, CI015, CI016]
callouts:
  - calloutType: insight
    title: Hybrid model is visible; economic mix is not
    body: >-
      Alloy's public materials support a real mix of subscription access,
      project services, and venture-studio support, but they stop short of
      disclosing what portion of revenue each line contributes or which lines
      carry the best margin profile.
    claimRefs: [CI001, CI002, CI003, CI014]
  - calloutType: risk
    title: Capital adequacy is still a management-only question
    body: >-
      The company has recent financing and clear growth ambitions, yet retained
      public sources do not disclose cash, burn, runway, or realized revenue,
      so investors cannot test whether the current balance sheet is enough to
      fund Alloy's broader service and infrastructure expansion.
    claimRefs: [CI011, CI012, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Innovation Subscription
        - Annual platform access to current and future Alloy technologies
        - Annual contract
        - Publicly described; price point undisclosed
        - Official pricing structure exists, realized economics undisclosed
        - Obtain customer contracts, tiering, renewal, and realized ASPs
      - - Contract discovery services
        - Fee-for-service antibody, TCR, and related discovery campaigns
        - Project / campaign
        - Publicly described; no disclosed booking or revenue volume
        - Service line is clear, throughput economics are not
        - Request bookings, conversion, utilization, and gross margin by service
      - - Downstream development services
        - Preclinical and clinical development support
        - Project / milestone-based engagement
        - Series E use-of-funds highlights expansion; current revenue contribution undisclosed
        - Strategic expansion is visible, commercial maturity is not
        - Request revenue by stage, staffing model, and contribution margin
      - - Biologics manufacturing
        - Manufacturing support within the broader infrastructure stack
        - Batch / program support
        - Mentioned in 2026 company description; no public commercial metrics
        - Capability is public, monetization is opaque
        - Request capacity, utilization, and pricing model
      - - 82VS / joint-venture support
        - Discovery plus company-creation services for target-rich biotechs
        - Deal-specific economics
        - Publicly described; ownership and fee structure undisclosed
        - Optional upside may exist, but economics are not public
        - Request cap-table, fee, equity, and downstream participation terms
    notes: >-
      Partial public view compiled from official Alloy pages and external company
      profiles; rows describe observable revenue mechanisms, not quantified
      revenue mix, and null/undisclosed economics require management diligence.
    claimRefs: [CI001, CI002, CI003, CI004, CI014]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Innovation Subscription
        - Flat annual fee; no milestones or royalties
        - Only list-structure language is public
        - Dollar price, tiers, and renewal behavior unknown
        - Alloy Series D announcement
      - - Technology licensing
        - Licensing-based monetization referenced in company profiles
        - Third-party summary only
        - Upfronts, exclusivity, field-of-use, and royalties undisclosed
        - Multiples profile
      - - Discovery services
        - Bespoke campaigns and project work
        - No public price card retained in this pool
        - Realized pricing, discounts, and scope variability unknown
        - Alloy target-rich page and company profiles
      - - Joint-venture / company creation support
        - Economics not publicly specified
        - No public price or fee disclosure
        - Equity participation, service charges, and downstream rights unknown
        - Alloy target-rich page
    notes: >-
      This table distinguishes publicly disclosed pricing structure from actual
      realized pricing; no retained source provides a price card, customer
      discount policy, or realized contract economics.
    claimRefs: [CI001, CI002, CI003, CI013, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue by stream
        - null
        - Low
        - Required to test mix, concentration, and growth quality
        - Request trailing 12-month revenue split by subscription, services, manufacturing, and venture-related income
      - - Gross margin by line
        - null
        - Low
        - Distinguishes software-like access economics from labor- and capacity-heavy services
        - Request gross margin bridge by business line
      - - CAC / payback
        - null
        - Low
        - Necessary to evaluate sales efficiency for a partner-led B2B model
        - Request new-logo acquisition cost, sales cycle, and payback by customer segment
      - - Cash balance / runway
        - null
        - Low
        - Core test of capital adequacy after the 2026 raise
        - Request latest cash, monthly burn, and downside runway
      - - Pipeline maturity proxy
        - Public pipeline visibility centers on discovery and preclinical assets
        - Medium
        - Indicates downstream value realization is still early and not yet a revenue proxy
        - Reconcile program stages to revenue recognition and backlog
      - - Operating-capacity buildout
        - Multi-target Biogen license and multi-year AbbVie platform agreement publicly listed
        - Medium
        - Commercial breadth is visible, but contract values and revenue timing are not
        - Provide signed contract values, upfronts, milestones, and recognition schedules
    notes: >-
      Null values reflect unavailable public disclosure rather than zero; the two
      non-null rows are operating proxies drawn from retained evidence and should
      not be treated as substitutes for reported unit economics.
    claimRefs: [CI007, CI008, CI012, CI013, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Alloy's public financial story flows from partner demand into platform
      access, services, and company-creation support, then back into platform
      investment, but the public record does not quantify realized margins or
      cash conversion at any step.
    data:
      nodes:
        - id: partners
          label: Partner demand
          detail: >-
            More than 200 partners and over 100 licensed therapeutic programs are
            public activity signals, not revenue disclosures.
          claimRefs: [CI005]
        - id: subscription
          label: Subscription / licensing
          detail: >-
            The clearest disclosed pricing term is a flat annual subscription
            with no milestones or royalties.
          claimRefs: [CI001, CI002]
        - id: services
          label: Discovery services
          detail: >-
            Alloy publicly markets discovery campaigns and broader contracted
            services across multiple modalities.
          claimRefs: [CI002, CI003]
        - id: downstream
          label: Downstream development
          detail: >-
            Series E proceeds were earmarked to expand preclinical and clinical
            development services.
          claimRefs: [CI004, CI015]
        - id: venture
          label: 82VS / joint ventures
          detail: >-
            Target-rich partners can use Alloy for discovery plus company
            creation support, but deal economics are not public.
          claimRefs: [CI003, CI014]
        - id: reinvestment
          label: Reinvestment and infrastructure
          detail: >-
            Public sources show continued platform expansion, licensing activity,
            and AI/data investment, but not margin or cash conversion.
          claimRefs: [CI004, CI008, CI012, CI015]
      edges:
        - from: partners
          to: subscription
          label: platform access
          claimRefs: [CI001, CI005]
        - from: subscription
          to: services
          label: broader engagement
          claimRefs: [CI002, CI003]
        - from: services
          to: downstream
          label: lifecycle expansion
          claimRefs: [CI004, CI015]
        - from: downstream
          to: venture
          label: optionality beyond fees
          claimRefs: [CI003, CI014]
        - from: venture
          to: reinvestment
          label: capital and capability build
          claimRefs: [CI004, CI008, CI015]
    approximationNotes: >-
      This is a qualitative operating bridge from public evidence, not a
      revenue-recognition or gross-profit waterfall; no retained source provides
      dollar weights for the intermediate steps.
    claimRefs: [CI001, CI003, CI004, CI014, CI015]
