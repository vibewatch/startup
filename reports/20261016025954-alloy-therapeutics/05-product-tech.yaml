        - label: Translation and footprint
          detail: Distributed execution and modality expansion across the operating network.
          items:
            - Five named labs
            - Operations in Europe Japan and the Middle East
            - AntiClastic ASO expansion signal
          outputs:
            - Distributed partner execution
    claimRefs: [CE001, CE002, CE006, CE007, CE013, CE015, CE016]
callouts:
  - calloutType: strength
    title: Product strength
    body: >-
      Alloy's clearest technical advantage is architectural breadth: one commercial model
      spans discovery platforms, AI/data tooling, downstream services, and company
      creation while staying visibly partner-aligned rather than pipeline-competitive.
    claimRefs: [CE001, CE002, CE007, CE014]
  - calloutType: risk
    title: Product risk
    body: >-
      The public record supports product breadth more convincingly than it supports
      operational proof, because named technical benchmarks, public control frameworks,
      and module-level utilization economics are still largely undisclosed.
    claimRefs: [CE011, CE012, CE015]
