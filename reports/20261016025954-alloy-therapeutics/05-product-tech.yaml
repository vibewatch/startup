          items:
            - Pipeline-neutral PDO
            - Shared partner infrastructure
          outputs:
            - Licensing
            - Services
            - Company creation
        - label: Discovery platforms
          detail: Modality-specific tools and services used in partner discovery programs.
          items:
            - ATX-Gx humanized transgenic mice
            - ATX-CLC bispecific and multispecific discovery
            - ATX-SiD single-domain antibody discovery
