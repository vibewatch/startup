  evidenceGaps:
    - type: missing-source
      severity: material
      topic: architecture-benchmarks
      missingEvidence: Public technical architecture, partner integration details, and benchmarked cycle-time or quality data by module.
      whyItMatters: Without implementation detail and benchmark data, it is hard to judge whether Alloy's stack is meaningfully better than stitched point solutions or simply broader in marketing scope.
      diligencePath: Request an architecture walkthrough, named integration examples, and before-vs-after workflow metrics from recent customer deployments.
      relatedQuestionRefs: [QE003]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: security-quality-controls
      missingEvidence: Named security privacy and quality-control frameworks, certifications, incident history, and status reporting for partner-data handling.
      whyItMatters: The product is partly sold on shared infrastructure and protected partner data, so control maturity matters directly for customer trust and regulated-workflow suitability.
