        - label: Downstream development services
          x: 4
          y: 4
          detail: Pharmacology, preclinical, clinical, and manufacturing scope.
        - label: Consulting and company creation
          x: 5
          y: 3
          detail: Development consulting, launch support, and venture pathways.
    approximationNotes: >-
      Coordinates are qualitative ordinal classifications of disclosed modules, not
      measured performance, market share, price, or independent competitive scores.
