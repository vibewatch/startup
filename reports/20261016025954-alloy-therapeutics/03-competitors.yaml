        - Teams prioritizing model-led design and prioritization
        - Potential software or model specialization
        - Public evidence does not establish equivalent wet-lab or downstream scope
      - - Multi-vendor assembly
        - Substitute operating model
        - No single-company scale or funding metric
        - Buyers willing to coordinate specialist vendors
        - Choice of best-fit provider at each workflow step
        - Integration cost and data-transfer risk are not quantified
    notes: >-
      Alloy metrics are company-issued. Alternative rows are solution archetypes inferred
      from the work Alloy says it replaces; unsupported peer scale, funding, and outcome
      fields are marked unavailable rather than estimated.
    claimRefs:
      - CP003
      - CP005
      - CP007
      - CP012
      - CP014
