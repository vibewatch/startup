          y: 2
          detail: Discovery-stage platform access used in partner programs.
        - label: Antibody / TCR licensing
          x: 1.5
          y: 2
          detail: Licensing and service access for specialist discovery workflows.
        - label: Subscription technology access
          x: 1.5
          y: 1
