        - Not established by the reviewed pages
        - Teams needing one modality or discovery tool
        - Potential depth in a narrower scientific domain
        - No named-peer performance or scale comparison is available
      - - Integrated research and development provider
        - Direct or adjacent service alternative
        - Not established by the reviewed pages
        - Teams outsourcing multiple experimental or development stages
        - Execution breadth without owning infrastructure
        - No comparable price, quality, or delivery benchmark is available
      - - AI or computational design platform
        - Adjacent point solution
