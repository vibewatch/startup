  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Route or alternative
      - Public contract-model signal
      - Included scope
      - Price or discount disclosure
      - Buyer implication
    rows:
      - - Custom platform agreement
        - Multi-year agreement with upfront and delivery-linked payments
        - Bespoke antibody-platform development and access
        - Payment amounts not disclosed
        - Economics require a proposal or diligence-room contract review
      - - Platform licensing / subscription
        - Licensing and subscription-based access are described
        - Antibody, TCR, and pre-competitive technology access
        - List price, unit, commitment, and discounts not disclosed
        - Potentially lighter-weight than building a platform internally
      - - Discovery and development services
        - Service-led packaging across discovery and downstream work
        - Optimization, pharmacology, preclinical, clinical, and manufacturing support
        - Rate cards and realized pricing not disclosed
        - Breadth may reduce vendor coordination but value cannot be price-tested publicly
      - - Internal build
        - Payroll, facilities, systems, and program investment
        - Buyer-controlled capabilities and data
        - No normalized comparison in the reviewed evidence
        - Control must be weighed against intermittent utilization and fixed cost
    notes: >-
      Public evidence establishes packaging forms, not comparable prices or realized
      economics. Null price detail means undisclosed in the reviewed pages, not free or
      unavailable from the vendors directly.
    claimRefs:
      - CP001
      - CP004
      - CP006
      - CP013
      - CP014
