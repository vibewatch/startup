      - number: '2.2'
        title: 买方细分、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              可见买方组合比传统生物科技工具细分市场更广。TBPN Digest 称 Alloy 同时服务大型药企和小型虚拟生物科技公司， Hoodline 则提到其 2026 年与 Biogen、AbbVie
              的具名平台交易。Alloy 自己 2022 年的材料还称，82VS 公司往往是 新能力的首批客户，说明除外部药企和生物科技需求外，还存在公司孵化和科学家创业者渠道。公开来源很少说明具体
              预算负责人，因此最稳妥的理解是：Alloy 面向发现和开发预算销售，使用者包括技术路线科学家、转化团队以及希望 避免内部重建基础设施的小型公司建设者。
