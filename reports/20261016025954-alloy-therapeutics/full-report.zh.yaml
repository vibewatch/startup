      - number: '1.3'
        title: 里程碑、战略扩张与待解决的尽调问题
        blocks:
          - type: paragraph
            body: >-
              保留的里程碑记录显示，这项业务是分层扩展，而不是突然转向。到 2022 年 10 月，Alloy 已完成 Series D、 推出 Keyway TCR Discovery、拓展至基因药物，并在
              Basel、Athens 和 San Francisco 增设研究地点。2026 年， 第三方更新流又显示出一系列融资之外的平台与品牌里程碑，包括与 AbbVie 的抗体平台合作、Biogen 的
              AntiClastic 许可、新设 Vigilance Division，以及入选世界经济论坛 Unicorns Community。这条轨迹支持 Alloy
              从发现工具扩展为一体化基础设施层的判断，但同一批公开资料仍留下重要尽调缺口：经济质量、准确组织 规模、董事会控制权，以及是否存在未被现有来源覆盖的法律或监管问题。
