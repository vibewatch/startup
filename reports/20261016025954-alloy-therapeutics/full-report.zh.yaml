              Tracxn 报告三轮融资合计 $157m，其中包括 2022 年以 $375m 投后估值完成的 $42m Series D，以及 2026 年以 $1b 估值完成的 $40m Series
              E。按这些估值计算，估值约增长二点七倍，而最新一轮新发行资本约占公告投后估值的 4%。但两项计算都不能证明价值创造：融资额不等于可用现金，来源也未披露期间收入增长、
              盈利能力、烧钱、二级出售、稀释、清算优先权或债务。因此，这轮融资证明投资人愿意为平台提供资金，却不能证明价格有 经济支撑，也不能说明分析日仍有多少融资所得。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: 正向论点、反向论点与情景
        blocks:
          - type: paragraph
            body: >-
              正向论点是，广泛的发现与开发基础设施层可以在众多伙伴项目上变现，而不必依赖单一内部药物资产。Alloy 称已与 200 多家伙伴合作，产出 100 多个获许可治疗项目，并将 22 个推进到临床开发，其中两个进入
              Phase 3。反向论点是， 这些只是活动和管线数量，并非披露的收入、留存、利润率或现金创造指标。Tracxn 庞大且异质的竞争者集合也无法提供
              清晰的估值基准。因此，乐观、基准和悲观情景必须表达为取决于证据的方向，而不是没有依据的点估计或概率百分比。
            claimRefs:
              - CV005
