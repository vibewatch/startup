      - number: '3.3'
        title: 商业接入形式灵活，但价格不透明
        blocks:
          - type: paragraph
            body: >-
              公开材料显示 Alloy 生态有多条接入路径。AbbVie 协议是多年期平台开发安排，包含预付款及与平台交付挂钩的另一笔付款。
              公司资料还描述了许可、发现与优化服务及订阅接入；另一份资料则强调面向学术界、小型生物科技公司和大型生物制药企业的 可负担、非独家接入。Alloy 还称 ATX-Gx 平台已被 200
              多家伙伴使用，并在美国、日本、中东及其他市场形成分布式布局。 这些信号说明分发和伙伴接入范围广，但现有页面没有提供目录价、标准化计价单位、标准承诺期或折扣表。因此价格竞争力和 实际总成本仍是尽调问题。
