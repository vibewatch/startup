  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争对手是多种运营模式的集合
        blocks:
          - type: paragraph
            body: >-
              Alloy 并非单一用途的发现供应商。其自有公告描述了技术接入、科学服务、公司孵化，以及抗体、双特异性药物、TCR、
              基因药物、细胞疗法和药物递送支持。因此，实际竞争集合远不止一个具名同业群体。买方可以许可专业平台、聘请一体化 研发服务商、组合多个点供应商，或在内部自建能力。Alloy
              的融资公告明确把后者视为替代方案：合作伙伴无需拥有只需 偶尔使用的基础设施和专业人才。现有记录支持按解决方案类型描绘竞争格局，但不支持列出规模、融资或成果可比的具名 竞争者排名。
            claimRefs:
              - CP005
              - CP007
              - CP011
              - CP012
              - CP014
