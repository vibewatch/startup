        title: 管理层、创始人、资本基础与治理透明度
        blocks:
          - type: paragraph
            body: >-
              创始人信息主要以 Errik Anderson 为核心：他在 2022 年 Series D 和 2026 年 Series E 融资公告及第三方资料中均以创始人兼 CEO 身份出现。Tracxn 另将
              Alloy 的创立归于 Jed Dean 和 Zach Serber，说明公开创始人记录比对外 CEO 叙事更广，但从治理角度看仍不完整。资本形成情况远比经营经济数据清晰：Tracxn 称 Series C、
              D、E 合计融资 $157m；公司披露则确认 2022 年完成 $42m Series D，以及 2026 年在 $1b 估值下完成的 $40m Series E。8VC、Mubadala
              Capital、Founders Fund、Presight Capital 和 Thiel Capital 等投资人重复出现，显示融资联盟较稳定，但这批公开材料没有披露董事席位、持股比例、清算优先权或债务安排。
