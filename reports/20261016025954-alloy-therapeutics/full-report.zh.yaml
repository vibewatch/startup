        - label: 质量与控制面
          detail: 公开可见的信任信号，以及仍未验证的控制措施。
          items:
            - 合作伙伴数据保护声明
            - 信息安全招聘信号
            - 公开控制框架缺口
        - label: 转化与业务版图
          detail: 运营网络中的分布式执行和模式扩展。
          items:
            - 五个具名实验室
            - 在欧洲、日本和中东运营
            - AntiClastic ASO 扩展信号
          outputs:
            - 分布式合作伙伴执行
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE007
      - CE013
      - CE015
      - CE016
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开材料暗示客户会从广泛的发现访问，走向更深层的服务、平台和公司创建关系，但没有披露留存闭环。
    data:
      nodes:
        - label: 学术科学家 / 转化团队
          detail: 通过价格可负担、非排他的平台注册服务早期访问群体。
          touchpoints:
            - Entry through discovery infrastructure and tools
            - Potential science source for later company creation
        - label: 中小型生物科技公司
          detail: 发现项目、授权和支持服务的核心商业客户群。
          touchpoints:
            - Platform evaluation and discovery campaign start
            - Potential upsell into development services
        - label: 大型生物制药公司
          detail: 平台协议和 top-50 渗透率声明中出现战略客户。
          touchpoints:
            - Named platform or license agreement
            - Possible concentration risk without disclosed revenue mix
        - label: 发现与优化合作
          detail: 抗体、TCRm、RNA 和 AI/ML 工作流构成首个商业切入口。
          touchpoints:
            - Discovery campaign
            - Optimization and developability work
        - label: 下游开发服务
          detail: 公开材料将药理学、临床前、临床和生产制造支持定位为后续扩展。
          touchpoints:
            - Program maturation beyond discovery
            - Broader wallet share if customers stay on platform
        - label: 82VS / 公司创建闭环
          detail: 科学家创业者可以发展成共同打造企业的关系，而不是一次性服务客户。
          touchpoints:
            - Spinout or newco formation
            - Potential reuse of Alloy infrastructure across the lifecycle
    claimRefs:
      - CU001
      - CU002
      - CU008
      - CU009
      - CU010
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 六项重大风险目前主要来自执行端；虽然已有缓释信号，但没有公开事件频率证据可用于估计发生可能性。
    data:
      columns:
        - label: 可能性
          note: 当前公开证据加已披露的扩张路径
        - label: 影响
          note: 对投资判断、合作伙伴信任和下行保护的影响
        - label: 缓释成熟度
          note: 公开可见的控制措施、招聘和运营证据
        - label: 剩余暴露
          note: 当前可见缓释措施之后仍剩余的暴露
      rows:
        - label: 全栈执行拉伸
          note: 扩张如今覆盖发现、开发、AI / 数据和公司创建
          values:
            - label: 未测量
              tone: warning
              note: 多个新业务面同时扩张，但来源没有量化失败频率
            - label: 高
              tone: high
              note: 交付失误会同时挤压增长和估值支撑
            - label: 发展中
              tone: medium
              note: 已有公开招聘和扩张计划，但 KPI 证据薄弱
            - label: 高
              tone: high
              note: 公开经济数据和质量仪表盘仍然缺失
        - label: 数据治理与合作伙伴信任
          note: AI / 数据声明提高了隐私、安全和隔离控制的要求
          values:
            - label: 未测量
              tone: warning
              note: 公司称数据已联邦化并受到保护，但控制有效性没有经过独立测量
            - label: 高
              tone: high
              note: 控制失效会威胁客户信任和受监管业务
            - label: 发展中
              tone: medium
              note: 可见安全招聘和警戒机制，但没有外部鉴证
            - label: 中高
              tone: high
              note: 资料库中仍没有公开披露认证和事件证据
        - label: 合资与授权治理泄漏
          note: 82VS 和平台交易靠合同条款而不只是收入转移价值
          values:
            - label: 未测量
              tone: warning
              note: 模式正在运行，但条款细节和失败频率未公开
            - label: 高
              tone: high
              note: 隐含的经济利益或权利可能损害股权上行空间
            - label: 初期
              tone: warning
              note: 审阅模板条款前，缓释措施仍只是概念，尚未落地
            - label: 高
              tone: high
              note: 公开来源没有解决所有权和终止权问题
        - label: 质量体系证据缺口
          note: 业务范围扩张速度超过 GxP、QMS 和受监管业务控制的公开证据集
          values:
            - label: 未测量
              tone: warning
              note: 业务正进入更多受监管领域，但事件频率未披露
            - label: 高
              tone: high
              note: 质量问题可能直接中断合作伙伴项目
            - label: 初期
              tone: warning
              note: 公开证据仅限于战略和招聘信号
            - label: 中高
              tone: high
              note: 此处没有保留审计历史或认证范围
        - label: 集中度不透明
          note: 已披露合作伙伴数量，但未披露收入、利润率和项目集中度
          values:
            - label: 未测量
              tone: warning
              note: 合作伙伴数量无法揭示经济集中度或流失频率
            - label: 高
              tone: high
              note: 隐性集中度会放大资本密集型建设中的下行风险
            - label: 有限
              tone: warning
              note: 公开缓释证据主要是融资，而非信息披露
            - label: 高
              tone: high
              note: 在管理层披露经济数据前，投资判断缺口仍然很大
        - label: 估值支撑与已披露经济数据
          note: 当前独角兽估值已领先于利润率和现金生成方面的公开证据
          values:
            - label: 未测量
              tone: warning
              note: 新增资本无法证明资金跑道或融资重置的可能性
            - label: 高
              tone: high
              note: 任何后续融资重置都会直接影响回报预期
            - label: 有限
              tone: warning
              note: 未留存公开利润率、消耗、资金跑道或集中度细节
            - label: 高
              tone: high
              note: 在管理层披露经济数据前，投资判断缺口仍然很大
    approximationNotes: 该矩阵是对来源披露和公开缺口的定性综合，不代表量化的概率分布。
    claimRefs:
      - CR001
      - CR004
      - CR008
      - CR009
      - CR010
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 纳入缺失的经济数据和所有权证据后，已报告的融资和平台规模只能支持有条件的「继续研究」结论。
    data:
      nodes:
        - id: financing
          label: $40M Series E，估值 $1B
          detail: 这是当前融资估值，不是独立推导的内在价值。
        - id: scale
          label: 公司报告的平台规模
          detail: 超过 200 个合作伙伴和超过 100 个获授权项目。
        - id: economics-gap
          label: 运营经济数据不可得
          detail: 没有保留收入、利润率、消耗、资金跑道或集中度披露。
        - id: ownership-gap
          label: 所有权条款不可得
          detail: 没有保留优先权结构、稀释、债务或老股转让细节。
        - id: downside
          label: 下行空间无法界定
          detail: 倍数压缩和资本重组风险仍未量化。
        - id: decision
          label: 继续研究
          detail: 在完成尽调前，风险高且估值偏紧。
      edges:
        - source: financing
          target: scale
        - source: scale
          target: economics-gap
        - source: economics-gap
          target: ownership-gap
        - source: ownership-gap
          target: downside
        - source: downside
          target: decision
    approximationNotes: 这是定性决策逻辑，不推导估值、回报或情景概率。
    claimRefs:
      - CV002
      - CV011
      - CV015
      - CV016
