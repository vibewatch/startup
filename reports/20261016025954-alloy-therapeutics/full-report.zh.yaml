              D 公告提到 130 多家伙伴。PatSnap 2026 年 10 月 的管线视图显示，已披露资产仍集中在发现和临床前阶段，说明下游价值创造尚早，不能替代收入披露。2026 年 9 月第三方 公司信息流还列出
              Biogen 的多靶点许可和 AbbVie 的多年期平台协议，但未提供交易金额。这些运营和商业代理指标显示 覆盖广度，却没有披露利润率、利用率、销售效率以及伙伴活动转化为确认收入的情况。
