  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Alloy 实际销售的内容
        blocks:
          - type: paragraph
            body: >-
              Alloy 的公开定位先于任何规模测算划定了市场边界。公司与第三方摘要都将其描述为一套组合服务，覆盖平台许可、 发现服务、AI
              与数据工具，以及至少部分临床前和临床支持，而不是单一试剂或软件点解决方案。因此，相关支出 包括发现平台接入、外包的技术路线发现工作和部分开发基础设施，但不包括后期商业化、大规模生产以及完整披露
              的治疗产品经济性。现有替代方案包括药企自建平台、分散的 CRO/CDMO 外包和更窄的技术路线发现供应商，而不只是 其他抗体工具公司。
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM008
              - CM013
              - CM016
