chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位、布局与商业模式
        blocks:
          - type: paragraph
            body: >-
              Alloy Therapeutics 成立于 2017 年，目前将自身描述为覆盖发现、临床前开发和临床开发的产品开发机构， 依托自有 AI、真实世界数据以及覆盖多种技术路线的技术服务。到 2026 年 4
              月，公司明确将自己定位为 “全栈生物科技基础设施公司”，并称已与抗体、双特异性药物、基因药物和细胞疗法领域的 200 多家伙伴 合作，拥有 100 多个获许可治疗项目，其中 22 个已推进至临床开发。Tracxn
              还称截至 2026 年 9 月 30 日 有 159 名员工，但保留的公司来源未能佐证这一数字。公开地点信息并不一致：2026 年 4 月公司新闻稿署名 Boston，Seedlist 列出
              Boston，Tracxn 列出 Lexington。因此，近期最稳妥的判断是总部位于大波士顿地区， 而不是已经精确核实到某一个市镇。同一组证据支持平台覆盖面广，但无法确认精确收入、ARR、烧钱速度、
              现金跑道或客户数。
