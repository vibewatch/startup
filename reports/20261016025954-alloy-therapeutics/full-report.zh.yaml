      - number: '2.3'
        title: 受证据约束的规模估算、增长驱动因素与限制
        blocks:
          - type: paragraph
            body: >-
              公开证据更支持采用代理指标的规模视角，而不是清晰的美元 TAM、SAM 或 SOM。Alloy 披露及报道的指标从 2022 年 的 130 多家合作伙伴，增长到 2026 年的 200 多家合作伙伴、100
              多个获许可治疗项目和 22 个临床阶段项目； TBPN Digest 称其覆盖 17 个时区，Pulse2 还称其中两个项目已进入 Phase 3。这些指标说明其在药物发现工作流中
              触达面广，但不能与支出或经常性收入互换。公开记录中的主要采用驱动因素包括药企对外部创新的需求、AI 与湿实验室
              工作流日益重要，以及订阅或服务接入相较内部重建能力的吸引力。主要限制是湿实验室执行仍是物理瓶颈、公开价格未披露， 且公司没有发布分细市场规模框架，外部读者无法将合作伙伴数和项目数换算成可辩护的支出型市场估算。
