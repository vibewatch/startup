      - number: '3.4'
        title: 便利性可见，锁定效应尚未证实
        blocks:
          - type: paragraph
            body: >-
              Alloy 的广度可能带来工作流层面的便利：伙伴可以在使用相关数据、实验室、服务和科研关系的同时，从发现推进到开发。
              已披露的伙伴数量和地域扩张也说明其分发触达可能超过窄领域专家。但广度也让公司暴露于多类科学和服务执行风险，
              而公开披露没有量化多产品附着、续约、输赢率、迁移成本或伙伴多平台采购。护城河逻辑因此合理但尚未证实。专业供应商
              可以靠深度竞争，一体化服务商可以靠执行广度竞争，资本充足的生物制药公司也可以将敏感工作流留在内部。在缺少独立 基准和客户切换证据的情况下，Alloy 已披露的优势更像广泛的采购方案，而不是已证明的持久锁定。
            claimRefs:
              - CP003
              - CP009
              - CP012
              - CP014
              - CP015
              - CP016
