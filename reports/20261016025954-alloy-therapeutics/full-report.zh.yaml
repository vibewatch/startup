      - number: '3.2'
        title: 覆盖广度与工作流整合是核心差异化逻辑
        blocks:
          - type: paragraph
            body: >-
              最强的公开差异化信号是已披露模块的范围。Alloy 提供 ATX-Gx 抗体发现、其他抗体和 TCR 平台、竞争前技术订阅接入、 下游药理学、临床前及临床开发服务、生物制剂生产，以及连接湿实验室执行的
              AI/数据层。2025 年收购 Spannerwerks 后又增加开发和上市咨询，第三方摘要则称其获得 Biogen 的 AntiClastic 反义平台许可。这些证据支持战略方向不断
              扩大，但不能证明每个模块都处于行业最佳。整合质量、相对速度和产出质量仍缺乏基准，因此买方应评估模块之间的交接， 而不能把“全栈”当作结果指标。
