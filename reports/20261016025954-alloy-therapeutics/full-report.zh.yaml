      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              公开证据不足以评估 IPO、战略出售或二级流动性路径。在按报告估值或接近该估值投资前，尽调应核对按业务线划分的
              经审计收入、毛利率、订单、重复支出、客户集中度、项目转化、已承诺现金用途和现金跑道。还应取得完全稀释股权结构表、期权池、清算优先权、参与权、反稀释条款、债务以及 Series E
              的任何二级出售成分。论点破裂触发因素包括续约或重复 支出证据疲弱、临床项目未能推进、重大下轮融资，或经济模式需要持续投入资本却没有相应毛利润。只有这些项目的正面证据，
              而不是又一场头条融资，才足以重新评估估值立场。
            claimRefs:
