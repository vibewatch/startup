        title: 展示
        blocks:
          - type: callout
            title: 平台覆盖已超越抗体发现
            body: 最可信的 2026 年证据已不再把 Alloy 仅描述为发现工具供应商；其业务结合了发现、开发和数据基础设施， 并得到合作伙伴与项目规模以及投资人持续支持的佐证。
