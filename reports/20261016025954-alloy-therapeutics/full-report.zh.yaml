  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值与回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 经审计的增长、重复支出、毛利率和临床转化验证了可规模化的基础设施模式。
        - 只有经核实的经济性意味着有吸引力的风险调整后回报，当前估值之上的价值才有支撑。
        - 公司报告的活动未能转化为持久毛利。
        - 无法依据公开证据量化；需要最强的尽调结果。
      - - 基准
        - 战略牵引力真实存在，但运营经济性和股权结构表条款仍未验证。
        - 不要锚定 $1B；完成财务和法律尽调后再协商价格与保护条款。
        - 流动性兑现前仍需融资，进一步稀释普通股持有人的权益。
        - 目前公开证据最接近支持这一有条件情景。
      - - 熊市
        - 重复采购、毛利率、转化率或融资条款被证明弱于表面规模所暗示的水平。
        - 价值跌破当前估值，可能需要下轮融资或保护投资人的资本重组。
        - 商业化证据仍不完整，现金需求持续存在。
        - 由 KPI 验证失败、项目停滞或不利融资条款触发。
    notes: 这些情景只提供方向性判断，因为公开来源没有给出计算估值区间或概率权重所需的输入。
