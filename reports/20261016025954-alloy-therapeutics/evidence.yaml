evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership and founder table completeness
    missingEvidence: A current executive roster, board composition, and role status for non-CEO founders.
    whyItMatters: Leadership concentration and board visibility affect key-person risk and governance underwriting.
    diligencePath: Request an org chart, board list, and latest management bios in diligence.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder or investor map completeness
    missingEvidence: Current cap table, ownership percentages, board rights, preference stack, and any debt or credit facilities.
    whyItMatters: Financing risk cannot be underwritten from round announcements alone.
    diligencePath: Request the cap table, investor rights summary, and debt schedule.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headquarters and organizational scale
    missingEvidence: A single authoritative headquarters definition and corroborated current headcount.
    whyItMatters: Conflicting headquarters signals and thin headcount evidence weaken scale and operating-control analysis.
    diligencePath: Confirm legal HQ, operating HQ, and current employee count directly with the company.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: adverse evidence and governance red flags
    missingEvidence: >-
      Independent legal, regulatory, litigation, outage, or complaint evidence tied directly to Alloy's current
      operations.
    whyItMatters: Absence of surfaced adverse evidence in this assigned pool is not proof that no external red flags exist.
    diligencePath: Expand adverse searches and legal/regulatory database review in a later pass using eligible independent sources.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      A public market-size framework that converts Alloy's target workflows into dollar TAM, SAM, and SOM by segment or
      geography.
    whyItMatters: >-
      Without a spend-based denominator, partner and program counts cannot be translated into market share, penetration,
      or long-term upside with confidence.
    diligencePath: >-
      Request management's internal market-sizing model, the segment assumptions behind it, and any third-party research
      used to justify those assumptions.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-budget-ownership
    missingEvidence: >-
      Actual subscription price points, service-line pricing, budget-owner names, and cohort retention or expansion data
      by buyer segment.
    whyItMatters: >-
      Market attractiveness depends not only on theoretical demand but on whether Alloy can repeatedly capture budget at
      attractive price and retention levels.
    diligencePath: >-
      Ask for subscription contracts or pricing ranges, customer cohort analysis, and segment-level sales data showing
      who signs and funds each workflow.
  - type: missing-source
    severity: material
    topic: named-competitor-benchmarks
    missingEvidence: >-
      Independent named-peer evidence covering scale, funding, capabilities, pricing, delivery performance, and customer
      outcomes on a comparable basis.
    whyItMatters: >-
      Without a comparable peer set, Alloy's breadth can be described but neither relative superiority nor a defensible
      market position can be measured.
    diligencePath: >-
      Obtain recent RFPs, win-loss records, customer reference calls, and third-party benchmarks naming the vendors
      considered for the same scope.
    relatedQuestionRefs:
      - QP002
      - QP003
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Cohort retention, renewal, multi-product attachment, migration effort, and partner multi-homing data by customer
      segment.
    whyItMatters: >-
      These metrics determine whether integrated breadth creates durable attachment or only a convenient bundle that can
      be re-sourced.
    diligencePath: >-
      Request retention cohorts, product-attach analysis, renewal terms, lost-customer interviews, and references from
      customers that reduced or expanded Alloy usage.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Rate cards, minimum commitments, sample statements of work, realized discounts, and total-cost comparisons against
      internal and external alternatives.
    whyItMatters: Packaging breadth cannot be converted into a price or procurement advantage without normalized commercial terms.
    diligencePath: >-
      Review representative contracts and invoices, normalize pricing by workflow and milestone, and compare them with
      recent buyer RFP responses.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: public-financial-disclosure-gap
    missingEvidence: Reported revenue by stream, gross margin by line, burn, cash balance, and runway.
    whyItMatters: >-
      These are the minimum inputs needed to test revenue quality, capital adequacy, and margin path after the 2026
      raise.
    diligencePath: >-
      Request the latest board package or finance pack with trailing 12-month P&L, balance sheet, cash bridge, and
      budget versus actuals.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized subscription pricing, service price cards, discounting, backlog conversion, and renewal behavior.
    whyItMatters: >-
      List-structure language does not show whether Alloy monetizes its partner breadth at attractive or durable
      economics.
    diligencePath: >-
      Obtain customer contracts, cohort renewals, booked-versus-recognized revenue bridges, and pricing committee
      materials.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: venture-studio-economics
    missingEvidence: Equity ownership, fee model, and downstream economics for 82VS and target-rich joint ventures.
    whyItMatters: >-
      Venture-studio optionality could materially change the return profile, but it could also be non-cash or highly
      back-ended.
    diligencePath: >-
      Review JV formation documents, cap tables, intercompany agreements, and realized cash receipts from portfolio
      entities.
    relatedQuestionRefs:
      - QI001
      - QI008
    relatedTableRefs:
      - TI001
  - type: conflicting-data
    severity: material
    topic: cumulative-funding
    missingEvidence: Reconciled funding chronology including every priced and unpriced round plus current cash from each financing.
    whyItMatters: >-
      Public datasets disagree on total capital raised, which weakens dilution analysis and any estimate of remaining
      financing dependency.
    diligencePath: Reconcile cap-table history, financing closings, and cash-in schedules directly with company finance records.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: missing-source
    severity: material
    topic: architecture-benchmarks
    missingEvidence: Public technical architecture, partner integration details, and benchmarked cycle-time or quality data by module.
    whyItMatters: >-
      Without implementation detail and benchmark data, it is hard to judge whether Alloy's stack is meaningfully better
      than stitched point solutions or simply broader in marketing scope.
    diligencePath: >-
      Request an architecture walkthrough, named integration examples, and before-vs-after workflow metrics from recent
      customer deployments.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: security-quality-controls
    missingEvidence: >-
      Named security privacy and quality-control frameworks, certifications, incident history, and status reporting for
      partner-data handling.
    whyItMatters: >-
      The product is partly sold on shared infrastructure and protected partner data, so control maturity matters
