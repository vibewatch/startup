  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: Public NRR, GRR, churn, renewal, cohort, or contract-length metrics by customer segment.
      whyItMatters: Without durability metrics, customer breadth cannot be translated into repeat-spend quality or predictability.
      diligencePath: Request cohort retention, renewal, and contract-duration data by segment from management or the data room.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer revenue share, revenue by segment, and any disclosed channel or partner dependence.
      whyItMatters: Large-pharma penetration can be a strength or a concentration risk; public sources do not show which.
      diligencePath: Request customer concentration schedules, largest-account ARR or revenue share, and segment mix from management.
      relatedQuestionRefs: [QU005, QU008]
