schemaVersion: "report-v2"
artifact: customers
slug: alloy-therapeutics
runDate: 2026-10-16
company:
  name: Alloy Therapeutics
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports real customer breadth at Alloy Therapeutics: the company
    and multiple independent profiles consistently point to 200+ partners, 100+
    licensed therapeutic programs, and penetration into large biopharma accounts.
    The weaker point is durability: the retained source set does not disclose renewal,
    NRR/GRR, churn, or concentration metrics, so breadth is better evidenced than
    repeat economics.
sections:
  - id: customer-surface
    title: Customer surface spans the full biologics R&D stack
    body: >-
      Alloy's public positioning is unusually broad for a biotech-infrastructure company.
      Company-issued profiles describe a non-exclusive model serving academic scientists,
      small and medium biotech, and large biopharma rather than a single narrow buyer
      cohort. That matters for diligence because the likely payer varies by entry point:
      platform licenses and discovery campaigns may start with translational teams or
      venture-backed biotech, while later-stage development work and strategic platform
      agreements appear more relevant to larger pharma budgets. The segment story is
      therefore credible at the top of funnel, but the public record still does not
      show which segment contributes the highest recurring revenue or the best renewal
      behavior.
    claimRefs: [CU001, CU002, CU008, CU010]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-breadth
    title: Adoption proof is broad, but depth metrics remain sparse
    body: >-
      The strongest adoption evidence is not a disclosed customer count, but a cluster
      of activity metrics: more than 200 partners, more than 100 licensed programs,
      22 clinical-stage programs, and exposure to 18 of the top 50 biopharmaceutical
      companies. Those signals support real commercial usage and suggest Alloy is more
      than a logo wall or early research tool. Even so, they are breadth metrics rather
      than durability metrics. None of the retained sources quantify how many partner
      relationships are currently revenue producing, how many expand beyond initial
      discovery work, or what share of the installed base contributes most of the
      economics.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU014, CU015]
    tableRefs: [TU002]
  - id: named-proof
    title: Named customer proof exists, but production status is only partially visible
    body: >-
      Alloy does have named external proof beyond generic category claims. The retained
      independent update feed cites a multi-year AbbVie agreement, a Biogen license
      agreement around the AntiClastic platform, and a completed Mediar collaboration
      with a claimed six-month timeline improvement. That is useful because it shows
      real counterparties and at least some commercial surface in 2026. The limitation
      is that public summaries still do not distinguish clearly between pilot,
      discovery-stage, platform-license, and scaled production relationships for most
      named accounts, nor do they disclose contract value, expansion cadence, or
      renewal outcomes.
    claimRefs: [CU011, CU012, CU013, CU016]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Expansion logic is visible; retention and concentration are still open
    body: >-
      Public materials imply a reasonable expansion loop: customers can enter through
      antibody or AI-enabled discovery, add downstream development services, and in
      some cases extend into 82VS-backed company creation or broader modality work such
      as RNA and cell therapy. That suggests a land-and-expand thesis across modalities
      and lifecycle stages, not just one-off discovery projects. The unresolved issue
      is whether that commercial design actually produces durable economics. The
      retained pool did not surface published NRR, GRR, renewal rates, cohort behavior,
      or top-customer exposure, so customer concentration and repeat-spend durability
      remain material diligence gaps rather than verified strengths.
    claimRefs: [CU009, CU010, CU014, CU015, CU016]
callouts:
  - calloutType: insight
    title: Breadth is better evidenced than depth
    body: >-
      The public record supports broad adoption across partner count, program count,
      and named counterparties, but it does not yet show renewal or concentration
      metrics that would prove durable customer economics.
    claimRefs: [CU003, CU005, CU014, CU015]
  - calloutType: risk
    title: Retention and concentration remain material diligence gaps
    body: >-
      Alloy's public customer evidence does not quantify NRR, GRR, churn, contract
      length, or top-customer dependence, limiting confidence in the repeatability of
      revenue beyond the visible partnership footprint.
    claimRefs: [CU014, CU015, CU016]
