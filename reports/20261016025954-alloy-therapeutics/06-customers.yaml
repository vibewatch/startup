      severity: material
      topic: deployment-status
      missingEvidence: Production-vs-pilot status, contract value, and expansion history for named customers and partners.
      whyItMatters: Named counterparties prove relevance, but not whether Alloy converts references into scaled, durable accounts.
      diligencePath: Build a customer proof list with account name, engagement type, stage, contract value, renewal status, and expansion outcome.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
