callouts:
  - calloutType: strength
    title: Platform breadth now extends beyond antibody discovery
    body: >-
      The most credible 2026 evidence no longer describes Alloy as only a discovery-tool
      vendor; it combines discovery, development, and data infrastructure, supported by
      partner/program scale and repeated investor backing.
    claimRefs: [CO002, CO003, CO004, CO005, CO008]
  - calloutType: risk
    title: Public disclosure remains thin where underwriting precision matters most
    body: >-
      The pool supports financing and platform milestones, but not audited economics, exact
      customer count, board composition, ownership concentration, or a single uncontested
      headquarters definition.
    claimRefs: [CO006, CO015, CO016]
