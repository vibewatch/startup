slug: alloy-therapeutics
runDate: 2026-10-16
company:
  name: Alloy Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Alloy Therapeutics now presents itself as an AI-enabled biotech infrastructure company
    rather than only an antibody-discovery platform, and its April 2026 Series E financing
    at a $1 billion valuation is the clearest current anchor for that repositioning. Public
    evidence supports broad partner and program scale plus repeated backing from well-known
    investors, but precise revenue, customer, headcount, board, and cap-table governance
    revenue, customer, board, and cap-table governance metrics remain underdisclosed;
    current headcount is available only from an independent database.
sections:
  - id: identity-and-business-model
    title: Identity, footprint, and business model
    body: >-
      Alloy Therapeutics was founded in 2017 and now describes itself as a product
      development organization spanning discovery, preclinical development, and clinical
      development, powered by proprietary AI, real-world data, and tech-enabled services
      across multiple modalities. By April 2026, the company was explicitly framing itself
      as a "full-stack biotech infrastructure company" and saying it had collaborated with
      more than 200 partners across antibodies, bispecifics, genetic medicines, and cell
      therapies, with over 100 licensed therapeutic programs and 22 programs advanced to
      clinical development. Tracxn also reports 159 employees as of September 30, 2026,
      although the retained company-issued sources do not corroborate that figure. Public
      location signals are less clean: the April 2026 company
      release is datelined Boston, Seedlist lists Boston, and Tracxn lists Lexington, so the
      most defensible near-term read is a greater-Boston headquarters footprint rather than a
      single precisely verified municipality. The same evidence set supports platform breadth,
      but not precise revenue, ARR, burn, runway, or exact customer count.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO015, CO016]
    tableRefs: [TO001]
  - id: leadership-funding-and-governance
    title: Leadership, founders, capital base, and governance visibility
    body: >-
      Founder visibility is concentrated around Errik Anderson, who appears as founder and
      chief executive in both the 2022 Series D and 2026 Series E financing announcements
      and in third-party profiles. Tracxn separately attributes Alloy's founding to Jed Dean
      and Zach Serber, which suggests the public founder record is broader than the outward
      CEO narrative but still incomplete from a governance perspective. Capital formation is
      much clearer than operating economics: Tracxn reports $157 million raised across Series
      C, D, and E, while company disclosures confirm the 2022 $42 million Series D and the
      2026 $40 million Series E at a $1 billion valuation. Repeat investor names across 8VC,
      Mubadala Capital, Founders Fund, Presight Capital, and Thiel Capital indicate a stable
      financing syndicate, but public materials in this pool do not disclose board seats,
      ownership percentages, liquidation preferences, or debt facilities.
    claimRefs: [CO003, CO006, CO007, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO002, TO003]
  - id: milestones-and-open-questions
    title: Milestones, strategic expansion, and unresolved diligence asks
    body: >-
      The retained milestone trail shows a business that has expanded in layers rather than
      through one abrupt pivot. By October 2022, Alloy had raised a Series D, launched
      Keyway TCR Discovery, expanded into genetic medicines, and added research sites in
      Basel, Athens, and San Francisco. In 2026, third-party update streams then show a run
      of platform and branding milestones beyond financing, including an AbbVie antibody
      platform partnership, a Biogen AntiClastic license, a new Vigilance Division, and
      World Economic Forum Unicorns Community selection. That arc supports the thesis that
      Alloy is broadening from discovery tooling into an integrated infrastructure layer, but
      the same public pool still leaves material diligence gaps around economic quality,
      exact organizational scale, board control, and whether any legal or regulatory issues
      sit outside the surfaced source set.
    claimRefs: [CO006, CO007, CO008, CO009, CO012, CO013, CO014]
    figureRefs: [FO001]
