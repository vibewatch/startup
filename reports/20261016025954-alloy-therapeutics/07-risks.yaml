    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Full-stack execution stretch across discovery, development, AI/data, and manufacturing-adjacent expansion
        - Unmeasured
        - High
        - Developing
        - High
        - No public unit-economics or delivery-quality dashboard in the retained pool
      - - Partner-data or security-control failure in the federated AI/data environment
        - Unmeasured
        - High
        - Developing
        - Medium-High
        - No third-party attestations, incident log, or control testing surfaced
      - - Talent and management bottlenecks as Alloy scales new functions and geographies
        - Unmeasured
        - Medium-High
        - Developing
        - Medium
        - Hiring signals exist, but capacity sufficiency is not quantified publicly
      - - Biosecurity or supply-chain disruption affecting customer trust or delivery
        - Unmeasured
        - Medium-High
        - Emerging
        - Medium
        - Vigilance initiative exists, but operating proof and KPIs are not public
    notes: >-
      Mitigation maturity is based on public signals such as hiring and initiative
      launches, not on disclosed operational KPIs or third-party audit evidence.
    claimRefs: [CR003, CR004, CR007, CR008, CR009, CR010, CR011, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty type
      - Role in Alloy model
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Partner origination and retention
        - Biopharma, biotech, and platform partners
        - Feeds discovery work, licensing activity, and downstream services
        - The reported partner count does not establish revenue diversification; concentration is undisclosed
        - New partner flow slows or repeat spend disappoints before the expanded cost base is absorbed
        - High
        - More than 200 partners and modality breadth
        - Medium-High
      - - 82VS joint-venture counterparties
        - Target-rich biotech partners and spinout vehicles
        - Supply targets, asset opportunities, and shared-governance structures
        - Economic and ownership concentration not disclosed publicly
        - Asset economics or governance rights favor counterparties over Alloy equity holders
        - High
        - Structured venture-creation playbook and Alloy discovery support
        - High
      - - Capital-provider support for the next scale phase
        - Existing and future investors
        - Funds platform buildout, expansion, and optionality
        - Fresh Series E helps, but operating leverage remains unproven publicly
        - Additional capital is needed before margins and cash generation are demonstrated
        - High
        - $40M Series E at $1B valuation with multiple named investors
        - Medium-High
    notes: >-
      Concentration and resilience are constrained by missing revenue-mix, renewal,
      and JV-economics disclosures; nulls should not be read as de minimis risk.
    claimRefs: [CR001, CR002, CR005, CR006, CR011, CR012, CR014, CR016]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Six material risks remain execution-heavy, with mitigation signals present but
      no public incident-frequency evidence from which to estimate likelihood.
    data:
      columns:
        - label: Likelihood
          note: Current public evidence plus disclosed expansion path
        - label: Impact
          note: Effect on underwriting, partner trust, and downside protection
        - label: Mitigation maturity
          note: Publicly visible controls, hiring, and operating proof
        - label: Residual exposure
          note: Exposure remaining after currently visible mitigations
      rows:
        - label: Full-stack execution stretch
          note: Expansion now spans discovery, development, AI/data, and venture creation
          values:
            - label: Unmeasured
              tone: warning
              note: Multiple new surfaces are scaling at once, but the sources do not quantify failure frequency
            - label: High
              tone: high
              note: Delivery misses would pressure both growth and valuation support
            - label: Developing
              tone: medium
              note: Public hiring and expansion plans exist, but KPI proof is thin
            - label: High
              tone: high
              note: Public economics and quality dashboards are still missing
        - label: Data governance and partner trust
          note: AI/data claims raise the bar for privacy, security, and segregation controls
          values:
            - label: Unmeasured
              tone: warning
              note: The company says data is federated and protected, but control effectiveness is not independently measured
            - label: High
              tone: high
              note: A control failure would threaten customer trust and regulated work
            - label: Developing
              tone: medium
              note: Security hiring and vigilance are visible, external attestations are not
            - label: Medium-High
              tone: high
              note: Certification and incident evidence is still absent from the pool
        - label: JV and license governance leakage
          note: 82VS and platform deals can move value through contract terms rather than revenue alone
          values:
            - label: Unmeasured
              tone: warning
              note: The model is active, but term detail and failure frequency are not public
            - label: High
              tone: high
              note: Hidden economics or rights could impair equity upside
            - label: Early
              tone: warning
              note: Mitigation is conceptual until template terms are reviewed
            - label: High
              tone: high
              note: Public sources do not resolve ownership and termination rights
        - label: Quality-system proof gap
          note: Scope expansion outruns the public proof set on GxP, QMS, and regulated-work controls
          values:
            - label: Unmeasured
              tone: warning
              note: The business is expanding into more regulated surfaces, but event frequency is not disclosed
            - label: High
              tone: high
              note: A quality failure could interrupt partner programs directly
            - label: Early
              tone: warning
              note: Public proof is limited to strategy and hiring signals
            - label: Medium-High
              tone: high
              note: No audit history or certification scope is retained here
        - label: Concentration opacity
          note: Partner count is disclosed, but revenue, margin, and program concentration are not
          values:
            - label: Unmeasured
              tone: warning
              note: The partner count does not reveal economic concentration or loss frequency
            - label: High
              tone: high
              note: Hidden concentration can magnify downside in a capital-intensive build
            - label: Limited
              tone: warning
              note: Public mitigation evidence is mostly financing rather than disclosure
            - label: High
              tone: high
              note: The residual underwriting gap stays large until management discloses economics
        - label: Valuation support versus disclosed economics
          note: A unicorn mark now sits ahead of public proof on margins and cash generation
          values:
            - label: Unmeasured
              tone: warning
              note: Fresh capital does not establish runway or the probability of a financing reset
            - label: High
              tone: high
              note: Any later financing reset would affect return expectations directly
            - label: Limited
              tone: warning
              note: No public margin, burn, runway, or concentration detail is retained
            - label: High
              tone: high
              note: The underwriting gap remains large until management discloses economics
    approximationNotes: >-
      This matrix is a qualitative synthesis of sourced disclosures and public gaps;
      it does not imply a quantified probability distribution.
    claimRefs: [CR001, CR004, CR008, CR009, CR010, CR012, CR013, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Top underwriting risk
    body: >-
      The decisive risk is not demand generation; it is whether Alloy can govern and
      monetize a much broader PDO-style stack before public evidence shows durable
      margins, compliant controls, and shareholder-friendly venture economics.
    claimRefs: [CR001, CR003, CR012, CR013, CR014, CR015]
  - calloutType: insight
    title: Mitigation is visible but still formative
    body: >-
      Vigilance, security hiring, partner breadth, and fresh capital all help, but
      the public record still looks like capacity-building rather than a closed proof
      set on controls, economics, and downside protection.
    claimRefs: [CR002, CR008, CR009, CR012, CR013, CR016]
