    - type: missing-source
      severity: material
      topic: unit-economics-gap
      missingEvidence: Audited 2025-2026 revenue, gross margin, burn, runway, and contribution margin by service line and venture activity.
      whyItMatters: The $1 billion valuation and broader infrastructure build cannot be underwritten without knowing whether the stack is self-funding or cash consumptive.
      diligencePath: Request audited financials, board materials, and service-line economics tying booked revenue, gross margin, cash burn, and backlog together.
      relatedQuestionRefs: [QR001]
    - type: missing-source
      severity: material
      topic: control-proof-gap
      missingEvidence: Third-party security, privacy, and quality attestations plus incident history for the AI/data and development stack.
      whyItMatters: Alloy is asking partners to trust sensitive data and regulated workflows, so control failures could impair both revenue quality and legal exposure.
      diligencePath: Obtain SOC 2 or ISO evidence, DPA language, pen-test summaries, quality-system scope, and a log of material incidents or deviations.
      relatedQuestionRefs: [QR003, QR004, QR006]
      relatedTableRefs: [TR001, TR002]
    - type: missing-source
      severity: material
      topic: governance-proof-gap
      missingEvidence: Standard and live 82VS or license agreement terms covering economics, ownership, board rights, termination, and change-of-control.
      whyItMatters: Venture structures can move value through contractual design rather than operating results, which changes downside protection and upside capture.
      diligencePath: Review template JV and license agreements plus live examples tied to the Maze and Pyxis-style arrangements discussed publicly.
      relatedQuestionRefs: [QR005, QR007]
      relatedTableRefs: [TR001, TR003]
    - type: missing-source
      severity: material
      topic: concentration-and-quality
      missingEvidence: Partner concentration, renewal cohorts, top-program revenue share, on-time delivery, and quality-event metrics.
      whyItMatters: Diversification cannot be judged from partner counts alone if a small number of programs or facilities still drive most economics or execution risk.
