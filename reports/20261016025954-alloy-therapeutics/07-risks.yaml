schemaVersion: report-v2
artifact: risks
slug: alloy-therapeutics
runDate: 2026-10-16
company:
  name: Alloy Therapeutics
chapter:
  number: 7
  title: Risks
  summary: >-
    Alloy's dominant risk is execution stretch: the company is trying to scale from
    antibody-platform roots into a broader AI-enabled product development
    infrastructure model while public disclosures still omit core unit-economics,
    certification, and venture-governance evidence. Mitigation signals exist in the
    form of a broad reported partner count, a new vigilance function, and active
    hiring, but residual exposure remains high until management proves that the
    expanded stack can be governed and monetized with repeatable controls.
sections:
  - id: severity-ranked-risk-frame
    title: Severity-ranked risk frame
    body: >-
      The underwriting question is not whether Alloy has demand signals; the retained
      2026 evidence shows a real platform with more than 200 partners, more than 100
      licensed therapeutic programs, and a fresh $40 million Series E at a $1 billion
      valuation. The risk is whether that breadth can be converted into durable,
      governed economics while Alloy expands simultaneously across discovery,
      downstream development, AI/data infrastructure, and venture creation. Public
      evidence supports platform momentum, but it still does not disclose revenue,
      margins, burn, runway, or concentration metrics, so the valuation already asks
      investors to trust operating leverage that has not been evidenced in this pool.
    claimRefs: [CR001, CR002, CR003, CR012, CR015, CR016]
  - id: regulatory-legal-and-governance
    title: Regulatory, legal, and governance exposure
    body: >-
      The most material regulatory-style exposure in the assigned evidence is not a
      disclosed lawsuit or enforcement action, but the gap between Alloy's expanding
      scope and the public proof behind its controls. Management says the platform
      federates and protects partner data, and the company has added a Vigilance
      Division focused on biosecurity and supply-chain resilience, which are positive
      signals that these issues are on management's map. Even so, the retained
      sources do not surface third-party security or quality certifications, and they
      do not resolve ownership, economics, or downside protections inside 82VS-style
      joint ventures and platform licenses. That leaves legal, privacy, IP, and
      governance diligence as a live pre-investment requirement rather than a cleared
      item.
    claimRefs: [CR004, CR007, CR008, CR013, CR014]
    tableRefs: [TR001]
  - id: operational-and-partner-execution
    title: Operational and partner-execution exposure
    body: >-
      Operationally, Alloy is no longer a narrow discovery-tools story. The retained
      2026 evidence shows expansion into preclinical and clinical development,
      manufacturing-adjacent capabilities, cross-border centers of excellence, and a
      venture-studio model in which Alloy helps launch asset-centric companies for
      target-rich biotechs. That creates a real execution surface: partner delivery,
      quality management, hiring, security, and shared governance all need to scale
      together. Active openings for an Information Security Lead, a recruiting head,
      and an 82VS Venture Partner suggest Alloy is still building capacity around
      several of the functions that the broader model now depends on.
    claimRefs: [CR003, CR005, CR006, CR009, CR010, CR011, CR015, CR016]
    tableRefs: [TR002, TR003]
    figureRefs: [FR001]
  - id: financial-kill-criteria-and-diligence
    title: Financial kill criteria and diligence
    body: >-
      Financially, the April 2026 round adds capital but does not establish runway or
      eliminate model risk. The company is spending against discovery,
      downstream development, AI/data, global infrastructure, and venture creation
      while public disclosures still omit the metrics that would show whether that
      stack is self-funding or cash consumptive. A thesis-break result would be any
      diligence package that shows weak contribution margins, dependence on a small
      number of partners or programs, or governance terms that shift value from Alloy
      shareholders into partner-controlled ventures. Until management provides those
      proofs, the risk register should be treated as partially mitigated rather than
      closed.
    claimRefs: [CR001, CR003, CR010, CR012, CR013, CR014]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk
      - Jurisdiction / scope
      - Current evidence status
      - Likelihood
      - Severity
      - Mitigation evidence
      - Residual exposure
      - Diligence path
    rows:
      - - Partner-data governance, privacy, and AI control failure
        - Cross-border partner and program data
        - Public materials claim federated/protected data, but no third-party certifications are disclosed in the retained pool
        - Unmeasured
        - High
        - Platform-level data-protection claim plus active security-function buildout
        - Medium-High
        - Request SOC 2 / ISO 27001 evidence, DPA terms, incident history, and data-segregation architecture
      - - Quality-system or regulated-development noncompliance during stack expansion
        - Discovery through preclinical, clinical, and manufacturing-adjacent work across multiple geographies
        - Retained sources show scope expansion and global centers, but not GxP/QMS proof
        - Unmeasured
        - High
        - Existing drug-discovery operating base and explicit vigilance investment
        - Medium-High
        - Review QA leadership, audit history, GxP scope, facility approvals, and deviation / CAPA reporting
      - - JV, license, and IP-governance leakage in 82VS-style structures
        - 82VS venture studio, partner licenses, and asset-centric vehicles
        - Public sources explain the operating model but not ownership splits, royalties, termination rights, or change-of-control protections
        - Unmeasured
        - High
        - Repeatable company-creation playbook and modality expertise
        - Medium
        - Review standard JV and license templates, IP assignment rules, board rights, and downside protections
    notes: >-
      Severity-ranked register built from public disclosures only; absence of a
      surfaced lawsuit or enforcement record in this assigned pool is not legal
      clearance.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly retained 2026 evidence in the assigned worker pool, focused on
        control surfaces material to an AI-enabled biotech infrastructure model.
    claimRefs: [CR004, CR005, CR007, CR008, CR010, CR013, CR014]
