        title: Traction proxies and cost structure
        blocks:
          - type: paragraph
            body: >-
              Public traction signals are breadth metrics, not financial outputs. The April 2026 financing announcement
              says Alloy had more than 200 partners, more than 100 licensed therapeutic programs, and 22 programs in
              clinical development, versus over 130 partners cited in the October 2022 Series D announcement. PatSnap's
              October 2026 pipeline view still shows visible disclosed assets concentrated in discovery and preclinical
              stages, which suggests downstream value creation remains early and does not substitute for revenue
              disclosure. A September 2026 third-party company feed also lists a multi-target Biogen license and a
              multi-year AbbVie platform agreement, but provides no deal values. These operating and commercial proxies
              show breadth while leaving margins, utilization, sales efficiency, and conversion of partner activity into
              recognized revenue undisclosed.
