      - number: '1.3'
        title: Milestones, strategic expansion, and unresolved diligence asks
        blocks:
          - type: paragraph
            body: >-
              The retained milestone trail shows a business that has expanded in layers rather than through one abrupt
              pivot. By October 2022, Alloy had raised a Series D, launched Keyway TCR Discovery, expanded into genetic
              medicines, and added research sites in Basel, Athens, and San Francisco. In 2026, third-party update
              streams then show a run of platform and branding milestones beyond financing, including an AbbVie antibody
              platform partnership, a Biogen AntiClastic license, a new Vigilance Division, and World Economic Forum
              Unicorns Community selection. That arc supports the thesis that Alloy is broadening from discovery tooling
              into an integrated infrastructure layer, but the same public pool still leaves material diligence gaps
              around economic quality, exact organizational scale, board control, and whether any legal or regulatory
              issues sit outside the surfaced source set.
