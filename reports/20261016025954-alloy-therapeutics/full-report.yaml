  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what Alloy is actually selling
        blocks:
          - type: paragraph
            body: >-
              Alloy's public positioning defines the market boundary before any sizing exercise. The company and
              third-party summaries consistently describe a bundle that spans platform licensing, discovery services,
              integrated AI and data tooling, and at least some downstream preclinical and clinical support rather than
              a single reagent or software point solution. That means the relevant spend pool includes
              discovery-platform access, outsourced modality-specific discovery work, and selected development
              infrastructure, while excluding later-stage commercialization, manufacturing at scale, and fully disclosed
              therapeutic-product economics. Status-quo substitutes therefore include in-house pharma platform builds,
              fragmented CRO and CDMO outsourcing, and narrower modality-specific discovery vendors rather than only
              other antibody-tool companies.
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM008
              - CM013
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM008
              - CM013
              - CM014
      - number: '2.2'
        title: Buyer segments, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The visible buyer mix is broader than a conventional biotech-tools niche. TBPN Digest described Alloy as
              working with both large pharma and small virtual biotechs, while Hoodline pointed to named 2026 platform
              deals with Biogen and AbbVie. Alloy's own 2022 materials also said 82VS companies are often the first
              customers of new capabilities, which suggests an additional venture-creation and scientist-entrepreneur
              channel alongside external pharma and biotech demand. Public sources rarely name the exact budget owner,
              so the safest reading is that Alloy sells into discovery and development budgets whose users are modality
              scientists, translational teams, and lean company builders seeking to avoid recreating infrastructure
              internally.
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM014
      - number: '2.3'
        title: Evidence-constrained sizing, growth drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports an adoption-proxy sizing lens rather than a clean dollar TAM, SAM, or SOM.
              Alloy's disclosed and reported markers moved from more than 130 partners in 2022 to more than 200
              partners, over 100 licensed therapeutic programs, and 22 clinical-stage programs in 2026, while TBPN
              Digest reported a footprint spanning 17 time zones and Pulse2 added that two programs had reached Phase 3.
              Those indicators suggest meaningful reach across drug-discovery workflows, but they are not
              interchangeable with spend or recurring revenue. The main adoption drivers in the public record are pharma
              demand for external innovation, the rising importance of AI-plus-wet-lab workflows, and the appeal of
              subscription or service access over rebuilding capabilities internally. The main constraints are that
              wet-lab execution remains the physical bottleneck, public pricing is undisclosed, and the company has not
              published a segmented market-size framework that would let an outside reader convert partner and program
              counts into a defendable spend-based market estimate.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM007
              - CM011
              - CM012
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Infrastructure spend, not a narrow tool budget
            body: >-
              The strongest boundary signal is that Alloy is packaging platform access, discovery execution, and
              downstream support together, which lets it tap multiple workflow budgets that a point-solution vendor
              could not reach.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM008
          - type: callout
            title: Public market sizing still rests on proxies
            body: >-
              Partner counts, program counts, and global reach show that Alloy has non-trivial adoption, but public
              evidence still does not expose actual pricing, customer concentration, or a spend-based TAM/SAM/SOM that
              would let an outside investor model the market with precision.
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set is a collection of operating models
        blocks:
          - type: paragraph
            body: >-
              Alloy is not presented as a single-purpose discovery vendor. Its own releases describe technology access,
              scientific services, company creation, and support across antibodies, bispecifics, TCRs, genetic
              medicines, cell therapies, and drug delivery. That scope makes the practical competitive set wider than
              one named peer group. A buyer can license a specialist platform, hire an integrated research or
              development provider, assemble several point vendors, or build the capability internally. The latter is an
              explicit substitute in Alloy's pitch: its financing release argues that partners can avoid owning
              infrastructure and hiring expertise needed only intermittently. The reviewed record therefore supports a
              landscape of solution archetypes, but not a ranked list of named competitors with comparable scale,
              funding, or outcomes.
            claimRefs:
              - CP005
              - CP007
              - CP011
              - CP012
              - CP014
