      - number: '3.2'
        title: Breadth and workflow integration are the central differentiation thesis
        blocks:
          - type: paragraph
            body: >-
              The strongest public differentiation signal is the range of disclosed modules. Alloy describes ATX-Gx
              antibody discovery, additional antibody and TCR platforms, subscription access to pre-competitive
              technology, downstream pharmacology, preclinical and clinical development services, biologics
              manufacturing, and an AI/data layer connected to wet-lab execution. The 2025 acquisition of Spannerwerks
              added development and launch consulting, while third-party summaries report a Biogen license for the
              AntiClastic antisense platform. This evidence supports a widening strategic direction rather than proof
              that every module is best in class. It also leaves integration quality, comparative speed, and output
              quality unbenchmarked, so buyers should evaluate the handoffs between modules rather than accept "full
              stack" as an outcome metric.
