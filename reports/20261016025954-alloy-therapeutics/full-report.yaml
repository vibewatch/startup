      - number: '1.2'
        title: Leadership, founders, capital base, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Founder visibility is concentrated around Errik Anderson, who appears as founder and chief executive in
              both the 2022 Series D and 2026 Series E financing announcements and in third-party profiles. Tracxn
              separately attributes Alloy's founding to Jed Dean and Zach Serber, which suggests the public founder
              record is broader than the outward CEO narrative but still incomplete from a governance perspective.
              Capital formation is much clearer than operating economics: Tracxn reports $157 million raised across
              Series C, D, and E, while company disclosures confirm the 2022 $42 million Series D and the 2026 $40
              million Series E at a $1 billion valuation. Repeat investor names across 8VC, Mubadala Capital, Founders
              Fund, Presight Capital, and Thiel Capital indicate a stable financing syndicate, but public materials in
              this pool do not disclose board seats, ownership percentages, liquidation preferences, or debt facilities.
            claimRefs:
