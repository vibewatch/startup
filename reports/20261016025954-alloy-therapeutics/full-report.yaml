      - number: '3.3'
        title: Commercial access is flexible in form but opaque in price
        blocks:
          - type: paragraph
            body: >-
              Public materials show several routes into Alloy's ecosystem. The AbbVie agreement is a multi-year
              platform-development arrangement with an upfront payment and another payment linked to platform delivery.
              A company profile describes licensing, discovery and optimization services, and subscription-based access,
              while another profile emphasizes affordable, non-exclusive access for academia, smaller biotech, and large
              biopharma. Alloy also says its ATX-Gx platform is used by more than 200 partners and describes a
              distributed footprint across the United States, Japan, the Middle East, and other markets. These signals
              imply broad distribution and partner access, but none of the reviewed pages provides a list price,
              normalized unit, standard commitment, or discount schedule. Price competitiveness and realized total cost
              therefore remain diligence questions.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP007
              - CP009
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP013
              - CP014
      - number: '3.4'
        title: Convenience is visible; lock-in is not
        blocks:
          - type: paragraph
            body: >-
              Alloy's breadth could create workflow-level convenience: a partner may move from discovery into
              development while using related data, labs, services, and scientific relationships. Its disclosed
              partnership count and geographic expansion also suggest distribution reach that a narrow specialist may
              not match. Yet the same breadth creates execution exposure across many scientific and service categories,
              and public disclosures do not quantify multi-product attachment, renewal, win-loss rates, migration costs,
              or partner multi-homing. The moat case is therefore plausible but unproven. Specialists can compete on
              depth, integrated service providers can compete on execution breadth, and sufficiently capitalized
              biopharma can retain sensitive workflows internally. Without independent benchmarks and customer switching
              evidence, Alloy's disclosed advantage is a broad procurement proposition rather than demonstrated durable
              lock-in.
            claimRefs:
              - CP003
              - CP009
              - CP012
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Alloy can sell a broader operating model
            body: >-
              The disclosed offer reaches from discovery technology into downstream services, data integration, and
              company creation, giving lean teams an alternative to assembling and owning every capability.
            calloutType: strength
            claimRefs:
              - CP004
              - CP005
              - CP014
          - type: callout
            title: Public evidence does not yet prove lock-in
            body: >-
              Breadth may improve convenience, but the reviewed record lacks independent win-loss, renewal,
              multi-product attachment, and switching-cost data.
            calloutType: risk
            claimRefs:
              - CP012
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Public materials describe Alloy as a hybrid biotech-infrastructure model rather than a single product
              company. The clearest disclosed pricing term is the Innovation Subscription described in the October 2022
              Series D announcement: a flat annual fee for access to current and future Alloy platforms with no
              milestones or royalties. That official framing is directionally consistent with third-party profiles that
              describe the revenue model as contracted services plus technology licensing. Alloy's current target-rich
              joint-venture pitch adds a third economic surface: partners bring targets, while Alloy provides discovery
              services and company-creation support through 82VS. That mix implies multiple possible revenue streams,
              but the public record still does not quantify stream mix, realized pricing, or take rates.
            claimRefs:
