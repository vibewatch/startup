      - number: '6.2'
        title: Adoption proof is broad, but depth metrics remain sparse
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is not a disclosed customer count, but a cluster of activity metrics: more
              than 200 partners, more than 100 licensed programs, 22 clinical-stage programs, and exposure to 18 of the
              top 50 biopharmaceutical companies. Those signals support real commercial usage and suggest Alloy is more
              than a logo wall or early research tool. Even so, they are breadth metrics rather than durability metrics.
              None of the retained sources quantify how many partner relationships are currently revenue producing, how
              many expand beyond initial discovery work, or what share of the installed base contributes most of the
              economics.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU014
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
