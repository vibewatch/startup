  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Alloy sells in the customer workflow
        blocks:
          - type: paragraph
            body: |-
              The reviewed sources consistently describe Alloy as a platform company that sells
              shared drug-discovery and development infrastructure to external innovators, not
              a classic pipeline biotech that advances its own lead assets. In customer-workflow
              terms, Alloy is offering access to foundational discovery tools, scientific teams,
              integrated development services, and company-creation support so biotechs can buy
              capabilities they would otherwise have to assemble internally. That model matters
              because it changes the underwriting question: the product is the breadth and
              repeatability of the platform stack, not a single binary clinical readout.
              Public materials also show that the offering has broadened materially since the
              company's antibody-discovery roots into downstream development work and adjacent
              modalities.
            claimRefs:
