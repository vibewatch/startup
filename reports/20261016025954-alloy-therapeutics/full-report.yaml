chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and business model
        blocks:
          - type: paragraph
            body: >-
              Alloy Therapeutics was founded in 2017 and now describes itself as a product development organization
              spanning discovery, preclinical development, and clinical development, powered by proprietary AI,
              real-world data, and tech-enabled services across multiple modalities. By April 2026, the company was
              explicitly framing itself as a "full-stack biotech infrastructure company" and saying it had collaborated
              with more than 200 partners across antibodies, bispecifics, genetic medicines, and cell therapies, with
              over 100 licensed therapeutic programs and 22 programs advanced to clinical development. Tracxn also
              reports 159 employees as of September 30, 2026, although the retained company-issued sources do not
              corroborate that figure. Public location signals are less clean: the April 2026 company release is
              datelined Boston, Seedlist lists Boston, and Tracxn lists Lexington, so the most defensible near-term read
              is a greater-Boston headquarters footprint rather than a single precisely verified municipality. The same
              evidence set supports platform breadth, but not precise revenue, ARR, burn, runway, or exact customer
              count.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
