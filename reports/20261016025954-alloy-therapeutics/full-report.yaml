            title: Hybrid model is visible; economic mix is not
            body: >-
              Alloy's public materials support a real mix of subscription access, project services, and venture-studio
              support, but they stop short of disclosing what portion of revenue each line contributes or which lines
              carry the best margin profile.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI014
          - type: callout
            title: Capital adequacy is still a management-only question
            body: >-
              The company has recent financing and clear growth ambitions, yet retained public sources do not disclose
              cash, burn, runway, or realized revenue, so investors cannot test whether the current balance sheet is
              enough to fund Alloy's broader service and infrastructure expansion.
            calloutType: risk
            claimRefs:
