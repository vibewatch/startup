              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Named customer proof exists, but production status is only partially visible
        blocks:
          - type: paragraph
            body: >-
              Alloy does have named external proof beyond generic category claims. The retained independent update feed
              cites a multi-year AbbVie agreement, a Biogen license agreement around the AntiClastic platform, and a
              completed Mediar collaboration with a claimed six-month timeline improvement. That is useful because it
              shows real counterparties and at least some commercial surface in 2026. The limitation is that public
              summaries still do not distinguish clearly between pilot, discovery-stage, platform-license, and scaled
              production relationships for most named accounts, nor do they disclose contract value, expansion cadence,
              or renewal outcomes.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Expansion logic is visible; retention and concentration are still open
        blocks:
          - type: paragraph
            body: >-
              Public materials imply a reasonable expansion loop: customers can enter through antibody or AI-enabled
              discovery, add downstream development services, and in some cases extend into 82VS-backed company creation
              or broader modality work such as RNA and cell therapy. That suggests a land-and-expand thesis across
              modalities and lifecycle stages, not just one-off discovery projects. The unresolved issue is whether that
              commercial design actually produces durable economics. The retained pool did not surface published NRR,
              GRR, renewal rates, cohort behavior, or top-customer exposure, so customer concentration and repeat-spend
              durability remain material diligence gaps rather than verified strengths.
            claimRefs:
              - CU009
              - CU010
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is better evidenced than depth
            body: >-
              The public record supports broad adoption across partner count, program count, and named counterparties,
              but it does not yet show renewal or concentration metrics that would prove durable customer economics.
            calloutType: insight
            claimRefs:
              - CU003
              - CU005
              - CU014
              - CU015
          - type: callout
            title: Retention and concentration remain material diligence gaps
            body: >-
              Alloy's public customer evidence does not quantify NRR, GRR, churn, contract length, or top-customer
              dependence, limiting confidence in the repeatability of revenue beyond the visible partnership footprint.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk frame
        blocks:
          - type: paragraph
            body: >-
              The underwriting question is not whether Alloy has demand signals; the retained 2026 evidence shows a real
              platform with more than 200 partners, more than 100 licensed therapeutic programs, and a fresh $40 million
              Series E at a $1 billion valuation. The risk is whether that breadth can be converted into durable,
              governed economics while Alloy expands simultaneously across discovery, downstream development, AI/data
              infrastructure, and venture creation. Public evidence supports platform momentum, but it still does not
              disclose revenue, margins, burn, runway, or concentration metrics, so the valuation already asks investors
              to trust operating leverage that has not been evidenced in this pool.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR012
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              The most material regulatory-style exposure in the assigned evidence is not a disclosed lawsuit or
              enforcement action, but the gap between Alloy's expanding scope and the public proof behind its controls.
              Management says the platform federates and protects partner data, and the company has added a Vigilance
              Division focused on biosecurity and supply-chain resilience, which are positive signals that these issues
              are on management's map. Even so, the retained sources do not surface third-party security or quality
              certifications, and they do not resolve ownership, economics, or downside protections inside 82VS-style
              joint ventures and platform licenses. That leaves legal, privacy, IP, and governance diligence as a live
              pre-investment requirement rather than a cleared item.
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR008
              - CR010
              - CR013
              - CR014
      - number: '7.3'
        title: Operational and partner-execution exposure
        blocks:
          - type: paragraph
            body: >-
              Operationally, Alloy is no longer a narrow discovery-tools story. The retained 2026 evidence shows
              expansion into preclinical and clinical development, manufacturing-adjacent capabilities, cross-border
              centers of excellence, and a venture-studio model in which Alloy helps launch asset-centric companies for
              target-rich biotechs. That creates a real execution surface: partner delivery, quality management, hiring,
              security, and shared governance all need to scale together. Active openings for an Information Security
              Lead, a recruiting head, and an 82VS Venture Partner suggest Alloy is still building capacity around
              several of the functions that the broader model now depends on.
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR011
              - CR012
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Financial kill criteria and diligence
        blocks:
          - type: paragraph
            body: >-
              Financially, the April 2026 round adds capital but does not establish runway or eliminate model risk. The
              company is spending against discovery, downstream development, AI/data, global infrastructure, and venture
              creation while public disclosures still omit the metrics that would show whether that stack is
              self-funding or cash consumptive. A thesis-break result would be any diligence package that shows weak
              contribution margins, dependence on a small number of partners or programs, or governance terms that shift
              value from Alloy shareholders into partner-controlled ventures. Until management provides those proofs,
              the risk register should be treated as partially mitigated rather than closed.
            claimRefs:
              - CR001
              - CR003
              - CR010
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Top underwriting risk
            body: >-
              The decisive risk is not demand generation; it is whether Alloy can govern and monetize a much broader
              PDO-style stack before public evidence shows durable margins, compliant controls, and shareholder-friendly
              venture economics.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR012
              - CR013
              - CR014
              - CR015
          - type: callout
            title: Mitigation is visible but still formative
            body: >-
              Vigilance, security hiring, partner breadth, and fresh capital all help, but the public record still looks
              like capacity-building rather than a closed proof set on controls, economics, and downside protection.
            calloutType: insight
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR012
              - CR013
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, not a rejection of Alloy's strategic relevance. The financing signal
              is clear: a $40 million Series E was announced at a $1 billion valuation, and the company reports
              substantial partner and program activity. The price case is not clear. Retained public sources do not
              disclose revenue, margins, cash burn, runway, customer concentration, or preference terms, so they cannot
              support a revenue multiple, a target return, or a defensible hold-period outcome. Entry discipline should
              therefore focus on verified unit economics, cap-table rights, and downside protection rather than treating
              the unicorn mark as intrinsic value. The current evidence implies high underwriting risk and a stretched
              valuation stance.
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: Financing context and valuation basis
        blocks:
          - type: paragraph
            body: >-
              Tracxn reports $157 million of total funding across three rounds, including a $42 million Series D at a
              $375 million post-money valuation in 2022 and the $40 million Series E at $1 billion in 2026. On those
              reported marks, valuation rose about 2.7 times while the latest primary capital equaled roughly 4% of the
              announced post-money value. Neither calculation establishes value creation: funding raised is not cash
              available, and the sources do not disclose intervening revenue growth, profitability, burn, secondary
              sales, dilution, liquidation preferences, or debt. The round therefore demonstrates investor willingness
              to fund the platform, but not the economic support for the price or the proceeds remaining at the analysis
              date.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: Thesis, anti-thesis, and scenarios
        blocks:
          - type: paragraph
            body: >-
              The thesis is that a broad discovery-and-development infrastructure layer can monetize across many partner
              programs rather than depend on one internal drug asset. Alloy says it has worked with more than 200
              partners, produced more than 100 licensed therapeutic programs, and advanced 22 to clinical development,
              including two in Phase 3. The anti-thesis is that these are activity and pipeline counts, not disclosed
              revenue, retention, margin, or cash-generation measures. Tracxn's large and heterogeneous competitor set
              also does not provide a clean valuation benchmark. Consequently, the bull, base, and bear cases must be
              expressed as evidence-contingent directions rather than unsupported point estimates or probability
              percentages.
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Public evidence is insufficient to underwrite an IPO, strategic sale, or secondary-liquidity path. Before
              investing at or near the reported mark, diligence should reconcile audited revenue by business line, gross
              margin, bookings, repeat spend, customer concentration, program conversion, committed cash use, and
              runway. It should also obtain the fully diluted cap table, option pool, liquidation preferences,
              participation rights, anti-dilution terms, debt, and any secondary component of the Series E. Thesis-break
              triggers include weak renewal or repeat-spend evidence, failure of clinical programs to progress, a
              material down round, or economics that require continued capital without corresponding gross profit.
              Positive evidence on those items, not another headline funding event alone, would justify revisiting the
              valuation stance.
            claimRefs:
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the unresolved variable
            body: >-
              Alloy's reported scale can justify continued diligence, but the $1 billion mark should not be accepted
              without audited economics, complete financing terms, and a matched comparable set.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV016
