      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The recent funding signal is clear even if the full capital history is not. Multiple sources agree Alloy
              raised $40 million at a $1 billion valuation in 2026, and the stated use of proceeds has expanded from
              modality-building in 2022 toward downstream preclinical and clinical services plus AI and data
              infrastructure in 2026. That change implies a broader capital envelope, but public datasets still disagree
              on total historical capital raised and omit the operating metrics needed to assess adequacy. Because
              retained sources do not disclose revenue, gross margin, burn, cash, runway, customer concentration, or
              backlog conversion, the chapter's financial verdict remains a gating diligence request rather than a
              completed underwriting view.
            claimRefs:
              - CI004
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
              - CI016
