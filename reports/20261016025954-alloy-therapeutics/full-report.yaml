  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer surface spans the full biologics R&D stack
        blocks:
          - type: paragraph
            body: >-
              Alloy's public positioning is unusually broad for a biotech-infrastructure company. Company-issued
              profiles describe a non-exclusive model serving academic scientists, small and medium biotech, and large
              biopharma rather than a single narrow buyer cohort. That matters for diligence because the likely payer
              varies by entry point: platform licenses and discovery campaigns may start with translational teams or
              venture-backed biotech, while later-stage development work and strategic platform agreements appear more
              relevant to larger pharma budgets. The segment story is therefore credible at the top of funnel, but the
              public record still does not show which segment contributes the highest recurring revenue or the best
              renewal behavior.
