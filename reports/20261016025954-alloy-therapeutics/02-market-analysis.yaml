chapter:
  number: 2
  title: Market Analysis
  summary: Alloy is publicly positioned less as a single-product biotech and more as a cross-workflow infrastructure vendor selling platform access, discovery services, and downstream development support into pharma, virtual biotech, and affiliated venture creation. Public evidence supports adoption proxies such as partner count, licensed programs, clinical progression, and global operating reach, but it still does not isolate a dollar TAM, SAM, SOM, or realized pricing curve for those workflows.
sections:
  - id: market-boundary
    title: Market boundary and what Alloy is actually selling
    body: Alloy's public positioning defines the market boundary before any sizing exercise. The company and third-party summaries consistently describe a bundle that spans platform licensing, discovery services, integrated AI and data tooling, and at least some downstream preclinical and clinical support rather than a single reagent or software point solution. That means the relevant spend pool includes discovery-platform access, outsourced modality-specific discovery work, and selected development infrastructure, while excluding later-stage commercialization, manufacturing at scale, and fully disclosed therapeutic-product economics. Status-quo substitutes therefore include in-house pharma platform builds, fragmented CRO and CDMO outsourcing, and narrower modality-specific discovery vendors rather than only other antibody-tool companies.
    claimRefs: [CM001, CM005, CM006, CM008, CM013, CM016]
    tableRefs: [TM001]
  - id: buyers-and-budget-path
    title: Buyer segments, users, and adoption path
    body: The visible buyer mix is broader than a conventional biotech-tools niche. TBPN Digest described Alloy as working with both large pharma and small virtual biotechs, while Hoodline pointed to named 2026 platform deals with Biogen and AbbVie. Alloy's own 2022 materials also said 82VS companies are often the first customers of new capabilities, which suggests an additional venture-creation and scientist-entrepreneur channel alongside external pharma and biotech demand. Public sources rarely name the exact budget owner, so the safest reading is that Alloy sells into discovery and development budgets whose users are modality scientists, translational teams, and lean company builders seeking to avoid recreating infrastructure internally.
    claimRefs: [CM005, CM009, CM010, CM014]
    tableRefs: [TM003]
  - id: sizing-drivers-and-constraints
    title: Evidence-constrained sizing, growth drivers, and constraints
    body: Public evidence supports an adoption-proxy sizing lens rather than a clean dollar TAM, SAM, or SOM. Alloy's disclosed and reported markers moved from more than 130 partners in 2022 to more than 200 partners, over 100 licensed therapeutic programs, and 22 clinical-stage programs in 2026, while TBPN Digest reported a footprint spanning 17 time zones and Pulse2 added that two programs had reached Phase 3. Those indicators suggest meaningful reach across drug-discovery workflows, but they are not interchangeable with spend or recurring revenue. The main adoption drivers in the public record are pharma demand for external innovation, the rising importance of AI-plus-wet-lab workflows, and the appeal of subscription or service access over rebuilding capabilities internally. The main constraints are that wet-lab execution remains the physical bottleneck, public pricing is undisclosed, and the company has not published a segmented market-size framework that would let an outside reader convert partner and program counts into a defendable spend-based market estimate.
    claimRefs: [CM002, CM003, CM004, CM007, CM011, CM012, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
