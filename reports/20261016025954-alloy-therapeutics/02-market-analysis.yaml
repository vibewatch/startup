callouts:
  - calloutType: insight
    title: Infrastructure spend, not a narrow tool budget
    body: The strongest boundary signal is that Alloy is packaging platform access, discovery execution, and downstream support together, which lets it tap multiple workflow budgets that a point-solution vendor could not reach.
    claimRefs: [CM001, CM005, CM006, CM008]
  - calloutType: risk
    title: Public market sizing still rests on proxies
    body: Partner counts, program counts, and global reach show that Alloy has non-trivial adoption, but public evidence still does not expose actual pricing, customer concentration, or a spend-based TAM/SAM/SOM that would let an outside investor model the market with precision.
    claimRefs: [CM002, CM003, CM015]
