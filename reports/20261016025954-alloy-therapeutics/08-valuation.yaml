callouts:
  - calloutType: recommendation
    title: Price is the unresolved variable
    body: >-
      Alloy's reported scale can justify continued diligence, but the $1 billion
      mark should not be accepted without audited economics, complete financing
      terms, and a matched comparable set.
    claimRefs: [CV005, CV006, CV011, CV012, CV016]
