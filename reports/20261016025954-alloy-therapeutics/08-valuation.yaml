  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence now, What would change the view]
    rows:
      - [Thesis, "Company-reported scale exceeds 200 partners and 100 licensed programs.", "Audited revenue, repeat-spend, and margin evidence tying activity to durable economics."]
      - [Thesis, "Twenty-two programs are reported in clinical development, including two in Phase 3.", "Independent program-level validation and evidence that milestones or services convert into cash economics."]
      - [Anti-thesis, "The retained sources disclose the round and valuation but no revenue multiple or cash-flow basis.", "Audited financial statements and a reconciliation from operating performance to the $1 billion mark."]
      - [Anti-thesis, "The identified competitor set mixes software, therapeutics, and research-service businesses.", "A transaction set matched on business mix, growth, margins, and revenue quality."]
    notes: "Partner and program counts originate with Alloy and are repeated by third parties; they are not treated as independently audited economics."
    claimRefs: [CV005, CV006, CV008, CV009, CV010, CV011, CV014]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation and return logic, Key risk, Probability signal]
    rows:
      - [Bull, "Audited growth, repeat spend, margins, and clinical conversion validate a scalable infrastructure model.", "Value above the current mark is supportable only if verified economics imply an attractive risk-adjusted return.", "Company-reported activity fails to translate into durable gross profit.", "Not quantifiable from public evidence; requires the strongest diligence outcome."]
      - [Base, "Strategic traction is real but operating economics and cap-table terms remain unverified.", "Do not anchor to $1 billion; negotiate price and protections after completing financial and legal diligence.", "Further capital needs dilute common ownership before liquidity.", "Current public evidence most closely supports this conditional case."]
      - [Bear, "Repeat spend, margins, conversion, or financing terms prove weaker than the headline scale suggests.", "Value falls below the current mark and may require a down round or investor-protective recapitalization.", "Cash needs persist while commercialization proof remains incomplete.", "Triggered by failed KPI validation, stalled programs, or adverse financing terms."]
    notes: "Scenarios are directional because public sources do not provide the inputs needed for numerical valuation ranges or probability weights."
    claimRefs: [CV002, CV003, CV006, CV009, CV012, CV013, CV014]
