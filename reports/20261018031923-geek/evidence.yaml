evidenceGaps:
  - type: missing-source
    severity: material
    topic: funding-history
    missingEvidence: >-
      IPO prospectus or financing ledger showing cumulative capital raised, named pre-IPO investors, any secondaries,
      and current concentration.
    whyItMatters: >-
      Public-company status and live quote pages do not by themselves reveal how much outside capital Geek+ raised
      before listing or who still controls the equity.
    diligencePath: >-
      Pull the July 2025 HKEX prospectus, latest substantial-shareholder filings, and any pre-IPO financing
      announcements to complete the cap-table history.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: disclosure-drift
    missingEvidence: >-
      A reconciled company explanation for why 2025 year-end and March 2026 official surfaces cite different robot-count
      and repurchase-rate figures.
    whyItMatters: >-
      Later chapters will reuse scale and retention metrics, so unresolved disclosure drift can create avoidable
      cross-chapter inconsistency.
    diligencePath: >-
      Ask investor relations for the as-of dates and denominators behind the 72,000-versus-66,000 robot counts and
      78%-versus-80% repurchase figures.
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 founder leadership coverage
    missingEvidence: >-
      A fuller public roster below the founder-executive core, including current CFO-level ownership, regional operating
      heads, and succession depth.
    whyItMatters: >-
      The founder table is intentionally partial, so diligence still needs to test whether execution depth extends
      beyond the four named founders and founder-linked executives.
    diligencePath: >-
      Pull the full senior-management section, latest earnings-call introductions, and org-chart materials to extend
      founder-team coverage.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: adverse-screen
    missingEvidence: >-
      Direct regulator, court, or incident records confirming whether there were material legal, cybersecurity, or
      outage events in the period.
    whyItMatters: >-
      The assigned pool surfaces market caution and disclosure drift, but it does not prove the absence of legal or
      operational adverse events.
    diligencePath: >-
      Run a dedicated regulator, litigation, and incident check in the risks chapter or with a refreshed
      adverse-evidence pool.
  - type: access-blocked
    severity: material
    topic: sizing
    missingEvidence: >-
      Accessible underlying figures for the warehouse-automation market-size, warehouse-robotics revenue and adoption
      series listed on the retained Statista topic page.
    whyItMatters: >-
      Without the figures, the chapter can describe the available sizing lenses but cannot responsibly publish a precise
      TAM, SAM or SOM for Geek+.
    diligencePath: >-
      Obtain the underlying Statista datasets or substitute an open analyst/regulator source that publishes the figures
      in full.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-budget-owner
    missingEvidence: Named public budget owners, payer structures and ROI/payback thresholds for Geek+ deployments by segment.
    whyItMatters: >-
      Budget ownership and approval thresholds govern adoption timing and willingness to scale, which affects the
      realism of any SAM or sales-cycle assumption.
    diligencePath: >-
      Review customer procurement materials, case studies with commercial details, or public RFP / capex disclosures
      from named operators.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: served-market-cutoff
    missingEvidence: >-
      A public source that cleanly isolates the served market for AMR-led warehouse-fulfillment workflows by geography
      and vertical.
    whyItMatters: >-
      A cleaner served-market cutoff would improve valuation work by distinguishing policy-positive category growth from
      the narrower workflows Geek+ can realistically sell into.
    diligencePath: >-
      Find open analyst, trade-association or public-company disclosures that break out AMR, goods-to-person or
      warehouse-robotics subsegments explicitly.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Comparable current price books, realized discounts, minimum contract values, and system-sale versus RaaS mix for
      Geek+, Symbotic, Exotec, and Locus Robotics.
    whyItMatters: >-
      Without normalized commercial terms, the chapter can compare packaging logic but cannot prove which vendor is
      cheapest or most profitable on a like-for-like deployment.
    diligencePath: >-
      Request recent customer proposals or contracts from management and interview at least two integrators or customers
      on realized pricing and discount norms.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer-level migration history, multi-homing behavior, and replacement rates across warehouse-automation
      vendors.
    whyItMatters: >-
      Switching-cost evidence would show whether Geek+'s installed base is sticky or whether modular competitors can
      displace it once a site wants additional workflows.
    diligencePath: >-
      Ask management for replacement-case studies and request customer references that evaluated at least one
      alternative vendor before expansion.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized ASP by deployment type, contract duration, discounting policy, and milestone billing terms.
    whyItMatters: >-
      List-style product descriptions do not tell an investor whether growth is coming from healthy pricing,
      discount-led expansion, or one-off project timing.
    diligencePath: Request cohort pricing waterfalls and representative customer contracts split by direct and channel-led deals.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      CAC, sales payback, channel margin share, implementation labor hours, and realized customer ROI by deployment
      type.
    whyItMatters: >-
      Without buyer payback and seller acquisition efficiency, revenue growth cannot be converted into defensible unit
      economics.
    diligencePath: >-
      Request board or operating-review materials that show CAC, payback, expansion revenue, and deployment-level
      post-go-live economics.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: margin-bridge
    missingEvidence: >-
      Gross margin by product and services, spare-parts and warranty burden, working-capital swings, capex intensity,
      and recurring-versus-project revenue mix.
    whyItMatters: >-
      Public top-line growth and cash balances do not establish whether Geek+ can turn scale into durable free cash
      flow.
    diligencePath: >-
      Request audited segment disclosures or management bridge schedules from orders to revenue, gross profit, EBITDA,
      cash flow, and ending cash.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Public security, privacy, certification, or uptime documentation for the software and deployment stack.
    whyItMatters: >-
      Enterprise warehouse buyers need evidence that robotics orchestration, site integration, and support processes
      meet internal control requirements.
    diligencePath: >-
      Request security or trust-center materials, certifications, status or uptime reporting, and customer-facing
      implementation-control documentation.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: A public developer or practitioner proxy showing ecosystem adoption, API maturity, or community support.
    whyItMatters: >-
      Product-technology diligence is thin when there is no public evidence on integration tooling, developer adoption,
      or operator community feedback.
    diligencePath: >-
      Gather public API or developer docs, GitHub or package-registry activity, partner engineering posts, or
      practitioner-community references.
  - type: private-evidence-only
    severity: minor
    topic: realized-performance
    missingEvidence: Independent module-level throughput, uptime, service, or ROI evidence by deployment type.
    whyItMatters: >-
      Marketing-surface efficiency claims do not show whether performance is durable across retrofits, geographies, and
      mixed-SKU environments.
    diligencePath: Ask for customer references, SLA metrics, pre/post deployment baselines, and cohort data split by solution family.
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Current NRR, GRR, logo churn, gross churn, renewal rate, and average contract term for FY2025-FY2026.
    whyItMatters: >-
      Without direct retention metrics, installed-base breadth cannot be converted into a durable recurring-revenue
      judgment.
    diligencePath: >-
      Request board materials or post-IPO KPI packs that show renewals, churn, and cohort behavior by major geography
      and product line.
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer and top-five-customer revenue share for FY2025-FY2026, plus any channel-partner concentration.
    whyItMatters: >-
      Large logo breadth can still mask concentration if a few multinational buyers or integrators drive outsized
      revenue.
    diligencePath: Obtain the annual report customer-concentration note, management discussion, and channel-sales breakdown.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU001
  - type: private-evidence-only
    severity: material
    topic: named-customer-outcomes
    missingEvidence: >-
      Fresh independent case studies with deployment dates, site counts, throughput uplift, labor savings, or ROI for
      Nike, Wal-Mart, Toyota, Siemens, Tmall, and Vipshop.
    whyItMatters: >-
      Named references prove less than current production outcomes, and they do not establish repeatability across
      regions or sectors.
    diligencePath: >-
      Ask management for customer-reference calls and implementation case studies that separate pilot, production, and
      expanded multi-site deployments.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-and-compliance-unknowns
    missingEvidence: Direct court, regulator, privacy, safety, product-liability, and export-control records for Geek+.
    whyItMatters: >-
      Without primary legal and compliance checks, the chapter cannot distinguish a clean record from a merely
      unobserved one.
    diligencePath: >-
      Run direct docket and regulator searches in the U.S., China, and key overseas markets, and request trust/security
      disclosures from management.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: service-and-security-proof
    missingEvidence: Uptime, SLA, incident-history, certification, and escalation metrics by region, partner, and product family.
    whyItMatters: >-
      The investment thesis relies on AMRs operating as production infrastructure, but the assigned pool does not prove
      how resilient the service and security layer is.
    diligencePath: >-
      Request customer references, support dashboards, security certifications, and any incident postmortems tied to
      installed systems.
    relatedQuestionRefs:
      - QR003
      - QR007
    relatedTableRefs:
      - TR002
      - TR003
  - type: missing-source
    severity: material
    topic: concentration-and-revenue-mix
    missingEvidence: Customer concentration, overseas revenue concentration, and RaaS versus system-sale mix for FY2025-FY2026.
    whyItMatters: >-
      Those details determine whether growth is diversified and whether tariff or project delays would hit a narrow
      slice of customers or economics.
    diligencePath: >-
      Request current top-customer shares, regional revenue mix, and revenue-model disclosures from filings or
      management materials.
    relatedQuestionRefs:
      - QR005
      - QR006
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: cap-table-overhang
    missingEvidence: >-
      Current shareholder register, any preferred or debt-like claims senior to common, insider lockup expiries, and
      expected secondary-sale plans.
    whyItMatters: >-
      These terms determine whether today's public-market quote offers real upside to minority investors or hides
      structural dilution and liquidity pressure.
    diligencePath: >-
      Request the latest cap table, lockup schedule, debt covenant summary, and any board-approved secondary or
      employee-liquidity plan.
    relatedQuestionRefs:
      - QV007
  - type: private-evidence-only
    severity: material
    topic: recurring-revenue-quality
    missingEvidence: Current RaaS-versus-system-sale mix, NRR/GRR, cohort payback, and regional customer concentration for 2026.
    whyItMatters: >-
      A stronger recurring-revenue and retention profile would justify a higher-quality valuation frame, while weak mix
      quality would make the stock de-rate further.
    diligencePath: >-
      Request a revenue bridge by business model and region, cohort retention tables, and updated top-customer
      concentration data before underwriting upside.
