              - CV016
          - type: callout
            title: 主要下行风险是估值支撑，而非产品是否存在
            body: 股价接近 52 周低点、内在价值筛选显示高估，以及仓储机器人竞争加剧，意味着即便是一家好公司，若执行或披露出现滑坡，也可能不是好的入场标的。
            calloutType: risk
