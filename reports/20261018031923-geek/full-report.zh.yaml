          displayValue: Workflow-specific subset
          note: Geek+ 聚焦货架到人、箱到人、托盘到人、分拣和运输工作流，而不是所有仓储科技类别。
        - label: 中国机器人部署基础
          displayValue: 54% of annual industrial robot installs; ~2M stock
          note: IFR 数据支持中国拥有深厚的本土机器人生态，但不能直接推导 Geek+ 的 TAM。
        - label: 跨行业企业仓库
          displayValue: Retail, e-commerce, 3PL, manufacturing, grocery, pharma
          note: 公开证据将这些细分场景列为最明确的部署环境。
        - label: Geek+ 的适配条件
          displayValue: Phased retrofit and orchestration value
          note: 最适合的场景是买方需要灵活自动化、又不必重建整个设施，同时软件集成也很重要。
    approximationNotes: 这座金字塔展示的是逐步收窄的市场范围，而不是数值市场份额。指定的可访问来源池无法恢复精确的 TAM/SAM/SOM 数值。
    claimRefs:
      - CM002
      - CM006
      - CM007
      - CM008
      - CM012
      - CM013
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 有证据支持的序数定位显示，Geek+ 最擅长把广度与灵活性结合，而既有厂商和专业厂商各自守住不同的细分优势。
    data:
      xAxis:
        label: 部署灵活性／改造难度
        min: 1
        max: 5
        low: 更重的固定式集成
        high: 模块化分阶段部署
        description: Evidence-backed ordinal placement from retained public sources
        scale: ordinal
      yAxis:
        label: 广度／吞吐量适配度
        min: 1
        max: 5
        low: 更窄的工作流范围
        high: 更广的全设施适配
        description: Evidence-backed ordinal placement from retained public sources
        scale: ordinal
      points:
        - label: Geek+
          x: 4
          'y': 4
          tone: positive
          note: 产品套件广泛且软件统一，采用模块化 AMR 定位，并拥有全球标杆项目规模。
          claimRefs:
            - CP001
            - CP002
            - CP005
        - label: Symbotic
          x: 2
          'y': 5
          tone: neutral
          note: 保留的证据更强调以吞吐量为导向的项目成果、制造扩张和规模，而不是分阶段改造的简易性。
          claimRefs:
            - CP008
            - CP009
            - CP010
        - label: Exotec
          x: 5
          'y': 4
          tone: positive
          note: Decathlon 案例支持高密度存储，并能在不拆除现有基础设施的情况下分阶段部署。
          claimRefs:
            - CP011
            - CP012
        - label: Locus Robotics
          x: 5
          'y': 2
          tone: warning
          note: 固定月费方案提供了灵活的切入点，但保留证据对全套方案范围的支持较窄。
          claimRefs:
            - CP013
            - CP015
        - label: 既有集成商
          x: 2
          'y': 5
          tone: risk
          note: 在重视正常运行时间的多年期项目中，服务网络和 OEM 关系仍是持久优势。
          claimRefs:
            - CP007
            - CP014
        - label: 内部自建／Amazon 基准
          x: 1
          'y': 4
          tone: adverse
          note: 这一路径可以高度贴合大型运营商，但保留证据将其定义为依赖规模的基准，而不是买方的常见默认选择。
          claimRefs:
            - CP006
            - CP014
    approximationNotes: 1-5 的序数坐标概括了保留公开证据中的部署模式和范围；它们不是有来源的市场份额或 ROI 测量值。
    claimRefs:
      - CP006
      - CP007
      - CP008
      - CP012
      - CP013
      - CP015
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据显示，公司采用硬件、软件与服务捆绑的模式，先把仓储需求转化为项目收入，再转化为重复扩张的业务经济性。
    data:
      nodes:
        - id: demand
          label: 仓储需求
          value: Labor shortages, rising costs, and e-commerce complexity
        - id: solution
          label: 捆绑方案销售
          value: Shelf, tote, pallet, and sorting systems with software
        - id: deploy
          label: 部署收入
          value: 1H2026 revenue RMB 1.284B
        - id: support
          label: 实施与支持
          value: Local teams, partners, and integrators
        - id: expand
          label: 扩张／复购
          value: 74.6% repurchase rate signal and >50% Americas order growth
        - id: outcome
          label: 利润率与现金结果
          value: TTM margin still -4.05%; runway still underdisclosed
      edges:
        - from: demand
          to: solution
          label: 商业需求
        - from: solution
          to: deploy
          label: 签约项目
        - from: deploy
          to: support
          label: 交付与服务
        - from: support
          to: expand
          label: 客户成功
        - from: expand
          to: outcome
          label: 队列回本后推动毛利
    approximationNotes: 流程逻辑公开且有证据支持，但指定来源池没有披露确切的收入确认时点和经常性收入组合。
    claimRefs:
      - CI003
      - CI008
      - CI009
      - CI010
      - CI013
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Geek+ 将客户工作流、机器人系列、编排软件、集成和部署服务叠加成模块化仓储自动化技术栈。
    data:
      layers:
        - label: 客户工作流
          detail: 这套方案瞄准拣选、存储、转运、分拣和托盘处理等仓储任务。
          modules:
            - label: 订单拣选
            - label: 密集存储取货
            - label: 跨区域转运
            - label: 分拣
            - label: 托盘处理
        - label: 方案系列
          detail: 公开描述的产品系列覆盖主要仓储自动化使用场景。
          modules:
            - label: 货架到人 / PopPick
            - label: 箱到人 / RoboShuttle
            - label: 托盘到人 / Skycube
            - label: 内部物流模块
        - label: 机器人硬件
          detail: 官方页面还营销面向具体任务的移动、分拣、叉车和拣选硬件。
          modules:
            - label: 分拣机器人
            - label: 移动机器人
            - label: 叉车机器人
            - label: 机械臂拣选工作站／Geek+ Brain
        - label: 控制平面
          detail: 目前得到主要验证的软件主张，是跨机器人系列的统一编排以及与仓储系统的集成。
          modules:
            - label: 多机器人编排
            - label: 任务分配与路由
            - label: 仓库管理系统集成
        - label: 企业集成边界
          detail: 实际部署取决于中间件、设施准备情况以及与旧系统的兼容性。
          modules:
            - label: WMS 接口
            - label: ERP 或订单数据交接
            - label: 布局、电力和网络准备
        - label: 部署与服务模式
          detail: 部署可以从较小范围启动，借助合作伙伴支持，并在客户运营稳定后扩展。
          modules:
            - label: 1-3 个月实施主张
            - label: RaaS／租赁／外包选项
            - label: 本地团队与合作伙伴支持
    claimRefs:
      - CE002
      - CE006
      - CE008
      - CE009
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Geek+ 似乎从痛点驱动的评估走向跨站点扩张，但续约证据仍弱于部署证据。
    data:
      items:
        - label: 需求触发
          actor: 仓储 COO／站点运营负责人
          tone: risk
          touchpoints:
            - 劳动力短缺、成本压力和电商业务量仍在推动自动化需求。
            - 即使速度和准确度提升，较高的前期成本仍是采购决策的一部分。
        - label: 技术评估
          actor: 运营、IT 与集成商团队
          tone: neutral
          touchpoints:
            - 货到人、箱到人和托盘工作流分别适用于零售、3PL、制造和杂货零售环境。
        - label: 初始部署
          actor: 站点运营与仓储工程团队
          tone: positive
          touchpoints:
            - Tmall Supermarket 和 Vipshop 有明确的生产环境案例证明。
        - label: 运营验证
          actor: 企业转型办公室
          tone: positive
          touchpoints:
            - 早期部署被描述为把 AMR 从试点工具升级为核心基础设施。
        - label: 区域推广
          actor: 本地团队与服务合作伙伴
          tone: positive
          touchpoints:
            - Geekplus 表示，部署已覆盖 40 多个国家，并配有区域服务和项目基础设施。
        - label: 扩张／服务循环
          actor: 采购与客户成功团队
          tone: risk
          touchpoints:
            - 订阅服务订单增长超过 90%，但已披露的 NRR、GRR、流失率和头部客户集中度数据仍然缺失。
    approximationNotes: 这条旅程由已披露的采用信号和渠道／服务评论综合而成，并不是经过测量的客户队列路径。
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU008
      - CU009
      - CU011
      - CU012
