      - number: '8.2'
        title: 情景框架与估值支撑
        blocks:
          - type: paragraph
            body: >-
              乐观情景依赖商业动能持续累积，最终形成更清晰的收入质量故事。Geek+ 称 2025 年订单达到 RMB 4.137 billion，美洲订单同比增长超过 50%，2026
              年战略将强调具身智能商业化和面向仓储的人形机器人部署。如果投资者开始把当前报价视为低谷而不是故事破产，这些信号就足以支持上行判断。基准情景没有那么慷慨：市场数据服务确认该股已在公开市场交易，但对正确的估值框架并不一致——Yahoo
              显示销售倍数为 4.60x，Morningstar 显示为 2.09x，而 ValueInvesting
              认为股价高估。悲观情景因此很直接：若增长放缓、倍数继续压缩，或经常性收入和客户质量无法得到验证，业务可以保持良好，但股票仍然缺乏吸引力。
            claimRefs:
              - CV004
