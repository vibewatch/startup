  - id: TV002
    title: 正反论点表
    columns:
      - 论点
      - 证据
      - 哪些变化会改变判断
    rows:
      - - 正面论点
        - 2025 年收入增长 31.6% 至 RMB 3.171 billion，经调整净利润转正。
        - 如果 2026 年持续把利润兑现，且经常性收入披露更清晰，公司可能从跟踪对象升级为选择性买入标的。
      - - 正面论点
        - 中国大陆以外收入达到 75.3%，美洲订单增长超过 50%，说明国际需求确实存在。
        - 如果有独立证据证明美国市场势头能转化为可重复、具备高利润率的部署，上行逻辑会更扎实。
      - - 反面论点
        - 股价收于 HK$6.08，在 52 周高点 HK$33.50 之后仅比 52 周低点高 2.27%。
        - 更低的入场价格或市场表现企稳，都能降低股价内含的估值下修风险。
      - - 反面论点
        - 美国仓储机器人市场竞争加剧，公开证据仍缺少股权结构、锁定期、NRR/GRR 和 RaaS 业务组合细节。
        - 完整的治理与收入质量披露，可以消除因披露缺口而不得不假设存在隐性下行空间的必要。
    notes: 这张表把有来源支持的利好与明确的价格敏感条件放在一起，而不是把业务质量单独当作买入信号。
    claimRefs:
