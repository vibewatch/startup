  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 经营证据支持继续跟踪，但公开估值信号分化且披露缺口尚未解决，因此不能给出买入判断。
    data:
      nodes:
        - id: operating-proof
          label: 2025 年经营证明
          summary: Revenue, profit, and operating cash flow all improved materially in 2025.
          claimRefs:
            - CV001
            - CV002
            - CV003
        - id: scale-and-demand
          label: 国际规模与需求
          summary: Orders, overseas mix, and Americas momentum imply real market demand.
          claimRefs:
            - CV004
            - CV005
            - CV006
        - id: public-market-signal
          label: 公开市场重置
          summary: The stock trades at HK$6.08 and sits just above the 52-week low.
          claimRefs:
            - CV008
            - CV009
        - id: valuation-dispersion
          label: 估值分化
          summary: Third-party valuation views diverge sharply on fair value and trading multiples.
          claimRefs:
            - CV010
            - CV011
            - CV012
        - id: unresolved-disclosure
          label: 尚未解决的披露缺口
          summary: Cap-table, lockup, retention, and RaaS-mix evidence is still incomplete.
          claimRefs:
            - CV016
        - id: recommendation
          label: 建议＝跟踪
          summary: The business is credible, but entry terms need more support before a buy is justified.
          claimRefs:
            - CV001
            - CV008
            - CV011
            - CV016
      edges:
        - from: operating-proof
          to: scale-and-demand
          label: 证明扩展
        - from: scale-and-demand
          to: public-market-signal
          label: 与价格比较
        - from: public-market-signal
          to: valuation-dispersion
          label: 交叉核验
        - from: valuation-dispersion
          to: unresolved-disclosure
          label: 不确定性仍在
        - from: unresolved-disclosure
          to: recommendation
          label: 阻止买入
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
      - CV016
