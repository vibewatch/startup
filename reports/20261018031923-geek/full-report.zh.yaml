      - number: '3.3'
        title: Geek+ 有广度和规模，但差异化仍可能被压缩
        blocks:
          - type: paragraph
            body: >-
              Geek+ 保留的最强竞争资产是广度和参考规模。公司材料和新闻来源一贯描述其产品组合广、装机基数大；Yahoo Finance 和 Morningstar 也显示，Geek+
              在港交所上市后获得了公开市场关注。即便如此，同一证据基础也说明，护城河可能比“市场领导者”标题叙事更窄。传统集成商仍控制着服务密集型项目，因为这些项目最看重正常运行时间保障和 OEM 关系；Exotec
              证明专注型厂商可以靠简化部署取胜；Locus 式月费打包则降低了采用摩擦，却不必拥有全套产品的广度。Symbotic 的财务表以及 Mordor
              对工厂和枢纽扩张的讨论还表明，大型竞争对手有能力持续投入产能和区域支持。最后，Mordor 关于 WMS 集成超支的讨论暗示，转换成本确实存在但并不统一；这有助于传统厂商守住装机基础，也让任何一家 AMR
              厂商都更难独占整个品类。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP007
              - CP009
              - CP010
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: Geek+ 靠覆盖更多工作流进入候选名单，而不是消灭替代方案
            body: 对 Geek+ 最有力的保留证据是：它能以广泛的 AMR 套件、公开市场关注度和全球客户参考案例，成为多工作流仓库升级项目中合理的默认候选。
            calloutType: insight
            claimRefs:
              - CP001
