chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与经营模式
        blocks:
          - type: paragraph
            body: >-
              Geek+ 是 Beijing Geekplus Technology Co., Ltd. 的品牌。这家在中国注册的公司成立于 2015 年 2 月 3 日，并于 2025 年 7 月 9 日以股票代码 2590
              在香港联交所上市，采用加权投票权结构。经营足迹仍以北京为中心：中国大陆主要营业地址在顺义区，注册办事处位于雄安，香港办公室在湾仔。公开文件和公司材料显示，公司几乎完全依靠系统销售：2025 年收入的 99.9%
              来自机器人解决方案，尤其是仓储履约系统；租赁和服务收入仍微不足道。这一结构说明，Geek+ 更像一家用软件带动硬件部署的资本品与集成公司，而不是订阅软件公司。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: 创始人、管理层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              治理结构仍明显以创始人为中心。Zheng Yong 继续担任董事长兼 CEO，联合创始人 Li Hongbo、Liu Kai 和 Chen Xi
              分别负责从公司成立起就构成核心的技术、机器人和产业化职能。上市公司董事会由 4 名执行董事、4 名非执行董事和 4 名独立非执行董事组成，另有 3
              名监事；形式上更接近正规上市公司，但经营叙事仍主要依靠这支小型创始团队。非执行董事席位也让股东关联影响更清晰：已披露的董事关联关系将董事会席位与 Vertex 相关实体、Panmao/Yuanfeng、China
              Internet Investment Fund/Zhongwan 及 Warburg Pincus 关联公司联系起来。这些是有用的治理背景，但指定来源池没有提供当前受益所有权登记册或 IPO 后集中度分析。
            claimRefs:
              - CO011
              - CO012
              - CO013
