      - number: '1.4'
        title: 里程碑与警示信号
        blocks:
          - type: paragraph
            body: >-
              上市后的主线是产品持续加速。Geek+ 将箱式搬运产品线追溯至 2018 年，2024 年加入 RoboShuttle Air，2025 年加入机械臂拣选，随后借助 2026 年的活动通过 Geekplus
              Brain、Gino 1 和 RoboShuttle Hyper 推进具身智能叙事。这些里程碑让公司更容易进入后续产品和市场章节。但本章也暴露出后文不应抹平的警示：官方规模披露尚未完全同步。2026 年 3 月
              LogiMAT 新闻稿称机器人数量为 66,000 台以上、复购率超过 80%，而 2025 年年报称机器人数量超过 72,000 台、复购率约 78%。公开报价页面还显示，2026 年 10 月中旬股价接近
              52 周低点，说明公开市场预期仍然敏感。
            claimRefs:
              - CO010
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO015
              - CO016
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 上市转型已有财务证据
            body: Geek+ 已不只是讲述规模。截至 2025 年末，公司实现调整后盈利、经营现金流为正，现金余额也明显高于短期借款；相比许多仓储机器人同行进入公开市场时的状况，这是一块更扎实的基础。
            calloutType: strength
            claimRefs:
              - CO002
              - CO006
              - CO007
          - type: callout
            title: 规模和估值指标必须带日期，不能视为永恒不变
            body: 指定来源没有完全调和官方渠道与市场数据页面上的机器人数量、复购率和实时估值。这不否定业务本身，但意味着后续章节必须把每个规模或估值判断锚定到具体日期和来源类型。
            calloutType: risk
            claimRefs:
              - CO010
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与工作流匹配
        blocks:
          - type: paragraph
            body: >-
              保留来源支持的市场边界，比泛泛的仓储科技 TAM 叙事更窄。Geek+ 做的是灵活仓储履约和仓内物流自动化，围绕 AMR
              驱动的货到人、箱到人、托盘到人、分拣和运输流程展开；编排软件和企业系统集成也是产品的一部分，不是事后补丁。独立资料还将 Geek+
              与更重基础设施的自动化模式对比，这一点很关键：真正的替代方案包括人工拣选、传统固定系统和分阶段改造项目，而不是所有仓储软件。这个边界直接影响估值：买方需求取决于仓库是否面临足够的用工、密度、SKU
              复杂度和峰值波动压力，是否值得引入移动自动化并重做工作流，而不是抽象的机器人热情。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
              - CM012
              - CM013
      - number: '2.2'
        title: 市场规模视角与买方细分
        blocks:
          - type: paragraph
            body: >-
              公开规模证据是方向性的，而非完整的。可访问的 Statista
              主题页确认，分析师分别跟踪仓库数量、整体仓储自动化市场规模、仓储机器人收入和技术采用率，这有助于避免把机会压缩成一个宽泛的市场数字。但同一摘录将实际数字锁在登录墙后，因此本报告不能负责任地给出有来源支持的
              Geek+ TAM、SAM 或 SOM。当前最稳妥的判断是多视角的：中国仍是非常深的机器人部署基地，公开来源显示仓储需求横跨多个垂直领域，而 Geek+
              所处的位置正好满足买方对灵活自动化的需求，无需重建整个设施。买方和用户证据最集中于零售、电商、3PL、制造、商超和制药场景的仓储运营团队；具体预算负责人及按地域公布的截止规则仍是缺口。
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM013
      - number: '2.3'
        title: 驱动因素、约束与时点
        blocks:
          - type: paragraph
            body: >-
              采用时点看起来有利，但并非没有摩擦。需求端，中国的机器人政策支持、仓库的用工和吞吐压力，以及分阶段部署能力，都在支撑市场对 AMR
              自动化的持续兴趣。约束端，最有用的独立市场评论仍将关税、原材料通胀、资本开支敏感性和零部件成本压力列为项目排期的真实障碍。Interact Analysis 认为 2025
              年波动明显，尽管少数大客户仍维持强劲订单；其对 2026 年更乐观，恰恰因为需求预计会从少数超大买方扩展出去。这为 Geek+
              提供了可行的市场环境，但不能证明每个客户细分都会以同样速度采用，也不能证明当下政策顺风会顺利转化为近期 SAM 获取。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 可投资市场比标题 TAM 更窄
            body: 最强证据支持 Geek+ 聚焦于灵活的仓储自动化工作流：只有当用工、密度和吞吐压力足以支撑 AMR 编排时，这一市场才成立。指定来源池不足以把所有仓储科技支出都视为 Geek+ 的可服务市场。
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM013
          - type: callout
            title: 需求顺风不等于没有时点风险
            body: 中国的机器人政策推动和更广泛的仓储需求有利于行业，但关税、资本开支周期、零部件成本压力，以及不完整的公开买方预算证据，仍限制了本章把行业动能转化为近期 SAM 获取的把握。
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 相关替代方案包括传统巨头、点解决方案颠覆者和内部自建
        blocks:
          - type: paragraph
            body: >-
              Geek+ 并不是在一片空白市场中竞争；保留证据显示，竞争层次很丰富。Mordor Intelligence 将其描述为“中度集中”市场：前十大厂商约占全球收入的一半，Dematic、Daifuku 和
              Swisslog 等传统集成商依靠服务网络和 OEM 关系赢得对正常运行时间敏感的多年项目。同一市场图谱中，AutoStore、Exotec 和 Symbotic
              等颠覆者则通过缩短上线时间、围绕吞吐而非硬件收费，拿下小型化和改造项目。因此，买方实际选择远不止指定的 AMR 同行：潜在客户可以继续维持人工流程、购买专业模块、选择全套集成商，或者凭借类似 Amazon
              的规模和工程能力自建机器人能力。Geek+ 的官方和公司材料支持其关于产品组合广度的说法，但市场报告也明确指出，当竞争对手可以靠更快改造、立体仓储密度或本地服务深度发起攻击时，广度本身还不够。
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: 买方在广度、改造速度和商业灵活性之间取舍
        blocks:
          - type: paragraph
            body: >-
              保留来源反复指向三个决策标准。第一，广度很重要，因为运营商越来越希望一个平台覆盖货到人、箱到人、托盘处理和仓内物流流程；Geek+ 的官方 IPO 回顾和 Morningstar
              资料都支持其全套定位。第二，改造速度很重要，因为棕地运营商不想让场地停摆；Exotec 的 Decathlon 部署被描述为渐进式、模块化，而 Mordor 称 AutoStore、Exotec 和
              Symbotic 正凭借少于 8 周的上线周期赢得改造项目。第三，商业模式很重要，因为公开证据显示，产品打包本身就是竞争武器：Mordor 特别提到 Locus Robotics
              将硬件、软件和维护打包成固定月费，即使实际价格仍不透明，也给客户提供了较低资本开支的参照。因此，比较表和定位图更强调部署模式与设施匹配，而不是名义标价，因为保留的公开证据没有披露各厂商可比的价目表或折扣曲线。
            claimRefs:
              - CP001
              - CP005
              - CP008
              - CP011
              - CP012
              - CP013
              - CP015
