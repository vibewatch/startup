  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              经营特许权比简单的标题式估值下调更好：Geek+ 称 2025 年收入达到 RMB 3.171 billion，调整后净利润转正至 RMB 43.8 million，经营现金流转正至 RMB 85.7
              million，中国大陆以外收入占总销售额的 75.3%。这些组合足以避免对业务质量做出看空判断。问题在于价格支撑和披露质量，而不是公司是否拥有真实产品。公开市场证据分化：Yahoo 显示一年目标价为
              HK$21.92、过去 12 个月销售倍数为 4.60x；另一项内在价值筛选则给出 HK$1.87 的公允价值，并称股价为 HK$6.08 时高估
              69.2%。由于现有证据没有足够详细地披露股权结构表中的优先股堆叠、锁定期抛压或经常性收入质量，无法有把握地评估上行空间，因此纪律性建议是跟踪，而不是买入。
            claimRefs:
