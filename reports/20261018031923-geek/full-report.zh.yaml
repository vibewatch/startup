      - number: '8.3'
        title: 退出准备度、尽调要求与逻辑破坏因素
        blocks:
          - type: paragraph
            body: >-
              退出准备度在结构上好于 2025 年 7 月之前，因为 Geek+ 已在港交所上市；但有报价的证券不等于容易做投资判断。股价于 10 月 16 日收于 HK$6.08，仅比 HK$5.95 的 52 周低点高
              2.27%，说明尽管公司经营有所进展，市场仍在给执行、关税和商业化风险打折。最后最重要的尽调要求不是泛泛的客户访谈，而是明确索取当前股东登记册及任何优先权或锁定期抛压信息，并要求更新收入质量桥接表，展示 RaaS
              结构、NRR/GRR 和区域客户集中度。如果公开市场疲弱叠加订单走弱、具身 AI 部署延迟，或证据表明美国仓储机器人竞争正在限制公司把装机规模转化为持久经常性经济效益，投资逻辑就会失效。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
              - CV016
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 等价格或尽调改善后再行动
            body: Geek+ 已跨过重要经营门槛，但公开估值证据过于分散，缺失的股权表和经常性收入披露又过于重要，在当前证据水平下不足以支持买入判断。
            calloutType: recommendation
            claimRefs:
