      - number: '1.3'
        title: 规模、资本基础与公开市场基础
        blocks:
          - type: paragraph
            body: >-
              2025 年年报显示，公司在 IPO 前后都已达到可观规模：收入同比增长 31.6% 至 RMB3.17 billion，调整后净利润转正至 RMB43.8 million，现金及定期存款达到 RMB3.16
              billion。表面看资产负债表杠杆可控：年末 RMB357.9 million 银行借款全部在一年内到期，员工人数为 1,054。Geek+ 还将自己定位为全球部署的平台：截至 2025 年 12 月约有
              950 个终端客户，服务覆盖 40 多个国家，已发货机器人超过 72,000
              台。主要疑点在于资本历史不透明：当前报价页面提供实时公开估值参考，但指定证据没有披露累计融资总额、老股转让或当前股权集中度；可见的董事关联和上市股权状态除外。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO014
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO014
