      - CV002
      - CV005
      - CV006
      - CV009
      - CV014
      - CV016
  - id: TV003
    title: 乐观／基准／悲观情景表
    columns:
      - 情景
      - 假设
      - 估值／回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 2025 年订单增长延续到 2026 年，具身智能产品发布转化为可见的重复采购，新增披露证明经常性业务经济性强于市场担忧。
        - 如果投资者把 2026 年视为验证年，而不是估值下修周期，当前接近 52 周低点的报价可能向分析师目标价区间重估。
        - 执行延误、关税或疲弱的服务业务经济性，仍会限制上行空间。
        - 需要独立证据证明美国及海外市场势头能转化为持久的收入质量。
      - - 基准
        - 经营进展延续，但留存率、RaaS 组合和悬而未决因素的公开证据仍不完整。
        - 持有／跟踪；公司仍具可信度，但估值支撑分化，股票更适合观察而非追高。
        - 即使业务改善，市场仍可能继续压低这只股票的估值。
        - 这最符合当前公司数据向好、但第三方估值判断相互冲突的组合。
      - - 悲观
        - 增长放缓，具身智能产品商业化延迟，或客户在竞争更激烈的美国市场推迟扩张。
        - 进一步下跌并非不可能：股价已经疲弱，且一个内在价值筛选模型认为公允价值远低于市场报价。
        - 估值倍数压缩、治理意外或订单簿走弱，都可能把底部进一步压低。
        - 当前股价重置、高估筛选结果和不断上升的竞争压力，均支持这一情景。
    notes: 这些情景只体现方向，因为指定的公开证据披露不足，无法精确建模摊薄、优先股堆叠或经常性收入队列。
    claimRefs:
