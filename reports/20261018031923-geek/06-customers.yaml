schemaVersion: "report-v2"
artifact: "customers"
slug: "geek"
runDate: "2026-10-18"
company:
  name: "Geek+"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Geek+ shows real customer breadth: company and independent sources align on
    deployments across 40+ countries, roughly 950 customers, and strong 2025
    order growth led by the Americas. The weak point is durability proof:
    named deployments remain mostly issuer-led references, while current
    retention and concentration metrics are absent from the assigned evidence.
sections:
  - id: "customer-footprint"
    title: "Segment mix and customer footprint"
    body: >-
      The available evidence points to a broad enterprise buyer base rather
      than a narrow single-vertical franchise. Geek+ and third-party coverage
      both place the company in retail, 3PL, manufacturing, e-commerce,
      grocery, and pharma workflows, with operations spanning more than 40
      countries. The best scale signal is not a clean cohort disclosure but the
      combination of customer count, installed base, and multinational
      references: Robotics & Automation News cites about 950 customers and 80+
      Fortune Global 500 companies, while AGV Network names Nike, Wal-Mart,
      Toyota, and Siemens as users. That is enough to treat the customer base
      as globally diversified by use case and geography, but not enough to
      translate logos into current revenue mix or deployment depth.
    claimRefs: ["CU001", "CU002", "CU006", "CU007", "CU013", "CU015"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-momentum"
    title: "Adoption momentum and expansion signals"
    body: >-
      FY2025 demand indicators still look healthy. Baidu Baike's summary of the
      audited 2025 result states that new orders reached CNY 4.137 billion, up
      31.7% year on year, with nearly 80% of orders from outside mainland China
      and Americas orders up more than 50%. The same source says subscription
      service orders grew by more than 90%, which is the clearest expansion
      proxy in the assigned pool because it suggests post-deployment wallet
      growth rather than just first-time system wins. Geek+'s own IPO narrative
      and the Robotics & Automation News article reinforce that the go-to-market
      model depends on local teams, partners, and regional service
      infrastructure, which matters because demand appears to be outrunning
      purely direct deployment capacity in some markets.
    claimRefs: ["CU003", "CU004", "CU005", "CU009", "CU010", "CU011"]
    tableRefs: ["TU002"]
  - id: "named-proof-and-durability"
    title: "Named customer proof, durability, and concentration risk"
    body: >-
      The strongest named production proof in the assigned evidence is still
      narrow. Baidu attributes commercial deployments to Tmall Supermarket and
      Vipshop, and AGV Network names large global users, but most of that proof
      is either company-controlled or derived from supplier/profile pages rather
      than fresh independent case studies with site-level outcomes. The official
      blog argues that early deployments helped move AMRs from pilot tools to
      core infrastructure, and public-company status may help procurement trust,
      but that does not substitute for NRR, GRR, churn, contract-length, or
      top-customer disclosure. The assigned pool therefore supports a view of
      real adoption with incomplete durability evidence; the market's sharp
      post-IPO de-rating increases the burden of proof on repeatability rather
      than reducing it.
    claimRefs: ["CU007", "CU008", "CU009", "CU012", "CU014"]
    tableRefs: ["TU003"]
tables:
