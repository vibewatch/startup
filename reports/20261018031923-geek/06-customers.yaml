      - "Buyer / user / payer"
      - "Use-case proof"
      - "Scale / strategic value"
      - "Gap"
    rows:
      - ["Retail & grocery", "Retail HQ and DC operators; warehouse operations teams; enterprise automation budget owners", "Official and news sources place Geek+ in retail and grocery automation workflows", "Global installed base and 80+ Fortune Global 500 customers imply relevance to scaled enterprise operators", "No disclosed revenue split by retail vs grocery or named current reference sites in this pool"]
      - ["3PL & e-commerce", "3PL operators, fulfilment leaders, and high-throughput warehouse managers", "Geek+ sources repeatedly cite 3PL and e-commerce as core operating environments", "Americas growth and overseas order mix imply this remains a major expansion wedge", "No disclosed share of orders or recurring revenue from 3PL/e-commerce buyers"]
      - ["Manufacturing & pharma", "Factory logistics teams, internal material-flow users, and regulated warehouse operators", "Official IPO blog cites manufacturing and pharma among active countries/segments", "Helps diversify the customer base beyond retail-driven seasonality", "Assigned sources do not name current manufacturing or pharma customers"]
      - ["Large multinational enterprises", "Central procurement, supply-chain transformation, and regional site operators", "Robotics & Automation News cites 80+ Fortune Global 500 customers; AGV Network names Nike, Wal-Mart, Toyota, and Siemens", "Supports enterprise-grade credibility and cross-border deployment potential", "Named logos are not paired with current spend, site count, or renewal detail"]
    notes: "Segment mix is inferred from sector references in the assigned sources rather than disclosed revenue bands; null revenue mix is a disclosure gap, not a zero."
    claimRefs: ["CU001", "CU002", "CU006", "CU007", "CU012", "CU015"]
  - id: "TU002"
    title: "Customer growth / adoption trajectory table"
    columns:
      - "Metric"
      - "Value"
      - "Date"
      - "Source"
      - "Confidence"
      - "Implication"
      - "Missing denominator"
    rows:
      - ["Installed base", ">72,000 robots", "2025/2026", "Robotics & Automation News", "Medium", "Indicates production-scale footprint rather than isolated pilots", "No active-vs-idle, utilization, or cohort disclosure"]
      - ["Customer count", "~950 customers incl. 80+ Fortune Global 500", "2025/2026", "Robotics & Automation News", "Medium", "Supports broad enterprise reach across global buyers", "No definition of active vs cumulative customers"]
      - ["New orders", "CNY 4.137bn; +31.7% YoY", "FY2025", "Baidu Baike (citing audited 2025 result)", "Medium", "Demand remained strong after listing", "No split by segment, channel, or product family"]
      - ["Americas momentum", ">50% YoY order growth", "FY2025", "Baidu Baike + Robotics & Automation News", "High", "US-led growth is the clearest current expansion vector", "No base amount or customer count disclosed"]
      - ["Subscription service orders", ">90% YoY growth", "FY2025", "Baidu Baike", "Medium", "Best available wallet-expansion proxy after initial deployment", "No disclosed share of total revenue, ARR, or renewal rate"]
    notes: "Trajectory metrics mix cumulative installed-base facts with annual order-flow facts; they should not be read as one funnel or as direct retention metrics."
    claimRefs: ["CU002", "CU003", "CU004", "CU005", "CU006"]
  - id: "TU003"
    title: "Named customer proof table"
    columns:
      - "Customer"
      - "Segment"
      - "Deployment / use case"
      - "Production vs pilot"
      - "Outcome / proof"
      - "Limitation"
    rows:
      - ["Tmall Supermarket", "E-commerce / retail", "Geek Picking System in warehouse operations", "Production", "Baidu says the system has already been commercially deployed", "Current site count, deployment date, and ROI are not disclosed"]
      - ["Vipshop", "E-commerce", "Geek Picking System in warehouse operations", "Production", "Baidu says the system has already been commercially deployed", "No current utilization, contract duration, or expansion history disclosed"]
      - ["Nike", "Retail / apparel", "Named among users of Geek+ solutions", "Undisclosed stage", "AGV Network lists Nike among trusted industry leaders using Geek+ solutions", "Could be reference-logo evidence without current scope or outcome detail"]
      - ["Toyota", "Manufacturing / industrial", "Named among users of Geek+ solutions", "Undisclosed stage", "AGV Network lists Toyota among users", "No site, workflow, or economic outcome is disclosed in the assigned pool"]
    notes: "Rows are limited to named customer evidence visible in the assigned pool; production status is explicit only where the source literally says commercially deployed."
    enumerationScope:
      coverage: "partial"
      basis: "Named customer proof visible in the assigned customer worker pool as of the 2026-10-18 run; not a full customer roster."
    claimRefs: ["CU007", "CU008"]
figures:
  - id: "FU001"
    title: "Customer journey map"
    type: "journey-map"
    summary: "Geek+ appears to move from pain-driven evaluation into cross-site expansion, but renewal proof is still thinner than deployment proof."
    data:
      items:
        - label: "Need trigger"
          actor: "Warehouse COO / site operations lead"
          tone: "risk"
          touchpoints:
            - "Labor shortages, cost pressure, and e-commerce volume still drive automation demand."
            - "High upfront cost remains part of the buying equation even when speed and accuracy improve."
        - label: "Technical evaluation"
          actor: "Operations, IT, and integrator teams"
          tone: "neutral"
          touchpoints:
            - "Goods-to-person, tote-to-person, and pallet workflows map to retail, 3PL, manufacturing, and grocery environments."
        - label: "Initial deployment"
          actor: "Site operations and warehouse engineering"
          tone: "positive"
          touchpoints:
            - "Named production proof exists for Tmall Supermarket and Vipshop."
        - label: "Operational validation"
          actor: "Enterprise transformation office"
          tone: "positive"
          touchpoints:
            - "Early deployments are described as moving AMRs from pilot tools to core infrastructure."
        - label: "Regional rollout"
          actor: "Local teams and service partners"
          tone: "positive"
          touchpoints:
            - "Geekplus says deployments span more than 40 countries with regional service and project infrastructure."
        - label: "Expansion / service loop"
          actor: "Procurement and customer success"
          tone: "risk"
          touchpoints:
            - "Subscription service orders grew 90%+, but disclosed NRR, GRR, churn, and top-customer concentration remain missing."
    approximationNotes: "The journey is synthesized from disclosed adoption signals and channel/service commentary; it is not a measured cohort path."
    claimRefs: ["CU001", "CU004", "CU005", "CU008", "CU009", "CU011", "CU012"]
callouts:
  - calloutType: "insight"
    title: "Expansion signals are better than retention signals"
    body: "Installed-base scale, overseas mix, and subscription-service order growth are visible; renewal and concentration metrics are not."
    claimRefs: ["CU002", "CU004", "CU005"]
  - calloutType: "risk"
    title: "Named customer proof is still thin for a public-company diligence standard"
    body: "The pool shows real production examples, but most named references still lack site-level outcomes, renewal evidence, and current revenue weight."
    claimRefs: ["CU007", "CU008", "CU014"]
