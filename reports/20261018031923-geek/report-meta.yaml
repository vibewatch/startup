  topStrengths:
    - Public evidence shows meaningful scale, positive adjusted profitability, and a strong cash position after the IPO.
    - The product stack spans multiple warehouse workflows, which supports broad customer fit and cross-sell potential.
    - The installed base and multinational footprint suggest real enterprise demand rather than pilot-only traction.
  topRisks:
    - Retention, customer-concentration, and recurring-revenue quality remain underdisclosed.
    - Public-market valuation is sensitive and still trades near recent lows despite operating progress.
    - Competitive pressure and tariff / cross-border execution risk can compress margins if growth slows.
  unresolvedGaps:
    - No disclosed NRR / GRR or comparable retention metric in the assigned evidence pool.
    - Current top-customer concentration and current named deployment refreshes remain incomplete.
    - RaaS versus system-sale mix and service economics are still not fully visible to outsiders.
    - Current cap-table concentration, lockup overhang, and preference stack are not fully disclosed.
