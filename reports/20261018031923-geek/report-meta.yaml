companyProfile:
  summary: >-
    Geek+ is a Beijing-founded warehouse-automation company that went public on the Hong Kong Stock Exchange in July
    2025 and now operates as a broad AMR-led logistics platform. The business is still anchored in system sales,
    integration, and deployment work rather than a pure recurring software model, but its public evidence shows a large
    installed base, broad geographic reach, and continued product expansion into embodied-intelligence features.
