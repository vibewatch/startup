    rows:
      - ["Integrated warehouse systems", "Project-style deployments for shelf, tote, pallet, and sorting solutions", "site / deployment", "1H2026 revenue reported at RMB 1.284B; mix undisclosed", "Top line is visible but segment mix is not", "Request revenue by product family, geography, and customer cohort"]
      - ["Software / orchestration", "Unified software platform bundled with robot deployments and WMS integration", "site license / bundle", "Commercial role visible; standalone pricing not public", "Mechanism is corroborated, monetization is not", "Request standalone software ARR, attach rate, and renewal terms"]
      - ["Services / support", "Implementation, integration, local support, and partner-assisted rollout", "project + maintenance", "Needed operationally; public revenue contribution not separated", "Economically important but underdisclosed", "Request service gross margin, warranty burden, and support attach rate"]
      - ["Expansion / repurchase", "Existing customers add robots, sites, or adjacent modules", "robot / site expansion", "SupplyWolf cites a 74.6% repurchase rate", "Useful signal but still a third-party restatement of company data", "Request cohort expansion revenue and definition of repurchase"]
    notes: "Combines current public top-line evidence with business-model descriptions; null-style unknowns reflect absent public segment disclosure, not zero revenue."
    claimRefs: ["CI003", "CI010", "CI014", "CI015"]
  - id: "TI002"
    title: "Pricing / monetization table"
    columns:
      - "Offer / mechanism"
      - "Price unit or contract"
      - "Public signal"
      - "What is missing"
      - "Source"
    rows:
      - ["Shelf / tote / pallet system deployments", "Per site, system, or program", "Solutions are public, but no list or realized pricing is disclosed", "ASP by deployment type, milestone billing, and discounting", "Geek+, SupplyWolf, Morningstar"]
      - ["Software / fleet orchestration", "Likely bundled with system deployment or licensed by site", "Unified software platform is visible in product descriptions", "Standalone software revenue, renewals, and margins", "Geek+, Morningstar"]
      - ["Channel / regional integrator route", "Reseller / integrator assisted deployments", "Geek+ explicitly discusses using channel partners and regional integrators", "Revenue-share terms, channel margin, and implementation ownership", "Geek+, Robotics & Automation News"]
      - ["RaaS / recurring commercial model", "Subscription or usage-based robotics contract", "Assigned sources do not provide a current revenue-mix breakout", "Share of revenue that is recurring, contract duration, churn, and renewal pricing", "Public gap across assigned sources"]
    notes: "This is a diligence map rather than a priced catalog; public sources describe what Geek+ sells but not the realized commercial terms needed for underwriting."
    claimRefs: ["CI008", "CI009", "CI014", "CI015"]
  - id: "TI003"
    title: "Unit economics table"
    columns:
      - "Metric"
      - "Value / public proxy"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["1H2026 order growth", "+35.5% to RMB 2.385B", "Medium", "Best public demand and backlog proxy in the assigned pool", "Request conversion from signed orders to recognized revenue and cancellations"]
      - ["1H2026 revenue growth", "+25.3% to RMB 1.284B", "Medium", "Shows continued commercialization after IPO", "Request regional and product-level revenue bridge"]
      - ["TTM profitability", "Revenue 3.43B; net income -138.98M; profit margin -4.05%", "Medium", "Scale is visible, but current profitability is still negative", "Request gross-margin and opex bridge by product and geography"]
      - ["Liquidity and leverage", "Total cash 2.22B; debt/equity 3.08%; current ratio 2.52", "Medium", "Suggests near-term liquidity, but not a full runway view", "Request monthly cash burn, debt covenants, and working-capital swings"]
      - ["Coverage stress", "Interest coverage -25.74", "Medium", "Signals earnings still do not comfortably cover financing costs on public screens", "Request audited interest expense, EBITDA bridge, and normalized coverage"]
      - ["Comparable AMR ROI benchmark", "Collaborative AMRs: $500k-$2m upfront and 18-24 months ROI; dense systems: $3m-$8m and 2-4 years ROI", "Low", "Useful external benchmark for buyer payback, not company-specific proof", "Request realized customer payback and deployment-level ROI from Geek+"]
      - ["Public-market financing signal", "HK$6.08 close on 2026-10-16, only 2.27% above the 52-week low of HK$5.95", "Medium", "A weak tape can narrow financing flexibility even if operations improve", "Request management plan if external equity stays unattractive"]
    notes: "Mixes company-specific public data with one industry benchmark; benchmark rows are contextual only and do not establish Geek+-specific unit economics."
    claimRefs: ["CI003", "CI004", "CI005", "CI006", "CI007", "CI013"]
