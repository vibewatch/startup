  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              Geek+ positions itself as a smart-logistics platform for warehouse and fulfilment operations, with
              customer value framed around faster picking, higher density, and flexible automation rather than around
              one flagship robot alone. Across official, partner, and press sources, the most consistently evidenced
              product families are shelf-to-person, tote-to-person, pallet-to-person, and intralogistics modules, each
              mapped to a different bottleneck in picking, storage, transfer, or pallet handling. That breadth matters
              because it lets Geek+ sell into mixed warehouse workflows where a buyer may need several automation layers
              over time instead of a one-step rip-and-replace project.
            claimRefs:
              - CE001
              - CE002
              - CE003
