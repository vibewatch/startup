              - CO013
              - CO016
      - number: '1.3'
        title: Scale, capital base, and public-market footing
        blocks:
          - type: paragraph
            body: >-
              The 2025 annual report shows a company that reached meaningful scale before and through the IPO: revenue
              rose 31.6% year over year to RMB3.17 billion, adjusted net profit turned positive at RMB43.8 million, and
              cash plus time deposits reached RMB3.16 billion. Balance sheet leverage looks manageable on its face, with
              RMB357.9 million of bank borrowings that were all due within one year at year-end, while employee count
              stood at 1,054. Geek+ also presents itself as globally deployed, with about 950 end customers, service
              across more than 40 countries, and over 72,000 robots shipped by December 2025. The main caveat is
              capital-history opacity: current quote pages provide a live public valuation reference, but the assigned
              evidence does not disclose total cumulative capital raised, secondaries, or current ownership
              concentration beyond visible board affiliations and listed-equity status.
            claimRefs:
