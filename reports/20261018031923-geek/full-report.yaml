              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: Buyers are choosing between breadth, retrofit speed, and commercial flexibility
        blocks:
          - type: paragraph
            body: >-
              The retained sources point to three recurring decision criteria. First, breadth matters because operators
              increasingly want one platform that can cover shelf-to-person, tote-to-person, pallet handling, and
              intralogistics flows; Geek+'s official IPO recap and Morningstar profile both support that all-suite
              positioning. Second, retrofit speed matters because brownfield operators want to avoid taking sites
              offline; Exotec's Decathlon rollout is framed as incremental and modular, while Mordor says AutoStore,
              Exotec, and Symbotic are winning retrofit work with go-live timelines under eight weeks. Third, commercial
              model matters because public evidence suggests packaging is part of the competitive weapon: Mordor calls
              out Locus Robotics for bundling hardware, software, and maintenance into fixed monthly fees, which gives
              customers a lower-capex benchmark even when realized pricing remains opaque. The comparison tables and
              positioning map therefore emphasize deployment model and facility fit more than nominal list price,
              because the retained public evidence does not disclose comparable price books or discount curves across
              vendors.
            claimRefs:
              - CP001
              - CP005
              - CP008
              - CP011
              - CP012
              - CP013
              - CP015
