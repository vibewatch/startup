        title: Control plane, integration, and deployment model
        blocks:
          - type: paragraph
            body: >-
              The clearest architecture signal is not a public low-level software diagram but repeated references to a
              unified software platform, multi-robot orchestration, and integration with warehouse-management systems.
              Geek+ also markets adjacent moving, sorting, and forklift robots plus rent or outsource options, which
              broadens the operating envelope beyond fixed picking islands. The underwriting catch is that category
              evidence still points to integration as the hardest part of deployment: even modular AMR systems can force
              changes in layout, power, connectivity, and middleware between legacy warehouse systems and newer
              orchestration layers.
