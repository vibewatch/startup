              - CI006
              - CI007
              - CI013
      - number: '4.4'
        title: Verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial story is attractive at the demand layer and incomplete at the underwriting layer. Geek+
              appears to have a real installed base, repeat demand, overseas growth, and enough balance-sheet cash to
              avoid reading as highly levered today. What remains missing is the decision-useful bridge from deployment
              activity to durable gross profit and free cash flow: public sources do not show realized system pricing,
              discounting, RaaS-versus-system-sale mix, services attach, CAC/payback, or cohort expansion revenue. Until
              management provides those internals, the right investment stance is that revenue momentum is proven more
              clearly than margin durability.
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI009
              - CI013
