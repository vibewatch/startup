              - CP015
      - number: '3.3'
        title: Geek+ has breadth and scale, but differentiation can still compress
        blocks:
          - type: paragraph
            body: >-
              Geek+'s strongest retained competitive assets are breadth and reference scale. Company-issued and news
              sources consistently describe a broad portfolio and large installed base, while Yahoo Finance and
              Morningstar show that Geek+ now has public-market visibility after listing on HKEX. Even so, the same
              evidence base highlights reasons the moat may prove narrower than the headline market-leader story
              suggests. Incumbent integrators still control service-heavy programs where uptime assurance and OEM
              relationships matter most; Exotec shows that a focused specialist can win by making deployment easier; and
              Locus-style monthly-fee packaging lowers adoption friction without matching full-suite breadth. Symbotic's
              financial tables and Mordor's note on factory and hub expansion also suggest that large rivals can keep
              funding capacity and regional support. Finally, Mordor's discussion of WMS integration overruns implies
              that switching costs are real but heterogeneous, which helps incumbents defend installed bases and makes
              it harder for any one AMR vendor to own the whole category.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP007
              - CP009
              - CP010
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Geek+ wins the shortlist by covering more workflows, not by eliminating alternatives
            body: >-
              The strongest retained evidence for Geek+ is that it can present a broad AMR suite with public-market
              visibility and global references, which makes it a plausible default shortlist name for multi-workflow
              warehouse upgrades.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: callout
            title: Commercial packaging and service depth can narrow Geek+'s edge
            body: >-
              Incumbent service networks, Exotec's phased deployment model, and Locus-style monthly-fee packaging all
              show credible ways for competitors to compress Geek+'s differentiation when buyers optimize for risk
              transfer or entry cost rather than breadth.
            calloutType: risk
