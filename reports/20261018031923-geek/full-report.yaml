      - number: '1.4'
        title: Milestones and caution flags
        blocks:
          - type: paragraph
            body: >-
              The post-listing storyline is one of continued product acceleration. Geek+ traces its tote handling line
              back to 2018, layered in RoboShuttle Air in 2024 and robot-arm picking in 2025, then used 2026 events to
              push the embodied-intelligence thesis through Geekplus Brain, Gino 1, and RoboShuttle Hyper. Those
              milestones make the company easier to position for later product and market chapters. At the same time,
              this chapter surfaces a caution signal that later chapters should preserve rather than smooth over:
              official scale disclosures are not fully synchronized. The March 2026 LogiMAT release cited 66,000 robots
              and repurchase above 80%, whereas the 2025 annual report cited more than 72,000 robots and repurchase of
              approximately 78%. Public quote pages also show the stock trading near its 52-week low in mid-October
              2026, reinforcing that public-market expectations remain sensitive.
            claimRefs:
              - CO010
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public-company transition now has financial proof points
            body: >-
              Geek+ is no longer just narrating scale. By year-end 2025 it had produced adjusted profitability, positive
              operating cash flow, and a cash balance that materially exceeded short-term borrowings, which is a
              stronger base than many warehouse-robotics peers enter public markets with.
            calloutType: strength
            claimRefs:
              - CO002
              - CO006
              - CO007
          - type: callout
            title: Treat scale and valuation metrics as date-stamped, not timeless
            body: >-
              The assigned sources do not fully reconcile robot-count, repurchase-rate, and live valuation references
              across official and market-data surfaces. That does not invalidate the business, but it means later
              chapters should anchor every scale or valuation statement to a specific date and source family.
            calloutType: risk
            claimRefs:
              - CO010
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and workflow fit
        blocks:
          - type: paragraph
            body: >-
              The retained sources support a narrower boundary than generic warehouse-tech TAM rhetoric. Geek+ operates
              in flexible warehouse fulfillment and intralogistics automation built around AMR-led shelf-to-person,
              tote-to-person, pallet-to-person, sorting and transport workflows, with orchestration software and
              enterprise-system integration treated as part of the product, not an afterthought. Independent profile
              sources also frame Geek+ against more infrastructure-heavy automation models, which matters because the
              relevant substitute set includes manual picking, legacy fixed systems and phased retrofit projects rather
              than every form of warehouse software. This boundary is important for valuation: buyer demand depends less
              on abstract robotics enthusiasm than on whether a warehouse has enough labor, density, SKU complexity and
              peak-volume variability to justify mobile automation plus workflow redesign.
            claimRefs:
              - CM001
              - CM002
