  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The relevant alternatives span incumbents, point-solution disruptors, and internal build
        blocks:
          - type: paragraph
            body: >-
              Geek+ is not competing in a blank-slate market; the retained evidence shows a layered competitive set.
              Mordor Intelligence describes a "moderate concentration" market in which the top ten vendors hold roughly
              half of global revenue, with incumbent integrators such as Dematic, Daifuku, and Swisslog using service
              networks and OEM relationships to win uptime-sensitive, multi-year programs. In the same market map,
              disruptors including AutoStore, Exotec, and Symbotic win small-format and retrofit projects by shortening
              go-live time and charging around throughput rather than hardware. That means the practical buyer choice
              set is broader than named AMR peers alone: a prospect can keep manual processes longer, buy a specialist
              module, select a full-suite integrator, or pursue internal robotics capability if it has Amazon-like scale
              and engineering depth. Geek+'s official and company-issued materials support a broad portfolio claim, but
              the market report makes clear that breadth alone is not enough when rivals can attack through faster
              retrofit, vertical-storage density, or local service depth.
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
