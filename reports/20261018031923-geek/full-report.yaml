  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - View
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track
        - Positive operating inflection but mixed valuation signals and missing price-critical disclosures.
        - Do not underwrite a buy until diligence or price creates a clearer margin of safety.
      - - Confidence
        - Medium
        - The company is now public and provides operating data, but third-party valuation signals conflict materially.
        - Enough evidence to avoid a speculative buy or a reflexive pass, but not enough for high-conviction pricing.
      - - Risk rating
        - High
        - The stock trades near its 52-week low while competition and disclosure gaps remain material.
        - Expect downside sensitivity to commercialization delays, multiple compression, or governance surprises.
      - - Valuation stance
        - Stretched
        - >-
          Yahoo shows 4.60x trailing sales and a HK$21.92 target, while ValueInvesting marks the shares 69.2% overvalued
          at HK$6.08.
        - Entry discipline matters more than franchise quality at the current evidence level.
    notes: >-
      Public sources support the directional call, but they do not disclose the full cap-table or recurring-revenue
      details needed for tighter precision.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV008
      - CV009
      - CV010
      - CV011
