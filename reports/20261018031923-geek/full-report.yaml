chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and operating model
        blocks:
          - type: paragraph
            body: >-
              Geek+ is the brand for Beijing Geekplus Technology Co., Ltd., a PRC-incorporated company founded on
              February 3, 2015 and listed on the Hong Kong Stock Exchange on July 9, 2025 under stock code 2590 with a
              weighted-voting-rights structure. The operating footprint is still centered in Beijing, with the principal
              PRC business address in Shunyi District, a registered office in Xiongan, and a Hong Kong office in
              Wanchai. Public filings and company materials describe a business model built overwhelmingly around system
              sales: 99.9% of 2025 revenue came from robotics solutions, especially warehouse-fulfilment systems, while
              leasing and service revenue remained de minimis. That mix matters because it frames Geek+ less as a
              recurring-software story and more as a capital-goods and integration company using software to pull
              through hardware deployments.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Governance is still visibly founder-centric. Zheng Yong remains chair and chief executive, while
              co-founders Li Hongbo, Liu Kai, and Chen Xi cover the core technology, robotics, and industrialization
              functions that shaped the company from inception. The public board is structured as four executive, four
              non-executive, and four independent non-executive directors plus three supervisors, which creates a more
              formal listed-company overlay without changing the fact that the operating narrative still runs through a
              small founding bench. Non-executive seats also provide direct visibility into shareholder-linked
              influence: disclosed director affiliations tie board representation to Vertex-related entities,
              Panmao/Yuanfeng, China Internet Investment Fund/Zhongwan, and Warburg Pincus-linked firms. That is useful
              governance context, but the assigned pool does not include a current beneficial-ownership register or
              post-IPO concentration analysis.
            claimRefs:
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO011
              - CO012
          - type: table
