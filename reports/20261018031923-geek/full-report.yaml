      - number: '4.3'
        title: Margin structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The public screens in the assigned pool show a company that has reached meaningful scale but has not yet
              made profitability and cash-conversion easy for outsiders to underwrite. Yahoo Finance lists trailing
              revenue of 3.43 billion, net income attributable to common shareholders of -138.98 million, a -4.05%
              profit margin, total cash of 2.22 billion, and debt/equity of just 3.08%. Morningstar adds a 2.52 current
              ratio but also an interest-coverage figure of -25.74, while FT Markets shows the shares closing only 2.27%
              above the 52-week low. Together those signals imply adequate near-term liquidity after the IPO, but not
              yet a de-risked margin profile or a receptive equity market for a casual follow-on raise.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI003
            claimRefs:
