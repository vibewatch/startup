      - number: '2.2'
        title: Sizing lenses and buyer segments
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence is directional rather than complete. The accessible Statista topic page confirms
              that analysts track warehouse count, overall warehouse-automation market size, warehouse-robotics revenue
              and technology-adoption series as separate lenses, which is useful because it prevents collapsing the
              opportunity into one broad market number. But the same excerpt withholds the actual figures behind login,
              so this worker cannot responsibly state a source-backed TAM, SAM or SOM for Geek+. Instead, the best
              supported view is multi-lens: China remains a very deep robotics deployment base, public sources show
              multi-vertical warehouse demand, and Geek+ appears positioned where buyers want flexible automation
              without rebuilding entire facilities. Buyer and user evidence is strongest for warehouse operations teams
              in retail, e-commerce, 3PL, manufacturing, grocery and pharma contexts; named budget owners and published
              cutoff rules by geography remain gaps.
