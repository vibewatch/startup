      - number: '4.2'
        title: Sales motion, pricing, and expansion
        blocks:
          - type: paragraph
            body: >-
              The commercial motion appears to combine direct enterprise selling with local teams, channel partners, and
              regional integrators. That matches the operational reality of warehouse robotics, where deployment,
              support, and site integration are material parts of the customer relationship. Public scale signals are
              strong but imprecise: SupplyWolf cites 56,000+ robots, 800+ customers, and a 74.6% repurchase rate, while
              Robotics Registry cites 66,000+ robots across 950+ warehouses and 1H2026 scale of 81,000 robots across
              1,000 end customers. The takeaway is not that any single count is the underwriting denominator, but that
              repeat land-and-expand behavior is plausible even though realized pricing and channel economics remain
              opaque.
            claimRefs:
