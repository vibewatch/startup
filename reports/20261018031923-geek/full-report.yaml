      - number: '2.3'
        title: Drivers, constraints and timing
        blocks:
          - type: paragraph
            body: >-
              Adoption timing looks favorable but not frictionless. On the demand side, policy support for robotics in
              China, labor and throughput pressures in warehouses, and the ability to deploy robots in phases all
              support continued interest in AMR-led automation. On the constraint side, the most useful independent
              market commentary still highlights tariffs, raw-material inflation, capex sensitivity and component-cost
              pressure as real obstacles to project timing. Interact Analysis described 2025 as volatile even though a
              few large customers kept order intake strong, and its 2026 view is more constructive precisely because
              demand is expected to broaden beyond a narrow set of outsized buyers. That creates a workable market
              backdrop for Geek+, but not a proof that every customer segment will adopt at the same pace or that
              today's policy tailwinds translate cleanly into near-term SAM capture.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable market is narrower than the headline TAM
            body: >-
              The strongest evidence supports Geek+ in flexible warehouse-automation workflows where labor, density and
              throughput pain justify AMR orchestration. The assigned source pool does not justify treating all
              warehouse tech spend as Geek+'s addressable market.
