callouts:
  - calloutType: strength
    title: Public-company transition now has financial proof points
    body: >-
      Geek+ is no longer just narrating scale. By year-end 2025 it had produced adjusted
      profitability, positive operating cash flow, and a cash balance that materially exceeded
      short-term borrowings, which is a stronger base than many warehouse-robotics peers enter
      public markets with.
    claimRefs: [CO002, CO006, CO007]
  - calloutType: risk
    title: Treat scale and valuation metrics as date-stamped, not timeless
    body: >-
      The assigned sources do not fully reconcile robot-count, repurchase-rate, and live
      valuation references across official and market-data surfaces. That does not invalidate the
      business, but it means later chapters should anchor every scale or valuation statement to a
      specific date and source family.
    claimRefs: [CO010, CO016]
