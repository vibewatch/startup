artifact: company-overview
slug: geek
runDate: 2026-10-18
company:
  name: "Geek+"
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Geek+ is now a public HKEX-listed warehouse-robotics vendor whose 2025 filing shows
    RMB3.17 billion of revenue, first-time adjusted profitability, and a much stronger cash
    position after the IPO. The company still presents as founder-led and technically deep,
    but public evidence in the assigned pool leaves pre-IPO funding history, current cap-table
    concentration, and even some scale disclosures only partially synchronized across sources.
sections:
  - id: identity-and-business-model
    title: Identity, stage, and operating model
    body: >-
      Geek+ is the brand for Beijing Geekplus Technology Co., Ltd., a PRC-incorporated company
      founded on February 3, 2015 and listed on the Hong Kong Stock Exchange on July 9, 2025
      under stock code 2590 with a weighted-voting-rights structure. The operating footprint is
      still centered in Beijing, with the principal PRC business address in Shunyi District, a
      registered office in Xiongan, and a Hong Kong office in Wanchai. Public filings and
      company materials describe a business model built overwhelmingly around system sales:
      99.9% of 2025 revenue came from robotics solutions, especially warehouse-fulfilment
      systems, while leasing and service revenue remained de minimis. That mix matters because
      it frames Geek+ less as a recurring-software story and more as a capital-goods and
      integration company using software to pull through hardware deployments.
    claimRefs: [CO001, CO002, CO003, CO004]
  - id: leadership-and-governance
    title: Founders, leadership, and governance visibility
    body: >-
      Governance is still visibly founder-centric. Zheng Yong remains chair and chief executive,
      while co-founders Li Hongbo, Liu Kai, and Chen Xi cover the core technology, robotics, and
      industrialization functions that shaped the company from inception. The public board is
      structured as four executive, four non-executive, and four independent non-executive
      directors plus three supervisors, which creates a more formal listed-company overlay
      without changing the fact that the operating narrative still runs through a small founding
      bench. Non-executive seats also provide direct visibility into shareholder-linked influence:
      disclosed director affiliations tie board representation to Vertex-related entities,
      Panmao/Yuanfeng, China Internet Investment Fund/Zhongwan, and Warburg Pincus-linked firms.
      That is useful governance context, but the assigned pool does not include a current
      beneficial-ownership register or post-IPO concentration analysis.
    claimRefs: [CO011, CO012, CO013]
    tableRefs: [TO002, TO003]
  - id: scale-capital-and-public-market-footing
    title: Scale, capital base, and public-market footing
    body: >-
      The 2025 annual report shows a company that reached meaningful scale before and through
      the IPO: revenue rose 31.6% year over year to RMB3.17 billion, adjusted net profit turned
      positive at RMB43.8 million, and cash plus time deposits reached RMB3.16 billion. Balance
      sheet leverage looks manageable on its face, with RMB357.9 million of bank borrowings that
      were all due within one year at year-end, while employee count stood at 1,054. Geek+ also
      presents itself as globally deployed, with about 950 end customers, service across more
      than 40 countries, and over 72,000 robots shipped by December 2025. The main caveat is
      capital-history opacity: current quote pages provide a live public valuation reference, but
      the assigned evidence does not disclose total cumulative capital raised, secondaries, or
      current ownership concentration beyond visible board affiliations and listed-equity status.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO014, CO016]
    tableRefs: [TO001]
  - id: milestones-and-caution-flags
    title: Milestones and caution flags
    body: >-
      The post-listing storyline is one of continued product acceleration. Geek+ traces its tote
      handling line back to 2018, layered in RoboShuttle Air in 2024 and robot-arm picking in
      2025, then used 2026 events to push the embodied-intelligence thesis through Geekplus Brain,
      Gino 1, and RoboShuttle Hyper. Those milestones make the company easier to position for
      later product and market chapters. At the same time, this chapter surfaces a caution signal
      that later chapters should preserve rather than smooth over: official scale disclosures are
      not fully synchronized. The March 2026 LogiMAT release cited 66,000 robots and repurchase
      above 80%, whereas the 2025 annual report cited more than 72,000 robots and repurchase of
      approximately 78%. Public quote pages also show the stock trading near its 52-week low in
      mid-October 2026, reinforcing that public-market expectations remain sensitive.
    claimRefs: [CO010, CO015, CO016]
    figureRefs: [FO001]
