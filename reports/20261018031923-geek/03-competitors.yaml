      - [Symbotic, Large-scale warehouse-automation disruptor, "Stock Analysis shows 1,788 FY2024 revenue and 2,071 TTM revenue with negative operating income; Mordor notes a $300m capital raise for factory and hub expansion", "High-throughput automated distribution centers", "Retained evidence emphasizes scale, factory buildout and retrofit/project wins", "Captured financial rows do not label units in the extracted text, and retained pricing detail is absent"]
      - [Exotec, High-density goods-to-person specialist, "$335m Series D and $2bn valuation in 2022; about 300 robots across Decathlon sites in France, Italy, Germany and Spain", "Retail and omnichannel warehouses needing dense storage and phased rollout", "Vertical-climbing Skypod design plus phased deployment without ripping out all existing infrastructure", "Public retained evidence is strongest on storage density and modular rollout, not full-suite breadth"]
      - [Locus Robotics, RaaS / variable-capacity AMR specialist, "Scale/funding not disclosed in retained sources", "Operators seeking flexible incremental capacity", "Mordor says it bundles hardware, software and maintenance into fixed monthly fees", "Retained sources do not show the same breadth of full-facility automation scope as suite vendors"]
      - ["Incumbent integrators (Dematic / Daifuku / Swisslog)", Incumbent integrators, "Mordor says the top ten vendors hold roughly half of market revenue; incumbents leverage extensive service networks and OEM ties", "Automotive, pharma and other uptime-sensitive multi-year programs", "Service reach, OEM access and contract credibility", "Can be slower and heavier to retrofit than modular challengers per retained evidence"]
      - ["Internal build / Amazon-style benchmark", Status quo or likely entrant, "No direct vendor funding marker; scale buyers can pull robotics from R&D to production validation", "Very large operators with engineering depth and enough volume to justify proprietary systems", "Potentially tight workflow fit and strategic control", "Capital- and talent-intensive path that most buyers cannot replicate"]
    notes: Public retained evidence gives strong strategic markers on breadth, deployment model and scale, but pricing, discounts and switching-cost detail remain limited for most rows.
    claimRefs: [CP001, CP003, CP004, CP005, CP007, CP008, CP009, CP010, CP011, CP012, CP013]
