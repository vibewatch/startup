      - Geek+
      - Symbotic
      - Exotec
      - Other reference class
      - Implication
    rows:
      - [Portfolio breadth, "Broad suite across STP, TTP, PTP and intralogistics", "Retained sources emphasize scale and project wins more than portfolio detail", "Known for Skypod high-density goods-to-person system", "Locus: narrower packaging-led AMR wedge; incumbents: broad via integration", "Geek+ has a breadth story, but buyers can still prefer specialists for a narrower use case"]
      - [Retrofit / go-live speed, "Broad modular AMR framing, but retained sources do not disclose a standard deployment timeline", "Mordor groups Symbotic with retrofit winners under eight weeks", "WebProNews highlights phased deployment without ripping out infrastructure", "Incumbents win multi-year programs where uptime assurance matters more than speed", "Retrofit speed is a live wedge where focused challengers can attack"]
      - [High-density storage and vertical retrieval, "Tote-to-person and pallet solutions support density gains", "Retained evidence does not specify density performance in the assigned pool", "Skypod climbs vertical racks up to 12 meters", "AutoStore is named by Mordor as a disruptor in small-format / retrofit work", "Dense-storage buyers may evaluate Geek+ against more specialized systems"]
      - [Commercial flexibility, "Realized pricing unknown in retained public sources", "Throughput pricing is referenced at class level, not a published price book", "Public price book not retained; rollout is framed as modular and phased", "Locus is explicitly described as fixed monthly fee bundling hardware, software and maintenance", "Opex-style packaging can reduce friction even without end-to-end breadth"]
      - [Service-network credibility, "Global deployments and public-company visibility help, but service metrics are not retained", "Factory and hub expansion signal support investment", "Reference deployments help, but retained evidence is lighter on service depth", "Incumbents explicitly compete on service networks and OEM ties", "Incumbent response remains a durable risk in uptime-sensitive verticals"]
      - [Reference scale, "72,000+ robots across 950+ customer sites in 40+ countries", "Revenue scale and manufacturing expansion suggest substantial capacity", "Decathlon reference case is large and multi-country, but narrower in scope", "Amazon-style internal build is the aspirational benchmark for the largest operators", "Geek+ has enough scale to be shortlisted globally, but not to escape comparison with larger or more specialized alternatives"]
    notes: Unsupported cells are marked as unknown or described at class level only; the retained pool is stronger on deployment model and scope than on spec-for-spec feature parity.
    claimRefs: [CP001, CP002, CP005, CP007, CP008, CP009, CP011, CP012, CP013]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Player / class
      - Price / unit / contract model
      - Included capabilities
      - Discount / unknowns
      - Implication
    rows:
      - [Geek+, "Public list pricing not disclosed in retained sources", "Suite positioning across shelf-to-person, tote-to-person, pallet-to-person and intralogistics", "No retained evidence on discounting, minimum contract size or system-sale vs RaaS mix", "Geek+ competes more on breadth and reference scale than on transparent posted pricing"]
      - [Symbotic, "Mordor references throughput-based pricing for disruptors as a class; no retained Symbotic price sheet", "Large-scale automated warehouse systems", "No retained evidence on realized pricing, support fees or modular entry point", "Symbotic may win where throughput economics matter, but public comparison is incomplete"]
      - [Exotec, "No retained public list price; rollout is framed as modular and phased", "Skypod high-density storage and retrieval system", "No retained evidence on discounts or standardized commercial terms", "Exotec's commercial edge appears to be deployability rather than transparent price leadership"]
      - [Locus Robotics, "Fixed monthly fees bundling hardware, software and maintenance", "Flexible AMR capacity with bundled upkeep", "Exact fee levels, term lengths and discounts are not retained", "This creates an opex benchmark that can pressure suite vendors on entry-point affordability"]
      - ["Incumbent integrators / internal build", "Commercial model varies by project; retained sources do not provide a comparable public price book", "Broad integration, OEM access or proprietary workflow fit", "Discounting, implementation cost and service terms are mostly private", "Customers with complex uptime requirements may still accept heavier contracting if risk transfer is better"]
    notes: This is a packaging comparison rather than a like-for-like rate card; the retained public pool lacks comparable list prices, discount curves and switching-cost data across vendors.
    claimRefs: [CP001, CP007, CP008, CP012, CP013, CP015]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Evidence-backed ordinal placement shows Geek+ strongest on breadth-plus-flexibility, while incumbents and specialists each keep distinct wedges.
    data:
      xAxis:
        label: Deployment flexibility / retrofit ease
        min: 1
        max: 5
        low: heavier fixed integration
        high: modular phased rollout
        description: Evidence-backed ordinal placement from retained public sources
        scale: ordinal
      yAxis:
        label: Breadth / throughput suitability
        min: 1
        max: 5
        low: narrower workflow scope
        high: broader full-facility fit
        description: Evidence-backed ordinal placement from retained public sources
        scale: ordinal
      points:
        - label: Geek+
          x: 4
          y: 4
          tone: positive
          note: Broad suite plus unified software, with modular AMR positioning and global reference scale.
          claimRefs: [CP001, CP002, CP005]
        - label: Symbotic
          x: 2
          y: 5
          tone: neutral
          note: Retained evidence emphasizes throughput-oriented project wins, manufacturing expansion and scale more than phased retrofit simplicity.
          claimRefs: [CP008, CP009, CP010]
        - label: Exotec
          x: 5
          y: 4
          tone: positive
          note: Decathlon case supports high-density storage plus phased deployment without ripping out existing infrastructure.
          claimRefs: [CP011, CP012]
        - label: Locus Robotics
          x: 5
          y: 2
          tone: warning
          note: Fixed monthly-fee packaging creates a flexible entry point, but retained evidence is narrower on full-suite scope.
          claimRefs: [CP013, CP015]
        - label: Incumbent integrators
          x: 2
          y: 5
          tone: risk
          note: Service networks and OEM ties remain a durable advantage in uptime-sensitive, multi-year programs.
          claimRefs: [CP007, CP014]
        - label: Internal build / Amazon benchmark
          x: 1
          y: 4
          tone: adverse
          note: The path can fit a large operator tightly, but retained evidence frames it as a scale-dependent benchmark rather than a common buyer default.
          claimRefs: [CP006, CP014]
    approximationNotes: Ordinal 1-5 coordinates summarize retained public evidence on deployment model and scope; they are not sourced market-share or ROI measurements.
    claimRefs: [CP006, CP007, CP008, CP012, CP013, CP015]
callouts:
  - calloutType: insight
    title: Geek+ wins the shortlist by covering more workflows, not by eliminating alternatives
    body: >-
      The strongest retained evidence for Geek+ is that it can present a broad
      AMR suite with public-market visibility and global references, which
      makes it a plausible default shortlist name for multi-workflow warehouse
      upgrades.
    claimRefs: [CP001, CP002, CP003, CP004]
  - calloutType: risk
    title: Commercial packaging and service depth can narrow Geek+'s edge
    body: >-
      Incumbent service networks, Exotec's phased deployment model, and
      Locus-style monthly-fee packaging all show credible ways for competitors
      to compress Geek+'s differentiation when buyers optimize for risk
      transfer or entry cost rather than breadth.
    claimRefs: [CP007, CP012, CP013, CP014]
