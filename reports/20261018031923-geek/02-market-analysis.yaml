- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - E-commerce fulfillment
    - Warehouse leadership evaluating peak throughput and storage density
    - Pick/pack and fulfillment teams
    - Not publicly specified
    - High-SKU goods-to-person picking and replenishment
    - Likely operations / logistics capex sponsor; not named in retained sources
    - Seasonal peaks, walking-time reduction and dense storage needs
  - - 3PL / contract logistics
    - Multi-client warehouse operators
    - Site operations and implementation teams
    - Not publicly specified
    - Flexible robot fleets across changing customer profiles
    - Likely operations sponsor with finance oversight; not named publicly
    - Need to scale labor-light capacity across variable customers
  - - Retail / grocery distribution
    - Distribution-center operators
    - Store-replenishment and warehouse teams
    - Not publicly specified
    - Case, tote and shelf handling with order optimization
    - Likely supply-chain operations sponsor; not named publicly
    - Pressure for faster fulfillment, accuracy and store/service levels
  - - Manufacturing / pharma intralogistics
    - Plant logistics and warehouse operators
    - Internal material-handling teams
    - Not publicly specified
    - Pallet, tote and internal transport automation
    - Likely plant or logistics leadership; not named publicly
    - Need for uptime, accuracy and safer material flow inside constrained facilities
  notes: 'Segment map preserves what the retained evidence actually names: users and workflows are public, while specific payer and budget-owner fields remain mostly undisclosed and are flagged as diligence gaps rather than presented as verified facts.'
