figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  summary: Evidence-constrained market narrowing from broad warehouse automation to the workflow conditions where Geek+ is a plausible fit.
  data:
    nodes:
    - label: Global warehouse automation
      displayValue: Broad category
      note: Statista tracks this as a separate market lens, but the accessible excerpt withholds the value.
    - label: Warehouse robotics revenue
      displayValue: Narrower lens
      note: Statista separately tracks warehouse-robotics revenue, reinforcing that robotics is not the same market as all warehouse automation.
    - label: Flexible AMR / goods-to-person systems
      displayValue: Workflow-specific subset
      note: Geek+ centers on Shelf-, Tote-, Pallet-to-Person, sorting and transport workflows rather than every warehouse-tech category.
    - label: China robotics deployment base
      displayValue: 54% of annual industrial robot installs; ~2M stock
      note: IFR data supports a deep domestic robotics ecosystem, but not a direct Geek+ TAM.
    - label: Cross-vertical enterprise warehouses
      displayValue: Retail, e-commerce, 3PL, manufacturing, grocery, pharma
      note: Public evidence names these segments as the clearest deployment contexts.
    - label: Geek+ fit conditions
      displayValue: Phased retrofit and orchestration value
      note: Best fit appears where buyers need flexible automation without rebuilding entire facilities, and where software integration matters.
  approximationNotes: This pyramid shows narrowing market scope, not numeric market shares. Exact TAM/SAM/SOM values were not recoverable from the accessible assigned source pool.
