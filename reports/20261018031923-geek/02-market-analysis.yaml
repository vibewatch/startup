callouts:
- calloutType: insight
  title: The investable market is narrower than the headline TAM
  body: The strongest evidence supports Geek+ in flexible warehouse-automation workflows where labor, density and throughput pain justify AMR orchestration. The assigned source pool does not justify treating all warehouse tech spend as Geek+'s addressable market.
  claimRefs:
  - CM002
  - CM005
  - CM006
  - CM013
- calloutType: risk
  title: Demand tailwinds do not remove timing risk
  body: China's robotics-policy push and broader warehouse demand help the category, but tariffs, capex cycles, component-cost pressure and incomplete public buyer-budget evidence still limit how confidently this chapter can convert category momentum into near-term SAM capture.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
