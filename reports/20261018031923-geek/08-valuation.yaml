callouts:
  - calloutType: recommendation
    title: Track until price or diligence improves
    body: >-
      Geek+ has crossed an important operating threshold, but the public
      valuation evidence is too dispersed and the missing cap-table and
      recurring-revenue disclosures are too material to support a buy call at
      this evidence level.
    claimRefs: [CV001, CV002, CV003, CV008, CV011, CV016]
  - calloutType: risk
    title: The main downside is valuation support, not product existence
    body: >-
      The stock's position near the 52-week low, the intrinsic-value screen's
      overvaluation signal, and intensifying warehouse-robotics competition mean
      that a good company can still be a poor entry if execution or disclosure
      slips.
    claimRefs: [CV009, CV012, CV014, CV016]
