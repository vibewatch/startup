company:
  name: Geek+
chapter:
  number: 8
  title: Valuation
  summary: >-
    Geek+ has enough operating proof to stay investable—2025 revenue rose 31.6%
    to RMB 3.171 billion, adjusted net profit turned positive, and operating
    cash flow also turned positive—but the public-market read-through remains
    price sensitive rather than decisively cheap. With the shares at HK$6.08,
    only 2.27% above the 52-week low, public signals range from Yahoo's
    HK$21.92 target to ValueInvesting's HK$1.87 intrinsic value, so the right
    call is track until diligence closes disclosure gaps or entry terms create a
    clearer margin of safety.
sections:
  - id: recommendation-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The operating franchise is better than a simple headline de-rating would
      suggest: Geek+ said 2025 revenue reached RMB 3.171 billion, adjusted net
      profit turned positive to RMB 43.8 million, operating cash flow turned
      positive to RMB 85.7 million, and non-mainland China revenue reached
      75.3% of total sales. That combination is enough to avoid a bear call on
      business quality. The problem is price support and disclosure quality, not
      whether the company has a real product. Public-market evidence is mixed:
      Yahoo showed a HK$21.92 one-year target and 4.60x trailing sales, while a
      separate intrinsic-value screen put fair value at HK$1.87 and labeled the
      stock 69.2% overvalued at HK$6.08. Because the available evidence does
      not disclose the current cap-table preference stack, lockup overhang, or
      recurring-revenue quality in enough detail to underwrite upside with
      confidence, the disciplined recommendation is track rather than buy.
    claimRefs: [CV001, CV002, CV003, CV005, CV008, CV010, CV011, CV012, CV016]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: scenarios-and-valuation-support
    title: Scenario framing and valuation support
    body: >-
      The bull case depends on commercial momentum compounding into a cleaner
      quality-of-revenue story. Geek+ said 2025 orders reached RMB 4.137
      billion, Americas orders grew more than 50% year on year, and 2026
      strategy will emphasize embodied-intelligence commercialization and
      humanoid-robot deployment for warehousing. Those signals make it possible
      to argue for upside if investors start treating the current quote as a
      trough rather than a broken story. The base case is less generous:
      market-data services confirm the stock already trades in public markets,
      but they do not agree on the right valuation frame, with Yahoo showing
      4.60x sales and Morningstar showing 2.09x sales while ValueInvesting says
      the shares are overvalued. The bear case is therefore straightforward:
      if growth slows, multiple compression continues, or recurring revenue and
      customer quality do not prove out, the business can remain good while the
      stock stays unattractive.
    claimRefs: [CV004, CV006, CV008, CV010, CV011, CV012, CV013, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-diligence-and-breakers
    title: Exit readiness, diligence asks, and thesis breakers
    body: >-
      Exit readiness is structurally better than it was before July 2025
      because Geek+ is already listed on HKEX, but a quoted security is not the
      same as an easy underwriting decision. The stock closed at HK$6.08 on
      October 16 and was only 2.27% above its 52-week low of HK$5.95, which
      signals that the market is still discounting execution, tariff, and
      commercialization risk despite the company's operating progress. The most
      important final diligence asks are not generic customer calls; they are
      specific requests for the current shareholder register and any preference
      or lockup overhang, plus an updated revenue-quality bridge showing RaaS
      mix, NRR/GRR, and regional customer concentration. The thesis breaks if
      public-market weakness combines with weaker orders, delayed embodied-AI
      deployment, or evidence that competition in US warehouse robotics is
      limiting the company's ability to turn installed-base scale into durable
      recurring economics.
    claimRefs: [CV006, CV007, CV008, CV009, CV014, CV016]
