  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table-overhang
      missingEvidence: Current shareholder register, any preferred or debt-like claims senior to common, insider lockup expiries, and expected secondary-sale plans.
      whyItMatters: These terms determine whether today's public-market quote offers real upside to minority investors or hides structural dilution and liquidity pressure.
      diligencePath: Request the latest cap table, lockup schedule, debt covenant summary, and any board-approved secondary or employee-liquidity plan.
      relatedQuestionRefs: [QV007]
    - type: private-evidence-only
      severity: material
      topic: recurring-revenue-quality
      missingEvidence: Current RaaS-versus-system-sale mix, NRR/GRR, cohort payback, and regional customer concentration for 2026.
      whyItMatters: A stronger recurring-revenue and retention profile would justify a higher-quality valuation frame, while weak mix quality would make the stock de-rate further.
      diligencePath: Request a revenue bridge by business model and region, cohort retention tables, and updated top-customer concentration data before underwriting upside.
