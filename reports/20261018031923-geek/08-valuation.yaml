      - [Valuation stance, Stretched, "Yahoo shows 4.60x trailing sales and a HK$21.92 target, while ValueInvesting marks the shares 69.2% overvalued at HK$6.08.", "Entry discipline matters more than franchise quality at the current evidence level."]
    notes: Public sources support the directional call, but they do not disclose the full cap-table or recurring-revenue details needed for tighter precision.
    claimRefs: [CV001, CV002, CV003, CV008, CV009, CV010, CV011, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - [Thesis, "2025 revenue rose 31.6% to RMB 3.171 billion and adjusted net profit turned positive.", "Sustained 2026 profit conversion and a cleaner recurring-revenue disclosure could justify moving from track to selective buy."]
      - [Thesis, "Non-mainland China revenue reached 75.3% and Americas orders grew more than 50%, showing international demand is real.", "Independent proof that US momentum converts into repeatable high-margin deployments would strengthen the upside case."]
      - [Anti-thesis, "The shares closed at HK$6.08 and were only 2.27% above the 52-week low after a 52-week high of HK$33.50.", "A cheaper entry price or stabilizing market performance would reduce the de-rating risk embedded in the stock."]
      - [Anti-thesis, "Competition is intensifying in US warehouse robotics and public evidence still lacks cap-table, lockup, NRR/GRR, and RaaS-mix detail.", "A full governance and revenue-quality package could remove the need to assume hidden downside from disclosure gaps."]
    notes: This table pairs source-backed support with explicit price-sensitive conditions rather than treating business quality as a standalone buy signal.
    claimRefs: [CV001, CV002, CV005, CV006, CV009, CV014, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "2025 order growth carries into 2026, embodied-intelligence launches convert into visible repeat purchases, and new disclosures prove recurring economics are stronger than feared.", "The current quote near the 52-week low rerates toward the analyst target range if investors treat 2026 as a proof year instead of a de-rating cycle.", "Execution slippage, tariffs, or weak service economics still cap upside.", "Needs independent proof that US and overseas momentum converts into durable revenue quality."]
      - [Base, "Operating progress continues but public evidence stays incomplete on retention, RaaS mix, and overhang.", "Hold/track; the company remains credible, but valuation support is mixed enough that the stock is better watched than chased.", "The market can keep discounting the stock even if the business improves.", "Best fits the current combination of positive company data and conflicting third-party valuation reads."]
      - [Bear, "Growth moderates, commercialization of embodied-intelligence products slips, or customers delay expansion in a more competitive US market.", "Further downside is plausible because the stock is already weak and one intrinsic-value screen says fair value is far below the market quote.", "Multiple compression, governance surprises, or a weaker order book could all drive a lower floor.", "Supported by the current share-price reset, the overvaluation screen, and rising competitive pressure."]
    notes: These scenarios are directional, because the assigned public evidence does not provide enough disclosure to model dilution, preference stack, or recurring-revenue cohorts precisely.
    claimRefs: [CV004, CV006, CV008, CV009, CV011, CV012, CV014, CV016]
