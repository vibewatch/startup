companyProfile:
  summary: >-
    sennder Technologies GmbH is a Berlin-based digital road freight forwarder founded in 2015 that uses its sennOS
    platform to match enterprise shippers with carriers across 20+ European markets. The company combines full-truckload
    brokerage, logistics software, and strategic acquisitions such as Everoad, Uber Freight's European operations,
    Cars&Cargo, and Poste Italiane-backed sennder Italia, while scaling a large carrier network and green transport
    offerings.
