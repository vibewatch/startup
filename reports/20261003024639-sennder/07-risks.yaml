callouts:
  - calloutType: "risk"
    title: "EST Integration Scale Creates Substantial Execution Hurdle"
    body: "Acquiring C.H. Robinson's European Surface Transportation subsidiary doubles sennder's revenue base to €1.4bn and brings 1,700 staff across 20 European locations into sennder's organization. Managing this multi-country integration while centralizing treasury systems and merging disparate TMS workflows represents the single most critical near-term operating risk."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR006"
  - calloutType: "insight"
    title: "Absence of Third-Party Audited SLA Metrics Limits Procurement Trust"
    body: "Independent procurement reviews indicate that sennder's performance and on-time reliability claims rely predominantly on vendor-published marketing and anecdotal evidence rather than externally verified audits. Bridging this credibility gap with verifiable OTIF data is necessary to win and retain tier-1 enterprise shippers."
    claimRefs:
      - "CR005"
      - "CR008"
