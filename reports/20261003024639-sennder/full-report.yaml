      - number: '2.2'
        title: Buyer Segmentation, Workflow Ownership, and Procurement Triggers
        blocks:
          - type: paragraph
            body: >-
              Enterprise freight buyers evaluate third-party logistics (3PL) and digital forwarding providers across
              network density, system interoperability, and commercial accountability. Primary budget authority resides
              with enterprise supply chain directors and central logistics procurement teams, who manage annual freight
              tenders and allocate contract volumes based on lane coverage and service reliability. Operating
              dispatchers and warehouse managers interact daily with booking workflows, track-and-trace visibility
              interfaces, and SLA exception-handling protocols. Transitioning from legacy freight forwarders to sennder
              is typically triggered by peak volume surges, capacity crunches, enterprise decarbonization initiatives
              requiring advanced emissions data, and requirements for deep TMS/ERP API integration. However, buyers face
              switching tradeoffs when lane networks lack local depth or when accessorial surcharge structures create
              billing friction.
            claimRefs:
              - CM005
