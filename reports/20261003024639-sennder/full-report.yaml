  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Sizing Lenses, and Addressable Spend
        blocks:
          - type: paragraph
            body: >-
              The European overland goods transport market is anchored by commercial road freight, an estimated €300
              billion sector serving industrial manufacturers, FMCG distributors, retail enterprises, and e-commerce
              shippers. While rail transport offers massive bulk capacity along fixed corridors, road freight accounts
              for over 70% of freight volume modal split due to route flexibility and extensive regional point-to-point
              connectivity. sennder explicitly targets the full truckload (FTL) segment within European road freight,
              providing a digital matching and execution layer between enterprise shippers and thousands of small and
              medium-sized trucking companies across 20 European markets. Enterprise logistics budgets distinguish core
              contracted linehaul spend from tactical spot freight, where digital brokerage platforms capture
              transaction-based take rates and load fees while managing spot volatility.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM009
