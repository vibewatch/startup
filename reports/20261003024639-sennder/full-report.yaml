  - id: FP001
    title: Ordinal competitive positioning map
    type: quadrant
    summary: >-
      An evidence-constrained view of software workflow intensity (x-axis) versus physical operating infrastructure
      (y-axis).
    data:
      points:
        - label: sennder
          x: 5
          'y': 2
          detail: Software-forward digital FTL model using independent-carrier capacity.
        - label: Lineage
          x: 3
          'y': 5
          detail: Warehouse-led network with digital visibility and substantial physical facilities.
        - label: Traditional forwarder / broker
          x: 2
          'y': 3
          detail: Incumbent archetype; exact technology and asset mix are unsupported in this pool.
        - label: Direct road carrier
          x: 2
          'y': 4
          detail: Fleet-based transport provider; digital maturity varies and is not evidenced here.
        - label: Rail / intermodal
          x: 1
          'y': 5
          detail: Infrastructure-heavy modal alternative with route and transshipment constraints.
        - label: Internal build / manual procurement
          x: 1
          'y': 1
          detail: Shipper-controlled status quo; position depends on private systems and assets.
    approximationNotes: >-
      Analyst ordinal scores from 1 (lower) to 5 (higher), inferred from disclosed operating models rather than measured
      market data. They do not represent market share, product quality, or audited capability.
    claimRefs:
      - CP016
  - id: FI001
    title: Revenue model bridge with unresolved economics
    type: flow
    summary: >-
      The documented operating sequence is visible, but price, carrier cost, recognition, and gross-profit conversion
      remain private.
    data:
      nodes:
        - id: shipper-demand
          label: Spot or contract shipper demand
          detail: Booking mechanism is public; customer price and commitment are not.
        - id: digital-booking
          label: Digital booking and load creation
          detail: Platform workflow connects enterprise shippers with carrier capacity.
        - id: carrier-bid
          label: Carrier matching and bid
          detail: Carrier bid economics and acceptance rates are not disclosed.
        - id: transport-execution
          label: Transport execution and tracking
          detail: Service-delivery and exception-handling cost are unavailable.
        - id: shipper-billing
          label: Shipper billing
          detail: Gross versus net revenue recognition is unresolved.
        - id: gross-profit
          label: Revenue less carrier and delivery costs
          detail: Take rate and contribution margin per load require data-room evidence.
    approximationNotes: >-
      Conceptual sequence only; no value, margin, conversion rate, or accounting treatment is estimated from the public
      sources.
    claimRefs:
      - CI001
      - CI004
