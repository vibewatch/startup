      - number: '2.3'
        title: Growth Drivers, Structural Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Market adoption of digital freight brokerage is propelled by enterprise demand for real-time telematics
              visibility, carrier network aggregation, and fleet decarbonization through route optimization. sennder
              leverages partnerships with data providers like CO3 to integrate advanced telematics data sets, improving
              tracking accuracy, unloading slot management, and CO2 reduction reporting across more than 40,000
              connected trucks. Conversely, structural constraints include carrier market fragmentation where over
              90,000 road haulage companies operate in Germany alone, severe cyclicality in freight rates, and rising
              operational overhead following major scale acquisitions such as C.H. Robinson's European business.
              Critical diligence gaps remain regarding segment-specific take rates, net revenue retention, and audited
              gross margin contribution per load across enterprise contract versus spot lanes.
            claimRefs:
              - CM003
              - CM007
              - CM009
              - CM011
              - CM012
