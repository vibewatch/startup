  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Overview and Customer Workflow Definition
        blocks:
          - type: paragraph
            body: >-
              sennder provides an end-to-end digital road freight platform focused on European full-truckload (FTL)
              transportation, addressing an overland logistics sector that represents over 70% of freight volume. The
              commercial offering connects enterprise cargo owners with contracted motor carriers through proprietary
              technology designed to replace fragmented manual freight brokerage. Shippers access self-service web
              portals to request spot quotes, contract freight lanes, schedule pickups, and track in-transit
              consignments in real time. Carrier partners interact with dispatchers and manage assignments through the
              orcas mobile application and web portals, allowing drivers to submit digital documentation and status
              updates. Central to sennder's operational proposition is sennOS, a proprietary logistics operating system
              that orchestrates order intake, dynamic load matching, and carrier assignment across more than 40,000
              connected trucks in twenty European markets.
            claimRefs:
              - CE001
              - CE004
              - CE008
              - CE010
              - CE012
