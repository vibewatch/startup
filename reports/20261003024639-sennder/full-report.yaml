  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The buyer's job is to secure reliable freight capacity, visibility, and exception handling rather than to
              purchase software in isolation. The EIB describes sennder as a digital freight-forwarding platform that
              connects large shippers with small independent carriers, while sennder's own glossary shows that direct
              shipping companies can provide FTL, LTL, and specialized transport without a digital-forwarder
              intermediary. Warehouse-led 3PLs such as Lineage add physical storage and value-added handling, rail and
              intermodal services can substitute on suitable lanes, and internal procurement remains the status quo for
              shippers willing to coordinate carriers themselves. The eligible pool did not identify a reliable, current
              roster of named European digital FTL peers, so the profile table treats that direct-peer set as an
              explicit gap rather than presenting an invented exhaustive list.
