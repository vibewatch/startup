chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Scale, and Business Model
        blocks:
          - type: paragraph
            body: >-
              sennder Technologies GmbH is a German digital road freight forwarder founded in September 2015 and
              headquartered in Berlin, Germany [CO001]. The company operates in the European road freight transportation
              market, addressing a broader logistics sector historically estimated at approximately €300 billion
              [CO002]. Through its proprietary operating system, known as sennOS, sennder directly interfaces enterprise
              shippers with independent road freight carriers, orchestrating spot and contract full-truckload (FTL)
              freight movements [CO003]. The company operates a dual-sided digital portal comprising a Shipper Portal
              for self-service capacity booking, automated pricing, and real-time shipment visibility, alongside a
              Carrier Portal that facilitates load bidding, fleet dispatching, and rapid payment processing [CO003].
              sennder claims network reach across more than 20 European countries and regional markets, dispatching over
              150,000 monthly freight loads by connecting into a network of over 40,000 vetted carriers with access to
              more than 250,000 vehicles [CO004]. To support sustainability mandates from enterprise cargo owners, the
              company offers a Green Business solution facilitating lower-carbon logistics via advanced biofuels and
              commercial electric vehicle options [CO005]. As part of its broader research and market updates, sennder
              regularly publishes the RoadPulse Monthly Logistics Report evaluating freight capacity trends across
              Europe [CO006].
