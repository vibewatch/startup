evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements detailing 2025 and 2026 revenue, net revenue, gross margin, contribution margin per
      load, and EBITDA performance.
    whyItMatters: >-
      Without audited income statements, sennder's operating trajectory and path to net profitability cannot be verified
      independently.
    diligencePath: >-
      Request management accounts, audited German Bundesanzeiger filings, and unit-economic breakdowns by client tier in
      data-room diligence.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: cap-table-breakdown
    missingEvidence: >-
      Complete cap table detailing share class breakdown, liquidation preference seniority, and option pool allocation
      post-Series D.
    whyItMatters: >-
      Enables precise calculation of dilution, waterfall payouts, and effective cost basis for new secondary or growth
      investors.
    diligencePath: Examine cap-table extracts in company data room and German commercial register share ledger updates.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross margin percentage, broker take rate, and EBITDA contribution margin broken down across contract
      versus spot freight lanes.
    whyItMatters: >-
      Without access to audited gross take rates and contribution margins, it is impossible to verify whether sennder's
      €1.4 billion top-line revenue scale translates into sustainable operational profitability.
    diligencePath: >-
      Obtain confidential information memorandum or data-room access regarding unit economics and post-acquisition
      carrier payout spreads.
    relatedQuestionRefs:
      - QM008
  - type: enumeration-incomplete
    severity: material
    topic: direct-peer-set
    missingEvidence: >-
      A current, independently sourced roster of named European digital FTL competitors with comparable scale, funding,
      target segment, and product scope.
    whyItMatters: Without a reliable named-peer set, direct market-share, funding, and feature comparisons cannot be underwritten.
    diligencePath: Obtain procurement shortlists, recent market studies, and direct competitor filings or official product materials.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Lane-level realized pricing, rate cards, discount grids, surcharge schedules, implementation fees, and contract
      terms across sennder and alternatives.
    whyItMatters: Public commercial models cannot establish landed-cost advantage or margin durability.
    diligencePath: >-
      Request anonymized customer contracts, recent bid sheets, surcharge schedules, and realized price waterfalls by
      lane.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-lock-in
    missingEvidence: >-
      Customer retention cohorts, multi-homing rates, integration time, contract duration, carrier acceptance, and
      independently audited SLA performance.
    whyItMatters: >-
      These metrics determine whether network density creates durable switching costs or merely transactional access to
      capacity.
    diligencePath: >-
      Review customer cohorts, carrier cohorts, integration logs, service-level reports, and reference calls for major
      shipper accounts.
    relatedQuestionRefs:
      - QP005
      - QP006
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross-versus-net revenue policy, revenue mix, gross margin, contribution margin per load, CAC, payback,
      sales cycle, retention, and cash conversion.
    whyItMatters: >-
      Without these inputs, transaction scale cannot be converted into revenue quality, operating leverage, or a
      credible path to profitability.
    diligencePath: >-
      Obtain audited consolidated and segment financials plus monthly shipper and load-level cohorts reconciled from
      billings through carrier cost to gross profit.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly net burn, runway, debt balances and maturities, covenants, acquisition
      consideration, integration budget, and next-round triggers.
    whyItMatters: >-
      Historical funding and debt access do not show how much cash remains or whether the enlarged operating perimeter
      can fund itself.
    diligencePath: >-
      Request the latest board finance pack, 24-month cash forecast, debt and covenant schedule, acquisition closing
      statement, and integration actual-versus-budget file.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current realized spot and contract rates, carrier procurement costs, discounts, surcharge treatment, SaaS
      packaging, and channel economics.
    whyItMatters: >-
      Public workflow descriptions identify how freight is booked but do not establish take rate, pricing power,
      discount leakage, or sales efficiency.
    diligencePath: >-
      Sample shipper contracts, carrier rate confirmations, invoice data, SaaS order forms, and pricing approvals across
      representative lanes and customer cohorts.
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: tms-api-integration
    missingEvidence: >-
      Publicly verifiable API specifications, ERP/WMS connector documentation (e.g. SAP, Oracle TMS, Blue Yonder), and
      automated EDI data dictionary.
    whyItMatters: >-
      Enterprise shippers evaluate integration cost, implementation lead time, and automation completeness before
      switching from legacy freight forwarders.
    diligencePath: >-
      Request technical integration documentation, sample API payloads, and connector guides directly from sennder's
      solutions engineering team in the data room.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: uptime-sla-metrics
    missingEvidence: >-
      Historical platform uptime records, formal contractual availability SLAs, and published incident escalation
      frameworks.
    whyItMatters: >-
      Mission-critical supply chain operations require enforceable uptime guarantees and clear liability terms for
      shipment tracking outages.
    diligencePath: >-
      Review standard master service agreements (MSAs) and historical incident reporting logs during technical due
      diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: shipper-retention-and-concentration
    missingEvidence: >-
      Audited annual shipper retention rates (NRR/GRR), customer cohort churn data, and top-ten shipper volume
      concentration percentages.
    whyItMatters: >-
      Without retention and concentration metrics, investors cannot confirm whether sennder's platform volume reflects
      durable enterprise accounts or high-churn transactional broker business.
    diligencePath: >-
      Inspect historical shipper cohort retention curves, tender renewal win rates, and top customer revenue
      contributions in a private data room.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-compliance
    missingEvidence: >-
      Comprehensive regulatory inspection records, historical cabotage infraction logs, and litigation docket filings
      across all 20 European jurisdictions.
    whyItMatters: >-
      Uncertainty regarding historical transportation regulatory violations or driver labor compliance penalties could
      alter underwriting liability assumptions.
    diligencePath: >-
      Request audited legal compliance certificates, active litigation disclosures, and transportation regulatory
      clearance filings in the data room.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: post-2021-financials
    missingEvidence: Audited post-2021 financial statements including revenue run-rate, gross margin, EBITDA, and net cash burn.
    whyItMatters: >-
      Essential to determine whether sennder's operating trajectory supports its $1B baseline valuation in a higher
      interest rate environment.
    diligencePath: Obtain confidential information memorandum (CIM) and historical financial audit reports via data room.
    relatedQuestionRefs:
      - QV009
  - type: private-evidence-only
    severity: material
    topic: cap-table-liquidation-preferences
    missingEvidence: >-
      Detailed capitalization table disclosing seniority rankings and liquidation preferences across Series D and
      extension investors.
    whyItMatters: Directly determines common and early investor recovery under conservative or distressed exit scenarios.
    diligencePath: Review articles of association, investment agreements, and cap table models during confirmatory legal diligence.
    relatedQuestionRefs:
      - QV005
