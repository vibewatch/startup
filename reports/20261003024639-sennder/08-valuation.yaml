    body: "Prospective growth equity or secondary investors should resist assigning a premium over sennder's June 2021 $1B Series D mark until audited data-room records confirm lane-level gross contribution margins, sustainable EBITDA profitability, and cap-table seniority rules [CV001, CV002, CV010, CV012]."
