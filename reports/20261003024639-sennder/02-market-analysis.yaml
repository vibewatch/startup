callouts:
  - calloutType: "insight"
    title: "Strategic Consolidation as a Density Driver"
    body: "In the fragmented €300B European road freight market, digital brokerage platforms require immense network density to achieve matching liquidity and operational leverage. sennder's acquisition of C.H. Robinson's European Surface Transportation business exemplifies consolidation designed to double annual turnover to €1.4B while expanding enterprise carrier access across 20 markets."
    claimRefs:
      - "CM001"
      - "CM003"
      - "CM009"
  - calloutType: "risk"
    title: "Carrier Fragmentation and Surcharge Transparency Headwinds"
    body: "With more than 90,000 road haulage companies in Germany alone and negative employee sentiment reported in recent workforce data, operational scaling faces friction. Furthermore, enterprise procurement scorecards highlight risks around fragmented accessorial surcharges and unverified unit economics across volatile spot freight lanes."
    claimRefs:
      - "CM002"
      - "CM008"
      - "CM010"
      - "CM012"
