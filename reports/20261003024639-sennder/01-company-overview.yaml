callouts:
  - calloutType: "insight"
    title: "Network Density Versus Fixed-Cost Burden"
    body: "sennder has achieved unmatched digital FTL network density in Europe by pairing organic technology development on sennOS with inorganic market acquisitions like Everoad, Uber Freight Europe, and Cars&Cargo [CO016]. However, maintaining dual portals, bespoke enterprise integrations, and regional hubs has elevated overhead, necessitating recent headcount pruning [CO010]."
    claimRefs:
      - "CO003"
      - "CO010"
      - "CO016"
  - calloutType: "risk"
    title: "Workforce Attrition and Sentiment Drag"
    body: "Independent workforce monitoring from Revelio Labs indicates an 8.3% year-over-year headcount contraction to 1,446 employees alongside negative and declining employee sentiment [CO010, CO011]. Diligence must evaluate whether reductions reflect operational automation efficiencies or morale stress across carrier operations and support desks."
    claimRefs:
      - "CO010"
      - "CO011"
