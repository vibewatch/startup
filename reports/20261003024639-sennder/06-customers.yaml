callouts:
  - calloutType: "risk"
    title: "Enterprise Freight Churn and Annual Tender Vulnerability"
    body: "Unlike software subscriptions with multi-year lock-in, road freight forwarding contracts are routinely subject to annual or bi-annual procurement re-tendering. Enterprise shippers frequently shift lane allocations based on marginal price concessions, creating persistent volume churn risk if market spot rates drop below contracted rates."
    claimRefs:
      - "CU001"
      - "CU009"
      - "CU011"
  - calloutType: "insight"
    title: "Strategic Joint Ventures as Customer Defense Moats"
    body: "sennder's co-investment in entity-level joint ventures—specifically sennder Italia with Poste Italiane and JUNA Technologies with Scania—creates structural customer lock-in that transcends traditional forwarding broker relationships, securing multi-year captive freight volumes."
    claimRefs:
      - "CU005"
      - "CU007"
      - "CU008"
