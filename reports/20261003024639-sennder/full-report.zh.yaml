  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入结构与收入质量
        blocks:
          - type: paragraph
            body: >-
              分析 sennder 时，宜将其定性为技术赋能型整车货代，而非纯粹的软件订阅公司。Tracxn 指出其平台供承运人找货竞价、货主预订即期与合同运输；EquityZen
              亦称其连通大型货主与小型承运人。这佐证了以货运驱动的商业模式，但现有资料未披露货运运费按总额法还是净额法确认、支付承运人后的留存利差，以及 SaaS 产品贡献的收入占比。路透社（Reuters）在 2024 年
              7 月报道称，收购 C.H. Robinson 欧洲陆运业务预计将使收入翻番至 EUR 1.4 billion。该数字属于交易宣布时对合并后大主体的预期，并非
              ARR、经审计的当期收入，亦非内生性增长证明。sennder 自身声称的 EUR 300 billion 公路运输市场规模仅属行业背景，不能作为公司收入或利润率的佐证。
