              sennder 联合参股实体层面合资企业——特别是与 Poste Italiane 合资的 sennder Italia 以及与 Scania 合资的 JUNA
              Technologies——形成了超越传统货运经纪关系的结构性客户锁定，锁定了多年的专属闭环货运量。
