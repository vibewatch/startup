            body: >-
              现有记录显示其具备多元资本获取渠道，但无法反映当前流动性。sennder 于 2021 年宣布完成 USD 80 million D 轮第二期融资，并将资金投向并购、合作、SaaS
              拓展与研发。欧洲投资银行随后记录了 2024 年 7 月签署的 EUR 40 million 风险债权交易，用于研发与市场扩张。Reuters 亦报道称，宣布的 EST
              收购将完全以现金支付，而收购对价未予公开；CEO 当时称暂无新的股权融资计划。这些历史事实无法推断 2026 年 10 月的可用现金余额。第三方统计的融资总额亦存在微小出入——Tracxn 记录为 USD 413
              million，Forge 记录为 USD 414.08 million——同时 Forge 未显示当前价格或投后估值。因此，累计融资额既不等同于账面现金，也不代表资金跑道。
