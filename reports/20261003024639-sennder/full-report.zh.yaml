      - number: '3.2'
        title: 规模、分销与战略方向
        blocks:
          - type: paragraph
            body: >-
              sennder 展现了获取资本和在欧洲搭建网络的能力，但现有指标的统计年份与发布机构各异。公司在 2021 年新闻稿中报道称当年拥有 12,500 辆卡车并承揽超 100 万车次货运；2024 年 EIB
              项目页面记录了一笔 EUR 40 million 贷款用于研发与市场扩张。RFP.wiki 随后称其拥有 40,000-plus 经审核承运人并在 20
              多个市场开展运营，但该对比数据既非经审计申报，亦非独立运营基准。Revelio Labs 估计截至 2026 年 3 月员工数为 1,446 人，同比下降 8.3%；GetLatka 报道称 2024 年收入为
              USD 1.1 billion，但该名录数据为营收而非 ARR，且其页面将该数据归因于 sennder.com。这些信号反映出一定规模，但不能等同于流动性、盈利能力、网络活跃度或当前竞争份额的衡量标准。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP013
              - CP014
