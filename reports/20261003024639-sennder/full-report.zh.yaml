  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              买方的诉求是锁定可靠货运运力、可视化追踪与异常处置能力，而非孤立采购软件。EIB 将 sennder 描述为连接大型货主与中小型独立承运人的数字化货运代理平台；而 sennder
              官方词条显示，直营货运企业无需数字化货代中介即可提供整车（FTL）、零担（LTL）及特种运输服务。Lineage 等仓储型 3PL
              补足了实体仓储与增值搬运；铁路和多式联运可在适配车道上提供替代运力；对于愿意自行调度车队的货主，内部采购仍是主流常态。样本库中未发现可靠且最新的欧洲数字化整车同行名录，因此画像表将该直属同行群体列为明确缺口，而非杜撰详尽名单。
            claimRefs:
              - CP001
