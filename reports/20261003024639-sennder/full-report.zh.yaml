            body: >-
              收入质量目前尚无法给出暂定以上的评级。最强有力的公开规模指标仅为并购发生时的合并预期收入，而收入结构、确认政策、内生增长、集中度、抽佣率以及毛利率走势均无公开数据。资本密集度同样悬而未决：庞大的运营团队、风险债权、全现金并购结构以及持续的产品研发投入，既可能源于健康的经营性现金流，也可能伴随着实质性融资依赖。Revelio
              披露的员工同比缩减以及持续下滑的消极情绪属于反向运营信号，但非现金消耗过快或财务陷入困境的确凿证明。投资评估的前提仍应是获取以下材料：经审计的分部财务报表、单批次队列数据、现金及债务明细表、收购对价与整合支出，以及从货主开票额到净收入与毛利润的核对明细表。
