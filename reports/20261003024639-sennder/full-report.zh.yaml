          x: 5
          'y': 2
          detail: 调动独立承运人运力的软件先导型数字化整车货运模式。
        - label: Lineage
          x: 3
          'y': 5
          detail: 具备数字化可视化能力且坐拥大体量实体设施、以仓储为核心的运营网络。
        - label: 传统货代 / 经纪商
          x: 2
          'y': 3
