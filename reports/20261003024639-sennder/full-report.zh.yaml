chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业法人架构、运营规模与商业模式
        blocks:
          - type: paragraph
            body: >-
              sennder Technologies GmbH 成立于 2015 年 9 月，总部位于德国柏林，是一家德国数字化公路货运代理商 [CO001]。公司深耕欧洲公路货运市场，所切入的泛物流赛道历史上估算约为
              €300 billion [CO002]。sennder 依托名为 sennOS 的自研操作系统，直接连通企业级货主与独立公路承运人，调度即期（spot）及合同制整车货运（FTL）流转
              [CO003]。公司运营双边数字化门户：面向货主的 Shipper Portal 支持自主运力预订、自动定价与在途货物实时可视化；面向承运人的 Carrier Portal 则提供货源竞价、车队调度及快速结款服务
              [CO003]。sennder 公司口径称其网络覆盖 20 多个欧洲国家及区域市场，连接超过 40,000 家经审核承运人及 250,000 多辆可用车辆，每月调度超过 150,000 单整车货物
              [CO004]。为配合企业货主的减碳要求，公司推出 Green Business 解决方案，借由先进生物燃料和商用电动货车选项推动低碳物流落地 [CO005]。作为行业研究与市场动态的一部分，sennder
              定期发布《RoadPulse 月度物流报告》，评估欧洲全境运力走势 [CO006]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
