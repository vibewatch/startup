      - number: '3.4'
        title: 护城河韧性与替代风险
        blocks:
          - type: paragraph
            body: >-
              sennder 最具防御性的公开信号在于软件工作流与触达分散承运人底盘的结合，而非确凿的合同锁定效应。历史收购与 Poste Italiane 合资项目显示，公司在扩充供给、提高网络密度；EIB
              融资则为持续平台研发提供支撑。然而，审阅资料并未披露客户留存率、车道级承运人接单率、多归属倾向（multi-homing）、系统集成耗时、合同周期、切换成本或经独立审计的服务表现。这使得网络效应看似合理但尚未验证。核心替代风险来自传统玩家数字化、直营承运人采购、以仓促运捆绑销售以及特定适配货源的运输方式替代。因此，定位图仅为基于已披露运营模式的序数分析视角，而非市场份额分布图或量化产品评测基准。
            claimRefs:
              - CP002
