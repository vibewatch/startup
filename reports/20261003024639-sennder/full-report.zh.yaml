      - number: '7.3'
        title: 财务工程、流动性与交易对手依赖
        blocks:
          - type: paragraph
            body: >-
              管理泛欧整车货运需要庞大的营运资金支撑，原因在于企业货主应收账期与承运人快速结款方案之间存在资金到账时间错配。sennder 财务运作仰赖主动现金管理、保理与反向保理机制以及集团层面的资金池（cash
              pooling），以维系流动性并支撑分布于欧洲各实体的日常运营。将 EST 等收购子公司并入集中化资金池与司库管理软件时，带来了流动性预测及银行交易对手风险敞口。此外，战略性依赖关系（如与传统邮政巨头 Poste
              Italiane 设立的 sennder Italia 合资公司，以及对分散独立承运人车队的依赖）造成了运营锁定，若合作伙伴承诺或承运人接单率发生波动，极易引发潜在单点故障风险。
            claimRefs:
              - CR006
              - CR009
              - CR012
              - CR013
