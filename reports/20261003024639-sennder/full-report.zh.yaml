              潜在成长期股权或老股投资者在经审计的数据室记录证实车道级毛贡献率、可持续 EBITDA 盈利能力及股权结构表优先清算顺位规则之前，应审慎评估，不宜较 sennder 2021 年 6 月 D 轮 $1B
              定价给出溢价 [CV001, CV002, CV010, CV012]。
