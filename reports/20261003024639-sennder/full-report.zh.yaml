  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、测算视角与可触达支出
        blocks:
          - type: paragraph
            body: >-
              欧洲陆路货物运输市场以商业公路货运为支柱，这一产业规模估计达 €300
              billion，服务于工业制造、快消品分销商、零售企业和电商货主。尽管铁路运输在固定走廊上具备大宗散货运力，但凭借路线灵活性与密集的区域点对点通达性，公路货运在运输方式划分中占据 70%
              以上货运量。sennder 明确聚焦欧洲公路货运中的整车（FTL）板块，在 20
              个欧洲市场为企业级货主与数千家中小型卡车运输公司搭建数字化撮合与执行层。企业物流预算将核心合同干线运输支出与战术性即期货运区分开来，数字化经纪平台则在应对即期运价波动时，按单抽取撮合抽佣（take
              rates）与单笔服务费。
            claimRefs:
