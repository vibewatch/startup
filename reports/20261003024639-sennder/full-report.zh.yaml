      - number: '1.3'
        title: 资本结构、债权融资与战略演进
        blocks:
          - type: paragraph
            body: >-
              sennder 历经多轮融资累计筹集风险股本与成长期资金，涵盖种子前轮、种子轮、A 轮、B 轮、C 轮及 D 轮阶段 [CO013]。2021 年 6 月，公司完成由新投资方 Baillie Gifford
              领投、老股东跟投的 D 轮第二期 $80 million 融资，使 D 轮股本融资总额达到 $240 million，投后估值突破 $1 billion [CO014]。除股权融资外，sennder
              还引入了可观的准股权与风险债权融资，在避免股权过度稀释的同时支持技术研发与业务扩张。2024 年 7 月 23 日，欧洲投资银行（EIB）在欧盟 InvestEU 计划框架下签署了 €40 million
              风险债权额度，为 sennder 研发软件升级与国际扩张注资 [CO015]。公司的企业发展以战略整合为主线，包括收购法国的 Everoad、Uber Freight 欧洲业务、荷兰物流运营商
              Cars&Cargo，以及与意大利国家邮政 Poste Italiane 合资组建 sennder Italia [CO016]。
