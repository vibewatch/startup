            body: >-
              sennder 客户拓展的公开佐证主要依托企业商业合作与公开合资企业。在意大利，sennder 携手国家邮政运营商 Poste Italiane 设立 sennder
              Italia，推动该国境内整车货代专项年营业额突破 €100 million。在北欧与中欧物流线路上，sennder 联合 Scania Group 成立 JUNA Technologies，签约企业承运人以及
