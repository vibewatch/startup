      - number: '5.3'
        title: 货运工作流执行与可量化运营收益
        blocks:
          - type: paragraph
            body: >-
              在传统公路货运代理中，货主与承运人间沟通高度脱节，依赖电话沟通、繁琐邮件链以及纸质运单。sennder
              以数字化工作流取代这些繁复手工环节，简化了订单招标、承运人订舱及节点追踪。物流主管在货主门户输入货物规格，即可获得基于市价的自动化报价并即时确认订舱，免去了旷日持久的线下谈判。面向承运人，orcas
              移动工作流将货源推送至智能手机，减少了行政空转时间并加快了发票结算周期。当运输途中出现司机延误或装车时段调整等异常情况时，Octopus 平台依据预设服务等级标准，通过自动化打标与 Webhook
              路由即刻通知支持团队。这种自动化协同提升了货主可视化程度与承运人车辆周转率，同时拓宽了运营规模。
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE010
      - number: '5.4'
        title: 技术差异化、集成缺口与产品风险
        blocks:
          - type: paragraph
            body: >-
              sennder 借力自研算法撮合技术并通过战略并购做密欧洲承运人网络，以此形成数字化货代差异化优势。2024 年收购 C.H. Robinson 欧洲陆路运输业务，为 sennOS 生态引入了 6,500
              多家货主与 15,000 多家承运人，提供了调优动态运力匹配算法所需的规模基底。然而，技术尽调暴露出明显的信息缺口与运营依赖。公开技术文档在预置 API 连接器、EDI 数据交换标准，以及与 SAP 或
              Oracle 等客户 ERP/TMS 系统的深度集成能力方面透明度有限。此外，sennder 未公开披露正式合同在线率 SLA、自动化可用性指标，亦未披露第三方网络安全与质量认证。使用 orcas
              的移动端司机的个人数据隐私与遥测合规仍受欧洲区域性监管约束。
            claimRefs:
              - CE007
              - CE008
