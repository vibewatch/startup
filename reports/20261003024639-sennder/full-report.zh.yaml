      - number: '1.2'
        title: 创始人、治理架构与员工动态
        blocks:
          - type: paragraph
            body: >-
              sennder 由 David Nothacker、Julius Köhler、Nicolaus Schefenacker、Nicolas Stephan 与 Christian Nothacker 共同创立
              [CO007]。日常运营由联合创始人兼首席执行官 David Nothacker 掌舵，统领长期战略与并购执行 [CO008]。sennder Technologies GmbH
              的公司治理架构设有一个六人监事会，成员包括联合创始人 David Nothacker、Nicolaus Schefenacker、Julius Köhler 与 Nicolas
              Stephan，以及风险投资机构代表 Luca Bocchio（代表 Accel）和 Christoph Schuh（代表
              Lakestar）[CO009]。创始团队的留任保障了泛欧扩张期间的战略连贯性，但员工数据反映出扩张后出现明显收缩。根据 Revelio Labs 员工分析数据，截至 2026 年 3 月，sennder
              全球员工数约为 1,446 人，较 2025 年峰值减少 356 名员工，同比收缩 8.3% [CO010]。Revelio Labs 员工情绪分析表明，sennder
              整体员工情绪偏消极且持续走低，折射出整合后的运营精简以及货运市场下行周期的挤压 [CO011]。在招岗位出现战术性企稳迹象，2026 年追踪到 61 个在招职位，自 2025 年低点反弹
              49%，但每月新增在招岗位数仍远低于历史扩张期高位 [CO012]。
