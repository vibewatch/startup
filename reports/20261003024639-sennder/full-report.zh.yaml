  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台概览与客户工作流定义
        blocks:
          - type: paragraph
            body: >-
              sennder 提供端到端数字化公路货运平台，聚焦欧洲整车（FTL）运输，切入占据全欧超 70%
              货运量的陆运物流板块。其商业方案依托自研技术连通企业级货主与签约汽车承运人，旨在替代分散的人工货运经纪模式。货主通过自助 Web 门户获取即期报价、签订车道合同、安排提货并实时跟踪在途货物。承运人伙伴通过
              orcas 移动应用与 Web 门户对接调度员并管理运单任务，司机可在线提交电子单证与在途状态。sennder 业务运作的核心是自研物流操作系统 sennOS，在 20 个欧洲市场跨越 40,000
              多辆入网卡车，协同调度订单录入、动态货载匹配与承运人派单。
            claimRefs:
              - CE001
              - CE004
              - CE008
              - CE010
              - CE012
