      - number: '7.4'
        title: 图表与附注
        blocks:
          - type: callout
            title: EST 整合规模构成重大执行关卡
            body: >-
              收购 C.H. Robinson 欧洲陆运子公司使 sennder 营收规模翻倍至 €1.4bn，并将分布在 20 处欧洲办公地点的 1,700 名员工纳入组织。在集中司库系统与合并不同 TMS
              工作流的同时应对跨国整合，构成了近期最关键的单一运营风险。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
          - type: callout
            title: 缺乏第三方审计 SLA 指标制约采购信任
            body: 独立采购评估指出，sennder 对性能表现与准时履约的声称主要依赖厂商市场宣传与口头案例，而非外部核验审计。借由可验证的 OTIF 数据弥合这一信任缺口，是获取并留存一线头部企业货主的必要前提。
            calloutType: insight
            claimRefs:
              - CR005
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与核心反向逻辑
        blocks:
          - type: paragraph
            body: >-
              sennder 已确立欧洲头部数字化货代地位，在高度分散的公路物流领域聚合运力网络供给。其核心投资逻辑在于依托 sennOS 自研平台实现自动化、建立战略企业联盟，并在主要贸易通道推进市场整合 [CV001,
              CV005, CV008]。然而，核心反向逻辑指出了边际贡献率信息严重不透明、D 轮多批次融资带来的大幅股权稀释，以及 2021 年科技市场见顶以来货运科技平台估值倍数的全行业下调 [CV002, CV003,
              CV007, CV013]。在缺乏经审计单体经济模型和 2021 年之后交易估值支撑的情况下，高估值倍数扩张难获认可 [CV010,
              CV014]。历史上，货运经纪业务在宏观经济下行周期中对货量周期与毛利率承压均表现出高度敏感性 [CV010, CV013]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
