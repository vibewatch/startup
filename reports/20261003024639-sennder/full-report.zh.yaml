      - number: '6.3'
        title: 商业持续性、客户集中度与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              尽管平台初具规模，sennder
              的商业韧性仍面临货运市场结构性风险与显著的披露缺口。在传统公路货运代理中，合同招标协议通常每年重签一次，使经纪人暴露于承运人费率波动、即期市场低价冲击以及周期性货运需求收缩的风险之下。此外，sennder
              尚未公开披露关键的软件型持续性指标——包括净留存率（NRR）、总留存率（GRR）、年度货主客户流失率，以及前十大客户集中度比例。Poste Italiane
              等战略支柱与大型汽车制造客户构成了显著的货量聚集区，其合同违约解除条款或最低货量保底承诺若有变动，可能实质性影响网络密度。因此，评估 sennder
              商业韧性，必须定向核验账户维度的车道利润率、标段续约中标率以及货主队列留存情况。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
