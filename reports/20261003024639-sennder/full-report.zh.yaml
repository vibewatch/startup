      - number: '5.2'
        title: 核心架构、技术栈与运营工具链
        blocks:
          - type: paragraph
            body: >-
              sennOS 底层基于模块化事件驱动微服务架构，主要托管于 Amazon Web Services（AWS）云基础设施上。核心后端服务采用 Python 开发并由 PostgreSQL 关系型数据库支撑，利用
              Docker 容器化并交由 Kubernetes 集群编排，通过 Terraform 基础设施即代码进行配置管理。高吞吐事件流由 Apache Kafka
              承载，作为消息底座异步协调货运全生命周期事件、状态流转与运营告警。针对内部运营，sennder 开发了专有 TMS 工具界面 Octopus，通过 REST API 将运营人员工作流与 Front
              通信平台打通。该整合将遥测数据、货载状态和客户往来沟通汇聚到统一工作空间，据报道为欧洲履约枢纽的运营团队每月节省约 3,500 小时工时。货主端及内部运营端的 Web 前端基于 Vue.js
              构建，保障了运营看板的交互体验。
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE006
              - CE013
              - CE015
