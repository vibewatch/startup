      - number: '7.2'
        title: 运营、整合与网络执行脆弱性
        blocks:
          - type: paragraph
            body: >-
              收购 C.H. Robinson 旗下的欧洲陆路运输（EST）业务从根本上拓宽了 sennder 的运营版图，将 1,700 名员工、20 处欧洲驻地、6,500 家货主以及 15,000
              多家承运人并入其运营核心。但本次整合带来了显著的投后组织摩擦、传统 TMS 与 sennOS 平台间的 IT 融合难题，以及跨境枢纽的执行瓶颈。与此同时，独立采购评估强调，sennder
              平台性能与准时足量交付（OTIF）稳定性指标主要出自厂商自述而非外部审计。由于缺少公开的服务等级协议（SLA）违约罚则披露与第三方履约验证，货主面临异常处置的不确定性，而承运人运力也容易受到欧洲整体货运市场波动与道路拥堵延误的冲击。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
              - CR011
