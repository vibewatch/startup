            body: 与具备多年锁定的软件订阅不同，公路货运代理合同通常需经年度或半年度重新招标。企业级货主往往因微小的价格让步便切换车道分配，一旦市场即期运价低于合同运价，就会引发持续的货量流失风险。
            calloutType: risk
            claimRefs:
