        blocks:
          - type: paragraph
            body: >-
              sennder 围绕在欧洲大陆需要稳定跨境整车（FTL）运力的高货量企业级货主组织商业需求。其客群细分为大型跨国工业巨头、消费品制造商、零售物流运营商与公共邮政网络，供给端则由 40,000
              多辆签约承运人卡车提供运力支撑。在欧洲规模达 €300 billion 且高度分散的公路货运市场中，企业级货主与 sennder
              签约，旨在获得数字化货运在途追踪、自动化招标执行、动态即期撮合以及经得起检验的碳足迹追踪分析。通过在欧洲主要物流枢纽设立专门的商业产品线与承运人管理团队，sennder
              使区域承运人作业与核心贸易走廊上波动的货主货量需求保持契合。
