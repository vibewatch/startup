      - number: '8.3'
        title: 情景分析与退出就绪度
        blocks:
          - type: paragraph
            body: >-
              情景建模显示，乐观、基准与悲观运营情景下的估值分布差异显著 [CV010, CV011, CV012]。乐观情景对应在 €300B
              欧洲公路货运市场中全面实现平台自动化与利润率扩张；悲观情景则考虑了持续的宏观货运衰退与利润率侵蚀 [CV008, CV010, CV012]。包括 Forto、Flexport 与 LKW WALTER
              等数字化及传统货代在内的公募与私募可比标杆表明，在缺乏经审计净利润证明的情况下，一级市场估值在老股交易中面临沉重折价压力 [CV007, CV013, CV014]。因此，未来实现 IPO
              或战略并购退出，需要具备持续的利润率防御壁垒、清晰的公司治理结构，以及在动荡市场环境中得到验证的承运人留存能力 [CV005, CV007, CV010, CV015]。
            claimRefs:
              - CV005
