      - number: '4.2'
        title: 定价、成本结构与单体经济模型
        blocks:
          - type: paragraph
            body: >-
              公开资料虽提及即期与合同订舱，但既未披露挂牌价，也未公布实际成交价、折扣、保底承诺、燃油附加费计法、承运人付款账期或 SaaS
              打包方案。因此，毛利拆解依然无法获知。员工估算数据提供了一个有限的成本参照：Revelio 报告截至 2026 年 3 月员工数为 1,446 人，同比下降 8.3%，其中财务与运营人员占
              44.0%。这一人员构成符合重履约交付与运营底座的特征，但无法直接换算为营业成本、营业支出或重组节支金额。同理，公司历史卡车与货运单量仅体现业务活跃度，无法反映商业化变现效率。审阅资料均未提供毛利率、单均贡献毛利、客户获取成本（CAC）、回本周期、销售周期、留存率、设备利用率或营运资金周转指标。
