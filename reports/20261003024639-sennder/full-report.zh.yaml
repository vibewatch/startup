      - number: '2.2'
        title: 买方分层、工作流归属与采购触发点
        blocks:
          - type: paragraph
            body: >-
              企业货运买方从网络密度、系统互操作性与商务履约责任多维度评估第三方物流（3PL）及数字化货代。核心预算审批权集中在企业供应链总监与总部物流采购团队手中，他们主导年度货运招投标，并依据车道覆盖和履约稳定性分配合同货量。一线调度员与仓库经理则在日常工作中接入订舱流程、在途追踪看板以及
              SLA 异常处理机制。从传统货代切换至 sennder 的触发因素通常包括高峰期运量暴增、运力紧缺、需要前沿排放数据的企业脱碳行动，以及对 TMS/ERP 深度 API
              集成的硬性需求。但若车道网络缺乏本土深度，或额外附加费结算引发争议，买方在切换时仍会面临取舍。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
