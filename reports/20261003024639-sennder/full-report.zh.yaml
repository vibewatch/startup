              - CV006
              - CV008
              - CV009
              - CV013
      - number: '8.2'
        title: 投资建议框架与估值立场
        blocks:
          - type: paragraph
            body: >-
              我们给予 sennder「观察」（track）评级与中等置信度。对标历史 $1B 基准股权定价，当前估值处于「合理」（fair）水平，但因财务披露无法获知而潜藏较高底层风险 [CV001, CV002,
              CV010, CV011, CV015]。11 次融资事件中已披露的累计融资金额在 $340M 至 $413M 之间，最近一轮定价股权融资为 2021 年 6 月确认的 $1B 估值 [CV001, CV003,
              CV004]。投资者必须恪守审慎入场纪律：资金投放应以数据室（data room）全面透明为前提，必须涵盖 EBITDA 利润率、车道级贡献利润率与清算优先权堆叠 [CV009, CV012,
              CV016]。在管理层拿出经核验的 2021 年后审计财务报告之前，成长期股权投资人对老股流动性定价时应计入防御性折扣，以规避下行估值陷阱 [CV010, CV013, CV015]。
            claimRefs:
