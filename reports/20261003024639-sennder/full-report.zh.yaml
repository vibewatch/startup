  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险敞口
        blocks:
          - type: paragraph
            body: >-
              sennder 在 20
              多个欧洲司法管辖区展业，身处强监管的跨境运输环境中。公路货运在架构为私营商业合同时虽避开了欧盟直接的公共采购法规，但在数万家承运人运营的各个区域中，法定公路运输准入要求与欧洲跨境过境运输（cabotage）法规构成了严格的运营边界。此外，sennder
              自研数字化系统（尤其是 orcas 平台及面向司机的移动工具）从成千上万辆外部承运卡车与调度员处采集并处理运营及遥测数据。在 GDPR
              与欧洲数据隐私法规约束下，跨国运营实体处理位置、通信及运输单证会带来法律合规责任，必须建立严密的数据治理架构以防范监管处罚。
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR010
