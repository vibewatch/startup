              鉴于 sennder 在 2021 至 2023 年间通过多次 D 轮交割与延期筹集了大量中后期资金，若货运科技整体估值倍数无法恢复至 2021 年水平，普通股股东可能面临潜在的优先清算压顶（preference
              overhang）风险 [CV003, CV007, CV009, CV013]。
