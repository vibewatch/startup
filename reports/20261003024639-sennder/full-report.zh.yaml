      - number: '2.3'
        title: 增长驱动力、结构性约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              数字化货运经纪的市场渗透主要受企业端三大需求驱动：实时车载通信（telematics）可视化、承运人网络聚合，以及依托路线优化的车队减碳。sennder 携手 CO3 等数据服务商整合先进车载数据，提升了
              40,000 多辆入网卡车的在途追踪精度、装卸预约时隙管理与 CO2 减排报告质量。相反，结构性制约同样突出：仅德国就有超过 90,000 家公路运输企业，承运人格局极度分散；货运运价具有强周期性；收购 C.H.
              Robinson 欧洲业务等大规模资产后运营开销不断上升。关键尽调缺口在于：细分市场的抽佣率、净收入留存率，以及企业合同车道与即期车道之间经审计的每单毛利率贡献仍未披露。
            claimRefs:
              - CM003
              - CM007
              - CM009
              - CM011
              - CM012
      - number: '2.4'
        title: 图表与附注
        blocks:
          - type: callout
            title: 战略整合驱动网络密度
            body: >-
              在规模达 €300B 且高度分散的欧洲公路货运市场中，数字化经纪平台必须具备庞大的网络密度才能形成撮合流动性与经营杠杆。sennder 收购 C.H. Robinson
              旗下的欧洲陆路运输业务即是典型整合案例，该交易旨在将年营业额翻倍至 €1.4B，同时在 20 个市场扩大企业级承运人资源。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM009
          - type: callout
            title: 承运人分散度与附加费透明度阻力
            body: 单在德国就有超过 90,000 家公路运输企业，叠加近期员工数据反映出的负面情绪，规模化运营面临阻力。此外，企业采购考评表指出，分散杂乱的杂费附加机制以及在波动剧烈的即期车道上未经证实的单体经济模型均存在风险。
            calloutType: risk
            claimRefs:
