      - number: '3.3'
        title: 能力、定价与采购权衡
        blocks:
          - type: paragraph
            body: >-
              公开证据支持其具备差异化数字化工作流，但无法形成完整的功能或价格基准。RFP.wiki 指出 sennder 提供实时追踪与自助订舱，但也指出公开资料未提及 API
              覆盖深度、正式运力兜底承诺、经审计的准时足量交付（OTIF）表现，亦无公开收费标准。该对比描述了货主门户中的固定价与市价机制，但未见公开价目表。Lineage
              采用不同的商业模式：通过协商仓储报价或费率表计费，由仓储、装卸、增值服务以及潜在运价变动构成总成本。直营承运人、铁路/多式联运商及内部团队仍是可行替代方案，但现有证据未提供可比的车道费率、合同折扣、实施费用或客户实际成交价。因此，表格将已观察到的商业模式与未知条款区分开来，而非把不完全的披露扭曲为虚假的价格排序。
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
              - CP015
