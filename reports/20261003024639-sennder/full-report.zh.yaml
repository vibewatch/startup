  - id: FI001
    title: 商业变现模型推演与待厘清经济效益图
    type: flow
    summary: 虽可清晰观察到已有明确记载的业务流转链路，但定价机制、承运成本、收入确认口径及毛利转化数据仍未公开。
    data:
      nodes:
        - id: shipper-demand
          label: 现货即期或合同托运需求
          detail: 订舱机制属公开信息；客户交易价格与运量承诺均未公开。
        - id: digital-booking
          label: 数字化订舱与运单创建
          detail: 平台工作流将大企业托运人与承运车队运力直接对接。
        - id: carrier-bid
          label: 承运商撮合与竞价投标
          detail: 承运商竞价收益与接单意愿率均未公开披露。
        - id: transport-execution
          label: 运输在途执行与轨迹追踪
          detail: 实际履约服务交付与异常事件处置成本均不可获取。
        - id: shipper-billing
          label: 托运人结算开票
          detail: 采用全额法还是净额法确认收入口径尚未厘清。
        - id: gross-profit
          label: 收入扣除承运与交付成本
          detail: 每单抽佣率与边际贡献利润率尚需虚拟数据室（data room）证据核实。
    approximationNotes: 仅为概念性业务链条推演；从公开来源中无法估算任何金额、利润率、转化率或会计处理方式。
