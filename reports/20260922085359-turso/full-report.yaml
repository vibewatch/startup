      - number: '4.3'
        title: Capital needs and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The financial diligence gap is simple: the evidence does not tell us how much revenue exists, how fast the
              company is growing, or what the current capitalization table looks like. That makes any exact valuation
