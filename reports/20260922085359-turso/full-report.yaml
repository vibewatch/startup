              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: Milestones and operating posture
        blocks:
          - type: paragraph
            body: >-
              The visible milestone trail is consistent with a company moving from fork to rewrite to commercialization.
              The New Stack and the company’s own materials describe an early SQLite fork, then a Rust rewrite to add
              MVCC, async I/O, replication, encryption, and browser/local support. In the public narrative, those
              product milestones are paired with customer stories such as Engine Labs, Adaptive, and Poke, which
              suggests the company is using product-led adoption as a growth engine rather than waiting for a classic
              enterprise sales motion to dominate.


              The homepage also highlights BYOC, SOC 2 Type II, GDPR/HIPAA readiness, and per-database encryption, which
              indicates a deliberate push toward enterprise-grade deployment and compliance. Those claims do not by
              themselves prove broad enterprise penetration, but they do show the company is trying to reduce adoption
              friction for regulated or security-conscious buyers. In short, the milestone pattern is product-first,
              then cloud commercialization, then compliance hardening.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO009
              - CO010
      - number: '1.3'
        title: Funding and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The public funding picture is incomplete. Third-party market-data pages such as Caplight and community
              discussion suggest a seed-stage financing history and named investors, but the exact terms, valuation, and
              cap-table structure are not publicly disclosed in the fetched evidence. That means the company cannot be
              underwritten from primary financial disclosure alone, and any valuation judgment has to stay provisional.


              This opacity is not unusual for a private infrastructure startup, but it does create a practical diligence
              consequence: the current report can support product and technical conviction, yet it cannot support
              precise financial modeling. The right interpretation is that Turso is likely beyond stealth, but still
              early enough that public financial disclosure is thin and third-party databases remain the main source for
              capital structure clues.
