      - number: '6.3'
        title: Durability, expansion, and gaps
        blocks:
          - type: paragraph
            body: >-
              Durability is the biggest missing public metric. The evidence does show expansion potential: if each
              agent, tenant, or version gets its own database, usage can scale very quickly even before a classic
              enterprise renewal cycle fully develops. That helps explain why the homepage can credibly talk about
              millions of databases. But the same dynamic also means the company has to prove that those databases stay
              sticky and cost-effective over time.


              What is not public is just as important. There is no open NRR, no published churn, and no disclosed
              concentration list. So the right diligence reading is that customer adoption appears real and
