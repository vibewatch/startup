              - CM009
              - CM010
      - number: '2.2'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are the same ones repeated across the official homepage, partner messaging,
              and independent writeups: AI agents need isolated workspaces, consumer apps need privacy boundaries,
              multi-tenant platforms need hard customer separation, and global apps need low-latency reads. Those needs
              translate into concrete buying criteria: how fast a database can be created, whether it can run close to
              the user, whether it can stay in sync, and whether the team can avoid running a separate cache and
              database stack.


              The constraint set is just as important. Turso and outside commentary both acknowledge that write-heavy
              workloads, generic non-SQL use cases, and broad database replacement are not its sweet spot. The market
              therefore rewards a clear product fit statement: use Turso when isolation, SQLite compatibility, and
              replication simplicity are worth more than the flexibility of a fully general purpose database.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
