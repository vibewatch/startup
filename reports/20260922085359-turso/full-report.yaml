              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical strength
            body: >-
              The product is coherent: SQLite compatibility is the anchor, the rewrite adds distributed behavior, and
              the cloud layer monetizes the complexity the engine removes from users.
            calloutType: strength
            claimRefs:
