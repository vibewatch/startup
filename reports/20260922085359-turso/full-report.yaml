        - Rewrite lands; adoption accelerates; enterprise conversion improves
        - Multiple expansion on product-led infrastructure growth
        - Another material incident or rewrite stall
      - - Base
        - Good product, steady adoption, limited public financial clarity
        - Moderate multiple on growth optionality
        - Revenue remains undisclosed
      - - Bear
        - Technical complexity or competition slows adoption
        - Compressed multiple / lower confidence
        - Customer proof weakens or trust slips
      - - Optionality
        - AI-agent / many-database demand grows
        - Upside from category expansion
        - Market stays niche
      - - Underwriting
