companyProfile:
  summary: >-
    Turso is a private developer-infrastructure company building a SQLite-compatible distributed database and managed
    cloud layer for local-first, edge, multi-tenant, and agent-oriented workloads. The company presents itself as a
    rewrite of SQLite in Rust / libSQL, with product and customer evidence that suggest real technical differentiation,
    but public financial disclosure remains thin enough that valuation confidence is low.
  foundedDate: '2021-01-01'
