  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who uses Turso
        blocks:
          - type: paragraph
            body: >-
              The customer evidence clusters around a few clear segments: AI agent builders, product teams that want
              per-user or per-tenant isolation, and developers who need a low-friction SQLite-compatible database that
              can move between local and cloud environments. The homepage customer stories reinforce that pattern by
              showing a database-per-entity model rather than a generic enterprise storage pitch.


              That segmentation matters because it explains why Turso can look small in a top-line software sense while
              still being highly relevant to a specific set of buyers. The public evidence does not point to mass-market
              consumer adoption; it points to developer-led adoption in technically demanding workflows where isolation
              and sync are more valuable than raw feature breadth.
