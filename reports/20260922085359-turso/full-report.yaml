  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Operational and technical risks
        blocks:
          - type: paragraph
            body: >-
              The clearest risk is that the product is technically ambitious. The rewrite depends on compatibility,
              sync, replication, and cloud orchestration all working together, and the public evidence shows that the
              company is still finishing parts of the architecture. That creates ordinary infrastructure risk: bugs,
              edge cases, and operational complexity. The incident post makes that concrete by showing that mistakes in
              backup and configuration can cause both data loss and data leak issues.


              The good news is that the company does not appear blind to the risk. It is writing about encryption, auth
              migration, BYOC, and stateless cloud design, which suggests the team is actively trying to turn a fragile
              architecture into a resilient one. But a diligence memo should still assume that the more ambitious the
              architecture, the more one-off failures matter.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR009
      - number: '7.2'
        title: Partner, customer, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Turso also carries partner and competitive risk. It relies on infrastructure partners and cloud
              primitives, and the competitive set is broad enough that a customer can often pick a different database
              family or a DIY SQLite path. That means the product must win not just on features but on trust,
              distribution, and a workflow that feels less burdensome than the alternatives.


              The public evidence suggests the company is addressing this with partner programs, BYOC, and clear
              use-case messaging. Those are sensible mitigations, but they do not eliminate the risk that the market
              decides Turso is “good enough” rather than indispensable. For that reason, the moat should be treated as
              behavioral and workflow-based, not as a hard technical lock-in.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Kill criteria and mitigations
        blocks:
          - type: paragraph
            body: >-
              Financial and reputation risk remain the last major categories. The company is still early enough that
              public revenue and retention metrics are not visible, which means the business could be more fragile than
              the product story suggests. In a downside case, one more incident or a slower-than-expected rewrite could
              make the market question whether the architecture is too complex to support broad adoption.


              The mitigating signs are obvious but not yet decisive: SOC 2 messaging, encryption work, Clerk migration,
              partner programs, and public engineering updates. Those are the right moves, but they should be treated as
              mitigation in progress, not as proof that the risks are gone. The practical investment question is whether
              the team can keep reducing the gap between ambition and operating reliability.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Risk takeaway
            body: >-
              The product is promising, but the risk profile is not hypothetical: the company has already had an
              incident, and the rewrite remains a live engineering program. That makes mitigation maturity a core
              diligence topic, not a footnote.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bullish thesis is straightforward: Turso sits in a real and growing workload category where isolated
              databases, local-first workflows, and AI-agent state management are likely to matter more over time. The
              product is coherent, the customer stories are real, and the rewrite narrative suggests meaningful
              technical ambition. If the company can keep narrowing the rewrite gap, the market may reward it with
              sticky developer adoption and higher enterprise value.


              The anti-thesis is just as clear. The public record does not reveal enough revenue detail, pricing detail,
              or retention detail to justify a precise valuation view. Third-party market-data pages exist, but they are
              low-signal and inconsistent. That means the business may be good while the price remains unknowable. In a
              diligence memo, that should push the answer toward patience rather than false precision.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV012
      - number: '8.2'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              The financing context suggests a seed-stage venture-backed company, but not one with a clean public
              valuation mark. Caplight, Notice, and CB Insights all point to some combination of funding, investors, and
              private-market interest. The problem is that they do not line up perfectly, and none of them gives a
              primary company statement in the fetched pages.


              For underwriting, that means the public evidence supports optionality rather than certainty. Turso may
              have enough technical and product momentum to be valuable, but the valuation anchor is still moving. In
              practical terms, a disciplined investor would wait for clearer financial disclosure or a stronger
              independent benchmark before treating the company as fairly priced.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Bull / base / bear cases
        blocks:
          - type: paragraph
            body: >-
              A sensible scenario set treats Turso as a category-shaping product that can still underperform financially
              if the market stays narrow or the rewrite takes longer than expected. The bull case is strong developer
              adoption and enterprise conversion; the base case is a good product that grows steadily but without clear
              public pricing leverage; the bear case is a technically interesting product that remains hard to
              underwrite because valuation and revenue stay opaque.


              That is enough to make a recommendation, but not enough to make a hard buy call. The best public-data
              stance is to keep the thesis active while waiting for better financial evidence. In other words, Turso
              looks like a tracking name, not a current pricing opportunity.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation conclusion
            body: >-
              Turso is interesting enough to keep tracking, but the public evidence does not justify a hard price call.
              The rational stance is to wait for better financing and operating disclosure.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV012
