  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Turso delivers
        blocks:
          - type: paragraph
            body: >-
              Turso is not trying to be a generic cloud database first; it is trying to make SQLite work in modern
              production workflows. The public evidence describes a Rust rewrite, libSQL compatibility, embedded
              replication, sync between local and cloud copies, and a managed cloud layer that can support per-database
              deployment. That combination means the product sits at the intersection of developer tooling, distributed
              systems, and data infrastructure.


              The architecture matters because it is designed to keep the SQLite mental model while adding the missing
              features needed for AI agents, edge apps, and multi-tenant products. In practice, that means customers can
              start locally, move to the cloud, and preserve the same surface area. The product is therefore judged less
              on novelty and more on whether it can keep compatibility while adding enough new power to justify the
              rewrite.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
