            body: >-
              The homepage and adjacent customer stories provide the best public proof: Engine Labs, Adaptive, and Poke
              are concrete examples, and the AWS blog shows Turso being used in a more infrastructure-heavy setting. The
              Fly.io customer page adds another independent view that Turso can be operationalized at scale in a managed
