      - number: '5.2'
        title: How the system works
        blocks:
          - type: paragraph
            body: >-
              The technical stack is built around a data plane/control plane split, async I/O, MVCC, and stateless cloud
              operations. The fetch set also points to native encryption, CDC, vector search, live materialized views,
              and browser or local execution paths as part of the broader rewrite. These are not all fully mature
              features, but they show a coherent engineering direction rather than a random list of add-ons.


              The most important operational idea is that the product wants to make the database file itself portable
              while keeping the cloud orchestration around it simplified. That allows the company to sell local-first
              behavior, cloud sync, and sovereign deployment from a single architecture story. The upside is clarity;
              the downside is that every feature gap in the rewrite becomes highly visible because the product promise
              is so specific.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE008
      - number: '5.3'
        title: Maturity, trust, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The roadmap evidence shows a young but moving codebase. The company has shipping releases, open-source
              clients, and a visible blog trail that keeps pushing the rewrite forward. At the same time, the rewrite
              still has incomplete feature coverage versus SQLite, and the cloud story depends on careful reliability
              and security work. That is why the product narrative includes SOC 2, encryption, BYOC, and operational
              simplicity so prominently: Turso is trying to make trust part of the product itself.


              From a diligence perspective, this is enough to see credible engineering momentum, but not enough to
              assume the rewrite risk is gone. The right question is whether the current architecture is stable enough
              to scale adoption while the missing pieces are still being filled in. The public evidence says
              “promising,” not “finished.”
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
