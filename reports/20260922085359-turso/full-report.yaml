  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than “other database startups.” Direct peers include managed edge SQL
              products, managed SQLite offerings, and the emerging wave of application databases that promise
              low-latency access without a large operational footprint. Turso also competes with the status quo: plain
              SQLite plus custom replication, a Postgres stack with caches, or a homegrown synchronization layer. That
              means the company is fighting on both product features and operational simplicity.


              Independent coverage and community discussion repeatedly frame Turso as a rewrite of SQLite rather than a
              normal cloud database. That helps differentiation, but it also means the company must prove compatibility,
              reliability, and the absence of hidden complexity. If customers believe they can get “good enough”
              behavior from vanilla SQLite or a standard cloud database, Turso has to win on developer experience and
              scale economics, not just feature checklists.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
