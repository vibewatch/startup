chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >-
              Turso frames itself as an architecture for “millions of databases,” not a single shared database tier. The
              homepage emphasizes per-user, per-agent, and per-tenant databases, embedded replication, and a managed
              Turso Cloud alongside an open-source engine. That positioning matters because it defines the company as
              infrastructure for isolated workloads rather than a generic database brand. The current evidence set
              consistently describes the product as SQLite-compatible and designed for local-first and cloud-synced
              applications, which makes the identity unusually specific for a private startup.


              The New Stack’s coverage adds the founder view: Glauber Costa and Pekka Enberg started the company in
              2021, with libSQL as the managed data plane and Turso as the cloud/service layer. GitHub and community
              coverage reinforce the same picture: Turso is a Rust-based SQLite rewrite that seeks compatibility while
              adding modern distributed features. That combination of product scope, architecture, and developer
              audience gives the company a sharply defined market narrative rather than a broad platform story.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
