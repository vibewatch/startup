  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              The public evidence points to a hybrid model: Turso offers an open-source engine and a managed cloud
              service, with the cloud layer carrying the commercial value. The homepage and developer coverage suggest
              that the company is trying to monetize convenience, replication, BYOC, and compliance rather than the base
              SQLite-compatible runtime itself. That is a common infrastructure pattern, but the exact pricing and
              package mix are not fully visible in the fetched evidence.


              What matters for diligence is that the monetization story is plausible even without public financials. If
              developers adopt the open-source layer first, the cloud can later monetize usage, convenience, and
              enterprise controls. That creates upside, but it also means the current report must treat public pricing
              assumptions cautiously because the company does not disclose enough to underwrite revenue quality from
              first principles.
            claimRefs:
