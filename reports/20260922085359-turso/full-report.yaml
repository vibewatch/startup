  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Where the market begins and ends
        blocks:
          - type: paragraph
            body: >-
              Turso's own messaging and the independent coverage around it point to a market boundary that is narrower
              than “databases” in general. The company is selling a database architecture for many small, isolated
              databases: per-user, per-agent, per-tenant, and per-application copies that can live locally and
              synchronize to the cloud. That means the market is not generic OLTP infrastructure, but a workload
              category where isolation, low latency, and operational simplicity matter more than raw relational breadth.
              The market is also adjacent to edge compute, offline-first apps, and managed SQLite tooling rather than
              only to traditional cloud relational databases.


              The boundary matters because it changes substitution. A team choosing Turso is not only comparing it to
              PostgreSQL or MySQL; it is also comparing against vanilla SQLite, cache + API designs, Cloudflare D1-style
              edge SQL, and the do-it-yourself path of building replication around a file-backed database. That makes
              the real market a hybrid of developer tooling, cloud infrastructure, and distributed state management.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
