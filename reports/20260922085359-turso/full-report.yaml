      - number: '3.2'
        title: Where Turso is different
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiator is the combination of SQLite compatibility, embedded replication, and a
              managed cloud that can present a database-per-entity model. The docs and developer coverage make clear
              that Turso is not trying to become a generic relational platform; it is trying to make SQLite behave like
              a modern distributed system without forcing developers to abandon the SQLite toolchain. That is a narrower
              promise, but it is also a clearer one.


              The company also benefits from an open-source surface area around libSQL while still monetizing the cloud
              layer and control plane. That split can be a moat if the workflow is sticky, but it can also be copied if
              a competitor can match the sync path and the developer ergonomics. So the decisive comparison is not
              feature presence alone; it is how much of the stack a customer actually needs to adopt to get the benefit.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Moat durability and substitution risk
        blocks:
          - type: paragraph
            body: >-
              The moat risk is straightforward: if customers can combine SQLite, a cache, and a small amount of sync
              infrastructure to approximate the same outcome, pricing power weakens. Community debate and independent
              guides show that Turso has to keep proving that its integrated approach is simpler and safer than
              stitching together alternatives. The public evidence does not suggest a winner-take-all market. It
              suggests a category where multiple tooling paths can work, and the winner will be the one that minimizes
              operational burden for the target workload.


              That makes distribution and trust as important as technology. The company needs to show that its product
              is not merely another database with a nicer marketing layer, but a genuinely lower-friction architecture
              for a specific class of app. If the workflow becomes a habit for developers, Turso can hold its ground; if
              not, the competitive set will keep pulling customers back toward familiar defaults.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Competitive takeaway
            body: >-
              Turso looks differentiated, but the moat is more workflow-driven than structural. If the customer job
              becomes easier to solve with a generic stack, competition will compress pricing and attention.
            calloutType: risk
