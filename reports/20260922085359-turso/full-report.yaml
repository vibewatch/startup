              has raised capital, while Notice and PitchBook reinforce that the market sees the company as a
              venture-backed database startup. That is enough to conclude that Turso is not bootstrapped and not
              stealth, but not enough to support a hard valuation model.


              The traction evidence is therefore indirect. The company clearly has customer-facing product momentum,
              open-source adoption, and enough market interest to generate analyst coverage, yet there is no public ARR,
              revenue run-rate, or detailed customer count in the fetched evidence. For an underwriting view, that means
              the business has proof of life, but the operating metrics remain largely opaque.
