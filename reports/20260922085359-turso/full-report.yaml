      - number: '2.3'
        title: Sizing lens and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports a market opportunity, but not a precise single-number TAM. The right
              sizing lens is a stack of overlapping segments: edge databases, managed SQLite, AI-agent infrastructure,
              and multi-tenant SaaS with strict data boundaries. Those lenses overlap but are not identical, so any
              broad market estimate should be treated as directional rather than definitive.


              For diligence, the important question is not whether the total database market is huge; it is whether
              enough teams need the specific combination Turso offers to support durable pricing power. The public
              evidence supports that thesis at the workflow level, but not yet at the scale of a fully underwritten
              category leader.
