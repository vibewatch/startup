  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Turso presents itself as a SQLite-based database architecture built for many databases, with embedded replication, cloud/local sync, and managed cloud deployment. The company appears venture-backed and still opaque on exact financial terms, so the key diligence question is whether product traction and technical differentiation are strong enough to justify the remaining funding and execution gaps."
  },
  "sections": [
    {
      "id": "overview-identity",
      "title": "Identity and positioning",
      "body": "Turso frames itself as an architecture for \u201cmillions of databases,\u201d not a single shared database tier. The homepage emphasizes per-user, per-agent, and per-tenant databases, embedded replication, and a managed Turso Cloud alongside an open-source engine. That positioning matters because it defines the company as infrastructure for isolated workloads rather than a generic database brand. The current evidence set consistently describes the product as SQLite-compatible and designed for local-first and cloud-synced applications, which makes the identity unusually specific for a private startup.\n\nThe New Stack\u2019s coverage adds the founder view: Glauber Costa and Pekka Enberg started the company in 2021, with libSQL as the managed data plane and Turso as the cloud/service layer. GitHub and community coverage reinforce the same picture: Turso is a Rust-based SQLite rewrite that seeks compatibility while adding modern distributed features. That combination of product scope, architecture, and developer audience gives the company a sharply defined market narrative rather than a broad platform story.",
      "claimRefs": [
        "CO001",
        "CO002",
        "CO003",
        "CO004"
      ],
      "tableRefs": [
        "TO001"
      ],
      "figureRefs": [
        "FO001"
      ]
    },
    {
      "id": "overview-milestones",
      "title": "Milestones and operating posture",
      "body": "The visible milestone trail is consistent with a company moving from fork to rewrite to commercialization. The New Stack and the company\u2019s own materials describe an early SQLite fork, then a Rust rewrite to add MVCC, async I/O, replication, encryption, and browser/local support. In the public narrative, those product milestones are paired with customer stories such as Engine Labs, Adaptive, and Poke, which suggests the company is using product-led adoption as a growth engine rather than waiting for a classic enterprise sales motion to dominate.\n\nThe homepage also highlights BYOC, SOC 2 Type II, GDPR/HIPAA readiness, and per-database encryption, which indicates a deliberate push toward enterprise-grade deployment and compliance. Those claims do not by themselves prove broad enterprise penetration, but they do show the company is trying to reduce adoption friction for regulated or security-conscious buyers. In short, the milestone pattern is product-first, then cloud commercialization, then compliance hardening.",
      "claimRefs": [
        "CO005",
        "CO006",
        "CO007",
        "CO008"
      ],
      "tableRefs": [
        "TO002"
      ],
      "figureRefs": []
    },
    {
      "id": "overview-funding",
      "title": "Funding and disclosure gaps",
      "body": "The public funding picture is incomplete. Third-party market-data pages such as Caplight and community discussion suggest a seed-stage financing history and named investors, but the exact terms, valuation, and cap-table structure are not publicly disclosed in the fetched evidence. That means the company cannot be underwritten from primary financial disclosure alone, and any valuation judgment has to stay provisional.\n\nThis opacity is not unusual for a private infrastructure startup, but it does create a practical diligence consequence: the current report can support product and technical conviction, yet it cannot support precise financial modeling. The right interpretation is that Turso is likely beyond stealth, but still early enough that public financial disclosure is thin and third-party databases remain the main source for capital structure clues.",
      "claimRefs": [
        "CO009",
        "CO010",
        "CO011",
        "CO012"
      ],
      "tableRefs": [
        "TO003"
      ],
      "figureRefs": []
    }
