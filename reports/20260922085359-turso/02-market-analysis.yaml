  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Turso is competing in a narrow but growing market for isolated, low-latency databases that fit AI agents, edge apps, and many-tenant products. The evidence suggests the market is real and differentiated, but sizing remains evidence-constrained, so this chapter focuses on buyer segments, adoption drivers, and the limits of broad TAM claims."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Where the market begins and ends",
      "body": "Turso's own messaging and the independent coverage around it point to a market boundary that is narrower than \u201cdatabases\u201d in general. The company is selling a database architecture for many small, isolated databases: per-user, per-agent, per-tenant, and per-application copies that can live locally and synchronize to the cloud. That means the market is not generic OLTP infrastructure, but a workload category where isolation, low latency, and operational simplicity matter more than raw relational breadth. The market is also adjacent to edge compute, offline-first apps, and managed SQLite tooling rather than only to traditional cloud relational databases.\n\nThe boundary matters because it changes substitution. A team choosing Turso is not only comparing it to PostgreSQL or MySQL; it is also comparing against vanilla SQLite, cache + API designs, Cloudflare D1-style edge SQL, and the do-it-yourself path of building replication around a file-backed database. That makes the real market a hybrid of developer tooling, cloud infrastructure, and distributed state management.",
      "claimRefs": [
        "CM001",
        "CM002",
        "CM003",
        "CM004"
      ],
      "tableRefs": [
        "TM001"
      ],
      "figureRefs": [
        "FM001"
      ]
    },
    {
      "id": "market-drivers",
      "title": "Adoption drivers and constraints",
      "body": "The strongest demand drivers are the same ones repeated across the official homepage, partner messaging, and independent writeups: AI agents need isolated workspaces, consumer apps need privacy boundaries, multi-tenant platforms need hard customer separation, and global apps need low-latency reads. Those needs translate into concrete buying criteria: how fast a database can be created, whether it can run close to the user, whether it can stay in sync, and whether the team can avoid running a separate cache and database stack.\n\nThe constraint set is just as important. Turso and outside commentary both acknowledge that write-heavy workloads, generic non-SQL use cases, and broad database replacement are not its sweet spot. The market therefore rewards a clear product fit statement: use Turso when isolation, SQLite compatibility, and replication simplicity are worth more than the flexibility of a fully general purpose database.",
      "claimRefs": [
        "CM005",
        "CM006",
        "CM007",
        "CM008"
      ],
      "tableRefs": [
        "TM002"
      ],
      "figureRefs": []
    },
    {
      "id": "market-sizing",
      "title": "Sizing lens and diligence gaps",
      "body": "The available evidence supports a market opportunity, but not a precise single-number TAM. The right sizing lens is a stack of overlapping segments: edge databases, managed SQLite, AI-agent infrastructure, and multi-tenant SaaS with strict data boundaries. Those lenses overlap but are not identical, so any broad market estimate should be treated as directional rather than definitive.\n\nFor diligence, the important question is not whether the total database market is huge; it is whether enough teams need the specific combination Turso offers to support durable pricing power. The public evidence supports that thesis at the workflow level, but not yet at the scale of a fully underwritten category leader.",
      "claimRefs": [
        "CM009",
        "CM010",
        "CM011",
        "CM012"
      ],
      "tableRefs": [
        "TM003"
      ],
      "figureRefs": []
    }
  ],
