  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Turso has enough named customer evidence to show real adoption, but not enough public disclosure to quantify retention or concentration precisely. The strongest signal is not a single large logo; it is a repeated pattern of developer-first, AI-native, and multi-tenant use cases that fit the product architecture."
  },
  "sections": [
    {
      "id": "cust-segmentation",
      "title": "Who uses Turso",
      "body": "The customer evidence clusters around a few clear segments: AI agent builders, product teams that want per-user or per-tenant isolation, and developers who need a low-friction SQLite-compatible database that can move between local and cloud environments. The homepage customer stories reinforce that pattern by showing a database-per-entity model rather than a generic enterprise storage pitch.\n\nThat segmentation matters because it explains why Turso can look small in a top-line software sense while still being highly relevant to a specific set of buyers. The public evidence does not point to mass-market consumer adoption; it points to developer-led adoption in technically demanding workflows where isolation and sync are more valuable than raw feature breadth.",
      "claimRefs": [
        "CU001",
        "CU002",
        "CU003",
        "CU004"
      ],
      "tableRefs": [
        "TU001"
      ],
      "figureRefs": [
        "FU001"
      ]
    },
    {
      "id": "cust-proof",
      "title": "Named proof of adoption",
      "body": "The homepage and adjacent customer stories provide the best public proof: Engine Labs, Adaptive, and Poke are concrete examples, and the AWS blog shows Turso being used in a more infrastructure-heavy setting. The Fly.io customer page adds another independent view that Turso can be operationalized at scale in a managed environment. None of these sources gives full retention or revenue detail, but together they show that the product is not merely a demo.\n\nThe customer proof is strongest where the use case is easy to describe: isolated databases, local-first workflows, and AI-native state management. That is a healthy sign for a developer product, because reference quality matters almost as much as logo count. It also means the company is still early enough that a handful of narrative-heavy references can materially influence the public perception of traction.",
      "claimRefs": [
        "CU005",
        "CU006",
        "CU007",
        "CU008"
      ],
      "tableRefs": [
        "TU002"
      ]
    },
    {
      "id": "cust-durability",
      "title": "Durability, expansion, and gaps",
      "body": "Durability is the biggest missing public metric. The evidence does show expansion potential: if each agent, tenant, or version gets its own database, usage can scale very quickly even before a classic enterprise renewal cycle fully develops. That helps explain why the homepage can credibly talk about millions of databases. But the same dynamic also means the company has to prove that those databases stay sticky and cost-effective over time.\n\nWhat is not public is just as important. There is no open NRR, no published churn, and no disclosed concentration list. So the right diligence reading is that customer adoption appears real and differentiated, but the durability of that adoption remains partly hidden behind the company\u2019s public story.",
      "claimRefs": [
        "CU009",
        "CU010",
        "CU011",
        "CU012"
      ],
      "tableRefs": [
        "TU003"
      ]
    }
  ],
