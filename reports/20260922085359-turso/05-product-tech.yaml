  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Turso\u2019s product story is straightforward but ambitious: make SQLite behave like a modern distributed database without losing the developer ergonomics that made SQLite popular. The fetched evidence supports that story with enough detail to judge maturity, dependencies, and the main technical risks."
  },
  "sections": [
    {
      "id": "pt-product",
      "title": "What Turso delivers",
      "body": "Turso is not trying to be a generic cloud database first; it is trying to make SQLite work in modern production workflows. The public evidence describes a Rust rewrite, libSQL compatibility, embedded replication, sync between local and cloud copies, and a managed cloud layer that can support per-database deployment. That combination means the product sits at the intersection of developer tooling, distributed systems, and data infrastructure.\n\nThe architecture matters because it is designed to keep the SQLite mental model while adding the missing features needed for AI agents, edge apps, and multi-tenant products. In practice, that means customers can start locally, move to the cloud, and preserve the same surface area. The product is therefore judged less on novelty and more on whether it can keep compatibility while adding enough new power to justify the rewrite.",
      "claimRefs": [
        "CE001",
        "CE002",
        "CE003",
        "CE004"
      ],
      "tableRefs": [
        "TE001"
      ],
      "figureRefs": [
        "FE001"
      ]
    },
    {
      "id": "pt-architecture",
      "title": "How the system works",
      "body": "The technical stack is built around a data plane/control plane split, async I/O, MVCC, and stateless cloud operations. The fetch set also points to native encryption, CDC, vector search, live materialized views, and browser or local execution paths as part of the broader rewrite. These are not all fully mature features, but they show a coherent engineering direction rather than a random list of add-ons.\n\nThe most important operational idea is that the product wants to make the database file itself portable while keeping the cloud orchestration around it simplified. That allows the company to sell local-first behavior, cloud sync, and sovereign deployment from a single architecture story. The upside is clarity; the downside is that every feature gap in the rewrite becomes highly visible because the product promise is so specific.",
      "claimRefs": [
        "CE005",
        "CE006",
        "CE007",
        "CE008"
      ],
      "tableRefs": [
        "TE002"
      ]
    },
    {
      "id": "pt-trust",
      "title": "Maturity, trust, and roadmap",
      "body": "The roadmap evidence shows a young but moving codebase. The company has shipping releases, open-source clients, and a visible blog trail that keeps pushing the rewrite forward. At the same time, the rewrite still has incomplete feature coverage versus SQLite, and the cloud story depends on careful reliability and security work. That is why the product narrative includes SOC 2, encryption, BYOC, and operational simplicity so prominently: Turso is trying to make trust part of the product itself.\n\nFrom a diligence perspective, this is enough to see credible engineering momentum, but not enough to assume the rewrite risk is gone. The right question is whether the current architecture is stable enough to scale adoption while the missing pieces are still being filled in. The public evidence says \u201cpromising,\u201d not \u201cfinished.\u201d",
      "claimRefs": [
        "CE009",
        "CE010",
        "CE011",
        "CE012"
      ],
      "tableRefs": [
        "TE003"
      ]
    }
  ],
