              - CR002
              - CR005
              - CR009
      - number: '7.2'
        title: 伙伴、客户与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Turso 还承担合作伙伴和竞争风险。它依赖基础设施伙伴和云原语；竞争集合又足够宽，客户常常可以选择另一类数据库，或走 DIY SQLite
              路线。因此，产品不只要赢在功能，还要赢在信任、分发，以及比替代方案更轻的工作流。


              公开证据显示，公司正用伙伴计划、BYOC 和清晰用例话术来应对。这些缓释动作合理，但不能消除一个风险：市场可能认为 Turso
              只是「足够好」，而不是不可或缺。基于这个原因，护城河应被视为行为和工作流驱动，而不是硬技术锁定。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
