              - CR008
      - number: '7.3'
        title: 杀手条件与缓释因素
        blocks:
          - type: paragraph
            body: >-
              财务和声誉风险是最后两大类别。公司仍早，公开收入和留存指标不可见，说明业务可能比产品故事看起来更脆弱。在下行情景里，再发生一次事故，或重写进度慢于预期，都可能让市场质疑这套架构是否复杂到难以支持广泛采用。


              缓释信号明显，但尚未决定性：SOC 2 话术、加密工作、Clerk
              迁移、伙伴计划和公开工程更新。方向是对的，但应把它们视为仍在推进的缓释，而不是风险已经消失的证明。实际投资问题在于，团队能否持续缩小野心与运营可靠性之间的距离。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
