              - CE009
      - number: '5.2'
        title: 系统如何工作
        blocks:
          - type: paragraph
            body: >-
              技术栈围绕数据平面 / 控制平面拆分、异步 I/O、MVCC
              和无状态云操作构建。抓取材料还显示，原生加密、CDC、向量搜索、实时物化视图，以及浏览器或本地执行路径，都是这次更大范围重写的一部分。它们不一定都已完全成熟，但共同指向一条连贯的工程方向，而不是随机堆功能。


              最重要的运营理念，是让数据库文件本身可移植，同时简化围绕它的云编排。这样，公司就能用单一架构故事销售本地优先行为、云同步和主权部署。好处是叙事清晰；代价是，由于产品承诺非常具体，重写中的每个功能缺口都会格外显眼。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE008
      - number: '5.3'
        title: 成熟度、信任与路线图
        blocks:
          - type: paragraph
            body: >-
              路线图证据显示，代码库还年轻，但在持续推进。公司有发布节奏、开源客户端和可见的博客轨迹，持续推动重写向前。同时，相比
              SQLite，重写仍有不完整的功能覆盖；云故事也依赖细致的可靠性和安全工作。这正是产品叙事里突出 SOC 2、加密、BYOC 和运维简单性的原因：Turso 试图把信任本身做进产品。


              从尽调角度，这足以看到可信的工程动能，但不足以假定重写风险已经消失。真正问题是，在缺失组件仍在补齐时，当前架构是否已经稳定到足以扩大采用。公开证据给出的答案是「有希望」，不是「已完成」。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
