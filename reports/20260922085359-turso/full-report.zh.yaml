  - id: TV001
    title: 建议摘要表
    columns:
      - 项目
      - 解读
      - 含义
      - 决策影响
    rows:
      - - 建议
        - 继续研究
        - 公开证据不足以支撑价格
        - 不要按激进假设定价
      - - 信心
        - 低 / 中
        - 财务披露很薄
        - 谨慎使用
      - - 风险评级
        - 高
        - 重写与信任风险仍在
        - 要求安全边际
      - - 估值立场
        - 未知 / 目前尚无法支撑
        - 没有清晰公开定价锚
        - 等待更多披露
      - - 决策
        - 跟踪，不买入
        - 产品质量真实，但价格不清
        - 披露改善前持续跟踪
    notes: 建议表有意保持保守，反映公开收入和估值披露缺位。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
      - 方向
    rows:
      - - 正向论点
        - 多数据库架构 + 客户证明
        - 更多客户 / 使用披露
        - 正向
      - - 正向论点
        - 重写带来真实差异化功能
        - 重写停滞或兼容性缺口扩大
        - 正向
      - - 反向论点
        - 公开财务不透明
        - 收入 / ARR 披露
        - 解决前为负向
      - - 反向论点
        - 估值页面信号弱且彼此不一致
        - 一级融资披露
        - 解决前为负向
      - - 反向论点
        - 竞争面仍宽
        - 清晰基准优势
        - 解决前为负向
    notes: 本表用于凸显核心投资论点，不是强行拼出伪精确的估值模型。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值逻辑
      - 风险触发因素
    rows:
      - - 乐观
        - 重写落地；采用加速；企业转化改善
        - 产品驱动的基础设施增长带来倍数扩张
        - 再次发生重大事件，或重写停滞
      - - 基准
        - 产品好、采用稳，但公开财务清晰度有限
        - 按增长可选性给中等倍数
        - 收入仍不披露
      - - 悲观
        - 技术复杂度或竞争拖慢采用
        - 倍数压缩 / 信心下降
        - 客户证明变弱或信任下滑
      - - 上行可选性
        - AI agent / 多数据库需求增长
        - 品类扩张带来上行
        - 市场仍停留在小众
      - - 投资测算
        - 形成价格信念前，需要更多披露
        - 跟踪而非买入
        - 一手数据始终不到位
    notes: 情景区间只能定性，因为当前证据不足以支撑精确估值模型。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV009
      - CV010
      - CV011
      - CV012
