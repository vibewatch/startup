chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >-
              Turso 把自己定义为「数百万个数据库」的架构，而不是单一共享数据库层。官网强调按用户、智能体和租户拆分数据库，支持嵌入式复制，并在开源引擎之外提供托管的 Turso
              Cloud。这种定位很关键：它把公司界定为服务隔离型工作负载的基础设施，而不是泛数据库品牌。现有证据一直将产品描述为兼容 SQLite，并面向本地优先和云端同步应用设计；这让一家私营创业公司的身份异常具体。


              The New Stack 的报道补上了创始人视角：Glauber Costa 和 Pekka Enberg 于 2021 年创办公司，libSQL 承担托管数据平面，Turso 则是云 / 服务层。GitHub
              和社区报道也强化了同一图景：Turso 是基于 Rust 的 SQLite 重写，目标是在保持兼容的同时加入现代分布式能力。产品边界、架构和开发者受众叠加，让公司拥有非常清晰的市场叙事，而不是宽泛的平台故事。
