  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一种混合模式：Turso 提供开源引擎和托管云服务，商业价值主要由云层承载。官网和开发者报道显示，公司试图变现的是便利性、复制、BYOC 和合规，而不是兼容 SQLite
              的基础运行时本身。这是基础设施公司常见路径，但抓取证据并未完全展示确切定价和套餐组合。


              对尽调来说，重点在于，即便没有公开财务，变现故事也说得通。如果开发者先采用开源层，云服务之后可以围绕用量、便利性和企业控制来收费。这带来上行空间，但也意味着，由于公司披露不足，当前报告必须谨慎对待公开定价假设，不能从第一性原理判断收入质量。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
