  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界在哪里
        blocks:
          - type: paragraph
            body: >-
              Turso 自身话术和围绕它的独立报道都指向一个比泛泛「数据库」更窄的市场边界。公司销售的是一种面向大量小型隔离数据库的架构：按用户、智能体、租户和应用拆分的副本可以留在本地，也可以同步到云端。因此，市场不是通用
              OLTP 基础设施，而是一类工作负载：隔离、低延迟和运维简单性比关系型能力的广度更重要。这个市场也毗邻边缘计算、离线优先应用和托管 SQLite 工具，而不只是传统云关系型数据库。


              边界之所以重要，是因为替代品会随之改变。选择 Turso 的团队不只是在拿它对比 PostgreSQL 或 MySQL；它还会对比原生 SQLite、缓存 + API 设计、Cloudflare D1 式边缘
              SQL，以及围绕文件型数据库自建复制的 DIY 路线。真正的市场因此混合了开发者工具、云基础设施和分布式状态管理。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
