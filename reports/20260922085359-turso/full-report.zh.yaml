      - number: '2.3'
        title: 规模测算视角与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              现有证据支持市场机会，但不支持一个精确的单一 TAM 数字。更合适的测算视角，是把几个重叠细分叠起来看：边缘数据库、托管 SQLite、AI 智能体基础设施，以及有严格数据边界的多租户
              SaaS。这些视角彼此重叠，但并不相同，因此任何宽口径市场估算都应被视为方向性，而非定论。


              尽调的关键问题，不是整个数据库市场是否庞大；而是是否有足够多团队需要 Turso 提供的特定组合，足以支撑持久定价权。公开证据在工作流层面支持这个判断，但还没到能按成熟品类龙头来严肃定价的程度。
