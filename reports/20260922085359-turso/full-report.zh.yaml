      - number: '6.3'
        title: 耐久度、扩张与缺口
        blocks:
          - type: paragraph
            body: >-
              耐久度是公开指标中最大的缺口。证据确实显示扩张潜力：如果每个智能体、租户或版本都有自己的数据库，用量可以在典型企业续约周期完全成形之前快速放大。这也解释了官网为什么能有底气谈「数百万个数据库」。但同一动态也要求公司证明，这些数据库长期仍有黏性且成本有效。


              同样重要的是未公开内容。没有公开 NRR，没有已发布的流失率，也没有披露的客户集中度名单。因此，正确的尽调解读是，客户采用看起来真实且有差异化，但采用的耐久度仍部分藏在公司的公开故事之后。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
