              - CV008
              - CV011
              - CV012
      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              融资背景显示，Turso 仍是一家由风投支持的种子阶段公司，但公开市场没有给出干净估值锚。Caplight、Notice 和 CB Insights
              都提供了融资、投资方和私募市场兴趣中的部分信号。问题在于，这些信号并不完全对齐，抓取页面里也没有公司一手声明。


              用于投资判断时，公开证据能支持期权价值，不能支持确定性。Turso
              可能已经积累足够技术和产品动能，具备价值，但估值锚仍在移动。实操上，纪律严明的投资者会先等待更清晰的财务披露，或更强独立基准，再把公司视为定价合理。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >-
              合理情景组应把 Turso
              看成一个有塑造品类潜力的产品，但如果市场保持狭窄，或重写耗时超预期，它仍可能在财务上低于预期。乐观情景是开发者强采用并转化为企业客户；基准情景是好产品稳步增长，但公开定价杠杆不清晰；悲观情景是产品技术上有趣，却因为估值和收入继续不透明而难以下投资结论。


              这足以形成建议，但不足以下硬买入结论。基于公开数据，最佳立场是保持投资逻辑活跃，同时等待更好的财务证据。换句话说，Turso 像一个需要跟踪的标的，而不是当前定价机会。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
