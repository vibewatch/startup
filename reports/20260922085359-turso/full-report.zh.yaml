companyProfile:
  summary: >-
    Turso 是一家私营开发者基础设施公司，围绕本地优先、边缘、多租户和智能体导向工作负载，构建兼容 SQLite 的分布式数据库和托管云层。公司把自己定位为用 Rust / libSQL 重写
    SQLite；产品和客户证据显示它确有技术差异化，但公开财务披露仍然很薄，估值置信度偏低。
