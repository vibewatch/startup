  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Turso 提供什么
        blocks:
          - type: paragraph
            body: >-
              Turso 首先不是想做通用云数据库；它想让 SQLite 进入现代生产工作流。公开证据描述了 Rust 重写、libSQL
              兼容性、嵌入式复制、本地副本与云端副本同步，以及可支持按数据库部署的托管云层。这个组合让产品站在开发者工具、分布式系统和数据基础设施的交叉口。


              架构很重要，因为它试图保留 SQLite 心智模型，同时补上 AI
              智能体、边缘应用和多租户产品所需的能力。实际效果是，客户可以从本地开始，迁移到云端，并保留同一套接口面。因此，产品更少按新奇度来评判，更多看它能否在保持兼容性的同时增加足够新能力，从而证明重写值得。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE005
