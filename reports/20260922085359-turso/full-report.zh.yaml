      - number: '3.2'
        title: Turso 的差异在哪里
        blocks:
          - type: paragraph
            body: >-
              最强差异点，是 SQLite 兼容性、嵌入式复制，以及能呈现「每个实体一个数据库」模型的托管云组合。文档和开发者报道清楚表明，Turso 不是想变成通用关系型平台；它是在让 SQLite
              表现得像现代分布式系统，同时不迫使开发者放弃 SQLite 工具链。这个承诺更窄，但也更清楚。


              公司还受益于 libSQL
              周围的开源表面积，同时通过云层和控制平面变现。如果工作流足够黏，这种拆分可以形成护城河；但如果竞争对手能补齐同步路径和开发者体验，它也可能被复制。因此，决定性比较不只是功能是否存在，而是客户为了获得收益究竟需要采用多少技术栈。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 护城河耐久度与替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河风险很直接：如果客户能把 SQLite、缓存和少量同步基础设施组合起来，近似得到同样结果，定价权就会变弱。社区争论和独立指南说明，Turso
              必须持续证明一体化方案比拼装替代品更简单、更安全。公开证据不显示这是赢家通吃市场；它更像一个多条工具路径都能成立的品类，胜者会是那个把目标工作负载的运维负担降到最低的方案。


              因此，分发和信任与技术同样重要。公司需要证明，它不是又一个营销层更漂亮的数据库，而是面向特定应用类别、摩擦显著更低的架构。如果工作流成为开发者习惯，Turso
              就能守住位置；否则，竞争集合会持续把客户拉回熟悉默认选项。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
