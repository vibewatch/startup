      - number: '2.2'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动，在官网、伙伴话术和独立文章里反复出现：AI
              智能体需要隔离工作区，消费应用需要隐私边界，多租户平台需要严格客户隔离，全球应用需要低延迟读取。这些需求会转化为具体采购标准：数据库创建有多快，能否贴近用户运行，能否保持同步，以及团队能否少维护一套独立的缓存和数据库栈。


              约束同样重要。Turso 和外部评论都承认，写入密集型工作负载、通用非 SQL 场景和广义数据库替换并不是它的甜蜜点。因此，市场会奖励清晰的产品适配表述：当隔离、SQLite
              兼容性和复制简单性比全能数据库的灵活性更值钱时，才使用 Turso。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
