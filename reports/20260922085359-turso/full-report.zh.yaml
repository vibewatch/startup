  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合
        blocks:
          - type: paragraph
            body: >-
              竞争集合比「其他数据库创业公司」更宽。直接同类包括托管边缘 SQL 产品、托管 SQLite 产品，以及新一波应用数据库，它们都承诺低延迟访问且运维负担很轻。Turso 还要和现状竞争：普通 SQLite
              加自定义复制、带缓存的 Postgres 技术栈，或自研同步层。因此，公司既在拼产品功能，也在拼运维简单性。


              独立报道和社区讨论一再把 Turso 描述为 SQLite 重写，而不是普通云数据库。这有助于差异化，但也意味着公司必须证明兼容性、可靠性，以及没有隐藏复杂度。如果客户相信原生 SQLite
              或标准云数据库已经「足够好」，Turso 就必须靠开发者体验和规模经济取胜，而不只是功能清单。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
