      - number: '1.2'
        title: 里程碑与运营姿态
        blocks:
          - type: paragraph
            body: >-
              可见里程碑显示，公司从分叉走向重写，再走向商业化。The New Stack 和公司自有材料描述了早期 SQLite 分叉，随后用 Rust 重写，以加入 MVCC、异步 I/O、复制、加密和浏览器 /
              本地支持。在公开叙事里，这些产品里程碑又与 Engine Labs、Adaptive、Poke 等客户故事并列，说明公司更像是在用产品驱动采用，而不是等待典型企业销售动作成为主导。


              官网还突出 BYOC、SOC 2 Type II、GDPR/HIPAA
              就绪和按数据库加密，显示公司有意推向企业级部署和合规。单靠这些表述不能证明企业渗透已经很广，但能看出公司在降低受监管或重视安全买家的采用摩擦。简言之，里程碑路径是先产品、再云端商业化、再加固合规。
