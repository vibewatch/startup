              因此，牵引力证据是间接的。公司显然有面向客户的产品动能、开源采用和足以引发分析师覆盖的市场兴趣，但抓取证据中没有公开 ARR、收入运行率或详细客户数量。站在投资判断角度，业务已有生命迹象，但经营指标大体仍不透明。
