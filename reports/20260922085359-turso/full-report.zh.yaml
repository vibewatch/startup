      - number: '6.2'
        title: 具名采用证明
        blocks:
          - type: paragraph
            body: >-
              官网和相邻客户故事提供了最佳公开证明：Engine Labs、Adaptive 和 Poke 是具体案例，AWS 博客显示 Turso 被用于更偏基础设施的场景。Fly.io 客户页面又提供了另一个独立视角，说明
              Turso 可以在托管环境中规模化运营。这些来源都没有给出完整留存或收入细节，但合在一起显示，产品不只是演示。


              客户证明最强的地方，是用例容易讲清楚：隔离数据库、本地优先工作流和 AI
              原生状态管理。这对开发者产品是健康信号，因为引用质量几乎和客户标识数量一样重要。也意味着公司仍处早期，少数叙事浓度高的客户引用就能明显影响外界对牵引力的感知。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
