            body: >-
              公开融资图景并不完整。Caplight
              等第三方市场数据页面和社区讨论显示，公司有种子轮融资历史和具名投资方，但抓取证据没有公开确切条款、估值和股权结构表。也就是说，不能仅靠一手财务披露给公司定价，任何估值判断都必须保持暂定。


              这种不透明对私营基础设施创业公司并不罕见，但会带来现实尽调后果：本报告可以支持产品和技术判断，却无法支撑精确财务建模。更合理的解读是，Turso
              可能已经走出隐身状态，但仍早到公开财务披露很薄，资本结构线索主要还要看第三方数据库。
