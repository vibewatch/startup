  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 谁在使用 Turso
        blocks:
          - type: paragraph
            body: >-
              客户证据集中在几个清晰细分：AI 智能体构建者、希望按用户或租户隔离的产品团队，以及需要低摩擦、兼容
              SQLite、能在本地和云环境间迁移的数据库的开发者。官网客户故事通过展示「每个实体一个数据库」模型，而非泛泛企业存储销售话术，强化了这一模式。


              这个分层很重要，因为它解释了为什么 Turso
              从顶线软件市场看可能不大，却对特定买家群高度相关。公开证据没有指向大众消费级采用；它指向开发者主导的采用，场景是技术要求高的工作流，其中隔离和同步比功能广度更有价值。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
