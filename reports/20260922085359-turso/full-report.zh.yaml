  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观逻辑很直接：Turso 所处的工作负载类别真实且在增长，隔离数据库、本地优先工作流和 AI
              智能体状态管理的重要性很可能随时间上升。产品连贯，客户故事真实，重写叙事显示出有意义的技术野心。如果公司能持续缩小重写缺口，市场可能用高黏性的开发者采用和更高企业价值来奖励它。


              反向逻辑同样清楚。公开记录没有披露足够收入、定价或留存细节，无法支撑精确估值观点。第三方市场数据页面存在，但信号弱且彼此不一致。这意味着业务可以是好的，但价格仍不可知。在尽调备忘录里，这应把答案推向耐心，而不是伪精确。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: figure
            figureRef: FV001
            claimRefs:
