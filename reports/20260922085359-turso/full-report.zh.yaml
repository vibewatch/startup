  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              最清楚的风险，是产品技术野心很大。重写要求兼容性、同步、复制和云编排一起工作；公开证据显示，公司仍在完成架构的一部分。这会带来普通基础设施风险：错误、边缘案例和运维复杂性。事故复盘把这一点具体化：备份和配置错误可能同时造成数据丢失和数据泄露。


              好消息是，公司看起来并没有忽视风险。它在持续讨论加密、认证迁移、BYOC 和无状态云设计，说明团队正在把一个脆弱架构变得更有韧性。但尽调备忘录仍应假设：架构越有野心，单点失败就越重要。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
