  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Turso\u2019s risk profile is typical of a fast-moving infrastructure company: the product is compelling, but the operational, trust, and competitive risks are real. The most important conclusion is that the company has already experienced an incident and still depends on a technically ambitious rewrite, so diligence should focus on repeatability and mitigation maturity."
  },
  "sections": [
    {
      "id": "risk-ops",
      "title": "Operational and technical risks",
      "body": "The clearest risk is that the product is technically ambitious. The rewrite depends on compatibility, sync, replication, and cloud orchestration all working together, and the public evidence shows that the company is still finishing parts of the architecture. That creates ordinary infrastructure risk: bugs, edge cases, and operational complexity. The incident post makes that concrete by showing that mistakes in backup and configuration can cause both data loss and data leak issues.\n\nThe good news is that the company does not appear blind to the risk. It is writing about encryption, auth migration, BYOC, and stateless cloud design, which suggests the team is actively trying to turn a fragile architecture into a resilient one. But a diligence memo should still assume that the more ambitious the architecture, the more one-off failures matter.",
      "claimRefs": [
        "CR001",
        "CR002",
        "CR003",
        "CR004"
      ],
      "tableRefs": [
        "TR001"
      ],
      "figureRefs": [
        "FR001"
      ]
    },
    {
      "id": "risk-business",
      "title": "Partner, customer, and competitive risk",
      "body": "Turso also carries partner and competitive risk. It relies on infrastructure partners and cloud primitives, and the competitive set is broad enough that a customer can often pick a different database family or a DIY SQLite path. That means the product must win not just on features but on trust, distribution, and a workflow that feels less burdensome than the alternatives.\n\nThe public evidence suggests the company is addressing this with partner programs, BYOC, and clear use-case messaging. Those are sensible mitigations, but they do not eliminate the risk that the market decides Turso is \u201cgood enough\u201d rather than indispensable. For that reason, the moat should be treated as behavioral and workflow-based, not as a hard technical lock-in.",
      "claimRefs": [
        "CR005",
        "CR006",
        "CR007",
        "CR008"
      ],
      "tableRefs": [
        "TR002"
      ],
      "figureRefs": []
    },
    {
      "id": "risk-thesis",
      "title": "Kill criteria and mitigations",
      "body": "Financial and reputation risk remain the last major categories. The company is still early enough that public revenue and retention metrics are not visible, which means the business could be more fragile than the product story suggests. In a downside case, one more incident or a slower-than-expected rewrite could make the market question whether the architecture is too complex to support broad adoption.\n\nThe mitigating signs are obvious but not yet decisive: SOC 2 messaging, encryption work, Clerk migration, partner programs, and public engineering updates. Those are the right moves, but they should be treated as mitigation in progress, not as proof that the risks are gone. The practical investment question is whether the team can keep reducing the gap between ambition and operating reliability.",
      "claimRefs": [
        "CR009",
        "CR010",
        "CR011",
        "CR012"
      ],
      "tableRefs": [
        "TR003"
      ],
      "figureRefs": []
    }
  ],
