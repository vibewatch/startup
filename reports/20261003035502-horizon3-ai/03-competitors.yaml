callouts:
  - calloutType: "insight"
    title: "The Architectural Divide: Lateral Exploit Chains vs Business Logic Flaws"
    body: "Enterprise buyers face an architectural trade-off between inside-out infrastructure validation and outside-in application testing. NodeZero excels at discovering how an unauthenticated attacker chains credentials and misconfigurations across Active Directory and cloud infrastructure. Conversely, application-first rivals like Escape target flaws like Keycloak CVE-2026-17059 where an API endpoint exposes unauthorized data without lateral movement. Winning the unified exposure market requires bridging this divide."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP009"
  - calloutType: "risk"
    title: "Operational Friction Between Security Remediation and Developer Workflows"
    body: "NodeZero's prioritization model ranks remediation actions by attack path impact, aligning naturally with infrastructure and SecOps engineers. However, web application vulnerabilities route to software developers who need framework-specific code fixes rather than CVSS impact scores. If Horizon3.ai cannot bridge developer workflows, application security budgets will remain captured by specialized API and web testing vendors."
    claimRefs:
      - "CP010"
      - "CP011"
      - "CP012"
