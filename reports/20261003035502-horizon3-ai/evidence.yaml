evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited statements and operating schedules for absolute ARR, accounting revenue, gross margin, profitability, cash
      burn, cash available, runway, debt, and credit facilities.
    whyItMatters: >-
      Without denominators and accounting definitions, growth rates cannot support a revenue multiple,
      capital-efficiency assessment, or runway estimate.
    diligencePath: >-
      Request audited financial statements, monthly ARR bridges, bank and debt schedules, cash statements, and
      board-approved forecasts under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customers-and-headcount
    missingEvidence: >-
      Current employee count, direct-versus-partner customer denominator, average contract value, cohort retention, and
      top-customer or federal revenue concentration.
    whyItMatters: >-
      Customer logos and growth rates do not reveal contract quality, delivery leverage, personnel intensity, or
      concentration risk.
    diligencePath: >-
      Obtain HRIS headcount, customer master data, channel attribution, cohort analyses, and top-20 customer revenue
      schedules under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-and-investor-map
    missingEvidence: >-
      Complete capitalization table, security classes, ownership percentages, liquidation preferences, secondaries,
      board voting rights, vetoes, and observer rights.
    whyItMatters: Named investors do not establish economic ownership, control, preference-stack exposure, or founder dilution.
    diligencePath: >-
      Review the fully diluted cap table, charter, financing documents, investor-rights agreement, voting agreement, and
      board minutes.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent legal, regulatory, outage, breach, sanctions, and customer-complaint evidence beyond the assigned
      adverse query, which returned no allocated URLs.
    whyItMatters: >-
      The absence of an allocated adverse result does not prove the absence of incidents, disputes, enforcement, or
      customer harm.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, procurement, sanctions, outage, breach-notification, and
      customer-reference checks in legal diligence.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: market sizing and share verification
    missingEvidence: >-
      Audited segment-level revenue breakdown disaggregating direct enterprise ARR from wholesale MSSP partner
      licensing, along with third-party TAM validation.
    whyItMatters: >-
      Without segmented ARR data, estimating Horizon3.ai's exact market share within autonomous penetration testing
      versus adjacent exposure management remains speculative.
    diligencePath: >-
      Request audited revenue contribution by channel (direct vs. MSSP) and product line during management diligence
      sessions.
    relatedQuestionRefs:
      - QM010
  - type: private-evidence-only
    severity: material
    topic: competitor-head-to-head-win-rates
    missingEvidence: >-
      Audited win-loss rates and commercial displacement metrics between Horizon3.ai NodeZero, Pentera, and Escape
      across enterprise evaluations.
    whyItMatters: >-
      Without vendor-neutral win-loss data, customer churn to adjacent application-security tools versus
      network-validation tools cannot be independently verified.
    diligencePath: >-
      Request anonymized quarterly win-loss reports and customer migration case studies directly from Horizon3.ai sales
      leadership during management diligence.
    relatedQuestionRefs:
      - QP001
      - QP008
  - type: missing-source
    severity: material
    topic: webapp-beta-retention
    missingEvidence: >-
      Independent customer retention figures and false-positive benchmarks for the newly launched NodeZero WebApp
      Pentesting module.
    whyItMatters: >-
      Because the WebApp module was launched in July 2026, its commercial adoption, renewal rates, and technical
      efficacy relative to API-native tools remain unproven.
    diligencePath: >-
      Interview reference customers participating in the NodeZero WebApp Early Access cohort to verify vulnerability
      discovery rates on production web applications.
    relatedQuestionRefs:
      - QP004
      - QP006
  - type: private-evidence-only
    severity: material
    topic: pricing-and-revenue-quality
    missingEvidence: >-
      List pricing, billing units, executed contract values, discounts, contract duration, module mix, and
      ARR-to-GAAP-revenue reconciliation.
    whyItMatters: >-
      These inputs determine revenue quality, comparability, expansion economics, and the difference between contracted
      recurring value and recognized revenue.
    diligencePath: >-
      Review rate cards, a representative executed-contract sample, invoices, deferred revenue, and the monthly ARR
      bridge.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: cost-structure-and-unit-economics
    missingEvidence: >-
      Gross margin, compute and hosting costs, support and service-delivery costs, CAC, payback, retention, working
      capital, and capex.
    whyItMatters: >-
      Without these inputs, software operating leverage, sales efficiency, and the durability of the margin path cannot
      be underwritten.
    diligencePath: >-
      Obtain audited financial statements, product-level COGS, cohort retention, channel economics, and fully loaded
      sales-efficiency schedules.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: >-
      Current cash, net Series E proceeds, debt obligations, monthly operating burn, downside plan, and next-round
      trigger.
    whyItMatters: >-
      Funding raised cannot be converted into available cash or runway without uses, burn, debt, and working-capital
      requirements.
    diligencePath: >-
      Inspect bank balances, capitalization and debt schedules, monthly cash flow, board budget, and base and downside
      financing plans.
    relatedQuestionRefs:
      - QI008
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: architecture
    missingEvidence: >-
      Proprietary algorithm documentation detailing the machine-learning and decision-graph logic used by NodeZero to
      calculate attack paths.
    whyItMatters: >-
      Prevents independent validation of whether attack path traversal relies on heuristic decision trees versus
      generative or reinforcement learning models.
    diligencePath: >-
      Request engineering architecture whitepapers and technical deep-dive sessions under NDA with Horizon3.ai technical
      leads.
    relatedQuestionRefs:
      - QE001
      - QE004
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: benchmarks
    missingEvidence: >-
      Independent third-party benchmark evaluations comparing NodeZero's exploit success rate and false-negative rate
      against manual red-team assessments.
    whyItMatters: >-
      Without objective third-party head-to-head testing, claims of superior coverage over human red teams remain
      company-reported assertions.
    diligencePath: >-
      Inquire with joint enterprise customers or request anonymized third-party audit reports comparing consultant
      findings with NodeZero output.
    relatedQuestionRefs:
      - QE004
      - QE007
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Audited cohort Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and annual customer logo churn rates.
    whyItMatters: >-
      Without retention benchmarks, investors cannot determine whether headline customer growth reflects sustainable
      product durability or high mid-market churn masked by partner onboarding.
    diligencePath: >-
      Request customer renewal cohorts, historical NRR/GRR bridge tables, and logo churn splits by contract size from
      management during private diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
