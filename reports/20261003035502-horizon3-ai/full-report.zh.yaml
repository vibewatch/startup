      - number: '3.3'
        title: 应用层拓展、交付节奏与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              Horizon3.ai 的核心竞争护城河在于生产环境安全性——这已在 310,000 次测试和 7,200 个环境中得到验证，此外 FedRAMP High 认证也为联邦政府客户建立了极高的准入门槛。面对在每次
              CI/CD 提交时触发测试、以开发者为中心的竞品，Horizon3.ai 于 2026 年 7 月 29 日推出了 NodeZero WebApp Pentesting，并完成了投后估值 $2 billion 的
              $250 million Series E 轮融资。然而，来自竞品 Escape 的独立分析指出，NodeZero 主要是将 Web 应用作为基础设施攻击链的切入点，而非深入审计 API 原生规范、GraphQL
              逻辑或租户隔离边界。此外，NodeZero 的部署节奏基于周期性自主扫描，将基础设施修复步骤推送给安全运营人员，这与需要将特定技术栈代码补丁集成到构建流水线中的工程团队产生了协作摩擦。Horizon3.ai
              正在研发自动化蓝队智能体与欺骗诱捕机制，以此补齐短板。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
