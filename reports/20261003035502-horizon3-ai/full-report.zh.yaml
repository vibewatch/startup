      - number: '1.2'
        title: 领导层、创始人与治理结构
        blocks:
          - type: paragraph
            body: >-
              联合创始人兼 CEO Snehal Antani 是公司业务叙事与公开形象的核心支柱。官方团队页面显示，他曾任 JSOC 首席技术官、Splunk 首席技术官以及 GE Capital 首席信息官；NEA
              的公开表述与独立报道也印证了创始团队在国家安全和企业软件领域的深厚根基。Anthony Pillitiere
              为另一位联合创始人，目前职能团队已覆盖营收、营销、法务、人力、产品、客户及海外销售。官方页面同时记载，CFO Holly Grey 于 2026 年 6
              月去世；指定研究来源中均未指出继任人选，因此财务负责人的连续性属于当前尽调关注项，而非经营失败的指征。Series E 轮融资后，NightDragon 的 Dave DeWalt 与 Morgan Kyauk
              宣布加入董事会。至于投票权、董事会专门委员会构成、创始人持股比例及投资者保护性条款，在指定公开材料中均未披露。
