  - id: FV001
    title: Horizon3.ai 投资建议逻辑框架
    type: flow
    summary: 该决策路径串联起业务规模证据、联邦业务壁垒、估值倍数与尽调把关门槛，最终导向「继续研究」建议。
    data:
      nodes:
        - label: 运营验证：累计执行 310,000 次生产环境渗透测试且零中断，并获 FedRAMP High 认证
        - label: 规模与增长势头：覆盖 7,000 家企业客户，YoY 增长 120%，ARR 逼近 $100M
        - label: 估值溢价：$2.0B Series E 估值对应 20.0x-25.0x ARR，约为直接竞对 Pentera 的两倍
        - label: 信息不对称：净金额留存率明细未经验证、毛利率未披露、现金烧钱速度未经审计
        - label: 集中度敏感性：联邦合同与托管服务商渠道的收入占比未予量化
        - label: 投资建议：持「继续研究」立场，待经审计的单位经济模型与合同级尽调进一步核验
      edges:
        - from: >-
            Operational Validation: 310,000 production pentests executed with zero disruptions and FedRAMP High
            certification
          to: 'Scale & Growth Momentum: 120% YoY expansion approaching $100M ARR across 7,000 enterprise accounts'
        - from: 'Scale & Growth Momentum: 120% YoY expansion approaching $100M ARR across 7,000 enterprise accounts'
          to: 'Valuation Premium: $2.0B Series E commands 20.0x-25.0x ARR, roughly double direct competitor Pentera'
        - from: 'Valuation Premium: $2.0B Series E commands 20.0x-25.0x ARR, roughly double direct competitor Pentera'
          to: >-
            Information Asymmetry: Unverified net dollar retention schedules, undisclosed gross margins, and unaudited
            cash burn
        - from: >-
            Information Asymmetry: Unverified net dollar retention schedules, undisclosed gross margins, and unaudited
            cash burn
          to: >-
            Concentration Sensitivity: Unquantified revenue share from federal contracts and managed service provider
            channels
        - from: >-
            Concentration Sensitivity: Unquantified revenue share from federal contracts and managed service provider
            channels
          to: 'Investment Recommendation: Research-More stance pending audited unit economics and contract-level diligence'
    approximationNotes: 该流程结构将定性证据综合映射至定量估值倍数敏感性与最终投资判断。
    claimRefs:
      - CV002
      - CV004
      - CV006
