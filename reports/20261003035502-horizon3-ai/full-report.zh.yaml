  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、所涉支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              自主渗透测试市场已成为更广泛的网络安全暴露面管理中的主动验证层。过去，企业主要依赖每年或半年度一次的人工红队实战，配合 Tenable、Qualys 或 Rapid7
              等自动化漏洞扫描器。但扫描器会产生大量理论层面的 CVE 告警，无法证实漏洞的可利用性或实际可达性；人工咨询服务则受限于单点抽样、人才短缺以及静态 PDF
              报告交付。自主渗透测试直接在生产环境中执行多跳攻击路径，用真实可达性验证与修复复测替代了传统的周期性抽样。Horizon3.ai 的 NodeZero 平台主打对企业网络、Active Directory
              身份架构、内部基础设施和云环境的持续测试，并于 2026 年 7 月新增了 Web 应用渗透测试。传统咨询类渗透测试与扫描器采购预算，正是自主渗透测试初期获取合同的主要资金池。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模测算视角：TAM、SAM 与可服务机遇
        blocks:
          - type: paragraph
            body: >-
              评估 Horizon3.ai
              的市场空间，需要将宽泛的网络安全宏观预测拆解为具备实操支撑的业务边界。宏观行业分析与企业安全支出报告将安全评估、渗透测试与持续暴露面管理的潜在市场空间界定在数百亿美元规模。在这一盘子中，可服务市场（SAM）主要集中在运行复杂混合云、Active
              Directory 及分布式 IT 架构，且面临 FedRAMP、DORA、NIS 2 和 PCI-DSS 4.0
              等严苛合规监管的大型企业与中端市场机构。典型的中端市场机构每年仅采购两次单点人工渗透测试服务，支出在 $40,000 至 $150,000
              之间。覆盖全攻击面并提供持续验证的软件订阅模式，不仅吃掉了原属于人工咨询的这部分预算，还借助高毛利的 MSSP 渠道分销与企业级分层定价推高了年度合同价值。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 买方画像细分、预算归属与落地阻力
        blocks:
          - type: paragraph
            body: >-
              自主渗透测试的推广落地受制于不同买方的诉求、采购路径及组织约束。企业直销采购主要由首席信息安全官（CISO）、安全运营总监和合规负责人主导，旨在消除告警疲劳、验证防御控制手段的实际效果，并满足持续测试的合规要求。与此同时，托管安全服务商（MSSP）是
              Horizon3.ai 增长最快的业务板块，服务了大约 70% 的客户账户。MSSP 将 NodeZero
              作为底层引擎，无需扩充稀缺的进攻性安全人员，即可交付持续评估、修复建议与威胁猎捕服务。核心落地阻力包括对线上生产环境主动测试的安全性顾虑、对敏感运营技术（OT）或工控系统的避让，以及网络/身份基础设施团队与应用优先的软件工程团队之间截然不同的采购诉求。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 图表分析
        blocks:
          - type: callout
            title: 渠道杠杆与两类买方的诉求断层
            body: >-
              Horizon3.ai 的市场扩张依赖双轮驱动策略：一方面借助 MSSP 吃掉国际与商业市场中约 70% 的客群，另一方面从底层基础设施向 Web
              应用延伸。然而，应用安全与网络基础设施的买方画像存在本质差异。网络防御人员看重阻断 Active Directory 和云主机上的多跳攻击路径，而由工程团队主导的 AppSec 买方则需要适配开发流程的
              CI/CD 修复方案、API 业务逻辑测试以及构建期深度集成。
            calloutType: insight
            claimRefs:
              - CM010
              - CM013
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与技术架构边界
        blocks:
          - type: paragraph
            body: >-
              攻防安全验证的竞争格局在技术架构上呈现分野：一类是由内而外的基础设施攻击链串联，另一类是由外而内的应用层安全测试。Horizon3.ai 依托 NodeZero
              平台奠定了自身市场地位，该平台能在内网、Active
              Directory、云环境及身份体系中，以无需凭证的方式在生产安全边界内自主执行攻击链。这种方案能够验证攻击者获取初始据点后，是否能横向移动并渗透进企业核心基础设施。然而，Escape
              等竞品采取由外而内的测试路径，借助互联网暴露面测绘、单页应用与 API 扫描，在无需横向移动的情况下发现对象级别权限失效、多租户数据泄露以及业务逻辑缺陷。此外，竞争对手还包括主打无代理自动化安全验证的
              Pentera、按调用额度计费的自主 Web 漏洞利用工具 XBOW、结合人工与 AI 的渗透测试即服务平台 Cobalt，以及托管型智能体集群服务商 Terra。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 直接竞品画像与运营权衡
        blocks:
          - type: paragraph
            body: >-
              将 Horizon3.ai 与直接竞品及相邻方案对比，可以清晰看出运营模式、交付机制和目标客群的差异。Horizon3.ai 以自主软件订阅形式主打安全运营与基础设施安全团队；Cobalt
              则采用持证人工测试人员结合机器额度增效的模式；Terra 则是结合智能体集群与人工兜底的托管服务。在自动化 Web 应用测试领域，XBOW 针对周期性运行按单次渗透或额度消耗收费。在 PeerSpot
              等企业评价平台上，NodeZero 在渗透测试服务、失陷与攻击模拟及 AI 驱动渗透测试三个分类中均名列第一，在漏洞管理领域的市场心智占有率为 1.4%。与 Morphisec
              等终端防护厂商横向对比，凸显出买方的不同权衡：Morphisec 专注于确定性内存威胁防御，据报零误报；而 NodeZero 则侧重在全网资产上执行快速自动化进攻性漏洞利用。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
