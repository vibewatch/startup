    title: 公司概况
    sections:
      - number: '1.1'
        title: 主体、产品与市场切入路径
        blocks:
          - type: paragraph
            body: >-
              Horizon3.ai 自述成立于 2019 年，总部设在旧金山。旗下 NodeZero
              平台能对线上生产环境自主发起攻击，识别可利用的攻击路径，提供修复建议并复测修复效果。这种定位让公司成为纯软件驱动的攻防安全厂商，而非传统的咨询类渗透测试公司。商业化通路上，公司将企业大客户直销与体量可观的托管安全服务商渠道结合：据
              SecurityBrief 援引公司披露报道，渠道合作伙伴贡献了第四季度预订额的 32%，托管安全服务商则服务了约 70%
              的客户。这些数字固然反映出渠道杠杆，但客户分母中计入了通过合作伙伴触达的机构，因此绝不能将其等同于 7,000 个直销大客户合同，也不能直接当作收入的替代指标。
