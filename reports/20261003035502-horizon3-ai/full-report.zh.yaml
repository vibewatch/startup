  - id: FE001
    title: NodeZero 自主安全架构技术栈
    type: stack
    summary: Horizon3.ai NodeZero 平台的逻辑架构层，从攻击面执行向下贯穿至企业合规与数据驻留。
    data:
      layers:
        - label: 攻击面执行层
          detail: 临时容器化运行器、外部边界扫描器、已认证 Web 应用爬虫以及云 API 连接器。
        - label: 攻击路径计算与图引擎
          detail: 自动化漏洞串联、BloodHound 式身份图分析以及实时横向移动遍历。
        - label: 漏洞利用与利用证据引擎
          detail: 非破坏性证据抓取、凭证提取及快速响应 N-day 漏洞利用模块。
        - label: 编排与工作流层
          detail: NodeZero 门户、实时视图（RTV）事件流、0-10 业务上下文评分计算以及一键验证闭环。
        - label: 生态集成与遥测架构
          detail: 双向 API 连接 EDR、SIEM 及工单系统，支持 SOC 威胁去冲突化。
        - label: 安全、信任与基础设施底座
          detail: FedRAMP High 授权运行边界、专属澳大利亚数据驻留及无 Agent SaaS 多租户云。
