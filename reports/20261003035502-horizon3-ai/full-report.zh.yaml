              NodeZero 的采纳规模从 2026 年初的约 5,200 家机构，扩大至 2026 年 8 月的 7,000 多家客户，并在生产环境中累计安全执行了超过 310,000 次自主渗透测试。Forrester
              Consulting 针对中型客户画像开展的独立经济效益评估显示出显著的运营杠杆：得益于安全运营效率提升、第三方外包渗透测试开支省免以及传统扫描器授权减少，每年可节省成本超过 $325,000。据估算，其 3
