      - number: '5.2'
        title: 产品模块、工作流与快速响应机制
        blocks:
          - type: paragraph
            body: >
              NodeZero 产品家族由协同运作的评估模块组成，覆盖内网、外部边界、云基础设施及现代 Web 应用。平台的运行生命周期遵循闭环的“渗透、修复、验证”（Hack, Fix,
              Verify）工作流。在初始的“渗透”（Hack）阶段，NodeZero 会测绘机构的可达攻击面，识别薄弱环节，并将多个低危发现——例如 Active Directory
              默认权限、陈旧服务账户票据以及网络错误配置——主动串联成高危攻击路径，最终直指域控沦陷（Domain Compromise）或敏感数据泄露（Sensitive Data Exposure）。


              在“修复”（Fix）阶段，平台绕过原始 CVSS 评分指标，转而采用内部的上下文评分（Context Score，分值 0 至
              10）。这一专有评分算法重点衡量已证实的下游可利用性及实际业务受损范围，而非抽象的严重等级。系统提供修复攻略，指出只要拔除某一个关键支点即可斩断整条攻击图谱。最后在“验证”（Verify）阶段，运维人员只需一键发起定向复测，仅重跑特定的攻击链以证实风险已被消除，完成整个反馈闭环。


              近期平台升级印证了其在现代企业攻击面上的持续拓展。2026.08 版本推出了专属的 WebApp Pentesting，支持对单页应用和后端 API
              进行爬取、带凭证工作流探索以及自动化路由发现。同期新增的功能还包括将控制平面 API 审计与虚拟机内部漏洞利用相结合的混合式 Azure Cloud 渗透测试、增强的 Kerberos
              票据提取功能，以及在测试期间自动布设的 Tripwire 诱捕蜜罐，用于捕获已潜伏在客户边界内的恶意攻击者。快速响应（Rapid Response）模块则能在新型 0-day 和 N-day
              漏洞公开披露数小时内，持续下发检测逻辑。
