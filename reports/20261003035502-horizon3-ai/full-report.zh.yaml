              - CP013
      - number: '3.4'
        title: 图表分析
        blocks:
          - type: callout
            title: 架构分野：横向攻击链串联与业务逻辑漏洞
            body: >-
              企业买方面临技术架构路线的权衡抉择：是由内而外验证基础设施，还是由外而内测试应用程序。NodeZero 的强项在于发现未授权攻击者如何在无需凭证的情况下，串联 Active Directory
              和云基础设施中的凭证与错误配置。相反，Escape 等应用优先的竞品则紧盯类似 Keycloak CVE-2026-17059 这样的漏洞——API
              接口在无需横向移动的情况下即可泄露未授权数据。要在统一暴露面管理市场胜出，必须弥合这两条路径的鸿沟。
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP009
          - type: callout
            title: 安全修复要求与开发者工作流之间的协同摩擦
            body: >-
              NodeZero 的优先级模型根据攻击路径影响面对修复动作进行排序，天然契合基础设施和 SecOps 工程师的习惯。然而，Web 应用漏洞会被分派给软件开发人员，他们需要适配特定框架的代码补丁，而非抽象的
              CVSS 影响评分。如果 Horizon3.ai 无法打通开发者工作流，应用安全预算仍将被专注于 API 和 Web 测试的垂直厂商牢牢占据。
            calloutType: risk
