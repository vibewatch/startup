  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与执行模型
        blocks:
          - type: paragraph
            body: >
              Horizon3.ai 依托其旗舰产品 NodeZero 提供核心安全验证能力。NodeZero 是一款基于多租户 SaaS
              架构交付的自主渗透测试平台。与仅凭服务标语抓取或版本指纹生成推测性漏洞清单的传统漏洞扫描器不同，NodeZero
              主动执行真实的攻击者战术，在复杂的企业环境中挖掘多步攻击路径。其核心设计理念，是将企业暴露面管理从计算理论漏洞数量，转向验证实际可利用性。


              其底层技术框架刻意采用了无代理架构：目标端点无需安装常驻后台守护进程、管理软件代理或静态特权凭据。内网评估任务依托 NodeZero Runner 部署的临时容器化工作负载执行。用户直接在中心化的
              NodeZero Portal 上按需触发评估任务，系统会自动协调客户端基础设施上的 Runner 容器，初始配置完成后无需手动执行命令行操作。至于外部边界和云控制平面评估，NodeZero 则直接通过
              Horizon3.ai 跨 AWS、Azure 及区域托管中心的多租户云底座发起评估任务。


              为了保障敏感生产环境的企业级安全性，NodeZero 运行着确定性的安全护栏。扫描期间，算法会主动识别动态分配的临时 IP 地址，从而对 Kubernetes Pod、无服务器 Lambda
              及动态主机进行资产去重。在评估系统时，NodeZero 会截获具体的漏洞利用实证证据链——如原始命令输出、屏幕截图或目录结构——无需人工臆测即可证实系统已被实际攻破。当操作需要更高提权时，NodeZero
              可调用临时远程访问工具（RAT）组件或注入无破坏性的凭据令牌，在不造成系统性业务宕机的前提下探索横向移动路径。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE008
