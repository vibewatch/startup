  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群分层与 GTM 路径
        blocks:
          - type: paragraph
            body: >-
              Horizon3.ai 的目标客户是大型企业、中端市场、国防工业基础及公共部门中的安全运营与 IT
              运维买方。商业化渗透依托混合分销架构，将商业直销战队与不断扩张的全球渠道体系相结合。公司具体将客群划分为商业中端直销账户、全球大型企业账户，以及由托管服务商合作伙伴交付的客户。2026 年初，Horizon3
              扩建了渠道领导团队，任命专门的渠道副总裁以做大合作伙伴主导的业务线；这反映出规模较小的企业和区域性机构往往是将 NodeZero
              作为外包托管服务采购，而非购买内部自用的独立运维许可证。虽然这一合作伙伴渠道加速了在区域金融机构和中端供应商中的落地推广，但它带来了中间商分成，并削弱了厂商对终端客户留存情况的直接把控。
