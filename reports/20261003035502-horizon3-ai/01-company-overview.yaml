company:
  name: "Horizon3.ai"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Horizon3.ai is a San Francisco-based autonomous penetration-testing company founded in 2019 and led by co-founder Snehal Antani. It announced a $250 million Series E at a valuation above $2 billion in August 2026, but its scale metrics remain company-reported and the assigned evidence does not establish absolute ARR, revenue, headcount, profitability, cash availability, or customer concentration."
sections:
  - id: "identity-and-business-model"
    title: "Identity, Product, and Route to Market"
    body: >-
      Horizon3.ai states that it was founded in 2019 and is headquartered in San
      Francisco. Its NodeZero platform autonomously attacks live production
      environments, identifies exploitable attack paths, supplies remediation
      guidance, and retests fixes. That proposition makes the company a
      software-based offensive-security provider rather than a conventional
      consulting pentest firm. Distribution combines direct enterprise selling
      with a material managed-security-provider route: SecurityBrief reported,
      from company disclosures, that channel partners generated 32% of
      fourth-quarter bookings and that managed security service providers served
      about 70% of customers. Those figures indicate channel leverage, but the
      customer denominator includes organizations reached through partners and
      therefore should not be read as 7,000 direct enterprise contracts or as a
      proxy for revenue.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership, Founders, and Governance"
    body: >-
      Co-founder and CEO Snehal Antani anchors both the operating narrative and
      public profile. The official team page describes prior roles as CTO of
      JSOC, CTO at Splunk, and CIO at GE Capital, while NEA and independent
      coverage reinforce the national-security and enterprise-software roots of
      the founding team. Anthony Pillitiere is identified as the other
      co-founder, and the current functional bench covers revenue, marketing,
      legal, people, product, customers, and international sales. The same
      official page records that CFO Holly Grey died in June 2026; none of the
      assigned sources identifies a permanent successor, making finance
      leadership continuity a current diligence item rather than evidence of
      operational failure. Following the Series E, NightDragon's Dave DeWalt and
      Morgan Kyauk were announced as board additions. Voting rights, board
      committee composition, founder ownership, and investor protective
      provisions remain unavailable in the assigned public evidence.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO011"
      - "CO016"
    tableRefs:
      - "TO002"
  - id: "capital-scale-and-milestones"
    title: "Capitalization, Reported Scale, and Milestones"
    body: >-
      Horizon3 announced a $250 million Series E on August 3, 2026 at a valuation
      above $2 billion, co-led by NightDragon and NEA. The company described that
      valuation as roughly three times the $650 million Series D valuation from
      just over a year earlier; independent coverage dates the Series D to June
      2025 and reports a $100 million round. Public cumulative-funding totals do
      not fully reconcile: Value Add VC estimates about $427.5 million, while
      SiliconANGLE reports $428.5 million, so the chapter preserves the
      $427.5-$428.5 million range rather than asserting a false point estimate.
      Operating scale also accelerated on company-reported measures, from 102%
      year-over-year ARR growth and more than 5,200 organizations in March 2026
      to 120% growth and more than 7,000 organizations in August. These are not
      audited financial results. Absolute ARR, accounting revenue, gross margin,
      profitability, cash burn, cash available after financing, debt or credit
      exposure, headcount, and customer concentration remain gaps, so neither a
      revenue multiple nor runway can be calculated from the assigned evidence.
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
