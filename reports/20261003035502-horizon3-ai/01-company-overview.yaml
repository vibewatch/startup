    title: "Headline growth is not an investable revenue base"
    body: "The $2 billion-plus valuation and 120% ARR growth claim cannot be converted into an EV/ARR multiple because absolute ARR is not disclosed. Funding raised is not cash available, reported customer count includes partner-served organizations, and the assigned evidence contains no audited profitability, burn, margin, concentration, or runway data."
