  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "financial-disclosure"
      missingEvidence: "Audited statements and operating schedules for absolute ARR, accounting revenue, gross margin, profitability, cash burn, cash available, runway, debt, and credit facilities."
      whyItMatters: "Without denominators and accounting definitions, growth rates cannot support a revenue multiple, capital-efficiency assessment, or runway estimate."
      diligencePath: "Request audited financial statements, monthly ARR bridges, bank and debt schedules, cash statements, and board-approved forecasts under NDA."
      relatedQuestionRefs:
        - "QO008"
      relatedTableRefs:
        - "TO001"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customers-and-headcount"
      missingEvidence: "Current employee count, direct-versus-partner customer denominator, average contract value, cohort retention, and top-customer or federal revenue concentration."
      whyItMatters: "Customer logos and growth rates do not reveal contract quality, delivery leverage, personnel intensity, or concentration risk."
      diligencePath: "Obtain HRIS headcount, customer master data, channel attribution, cohort analyses, and top-20 customer revenue schedules under NDA."
      relatedQuestionRefs:
        - "QO008"
      relatedTableRefs:
        - "TO001"
        - "TO002"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "stakeholder-and-investor-map"
      missingEvidence: "Complete capitalization table, security classes, ownership percentages, liquidation preferences, secondaries, board voting rights, vetoes, and observer rights."
      whyItMatters: "Named investors do not establish economic ownership, control, preference-stack exposure, or founder dilution."
      diligencePath: "Review the fully diluted cap table, charter, financing documents, investor-rights agreement, voting agreement, and board minutes."
      relatedQuestionRefs:
        - "QO003"
      relatedTableRefs:
        - "TO003"
    - type: "missing-source"
      severity: "material"
      topic: "adverse-events"
      missingEvidence: "Independent legal, regulatory, outage, breach, sanctions, and customer-complaint evidence beyond the assigned adverse query, which returned no allocated URLs."
      whyItMatters: "The absence of an allocated adverse result does not prove the absence of incidents, disputes, enforcement, or customer harm."
      diligencePath: "Run jurisdiction-specific court, regulator, procurement, sanctions, outage, breach-notification, and customer-reference checks in legal diligence."
      relatedQuestionRefs:
        - "QO007"
