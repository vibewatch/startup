        title: Identity, Product, and Route to Market
        blocks:
          - type: paragraph
            body: >-
              Horizon3.ai states that it was founded in 2019 and is headquartered in San Francisco. Its NodeZero
              platform autonomously attacks live production environments, identifies exploitable attack paths, supplies
              remediation guidance, and retests fixes. That proposition makes the company a software-based
              offensive-security provider rather than a conventional consulting pentest firm. Distribution combines
              direct enterprise selling with a material managed-security-provider route: SecurityBrief reported, from
              company disclosures, that channel partners generated 32% of fourth-quarter bookings and that managed
              security service providers served about 70% of customers. Those figures indicate channel leverage, but the
              customer denominator includes organizations reached through partners and therefore should not be read as
              7,000 direct enterprise contracts or as a proxy for revenue.
