  - id: FE001
    title: NodeZero Autonomous Security Architecture Stack
    type: stack
    summary: >-
      Logical architecture layers of Horizon3.ai NodeZero platform from attack surface execution down to enterprise
      compliance and data residency.
    data:
      layers:
        - label: Attack Surface Execution Layer
          detail: >-
            Ephemeral containerized runners, external perimeter scanners, authenticated web app crawlers, and cloud API
            connectors.
        - label: Attack Path Calculation & Graph Engine
          detail: >-
            Automated vulnerability chaining, BloodHound-style identity graph analysis, and real-time lateral movement
            traversal.
        - label: Exploitation & Proof-of-Exploit Engine
          detail: Non-destructive proof artifact capture, credential extraction, and rapid response N-day exploit modules.
        - label: Orchestration & Workflow Layer
          detail: >-
            NodeZero Portal, Real-Time View (RTV) event stream, 0-10 business Context Score calculation, and 1-click
            verify loops.
        - label: Ecosystem Integration & Telemetry Fabric
          detail: Bi-directional APIs connecting with EDR, SIEM, and ticketing platforms, supporting SOC threat deconfliction.
        - label: Security, Trust & Infrastructure Foundation
          detail: >-
            FedRAMP High authorized operational boundary, dedicated Australian data residency, and agentless SaaS
            multi-tenant cloud.
    approximationNotes: >-
      Logical stack model synthesized from technical release notes, product glossaries, and engineering architecture
      documentation.
