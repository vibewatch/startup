      - number: '5.2'
        title: Product Modules, Workflows, and Rapid Response
        blocks:
          - type: paragraph
            body: >
              The NodeZero product suite is structured into coordinated assessment modules that cover internal networks,
              external perimeters, cloud infrastructure, and modern web applications. The platform's operational
              lifecycle follows a closed-loop 'Hack, Fix, Verify' workflow. During the initial 'Hack' phase, NodeZero
              maps an organization's reachable attack surface, identifies weaknesses, and actively chains multiple
              low-severity findings—such as default Active Directory permissions, stale service account tickets, and
              network misconfigurations—into high-impact attack paths culminating in Domain Compromise or Sensitive Data
              Exposure.


              In the 'Fix' phase, the platform bypasses raw CVSS scoring metrics in favor of an internal Context Score
              (ranging from 0 to 10). This proprietary scoring algorithm weighs demonstrated downstream exploitability
              and actual business blast radius rather than abstract severity ratings. The system provides remediation
              playbooks identifying the single pivot point whose elimination severs the entire attack graph. Finally, in
              the 'Verify' phase, operators initiate targeted one-click re-tests that rerun only the specific attack
              chain to prove the risk has been eliminated, closing the feedback loop.


              Recent platform upgrades highlight continuous expansion across modern enterprise attack surfaces. The
              2026.08 release introduced dedicated WebApp Pentesting, enabling crawling, authenticated workflow
              exploration, and automated route discovery for single-page applications and backend APIs. Concurrent
              additions include hybrid Azure Cloud pentests combining control-plane API audits with VM internal
              exploitation, expanded Kerberos ticket extraction, and automated Tripwire honeypots deployed during
              testing to trap malicious actors already present within customer perimeters. Rapid Response modules
              continuously deploy detection logic for emerging zero-day and N-day vulnerabilities within hours of public
              disclosure.
            claimRefs:
              - CE002
              - CE004
              - CE006
              - CE007
              - CE011
