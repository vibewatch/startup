  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Architecture and Execution Model
        blocks:
          - type: paragraph
            body: >
              Horizon3.ai delivers its flagship security validation capability through NodeZero, an autonomous
              penetration testing platform delivered as a multi-tenant software-as-a-service (SaaS) architecture. Unlike
              conventional vulnerability scanners that generate speculative lists of flaws based purely on banner grabs
              or version fingerprints, NodeZero actively executes real-world attacker techniques to discover multi-step
              attack paths across complex enterprise environments. The core operating philosophy shifts enterprise
              exposure management away from theoretical vulnerability counts toward verified exploitability.


              The technical foundation is intentionally agentless: customer environments require no persistent
              background daemons, administrative software agents, or static privileged credentials installed on target
              endpoints. Internal network assessments operate via ephemeral containerized workloads deployed through the
              NodeZero Runner. Users trigger on-demand assessments directly from the central NodeZero Portal, which
              automatically coordinates Runner containers on client infrastructure without requiring manual command-line
              execution after initial provisioning. For external perimeter and cloud control-plane evaluations, NodeZero
              launches assessment jobs directly from Horizon3.ai's multi-tenant cloud fabric across AWS, Azure, and
              regional hosting zones.


              To ensure enterprise-grade safety in sensitive production environments, NodeZero operates with
              deterministic guardrails. During scanning, an algorithm actively detects dynamically assigned ephemeral IP
              addresses to deduplicate asset inventories across Kubernetes pods, serverless lambdas, and dynamic hosts.
              While assessing systems, NodeZero captures concrete Proof-of-Exploit artifacts—such as raw command
              outputs, screenshots, or directory structures—verifying actual compromise without human guesswork. When
              elevated access is required during an operation, NodeZero can leverage a temporary remote access tool
              (RAT) component or inject non-destructive credential tokens to explore lateral paths without introducing
              systemic operational downtime.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE003
