        title: Exhibits
        blocks:
          - type: callout
            title: Channel Leverage and the Two-Buyer Divide
            body: >-
              Horizon3.ai's market expansion relies on a two-pronged strategy: leveraging MSSPs to capture approximately
              70% of its customer base across international and commercial markets, while expanding from infrastructure
              into web applications. However, application security represents a fundamentally distinct buyer persona
              from network infrastructure. While network defenders prioritize multi-hop attack path elimination across
              Active Directory and cloud hosts, engineering-led AppSec buyers demand developer-ready CI/CD remediation,
              API business-logic testing, and build-time integration.
