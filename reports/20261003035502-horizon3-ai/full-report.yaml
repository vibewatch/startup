      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of autonomous penetration testing is governed by distinct buyer motivations, procurement paths,
              and organizational constraints. Direct enterprise procurement is primarily driven by Chief Information
              Security Officers (CISOs), Directors of Security Operations, and compliance leaders seeking to eliminate
              alert fatigue, validate defensive control efficacy, and meet continuous testing mandates. In parallel,
              Managed Security Service Providers (MSSPs) represent Horizon3.ai's fastest-growing segment, servicing
              approximately 70% of customer accounts. MSSPs deploy NodeZero as an underlying engine to deliver
              continuous assessment, remediation advisory, and threat hunting without scaling scarce offensive security
              personnel. Key adoption constraints include operational safety concerns regarding active testing in live
              production environments, exclusion of sensitive operational technology (OT) or industrial control systems,
              and distinct buyer requirements between network/identity infrastructure teams and application-first
              software engineering organizations.
