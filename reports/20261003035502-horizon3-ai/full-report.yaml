  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The autonomous penetration testing market has emerged as an active validation layer within broader
              cybersecurity exposure management. Historically, enterprise organizations relied on annual or semi-annual
              human red team engagements alongside automated vulnerability scanners such as Tenable, Qualys, or Rapid7.
              However, scanners produce high volumes of theoretical CVE alerts without proving exploitability or
              reachability, while manual consulting engagements remain constrained by point-in-time sampling, talent
              scarcity, and static PDF delivery. Autonomous penetration testing replaces periodic sampling by executing
              multi-hop attack paths against production environments to prove real reachability and verify remediation.
              Horizon3.ai focuses its NodeZero platform on continuous testing of enterprise networks, Active Directory
              identity architectures, internal infrastructure, and cloud environments, while recently adding web
              application pentesting in July 2026. Traditional consulting pentests and scanner licenses represent the
              primary baseline budget pools from which initial autonomous pentesting contracts are funded.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and Serviced Opportunity'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Horizon3.ai's market opportunity requires disaggregating broad cybersecurity projections into
              defensible operational boundaries. Macro commentary and enterprise cybersecurity spending reports place
              the addressable boundary across security assessment, penetration testing, and continuous exposure
              management at tens of billions of dollars. Within this envelope, the serviceable addressable market (SAM)
              concentrates on enterprise and mid-market organizations operating complex hybrid-cloud, Active Directory,
              and distributed IT infrastructure subject to strict regulatory mandates such as FedRAMP, DORA, NIS 2, and
              PCI-DSS 4.0. Typical mid-market organizations spend between $40,000 and $150,000 annually on traditional
              manual pentest services across only two point-in-time engagements. A software subscription model that
              provides continuous validation across the entire attack surface captures this manual consulting allocation
              while expanding annual contract values via high-margin MSSP distribution and enterprise tiering.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
