  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Architectural Boundaries
        blocks:
          - type: paragraph
            body: >-
              The offensive security validation landscape is split along architectural lines between inside-out
              infrastructure exploit chaining and outside-in application-layer security testing. Horizon3.ai built its
              market position on the NodeZero platform, which executes unauthenticated, production-safe autonomous
              exploit chains across internal networks, Active Directory, cloud environments, and identities. This
              approach proves whether an initial foothold allows an attacker to pivot into critical enterprise
              infrastructure. However, competitors such as Escape approach penetration testing outside-in, mapping
              internet-facing perimeters, single-page applications, and APIs to uncover broken object-level
              authorization, multi-user tenant leakage, and business logic flaws without requiring lateral movement.
              Additional competition spans agentless automated security validation from Pentera, credit-based autonomous
              web exploit tools like XBOW, blended human-and-AI penetration-testing-as-a-service platforms like Cobalt,
              and managed agent swarms like Terra.
