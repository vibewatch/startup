        title: Exhibits
        blocks:
          - type: callout
            title: 'The Architectural Divide: Lateral Exploit Chains vs Business Logic Flaws'
            body: >-
              Enterprise buyers face an architectural trade-off between inside-out infrastructure validation and
              outside-in application testing. NodeZero excels at discovering how an unauthenticated attacker chains
              credentials and misconfigurations across Active Directory and cloud infrastructure. Conversely,
              application-first rivals like Escape target flaws like Keycloak CVE-2026-17059 where an API endpoint
