companyProfile:
  summary: >-
    Horizon3.ai is a private cybersecurity company founded in 2019 and headquartered in San Francisco. It sells
    NodeZero, an autonomous penetration-testing platform that safely attacks customer environments to find exploitable
    paths, provide remediation guidance, and verify fixes. The company emphasizes federal and enterprise use cases,
    including FedRAMP High environments, and reports thousands of organizations on the platform.
