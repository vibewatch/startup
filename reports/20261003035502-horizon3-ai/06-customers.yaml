callouts:
  - calloutType: "insight"
    title: "Channel Intermediation Limits Direct Enterprise Retention Visibility"
    body: "Horizon3's aggressive expansion of MSP, MSSP, and systems integrator partnerships (such as World Wide Technology) successfully accelerates top-line customer logo adoption across mid-market organizations. However, it structurally distances Horizon3 from direct contract ownership. In partner-led models, client retention and expansion are tied to the managed service provider's commercial health and bundling choices, obscuring underlying customer Net Revenue Retention."
    claimRefs:
      - "CU002"
      - "CU004"
      - "CU011"
      - "CU014"

  - calloutType: "risk"
    title: "Sovereign and Defense Customer Concentration Hazard"
    body: "While FedRAMP High authorization and deep partnerships with the NSA, CISA, and DoD provide a formidable competitive moat in the public sector, they create substantial sovereign concentration risk. Defense suppliers and federal agencies operate under rigid budget cycles and specialized program parameters (such as NSA CAPT). Horizon3.ai has not disclosed what percentage of ARR or customer volume is tied to government funding, leaving investors exposed to federal procurement volatility."
    claimRefs:
      - "CU003"
      - "CU010"
      - "CU015"
      - "CU016"

