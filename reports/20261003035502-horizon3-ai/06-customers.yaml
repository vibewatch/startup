chapter:
  number: 6
  title: "Customers"
  summary: "Horizon3.ai reports protecting over 7,000 organizations globally and serving four Fortune 10 enterprises, but commercial traction is heavily intermediated through MSSPs, MSPs, and federal integrators. While named production deployments at firms like AeroVironment and Adaptic validate technical effectiveness in defense and enterprise IT environments, lack of customer retention metrics, undisclosed NRR, and unquantified federal revenue concentration create material visibility gaps."
sections:
  - id: "customer-segmentation-and-go-to-market-routes"
    title: "Customer Base Segmentation and Go-to-Market Routes"
    body: "Horizon3.ai targets security operations (SecOps) and IT operations (ITOps) buyers across enterprise, mid-market, defense industrial base, and public sector accounts. Commercial penetration relies on a hybrid distribution architecture combining direct commercial sales pods with an expanding global channel organization. The company specifically segments customers into direct commercial mid-market accounts, global enterprise accounts, and managed services provider (MSP/MSSP) partner-delivered clients. In early 2026, Horizon3 expanded its partner leadership structure, appointing a dedicated channel vice president to scale partner-led motions, reflecting that smaller enterprises and regional institutions frequently consume NodeZero as an outsourced managed capability rather than a standalone internal operational license. While this partner-led channel accelerates deployment velocity across regional financial institutions and mid-market suppliers, it introduces intermediary margin splits and limits direct vendor-to-customer retention visibility."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU011"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"

  - id: "adoption-trajectory-and-deployment-scale"
    title: "Adoption Trajectory, Enterprise Scale, and Economic Value"
    body: "The adoption trajectory of NodeZero has expanded from roughly 5,200 organizations in early 2026 to more than 7,000 customers by August 2026, accompanied by a cumulative benchmark of over 310,000 autonomous penetration tests executed safely in production environments. Independent economic assessment conducted by Forrester Consulting on mid-sized customer profiles demonstrated significant operational leverage, indicating an annual cost savings of over $325,000 in improved security operations productivity, avoided third-party contractor penetration testing expenses, and reduced legacy scanner licenses. This yielded an estimated 63% three-year return on investment, returning $1.63 in economic value per dollar expended. However, broad customer volume counts include diverse tiers ranging from large multi-facility enterprise licenses to downstream clients supported under umbrella MSP agreements, meaning aggregate customer counts do not convey average contract value or annual recurring revenue scale."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"

  - id: "named-customer-evidence-and-production-validation"
    title: "Named Customer Proof and Production Environment Integration"
    body: "Documented customer implementation evidence reveals deep integration into multi-vendor enterprise security toolchains. In the defense industrial sector, AeroVironment integrated NodeZero directly into its cybersecurity toolset alongside Microsoft Azure Sentinel, Microsoft Defender, and Rapid7, using automated attack path analysis to drive ticketing and remediation workflows in Jira. Similarly, Adaptic implemented NodeZero to conduct continuous autonomous penetration testing aligned with the National Security Agency (NSA) Cybersecurity Collaboration Center Continuous Autonomous Penetration Testing (CAPT) initiative for Defense Industrial Base suppliers. Regional financial institutions, such as 1st MidAmerica Credit Union and Canada-based Access Credit Union, deployed NodeZero to validate exploitable vulnerabilities across distributed branch networks and maintain audit-ready compliance artifacts under GLBA, FFIEC, and NCUA mandates. These implementations confirm production deployment across critical sectors, though long-term expansion contracts remain undisclosed."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"

  - id: "retention-expansion-and-concentration-vulnerabilities"
    title: "Retention Durability, Channel Friction, and Concentration Hazards"
    body: "Despite rapid headline customer growth, critical commercial durability metrics remain undisclosed. Horizon3.ai has not published Net Revenue Retention (NRR), Gross Revenue Retention (GRR), logo churn, or customer acquisition costs. Furthermore, peer evaluations and competitive displacement analyses from platform reviews highlight that organizations face ongoing workflow friction, requiring tight integration with ticketing systems such as ServiceNow or custom automation via MCP servers to prevent operational bottlenecks. Crucially, the company's strategic positioning within federal defense agencies (DoD, NSA, CISA) and defense contractor ecosystems introduces potential customer concentration risk. Because federal agencies and prime contractors represent high-prestige flagship accounts, changes in federal procurement budgets or delays in agency re-authorizations could disproportionately impact revenue stability. The lack of visibility into top-10 customer concentration and renewal cohorts represents a primary investment diligence gap."
    claimRefs:
      - "CU007"
      - "CU014"
      - "CU015"
      - "CU016"

