slug: "horizon3-ai"
runDate: "2026-10-03"
company:
  name: "Horizon3.ai"
chapter:
  number: 4
  title: "Financials"
  summary: "Horizon3.ai has a subscription software model and company-reported 120% year-over-year ARR growth, but the assigned public evidence does not disclose absolute ARR, realized pricing, gross margin, burn, or runway. A $250 million Series E funds aggressive expansion, yet financing raised is not evidence of cash available, making revenue comparability and capital adequacy the central underwriting blockers."
sections:
  - id: "revenue-model"
    title: "Recurring model, but opaque pricing"
    body: >-
      The clearest public description is a B2B and B2G subscription model for NodeZero, a
      self-service SaaS product that runs authorized tests, identifies exploitable attack paths,
      supports remediation, and verifies fixes. That workflow can support recurring value because
      testing is repeated as customer environments change; however, it does not reveal the billing
      unit, contract duration, minimum commitment, module attach rates, or realized price. No
      assigned source provides a rate card or executed customer contract. The revenue-stream table
      therefore separates evidenced mechanisms from proposed or unavailable economics rather than
      assigning unsupported annual contract values or margins.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "traction-and-metric-comparability"
    title: "Growth is strong; the denominator remains unclear"
    body: >-
      Horizon3.ai reported 120% year-over-year ARR growth and more than 7,000 protected
      organizations in August 2026. Independent publications repeat strong traction signals, but
      the absolute revenue evidence is not decision-grade: assigned sources variously report
      $30 million recorded revenue in May 2025, estimated 2025 annual revenue of $50.7 million,
      estimated annual revenue of $35.5 million, and annual revenue approaching $100 million in
      August 2026. These figures use different periods, labels, and methodologies. They cannot be
      combined into an ARR series, used to calculate growth, or treated as audited revenue without
      management reconciliation.
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI002"
  - id: "gtm-costs-and-capital"
    title: "Expansion plans increase the need for cash-flow disclosure"
    body: >-
      The August 2026 Series E added $250 million of financing and the company identified sales,
      marketing, channel expansion, international offices, and product development as uses of
      proceeds. SiliconANGLE similarly reported that most new capital would support sales,
      marketing, and channel hiring. This establishes a growth-oriented capital plan, not capital
      adequacy: funding raised is not cash on hand, and none of the assigned sources supplies
      operating cash flow, burn, debt, working-capital needs, capex, or a current cash balance.
      Without those inputs, neither runway nor a next-round trigger can be responsibly calculated.
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "financial-verdict"
    title: "Financial verdict: attractive growth, insufficient underwriting data"
    body: >-
      The available evidence supports a recurring software model, expanding adoption, and a large
      new financing, but not a full quality-of-revenue or unit-economics assessment. Value Add VC
      explicitly notes the absence of audited financials and disclosed profitability and observes
      that the public growth metrics originate in company announcements. The underwriting stance
      should therefore remain conditional: validate absolute ARR and its reconciliation to GAAP
      revenue, cohort retention, customer concentration, realized pricing, gross margin, CAC
      payback, support and compute costs, and monthly cash burn before assigning a durable margin
      path or runway.
    claimRefs:
      - "CI001"
      - "CI011"
      - "CI015"
      - "CI016"
