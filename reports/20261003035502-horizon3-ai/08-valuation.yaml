    title: "Multiple Compression and Peer Valuation Disparity"
    body: "Horizon3.ai commands more than double the private-market valuation of direct competitor Pentera despite reporting similar top-line revenue approaching $100 million ARR. Without audited disclosure of gross margins, cohort retention, and customer acquisition costs, entry at $2.0 billion leaves little margin of safety against market-wide SaaS multiple compression."
    claimRefs:
      - "CV002"
      - "CV012"
      - "CV013"
  - calloutType: "recommendation"
    title: "Diligence Prerequisites for Growth Equity Capital"
    body: "Institutional investors should condition growth-stage capital commitments on verified cohort retention schedules, federal contract concentration breakdowns, and gross retention proof, seeking entry structured with downside protection or valuation calibration below 16x forward ARR."
