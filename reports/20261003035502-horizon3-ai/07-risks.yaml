callouts:
  - calloutType: "risk"
    title: "Do not convert missing incident evidence into a clean record"
    body: "The adverse search returned no assigned result, while company materials claim zero downtime. That combination supports an incident-data diligence request, not a conclusion that no breach, outage, legal dispute, or enforcement event has occurred."
    claimRefs:
      - "CR002"
      - "CR016"
  - calloutType: "recommendation"
    title: "Minimum pre-investment evidence"
    body: "Require authorization-maintenance records, independent production-safety history, privileged-result RBAC tests, audited ARR and cash reconciliation, retention and concentration schedules, and board and preference documents before assigning low residual risk."
    claimRefs:
      - "CR003"
      - "CR007"
      - "CR012"
      - "CR014"
      - "CR016"
