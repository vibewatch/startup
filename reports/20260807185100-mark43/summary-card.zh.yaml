  topStrengths:
    - 云原生产品覆盖 CAD、RMS、分析、移动工作流、数据基础设施和 AI 辅助报告。
    - 主要公共安全机构中已有真实客户证据；公开材料支持 250+ 机构规模，2026 年覆盖面推高到 300 以上。
    - 2025 年 10 月融资和 $1.0B 估值标记，说明公司从 2024 年重置中明显修复，而不是品类崩塌。
