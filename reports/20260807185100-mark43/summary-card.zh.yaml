    - 2024-2025 年融资记录散落在官方和第三方来源中，带来股权结构表和估值质量不确定性。
    - 政府采购周期、预算摩擦和标准密集型部署环境，可能拖慢转化和续约。
    - Motorola、Tyler、CentralSquare、Axon 等根深蒂固的既有厂商和生态玩家，可能压低中标率和定价权。
    - Mark43 运营敏感且任务关键的数据工作流，AI 治理、网络安全和公民自由审查仍是重大风险。
  unresolvedGaps:
