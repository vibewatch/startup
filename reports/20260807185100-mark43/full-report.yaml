companyProfile:
  summary: >-
    Mark43 is a growth-stage public-safety software company whose strongest public evidence combines founder-market-fit,
    a broad integrated workflow platform, and real named-agency deployments. The company started from a Harvard-origin
    project, is now led by CEO Bob Hughes with founders still in senior roles, and positions itself as an all-in-one
    operating system for dispatch, records, analytics, mobile workflows, and newer AI-assisted reporting tools. Public
    customer proof and the October 2025 financing marker justify serious diligence, but the business remains difficult
    to price rigorously because the open-web record is thin on revenue quality, cap-table terms, and underlying unit
    economics.
