      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Mark43’s founder-market-fit story is one of the strongest pieces of its public identity. Retained Inc. and
              Forbes-origin press pages say Scott Crouch, Matt Polega, and Florian Mayr met at Harvard, shadowed police
              officers, and turned a late-college project into a company after seeing how dated public-safety software
              constrained officer time and data quality. The exact founding year needs nuance: third-party company
              databases say 2012, Inc. in 2020 calls Mark43 a company founded by students in 2013, and the 2019 Boston
              launch release says the team had been refining the company since founding it at Harvard seven years
              earlier. The most defensible wording is that the company was founded at Harvard around 2012-2013 by those
              three co-founders.


              Current leadership is no longer founder-CEO led. Mark43’s 2026 leadership pages list Bob Hughes as Chief
              Executive Officer, Scott Crouch as Co-Founder and Chairman, Matt Polega as Co-Founder, President, Managing
              Director UK and Head of Marketing, Communications & Enablement, and Florian Mayr as Co-Founder & Vice
              President. Governance additions around the board are visible but incomplete: JD Sherman joined the board
              in May 2023 and Teresa Carlson became a board observer in May 2024, while Chris Merwin joined as CFO in
              December 2024. What remains missing is a complete current board roster, committee structure, voting
              rights, and cap-table governance. That matters because Mark43’s business is mission-critical,
              public-sector, and procurement heavy; investors need to understand not just the founders’ credibility, but
              also who actually shapes strategic and financing decisions.
