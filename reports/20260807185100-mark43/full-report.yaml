  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Headline valuation and public reference points
        blocks:
          - type: paragraph
            body: >-
              The cleanest current headline in the retained public file is Premier Alternatives' October 2025 marker:
              Mark43 at a $1.0 billion valuation, with a $50 million later-stage round and $319.1 million in total
              funding. That headline is directionally attractive because it implies recovery from the severe 2024 reset
              reported by Prime Unicorn Index. It is also inherently fragile because the same post-2021 financing period
              is described differently by CB Insights and official Mark43 disclosures. Investors should therefore treat
              the $1.0 billion figure as a usable marker for scenario analysis, not as a fully reconciled truth.


              The 2024 down-round context matters because it defines the risk envelope. Prime described an implied
              roughly $206 million pre-money reset, while Mark43 itself announced a $55 million fundraising round in
              March 2024 and CB Insights later logged a $40 million Series F in May 2024. Those are not tiny
              differences. They change dilution, preference stack implications, and how much of the 2025 rebound should
              be interpreted as true operating recovery versus a later-stage financing event on terms the public file
              cannot see.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: figure
            figureRef: FV003
            claimRefs:
