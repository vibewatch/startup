      - number: '1.4'
        title: Scale milestones, customer proof, and disclosure friction
        blocks:
          - type: paragraph
            body: >-
              Customer deployment evidence shows Mark43 is not a speculative platform. Washington, D.C. is the
              foundational proof point: MPD turned to Mark43 after concluding its legacy Intergraph RMS would hold back
              collaboration and modern reporting, and the resulting RMS launched in August 2015 across MPD and 40-plus
              other D.C. agencies. The customer story says Mark43 migrated more than ten years of historical data,
              trained over 10,000 sworn officers in five and a half weeks, and achieved a median 9/10 internal
              recommendation score. Later city launches show the model scaling. Boston launched Mark43 RMS in 2019
              across more than 2,700 users, while Atlanta launched Mark43 RMS in 2020 and cited both NIBRS compliance
              progress and Mark43’s then-100-plus-agency footprint.


              Recent milestones also show the company broadening beyond classic records management. OnScene brought CAD
              context to iOS and Android in 2023; FedRAMP High authorization in 2024 strengthened federal and security
              positioning; BriefAI and ReportAI marked a more explicit AI move in late 2024; the 2026 trends report and
              Security Today coverage show Mark43 trying to define the public narrative around responsible AI with human
              oversight; and the ForceMetrics partnership shows continued ecosystem layering on top of the core
              platform. The same section also surfaces the main disclosure friction: public customer-count evidence
              ranges from over 70 agencies in 2019 to over 100 in 2020 to more than 250 agencies in 2024, while Apps Run
              The World’s public database only exposes 12 verified customer records. That gap does not invalidate
              Mark43’s scale claims, but it does mean the external public proof set is much narrower than the company’s
              own headline narrative.
