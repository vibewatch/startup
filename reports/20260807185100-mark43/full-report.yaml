      - number: '2.3'
        title: Buyers, users, payers, and procurement path
        blocks:
          - type: paragraph
            body: >-
              Mark43’s buying motion is institutional and multi-stakeholder. Direct users include dispatchers, patrol
              officers, investigators, records teams, analysts, and command staff. Buyers and budget owners vary by
              deployment: large cities may involve police leadership, records units, and municipal IT; statewide or
              regional programs may involve 911 authorities, public-safety agencies, and procurement offices; federal or
              regulated customers add security reviewers and compliance teams. The mix is one reason Mark43’s market
              behaves more like government infrastructure software than like ordinary line-of-business SaaS.


              The purchase path is also unusually formal. FCC rules now make NG911 readiness, standards compliance, and
              valid-request mechanics part of timing. 911.gov and CISA show how grants, interoperability, cybersecurity,
              and cross-agency agreements sit upstream of actual product adoption. SAM.gov and eVA illustrate the
              institutional reality beneath that policy language: public-safety software is often bought through formal
              solicitations, state vehicles, and compliance-heavy contracting processes. The same facts that create
              stickiness after a deployment—security review, migration effort, workflow embed, and interagency
              coordination—also slow sales cycles before a contract is signed.
