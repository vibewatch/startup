      - number: '4.3'
        title: Operating model, unit economics, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The best public evidence suggests Mark43 behaves more like mission-critical government software plus
              services than like lightweight self-serve SaaS. Federal positioning, FedRAMP content, support services,
              advisory services, and procurement guidance all point to a go-to-market motion with long evaluation
              cycles, deployment labor, compliance obligations, and ongoing customer care. That mix can produce sticky
              revenue if the software becomes a system of record, but it can also dilute pure software margins through
              implementation and high-touch support. In other words, Mark43 may be a high-value platform without
              necessarily being a clean, high-margin SaaS annuity on the public evidence alone.


              Capital adequacy is directionally stronger than economics visibility. Even using the most conservative
              public lenses, Mark43 has raised well over $200 million and likely more than $300 million in total if the
              2025 Premier data is directionally accurate. That gives the company more financing resilience than an
              early-stage startup, and the December 2024 CFO hire signals active financial stewardship. But runway
              cannot be underwritten from the retained public record because cash balance, burn, gross margin, net
              retention, and ARR are not disclosed. Public capital history proves access to financing, not present cash
              efficiency.
