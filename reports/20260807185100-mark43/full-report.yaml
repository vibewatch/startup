    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product stack and architecture
        blocks:
          - type: paragraph
            body: >-
              The retained product file shows that Mark43 is no longer a simple CAD/RMS vendor. The stack now spans
              operational applications, a modern data platform, a data lake, native analytics, AI-assisted reporting and
              briefing, mobile responder tools, booking, e-citations, alternate-CAD resilience, and an integration layer
              that connects external ecosystems. The architecture is therefore best understood as a workflow platform
              sitting on top of shared data and trust layers rather than as a collection of unrelated point products.


              That platform logic matters because it creates compounding product value when agencies buy more than one
              module. CAD, RMS, mobile response, analytics, and adjacent AI become more useful when they share one
              operational data model and one compliance envelope. Public sources also show that Mark43 is pushing the
              platform toward greater interoperability rather than tighter isolation: the integrated-ecosystem page, AWS
              page, Axon partner page, ForceMetrics partnership, and RapidSOS partnership all suggest the company
              expects customers to live inside a broader public-safety technology environment.
