      - number: '7.2'
        title: Operational, security, and product risks
        blocks:
          - type: paragraph
            body: >-
              The retained risk file is strongest on cyber and resilience. Mark43 has built visible trust
              surfaces—security/compliance, Fortified, vulnerability disclosure, responsible AI, and support
              services—but the existence of those controls is itself evidence that the operating environment is
              unforgiving. Mark43’s own cybersecurity and outage-related press archive emphasizes that many
              public-safety organizations lack cyber expertise and worry about dispatch outages, while 911.gov and CISA
              frame cybersecurity as a structural requirement of NG911 modernization. Alternate CAD in the product file
              reinforces the same message from another angle: agencies need degraded-mode continuity because service
              interruption is unacceptable.


              AI adds a second operational-risk layer. ReportAI and BriefAI are clearly scoped as workflow assistants,
              and the responsible-AI page shows the company knows oversight matters. But any AI used in case summaries,
              reports, or police workflows creates error, auditability, and trust risk if governance fails in
              production. The best current reading is that Mark43 recognizes this risk and is trying to manage it; the
              public file still does not provide the live quality metrics needed to confirm that the control system
              works under load.
