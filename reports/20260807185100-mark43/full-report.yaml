  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital history and disclosure conflicts
        blocks:
          - type: paragraph
            body: >-
              Mark43’s public financing history is strongest at the poles and weakest in the middle. The retained
              official file clearly shows a $55 million fundraising round announced on March 29, 2024 and a $101 million
              Series E announced on July 12, 2021, which brought disclosed cumulative funding to $257 million. Archived
              official coverage also captures earlier milestones: a $27 million Series B in 2016, a $38 million Series C
              in 2018, and a 2015 article saying total funding had reached $12.8 million including a $10.8 million
              Series A and $1.95 million of seed capital. That is enough to show real financing depth and repeated
              investor support across a decade.


              After 2021, however, the public record becomes materially inconsistent. Prime Unicorn Index reported a
              March 2024 share-price reset implying a roughly $206 million pre-money valuation, while CB Insights lists
              the latest funding round as a $40 million Series F on May 31, 2024 and Premier Alternatives lists a
              later-stage $50 million round in October 2025 with current valuation at $1.0 billion and total funding of
              $319.1 million. Those records cannot all be treated as equally authoritative. The right diligence stance
              is to preserve the official facts, preserve the conflicts, and require management to reconcile round
              labels, round sizes, cap-table progression, and the true post-2021 valuation path before underwriting any
              private-market mark.
            claimRefs:
