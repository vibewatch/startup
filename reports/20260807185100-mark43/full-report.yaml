              Scale is directionally strong even if external proof remains thinner than the company narrative. Mark43’s
              2024 FedRAMP announcement says the company serves more than 250 public-safety agencies, while 2026
              coverage cites 300+ law-enforcement agencies. Apps Run The World, by contrast, exposes only a small public
              subset of verified customer records. The right interpretation is not that the company’s installed base is
