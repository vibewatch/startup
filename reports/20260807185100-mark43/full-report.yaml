  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Valuation judgment flows from the $1.0B marker through revenue visibility, comparable lenses, and risk discounts
      rather than from one simple static multiple.
    data:
      nodes:
        - id: v1
          label: $1.0B headline marker
          detail: Premier Alternatives late-2025 valuation point
        - id: v2
          label: Revenue unknown
          detail: Current scale determines whether the headline is cheap or expensive
        - id: v3
          label: Public comps
          detail: Tyler and Motorola anchor a mid/high-single-digit public lens
        - id: v4
          label: Quality discounts
          detail: Procurement, concentration, services, and cap-table uncertainty widen the range
        - id: v5
          label: Cautious proceed
          detail: Diligence warranted; price not fully underwritten publicly
      edges:
        - from: v1
          to: v2
          label: must be tested against
        - from: v2
          to: v3
          label: is compared to
        - from: v3
          to: v4
          label: then adjusted for
        - from: v4
          to: v5
          label: leading to
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV030
      - CV031
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      At a fixed $1.0B headline, implied revenue multiple falls sharply only if Mark43 is already at meaningful
      undisclosed scale.
    data:
      items:
        - label: If revenue is $50M
          value: 20
        - label: If revenue is $75M
          value: 13.3
        - label: If revenue is $100M
          value: 10
        - label: If revenue is $150M
          value: 6.7
        - label: If revenue is $200M
          value: 5
        - label: If revenue is $250M
          value: 4
    approximationNotes: Bars show implied market-cap-to-revenue ratios because Mark43 does not publicly disclose current revenue.
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      A range is more defensible than a point estimate because the 2024 reset and 2025 rebound create a very wide
      quality-of-information gap.
    data:
      items:
        - label: Bear
          low: 0.25
          value: 0.35
          high: 0.45
          unit: $B
        - label: Base
          low: 0.7
          value: 0.82
          high: 0.95
          unit: $B
        - label: Current headline
          low: 0.95
          value: 1
          high: 1.05
          unit: $B
        - label: Bull
          low: 1.1
          value: 1.25
          high: 1.4
          unit: $B
    approximationNotes: >-
      Ranges are analytical scenario bands anchored to public financing markers, peer lenses, and missing-disclosure
      discounts—not a formal DCF.
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV018
      - CV022
      - CV026
      - CV028
      - CV029
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scores translate the public valuation file into a decision snapshot.
    data:
      items:
        - label: Market importance
          score: 4
          detail: Mission-critical category with durable modernization need
        - label: Customer / product proof
          score: 4
          detail: Real breadth across product and agency references
        - label: Revenue visibility
          score: 1
          detail: Current revenue is not publicly disclosed
        - label: Valuation clarity
          score: 2
          detail: 2024-2025 financing trail is materially inconsistent
        - label: Public-only conviction
          score: 2
          detail: Strong enough for diligence, too weak for blind price acceptance
    claimRefs:
      - CV018
      - CV019
      - CV022
      - CV030
      - CV031
      - CV032
      - CV033
