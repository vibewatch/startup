            title: The market is big, but the wrong number is easy to cite
            body: >-
              Mark43’s market can look anywhere from sub-$1B to more than $10B depending on whether the source measures
              NG911 annual revenue, remaining modernization capital, historical grant support, or broad police software.
              The diligence task is not to pick the biggest number; it is to identify the subset of public-safety
              workflow spend that can actually clear procurement, security, and migration hurdles.
