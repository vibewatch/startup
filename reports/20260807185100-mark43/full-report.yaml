      - number: '8.2'
        title: Public comparable lenses and multiple sensitivity
        blocks:
          - type: paragraph
            body: >-
              The most defensible public comps in this file are not other private unicorns with opaque ledgers; they are
              public companies with relevant government-software or public-safety exposure. MacroTrends and
              CompaniesMarketCap show Tyler Technologies at roughly $2.332 billion of 2025 revenue and about $12.76
              billion of market cap, implying a market-cap-to-revenue lens near 5.5x. The same sources show Motorola
              Solutions at roughly $11.312 billion of trailing revenue and around $78.01 billion of market cap, implying
              a roughly 6.9x lens. These are not perfect EV/revenue comparables and their business mixes differ
              materially from Mark43, but they establish that mature public peers can trade in the mid-to-high
              single-digit revenue-multiple zone.


              That lens is useful precisely because Mark43 does not publicly disclose revenue. A $1.0 billion private
              valuation looks conservative or aggressive depending on whether revenue is $50 million, $100 million, $150
              million, or more. At $50 million, the implied multiple is about 20x. At $100 million it is 10x. At $150
              million it is 6.7x. At $200 million it is 5x. Without a current revenue figure, the valuation debate
              cannot be solved by spreadsheet precision. It can only be bounded by sensitivity.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
