        - Can impair common-equity value even at same headline valuation
        - Unknown publicly
      - - Services intensity overwhelms software-margin thesis
        - Would justify lower-quality multiple
        - Unknown publicly
      - - 2025 rebound not supported by durable bookings or ARR
        - Would make the unicorn-restoration story cosmetic
        - Unknown publicly
    notes: Each trigger is a hard reason to re-cut valuation instead of arguing around narrative.
    claimRefs:
      - CV015
      - CV022
      - CV026
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
  - id: TV006
    title: Final diligence asks table
    columns:
      - Need
      - Why it changes valuation
    rows:
      - - Current ARR / revenue and growth
        - Determines whether $1.0B implies 5x, 10x, 20x, or more
      - - Gross margin and services mix
        - Separates durable software quality from labor-heavy deployment economics
      - - NRR, churn, and concentration
        - Determines recurring-revenue quality
      - - Cap table and 2024-2025 financing terms
        - Determines whether headline valuation translates into real equity value
      - - Runway and burn
        - Determines bargaining power and downside financing risk
      - - Product-level attach rates and federal traction
        - Tests upside from multi-module platform expansion
    notes: These are the shortest-path answers to move valuation from narrative to underwriting.
    claimRefs:
      - CV012
      - CV030
      - CV031
      - CV032
      - CV038
      - CV039
      - CV040
