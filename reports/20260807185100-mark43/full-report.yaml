chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and location record
        blocks:
          - type: paragraph
            body: >-
              Mark43’s current positioning is unusually clear for a private public-safety software vendor. Its current
              corporate and product pages repeatedly describe the company as a secure, all-in-one public safety
              technology platform built around cloud-native CAD, RMS, analytics, mobile, and AI-assisted workflows. The
              product surface visible in retained 2026 pages is broad: Mark43 CAD for dispatch, Mark43 RMS for records,
              Insights for analytics, OnScene for mobile response, and newer AI modules such as BriefAI and ReportAI.
              That product breadth matters because the company does not look like a point tool vendor any longer; it
              looks like an operating system layer for dispatchers, officers, investigators, and agency leadership.


              The location record is directionally stable even if the exact street address has changed across
              third-party databases. Multiple retained sources place the company in New York City. Bizprofile’s 2025
              filing snapshot lists Mark43, Inc. at 8 West 40th Street, 2nd Floor, New York, while ZoomInfo places
              headquarters at 27 West 24th Street, 5th Floor, New York. The exact office suite is therefore not fully
              settled from public web evidence, but the city-level headquarters conclusion is strong. The platform
              description is stronger than the address detail: across retained official pages, Mark43 consistently
              markets an integrated public-safety stack that emphasizes compliance, mobile responsiveness, and real-time
              data sharing rather than isolated departmental modules.
