      - number: '1.3'
        title: Capital history, valuation resets, and ownership signals
        blocks:
          - type: paragraph
            body: >-
              The capital story is both impressive and messy, which is exactly why it matters in diligence. Mark43’s
              last clean, official major financing disclosure is the July 2021 Series E announcement: $101 million led
              by The Spruce House Partnership and Tiger Global, taking publicly disclosed cumulative funding to $257
              million and reinforcing prior unicorn-era positioning. After that, the public record fragments. Mark43
              officially announced a $55 million fundraising round led by General Catalyst on March 29, 2024. Prime
              Unicorn Index separately reported that on March 26, 2024 Mark43 authorized a new Series F round at $1.87
              per share, implying a pre-money valuation of roughly $206 million and an 86.7% markdown from the prior
              preferred price. CB Insights adds a third version, describing the latest round as a $40 million Series F
              closed on May 31, 2024.


              Late-2025 financing is even less transparent in retained public evidence. Premier Alternatives, an
              alternative-data marketplace, lists Mark43 at a $1.0 billion valuation as of October 30, 2025 with $319.1
              million total funding and a $50 million later-stage VC round in October 2025. Retained official Mark43
              pages reviewed for this chapter do not include a matching 2025 fundraising press release. The right
              diligence read is therefore not that the 2025 recap definitely did or did not happen, but that Mark43’s
              public financing trail contains significant disclosure gaps and contradictory third-party records after
              the 2021 Series E. Investors should treat the 2025 unicorn-restoration marker as a medium-confidence
              secondary-market signal until management provides board materials, financing documents, and a reconciled
              funding timeline.
