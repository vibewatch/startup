      - number: '3.3'
        title: Distribution, switching costs, and coopetition
        blocks:
          - type: paragraph
            body: >-
              Distribution power is one of the biggest competitive separators. Motorola and Tyler benefit from
              long-standing public-sector procurement familiarity and wider product estates. CentralSquare and Hexagon
              can pitch broader modernization paths than a single workflow replacement. Axon can bundle adjacent assets
              in records, evidence, RTCC, and now 911 communications. Mark43’s own ecosystem strategy is visible too:
              the Axon Fusus partner page and the ForceMetrics partnership both show that the company can participate in
              a wider interoperability layer rather than insisting on total product isolation.


              That interoperability is strategically useful but it also blurs competitive boundaries. The same partner
              can become a rival when agency buyers decide whether to consolidate more workflow spend under one
              umbrella. Switching costs in public-safety software remain meaningful because data migration, training,
              compliance review, and operational cutover are hard. But high switching cost is not the same thing as moat
              certainty. If a larger vendor can promise procurement simplicity, deeper suite breadth, or better
              cross-module bundling, the installed base can still be pressured over time. Mark43’s competitive position
              is therefore strengthened by integrations and workflow depth, yet partially weakened by the fact that the
              public-safety ecosystem is converging toward platform bundles.
