      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The public file supports a real Mark43 differentiation story, but not an unassailable moat. The company
              clearly looks more modern than many legacy public-safety stacks, and its product surfaces connect CAD,
              RMS, analytics, mobile response, AI tooling, compliance, and partner integrations. That is valuable for
              agencies trying to replace fragmented workflows rather than just add one new screen. The evidence also
              supports a practical weakness: Mark43 does not look unique on the basis of modernity alone. Carbyne,
              CentralSquare, Tyler, Motorola, Hexagon, and Axon/Prepared all market modernization, integration, cloud
              progression, or AI in some form.


              The strongest adverse signal for Mark43 in the retained 2026 file is not one single head-to-head loss. It
              is the structure of the competitive field. Public pricing is opaque, buyer switching is institutional, and
              some of the largest rivals can bundle adjacent modules or exploit procurement familiarity. Axon’s Prepared
              acquisition is especially notable because it extends a broader law-enforcement platform closer to the
              emergency-communications edge. The right diligence conclusion is that Mark43 appears meaningfully
              competitive, but its durability depends on win-rate proof, renewal resilience, pricing discipline, and
              module expansion evidence that the public record still does not disclose.
