    - Police, fire, EMS leaders; municipal IT; public-safety agencies
    - Core market
  - - RMS / reporting / records
    - Incident reporting, records, compliance, evidence-linked data, audit trails
    - Generic back-office document storage with no operational workflow role
    - Records divisions, chiefs, municipal/public-safety IT
    - Core market
  - - Analytics / intelligence
    - Dashboards, trend analysis, intelligence sharing, real-time data visibility
    - Standalone BI purchased without workflow integration
    - Command staff, analysts, intelligence units
    - Core-to-adjacent market
  - - Mobile field response
    - Officer/field mobile apps, GPS context, device-first workflows
    - General consumer mobile productivity apps
    - Patrol leaders, dispatch, line officers, field responders
    - Core-to-adjacent market
  - - NG911 and interoperability layer
    - ESInet-adjacent workflow software, multimedia data handling, interagency sharing
    - Pure network transport, tower, or fiber spend
    - 911 authorities, ECCs, public-safety agencies
    - Important adjacent market
  - - Broader public-sector systems
    - Justice, ERP, budgeting, permitting, generalized case management
    - Hardware, payroll, facilities, unrelated civic software
    - Government CIOs and cross-department buyers
    - Mostly adjacent or substitute spend
