chapter:
  number: 2
  title: Market Analysis
  summary: Mark43 sells into a layered public-safety software market that spans dispatch, records, analytics, mobile workflows, and adjacent AI, but narrows quickly once procurement readiness, security, and migration capacity are considered. Public market evidence supports real modernization demand—Frost’s $1.19B 2026 U.S. NG911 revenue lens, Intrado’s $5.8B-$9.27B funding gap, and widespread buyer interest in AI, cloud, and integrated data—but those figures measure different things. The practical conclusion is that Mark43 addresses a durable and valuable market, yet one that monetizes on government timelines rather than on typical enterprise-SaaS cycles.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary and status-quo substitutes
  body: 'Mark43 sells into a layered public-safety software market rather than one clean product category. Its own product pages and customer materials show a stack that spans CAD, RMS, analytics, mobile field response, and newer AI-assisted workflows. That means the relevant market is broader than records management alone, but still narrower than all public-safety spend. Included dollars are operational software for dispatch, reporting, intelligence, mobile response, integrations, and compliance. Excluded dollars include physical radios, vehicles, body cameras, telecom carriage, and generic municipal ERP systems unless they directly govern the operational workflow Mark43 is replacing.


    The substitute set is equally layered. Some agencies still rely on legacy on-premise CAD or RMS systems, paper-heavy reporting, or fragmented point products joined by custom integrations. Others prefer full-suite incumbents such as Motorola, Tyler, or CentralSquare. Still others modernize only the NG911 communications edge first, leaving workflow software for later. That structure matters for valuation because it means the headline public-safety modernization story is large, but Mark43’s actual capture pool depends on which buyers are ready to replace operational software, not merely to fund adjacent infrastructure.'
