- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI support for administrative relief
    - Positive
    - Near term
    - Helps justify report writing, summarization, and workflow automation tools
    - Measure actual attach rates and productivity gains by agency.
  - - Cybersecurity and resilience pressure
    - Positive
    - Near term
    - Pushes buyers toward modern, secure, auditable cloud platforms
    - Request win-loss evidence where security was decisive.
  - - Cloud and mobile adoption
    - Positive
    - Near term
    - Supports field-first dispatch and RMS usage beyond vehicles and desks
    - Quantify mobile usage and impact on overtime or response quality.
  - - NIBRS / reporting standardization
    - Positive
    - Ongoing
    - Creates urgency for structured RMS and data-quality systems
    - Map how much of demand is mandate-driven versus discretionary.
  - - Funding uncertainty and public budgeting
    - Negative
    - Ongoing
    - Can delay projects even when operational need is obvious
    - Review grants, matching requirements, and funding-source mix.
  - - Procurement and compliance burden
    - Negative
    - Ongoing
    - Lengthens cycles and raises cost of sale
    - Request median sales-cycle length and stage-by-stage conversion.
  - - Legacy integration and migration readiness
    - Negative
    - Ongoing
    - Narrows SAM to agencies willing to do workflow change and data migration
    - Review implementation cost, cutover duration, and failure rates.
  - - Staffing burnout and limited IT capacity
    - Mixed
    - Ongoing
    - Creates demand for better tools but reduces the time available to deploy them
    - Request implementation staffing assumptions and training load.
  notes: Most forces that make the market attractive also slow conversion. Modernization need is high, but procurement, readiness, and staffing create a long-duration adoption curve.
