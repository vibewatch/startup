- id: sizing-lenses-and-constrained-sam
  title: Sizing lenses and constrained TAM/SAM/SOM
  body: 'Public sizing for Mark43’s market is definition-sensitive, so this chapter preserves multiple lenses instead of pretending there is one universal TAM. Frost & Sullivan gives the clearest accessible slice for the dispatch-adjacent layer: U.S. NG911 revenue rising from $888.1 million in 2021 to $1.19 billion in 2026 at a 6.1% CAGR. That is useful because it captures software and service modernization around multimedia emergency workflows, but it still does not equal Mark43’s full target market. Mark43 also competes in RMS, analytics, mobile response, and integrated cloud operations outside the strict NG911 definition.


    Other sources measure capital need, not annual market revenue. Intrado says $5.8 billion to $9.27 billion in funding is still required to complete nationwide NG911 modernization, while 911.gov points to prior grant programs such as the 2019 $109 million award cycle and the 2009 Enhanced 911 grant program. Those figures are not contradictions; they describe different layers of spend. A broad outer TAM can therefore include global police software estimates like the $11.6 billion figure cited in Inc.’s Mark43 profile, but a practical Mark43 SAM is much narrower: the subset of law-enforcement and public-safety agencies ready to buy cloud-native dispatch, records, analytics, and AI workflow software on public-sector procurement timelines.'
