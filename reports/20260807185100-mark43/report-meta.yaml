  foundingLocation: Harvard / Cambridge, Massachusetts origin story; the public file most consistently places the company's formation in the 2012-2013 period.
  headquarters: New York, NY, USA
  productSummary: >-
    Mark43 sells an integrated public-safety software stack spanning cloud-native CAD, RMS, analytics, data platform,
    mobile workflows, ecosystem integrations, and newer AI-assisted modules such as ReportAI and BriefAI.
  customerFocus: >-
    Primary customers are law-enforcement and public-safety agencies, with evidence concentrated in city police departments,
    sheriff departments, and adjacent public-sector modernization environments.
  businessModel: >-
    The public file implies a mission-critical government software model monetized through platform subscriptions plus
    implementation, support, compliance-heavy onboarding, and other services attached to public-sector deployments.
  stage: Growth-stage private
  fundingStatus: >-
