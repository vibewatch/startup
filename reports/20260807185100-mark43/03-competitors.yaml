  rows:
  - - Mark43
    - Focal company / cloud-native operations platform
    - 300+ agencies cited in 2026 public materials; FedRAMP High and partner ecosystem signals
    - Law-enforcement agencies, dispatch centers, federal/campus/transportation public-safety users
    - Integrated CAD, RMS, analytics, mobile workflows, compliance posture
    - No public pricing, win-rate, or module-level revenue disclosure
  - - Motorola Solutions
    - Incumbent command-center suite
    - Large public company with broad command-center software estate
    - State and local agencies replacing or extending legacy dispatch and command software
    - Installed-base distribution, command-center breadth, NG911 modernization path
    - Public proof here is broad suite positioning rather than Mark43-specific workflow superiority
  - - Tyler Technologies
    - Incumbent public-sector suite
    - Large public-sector software vendor with public-safety footprint and embedded AI narrative
    - Jurisdictions preferring purpose-built public-sector software from an existing vendor
    - Government distribution, integrated civic relationships, public-safety adjacency
    - Less visibly centered on law-enforcement-first cloud CAD/RMS ergonomics than Mark43
  - - CentralSquare
    - Incumbent cloud public-safety suite
    - Large public-safety and justice vendor with NG911 and suite breadth
    - Agencies replacing dispatch, records, and related public-safety workflows
    - Suite replacement pitch, NG911, justice/public-safety adjacency
    - Modernization story may be broader than a focused agency workflow appeal
  - - Axon / Prepared
    - Adjacent-to-direct platform rival
    - Prepared acquisition extends Axon from evidence/records ecosystem into AI-powered 911 communications
    - Agencies wanting broader public-safety bundle plus 911 workflow innovation
    - Bundle power, AI-led call handling, wider ecosystem from call to closure
    - Overlap with Mark43 is strongest at communications and workflow edge, not identical across all modules
  - - Carbyne
    - Direct cloud-native emergency communications rival
    - Cloud-native emergency response platform with Axon 911 Core branding visible on homepage
    - PSAPs modernizing cloud call handling, multimedia intake, and analytics
    - Cloud-native communications, resilience, integrations, NG911-ready narrative
    - Less visible public proof on RMS depth than Mark43
  - - Priority Dispatch
    - Protocol / triage substitute
    - Specialist dispatch-software and protocol provider
    - Emergency dispatch centers prioritizing code-assignment and scripted triage quality
    - Decision-support depth and dispatch protocol specialization
    - Not a full public-safety operations suite or RMS/CAD replacement
  - - Hexagon
    - Incumbent incident-management alternative
    - Large industrial/software platform with public-safety solutions estate
    - Agencies needing command, response, and incident-management modernization
    - Response and incident-management credibility, broader critical-infrastructure presence
    - Public overlap evidence is broader and less law-enforcement-workflow specific than Mark43
