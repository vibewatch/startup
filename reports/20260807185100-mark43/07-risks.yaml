- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk area
  - Mitigation path
  - Kill criterion if unresolved
  rows:
  - - Security and resilience
    - Show clean incident record, regular testing, backup workflow proof
    - Any severe unresolved security event or failed continuity test in core workflow
  - - AI governance
    - Show low error rates, strong oversight, and clear audit logs
    - Meaningful AI workflow deployment without measurable quality controls
  - - Customer concentration
    - Show diversified ARR and manageable implementation load
    - Top-customer concentration or services burden materially above plan
  - - Procurement conversion
    - Show predictable public-sector cycle and bookings discipline
    - Persistent slippage with no visibility into funnel conversion
  - - Financing resilience
    - Show adequate runway and no hidden round overhang
    - Runway shortfall or cap-table surprises inconsistent with 2025 headline
  - - Partner dependency
    - Show fallback paths and manageable reliance on key connectors
    - Critical workflows depend on one partner with no viable contingency
  notes: These criteria convert a qualitative public risk file into hard diligence thresholds.
