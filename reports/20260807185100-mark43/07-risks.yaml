  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: security and outage history
    missingEvidence: Incident history, uptime records, DR test results, backup-mode performance, and security audit outcomes.
    whyItMatters: The public file proves risk awareness, not whether Mark43 has actually cleared mission-critical reliability thresholds.
    diligencePath: Request incident log, uptime SLAs, DR exercises, penetration tests, and major remediation history.
    relatedQuestionRefs:
    - QR005
    - QR006
    - QR019
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: AI quality governance
    missingEvidence: Live error rates, override rates, audit outcomes, and customer usage policies for AI-assisted report and summary features.
    whyItMatters: AI governance is a core trust issue in police workflows and cannot be underwritten from policy pages alone.
    diligencePath: Request AI evaluation reports, approval workflow, audit logs, and customer adoption guardrails.
    relatedQuestionRefs:
    - QR008
    - QR019
    - QR024
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: customer and services concentration
    missingEvidence: Top-customer ARR share, support burden by account, services staffing intensity, and churn/NRR by segment.
    whyItMatters: Concentration and services drag can transform a seemingly attractive mission software business into a fragile one.
    diligencePath: Request top-customer concentration, implementation staffing, and gross-margin bridge by services versus software.
    relatedQuestionRefs:
    - QR016
    - QR021
    - QR025
    relatedTableRefs:
    - TR003
    - TR004
    - TR005
  - type: conflicting-data
    severity: material
    topic: capital resilience after 2024 reset
    missingEvidence: Current runway, financing rights, liquidation preference stack, and any unresolved 2024-2025 round terms.
    whyItMatters: Operating risk becomes existential faster when cap-table or runway reality is weaker than the headline narrative.
    diligencePath: Request cap table, cash balance, monthly burn, covenant or preference terms, and downside financing scenarios.
    relatedQuestionRefs:
    - QR003
    - QR023
    - QR025
    relatedTableRefs:
    - TR004
    - TR005
