- id: mitigation-priorities-and-kill-criteria
  title: Mitigation priorities and kill criteria
  body: 'The risk posture is not fatal, but it is highly diligence-sensitive. Most of the major risks have plausible mitigations: stronger security controls, better backup workflows, disciplined AI governance, more balanced customer mix, diversified product adoption, and tighter financial controls. The problem is that the public file proves the existence of these categories more convincingly than it proves their effectiveness. Investors therefore need to translate the risk chapter into a small set of hard kill criteria tied to concentration, security incidents, financing deterioration, and implementation quality.


    The easiest mistake would be to treat Mark43 as ordinary SaaS and underweight mission risk. This company lives at the intersection of law-enforcement data, emergency workflows, public procurement, and private financing. A mild commercial miss can therefore combine with a severe trust or policy shock. The right underwriting response is to demand crisp metrics that tell whether Mark43 is becoming more resilient as it scales or merely more complex.'
