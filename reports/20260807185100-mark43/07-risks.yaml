tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk
  - Why it exists
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Procurement-cycle slippage
    - Government software demand must clear formal procurement and budget approvals
    - High
    - Request median sales-cycle length, stage conversion, and backlog aging
  - - Grant / appropriation dependency
    - Agency modernization can wait on public funding cycles
    - High
    - Request revenue mix by grant-funded versus budget-funded deals
  - - NG911 / standards compliance drift
    - Rules and modernization expectations can shift product requirements
    - Medium-high
    - Request roadmap alignment with FCC / NG911 obligations
  - - AI governance scrutiny
    - Law-enforcement AI use can trigger oversight concerns if controls fail
    - High
    - Request error rates, overrides, and auditability evidence
  - - Civil-liberties or oversight backlash
    - Police-technology deployments can face public-trust criticism even without formal enforcement
    - Medium
    - Request product governance materials and community-risk playbooks
  - - Contracting complexity across public entities
    - State, county, city, and federal buyers require different vehicles and reviews
    - Medium-high
    - Request contract-vehicle mix and stall reasons by segment
  notes: The legal/regulatory risk is less about one current lawsuit and more about constant exposure to public-sector rules, scrutiny, and process friction.
