  - - Dispatch or workflow outage
    - Operational downtime directly affects public-safety execution
    - High
    - Request uptime history, DR testing, and alternate-CAD activation evidence
  - - AI output quality failure
    - Report or briefing errors can create legal and operational issues
    - High
    - Request AI evaluation framework and supervisory controls
  - - Implementation / migration failure
    - Data conversion and workflow cutover are inherently risky
    - Medium-high
    - Request time-to-go-live, failure rates, and postmortems
  - - Support-capacity shortfall
    - High-touch customers may require more operational support than anticipated
    - Medium-high
    - Request support staffing ratios and escalation metrics
  - - Control fatigue / complexity
    - Expanding product breadth and integrations can outpace control maturity
    - Medium
    - Request architecture review and control ownership map
  notes: Operational risk is amplified because Mark43 is not peripheral software; it can sit directly in mission workflows.
