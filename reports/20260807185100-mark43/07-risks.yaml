chapter:
  number: 7
  title: Risks
  summary: Mark43's main risks cluster around public-sector procurement friction, cybersecurity and resilience, AI governance, partner dependency, and execution after a materially weaker 2024 financing signal. The public file shows that management recognizes many of these risks, but it does not yet disclose the operational metrics needed to prove that the mitigation system is working.
sections:
- id: regulatory-legal-and-procurement-risks
  title: Regulatory, legal, and procurement risks
  body: 'Mark43 sells into a buyer environment where regulation and procurement are not side constraints; they are core determinants of revenue timing and customer quality. 911.gov, CISA, and the FCC all show that NG911, cybersecurity, and public-sector modernization are governed by funding rules, standards, and institutional readiness. SAM.gov adds the practical reality beneath that policy stack: government software still moves through formal procurement machinery. That creates stickiness after adoption, but it also creates long sales cycles, dependence on appropriations or grant timing, and the risk that demand remains real while bookings slip.


    The capital record makes this risk more tangible. Prime Unicorn Index reports that Mark43 authorized a sharply lower-priced Series F in 2024 at an implied roughly $206 million pre-money valuation, even though the company also announced a $55 million fundraising round that same month. Whether or not every private-market figure is perfectly precise, the broad signal is clear: public-sector software can face severe repricing when growth expectations, market conditions, or financing leverage deteriorate. For Mark43, the regulatory/procurement risk is therefore inseparable from financing risk.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
