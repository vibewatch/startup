      - number: '8.4'
        title: 建议与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              只看公开资料，正确的估值立场应谨慎，但不应直接否定。Mark43 确实有足够真实的产品、客户和市场证明， 可以在有意义的估值上开展严肃尽调。公开网络材料不能支撑的，是盲目接受 $1.0 billion
              这个精确标记。 太多决定投资判断的输入仍是私有信息：当前收入、留存、毛利率、服务组合、现金续航期、股权结构中的优先级， 以及 2024-2025 年融资的真实条款。


              因此，结论是分析性判断，而不是直接否决。如果收入规模已经足够大，且业务表现更像耐久的任务关键软件， 而不是服务很重的公共部门实施工作，$1.0 billion 估值可以成立。若收入明显更低、集中度高，
              或下行融资风险仍压在股权结构表上，这一估值就很难站得住。投资人应把任何价格讨论绑定到一小组门槛指标， 而不是只绑定叙事信心。
