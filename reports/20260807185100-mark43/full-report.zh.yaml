  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Mark43 面向的是分层的公共安全软件市场，而不是单一干净品类。自身产品页和客户材料显示，其软件栈覆盖 CAD、RMS、分析、移动现场响应和较新的 AI
              辅助工作流。因此，目标市场比记录管理本身更宽，但仍窄于全部公共安全支出。应计入的支出包括用于调度、报告、情报、移动响应、集成和合规的运营软件；不计入的支出包括实体无线电、车辆、执法记录仪、通信传输和通用市政
              ERP 系统，除非它们直接控制 Mark43 正在替换的运营工作流。

              替代方案同样分层。有些机构仍依赖旧有本地部署 CAD 或 RMS 系统、纸质负担很重的报告流程，或靠定制集成拼在一起的碎片化单点产品。另一些机构偏好 Motorola、Tyler 或 CentralSquare
              等全套件老牌厂商。还有一些机构先只现代化 NG911 通信边缘，把工作流软件留到以后。该结构会影响估值：公共安全现代化这个头部故事很大，但 Mark43
              实际可获取的池子取决于哪些买方准备替换运营软件，而不只是愿意为相邻基础设施买单。
