      - number: '7.4'
        title: 缓释优先级和否决标准
        blocks:
          - type: paragraph
            body: >-
              风险格局还不到致命，但尽调敏感度很高。多数重大风险都有可行缓释路径：更强的安全控制、更好的备份工作流、 有纪律的 AI
              治理、更均衡的客户结构、更多元的产品采用，以及更紧的财务控制。问题在于，公开材料更能证明这些风险类别存在， 却不能同样有力地证明缓释措施有效。因此，投资人需要把风险章节压缩成一小组硬性否决标准，
              直接绑定集中度、安全事件、融资恶化和实施质量。


              最容易犯的错，是把 Mark43 当作普通 SaaS，看轻任务风险。这家公司处在执法数据、应急工作流、公共采购和私人融资的交叉点。
              一次轻微商业失手，也可能和严重信任或政策冲击叠加。正确的投资审查方式，是要求清晰指标， 判断 Mark43 规模扩大时是在变得更有韧性，还是只是变得更复杂。
