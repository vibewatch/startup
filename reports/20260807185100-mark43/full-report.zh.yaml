      - - 实施集中
        - 高接触公共部门部署会吃掉交付产能
        - 推广延迟会同时影响增长和利润率
        - 要求提供服务人员配置和部署积压数据
      - - 分层集中
        - 虽有相邻场景，执法机构集中度仍高
        - 单一分层的预算冲击会拖慢增长
        - 要求按城市 / 县 / 州 / 联邦 / 相邻场景拆分收入
      - - 模块集中
        - 核心 RMS / CAD 的经济贡献可能高于新模块
        - 较新的路线图层级可能尚未分散收入
        - 要求提供产品级 ARR 和附加率
      - - 证据集集中
        - 公开引用对赢单的证明强于续约
        - 公开网页证据可能高估耐久性
        - 要求提供续约 / 流失同期群和按同期群拆分的 NRR
      - - 地域集中
        - 许多引用集中在美国公共安全买方
        - 区域采购周期可能负向同步
        - 要求提供地域收入结构和销售管线多元化
