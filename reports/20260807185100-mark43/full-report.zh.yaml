  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心估值与公开参照点
        blocks:
          - type: paragraph
            body: >-
              已保留公开材料中，当前最清晰的标记来自 Premier Alternatives 2025 年 10 月数据：Mark43 估值 $1.0 billion， 后期轮融资 $50 million，累计融资
              $319.1 million。这个标记方向上有吸引力，因为它意味着公司从 Prime Unicorn Index 报告的 2024 年严重估值重置中恢复。 但它本身也很脆弱，因为 CB Insights 和
              Mark43 官方披露对 2021 年后的同一融资阶段说法不一致。 因此，投资人应把 $1.0 billion 当作情景分析可用的标记，而不是完全核对过的事实。


              2024 年估值下调轮背景很关键，因为它划定了风险边界。Prime 描述的是隐含约 $206 million 的投前估值重置； Mark43 自己在 2024 年 3 月宣布 $55 million 融资轮，CB
              Insights 随后又记录了 2024 年 5 月的 $40 million Series F。 这些差异并不小。它们会改变稀释、优先权堆栈含义，也会影响对 2025 年反弹的解读：
              到底是真正经营恢复，还是一次公开材料看不到条款的后期融资事件。
