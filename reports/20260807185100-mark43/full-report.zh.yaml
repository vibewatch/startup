  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品栈与架构
        blocks:
          - type: paragraph
            body: >-
              保留的产品材料显示，Mark43 已不再是简单的 CAD/RMS 供应商。当前软件栈覆盖运营应用、现代数据平台、数据湖、原生分析、AI 辅助报告和简报、移动响应工具、收押登记、电子传票、备用 CAD
              韧性，以及连接外部生态的集成层。因此，最适合把它理解为一个架在共享数据层和信任层之上的工作流平台，而不是一组彼此无关的单点产品。

              这种平台逻辑很重要，因为机构购买多个模块时，产品价值会复合。CAD、RMS、移动响应、分析和相邻 AI 如果共享同一套运营数据模型和合规外壳，会更有用。公开来源还显示，Mark43
              正把平台推向更强互操作，而不是更紧的隔离：集成生态页面、AWS 页面、Axon 合作伙伴页面、ForceMetrics 合作和 RapidSOS 合作都暗示，公司预期客户会生活在更广的公共安全技术环境里。
