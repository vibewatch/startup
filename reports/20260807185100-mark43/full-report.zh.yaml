        title: 护城河耐久度与反向证据
        blocks:
          - type: paragraph
            body: >-
              公开材料支持一条真实的 Mark43 差异化故事，但还不能证明护城河牢不可破。公司显然比许多旧公共安全软件栈更现代，产品形态把 CAD、RMS、分析、移动响应、AI
              工具、合规和合作伙伴集成连在一起。机构如果想替换碎片化工作流，而不只是新增一个屏幕，这种能力有价值。证据也支持一个实际弱点：仅靠现代性，Mark43
              并不独特。Carbyne、CentralSquare、Tyler、Motorola、Hexagon 和 Axon/Prepared 都在某种形式上营销现代化、集成、云演进或 AI。

              本次保留的 2026 年材料中，Mark43 最强的反向信号不是某一场可见的正面对决失利，而是竞争场的结构。公开定价不透明，买方切换具有机构属性，一些最大对手能够捆绑相邻模块或利用采购熟悉度。Axon 收购
              Prepared 尤其值得注意，因为这把一个更广的执法平台推近了应急通信边缘。正确的尽调结论是，Mark43
              看起来有实质竞争力，但其耐久度取决于胜率证据、续约韧性、定价纪律和模块扩张证据，而公开记录仍未披露这些。
