  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 估值判断应从 $1.0B 标记出发，再看收入可见度、可比公司视角和风险折价，而不是套一个简单静态倍数。
    data:
      nodes:
        - id: v1
          label: $1.0B 账面标记
          detail: Premier Alternatives 在 2025 年末给出的估值点
        - id: v2
          label: 收入未知
          detail: 当前规模决定账面估值到底便宜还是昂贵
        - id: v3
          label: 公开可比公司
          detail: Tyler 和 Motorola 把公开市场参照锚在中高个位数倍数
        - id: v4
          label: 质量折价
          detail: 采购、客户集中、服务投入和股权结构不确定性会拉宽区间
        - id: v5
          label: 谨慎推进
          detail: 值得继续尽调；公开信息还无法完全支撑定价
      edges:
        - from: v1
          to: v2
          label: 必须对照检验
        - from: v2
          to: v3
          label: 拿来对比
        - from: v3
          to: v4
          label: 再据此调整
        - from: v4
          to: v5
          label: 导向
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV030
      - CV031
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在 $1.0B 账面估值不变时，只有 Mark43 已经达到有意义且未披露的收入规模，隐含收入倍数才会明显下降。
    data:
      items:
        - label: 如果收入为 $50M
          value: 20
        - label: 如果收入为 $75M
          value: 13.3
        - label: 如果收入为 $100M
          value: 10
        - label: 如果收入为 $150M
          value: 6.7
        - label: 如果收入为 $200M
          value: 5
        - label: 如果收入为 $250M
          value: 4
    approximationNotes: 柱状图展示隐含市值 / 收入倍数，因为 Mark43 未公开披露当前收入。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 给区间比给单点估计更站得住脚，因为 2024 年重置和 2025 年反弹让信息质量缺口拉得很大。
    data:
      items:
        - label: 悲观
          low: 0.25
          value: 0.35
          high: 0.45
          unit: $B
        - label: 基准
          low: 0.7
          value: 0.82
          high: 0.95
          unit: $B
        - label: 当前账面估值
          low: 0.95
          value: 1
          high: 1.05
          unit: $B
        - label: 乐观
          low: 1.1
          value: 1.25
          high: 1.4
          unit: $B
    approximationNotes: 区间是分析性情景带，锚定公开融资标记、同业参照和信息披露缺口折价，并非正式 DCF。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV018
      - CV022
      - CV026
      - CV028
      - CV029
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分把公开估值档案压缩成一张决策快照。
    data:
      items:
        - label: 市场重要性
          score: 4
          detail: 任务关键型品类，现代化需求持久
        - label: 客户 / 产品证明
          score: 4
          detail: 产品和机构案例都有真实广度
        - label: 收入可见度
          score: 1
          detail: 当前收入未公开披露
        - label: 估值清晰度
          score: 2
          detail: 2024-2025 年融资轨迹存在实质不一致
        - label: 仅凭公开信息的确信度
          score: 2
          detail: 足以支撑尽调，但不足以盲目接受价格
    claimRefs:
      - CV018
      - CV019
      - CV022
      - CV030
      - CV031
      - CV032
      - CV033
      - CV040
