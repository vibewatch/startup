      - number: '7.3'
        title: 合作伙伴、依赖、人员与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Mark43 的产品策略确实带来合作伙伴和执行依赖。AWS、Axon、ForceMetrics、RapidSOS 扩大了产品效用，
              也增加了外部依赖。关键集成一旦出问题，合作伙伴变成更强竞争者，或客户转向更大平台套件标准化， 原本拓宽产品面的生态也会削弱独立性。在 Motorola、Tyler
              等老牌厂商已经握有采购筹码和更大装机基础的市场里， 这一点尤其重要。


              人和执行风险更难量化，但已经可见。公司 2024 年 12 月聘任新 CFO，并在同年早些时候引入 Teresa Carlson 担任董事会观察员，
              这说明融资波动后，组织正在切换到新的运营阶段。这可能是好事，但也说明规模化、治理和财务纪律仍是管理层正在处理的挑战，
              不是已经解决的问题。公开材料没有说明领导层变动、实施人员配置或服务强度正在改善还是正在拖累单位经济模型。
