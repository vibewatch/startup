      - number: '3.2'
        title: 能力重叠与定价可见度
        blocks:
          - type: paragraph
            body: >-
              调度、记录、分析和集成上的功能重叠相当实质，但同样的词在不同供应商那里含义不同。Mark43 官方页面强调直观 CAD、高性能 RMS 和原生分析。Motorola 与 CentralSquare
              呈现更广的指挥中心和 NG911 资产。Tyler 销售为公共部门打造的软件，并把 AI 嵌入包括公共安全在内的各类方案。Carbyne 以云原生应急通信平台切入。Axon 现在可以把更广的公共安全版图与
              Prepared 的 AI 驱动 911 工作流结合起来。Priority Dispatch 更窄，但其调度规程和代码分配层可以替代现代 CAD 工作流原本可能捕捉的一部分运营价值。

              整个领域的定价可见度都弱。本章审阅的竞争者页面绝大多数把机构导向联系销售、预约演示或采购主导的动作，而不是公开价目表。这并不表示供应商没有定价纪律；它意味着价格通过模块范围、实施复杂度、合同期限、支持和公共部门采购载体来谈判，而不是挂在开放网络上。对尽调来说，定价比较可以显示打包形态和可能的竞争压力，但看不到真实折扣、实施负担或模块附加经济。
