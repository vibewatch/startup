  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高风险单元集中在采购延误、网络安全或停机事件、AI 治理失效，以及 2024 年重置后的融资脆弱性。
    data:
      columns:
        - 低概率
        - 中概率
        - 高概率
      rows:
        - label: 极高影响
          values:
            - label: 因警务科技滥用触发正式监管或法律行动
            - label: 实际工作流出现重大 AI 质量故障
            - label: 采购严重放缓叠加资金压力
        - label: 高影响
          values:
            - label: 头部客户意外流失
            - label: 重大网络安全事件或停机
            - label: 拨款 / 预算延迟推后签约
        - label: 中等影响
          values:
            - label: 非核心模块伙伴集成失败
            - label: CFO 交接后领导层执行偏航
            - label: 服务投入过重拖累利润率
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR009
      - CR012
      - CR013
      - CR018
      - CR021
      - CR032
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 核心根节点是采购 / 资金摩擦、网络韧性失效和 AI 治理失效；任一节点都可能传导为签约受阻、信任受损、估值受压。
    data:
      nodes:
        - id: n1
          label: 预算 / 采购摩擦
        - id: n2
          label: 网络安全或停机事件
        - id: n3
          label: AI 治理失效
        - id: n4
          label: 上线 / 签约延迟
        - id: n5
          label: 客户信任受损
        - id: n6
          label: 实施负担上升
        - id: n7
          label: 估值 / 融资压力
      edges:
        - from: n1
          to: n4
          label: 导致
        - from: n2
          to: n5
          label: 推动
        - from: n3
          to: n5
          label: 推动
        - from: n4
          to: n7
          label: 加剧
        - from: n5
          to: n7
          label: 扩大
        - from: n2
          to: n6
          label: 抬高
        - from: n6
          to: n7
          label: 压缩
    claimRefs:
      - CR003
      - CR012
      - CR013
      - CR015
      - CR018
      - CR021
      - CR024
      - CR032
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
