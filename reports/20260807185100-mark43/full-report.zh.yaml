            body: >-
              最好的公开证据显示，Mark43 更像关键任务政府软件加服务，而不是轻量自助式 SaaS。联邦定位、FedRAMP
              内容、支持服务、咨询服务和采购指引都指向一种销售动作：评估周期长、部署要投入人工、合规义务重，并且需要持续客户照护。如果软件成为记录系统，这种组合可以产生粘性收入；但实施和高触达支持也可能稀释纯软件毛利。换句话说，仅凭公开证据，Mark43
              可能是一个高价值平台，但未必已经是干净的高毛利 SaaS 年金。

              资本充足性方向上强于经济性可见度。即使用最保守的公开口径，Mark43 已融资远超 $200M；如果 2025 年 Premier 数据方向正确，累计融资很可能超过
              $300M。这让公司比早期创业公司更有融资韧性，2024 年 12 月聘任 CFO 也释放出主动财务治理信号。但保留的公开记录无法支撑现金跑道判断，因为现金余额、烧钱速度、毛利率、净留存率和 ARR
              都未披露。公开融资历史证明的是融资渠道，而不是当前现金效率。
