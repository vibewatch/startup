      - number: '1.4'
        title: 规模里程碑、客户证据与披露摩擦
        blocks:
          - type: paragraph
            body: >-
              客户部署证据显示 Mark43 不是投机性平台。Washington, D.C. 是基础证明点：MPD 认定旧有 Intergraph RMS 会拖累协作和现代化报告后转向 Mark43，最终 RMS 于
              2015 年 8 月在 MPD 和 40+ 个 D.C. 机构上线。该客户案例称，Mark43 迁移了超过十年的历史数据，在五个半星期内培训了 10,000 多名宣誓警员，并取得内部推荐分数中位数
              9/10。后续城市上线显示该模式开始放大。Boston 于 2019 年为 2,700 多名用户上线 Mark43 RMS；Atlanta 于 2020 年上线 Mark43 RMS，并同时提到 NIBRS
              合规进展和 Mark43 当时 100+ 家机构的覆盖。

              近期里程碑也显示，公司正在超越经典记录管理。OnScene 于 2023 年把 CAD 现场信息带到 iOS 和 Android；2024 年的 FedRAMP High 授权强化了联邦和安全定位；BriefAI
              和 ReportAI 标志着 2024 年底更明确的 AI 动作；2026 年趋势报告和 Security Today 报道显示 Mark43 试图围绕带有人类监督的负责任 AI
              定义公共叙事；ForceMetrics 合作则显示公司继续在核心平台之上叠加生态。该部分也暴露了主要披露摩擦：公开客户数证据从 2019 年超过 70 家机构、2020 年超过 100 家，到 2024 年
              250 多家不等，而 Apps Run The World 的公开数据库只展示 12 条已验证客户记录。这个缺口不推翻 Mark43 的规模说法，但意味着外部公开证据集远窄于公司自己的头部叙事。
