  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争类别
        blocks:
          - type: paragraph
            body: >-
              Mark43 面对的不是一个干净的同业集合。保留证据至少指向三类实际竞争者。第一类是 Motorola Solutions、Tyler Technologies、CentralSquare 和 Hexagon
              等广义公共安全套件老牌厂商，它们卖给政府机构，而这些机构本就预期采购流程重、多模块部署和长期运营合同。第二类是 Carbyne 和 Axon 旗下 Prepared 等云原生 911 与应急通信挑战者，重点放在
              AI 辅助受理、云端呼叫处理、多媒体通信和端到端指挥中心现代化。第三类是 Priority Dispatch 等更窄的替代品，即使不替换完整 CAD 或 RMS 资产，也能占住规程和分诊决策支持。

              因此，与 Mark43 的重叠真实存在，但并不均匀。Mark43
              最强的公开呈现，是为想要现代运营记录系统的机构提供一体化调度、记录、分析和移动工作流平台。有些竞争者在调度和工作流上重叠，有些在记录和套件广度上重叠，还有一些只在 911
              边缘或决策支持层重叠。关键在于，买方可以用套件供应商、专业供应商和现状模块的不同组合，解决同一个核心任务——现代化公共安全运营。Mark43 很现代，但并非唯一声称拥有云、AI、集成或公共部门可信度的公司。
