      - number: '1.3'
        title: 融资历史、估值重置与所有权信号
        blocks:
          - type: paragraph
            body: >-
              融资故事既亮眼又混乱，这正是它在尽调中重要的原因。Mark43 最干净的官方重大融资披露，是 2021 年 7 月 Series E 公告：由 The Spruce House Partnership 和
              Tiger Global 领投 $101M，公开披露累计融资达到 $257M，并强化了此前独角兽时代定位。此后公开记录开始碎片化。Mark43 于 2024 年 3 月 29 日正式公告 General
              Catalyst 领投 $55M 融资。Prime Unicorn Index 另行报道称，Mark43 于 2024 年 3 月 26 日授权新的 Series F 轮，每股 $1.87，意味着大约 $206M
              的投前估值，并较上一轮优先股价格下调 86.7%。CB Insights 又给出第三个版本，称最新一轮是 2024 年 5 月 31 日完成的 $40M Series F。

              在保留的公开证据中，2025 年后期融资更不透明。另类数据市场 Premier Alternatives 列示，Mark43 截至 2025 年 10 月 30 日估值为 $1.0B，累计融资
              $319.1M，并在 2025 年 10 月完成一笔 $50M 后期 VC 轮。本章审阅并保留的 Mark43 官方页面没有相匹配的 2025 年融资新闻稿。正确的尽调读法不是断言 2025
              年资本重组肯定发生或没发生，而是承认 2021 年 Series E 之后，Mark43 的公开融资轨迹存在重大披露缺口和相互矛盾的第三方记录。管理层提供董事会材料、融资文件和对齐后的融资时间线之前，投资人应把
              2025 年重回独角兽的锚点视为中等置信度的二级市场信号。
