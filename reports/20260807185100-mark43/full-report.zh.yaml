chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台与地点记录
        blocks:
          - type: paragraph
            body: >-
              在私有公共安全软件供应商中，Mark43 当前定位少见地清晰。公司现有公司页和产品页反复将其描述为一个安全的一体化公共安全技术平台，核心是云原生 CAD、RMS、分析、移动和 AI 辅助工作流。本次保留的
              2026 年页面显示，产品面很宽：用于调度的 Mark43 CAD、用于记录的 Mark43 RMS、用于分析的 Insights、用于移动响应的 OnScene，以及 BriefAI、ReportAI 等较新的
              AI 模块。产品宽度很重要，因为 Mark43 看起来已不再是单点工具供应商；更像覆盖调度员、警员、调查员和机构领导层的操作系统层。

              地点记录方向上稳定，尽管具体街道地址在第三方数据库之间有变化。多份保留来源将公司放在纽约市。Bizprofile 的 2025 年申报快照列出 Mark43, Inc. 位于 8 West 40th
              Street, 2nd Floor, New York，而 ZoomInfo 将总部放在 27 West 24th Street, 5th Floor, New
              York。因此，公开网络证据尚不能完全锁定具体办公室套间，但纽约市级总部这一结论很强。平台描述比地址细节更扎实：在保留的官方页面中，Mark43
              始终营销一套一体化公共安全软件栈，重点是合规、移动响应能力和实时数据共享，而不是孤立的部门模块。
