  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与采购风险
        blocks:
          - type: paragraph
            body: >-
              Mark43 销售进入的买方环境里，监管和采购不是边界约束，而是决定收入时点和客户质量的核心因素。911.gov、CISA 和 FCC
              都显示，NG911、网络安全和公共部门现代化受资金规则、标准和机构准备度支配。SAM.gov
              补上了政策栈之下的实际情况：政府软件仍通过正式采购机器推进。这让采用后的粘性更强，但也带来销售周期长、依赖拨款或补助节奏，以及需求真实但签约延后的风险。

              融资记录让这一风险更具体。Prime Unicorn Index 报道，Mark43 在 2024 年授权了一轮价格大幅降低的 Series F，隐含大约 $206M 投前估值，尽管公司同月也公告了 $55M
              融资。无论每个私有市场数字是否完全精确，广义信号很清楚：当增长预期、市场环境或融资杠杆恶化时，公共部门软件可能遭遇严重重定价。对 Mark43 来说，监管/采购风险因此与融资风险不可分割。
