      - 缓释措施 / 尽调问题
    rows:
      - - 融资降估后的执行压力
        - 2024 年估值下调说明战略漂移空间不大
        - 高
        - 要求提供董事会计划、现金跑道情景和 KPI 纪律
      - - 领导层交接风险
        - 新 CFO 和更新后的董事会 / 观察员层意味着组织在变化
        - 中高
        - 要求提供组织架构稳定性和财务负责人授权
      - - 服务交付强度拖累
        - 偏重支持的部署会压低利润率，并增加招聘需求
        - 中高
        - 要求提供实施人员配置和毛利率趋势
      - - 国际 / 细分市场扩张复杂度
        - 联邦、校园、交通和英国项目叠加，执行负荷更重
        - 中
        - 要求提供分板块 P&L 和扩张 ROI
      - - 商业化聚焦风险
        - 产品和买方范围过宽，可能稀释运营重心
        - 中
        - 要求提供产品优先级和销售分层纪律
    notes: 私营公司一边拓宽范围，一边修复或守住估值叙事时，执行风险都会抬升。
    claimRefs:
      - CR001
      - CR025
      - CR032
      - CR033
      - CR034
      - CR035
  - id: TR005
    title: 缓释措施和否决标准表
    columns:
      - 风险领域
      - 缓释路径
      - 未解决时的否决标准
    rows:
      - - 安全与韧性
        - 展示无重大事故记录、定期测试和备份流程证明
        - 核心流程中任何未解决的严重安全事件，或业务连续性测试失败
      - - AI 治理
        - 展示低错误率、强监督和清晰审计日志
        - AI 工作流有实质部署，却没有可衡量的质量控制
      - - 客户集中度
        - 展示多元化 ARR 和可控实施负荷
        - 头部客户集中度或服务负担显著高于计划
      - - 采购转化
        - 展示可预测的公共部门周期和签约纪律
        - 持续延迟，且看不到漏斗转化
      - - 融资韧性
        - 展示足够现金跑道，且没有隐藏轮次包袱
        - 现金跑道缺口或股权结构表意外，与 2025 年标称估值不一致
      - - 合作伙伴依赖
        - 展示备用路径，以及对关键连接方的可控依赖
        - 关键工作流依赖单一伙伴，且没有可行备选方案
    notes: 这些标准把定性的公开风险文件转成硬性尽调门槛。
    claimRefs:
      - CR018
      - CR021
      - CR029
      - CR032
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 目前公开解读
      - 含义
    rows:
      - - 标称估值
        - $1.0B 的 2025 年 10 月标记存在，但尚未完全对齐
        - 可用于尽调，不能盲目接受
      - - 收入可见度
        - 公开未披露
        - 必须做敏感性分析
      - - 可比公司视角
        - Tyler 和 Motorola 支撑中到高个位数的公开收入倍数视角
        - $1B 是否合理或偏高，取决于收入规模
      - - 风险平衡
        - 关键任务品类，同时有真实融资和执行风险
        - 需求值得关注，不确定性限制确信度
      - - 仅基于公开信息的建议
        - 继续尽调，不接受价格
        - 定价承诺前需要门槛指标
    notes: 本表只基于公开证据，总结估值立场。
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV012
      - CV030
      - CV031
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 视角
      - 支撑证据
      - 反方观点
    rows:
      - - 关键任务工作流平台
        - CAD/RMS/分析/移动端均有真实客户和产品证据
        - 采购周期和信任风险拖慢变现
      - - 规模信号
        - 250+ 到 300+ 家机构口径，加上宽产品面
        - 公开客户标识和收入细节仍不完整
      - - 融资叙事修复
        - 2025 年末 $1.0B 标记暗示反弹
        - 2024-2025 年轮次记录存在重大冲突
      - - 可比质量
        - 公开同业以有意义的收入倍数交易
        - 同业业务组合不同，Mark43 收入未披露
      - - 战略可选项
        - 联邦 / 合规和合作伙伴生态拓宽上行空间
        - 依赖、服务负荷和竞争可能压缩质量
    notes: 投资论点可信，但每个乐观点都对应一个透明度或质量限制条件。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 估值区间
      - 必须成立的条件
      - 主要失败模式
    rows:
      - - 悲观
        - $0.25B-$0.45B
        - 2024 年重估比 2025 年反弹更能反映内在价值
        - 收入规模、利润率或融资质量显著低于预期
      - - 基准
        - $0.70B-$0.95B
        - 业务质量真实，但收入和股权结构表风险需要折价
        - 增长和留存存在，但仍部分偏服务权重，或暴露于集中度风险
      - - 当前标称估值
        - $0.95B-$1.05B
        - 2025 年轮次反映真实复苏和健康运营牵引力
        - 隐藏条款质量或低收入会让标称估值过高
      - - 乐观
        - $1.10B-$1.40B
        - 收入规模、留存和软件利润率已经强于公开记录显示
        - 如果公开证据缺口反映实际弱点而非隐私，论点就失效
    notes: 情景区间是锚定公开标记和缺失信息折价的分析区间，不是完整 DCF。
    claimRefs:
      - CV001
      - CV003
      - CV012
      - CV015
      - CV022
      - CV026
      - CV028
      - CV029
  - id: TV004
    title: 可比估值表
    columns:
      - 公司 / 视角
      - 收入依据
      - 市值依据
      - 隐含市值 / 收入
      - 适用性
    rows:
      - - Tyler Technologies
        - 2025 年收入 $2.332B
        - 市值约 $12.76B
        - ~5.5x
        - 有用的公共部门软件可比公司；业务组合比 Mark43 更宽
      - - Motorola Solutions
        - TTM 收入约 $11.312B
        - 市值约 $78.01B
        - ~6.9x
        - 有用的公共安全邻近可比公司；硬件 / 服务组合比 Mark43 更宽
      - - Mark43 估值 $1.0B、收入 $50M
        - 假设的私营公司收入
        - 私营标称估值 $1.0B
        - 20.0x
        - 意味着溢价倍数
      - - Mark43 估值 $1.0B、收入 $100M
        - 假设的私营公司收入
        - 私营标称估值 $1.0B
        - 10.0x
        - 仍然偏贵，但更容易论证
      - - Mark43 估值 $1.0B、收入 $150M
        - 假设的私营公司收入
        - 私营标称估值 $1.0B
        - 6.7x
        - 接近公开可比公司视角
      - - Mark43 估值 $1.0B、收入 $200M
        - 假设的私营公司收入
        - 私营标称估值 $1.0B
        - 5.0x
        - 相对公开视角会显得保守
    notes: 公开可比公司行使用市值而非企业价值，因为这里能从公开网页核验的来源给出更干净的市值读数，而不是经净债务调整的 EV。
    enumerationScope:
      coverage: sample
      basis: Representative public comparable lenses retained for Mark43 valuation analysis, not an exhaustive peer set.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
  - id: TV005
    title: 论点破裂和否决触发因素表
    columns:
      - 触发因素
      - 重要性
      - 公开状态
    rows:
      - - 收入显著低于敏感性舒适区
        - 会把 $1.0B 变成几乎没有容错空间的溢价倍数
        - 公开未知
      - - 留存或集中度显著弱于预期
        - 会降低经常性收入质量
        - 公开未知
      - - 股权结构表条款或优先权堆栈比叙事显示更差
        - 即使标称估值相同，也会损害普通股价值
        - 公开未知
      - - 服务强度压倒软件利润率论点
        - 会支持更低质量倍数
        - 公开未知
      - - 2025 年反弹缺少持久签约订单或 ARR 支撑
        - 会让重返独角兽叙事变成表面文章
        - 公开未知
    notes: 每个触发因素都是重切估值的硬理由，而不是围绕叙事辩解。
    claimRefs:
      - CV015
      - CV022
      - CV026
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 需要
      - 它为何改变估值
    rows:
      - - 当前 ARR / 收入和增长
        - 决定 $1.0B 意味着 5x、10x、20x 还是更高
      - - 毛利率和服务组合
        - 把可持续软件质量与劳动密集型部署经济性分开
      - - NRR、流失率和集中度
        - 决定经常性收入质量
      - - 股权结构表和 2024-2025 年融资条款
        - 决定标称估值是否转化为真实股权价值
      - - 现金跑道和烧钱速度
        - 决定议价能力和下行融资风险
      - - 产品级附加购买率和联邦牵引力
        - 检验多模块平台扩张的上行空间
    notes: 这些是把估值从叙事推进到投资判断的最短路径答案。
    claimRefs:
      - CV012
      - CV030
      - CV031
      - CV032
      - CV038
      - CV039
      - CV040
