      - number: '5.4'
        title: 成熟度、路线图与产品限制
        blocks:
          - type: paragraph
            body: >-
              产品覆盖很宽，但各模块成熟度不均。CAD、RMS、移动响应、分析和安全姿态等核心运营类别有相当多公开证据。AI
              辅助报告、移动收押登记和生态驱动的情报扩张等较新层很有前景，但证据周期更早。它们在方向上容易相信，因为紧挨既有工作流；商业上更难承做，因为公开记录没有披露使用深度、附加率或经测量的生产率提升。

              公开材料中最大的产品技术限制不是缺少想法，而是缺少量化结果数据。Mark43 显然有连贯架构和真实路线图。投资人仍需要硬证据：实施周期、按 队列看的模块采用、AI
              准确率和使用率、降级模式表现，以及扩张中的集成层到底是提高留存多于增加复杂度，还是相反。做到这些之前，产品投资逻辑在架构上强，在可测经济影响上中等。
