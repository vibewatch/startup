      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              现代公共安全运营软件的需求逻辑真实存在。Frost、FCC、CISA、Intrado、NENA 和 Mark43 自己的 2026
              年调研都指向同一方向：机构正从纯语音或碎片化旧系统，转向数据更丰富、可互操作、云支撑的工作流。需求驱动因素包括 NIBRS 和报告压力、网络安全担忧、移动现场响应、一体化数据要求、减轻职业倦怠，以及对用 AI
              处理行政任务更高的接受度。Mark43 的调研尤其清楚地显示，机构把云和移动工具视为缓解人手短缺的办法，并希望 CAD、RMS 和相邻技术集成起来。

              但市场并非毫无摩擦。Intrado 称几乎每个中心都经历过中断，97% 的 9-1-1 专业人员预计无法工作到退休，并且尚无机构完成完整的 NG9-1-1 Phase 2 实施。Mark43
              的调研称，买方面临的障碍仍包括 IT 人员有限、跨机构协调负担、隐私担忧、旧系统和预算约束。LegalClarity 和 911.gov
              显示，拨款资格和公共资金机制会带来配套资金要求、认证规则和报告义务。实际结论是，Mark43 解决的是持久的现代化需求，但资金、安全和互操作性必须同时过关，因此可服务市场的变现速度慢于商业 SaaS。
