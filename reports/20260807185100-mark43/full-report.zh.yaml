            body: >-
              具名客户证据最强的地方，是 Mark43 同时拥有入选和上线或案例研究证据的账户。Washington, D.C. 仍是最清晰的锚点之一，因为保留客户案例称 Mark43 RMS 于 2015 年 8 月在
              MPD 和 40+ 个 D.C. 机构上线。Boston 既有入选证据，也有上线期新闻稿。Atlanta 有官方上线公告。Lafayette Parish 以多种形式出现——警长 RMS、通信区 CAD 和
              Louisiana 报告合规——使其成为公开材料中记录最丰富的县/区域账户之一。更新的证据通过 Louisiana State Police 的 OnScene 部署、Warren PD、San Diego
              Sheriff、Jefferson County Sheriff、NTSB 证据部署和 Mariposa County Sheriff，进一步扩大了客户集合。

              更广的模式有意义。Mark43
              看起来不是一家只有一个头部标杆客户、其余乏力的公司；更像一个公开案例横跨城市、县、州、联邦和专业机构的平台。弱点仍在公开商业细节：即使客户名称公开，合同价值、席位数、模块附加率、实施周期和续约状态通常也不披露。
