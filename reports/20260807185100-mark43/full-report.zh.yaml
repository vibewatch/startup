      - number: '8.3'
        title: 投资论点、反论点和情景逻辑
        blocks:
          - type: paragraph
            body: >-
              Mark43 估值的多头逻辑很直接。公司服务任务关键的公共安全工作流，已经有清晰标杆客户证明和 250+ 至 300+ 家机构规模信号， 所处现代化类别也足够耐久；到 2025
              年末，公司似乎恢复了独角兽级融资标记。CAD、RMS、分析、移动、联邦 / 合规和 AI 辅助报告等已装产品线， 拼出了可信的多模块平台论点。如果管理层能证明收入规模健康、留存强、利润率像软件业务，$1.0
              billion 的标记未必显得过高。


              反论点同样清楚。公开收入没有披露，2024-2025 年融资记录互相冲突，采购周期很长，竞争格局里还有分销更广的老牌厂商。
              同一份公开材料既支持市场重要性，也支持显著的执行和信任风险。因此，情景逻辑比单点估值更重要。 如果收入偏低、服务强度高，或 2025 年轮次条款带有很重优先权或低质量需求，估值区间必须明显向下拉宽。
              如果增长、利润率和集中度好于公开记录显示，区间也可能向有利方向打开。
