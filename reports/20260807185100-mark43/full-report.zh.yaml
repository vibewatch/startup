      - number: '7.2'
        title: 运营、安全与产品风险
        blocks:
          - type: paragraph
            body: >-
              保留的风险材料在网络安全和韧性上最强。Mark43 已搭建可见的信任层面——安全/合规、Fortified、漏洞披露、负责任 AI 和支持服务——但这些控制的存在本身就说明运营环境容错率极低。Mark43
              自己的网络安全和中断新闻档案强调，许多公共安全组织缺少网络安全专业能力，并担心调度中断；911.gov 和 CISA 则把网络安全定义为 NG911 现代化的结构性要求。产品材料中的 Alternate CAD
              从另一个角度强化了同一信息：机构需要降级模式连续性，因为服务中断不可接受。

              AI 增加了第二层运营风险。ReportAI 和 BriefAI 显然被限定为工作流助手，负责任 AI 页面也显示公司知道监督很重要。但任何用于案件摘要、报告或警务工作流的
              AI，如果生产环境治理失效，都会产生错误、可审计性和信任风险。当前最佳判断是 Mark43 认识到了这一风险，并在尝试管理；公开材料仍未提供所需的实时质量指标，无法确认控制系统在负载下有效。
