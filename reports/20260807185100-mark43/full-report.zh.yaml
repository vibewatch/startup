      - number: '8.2'
        title: 公开可比公司视角和倍数敏感性
        blocks:
          - type: paragraph
            body: >-
              这份材料里最站得住脚的公开可比对象，不是账本不透明的其他私有独角兽，而是具备政府软件或公共安全敞口的上市公司。 MacroTrends 和 CompaniesMarketCap 显示，Tyler
              Technologies 2025 年收入约 $2.332 billion，市值约 $12.76 billion， 对应市值 / 收入口径接近 5.5x。同一来源显示，Motorola Solutions
              最近十二个月收入约 $11.312 billion， 市值约 $78.01 billion，对应口径约 6.9x。这些不是完美的 EV / 收入可比公司， 业务组合也与 Mark43
              明显不同，但它们说明成熟公开同行可以在中高个位数收入倍数区间交易。


              这条口径有用，恰恰因为 Mark43 不公开收入。$1.0 billion 私有估值到底保守还是激进， 取决于收入是 $50 million、$100 million、$150 million，还是更高。若收入为
              $50 million，隐含倍数约 20x。 若为 $100 million，则为 10x。若为 $150 million，则为 6.7x。若为 $200 million，则为 5x。
              没有当前收入数字，估值争论无法靠电子表格式精确解决，只能靠敏感性框住。
