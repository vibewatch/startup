  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历史与披露冲突
        blocks:
          - type: paragraph
            body: >-
              Mark43 的公开融资历史两端最强，中间最弱。保留的官方材料清楚显示，2024 年 3 月 29 日公告了一笔 $55M 融资，2021 年 7 月 12 日公告了 $101M Series
              E，并把披露累计融资推到 $257M。归档的官方报道还捕捉到更早的里程碑：2016 年 $27M Series B、2018 年 $38M Series C，以及 2015 年一篇文章称总融资达到
              $12.8M，其中包括 $10.8M Series A 和 $1.95M 种子资金。这足以显示十年间真实的融资深度和反复的投资人支持。

              但 2021 年之后，公开记录变得显著不一致。Prime Unicorn Index 报道，2024 年 3 月的股价重置意味着大约 $206M 的 投前估值；CB Insights 则把最新融资列为 2024
              年 5 月 31 日的 $40M Series F；Premier Alternatives 又列出 2025 年 10 月一笔后期 $50M 融资、当前估值 $1.0B、累计融资
              $319.1M。这些记录不能被同等视为权威。正确的尽调立场是保留官方事实、保留冲突，并要求管理层在承做任何私有市场估值标记前，对齐轮次标签、轮次规模、股权结构表演进和 2021 年之后的真实估值路径。
