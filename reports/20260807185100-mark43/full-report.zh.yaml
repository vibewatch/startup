      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Mark43 的创始人与市场匹配故事，是其公开身份中最强的部分之一。本次保留的 Inc. 和 Forbes 源新闻页面称，Scott Crouch、Matt Polega 和 Florian Mayr 在
              Harvard 相识，跟随警员影子实习，并在看到陈旧公共安全软件压缩警员时间、拖累数据质量后，把大学后期项目变成公司。创立年份需要留有细节：第三方公司数据库写 2012 年，Inc. 在 2020 年称
              Mark43 是学生在 2013 年创立的公司，而 2019 年 Boston 上线新闻稿称团队自七年前在 Harvard 创立公司以来一直在打磨。最稳妥表述是，公司由这三位联合创始人大约在 2012-2013
              年于 Harvard 创立。

              当前领导层已不再由创始 CEO 直接掌舵。Mark43 的 2026 年领导层页面列出 Bob Hughes 为首席执行官，Scott Crouch 为联合创始人兼董事长，Matt Polega
              为联合创始人、总裁、英国董事总经理以及营销、传播与赋能负责人，Florian Mayr 为联合创始人兼副总裁。董事会层面的治理补充可见但不完整：JD Sherman 于 2023 年 5
              月加入董事会，Teresa Carlson 于 2024 年 5 月成为董事会观察员，Chris Merwin 于 2024 年 12 月加入任
              CFO。缺口仍是完整现任董事会名单、委员会结构、投票权和股权结构表治理。关键在于 Mark43 所处业务是关键任务、公共部门且采购很重；投资人不仅要理解创始人的可信度，也要看清究竟是谁在塑造战略和融资决策。
