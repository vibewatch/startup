      - number: '5.3'
        title: 信任、合规与关键依赖
        blocks:
          - type: paragraph
            body: >-
              在这个品类里，信任层不是可选项。Mark43 的安全和合规页面、FedRAMP 材料、Fortified 控制、负责任 AI
              承诺和联邦定位都显示，产品被设计成能经受安全审查、受监管部署和运营审视。外部来源强化了这一点：911.gov 和 CISA 都把网络安全和 NG911
              韧性定义为现代公共安全系统的结构性要求，而不是可有可无的附加项。

              同一批证据也暴露了依赖。Mark43 依赖机构数据质量、客户迁移投入、合作伙伴集成、云和安全架构，以及 Axon、RapidSOS、ForceMetrics 和 AWS
              等外部生态连接器。这些依赖扩大了效用，但如果集成中断、安全预期快于产品加固，或客户在主工作流受损时需要备用模式，也会带来运营风险。Alternate CAD
              在这方面值得注意，因为它表明韧性和降级模式运营是产品要求，而不只是销售说法。
