        title: 客户旅程、留存与扩张
        blocks:
          - type: paragraph
            body: >-
              即使没有收入队列，公开部署模式也暗示了清晰的客户旅程。机构通常先出现入选或采购证据，再进入实施或上线，随后把使用扩展到更多工作流或相邻机构。Washington, D.C. 显示跨机构深度；Boston
              显示从入选到上线的推进；Lafayette Parish 显示多实体覆盖；Louisiana State Police 显示围绕移动响应的新模块采用；NTSB 的联邦部署显示安全许可路径正在扩大买方集合。

              但公开材料对真实留存的证明弱得多。大多数保留来源庆祝的是赢单或上线，而不是多年续约行为。Axon 和 ForceMetrics
              的公开合作伙伴公告暗示生态扩张，却不能证明净留存或商业耐久度。因此，客户故事最适合理解为良好的客户广度加不完整的生命周期可见度。它支持需求和部署可信度，但不足以完整承做留存经济。
