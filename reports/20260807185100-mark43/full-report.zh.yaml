      - number: '2.3'
        title: 买方、用户、付款方与采购路径
        blocks:
          - type: paragraph
            body: >-
              Mark43 的购买动作是机构化、多利益方的。直接用户包括调度员、巡逻警员、调查员、记录团队、分析师和指挥人员。不同部署里的买方和预算所有者不同：大城市可能牵涉警务领导层、记录单位和市政
              IT；州级或区域项目可能牵涉 911 主管机构、公共安全机构和采购办公室；联邦或受监管客户还会加入安全审查员和合规团队。这种组合让 Mark43 的市场更像政府基础设施软件，而不是普通业务线 SaaS。

              采购路径也异常正式。FCC 规则已经让 NG911 准备度、标准合规和有效请求机制成为时点判断的一部分。911.gov 和 CISA
              显示，拨款、互操作性、网络安全和跨机构协议都位于实际产品采用之前。SAM.gov 和 eVA
              则展示了政策语言之下的机构现实：公共安全软件往往通过正式招标、州级采购载体和合规负担很重的合同流程购买。部署之后带来粘性的因素——安全审查、迁移工作量、工作流嵌入和跨机构协调——也会在合同签署前拉长销售周期。
