      - number: '4.4'
        title: 公开财务盲点与尽调含义
        blocks:
          - type: paragraph
            body: >-
              最重要的财务结论不是某个点估计，而是一条边界。公开证据足以梳理融资历史、产品变现逻辑，以及 Mark43 可能支撑可观合同价值的原因。它不足以从第一性原理承做经常性收入质量、单位经济或估值公平性。保留来源没有披露
              ARR、确认收入、毛利率、烧钱速度、CAC、回本周期、实施毛利率、留存或 cohort 扩张。即便第三方数据库也要么用占位字段遮蔽收入，要么在近期融资总额和标签上冲突。

              这个缺口并不意味着业务不可融资，而是要求投资逻辑从公开外推转向管理层尽调。投资人接受 2025 年重回独角兽叙事，甚至完全理解 2024
              年折价轮重置之前，公司需要拿出对齐后的融资时间线、当前股权结构表、预算化烧钱曲线、队列留存数据、按产品拆分的
              ACV，以及软件与服务毛利率桥。做到这些之前，任何关于内在价值或现金流质量的坚定结论都只能是概率判断，而不是已承做的结论。
