            body: >-
              尽管没有披露收入线，公开材料仍支持一个多收入流模型。Mark43 营销的平台模块覆盖 CAD、RMS、分析、联邦部署，以及安全/合规能力。支持服务页面、客户支持表面、采购博客和 FedRAMP
              材料都暗示，公司不仅通过软件访问权变现，也通过实施、支持、合规负担较重的上线和面向特定任务的部署工作变现。咨询服务发布又增加了一层可变现内容：为面对转型、风险或政策复杂性的机构提供战略和运营咨询。

              但定价仍大体不透明。演示页面、采购内容和官方产品页面都把买方导向咨询式或采购主导的动作，而不是公开价目表。这在政府工作流软件中正常，但会限制尽调。没有公开定价或披露 ACV，投资人无法判断 Mark43
              取胜靠的是产品强度、折扣、捆绑实施，还是支持负担很重的合同。变现逻辑可见，真实经济性不可见。
