    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分与覆盖
        blocks:
          - type: paragraph
            body: >-
              保留的客户材料显示，Mark43
              销售对象横跨多个公共安全买方细分，而不是一个狭窄执法利基。官方客户案例和新闻稿覆盖大城市警察局、县警长办公室、州警或州级实体、通信区、联邦用户，以及港口和交通等专业垂直领域。面向校园、交通和联邦的解决方案页面进一步表明，公司正有意把同一套工作流平台扩展到相邻公共部门环境，而这些场景仍需要安全、调度、记录或合规负担较重的运营。

              规模方向上强，即便外部证据仍比公司叙事薄。Mark43 的 2024 年 FedRAMP 公告称，公司服务 250 多家公共安全机构；2026 年报道则引用 300+ 家执法机构。相比之下，Apps Run
              The World 只暴露了一小部分公开、已验证客户记录。正确解读不是说公司装机基础为假，而是公开客户证据明显窄于内部客户数说法；当投资人仅靠开放网络证据评估集中度、留存或扩张时，这一点很重要。
