      - number: '2.2'
        title: 规模口径与受限的 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Mark43 市场的公开规模测算高度受定义影响，因此本章保留多个口径，而不是假装存在一个通用 TAM。Frost & Sullivan 给出调度相邻层最清晰、可获取的切片：美国 NG911 收入从 2021 年
              $888.1M 增至 2026 年 $1.19B，CAGR 为 6.1%。该口径有用，因为它捕捉了围绕多媒体应急工作流的软件和服务现代化，但它仍不等于 Mark43 的完整目标市场。Mark43 还在严格
              NG911 定义之外的 RMS、分析、移动响应和一体化云运营中竞争。

              其他来源衡量的是资本需求，而不是年度市场收入。Intrado 称仍需 $5.8B 至 $9.27B 资金才能完成全美 NG911 现代化；911.gov 则指向此前的拨款项目，例如 2019 年 $109M
              奖励周期和 2009 年 Enhanced 911 拨款项目。这些数字并不矛盾，而是对应支出层次不同。因此，广义外层 TAM 可以纳入 Inc. 的 Mark43 画像中提到的全球警务软件 $11.6B
              估计值，但实用的 Mark43 可服务市场（SAM）要窄得多：那些准备按公共部门采购节奏购买云原生调度、记录、分析和 AI 工作流软件的执法与公共安全机构子集。
