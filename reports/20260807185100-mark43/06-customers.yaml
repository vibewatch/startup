- id: concentration-and-proof-limitations
  title: Concentration, concentration risk, and proof limitations
  body: 'Customer concentration risk is real even though the open-web evidence cannot quantify it precisely. The company’s strongest public references cluster in major agencies and recognizable public-sector logos, which is helpful for credibility but potentially dangerous if a small number of large agencies account for disproportionate ARR, implementation load, or public narrative. The federal, port, campus, and county surfaces are strategically important because they suggest diversification by buyer type, not just by logo count.


    The main limitation is data transparency. The retained file does not disclose ARR by customer, top-account concentration, renewal cohorts, seat expansion, module penetration, or churn. Apps Run The World and ZoomInfo provide directional scale signals, but neither closes the underwriting gap. Investors should therefore treat the customer chapter as strong evidence that Mark43 has real market adoption across several agency types, but not as proof that customer economics or concentration are already well balanced.'
