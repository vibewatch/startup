chapter:
  number: 6
  title: Customers
  summary: Mark43 has real and diverse public customer proof across city police, county sheriffs, state entities, communications districts, and regulated federal environments. The missing piece is not logo credibility; it is customer economics and retention transparency, because the open-web file remains far stronger on wins and launches than on long-term revenue durability.
sections:
- id: customer-segments-and-footprint
  title: Customer segments and footprint
  body: 'The retained customer file shows that Mark43 sells across several public-safety buyer segments rather than to one narrow law-enforcement niche. Official customer stories and press releases cover large-city police departments, county sheriffs, state-police or statewide entities, communications districts, federal users, and specialized verticals such as port and transportation. The solutions pages for campus, transportation, and federal further indicate that the company is deliberately expanding the same workflow platform into adjacent public-sector environments that still require security, dispatch, records, or compliance-heavy operations.


    Scale is directionally strong even if external proof remains thinner than the company narrative. Mark43’s 2024 FedRAMP announcement says the company serves more than 250 public-safety agencies, while 2026 coverage cites 300+ law-enforcement agencies. Apps Run The World, by contrast, exposes only a small public subset of verified customer records. The right interpretation is not that the company’s installed base is false; it is that public customer proof is materially narrower than internal customer count claims, which matters when investors try to evaluate concentration, retention, or expansion from open-web evidence alone.'
