- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk area
  - Why it exists
  - Potential impact
  - Diligence ask
  rows:
  - - Large-account concentration
    - Public references emphasize marquee agencies
    - Few logos may drive disproportionate ARR or narrative risk
    - Request top-10 customer revenue concentration
  - - Implementation concentration
    - High-touch public-sector deployments can absorb delivery capacity
    - Rollout delays can affect both growth and margins
    - Request services staffing and deployment backlog data
  - - Segment concentration
    - Law-enforcement concentration remains high despite adjacent surfaces
    - Budget shocks in one segment can slow growth
    - Request revenue mix by city/county/state/federal/adjacent
  - - Module concentration
    - Core RMS/CAD may dominate economics more than newer modules
    - Newer roadmap layers may not yet diversify revenue
    - Request product-level ARR and attach rates
  - - Proof-set concentration
    - Public references are stronger for wins than renewals
    - Open-web evidence can overstate durability
    - Request renewal/churn cohorts and NRR by cohort
  - - Geographic concentration
    - Many references cluster in U.S. public-safety buyers
    - Regional procurement cycles may sync negatively
    - Request geographic revenue mix and pipeline diversification
  notes: The customer story supports demand credibility, but not yet concentration comfort.
