- id: customer-journey-retention-and-expansion
  title: Customer journey, retention, and expansion
  body: 'The public deployment pattern implies a recognizable customer journey even without revenue cohorts. Agencies typically begin with selection or procurement proof, move through implementation or launch, then broaden usage across workflows or adjacent agencies. Washington, D.C. shows cross-agency depth; Boston shows selection-to-launch progression; Lafayette Parish shows multi-entity coverage; Louisiana State Police shows newer module adoption around mobile response; and federal deployment at NTSB shows the security-cleared path expanding the buyer set.


    But the public file is much weaker on true retention. Most retained sources celebrate wins or launches, not multi-year renewal behavior. Public partner announcements from Axon and ForceMetrics suggest ecosystem expansion, yet they do not prove net retention or commercial durability. The customer story is therefore best read as good logo breadth plus incomplete life-cycle visibility. That supports demand and deployment credibility, but not a full underwriting of retention economics.'
  claimRefs:
  - CU014
  - CU018
  - CU020
  - CU022
