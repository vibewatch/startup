- id: named-customer-proof-and-deployment-patterns
  title: Named customer proof and deployment patterns
  body: 'Named customer proof is strongest where Mark43 has both selection and launch or case-study evidence. Washington, D.C. remains one of the clearest anchors because the retained customer story says Mark43 RMS launched at MPD and 40+ other D.C. agencies in August 2015. Boston is supported by both selection and launch-era releases. Atlanta has an official launch announcement. Lafayette Parish appears in multiple forms—sheriff RMS, communication-district CAD, and Louisiana reporting compliance—making it one of the most richly documented county/regional accounts in the public file. More recent proof expands the set further through Louisiana State Police OnScene deployment, Warren PD, San Diego Sheriff, Jefferson County Sheriff, NTSB evidence deployment, and Mariposa County Sheriff.


    The broader pattern is meaningful. Mark43 does not look like a company with only one marquee flagship customer and little else. It looks like a platform whose public references span city, county, state, federal, and specialized agencies. What remains weak is public commercial detail: contract value, seat count, module attach rate, implementation duration, and renewal status are generally not disclosed even when the customer name is public.'
  claimRefs:
