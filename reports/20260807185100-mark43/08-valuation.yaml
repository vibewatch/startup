- id: recommendation-and-diligence-thresholds
  title: Recommendation and diligence thresholds
  body: 'The right public-only valuation stance is cautious but not dismissive. Mark43 clearly has enough real product, customer, and market proof to justify serious diligence at a meaningful valuation. What the open-web file does not justify is blind acceptance of the exact $1.0 billion mark. Too many decisive underwriting inputs remain private: current revenue, retention, gross margin, services mix, runway, cap-table seniority, and the true terms of the 2024-2025 financings.


    That leads to an analytical conclusion rather than a hard no. A $1.0 billion valuation can be defensible if revenue scale is already substantial and if the business behaves more like durable mission software than like services-heavy public-sector implementation work. It becomes hard to defend if revenue is materially lower, if concentration is high, or if downside financing risk still shadows the cap table. Investors should therefore tie any price discussion to a short list of threshold metrics rather than to narrative confidence alone.'
