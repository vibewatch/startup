- id: revenue-streams-pricing-and-monetization
  title: Revenue streams, pricing, and monetization
  body: 'The public file supports a multi-stream revenue model even though no revenue line is disclosed. Mark43 markets platform modules spanning CAD, RMS, analytics, federal deployments, and security/compliance capabilities. The support-services pages, customer-support surfaces, procurement blog, and FedRAMP materials all imply that the company monetizes not just software access but also implementation, support, compliance-heavy onboarding, and mission-specific deployment work. The advisory-services release adds another monetizable layer: strategic and operational consulting for agencies facing transformation, risk, or policy complexity.


    Pricing, however, remains largely opaque. The demo page, procurement content, and official product surfaces all steer buyers toward consultative or procurement-led motions rather than public rate cards. That is normal for government workflow software, but it limits diligence. Without posted pricing or disclosed ACVs, investors cannot tell whether Mark43 wins through product strength, discounting, bundled implementation, or support-heavy contracts. The monetization logic is visible; the realized economics are not.'
