- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - What public sources show instead
  - Diligence ask
  rows:
  - - ARR / revenue
    - Needed to test valuation and growth quality
    - No retained public ARR disclosure; CB Insights revenue field is placeholder-like
    - Request current ARR, GAAP revenue, and growth bridge
  - - Gross margin
    - Needed to distinguish software quality from services drag
    - Support and advisory surfaces imply mixed delivery model
    - Request software, services, and blended gross margins
  - - Burn / runway
    - Needed to judge capital adequacy after 2024 reset
    - Capital raised is public, cash balance is not
    - Request cash balance, monthly burn, and runway under base plan
  - - Net revenue retention
    - Needed to test product stickiness and expansion
    - Public system-of-record narrative exists, cohort data does not
    - Request NRR and module-expansion cohorts
  - - CAC / payback
    - Needed to judge public-sector efficiency
    - Procurement-heavy motion is visible, unit economics are not
    - Request pipeline conversion, CAC, and payback by segment
  - - Round reconciliation
    - Needed to validate cap-table history and dilution
    - Official, Prime, CB Insights, and Premier records conflict after 2021
    - Request closing binders, stock ledger, and board approvals for every post-2021 round
  notes: The missing metrics are normal for a private company, but together they prevent full underwriting from public evidence alone.
