- id: public-financial-blind-spots
  title: Public financial blind spots and diligence implications
  body: 'The most important financial conclusion is not a point estimate; it is a boundary. Public evidence is good enough to map capital history, product monetization logic, and the reasons Mark43 could support meaningful contract values. It is not good enough to underwrite recurring revenue quality, unit economics, or valuation fairness from first principles. The retained sources do not disclose ARR, recognized revenue, gross margin, burn, CAC, payback, implementation margin, retention, or cohort expansion. Even third-party databases either obscure revenue with placeholder fields or conflict on recent funding totals and labels.


    That gap does not make the business unfinanceable. It means the investment case must shift from public extrapolation to management diligence. Before an investor can accept the 2025 unicorn-restoration narrative or even the 2024 down-round reset as fully understood, the company needs to produce a reconciled financing timeline, current cap table, budgeted burn profile, cohort retention data, ACV by product, and software-versus-services gross margin bridge. Until then, any firm conclusion about intrinsic value or cash-flow quality remains probabilistic rather than underwritten.'
