evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: 2024-2025 financing timeline
    missingEvidence: >-
      Signed financing documents or board-approved round summary reconciling the official March 2024 announcement, Prime
      Unicorn’s Series F markup, CB Insights' May 2024 Series F entry, and the late-2025 Premier Alternatives marker.
    whyItMatters: >-
      Investors cannot reliably judge dilution, liquidation overhang, or whether the company truly restored unicorn
      status without a reconciled capital history.
    diligencePath: >-
      Request cap table, board consents, stock ledgers, and financing closing binders covering every round from Series E
      onward.
    relatedQuestionRefs:
      - QO011
      - QO012
      - QO014
      - QO015
      - QO025
  - type: private-evidence-only
    severity: material
    topic: board composition and control
    missingEvidence: >-
      Current board roster, committee structure, voting rights, and observer arrangements beyond the named JD Sherman
      and Teresa Carlson additions.
    whyItMatters: >-
      Governance control determines financing flexibility, strategic direction, and investor protections in a
      mission-critical government software business.
    diligencePath: >-
      Request current board deck, governance charter set, investor rights agreement, and observer/right-to-information
      schedules.
    relatedQuestionRefs:
      - QO007
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current headcount, ARR, and revenue quality
    missingEvidence: Management-confirmed employee count, ARR, revenue concentration, and renewal metrics.
    whyItMatters: >-
      Third-party proxies like ZoomInfo are too weak to underwrite current operating leverage or justify a
      private-market valuation marker.
    diligencePath: Request current org chart, headcount by function and geography, ARR bridge, and top-customer concentration table.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: public customer proof coverage
    missingEvidence: >-
      A broader, source-backed list of current agencies using each Mark43 module, beyond the marquee case studies and
      limited public database entries.
    whyItMatters: >-
      Customer concentration and true module penetration cannot be inferred from a few flagship stories plus marketing
      claims.
    diligencePath: >-
      Request a current customer list by module, ARR, and contract start date; cross-check against public procurement
      records.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: exact Mark43 SAM
    missingEvidence: >-
      A public or management-published TAM/SAM/SOM framework specifically for cloud-native CAD/RMS/analytics workflow
      spend rather than adjacent NG911 or broad police-software categories.
    whyItMatters: >-
      Without a normalized market frame, investors can easily anchor on incompatible numbers and overstate attainable
      demand.
    diligencePath: >-
      Request management market model, ACV assumptions, buyer-count segmentation, and current win-rate data by agency
      tier.
    relatedQuestionRefs:
      - QM009
      - QM023
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: sales-cycle and procurement conversion
    missingEvidence: Median sales-cycle length, stage conversion, procurement vehicle mix, and implementation-to-expansion rates.
    whyItMatters: >-
      The public record proves demand but not how efficiently that demand converts into revenue or how quickly the
      obtainable market can be penetrated.
    diligencePath: Request CRM funnel data, booking-to-go-live conversion, and cohort analysis by segment.
    relatedQuestionRefs:
      - QM013
      - QM021
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
  - type: private-evidence-only
    severity: material
    topic: buyer economics by segment
    missingEvidence: ACV, gross margin, services intensity, and renewal profile by city, county, state, and federal buyer type.
    whyItMatters: >-
      Different procurement channels may look equally attractive from a market story but have very different economics
      and working-capital profiles.
    diligencePath: Request pricing architecture, implementation labor assumptions, and gross-margin bridge by segment.
    relatedQuestionRefs:
      - QM010
      - QM012
      - QM025
  - type: stale
    severity: minor
    topic: broad public market estimates
    missingEvidence: >-
      A recent third-party estimate for CAD/RMS/analytics workflow software comparable to the old $11.6B global police
      software number.
    whyItMatters: The most dramatic headline market-size figure in the public file is older and too broad for current underwriting.
    diligencePath: >-
      Seek contemporary analyst coverage or management-backed external market study for the integrated
      operations-software slice.
    relatedQuestionRefs:
      - QM008
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: win-loss performance
    missingEvidence: >-
      Head-to-head win-rate, loss-reason, and renewal data against Motorola, Tyler, CentralSquare, Axon/Prepared, and
      Carbyne.
    whyItMatters: Public product pages show overlap but do not prove whether Mark43 wins where it matters commercially.
    diligencePath: >-
      Request CRM-derived competitive intelligence, lost-deal summaries, and renewal/expansion cohorts by competitor
      presence.
    relatedQuestionRefs:
      - QP021
      - QP023
      - QP025
    relatedTableRefs:
      - TP001
      - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing and discount discipline
    missingEvidence: >-
      Realized ACV, implementation pricing, services mix, discounting behavior, and gross-margin differences by module
      and buyer type.
    whyItMatters: >-
      Public pricing opacity makes it impossible to tell whether competitive pressure is being absorbed through
      discounting or services burden.
    diligencePath: Request pricing architecture, quote history, and margin bridge by product family and agency segment.
    relatedQuestionRefs:
      - QP013
      - QP014
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost durability
    missingEvidence: >-
      Migration failure rates, average implementation duration, adoption curves, and post-go-live module expansion
