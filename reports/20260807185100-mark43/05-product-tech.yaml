- id: maturity-roadmap-and-product-limitations
  title: Maturity, roadmap, and product limitations
  body: 'The product surface looks broad, but maturity is uneven by module. Core operational categories such as CAD, RMS, mobile response, analytics, and security posture have substantial public proof. Newer layers such as AI-assisted reporting, mobile booking, and ecosystem-led intelligence expansion are promising but earlier in their evidence cycle. They are easy to believe directionally because they sit next to existing workflows; they are harder to underwrite commercially because the public record does not disclose usage depth, attach rates, or measured productivity deltas.


    The biggest product-technology limitation in the public file is not lack of ideas. It is lack of quantified outcome data. Mark43 clearly has a coherent architecture and a real roadmap. What investors still need is hard proof on implementation times, module adoption by cohort, AI accuracy and usage rates, degraded-mode performance, and whether the expanding integration layer increases retention more than it increases complexity. Until then, the product thesis is strong on architecture and moderate on measured economic impact.'
