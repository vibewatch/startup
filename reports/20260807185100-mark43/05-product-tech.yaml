  - type: private-evidence-only
    severity: material
    topic: module adoption depth
    missingEvidence: Active-user counts, attach rates, and cohort adoption by module, especially for AI, mobile booking, eCitations, and specialty workflows.
    whyItMatters: The public file shows product breadth, but not which features customers actually use deeply.
    diligencePath: Request module attach rates, MAU/WAU for mobile and AI tools, and expansion cohorts by agency type.
    relatedQuestionRefs:
    - QE018
    - QE019
    - QE022
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: implementation and migration performance
    missingEvidence: Average implementation duration, migration error rates, go-live timelines, and degraded-mode test results.
    whyItMatters: A strong architecture can still fail commercially if deployment is slow or brittle.
    diligencePath: Request implementation scorecards, migration playbooks, backup-mode tests, and incident/postmortem history.
    relatedQuestionRefs:
    - QE016
    - QE023
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
