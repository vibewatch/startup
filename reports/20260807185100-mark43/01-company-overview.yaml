  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: 2024-2025 financing timeline
    missingEvidence: Signed financing documents or board-approved round summary reconciling the official March 2024 announcement, Prime Unicorn’s Series F markup, CB Insights' May 2024 Series F entry, and the late-2025 Premier Alternatives marker.
    whyItMatters: Investors cannot reliably judge dilution, liquidation overhang, or whether the company truly restored unicorn status without a reconciled capital history.
    diligencePath: Request cap table, board consents, stock ledgers, and financing closing binders covering every round from Series E onward.
    relatedQuestionRefs:
    - QO011
    - QO012
    - QO014
    - QO015
    - QO025
  - type: private-evidence-only
    severity: material
    topic: board composition and control
    missingEvidence: Current board roster, committee structure, voting rights, and observer arrangements beyond the named JD Sherman and Teresa Carlson additions.
    whyItMatters: Governance control determines financing flexibility, strategic direction, and investor protections in a mission-critical government software business.
    diligencePath: Request current board deck, governance charter set, investor rights agreement, and observer/right-to-information schedules.
    relatedQuestionRefs:
    - QO007
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: current headcount, ARR, and revenue quality
    missingEvidence: Management-confirmed employee count, ARR, revenue concentration, and renewal metrics.
    whyItMatters: Third-party proxies like ZoomInfo are too weak to underwrite current operating leverage or justify a private-market valuation marker.
    diligencePath: Request current org chart, headcount by function and geography, ARR bridge, and top-customer concentration table.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: public customer proof coverage
    missingEvidence: A broader, source-backed list of current agencies using each Mark43 module, beyond the marquee case studies and limited public database entries.
    whyItMatters: Customer concentration and true module penetration cannot be inferred from a few flagship stories plus marketing claims.
    diligencePath: Request a current customer list by module, ARR, and contract start date; cross-check against public procurement records.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO004
