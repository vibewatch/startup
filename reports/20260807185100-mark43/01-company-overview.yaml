company:
  name: Mark43
chapter:
  number: 1
  title: Company Overview
  summary: 'Mark43 is a New York-based cloud-native public safety software company whose strongest public evidence combines Harvard-origin founder fit, major-agency deployments, and a broad integrated platform spanning CAD, RMS, analytics, mobile, and AI workflows. The same overview file also surfaces the biggest diligence friction: financing and valuation disclosures after 2021 are fragmented across official statements and third-party databases, so the late-2025 $1.0B marker should be treated as provisional until management reconciles the cap-table history.'
sections:
- id: identity-platform-and-location
  title: Identity, platform, and location record
  body: 'Mark43’s current positioning is unusually clear for a private public-safety software vendor. Its current corporate and product pages repeatedly describe the company as a secure, all-in-one public safety technology platform built around cloud-native CAD, RMS, analytics, mobile, and AI-assisted workflows. The product surface visible in retained 2026 pages is broad: Mark43 CAD for dispatch, Mark43 RMS for records, Insights for analytics, OnScene for mobile response, and newer AI modules such as BriefAI and ReportAI. That product breadth matters because the company does not look like a point tool vendor any longer; it looks like an operating system layer for dispatchers, officers, investigators, and agency leadership.


    The location record is directionally stable even if the exact street address has changed across third-party databases. Multiple retained sources place the company in New York City. Bizprofile’s 2025 filing snapshot lists Mark43, Inc. at 8 West 40th Street, 2nd Floor, New York, while ZoomInfo places headquarters at 27 West 24th Street, 5th Floor, New York. The exact office suite is therefore not fully settled from public web evidence, but the city-level headquarters conclusion is strong. The platform description is stronger than the address detail: across retained official pages, Mark43 consistently markets an integrated public-safety stack that emphasizes compliance, mobile responsiveness, and real-time data sharing rather than isolated departmental modules.'
