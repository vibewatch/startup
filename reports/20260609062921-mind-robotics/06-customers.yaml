  - id: TU006
    title: Sales and deployment motion table
    columns:
      - Stage
      - Public evidence
      - Likely owner
      - Customer implication
      - Remaining gap
    rows:
      - - Land an anchor plant
        - Mind highlights Rivian as initial partner and customer ready to deploy at scale
        - Founder, technical leadership, plant sponsor
        - Early sales likely depend on one high-trust design partner instead of broad outbound coverage
        - No public evidence on external prospecting or channel-led demand generation
      - - Capture production data
        - Mind frames active manufacturing-line data as the core flywheel and hires for data and teleoperation
        - Data / teleoperation product owner and operations team
        - Customer deployment likely starts with site-specific data collection and task definition
        - No disclosure on data rights, labeling cost, or onboarding timeline
      - - Integrate hardware, software, and equipment
        - Built In and Ashby show integration, robotics systems, and deployment-pipeline roles; Rivian mentions integrators
        - Manufacturing engineering, integration owner, technical program manager
        - Deployment appears services-heavy and plant-specific
        - No public statement on standard interfaces or implementation duration
      - - Validate safety and performance
        - Mind hires for safety; OSHA and NIST show standards and testing burden
        - Safety engineer and plant engineering team
        - Buyers likely need validation before wider rollout
        - No public certification, audit, or acceptance criteria disclosed
      - - Run on live lines
        - Assembly describes production-validation builds and AI-powered robotics on the R2 line
        - Plant operations and line owners
        - Live-line proof is the key step from experiment to budget credibility
        - No disclosed line-level KPIs attributable specifically to Mind Robotics
      - - Expand or diversify
        - Mind speaks about scaled deployments and broader industrial verticals after automotive
        - Go-to-market and customer success equivalent functions, if any
        - Expansion likely depends on proving ROI in one plant before cross-site or cross-vertical rollout
        - No public proof yet of non-Rivian expansion or external repeatability
    notes: The motion described here is inferred from public hiring and deployment language. Mind Robotics does not publish a formal sales-process diagram or customer-success model.
