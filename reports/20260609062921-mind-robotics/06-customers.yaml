  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    summary: Mind Robotics’ public motion looks like a high-touch industrial implementation funnel with clear failure points before broad rollout.
    data:
      nodes:
        - id: need
          label: Identify a painful factory task
          detail: Target dexterous or variable work that classical automation cannot handle well.
        - id: sponsor
          label: Win a plant sponsor
          detail: Secure manufacturing, operations, or automation leadership support inside the customer site.
        - id: data
          label: Gather site data
          detail: Collect production data and define teleoperation or training workflows for the target task.
        - id: integrate
          label: Integrate and validate
          detail: Connect robots with equipment, controls, and safety processes while proving performance.
        - id: live
          label: Run on a live line
          detail: Move from lab or validation mode into production operations.
        - id: scale
          label: Expand or stall
          detail: Expansion depends on credible ROI, implementation confidence, and plant readiness.
