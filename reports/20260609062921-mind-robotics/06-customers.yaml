  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Driver / risk
      - Public signal
      - Impact
      - Current read
      - Diligence path
    rows:
      - - Rivian concentration
        - Rivian is the initial partner, a major shareholder, the training-data source, and the scale deployment venue
        - A single relationship may dominate learning, proof, and early commercial optics
        - High and unresolved
        - Request revenue, bookings, and deployed-robot exposure to Rivian
      - - Captive-customer validation risk
        - Public evidence is strongest in one affiliated environment rather than in multiple third-party plants
        - Outside demand may be weaker than the technical proof suggests
        - Material
        - Request external pipeline stages, paid pilots, and reference customers
      - - Automotive procurement difficulty
        - Roland Berger says selling to automotive companies has been and still is tough
        - Long cycles and cautious plant change control can slow diversification
        - Material
        - Request cycle length, procurement blockers, and win/loss data by vertical
      - - Integration and expertise shortage
        - The adverse survey cites lack of expertise and integration challenges across manufacturers
        - Even willing buyers may stall before deployment or scale-up
        - Material
        - Request implementation staffing model, partner ecosystem, and average time-to-go-live
      - - Budget overrun and failure risk
        - The same survey cites budget overruns and systems failing to perform as intended
        - Buyers may delay or narrow deployments until ROI is clearer
        - Material
        - Request projected payback, success criteria, and post-deployment defect metrics
      - - Safety and governance burden
        - OSHA, NIST, and IFR all point to training, standards, safety, and governance demands
        - High validation cost can slow multi-site rollout
        - Structural
        - Request certification roadmap, safety case materials, and incident-response process
    notes: This table mixes positive expansion drivers with underwriting risks because Mind’s strongest public proof is also the source of its sharpest concentration risk.
