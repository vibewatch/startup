    title: Customer journey map
    type: journey-map
    summary: Public evidence suggests Mind Robotics starts with an exacting anchor plant, builds a data flywheel there, and only then tries to generalize outward.
    data:
      nodes:
        - id: select
          label: Select an exacting plant
          detail: Start in a factory environment where variability, labor intensity, and launch pressure are high enough to justify AI robotics.
        - id: anchor
          label: Anchor at Rivian
          detail: Use Rivian as the initial partner, customer, shareholder, and training-data source.
        - id: capture
          label: Capture data and teleoperate
          detail: Build the data flywheel through real manufacturing-line data, teleoperation, and robotics operations workflows.
        - id: integrate
          label: Integrate into live cells
          detail: Connect robotics hardware, software, and deployment infrastructure with plant equipment and integrators.
        - id: prove
          label: Prove on live production
          detail: Demonstrate value in operating lines where throughput, quality, safety, and launch timing matter.
        - id: expand
          label: Expand or diversify
          detail: Use anchor-account proof to widen within the plant or try adjacent industrial manufacturers.
