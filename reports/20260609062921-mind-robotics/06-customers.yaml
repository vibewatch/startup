  title: Customers
  summary: Public customer evidence for Mind Robotics is strong on one point and weak on most others. Rivian is clearly a live, production-scale partner/customer and shareholder that provides the company’s first training and deployment environment, but reviewed public sources do not name another live external customer or paid pilot. That makes buyer personas and sales motion inferable, while pricing, retention, and diversification remain unresolved and customer concentration stays a core diligence risk.
sections:
  - id: customer-base-and-buyer-personas
    title: Customer base and buyer personas
    body: |-
      Mind Robotics’ public customer story starts with a narrow but unusually concrete anchor. Its own homepage says the company’s strategic partnership with Rivian provides production-scale data from active manufacturing lines, with an initial customer ready to deploy at scale. That is meaningful because it points to a real production environment instead of a concept-lab backdrop. It also strongly suggests that the first commercial use case is not general warehouse automation or service robotics, but factory-floor tasks inside an automotive setting where line uptime, quality, safety, and integration matter immediately.

      The rest of the customer-base picture is still mostly inferred rather than disclosed. Public materials do not provide a customer count, pricing, ACV bands, or a clean geography/vertical mix. Still, the operating context makes the likely buyer set fairly clear: plant leadership, manufacturing engineering, automation or integration owners, and operations sponsors who can justify spend through launch speed, labor leverage, throughput, or quality gains. The most likely daily users are manufacturing engineers, integrators, operators, and safety or teleoperation staff. That supports an initial target segment of automotive and adjacent high-mix industrial manufacturers, while leaving actual market breadth unproven until non-Rivian accounts are named.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
