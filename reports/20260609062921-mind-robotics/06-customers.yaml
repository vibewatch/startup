  evidenceGaps:
    - type: missing-source
      severity: material
      topic: external-customer-roster
      missingEvidence: A named list of non-Rivian customers or paid pilots, including whether each deployment is pilot, validation, or full production.
      whyItMatters: Without named external accounts, public evidence cannot prove diversification, repeatability, or third-party willingness to buy outside the Rivian relationship.
      diligencePath: Ask management for a current customer roster, pilot pipeline by stage, and at least two non-Rivian reference calls.
      relatedQuestionRefs:
        - QU013
        - QU014
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: retention-economics
      missingEvidence: NRR, GRR, churn, renewal rates, repeat-purchase data, and customer duration by cohort.
      whyItMatters: Customer durability cannot be underwritten from one anchor environment alone, especially when the public record lacks outside customer proof.
      diligencePath: Request renewal metrics, deployment-retention cohorts, and account-level expansion history for Rivian and any external customers.
      relatedQuestionRefs:
        - QU020
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: blocking
      topic: rivian-concentration
      missingEvidence: Rivian’s share of revenue, bookings, deployed robots, and the expected timeline for external revenue to become material.
      whyItMatters: Concentration is the key underwriting risk in the customer chapter, and public evidence does not quantify how captive the business still is.
      diligencePath: Request customer-concentration tables, board materials on diversification, and a pipeline bridge from Rivian-led activity to external bookings.
      relatedQuestionRefs:
        - QU022
        - QU025
      relatedTableRefs:
        - TU005
    - type: private-evidence-only
      severity: material
      topic: pricing-and-roi
      missingEvidence: Pricing model, ACV range, implementation fees, payback period, and customer-specific ROI metrics.
      whyItMatters: High-touch industrial deployments are hard to scale if buyers cannot see predictable economics or if project cost balloons during integration.
      diligencePath: Request sample commercial terms, ROI models used in selling, and win/loss analysis by plant size and task type.
      relatedQuestionRefs:
        - QU009
        - QU018
      relatedTableRefs:
        - TU004
        - TU006
    - type: enumeration-incomplete
      severity: material
      topic: external-pipeline
      missingEvidence: A stage-by-stage view of design partners, pilots, and external accounts beyond Rivian, plus time-to-go-live and conversion rates.
      whyItMatters: Public sources show a credible anchor-customer setup, but they do not show whether Mind Robotics can repeat that motion across unrelated manufacturers.
      diligencePath: Ask for pipeline staging, implementation durations, and reasons pilots convert or stall across external accounts.
      relatedQuestionRefs:
        - QU015
        - QU023
      relatedTableRefs:
        - TU002
        - TU006
