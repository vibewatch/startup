  - id: rivian-proof-and-external-customer-gap
    title: What Rivian proves and what it does not prove
    body: |-
      Rivian proves something important, but only something specific. Multiple official and independent sources describe Rivian as Mind Robotics’ initial partner, a major shareholder, and the company’s production-scale training and deployment environment. TechCrunch, Assembly Magazine, and Mind’s own press releases all point to the same operating logic: Rivian contributes factory data, real manufacturing environments, and a venue to validate whether the robots are useful on live lines. Rivian’s own disclosures strengthen that interpretation. In Q1 2026 it produced 10,236 vehicles and delivered 10,365 from Normal, Illinois; separate Rivian materials describe a 4.3 million square-foot plant, a 1.1 million square-foot expansion, and a planned 215,000-unit capacity. Assembly Magazine also describes a smart, connected R2 line with advanced robotics, AI-powered scanning and placement, and vision-based quality checks.

      What this does not prove is customer diversification. The public record reviewed for this run repeatedly names Rivian, but it does not publicly name another live external customer or a non-Rivian paid pilot. That means investors can underwrite real deployment intensity inside a demanding automotive environment, but not a multi-account customer base. Rivian is evidence of production relevance, not yet evidence that Mind Robotics has repeatable distribution, referenceability, or procurement traction across the broader industrial market.
    claimRefs:
      - CU010
