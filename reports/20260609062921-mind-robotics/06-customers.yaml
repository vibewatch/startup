tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / operating context
      - Revenue / strategic value
      - Gap
    rows:
      - - Automotive OEM anchor plant
        - Plant or manufacturing-engineering lead / operators, integrators, safety staff / automation or capex budget owner
        - Deploy dexterous and variable robots on active vehicle-production lines
        - Rivian Normal plant with live manufacturing lines and 2026 production output
        - Provides first production reference environment and fastest route to early revenue or proof-of-value
        - No contract value, robot count, or line count disclosed
      - - Launch-critical body, assembly, and end-of-line programs
        - Manufacturing engineering and operations sponsor / integrators and line staff / model-launch or plant-improvement budget
        - Support body, assembly, end-of-line, material-flow, and quality tasks around R2 launch
        - Rivian expansion adds new body, general assembly, and end-of-line space
        - Ties Mind to a launch-sensitive environment where uptime and quality matter commercially
        - No evidence yet on how much of this stack is directly supplied by Mind Robotics
      - - High-variability factory cells
        - Automation lead / robot operators and technicians / industrial automation budget
        - Replace work that is too variable for classic fixed automation
        - Mind messaging focuses on dexterous, reasoning-intensive factory tasks
        - Aligns with problem areas where differentiated AI robotics could command premium budgets
        - Public record does not quantify task-level ROI
      - - Integrator-heavy manufacturing deployments
        - Systems or integration owner / integrators and manufacturing engineers / project budget
        - Connect robots with plant equipment, controls, and production workflows
        - Rivian describes equipment being set and connected with integrators in Normal
        - Suggests Mind can capture value in deployment infrastructure as well as robot behavior
        - No public channel mix or partner-revenue split disclosed
      - - Safety-sensitive human-robot collaboration cells
        - Safety and engineering leadership / operators working alongside robots / compliance and automation budget
        - Deploy collaborative robots that can work near people on real lines
        - Mind calls its platform safe and collaborative; OSHA and NIST show the validation burden
        - Successful safety proof could widen adoption scope inside regulated plants
        - No public certification, incident, or audit record disclosed
      - - Future non-automotive industrial manufacturers
        - Factory leadership in adjacent verticals / plant staff and integrators / site-level automation budget
        - Extend the platform from automotive into broader industrial manufacturing domains
        - Mind explicitly says it is mastering the automotive floor first to unlock every industrial vertical tomorrow
        - Expands TAM beyond one captive environment if the product ports well
        - No named non-Rivian customer yet proves that transferability
    notes: Segment boundaries are inferred from Mind Robotics’ public positioning, Rivian’s published manufacturing context, and hiring signals rather than from a company-issued customer segmentation breakout.
