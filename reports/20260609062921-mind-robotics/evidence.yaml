evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure-and-round-labeling
    missingEvidence: >-
      The precise security terms, whether the May 2026 financing should be treated as an A-1 extension or a new named
      round, and any secondaries or debt-like components.
    whyItMatters: >-
      Round structure affects dilution, pricing benchmarks, and how later chapters should interpret valuation and
      investor rights.
    diligencePath: >-
      Request the cap table, financing documents, and board materials for the late-2025 seed, March 2026 Series A, and
      May 2026 financing.
    relatedQuestionRefs:
      - QO014
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      A current board list, any independent directors, named operating executives beyond RJ Scaringe, and documented
      conflict-management procedures with Rivian.
    whyItMatters: >-
      Leadership-bench depth and governance independence are central to execution risk and partner-concentration
      analysis.
    diligencePath: >-
      Request the org chart, board roster, committee structure, and any related-party governance policy covering
      Scaringe and Rivian.
    relatedQuestionRefs:
      - QO006
      - QO007
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: Current revenue, revenue run-rate, ARR, deployment count, customer count, and employee count.
    whyItMatters: >-
      These are the operating metrics needed to connect capital raised and valuation to actual scale and
      commercialization progress.
    diligencePath: >-
      Request monthly KPI reporting, customer pipeline data, deployment counts by plant, and current headcount by
      function.
    relatedQuestionRefs:
      - QO016
      - QO017
      - QO018
      - QO019
    relatedTableRefs: []
  - type: missing-source
    severity: material
    topic: partner-rights-and-data-governance
    missingEvidence: >-
      Detailed terms governing Rivian’s ownership stake, customer relationship, plant access, data rights, and any
      exclusivity or MFN provisions.
    whyItMatters: >-
      Mind’s moat and risk are concentrated in the Rivian relationship, so ownership and data-rights terms can
      materially change the investment case.
    diligencePath: >-
      Request the Rivian commercial agreement, data-use agreement, and any shareholder side letters or strategic rights
      documents.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: som-framing
    missingEvidence: >-
      Priced deployments, deployed robot or workcell counts, external customer names, and conversion from pilot to
      scaled line.
    whyItMatters: >-
      Without those metrics, any SOM claim would overstate commercial evidence and blur the difference between technical
      promise and proven adoption.
    diligencePath: >-
      Request current deployment count, live workcells by workflow, booked contract value, and a named customer pipeline
      beyond Rivian.
    relatedQuestionRefs:
      - QM023
      - QM024
  - type: missing-source
    severity: material
    topic: budget-owners
    missingEvidence: >-
      Public procurement documents or customer case studies that name exact budget owners, budget size, and procurement
      cycle length for adaptive industrial-robot deployments.
    whyItMatters: >-
      Budget authority and buying-cycle length determine sales efficiency and valuation multiples for a
      capital-intensive automation company.
    diligencePath: >-
      Request customer deployment case studies, procurement approvals, and budget-owner interviews from manufacturing
      engineering, operations, and EHS stakeholders.
    relatedQuestionRefs:
      - QM012
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A like-for-like third-party market study that isolates dexterous adaptive industrial robotics as a distinct
      category with a consistent 2026 scope definition.
    whyItMatters: >-
      Public market estimates vary too widely to use interchangeably, which can distort TAM narratives and valuation
      framing if the scope shift is hidden.
    diligencePath: >-
      Commission or obtain a category study that separates installed robotics, broader robotics systems, and the wider
      automation stack with explicit inclusion rules.
    relatedQuestionRefs:
      - QM006
      - QM021
      - QM022
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: customer-diversification
    missingEvidence: Independent proof of non-Rivian production deployments or revenue concentration by customer and workflow.
    whyItMatters: Market openness is more investable if Mind can show the thesis travels beyond one privileged launch environment.
    diligencePath: Request customer concentration, external pilot list, and timeline for first scaled deployment outside Rivian.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: missing-source
    severity: material
    topic: mind-pricing-model-gap
