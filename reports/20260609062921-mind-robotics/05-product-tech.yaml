  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: autonomy-level
      missingEvidence: Public evidence does not separate autonomous runtime from teleoperated intervention, fallback, or demonstration capture in production workflows.
      whyItMatters: The labor model, scalability, safety case, and gross-margin profile all depend on how much of the workflow is actually autonomous.
      diligencePath: Request task-level operating procedures, teleoperation rates, and handoff policies from Mind's product and operations teams.
      relatedQuestionRefs: [QE021]

    - type: private-evidence-only
      severity: material
      topic: manufacturing-and-supply-chain
      missingEvidence: Mind has not publicly identified robot OEM partners, contract manufacturers, major component suppliers, or internal-versus-external build boundaries.
      whyItMatters: Hardware scale, lead times, unit economics, and single-supplier concentration cannot be underwritten without this information.
      diligencePath: Review BOM ownership, supplier map, manufacturing agreements, and production ramp plan during technical diligence.
      relatedQuestionRefs: [QE022]

    - type: private-evidence-only
      severity: blocking
      topic: deployment-maturity-metrics
      missingEvidence: No public deployment count, uptime, failure rate, benchmark score, cycle time, or ROI metric has been disclosed for Mind's current product.
      whyItMatters: Without production metrics, investors cannot determine whether Mind is at prototype, pilot, or repeatable deployment stage.
      diligencePath: Request deployment dashboards, site scorecards, incident logs, and customer success metrics for Rivian and any external pilots.
      relatedQuestionRefs: [QE023]

    - type: private-evidence-only
      severity: material
      topic: independent-validation
      missingEvidence: No public third-party security audit, safety audit, independent benchmark, or incident-history disclosure was found for Mind's product stack.
      whyItMatters: Independent validation is important for judging operational risk in a safety-sensitive industrial robotics deployment.
      diligencePath: Request safety audit reports, cybersecurity assessments, and external validation studies covering deployed systems.
      relatedQuestionRefs: [QE027]
