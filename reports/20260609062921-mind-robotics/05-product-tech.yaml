  - id: TE003
    title: Technology / operating architecture table
    targetSlug: technology-operating-architecture-table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Main risk
    rows:
      - - Teleoperation cockpit
        - Captures human demonstrations, remote intervention, and operator intuition via VR, haptics, and low-latency streaming.
        - Human operators, networking quality, operator tooling
        - Hard to judge autonomy maturity if teleop remains deeply embedded in production
      - - Data engine
        - Collects, validates, labels, stores, and retrieves training and evaluation data.
        - Rivian line data, internal tooling, cloud infrastructure
        - Data quality or schema drift can slow training and mask model regressions
      - - Model training stack
        - Runs large-scale multimodal / VLA training and iteration loops across hundreds of GPUs.
        - Compute capacity, distributed systems reliability, data pipeline throughput
        - Cost and compute concentration could become a scaling bottleneck
      - - Runtime / middleware layer
        - Manages message passing, inter-process communication, task scheduling, and lifecycle management on robot systems.
        - Robotics software frameworks, embedded constraints, operator-facing tools
        - Reliability and latency failures can directly impair field performance
      - - Hardware actuation and mobility
        - Provides joint, end-effector, and mobility actuation tuned for force, speed, stiffness, and efficiency.
        - Motors, gearboxes, transmissions, sensing, cross-functional hardware integration
        - Supplier choice and mechanical trade-offs are undisclosed
      - - Tactile sensing and contact-rich manipulation
        - Brings touch feedback into fingertips, palms, grippers, and data-collection gloves.
        - Materials engineering, packaging, durability, calibration
        - No public evidence yet on grasp performance, lifetime, or maintenance burden
      - - Systems and safety integration
        - Translates subsystem design into ICDs, HARA / DFMEA work, validation, and field acceptance criteria.
        - Standards interpretation, test infrastructure, integrated robot builds
        - Public conformance, certification, and failure-rate evidence remain absent
    notes: >-
      Architecture is inferred from official stack descriptions and detailed job responsibilities,
      not from a public engineering diagram released by Mind Robotics.
    claimRefs:
