  - id: architecture-stack-and-build-signals
    title: Architecture Stack and Build Signals
    body: |-
      The best public look into Mind's architecture comes from hiring signals, which are unusually informative for a company that has not published a detailed technical diagram. The Product Manager, Data & Teleoperation role describes a teleoperation platform with VR integration, haptics, and ultra-low-latency streaming, implying that human demonstrations and remote operation are part of the data-collection and evaluation loop. The Data Architect, Machine Learning Infrastructure Engineer, and Research + Modeling roles together point to a stack built around large-scale data ingestion, validation, labeling, distributed training across hundreds of GPUs, and multimodal / VLA model development that goes from data to training to deployment on real robots.

      The robotics software and hardware postings fill in the rest of the picture. Robotics Software Engineer hiring references runtime systems, robotics middleware, inter-process communication, DDS or Zenoh-style transports, task scheduling, and operator-facing tooling. The Actuation Engineer and Mechanical Design Engineer, Tactile Sensing roles show direct work on joint actuators, end effectors, mobility systems, fingertips, palms, gripper surfaces, and data-collection gloves. Systems engineering and safety postings add integrated architecture, DFMEAs, HARAs, validation, and field-readiness testing. Taken together, these sources support a genuinely full-stack robotics buildout, but they still stop short of disclosing what the first public robot configuration actually looks like in production.
    tableRefs: [TE003]
    figureRefs: [FE003]
