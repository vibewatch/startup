company:
  name: Mind Robotics
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Mind Robotics publicly describes a full-stack industrial physical-AI platform rather than a
    single disclosed robot SKU: foundation models, purpose-built hardware, and deployment
    infrastructure aimed at dexterous, variable, reasoning-intensive manufacturing work. Official
    materials and independent coverage make Rivian's active manufacturing lines the key technical
    input, with production-scale data and a live deployment environment serving as the clearest
    evidence-backed moat. Developer-signal sources show the stack reaching from teleoperation,
    tactile sensing, actuation, middleware, and systems engineering to multimodal / VLA model
    training, distributed ML infrastructure, and data quality tooling. What remains undisclosed is
    equally important: public sources still do not provide a named robot SKU, payload, cycle time,
    autonomy level, deployment count, uptime, or certification record, and one safety job posting's
    reference to a humanoid platform leaves form factor ambiguous despite broader messaging that
    stresses industrial tasks and collaborative operation rather than a humanoid go-to-market story.

sections:
  - id: product-definition-public-scope
    title: Product Definition and Public Scope
    body: |-
      Mind Robotics' public product description is consistent at the thesis level but still thin at the SKU level. The official homepage says the company is building “intelligent robotics for industrial deployment,” starting on the factory floor, while the March and May 2026 official financing releases describe an industrial robotics platform made up of AI foundation models, hardware, and deployment infrastructure. Assembly Magazine and RoboticsTomorrow repeat the same framing: Mind is targeting dexterous, variable, and reasoning-intensive manufacturing work that conventional robots struggle to automate because the job is not perfectly repeatable or dimensionally stable.

      That framing matters because it defines what the product is not. Public messaging explicitly rejects “single-task machines,” and Manufacturing Digital cast the company as different from Tesla's humanoid narrative by focusing on factory AI and human-like skills for industrial work rather than a general-purpose consumer-style robot. Yet the reviewed source set still does not disclose a named robot SKU, robot geometry, payload, reach, cycle time, or workstation configuration. As of the 2026-06-09 run date, the most supportable product conclusion is that Mind has publicly sold a platform thesis and live-line deployment story, not a fully specified public robot datasheet.
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
