  - id: safety-collaboration-and-deployment-assumptions
    title: Safety, Collaboration, and Deployment Assumptions
    body: |-
      Safety and collaboration are central to Mind's story, but the public evidence is still more directional than certified. The homepage says Mind is building a “safe, collaborative robot platform designed to work alongside humans,” which matches the external operating context described by OSHA, NIST, A3, and ISO/TS 15066. Those technical and standards sources collectively emphasize that industrial robot deployments in shared workspaces require explicit hazard analysis, risk assessment, collaborative-operation controls such as power-and-force limiting and speed-and-separation monitoring, and clear integrator / operator responsibilities. NIST also stresses that adoption depends on robots being adaptable, easily tasked, safely partnered with humans, and quickly integrated into manufacturing enterprises.

      Mind's own developer-signal sources are consistent with that interpretation. The Systems Engineer role calls out system-level requirements, ICDs, DFMEAs, HARAs, and acceptance criteria from bench testing through field deployment. The Safety Engineer role explicitly references end-to-end functional safety, E-stops, safety-rated monitored stops, power-and-force limiting, and speed-and-separation monitoring. The complication is that the same safety posting mentions “our humanoid platform,” which conflicts with broader external coverage that frames Mind as task-focused industrial robotics rather than a humanoid product story. As of the run date, the supportable conclusion is that collaborative safety is a real design priority, but public certification status, conformance evidence, and even exact form factor remain undisclosed.
    tableRefs: [TE004]
    claimRefs:
