tables:
  - id: TE001
    title: Product module / asset matrix
    targetSlug: product-module-asset-matrix
    columns:
      - Module / asset
      - Public evidence
      - Current status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Foundation-model layer
        - Official releases say Mind is building AI foundation models for industrial robotics.
        - Publicly described; maturity not benchmarked
        - Positions product as a platform rather than a scripted cell integrator
        - No public model family, parameter scale, eval suite, or policy benchmark
      - - Robot hardware platform
        - Official and press sources say hardware is purpose-built and robust, but no SKU is named.
        - Publicly described; form factor undisclosed
        - Purpose-built hardware suggests tighter integration than software-only robotics stacks
        - No public payload, reach, cycle time, mobility, or workstation design
      - - End effectors and tactile sensing
        - Tactile-sensing hiring references fingertips, palms, gripper surfaces, and contact-rich subsystems.
        - In active buildout
        - Suggests Mind is targeting manipulation quality, not only navigation or perception
        - No public sensor resolution, durability, grasp benchmark, or end-effector SKU
      - - Teleoperation and data collection
        - Product role describes teleoperation cockpits, VR, haptics, and ultra-low-latency streaming.
        - In active buildout
        - Creates a mechanism for rapid human demonstration, debugging, and data flywheel growth
        - Human-in-the-loop share of production workflow is not disclosed
      - - Data / training platform
        - Data architect, ML infra, and modeling roles describe pipelines, validation, labeling, and distributed training on hundreds of GPUs.
        - In active buildout
        - Supports faster iteration on physical-AI models than single-site manual workflows
        - No public training cost, compute vendor, model-refresh cadence, or dataset size beyond Rivian scale framing
      - - Runtime / deployment software
        - Robotics software and systems postings reference runtime systems, middleware, task scheduling, lifecycle management, and field readiness.
        - In active buildout
        - Indicates Mind is building deployment infrastructure, not just models
        - No public SDK, API surface, customer console, or support SLA
    notes: >-
      Mind publicly discloses layers of the stack rather than a finished commercial SKU list. The
      matrix therefore mixes explicit product statements with developer-signal evidence from current
      openings. Coverage is partial because Mind has not published a public robot datasheet.
