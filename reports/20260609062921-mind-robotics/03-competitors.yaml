callouts:
  - calloutType: risk
    title: Incumbents Own Today’s Trust Layer
    body: >-
      ABB, FANUC, KUKA, Yaskawa, Universal Robots, and similar vendors enter most factory evaluations with the advantage of installed base, service networks, known procurement paths, and mature product catalogs. Even if Mind’s adaptive thesis is more ambitious, it still has to displace trusted alternatives that can solve many workflows with lower organizational risk.
    claimRefs: [CP027, CP033, CP036]
  - calloutType: insight
    title: Rivian Makes Mind More Than Another Humanoid Story
    body: >-
      Mind’s clearest public wedge is not a robot form factor; it is the combination of live factory deployment access and production-scale data from Rivian. That can matter more than a flashy demo if it translates into faster iteration and better reliability on real manufacturing tasks. The same relationship, however, also makes concentration risk impossible to ignore.
    claimRefs: [CP035, CP037, CP039]
