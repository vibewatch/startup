  rows:
  - - Installed industrial robot systems
    - Robot arms, controllers, sensors, end effectors, and robot-cell software used on factory tasks
    - General MES/ERP spend with no robotic execution layer
    - Manufacturing engineering / plant capex
    - Core narrow market lens
  - - Flexible manipulation and adaptive workcells
    - Perception, safety, retasking software, integration, and tooling for variable tasks in human-proximate cells
    - Fixed single-purpose automation that does not need adaptation after commissioning
    - Plant automation, operations, and EHS
    - Best fit for Mind’s physical-AI thesis
  - - Automotive production automation
    - Battery, chassis, e-motor, fastening, inspection, and final-assembly robotics
    - Dealer software, aftersales tools, or consumer vehicle tech
    - OEM plant operations and capex owners
    - Primary launch environment because Rivian is a live factory partner
  - - High-mix general manufacturing
    - Machine tending, subassembly, inspection, packaging, and mixed-material handling with robotics
    - Process-industry spend with minimal robotic execution requirements
    - Plant managers, integrators, and automation leads
    - Adjacency for expansion after automotive proof
  - - Adjacencies outside this chapter’s core frame
    - Warehouse AMRs, service robots, pure factory software, and fixed conveyance
    - N/A
    - Separate logistics or corporate software budgets
    - Useful context, but not the canonical Mind market boundary
  notes: Boundary is defined to isolate spend where dexterity, safety, retasking, and physical execution matter. It intentionally excludes large factory-tech categories that do not require adaptive robotic behavior.
