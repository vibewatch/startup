  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: som-framing
    missingEvidence: Priced deployments, deployed robot or workcell counts, external customer names, and conversion from pilot to scaled line.
    whyItMatters: Without those metrics, any SOM claim would overstate commercial evidence and blur the difference between technical promise and proven adoption.
    diligencePath: Request current deployment count, live workcells by workflow, booked contract value, and a named customer pipeline beyond Rivian.
    relatedQuestionRefs:
    - QM023
    - QM024
  - type: missing-source
    severity: material
    topic: budget-owners
    missingEvidence: Public procurement documents or customer case studies that name exact budget owners, budget size, and procurement cycle length for adaptive industrial-robot deployments.
    whyItMatters: Budget authority and buying-cycle length determine sales efficiency and valuation multiples for a capital-intensive automation company.
    diligencePath: Request customer deployment case studies, procurement approvals, and budget-owner interviews from manufacturing engineering, operations, and EHS stakeholders.
    relatedQuestionRefs:
    - QM012
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A like-for-like third-party market study that isolates dexterous adaptive industrial robotics as a distinct category with a consistent 2026 scope definition.
    whyItMatters: Public market estimates vary too widely to use interchangeably, which can distort TAM narratives and valuation framing if the scope shift is hidden.
    diligencePath: Commission or obtain a category study that separates installed robotics, broader robotics systems, and the wider automation stack with explicit inclusion rules.
