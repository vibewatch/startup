  - - Electronics and precision assembly
    - Manufacturing engineering
    - Technicians and quality staff
    - Program or plant capex budget
    - Pick-place, micro-assembly, test, and inspection
    - Engineering + quality
    - Higher mix, higher precision, and rising demand for safer human collaboration
  - - Inspection and rework cells
    - Operations excellence or quality owner
    - Inspectors and rework technicians
    - Operations improvement budget
    - Vision-guided inspection, defect routing, and adaptive handling
    - Quality + operations
    - Need to reduce scrap and stabilize quality in mixed conditions
  - - Brownfield general manufacturing retrofits
    - Integrator plus plant sponsor
    - Production supervisors and operators
    - Plant capex / continuous-improvement budget
    - Retrofitting robot cells into existing lines
    - Plant manager + integrator + safety owner
    - When throughput loss from labor friction exceeds retrofit cost
  notes: Buyer, user, payer, and budget-owner roles are inferred from how industrial robot cells are deployed in automotive and broader manufacturing. Public sources support the structure of the buying center more than exact budget values.
