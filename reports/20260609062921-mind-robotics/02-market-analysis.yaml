- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: standard
  summary: The commercialization bottleneck is the sequence from task identification to validated line-scale rollout, not the existence of a single impressive demo.
  data:
    nodes:
    - id: workflow
      label: Workflow selection
      detail: Choose a repetitive but variable task with labor, quality, or safety pain.
    - id: roi
      label: ROI screen
      detail: Quantify cycle-time, labor, scrap, and uptime upside against capex.
    - id: safety
      label: Safety + integration validation
      detail: Run risk assessment, cell design, and compatibility checks with existing lines.
    - id: pilot
      label: Pilot cell live
      detail: Prove the robot in a real workcell rather than a lab demo.
    - id: rollout
      label: Multi-line rollout
      detail: Scale only after uptime, quality, and change-management hold in production.
    - id: expansion
      label: Plant and segment expansion
      detail: Reuse proof points to win adjacent workflows and new factories.
    edges:
    - from: workflow
      to: roi
      label: economic case
    - from: roi
      to: safety
      label: engineering approval
    - from: safety
      to: pilot
      label: commissioning
    - from: pilot
      to: rollout
      label: production proof
    - from: rollout
      to: expansion
      label: repeatable template
  approximationNotes: The flow is evidence-backed but qualitative. Public sources support the stage gates, not average conversion rates between them.
