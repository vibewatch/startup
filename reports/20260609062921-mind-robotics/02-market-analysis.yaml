- id: sizing-lenses
  title: 'Sizing Lenses: Large Market, but Boundary Definitions Matter More Than Hype'
  body: |-
    Public market data supports a large opportunity, but not a single clean number. IFR’s official 2026 view puts the market value of industrial robot installations at US$16.7 billion and shows demand in factories still running above half a million annual units, with 4.664 million industrial robots in operation globally. That is the cleanest narrow lens for installed industrial robotics. Analyst firms publish wider frames: MarketsandMarkets places the 2026 industrial robotics market at US$15.5 billion with 5.0% CAGR, while Future Market Insights stretches the category to US$65.1 billion with 18.1% CAGR through 2036. StartUs goes broader still by describing a US$221.64 billion industrial automation stack.

    The correct conclusion is not that one source is right and the others are wrong. The conclusion is that category boundaries move the valuation story dramatically. A supportable TAM lens for Mind is the narrow US$15.5-16.7 billion installed-industrial-robotics range. A supportable SAM is narrower still: the subset of spend attached to variable factory tasks where adaptation, collaboration, and rapid retasking matter. A precise SOM is not publicly supportable because Mind has not disclosed priced deployments, workcell counts, robot counts, or non-Rivian customer traction. Those missing company metrics should be preserved as diligence gaps rather than guessed away.
