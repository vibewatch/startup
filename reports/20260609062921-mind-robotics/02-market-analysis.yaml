- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Replacement openings and skilled-labor shortages
    - Driver
    - Now through 2034
    - Supports automation budgets even if total manufacturing employment is flat
    - Request task-level labor vacancy and turnover data at customer plants
  - - AI, autonomy, and IT/OT convergence
    - Driver
    - Now and 3-5 years
    - Expands the addressable set of tasks beyond rigid programmed sequences
    - Test how much real-world retasking is model-based versus hand-engineered
  - - Automotive EV and battery complexity
    - Driver
    - Now and medium term
    - Creates many multi-step, high-precision workflows where flexible automation matters
    - Map which battery and final-assembly steps still rely on manual intervention
  - - Safety standards, risk assessment, and compliance load
    - Constraint
    - Immediate and ongoing
    - Raises deployment cost and slows scale-up of human-proximate robots
    - Request safety-case templates, validation data, and certification pathway by workcell
  - - Integration and measurement-science burden
    - Constraint
    - Immediate and ongoing
    - Demands proof on uptime, dexterity, and compatibility with existing cells
    - Ask for time-to-integrate, commissioning labor, and failure-mode data
  - - Capex discipline and ROI proof
    - Constraint
    - Now
    - Buyers will fund pilots faster than line-wide rollouts unless economics are validated
    - Request payback assumptions, labor savings, scrap reduction, and throughput uplift
  - - Incumbent crowding on classical tasks
    - Mixed
    - Now
    - Limits whitespace on standard welding, handling, and paint use cases
    - Force segmentation by variable-task workflow rather than by all robot spend
  notes: Rows combine macro tailwinds with deployment frictions. Timing is qualitative because public sources support direction more strongly than exact budget timing for any single buyer class.
