      - number: '2.3'
        title: 买方分群、预算归属，以及为什么汽车是强势滩头阵地
        blocks:
          - type: paragraph
            body: >-
              最能从灵巧自适应机器人受益的细分场景，是那些变化太高、刚性自动化难以胜任，但规模又太大、不能长期依赖人工的场景。汽车是最清楚的早期例子。ABB 和 KUKA
              描述的生产环境已经覆盖电池模块、底盘、电机产线、总装、检测、厂内物流、仿真和测试。FANUC 的 2026 年演示进一步进入移动产线螺栓拧紧、感知人的搬运，以及自然语言机器人编程。换句话说，Mind
              想服务的工厂类型已经在买机器人，但遇到零件差异、运动和人员接近时，硬编码序列仍会失效。


              更广泛的制造业同样重要，但更加碎片化。机床上下料、电子子装配、检测、包装和混合材料处理都可能受益，但每个垂直领域都有不同的工作流经济性和安全容忍度。因此，买方归属是跨职能的。用户可能是产线操作员或自动化工程师，但有效购买中心通常包括制造工程、运营、工厂自动化，以及
              EHS 或安全。采用路径同样分阶段：挑一个工作流，证明经济性，通过安全和集成验证，跑通试点单元，然后才跨产线扩张。公开证据足以画出这条路径，但不足以精确量化预算规模或采购周期长度。
