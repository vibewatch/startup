  - id: TE003
    title: 技术 / 运营架构表
    targetSlug: technology-operating-architecture-table
    columns:
      - 层 / 组件
      - 作用
      - 依赖
      - 主要风险
    rows:
      - - 遥操作舱
        - 借助 VR、触觉反馈和低延迟流媒体，捕捉人类示教、远程介入和操作员直觉。
        - 人类操作员、网络质量、操作员工具
        - 如果遥操作仍深度嵌入生产，就很难判断自主能力成熟度
      - - 数据引擎
        - 采集、验证、标注、存储并检索训练和评估数据。
        - Rivian 产线数据、内部工具、云基础设施
        - 数据质量或数据模式漂移会拖慢训练，并掩盖模型退化
      - - 模型训练栈
        - 在数百块 GPU 上运行大规模多模态 / VLA 训练和迭代闭环。
        - 算力容量、分布式系统可靠性、数据流水线吞吐量
        - 成本和算力集中度可能成为规模化瓶颈
      - - 运行时 / 中间件层
        - 管理机器人系统上的消息传递、进程间通信、任务调度和生命周期管理。
        - 机器人软件框架、嵌入式约束、面向操作员的工具
        - 可靠性和延迟故障会直接损害现场表现
      - - 硬件执行与移动
        - 提供关节、末端执行器和移动执行能力，并围绕力、速度、刚度和效率调校。
        - 电机、齿轮箱、传动、感知、跨职能硬件集成
        - 供应商选择和机械取舍未披露
      - - 触觉感知和高接触操作
        - 将触觉反馈引入指尖、掌面、夹爪和数据采集手套。
        - 材料工程、封装、耐用性、校准
        - 目前未见抓取表现、寿命或维护负担的公开证据
      - - 系统与安全集成
        - 将子系统设计转化为 ICD、HARA / DFMEA 工作、验证和现场验收标准。
        - 标准解读、测试基础设施、整机集成构建
        - 公开符合性、认证和故障率证据仍缺失
    notes: 架构推断自官方技术栈描述和详细岗位职责，并非来自 Mind Robotics 发布的公开工程图。
