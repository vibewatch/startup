      - number: '5.2'
        title: 架构栈与建设信号
        blocks:
          - type: paragraph
            body: >-
              公开了解 Mind 架构的最佳窗口来自招聘信号；对一家没有发布详细技术图的公司来说，这些信号异常有信息量。数据与远程操作产品经理岗位描述了一个带 VR
              集成、触觉反馈和超低时延流媒体的远程操作平台，暗示人类演示和远程操作是数据采集与评估循环的一部分。数据架构师、机器学习基础设施工程师以及研究与建模岗位合在一起，指向一个围绕大规模数据摄取、验证、标注、跨数百个
              GPU 分布式训练，以及多模态 / VLA 模型开发搭建的栈；流程从数据到训练，再到真实机器人部署。


              机器人软件和硬件岗位补上了剩余图景。机器人软件工程师招聘提到运行时系统、机器人中间件、进程间通信、DDS 或 Zenoh
              式传输、任务调度和面向操作员的工具。执行器工程师与触觉传感机械设计工程师岗位显示，公司直接做关节执行器、末端执行器、移动系统、指尖、手掌、夹爪表面和数据采集手套。系统工程和安全岗位又加入集成架构、DFMEA、HARA、验证和现场就绪测试。合在一起，这些来源支持一个真正的全栈机器人建设，但仍没有披露首个公开机器人配置在生产中到底长什么样。
