      - number: '5.4'
        title: 安全、协作与部署假设
        blocks:
          - type: paragraph
            body: >-
              安全和协作是 Mind 故事的核心，但公开证据仍更多是方向性，而非认证性。官网称 Mind 在打造一个「设计为与人类并肩工作的安全协作机器人平台」，这与 OSHA、NIST、A3 和 ISO/TS 15066
              描述的外部运营语境一致。这些技术和标准来源共同强调，在共享工作空间部署工业机器人，需要明确的危害分析、风险评估、协作运行控制（如功率和力限制、速度和距离监控），以及清晰的集成商 / 操作员责任。NIST
              还强调，机器人能否被采用，取决于它们是否自适应、易于分配任务、能与人安全协作，并能快速接入制造企业。


              Mind
              自己的开发者信号来源与这个解读一致。系统工程师岗位提到系统级需求、ICD、DFMEA、HARA，以及从台架测试到现场部署的验收标准。安全工程师岗位明确提到端到端功能安全、E-stop、安全额定监控停止、功率和力限制，以及速度和距离监控。复杂之处在于，同一安全岗位提到「我们的人形平台」，这与更广泛外部报道冲突；后者把
              Mind 描绘为任务聚焦的工业机器人公司，而不是人形产品故事。截至运行日期，可支撑的结论是，协作安全是真实设计优先事项，但公开认证状态、合规证据，甚至确切形态仍未披露。
