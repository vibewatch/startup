        - 未公开训练成本、算力供应商、模型刷新节奏，或超出 Rivian 规模表述的数据集规模
      - - 运行时 / 部署软件
        - 机器人软件和系统岗位提到运行时系统、中间件、任务调度、生命周期管理和现场就绪。
        - 正在积极建设
