      - number: '5.3'
        title: 工作流、用例与 Rivian 数据飞轮
        blocks:
          - type: paragraph
            body: >-
              公开证据一致把 Mind 的产品绑定到真实制造工作流，而不是实验室机器人演示。官网称 Rivian 提供「来自活跃制造产线的生产规模数据」，2026 年 5 月融资公告称 Rivian
              提供用于模型训练和部署的真实、高产量制造环境。TechCrunch、AI2.work 和 Manufacturing Digital 都把 Rivian 描述为 Mind
              相对许多机器人初创公司的关键差异：Mind 不是只从合成基准起步；它从真实工厂运营入口、愿意部署的启动伙伴，以及应当能让模型暴露于实际制造中的变化、边缘案例和物理约束的反馈循环起步。


              即便任务清单不清楚，实际用例边界也很清楚。官方和独立来源称 Mind 聚焦高灵巧度、多变、需要推理、传统自动化难以处理的制造工作，但没有列出具名单元、周期时间或部署数量。Rivian 自身 2026 年 Q1
              生产公告给「生产规模」说法提供背景：当季生产 10,236 辆、交付 10,365 辆，表明伙伴环境不是试点线。这有助于验证数据护城河故事，但也让故事集中化：最强的证据支撑优势是 Rivian
              入口，最大的未答市场进入问题则是 Mind 能否在这个受控启动环境之外证明类似价值。
