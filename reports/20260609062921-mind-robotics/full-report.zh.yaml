      - number: '3.4'
        title: Mind 的相对位置、Rivian 楔子与正确对照组
        blocks:
          - type: paragraph
            body: >-
              Mind 最有公开支撑的差异化，是 Rivian 关系。公司官网称 Rivian 提供来自活跃制造产线的生产规模数据，3 月融资材料和 TechCrunch 的剥离报道也强化了一个判断：Mind
              不是在真空里开发。这给了 Mind 一个可信的工厂原生数据与部署循环；这种循环不是通用软件层公司或许多硬件优先初创公司在本次审阅材料包中公开展示过的。重要的是，Mind
              想赢靠的是自适应制造表现，而不只是机器人形态。然而，同一事实也制造集中风险：公开证据仍压倒性地围绕单一启动伙伴，而不是多元客户基础。


              因此，最好同时把 Mind 与三组公司比较。OEM 和协作机器人厂商是今天制造预算之争的正确基准，因为它们掌握分发、目录成熟度和服务可信度。Agility、Sanctuary、Figure
              及类似初创公司，是未来通用机器人定位、人才竞争和投资者叙事的正确基准。Intrinsic、Skild AI 和 Physical Intelligence，则是软件与模型层的正确基准，后者可能侵蚀任何新进入者的
              AI 差异化。Mind 的上行空间在于，它可能比纯模型玩家拥有更好的工厂数据和部署语境，同时比经典 OEM
              讲出更自适应的故事。弱点在于，公开证据对可重复部署、定价和客户多元化的证明，仍明显比最强竞争者的信任信号薄。
