  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与公开范围
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics 的公开产品描述在投资逻辑层面一致，但在 SKU 层面仍很薄。官网称公司在打造「面向工业部署的智能机器人」，从工厂地面起步；2026 年 3 月和 5 月的官方融资公告则描述了一个由
              AI 基础模型、硬件和部署基础设施组成的工业机器人平台。Assembly Magazine 和 RoboticsTomorrow 重复同一框架：Mind
              瞄准高灵巧度、多变、需要推理的制造工作；传统机器人难以自动化这些工作，因为任务并非完全可重复，也不是尺寸稳定。


              这个框架重要，因为它定义了产品不是什么。公开信息明确拒绝「单任务机器」，Manufacturing Digital 也把公司描绘为不同于 Tesla 的人形叙事：Mind 聚焦工厂 AI
              和面向工业工作的类人技能，而不是通用消费式机器人。然而，本次审阅的来源集仍未披露具名机器人 SKU、机器人几何形态、负载、臂展、周期时间或工位配置。截至 2026-06-09
              运行日期，最可支撑的产品结论是，Mind 公开销售的是平台逻辑和真实产线部署故事，而不是一份完整指定参数的公开机器人数据表。
