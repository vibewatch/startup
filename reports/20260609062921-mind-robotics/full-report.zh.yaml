      - number: '4.2'
        title: 资金可能流向哪里：部署、集成与硬件成本强度
        blocks:
          - type: paragraph
            body: >-
              Mind 的官方与招聘表面，让资金用途故事比收入故事更清楚。公司反复描述一个全栈项目：结合模型、机器人、部署基础设施和真实工厂伙伴。当前职位覆盖执行器、系统、安全、远程操作、ML
              基础设施、运行时软件和运营，岗位集中在 Palo Alto 现场办公。这个组合意味着资本正投向硬件设计、贴近制造的工程、部署工具和现场运营，而不只是前沿 AI 研究。


              独立机器人来源说明了为什么这在财务上重要。McKinsey 的运营研究称，许多高管仍难以证明机器人的商业价值，缺乏内部能力，并且历史上接受五到七年回本周期，直到更新的柔性系统把目标压缩到一到三年。BCG
              认为成本问题很大程度落在设置和再工程上，Bain 和 McKinsey 都显示先进机器人仍受监督需求、组件瓶颈和有限运行时长约束。McKinsey
              的人形机器人供应链分析作为成本强度类比尤其有用：执行器主导物料清单，总单位成本仍跨度很大，若干精密组件供应商还没准备好顺畅大规模放量。对 Mind
              而言，这意味着资本栈买到的更可能是工程时间、供应商学习和部署迭代，而不是近期自由现金流。
