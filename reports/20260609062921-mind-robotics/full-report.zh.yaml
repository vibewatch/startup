        - from: integration
          to: runtime
          label: 软件可压缩重复工作
        - from: runtime
          to: uptime
          label: 运营验证
        - from: uptime
          to: payback
          label: 经济论证
    approximationNotes: 该图使用行业类比，而不是 Mind 披露的特定成本。它旨在展示规模化支出与客户 ROI 之间的因果桥。
