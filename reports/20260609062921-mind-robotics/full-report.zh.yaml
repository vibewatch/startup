  - id: TV003
    title: 可比估值表
    columns:
      - 可比对象
      - 最新披露估值或融资信号
      - 公开证明信号
      - 与 Mind 的相关性
      - 局限性
    rows:
      - - Figure AI
        - $675M 轮次对应 $2.6B 估值（2024）
        - BMW 商业协议加 OpenAI 合作
        - 最接近的早期大规模人形机器人融资基准，且有具名工业证明
        - 估值早于 Mind 2026 年轮次，当前可能低估市场情绪
      - - Apptronik
        - Series A 资本 $935M+，估值约 $5.0B-$5.3B（2026）
        - Mercedes-Benz、GXO、Jabil 和 Google DeepMind 已被公开提及
        - 高融资工业人形机器人商业化的最佳 2026 年可比对象
        - 仍部分依赖公司说法和选择性公开披露
      - - Skild AI
        - 融资 $1.4B，对应 >$14B 估值（2026）
        - 基础模型叙事加公司声称的早期收入
        - 物理 AI 热潮中高端软件平台可比对象
        - 商业模式比 Mind 更偏软件中心，工厂特定性更弱
      - - Agility Robotics
        - 估值未披露；已宣布 Toyota 商业协议（2026）
        - 具备 Toyota、GXO、Schaeffler 和 Amazon 的公开部署证明
        - 外部客户验证中最偏证明导向的可比对象
        - 缺少公开估值，无法直接锚定价格
      - - Collaborative Robotics
        - $100M Series B；累计融资约 $140M（2024）
        - 聚焦实用型协作机器人商业化
        - 范围更窄的协作机器人下限可比对象
        - 公司野心和硬件复杂度都小于 Mind
      - - Standard Bots
        - $63M 融资轮（2024）
        - AI 驱动协作机器人臂品类扩张
        - 又一个下限可比对象，代表产品线机器人而非平台级 AI
        - 不是人形机器人，也不是全栈工业 AI 平台
      - - Boston Dynamics / Hyundai
        - 约 $1.1B 收购背景（2021）
        - 大型工业母公司内部的战略机器人资产
        - 可作为先进机器人资产的历史战略价值参考
        - 交易较早，产品组合不同，降低了直接可比性
      - - 上市自动化龙头
        - 作为公开且披露收入的边界样本，而非直接定价锚
        - Symbotic、Rockwell、ABB 和 Teradyne 都发布投资者材料或监管文件
        - 有助于显示 Mind 与上市自动化龙头之间的成熟度差距
        - 没有 Mind 收入数据，无法直接套用它们的交易倍数
    notes: 这是对最有决策价值的公开可比信号的部分列举，强调已披露估值、融资规模和商业化证据，而不是尝试完整盘点机器人行业。
