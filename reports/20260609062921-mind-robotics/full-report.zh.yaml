        - 在 Rivian 之外的市场展示外部部署增长
      - - 战略位置
        - Rivian 给了 Mind 一个真实制造环境和多数初创公司没有的数据飞轮
        - 过度依赖单一锚定伙伴，可能掩盖泛化能力不足
        - 发布学习成果可迁移到第三方场地的证明
