      - number: '8.2'
        title: 正确可比集是私有 Physical AI，公开龙头只适合作边界参照
        blocks:
          - type: paragraph
            body: >-
              Mind 不应像普通 SaaS 公司一样估值，因为公开来源没有披露收入基数，无法做收入倍数法。也不应直接套用公开工业自动化龙头，因为这些公司披露了经审计收入、利润率和治理，而 Mind
              没有。最接近的一级可比集，是当前私有 physical-AI 和人形机器人队列：Figure 2024 年估值 $2.6 billion，并有 BMW 和 OpenAI 支持；Apptronik 2026
              年估值约 $5.0 billion 至 $5.3 billion，总融资接近 $1 billion；Skild 2026 年估值超过 $14 billion，讲的是明确的 omni-bodied
              软件故事，并声称已有早期收入；Agility 则通过 Toyota 和其他具名客户展示了公开商业验证，尽管估值未披露。


              下界语境来自更窄的自动化公司，如 Collaborative Robotics 和 Standard Bots，分别融资 $100 million 和 $63
              million。这些公司更像产品品类公司，而不是全栈平台赌注。Symbotic、Rockwell、ABB 和 Teradyne
              等上市公司仍有用，但主要作为成熟度边界：它们披露投资者关系材料、年度报告，Teradyne 还披露数十亿美元年收入。因此，适用于 Mind 的框架，是基于情景的私募轮 benchmark
              加验证里程碑，而不是把上市公司倍数做一个看似精确的移植。实际含义是，投资者买的是战略可选性、资本厚度和预期外部商业化，而不是已披露的单位经济模型。
