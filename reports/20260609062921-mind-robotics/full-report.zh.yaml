      - number: '3.2'
        title: 既有 OEM 和协作机器人厂商掌握当前信任层
        blocks:
          - type: paragraph
            body: >-
              在审阅的公开记录中，Mind 最大竞争劣势不是想象力，而是装机基础信任。ABB 自称全球领先机器人供应商之一，并销售一套覆盖工业和协作机器人、AMR、软件、服务和应用方案的整合组合。FANUC 称其通过 280
              多个服务点支持 100 多个国家的客户，KUKA 和 Yaskawa 也销售宽广的工业机器人和应用栈。Universal Robots 拥有成熟协作机器人生态，如今也用「物理
              AI」语言包装产品，但没有放弃标准化机械臂的实用吸引力。这些厂商已经会讲工厂工程、正常运行时间、零部件、服务和已知部署模式的语言。


              Standard Bots 说明了为什么协作机器人厂商尤其会与 Mind 竞争预算。它的官网给出型号名称、负载、臂展和起售价，比 Mind 仍偏定制化的全栈叙事更接近熟悉的采购动作。Universal
              Robots 更依赖询价，但仍然把自身呈现为面向工业自动化的安全、灵活机械臂，而不是推测性的通用能力。这意味着 Mind
              可能瞄准的许多任务，只要工作流能被足够清楚地圈定，仍可用更简单、更便宜、更容易批准的机械臂部署来解决。Mind
              也许瞄准经典自动化之上的层级，但在灵巧需求有意义、又没有完全开放式的场景里，既有厂商和协作机器人仍是默认对照组。
