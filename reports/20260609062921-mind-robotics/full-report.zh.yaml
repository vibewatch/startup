      - number: '6.3'
        title: 销售动作、部署模式与切换成本
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Mind Robotics 卖的不是轻量级软件订阅，而是重交付的工业部署。公司自己称，Rivian
              作为初始伙伴让团队能够聚焦技术执行；招聘信号也指向数据采集、遥操作、机器人运营、集成与部署管线。Built In 和 Ashby
              上的开放岗位涵盖数据与遥操作产品管理、机器人工程系统项目管理、机器人运营、运行时系统、CI/CD，以及硬件 / 软件 /
              数据集成。合在一起看，销售动作很可能从一个设计伙伴工厂起步，先围绕具体产线采数据、做系统集成，再在实地运营中证明效果，之后才尝试更大范围铺开。


              这种模式也意味着买方要承担不低的切换和集成成本。OSHA 的机器人安全指南指出，工业机器人系统通常要接入输送线、工作台、工艺设备和其他机器；自有编程方式还可能要求专项培训。NIST
              的协作机器人工作强调，安全的人机协作要规模化，前面需要数据集、基准、测试方法、协议、指标和标准。落到采购现场，买方采用 Mind
              可能需要工厂工程时间、集成商协调、安全验证和流程重设计。这些摩擦在部署后能形成粘性；但如果 ROI 或落地信心不足，也会拖慢新客户转化。
