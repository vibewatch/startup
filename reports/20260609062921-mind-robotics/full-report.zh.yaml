  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: 公开证据支持一条全栈部署收入路径，但试点之后每一步变现仍未商业披露。
    data:
      nodes:
        - id: pain
          label: 工厂痛点
          detail: 固定自动化表现不足的多变制造工作，需要灵巧操作。
        - id: pilot
          label: 试点设计
          detail: 界定一个工作流，并在真实工业环境中验证。
        - id: hardware
          label: 硬件 + 部署
          detail: 提供机器人、调试，以及安全要求高的安装工作。
        - id: runtime
          label: 运行时 + 操作员层
          detail: 围绕工作单元运行中间件、监控和面向操作员的工具。
        - id: data
          label: 数据 / 遥操作闭环
          detail: 持续采集并改进数据、遥操作和模型表现。
        - id: expand
          label: 规模化铺开与支持
          detail: 若经济性站得住，从一个工作流扩展到更多产线、站点和服务合同。
      edges:
        - from: pain
          to: pilot
          label: 工作流选择
        - from: pilot
          to: hardware
          label: 部署合同
        - from: hardware
          to: runtime
          label: 运营工具
        - from: runtime
          to: data
          label: 改进闭环
        - from: data
          to: expand
          label: 可复制经济性
    approximationNotes: 该桥接图映射来源包中可见的商业化层次，并不意味着 Mind 已在每一步披露付费收入。
