  - id: TE002
    title: 工作流 / 用例表
    targetSlug: workflow-use-case-table
    columns:
      - 用户任务 / 工作流
      - 当前工作流痛点
      - Mind 涵盖的解决方案
      - 可能收益
      - 限制 / 待解问题
    rows:
      - - 可变工厂增值任务
        - 经典自动化更擅长处理可重复、尺寸稳定的工作，不擅长可变任务。
        - Mind 瞄准灵巧、可变、需要推理的制造任务。
        - 将自动化扩展到仍依赖人类适应能力的岗位
        - 公开来源未点名具体工作站类型或节拍时间目标
      - - 人类示教和数据采集
        - 没有高质量示教和边缘案例捕捉，纯自主很难冷启动。
        - 遥操作平台、VR、触觉反馈和超低延迟流媒体似乎用于支撑示教捕捉和评估。
        - 更快迭代模型，并把策略扎根到真实硬件行为
        - 生产工作中遥操作与自主完成的比例未公开
      - - 产线现场模型训练和验证
        - 单靠实验室数据和仿真，会漏掉工厂变量和部署摩擦。
        - Rivian 提供生产规模数据和真实制造环境，用于训练和部署。
        - 更高质量的真实世界数据飞轮和更快调试
        - 集中在单一首发环境，可能限制外部有效性
      - - 工厂现场人机协作
        - 许多高价值制造任务仍需要人类灵巧性，或依赖安全共作前提。
        - Mind 公开称，正在构建可与人并肩工作的安全协作机器人平台。
        - 重配置负担可能低于完全隔离的固定工作站
        - 公开安全架构和认证证据未披露
      - - 跨制造领域扩张
        - 面向特定任务的机器人，往往难以跨产品线或工厂迁移。
        - Mind 声称其平台可先跨核心任务泛化，再跨制造领域泛化。
        - 长期 TAM 大于单一固定功能或单厂工具
        - 除 Rivian 场景外，未见公开跨领域部署证明
      - - 部署基础设施和现场集成
        - 工业 AI 常败在调试、集成和支持，不是模型演示阶段。
        - 官方发布明确把部署基础设施纳入产品。
        - 说明 Mind 想掌控安装和运行时运营，不只是推理
        - 未公开安装商模式、集成商网络或在线率 / 支持指标
    notes: 用例以工作流表述，因为 Mind 尚未公开具名机器人 SKU 或成熟应用清单。收益估计为定性判断，并关联官方来源描述的传统工厂自动化缺口。
