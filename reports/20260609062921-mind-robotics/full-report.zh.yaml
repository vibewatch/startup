        - 不到一年融资超过 $1B，降低了近期融资压力
        - 快速融资也可能掩盖客户层面证明缺失
        - 披露烧钱速度、现金跑道和股权结构优先级
      - - 竞争位置
        - Mind 的定价已经进入 Figure、Apptronik、Skild 和 Agility 同一组讨论
        - 多个同行披露的商业或收入证据强于 Mind
        - 增加客户标识、ROI 和正常运行率披露
      - - 公开估值支撑
        - Reuters/Yahoo 验证了 $3.4B 轮次，因此价格并非只有传闻
        - 运营指标对价格的支撑仍然偏弱
        - 提供能检验当前估值标记的经济性数据
      - - 退出路径
        - 如果外部证明出现，战略买家或后续成长轮都有可能
        - 没有这些证明，平轮或下轮就会成为现实可能
        - 展示多元需求和更透明的优先股堆叠
    notes: 本表把乐观情景和反向逻辑都绑定到具体尽调触发项，而不是依赖抽象的公司质量判断。
