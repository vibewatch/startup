  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与真正的待完成任务
        blocks:
          - type: paragraph
            body: >-
              不应把 Mind Robotics 放进整个自动化宇宙里比较。公司自己的定位更窄，也更有意思：它称自己在打造面向工业部署的智能机器人，起点是工厂地面，数据飞轮绑定 Rivian
              的活跃制造产线。这指向一个具体待完成任务：自动化那些多变、需要灵巧操作、接近人类、过去很难标准化的工厂工作。相关支出因此包括机器人硬件、末端执行器、感知、安全系统、工位软件，以及让机器人在真实工作单元里有用所需的集成工作。它不应逻辑上包括所有工业软件、固定输送自动化或非工业服务机器人。


              这个边界重要，因为现状不是单一竞争者。买方可以继续人工操作，购买经典固定用途机器人单元，或聘请集成商拼出一套定制自动化栈。Mind
              的启动楔子有吸引力，因为汽车工厂已经接受高机器人资本开支和严格正常运行时间要求，但在电池、总装、紧固和检测环节仍有大量多变任务。因此，更准确的市场理解，是工业自动化预算与经典机器人留下的灵巧度缺口之间的重叠，而不是所有工厂技术支出。
