      - number: '4.3'
        title: 收入模式、变现界面，以及公开记录仍隐藏什么
        blocks:
          - type: paragraph
            body: >-
              可支撑的公开收入模式只存在于架构层面，而不是业绩层面。Mind
              的官方材料和招聘记录支持一个商业化栈，可能包括机器人单元部署、集成服务、运行时和编排软件、远程操作和数据工具，以及长尾服务或支持。它们不支持公开定价、已签合同结构、已实现
              ASP、收入组合或利润率。即便市场进入证据也只是间接的：A3 的 2026 年机器人订单数据显示买方仍在自动化上花钱，且需求正在汽车 OEM 之外扩展，但这些市场数字不会揭示 Mind 自身的
              CAC、回本周期或转化。Mind 从 Rivian 的工厂地面起步，在商业上有用，但也让公开图景集中在一个启动环境周围。


              这种不透明更关键，因为公开自动化类比公司披露得多得多。Rockwell 的投资者页面展示当前盈利和 10-Q，Teradyne 维护实时 SEC 申报页面，Symbotic 和 ABB
              等其他机器人或自动化可比公司也有 SEC EDGAR 入口。以这个基准看，Mind
              缺少收入、ARR、毛利率、烧钱速度、现金跑道、债务和股权结构表细节，不是小遗漏；这是核心承销障碍。投资者能看到资本可得、成本可能很高，但仍无法测试收入质量是否足够快地出现，来支撑估值跃升。
