  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 客户集中、安全负担和集成复杂度交叉处，剩余风险最高；融资风险低于执行风险，因为当下最稀缺的投入不是资本。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余暴露
      rows:
        - label: Rivian 集中度
          values:
            - 高
            - 高
            - 低-中
            - 高
        - label: 安全 / 责任负担
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 工厂集成 / 停机
          values:
            - 高
            - 高
            - 低-中
            - 高
        - label: 锚点任务外技术表现不达标
          values:
            - 中-高
            - 高
            - 低-中
            - 高
        - label: 管理与招聘带宽
          values:
            - 中
            - 中-高
            - 中
            - 中-高
        - label: 融资 / 营运资本压力
          values:
            - 中
            - 中-高
            - 中
            - 中
    approximationNotes: 该矩阵是序数而非数值；评级反映公开证据强度，而不是未披露的内部指标。
    claimRefs:
      - CR015
      - CR018
      - CR026
      - CR028
      - CR031
      - CR037
      - CR039
      - CR047
      - CR048
      - CR049
  - id: FR002
    title: 风险传导图
    type: dag
    summary: Mind 大多数风险都经由少数路径传导：集中度、安全和集成压力，最终会体现在收入韧性、利润率质量、融资需求和估值信心上。
    data:
      nodes:
        - id: concentration
          label: Rivian 集中度
          detail: 一个合作伙伴锚定数据、部署和大部分公开证明集。
        - id: safety
          label: 安全与责任负担
          detail: 标准、验证和产品责任义务可能拖慢部署，或重塑部署方式。
        - id: integration
          label: 集成与停机风险
          detail: 遗留系统和工厂工作流可能卡住原本有前景的机器人。
        - id: revenue
          label: 收入韧性
          detail: 商业可重复性取决于客户多元化和成功部署。
        - id: margin
          label: 利润率质量
          detail: 现场服务、重新设计和合规工作可能吃掉毛利。
        - id: financing
          label: 融资需求
          detail: 硬件和部署基础设施需要先投入资本，之后才可能证明可重复性。
        - id: valuation
          label: 估值信心
          detail: 投资人买单的是证明，不只是资源入口和资本。
        - id: operations
          label: 运营可信度
          detail: 客户需要产线安全、可审计、可维护的自动化方案。
      edges:
        - from: concentration
          to: revenue
          label: 收窄
        - from: safety
          to: operations
          label: 制约
        - from: integration
          to: operations
          label: 可能扰动
        - from: operations
          to: revenue
          label: 推动
        - from: operations
          to: margin
          label: 塑造
        - from: margin
          to: financing
          label: 增加
        - from: revenue
          to: valuation
          label: 支撑
        - from: financing
          to: valuation
          label: 稀释
    claimRefs:
      - CR015
      - CR018
      - CR031
      - CR034
      - CR037
      - CR039
      - CR047
      - CR049
      - CR050
  - id: FR003
    title: 依赖图
    type: dag
    summary: Mind Robotics 位于一张密集依赖网中央：Rivian 目前是最关键节点，但标准、人才、资本和客户工程也决定部署能多快转化为多元化收入。
    data:
      nodes:
        - id: mind
          label: Mind Robotics
          detail: Mind Robotics 是全栈工业机器人初创公司，构建模型、硬件和部署基础设施。
        - id: rivian
          label: Rivian
          detail: 合作伙伴、股东、数据来源，也是当前公开首发环境。
        - id: capital
          label: 资本提供方
          detail: 在可重复性得到证明前，为硬件扩产和现场扩张提供资金。
        - id: integrators
          label: 集成商 / 工厂工程师
          detail: 把机器人能力转化为安全的生产部署。
        - id: standards
          label: 标准机构 / 监管方
          detail: 为工业部署设定安全、验证和责任基线。
        - id: talent
          label: 部署人才
          detail: 需要他们把 OT、AI、安全和客户运营集成起来。
        - id: customers
          label: 外部客户
          detail: 需要外部客户证明业务可以泛化到 Rivian 之外。
        - id: compute
          label: 算力 / 硬件栈
          detail: 可能包含与合作伙伴关联的处理器，或稀缺机器人组件。
      edges:
        - from: rivian
          to: mind
          label: 锚定
        - from: capital
          to: mind
          label: 出资
        - from: integrators
          to: mind
          label: 支撑
        - from: standards
          to: mind
          label: 约束
        - from: talent
          to: mind
          label: 扩大
        - from: customers
          to: mind
          label: 验证
        - from: compute
          to: mind
          label: 支持
        - from: rivian
          to: compute
          label: 可能影响
    claimRefs:
      - CR001
      - CR004
      - CR008
      - CR009
      - CR015
      - CR047
      - CR048
      - CR049
      - CR050
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从战略市场和资本优势，到证明缺口，再到继续研究决定的链条。
    data:
      nodes:
        - id: market
          label: 工业需求
          type: input
          detail: IFR 称 2026 年工业机器人安装价值达到 $16.7B
        - id: access
          label: 战略入口
          type: process
          detail: Rivian 合作伙伴或股东身份，加上 >$1B 融资，让 Mind 拥有少见的平台建设资源
        - id: comps
          label: 私募可比公司区间
          type: process
          detail: Figure、Apptronik、Skild 和 Agility 展示出一组活跃但要求很高的物理 AI 定价参照
        - id: gap
          label: 证明缺口
          type: process
          detail: 公开收入、客户数、部署 ROI、利润率或清算优先权披露均缺失
        - id: price
          label: 当前价格
          type: process
          detail: Reuters 或 Yahoo 将最新一轮估值定在 $3.4B，高于 3 月的 $2.0B 参照
        - id: decision
          label: 建议
          type: output
          detail: 继续研究；在外部证明和经济性公开前，估值仍偏高
      edges:
        - from: market
          to: access
          label: 支撑
        - from: access
          to: comps
          label: 支撑溢价叙事
        - from: comps
          to: price
          label: 框定
        - from: gap
          to: price
          label: 削弱信心
        - from: access
          to: decision
          label: 保留上行空间
        - from: gap
          to: decision
          label: 推动谨慎
        - from: price
          to: decision
          label: 确定当前立场
    approximationNotes: 该图把本章的 IC 逻辑压缩成一个方向性流程，而不是确定性模型。每个节点都概括多条被引用的主张。
    claimRefs:
      - CV004
      - CV007
      - CV022
      - CV034
      - CV039
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 商业化证明从仅 Rivian 叙事，推进到更广泛外部部署和经济性披露时，对应的示意性价值结果。
    data:
      items:
        - label: 仅 Rivian 叙事 / 无外部证明
          value: 1.4
          detail: 粗略悲观中枢结果，单位 $B
        - label: 不透明但资金充足的延续情景
          value: 2.6
          detail: 可辩护基准区间低端，单位 $B
        - label: 当前公开轮次参照
          value: 3.4
          detail: Reuters 或 Yahoo 报道的最新轮估值，单位 $B
        - label: 外部标识与 KPI 披露
          value: 4.2
          detail: 泛化开始被验证时，对应中等偏乐观结果
        - label: 外部标识与经济性披露
          value: 5
          detail: 溢价情景，接近当前 Apptronik 式 2026 年可比估值区间
    approximationNotes: 这些数值不是收入倍数测算结果，而是以里程碑为锚的情景估值，单位为十亿美元。柱形显示，当前估值要站得住，还差多少证据。
    claimRefs:
      - CV004
      - CV013
      - CV015
      - CV035
      - CV040
      - CV041
      - CV042
      - CV043
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 悲观、基准、乐观和当前价格参考情景下的低 / 基准 / 高估值区间，单位均为十亿美元。
    data:
      items:
        - label: 悲观情景
          low: 1
          base: 1.4
          high: 1.8
          unit: $B
          note: 战略资产底价；外部验证弱，股权结构表不透明
        - label: 基准情景
          low: 2.2
          base: 2.6
          high: 3
          unit: $B
          note: Rivian 牵引力延续，但外部客户与经济性披露仍有限
        - label: 乐观情景
          low: 3.8
          base: 4.4
          high: 5.2
          unit: $B
          note: 外部标识、部署 KPI 和更充分的经济性披露撑起溢价定价
        - label: 当前轮融资参考
          low: 3.3
          base: 3.4
          high: 3.5
          unit: $B
          note: 2026 年 5 月后续融资轮释放的公开估值信号
    approximationNotes: 这些区间体现的是概率加权的情景判断和公开披露的私募轮可比数据，不是贴现现金流，也不是公开市场倍数测算。
    claimRefs:
      - CV004
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 投委会风格的速览，用 1-5 分制呈现 Mind 当前估值画像，分数越高越好。
    data:
      items:
        - label: 市场顺风
          value: 5
          detail: IFR 的 $16.7B 工业机器人装机大盘真实存在，对公司有支撑
        - label: 战略入口
          value: 5
          detail: Rivian 合作关系叠加异常快的融资到位速度，带来少见的起步环境
        - label: 外部验证
          value: 2
          detail: 公开证据仍缺少具名非 Rivian 客户，也缺少部署 KPI 披露
        - label: 披露质量
          value: 1
          detail: 收入、利润率、客户数和优先股条款仍未披露
        - label: 可比定位
          value: 3
          detail: 价格落在实体 AI 可比区间内，但低于 2026 年最极端的离群值
        - label: 下行保护
          value: 1
          detail: 没有股权结构表细节，仅靠公开证据无法框住普通股下行空间
        - label: 当前估值吸引力
          value: 2
          detail: 当前 $3.4B 参考估值已计入部分乐观情景
    approximationNotes: 分数是基于已引用证据作出的分析师判断，用于投委会初筛，不是独立评分模型。
    claimRefs:
      - CV022
      - CV032
      - CV035
      - CV043
      - CV045
      - CV046
