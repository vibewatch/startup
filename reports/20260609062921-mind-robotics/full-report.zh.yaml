  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争边界与什么才算真实替代方案
        blocks:
          - type: paragraph
            body: >-
              不应只用一组同行给 Mind Robotics 做基准。工厂买方若想自动化多变、高灵巧度制造工作，首先面对的真实替代方案，是已经能交付可用工作单元并提供已知支持条款的既有机器人
              OEM、协作机器人厂商、集成商和内部自动化团队。因此，ABB、FANUC、KUKA、Yaskawa、Universal Robots 和 Standard Bots
              都重要，因为它们已经向工厂销售硬件、软件、服务和面向具体工作流的自动化。它们公开谈论通用智能的野心不如 Mind，但会直接竞争近期资本开支和产能预算。


              第二层竞争来自具身 AI 和人形机器人阵营。Agility、Sanctuary 和 Figure 重要，并不是因为它们当前能匹配 ABB 或 FANUC
              的装机基础，而是因为它们塑造投资者、客户和人才如何理解自适应制造自动化。第三层包括 Intrinsic、Skild AI 和 Physical Intelligence
              等软件或智能栈公司。这些公司未来可能成为合作伙伴、供应商或间接替代品，而不是交钥匙式工作单元竞争者。实际结论是，Mind 今天最直接地与既有厂商和协作机器人厂商争夺预算，同时与人形和物理 AI
              初创公司争夺未来叙事所有权和通用机器人栈的技术控制。
