      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导层披露很薄，也高度集中。RJ Scaringe 是 Mind Robotics 的创始人、董事长和无可错认的公开面孔：官方材料称公司由这位 Rivian CEO「创立并领导」，TechCrunch
              则明确称他为董事长。公开材料中持续可见的另一位具名治理人物，只有 Accel 合伙人 Sameer Gandhi；他的董事会席位随 2026 年 3 月 Series A
              一起宣布。除这两人外，本次审阅的公开来源没有识别出独立的 Mind Robotics CEO、CFO、COO、CTO，或任何独立董事名单。


              这个薄班底重要，是因为 Mind 的运营模式与 Rivian 紧密交织。官方表述称 Rivian
              既是合作伙伴，也是主要股东或股东；独立报道强调，同一关系提供训练数据、启动场地和创始人连续性。这形成典型的关键人和治理集中：Scaringe 同时是战略赞助者、创始人兼董事长，也是 Mind
              剥离来源那家上市公司合作伙伴的 CEO。本次审阅的公开来源没有披露管理层继任计划、更广的董事会构成或少数股东保护条款。同样，本次材料包中没有出现 Mind 自身的重大高管离职；外部最清楚可见的领导层变化，是
              2026 年 3 月董事会扩容，加入 Sameer Gandhi。
