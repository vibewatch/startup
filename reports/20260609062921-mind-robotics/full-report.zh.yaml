      - number: '7.4'
        title: 最大未解风险是结构性的，公开证据在关键处仍很薄
        blocks:
          - type: paragraph
            body: >-
              Mind 目前有些风险是暂时的。强资本支持降低短期融资风险，强势锚定伙伴能加速招聘、测试和早期部署。如果管理层很快披露外部客户、经验证的 uptime
              和可重复部署经济性，投资者可以合理下调部分早期不确定性。但最大的风险看起来并不短期。客户集中度、符合标准的部署、产品责任暴露和多地点可重复性都嵌在公司的核心运营闭环里。钱来得更多也不会让这些问题消失。


              最清楚的公开证据缺口，也正是投资者在承销规模化前最需要补上的缺口。已审阅来源没有披露非 Rivian 生产客户、已安装机器人基数、uptime
              或故障指标、安全审计历史、保修或保险结构、组件集中度。公开报道还留下两个问题：Mind 的经济模型和数据飞轮有多少依赖
              Rivian，以及公司能否在不透支管理带宽的情况下支撑部署复杂度。这些缺口定义了尽调议程。只有 Mind 拿出外部生产客户 logo、经得起审视的现场指标和第三方安全证据，投资逻辑才会显著增强。如果 Rivian
              仍是唯一真实验证点，如果部署继续指引多、指标少，或者安全、法律、集成负担比机器人创造价值更快吃掉利润，投资逻辑就会破裂。
