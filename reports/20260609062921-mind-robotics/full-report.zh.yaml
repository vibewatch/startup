      - number: '2.4'
        title: 增长驱动、安全负担，以及市场是否仍然开放
        blocks:
          - type: paragraph
            body: >-
              最强顺风是劳动力经济性，但不是那种「工厂用机器人替代所有人」的简单叙事。BLS 显示，2024 年制造业仍雇用超过 12.8 million 人，并预计到 2034 年，每年生产类岗位空缺接近 1 million
              个，主要来自替换需求。WEF 补充称，79% 的制造业领导者仍把熟练劳动力短缺列为最大挑战；NIST 则把机器人需求直接连接到劳动力短缺、退休潮以及对自适应系统的需要。这组因素对 Mind
              重要，因为自适应机器人不仅能以劳动力替代来销售，也能作为产能防守、质量稳定和难招人环境里的工作场所重构来销售。


              主要约束在于，安全、验证和集成的移动速度，和能力提升的速度一样关键但慢得多。OSHA 指引、NIST 的测量科学议程，以及 2026 年 ANSI/A3
              标准发布都指向同一方向：机器人能演示一个任务，不等于可以部署。它必须通过风险评估，能在人身边安全工作，接入现有单元，并在真实生产条件下撑住。因此，这个市场既拥挤又开放。既有厂商已经很好解决固定任务的地方，市场很拥挤。买方需要自适应灵巧度、更快重新部署和通用操作能力，同时又不能牺牲安全或正常运行时间的地方，市场仍开放。对估值而言，这意味着
              Mind 的上行空间真实存在，但前提是它能把技术新意转化为经过验证的生产行为。
