      - number: '2.2'
        title: 规模测算视角：市场很大，但边界定义比炒作更重要
        blocks:
          - type: paragraph
            body: >-
              公开市场数据支持一个大机会，但没有一个干净的单一数字。IFR 的 2026 年官方观点把工业机器人安装市场价值定为 US$16.7 billion，并显示工厂需求仍高于每年 50 万台，全球在役工业机器人为
              4.664 million 台。这是已安装工业机器人最干净的窄口径。分析机构给出更宽框架：MarketsandMarkets 将 2026 年工业机器人市场定为 US$15.5 billion，CAGR 为
              5.0%；Future Market Insights 则把该类别拉到 US$65.1 billion，并给出到 2036 年 18.1% CAGR。StartUs 口径更宽，把工业自动化栈描述为
              US$221.64 billion。


              正确结论不是某个来源对、其他来源错。结论是：类别边界会大幅改写估值故事。对 Mind 来说，可支撑的 TAM 口径是狭义的 US$15.5-16.7 billion 已安装工业机器人范围。可支撑的 SAM
              还要更窄：与多变工厂任务相关的支出子集，这些任务需要自适应、协作和快速重新部署。精确 SOM 无法由公开信息支撑，因为 Mind 没有披露已定价部署、工作单元数量、机器人数量或非 Rivian
              客户牵引。这些缺失的公司指标应保留为尽调缺口，而不是被猜掉。
