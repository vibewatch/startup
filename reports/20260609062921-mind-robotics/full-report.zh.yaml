      - - 人形机器人 BOM 代理指标
        - 每台 $30k-$150k；执行器占 BOM 的 40-60%
        - 中
        - 硬件成本下限影响毛利率和现金需求
        - 要求提供 Mind BOM、供应商集中度和降本曲线
      - - 电池 / 班次经济性代理指标
        - 当前单次充电约 2 小时，到 2030 年约 6 小时
        - 中
        - 续航限制直接影响排班和在线率经济性
        - 要求提供实际班次设计、充电模式和生产率影响
      - - 集成 / 再工程负担
