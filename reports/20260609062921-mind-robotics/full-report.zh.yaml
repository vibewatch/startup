  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: Rivian 集中度是核心商业风险
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics 最重要的风险不是缺资本，而是公司的公开验证闭环仍在多大程度上绑定 Rivian。Mind 官方材料称，Rivian
              提供来自活跃制造产线的生产级数据，担任初始伙伴，并给公司一个准备规模化部署的客户。独立报道更进一步，反复把 Rivian
              描述为运营伙伴和主要股东。这确实是优势，因为多数机器人创业公司无法同时拿到连续数据、真实产线准入和容错度高的首发现场。


              问题在于，这个优势也削弱了外部验证。本次审阅的公开证据仍围绕 Rivian，没有点名第二个生产客户。即使最强的乐观文章，最终描述的护城河也建立在一段特权工厂关系上。TechCrunch 和
              SiliconANGLE 都报道了管理层到 2026 年底在 Rivian 部署许多机器人的目标，Rivian 自己的新闻稿也确认，锚定环境是一家有实际规模运营的整车厂。但已审阅公开来源没有披露 Mind
              的订单、已部署机器人或训练数据有多少来自 Rivian。这意味着投资者可以承认准入、数据和资本支持，却不能据此承销可重复需求。如果 Rivian
              推迟项目、调整资本开支优先级，或最终只是一个异常有利、无法泛化的环境，公司表面最强的护城河会很快变成最大的单点故障。
