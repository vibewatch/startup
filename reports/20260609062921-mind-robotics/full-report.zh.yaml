  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 已验证公开估值路径，以及仍缺什么
        blocks:
          - type: paragraph
            body: >-
              公开估值路径在价格上异常清楚，在运营验证上异常薄。Mind Robotics 2026 年 3 月 Business Wire 新闻稿确认，在 2025 年底 $115 million 种子轮之后，公司完成
              $500 million Series A；TechCrunch 和 SiliconANGLE 将这轮融资与大约 $2 billion 估值相连。随后，Reuters 通过 Yahoo Finance
              报道，2026 年 5 月由 Kleiner Perkins 领投的 $400 million 融资把公司定价在 $3.4 billion，高于 3 月的 $2 billion，并把已披露资本推高到不到一年超过
              $1 billion。这意味着约 $1.4 billion 的估值抬升，约 70%，发生在大约两个月内。


              没有同步移动的是公开运营披露。已审阅的公司和媒体来源仍未披露收入、ARR、毛利率、客户数量、已部署机器人数量、uptime、回本周期或优先股堆叠条款。因此，公开故事是战略故事：Rivian
              是伙伴和主要股东，公司有一个可用于数据和部署的真实制造环境，主要投资人正在押注一个全栈工业机器人平台。这能支撑溢价叙事，但本身不能证明当前价格合理。用于估值时，3 月到 5
              月的抬升已经验证；承销这次抬升所需的业务基本面仍大多留在私下。
