chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics 自称「面向真实世界的物理 AI」，并称其在打造面向工业部署的智能机器人，起点是工厂地面。公司官网以及 2026 年 3 月、5
              月的融资公告中，产品叙事保持一致：一个全栈平台，由基础模型、专用机器人硬件和部署基础设施组成，服务高灵巧度、多变、需要推理的制造任务。因此，公开来源能看到的一句话商业模式，是把自适应机器人部署到真实制造环境里，销售企业级工业自动化，而不是做消费机器人或单一用途演示系统。


              身份事实相对清楚。官方公告称总部位于 California 州 Palo Alto，RJ Scaringe 于 2025 年创立公司，并描述了一个覆盖 AI、机器人和工业制造、快速扩张的团队。TechCrunch
              报道称，公司于 2025 年 11 月从 Rivian 剥离，这是关于剥离时间最具体的公开说法。California 登记镜像还给出一个法律实体信息点：Mind Robotics, Inc. 于 2026 年 4
              月 8 日在 California 申报，主要办公地址为 Palo Alto 的 455 Portage Ave，并称公司在 Delaware 成立。截至 2026 年 6
              月的运行日期，应把公司视为已完成种子轮、Series A，并另有一笔规模较大但未标注轮次的 5 月后续融资。
