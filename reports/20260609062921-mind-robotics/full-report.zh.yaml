      - number: '7.2'
        title: 安全与责任负担是吞吐约束，不是脚注
        blocks:
          - type: paragraph
            body: >-
              Mind 正在现场工业环境中自动化灵巧、可变、强推理的工作，这意味着安全负担不是产品市场契合后再补的可选文件。OSHA
              概览称，许多机器人事故发生在编程、维护、测试、设置和调整等非常规阶段。其技术手册进一步把工业机器人应用定义为需要正式风险评估、验证、审查和降风险措施的系统，协作运行尤其如此。同样关键的是，OSHA
              指出机器人应用通常会与输送线、工作台、工艺设备和其他机器集成，因此危险面并不局限在机械臂本身。


              标准体系也强化了这一点。NIST 称，安全的人机协作仍依赖数据集、基准工具、协议、指标和标准。A3 与 ISO 10218 对机器人制造商和系统集成商都提出义务，ISO/TS 15066
              还围绕工作环境和力限制交互增加了协作机器人要求。IFR 又加入了现代变量：AI 驱动的自主性、云连接和 IT/OT
              融合，会提高测试、监督、网络安全和责任分配的复杂度。与此同时，法律来源称，即便美国还没有专门的联邦机器人监管制度，AI 系统也可能招来设计缺陷、警示缺陷、严格责任和民事罚款风险。对 Mind
              而言，规模上限不只取决于模型质量，还取决于它能多快在客户工厂证明安全运行、可辩护警示、可审计治理和可投保部署实践。
