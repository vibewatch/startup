      - number: '3.3'
        title: 人形初创公司与物理 AI 实验室更多在方向上竞争，而非分发上竞争
        blocks:
          - type: paragraph
            body: >-
              在初创同行中，Agility 拥有本次审阅中最强的实际工业商业化证明。其官网称 Digit 是首个进入生产部署的人形机器人，Toyota Motor Manufacturing Canada
              公告称，一个成功试点已转化为商业 Robots-as-a-Service 协议。Sanctuary 也相关，因为它明确围绕工业级人形机器人和劳动力挑战来定位，与 Mind
              关于难招人、高变化工作场景的投资逻辑重叠。Figure 仍有战略重要性，但其 2026 年审阅到的官方表面，目前更强调家庭帮助和居家环境，而不是工厂部署。这并不会把 Figure
              排除为未来竞争者，但削弱了它当下是最干净直接制造同行的说法。


              Skild AI、Physical Intelligence 和 Intrinsic 的重要性来自另一个原因。它们的公开材料聚焦多形态机器人智能、机器人基础模型、VLA 研究和面向工业的 AI
              软件层。如果既有厂商或协作机器人厂商能够授权、合作或在现有硬件之上构建类似智能，这些能力最终可能挤压 Mind
              的软件差异化。但本次审阅的公开证据仍让它们今天看起来更像控制层相邻公司，而不是全栈工厂部署竞争者。换句话说，它们争的是机器人未来架构，不是工厂经理眼下的机器人单元采购订单。
