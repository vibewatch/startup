  - id: TV005
    title: 投资逻辑破坏与监控触发项表
    columns:
      - 触发项
      - 阈值
      - 重要性
      - 行动含义
    rows:
      - - 外部客户缺口持续存在
        - 到下一个融资窗口仍没有具名非 Rivian 生产客户，或实质性试点证明
        - 证实当前价值主要来自战略叙事，而非可复制需求
        - 将当前估值视为不稳，并下调信心
      - - 部署经济性不及预期
        - 没有公开 ROI、正常运行率或毛利率证据；或披露指标显示服务拖累沉重
        - 表明产品盈利性规模化比融资故事暗示的更难
        - 下调基准情景，并假设商业化更慢
      - - 出现降估值融资或平轮条款
        - 新资本定价不高于当前估值标记，或带有明显更优先的保护条款
        - 表明内部人信心没有转化为更广泛市场可清算价格
        - 将估值重新锚向悲观区间，并计入模型偏好压力
      - - Rivian 集中度仍是结构性主导因素
        - Rivian 看起来仍是唯一有意义的验证闭环或需求引擎
        - 产品未必能跨客户环境泛化，因此压住倍数
        - 对平台叙事保持更高怀疑度
    notes: 这些触发项面向投委会使用：锁定最小的新事实，一旦出现，就足以迫使本章基准情景作实质性改写。
    claimRefs:
      - CV008
      - CV024
      - CV039
      - CV040
      - CV041
      - CV044
      - CV046
      - CV047
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 外部客户
        - 非 Rivian 的具名客户、上线部署，以及试点是否转为付费项目
        - 外部客户是检验当前定价是否建立在可重复需求上的最清晰测试
        - 索取客户推荐、已签署部署摘要和扩张队列
      - - 部署 KPI
        - 已安装机器人数量、任务组合、正常运行时间、节省人工兑现情况和安全事件
        - 指标能把可信的规模化故事与高资本开支试点故事分开
        - 要求提供运营仪表盘、事件日志和第三方验证
      - - 经济性
        - 单个部署的毛利率、服务强度、CAC 或部署成本、回本周期
        - 缺少这些数据，估值仍由叙事驱动，下行空间没有边界
        - 要求管理层桥接已签收入、贡献毛利和烧钱速度
      - - 资本结构
        - 优先股条款、清算优先权、反稀释、偿付顺位，以及最新轮次特有的任何结构
        - 条款决定表观估值中有多少真正归属低顺位持有人
        - 审阅投资条款清单和股权结构表，并建立情景瀑布
      - - 现金跑道与融资时点
        - 烧钱速度、现金余额，以及下一轮融资所需里程碑
        - 融资节奏很快；下一个检查点会显示当前估值标记能否被更广泛市场接受
        - 索取董事会材料，覆盖经营计划、现金跑道和融资策略
      - - Rivian 之外的泛化
        - 模型和部署工作流能迁移到新客户环境的证据
        - 支付平台估值而非锚定客户估值，核心投资逻辑就在这里
        - 审阅新客户上线数据、适配时间和单站点工程投入
    notes: 每个尽调问题都直接连到能把本章估值立场从偏高推向合理或有吸引力的变量。
    claimRefs:
      - CV007
      - CV008
      - CV039
      - CV044
      - CV045
      - CV046
      - CV047
