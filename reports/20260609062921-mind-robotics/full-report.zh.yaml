      - number: '6.2'
        title: Rivian 证明了什么，又没有证明什么
        blocks:
          - type: paragraph
            body: >-
              Rivian 证明了一件重要的事，但只是一件具体的事。多个官方和独立来源把 Rivian 描述为 Mind Robotics
              的初始合作伙伴、主要股东，以及公司的生产规模训练与部署环境。TechCrunch、Assembly Magazine 和 Mind 自己的新闻稿都指向同一运营逻辑：Rivian
              贡献工厂数据、真实制造环境和一个验证机器人在真实产线上是否有用的场所。Rivian 自身披露强化了这一解读。2026 年 Q1，它在 Illinois 州 Normal 生产 10,236 辆并交付 10,365
              辆；其他 Rivian 材料描述了 4.3 million square-foot 工厂、1.1 million square-foot 扩建，以及计划 215,000 辆产能。Assembly Magazine
              还描述了一条智能互联的 R2 产线，带有先进机器人、AI 驱动扫描和放置，以及基于视觉的质量检查。


              这没有证明客户多元化。本次审阅的公开记录反复点名 Rivian，但没有公开点名另一个真实外部客户或非 Rivian
              付费试点。这意味着投资者可以承销一个要求很高的汽车环境内部的真实部署强度，但不能承销多账户客户基础。Rivian 是生产相关性的证据，还不是 Mind Robotics
              已在更广泛工业市场拥有可重复分发、参考客户能力或采购牵引的证据。
