        - Mind 实质上仍是 Rivian 优先的故事，未披露强外部客户证明，并在机器人市场降温、优先权不透明的背景下再次融资
        - $1.0B-$1.8B
        - 25%
        - 当前公开定价会显得过高
      - - 基准
        - Rivian 部署继续推进，资本仍可获得，但外部客户标识和经济性到下一个尽调窗口仍大多不公开
        - $2.2B-$3.0B
        - 50%
        - 好于失败，但仍支撑不了当前 $3.4B 参照
      - - 乐观
        - Mind 证明能力可泛化到 Rivian 之外，发布部署 KPI，并展示足够经济性和治理，支撑下一轮溢价融资
        - $3.8B-$5.2B
        - 25%
        - 当前定价可以成立，但前提是新证明尽快落地
    notes: 区间是分析师基于私募轮次对标、资本强度和商业化里程碑做出的估计，而不是来自收入倍数。概率拆分仅作示意，并非模型推导。
