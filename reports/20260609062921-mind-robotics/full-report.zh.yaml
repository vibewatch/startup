      - number: '1.3'
        title: 融资历史、投资者基础与公开规模指标
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics 的融资历史对一家私人机器人初创公司来说异常清晰，因为公司在 2026 年 3 月和 5 月都发布了正式融资公告。披露顺序是：2025 年末由 Eclipse 领投的 $115
              million 种子轮；2026 年 3 月 11 日宣布、由 Accel 和 Andreessen Horowitz 共同领投的 $500 million Series A；以及 2026 年 5 月 13
              日宣布、由 Kleiner Perkins 领投的进一步 $400 million 融资。仅合计这些已披露轮次，已知累计融资为 $1.015 billion。独立报道把 3 月轮次前后的估值放在大约 $2
              billion，5 月为 $3.4 billion；TechCrunch 则把后一个数字表述为高于 $3 billion。


              关键分析细节在于轮次标签。5 月公司公告把该事件称为「$400 million financing」，并在证券样板文字中提到「Series A-1 优先股」，但没有公开把该事件标为 Series B。因此，本章把
              5 月事件视为未标注的后续融资或 A-1 融资，而不臆造轮次名称。投资者基础已经很宽：5 月披露新增 Kleiner Perkins，以及 Meritech、Redpoint、SV
              Angel、Incharge、A-Star 和 Garuda，同时显示 Accel、Andreessen Horowitz、Eclipse、Prysm Capital、Bain Capital Ventures
              和 Greenoaks 继续支持；TechCrunch 另行补充 Volkswagen 和 Salesforce
              的企业风投部门。相比之下，核心运营指标仍未披露。本次审阅的公开来源无法支持收入、ARR、员工数或广泛客户数。唯一明确支持的地点是 Palo Alto，Robot Report 将 Rivian
              描述为开发中机器人的首个客户，凸显商业牵引，也凸显集中风险。
