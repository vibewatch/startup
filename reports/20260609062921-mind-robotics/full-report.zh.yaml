companyProfile:
  summary: >-
    Mind Robotics 是一家位于 Palo Alto 的工业机器人初创公司，2025 年 11 月从 Rivian 剥离，公开定位为面向高灵巧度制造作业的全栈「物理
    AI」平台。公司称其在打造基础模型、专用机器人硬件和部署基础设施，服务那些多变、需要推理、传统工业机器人难以处理的工厂任务。


    Mind Robotics 目前最强的公开差异化，是与 Rivian 的关系：Rivian 既是合作伙伴、主要股东，也是模型训练和部署的真实制造环境。这给了 Mind Robotics
    罕见的生产规模数据和真实工厂首发场景，但也把治理、客户证明和外部验证集中到单一交易对手身上。


    公开报道支持一个异常快速的融资节奏：2025 年末 $115M 种子轮、2026 年 3 月 $500M Series A，以及 2026 年 5 月 $400M 后续融资；Reuters 称该轮估值为
    $3.4B。仍未披露的是核心承销输入：非 Rivian 客户、已部署机器人数量、正常运行时间和 ROI、定价、利润率、烧钱速度，以及融资后优先权条款。
