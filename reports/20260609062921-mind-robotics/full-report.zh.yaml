            body: >-
              客户集中度是 Mind Robotics 公开客户章节的决定性风险。Rivian
              既是初始伙伴，也是大股东、数据来源和规模化部署场地。集中度在战略上很强，因为它加速模型训练，缩短到生产验证的时间；风险也同样明显，因为外部需求更难验证。公开资料没有披露收入、订单或已部署机器人中有多少来自
              Rivian，也没有披露 NRR、GRR、流失率或复购数据。因此，脱离 Rivian 关系后，投资者没有公开依据去独立判断客户耐久性。


              外部多元化还要面对真实行业摩擦。IFR 称，IT 与 OT 融合后，多用途机器人需求在上升，但可靠性、效率、安全、网络安全和责任治理仍是现实 AI 部署的门槛。本次研究纳入的一项反向自动化采用调查更直接：92%
              的美国制造商认为自动化必不可少，但只有 37% 表示已经实现显著或完全自动化；39% 提到缺少专业能力，32% 遇到预算超支，三分之一称系统未达到预期表现。Roland Berger
              补充说，即便软件驱动的自动化正在进入更小批量生产，卖给汽车公司依然很难。这些信号说明，Mind 从一个锚定客户走向多元客户群的路径，可能比单看 Rivian 验证所显示的强度要慢得多。
