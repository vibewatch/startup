          detail: 成本基底重在执行器；当前可类比的人形机器人距离成熟低成本规模化仍很远。
        - id: supply
          label: 供应商就绪度
          detail: 精密部件和专业供应商在放量时还不能无摩擦运转。
        - id: integration
          label: 集成与安全人力
          detail: 安装、再工程和能力缺口会在规模效益到来前吃掉现金。
        - id: runtime
          label: 软件杠杆
          detail: 如果技术栈成熟，可复用运行时和编排能压缩重复安装工作。
        - id: uptime
          label: 正常运行时间与续航限制
          detail: 监督需求和电池限制仍会塑造运营经济性。
        - id: payback
          label: 客户回本
          detail: 买方需要快速、可见的 ROI，才会扩大工厂预算。
      edges:
        - from: bom
