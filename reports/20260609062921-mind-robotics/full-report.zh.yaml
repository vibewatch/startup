      - number: '1.4'
        title: 里程碑、合作逻辑与反向背景
        blocks:
          - type: paragraph
            body: >-
              公开时间线很短，但已经有意义。2025 年末，RJ Scaringe 创立 Mind Robotics，并据称从 Rivian 内部一个名为 Project Synapse
              的项目中将其剥离。种子轮建立了初始资本基础，而 2026 年 3 月的 Series A 是公司的公开亮相时刻：它把这家初创公司推到市场视野中，为 Accel 正式确立投资者董事席位，并公开披露支撑投资逻辑的
              Rivian 数据与部署关系。2026 年 4 月的 California 申报建立了可见的法律运营足迹。随后 2026 年 5 月融资扩大了股权结构表，把已披露资本推高到 $1 billion
              以上，并显著抬升了报道估值。


              产品和规模里程碑仍更像叙事，而不是数字。官方材料反复描述全栈工业机器人平台和走向规模化部署的路线图，TechCrunch 和 Manufacturing Digital 则援引 Scaringe 的预期：到
              2026
              年底可能部署大量机器人。招聘和岗位网站证据显示，公司正在安全、远程操作、系统工程、执行器、中间件、分布式训练和招聘等方向积极招人，更像建设期，而不是成熟运营足迹。独立评论中的主要反向主题不是已披露诉讼或召回，而是集中度。Mind
              的护城河和风险是同一件事：依赖 Rivian 提供数据、首个客户入口和治理连接。公开股权结构表细节、外部客户多元化以及硬部署指标，仍是主要尽调缺口。
