      - number: '8.4'
        title: 在客户多元化和经济性公开之前，建议仍是继续研究
        blocks:
          - type: paragraph
            body: >-
              投资逻辑不难看见。作为工业机器人创业公司，Mind 有少见的战略优势：Rivian 准入、可信的一线 VC 支持、快速融资路径，以及 IFR
              称达到历史高位的大型工业自动化市场。如果公司能把这个特权环境转化为可重复的外部部署，当前定价日后可能显得早。反向逻辑同样清楚。公开证据描述的是融资故事，远多于商业化故事；McKinsey 和更广泛的 2026
              年市场评论都提醒，人形机器人和 physical-AI 试点在实现规模化经济可重复之前，就可能看起来很有吸引力。


              这个平衡导向继续研究建议、中等信心、高风险和偏高估值立场。仅靠公开证据，本章不支持把当前价格称为有吸引力。更有吸引力的入场点，要么来自更低的价格带，接近 $2.2 billion 至 $3.0 billion
              的基准情景；要么来自新验证，在当前估值处补上披露缺口。因此，尽调议程很窄但很关键：披露非 Rivian 客户群、已部署机器人数量、uptime 和 ROI、毛利率轮廓、烧钱速度 /
              现金跑道，以及优先股堆叠。如果这些数据点验证外部可重复性，建议可以很快上调。如果不能，当前估值容易被重置。
