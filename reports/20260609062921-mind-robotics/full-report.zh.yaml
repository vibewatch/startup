        - 暂停对规模化铺开的信心；在赋予工业级部署可信度前，先要求安全尽调。
      - - 集成负担压过 ROI
        - 停机、人工介入和产线影响的现场指标
        - 持续人工介入、停机失控，或集成后无法证明客户 KPI 改善
        - 假设部署经济性偏定制化，利润结构弱于融资故事暗示。
      - - 资本支撑增长，但没支撑经济性
        - 毛利率、服务负担和营运资本趋势
        - 在外部客户多元化之前，或服务负担稳定之前，需要反复融资
        - 将投资逻辑从有优势的规模化，切换为昂贵试验。
      - - 管理和招聘成为瓶颈
        - 领导层厚度和现场人员配置
        - 缺少可见的第二梯队负责人，或部署、安全和 OT 集成岗位长期空缺
        - 假设执行速度落后于技术野心，并下调铺开假设。
    notes: 这些触发项用于未来尽调更新中持续监控，刻意聚焦会改变投资结论的事件，而不是抽象担忧。
