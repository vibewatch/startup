      - number: '5.5'
        title: 差异化、护城河与未解技术缺口
        blocks:
          - type: paragraph
            body: >-
              公开来源中最清楚的真实护城河，不是专利机制或已发布基准，而是部署语境。Mind 似乎拥有对 Rivian
              活跃制造产线、生产规模数据以及愿意让公司在真实工厂迭代的首个伙伴的特权入口。第二个真实信号是招聘足迹的宽度：远程操作、执行器、触觉传感、系统集成、功能安全、多模态 / VLA
              建模、机器人中间件和大规模数据基础设施合在一起，暗示公司在打造一个紧耦合产品栈，而不只是给现成机械臂包一层外壳。


              更大的主张仍偏愿景。Mind 称其在打造一个可泛化到核心任务和制造领域的平台，但公开来源还没有显示任务级基准、Rivian
              之外的客户引用、自主等级披露、部署数量、正常运行时间、故障率、回本周期或第三方安全认证证据。公开材料也没有解释制造模式、关键硬件供应商，或远程操作是临时冷启动层，还是生产运营中的长期组成部分。相对于固定功能工业机器人，公司显然瞄准更高变化的工作；相对于人形优先叙事，外部叙事仍聚焦工业工作，而不是人的外形相似度。即便如此，形态、成熟度和证明仍是核心尽调障碍。
