  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 从客户工作流和部署层，一直到模型、数据和硬件子系统，梳理公开可见的 Mind Robotics 技术栈。该架构结合了官方明确表述，以及当前招聘信息释放的详细开发信号。
    data:
      layers:
        - label: 客户 / 工厂工作流层
          detail: 产品围绕工厂车间的真实工业部署来定位，先从 Rivian 生产线切入，处理需要灵巧性、适应性和物理推理的任务。
          items:
            - 真实制造单元 / 工厂车间
            - 人机协作环境
            - Rivian 首发落地环境
        - label: 部署与运营层
          detail: 官方发布明确提到部署基础设施，意味着安装、运行时运营、支持和现场反馈闭环都是产品的一部分。
          items:
            - 部署基础设施
            - 面向操作员的工具
            - 现场验证与验收测试
        - label: 运行时与控制层
          detail: 机器人软件岗位指向中间件、消息传递、任务调度、生命周期管理和低时延运行时系统，这些能力支撑机器人在生产中持续运转。
          items:
            - 运行时系统
            - DDS / Zenoh 式中间件
            - 任务调度与生命周期管理
        - label: 数据与模型层
          detail: 数据架构、遥操作和 ML 基础设施岗位显示出一条闭环：从人工示教和产线数据进入标注、训练、评估，再重新部署。
          items:
            - 遥操作控制台
            - 数据验证与标注流水线
            - 多模态 / VLA 模型训练
            - 数百块 GPU 上的分布式训练
        - label: 机器人硬件层
          detail: 硬件建设覆盖执行器、移动系统、末端执行器、触觉传感器，以及一体化安全和系统工程，但公开机器人形态仍未披露。
          items:
            - 关节与移动执行器
            - 末端执行器与夹爪接触面
            - 触觉指尖 / 掌面
            - 系统与安全集成
    approximationNotes: Mind 尚未发布完整技术架构图。这个技术栈综合官方产品表述和实时招聘证据，因此具体模块名称和边界仍有部分推断成分。
