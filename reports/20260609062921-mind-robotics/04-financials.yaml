  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Monthly or quarterly revenue, ARR, booked backlog, and customer-level revenue concentration.
    whyItMatters: Without revenue and concentration data, the chapter can describe commercialization pathways but cannot underwrite revenue quality or diversification.
    diligencePath: Request a twelve-month revenue bridge by customer, contracted backlog, and a cohort view separating Rivian from non-Rivian demand.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI021
    - QI023
    relatedTableRefs:
    - TI001
    - TI002
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Current unrestricted cash, trailing net burn, capex burn, and runway under base and scale-up cases.
    whyItMatters: More than $1 billion of disclosed capital does not reveal how much cash remains or how quickly industrial deployment is consuming it.
    diligencePath: Request board or investor materials with monthly burn, cash balance, hiring plan, and scenario runway through the next milestone round.
    relatedQuestionRefs:
    - QI021
    - QI024
    - QI025
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: customer-diversification
    missingEvidence: Named customers, signed deployments, or non-Rivian pilot and production references.
    whyItMatters: The public record centers on Rivian, so commercial concentration risk cannot be bounded without evidence of external demand.
    diligencePath: Request customer roster, paid pilot conversion data, and evidence of repeat deployments outside the Rivian environment.
    relatedQuestionRefs:
    - QI007
    - QI012
    - QI024
    relatedTableRefs:
    - TI001
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: Ownership by series, option pool size, liquidation preferences, and post-money share count after the May 2026 financing.
    whyItMatters: The valuation step-up is visible, but dilution, governance leverage, and downside protection remain opaque.
    diligencePath: Request the cap table, financing documents, board composition, and any investor rights letter tied to the March and May financings.
    relatedQuestionRefs:
    - QI002
    - QI003
    - QI022
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: obligations
    missingEvidence: Debt, leases, vendor financing, equipment commitments, and project-finance-style obligations tied to hardware deployment.
    whyItMatters: Industrial robotics programs can move cash needs off the income statement and into equipment, lease, or inventory commitments.
    diligencePath: Request debt schedules, lease commitments, purchase obligations, and any financing structures used for customer deployments or inventory.
    relatedQuestionRefs:
    - QI022
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: mind-unit-economics
    missingEvidence: Mind-specific robot bill of materials, deployment engineering hours, uptime, failure rates, and service costs.
    whyItMatters: Public robotics benchmarks describe sector capital intensity, but they do not reveal whether Mind sits at the efficient or expensive end of the curve.
    diligencePath: Request hardware BOM, install labor by site, warranty claims, service attach rate, and a first-to-repeat deployment cost-down curve.
    relatedQuestionRefs:
    - QI016
    - QI017
    - QI018
    - QI019
    - QI025
    relatedTableRefs:
    - TI003
