    nodes:
    - id: pain
      label: Factory pain point
      detail: Variable, dexterous manufacturing work where fixed automation underperforms.
    - id: pilot
      label: Pilot design
      detail: Scope a workflow and prove it in a live industrial environment.
    - id: hardware
      label: Hardware + deployment
      detail: Provide robots, commissioning, and safety-heavy installation work.
    - id: runtime
      label: Runtime + operator layer
      detail: Operate middleware, monitoring, and operator-facing tools around the cell.
    - id: data
      label: Data / teleoperation loop
      detail: Capture and improve data, teleoperation, and model performance over time.
    - id: expand
      label: Scaled rollout and support
      detail: Move from one workflow to more lines, sites, and service contracts if economics hold.
    edges:
