- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue / ARR
    - null
    - low
    - No verified revenue-quality or scale benchmark exists
    - Request monthly recurring and non-recurring revenue with backlog
  - - Gross margin
    - null
    - low
    - Hardware, integration, and software mix determine whether scale creates cash or consumes it
    - Request gross margin by hardware, services, and software layers
  - - Cash burn
    - null
    - low
    - Burn drives runway more directly than total capital raised
    - Request trailing 12-month net burn and capex burn
  - - Cash runway
    - null
    - low
    - Total capital raised does not reveal remaining runway
    - Request unrestricted cash and runway under base and scale-up cases
  - - Customer payback proxy
    - 1-3 years for newer flexible deployments; 5-7 years historically
    - medium
    - Buyer payback shapes sales velocity and pricing power
    - Request signed customer ROI cases and realized payback by deployment
  - - Recent automation benchmark
    - About 1.3 years on one cited recent deployment benchmark
    - medium
    - Shows where strong deployments can land when integration works
    - Request Mind’s own before-and-after labor and throughput benchmarks
  - - Humanoid BOM proxy
    - $30k-$150k per unit; actuators are 40-60% of BOM
    - medium
    - Hardware cost floor shapes gross margin and cash needs
    - Request Mind BOM, supplier concentration, and cost-down curve
  - - Battery / shift economics proxy
    - About 2 hours today and roughly 6 hours by 2030 on one charge
    - medium
    - Runtime limits directly affect staffing and uptime economics
    - Request actual shift design, charging model, and productivity impact
  - - Integration / reengineering burden
    - About 75% of traditional TCO, with up to 50% reduction possible in software-defined approaches
    - medium
    - Mind’s margin path depends on how much setup labor can be turned into reusable software
    - Request engineering hours per first, second, and nth deployment
  notes: Null means not publicly disclosed by Mind Robotics. Non-null rows are sector benchmarks and proxies rather than Mind-specific disclosed metrics.
