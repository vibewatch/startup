tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Likely unit
  - Current public status
  - Revenue-quality take
  - Diligence ask
  rows:
  - - Robot system / cell deployment
    - Sale or financed deployment of hardware plus commissioning
    - Cell, line, or robot deployment
    - Official materials discuss deployments but disclose no commercial terms
    - Likely lumpy and project-based at first
    - Request signed SOWs, ASPs, and hardware gross margin by deployment
  - - Integration and commissioning services
    - Engineering, safety validation, installation, and tuning
    - Site or line implementation
    - Strongly implied by hiring and industry analogs, but not separately monetized publicly
    - Labor-heavy and margin-dilutive until repetition improves
    - Request install labor hours, utilization, and contribution margin by deployment wave
  - - Runtime / orchestration software
    - Control stack, middleware, monitoring, and operator tools
    - Per site, per robot, or annual software license
    - Software exists in hiring materials but no SKU or pricing is public
    - Potential future margin lever if separable from hardware
    - Request software attach rate, renewal base, and stand-alone pricing
  - - Teleoperation and data services
    - Data capture, annotation, remote assist, and model-improvement workflows
    - Per seat, usage, or program fee
    - Teleoperation roles are visible, but monetization is undisclosed
    - Strategically important but commercially opaque
    - Request whether data and teleoperation are billed separately or embedded in pilots
  - - Service, spares, and uptime support
    - Monitoring, maintenance, updates, and replacement parts
    - Annual service contract or per-deployment support bundle
    - No public evidence of pricing or attach rates
    - Could become the recurring layer if deployments scale
    - Request warranty policy, spare-parts economics, and service gross margin
  notes: Rows distinguish supportable commercialization layers from disclosed financial results; “public status” is about evidence visibility, not whether the company ultimately intends to monetize the layer.
