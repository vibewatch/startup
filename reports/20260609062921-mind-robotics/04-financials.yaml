      to: pilot
      label: workflow selection
    - from: pilot
      to: hardware
      label: deployment contract
    - from: hardware
      to: runtime
      label: operational tooling
    - from: runtime
      to: data
      label: improvement loop
    - from: data
      to: expand
      label: repeatable economics
  approximationNotes: The bridge maps commercialization layers visible in the source pack. It does not imply that Mind has already disclosed paid revenue at each step.
