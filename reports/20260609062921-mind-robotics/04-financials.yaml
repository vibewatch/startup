- id: TI004
  title: Capital adequacy table
  columns:
  - Capital adequacy line
  - Public value / status
  - Support
  - Financial implication
  - Diligence ask
  rows:
  - - Seed capital
    - $115M in late 2025
    - Official March release and May reporting
    - Provides an unusually large pre-Series-A engineering buffer
    - Confirm close date, security type, and how much remained at March close
  - - Series A financing
    - $500M in March 2026
    - Official March release
    - Funds hiring, hardware, and deployment build-out at unusual scale for a private robotics startup
    - Request use-of-proceeds budget and hiring plan tied to this round
  - - May follow-on financing
    - $400M in May 2026
    - Official May release and Reuters
    - Extends cash capacity while preserving private-company opacity
    - Clarify whether this was extension capital, a bridge, or the next priced round
  - - Total disclosed capital
    - $1.015B reconstructed from public rounds
    - Derived from seed plus March plus May
    - Strong headline balance-sheet support, but not a runway answer
    - Request current unrestricted cash and funded commitments
  - - Valuation step-up
    - $2.0B in March to $3.4B in May
    - TechCrunch / Reuters
    - Higher price can reduce dilution per dollar but raises future performance expectations
    - Request post-money share count, option pool, and preference stack
  - - Investor breadth
    - March co-led by Accel and a16z; May led by Kleiner with six named new investors
    - Official financing materials
    - Deep syndicate can keep financing capacity open
    - Request ownership by investor and any governance changes
  - - Debt / project finance
    - Not publicly disclosed
    - Reviewed public pack
    - Hidden leverage or equipment commitments could compress effective runway
    - Request debt, leases, vendor finance, and equipment obligations
  - - Next-round trigger
    - Not publicly disclosed
    - Reviewed public pack
    - No public milestone map exists for the next financing need
    - Request board view on revenue, margin, uptime, and customer milestones for the next raise
  notes: This table focuses on adequacy and dependency, not a full chronology. “Not publicly disclosed” is treated as a substantive financial gap rather than a zero value.
