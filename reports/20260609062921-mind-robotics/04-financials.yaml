- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Public status
  - Exact diligence path
  rows:
  - - Revenue and ARR
    - Needed to test whether valuation is backed by operating traction
    - Not publicly disclosed
    - Request monthly revenue, ARR, and backlog by customer and product line
  - - Gross margin by layer
    - Needed to see whether software can offset hardware and integration drag
    - Not publicly disclosed
    - Request gross margin split across hardware, services, and software
  - - Cash burn and cash balance
    - Needed to translate capital raised into actual runway
    - Not publicly disclosed
    - Request trailing 12-month burn and current unrestricted cash
  - - Runway and next-round trigger
    - Needed to assess financing dependency
    - Not publicly disclosed
    - Request board scenarios showing runway by hiring and deployment case
  - - Customer count and non-Rivian mix
    - Needed to bound concentration risk and repeatability
    - Not publicly disclosed
    - Request paid pilots, production deployments, and revenue share outside Rivian
  - - Realized pricing and discounting
    - Needed to underwrite revenue quality and sales efficiency
    - Not publicly disclosed
    - Request ASPs, contract lengths, discount schedules, and renewal or support terms
  - - Cap table ownership and preferences
    - Needed to assess dilution and investor downside protection
    - Not publicly disclosed
    - Request post-May cap table, security terms, and board rights
  - - Debt, leases, and equipment commitments
    - Needed to capture non-equity funding dependence and hidden cash obligations
    - Not publicly disclosed
    - Request debt schedules, leases, purchase obligations, and vendor-finance terms
  notes: These are not minor omissions. Each gap blocks a specific underwriting test that public rounds and valuation headlines cannot replace.
