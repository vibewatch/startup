- id: capital-deployment-intensity
  title: 'Where the Capital Likely Goes: Deployment, Integration, and Hardware Cost Intensity'
  body: "Mind’s official and hiring surfaces make the use-of-proceeds story clearer than the revenue story. The company repeatedly describes a full-stack program that combines models, robots, deployment infrastructure, and a live factory partner. Current job openings span actuation, systems, safety, teleoperation, ML infrastructure, runtime software, and operations, with postings centered on on-site work in Palo Alto. That mix implies that capital is being deployed across hardware design, manufacturing-adjacent engineering, deployment tooling, and field operations rather than only into frontier AI research.\n\nIndependent robotics sources show why that matters financially. McKinsey’s operations work says many executives still struggle to prove robotics business value, lack internal capability, and historically accepted five- to seven-year paybacks before newer flexible systems compressed the target toward one to three years. BCG argues that the cost problem sits heavily in setup and reengineering,\
    \ while Bain and McKinsey both show that advanced robots remain constrained by supervision needs, component bottlenecks, and limited runtime. McKinsey’s humanoid supply-chain analysis is especially useful as a cost-intensity analog: actuators dominate bill of materials, total unit cost still ranges widely, and suppliers for several precision components are not yet ready for smooth high-volume scaling. For Mind, that means the capital stack likely buys engineering time, supplier learning, and deployment iteration more than near-term free cash flow."
