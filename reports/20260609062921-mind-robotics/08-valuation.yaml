company:
  name: Mind Robotics
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public reporting supports a sharp valuation step-up for Mind Robotics from about $2.0B around the
    March 2026 Series A to $3.4B in the May 2026 follow-on round, with disclosed funding now above
    $1.0B in less than a year. That pricing is understandable inside the hot physical-AI cohort, but
    current public evidence still lacks revenue, margin, customer-count, deployment-ROI, and cap-table
    detail. The most defensible view is research-more with medium confidence, high risk, and a
    stretched valuation stance: the company may earn the price, but public proof has not yet caught up
    with it.
sections:
  - id: verified-valuation-path
    title: Verified public valuation path and what is still missing
    body: |-
      The public valuation path is unusually clear on price and unusually thin on operating proof. Mind Robotics’ March 2026 Business Wire release confirmed a $500 million Series A after a $115 million late-2025 seed, while TechCrunch and SiliconANGLE tied the round to a roughly $2 billion valuation. Reuters, via Yahoo Finance, then reported that the May 2026 $400 million Kleiner Perkins-led round priced the company at $3.4 billion, up from $2 billion in March and lifting disclosed capital to more than $1 billion in less than a year. That implies a roughly $1.4 billion step-up, or about 70%, in roughly two months.

      What did not move in parallel is public operating disclosure. The reviewed company and media sources still do not disclose revenue, ARR, gross margin, customer count, deployed robot count, uptime, payback period, or preferred-stack terms. The public story is therefore a strategic one: Rivian is a partner and major shareholder, the company has a live manufacturing environment for data and deployment, and major investors are funding a full-stack industrial robotics platform. That can justify a premium narrative, but it does not by itself prove that the current price is fair. For valuation purposes, the March-to-May move is verified; the business fundamentals needed to underwrite that move remain mostly private.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
