  - id: comparable-set-and-usable-frameworks
    title: The right comparable set is private physical AI, with public incumbents only as boundary markers
    body: |-
      Mind should not be valued like a normal SaaS company because public sources do not disclose the revenue base needed for a revenue-multiple approach. It also should not be valued directly off public industrial-automation incumbents because those companies disclose audited revenue, margins, and governance that Mind does not. The closest primary comp set is the current private physical-AI and humanoid cohort: Figure at $2.6 billion in 2024 with BMW and OpenAI support; Apptronik at roughly $5.0 billion to $5.3 billion in 2026 after taking total capital near $1 billion; Skild at more than $14 billion in 2026 with an explicit omni-bodied software story and company-claimed early revenue; and Agility with public commercial proof through Toyota and other named customers even though valuation remains undisclosed.

      Lower-bound context comes from narrower automation plays such as Collaborative Robotics and Standard Bots, which raised $100 million and $63 million respectively. Those businesses look more like product-category companies than full-stack platform bets. Public companies such as Symbotic, Rockwell, ABB, and Teradyne are still useful, but mainly as maturity boundaries: they disclose investor relations surfaces, annual reporting, and in Teradyne’s case billions of annual revenue. The usable framework for Mind is therefore scenario-based private-round benchmarking plus proof milestones, not a false-precision port of listed-company multiples. In practical terms, investors are paying for strategic optionality, capital depth, and expected external commercialization rather than disclosed unit economics.
