  - id: scenario-logic-and-valuation-stance
    title: Bull, base, and bear logic point to a stretched current price unless proof improves
    body: |-
      With revenue and customer economics undisclosed, the cleanest way to value Mind is to work backward from what the next proof points would have to show. The bear case is a strategic-asset reset: if Mind remains effectively a Rivian-centered story, discloses no external customer proof, and has to raise again into a cooler robotics tape, fair value compresses toward roughly $1.0 billion to $1.8 billion. That range still assumes the company retains real technical assets, investor support, and a privileged manufacturing data environment; it is not a zero. The base case is more forgiving: Rivian deployments continue, capital remains available, but public disclosure still lacks outside logos and unit economics. That supports roughly $2.2 billion to $3.0 billion.

      The bull case needs more than capital formation. It requires evidence that the Rivian launch environment generalizes: named external customers, deployment KPIs, and some public signal on economics or repeatability. Under that path, roughly $3.8 billion to $5.2 billion is supportable, which means the current $3.4 billion mark already leans into part of the bull narrative. On disclosed valuation-to-capital ratios, Mind is not the frothiest company in the field; it screens around 3.35x disclosed capital, below Skild’s rough ratio and near or slightly below Figure’s 3.85x. But its proof-to-price ratio is weaker than peers that already disclose customer, partner, or revenue signals. That is why the current price reads as stretched rather than absurd.
    claimRefs:
      - CV035
      - CV036
      - CV038
      - CV039
