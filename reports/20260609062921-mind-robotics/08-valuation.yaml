  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue and unit economics
      missingEvidence: >-
        Mind Robotics has not publicly disclosed revenue, ARR, gross margin, deployment cost, or payback data.
      whyItMatters: >-
        Without economics, the current valuation cannot be tested against a repeatable business model and the
        chapter must rely on scenario logic instead of a durable operating-value anchor.
      diligencePath: >-
        Request management financial summaries, cohort gross-margin views, deployment payback by site, and a
        bridge from bookings or pilots to recognized revenue.
      relatedQuestionRefs:
        - QV005
        - QV023
        - QV030
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: blocking
      topic: external customer and deployment proof
      missingEvidence: >-
        No public evidence names non-Rivian production customers or discloses deployed robot count, uptime,
        realized labor savings, or safety-event history.
      whyItMatters: >-
        These are the fastest ways to tell whether Mind's platform generalizes beyond a privileged anchor
        environment and whether the current valuation rests on repeatable demand.
      diligencePath: >-
        Obtain customer references, deployment scorecards, uptime dashboards, safety logs, and expansion data
        for at least one external account.
      relatedQuestionRefs:
        - QV024
        - QV028
        - QV030
      relatedTableRefs:
        - TV005
        - TV006
    - type: private-evidence-only
      severity: material
      topic: preference stack and dilution overhang
      missingEvidence: >-
        Public sources do not disclose preferred-share seniority, liquidation preferences, participation,
        anti-dilution, or other cap-table protections tied to recent rounds.
      whyItMatters: >-
        Headline valuation can overstate common-equity value materially if new rounds include strong downside
        protection or if a future reset reprices around senior claims.
      diligencePath: >-
        Review the cap table, term sheets, and a management-provided waterfall covering flat, down, and bull
        exit scenarios.
      relatedQuestionRefs:
        - QV027
        - QV023
        - QV030
      relatedTableRefs:
        - TV006
    - type: missing-source
      severity: material
      topic: generalization beyond Rivian
      missingEvidence: >-
        Public reporting does not show how much of Mind's data flywheel, bookings, or operational proof is
        specific to Rivian versus portable across new customer environments.
      whyItMatters: >-
        If the platform does not generalize cheaply and quickly, the company should trade closer to a
        single-anchor strategic asset than to a broad industrial robotics platform.
      diligencePath: >-
        Request new-customer onboarding metrics, engineering hours per deployment, adaptation time by task,
        and evidence from non-Rivian environments.
      relatedQuestionRefs:
        - QV024
        - QV029
      relatedTableRefs:
        - TV002
        - TV005
    - type: missing-source
      severity: material
      topic: comparable-set blind spots for TV003
      missingEvidence: >-
        Several potentially relevant robotics startups still do not disclose valuation, customer economics,
        or enough public funding detail to place them cleanly inside the comparable valuation table.
      whyItMatters: >-
        The comparable table is intentionally partial, so the reader needs to know that some omitted peers are
        absent because public evidence is incomplete rather than because they were judged irrelevant.
      diligencePath: >-
        Expand the comp set with private-market data-room access, investor updates, or direct company disclosure
        on valuation, commercialization stage, and funding terms.
      relatedQuestionRefs:
        - QV017
        - QV023
      relatedTableRefs:
        - TV003
    - type: missing-source
      severity: material
