    rows:
      - - Recommendation
        - research-more
        - Public evidence supports strategic promise, not yet a full underwriting case
        - Price is already high relative to disclosed proof
        - Do not advance to buy on current public file alone
      - - Confidence
        - Medium
        - Valuation path is verified, operating metrics are not
        - Core conclusion is solid but dependent on undisclosed fundamentals
        - Hold view lightly and update fast on new disclosures
      - - Risk rating
        - High
        - External-customer, economics, and preference data are still absent
        - Downside cannot be bounded precisely
        - Treat current mark as fragile to proof slippage
      - - Valuation stance
        - Stretched
        - $3.4B reflects forward expectations more than disclosed performance
        - Current price assumes some bull-case conditions
        - Require more proof or a lower entry price
      - - Primary valuation method
        - Scenario-based private-round benchmarking
        - Figure, Apptronik, Skild, and Agility, plus narrower automation peers, provide the relevant map
        - Revenue-multiple precision is unavailable without revenue
        - Use proof milestones, not point estimates, to size conviction
      - - Upgrade path
        - External deployments plus economics disclosure
        - Named non-Rivian logos, deployment KPIs, and margin or burn data
        - These are the key variables that could justify current or higher pricing
        - Move to track only after proof catches up with price
    notes: >-
      This summary intentionally avoids revenue multiples because Mind has not publicly disclosed the
      inputs required to anchor them. The decision is price-sensitive and evidence-sensitive.
