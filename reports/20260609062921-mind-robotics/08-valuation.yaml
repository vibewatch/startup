  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Market
        - Industrial robotics demand is large and IFR says installation value is at an all-time high
        - A hot market does not guarantee that one startup can commercialize profitably
        - Show external deployment growth in a market outside Rivian
      - - Strategic position
        - Rivian gives Mind a live manufacturing environment and a data flywheel few startups have
        - Heavy reliance on one anchor partner can mask weak generalizability
        - Publish proof that learning transfers to third-party sites
      - - Capital access
        - More than $1B raised in less than a year lowers near-term financing stress
        - Rapid financing can also hide the absence of customer-level proof
        - Disclose burn, runway, and cap-table seniority
      - - Competitive position
        - Mind is priced inside the same conversation as Figure, Apptronik, Skild, and Agility
        - Several peers disclose stronger commercial or revenue evidence than Mind does
        - Add customer logos, ROI, and uptime disclosure
      - - Public valuation support
        - Reuters/Yahoo verifies a $3.4B round, so price is not rumor-only
        - Price is still only lightly supported by operating metrics
        - Provide economics that make the current mark testable
      - - Exit path
        - A strategic buyer or later growth round is plausible if external proof emerges
        - Without that proof, a flat or down round becomes a real possibility
        - Show diversified demand and a more transparent preferred stack
    notes: >-
      The table ties the bull case and anti-thesis to specific diligence triggers rather than relying on
      abstract company-quality judgments.
