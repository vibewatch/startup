  - id: TV005
    title: Thesis-break and monitor triggers table
    columns:
      - Trigger
      - Threshold
      - Why it matters
      - Action implication
    rows:
      - - External-customer gap persists
        - No named non-Rivian production customer or material pilot proof by the next financing window
        - Confirms that current value is mostly strategic narrative rather than repeatable demand
        - Treat the present valuation as unstable and downgrade conviction
      - - Deployment economics disappoint
        - No public ROI, uptime, or margin evidence; or disclosed metrics imply heavy services drag
        - Suggests the product is harder to scale profitably than the funding story implies
        - Shift base case downward and assume slower commercialization
      - - Down-round or flat-round terms emerge
        - New capital prices at or below the current mark, or with visibly senior protective terms
        - Indicates that insider confidence is not translating into broad market clearing prices
        - Re-anchor valuation toward bear range and model preference overhang
      - - Rivian concentration remains structurally dominant
        - Rivian still appears to be the only meaningful proof loop or demand engine
        - Caps multiple because the product may not generalize across customer environments
        - Treat platform narrative with greater skepticism
    notes: >-
      The triggers are designed for IC use: they identify the smallest new facts that would force a
      substantive re-write of the chapter's base case.
    claimRefs:
      - CV008
      - CV024
      - CV039
      - CV040
      - CV041
      - CV044
      - CV046
      - CV047

  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - External customers
        - Named non-Rivian logos, live deployments, and whether pilots converted to paid programs
        - This is the single clearest test of whether current pricing rests on repeatable demand
        - Request customer references, signed deployment summaries, and expansion cohorts
      - - Deployment KPIs
        - Installed robot count, task mix, uptime, labor-savings realization, and safety incidents
        - These metrics distinguish a credible scale story from a high-capex pilot story
        - Ask for operating dashboards, incident logs, and third-party validation
      - - Economics
        - Gross margin by deployment, service intensity, CAC or deployment cost, and payback period
        - Without these, valuation remains narrative-driven and downside is unbounded
        - Request management bridge from booked revenue to contribution margin and cash burn
      - - Capital structure
        - Preferred terms, liquidation preferences, anti-dilution, seniority, and any structure specific to the latest rounds
        - Terms determine how much of the headline valuation actually accrues to junior holders
        - Review term sheets and capitalization table with scenario waterfalls
      - - Runway and fundraise timing
        - Burn rate, cash balance, and milestones required for the next round
        - Funding pace has been fast; the next checkpoint will reveal whether the current mark clears broadly
        - Request board materials on operating plan, runway, and financing strategy
      - - Generalization beyond Rivian
        - Evidence that models and deployment workflows transfer across new customer environments
        - This is the core thesis behind paying a platform valuation rather than an anchor-customer valuation
        - Review new-customer onboarding data, adaptation times, and engineering effort per site
    notes: >-
      Every diligence ask is directly connected to the variables that would move the chapter's valuation
      stance from stretched to fair or attractive.
    claimRefs:
      - CV007
      - CV008
      - CV039
      - CV044
