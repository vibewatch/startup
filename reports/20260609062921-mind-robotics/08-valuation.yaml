  - id: TV003
    title: Comparable valuation table
    columns:
      - Comparable
      - Latest disclosed valuation or funding signal
      - Public proof signal
      - Relevance to Mind
      - Limitation
    rows:
      - - Figure AI
        - $2.6B valuation on $675M round (2024)
        - BMW commercial agreement plus OpenAI collaboration
        - Closest early large-scale humanoid funding benchmark with named industrial proof
        - Valuation is older than Mind's 2026 rounds and may now understate current sentiment
      - - Apptronik
        - ~$5.0B-$5.3B valuation with $935M+ Series A capital (2026)
        - Mercedes-Benz, GXO, Jabil, and Google DeepMind cited publicly
        - Best 2026 comp for heavily financed industrial humanoid commercialization
        - Still partly reliant on company claims and selective public disclosure
      - - Skild AI
        - ">$14B valuation on $1.4B round (2026)"
        - Foundation-model story plus company-claimed early revenue
        - Upper-end software-platform comp for physical-AI enthusiasm
        - Business model is more software-centric and less factory-specific than Mind
      - - Agility Robotics
        - Valuation undisclosed; Toyota commercial agreement announced (2026)
        - Public deployment proof with Toyota, GXO, Schaeffler, and Amazon
        - Best proof-oriented comp for external customer validation
        - Missing public valuation prevents direct price anchoring
      - - Collaborative Robotics
        - $100M Series B; ~$140M total raised (2024)
        - Practical cobot commercialization focus
        - Lower-bound comp for narrower collaborative robotics scope
        - Company ambition and hardware complexity are smaller than Mind's
      - - Standard Bots
        - $63M funding round (2024)
        - AI-powered cobot arm category expansion
        - Another lower-bound comp for product-line robotics rather than platform-scale AI
        - Not a humanoid or full-stack industrial AI platform
      - - Boston Dynamics / Hyundai
        - ~$1.1B acquisition context (2021)
        - Strategic robotics asset inside a major industrial parent
        - Useful historical strategic-value reference for advanced robotics assets
        - Old transaction and different product mix reduce direct comparability
      - - Public automation incumbents
        - Public, revenue-disclosing boundary set rather than a direct pricing anchor
        - Symbotic, Rockwell, ABB, and Teradyne publish investor or filing surfaces
        - Helps show the maturity gap between Mind and listed automation leaders
        - Their trading multiples cannot be ported directly without Mind revenue data
    notes: >-
      This is a partial enumeration of the most decision-useful public comp signals, emphasizing disclosed
      valuations, funding size, and commercialization evidence rather than attempting a full robotics census.
