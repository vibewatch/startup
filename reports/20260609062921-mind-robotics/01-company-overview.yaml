company:
  name: Mind Robotics
chapter:
  number: 1
  title: Company Overview
  summary: Mind Robotics is a Palo Alto industrial robotics startup founded in 2025, spun out of Rivian in November 2025, and positioned as a full-stack “physical AI” platform for dexterous manufacturing work. Public disclosures support $1.015 billion of capital raised across a $115 million seed, a $500 million Series A, and an unlabeled $400 million May 2026 follow-on financing, with valuation stepping from about $2 billion in March to $3.4 billion in May per Reuters. Leadership and governance remain concentrated around founder-chairman RJ Scaringe and the Rivian relationship, while revenue, ARR, headcount, and broader customer disclosure remain absent from public sources.
sections:
- id: identity-stage
  title: Identity, Product, and Current Stage
  body: |-
    Mind Robotics describes itself as “Physical AI for the Real World” and says it is building intelligent robotics for industrial deployment, starting on the factory floor. Across the official homepage and March and May 2026 company financing releases, the company consistently frames its product as a full-stack platform of foundation models, purpose-built robotics hardware, and deployment infrastructure for dexterous, variable, and reasoning-intensive manufacturing tasks. The one-line business model visible in public sources is therefore enterprise industrial automation sold through deployment of adaptive robots into live manufacturing environments rather than through consumer robotics or single-purpose demo systems.

    Identity facts are comparatively clear. Official releases place headquarters in Palo Alto, California, say RJ Scaringe founded the company in 2025, and describe a rapidly growing team spanning AI, robotics, and industrial manufacturing. TechCrunch reported the company was spun out of Rivian in November 2025, which is the most specific public timing for the separation. A California registry mirror adds a legal-entity data point: Mind Robotics, Inc. filed in California on April 8, 2026, lists 455 Portage Ave in Palo Alto as its principal office, and says the corporation was formed in Delaware. As of the June 2026 run date, the company should be treated as post-seed, post-Series A, with an additional large but unlabeled May follow-on financing.
