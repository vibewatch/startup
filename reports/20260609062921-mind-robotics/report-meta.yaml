companyProfile:
  summary: |-
    Mind Robotics is a Palo Alto industrial robotics startup spun out of Rivian in November 2025 and publicly disclosed as a full-stack “physical AI” platform for dexterous manufacturing work. The company says it is building foundation models, purpose-built robotics hardware, and deployment infrastructure for variable, reasoning-intensive factory tasks that conventional industrial robots do not handle well.

    The company’s strongest public differentiator is its relationship with Rivian, which serves as a partner, major shareholder, and live manufacturing environment for model training and deployment. That gives Mind Robotics unusual access to production-scale data and a real factory launch site, but it also concentrates governance, customer proof, and external validation around one counterparty.

    Public reporting supports unusually rapid capital formation for a company this young: a $115M late-2025 seed, a $500M March 2026 Series A, and a $400M May 2026 follow-on round that Reuters said valued the company at $3.4B. What remains undisclosed are the core underwriting inputs: non-Rivian customers, deployed robot count, uptime and ROI, pricing, margins, burn, and post-round preference terms.
