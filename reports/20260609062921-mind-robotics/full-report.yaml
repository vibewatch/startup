  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Rivian concentration is the core commercial risk
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics’ most important risk is not lack of capital; it is the extent to which the company’s public
              proof loop is still fused to Rivian. Official Mind materials say Rivian provides production-scale data
              from active manufacturing lines, serves as the initial partner, and gives the company a customer ready to
              deploy at scale. Independent coverage goes further and repeatedly describes Rivian as both operating
              partner and major shareholder. That is a real advantage because most robotics startups never get
              continuous data, real line access, and a tolerant launch site all at once.


              The problem is that this advantage also weakens external proof. Public evidence reviewed for this run
              still centers on Rivian and does not name a second production customer. Even the strongest bullish
              articles ultimately describe a moat built on one privileged factory relationship. TechCrunch and
              SiliconANGLE both report management’s ambition to deploy many robots at Rivian by end-2026, and Rivian’s
              own release confirms the anchor environment is a live automaker operating at meaningful scale. But no
              reviewed public source discloses what share of Mind’s bookings, deployed robots, or training data comes
              from Rivian. That means investors can underwrite access, data, and capital support, but not repeatable
              demand. If Rivian delays programs, changes capex priorities, or simply proves to be an unusually favorable
              environment that does not generalize, the company’s strongest apparent moat quickly becomes its largest
              single point of failure.
            claimRefs:
