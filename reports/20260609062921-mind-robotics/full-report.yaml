      - number: '5.3'
        title: Workflow, Use Cases, and the Rivian Data Flywheel
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently ties Mind's product to live manufacturing workflows rather than to a
              laboratory robot demo. The official homepage says Rivian provides “production-scale data from active
              manufacturing lines,” and the May 2026 financing release says Rivian offers a live, high-volume
              manufacturing environment for model training and deployment. TechCrunch, AI2.work, and Manufacturing
              Digital all frame Rivian as the crucial difference versus many robotics startups: Mind is not starting
              with synthetic benchmarks alone; it is starting with access to real factory operations, a launch partner
              willing to deploy, and a feedback loop that should expose models to the variability, edge cases, and
              physical constraints of actual manufacturing.


              The practical use-case boundary is clear even if the task list is not. Official and independent sources
              say Mind is focused on dexterous, variable, reasoning-intensive manufacturing jobs that traditional
              automation cannot handle well, but they do not enumerate named cells, cycle times, or deployment counts.
              Rivian's own Q1 2026 production release gives context for the “production-scale” claim by reporting 10,236
              vehicles produced and 10,365 delivered in the quarter, demonstrating that the partner environment is not a
              pilot line. That helps validate the data-moat story, but it also concentrates it: the strongest
              evidence-backed advantage is Rivian access, and the largest unanswered go-to-market question is whether
              Mind can prove similar value outside that captive launch environment.
