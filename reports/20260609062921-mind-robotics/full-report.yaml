  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Boundary and What Counts as a Real Alternative
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics should not be benchmarked against only one peer set. For a plant buyer trying to automate
              variable, dexterous factory work, the first real alternatives are incumbent robot OEMs, cobot vendors,
              integrators, and internal automation teams that can already deliver a usable cell with known support
              terms. ABB, FANUC, KUKA, Yaskawa, Universal Robots, and Standard Bots therefore matter because they
              already sell hardware, software, service, and workflow-specific automation into factories. They are not as
              ambitious in public language about general intelligence as Mind, but they compete directly for near-term
              capex and throughput budgets.


              A second layer of competition is the embodied-AI and humanoid cohort. Agility, Sanctuary, and Figure are
              important not because they currently match the installed base of ABB or FANUC, but because they shape how
              investors, customers, and talent think about adaptive manufacturing automation. A third layer consists of
              software or intelligence-stack players such as Intrinsic, Skild AI, and Physical Intelligence. These
              companies may become partners, suppliers, or indirect substitutes rather than turnkey workcell
              competitors. The practical conclusion is that Mind competes most directly with incumbents and cobot
              vendors for today’s budgets, while competing with humanoid and physical-AI startups for future narrative
              ownership and technical control of the generalized robot stack.
