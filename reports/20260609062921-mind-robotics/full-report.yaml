  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Public Scope
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics' public product description is consistent at the thesis level but still thin at the SKU
              level. The official homepage says the company is building “intelligent robotics for industrial
              deployment,” starting on the factory floor, while the March and May 2026 official financing releases
              describe an industrial robotics platform made up of AI foundation models, hardware, and deployment
              infrastructure. Assembly Magazine and RoboticsTomorrow repeat the same framing: Mind is targeting
              dexterous, variable, and reasoning-intensive manufacturing work that conventional robots struggle to
              automate because the job is not perfectly repeatable or dimensionally stable.


              That framing matters because it defines what the product is not. Public messaging explicitly rejects
              “single-task machines,” and Manufacturing Digital cast the company as different from Tesla's humanoid
              narrative by focusing on factory AI and human-like skills for industrial work rather than a
              general-purpose consumer-style robot. Yet the reviewed source set still does not disclose a named robot
              SKU, robot geometry, payload, reach, cycle time, or workstation configuration. As of the 2026-06-09 run
              date, the most supportable product conclusion is that Mind has publicly sold a platform thesis and
              live-line deployment story, not a fully specified public robot datasheet.
