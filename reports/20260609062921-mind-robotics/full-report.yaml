      - number: '7.4'
        title: The biggest unresolved risks are structural, and the public evidence is still thin where it matters most
        blocks:
          - type: paragraph
            body: >-
              Some of Mind’s current risks are transient. Strong capital backing lowers near-term financing risk, and a
              powerful anchor partner can accelerate hiring, testing, and early deployment. If management soon discloses
              external customers, validated uptime, and repeatable deployment economics, investors could reasonably mark
              down some of today’s early-stage uncertainty. But the largest risks do not look transient. Customer
              concentration, standards-compliant deployment, product-liability exposure, and multi-site repeatability
              sit inside the company’s core operating loop. They do not disappear just because more money arrives.


              The clearest public-evidence gaps are also the ones investors most need to close before underwriting
              scale. Reviewed sources do not disclose non-Rivian production customers, the installed robot base, uptime
              or failure metrics, safety-audit history, warranty or insurance structure, or component concentration.
              Public coverage also leaves open how much of Mind’s economics and data flywheel depend on Rivian, and
              whether the company can support deployment complexity without overextending management bandwidth. Those
              gaps define the diligence agenda. The thesis strengthens materially only if Mind can show external
              production logos, field metrics that survive scrutiny, and third-party safety evidence. The thesis breaks
              if Rivian remains the only real proof point, if deployments stay guidance-heavy and metric-light, or if
              safety, legal, or integration burdens consume margin faster than the robots create value.
            claimRefs:
