      - number: '1.3'
        title: Funding History, Investor Base, and Public Scale Metrics
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics’ financing history is unusually clear for a private robotics startup because the company
              used formal financing announcements in both March and May 2026. The disclosed sequence is: a $115 million
              seed led by Eclipse in late 2025; a $500 million Series A announced on March 11, 2026 and co-led by Accel
              and Andreessen Horowitz; and a further $400 million financing announced on May 13, 2026 and led by Kleiner
              Perkins. Adding only those disclosed rounds produces $1.015 billion of total known capital raised.
              Independent reporting placed valuation at roughly $2 billion around the March round and $3.4 billion in
              May, while TechCrunch phrased the later figure as greater than $3 billion.


              The key analytical nuance is round labeling. The May company release called the event a “$400 million
              financing” and, in its securities boilerplate, referred to “Series A-1 Preferred Stock,” but did not
              publicly label the event a Series B. This chapter therefore treats the May event as an unlabeled follow-on
              or A-1 financing rather than inventing a round name. The investor base is now broad: May disclosures add
              Kleiner Perkins plus Meritech, Redpoint, SV Angel, Incharge, A-Star, and Garuda, while also showing
              continued support from Accel, Andreessen Horowitz, Eclipse, Prysm Capital, Bain Capital Ventures, and
              Greenoaks; TechCrunch separately adds venture arms of Volkswagen and Salesforce. By contrast, core
              operating metrics remain undisclosed. No reviewed public source supports revenue, ARR, headcount, or a
              broad customer count. The only clearly supported location is Palo Alto, and Robot Report describes Rivian
              as the first customer for robots in development, underscoring both commercial traction and concentration
              risk.
