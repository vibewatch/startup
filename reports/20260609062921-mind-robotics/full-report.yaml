      - number: '7.3'
        title: Factory integration and execution risk could slow adoption even if the robots work
        blocks:
          - type: paragraph
            body: >-
              The most skeptical external evidence does not say industrial robotics is a bad market; it says real
              factory adoption is slower, messier, and more failure-prone than glossy funding stories imply. Vention
              reports that 92% of surveyed manufacturers view automation as critical, yet only 37% have deployed it.
              Eclipse says only 17% fully achieved automation goals over the last three years and that limited
              structured data remains a major scaling bottleneck. Machine Design describes “last-mile failures” where
              apparently accurate AI never changes plant behavior because it is not wired into MES, HMIs, incentives,
              and standard operating procedures. Robotics & Automation News makes the same point more bluntly: factory
              automation remains an integration problem, a workforce problem, and a downtime problem.


              That is especially relevant for Mind because it is not selling a lightweight analytics feature. Its own
              and third-party materials describe a full-stack offer that spans models, hardware, and deployment
              infrastructure. Deloitte’s survey says manufacturers still struggle with change management, strategic
              risk, cybersecurity, and hiring across IT, OT, data, engineering, and AI. The MDPI review adds that
              implementation costs, legacy incompatibilities, interoperability gaps, cybersecurity, and
              workforce-displacement concerns remain unresolved barriers. Put differently, Mind must clear two hard bars
              simultaneously: proving that variable factory work can be automated safely and proving that customers can
              integrate the system without line disruption, shadow-process reversion, or expensive custom engineering on
              every site. That is why operational execution risk here is more serious than a generic startup learning
              curve.
