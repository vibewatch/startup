      - number: '6.4'
        title: Concentration risk and adoption blockers
        blocks:
          - type: paragraph
            body: >-
              Customer concentration is the defining risk in Mind Robotics’ public customer chapter. Rivian is
              simultaneously the initial partner, a major shareholder, a data source, and the scale deployment venue.
              That concentration is strategically powerful because it accelerates model training and reduces the time
              needed to reach production proof. It is also risky because it makes outside demand harder to validate.
              Public sources do not disclose how much revenue, bookings, or deployed-robot volume comes from Rivian, and
              they also do not disclose NRR, GRR, churn, or repeat-purchase data. As a result, there is no public basis
              for underwriting customer durability independently of the Rivian relationship.


              External diversification also faces real industry friction. IFR says versatile robotics demand is rising
              as IT and OT converge, but it also emphasizes reliability, efficiency, safety, cybersecurity, and
              liability governance as gating requirements for real-world AI deployment. The adverse automation-adoption
              survey reviewed for this run is even more direct: 92% of U.S. manufacturers say automation is essential,
              but only 37% report significant or full automation in place; 39% cite lack of expertise, 32% budget
              overruns, and one-third say systems fail to perform as intended. Roland Berger adds that selling to
              automotive companies remains tough even as software-driven automation broadens into smaller-batch
              production. Those signals suggest Mind’s path from one anchor account to a diversified customer base could
              be materially slower than the strength of the Rivian proof alone might imply.
