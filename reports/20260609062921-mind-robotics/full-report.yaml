  - id: TE002
    title: Workflow / use-case table
    targetSlug: workflow-use-case-table
    columns:
      - User job / workflow
      - Current workflow pain
      - Mind solution in scope
      - Likely benefit
      - Limitation / open question
    rows:
      - - Variable factory value-add tasks
        - Classical automation handles repeatable, dimensionally stable work better than variable work.
        - Mind targets dexterous, variable, reasoning-intensive manufacturing tasks.
        - Expands automation into jobs still reliant on human adaptation
        - Public sources do not name exact cell types or takt-time targets
      - - Human demonstration and data collection
        - Pure autonomy is hard to bootstrap without high-quality demonstrations and edge-case capture.
        - >-
          Teleoperation platform, VR, haptics, and ultra-low-latency streaming appear to support demonstration capture
          and evaluation.
        - Faster model iteration and policy grounding in real hardware behavior
        - Share of production work done under teleoperation versus autonomy is not public
      - - Live-line model training and validation
        - Lab data and simulation alone miss factory variability and deployment friction.
        - Rivian provides production-scale data and a live manufacturing environment for training and deployment.
        - Higher-quality real-world data flywheel and faster debugging
        - Concentration on a single launch environment may limit external validity
      - - Human-robot collaboration on factory floor
        - Many high-value manufacturing tasks still require human dexterity or safe co-working assumptions.
        - Mind publicly says it is building a safe collaborative robot platform designed to work alongside humans.
        - Potentially lower reconfiguration burden than fully isolated fixed cells
        - Public safety architecture and certification evidence are not disclosed
      - - Cross-domain manufacturing expansion
        - Task-specific robotics often do not transfer well across product lines or plants.
        - Mind claims its platform can generalize across core tasks and then across manufacturing domains.
        - Larger long-term TAM than a single fixed function or single plant tool
        - No public cross-domain deployment proof beyond the Rivian context
      - - Deployment infrastructure and field integration
        - Industrial AI often fails at commissioning, integration, and support rather than at the model demo stage.
        - Official releases explicitly include deployment infrastructure as part of the product.
        - Suggests Mind is trying to own installation and runtime operations, not only inference
        - No public installer model, integrator network, or uptime / support metrics
    notes: >-
      Use cases are stated in workflow terms because Mind has not published a public list of named robot SKUs or
      finished applications. Benefit estimates are qualitative and tied to the gaps in traditional factory automation
      described in official sources.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the recurring workflow themes found in official statements, press, and job postings; they do not
        represent a complete catalog of deployed customer applications.
