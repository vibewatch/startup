              tasks inside an automotive setting where line uptime, quality, safety, and integration matter immediately.


              The rest of the customer-base picture is still mostly inferred rather than disclosed. Public materials do
              not provide a customer count, pricing, ACV bands, or a clean geography/vertical mix. Still, the operating
              context makes the likely buyer set fairly clear: plant leadership, manufacturing engineering, automation
              or integration owners, and operations sponsors who can justify spend through launch speed, labor leverage,
              throughput, or quality gains. The most likely daily users are manufacturing engineers, integrators,
              operators, and safety or teleoperation staff. That supports an initial target segment of automotive and
              adjacent high-mix industrial manufacturers, while leaving actual market breadth unproven until non-Rivian
