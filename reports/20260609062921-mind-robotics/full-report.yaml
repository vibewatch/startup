  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Public maturity map for the major Mind Robotics capability areas, emphasizing where evidence is concrete versus
      where the story remains aspirational or underspecified.
    data:
      columns:
        - Public disclosure
        - Build maturity signal
        - External proof
        - Main unresolved gap
      rows:
        - label: Foundation-model / reasoning stack
          values:
            - Officially described
            - Strong hiring signal
            - Rivian-only context
            - No public benchmark suite or eval results
        - label: Teleoperation and data flywheel
          values:
            - Job-level detail visible
            - Strong hiring signal
            - Workflow logic is credible
            - Degree of production dependence is unclear
        - label: Hardware and manipulation stack
          values:
            - Broad but indirect disclosure
            - Strong hiring signal
            - No public robot SKU
            - Payload, reach, and cycle time absent
        - label: Safety and systems integration
          values:
            - Directional evidence visible
            - Hiring plus standards alignment
            - No public certification record
            - Conformance, incident, and validation data absent
        - label: Commercial deployment maturity
          values:
            - Official deployment intent visible
            - Early live-line signal
            - Rivian launch environment only
            - External customer count and uptime undisclosed
    claimRefs:
      - CE012
      - CE023
      - CE031
      - CE032
      - CE033
      - CE036
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence suggests Mind Robotics starts with an exacting anchor plant, builds a data flywheel there, and
      only then tries to generalize outward.
    data:
      nodes:
        - id: select
          label: Select an exacting plant
          detail: >-
            Start in a factory environment where variability, labor intensity, and launch pressure are high enough to
            justify AI robotics.
        - id: anchor
          label: Anchor at Rivian
          detail: Use Rivian as the initial partner, customer, shareholder, and training-data source.
        - id: capture
          label: Capture data and teleoperate
          detail: >-
            Build the data flywheel through real manufacturing-line data, teleoperation, and robotics operations
            workflows.
        - id: integrate
          label: Integrate into live cells
          detail: Connect robotics hardware, software, and deployment infrastructure with plant equipment and integrators.
        - id: prove
          label: Prove on live production
          detail: Demonstrate value in operating lines where throughput, quality, safety, and launch timing matter.
        - id: expand
          label: Expand or diversify
          detail: Use anchor-account proof to widen within the plant or try adjacent industrial manufacturers.
    claimRefs:
      - CU001
      - CU002
      - CU017
      - CU021
      - CU022
      - CU023
      - CU024
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    summary: >-
      Mind Robotics’ public motion looks like a high-touch industrial implementation funnel with clear failure points
      before broad rollout.
    data:
      nodes:
        - id: need
          label: Identify a painful factory task
          detail: Target dexterous or variable work that classical automation cannot handle well.
        - id: sponsor
          label: Win a plant sponsor
          detail: Secure manufacturing, operations, or automation leadership support inside the customer site.
        - id: data
          label: Gather site data
          detail: Collect production data and define teleoperation or training workflows for the target task.
        - id: integrate
          label: Integrate and validate
          detail: Connect robots with equipment, controls, and safety processes while proving performance.
        - id: live
          label: Run on a live line
          detail: Move from lab or validation mode into production operations.
        - id: scale
          label: Expand or stall
          detail: Expansion depends on credible ROI, implementation confidence, and plant readiness.
      edges:
        - from: need
          to: sponsor
          label: frames
        - from: sponsor
          to: data
          label: funds
        - from: data
          to: integrate
          label: enables
        - from: integrate
          to: live
          label: clears
        - from: live
          to: scale
          label: determines
    claimRefs:
