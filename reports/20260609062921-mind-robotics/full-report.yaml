      - number: '1.4'
        title: Milestones, Partnership Logic, and Adverse Context
        blocks:
          - type: paragraph
            body: >-
              The public chronology is short but already meaningful. In late 2025, RJ Scaringe founded Mind Robotics and
              spun it out of Rivian, reportedly from an internal effort known as Project Synapse. The seed round
              established initial capitalization, while the March 2026 Series A served as the company’s public breakout
              moment: it put the startup on the map, formalized an investor board seat for Accel, and publicly disclosed
              the Rivian data-and-deployment relationship that underpins the thesis. An April 2026 California filing
              established a visible legal operating footprint. The May 2026 financing then broadened the cap table, took
              disclosed capital above $1 billion, and lifted reported valuation sharply.


              Product and scale milestones are still more narrative than numeric. Official materials repeatedly describe
              a full-stack industrial robotics platform and a roadmap toward scaled deployments, while TechCrunch and
              Manufacturing Digital attribute to Scaringe the expectation that a large number of robots could be
              deployed by the end of 2026. Careers and job-board evidence show active hiring in safety, teleoperation,
              systems engineering, actuation, middleware, distributed training, and recruiting, which is consistent with
              a buildout phase rather than a mature operating footprint. The main adverse theme in independent
              commentary is not a disclosed lawsuit or recall; it is concentration. Mind’s moat and its risk are the
              same thing: dependence on Rivian for data, first-customer access, and governance linkage. Public cap-table
              detail, external customer diversification, and hard deployment metrics remain the major diligence gaps.
