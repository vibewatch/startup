  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and the Real Job To Be Done
        blocks:
          - type: paragraph
            body: >-
              Mind Robotics should not be framed against the whole automation universe. The company’s own positioning is
              narrower and more interesting: it says it is building intelligent robotics for industrial deployment,
              starting on the factory floor, with a data flywheel tied to Rivian’s active manufacturing lines. That
              language points to a specific job to be done: automate variable, dexterous, and human-proximate factory
              work that has historically been hard to standardize. The relevant spend therefore includes robot hardware,
              end effectors, perception, safety systems, cell software, and the integration work needed to make a robot
              useful in a real workcell. It does not logically include every form of industrial software, fixed conveyor
              automation, or nonindustrial service robots.


              This boundary matters because the status quo is not a single competitor. Buyers can keep work manual, buy
              a classical fixed-purpose robot cell, or hire an integrator to stitch together a custom automation stack.
              Mind’s launch wedge is attractive because automotive factories already tolerate robot-heavy capex and
              stringent uptime demands, but still contain many variable tasks in battery, final assembly, fastening, and
              inspection. The market is therefore best understood as the overlap between industrial automation budgets
              and the dexterity gap left behind by classical robotics, not as all factory technology spending.
            claimRefs:
