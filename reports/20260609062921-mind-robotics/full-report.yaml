  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Chain from strategic market and capital strengths through proof gaps to the research-more decision.
    data:
      nodes:
        - id: market
          label: Industrial demand
          type: input
          detail: IFR says industrial robot installation value hit $16.7B in 2026
        - id: access
          label: Strategic access
          type: process
          detail: Rivian partner or shareholder status and >$1B raised give Mind unusual platform-building resources
        - id: comps
          label: Private comp band
          type: process
          detail: Figure, Apptronik, Skild, and Agility show a live but demanding physical-AI pricing set
        - id: gap
          label: Proof gap
          type: process
          detail: No public revenue, customer count, deployment ROI, margin, or preference disclosure
        - id: price
          label: Current price
          type: process
          detail: Reuters or Yahoo places the latest round at $3.4B after a $2.0B March reference
        - id: decision
          label: Recommendation
          type: output
          detail: research-more; stretched until external proof and economics become public
      edges:
        - from: market
          to: access
          label: supports
        - from: access
          to: comps
          label: enables premium narrative
        - from: comps
          to: price
          label: frames
        - from: gap
          to: price
          label: undercuts confidence in
        - from: access
          to: decision
          label: keeps upside alive
        - from: gap
          to: decision
          label: drives caution
        - from: price
          to: decision
          label: sets current stance
    approximationNotes: >-
      The figure compresses the chapter's IC logic into a directional flow rather than a deterministic model. Each node
      summarizes multiple cited claims.
    claimRefs:
      - CV004
      - CV007
      - CV022
      - CV034
      - CV039
      - CV043
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Illustrative value outcomes as commercialization proof improves from a Rivian-only narrative to broader external
      deployment and disclosed economics.
    data:
      items:
        - label: Rivian-only narrative / no external proof
          value: 1.4
          detail: Rough central bear outcome in $B
        - label: Opaque but funded continuation case
          value: 2.6
          detail: Lower end of a defensible base band in $B
        - label: Current public round reference
          value: 3.4
          detail: Reuters or Yahoo reported latest round valuation in $B
        - label: External logos plus KPI disclosure
          value: 4.2
          detail: Mid-bull outcome if generalization starts to clear
        - label: External logos plus economics disclosure
          value: 5
          detail: Premium case approaching current Apptronik-style 2026 comp territory
    approximationNotes: >-
      Values are not revenue-multiple outputs; they are milestone-based scenario anchors in USD billions. The bars show
      how much proof still has to arrive before the current mark looks comfortable.
    claimRefs:
