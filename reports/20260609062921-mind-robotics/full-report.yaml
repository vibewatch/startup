      - number: '3.3'
        title: Humanoid Startups and Physical-AI Labs Compete More on Direction Than Distribution
        blocks:
          - type: paragraph
            body: >-
              Among startup peers, Agility has the strongest reviewed proof of actual industrial commercialization. Its
              official site says Digit is the first humanoid robot in production deployment, and its Toyota Motor
              Manufacturing Canada release says a successful pilot converted into a commercial Robots-as-a-Service
              agreement. Sanctuary is also relevant because it explicitly frames itself around industrial-grade humanoid
              robots and labor challenges, which overlaps with Mind’s thesis about hard-to-staff, high-variation work.
              Figure remains strategically important, but its reviewed 2026 official surface currently emphasizes home
              help and home environments more than factory deployment. That does not remove Figure as a future rival,
              but it does weaken the case that it is the cleanest direct manufacturing peer right now.


              Skild AI, Physical Intelligence, and Intrinsic matter for a different reason. Their public materials focus
              on omni-bodied robot intelligence, robot foundation models, VLA research, and AI-for-industry software
              layers. Those capabilities could eventually pressure Mind’s software differentiation, especially if
              incumbents or cobot vendors can license, partner, or build similar intelligence above existing hardware.
              But the reviewed public evidence still makes them look more like control-layer adjacencies than full-stack
              factory deployment competitors today. In other words, they compete for the future architecture of robotics
              more than for a plant manager’s immediate robot-cell purchase order.
