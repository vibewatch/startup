      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is thin and highly concentrated. RJ Scaringe is the founder, chairman, and
              unmistakable public face of Mind Robotics: official materials say the company was “founded and led” by the
              Rivian CEO, while TechCrunch explicitly identifies him as chairman. The only additional named governance
              figure consistently visible in public materials is Accel partner Sameer Gandhi, whose board seat was
              announced alongside the March 2026 Series A. Beyond those two people, reviewed public sources do not
              identify a separate Mind Robotics CEO, CFO, COO, CTO, or any independent director roster.


              That thin bench matters because Mind’s operating model is tightly intertwined with Rivian. Official
              language says Rivian is both a partner and major shareholder or shareholder, and independent coverage
              emphasizes that the same relationship supplies training data, launch access, and founder continuity. This
              creates classic key-person and governance concentration: Scaringe is simultaneously the strategic sponsor,
              the founder-chairman, and the CEO of the public-company partner from which Mind was spun out. No public
              source in the reviewed set disclosed a management succession plan, broader board composition, or
              minority-protection terms. Likewise, no material executive departure at Mind itself surfaced in the
              reviewed pack; the clearest leadership change visible externally was the March 2026 board expansion to add
              Sameer Gandhi.
