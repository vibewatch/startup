      - CV013
      - CV015
      - CV035
      - CV040
      - CV041
      - CV042
      - CV043
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Low/base/high value ranges for bear, base, bull, and current-price-reference cases, all in USD billions.
    data:
      items:
        - label: Bear case
          low: 1
          base: 1.4
          high: 1.8
          unit: $B
          note: Strategic-asset floor with weak external proof and opaque cap table
        - label: Base case
          low: 2.2
          base: 2.6
          high: 3
          unit: $B
          note: Rivian traction continues but external customer and economics disclosure remains limited
        - label: Bull case
          low: 3.8
          base: 4.4
          high: 5.2
          unit: $B
          note: External logos, deployment KPIs, and better economics disclosure justify premium pricing
        - label: Current round reference
          low: 3.3
          base: 3.4
          high: 3.5
          unit: $B
          note: Public valuation signal from the May 2026 follow-on round
    approximationNotes: >-
      The ranges reflect probability-weighted scenario thinking and public private-round comparables, not a discounted
      cash-flow or public-multiple exercise.
    claimRefs:
      - CV004
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: IC-style snapshot of Mind's current valuation profile on a 1-5 scale, where higher is better.
    data:
      items:
        - label: Market tailwind
          value: 5
          detail: IFR's $16.7B industrial robot installation backdrop is real and supportive
        - label: Strategic access
          value: 5
          detail: Rivian partnership and unusually fast capital formation create a rare launch environment
        - label: External proof
          value: 2
          detail: Public evidence still lacks named non-Rivian customer and deployment KPI disclosure
        - label: Disclosure quality
          value: 1
          detail: Revenue, margins, customer count, and preference terms remain undisclosed
        - label: Comparable positioning
          value: 3
          detail: Price is inside the physical-AI comp band but below the most extreme 2026 outliers
        - label: Downside protection
          value: 1
          detail: Without cap-table detail, common-equity downside cannot be bounded from public evidence
        - label: Valuation attractiveness today
          value: 2
          detail: Current $3.4B reference already assumes some of the bull case
    approximationNotes: >-
      Scores are analyst judgments derived from the cited evidence and are meant for IC triage, not for a standalone
      scoring model.
    claimRefs:
      - CV022
      - CV032
      - CV035
      - CV043
      - CV045
      - CV046
