        - from: integrators
          to: mind
          label: enables
        - from: standards
          to: mind
          label: constrains
        - from: talent
          to: mind
          label: scales
        - from: customers
          to: mind
          label: validates
        - from: compute
          to: mind
          label: supports
        - from: rivian
          to: compute
          label: may influence
    claimRefs:
