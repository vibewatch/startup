        - id: d2
          label: Rivian active manufacturing lines
          body: Source of production-scale data and live deployment environment.
        - id: d3
          label: Teleoperation / demonstration layer
          body: Bridges human intent and data generation for physical tasks.
        - id: d4
          label: Data engine
