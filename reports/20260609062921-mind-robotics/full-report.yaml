      - number: '3.2'
        title: Incumbent OEMs and Cobot Vendors Own the Current Trust Layer
        blocks:
          - type: paragraph
            body: >-
              The strongest competitive disadvantage for Mind in the reviewed public record is not imagination; it is
              installed-base trust. ABB calls itself one of the world’s leading robotics suppliers and markets an
              integrated portfolio spanning industrial and collaborative robots, AMRs, software, services, and
              application solutions. FANUC says it supports customers in more than 100 countries through more than 280
              service locations, while KUKA and Yaskawa market broad industrial robot and application stacks. Universal
              Robots adds a mature collaborative-robot ecosystem and now wraps its offer in “physical AI” language
              without abandoning the practical appeal of standardized arms. These vendors already speak the language of
              plant engineering, uptime, parts, service, and known deployment patterns.


              Standard Bots shows why cobot vendors are especially relevant to Mind’s budget competition. Its homepage
              gives model names, payloads, reaches, and starting prices, which is far closer to a familiar procurement
              motion than Mind’s still-custom full-stack pitch. Universal Robots is more quote-led, but it still
              presents safe, flexible arms for industrial automation rather than speculative generality. That means many
              tasks Mind might target can still be solved by simpler, cheaper, and easier-to-approve robot-arm
              deployments if the workflow can be bounded tightly enough. Mind may be aiming above classical automation,
              but incumbents and cobots remain the default comparator wherever dexterity needs are meaningful yet not
              fully open-ended.
