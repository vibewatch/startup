      - CR018
      - CR031
      - CR034
      - CR037
      - CR039
      - CR047
      - CR049
      - CR050
  - id: FR003
    title: Dependency map
    type: dag
    summary: >-
      Mind Robotics sits in the middle of a dense dependency web: Rivian is the most consequential node today, but
      standards, talent, capital, and customer engineering also control how fast deployment can turn into diversified
      revenue.
    data:
      nodes:
        - id: mind
          label: Mind Robotics
          detail: Full-stack industrial robotics startup building models, hardware, and deployment infrastructure.
        - id: rivian
          label: Rivian
          detail: Partner, shareholder, data source, and current public launch environment.
        - id: capital
          label: Capital providers
          detail: Fund hardware scale-up and field expansion before proven repeatability.
        - id: integrators
          label: Integrators / plant engineers
          detail: Translate robotics capability into safe production deployment.
        - id: standards
          label: Standards / regulators
          detail: Set the safety, validation, and liability baseline for industrial deployment.
        - id: talent
          label: Deployment talent
          detail: Required to integrate OT, AI, safety, and customer operations.
        - id: customers
          label: External customers
          detail: Needed to prove the business generalizes beyond Rivian.
        - id: compute
          label: Compute / hardware stack
          detail: May include partner-linked processors or scarce robotics components.
      edges:
