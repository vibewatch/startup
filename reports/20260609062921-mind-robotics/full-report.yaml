      - number: '6.3'
        title: Sales motion, deployment model, and switching costs
        blocks:
          - type: paragraph
            body: >-
              The public evidence suggests Mind Robotics is selling a high-touch industrial deployment, not a
              lightweight software subscription. Its own messaging says Rivian as the initial partner allows the company
              to focus on technical execution, while hiring signals show a similar emphasis on data capture,
              teleoperation, robot operations, integration, and deployment pipelines. The open-role mix on Built In and
              Ashby includes data and teleoperation product management, robotics systems program management, robot
              operations, runtime systems, CI/CD, and hardware/software/data integration. Taken together, that implies a
              sales motion that likely starts with a design-partner plant, expands through line-specific data collection
              and system integration, then proves itself in live operations before broader rollout is attempted.


              That model also implies substantial switching and integration costs for buyers. OSHA’s robot-safety
              guidance notes that industrial robot systems are typically tied into conveyors, worktables, process
              equipment, and other machines, while proprietary programming approaches can require special training.
              NIST’s collaborative-robot work emphasizes the need for datasets, benchmarks, test methods, protocols,
              metrics, and standards before safe human-robot collaboration scales. In practice, that means buyer
              adoption is likely to involve plant engineering time, integrator coordination, safety validation, and
              workflow redesign. Those frictions can help create stickiness after deployment, but they can also slow
              new-customer conversion if ROI or implementation confidence is weak.
            claimRefs:
