  - id: FR002
    title: Risk transmission map
    type: dag
    summary: >-
      Most of Mind’s risks transmit through a small number of pathways: concentration, safety, and integration pressure
      ultimately show up in revenue durability, margin quality, financing need, and valuation confidence.
    data:
      nodes:
        - id: concentration
          label: Rivian concentration
          detail: One partner anchors data, deployment, and much of the public proof set.
        - id: safety
          label: Safety and liability burden
          detail: Standards, validation, and product-liability duties can slow or reshape deployment.
        - id: integration
          label: Integration and downtime risk
          detail: Legacy systems and plant workflows can block otherwise promising robots.
        - id: revenue
          label: Revenue durability
          detail: Commercial repeatability depends on diversification and successful deployments.
        - id: margin
          label: Margin quality
          detail: Field service, redesign, and compliance work can absorb gross profit.
        - id: financing
          label: Financing need
          detail: Hardware and deployment infrastructure require capital ahead of proven repeatability.
        - id: valuation
          label: Valuation confidence
          detail: Investors pay for proof, not just access and capital.
        - id: operations
          label: Operational credibility
          detail: Customers need line-safe, auditable, maintainable automation.
      edges:
        - from: concentration
          to: revenue
          label: narrows
        - from: safety
          to: operations
          label: conditions
        - from: integration
          to: operations
          label: can disrupt
        - from: operations
          to: revenue
          label: drives
        - from: operations
          to: margin
          label: shapes
        - from: margin
          to: financing
          label: increases
        - from: revenue
          to: valuation
          label: supports
        - from: financing
          to: valuation
          label: dilutes
    claimRefs:
