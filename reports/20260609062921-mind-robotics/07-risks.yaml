- id: safety-liability-and-compliance-burden
  title: Safety and liability burdens are throughput constraints, not footnotes
  body: |-
    Mind is trying to automate dexterous, variable, reasoning-intensive work in live industrial settings, which means its safety burden is not optional paperwork that can be cleaned up after product-market fit. OSHA’s overview says many robot accidents occur during non-routine phases such as programming, maintenance, testing, setup, and adjustment. Its technical manual goes further by framing industrial robot applications as systems that need formal risk assessment, validation, review, and risk-reduction measures, especially when collaborative operation is involved. Just as important, OSHA notes that robot applications are usually integrated with conveyors, worktables, process equipment, and other machines, so the hazard surface is not limited to the robot arm itself.

    The standards stack reinforces this. NIST says safe human-robot collaboration still depends on datasets, benchmark tools, protocols, metrics, and standards. A3 and ISO 10218 place obligations on both robot makers and system integrators, while ISO/TS 15066 adds collaborative-robot requirements around the work environment and force-limited interaction. IFR then adds the modern wrinkle: AI-driven autonomy, cloud connectivity, and IT/OT convergence increase the complexity of testing, oversight, cybersecurity, and liability assignment. In parallel, legal sources say AI systems can attract design-defect, warning-defect, strict-liability, and civil-penalty exposure even before a dedicated federal robotics regime exists. For Mind, that means scale is bounded not just by model quality but by how quickly it can prove safe operation, defensible warnings, auditable governance, and insurable deployment practices in customer plants.
