- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Rivian concentration remains structural
    - Named non-Rivian production deployment count
    - No second production customer or paid external plant reference within the next major fundraising or 12-month review window
    - Treat commercial repeatability as unproven and underwrite the company as a captive or quasi-captive deployment story.
  - - Safety case remains narrative-heavy
    - Third-party validation and incident disclosure
    - No external safety audit evidence, no disclosed customer sign-off artifacts, or any material incident without transparent remediation
    - Pause conviction on scaled rollout and require safety diligence before assigning industrial-grade deployment credibility.
  - - Integration burden overwhelms ROI
    - Field metrics on downtime, intervention, and line impact
    - Persistent manual intervention, downtime blowouts, or inability to show customer KPI gains after integration
    - Assume deployment economics are bespoke and margin structure is weaker than the funding story implies.
  - - Capital backs growth but not economics
    - Gross margin, service burden, and working-capital trend
    - Need for repeated capital raises before external customer diversification or before service burden stabilizes
    - Shift the thesis from advantaged scale-up to expensive experimentation.
  - - Management and hiring become bottlenecks
    - Leadership depth and field staffing
    - No visible second-line leaders or chronic open roles across deployment, safety, and OT integration
    - Assume execution speed will lag technical ambition and haircut rollout assumptions.
  notes: These triggers are designed to be monitorable in future diligence refreshes and intentionally focus on events that would change the investment case rather than on abstract concerns.
