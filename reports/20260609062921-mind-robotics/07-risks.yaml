  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: rivian-revenue-share
    missingEvidence: A current breakdown of bookings, revenue, deployed robots, and training-data dependence attributable to Rivian versus all other accounts.
    whyItMatters: Without concentration math, investors cannot distinguish a privileged anchor deployment from a repeatable commercial business.
    diligencePath: Request the customer concentration schedule, top-account bookings by quarter, and any board-level KPI pack showing active deployments and ARR by customer.
    relatedQuestionRefs:
    - QR003
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: blocking
    topic: installed-base-and-field-metrics
    missingEvidence: Installed robot count, active production cells, uptime, MTBF, scrap impact, quality escapes, and any safety or near-miss logs.
    whyItMatters: The central debate is whether Mind is already robust enough for industrial use; public marketing copy cannot substitute for field metrics.
    diligencePath: Ask for a deployment dashboard covering robot count, shift coverage, uptime, intervention rate, false-stop rate, and any OSHA-recordable or near-miss events.
    relatedQuestionRefs:
    - QR006
    - QR029
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: safety-validation-and-insurance
    missingEvidence: Third-party safety audits, cell-level risk assessments, certification evidence, insurer requirements, warranty terms, and indemnity structure.
    whyItMatters: Product-liability and worker-safety exposure can erase margin and slow rollouts even when robot performance looks promising.
    diligencePath: Request the current safety case, external audit reports, insurer correspondence, customer warranty language, and incident-escalation policy.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: component-and-compute-concentration
    missingEvidence: A bill-of-materials view showing sole-source actuators, sensors, compute modules, controllers, custom silicon assumptions, and lead-time constraints.
    whyItMatters: A hardware startup can be operationally fragile even when demand exists if one supplier, processor roadmap, or tooling path becomes constrained.
    diligencePath: Request the latest approved-vendor list, sole-source waiver log, and any roadmap dependencies on Rivian or third-party compute hardware.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR003
    - TR004
  - type: private-evidence-only
    severity: material
    topic: non-rivian-customer-diversification
    missingEvidence: Named non-Rivian pilots, production references, contract values, and expansion evidence showing repeatability outside the anchor account.
    whyItMatters: The biggest commercial question is whether Mind has a business or a privileged in-house proving ground attached to Rivian.
    diligencePath: Request a customer list with stage, use case, current revenue, line count, reference-call availability, and cohort progression outside Rivian.
    relatedQuestionRefs:
    - QR002
    - QR027
    - QR028
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-service-burden
    missingEvidence: Hardware gross margin, field-service cost, working-capital needs, spare-parts reserve policy, and deployment payback assumptions.
    whyItMatters: Strong capital backing can mask a weak model for longer than software investors expect, especially when robots require on-site support.
    diligencePath: Request cohort-level deployment economics, gross margin by hardware and service, and the assumptions behind customer payback claims.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR004
    - TR005
