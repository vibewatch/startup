tables:
- id: TR001
  title: Regulatory / Legal Risk Register
  columns:
  - Rule / License / Exposure
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual Exposure
  - Diligence Path
  rows:
  - - GDPR — data controller obligations for EarthAI platform geospatial data processing
    - EU / Spain (AEPD)
    - Acknowledged; privacy policy published and GDPR bases documented
    - Medium — platform processes personal-context geospatial data; compliance posture exists
    - High — enforcement by Spain's AEPD or EU data authorities could restrict commercial operations
    - Privacy policy and DPA agreements with processors; whistleblower channel active
    - Medium — GDPR compliance is ongoing obligation; AI-derived outputs that infer individual behaviour need specific legal basis
    - Request DPA register, list of sub-processors, and AI Act conformity assessment status
  - - EU AI Act (Regulation 2024/1689) — potential high-risk AI classification for agentic EarthAI outputs
    - EU (cross-member state)
    - Regulation phased application 2024–2027; Xoople has not publicly addressed conformity
    - Medium — critical infrastructure and public-sector use cases (Alaska DoT) may trigger high-risk classification
    - High — non-conformity could block EU government sales and require expensive conformity assessments
    - Not publicly disclosed; absence of stated compliance posture is itself a risk signal
    - High — no public AI Act readiness statement; rapidly approaching enforcement deadlines
    - Request internal AI Act impact assessment; confirm whether any use cases cross high-risk category thresholds
  - - Commercial remote sensing licensing (EU Space Regulation 2021/696; Spanish national implementation)
    - EU / Spain
    - Not publicly disclosed; authorization required before constellation commercial operations
    - High — company is building a proprietary optical constellation and has not addressed licensing
    - High — operations without authorization could result in launch delays, fines, or operating restrictions
    - Seven years of development suggests regulatory pathway work; no disclosure
    - High — no license, no constellation operations; timeline gap is undisclosed
    - Request copy of license applications or regulatory submissions; confirm which authority (CDTI, EUSPA, MEC) is lead
  - - ITAR / EAR export control — L3Harris defense-heritage optical payloads subject to US export law
    - US (State Dept / Commerce Dept); bilateral US–Spain
    - Not publicly disclosed; L3Harris payloads developed in the US under US jurisdiction
    - High — L3Harris is a US defence prime; advanced optics almost certainly require export authorization for Xoople
    - Critical — failure to obtain ITAR Technical Assistance Agreement (TAA) could halt constellation build
    - Not addressed publicly; seven-year exclusive relationship suggests some authorization pathway exists
    - Critical — no TAA or export license confirmation is a blocking diligence gap
    - Request ITAR/EAR authorization documentation from Xoople and L3Harris; confirm TAA or license exception type
  - - Dual-use / national security restrictions — EO data used for geopolitical monitoring
    - Multiple (EU, US, customer country)
    - Not addressed publicly; use cases include "geopolitical and security monitoring"
    - Medium — sovereign access debates (OECD, Space Review) signal governments may restrict commercial providers
    - Medium — data restrictions or shutter-control orders could limit product availability to customers
    - Copernicus data layer somewhat insulates current platform; proprietary constellation faces higher exposure
    - Medium — no dual-use policy or shutter-control compliance framework disclosed
    - Assess which geographies Xoople plans to serve; confirm dual-use legal opinion obtained from CLO Chris Hoeschen
  notes: >-
    Table enumerates the five most material regulatory and legal risk vectors identified in public evidence
    as of June 2026. No litigation, enforcement action, or IP dispute against Xoople was found in public
    records (BORME, SEC EDGAR, Spanish judicial registry searches). Absence of evidence is not evidence
    of absence — the company has operated largely in stealth and is newly commercial.
  claimRefs:
