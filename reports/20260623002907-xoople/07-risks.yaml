- id: TR002
  title: Operational / Quality / Security Risk Register
  columns:
  - Failure Mode
  - Likelihood
  - Severity
  - Mitigation Maturity
  - Residual Exposure
  - Unresolved Gap
  rows:
  - - L3Harris constellation delivery delay — sole-source hardware provider fails to deliver on undisclosed timeline
    - High (timeline undisclosed; no backup plan)
    - Critical — no proprietary constellation = no data differentiation; platform remains Copernicus-dependent
    - Low — no disclosed contingency; no public milestone commitments
    - Critical — seven-year development invested without disclosed delivery assurance
    - Launch timeline, satellite count, and any contractual performance milestones with L3Harris not public
  - - Data quality / calibration failure at scale — AI outputs contain systematic errors propagated into customer decisions
    - Medium (inherent in novel AI-EO fusion at commercial scale)
    - High — CEO-stated requirement that customers tolerate "1% error" as unacceptable sets a very high bar
    - Low — no independent accuracy benchmarks, model validation reports, or third-party audits disclosed
    - High — unvalidated AI outputs in infrastructure and insurance use cases create liability and trust risk
    - No published accuracy benchmarks, confusion matrices, or validation studies for current platform
  - - Cyberattack / data breach — satellite data stream spoofing or platform data exfiltration
    - Medium (EO sector documented target; dual-use data is high-value for state actors)
    - High — geospatial data breach or spoofed output could trigger customer trust loss and regulatory action
    - Low — no SOC 2, ISO 27001, or NIST certification disclosed; no security posture page found
    - High — no public security certification creates enterprise procurement friction and real exposure
    - SOC 2 Type II attestation, penetration-test reports, and security incident response plan not found in public materials
  - - Platform dependency failure — Microsoft, Esri, or Databricks changes terms, pricing, or partnership tier
    - Medium — large platforms periodically restructure partner ecosystems
    - Medium — go-to-market disruption without owned channel; slower recovery if two platforms change simultaneously
    - Medium — distribution-first strategy is intentional; acknowledged in investor materials
    - Medium — no exclusivity clauses or guaranteed placement disclosed; reliance on platform roadmaps
    - Binding commercial terms, exclusivity provisions, or preferential-listing agreements not disclosed
  - - Satellite launch failure or on-orbit anomaly — loss of first constellation satellites
    - Low to medium (commercial launch reliability has improved but is non-zero)
    - High — loss of early satellites would delay revenue and require insurance recovery
    - Unknown — no launch insurance disclosure; no constellation phasing plan disclosed
    - High — first-generation constellation vulnerability; no on-orbit operational history exists for Xoople
    - Launch vehicle selection, insurance coverage, and phased-launch contingency plan not disclosed
  notes: >-
    Risk ratings reflect the current pre-constellation stage. Operational risk profile will shift
    significantly once satellites are launched. Mitigation maturity scores are based on publicly
    available information only; internal risk controls may be substantially more mature.
