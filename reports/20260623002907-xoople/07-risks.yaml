- id: TR004
  title: People / Execution Risk Register
  columns:
  - Role / Function
  - Dependency or Gap
  - Likelihood
  - Severity
  - Mitigation
  - Diligence Path
  rows:
  - - CEO Fabrizio Pirondini — external relationships, strategic narrative, L3Harris co-development
    - Key-person concentration; Pirondini leads all major partnerships and investor relations
    - Medium (startup stage; normal founder centricity)
    - High — departure or incapacity would disrupt L3Harris relationship, investor confidence, and hiring
    - Named senior bench (Ritchie, Vitale, Rath, Hoeschen) provides functional coverage; Endeavor membership adds external accountability
    - Confirm key-man life insurance; review management equity vesting terms; assess depth of L3Harris institutional vs personal relationships
  - - Technical leadership — seven-year constellation design team
    - Critical tacit knowledge about constellation architecture and L3Harris interface specifications
    - Low to medium (technical team built over seven years; unlikely to disperse rapidly)
    - High — loss of lead constellation engineers before first launch would require expensive and slow replacement
    - Long vesting cycles typical; team has personal stake in reaching first light
    - Request org chart of technical constellation team; confirm retention package post-Series B; identify single-engineer dependencies
  - - Board and governance structure
    - No independent directors, committee charters, or audit/compensation oversight disclosed publicly
    - High — governance opacity is a current state, not a probability
    - Medium to High — investor disputes, compliance failures, or misalignment of incentives more likely without independent oversight
    - Chris Hoeschen (CLO) provides internal legal governance; CDTI as government investor may have board observer rights
    - Request board composition, committee structures, and any investor protective provisions; confirm whether CDTI has board seat
