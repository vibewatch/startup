    - Request Ritchie and Rath CVs; assess direct track record in enterprise SaaS or EO distribution roles; review current pipeline coverage
  notes: >-
    People risk assessment is based on publicly available biographies, press statements, and Endeavor
    profile. Internal compensation structures, retention plans, and equity vesting are not public.
