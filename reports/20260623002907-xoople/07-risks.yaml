- id: FR002
  title: Risk Transmission Map
  type: dag
  layout: wide
  summary: >-
    Directed graph showing how primary risks at Xoople transmit to downstream impacts on revenue,
    customers, financing, operations, and investment valuation. Constellation delivery risk is the
    most central node: it feeds both revenue differentiation risk and capital intensity risk, which in
    turn influence valuation and investor confidence.
  approximationNotes: >-
    Transmission probabilities are qualitative; edge labels reflect causal mechanism rather than
    quantified probability of transmission. The graph is derived from public evidence and structured
    inference, not from internal risk management documentation.
  data:
    nodes:
    - id: constellation-risk
      label: 'L3Harris constellation delivery delay (undisclosed timeline)'
    - id: itar-risk
      label: 'ITAR / export control complication (US State/Commerce)'
    - id: revenue-opacity
      label: 'Revenue and financial opacity (burn, ARR undisclosed)'
    - id: customer-concentration
      label: 'Customer concentration (single named production deployment: Alaska DoT)'
    - id: platform-dependency
      label: 'Distribution platform dependency (Microsoft, Esri, Databricks)'
    - id: regulatory-risk
      label: 'Regulatory exposure (GDPR, AI Act, remote sensing license)'
    - id: data-differentiation
      label: 'No proprietary data differentiation until first light'
    - id: revenue-impact
