- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - L3Harris constellation delivery delay
    - No public milestone announcement within 12 months of Series B close (i.e. by April 2027)
    - Absence of satellite count, launch vehicle, or launch window disclosure by April 2027
    - "Material: move to Conditional Hold; request private access to L3Harris contract and delivery schedule"
  - - ITAR / export-control compliance gap
    - Regulatory notice, media report, or DDTC/BIS enforcement action naming L3Harris–Xoople payload programme
    - Any US government export enforcement action or publicly disclosed compliance hold on payload delivery
    - "Critical kill: suspend investment pending resolution; engage specialist trade-compliance counsel"
  - - Customer concentration — Alaska DoT loss
    - Alaska DoT publicly cancels contract, reduces scope, or fails to renew
    - Elimination of Alaska DoT as active customer without a named replacement in a comparable government segment
    - "Material kill trigger: loss of the only independently verifiable production deployment removes all public proof of customer value"
  - - Revenue opacity persists through Series C
    - No revenue, ARR, or customer count disclosed in Series C materials or associated press
    - Absence of any financial disclosure at next major financing round (≥12 months post Series B)
    - "Material: inability to underwrite intrinsic value without revenue data; move to Track"
  - - GDPR / AI Act regulatory action
    - Enforcement notice from Spain's AEPD, a EU data authority, or court filing in Madrid jurisdiction
    - Any formal regulatory investigation or enforcement order that restricts data processing for EarthAI
    - "High: suspend or cap exposure until regulatory trajectory is clear; engage GDPR compliance counsel"
  notes: >-
    Kill criteria are intended as IC-level monitoring triggers, not automatic exit rules. Thresholds are
    calibrated to current public evidence and should be updated as Xoople provides private-diligence
    access. Absence of a trigger event is itself a positive signal only when paired with advancing
    commercial proof.
  claimRefs:
  - CR011
  - CR005
  - CR045
  - CR039
  - CR001

figures:
- id: FR001
  title: Risk Heatmap
  type: matrix
  layout: wide
  summary: >-
    Positions Xoople's five primary risk categories by likelihood and impact. The heatmap reflects the
    current pre-constellation, newly-commercial stage of the company. L3Harris constellation delivery
    and customer/financial concentration are the two most critical quadrant risks. Regulatory risk is
    managed but has tail severity. People and operational risks are elevated but partially mitigated
    by recent management hires.
  approximationNotes: >-
    Likelihood and impact ratings are structured judgements based on public evidence only; internal
    risk controls or mitigation documentation may warrant downgrading several entries. Ratings are
    point-in-time as of June 2026 and should be reassessed upon first satellite launch or Series C.
  data:
    columns:
    - Low Impact
    - Medium Impact
    - High Impact
    rows:
    - label: 'High Likelihood'
      values:
      - '—'
      - 'Revenue opacity (CR039); Governance opacity (CR033); Customer concentration (CR045)'
      - 'L3Harris delivery timeline undisclosed (CR011, CR012); No constellation milestone committed'
      tone: critical
    - label: 'Medium Likelihood'
      values:
      - 'Minor partner term changes'
      - 'GDPR/AI Act regulatory action (CR001, CR008); Platform dependency shift (CR015); People execution gap (CR036)'
