    "summary": "Xoople entered commercial operations in Q2 2026 with $225 million in total capital raised but no publicly disclosed revenue, ARR, gross margin, burn rate, or customer count. The company's distribution-first model embeds EarthAI into Microsoft and Esri ecosystems before its own satellite constellation is operational, yielding a near-term revenue path built on third-party data licensing and platform integration subscriptions. Capital intensity will escalate materially once hardware development with L3Harris transitions from design to manufacturing. Public-company EO comparables — Planet Labs at approximately 56% gross margin and $308 million revenue after years of losses, BlackSky with accumulated deficit of $726 million — calibrate the distance from launch to profitability, but Xoople discloses none of the inputs needed for independent underwriting."
