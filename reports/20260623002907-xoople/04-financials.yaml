      "id": "revenue-model-and-commercial-status",
      "title": "Revenue model and commercial status at commercialization launch",
      "body": "Xoople officially began commercialization in Q2 2026 after seven years of stealth development, transitioning from an Early Access Program to full market availability. The company's self-described revenue model is an ecosystem embedding strategy: rather than selling data directly to end users, Xoople positions its EarthAI data layer inside enterprise platforms its target customers already use — Microsoft Fabric and Power BI, Esri ArcGIS, and Databricks — so that buyers can access continuous Earth surface intelligence from within their existing workflows. CEO Fabrizio Pirondini confirmed to TechCrunch that the model centers on embedding data and solutions into the ecosystems of enterprise partners so those partners can provide services directly to their customers. This means Xoople's primary revenue streams are expected to be enterprise data subscriptions accessed via ecosystem partners, direct commercial contracts with government agencies and Fortune 500 customers for Earth intelligence services, and potentially usage-based or API licensing fees. A secondary stream — satellite services — is not yet active since Xoople's proprietary constellation is still in the sensor design phase with L3Harris. Until that constellation is operational, the platform processes and distributes data from government spacecraft (including ESA Sentinel-2) and third-party EO providers. No revenue, ARR, bookings, or specific customer contract values have been publicly disclosed. The presence of government agencies and unnamed Fortune 500 companies in the private-preview cohort confirms intent to sell, but the transition from preview to paid recurring contract has not been publicly verified as of the runDate.",
