    {
      "id": "cost-structure-and-gross-margin",
      "title": "Cost structure, gross margin drivers, and capital intensity",
      "body": "Xoople's cost structure in its current pre-constellation phase is dominated by cloud infrastructure costs (Azure compute and storage for the EarthAI processing layer), data licensing costs for the third-party and government EO data it ingests, engineering and R&D headcount, and the fixed overhead of its Tres Cantos headquarters (4,000 square meters, targeting 300-plus direct jobs). When the company transitions to a proprietary constellation, satellite capex will become the dominant capital item: the L3Harris co-development agreement involves optical sensor design and manufacturing, which is among the most expensive categories of space hardware. Planet Labs reported cost of revenue of $135.2 million on $307.7 million in revenue for its FY2026 (fiscal year ended January 31, 2026), implying a gross margin of approximately 56%; this is the best-available comparable for an at-scale EO data subscription business using a one-to-many delivery model. Pre-constellation EO platforms with lighter satellite overhead may see higher near-term gross margins, but data licensing fees from third-party EO providers could compress margins significantly. BlackSky's 10-K for FY2025 noted that four customers accounted for 89% of total revenue, illustrating extreme customer concentration risk and the danger of a government-heavy revenue mix. The Satellogic 20-F for FY2023 showed a company still struggling to demonstrate scalable revenue growth years after its SPAC listing. Xoople has not disclosed any gross margin or cost-of-revenue information. The path from Xoople's current platform phase (moderate capex) to its constellation phase (very high capex) requires sustained capital infusion, and neither the timing nor the quantum of constellation capex has been made public.",
