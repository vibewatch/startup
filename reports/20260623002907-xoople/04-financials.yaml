    {
      "id": "capital-adequacy-and-financing-history",
      "title": "Capital adequacy, financing history, and runway",
      "body": "Xoople has raised a total of approximately $225 million since founding in 2019. The Company Overview chapter documents the full funding chronology; this section focuses on the forward capital adequacy picture. The April 2026 Series B raised $130 million, led by Nazca Capital, with co-investors MCH Private Equity, CDTI (Government of Spain), Buenavista Equity Partners, and Endeavor Catalyst. Prior to the Series B, Cinco Días reported that in July 2025 Xoople raised a €22 million extension that brought the total to approximately €137 million, and before that the company had raised approximately €115 million in cumulative funding backed by AXIS/ICO, CDTI, Space Eye, ESRI International, GED Conexo, and BM Invest Space. CDTI Innovación committed €16.74 million to Xoople in one disclosed tranche. The Series B was earmarked for constellation development and commercial scale-up per official communications, but no use-of-proceeds breakdown was provided. Monthly cash burn is undisclosed; burn estimates based on comparable EO companies at similar scale range from €2.5–6 million per month (€30–70 million annualized), implying a runway of roughly 22–50 months from the Series B close. Xoople has not disclosed any debt, convertible instruments, or project finance obligations beyond the equity rounds. Planet Labs, by comparison, issued $460 million in convertible notes (0.50%, due 2030) in September 2025, illustrating how capital-intensive a full EO constellation business becomes once construction begins. Xoople will likely need additional capital before or alongside constellation deployment. The investor composition — government-linked capital, PE, and growth investors — suggests the company can access both capital markets and public-sector funding channels, but governance terms and preference-stack details are not public.",
