callouts:
  - calloutType: recommendation
    title: Track — Await Q3-Q4 2026 Commercial Proof
    body: >-
      The recommendation is Track with medium confidence. Xoople has a credible thesis, domain-experienced
      founders, and $225M in institutional capital, but the implied $1B+ valuation cannot be underwritten
      from available public evidence. No revenue, ARR, customer count, gross margin, or constellation
      schedule has been disclosed. Entry discipline requires at minimum three signed enterprise contracts
      with disclosed ACVs before the call moves to Research-More or Buy.
    claimRefs:
      - CV031
      - CV034
      - CV035

  - calloutType: risk
    title: Valuation Stretched — Pre-Revenue Unicorn Claim Without Evidence
    body: >-
      CEO Fabrizio Pirondini stated publicly that Xoople is in "unicorn territory" (≥ $1 billion
      valuation), but no post-money figure has been disclosed. Public EO comparable companies
      Planet Labs (33x P/S), BlackSky (13x P/S), and Spire Global (11x P/S) require confirmed
      recurring revenue to justify their current market prices. At mid-range multiples of 15-20x,
      Xoople would need $50-67 million in ARR to justify a $1 billion entry, and none of that
      ARR has been confirmed as contracted.
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV036

  - calloutType: insight
    title: Distribution-First Model Reduces Capex But Delays Data Economics
    body: >-
      Xoople's decision to commercialize via embedded distribution (Microsoft Fabric, Esri ArcGIS,
      Databricks) before launching its own satellites is strategically rational: it validates
      enterprise demand at lower near-term capital intensity than a constellation-first approach.
      However, this means the current platform generates margins compressed by third-party data
      licensing costs (ESA Sentinel-2 data is free but cloud processing adds cost). The proprietary
      gross margin profile — which could approach Planet Labs' 56% — only materializes after
      the L3Harris constellation is operational, making the constellation timeline a critical
      valuation driver.
    claimRefs:
      - CV031
      - CV017
      - CV013
      - CV022

