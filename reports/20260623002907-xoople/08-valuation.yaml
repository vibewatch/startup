  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger event
      - Observable threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Down-round Series C financing
        - >-
          Any announced Series C at pre-money valuation below $900M (the approximate lower bound
          of plausible Series B post-money range)
        - >-
          Signals commercial underperformance vs. internal targets; preference stack overhang makes
          Series B returns improbable without extreme exit; confirms bear case
        - Exit tracking position immediately; no re-entry until new management team or restructuring
      - - Loss of Microsoft or Esri distribution channel
        - >-
          Official announcement of non-renewal, termination, or replacement of the Fabric, ArcGIS,
          or Databricks embedded distribution agreement
        - >-
          Distribution-first model collapses without ecosystem channel; forces direct sales rebuild
          at 3-5x higher CAC; delays ARR ramp by 18-36 months
        - Downgrade to Avoid; re-evaluate only with evidence of replacement channel at equivalent scale
      - - Constellation delay beyond 2030
        - >-
          Official announcement or credible reporting placing first-light date later than December 2030;
          or silence through December 2027 with no milestone update
        - >-
          Proprietary data moat delayed; pre-constellation gross margin compression continues;
          requires additional dilutive financing to bridge the constellation gap
        - Move to research-more; timeline risk now dominates; await constellation financing structure
      - - ITAR/export-control enforcement action
        - >-
          US State Department or Commerce Department enforcement notice involving L3Harris optical
          payload co-development; or public litigation related to dual-use data exports
        - >-
          L3Harris partnership frozen or terminated; constellation program paused;
          product roadmap disrupted; regulatory overhang discounts valuation 30-50%
        - Immediate tracking suspension; legal diligence required before re-entry
      - - CEO or CFO departure before first revenue filing
        - >-
          Public announcement of departure of Fabrizio Pirondini (CEO) or Alvaro Coronado (CFO)
          before publication of first audited annual revenue figure
        - >-
          Founder-centric structure means loss of either co-founder at this stage signals
          deep internal disagreement, investor pressure, or strategic pivot
        - Downgrade to research-more; await succession announcement and management meeting
      - - Zero paid contracts by Q4 2026
        - >-
          No confirmed paid commercial contract reported in any Xoople press release, partner
          announcement, or media report by December 31, 2026
        - >-
          Confirms commercial hypothesis has not been validated nine months after formal launch;
          raises risk of Series C timing pressure and valuation reset
        - Downgrade to Avoid if no contract evidence by December 31, 2026
    notes: >-
