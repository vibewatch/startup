  - id: recommendation-and-kpis
    title: Recommendation, Risk Rating, and Valuation Stance
    body: >-
      The recommendation is Track, with medium confidence and a high risk rating. The valuation
      stance is Stretched. This is a price-sensitive and evidence-sensitive call, not a generic
      quality score: the thesis is credible, the team is domain-experienced, and the market
      opportunity is real. However, the implied $1 billion or more post-money valuation cannot be
      underwritten from available public evidence because Xoople has disclosed no revenue, no ARR,
      no customer count, no burn rate, no gross margin, no preference stack, and no precise
      constellation deployment timeline. The distribution-first model reduces near-term capital
      requirements but delays the proprietary data economics that would justify a premium multiple.
      Existing public EO comparables (Planet Labs at 33x P/S, BlackSky at 13x, Spire at 11x) suggest
      that $30-90 million in recurring revenue is needed to justify a $1 billion valuation at market
      multiples — and none of that revenue has been confirmed as contracted, let alone recognized.

      The Track recommendation does not preclude a future buy call. The call would move to
      research-more on evidence of at least three signed enterprise contracts with annual contract
      values (ACVs) and renewal terms disclosed, or on confirmation that the Series B post-money
      valuation is below $900 million. It would move to buy if Xoople demonstrates $20 million or
      more in ARR from diverse customers by end of 2026, discloses a gross margin above 45 percent,
      and provides a credible constellation milestone schedule with a confirmed launch window. It
      would move to avoid on a down-round, loss of more than one named commercial customer, or an
      announced constellation delay beyond 2030. The investment KPI scorecard in this chapter
      captures the eight dimensions driving the call: market opportunity and team are high-scoring,
      but commercial proof, economics, risk, and valuation discipline all score low given current
      evidence.
