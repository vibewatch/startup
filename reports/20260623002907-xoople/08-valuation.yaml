  - id: financing-and-comparables
    title: Valuation Framework, Financing Context, and Comparable Companies
    body: >-
      Xoople's capital formation through June 2026 totals approximately $225 million. The April 2026
      Series B raised $130 million, led by Nazca Capital with participation from MCH Private Equity,
      CDTI Innovación (the Spanish government's technology investment arm), Buenavista Equity Partners,
      and Endeavor Catalyst. CDTI Innovación had already committed €16.74 million in a prior disclosed
      tranche, demonstrating that Spanish government capital provides a partially subsidized funding
      channel that reduces dependence on purely commercial capital market cycles. The pre-Series B
      capital base of approximately $95 million had been assembled from AXIS/ICO, Space Eye, ESRI
      International, GED Conexo, and BM Invest Space. CEO Pirondini told TechCrunch and Cinco Días
      that the company is now in "unicorn territory" (i.e., post-money valuation ≥ $1 billion), but
      no exact figure was disclosed. EU Startups and Cinco Días both converted the raise to approximately
      €112-113 million, confirming the dollar quantum, while neither source obtained a valuation figure
      from the company.

      The relevant public comparable set for valuing Xoople is led by Planet Labs (NYSE: PL), which
      reported fiscal year 2026 (ended January 31, 2026) total revenue of $307.7 million and a gross
      margin of approximately 56 percent per its 10-K filing. At a June 22, 2026 stock price of $28.77
      and market capitalization of approximately $10.25 billion, Planet Labs trades at roughly 33x
      trailing revenue — a premium multiple that reflects the market's expectation of accelerating
      AI-driven data demand and Planet's platform monetization upside. BlackSky Technology (NYSE: BKSY)
      trades at approximately $1.06 billion market capitalization with trailing annual revenue of
      approximately $83 million, implying a P/S multiple of about 13x; BlackSky's FY2025 10-K
      disclosed that four customers accounted for 89% of total revenue, highlighting extreme
      concentration risk. Spire Global (NYSE: SPIR) trades at approximately $669 million market
      capitalization with trailing revenue of approximately $63 million, implying roughly 11x P/S;
      Spire operates a subscription-based weather, aviation, and maritime data business. Satellogic,
      the SPAC-listed Argentine EO operator, has struggled to reach commercial scale since its 2021
      listing and its most recent 20-F filing shows persistent operating losses and limited revenue
      growth, providing a cautionary ceiling on valuation. Taken together, the public EO data sector
      currently trades at 11-33x trailing revenue, with the premium end representing AI-era platform
      positioning and the discount end reflecting customer concentration or single-use-case limitations.
