  - id: diligence-and-triggers
    title: Final Diligence Asks and Thesis-Break Triggers
    body: >-
      The most important diligence ask is a management KPI package covering: total contracted ARR
      from Q2-Q4 2026 signed contracts, customer count and industry breakdown, average contract
      value and duration, gross margin on early contracts, monthly cash burn and runway projection,
      and constellation deployment milestone plan with dates. This package alone would move the
      recommendation from Track to a more decisive call in either direction within a single due
      diligence cycle. Secondary asks include the full cap table with preference stack and
      liquidation waterfall, the technical assistance agreement or export authorization covering
      the L3Harris optical payload under ITAR, and independently verified references from at least
      two paying customers.

      Thesis-break triggers define the conditions under which the Track call becomes Avoid without
      further diligence. The most severe trigger is a confirmed down-round: any Series C at a
      valuation below the implied Series B mark would signal commercial underperformance and
      preference-stack overhang. A second trigger is loss of the Microsoft or Esri distribution
      channel, which would require Xoople to rebuild direct sales infrastructure at significantly
      higher cost and slower velocity. A third trigger is a constellation delay announcement putting
      first light beyond 2030, because Xoople's competitive differentiation relative to commodity
      ESA Sentinel-2 data depends critically on proprietary sensing. A fourth trigger is any public
      regulatory enforcement action or ITAR/export-control citation related to the L3Harris payload,
      which would freeze development and potentially require restructuring the partnership. Finally,
      a CEO or CFO departure before the first annual revenue filing would significantly increase
      execution risk given the founder-centric governance structure observed in all available public
      materials. Monitoring these triggers over a twelve-month tracking horizon requires no private
      information: all five are detectable from press releases, regulatory filings, ecosystem partner
      announcements, and government procurement databases.
