  - id: scenario-analysis
    title: Bull, Base, and Bear Scenario Analysis
    body: >-
      The bull case assumes Xoople converts its government and Fortune 500 private-preview pipeline
      into ten or more paid enterprise contracts by Q4 2026, achieves $40-60 million in ARR by end
      of 2027, and signs the first multi-year renewal cohort in 2028 as the L3Harris constellation
      launches on schedule. In this scenario, the distribution-first model proves its value: embedded
      distribution through Microsoft and Esri reduces customer acquisition cost significantly versus
      direct EO selling, and gross margins approach Planet Labs' 56% range once proprietary data
      displaces third-party licensing fees. Applying Planet Labs' current 33x P/S multiple to $100
      million ARR in 2029 yields a $3.3 billion valuation; applying a more conservative 15x yields
      $1.5 billion. Series B investors entering at $1 billion implied could expect a 1.5-3.3x gross
      return by 2029 in this scenario. Probability signal: low (25%), conditional on confirmed paid
      contracts by Q4 2026, constellation first light by 2028, and market-wide EO appetite holding.

      The base case assumes Xoople builds a solid but modest early commercial book — $15-30 million
      ARR by end of 2027, primarily from government and large-enterprise contracts — but the
      constellation timeline slips to 2029-2030, and the platform premium over commodity EO data
      is harder to sustain in the interim. Valuation holds near $1-1.5 billion through Series C
      (which would likely raise an additional $100-150 million for constellation capex), representing
      flat-to-modest returns for Series B investors. Probability signal: moderate (50%), conditional
      on at least some commercial proof visible by Q3-Q4 2026 and no deterioration in investor
      sentiment toward private EO companies. Sensitivity analysis shows that each 5x multiple
      compression from 33x to 10x reduces the implied fair value by roughly 70%; conversely,
      each $10 million incremental ARR adds approximately $150-330 million in implied value
      depending on the applicable multiple.

      The bear case assumes commercial traction materially disappoints: only one to three paid
      contracts signed by end of 2026, the constellation slips to 2031 or is restructured,
      and capital markets for private space-tech tighten. In this scenario, Xoople would likely
      seek a bridge round or Series C at a flat or down valuation of $600-800 million, causing
      material dilution for Series B investors. The Satellogic trajectory — SPAC listing at
      approximately $850 million in 2021, cumulative losses, and persistent difficulty scaling
      revenue — is the direct cautionary analog. Probability signal: moderate (25%), particularly
      if Q3-Q4 2026 commercial data remains absent from public filings and press releases.
