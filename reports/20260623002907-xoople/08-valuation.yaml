  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: contracted-arv-and-commercial-traction
      missingEvidence: >-
        Total contracted ARR from Q2-Q4 2026, customer count, industry breakdown, average
        contract value, and confirmed paid conversion rate from private-preview cohort.
      whyItMatters: >-
        Without any ARR figure, the valuation is entirely milestone-based and cannot be
        underwritten using any standard revenue multiple framework. Even a partial figure
        would enable scenario analysis with evidence-based inputs.
      diligencePath: >-
        Direct management KPI request in data room; alternatively, monitor Xoople press releases,
        Microsoft/Esri partner announcements, and government procurement databases for named contracts.
      relatedQuestionRefs:
        - QV011
        - QV014

    - type: private-evidence-only
      severity: blocking
      topic: governance-cap-table-preference-stack
      missingEvidence: >-
        Exact post-money Series B valuation, full cap table with ownership percentages, preference
        share terms, liquidation waterfall, anti-dilution provisions, and board composition.
      whyItMatters: >-
        Preference overhang can make Series B returns negative even in base-case exit scenarios
        if earlier investors hold 2x liquidation preferences; this cannot be assessed without data.
      diligencePath: >-
        Direct investor data room disclosure; Spanish Mercantile Registry (BORME) may eventually
        disclose share class structures for Xoople S.L. in notarial filings.
      relatedQuestionRefs:
        - QV024

    - type: private-evidence-only
      severity: material
      topic: constellation-deployment-timeline-capex
      missingEvidence: >-
        L3Harris satellite count, target orbital parameters, launch vehicle, launch window,
        and total constellation CAPEX requirement through first light.
      whyItMatters: >-
        Constellation timing determines when Xoople transitions to proprietary data economics
        and gross margins. A delay beyond 2030 requires additional dilutive financing and
        extends the third-party data margin compression phase.
      diligencePath: >-
        Direct management request; L3Harris SEC filings and press releases; SpaceNews tracking
        of commercial constellation developments.
      relatedQuestionRefs:
        - QV033

    - type: private-evidence-only
      severity: material
      topic: itar-export-control-status
      missingEvidence: >-
        Confirmation of Technical Assistance Agreement (TAA) or applicable license exception
        for the L3Harris optical sensing payload transfer to Xoople S.L. (a Spanish entity).
      whyItMatters: >-
        ITAR/EAR enforcement could freeze the co-development agreement; this is a binary
        regulatory risk with no market-visible status indicator, making it a potential
        non-disclosed deal-stopper.
      diligencePath: >-
        Direct legal disclosure in data room; L3Harris public communications; consult with ITAR
        specialist counsel on applicable license categories for optical remote sensing technology.
      relatedQuestionRefs:
        - QV034

