    "number": 1,
    "title": "Company Overview",
    "summary": "Xoople is a Madrid-based EarthAI infrastructure company founded in 2019 by Earth-observation veterans Fabrizio Pirondini and Alvaro Coronado. After roughly seven years in stealth, it opened a new global headquarters in Tres Cantos in December 2025 and announced a $130 million Series B in April 2026 that brought total funding to about $225 million and pushed the company into self-described unicorn territory. The company is commercializing an AI-native Earth data platform while preparing a proprietary optical constellation with L3Harris, but it still withholds key underwriting metrics such as exact valuation, satellite count, revenue, and headcount."
  },
  "sections": [
    {
      "id": "identity-and-legal-footing",
      "title": "Identity, legal entity, and operating thesis",
      "body": "Xoople presents itself as a Spanish-born Earth data infrastructure company whose core thesis is that AI systems need a trusted, continuously updated “system of record” for physical change on Earth. Official company materials say the business was founded in 2019, spent roughly seven years in stealth, and is now commercializing EarthAI: a data layer that translates satellite and environmental signals into AI-ready measurements for enterprise and government workflows. The legal entity disclosed in the company’s privacy policy and terms of use is Xoople S.L., with registered address at Calle San German 13 in Madrid and CIF B88282090, placing the company squarely under Spanish law and GDPR obligations. While the registered office is in central Madrid, the company’s public operating identity is now centered on its global headquarters in Tres Cantos, and multiple sources also describe it simply as Madrid-based. In practical terms, Xoople is selling decision infrastructure rather than raw imagery: it wants AI systems to ingest reliable physical-world context for supply chains, infrastructure, agriculture, risk, and resilience use cases.",
