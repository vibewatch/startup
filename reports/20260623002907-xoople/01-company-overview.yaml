    {
      "id": "milestones-partnerships-and-open-gaps",
      "title": "Milestones, strategic partnerships, and underwriting gaps",
      "body": "The milestone pattern across 2025 and 2026 shows a company moving from stealth to narrative control around EarthAI, sovereign European relevance, and an eventual proprietary constellation. Xoople emerged publicly in 2025, opened its Tres Cantos headquarters and Early Access Program in December 2025, announced the $130 million Series B in April 2026, and disclosed an exclusive long-term co-development relationship with L3Harris for advanced optical sensing shortly thereafter. L3Harris and SpaceNews describe the future constellation as an AI-optimized measurement system meant to deliver orders-of-magnitude improvements in precision and speed, but both Xoople and TechCrunch withhold key parameters such as satellite count, constellation architecture, and exact deployment schedule. The public record also does not disclose revenue, ARR, headcount, customer count, board composition, or exact Series B valuation. Those omissions do not negate the company’s strategic relevance, but they materially limit how much of the bull case can be underwritten from public evidence alone at this stage.",
