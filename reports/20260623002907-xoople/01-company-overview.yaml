    {
      "id": "capital-base-and-hq-scale",
      "title": "Capital base, valuation signal, and headquarters scale",
      "body": "Xoople’s April 2026 financing moved it from stealth deep-tech story to nationally visible Spanish unicorn candidate. The company’s official release states that it closed a $130 million Series B on April 6, 2026 and reached total funding of $225 million. TechCrunch reported the round was led by Nazca Capital with participation from MCH Private Equity, CDTI, Buenavista Equity Partners, and Endeavor Catalyst, and quoted CEO Fabrizio Pirondini saying the company is now in “unicorn territory” without disclosing an exact post-money mark. Spanish coverage from Cinco Días and Xataka independently reinforced that interpretation, framing Xoople as a leading Spanish deep-tech financing event. The December 2025 headquarters announcement also matters because it shows Xoople had already raised more than €135 million before the Series B and was scaling fixed infrastructure: a 4,000 square meter Tres Cantos hub intended to host global operations and support more than 300 direct high-skill jobs. Public evidence therefore supports strong capitalization and state-linked strategic backing, but not a precise valuation, ownership breakdown, or preference stack.",
