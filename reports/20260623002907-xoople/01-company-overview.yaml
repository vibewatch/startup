    {
      "id": "founders-and-management",
      "title": "Founders, management bench, and governance visibility",
      "body": "The available evidence points to a technically credible but still founder-centric leadership structure. Endeavor’s 2026 selection announcement identifies Fabrizio Pirondini and Alvaro Coronado as Xoople’s co-founders, while company and independent profiles position Pirondini as CEO and Coronado as CFO. Their prior overlap at Deimos Imaging matters: Pirondini previously ran Deimos Imaging and worked in Earth observation mission analysis at Elecnor Deimos after starting at GMV, while Coronado spent more than fifteen years in aerospace finance and served as CFO of Deimos Imaging after earlier roles at Fidelity, PwC, and Deloitte. Raw HTML on Xoople’s about page also lists Jamie Ritchie as Chief Business Officer, Massimiliano Vitale as Chief Operating Officer, Jeff Rath as EVP Finance & Strategy, and Chris Hoeschen as Chief Legal Officer, which suggests the company has been adding commercial, finance, operations, and legal capacity around the founders. What remains missing is board-level visibility: no official board roster, committee structure, or control disclosures were found in the public materials reviewed for this run.",
