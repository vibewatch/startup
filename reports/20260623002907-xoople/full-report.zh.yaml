      - number: '8.3'
        title: 牛市、基准和熊市情景分析
        blocks:
          - type: paragraph
            body: >-
              牛市情景假设 Xoople 到 2026 年 Q4 将政府和 Fortune 500 私测管线转化为十个或更多付费企业合同，到 2027 年底实现 $40-60 million ARR，并在 2028 年随着
              L3Harris 星座按期发射，签下第一批多年续约客户。在这一情景下，先分销模型证明了自身价值：通过 Microsoft 和 Esri 嵌入分销，相比 EO
              直销显著降低获客成本；当专有数据替代第三方许可费后，毛利率接近 Planet Labs 56% 区间。将 Planet Labs 当前 33x P/S 倍数套用于 2029 年 $100 million
              ARR，可得 $3.3 billion 估值；采用更保守的 15x，则为 $1.5 billion。若 Series B 投资人以 $1 billion 隐含估值进入，在该情景下到 2029 年可期待
              1.5-3.3x 总回报。概率信号：低（25%），条件是 2026 年 Q4 前确认付费合同、2028 年星座首次成像、全市场 EO 需求保持。

              基准情景假设 Xoople 建起一个扎实但规模有限的早期商业账本——到 2027 年底 $15-30 million ARR，主要来自政府和大型企业合同——但星座时间表滑至 2029-2030
              年，中间阶段平台相对商品化 EO 数据的溢价更难维持。估值在 Series C 前后保持在 $1-1.5 billion 附近（Series C 很可能再融资 $100-150 million 用于星座
              capex），对 Series B 投资人意味着持平到温和回报。概率信号：中等（50%），条件是 2026 年 Q3-Q4 前至少出现一些可见商业证明，且投资人对私营 EO
              公司的情绪没有恶化。敏感性分析显示，倍数每从 33x 向 10x 压缩 5x，隐含公允价值约下降 70%；反过来，每增加 $10 million ARR，按适用倍数不同，隐含价值增加约 $150-330
              million。

              熊市情景假设商业进展明显低于预期：到 2026 年底只签下一到三个付费合同，星座滑至 2031 年或被重组，私营 space-tech 资本市场收紧。在这一情景下，Xoople 很可能寻求桥轮或 Series
              C，估值持平或下降至 $600-800 million，对 Series B 投资人造成实质稀释。Satellogic 轨迹是直接警示类比：2021 年以约 $850 million 估值 SPAC
              上市，此后累计亏损，收入规模化长期困难。概率信号：中等（25%），尤其是在 2026 年 Q3-Q4 商业数据仍未出现在公开文件和新闻稿中的情况下。
