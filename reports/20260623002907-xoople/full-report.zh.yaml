      - number: '4.3'
        title: 成本结构、毛利驱动因素与资本强度
        blocks:
          - type: paragraph
            body: >-
              Xoople 目前仍处于自有星座之前，成本结构主要由几块构成：云基础设施成本（EarthAI 处理层使用的 Azure 计算和存储）、接入第三方及政府 EO 数据的数据许可费、工程与研发人员，以及 Tres
              Cantos 总部的固定开销（4,000 平方米，目标直接岗位 300+）。一旦公司切入自有星座，卫星 capex 会成为最主要的资本项目：与 L3Harris
              的联合开发协议涉及光学传感器设计和制造，这是航天硬件里最昂贵的类别之一。Planet Labs FY2026（截至 2026 年 1 月 31 日的财年）收入 $307.7 million，收入成本 $135.2
              million，对应毛利率约 56%；在采用一对多交付模式、已经规模化的 EO 数据订阅业务中，这是目前最好的可比对象。星座前阶段的 EO 平台卫星负担更轻，短期毛利率可能更高，但来自第三方 EO
              供应商的数据许可费可能显著挤压毛利。BlackSky FY2025 10-K 提到，四个客户贡献了总收入的 89%，凸显极端客户集中风险，以及政府收入占比较高的危险。Satellogic FY2023 20-F
              显示，公司在 SPAC 上市多年后仍难以证明收入可规模化增长。Xoople 尚未披露任何毛利率或收入成本信息。从当前平台阶段（中等 capex）走向星座阶段（极高 capex），Xoople 需要持续注资；星座
              capex 的时间点和金额都没有公开。
