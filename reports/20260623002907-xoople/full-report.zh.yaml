  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Xoople 把自己放在其所谓 EarthAI 基础设施内部：一个实时、可供 AI 使用的数据层，为企业 AI
              系统提供经过验证的地表物理变化真相。这一品类位于上游卫星观测环节（传感器、星座、地面站）和下游企业软件栈（ERP、供应链平台、风险系统）之间。公司自己的公开假设称，大多数企业 AI
              模型只利用语言智能，缺乏对物理世界的直接感知，于是形成了现有 LLM 提供商都没有填补的基础数据缺口。因此，Xoople 市场所纳入的支出集中在校准后的地球数据产品、变化检测
              API、运营监测订阅，以及交付到企业和政府决策工作流中的 AI-ready 分析——不是原始影像像素，不是 GNSS 导航数据，也不是卫星制造或发射服务。


              更广义的地球观测下游市场，也就是 Xoople 在讲规模时引导分析师关注的市场，覆盖更宽的产品范围：处理后的影像、风险图层、仪表盘、地理空间告警、行业专用分析和决策支持工具。EUSPA 2024 年框架明确将
              EO 定义为商业信息市场，而非卫星产业，并指出终端客户往往从不查看原始卫星场景。农作物生产者购买植被压力告警；保险公司购买洪水暴露模型；港口运营商使用监测仪表盘。这种分层商业结构界定了对 Xoople
              真正重要的细分边界。


              现状替代方案包括：人工实地调查和地面监测网络（成本高、频率低）；Esri ArcGIS、Google Earth Engine 等企业 GIS 平台，它们提供历史和静态地理空间图层，但缺少连续、可供 AI
              使用的变化信号；以及原始影像提供商（Planet、Satellogic、BlackSky、Airbus OneAtlas、Vantor），它们提供像素，但要求买方自行搭建分析栈。Xoople 正在建设的
              EarthAI 基础设施层尚无商业规模上的直接可比对象；最接近的参照是 Google Earth Engine 的商业层和 Microsoft Planetary Computer
              Pro，但二者是平台工具，而不是可插入企业 AI 的上下文馈送。
