      - number: '5.3'
        title: 部署、集成与客户工作流交付
        blocks:
          - type: paragraph
            body: >
              Xoople 通过与企业平台集成交付 Earth intelligence，而这些平台本身就是采购决策发生的地方。供应链用例页面明确将 Microsoft Power BI 作为交付环境：「把 Xoople 的
              Earth 数据流与 Power BI 内部数据源结合后，企业终于能看到全貌。」借助这项集成，公司可以在既有工具里，把环境智能与需求预测、运营指标和财务数据合并。关键基础设施用例描述了 Xoople 如何与
              Alaska Department of Transportation and Public Facilities（DoT）合作，监测 Juneau icefield 附近道路状况，把卫星变化检测与 AI
              结合，在洪水风险和道路关闭发生前做预测。公司自己的叙述称，「过去需要数天分析的事，现在几分钟就能完成。」

              Xoople 正把 Alaska DoT 的部署从 Juneau 扩展到全州监测。与 BBC StoryWorks Commercial Productions 共同制作的 Living Legacy
              影片，以叙事方式记录 Juneau 用例，确认该部署已经上线。SpaceNews 确认，Xoople 系统把自身数据与包括 Microsoft Planetary Computer Pro
              在内的云基础设施结合；Planetary Computer Pro 是 Microsoft 将 AI 驱动的地理空间洞察带入分析工作流的环境。TNW 独立把 Microsoft 关系描述为结构性的：Xoople
              平台运行在 Azure 上，并与 Planetary Computer Pro 集成，Esri 则作为分发伙伴。

              Google Earth Engine 提供了一个横向参照：规模化 AI-ready EO 开发者平台是什么样子——80+ petabytes 数据、公开 Python 和 JavaScript
              API，并有科学家、研究人员和企业开发者使用的文档记录。Planet Labs 的 Data API 展示了商业 EO 平台已经标准化的 REST API 模式：搜索、任务、下单、下载。Xoople
              尚未发布同等开发者材料，这限制了第三方开发者评估、原型验证或独立验证平台的能力。EY 合作是目前最详细的独立技术证据，但它仍是伙伴关系驱动的案例研究，而非保持距离的技术评估。
