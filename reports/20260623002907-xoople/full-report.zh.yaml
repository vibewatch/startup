              - CE034
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群体划分：垂直领域、买方与用例
        blocks:
          - type: paragraph
            body: >
              Xoople 面向公共部门和大型商业企业的多垂直客户群，产品定位是 Earth 数据基础设施层，而不是垂直应用。公司官方 Series B 公告列出 private-preview
              客户已经活跃的五类用例：供应链优化与基础设施监测；农业预测与资源规划；保险风险建模与灾害响应；城市规划与基础设施韧性；以及情景规划和预测。Xoople 在 enterprise-AI
              博客中把买方具体定义为「关键行业」里面对「不确定性上升和信号过载」的组织——主要决策者指向供应链管理者、基础设施运营方、保险公司和政府机构。2025 年 12 月总部公告进一步给出细节，把交通、金融服务和农业列为
              Early Access Program 启动时的三个优先垂直领域。

              地理上，最具体的公开部署证据集中在美国（Alaska DoT）；同时，公司注册总部在西班牙，欧洲投资人基础包括 Nazca Capital、MCH、CDTI，再加上 Esri/Microsoft
              分发伙伴关系，说明它有意覆盖北美和欧洲政府采购市场。Early Access Program 更像手工筛选的全球客户入口，而不是公开市场销售，这也符合 Series B 材料反复使用的「private
              preview」表述。

              买方、用户和付款方的拆分因细分市场而异。政府场景中，采购主体是公共机构，用户是现场运营和规划人员，付款方是公共预算。企业供应链和保险场景中，买方通常是 Fortune 500
              内部采购或创新团队，用户是分析或风险团队，价格则通过 SaaS 或数据订阅合同实现。截至 2026 年 6 月，任何定价模型或合同结构都未公开披露。

              EY LLP 更像结构性伙伴，而不是标准客户：EY 自己的案例研究确认双方多年合作，EY 与 Xoople 共同开发 go-to-market playbooks，验证数据质量，并向 EY 客户群共同销售——EY
              的角色是渠道伙伴和验证方，而非数据产品的直接购买者。
            claimRefs:
              - CU001
