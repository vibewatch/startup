      - number: '7.3'
        title: 伙伴与依赖风险：L3Harris、分发平台与政府利益相关方
        blocks:
          - type: paragraph
            body: >-
              Xoople 的价值链有三个结构性单点故障，任意一个都可能单独削弱投资逻辑。第一，L3Harris 是已披露的唯一专有星座成像载荷供应商；双方关系被描述为「独家长期共同开发」，但未披露备份方案或第二供应来源。只要
              L3Harris 出现交付延迟、价格重谈、出口许可复杂化，或战略转向，Xoople 的专有数据差异化就可能被无限期推迟，甚至消失。L3Harris 是美国大型国防主承包商（市值约 $30–40B），Xoople
              在其客户关系中体量很小，双方激励结构天然不对称。

              第二，Xoople 的分销网络（Microsoft、Esri、Databricks）形成了 Xoople 无法控制的合作依赖。Microsoft 已宣布 Azure Planetary Computer 将在
              2025 年进入生命周期终止过渡，转向付费服务 Planetary Computer Pro，说明基于 Microsoft 的 EO 基础设施平台条款可由 Microsoft 自行改变。Esri 的合作伙伴生态有
              5,000 多家注册伙伴，优先展示并无保证。Databricks 同样管理庞大合作伙伴生态，Xoople 未披露任何排他性。

              第三，政府利益相关方风险分成两条线。收入端，Alaska DoT 是唯一具名生产客户；一旦失去该客户，Xoople 就失去唯一可被公开验证的部署证明。资金端，CDTI Innovación 的 €16.74
              million 拨款，以及西班牙政府将 Xoople
              指定为「战略企业」，构成双边承诺；这总体利好，但也意味着围绕就业创造和西班牙技术主权的条件、监督预期和政治敏感性。若未谈妥解除安排，这些义务可能限制某些战略选项（例如将总部迁至西班牙以外，或接受美国买方收购）。TerraWatch
              Space 指出，商业 EO 公司面对的是「政府持续主导」的买方格局，私人企业收入更难放大——这一结构性风险直接适用于 Xoople 当前的客户组合。
