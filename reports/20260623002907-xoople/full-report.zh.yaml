      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              地球观测市场的买方基础高度异质：下单采购数据的人（买方）、分析数据的人（用户）和支付预算的组织单元（付款方）常常不是同一个。这种碎片化长期拖慢企业采用：EO 数据采购路径需要大多数业务单元不具备的专业知识，EO
              供应商也往往通过地理空间专家销售，而不是通过 CIO 或 CDO。


              对 Xoople 来说，目标买方画像是已经部署 AI 系统、并意识到系统缺少可靠物理世界上下文的企业 AI 平台团队或高级运营高管（CPO、CDO 或 CTO）。用户通常是 AI
              工程师、数据科学家或运营分析师。付款方通常是业务单元预算负责人，而不是 GIS 部门。这一定位有意绕开传统 EO 采购路径，转而接入快速增长的企业 AI 预算。


              现有证据显示六大买方细分。国防和情报买方（以 Vantor/Maxar 的 60+ 政府伙伴和 BlackSky 的战术 ISR 任务为代表）贡献最大的存量支出，但 Xoople
              官方材料没有描述机密任务或以国防为主的 go-to-market。民用政府买方——城市规划者、应急管理机构、土地使用监管者——依赖 Copernicus 和 ESA
              开放数据，并补充商业分析。企业供应链和物流买方需要港口活动、商品流和中断信号。金融和保险买方（EUSPA
              增长最快的子细分）需要气候风险评分、灾害事件验证和资产暴露映射。关键基础设施运营商（公用事业、能源、管道）需要环境合规监测和资产状态情报。农业企业需要作物健康、产量预测和补贴审计证据。


              Xoople 宣布的私测客户包括政府机构和 Fortune 500 公司，覆盖供应链、基础设施、农业、保险和城市规划。Planet 的买方页面列出农业、国防 / 情报、政府、科学、能源 /
              基础设施、金融、海事和可持续性等活跃市场细分，证实多垂直需求广泛存在。ICEYE 明确将保险、政府、银行和公用事业 / 能源列为其 SAR 产品的主要买方细分。这些竞争买方地图的共同点是：没有单一细分主导商业
              EO，多垂直覆盖是常态而非例外。
