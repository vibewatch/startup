  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业化启动时的收入模式与商业状态
        blocks:
          - type: paragraph
            body: >-
              Xoople 在七年隐身开发后，于 2026 年 Q2 正式开始商业化，从 Early Access Program 过渡到全面市场可用。公司自述收入模式是生态嵌入策略：Xoople
              不直接向终端用户销售数据，而是把 EarthAI 数据层放进目标客户已经使用的企业平台——Microsoft Fabric 和 Power BI、Esri
              ArcGIS、Databricks——让买方能在现有工作流中获取连续地表情报。CEO Fabrizio Pirondini 向 TechCrunch
              确认，该模式以把数据和解决方案嵌入企业合作伙伴生态为核心，使这些伙伴能够直接向其客户提供服务。这意味着，Xoople 的主要收入流预计是通过生态伙伴访问的企业数据订阅、面向政府机构和 Fortune 500
              客户的直接地球情报服务商业合同，以及潜在按使用量计费或 API 授权费用。次要收入流——卫星服务——尚未启动，因为 Xoople 自有星座仍处于与 L3Harris
              共同设计传感器的阶段。在该星座投入运营前，平台处理并分发来自政府航天器（包括 ESA Sentinel-2）和第三方 EO
              提供商的数据。公司没有公开披露收入、ARR、订阅额或具体客户合同金额。私测客户群中出现政府机构和未具名 Fortune 500 公司，确认了销售意图；但截至
              runDate，从预览转向付费经常性合同尚未被公开验证。
