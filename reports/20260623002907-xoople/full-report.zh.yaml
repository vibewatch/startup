  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与品类地图
        blocks:
          - type: paragraph
            body: >-
              Xoople 进入的市场，在数据供给层高度碎片化，同时正围绕少数企业分销守门人集中。TerraWatch 对商业 EO
              演进的分析识别出前三波：横向影像先行者（Planet、Satellogic、BlackSky）、垂直领域专家（GHGSat、OroraTech），以及向后整合的分析公司（Tomorrow.io、EarthDaily）。Xoople
              可能代表第四波：AI 原生数据基础设施公司，跳过纯影像销售，把地球数据定位为企业 AI 系统的连续上下文馈送。这一定位让 Xoople 同时与五类竞争者交锋。


              第一类是直接影像同行：Planet、BlackSky 和 Satellogic 都运营自有星座，并越来越多销售叠加其上的分析，正在逼近 Xoople 声称的价值主张。既有地理空间帝国——Airbus
              Defence & Space 和 Vantor（原 Maxar）——凭借几十年的客户关系和自有传感资产，主导高分辨率与政府 GEOINT 细分。相邻 SAR 专家 ICEYE 和 Capella Space
              提供全天候、昼夜覆盖，这是仅光学平台（包括 Xoople 规划中的星座）无法复制的能力。企业分销平台——主要是 Google Earth Engine（分析）和 Esri ArcGIS（GIS
              工作流）——既是替代品，也可能是分销渠道。最后，多数企业 AI 团队今天的现状替代方案，是 Copernicus 开放数据、内部分析工程师和静态 GIS 底图的组合；它无需新增预算，却只能提供 Xoople
              明确瞄准的那种不完整物理世界 grounding。


              Xoople 最特有的竞争风险在于，当前平台依赖第三方和开放卫星数据；在其自有 L3Harris 星座入轨前，任何资金充足的竞争者都可以获得等价数据。下表按规模、目标细分和声称差异化，对各竞争类别做映射。
