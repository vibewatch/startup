      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: 星座部署前，数据护城河缺席
            body: >-
              Xoople 当前数据层建立在第三方和政府开放数据集上（包括 ESA Sentinel-2），Planet、BlackSky、Airbus 以及任何资金充足的分析团队都能同等获取。规划中的 L3Harris
              星座是建立自有数据排他性的唯一机制，但其卫星数量、技术规格和发射日期未公开披露。在星座投入运营前，Xoople
              的竞争差异化依赖模型质量、生态集成和品牌——这些都不构成耐久数据护城河。这是任何评估“物理世界记录系统”假设的投资人最重要的尽调事项。
            calloutType: risk
            claimRefs:
              - CP031
              - CP032
              - CP035
          - type: callout
            title: Planet Planetary Variables 和 Google Earth AI 是可信的类比威胁
            body: >-
              Planet 的 Planetary Variables 产品线以 AI 可摄取格式交付持续更新、经过科学校准的地球测量结果（土壤湿度、生物量、地表温度），是现有商业市场中最接近 Xoople EarthAI
              层的类比。Google 的 Earth AI 计划把大规模 AI 用于全球地理空间数据，并让物理世界信息可通过先进模型查询，市场叙事与 Xoople 几乎相同。二者的商业化进度都比 Xoople 2026 年
              Q2 启动更靠前，并且都由自有数据资产支撑（Planet 的星座；Google 的 PB 级档案）。不应把 Xoople 评估为 AI-ready 地理空间数据的先发者；它进入的是一场已经开始的竞赛。
            calloutType: risk
            claimRefs:
              - CP007
              - CP023
              - CP030
          - type: callout
            title: Esri 和 Microsoft 带来分销杠杆，但没有数据排他性
            body: >-
              Xoople 已确认与 Microsoft（Planetary Computer Pro、Fabric、Azure）和 Esri（ArcGIS 工作流）集成，能把分销有效延伸到企业 AI 和 GIS
              团队；否则公司需要多年销售努力才能触达这些客户。这一分销护城河是公司当前最可防守的资产。关键未知在于，这些集成是否包含任何排他条款，阻止 Airbus、Planet
              或其他数据提供商获得同等位置。没有排他性时，分销优势会退化为先发渠道位置——有价值，但可被资本更充足的竞争者在 12–24 个月内复制。
            calloutType: insight
            claimRefs:
