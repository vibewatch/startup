      - number: '1.4'
        title: 商业化路径与分销优先模式
        blocks:
          - type: paragraph
            body: >-
              Xoople 的 go-to-market 顺序对一家空间基础设施公司来说并不常见：它先商业化软件和集成层，再发射自有传感器。官方 Series B 新闻稿称，公司在七年开发后于 2026 年 Q2
              开始商业化，私测客户已经包括政府机构和 Fortune 500 公司。同一新闻稿及相关产品页列出具体企业工作流：供应链优化、基础设施监测、农业预测、保险风险建模、灾害响应和城市规划。TechCrunch 和
              TNW 补充了关键战略细节：当前平台围绕政府和第三方数据集构建，包括 ESA Sentinel-2；Xoople 将输出嵌入 Microsoft、Esri
              等生态，而不是等待自有卫星上线。分销优先的设计缩短了上市时间，也让 Xoople
              在承担完整自有空间段运营负担之前，先测试企业需求。反过来，当前牵引力反映的是数据集成和工作流价值，而不是完整垂直一体化星座已经跑通的经济性。
