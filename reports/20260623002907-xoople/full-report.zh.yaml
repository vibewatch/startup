      - number: '2.5'
        title: 规模测算缺口、矛盾证据与尽调问题
        blocks:
          - type: paragraph
            body: >-
              本市场分析中最关键的缺口，是 Xoople 或任何分析机构都没有发布针对 AI-ready EarthAI 数据基础设施这一特定品类的 SAM 或 SOM 估算。已审阅的每一项市场估算，要么覆盖更宽泛的 EO
              生态（Fortune、Grand View、EUSPA），要么覆盖被付费墙挡住的地理空间情报市场（MarketsandMarkets、TerraWatch）。没有一项单独拆出企业 AI 支出中专门用于物理世界
              grounding 的部分。该缺失显著限制了用一个连贯收入机会来承销 $225 million 资本化水平的能力。


              第二个缺口，是 Xoople 当前商业牵引力究竟来自政府买方还是企业买方。私测客户群同时包括政府机构和 Fortune 500
              公司，但收入拆分、合同规模或续约证据均未公开。政府买方可靠，但采购路径更慢、更复杂；企业买方销售周期更快，但 EO 数据对多数 AI 团队来说仍然新颖，采用摩擦更高。


              三组相互矛盾的市场估算——Fortune（2025 年 $7.04B）、Grand View（2024 年 $5.10B）、EUSPA（2023 年
              €3.4B）——无法在缺少分析师口径定义的情况下调和，而现有文本都没有充分披露这些定义。本报告将其保留为重大冲突，而不是抹平。对估值的实际影响是，Xoople 投资人几乎可以同等合理地引用其中任何一个数字作为
              headline TAM，市场规模故事很容易搭建，却很难验证。任何尽调对话都应先锚定 SAM 问题：EUSPA €3.4B 服务栈中，有多少真正是 AI 基础设施支出，又有多少是传统分析？
