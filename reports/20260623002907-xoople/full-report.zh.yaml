        - id: concentration-risk
          label: 集中度风险（反向节点）
          description: 唯一具名生产部署（Alaska DoT）带来客户集中度风险。没有具名企业客户；未披露 NRR 或流失率；私有预览管线完全不透明。机构信任门槛是突破政府以外规模化的主要瓶颈。
