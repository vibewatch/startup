  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: EarthAI 产品定义与当前数据层
        blocks:
          - type: paragraph
            body: >
              Xoople 的商业产品是 EarthAI：一个持续测量、AI-ready 的地球数据层，自称「Earth's System of Record」。它不是传统卫星影像服务，而是结构化智能基础设施。公司 about
              页面称，平台把「原始卫星图像，细到每个像素，转化为可行动智能」，让组织持续、可验证地看见地表物理变化。EarthAI 不是向人工分析师交付某个时点的图像，而是生成结构化、时间序列数据流，供 AI
              和机器学习模型直接接入。i-scoop 分析称 EarthAI 是「端到端 Earth intelligence 平台」：从卫星来源收集地表数据，处理成标准化 AI-ready
              数据集，并支持查询，用于变化检测、风险预测、环境监测和基础设施评估。

              目前的数据供应主要依赖公开可用的卫星来源，包括 ESA Copernicus Sentinel-2 星座；该星座提供 10 米分辨率光学影像，全球重访周期为 5 天。Xoople 的 enterprise-AI
              博客称，公司提供「为 AI 打造的 Earth 数据基础设施层」；Series B
              新闻稿称，平台将「产出最精确、可靠、科学级的数据集」。公司称当前数据量为「petabytes」，目标路径是迈向「exabytes」。Series B 公告确认的 private preview
              客户包括政府机构，以及供应链、基础设施、农业、保险和城市规划等垂直领域的 Fortune 500 公司。确切客户数量尚未公开。

              Xoople 的差异化策略很明确：先做数据质量和集成，硬件其次。CEO Fabrizio Pirondini 在 BusinessWire 新闻稿中称，公司在「为物理世界构建记录系统」——类似 CRM
              之于客户数据、云平台之于软件数据。TechCrunch 独立指出，这一战略顺序并不常见：Xoople 先把平台嵌入 Microsoft 和 Esri，再建设自有卫星供应，反转了 EO
              行业通常「先硬件、后分发」的打法。
