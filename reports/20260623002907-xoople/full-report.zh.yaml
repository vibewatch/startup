      - number: '7.4'
        title: 人员与执行风险：关键人物集中和治理不透明
        blocks:
          - type: paragraph
            body: >-
              Series B 之后，Xoople 围绕两位创始人显著加厚了领导层，引入 Jamie Ritchie 担任 Chief Business Officer、Massimiliano Vitale 担任 Chief
              Operating Officer、Jeff Rath 担任 EVP Finance and Strategy、Chris Hoeschen 担任 Chief Legal
              Officer。这套班底补上了最显眼的规模化短板。不过，公司仍保留典型的创始人中心风险：CEO Fabrizio Pirondini 是每一项重大关系（L3Harris、投资人沟通、媒体）的公开面孔，CFO
              Alvaro Coronado 也共同签署了最初融资材料。OfficialBoard 的 Xoople
              组织画像没有列出任何独立董事，也没有公开任何治理结构——股东协议、董事会委员会章程或股权计划披露均缺位。Elreferente.es 确认 Xoople 在 2026 年 4 月入选
              Endeavor，这是声誉背书，但不能替代结构性治理。

              执行风险在两个维度尤其尖锐。第一，公司要从运营了七年的 R&D 组织，切换成追求商业速度的公司。Pirondini 和 Coronado 都有 Deimos Imaging 的深厚 EO 任务经验，但企业
              SaaS 增长是另一套打法：客户成功、规模化合同谈判、专业服务、分析师关系。两位创始人都没有在高速度环境中跑过这套体系。第二，技术上要从依赖 Copernicus
              数据的平台，过渡到专有星座：新传感硬件集成、在轨运营、地面段管理，与商业分销放大同步推进，这是一个多战线、极高要求的执行挑战。没有公开的员工人数或组织结构文件可用于判断 Xoople
              是否具备完成这次转型所需的深度。
