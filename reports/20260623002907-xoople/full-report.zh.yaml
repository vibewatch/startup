      - number: '6.3'
        title: 采用轨迹与 go-to-market 入口
        blocks:
          - type: paragraph
            body: >
              理解 Xoople 的采用轨迹，必须放回其商业化时间线：公司从 2019 年到 2025 年 5 月处于隐身状态，2025 年 12 月推出 Early Access Program，2026 年 4 月在宣布
              Series B 的同时宣布正式商业化。因此，2026 年 6 月的客户基础仍处在软件部署周期最早阶段。

              最强采用信号是 Alaska DoT 部署：它已从概念验证推进到覆盖 Juneau icefield 的生产监测合作，并有公开计划扩展到全州覆盖。EY 案例研究覆盖从初始合作到 Series B
              阶段的多年时间，确认 Xoople 数据经历了「广泛测试和赋能」，并在供应链、基础设施和保险用例中得到验证——这说明企业客户的技术 onboarding 周期并不轻，且可能跨多年。

              公司的 go-to-market 模式是分发优先：Xoople 把数据层集成到 Microsoft Power BI、Esri ArcGIS 和
              Databricks，而不是自建独立门户。这个方法降低了这些平台既有企业客户的采用阻力，但也让独立衡量 Xoople 专属使用量变得困难。CEO Pirondini 向 TechCrunch
              解释该模式：「我们的商业模式就是把我们的数据和解决方案直接嵌入这些生态系统，让它们能够把这些服务直接提供给自己的客户。」Streamly 专家档案确认，Pirondini 是 Co-founder and
              CEO，负责管理这一分发 thesis。

              TerraWatch Space CEO Aravind Ravichandran 告诉
              TechCrunch，分发优先策略「intriguing」，但也指出了结构性张力：「他们在拥有自有数据供应之前就铺好了分发管道——嵌入 Microsoft 和 Esri，也就是企业、政府和多数 GIS
              买家已经所在的两个平台，但两者都没有自有 EO 数据。Google 在地理空间 AI 模型上的先发优势，将成为他们被衡量的基准。」这段分析同时凸显机会（嵌入式分发）和限制（private-preview
              窗口期没有自有数据差异化）。

              总客户数、平均合同金额、成交周期和 pipeline 指标均未披露。CDTI Innovación €16.74 million 资助验证了研发项目，但不提供客户数据。公司没有公开任何收入数字。
