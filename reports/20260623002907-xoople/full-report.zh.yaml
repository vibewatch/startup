      - number: '8.5'
        title: 最终尽调问题与打破逻辑的触发项
        blocks:
          - type: paragraph
            body: >-
              最重要的尽调要求是一套管理层 KPI 包，覆盖：2026 年 Q2-Q4 已签合同的总签约
              ARR、客户数量和行业拆分、平均合同价值和期限、早期合同毛利率、月度现金消耗和资金可支撑时间预测，以及带日期的星座部署里程碑计划。仅这一包材料，就足以在一个尽调周期内把跟踪建议推向更明确的任一方向。次级要求包括完整股权结构表、优先权结构和清算瀑布，覆盖
              L3Harris 光学载荷 ITAR 的技术援助协议或出口授权，以及至少两个付费客户的独立验证推荐。

              打破逻辑的触发项界定了跟踪判断在无需进一步尽调时转为避免的条件。最严重的触发项是确认降价融资：任何低于 Series B 隐含标记估值的 Series
              C，都会发出商业表现不足和优先权结构悬顶的信号。第二个触发项是失去 Microsoft 或 Esri 分销渠道，这将迫使 Xoople
              以显著更高成本、更慢速度重建直销基础设施。第三个触发项是宣布星座延迟、首次成像落到 2030 年之后，因为 Xoople 相对商品化 ESA Sentinel-2
              数据的竞争差异化，关键取决于专有传感。第四个触发项是任何与 L3Harris 载荷有关的公开监管执法行动或 ITAR / 出口管制处罚，这会冻结开发，并可能要求重组合作关系。最后，首次年度收入申报前 CEO 或
              CFO 离职，也会在公开材料呈现的创始人中心治理结构下显著抬高执行风险。未来十二个月跟踪这些触发项不需要私人信息：五项都可从新闻稿、监管文件、生态合作伙伴公告和政府采购数据库中发现。
