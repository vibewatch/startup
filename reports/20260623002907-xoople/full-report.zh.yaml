      - number: '3.3'
        title: 既有巨头与相邻 SAR 专家
        blocks:
          - type: paragraph
            body: >-
              Airbus Defence and Space 和 Vantor（原 Maxar Technologies）处于既有巨头层级，政府和企业关系深度嵌入，既构成最高转换成本壁垒，也带来对 Xoople
              最危险的潜在收购方风险。


              Airbus Defence and Space 是全球历史最悠久的商业 EO 提供商之一，通过 OneAtlas 平台提供地理空间数据产品，背后由 Pléiades Neo 30 cm 光学星座和传统 SPOT
              档案支撑。其客户证言包括法国国防部、法国海关和 NATO AGS 运营，体现 Airbus 在国防和政府市场拥有 40+ 年关系和认证安全姿态。Airbus
              将其产品描述为实现“来自太空的信息优势”，并同时销售给高端国防情报和商业资产监测市场。Xoople 的企业 AI 数据层叙事尚未与 Airbus 成熟政府情报产品直接重叠，但 Airbus
              的品牌可信度和卫星访问能力，让它可以选择自建或收购 AI 数据层。Airbus 还是 UP42 的母公司；UP42 是 EO 数据市场，聚合包括 Airbus
              自身在内的多家供应商影像，对任何影像相邻数据供应商都会形成价格透明度风险。


              Vantor（原 Maxar）运营美国市场商业主导地位最强的地理空间情报平台。按其公开指标，Vantor 支撑美国政府使用的约 90% 基础地理空间情报，并支持全球 60+ 政府伙伴。其 WorldView
              星座每天采集约 7 million sq km 影像，其中 3.5 million sq km 为 30 cm 分辨率，并可为优先目标提供最多 15 次每日重访机会。Vantor
              商业地位的国家安全深度意味着它不是 Xoople 商业企业动作中的主要竞争者，但 Xoople 瞄准的任何政府买方都会拿 Vantor 的历史业绩作对照。


              ICEYE 和 Capella Space 构成相邻 SAR 专家威胁。ICEYE 自 2018 年以来发射 70+ 颗 SAR 卫星，提供亚日级全球重访，分辨率最高达 25
              cm，服务保险、政府、银行和公用事业。Capella Space 提供 0.25 m SAR 分辨率、每天 2–15 次重访机会，以及具备 15 分钟调度周期的全自动 TCPED 平台。SAR
              具备全天候、昼夜能力——这是仅光学星座的关键缺口，包括 Xoople 规划中的 L3Harris 系统；该系统看起来主要是光学。对需要在多云或敌对环境中持续监测基础设施的企业买方，ICEYE 或 Capella
              提供的能力，是 Xoople 当前和规划中的数据层在没有 SAR 融合伙伴时无法匹配的。
