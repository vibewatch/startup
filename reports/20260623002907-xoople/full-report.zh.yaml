  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险：GDPR、许可、出口管制与军民两用
        blocks:
          - type: paragraph
            body: >-
              Xoople 的核心法律实体是 Xoople S.L.（CIF B-88282090），注册地址为 Calle San Germán 13, Madrid 28020
              Spain。作为设立在欧盟的数据控制者，它受西班牙商法和 GDPR 约束。公司公开隐私政策明确承认 GDPR 义务，记录个人数据处理的六项法律基础，并列出与 EU Whistleblowing Directive
              一致的 whistleblower policy——说明公司具备运转中的合规姿态。通过 BORME 访问的 Spanish Mercantile Registry 数据确认该实体处于 active 状态；截至
              2026 年 6 月运行日期，公开记录中没有发现破产、解散或清算通知。

              OECD 2026 年 2 月政策简报记录，截至 2024 年，只有少数国家（Canada、France、Germany、Japan、United States）已有明确的商业遥感数据监管，EU
              没有直接对应制度，因此许可环境呈拼图状。Xoople 卫星星座发射时，除 ITU 频率协调和 ICAO 发射安全通知外，还需要在 EU Space Law（建立 EU Space Programme 的
              Regulation 2021/696）下获得西班牙监管机构的商业遥感授权。公司没有公开披露许可状态。

              最重要且尚未处理的监管风险，来自 L3Harris 关系带来的军民两用和出口管制暴露。L3Harris 是美国国防主承包商，其成像载荷在 Rochester, New York
              开发，受美国管辖。此类先进光学传感系统通常涉及 International Traffic in Arms Regulations（ITAR）或 Export Administration
              Regulations（EAR），向非美国实体出口或再出口时，需要美国 State Department 或 Commerce Department 授权。Xoople 没有在公开材料中披露任何 ITAR
              Technical Assistance Agreement（TAA）、许可例外或出口授权。The Space Review 对商业遥感监管的分析确认，Wassenaar Arrangement
              对卫星技术施加出口管制，但各司法辖区执行并不一致。

              最后，Xoople 的 EarthAI 平台收集并处理物理世界变化数据，其中可能包含关于群体、基础设施和军事活动的敏感信息——这正是 OECD 指出的会带来隐私和国家安全监管挑战的军民两用类别。EU AI
              Act（Regulation 2024/1689）开始适用于高风险 AI 系统后，如果 Xoople 的 agentic AI 输出用于关键基础设施或公共部门决策场景，公司可能需要进行合格评定。
