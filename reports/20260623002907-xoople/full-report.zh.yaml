  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 Xoople 的影响
      - 尽调问题
    rows:
      - - 企业 AI 部署浪潮（LLM 采用）
        - 驱动因素
        - 现在–2027
        - AI 系统会系统性需要物理世界锚定数据；这是 Xoople 核心的市场创造假设
        - 有多少 Fortune 500 AI 项目把物理世界数据缺口列为阻碍？
      - - ESG 与气候报告强制要求（CSRD、TCFD、SEC）
        - 驱动因素
        - 现在–2028
        - 合规需要卫星支撑的排放和土地使用数据；由此产生非自由裁量预算
        - Xoople 的输出是否符合 CSRD / TCFD / SEC 气候披露要求？
      - - 卫星增多与数据成本下降
        - 驱动因素
        - 持续
        - Xoople 平台可用的原始输入供给扩大；纯影像利润率也会受压，分析层反而受益
        - 卫星供给增长后，Xoople 如何确保数据差异化？
      - - 企业平台集成（Microsoft / Esri / Databricks）
        - 驱动因素
        - 现在
        - ArcGIS 和 Fabric 集成降低采用摩擦；非 GIS 企业团队也能使用空间分析
        - Microsoft 和 Esri 渠道贡献了多少收入和 GMV；商业条款结构如何？
      - - EO 监测从一次性项目转向订阅
        - 驱动因素
        - 2024–2030
        - 气候、供应链和金融里的常设监测需求会锁定经常性合同
        - Xoople 的合同结构是什么：年度订阅、按使用量计费，还是项目制？
      - - 商业 EO 影像供给过剩
        - 约束
        - 2026+
        - 原始影像利润率承压会降低数据获取门槛，但也要求 Xoople 守住决策级定价溢价
        - Xoople 的定价模型是否区别于大宗影像；基准是分析层而不是原始数据吗？
      - - 企业 AI 数据信任与可解释性缺口
        - 约束
        - 现在
        - 买方把高风险决策交给 AI 输出之前，需要可解释性和可审计性；OECD 指出 EO 中存在不可解释的 AI 方法
        - Xoople 是否为 EarthAI 输出发布了可解释性或可审计性框架？
      - - 监管与出口管制摩擦
        - 约束
        - 持续
        - 国际数据共享限制（美国、中国、EU）拖慢跨境部署；影响跨国企业客户
        - Xoople 持有哪些出口许可证？哪些地区受限？
      - - 政府买方集中风险
        - 约束
        - 持续
        - EO 市场里政府占主导，带来采购依赖和长周期；没有政府锚定合同，商业规模仍未验证
        - Xoople 的管线中，政府与商业企业各占多少？
      - - 自有星座的资本强度
        - 约束
        - 2026–2029
        - L3Harris 星座需要大量资本开支；若延迟，可能丧失传感器差异化，并拉长首笔收入时间差
        - L3Harris 建造的星座预计何时发射，成本估算是多少？
    notes: 时间标签仅作指示。驱动因素和约束同时生效；本表不代表阶段顺序。
