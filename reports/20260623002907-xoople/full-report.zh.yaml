      - number: '4.4'
        title: 资本充足性、融资历史与 runway
        blocks:
          - type: paragraph
            body: >-
              Xoople 自 2019 年成立以来累计融资约 $225 million。公司概览章节已经梳理完整融资时间线；本节聚焦未来资本充足性。2026 年 4 月的 Series B 融资 $130 million，由
              Nazca Capital 领投，MCH Private Equity、CDTI（西班牙政府）、Buenavista Equity Partners 和 Endeavor Catalyst 跟投。Series B
              之前，Cinco Días 报道称，Xoople 在 2025 年 7 月完成 €22 million 扩展融资，使总额达到约 €137 million；更早之前，公司累计融资约 €115
              million，投资方包括 AXIS/ICO、CDTI、Space Eye、ESRI International、GED Conexo 和 BM Invest Space。CDTI Innovación
              在一个已披露批次中向 Xoople 承诺 €16.74 million。官方沟通称，Series B 资金将用于星座开发和商业化扩张，但没有给出募资用途拆分。月度现金消耗未披露；按同等规模 EO
              公司估算，burn 约为每月 €2.5–6 million（年化 €30–70 million），意味着自 Series B 交割后 runway 约 22–50 个月。除股权融资外，Xoople
              尚未披露任何债务、可转债工具或项目融资义务。对比来看，Planet Labs 在 2025 年 9 月发行 $460 million 可转债（0.50%，2030 年到期），说明完整 EO
              星座业务一旦开建，资本强度会迅速抬升。Xoople 很可能需要在星座部署之前或同步获得更多资本。投资人构成——政府相关资本、PE
              和成长型投资人——说明公司可能同时接入资本市场和公共部门资金渠道，但治理条款和清算优先权堆栈细节并未公开。
