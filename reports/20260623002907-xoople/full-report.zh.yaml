      - number: '4.5'
        title: 财务结论、收入质量与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 Q2，Xoople
              的财务画像是一家资本相对充足、尚未产生收入的基础设施公司，商业化假设还没有经过市场检验。分发优先的模式在战略上说得通：先把数据嵌入生态、再拥有卫星，是降低需求侧风险的理性路径；Microsoft
              Planetary Computer Pro 和 Esri ArcGIS 的覆盖，也让 Xoople 触达最可能为持续 Earth intelligence 付费的企业买家。但公司没有披露任何 traction
              指标——收入、ARR、合同数量，或泛化类别之外的客户名称——因此早期商业合同的财务质量完全不透明。三项主要财务风险是：（1）星座硬件进入制造后资本强度上升；若没有预先定义的下一轮融资触发条件，runway
              会承压；（2）星座前阶段，Xoople 购买并处理第三方 EO 数据，而不是自己生产，数据采购成本会压缩毛利；（3）收入集中，这是早期企业 EO 公司的结构性问题，BlackSky 披露四个客户贡献 89%
              收入就是例证。TerraWatch 对 EO 市场的负面分析指出，Xoople 还没有证明其分发模式最终需要的自有数据供应。公司完全没有私人财务披露，本章更像尽调问题框架，而非财务评估。核心承销要求是管理层提供
              KPI 包，列明已签 pipeline、首批商业合同结构、月度 burn 和星座 capex 计划。
