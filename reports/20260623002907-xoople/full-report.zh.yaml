              开始商业化，但未公开披露收入、ARR、客户数量或合同条款。这对早期私营公司并不异常，却意味着一个核心财务问题无法仅靠公开证据回答：分发优先模式能否把生态存在感转化为可持续订阅合同。连一个具名付费客户或收入区间都没有，会造成信息不对称；任何投资人在承销财务图景之前，都必须通过与管理层沟通来解决。
