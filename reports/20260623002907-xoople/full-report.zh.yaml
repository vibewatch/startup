  - id: FU001
    title: 客户旅程图：各细分市场采用 Xoople EarthAI 的路径
    type: journey-map
    layout: wide
    summary: >
      将 Xoople 三个主要进入细分市场——政府基础设施、企业供应链、受监管行业（保险 / 农业）——从最初识别问题，到私有预览入驻，再到生产部署和扩展的客户旅程串起来。所有细分市场都先汇入 Early Access
      Program 这个主要结构化入口，再分流到各自的部署路径。Alaska DoT 是唯一确认处于生产部署阶段的节点。
    approximationNotes: >
      非 DoT 细分市场的旅程阶段由公司用例材料、EY 案例研究中的工作流描述和 TechCrunch 报道推断。公开渠道没有客户自述旅程数据。生产部署节点仅对 Alaska DoT 确认；截至 2026 年 6
      月，其他所有细分市场仍处于私有预览或更早阶段。
    data:
      nodes:
        - id: problem-recognition
          label: 问题识别
          description: 政府机构、企业或保险公司识别出现实体世界情报缺口——道路风险、供应中断、作物胁迫、风险暴露模型——现有数据或工具无法以足够速度或准确度解决。
          segments:
            - Government / infrastructure
            - Enterprise supply chain
            - Insurance / agriculture
          tone: neutral
        - id: early-access-intake
          label: Early Access Program（私有预览）
          description: >-
            Xoople 仅限邀请的 Early Access Program（2025 年 12 月推出）提供定制化私有预览访问。EY 的客户网络和 Xoople 直接触达是主要获客渠道。Microsoft 和 Esri
            合作背景支撑企业发现。
          segments:
            - Government / infrastructure
            - Enterprise supply chain
            - Insurance / agriculture
          tone: neutral
        - id: technical-onboarding
          label: 技术入驻和数据集成
          description: EarthAI 数据层集成到客户环境（Power BI、ArcGIS、Databricks 或直接 API）。EY 案例研究确认多年技术赋能周期；开放数据格式旨在降低集成成本。
          segments:
