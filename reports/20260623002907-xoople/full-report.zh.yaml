      - number: '1.3'
        title: 资本基础、估值信号与总部规模
        blocks:
          - type: paragraph
            body: >-
              2026 年 4 月融资把 Xoople 从隐身深科技故事推到西班牙全国可见的独角兽候选公司位置。公司官方新闻稿称，2026 年 4 月 6 日完成 $130 million Series B，累计融资达到
              $225 million。TechCrunch 报道该轮由 Nazca Capital 领投，MCH Private Equity、CDTI、Buenavista Equity Partners 和
              Endeavor Catalyst 参投，并引用 CEO Fabrizio Pirondini 的说法称公司如今处在“独角兽区间”，但未披露精确投后估值。Cinco Días 和 Xataka
              的西班牙报道也独立强化了这一解读，将 Xoople 描述为西班牙深科技融资的代表性事件。2025 年 12 月总部公告同样重要，因为它显示 Xoople 在 Series B 前已融资超过 €135
              million，并开始扩张固定基础设施：Tres Cantos 的 4,000 平方米枢纽将承载全球运营，并支持超过 300
              个直接高技能岗位。因此，公开证据支持公司资本充足、拥有国家相关战略背书，但不能支持精确估值、股权结构或清算优先级判断。
