    title: 按收入和倍数情景划分的估值敏感性
    type: bar
    layout: wide
    summary: Xoople 隐含估值（百万美元）在不同收入情景（$10M、$30M、$50M、$100M ARR）和倍数假设（11x、20x、33x P/S）下的敏感性， 展示入场纪律如何同时取决于商业牵引和市场倍数环境。
    data:
      items:
        - label: $10M ARR @ 11x（Spire 下限）
          value: 110
        - label: $10M ARR @ 20x（中档）
          value: 200
        - label: $10M ARR @ 33x（Planet 溢价）
          value: 330
        - label: $30M ARR，11x 倍数
          value: 330
        - label: $30M ARR，20x 倍数
          value: 600
        - label: $30M ARR，33x 倍数（当前隐含）
          value: 990
        - label: $50M ARR，11x 倍数
          value: 550
        - label: $50M ARR，20x 倍数
          value: 1000
        - label: $50M ARR，33x 倍数
          value: 1650
        - label: $100M ARR，11x 倍数
          value: 1100
        - label: $100M ARR，20x 倍数
          value: 2000
        - label: $100M ARR，33x 倍数（乐观）
          value: 3300
    approximationNotes: >-
      所有数值都是示意性的分析师估算；收入代理并非 Xoople 披露数字。当前 $1B 隐含估值可由 $30M ARR 配 33x（Planet Labs 可比）或 $50M ARR 配 20x（中档）支撑，
      但两者都未获确认。倍数区间来自截至 2026 年 6 月 22-23 日的公开 EO 可比公司市值。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV023
  - id: FV003
    title: 按情景划分的估值和回报区间
    type: range
    layout: standard
    summary: 以公开 EO 可比公司倍数和明确收入假设为锚，给出 Xoople 在 2028-2029 年投资周期下的乐观、基准和悲观情景估值区间（百万美元）。
    data:
      items:
        - label: 悲观情景（2028-29）
          low: 150
          high: 400
          note: 到 Q4 2026 有 0-2 个付费合同；ARR <$10M；星座延迟
        - label: 基准情景（2028-29）
          low: 375
          high: 800
          note: $25-40M ARR；星座滑到 2029-30；完成 Series C
        - label: 乐观情景（2028-29）
          low: 1500
          high: 3300
          note: $100M ARR；星座 2028 年发射；采用 15-33x P/S
        - label: 当前隐含入场（~$1B）
          low: 900
          high: 1200
          note: CEO 表述隐含的 Series B 投后区间
    approximationNotes: 区间是基于公开可比倍数的分析师估算，不是财务预测。Series B 隐含入场区间依据 CEO 关于独角兽区间的公开表述；确切投后估值未披露。Series B 投资人的回报取决于持股比例、 优先权堆栈和未来轮次稀释，三者均未披露。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV036
  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的 Xoople 评分，覆盖八个估值维度，采用 0-10 分制，反映截至 2026 年 6 月的证据质量和相对强度。
    data:
      items:
        - label: 市场机会
          value: 8
          max: 10
          note: EUSPA 确认 EO 市场从 €3.5B 增至 €7.9B；AI 需求拐点可信
        - label: 产品与证明
          value: 3
          max: 10
          note: 优先分发模式合理，但未确认付费合同；尚未产生收入
        - label: 竞争护城河
          value: 5
          max: 10
          note: 生态嵌入是真优势；自有数据护城河要等星座落地
        - label: 经济性与财务
          value: 2
          max: 10
          note: 收入、ARR、利润率、烧钱额均未披露；财务完全不透明
        - label: 团队与执行
          value: 7
          max: 10
          note: Pirondini + Coronado 具备领域可信度；管理团队已扩充；治理不透明
        - label: 风险画像
          value: 3
          max: 10
          note: 高：尚未产生收入、估值未披露、星座执行、ITAR 敞口
        - label: 估值纪律
          value: 3
          max: 10
          note: 偏紧：无收入却隐含 $1B+；公开可比公司需要 $30-90M ARR 才能支撑
        - label: 证据质量
          value: 4
          max: 10
          note: 机构融资已确认；运营指标完全未披露
    approximationNotes: 分数是 0-10 分制下的定性分析师判断，不是精算评级。5 分 = 中性 / 不确定；高于 7 分 = 正面因素证据强；低于 3 分 = 重大缺口或负面信号。 所有分数反映截至 2026-06-23 的公开证据。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV037
      - CV038
