      - number: '6.2'
        title: 具名客户证明：Alaska DoT 与 Early Access Program
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Alaska Department of Transportation and Public Facilities 是 Xoople
              客户记录中唯一具名且有公开文档支持的生产部署。关键基础设施用例页面确认了一项实时合作：Xoople 基于卫星数据提供 AI 驱动的变化检测，帮助 DoT 监测 Juneau icefield
              附近道路状况，识别降雪模式变化等早期洪水风险信号，并在天气事件发生前预先规划桥梁关闭和应急资源部署。公司称，该方案把分析时间从「数天」降到「数分钟」。Xoople YouTube 频道发布的 BBC
              StoryWorks Commercial Productions 影片《Guarding the Glaciers》提供了视觉佐证：片中出现具名 Juneau 居民 Jossline Jackson，并记录
              DoT 管理融化中的 Mendenhall Glacier icefield 附近基础设施的运营挑战。Alaska DoT 自己的公开网站确认，该机构依赖基于 ArcGIS 的 EGIS
              工具做基础设施监测，佐证了 Xoople 关于其数据通过 Esri ArcGIS 分发伙伴集成的说法。

              关键基础设施页面还称，Xoople 正在「扩大范围，以监测整个 Alaska 州」——如果落地，将显著扩大这个唯一具名政府部署的范围。没有找到合同金额、SLA、续约条款或公开 RFP 记录，来佐证 Alaska
              DoT 关系的商业化阶段或持续时间。

              除 Alaska DoT 外，2025 年 12 月总部公告推出了「Early Access Program」——被描述为「一种独家模式，让全球先锋公司在 private preview 下访问并定制
              Xoople 解决方案」。Capital Riesgo 和 EU Startups 独立确认，Private Access Program 的首批客户包括政府机构和 Fortune 500 公司。EY
              案例研究记录了 EY 作为 go-to-market 伙伴的多年角色：EY 和 Xoople 制定「面向客户的 go-to-market 策略和项目，包括解释这些数据集所产出洞察的
              playbooks」。TechCrunch 还补充称，CEO Pirondini 描述的用例包括「政府机构跟踪交通网络和自然灾害损害，农业企业监测作物健康，或大型公司关注基础设施项目或供应链」。非 DoT
              private-preview 队列没有公开任何客户名称、推荐语、独立案例研究或使用指标。
