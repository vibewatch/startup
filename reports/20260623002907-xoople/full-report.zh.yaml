companyProfile:
  summary: >-
    Xoople 是一家西班牙地球数据基础设施公司，成立于 2019 年，由 Deimos Imaging 前员工 Fabrizio Pirondini 和 Alvaro Coronado 领导。约七年隐身期后，公司在 Tres
    Cantos 开设全球总部，启动 Early Access 计划，并于 2026 年 Q2 开始商业化 EarthAI。当前模式是把可供 AI 使用的地球数据嵌入 Microsoft、Esri、Databricks 等生态，同时与
    L3Harris 共同开发未来自有光学星座。公开证据显示战略资本和合作伙伴验证较强，但收入、ARR、客户数、精确估值和详细卫星部署计划均未披露。
