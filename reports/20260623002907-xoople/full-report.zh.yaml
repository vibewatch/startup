      - number: '5.2'
        title: 技术架构与数据处理管线
        blocks:
          - type: paragraph
            body: >
              Xoople 的技术架构可分为三层：数据获取（当前来自第三方公开和商业 EO 卫星）、处理与增强（在 Microsoft Azure 云基础设施上运行的 AI 像素分析和时间序列计算），以及分发（接入
              Microsoft Power BI、Esri ArcGIS、Databricks 和 Planetary Computer Pro 环境的集成连接器）。

              EY 案例研究记录了 EY 与 Xoople 多年的技术合作，并确认公司使用「平台无关的开放数据格式」，以便跨行业使用。EY 和 Xoople 与 Microsoft、Databricks 等
              hyperscaler 合作者一起塑造数据集，推动企业采用。案例研究明确描述了数据安全架构：团队「采用零信任方法」，配合「最小权限原则」「基于用户的访问控制和持续验证」。Pirondini
              确认，公司与「技术伙伴围绕统一的全球数据方法合作，并额外叠加一层网络安全」。

              放到更广的 EO 行业看，SpatioTemporal Asset Catalog（STAC）规范已经成为描述和编目时空资产的主流标准；OGC EO GeoJSON 标准则为 EO 数据集元数据提供
              JSON/JSON-LD 编码，主流云平台都在实现。Xoople 没有公开说明自己采用哪些开放标准，但 EY 案例研究强调平台无关的开放格式，这与云原生地理空间社区常见的 STAC/COG
              架构模式一致。Cloud-Native Geospatial Forum 是这些标准被开发和讨论的实践者生态。截至 2026 年 6 月，没有找到 Xoople 的公开 API 文档、SDK、开发者门户或
              GitHub 仓库；考虑到公司自称为 AI 开发者和企业系统团队提供数据基础设施，这一缺口构成重要证据不足。

              Esri-Microsoft 集成页面确认，ArcGIS 可与 Microsoft Fabric、Azure、Power Platform 和 .NET 集成；这界定了 Xoople
              数据层进入的下游企业环境。ArcGIS-Databricks 集成文档显示，ArcGIS GeoAnalytics Engine 可安装在 Databricks 上，在大规模地理空间工作负载中运行空间 SQL
              函数——这正是 Xoople 数据要驱动的工作流类型。Databricks 的 Partner Connect 功能，为进入 Databricks 生态的数据方案提供经过验证的集成路径。
