      - number: '2.2'
        title: 市场规模：多重视角与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >-
              没有单一公开估算能干净映射到 Xoople 的可服务市场。三家主要分析机构对全球 EO 市场的估算跨度很大，因为它们测量的是同一供应链的不同部分。Fortune Business Insights 估计 2025
              年全球地球观测市场为 $7.04 billion，并预计到 2034 年增长至 $14.55 billion，CAGR 为 8.31%；其口径较宽，很可能纳入平台、分析和硬件相邻服务。Grand View
              Research 采用更窄的卫星与平台框架，估计 2024 年市场为 $5.10 billion，并预计到 2030 年增长至 $7.24 billion，CAGR 为 6.2%。EUSPA 的权威框架仅覆盖
              EO 数据产品和增值服务（明确排除卫星硬件和发射），报告 2023 年收入约 €3.4 billion，并预计到 2033 年接近 €6 billion。


              如果不知道各分析机构的精确口径边界，这三组估算无法调和，但分歧本身有信息量。最小估算（EUSPA）最接近 Xoople 会承认为可触达栈的范围；最大估算（Fortune）很可能通过纳入 Xoople
              不参与竞争的基础设施和政府运营预算，高估了 Xoople 可触达支出。EUSPA 的保险和金融子细分市场尤其值得关注：EUSPA 预计该细分 2023 至 2033 年将增长约 165%，达到约 €900
              million，驱动因素是保险公司和贷款机构对地点特定风险证据的需求。该子细分的增长轨迹与 Xoople 宣称的企业垂直场景之一高度一致。


              在 MarketsandMarkets 等分析机构绘制的地理空间情报市场中——一个融合 EO、GEOINT、AI 分析和位置智能的更宽泛数十亿美元级品类——预测规模还要更大，不过这些报告大多在付费墙之后。按
              Grand View 统计，北美在 2024 年占全球 EO 市场价值超过 45%；按 Fortune 统计，2025 年占比超过 34.97%，反映美国政府 GEOINT
              和商业情报采购的主导份额。亚太是增长最快的地区，预计到 2030 年 CAGR 超过 9%。


              Xoople 自身的 SAM 和 SOM 未公开披露。用 EUSPA 数据 / 服务层（2023 年 €3.4B）以及分析 / 情报溢价细分粗略三角测算，企业 AI
              数据基础设施这一新生且尚未完全成形的切片，2025 年可寻址支出可能为 $0.5–2.0 billion；高端情景需要 AI 平台采用率显著提升才会兑现。Xoople 公开材料既没有确认，也没有否认这一估算。
