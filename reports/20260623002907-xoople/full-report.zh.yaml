      - number: '5.5'
        title: 信任、安全、隐私与质量控制
        blocks:
          - type: paragraph
            body: >
              Xoople 已记录的隐私与合规框架从 GDPR 开始。公司隐私政策将位于 Madrid, Spain 的 Xoople S.L.（CIF B88282090）列为法律控制者，确认全面遵守
              GDPR，包括数据主体权利（访问、更正、删除、可携带和反对），并说明只有在同意、合同必要性、法律义务和合法利益等法律基础下才处理数据。政策明确称，除非获得用户明确同意，Xoople「不进行自动化决策，包括画像」；考虑到
              EarthAI 被作为 AI-ready 数据层推广，这是一项相关保护。跨境数据传输由 Standard Contractual Clauses 覆盖。该政策最后更新于 2023 年 9 月 26 日，早于
              Series B 以及向 Fortune 500 和政府 preview 客户扩展，可能无法完全反映当前数据处理范围。

              已发布案例研究中的 EY 合作，是目前最详细的技术信任验证。EY 团队把零信任架构、最小权限访问、基于用户的访问控制和持续验证，用在 Xoople 数据集和基础设施上。Gusher（EY Americas AI
              and Data Leader）表示：「把信任嵌入这个数据集，是该项目绝对必要且基础的一部分。」EY 用 EY.ai Value Blueprints 验证 Xoople 数据；这是一个结构化 AI
              信任框架，覆盖智能、信任和客户维度。这是有意义的第三方验证，但来源是商业伙伴，不是独立审计方。

              信任和合规缺口仍然显著。公司没有发布 ISO 27001、SOC 2、FedRAMP 或同等安全认证；没有公开 SLA、可用性承诺或数据质量指标；公开记录中也没有独立技术基准或数据准确性评估。OECD 2026
              年对卫星 EO 数据的分析指出，建立对卫星影像和 AI 预测的信任，需要「可解释模型」而不是黑箱方法；同时「卫星影像供应链的完整性容易受到恶意篡改」。Xoople
              公开材料没有回应数据来源、chain-of-custody 证明或漏洞披露流程。使用条款否认对错误或遗漏承担任何责任，这与早期企业 SaaS 一致，但低于政府、保险等安全敏感垂直行业的企业采购标准。
