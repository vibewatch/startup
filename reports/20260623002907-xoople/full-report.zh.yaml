      - number: '8.2'
        title: 估值框架、融资背景与可比公司
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Xoople 累计形成的资本约为 $225 million。2026 年 4 月 Series B 融资 $130 million，由 Nazca Capital 领投，MCH
              Private Equity、CDTI Innovación（西班牙政府技术投资机构）、Buenavista Equity Partners 和 Endeavor Catalyst 参投。CDTI
              Innovación 此前已在一笔披露的融资中承诺 €16.74 million，说明西班牙政府资本提供了一条带有部分补贴属性的融资渠道，降低了公司对纯商业资本市场周期的依赖。Series B 前约 $95
              million 的资本基础来自 AXIS/ICO、Space Eye、ESRI International、GED Conexo 和 BM Invest Space。CEO Pirondini 告诉
              TechCrunch 和 Cinco Días，公司现在处于「独角兽区间」（即投后估值 ≥ $1 billion），但没有披露精确数字。EU Startups 和 Cinco Días 都将本轮融资折算为约
              €112-113 million，确认了美元规模；两家媒体均未从公司获得估值数字。

              给 Xoople 估值时，最相关的上市可比公司由 Planet Labs (NYSE: PL) 领衔。Planet Labs 报告 2026 财年（截至 2026 年 1 月 31 日）总收入 $307.7
              million，按其 10-K 文件，毛利率约 56%。按 2026 年 6 月 22 日 $28.77 的股价和约 $10.25 billion 的市值计算，Planet Labs 约以 33x
              往绩收入交易；这是溢价倍数，反映市场预期 AI 驱动的数据需求会加速，以及 Planet 平台变现的上行空间。BlackSky Technology (NYSE: BKSY) 市值约 $1.06
              billion，往绩年收入约 $83 million，意味着 P/S 倍数约 13x；BlackSky 的 FY2025 10-K 披露，四个客户贡献了总收入的 89%，凸显极端集中风险。Spire Global
              (NYSE: SPIR) 市值约 $669 million，往绩收入约 $63 million，意味着 P/S 约 11x；Spire 经营基于订阅的天气、航空和海事数据业务。SPAC 上市的阿根廷 EO 运营商
              Satellogic 自 2021 年上市以来一直难以达到商业规模，最新 20-F 文件显示持续经营亏损和有限收入增长，为估值提供了警示性上限。合在一起，上市 EO 数据板块当前以 11-33x
              往绩收入交易；高端对应 AI 时代平台定位，低端反映客户集中或单一用例限制。
