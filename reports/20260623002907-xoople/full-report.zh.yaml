      - number: '5.4'
        title: 路线图：自有星座与未来架构
        blocks:
          - type: paragraph
            body: >
              Xoople 产品路线图的下一阶段，是与 L3Harris Technologies 共同开发自有卫星星座。2026 年 4 月联合公告将该系统描述为「面向 AI
              时代设计和优化的首个同类卫星星座」——这是七年独家隐身研发的结果。L3Harris 将供应其 Rochester, New York
              设施开发的先进成像载荷；评论文章确认，该星座作为持续测量层，目标是交付「高于黄金标准 100x 的数据」。Pirondini 告诉
              TechCrunch，该星座将产生「比现有监测系统好两个数量级的数据流」。L3Harris 总经理 Carolyn Cossavella 确认，Xoople 合同「对我们来说非常重要」，代表 L3Harris
              从载荷供应商向系统架构师沿价值链上移。

              关键技术细节仍未披露：TechCrunch 追问时，Pirondini
              拒绝透露卫星数量、硬件规格，甚至精确的光学波段配置。公司没有公布星座发射时间线、轨道参数、重访频率或地面分辨率目标。唯一确认的传感器模态是光学。Xoople 星座尚未提到
              SAR、RF、热红外或高光谱能力，这使它区别于 ICEYE（SAR）、Capella Space（SAR）和 Spire（RF/AIS）等竞争对手。Series B $130M
              计划同时资助星座开发和平台扩张，但没有披露预算拆分。

              软件路线图上，Pirondini 向 SpaceNews 描述的目标，是让用户能够对 Earth intelligence 数据以及其他企业数据源进行「自然语言查询」。CDTI Innovación 向
              Xoople 提供 €16.74 million 资助，在政府层面验证了研发项目；不过 CDTI 发布材料只确认资金，没有说明技术里程碑。TechCrunch 指出，竞争版图已经包括
              Vantor（formerly Maxar Intelligence）、Planet Labs、BlackSky、Airbus Defence and Space、ICEYE 和 Capella
              Space——它们都拥有运行中的星座和成熟的 AI-focused 管线。TNW 将硬件 build-out 描述为「昂贵、缓慢、执行负担重」；鉴于 Xoople 当前依赖第三方数据，这是关键执行风险。
