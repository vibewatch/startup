  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 支柱
      - 投资逻辑
      - 反向逻辑
      - 哪些证据会改变判断
    rows:
      - - 市场机会
        - 按 EUSPA，EO 服务市场从 €3.5B（2024）增至 €7.9B（2034）；AI 驱动的需求拐点，为常开型地球数据打开结构性新类别
        - 相比地面数据板块，市场仍小；EO 公司多次没能把数据能力转成持久的企业 SaaS 式收入
        - 大规模企业客户续约队列，以及 Fortune 500 部署 AI 工作负载带来的 TAM 扩张证据
      - - 产品差异化
        - AI 原生 EO 层嵌入 Microsoft 和 Esri 生态，降低使用摩擦；未来自有 L3Harris 星座提供竞争对手拿不到的数据护城河
        - 当前平台使用商品化 ESA Sentinel-2 数据；星座发射前没有自有数据；差异化在架构上，尚未落进当前产品
        - 星座首光公告并确认数据规格；或证明自有算法产出明显更优结果的证据
      - - 团队与执行
        - 联合创始人 Pirondini（前 Deimos Imaging CEO）和 Coronado（前 Deimos CFO）具备垂直领域履历；管理团队已补进商业、运营、财务和法律能力
        - 治理不透明：没有董事会名单，没有独立董事名单；结构以创始人为中心，看不到机构化制衡；未公开经审计财务
        - 披露董事会构成；任命独立董事；发布含经审计财务的年报
      - - 融资与资本效率
        - 已融资 $225M，且 CDTI 政府补贴降低资金成本；先分销的模式相比先建星座的同行，短期卫星 CAPEX 更低
        - 优先股堆叠未披露；早期投资人可能有清算优先权，令后进投资的经济性不利；星座 CAPEX 很可能在首光前需要 $200M+ Series C
        - 完整披露股权结构表、清算优先顺序和星座 CAPEX 计划
      - - 商业证明
        - 私测队列包括政府机构和 Fortune 500 公司；Microsoft、Esri、EY 合作显示企业销售基础设施已经搭起
        - 没有公开确认的付费合同；Alaska DoT 是唯一具名案例；商业化仅在 2026 年 Q2 开始，尚无可跟踪牵引指标
        - 首个确认付费合同公告并给出 ACV 区间；或 2026 年 Q3 投资人更新披露已签约 ARR 数字
    notes: 论据来自截至 2026-06-23 可取得的公开来源。反向逻辑不是失败预测；它们代表证据缺口和结构性风险，只有解决后，投资逻辑才有高置信度承销基础。
