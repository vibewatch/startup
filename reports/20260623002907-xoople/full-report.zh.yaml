      - 可观察阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Series C 降价轮融资
        - 任何公告的 Series C 估值低于 $900M pre-money（可行 Series B post-money 区间的大致下限）
        - 释放出商业表现低于内部目标的信号；优先股堆叠压力使 Series B 回报在没有极端退出时很难成立；确认悲观情景
        - 立即退出跟踪仓位；新管理团队或重组前不再进入
      - - 失去 Microsoft 或 Esri 分销渠道
        - 官方公告 Fabric、ArcGIS 或 Databricks 嵌入式分销协议不续约、终止或被替换
        - 没有生态渠道，先分销模式会坍塌；被迫重建直销，CAC 高出 3-5x；ARR 爬坡延后 18-36 个月
        - 下调至回避；只有出现同等规模替代渠道证据时才重新评估
      - - 星座延误到 2030 年之后
        - 官方公告或可信报道把首光日期放在 2030 年 12 月之后；或到 2027 年 12 月仍沉默、没有里程碑更新
        - 自有数据护城河推迟；星座前毛利率继续受压；需要额外稀释性融资来跨过星座缺口
        - 转为继续研究；时间线风险已成主导；等待星座融资结构
      - - ITAR/出口管制执法行动
        - 美国国务院或商务部就 L3Harris 光学载荷联合开发发出执法通知；或出现与双用途数据出口有关的公开诉讼
        - L3Harris 合作冻结或终止；星座项目暂停；产品路线图受扰；监管悬顶使估值折价 30-50%
        - 立即暂停跟踪；重新进入前必须完成法律尽调
      - - 首次收入申报前 CEO 或 CFO 离任
        - Fabrizio Pirondini（CEO）或 Alvaro Coronado（CFO）在首份经审计年收入数字发布前公开宣布离任
        - 以创始人为中心的结构下，此阶段任一联合创始人流失，都指向深层内部分歧、投资人压力或战略转向
        - 下调至继续研究；等待继任公告和管理层会议
      - - 到 2026 年 Q4 仍为零付费合同
        - 到 2026 年 12 月 31 日，任何 Xoople 新闻稿、合作伙伴公告或媒体报道都没有确认付费商业合同
        - 正式发布九个月后商业假设仍未验证；Series C 时间压力和估值重置风险上升
        - 若到 2026 年 12 月 31 日仍无合同证据，下调至回避
    notes: 所有触发条件都可从公开来源观察（新闻稿、官方文件、合作伙伴公告、政府采购数据库和可信媒体报道），不需要私有财务数据。阈值是分析师基于可比 EO 公司轨迹和 Series B 估值背景作出的判断。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何影响估值
      - 负责人 / 尽调路径
    rows:
      - - 已签约 ARR 与商业牵引
        - 2026 年 Q2-Q4 商业发布期内，已签合同数量、ACV 区间、客户行业拆分和已签约 ARR 总额
        - 没有 ARR，估值完全靠里程碑支撑；即便 $5-15M 已签约 ARR 也能锚定倍数讨论；没有任何数字是最大的单一承销缺口
        - 直接向管理层索取；或监测 Xoople 新闻稿、合作伙伴公告（Microsoft、Esri）和政府采购数据库中的具名合同
      - - Series B post-money 估值与股权结构表
        - 精确 post-money 估值、投资人持股比例、优先股条款、清算顺序和反稀释条款
        - 没有这些数据，优先股压力不可见；若 $225M 既有资本享有 2x 清算优先权，收购情景下普通股东拿到价值前，退出收益需先超过 $450M
        - 直接向投资人 data room 索取；西班牙商业登记（BORME）未来文件可能披露 Xoople S.L. 股份类别结构
      - - 毛利率与成本结构
        - 早期商业合同毛利率；数据授权成本占收入比例；云基础设施成本；星座前后预期毛利率曲线
        - 先分销模式在第三方 EO 数据上可能只有 30-45% 毛利率，星座后可超过 50%；毛利率路径决定 IRR 敏感度
        - 直接向管理层索取；可比 Planet Labs 10-K 披露收入成本细节，可提供参照框架
      - - 星座部署时间表与 CAPEX
        - 卫星数量、目标轨道参数、运载火箭、发射窗口和星座 CAPEX 总需求；L3Harris 传感器开发当前阶段
        - 星座是长期差异化驱动；部署时间决定业务何时从第三方数据毛利转向自有数据经济性
        - 直接向管理层索取；L3Harris SEC 文件和业绩电话会可能提到项目时间线；SpaceNews 和行业跟踪服务监测星座进展
      - - L3Harris 载荷的出口管制与 ITAR 状态
        - 确认是否有 Technical Assistance Agreement（TAA）或许可证例外，覆盖向 Xoople S.L.（西班牙实体）转移美国来源光学传感技术
        - ITAR/EAR 执法可能冻结联合开发协议并叫停星座开发；这是二元监管风险，市场看不到状态指示器
        - data room 中直接法律披露；L3Harris 公开沟通；美国国务院或商务部许可数据库
      - - 董事会构成与治理结构
        - 完整董事会名单，包括独立董事、投资人提名席位、保护性条款和审计 / 薪酬委员会结构
        - 这个融资阶段仍治理不透明，暗示可能存在创始人控制条款或投资人治理条款，未来融资或流动性选择可能受限
        - 管理层 / 投资人直接披露；西班牙商业登记中 Xoople S.L. 董事会备案等公开公司记录
    notes: 所有尽调问题都是截至 2026-06-23 公开来源中缺失的信息。优先级排序：ARR（任何估值锚都需要）、股权结构表（回报建模需要）、毛利率（情景分析需要）、星座时间表（长期逻辑承销需要）、ITAR（二元监管门槛检查）。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
