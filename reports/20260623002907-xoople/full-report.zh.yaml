      - number: '7.2'
        title: 运营与技术风险：星座交付、数据质量与平台依赖
        blocks:
          - type: paragraph
            body: >-
              Xoople 面临的最大单项运营风险，是 L3Harris 联合开发卫星星座的交付时间线未披露。截至 2026 年 6 月，公司只披露存在一个星座、该星座为 AI 时代 Earth observation
              优化，以及成像载荷由 L3Harris 在 Rochester 开发。卫星数量、发射载具、发射日期区间、轨道参数或分阶段部署计划均未公开。当前生产平台建立在 ESA Copernicus/Sentinel-2
              开放数据之上；在自有传感器 first light 之前，Xoople 没有自有数据差异化。Planet Labs（在 SEC 文件中披露星座状态和传感器数量）和 BlackSky（在 10-K
              中报告卫星级运营数据）等竞争对手证明，自有星座管理承载实质技术和财务风险——Planet FY2026 10-K 和 BlackSky 财年 10-K 都记录了围绕发射失败、卫星异常和 capex
              强度的大量风险因素。本轮研究期间，这两组文件在 EDGAR 上被访问拦截或显示错误页面，但这些公司此前披露已确认星座风险真实且持续存在。

              相比标准 EO 影像业务，Xoople 的数据质量和校准风险在结构上更高，因为客户预计会把 EarthAI 输出直接喂入自主 AI 决策管线。OECD 警告称，EO 中的 AI 方法往往不可解释，AI
              派生输出一旦出错，在规模化场景下会带来「实质后果」。Xoople 称 AI 时代客户「做出的决策中，哪怕 1% 错误也不可接受」，这隐含设置了极高准确率门槛——而当前平台从未经过独立基准测试。

              平台依赖风险是多层的：Xoople 通过 Microsoft Azure、Power BI、Esri ArcGIS 和 Databricks 分发。任何一个平台改变条款、价格或伙伴优先级，都可能让 Xoople
              的 go-to-market 在没有替代渠道的情况下搁浅。对于这些分发伙伴关系，公司没有公开披露任何 SLA、排他协议或保证上架期限。公开材料也没有处理网络安全暴露：OECD 指出卫星 EO 信号容易遭到
              spoofing，而 Xoople 公开文档中没有 SOC 2 证明或 ISO 27001 认证。
