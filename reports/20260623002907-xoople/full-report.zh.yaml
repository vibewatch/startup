      - number: '5.6'
        title: 附录
        blocks:
          - type: callout
            title: 分发优先策略在自有数据之前先形成企业护城河
            body: >
              在拥有自有卫星供应之前，Xoople 已把 EarthAI 嵌入 Microsoft Azure、Power BI、Esri ArcGIS 和
              Databricks，提前拿到两个主导企业地理空间生态的分发位置。等自有星座投入运营，分发管道已经铺好——这是竞争对手需要多年才能复制的关键优势。
            calloutType: strength
            claimRefs:
              - CE010
              - CE019
              - CE020
              - CE025
          - type: callout
            title: 星座硬件执行风险是产品交付的核心不确定性
            body: >
              L3Harris 星座承诺带来数据质量跃迁（精度相较当前黄金标准提高
              100x），这是产品长期价值主张的核心。但公司没有披露卫星数量、发射日期、轨道参数、分辨率或重访频率。硬件制造、发射排期和星座部署都资本密集，并且高度受时间表影响。当前所有产品能力都运行在 Xoople
              不控制的第三方数据上。如果星座执行明显滑坡，业务将长期依赖商品化 ESA 和商业 EO 供应。
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE015
              - CE046
              - CE047
          - type: callout
            title: 缺少公开开发者 API 限制第三方验证和生态建设
            body: >
              EarthAI 被定位为面向 AI 系统和企业开发者的数据基础设施，但没有公开 API、SDK、开发者文档或任何代码仓库，这是明显缺口。独立技术验证因此无法进行，数据工程师和 ML
              从业者也难以用平台做原型；「AI-ready」到底代表真正可供开发者访问的产品，还是白手套式集成服务，仍有不确定性。这是自助式企业采用的实质阻碍。
            calloutType: risk
            claimRefs:
              - CE037
              - CE038
              - CE039
          - type: callout
            title: EY 零信任合作是目前最好的信任证据，但来源是商业伙伴
            body: >
              EY 发布的案例研究，是关于 Xoople 数据安全架构和 AI 治理方法最详细的独立技术证据。案例中描述的零信任、最小权限和持续验证控制，代表可信的企业级安全设计。但 EY 是商业咨询和
              go-to-market 伙伴，不是独立安全审计方。来自保持距离的审计机构的 ISO 27001、SOC 2 或同等认证，才能为企业和政府采购决策提供强得多的信号。
            calloutType: insight
            claimRefs:
              - CE032
