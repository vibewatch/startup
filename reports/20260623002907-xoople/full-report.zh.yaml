          - type: callout
            title: 分发优先模式降低 GTM 风险，但增加收入复杂度
            body: >-
              在拥有卫星之前先把 EarthAI 嵌入 Microsoft 和 Esri，在财务上是理性的：Xoople 能在客户已经付费的平台里触达买家，降低获客成本，也避开卫星优先 EO
              公司常见的多年收入空窗。代价是复杂度上升——与平台伙伴的收入分成安排，又增加一层未披露的成本结构；第三方来源 EO 数据的毛利，也会低于自有星座供数后可达到的水平。模式原则上成立；执行结果仍待证明。
