      - number: '4.2'
        title: 定价、变现路径与生态伙伴经济性
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Xoople 尚未公开 EarthAI 订阅、API
              访问或企业合同的任何价格。公司刚进入商业化，目标客户又是大型企业和政府机构，交易结构通常定制且保密，因此没有价目表并不意外。生态集成模式让标价更复杂：Xoople 通过 Microsoft 和 Esri
              分发，意味着可能存在收入分成或白标安排，但具体经济条款并未公开。Xoople 发布的供应链用例提到，将 Earth 数据与 Power BI 结合用于运营智能，说明至少部分企业买家是已有 Microsoft
              订阅的大公司；Xoople 的附加价格更像谈判出来的企业扩展，而不是固定 SaaS 档位。定价参照方面，Planet Labs 是资本最充足的上市 EO
              数据可比公司，它采用订阅合同，企业费率谈判确定，没有公开价目表；Planet FY2026 收入为 $307.7 million，来自订阅和按量使用合同。BlackSky 也把客户分为 On-Demand 和
              Assured 两类订阅，以多年期年度合同为主，但同样不公开价格。这些可比公司说明，企业级 EO 定价按行业惯例就是不透明的。Xoople 与 EY 的合作又增加了一层 GTM：EY 制定
              go-to-market 策略和集成手册，说明除技术分发渠道外，还有咨询牵引的渠道。Early Access Program
              早于全面商业化，本身可能没有产生有意义的经常性收入。任何严肃投资人首先要问的尽调问题，是 2026 年 Q2–Q3 签下的首批商业协议，其价格和合同结构到底是什么。
