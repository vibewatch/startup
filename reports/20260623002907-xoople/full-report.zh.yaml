      - number: '6.4'
        title: 留存、耐久性与扩张动态
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Xoople 所有标准耐久性指标都为空，这反映了公司商业化前的运营历史，以及当前客户关系的私密性。本轮研究审阅的公开来源中，没有 Net Revenue
              Retention（NRR）、Gross Revenue Retention（GRR）、年度流失率、合同续约率、平均合同期限或 cohort 留存数据。考虑到公司 2026 年 Q2
              才启动商业化，这并不意外；但这意味着任何耐久性 thesis 都只能建立在结构性因素上，而不是已实现的运营指标上。

              结构上，Xoople 的部署模式有利于粘性。数据层嵌入 Power BI、ArcGIS 和 Databricks 后，会产生切换成本：企业客户一旦围绕 Xoople 的连续 Earth change
              数据搭建规划工作流或风险模型，改用替代供应商就要承担显著的数据连续性和集成成本。Alaska DoT 部署范围正从 Juneau
              扩大到全州监测，这是温和正面的扩张信号；但没有披露合同续约或合同金额，无法确认收入耐久性。

              EY 案例研究暗示，EY 将 Xoople 介绍给企业客户，并验证其数据集；在早期 cohort 中，这可能充当客户质量过滤器。但 EY 作为 go-to-market 渠道也带来依赖：如果 EY
              把背书转向替代平台，通过 EY 客户网络触达的客户未必对 Xoople 本身有强忠诚度。

              NewSpace EO 问题分析把「可重复需求」列为 Earth observation 最难的商业问题：「许多民用部门仍在购买试点、概念验证或狭窄研究。盈利供应商需要客户续约，因为数据会改变日常决策。」这是
              Xoople 规模化后必须通过的耐久性测试；除 Alaska DoT 全州扩张信号外，目前没有公开证据说明续约意图或 cohort 轨迹。
