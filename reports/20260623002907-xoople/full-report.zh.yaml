      - number: '3.4'
        title: 替代方案、分销平台与现状路径
        blocks:
          - type: paragraph
            body: >-
              Google Earth Engine、Esri ArcGIS 和企业内部自建路径，是潜在 Xoople 客户最常见的三条替代路线，它们无需采购专门的 EarthAI 数据层。


              Google Earth Engine 是一个行星级地理空间分析平台，拥有超过 80 PB 卫星数据和 30 多年历史影像。它于 2022 年开放商业使用，此前只对学术和研究用途免费。Earth Engine
              提供 Python 和 JavaScript API、云原生代码编辑器，并接入每日更新的数据集。Google 还推出了更广泛的 Earth AI 计划，目标是让物理、环境和基础设施信息可通过先进 AI
              模型查询——这一叙事几乎与 Xoople 声称的 EarthAI 定位相同。对技术团队熟悉云 API 和 Python notebook 的企业而言，Earth Engine 是一个成熟、由 Google 支撑的
              Xoople 分析层替代方案，尽管它缺少 Xoople 声称的精度、校准和企业集成包装。


              Esri ArcGIS 占据企业 GIS 层。Esri 与 Microsoft 有 20+ 年合作关系，ArcGIS 产品套件深度集成 Microsoft 365、Microsoft Fabric、Azure 和
              Power Platform。ArcGIS 为企业决策工作流提供空间分析、动态地图和位置洞察。其公开按用户定价从 ArcGIS Online 约 $500/user/year
              起，但企业合同单独谈判。Databricks-ArcGIS 通过 ArcGIS GeoAnalytics Engine 集成，意味着已经运行 Databricks
              数据管道的企业，可以在现有环境中启用空间分析，从而降低另行采购 EO 数据馈送的增量必要性。Esri 既是潜在替代品，也是 Xoople 的主要分销渠道；这种双重关系带来的张力，需要在尽调中澄清。


              大企业的现状替代方案，是把 ESA Copernicus Sentinel-2 开放数据（免费）、企业 GIS 工具和内部分析团队组合起来。Sentinel-2 提供 10 m 多光谱影像，全球 5
              天重访；这对许多 Xoople 用例并不够，但免费且广泛可得。UP42 作为 Airbus 运营的 EO
              数据市场，降低了多供应商数据接入门槛，也对任何商业数据提供商造成下行定价压力。下方定价表展示主要供应商之间的定价格局。
