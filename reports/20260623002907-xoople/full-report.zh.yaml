    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律实体与运营假设
        blocks:
          - type: paragraph
            body: >-
              Xoople 将自己定位为源自西班牙的地球数据基础设施公司，核心假设是：AI 系统需要一个可信、持续更新的“记录系统”，来跟踪地球上发生的物理变化。公司官方材料称，业务创立于 2019
              年，隐身开发约七年，如今正在商业化 EarthAI：一个数据层，把卫星和环境信号转译为可供 AI 使用的测量结果，服务企业和政府工作流。公司隐私政策和使用条款披露的法律实体是 Xoople
              S.L.，注册地址为马德里 Calle San German 13，CIF 为 B88282090，意味着公司明确受西班牙法律和 GDPR 约束。注册办公室位于马德里市中心，但公司公开运营身份如今围绕 Tres
              Cantos 全球总部展开，多个来源也直接称其总部在马德里。实际来看，Xoople 卖的不是原始影像，而是决策基础设施：它希望 AI 系统能够吸收可信的物理世界上下文，用于供应链、基础设施、农业、风险和韧性场景。
