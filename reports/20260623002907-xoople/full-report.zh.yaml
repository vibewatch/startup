      - number: '8.4'
        title: 建议、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              建议为跟踪，置信度中等，风险评级高。估值立场为偏高。这是一个对价格和证据敏感的判断，不是泛泛的质量评分：逻辑可信，团队有领域经验，市场机会也真实存在。但是，现有公开证据无法支撑隐含 $1 billion
              或更高的投后估值，因为 Xoople 没有披露收入、ARR、客户数、现金消耗率、毛利率、优先权结构，也没有披露精确的星座部署时间表。先分销模型降低近期资本需求，但推迟了能支撑溢价倍数的专有数据经济性。现有上市
              EO 可比公司（Planet Labs 为 33x P/S、BlackSky 为 13x、Spire 为 11x）显示，要按市场倍数支撑 $1 billion 估值，需要 $30-90 million
              经常性收入——而这些收入没有一分钱被确认已经签约，更谈不上确认收入。

              跟踪建议不排除未来转为买入。若至少三份已签企业合同披露年合同价值（ACV）和续约条款，或确认 Series B 投后估值低于 $900 million，判断可上调至继续研究。若 Xoople 到 2026
              年底从多元客户实现 $20 million 或更多 ARR，披露毛利率高于 45%，并给出可信的星座里程碑时间表和确认发射窗口，判断可上调至买入。若出现降价融资、失去超过一个具名商业客户，或宣布星座延迟至
              2030 年之后，判断应下调至避免。本章投资 KPI 记分卡覆盖驱动判断的八个维度：市场机会和团队得分较高，但基于当前证据，商业证明、经济性、风险和估值纪律均得分偏低。
