      - number: '6.5'
        title: 客户集中、证明深度与负面分析
        blocks:
          - type: paragraph
            body: >
              Xoople 现阶段最大的客户侧风险，是可验证证据极度集中在一个具名政府部署上。截至 2026 年 6 月，Alaska DoT 是唯一身份、用例和部署状态都能独立佐证的客户；其他客户都仍藏在
              private-preview 帷幕后，没有披露名称、合同金额或结果。Xataka 直接点出了这一机构信任挑战：「Xoople
              的模式要求客户信任一家初创公司构建的关键数据基础设施。在国防、气候管理或城市基础设施等领域，机构信任门槛是瓶颈——甚至比技术本身更难。」Xataka 进一步观察到：「从 private-preview
              waitlist 扩展到长期政府和跨国公司合同，是仍需证明的一跃。」

              早期客户基础偏政府，加重了这一集中风险。政府采购周期长（大型合同通常 12–36 个月）、政治敏感，并受预算拨款约束。一个不利政治决定、预算削减或采购审查，就可能让看似已经确定的部署停摆。TechCrunch
              指出，从历史上看，「EO 领域真正的采用来自政府买家」——这是双刃剑：它验证需求，也凸显商业企业采用 EO 在结构上比政府采用更难。

              Terrawatch State of Commercial EO 2025
              分析反映了更广的行业动态：「政府已经成为主导买家，但可规模化商业市场的承诺仍未被证明。」这句话概括了品类层面的商业规模证明缺口；Xoople 必须在技术 build-out 的同时补上这一缺口。

              其他负面因素包括：（1）除 BBC 制作的 Xoople 案例研究影片外，没有任何独立客户证言、第三方评价或经验证 ROI 研究；（2）任何阶段都没有披露 NRR、GRR 或流失指标；（3）NewSpace EO
              问题报告指出，AI 验证输出在被政府和受监管行业采购部门接受之前，需要「已知错误率、可解释方法、有文档记录的训练数据和独立测试」——Xoople 尚未公开回应这一要求；（4）Early Access
              Program 的排他性，限制了公开市场评价（G2、Gartner Peer Insights）本可提供的网络效应验证。截至运行日期，Xoople 没有此类评价。
