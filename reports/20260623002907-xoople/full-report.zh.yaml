      - number: '3.2'
        title: 直接数据同行：Planet、BlackSky 和 Satellogic
        blocks:
          - type: paragraph
            body: >-
              Planet Labs、BlackSky 和 Satellogic 是 Xoople 近期收入最直接的竞争威胁，因为它们在重叠垂直场景中争夺同一批企业和政府分析买方。Planet
              是三者中垂直整合最完整的公司：它运营 450+ 颗卫星星座，通过 Dove 卫星群提供近每日全球覆盖，通过 SkySat 提供高分辨率任务拍摄，通过 Tanager 提供高光谱成像；同时它已通过 Insights
              Platform（云原生 API、GIS 工具、分析仪表盘）和 Planetary Variables（校准后的地球物理测量，包括土壤湿度、生物量和地表温度）果断上移到分析栈。Planetary
              Variables 产品线是现有商业市场中最接近 Xoople 所称 EarthAI 的类比：经过科学校准、持续更新、机器可读的地球测量结果，适合 AI 模型摄取。Planet
              不公开企业定价，与定制合同销售动作一致。


              BlackSky 在同一买方池中占据不同细分。它明确瞄准国防、情报和全球安全组织，提供其所谓实时 AI 增强战术 ISR。Spectra 平台每天最多可对优先地点捕获 15
              张不同时段影像，分析重点是短周期变化检测和异常识别。国防重心意味着 BlackSky 与 Xoople 的政府垂直有实质重叠，但在商业企业用例（供应链、保险、基础设施监测）中大体不构成竞争。BlackSky
              是上市公司（BKSY），但未将商业企业收入与美国政府合同基础分开披露。


              Satellogic 通过自有 LEO 星座以低成本提供亚米级多光谱影像，目标场景包括农业、政府、国防、金融和保险。其声称的竞争优势，是压低高质量 EO 数据成本，以释放工业和环境用例的采用。Satellogic
              同样为上市公司（SATL），但商业规模化遇到困难；其 20-F 备案注册无法访问。它的分析层不如 Planet 成熟，因此主要是数据供给竞争者，而不是完整平台对手。


              三家公司均未公开披露企业定价。下方竞争定位图展示这些同行在估计数据自有深度（x 轴：1=完全开放 / 第三方，10=完全自有星座）和 AI 集成深度（y 轴：1=原始像素，10=AI 原生企业上下文）上的对比。
