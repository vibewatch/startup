  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反方逻辑
        blocks:
          - type: paragraph
            body: >-
              Xoople 的投资逻辑建立在四根支柱上；每一根单看都成立，但合起来尚未被验证。第一，EO 市场在增长：European Union Agency for the Space Programme 将 2024 年
              EO 服务收入定为 €3.5 billion，并预测到 2034 年达到 €7.9 billion；独立研究机构则预计，更广义的地理空间情报市场到 2026 年为 $5-9
              billion，按方法和范围不同，CAGR 为 6-20%。第二，AI 为全天候地球数据创造了结构性需求拐点，Xoople 正是把 EarthAI 层放在这个拐点上：CEO Fabrizio Pirondini
              向 TechCrunch 表示，AI 系统需要可信、持续更新的物理世界层，而当前 AI 架构缺少这一上下文。第三，先分销的模型在战略上聪明：在拥有专有星座之前，先把 EarthAI 嵌入 Microsoft
              Fabric、Esri ArcGIS 和 Databricks，Xoople 可以用低于「先发卫星」策略的近期资本开支验证企业需求。第四，创始团队有领域可信度：Pirondini 和 Coronado 都曾在
              Deimos Imaging 担任领导职务，这是一家可信的欧洲 EO 前身公司。

              反方逻辑同样自洽。商业 EO 多次未能把卫星能力转化为可持续、高利润率、规模化的企业收入。TerraWatch 的 2025 年商业 EO
              行业状态通讯记录，行业「能力仍然很强」，但供应商面对一场「收入测试」：客户是否会以足以覆盖卫星补充、分析人员、云成本和销售周期的价格续约。NewSpaceEconomy 的 2026
              年分析指出，资本时点是关键结构性风险：如果资本市场收紧，EO 供应商可能需要缩窄任务、合并或转向国防。Xoople 尤其把所有能让外部投资人承销该逻辑的指标都留在黑箱里：没有
              ARR、没有客户数、没有毛利率、没有现金消耗率、没有星座时间表，也没有优先权结构。在当前隐含 $1 billion+
              估值下，反方逻辑分量很重，因为内部目标下任何一个季度收入不达预期，都可能触发实质性下轮降价融资。
