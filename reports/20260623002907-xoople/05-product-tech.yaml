  - id: tech-architecture
    title: "Technology Architecture and Data Processing Pipeline"
    body: >
      Xoople's technology architecture spans three conceptual tiers: data acquisition (currently
      third-party public and commercial EO satellites), processing and enrichment (AI-powered pixel
      analysis and time-series computation running on Microsoft Azure cloud infrastructure), and
      distribution (integration connectors to Microsoft Power BI, Esri ArcGIS, Databricks, and
      the Planetary Computer Pro environment).

      The EY case study, which documents EY's multi-year technical engagement with Xoople, confirms
      that the company uses "open data formats that are platform-agnostic" to allow cross-industry
      consumption. EY and Xoople worked with hyperscaler collaborators including Microsoft and
      Databricks to shape the dataset and facilitate enterprise adoption. The case study explicitly
      describes the data security architecture: "we took a zero-trust approach" with "least privileged
      principles" and "user-based access controls and continuous verification." Pirondini confirmed
      the company works with "technological partners on a unified global data approach that has an
      added extra layer of cybersecurity."

      In the broader EO industry, the SpatioTemporal Asset Catalog (STAC) specification has become the
      dominant standard for describing and cataloguing spatiotemporal assets, and the OGC EO GeoJSON
      standard provides a JSON/JSON-LD encoding for EO dataset metadata that major cloud platforms
      implement. Xoople has not publicly documented which open standards it implements, but the EY
      case study's emphasis on platform-agnostic open formats is consistent with STAC/COG-based
      architecture patterns common in the cloud-native geospatial community. The Cloud-Native
      Geospatial Forum represents the practitioner ecosystem where these standards are developed
      and debated. No public API documentation, SDK, developer portal, or GitHub repository was
      found for Xoople as of June 2026; this absence is a material evidence gap given that the
      company describes itself as a data infrastructure provider for AI developers and enterprise
      systems teams.

      The Esri-Microsoft integration page confirms that ArcGIS integrates with Microsoft Fabric,
      Azure, Power Platform, and .NET, which defines the downstream enterprise environment into
      which Xoople distributes its data layer. The ArcGIS-Databricks integration documentation
      shows that ArcGIS GeoAnalytics Engine can be installed on Databricks to run spatial SQL
      functions on large-scale geospatial workloads — exactly the type of workflow Xoople's
      data is designed to power. Databricks' Partner Connect feature provides validated integration
      pathways for data solutions entering the Databricks ecosystem.
