  - id: roadmap-constellation
    title: "Roadmap: Proprietary Constellation and Future Architecture"
    body: >
      The next phase of Xoople's product roadmap is the co-development of a proprietary satellite
      constellation with L3Harris Technologies. The April 2026 joint announcement describes the
      system as "a first of its kind satellite constellation designed and optimized for the AI era"
      — the result of seven years of exclusive stealth R&D. L3Harris will supply advanced imaging
      payloads developed at its Rochester, New York, facilities; the editorial confirms the constellation
      is designed to deliver "data 100x over the gold standard" as a persistent measurement layer.
      Pirondini told TechCrunch the constellation will produce "a stream of data that is going to
      be two orders of magnitude better than existing monitoring systems." L3Harris General Manager
      Carolyn Cossavella confirmed that the Xoople contract "is a very big thing for us" and
      represents a step up the value chain from payload provider to system architect.

      Material technical details remain undisclosed: Pirondini declined to share the satellite count,
      hardware specifications, or even the precise optical band configuration when asked by TechCrunch.
      No constellation launch timeline, orbital parameters, revisit frequency, or ground resolution
      targets have been published. The only sensor modality confirmed is optical. No SAR, RF, thermal,
      or hyperspectral capability has been mentioned for the Xoople constellation, distinguishing it
      from competitors like ICEYE (SAR), Capella Space (SAR), and Spire (RF/AIS). The Series B $130M
      round is intended to fund constellation development alongside platform scaling, though no budget
      split has been disclosed.

      On the software roadmap, Pirondini described to SpaceNews the goal of enabling "natural language
      queries" over Earth intelligence data combined with other enterprise data sources. The CDTI
      Innovación grant of €16.74 million to Xoople validates the R&D program at a government level,
      though CDTI's published materials confirm funding without specifying technical milestones.
      TechCrunch noted that the competitive field already includes Vantor (formerly Maxar Intelligence),
      Planet Labs, BlackSky, Airbus Defence and Space, ICEYE, and Capella Space — all of which have
      operating constellations and established AI-focused pipelines. TNW characterized hardware
      build-out as "expensive, slow, and execution heavy" and a key execution risk given Xoople's
      current reliance on third-party data.
