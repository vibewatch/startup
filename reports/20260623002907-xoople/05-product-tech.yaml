callouts:
  - calloutType: strength
    title: "Distribution-first strategy provides enterprise moat ahead of proprietary data"
    body: >
      By embedding EarthAI inside Microsoft Azure, Power BI, Esri ArcGIS, and Databricks before
      owning its own satellite supply, Xoople has secured distribution in the two dominant enterprise
      geospatial ecosystems. When its proprietary constellation is operational, the distribution pipes
      are already in place — a critical competitive advantage that rivals would need years to replicate.
    claimRefs:
      - CE010
      - CE019
      - CE020
      - CE025

  - calloutType: risk
    title: "Constellation hardware execution risk is the central product-delivery uncertainty"
    body: >
      The quantum leap in data quality promised by the L3Harris constellation (100x precision vs
      current gold standard) is the product's core long-term value proposition, but no satellite
      count, launch date, orbital parameters, resolution, or revisit frequency has been disclosed.
      Hardware manufacturing, launch scheduling, and constellation deployment are capital-intensive
      and schedule-sensitive. All current product capability runs on third-party data that Xoople
      does not control. If constellation execution slips materially, the business remains dependent
      on commoditised ESA and commercial EO supply indefinitely.
    claimRefs:
      - CE012
      - CE013
      - CE015
      - CE046
      - CE047

  - calloutType: risk
    title: "Absence of public developer API limits third-party validation and ecosystem building"
    body: >
      For a company positioning EarthAI as data infrastructure for AI systems and enterprise
      developers, the absence of a public API, SDK, developer documentation, or any code repository
      is a notable gap. It makes independent technical validation impossible, limits the ability
      of data engineers and ML practitioners to prototype with the platform, and creates uncertainty
      about whether the "AI-ready" framing reflects a genuinely developer-accessible product or a
      white-glove integration service. This is a material blocker for self-serve enterprise adoption.
    claimRefs:
      - CE037
      - CE038
      - CE039

  - calloutType: insight
    title: "EY zero-trust engagement is best available trust evidence but comes from a commercial partner"
    body: >
      EY's published case study is the most detailed independent technical evidence for Xoople's
      data-security architecture and AI governance approach. The zero-trust, least-privilege, and
      continuous-verification controls described represent credible enterprise-grade security design.
      However, EY is a commercial consulting and go-to-market partner — not an independent security
      auditor. An ISO 27001, SOC 2, or equivalent certification from an arms-length audit firm
      would provide much stronger signal for enterprise and government procurement decisions.
    claimRefs:
      - CE032
      - CE033
      - CE034

