chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    Xoople's commercial product is EarthAI, a continuously updated, AI-ready Earth data layer built on third-party satellite data (principally ESA Copernicus/Sentinel-2) and distributed through Microsoft Azure, Esri ArcGIS, and Databricks. Private-preview deployments with Alaska DoT and Fortune 500 supply chain and insurance clients represent the most concrete validated evidence of live use; a proprietary optical constellation co-developed with L3Harris, promising data quality described as two orders of magnitude better than existing systems, remains in the hardware design and R&D phase with no satellite count, launch date, resolution, or revisit time publicly disclosed. Trust, GDPR, and data-access controls are documented in Xoople's privacy policy and corroborated by EY's zero-trust validation engagement. No public developer API, SDK, security certifications, or SLA terms have been published.

sections:
  - id: product-definition
    title: "EarthAI Product Definition and Current Data Layer"
    body: >
      Xoople's commercial product is EarthAI, a continuously measured, AI-ready Earth data layer that
      positions itself as "Earth's System of Record" — a structured intelligence infrastructure rather
      than a traditional satellite imagery service. The company's about page describes the platform as
      transforming "raw satellite images, down to each individual pixel, into actionable intelligence"
      that gives organisations a persistent, validated view of physical change on the Earth's surface.
      Rather than delivering point-in-time images for human analysts, EarthAI is designed to produce
      structured, temporal data streams suitable for direct ingestion by AI and machine-learning models.
      The i-scoop analysis describes EarthAI as "an end-to-end Earth intelligence platform" that
      collects surface data from satellite sources, processes it into standardised AI-ready datasets,
      and makes it queryable for change detection, risk prediction, environmental monitoring, and
      infrastructure assessment.

      Today the data supply relies primarily on publicly available satellite sources including the ESA
      Copernicus Sentinel-2 constellation, which delivers 10-metre-resolution optical imagery with a
      five-day global revisit time. Xoople's enterprise-AI blog states the company provides "the Earth
      data infrastructure layer built for AI," and the Series B press release claims the platform will
      "produce the most precise, reliable, scientific-grade data sets." The company has described its
      current data volumes as "petabytes" with a target trajectory toward "exabytes." Private preview
      customers confirmed in the Series B announcement include government agencies and Fortune 500
      companies across supply chain, infrastructure, agriculture, insurance, and urban-planning verticals.
      Exact customer counts have not been publicly disclosed.

      Xoople's differentiation strategy is explicitly data-quality and integration first, hardware second.
      CEO Fabrizio Pirondini stated in the BusinessWire press release that the company is "building the
      system of record for the physical world" — analogising the role to CRMs for customer data and
      cloud platforms for software data. TechCrunch independently described the strategic sequencing as
      unusual: Xoople embedded its platform inside Microsoft and Esri before building its own satellite
      supply, reversing the typical EO industry playbook of hardware first, distribution later.
