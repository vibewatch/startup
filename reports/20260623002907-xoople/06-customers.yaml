chapter:
  number: 6
  title: Customers
  summary: 'Xoople entered formal commercialization in Q2 2026 after seven years of stealth development, and its public customer record is accordingly thin. The Alaska Department of Transportation and Public
    Facilities (DoT) is the single named production deployment: a confirmed live engagement covering road condition and ice melt monitoring near the Juneau icefield, documented in a BBC StoryWorks film
    and official case-study materials, with a stated plan to expand to statewide coverage. Beyond Alaska DoT, the Series B press release discloses only that "government agencies and Fortune 500 companies"
    are current private-preview customers across supply chain, infrastructure, agriculture, insurance, and urban-planning verticals; no additional names, deal values, or customer counts have been disclosed.
    EY LLP is a multi-year go-to-market partner rather than a direct revenue customer. Standard durability metrics — NRR, GRR, churn, contract length, and cohort retention — are not public; all are null
    until private diligence. The principal commercial risk at this stage is the high concentration of verifiable proof in a single government agency, while the broader private-preview pipeline remains unverifiable.

    '
sections:
- id: customer-segmentation
  title: 'Customer Base Segmentation: Verticals, Buyers, and Use Cases'
  body: 'Xoople targets a multi-vertical customer base across both public-sector and large commercial enterprises, with the product positioned as an Earth data infrastructure layer rather than a vertical
    application. The company''s official Series B announcement identifies five use-case clusters where private-preview customers are already active: supply chain optimization and infrastructure monitoring;
    agricultural forecasting and resource planning; insurance risk modeling and disaster response; urban planning and infrastructure resilience; and scenario planning and forecasting. In its enterprise-AI
    blog, Xoople frames buyers specifically as organizations "in critical industries" facing "growing uncertainty and signal overload" — pointing to supply chain managers, infrastructure operators, insurers,
    and government agencies as the primary decision-makers. The HQ announcement from December 2025 adds specificity, naming transportation, financial services, and agriculture as three priority verticals
    for the Early Access Program launch.

    Geographically, the most concrete public-facing deployment evidence is US-centric (Alaska DoT), while the company''s registered headquarters in Spain, European investor base (Nazca Capital, MCH, CDTI),
    and Esri/Microsoft distribution partnerships suggest ambition across North American and European government procurement markets. The Early Access Program implies a hand-selected global customer intake
    rather than open-market sales, consistent with the "private preview" designation repeated across all Series B materials.

    The buyer-user-payer split differs by segment. In government, the buying entity is a public agency, the users are field operations and planning staff, and the payer is the public budget. In enterprise
    supply chain and insurance, the buyer is typically a procurement or innovation team inside a Fortune 500, the user is an analytics or risk team, and pricing flows through SaaS or data-subscription contracts.
    No pricing model or contractual structure has been publicly disclosed as of June 2026.

    EY LLP represents a structural partner rather than a standard customer: the multi-year engagement confirmed in EY''s own case study describes EY as co-developing go-to-market playbooks, validating data
    quality, and co-selling into EY''s client base — functioning as a channel partner and validator rather than a direct purchaser of the data product.

    '
