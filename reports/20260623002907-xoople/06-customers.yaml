figures:
- id: FU001
  title: 'Customer Journey Map: Segment Pathways to Xoople EarthAI Adoption'
  type: journey-map
  layout: wide
  summary: 'Maps the customer journey across Xoople''s three primary entry segments — government infrastructure, enterprise supply chain, and regulated industries (insurance/agriculture) — from initial
    problem recognition through private-preview onboarding to production deployment and expansion. All segments converge on the Early Access Program as the primary structured intake mechanism, then diverge
    into segment-specific deployment paths. The Alaska DoT represents the only confirmed node at Production Deployment.

    '
  approximationNotes: 'Journey stages for non-DoT segments are inferred from company use-case materials, EY case study workflow descriptions, and TechCrunch reporting. No customer-reported journey data
    is publicly available. The Production Deployment node is confirmed only for Alaska DoT; all other segments are at Private Preview or earlier.

    '
