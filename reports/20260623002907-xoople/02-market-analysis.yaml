  - id: "buyer-segmentation"
    title: "Buyer, user, and payer segmentation"
    body: "The Earth observation market supports a heterogeneous buyer base in which the person ordering data (the buyer), the person analyzing it (the user), and the organizational unit paying for it (the payer) are frequently different. This fragmentation has historically slowed enterprise adoption: procurement paths for EO data require specialized knowledge that most business units lack, and EO vendors have tended to sell through geospatial specialists rather than through the CIO or CDO.\n\nFor Xoople, the target buyer profile is the enterprise AI platform team or the senior operations executive (CPO, CDO, or CTO) who has already deployed an AI system and now recognizes that the system lacks reliable physical-world context. The user is typically an AI engineer, data scientist, or operations analyst. The payer is typically the business-unit budget owner — not the GIS department. This positioning deliberately bypasses the traditional EO procurement path and instead connects to the rapidly growing enterprise AI budget.\n\nSix major buyer segments emerge from the available evidence. Defense and intelligence buyers (typified by Vantor/Maxar's 60+ government partners and BlackSky's tactical ISR mandate) represent the largest incumbent spend, but Xoople's official materials do not describe a classified-mission or primary defense go-to-market. Civilian government buyers — urban planners, emergency management agencies, land-use regulators — rely on Copernicus and ESA open data supplemented by commercial analytics. Enterprise supply-chain and logistics buyers want port activity, commodity flow, and disruption signals. Finance and insurance buyers (the fastest-growing EUSPA sub-segment) want climate risk scoring, catastrophe event validation, and asset exposure mapping. Critical-infrastructure operators (utilities, energy, pipelines) want environmental compliance monitoring and asset-condition intelligence. Agricultural enterprises want crop health, yield forecasting, and subsidy-audit evidence.\n\nXoople's announced private-preview customers include government agencies and Fortune 500 companies, spanning supply chain, infrastructure, agriculture, insurance, and urban planning. Planet's buyer page lists agriculture, defense/intelligence, government, science, energy/infrastructure, finance, maritime, and sustainability as active market segments, confirming broad multi-vertical demand. ICEYE explicitly names insurance, government, banking, and utilities/energy as primary buyer segments for its SAR-based products. The commonality across these competitive buyer maps is that no single segment dominates commercial EO, and multi-vertical coverage is the norm rather than the exception."
