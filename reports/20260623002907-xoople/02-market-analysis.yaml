callouts:
  - calloutType: "risk"
    title: "Market definition mismatch: analysts measure different things"
    body: "Three major analyst estimates of the EO market — Fortune Business Insights ($7.04B, 2025), Grand View Research ($5.10B, 2024), and EUSPA (€3.4B, 2023) — are mutually inconsistent because they measure different scope boundaries. Using any one of these as Xoople's headline TAM is analytically misleading. The EUSPA estimate (data and value-added services only, no hardware) most closely matches Xoople's actual addressable stack. SAM and SOM estimates are not publicly available from any source."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM010"
      - "CM043"

  - calloutType: "risk"
    title: "Adoption barriers remain high for commercial-scale deployment"
    body: "OECD research as of 2026 confirmed that large-scale commercial EO adoption beyond expert user communities has proven difficult. Key barriers include significant investment costs to integrate and validate EO data, absence of quality reference datasets in many regions, unexplainable AI outputs, and regulatory data-sharing restrictions. Commercial EO providers face a 2026 revenue test as imagery supply can outpace paid demand. Xoople's value proposition partially addresses these barriers (AI-ready layer, ecosystem integration), but has not yet demonstrated renewal revenue at commercial scale."
    claimRefs:
      - "CM027"
      - "CM031"
      - "CM033"
      - "CM034"
      - "CM046"

  - calloutType: "insight"
    title: "Insurance and finance EO sub-segment: fastest organic growth"
    body: "EUSPA projects the insurance and finance EO segment will grow approximately 165% from 2023 to 2033, reaching approximately €900 million. This is the fastest-growing EUSPA sub-segment and aligns directly with Xoople's declared enterprise verticals of insurance risk modeling and supply-chain optimization. ICEYE, one of Xoople's most relevant commercial comps, specifically names insurance as its primary buyer segment."
    claimRefs:
      - "CM009"
      - "CM017"
      - "CM019"

