  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and Legal Risk: GDPR, Licensing, Export Control, and Dual-Use'
        blocks:
          - type: paragraph
            body: >-
              Xoople's core legal entity is Xoople S.L. (CIF B-88282090), registered at Calle San Germán 13, Madrid
              28020 Spain, and subject to Spanish commercial law and GDPR as a data controller established in the EU.
              The company's published privacy policy explicitly acknowledges GDPR obligations, documents six legal bases
              for personal-data processing, and names a whistleblower policy consistent with the EU Whistleblowing
              Directive — indicating a functioning compliance posture. Spanish Mercantile Registry data accessed via
              BORME confirms the entity is active; no insolvency, dissolution, or liquidation notice was found in the
              public record as of the June 2026 run date.

              The OECD's February 2026 policy brief documents that only a small number of countries (Canada, France,
              Germany, Japan, the United States) had explicit commercial remote sensing data regulation in place as of
              2024, and that the EU had no direct analogue, creating a patchwork licensing environment. Xoople will
              require a commercial remote sensing authorization from Spanish regulators under EU Space Law (Regulation
              2021/696 establishing the EU Space Programme) when its satellite constellation is launched, in addition to
              ITU frequency coordination and ICAO launch-safety notifications. No public disclosures about licensing
              status have been made.

              The most significant unaddressed regulatory risk is dual-use and export-control exposure stemming from the
              L3Harris relationship. L3Harris is a US defence prime contractor whose imaging payloads are developed in
              Rochester, New York, under US jurisdiction. Advanced optical sensing systems of this class typically carry
              International Traffic in Arms Regulations (ITAR) or Export Administration Regulations (EAR) implications,
              requiring US State Department or Commerce Department authorizations for export or re-export to non-US
              entities. Xoople has not disclosed any ITAR Technical Assistance Agreement (TAA), license exception, or
              export authorization in public materials. The Space Review's analysis of commercial remote sensing
              regulation confirms that the Wassenaar Arrangement imposes export controls on satellite technologies, but
              enforcement is inconsistent across jurisdictions.

              Finally, Xoople's EarthAI platform collects and processes data about physical-world change that can
              include sensitive information about collective groups, infrastructure, and military activity — precisely
              the dual-use categories flagged by the OECD as creating privacy and national-security regulatory
              challenges. The EU AI Act (Regulation 2024/1689), which begins applying to high-risk AI systems, may
              require Xoople to undertake conformity assessments if its agentic AI outputs are used in critical
              infrastructure or public-sector decision-making contexts.
