          embedded distribution agreement
        - >-
          Distribution-first model collapses without ecosystem channel; forces direct sales rebuild at 3-5x higher CAC;
          delays ARR ramp by 18-36 months
        - Downgrade to Avoid; re-evaluate only with evidence of replacement channel at equivalent scale
      - - Constellation delay beyond 2030
        - >-
          Official announcement or credible reporting placing first-light date later than December 2030; or silence
          through December 2027 with no milestone update
        - >-
          Proprietary data moat delayed; pre-constellation gross margin compression continues; requires additional
          dilutive financing to bridge the constellation gap
        - Move to research-more; timeline risk now dominates; await constellation financing structure
      - - ITAR/export-control enforcement action
        - >-
          US State Department or Commerce Department enforcement notice involving L3Harris optical payload
          co-development; or public litigation related to dual-use data exports
        - >-
          L3Harris partnership frozen or terminated; constellation program paused; product roadmap disrupted; regulatory
          overhang discounts valuation 30-50%
        - Immediate tracking suspension; legal diligence required before re-entry
      - - CEO or CFO departure before first revenue filing
        - >-
