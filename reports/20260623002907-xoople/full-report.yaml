      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution-first strategy provides enterprise moat ahead of proprietary data
            body: >
              By embedding EarthAI inside Microsoft Azure, Power BI, Esri ArcGIS, and Databricks before owning its own
              satellite supply, Xoople has secured distribution in the two dominant enterprise geospatial ecosystems.
              When its proprietary constellation is operational, the distribution pipes are already in place — a
              critical competitive advantage that rivals would need years to replicate.
