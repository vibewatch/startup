      - number: '5.5'
        title: Trust, Security, Privacy, and Quality Controls
        blocks:
          - type: paragraph
            body: >
              Xoople's documented privacy and compliance framework starts with GDPR. The company's privacy policy
              identifies the legal controller as Xoople S.L. (CIF B88282090) in Madrid, Spain, confirms full GDPR
              compliance including data subject rights (access, rectification, erasure, portability, and objection), and
              specifies that data is processed only under lawful bases including consent, contractual necessity, legal
              obligation, and legitimate interest. The policy explicitly states that Xoople "does not carry out
              automated decision-making, including profiling" except with express user consent, which is a relevant
              safeguard given that EarthAI is marketed as an AI-ready data layer. Cross-border data transfers are
              covered by Standard Contractual Clauses. The policy was last updated on 26 September 2023, meaning it
              predates the Series B and the expansion to Fortune 500 and government preview customers, and may not fully
              reflect the current data processing scope.

              The EY engagement described in the published case study represents the most detailed technical trust
              validation available. EY's team applied a zero-trust architecture with least-privileged access, user-based
              access controls, and continuous verification to the Xoople dataset and infrastructure. Gusher (EY Americas
              AI and Data Leader) stated: "Building trust into this data set was absolutely an imperative and
              foundational part of this program." EY validated Xoople's data against the EY.ai Value Blueprints, a
              structured AI trust framework with layers covering intelligence, trust, and customer dimensions. This is
              meaningful third-party validation but it comes from a commercial partner, not an independent auditor.

              Significant trust and compliance gaps remain. No ISO 27001, SOC 2, FedRAMP, or equivalent security
              certification has been published. No SLA, uptime commitment, or data quality metric has been made public.
              No independent technical benchmarks or data accuracy assessments appear in the public record. The OECD's
              2026 analysis of satellite EO data notes that building trust in satellite imagery and AI predictions
              requires "interpretable models" rather than black-box approaches, and that "the integrity of the satellite
              imagery supply chain is vulnerable to malicious tampering." Xoople's public materials do not address data
              provenance, chain-of-custody attestation, or vulnerability disclosure processes. The terms of use disclaim
              all liability for errors or omissions, consistent with early-stage enterprise SaaS but below enterprise
              procurement standards for security-sensitive verticals like government and insurance.
