      - number: '8.5'
        title: Final Diligence Asks and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The most important diligence ask is a management KPI package covering: total contracted ARR from Q2-Q4
              2026 signed contracts, customer count and industry breakdown, average contract value and duration, gross
              margin on early contracts, monthly cash burn and runway projection, and constellation deployment milestone
              plan with dates. This package alone would move the recommendation from Track to a more decisive call in
              either direction within a single due diligence cycle. Secondary asks include the full cap table with
              preference stack and liquidation waterfall, the technical assistance agreement or export authorization
              covering the L3Harris optical payload under ITAR, and independently verified references from at least two
              paying customers.

              Thesis-break triggers define the conditions under which the Track call becomes Avoid without further
              diligence. The most severe trigger is a confirmed down-round: any Series C at a valuation below the
              implied Series B mark would signal commercial underperformance and preference-stack overhang. A second
              trigger is loss of the Microsoft or Esri distribution channel, which would require Xoople to rebuild
              direct sales infrastructure at significantly higher cost and slower velocity. A third trigger is a
              constellation delay announcement putting first light beyond 2030, because Xoople's competitive
              differentiation relative to commodity ESA Sentinel-2 data depends critically on proprietary sensing. A
              fourth trigger is any public regulatory enforcement action or ITAR/export-control citation related to the
              L3Harris payload, which would freeze development and potentially require restructuring the partnership.
              Finally, a CEO or CFO departure before the first annual revenue filing would significantly increase
              execution risk given the founder-centric governance structure observed in all available public materials.
              Monitoring these triggers over a twelve-month tracking horizon requires no private information: all five
              are detectable from press releases, regulatory filings, ecosystem partner announcements, and government
              procurement databases.
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV005
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Track — Await Q3-Q4 2026 Commercial Proof
            body: >-
              The recommendation is Track with medium confidence. Xoople has a credible thesis, domain-experienced
              founders, and $225M in institutional capital, but the implied $1B+ valuation cannot be underwritten from
              available public evidence. No revenue, ARR, customer count, gross margin, or constellation schedule has
              been disclosed. Entry discipline requires at minimum three signed enterprise contracts with disclosed ACVs
              before the call moves to Research-More or Buy.
            calloutType: recommendation
            claimRefs:
              - CV031
              - CV034
              - CV035
          - type: callout
            title: Valuation Stretched — Pre-Revenue Unicorn Claim Without Evidence
            body: >-
              CEO Fabrizio Pirondini stated publicly that Xoople is in "unicorn territory" (≥ $1 billion valuation), but
              no post-money figure has been disclosed. Public EO comparable companies Planet Labs (33x P/S), BlackSky
              (13x P/S), and Spire Global (11x P/S) require confirmed recurring revenue to justify their current market
              prices. At mid-range multiples of 15-20x, Xoople would need $50-67 million in ARR to justify a $1 billion
              entry, and none of that ARR has been confirmed as contracted.
            calloutType: risk
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV036
          - type: callout
            title: Distribution-First Model Reduces Capex But Delays Data Economics
            body: >-
              Xoople's decision to commercialize via embedded distribution (Microsoft Fabric, Esri ArcGIS, Databricks)
              before launching its own satellites is strategically rational: it validates enterprise demand at lower
              near-term capital intensity than a constellation-first approach. However, this means the current platform
              generates margins compressed by third-party data licensing costs (ESA Sentinel-2 data is free but cloud
              processing adds cost). The proprietary gross margin profile — which could approach Planet Labs' 56% — only
              materializes after the L3Harris constellation is operational, making the constellation timeline a critical
              valuation driver.
            calloutType: insight
            claimRefs:
              - CV031
              - CV017
              - CV013
              - CV022
