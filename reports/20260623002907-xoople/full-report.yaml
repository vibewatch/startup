      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Market definition mismatch: analysts measure different things'
            body: >-
              Three major analyst estimates of the EO market — Fortune Business Insights ($7.04B, 2025), Grand View
              Research ($5.10B, 2024), and EUSPA (€3.4B, 2023) — are mutually inconsistent because they measure
              different scope boundaries. Using any one of these as Xoople's headline TAM is analytically misleading.
              The EUSPA estimate (data and value-added services only, no hardware) most closely matches Xoople's actual
              addressable stack. SAM and SOM estimates are not publicly available from any source.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM043
          - type: callout
            title: Adoption barriers remain high for commercial-scale deployment
            body: >-
              OECD research as of 2026 confirmed that large-scale commercial EO adoption beyond expert user communities
              has proven difficult. Key barriers include significant investment costs to integrate and validate EO data,
              absence of quality reference datasets in many regions, unexplainable AI outputs, and regulatory
              data-sharing restrictions. Commercial EO providers face a 2026 revenue test as imagery supply can outpace
              paid demand. Xoople's value proposition partially addresses these barriers (AI-ready layer, ecosystem
              integration), but has not yet demonstrated renewal revenue at commercial scale.
            calloutType: risk
            claimRefs:
              - CM027
              - CM031
              - CM033
              - CM034
              - CM046
          - type: callout
            title: 'Insurance and finance EO sub-segment: fastest organic growth'
            body: >-
              EUSPA projects the insurance and finance EO segment will grow approximately 165% from 2023 to 2033,
              reaching approximately €900 million. This is the fastest-growing EUSPA sub-segment and aligns directly
              with Xoople's declared enterprise verticals of insurance risk modeling and supply-chain optimization.
              ICEYE, one of Xoople's most relevant commercial comps, specifically names insurance as its primary buyer
              segment.
            calloutType: insight
            claimRefs:
              - CM009
              - CM017
              - CM019
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and category map
        blocks:
          - type: paragraph
            body: >-
              Xoople enters a market that is simultaneously fragmented at the data-provision layer and consolidating
              around a handful of enterprise distribution gatekeepers. TerraWatch's analysis of commercial EO evolution
              identifies three prior waves — horizontal imagery pioneers (Planet, Satellogic, BlackSky), vertical-domain
              specialists (GHGSat, OroraTech), and backward-integrated analytics firms (Tomorrow.io, EarthDaily) — and
              Xoople represents a potential fourth wave: AI-native data infrastructure companies that skip pure imagery
              sales and position Earth data as a continuous context feed for enterprise AI systems. This positioning
              places Xoople in competition with five distinct competitor classes simultaneously.


              Direct imagery peers are the first class: Planet, BlackSky, and Satellogic each operate proprietary
              constellations and increasingly sell analytics layered on top, closing the gap with Xoople's stated value
              proposition. Incumbent geospatial empires — Airbus Defence & Space and Vantor (formerly Maxar) — dominate
              the premium-resolution and government-GEOINT segments with decades of customer relationships and
              proprietary sensing assets. Adjacent SAR specialists ICEYE and Capella Space offer all-weather day/night
              coverage that optical-only platforms (including Xoople's planned constellation) cannot replicate.
              Enterprise distribution platforms — primarily Google Earth Engine (analytics) and Esri ArcGIS (GIS
              workflows) — represent both substitutes and potential distribution channels. Finally, the status quo
              alternative for most enterprise AI teams today is a combination of Copernicus open data, internal
              analytics engineers, and static GIS basemaps — a substitute that requires no additional budget but
              delivers the incomplete physical-world grounding that Xoople explicitly targets.


              The competitive risk most specific to Xoople is that its current platform relies on third-party and open
              satellite data, making it data-equivalent to any well-resourced competitor until its own L3Harris-built
              constellation reaches orbit. The table below maps each competitive class against scale, target segment,
              and stated differentiation.
