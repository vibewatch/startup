      - number: '6.2'
        title: 'Named Customer Proof: Alaska DoT and the Early Access Program'
        blocks:
          - type: paragraph
            body: >
              The Alaska Department of Transportation and Public Facilities is the only named, publicly documented
              production deployment in Xoople's customer record as of June 2026. The critical infrastructure use-case
              page confirms a live engagement: Xoople provides AI-powered change detection from satellite data to help
              the DoT monitor road conditions near the Juneau icefield, detect early flood risk indicators such as
              shifting snowfall patterns, and pre-plan bridge closures and emergency resource deployment before weather
              events occur. The company claims the solution reduced analysis time from "days of analysis" to "minutes."
              A BBC StoryWorks Commercial Productions film titled "Guarding the Glaciers," published on the Xoople
              YouTube channel, provides visual corroboration: it features named Juneau resident Jossline Jackson and
              documents the DoT's operational challenge of managing infrastructure near the melting Mendenhall Glacier
              icefield. The Alaska DoT's own public website confirms the agency relies on ArcGIS-based EGIS tools for
              infrastructure monitoring, corroborating Xoople's claim that its data integrates via the Esri ArcGIS
              distribution partner.

              The critical infrastructure page further states that Xoople is "expanding our scope to monitor the entire
              state of Alaska" — which, if executed, would represent a meaningful increase in the scope of the single
              named government deployment. No contract value, SLA, renewal terms, or public RFP record has been found to
              corroborate the commercialization stage or duration of the Alaska DoT relationship.

              Beyond Alaska DoT, the December 2025 HQ announcement launched an "Early Access Program" — described as "an
              exclusive model that allows global pioneering companies to access and tailor Xoople solutions under
              private preview." Capital Riesgo and EU Startups independently confirm that the first clients in the
              Private Access Program include government agencies and Fortune 500 companies. The EY case study documents
              EY's multi-year role as go-to-market partner: EY and Xoople developed "go-to-market strategies and
              programs for clients, including playbooks to explain the insights derived from these data sets."
              TechCrunch adds that CEO Pirondini described use cases including "government agencies tracking
              transportation networks and damage from natural disasters, agribusiness monitoring crop health, or large
              firms keeping an eye on infrastructure projects or supply chains." No customer name, reference quote,
              independent case study, or usage metric has been made public for the non-DoT private-preview cohort.
