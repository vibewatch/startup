            title: Constellation hardware execution risk is the central product-delivery uncertainty
            body: >
              The quantum leap in data quality promised by the L3Harris constellation (100x precision vs current gold
              standard) is the product's core long-term value proposition, but no satellite count, launch date, orbital
              parameters, resolution, or revisit frequency has been disclosed. Hardware manufacturing, launch
              scheduling, and constellation deployment are capital-intensive and schedule-sensitive. All current product
              capability runs on third-party data that Xoople does not control. If constellation execution slips
              materially, the business remains dependent on commoditised ESA and commercial EO supply indefinitely.
            calloutType: risk
            claimRefs:
