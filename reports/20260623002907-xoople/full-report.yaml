  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Xoople positions itself inside what it calls EarthAI infrastructure: a real-time, AI-ready data layer that
              gives enterprise AI systems a verified ground truth of physical changes on the Earth's surface. This
              category sits between the upstream satellite observation segment (sensors, constellations, ground
              stations) and the downstream enterprise software stack (ERP, supply-chain platforms, risk systems). The
              company's own published thesis states that most enterprise AI models leverage only linguistic intelligence
              and lack direct perception of the physical world, creating a foundational data gap that no existing LLM
              provider fills. The included spend in Xoople's market therefore centers on calibrated Earth data products,
              change-detection APIs, operational monitoring subscriptions, and AI-ready analytics delivered into
              enterprise and government decision workflows — not raw imagery pixels, not GNSS navigation data, and not
              satellite manufacturing or launch services.


              The broader Earth observation downstream market, which is the market Xoople draws analysts' attention to
              when pitching scale, covers a wider range of products: processed imagery, risk layers, dashboards,
              geospatial alerts, sector-specific analytics, and decision-support tools. EUSPA's 2024 framework
              explicitly frames EO as a commercial information market rather than a satellite industry, noting that the
              end customer often never views a raw satellite scene. A crop producer buys a vegetation-stress alert; an
              insurer buys a flood exposure model; a port operator uses a monitoring dashboard. That layered commercial
              structure defines the segment boundary that matters for Xoople.


              Status-quo substitutes include: manual field surveys and ground-monitoring networks (high cost, low
              frequency); enterprise GIS platforms such as Esri ArcGIS and Google Earth Engine that offer historical and
              static geospatial layers but lack the continuous AI-ready change signal; and raw imagery providers
              (Planet, Satellogic, BlackSky, Airbus OneAtlas, Vantor) that supply pixels but require the buyer to build
              the analytics stack. The EarthAI infrastructure layer Xoople is building does not yet have a direct
              comparable at commercial scale; the nearest analogs are Google Earth Engine's commercial tier and
              Microsoft Planetary Computer Pro, but both are platform tools rather than plug-in enterprise AI context
              feeds.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM038
