      - number: '7.2'
        title: 'Operational and Technical Risk: Constellation Delivery, Data Quality, and Platform Dependency'
        blocks:
          - type: paragraph
            body: >-
              The single largest operational risk Xoople faces is the undisclosed delivery timeline for the L3Harris
              co-developed satellite constellation. As of June 2026, the company has disclosed only that a constellation
              exists, that it is optimized for AI-era Earth observation, and that the imaging payloads are being
              developed by L3Harris in Rochester. No satellite count, launch vehicle, launch date range, orbital
              parameters, or phased-deployment plan has been made public. The current production platform is built on
              ESA Copernicus/Sentinel-2 open data, which gives Xoople no proprietary data differentiation until first
              light on its own sensors. Competitors such as Planet Labs (which disclosed constellation status and sensor
              count in SEC filings) and BlackSky (which reported satellite-level operational data in its 10-K)
              demonstrate that proprietary constellation management carries material technical and financial risk —
              Planet's FY2026 10-K and BlackSky's fiscal-year 10-K document extensive risk factors around launch
              failures, satellite anomalies, and capex intensity. Both filing sets were access-blocked or error-paged
              from EDGAR at the time of this research run, but prior disclosures from those companies confirm
              constellation risk is real and ongoing.

              Data quality and calibration risk is structurally elevated for Xoople relative to a standard EO imagery
              business because customers are expected to feed EarthAI outputs directly into autonomous AI decision
              pipelines. The OECD warns that AI methods in EO are often not explainable, and that errors in AI-derived
              outputs carry "material consequences" at scale. Xoople's claim that AI-era customers "make decisions where
              even a 1% error is unacceptable" implicitly sets an extremely high accuracy bar — one that has never been
              independently benchmarked for the current platform.

              Platform dependency risk is layered: Xoople distributes via Microsoft Azure, Power BI, Esri ArcGIS, and
              Databricks. A change in terms, pricing, or partnership priority by any of these platforms could strand
              Xoople's go-to-market without an alternative channel. No SLA, exclusivity agreement, or guaranteed listing
              term has been publicly disclosed for any of these distribution partnerships. Cybersecurity exposure is
              also unaddressed in public materials: the OECD notes that satellite EO signals are vulnerable to spoofing,
              and Xoople has no published SOC 2 attestation or ISO 27001 certification in its public documentation.
