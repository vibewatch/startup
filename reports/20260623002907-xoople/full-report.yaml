      - number: '4.2'
        title: Pricing, monetization approach, and ecosystem partner economics
        blocks:
          - type: paragraph
            body: >-
              Xoople has not published any public pricing for EarthAI subscriptions, API access, or enterprise contracts
              as of June 2026. This absence is expected for a company at the very start of commercialization with a
              target customer base of large enterprises and government agencies, where deal structures are typically
              customized and confidential. The ecosystem integration model further complicates list pricing because
              Xoople's distribution through Microsoft and Esri implies revenue-sharing or white-label arrangements whose
              economic terms are not public. The supply chain use case published by Xoople describes combining Earth
              data with Power BI for operational intelligence, implying that at least some enterprise buyers are large
              companies with existing Microsoft subscriptions, making Xoople's add-on pricing a negotiated enterprise
              extension rather than a fixed SaaS tier. For pricing benchmarks, Planet Labs (the best-capitalized
              public-market EO data comparator) offers subscription-based contracts at negotiated enterprise rates with
              no public rate card; Planet's FY2026 revenue was $307.7 million, built on subscriptions and usage-based
              contracts. BlackSky similarly structures customers into On-Demand and Assured subscription tiers with
              multi-year annual contracts but no public pricing. These comparables confirm that enterprise EO pricing is
              opaque by industry convention. Xoople's EY partnership adds a further GTM dimension: EY developed
              go-to-market strategies and integration playbooks, suggesting a consulting-led channel alongside the
              technology distribution channels. The Early Access Program preceded full commercialization and likely
              generated no meaningful recurring revenue on its own. The first diligence question for any serious
              investor is the price and contract structure of the first commercial agreements signed in Q2–Q3 2026.
