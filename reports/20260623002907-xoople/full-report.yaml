      - number: '7.3'
        title: 'Partner and Dependency Risk: L3Harris, Distribution Platforms, and Government Stakeholders'
        blocks:
          - type: paragraph
            body: >-
              Xoople's value chain has three structural single points of failure, each of which could independently
              impair the investment thesis. First, L3Harris is the sole disclosed supplier of imaging payloads for the
              proprietary constellation — a relationship described as "exclusive long-term co-development" with no
              disclosed backup or second-source option. A delivery delay, pricing renegotiation, export-licensing
              complication, or strategic pivot at L3Harris could defer or eliminate Xoople's proprietary data
              differentiation indefinitely. L3Harris is a large-cap US defense prime (market capitalisation
              approximately $30–40B) and Xoople represents a small client relationship in context — alignment incentives
              are structurally asymmetric.

              Second, Xoople's distribution network (Microsoft, Esri, Databricks) creates a partnership dependency that
              Xoople does not control. Microsoft announced the end-of-life transition for Azure Planetary Computer in
              2025 toward Planetary Computer Pro (a paid service), indicating that platform terms for Microsoft-based EO
              infrastructure can change at Microsoft's discretion. Esri's partner ecosystem has over 5,000 registered
              partners; preferential listing is not guaranteed. Databricks similarly manages a large partner ecosystem
              where Xoople has no disclosed exclusivity.

              Third, government stakeholder risk is bifurcated. On the revenue side, Alaska DoT is the only named
              production customer; its loss removes the only publicly verifiable deployment proof. On the funding side,
              the CDTI Innovación grant of €16.74 million and the Spanish government's designation of Xoople as a
              "Strategic Enterprise" create a bilateral commitment that, while largely beneficial, also implies
              conditions, oversight expectations, and political sensitivities around job creation and Spanish technology
              sovereignty. These obligations could constrain certain strategic options (e.g. non-Spanish headquarters
              relocation or US-based acquisition) without a negotiated release. TerraWatch Space has noted that
              commercial EO companies face a "continued government dominance" buyer dynamic that makes
              private-enterprise revenue harder to scale — a structural risk that is directly applicable to Xoople's
              current customer mix.
