      - number: '6.3'
        title: Adoption Trajectory and Go-to-Market Entry
        blocks:
          - type: paragraph
            body: >
              Xoople's adoption trajectory must be understood in the context of its commercialization timeline: the
              company operated in stealth from 2019 to May 2025, launched an Early Access Program in December 2025, and
              announced formal commercialization alongside its Series B in April 2026. The customer base in June 2026 is
              therefore at the earliest possible stage of a software deployment cycle.

              The strongest adoption signal is the Alaska DoT deployment, which moved from proof-of-concept to a
              production monitoring engagement covering the Juneau icefield, with a stated plan to expand to statewide
              coverage. The EY case study, spanning multiple years from initial engagement to the Series B period,
              confirms that Xoople's data was "put through extensive testing and enablement" and validated across supply
              chain, infrastructure, and insurance use cases — suggesting that the technical onboarding cycle for
              enterprise customers is non-trivial and multi-year.

              The company's go-to-market model is distribution-first: Xoople integrates its data layer into Microsoft
              Power BI, Esri ArcGIS, and Databricks rather than building a standalone portal. This approach lowers
              adoption friction for existing enterprise customers of those platforms but makes it difficult to measure
              Xoople-specific usage independently. CEO Pirondini explained the model to TechCrunch: "Our business model
              is all about embedding our data and our solutions directly to the ecosystem of those so that they can
              provide those services directly to their customers." The Streamly expert profile confirms Pirondini as
              Co-founder and CEO managing this distribution thesis.

              TerraWatch Space CEO Aravind Ravichandran told TechCrunch that the distribution-first strategy was
              "intriguing" but noted a structural tension: "They laid the distribution pipes before having their own
              data supply — embedding into Microsoft and Esri, the two platforms where enterprise, government and most
              GIS buyers already live, but neither has proprietary EO data. Google's head start on geospatial AI models
              is the benchmark they'll be measured against." This analysis underscores both the opportunity (embedded
              distribution) and the limitation (no proprietary data differentiation during the private-preview window).

              Total customer count, average contract value, time-to-close, and pipeline metrics have not been disclosed.
              The CDTI Innovación grant of €16.74 million validates the R&D program but provides no customer data. No
              revenue figure has been made public.
