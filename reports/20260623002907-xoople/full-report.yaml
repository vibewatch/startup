      - number: '5.3'
        title: Deployment, Integrations, and Customer Workflow Delivery
        blocks:
          - type: paragraph
            body: >
              Xoople delivers its Earth intelligence through integrations with the enterprise platforms where buying
              decisions already happen. The supply chain use case page explicitly names Microsoft Power BI as the
              delivery environment: "By combining Xoople's Earth data feed with internal data sources inside Power BI,
              businesses can finally see the full picture." This integration allows companies to merge environmental
              intelligence with demand forecasts, operational metrics, and financial data inside a tool they already
              use. The critical infrastructure use case describes how Xoople works with the Alaska Department of
              Transportation and Public Facilities (DoT) to monitor road conditions near the Juneau icefield, combining
              satellite change detection with AI to predict flood risk and road closures before they occur. The
              company's own narrative claims "What once took days of analysis can now happen in minutes."

              Xoople is expanding the Alaska DoT deployment from Juneau to full statewide monitoring. The Living Legacy
              film produced with BBC StoryWorks Commercial Productions documents the Juneau use case in narrative form,
              confirming it as a live deployment. SpaceNews confirmed that Xoople's system combines its data with
              cloud-based infrastructure including Microsoft Planetary Computer Pro, which is Microsoft's environment
              for bringing AI-powered geospatial insights into analytics workflows. TNW independently described the
              Microsoft relationship as structural: Xoople's platform runs on Azure and is integrated with Planetary
              Computer Pro, while Esri serves as a distribution partner.

              Google Earth Engine provides a parallel example of what an AI-ready EO developer platform looks like at
              scale: 80+ petabytes of data, a public Python and JavaScript API, and documented use by scientists,
              researchers, and enterprise developers. Planet Labs' Data API illustrates the REST API pattern — search,
              task, order, and download — that commercial EO platforms have standardised. Xoople has not yet published
              equivalent developer-facing materials, which limits the ability for third-party developers to evaluate,
              prototype, or independently validate the platform. The EY engagement is the most detailed independent
              technical evidence available, but it remains a partnership-driven case study rather than an arms-length
              technical assessment.
