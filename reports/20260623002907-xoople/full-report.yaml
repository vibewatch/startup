            title: EY zero-trust engagement is best available trust evidence but comes from a commercial partner
            body: >
              EY's published case study is the most detailed independent technical evidence for Xoople's data-security
              architecture and AI governance approach. The zero-trust, least-privilege, and continuous-verification
              controls described represent credible enterprise-grade security design. However, EY is a commercial
              consulting and go-to-market partner — not an independent security auditor. An ISO 27001, SOC 2, or
              equivalent certification from an arms-length audit firm would provide much stronger signal for enterprise
              and government procurement decisions.
