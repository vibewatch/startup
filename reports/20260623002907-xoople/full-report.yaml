      - number: '7.4'
        title: 'People and Execution Risk: Key-Person Concentration and Governance Opacity'
        blocks:
          - type: paragraph
            body: >-
              Xoople's leadership team has deepened materially around the founding pair since the Series B, adding Jamie
              Ritchie as Chief Business Officer, Massimiliano Vitale as Chief Operating Officer, Jeff Rath as EVP
              Finance and Strategy, and Chris Hoeschen as Chief Legal Officer. This bench addresses the most glaring
              scale-up gaps. However, the company retains classic founder-centric risk: CEO Fabrizio Pirondini is the
              public face of every major relationship (L3Harris, investor communications, media), and CFO Alvaro
              Coronado co-signed the original funding materials. The OfficialBoard organizational profile for Xoople
              does not list any independent board members, and no governance structure — shareholder agreement, board
              committee charter, or equity-plan disclosure — has been made public. Elreferente.es confirmed the Endeavor
              selection in April 2026, which is a reputational endorsement but does not substitute for structural
              governance.

              Execution risk is particularly acute in two dimensions. The first is the pivot from a seven-year R&D
              organization to a commercial-velocity operation. Both Pirondini and Coronado have deep EO mission
              experience at Deimos Imaging, but managing enterprise SaaS growth — customer success, contract negotiation
              at scale, professional services, analyst relations — is a different operating motion that neither founder
              has done in a high-velocity context. The second is the technical transition from a
              Copernicus-data-dependent platform to a proprietary constellation: integrating new sensing hardware,
              on-orbit operations, and ground segment management at the same time as scaling commercial distribution is
              an extremely demanding multi-front execution challenge. No public headcount or organizational structure
              document exists to assess whether Xoople has the depth required for this transition.
