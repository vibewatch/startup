      - number: '2.5'
        title: Sizing gaps, contradictory evidence, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The most consequential gap in this market analysis is the absence of a published SAM or SOM estimate from
              Xoople or from any analyst for the specific category of AI-ready EarthAI data infrastructure. Every market
              estimate reviewed covers either the broader EO ecosystem (Fortune, Grand View, EUSPA) or the geospatial
              intelligence market that is gated behind paywalls (MarketsandMarkets, TerraWatch). None isolates the
              portion of enterprise AI spend that specifically addresses physical-world grounding needs. That missing
              estimate materially limits the ability to underwrite the $225 million capitalization against a coherent
              revenue opportunity.


              A second gap concerns whether Xoople's current commercial traction derives from government or enterprise
              buyers. The private-preview customer base includes both government agencies and Fortune 500 companies, but
              no revenue split, contract size, or renewal evidence is public. Government buyers represent reliable but
              slower and more complex procurement pathways; enterprise buyers represent faster sales cycles but higher
              adoption friction as EO data is novel to most AI teams.


              The three contradictory market estimates — Fortune ($7.04B 2025), Grand View ($5.10B 2024), EUSPA (€3.4B
              2023) — cannot be reconciled without analyst scope definitions that none of the available texts fully
              discloses. This is preserved as a material conflict rather than smoothed. The practical consequence for
              valuation is that a Xoople investor could cite any of these figures as the headline TAM with roughly equal
              justification, which makes market-sizing arguments easy to construct but hard to validate. Any due
              diligence conversation should anchor the SAM question first — what share of the EUSPA €3.4B services stack
              is genuinely AI-infrastructure spend, and what share is legacy analytics?
            claimRefs:
              - CM001
              - CM006
