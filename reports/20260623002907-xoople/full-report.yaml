  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters for valuation
      - Owner / diligence path
    rows:
      - - Contracted ARR and commercial traction
        - >-
          Number of signed contracts, ACV range, customer industry breakdown, and total contracted ARR from Q2-Q4 2026
          commercial launch period
        - >-
          Without ARR, valuation is entirely milestone-based; even $5-15M in contracted ARR would anchor the multiple
          discussion; absence of any figure is the single largest underwriting gap
        - >-
          Direct management request; alternatively, monitoring Xoople press releases, partner announcements (Microsoft,
          Esri), and government procurement databases for named contracts
      - - Post-money Series B valuation and cap table
        - >-
          Exact post-money valuation, investor ownership percentages, preference share terms, liquidation waterfall, and
          anti-dilution provisions
        - >-
          Preference overhang is invisible without this data; a 2x liquidation preference on $225M of prior capital
          would require $450M+ in proceeds before common shareholders receive any value in an acquisition scenario
        - >-
          Direct investor data room request; Spanish Mercantile Registry (BORME) may disclose share class structures for
          Xoople S.L. in future filings
      - - Gross margin and cost structure
        - >-
          Gross margin on early commercial contracts; data licensing cost as % of revenue; cloud infrastructure costs;
          expected margin profile pre- and post-constellation
        - >-
          The distribution-first model may generate 30-45% gross margins on third-party EO data vs. 50%+
          post-constellation; margin trajectory determines IRR sensitivity
        - >-
          Direct management request; comparable Planet Labs 10-K discloses cost of revenue detail that provides a
          reference framework
      - - Constellation deployment schedule and capex
        - >-
          Satellite count, target orbital parameters, launch vehicle, launch window, and total constellation CAPEX
          requirement; current phase of L3Harris sensor development
        - >-
          Constellation is the long-term differentiation driver; deployment timing determines when the business
          transitions from third-party data margins to proprietary data economics
        - >-
          Direct management request; L3Harris SEC filings and earnings calls may reference the program timeline;
          SpaceNews and industry tracking services monitor constellation developments
      - - Export control and ITAR status of L3Harris payload
        - >-
          Confirmation of Technical Assistance Agreement (TAA) or license exception covering transfer of US-origin
          optical sensing technology to Xoople S.L. (a Spanish entity)
        - >-
          ITAR/EAR enforcement could freeze the co-development agreement and stop constellation development; this is a
          binary regulatory risk with no market-visible status indicator
        - >-
          Direct legal disclosure in data room; L3Harris public communications; US State Department or Commerce
          Department licensing databases
      - - Board composition and governance structure
        - >-
          Full board roster including independent directors, investor-nominated seats, protective provisions, and
          audit/compensation committee structure
        - >-
          Governance opacity at this funding stage suggests either founder control provisions or investor governance
          terms that may constrain future fundraising or liquidity options
        - >-
          Direct management/investor disclosure; Spanish Mercantile Registry public corporate records for Xoople S.L.
          board filings
    notes: >-
      All diligence asks represent information absent from public sources as of 2026-06-23. Priority ordering: ARR
