    rows:
      - - AI-native constellation design (co-developed with L3Harris)
        - >-
          Constellation undeployed; competitors can develop AI-optimized sensors on similar 2–4 yr timelines; claim
          unverified without specs
        - High
        - >-
          Verify L3Harris contract scope, satellite count, orbital specs, and launch schedule in data room; request
          pre-commercial sensor technical brief
      - - Ecosystem lock-in via Microsoft and Esri integrations
        - >-
          Any data provider can pursue identical integrations with sufficient commercial investment; exclusivity status
          unknown
        - High
        - >-
          Confirm in writing whether Xoople-Microsoft and Xoople-Esri agreements carry data-exclusivity or
          preferred-partner provisions; flag as diligence blocker if non-exclusive
      - - Seven years of proprietary AI model development
        - >-
          Models trained on open/third-party data can be replicated or surpassed by well-funded incumbents (Google,
          Planet, Airbus) with larger data assets and engineering teams
        - Medium
        - >-
          Assess IP portfolio (patents granted vs. pending); evaluate training dataset ownership; request model
          performance benchmarks vs. public alternatives
      - - First-mover positioning in EarthAI infrastructure category
        - >-
          Google Earth AI initiative, Planet Planetary Variables, and Airbus analytics are all actively developing
          AI-ready data layers; first-mover advantage erodes quickly without proprietary data supply
        - High
        - >-
          Commission independent competitive benchmark vs. Google Earth AI and Planet Planetary Variables on
          calibration, latency, and enterprise-integration depth
      - - Private-preview government and Fortune 500 customer base
        - >-
          Customer count, ARR, contract sizes, and renewal rates are all undisclosed; cannot verify depth of commercial
          traction
        - Medium
        - Request customer list, ARR, average contract value, and renewal/expansion evidence in due diligence data room
      - - $225M total funding provides runway for constellation build
        - >-
          Capital alone does not create moat; if constellation delayed beyond 2–3 years, runway may be insufficient to
          sustain commercial operations through satellite launch at current spend level
        - High
        - >-
          Verify cash on hand, monthly burn rate, and capital plan for constellation development in parallel with
          commercial commercialization
      - - Precision superiority claimed (orders-of-magnitude improvement)
        - >-
          Claim is self-reported; Capella Space offers 0.25 m SAR commercially and Airbus Pléiades Neo offers 30 cm
          optical — both best-in-class benchmarks; 'orders-of-magnitude' improvement vs. these is not plausible without
          radically different sensor architecture
        - Medium
        - >-
          Obtain pre-commercial technical specifications; clarify what metric 'precision' and 'speed' refer to;
          commission independent sensor benchmark before investing based on this claim
      - - Copernicus open-data dependency before constellation launch
        - >-
          Xoople's current platform uses Sentinel-2 and other open data equally available to all competitors; data moat
          is effectively zero until constellation deploys
        - High
        - >-
          Map exact data dependency: what % of current product is built on open vs. licensed data; model scenario where
          Copernicus access changes or competitors build equivalent pipeline on same sources
    notes: >-
      Severity ratings (High/Medium/Low) are author assessments based on publicly available evidence and do not
      constitute investment advice. Threat descriptions reflect competitive intelligence from public sources only;
      private competitive intelligence may change the risk assessment.
