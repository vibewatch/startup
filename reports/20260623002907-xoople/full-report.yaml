      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Data moat absent until constellation deploys
            body: >-
              Xoople's current data layer is built on third-party and government open datasets (including ESA
              Sentinel-2) that are equally accessible to Planet, BlackSky, Airbus, and any well-funded analytics team.
              The planned L3Harris constellation is the only mechanism for establishing proprietary data exclusivity,
              but its satellite count, technical specifications, and launch date are not publicly disclosed. Until the
              constellation is operational, Xoople's competitive differentiation rests on model quality, ecosystem
              integration, and brand — none of which constitutes a durable data moat. This is the single most important
              diligence item for any investor evaluating the 'system of record for the physical world' thesis.
            calloutType: risk
            claimRefs:
              - CP031
              - CP032
              - CP035
          - type: callout
            title: Planet Planetary Variables and Google Earth AI are credible analog threats
            body: >-
              Planet's Planetary Variables product line delivers continuously updated, scientifically calibrated Earth
              measurements (soil moisture, biomass, land surface temperature) in AI-ingestible formats — the closest
              existing commercial analog to Xoople's EarthAI layer. Google's Earth AI initiative applies large-scale AI
              to global geospatial data and makes physical-world information queryable through advanced models, using
              near-identical market framing to Xoople's. Both are further along the commercialization curve than
              Xoople's Q2 2026 launch, and both are backed by proprietary data assets (Planet's constellation; Google's
              petabyte archive). Xoople should not be evaluated as a first-mover in AI-ready geospatial data — it is
              entering a race that has already started.
            calloutType: risk
            claimRefs:
              - CP007
              - CP023
              - CP030
          - type: callout
            title: Esri and Microsoft create distribution leverage but no data exclusivity
            body: >-
              Xoople's confirmed integration with Microsoft (Planetary Computer Pro, Fabric, Azure) and Esri (ArcGIS
              workflows) provides meaningful near-term distribution reach into enterprise AI and GIS teams that would
              otherwise require a multi-year sales effort. This distribution moat is the company's most defensible
              current asset. The critical unknown is whether these integrations carry any exclusivity provision that
              prevents Airbus, Planet, or another data provider from achieving equivalent placement. Without
              exclusivity, the distribution advantage reduces to a first-mover channel position — valuable but
              reproducible by a better-capitalized competitor within 12–24 months.
            calloutType: insight
            claimRefs:
              - CP033
              - CP024
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and commercial status at commercialization launch
        blocks:
          - type: paragraph
            body: >-
              Xoople officially began commercialization in Q2 2026 after seven years of stealth development,
              transitioning from an Early Access Program to full market availability. The company's self-described
              revenue model is an ecosystem embedding strategy: rather than selling data directly to end users, Xoople
              positions its EarthAI data layer inside enterprise platforms its target customers already use — Microsoft
              Fabric and Power BI, Esri ArcGIS, and Databricks — so that buyers can access continuous Earth surface
              intelligence from within their existing workflows. CEO Fabrizio Pirondini confirmed to TechCrunch that the
              model centers on embedding data and solutions into the ecosystems of enterprise partners so those partners
              can provide services directly to their customers. This means Xoople's primary revenue streams are expected
              to be enterprise data subscriptions accessed via ecosystem partners, direct commercial contracts with
              government agencies and Fortune 500 customers for Earth intelligence services, and potentially usage-based
              or API licensing fees. A secondary stream — satellite services — is not yet active since Xoople's
              proprietary constellation is still in the sensor design phase with L3Harris. Until that constellation is
              operational, the platform processes and distributes data from government spacecraft (including ESA
              Sentinel-2) and third-party EO providers. No revenue, ARR, bookings, or specific customer contract values
              have been publicly disclosed. The presence of government agencies and unnamed Fortune 500 companies in the
              private-preview cohort confirms intent to sell, but the transition from preview to paid recurring contract
              has not been publicly verified as of the runDate.
            claimRefs:
              - CI001
