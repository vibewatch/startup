      - number: '3.2'
        title: 'Direct data peers: Planet, BlackSky, and Satellogic'
        blocks:
          - type: paragraph
            body: >-
              Planet Labs, BlackSky, and Satellogic represent the most direct competitive threat to Xoople's near-term
              revenue by competing for the same enterprise and government analytics buyer on overlapping verticals.
              Planet is the most vertically complete of the three: it operates a 450+ satellite constellation offering
              near-daily global coverage through its Dove satellite fleet, high-resolution tasking through SkySat, and
              hyperspectral imaging through Tanager, and it has moved decisively up the analytics stack with the
              Insights Platform (cloud-native APIs, GIS tools, analysis dashboards) and Planetary Variables (calibrated
              geophysical measurements including soil moisture, biomass, and land surface temperature). The Planetary
              Variables product line is the closest existing commercial analog to what Xoople calls EarthAI:
              scientifically calibrated, continuously updated Earth measurements in a machine-readable format suitable
              for AI model ingestion. Planet does not publish enterprise pricing, consistent with a custom-contract
              sales motion.


              BlackSky occupies a different segment within the same buyer pool. It targets defense, intelligence, and
              global security organizations explicitly, offering what it calls real-time AI-enhanced tactical ISR. Its
              Spectra platform captures up to 15 time-diverse images per day of a priority location, and its analytics
              are oriented around change detection and anomaly identification at short cycle times. The defense emphasis
              means BlackSky overlaps materially with Xoople's government vertical but is largely non-competitive in
              commercial enterprise use cases (supply chain, insurance, infrastructure monitoring). BlackSky is a public
              company (BKSY) but has not disclosed commercial enterprise revenue separately from its US Government
              contract base.


              Satellogic offers sub-meter multispectral imagery at low cost from a proprietary LEO constellation,
              targeting agriculture, government, defense, finance, and insurance. Its stated competitive advantage is
              driving down the cost of high-quality EO data to unlock adoption across industrial and environmental use
              cases. Satellogic is also publicly traded (SATL) but has struggled with commercial scale; its 20-F filing
              registration was not accessible. Its analytics layer is less developed than Planet's, making it primarily
              a data-provision competitor rather than a full platform rival.


              None of the three disclose enterprise pricing publicly. The competitive positioning map below shows how
              these peers compare on estimated data proprietary depth (x-axis: 1=fully open/third-party, 10=fully
              proprietary constellation) and AI integration depth (y-axis: 1=raw pixels, 10=AI-native enterprise
              context).
