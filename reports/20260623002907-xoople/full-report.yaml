      - number: '2.2'
        title: 'Market sizing: multiple lenses and contradictory estimates'
        blocks:
          - type: paragraph
            body: >-
              No single published estimate cleanly maps to Xoople's serviceable addressable market. Three major analyst
              estimates of the global EO market span a wide range because they measure different portions of the same
              supply chain. Fortune Business Insights pegs the global Earth observation market at $7.04 billion in 2025,
              projecting growth to $14.55 billion by 2034 at a CAGR of 8.31%, using a broad scope that likely
              incorporates platform, analytics, and hardware-adjacent services. Grand View Research, tracking a narrower
              satellite-and-platform framing, values the market at $5.10 billion in 2024 and projects it to $7.24
              billion by 2030 at a CAGR of 6.2%. EUSPA's authoritative framework, which covers only EO data products and
              value-added services (explicitly excluding satellite hardware and launch), reports 2023 revenues of
              approximately €3.4 billion and projects growth to nearly €6 billion by 2033.


              These three estimates are not reconcilable without knowing each analyst's exact scope boundary, but the
              divergence itself is informative. The smallest estimate (EUSPA) best approximates what Xoople would
              recognize as its addressable stack; the largest (Fortune) likely overstates Xoople's reachable spend by
              including infrastructure and government operations budget that Xoople does not compete for. The EUSPA
              insurance and finance sub-segment deserves particular attention: EUSPA forecasts a roughly 165% increase
              in that segment from 2023 to 2033, reaching approximately €900 million, driven by demand for
              location-specific risk evidence from insurers and lenders. That sub-segment growth trajectory aligns
              closely with one of Xoople's declared enterprise verticals.


              Within the geospatial intelligence market that analysts like MarketsandMarkets map — a broader
              multi-billion-dollar category that fuses EO, GEOINT, AI analytics, and location intelligence — the
              forecasts are larger still, though these reports are largely behind paywalls. North America accounted for
              over 45% of global EO market value in 2024 by Grand View's count, and over 34.97% in 2025 by Fortune's
              count, reflecting the dominant share of US government GEOINT and commercial intelligence procurement.
              Asia-Pacific is the fastest-growing region, projected at a CAGR above 9% through 2030.


              Xoople's own SAM and SOM are not publicly disclosed. A rough triangulation using the EUSPA data/services
              layer (€3.4B 2023) and the analytics/intelligence premium segments suggests that the enterprise AI data
              infrastructure slice — new, not yet fully formed — could represent $0.5–2.0 billion in 2025 addressable
              spend, with the high end requiring significant AI platform adoption to materialize. That estimate is
              neither confirmed nor denied by Xoople's public materials.
