          - type: callout
            title: Absence of public developer API limits third-party validation and ecosystem building
            body: >
              For a company positioning EarthAI as data infrastructure for AI systems and enterprise developers, the
              absence of a public API, SDK, developer documentation, or any code repository is a notable gap. It makes
              independent technical validation impossible, limits the ability of data engineers and ML practitioners to
              prototype with the platform, and creates uncertainty about whether the "AI-ready" framing reflects a
              genuinely developer-accessible product or a white-glove integration service. This is a material blocker
              for self-serve enterprise adoption.
