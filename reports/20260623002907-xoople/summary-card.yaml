summary:
  headline: >-
    Xoople has a credible EarthAI thesis, strong Spanish and strategic backing, and a sensible distribution-first route
    into enterprise workflows, but the current public evidence does not justify underwriting a $1B+ entry price without
    disclosed commercial traction and a clearer constellation plan.
