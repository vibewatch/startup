  - id: "substitutes-distribution-and-status-quo"
    title: "Substitutes, distribution platforms, and status-quo alternatives"
    body: "Google Earth Engine, Esri ArcGIS, and the enterprise internal-build path represent the three most prevalent substitute routes that a prospective Xoople customer could take without procuring a purpose-built EarthAI data layer.\n\nGoogle Earth Engine is a planetary-scale geospatial analysis platform backed by more than 80 petabytes of satellite data and over 30 years of historical imagery. It became available for commercial use in 2022, having previously been free only for academic and research use. Earth Engine provides APIs in Python and JavaScript, a cloud-native code editor, and access to datasets that update daily. Google has also launched a broader Earth AI initiative aimed at making physical, environmental, and infrastructure information queryable through advanced AI models — a framing nearly identical to Xoople's stated EarthAI positioning. For enterprises with technical teams comfortable with cloud APIs and Python notebooks, Earth Engine is a well-established, Google-backed substitute for Xoople's analytics layer, though it lacks Xoople's claimed precision, calibration, and enterprise-integration packaging.\n\nEsri ArcGIS occupies the enterprise GIS layer. Esri has a 20+ year partnership with Microsoft and its ArcGIS product suite is deeply integrated into Microsoft 365, Microsoft Fabric, Azure, and Power Platform. ArcGIS offers spatial analytics, dynamic maps, and location-based insights for enterprise decision workflows. Its published per-user pricing starts at approximately $500/user/year for ArcGIS Online, but enterprise contracts are negotiated separately. The Databricks-ArcGIS integration through ArcGIS GeoAnalytics Engine means that enterprises already running Databricks-based data pipelines can enable spatial analytics within their existing environment, reducing the incremental need for a separate EO data feed. Esri is both a potential substitute and Xoople's primary distribution channel, which creates a dual-relationship tension that would require clarification in due diligence.\n\nThe status-quo alternative for large enterprises is an internal build combining ESA Copernicus Sentinel-2 open data (free), enterprise GIS tooling, and an in-house analytics team. Sentinel-2 provides 10 m multispectral imagery with 5-day revisit globally, which is insufficient for many Xoople use cases but is free and widely accessible. UP42, as an EO data marketplace operated by Airbus, lowers the barrier to multi-vendor data access and creates downward pricing pressure on any commercial data provider. The pricing table below shows the pricing landscape across major providers."
    claimRefs:
      - "CP022"
      - "CP023"
      - "CP024"
      - "CP025"
      - "CP026"
