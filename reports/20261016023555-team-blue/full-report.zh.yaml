              年完成的第八笔收购 Shoptet，其收入已超过 €30
              million。这些要素能支持持久分销和更深钱包份额，但也意味着整合成本、支持人员、基础设施支出及潜在的收购融资需求。问题是，所审阅公开材料没有披露平衡项：没有公开现金头寸、债务结构、契约余量、现金跑道、资本开支、CAC、回收期或分部毛利率。one.com
              的客户评价还显示一种下行情景：变现依靠强制升级和支持摩擦，而非顺畅的产品驱动扩张。
