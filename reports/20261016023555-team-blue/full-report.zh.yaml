      - number: '3.2'
        title: 分销规模和伙伴触达是护城河，也是依赖
        blocks:
          - type: paragraph
            body: >-
              最有证据支持的差异化因素是分销。team.blue 称其通过本地品牌在 23 个国家服务 330 万 SMB，年度回顾
              明确把这些品牌描述为客户首次接触公司的数十个独立入口。这个存量基础很重要：基础设施仍锚定商业模式，而 SaaS 层用于加深关系并逐步扩大 ARPU。收购 Shoptet
              表明集团增加的是有规模的应用品类，而不只是更多托管品牌；VMware Pinnacle Partner 公告则显示另一条分销路径，即帮助客户和转售商应对 Broadcom
              的许可重置。同一来源也揭示了这种优势内含的结构性依赖：基础设施连续性和伙伴相关性部分受 Broadcom/VMware 控制的生态规则影响，而非完全由 team.blue 决定。
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP008
              - CP009
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP016
      - number: '3.3'
        title: 定价信任与服务体验可能是首个替代突破口
        blocks:
          - type: paragraph
            body: >-
              竞争证据最弱的部分是定价透明度，最清晰的外部风险信号来自 team.blue 品牌之一 One.com 的客户体验。HostAdvice 的实测评测称产品易上手、性能好且入门价便宜；但 SmartCustomer
              的评价汇总明显负面，集中在自动升级、新收费和难以取消。这个分化很重要：低摩擦上线和低标价
              价格是内部自建、代理商或竞争托管商的重要替代优势；若续费涨价或增购摩擦难以预判，即使初始产品很强，也会给竞争者留下机会。更广泛地说，所审阅公开来源没有为 team.blue
              全部产品组合提供足够的公开标价，无法与单点竞争方案做严格苹果对苹果比较，因此定价韧性仍是重大尽调缺口，而不是已解决的护城河。
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP014
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 广度可见，价格纪律不可见
            body: 现有证据足以显示 team.blue 正通过收购、AI 产品捆绑和跨品牌分销扩大竞争面，但不足以证明这种广度能带来持续可守的定价、低流失或相对单点方案更高的赢单率，因为公开资费细节和独立客户经济数据仍稀缺。
            calloutType: risk
            claimRefs:
