      - number: '1.4'
        title: 证据边界与尽调重点
        blocks:
          - type: paragraph
            body: >-
              有两点尽调警示。第一，重要的封面指标仍未得到支持或只是管理层声称：现有材料无法证实估值、累计融资、投资人持股或债务规模，连基本规模指标在不同官方页面间也有漂移。第二，反向证据存在但范围狭窄。集团旗下运营品牌
              one.com 的独立评价网站显示外部情绪明显分化，而非清晰的声誉信号：强烈负面的客户评价页面与正面的专家评测并存。在把本次更新当作新的事实基准前，管理层应提供一套权威 KPI 包、当前股权结构表
              和债务明细，以及更完整的董事会与治理披露。
            claimRefs:
              - CO015
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类逻辑
        blocks:
          - type: paragraph
            body: >-
              team.blue 的当前披露把市场定义为一体化 SMB 数字化赋能栈，而非纯托管或域名注册品类。公司现在描述三层模式：以续费为主的互联网基础设施为底座，其上是更广泛的 SaaS 组合，blue.hub
              则连接身份、计费和 AI 推荐。这个框架很重要，因为源材料中的独立分类仍把网站托管和域名注册拆成不同基础品类，而 team.blue 的市场进入方式把它们与合规、电商、客户互动和交易等相邻软件工作流捆绑。对许多
              SMB 而言，现实替代方案不是一个直接竞争者，而是本地托管商、注册商、单点 SaaS、代理商和手工流程组成的碎片化栈，因此讨论市场规模前必须先守住市场边界。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM015
      - number: '2.2'
        title: 受证据约束的规模估算与变现覆盖面
        blocks:
          - type: paragraph
            body: >-
              源材料对已观察到的业务覆盖面，支持强于对外部分母的说明。就已观察一侧，公司材料支持一个规模很大的变现客户基础：约 3.3 million 客户、FY2025 报告收入 €866M、ARR 超过
              €850M；结构仍由基础设施主导，但 SaaS 已占收入 27%。需求一侧，team.blue 自己的 FY2025 review 认为，欧洲 SMB 中 65%
              仍缺少基本数字化解决方案；若方向正确，采用空间就很大。缺失的是一个独立的泛欧洲市场模型，能把域名、托管、合规、商业和 SMB 运营软件统一到 TAM/SAM/SOM
              框架中。因此估值时，近期最可辩护的视角是评估大型存量客户基础中的平台变现深度，而不是泛泛声称“市场巨大”。
