      - number: '2.3'
        title: 买方、用户、付款方与工作流分层
        blocks:
          - type: paragraph
            body: >-
              公司实际上是在服务多个经常性 SMB 工作流，而非一条单一预算线。基础设施产品解决创始人和代理商的首次上线决策；SaaS 层再变现网站、隐私与合规、网店、客户互动、支付和预订等后续需求。微型 SMB
              中买方、用户和付款方常是同一人，但企业成长后会分化为营销、运营、IT 和合规角色。这解释了为什么 team.blue 的交叉销售逻辑比狭义托管份额更重要：若基础设施是先落地再扩张的切入口，商户工作流和运营
              SaaS 就是提高 ARPU、增强留存的清晰路径。Shoptet 的意义在于加深这一商户工作流层，而不只是增加低价值域名数量。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM010
              - CM014
              - CM015
      - number: '2.4'
        title: 采用驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              需求逻辑建立在三个相互关联的驱动因素上：欧洲 SMB 巨大的数字化采用缺口、提高简化软件套装价值的 AI 试验加速，以及似乎提升欧洲供应商吸引力的主权与监管背景。同一批证据也说明，转化速度仍可能慢于
              表面上的市场机会。受访 SMB 表示不清楚该买哪些工具、数字化信心不足、时间和资源受限，并因数据安全、准确性和品牌控制而持续不信任
              AI。这些摩擦意味着预算权限本身不能保证采用；产品简单、当地支持和信任才是赢单的核心。主要缺口是，没有任何保留来源独立量化管理层隐含瞄准的欧洲 SMB 一体化数字化赋能市场，下一步最应索取的是与产品集群
              客户队列和当前覆盖面定义挂钩的内部市场模型。
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 分销广度已经足以撬动市场
            body: 即使没有独立 TAM，team.blue 已有足够的客户和收入密度，可将市场定义为有规模的泛欧洲 SMB 平台，而不是小众托管整合商。
            calloutType: strength
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: callout
            title: 机会背后的分母仍缺少充分记录
            body: 证据支持业务覆盖面和需求摩擦，却没有形成覆盖托管、域名、合规、商业和 SMB 运营 SaaS 的清晰第三方 TAM/SAM 桥接，这削弱了估值上行空间的精确度。
            calloutType: risk
