  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 杠杆不透明和合规执行仍定义最高剩余风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的 thesis-breaker 仍是融资不透明，而不是需求崩塌。现有材料中唯一独立的不利事项，是一笔被撤回的杠杆贷款交易：报道描述借款人曾尝试延长 €1.353 billion 定期贷款、重定价 $771
              million 定期贷款，随后撤回流程。这本身不证明陷入困境；同一报告称发行人和债券评级为 B/B3、展望稳定，但确实说明 team.blue
              仍是杠杆化故事，其再融资路径只有在市场测试时才可见。与此相对，管理层材料显示 FY2025 ARR 超过 €850
              million、盈利增长和广泛的存量基础。对投资判断而言，问题是公开证据仍未触及契约余量、到期梯度或偿债覆盖。监管与合规也有相同模式：隐私、无障碍和欧洲托管都是真实资产，但现有材料仍缺少外部整合记录，无法说明集团控制、事故报告和跨国问责如何实际运行。
