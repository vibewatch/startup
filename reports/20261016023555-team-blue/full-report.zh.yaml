  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 该图依据公开证据支持的工作流广度和分销 / 控制能力评估替代方案，而不是依据缺乏支持的收入份额或市场份额估计。
    data:
      xAxis:
        label: 工作流广度
        min: 1
        max: 5
        lowLabel: single-function offer
        highLabel: multi-workflow platform
        description: Ordinal score from cited public evidence on how many SMB workflows each option addresses.
      yAxis:
        label: 打包与分销控制力
        min: 1
        max: 5
        lowLabel: buyer assembles delivery
        highLabel: owned suite and scaled distribution
        description: >-
          Ordinal score from cited public evidence on owned workflow coverage, customer entry points, and delivery
          control.
      points:
        - label: team.blue 平台
          x: 5
          'y': 5
          detail: 三层平台，包含 60+ 个品牌、基础设施、SaaS 和 blue.hub 编排。
          claimRefs:
            - CP001
            - CP003
            - CP015
            - CP016
        - label: GoDaddy
          x: 4
          'y': 4
          detail: WebHosting Today 指出其存在超越托管业务的美国可比动向；本文未确定其当前确切范围和规模。
          claimRefs:
            - CP005
        - label: Wix
          x: 4
          'y': 3
          detail: 网站搭建业务已延伸至电商、预订和营销，但现有材料未核实当前分销规模。
          claimRefs:
            - CP005
        - label: 纯欧洲托管商
          x: 1
          'y': 3
          detail: 直接的基础设施替代方案；有证据支持的工作流广度更窄，但可能进入相邻软件领域。
          claimRefs:
            - CP004
            - CP005
        - label: 最佳单品软件栈
          x: 4
          'y': 1
          detail: 广泛的组合能力仍然可能实现，但控制权和整合分散在不同供应商之间。
          claimRefs:
            - CP012
        - label: 内部构建 / 多供应商软件栈
          x: 3
          'y': 1
          detail: 可以保持单品最佳，但比引导式打包方案需要更多时间、技能和协调。
          claimRefs:
            - CP007
            - CP012
    approximationNotes: X/Y 坐标是基于证据的序数评分，来自审阅材料中的产品范围、分销和连续性信号；不是市场份额或收入份额的测量。
