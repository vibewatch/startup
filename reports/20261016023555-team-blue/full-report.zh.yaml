  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与已披露牵引力
        blocks:
          - type: paragraph
            body: >-
              team.blue 最清晰的公开财务数据点是规模，而非盈利能力。集团称 FY2025 ARR 达 €866 million，有机收入增长 11%；2025 review
              和联合发布稿都显示，平台仍以经常性基础设施为锚，而不是纯应用软件。Internet Infrastructure 服务约 2.7 million 客户，占 FY2025 收入 73%；SaaS Solutions
              服务约 600,000 客户，贡献其余 27%，覆盖网站、合规、电商、互动和交易。这种结构支持相对持久的经常性基础，但也意味着投资判断取决于公司未公开的续费质量、支持强度和附加率。
            claimRefs:
