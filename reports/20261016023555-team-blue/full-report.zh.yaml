          - type: callout
            title: 投资判断前的最低尽调包
            body: 要求当前债务明细和契约模型、集团事故与监管日志，以及按主要品牌和转售渠道分层的品牌流失或投诉看板。没有这些材料，剩余风险仍高于公开增长叙事所能抵消的水平。
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR011
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议为跟踪，信心中低，投资判断风险高；在最近披露的 €4.8 billion 公司价值下，估值立场支持不足。正面案例是规模真实：team.blue 报告 FY2025 ARR €866
              million、有机收入增长 11% 和 42% 的 EBITDA 指标。限制因素不是公司质量，而是价格发现。这些经营指标由公司发布，年度回顾提醒内部 KPI 可能不按会计准则定义，Yahoo
              承载的材料还明确标为付费新闻稿，而非独立佐证。因此立即投资需要经审计的收入和 EBITDA 桥接、净债务与契约数据、优先权条款及当前股权结构表。在取得这些输入前，不能负责任地给出目标回报、持有期或退出价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV014
      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              本章保留的最近明确估值来自 2024 年 7 月交易：CPP Investments 收购约 20%，team.blue 估值 €4.8 billion；Hg 仍是最大投资人并追加资金。用这一公司价值除以后来的
              FY2025 ARR €866 million，可得到约 5.5x 的方向性比率。但这不是交易日倍数，不能写成 EV/ARR，因为日期不同，且来源没有把 €4.8 billion
              定义为企业价值。保留证据也没有量化净债务、清算优先权、稀释或契约余量。因此入场纪律应聚焦完全摊薄、按优先权调整后的股权桥和下行债务承载能力，而不是只围绕标称估值谈判。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV008
      - number: '8.3'
        title: 正面论点与反论点
        blocks:
          - type: paragraph
            body: >-
              正面论点是：这是一个有规模的经常性收入平台，报告了有机增长，收入结构为 73% 基础设施、27% SaaS，并拥有 team.blue 称自 2020 年以来带来约 €300 million
              收购收入的并购引擎。公司还报告 AI 产品 ARR 增速约为非 AI 产品两倍，截至 2025 年 12 月约占新客户 ARR 一半。反论点是证据集中和执行复杂：核心 KPI 来自公司或联合发布稿，Shoptet
              已是 2025 年宣布的第八笔收购，保留的独立市场数据来源只提供托管份额方法，却在抓取文本中没有 team.blue 特定数值。结果是战略叙事可信，但独立财务证据不足以验证 标价。
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
