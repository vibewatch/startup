              - CV014
              - CV016
      - number: '8.4'
        title: 情景、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求独立确认报告 ARR 质量、有机增长、EBITDA 和现金转化经审计成立，且交叉销售和 AI 增长创造的价值不会被收购驱动的杠杆吞噬。基准情景是在债务、优先权、客户队列
              留存和整合经济性披露前，把公司留在观察名单，估值不高于最近公开标记。悲观情景由 KPI 大幅正常化、留存疲弱、杠杆压力或连续收购掩盖有机表现触发；因此会出现重大折价，但折价幅度无法用公开证据计算。规模可能带来
              IPO 或 sponsor-secondary 选择权，但保留来源没有确定退出路径或时间表。最终尽调应取得经审计报表、ARR 与收入对账、债务文件、优先权 waterfall、收购
              客户队列、分部留存及董事会批准的退出计划。
