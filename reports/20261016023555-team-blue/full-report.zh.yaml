  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开披露指向经常性基础设施基础、SaaS 附加销售、AI 驱动扩张和收购驱动的结构拓宽。
    data:
      nodes:
        - id: customers
          label: 已披露的 FY2025 客户基础
          value: 3300000
          unit: customers
          note: 通过本地品牌服务超过 3.3M 名 SMB 客户。
        - id: infra
          label: 互联网基础设施
