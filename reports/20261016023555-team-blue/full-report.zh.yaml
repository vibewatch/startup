    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与已披露规模
        blocks:
          - type: paragraph
            body: >-
              保留的官方来源始终将 team.blue 描述为泛欧洲数字合作伙伴：它面向中小企业，把核心基础设施与覆盖电商、合规、支付及其他 SMB 工作流的软件层打包在一起。最有力的规模披露集中在 FY2025：公司材料指向
              3.3 million 至 3.4 million SMB 客户、覆盖 23 个国家，以及约 €866 million ARR 和 11% 的有机增长。这足以说明 team.blue
              已是有规模的区域平台，而非单一品牌托管商；但现有材料无法独立核对当前应采用哪个客户数、国家数或员工数作为权威口径。
