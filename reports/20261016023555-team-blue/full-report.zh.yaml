            - 中
            - 中
            - 中低
            - 中
            - 品牌投诉与退款看板
        - label: VMware 生态依赖
          values:
            - 中
            - 中
            - 中
            - 中
            - 续约定价与迁移经济性
    approximationNotes: 评级是对所引证据的定性综合，而非概率估计。
    claimRefs:
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 证据链从已披露规模出发，经由价格和数据质量检验，最终指向持续跟踪的决定，而不是立即投资的建议。
    data:
      nodes:
        - id: reported-scale
          label: 已披露规模
          detail: €866m FY2025 ARR，以及 11% 有机收入增长
        - id: strategic-upside
          label: 战略上行空间
          detail: 基础设施分销、SaaS 组合、并购及 AI 增长说法
        - id: last-price
          label: 最近一次公开估值
          detail: 2024 年 7 月公司价值 €4.8bn
        - id: ratio-test
          label: 跨期口径检验
          detail: 公司价值 / 后续 FY2025 ARR 约 5.5 倍；不是 EV/ARR
        - id: evidence-test
          label: 证据质量检验
          detail: 公司发布的 KPI、付费信息分发，以及有限的独立基准比较
        - id: downside-test
          label: 下行空间的关键机制缺失
          detail: 净债务、优先权、正常化收益、留存率和退出路径
        - id: decision
          label: 决策
          detail: 先持续跟踪并取得一手尽调材料，再设定区间
    approximationNotes: 约 5.5 倍的检验值是用 2024 年 7 月的公司估值除以 FY2025 ARR 得出，仅作为方向性的筛选比率展示。
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV009
      - CV012
      - CV014
      - CV016
