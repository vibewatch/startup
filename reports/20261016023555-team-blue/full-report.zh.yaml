        - 已报告增长和利润率经审计仍成立；AI 和交叉销售改善留存；杠杆适中
        - 只有在核实债务和优先权桥接后，€4.8bn 或更高估值才可能站得住；公开材料无法支持估值区间
        - 分部 KPI 经审计且有独立队列证据后，信号增强
        - AI 提升未能转化为留存、利润率或现金生成
        - 完成确认性尽调后才推进
      - - 基准
        - ARR 增长，但组合整合和 KPI 正常化会吞掉部分上行空间
        - 没有当前财务和股权结构表证据，不应高于上一个 €4.8bn 标记
        - 与指定证据集最一致
        - 偿债或收购整合限制再投资
        - 跟踪
