  - id: FE001
    title: 产品架构图
    type: stack
    summary: team.blue 披露的架构以经常性基础设施为底座，上层是工作流软件和早期编排层。
    data:
      layers:
        - label: L1 - 本地品牌分销
          detail: 国家级入口、支持团队和经销商关系
          modules:
            - 托管和基础设施品牌
            - 代理商和经销商渠道
          outputs:
            - 本地化获取和支持
        - label: L2 - 互联网基础设施底座
          detail: 通过本地品牌分销的经常性线上存在底层
          modules:
            - 域名和 DNS
            - 托管和电子邮件
            - 云、托管服务和 GPU 服务
          outputs:
            - 可靠的线上存在、数据本地化和计算能力
        - label: L3 - 网站与创建工具
          detail: 面向首次开展数字化经营者的快速上线层
          modules:
            - Webnode
            - Macaly
          outputs:
            - 通过低门槛提示创建网站和应用
        - label: L4 - SaaS 工作流组合
          detail: 工作流软件分为五个命名集群
          modules:
            - 合规工具
            - 电商平台
            - 客户互动与分析
            - 交易：开票、支付和预订
          outputs:
            - 在发现、销售和运营工作流中实现更高附加率
        - label: L5 - 信任与基础设施治理
          detail: 管理认证、数据位置和合作伙伴连续性的控制层
          modules:
            - 通过 ISO 27001 和 ISAE 3402 认证的 AI 基础设施
            - 符合 GDPR 的企业基础设施
            - VMware 连续性和迁移支持
          outputs:
            - 面向受监管或规模化工作负载的运营信任信号
        - label: L6 - blue.hub 编排
          detail: 早期的跨品牌连接层，而非完全统一的控制平面
          modules:
            - 95%+ 品牌使用统一页脚
            - 已选择加入客户的单一视图
            - 推荐引擎试点
            - 身份、计费、配置和集中支持路线图
          outputs:
            - 跨品牌发现、支持和自动化
    approximationNotes: 该图反映公司披露的运营模式和已命名的部署要素；不推断未披露的内部系统或已完成的迁移深度。
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE007
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 买方对工具和数据主权的困惑推动上线产品、增长工具和跨品牌增售，而续约摩擦集中在旅程后段。
    data:
      items:
        - label: 需要弄清工具和数据位置
          actor: SMB 所有者 / 管理者
          phase: 问题识别
          channel: 研究、同行反馈、托管评估
          tone: neutral
          touchpoints:
            - 30% 的小企业表示不知道应该使用哪些数字工具。
            - 57% 不知道其供应商是否保证数据存储在欧盟。
            - 72% 担心数据存储在美国。
        - label: 建立线上存在
          actor: 首次创业者
          phase: 初始激活
          channel: 自助产品注册
          tone: positive
          touchpoints:
            - Webnode 和 Macaly 通过一个提示或描述帮助企业上线。
            - Year Review 的定位强调首次经营企业可以简单设置。
        - label: 运行核心基础设施
          actor: 成长中的 SMB 或 IT 所有者
          phase: 运营使用
          channel: 托管、云、托管服务
          tone: positive
          touchpoints:
            - 材料称 Pipa 使用域名、云服务器和托管服务。
            - 材料称 Benerail 使用 Managed Kubernetes、Cloud Solutions 和 Virtual Servers。
        - label: 扩大客户触达
          actor: 营销人员或运营者
          phase: 扩张
          channel: 增长软件
          tone: positive
          touchpoints:
            - Metricool 和 Flexmail 帮助客户触达自己的客户，并保持领先于竞争对手。
            - Shoptet 增加支付、物流和数字广告工作流。
        - label: 在网络内交叉购买
          actor: 现有客户 / 代理商合作伙伴
          phase: 获客并扩张
          channel: blue.hub 推荐和合作伙伴动作
          tone: positive
          touchpoints:
            - 约 30,000 家代理商和经销商合作伙伴同时是客户和分销渠道。
            - blue.hub 拥有已选择加入客户的跨品牌单一视图，并已实现首次跨品牌转化。
        - label: 续约或遭遇摩擦
          actor: 管理 / 财务负责人
          phase: 留存检查
          channel: 计费、支持、取消
          tone: risk
          touchpoints:
            - One.com 评价提到价格突然上涨、自动升级套餐以及取消困难。
            - HostAdvice 也指出续约价格更高且不提供免费网站迁移。
            - 审阅的公开证据仍未披露集团层面的流失率、GRR 和 NRR。
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU010
      - CU011
      - CU012
