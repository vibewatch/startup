      - number: '4.2'
        title: 定价、增购与 GTM 可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，变现扩大主要靠附加和捆绑，而不是清晰的独立 AI SKU。管理层称截至 2025 年 12 月，AI 产品约贡献新客户 ARR 的一半；近期发布也显示 AI 功能嵌入现有工作流：Flexmail
              每个套餐都有 AI 翻译和文案功能，但受额度约束；Macaly 通过 Stripe 集成支持一次性销售和经常性订阅。team.blue 还有重要的一方分销资产：数字成熟度研究汇总了来自 32 个国家、超过
              8,200 家企业的反馈，数据主权研究称 32.1% 的受访 SME 已将数据存放在 team.blue。信号说明其漏斗顶部触达和交叉销售潜力强，但仍只是代理指标；保留材料中的公开来源没有披露
              CAC、回收期、实际 ARPU 或伙伴渠道经济性。
            claimRefs:
