      - number: '1.3'
        title: 组建、2025 年里程碑与经营动能
        blocks:
          - type: paragraph
            body: >-
              现有材料中最清晰的时间线始于 team.blue 声称在 2019 年由 Combell、TransIP 和 Register Group 合并成立，随后在 2025 年加速。FY2025 披露称 ARR 突破
              €850 million，新增客户超过 600,000；AI 产品约占新客户 ARR 的一半，增速约为非 AI 产品的两倍。公司还在 2025 年 11 月发布泛欧洲 Digital Maturity
              Report，并在 2025 年 9 月宣布收购 Shoptet，称其为当年第八笔交易，强化了以并购和产品层扩张为核心、而非依靠一次性里程碑的增长叙事。
