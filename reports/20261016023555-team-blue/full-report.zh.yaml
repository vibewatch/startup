      - number: '1.2'
        title: 领导层可见度、创始人延续性与治理缺口
        blocks:
          - type: paragraph
            body: >-
              高管层的领导信息尚可，治理层则较薄。Year in Review 材料列出 Claudio Corbetta 为 Group CEO、Jonas Dhaenens 为 Founder and
              President、Dawn Marriott 为 Executive Chair、Jonathan Thackray 为 CFO，并强调创始人经营者模式：超过 90% 的被收购创始人留任至 earn-out
              之后，仍有超过 30 位创始人担任运营职务。这说明收购能保留创始人连续性，但也意味着外部叙事高度依赖少数可见领导者。现有材料没有披露完整董事会名单、投资人权利或债务治理，因此治理尽调仍不完整。
