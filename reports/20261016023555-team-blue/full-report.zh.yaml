  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 平台广度是主要竞争动作
        blocks:
          - type: paragraph
            body: >-
              这里审阅的公开证据支持对竞争格局作广义理解：team.blue 正从商品化托管扩展到覆盖基础设施、网站、合规、电商、互动、交易以及连接这些服务的编排层。其 2024-25 影响报告描述了超过 60 个品牌和完整的
              SMB 数字产品套件，2025 年度回顾则把模式定义为三层相互强化的结构，而非单一品类产品。WebHosting Today 的独立评论也支持这一判断，称 team.blue 自 2024 年中以来至少完成 14
              笔 SaaS 收购，并将其战略与 GoDaddy 更广的美国 SMB 栈、以及从建站扩展到商业、预订和营销的 Wix 相比。因此真正的竞争集合包括直接托管同业、综合 SMB
              平台龙头、相邻单点方案、代理商或内部自建，以及可能进入更多软件品类的纯托管商。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP012
              - CP016
