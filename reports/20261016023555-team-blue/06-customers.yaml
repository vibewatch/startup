schemaVersion: report-v2
artifact: customers
slug: team-blue
runDate: '2026-10-16'
company:
  name: team.blue
chapter:
  number: 6
  title: Customers
  summary: 'team.blue shows convincing breadth at the top of the funnel: company materials
    cite 3.3 million SMB customers, approximately 30,000 agency and reseller partners,
    and 23-country reach, while recent releases point to ongoing product-led and cross-brand
    expansion. The weaker point is durability: public evidence contains a few named
    production references and late-stage customer friction signals, but no numeric
    group-level GRR, NRR, churn, contract-length, or concentration disclosure.'
sections:
- id: footprint-and-segments
  title: Customer footprint is broad, but segment economics remain opaque.
  body: 'team.blue''s current public customer story is scale first. Its FY2025 materials
    and July 2026 syndicated release both say the group serves 3.3 million SMB customers,
    while the same body of evidence also cites approximately 30,000 agency and reseller
    partners. That points to a blended customer model in which direct SMB demand and
    channel-led distribution coexist. The footprint also appears to be expanding over
    time: Sofina''s 2024 portfolio page described a 60+ brand network in 22 countries,
    while team.blue''s newer FY2025 materials cite 23 countries and identify the Netherlands,
    Italy, Sweden, Denmark, and Czechia as the largest customer bases. What is still
    missing is the economic cut of that footprint by segment, geography, or brand.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU009
  - CU013
  tableRefs:
  - TU001
- id: expansion-and-demand
  title: Expansion logic relies on cross-sell infrastructure and visible buyer pain.
  body: 'The growth case is not just logo acquisition. team.blue''s current product
    messaging ties customer acquisition and expansion to a staged workflow: launch
    products help entrepreneurs get online, growth tools help them reach customers,
    and blue.hub is meant to connect brands, identity, billing, and recommendations
    so that existing customers buy more from the network over time. External demand
    signals in the assigned evidence support the narrative that buyer pain is real.
    team.blue-sponsored 2025-2026 survey releases describe confusion over digital-tool
    choice, concern over data sovereignty, and switching intent around hosting location,
    which all create plausible entry points for compliant hosting, SaaS, and cross-sell
    motions.'
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: named-proof-and-friction
  title: Named production proof exists, but it is still sparse and mostly company-authored.
  body: 'team.blue does have more than logo-only customer proof in the assigned pool.
    The Year in Review cites named users such as Pipa, Permanent Makeup Budapest,
    and Benerail, and it ties those references to concrete products or outcomes. That
    is better than a pure logo wall, but the public sample remains narrow and largely
    self-authored, with limited disclosure of contract value, timing, renewal history,
    or deployment depth. The adverse side is also brand-specific rather than portfolio-wide:
    One.com review surfaces show meaningful customer friction on pricing and cancellation,
    but they do not quantify how material that issue is to group revenue or retention.'
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU014
  - CU015
  - CU016
  tableRefs:
  - TU003
- id: durability-and-diligence
  title: The main underwriting question is durability, not whether customers exist.
  body: The public chapter evidence is enough to accept that team.blue has real scale,
    real channel density, and at least some production deployments. It is not enough
    to underwrite customer quality with precision. None of the reviewed public sources
    provide group-level GRR, NRR, churn, renewal-rate, contract-length, top-customer
    share, or reseller revenue-mix disclosure. That means the investment question
    shifts from "does team.blue have customers?" to "how sticky, concentrated, and
    monetizable is the installed base by cohort and brand?" Until that disclosure
    is obtained, expansion upside is credible, but durability remains only partially
    evidenced.
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU009
  - CU010
  - CU011
tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Public scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Small businesses
    - Founder-owner / operator / business payer
    - Get online quickly with domain, site, booking, and compliance tools
    - 3.3m SMB customers at group level; no segment breakout disclosed
    - High-volume entry point for first-product acquisition and later upsell
    - No ARPU, churn, or country mix for this cohort
  - - Medium businesses
    - Ops or IT lead / departmental buyer
    - Managed hosting, cloud, and integrated SaaS as businesses scale
    - Segment is described qualitatively, not quantified
    - Potential step-up into higher-ticket hosting and bundled software
    - No segment customer count or retention disclosure
  - - Agencies and resellers
    - Agency owner / account team / indirect end-customer payer
    - White-label hosting and reseller operations for client portfolios
    - Approximately 30,000 agency and reseller partners
    - Both paying customers and distribution channels, making the cohort strategically
      leveraged
    - No channel revenue share, concentration, or renewal disclosure
  - - Large businesses
    - Enterprise IT / procurement / infrastructure owner
    - Reliability-critical hosting, security, and customization
    - Named reference in Benerail plus top customer bases in large European markets
    - Supports mission-critical positioning and deeper infrastructure wallet share
    - No top-account concentration, contract term, or SLA disclosure
  notes: Mixes group-wide scale disclosures with qualitative segment descriptions;
    null-equivalent gaps reflect missing public cohort economics rather than zero
    values.
