callouts:
- calloutType: insight
  title: The agency channel is both demand base and acquisition engine.
  body: team.blue's agency and reseller cohort is not just a set of paying customers;
    the group describes it as a distribution layer too. That can make channel economics
    very attractive, but it also means concentration and renewal quality matter more
    than the headline partner count alone.
  claimRefs:
  - CU002
  - CU003
- calloutType: risk
  title: Public durability metrics are still missing.
  body: The assigned evidence supports scale and some named production usage, but
    it does not disclose group GRR, NRR, churn, renewal rates, top-account exposure,
    or reseller revenue mix. That gap is large enough that customer quality cannot
    be underwritten from public materials alone.
  claimRefs:
  - CU010
  - CU011
  - CU012
