- id: TU003
  title: Named customer proof table
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome
  - Limitation
  rows:
  - - Pipa
    - Growing SMB
    - Domain name, cloud servers, and managed hosting
    - Production
    - Quoted as saying team.blue helped it scale and advised on infrastructure for
      continued growth
    - No date, spend, contract term, or deployment depth disclosed
  - - Permanent Makeup Budapest
    - Small business
    - Online presence and bookings anchored by domain-led setup
    - Production
    - Cancellations and no-shows dropped from around 15% to just 5%
    - No time window, baseline volume, or broader tool stack disclosed
  - - Benerail
    - Large business
    - Managed Kubernetes, cloud solutions, and virtual servers
    - Production
    - Used as the large-business reference for reliability-critical infrastructure
    - No quantified SLA, contract size, or renewal history disclosed
  - - One.com review sample
    - Small-business hosting users
    - Shared hosting and website-builder usage inferred from public reviews
    - Production
    - Independent review surfaces show active product usage alongside renewal and
      cancellation friction
    - Reviewer identities, contract terms, and group-level revenue importance are
      undisclosed
  notes: 'Sample only: the assigned evidence mixes company-authored named cases with
