  evidenceGaps:
  - type: missing-source
    severity: material
    topic: durability-disclosure
    missingEvidence: Group-level GRR, NRR, churn, renewal-rate, contract-length, and
      cohort-retention disclosures by brand or segment.
    whyItMatters: Without those metrics, the current 3.3 million-customer headline
      cannot be translated into durable revenue quality.
    diligencePath: Request board or lender materials with cohort retention tables,
      renewal rates, and brand-level customer economics.
    relatedQuestionRefs:
    - QU006
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: concentration-disclosure
    missingEvidence: Top-customer share, top-brand share, reseller revenue mix, and
      large-account concentration by geography.
    whyItMatters: Channel leverage is attractive only if revenue is not overly dependent
      on a small number of partners, brands, or accounts.
    diligencePath: Request revenue concentration schedules by customer, channel, geography,
      and brand for the latest twelve months.
    relatedQuestionRefs:
    - QU007
    relatedTableRefs:
    - TU001
    - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-proof
    missingEvidence: A broader list of named production deployments with dates, contract
      scope, and measurable outcomes across major brands.
    whyItMatters: The current named-public sample proves some real use, but it is
      too narrow to generalize adoption quality across the portfolio.
    diligencePath: Ask management for referenceable customers by segment and brand,
      including at least one renewal history for each major cohort.
    relatedQuestionRefs:
    - QU003
    relatedTableRefs:
    - TU003
