figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  summary: Buyer confusion around tools and sovereignty feeds launch products, growth
    tools, and cross-brand upsell, with renewal friction concentrated late in the
    journey.
  data:
    items:
    - label: Need clarity on tools and data location
      actor: SMB owner / manager
      phase: Problem recognition
      channel: Research, peer input, hosting review
      tone: neutral
      touchpoints:
      - 30% of small businesses say they do not know which digital tools they should
        be using.
      - 57% did not know whether their provider guaranteed EU data storage.
      - 72% worried about U.S. data storage.
    - label: Launch an online presence
      actor: First-time entrepreneur
      phase: Initial activation
      channel: Self-serve product signup
      tone: positive
      touchpoints:
      - Webnode and Macaly help get a business online with a single prompt or description.
      - Year Review positioning emphasizes simple setup for first-time businesses.
    - label: Run core infrastructure
      actor: Growing SMB or IT owner
      phase: Operational use
      channel: Hosting, cloud, managed services
      tone: positive
      touchpoints:
      - Pipa is cited using domain name, cloud servers, and managed hosting.
      - Benerail is cited using Managed Kubernetes, Cloud Solutions, and Virtual Servers.
    - label: Grow customer reach
      actor: Marketer or operator
      phase: Expansion
      channel: Growth software
      tone: positive
      touchpoints:
      - Metricool and Flexmail help customers reach their customers and stay ahead
        of competitors.
      - Shoptet adds payments, logistics, and digital advertising workflows.
    - label: Cross-buy across the network
      actor: Existing customer / agency partner
      phase: Land-and-expand
      channel: blue.hub recommendations and partner motion
      tone: positive
      touchpoints:
      - Approximately 30,000 agency and reseller partners are both customers and distribution
        channels.
      - blue.hub has a cross-brand single view of opted-in customers and first cross-brand
        conversions.
    - label: Renew or experience friction
      actor: Admin / finance owner
      phase: Retention check
      channel: Billing, support, cancellation
      tone: risk
      touchpoints:
      - One.com reviews cite sudden price increases, automatic plan upgrades, and
        difficult cancellation.
      - HostAdvice also flags higher renewal pricing and no free site migration.
      - Group-level churn, GRR, and NRR remain undisclosed in the reviewed public
        evidence.
