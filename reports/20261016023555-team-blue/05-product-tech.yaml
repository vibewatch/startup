  evidenceGaps:
  - type: missing-source
    severity: material
    topic: shared-control-plane-metrics
    missingEvidence: Brand-by-brand adoption, attach, MAU, and conversion-lift data
      for blue.hub identity, billing, recommendation, and support surfaces.
    whyItMatters: The product thesis depends on orchestration increasing value across
      brands, but public evidence only confirms early deployment elements rather than
      scaled customer usage.
    diligencePath: Request blue.hub rollout dashboards by brand, feature penetration
      over time, and cross-sell uplift before underwriting platform synergy.
    relatedQuestionRefs:
    - QE005
  - type: missing-source
    severity: material
    topic: portfolio-reliability
    missingEvidence: Public uptime, incident, and support-resolution metrics across
      major hosting and SaaS brands.
    whyItMatters: Without neutral operational telemetry, investors are forced to triangulate
      from anecdotal reviews that may overstate or understate true service quality.
    diligencePath: Request status-page exports, SLA history, incident-rate trends,
      and support KPIs for One.com, Combell, TransIP, Webnode, and Shoptet.
    relatedQuestionRefs:
    - QE006
    - QE007
    - QE008
  - type: private-evidence-only
    severity: material
    topic: control-and-certification-scope
    missingEvidence: Current scope statements mapping ISO 27001, ISAE 3402, GDPR controls,
      and AI data-handling boundaries to specific brands and products.
    whyItMatters: Public materials show a trust posture, but not whether controls
      cover the full multi-brand portfolio or only selected infrastructure and AI
      services.
    diligencePath: Obtain current certificates, statements of applicability, audit
      scope definitions, and brand-to-control mappings from management.
    relatedQuestionRefs:
    - QE008
