artifact: product-tech
slug: team-blue
runDate: '2026-10-16'
company:
  name: team.blue
chapter:
  number: 5
  title: Product & Technology
  summary: 'team.blue now presents a real multi-layer SMB operating stack rather than
    a single hosting bundle: infrastructure, five SaaS clusters, and an early blue.hub
    orchestration layer are all documented in 2025-2026 company materials. The strongest
    verified product upside is breadth plus AI feature rollout across local brands,
    while the main underwriting constraint is that neutral proof of group-wide reliability,
    control-plane penetration, and security-control scope remains much thinner than
    the marketing narrative.'
sections:
- id: product-scope-and-workflow
  title: Product scope now spans the full SMB digital workflow
  body: 'Public 2025-2026 materials consistently describe team.blue as more than a
    reseller of domains and shared hosting. The company says its products cover the
    full SMB journey from getting online, to winning customers, to staying compliant,
    to getting paid, and the named modules support that framing: infrastructure products
    anchor websites and email, Shoptet extends commerce into payments, logistics,
    and advertising, and newer AI surfaces add faster content and site creation for
    smaller businesses. This breadth matters because it turns product expansion into
    a cross-sell thesis, not just a catalog story. The product map is already broad
    enough to support multiple entry points by customer type, but public evidence
    remains much stronger on module availability than on attach rates or module-level
    retention.

    '
  claimRefs:
  - CE001
  - CE005
  - CE008
  - CE009
  - CE016
  tableRefs:
  - TE001
- id: platform-architecture-and-operating-model
  title: The architecture thesis is a layered platform with early orchestration, not
    a unified stack yet
  body: 'The most important product fact is the three-layer architecture the company
    now repeats across its Year in Review and syndicated July 2026 release. The core
    layer is infrastructure, the middle layer is a five-cluster SaaS portfolio, and
    blue.hub is presented as the orchestration layer that should connect them. That
    architecture is credible at the concept level because the company discloses live
    foundations such as a unified footer across most brands, an opted-in customer
    view, and recommendation pilots, while also being explicit that identity, billing,
    provisioning, and broader support unification are still ahead. In practice, this
    means the technical story is part verified deployment and part roadmap. The structure
    is specific enough to underwrite a platform direction, but not yet specific enough
    to treat cross-brand control-plane unification as complete.

    '
  claimRefs:
  - CE002
  - CE003
  - CE004
  - CE006
  - CE007
  tableRefs:
  - TE003
  figureRefs:
  - FE001
- id: deployment-trust-and-brand-level-maturity
  title: Deployment maturity is clearest at the brand layer, with trust controls visible
    but unevenly evidenced
  body: 'Deployment proof is strongest when team.blue cites specific brand products
    rather than abstract platform claims. The July 2026 AI release names live capabilities
    across Webnode, Macaly, Metricool, and Flexmail; the VMware announcement describes
    continuity and migration support for enterprise infrastructure customers; and
    third-party testing of One.com gives a brand-level view into performance, onboarding,
    and account-linked security controls. Together these sources support a view that
    team.blue can ship useful product increments across brands and does have concrete
    trust surfaces such as European-hosted AI infrastructure, named certifications,
    and documented account recovery flows. The limitation is scope: most neutral evidence
    is still brand-specific, so investors should not assume One.com or a VMware-focused
    infrastructure brand fully represents the operating quality of the entire portfolio.

    '
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  tableRefs:
  - TE002
- id: technical-risks-and-diligence-priorities
  title: The main product risk is integration and control-plane proof, not feature
    scarcity
  body: 'Feature scarcity is not the current issue; proof quality is. team.blue''s
    product breadth, AI rollout cadence, and European infrastructure story are well
    populated with company-issued evidence, but the public record is far thinner on
    shared architecture telemetry, incident history, and what percentage of customers
    actually use the blue.hub control plane across brands. External feedback on One.com
    also shows why this matters: third-party reviews can be strongly positive on usability
    and speed while customer-review aggregation remains sharply negative on pricing
    changes, transfer friction, and occasional service-impact complaints. That mix
    implies the diligence priority is not to confirm whether products exist, but to
    verify whether cross-brand operating quality, migration complexity, and trust
    controls are as scalable as the product narrative implies.

    '
  claimRefs:
  - CE006
  - CE007
  - CE012
  - CE014
  - CE015
tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Internet Infrastructure foundation
    - SMBs, agencies, resellers
    - Scaled core layer with ~2.7M customers and 73% of FY2025 revenue
    - Local-brand distribution plus domains, hosting, email, and infrastructure on
      a recurring base
    - Need uptime, churn, and NPS by major infrastructure brand
  - - SaaS clusters (Websites, Compliance, E-commerce, Engagement, Transactions)
    - SMB operators and functional teams
    - Live portfolio across five named clusters with ~600k customers
    - Cross-workflow coverage beyond hosting; creates attach and cross-sell surfaces
    - Need cluster ARR, attach rate, and retention by brand
  - - Shoptet commerce platform
    - Merchants and larger online sellers
    - Scaled acquired asset; company says revenue exceeds EUR30M and enterprise tier
      already exists
    - Commerce stack spans shop building, payments, logistics, advertising, and premium
      tier
    - Need GMV, merchant retention, and Shoptet Premium adoption
  - - AI application surfaces (Webnode, Macaly, Metricool Studio, Flexmail AI)
    - First-time builders, marketers, and small teams
    - Live 2026 feature set, but monetization evidence remains early
    - Low-friction creation, analytics, translation, and app-building on European
      infrastructure
    - Need product-specific MAU, publish-to-paid conversion, and paid attach
  notes: Status reflects the latest public mention as of 2026-10-16; team.blue does
    not publish module-level usage, retention, or profitability, so maturity is feature-availability
    based rather than cohort-validated.
  claimRefs:
  - CE001
  - CE003
  - CE004
  - CE005
  - CE008
  - CE009
  - CE016
- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - team.blue solution
  - Measurable benefit
  - Limitation
  rows:
  - - Launch a digital presence
    - Domain, hosting, email, and site creation often assembled from separate vendors
    - Infrastructure products plus Webnode or Macaly
    - team.blue says Webnode has built 50M+ sites and 82% of users publish the same
      day they start
    - No neutral benchmark for activation-to-paying-customer conversion
  - - Turn a site into a selling surface
    - Add cart, checkout, payments, and operations tooling after the site is live
    - Shoptet commerce stack and Macaly's Stripe integration
    - Single-vendor path from store build to checkout and recurring subscriptions
    - No public take rate, payment volume, or merchant cohort data
  - - Run marketing and competitor reporting
    - Manually assemble campaign and social reports from multiple tools
    - Metricool Studio plus Flexmail AI features
    - Company says prompts can generate analysis, recommendations, translations, and
      rewrites inside existing workflows
    - No public seat growth, retention, or quantified time-saved evidence
  - - Operate securely with non-technical staff
    - Small teams rely on guided setup, backups, and account recovery
    - One.com dashboard, backups, AI-assisted setup, and Advanced Login Protection
    - HostAdvice measured sub-600ms load time and documented account-reset/support/phpMyAdmin
      recovery paths
    - Brand-level review evidence does not prove group-wide consistency
  notes: Benefits are limited to named public examples and cited third-party tests;
    where no public denominator exists, the limitation column preserves the gap instead
    of inferring it.
  claimRefs:
  - CE008
  - CE009
  - CE013
  - CE014
- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Risk
  rows:
  - - Local brands and distribution network
    - Customer acquisition, support, and localization surface across Europe
    - Dozens of brand front ends and local teams
    - Cross-brand integration can lag even if local products are strong
  - - blue.hub orchestration layer
    - Shared customer view and future identity/billing/provisioning/control plane
    - Opted-in customer graph plus brand integrations
    - Public proof shows early rollout, not completed adoption or migration depth
  - - European infrastructure and GPU services
    - Hosting, cloud, and AI-compute substrate
    - Data centers, certifications, and partner ecosystems such as VMware
    - Capacity, utilization, and certificate scope are not public by product or brand
  - - Brand-level control planes such as One.com
    - End-user onboarding, backups, WordPress management, and support workflows
    - Dashboard design, recovery tooling, and operational support teams
    - User experience can vary by brand, and customer-review evidence flags transfer
      and pricing friction
  notes: Architecture dependencies and risks reflect the strongest public evidence
    available; team.blue does not publish a neutral group-wide architecture diagram,
    status dashboard history, or control-plane penetration metrics.
  claimRefs:
  - CE002
  - CE006
  - CE007
  - CE010
  - CE012
  - CE014
  - CE015
figures:
- id: FE001
  title: Product architecture map
  type: stack
  summary: team.blue's disclosed architecture layers a recurring infrastructure base
    under workflow software and an early orchestration layer.
  data:
    layers:
    - label: L1 - Local brand distribution
      detail: Country-level entry points, support teams, and reseller relationships
      modules:
      - Hosting and infrastructure brands
      - Agency and reseller channels
      outputs:
      - Localized acquisition and support
    - label: L2 - Internet Infrastructure foundation
      detail: Recurring online-presence substrate distributed through local brands
      modules:
      - Domains and DNS
      - Hosting and email
      - Cloud, managed hosting, and GPU services
      outputs:
      - Reliable online presence, data locality, and compute capacity
    - label: L3 - Websites and creation tooling
      detail: Fast launch layer for first-time digital operators
      modules:
      - Webnode
      - Macaly
      outputs:
      - Site and app creation from low-friction prompts
    - label: L4 - SaaS workflow portfolio
      detail: Workflow software organized into five named clusters
      modules:
      - Compliance tooling
      - E-commerce platforms
      - Engagement and analytics
      - 'Transactions: invoicing, payments, and booking'
      outputs:
      - Higher attach across discovery, selling, and operations workflows
    - label: L5 - Trust and infrastructure governance
      detail: Control layer for certifications, data location, and partner continuity
      modules:
      - ISO 27001 and ISAE 3402-certified AI infrastructure
      - GDPR-aligned enterprise infrastructure
      - VMware continuity and migration support
      outputs:
      - Operational trust signals for regulated or scaled workloads
    - label: L6 - blue.hub orchestration
      detail: Early cross-brand connective tissue rather than a fully unified control
        plane
      modules:
      - Unified footer on 95%+ of brands
      - Opted-in customer single view
      - Recommendation engine pilots
      - Roadmap to identity, billing, provisioning, and consolidated support
      outputs:
      - Cross-brand discovery, support, and automation
  approximationNotes: This figure reflects the company's disclosed operating model
    and named deployed elements; it does not infer undisclosed internal systems or
    completed migration depth.
