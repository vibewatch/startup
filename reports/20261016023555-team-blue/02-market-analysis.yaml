  rows:
  - - Internet infrastructure
    - Domains, hosting, email, and infrastructure services sold directly to SMBs
    - Pure datacenter capacity or CDN spend bought without a hosting relationship
    - Founder, agency/reseller, or SMB IT owner
    - Recurring renewal base and first-touch online-presence spend
  - - Websites & apps
    - Website builders and app-build tools for SMB launch and visibility
    - Custom one-off development projects sold as services
    - Founder or marketer with founder budget approval
    - Typical first SaaS upsell after domains/hosting basics
  - - Compliance
    - Cookie, privacy, and accessibility software
    - Bespoke legal counsel or offline policy work
    - Founder, ops, or compliance owner
    - Trust and regulatory trigger with retention value
  - - E-commerce
    - Online-store platforms plus merchant enablement workflows
    - Offline-only retail tooling or marketplace-only selling
    - Merchant founder or e-commerce manager
    - Higher-value expansion path where Shoptet deepens adjacency
  - - Engagement
    - Social media management and influencer-marketing tools
    - Offline media buying
    - Marketing lead or founder
    - Customer-acquisition layer that broadens wallet share
  - - Transactions
    - Invoicing, payments, and booking software
    - Full ERP suites outside SMB workflow scope
    - Founder, finance owner, or ops owner
    - Operational stickiness beyond initial website presence
  notes: team.blue bundles categories that independent trackers still treat separately,
    so the boundary here is defined by the company's one-stop SMB workflow scope rather
    than by a single external market taxonomy.
