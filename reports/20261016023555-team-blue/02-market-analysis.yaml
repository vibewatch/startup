company:
  name: team.blue
chapter:
  number: 2
  title: Market Analysis
  summary: team.blue's market is not a single hosting niche; it is a bundled SMB digital-enablement
    stack spanning domains, hosting, websites, compliance, e-commerce, engagement,
    and transactions. The source pack supports strong evidence for team.blue's installed
    base and monetized footprint, but it does not provide an independent pan-European
    TAM/SAM benchmark, so the chapter relies on evidence-constrained sizing lenses
    instead of a classic market-size model.
sections:
- id: market-boundary
  title: Market boundary and category logic
  body: 'team.blue''s current disclosures define the market as an integrated SMB digital-enablement
    stack rather than a pure hosting or domain-registration category. The company
    now describes a three-layer model: internet infrastructure as the renewal-heavy
    base, a broader SaaS portfolio on top, and blue.hub as an orchestration layer
    that connects identity, billing, and AI recommendations. That framing matters
    because independent taxonomies in the source pack still split web hosting and
    domain-registration dynamics into distinct underlying categories, while team.blue''s
    go-to-market bundles them with adjacent software workflows such as compliance,
    e-commerce, engagement, and transactions. The practical status quo substitute
    for many SMBs is therefore not one direct competitor but a fragmented stack of
    local hosts, registrars, point SaaS tools, agencies, and manual workflows, which
    is why market boundary discipline matters before discussing size.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Evidence-constrained sizing and monetized footprint
  body: 'The source pack is stronger on observed footprint than on external denominator.
    On the observed side, company materials support a large monetized base: roughly
    3.3 million customers, FY2025 reported revenue of €866M, ARR above €850M, and
    a mix that remains infrastructure-led but with a meaningful SaaS layer already
    at 27% of revenue. On the demand side, team.blue''s own FY2025 review argues that
    65% of European SMBs still lack basic digital solutions, which implies substantial
    adoption headroom if the figure is directionally right. What is missing is an
    independent, pan-European market model that reconciles domains, hosting, compliance,
    commerce, and SMB operating software into a single TAM/SAM/SOM stack. For valuation,
    that means the defensible near-term lens is platform monetization depth inside
    an already-large installed base, not a generic “huge market” claim.'
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
  - CM016
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: buyer-segmentation
  title: Buyer, user, payer, and workflow segmentation
  body: 'The company is effectively selling into several recurring SMB workflows instead
    of one monolithic budget line. Infrastructure products solve the first online-presence
    decision for founders and agencies; SaaS layers then monetize later-stage needs
    in websites, privacy/compliance, online stores, customer engagement, payments,
    and bookings. The buyer, user, and payer often collapse into the same person for
    micro-SMBs, but split into marketing, operations, IT, and compliance roles as
    the business grows. That segmentation explains why team.blue''s cross-sell logic
    matters more than a narrow hosting-share argument: if infrastructure remains the
    land-and-expand wedge, then merchant workflows and operational SaaS are the clearest
    path to higher ARPU and stickier retention. Shoptet is relevant because it deepens
    exactly that merchant workflow layer rather than merely adding more low-value
    domain volume.'
  claimRefs:
  - CM001
  - CM002
  - CM007
  - CM008
  - CM014
  - CM015
  tableRefs:
  - TM003
- id: drivers-and-constraints
  title: Adoption drivers, constraints, and diligence gaps
  body: 'The demand case rests on three linked drivers: a large digital-adoption gap
    among European SMBs, accelerating AI experimentation that raises the value of
    simplified software bundles, and a sovereignty/regulatory backdrop that appears
    to increase receptivity to European providers. The same evidence also shows why
    conversion can still be slower than the headline market opportunity suggests.
    Surveyed SMBs report confusion over which tools to buy, weak digital confidence,
    time and resource constraints, and lingering mistrust of AI on data security,
    accuracy, and brand-control grounds. Those frictions imply that budget authority
    alone does not guarantee adoption; product simplicity, local support, and trust
    are central to win-rate. The chapter''s main diligence gap is that none of the
    retained sources independently quantify the bundled European SMB digital-enablement
    market that management is implicitly targeting, so the cleanest next-step ask
    is management''s internal market model tied to product-cluster cohorts and current
    footprint definitions.'
  claimRefs:
  - CM003
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM016
