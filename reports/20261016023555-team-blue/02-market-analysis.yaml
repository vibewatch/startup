  evidenceGaps:
  - type: missing-source
    severity: material
    topic: independent-tam
    missingEvidence: An independent Europe-wide market-size model that bridges domains,
      hosting, compliance, commerce, and SMB operating SaaS into one bundled denominator.
    whyItMatters: Valuation upside currently rests on company footprint and demand
      signals rather than a third-party TAM or SAM benchmark.
    diligencePath: Request management's internal market model plus any third-party
      studies used in board or lender materials, then reconcile each layer to product-cluster
      revenue.
    relatedQuestionRefs:
    - QM008
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: disclosure-drift
    missingEvidence: A single current disclosure for customer count, brand count,
      expert count, and country footprint tied to one reporting date.
    whyItMatters: Footprint drift weakens penetration, productivity, and cross-sell
      assumptions that would otherwise anchor market sizing.
    diligencePath: Obtain the latest management or lender deck used in 2026 financing
      discussions and lock the operating footprint to one dated snapshot.
    relatedQuestionRefs:
    - QM002
  - type: private-evidence-only
    severity: material
    topic: product-sam
    missingEvidence: Product-line NRR, churn, ARPU, and booking mix by infrastructure
      versus each SaaS cluster.
    whyItMatters: These splits determine whether monetization upside comes from new-logo
      growth, pricing, or cross-sell depth.
    diligencePath: Ask for FY2025 cohort tables and 2026 YTD bookings by cluster,
      channel, and geography.
    relatedQuestionRefs:
    - QM003
    - QM005
    relatedTableRefs:
    - TM002
    - TM003
