callouts:
- calloutType: risk
  title: Breadth is visible; price discipline is not
  body: The evidence reviewed here is strong enough to show that team.blue is widening its competitive surface through acquisitions, AI product bundling, and cross-brand distribution. It is not strong enough to show whether that breadth translates into consistently defendable pricing, low churn, or superior win rates against point solutions, because public tariff detail and independent customer economics remain sparse.
  claimRefs:
  - CP004
  - CP010
  - CP013
  - CP014
