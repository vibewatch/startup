- id: TP003
  title: Pricing and packaging comparison
  columns:
  - Offer / layer
  - Price / contract model
  - Included capabilities
  - Unknowns / caveats
  - Implication
  rows:
  - - One.com web hosting
    - US$0.99/month intro offer; renewal price higher
    - Free domain first year, SSL, daily backups, email, website builder, WordPress install
    - Monthly billing not available; review is one tester’s snapshot rather than portfolio-wide tariff evidence
    - Strong entry-level price can win simple SMB cases, but renewal step-up needs close comparison
  - - One.com customer-reported billing experience
    - Customer reports describe automatic plan step-ups when backup storage exceeded thresholds
    - Continued hosting access plus paid add-ons such as PHP and WordPress in review complaints
    - Adverse evidence is review-based and not a formal tariff schedule
    - Packaging opacity can become a displacement risk even when entry pricing is low
  - - Flexmail AI features
    - Included on every plan; usage depends on plan credit allowance
    - AI translator and AI copywriter inside the email builder
    - No public credit caps, overage terms, or competitor parity details in the reviewed sources
    - AI is being bundled as a retention and upsell feature rather than sold as a clearly separable SKU
  - - Broader platform layers (Shoptet Premium, GPU-as-a-Service, blue.hub cross-sell)
    - Public list pricing not disclosed in reviewed sources
    - Capabilities are described, but commercial terms are not
    - No apples-to-apples public list pricing across most layers
    - Pricing durability and margin quality cannot be benchmarked cleanly from current evidence
  - - GoDaddy and Wix
    - Not established by the assigned evidence
    - Broader SMB stacks are mentioned, but current packages are not documented
    - No retained primary pricing source for either company
    - Direct price comparison would be speculative and is left as a diligence gap
  notes: Only One.com provides a concrete public entry price in the public evidence reviewed here; most other portfolio layers expose capability or packaging language without enough tariff detail for rigorous competitor comparison.
