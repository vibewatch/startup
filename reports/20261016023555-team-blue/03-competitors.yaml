  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Comparable public list pricing, contract terms, and discounting policy across the main infrastructure, e-commerce, email, and AI layers.
    whyItMatters: Without consistent tariff evidence, it is not possible to judge whether bundle breadth translates into defendable price realization or just wider scope with hidden concessions.
    diligencePath: Request current price books, standard contracts, and renewal rules for One.com, Webnode, Flexmail, Shoptet Premium, and GPU-as-a-Service, then rerun the pricing table on like-for-like units.
    relatedQuestionRefs:
    - QP008
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: moat-durability
    missingEvidence: Independent win/loss, attach-rate, and churn data showing whether infrastructure customers actually convert into higher-value SaaS relationships.
    whyItMatters: The moat case depends on cross-sell efficiency and retention improvement, but current evidence is mostly company narrative rather than externally verified customer economics.
    diligencePath: Request cohort retention, product attach, cross-sell conversion, and churn-by-brand data for the infrastructure base and acquired SaaS brands.
  - type: missing-source
    severity: minor
    topic: switching-costs
    missingEvidence: Independent evidence on multi-homing, migration effort, and customer switching costs between team.blue brands and rival hosts or point solutions.
    whyItMatters: Switching-cost visibility determines whether the bundle behaves like a durable moat or a convenience layer that customers can replace piecemeal.
    diligencePath: Collect customer case studies, migration data, cancellation cohorts, and reseller churn commentary across major brands.
