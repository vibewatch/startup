slug: team-blue
runDate: '2026-10-16'
company:
  name: team.blue
chapter:
  number: 4
  title: Financials
  summary: team.blue's latest public disclosure shows a subscription-led platform
    with €866 million of FY2025 ARR, 73% of revenue still tied to infrastructure,
    and AI increasingly used as an attach and upsell layer. Underwriting remains blocked
    by the absence of public cash, debt, margin, churn, and realized-pricing data,
    while adverse one.com reviews suggest monetization can lean on price increases
    and forced upgrades.
sections:
- id: revenue-model-and-traction
  title: Revenue model and disclosed traction
  body: team.blue's clearest public financial datapoint is scale, not profitability.
    The group says FY2025 ARR reached €866 million with 11% organic revenue growth,
    while the 2025 review and syndicated release both show the platform is still anchored
    in recurring infrastructure rather than pure application software. Internet Infrastructure
    serves around 2.7 million customers and contributes 73% of FY2025 revenue, while
    SaaS Solutions serves roughly 600,000 customers and contributes the remaining
    27% across websites, compliance, e-commerce, engagement, and transactions. That
    mix supports a relatively durable recurring base, but it also means the underwriting
    case depends on renewal quality, support intensity, and attach rates that the
    company does not publish publicly.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI005
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: pricing-and-gtm-visibility
  title: Pricing, upsell, and GTM visibility
  body: 'Public evidence suggests monetization is widening through attach and bundling
    rather than through a clean standalone AI SKU. Management says AI-enabled products
    generated roughly half of new customer ARR by December 2025, and recent product
    releases show AI features being embedded into existing workflows: Flexmail includes
    AI translation and copywriting on every plan with usage governed by credit allowances,
    while Macaly now supports one-off sales and recurring subscriptions through Stripe
    integration. team.blue also has a meaningful first-party distribution asset: its
    digital-maturity study aggregates feedback from more than 8,200 businesses across
    32 countries, and its data-sovereignty study says 32.1% of surveyed SMEs already
    store data with team.blue. Those signals imply strong top-of-funnel reach and
    cross-sell potential, but they are still proxies; no public source in the retained
    set discloses CAC, payback, realized ARPU, or partner-channel economics.'
  claimRefs:
  - CI004
  - CI008
  - CI009
  - CI010
  - CI011
  - CI016
  tableRefs:
  - TI002
- id: cost-base-and-capital-opacity
  title: Cost structure, service-delivery burden, and capital opacity
  body: 'The operating model appears more capital- and service-intensive than a lightweight
    SaaS multiple might imply. team.blue''s own materials describe local-language
    support, owned European infrastructure, GPU capacity offered from its own data
    centres, and continued inorganic expansion, including Shoptet as the eighth acquisition
    completed in 2025 with revenue already above €30 million. Those ingredients can
    support durable distribution and deeper wallet share, but they also imply integration
    cost, support headcount, infrastructure spend, and potentially acquisition-related
    financing needs. The problem is that none of the reviewed public materials disclose
    the balancing numbers: there is no public cash position, debt stack, covenant
    headroom, runway, capex, CAC, payback, or segment gross margin in the retained
    evidence. Customer reviews on one.com also show a downside case where monetization
    depends on forced upgrades and support friction rather than clean product-led
    expansion.'
  claimRefs:
  - CI006
  - CI007
  - CI012
  - CI013
  - CI014
  - CI015
  tableRefs:
  - TI003
- id: financial-verdict
  title: Financial verdict and diligence blockers
  body: 'Financially, the revenue story is directionally credible: there is disclosed
    recurring scale, a large installed customer base, a visible infrastructure core,
    and early evidence that AI features are improving new-ARR mix. But the data that
    matters for underwriting a late-stage, acquisition-heavy platform is still missing.
    Without audited revenue-to-cash conversion, leverage, interest burden, covenant
    headroom, renewal quality, or realized pricing by brand, it is impossible to judge
    whether team.blue is compounding from healthy subscription economics or masking
    margin pressure through M&A and pricing actions. The chapter therefore lands at
    a cautious positive on revenue quality, but a clear diligence stop on capital
    adequacy and unit economics until lender or board materials are produced.'
  claimRefs:
  - CI001
  - CI004
  - CI012
  - CI013
  - CI014
  - CI016
tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Internet Infrastructure
    - Domains, hosting, email, and infrastructure services sold through local brands
    - Recurring subscriptions / renewals
    - 73% of FY2025 revenue; around 2.7M customers
    - Large recurring base, but no disclosed segment margin or renewal cohorts
    - Provide segment gross margin, renewal rates, deferred-revenue policy, and churn
      by core infra brand
  - - SaaS Solutions
    - Websites, compliance, e-commerce, engagement, and transactions
    - Software subscriptions and usage workflows
    - 27% of FY2025 revenue; around 600k customers
    - Higher-growth attach opportunity, but mix by cluster is undisclosed
    - Provide ARR and gross margin by SaaS cluster plus cross-sell penetration from
      hosting into SaaS
  - - AI-enabled expansion
    - AI features embedded across builders, marketing, compliance, and support workflows
    - Attach / upsell to existing plans
    - Roughly half of new customer ARR by December 2025; ARR growth roughly 2x non-AI
      products
    - Promising expansion vector, but no standalone AI revenue or cost disclosure
    - Break out AI ARR, attach rates, inference cost, and retention uplift versus
      non-AI cohorts
  - - Acquired e-commerce volume
    - M&A adds brands, distribution, and transaction software revenue
    - Acquired revenue base
    - Shoptet exceeded €30M revenue and was the 8th acquisition closed in 2025
    - Broadens mix, but obscures acquired-versus-organic contribution and integration
      cost
    - Reconcile acquired ARR, synergy timing, earn-out obligations, and integration
      spend by 2025 deal
  notes: Company disclosures show product-layer mix and selected acquisition facts,
    but not recognized-revenue policy, segment margin, or acquired-versus-organic
    bridge.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI006
  - CI007
- id: TI002
  title: Pricing / monetization table
  columns:
  - Monetization surface
  - Price / unit / contract
  - List vs realized pricing
  - Public signal
  - Source-backed implication
  - Diligence ask
  rows:
  - - Domains / hosting / email / infrastructure
    - Exact group price book undisclosed in assigned sources
    - Unknown
    - Infrastructure still supplies 73% of FY2025 revenue
    - Core monetization is recurring, but public evidence does not show ARPU, discounting,
      or renewal uplift
    - Provide brand-level price books, ARPU, discount ladders, and renewal uplift
      by cohort
  - - Flexmail AI features
    - Included on every plan; usage governed by each plan's credit allowance
    - List pricing embedded in existing plans; realized monetization undisclosed
    - AI Translator and AI Copywriter ship as bundled plan entitlements
    - AI may raise ARPU and retention through bundle value rather than standalone
      SKU revenue
    - Provide credit economics, attach rate, overage rules, and gross margin impact
      of AI usage
  - - Macaly commerce workflow
    - Supports one-off sales or recurring subscriptions through direct Stripe integration
    - Take rate / partner rev share undisclosed
    - Product now bundles cart, checkout, payments, receipts, and revenue tracking
    - Payments and commerce can open transaction-based monetization, but economics
      versus Stripe fees are opaque
    - Provide payments take rate, Stripe revenue share, chargeback cost, and merchant
      conversion funnel
  - - one.com legacy hosting brand
    - Customer review cites automatic move to a more expensive package and added charges
      for PHP / WordPress
    - Realized pricing may rise through upgrades and add-ons rather than headline
      list price
    - Review alleges storage-policy changes triggered price doubling for some users
    - Pricing power may rely partly on friction and forced upsell, raising churn and
      support risk
    - Provide complaint rates, refund rates, churn after price changes, and the share
      of revenue from add-ons versus base plan
  notes: This table separates observable monetization mechanics from missing realized-pricing
    data; it does not infer list prices that are absent from the retained source pool.
  claimRefs:
  - CI002
  - CI004
  - CI011
  - CI012
- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR / organic growth
    - €866M ARR; +11% organic growth
    - High
    - Confirms scale and continued top-line momentum
    - Tie ARR to audited revenue, bookings, cash conversion, and deferred-revenue
      movement
  - - Revenue mix
    - 73% infrastructure / 27% SaaS
    - High
    - Shows the base is still infrastructure-led rather than pure software
    - Provide segment gross margin, renewal rates, and support cost-to-serve by segment
  - - AI share of new ARR
    - ~50% by December 2025; ARR growth roughly 2x non-AI products
    - High
    - Suggests AI is the current expansion wedge
    - Provide AI attach rate, conversion uplift, retention delta, and inference cost
      per active account
  - - CAC / payback
    - null
    - Low
    - Sales efficiency cannot be underwritten without acquisition cost and payback
    - Provide blended and by-channel CAC, payback, funnel conversion, and reseller
      economics
  - - NRR / GRR / churn
    - null
    - Low
    - Recurring-revenue quality depends on retention, not just booked ARR
    - Provide group and segment NRR, GRR, logo churn, and revenue churn by core brand
      cohort
  - - Cash / net debt / runway
    - null
    - Low
    - Capital adequacy cannot be judged without leverage and liquidity
    - Provide latest cash, gross debt, net debt, covenant headroom, interest cost,
      and maturity schedule
  notes: Null values mark underwriting-critical metrics that are not publicly disclosed
    in the retained evidence and therefore require management-room diligence.
  claimRefs:
  - CI001
  - CI002
  - CI004
  - CI013
  - CI014
