- calloutType: risk
  title: Capital structure remains a hard diligence blocker
  body: The retained public sources disclose ARR and mix, but none disclose cash,
    debt, covenant headroom, or runway, so leverage risk and refinancing dependency
    cannot be underwritten from public evidence.
  claimRefs:
  - CI013
  - CI014
- calloutType: recommendation
  title: Demand lender and cohort-economics materials before underwriting valuation
  body: A recurring infrastructure base and AI-led upsell story are not enough on
    their own; the next diligence step should be to reconcile leverage, retention,
    realized pricing, and acquisition integration economics to reported ARR.
