  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy-gap
    missingEvidence: Current cash balance, gross debt, net debt, covenant headroom,
      maturity schedule, and any project- or acquisition-finance obligations.
    whyItMatters: Without leverage and liquidity data, the company's ability to fund
      AI investment, M&A integration, and any refinancing needs cannot be underwritten.
    diligencePath: Request the latest lender deck, debt schedule, monthly cash bridge,
      and covenant-compliance certificate.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: CAC, payback, NRR, GRR, logo churn, revenue churn, and segment
      gross margin by infrastructure versus SaaS.
    whyItMatters: Recurring ARR scale is not enough to judge valuation quality without
      evidence of retention, cost-to-serve, and efficient customer acquisition.
    diligencePath: Request cohort dashboards, retention tables, gross-margin by segment,
      and channel-level CAC/payback files.
    relatedQuestionRefs:
    - QI005
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: pricing-mechanics
    missingEvidence: Brand-level list prices, discounting rules, renewal uplift, add-on
      attach, and realized ARPU across major hosting and SaaS brands.
    whyItMatters: The public record shows monetization surfaces but not whether growth
      comes from healthy expansion, price increases, or forced upgrades.
    diligencePath: Collect current price books and renewal notices for top brands,
      then reconcile them to realized ARPU and complaint data.
    relatedQuestionRefs:
    - QI003
    - QI008
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: acquisitions
    missingEvidence: Acquired-versus-organic ARR bridge, synergy targets, integration
      cost, and earn-out obligations for 2025 acquisitions.
    whyItMatters: M&A can inflate scale while masking margin dilution or financing
      dependence if acquired revenue and integration burden are not separated.
    diligencePath: Request a 2025 acquisition ledger with purchase price, revenue
      contribution, earn-outs, and post-close integration spend by deal.
    relatedQuestionRefs:
    - QI006
    relatedTableRefs:
    - TI001
