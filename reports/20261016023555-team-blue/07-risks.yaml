  evidenceGaps:
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: A current debt schedule with tranche sizes, maturity ladder,
      covenant definitions, headroom, and debt-service coverage.
    whyItMatters: The withdrawn repricing is visible, but investors still cannot distinguish
      routine opportunistic refinancing from a tighter funding position.
    diligencePath: Request the latest lender presentation, debt agreements, covenant
      model, and board debt update used for treasury monitoring.
    relatedQuestionRefs:
    - QR009
  - type: missing-source
    severity: material
    topic: compliance-governance
    missingEvidence: A group-wide incident, regulator, litigation, and privacy-enforcement
      log covering the major operating brands.
    whyItMatters: team.blue is positioning itself around European hosting, privacy,
      and accessibility, so execution quality matters more than generic compliance
      marketing.
    diligencePath: Collect CISO and legal review packs, open incident register extracts,
      regulator correspondence, and external audit coverage by brand.
    relatedQuestionRefs:
    - QR009
