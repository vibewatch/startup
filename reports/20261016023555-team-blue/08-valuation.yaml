  - Evidence
  - Judgment
  - Decision implication
  rows:
  - - Recommendation
    - €866m FY2025 ARR and 11% reported organic revenue growth, but no current price
      bridge
    - Track
    - Do not invest from public evidence alone
  - - Confidence
    - Core valuation and operating metrics are company-issued or transaction-adviser
      reported
    - Medium-low
    - Require primary diligence before underwriting returns
  - - Risk rating
    - Debt, preference, normalization, retention, and exit inputs are missing
    - High
    - Treat missing downside mechanics as material, not zero
  - - Valuation stance
    - €4.8bn July 2024 company value versus €866m FY2025 ARR is a mixed-vintage ~5.5x
      ratio
    - Insufficiently supported
    - Do not label the ratio EV/ARR or a current trading multiple
  - - Price movement condition
    - Audited KPI bridges, net debt, preferences, and current cap table
    - Research more
    - Set a range only after the fully diluted equity bridge is verified
  notes: Judgments use company-issued FY2025 KPIs and a 2024 transaction mark; the
    mixed-vintage ratio is directional and is not an enterprise-value multiple.
