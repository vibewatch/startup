company:
  name: team.blue
chapter:
  number: 8
  title: Valuation
  summary: team.blue reports €866 million of FY2025 ARR and 11% organic revenue growth,
    but the last explicit public valuation in the retained evidence is the €4.8 billion
    July 2024 transaction mark. A mixed-vintage ratio of those figures is about 5.5x,
    yet missing net debt, preference, audited normalization, and exit evidence makes
    a precise return range unsupportable and limits the recommendation to track.
sections:
- id: recommendation-and-entry-discipline
  title: Recommendation and entry discipline
  body: 'The recommendation is track, with medium-low confidence, high underwriting
    risk, and an insufficiently supported valuation stance at the last disclosed €4.8
    billion company value. The positive case is real scale: team.blue reports €866
    million of FY2025 ARR, 11% organic revenue growth, and a 42% EBITDA metric. The
    limiting issue is not company quality but price discovery. Those operating measures
    are company-issued, the Year in Review cautions that internal KPIs may not be
    defined under accounting standards, and the Yahoo-hosted item is explicitly labelled
    a paid press release rather than independent corroboration. An invest-now decision
    therefore requires audited revenue and EBITDA bridges, net debt and covenant data,
    preference terms, and a current cap table. No target return, hold period, or exit
    value can be responsibly stated before those inputs are obtained.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV006
  - CV007
  - CV014
  tableRefs:
  - TV001
- id: financing-and-valuation-context
  title: Financing and valuation context
  body: The most recent explicit valuation retained for this chapter is the July 2024
    transaction in which CPP Investments acquired about 20% and team.blue was valued
    at €4.8 billion; Hg remained the largest investor and invested additional funds.
    Dividing that company-value mark by the later €866 million FY2025 ARR produces
    a directional ratio of roughly 5.5x. It is not a transaction-date multiple and
    must not be presented as EV/ARR because the dates differ and the source does not
    identify the €4.8 billion figure as enterprise value. The retained evidence also
    does not quantify net debt, liquidation preferences, dilution, or covenant headroom.
    Entry discipline should therefore focus on a fully diluted, preference- adjusted
    equity bridge and downside debt capacity rather than negotiating from the headline
    mark alone.
  claimRefs:
  - CV001
  - CV003
  - CV004
  - CV006
  - CV008
- id: thesis-and-anti-thesis
  title: Thesis and anti-thesis
  body: 'The thesis is a scaled recurring-revenue platform with reported organic growth,
    a 73% infrastructure and 27% SaaS revenue mix, and an acquisition engine that
    team.blue says has added about €300 million of acquired revenue since 2020. AI-enabled
    products are also reported to grow ARR about twice as fast as non-AI products
    and to represent roughly half of new-customer ARR by December 2025. The anti-thesis
    is evidence concentration and execution complexity: headline KPIs come from the
    company or its syndicated releases, Shoptet was already the eighth acquisition
    announced in 2025, and the retained independent market-data source supplies a
    hosting-share methodology but no team.blue-specific value in its fetched text.
    The result is a credible strategic narrative without enough independent financial
    evidence to validate the headline price.'
  claimRefs:
  - CV002
  - CV005
  - CV006
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
  - CV016
  tableRefs:
  - TV002
- id: scenarios-exit-and-diligence
  title: Scenarios, exit readiness, and diligence asks
  body: The bull case requires independent confirmation that reported ARR quality,
    organic growth, EBITDA, and cash conversion survive audit and that cross-sell
    and AI growth add value without acquisition-driven leverage overwhelming returns.
    The base case keeps the company on a watchlist at, but not above, the last public
    mark until debt, preferences, cohort retention, and integration economics are
    disclosed. The bear case is triggered by material KPI normalization, weak retention,
    leverage pressure, or evidence that serial acquisitions mask organic performance;
    it implies a material discount whose size cannot be calculated from public evidence.
    Scale may create IPO or sponsor-secondary optionality, but the retained sources
    do not establish an exit route or timetable. Final diligence should obtain audited
    statements, ARR and revenue reconciliations, debt documents, the preference waterfall,
    acquisition cohorts, retention by segment, and board- approved exit planning.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV006
  - CV007
  - CV008
  - CV009
  - CV012
  - CV013
