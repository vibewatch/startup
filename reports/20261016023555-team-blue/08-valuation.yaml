- id: TV002
  title: Thesis and anti-thesis
  columns:
  - Side
  - Argument
  - Evidence signal
  - What would change the view
  rows:
  - - Thesis
    - Scaled recurring-revenue base
    - Company reports €866m FY2025 ARR
    - Independent ARR-to-revenue and retention reconciliation
  - - Thesis
    - Organic growth at scale
    - Company reports 11% FY2025 organic revenue growth
    - Audited organic-growth bridge excluding acquisitions and FX
  - - Thesis
    - Infrastructure-to-SaaS cross-sell option
    - Reported revenue mix is 73% infrastructure and 27% SaaS
    - Segment NRR, gross margin, and attach-rate cohorts
  - - Thesis
    - AI product momentum
    - Company reports ~2x ARR growth for AI-enabled products and ~50% of new-customer
      ARR
    - Product-level ARR, churn, margin, and cohort verification
  - - Anti-thesis
    - Serial-acquisition complexity
    - About €300m acquired revenue since 2020; Shoptet was the eighth 2025 acquisition
    - Acquisition-cohort returns, integration costs, and impairment history
  - - Anti-thesis
    - Weak independent price support
    - Paid syndication and a market-share methodology do not validate the €4.8bn mark
    - Independent comps, secondary marks, and a preference-adjusted cap table
  notes: Thesis metrics are management-reported; anti-thesis rows distinguish issuer
    independence from the domain hosting or syndicating the material.
