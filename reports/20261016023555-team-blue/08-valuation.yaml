  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Current fully diluted cap table, net debt, debt maturities, covenant
      headroom, liquidation preferences, participation rights, and transaction fees.
    whyItMatters: Headline company value cannot be converted into common-equity proceeds
      or downside returns without the debt and preference waterfall.
    diligencePath: Obtain the current cap table, debt schedule, facility agreements,
      covenant calculations, shareholder agreements, and a management-prepared waterfall.
    relatedQuestionRefs:
    - QV007
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: Board-approved exit alternatives, target timetable, adviser materials,
      and independent evidence for an IPO, sponsor secondary, or strategic sale.
    whyItMatters: Return timing and realizable exit value cannot be underwritten from
      operating scale alone.
    diligencePath: Review board minutes, sponsor fund-life constraints, banker materials,
      and comparable European software and hosting exits.
    relatedQuestionRefs:
    - QV006
  - type: missing-source
    severity: material
    topic: financial-normalization
    missingEvidence: Audited revenue, ARR reconciliation, segment gross margin, normalized
      EBITDA, cash-flow conversion, NRR, GRR, churn, and acquisition-cohort returns.
    whyItMatters: Company-issued KPIs cannot establish sustainable earnings, ARR quality,
      or a defensible valuation range without accounting and cohort bridges.
    diligencePath: Obtain audited statements and quality-of-earnings work, then reconcile
      every valuation KPI to statutory revenue, cash flow, and segment cohorts.
