- id: TO003
  title: Stakeholder or investor map
  columns:
  - Stakeholder
  - Role
  - Control or economic importance
  - Evidence
  - Diligence ask
  rows:
  - - SMB customers
    - Revenue base
    - Official materials place the platform at 3.3m to 3.4m SMB customers across Europe.
    - Scale is material but still management-asserted.
    - Request active paid-customer bridge, churn, and segment mix.
  - - Agency and reseller partners
    - Channel / distribution layer
    - Year in Review cites approximately 30,000 partners, suggesting indirect acquisition
      and distribution leverage.
    - Partner economics are undisclosed.
    - Request partner retention, take-rate, and contribution-margin data.
  - - Founders retained post-acquisition
    - Operating-control layer
    - Year in Review says more than 30 founders still hold operating roles and more
      than 90% stay beyond earn-out.
    - Supports the buy-and-build model but implies retention dependence.
    - Request founder attrition cohort and post-earn-out retention data.
  - - Employees / experts
    - Delivery and support capacity
    - Official surfaces cite 4,000+ people while other current materials cite lower
      expert counts.
    - Workforce scale matters to support capacity and integration execution.
    - Request current FTE count by function, country, and support load.
  - - Acquired management teams (e.g., Shoptet)
    - Expansion and integration execution
    - Shoptet was presented as the eighth 2025 acquisition while keeping its current
      management team.
    - Integration depth and synergy capture are not publicly measured.
    - Request PMI scorecard, synergy targets, and integration timeline.
  notes: Stakeholder groups visible in retained public evidence; investor names and
    formal ownership stakes are not supported in this pool.
  enumerationScope:
    coverage: partial
    basis: Stakeholder groups explicitly visible in the retained public sources for
