  - Key-person dependency / gap
  rows:
  - - Claudio Corbetta
    - Group CEO
    - Signs the FY2025 foreword and November 2025 press release as the operating leader.
    - Owns platform, AI, and growth narrative in retained materials.
    - High narrative concentration; succession planning is not public in the assigned
      pool.
  - - Jonas Dhaenens
    - Founder & President
    - Quoted in the November 2025 release and listed in the FY2025 leadership roster.
    - Embodies the founder-operator acquisition model the group advertises.
    - Founder influence appears material; board mechanics are not publicly described
      here.
  - - Dawn Marriott
    - Executive Chair
    - Named on the FY2025 leadership page.
    - Shows disclosed chair-level governance presence.
    - Broader board composition and committee structure are absent from the pool.
  - - Jonathan Thackray
    - Chief Financial Officer
    - Named on the FY2025 leadership page.
    - Provides visible finance ownership at executive level.
    - Debt structure and covenant reporting are still undisclosed despite named finance
      leadership.
