company:
  name: team.blue
chapter:
  number: 1
  title: Company Overview
  summary: team.blue is a pan-European SMB digital-services platform whose retained
    public materials show meaningful scale and acquisition momentum, including FY2025
    ARR of roughly €866 million and at least eight acquisitions in 2025. The same
    pool also shows that core scale metrics remain management-asserted and slightly
    inconsistent across company-controlled surfaces, while valuation, investor, and
    debt details remain unsupported in the assigned evidence set.
sections:
- id: identity-and-scale
  title: Identity and disclosed scale
  body: 'The retained official sources consistently describe team.blue as a pan-European
    digital partner for small and medium businesses that bundles core infrastructure
    with a wider software layer for e-commerce, compliance, payments, and other SMB
    workflows. The strongest supported scale disclosures cluster around FY2025: company
    materials point to a 3.3 million to 3.4 million SMB base, operations across 23
    countries, and FY2025 ARR of about €866 million with 11% organic growth. That
    is large enough to establish team.blue as a scaled regional platform rather than
    a single-brand host, but the retained pool does not independently reconcile which
    customer, country, or headcount figure should be treated as the current canonical
    number.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO006
  - CO007
  - CO016
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Leadership visibility, founder continuity, and governance gaps
  body: Leadership visibility is adequate at the executive layer but thin at the governance
    layer. The Year in Review materials name Claudio Corbetta as Group CEO, Jonas
    Dhaenens as Founder and President, Dawn Marriott as Executive Chair, and Jonathan
    Thackray as CFO, while also emphasizing a founder-operator model in which more
    than 90% of acquired founders stay beyond earn-out and more than 30 founders still
    hold operating roles. That is useful evidence that acquisitions are integrated
    with founder continuity, but it also means the external narrative depends heavily
    on a small set of visible leaders. The assigned pool does not disclose a full
    board roster, investor rights, or debt governance, so governance diligence remains
    incomplete.
  claimRefs:
  - CO008
  - CO009
  - CO016
  tableRefs:
  - TO002
  - TO003
- id: milestones-and-operating-momentum
  title: Formation, 2025 milestones, and operating momentum
  body: The strongest chronology in the assigned pool starts with team.blue's claimed
    2019 formation through the merger of Combell, TransIP, and Register Group, then
    accelerates through 2025. FY2025 disclosures say ARR crossed €850 million, more
    than 600,000 customers were added, and AI-enabled products accounted for roughly
    half of new-customer ARR while growing around twice as fast as non-AI products.
    The company also used November 2025 to publish a Europe-wide Digital Maturity
    Report and used September 2025 to announce the Shoptet acquisition as its eighth
    deal of the year, reinforcing a growth story built on M&A plus product-layer expansion
    rather than on one-off milestones.
  claimRefs:
  - CO006
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  figureRefs:
  - FO001
- id: evidence-limits-and-diligence-priorities
  title: Evidence limits and diligence priorities
  body: 'Two diligence cautions stand out. First, important cover metrics remain unsupported
    or management-asserted: the assigned pool does not substantiate valuation, total
    capital raised, investor ownership, or debt quantum, and even basic scale metrics
    drift across official surfaces. Second, adverse evidence is present but narrow.
    Independent review sites for one.com, one of the operating brands inside the group,
    show sharply mixed outside sentiment rather than a clean reputation signal: a
    strongly negative customer-review page sits beside a favorable expert review.
    Before leaning on the refresh as a refreshed source of truth, management should
    provide one canonical KPI pack, a current cap table and debt schedule, and a fuller
    board/governance disclosure.'
  claimRefs:
  - CO015
  - CO016
