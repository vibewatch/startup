  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosed traction
        blocks:
          - type: paragraph
            body: >-
              team.blue's clearest public financial datapoint is scale, not profitability. The group says FY2025 ARR
              reached €866 million with 11% organic revenue growth, while the 2025 review and syndicated release both
              show the platform is still anchored in recurring infrastructure rather than pure application software.
              Internet Infrastructure serves around 2.7 million customers and contributes 73% of FY2025 revenue, while
              SaaS Solutions serves roughly 600,000 customers and contributes the remaining 27% across websites,
              compliance, e-commerce, engagement, and transactions. That mix supports a relatively durable recurring
              base, but it also means the underwriting case depends on renewal quality, support intensity, and attach
              rates that the company does not publish publicly.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
