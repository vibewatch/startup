      - number: '4.2'
        title: Pricing, upsell, and GTM visibility
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests monetization is widening through attach and bundling rather than through a clean
              standalone AI SKU. Management says AI-enabled products generated roughly half of new customer ARR by
              December 2025, and recent product releases show AI features being embedded into existing workflows:
              Flexmail includes AI translation and copywriting on every plan with usage governed by credit allowances,
              while Macaly now supports one-off sales and recurring subscriptions through Stripe integration. team.blue
              also has a meaningful first-party distribution asset: its digital-maturity study aggregates feedback from
              more than 8,200 businesses across 32 countries, and its data-sovereignty study says 32.1% of surveyed SMEs
              already store data with team.blue. Those signals imply strong top-of-funnel reach and cross-sell
              potential, but they are still proxies; no public source in the retained set discloses CAC, payback,
              realized ARPU, or partner-channel economics.
            claimRefs:
              - CI004
              - CI008
              - CI009
              - CI010
              - CI011
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI004
              - CI011
              - CI012
      - number: '4.3'
        title: Cost structure, service-delivery burden, and capital opacity
        blocks:
          - type: paragraph
            body: >-
              The operating model appears more capital- and service-intensive than a lightweight SaaS multiple might
              imply. team.blue's own materials describe local-language support, owned European infrastructure, GPU
              capacity offered from its own data centres, and continued inorganic expansion, including Shoptet as the
              eighth acquisition completed in 2025 with revenue already above €30 million. Those ingredients can support
              durable distribution and deeper wallet share, but they also imply integration cost, support headcount,
              infrastructure spend, and potentially acquisition-related financing needs. The problem is that none of the
              reviewed public materials disclose the balancing numbers: there is no public cash position, debt stack,
              covenant headroom, runway, capex, CAC, payback, or segment gross margin in the retained evidence. Customer
              reviews on one.com also show a downside case where monetization depends on forced upgrades and support
              friction rather than clean product-led expansion.
            claimRefs:
              - CI006
              - CI007
              - CI012
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, the revenue story is directionally credible: there is disclosed recurring scale, a large
              installed customer base, a visible infrastructure core, and early evidence that AI features are improving
              new-ARR mix. But the data that matters for underwriting a late-stage, acquisition-heavy platform is still
              missing. Without audited revenue-to-cash conversion, leverage, interest burden, covenant headroom, renewal
              quality, or realized pricing by brand, it is impossible to judge whether team.blue is compounding from
              healthy subscription economics or masking margin pressure through M&A and pricing actions. The chapter
              therefore lands at a cautious positive on revenue quality, but a clear diligence stop on capital adequacy
              and unit economics until lender or board materials are produced.
            claimRefs:
              - CI001
              - CI004
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: AI looks like an attach-and-bundle motion, not a separately disclosed segment
            body: >-
              The strongest public monetization signal is not standalone AI revenue; it is that AI-enabled products now
              drive roughly half of new customer ARR while features such as Flexmail AI ship inside existing plans with
              credit-based usage limits.
            calloutType: insight
            claimRefs:
              - CI004
              - CI011
          - type: callout
            title: Capital structure remains a hard diligence blocker
            body: >-
              The retained public sources disclose ARR and mix, but none disclose cash, debt, covenant headroom, or
              runway, so leverage risk and refinancing dependency cannot be underwritten from public evidence.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
          - type: callout
            title: Demand lender and cohort-economics materials before underwriting valuation
            body: >-
              A recurring infrastructure base and AI-led upsell story are not enough on their own; the next diligence
              step should be to reconcile leverage, retention, realized pricing, and acquisition integration economics
              to reported ARR.
            calloutType: recommendation
            claimRefs:
              - CI001
              - CI004
              - CI006
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope now spans the full SMB digital workflow
        blocks:
          - type: paragraph
            body: >
              Public 2025-2026 materials consistently describe team.blue as more than a reseller of domains and shared
              hosting. The company says its products cover the full SMB journey from getting online, to winning
              customers, to staying compliant, to getting paid, and the named modules support that framing:
              infrastructure products anchor websites and email, Shoptet extends commerce into payments, logistics, and
              advertising, and newer AI surfaces add faster content and site creation for smaller businesses. This
              breadth matters because it turns product expansion into a cross-sell thesis, not just a catalog story. The
              product map is already broad enough to support multiple entry points by customer type, but public evidence
              remains much stronger on module availability than on attach rates or module-level retention.
            claimRefs:
              - CE001
              - CE005
              - CE008
              - CE009
              - CE016
          - type: table
