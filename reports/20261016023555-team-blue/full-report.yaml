        title: Exhibits
        blocks:
          - type: callout
            title: Distribution breadth is already large enough to matter
            body: >-
              Even without an independent TAM, team.blue already shows enough customer and revenue density to frame the
              market as a scaled pan-European SMB platform rather than a niche hosting consolidator.
