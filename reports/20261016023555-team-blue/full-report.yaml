      - number: '1.3'
        title: Formation, 2025 milestones, and operating momentum
        blocks:
          - type: paragraph
            body: >-
              The strongest chronology in the assigned pool starts with team.blue's claimed 2019 formation through the
              merger of Combell, TransIP, and Register Group, then accelerates through 2025. FY2025 disclosures say ARR
              crossed €850 million, more than 600,000 customers were added, and AI-enabled products accounted for
              roughly half of new-customer ARR while growing around twice as fast as non-AI products. The company also
              used November 2025 to publish a Europe-wide Digital Maturity Report and used September 2025 to announce
              the Shoptet acquisition as its eighth deal of the year, reinforcing a growth story built on M&A plus
              product-layer expansion rather than on one-off milestones.
            claimRefs:
              - CO006
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
