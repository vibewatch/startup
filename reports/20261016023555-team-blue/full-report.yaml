      - number: '2.3'
        title: Buyer, user, payer, and workflow segmentation
        blocks:
          - type: paragraph
            body: >-
              The company is effectively selling into several recurring SMB workflows instead of one monolithic budget
              line. Infrastructure products solve the first online-presence decision for founders and agencies; SaaS
              layers then monetize later-stage needs in websites, privacy/compliance, online stores, customer
              engagement, payments, and bookings. The buyer, user, and payer often collapse into the same person for
              micro-SMBs, but split into marketing, operations, IT, and compliance roles as the business grows. That
              segmentation explains why team.blue's cross-sell logic matters more than a narrow hosting-share argument:
              if infrastructure remains the land-and-expand wedge, then merchant workflows and operational SaaS are the
              clearest path to higher ARPU and stickier retention. Shoptet is relevant because it deepens exactly that
              merchant workflow layer rather than merely adding more low-value domain volume.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM010
              - CM014
              - CM015
      - number: '2.4'
        title: Adoption drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The demand case rests on three linked drivers: a large digital-adoption gap among European SMBs,
              accelerating AI experimentation that raises the value of simplified software bundles, and a
              sovereignty/regulatory backdrop that appears to increase receptivity to European providers. The same
              evidence also shows why conversion can still be slower than the headline market opportunity suggests.
              Surveyed SMBs report confusion over which tools to buy, weak digital confidence, time and resource
              constraints, and lingering mistrust of AI on data security, accuracy, and brand-control grounds. Those
              frictions imply that budget authority alone does not guarantee adoption; product simplicity, local
              support, and trust are central to win-rate. The chapter's main diligence gap is that none of the retained
              sources independently quantify the bundled European SMB digital-enablement market that management is
              implicitly targeting, so the cleanest next-step ask is management's internal market model tied to
              product-cluster cohorts and current footprint definitions.
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
