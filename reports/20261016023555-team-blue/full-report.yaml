chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              The retained official sources consistently describe team.blue as a pan-European digital partner for small
              and medium businesses that bundles core infrastructure with a wider software layer for e-commerce,
              compliance, payments, and other SMB workflows. The strongest supported scale disclosures cluster around
              FY2025: company materials point to a 3.3 million to 3.4 million SMB base, operations across 23 countries,
              and FY2025 ARR of about €866 million with 11% organic growth. That is large enough to establish team.blue
              as a scaled regional platform rather than a single-brand host, but the retained pool does not
              independently reconcile which customer, country, or headcount figure should be treated as the current
              canonical number.
