              - CU007
              - CU009
              - CU010
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: Named production proof exists, but it is still sparse and mostly company-authored.
        blocks:
          - type: paragraph
            body: >-
              team.blue does have more than logo-only customer proof in the assigned pool. The Year in Review cites
              named users such as Pipa, Permanent Makeup Budapest, and Benerail, and it ties those references to
              concrete products or outcomes. That is better than a pure logo wall, but the public sample remains narrow
              and largely self-authored, with limited disclosure of contract value, timing, renewal history, or
              deployment depth. The adverse side is also brand-specific rather than portfolio-wide: One.com review
              surfaces show meaningful customer friction on pricing and cancellation, but they do not quantify how
              material that issue is to group revenue or retention.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU011
              - CU012
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: The main underwriting question is durability, not whether customers exist.
        blocks:
          - type: paragraph
            body: >-
              The public chapter evidence is enough to accept that team.blue has real scale, real channel density, and
              at least some production deployments. It is not enough to underwrite customer quality with precision. None
              of the reviewed public sources provide group-level GRR, NRR, churn, renewal-rate, contract-length,
              top-customer share, or reseller revenue-mix disclosure. That means the investment question shifts from
              "does team.blue have customers?" to "how sticky, concentrated, and monetizable is the installed base by
              cohort and brand?" Until that disclosure is obtained, expansion upside is credible, but durability remains
              only partially evidenced.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU009
              - CU010
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The agency channel is both demand base and acquisition engine.
            body: >-
              team.blue's agency and reseller cohort is not just a set of paying customers; the group describes it as a
              distribution layer too. That can make channel economics very attractive, but it also means concentration
              and renewal quality matter more than the headline partner count alone.
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
          - type: callout
            title: Public durability metrics are still missing.
            body: >-
              The assigned evidence supports scale and some named production usage, but it does not disclose group GRR,
              NRR, churn, renewal rates, top-account exposure, or reseller revenue mix. That gap is large enough that
              customer quality cannot be underwritten from public materials alone.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Leverage opacity and compliance execution still define the top residual risk
        blocks:
          - type: paragraph
            body: >
              The clearest thesis-breaker is still financing opacity rather than demand collapse. The only independent
              adverse item in the assigned pool is the withdrawn leveraged-loan transaction, which described an
              attempted extension of a €1.353 billion euro term loan and repricing of a $771 million dollar term loan
              before the borrower pulled the process. That does not prove distress on its own, and the same report said
              the issuer and issue ratings were B/B3 with stable outlooks, but it does show that team.blue remains a
              leveraged story whose refinancing path is visible only at the point of market testing. Against that,
              management materials show FY2025 ARR above €850 million, profitable growth, and a broad installed base.
              The problem for underwriting is that public evidence still stops short of covenant headroom, maturity
              ladder, or debt-service coverage. The same pattern appears on regulation and compliance: team.blue has
              real assets in privacy, accessibility, and European hosting, but the assigned pool still lacks a
              consolidated external record showing how group-wide controls, incident reporting, and multi-country
              accountability actually operate.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR009
              - CR010
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR015
      - number: '7.2'
        title: The platform model compounds integration, customer-experience, and vendor-dependency risk
        blocks:
          - type: paragraph
            body: >
              team.blue's operating model creates both resilience and execution risk. The positive side is scale:
              millions of customers, thousands of employees, and a portfolio that can cross-sell infrastructure and
              SaaS. The risk side is that the platform is still absorbing acquisitions, pushing more AI-enabled features
              into customer workflows, and relying on partner ecosystems that can change abruptly. Shoptet was already
              the group's eighth acquisition completed in 2025, and management explicitly describes acquisitions plus AI
              investment as the growth engine. That pace can work if value-creation programs and founder retention
              remain strong, but it also raises the cost of any weak integration, uneven control environment, or product
              outage across 60-plus brands. Customer reviews on One.com add an adverse real-world signal: pricing
              changes, cancellation friction, and service failures can surface at the brand edge well before group-level
              churn or complaint metrics become visible. Partner dependence is similar. Broadcom's VMware reset cut the
              partner network and changed licensing economics; team.blue says Pinnacle status preserves continuity, but
              it still leaves part of the infrastructure proposition exposed to vendor roadmap and pricing decisions
              outside its control.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR012
      - number: '7.3'
        title: Kill criteria are monitorable, but the public package is still incomplete
        blocks:
          - type: paragraph
            body: >
              The most important next diligence step is not another growth datapoint; it is evidence that the balance
              sheet, compliance regime, and multi-brand operating controls are robust enough to support the current pace
              of expansion. A scaled peer such as IONOS shows that a European hosting and cloud player can compound
              revenue while targeting strong margins, which means team.blue cannot rely on market scarcity alone to
              defend pricing or valuation. The investment case gets meaningfully worse if management cannot provide a
              full debt schedule and covenant pack, if brand-level complaints start to appear across more than isolated
              properties such as One.com, or if the company cannot produce a group-wide incident and regulatory log that
              matches its sovereignty and compliance positioning. Conversely, conviction improves if the company can
              show that AI-led growth is not coming at the expense of product reliability, control maturity, or customer
              retention.
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR013
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Leverage opacity is still the fastest route to a broken thesis
            body: >-
              The disclosed growth profile is helpful, but it does not offset the absence of public covenant, maturity,
              or coverage data after a withdrawn repricing attempt. Until the debt package is visible, the downside
              remains hard to underwrite with precision.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR015
          - type: callout
            title: AI is both a growth lever and an execution-risk amplifier
            body: >-
              team.blue's own materials tie roughly half of new-customer ARR to AI-enabled products, while its customer
              research shows trust, data-security, and know-how barriers are still real. That means product reliability
              and safe deployment matter more than the headline launch cadence.
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
              - CR014
          - type: callout
            title: Minimum diligence package before underwriting
            body: >-
              Require the current debt schedule and covenant model, a group-wide incident and regulator log, and
              brand-level churn or complaint dashboards segmented by major properties and reseller channels. Without
              those items, residual risk stays above what the public growth narrative can neutralize.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR011
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track, with medium-low confidence, high underwriting risk, and an insufficiently
              supported valuation stance at the last disclosed €4.8 billion company value. The positive case is real
              scale: team.blue reports €866 million of FY2025 ARR, 11% organic revenue growth, and a 42% EBITDA metric.
              The limiting issue is not company quality but price discovery. Those operating measures are
              company-issued, the Year in Review cautions that internal KPIs may not be defined under accounting
              standards, and the Yahoo-hosted item is explicitly labelled a paid press release rather than independent
              corroboration. An invest-now decision therefore requires audited revenue and EBITDA bridges, net debt and
              covenant data, preference terms, and a current cap table. No target return, hold period, or exit value can
              be responsibly stated before those inputs are obtained.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV014
      - number: '8.2'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              The most recent explicit valuation retained for this chapter is the July 2024 transaction in which CPP
              Investments acquired about 20% and team.blue was valued at €4.8 billion; Hg remained the largest investor
              and invested additional funds. Dividing that company-value mark by the later €866 million FY2025 ARR
              produces a directional ratio of roughly 5.5x. It is not a transaction-date multiple and must not be
              presented as EV/ARR because the dates differ and the source does not identify the €4.8 billion figure as
              enterprise value. The retained evidence also does not quantify net debt, liquidation preferences,
              dilution, or covenant headroom. Entry discipline should therefore focus on a fully diluted, preference-
              adjusted equity bridge and downside debt capacity rather than negotiating from the headline mark alone.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV008
      - number: '8.3'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is a scaled recurring-revenue platform with reported organic growth, a 73% infrastructure and
              27% SaaS revenue mix, and an acquisition engine that team.blue says has added about €300 million of
              acquired revenue since 2020. AI-enabled products are also reported to grow ARR about twice as fast as
              non-AI products and to represent roughly half of new-customer ARR by December 2025. The anti-thesis is
              evidence concentration and execution complexity: headline KPIs come from the company or its syndicated
              releases, Shoptet was already the eighth acquisition announced in 2025, and the retained independent
              market-data source supplies a hosting-share methodology but no team.blue-specific value in its fetched
              text. The result is a credible strategic narrative without enough independent financial evidence to
              validate the headline price.
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The bull case requires independent confirmation that reported ARR quality, organic growth, EBITDA, and
              cash conversion survive audit and that cross-sell and AI growth add value without acquisition-driven
              leverage overwhelming returns. The base case keeps the company on a watchlist at, but not above, the last
              public mark until debt, preferences, cohort retention, and integration economics are disclosed. The bear
              case is triggered by material KPI normalization, weak retention, leverage pressure, or evidence that
              serial acquisitions mask organic performance; it implies a material discount whose size cannot be
              calculated from public evidence. Scale may create IPO or sponsor-secondary optionality, but the retained
              sources do not establish an exit route or timetable. Final diligence should obtain audited statements, ARR
              and revenue reconciliations, debt documents, the preference waterfall, acquisition cohorts, retention by
              segment, and board- approved exit planning.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV009
              - CV012
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track pending a verified equity bridge
            body: >-
              Reported scale and growth justify continued diligence, but a price-sensitive investment decision requires
              audited KPI reconciliation, net debt, preference terms, and independent comparable evidence.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
