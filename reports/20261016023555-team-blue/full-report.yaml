  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Leveraged debt market access
        - Syndicated lenders / term-loan investors
        - Refinancing and repricing capacity
        - High at holding-company level
        - Future refinancing clears only at meaningfully worse pricing or tighter terms
        - High
        - Scale, profitable growth, and stable ratings provide some negotiating support
        - Public sources still do not disclose covenant headroom or debt-service coverage
      - - Infrastructure licensing partner
        - Broadcom / VMware
        - Cloud and managed-hosting authorization plus pricing framework
        - Medium
        - Licensing changes raise costs or narrow what local brands can offer customers
        - Medium-High
        - Pinnacle Partner status and migration support preserve official program access
        - Vendor roadmap and economics remain external dependencies
      - - Distribution and founder-operator model
        - Agency/reseller partners and acquired founders
        - Customer acquisition, retention, and local execution
        - Medium-High
        - Partner attrition or weaker founder retention reduces the local-brand flywheel
        - Medium
        - 30,000 agency/reseller partners and disclosed founder-retention discipline diversify the channel base
        - No public concentration, renewal, or post-earn-out retention dashboard is available
    notes: >-
      Concentration is qualitative because the assigned pool does not disclose channel mix, lender exposure by tranche,
      or revenue share by partner ecosystem.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR006
      - CR012
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Evidence
      - Judgment
      - Decision implication
    rows:
      - - Recommendation
        - €866m FY2025 ARR and 11% reported organic revenue growth, but no current price bridge
        - Track
        - Do not invest from public evidence alone
      - - Confidence
        - Core valuation and operating metrics are company-issued or transaction-adviser reported
        - Medium-low
        - Require primary diligence before underwriting returns
      - - Risk rating
        - Debt, preference, normalization, retention, and exit inputs are missing
        - High
        - Treat missing downside mechanics as material, not zero
      - - Valuation stance
        - €4.8bn July 2024 company value versus €866m FY2025 ARR is a mixed-vintage ~5.5x ratio
        - Insufficiently supported
        - Do not label the ratio EV/ARR or a current trading multiple
      - - Price movement condition
        - Audited KPI bridges, net debt, preferences, and current cap table
        - Research more
        - Set a range only after the fully diluted equity bridge is verified
    notes: >-
      Judgments use company-issued FY2025 KPIs and a 2024 transaction mark; the mixed-vintage ratio is directional and
      is not an enterprise-value multiple.
