  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Case
      - Core assumptions
      - Valuation and return logic
      - Probability signal
      - Downside or thesis-break trigger
      - Decision
    rows:
      - - Bull
        - Reported growth and margins survive audit; AI and cross-sell improve retention; leverage is moderate
        - >-
          At or above €4.8bn may be defensible only after a verified debt and preference bridge; no public range is
          supportable
        - Strengthens with audited segment KPIs and independent cohort evidence
        - AI uplift fails to translate into retention, margin, or cash generation
        - Advance only after confirmatory diligence
      - - Base
        - ARR grows, but portfolio integration and KPI normalization absorb part of the upside
        - No increase over the last €4.8bn mark without current financial and cap-table evidence
        - Most consistent with the assigned evidence set
        - Debt service or acquisition integration constrains reinvestment
        - Track
      - - Bear
        - >-
          ARR quality weakens, reported EBITDA requires material normalization, or leverage and preferences impair
          common equity
        - Material discount to €4.8bn; amount cannot be calculated without net debt and waterfall data
        - Strengthens if retention, covenant, or integration evidence disappoints
        - Covenant pressure, down-round terms, or material KPI restatement
        - Pass unless price and structure absorb the verified downside
    notes: >-
      Scenarios deliberately avoid invented probability percentages and valuation ranges because net debt, preferences,
      normalized earnings, and exit timing are unavailable.
