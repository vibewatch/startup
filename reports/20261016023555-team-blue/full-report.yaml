      - number: '5.2'
        title: The architecture thesis is a layered platform with early orchestration, not a unified stack yet
        blocks:
          - type: paragraph
            body: >
              The most important product fact is the three-layer architecture the company now repeats across its Year in
              Review and syndicated July 2026 release. The core layer is infrastructure, the middle layer is a
              five-cluster SaaS portfolio, and blue.hub is presented as the orchestration layer that should connect
              them. That architecture is credible at the concept level because the company discloses live foundations
              such as a unified footer across most brands, an opted-in customer view, and recommendation pilots, while
              also being explicit that identity, billing, provisioning, and broader support unification are still ahead.
              In practice, this means the technical story is part verified deployment and part roadmap. The structure is
              specific enough to underwrite a platform direction, but not yet specific enough to treat cross-brand
              control-plane unification as complete.
            claimRefs:
              - CE002
