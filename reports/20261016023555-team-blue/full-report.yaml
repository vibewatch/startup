      - number: '1.2'
        title: Leadership visibility, founder continuity, and governance gaps
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is adequate at the executive layer but thin at the governance layer. The Year in
              Review materials name Claudio Corbetta as Group CEO, Jonas Dhaenens as Founder and President, Dawn
              Marriott as Executive Chair, and Jonathan Thackray as CFO, while also emphasizing a founder-operator model
              in which more than 90% of acquired founders stay beyond earn-out and more than 30 founders still hold
              operating roles. That is useful evidence that acquisitions are integrated with founder continuity, but it
              also means the external narrative depends heavily on a small set of visible leaders. The assigned pool
              does not disclose a full board roster, investor rights, or debt governance, so governance diligence
              remains incomplete.
