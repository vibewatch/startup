      - number: '3.2'
        title: Distribution scale and partner access are the moat, but also a dependency
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence-backed differentiator is distribution. team.blue says it serves 3.3 million SMBs
              through local brands across 23 countries, and its year-in-review explicitly describes those brands as
              dozens of independent entry points where customers first meet the company. That installed base matters
              because infrastructure still anchors the commercial model, while SaaS layers are used to deepen
              relationships and expand ARPU over time. The Shoptet acquisition shows how the group adds scaled
              application categories rather than only more hosting brands, and the VMware Pinnacle Partner announcement
              shows another route to distribution: helping customers and resellers navigate Broadcom’s licensing reset.
              The same source also highlights the structural dependence embedded in that advantage, because
              infrastructure continuity and partner relevance are partly conditioned by ecosystem rules controlled by
              Broadcom/VMware rather than by team.blue alone.
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP008
              - CP009
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP016
      - number: '3.3'
        title: Pricing trust and service experience look like the first displacement fault line
        blocks:
          - type: paragraph
            body: >-
              The weakest part of the competitive evidence is pricing transparency, and the clearest external risk
              signal comes from customer experience at One.com, one of team.blue’s brands. HostAdvice’s hands-on review
              describes the product as beginner-friendly, performant, and inexpensive at entry level, but
              SmartCustomer’s review rollup is sharply negative and centers on automatic upgrades, new charges, and
              difficult cancellation. That mixed picture matters because low-friction onboarding and low headline prices
              are important substitutes to internal build, agencies, or rival hosts; if renewal step-ups or add-on
              friction are hard to predict, they create an opening for competitors even when the initial product is
              strong. More broadly, the public sources reviewed here do not provide enough public list-pricing coverage
              across team.blue’s portfolio to support a rigorous apples-to-apples comparison versus rival point
              solutions, so pricing durability remains a material diligence gap rather than a resolved moat.
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is visible; price discipline is not
            body: >-
              The evidence reviewed here is strong enough to show that team.blue is widening its competitive surface
              through acquisitions, AI product bundling, and cross-brand distribution. It is not strong enough to show
              whether that breadth translates into consistently defendable pricing, low churn, or superior win rates
              against point solutions, because public tariff detail and independent customer economics remain sparse.
            calloutType: risk
            claimRefs:
