    rows:
      - - Thesis
        - Scaled recurring-revenue base
        - Company reports €866m FY2025 ARR
        - Independent ARR-to-revenue and retention reconciliation
      - - Thesis
        - Organic growth at scale
        - Company reports 11% FY2025 organic revenue growth
        - Audited organic-growth bridge excluding acquisitions and FX
      - - Thesis
