      - number: '5.3'
        title: Deployment maturity is clearest at the brand layer, with trust controls visible but unevenly evidenced
        blocks:
          - type: paragraph
            body: >
              Deployment proof is strongest when team.blue cites specific brand products rather than abstract platform
              claims. The July 2026 AI release names live capabilities across Webnode, Macaly, Metricool, and Flexmail;
              the VMware announcement describes continuity and migration support for enterprise infrastructure
              customers; and third-party testing of One.com gives a brand-level view into performance, onboarding, and
              account-linked security controls. Together these sources support a view that team.blue can ship useful
              product increments across brands and does have concrete trust surfaces such as European-hosted AI
              infrastructure, named certifications, and documented account recovery flows. The limitation is scope: most
              neutral evidence is still brand-specific, so investors should not assume One.com or a VMware-focused
              infrastructure brand fully represents the operating quality of the entire portfolio.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE008
              - CE009
              - CE013
              - CE014
      - number: '5.4'
        title: The main product risk is integration and control-plane proof, not feature scarcity
        blocks:
          - type: paragraph
            body: >
              Feature scarcity is not the current issue; proof quality is. team.blue's product breadth, AI rollout
              cadence, and European infrastructure story are well populated with company-issued evidence, but the public
              record is far thinner on shared architecture telemetry, incident history, and what percentage of customers
              actually use the blue.hub control plane across brands. External feedback on One.com also shows why this
              matters: third-party reviews can be strongly positive on usability and speed while customer-review
              aggregation remains sharply negative on pricing changes, transfer friction, and occasional service-impact
              complaints. That mix implies the diligence priority is not to confirm whether products exist, but to
              verify whether cross-brand operating quality, migration complexity, and trust controls are as scalable as
              the product narrative implies.
            claimRefs:
              - CE006
              - CE007
              - CE012
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is credible and customer-workflow oriented
            body: >-
              The product story is not just branding: public materials name infrastructure, five SaaS clusters, commerce
              assets, and live AI features that collectively cover real SMB jobs from launch through payments and
              operations.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE008
              - CE009
          - type: callout
            title: blue.hub is promising but still transitional
            body: >-
              The strongest architecture evidence shows blue.hub foundations already live, yet the most valuable
              control-plane features - identity, billing, provisioning, and consolidated support - are still described
              as the path ahead rather than fully evidenced deployments.
            calloutType: insight
            claimRefs:
              - CE006
              - CE007
          - type: callout
            title: Neutral proof lags the product narrative
            body: >-
              External evidence supports specific brand experiences, but it does not yet validate group-wide
              reliability, migration complexity, or operating consistency across the full multi-brand portfolio.
            calloutType: risk
            claimRefs:
              - CE012
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer footprint is broad, but segment economics remain opaque.
        blocks:
          - type: paragraph
            body: >-
              team.blue's current public customer story is scale first. Its FY2025 materials and July 2026 syndicated
              release both say the group serves 3.3 million SMB customers, while the same body of evidence also cites
              approximately 30,000 agency and reseller partners. That points to a blended customer model in which direct
              SMB demand and channel-led distribution coexist. The footprint also appears to be expanding over time:
              Sofina's 2024 portfolio page described a 60+ brand network in 22 countries, while team.blue's newer FY2025
              materials cite 23 countries and identify the Netherlands, Italy, Sweden, Denmark, and Czechia as the
              largest customer bases. What is still missing is the economic cut of that footprint by segment, geography,
              or brand.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU009
              - CU013
      - number: '6.2'
        title: Expansion logic relies on cross-sell infrastructure and visible buyer pain.
        blocks:
          - type: paragraph
            body: >-
              The growth case is not just logo acquisition. team.blue's current product messaging ties customer
              acquisition and expansion to a staged workflow: launch products help entrepreneurs get online, growth
              tools help them reach customers, and blue.hub is meant to connect brands, identity, billing, and
              recommendations so that existing customers buy more from the network over time. External demand signals in
              the assigned evidence support the narrative that buyer pain is real. team.blue-sponsored 2025-2026 survey
              releases describe confusion over digital-tool choice, concern over data sovereignty, and switching intent
              around hosting location, which all create plausible entry points for compliant hosting, SaaS, and
              cross-sell motions.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
