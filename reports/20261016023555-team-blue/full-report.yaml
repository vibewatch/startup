  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Platform breadth is the main competitive move
        blocks:
          - type: paragraph
            body: >-
              Public evidence reviewed here supports a broad reading of the landscape: team.blue is expanding beyond
              commodity hosting into a portfolio that spans infrastructure, websites, compliance, e-commerce,
              engagement, transactions, and an orchestration layer intended to tie those services together. Its own
              2024-25 impact report describes more than 60 brands and a full suite of SMB digital products, while the
              2025 year-in-review frames the model as three reinforcing layers rather than a single category product.
              Independent commentary from WebHosting Today reinforces that interpretation by describing at least 14 SaaS
              acquisitions since mid-2024 and comparing the strategy with GoDaddy’s broader U.S. SMB stack and Wix’s
              expansion from site building into commerce, bookings, and marketing. The real competitive set therefore
              includes direct hosting peers, broad SMB-platform incumbents, adjacent point solutions, agency or internal
              build, and pure hosts that could enter more software categories.
            claimRefs:
