  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The retained chronology shows a 2019 merger origin and a 2025 step-up in revenue, customer acquisition, AI
      monetization, and M&A activity.
    data:
      items:
        - date: '2019'
          label: Group formed through merger
          detail: The July 2026 PR says team.blue was founded through the merger of Combell, TransIP, and Register Group.
          tone: neutral
          claimRefs:
            - CO010
        - period: FY2025
          label: ARR crosses the €850m mark
          detail: >-
            FY2025 disclosures say ARR crossed €850M+ and was specified externally at €866 million with 11% organic
            growth.
          tone: positive
          claimRefs:
            - CO006
        - period: FY2025
          label: Revenue mix remains infrastructure-led
          detail: FY2025 disclosures say internet infrastructure represented 73% of revenue while SaaS represented 27%.
          tone: neutral
          claimRefs:
            - CO007
        - period: FY2025
          label: Customer acquisition remains strong
          detail: FY2025 disclosures say team.blue added more than 600,000 customers during the year.
          tone: positive
          claimRefs:
            - CO013
        - period: Dec 2025
          label: AI becomes a material sales driver
          detail: >-
            By December 2025, AI-enabled products reportedly accounted for about half of new-customer ARR and grew
            roughly twice as fast as non-AI products.
          tone: positive
          claimRefs:
            - CO014
        - date: '2025-09-08'
          label: Shoptet acquisition announced
          detail: The Shoptet deal was described as team.blue's eighth acquisition completed in 2025.
          tone: positive
          claimRefs:
            - CO012
        - date: '2025-11-26'
          label: Digital Maturity Report released
