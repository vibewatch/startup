      - number: '1.4'
        title: Evidence limits and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Two diligence cautions stand out. First, important cover metrics remain unsupported or
              management-asserted: the assigned pool does not substantiate valuation, total capital raised, investor
              ownership, or debt quantum, and even basic scale metrics drift across official surfaces. Second, adverse
              evidence is present but narrow. Independent review sites for one.com, one of the operating brands inside
              the group, show sharply mixed outside sentiment rather than a clean reputation signal: a strongly negative
              customer-review page sits beside a favorable expert review. Before leaning on the refresh as a refreshed
              source of truth, management should provide one canonical KPI pack, a current cap table and debt schedule,
              and a fuller board/governance disclosure.
            claimRefs:
              - CO015
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category logic
        blocks:
          - type: paragraph
            body: >-
              team.blue's current disclosures define the market as an integrated SMB digital-enablement stack rather
              than a pure hosting or domain-registration category. The company now describes a three-layer model:
              internet infrastructure as the renewal-heavy base, a broader SaaS portfolio on top, and blue.hub as an
              orchestration layer that connects identity, billing, and AI recommendations. That framing matters because
              independent taxonomies in the source pack still split web hosting and domain-registration dynamics into
              distinct underlying categories, while team.blue's go-to-market bundles them with adjacent software
              workflows such as compliance, e-commerce, engagement, and transactions. The practical status quo
              substitute for many SMBs is therefore not one direct competitor but a fragmented stack of local hosts,
              registrars, point SaaS tools, agencies, and manual workflows, which is why market boundary discipline
              matters before discussing size.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing and monetized footprint
        blocks:
          - type: paragraph
            body: >-
              The source pack is stronger on observed footprint than on external denominator. On the observed side,
              company materials support a large monetized base: roughly 3.3 million customers, FY2025 reported revenue
              of €866M, ARR above €850M, and a mix that remains infrastructure-led but with a meaningful SaaS layer
              already at 27% of revenue. On the demand side, team.blue's own FY2025 review argues that 65% of European
              SMBs still lack basic digital solutions, which implies substantial adoption headroom if the figure is
              directionally right. What is missing is an independent, pan-European market model that reconciles domains,
              hosting, compliance, commerce, and SMB operating software into a single TAM/SAM/SOM stack. For valuation,
              that means the defensible near-term lens is platform monetization depth inside an already-large installed
              base, not a generic “huge market” claim.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
