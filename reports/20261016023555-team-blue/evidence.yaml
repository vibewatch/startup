evidenceGaps:
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Current valuation, total capital raised, investor ownership, lender list, debt quantum, maturities, and covenant
      headroom.
    whyItMatters: >-
      These inputs are required to judge leverage, ownership control, and whether the disclosed ARR scale supports the
      current private valuation.
    diligencePath: Request the latest cap table, investor presentation, debt schedule, and audited FY2025 financial package.
    relatedQuestionRefs:
      - QO004
  - type: enumeration-incomplete
    severity: material
    topic: governance-coverage
    missingEvidence: >-
      Complete board roster, committee structure, investor-rights summary, and fuller list of operating executives by
      business line.
    whyItMatters: >-
      Leadership visibility exists, but governance concentration and decision rights cannot be assessed from the
      retained public evidence alone.
    diligencePath: Request governance deck, board observer list, and current executive-org chart.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale-reconciliation
    missingEvidence: >-
      A single management-approved KPI sheet that reconciles customer count, country footprint, and employee / expert
      count.
    whyItMatters: >-
      Conflicting scale disclosures weaken confidence in cover metrics and create downstream risk for valuation,
      market-share, and operating-leverage analysis.
    diligencePath: >-
      Request a dated KPI bridge that ties each published customer, country, and workforce number to one precise
      definition.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: independent-tam
    missingEvidence: >-
      An independent Europe-wide market-size model that bridges domains, hosting, compliance, commerce, and SMB
      operating SaaS into one bundled denominator.
    whyItMatters: >-
      Valuation upside currently rests on company footprint and demand signals rather than a third-party TAM or SAM
      benchmark.
    diligencePath: >-
      Request management's internal market model plus any third-party studies used in board or lender materials, then
      reconcile each layer to product-cluster revenue.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: disclosure-drift
    missingEvidence: >-
      A single current disclosure for customer count, brand count, expert count, and country footprint tied to one
      reporting date.
    whyItMatters: >-
      Footprint drift weakens penetration, productivity, and cross-sell assumptions that would otherwise anchor market
      sizing.
    diligencePath: >-
      Obtain the latest management or lender deck used in 2026 financing discussions and lock the operating footprint to
      one dated snapshot.
    relatedQuestionRefs:
      - QM002
  - type: private-evidence-only
    severity: material
    topic: product-sam
    missingEvidence: Product-line NRR, churn, ARPU, and booking mix by infrastructure versus each SaaS cluster.
    whyItMatters: These splits determine whether monetization upside comes from new-logo growth, pricing, or cross-sell depth.
    diligencePath: Ask for FY2025 cohort tables and 2026 YTD bookings by cluster, channel, and geography.
    relatedQuestionRefs:
      - QM003
      - QM005
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Comparable public list pricing, contract terms, and discounting policy across the main infrastructure, e-commerce,
      email, and AI layers.
    whyItMatters: >-
      Without consistent tariff evidence, it is not possible to judge whether bundle breadth translates into defendable
      price realization or just wider scope with hidden concessions.
    diligencePath: >-
      Request current price books, standard contracts, and renewal rules for One.com, Webnode, Flexmail, Shoptet
      Premium, and GPU-as-a-Service, then rerun the pricing table on like-for-like units.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Independent win/loss, attach-rate, and churn data showing whether infrastructure customers actually convert into
      higher-value SaaS relationships.
    whyItMatters: >-
      The moat case depends on cross-sell efficiency and retention improvement, but current evidence is mostly company
      narrative rather than externally verified customer economics.
    diligencePath: >-
      Request cohort retention, product attach, cross-sell conversion, and churn-by-brand data for the infrastructure
      base and acquired SaaS brands.
  - type: missing-source
    severity: minor
    topic: switching-costs
    missingEvidence: >-
      Independent evidence on multi-homing, migration effort, and customer switching costs between team.blue brands and
      rival hosts or point solutions.
    whyItMatters: >-
      Switching-cost visibility determines whether the bundle behaves like a durable moat or a convenience layer that
      customers can replace piecemeal.
    diligencePath: >-
      Collect customer case studies, migration data, cancellation cohorts, and reseller churn commentary across major
      brands.
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy-gap
    missingEvidence: >-
      Current cash balance, gross debt, net debt, covenant headroom, maturity schedule, and any project- or
      acquisition-finance obligations.
    whyItMatters: >-
      Without leverage and liquidity data, the company's ability to fund AI investment, M&A integration, and any
      refinancing needs cannot be underwritten.
    diligencePath: Request the latest lender deck, debt schedule, monthly cash bridge, and covenant-compliance certificate.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: CAC, payback, NRR, GRR, logo churn, revenue churn, and segment gross margin by infrastructure versus SaaS.
    whyItMatters: >-
      Recurring ARR scale is not enough to judge valuation quality without evidence of retention, cost-to-serve, and
      efficient customer acquisition.
    diligencePath: Request cohort dashboards, retention tables, gross-margin by segment, and channel-level CAC/payback files.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing-mechanics
    missingEvidence: >-
      Brand-level list prices, discounting rules, renewal uplift, add-on attach, and realized ARPU across major hosting
      and SaaS brands.
    whyItMatters: >-
      The public record shows monetization surfaces but not whether growth comes from healthy expansion, price
      increases, or forced upgrades.
    diligencePath: >-
      Collect current price books and renewal notices for top brands, then reconcile them to realized ARPU and complaint
      data.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: acquisitions
    missingEvidence: >-
      Acquired-versus-organic ARR bridge, synergy targets, integration cost, and earn-out obligations for 2025
      acquisitions.
    whyItMatters: >-
      M&A can inflate scale while masking margin dilution or financing dependence if acquired revenue and integration
      burden are not separated.
    diligencePath: >-
      Request a 2025 acquisition ledger with purchase price, revenue contribution, earn-outs, and post-close integration
      spend by deal.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: shared-control-plane-metrics
    missingEvidence: >-
      Brand-by-brand adoption, attach, MAU, and conversion-lift data for blue.hub identity, billing, recommendation, and
      support surfaces.
    whyItMatters: >-
      The product thesis depends on orchestration increasing value across brands, but public evidence only confirms
      early deployment elements rather than scaled customer usage.
    diligencePath: >-
      Request blue.hub rollout dashboards by brand, feature penetration over time, and cross-sell uplift before
      underwriting platform synergy.
    relatedQuestionRefs:
      - QE005
  - type: missing-source
    severity: material
