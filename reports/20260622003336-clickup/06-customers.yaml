- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / switching risk
  - Impact
  - Diligence path
  rows:
  - - Multi-app convergence inside existing accounts
    - Public proof is strong on app breadth but weak on which cohorts actually expand economically
    - Could support durable seat and module expansion if real; could also mask shallow experimentation
    - Request cohort expansion by app family, plan tier, and account size
  - - AI and automation attach
    - AI stories are visible, but governance pain and unclear credit economics may slow scaled rollout
    - Can raise deal size and stickiness if AI workflows become operationally embedded
    - Request AI attach rates by customer segment and actual renewal behavior for AI-enabled accounts
  - - Partner / consultant implementation channel
    - External services can accelerate deployment but may also indicate setup complexity for less mature customers
    - Could improve time-to-value and reduce churn in bigger accounts
    - Request channel mix, partner-sourced pipeline, and implementation success metrics
  - - Economic concentration opacity
    - No public top-customer, top-10, or channel concentration disclosure
    - Investors cannot tell whether the visible proof map is diversified or anchored by a few large flagship accounts
    - Request ARR concentration by top 1, top 5, top 10 customers and by partner-sourced revenue
  notes: This table focuses on the mechanisms that could drive expansion or conceal concentration risk; it is deliberately qualitative because ClickUp does not disclose the needed economics publicly.
