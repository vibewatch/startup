callouts:
- calloutType: strength
  title: ClickUp has unusually broad named proof for a workflow platform
  body: The public customer surface is not confined to software startups or PMOs. ClickUp shows active stories across telecom operations, fintech launches, education administration, agency delivery, media publishing, and restaurant or retail operations, which makes the adoption thesis more credible than a logo wall alone.
  claimRefs:
  - CU014
  - CU015
  - CU019
  - CU021
  - CU025
  - CU030
  - CU046
- calloutType: risk
  title: Independent reviews repeatedly point to complexity and governance friction
  body: The same flexibility that makes ClickUp attractive also creates adoption drag. Public reviewers keep returning to setup overwhelm, permissions confusion, lag, and workflow brittleness, which are exactly the issues that can slow enterprise standardization after the initial rollout.
  claimRefs:
  - CU033
  - CU036
  - CU038
- calloutType: assumption
  title: Public customer strength is stronger on workflow value than on durable economics
  body: The chapter assumes ClickUp's public growth and story volume reflect real customer traction, but it does not assume they prove renewal durability, NRR, or concentration quality because none of those metrics are disclosed in the fetched public sources.
  claimRefs:
  - CU010
  - CU011
  - CU042
  - CU048
