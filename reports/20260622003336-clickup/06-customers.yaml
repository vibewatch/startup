figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: ClickUp's public customer stories usually start with tool sprawl, move through team-level consolidation, then expand into automation, AI, or cross-functional visibility gains.
  data:
    items:
    - id: UJ1
      label: Work sprawl pain recognized
      detail: A team is juggling too many project, chat, docs, or spreadsheet tools and loses visibility.
      actor: Department lead
      sentiment: negative
    - id: UJ2
      label: Single-team rollout
      detail: A PMO, marketing, store-planning, or admin team starts using ClickUp as its system of record.
      actor: Team manager
      sentiment: neutral
    - id: UJ3
      label: Workflow consolidation
      detail: Tasks, docs, calendars, and approvals move into one workspace and replace prior point tools.
      actor: Core users
      sentiment: positive
    - id: UJ4
      label: Integration and notification layer
      detail: Slack, Google Workspace, or Zapier routes help customers connect ClickUp to existing workflows.
      actor: Ops / IT admin
      sentiment: positive
    - id: UJ5
      label: Automation or AI adoption
      detail: Automations, agents, and intake flows start handling triage, alerts, and repeat work.
      actor: Ops owner
      sentiment: positive
    - id: UJ6
      label: Cross-functional expansion
      detail: More teams, more apps, and sometimes external consultants deepen adoption inside the account.
      actor: Executive sponsor
      sentiment: positive
  approximationNotes: This is a generalized journey synthesized from current customer stories, partner pages, and marketplace flows; individual customers may stop at any stage.
