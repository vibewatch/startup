tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Likely buyer / user / payer
  - Representative public proof
  - Primary job-to-be-done
  - Scale / strategic value signal
  - Main gap
  rows:
  - - Enterprise PMO / operations teams
    - 'Buyer: PMO or ops lead; users: cross-functional contributors; payer: centralized software budget'
    - Neterra, Bell Direct, British Land, Wallester
    - Replace fragmented work tools, centralize execution, automate coordination
    - 20M+ users company-wide claim and 50%+ of customers using 5+ apps imply large cross-functional expansion potential
    - No public contract-size or renewal data by enterprise cohort
  - - Marketing and creative organizations
    - 'Buyer: marketing leader; users: campaign, content, and design teams; payer: department budget'
    - Cartoon Network, British Land, Pressed Juicery, RevPartners
    - Campaign planning, approvals, reporting, and client/project coordination
    - Many named stories and workflow-specific metrics make marketing one of the clearest public wedges
    - Case-study outcomes are curated and mostly non-audited
  - - Education and nonprofit-style administrators
    - 'Buyer: department administrator; users: coordinators and student-facing staff; payer: institutional budget'
    - Miami University and Wake Forest-style stories on the customer hub
    - Event planning, collaboration, intake, and campus coordination
    - Evidence shows ClickUp reaches non-software environments and recurring annual work
    - No public retention or seat-expansion data for education accounts
  - - Retail, restaurant, and consumer operations
    - 'Buyer: store-planning or operations lead; users: rollout, field, and support teams; payer: operations budget'
    - Lids, Chick-fil-A, Pressed Juicery
    - Store openings, operational rollout, service coordination, and digital execution
    - Public proof links ClickUp to measurable time or overhead savings in frontline-heavy businesses
    - No public proof on deployment breadth beyond highlighted teams
  - - Fintech, telecom, and technical product teams
    - 'Buyer: product or technical ops lead; users: engineers and launch teams; payer: technology budget'
    - Wallester, Neterra, Yggdrasil Gaming
    - Product launches, deployment tracking, incident coordination, and technical workflow visibility
    - Stories show ClickUp can cross from business PM into engineering-adjacent coordination
    - Need independent proof on long-run reliability and governance at scale
  notes: Segmentation is synthesized from current ClickUp stories, partner pages, customer websites, and review narratives; it describes visible public wedges rather than ClickUp's full customer base.
