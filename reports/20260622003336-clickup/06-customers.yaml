  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, logo retention, and renewal-rate data by self-serve versus enterprise cohort.
    whyItMatters: Public adoption and review volume do not prove customer durability or expansion quality without renewal economics.
    diligencePath: Request board materials, investor updates, or finance dashboards with cohort retention and renewal data for the last 8 quarters.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer, top-5, and top-10 ARR concentration plus channel concentration by direct, partner-assisted, and self-serve revenue.
    whyItMatters: The public story map is broad, but investors cannot tell whether economics are diversified or anchored by a few flagship accounts.
    diligencePath: Request customer concentration schedules and sales channel mix from finance or revops leadership.
    relatedQuestionRefs:
    - QU021
    - QU022
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-proof
    missingEvidence: A full exported list of current named customer stories with publish dates, segment tags, and production-versus-pilot status.
    whyItMatters: The chapter can sample the strongest visible stories, but not prove whether they are representative of the whole customer base.
    diligencePath: Request CRM or customer-marketing exports that map every public story to account stage, segment, and outcome category.
    relatedQuestionRefs:
    - QU009
    relatedTableRefs:
    - TU003
  - type: access-blocked
    severity: minor
    topic: third-party-review-coverage
    missingEvidence: Fresh Gartner Peer Insights or similar gated review-platform detail that could deepen independent enterprise sentiment checks.
    whyItMatters: Current review evidence is already substantial, but broader enterprise-only review coverage would help triangulate governance and support concerns.
    diligencePath: Re-run the gated review fetches with authenticated browser access or obtain exported review summaries from the vendor or a subscriber.
