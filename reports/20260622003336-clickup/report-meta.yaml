companyProfile:
  summary: 'ClickUp is a San Diego-based private workflow software company positioning
    itself as a converged AI workspace that unifies tasks, docs, chat, calendar, dashboards,
    workflows, and agentic automation. Public evidence shows meaningful scale, including
    company-claimed ARR above $300M and more than 20M users in 2025, plus continued
    product expansion through Qatalog and Codegen acquisitions and a broader 2026
    AI push. The underwriting constraint is disclosure quality: public sources do
    not provide audited current revenue, margin, retention, cap-table, board, or post-2021
    valuation evidence, and the May 2026 layoff adds execution uncertainty to the
    AI-first operating reset.'
