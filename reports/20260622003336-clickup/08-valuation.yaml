- id: entry-discipline-diligence-and-kill-triggers
  title: Entry discipline, diligence, and kill triggers
  body: 'The final diligence posture should focus less on whether ClickUp can keep growing and more on whether the next transaction clears at terms that fairly compensate for information risk. The central missing items are current valuation evidence, cap-table and preference terms, and proof that the AI-first reset has not weakened retention, support quality, or gross margin. That is why the most important diligence asks are practical rather than theoretical: current secondary or tender documents, a board-grade ARR bridge, net revenue retention, gross margin, burn and runway, customer support and churn data after the layoff, and any debt or structured-finance instruments that could change downside outcomes. The thesis-break triggers are also monitorable. If a fresh round clears well below the old $4 billion mark, if retention or support quality slips after the reorganization, if AI attach fails to translate into durable renewal economics, or if management cannot show a clean path from more
    than $300 million ARR toward the billion-dollar ambition it is publicly marketing, the premium narrative compresses quickly. Conversely, if ClickUp can show stronger 2026 ARR, stable customer quality, and a clean cap table, the case can move from research-more toward track or buy depending on price.'
