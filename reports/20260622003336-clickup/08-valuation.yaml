  evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-valuation
    missingEvidence: Any 2025-2026 primary round, tender, secondary, or 409A evidence that refreshes ClickUp’s current valuation and price per share.
    whyItMatters: Without a fresh mark, the chapter must compare a 2021 price anchor to 2025-2026 operating evidence, which weakens price precision.
    diligencePath: Request the latest financing materials, secondary paperwork, and board-approved 409A summary from management.
    relatedQuestionRefs:
    - QV002
    - QV023
    - QV029
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: retention-and-margin
    missingEvidence: Net revenue retention, gross margin, burn, runway, and a board-grade ARR-to-revenue bridge.
    whyItMatters: Premium workflow multiples in 2026 require efficiency and durability evidence, not just top-line claims.
    diligencePath: Obtain the CFO operating package, auditor-quality ARR bridge, and cohort-level renewal files.
    relatedQuestionRefs:
    - QV023
    - QV028
    - QV030
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Full cap table, liquidation preferences, option overhang, and any venture debt or structured finance terms.
    whyItMatters: Return outcomes can differ materially from headline enterprise value when preference stacks or debt are significant.
    diligencePath: Review the cap table export, charter documents, debt schedule, and any investor side letters.
    relatedQuestionRefs:
    - QV023
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: private-comp-set
    missingEvidence: More current private transaction data for workflow-software peers with both disclosed revenue and disclosed valuation.
    whyItMatters: The private comp frame currently relies on secondaries, sponsor deals, and uneven disclosure across peers.
    diligencePath: Collect brokered secondary references, investor letters, or management-supplied comp decks under NDA.
    relatedQuestionRefs:
    - QV015
    - QV016
    - QV024
    relatedTableRefs:
    - TV004
  - type: access-blocked
    severity: minor
    topic: institutional-comp-data
    missingEvidence: Full institutional comp-sheet membership and methodology detail from paywalled market-data providers.
    whyItMatters: Institutional comp packs could narrow range width and improve peer membership discipline.
    diligencePath: Pull the latest PitchBook or FactSet software comp workbook through a licensed user.
    relatedQuestionRefs:
    - QV010
    - QV022
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: post-reorg-customer-health
    missingEvidence: Post-May 2026 support SLA, customer-success staffing, NRR, and enterprise renewal metrics after the AI-first reorganization.
    whyItMatters: The layoff only matters to valuation if it harms or improves customer economics, and the public record cannot yet test that.
    diligencePath: Request monthly support, onboarding, retention, and expansion dashboards from the COO and CS leadership.
    relatedQuestionRefs:
    - QV026
    - QV028
    relatedTableRefs:
    - TV005
    - TV006
