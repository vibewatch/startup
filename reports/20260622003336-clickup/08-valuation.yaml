- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - ARR is still near the public $300M floor, growth decelerates after the reorg, and investors mark ClickUp near public collaboration comps.
    - $0.6B-$1.2B using roughly 2x-4x on a $300M base.
    - Support quality slips, AI attach proves noisy, or a fresh financing reprices the story sharply lower.
    - Medium if execution damage appears in 2026 customer metrics.
  - - Base
    - ARR remains above $300M and growth is real, but buyers underwrite ClickUp as a scaled workflow asset rather than a top-tier private AI premium comp.
    - $1.5B-$2.4B using a premium-to-public but sub-Notion multiple band.
    - No clean current price, no preference stack, and no proof yet that the reset improved economics.
    - Highest-probability outcome from current public evidence.
  - - Bull
    - ARR moves materially above the public floor, AI expansion is durable, and investors accept a premium private multiple similar to the best workflow/AI names.
    - $3.2B-$4.8B using roughly 9x-12x on ~$350M-$400M ARR assumptions.
    - 'Requires facts not yet public: higher ARR, strong retention, and evidence that the AI-first reorg lifted efficiency without harming customers.'
    - Low unless fresh 2026 disclosure materially improves.
  notes: Scenario ranges are explicit assumption cases, not claims about the current undisclosed price or any current market-clearing transaction.
