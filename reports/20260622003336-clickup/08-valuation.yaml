- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current valuation mark
    - Any 2025-2026 primary round, tender, secondary, or 409A support
    - Without a fresh mark, the 2021 price anchor remains stale.
    - CEO/CFO; request latest financing materials and 409A summary.
  - - Cap table and preferences
    - Fully diluted ownership, liquidation stack, option pool, and any side-letter economics
    - Return outcomes can diverge sharply from headline enterprise value.
    - Finance/legal; review cap table export, charter, and investor rights docs.
  - - ARR bridge and quality of revenue
    - Monthly ARR bridge, logo retention, NRR, and segment-level churn/expansion
    - Needed to decide whether ClickUp deserves premium-private or only public-comp multiples.
    - CFO/FP&A; obtain board package and cohort deck.
  - - Margin and cash profile
    - Gross margin, burn, runway, and debt or structured-finance terms
    - Efficiency evidence now matters as much as growth in 2026 software markets.
    - CFO; review management accounts and debt schedule.
  - - Post-reorg customer health
    - Support SLA, implementation capacity, CS staffing, and enterprise renewal data after the layoff
    - Tests whether the AI-first reset improved economics without damaging customers.
    - COO/CS leader; request post-May 2026 operating KPIs.
  - - AI monetization durability
    - Attach, renewal, overage, and model-cost data for Brain and AI workflows
    - Distinguishes real premium monetization from launch-period excitement.
    - Product/CFO; review AI cohort economics and supplier-cost assumptions.
  notes: These asks are the minimum package needed to turn ClickUp from a scenario-based valuation discussion into a true priced underwriting decision.
