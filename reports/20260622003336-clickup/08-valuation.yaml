- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status
  - Scale metric
  - Valuation / multiple
  - Relevance to ClickUp
  - Limitation
  rows:
  - - Asana
    - Public
    - LTM revenue $808.6M; 180K+ paying customers
    - 1.75x EV/sales; ~$1.60B market cap
    - Closest publicly listed work-management reference with disclosed retention and margin data.
    - Lower-growth and lower-premium narrative than ClickUp’s current AI story.
  - - monday.com
    - Public
    - LTM revenue $1.30B; Q1 2026 revenue +24% YoY
    - 1.62x EV/sales; 2.41x P/S
    - Scaled workflow platform peer showing what the market pays for profitable execution with AI monetization.
    - June 2026 share-price weakness pulls the multiple down and may overstate pessimism.
  - - Atlassian
    - Public
    - LTM revenue $6.19B; Q2 FY26 cloud revenue $1.07B
    - 3.41x EV/sales; 3.39x P/S
    - Broader collaboration platform reference for suite breadth at global scale.
    - Much larger, more diversified, and more mature than ClickUp.
  - - Smartsheet
    - Take-private / sponsor deal
    - FY2026 revenue projections $1.285B-$1.318B
    - $8.4B value; about 6.4x-6.5x projected revenue
    - Shows that private buyers still pay above public marks for durable workflow assets with control.
    - Control premium plus disclosed public-company financials make it a cleaner asset than ClickUp.
  - - Notion
    - Private secondary
    - '> $600M ARR'
    - ~$11B secondary value; roughly 18x ARR
    - Best premium private collaboration/AI benchmark in the set.
    - Secondary trade, not a fresh primary round, and Notion disclosed more scale and AI mix than ClickUp.
  - - Linear
    - Private primary round
    - Profitable; 15,000+ companies; revenue undisclosed
    - $1.25B Series C valuation
    - Useful narrative comp for high-quality product-development workflow software.
    - No public revenue, so it informs positioning more than direct multiple math.
  notes: This set captures the most decision-relevant public and private workflow references fetched on 2026-06-22; it is intentionally selective rather than exhaustive.
