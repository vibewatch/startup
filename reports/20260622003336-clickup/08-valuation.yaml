- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Fresh financing re-prices the company
    - A 2026 or 2027 round clears materially below the old $4B mark
    - Confirms that the 2021 price cannot be defended on current evidence.
    - Re-underwrite from the new mark; do not average into the old narrative.
  - - Post-layoff customer quality weakens
    - NRR or gross retention slips, or support/implementation metrics worsen after the AI-first reset
    - Turns the reorganization from efficiency thesis into commercial-risk thesis.
    - Move the case toward avoid unless the price resets hard.
  - - AI attach does not persist
    - AI inclusion lifts initial deal size but not renewal, gross margin, or cohort expansion
    - Breaks the premium-multiple case built on AI monetization depth.
    - Collapse the bull case and anchor closer to public medians.
  - - ARR progression stalls
    - Management cannot show a credible bridge from >$300M ARR toward its public $1B+ ambition
    - Premium private narrative loses credibility.
    - Keep the recommendation at research-more or worse.
  - - Cap-table overhang appears
    - Preference stack, debt, or structured terms materially subordinate new money or common outcomes
    - Enterprise value stops being a useful shorthand for shareholder return.
    - Rebuild return math from fully diluted and liquidation terms.
  notes: Each trigger is observable through diligence materials or a future financing event, making the watch list operational rather than rhetorical.
  claimRefs:
