tables:
- id: TV001
  title: Recommendation summary
  columns:
  - Dimension
  - View
  - Supporting evidence
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Real scale proof exists, but current price evidence and return mechanics do not.
    - Do more diligence before underwriting any new entry.
  - - Confidence
    - medium-low
    - The revenue and financing history are visible, but the current mark and cap table are not.
    - Treat the call as evidence-sensitive rather than high-conviction.
  - - Risk rating
    - high
    - The 2026 AI-first reorganization adds execution dispersion to an already opaque private-company setup.
    - Demand more downside protection or more disclosure.
  - - Valuation stance
    - stretched at the 2021 $4B watermark
    - That anchor implies about 13.3x on the public >$300M ARR floor, above current public productivity comps and Smartsheet’s take-private multiple.
    - Do not assume the old mark is still fair simply because growth looks credible.
  - - Entry discipline
    - prefer sub-$2.5B unless premium-case proof appears
    - Base-case public/private comp math clusters well below $4B, while the bull case needs materially stronger ARR and premium-quality metrics.
    - Only stretch toward the old mark if management can show better 2026 ARR, retention, and margin evidence.
  notes: This table converts the retained evidence into an IC-style conclusion; it is not a claim that ClickUp is currently being offered at any specific price.
