  topStrengths:
    - ClickUp 的公开规模锚点可信，包括公司声称 ARR 超过 $300M、用户超过 20M，以及横向采用信号广。
    - 产品已经把任务、文档、聊天、仪表盘、日历、自动化和 AI agents 收进同一工作区，支撑差异化整合叙事。
    - 核心席位、企业控制、Brain AI、Everything AI 和 AI credits 的定价层级较宽，说明基础任务管理 SKU 之外还有多条变现杠杆。
  topRisks:
    - 最后一个干净的公开估值锚点是 2021 年 $4B Series C；除非 ARR 和质量指标显著高于公开下限，否则放到 2026 年上市工作流公司倍数下偏贵。
    - 公开披露仍缺当前留存、利润率、烧钱速度、债务、股权结构表和优先权数据，公开证据无法支撑下行风险和真实股东回报测算。
    - 2026 年 5 月 AI-first 裁员和经营重置抬高了执行、支持能力和文化风险；若重组后增长或客户结果转弱，风险会放大。
  unresolvedGaps:
    - 需要董事会级别的当前 ARR、NRR、毛利率、烧钱速度、现金跑道和债务披露，以判断 AI 推进是否同时改善增长和业务质量。
    - 需要当前股权结构表、优先股堆叠，以及 2025–2026 年任何新股或老股价格发现，判断新入场价格低于还是高于过旧的 2021 年水位。
    - 需要重组后的客户质量证据，包括 2026 年 5 月裁员后的支持指标、流失、扩张，以及具名企业客户背书深度。
