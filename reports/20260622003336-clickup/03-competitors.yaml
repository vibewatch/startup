- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Route
  - List pricing / unit
  - AI packaging
  - Enterprise model / unknowns
  - Buyer implication
  rows:
  - - ClickUp
    - $7 Unlimited / $12 Business per user-month billed yearly; Enterprise custom
    - Brain $9 per user-month or Everything AI $28 plus credits
    - Enterprise price undisclosed; realized AI consumption depends on credits and usage
    - Cheap core seat plus broad PM surface, but full AI value is not truly all-in at base price
  - - Asana
    - $10.99 Starter / $24.99 Advanced per user-month billed yearly; Enterprise custom
    - AI Studio Basic credits bundled into paid plans
    - Enterprise and Enterprise+ pricing undisclosed
    - Higher list price than ClickUp, but AI is less visibly carved out as a separate add-on
  - - monday work management
    - $9 Basic / $12 Standard / $19 Pro per seat-month billed yearly; Enterprise custom
    - AI credits meter specific tools and agents
    - Above-40-user exact pricing and enterprise terms require quote
    - Competitive entry pricing with broad platform story, but real AI economics are usage-based
  - - Jira Cloud
    - Free up to 10 users; Standard $7.91; Premium $14.54 per user-month; Enterprise custom
    - Rovo and agent value tied to paid cloud plans and broader Atlassian adoption
    - Best total cost depends on whether customer buys only Jira or a larger Atlassian stack
    - Aggressive core entry price, especially for software teams
  - - Notion
    - Business / Enterprise plan pricing not the focus of retained text; Custom Agents $10 per 1,000 monthly credits
    - Core AI included in Business and Enterprise; custom agents consume credits
    - Enterprise seat pricing requires sales context; credit burn can vary heavily with automation
    - Appealing if buyer wants AI woven into docs/search/projects, but usage economics still matter
  - - Linear
    - Free tier; $10 Basic / $16 Business per user-month; Enterprise custom annual only
    - Agent automations, triage intelligence, and code intelligence tied to higher tiers
    - Enterprise pricing and support negotiated directly
    - Strong value for engineering orgs, less relevant for broad non-technical deployment
  - - Google Workspace / Microsoft 365 Copilot
    - Workspace Standard $14 and Plus $22 per user-month; Copilot attaches to suite plans
    - AI is embedded into mail, docs, meetings, search, and agents inside suite context
    - Real cost depends on existing suite agreement and add-on terms
    - Bundle incumbents can make standalone workflow software look incremental rather than essential
  notes: This table uses public list pricing and visible packaging only; enterprise discounts, consumption-based AI overages, and services cost remain under-evidenced in public materials.
