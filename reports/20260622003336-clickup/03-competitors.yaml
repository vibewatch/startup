- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - One workspace replaces fragmented tools
    - Google, Microsoft, Notion, monday, and Asana all now market AI-first workspace convergence
    - High
    - 'Test actual displacement in live deals: which third-party tools does ClickUp fully remove versus merely sit beside?'
  - - Broad feature set is a durable advantage
    - Review sources say breadth also increases onboarding and usability burden
    - High
    - Request win/loss analysis segmented by team size, admin maturity, and time-to-value
  - - Aggressive list pricing protects share
    - AI credits, enterprise discounts, and services costs can change effective TCO across rivals
    - Medium-High
    - Model realized pricing and AI consumption for common usage patterns, not just list seats
  - - Engineering and enterprise expansion can be won from one product base
    - Atlassian and Linear are structurally stronger in developer-adjacent workflows
    - High
    - Measure ClickUp’s win rate specifically in product/engineering-led accounts versus broader cross-functional accounts
  - - Cross-functional breadth is hard for smaller rivals to match
    - Specialists like Linear prove narrower, better-opinionated tools can still take high-value teams
    - Medium
    - Track displacement by workflow type to see whether ClickUp is strongest in consolidation accounts only
  notes: Severity reflects competitive impact on ClickUp specifically, not the attractiveness of the rival as a standalone company.
