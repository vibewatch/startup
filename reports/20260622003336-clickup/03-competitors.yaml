  rows:
  - - ClickUp
    - Broad collaborative work-management suite
    - Private vendor; claims 85% of Fortune 500 usage and 100+ products in one stack
    - Cross-functional teams from SMB through enterprise
    - High breadth across PM, docs, chat, automations, and multi-model AI
    - Breadth raises rollout and complexity risk; AI spend is a separate layer
  - - Asana
    - Collaborative work management / enterprise coordination
    - Large public-scale platform with 85% of Fortune 100 claim and large-enterprise deployment messaging
    - Operations, marketing, PMO, and enterprise program teams
    - Clear workflow model, goals/portfolios, enterprise governance, embedded AI allowances
    - Less native suite breadth than ClickUp on docs/chat convergence
  - - monday.com
    - AI work platform / work OS
    - 250K+ customers, 4,547 customers above $50K ARR, 110% NDR, 3,211 employees
    - Cross-functional teams spanning work management, CRM, service, and dev
    - Broad platform pitch plus public-company scale and competitive list pricing
    - Some pricing and AI economics remain less transparent in visible page content
  - - Jira / Atlassian
    - Engineering-led system of work
    - 350K+ customers, 85%+ of Fortune 500, 55,913 cloud ARR customers >$10K
    - Engineering, IT, service, and larger enterprises
    - Deep workflow control, massive distribution, Rovo search/agents, ecosystem leverage
    - Best story often requires buying deeper into the Atlassian stack
  - - Notion
    - AI workspace / knowledge-work convergence
    - 100M+ users; 62% of Fortune 100; CNBC reports $500M annualized revenue and ~1,000 employees
    - Knowledge-heavy teams, startups, product, GTM, and enterprise docs/search buyers
    - Docs, knowledge base, projects, enterprise search, and agents in one workspace
    - Less explicit PMO or engineering-governance depth than Jira or Asana
  - - Linear
    - Specialist product-development system
    - 15,000 companies; profitable; $82M Series C at $1.25B valuation
    - Product and engineering organizations
    - Fast, opinionated workflows for issues, projects, cycles, requests, and AI coding context
    - Narrower cross-functional scope than ClickUp or monday.com
  - - Google Workspace / Microsoft 365 Copilot
    - Suite-bundle substitute
    - Massive installed-base incumbents with AI attached to existing suite contracts
    - Enterprises standardizing on docs, mail, meetings, search, and agents
    - Bundle power, identity/control layer, built-in search and AI context
    - Workflow control is broader-suite centric rather than PM-specific
  - - Smartsheet
    - Adjacent spreadsheet-first work execution
    - Public adjacent vendor with paid member plans and AI-enhanced work execution
    - PMO, operations, and spreadsheet-oriented planners
    - Familiar grid-centric planning with Gantt, board, calendar, reports, and automations
    - Weaker AI-workspace narrative and less convergence breadth than ClickUp or Notion
  notes: Rows summarize the buyer-facing alternative set rather than only direct substitutes; scale cells intentionally mix public metrics and private-company funding anchors where those are the strongest public signals.
