  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: Segmented win/loss data showing where ClickUp beats or loses to Asana, monday.com, Atlassian, Notion, and Linear.
    whyItMatters: Public positioning and pricing show the alternative set, but they do not prove where ClickUp actually converts or churns by workflow and buyer type.
    diligencePath: Request CRM win-loss reports, competitor mention data, and pilot-to-paid conversion by segment from management.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: realized-pricing-and-ai-consumption
    missingEvidence: Comparable realized enterprise pricing, discounting, implementation cost, and AI-credit consumption across the major vendors.
    whyItMatters: List prices are directionally useful but insufficient for true TCO, especially now that several vendors meter AI usage separately from seats.
    diligencePath: Collect recent proposals, renewal quotes, AI-usage invoices, and implementation-scoping documents from at least three buyer archetypes.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: minor
    topic: migration-effort
    missingEvidence: Independent data on migration timelines and change-management burden when moving from suites or specialist tools into ClickUp.
    whyItMatters: Switching cost is central to moat durability, yet the retained public set is richer on product claims than on measured deployment friction.
    diligencePath: Interview recent switchers, request customer reference calls, and compare time-to-live across ClickUp, Asana, Notion, and Atlassian migrations.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP004
