company:
  name: ClickUp
chapter:
  number: 1
  title: Company Overview
  summary: ClickUp is a private San Diego productivity-software company that now frames itself as the world's first Converged AI Workspace, with official 2025 disclosures showing more than $300 million ARR and over 20 million users. The strongest public valuation anchor remains the October 2021 $400 million Series C at a $4 billion valuation, while 2025-2026 evidence shows aggressive AI product expansion, Qatalog and Codegen acquisitions, and leadership scaling ahead of a possible IPO. Public evidence also shows material ambiguity around current headcount, paying-customer counts, and board transparency, plus execution risk from a May 2026 22% layoff tied to an AI-first operating model.
sections:
- id: identity-product-and-hq
  title: Identity, product thesis, and headquarters signal
  body: 'ClickUp''s official web surfaces are highly consistent on strategic identity even when they are lighter on corporate detail. The homepage, about page, and careers page all describe the company''s mission as maximizing human productivity and position ClickUp as a converged workspace where software, AI, and humans work together with shared context. The product story is broader than a basic project-management app: current pages tie together tasks, Docs, chat, calendar, workflows, Brain, and Super Agents, while the pricing and product pages show a deliberate move to monetize AI as a core layer rather than an optional feature. Customer proof on official pages is strong in breadth but weaker in definitional precision. ClickUp claims 5M+ teams, 85% of Fortune 500 companies, 3M+ tasks automated by agents, and third-party ROI outcomes from a 2025 Forrester study, but it does not reconcile those team-level and user-level metrics with a clean current paying customer count. Headquarters evidence
    is also slightly uneven. Private-company trackers and the privacy policy point to San Diego, and company press releases explicitly describe ClickUp as founded in 2017 and based in San Diego, but the public site does not provide a rich corporate profile page with full operating-location detail. For later chapters, San Diego is strong enough to use as the headquarters signal, but not strong enough to treat as a fully audited corporate fact pattern without management confirmation.'
