    severity: material
    topic: scale-metric-reconciliation
    missingEvidence: A single management-approved reconciliation of users, teams, paying customers, and employee count after the May 2026 layoffs.
    whyItMatters: The investment story depends on scale efficiency, but current public metrics use different denominators and time stamps.
    diligencePath: Ask for the latest board or operating-review KPI page that defines users, teams, customers, employees, and ARR on the same date.
