- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public state
  - Exact diligence path
  rows:
  - - Revenue mix by base seats, AI subscriptions, credits, and enterprise services
    - Needed to judge durability, attach quality, and exposure to AI consumption volatility.
    - Not publicly disclosed.
    - Request product-level ARR split, AI attach by cohort, and enterprise-services share.
  - - Realized pricing and discounting
    - Needed to separate list-price signaling from actual monetization.
    - Not publicly disclosed.
    - Request quote logs, contract samples, renewal schedules, and discount policy.
  - - Gross margin and AI cost burden
    - Needed to test whether AI attach improves or compresses unit economics.
    - Not publicly disclosed.
    - Request gross margin bridge, model-supplier spend, support costs, and contribution margin by tier.
  - - Cash, burn, and runway
    - Needed to assess financing dependency and downside protection.
    - Not publicly disclosed.
    - Request balance sheet, cash-flow statement, monthly burn, and base / downside runway analysis.
  - - Net retention, churn, and customer concentration
    - Needed to test revenue quality and durability of expansion claims.
    - Not publicly disclosed.
    - Request NRR, GRR, churn, top-10 customer share, and renewal calendar.
  - - Debt, covenants, and any secondary-capital activity
    - Needed to understand priority claims on cash flows and true shareholder dilution.
    - Not publicly disclosed in reviewed sources.
    - Request debt schedule, covenant package, draw history, and cap-table changes since 2021.
  notes: These are the main blockers preventing public-only underwriting even though the monetization architecture and demand signals are now easier to see.
