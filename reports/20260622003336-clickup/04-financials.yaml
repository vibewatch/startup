tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit / meter
  - Current public status
  - Revenue quality view
  - Diligence ask
  rows:
  - - Core workspace subscriptions
    - Free-to-paid seat conversion across Free, Unlimited, Business, and Enterprise plans.
    - Per-user subscription pricing with annual billing emphasis.
    - Clearly live and list-priced on current official pages.
    - High confidence on existence; low confidence on realized ASP after discounts.
    - Request billed seat counts by tier, net expansion by cohort, and average realized price per seat.
  - - Brain AI subscriptions
    - Separate AI add-on layered across a workspace.
    - $9 per user per month with included AI allowance.
    - Officially live and prominently merchandised.
    - High confidence on packaging; low confidence on attach rate, renewal, and margin.
    - Request AI attach by customer segment and gross margin after model costs.
  - - Everything AI subscriptions
    - Higher-end AI and agentic bundle sold above core seats.
    - $28 per user per month plus larger shared credit pool.
    - Officially live and positioned for full agentic suite adoption.
    - High confidence on packaging; low confidence on volume and mix.
    - Request percent of paid workspaces on Everything AI and upgrade / downgrade cohorts.
  - - AI Super Credits / usage overages
    - Shared workspace credits fund agents, AI fields, automations, and image generation.
    - $10 per 10,000 credits after included allowance.
    - Publicly disclosed metering mechanic.
    - Medium confidence on monetization path because usage incidence is undisclosed.
    - Request monthly credit burn, overage revenue, and model-cost pass-through assumptions.
  - - Enterprise contracts and managed services
    - Custom enterprise packaging adds governance, onboarding, API scale, and managed services.
    - Negotiated contract terms rather than visible list price.
    - Existence is clear; contribution to ARR is not.
    - Medium confidence on strategic importance; low confidence on actual revenue share.
    - Request enterprise ACV bands, service attach, term length, and services margin.
  notes: Publicly visible monetization surfaces are broader than a single seat subscription, but the public record does not disclose revenue mix between core SaaS, AI subscriptions, usage credits, and enterprise services.
