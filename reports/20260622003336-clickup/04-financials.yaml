- id: TI002
  title: Pricing / monetization table
  columns:
  - Surface
  - Public pricing signal
  - What is actually disclosed
  - Financial implication
  - Exact diligence ask
  rows:
  - - ClickUp Unlimited
    - $7 per user per month billed yearly
    - Core paid tier with broad workflow functionality.
    - Sets a low headline entry price for paid adoption.
    - Request monthly-billed equivalent, realized discounting, and conversion by cohort.
  - - ClickUp Business
    - $12 per user per month billed yearly
    - Mid-tier plan with larger automation and governance surface.
    - Keeps base-seat pricing below several scaled peers.
    - Request share of paid seats on Business and expansion path into Enterprise.
  - - ClickUp Enterprise
    - Custom pricing
    - Governance, SAML/SCIM, audit logs, higher automation/API ceilings, onboarding support.
    - Makes enterprise monetization possible but hides ASP, terms, and services mix.
    - Request enterprise ACV, minimum seat commitments, and implementation economics.
  - - Brain AI
    - $9 per user per month
    - Adds multi-model AI, workspace search, and 1,500 credits.
    - Material ARPU uplift if attached broadly across a workspace.
    - Request attach rate, gross margin, and renewal behavior for Brain AI.
  - - Everything AI
    - $28 per user per month
    - Adds expanded agentic features plus 5,000 credits.
    - Can push fully loaded price far above base workspace price.
    - Request mix of Brain AI versus Everything AI and churn by AI tier.
  - - AI overage credits
    - $10 per 10,000 credits
    - Explicit usage meter for agents, fields, automations, and image generation.
    - Introduces a consumption component and AI-cost sensitivity into an otherwise seat-led model.
    - Request monthly overage revenue, effective cost per task, and supplier pass-through risk.
  notes: The official page discloses list price and meter design, not realized pricing, discount policy, or blended customer economics.
