  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Product-level ARR split across base seats, AI subscriptions, AI overage credits, and enterprise services.
    whyItMatters: Without revenue mix, it is impossible to tell whether ClickUp's AI narrative is a meaningful profit pool or mainly a sales hook layered on core SaaS.
    diligencePath: Request monthly ARR bridge by product line and cohort, including AI attach, downgrade, and churn behavior.
    relatedQuestionRefs: [QI007]
    relatedTableRefs: [TI001]
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized ASP, discount schedules, renewal uplift, and contract terms by segment.
    whyItMatters: List pricing can materially overstate monetization quality if large customers buy on discounted or bundled terms.
    diligencePath: Review current quotes, order forms, renewal histories, and enterprise price books.
    relatedQuestionRefs: [QI009, QI024]
    relatedTableRefs: [TI002, TI003]
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current cash, monthly burn, debt schedule, covenants, and base / downside runway.
    whyItMatters: Public funding history does not prove present liquidity or downside protection.
    diligencePath: Request latest board package, balance sheet, cash-flow forecast, and debt agreements.
    relatedQuestionRefs: [QI012, QI023, QI024]
    relatedTableRefs: [TI004, TI005]
  - type: private-evidence-only
    severity: material
    topic: margin-quality
    missingEvidence: Gross margin by product, AI model-supplier spend, support burden, and contribution margin by customer segment.
    whyItMatters: AI attach can increase ARR while compressing gross profit if compute subsidies or support costs rise too quickly.
    diligencePath: Request gross margin bridge by base seats, AI subscriptions, and credit overages plus supplier concentration.
    relatedQuestionRefs: [QI013, QI022, QI024]
    relatedTableRefs: [TI003, TI005]
  - type: private-evidence-only
    severity: material
    topic: retention-concentration
    missingEvidence: NRR, GRR, churn, customer concentration, and renewal calendar.
    whyItMatters: Underwriting revenue quality requires knowing whether expansion is broad-based and whether any large accounts dominate the base.
    diligencePath: Request cohort retention tables, top-customer exposure, and renewal waterfall.
    relatedQuestionRefs: [QI009, QI024]
    relatedTableRefs: [TI003, TI005]
  - type: stale
    severity: material
    topic: valuation-freshness
    missingEvidence: A newer priced-round valuation or formal disclosure that supersedes the 2021 $4 billion anchor.
    whyItMatters: Historical valuation is useful context, but it may not reflect current financing conditions or current shareholder dilution.
    diligencePath: Ask management for any post-2021 primary or secondary financing terms and current cap-table summary.
    relatedQuestionRefs: [QI011]
    relatedTableRefs: [TI004]
