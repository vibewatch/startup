- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / range
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR anchor
    - $300M ARR by September 2025
    - Medium
    - Anchors scale discussion, but remains company-distributed rather than audited.
    - Request monthly ARR bridge, audited revenue, and reconciliation between ARR and GAAP revenue.
  - - AI deal-size uplift
    - 7x larger average sales-led deal size when AI is included
    - Medium
    - Suggests AI may be both monetization and sales-efficiency leverage.
    - Request sample size, baseline ACV, and whether uplift is causal or mix-driven.
  - - New sales-led AI attach
    - More than 40% of new sales-led deals include AI
    - Medium
    - Indicates AI is already important to new-logo mix.
    - Request attach by segment, win rate, and renewal after first year.
  - - Monthly top-of-funnel signal
    - 800,000+ monthly team signups, 145% YoY
    - Medium
    - Shows strong demand generation, though not paid conversion.
    - Request free-to-paid conversion, activation, and enterprise-to-self-serve split.
  - - Estimated ARR per employee
    - Roughly $200K using $300M ARR and ~1.5K employees
    - Low
    - Directional efficiency proxy only, useful for private-company sanity checks.
    - Request official headcount, fully loaded opex, and quarterly ARR per FTE trend.
  - - Estimated ARR per quota-carrying sales rep
    - Roughly $3.4M using $300M ARR and 87 quota reps
    - Low
    - Directional sales-productivity proxy only and likely distorted by self-serve revenue.
    - Request quota-carrier count, sales-led ARR, CAC, payback, and blended productivity by channel.
  notes: The reviewed public record supports proxy analysis, not closed-form unit economics. CAC, payback, NRR, gross margin, and contribution margin remain undisclosed.
