  - type: conflicting-data
    severity: material
    topic: sam-lens
    missingEvidence: An independent 2026 analyst model that isolates collaborative work management or converged workspace spending rather than adjacent PM or collaboration categories.
    whyItMatters: The current range spans narrow PM seats to broader collaboration suites, which materially changes TAM and SAM framing.
    diligencePath: Obtain Gartner, IDC, or Forrester market notes that explicitly segment collaborative work management or converged work suites and reconcile them to ClickUp's feature mix.
    relatedQuestionRefs:
    - QM021
