  - type: private-evidence-only
    severity: material
    topic: som-gap
    missingEvidence: Paid-seat counts, enterprise ACV, segment revenue mix, and win rates by buyer segment for ClickUp.
    whyItMatters: Without company operating data, any SOM estimate would be speculative and could overstate near-term reachable spend.
