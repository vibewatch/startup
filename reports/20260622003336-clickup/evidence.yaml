evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: A current board roster, committee structure, and any observer or protective-right arrangements.
    whyItMatters: >-
      Founder-led companies can look operationally mature in press releases while still having concentrated control or
      weak independent oversight.
    diligencePath: Request the current board deck cover page, cap table summary, and governance matrix directly from management.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
      - TO002
  - type: conflicting-data
    severity: material
    topic: scale-metric-reconciliation
    missingEvidence: >-
      A single management-approved reconciliation of users, teams, paying customers, and employee count after the May
      2026 layoffs.
    whyItMatters: >-
      The investment story depends on scale efficiency, but current public metrics use different denominators and time
      stamps.
    diligencePath: >-
      Ask for the latest board or operating-review KPI page that defines users, teams, customers, employees, and ARR on
      the same date.
    relatedQuestionRefs:
      - QO015
      - QO020
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: paying-customer-count
    missingEvidence: A current paying-customer count or ARR-by-segment disclosure that matches the newer 20M-user narrative.
    whyItMatters: >-
      User totals alone do not show monetization depth, enterprise concentration, or how much of ARR is driven by large
      accounts versus free or lightly paid adoption.
    diligencePath: >-
      Request sales and finance reporting that splits paying customers by plan tier, enterprise share, and ARR
      concentration.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: acquisition-terms
    missingEvidence: Purchase prices, retention packages, and integration milestones for Qatalog and Codegen.
    whyItMatters: >-
      The AI-convergence strategy depends partly on acquisitions, but public releases emphasize product logic without
      quantifying capital allocation or retention risk.
    diligencePath: >-
      Request acquisition term sheets or post-close integration updates from management before underwriting synergy
      value.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: sam-lens
    missingEvidence: >-
      An independent 2026 analyst model that isolates collaborative work management or converged workspace spending
      rather than adjacent PM or collaboration categories.
    whyItMatters: >-
      The current range spans narrow PM seats to broader collaboration suites, which materially changes TAM and SAM
      framing.
    diligencePath: >-
      Obtain Gartner, IDC, or Forrester market notes that explicitly segment collaborative work management or converged
      work suites and reconcile them to ClickUp's feature mix.
    relatedQuestionRefs:
      - QM021
      - QM022
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: som-gap
    missingEvidence: Paid-seat counts, enterprise ACV, segment revenue mix, and win rates by buyer segment for ClickUp.
    whyItMatters: >-
      Without company operating data, any SOM estimate would be speculative and could overstate near-term reachable
      spend.
    diligencePath: >-
      Request board deck or management KPI pack with paid seats, ARR mix, average deal size, and pipeline conversion by
      segment.
    relatedQuestionRefs:
      - QM022
      - QM023
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: enterprise-unit-economics
    missingEvidence: >-
      Public disclosures for ClickUp sales-cycle length, procurement bottlenecks, and attach rate of AI packages to base
      seats.
    whyItMatters: >-
      Adoption timing and margin expansion depend on whether AI upsell and enterprise procurement are working in
      practice.
    diligencePath: >-
      Interview recent enterprise customers and review sales collateral or procurement records for deal duration and AI
      add-on packaging.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: Segmented win/loss data showing where ClickUp beats or loses to Asana, monday.com, Atlassian, Notion, and Linear.
    whyItMatters: >-
      Public positioning and pricing show the alternative set, but they do not prove where ClickUp actually converts or
      churns by workflow and buyer type.
    diligencePath: Request CRM win-loss reports, competitor mention data, and pilot-to-paid conversion by segment from management.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: realized-pricing-and-ai-consumption
    missingEvidence: >-
      Comparable realized enterprise pricing, discounting, implementation cost, and AI-credit consumption across the
      major vendors.
    whyItMatters: >-
      List prices are directionally useful but insufficient for true TCO, especially now that several vendors meter AI
      usage separately from seats.
    diligencePath: >-
      Collect recent proposals, renewal quotes, AI-usage invoices, and implementation-scoping documents from at least
      three buyer archetypes.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: migration-effort
    missingEvidence: >-
      Independent data on migration timelines and change-management burden when moving from suites or specialist tools
      into ClickUp.
    whyItMatters: >-
      Switching cost is central to moat durability, yet the retained public set is richer on product claims than on
      measured deployment friction.
    diligencePath: >-
      Interview recent switchers, request customer reference calls, and compare time-to-live across ClickUp, Asana,
      Notion, and Atlassian migrations.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Product-level ARR split across base seats, AI subscriptions, AI overage credits, and enterprise services.
    whyItMatters: >-
      Without revenue mix, it is impossible to tell whether ClickUp's AI narrative is a meaningful profit pool or mainly
      a sales hook layered on core SaaS.
    diligencePath: Request monthly ARR bridge by product line and cohort, including AI attach, downgrade, and churn behavior.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized ASP, discount schedules, renewal uplift, and contract terms by segment.
    whyItMatters: List pricing can materially overstate monetization quality if large customers buy on discounted or bundled terms.
    diligencePath: Review current quotes, order forms, renewal histories, and enterprise price books.
