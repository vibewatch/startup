  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-retention-concentration
    missingEvidence: NRR, GRR, logo churn, renewal rate, average contract duration, and top-customer concentration by ARR.
    whyItMatters: Without durable retention and concentration data, the market cannot test whether ClickUp’s breadth is translating into sticky multi-year economics or masking shallow adoption.
    diligencePath: Request board or lender reporting with cohort retention, expansion, churn, and customer concentration breakdowns.
    relatedQuestionRefs:
    - QR010
    - QR025
  - type: private-evidence-only
    severity: material
    topic: valuation-risk
    missingEvidence: Current ARR, growth, burn, runway, and any live financing or secondary-marking data after the 2026 reorganization.
    whyItMatters: The last widely cited public valuation anchor is from 2021, so underwriting current downside requires non-public operating and financing evidence.
    diligencePath: Request the latest investor update or board package showing revenue, cash burn, headcount trend, and financing expectations.
    relatedQuestionRefs:
    - QR012
    - QR022
    - QR025
  - type: missing-source
    severity: material
    topic: legal-regulatory-case-log
    missingEvidence: An authoritative litigation, arbitration, and regulatory matter list confirmed by company counsel or a formal legal memo.
    whyItMatters: Public product, legal, and privacy pages do not establish whether there are unresolved customer, employment, IP, or regulatory disputes beyond what is already disclosed.
    diligencePath: Obtain counsel-confirmed litigation and regulatory schedule plus any threatened claims, settlement letters, or agency correspondence.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: ai-unit-economics
    missingEvidence: Brain attach rate, credit consumption, vendor inference costs, gross-margin impact, and renewal behavior for AI-enabled accounts.
    whyItMatters: AI can be a moat or a margin drag; public pages show packaging but not whether monetization outpaces cost or adoption friction.
    diligencePath: Request product and finance dashboards for Brain adoption, consumption, gross margin, and expansion by plan tier.
    relatedQuestionRefs:
    - QR006
    - QR011
    - QR022
  - type: access-blocked
    severity: minor
    topic: incident-history-depth
    missingEvidence: A longer-form incident archive and postmortem set covering Brain, API, automation, and search reliability over time.
    whyItMatters: The status page snapshot confirms current surface area but not whether repeated operational issues have affected larger customers over a longer period.
    diligencePath: Request historical SLA reporting, incident summaries, and export / restore behavior from operations leadership.
    relatedQuestionRefs:
    - QR004
    relatedTableRefs:
    - TR002
