- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / exposure
  - Jurisdiction / scope
  - Current public status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - Cross-border privacy and controller/processor obligations
    - US + GDPR / UK / other global transfers
    - Privacy Policy and DPA acknowledge international transfers, GDPR / CCPA framework, and processor obligations
    - Medium
    - High
    - DPA, SCC-style transfer language, audit rights, privacy rights workflow
    - Enterprise buyers still must validate transfer, retention, and role allocation details
    - Request executed customer DPA, transfer mechanism appendix, and latest security / privacy audit pack
  - - AI data-governance and subprocessor sprawl
    - Global AI and analytics stack
    - Subprocessor list names OpenAI, Anthropic, Google Gemini, Azure AI Foundry, Datadog, Nylas, and others tied to AI, analytics, and integrations
    - High
    - High
    - ClickUp says AI vendors cannot train on customer data and permissions carry into AI features
    - Governance depends on multiple external vendors and contract enforcement, not just ClickUp code
    - Obtain AI architecture diagram, subprocessor notices, retention settings, and customer-side model controls
  - - Regulated-workload deployment gating
    - Enterprise procurement / compliance reviews
    - HIPAA availability, data residency, SAML SSO, and SCIM appear at Enterprise rather than baseline tiers
    - Medium
    - High
    - Enterprise plan unlocks the relevant controls for qualified customers
    - Mid-market or cost-sensitive buyers may stall before full standardization
    - Request win/loss data for regulated accounts and the attach rate of Enterprise controls
  - - Contractual remedy and dispute limits
    - California-governed customer contracts
    - Terms say ClickUp is not a backup service and routes most disputes to binding individual arbitration with class-action waiver
    - Medium
    - Medium-High
    - Customer negotiation on MSA / enterprise order forms can improve terms for larger deals
    - Smaller or self-serve buyers may carry more outage, data-loss, or remedy risk than they expect
    - Review standard MSA, negotiated enterprise templates, SLA language, and indemnity caps by segment
  notes: Rows summarize public legal and compliance posture rather than negotiated customer contracts; residual exposure is judged from current disclosures and the absence of public negotiated terms.
