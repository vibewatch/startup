- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Rollout complexity becomes structural churn
    - Implementation duration and expansion by large accounts
    - Enterprise cohorts fail to expand or require repeated rescue services after initial deployment
    - Treat retention durability as unproven and downgrade conviction on long-term platform standardization
  - - AI monetization does not offset AI cost and confusion
    - Brain attach rate, credit usage, and renewal behavior
    - AI usage rises but margins compress or customers resist add-on / credit economics
    - Reframe AI from moat to margin drag and cut valuation tolerance
  - - Security / privacy diligence stalls regulated customers
    - Procurement cycle time and exception requests
    - Material percentage of regulated prospects require custom contract, residency, or vendor-workaround terms
    - Assume slower enterprise scaling and higher sales friction
  - - AI-first workforce reorg harms support or product quality
    - CSAT, ticket backlog, uptime, and roadmap slip after 2026 layoff
    - Support responsiveness deteriorates or new features ship with materially higher incident / defect rates
    - Treat the 100x-org thesis as execution-negative rather than efficiency-positive
  - - Financing narrative weakens
    - Updated ARR / NRR / burn evidence versus 2021 valuation anchor
    - Next financing implies flat or down valuation without clear operating improvement
    - Model a down-round or extended private timeline and tighten downside cases
  - - Availability / resilience assumptions prove wrong
    - Severity of outages across Brain, API, automations, and core task surfaces
    - A major incident causes data-loss, export failure, or prolonged workflow interruption
    - Escalate operational risk to thesis-break unless resilience controls were clearly strengthened afterward
  notes: Kill criteria are phrased as monitorable operating events so investment decisions can be tied to evidence rather than narrative drift.
