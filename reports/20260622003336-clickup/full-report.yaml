      - number: '7.2'
        title: Security, privacy, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              ClickUp's public trust posture is stronger than many private SaaS peers, but it still creates meaningful
              diligence work for regulated buyers. Current security materials say the platform is hosted on AWS,
              encrypts data in transit and at rest, maintains SOC and ISO certifications, has PCI compliance, and has
              added ISO 42001 positioning around AI governance. The same public materials also say enterprise customers
              can choose data residency, that ClickUp monitors security and availability continuously, and that AI
              providers are contractually barred from training on customer data. Those are positives, yet the legal and
              technical posture is not costless. The privacy policy confirms that ClickUp collects product-usage,
              device, collaboration, and search-behavior data, may transfer data internationally, and relies on third
              parties for analytics, error tracking, and marketing functions. The DPA and subprocessor register go
              further, listing AWS, OpenAI, Anthropic, Google Gemini, Microsoft Azure AI Foundry, Datadog, Nylas,
              Readme, and many other vendors across infrastructure, AI, analytics, and integrations. That breadth gives
              ClickUp capability, but it also increases cross-border review, vendor-management, and
              incident-coordination complexity. Contract terms add another important caveat: ClickUp says the service
              may be interrupted, explicitly says it is not a backup service, and routes disputes through binding
              individual arbitration under California law. The operational signal is therefore mixed rather than binary.
              The status page showed no incidents in the last seven days when fetched, but the public surface area
              already spans Brain, AI Notetaker, Chat, Search, Public API, Automations, and other core objects, so any
              material failure can propagate through far more than a simple task manager.
