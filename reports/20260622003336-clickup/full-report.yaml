  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scorecard for ClickUp on scale proof, monetization breadth, valuation support, and disclosure quality.
    approximationNotes: Scores are 0-10 heuristics derived from retained evidence, not third-party ratings.
    claimRefs:
      - CV005
      - CV011
      - CV013
      - CV038
      - CV047
      - CV048
      - CV050
      - CV056
    data:
      items:
        - label: Scale proof
          score: 8
          detail: The company publicly claimed >$300M ARR and >20M users.
        - label: Monetization breadth
          score: 8
          detail: Seats, AI layers, and broader workflow context create multiple expansion paths.
        - label: Valuation transparency
          score: 2
          detail: The last clean public price is from 2021 and current transaction terms are undisclosed.
        - label: Public comp support
          score: 3
          detail: 2026 public productivity multiples sit well below the old $4B mark on the public ARR floor.
        - label: Execution risk
          score: 4
          detail: The 2026 AI-first layoff/reset adds meaningful operating dispersion.
        - label: Evidence quality
          score: 5
          detail: Scale is visible, but retention, margins, and cap-table facts remain private.
