        blocks:
          - type: paragraph
            body: >-
              The strongest public growth anchor is still company-distributed rather than audited. In September 2025,
              ClickUp said it had surpassed $300 million of annual recurring revenue and over 20 million users
              worldwide. The same release added financially relevant breadcrumbs: more than 50% of customers were using
              five or more converged apps, monthly team signups exceeded 800,000 and were accelerating at 145% year over
              year, AI usage was growing 800% year over year, average sales-led deal sizes were seven times larger when
              AI was included, and more than 40% of new sales-led deals had AI attached. That mix of signals implies
              expansion revenue and AI attach are becoming core drivers rather than experimental upsells.
              Customer-facing proof pages add additional but still company-claimed ROI framing, including 384% ROI over
              three years, payback under six months, and 92,400 hours saved in a cited third-party study. The weak point
              is that the bridge from demand to durable economics is still private. GetLatka publishes low-confidence
              estimates of roughly $278.5 million revenue in 2024, $300 million in 2025, about 100,000 customers,
              roughly 1,500 employees, and 87 quota-carrying sales reps. Those estimates are useful for directional
              heuristics such as ARR per employee or ARR per seller, but they are not substitutes for audited
              disclosures, cohort retention, or realized ACV data.
