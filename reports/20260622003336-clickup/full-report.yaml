      - number: '6.3'
        title: Retention, satisfaction, and customer risks
        blocks:
          - type: paragraph
            body: >-
              Independent review volume strongly suggests ClickUp has a large and active installed base, but the reviews
              also surface the main reasons customer durability could be uneven across segments. G2 shows 12,675 reviews
              at 4.6/5, TrustRadius shows 1,569 reviews at 8.7/10, and Software Advice shows a 4.6 overall rating with a
              weaker 4.3 ease-of-use score. The positive pattern is consistent: users value flexibility, all-in-one
              workflow consolidation, automation, documentation, and the ability to shape the system around their own
              process. The negative pattern is also consistent and more strategically important for diligence. Reviewers
              repeatedly mention a steep learning curve, interface or setup overwhelm, occasional lag or slow data
              refresh, permissions complexity, cross-workspace sharing limits, and frustration when advanced automation
              or AI features are harder to govern than expected. Those pain points matter because they are exactly the
              kinds of issues that can cap enterprise rollouts after initial enthusiasm. Public materials also leave
              major retention and concentration questions unanswered. There is no disclosed NRR, GRR, churn, renewal
              rate, average contract term, top-customer concentration, or even a clean public split between free usage,
              self-serve paid adoption, and sales-led enterprise deployment. The best expansion evidence is
              indirect—multi-app usage, AI attach rates, partner services, and integration depth—so ClickUp looks strong
              on adoption and workflow embedding, but still under-disclosed on the economics that prove long-duration
              customer durability.
