  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments, channels, and adoption surfaces
        blocks:
          - type: paragraph
            body: >-
              ClickUp's customer footprint looks horizontal rather than niche. Its own partner and navigation pages
              market the product across classic departmental buyers such as project management, product development,
              operations, IT, marketing, HR, and sales, while also calling out company archetypes like startups,
              agencies, nonprofits, and education. That matters because the public proof surface is not just a list of
              logos: the use cases map to different buyer and user combinations. In some accounts the economic buyer is
              a PMO, operations, or marketing lead, but the day-to-day users expand into engineers, store-planning
              teams, student-services staff, agency project managers, and cross-functional contributors. Channel design
              reinforces that horizontal thesis. ClickUp is not relying only on direct in-app onboarding; it also
              exposes a partner directory with verified consultants and solution partners, plus marketplace and
              automation routes through Slack, Google Workspace, and Zapier. Those routes reduce switching friction
              because customers can start with notifications, task creation, forms, calendar sync, and support or sales
              workflows before attempting a full system migration. The public adoption signals are strong but mixed in
              denominator. ClickUp's customer pages still emphasize 5M+ teams, its homepage claims 85% of the Fortune
              500 and 3M+ agent-automated tasks, and a 2025 company announcement says the platform serves 20M+ users and
              sees 800k+ monthly signups. That combination suggests real scale and multi-app expansion, but it does not
              cleanly separate free users, paid seats, active teams, or enterprise accounts.
