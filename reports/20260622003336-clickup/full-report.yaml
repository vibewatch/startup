      - number: '8.2'
        title: Public and private comparable frame
        blocks:
          - type: paragraph
            body: >-
              The public comp frame is materially colder than the 2021 software market that set ClickUp’s last
              valuation. Multiples.vc shows June 2026 productivity software at roughly 2.8x NTM revenue and the broader
              horizontal SaaS median at roughly 2.1x, with the site explicitly describing wide dispersion driven by
              AI-era ‘creative destruction.’ Within the closest public collaboration set, Asana traded around 1.75x
              EV/sales on roughly $809 million of LTM revenue, monday.com around 1.62x on about $1.30 billion, and
              Atlassian about 3.41x on roughly $6.19 billion. Smartsheet’s 2024 take-private is more generous than
              public marks but still finite: $8.4 billion against management and analyst FY2026 revenue projections of
              $1.285-$1.318 billion implies roughly 6.4x-6.5x revenue. The private premium set is higher but disclosure
              quality also changes. Forbes reported that Notion’s December 2025 employee share sale discussed an $11
              billion valuation after the company passed $600 million ARR, while Linear’s June 2025 Series C priced it
              at $1.25 billion and its official post framed the company as profitable with more than 15,000 customers.
              Those references show that premium workflow assets can clear high marks, but only when the market believes
              either the scale, the quality, or both are exceptional. ClickUp’s public evidence today supports the scale
              part more clearly than the quality-of-earnings part.
