  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Priced reference and 2026 context
        blocks:
          - type: paragraph
            body: >-
              The last clean public price anchor for ClickUp is still the October 2021 Series C. PR Newswire said the
              company raised $400 million and took lifetime funding to $535 million, while TechCrunch reported that the
              round valued ClickUp at $4 billion post-money. That anchor matters because the later public record is
              operational rather than transactional. In September 2025, ClickUp said it had surpassed $300 million of
              ARR, served more than 20 million users, and was seeing stronger AI attach, larger sales-led deals, and
              faster signup velocity. In February 2026, the company again framed itself as a re-accelerating platform on
              a path to $1 billion-plus ARR, with new executive hires rather than a new financing announcement. The
              adverse 2026 signal is that TechRepublic reported a 22% staff cut under an AI-first ‘100x org’ thesis. Put
              together, the public story is not that ClickUp lacks momentum. It is that investors are still being asked
              to value a 2025-2026 operating narrative with a 2021 price tag. That makes the key question less ‘is there
              demand?’ and more ‘what price and cap-table terms sit behind the next dollar of exposure?’
            claimRefs:
