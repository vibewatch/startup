        - id: n2
          label: AI monetization
          detail: AI attach, larger deal sizes, and broader pricing stack support upside.
        - id: n3
          label: Public comp reset
          detail: 2026 public productivity multiples are far below 2021 software peaks.
        - id: n4
          label: No fresh mark
