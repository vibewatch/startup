      - number: '8.3'
        title: Implied math, scenarios, and recommendation
        blocks:
          - type: paragraph
            body: >-
              Using only supportable public anchors, the 2021 watermark already looks full. If the relevant revenue base
              is the company’s own more-than-$300 million ARR claim from September 2025, the old $4 billion mark implies
              about 13.3x ARR. By comparison, an Asana-like multiple implies about $525 million of enterprise value, a
              monday-like multiple about $486 million, an Atlassian-like multiple about $1.02 billion, and a
              Smartsheet-like sponsor multiple about $1.9 billion. The outlier that can defend a much richer price is
              Notion, where the reported $11 billion secondary on more than $600 million ARR points to roughly 18x ARR.
              That is the right framing for ClickUp: the company is not obviously overbuilt relative to the best private
              workflow assets, but the public evidence does not yet prove it deserves to be valued like them. The
              recommendation is therefore research-more, not avoid. ClickUp clearly has a real product, real users, real
              monetization breadth, and a credible growth story. The problem is price discipline. A base case that
              treats ClickUp as a scaled workflow asset but not a fully proven premium private AI comp supports roughly
              $1.5-$2.4 billion. A bull case above $4 billion requires materially higher ARR than the public floor and a
              premium multiple regime closer to Notion than to public work-management software.
