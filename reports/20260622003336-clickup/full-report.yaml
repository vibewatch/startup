  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              ClickUp's public monetization model is clear at the packaging layer even though it remains opaque at the
              financial-statement layer. The core workspace still follows classic seat-based SaaS logic: a free tier
              leads into an Unlimited plan at $7 per user per month billed yearly, a Business plan at $12 per user per
              month billed yearly, and a custom Enterprise tier for larger accounts. What materially changes the revenue
              model in 2025-2026 is that AI is not merely a feature flag inside those base tiers. ClickUp separately
              prices Brain AI at $9 per user per month and Everything AI at $28 per user per month, adds shared AI
              credit allowances to each plan, and sells additional AI Super Credits at $10 per 10,000 credits. The
              pricing page also says AI upgrades happen at the workspace level rather than per individual seat, which
              means the fully loaded contract value depends on whether a team standardizes on AI across the account.
              Official product and integration pages reinforce the same economic story: ClickUp is trying to convert a
              project-management seat into a broader operating system contract spanning chat, docs, search, agents, and
              connected apps. That should improve expansion economics if adoption holds, but public sources still do not
              disclose what share of ARR comes from base seats versus AI, enterprise services, or usage-driven credits.
