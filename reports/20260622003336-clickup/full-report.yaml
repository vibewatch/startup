      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              ClickUp's buyer map is heterogeneous. The product can start inside a PMO, operations, marketing, product,
              IT, or small-business founder workflow, but the user base inside the account usually expands beyond the
              initial buyer. The pricing model reinforces that pattern: plans are sold per user, but upgrades apply to
              the whole workspace, which makes the real payer a team lead, functional head, operations admin, or
              procurement owner rather than one individual power user.


              Public proof also shows that workflows differ by segment. Customer stories and third-party reviews
              highlight marketing planning, sales pipelines, SOP libraries, engineering and product visibility, agency
              project delivery, and broader organizational coordination. That means the evaluation criteria vary too.
              PMO and operations buyers care about portfolio views, resource management, and reporting. Marketing and
              agency teams emphasize speed, campaign coordination, and client visibility. Product and engineering teams
              care about dependencies, launch coordination, and integrations. IT, security, and enterprise admins
              increasingly care about governance, permissions, residency, and AI controls.


              Competitor positioning suggests ClickUp is not selling into a single budget owner. Asana and monday.com
              already speak to multiple departments, while Google Workspace and Slack turn collaboration into a
              suite-level budget decision. ClickUp can still win when a buyer wants one configurable system for work,
              docs, chat, and AI, but the adoption path depends on whether the company enters as a team-level point
              solution and expands, or as a centrally sanctioned work platform that replaces several tools at once.
