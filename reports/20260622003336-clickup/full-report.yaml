      - number: '4.3'
        title: Capital adequacy, cost structure, and benchmarks
        blocks:
          - type: paragraph
            body: >-
              Public funding history is visible, but current liquidity is not. The strongest priced-round anchor remains
              the October 2021 Series C: ClickUp announced a $400 million round at a $4 billion valuation, and both PR
              Newswire and TechCrunch said total funding reached roughly $535 million. Management said those proceeds
              would fund global expansion, hiring, and product development. More recent company-distributed material
              shifts from balance-sheet detail to aspiration, with 2026 leadership-hire announcements emphasizing a path
              to the “billion-dollar ARR club,” a fast-scaling self-serve engine, an enterprise-and-partnerships motion,
              and added accounting and audit leadership. That combination suggests operating ambition and some
              IPO-readiness work, but not actual cash-on-hand or runway. Because ClickUp is private, the best public
              lens on cost structure comes from comparable public vendors. Asana's 2026 Form 10-K says its revenue is
              primarily subscription revenue, with consumption-based AI and professional services still immaterial; its
              cost of revenue is driven by hosting, support, partner implementation, monitoring, payment processing, and
              amortized internal-use software; and it had over 180,000 paying customers globally. Asana's May 2026
              quarterly results add current operating benchmarks, including $205.1 million of quarterly revenue, 11.5%
              non-GAAP operating margin, 96% dollar-based net retention, and positive operating cash flow. Those figures
              do not describe ClickUp directly, but they show what a scaled collaborative-work SaaS model can disclose
              once it reaches public-company maturity.
