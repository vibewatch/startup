            title: ClickUp 对一个工作流平台而言具备异常广的具名证明
            body: >-
              公开客户表面不局限于软件 startups 或 PMO。ClickUp 展示了电信运营、fintech 发布、教育管理、代理交付、媒体出版，以及餐饮或零售运营中的活跃故事，这让采用命题比单纯 logo wall
              更可信。
            calloutType: strength
            claimRefs:
              - CU014
              - CU015
              - CU019
