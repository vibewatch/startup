  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 已定价参考与 2026 年语境
        blocks:
          - type: paragraph
            body: >-
              ClickUp 最后一个干净的公开价格锚点仍是 2021 年 10 月的 Series C。PR Newswire 称公司融资 $400M，累计融资达到 $535M；TechCrunch 报道该轮给
              ClickUp 的投后估值为 $4B。这个锚点重要，因为之后的公开记录更多是运营事件，而不是交易事件。2025 年 9 月，ClickUp 称 ARR 已超过 $300M，服务超过 20M 用户，并看到 AI
              附加率、更大的销售主导交易和注册速度增强。2026 年 2 月，公司再次把自己定位为重新加速的平台，路径指向 $1B+ ARR；新闻点是新的高管任命，而不是新融资。2026
              年的反向信号是，TechRepublic 报道公司在 AI-first “100x org” 论点下裁员 22%。合在一起，公开故事并不是 ClickUp 缺乏动能，而是投资人仍被要求用 2021 年价格标签为
              2025-2026 年运营叙事定价。因此，关键问题不再是“有没有需求？”，而是“下一美元敞口背后的价格和股权条款是什么？”
