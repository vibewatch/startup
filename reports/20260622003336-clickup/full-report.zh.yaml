  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 路径
      - 标价 / 单位
      - AI 包装
      - 企业模式 / 未知项
      - 买方含义
    rows:
      - - ClickUp
        - $7 Unlimited / $12 Business，每用户每月，按年计费；Enterprise 定制
        - Brain 每用户每月 $9，或 Everything AI $28 加额度
        - Enterprise 价格未披露；实际 AI 消耗取决于额度和使用量
        - 核心席位便宜，PM 界面很宽，但完整 AI 价值并未真正包含在基础价里
      - - Asana
        - $10.99 Starter / $24.99 Advanced，每用户每月，按年计费；Enterprise 定制
        - AI Studio Basic 额度捆入付费计划
        - Enterprise 和 Enterprise+ 定价未披露
        - 标价高于 ClickUp，但 AI 作为独立附加组件被拆出的痕迹不那么明显
      - - monday work management 工作管理
        - $9 Basic / $12 Standard / $19 Pro，每席位每月，按年计费；Enterprise 定制
        - AI 额度计量特定工具和 Agent
        - 40 名以上用户的准确价格和企业条款需要报价
        - 入门价格有竞争力，平台故事也宽，但真实 AI 经济性按使用量走
      - - Jira Cloud
        - 10 名用户以内免费；Standard $7.91；Premium $14.54，每用户每月；Enterprise 定制
        - Rovo 和 Agent 价值绑定付费云计划和更广的 Atlassian 采用
        - 最佳总成本取决于客户只买 Jira，还是买更大的 Atlassian 技术栈
        - 核心入门价激进，尤其适合软件团队
      - - Notion
        - 保留文本未聚焦 Business / Enterprise 计划价格；Custom Agents 每月 1,000 credits 收 $10
        - Business 和 Enterprise 包含核心 AI；自定义 Agent 消耗额度
        - Enterprise 席位价格需要销售上下文；额度消耗会随自动化强度大幅变化
        - 买方若想把 AI 编进文档 / 搜索 / 项目，会有吸引力，但使用经济性仍然关键
      - - Linear
        - 免费层；$10 Basic / $16 Business，每用户每月；Enterprise 仅定制年费
        - Agent 自动化、分诊智能和代码智能绑定更高层级
        - Enterprise 定价和支持直接谈判
        - 对工程组织价值强，对宽口径非技术部署相关性较低
      - - Google Workspace / Microsoft 365 Copilot
        - Workspace Standard $14、Plus $22，每用户每月；Copilot 接到套件计划上
        - AI 嵌入套件上下文里的邮件、文档、会议、搜索和 Agent
        - 真实成本取决于既有套件协议和附加组件条款
        - 捆绑型既有厂商会让独立工作流软件看起来只是增量，而非必需
