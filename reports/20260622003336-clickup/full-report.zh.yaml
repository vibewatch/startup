      - number: '7.2'
        title: 安全、隐私与依赖风险
        blocks:
          - type: paragraph
            body: >-
              与许多私有 SaaS 同行相比，ClickUp 的公开信任姿态更强，但受监管买家仍需要投入实质尽调。当前安全材料称，平台托管在 AWS，对传输中和静态数据加密，维持 SOC 和 ISO 认证，符合 PCI，并围绕
              AI 治理增加了 ISO 42001 定位。同一批公开材料还称，企业客户可以选择数据驻留，ClickUp 持续监控安全和可用性，AI
              提供商在合同上不得使用客户数据训练。这些都是正面因素，但法律和技术姿态并非没有成本。隐私政策确认，ClickUp
              会收集产品使用、设备、协作和搜索行为数据，可能进行跨境数据传输，并依赖第三方提供分析、错误跟踪和营销功能。DPA 和子处理商名录走得更远，列出了 AWS、OpenAI、Anthropic、Google
              Gemini、Microsoft Azure AI Foundry、Datadog、Nylas、Readme，以及横跨基础设施、AI、分析和集成的许多其他供应商。这种宽度给了 ClickUp
              能力，也增加了跨境审查、供应商管理和事故协同复杂度。合同条款还加上一条重要保留：ClickUp
              称服务可能中断，明确表示它不是备份服务，并把争议纳入加州法律下的有约束力个人仲裁。因此，运营信号不是非黑即白，而是混合的。抓取时状态页显示过去七天没有事故，但公开产品面已经覆盖 Brain、AI
              Notetaker、Chat、Search、Public API、Automations 和其他核心对象，任何重大故障都可能沿着远超简单任务管理器的范围传播。
