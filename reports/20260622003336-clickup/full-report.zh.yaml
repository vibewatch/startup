      - 公开数值 / 区间
      - 可信度
      - 重要性
      - 尽调请求
    rows:
      - - ARR 锚点
        - 2025 年 9 月前 ARR 达 $300M
        - 中
        - 为规模讨论提供锚点，但数值仍由公司发布，并非审计口径。
        - 索取月度 ARR 桥接、经审计收入，以及 ARR 与 GAAP 收入之间的调节表。
      - - AI 带来的交易规模提升
        - 纳入 AI 时，销售主导交易平均规模扩大 7x
        - 中
        - 表明 AI 可能同时撬动变现和销售效率。
        - 索取样本量、基准 ACV，以及提升来自因果作用还是客户结构变化。
      - - 新销售主导交易的 AI 附加
        - 超过 40% 的新销售主导交易包含 AI
        - 中
        - 说明 AI 已经是新客户组合中的重要部分。
        - 索取按客群划分的附加率、赢单率和首年后续约情况。
      - - 月度漏斗顶部信号
        - 每月 800,000+ 团队注册，YoY 145%
        - 中
        - 需求生成很强，但不等同于付费转化。
        - 索取免费转付费转化、激活率，以及企业销售与自助服务的拆分。
      - - 估算 ARR / 员工
