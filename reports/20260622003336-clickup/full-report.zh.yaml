    rows:
      - - ClickUp
        - 宽口径协同工作管理套件
        - 私营厂商；称 85% 的 Fortune 500 使用，且一个技术栈覆盖 100+ 产品
        - 从 SMB 到企业的跨职能团队
        - 覆盖 PM、文档、聊天、自动化和多模型 AI，广度高
        - 广度抬高推行和复杂度风险；AI 支出另成一层
      - - Asana
        - 协同工作管理 / 企业协同
        - 大型上市级平台，声称覆盖 85% 的 Fortune 100，并强调大型企业部署
        - 运营、市场、PMO 和企业项目团队
        - 工作流模型清晰，覆盖目标 / 项目组合、企业治理和内嵌 AI 额度
        - 在文档 / 聊天融合上，原生套件广度不及 ClickUp
      - - monday.com
        - AI 工作平台 / 工作操作系统
        - 250K+ 客户、4,547 个 ARR 超过 $50K 的客户、110% NDR、3,211 名员工
        - 覆盖工作管理、CRM、服务和开发的跨职能团队
        - 平台叙事宽，加上上市公司规模和有竞争力的标价
        - 可见页面内容中，部分定价和 AI 经济性仍不够透明
      - - Jira / Atlassian
        - 工程主导的工作系统
        - 350K+ 客户、85%+ 的 Fortune 500、55,913 个云 ARR >$10K 客户
        - 工程、IT、服务和大型企业
        - 工作流控制深、分发极广，Rovo 搜索 / Agent 与生态杠杆
        - 最强叙事通常要求客户更深买入 Atlassian 技术栈
      - - Notion
        - AI 工作区 / 知识工作融合
        - 100M+ 用户；覆盖 62% 的 Fortune 100；CNBC 报道年化收入 $500M、约 1,000 名员工
        - 知识密集团队、初创公司、产品、GTM，以及企业文档 / 搜索买方
        - 一个工作区覆盖文档、知识库、项目、企业搜索和 Agent
        - PMO 或工程治理深度不如 Jira 或 Asana 明确
      - - Linear
        - 垂直产品开发系统
        - 15,000 家公司；已盈利；$82M Series C，估值 $1.25B
        - 产品和工程组织
        - 围绕问题、项目、周期、请求和 AI 编码上下文，提供快速且取舍明确的工作流
        - 跨职能范围窄于 ClickUp 或 monday.com
      - - Google Workspace / Microsoft 365 Copilot
        - 套件捆绑替代品
        - 装机基础巨大的既有厂商，把 AI 接到既有套件合同上
        - 在文档、邮件、会议、搜索和 Agent 上标准化的企业
        - 捆绑能力、身份 / 控制层、内建搜索和 AI 上下文
        - 工作流控制围绕更宽的套件，而不是 PM 专用
      - - Smartsheet
        - 相邻的电子表格优先工作执行
        - 相邻上市厂商，提供付费成员计划和 AI 增强工作执行
        - PMO、运营和偏电子表格的规划人员
        - 熟悉的网格中心规划，带 Gantt、看板、日历、报告和自动化
        - AI 工作区叙事更弱，融合广度低于 ClickUp 或 Notion
