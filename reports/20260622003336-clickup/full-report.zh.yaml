  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与解决方案类别
        blocks:
          - type: paragraph
            body: >-
              ClickUp 至少在四条重叠赛道竞争，而不是一个干净同业组。第一条是 Asana 和 monday.com 等直接协作式工作管理对手，两者现在都把自己定位成面向跨职能工作的 AI-centric
              操作系统。第二条是以 Jira 和 Atlassian 更宽平台为代表的既有工程和服务工作基础设施，在这里，工作管理与软件交付、服务运营、搜索和 agent 编排绑定。第三条是 Notion
              引领的知识工作融合，它明确试图把文档、知识、项目和 agents 变成一个 AI 工作空间。第四条是 Linear
              等专业产品开发软件，它不试图替代所有办公室工作流，但仍能靠更快、更干净、更有主张的产品赢下高价值团队。


              替代品集合同样重要。Google Workspace 和 Microsoft 365 Copilot 可以把 AI 聊天、企业搜索、会议纪要、文件上下文和 agent
              功能打包进大多数企业已有的邮件、文档、存储和会议合同，从而吸收部分相同预算。Smartsheet 仍是面向电子表格导向 PMO 和运营团队的相邻替代方案：这些团队想要项目结构、仪表盘和自动化，但不一定接受
              ClickUp 更宽的「替代碎片化软件」命题。内部自建在这里不如开发者工具场景相关，但多栖使用是真实的：买方常保留既有套件负责通信和知识，只在协调痛点高的地方加一层单独工作流。


              关键矛盾在于，几乎每个认真竞争者现在都声称自己是统一工作层。ClickUp 说它可以替代 100+ 产品，并在其上加入 super agents。Asana 说 Work Graph 为人类-agent
              团队创建共享操作系统。monday.com 称自己是 AI work platform。Atlassian 称 Jira 和 Rovo 是 AI-powered system of work
              的一部分。Notion 说自己是面向重要工作的 AI workspace。Linear 说它给团队和 agents
              提供产品开发的共享上下文。由此可见，品类领导地位不会由口号决定，而会由各平台在哪些地方最深、最便宜、最容易部署，并且一旦采用最难被替换来决定。
