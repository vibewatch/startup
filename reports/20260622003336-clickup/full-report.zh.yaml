  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              ClickUp 的公开变现模式在包装层很清楚，尽管财务报表层仍不透明。核心工作空间仍遵循经典按席位 SaaS 逻辑：免费层导向按年计费、每用户每月 $7 的 Unlimited 套餐，按年计费、每用户每月 $12
              的 Business 套餐，以及面向更大账号的自定义 Enterprise 层。2025–2026 年真正改变收入模式的是，AI 不只是这些基础层里的功能开关。ClickUp 将 Brain AI
              单独定价为每用户每月 $9，将 Everything AI 定价为每用户每月 $28，在每个套餐加入共享 AI credit 额度，并以每 10,000 credits $10 销售额外 AI Super
              Credits。定价页还表示，AI 升级发生在工作空间层级，而不是个人席位层级，这意味着完全加载的合同价值取决于团队是否在账号内标准化使用 AI。官方产品和集成页面强化了同一经济故事：ClickUp
              正试图把一个项目管理席位转成覆盖聊天、文档、搜索、agents 和连接应用的更宽操作系统合同。若采用能守住，这应改善扩张经济性；但公开来源仍未披露 ARR 中有多少来自基础席位、AI、企业服务或按用量驱动的
              credits。
