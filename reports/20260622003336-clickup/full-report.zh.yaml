  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 状态
      - 规模指标
      - 估值 / 倍数
      - 与 ClickUp 的相关性
      - 局限
    rows:
      - - Asana
        - 上市
        - LTM 收入 $808.6M；18 万+ 付费客户
        - 1.75x EV/sales；约 $1.60B 市值
        - 最接近的上市工作管理参照，披露了留存和利润率数据。
        - 增长更慢，叙事溢价低于 ClickUp 当前 AI 故事。
      - - monday.com
        - 上市
        - LTM 收入 $1.30B；2026 年 Q1 收入同比 +24%
        - 1.62x EV/sales；2.41x P/S 倍数
        - 规模化工作流平台同业，显示市场愿为盈利执行和 AI 变现支付什么价格。
        - 2026 年 6 月股价走弱压低倍数，可能高估悲观程度。
      - - Atlassian
        - 上市
        - LTM 收入 $6.19B；FY26 Q2 云收入 $1.07B
        - 3.41x EV/sales；3.39x P/S 倍数
        - 更广协作平台参照，代表全球规模下的套件宽度。
        - 比 ClickUp 大得多、更多元，也更成熟。
      - - Smartsheet
        - 私有化 / 赞助方交易
        - FY2026 收入预测 $1.285B-$1.318B
        - $8.4B 价值；约 6.4x-6.5x 预测收入
        - 表明私募买家仍愿为有韧性的工作流资产支付高于公开市场的价格，并取得控制权。
        - 控制权溢价叠加上市公司财务披露，使其成为比 ClickUp 更干净的资产。
      - - Notion
        - 私有二级交易
        - '> $600M ARR'
        - 约 $11B 二级交易估值；约 18x ARR
        - 本组中最佳的私有协作 / AI 溢价基准。
        - 二级交易而非新一级融资，且 Notion 披露了更多规模和 AI 结构。
      - - Linear
        - 私有一级融资
        - 已盈利；15,000+ 家公司；收入未披露
        - $1.25B Series C 估值
        - 可作为高质量产品开发工作流软件的叙事可比。
        - 没有公开收入，因此更多用于定位，而不是直接倍数计算。
    notes: 本组覆盖 2026-06-22 获取的最有决策意义的公开与私有工作流参照；有意选择重点样本，而非穷尽所有可比。
