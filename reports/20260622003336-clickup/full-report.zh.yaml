chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品命题与总部信号
        blocks:
          - type: paragraph
            body: >-
              ClickUp 官方网页在战略身份上高度一致，尽管公司细节披露较少。首页、关于页面和招聘页面都把公司使命描述为最大化人类生产力，并把 ClickUp 定位成一个融合型工作空间：软件、AI
              和人可以在共享上下文中协同工作。产品故事已不只是基础项目管理应用：当前页面把任务、Docs、聊天、日历、工作流、Brain 和 Super Agents 串在一起，定价和产品页面也显示，公司有意把 AI
              作为核心层来变现，而不是可选功能。官方页面上的客户证明覆盖面很强，但定义精度较弱。ClickUp 声称拥有 5M+ 团队、覆盖 85% 的 Fortune 500 公司、代理自动化任务超过 3M，并引用 2025
              年 Forrester 研究的第三方 ROI 结果，但没有把团队级和用户级指标与清晰的当前付费客户数对齐。总部证据也略不均衡。私营公司追踪平台和隐私政策指向 San Diego，公司新闻稿明确称 ClickUp
              成立于 2017 年、总部位于 San Diego，但公开视频站没有给出包含完整运营地点细节的公司档案页。后续章节可以把 San Diego
              作为总部信号使用，但在管理层确认前，还不足以把它当作完全经审计的公司事实组。
