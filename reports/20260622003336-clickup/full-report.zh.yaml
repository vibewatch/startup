  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 假设
      - 估值逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 熊
        - ARR 仍接近公开的 $300M 下限，重组后增长放缓，投资人按公开协作软件可比公司给 ClickUp 标价。
        - 在 $300M 基础上用约 2x-4x，估值 $0.6B-$1.2B。
        - 支持质量下滑、AI 附加被证明噪音大，或新融资大幅下调故事定价。
        - 如果 2026 年客户指标出现执行损伤，则概率为中。
      - - 基准
        - ARR 仍高于 $300M 且增长真实，但买方把 ClickUp 承销为规模化工作流资产，而不是顶级私有 AI 溢价可比。
        - 使用高于公开市场、但低于 Notion 的倍数区间，估值 $1.5B-$2.4B。
        - 没有干净的当前价格，没有优先权栈，也尚未证明重置改善了经济性。
        - 从当前公开证据看，这是最高概率结果。
      - - 牛
        - ARR 明显高于公开下限，AI 扩张可持续，投资人接受类似最佳工作流 / AI 公司的私有市场溢价倍数。
        - 基于约 ~$350M-$400M ARR 假设，用约 9x-12x，估值 $3.2B-$4.8B。
        - 需要尚未公开的事实：更高 ARR、强留存，以及 AI-first 重组提高效率且未伤害客户的证据。
        - 除非 2026 年新披露显著改善，否则概率低。
    notes: 情景区间是明确假设下的案例，不是对当前未披露价格或任何当前市场出清交易的判断。
