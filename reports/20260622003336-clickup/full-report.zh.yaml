        - 假设企业扩张更慢、销售摩擦更高
      - - AI-first 人力重组损害支持或产品质量
        - 2026 年裁员后的 CSAT、工单积压、正常运行时间和路线图延误
        - 支持响应变差，或新功能带来明显更高的事故 / 缺陷率
        - 将 100x-org 假设视为执行负面，而非效率正面
      - - 融资叙事走弱
        - 最新 ARR / NRR / 烧钱证据与 2021 年估值锚的对比
        - 下一轮融资暗示估值持平或下调，且没有清晰的经营改善
        - 建模下轮融资下调或更长私有化周期，并收紧下行情景
      - - 可用性 / 韧性假设被证伪
        - Brain、API、自动化和核心任务界面的故障严重度
        - 重大事故造成数据丢失、导出失败或长时间工作流中断
        - 除非事后韧性控制明确加强，否则将运营风险上调为打破投资假设
    notes: 否决标准写成可监控的经营事件，投资决定才能绑定证据，而不是跟着叙事漂移。
