      - number: '4.2'
        title: 增长信号与公开效率代理指标
        blocks:
          - type: paragraph
            body: >-
              最强的公开增长锚点仍来自公司分发，而非审计。2025 年 9 月，ClickUp 称其年度经常性收入已超过 $300M，全球用户超过 20M。同一公告加入了与财务相关的线索：超过 50% 的客户使用 5
              个或更多融合应用，月度团队注册超过 800,000 且同比加速 145%，AI 使用量同比增长 800%，包含 AI 的销售主导交易平均规模大 7 倍，且超过 40% 的新销售主导交易附带
              AI。这组信号意味着扩张收入和 AI attach 正从实验性追加销售变成核心驱动因素。面向客户的证明页面还加入了额外但仍由公司声称的 ROI 框架，包括三年 384%
              ROI、少于六个月回本，以及一项引用第三方研究中的 92,400 小时节省。弱点在于，从需求到持久经济性的桥仍是私有的。GetLatka 发布低置信度估算：2024 年收入约 $278.5M，2025 年
              $300M，约 100,000 客户，约 1,500 名员工，以及 87 名承担 quota 的销售代表。这些估算可用于 ARR per employee 或 ARR per seller
              等方向性启发，但不能替代审计披露、队列留存或已实现 ACV 数据。
