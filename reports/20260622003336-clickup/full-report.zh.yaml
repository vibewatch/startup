      - number: '8.2'
        title: 公开与私有可比框架
        blocks:
          - type: paragraph
            body: >-
              与设定 ClickUp 上次估值的 2021 年软件市场相比，公开可比框架已经冷得多。Multiples.vc 显示，2026 年 6 月生产力软件约为 2.8x NTM 收入，更广泛的水平 SaaS 中位数约为
              2.1x；该网站明确把宽离散归因于 AI 时代的“creative destruction”。在最接近的公开协作公司组里，Asana 约以 1.75x EV/sales 交易，对应约 $809M LTM
              收入；monday.com 约 1.62x，对应约 $1.30B；Atlassian 约 3.41x，对应约 $6.19B。Smartsheet 2024 年私有化交易比公开市场标记更慷慨，但也有上限：$8.4B
              交易价格对应管理层和分析师 FY2026 收入预测 $1.285B-$1.318B，约为 6.4x-6.5x 收入。私有溢价组更高，但披露质量也变了。Forbes 报道，Notion 2025 年 12
              月员工股份出售在公司 ARR 超过 $600M 后讨论 $11B 估值；Linear 2025 年 6 月 Series C 定价 $1.25B，其官方文章称公司已盈利、客户超过 15,000
              家。这些参考说明，优质工作流资产可以拿到高估值，但前提是市场相信规模、质量或两者都异常出色。ClickUp 今天的公开证据对规模部分的支撑，比对盈利质量部分更清晰。
