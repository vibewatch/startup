            body: >-
              因此，财务判断是混合但可行动的。正面看，ClickUp 现在拥有宽而清晰的收入架构、超过 $300M ARR 的公开收入里程碑、AI 提升 attach
              和交易规模的明确信号，以及能把完全加载席位价值推高到基础工作空间标价之上的定价姿态。基准定价也显示，即使在企业自定义条款之前，ClickUp 的核心席位价格相对 Asana、Notion、Linear 和
              Microsoft 高端商业套餐仍显得激进。但反向论点真实存在。评论继续描述功能密度和上手负担，一条 G2 评论还特别要求更清晰的 AI-credit 可见性。更重要的是，TechRepublic 报道
              ClickUp 2026 年 5 月作为 AI-first「100x org」重组的一部分裁员
              22%，同时指出自主系统带来的生产率收益仍需证明。本章审阅的公开来源没有披露当前现金、月度烧钱、runway、毛利率、收入确认细节、实际折扣、净留存、客户集中度或任何已提款债务。投资人可以承销 ClickUp
