      - number: '1.3'
        title: 规模声称、2025–2026 里程碑与实时尽调风险
        blocks:
          - type: paragraph
            body: >-
              ClickUp 近期公开叙事是规模加速叠加强势 AI 重新定位。官方 2025 年材料称，公司 ARR 突破 $300M、用户超过 20M、每月新增 800,000 用户，且超过 40% 的新销售主导交易包含
              AI。同一组来源也显示，战略不是单纯换品牌：收购 Qatalog 加入了企业搜索和带权限感知的知识基础设施，收购 Codegen 和推出 Super Agents 则把公司推向更深的代理式执行，4.0/3.0
              过渡让所有用户到 2026 年 3 月必须进入融合工作空间。定价变化也支持同一论点：$9 的 Brain 层与 $28 的 Everything AI
              层被拆开。复杂点在于，一些规模指标彼此冲突或快速过时。Forbes 截至 2026 年 3 月列出 14M 用户和 1,000 名员工，而官方 2025 年秋季公告声称 20M
              用户，后续来源没有发布裁员后的清晰员工数。TechRepublic 报道 ClickUp 2026 年 5 月裁员 22%，同时 Evans 推动 AI-first 的「100x
              org」模式后，这种不确定性更重要。裁员并不能推翻增长故事，但提出了真实尽调问题：AI 主导的组织重构究竟会提升韧性和客户结果，还是只是在公司追逐 IPO 级增长时压缩人力。
