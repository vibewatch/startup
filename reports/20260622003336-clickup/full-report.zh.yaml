  - id: TV002
    title: 正方 / 反方投资论点
    columns:
      - 论点类型
      - 论点
      - 什么会改变判断
    rows:
      - - 正方
        - ClickUp 已跨过有意义的规模门槛，公开声称 ARR >$300M、用户 >20M，且 AI 附加信号强。
        - 经审计或董事会级别的 ARR 和续约数据，会让增长证据更可投资。
      - - 正方
        - 定价栈现在覆盖核心席位、AI 订阅和更广的工作流上下文，支撑溢价变现潜力。
        - 如果 AI 附加续约表现好并能扩大 ACV，就能支撑更高估值区间。
      - - 正方
        - Notion、Linear 等私有工作流龙头表明，只要资产质量清晰，优质协作资产可以维持较高估值。
        - 一笔干净的 2026 年二级或一级估值，并有强投资人支持，会让 ClickUp 更接近这一阵营。
      - - 反方
        - 唯一干净的公开估值锚是 2021 年 $4B Series C；按 2026 年公开生产力软件倍数看已经偏贵。
        - 明显更高的 2026 年 ARR，或显著低于 $4B 的当前价格，会削弱这一压制因素。
      - - 反方
        - 2026 年 5 月裁员 / 重置意味着，未来价值取决于 AI-first 重组能否跑通，同时不伤害客户质量。
        - 重置后的留存、支持和扩张指标，会告诉投资人重组是在增厚价值还是摧毁价值。
      - - 反方
        - 公开资料没有 cap table、清算优先权、利润率或债务包，外部投资人无法把企业价值故事转成真实股东回报。
        - 定价下行情景前，需要当前 cap table、债务明细和清算瀑布。
    notes: 争论对价格高度敏感：公司质量本身不足以证明 2021 年估值合理。
