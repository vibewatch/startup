  - id: TV005
    title: 打破投资假设和否决触发项表
    columns:
      - 触发项
      - 阈值
      - 如何传导到投资假设
      - 行动含义
    rows:
      - - 新融资重新定价公司
        - 2026 或 2027 年融资明显低于旧 $4B 水位
        - 确认 2021 年价格无法用当前证据支撑。
        - 按新估值重新承销；不要加仓旧叙事。
      - - 裁员后客户质量走弱
        - NRR 或总留存下滑，或 AI-first 重置后支持 / 实施指标恶化
        - 重组从效率假设变成商业风险假设。
        - 除非价格大幅重置，否则把案例推向回避。
      - - AI 附加不能持续
        - AI 纳入后抬高初始合同额，但未提升续约、毛利率或分群扩张
        - 打破基于 AI 变现深度的溢价倍数逻辑。
        - 压缩牛市情景，估值锚靠近公开市场中位数。
      - - ARR 进展停滞
        - 管理层无法展示从 >$300M ARR 走向其公开 $1B+ 目标的可信路径
        - 私有市场溢价叙事失去可信度。
        - 将建议维持在继续研究或更差。
      - - Cap table 压力显现
        - 优先权栈、债务或结构化条款明显压低新资金或普通股结果
        - 企业价值不再适合作为股东回报的简写。
        - 从完全摊薄和清算条款重建回报测算。
    notes: 每个触发项都能从尽调材料或未来融资事件中观察到，因此这份观察清单偏运营，而不是修辞。
    claimRefs:
