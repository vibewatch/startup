          - type: callout
            title: 公开客户强度更多体现在工作流价值，而不是耐久经济性
            body: 本章假设 ClickUp 的公开增长和大量案例确实反映客户牵引力，但不把它们视为续约耐久性、NRR 或客户集中度质量的证明，因为抓取到的公开来源没有披露这些指标。
