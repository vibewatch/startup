      - number: '3.3'
        title: 企业动作、集成与分发力量
        blocks:
          - type: paragraph
            body: >-
              企业竞争越来越关乎装机基础杠杆和信任姿态，而不只是功能清单。Atlassian 是最清晰的既有厂商威胁，因为它已经服务超过 350,000 客户，声称覆盖超过 85% 的 Fortune 500，并正用
              Jira、Rovo 和开放工具链集成，把 AI 活动拉进既有记录系统。monday.com 投资者材料展示了同样重要的一点：它不再只是自助式 workboard 供应商，而是一个平台，拥有超过 250,000
              客户、4,547 个 ARR 超过 $50,000 的账号，以及三位数净美元留存。Asana 企业页面强调部署规模、SAML、SCIM、审计日志、SIEM 连接和广泛集成覆盖。Notion
              现在把知识工作采用与零留存企业 AI 承诺和上升的企业使用绑定。Linear 虽然小得多，但正有意通过 SAML、SCIM、支持集成、迁移帮助和客户管理向上进入大客户。


              集成和连接搜索加深了同一压力。ClickUp 推广广泛集成，以及横跨 Google Drive、GitHub、Salesforce 等工具的连接 AI 上下文。Asana 在 Work Graph 之上强调
              MCP 和连接到 ChatGPT、Claude、Gemini 的 AI connectors。Atlassian 把 Rovo 定位成横跨 Atlassian 和第三方 SaaS 的搜索、聊天和 agent
              编排。Notion 销售企业搜索，以及 Slack 和 Google Drive 上下文。Linear 把产品工作流连接到 Slack、Teams、GitHub、Zendesk、Intercom 和
              Salesforce。Google Workspace 和 Microsoft 365 Copilot 一开始就拥有最强原生分发，因为身份、邮件、文件和会议层已经嵌入企业。买方因此不会孤立评估
              ClickUp；他们会评估它相对既有套件和工程合同是增量、替代，还是冗余。


              这种分发图景使多栖使用很可能出现。一家公司可能把 Microsoft 或 Google 作为通信标准，用 Atlassian 承载工程，同时仍购买 ClickUp 或 Asana
              做跨职能执行。这个现实削弱了任何纯粹的「一个应用替代一切」说法。ClickUp 仍能赢，但它通常靠比买方现有 stack 提供更好的整合经济性，或更好的跨职能日常易用性取胜，而不是假设既有厂商会消失。
