      - number: '1.2'
        title: 创始人、领导层厚度、资本历史与治理信号
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，ClickUp 仍由创始人带领，控制叙事依然集中。Zeb Evans 仍是 ClickUp 在融资、ARR 和 AI 公告中的清晰公共面孔，第三方来源也继续把 Alex Yurkowski
              标为联合创始人兼 CTO。创始人延续性有价值，因为 ClickUp 当前战略依赖一条连贯的长期产品弧线：用一个平台替代拼凑的职场工具，再在其上叠加 AI agents。对一家后期私有 SaaS
              公司而言，融资历史异常清楚。2021 年 10 月 Series C 得到公司和 TechCrunch 的充分交叉印证，融资额 $400M、估值 $4B，同一组来源把已披露累计融资锁定在 $535M。Latka
              等后续资料页报告了大致相同的估值和略高的累计融资额，但在本次审阅材料中，没有同等权威的后续定价轮取代 2021 年锚点。当前领导层证据指向一家公司正在为更大规模运营和潜在公开市场准备：2026 年 2 月公告突出
              6 名高管招聘或任命，任命 Gaurav Agarwal 为 COO，并加入 Mike Williams
              担任审计委员会主席。这是有意义的治理信号，但没有解决更深的透明度缺口。公开记录仍未披露完整董事会名单、委员会图谱、所有权拆分，或清晰的创始人和投资人控制结构，因此第 1
              章应保留创始人带动的势能和强资本支持，但不能假装治理披露已经成熟。
