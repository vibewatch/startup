    title: 客户
    sections:
      - number: '6.1'
        title: 细分、渠道与采用表面
        blocks:
          - type: paragraph
            body: >-
              ClickUp 的客户足迹看起来是横向的，而不是利基的。它自己的合作伙伴和导航页面面向项目管理、产品开发、运营、IT、营销、HR 和销售等经典部门买方推广产品，同时也点名
              startups、代理机构、非营利组织和教育等公司原型。这一点重要，因为公开证明表面不只是一串 logo：用例映射到不同买方和用户组合。在一些账号中，经济买方是
              PMO、运营或营销负责人，但日常用户会扩展到工程师、门店规划团队、学生服务人员、代理机构项目经理和跨职能贡献者。渠道设计强化了这一横向命题。ClickUp 不只依赖直接应用内
              onboarding；它还提供包含认证顾问和 solution partners 的合作伙伴目录，并通过 Slack、Google Workspace 和 Zapier 提供 marketplace
              和自动化路径。这些路径降低切换摩擦，因为客户可以先从通知、任务创建、表单、日历同步，以及支持或销售工作流开始，再尝试完整系统迁移。公开采用信号强，但分母混杂。ClickUp 客户页面仍强调 5M+
              团队，首页声称覆盖 85% 的 Fortune 500、agent 自动化任务 3M+，2025 年公司公告称平台服务 20M+ 用户、月注册
              800k+。这组数据说明规模和多应用扩张真实存在，但不能清楚拆分免费用户、付费席位、活跃团队或企业账号。
