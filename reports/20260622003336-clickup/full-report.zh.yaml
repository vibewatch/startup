  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 当前估值标记
        - 任何 2025-2026 年一级融资、要约收购、二级交易或 409A 支撑
        - 没有新估值，2021 年价格锚仍然过时。
        - CEO/CFO；调取最新融资材料和 409A 摘要。
      - - Cap table 和优先权
        - 完全摊薄所有权、清算栈、期权池和任何附函经济条款
        - 回报结果可能与名义企业价值大幅背离。
        - 财务 / 法务；审查 cap table 导出、章程和投资人权利文件。
      - - ARR 桥和收入质量
        - 月度 ARR 桥、logo 留存、NRR，以及分客群流失 / 扩张
        - 需要据此判断 ClickUp 配得上私有市场溢价，还是只能按公开可比倍数定价。
        - CFO/FP&A；获取董事会材料和分群分析包。
      - - 利润率与现金状况
        - 毛利率、烧钱、跑道，以及债务或结构化融资条款
        - 2026 年软件市场里，效率证据和增长同样重要。
        - CFO；审查管理账和债务明细。
      - - 重组后客户健康
        - 裁员后的支持 SLA、实施产能、CS 人员配置和企业续约数据
        - 验证 AI-first 重置是否在不伤害客户的前提下改善经济性。
        - COO/CS 负责人；调取 2026 年 5 月后的运营 KPI。
      - - AI 变现可持续性
        - Brain 和 AI 工作流的附加、续约、超额使用和模型成本数据
        - 区分真实溢价变现与发布期热度。
        - 产品 / CFO；审查 AI 分群经济性和供应商成本假设。
    notes: 这些问题是最低限度材料包，用来把 ClickUp 从情景估值讨论推进到真正可定价的承销决策。
