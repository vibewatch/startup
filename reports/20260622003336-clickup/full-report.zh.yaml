  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >-
              ClickUp 不属于一个干净的分析师盒子。它自己的页面把产品描述为融合型工作空间，将项目、聊天、文档、日历、工作流和 AI 组合成一个运营层；定价则清楚显示，公司同时变现核心协作席位和独立 AI
              stack。因此，最实用的边界应比经典项目管理软件更宽，但仍窄于整个协作软件宇宙。最接近的相邻标签包括协作式工作管理、工作管理、项目组合管理、团队协作和知识工作编排。


              竞争对手定位也支持这个更宽边界。Asana、monday.com、Jira、Notion 和 Smartsheet 都面向跨职能团队和多个部门营销，而不只面向 PMO。Google Workspace 和
              Slack 进一步扩展了替代品集合，因为它们把通信、文档、任务、搜索、工作流自动化和 AI 打包进宽套件，而这些套件已经控制了大量企业预算。换句话说，ClickUp 正在争夺组织工作、上下文以及越来越多
              agents 的记录系统层。


              因此，本章纳入的支出包括工作管理席位、项目和组合管理、与任务执行绑定的工作流自动化、支撑交付的嵌入式文档和聊天，以及卖进同一工作流预算的 AI 搜索或 agent 层。排除的支出包括纯
              CRM、纯通信、独立文件存储，或在不承担跨职能协调层角色时的狭窄开发者工具。这个区分很重要，因为边界越宽，自上而下的 TAM 看起来越大，与 ClickUp 实际包装的相关性也越弱。
