  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 商业与平台执行风险
        blocks:
          - type: paragraph
            body: >-
              ClickUp 的商业上行仍建立在“先覆盖宽度、再整合堆栈”的论点上，但同样的宽度也是首要风险。公司用极低摩擦入口获客：免费访问、$7 Unlimited 席位、$12 Business 席位，以及单独
              $9/用户的 Brain AI 层；但平台又把许多大客户在意的治理控制——SAML SSO、SCIM、审计日志、企业 API 用量、HIPAA 可用性、数据驻留——放在 Enterprise
              档。结果就是典型的扩张张力：客户可以低成本起步，但部署越深入，定价、控制和实施工作量越重要。公开帮助文档显示，自动化用量超过套餐限制后可能暂停；开发者文档显示，API
              吞吐量也会随套餐大幅变化。因此，当团队把更多工作流集中到 ClickUp 时，一体化价值主张可能转成吞吐量和治理瓶颈。独立评论面也强化了这一风险。G2 和 TrustRadius
              都显示，灵活性是真实的，但学习曲线、权限和性能投诉也同样存在；这些摩擦正是初期热情之后拖慢企业标准化的因素。竞争压力让问题更尖锐。Asana、Atlassian、Notion、Linear、Microsoft 和
              Google 都在相邻系统里营销代理、搜索、自动化或 AI 上下文；monday.com 已经把 AI 定位为基于额度的用量，而不是固定功能包。这意味着 ClickUp
              必须证明的不只是“足够宽”，而是“足够宽且不会比它试图替代的碎片化堆栈更难治理”。
