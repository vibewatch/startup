  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 观点
      - 支撑证据
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 真实规模已有证据，但当前价格证据和回报机制还没有。
        - 承销任何新入场前，先做更多尽调。
      - - 置信度
        - 中低
        - 收入和融资历史可见，但当前账面估值和 cap table 不可见。
        - 将判断视为证据敏感，而不是高确信度。
      - - 风险评级
        - 高
        - 2026 年 AI-first 重组给本就不透明的私营公司结构增加了执行离散度。
        - 要求更多下行保护或更多披露。
      - - 估值立场
        - 2021 年 $4B 水位显得偏紧
        - 该锚点基于公开的 >$300M ARR 下限约为 13.3x，高于当前公开生产力软件可比公司和 Smartsheet 私有化倍数。
        - 不要只因增长看起来可信，就假设旧估值仍然公允。
      - - 入场纪律
        - 除非出现溢价情景证据，否则偏好低于 $2.5B
        - 基准情景的公私可比估值大多低于 $4B，而牛市情景需要明显更强的 ARR 和优质指标。
        - 只有管理层能拿出更好的 2026 年 ARR、留存和利润率证据，才考虑向旧水位上探。
    notes: 本表把保留下来的证据转成 IC 风格结论；它并不是在声称 ClickUp 目前正以某个具体价格出售。
