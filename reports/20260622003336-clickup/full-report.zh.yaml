              - CU046
          - type: callout
            title: 独立评论反复指向复杂度和治理摩擦
            body: 让 ClickUp 有吸引力的灵活性，也拖慢了采用。公开评论反复提到上手设置压迫感、权限混乱、卡顿和工作流脆弱；这些问题会在初始上线后拖慢企业标准化。
            calloutType: risk
