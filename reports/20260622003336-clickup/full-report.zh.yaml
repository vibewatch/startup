      - number: '8.4'
        title: 入场纪律、尽调与否决触发器
        blocks:
          - type: paragraph
            body: >-
              最终尽调姿态不应过多纠结 ClickUp 能否继续增长，而应聚焦下一笔交易的条款是否足以补偿信息风险。核心缺口是当前估值证据、股权结构和优先权条款，以及 AI-first
              重置没有削弱留存、支持质量或毛利的证明。这也是为什么最重要的尽调问题都很实际，而不是理论化：当前二级或要约文件、董事会级 ARR 桥接表、净收入留存、毛利、烧钱和资金
              runway、裁员后的客户支持和流失数据，以及任何可能改变下行情景的债务或结构化融资工具。论点破裂触发器也可监测。如果新一轮明显低于旧的 $4B 标记；如果重组后留存或支持质量下滑；如果 AI
              附加不能转化为耐久续约经济性；或者管理层无法展示从超过 $300M ARR 到其公开营销的十亿美元目标之间的清晰路径，溢价叙事会快速压缩。反过来，如果 ClickUp 能展示更强的 2026 年
              ARR、稳定客户质量和干净股权结构，案例可以根据价格从继续研究转向跟踪或买入。
