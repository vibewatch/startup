  evidenceGaps:
  - type: missing-source
    severity: material
    topic: api-roadmap
    missingEvidence: A dated public roadmap or release note set that explains when the remaining v2 surfaces will migrate to v3 and what feature areas stay excluded.
    whyItMatters: Developers and buyers cannot fully judge integration stability without knowing whether the mixed v2/v3 surface is temporary or structural.
    diligencePath: Request current developer roadmap, changelog, and any migration deprecation schedule from product or platform engineering leadership.
    relatedQuestionRefs:
    - QE013
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: ai-governance
    missingEvidence: Detailed module-by-module AI governance evidence, including provider list, retention logs, incident handling, eval process, and hallucination or permission-failure controls.
    whyItMatters: ISO 42001 and no-training commitments are useful, but they do not fully answer enterprise diligence on how Brain and agents behave in production.
    diligencePath: Request AI security FAQ, model-governance packet, retention architecture, and red-team or evaluation summaries under NDA.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: stale
    severity: minor
    topic: reliability-history
    missingEvidence: Longer-horizon uptime, incident-frequency, and per-component SLA evidence beyond the public seven-day snapshot.
    whyItMatters: A converged platform increases blast radius when shared services fail, so short-window status visibility is not enough for underwriting reliability risk.
    diligencePath: Request 12-month incident summaries, major outage postmortems, and contractual SLA terms for enterprise buyers.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE004
  - type: conflicting-data
    severity: material
    topic: permissions-and-sharing
    missingEvidence: Product telemetry or release notes showing whether permissions confusion, cross-workspace sharing limits, and automation brittleness are shrinking in live customer cohorts.
    whyItMatters: These frictions directly affect rollout quality, admin burden, and whether platform breadth becomes an adoption advantage or a complexity tax.
    diligencePath: Ask for recent enterprise support themes, feature-usage data, and product roadmap notes specifically tied to permissions, shared views, workspace boundaries, and automation stability.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE002
