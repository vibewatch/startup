- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope
  - Public implication
  - Gap / caveat
  rows:
  - - SOC reporting
    - Present
    - SOC 1 Type 2, SOC 2 Type 2, SOC 3
    - Supports enterprise security review posture
    - Latest report dates are not published inline on the main security page
  - - ISO security/privacy stack
    - Present
    - ISO 27001, 27017, 27018, 27701
    - Shows formal controls for security and privacy management
    - Public site does not expose audit exceptions or control maturity detail
  - - ISO 42001 for AI
    - Present
    - AI management-system certification
    - Improves trust narrative around AI governance
    - Does not by itself disclose model-routing, hallucination controls, or product-specific safety metrics
  - - Data residency
    - Present
    - Enterprise customers can choose US, Europe, or Asia Pacific regions
    - Important for multinational deployments
    - No public architecture detail on residency boundaries for every module
  - - Encryption and hosting
    - Present
    - AWS hosting, TLS 1.2 in transit, AES-256 at rest
    - Baseline cloud-security story is enterprise-ready
    - No public detail on key-management design beyond high-level statements
  - - AI data-handling commitments
    - Present
    - Third-party AI providers cannot train on or store customer data
    - Addresses a common buyer objection for in-product AI
    - Public evidence does not fully explain provider mix, retention logs, or model-by-model controls
  - - Operational visibility
    - Present
    - Status page components include Brain, API, Docs, Integrations, and Whiteboards
    - Signals module-level monitoring for a converged product
    - Public status history window is short and does not reveal long-run SLA performance
  notes: Status reflects only public-facing trust evidence; buyer diligence should still request current reports, pen-test summaries, and module-specific residency details.
