tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module
  - Primary user / job
  - Public maturity signal
  - Differentiation / connection
  - Diligence gap
  rows:
  - - Tasks
    - Execution owners and project managers
    - Core and deeply marketed
    - Tasks connect to docs, chat, dashboards, goals, and AI actions
    - Need clearer public evidence on large-scale performance limits
  - - Docs
    - Knowledge authors and cross-functional teams
    - Core and integrated
    - Version history, comments-to-task conversion, searchable Docs Hub
    - No public evidence on enterprise knowledge-governance edge cases
  - - Chat
    - Teams coordinating day-to-day work
    - Newer but first-party and feature-rich
    - Channels, DMs, FollowUps, SyncUps, AI task creation, context links to work
    - Commercial packaging and long-run adoption are still evolving
  - - Dashboards
    - Leaders, PMO, and operators
    - Core and action-oriented
    - Users can update work directly from dashboards instead of exporting to BI
    - Need more public proof on very large-workspace performance
  - - Whiteboards
    - Planning, brainstorming, and design-heavy teams
    - Core connected module
    - Turns whiteboard ideas into tasks, connects with docs and chats, export to PDF
    - No public benchmark on usage depth versus specialist whiteboarding tools
  - - Brain / Agents
    - Knowledge workers and coordinators
    - Aggressively expanding
    - Company-specific AI, side-by-side humans and agents, AI summaries and workflow actions
    - Programmatic Brain access remains thin in public developer sources
  - - AI Notetaker
    - Meeting-heavy managers and operators
    - Live add-on / bundle feature
    - Joins Zoom, Teams, and Meet; outputs notes, transcript, recording, and next steps into ClickUp objects
    - Needs stronger public evidence on cost, quality, and admin controls at scale
  - - Forms
    - Intake owners and operations teams
    - Core connected module
    - Routes responses into tasks, workflows, AI insights, and Forms Hub visibility
    - Need better public evidence on analytics depth versus specialist form tools
  notes: Public-module snapshot only; maturity reflects visible product evidence on 2026-06-22 rather than internal adoption or attach-rate data.
