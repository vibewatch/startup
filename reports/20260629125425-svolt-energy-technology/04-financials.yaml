- id: expansion-and-retrenchment
  title: Capacity Expansion, Thailand Traction, and Europe Retrenchment
  body: 'The strongest public evidence on SVOLT''s financial posture comes from where it chose to keep spending and where it pulled back. Official and partner materials said 2021 financing would support more than 200 GWh of capacity by 2025 and build out multiple Chinese and overseas sites. Thailand appears to have been the lighter-capex overseas path: EqualOcean described a roughly USD 30 million investment, official SVOLT releases showed production and bulk deliveries beginning in 2024, and Gasgoo later reported the Thailand JV had produced its 10,000th pack with a 99.9 percent yield rate. Gasgoo also said overseas shipments reached 1.66 GWh and 39 percent of total shipments in January-February 2026, implying that export traction continued even after Europe was cut back.


    Europe, by contrast, is the clearest adverse financing signal. Multiple outlets reported the planned Saarland plant at 24 GWh and about EUR 2 billion of investment, plus a 16 GWh Brandenburg cell plant targeted for 2025 production. SVOLT then confirmed it would terminate its European company and German subsidiary effective 2025-01-31. CnEVPost, citing Caixin-sourced reporting, said the two European projects would have required roughly RMB 30 billion and that SVOLT first had to solve the money problem. That sequence matters more than the headline geography shift: it suggests the company prioritized lower-ticket Thailand execution and current exports while abandoning the capital-heaviest overseas projects once public-market financing disappeared.'
