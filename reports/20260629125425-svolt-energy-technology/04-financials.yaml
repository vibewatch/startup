  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized ASPs, discounting terms, warranty accruals, and gross margins by packs, modules, cells, and energy-storage systems.
    whyItMatters: Without product-level pricing and gross margin data, revenue quality and contribution margin cannot be underwritten even though shipment scale is visible.
    diligencePath: Request the 2024 and 2025 management accounts by product family plus the top ten OEM contract pricing schedules.
    relatedQuestionRefs:
    - QI004
    - QI024
    relatedTableRefs:
    - TI002
    - TI003
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, OEM design-win cycle length, payback period, channel economics, and customer-acquisition cost by platform.
    whyItMatters: Hardware revenue can grow while destroying value if program win costs, tooling support, and commercial concessions are not visible.
    diligencePath: Request OEM pipeline reports, bid-to-award conversion data, and account-level sales and engineering support costs.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs:
    - TI003
  - type: stale
    severity: material
    topic: post-2022-liquidity
    missingEvidence: Cash, restricted cash, monthly burn, net debt, and runway metrics after the 2022-06 balance sheet date.
    whyItMatters: The last directly accessible primary financial snapshot predates the IPO withdrawal, Europe retrenchment, and 2025-2026 export push, so current liquidity cannot be inferred safely.
    diligencePath: Request audited 2023-2025 statements, latest monthly cash bridge, and bank-facility schedule.
    relatedQuestionRefs:
    - QI019
    - QI023
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: project-finance
    missingEvidence: Any subsidies, project-finance debt, bank facilities, or replacement equity package supporting Thailand, domestic expansion, or any revived overseas capacity plan.
    whyItMatters: After the IPO withdrawal and Europe cancellations, the capital stack behind further expansion is central to solvency and dilution risk.
    diligencePath: Request signed term sheets, subsidy letters, and project-finance documentation for each major plant program.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: profitability-waterfall
    missingEvidence: Plant-level contribution margin, depreciation burden, and warranty or service costs by program.
    whyItMatters: Public shipment and revenue growth do not establish profitability unless fixed-cost absorption and after-sales liabilities are visible.
    diligencePath: Request plant P&Ls for Changzhou and Thailand plus warranty reserve methodology.
    relatedQuestionRefs:
    - QI004
    - QI024
    relatedTableRefs:
    - TI003
