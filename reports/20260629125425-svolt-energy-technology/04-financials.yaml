- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing Private Metric
  - Impact on Underwrite
  - Current Public Proxy
  - Why the Proxy Fails
  - Exact Diligence Path
  rows:
  - - 2023-2025 audited income statements
    - Cannot judge whether losses narrowed after the IPO withdrawal
    - 2019-1H22 prospectus figures
    - Dataset stops before Europe cancellations and 2026 export mix
    - Request audited 2023-2025 statutory and management accounts
  - - Product-level realized ASP and gross margin
    - Cannot test revenue quality or price-down risk by product family
    - 1H22 revenue mix only
    - Mix does not reveal pricing, discounting, or margin
    - Request ASP, standard cost, and gross margin by cells/modules/packs/ESS
  - - Current cash, net debt, and runway
    - Cannot judge solvency or dilution urgency
    - 2022-06 cash and short-term borrowings
    - Too stale to assess post-withdrawal liquidity
    - Request latest monthly treasury report and debt schedule
  - - Project finance, subsidies, or bank facilities for expansion
    - Cannot assess whether growth is equity-funded or leveraged
    - Prospectus fallback language plus Thailand and Europe news
    - No signed post-withdrawal funding documents are public
    - Request term sheets, subsidy letters, and facility agreements
  - - Customer profitability by OEM program
    - Cannot see whether non-GWM growth is accretive
    - Customer names and order headlines only
    - Names do not show margin, returns, or support cost
    - Request top-10 customer P&Ls and engineering support cost by account
  - - Warranty, service, and quality cost burden
    - Cannot translate shipment scale into free-cash-flow quality
    - Thailand yield milestone and shipment data
    - Yield milestones do not reveal reserve or recall economics
    - Request warranty reserve methodology and field-failure data by platform
  notes: These gaps are the minimum private-data requests required to move from a descriptive chapter to an underwriteable financial model.
