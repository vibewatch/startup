company:
  name: SVOLT Energy Technology
chapter:
  number: 4
  title: Financials
  summary: 'SVOLT''s last directly accessible primary financials remain frozen at its November 2022 STAR Market prospectus: revenue rose from RMB 929.2 million in 2019 to RMB 4.474 billion in 2021, yet net losses widened to RMB 1.154 billion in 2021 and the company still earmarked RMB 2 billion of the planned RMB 15 billion IPO for working capital. The December 2023 IPO withdrawal, paired with 2024 cancellations of the capital-heavy German plants, points to a company with real shipment traction but unresolved profitability, heavy capex needs, and insufficient public disclosure to underwrite current burn or runway.'
sections:
- id: revenue-model
  title: Revenue Model and Disclosed Performance
  body: 'SVOLT''s public revenue model is industrial and program-based rather than subscription-like. The prospectus and company profile describe monetization across battery cells, modules, packs, and energy-storage systems, with revenue recognized through OEM and project shipments. The cleanest disclosed mix comes from 1H22, when packs generated RMB 2.09 billion of revenue or 60 percent of the total, modules RMB 700 million or 20 percent, and cells RMB 634 million or 18.22 percent. That mix matters because it shows SVOLT already operated as a scaled supplier of assembled battery systems instead of a pure materials or licensing story.


    The top-line trajectory was real but incomplete as an underwriting basis. Accessible prospectus-era sources reported revenue rising from RMB 929.2 million in 2019 to RMB 1.736 billion in 2020, RMB 4.474 billion in 2021, and RMB 3.738 billion in 1H22, while official funding materials separately said SVOLT had won 25 sales points with mainstream automakers and a RMB 16 billion Stellantis order. However, none of the accessible sources disclose realized ASPs, discount structures, or product-level gross margins. Public evidence therefore proves commercialization and shipment scale, but not revenue quality by platform or whether newer export volumes carry better economics than the earlier Great Wall-heavy domestic book.'
