  topStrengths:
    - 'SVOLT is not a paper startup: public evidence shows scaled manufacturing, Thailand localization, and real shipment activity across EV batteries and energy storage.'
    - The company raised unusually large private rounds in 2021 and still carries a live unicorn mark, indicating strong historical access to strategic and financial capital.
    - Product development appears differentiated, especially in short-blade fast-charging batteries, LMFP/LFP packaging, and a 2026 semi-solid roadmap.
    - Overseas shipments and customer-development signals show the business is trying to diversify beyond a purely Great Wall-linked domestic story.
  topRisks:
    - Public financial transparency is stale; the best accessible prospectus-style disclosures stop at 1H22, leaving current margins, cash burn, and debt capacity unclear.
    - Great Wall concentration has improved but remains structurally important, and public evidence still shows heavy related-party exposure in the last disclosed financial period.
    - The Europe manufacturing retrenchment after the IPO withdrawal is a material signal that capital intensity and international execution risk are real.
    - The current RMB 62 billion / roughly US$7.2 billion headline valuation looks rich relative to stale revenue evidence and public battery-peer multiples.
    - Battery-sector price wars, tariff exposure, raw-material volatility, and technology commercialization risk can all compress value before a new listing or financing event resets the mark.
  unresolvedGaps:
    - No refreshed audited or prospectus-style financial statements after 1H22 were found in the accessible public corpus.
    - No public current cap-table, preference-stack, or exact latest-round terms were available to test what the headline valuation means economically.
    - Public customer evidence is uneven outside Great Wall and Thailand programs; several cited international OEM relationships remain partly aspirational or indirectly corroborated.
    - Current headcount, exact global plant utilization, and post-Europe-exit capital allocation still require management confirmation.
disclaimer: >-
  This report is an AI-assisted diligence summary based on public information as of 2026-06-29 and is not investment advice. SVOLT's operating scale is real, but key underwriting variables — especially current audited financials, contract economics, and capital-stack terms — still require direct management diligence before capital is committed.
