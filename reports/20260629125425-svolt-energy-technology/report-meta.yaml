companyProfile:
  summary: >-
    SVOLT Energy Technology is a Changzhou-headquartered Chinese battery manufacturer that traces its industrial roots to Great Wall Motor's internal battery project and has operated independently since 2018. The company sells EV battery cells, modules, and packs alongside stationary energy-storage systems, and it has built meaningful operating scale with 14 listed production sites, a Thailand manufacturing foothold, and an active roadmap spanning short-blade LFP/LMFP products, semi-solid batteries, and utility-scale ESS. Public evidence supports real commercialization and heavyweight financing, but it also shows an aborted STAR Market IPO, retrenched Europe factory plans, ongoing customer concentration risk, and incomplete current financial disclosure.
  foundedDate: '2018-01-01'
  foundingLocation: Jintan District, Changzhou, Jiangsu, China
  headquarters: Jintan District, Changzhou, Jiangsu, China
  productSummary: >-
    Automotive battery cells, modules, and packs; short-blade LFP/LMFP and ternary products; semi-solid battery roadmap; and residential through utility-scale energy-storage systems.
  customerFocus: >-
    Chinese and international automakers, battery-pack and module programs, and energy-storage buyers, with Great Wall-related demand still the clearest historical anchor.
  businessModel: >-
    Capital-intensive manufacturing model that monetizes battery and storage hardware shipments, supported by localization projects, OEM program wins, and adjacent energy-storage expansion.
  stage: Late-stage private battery manufacturer
  fundingStatus: >-
    Publicly disclosed financing exceeded RMB 20 billion before the withdrawn 2022 STAR Market IPO, with major 2021 Series A, B, and B+ rounds and a current headline unicorn mark of roughly RMB 62 billion, but no clean new priced round or current term-sheet disclosure is public.
