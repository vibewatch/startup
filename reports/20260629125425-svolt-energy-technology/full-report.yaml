  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Decision flow from the observable unicorn mark through disclosure and comparable-multiple tests to the final
      research-more / stretched call.
    data:
      nodes:
        - id: headline_mark
          label: Headline private mark
          description: Hurun/Changzhou-style anchor of roughly RMB 62bn (~US$7.2bn).
        - id: latest_scale
          label: Latest public scale proxy
          description: Public evidence points to 2022 revenue around CNY 10bn, but without refreshed audited statements.
        - id: comp_test
          label: Public comp test
          description: Listed battery peers span about 1.0x to 4.2x sales, median ~2.23x.
        - id: transparency_test
          label: Transparency test
          description: No current audited financials, clean current round terms, or disclosed preference stack.
        - id: downside_risks
          label: Downside overlays
          description: Europe retreat, financing risk, and unverified current profitability increase required discount.
        - id: recommendation
          label: Current call
          description: Research-more; high risk; valuation stance stretched at the current mark.
      edges:
        - from: headline_mark
          to: latest_scale
        - from: latest_scale
          to: comp_test
        - from: comp_test
          to: transparency_test
        - from: transparency_test
          to: downside_risks
        - from: downside_risks
          to: recommendation
    approximationNotes: >-
      The flow is a valuation decision architecture, not a mechanistic scoring model; each gate tightens the discount
      applied to the headline mark.
    claimRefs:
      - CV006
      - CV023
      - CV026
      - CV027
      - CV036
      - CV037
      - CV038
      - CV039
