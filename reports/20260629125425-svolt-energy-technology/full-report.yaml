  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and share stack
        blocks:
          - type: paragraph
            body: >-
              SVOLT competes in a brutally stratified battery market. At the top sit CATL and BYD, which together
              controlled more than half of global EV battery installations in 2025 and therefore set the price,
              qualification and capital-investment tempo for the industry. Below them is a crowded Chinese mid-tier led
              by CALB, Gotion, EVE, REPT and Sunwoda, plus Korean incumbents such as LG Energy Solution, SK On and
              Samsung SDI that still matter disproportionately outside China. Europe contributes aspirants such as
              Northvolt, but its startup path remains capex heavy and execution sensitive. Against that backdrop, SVOLT
              is not a generic “top-10 battery champion”; it is a second-tier challenger whose global share is still
              small, whose China share sits below several domestic rivals, and whose path to share gains depends on
              taking focused programs rather than winning the market wholesale. That market structure punishes every
              execution miss.
