  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: >-
      IC-ready scoring of SVOLT at the current mark, emphasizing the gap between strategic relevance and investable
      disclosure quality.
    data:
      items:
        - label: Market position
          score: 7/10
          note: Still a recognized Chinese battery unicorn with shipment traction and overseas presence.
        - label: Technology / product momentum
          score: 6/10
          note: Semi-solid and product updates support upside, but monetization quality is still unproven publicly.
        - label: Financing access
          score: 6/10
          note: Historical fundraising was strong, but the failed IPO and unknown current terms cap confidence.
        - label: Disclosure quality
          score: 3/10
          note: Latest accessible audited-style financial disclosure stops at 1H22.
        - label: Profitability evidence
          score: 2/10
          note: Losses are visible historically, but current margin and cash-generation status are not.
        - label: Valuation discipline
          score: 3/10
          note: Current mark looks rich relative to listed battery peers on the last visible revenue proxy.
        - label: Exit readiness
          score: 4/10
          note: Hong Kong remains possible, but no filed document currently closes the diligence gap.
        - label: Evidence quality
          score: 4/10
          note: Mark credibility is better than economics credibility; too much still depends on secondary sources.
    approximationNotes: Scores are committee shorthand reflecting valuation support, not operational quality in isolation.
    claimRefs:
      - CV014
      - CV016
      - CV032
      - CV036
      - CV037
      - CV038
      - CV039
      - CV042
