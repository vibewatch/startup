  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Observable pricing anchors and why the mark is real but imperfect
        blocks:
          - type: paragraph
            body: >-
              The strongest public valuation facts for SVOLT are sequence markers rather than clean price-discovery
              events. EqualOcean and Yicai both said the company had already raised more than RMB 20 billion privately
              and reached about RMB 46 billion of post-money valuation before the STAR Market filing. CnEVPost then
              translated the November 2022 draft prospectus into a simple IPO math point: SVOLT planned to sell 25% of
              the company for RMB 15 billion, implying a target valuation of about RMB 60 billion. After the Shanghai
              process was withdrawn, Changzhou's municipal Hurun recap still placed SVOLT at RMB 62 billion, keeping the
              unicorn label alive even though no fresh public round terms were disclosed. That is enough to say the mark
              is not invented. It is not enough to say the mark is clean. The 2022-2023 public record shows an aborted
              IPO, a possible Hong Kong pivot, and generic references to new financing rounds, but no post-2021 priced
              private round with disclosed dilution, preference stack, or investor protections. In valuation terms, the
              headline anchor exists, but the capital-stack quality behind it remains materially opaque.
