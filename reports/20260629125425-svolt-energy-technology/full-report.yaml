  - id: TV005
    title: Valuation anchor bridge table
    columns:
      - Anchor
      - Public value / status
      - Why it matters
      - What it says about valuation quality
    rows:
      - - Pre-filing private-round anchor
        - ~RMB 46bn post-money after cumulative financing >RMB20bn
        - Best disclosed private financing anchor before the IPO push.
        - Real but dated; still a stronger price signal than index-style rankings.
      - - 2022 STAR Market aspiration
        - RMB 15bn raise for 25% stake implied ~RMB 60bn valuation
        - Shows where management and sponsors wanted the public market to clear.
        - Not realized, so it is an asking price, not a market-cleared price.
      - - 2023 IPO withdrawal
        - Shanghai plan terminated; company explored other financing and possible HK path
        - Important negative signal on financing conditions.
        - Raises the discount rate because the cleanest public financing bridge disappeared.
      - - Hurun / Changzhou unicorn mark
        - RMB 62bn (~US$7.2bn) private-market label
        - Current headline valuation reference most often cited publicly.
        - Credible as a ranking mark, but not accompanied by round terms or audited updates.
      - - 2026 public-evidence state
        - No disclosed new priced round or current audited financial package in hand
        - Shows why the valuation debate is mostly comparative and scenario-based.
        - Headline valuation remains easier to cite than to underwrite.
    notes: >-
      This bridge separates observable price labels from true price-discovery events; the distinction drives the chapter
      conclusion.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
