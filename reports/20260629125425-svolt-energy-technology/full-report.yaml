      - number: '4.5'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              SVOLT's revenue quality is better than a pre-revenue battery aspirant because the public record shows real
              shipment scale, a disclosed product mix, anchor customers, and functioning overseas production in
              Thailand. But the margin path remains speculative because no public source here discloses realized
              pricing, gross margins, warranty cost, or plant-level profitability by packs, modules, cells, or
              energy-storage systems. Revenue growth before the IPO withdrawal was accompanied by widening losses, high
              related-party concentration, and large ongoing asset buildout, which is a classic sign that manufacturing
              scale had not yet matured into durable earnings power.


              The most important underwriting blocker is staleness. The latest directly accessible primary filing ends
              at 2022-06, before the December 2023 IPO withdrawal, before the 2024 German cancellations, and before the
              2026 export mix cited by Gasgoo. That means current cash, monthly burn, runway, and replacement financing
              are all evidence gaps rather than investable facts. The prudent financial verdict is therefore mixed:
              SVOLT has proven it can raise capital and ship product, but the post-IPO-withdrawal capital stack and
              current profitability cannot be underwritten without refreshed audited statements, plant-level margin
              data, and signed financing documents for any new capacity wave.
