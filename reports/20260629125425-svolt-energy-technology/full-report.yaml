      - number: '2.4'
        title: Demand drivers, policy, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The biggest volume driver remains EV demand growth, with IEA expecting global EV battery deployment to
              approach 3 TWh by 2030 under both current-policies and stated-policies lenses. At the same time, the
              highest-growth adjacency is stationary storage, where independent analysts expect annual additions to
              continue rising from the 2025 record as grids need more energy shifting, renewable integration,
              EV-charging support, and data-center flexibility. However, the adoption path is constrained by regional
              policy and execution frictions. Europe is a weaker near-term SAM for SVOLT than the headline market size
              suggests because the company canceled its German factory plans after weak EV demand and project delays,
              while the EU still maintains anti-subsidy duties on Chinese BEVs and only offered a structured
              price-undertaking route in 2026. The United States remains even harder for China-linked supply chains
              because EV tax-credit rules already favored local assembly and sourcing, and vehicles acquired after
              September 30, 2025 are no longer eligible for the clean-vehicle credit. For ESS, the friction shifts from
              tax-credit qualification to grid-connection delays, permitting, and supply-chain-security scrutiny around
              foreign-manufactured components.
