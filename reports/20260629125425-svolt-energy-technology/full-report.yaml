      - number: '7.5'
        title: Mitigations, Monitoring, and Downside Scenarios
        blocks:
          - type: paragraph
            body: >-
              SVOLT still has a recoverable path, but it is narrow and heavily milestone-driven. The company does not
              need a perfect macro backdrop; global demand is still growing and the export business has genuine proof
              points in Thailand, Europe-facing OEM supply, and energy-dense product development. But several conditions
              must hold simultaneously for that upside to be investable. First, financing opacity has to end: refreshed
              audited financials, signed capital commitments, or a credible capital-markets route must replace the
              withdrawn STAR process. Second, the company has to show that overseas growth is not simply a temporary
              release valve from Chinese price wars, which means proving a more durable customer mix and a route around
              EU and US trade friction. Third, the semi-solid roadmap has to move from announced timelines to actual
              series output and customer SOPs without a warranty shock.


              If those conditions fail, the downside is not that EV batteries stop selling. The downside is a smaller
              supplier getting squeezed between fast-growing global demand and an even faster rise in capital needs,
              policy friction, and top-tier competitor scale. The prudent underwriting stance is therefore to watch
              concrete triggers rather than narratives: new audited financials, evidence that Great Wall concentration
              is no longer structurally high, September 2026 semi-solid line proof, and a clean resolution or
              remediation of the Korea governance issue. Without those markers, valuation should compress toward a
              scenario where SVOLT remains commercially relevant but strategically boxed in by capital rationing and
              policy-sensitive exports.
