      - number: '3.4'
        title: Cost, scale and why SVOLT is not obviously top-tier
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse evidence is not technological—it is organizational and capital-market based. SVOLT
              withdrew from the Star Market path, had accumulated large losses, and later shut down its European
              operating build-out just as the first wave of Europe battery localization sorted winners from aspirants.
              That retreat matters because battery competition is won through repeated program execution, local
              manufacturing credibility and balance-sheet endurance, not only through compelling chemistry decks.
              Meanwhile, REPT’s Tsingshan-backed chain, CATL’s and BYD’s volume dominance, and the still-significant
              non-China share of Korean incumbents all point to peers with better buffers against pricing pressure and
              slower EV demand. Even Europe’s flagship startup, Northvolt, shows how expensive the growth path remains.
              The result is a clear verdict: SVOLT has enough innovation to stay relevant and win niches, but not enough
              scale, customer diversity or capital certainty to be treated as an obvious top-tier battery leader today.
              The remaining blind spots—program pricing, site utilization and exact customer concentration—also matter
              because subscale battery suppliers can look technologically healthy long before they prove durable
              economics at plant level.
