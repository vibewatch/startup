  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Disclosed Performance
        blocks:
          - type: paragraph
            body: >-
              SVOLT's public revenue model is industrial and program-based rather than subscription-like. The prospectus
              and company profile describe monetization across battery cells, modules, packs, and energy-storage
              systems, with revenue recognized through OEM and project shipments. The cleanest disclosed mix comes from
              1H22, when packs generated RMB 2.09 billion of revenue or 60 percent of the total, modules RMB 700 million
              or 20 percent, and cells RMB 634 million or 18.22 percent. That mix matters because it shows SVOLT already
              operated as a scaled supplier of assembled battery systems instead of a pure materials or licensing story.


              The top-line trajectory was real but incomplete as an underwriting basis. Accessible prospectus-era
              sources reported revenue rising from RMB 929.2 million in 2019 to RMB 1.736 billion in 2020, RMB 4.474
              billion in 2021, and RMB 3.738 billion in 1H22, while official funding materials separately said SVOLT had
              won 25 sales points with mainstream automakers and a RMB 16 billion Stellantis order. However, none of the
              accessible sources disclose realized ASPs, discount structures, or product-level gross margins. Public
              evidence therefore proves commercialization and shipment scale, but not revenue quality by platform or
              whether newer export volumes carry better economics than the earlier Great Wall-heavy domestic book.
