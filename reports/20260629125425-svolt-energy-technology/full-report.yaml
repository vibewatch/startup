        - Transmission assets, inverters and EPC scope outside the battery system
        - Integrators, EPCs, developers, utilities, large energy users
        - Important adjacent pool where SVOLT now markets 285 kWh and 6.29 MWh systems
      - - Adjacent but excluded areas
        - Battery recycling cooperation, eVTOL pilots, future solid-state options
        - Raw-material mining, generalized energy software, unrelated vehicle systems
        - Partners and pilot customers
        - Strategically relevant but not yet a clean primary SAM lens from public data
