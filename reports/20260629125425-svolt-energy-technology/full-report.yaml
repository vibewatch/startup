  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Short-Blade Platform Architecture Across Passenger, Commercial, and Storage
        blocks:
          - type: paragraph
            body: >-
              SVOLT should be understood as a platform battery supplier whose core product logic is format reuse rather
              than a single hero SKU. Official pages show one common stack across passenger vehicles, commercial
              vehicles, and stationary storage: stacked electrodes, prismatic short-blade cells, proprietary materials
              variants, pack integration, and a cloud-based monitoring layer. In passenger applications, the company
              markets L300-L600 short-blade cells for BEV, PHEV, and HEV programs. In commercial applications, it reuses
              the same prismatic/standard-box logic for heavy trucks, light trucks, buses, and construction machinery.
              In energy storage, the portfolio extends from cells to cabinets, containers, and all-in-one systems. That
              breadth matters because it makes the manufacturing process — especially stacking, thermal management, and
              pack integration — more important than any one chemistry label. The strongest public evidence is official,
              but it is at least internally consistent across the home page, profile, passenger, commercial, and storage
              solution pages.
