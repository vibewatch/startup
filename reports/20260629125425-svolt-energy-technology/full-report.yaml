      - number: '1.2'
        title: Leadership, Governance, and Capital Base
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is stronger than many private Chinese battery peers, even if control economics
              remain opaque. Multiple official pages and operating releases name Yang Hongxin as chairman and chief
              executive, while the investor-relations page goes further by naming directors and describing a governance
              architecture with a shareholders' meeting, board, board of supervisors, management team, and four
              specialist board committees. That same page also places Great Wall chairman Wei Jianjun directly on the
              board, while Yicai's late-2023 reporting says he remained SVOLT's actual controller with a stake above 40%
              and that Great Wall affiliates were important customers. On capital formation, the public record is
              unusually busy. SDIC disclosed an April 2020 strategic investment, followed by a RMB 3.5 billion Series A
              in February 2021, a RMB 10.28 billion Series B in July 2021 led by Bank of China Group Investment, and a
              RMB 6 billion Series B+ in December 2021. Public valuation evidence is less clean: Yicai cited roughly CNY
              46 billion before the STAR filing, while Changzhou government relayed a 62 billion yuan Hurun valuation
              signal in 2024. The company still appears private in 2025 unicorn and PitchBook materials, but no fresh
              2026 priced round has been publicly disclosed.
