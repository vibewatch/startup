companyProfile:
  summary: >-
    SVOLT Energy Technology is a Changzhou-headquartered Chinese battery manufacturer that traces its industrial roots
    to Great Wall Motor's internal battery project and has operated independently since 2018. The company sells EV
    battery cells, modules, and packs alongside stationary energy-storage systems, and it has built meaningful operating
    scale with 14 listed production sites, a Thailand manufacturing foothold, and an active roadmap spanning short-blade
    LFP/LMFP products, semi-solid batteries, and utility-scale ESS. Public evidence supports real commercialization and
    heavyweight financing, but it also shows an aborted STAR Market IPO, retrenched Europe factory plans, ongoing
    customer concentration risk, and incomplete current financial disclosure.
