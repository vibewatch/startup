      - number: '7.2'
        title: Europe Exit Turned Growth into Policy Beta
        blocks:
          - type: paragraph
            body: >-
              Europe is the clearest example of strategic reversal risk turning into policy risk. Multiple outlets
              reported that SVOLT will terminate European commercial operations and its German subsidiary effective
              2025-01-31 after suspending the Saarland and Brandenburg projects. The canceled plan was not trivial: one
              project alone carried roughly 24 GWh of module-and-pack capacity and about EUR 2 billion of planned
              investment, while the Brandenburg cell plant was pitched at 16 GWh. CnEVPost, EnergyTrend, and TechNode
              all converged on the same underlying problem — the two projects were too capital heavy relative to SVOLT's
              resources, with roughly RMB 30 billion of required investment and an unresolved funding gap. TechNode adds
              that domestic competition from CATL and BYD was already hurting operating resilience at home, which makes
              the Europe pullback look like a financing decision under competitive pressure rather than a tidy regional
              reprioritization.


              That retreat matters because export-led recovery now runs into a tougher trade and compliance regime.
              European Commission guidance says the anti-subsidy case on Chinese BEVs ended with definitive
              countervailing duties ranging from 7.8% to 35.3% and that any price undertaking path must address minimum
              import price, sales channels, cross-compensation, and future EU investment. The EU batteries page
              separately says the new Batteries Regulation is already in force and is expanding circularity and
              compliance obligations. In the US, the White House announced higher Section 301 tariffs on lithium-ion EV
              batteries and battery parts, and USTR later said the proposed China tariff modifications were largely
              adopted. That means Europe is no longer a simple restart option and the broader non-China route now
              carries much more policy beta than the original 2020-2022 globalization story assumed.
            claimRefs:
