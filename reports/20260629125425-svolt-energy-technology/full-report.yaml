      - number: '4.2'
        title: Cost Structure, Profitability, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              The disclosed profitability trajectory shows scale-up without breakeven. Accessible prospectus-era
              disclosures reported net losses of RMB 325.6 million in 2019, RMB 701.0 million in 2020, RMB 1.154 billion
              in 2021, and RMB 897.4 million in 1H22. Management attributed those losses to high R&D intensity, capacity
              ramp-up, and raw-material inflation — not to an absence of demand. The same filing showed R&D expense of
              RMB 724.1 million in 2021 and RMB 571.8 million in 1H22, while operating cash flow swung from negative RMB
              271.7 million in 2019 to positive RMB 349.9 million in 2021 before turning negative RMB 209.2 million
              again in 1H22. That pattern is consistent with a manufacturer whose working-capital cycle and input prices
              can overwhelm top-line growth.


              Capital intensity is also explicit in the primary filing. At 2022-06-30, SVOLT reported RMB 6.358 billion
              of fixed assets plus RMB 5.966 billion of construction in progress. Related-party sales to Great Wall
              Motor still represented 53.39 percent of revenue in 1H22, down from 99.40 percent in 2019 but still high
              enough that customer concentration and plant utilization remained linked to one group. Put differently:
              the public record supports a view of improving scale and diversification, but it does not show that scale
              had yet become self-funding before the IPO process was withdrawn.
