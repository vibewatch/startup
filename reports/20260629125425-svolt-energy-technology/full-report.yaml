        - id: f4
          label: Localized model installation
          description: Sources named ORA, Haval, Tank, and Hozon/Neta vehicles using Thai-produced packs.
        - id: f5
          label: Operational repetition
          description: 10,000-pack milestone and Jan-Feb 2026 exports imply repeat production and dispatch.
        - id: f6
          label: Customer-side multinational confirmation
          description: >-
