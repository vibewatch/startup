      - number: '8.3'
        title: Public comparable framework and scenario math
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to pressure-test SVOLT's current private mark is to compare it with listed battery
              suppliers whose revenue scale is observable every quarter. Using June 2026 CompaniesMarketCap snapshots,
              CATL trades around 4.2x sales, LG Energy Solution around 3.6x, EVE Energy around 2.2x, Samsung SDI around
              1.2x, and BYD around 1.0x. The dispersion matters. CATL commands a premium because it is the dominant
              Chinese battery champion with far better disclosure, public-market liquidity, and demonstrated earnings
              power; BYD is a weaker like-for-like battery comp because it is a broader EV and manufacturing group; and
              EVE, LGES, and Samsung SDI frame the middle-to-low public range for scaled battery makers facing cyclical
              and profitability questions. If SVOLT's last visible top-line proxy is Yicai's CNY 10 billion for 2022,
              then a RMB 62 billion mark implies about 6.2x trailing sales, or roughly 5.1x using the user's ~US$7.2
              billion shorthand against roughly US$1.4 billion of revenue. That sits above the public comp median and
              above several much more transparent listed peers. To justify the same valuation at the comp median of
              about 2.23x, SVOLT would need roughly US$3.2 billion of annual revenue; at 1.23x it would need almost
              US$5.9 billion; only at a CATL-like 4.2x premium does the hurdle drop toward US$1.7 billion. The entire
              valuation debate lives inside that spread.
