  - id: TV006
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Current revenue disappoints
        - Latest audited annual revenue is still near the 2022 ~CNY10bn proxy
        - The current mark keeps looking like a >5x-sales story on stale numbers.
        - Do not buy at the current mark; re-underwrite on lower multiples.
      - - New money prices below prior anchor
        - Fresh financing clears at or below ~RMB 46bn
        - Signals down-round pressure versus the unicorn headline.
        - Reset valuation anchor to the new price, not the index label.
      - - Aggressive preference stack emerges
        - Round or HK pre-IPO money includes heavy liquidation or ratchet protection
        - Headline valuation overstates common-equity economics.
        - Demand structured-return math before any commitment.
      - - Execution retrenches again
        - Further plant cancellations, export softness, or inability to monetize tech milestones
        - Growth story weakens while capital intensity stays high.
        - Move from research-more toward avoid at the current mark.
      - - Disclosure gap persists
        - No refreshed audited package despite financing or IPO narrative continuing
        - Investors remain asked to pay on faith rather than on verified economics.
        - Do not underwrite the mark until the information set improves.
    notes: >-
      These triggers are intentionally measurable or event-based so the committee can revisit the call without
      re-arguing the whole narrative.
    claimRefs:
      - CV014
      - CV016
      - CV027
      - CV033
      - CV043
      - CV044
      - CV045
  - id: TV007
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited 2023-2025 financials
        - Full income statement, cash flow, and balance sheet
        - Needed to replace stale 1H22-based underwriting.
        - Require audit pack or filed prospectus / listing document.
      - - Current revenue quality
        - Segment mix, ASPs, gross margin, and top-customer concentration
        - Determines whether SVOLT deserves a premium or a discounted battery multiple.
        - Management data room and plant-level reporting review.
      - - Current liquidity and debt
        - Cash, restricted cash, debt schedule, covenants, and monthly burn
        - Tests dilution urgency and solvency risk after the failed IPO.
        - Treasury bridge and lender documentation.
      - - New financing or HK listing terms
        - Round size, price, preference stack, secondaries, cornerstone terms
        - Turns a headline valuation into an actual common-equity entry price.
        - Signed term sheets, board approvals, or prospectus draft.
      - - Europe retrenchment economics
        - Sunk capex, write-offs, liabilities, and any salvage value
        - Clarifies whether capital discipline improved or whether losses were merely deferred.
        - Capex memo and impairment schedule.
      - - Export / technology monetization
        - Overseas gross margin, semi-solid attach rates, and customer conversion
        - Needed to know whether strategic narrative becomes earnings power.
        - Customer program reviews and product-level P&L.
    notes: >-
      Without this packet, valuation remains scenario framing rather than a true intrinsic or relative-underwriting
      exercise.
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV032
      - CV034
