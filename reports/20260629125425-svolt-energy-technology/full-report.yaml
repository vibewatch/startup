      - number: '8.2'
        title: Scale, traction, and the transparency discount
        blocks:
          - type: paragraph
            body: >-
              The main reason the RMB 62 billion mark deserves scrutiny is not that SVOLT lacks operating activity; it
              is that scale evidence and financial transparency are badly mismatched. The prospectus and follow-on
              reporting show real revenue growth through 1H22, widening losses, and a business model that was still
              absorbing heavy R&D and capacity costs. Yicai later said revenue reached CNY 10 billion in the year before
              its December 2023 article, which is directionally important because it suggests SVOLT had scaled well
              beyond the 2021 revenue base. But that figure is only a media-reported proxy in the current public set,
              not a refreshed audited statement. The same article also said cumulative losses from 2019 through
              first-half 2023 exceeded CNY 3 billion. Meanwhile, Europe was cut back after the IPO withdrawal, while
              Thailand ramp-up and Gasgoo's 39% overseas-shipment-share datapoint show that commercial traction
              continued. Put differently: the business is real enough to merit a valuation discussion, but not disclosed
              enough to erase a large transparency discount. Investors can see evidence of shipments, financing history,
              and international execution, yet they still cannot see current gross margin, current cash, current debt
              capacity, or whether recent export and technology milestones translate into earnings quality.
