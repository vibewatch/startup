      - number: '2.5'
        title: Where SVOLT fits versus giants and what remains unresolved
        blocks:
          - type: paragraph
            body: >-
              SVOLT is not competing with CATL and BYD on sheer scale today; the share data make that clear. Its more
              realistic market position is as a differentiated mid-tier supplier that tries to win on short-blade form
              factor, PHEV fast charging, semi-solid timing, ASEAN localization, and a second growth leg in energy
              storage. That strategy can work in slices of the market where buyers are still choosing platforms and
              where localization matters more than global balance-sheet dominance. But several key inputs for a harder
              SOM view remain opaque. Public sources do not confirm how much of the reported BMW or other export-side
              design-win pipeline converts into recurring revenue, how the stated 61 GWh 2026 shipment target splits
              between domestic and overseas programs, or what proportion of current volume and revenue is already ESS
              rather than automotive. Those gaps do not invalidate the market thesis, but they materially limit
              precision on near-term monetization and on how fast SVOLT can widen the gap between product
              differentiation and actual installed share.
            claimRefs:
              - CM040
