      - number: '4.3'
        title: Capital Adequacy After the IPO Withdrawal
        blocks:
          - type: paragraph
            body: >-
              SVOLT was not relying on the public market to start scaling; it was using the public market to keep
              scaling. Before the STAR Market process ended, the company had already raised RMB 3.5 billion in Series A,
              RMB 10.28 billion in Series B, and RMB 6 billion in Series B+, while EqualOcean said cumulative disclosed
              financing exceeded RMB 20 billion. The draft IPO then sought another RMB 15 billion, with RMB 2 billion
              explicitly reserved for supplementary working capital and the remainder tilted toward domestic battery
              projects plus battery-technology programs. The prospectus also stated that any funding shortfall would
              have to be covered with self-funded cash and bank loans, showing that management already expected external
              capital to remain necessary even if the deal priced below plan.


              That financing stack looked less comfortable once the IPO was withdrawn. Yicai and EqualOcean both
              reported that SVOLT decided to terminate the A-share application and explore alternative financing paths,
              including fresh rounds and a possible Hong Kong listing. The last directly accessible primary
              balance-sheet snapshot showed RMB 15.815 billion of cash and RMB 405.8 million of short-term borrowings at
              2022-06-30, but no public source here bridges that cash forward through the 2024 Europe retrenchment or
              the 2025-2026 overseas export push. The underwriteable conclusion is therefore narrow: SVOLT has
              demonstrated repeated access to private capital, but current runway, dilution risk, and debt capacity
              remain unverified because the public dataset stops before the post-withdrawal financing reset.
