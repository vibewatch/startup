      - number: '1.4'
        title: Milestones, IPO Context, and Risk Signals
        blocks:
          - type: paragraph
            body: >-
              SVOLT's recent milestone trail is credible but mixed. On the positive side, 2025-2026 public sources
              describe a maturing technology roadmap: official CIBF materials scheduled semi-solid battery-pack mass
              production for Q3 2026, Best Magazine and electrive connected first-generation semi-solid batteries to
              future BMW Mini programs, and Battery-Tech reported that Battery Day in January 2026 paired a 61 GWh
              shipment target with the company's first quarterly profit in Q4 2025. PV Magazine also reported more than
              8 GWh of energy-storage cooperation and supply agreements at SNEC 2026, reinforcing management's effort to
              turn energy storage into a second pillar beside vehicle batteries. The negative side is equally important.
              SVOLT's STAR Market IPO filing targeted RMB 15 billion, but the process was later withdrawn or terminated,
              with Yicai reporting Hong Kong as the more likely alternative venue. Around the same period, SVOLT
              abandoned its two German factory projects and moved to shut commercial operations of its European
              entities, citing a weaker-than-expected EV market and capital intensity that had become hard to justify.
              The result is a company with real product and scale momentum, but also one that has already had to retreat
              from a very capital-hungry overseas manufacturing plan.
