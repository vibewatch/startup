  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      SVOLT's customer journey runs from Great Wall-related supply, to third-party domestic OEM revenue, to Thailand
      localization, to shipment-level overseas expansion, with ESS still largely in the strategic-adjacency stage.
    data:
      nodes:
        - id: n1
          label: Related-party anchor demand
          description: Great Wall provided the initial revenue base and remained the dominant customer through the filing period.
        - id: n2
          label: Third-party domestic OEM entry
          description: Hozon, Geely, Leapmotor, and others appeared as real paying customers in 2021 and 1H22.
        - id: n3
          label: Signed program / framework expansion
          description: Prospectus-designated projects widened the visible account pipeline beyond realized top-five revenue.
        - id: n4
          label: Thailand localization
          description: Banpu JV enabled local pack production and bulk deliveries for Great Wall and Hozon models in Thailand.
        - id: n5
          label: Overseas shipment scaling
          description: 2026 export data shows international volume growth and named supplier-side overseas accounts.
        - id: n6
          label: ESS cross-sell not yet proven
          description: ESS is a declared growth lane, but public named storage customers and renewals remain sparse.
    approximationNotes: >-
      The map reflects proof-quality stages rather than a literal CRM funnel; each stage is backed by a different
      evidence type and confidence level.
