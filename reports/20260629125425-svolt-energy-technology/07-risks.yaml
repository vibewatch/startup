- id: domestic-price-war-and-partner-dependence
  title: Domestic Price Wars Raise the Cost of Staying Small
  body: 'The next risk layer is competitive compression. IEA says global battery demand already passed 1 TWh in 2024 and average pack prices fell below USD 100/kWh, but that healthy end-market signal does not protect second-tier suppliers from a brutal supply-side setup. The IEA commentary says China now produces more than three-quarters of batteries sold globally and that Chinese battery prices fell nearly 30% in 2024, faster than anywhere else. SCMP adds the sharper framing: Chinese battery manufacturing capacity could reach 4,800 GWh in 2025, roughly four times EV-maker demand, with analysts warning that smaller players could be forced to fold. That is exactly the context in which SVOLT is trying to improve scale.


    SVOLT''s own 2025-2026 data show both traction and vulnerability. CnEVPost put the company''s 2025 China share at only 2.70% and its 2025 global share at 2.4%, while the official Q1 2026 release said installed capacity rose 33.6% to 6.5 GWh and share improved to 2.7% because overseas markets led growth. Gasgoo reported 1.66 GWh of overseas shipments in January-February 2026, equal to 39% of total shipments, and explicitly quoted overseas expansion as a necessity for survival and growth amid fierce domestic competition. Official SVOLT news says deliveries have started to Stellantis and VinFast, while TMTPost described a large BMW supply program that remains media-reported rather than filing-backed in the materials reviewed here. The upshot is that export growth is real, but it is being used to offset a structurally tougher domestic market rather than to amplify a comfortably profitable base.'
