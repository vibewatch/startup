  evidenceGaps:
  - type: missing-source
    severity: material
    topic: korea-investigation
    missingEvidence: A public docket, charging document, or official resolution showing whether the Korea matter advanced beyond the reported transfer to prosecutors.
    whyItMatters: Without an official procedural update, investors cannot gauge whether the issue is fading, escalating, or already affecting OEM diligence.
    diligencePath: Request outside-counsel memo plus any public filing identifiers from management.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: current-financing
    missingEvidence: Current monthly burn, net debt, maturity schedule, covenant package, and any signed replacement financing after the STAR withdrawal.
    whyItMatters: Financing opacity is the core underwriting blocker because it determines whether capex, R&D, and export working capital can be funded without punitive dilution.
    diligencePath: Obtain 2024-2026 audited statements, bank facilities, and board-approved financing plan.
    relatedQuestionRefs:
    - QR027
  - type: missing-source
    severity: material
    topic: warranty-and-recalls
    missingEvidence: Warranty reserve history, field-failure rates, recall data, and customer quality scorecards for packs and cells.
    whyItMatters: Safety and quality risk cannot be priced correctly from milestone announcements or single-factory yield claims alone.
    diligencePath: Request warranty bridge, recall log, and top-customer quality dashboards.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Current revenue concentration by OEM, geography, and program plus any binding offtake or take-or-pay protections.
    whyItMatters: Historic Great Wall concentration is proven, but current concentration determines whether export growth is diversified or just a new single-node dependency.
    diligencePath: Obtain 2025-2026 customer mix, top-account share, and contract-duration data.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-register-coverage
    missingEvidence: A fuller inventory of court, permit, customs, and battery-law matters beyond the five highest-salience public items in the regulatory table.
    whyItMatters: The severity-ranked register is fit for investment screening, but it is not a substitute for a counsel-built legal diligence matrix.
    diligencePath: Commission jurisdiction-by-jurisdiction legal diligence covering Korea, EU, US, and China.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
