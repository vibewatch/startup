company:
  name: SVOLT Energy Technology
chapter:
  number: 7
  title: Risks
  summary: 'SVOLT''s risk stack is led by financing and strategic-reversal risk rather than by lack of market demand: the withdrawn STAR IPO, the capital-heavy German retreat, and still-stale public financial disclosure leave current solvency and capex capacity unproven. The next layer is execution under stress — domestic battery price wars, export-policy exposure, semi-solid commercialization pressure, and partner-trust risk from a reported Korea technology-leak investigation all raise the odds that overseas momentum fails to convert into durable margins.'
sections:
- id: capital-intensity-and-disclosure
  title: Capital Intensity, IPO Withdrawal, and Disclosure Opacity
  body: 'SVOLT''s highest-severity risk is that its growth model still looks capital hungry while its public financing path broke in plain sight. The 2022 STAR Market prospectus sought RMB 15 billion, reserved RMB 2 billion just for supplementary working capital, and described lithium-ion batteries as a capital-intensive industry with heavy fixed-asset and equipment needs. The same filing showed more than RMB 6.3 billion of fixed assets and nearly RMB 6.0 billion of construction in progress by 2022-06-30, which is already enough to prove that scale required continuous external funding rather than self-financed expansion. Official 2021 financing materials reinforce that pattern: SVOLT had already raised RMB 3.5 billion in Series A and RMB 10.28 billion in Series B before attempting the IPO.


    What makes this risk sharper in 2026 is not the old capex footprint by itself, but the lack of refreshed public financial evidence after the STAR process was withdrawn. EqualOcean and Yicai both reported that SVOLT and sponsor CITIC withdrew the filing and that management pivoted to alternative financing ideas including Hong Kong, yet the accessible primary disclosures reviewed here still stop at 2022-06. That leaves current burn, leverage, covenant headroom, and capex commitments opaque exactly when the company is trying to prove export-led growth and a new-chemistry roadmap. Historic Great Wall concentration also lingers in the background: the prospectus showed related-party sales still at 53.39% of revenue in 1H22. An investor is therefore underwriting a manufacturer with real output and customer proof, but without a current audited map of the capital stack that now has to support the post-Europe strategy.'
