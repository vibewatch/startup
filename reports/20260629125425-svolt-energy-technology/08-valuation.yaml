tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why this is the current view
  - What would change the view
  rows:
  - - Recommendation
    - research-more
    - The business is real and strategically relevant, but public evidence is too stale and incomplete to underwrite the current private mark.
    - Refreshed audited 2023-2025 financials plus clean current financing terms.
  - - Confidence
    - medium
    - Public anchors exist, but too much of the current economics are inferred from stale or secondary evidence.
    - A filed Hong Kong prospectus or equivalent audited update.
  - - Risk rating
    - high
    - Valuation, financing, and execution risks are all live at once.
    - Visible profitability improvement and balance-sheet disclosure.
  - - Valuation stance
    - stretched
    - RMB 62bn sits above earlier private anchors and above several better-disclosed listed battery peers on trailing-sales logic.
    - Proof of materially higher current revenue and better margin profile.
  - - Decision implication
    - Wait for either more disclosure or a lower entry point
    - The mark is credible as a unicorn label, not yet attractive as an investor entry price.
    - A cheaper round, or premium-quality metrics that justify the premium multiple.
  notes: 'Assessment is explicitly price-sensitive: it distinguishes the credibility of the headline unicorn mark from the underwriteability of buying into that mark today.'
