  evidenceGaps:
  - type: stale
    severity: material
    topic: audited-financials
    missingEvidence: Audited 2023-2025 income statements, balance sheets, and cash-flow statements.
    whyItMatters: Without them, the chapter relies on 1H22 prospectus numbers and a media-reported 2022 revenue proxy.
    diligencePath: Obtain a filed Hong Kong prospectus, audit pack, or lender/investor data-room financials.
    relatedQuestionRefs:
    - QV006
    - QV019
    - QV020
  - type: private-evidence-only
    severity: material
    topic: current-liquidity
    missingEvidence: Current cash, debt, covenants, restricted cash, and monthly burn.
    whyItMatters: These figures determine whether the next financing is optional growth capital or urgent dilution capital.
    diligencePath: Request treasury bridge, debt schedule, and most recent board liquidity materials.
    relatedQuestionRefs:
    - QV007
    - QV021
    - QV025
  - type: private-evidence-only
    severity: material
    topic: capital-stack
    missingEvidence: Exact size, pricing, preference, and secondaries terms of any post-2021 financing or Hong Kong pre-IPO process.
    whyItMatters: Headline valuation can materially overstate common-equity value if the security stack is structured.
    diligencePath: Review signed term sheets, cap table, and counsel summary of liquidation rights.
    relatedQuestionRefs:
    - QV003
    - QV026
    - QV027
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Product-level ASP, gross margin, warranty burden, and customer concentration on the current revenue base.
    whyItMatters: These metrics determine whether SVOLT deserves premium CATL-like pricing or a discounted cyclical multiple.
    diligencePath: Request plant-level and product-level margin bridge plus top-customer concentration analysis.
    relatedQuestionRefs:
    - QV014
    - QV017
    - QV025
    - QV030
