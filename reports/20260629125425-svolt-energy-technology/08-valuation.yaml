- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Topic
  - Thesis
  - Anti-thesis
  - What would decide it
  rows:
  - - Current mark
    - Hurun/Changzhou and prior IPO math show the market can support a RMB 60bn+ narrative.
    - No clean post-2021 priced round or completed IPO is public, so headline valuation quality is unproven.
    - Disclosure of the exact terms and size of the next round or listing.
  - - Operating scale
    - Revenue, shipments, and overseas traction show SVOLT is far beyond science-project stage.
    - The latest accessible audited-style disclosure stops at 1H22, so current scale is still indirectly evidenced.
    - Audited 2023-2025 revenue, gross margin, and segment mix.
  - - Technology and exports
    - Thailand, overseas shipments, and semi-solid work keep upside optionality alive.
    - Technology milestones and shipment headlines do not prove profitable monetization.
    - Attach-rate, ASP, gross-margin, and plant-utilization data.
  - - Comp framework
    - Premium listed battery names show the market can reward strategic battery leaders.
    - Transparent listed peers usually trade between ~1x and ~4x sales, while SVOLT looks above that range on the last public revenue proxy.
    - Current revenue and profitability versus CATL/EVE/LGES-style comp standards.
  - - Financing resilience
    - SVOLT has historically shown strong fundraising access.
    - Historical fundraising does not remove down-round, preference, or liquidity risk after the IPO withdrawal and Europe retreat.
    - New-money pricing, dilution, and treasury bridge.
  notes: The anti-thesis is not that SVOLT lacks a business; it is that the current price asks investors to pay ahead of refreshed disclosure.
