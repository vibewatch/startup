  rows:
  - - Bull
    - Current revenue is well above the 2022 proxy, losses narrow materially, export mix scales, and the next financing/HK process is clean.
    - 6.5-7.5
    - 15-20%
    - The current ~US$7.2bn mark can work only if SVOLT now deserves near-premium public battery multiples.
  - - Base+
    - Revenue has grown materially but is still below premium-leader scale; margins improve, but transparency remains partial.
    - 5.0-6.0
