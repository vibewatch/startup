- id: recommendation-diligence-asks-and-thesis-breaks
  title: Recommendation, diligence asks, and thesis-breaks
  body: 'The bull case for SVOLT is understandable: the company has repeatedly raised capital, remains a recognized unicorn, still appears in top-battery-supplier shipment discussions, is monetizing Thailand and overseas volumes, and is still advancing differentiated battery technology. The anti-thesis is stronger on price discipline. Public investors are being asked to accept a private mark that sits above the prior private-round anchor, near the failed IPO aspiration, and above what several more transparent listed battery suppliers command on trailing-sales math, even though SVOLT has not publicly closed the core diligence gaps since 1H22. That is why the right recommendation at the current mark is research-more rather than buy. The price could migrate toward fair if current revenue is materially above the 2022 proxy, losses have narrowed sharply, and any Hong Kong listing or private round is done on plain-vanilla terms. But absent that proof, the Hurun/Changzhou-level mark looks stretched
    relative to transparency and scale. The thesis breaks quickly if new financing clears at or below the earlier RMB 46 billion level, if current revenue is still close to the 2022 proxy, or if export and technology milestones fail to convert into better margins and cash generation. Investors should therefore demand refreshed audited financials, current treasury data, and the exact economics of any new round or listing process before underwriting the headline valuation.'
