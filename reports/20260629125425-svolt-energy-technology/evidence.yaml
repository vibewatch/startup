evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: current valuation benchmark for TO001 and TO003
    missingEvidence: A fresh priced financing, tender, or independent valuation benchmark after the 2024-2025 unicorn-ranking signals.
    whyItMatters: >-
      The public file contains meaningful valuation signals, but none is a clean 2026 transaction price that can anchor
      ownership dilution, downside protection, or present-day comparables.
    diligencePath: >-
      Request the latest board-approved valuation memo, cap-table update, or 409A-style internal valuation prepared
      after the most recent financing event.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: workforce and profitability verification for TO001
    missingEvidence: >-
      An investor-update or audited management pack showing current headcount, quarterly profitability bridge, and
      segment-level contribution margins.
    whyItMatters: >-
      The site and press reports are directionally useful, but workforce and profitability are core diligence metrics
      that should not rely only on management marketing or secondary press summaries.
    diligencePath: >-
      Request the latest HR snapshot, monthly management accounts, and the Q4 2025-to-2026 profitability bridge used
      internally by finance.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and founder table coverage for TO002
    missingEvidence: >-
      Detailed biographies, committee memberships, and the broader executive bench beyond the board roster posted on the
