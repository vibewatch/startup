- id: operations-and-global-footprint
  title: Operations and Global Footprint
  body: 'Thailand is the clearest operating proof that SVOLT''s globalization strategy translated into physical output. Official
    releases and independent reporting align that the Banpu NEXT joint venture entered mass production in February 2024, began
    bulk deliveries quickly, and aimed to ship more than 20,000 battery packs in its first operating year. By June 2025, Gasgoo
    reported the Thai plant had already built its 10,000th battery pack, while the company was extending the site toward energy-storage
    assembly and broader Asia-Pacific lifecycle services. Early-2026 shipment reporting makes the picture more tangible: Gasgoo
    said overseas shipments hit 1.66 GWh in January and February alone, equal to 39% of total shipments and support for more
    than 30,000 vehicles. Market-share evidence also shows real though still second-tier global scale. Official late-2025
    materials claimed 23.7 GWh of Jan-Oct global installed capacity with the fastest growth among top-10 suppliers; CnEVPost''s
    year-end rankings then placed SVOLT tenth globally and seventh in China for full-year 2025. These sources do not resolve
    every question around audited profitability or exact current workforce, but they do show an enterprise operating well
    beyond pilot scale.'
