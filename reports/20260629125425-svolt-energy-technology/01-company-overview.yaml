company:
  name: SVOLT Energy Technology
chapter:
  number: 1
  title: Company Overview
  summary: 'SVOLT Energy Technology is a Changzhou-headquartered battery maker spun out of Great Wall Motor in 2018 after
    battery work began internally in 2012. Public evidence supports a heavyweight 2021 financing stack, continued private-unicorn
    status through 2025, a Thailand-centered overseas manufacturing footprint, and an active 2026 push into semi-solid batteries
    and energy storage. The same record also shows material execution risk: the STAR IPO was withdrawn, Europe factory plans
    were abandoned, and current valuation, cap-table rights, and independently verified profitability remain only partially
    disclosed.'
sections:
- id: identity-and-product-scope
  title: Identity and Product Scope
  body: 'SVOLT should be framed as a large Chinese battery and energy-storage manufacturer rather than a narrow single-product
    startup. Official company pages consistently say the business was established in 2018, is headquartered in Jintan District
    of Changzhou, and sells cells, modules, packs, battery-management systems, energy-storage products, and recycling-related
    solutions. The same official materials anchor a broader industrial story: SVOLT traces its roots to a Great Wall Motor
    battery project that started in 2012, meaning the corporate entity is younger than the operating lineage. That distinction
    matters because it explains why the company can look like both a venture-backed unicorn and an already scaled manufacturer.
    The public file also supports meaningful current scale. Official pages list 14 global production sites, three R&D centers,
    more than 11,000 patent applications, and RMB 5.2 billion of cumulative R&D investment from 2019 through 2025. Those are
    company claims rather than audited filings, but they establish why later claims about aggressive internationalization
    and next-generation chemistry development are plausible.'
