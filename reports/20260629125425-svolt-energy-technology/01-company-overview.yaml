  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: current valuation benchmark for TO001 and TO003
    missingEvidence: A fresh priced financing, tender, or independent valuation benchmark after the 2024-2025 unicorn-ranking
      signals.
    whyItMatters: The public file contains meaningful valuation signals, but none is a clean 2026 transaction price that can
      anchor ownership dilution, downside protection, or present-day comparables.
    diligencePath: Request the latest board-approved valuation memo, cap-table update, or 409A-style internal valuation prepared
      after the most recent financing event.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: workforce and profitability verification for TO001
    missingEvidence: An investor-update or audited management pack showing current headcount, quarterly profitability bridge,
      and segment-level contribution margins.
    whyItMatters: The site and press reports are directionally useful, but workforce and profitability are core diligence
      metrics that should not rely only on management marketing or secondary press summaries.
    diligencePath: Request the latest HR snapshot, monthly management accounts, and the Q4 2025-to-2026 profitability bridge
      used internally by finance.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and founder table coverage for TO002
    missingEvidence: Detailed biographies, committee memberships, and the broader executive bench beyond the board roster
      posted on the investor page.
    whyItMatters: The public board roster is enough for a basic governance snapshot, but it is not enough to assess succession
      depth, committee responsibility, or whether key functions are concentrated in a small leadership circle.
    diligencePath: Collect management biographies, committee charters, and any board-committee membership disclosures from
      the company or financing materials.
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder rights and cap table coverage for TO003
    missingEvidence: A current shareholder register, board-observer list, and summary of special rights granted across the
      2020-2021 financing rounds.
    whyItMatters: Public press coverage names many investors and partners but does not show the present control stack, liquidation
      preferences, or any rights concentration created during the rapid financing period.
    diligencePath: Request the cap table, shareholder agreement summary, and any side-letter schedule covering governance,
      vetoes, and information rights.
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table coverage for TO004
    missingEvidence: A complete dated chronology of every financing close, product launch, governance change, and plant decision
      through June 2026.
    whyItMatters: The public chronology is strong enough for the main narrative, but omitted internal milestones could matter
      for sequencing product readiness, financing needs, and overseas expansion discipline.
    diligencePath: Request the internal corporate timeline used for board decks or PR planning and reconcile it against the
      public newsroom archive and investor materials.
    relatedTableRefs:
    - TO004
