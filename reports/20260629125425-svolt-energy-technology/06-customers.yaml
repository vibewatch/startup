  evidenceGaps:
  - type: missing-source
    severity: material
    topic: vinfast-customer-proof
    missingEvidence: Customer-side VinFast confirmation, model name, start-of-production timing, and delivered volume for any SVOLT-supplied battery program.
    whyItMatters: Without customer-side confirmation, VinFast remains a supplier-side claim and cannot be weighted like Thai delivery proof or filing-era revenue customers.
    diligencePath: Request VIN-level program references or customer press releases from VinFast and compare them with SVOLT shipment records.
    relatedQuestionRefs:
    - QU013
  - type: missing-source
    severity: material
    topic: hyundai-customer-proof
    missingEvidence: A second independent or customer-side source confirming Hyundai as an active SVOLT customer, including geography, vehicle line, and battery form factor.
    whyItMatters: Hyundai currently appears only in one independent export-growth article, making the claim too weak for firm underwriting.
    diligencePath: Search Hyundai procurement, supplier, and vehicle-program disclosures or request program confirmation from management.
    relatedQuestionRefs:
    - QU014
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal-rate, contract-duration, and satisfaction data by customer cohort or OEM program.
    whyItMatters: Durability is central to judging whether diversification is sticky or merely a sequence of one-off launches.
    diligencePath: Request customer cohort tables and program-renewal history in the data room.
    relatedQuestionRefs:
    - QU016
    - QU024
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: A current full customer ledger showing which prospectus-era accounts remained active after 1H22 and which 2026 overseas programs are shipping today.
    whyItMatters: The public record proves selected accounts and milestones but cannot confirm the completeness or present-tense status of the whole customer base.
    diligencePath: Request a 2023-2026 customer ledger with revenue share, platform, geography, and active/inactive status.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: ess-end-customers
    missingEvidence: Named ESS end-customers, deployed MWh, project dates, and reorder/service metrics for Southeast Asia or other markets.
    whyItMatters: ESS is a stated growth vector but cannot yet be credited as proven customer diversification without named buyer proof.
    diligencePath: Request project list, commissioning evidence, and pipeline conversion data for all public BESS accounts.
    relatedQuestionRefs:
    - QU015
    - QU024
  - type: missing-source
    severity: minor
    topic: mini-customer-confirmation
    missingEvidence: Customer-side BMW or MINI confirmation of any semi-solid battery sourcing agreement, with program timing and production volume.
    whyItMatters: The distinction between pilot pipeline and booked commercial program materially changes how much value to assign to the MINI narrative.
    diligencePath: Look for BMW Group supplier releases or request signed sourcing documentation and SOP milestones.
    relatedQuestionRefs:
    - QU010
    - QU024
