- id: TU003
  title: Named customer proof table
  columns:
  - Customer / program
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome
  - Limitation
  rows:
  - - Great Wall Motor
    - Domestic OEM + Thailand OEM
