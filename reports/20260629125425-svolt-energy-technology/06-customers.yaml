- id: overseas-and-emerging-programs
  title: Overseas and Emerging Programs
  body: 'The overseas customer story is directionally positive but materially less verified than the domestic and Thailand story. Official and independent 2026 shipment-growth sources said exports reached 1.66 GWh in January-February 2026 and that overseas shipments accounted for 39 percent of total volume, which is hard evidence that international demand exists at the shipment level. Official source text further said SVOLT had begun mass deliveries to Stellantis and VinFast, while Gasgoo added Hyundai to the list of automakers whose supply chains SVOLT had entered. However, we did not find customer-side confirmations from Stellantis, VinFast, or Hyundai in the reviewed set, so these relationships should be treated as medium-confidence supplier-side commercialization signals rather than fully corroborated account proof. BMW and MINI require even more caution: supplier-side statements and trade press discuss future MINI semi-solid programs and a rumored large BMW deal, but Electrive explicitly
    noted that MINI had not yet been officially confirmed as an initial recipient, and the 2023 BMW megadeal remained rumor-based.'
