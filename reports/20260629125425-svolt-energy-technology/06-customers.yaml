  - - Leapmotor
    - Domestic OEM
    - Cell programs in filing-era customer tables
    - Production
    - Reached 8.63% of 1H22 main-business revenue
    - No current public delivery or retention evidence reviewed
  - - BMW AG
    - International OEM
    - Battery-pack and cell purchases disclosed in 2020 top-five table
    - Production but immaterial
    - Historical realized sales are stronger than later rumor-cycle headlines
    - 2020 disclosed sales were only 0.04% of main-business revenue
  - - Spotlight Automotive / MINI path
    - International OEM program
    - Prospectus designations for Spotlight and later semi-solid battery claims for MINI
    - Pilot / future program
    - Prospectus listed Spotlight designations and later trade press tied semi-solid cells to next-generation MINI models
    - No customer-side MINI confirmation and no public volume or SOP detail
  - - PSA / Stellantis
    - International OEM program
    - PHEV and BEV battery-pack/module designations; later claimed purchase order and 2026 mass deliveries
    - Framework / claimed commercialization
    - Prospectus listed PSA/Stellantis projects; official 2021 and 2026 sources claimed large order and later mass deliveries
