- id: named-customer-proof-and-commercialization
  title: Named Customer Proof and Commercialization
  body: 'SVOLT''s strongest named-customer proof comes from two places. First, the filing itself disclosed actual top customers by period: Great Wall was the clear anchor, Hozon reached 10.59 percent of 1H22 main-business revenue, Leapmotor reached 8.63 percent, and Geely was already a meaningful account in both 2021 and 1H22. The same filing also showed a small but real historical BMW AG revenue line in 2020, which is more probative than later rumor-cycle headlines because it reflects realized sales rather than future intent. Second, multiple 2024-2025 Thailand sources from SVOLT, Banpu NEXT, Yicai, CnEVPost, Automacha, Gasgoo, and SMM said the Thai JV entered mass production and began bulk deliveries for Great Wall''s ORA, Haval, and Tank models as well as Hozon/Neta vehicles. That evidence demonstrates current localized commercialization rather than mere logo usage. What it does not show is current revenue concentration by customer after 1H22 or contract economics by program.'
