- id: retention-durability-and-ess-visibility
  title: Retention, Durability, and ESS Visibility
  body: 'Public retention visibility is weak. None of the reviewed sources disclosed NRR, GRR, churn, renewal rates, customer tenure, contract duration, or satisfaction scores. The best durability proxies are indirect: Great Wall remained a multiyear buyer through the filing period; Hozon appeared as a top customer in 1H22 and then reappeared in Thailand bulk-delivery sources in 2024; and export data implies repeat shipment activity into 2026. But those proxies are still not substitutes for formal retention metrics. The ESS segment is even less proven from a customer angle. SVOLT''s profile and 2026 trade-show materials make clear that energy storage is a strategic business line, while the Banpu/SVOLT partnership explicitly covers ESS assembly and future localization. Yet the reviewed public sources do not name current ESS end-customers, deployment volumes, renewals, or project economics. In practical terms, OEM traction is evidenced; ESS commercialization is still mostly product and capacity
    positioning.'
  claimRefs:
  - CU014
  - CU018
