    - Reached 10.59% of 1H22 main-business revenue and was named in 2024 Thai bulk-delivery sources
    - No public renewal, contract term, or current revenue split
  - - Geely
    - Domestic OEM
    - Battery packs, modules, and cells in filing-era customer tables
    - Production
    - Meaningful top-five customer in 2021 and 1H22
