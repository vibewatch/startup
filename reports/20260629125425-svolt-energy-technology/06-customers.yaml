- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale evidence
  - Revenue / strategic value
  - Gap
  rows:
  - - Related-party domestic OEM
    - Great Wall Motor as OEM buyer and payer
    - Battery packs, modules, and cells for GWM vehicle programs
    - Great Wall remained >50% of 1H22 main-business revenue
    - Highest historical revenue concentration and clearest commercialization proof
    - Current transfer-pricing, margin, and 2023-2026 share are undisclosed
  - - Third-party domestic OEM
    - Hozon, Leapmotor, Geely and other Chinese OEMs
    - Passenger-EV and PHEV battery packs, modules, and cells
    - Top-customer table and designated-program table in the 2022 filing
    - Real diversification beyond Great Wall by 2021-1H22
    - No public post-1H22 customer-mix disclosure
  - - International / export OEM pipeline
    - PSA/Stellantis, Spotlight Automotive, BMW AG, Otokar, Enersys and others
    - Design wins, framework agreements, selective realized sales, and export programs
    - Prospectus sales-designation table plus later export disclosures
    - Supports multinational ambition and reduces dependence on one OEM group
    - Most public proof is designation- or supplier-side rather than customer-side
  - - Thailand localized OEM supply
    - Great Wall and Hozon/Neta programs in Thailand
    - Localized LCTP/LFP pack supply for Thai NEV models
    - Bulk-delivery and 10,000-pack milestone sources
    - Best current non-China production proof and strongest overseas execution evidence
    - Public record does not disclose per-account Thai revenue or margins
  - - ESS / stationary storage buyers
    - Banpu partnership and future Southeast Asia storage customers
    - ESS assembly, localized storage products, and possible solar-storage-charging projects
    - Product pages, Banpu cooperation text, and Thailand milestone commentary
    - Strategic adjacency that can broaden buyer mix beyond automotive
    - Named end-customers, deployed MWh, and renewals are not public
  notes: Segment labels separate proven revenue customers from designations and future ESS targets; lack of post-1H22 customer-mix disclosure is the main limitation.
