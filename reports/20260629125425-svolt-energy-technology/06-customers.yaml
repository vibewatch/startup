company:
  name: SVOLT Energy Technology
chapter:
  number: 6
  title: Customers
  summary: SVOLT has real commercialization proof, but it is uneven. The strongest public evidence is filing-era domestic OEM revenue and the Thailand JV that now delivers packs for Great Wall and Hozon/Neta; the weakest evidence is the current overseas-customer narrative, where Stellantis, VinFast, Hyundai, BMW, and MINI are mostly supported by supplier-side or trade-press claims rather than customer-side confirmations. Customer concentration improved from near-total dependence on Great Wall but remained high in 1H22, and public ESS customer proof remains materially weaker than OEM proof.
sections:
- id: customer-base-and-segment-mix
  title: Customer Base and Segment Mix
  body: 'The public record shows that SVOLT is not a pre-revenue battery aspirant: it had identifiable revenue-bearing OEM customers in the IPO filing period, and its customer mix widened meaningfully beyond Great Wall Motor by 2021 and 1H22. The draft STAR Market prospectus disclosed that Great Wall still dominated revenue, but it also showed Hozon, Leapmotor, Geely, and other OEMs entering the book, plus a long list of signed model-designation or framework customers that ranged from PSA/Stellantis and Spotlight Automotive to Li Auto, Xpeng, Dongfeng, and Seres. That combination matters because it separates three layers of proof: realized revenue, signed vehicle programs, and future pipeline. Realized revenue is strongest in domestic OEMs and related-party Great Wall demand; localized Thailand deliveries add current proof for Great Wall and Hozon in Southeast Asia; ESS is visible as a product and expansion vector, but named paying ESS buyers are not publicly evidenced with the same clarity.'
