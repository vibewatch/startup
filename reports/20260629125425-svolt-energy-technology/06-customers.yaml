- id: expansion-and-concentration-risk
  title: Expansion and Concentration Risk
  body: Customer concentration is still the central customer risk. The filing disclosed related-party sales equal to 99.40 percent of revenue in 2019, 96.09 percent in 2020, 82.73 percent in 2021, and 53.39 percent in 1H22, while top-five customers still represented 88 percent of main-business revenue in 1H22. That is genuine diversification, but it is not yet a broad, low-risk customer base. The Thailand JV reduces single-country manufacturing concentration and adds localized Southeast Asian proof, but current named Thai recipients are still mostly Chinese OEM brands, so country diversification does not yet equal customer diversification. The overseas narrative could improve if Stellantis, VinFast, or MINI programs show customer-side confirmation, but the 2024 European retreat is a real adverse counterweight because it weakens the credibility of a Europe-heavy expansion path. The practical conclusion is that SVOLT has crossed the threshold from aspiration to commercialization, but not from
    concentrated customer portfolio to durable, fully transparent multinational account base.
