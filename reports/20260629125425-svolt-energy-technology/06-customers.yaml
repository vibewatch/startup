  title: Current overseas named-account claims remain under-corroborated
  body: Stellantis, VinFast, Hyundai, BMW, and MINI appear in official or trade-press sources, but the reviewed set lacks customer-side confirmations. Investors should treat them as program signals, not the same proof class as disclosed filing revenue or Thai bulk deliveries.
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
- calloutType: insight
  title: ESS is strategically important but commercially opaque
  body: SVOLT consistently presents energy storage as a major business line and the Banpu partnership explicitly broadens into ESS assembly, yet public evidence of named ESS buyers, deployed MWh, and repeat orders is still missing. For now, OEM traction is proven more convincingly than ESS traction.
