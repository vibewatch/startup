- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Impact
  - Current evidence
  - Implication
  - Diligence path
  rows:
  - - Great Wall related-party dependence
    - High
    - Related-party sales were still 53.39% of revenue in 1H22 after being above 80% in prior full years
    - A single OEM group could still move utilization and revenue
    - Get 2023-2026 customer-share bridge and related-party pricing policy
  - - Top-five customer concentration
    - High
    - Top five customers still represented 88% of 1H22 main-business revenue
    - Diversification exists but remains narrow by enterprise-account count
    - Request top-10 customer mix by revenue and gross profit
  - - Thailand local-customer concentration
    - Medium
    - Current named Thai recipients are Great Wall and Hozon/Neta, both Chinese OEM groups
    - Geographic expansion does not yet equal broad end-customer diversification
    - Obtain Thai account roster, model mix, and local backlog
  - - Europe / BMW / MINI execution risk
    - Medium-High
    - Europe retreat is adverse while BMW/MINI claims remain mainly supplier-side or rumor-based
    - Weakens confidence in Europe-led premium-account expansion
    - Ask for signed contracts, SOP timing, and customer-side confirmations
  - - ESS commercialization gap
    - Medium
    - ESS is repeatedly described as a target business, but named paying ESS customers are absent
    - Cross-sell thesis is plausible but not yet publicly proven
    - Request named BESS customers, delivered MWh, and reorder data
  notes: Impact ratings are analytical judgments anchored in disclosed concentration data and source quality, not in a public management risk matrix.
