  topStrengths:
    - SVOLT 不是纸面创业公司：公开证据显示其已有规模化制造、泰国本地化，以及电动车电池和储能领域的真实出货。
    - 公司在 2021 年完成规模异常大的私募融资，至今仍带有活跃独角兽标记，说明历史上打通过战略和财务资本。
    - 产品开发有差异化迹象，尤其是短刀快充电池、LMFP/LFP 封装，以及 2026 年半固态路线图。
    - 海外出货和客户开发信号显示，公司正试图摆脱单纯绑定长城的国内故事。
  topRisks:
    - 公开财务透明度已经过期；可获取的最佳招股书式披露止于 1H22，当前利润率、现金消耗和举债能力都不清楚。
    - 长城集中度已有改善，但结构上仍重要；公开证据显示，最后一个披露财期仍有较重关联方敞口。
    - IPO 撤回后欧洲制造收缩，是资本强度和国际执行风险真实存在的实质信号。
    - 当前 RMB 62 billion / 约 US$7.2 billion 的名义估值，相对过期收入证据和公开电池同行倍数偏贵。
    - 电池行业价格战、关税敞口、原材料波动和技术商业化风险，都可能在新上市或融资事件重置估值前压缩价值。
  unresolvedGaps:
    - 可获取公开语料中，未找到 1H22 之后更新的经审计或招股书式财务报表。
    - 没有公开的当前股权结构表、优先股堆叠或最新一轮精确条款，无法检验名义估值的经济含义。
    - 长城和泰国项目之外，公开客户证据并不均衡；多项被引用的国际 OEM 关系仍部分停留在目标层面，或只有间接佐证。
    - 当前员工数、全球工厂精确利用率，以及退出欧洲后的资本配置仍需管理层确认。
