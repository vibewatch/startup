- id: fast-charge-and-pack-safety
  title: Fast Charging, Dragon Armor, and the Commercial Short-Blade Pitch
  body: The commercial edge SVOLT emphasizes most aggressively is the combination of short-blade geometry, stacked-electrode production, and fast-charge performance. Official passenger and commercial pages already claim 4C passenger cells, 3C commercial recharge to 80 percent in 20 minutes, and standardized battery-box solutions across trucks and buses. The July 2024 global partner summit release pushed those claims further, adding 5C LFP cells that go from 10 percent to 80 percent in ten minutes, 6C NCM cells marketed around 500-600 km added range in five minutes, and an 800V PHEV Dragon Armor NCM pack slated for 2025 production. The useful distinction is that Dragon Armor is not being presented as a new cell chemistry. Independent reporting from CnEVPost and Electrive frames it as a pack-structure innovation — similar in category to BYD Blade or CATL Qilin — built around bottom degassing, thermal-electric separation, and better packaging efficiency. Those reports partially validate the
    pack-architecture story, but they do not independently validate long-run degradation, abuse-test data, or real customer deployment scale.
