- id: chemistry-roadmap-and-maturity
  title: 'Chemistry Roadmap: Proven LFP/NCM Platform, Experimental Semi-Solid Layer'
  body: 'SVOLT''s chemistry narrative is broader than simple LFP-versus-NCM positioning. Official technical pages show a layered roadmap: commercial LFP and NCM short-blade products today, NMX cobalt-free cathodes and high-manganese iron nickel material systems as intermediate differentiation, and semi-solid or solid-state batteries as the next wave. The more mature parts of that story are the material and cell pages describing LFP, NMX, and LMFP/NCM-blend work. The least mature part is semi-solid. Official cell pages describe the safety mechanism and baseline metrics, while January 2026 Battery Day coverage and July 2025 independent reporting push the roadmap toward 140 Ah, 300 Wh/kg first-generation cells, second-generation 360 Wh/kg targets, eVTOL variants, and Mini supply. That is enough to show serious development intent, but not enough to treat semi-solid as underwritten commercial product. The right diligence stance is that LFP/NCM short-blade is the proven platform; semi-solid is
    an advancing but still partly promotional extension.'
