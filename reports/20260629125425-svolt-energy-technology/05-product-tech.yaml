callouts:
- calloutType: strength
  title: The core differentiator is manufacturing-led reuse, not a single chemistry bet
  body: The strongest part of the public record is the reuse of stacked, prismatic short-blade architecture across passenger, commercial, and ESS products. That makes the platform more credible than a one-off concept battery.
  claimRefs:
  - CE005
  - CE010
  - CE019
  - CE040
- calloutType: risk
  title: Semi-solid and Stacking 4.0 are still roadmap-heavy layers
  body: Independent reporting shows real movement toward semi-solid production, but customer attribution, certificate detail, and scaled production proof remain incomplete. The same caution applies to Stacking 4.0.
  claimRefs:
  - CE033
  - CE034
  - CE035
  - CE049
- calloutType: risk
  title: Certificate names are public; certificate evidence is not
  body: SVOLT publicly lists major battery certifications and safety claims, yet the fetched record does not expose downloadable certificate IDs or third-party abuse-test reports for the flagship SKUs most relevant to diligence.
