- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow
  - SVOLT solution
  - Measurable benefit
  - Limitation
  rows:
  - - Passenger BEV fast-charge platform
    - OEM needs prismatic cells that fit 800V architectures and high-rate charging
    - L300-L600 short-blade cells plus 4C/5C/6C variants
    - Official claims span 4C-6C and 10-minute 10-80% charging for selected SKUs
    - Independent validation does not yet include public cycle-life results under those charge rates
  - - PHEV / EREV range extension
    - OEM wants large pack capacity without pure-BEV packaging penalty
    - 62/90Ah, 196Ah, 117Ah and 143.5Ah cells plus Dragon Armor / Fortress packs
    - Company claims 300-400 km EV-only range and higher volume utilization
    - Most range and cost claims are company-authored
  - - Commercial truck / bus energy replenishment
    - Fleet operator needs standard boxes and quick turnaround charging
    - Prismatic LFP commercial batteries and standardized box products
    - Official claim is 80% replenishment in 20 minutes at 3C with <10°C internal delta
    - Public proof of uptime and maintenance outcomes is thin
  - - C&I ESS deployment
    - Integrator wants modular cabinet with grid and microgrid compatibility
    - 222Ah-based cabinet and integrated products
    - Company claims >8,000 cycles and broad use-case compatibility
    - Public certificate IDs and long-run availability metrics are not disclosed
  - - Utility-scale ESS project
    - Project developer wants multi-MWh block with low BOS and O&M burden
    - 5.16 MWh / 6.29 MWh liquid-cooled stacked-cell systems
    - CTR integration, AI-BMS, and dual-side cooling are marketed as lower-cost, longer-life architecture
    - Independent project-performance datasets remain limited
  notes: Benefits are quoted only where public materials offer explicit numbers; otherwise the row records the architecture claim and the missing external proof.
