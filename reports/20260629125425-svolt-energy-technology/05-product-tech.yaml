  rows:
  - - Passenger short-blade cell family (L300-L600)
    - Passenger EV / PHEV / HEV OEMs
    - Commercial platform with active refreshes
    - Prismatic short-blade format tuned for 800V and fast-charge integration
    - No public SKU-by-SKU shipment split or field degradation data
  - - Dragon Armor pack platform
    - PHEV / EREV passenger programs
    - Launched in 2022; second-generation update public in 2025
    - Bottom degassing plus thermal-electric separation and high packaging efficiency
    - No public third-party pack teardown or abuse-test report
  - - Commercial vehicle battery boxes and cells
    - Heavy trucks, light trucks, buses, construction machinery
    - Commercial with standardized box approach
    - Shared passenger/commercial development base and 3C replenishment claim
    - Vehicle-program deployment counts and warranty data are sparse
  - - Semi-solid and solid-state program
    - Premium EV, eVTOL, future auto programs
    - Pilot to pre-commercial roadmap
    - 300-360 Wh/kg roadmap with safety-led positioning
    - BMW/Mini link and mass-production timing remain media-reported rather than OEM-confirmed
  - - Energy-storage stack
    - Residential, C&I, utility integrators
    - Commercial and expanding
    - Stacked cells, CTR integration, dual-side cooling, AI-BMS
    - Few public third-party cycle-life or fire-test reports
  - - Cloud monitoring platform
    - Fleet / ESS operators and after-sales teams
    - Operational service layer
    - Battery lifecycle analytics, early warning, residual-value assessment
    - No independent audit of warning accuracy or service outcomes
  notes: Status labels separate commercial platform evidence from roadmap-only items; missing public reliability or deployment detail is surfaced as a diligence gap rather than assumed positive.
