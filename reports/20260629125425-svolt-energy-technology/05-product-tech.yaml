- id: trust-certification-and-validation-gaps
  title: Trust, Certification, and Where the Public Record Is Still Promotional
  body: 'On trust and quality controls, SVOLT discloses more than many private peers but still less than an underwriter would want. The profile page names specific standards and certificates for energy-storage and power-battery products, including IEC 62619, IEC 63056, CB, CQC, UL1973, and R100. The compliance and environmental pages also outline ISO 37301-guided compliance management, NMP exhaust recovery, hazardous-waste handling, and a 100 percent pollutant-compliance claim. Those are useful signals, but the public record does not expose certificate IDs, downloadable test reports, or third-party abuse-test data for the headline products. Independent corroboration is strongest for the existence of the platforms and weakest for the most marketing-sensitive performance claims. The European factory cancellation is also a real product-tech risk signal: it does not invalidate the underlying cell and pack technology, but it does show that manufacturing-roadmap promises can be reversed when capital
    intensity outruns financing. Similarly, media reports about BMW/Mini supply are directionally supportive but not OEM-confirmed. The net result is a credible technology platform with incomplete independent validation at the certificate, test-report, and roadmap-conversion layers.'
