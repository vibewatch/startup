  evidenceGaps:
  - type: missing-source
    severity: material
    topic: certificate-verification
    missingEvidence: Public certificate IDs, downloadable CB/CQC/UL/R100 files, or certifier registry entries for the named SVOLT SKUs.
    whyItMatters: Without certificate identifiers, investors cannot verify whether the public standards claims map to current commercial products or legacy test samples.
    diligencePath: Request the certificate numbers, issuing bodies, model mappings, and latest test reports for the 222Ah/325Ah/350Ah ESS cells and named power-battery platforms.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: fast-charge-field-reliability
    missingEvidence: Third-party cycle-life, warranty, or degradation data for 4C-6C short-blade cells and Dragon Armor packs under real customer duty cycles.
    whyItMatters: Fast-charging claims are central to differentiation, but field-life tradeoffs can erase value if they are not validated outside launch marketing.
    diligencePath: Ask for customer qualification reports, cycle-life distributions, warranty reserve history, and any third-party lab abuse-test results for 4C-6C cells.
    relatedQuestionRefs:
    - QE010
    - QE012
    - QE024
  - type: private-evidence-only
    severity: material
    topic: mini-oem-confirmation
    missingEvidence: An OEM statement, homologation filing, or customer program document confirming BMW Mini adoption of SVOLT semi-solid cells.
    whyItMatters: Named-customer validation would sharply increase confidence that semi-solid work is converting from prototype status into real program revenue.
    diligencePath: Request executed supply-agreement excerpts, platform SOP timing, and customer qualification gates tied specifically to the Mini program.
    relatedQuestionRefs:
    - QE016
  - type: private-evidence-only
    severity: material
    topic: stacking4-yield
    missingEvidence: Independent yield, scrap-rate, uptime, or cost-per-Wh data for Stacking 4.0 and the latest Fly Stacking lines.
    whyItMatters: Manufacturing process economics are a core part of SVOLT's differentiation, and capex-heavy ramp claims are hard to underwrite without operational proof.
    diligencePath: Ask for line-yield history, OEE, scrap rates, capex/GWh, and production qualification data for Stacking 3.0 and Stacking 4.0 lines.
    relatedQuestionRefs:
    - QE005
    - QE006
    - QE023
    - QE025
