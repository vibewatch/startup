- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - NMX / LMFP / LFP material systems
    - Set the cost-safety-energy-density envelope for the platform
    - Cathode chemistry, electrolyte, and manufacturability tuning
    - Public comparisons are mostly company-generated and not lab-verified externally
  - - Fly Stacking / high-speed stacking
    - Core electrode-manufacturing process for prismatic short-blade cells
    - Yield, precision equipment, drying-room economics, and scale-up discipline
    - Stacking 4.0 and next-wave efficiency claims remain roadmap-heavy
  - - Short-blade prismatic cell format
    - Common cell form factor reused across passenger, commercial, and ESS
    - Vehicle and rack integration, thermal path, and pack volumetric efficiency
    - Format reuse helps cost, but field reliability by segment is not public
  - - Dragon Armor pack architecture
    - Pack-level safety and packaging system for high-rate passenger packs
    - Bottom venting path, thermal-electric separation, cooling, and structural support
    - Safety claims are credible in concept but public abuse-test reports are missing
  - - CTR / liquid-cooling ESS architecture
    - Raises space use and thermal consistency in stationary storage
    - Rack design, cooling loop, BMS coordination, and fire-protection system
    - Most performance deltas come from company or company-sourced press coverage
  - - Cloud monitoring and AI-BMS
    - Post-deployment early warning, diagnostics, and optimization
    - Telematics data quality, models, service response loop, and customer adoption
    - No public audit of the 98% warning-accuracy claim
  notes: This table isolates the architectural layers that recur across product lines; risks focus on what still lacks independent process, validation, or field-performance disclosure.
