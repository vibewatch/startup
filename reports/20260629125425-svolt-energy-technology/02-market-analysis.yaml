  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Global EV deployment scaling toward ~3 TWh by 2030
    - Driver
    - Medium term
    - Keeps automotive batteries as the largest demand pool for any supplier with viable programs
    - How much of SVOLT volume can realistically ride non-China EV growth?
  - - LFP cost advantage and chemistry diffusion
    - Driver
    - Current
    - Supports short-blade and cost-led automotive positioning, especially in China and emerging markets
    - What portion of SVOLT pipeline is LFP versus higher-nickel platforms?
  - - Storage growth from energy shifting, renewables, data centers, and EV charging
    - Driver
