company:
  name: SVOLT Energy Technology
chapter:
  number: 2
  title: Market Analysis
  summary: 'SVOLT addresses two adjacent battery markets: EV traction batteries, where global 2025 demand
    reached about 1.2 TWh and China still anchors the biggest volume pool, and stationary storage, where
    2025 additions also set new records. The company remains a small-share challenger versus CATL and
    BYD, but its short-blade LFP, PHEV, semi-solid, Thailand localization, and ESS push create a differentiated
    path into ASEAN, selected export OEM programs, and storage channels. The main constraint is that public
    data do not yet show how fast reported design wins and product differentiation convert into recurring
    GWh and revenue.'
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitutes
  body: SVOLT should be analyzed as a battery supplier operating across two adjacent demand pools rather
    than as a pure EV-cell company. The included spend is battery cells, packs, and system-level hardware
    sold into passenger EV, PHEV, HEV, residential storage, commercial-and-industrial storage, and utility-scale
    storage programs. That means the real market boundary sits at electrochemical energy-storage value
    delivered to OEM platforms or storage-system buyers, not at the full vehicle price, solar project
    EPC budget, or upstream mining value chain. The most relevant substitutes are incumbent cell suppliers
    such as CATL, BYD, LG Energy Solution, Panasonic, CALB, and Gotion on the automotive side, plus incumbent
    LFP-based storage platforms and integrators on the ESS side. Excluded spend includes raw mining, full
    vehicle assembly, charging hardware, standalone power electronics outside the battery system, and
    unrelated energy-software budgets. This boundary matters because the company is trying to win share
    through chemistry, form factor, charging performance, localization, and system integration, while
    demand is still ultimately governed by EV adoption and grid-storage buildout.
