- id: buyers-and-technology-fit
  title: Buyer segmentation and technology fit
  body: 'Buyer segmentation is not one-dimensional because SVOLT sells into both automotive and storage
    workflows. The direct EV buyer is usually an OEM or an OEM-affiliated procurement organization that
    cares about qualified chemistry, pack architecture, launch timing, service support, and localization.
    In Southeast Asia, the Thailand plant shifts the adoption path from export-only supply to local industrial
    participation, which matters for delivery speed and political acceptance. In storage, the buyer set
    changes to distributors, installers, EPCs, integrators, and utility-scale project developers whose
    budget logic is based on lifecycle cost, safety, uptime, and project execution rather than vehicle
    range. SVOLT''s product map is correspondingly segmented: short-blade LFP and PHEV packs support higher-volume
    automotive programs, semi-solid batteries aim at premium EV and eVTOL niches, and stacked cells feed
    residential, C&I, and utility-scale ESS formats. That split explains why the company''s market fit
    cannot be read from EV share alone; the storage channel gives it another route to monetization and
    international relevance.'
