- id: where-svolt-fits-and-open-gaps
  title: Where SVOLT fits versus giants and what remains unresolved
  body: SVOLT is not competing with CATL and BYD on sheer scale today; the share data make that clear.
    Its more realistic market position is as a differentiated mid-tier supplier that tries to win on short-blade
    form factor, PHEV fast charging, semi-solid timing, ASEAN localization, and a second growth leg in
    energy storage. That strategy can work in slices of the market where buyers are still choosing platforms
    and where localization matters more than global balance-sheet dominance. But several key inputs for
    a harder SOM view remain opaque. Public sources do not confirm how much of the reported BMW or other
    export-side design-win pipeline converts into recurring revenue, how the stated 61 GWh 2026 shipment
    target splits between domestic and overseas programs, or what proportion of current volume and revenue
    is already ESS rather than automotive. Those gaps do not invalidate the market thesis, but they materially
    limit precision on near-term monetization and on how fast SVOLT can widen the gap between product
    differentiation and actual installed share.
  claimRefs:
  - CM040
tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to SVOLT
  rows:
  - - China power batteries
    - Cells, modules, and packs for BEV, PHEV, and HEV programs sold into Chinese OEM production
    - Full vehicle assembly, charging networks, upstream mining
    - Chinese OEM procurement and platform teams
    - Core current volume pool and the clearest observed domestic share lens
  - - Global EV traction batteries
    - Automotive battery supply outside China, including Europe-facing and ASEAN programs
    - ICE powertrains, non-battery vehicle content
    - Global OEMs, JVs, and tiered procurement teams
    - Primary route for export growth and premium-program design wins
  - - Residential ESS
    - Home storage cells, modules, and systems used with rooftop solar or backup applications
    - Standalone solar generation, smart-home software without battery hardware
    - Distributors, installers, residential energy brands
    - Relevant because SVOLT markets 122 Ah stacked residential cells through partner channels
  - - C&I and utility ESS
    - Battery racks, containers, integrated cooling and BMS sold into commercial and grid projects
    - Transmission assets, inverters and EPC scope outside the battery system
    - Integrators, EPCs, developers, utilities, large energy users
    - Important adjacent pool where SVOLT now markets 285 kWh and 6.29 MWh systems
  - - Adjacent but excluded areas
    - Battery recycling cooperation, eVTOL pilots, future solid-state options
    - Raw-material mining, generalized energy software, unrelated vehicle systems
    - Partners and pilot customers
    - Strategically relevant but not yet a clean primary SAM lens from public data
  notes: Boundary is defined at battery-system value delivered into EV and ESS workflows; mining, full
    vehicles, and non-battery infrastructure are treated as outside the core market.
