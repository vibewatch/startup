  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: design-win-conversion
    missingEvidence: Confirmed OEM or channel contract schedules showing when reported BMW or other export-side
      design wins convert into recurring production revenue.
    whyItMatters: The market thesis improves materially if reported design wins are near-term production
      programs rather than option-like future pipeline.
    diligencePath: Request customer award letters, SOP schedules, and contracted annual GWh by customer
      program during management diligence.
    relatedQuestionRefs:
    - QM022
  - type: missing-source
    severity: material
    topic: regional-shipment-mix
    missingEvidence: A management or audited source splitting the stated 61 GWh 2026 shipment plan by
      China, ASEAN, Europe, and other markets.
    whyItMatters: Regional mix determines whether localization and export claims meaningfully change addressable
      margin pools and geopolitical risk.
    diligencePath: Ask for internal shipment guidance by region and customer type, including domestic
      versus overseas utilization assumptions.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
    - TM003
  - type: missing-source
    severity: material
    topic: ev-versus-ess-mix
    missingEvidence: Publicly supportable split of current volume and revenue between automotive batteries
      and energy storage products.
    whyItMatters: Without the EV-versus-ESS split, SVOLT's true buyer concentration, margin structure,
      and market-share trajectory remain difficult to underwrite.
    diligencePath: Request segment revenue, GWh shipments, and gross margin by automotive versus ESS for
      2025 and 2026 YTD.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
    - TM005
  - type: conflicting-data
    severity: minor
    topic: semi-solid-commercialization-timing
    missingEvidence: One authoritative commercialization timeline that reconciles 2026 volume-production
      claims with 2027 BMW Mini-linked mass-supply timing.
    whyItMatters: Timing ambiguity does not break the thesis, but it changes how quickly premium-program
      revenue can be modeled into SOM expansion.
    diligencePath: Ask for cell-line SOP dates, customer-specific PPAP or qualification milestones, and
      first paid-shipment dates by semi-solid program.
    relatedQuestionRefs:
    - QM022
    - QM025
