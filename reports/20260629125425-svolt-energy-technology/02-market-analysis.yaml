- id: sizing-lenses
  title: Evidence-constrained sizing lenses
  body: 'A classical revenue TAM is not cleanly supportable from public data because the best evidence
    mixes energy demand, storage additions, and company shipment share rather than one externally audited
    dollar pool. The most decision-useful lens is energy throughput and deployment volume. On that basis,
    global EV battery deployment reached about 1.2 TWh in 2025, China accounted for roughly 60% of that
    demand, and China''s domestic power-battery market alone was about 768 GWh by implied installation
    volume. Outside China, xEV battery installations reached 464 GWh in 2025 and continued growing in
    Q1 2026, which is important because that is the part of the automotive market where SVOLT''s localization
    and export strategy can widen share fastest. The adjacent ESS opportunity is already large enough
    to matter on its own: battery storage additions reached roughly 108-112 GW in 2025 depending on the
    lens, with utility-scale storage taking the majority. The chapter therefore uses a layered sizing
    approach: global EV demand as the broadest opportunity, China and ex-China demand as more useful regional
    lenses, stationary storage as the adjacent second pool, and SVOLT''s current installed share as the
    closest observable SOM.'
