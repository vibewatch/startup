      - number: '7.3'
        title: 国内价格战抬高了小规模生存成本
        blocks:
          - type: paragraph
            body: >-
              下一层风险是竞争压缩。IEA 称，2024 年全球电池需求已超过 1 TWh，平均电池包价格跌破 USD 100/kWh； 但健康的终端市场讯号，并不能保护二线供应商免受残酷供给格局挤压。IEA
              评论称，中国目前生产了全球销售电池的四分之三以上， 2024 年中国电池价格下跌近 30%，快于其他任何地区。SCMP 给出更尖锐的表述：中国电池制造产能到 2025 年可能达到 4,800 GWh，约为 EV
              厂商需求的四倍；分析师警告，小玩家可能被迫倒闭。这正是 SVOLT 试图提升规模的语境。


              SVOLT 自己的 2025-2026 年数据同时显示牵引力和脆弱性。CnEVPost 给出的公司 2025 年中国份额仅 2.70%、全球份额 2.4%；官方 Q1 2026 新闻稿称，装机量增长 33.6%
              至 6.5 GWh，份额提升到 2.7%，原因是海外市场带动增长。 Gasgoo 报道 2026 年 1-2 月海外出货 1.66 GWh，占总出货
              39%，并明确引用“海外扩张是在激烈国内竞争中求生存和增长的必要选择”。 SVOLT 官方新闻称已开始向 Stellantis 和 VinFast 交付；TMTPost 描述了一个大型 BMW
              供应项目，但在本次审阅材料中， 该项目仍属于媒体报道而非申报文件支撑。结论是，出口增长真实存在，但它是在抵消结构性更艰难的国内市场， 而不是放大一个已经舒适盈利的基础盘。
