      - number: '4.4'
        title: 产能扩张、泰国牵引与欧洲收缩
        blocks:
          - type: paragraph
            body: >-
              关于 SVOLT 财务姿态，最强的公开证据来自它选择继续花钱的地方，以及选择撤退的地方。官方和合作伙伴材料称，2021 年融资将支持到 2025 年超过 200 GWh
              产能，并建设多个中国和海外基地。泰国似乎是资本开支更轻的海外路径：EqualOcean 描述投资约 USD 30 million，SVOLT 官方新闻稿显示 2024 年开始生产和批量交付，Gasgoo
              随后报道泰国 JV 已生产第 10,000 套电池包，良率 99.9%。Gasgoo 还称，2026 年 1-2 月海外出货达到 1.66 GWh，占总出货 39%，意味着即便欧洲被削减，出口牵引仍在延续。


              相比之下，欧洲是最清晰的负面融资信号。多家媒体报道，规划中的 Saarland 工厂为 24 GWh、投资约 EUR 20 亿，另有一座 Brandenburg 电芯工厂 16 GWh，目标 2025
              年投产。随后 SVOLT 确认将自 2025-01-31 起终止欧洲公司和德国子公司。CnEVPost 援引 Caixin 来源报道称，两个欧洲项目需要约 RMB 300 亿元，SVOLT
              首先必须解决资金问题。这一顺序比头部地理迁移更重要：它显示，在公开市场融资消失后，公司优先推进票面更低的泰国执行和当前出口，同时放弃资本最重的海外项目。
