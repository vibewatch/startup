  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与已披露表现
        blocks:
          - type: paragraph
            body: >-
              SVOLT 的公开收入模型是工业和项目制，而不是订阅式。招股书和公司简介描述了电芯、模组、电池包和储能系统的变现，收入通过 OEM 和项目出货确认。最干净的披露结构来自 1H22：电池包贡献 RMB 20.9
              亿元收入，占总收入 60%；模组 RMB 7.00 亿元，占 20%；电芯 RMB 6.34 亿元，占 18.22%。这一结构很重要，因为它显示 SVOLT
              已经作为组装电池系统的规模化供应商运营，而不是单纯材料或授权故事。


              作为承销判断基础，收入轨迹真实但不完整。可取得的招股书时期来源显示，收入从 2019 年 RMB 9.292 亿元增至 2020 年 RMB 17.36 亿元、2021 年 RMB 44.74 亿元和 1H22
              RMB 37.38 亿元；官方融资材料还单独称，SVOLT 已拿到主流车企 25 个销售定点和 RMB 160 亿元 Stellantis 订单。不过，可取得来源均未披露实际
              ASP、折扣结构或产品级毛利率。因此，公开证据证明了商业化和出货规模，但没有证明各平台收入质量，也没有证明较新的出口量是否比早期 Great Wall 占比较高的国内业务具备更好经济性。
