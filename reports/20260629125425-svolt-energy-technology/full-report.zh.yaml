              公开记录显示，SVOLT 不是尚未产生收入的电池追赶者：IPO 申报期内已有可识别、能贡献收入的 OEM 客户，客户组合到 2021 年和 1H22 已显著超出 Great Wall Motor。STAR
              Market 招股书草案披露 Great Wall 仍主导收入，但也显示 Hozon、Leapmotor、Geely 和其他 OEM 进入收入账本；签署车型定点或框架协议的客户名单很长，从
              PSA/Stellantis、Spotlight Automotive 到 Li Auto、Xpeng、Dongfeng 和
              Seres。这一组合很重要，因为它把三层证据分开：已实现收入、已签车型项目和未来管线。已实现收入最强的部分在国内 OEM 和关联方 Great Wall 需求；泰国本地化交付为东南亚的 Great Wall 和
              Hozon 增加了当前证据；ESS 作为产品和扩张方向可见，但具名付费 ESS 买方的公开证据不如车用清晰。
