        title: 可观察定价锚点，以及为什么估值真实但不完美
        blocks:
          - type: paragraph
            body: >-
              SVOLT 最强的公开估值事实是顺序性标记，而不是干净的价格发现事件。EqualOcean 和 Yicai 均称，公司在 STAR Market 申报前已经私募融资超过 RMB 20 billion，投后估值约
              RMB 46 billion。CnEVPost 随后把 2022 年 11 月招股书草案转成一个简单的 IPO 算术点：SVOLT 计划出售 25% 股权募资 RMB 15 billion，隐含目标估值约 RMB
              60 billion。上海流程撤回后， Changzhou 市级 Hurun 回顾仍把 SVOLT 放在 RMB 62 billion，保住了独角兽标签，尽管没有披露新的公开轮次条款。
              这些足以说明估值标记不是凭空捏造；但不足以说明它干净。2022-2023 年公开记录显示的是一次中止的 IPO、一个可能的香港转向， 以及对新融资轮的泛泛提法；却没有披露稀释、优先权结构或投资人保护的 2021
              年后定价私募轮。用估值语言说， 标题锚点存在，但支撑它的资本结构质量仍明显不透明。
