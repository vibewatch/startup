  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 决策流从可观察的独角兽估值出发，经过披露和可比倍数测试，最后落到继续研究 / 估值偏贵的判断。
    data:
      nodes:
        - id: headline_mark
          label: 名义私募估值
          description: Hurun / Changzhou 口径给出的锚点约 RMB 62bn（~US$7.2bn）。
        - id: latest_scale
          label: 最新公开规模代理
          description: 公开证据指向 2022 年收入约 CNY 10bn，但没有更新后的审计报表。
        - id: comp_test
          label: 公开可比测试
          description: 上市电池同业销售倍数约 1.0x 至 4.2x，中位数约 ~2.23x。
        - id: transparency_test
          label: 透明度测试
          description: 缺少当前审计财务、清晰的本轮条款和已披露优先权结构。
        - id: downside_risks
          label: 下行情景叠加
          description: 欧洲收缩、融资风险，以及当前盈利能力未经验证，都要求更高折价。
        - id: recommendation
          label: 当前判断
          description: 继续研究；高风险；按当前估值锚看，估值立场偏贵。
      edges:
        - from: headline_mark
          to: latest_scale
        - from: latest_scale
          to: comp_test
        - from: comp_test
          to: transparency_test
        - from: transparency_test
          to: downside_risks
        - from: downside_risks
          to: recommendation
    approximationNotes: 这套流程是估值决策框架，不是机械打分模型；每一道关口都会收紧名义估值锚适用的折价。
    claimRefs:
      - CV006
      - CV023
      - CV026
      - CV027
      - CV036
      - CV037
      - CV038
      - CV039
