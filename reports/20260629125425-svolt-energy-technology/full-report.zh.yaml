      - number: '4.2'
        title: 成本结构、盈利能力与资本强度
        blocks:
          - type: paragraph
            body: >-
              已披露盈利轨迹显示，公司在放量但尚未盈亏平衡。可取得的招股书时期披露显示，净亏损为 2019 年 RMB 3.256 亿元、2020 年 RMB 7.010 亿元、2021 年 RMB 11.54 亿元、1H22
              RMB 8.974 亿元。管理层将这些亏损归因于高研发强度、产能爬坡和原材料通胀，而不是需求缺失。同一申报文件显示，2021 年研发费用为 RMB 7.241 亿元，1H22 为 RMB 5.718
              亿元；经营现金流则从 2019 年负 RMB 2.717 亿元转为 2021 年正 RMB 3.499 亿元，又在 1H22 回到负 RMB 2.092
              亿元。这种模式符合一家制造商的特征：营运资本周期和投入价格可以吞没收入增长。


              资本强度在一手申报文件中也写得很清楚。截至 2022-06-30，SVOLT 报告固定资产 RMB 63.58 亿元，在建工程 RMB 59.66 亿元。对 Great Wall Motor 的关联方销售在
              1H22 仍占收入 53.39%，低于 2019 年的 99.40%，但仍高到足以让客户集中度和工厂利用率继续与一个集团绑定。换句话说，公开记录支持规模和多元化改善的判断，但没有显示在 IPO
              流程撤回前，规模已经变成自我造血。
