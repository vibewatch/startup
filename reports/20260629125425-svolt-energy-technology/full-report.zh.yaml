      - number: '5.2'
        title: 快充、Dragon Armor 与商业短刀卖点
        blocks:
          - type: paragraph
            body: >-
              SVOLT 最积极强调的商业优势，是短刀几何形态、叠片电极生产和快充性能的组合。官方乘用和商用页面已经声称乘用电芯 4C、商用 3C 充至 80% 仅需 20
              分钟，并提供覆盖卡车和客车的标准化电池箱解决方案。2024 年 7 月全球合作伙伴峰会新闻稿进一步提高这些主张，加入 5C LFP 电芯（10 分钟从 10% 充至 80%）、围绕 5 分钟增加 500-600
              km 续航营销的 6C NCM 电芯，以及计划 2025 年量产的 800V PHEV Dragon Armor NCM 电池包。关键区分在于，Dragon Armor
              并未被呈现为新的电芯化学体系。CnEVPost 和 Electrive 的独立报道将其描述为电池包结构创新——类别上类似 BYD Blade 或 CATL
              Qilin——围绕底部排气、热电分离和更高封装效率构建。这些报道部分验证了电池包架构故事，但没有独立验证长期衰减、滥用测试数据或真实客户部署规模。
