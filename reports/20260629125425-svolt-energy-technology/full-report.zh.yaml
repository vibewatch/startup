      - number: '2.5'
        title: SVOLT 相对巨头的位置与未解问题
        blocks:
          - type: paragraph
            body: >-
              SVOLT 今天并不是在绝对规模上与 CATL 和 BYD 竞争；份额数据已经说明这一点。更现实的位置是差异化中游供应商，试图凭短刀形态因子、PHEV 快充、半固态节奏、ASEAN
              本地化，以及储能第二增长腿拿单。只要买方仍在选择平台，且本地化比全球资产负债表统治力更重要，这一策略可以在部分市场切片中奏效。但更硬的 SOM 判断仍缺少几个关键输入。公开来源没有确认已报道 BMW
              或其他出口端定点管线有多少转化为经常性收入、61 GWh 的 2026 年出货目标如何在国内和海外项目之间拆分，也没有说明当前销量和收入中已有多少来自 ESS
              而非车用。这些缺口不会推翻市场论点，却实质限制了近期变现精度，也限制了对 SVOLT 能多快把产品差异化转化为实际装机份额差距的判断。
            claimRefs:
              - CM040
