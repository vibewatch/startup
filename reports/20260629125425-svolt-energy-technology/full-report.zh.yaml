      - number: '1.2'
        title: 领导层、治理与资本基础
        blocks:
          - type: paragraph
            body: >-
              即便控制权经济性仍不透明，SVOLT 的领导层可见度也强于许多中国民营电池同行。多份官方页面和经营新闻稿都将杨红新列为董事长兼 CEO；投资者关系页面进一步列出董事，并描述由股东会、董事会、监事会、管理团队和 4
              个董事会专门委员会构成的治理架构。该页面还显示 Great Wall 董事长魏建军直接进入董事会；Yicai 2023 年末报道则称，他仍是 SVOLT 实际控制人，持股超过 40%，且 Great Wall
              关联方是重要客户。资本形成方面，公开记录异常密集。SDIC 披露 2020 年 4 月战略投资；随后是 2021 年 2 月 RMB 35 亿元 Series A、2021 年 7 月由 Bank of
              China Group Investment 领投的 RMB 102.8 亿元 Series B，以及 2021 年 12 月 RMB 60 亿元 Series B+。公开估值证据不够干净：Yicai 引述
              STAR 申报前约 CNY 460 亿元估值，Changzhou 政府则在 2024 年转述 Hurun 估值人民币 620 亿元。公司在 2025 年独角兽和 PitchBook 材料中仍似乎为非上市状态，但
              2026 年没有公开披露新的定价轮。
