            body: >-
              最强的反向证据不是技术，而是组织和资本市场。SVOLT 退出 Star Market
              路径，已累计大额亏损，随后又在欧洲电池本地化第一波筛选赢家和追赶者之际关闭欧洲运营建设。这次撤退重要，因为电池竞争靠反复项目执行、本地制造可信度和资产负债表耐力取胜，不只靠漂亮的化学体系材料。与此同时，REPT
              背后的 Tsingshan 产业链、CATL 和 BYD 的销量统治力，以及韩国既有厂商仍然可观的非中国份额，都指向一些更能抵御价格压力和 EV 需求放缓的同行。即便是欧洲旗舰创业公司
              Northvolt，也显示这条增长路径有多昂贵。结论很清楚：SVOLT
