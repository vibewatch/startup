      - number: '1.3'
        title: 运营与全球版图
        blocks:
          - type: paragraph
            body: >-
              泰国是 SVOLT 全球化战略转化为实体产出的最清晰证据。官方新闻稿和独立报道一致显示，Banpu NEXT 合资项目在 2024 年 2 月进入量产，随后很快开始批量交付，并计划首个运营年出货超过 20,000
              套电池包。到 2025 年 6 月，Gasgoo 报道称泰国工厂已下线第 10,000 套电池包，同时公司正把该基地延伸到储能组装和更广泛的亚太生命周期服务。2026 年初的出货报道让这幅图更具体：Gasgoo
              称，仅 1 月和 2 月海外出货就达到 1.66 GWh，占总出货量 39%，可支持超过 30,000 辆车。市场份额证据也显示其全球规模真实但仍属第二梯队。官方 2025 年末材料称，1-10 月全球装机量
              23.7 GWh，在前 10 大供应商中增速最快；随后 CnEVPost 年终排名将 SVOLT 列为 2025
              全年全球第十、中国第七。这些来源无法回答审计后盈利能力或当前员工规模的每个问题，但确实显示公司运营已经远超试点阶段。
