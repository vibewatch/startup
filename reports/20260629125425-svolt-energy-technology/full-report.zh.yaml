            body: >-
              客户集中度仍是最核心的客户风险。招股书披露，关联方销售在收入中的占比分别为 2019 年 99.40%、2020 年 96.09%、2021 年 82.73%、1H22 53.39%；1H22
              前五大客户仍占主营业务收入 88%。这是真实的多元化进展， 但还不是一个广泛、低风险的客户底盘。泰国 JV 降低了单一国家制造集中度，也给东南亚本地化补上了现时证明； 但目前具名的泰国接收方仍主要是中国 OEM
              品牌，因此国家多元化还不等于客户多元化。如果 Stellantis、VinFast 或 MINI 项目能拿出客户侧确认，海外叙事会更好；但 2024
              年欧洲收缩是实质反向因素，因为它削弱了重押欧洲扩张路径的可信度。 实际结论是，SVOLT 已经从愿景跨到商业化门槛，但还没有从集中客户组合跨到耐久、完全透明的跨国客户底盘。
