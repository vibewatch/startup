      - number: '7.5'
        title: 缓释因素、监测项与下行情景
        blocks:
          - type: paragraph
            body: >-
              SVOLT 仍有可修复路径，但路径很窄，且高度依赖里程碑。公司不需要完美的宏观背景；全球需求仍在增长，出口业务在泰国、 面向欧洲的 OEM
              供应以及高能量密度产品开发上都有真实证明点。但若要让上行空间具备可投资性，几个条件必须同时成立。 第一，融资不透明必须结束：更新后的经审计财务、已签署资本承诺，或可信的资本市场路径，必须替代已撤回的 STAR
              流程。 第二，公司必须证明海外增长不只是中国价格战的临时泄压阀，也就是拿出更耐久的客户组合，并找到绕开 EU 和 US 贸易摩擦的路径。 第三，半固态路线图必须从公布时间表推进到实际系列产出和客户
              SOP，且不能引发保修冲击。


              如果这些条件失败，下行并不是 EV 电池卖不出去。下行在于，一个更小供应商夹在快速增长的全球需求与更快上升的资本需求、
              政策摩擦和头部竞争对手规模之间。审慎的承销姿态因此应盯具体触发器，而不是叙事：新的经审计财务、Great Wall 集中度不再结构性偏高的证据、2026 年 9
              月半固态产线证明，以及韩国治理问题的干净解决或补救。没有这些标记， 估值应压缩到一个情景：SVOLT 仍有商业相关性，但战略上被资本配给和政策敏感型出口困住。
