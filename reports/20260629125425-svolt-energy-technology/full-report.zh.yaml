      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              SVOLT
              的收入质量强于尚未产生收入的电池追赶者，因为公开记录显示了真实出货规模、已披露产品结构、锚定客户和泰国运转中的海外生产。但利润率路径仍偏猜测，因为这里没有公开来源披露电池包、模组、电芯或储能系统的实际定价、毛利率、质保成本或工厂层面盈利。IPO
              撤回前，收入增长伴随亏损扩大、较高关联方集中度和持续大额资产建设，这是制造规模尚未成熟为耐久盈利能力的典型信号。


              最重要的承销阻断项是数据陈旧。最新可直接取得的一手申报文件止于 2022-06，早于 2023 年 12 月 IPO 撤回、2024 年德国项目取消，也早于 Gasgoo 引述的 2026
              年出口结构。这意味着当前现金、月度消耗、runway 和替代融资都属于证据缺口，而不是可投资事实。因此，审慎财务结论是混合的：SVOLT
              已证明能融资、能出货，但如果没有更新审计报表、工厂级利润率数据，以及任何新产能周期的已签融资文件，就无法承销 IPO 撤回后的资本结构和当前盈利能力。
