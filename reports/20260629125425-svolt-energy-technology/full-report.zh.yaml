companyProfile:
  summary: >-
    SVOLT Energy Technology 是一家总部位于常州的中国电池制造商，产业根基来自 Great Wall Motor 内部电池项目，2018 年起独立运营。公司销售 EV
    电芯、模组和电池包，也提供固定式储能系统；目前已有可观运营规模，公开列示 14 个生产基地、泰国制造落点，并推进短刀 LFP/LMFP 产品、半固态电池和公用事业级 ESS
    路线图。公开证据支持其已经真实商业化并拿到重量级融资，但也显示 STAR Market IPO 中止、欧洲工厂计划收缩、客户集中风险仍在，当前财务披露并不完整。
  foundedDate: '2018-01-01'
  foundingLocation: Jintan District, Changzhou, Jiangsu, China
  headquarters: Jintan District, Changzhou, Jiangsu, China
  productSummary: 车用电芯、模组和电池包；短刀 LFP/LMFP 与三元产品；半固态电池路线图；以及覆盖户用到公用事业级的储能系统。
  customerFocus: 中国及国际车企、电池包和模组项目、储能买家；Great Wall 体系需求仍是最清晰的历史锚点。
  businessModel: 重资产制造模式，靠电池和储能硬件出货变现，并由本地化项目、OEM 定点和相邻储能扩张支撑。
