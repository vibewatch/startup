      - number: '8.4'
        title: 建议、尽调问题与投资逻辑破裂点
        blocks:
          - type: paragraph
            body: >-
              SVOLT 的多头逻辑可以理解：公司反复融到资本，仍是被认可的独角兽，仍出现在头部电池供应商出货讨论中，正在变现泰国和海外量，
              也还在推进差异化电池技术。但反论点在价格纪律上更强。公开市场投资人被要求接受一个私募标记：它高于此前私募轮锚点， 接近失败 IPO
              的愿望值，也高于多家披露更透明的上市电池供应商按过去销售额算出的水平；与此同时，SVOLT 自 1H22 以来并未公开补上核心尽调缺口。因此，在当前标记下，正确建议是继续研究，而不是买入。如果当前收入显著高于
              2022 年代理、亏损大幅收窄，且任何香港上市或私募轮都按标准条款完成，价格可能向合理靠拢。但缺少这些证明时， Hurun/Changzhou 层面的估值相对透明度和规模显得偏撑。若新融资以早前 RMB 46
              billion 水平或更低估值完成， 若当前收入仍接近 2022 年代理，或若出口和技术里程碑无法转化为更好利润率和现金生成，投资逻辑会很快破裂。
              因此，投资人应在承销标题估值前，要求更新后的经审计财务、当前资金数据，以及任何新轮融资或上市流程的精确经济条款。
