            body: >-
              RMB 62 billion 标记值得审视，主要不是因为 SVOLT 缺少经营活动，而是规模证据与财务透明度严重错配。招股书和后续报道显示， 1H22 前收入真实增长，亏损扩大，商业模式仍在吸收沉重的 R&D
              和产能成本。Yicai 后来称，在其 2023 年 12 月文章发表前一年， 公司收入达到 CNY 10 billion；这个方向性信息重要，因为它暗示 SVOLT 已经显著超过 2021 年收入基数。
              但在当前公开材料中，这个数字只是媒体报道代理，不是更新后的经审计报表。同一篇文章还称，2019 年至 2023 年上半年累计亏损超过 CNY 3 billion。与此同时，IPO 撤回后欧洲被收缩，泰国爬坡和
              Gasgoo 的 39% 海外出货占比数据又显示商业牵引力仍在延续。 换句话说，业务足够真实，值得讨论估值；但披露还不足以抹掉大幅透明度折价。投资人能看到出货、融资历史和国际执行的证据，
