      - number: '1.4'
        title: 里程碑、IPO 背景与风险信号
        blocks:
          - type: paragraph
            body: >-
              SVOLT 近期里程碑可信，但并不单向利好。积极面上，2025-2026 年公开来源描述了更成熟的技术路线图：官方 CIBF 材料将半固态电池包量产安排在 2026 年 Q3，Best Magazine 和
              electrive 将第一代半固态电池与未来 BMW Mini 项目相连，Battery-Tech 报道称 2026 年 1 月 Battery Day 同时给出 61 GWh 出货目标和公司 2025 年 Q4
              首个季度盈利。PV Magazine 还报道，SNEC 2026 上公司签下超过 8 GWh 的储能合作和供货协议，强化了管理层把储能做成车用电池之外第二支柱的努力。负面信号同样重要。SVOLT 的 STAR
              Market IPO 目标募资 RMB 150 亿元，但流程后来撤回或终止，Yicai 报道称香港更可能成为替代上市地。几乎同一时期，SVOLT 放弃两个德国工厂项目，并着手关闭欧洲实体的商业运营，理由是 EV
              市场弱于预期，且资本强度已经难以证明合理。结果是一家公司同时拥有真实产品和规模动能，也已经不得不从极度烧钱的海外制造计划中撤退。
