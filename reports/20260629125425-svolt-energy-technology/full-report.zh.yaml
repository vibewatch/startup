  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 资本强度、IPO 撤回与披露不透明
        blocks:
          - type: paragraph
            body: >-
              SVOLT 最严重的风险在于，增长模型仍然很吃资本，而公开融资路径已经在明面上断裂。2022 年 STAR Market 招股书计划募资 RMB 15 billion，仅补充营运资金就预留 RMB 2
              billion，并把锂离子电池描述为资本密集型行业，固定资产和设备投入都很重。 同一份文件显示，截至 2022-06-30，公司固定资产超过 RMB 6.3 billion、在建工程接近 RMB 6.0
              billion， 已足以说明规模扩张依赖持续外部融资，而不是自我造血。官方 2021 年融资材料也强化了这个模式：SVOLT 在冲刺 IPO 前， 已经完成 Series A RMB 3.5 billion 和
              Series B RMB 10.28 billion。


              到 2026 年，这个风险更尖锐，不只是因为旧有资本开支体量大，而是 STAR 流程撤回后缺少更新后的公开财务证据。 EqualOcean 和 Yicai 均报道，SVOLT 与保荐人 CITIC
              撤回申报，管理层转向包括香港在内的替代融资思路； 但本次审阅可获得的一手披露仍停在 2022-06。公司正试图证明出口驱动增长和新化学体系路线图，当前烧钱速度、杠杆、 契约空间和资本开支承诺却恰好不透明。历史上的
              Great Wall 集中度也仍在背景中：招股书显示 1H22 关联方销售仍占收入 53.39%。因此，投资人承销的是一家有真实产出和客户证明的制造商，但缺少一张当前经审计的资本结构地图，去支撑后欧洲时代战略。
