  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 面向 IC 的 SVOLT 当前估值评分，重点看战略相关性与可投资披露质量之间的缺口。
    data:
      items:
        - label: 市场地位
          score: 7/10
          note: 仍是有认知度的中国电池独角兽，出货有牵引，海外也有布局。
        - label: 技术 / 产品动能
          score: 6/10
          note: 半固态和产品更新支撑上行空间，但变现质量公开层面仍未证实。
        - label: 融资通道
          score: 6/10
          note: 历史融资能力很强，但 IPO 失败且当前条款未知，压低了信心上限。
        - label: 披露质量
          score: 3/10
          note: 目前可取得的审计式财务披露止于 1H22。
        - label: 盈利证据
          score: 2/10
          note: 历史亏损看得见，但当前利润率和现金生成状态看不见。
        - label: 估值纪律
          score: 3/10
          note: 按最后一个可见收入代理看，当前估值相对上市电池同业偏贵。
        - label: 退出准备度
          score: 4/10
          note: 香港上市仍有可能，但目前没有已提交文件能补上尽调缺口。
        - label: 证据质量
          score: 4/10
          note: 估值可信度高于经济性可信度；仍有太多内容依赖二手来源。
    approximationNotes: 评分是委员会速记，反映估值支撑，而不是孤立评价运营质量。
    claimRefs:
      - CV014
      - CV016
      - CV032
      - CV036
      - CV037
      - CV038
      - CV039
      - CV042
