      - number: '2.2'
        title: 受证据约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              公开数据无法干净支撑经典收入 TAM，因为最好的证据混合了能源需求、储能新增装机和公司出货份额，而不是一个经外部审计的美元池。最有决策价值的视角是能量吞吐和部署量。按这一口径，2025 年全球 EV 电池部署约
              1.2 TWh，中国约占该需求的 60%，中国国内动力电池市场仅按隐含装机量就约 768 GWh。中国之外，xEV 电池装机在 2025 年达到 464 GWh，并在 2026 年 Q1
              继续增长；这很重要，因为车用市场中，SVOLT 的本地化和出口战略最可能在这一部分更快扩大份额。相邻 ESS 机会本身已经足够大：按不同口径，2025 年电池储能新增约 108-112
              GW，其中公用事业级储能占多数。因此，本章采用分层测算：全球 EV 需求作为最宽机会，中国和中国以外需求作为更有用的区域视角，固定式储能作为相邻第二需求池，SVOLT 当前装机份额则作为最接近可观察 SOM
              的指标。
