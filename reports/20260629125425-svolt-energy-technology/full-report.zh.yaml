      - number: '4.3'
        title: IPO 撤回后的资本充足性
        blocks:
          - type: paragraph
            body: >-
              SVOLT 不是靠公开市场开始放量；它是要靠公开市场继续放量。在 STAR Market 流程结束前，公司已完成 RMB 35 亿元 Series A、RMB 102.8 亿元 Series B 和 RMB 60
              亿元 Series B+，EqualOcean 称累计披露融资超过 RMB 200 亿元。IPO 草案随后寻求再募 RMB 150 亿元，其中 RMB 20
              亿元明确用于补充营运资金，其余偏向国内电池项目和电池技术项目。招股书还称，任何资金缺口都必须用自有资金和银行贷款覆盖，说明即使交易按计划定价，管理层也已经预期外部资本仍然必要。


              IPO 撤回后，这套融资栈看起来不再那么从容。Yicai 和 EqualOcean 均报道，SVOLT 决定终止 A
              股申请，并探索替代融资路径，包括新一轮融资和可能的香港上市。最后一个可直接取得的一手资产负债表快照显示，截至 2022-06-30，公司现金为 RMB 158.15 亿元，短期借款为 RMB 4.058
              亿元；但这里没有公开来源把这笔现金向前桥接到 2024 年欧洲收缩或 2025-2026 年海外出口推进之后。因此，可承销结论很窄：SVOLT 已证明可反复获得私人资本，但当前
              runway、稀释风险和债务能力仍未验证，因为公开数据集止于 IPO 撤回后的融资重置之前。
