  - id: TV005
    title: 估值锚点桥接表
    columns:
      - 锚点
      - 公开价值 / 状态
      - 为什么重要
      - 它说明的估值质量
    rows:
      - - 申报前私人轮锚点
        - 累计融资 >RMB20bn 后，投后估值约 ~RMB 46bn
        - IPO 推进前披露最好的私人融资锚点。
        - 真实但过时；仍比指数式排名更能提供价格信号。
      - - 2022 年 STAR Market 目标
        - 融资 RMB 15bn、出让 25% 股权，隐含估值约 ~RMB 60bn
        - 显示管理层和保荐人希望公开市场按什么水平成交。
        - 未实现，因此这是要价，不是市场清算价。
      - - 2023 年 IPO 撤回
        - 上海计划终止；公司探索其他融资和潜在 HK 路径
        - 融资环境的重要负面信号。
        - 最干净的公开融资桥消失，因此折现率上升。
      - - Hurun / Changzhou 独角兽标记
        - RMB 62bn（约 ~US$7.2bn）私人市场标签
        - 当前最常被公开引用的头部估值参考。
        - 作为排名标记可信，但没有附带融资条款或审计更新。
      - - 2026 年公开证据状态
        - 手头没有披露的新定价轮，也没有当前审计财务包
        - 说明估值争论主要是可比和情景判断。
        - 头部估值更容易引用，难以承销。
    notes: 这座桥把可观察的价格标签与真正的价格发现事件分开；这一区分决定了本章结论。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV034
  - id: TV006
    title: 论点破裂与放弃触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 当前收入不及预期
        - 最新经审计年度收入仍接近 2022 年约 ~CNY10bn 代理值
        - 按陈旧数字看，当前标记仍像一个 >5x 销售额故事。
        - 不按当前标记买入；用更低倍数重新承销。
      - - 新资金定价低于此前锚点
        - 新融资按或低于约 ~RMB 46bn 成交
        - 相比独角兽头衔，释放降价轮压力信号。
        - 把估值锚点重置到新价格，而不是指数标签。
      - - 激进优先权堆栈出现
        - 融资轮或 HK pre-IPO 资金包含重清算优先权或反稀释保护
        - 头部估值高估了普通股经济性。
        - 任何承诺前，要求结构化回报测算。
      - - 执行再次收缩
        - 进一步取消工厂、出口转弱，或无法把技术里程碑商业化
        - 增长故事转弱，资本强度仍高。
        - 在当前标记下，从继续研究转向回避。
      - - 披露缺口持续
        - 虽然融资或 IPO 叙事继续，但没有刷新审计包
        - 投资者仍被要求凭信念付钱，而不是按已验证经济性付钱。
        - 信息集改善前，不承销这一标记。
    notes: 这些触发器有意设为可衡量或事件驱动，方便委员会重新审视判断，而不必重辩整个叙事。
    claimRefs:
      - CV014
      - CV016
      - CV027
      - CV033
      - CV043
      - CV044
      - CV045
  - id: TV007
    title: 最终尽调问题表
    columns:
      - 议题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 经审计的 2023-2025 年财务
        - 完整利润表、现金流量表和资产负债表
        - 需要用它替换基于陈旧 1H22 的承销。
        - 要求审计包或已提交的招股书 / 上市文件。
      - - 当前收入质量
        - 分部结构、ASP、毛利率和头部客户集中度
        - 决定 SVOLT 是否配得上溢价，还是应适用折价电池倍数。
        - 管理层数据室和工厂级报告复核。
      - - 当前流动性与债务
        - 现金、受限现金、债务排期、契约和月度烧钱
        - 检验 IPO 失败后的稀释紧迫性和偿付风险。
        - 资金库桥接和贷款方文件。
      - - 新融资或 HK 上市条款
        - 融资规模、价格、优先权堆栈、老股转让、基石条款
        - 把头部估值转化为真实普通股进入价。
        - 已签 term sheet、董事会批准或招股书草稿。
      - - 欧洲收缩经济性
        - 沉没 capex、减记、负债和任何残值
        - 厘清资本纪律是否改善，还是亏损只是被推迟。
        - Capex 备忘录和减值排期。
      - - 出口 / 技术商业化
        - 海外毛利率、半固态配套率和客户转化
        - 需要判断战略叙事能否变成盈利能力。
        - 客户项目复核和产品级 P&L。
    notes: 没有这套资料，估值仍只是情景框架，而不是真正的内在估值或相对承销练习。
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV032
      - CV034
      - CV042
