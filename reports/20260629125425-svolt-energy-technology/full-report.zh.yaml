      - number: '5.5'
        title: 信任、认证，以及公开记录仍偏宣传的地方
        blocks:
          - type: paragraph
            body: >-
              在信任和质量控制上，SVOLT 披露多于许多非上市同行，但仍低于承销方需求。简介页面列出储能和动力电池产品的具体标准与证书，包括 IEC 62619、IEC 63056、CB、CQC、UL1973 和
              R100。合规和环保页面也概述了 ISO 37301 指引下的合规管理、NMP 废气回收、危废处理，以及 100%
              污染物合规声明。这些是有用信号，但公开记录没有给出证书编号、可下载测试报告，或头部产品的第三方滥用测试数据。独立印证最强的是平台存在本身，最弱的是最受营销影响的性能主张。欧洲工厂取消也是一个真实的产品技术风险信号：它不会否定底层电芯和电池包技术，但说明当资本强度跑在融资能力前面时，制造路线图承诺可以被逆转。类似地，关于
              BMW/Mini 供货的媒体报道方向上支持论点，但没有 OEM 确认。净结果是：技术平台可信，但在证书、测试报告和路线图转化层面，独立验证仍不完整。
