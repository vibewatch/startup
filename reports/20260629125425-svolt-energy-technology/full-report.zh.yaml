  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 横跨乘用、商用和储能的短刀平台架构
        blocks:
          - type: paragraph
            body: >-
              SVOLT 应被理解为平台型电池供应商，核心产品逻辑是格式复用，而不是单一明星
              SKU。官方页面显示，乘用车、商用车和固定式储能共用一套技术栈：叠片电极、方形短刀电芯、自有材料变体、电池包集成和云端监控层。乘用应用中，公司营销 L300-L600 短刀电芯，服务 BEV、PHEV 和 HEV
              项目。商用应用中，它把相同方形 /
              标准箱逻辑复用到重卡、轻卡、客车和工程机械。储能端，组合从电芯延伸到柜、集装箱和一体化系统。这种广度很重要，因为它让制造工艺——尤其是叠片、热管理和电池包集成——比任何单一化学体系标签更重要。最强的公开证据来自官方，但至少在首页、简介、乘用、商用和储能解决方案页面之间内部一致。
