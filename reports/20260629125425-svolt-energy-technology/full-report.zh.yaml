      - number: '7.2'
        title: 欧洲退出把增长变成政策 beta
        blocks:
          - type: paragraph
            body: >-
              欧洲最清楚地展示了战略反转风险如何变成政策风险。多家媒体报道，SVOLT 在暂停 Saarland 和 Brandenburg 项目后， 将于 2025-01-31
              终止欧洲商业运营及其德国子公司。被取消的计划并不小：单个项目就包含约 24 GWh 模组和电池包产能、 约 EUR 2 billion 计划投资；Brandenburg 电芯工厂也曾以 16 GWh
              为目标。CnEVPost、EnergyTrend 和 TechNode 对底层问题的判断一致——两个项目相对于 SVOLT 的资源过于吃资本，需要约 RMB 30 billion 投资，且资金缺口未解决。
              TechNode 还补充，CATL 和 BYD 带来的国内竞争已经伤到本土运营韧性，这让欧洲撤退更像是竞争压力下的融资决定， 而不是干净的区域优先级调整。


              这次撤退重要，因为出口驱动修复现在撞上了更严的贸易和合规环境。European Commission 指引称，针对中国 BEV 的反补贴案已经以最终反补贴税收尾，税率为 7.8% 至
              35.3%；任何价格承诺路径都必须处理最低进口价格、销售渠道、 交叉补偿以及未来 EU 投资。EU 电池页面另称，新的 Batteries Regulation 已经生效，并在扩大循环性和合规义务。
              在美国，White House 宣布提高锂离子 EV 电池和电池零部件的 Section 301 关税，USTR 随后称拟议的中国关税修改大体被采纳。 也就是说，欧洲不再是简单的重启选项，更广泛的非中国路径也比
              2020-2022 年全球化故事假设的政策 beta 高得多。
