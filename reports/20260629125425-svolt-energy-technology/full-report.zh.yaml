      - number: '2.4'
        title: 需求驱动、政策与采用约束
        blocks:
          - type: paragraph
            body: >-
              最大的出货驱动仍是 EV 需求增长；IEA 预计，在现行政策和既定政策两种口径下，2030 年全球 EV 电池部署都将接近 3
              TWh。与此同时，增速最高的相邻市场是固定式储能；独立分析师预计，在电网需要更多能量时移、可再生能源并网、EV 充电支撑和数据中心灵活性之后，年新增装机将继续从 2025
              年纪录高点上升。但采用路径受区域政策和执行摩擦限制。欧洲对 SVOLT 而言是较弱的近期 SAM，弱于头部市场规模暗示，因为公司在 EV 需求疲弱和项目延期后取消了德国工厂计划；同时，EU 仍维持对中国 BEV
              的反补贴关税，并直到 2026 年才提供结构化价格承诺路径。美国对中国关联供应链更难，因为 EV 税收抵免规则已经偏向本地组装和采购，且 2025 年 9 月 30 日后购置的车辆不再符合清洁车辆抵免资格。ESS
              端摩擦则从税收抵免资格转向并网延误、许可审批，以及围绕外国制造部件的供应链安全审查。
