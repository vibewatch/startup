      - number: '2.3'
        title: 买方分层与技术匹配
        blocks:
          - type: paragraph
            body: >-
              SVOLT 同时进入车用和储能流程，买方分层并不是一维的。直接 EV 买方通常是 OEM 或 OEM
              关联采购组织，关注合格化学体系、电池包架构、车型投产节奏、服务支持和本地化。在东南亚，泰国工厂把采用路径从单纯出口供应，推进到本地产业参与；这影响交付速度和政治接受度。储能端买方则变成分销商、安装商、EPC、集成商和公用事业级项目开发商，其预算逻辑看生命周期成本、安全、可用率和项目执行，而不是车辆续航。SVOLT
              的产品图谱也相应分层：短刀 LFP 和 PHEV 电池包支持更高产量的车用项目，半固态电池瞄准高端 EV 和 eVTOL 小众市场，叠片电芯进入户用、C&I 和公用事业级 ESS
              形态。这一拆分解释了为什么不能只从 EV 份额读取公司的市场适配；储能渠道给了它另一条变现和国际化路径。
