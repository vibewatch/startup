  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              SVOLT 应被分析为一家横跨两个相邻需求池的电池供应商，而不是纯 EV 电芯公司。纳入支出包括销售给乘用
              EV、PHEV、HEV、户用储能、工商业储能和公用事业级储能项目的电芯、电池包和系统级硬件。也就是说，真实市场边界是交付给 OEM 平台或储能系统买家的电化学储能价值，而不是整车价格、光伏项目 EPC
              预算或上游采矿价值链。最直接的替代者包括车用端的既有电芯供应商，如 CATL、BYD、LG Energy Solution、Panasonic、CALB、Gotion，以及 ESS 端既有 LFP
              储能平台和集成商。排除支出包括原矿开采、整车组装、充电硬件、电池系统之外的独立电力电子，以及无关能源软件预算。这个边界很重要，因为公司试图靠化学体系、形态因子、充电性能、本地化和系统集成赢份额，但需求最终仍由
              EV 渗透率和电网储能建设决定。
