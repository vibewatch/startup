        title: 竞争格局与份额层级
        blocks:
          - type: paragraph
            body: >-
              SVOLT 身处一个分层极其残酷的电池市场。最上层是 CATL 和 BYD，两者合计控制 2025 年全球 EV 电池装机量超过一半，因此设定了行业价格、认证和资本投入节奏。其下是拥挤的中国中游梯队，由
              CALB、Gotion、EVE、REPT 和 Sunwoda 领衔；还有 LG Energy Solution、SK On 和 Samsung SDI 等韩国既有厂商，它们在中国之外仍有不成比例的影响力。欧洲有
              Northvolt 这样的追赶者，但创业路径仍重资本开支、强执行敏感。在这个背景下，SVOLT
              不是泛泛的“前十电池冠军”；它是第二梯队挑战者，全球份额仍小，中国份额低于多家国内对手，提升份额的路径依赖于拿下聚焦项目，而不是通吃市场。这样的市场结构会惩罚每一次执行失误。
