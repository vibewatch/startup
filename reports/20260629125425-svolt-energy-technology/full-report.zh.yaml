            body: >-
              SVOLT 的储能材料比乘用车页面更细，也揭示了公司如何把短刀和叠片迁移到固定式系统。官方页面描述了完整 ESS 产品线，覆盖电芯、PACK、柜、大型液冷集装箱和一体化系统，并在组合中提到 222 Ah、325
              Ah、350 Ah 和 730 Ah 电芯。主要设计主题是轻模组或无模组集成、双侧液冷、AI-BMS，以及围绕电芯本征安全和多级消防构建的安全论证。2026 年 6 月 pv magazine
              文章大体匹配这一架构，描述 371 Ah 叠片电芯、CTR 集成、双侧冷却和 6.29 MWh 公用事业级集装箱。这种印证很重要，因为它显示 ESS 技术栈不只是网站占位符。不过，多数量化收益（循环次数、O&M
              收益、效率提升、温差降低）仍由公司撰写或公司供源，而不是第三方测试报告验证。
