      - number: '7.4'
        title: 技术落地、安全质量、供应链与法律执行风险
        blocks:
          - type: paragraph
            body: >-
              SVOLT 当前的商业化路线图要求组织同时完成几件难事：跑通更低成本的出口模型、在泰国守住高质量，并按加速时间表商业化半固态或混合固液电池。 CnEVPost 和 Electrive 称，第一代 140 Ah
              半固态电池计划在 2025 年 Q4 为 BMW Mini 试生产，量产原定 2027 年。 到 2026 年 5 月，CnEVPost 和 Electrive 已在报道更激进的版本：2026 年 9
              月系列生产，成本大致接近液态电池， 同时带来安全改进，并为 100 kWh 版本实现大规模产出。Battery-Tech 又叠加了 2026 年盈利目标。如果落地成功，
              这组组合可以是正面因素；但它也抬高了风险——化学体系、成本和利润率承诺都在同一时间接受检验。


              质量和供应链风险仍披露不足。Gasgoo 的泰国里程碑令人鼓舞——10,000 个电池包、99.9% 良率；官方泰国新闻也显示， 对 Great Wall 和 Hozon 的真实交付以及更深的 Banpu
              合作。但本次审阅的公开材料没有披露保修准备、召回统计或现场失效率， 因此无法清楚承销更高规模下的质量经济性。招股书还警告，原材料价格变化会以合同滞后影响利润；如果 SVOLT 跟不上节奏，
              更快推进的钠离子或固态替代方案可能替代现有技术。在这些运营风险之上，还有治理和伙伴信任问题：BusinessKorea 报道称，韩国警方依据 Industrial Technology Protection
              Act，将前任及现任电池员工和 SVOLT 相关实体移送检方。 即便正式案件结果尚不清楚，这类指控对一家试图拿下敏感国际 OEM 项目的公司也不是好消息。
