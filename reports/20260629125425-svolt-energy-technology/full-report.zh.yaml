  - id: TP003
    title: 定价 / 打包方式对比
    notes: EV 电芯通常没有公开标价。因此，本表比较已披露的合同 / 打包姿态、技术栈，以及定价不透明对尽调意味着什么。
    columns:
      - 竞争对手
      - 公开合同 / 打包模式
      - 公开定价信号
      - 包含能力
      - 未知项 / 折扣
      - 含义
    rows:
      - - SVOLT
        - 商供模式；短刀电芯、龙鳞甲电池包、半固态路线图
        - 传闻 BMW 订单约 RMB 0.6/Wh；没有广泛公开标价
        - 电芯、模组、电池包、ESS、回收
        - 没有经过验证的项目级定价或利润率披露
        - SVOLT 的胜负更可能取决于具体项目的打包和充电主张，而不是透明的规模定价
      - - CATL
        - 长期供应 OEM 与 ESS，化学体系菜单很宽
        - 没有公开标价；市场份额显示议价能力强
        - 乘用 EV、商用车、ESS、回收
        - 西方市场的确切定价和 IRA 时代折扣未知
        - 成本领先来自规模和本地化深度推断，而不是标价
      - - BYD
        - 整车内部集成，加上选择性外供
        - 没有公开商供价格曲线
        - Blade Battery、Super DM、e-Platform 3.0 自有平台
        - BYD 生态内的外部转移定价不透明
        - 自有需求让 BYD 能优化经济性，不必依赖公开市场商供定价
      - - CALB
        - 以方案牵引的 BEV / PHEV / ESS 打包
        - 没有公开价格披露
        - 快充、全气候、固态营销主张
