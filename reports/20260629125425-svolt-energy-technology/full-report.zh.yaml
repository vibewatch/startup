chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品范围
        blocks:
          - type: paragraph
            body: >-
              SVOLT 更应被看作一家大型中国电池和储能制造商，而不是单一产品创业公司。公司官方页面一贯称，业务成立于 2018
              年，总部位于常州金坛区，销售电芯、模组、电池包、电池管理系统、储能产品和回收解决方案。相同官方材料也给出更长的产业脉络：SVOLT 源自 2012 年启动的 Great Wall Motor
              电池项目，也就是说，公司主体比运营积累更年轻。这一区分很关键，因为它解释了为什么公司既像一家风投支持的独角兽，又像一家已经放量的制造商。公开资料也支持其当下规模已经不小。官方页面列示 14 个全球生产基地、3
              个研发中心、超过 11,000 件专利申请，以及 2019-2025 年累计 RMB 52 亿元研发投入。这些是公司口径而非审计文件，但足以解释为什么后续关于激进国际化和下一代化学体系开发的说法具备一定可信度。
