  - id: FR001
    title: SVOLT 风险热力图
    type: matrix
    layout: wide
    summary: 按严重程度排序的热力图，展示截至 2026-06-29 融资、贸易、执行和治理风险如何叠加。
    approximationNotes: 可能性和影响标签是锚定公开引用记录的分析师判断；SVOLT 未发布企业风险矩阵。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 严重影响
          values:
            - 韩国案件升级为 OEM 信任损失
            - 欧盟 / 美国贸易规则冲击
            - IPO 撤回后的资本缺口
        - label: 高影响
          values:
            - 质保或现场质量意外
            - 欧洲级资本开支冒进重演
            - 国内价格战挤压利润率
        - label: 中等影响
          values:
            - Banpu / 泰国需求落空
            - 原材料价格传导滞后
            - 半固态进度滑坡
        - label: 较低影响
          values:
            - 治理不透明延续
            - 客户结构披露仍薄
            - EU 合规建设成本漂移
    claimRefs:
      - CR008
      - CR013
      - CR017
      - CR021
      - CR029
      - CR038
      - CR043
      - CR044
      - CR045
