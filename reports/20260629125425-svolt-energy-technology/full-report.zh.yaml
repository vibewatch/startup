            body: >-
              压力测试 SVOLT 当前私募估值，最干净的方法是拿它和每季度都能观察收入规模的上市电池供应商比较。按 2026 年 6 月 CompaniesMarketCap 截图，CATL 约按 4.2x 销售额交易，LG
              Energy Solution 约 3.6x，EVE Energy 约 2.2x， Samsung SDI 约 1.2x，BYD 约 1.0x。分散度本身很重要。CATL
              享有溢价，因为它是中国占主导地位的电池冠军， 披露、公开市场流动性和已证明盈利能力都强得多；BYD 作为电池可比公司不够纯，因为它是更广泛的 EV 和制造集团； EVE、LGES 和 Samsung SDI
              则框定了有规模电池厂商在周期性与盈利问题下的中低端公开区间。如果 SVOLT 最后可见的收入代理是 Yicai 给出的 2022 年 CNY 10 billion，那么 RMB 62 billion 标记意味着约
              6.2x 过去销售额；若用用户约 US$7.2 billion 的简写，对应约 US$1.4 billion 收入，则约为 5.1x。这高于公开可比中位数，也高于数家透明度高得多的上市同行。 若要在约 2.23x
              的可比中位数上支撑同一估值，SVOLT 需要约 US$3.2 billion 年收入；在 1.23x 时几乎需要 US$5.9 billion； 只有在 CATL 式 4.2x 溢价下，门槛才会降到约
              US$1.7 billion。整个估值争论都落在这个区间里。
