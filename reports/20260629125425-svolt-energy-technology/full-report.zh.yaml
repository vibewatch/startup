            body: >-
              SVOLT 的化学体系叙事不只是简单的 LFP 对 NCM。官方技术页面展示分层路线图：今天商业化的 LFP 和 NCM 短刀产品，中期差异化的 NMX
              无钴正极和高锰铁镍材料体系，以及下一波半固态或固态电池。故事中更成熟的部分，是材料和电芯页面对 LFP、NMX 以及 LMFP/NCM
              混合工作的描述。最不成熟的是半固态。官方电芯页面描述了安全机制和基线指标；2026 年 1 月 Battery Day 报道和 2025 年 7 月独立报道，则把路线图推向 140 Ah、300 Wh/kg
              第一代电芯、第二代 360 Wh/kg 目标、eVTOL 变体和 Mini 供货。这足以显示认真的开发意图，但不足以把半固态视为可承销商业产品。正确尽调立场是：LFP/NCM
              短刀是已验证平台；半固态是正在推进但仍带部分宣传属性的延伸。
