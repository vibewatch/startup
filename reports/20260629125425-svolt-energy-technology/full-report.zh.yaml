        - 正极化学体系、电解液和可制造性调校
        - 公开对比大多由公司生成，未获外部实验室验证
      - - Fly Stacking / 高速叠片
        - 方形短刀电芯的核心电极制造工艺
        - 良率、精密设备、干燥房经济性和规模化纪律
        - Stacking 4.0 和下一波效率主张仍高度依赖路线图
      - - 短刀方形电芯形态
        - 乘用、商用和 ESS 复用的通用电芯形态
        - 整车和机架集成、热路径、电池包体积效率
        - 形态复用有助降本，但分细分场景的现场可靠性并未公开
      - - Dragon Armor 电池包架构
        - 面向高倍率乘用电池包的包级安全和封装系统
        - 底部排气路径、热电分离、冷却和结构支撑
        - 安全主张在概念上可信，但公开滥用测试报告缺失
      - - CTR / 液冷 ESS 架构
        - 提升固定式储能的空间利用和热一致性
        - 机架设计、冷却回路、BMS 协同和消防系统
        - 大多数性能差异来自公司或公司供稿的媒体报道
      - - 云监控和 AI-BMS
        - 部署后的早期预警、诊断和优化
        - 车联网数据质量、模型、服务响应闭环和客户采用
        - 98% 预警准确率主张没有公开审计
    notes: 本表拆出各产品线反复出现的架构层；风险聚焦仍缺少独立工艺、验证或现场性能披露的环节。
