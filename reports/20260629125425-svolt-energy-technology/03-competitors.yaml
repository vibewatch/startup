  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Current revenue mix by Great Wall affiliates, external OEMs and ESS customers for 2025 and YTD 2026.
    whyItMatters: Without the mix, SVOLT’s diversification versus CATL/BYD remains directional rather than underwritten.
    diligencePath: Request management reporting or customer concentration disclosure by counterparty group.
    relatedQuestionRefs:
    - QP014
  - type: conflicting-data
    severity: material
    topic: bmw-program
    missingEvidence: Official confirmation of BMW program volume, SOP timing and awarded chemistry / pack scope for SVOLT.
    whyItMatters: BMW is the clearest proof point for premium overseas traction, but public reporting still leans on rumor and secondary sourcing.
    diligencePath: Obtain BMW or SVOLT contract confirmation, SOP timing and awarded GWh by region.
    relatedQuestionRefs:
    - QP015
  - type: missing-source
    severity: material
    topic: battery-pricing
    missingEvidence: Comparable public contract pricing, rebate or margin data across SVOLT, CATL, BYD, CALB and Korean incumbents.
    whyItMatters: Competitive positioning in batteries is heavily economic, but public sources rarely disclose realized cell pricing.
    diligencePath: Collect OEM sourcing disclosures, supplier presentations or channel checks that translate public program wins into unit economics.
    relatedQuestionRefs:
    - QP016
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: site-utilization
    missingEvidence: Plant-by-plant utilization, contribution margin and capex commitments for SVOLT’s China and Thailand footprint after the Europe withdrawal.
    whyItMatters: Share alone does not reveal whether SVOLT’s footprint is an operating advantage or an underutilized fixed-cost burden.
    diligencePath: Request site utilization and margin bridge by base, including Thailand and Huzhou.
    relatedQuestionRefs:
    - QP021
    - QP025
  - type: missing-source
    severity: minor
    topic: gotion-footprint
    missingEvidence: Cleaner English-language official disclosure of Gotion’s current non-China manufacturing and OEM footprint.
    whyItMatters: Gotion clearly outranks SVOLT on share metrics, but public footprint detail is thinner than for CATL, LGES or Samsung SDI.
    diligencePath: Pull Gotion annual report or investor deck and map plant / OEM exposure by geography.
