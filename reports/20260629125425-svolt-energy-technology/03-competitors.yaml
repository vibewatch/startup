company:
  name: SVOLT Energy Technology
chapter:
  number: 3
  title: Competitors
  summary: SVOLT is an innovative but clearly second-tier battery supplier. It has credible short-blade, semi-solid and export momentum, yet 2025 share remained only 2.4% globally and 2.7% in China while CATL, BYD and several mid-tier Chinese or Korean rivals retained broader scale, localization and customer leverage. The Europe retreat and unresolved concentration / pricing questions are the biggest reasons SVOLT is not obviously top-tier despite real technical progress.
sections:
- id: share-stack-and-landscape
  title: Landscape and share stack
  body: SVOLT competes in a brutally stratified battery market. At the top sit CATL and BYD, which together controlled more than half of global EV battery installations in 2025 and therefore set the price, qualification and capital-investment tempo for the industry. Below them is a crowded Chinese mid-tier led by CALB, Gotion, EVE, REPT and Sunwoda, plus Korean incumbents such as LG Energy Solution, SK On and Samsung SDI that still matter disproportionately outside China. Europe contributes aspirants such as Northvolt, but its startup path remains capex heavy and execution sensitive. Against that backdrop, SVOLT is not a generic “top-10 battery champion”; it is a second-tier challenger whose global share is still small, whose China share sits below several domestic rivals, and whose path to share gains depends on taking focused programs rather than winning the market wholesale. That market structure punishes every execution miss.
