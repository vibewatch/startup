- id: TP003
  title: Pricing / packaging comparison
  notes: Public list pricing for EV cells is generally unavailable. Rows therefore compare disclosed contract/packaging posture, technology stack, and what the lack of transparent pricing implies for diligence.
  columns:
  - Competitor
  - Public contract / packaging model
  - Public pricing signal
  - Included capabilities
  - Unknowns / discounts
  - Implication
  rows:
  - - SVOLT
    - Merchant supply; short-blade cells, Dragon Armor pack, semi-solid roadmap
    - Rumored BMW deal referenced at roughly RMB 0.6/Wh; no broad list pricing
    - Cells, modules, packs, ESS, recycling
    - No verified program-level pricing or margin disclosure
    - SVOLT likely wins on program-specific packaging and charging claims, not on transparent scale pricing
  - - CATL
    - Long-term OEM and ESS supply with broad chemistry menu
    - No public list pricing; market share implies strong bargaining power
    - Passenger EV, commercial, ESS, recycling
    - Exact Western pricing and IRA-era discounting unknown
    - Cost leadership is inferred from scale and localization depth rather than list prices
  - - BYD
    - Captive vehicle integration plus selective external supply
    - No public merchant price curve
    - Blade Battery, Super DM, e-Platform 3.0
    - External transfer pricing inside BYD ecosystem is opaque
    - Captive demand lets BYD optimize economics without depending on open-market merchant pricing
  - - CALB
    - Solution-led BEV/PHEV/ESS packaging
    - No public price disclosure
    - Fast-charge, all-climate, solid-state marketing claims
    - Commercial terms and realized adoption outside China unclear
    - CALB competes on aggressive spec claims but public pricing transparency is weak
  - - EVE
    - Cell-format breadth including cylindrical programs
    - No public price disclosure
    - Prismatic, pouch, cylindrical, BMS, recycling
    - Specific BMW and other program economics undisclosed
    - Format breadth can help EVE win OEM niches where SVOLT is not yet qualified
  - - REPT
    - Integrated EV + ESS offering tied to Tsingshan resources
    - No public EV-cell price disclosure
    - ESS systems, EV cells, recycling links
    - Segment-level margin split between ESS and EV not public
    - Resource integration may matter more than headline price in commodity cycles
  - - Sunwoda
    - Diversified group battery supply across consumer, power and ESS
    - No public EV-cell price disclosure
    - Power battery, ESS, electronics scale
    - Automotive pricing and customer-mix disclosure limited
    - Diversification reduces dependence on a single EV pricing cycle
  - - Korean incumbents
    - Localized OEM contracts and premium-platform supply
    - No public list pricing; contracts tied to vehicle programs
    - Global manufacturing, premium OEM trust, ESS diversification
    - Program-level concessions and subsidy offsets opaque
    - Qualification history and localization often matter more than nominal cell price
