- id: footprint-customers-and-distribution
  title: Footprint, customer mix and distribution power
  body: 'Commercially, SVOLT’s story is mixed. Officially it has 14 production sites, 3 R&D centers and a broad product scope across passenger vehicles, commercial applications, ESS and recycling. Overseas traction is also visible: Gasgoo said exports reached 39% of total shipments in the first two months of 2026, and the company has been linked with programs involving Stellantis, Hyundai, VinFast and BMW Mini. But the counterweight is concentration and proof depth. Yicai said Great Wall affiliates remain the main clients; the BMW relationship is partly rumor-backed and later-dated than CATL’s and EVE’s established BMW programs; and Korea’s incumbents still carry deeper overseas manufacturing credibility with OEMs and energy-storage buyers. In battery supply, breadth of distribution is not just about having a website full of products. It is about validated vehicle programs, local delivery assurance, and long OEM qualification history—areas where SVOLT still trails top-tier suppliers.'
