  rows:
  - - SVOLT
    - Chinese second-tier merchant battery supplier
    - '2025 global: 28.5 GWh / 2.4%; China: 20.71 GWh / 2.70%; 14 sites claimed'
    - Passenger EV, PHEV, commercial, ESS, recycling
    - Short-blade LFP, semi-solid roadmap, export growth, Thailand and service build-out
    - Still subscale; Europe build-out reversed; customer concentration and capital pressure remain visible
  - - CATL
    - Global incumbent leader
    - '2025 global: 464.7 GWh / 39.2%'
    - Global OEMs, commercial vehicles, ESS, recycling
    - Scale, broad chemistry / ESS / recycling scope, sodium-ion and localization muscle
    - Geopolitical scrutiny in Western markets but still the benchmark on scale
  - - BYD
    - Integrated OEM + battery champion
    - '2025 global: 194.8 GWh / 16.4%'
    - Captive BYD vehicle stack plus selected external OEM supply
    - Blade Battery, Super DM, e-Platform 3.0, captive demand
    - Merchant supply optionality is smaller than its captive ecosystem advantage
  - - CALB
    - Chinese mid-tier challenger
    - '2025 China: 53.61 GWh / 6.98%; Q1 2026 non-China: 2.2%'
    - BEV, PHEV, commercial, ESS, marine, eVTOL
    - Aggressive fast-charge, all-climate and solid-state positioning
    - Still much smaller than CATL / BYD and less proven overseas than Korean incumbents
  - - Gotion High-Tech
    - Chinese mid-tier challenger
    - '2025 China: 43.44 GWh / 5.65%; Q1 2026 non-China: 3.5%'
    - Passenger EV and international OEM programs
    - Ahead of SVOLT on both China and non-China share; solid-state work in road testing
    - Public English commercial-footprint detail is thinner than larger peers
  - - EVE Energy
    - Chinese diversified battery supplier
    - '2025 China: 31.61 GWh / 4.11%; 2025 global: 31.3 GWh / 2.6%'
    - Passenger EV, cylindrical-cell OEMs, ESS, recycling
    - Broad format coverage and earlier BMW cylindrical program exposure
    - Still materially smaller than CATL / BYD and with less public global-brand presence than LGES
  - - REPT BATTERO
    - Chinese EV + ESS scale-up
    - '2025 revenue: $3.578B; No.1 residential ESS shipments; No.7 LFP power-battery installs'
    - EV, ESS, commercial vehicles, recycling
    - Tsingshan-backed vertical chain and strong ESS scale
    - Power-battery share still below first-rank leaders despite strong ESS profile
  - - Sunwoda
    - Diversified electronics-to-battery incumbent
    - No.6 in China installations; top-10 global ESS shipments
    - Power battery, ESS, consumer battery, energy service
    - Large multi-business battery platform and strong consumer-electronics base
    - Automotive battery identity is less singular than CATL / BYD / LGES
  - - LG Energy Solution
    - Korean global incumbent
    - 'Q1 2026 non-China share: 17.3%; six global production sites claimed'
    - Passenger EV, commercial EV, ESS, heavy equipment
    - Global manufacturing, NCM + LFP breadth, future-battery pipeline
    - Recent non-China share pressure from Chinese rivals
  - - SK On
    - Korean overseas-focused incumbent
    - 'Q1 2026 non-China share: 7.7%'
    - Overseas OEM programs, ESS expansion
    - U.S. manufacturing and ESS push through SK network
    - Share declined in Q1 2026 and public product surface is less broad than LGES or CATL
  - - Samsung SDI
    - Korean premium-cell incumbent
    - 'Q1 2026 non-China share: 4.5%'
    - Premium OEM EVs and U.S. ESS
    - Mercedes-Benz EV supply, U.S. ESS contract, LFP expansion
    - Recent share decline was steep and global volume remains below CATL, BYD and LGES
  - - Northvolt
    - Europe startup aspirant
    - 5,500+ employees claimed; large installed-capacity ambition
    - European OEMs, sustainability-led buyers
    - Low-carbon manufacturing narrative and Europe localization ambition
    - Economic difficulty around expansion highlights capex intensity of the model
