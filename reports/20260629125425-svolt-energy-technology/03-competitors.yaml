- id: TP001
  title: Competitor profile table
  notes: Scale figures mix global 2025 market-share data, Q1 2026 non-China rankings and official company disclosures. Customer and footprint fields are public summaries; unknowns remain around exact OEM program volumes and realized pricing.
  columns:
  - Competitor
  - Category
