- id: TP004
  title: Moat durability / competitive risk register
  notes: Severity reflects analyst judgment on competitive impact over the next 24-36 months. Mitigations are diligence asks rather than management promises.
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Short-blade and semi-solid innovation can differentiate SVOLT
    - CATL, BYD, CALB, Gotion and Korean incumbents all maintain parallel advanced-battery roadmaps
    - High
    - Request independent validation of SVOLT cycle life, safety and commercialization timing versus named peers
  - - Export momentum proves international relevance
    - Export growth can reverse if Hyundai, VinFast, Stellantis or BMW-related programs do not scale into repeat orders
    - Medium-high
    - Obtain current backlog split by OEM, region and chemistry, plus firm SOP dates
  - - 14-site footprint supports future scale
    - Europe retreat showed announced footprint is not the same as durable local manufacturing presence
    - High
    - Map operational versus planned sites, utilization and capex obligations by plant
  - - Merchant-customer portfolio can diversify away from Great Wall
    - Yicai’s main-client warning suggests concentration remains material
    - High
    - Request 2025 and YTD 2026 revenue mix by GWM affiliate, third-party OEM, ESS and aftermarket
  - - Innovation can offset subscale economics
    - CATL, BYD, REPT and LGES may outspend SVOLT or price more aggressively in slower EV demand
    - High
    - Benchmark BOM, capex intensity and gross margin by chemistry against larger peers
  - - Europe retreat reduces capex burn
    - It also weakens localization credibility versus Korean incumbents and CATL in Western OEM sourcing
    - Medium-high
    - Clarify whether Europe strategy is now service-only, export-led, or still contingent on future local manufacturing
