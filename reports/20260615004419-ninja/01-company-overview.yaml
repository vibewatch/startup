- id: founders-and-governance
  title: Founders and governance visibility
  body: 'Retained startup coverage is consistent on the core founder pair: Saud Al Qahtani and Canberk Donmez are the names repeated across Menabytes, Arab News, and Inc. Arabia. The founder story matters because public profiles frame Ninja as a local-market operating play rather than a copy-paste of European ultra-fast delivery: The Gulf Wire specifically says Al Qahtani previously co-founded HungerStation, which gives Ninja at least one founder with direct category experience inside Saudi food delivery. What remains much weaker is governance visibility. The public material retained for this run identifies founders, investor spokespeople, and operating claims, but not an official board roster, committee structure, or a detailed leadership bench on a company-controlled about page. That does not invalidate the business, but it means later chapters should treat management continuity, delegation depth, and key-person exposure as partially unresolved rather than fully verified from primary sources.'
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  tableRefs:
  - TO002
- id: capital-and-scale
  title: Capital, valuation, and operating scale
  body: 'The capital story is unusually compressed in time. By mid-2025 Ninja had raised about $250 million in a Riyad Capital-led round that set a roughly $1.5 billion valuation and pushed the company into unicorn status. The company-linked Riyad Capital statement and independent startup press agree that the round was meant to accelerate technology, logistics, geographic coverage, and new category expansion rather than simply celebrate a valuation mark. Public pre-IPO coverage then moved quickly from funding to listing preparation: by March 2026, Wamda, Mubasher, and Zawya were all reporting investor conversations, bank selection, and a Riyadh listing process under active evaluation. Public scale markers are partly company-claimed, but they are directionally strong: the app stores market 5,000-plus restaurants and 15,000-plus products; Saudi FoodTech and The Gulf Wire say Ninja operates around 100 dark stores in 28 cities; and multiple March 2026 outlets repeat roughly $1 billion of 2025
    revenue with a $1.6 billion 2026 target. Those figures establish ambition and scale, but because Ninja is still private they should be treated as pre-IPO narrative evidence rather than audited public fact.'
  claimRefs:
