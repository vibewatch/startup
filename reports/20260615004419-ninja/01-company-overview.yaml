company:
  name: Ninja
chapter:
  number: 1
  title: Company Overview
  summary: Ninja is a Saudi quick-commerce platform founded in 2022 that now operates through an official bilingual storefront, active iOS/Android apps, and a multi-vertical delivery proposition spanning groceries, food, shopping, home services, and pharmacy. Public coverage says a Riyad Capital-led 2025 round raised about $250 million at a $1.5 billion valuation, pushed the company into unicorn status, and funded a footprint of roughly 100 dark stores across 28 cities with regional expansion into Bahrain, Kuwait, and Qatar. By March 2026, IPO-preparation coverage was already active, but governance depth, audited financial disclosure, and full cap-table transparency remain material diligence gaps.
sections:
- id: identity-and-operating-surface
  title: Identity and operating surface
  body: 'Ninja now has a clear official Saudi consumer surface at ananinja.com/sa/en, plus Arabic localization and app-store distribution that point to an active, consumer-facing quick-commerce brand rather than a stealth operating shell. The homepage metadata and structured snippets expose a Riyadh address in Alyasmin, a support@ananinja.com contact, and product language centered on quick delivery 24/7. Apple''s listing names TECH-ADVANCE FOR INFORMATION TECHNOLOGY CO as provider while Google Play shows the developer name Ana Ninja, which together suggest a visible Saudi operating footprint but not a fully disclosed legal-entity map. The product surface is explicitly multi-vertical: groceries, restaurant delivery, shopping, home services, and pharmacy all appear on official surfaces, while app copy stresses 30-minute-or-less delivery, all-day availability, and local payment support. For diligence purposes, this chapter treats the official consumer surfaces as strong evidence of what Ninja
    sells and where it sells, but not as proof of margins, headcount, or corporate governance depth.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
