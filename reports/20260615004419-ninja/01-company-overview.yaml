callouts:
- calloutType: strength
  title: Rare pre-IPO speed for a Saudi consumer startup
  body: Ninja moved from a 2022 founding to a 2025 unicorn round and a 2026 IPO-preparation narrative faster than most regional consumer platforms. That pace is credible because the capital, valuation, dark-store footprint, and regional expansion story all appear across multiple independent outlets, not just a single press release.
  claimRefs:
  - CO008
  - CO012
  - CO015
  - CO028
  - CO039
- calloutType: risk
  title: Governance and audited-financial visibility lag the growth narrative
  body: Public sources are rich on funding, valuation, and storefront scale, but thin on board composition, legal-entity structure, audited revenue quality, and full leadership bench. That means the company-overview chapter can establish identity and milestones, but not close diligence on governance depth or private financial integrity.
  claimRefs:
  - CO010
  - CO016
  - CO017
- calloutType: assumption
  title: Operational profitability should be treated as a company-linked signal, not a filed result
  body: Riyad Capital and ecosystem coverage repeatedly describe Ninja as operationally profitable, but no retained public financial statement shows the exact accounting definition, margin, or cash conversion behind that claim. Later chapters should therefore use the statement as directional evidence while keeping a diligence gap open on audited profitability.
  claimRefs:
  - CO009
  - CO016
  - CO017
