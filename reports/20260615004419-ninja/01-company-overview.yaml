- id: footprint-and-milestones
  title: Footprint, category expansion, and milestone path
  body: 'Ninja''s milestone arc is notable because it combines rapid regional rollout with product broadening. The official web stack and third-party coverage together support Saudi, Bahrain, Qatar, and Kuwait as live or supported country surfaces, while the Saudi storefront is clearly localized in both English and Arabic. Beyond food and grocery, official and independent sources describe an expansion into pharmacy, cosmetics, and telemedicine-linked services, consistent with a multi-vertical quick-retail thesis rather than a single-category delivery app. Redseer''s market work helps place that thesis in context: quick retail has become a much larger share of GCC q-commerce since 2019, and leadership in Saudi has shifted repeatedly before landing with Ninja in the latest wave. The milestone path therefore is not just capital raised; it is founded in 2022, scaled across multiple GCC markets, hit unicorn status in 2025, and entered formal IPO-preparation coverage by March 2026. That combination
    is why later chapters can treat Ninja as a regional quick-commerce contender rather than a purely local app experiment.'
  claimRefs:
  - CO020
