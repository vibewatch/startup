callouts:
- calloutType: strength
  title: Density plus category breadth is the core visible moat
  body: 'Ninja''s public evidence does not prove a proprietary software stack, but it does show a repeatable operating thesis: dense local fulfilment, one-app breadth across frequent needs, and enough capital to keep deepening logistics and technology infrastructure. In a subsidy-normalizing market, that combination can matter more than a one-off discount campaign.'
  claimRefs:
  - CE001
  - CE017
  - CE021
  - CE026
- calloutType: risk
  title: Sparse primary technical disclosure keeps the moat partly unproven
  body: The chapter's biggest product-tech risk is not that Ninja lacks evidence of demand; it is that the reviewed public record never gets down to actual architecture, security-assurance, or service-quality KPIs. That leaves an investor able to see the operating shell, but not the underlying engineering rigor that would justify premium durability assumptions.
  claimRefs:
  - CE010
  - CE037
  - CE043
  - CE044
  - CE045
