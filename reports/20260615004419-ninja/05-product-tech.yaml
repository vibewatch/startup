- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / Component
  - Role
  - Public Evidence
  - Critical Dependency
  - Risk
  rows:
  - - Mobile apps (Android / iOS)
    - Consumer acquisition, browsing, checkout, tracking
    - Store listings, AppBrain package data, Sensor Tower usage snapshots
    - Google Play and Apple App Store distribution
    - Policy changes, ranking loss, or release defects would directly hit acquisition and conversion
  - - Dark stores and local inventory nodes
    - Hold curated SKUs close to demand and enable 20-to-30-minute delivery
    - Gulf Wire and Mordor dark-store references
    - Urban density, address quality, replenishment discipline
    - Tier-II expansion can dilute density and utilization
  - - Rider-dispatch and fulfilment orchestration
    - Pick, assign, route, and deliver within SLA
    - Official tracking promise plus category studies on AI routing
    - Labor compliance, maps, routing quality, local traffic
    - Higher rider formalization cost or weak batching compresses margins
  - - Demand forecasting and assortment logic
    - Keep fast-moving items in stock and reduce waste
    - Mordor and Haboubi on AI forecasting and hyper-local SKU logic
    - Data quality, historical demand, event calendars
    - No primary Ninja evidence on stockout rates or forecast accuracy
  - - Payments and post-order controls
    - Capture payment, trigger refunds, and reconcile order outcomes
    - Official app payments claim plus review evidence on refund friction
    - Card rails, wallet integrations, support workflows
    - Failed-payment and refund complaints can damage trust faster than promotions can rebuild it
  - - Analytics and growth instrumentation
    - Measure app engagement, ranking, downloads, and update cadence
    - AppBrain and Sensor Tower metrics
    - Third-party telemetry plus internal analytics not disclosed
    - No public evidence on attribution, experimentation, or cohort monitoring stack
