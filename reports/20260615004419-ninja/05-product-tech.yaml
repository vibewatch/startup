- id: trust-compliance-and-risks
  title: Trust, Compliance, and Technical Risks
  body: The key product-tech risks are not theoretical. Public review evidence shows payment failures, missed refunds, slow support, and damaged or missing orders. At the same time, Apple's privacy labels show the app handles sensitive data classes, while Saudi labor and competition rules are moving in ways that can directly change how a speed-delivery product operates. Redseer highlights pricing-regulation pressure; Mordor and Ensaan point to formal-employment overhead for riders; Trade.gov notes localization and regulatory-opacity burdens; and spoofing-scanner sites show a low-trust Ninja-like domain that could confuse users. None of those issues proves a broken product, but together they show a business whose consumer experience and compliance hygiene will matter more as promotional intensity normalizes. The biggest unresolved diligence gap is still the absence of primary security and architecture documentation that would let an investor separate a strong logistics surface from a defensible
    technical platform.
