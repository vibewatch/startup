  evidenceGaps:
  - type: missing-source
    severity: material
    topic: architecture-opacity
    missingEvidence: An engineering source that names Ninja's actual cloud stack, data stores, messaging layer, and observability tooling.
    whyItMatters: Without a primary technical artifact, the architecture view remains operating-model level rather than system-design level.
    diligencePath: Request an architecture review, engineering deck, or vendor list from management.
    relatedQuestionRefs:
    - QE008
    - QE025
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: SOC 2, ISO 27001, PCI-DSS, or equivalent assurance artifacts plus incident-response metrics.
    whyItMatters: The app handles financial, location, and diagnostic data, so public privacy labels are not enough to assess security maturity.
    diligencePath: Ask for current security certifications, last pentest summary, and payment-compliance attestations.
    relatedQuestionRefs:
    - QE018
    - QE025
  - type: missing-source
    severity: material
    topic: digital-pharmacy-governance
    missingEvidence: Evidence that maps digital-pharmacy and telemedicine claims to actual licensing, workflow scope, and supported countries.
    whyItMatters: Expansion into regulated health workflows changes compliance and liability exposure materially.
    diligencePath: Request pharmacy licenses, physician-network structure, and a country-by-country launch map.
    relatedQuestionRefs:
    - QE017
    - QE025
  - type: stale
    severity: minor
    topic: developer-signal-depth
    missingEvidence: A stronger developer-signal source such as public engineering talks, hiring plans, or technical job descriptions.
    whyItMatters: App telemetry proves distribution and cadence, but not the depth of the engineering organization or technical moat.
    diligencePath: Collect current engineering hiring pages, conference talks, or partner-technical posts.
