    - Regulated workflow and licensing detail are still not public
  - - First-order consumer acquisition
    - Promo-driven app discovery through ads or word of mouth
    - Free-first-delivery and price-led convenience positioning in official listings
    - Low-friction first transaction funnel for fast adoption
