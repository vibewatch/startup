- id: public-tech-signals
  title: Public Technical Signals and Product Maturity
  body: 'Ninja does not expose a public engineering blog, API documentation set, or stack diagram in the reviewed cache, so the technical read must rely on app-distribution metadata and category analysis. AppBrain supplies the clearest developer-signal: July 2022 availability, 7.6 million cumulative Android downloads, roughly 230 thousand recent downloads, a 68.6 MB package, fifty libraries, Android 7.0-plus support, and a June 2026 update cadence. The iOS listing adds provider identity, language support, and privacy labels covering financial information, location, and diagnostics. Sensor Tower then shows the app already operating at meaningful regional scale in late 2025. Together, those signals show a mature consumer product with ongoing release motion and real usage. What they do not prove is the underlying cloud architecture, observability stack, or engineering depth behind inventory, routing, and personalization systems. That omission is a real diligence limit, not a minor documentation
    gap.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE043
