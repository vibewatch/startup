    - No category-level revenue or repeat-rate disclosure
  - - Health / pharmacy-adjacent urgent user
    - Individual wellness or medication buyer
    - Fast access to pharmacy-linked or telemedicine-adjacent needs
    - Digital-pharmacy expansion cited by investors and profiles
    - Potentially high-trust, high-repeat segment if regulated well
    - Licensing, city coverage, and order share are not public
  - - GCC expansion user outside Saudi core
    - Consumer in Bahrain, Qatar, or Kuwait
    - Use the same convenience model outside the core Saudi market
    - Regional operation claims in MENAbytes and IPO coverage
    - Important for long-term TAM and public-market narrative
    - No disclosed country-by-country active-user or revenue split
