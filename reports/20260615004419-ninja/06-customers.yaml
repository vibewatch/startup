- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion Driver / Concentration Risk
  - Type
  - Current Status
  - Impact
  - Diligence Path
  rows:
  - - Saudi metro concentration (Riyadh, Jeddah, Dammam >60% of category demand)
    - Concentration risk
    - Present at category level
    - Heavy dependence on a few metros can amplify local competition and rider-cost shocks
    - Request Ninja city-level order mix and dark-store productivity by metro
  - - GCC regional expansion into Bahrain, Kuwait, and Qatar
    - Expansion driver
    - Active but not separately disclosed
    - Broadens TAM and public-market narrative beyond Saudi core
    - Request active users and GMV by country plus launch economics
  - - Multi-vertical convenience across food, grocery, beauty, and pharmacy
    - Expansion driver
    - Clearly visible on public app surfaces
    - Increases purchase occasions and app habit potential
    - Request category-level repeat-purchase and gross-margin contribution
  - - Subsidy normalization and service-quality competition
    - Risk and strategic transition
    - In progress across Saudi market
    - Customer experience must carry more of the retention burden if discounts fade
    - Request promo intensity, repeat-order elasticity, and service KPIs before and after discount campaigns
  - - Competitor loyalty and multi-vertical bundles (HPlus, HRewards, noon Minutes, Mrsool breadth)
    - Competitive concentration risk
    - Already live at peers
    - Raises switching pressure and reduces the uniqueness of breadth alone
    - Track wallet share, reorder frequency, and price parity versus peers
  - - Merchant concentration and top-category dependence
    - Hidden two-sided-market risk
    - Not publicly disclosed
    - A few merchants or categories could matter more than the consumer-app surface suggests
    - Request top-merchant share, top-category share, and seller churn / retention metrics
  - - Competitor exits under price pressure (Shgardi)
    - Market-structure risk
    - Observed in 2025 market reporting
    - Shows promotional competition can eliminate weaker platforms and reset customer choices
    - Track exits, consolidation, and competitor subsidy intensity quarterly
  - - Competitor grocery breadth and year-long free-delivery promo at HungerStation Market
    - Switching-pressure risk
    - Live on official competitor surface
    - Consumers can compare category breadth and promotions across platforms quickly
    - Benchmark Ninja offer depth and promo efficiency against peer category pages
  - - Additional regional convenience brands such as ToYou
    - Switching-pressure risk
    - Observed brand presence
    - Even sparse brand presence widens consumer choice and ad competition
    - Benchmark category breadth, pricing, and service area against smaller local apps
