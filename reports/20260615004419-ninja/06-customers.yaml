  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Hard retention metrics such as monthly reorder rate, cohort retention, churn, or subscription take-up.
    whyItMatters: Without direct retention metrics, customer durability has to be inferred from ratings and weekly-active-user stability.
    diligencePath: Request cohort dashboards, repeat-purchase rate, and any membership or loyalty program statistics.
    relatedQuestionRefs:
    - QU010
    - QU011
    - QU022
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: named-merchant-proof
    missingEvidence: Named merchant or restaurant case studies that quantify order volume, retention, or economics on Ninja.
    whyItMatters: Customer proof today is consumer-review heavy and merchant-proof light, limiting confidence in the two-sided marketplace quality.
    diligencePath: Request top-merchant references, case studies, or partner testimonials with measurable outcomes.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: merchant-concentration
    missingEvidence: Disclosure on what share of order volume comes from top merchants, top categories, or top cities.
    whyItMatters: Concentration risk cannot be measured from consumer-app evidence alone.
    diligencePath: Request merchant mix, top-10 merchant share, and category/city volume breakdowns.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: active-customer-count
    missingEvidence: A disclosed active-customer count for Ninja rather than only download, rating, and order-volume proxies.
    whyItMatters: Installs and weekly actives help, but they do not fully reveal the number of current paying users.
    diligencePath: Request MAU, WAU, order-frequency, and paying-customer definitions used by management.
    relatedQuestionRefs:
    - QU003
