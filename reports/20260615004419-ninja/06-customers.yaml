    - High-frequency demand anchor for repeat use
    - No disclosed cohort retention or average basket by household segment
  - - Restaurant-order convenience user
    - Individual meal-ordering consumer
    - Dinner, late-night, or office-meal ordering with real-time tracking
    - 5,000+ restaurants in public app surfaces
