schemaVersion: report-v2
artifact: customers
slug: ninja
runDate: '2026-06-15'
company:
  name: Ninja
chapter:
  number: 6
  title: Customers
  summary: 'Ninja''s customer proof is strongest at the consumer-app surface: millions of downloads, high visible iOS ratings, meaningful weekly active users, and a multi-vertical value proposition that fits everyday Saudi convenience behavior. The chapter also shows why durability is still partially unproven: public sources do not disclose active-customer count, cohorts, repeat-purchase rate, or merchant concentration, and named customer proof comes mostly from app reviews rather than audited merchant case studies. Adverse review evidence is material, because support quality and refunds are likely to matter more as subsidy-led acquisition cools.'
sections:
- id: customer-segments
  title: Customer Base Segmentation
  body: 'Ninja''s visible customer base is consumer-first and convenience-led. The app surfaces target people who want food delivery, urgent top-up groceries, household items, beauty or wellness products, and late-night essentials without leaving home. That means the payer, user, and beneficiary are usually the same person or household, not a procurement team or enterprise account. The category mix also suggests multiple demand moments: meal ordering, pantry replenishment, baby care, pet care, and pharmacy-adjacent urgency. Geography matters as well. Public sources frame Saudi Arabia as the core market, while GCC expansion into Bahrain, Qatar, and Kuwait broadens the user base but does not change the consumer nature of the model. What is not visible is a segmented customer count by city, cohort, or category, so the chapter has to infer customer structure from assortment, app metrics, and market studies rather than from company cohort tables.'
  claimRefs:
  - CU001
  - CU002
  - CU011
  - CU014
  - CU016
  - CU018
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory
  title: Adoption Trajectory and Public Scale Signals
  body: The clearest adoption evidence comes from app-distribution and app-intelligence sources. Ninja shows 5 million-plus Android installs publicly, while AppBrain estimates 7.6 million cumulative downloads and about 230 thousand recent downloads. Apple shows 1.2 million Saudi App Store ratings, and Sensor Tower's Q3 2025 snapshot shows weekly downloads holding around 105 thousand to 120 thousand while weekly active users reached about 2 million. Those are meaningful consumer-scale signals, especially for a company founded in 2022. Zawya and MENAbytes reinforce that picture with qualitative statements about accelerating customer base and order volumes. Still, none of the reviewed sources publish an active-customer count, conversion rate, or order-frequency cohort. So adoption is visible, but the exact ratio between installs, active users, and repeat purchasers remains opaque.
  claimRefs:
  - CU004
  - CU006
  - CU007
  - CU008
  - CU015
  - CU017
  - CU033
  - CU035
  - CU044
