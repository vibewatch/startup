callouts:
- calloutType: strength
  title: Real adoption is clearly visible even without internal dashboards
  body: Ninja does not publish a full customer KPI deck, but the combination of millions of installs, visible ratings, meaningful weekly-active-user signals, and named production-use reviews is enough to show the product is not a speculative demand story. Real consumers are already using it at scale.
  claimRefs:
  - CU004
  - CU006
  - CU008
  - CU024
  - CU045
- calloutType: risk
  title: Support quality and missing retention disclosure are the core customer risks
  body: The chapter's biggest customer risk is not lack of growth. It is that public proof of long-term durability is weak, while adverse review evidence is strong. If subsidies fade and service quality becomes the deciding factor, refund and support performance could matter more than raw install growth.
  claimRefs:
  - CU019
