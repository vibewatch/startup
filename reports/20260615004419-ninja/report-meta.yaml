companyProfile:
  summary: Ninja is a Riyadh-based quick-commerce platform that has expanded from a Saudi grocery-and-meals delivery app into a broader on-demand retail surface spanning groceries, restaurants, pharmacy, personal care, and household essentials across Saudi Arabia, Bahrain, Qatar, and Kuwait. The company reached unicorn status in 2025 after a Riyad Capital-led round, is publicly described as operationally profitable, and is already being discussed as a future Tadawul IPO candidate; however, the public record still relies heavily on company-linked and media-level disclosures rather than audited financial statements.
  foundedDate: '2022-01-01'
  founders:
    - name: Saud Al Qahtani
      role: Co-founder
      background: Public coverage links him to prior HungerStation experience, strengthening local category founder-market fit.
      claimRefs: [CO009, CO011]
    - name: Canberk Donmez
      role: Co-founder
      background: Consistently named across retained funding and IPO-preparation coverage as part of the founding team.
      claimRefs: [CO009]
  foundingLocation: Riyadh, Saudi Arabia
  headquarters: Riyadh, Saudi Arabia
  productSummary: Mobile-first quick-commerce platform combining dark-store fulfillment and delivery for groceries, restaurant meals, pharmacy, personal care, home goods, and other everyday essentials with sub-30-minute service promises.
  customerFocus: Urban and convenience-driven consumers in Saudi Arabia and nearby GCC markets who value fast replenishment, food delivery, and bundled everyday shopping.
  businessModel: Generates commerce and delivery revenue from app-based orders fulfilled through a mix of dark stores, restaurant partners, and last-mile riders across multiple consumer categories.
  stage: Late-stage private / pre-IPO
  fundingStatus: Approximately $250 million raised in a 2025 Riyad Capital-led round at a $1.5 billion valuation, with IPO preparation coverage active in 2026.
  disclosureProfile: private-undisclosed
  claimRefs: [CO012, CO016, CO031, CI007, CV001, CV011]
summary:
  headline: Ninja has achieved unusually fast Saudi quick-commerce scale and a credible pre-IPO profile, but incomplete disclosure on revenue quality, margins, and governance keeps the current $1.5 billion mark in track-not-buy territory.
