- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or risk
  - Threat vector
  - Why it is credible now
  - Severity
  - Diligence ask
  rows:
  - - Dark-store density is a real wedge
    - Incumbents expand fast-fulfillment networks
    - Ninja already operates 100+ dark stores across 28 cities while larger rivals add grocery and retail depth
    - Medium
    - Request city-level order density and payback by dark store cohort
  - - Speed-led leadership can be copied
    - Scaled ecosystems normalize 11-30 minute delivery
    - Talabat, Noon, HungerStation, and Jahez all have quick-retail or grocery hooks
    - High
    - Request retention and repeat-order evidence after promotions fade
  - - Subsidy wars can erode economics
    - Discounting and free delivery compress margins
    - Redseer and Mordor both describe subsidy-led growth and razor-thin contribution margins
    - High
    - Request contribution margin by basket band and subsidy intensity
  - - M&A is a possible acceleration route
    - Saudi merger control and conduct rules can slow roll-ups
    - GAC thresholds and failure-to-notify penalties are now clearer and more assertive
    - Medium
    - Map target-sales thresholds and likely local-nexus tests before assuming consolidation upside
  - - Public-market incumbents raise the proof bar
    - Listed rivals can outspend to defend users
    - Jahez stayed profitable while still increasing marketing and promotions to defend share
    - Medium-High
    - Request comparative CAC and loyalty economics versus listed peers
  - - Pricing power remains unproven
    - Users and merchants can multi-home
    - Visible pricing and cohort data remain mostly private across the set
    - High
    - Request churn, cohort retention, and effective take-rate disclosures
  notes: Severity reflects current underwriting risk, not certainty of outcome; each row translates an observed market dynamic into a diligence requirement.
