tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor or substitute
  - Category
  - Scale or backing signal
  - Scope overlap with Ninja
  - Main differentiation
  - Main limitation
  rows:
  - - Ninja
    - Direct quick-retail leader
    - $250M-$254M 2025 round at ~$1.5B valuation; 100+ dark stores across 28 cities
    - Groceries, restaurants, pharmacy, household essentials, GCC expansion
    - Saudi-native dark-store density and speed narrative
    - Public pricing, retention, and audited economics remain thin
  - - HungerStation
    - Food-led incumbent expanding into quick retail
    - 55,000+ stores; HPlus and HRewards; 20-minute HungerStation Market
    - Food, grocery, pharmacy, flowers, pick-up, major Saudi-city coverage
    - Largest visible merchant network and loyalty layers
    - Less clearly dark-store-native than Ninja and still exposed to discount competition
  - - Jahez
    - Listed Saudi multi-vertical incumbent
    - FY2025 GMV SAR7.2B; 111.6M orders; profitable in FY2025 and Q1 2026 KSA segment
    - Food plus integrated grocery, retail, noon Minutes, and quick-commerce partnerships
    - Best public Saudi benchmark with real reporting cadence
    - Promotional spending and fee pressure show how costly share defense is
  - - Mrsool
    - Flexible anything-delivery substitute
    - Claims to be one of the largest Saudi delivery platforms with KSA-wide coverage
    - Restaurants, groceries, gas, medicine, errands, send-anything requests
    - Custom request flexibility and courier chat model
    - Less evidence of standardized dark-store economics or disclosed scale
  - - Talabat / Noon
    - Regional ecosystem substitute
    - Talabat 2025 GMV $9.5B with 6.5% adjusted EBITDA margin; Noon Minutes anchored in the GCC
    - Food, grocery, retail, subscriptions, regional merchant networks
    - Better-capitalized ecosystem breadth and strong UAE reference position
    - Less Saudi-native than Ninja and not the cleanest like-for-like local peer
  - - Keeta and other fast entrants
    - Likely entrant or share-taking challenger
    - Redseer and Mordor place Keeta in the Saudi top three by 2025
    - Food-led aggregation with growing Saudi share and promotion intensity
    - Can accelerate acquisition pressure quickly
    - Public quick-retail depth is less visible than Ninja’s dark-store setup
  - - Offline supermarkets and restaurant direct channels
    - Status quo substitute
    - Still anchor planned weekly shopping and direct merchant ordering
    - Urgent-basket missions, repeat food orders, and convenience top-ups
    - No app tax and strong habitual demand
    - Cannot usually match 11-30 minute multi-category fulfillment at scale
  notes: Rows mix company disclosures, listed filings, and third-party market estimates; private-company scale and profitability are not fully apples-to-apples.
