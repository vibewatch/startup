- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Visible consumer offer
  - Published speed promise
  - Retention or packaging layer
  - Disclosed economic caveat
  - Implication
  rows:
  - - Ninja
    - Free first delivery and value-led offers in app-store copy
    - 30 minutes or less; 24/7
    - Broad category promise; payment flexibility
    - No public fee card, take rate, or cohort disclosure
    - Compelling consumer proposition but weak public pricing visibility
  - - HungerStation
    - Free delivery for new users and HPlus member benefits
    - 20-minute HungerStation Market for everyday items
    - HPlus subscription and HRewards cashback
    - No listed unit-economics disclosure in cache
    - Retention tooling is more explicit than Ninja’s
  - - Jahez
    - App-integrated food, grocery, and shop discovery
    - No single universal speed promise in retained filings
    - noon Minutes linkage and broader monetization streams
    - Filings show profitability but also fee pressure and higher marketing
    - Can compete on more than discounting, but at visible cost
  - - Mrsool
    - Promotions plus user-negotiated delivery fee behavior
    - Minutes for nearby anything-delivery requests
    - Flexible errands rather than formal subscription bundling
    - Scale and pricing transparency remain thin
    - Useful multi-homing substitute where flexibility matters more than standardization
  - - Talabat / Noon
    - Regional promotions and ecosystem breadth
    - Fast grocery and multi-category delivery in GCC reference markets
    - Super-app or membership style retention logic
    - Saudi unit economics not cleanly visible in local cache
    - Sets regional expectation on breadth even without Saudi-specific transparency
