callouts:
- calloutType: strength
  title: Ninja’s real wedge is local density, not generic food aggregation
  body: The strongest public differentiation is not that Ninja lists groceries or pharmacy, because rivals do that too. It is that multiple sources describe a Saudi-built, dark-store-heavy network that already operates at country-wide density and makes speed a primary user promise.
  claimRefs:
  - CP005
  - CP006
  - CP031
  - CP039
- calloutType: risk
  title: The moat is still unproven where investors most need proof
  body: Ninja may be leading the current Saudi quick-retail cycle, but the public record still does not disclose effective take rates, cohort retention, or city-level contribution margins. That means the lead could be real and still not yet durable.
  claimRefs:
  - CP014
  - CP032
  - CP040
