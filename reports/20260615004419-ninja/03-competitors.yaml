- id: capability-pricing-and-multi-homing
  title: Capability overlap, pricing opacity, and multi-homing behavior
  body: 'Public evidence is strong on feature breadth and weak on actual unit pricing, which is exactly why competitive underwriting should focus on solution shape rather than pretend precision. Ninja’s own consumer surfaces show a broad multi-category promise, 24-7 availability, and a 30-minute-or-less delivery narrative anchored by thousands of restaurants and products. HungerStation publishes an even broader merchant footprint and adds HPlus and HRewards as visible retention tools. Jahez, meanwhile, has already folded grocery, retail, and noon Minutes into a listed-company platform that can use commissions, advertising, and delivery-fee shifts to compete on more than just app growth. Multi-homing is therefore likely on both sides of the market: consumers can use Ninja for urgent top-ups, HungerStation for broad selection and perks, Jahez for food plus growing retail depth, and Mrsool for non-standard errands. Because public fee schedules, effective commissions, and cohort retention data
    remain thin across the set, nobody can yet prove that Ninja has locked in durable pricing power rather than simply earned the latest turn of the market-share cycle.'
