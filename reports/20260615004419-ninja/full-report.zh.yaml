      - number: '2.3'
        title: 买家、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              准备好的来源指向一个消费者便利市场，而不是 B2B 市场。主要买家、用户和付款方是同一个家庭消费者，他想要比去门店更快的替代方案。Redseer 的证据显示，10% 的用户越来越多在工作场所下单，20%
              的用户因为选择变多而更频繁下单；这意味着频次由便利和供给广度驱动，而不只是一次性折扣。Ninja 官方应用界面也支持同样解读：服务宣传 24/7
              配送、实时追踪、宽泛家庭品类，以及一个覆盖餐食、生鲜杂货、药房和个人护理的单一界面。应用牵引已经足以影响品类层面：Apple 显示沙特有 1.2 million 条评分、4.7 分；AppBrain 估算
              Android 生命周期下载 7.6 million；Sensor Tower 显示 2025 年 Q3 周活跃约 1.8-2.1
              million。合起来看，真实市场是高频城市家庭预算，产品靠从需求突然出现到完成购物篮的最快路径取胜。
