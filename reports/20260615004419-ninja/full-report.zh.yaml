        - 从跟踪转向回避，除非价格实质性重置
      - - 2026 年目标落空
        - 明显低于披露的 2026 年 $1.6B 目标
        - 打破支撑相对 Jahez 式公开倍数溢价所需的增长逻辑
        - 立即用更低销售额和更紧倍数重估
