      - number: '2.4'
        title: 增长驱动、采用约束与承销缺口
        blocks:
          - type: paragraph
            body: >-
              海湾即时零售的驱动因素在证据包里很清楚。智能手机渗透率高于
              95%、数字支付使用率高、少数大型都市形成城市集聚、物流投资重，这些都让急用低客单需求更容易转化为重复应用行为。气候也是故事的一部分：极端高温和密集城市生活让去门店更容易被避免，契合补货和冲动购买模型。但准备好的负面证据同样重要。Redseer
              称 2025 年需求由重补贴加速；Introchek 的密集城市模型则显示，当订单密度低于约每平方公里 450 单时，超快配送吸引力会明显下降。这意味着市场可以继续增长，同时在核心覆盖区之外更难变现。Jahez
              等上市公司基准证明，一家沙特上市平台可以扩张多垂直 GMV；但它们也说明，投资人在承销 Ninja 的精确份额获取路径前，仍应索要品类组合、留存和密度数据。市场是真实的；捕获逻辑的精度还没有公开。
