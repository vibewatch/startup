      - number: '4.5'
        title: 财务结论与阻断点
        blocks:
          - type: paragraph
            body: >-
              公开结论是，Ninja
              可能确实有规模、有密度，成本底座也可能强于许多区域同业——但证据距离可承销仍差一层。官方界面证明产品存在、横跨多个品类，并支持足够重要的供给密度。同业文件和市场研究证明，沙特配送经济性在压力下可以保持为正，但前提是佣金组合谨慎、赞助车队经济性可控，并且更严地控制促销。公开来源无法证明的是
              Ninja 自己的现金余额、burn、订单级盈利、商户 take rate，或核心收入数字背后的会计基础。因此，最大阻断点不是 Ninja 是否在增长，而是公开数字是净收入还是 GMV、2025
              年融资是否仍有相当部分留在资产负债表、2026/2027 年 IPO
              是融资必要还是战略选择，以及服务质量投诉是孤立噪音还是对利润率的真实运营税。在这些问题回答前，正确的财务立场是尊重但不自满：公司可能不错，但公开证据仍不完整。
