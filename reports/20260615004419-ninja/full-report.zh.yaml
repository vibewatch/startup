        - 因银行或市场环境降温，上市推迟到 2027 年之后
        - 移除关键流动性路径，并削弱上一轮估值的叙事支撑
        - 要求更大折价，或在时间重置前观望
      - - 利润率脆弱
        - 证据显示盈利依赖补贴强度，或贡献利润率薄到不可持续
