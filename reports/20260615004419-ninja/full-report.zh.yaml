      - number: '1.5'
        title: 关注点与负面信号
        blocks:
          - type: paragraph
            body: >-
              公开故事很强，但下行信号真实存在，不能被当成噪音。客户评论语料中反复出现退款、缺货、配送慢和客服无响应的投诉，其中有评论者称 20-30
              分钟的产品承诺拖到超过一小时。这些投诉重要，因为即便执行很紧，赛道经济性也很薄：Introchek
              的情景分析认为，一个典型客单在扣除骑手、包装和微型枢纽成本后，可能只留下有限贡献；零工骑手流失和监管关注还会继续抬高运营负担。Trade.gov
              从更宽的沙特经营视角补充了监管不透明、本地化压力和延迟付款风险。上述问题没有否定 Ninja
              的运营动能，但合在一起解释了为什么公司概览必须明确列出治理深度、服务质量一致性、私有财务披露，以及品类从补贴拉动增长转向更紧、更受监管竞争后盈利可持续性的尽调问题。
            claimRefs:
              - CO017
              - CO032
              - CO033
              - CO034
              - CO035
              - CO036
