      - number: '2.2'
        title: 用证据约束测算，而不是给一个轻松标题数字
        blocks:
          - type: paragraph
            body: >-
              准备包支持这是一个真实市场，但不支持一个干净数字。Mordor 的区域视角把 2026 年 GCC 即时零售规模放在 USD 4.59 billion，Saudi Arabia 单独为 USD 2.38
              billion，并称沙特占 2025 年区域需求的 54.76%。IMARC 使用不同范围和更长周期，从 2025 年 USD 2.7 billion 起步，预测到 2034 年达到 USD 26.5
              billion，CAGR 为 27.87%。Statista 的方法说明恰好有价值，因为它解释了这些数字为什么分叉：品类模型来自
              GMV、公司报告、第三方研究和消费者调研输入，而不是一个标准化披露底座。最稳妥的承销视角因此不是挑一个最喜欢的预测，而是保留区间，以沙特作为核心市场镜头，并用 Jahez 等有披露的上市公司可比对象锚定任何
              Ninja 份额讨论，而不是锚定一张宽泛 TAM 幻灯片。公开证据证明规模和增长；它还不能证明精确的 Ninja SAM 或 SOM。
