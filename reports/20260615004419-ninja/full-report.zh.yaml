              融资，资金明确绑定技术、物流和扩张。更不清楚的问题是，进入 2026 年时这笔资金有多少实际留在资产负债表上，是否存在二级交易部分，以及在 IPO 准备报道出现时公司的月度 burn 或债务义务是什么样。2026
              年 3
              月报道强烈暗示融资依赖仍然存在，因为上市被描述为支持进一步沙特和区域扩张的工具，而不是现金完全自给后的可选品牌动作。未披露现金、跑道、债务服务或营运资本机制，在即时零售中特别重要，因为该品类运营密集、履约重，并且仍在穿越补贴后监管。财务章节因此必须把资本充足性判断为方向上积极，但在审计流动性证据上仍未证实。
