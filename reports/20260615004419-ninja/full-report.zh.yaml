  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 要素
      - 正方论点
      - 反方论点
      - 什么会改变判断
    rows:
      - - 规模叙事
        - Ninja 约 3 年做到独角兽，并铺出 100+ 暗店、28 城足迹。
        - 高增长标题仍可能掩盖披露质量弱和指标呈现激进。
        - 提供经审计的 2025 年和 2026 年 YTD 报表，并给出清晰分部桥接。
      - - 品类宽度
        - App 已覆盖四个 GCC 市场的杂货、餐饮、药房和日常必需品。
        - 只靠品类宽度，不能证明贡献利润率可持续，也不能证明跨品类需求高效。
        - 按品类和城市披露利润率与复购行为。
      - - IPO 就绪度
        - 据报道，银行正在排队，Riyadh 仍是最可能上市地点。
        - 时间安排反复被描述为取决于市场窗口，而这正是私募估值最容易被挑战的时候。
        - 锁定顾问银行阵容、时间表和主要募资用途细节。
      - - 本地可比公司支撑
        - Jahez 证明沙特餐饮和即时零售平台可以做大并上市。
        - Jahez 虽然盈利，交易估值仍接近 1.0x EV/revenue；如果没有更干净证据，Ninja 能拿到的溢价有限。
        - 确认标题中的 $1B 是净收入，且利润率可持续。
      - - 行业经济性
        - 沙特和 GCC q-commerce 仍有真实空间，生态规模也可能重要。
        - 独立负面来源仍将增长描述为补贴驱动，单均经济薄如刀片。
        - 证明 Ninja 成熟队列不靠重折扣也能维持正贡献。
      - - 资本市场野心
        - $1B IPO 传闻显示银行确有兴趣，也意味着潜在流通盘较大。
        - 银行兴趣不保证公开市场投资人会原封不动接受上一轮私募估值。
        - 给出 IPO 前需求测试和估值纪律，而不只是标题式募资目标。
    notes: 论点对价格敏感：Ninja 可以是一家高质量公司，但如果指标基底仍不清楚，投资仍可能偏贵。
