      - number: '4.4'
        title: 市场与可比性背景
        blocks:
          - type: paragraph
            body: >-
              市场背景有利有弊。Mordor 和 Economy Middle East 都描述了快速增长的沙特即时零售市场；Statista 则提醒读者，许多市场预测数字以 GMV
              为基础，代表消费者支付额，而不是平台记为净收入的金额。这个方法论点重要，因为 Ninja 公开引用的 2025 年收入和 2026
              年目标，接近或高于部分沙特市场规模估算，除非它们是区域口径、总额口径或其他不可比口径。估值背景上，Jahez 仍是锚定公开可比：Multiples.vc 和 StockAnalysis 显示，2026 年中
              EV/revenue 倍数约 1.0x，市值约 $718 million；DoorDash 则处在更大公开规模。含义不是 Ninja 应机械按 Jahez 或 DoorDash
              定价，而是公开市场投资人看配送业务时，更关心费率组合、物流效率和利润率韧性，远胜私募市场热度。任何 Ninja 承销模型如果默认用 $1.5 billion 私有估值作锚，而不测试公开可比，都过于宽松。
