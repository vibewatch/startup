      - number: '7.2'
        title: 监管和法律风险，与其说是牌照问题，不如说是规则如何重塑竞争和扩张
        blocks:
          - type: paragraph
            body: >-
              沙特即时零售正在进入更紧的规则集合。Redseer
              准备指引称，监管方明确瞄准低于成本定价、对卖家的歧视待遇、排他和自我优待。这不像需求杀手，更像市场成熟事件，会惩罚增长仍依赖极端激励的运营商。与此同时，法律包对任何包含合作、跨境上线或收购的策略都很重要。Baker
              Botts、Addleshaw 和 Chambers 都显示，GAC 的经营者集中框架已经更明确，包含定义好的门槛、一年审批有效期，以及未申报的真实处罚。Trade.gov 和 UHY 把警示拓宽：Saudi
              Arabia 的合规越来越连续、数据驱动，并且有时在不同机构之间难以预测。对 Ninja 而言，监管风险不是抽象 headline，而是每日约束促销、雇佣管理、数据流和任何交易驱动扩张逻辑的运营条件。
