  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与公开牵引
        blocks:
          - type: paragraph
            body: >-
              Ninja 的公开收入模型容易描述，却很难承销。官方界面清楚地把产品定位为多垂直交易市场：餐食配送、生鲜杂货、药房、购物和上门服务需求都聚合进一个应用，并向沙特用户群宣传 5,000-plus 家餐厅和
              15,000-plus 个产品。这种广度重要，因为它意味着不止一种购物篮类型，也不止一种毛利率结构。缺失的是对 take
              rate、商户佣金、配送费表、订阅经济性或按垂直划分已实现利润率的任何直接披露。因此，公开牵引故事由媒体层面的 IPO 前数字支撑，而不是审计报表：2026 年 3 月报道反复引用约 $1 billion 的
              2025 年收入和 $1.6 billion 的 2026 年目标，但这些数字没有配套财务报表、收入确认政策，或 GMV 到净收入桥接。这足以证明 Ninja
              有规模和上市野心，但不足以像公司已经上市那样评价收入质量。
