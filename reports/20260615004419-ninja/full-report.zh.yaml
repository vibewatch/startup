  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局，以及为什么领导地位仍在摇摆
        blocks:
          - type: paragraph
            body: >-
              Ninja 所在市场已经远远超出餐厅配送，扩展成覆盖生鲜杂货、家庭补货、药房、美妆和便利型日常任务的更宽即时零售层。设定中乐观的一面很明显：Redseer 和 Mordor 都描述了一个仍在快速增长的沙特和
              GCC 市场，Saudi Arabia 是区域重心，生鲜杂货或基础用品仍是锚定用例。但同一批来源也清楚表明，领导格局未定。Redseer 称沙特即时零售领导者已经从 Omnichannels 轮换到
              Nana、HungerStation，再到 Ninja；UAE 的领先位置由 Talabat 和 Noon 共享。这意味着市场大到足以让 Ninja 重要，也不稳定到仅靠速度不能构成持久护城河。投资人应把
              Ninja 当前领先解读为正在发生的运营优势，而不是品类已经围绕一个赢家结构性整合的证明。
