        title: 创始人与治理可见度
        blocks:
          - type: paragraph
            body: >-
              保留下来的创业公司报道对核心创始人组合口径一致：Menabytes、Arab News 和 Inc. Arabia 反复提到 Saud Al Qahtani 和 Canberk
              Donmez。创始人故事重要，因为公开资料把 Ninja 描述成本地市场运营型公司，而不是欧洲超快配送模式的复制粘贴；The Gulf Wire 明确称 Al Qahtani 曾联合创办
              HungerStation，这让 Ninja
              至少有一名创始人在沙特餐食配送品类里有直接经验。更弱的是治理可见度。本轮保留的公开材料识别了创始人、投资方发言人和运营主张，但没有官方董事会名单、委员会结构，也没有公司控制的关于页面披露详细领导层。业务并不会因此失效，但后续章节应把管理层连续性、授权深度和关键人物风险视为部分未解，而不是已经由一手来源完全验证。
