      - number: '1.4'
        title: 足迹、品类扩张与里程碑路径
        blocks:
          - type: paragraph
            body: >-
              Ninja 的里程碑曲线值得注意，因为它把快速区域铺开和产品拓宽放在了一起。官方网页栈与第三方报道共同支持 Saudi、Bahrain、Qatar 和 Kuwait
              作为已上线或受支持的国家界面，沙特门店也明确完成英文和阿拉伯语本地化。除餐食和生鲜杂货外，官方和独立来源都描述了向药房、化妆品和远程医疗相关服务的扩张，这符合多垂直即时零售逻辑，而不是单一品类配送应用。Redseer
              的市场研究有助于给这套逻辑定位：2019 年以来，即时零售在 GCC q-commerce 中占比显著扩大；沙特的领导者多次易手，最新一波才落到 Ninja。里程碑路径因此不只是融资额：公司 2022
              年成立，扩张到多个 GCC 市场，2025 年成为独角兽，并在 2026 年 3 月进入正式 IPO 准备报道。正因如此，后续章节可以把 Ninja 视为区域即时零售竞争者，而不只是本地应用实验。
