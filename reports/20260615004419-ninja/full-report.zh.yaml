      - number: '8.4'
        title: 最终建议与尽调闸门
        blocks:
          - type: paragraph
            body: >-
              因此，建议是继续跟踪：置信度中等、风险高、估值偏紧。Ninja 显然值得关注：公司有真实运营势能、可信的区域野心，也有足够的本地市场密度来支撑 IPO
              准备。但至少在公开记录里，它还没有达到让外部投资者有底气按当前私募估值买单的披露质量。最重要的尽调要求很直接，也很严格：提供经审计的 2025 年和 2026 年年初至今财务报表，并明确拆分 GMV
              与净收入；按城市或 cohort 披露前置仓贡献毛利；在承销任何 IPO 或后期轮次之前，完整披露股权结构和优先权栈。投资者还应监测投资假设失效触发器，例如 2026 年目标落空、确认十亿美元口径主要是
              GMV，或因银行流程或市场窗口转冷而导致 IPO 推迟到 2027 年之后。在这些闸门通过前，应密切观察该估值，而不是盲目接受。
