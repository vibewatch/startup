      - number: '7.3'
        title: 运营和劳动力风险直接嵌在模型的单元经济里
        blocks:
          - type: paragraph
            body: >-
              这组反向材料指向同一个问题：极速履约可以在技术上很漂亮，但财务上几乎没有容错空间。Mordor 称，沙特价格战阶段把贡献毛利压到约 USD 18 客单价中的 USD 0.36；Introchek
              的情景测算也显示，一旦密度离开最佳城市簇，回本周期会迅速拉长。即使没有劳工改革，这已经是很难跑的运营模型。夏季作业限制、薪资数字化和更高合规负担开始要求平台建立更结构化的骑手流程后，难度继续上升。Ensaan 对
              2025-2026 年劳工制度的解读把问题说得更尖锐：工资保护、Qiwa 合同和薪资例外，现在都是运营控制，不再是后台文书。Ninja 自己在 app 里的承诺——覆盖食品、杂货、药房、美妆和电子产品，且
              24/7 服务——放大了收入机会，也同时放大了库存、SLA 和质量失败点。因此，运营风险不太像一次大宕机，更像低客单价下许多小成本漏洞不断叠加。
