      - number: '7.4'
        title: 竞争压力和资本市场时点仍可能压过强劲的收入增长故事
        blocks:
          - type: paragraph
            body: >-
              Ninja 目前的规模很亮眼，但这组公开公司基准说明，分析不能到此为止。Redseer 仍把沙特描述为一个高度集中的市场：前三大食品配送平台掌握超过 90% 份额，而相邻的即时零售赛道领导者也多次易位。Jahez
              的申报文件给出了运营后果：公司仍然盈利，但 KSA 配送平台利润率从 FY2024 的 15.1% 降至 FY2025 的 11.9%，又在 2026 年 Q1 降至
              7.6%，即便管理层称市场份额在提升。Jahez 扩大自有运力也说明，在促销密集期守住经济性，靠的不只是品牌认知，还有规模化物流。Sensor Tower 的周活跃用户数据暗示，Ninja
              在用户规模上仍落后于部分既有玩家。如果公开市场窗口是下一座里程碑，这一点很关键，因为投资者最终会追问：Ninja 的增长来自可持续的运营优势，还是来自一个仍在为留住消费者付出过高成本的市场。
