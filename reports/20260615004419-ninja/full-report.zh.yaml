      - number: '3.3'
        title: 能力重叠、定价不透明与多栖行为
        blocks:
          - type: paragraph
            body: >-
              公开证据对功能广度很强，对真实单元定价很弱；这正是竞争承销应聚焦解决方案形态，而不是假装有精确度的原因。Ninja 自己的消费者界面展示了宽泛的多品类承诺、24-7 可用性，以及由数千家餐厅和产品支撑的 30
              分钟内送达叙事。HungerStation 公布的商户足迹更宽，并把 HPlus 和 HRewards 作为可见留存工具。与此同时，Jahez 已经把生鲜杂货、零售和 noon Minutes
              折进一家上市公司平台，可以用佣金、广告和配送费调整来竞争，而不只是拼应用增长。因此，市场两端都可能多栖：消费者可以用 Ninja 处理紧急补货，用 HungerStation 获得更宽选择和权益，用 Jahez
              购买餐食加不断加深的零售，用 Mrsool 处理非标准跑腿。由于公开费率表、有效佣金和同期群留存数据在整个集合中仍然稀薄，还没人能证明 Ninja 已锁定持久定价权，而不是只赢得市场份额周期的最新一轮。
