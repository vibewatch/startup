  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览：市场真实存在，但持久经济性的路径仍未证实
        blocks:
          - type: paragraph
            body: >-
              Ninja
              的风险画像不在于需求是否存在。准备包支持一个由沙特带动、庞大且增长中的即时零售品类，也支持强应用牵引和真实投资人胃口。核心问题是，当市场离开补贴驱动加速，进入更有纪律的运营状态后，增长是否仍然有吸引力。因此，本章权重最高的风险彼此强化：如果促销收缩，订单频次和利润率质量会更可见；如果劳动合规和高温规则抬高成本，同样的低客单购物篮会更难支撑；如果最佳都市之外密度走弱，区域扩张故事会在潜在
              IPO 正需要更干净经济性叙事时变得不那么有说服力。结果不是投资论点已经破裂，而是如果利润率正常化、劳动合规和资本市场时点同时朝错误方向移动，投资论点会很快破裂。
