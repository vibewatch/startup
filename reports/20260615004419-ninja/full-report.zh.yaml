            body: >-
              Ninja 目前已经有清晰的沙特官方消费者入口 ananinja.com/sa/en，阿拉伯语本地化和应用商店分发也指向一个活跃的面向消费者即时零售品牌，而不是隐身运营壳。主页元数据和结构化片段披露了
              Alyasmin 的 Riyadh 地址、support@ananinja.com 联系方式，以及围绕 24/7 快速配送的产品语言。Apple 列表把 TECH-ADVANCE FOR INFORMATION
              TECHNOLOGY CO 列为提供方，Google Play 则显示开发者名称 Ana
              Ninja；两者合在一起说明其在沙特有可见运营足迹，但并没有完整披露法律实体地图。产品界面明确是多垂直：生鲜杂货、餐厅配送、购物、上门服务和药房都出现在官方界面中，应用文案强调 30
              分钟内送达、全天候可用和本地支付支持。尽调时，本章把官方消费者界面视为 Ninja 卖什么、在哪里卖的强证据，但不把它当作利润率、员工规模或公司治理深度的证明。
