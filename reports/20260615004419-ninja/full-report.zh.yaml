  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              不能把 Ninja 当作参与全部生鲜杂货零售、全部餐食配送或全部 GCC 电商支出的公司来分析。准备好的证据范围窄得多。Redseer
              把品类定义为即时零售：一个快速配送层，建立在传统餐食配送之上，现在把生鲜杂货、药房、家庭基础用品和其他急用商品打包进去。Ninja 自己的应用商店定位也强化了这条边界：一个应用会话内同时宣传 5,000+
              家餐厅、15,000+ 个产品、药房、个人护理和 30
              分钟内送达。因此，纳入支出是紧急家庭补货和便利驱动零售，不是整个每周囤货，也不是海湾家庭的每一笔数字购买。现状替代品仍是社区门店、大卖场和当日达市场零售；纯餐食应用和其他 q-commerce
              玩家也争夺同一份注意力和钱包。这一定义重要，因为它让市场具备可投资性，但规模小于泛泛的“数字零售”叙事，也更依赖执行。
