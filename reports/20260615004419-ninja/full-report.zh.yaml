            body: >-
              在审阅缓存中，Ninja 没有公开工程博客、API 文档集或技术栈图，因此技术判断必须依赖应用分发元数据和品类分析。AppBrain 提供最清楚的开发者信号：2022 年 7 月可用、Android 累计下载
