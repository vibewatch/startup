              列表补充了提供方身份、语言支持，以及覆盖财务信息、位置和诊断的隐私标签。Sensor Tower 随后显示，该应用在 2025
              年末已达到有意义的区域规模。合起来看，这些信号说明它是一个成熟消费产品，有持续发布动作，也有真实使用。它们不能证明底层云架构、可观测性栈，或支撑库存、路由和个性化系统的工程深度。这个缺口是真实尽调限制，不是小的文档缺失。
