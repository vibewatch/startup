      - number: '8.2'
        title: 公开可比公司视角，以及指标含混为何重要
        blocks:
          - type: paragraph
            body: >-
              在本地证据包里，最相关的公开基准是 Jahez，而不是 DoorDash 或 Delivery Hero。Jahez
              并不完美，但它是沙特公司、多品类、披露及时，也已经展现出该品类的两面：真实规模和真实竞争压力。2026 年 6 月中旬，Jahez 市值约 SAR2.76 billion，企业价值约 SAR2.81
              billion，过去十二个月收入约 SAR2.52 billion，对应 EV/收入约 1.0x。FY2025 仍然盈利，但 2026 年 Q1
              已经说明，增长和份额防守可以与利润率压缩并存；当营销和并表成本上升，季度亏损也可能出现。这就是看 Ninja 的关键镜头。如果 Ninja 披露的 2025 年 $1 billion
              确为净收入，最新私募估值隐含的销售倍数约 1.5x，对一家增长更快的私有龙头来说偏高但并不离谱。如果该数字实际上是 GMV——Menabytes 明确提醒过这一点——真实倍数可能高得多。DoorDash 和
              Delivery Hero 这类公开市场巨头主要提供规模背景，不能作为干净的定价锚。
