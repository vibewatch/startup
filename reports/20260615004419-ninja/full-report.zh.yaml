  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >-
              Ninja
              可见客户群以消费者为先、由便利性驱动。应用界面瞄准的是不想离家、又想获得餐食配送、紧急补货生鲜杂货、家庭用品、美妆或健康产品，以及深夜必需品的人。这意味着付款方、用户和受益者通常是同一个人或家庭，而不是采购团队或企业账户。品类组合也暗示多种需求时刻：点餐、厨房储备补货、婴儿护理、宠物护理和药房邻近紧急需求。地域同样重要。公开来源把
              Saudi Arabia 描述为核心市场，向 Bahrain、Qatar 和 Kuwait 的 GCC
              扩张扩大了用户底盘，但没有改变模型的消费者属性。不可见的是按城市、同期群或品类划分的客户数，因此本章必须从品类、应用指标和市场研究推断客户结构，而不是依赖公司同期群表。
