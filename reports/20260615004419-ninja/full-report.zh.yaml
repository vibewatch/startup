        - 区域生态型替代方案
        - Talabat 2025 年 GMV $9.5B，调整后 EBITDA 利润率 6.5%；Noon Minutes 扎根 GCC
        - 餐饮、食品杂货、零售、订阅、区域商户网络
        - 资本更充足，生态宽度更大，且 UAE 参考地位强
        - 相比 Ninja，不那么沙特本土化，也不是最干净的本地同类可比
