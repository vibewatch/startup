  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景，以及该估值在战略上为何说得通
        blocks:
          - type: paragraph
            body: >-
              Ninja 的 2025 年融资轮不能简单视作叙事泡沫。多个本地和区域来源指向同一组基本事实：公司以 $1.5 billion 估值融资约 $250 million 至 $254 million，由 Riyad
              Capital 领投，而公司从创立到达到这一估值只用了约三年。支撑该估值的运营故事也并非凭空想象。官方和报道口径显示，Ninja
              覆盖沙特阿拉伯、巴林、卡塔尔和科威特，依托以前置仓为主的履约网络提供杂货、家庭用品、药房和餐饮服务；独立报道估算其网络超过一百个站点、覆盖二十八座城市。这个规模足以支撑严肃的 IPO
              准备。但承销问题在标题之后立刻出现：公开来源反复强调盈利能力和十亿美元级“收入”，却没有提供审计报表、从 GMV 到净收入的清晰桥接，也看不到股权结构条款。因此，战略故事是真实的，财务证据仍不完整。
