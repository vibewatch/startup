        - 如果业务证明净收入干净、利润率韧性不靠补贴驱动增长，风险会下降。
      - - 估值立场
        - 偏高
        - $1.5B 估值只有在增长和收入质量按有利口径解读时才站得住。
        - 如果披露收入确认为净收入，且 2026 年执行接近目标，估值会向公允靠拢。
