      - number: '1.3'
        title: 资本、估值与经营规模
        blocks:
          - type: paragraph
            body: >-
              Ninja 的资本故事在时间上异常压缩。到 2025 年中，公司已在 Riyad Capital 领投轮中融资约 $250 million，估值约 $1.5 billion，并进入独角兽行列。Riyad
              Capital 的公司关联声明与独立创业媒体都认为，这轮融资用于加速技术、物流、地域覆盖和新品类扩张，而不是单纯庆祝估值标记。公开的 IPO 前报道随后迅速从融资转向上市准备：到 2026 年 3
              月，Wamda、Mubasher 和 Zawya 都在报道投资者沟通、投行选择，以及 Riyadh 上市流程处于积极评估中。公开规模指标部分来自公司口径，但方向上很强：应用商店宣传 5,000-plus 家餐厅和
              15,000-plus 个产品；Saudi FoodTech 和 The Gulf Wire 称 Ninja 在 28 个城市运营约 100 个前置仓；多家 2026 年 3 月媒体重复提到 2025 年约 $1
              billion 收入，以及 2026 年 $1.6 billion 目标。这些数字能证明野心和规模，但 Ninja 仍是私营公司，因此应把它们视为 IPO 前叙事证据，而不是已审计的公开事实。
