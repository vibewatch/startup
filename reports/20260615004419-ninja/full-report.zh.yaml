  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从规模验证和市场空间，经披露风险，推导出跟踪建议的逻辑链。
    data:
      nodes:
        - id: scale
          label: 规模验证：约 3 年成独角兽，100+ 暗店，多国覆盖
          type: input
        - id: market
          label: 市场空间：沙特和 GCC 即时零售仍在快速增长
          type: process
        - id: comp
          label: 本地公开锚点：Jahez 接近约 1.0x EV / 收入，且已盈利
          type: process
        - id: ambiguity
          label: 披露缺口：2025 年「$1B revenue」实际可能是 GMV
          type: process
        - id: risk
          label: 风险叠加：补贴正常化、依赖 IPO 窗口、股权结构不透明
          type: process
        - id: recommendation
          label: 建议：跟踪而非买入，直到经审计的收入质量清晰
          type: output
      edges:
        - from: scale
          to: market
          label: 大品类里，执行可能很重要
        - from: market
          to: comp
          label: 需要本地公开市场基准
        - from: comp
          to: ambiguity
          label: 倍数支撑取决于收入定义干净
        - from: ambiguity
          to: recommendation
          label: 指标含混挡住激进承销
        - from: risk
          to: recommendation
          label: IPO 时点和偏薄的单位经济性进一步增加谨慎
        - from: scale
          to: recommendation
          label: 运营动能真实，因此保持跟踪
