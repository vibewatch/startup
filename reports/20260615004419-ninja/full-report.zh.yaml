      - number: '3.4'
        title: 护城河耐久性，以及补贴战的监管边界
        blocks:
          - type: paragraph
            body: >-
              Ninja 最好的公开论据是，它已经搭出一套沙特本土的快速家庭补货运营系统：前置仓、强城市密度、药房扩张，以及越来越可信的 IPO
              路径。不能过度宣称这条护城河的最大原因是，每一个严肃独立来源也都强调了利润率薄、用户行为由补贴驱动，或两者兼有。Redseer 称 2025 年餐食配送增长由免配送费和重折扣加速。Mordor
              称价格战会把一个十八美元购物篮的贡献利润压到约三十六美分。法律评论又加了一层约束：沙特竞争指引正更明确地针对掠夺性定价、排他安排和经营者集中申报，这意味着靠蛮力激励或收购滚动赢份额的打法，并不像乍看那样不受限制。换句话说，Ninja
              今天的护城河看起来是运营型、且贴合本地市场；但公开记录仍未证明在留存、take rate 或订单级经济性上的结构性锁定。公司仍有可投资性，但在护城河耐久性最关键的地方证据偏轻。
