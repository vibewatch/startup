  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计的 2025 年和 2026 年 YTD 财务
        - 区分 GMV、净收入、毛利、EBITDA 和贡献利润率的报表
        - 这是负责任承销当前估值的最大单一障碍
        - 直接向管理层、顾问或 IPO 前材料索取
      - - 股权结构和优先权
        - 清算优先权、反稀释、期权池，以及 2025 轮任何结构化条款
        - 后期和 IPO 回报可能与标题式投后估值大幅背离
        - 作出任何承诺前，向律师和投资者关系顾问索取
      - - 暗店队列经济性
        - 按城市列示的订单密度、平均客单、损耗、营销回本和成熟门店贡献
        - 只有密度能转化为可持续盈利，模型才配得上溢价
        - 索取头部运营市场的城市和年份队列
      - - IPO 流程细节
        - 已选银行、预期规模、计划时间窗口和募资用途
        - 估值故事部分依赖公开市场就绪度和流动性时间
        - 索取当前流程备忘录或董事会批准的上市时间表
      - - 监管与劳动敞口
        - 沙特和 GCC 市场中，任何对定价、劳动者或药房合规变化的重大敞口
