      - number: '5.2'
        title: 前置仓与配送运营模型
        blocks:
          - type: paragraph
            body: >-
              关于 Ninja 如何运作，最强公开证据来自运营模型来源，而不是系统图。第三方报道描述了 28 个城市的 100 个前置仓、专门建设的履约中心，以及最快 20
              分钟的配送时间；品类报告则解释，沙特即时零售经济性通常依赖把库存放在距离密集城市需求约两公里内。这个组合指向本地密度模型：小而密的设施、精选 SKU
              池，以及围绕快速补货购物篮设计的骑手调度，而不是每周囤货订单。应用承诺自有骑手和实时追踪，也契合该模型。它还解释了为什么沙特城市经济、气候和地址基础设施如此重要。运营问题不是 Ninja 能否在 Riyadh
              快速配送，而是它能否把类似密度经济性扩展到更多城市，同时不让人工、损耗或客单价压力侵蚀速度承诺。
