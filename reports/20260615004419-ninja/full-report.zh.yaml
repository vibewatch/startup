      - number: '7.5'
        title: 监测指标、止损条件，以及仍需直接尽调的问题
        blocks:
          - type: paragraph
            body: >-
              下一步不应是直接否定这条投资假设，而是收紧它成立的条件。监测框架应聚焦管理层能真实披露、投资者也能横向比较的指标：补贴退坡后的 cohort
              留存、按品类和城市拆分的贡献毛利、三大核心都会区以外的网点回本周期、新劳工制度下的人力与薪资例外率，以及 IPO 准备进度是否跑得过市场窗口收窄速度。公开信息里的未解缺口仍然重要。Ninja
              的骑手结构、商户集中度、前置仓租约敞口、品类级盈利能力，目前都没有公开拆分。这些不是修饰性遗漏，而是判断高速 GMV 增长究竟在变成耐久消费平台、还是更脆弱的 IPO
              前故事的关键数据。在这些披露出现之前，这条投资假设可以成立，但必须配套明确的止损标准；相比管理层标题，投资者应更信运营证据。
