      - number: '8.3'
        title: 情景与回报纪律
        blocks:
          - type: paragraph
            body: >-
              与其假装精确，不如用情景逻辑。牛市情景假设三件事同时发生：第一，2025 年“$1 billion”确实反映净收入，而不是 GMV；第二，管理层基本兑现报道中的 2026 年 $1.6 billion
              目标；第三，即便沙特监管把市场推离补贴驱动获客，业务仍能守住经营盈利。在这种解读下，投资者可能接受 1.2x 至 1.5x
              销售倍数区间，从而为当前私募估值以上提供支撑。基准情景更窄，也更苛刻：增长延续，但在审计披露证明经济性之前，外部投资者仍会按接近 Jahez
              的公开市场纪律给公司定价。熊市情景则自然来自反向证据。如果标题口径的收入大多只是 GMV，如果补贴正常化暴露出薄利润率，或者 IPO
              窗口后移，当前私募估值很可能需要以明显折价清算。因此，当前估值并非不可能成立；只是它太依赖证据，不能被当作自我验证的事实。
