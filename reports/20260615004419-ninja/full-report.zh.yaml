      - number: '3.2'
        title: 直接对手、既有玩家与替代压力
        blocks:
          - type: paragraph
            body: >-
              最接近的竞争压力来自三种不同形态，而不是一组干净同业。HungerStation 是最宽的运营替代品，因为它已经把餐厅、生鲜杂货、药房、订阅留存，以及一个远大于 Ninja
              公开披露规模的门店网络结合在一起。Jahez 是最有用的公开基准，因为它披露当前沙特数字，已经把生鲜杂货和零售放进核心应用，并且仍在重金防守份额，尽管公司仍然盈利。Mrsool
              重要的原因不同：它较少竞争标准化前置仓经济性，更多竞争灵活跑腿、自定义任务和万物配送行为。Talabat 和 Noon
              等区域超级应用生态不属于沙特纯玩家竞争，但仍塑造用户对广度、忠诚度和资本纪律的预期。结果是，Ninja 的真实竞争集合包括直接即时零售运营商、沙特上市既有玩家，以及披露规模更强或区域物流网络资金更足的生态替代品。
