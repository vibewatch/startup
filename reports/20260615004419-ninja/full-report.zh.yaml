            body: >-
              Ninja 不披露单元经济，因此最好的公开框架来自沙特市场同业和行业研究。Jahez 是最有用的上市可比，因为其文件实时展示竞争如何影响一家沙特配送平台：FY2025 佣金收入增长，配送费收入下降，KSA
              利润率保持为正，管理层明确表示加大营销和促销支出来防守份额。Q1 2026 又把问题推得更尖锐——集团收入继续增长，但盈利被留存支出和竞争性定价压力挤压。Redseer 给出结构性解释：2025
              年增长超出预期，但很大一部分由补贴推动并压缩利润率，监管者也开始约束这些手段。Introchek
              的情景研究把叙事翻译成订单层面的直觉，显示典型购物篮在扣除骑手、包装和枢纽成本后只会留下很薄贡献。合起来看，Ninja 可能运营能力强，但它仍处在一个执行纪律、路线密度和费率组合远比单纯收入增长更重要的品类里。
