companyProfile:
  summary: >-
    Ninja 总部位于 Riyadh，是一家即时零售平台，已经从沙特的生鲜杂货和餐食配送应用，扩展成覆盖生鲜杂货、餐厅、药房、个人护理和家庭日用品的更宽泛即时零售入口，市场横跨 Saudi Arabia、Bahrain、Qatar 和
    Kuwait。2025 年 Riyad Capital 领投一轮融资后，公司跻身独角兽；公开口径称其已实现运营盈利，也已经被讨论为未来 Tadawul IPO
    候选。但公开记录仍主要依赖公司关联披露和媒体层面的信息，而不是审计财务报表。
