        title: Product Surface and Customer Jobs
        blocks:
          - type: paragraph
            body: >-
              Ninja's public app surfaces describe a multi-vertical commerce product rather than a single-category
              grocery app. The two official app listings present one interface that serves restaurant delivery, grocery
              top-ups, household goods, personal care, baby products, pet care, and pharmacy-adjacent needs, with
              5,000-plus restaurants, 15,000-plus products, real-time tracking, and round-the-clock availability. That
