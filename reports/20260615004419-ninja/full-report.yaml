      - number: '1.3'
        title: Capital, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              The capital story is unusually compressed in time. By mid-2025 Ninja had raised about $250 million in a
              Riyad Capital-led round that set a roughly $1.5 billion valuation and pushed the company into unicorn
              status. The company-linked Riyad Capital statement and independent startup press agree that the round was
              meant to accelerate technology, logistics, geographic coverage, and new category expansion rather than
              simply celebrate a valuation mark. Public pre-IPO coverage then moved quickly from funding to listing
              preparation: by March 2026, Wamda, Mubasher, and Zawya were all reporting investor conversations, bank
              selection, and a Riyadh listing process under active evaluation. Public scale markers are partly
              company-claimed, but they are directionally strong: the app stores market 5,000-plus restaurants and
              15,000-plus products; Saudi FoodTech and The Gulf Wire say Ninja operates around 100 dark stores in 28
              cities; and multiple March 2026 outlets repeat roughly $1 billion of 2025 revenue with a $1.6 billion 2026
              target. Those figures establish ambition and scale, but because Ninja is still private they should be
              treated as pre-IPO narrative evidence rather than audited public fact.
