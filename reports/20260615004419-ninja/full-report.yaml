  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Risk overview: the market is real, but the path to durable economics is not yet proven'
        blocks:
          - type: paragraph
            body: >-
              Ninja’s risk profile is not about whether demand exists. The prepared pack supports a large and growing
              Saudi-led quick-commerce category, strong app traction, and real investor appetite. The central question
              is whether growth remains attractive once the market moves away from subsidy-led acceleration and into a
              more disciplined operating regime. That is why the highest-weight risks in this chapter reinforce one
              another: if promotions taper, order frequency and margin quality become more visible; if labor compliance
              and heat rules raise cost, the same low-ticket basket becomes harder to support; if density weakens
              outside the best metros, the regional expansion story becomes less compelling right as a possible IPO
              would require a cleaner economics narrative. The result is not a broken thesis, but a thesis that can
              break quickly if margin normalization, labor compliance, and capital-markets timing all move the wrong way
              together.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
              - CR012
              - CR040
