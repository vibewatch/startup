      - CR006
      - CR010
      - CR016
      - CR036
      - CR012
      - CR003
      - CR040
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: Critical external dependencies that can interrupt Ninja’s growth or public-market readiness.
    data:
      nodes:
        - id: d1
          label: GAC / regulators
          detail: Shape pricing conduct and transaction process.
          tone: risk
        - id: d2
          label: Labor platforms
          detail: Qiwa, Mudad, and wage-protection controls gate staffing continuity.
          tone: risk
        - id: d3
          label: Rider pool
          detail: Availability and compliance directly affect service levels.
          tone: risk
        - id: d4
          label: Dense urban hubs
          detail: Coverage and payback depend on a few core city economics.
          tone: risk
        - id: d5
          label: Incumbent ecosystems
          detail: Jahez, HungerStation, Keeta, and others set the competitive benchmark.
          tone: risk
        - id: d6
          label: Capital sponsors / IPO banks
          detail: Round support and listing advice shape financing flexibility.
          tone: warning
        - id: d7
          label: Disclosure and audit stack
          detail: Going-concern, KPIs, and controls must mature before a listing.
          tone: warning
        - id: d8
          label: Regional expansion nodes
          detail: Bahrain, Qatar, and Kuwait must replicate enough local density.
          tone: risk
      edges:
        - from: d1
          to: d6
          label: influences
        - from: d2
          to: d3
          label: governs
        - from: d3
          to: d4
          label: serves
        - from: d4
          to: d8
          label: must scale beyond
        - from: d5
          to: d6
          label: sets urgency for
        - from: d6
          to: d7
          label: requires
        - from: d8
          to: d6
          label: feeds thesis for
    approximationNotes: Dependencies are shown as governance and operating chokepoints rather than a full corporate org chart.
