  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: Logic chain from scale proof and market runway through disclosure risk to the track recommendation.
    data:
      nodes:
        - id: scale
          label: 'Scale proof: unicorn in ~3 years, 100+ dark stores, multi-country footprint'
          type: input
        - id: market
          label: 'Market runway: Saudi and GCC q-commerce still growing quickly'
          type: process
        - id: comp
          label: 'Local public anchor: Jahez near ~1.0x EV/revenue despite profitability'
          type: process
        - id: ambiguity
          label: 'Disclosure gap: 2025 “$1B revenue” may actually be GMV'
          type: process
        - id: risk
          label: 'Risk overlay: subsidy normalization, IPO-window dependence, cap-table opacity'
          type: process
        - id: recommendation
          label: 'Recommendation: Track, not buy, until audited revenue quality is clear'
          type: output
      edges:
        - from: scale
          to: market
          label: Execution can matter in a large category
        - from: market
          to: comp
          label: Need a public local benchmark
        - from: comp
          to: ambiguity
          label: Multiple support depends on clean revenue definition
        - from: ambiguity
          to: recommendation
          label: Metric ambiguity blocks aggressive underwriting
        - from: risk
          to: recommendation
          label: IPO timing and thin-unit economics add further caution
        - from: scale
          to: recommendation
          label: Stay engaged because operating momentum is real
    approximationNotes: Relationships are qualitative and price-sensitive rather than outputs of a scored investment model.
    claimRefs:
      - CV004
      - CV013
      - CV025
      - CV029
      - CV030
      - CV042
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Sensitivity of implied valuation to different sales-multiple assumptions around the current private mark.
    data:
      xAxis: Scenario or reference multiple
      yAxis: Implied valuation (USD billions)
      items:
        - label: 'Bear: 0.7x sales-equivalent'
          value: 0.8
          note: Reflects GMV ambiguity or weak IPO window
        - label: 'Jahez-like anchor: ~1.0x'
          value: 1.2
          note: Closer to the local public benchmark
        - label: Current private mark
          value: 1.5
          note: Requires favorable interpretation of revenue quality
        - label: 'Bull: 1.2x sales'
          value: 1.9
          note: Assumes cleaner disclosure and strong 2026 delivery
        - label: 'Bull+: 1.5x sales'
          value: 2.4
          note: Requires premium market reception and verified net revenue
    approximationNotes: >-
      Values are rounded scenario outputs built from the retained public evidence rather than from management forecasts
      or audited projections.
    claimRefs:
      - CV013
      - CV029
      - CV031
      - CV046
      - CV047
      - CV048
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Bull, base, and bear valuation bands for Ninja given current public evidence quality.
    data:
      items:
        - label: 'Bear: GMV-heavy interpretation or IPO slippage'
          low: 0.6
          high: 1
          mid: 0.8
          unit: USD billions
          note: Disclosure weakness or market-window deterioration forces a discount
        - label: 'Base: growth holds but proof still anchors near Jahez-like discipline'
          low: 1.1
          high: 1.7
          mid: 1.4
          unit: USD billions
          note: Current private mark sits inside the upper half of the base case
        - label: 'Bull: clean net revenue plus strong 2026 execution'
          low: 1.9
          high: 2.4
          mid: 2.1
          unit: USD billions
          note: Needs premium market acceptance and verified revenue quality
    approximationNotes: >-
      Scenario ranges are intentionally coarse because the largest uncertainty is metric definition, not decimal-point
      modeling.
    claimRefs:
      - CV029
      - CV030
      - CV037
      - CV038
      - CV039
      - CV046
      - CV047
      - CV048
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Key valuation and risk signals for Ninja as of mid-June 2026.
    data:
      items:
        - label: Last private valuation
          value: $1.5B
          change: 2025 round
          status: current
        - label: 2025 headline top line
          value: ~$1.0B
          change: Public metric may be GMV, not net revenue
          status: warning
        - label: 2026 headline target
          value: $1.6B
          change: Reported by multiple IPO-prep stories
          status: growing
        - label: Local public anchor
          value: Jahez ~1.0x EV/revenue
          change: Profitable but promotion-pressured
          status: current
        - label: Sector adverse signal
          value: $0.36 contribution margin
          change: Mordor small-basket price-war scenario
          status: warning
        - label: IPO ambition
          value: ~$1B float discussed
          change: Timing still market-window dependent
          status: current
    approximationNotes: >-
      KPI set intentionally mixes scale, valuation, and risk because the recommendation is price-sensitive and
      disclosure-sensitive.
    claimRefs:
      - CV001
      - CV007
      - CV009
      - CV013
      - CV024
      - CV041
      - CV045
