        title: Identity and operating surface
        blocks:
          - type: paragraph
            body: >-
              Ninja now has a clear official Saudi consumer surface at ananinja.com/sa/en, plus Arabic localization and
              app-store distribution that point to an active, consumer-facing quick-commerce brand rather than a stealth
              operating shell. The homepage metadata and structured snippets expose a Riyadh address in Alyasmin, a
              support@ananinja.com contact, and product language centered on quick delivery 24/7. Apple's listing names
              TECH-ADVANCE FOR INFORMATION TECHNOLOGY CO as provider while Google Play shows the developer name Ana
              Ninja, which together suggest a visible Saudi operating footprint but not a fully disclosed legal-entity
              map. The product surface is explicitly multi-vertical: groceries, restaurant delivery, shopping, home
              services, and pharmacy all appear on official surfaces, while app copy stresses 30-minute-or-less
              delivery, all-day availability, and local payment support. For diligence purposes, this chapter treats the
              official consumer surfaces as strong evidence of what Ninja sells and where it sells, but not as proof of
              margins, headcount, or corporate governance depth.
