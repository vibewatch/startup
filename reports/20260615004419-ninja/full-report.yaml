      - number: '7.2'
        title: Regulatory and legal risk is less about licenses than about how the rules now shape competition and expansion
        blocks:
          - type: paragraph
            body: >-
              Saudi quick commerce is moving into a tighter rule set. Redseer’s prepared guidance says the regulator is
              explicitly targeting below-cost pricing, discriminatory treatment of sellers, exclusivity, and
              self-preferencing. That does not read like a demand-killer; it reads like a market-maturity event that can
              punish operators whose growth still depends on extreme incentives. At the same time, the legal pack
              matters for any strategy that includes partnerships, cross-border launches, or acquisitions. Baker Botts,
              Addleshaw, and Chambers all show that the GAC’s concentration framework has become more explicit, with
              defined thresholds, one-year approval validity, and real penalties for non-notification. Trade.gov and UHY
              broaden the warning: compliance in Saudi Arabia is increasingly continuous, data-driven, and sometimes
              unpredictable across agencies. For Ninja, that means the regulatory risk is not an abstract headline. It
              is a daily operating constraint on promotions, employment administration, data flows, and any deal-driven
              expansion logic.
            claimRefs:
              - CR005
