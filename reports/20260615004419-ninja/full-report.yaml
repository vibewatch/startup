      - number: '3.4'
        title: Moat durability and the regulatory limits on a subsidy war
        blocks:
          - type: paragraph
            body: >-
              The best public case for Ninja is that it has built a Saudi-native operating system for rapid household
              replenishment: dark stores, strong city density, pharmacy expansion, and an increasingly credible path to
              an IPO. The biggest reason to resist over-claiming that moat is that every serious independent source also
              highlights thin margins, subsidy-led user behavior, or both. Redseer says 2025 food-delivery growth was
              accelerated by free delivery and heavy discounting. Mordor says price wars can squeeze contribution
              margins to roughly thirty-six cents on an eighteen-dollar basket. Legal commentary adds another
              constraint: Saudi competition guidance is becoming more explicit on predatory pricing, exclusives, and
              merger-control notifications, which means the playbook for winning share through brute-force incentives or
              acquisitive roll-ups is less unconstrained than it first appears. Put differently, Ninja’s moat looks
              operational and local-market-specific today, but the public record still does not prove structural lock-in
              on retention, take rates, or order-level economics. That keeps the company investable, yet still
              evidence-light where moat durability matters most.
