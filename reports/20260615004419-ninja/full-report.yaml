              essentials without leaving home. That means the payer, user, and beneficiary are usually the same person
              or household, not a procurement team or enterprise account. The category mix also suggests multiple demand
              moments: meal ordering, pantry replenishment, baby care, pet care, and pharmacy-adjacent urgency.
