      - number: '8.3'
        title: Scenarios and return discipline
        blocks:
          - type: paragraph
            body: >-
              Scenario logic is more honest here than false precision. The bull case assumes three things happen
              together: first, that the 2025 “$1 billion” figure really reflects net revenue rather than GMV; second,
              that management delivers close to the reported $1.6 billion 2026 target; and third, that the business can
              defend operating profitability even as Saudi regulation pushes the market away from subsidy-driven
              acquisition. Under that interpretation, investors might accept a 1.2x to 1.5x sales range, producing
              valuation support above the current private mark. The base case is narrower and more demanding: growth
              continues, but outsiders still price the company closer to Jahez-like public discipline until audited
              disclosures prove the economics. The bear case follows naturally from the adverse evidence. If the
              headline top line turns out to be mostly GMV, if subsidy normalization exposes thin margins, or if the IPO
              window slips, the current private mark would likely need to clear at a meaningful discount. The current
              valuation is therefore not impossible; it is simply too evidence-sensitive to treat as self-validating.
            claimRefs:
              - CV022
