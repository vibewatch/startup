  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and what makes the mark strategically plausible
        blocks:
          - type: paragraph
            body: >-
              Ninja’s 2025 financing round cannot be dismissed as pure narrative inflation. Multiple local and regional
              sources converge on the same basic facts: the company raised roughly $250 million to $254 million at a
              $1.5 billion valuation, Riyad Capital led the round, and the business reached that mark only about three
              years after founding. The operating story behind that valuation is also not imaginary. Official and
              reported descriptions place Ninja across Saudi Arabia, Bahrain, Qatar, and Kuwait, serving groceries,
              household goods, pharmacy, and restaurants from a dark-store-heavy fulfillment network that independent
              reporting sizes at more than one hundred sites across twenty-eight cities. That is enough scale to justify
              serious IPO preparation. But the underwriting problem begins immediately after the headline: public
              sources celebrate profitability and billion-dollar “revenue,” yet they do not provide audited statements,
              a clear bridge from GMV to net revenue, or visibility into cap-table terms. So the strategic case is real,
              while the financial evidence remains incomplete.
            claimRefs:
