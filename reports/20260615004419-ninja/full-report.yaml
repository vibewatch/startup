  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Typical Ninja consumer path from discovery and need recognition through ordering, fulfilment, support, and repeat
      use.
    data:
      nodes:
        - label: Need trigger
          detail: User needs a meal, urgent grocery top-up, baby item, beauty product, or pharmacy-adjacent purchase
        - label: Discover and compare
          detail: User opens Ninja because the app promises category breadth, speed, and late-hour convenience
        - label: Build basket
          detail: User picks a restaurant or local convenience assortment and commits to a basket
        - label: Checkout and wait
          detail: Payment and dispatch expectations are set by the 20-to-30-minute promise and real-time tracking
        - label: Receive and evaluate
          detail: Actual delivery quality, item completeness, freshness, and refund response determine trust
        - label: Repeat, expand, or churn
          detail: Satisfied users repeat across categories; disappointed users compare peers or stop using the app
