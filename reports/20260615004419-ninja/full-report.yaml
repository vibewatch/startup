  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Ninja should not be analyzed as if it participates in all grocery retail, all food delivery, or all GCC
              e-commerce spend. The prepared evidence is much narrower. Redseer frames the category as quick retail: a
              fast-delivery layer that now bundles grocery, pharmacy, household basics, and other urgent-use items on
              top of legacy food delivery. Ninja’s own app-store positioning reinforces that boundary by advertising
              5,000+ restaurants, 15,000+ products, pharmacy, personal care, and 30-minute-or-less delivery in a single
              app session. The included spend is therefore urgent household replenishment and convenience-led retail,
              not the entire weekly stock-up or every digital purchase a Gulf household makes. The status-quo
              substitutes remain neighborhood stores, hypermarkets, and same-day marketplace retail, while food-only
              apps and other q-commerce players compete for the same attention and wallet. That framing matters because
              it makes the market investable, but smaller and more execution-sensitive than a generic ‘digital retail’
              narrative would imply.
