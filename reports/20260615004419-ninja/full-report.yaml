      - number: '1.5'
        title: Watchpoints and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The public story is strong, but the downside signals are real and should not be dismissed as noise. The
              customer-review corpus includes repeated complaints about refunds, missing items, slow delivery, and
              unresponsive support, including examples where reviewers said the product promise of 20-30 minutes
              stretched to more than an hour. Those complaints matter because the sector's economics are thin even when
              execution is tight: Introchek's scenario analysis argues that a typical basket can leave only modest
              contribution after courier, packaging, and micro-hub costs, while gig-courier churn and regulatory
              attention raise the operating burden further. Trade.gov adds a broader Saudi operating lens by
              highlighting regulatory opacity, localization pressure, and delayed-payment risk in the market. None of
              these points disproves Ninja's operating momentum, but together they explain why the company overview
              should carry explicit diligence asks on governance depth, service quality consistency, private financial
              disclosure, and the durability of profitability as the category moves from subsidy-led growth to tighter,
              more regulated competition.
            claimRefs:
              - CO017
              - CO032
              - CO033
              - CO034
              - CO035
              - CO036
