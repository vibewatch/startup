      - number: '8.2'
        title: Public comparable lens and why metric ambiguity matters
        blocks:
          - type: paragraph
            body: >-
              The most relevant public benchmark in the local evidence pack is Jahez, not DoorDash or Delivery Hero.
              Jahez is imperfect, but it is Saudi, multi-vertical, current on reporting, and it already shows both sides
              of the category: real scale and real competition pressure. In mid-June 2026 Jahez carried roughly SAR2.76
              billion of market cap and SAR2.81 billion of enterprise value against trailing revenue of about SAR2.52
              billion, which is roughly 1.0x EV-to-revenue. FY2025 still showed profitability, while Q1 2026 showed that
              growth and share defense can coexist with compressed margins and even quarterly losses after marketing and
              consolidation costs rise. That is the key lens for Ninja. If Ninja’s reported $1 billion for 2025 is true
              net revenue, the latest private mark implies only about 1.5x sales, which is stretched but not absurd for
              a faster-growing private leader. If that figure is actually GMV, as Menabytes explicitly warned, the real
              multiple could be far higher. Public-market giants such as DoorDash and Delivery Hero matter mainly as
              scale context, not as clean pricing anchors.
