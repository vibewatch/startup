  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Ninja's public revenue model is easy to describe and hard to underwrite. Official surfaces clearly
              position the product as a multi-vertical transaction marketplace: food delivery, groceries, pharmacy,
              shopping, and home-services demand are all aggregated into one app, with 5,000-plus restaurants and
              15,000-plus products marketed to the Saudi user base. That breadth matters because it implies more than
              one basket type and more than one gross-margin profile. What is missing is any direct disclosure of take
              rate, merchant commission, delivery-fee schedule, subscription economics, or realized margin by vertical.
