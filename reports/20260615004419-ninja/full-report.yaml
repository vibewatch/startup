      - number: '2.2'
        title: Evidence-constrained sizing instead of one easy headline
        blocks:
          - type: paragraph
            body: >-
              The prepared pack supports a real market, but not one clean number. Mordor’s regional lens puts GCC quick
              commerce at USD 4.59 billion in 2026 and Saudi Arabia alone at USD 2.38 billion, with Saudi representing
              54.76% of 2025 regional demand. IMARC uses a different scope and longer horizon, starting from USD 2.7
              billion in 2025 and projecting USD 26.5 billion by 2034 at a 27.87% CAGR. Statista’s methodology note is
              useful precisely because it shows why these numbers diverge: the category is modeled from GMV, company
              reports, third-party studies, and consumer survey inputs rather than from one standardized disclosure
              base. The safest underwriting view is therefore not to pick a favorite forecast but to preserve the
              spread, use Saudi as the core market lens, and anchor any Ninja share discussion against disclosed
              public-company comparables such as Jahez rather than against one broad TAM slide. Public evidence proves
              scale and growth; it does not yet prove a precise Ninja SAM or SOM.
