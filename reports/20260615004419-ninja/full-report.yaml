  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue-quality disappointment
        - Management clarifies that the reported $1B 2025 figure was mostly GMV rather than net revenue
        - Current valuation multiple expands sharply and the Jahez comparison deteriorates
        - Move from track toward avoid unless price resets materially
      - - 2026 target miss
        - Meaningful shortfall versus the reported $1.6B 2026 target
        - Breaks the growth case needed to justify a premium to Jahez-like public multiples
        - Re-underwrite on lower sales and tighter multiples immediately
      - - IPO window slips
        - Listing delayed beyond 2027 because banks or market conditions cool
        - Removes a key liquidity path and weakens narrative support for the last round mark
        - Demand a larger discount or stand aside until timing resets
      - - Margin fragility
        - Evidence shows profitability depended on subsidy intensity or unsustainably thin contribution margins
        - Undercuts the strategic claim that Ninja solved the q-commerce graveyard problem locally
        - Shift to downside-case underwriting and lower valuation bands
      - - Regulatory or conduct clampdown
        - Predatory-pricing or labor enforcement materially lifts costs or narrows acquisition tactics
        - Further weakens a speed-led share defense model
        - Reduce target valuation until new steady-state economics are observable
    notes: Triggers are analyst-defined monitoring thresholds based on the public evidence pack, not management guidance.
    claimRefs:
      - CV022
      - CV024
      - CV027
      - CV039
      - CV041
      - CV048
      - CV052
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited 2025 and YTD 2026 financials
        - Statements that separate GMV, net revenue, gross profit, EBITDA, and contribution margin
        - This is the single biggest blocker to underwriting the current mark responsibly
        - Request directly from management, advisers, or pre-IPO materials
      - - Cap table and preferences
        - Liquidation preferences, anti-dilution, option pool, and any structured terms in the 2025 round
        - Late-stage and IPO returns can diverge sharply from headline post-money valuation
        - Request from counsel and investor-relations advisers before any commitment
      - - Dark-store cohort economics
        - Order density, average basket, shrink, marketing payback, and mature-store contribution by city
        - The model only deserves a premium if density converts into durable profitability
        - Request city and vintage cohorts for the top operating markets
      - - IPO process detail
        - Selected banks, expected size, intended timing window, and use of proceeds
        - The valuation story partly rests on public-market readiness and liquidity timing
        - Request current process memo or board-approved listing timetable
      - - Regulatory and labor exposure
        - Any material exposure to pricing, worker, or pharmacy-compliance changes across Saudi and GCC markets
        - Independent sources already frame regulation as a real economic variable in q-commerce
        - Map legal exposures with local counsel and operating leadership
    notes: These asks are the minimum package needed before moving from track to an investable underwriting recommendation.
    claimRefs:
      - CV036
      - CV041
      - CV049
      - CV050
      - CV051
