      nodes:
        - id: f1
          label: App discovery
          detail: Install arrives via app store visibility, word of mouth, or promotional awareness
        - id: f2
          label: First browse
          detail: User sees restaurants, groceries, and convenience categories in one app
        - id: f3
          label: First order
