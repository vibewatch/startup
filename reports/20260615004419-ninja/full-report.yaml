      - number: '7.3'
        title: Operational and labor risk sit directly in the unit economics of the model
        blocks:
          - type: paragraph
            body: >-
              The adverse sources in this pack all point to the same problem: ultra-fast delivery can be technically
              impressive while still leaving little financial room for error. Mordor says the Saudi price-war phase
              compressed contribution margin to roughly USD 0.36 on an USD 18 basket, and Introchek’s scenario work
              shows how quickly payback stretches once density falls outside the best urban clusters. That would already
              be a demanding operating model before labor reforms. It becomes harder when summer work restrictions,
              payroll digitization, and higher compliance burdens force platforms to carry more structured rider
              processes. Ensaan’s reading of the 2025-2026 labor regime makes the point sharp: wage-protection, Qiwa
              contracts, and payroll exceptions are now operating controls, not back-office paperwork. Ninja’s own app
              promise—24/7 service across food, grocery, pharmacy, beauty, and electronics—widens the revenue
              opportunity, but it also multiplies stock, SLA, and quality-failure points. This is why the operating risk
              is less about one big outage and more about many small cost leaks compounding at low basket values.
            claimRefs:
