  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      How subsidy normalization, operating complexity, and compliance burden can compound into slower growth and weaker
      IPO optionality.
    data:
      nodes:
        - id: r1
          label: Promo taper
          detail: Subsidy intensity falls under competitive and regulatory pressure.
          tone: risk
        - id: r2
          label: Lower order frequency
          detail: Some cohorts prove more price-sensitive than hoped.
          tone: risk
        - id: r3
          label: Thin contribution margin
          detail: Low baskets and delivery costs leave little cushion.
          tone: risk
        - id: r4
          label: Labor / compliance cost rise
          detail: Heat rules, payroll controls, and formalization add cost.
          tone: risk
        - id: r5
          label: Complex multi-vertical ops
          detail: More categories create more stock and service failure points.
          tone: risk
        - id: r6
          label: Slower city economics
          detail: Density or payback disappoints outside the best metros.
          tone: risk
        - id: r7
          label: More capital or delayed IPO
          detail: External funding or a longer private runway becomes more likely.
          tone: risk
        - id: r8
          label: Share-defense spend
          detail: Incumbent rivalry keeps incentives and marketing elevated.
          tone: risk
        - id: r9
          label: Public-market optionality
          detail: Successful listing requires clean disclosures and a credible economics story.
          tone: warning
      edges:
        - from: r1
          to: r2
          label: can expose
        - from: r2
          to: r3
          label: reduces leverage on
        - from: r4
          to: r3
          label: raises cost into
        - from: r5
          to: r3
          label: adds failure points to
        - from: r3
          to: r6
          label: limits expansion economics
        - from: r8
          to: r3
          label: compresses
        - from: r6
          to: r7
          label: raises need for
        - from: r7
          to: r9
          label: weakens
    approximationNotes: The map synthesizes causal links from prepared market, legal, labor, and public-company comparator evidence.
    claimRefs:
