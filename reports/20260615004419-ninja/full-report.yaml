      - number: '3.2'
        title: Direct rivals, incumbents, and substitute pressure
        blocks:
          - type: paragraph
            body: >-
              The closest competitive pressure comes from three different shapes rather than one clean peer set.
              HungerStation is the broadest operating substitute because it already combines restaurants, grocery,
              pharmacy, subscription retention, and a store network that is far larger than anything Ninja discloses
              publicly. Jahez is the most useful public benchmark because it reports current Saudi numbers, has already
              moved grocery and retail into the core app, and is still spending heavily to defend share despite
              remaining profitable. Mrsool matters for a different reason: it competes less on standardized dark-store
              economics and more on flexible couriering, custom errands, and anything-delivery behavior. Regional
              super-app ecosystems such as Talabat and Noon sit outside Saudi pure-play rivalry but still shape user
              expectations on breadth, loyalty, and capital discipline. The result is that Ninja’s true competitive set
              includes direct quick-commerce operators, listed Saudi incumbents, and ecosystem substitutes with stronger
              disclosed scale or better-funded regional logistics networks.
