      - number: '4.4'
        title: Market and comparability context
        blocks:
          - type: paragraph
            body: >-
              The market context cuts both ways. Mordor and Economy Middle East both describe a fast-growing Saudi
              quick-commerce market, while Statista reminds readers that many market-forecast numbers are GMV-based and
              represent what consumers pay rather than what a platform books as net revenue. That methodological point
              matters because Ninja's publicly cited 2025 revenue and 2026 target sit close to or above some Saudi
              market-size estimates unless they are regional, gross, or otherwise non-comparable measures. On valuation
              context, Jahez is again the anchor public comp: Multiples.vc and StockAnalysis show a mid-2026 EV/revenue
              multiple around 1.0x and a market cap around $718 million, while DoorDash remains on a much larger public
              scale. The implication is not that Ninja should mechanically price off Jahez or DoorDash, but that public
              investors in delivery businesses care about fee mix, logistics efficiency, and margin resilience far more
              than private-market hype. Any Ninja underwriting model that uses the $1.5 billion private valuation as a
              default anchor without testing public comparables would be too generous.
