        title: Dark-Store and Delivery Operating Model
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence for how Ninja works comes from operating-model sources, not system diagrams.
              Third-party coverage describes 100 dark stores across 28 cities, purpose-built fulfilment centres, and
              delivery times as fast as 20 minutes, while category reports explain that Saudi quick-commerce economics
              usually depend on inventory held within roughly two kilometers of dense urban demand. That combination
              points to a local-density model: small, tightly placed facilities, curated SKU pools, and rider dispatch
              designed around fast top-up baskets rather than weekly stock-up orders. The app promise of owned riders
              and real-time tracking fits that model. It also explains why Saudi city economics, climate, and address
              infrastructure matter so much. The operating question is not whether Ninja can deliver fast in Riyadh, but
              whether it can extend similar density economics into more cities without letting labor, shrinkage, or
              basket-size pressure erode the speed promise.
