companyProfile:
  summary: >-
    Ninja is a Riyadh-based quick-commerce platform that has expanded from a Saudi grocery-and-meals delivery app into a
    broader on-demand retail surface spanning groceries, restaurants, pharmacy, personal care, and household essentials
    across Saudi Arabia, Bahrain, Qatar, and Kuwait. The company reached unicorn status in 2025 after a Riyad
    Capital-led round, is publicly described as operationally profitable, and is already being discussed as a future
    Tadawul IPO candidate; however, the public record still relies heavily on company-linked and media-level disclosures
    rather than audited financial statements.
  foundedDate: '2022-01-01'
  founders:
    - name: Saud Al Qahtani
      role: Co-founder
      background: Public coverage links him to prior HungerStation experience, strengthening local category founder-market fit.
      claimRefs:
