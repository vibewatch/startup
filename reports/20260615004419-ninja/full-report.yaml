  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and why leadership is still volatile
        blocks:
          - type: paragraph
            body: >-
              Ninja is competing in a market that has expanded well beyond restaurant delivery into a broader
              quick-retail layer for groceries, household top-ups, pharmacy, beauty, and convenience-led daily missions.
              The bullish part of the setup is obvious: Redseer and Mordor both describe a Saudi and GCC market that is
              still growing fast, with Saudi Arabia acting as the region’s center of gravity and grocery or staples
              remaining the anchor use case. But the same sources make clear that leadership is not settled. Redseer
              says Saudi quick-retail leadership has already rotated from Omnichannels to Nana to HungerStation and then
              Ninja, while the UAE lead is shared by Talabat and Noon. That means the market is large enough for Ninja
              to matter and unstable enough that speed alone is not a durable moat. Investors should read Ninja’s
              current lead as a live operating advantage, not as proof that the category has structurally consolidated
              around one winner.
