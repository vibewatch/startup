      - number: '4.5'
        title: Financial verdict and blockers
        blocks:
          - type: paragraph
            body: >-
              The public verdict is that Ninja likely has real scale, real density, and a plausibly stronger cost base
              than many regional peers—but the evidence is still one level short of underwrite-ready. Official surfaces
              prove the product exists, spans multiple categories, and supports enough supply density to matter. Peer
              filings and market research prove that Saudi delivery economics can stay positive under pressure, but only
              with careful commission mix, sponsored-fleet economics, and tighter control over promotions. What public
              sources do not prove is Ninja's own cash balance, burn, order-level profitability, merchant take rate, or
              the accounting basis behind the headline revenue numbers. The biggest blockers are therefore not whether
              Ninja is growing—they are whether the public figures are net revenue or GMV, whether the 2025 round is
              still substantially on the balance sheet, whether a 2026/2027 IPO is funding necessity or strategic
              choice, and whether service-quality complaints represent isolated noise or a real operating tax on
              margins. Until those questions are answered, the right financial stance is respectful but not complacent:
              the company may be good, yet the public evidence is still incomplete.
