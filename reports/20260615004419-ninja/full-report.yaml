            Dark stores, restaurant supply, and rider dispatch built for 20-to-30-minute service windows across dense
            city zones
        - label: Optimization and telemetry layer
          detail: >-
            App-scale metrics, AI-forecasting narratives, route optimization, and engagement telemetry inferred from
            category studies and app-intelligence tools
        - label: Regulatory and platform layer
          detail: >-
            App-store distribution, payments rails, labor-compliance systems, and competition-law boundaries that shape
            how the service can operate
    claimRefs:
      - CE001
      - CE003
      - CE010
      - CE021
      - CE031
      - CE039
      - CE043
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    summary: >-
      How a typical Ninja order moves from need recognition through app order, fulfilment, delivery, and post-order
      support loop.
    data:
      nodes:
        - id: n1
          label: Open app and choose vertical
          detail: User arrives for a food, grocery, beauty, or urgent household job inside one app
        - id: n2
          label: Browse store or restaurant selection
          detail: User navigates the relevant merchant or category inventory and builds a basket
        - id: n3
          label: Checkout and payment selection
          detail: Card or location-specific payment options convert the basket into a live order
        - id: n4
          label: Pick from dark store or merchant
          detail: Inventory and fulfilment node prepare the order for rider assignment
        - id: n5
          label: Rider dispatch and live tracking
          detail: Order is routed to a rider and surfaced to the user through real-time tracking
        - id: n6
          label: Delivery, refund, or support outcome
          detail: Fast delivery strengthens repeat usage; failures create refund, support, and trust burden
      edges:
        - from: n1
          to: n2
          label: category intent
        - from: n2
          to: n3
          label: basket assembled
        - from: n3
          to: n4
          label: confirmed order
        - from: n4
          to: n5
          label: picked and assigned
        - from: n5
          to: n6
          label: delivery outcome
        - from: n6
          to: n1
          label: repeat use or churn
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE008
      - CE021
      - CE037
  - id: FE003
    title: Critical dependency map
    type: dag
    summary: External dependencies that most directly shape Ninja's product quality, growth, and compliance boundary.
    data:
      nodes:
        - id: hub
          label: Ninja super-app
          type: hub
        - id: apps
          label: Google Play / Apple App Store
          type: platform
          risk: Release, ranking, and policy decisions affect acquisition and updates
        - id: stores
          label: Dark stores and merchant supply
          type: operations
          risk: Density, replenishment, and assortment discipline shape delivery quality
        - id: riders
          label: Rider workforce and labor systems
          type: labor
          risk: Qiwa, WPS, and GOSI compliance can raise cost and complexity
        - id: payments
          label: Payment rails and refund processes
          type: financial
          risk: Checkout failures or poor refund handling damage trust quickly
        - id: regs
          label: Competition and operating regulators
          type: regulatory
          risk: Anti-predatory-pricing rules and localization demands constrain playbooks
        - id: trust
          label: Customer trust and brand protection
          type: market
          risk: Support failures and spoof domains can blunt repeat usage
      edges:
        - from: hub
          to: apps
          label: distribution
        - from: hub
          to: stores
          label: fulfilment density
        - from: hub
          to: riders
          label: delivery execution
        - from: hub
          to: payments
          label: checkout and refunds
        - from: hub
          to: regs
          label: pricing and labor compliance
        - from: hub
          to: trust
          label: service quality
