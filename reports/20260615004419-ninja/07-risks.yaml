- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Subsidy unwind
    - Repeat-order frequency after promo taper
    - Meaningful cohort frequency drop after discount intensity eases
    - Re-underwrite growth and valuation on a lower normalized demand curve
  - - Unit economics
    - Contribution margin per order
    - Margin remains near breakeven or turns negative outside core metros
    - Pause coverage expansion and demand category-level economics disclosure
  - - Labor compliance
    - Payroll or permit exceptions
    - WPS, Qiwa, or visa disruptions appear in multiple months
    - Escalate HR compliance diligence and discount the reliability of the operating plan
  - - Competition intensity
    - Comparable public-company margin trend
    - KSA listed peer margins keep falling while share gains require higher spend
    - Assume the market is still in a costly share-defense phase
  - - IPO readiness
    - Audit-close and disclosure readiness
    - Advisers or audit processes slip while listing windows narrow
    - Push any public-market thesis out and widen required return thresholds
  - - Expansion repeatability
    - Hub payback and service-level attainment outside Saudi core metros
    - New-market hubs fail to reach target density or service levels in expected time
    - Treat regional growth as optional upside, not base-case demand
  notes: The kill criteria translate abstract risk into triggers an investor can actually monitor between rounds or before an IPO decision.
