- id: monitoring-and-diligence-path
  title: Monitoring indicators, kill criteria, and what still needs direct diligence
  body: 'The right next step is not to reject the thesis, but to tighten the conditions under which it still works. The monitoring framework should focus on indicators that management can actually report and investors can actually compare: cohort retention after subsidy taper, contribution margin by category and city, hub payback outside the three core metros, HR and payroll exception rates under the new labor stack, and whether IPO readiness is improving faster than market windows are narrowing. The unresolved public gaps remain material. There is still no public breakdown of Ninja’s rider mix, merchant concentration, dark-store lease exposure, or category-level profitability. Those are not cosmetic omissions; they are the exact data points that tell an investor whether rapid GMV growth is becoming a durable consumer platform or a more fragile pre-IPO story. Until those disclosures exist, the thesis can work, but only with explicit kill criteria and with less trust in management headlines
    than in operational proof.'
