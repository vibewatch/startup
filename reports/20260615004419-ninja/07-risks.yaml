  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ninja-unit-margins
    missingEvidence: Category-, city-, and cohort-level contribution margin with rider cost, refunds, and marketing allocation.
    whyItMatters: Public GMV and profitability headlines do not show whether the model stays profitable once incentives normalize or density weakens outside prime zones.
    diligencePath: Request a contribution-margin bridge by category and city for the last four quarters, including refund rate, last-mile cost, and marketing allocation.
    relatedQuestionRefs:
    - QR029
    - QR011
    relatedTableRefs:
    - TR002
    - TR001
  - type: private-evidence-only
    severity: material
    topic: ninja-rider-model
    missingEvidence: Exact split between sponsored, outsourced, and gig riders plus compliance KPIs under Qiwa, Mudad, and WPS.
    whyItMatters: Labor-law tightening can move cost and service levels materially, but the public record does not show how exposed Ninja is to those changes.
    diligencePath: Request rider-mix disclosure, heat-incident logs, payroll exception statistics, and monthly compliance dashboards.
    relatedQuestionRefs:
    - QR027
    - QR008
    - QR009
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: merchant-and-supplier-concentration
    missingEvidence: Largest merchants, supplier dependence, lease commitments, and contract concentration for core dark-store infrastructure.
    whyItMatters: Partner concentration or expensive lease commitments can turn a seemingly flexible growth story into a fixed-cost problem if demand slows.
    diligencePath: Request top-merchant exposure, largest supplier contracts, dark-store lease schedule, and cancellation terms by market.
    relatedQuestionRefs:
    - QR028
    - QR024
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: minor
    topic: ipo-readiness
    missingEvidence: Audit readiness plan, KPI definitions, segment reporting policy, and timetable for bank and market-engagement milestones.
    whyItMatters: If the IPO path slips while private economics remain opaque, valuation expectations can reset quickly.
    diligencePath: Request audit and disclosure workplan, bank mandate status, and monthly readiness dashboard for a potential Tadawul process.
