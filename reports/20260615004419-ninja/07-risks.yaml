- id: competitive-and-capital-market-risk
  title: Competitive pressure and capital-markets timing can still overwhelm a strong top-line story
  body: 'Ninja’s current scale is impressive, but the prepared public-company benchmarks show why that is not the end of the analysis. Redseer still describes a concentrated Saudi market where the top three food-delivery players control more than 90% share and leadership has changed repeatedly in adjacent quick retail. Jahez’s filings provide the operating consequence: the company remained profitable, but its KSA delivery-platform margin fell from 15.1% in FY2024 to 11.9% in FY2025 and then to 7.6% in Q1 2026 even while management claimed market-share progress. Jahez’s expanded in-house fleet also shows that scale logistics—not just brand awareness—help determine who can defend economics during promo-heavy periods. Sensor Tower’s weekly actives suggest Ninja still trails some incumbents on user scale. If the public-market window is the next milestone, that matters because investors will eventually ask whether Ninja’s growth comes from a durable operating edge or from participating in a market
    that is still paying too much to retain consumers.'
