summary:
  headline: >-
    Ninja has achieved unusually fast Saudi quick-commerce scale and a credible pre-IPO profile, but incomplete
    disclosure on revenue quality, margins, and governance keeps the current $1.5 billion mark in track-not-buy
    territory.
