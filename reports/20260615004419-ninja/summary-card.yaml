  topStrengths:
    - >-
      Ninja has built real Saudi and GCC quick-commerce scale quickly, supported by a 100-store-plus dense fulfillment
      footprint and a broad multi-vertical app surface.
    - >-
      The company reached unicorn status with strong local investor backing and is already advanced enough to generate
      credible Riyadh IPO coverage.
    - >-
      Public sources consistently frame Ninja as operationally profitable, which is rare in quick commerce and
      strategically differentiating if later audited.
  topRisks:
    - >-
      The public record does not cleanly distinguish GMV from net revenue, making the current valuation highly sensitive
      to one unresolved accounting-definition question.
    - >-
      Quick-commerce economics remain exposed to subsidy normalization, labor-cost inflation, regulatory tightening, and
      service-quality slippage.
    - >-
      Governance visibility, cap-table terms, and audited financial disclosure remain too thin for high-conviction
      underwriting.
  unresolvedGaps:
    - >-
      Audited 2025 and year-to-date 2026 financial statements that separate GMV, net revenue, gross profit, and EBITDA
      are not public.
    - Full cap-table, liquidation preferences, and any structured terms from the 2025 round are undisclosed.
    - Board composition, independent governance, and management-bench depth remain weakly evidenced in public materials.
    - City-level unit economics, customer retention, and category-level profitability are still unavailable.
