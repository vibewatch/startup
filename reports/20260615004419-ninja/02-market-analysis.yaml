tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Core quick-retail baskets
    - Groceries, household staples, pharmacy, beauty, and urgent convenience items fulfilled in under ~30 minutes
    - Weekly bulk hypermarket stock-up or long-tail general e-commerce baskets
    - Household consumer paying directly in-app
    - This is the spend Ninja most directly monetizes today
  - - Restaurant-led convenience
    - Prepared meals and snacks when the same app session competes for fast-delivery attention
    - Dine-in hospitality or scheduled catering
    - Individual consumer or family meal budget
    - Important adjacency because Ninja now blends food and retail in one app
  - - Urgent essentials and top-up shopping
    - Low-ticket replenishment, impulse, and out-of-stock recovery purchases
    - Large scheduled grocery missions
    - Household convenience budget owner
    - Supports higher order frequency than weekly stock-up behavior
  - - Pharmacy and personal care
    - OTC wellness, personal care, baby, and hygiene categories
    - Prescription-heavy regulated pharmacy workflows not supported in public evidence
    - Household consumer or caregiver
    - Higher-margin extension beyond food-only delivery
  - - Status-quo substitutes
    - Trips to neighborhood stores, hypermarkets, and convenience stores
    - Unrelated digital services
    - Same household budget as above
    - These offline options constrain delivery-fee pricing power
  - - Adjacent digital substitutes
    - Food-only apps, marketplace grocery apps, and same-day general retail
    - Enterprise software or B2B procurement budgets
    - Household consumer
    - These adjacencies cap how much of the broader digital-retail market Ninja can realistically win
  notes: The boundary keeps Ninja inside urgent consumer retail and convenience spending rather than treating all grocery, all e-commerce, or all restaurant sales as equally addressable.
