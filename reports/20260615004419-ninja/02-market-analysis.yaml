- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Smartphone and payments penetration
    - Positive
    - Current
    - High smartphone and digital-wallet use reduce friction for low-ticket repeat orders
    - Validate whether checkout speed materially improves repeat frequency for Ninja
  - - Urban density in core metros
    - Positive
    - Current
    - Dense Riyadh/Jeddah/Dammam demand lets platforms batch orders and keep windows short
    - Request city-level order density and dark-store utilization
  - - Logistics and dark-store build-out
    - Positive
    - Current to medium term
    - Infrastructure and dense nodes widen the serviceable footprint for fast delivery
    - Request Ninja dark-store count, city coverage, and replenishment cadence
  - - Quick-retail category expansion
    - Positive
    - Current
    - Groceries and essentials pull consumers back often enough to support broader basket expansion
    - Request category-level GMV and repeat rates
  - - Subsidy normalization
    - Negative
    - Current
    - Demand may stay intact, but price-led growth should normalize and expose weaker operators
    - Model order-frequency sensitivity if discounts taper
  - - Leadership volatility
    - Negative
    - Current
    - Frequent leadership changes imply scale alone may not lock in durable share
    - Request retention and cohort durability relative to peers
  - - Density threshold for economics
    - Negative
    - Current
    - Ultra-fast delivery weakens quickly when density drops below dense-city thresholds
    - Request hub-by-hub payback and order density
  - - Public-data opacity on SAM/SOM
    - Negative
    - Current
    - Without country mix, category mix, and take rate, underwriting precise share capture is premature
    - Request net revenue, country split, and category mix rather than only GMV headlines
  notes: The market is clearly real, but the highest-value diligence now sits in density, retention, and category economics rather than in proving there is demand at all.
