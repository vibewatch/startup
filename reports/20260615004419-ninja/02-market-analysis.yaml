- id: buyer-user-and-payer-map
  title: Buyer, user, and payer segmentation
  body: 'The prepared sources point to a consumer convenience market rather than a B2B one. The primary buyer, user, and payer is the same household consumer who wants a faster alternative to visiting a store. Redseer’s evidence that 10% of users increasingly order at the workplace and 20% order more often because choice expanded implies that frequency is driven by convenience and assortment, not only by one-time discounting. Ninja’s official app surfaces support the same interpretation: the service advertises 24/7 delivery, real-time tracking, broad household assortment, and a single interface for meals, groceries, pharmacy, and personal care. App traction is meaningful enough to matter at category level: Apple shows 1.2 million Saudi ratings at 4.7, AppBrain estimates 7.6 million lifetime Android downloads, and Sensor Tower showed roughly 1.8-2.1 million weekly actives in Q3 2025. That combination suggests the real market is a high-frequency urban household budget, where the product wins
    by being the fastest path from need spike to completed basket.'
  claimRefs:
  - CM028
  - CM034
  - CM035
  - CM036
  - CM037
  - CM006
