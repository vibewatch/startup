evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Official board roster, executive bench, and legal-entity disclosure package.
    whyItMatters: >-
      Without governance detail, key-person dependence and control rights cannot be underwritten from public evidence
      alone.
    diligencePath: Request the current board list, corporate org chart, and shareholder-rights summary from management.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, GMV, order volume, and profitability bridge for 2025-2026.
    whyItMatters: >-
      Publicly cited revenue and profitability claims shape the IPO story but are not enough to validate quality of
      earnings.
    diligencePath: Request audited FY2025 statements and the most recent management accounts used in IPO preparation.
    relatedQuestionRefs:
      - QO011
      - QO012
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Full ownership table, round mechanics, and any secondary component of the 2025 raise.
    whyItMatters: Investor identity is partly public, but ownership concentration and governance rights remain opaque.
    diligencePath: Request the latest cap table, round subscription documents, and board observer / veto-right summary.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Current employee and rider headcount by country and function.
    whyItMatters: Scale claims are strong, but people-capital intensity is still invisible from public sources.
    diligencePath: Request HR dashboard extracts or an organization snapshot used internally for operations planning.
  - type: conflicting-data
    severity: material
    topic: service-quality
    missingEvidence: Hard cohort data on on-time delivery, refunds, and customer-support response times versus app-store marketing.
    whyItMatters: Public reviews show adverse anecdotes that could be isolated incidents or real service-quality drift.
    diligencePath: Request operational SLA dashboards and complaint-resolution metrics by market.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: ninja-country-mix
    missingEvidence: Country-level GMV, order, and contribution data for Saudi Arabia versus Bahrain, Qatar, and Kuwait.
    whyItMatters: >-
      Saudi is the regional center of gravity, but the quality of Ninja’s non-Saudi growth determines how transferable
      the model really is.
    diligencePath: >-
      Request internal dashboard exports or board materials showing GMV, orders, repeat rate, and contribution margin by
      country for the last four quarters.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: ninja-category-mix
    missingEvidence: Breakdown of GMV and net revenue across food delivery, grocery, pharmacy, and other retail verticals.
    whyItMatters: >-
      Without mix data, it is impossible to tell whether Ninja is a durable quick-retail platform or still mostly a
      subsidized food-delivery business with adjacent categories.
    diligencePath: Request management reporting on GMV, take rate, contribution margin, and repeat frequency by category.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: ninja-density-and-som
    missingEvidence: City-level dark-store density, order density, and payback by hub or cohort.
    whyItMatters: >-
      Order-density thresholds decide whether the market supports fast delivery economically beyond the densest metros,
      which directly affects SAM and SOM.
    diligencePath: >-
      Request hub-level coverage maps, weekly orders per square kilometer, and hub payback data for Riyadh, Jeddah,
      Dammam, and first wave regional markets.
    relatedQuestionRefs:
      - QM022
      - QM025
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Comparable public fee cards, effective commissions, and discount-depth data for Ninja, HungerStation, Jahez, and
      Talabat in Saudi Arabia.
    whyItMatters: >-
      Without price and take-rate transparency, a capability map can show breadth but cannot prove pricing power or
      economic superiority.
    diligencePath: >-
      Request current merchant commercial terms and consumer-fee schedules from management and channel checks, then
      normalize by city and basket size.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: >-
      User reorder cohorts, churn, and merchant multi-homing rates by city and category for Ninja and the main
      incumbents.
    whyItMatters: >-
      Leadership can look strong in downloads or weekly actives but still prove fragile if users and merchants switch
      apps as promotions change.
    diligencePath: >-
      Request cohort, frequency, and merchant-retention dashboards alongside anonymized city-level time series for the
      last four quarters.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: unit-economics-proof
    missingEvidence: Dark-store payback, contribution margin by basket band, and city-level CAC or subsidy intensity for Ninja.
    whyItMatters: >-
      Competitive durability depends on whether speed leadership survives after subsidies fade, which cannot be proven
      from public sources alone.
    diligencePath: >-
      Request internal unit-economics cohorts by store vintage and city, then reconcile them against marketing spend and
      order-density assumptions.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Cash balance, monthly burn, and working-capital bridge entering the IPO window.
    whyItMatters: These are the core variables needed to judge whether listing is optional or financing-critical.
    diligencePath: Request latest monthly management accounts plus treasury summary.
