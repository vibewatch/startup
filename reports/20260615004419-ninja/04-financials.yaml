- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: 'Public evidence shows that Ninja raised enough money to accelerate, but not enough detail to prove self-sufficiency. The 2025 round is clear enough: Riyad Capital led a SAR 1 billion / roughly $250 million financing that was explicitly tied to technology, logistics, and expansion. The less-clear question is what portion of that funding actually remained on balance sheet entering 2026, whether any secondary component existed, and what the company''s monthly burn or debt obligations looked like by the time IPO-preparation coverage emerged. March 2026 coverage strongly suggests financing dependency is still live because the listing is described as a tool to fund further Saudi and regional expansion, not as an optional branding exercise after full cash self-sufficiency. The absence of disclosed cash, runway, debt service, or working-capital mechanics is especially important in quick commerce because the category is operationally dense, fulfillment-heavy, and still navigating post-subsidy
    regulation. The financial chapter therefore has to judge capital adequacy as directionally positive but unproven on audited liquidity evidence.'
  claimRefs:
  - CI006
  - CI007
  - CI029
  - CI030
