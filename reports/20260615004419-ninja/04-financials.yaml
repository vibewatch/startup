- id: benchmarked-unit-economics
  title: Benchmarked unit economics under competition
  body: 'Because Ninja does not publish unit economics, the best public frame comes from Saudi-market peers and sector research. Jahez is the most useful listed comparator because its filings show exactly how competition is affecting a Saudi delivery platform in real time: FY2025 commission revenue grew while delivery-fee revenue fell, KSA margins stayed positive, and management explicitly said it increased marketing and promotional spend to defend share. Q1 2026 then sharpened the point—group revenue kept growing, but profitability was squeezed by retention spending and competitive pricing pressure. Redseer adds the structural interpretation: 2025 growth exceeded expectations, yet much of that growth was subsidy-led and margin-compressing, and regulators are now moving to discipline those tactics. Introchek''s scenario work helps translate the narrative into order-level intuition, showing how a typical basket can leave only slim contribution after courier, packaging, and hub costs. Together,
    these sources imply that Ninja may be operationally strong, but it still operates in a category where execution discipline, route density, and fee mix matter far more than topline growth alone.'
  claimRefs:
