company:
  name: Ninja
chapter:
  number: 4
  title: Financials
  summary: Ninja's public financial profile is strong on narrative and weak on audited detail. Official surfaces prove a broad multi-vertical demand engine, while March 2026 IPO coverage cites roughly $1 billion of 2025 revenue and a $1.6 billion 2026 target after a 2025 Riyad Capital-led $250 million round at a $1.5 billion valuation. The clearest public economics come from sector research and Jahez filings, which show that Saudi delivery profitability depends on disciplined commission mix, logistics density, and restraint on promotions as regulators move to curb subsidy-led competition. Because Ninja still discloses no cash, burn, take-rate, refund-leakage, or GMV-to-net-revenue bridge, capital adequacy and revenue quality remain only partially underwritten from public evidence.
sections:
- id: revenue-model-and-traction
  title: Revenue model and public traction
  body: 'Ninja''s public revenue model is easy to describe and hard to underwrite. Official surfaces clearly position the product as a multi-vertical transaction marketplace: food delivery, groceries, pharmacy, shopping, and home-services demand are all aggregated into one app, with 5,000-plus restaurants and 15,000-plus products marketed to the Saudi user base. That breadth matters because it implies more than one basket type and more than one gross-margin profile. What is missing is any direct disclosure of take rate, merchant commission, delivery-fee schedule, subscription economics, or realized margin by vertical. The public traction story is therefore being carried by media-level pre-IPO numbers rather than audited statements: March 2026 coverage repeatedly cites about $1 billion of 2025 revenue and a $1.6 billion target for 2026, but those figures are not accompanied by a financial statement, revenue-recognition policy, or GMV-to-net-revenue bridge. This is enough to establish that
    Ninja has scale and listing ambition, but not enough to score revenue quality as if the business were already public.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI028
  - CI036
  - CI037
  - CI040
  - CI043
