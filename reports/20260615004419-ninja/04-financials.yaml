  - - Round mechanics and any secondary component
    - Determines how much of the 2025 round actually strengthened the balance sheet
    - Request financing closing memo and cap-table movement summary
  notes: Each row names a precise public blind spot that blocks a high-confidence underwriting view of Ninja's financial profile.
