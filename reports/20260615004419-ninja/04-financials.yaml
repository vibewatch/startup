callouts:
- calloutType: risk
  title: Public evidence is one layer short of underwrite-ready
  body: Ninja's scale story is plausible, but public evidence still lacks the cash, burn, take-rate, refund-cost, and revenue-recognition detail required for a high-confidence investment case. The financial chapter should therefore be treated as a pressure test of the narrative, not a substitute for a data room.
  claimRefs:
  - CI029
  - CI030
  - CI043
  - CI044
- calloutType: insight
  title: The strongest public evidence comes from peers, not from Ninja itself
  body: 'Jahez filings provide the clearest look at how Saudi delivery economics behave under pressure: commission mix matters, sponsored fleets matter, and promotional spend can erase profits quickly. Those lessons are highly relevant to Ninja, but they remain analogues until Ninja discloses its own metrics.'
  claimRefs:
  - CI009
  - CI010
  - CI012
  - CI015
  - CI042
- calloutType: recommendation
  title: Demand a GMV-to-net-revenue bridge before trusting the $1.6B target
  body: Public market-size sources are GMV-based, while Ninja's IPO coverage uses the language of revenue. Without a bridge explaining what is gross, what is net, and what geographies are included, the topline story can be misunderstood by both private and public investors.
  claimRefs:
  - CI004
  - CI039
  - CI040
