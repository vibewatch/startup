- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Cash balance and unrestricted liquidity
    - Without it, runway cannot be estimated credibly
    - Request latest balance sheet or IPO working-capital deck
  - - Monthly burn and cash conversion
    - Separates operational profitability marketing from true cash sustainability
    - Request monthly cash-flow bridge for the last 12 months
  - - GMV-to-net-revenue bridge
    - Needed to reconcile market-size, app-scale, and public revenue claims
    - Request revenue-recognition memo plus monthly GMV / net revenue schedule
  - - Take rate / delivery-fee / ad revenue mix
    - Needed to understand whether growth is healthy or subsidy-dependent
    - Request merchant monetization waterfall by vertical and country
  - - Refund, cancellation, and missing-item cost leakage
    - Customer complaints may imply a hidden hit to gross margin and trust
