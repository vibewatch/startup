  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: revenue-definition
    missingEvidence: A management-verified reconciliation showing whether the reported 2025 billion-dollar top line was GMV, net revenue, or another revenue-like metric.
    whyItMatters: The single biggest valuation variable is whether the current private mark implies ~1.5x real revenue or a much higher multiple on a thinner take-rate base.
    diligencePath: Obtain audited statements or a board-approved metric glossary that bridges GMV, gross revenue, net revenue, and contribution profit for 2025 and YTD 2026.
    relatedQuestionRefs:
    - QV002
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Current cap table, liquidation preferences, anti-dilution rights, option pool, and any structured terms embedded in the 2025 financing.
    whyItMatters: Headline valuation can diverge sharply from outside-investor economics when liquidation preferences or structured protections are material.
    diligencePath: Request financing documents, updated cap-table schedules, and counsel summary before underwriting any late-stage or IPO participation decision.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: audited-unit-economics
    missingEvidence: Audited 2025 and YTD 2026 financial statements plus city- or cohort-level dark-store unit economics.
    whyItMatters: Without audited disclosure and mature-cohort economics, investors cannot distinguish a locally solved model from a subsidy-supported growth story.
    diligencePath: Request audited statements, store-vintage contribution curves, and sensitivity analysis for subsidies, basket size, and labor costs.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: moderate
    topic: public-comparable-coverage
    missingEvidence: TV004 only covers public comps and press-disclosed regional benchmarks; it does not include private GCC quick-commerce trading data or late-stage secondary marks that would tighten the valuation range.
    whyItMatters: Without closer private-market analogs, the comparable table can anchor the valuation discussion but cannot precisely calibrate the discount or premium that Ninja should trade at versus public comps.
    diligencePath: Request recent private-market marks, secondary transactions, and underwriter comp books for GCC delivery and quick-commerce issuers before finalizing the IPO valuation framework.
    relatedQuestionRefs:
    - QV006
    - QV009
    - QV011
    relatedTableRefs:
    - TV004
