- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Element
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Scale narrative
    - Ninja reached unicorn status in ~3 years and built a 100+ dark-store, 28-city footprint.
    - Hyper-growth headlines can still mask weak disclosure quality and aggressive metric presentation.
    - Show audited 2025 and YTD 2026 statements with clear segment bridges.
  - - Category breadth
    - The app already spans groceries, restaurants, pharmacy, and everyday essentials across four GCC markets.
    - Breadth alone does not prove durable contribution margins or efficient cross-category demand.
    - Disclose margin and repeat behavior by category and city.
  - - IPO readiness
    - Banks are reportedly being lined up and Riyadh remains the likely venue.
    - Timing has repeatedly been framed as market-window dependent, which is exactly when private marks get challenged.
    - Lock advisory-bank lineup, timetable, and primary-use-of-proceeds detail.
  - - Local comparable support
    - Jahez proves Saudi food and quick-retail platforms can be large and public.
    - Jahez still trades near 1.0x EV/revenue despite profitability, which limits how much premium Ninja can command without cleaner proof.
    - Confirm that the headline $1B figure is net revenue and that margins are durable.
  - - Sector economics
    - Saudi and GCC q-commerce still have real runway and ecosystem scale can matter.
    - Independent adverse sources still describe subsidy-led growth and razor-thin per-order economics.
    - Show that Ninja’s mature cohorts sustain positive contribution without heavy discounting.
  - - Capital-markets ambition
    - $1B IPO talk suggests genuine banking interest and a large potential float.
    - Banker interest does not guarantee that public investors will honor the last private mark unchanged.
    - Produce pre-IPO demand testing with valuation discipline, not just a headline fundraising goal.
  notes: 'The thesis is price-sensitive: Ninja can be a high-quality company and still a stretched investment if the metric base remains ambiguous.'
