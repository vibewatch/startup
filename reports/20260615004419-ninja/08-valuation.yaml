- id: final-recommendation-and-diligence-gates
  title: Final recommendation and diligence gates
  body: 'That leads to a track recommendation with medium confidence, high risk, and a stretched valuation stance. Ninja is clearly worth following: the company has real operating momentum, credible regional ambition, and enough local-market density to justify IPO preparation. What it does not yet have, at least in the public record, is the disclosure quality that should let outside investors pay the current private mark with conviction. The most important diligence requests are straightforward and unforgiving: audited 2025 and year-to-date 2026 financial statements that explicitly split GMV from net revenue, dark-store contribution margins by city or cohort, and a full cap-table and preference-stack view before any IPO or late-stage round is underwritten. Investors should also monitor thesis-break triggers such as a missed 2026 target, confirmation that the billion-dollar figure was mostly GMV, or an IPO delay beyond 2027 because the banking process or market window cools. Until those gates
    clear, the mark should be watched closely, not embraced blindly.'
