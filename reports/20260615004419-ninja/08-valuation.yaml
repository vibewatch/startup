tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why
  - What would change the view
  rows:
  - - Recommendation
    - track
    - The company is strategically compelling but the public evidence base is too ambiguous to underwrite the current private mark aggressively.
    - Upgrade only after audited 2025/2026 statements reconcile GMV, net revenue, and profitability.
  - - Confidence
    - medium
    - Comparable and market-structure evidence is usable, but company-specific disclosure is incomplete.
    - Confidence rises after audited financials, cap-table clarity, and city-level unit-economics disclosure.
  - - Risk rating
    - high
    - Valuation depends on revenue-quality interpretation, operating-discipline durability, and an open IPO window.
    - Risk falls if the business proves clean net revenue and resilient margins without subsidy-led growth.
  - - Valuation stance
    - stretched
    - The $1.5B mark is defendable only under the favorable interpretation of growth and revenue quality.
    - It moves toward fair if reported top line is confirmed as net revenue and 2026 execution lands near target.
  - - Decision implication
    - Do not treat the last round as self-validating
    - The mark is plausible but still evidence-sensitive.
    - Price discipline improves after disclosure closes the GMV-versus-revenue gap.
  notes: Assessment reflects public evidence available by 2026-06-15; private-company financial statements and preference terms remain unavailable in the retained cache.
