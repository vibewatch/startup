slug: ninja
runDate: '2026-06-15'
company:
  name: Ninja
chapter:
  number: 8
  title: Valuation
  summary: 'Ninja’s latest private mark is strategically understandable: the company reached unicorn status only three years after founding, has built a 100-plus dark-store network across Saudi Arabia, and is already being discussed as a billion-dollar Riyadh IPO candidate. But the current public record still fails the core underwriting test because the headline “$1 billion revenue in 2025” appears to be ambiguously reported and may refer to GMV rather than audited net revenue. Using Jahez as the cleanest local public anchor and applying explicit scenario logic, the current $1.5 billion mark looks plausible only in a favorable interpretation of revenue quality and margin durability. Recommendation: track. Confidence: medium. Risk rating: high. Valuation stance: stretched.'
sections:
- id: financing-context-and-what-makes-the-mark-plausible
  title: Financing context and what makes the mark strategically plausible
  body: 'Ninja’s 2025 financing round cannot be dismissed as pure narrative inflation. Multiple local and regional sources converge on the same basic facts: the company raised roughly $250 million to $254 million at a $1.5 billion valuation, Riyad Capital led the round, and the business reached that mark only about three years after founding. The operating story behind that valuation is also not imaginary. Official and reported descriptions place Ninja across Saudi Arabia, Bahrain, Qatar, and Kuwait, serving groceries, household goods, pharmacy, and restaurants from a dark-store-heavy fulfillment network that independent reporting sizes at more than one hundred sites across twenty-eight cities. That is enough scale to justify serious IPO preparation. But the underwriting problem begins immediately after the headline: public sources celebrate profitability and billion-dollar “revenue,” yet they do not provide audited statements, a clear bridge from GMV to net revenue, or visibility into cap-table
    terms. So the strategic case is real, while the financial evidence remains incomplete.'
