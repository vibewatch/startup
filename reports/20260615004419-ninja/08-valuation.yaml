- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Revenue-quality anchor
  - Indicative multiple
  - Implied valuation range
  - What must be true
  - Probability signal
  rows:
  - - Bull
    - 2026 net revenue near the reported $1.6B target
    - 1.2x-1.5x sales
    - $1.9B-$2.4B
    - The 2025 billion-dollar figure is confirmed as real revenue, profitability holds, and the IPO window stays open.
    - 20%-25%
  - - Base
    - Growth continues but disclosure still anchors closer to Jahez-like public discipline
    - 0.9x-1.2x sales
    - $1.1B-$1.7B
    - Scale holds, but investors still require proof on GMV vs. revenue and margins before awarding a premium.
    - 45%-50%
  - - Bear
    - The 2025 top line proves mostly GMV or the IPO slips materially
    - 0.6x-0.9x sales-equivalent
    - $0.6B-$1.0B
    - Revenue-quality ambiguity persists, subsidy normalization bites, or market conditions force a discount.
    - 25%-35%
  notes: Ranges are evidence-constrained scenario bands, not management forecasts; they intentionally reflect the unresolved GMV-versus-net-revenue question.
