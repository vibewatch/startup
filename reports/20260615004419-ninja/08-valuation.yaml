- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric anchor
  - Value / multiple signal
  - Relevance
  - Key limitation
  rows:
  - - Ninja reference
    - 2025 round at ~$1.5B; reported 2025 top line around $1B; 2026 target $1.6B
    - Headline mark implies ~1.5x sales only if the 2025 figure is true revenue
    - Subject-company private valuation anchor
    - Public sources may be mixing GMV and revenue, so the multiple is not clean
  - - Jahez
    - TTM revenue about SAR2.52B; FY2025 net profit SAR73M; Q1 2026 still large but more promotional
    - Market cap ~SAR2.76B; EV ~SAR2.81B; ~1.0x EV/revenue
    - Most relevant listed Saudi food and q-commerce benchmark
    - Public market may underpay even profitable growth when competition is intense
  - - DoorDash
    - Global local-commerce platform in 30+ countries
    - Market cap about $65.61B in June 2026
    - Useful scale and public-market benchmark for category maturity
    - Too global and too diversified to be a clean Saudi pricing anchor
  - - Delivery Hero / Talabat context
    - Regional food and quick-commerce ecosystem with public reporting cadence
    - Delivery Hero market cap about $13.23B; Talabat IR and annual-report cadence visible
    - Shows that regional listed assets exist and investors can price ecosystem breadth
    - Local cached evidence does not expose a clean standalone Talabat multiple
  notes: 'Comparable set is partial by design: it prioritizes the cleanest local public anchor plus scale context where numeric multiples in the retained evidence are thin.'
  enumerationScope:
    coverage: partial
    basis: Comparable set covers the subject-company private mark, the clearest Saudi listed peer, and two large public-category benchmarks whose pricing data is visible in the retained cache as of June 2026.
