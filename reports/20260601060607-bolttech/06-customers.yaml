- id: durability-expansion-and-concentration-risks
  title: Durability, expansion, and concentration risks
  body: 'The public customer story is strongest on expansion surface area and weakest on renewal economics. The land-and-expand logic is clear: a partner can start with one insurance line or device-protection program, then add more products, more channels, more brands, or more post-sale services. Erajaya, Globe, and MasOrange each show versions of that pattern. Sumitomo’s strategic rationale and the Series C coverage add another signal: bolttech is still investing to expand device-lifecycle, partner, and market coverage rather than publicly reporting a mature steady-state book. But the same sources leave major holes. There is no disclosed NRR, GRR, churn, contract-length, or top-customer revenue exposure. Logo breadth therefore should not be confused with durable economics. Public customer proof is also not fully independent; much of it is case-study or launch-announcement evidence authored by bolttech or partners. Finally, Cybernews’ unresolved ransomware allegation introduces a trust risk
    that could matter in future partner diligence even if later disproven. The chapter conclusion is therefore favorable on adoption and referenceability, but still conditional on direct diligence for renewals, customer concentration, and partner dependence. The local-agency surface in Singapore and the telco whitepaper summary add one more nuance: bolttech is not just winning one type of customer. It is packaging the same partner-first playbook for agencies, banks, fintechs, and telcos, while depending on those partners to keep the customer relationship warm after launch. That creates expansion optionality, but it also means diligence should test how many accounts actually deepen into multiyear relationships versus staying as launch logos or pilot-scale references.'
