- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or risk
  - Observed evidence
  - Impact
  - Diligence path
  rows:
  - - Land-and-expand through more products
    - Erajaya, Globe, and MasOrange each broadened from initial propositions into more channels or services
    - Supports durable account expansion if execution holds
    - Request product-by-product attach and cross-sell rates by account.
  - - New vertical expansion
    - BYD, Harmony Auto, SB Finance, Sony, and MediaMarkt add EV, lending, OEM aftersales, and rental contexts
    - Broadens TAM and referenceability
    - Request win-rate and payback by new vertical.
  - - Partner-mediated payer concentration
    - Public evidence names many logos but does not reveal revenue by partner or segment
    - Economic concentration could be much higher than logo breadth suggests
    - Request top-10 partner revenue and premiums concentration.
  - - Insurer and regulatory dependence
    - Many launches depend on existing insurer relationships and licensing infrastructure
    - Can slow replication by country and segment
    - Request launch timelines, failed launches, and carrier-onboarding bottlenecks.
  - - Geographic skew
    - Public named proof is heavier in Asia and Europe than North America
    - May create uneven market exposure
    - Request live-program count and GWP by region.
  - - Trust and security risk
    - Cybernews reported an unresolved ransomware allegation tied to customer and policy data
    - Could raise procurement friction or renewal hesitation
    - Request incident findings, partner notifications, and remediation steps.
  notes: The table separates expansion vectors from concentration and trust risks so the chapter does not mistake visible logo breadth for proven durability.
