tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Representative evidence
  - Strategic value
  - Gap
  rows:
  - - Telco subscriber protection
    - Buyer is telco; users are subscribers; payer may be telco or end customer
    - Taiwan Mobile, MasOrange, Italian MNO, Globe, ACG-member carriers
    - Large installed-base channels and strong lifecycle attach points
    - No public segment-level churn or attach-rate disclosure.
  - - Fintech and e-wallet insurance journeys
    - Buyer is fintech or wallet operator; users are app customers; payer is business owner or end customer
    - JKOPay, MoneyHero
    - Shows insurance can be embedded inside fast digital-finance flows
    - No public repeat-purchase or cohort data.
  - - Retail and electronics lifecycle
    - Buyer is retailer; users are device buyers; payer is retailer or shopper
    - Erajaya, MediaMarkt
    - Supports repair, upgrades, leasing-style offers, and recurring service models
    - Public revenue share and renewal mix are undisclosed.
  - - Mobility and OEM-linked channels
    - Buyer is OEM, dealer, or dealer group; user is driver or vehicle buyer
    - BYD, Harmony Auto, Sony aftersales as adjacent OEM-style proof
    - Extends bolttech into higher-ticket assets and EV-specific protection
    - Most evidence is launch-stage rather than long-run retention evidence.
  - - Insurance intermediaries and carriers
    - Buyer is insurer, broker, or carrier consortium; users are agents or subscribers
    - Leading insurer, personal-lines broker, ACG
    - Shows fit for more traditional insurance and telecom intermediaries
    - No disclosed contract length or margin by intermediary type.
  - - Lending-linked protection
    - Buyer is lender; user is borrower; payer can be embedded in loan economics
    - SB Finance
    - Creates differentiated distribution inside credit origination
    - Program economics and loss experience are undisclosed.
  - - Partner-mediated ecosystem scale
    - Buyer is a distribution partner, not a direct end user
    - TechCrunch and Sumitomo scale references
    - Explains why bolttech can touch many sectors without owning end-customer brand
    - Economic concentration across partners remains opaque.
  notes: This segmentation table is organized by buyer-user-payer structure and distribution route because the public evidence shows bolttech winning through partner-owned surfaces rather than a uniform direct-sales motion.
