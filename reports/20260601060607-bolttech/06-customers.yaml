  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof coverage
    missingEvidence: A fuller ranked list of active partners or top customer programs by premiums, volume, geography, or strategic importance.
    whyItMatters: The public named-program list is directionally helpful but does not prove how concentrated bolttech’s economics are or whether the strongest logos are representative.
    diligencePath: Request the current top-20 live programs by volume, premiums, and renewal status, then reconcile them against the public logos and case studies.
    relatedQuestionRefs:
    - QU001
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention and churn metrics
    missingEvidence: NRR, GRR, churn, repeat-purchase, and program-renewal metrics by major channel or customer cohort.
    whyItMatters: Launch and conversion proofs do not answer whether bolttech retains partners and end-customer activity over time.
    diligencePath: Ask management for cohort retention, cancellation, and re-enrollment metrics for the largest telco, retail, and finance programs.
    relatedQuestionRefs:
    - QU023
  - type: private-evidence-only
    severity: material
    topic: concentration by partner and geography
    missingEvidence: Revenue, premiums, or throughput concentration for the top partners and regions.
    whyItMatters: Logo breadth can mask economic concentration in a small number of channel partners or geographies.
    diligencePath: Request top-10 partner exposure, top-5 country exposure, and any at-risk contracts or renewal concentrations.
    relatedQuestionRefs:
    - QU024
    - QU030
  - type: missing-source
    severity: minor
    topic: contract terms and renewal mechanics
    missingEvidence: Publicly verifiable contract-length, renewal, or term-structure details for major partner programs.
    whyItMatters: Without contract structure, it is hard to judge whether current logos are sticky or easily replaceable.
    diligencePath: Ask for standard commercial term ranges, termination rights, and renewal patterns across telco, retailer, and insurer channels.
    relatedQuestionRefs:
    - QU029
  - type: conflicting-data
    severity: minor
    topic: incident follow-up and trust response
    missingEvidence: A company statement or partner disclosure explaining whether the Cybernews-reported event was confirmed, remediated, or refuted.
    whyItMatters: Trust incidents can affect customer renewals and procurement even when commercial adoption remains strong.
    diligencePath: Request incident chronology, affected systems, partner communications, and whether any customer contracts were impacted.
    relatedQuestionRefs:
    - QU026
