chapter:
  number: 6
  title: Customers
  summary: 'bolttech’s public customer evidence is strongest where named distributors or brands tie the platform to a live workflow with a measurable outcome: Taiwan Mobile, JKOPay, MoneyHero, Erajaya, MasOrange, the Italian MNO, insurer and broker case studies, plus newer launches with BYD, Harmony Auto, Globe, Sony, MediaMarkt, ACG, and SB Finance. The adoption story is credible across telco, device, finance, retail, and mobility channels, but retention, contract durability, and concentration still remain weakly disclosed because most proofs are launch or case-study oriented rather than renewal oriented.'
sections:
- id: segment-map-and-adoption-surfaces
  title: Segment map and adoption surfaces
  body: 'bolttech’s customer base is best understood as a partner-mediated B2B2C ecosystem, not a conventional direct enterprise SaaS list. The buyer is usually a distribution partner—a telco, retailer, aggregator, broker, lender, insurer, or OEM-linked channel owner—that wants to add insurance or lifecycle protection inside its own user experience. The actual end user is a subscriber, shopper, driver, borrower, or policyholder, and the payer can be a channel owner, a budget owner inside the partner, or an end customer selecting protection during purchase or servicing. That structure is visible repeatedly in the retained sources: Taiwan Mobile and Globe use telco channels, JKOPay and MoneyHero use fintech and comparison flows, Erajaya and MediaMarkt use device-retail contexts, SB Finance brings lending-linked protection, and Sony proves aftersales OEM coverage. This breadth is strategically positive because it reduces dependence on one single ICP. The trade-off is that public evidence says
    much less about the economics of each segment than it does about the variety of channels bolttech can support. It also matters that bolttech can operate through more than one commercial form factor, from agency-style local operations to pure platform enablement, because that flexibility can help win partners that need both regulated execution and product design support.'
