- id: named-production-proof-and-outcomes
  title: Named production proof and outcome quality
  body: 'The proof base is strongest when bolttech’s role is attached to a live customer workflow and a disclosed operating outcome. Taiwan Mobile and JKOPay show fast launches and strong conversion behavior inside app-native or wallet-native environments. MoneyHero shows a regulated comparison-to-issuance flow for digital car insurance. Erajaya demonstrates unusually durable retail embedment: more than a decade of partnership, app integration, and expansion into upgrades, cyber protection, and leasing-like propositions. MasOrange and the Italian MNO show that telco distribution can evolve from a one-off launch into a broader digital and lifecycle channel, while insurer and broker case studies show bolttech’s platform also works for more traditional insurance-distribution intermediaries. Newer proofs with BYD, Harmony Auto, Sony, MediaMarkt, Globe, ACG, and SB Finance add momentum in mobility, aftersales, retail rental, regional-carrier, and lending contexts. The important diligence nuance
    is that many of these proofs are production and launch validations, not necessarily proofs of multiyear retention or high-margin economic durability.'
