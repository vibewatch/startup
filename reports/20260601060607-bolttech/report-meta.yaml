companyProfile:
  summary: >-
    Bolttech is a 2020-founded Singapore-headquartered insurtech that operates a B2B2C
    orchestration platform connecting insurers, distributors, and end customers at the point
    of need. Its product set spans device protection, travel, home, health-tech, cyber,
    mobility, and related embedded-protection workflows, and the company says it now spans
    39 markets, 700+ distribution partners, 250+ insurers, and more than US$85 billion of
    quoted premiums annually. In June 2025, Bolttech closed its Series C at US$147 million
    and a US$2.1 billion valuation.
  founders:
    - name: Rob Schimek
      role: Founder and Group CEO
      background: >-
        Former AIG executive who previously led commercial insurance businesses worldwide
        and earlier spent 18 years at Deloitte & Touche serving global financial institutions.
      claimRefs:
        - CO010
        - CO011
        - CO012
  foundingLocation: Singapore
  headquarters: Singapore
  productSummary: >-
    Bolttech sells a modular embedded-insurance and servicing stack with API-led quoting,
    binding, lifecycle management, claims, repair, and partner integrations across device,
    travel, home, health-tech, cyber, mobility, and multi-gadget protection use cases.
  customerFocus: >-
    Insurers plus non-insurance distributors such as telcos, retailers, OEMs, lenders,
    financial-services platforms, and mobility channels that want to sell protection inside
    existing customer journeys.
  businessModel: >-
    The public record implies Bolttech monetizes a mix of distribution or orchestration fees,
    servicing revenue, and lifecycle-program economics rather than a pure risk-bearing carrier
    model, but exact take rates and margin structure are not publicly disclosed.
  stage: Series C private company
