chapter:
  number: 3
  title: Competitors
  summary: 'bolttech’s closest like-for-like rivals are Cover Genius and Qover, while Chubb Studio and Assurant bring heavier incumbent scale and Lemonade or Root act as adjacent substitutes. The clearest public wedge is device-lifecycle execution—claims, repair, upgrade, and partner workflow depth—rather than uniquely visible pricing power or underwriting IP. That means the moat is credible but only partially proven: switching costs rise inside partner operations, yet AI-enabled incumbents, licence-rich peers, and thin public economics keep commoditisation risk high.'
sections:
- id: landscape-and-player-classes
  title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
  body: 'The competitive set is not one clean peer group. The nearest like-for-like challengers are Cover Genius and Qover because both sell API-led embedded distribution to partners rather than only underwriting their own branded book. Chubb Studio and Assurant matter for a different reason: they bring incumbent balance-sheet credibility, channel relationships, and operational scale that can compress bolttech’s pitch even when their starting point is carrier or service infrastructure rather than neutral exchange software. Lemonade and Root are adjacent substitutes, not perfect peers, because they own more of the carrier economics and consumer brand yet still compete anywhere a buyer could choose a direct digital insurer or an insurer with partner APIs instead of a multi-insurer orchestration layer. Public market reports reinforce that these classes are colliding inside a fast-growing category where API-first distribution and local regulatory execution decide whether partnerships launch
    at all.'
