  rows:
  - - bolttech
    - Direct platform
    - Private; scale signalled by retail, telco, finance, and mobility programmes plus device-lifecycle operations
    - Telcos, device OEM and retail, finance, mobility, insurers and brokers
    - Exchange-style orchestration plus claims, repair, upgrade, and servicing depth
    - Public partner economics and formal assurance artefacts remain thin
  - - Cover Genius
    - Direct platform peer
    - Licensed or authorised in 60+ countries and all 50 U.S. states
    - Travel, e-commerce, fintech, logistics, mobility, gig platforms
    - Global XCover API with conversion-optimised bundling
    - Public evidence is strong on reach, thinner on physical after-sales operations
  - - Qover
    - Direct platform peer
    - Licensed in 32 European countries and FCA-authorised in the UK
    - European banks, fintechs, mobility, and other regulated partners
    - Platform-as-a-service orchestration across product, country, and insurer
    - Europe-centric footprint relative to bolttech or Cover Genius
  - - Chubb Studio
    - Incumbent embedded platform
    - Chubb operates in 54 countries and territories with about 43,000 employees
    - Digital distribution partners wanting carrier-backed embedded cover
    - Carrier balance sheet, API and SDK distribution, AI optimisation engine
    - Less evidence of neutral multi-carrier exchange positioning
  - - Assurant
    - Incumbent service and protection operator
    - Public company with $12.81B TTM revenue and 325M consumers protected
    - Device OEMs, carriers, retailers, auto, home, and other B2B2C programmes
    - Device-care, repair, and service scale with embedded client workflows
    - Heavier services model may be less flexible for pure open-orchestration use cases
  - - Lemonade
    - Adjacent substitute
    - 3.14M customers, $0.84B TTM revenue, $4.45B market cap
    - Direct-to-consumer property, auto, pet, and life buyers
    - AI-native consumer insurer with visible public growth markers
    - Not a neutral multi-insurer orchestration layer for third-party brands
  - - Root
    - Adjacent substitute
    - $1.56B TTM revenue, 1,256 employees, $823.92M market cap
    - Auto insurance and vehicle-purchase ecosystems
    - Direct digital carrier with APIs and vehicle-purchase touchpoints
    - Line concentration and owned-book model make it narrower than bolttech’s multi-vertical pitch
  notes: Scale/funding reflects only retained public evidence. Where partner-program economics are private, the table uses the clearest available scale markers instead of guessing revenue-share terms.
