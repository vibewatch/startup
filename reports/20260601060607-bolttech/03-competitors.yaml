- id: TP003
  title: Pricing / packaging comparison
  columns:
  - provider
  - price/unit/contract model
  - included capabilities
  - discount or unknowns
  - implication
  rows:
  - - bolttech
    - Custom partner programme; no public list pricing
    - Quote, verification, contract lifecycle, claims, repair, engagement, servicing
    - Realised take rates, attach rates, and margin split undisclosed
    - Commercial flexibility may be high, but public benchmarking is weak
  - - Cover Genius
    - Dynamic bundled-policy pricing plus enterprise integration; no public fee card
    - XCover API, policy bundling, global licensing reach, partner conversion tooling
    - Enterprise economics not disclosed
    - Competes strongly where partner wants broad geography and fast launch
  - - Qover
    - Partner-specific platform-as-a-service economics; no public fee card
    - Product, country, and insurer orchestration across Europe
    - Public evidence does not show realised pricing or programme margin
    - European regulated partners may care more about compliance fit than headline price
  - - Chubb Studio
    - Negotiated carrier programme with managed, partner-managed, or hybrid deployment
    - Embedded distribution, AI optimisation, APIs, SDKs, and click-to-engage support
    - No public programme pricing
    - Chubb can bundle carrier capacity and technology, limiting apples-to-apples comparison
  - - Assurant
    - Programme-based device-care or protection economics; no public list pricing
    - Protection, warranty, claims, repair, automation, and service centres
    - No retained public pricing breakdown between coverage and service operations
    - Assurant can win with operational scope even when software fees are opaque
  - - Lemonade / Root
    - Consumer insurance premiums and carrier economics rather than neutral platform fees
    - Owned insurance products plus digital purchase flows
    - Partner-channel economics not comparable to B2B orchestration vendors
    - Useful substitute for some channels, but not a clean benchmark for bolttech’s enterprise pricing
  notes: The retained public sources mostly market outcomes and partner fit, not fee schedules. This table therefore compares packaging logic and pricing visibility rather than fabricating contract economics.
