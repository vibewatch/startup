- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation/diligence ask
  rows:
  - - API-led orchestration is differentiated
    - Cover Genius, Qover, and Chubb all market API-centric embedded distribution
    - High
    - Request partner win-loss data and time-to-launch versus named peers
  - - Device-lifecycle depth creates sticky programmes
    - Assurant has larger device-care and repair scale in mature channels
    - High
    - Request repair SLA, renewal, and gross-margin proof by device programme
  - - Local trust and compliance execution supports launches
    - Peers foreground licence breadth and financial strength; Cybernews raises security diligence pressure on bolttech
    - High
    - Request entity-by-market licence map, assurance reports, and incident-response evidence
  - - AI and conversion tooling can sustain attach-rate gains
    - Chubb has already launched AI optimisation and peers also push conversion-led positioning
    - Medium-High
    - Request measured conversion uplift and which tooling is proprietary versus configurable
  - - Partner integration raises switching costs
    - Multi-homing remains plausible because orchestration layers are designed to connect multiple insurers and products
    - Medium
    - Request churn history, migration cost data, and exclusive-term evidence
  - - Fast market growth expands the canvas
    - Rapid category growth invites more entrants and compresses surface-level differentiation
    - High
    - Request vertical-by-vertical share data and why bolttech wins beyond category momentum
  notes: Severity is an analytical judgement from retained evidence, not a company-reported score. Each row names the exact diligence artefact needed to turn narrative moat claims into provable underwriting evidence.
