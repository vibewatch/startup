- id: switching-costs-moat-and-commoditization-risk
  title: Switching costs, moat durability, and commoditization risk
  body: The moat is real, but narrower than the broad market narrative suggests. bolttech can point to meaningful switching costs where protection is tied into claims handling, repair operations, upgrade programmes, dealer or telco billing journeys, and partner-specific workflow integration. Those are harder to displace than a standalone quote widget. But the same evidence also shows why commoditization risk is high. Qover and Cover Genius both market orchestration, Chubb now markets AI-based offer optimisation, and Assurant already operates at scale in device care. Multi-homing also looks plausible because the orchestration layers themselves are designed to connect insurers rather than to enforce exclusive carrier ownership. Internal build remains a fallback, although the retained evidence suggests it is slower and less connected than using a specialised platform. That makes the most dangerous outcome a crowded procurement market where several credible vendors satisfy enough of the brief to push down margins, stretch sales cycles, and weaken renewal leverage over longer time horizons. The unresolved public-data gap is whether bolttech wins enough partner economics, retention, and attach-rate performance to convert operational breadth into durable pricing power.
