  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The investment call turns on whether strong strategic and market evidence can survive the missing-economics and
      cyber tests.
    data:
      nodes:
        - id: A
          label: Fresh $2.1B round
          detail: Real capital was raised at a premium private mark.
          tone: positive
        - id: B
          label: Scale and partner proof
          detail: 700+ partners, 39 markets, and live channel launches support relevance.
          tone: positive
        - id: C
          label: Comp band is mixed
          detail: Public read-throughs range from Root-like to Lemonade-like multiples.
          tone: neutral
        - id: D
          label: Economics disclosure test
          detail: Audited revenue, margin, retention, and concentration are still missing publicly.
          tone: risk
        - id: E
          label: Cyber / compliance test
          detail: Cyber allegation and permissions work can still reset confidence.
          tone: risk
        - id: F
          label: research-more / stretched
          detail: Current public record is not enough for a clean buy at the last round.
          tone: risk
      edges:
        - from: A
          to: B
          label: confirms external demand
        - from: B
          to: C
          label: supports upside
        - from: C
          to: D
          label: needs economic proof
        - from: D
          to: E
          label: must also clear controls
        - from: E
          to: F
          label: until then
    claimRefs:
