            body: >-
              The underwriting blocker is not whether bolttech has revenue-generating activity—it clearly does—but
              whether the public record separates high-quality recurring revenue from gross premium or partner-volume
              proxies. TechCrunch’s quoted-premium growth and partner counts, plus the case-study outcomes, all suggest
              meaningful commercial traction. However, they still leave open the core diligence questions: how much of
              the economics are software or transaction fees, how much are service-heavy fulfilment, how concentrated
              the largest partners are, and whether renewals or attach rates support durable margin expansion.


