  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view and thesis-break framing
        blocks:
          - type: paragraph
            body: >-
              The public record supports a clear ordering of bolttech's risk stack. The first bucket is legal,
              regulatory, and privacy risk: the company operates across 39 markets, uses customer and quote data
              extensively, and discloses sharing with insurers, government agencies, service providers, and advertising
              partners. The second bucket is operational and cyber risk, because the model depends on a single
              integration layer, claims servicing, repair logistics, and continuous handling of sensitive policy and
              customer data. The third bucket is partner and rollout dependency: many of the company's strongest growth
              proofs come through OEM, telco, retail, lender, and carrier partnerships that sit outside bolttech's full
              control. Fourth is financial-model opacity, because public materials emphasize quoted premiums and
              footprint more than audited revenue, take rate, or margin. Fifth is execution risk, since the company is
              trying to scale compliance-heavy launches across many products, channels, and jurisdictions at once. The
              right underwriting stance is therefore not to reject the story outright, but to require direct diligence
              on authorisations, cyber remediation, economics, and partner concentration before treating the latest
              valuation as durable.
            claimRefs:
