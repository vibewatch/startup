  - id: FI003
    title: Financial estimate range
    type: range
    layout: wide
    summary: >-
      Adjacent public comps show a very wide valuation and profitability band, which is why bolttech’s undisclosed take
      rate matters more than its activity scale alone.
    data:
      items:
        - label: Revenue-multiple band
          low: 0.53
          mid: 0.96
          high: 5.3
          unit: x sales
          displayValue: 0.5x-5.3x
          detail: >-
            Root represents the low public multiple, Assurant the incumbent middle, and Lemonade the higher-growth
            digital-insurer upper end.
          source: Root / Assurant / Lemonade
          tone: neutral
        - label: Public profitability signposts
          low: 14
          mid: 39.48
          high: 41
          unit: '%'
          displayValue: 14%-41%
          detail: >-
            Low end is Assurant adjusted EBITDA margin on 2025 revenue; higher points are Root and Lemonade gross-margin
            disclosures, so this is a signpost rather than a like-for-like comparison.
          source: Assurant / Root / Lemonade
          tone: neutral
        - label: Annualized quoted-premium path
          low: 55
          mid: 60
          high: 65
          unit: US$B
          displayValue: $55B-$65B
          detail: >-
            TechCrunch reported approximate annualized quoted premiums rising from about $55B in May 2023 to about $65B
            in June 2025.
          source: TechCrunch
          tone: positive
    approximationNotes: >-
