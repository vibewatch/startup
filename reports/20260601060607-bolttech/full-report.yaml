    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and present scale markers
        blocks:
          - type: paragraph
            body: >-
              bolttech’s public identity is that of a technology-enabled embedded-insurance infrastructure company
              rather than a balance-sheet insurer. The homepage and “Who We Are” page repeatedly frame the business as
              an ecosystem that connects insurers, distributors, and customers, while the integrations page and API
              documentation make clear that the product surface extends from quote generation and verification through
              contract management, claims-adjacent servicing, and third-party system integrations. That matters because
              it explains why the company can plausibly operate across multiple verticals and geographies without owning
              all carrier risk itself. The strongest current scale markers are still company claims, but they are
              specific enough to anchor later diligence: 39 markets across four continents, 700-plus distribution
              partners, 250-plus insurers, 7,000-plus products, 2,000-plus team members, and US$85 billion-plus quoted
              premiums annually. Third-party reporting from mid-2025 broadly corroborates the partner, insurer, and
              product counts while also showing that these figures have grown over time rather than appearing suddenly
              in 2026 marketing copy.
