      - number: '1.3'
        title: Funding history, investor base, and strategic-capital implications
        blocks:
          - type: paragraph
            body: >-
              bolttech’s financing history is best anchored on the two-step Series C. The first close in December 2024
              was officially announced as a Dragon Funds-led round expected to exceed US$100 million at a US$2.1 billion
              valuation, with Baillie Gifford and Generali’s Lion River named among participants. The final close in
              June 2025 then added Sumitomo Corporation and Iberis Capital, bringing the round to US$147 million total
              while preserving the same US$2.1 billion valuation. Independent coverage from TechCrunch, Fintech
              Singapore, Coverager, and FinTech Global broadly aligns on those markers, which is enough to treat the
              round size and valuation as reliable public facts. More importantly, the investor set is not purely
              financial. Sumitomo paired its investment with an Asia-focused joint venture, while Generali and Europ
              Assistance separately described a multi-product European embedded-insurance collaboration. That suggests
              the capital structure also functions as a commercial-distribution wedge. What remains missing is the fully
              diluted cap table, any secondary liquidity detail, and the exact governance consequences of these
              strategic investors joining the syndicate.
