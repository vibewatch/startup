      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              On capital, the public record is strong on fundraising and weak on liquidity. Official releases show
              bolttech completed a two-step Series C, first closing above $100 million in December 2024 and finishing at
              $147 million in June 2025, both at a $2.1 billion valuation. Management and reporters say those proceeds
              are earmarked for platform capability investment, AI and data work, and further geographic expansion, with
              Sumitomo’s joint venture pointing to more device-lifecycle and resale programs in Asia. That confirms
              external capital access and strategic sponsorship.


              But there is still no retained public disclosure of consolidated group cash, monthly burn, runway, debt
              facilities, or project-finance obligations. UK Companies House filings improve visibility on local
              entities, yet they do not solve group-level adequacy. The practical conclusion is that capital sufficiency
              cannot currently be judged from audited liquidity; it has to be inferred from the fresh round and investor
              support, which is much weaker evidence than a disclosed balance sheet or cash-flow statement. By contrast,
              public comp Root was able to refinance into a lower-cost $200 million term loan and authorize a $75
              million buyback in May 2026, which highlights how much less balance-sheet evidence is available for
              bolttech as a private company.
