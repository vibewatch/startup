    rows:
      - - Partner-channel UX layer
        - Embeds offers inside apps, websites, telesales, stores, or dealer journeys
        - Depends on partner-owned front ends and billing surfaces
        - Poor partner integration can break conversion or brand consistency.
      - - Product and pricing orchestration
        - Configures products, quotes, options, and policy structures
        - Depends on insurer supply, product rules, and market-specific compliance
        - Variation by carrier and market may slow rollout.
      - - Unified API and integration layer
        - Moves discovery, quote, verification, contract, and servicing events between systems
        - Depends on stable credentials, schemas, and third-party integrations
        - Sparse public developer proof raises diligence burden on API operability.
      - - Identity, verification, and scoring path
        - Supports identity checks, rental scoring, and protected transaction flow
        - Depends on data providers and correct security configuration
        - Sensitive data handling increases privacy and fraud exposure.
      - - Servicing, claims, and repair operations
        - Runs post-sale claims, repairs, service requests, and contact-center support
        - Depends on repair networks, claims logic, and omnichannel operations
        - Execution risk is operationally intensive and market specific.
      - - Analytics and data connectors
        - Feeds telematics, leak, cyber, or device data into product and underwriting flows
        - Depends on partner data rights and data-quality consistency
        - Weak data quality can undermine pricing, personalization, and claims outcomes.
