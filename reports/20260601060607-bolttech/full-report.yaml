      - number: '2.4'
        title: Drivers, constraints, and competitive pressure
        blocks:
          - type: paragraph
            body: >-
              The demand case for embedded insurance is straightforward: digital ecosystems already own customer
              attention, APIs reduce integration friction, and data or AI can improve relevance at checkout. Grand View,
              Mordor, and Fortune all point to some mix of digital-platform growth, personalization, and on-demand
              coverage as the core tailwinds. bolttech’s own case studies then provide commercialization proof: faster
              launches, high conversion rates, improved quoted premiums, and channel expansion across telco, fintech,
              brokers, and insurers. But the market is not frictionless. The same sources repeatedly flag regulatory
              fragmentation, privacy and consent rules, carrier onboarding, and low customer awareness as adoption
              blockers. These frictions help explain why embedded insurance is attractive yet still operationally hard,
              especially across multiple jurisdictions. Competitive pressure is also real. Cover Genius, Qover, Chubb,
              Assurant, and even adjacent tech-first insurers such as Root all market variants of API-enabled,
              partner-distributed insurance. That means bolttech’s edge, if any, has to come from launch speed,
              compliance execution, product breadth, and partner economics rather than from occupying a greenfield
              category. The biggest remaining public-data gap is therefore not whether the market exists, but whether
              bolttech’s private attach rates and partner concentration justify a meaningful share inside its narrower
              serviceable slice.
            claimRefs:
