        title: Milestones of record, expanding footprint, and public risk signals
        blocks:
          - type: paragraph
            body: >-
              The dated public record supports a company that kept broadening its channel footprint through 2025 and
              2026. The sequence begins with the 2020 launch, moves through the December 2024 Series C first close, the
              June 2025 final close, September 2025 Indonesia EV-insurance launch with Harmony Auto, January 2026 Sony
