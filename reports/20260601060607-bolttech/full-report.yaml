  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Cyber remediation does not clear
        - No outside-forensics summary, no clear customer-notice record, or new adverse facts emerge.
        - Directly compresses trust and multiple support.
        - Move the case to avoid or require a steep price reset.
      - - Economics look intermediary-like
        - Take rate, gross margin, or retained-risk profile fail to support software-like economics.
        - Collapses the premium-multiple thesis.
        - Re-underwrite closer to Assurant or Root-style bands, not software-heavy comps.
      - - Partner concentration is high
        - Top partners or markets dominate revenue with weak renewal protections.
        - Turns breadth-of-logo story into single-point dependency.
        - Cut size or insist on structural protections and discount.
      - - Permissions stack is incomplete
        - Material markets lack clear authorisation or entity clarity.
        - Creates legal risk that invalidates go-to-market assumptions.
        - Pause the process until legal diligence closes.
      - - Recent launches do not monetise
        - BYD, MediaMarkt, or other 2026 launches fail to show attach, renewal, or economics progress.
        - Bull case loses its operating catalyst.
        - Hold fire and monitor rather than paying up now.
    notes: These are the downside triggers that should change price, not simply headline risks that sound uncomfortable.
    claimRefs:
