              BYD’s European appointment, and April 2026 Associated Carrier Group’s U.S. device-protection rollout.
              Together these events show product expansion across mobility, consumer electronics, telco-adjacent retail,
              and regional wireless distribution rather than a single-vertical story. The most material negative public
              signal in the retained pack is the Cybernews report that a ransomware gang claimed to have stolen about
              186GB of bolttech data; because the report explicitly said company confirmation was still outstanding, it
              is best treated as a live diligence question rather than a settled breach fact. Public UK entity filings
              add another operational signal: bolttech’s footprint now includes maintained device-protection and
              insurance-services entities in the UK, but the retained sources do not yet resolve the full
              license-and-control map across all markets.
