      - number: '1.2'
        title: Founder leadership, operating bench, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founder story is well evidenced at the CEO level and only partially evidenced beyond it. Retained
              official and third-party leadership sources consistently identify Rob Schimek as founder and group chief
              executive officer. The strongest background source traces his path from nearly two decades at Deloitte to
              senior executive roles at AIG, which gives bolttech a leader with both public-accounting discipline and
              global insurance operating experience. Official 2026 leadership content also keeps Schimek at the center
              of the company’s public strategic narrative, reinforcing meaningful key-person concentration. Governance
              transparency is weaker. The retained public pack does support ESG language around financial inclusion,
              e-waste reduction, and corporate governance, but it does not provide a current board roster,
              independent-director list, or a clean public picture of investor governance rights after Series C. The
              right conclusion is that management credibility and industry fit are reasonably well supported, while
              formal governance independence remains a diligence gap rather than a verified strength.
