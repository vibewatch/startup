    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      bolttech's fair value is highly sensitive to whether investors underwrite it against incumbent-like,
      intermediary-like, or software-like economics.
    data:
      items:
        - label: Root-like downside case
          value: 0.9
          detail: >-
            A harsh read-through if economics look closer to thin-margin insurance exposure and public-market caution
            dominates.
          tone: risk
        - label: Assurant-like incumbent band
          value: 1.4
          detail: A roughly incumbent-like revenue multiple if bolttech is durable but not software-like.
          tone: neutral
        - label: Base underwriting case
          value: 1.8
          detail: Requires clean diligence on revenue quality and limited retained-risk exposure.
          tone: neutral
        - label: Current round reference
          value: 2.1
          detail: Fresh price discovery, but still not fully cleared by public economics data.
          tone: neutral
        - label: Bull underwriting case
          value: 2.8
          detail: Needs software-like take rates, strong retention, and conversion of 2026 launches into recurring economics.
          tone: positive
