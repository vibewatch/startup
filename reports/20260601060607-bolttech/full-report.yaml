      - number: '8.3'
        title: Bull, base, and bear range with downside triggers
        blocks:
          - type: paragraph
            body: >-
              The public record supports a wide valuation range because critical economic inputs are missing. The bull
              case works if the recent partner momentum translates into recurring revenue, software-like take rates,
              high renewal quality, and low retained-risk leakage. Under that outcome, bolttech could still grow into or
              above the current mark. The base case is more conservative: the round price becomes defendable only if
              diligence confirms healthy net revenue, controlled service economics, and clean cyber-remediation
              evidence. The bear case is straightforward. If the cyber allegation proves more serious than currently
              documented, if key launches stall, if the business is thinner-margin than investors expect, or if
              legal-entity and permissions complexity slows partner activation, the public comp band points to a lower
              mark. Investors should therefore treat the current valuation as a negotiation reference, not as a
              fair-value fact. A scenario-driven underwriting framework is the only defensible way to approach the
              opportunity until management discloses hard economics.
