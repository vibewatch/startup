      - number: '3.2'
        title: Capability breadth and distribution fit
        blocks:
          - type: paragraph
            body: >-
              bolttech’s strongest public story is not abstract “embedded insurance” but operating depth in device-heavy
              partner journeys. Its platform and API materials show quote, verification, contract, and lifecycle
              orchestration, while the Erajaya, Globe, Harmony Auto, and SB Finance programmes show embedded protection
              extending into repair, upgrades, EV assistance, and loan-linked benefits. That breadth matters because
              direct peers also claim speed and orchestration: Cover Genius emphasises XCover’s global sector coverage
              and conversion optimisation, while Qover emphasises Europe-wide insurer and country orchestration. The
              result is a market where surface-level capabilities increasingly look similar, so the real question
              becomes where a platform can prove repeated launches in a vertical that the partner actually values. In
              device protection and post-sale service, bolttech looks differentiated; in generic checkout orchestration,
              the retained evidence suggests the field is more crowded and more substitutable.
