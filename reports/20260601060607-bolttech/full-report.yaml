          - type: callout
            title: What has to be true for the bull case to work
            body: >-
              Management has to prove that quoted-premium scale converts into high-quality net revenue with limited
              retained-risk exposure, that recent launches monetize well, and that the cyber issue is fully contained.
              Without those three proofs, the current mark is more likely stretched than attractive.
            calloutType: assumption
            claimRefs:
