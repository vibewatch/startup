      - number: '3.3'
        title: Pricing visibility, trust posture, and regulatory signalling
        blocks:
          - type: paragraph
            body: >-
              Public pricing is remarkably thin across the B2B set. bolttech, Cover Genius, Qover, Chubb Studio, and
              Assurant all describe tailored partner programmes, conversion improvements, white-labelling, or
              integration models, but none of the retained sources publishes a clean enterprise fee card or a directly
              comparable revenue-share schedule. That makes procurement benchmarking harder and shifts diligence toward
              trust signals. Cover Genius foregrounds broad licensing and authorisation, Qover foregrounds its
              Europe-wide licences plus FCA authorisation, and incumbents such as Chubb and Assurant foreground global
              scale, financial strength, and broad product estates. bolttech’s trust posture is more operational:
              regulated local entities, privacy and security controls, and complex data-handling capabilities. The
              cyber-incident reporting in Cybernews does not prove a breach outcome on its own, but it does raise the
              burden of proof on incident response, assurance artefacts, and partner comfort with bolttech as a
              data-intensive intermediary.
