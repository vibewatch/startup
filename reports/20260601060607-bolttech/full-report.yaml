  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              bolttech has enough public evidence to deserve serious consideration, but not enough to justify writing a
              clean investment memo at the last round price without further diligence. The strongest positives are
              recent capital formation at a still-premium mark, strategic investors that also want commercial
              relationships, and evidence that the company can ship real partner programmes in auto, retail, telco, and
              lending-linked channels. The weakest area is financial disclosure. Public materials emphasize quoted
              premiums, partner breadth, and market footprint, while leaving revenue quality, take rate, gross margin,
              retention, and preference structure largely unaddressed. That mismatch matters because the current mark
              can be defended under some scenarios, but only if bolttech behaves more like a software-enabled
              orchestration layer than like a thin-margin intermediary or risk-bearing operator. Given that uncertainty,
              the disciplined call is research-more rather than buy. The company is investable if diligence closes the
              economics gap and clears the cyber overhang, but the burden of proof sits with management, not with the
              public market backdrop.
            claimRefs:
              - CV001
