      - number: '8.2'
        title: Market context and comparable set
        blocks:
          - type: paragraph
            body: >-
              The valuation debate has to separate two questions: whether bolttech sits in an attractive market, and
              whether the public evidence lets investors price the company confidently today. On market attractiveness,
              the answer is yes. Independent reports all describe fast embedded-insurance growth, even if they disagree
              materially on absolute market size. That supports strategic relevance but also warns against using a
              single TAM slide as valuation evidence. The better anchor is the comparable set. Lemonade trades at a
              premium growth multiple, Root trades at a distressed or insurance-like multiple, and Assurant represents a
              scaled incumbent with meaningful device-protection relevance but much lower market-cap-to-revenue.
              bolttech's $2.1 billion mark lands between those poles. That is not obviously wrong, but it is highly
              sensitive to what diligence reveals about actual net revenue, margin structure, partner concentration, and
              any retained insurance exposure. In other words, the price is plausible only under a specific
              quality-of-economics thesis; it is not self-validating just because large insurers and strategics
              invested.
