      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not confuse fresh financing with complete price validation
            body: >-
              The Series C close is an important positive signal, but strategic investors can still overpay or
              underwrite information that public investors do not yet have. The mark should therefore be treated as
              evidence of demand, not as final proof of fair value.
            calloutType: recommendation
            claimRefs:
              - CV002
