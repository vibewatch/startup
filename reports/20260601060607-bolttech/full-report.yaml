  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Public materials make clear bolttech is not positioned as a carrier collecting the full written premium.
              The API and platform pages instead describe a B2B, B2B2C, and agent-enabled operating layer that prices,
              quotes, verifies, binds, services, repairs, and renews protection products inside partner-owned journeys.
              That strongly suggests a revenue mix built from orchestration and distribution fees, software or program
              fees, and service revenue from claims, repair, upgrade, or lifecycle programs. The vertical pages repeat
              the commercial logic: telcos, OEMs, banks, lenders, and insurers use bolttech to unlock new revenue,
              reduce churn, and expand product mix without building local insurance operations from scratch.


              What remains missing is the hard commercial detail. Public sources show contract structure in some
              places—dynamic quote retrieval, annual device upgrades, and integrated protection inside partner
              channels—but do not disclose realized take rates, platform fees, commission splits, carrier economics, or
              accounting treatment between premium flow and bolttech-recognized revenue. So the business model is
              legible, but pricing power is still not underwritten.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
