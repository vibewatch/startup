  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The competitive set is not one clean peer group. The nearest like-for-like challengers are Cover Genius
              and Qover because both sell API-led embedded distribution to partners rather than only underwriting their
              own branded book. Chubb Studio and Assurant matter for a different reason: they bring incumbent
              balance-sheet credibility, channel relationships, and operational scale that can compress bolttech’s pitch
              even when their starting point is carrier or service infrastructure rather than neutral exchange software.
              Lemonade and Root are adjacent substitutes, not perfect peers, because they own more of the carrier
              economics and consumer brand yet still compete anywhere a buyer could choose a direct digital insurer or
              an insurer with partner APIs instead of a multi-insurer orchestration layer. Public market reports
              reinforce that these classes are colliding inside a fast-growing category where API-first distribution and
              local regulatory execution decide whether partnerships launch at all.
