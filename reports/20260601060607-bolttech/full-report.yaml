companyProfile:
  summary: >-
    Bolttech is a 2020-founded Singapore-headquartered insurtech that operates a B2B2C orchestration platform connecting
    insurers, distributors, and end customers at the point of need. Its product set spans device protection, travel,
    home, health-tech, cyber, mobility, and related embedded-protection workflows, and the company says it now spans 39
    markets, 700+ distribution partners, 250+ insurers, and more than US$85 billion of quoted premiums annually. In June
    2025, Bolttech closed its Series C at US$147 million and a US$2.1 billion valuation.
