      - number: '2.3'
        title: Buyer, user, and payer motion across priority channels
        blocks:
          - type: paragraph
            body: >-
              Buyer motion in embedded insurance is cross-functional and vertical-specific. In telco, the initial
              sponsor is usually a product or commercial lead under pressure to diversify ARPU and reduce churn, but
              technology, compliance, and customer-care teams all matter because protection is embedded into billing,
              claims, and service journeys. In device OEM and mobility settings, the buyer is often an after-sales,
              finance, or digital-commerce owner who wants to expand take rate and lifetime value without degrading the
              core purchase experience. In financial services, the sponsor may sit in product, distribution, or
              wealth-advice leadership, while legal and risk teams gate launch quality. The actual end user is the
              consumer buying the protected device, vehicle, trip, or financial product; the payer can be the same
              consumer, a bundled subscription programme, or in some cases a platform that subsidizes cover to increase
              conversion or loyalty. Public case studies show why these motions matter. Taiwan Mobile, JKOPay,
              MasOrange, and MoneyHero all anchored launches inside high-frequency digital ecosystems where KYC, billing
              rails, or comparison traffic already existed. That is why bolttech’s practical SAM is narrower than the
              headline global TAM: the company needs digitizable partner journeys, enough compliance readiness to
              launch, and a buyer who can defend incremental integration work with conversion or retention gains.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
