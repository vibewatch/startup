      - number: '2.2'
        title: TAM, SAM, and contradictory sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public market sizing is strong enough to prove category relevance but too inconsistent to support
              one-number precision. Grand View and Fortune both place the embedded-insurance market around US$144-145
              billion in 2025, while Mordor’s 2025 estimate is only US$13.88 billion and its 2026 estimate US$18.09
              billion. The bolttech and Mobile World Live whitepaper uses a different trajectory again, citing US$156
              billion in 2024 and US$703 billion by 2029. These are not rounding differences; they imply materially
              different market boundaries, inclusion rules, and publisher methodologies. Segment and geography splits
              are more directionally useful than the absolute TAM. Grand View and Mordor both say electronics protection
              is the largest line today, digital or API-first channels dominate distribution, and e-commerce remains the
              largest end market, while mobility is the faster-growing segment. Geography is less settled: Grand View
              and Mordor both place North America near 36.7% of 2025 market share, but Fortune instead says Asia Pacific
              already represented 47.6% in 2025. For diligence, the right lens is therefore not “the market is huge” but
              “the serviceable market is a subset of digitizable partner channels in a fast-growing distribution model
              whose broad TAM depends heavily on definition.”
