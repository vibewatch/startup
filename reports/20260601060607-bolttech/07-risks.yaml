  evidenceGaps:
  - type: missing-source
    severity: material
    topic: authorisations
    missingEvidence: A market-by-market permissions and appointed-representative map for bolttech-controlled entities.
    whyItMatters: Without the authorisation pack, investors cannot clear legal ability to distribute or service embedded insurance in core markets.
    diligencePath: Request compliance memo, entity chart, and regulator references for the UK, Singapore, Spain, and any other top revenue markets.
    relatedQuestionRefs:
    - QR005
    - QR027
  - type: private-evidence-only
    severity: material
    topic: insurance-risk-transfer
    missingEvidence: Retained-risk, fraud-loss, loss-ratio, and claims-severity information by programme.
    whyItMatters: Quoted premiums alone do not reveal whether bolttech behaves like software, a thin intermediary, or a risk-bearing operator.
    diligencePath: Obtain programme economics by product line, carrier relationship, and market, including take rate, loss transfer, and gross margin.
    relatedQuestionRefs:
    - QR018
    - QR028
  - type: missing-source
    severity: material
    topic: cyber-remediation
    missingEvidence: External-forensics findings, incident timeline, customer-notice status, and cyber-insurance response related to the alleged Everest event.
    whyItMatters: The public allegation is serious enough to affect partner trust, legal exposure, and valuation if unresolved.
    diligencePath: Ask for the board-level incident memo, outside-counsel guidance, insurer notices, and any regulator communication.
    relatedQuestionRefs:
    - QR004
    - QR024
    - QR029
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Revenue, GWP, and attach-rate concentration across top partners, top insurers, and top geographies.
    whyItMatters: Breadth of logos does not answer whether economics are diversified or concentrated in a few counterparties.
    diligencePath: Request top-10 partner and carrier exposure, renewal rights, and launch backlog conversion by cohort.
    relatedQuestionRefs:
    - QR017
    - QR021
    - QR022
  - type: missing-source
    severity: minor
    topic: security-certifications
    missingEvidence: Named SOC 2, ISO 27001, or equivalent certifications plus the date of the latest audits.
    whyItMatters: Enterprise-facing platforms handling insurance and claims data usually need externally verified control evidence.
    diligencePath: Request the trust pack, certification reports, penetration-test summary, and vulnerability-management KPIs.
    relatedQuestionRefs:
    - QR009
    - QR029
