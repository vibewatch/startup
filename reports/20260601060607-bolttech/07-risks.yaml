- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk domain
  - Monitorable trigger
  - Threshold or event
  - Investment implication
  rows:
  - - Cyber / privacy
    - Incident remediation evidence
    - No external-forensics pack, no customer-notice record, or no cyber-insurance confirmation during diligence.
    - Treat the current valuation as impaired until controls and loss containment are evidenced.
  - - Regulatory / licensing
    - Permissions pack completeness
    - Management cannot produce an entity-by-entity authorisation and appointed-representative map for core markets.
    - Pause investment because the distribution model cannot be underwritten legally.
  - - Partner concentration
    - Anchor-partner economics
    - Top three partners drive an outsized share of revenue or GWP with weak contractual protections.
    - Cut position size, require pricing discount, or decline if renewal rights are weak.
  - - Economics / take rate
    - Public-vs-private metric bridge
    - Audited net revenue, take rate, gross margin, or loss-transfer data contradict the scale story implied by quoted premiums.
    - Reframe bolttech as a thinner-margin intermediary and mark valuation down.
  - - Claims-service quality
    - Programme SLA performance
    - Material complaints, sub-95% fulfilment, or rising fraud-loss trends appear in major programmes.
    - Assume attach-rate degradation and higher churn risk across partner channels.
  - - Execution cadence
    - Launch backlog versus partner announcements
    - Signed partnerships repeatedly fail to convert into live multi-market programmes inside the promised window.
    - Reduce conviction in the bull case and move the company toward track or research-more status.
  notes: These kill criteria are not predictions; they are the monitorable events that would turn public concerns into thesis-breaking evidence.
