- id: legal-regulatory-data-governance
  title: Legal, regulatory, and data-governance risks
  body: 'Legal and regulatory exposure is structurally high because bolttech is a cross-border distribution and servicing platform rather than a single-market software vendor. The company''s own materials emphasize broad footprint, while the UK filings show multiple operating entities and a 2025 reorganisation that renamed one insurance-services subsidiary from Pattern Embedded Limited. The privacy notice broadens the diligence perimeter further: bolttech collects quote and policy data, logs transactions, and can share information with insurers, affiliates, service providers, credit bureaus, government agencies, and advertising partners. That makes privacy governance, consent management, and third-party oversight core investment questions, not side issues. Independent market reports reinforce the point by identifying privacy and fragmented compliance regimes as meaningful sector restraints. Finally, the public regulatory evidence is still incomplete. The FCA register tells investors where
    UK authorisation status should be checked, but the public-source set used for this chapter does not surface a named FCA reference or a multi-jurisdiction permissions map for bolttech-controlled entities. Until management provides that pack, investors should assume legal-regulatory diligence is still open.'
