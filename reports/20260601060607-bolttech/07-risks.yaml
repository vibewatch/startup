figures:
- id: FR001
  title: Risk heatmap
  type: matrix
  layout: wide
  summary: The highest-residual risks sit in legal-regulatory, cyber, and partner-dependency rather than in simple go-to-market noise.
  data:
    columns:
    - Low impact
    - Medium impact
    - High impact
    rows:
    - label: High likelihood
      values:
      - label: Local launch friction
        tone: neutral
        detail: Routine market-by-market rollout slippage is common but manageable.
      - label: Integration debt / service load
        tone: risk
        detail: Breadth of products and systems makes execution quality a constant monitoring item.
      - label: Privacy-governance burden
        tone: risk
        detail: The data-sharing-heavy model makes compliance a persistent high-impact risk.
    - label: Medium likelihood
      values:
      - label: Case-study metrics fail to generalise
        tone: neutral
        detail: Public proofs may not represent the full partner base.
      - label: Partner concentration surfaces in diligence
        tone: risk
        detail: Large counterparties can become gating dependencies if economics are concentrated.
      - label: Cyber incident proves material
        tone: risk
        detail: If the reported ransomware event reflects real customer data loss, the impact is immediate.
    - label: Low likelihood
      values:
      - label: Routine pilot underperformance
        tone: positive
        detail: Individual pilots can miss without breaking the full company story.
      - label: JV or framework reset
        tone: neutral
        detail: A single partnership reset would hurt sentiment but not necessarily the platform.
      - label: Authorisation gap or formal enforcement
        tone: risk
        detail: A discovered licensing hole or enforcement action would be thesis-breaking despite lower base probability.
