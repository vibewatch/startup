  - Residual exposure / diligence path
  rows:
  - - Cross-border licensing and conduct exposure
    - 39 markets across four continents; FCA register is the UK reference point, but no permissions pack is public in this source set.
    - High
    - High
    - Experienced incumbent partners and UK entity structure suggest some local setup exists.
    - Obtain entity-by-entity licensing matrix, appointed-representative relationships, and compliance owners before underwriting.
  - - Privacy, consent, and third-party data sharing
    - Privacy notice discloses broad use of quote, policy, analytics, credit-bureau, government, and advertising-partner data.
    - High
    - High
    - API documentation references GDPR-compliant handling and encrypted payloads.
    - Review DPAs, consent logs, retention rules, vendor inventory, and any regulator correspondence.
  - - UK entity and governance complexity
    - Companies House shows a 2025 rename from Pattern Embedded Limited plus PSC changes and multiple UK bolttech entities.
    - Medium
    - Medium
    - Corporate clean-up may simplify control if documented centrally.
    - Request legal-entity map, intercompany agreements, regulated-activity scope, and board approvals tied to the reorganisation.
  - - Cyber-driven legal notification risk
    - Cybernews reported a 186GB ransomware allegation involving customer, policy, and employee data.
    - Medium
    - High
    - No public confirmation of enforcement action found in the current source set.
    - Request incident timeline, affected jurisdictions, notification decisions, insurer notices, and external-forensics output.
  notes: Severity ranks the investment consequence, not the probability of enforcement; residual exposure remains high because public authorisation and incident documentation are incomplete.
