- id: operational-cyber-and-partner-dependency
  title: Operational, cyber, and partner-dependency risks
  body: 'bolttech''s operating promise is ambitious: one platform that handles product discovery, pricing, verification, policy lifecycle, claims, repair ecosystems, and partner integrations across multiple insurance lines. That breadth can become an asset when execution is strong, as the MasOrange and Italian MNO case studies show, but it also creates a long chain of dependencies. Product performance is tied to APIs, identity and fraud controls, data quality, repair providers, contact centres, and the readiness of partner systems. The cyber dimension is therefore especially important. Cybernews reported an alleged Everest ransomware event involving sensitive bolttech information, with researchers warning of phishing and claims-fraud risk if the sample represented real production data. Whether or not the full allegation is ultimately confirmed, the public record already shows enough smoke to make cyber remediation, breach notification, and insurance coverage mandatory diligence items. Partner
    dependence compounds the issue. BYD, MediaMarkt, SB Finance, Globe, Sumitomo, AXA, and Generali all represent routes to growth, but each also introduces third-party launch timing, underwriting, compliance, or servicing risk that bolttech cannot fully dictate on its own.'
