company:
  name: Bolttech
chapter:
  number: 1
  title: Company Overview
  summary: bolttech is a Singapore-headquartered embedded-insurance infrastructure company launched in 2020 and now publicly marketed as operating across 39 markets, 700-plus distribution partners, 250-plus insurers, and US$85 billion-plus quoted premiums annually. The best-supported late-stage financing markers are the December 2024 first close of Series C at a US$2.1 billion valuation and the June 2025 close at US$147 million total, with Dragon Funds, Baillie Gifford, Generali Lion River, Sumitomo, and Iberis all named publicly. The main unresolved items are board composition, exact cap-table control, and audited operating metrics, while the main adverse public signal is an unconfirmed late-2025 ransomware allegation reported by Cybernews.
sections:
- id: identity-platform-scale
  title: Identity, product scope, and present scale markers
  body: 'bolttech’s public identity is that of a technology-enabled embedded-insurance infrastructure company rather than a balance-sheet insurer. The homepage and “Who We Are” page repeatedly frame the business as an ecosystem that connects insurers, distributors, and customers, while the integrations page and API documentation make clear that the product surface extends from quote generation and verification through contract management, claims-adjacent servicing, and third-party system integrations. That matters because it explains why the company can plausibly operate across multiple verticals and geographies without owning all carrier risk itself. The strongest current scale markers are still company claims, but they are specific enough to anchor later diligence: 39 markets across four continents, 700-plus distribution partners, 250-plus insurers, 7,000-plus products, 2,000-plus team members, and US$85 billion-plus quoted premiums annually. Third-party reporting from mid-2025 broadly
    corroborates the partner, insurer, and product counts while also showing that these figures have grown over time rather than appearing suddenly in 2026 marketing copy.'
