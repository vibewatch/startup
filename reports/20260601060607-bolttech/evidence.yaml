evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-oversight
    missingEvidence: Current board roster, independent director list, and investor governance rights.
    whyItMatters: >-
      Founder concentration and new strategic investors are visible, but governance checks cannot be completed from
      retained public sources alone.
    diligencePath: >-
      Request the latest board deck, shareholder agreement summary, and jurisdiction-by-jurisdiction director list from
      management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, run-rate, gross margin, and audited top-line disclosure for bolttech.
    whyItMatters: The chapter can support valuation and fundraising milestones, but not operating performance or capital efficiency.
    diligencePath: Request management financials, lender decks, and auditor-reviewed KPI definitions for 2024-2026.
    relatedQuestionRefs:
      - QO021
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Fully diluted cap table, any secondary transfers, and investor ownership percentages after Series C.
    whyItMatters: Public releases show named investors and valuation, but not control rights or exact dilution.
    diligencePath: Request the post-Series-C cap table, financing documents, and any secondary-sale schedules.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO003
  - type: stale
    severity: minor
    topic: cyber-incident
    missingEvidence: >-
      A company-confirmed incident update, remediation summary, or regulator disclosure about the alleged ransomware
      event.
    whyItMatters: The adverse signal is currently one-sided and cannot yet be sized as a lasting operating risk.
    diligencePath: >-
      Check management responses, regulatory breach filings, insurer notifications, and any customer communications
      after the Cybernews report.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-sizing
    missingEvidence: >-
      Vertical mix, geography mix, attach rates, and partner concentration needed to convert market shells into a
      bolttech-specific SAM.
    whyItMatters: >-
      Without operating mix disclosure, broad analyst TAMs cannot be translated into realistic serviceable revenue pools
      for bolttech.
    diligencePath: >-
      Request partner GMV or quoted-premium mix by vertical, geography, and product line together with attach rates and
      renewal data.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: som-sizing
    missingEvidence: >-
      Cohort-level partner penetration, active-policy counts by channel, and market-share denominators for each priority
      vertical.
    whyItMatters: >-
      Public case studies show uplift after launch but do not reveal what fraction of the addressable partner market
