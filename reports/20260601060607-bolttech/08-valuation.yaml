- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation status
  - Relevance
  - Limitation
  rows:
  - - bolttech (latest round)
    - $2.1B private valuation
    - Current reference mark; implied ~1.4x revenue only if Cybernews' $1.5B figure is directionally right
    - Direct subject company with fresh price discovery and strategic investors
    - No public audited revenue, margin, or preference-stack disclosure.
  - - Lemonade
    - $4.45B market cap / $0.84B TTM revenue
    - ~5.3x market-cap-to-revenue
    - Upper-end insurtech growth multiple and public sentiment read-through
    - Consumer-carrier model is not a direct B2B2C orchestration analog.
  - - Root
    - $0.82B market cap / $1.56B TTM revenue
    - ~0.53x market-cap-to-revenue and ~0.27x EV/sales
    - Lower-bound insurtech multiple with public market discipline
    - Auto-insurance carrier exposure makes it structurally different from bolttech.
  - - Assurant
    - $12.33B market cap / $12.4B revenue
    - ~1.0x market-cap-to-revenue
    - Scaled incumbent with relevant device-protection and B2B2C channel exposure
    - Much larger and more diversified than bolttech, so growth upside is not directly comparable.
  notes: Multiples are approximate read-throughs using public market-cap and revenue data; the bolttech row is included to show where the private mark sits against the comp band, not as a self-comparison shortcut.
