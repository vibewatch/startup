  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-economics
    missingEvidence: Audited 2025 revenue, gross margin, take rate, revenue-recognition policy, and bridge from quoted premiums to net revenue.
    whyItMatters: This is the central file required to decide whether bolttech deserves software-like or incumbent-like multiples.
    diligencePath: Request audited financials plus the board deck used to support the 2025 financing round.
    relatedQuestionRefs:
    - QV013
    - QV016
    - QV021
    - QV026
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, churn, attach rates, top-partner concentration, and top-market concentration for the current business.
    whyItMatters: Scale without stickiness can justify a much lower multiple than the current private mark implies.
    diligencePath: Obtain cohort tables, partner renewals, and exposure by customer, partner, market, and product line.
    relatedQuestionRefs:
    - QV016
    - QV023
    - QV026
  - type: missing-source
    severity: material
    topic: cyber-remediation
    missingEvidence: External-forensics and cyber-insurance documentation tied to the reported ransomware allegation.
    whyItMatters: The cyber issue is the cleanest public downside trigger against the current valuation.
    diligencePath: Ask the company for incident timeline, containment, notifications, and post-mortem control upgrades.
    relatedQuestionRefs:
    - QV015
    - QV024
    - QV025
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Liquidation preferences, seniority, side letters, and structured protections from the latest round.
    whyItMatters: Headline valuation alone does not reveal downside protection or common-equity economics.
    diligencePath: Review the cap table, financing documents, and counsel summary before pricing any new investment.
    relatedQuestionRefs:
    - QV030
