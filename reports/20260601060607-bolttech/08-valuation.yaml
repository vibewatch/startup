- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Strategic investors plus commercial JVs suggest the platform solves a real distribution problem.
    - Need signed milestone schedules and proof that strategic relationships convert into recurring economics rather than PR value.
  - - Recent launches in auto, retail, lending, and telco imply broad channel optionality.
    - Need cohort-level attach, renewal, and servicing-cost data to show those launches are profitable.
  - - Independent market work supports strong long-term embedded-insurance growth.
    - Acknowledge that TAM dispersion is large, so market size alone cannot justify paying up.
  - - Public comps leave room for a premium to incumbent-like multiples if bolttech is truly software-heavy.
    - Need audited revenue, gross margin, and take-rate proof to know where bolttech sits in the comp range.
  - - The anti-thesis is that public scale metrics overstate durable earnings power.
    - This view softens if diligence proves high retention, limited retained-risk exposure, and low partner concentration.
  - - The anti-thesis is strengthened by the cyber allegation and incomplete legal-entity disclosure.
    - A clean remediation pack and permissions matrix would materially improve confidence.
  notes: Arguments are framed as investment claims that can move with price and diligence, not as static company attributes.
