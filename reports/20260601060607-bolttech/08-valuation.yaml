- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited revenue bridge
    - 2025 revenue, gross margin, take rate, and revenue-recognition bridge to quoted premiums.
    - This is the core missing file for underwriting the current mark.
    - Finance team and auditor deck.
  - - Retention and concentration
    - NRR, GRR, churn, attach rates, top-partner concentration, and top-market concentration for the current business.
    - Needed to know whether scale is sticky or just broad.
    - CFO plus commercial operations.
  - - Risk transfer and claims economics
    - Carrier contracts, retained-risk exposure, loss transfer, claims-cost burden, and fraud-loss ratios.
    - Determines whether bolttech deserves software-like or insurance-like multiples.
    - Insurance or actuarial leadership.
  - - Cyber remediation
    - Outside-forensics findings, board memo, insurer notices, and control upgrades after the reported event.
    - Key downside overhang on valuation and partner trust.
    - CISO, GC, and external counsel.
  - - Permissions matrix
    - Entity, licence, and appointed-representative map by core market.
    - Validates that growth can continue legally across the current footprint.
    - General counsel and compliance leadership.
  - - Cap table and preference stack
    - Liquidation preferences, seniority, side letters, and any structured investor rights from the round.
    - Affects true downside protection and common-equity outcomes even if headline valuation holds.
    - CFO and lead counsel.
  notes: These asks are the minimum file set required to convert the company from interesting to underwritable at or near the latest round.
