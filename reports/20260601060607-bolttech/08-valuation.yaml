- id: final-diligence-asks-and-view
  title: Final diligence asks and investment view
  body: 'The remaining work is clear. Investors need audited or board-level economic disclosure, a clean explanation of where bolttech sits in the value chain, and a direct answer on the cyber incident and legal-entity stack. They also need enough partner-level evidence to know whether recent launches are broad option value or concentrated dependency. Until those files are opened, the right stance is not to chase the signal of a fresh round. It is to preserve optionality and insist on price discipline. The most attractive version of bolttech is a software-heavy orchestration platform that monetizes a very large embedded-insurance surface without carrying meaningful underwriting risk. The least attractive version is a complex, compliance-heavy distributor whose public scale metrics overstate durable earnings power. Public evidence does not yet let investors distinguish those cases with confidence. That is why the recommendation remains research-more, not avoid: there is genuine upside if
    diligence clears, but the current mark should be treated as stretched until management proves the economics and controls behind it.'
