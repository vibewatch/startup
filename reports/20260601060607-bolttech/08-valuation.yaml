- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Probability signal
  - Key risks
  rows:
  - - Bull
    - Recent launches convert into scaled recurring economics; cyber issue clears; audited metrics show software-like take rates and strong retention.
    - $2.4B-$3.2B fair-value range; upside to or above the current round becomes defensible.
    - Would require a clean data room and commercial KPI proof within the next financing cycle.
    - Execution still depends on partner rollouts and regulatory hygiene.
  - - Base
    - bolttech proves real scale and acceptable economics, but margins or concentration are not elite.
    - $1.5B-$2.1B range; current mark only works at the top end after diligence closes.
    - Most plausible public-evidence path today.
    - Any cyber or permissions surprise pushes the case down quickly.
  - - Bear
    - Cyber, compliance, or economics evidence disappoints; launches take longer; the business looks thinner-margin than expected.
    - $0.9B-$1.4B range; markdown from the last round is likely.
    - This becomes likely if key files stay closed or adverse evidence expands.
    - Down-round dynamics, employee morale pressure, and partner hesitation compound each other.
  notes: These ranges are scenario-based underwriting judgments, not a DCF; they are intentionally wide because public revenue and margin disclosure is incomplete.
