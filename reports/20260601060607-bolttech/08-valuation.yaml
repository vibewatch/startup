callouts:
- calloutType: recommendation
  title: Do not confuse fresh financing with complete price validation
  body: The Series C close is an important positive signal, but strategic investors can still overpay or underwrite information that public investors do not yet have. The mark should therefore be treated as evidence of demand, not as final proof of fair value.
  claimRefs:
  - CV002
  - CV003
  - CV035
- calloutType: assumption
  title: What has to be true for the bull case to work
  body: Management has to prove that quoted-premium scale converts into high-quality net revenue with limited retained-risk exposure, that recent launches monetize well, and that the cyber issue is fully contained. Without those three proofs, the current mark is more likely stretched than attractive.
