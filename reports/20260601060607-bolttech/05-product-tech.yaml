- id: architecture-and-integration-model
  title: Architecture, integration, and workflow model
  body: 'The public architecture evidence is detailed enough to support a real technical model. The integrations page points to modular connections with AMS, CRM, and third-party systems, while the Unified API documentation describes a structured flow from product discovery to quoting, verification, contract acceptance, payment, delivery, activation, and servicing. That is more than marketing language: it implies bolttech expects partners to plug in both upstream and downstream systems rather than simply render an offer. The security model is also specific at the API layer, naming OAuth 2.0, JWT-based authentication, encrypted payloads, and role-based controls. The operating model looks especially strong where bolttech can sit between partner billing or account systems and downstream insurer infrastructure, then keep the relationship alive through servicing, claims, and repair operations. The technical risk is that this orchestration model depends on successful local onboarding of carriers,
    billing systems, repair networks, and compliance processes in each market, which is operationally demanding even when the core API is reusable.'
