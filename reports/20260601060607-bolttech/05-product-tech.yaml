- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - bolttech solution
  - Measurable benefit
  - Limitation
  rows:
  - - Launch insurance inside a telco app
    - Carrier wants contextual offers across device lifecycle
    - White-label embedded-insurance and lifecycle services with partner billing hooks
    - Official pages say operators can add protection, repair, trade-in, and lifestyle cover
    - No disclosed attach-rate by telco outside selected case studies.
  - - Add protection to an OEM checkout
    - OEM wants insurance inside retail and online purchase journeys
    - Tailored device cover embedded in existing sales channels
    - Official pages emphasize direct ecosystem integration and partner-network access
    - No public implementation detail on engineering effort by OEM.
  - - Embed cover into financial services
    - Institution wants more products inside trusted journeys
    - Distribution and API layer for personalized protection and operational efficiency
    - Official pages position embedded insurance as a new revenue stream
    - No public customer economics by financial-product type.
  - - Offer motor or EV protection at purchase
    - OEM or lender wants cover at point of sale or finance
    - Mobility embedded-insurance workflow plus curated insurer network
    - Official pages and launches show EV- and purchase-flow-specific propositions
    - Mostly launch evidence rather than long-run performance evidence.
  - - Handle post-sale claims and service requests
    - Partner needs branded servicing after policy issuance
    - Servicing portal, repair ecosystem, contact centers, and lifecycle management
    - Public platform page cites a seamless claims experience and repair operations
    - No public incident-rate or claims-cycle benchmark.
  - - Open new insurer or distribution channels
    - Insurer wants new products and data in existing systems
    - API-driven integrations, analytics, and policy orchestration
    - Official insurer page emphasizes faster launches and data-fed core systems
    - No independent proof of underwriting or distribution ROI.
  notes: Benefits are limited to source-backed workflow claims and do not imply uniform performance across every implementation.
