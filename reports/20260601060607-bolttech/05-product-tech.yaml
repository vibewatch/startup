- id: trust-privacy-and-competitive-context
  title: Trust, privacy, and competitive context
  body: 'bolttech’s public trust surface is mixed. On the positive side, the company exposes a privacy notice that names data flows and third-party web infrastructure, and the API docs go beyond hand-waving by naming authentication and encryption mechanics. Partner statements from Generali and AXA also support the view that bolttech has enough configurable software to matter to insurers, not just resellers. But the retained source set also shows what is missing. The developer portal root is effectively blank in this fetch, there is no retained public status page or trust-center certification list, and the most visible adverse technical signal is an unresolved ransomware allegation reported by Cybernews. That means outside diligence can validate the existence of a platform, but not yet validate its operational assurances with the same confidence. Competitive pressure is real as well: Cover Genius, Chubb, and Assurant all market API-based embedded protection, conversion tooling, or scaled
    lifecycle operations. bolttech therefore looks differentiated on orchestration breadth, but not obviously dominant on public trust evidence or developer transparency.'
