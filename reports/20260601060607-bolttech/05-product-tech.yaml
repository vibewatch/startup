company:
  name: Bolttech
chapter:
  number: 5
  title: Product & Technology
  summary: 'bolttech’s public product surface supports a real embedded-insurance operating platform rather than a single checkout widget: the company exposes lifecycle servicing, modular integrations, Unified API workflows, and vertical propositions for telcos, OEMs, finance, mobility, and health-tech. The architecture story is credible around orchestration and partner integration, but public developer depth, formal reliability evidence, and hard trust artifacts remain materially thinner than the breadth of the product narrative.'
sections:
- id: platform-definition-and-module-map
  title: Platform definition and module map
  body: bolttech’s product story is broad but coherent. The retained official pages consistently frame the company as an orchestration layer that lets distributors, insurers, and end customers complete a full embedded-insurance workflow inside partner-owned experiences. That matters because it shifts the diligence question away from whether bolttech has a single checkout API and toward whether it has enough modules to manage real post-sale operations. The product map visible in public sources spans device OEM propositions, telco lifecycle services, financial-services journeys, mobility and EV insurance, health-tech coverage aligned to longer device cycles, and insurer-facing data and distribution tools. The Unified API and integrations pages reinforce that breadth by showing bolttech as a multi-line platform rather than a point solution. The strongest public differentiation is the way the company connects underwriting supply, distribution surfaces, servicing, repair, and lifecycle management.
    The weakest point is that many modules are described persuasively in official copy but remain thinly validated by public operator-level documentation.
