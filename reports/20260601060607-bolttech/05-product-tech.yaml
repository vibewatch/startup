  - Status
  - Scope
  - Evidence
  - Gap
  rows:
  - - OAuth 2.0 and JWT-based security
    - Present
    - Unified API integration layer
    - API docs explicitly name OAuth 2.0, JWT tokens, encrypted payloads, and access controls
    - No public pen-test or certification artifact in retained sources.
  - - Privacy disclosure and web vendors
    - Present
    - Site-level data collection and quote flow disclosures
    - US privacy notice names data uses and vendors including Cloudflare, Netlify, and Google Analytics
    - No retained public trust-center or region-by-region data-governance map.
  - - Repair-network quality controls
    - Present but indirect
    - Post-sale device and electronics servicing
    - Platform page says repairs use trusted professionals and high service standards
    - No public repair-network SLA, failure-rate, or audit disclosure.
  - - Licensed and compliance infrastructure
    - Partner-evidenced
    - Regulated embedded-distribution programs
    - Customer proofs repeatedly say bolttech supports compliant launches and licensing infrastructure
    - No retained master register tying licenses to each market and use case.
  - - Public assurance artifacts
    - Thin
    - External diligence surface
    - Retained sources show privacy copy and API security detail
    - No public status page, certification list, or formal SLA surfaced in this chapter’s evidence set.
  notes: Statuses reflect what could be validated publicly from retained materials. Missing public assurance artifacts are treated as diligence gaps rather than assumptions of absence inside the company.
