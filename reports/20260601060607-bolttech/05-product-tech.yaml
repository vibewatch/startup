  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public assurance artifacts
    missingEvidence: A public trust-center, status page, certification list, or formal SLA that covers the platform and servicing stack.
    whyItMatters: The current public trust surface validates a product narrative but not the operational assurances that enterprise distributors and insurers will care about.
    diligencePath: Request trust-center exports, uptime commitments, certification scope, and any incident-response summaries by market and platform component.
    relatedQuestionRefs:
    - QE028
    - QE029
  - type: missing-source
    severity: material
    topic: developer-signal depth
    missingEvidence: Public SDK docs, changelog, sandbox references, or measurable external developer activity tied to bolttech’s APIs and integrations.
    whyItMatters: A thin public developer surface makes it harder to assess integration complexity, release cadence, and partner self-service readiness.
    diligencePath: Request developer-portal screenshots, API changelogs, sandbox access, and partner implementation guides that can be reviewed under NDA.
    relatedQuestionRefs:
    - QE010
    - QE030
  - type: private-evidence-only
    severity: material
    topic: module adoption and attach rates
    missingEvidence: Module-level production counts, attach rates, and partner adoption splits across telco, OEM, finance, and mobility programs.
    whyItMatters: Public sources prove breadth, but not which modules actually drive durable usage and revenue versus launch theater.
    diligencePath: Ask management for current partner counts, live-program counts, and usage or revenue contribution by module and vertical.
    relatedQuestionRefs:
    - QE017
    - QE024
  - type: missing-source
    severity: minor
    topic: public certifications and compliance mapping
    missingEvidence: Named certifications, audit standards, or region-by-region licensing and compliance maps tied to the platform.
    whyItMatters: Formal assurance signals would materially strengthen the external trust story for regulated insurance-distribution workflows.
    diligencePath: Request a certification matrix and licensing map that tie product surfaces to entities, markets, and responsible operating teams.
    relatedQuestionRefs:
    - QE025
    - QE029
  - type: conflicting-data
    severity: minor
    topic: security incident disposition
    missingEvidence: A company statement confirming or refuting the Cybernews-reported ransomware allegation and its operational impact.
    whyItMatters: Even an unconfirmed allegation can affect partner trust and security diligence if the incident-response record is unclear.
    diligencePath: Ask for incident chronology, internal findings, regulator or partner notifications, and remediation actions if any event occurred.
    relatedQuestionRefs:
    - QE021
