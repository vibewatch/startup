tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Digital insurance platform
    - Distribution partners and insurers
    - Core / broadly evidenced
    - Owns end-to-end orchestration beyond checkout alone
    - Need module-level production-usage data by partner type.
  - - Servicing & claims portal
    - Claims teams and end customers
    - Core / publicly described
    - White-label post-sale experience with predictive intake and service routing
    - Need external proof of SLA, uptime, and claims-resolution quality.
  - - Unified API + integration layer
    - Developers and integration teams
    - Core / technically evidenced
    - Structured lifecycle APIs plus AMS/CRM integration story
    - Need richer public SDK, changelog, and sandbox proof.
  - - Device OEM and telco propositions
    - OEM, carrier, and retail channel owners
    - Strong / publicly evidenced
    - Combines insurance with repair, upgrade, trade-in, and lifecycle services
    - Need attach-rate and renewal evidence by channel.
  - - Financial-services and insurer tools
    - Banks, lenders, insurers, and agents
    - Maturing / partner-evidenced
    - Adds analytics, quote-to-bind tooling, and distribution enablement
    - Need independent proof of underwriting or pricing lift.
  - - Mobility and EV workflows
    - OEMs, dealers, and auto lenders
    - Maturing / launch-heavy
    - Embeds protection into purchase and finance journeys with EV-specific benefits
    - Need proof of scaled live programs beyond new-launch announcements.
  - - Health-tech and extended-cycle cover
    - Health-device distributors and OEMs
    - Targeted / narrower proof
    - Aligns cover duration to device and reimbursement cycles
    - Need named customer references outside company-authored copy.
  notes: Maturity labels reflect the depth of retained public evidence, not an internal vendor roadmap. The table separates broad platform capabilities from narrower vertical propositions.
