tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - status-quo substitute
  - relevance
  rows:
  - - Telco protection
    - Device, travel, cyber, smart-home, and lifecycle protection embedded in telco journeys
    - Core connectivity ARPU, generic care plans without embedded insurance, and unrelated SaaS tools
    - Product or commercial lead; end consumer often pays via bill or checkout
    - DIY add-ons, referrals, or no protection offer
    - One of bolttech’s clearest priority verticals and a useful template for bundled protection.
  - - Device OEM and retail electronics
    - Protection sold with hardware purchases, rentals, trade-ins, and circularity programmes
    - Pure hardware margin or financing economics without protection
    - Digital commerce, after-sales, or channel owner; end customer pays
    - Standalone warranty providers or no add-on
    - Important because electronics protection is currently the largest market line.
  - - Mobility and automotive
    - Insurance embedded in vehicle purchase, financing, subscription, or ownership workflows
    - Generic auto premium pools outside contextual journeys
    - OEM, lender, or dealer sponsor; customer pays or financing bundle pays
    - Independent broker, dealership F&I, or build in-house
    - Fast-growing segment tied to EVs, telematics, and finance integration.
  - - Financial services and aggregators
    - Insurance inside banking, lending, card, wealth, or comparison-platform experiences
    - General banking revenue unrelated to embedded protection
    - Product or distribution owner; payer may be customer or bundled programme
    - Referral links, traditional broker handoff, or static marketplace
    - Important because trust, KYC, and billing rails lower launch friction.
  - - Carrier and broker enablement
    - Insurance distribution platforms for insurers, brokers, and MGAs inside partner workflows
    - Full carrier balance-sheet premium not generated through embedded channels
    - Insurer digital, channel, or operations owner
    - Fragmented agent systems or manual quoting stacks
    - Useful because some case studies show insurer and broker adoption, not just non-insurance partners.
  - - Broad global insurance market
    - Only the contextual distribution slice where cover is embedded at point of need
    - All non-contextual insurance distribution and unrelated software categories
    - Varies
    - Traditional agents, direct carrier websites, and aggregators
    - Too broad to use as bolttech’s actual serviceable market.
  notes: 'Boundary logic is workflow-based: included spend requires contextual distribution inside another journey, while excluded spend sits outside that embedded distribution shell.'
