company:
  name: Bolttech
chapter:
  number: 2
  title: Market Analysis
  summary: 'bolttech operates in a broad but definition-sensitive embedded-insurance market where protection is distributed contextually inside partner journeys rather than through standalone insurer acquisition. The public evidence supports large global TAMs but not a single canonical number: major publishers put the 2025 market anywhere from about US$13.9 billion to US$145.2 billion, while bolttech’s Mobile World Live whitepaper cites US$156 billion in 2024 and US$703 billion by 2029. The better underwriting lens is therefore a serviceable market concentrated in digitizable partner channels such as telco, device OEM, mobility, financial services, and retail, with adoption governed by integration speed, compliance complexity, and proof that attach rates can offset buyer friction.'
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitute stacks
  body: 'The first discipline in valuing bolttech’s market is to define what counts. Embedded insurance is not simply all insurance sold online, and it is not the full premium pool of every carrier participating in digital distribution. The retained analyst sources converge on a narrower idea: insurance offered contextually inside another product, service, or purchase journey and delivered through APIs or digital platform integrations. bolttech’s own vertical pages make that definition concrete. The company sells into telcos, device OEMs, mobility OEMs, financial institutions, retailers, brokers, and other partner channels where protection is attached to an existing customer moment. That means included spend covers distribution orchestration, policy offer placement, quote/bind flows, and related lifecycle servicing inside those partner journeys. Excluded spend includes generic CRM or admin software, carrier balance-sheet premiums not generated through contextual channels, and adjacent fintech
    or after-sales services that are not themselves embedded protection. In practice, bolttech usually competes against substitute stacks rather than one discrete rival: a telco can do nothing, build internally, or buy a narrower vendor stack; an OEM can stay with finance-only or warranty-only add-ons; a bank can keep referrals or static broker links instead of a fully embedded journey.'
