      - number: '7.4'
        title: 财务模型不透明与执行风险
        blocks:
          - type: paragraph
            body: >-
              最新 Series C 交割和公司的战略伙伴给了 bolttech 真实融资可信度，但公开披露仍在运营规模和可投资经济性之间留下巨大空洞。公司突出报价保费、伙伴、市场、产品和员工数，而 TechCrunch
              观察到，尽管伙伴和保险公司数量没有明显加速，报价保费仍在增长。如果抽佣率和量的质量正在改善，这个模式可能是正面的；但公开证据没有展示经审计收入、毛利率、留存、风险转移或集中度。Cybernews
              文章甚至引用了一个大致年收入数字，但 bolttech 自身没有验证；它可作为信号，却不能作为承保基础。执行风险叠在这种不透明之上。bolttech 显然能够快速上线并带来转化改善，但要把这个模式扩展到 39
              个市场和多种伙伴类型，人员、控制和产品架构必须与销售野心同步成熟。因此，投资者应把风险登记表当作监控计划：如果授权、网络安全控制、服务 SLA
              或单位经济性证据没有改善，即使市场背景有吸引力，投资逻辑也会快速破裂。
