  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入桥
        - 2025 年收入、毛利率、抽佣率，以及报价保费到收入确认的桥。
        - 这是承保当前估值最核心的缺失文件。
        - 财务团队和审计师材料。
      - - 留存与集中度
        - 当前业务的 NRR、GRR、流失、附加率、头部合作伙伴集中度和头部市场集中度。
        - 用来判断规模是有粘性，还是只是铺得广。
        - CFO 与商业运营。
      - - 风险转移与理赔经济性
        - 承保公司合同、保留风险敞口、风险转移、理赔成本负担和欺诈损失率。
        - 决定 bolttech 应拿类软件倍数还是类保险倍数。
        - 保险或精算负责人。
      - - 网络安全补救
        - 外部取证发现、董事会备忘录、保险公司通知，以及据报事件后的控制升级。
        - 估值和合作伙伴信任的关键下行压力。
        - CISO、GC 与外部律师。
      - - 权限矩阵
        - 按核心市场拆分的实体、牌照和指定代表映射表。
        - 验证增长能否在当前版图内合法延续。
        - 总法律顾问与合规负责人。
      - - 股权结构表与优先股堆叠
        - 清算优先权、优先级、附函，以及本轮任何结构化投资者权利。
        - 即使名义估值不变，也会影响真实下行保护和普通股结果。
        - CFO 与牵头律师。
    notes: 这些索取项是把公司从“有意思”推进到能按最新轮次附近承保所需的最低文件集。
    claimRefs:
      - CV030
      - CV036
      - CV041
