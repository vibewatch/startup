            body: >-
              法律和监管敞口结构性偏高，因为 bolttech 是跨境分销和服务平台，而不是单一市场软件供应商。公司自己的材料强调广泛足迹，英国文件则显示多个运营实体，以及 2025 年一次重组：其中一家保险服务子公司由
