        title: 重点证据
        blocks:
          - type: callout
            title: 最高尽调优先级：先清理网络安全和隐私堆栈，而不只是增长故事
            body: bolttech 的伙伴动能真实存在，但广泛数据共享、敏感保单工作流和已报道勒索软件指控叠加在一起，意味着安全与隐私证据重估整轮融资的速度，可能快于另一则伙伴公告向上重估它的速度。
