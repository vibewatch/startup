      - number: '8.2'
        title: 市场背景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              估值讨论必须拆成两个问题：bolttech
              是否处在有吸引力的市场，以及公开证据是否足以让投资者今天有信心定价。市场吸引力的答案是肯定的。独立报告都描述嵌入式保险快速增长，即使它们对绝对市场规模的判断差异很大。这支撑了战略重要性，也提醒投资者不要把单张
              TAM 幻灯片当作估值证据。更好的锚点是可比公司组。Lemonade 按高增长溢价倍数交易，Root 按受压或保险属性倍数交易，Assurant 是规模化在位者，在设备保护上有明显关联，但市值 /
              收入低得多。bolttech 的 $2.1 billion
              估值落在这些端点之间。这个位置并非明显错误，但高度取决于尽调揭示的实际净收入、利润率结构、合作伙伴集中度以及任何保留保险风险。换句话说，只有在一套具体的经济质量投资逻辑下，这个价格才说得通；不能因为大型保险公司和战略方投了，就自动证明估值合理。
