      - number: '1.2'
        title: 创始人领导力、运营班底与治理透明度
        blocks:
          - type: paragraph
            body: >-
              创始人故事在 CEO 层面证据充分，但往下只得到部分印证。保留的官方和第三方领导层来源一致指向 Rob Schimek 为创始人兼集团首席执行官。最强的背景来源梳理了他的履历：先在 Deloitte 近 20
              年，之后在 AIG 担任高级管理职务。这让 bolttech 拥有一位兼具公共会计纪律和全球保险运营经验的领导者。2026 年官方领导层内容也继续把 Schimek
              放在公司公开战略叙事中心，强化了有意义的关键人物集中度。治理透明度更弱。本次保留的公开资料包支持其围绕金融包容、电子废弃物减量和公司治理的 ESG 表述，但没有给出当前董事会名单、独立董事名单，也没有清晰呈现
              Series C 后投资者治理权利。合理结论是：管理层可信度和行业匹配度有较好支撑，但正式治理独立性仍是尽调缺口，而非已验证优势。
