      - number: '6.3'
        title: 持久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开客户故事强在扩张触面，弱在续约经济性。落地后扩张的逻辑很清楚：伙伴可以从一条保险线或一个设备保障项目开始，再增加更多产品、渠道、品牌或售后服务。Erajaya、Globe 和 MasOrange
              各自展示了这个模式的不同版本。Sumitomo 的战略逻辑和 Series C 报道又给出另一条信号：bolttech
              仍在投资扩大设备生命周期、伙伴和市场覆盖，而不是公开报告成熟稳定账本。但同一批来源留下了重大空洞。没有披露 NRR、GRR、流失、合同期限或头部客户收入敞口。因此，logo
              宽度不应与持久经济性混为一谈。公开客户证据也并非完全独立；其中很多是由 bolttech 或伙伴撰写的案例研究或上线公告。最后，Cybernews
              未解决的勒索软件指控引入了信任风险，即使后续被证伪，也可能影响未来伙伴尽调。本章结论因此是：采用和可背书性正面，但续约、客户集中度和伙伴依赖仍需直接尽调确认。新加坡本地代理触面和电信白皮书摘要又补充了一层细节：bolttech
              不只是赢下一类客户。它把同一套伙伴优先打法打包给代理、银行、金融科技公司和电信运营商，同时依赖这些伙伴在上线后继续维系客户关系。这创造了扩张可选性，但也意味着尽调应测试有多少账户真正加深为多年关系，而不是停留在上线
              logo 或试点规模引用。
