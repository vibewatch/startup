  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 网络安全补救未过关
        - 没有外部取证摘要、没有明确客户通知记录，或出现新的反向事实。
        - 直接压缩信任和倍数支撑。
        - 将项目转为回避，或要求大幅重置价格。
      - - 经济性更像中介
        - 抽佣率、毛利率或保留风险画像无法支撑类软件经济性。
        - 溢价倍数投资逻辑坍塌。
        - 按更接近 Assurant 或 Root 的区间重新承保，而非按偏软件可比公司。
      - - 合作伙伴集中度高
        - 头部合作伙伴或市场主导收入，续约保护薄弱。
        - 把客户名单覆盖广的故事变成单点依赖。
        - 降低仓位，或坚持结构性保护和折价。
      - - 权限栈不完整
        - 重要市场缺乏明确授权或实体清晰度。
        - 产生法律风险，足以推翻市场进入假设。
        - 暂停流程，直到法律尽调完成。
      - - 近期上线未变现
        - BYD、MediaMarkt 或其他 2026 年上线项目未显示附加、续保或经济性进展。
        - 乐观情景失去运营催化。
        - 先按兵不动并跟踪，不要现在追价。
    notes: 这些是应该改变价格的下行触发项，不只是听起来不舒服的标题风险。
    claimRefs:
