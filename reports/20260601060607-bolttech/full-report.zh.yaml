  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              bolttech
              有足够公开证据值得认真研究，但在补完尽调前，还不足以支撑投资者按最近一轮价格写出干净的投资备忘录。最强的正面信号是：近期融资仍保持溢价估值，战略投资者同时希望建立商业关系，公司也能在汽车、零售、电信和贷款关联渠道落地真实合作项目。最薄弱的是财务披露。公开材料强调报价保费、合作伙伴广度和市场覆盖，却基本没有说明收入质量、抽佣率（take
              rate）、毛利率、留存和优先股结构。这一错配很关键：当前估值在部分情景下可以守住，但前提是 bolttech
              更像软件赋能的编排层，而不是薄利中介或承担风险的运营方。鉴于不确定性，纪律性结论是继续研究，而不是买入。若尽调补上经济性缺口并清除网络安全阴影，公司可以投；但举证责任在管理层，不在公开市场背景。
