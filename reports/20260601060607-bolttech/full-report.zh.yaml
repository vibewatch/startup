  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 改变判断的证据
    rows:
      - - 战略投资者叠加商业合资，说明平台解决了真实分销问题。
        - 需要已签里程碑时间表，并证明战略关系能转化为经常性经济收益，而不只是公关价值。
      - - 汽车、零售、贷款和电信的近期上线，意味着渠道可选性很宽。
        - 需要队列级附加、续保和服务成本数据，证明这些上线能赚钱。
      - - 独立市场研究支持嵌入式保险长期强劲增长。
        - 承认 TAM 分歧很大，因此仅靠市场规模不能支撑高价。
      - - 若 bolttech 确实偏软件，公开可比公司仍留出高于在位企业倍数的空间。
        - 需要经审计收入、毛利率和抽佣率证明，才能判断 bolttech 落在可比区间的哪一端。
      - - 反向逻辑是，公开规模指标夸大了可持续盈利能力。
        - 如果尽调证明留存高、保留风险敞口有限、合作伙伴集中度低，这一判断会缓和。
      - - 网络安全指控和法律实体披露不完整，会强化反向逻辑。
        - 无重大瑕疵的补救材料包和权限矩阵将显著提升信心。
    notes: 这些论点被写成会随价格和尽调变化的投资主张，而非静态公司属性。
