      - number: '2.3'
        title: 重点渠道里的买方、用户与付款方动作
        blocks:
          - type: paragraph
            body: >-
              嵌入式保险的买方动作是跨职能、按垂直领域变化的。在电信场景，最初赞助人通常是承受 ARPU 多元化和降低流失压力的产品或商务负责人，但技术、合规和客户服务团队同样关键，因为保障会嵌入计费、理赔和服务旅程。在设备
              OEM
              和出行场景，买方往往是售后、金融或数字商务负责人，希望扩大附加率和客户终身价值，同时不损害核心购买体验。在金融服务场景，赞助人可能位于产品、分销或财富建议领导层，而法务和风险团队会把关上线质量。实际终端用户是购买受保障设备、车辆、旅行或金融产品的消费者；付款方可以是同一消费者、打包订阅方案，某些情况下也可以是为提高转化或忠诚度而补贴保障的平台。公开案例研究说明这些动作为何重要。Taiwan
              Mobile、JKOPay、MasOrange 和 MoneyHero 都把上线锚定在高频数字生态内，那里已经有 KYC、计费轨道或比价流量。因此，bolttech 的实际 SAM 小于全球 TAM
              标题数字：公司需要可数字化的伙伴旅程、足够支撑上线的合规准备，以及能够用转化或留存收益为增量集成工作辩护的买方。
