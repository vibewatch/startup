chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品边界与当前规模信号
        blocks:
          - type: paragraph
            body: >-
              bolttech 的公开身份不是资产负债表型保险公司，而是一家技术驱动的嵌入式保险基础设施公司。官网首页和 “Who We Are” 页面反复把业务描述为连接保险公司、分销方和客户的生态系统；集成页面和 API
              文档则显示，产品触面从报价生成、核验延伸到合约管理、理赔周边服务和第三方系统集成。这个定位很关键：它解释了公司为何有可能跨多个垂直领域和地区运营，而不必自己承担全部承保风险。当前最强的规模信号仍来自公司口径，但足够具体，可以支撑后续尽调：覆盖四大洲
              39 个市场、700 多家分销伙伴、250 多家保险公司、7,000 多个产品、2,000 多名团队成员，年报价保费超过 US$85 billion。2025
              年中第三方报道大体印证了伙伴、保险公司和产品数量，也显示这些数字是逐步增长而来，并非 2026 年营销文案里突然出现。
