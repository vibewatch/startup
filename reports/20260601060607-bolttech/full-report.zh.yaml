  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值状态
      - 参考价值
      - 局限
    rows:
      - - bolttech（最新轮次）
        - $2.1B 私募估值
        - 当前参考估值；只有 Cybernews 的 $1.5B 数据方向上成立时，才隐含约 1.4x 收入倍数
        - 标的公司本身，具备新近价格发现和战略投资者
        - 未公开经审计收入、利润率或优先股堆叠披露。
      - - Lemonade
        - $4.45B 市值 / $0.84B TTM 收入
        - ~5.3x 市值 / 收入
        - 保险科技高端增长倍数，并可映射公开市场情绪
        - 面向消费者的承保公司模式，并非直接可比的 B2B2C 编排模式。
      - - Root
        - $0.82B 市值 / $1.56B TTM 收入
        - ~0.53x 市值 / 收入，~0.27x EV/sales
        - 公开市场约束下的保险科技低端倍数
        - 汽车保险承保敞口让其结构上不同于 bolttech。
      - - Assurant
        - $12.33B 市值 / $12.4B 收入
        - ~1.0x 市值 / 收入
        - 规模化在位企业，具备设备保护和 B2B2C 渠道敞口
        - 规模和多元化程度远高于 bolttech，因此增长上行不能直接可比。
    notes: 倍数是使用公开市值和收入数据得到的大致映射；加入 bolttech 这一行，是为了展示私募估值落在可比区间的什么位置，而不是把公司与自己作比较的捷径。
