      - number: '1.3'
        title: 融资历史、投资者基础与战略资本含义
        blocks:
          - type: paragraph
            body: >-
              bolttech 的融资历史最好锚定在两步完成的 Series C。2024 年 12 月首轮交割由官方宣布为 Dragon Funds 领投，预期金额超过 US$100 million，估值 US$2.1
              billion；Baillie Gifford 和 Generali 旗下 Lion River 也被列为参与方。2025 年 6 月最终交割又加入 Sumitomo Corporation 和 Iberis
              Capital，使本轮总额达到 US$147 million，同时维持 US$2.1 billion 估值。TechCrunch、Fintech Singapore、Coverager 和 FinTech
              Global 的独立报道与这些标记大体一致，足以把轮次规模和估值视为可靠的公开事实。更重要的是，投资者组合并非纯财务资本。Sumitomo 将投资与面向亚洲的合资公司绑定；Generali 和 Europ
              Assistance 也另行描述了在欧洲开展多产品嵌入式保险合作。这说明资本结构同时也是商业分销楔子。仍缺失的是完全摊薄股权结构表、任何老股流动性细节，以及这些战略投资者加入辛迪加后的具体治理影响。
