      - CR023
      - CR042
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: bolttech 的主要风险沿信任、上线节奏和承保经济性传导，而不是压在单一产品 SKU 上。
    data:
      nodes:
        - id: R1
          label: 授权或隐私缺口
          detail: 尽调发现许可、同意或供应商治理弱点。
          tone: risk
        - id: R2
          label: 上线延迟 / 渠道暂停
          detail: 问题整改期间，合作伙伴铺开或市场激活放慢。
          tone: risk
        - id: R3
          label: 附加购买与转化走低
          detail: 消费者或合作伙伴端摩擦拉低从报价到出单的表现。
          tone: risk
        - id: R4
          label: 报价保费增长低于计划
          detail: 量仍在增长，但低于融资叙事中的预期。
          tone: risk
        - id: R5
          label: 净经济性承压
          detail: 抽佣率、利润率或合作伙伴支持成本恶化。
          tone: risk
        - id: R6
          label: 融资议价能力减弱
          detail: 下一轮或老股交易的定价能力被压缩。
          tone: risk
        - id: R7
          label: 网络安全事件 / 理赔欺诈信号
          detail: 安全事件或保单数据滥用削弱信任。
          tone: risk
        - id: R8
          label: 合作伙伴信任重置
          detail: 锚定分销商或保险公司要求更严控制，或推迟上线。
          tone: risk
        - id: R9
          label: 估值下调重置
          detail: $2.1B 参考价在新资本面前不再站得住。
          tone: risk
      edges:
        - from: R1
          to: R2
          label: 合规工作拖慢上线
        - from: R2
          to: R3
          label: 渠道活动减少
        - from: R3
          to: R4
          label: 项目产出走弱
        - from: R4
          to: R5
          label: 经营杠杆不及预期
        - from: R5
          to: R6
          label: 融资逻辑变弱
        - from: R6
          to: R9
          label: 定价被压缩
        - from: R7
          to: R8
          label: 信任与服务顾虑
        - from: R8
          to: R3
          label: 合作伙伴放慢销售
        - from: R7
          to: R9
          label: 倍数直接压缩
    claimRefs:
      - CR009
      - CR011
      - CR019
      - CR023
      - CR026
      - CR028
      - CR041
      - CR042
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 平台卡在保险公司、分销商、数据源、服务运营和监管者中间；任一节点变弱，都会向外传导。
    data:
      nodes:
        - id: D1
          label: bolttech 平台
          detail: 核心编排、服务和集成层。
          tone: neutral
        - id: D2
          label: 保险公司 / 承保能力提供方
          detail: 保险承保方的承保能力与产品可得性。
          tone: risk
        - id: D3
          label: 分销商 / OEM / 零售商 / 电信运营商
          detail: 获客渠道和铺开执行。
          tone: risk
        - id: D4
          label: 理赔 / 维修 / 联络中心网络
          detail: 售后体验和 SLA 交付。
          tone: risk
        - id: D5
          label: 数据与身份信号
          detail: 用于定价和服务决策的车辆、设备、客户和欺诈输入。
          tone: risk
        - id: D6
          label: 监管机构与法律实体
          detail: 各市场的许可、隐私和行为义务。
          tone: risk
        - id: D7
          label: 资本提供方
          detail: 战略投资者和未来融资市场。
          tone: neutral
        - id: D8
          label: 终端客户
          detail: 附加购买、理赔行为、留存和投诉。
          tone: neutral
      edges:
        - from: D2
          to: D1
          label: 产品和定价
        - from: D3
          to: D1
          label: 分销需求
        - from: D1
          to: D4
          label: 理赔和服务工作流
        - from: D5
          to: D1
          label: 风险和履约数据
        - from: D6
          to: D1
          label: 许可和行为规则
        - from: D7
          to: D1
          label: 融资和战略压力
        - from: D1
          to: D8
          label: 嵌入式购买与服务体验
        - from: D8
          to: D3
          label: 转化和留存反馈
    claimRefs:
      - CR002
      - CR023
      - CR024
      - CR025
      - CR026
      - CR029
      - CR034
      - CR036
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资判断取决于：强战略与市场证据，能否通过经济性缺口和网络安全两项测试。
    data:
      nodes:
        - id: A
          label: 最新 $2.1B 融资轮
          detail: 公司按溢价私募估值拿到了真实资本。
          tone: positive
        - id: B
          label: 规模与合作伙伴证明
          detail: 700+ 家合作伙伴、39 个市场和已上线渠道，说明它有市场位置。
          tone: positive
        - id: C
          label: 可比公司区间分化
          detail: 公开可比映射从 Root 式到 Lemonade 式倍数都有。
          tone: neutral
        - id: D
          label: 经济性披露测试
          detail: 经审计收入、利润率、留存和集中度仍未公开。
          tone: risk
        - id: E
          label: 网络安全 / 合规测试
          detail: 网络安全指控和许可工作仍可能重置信心。
          tone: risk
        - id: F
          label: 继续研究 / 偏高
          detail: 以现有公开记录，按上一轮价格还不足以明确买入。
          tone: risk
      edges:
        - from: A
          to: B
          label: 证实外部需求
        - from: B
          to: C
          label: 支撑上行空间
        - from: C
          to: D
          label: 需要经济性证明
        - from: D
          to: E
          label: 还必须通过控制测试
        - from: E
          to: F
          label: 在此之前
    claimRefs:
      - CV002
      - CV006
      - CV028
      - CV030
      - CV031
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: bolttech 的公允价值高度取决于投资者把它按传统保险公司、中介还是软件公司的经济性来定价。
    data:
      items:
        - label: Root 式下行情景
          value: 0.9
          detail: 如果经济性更像低利润率保险敞口，且公开市场谨慎情绪占上风，可比映射会很苛刻。
          tone: risk
        - label: Assurant 式传统公司区间
          value: 1.4
          detail: 如果 bolttech 足够耐久但不像软件公司，收入倍数大致会落在传统公司区间。
          tone: neutral
        - label: 基准定价情景
          value: 1.8
          detail: 需要收入质量过关，且保留风险敞口有限。
          tone: neutral
        - label: 当前轮参考价
          value: 2.1
          detail: 最新价格发现已经出现，但公开经济性数据尚未完全验证。
          tone: neutral
        - label: 乐观定价情景
          value: 2.8
          detail: 需要软件式抽佣率、强留存，并把 2026 年上线项目转成经常性经济性。
          tone: positive
    claimRefs:
      - CV028
      - CV029
      - CV037
      - CV041
      - CV042
      - CV043
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据给出的区间很宽，因为缺失的收入质量和控制数据仍可能大幅移动公允价值带。
    data:
      items:
        - label: 悲观
          low: 0.9
          mid: 1.1
          high: 1.4
          displayValue: $0.9B-$1.4B
          detail: 网络安全、许可或经济性尽调不及预期，公开可比压力占上风。
          tone: risk
        - label: 基准
          low: 1.5
          mid: 1.8
          high: 2.1
          displayValue: $1.5B-$2.1B
          detail: 尽调通过主要风险项，但经济性只是好，不是顶级。
          tone: neutral
        - label: 乐观
          low: 2.4
          mid: 2.8
          high: 3.2
          displayValue: $2.4B-$3.2B
          detail: 管理层证明软件式利润率、干净控制，以及上线项目能变现。
          tone: positive
        - label: 优先进入区间
          low: 1.4
          mid: 1.6
          high: 1.9
          displayValue: $1.4B-$1.9B
          detail: 在这个区间，投资者能因当前披露缺口获得更好补偿。
          tone: positive
    claimRefs:
      - CV029
      - CV037
      - CV041
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 这些指标能把 bolttech 从一个有意思的成长故事，推向可定价的投资案例。
    data:
      items:
        - label: 上一轮
          value: $2.1B
          detail: 2025 年设定的最新私募估值。
          tone: neutral
        - label: 报价保费
          value: $85B+
          detail: 规模代理指标很大，但不能替代净收入。
          tone: positive
        - label: 合作伙伴广度
          value: 700+
          detail: 分销覆盖面强，但集中度未披露。
          tone: positive
        - label: 保险公司广度
          value: 250+
          detail: 承保能力覆盖广是加分项，但承保经济性仍关键。
          tone: positive
        - label: 公开可比区间
          value: 0.27x to 5.3x
          detail: 公开可比映射区间很宽，取决于业务质量和市场情绪。
          tone: neutral
        - label: 缺失的经济性证明
          value: Revenue / GM / NRR undisclosed
          detail: 支付溢价前最重要的尽调卡点。
          tone: risk
        - label: 网络安全阴影
          value: Unresolved publicly
          detail: 整改证据披露前，这是明确的下行触发点。
          tone: risk
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV028
      - CV030
      - CV031
      - CV044
