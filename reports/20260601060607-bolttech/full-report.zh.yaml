      - number: '8.3'
        title: 乐观、基准、悲观区间与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              关键经济输入缺失，公开记录因此支撑的是一个很宽的估值区间。乐观情景要成立，近期合作伙伴动能必须转化为经常性收入、软件式抽佣率、高质量续约，以及很低的保留风险外溢。在这种结果下，bolttech
              仍可能长进当前估值，甚至超过当前估值。基准情景更保守：只有尽调确认健康净收入、受控服务经济性和干净的网络安全整改证据，轮次价格才站得住。悲观情景很直接。如果网络安全指控比当前记录更严重，如果关键上线停滞，如果业务利润率比投资者预期更薄，或者法律实体和许可复杂度拖慢合作伙伴激活，公开可比区间就指向更低估值。因此，投资者应把当前估值当作谈判参照，而不是公允价值事实。在管理层披露硬经济性之前，场景化承销框架是评估这个机会的唯一稳妥方式。
