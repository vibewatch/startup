    type: matrix
    layout: wide
    summary: 残余风险最高的是法律监管、网络安全和合作伙伴依赖，不是普通市场推进波动。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
      rows:
        - label: 高可能性
          values:
            - label: 本地上线摩擦
              tone: neutral
              detail: 逐市场铺开时，常见的延期并不意外，也可管理。
            - label: 集成债 / 服务负载
              tone: risk
              detail: 产品和系统跨度大，执行质量必须持续盯住。
            - label: 隐私治理负担
              tone: risk
              detail: 模式高度依赖数据共享，合规会长期压着高影响风险。
        - label: 中等可能性
          values:
            - label: 案例指标无法外推
              tone: neutral
              detail: 公开证明未必代表全部合作伙伴。
            - label: 尽调暴露合作伙伴集中度
              tone: risk
              detail: 如果经济性集中在少数大客户，大型交易对手会变成卡口依赖。
            - label: 网络安全事件坐实为重大
              tone: risk
              detail: 如果据报道的勒索软件事件对应真实客户数据损失，冲击会立刻出现。
        - label: 低可能性
          values:
            - label: 常规试点表现不及预期
              tone: positive
              detail: 单个试点失手，不一定打破公司整体叙事。
            - label: JV 或框架重置
              tone: neutral
              detail: 单一合作关系重置会伤情绪，但不一定伤到平台本身。
            - label: 授权缺口或正式执法
              tone: risk
              detail: 尽管基准概率较低，一旦发现牌照漏洞或执法行动，投资逻辑会被打穿。
