        title: 风险排序与投资逻辑破裂框架
        blocks:
          - type: paragraph
            body: >-
              公开记录支持对 bolttech 风险堆栈做清晰排序。第一类是法律、监管和隐私风险：公司横跨 39
              个市场运营，大量使用客户和报价数据，并披露会与保险公司、政府机构、服务提供商和广告伙伴共享数据。第二类是运营和网络安全风险，因为这个模式依赖单一集成层、理赔服务、维修物流，以及对敏感保单和客户数据的持续处理。第三类是伙伴和上线依赖：公司最强的增长验证很多来自
              OEM、电信、零售、贷款机构和承保方合作，这些都不完全在 bolttech
              控制之内。第四类是财务模型不透明，因为公开材料更强调报价保费和足迹，而不是经审计收入、抽佣率或利润率。第五类是执行风险，因为公司试图同时跨许多产品、渠道和司法辖区扩张合规负担重的上线。合理的承保姿态不是直接否定这个故事，而是在把最新估值视为持久之前，要求对授权、网络安全补救、经济性和伙伴集中度做直接尽调。
