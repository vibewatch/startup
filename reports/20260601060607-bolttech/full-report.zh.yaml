      - number: '2.2'
        title: TAM、SAM 与相互矛盾的规模口径
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数据足以证明品类相关性，但不够一致，无法支撑单一精确数字。Grand View 和 Fortune 都把 2025 年嵌入式保险市场放在约 US$144-145 billion，而 Mordor 的
              2025 年估计仅为 US$13.88 billion，2026 年估计为 US$18.09 billion。bolttech 与 Mobile World Live 的白皮书又使用另一条轨迹，引用 2024 年
              US$156 billion、2029 年 US$703 billion。这些不是四舍五入差异，而是意味着市场边界、纳入规则和发布方方法论存在实质差别。细分和地域拆分比绝对 TAM 更有方向性价值。Grand
              View 和 Mordor 都认为，电子产品保障是当前最大险种，数字或 API 优先渠道主导分销，电商仍是最大终端市场，而出行是增长更快的细分。地域结论更不稳定：Grand View 和 Mordor
              都把北美放在 2025 年约 36.7% 市场份额，但 Fortune 则称 Asia Pacific 在 2025 年已占
              47.6%。尽调应采用的视角因此不是“市场很大”，而是“可服务市场是可数字化伙伴渠道中的一个子集，处在快速增长的分销模式里，但广义 TAM 高度依赖定义”。
