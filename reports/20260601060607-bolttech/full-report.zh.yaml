            body: >-
              资本层面，公开记录强在融资，弱在流动性。官方公告显示，bolttech 完成两步 Series C：2024 年 12 月首轮交割超过 $100 million，2025 年 6 月以 $147 million
              收官，两次估值均为 $2.1 billion。管理层和记者称，资金用途包括平台能力投资、AI 和数据工作，以及进一步地域扩张；Sumitomo
              的合资公司指向亚洲更多设备生命周期和转售项目。这证实了外部资本获取能力和战略背书。


              但保留的公开披露仍没有集团合并现金、月度烧钱速度、现金跑道、债务工具或项目融资义务。UK Companies House
              文件提升了本地实体可见度，却解决不了集团层面的充足性问题。实际结论是，目前无法从经审计流动性判断资本是否充足，只能从新一轮融资和投资者支持推断；这比披露资产负债表或现金流量表弱得多。相比之下，公开可比公司
              Root 在 2026 年 5 月能再融资为成本更低的 $200 million 定期贷款，并授权 $75 million 回购，这凸显了 bolttech 作为私营公司可见的资产负债表证据少得多。
