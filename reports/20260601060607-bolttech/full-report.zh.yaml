    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - 合作伙伴渠道 UX 层
        - 把报价嵌入 App、网站、电话销售、门店或经销商旅程
        - 依赖合作伙伴自有前端和计费界面
        - 合作伙伴集成差，会损害转化或品牌一致性。
      - - 产品和定价编排
        - 配置产品、报价、选项和保单结构
        - 依赖保险公司供给、产品规则和各市场合规
        - 不同承保方和市场差异可能拖慢铺开速度。
      - - 统一 API 和集成层
        - 在系统之间传递发现、报价、验证、合同和服务事件
        - 依赖稳定凭证、schema 和第三方集成
        - 公开开发者证据稀疏，加重 API 可运营性尽调负担。
      - - 身份、验证和评分路径
        - 支撑身份检查、租赁评分和受保障交易流程
        - 依赖数据提供商和正确的安全配置
        - 敏感数据处理增加隐私和欺诈风险敞口。
      - - 服务、理赔和维修运营
        - 运营售后理赔、维修、服务请求和联系中心支持
        - 依赖维修网络、理赔逻辑和全渠道运营
        - 执行风险运营强度高，并且因市场而异。
      - - 分析和数据连接器
        - 把车联网、泄漏、网络安全或设备数据喂入产品和承保流程
        - 依赖合作伙伴数据权利和数据质量一致性
        - 数据质量弱，会削弱定价、个性化和理赔结果。
    notes: 该架构表把公开可见工作流综合为功能层。它是基于官方 API、集成和解决方案材料的外部重构，不是内部系统图。
