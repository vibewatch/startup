  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - 近期上线转化为规模化经常性经济收益；网络安全问题消除；经审计指标显示类软件抽佣率和强留存。
        - $2.4B-$3.2B 公允价值区间；达到或高于当前轮次的上行空间可以辩护。
        - 需要在下一轮融资周期内证明数据室材料无重大瑕疵，并拿出商业 KPI。
        - 执行仍取决于合作伙伴铺开和监管卫生。
      - - 基准
        - bolttech 证明真实规模和可接受经济性，但利润率或集中度并非顶尖。
        - $1.5B-$2.1B 区间；尽调完成后，当前估值只有在区间顶部才说得通。
        - 这是今天公开证据下最合理的路径。
        - 任何网络安全或权限意外都会迅速把情景打低。
      - - 悲观
        - 网络安全、合规或经济性证据不达预期；上线更慢；业务利润率低于预期。
        - $0.9B-$1.4B 区间；上一轮估值下调的可能性较高。
        - 如果关键文件持续关闭，或反向证据扩大，这会成为大概率情景。
        - 下轮降估值、员工士气压力和合作伙伴犹豫会互相叠加。
    notes: 这些区间是基于情景的承保判断，不是 DCF；公开收入和利润率披露不完整，区间有意拉宽。
