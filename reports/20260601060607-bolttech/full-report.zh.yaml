      - number: '8.4'
        title: 最终尽调要求与投资观点
        blocks:
          - type: paragraph
            body: >-
              剩余工作很清楚。投资者需要经审计或董事会级别的经济性披露，需要 bolttech
              在价值链中位置的清晰解释，也需要公司直接回应网络安全事件和法律实体堆栈。投资者还需要足够的合作伙伴层面证据，判断近期上线代表广泛期权价值，还是集中依赖。在这些文件打开之前，正确姿态不是追逐新一轮融资信号，而是保留选择权并坚持价格纪律。bolttech
              最有吸引力的版本，是一个软件占比高的编排平台，在不承担重大承保风险的情况下，把很大的嵌入式保险场景面变现。最不吸引人的版本，则是一个复杂、合规负担重的分销商，公开规模指标夸大了可持续盈利能力。公开证据尚不足以让投资者有信心区分两种情况。因此建议仍是继续研究，而不是回避：如果尽调通过，确实有上行空间；但在管理层证明估值背后的经济性和控制能力前，当前估值应被视为偏高。
