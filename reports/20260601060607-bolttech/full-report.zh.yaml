    rows:
      - - bolttech
        - 直接平台
        - 私营；规模由零售、电信运营商、金融和出行项目以及设备生命周期运营所表明
        - 电信运营商、设备 OEM 和零售、金融、出行、保险公司和经纪商
        - 交易平台式编排加上理赔、维修、升级和服务深度
        - 公开的合作伙伴经济性和正式鉴证材料仍然薄弱
      - - Cover Genius
        - 直接平台同业
        - 在 60+ 个国家和美国全部 50 个州持牌或获授权
        - 旅游、电商、金融科技、物流、出行、零工平台
        - 全球 XCover API，配合转化优化的捆绑
        - 公开证据在覆盖范围方面较强，但在实物售后运营方面较薄弱
      - - Qover
        - 直接平台同业
        - 在 32 个欧洲国家持牌，并在英国获 FCA 授权
        - 欧洲银行、金融科技公司、出行和其他受监管合作伙伴
        - 跨产品、国家和保险公司的平台即服务式编排
        - 相对于 bolttech 或 Cover Genius，足迹更以欧洲为中心
      - - Chubb Studio
        - 既有机构的嵌入式平台
        - Chubb 在 54 个国家和地区运营，约有 43,000 名员工
        - 需要承保机构支持的嵌入式保障的数字分销合作伙伴
        - 承保机构资产负债表、API 和 SDK 分销、AI 优化引擎
        - 中立多承保机构交易平台定位的证据较少
      - - Assurant
        - 既有服务与保障运营商
        - 上市公司，$12.81B TTM 收入，保护 325M 名消费者
        - 设备 OEM、运营商、零售商、汽车、家居和其他 B2B2C 项目
        - 设备保障、维修和服务规模，嵌入客户工作流
        - 服务更重的模式对纯开放编排用例可能不够灵活
      - - Lemonade
        - 相邻替代品
        - 3.14M 名客户，$0.84B TTM 收入，$4.45B 市值
        - 直接面向消费者的财产、汽车、宠物和寿险买家
        - AI 原生消费者保险公司，具备可见的公开增长指标
        - 不是面向第三方品牌的中立多保险公司编排层
      - - Root
        - 相邻替代品
        - $1.56B TTM 收入，1,256 名员工，$823.92M 市值
        - 汽车保险和车辆购买生态系统
        - 具备 API 和车辆购买触点的直接数字承保机构
        - 险种集中和自有账簿模式使其比 bolttech 的多垂直领域主张更窄
