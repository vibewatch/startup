  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 现状替代方案
      - 为何重要
    rows:
      - - 电信保护
        - 嵌入电信流程的设备、旅行、网络、智能家居和生命周期保护
        - 核心连接 ARPU、没有嵌入保险的普通关怀计划，以及无关 SaaS 工具
        - 产品或商业负责人；终端消费者通常通过账单或结账付款
        - 自助附加服务、转介，或不提供保护
        - bolttech 最清晰的重点垂直领域之一，也是捆绑保护的有用模板。
      - - 设备 OEM 与电子零售
        - 随硬件购买、租赁、以旧换新和循环项目销售的保护
        - 不含保护的纯硬件毛利或融资经济性
        - 数字商务、售后或渠道所有者；终端客户付款
        - 独立保修服务商，或不提供附加服务
        - 很重要，因为电子产品保护目前是最大的市场主线。
      - - 出行与汽车
        - 嵌入车辆购买、融资、订阅或所有权流程的保险
        - 脱离场景化流程的普通汽车保费池
        - OEM、贷款方或经销商发起；客户付款或融资捆绑付款
        - 独立经纪、经销商 F&I，或自建
        - 快速增长的细分市场，与 EV、车联网和融资集成绑定。
      - - 金融服务与聚合平台
        - 银行、贷款、卡、财富管理或比价平台体验中的保险
        - 与嵌入式保护无关的一般银行收入
        - 产品或分销所有者；付款方可能是客户或捆绑项目
        - 转介链接、传统经纪交接，或静态市场
        - 很重要，因为信任、KYC 和计费轨道能降低上线摩擦。
      - - 保险公司与经纪赋能
        - 面向保险公司、经纪商和 MGA、嵌入合作伙伴流程的保险分销平台
        - 未通过嵌入式渠道产生的承保公司完整资产负债表保费
        - 保险公司数字、渠道或运营负责人
        - 碎片化代理系统或手工报价栈
        - 有用，因为部分案例研究显示保险公司和经纪也采用，而不只是非保险合作伙伴。
      - - 广义全球保险市场
        - 仅在需求点嵌入保障的场景化分销部分
        - 所有非场景化保险分销和无关软件类别
        - 不一
        - 传统代理、保险公司直营网点和聚合平台
        - 过宽，不能作为 bolttech 的实际可服务市场。
    notes: 边界逻辑按工作流划分：纳入支出必须是在另一段旅程里的场景化分销，排除支出则落在嵌入式分销外壳之外。
