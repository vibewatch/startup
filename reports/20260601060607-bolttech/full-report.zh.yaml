              有日期的公开记录显示，公司在 2025 年和 2026 年持续拓宽渠道足迹。时间线从 2020 年成立开始，经过 2024 年 12 月 Series C 首轮交割、2025 年 6 月最终交割、2025 年 9
              月与 Harmony Auto 在印尼推出 EV 保险、2026 年 1 月 Sony Hong Kong 设备保障上线、2026 年 3 月 MediaMarkt Spain 电子产品租赁上线、2026 年 4
              月获得 BYD 欧洲任命，以及 2026 年 4 月 Associated Carrier Group
              在美国推出设备保障。合在一起看，这些事件说明产品扩张横跨出行、消费电子、电信相邻零售和区域无线分销，而不是单一垂直故事。本次保留资料包里最重要的负面公开信号，是 Cybernews 报道某勒索软件团伙声称窃取约
              186GB bolttech 数据；由于报道明确称公司确认仍待完成，最好把它视为仍在进行的尽调问题，而不是已坐实的泄露事实。英国公开实体文件还给出另一条运营信号：bolttech
