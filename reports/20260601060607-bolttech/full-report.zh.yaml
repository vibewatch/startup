  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代技术栈
        blocks:
          - type: paragraph
            body: >-
              评估 bolttech
              的市场，第一条纪律是先界定什么算在内。嵌入式保险不等于所有线上销售的保险，也不等于参与数字分销的每家保险公司的全部保费池。本次保留的分析师来源收敛到一个更窄的概念：在另一个产品、服务或购买旅程中按场景提供保险，并通过
              API 或数字平台集成交付。bolttech 自己的垂直页面把这个定义落到实处。公司面向电信运营商、设备 OEM、出行
              OEM、金融机构、零售商、经纪人和其他伙伴渠道销售，保障产品贴在既有客户时刻上。因此，纳入支出包括这些伙伴旅程中的分销编排、保单报价位、报价 / 出单流程及相关生命周期服务。排除项包括通用 CRM
              或后台管理软件、并非通过场景化渠道产生的承保方资产负债表保费，以及本身不是嵌入式保障的相邻金融科技或售后服务。实践中，bolttech
              通常对抗的不是某个单一对手，而是替代技术栈：电信运营商可以什么都不做、自建，或购买更窄的供应商技术栈；OEM 可以继续只做金融或保修附加项；银行也可以保留转介或静态经纪链接，而不做完整嵌入式旅程。
