  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、传统机构、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争集合不是一个整齐的同业组。最接近的同类挑战者是 Cover Genius 和 Qover，因为两者都向伙伴销售 API 驱动的嵌入式分销，而不是只承保自有品牌账本。Chubb Studio 和
              Assurant 的重要性来自另一个方向：它们带来传统承保方的资产负债表可信度、渠道关系和运营规模，即使起点是承保方或服务基础设施，而不是中立交易软件，也会压缩 bolttech 的销售主张。Lemonade 和
              Root 是相邻替代方案，不是完全同业，因为它们掌握更多承保经济性和消费者品牌，但只要买方可以选择直接数字保险公司，或选择带伙伴 API
              的保险公司，而不是多保险公司编排层，它们就会参与竞争。公开市场报告进一步说明，这些类别正在一个快速增长的品类中相互碰撞；API 优先分销和本地监管执行决定合作能否真正上线。
