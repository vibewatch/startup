        - 定制合作伙伴项目；无公开标价
        - 报价、验证、合同生命周期、理赔、维修、客户互动、服务
        - 实际抽成率、附加销售率和利润分成未披露
        - 商业灵活性可能较高，但公开基准较弱
      - - Cover Genius
        - 动态捆绑保单定价加企业集成；无公开费用卡
        - XCover API、保单捆绑、全球牌照覆盖、合作伙伴转化工具
        - 企业经济性未披露
        - 在合作伙伴需要广泛地域覆盖和快速上线时竞争力强
      - - Qover
        - 合作伙伴特定的平台即服务经济性；无公开费用卡
        - 跨欧洲的产品、国家和保险公司编排
        - 公开证据未显示实际定价或项目利润率
        - 欧洲受监管合作伙伴可能更关注合规适配，而非表面价格
      - - Chubb Studio
        - 经谈判的承保机构项目，采用托管、合作伙伴托管或混合部署
        - 嵌入式分销、AI 优化、API、SDK 和点击互动支持
        - 无公开项目定价
        - Chubb 可以捆绑承保能力和技术，限制同口径比较
      - - Assurant
        - 基于项目的设备服务或保障经济性；无公开标价
        - 保障、保修、理赔、维修、自动化和服务中心
        - 已留存公开定价未拆分保障和服务运营
        - 即便软件费用不透明，Assurant 也可凭借运营范围取胜
      - - Lemonade / Root
        - 消费者保险保费和承保机构经济性，而非中立平台费用
        - 自有保险产品加数字购买流程
        - 合作伙伴渠道经济性不可与 B2B 编排供应商比较
        - 对某些渠道是有用替代品，但不是 bolttech 企业定价的清晰基准
    notes: 已留存公开来源主要营销结果和合作伙伴适配，而非费用表。因此，本表比较打包逻辑和定价可见度，而不是编造合同经济性。
