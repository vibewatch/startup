  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群地图与采用场景
        blocks:
          - type: paragraph
            body: >-
              bolttech 的客户基础最好理解为伙伴介导的 B2B2C 生态，而不是传统直销企业 SaaS 名单。买方通常是分销伙伴——电信运营商、零售商、聚合平台、经纪人、贷款机构、保险公司或 OEM
              关联渠道拥有者——希望在自己的用户体验中增加保险或生命周期保障。实际终端用户是订户、购物者、司机、借款人或保单持有人；付款方可以是渠道拥有者、伙伴内部预算负责人，或在购买或服务时选择保障的终端客户。这个结构在保留来源中反复出现：Taiwan
              Mobile 和 Globe 使用电信渠道，JKOPay 和 MoneyHero 使用金融科技与比价流程，Erajaya 和 MediaMarkt 使用设备零售场景，SB Finance
              带来贷款挂钩保障，Sony 证明售后 OEM 覆盖。这种宽度在战略上是正面的，因为它降低了对单一 ICP 的依赖。代价是，公开证据对各细分的经济性说得远少于对 bolttech 能支持的渠道种类。bolttech
              能以不止一种商业形态运营也很重要：从代理式本地运营到纯平台赋能。这种灵活性有助于赢下既需要受监管执行，也需要产品设计支持的伙伴。
