            body: >-
              bolttech 最强的公开财务证据是伙伴结果数据。案例研究反复显示，上线后销售提升、报价量、转化、保费增长或服务质量改善。金融服务和保险公司案例报告了大幅报价保费增长和报价吞吐量；MasOrange
              与意大利移动网络运营商部署显示转化和服务处理改善；Erajaya 显示长期运行的设备保障规模。渠道页面也公布了活动代理指标——5.6 million 份活跃保单、60,000 个销售点、5 million
              名受保障电信客户，以及出行领域超过 $59 billion 的报价保费——这些都支持真实交易量。


              但这些是吞吐量指标，不是 bolttech 净收入。它们也没有把偏软件的编排经济性与劳动密集的服务或维修运营拆开。这个区分很重要，因为毛利率取决于组合：嵌入式分销和伙伴流量可以降低直接
              CAC，而理赔受理、维修网络、客服中心、上线接入和市场特定合规会稀释利润率。Lemonade、Root 和 Assurant 等公开可比公司显示，可能的经济区间很宽，因此 bolttech
