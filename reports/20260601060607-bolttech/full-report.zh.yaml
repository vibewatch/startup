        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >-
              公开材料清楚表明，bolttech 的定位不是收取全部签单保费的承保公司。API 和平台页面描述的是一个 B2B、B2B2C
              及代理人赋能的运营层，在伙伴自有旅程内为保障产品定价、报价、核验、出单、服务、维修和续保。这强烈指向一种收入组合：编排和分销费用、软件或项目费用，以及来自理赔、维修、升级或生命周期项目的服务收入。垂直页面反复强调同一套商业逻辑：电信运营商、OEM、银行、贷款机构和保险公司用
              bolttech 解锁新收入、降低流失、扩展产品组合，而不必从零搭建本地保险运营。


              缺失的仍是硬商业细节。公开来源在一些地方展示了合同结构——动态报价获取、年度设备升级，以及嵌入伙伴渠道的综合保障——但没有披露已实现抽佣率、平台费、佣金分拆、承保方经济性，或保费流与 bolttech
              确认收入之间的会计处理。因此，商业模式看得清，但定价权仍无法被证实。
