- id: traction-and-unit-economics
  title: Traction proxies and unit-economics read-through
  body: 'bolttech’s strongest public financial evidence is partner outcome data. The case studies repeatedly show sales lift,
    quote volume, conversion, premium growth, or service-quality gains after rollout. Financial-services and insurer examples
    report large quoted-premium growth and quote throughput; MasOrange and the Italian mobile-network-operator deployment
    show conversion and service handling improvements; Erajaya shows long-running device-protection scale. The channel pages
    also publish activity proxies—5.6 million active policies, 60,000 points of sale, 5 million protected telco customers,
    and $59 billion-plus quoted premiums in mobility—that support real transaction volume.


    But these are throughput measures, not bolttech net revenue. They also do not separate software-like orchestration economics
    from labor-heavy servicing or repair operations. That distinction matters because gross margin will depend on mix: embedded
    distribution and partner traffic can lower direct CAC, while claims intake, repair networks, contact centers, onboarding,
    and market-specific compliance can dilute margins. Public comps from Lemonade, Root, and Assurant show the possible economic
    band is wide, so bolttech’s actual take rate and service mix remain the real underwriting variables.'
