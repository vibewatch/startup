chapter:
  number: 4
  title: Financials
  summary: bolttech’s public record shows high transaction throughput and repeat partner ROI, supporting a real fee-and-service
    revenue engine around embedded insurance. But current underwriting is blocked by missing take-rate, net revenue, margin,
    cash, burn, and debt data, so the financial view is constructive on demand but cautious on revenue quality and financing
    dependency.
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing visibility
  body: 'Public materials make clear bolttech is not positioned as a carrier collecting the full written premium. The API
    and platform pages instead describe a B2B, B2B2C, and agent-enabled operating layer that prices, quotes, verifies, binds,
    services, repairs, and renews protection products inside partner-owned journeys. That strongly suggests a revenue mix
    built from orchestration and distribution fees, software or program fees, and service revenue from claims, repair, upgrade,
    or lifecycle programs. The vertical pages repeat the commercial logic: telcos, OEMs, banks, lenders, and insurers use
    bolttech to unlock new revenue, reduce churn, and expand product mix without building local insurance operations from
    scratch.


    What remains missing is the hard commercial detail. Public sources show contract structure in some places—dynamic quote
    retrieval, annual device upgrades, and integrated protection inside partner channels—but do not disclose realized take
    rates, platform fees, commission splits, carrier economics, or accounting treatment between premium flow and bolttech-recognized
    revenue. So the business model is legible, but pricing power is still not underwritten.'
