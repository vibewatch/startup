  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized pricing and take rates
    missingEvidence: Partner contracts or price books showing bolttech platform fees, commissions, revenue shares, discounting,
      and revenue-recognition treatment.
    whyItMatters: The public record makes the monetization surfaces clear but not the actual economics captured by bolttech,
      which blocks any view on pricing power and revenue quality.
    diligencePath: Request the top-10 commercial agreements by revenue, sample invoicing, and the accounting memo that maps
      quoted premium, gross billings, and recognized revenue.
    relatedQuestionRefs:
    - QI003
    - QI024
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: group liquidity and runway
    missingEvidence: Current cash balance, monthly burn, runway by scenario, and any board-approved financing plan.
    whyItMatters: A fresh private round is not the same as a disclosed balance sheet, so current capital adequacy cannot be
      underwritten without direct liquidity evidence.
    diligencePath: Request the latest monthly management accounts, balance sheet, cash bridge, and 24-month operating plan
      with base, bear, and bull runway.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: debt and contingent obligations
    missingEvidence: Debt schedule, lease liabilities, guarantees, vendor financing, project finance, and covenant package
      for the operating group.
    whyItMatters: Hidden leverage or contingent obligations can materially change downside risk even if topline momentum remains
      strong.
    diligencePath: Request treasury schedules, borrowing agreements, board minutes on financing facilities, and any regulatory-capital
      or guarantee commitments by market.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: material
    topic: third-party revenue assertions
    missingEvidence: Official or filing-backed confirmation of bolttech group revenue, gross written premium handled, and
      any bridge from activity metrics to recognized revenue.
    whyItMatters: An uncorroborated third-party revenue figure can distort valuation work if it is mistaken for audited revenue
      quality or stable take-rate economics.
    diligencePath: Request audited consolidated P&L, revenue-recognition notes, and KPI reconciliation between quoted premiums,
      bound premium, net revenue, and gross profit.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: consolidated group economics
    missingEvidence: Consolidated revenue mix, gross margin by stream, renewal and retention by channel, and top-customer
      concentration.
    whyItMatters: Local-entity filings and partner case studies do not reveal whether bolttech’s growth is durable, diversified,
      or margin-accretive at the group level.
    diligencePath: Request consolidated audited financials, cohort retention tables, partner concentration by revenue, and
      stream-level gross margin from management.
    relatedQuestionRefs:
    - QI023
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: conflicting-data
    severity: material
    topic: cyber-incident cost exposure
    missingEvidence: A company-confirmed incident chronology, notification scope, remediation spend, insurance recoveries,
      and partner or regulator response.
    whyItMatters: If the ransomware allegation is real, the cost and trust consequences could materially affect opex, sales
      velocity, and underwriting confidence.
    diligencePath: Request incident-response memos, forensic findings, board reporting, insurer notifications, and the quantified
      cost or reserve impact if any incident occurred.
    relatedQuestionRefs:
    - QI021
    - QI022
    relatedTableRefs:
    - TI005
