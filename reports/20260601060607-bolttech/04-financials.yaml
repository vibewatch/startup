- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Current public proxy
  - Impact on verdict
  - Exact diligence path
  rows:
  - - Net revenue by stream
    - Quoted premiums, active policies, protected customers, and partner case studies
    - Cannot judge revenue quality or valuation support
    - Request audited 2024-2025 revenue split by orchestration, servicing, lifecycle, and other.
  - - Realized take rates / commission schedules
    - Dynamic pricing and program terms are visible, fee schedules are not
    - Pricing power and recognition policy remain opaque
    - Request top-10 partner contracts, rev-share schedules, and the accounting memo.
  - - Gross margin by stream
    - Public comp margins only
    - Margin path could differ materially from peer band
    - Request gross-profit waterfall for distribution, claims, repair, and support.
  - - Cash / burn / runway
    - Fresh Series C disclosed, balance sheet not disclosed
    - Cannot judge financing dependency or next-round timing
    - Request latest board deck with cash, burn, and 24-month plan.
  - - Debt / guarantees / project finance
    - No retained public evidence
    - Hidden leverage could distort downside risk
    - Request debt schedule, guarantees, lease liabilities, and covenant summary.
  - - Concentration / renewal / retention
    - Partner case studies and partner counts only
    - Scale may rest on a few accounts or short-duration programs
    - Request top-customer concentration, renewal cohorts, and attach-rate trends.
  - - Cyber-remediation cost
    - Cybernews allegation without official disposition
    - Could create unmodeled opex, legal, or sales drag
    - Request incident chronology, notification scope, and quantified remediation cost.
  notes: Each gap is actionable. The chapter supports a directional view, but these asks are required for underwriting-grade
    financial diligence.
