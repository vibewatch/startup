- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit / public proxy
  - Current status
  - Revenue quality read
  - Diligence ask
  rows:
  - - Embedded-insurance orchestration
    - API-driven quote, bind, contract, and servicing flow inside partner journeys
    - 5.6m active policies; 60k POS; 100+ P&C carrier connections
    - Live and scaled in finance channel
    - High throughput evidence; realized take rate unknown
    - Provide net revenue, take rate, and recognition policy by stream.
  - - Telco protection and lifecycle programs
    - Device protection, repair, trade-in, upgrade, and lifestyle cover sold through carrier channels
    - 29 partnerships; 5m+ protected customers; >7,000 sales touch points
    - Live across telco propositions
    - Potentially recurring but service-heavy
    - Show attach, renewal, claims cost, and gross margin by telco program.
  - - Mobility and OEM embedded insurance
    - Point-of-sale protection and finance-linked cover for OEMs and lenders
    - $59B+ quoted premiums in 2022; 28+ quotes per minute; 100+ carrier connections
    - High-activity official evidence
    - GMV-like proxy rather than net revenue
    - Disclose net revenue per quote or policy and carrier-share economics.
  - - Insurer distribution and analytics
    - Bundling, pricing analytics, whitespace mapping, and channel expansion for carriers
    - 45% abandonment problem cited as target use case
    - Clear product pitch; economic output undisclosed
    - Looks fee-like but not publicly priced
    - Provide SaaS fees, implementation fees, and variable transaction revenue.
  - - Device care and upgrade programs
    - Protection combined with repairs, upgrades, leasing, or annual trade-in rights
    - ~2m protected device sales annually at Erajaya; annual-upgrade program at Globe
    - Proven in named channel partners
    - Could add ARPU but also adds operations cost
    - Break out service revenue versus repair and fulfilment expense.
  notes: Public sources reveal monetization surfaces and some contract structure, but not realized bolttech pricing. Unknown
    means the retained source set does not publish a fee schedule.
