    - Carrier rate cards and bolttech take rate unknown
    - API docs describe dynamic pricing and contract management
    - Need commercial schedules and a revenue-recognition memo.
  - - Telco protection bundle
    - Monthly plan or bundled device-lifecycle add-on
    - Partner bills the end customer; bolttech economics undisclosed
    - Subsidies, commissions, and claims-sharing unknown
    - Telco pages stress revenue diversification and lifecycle services
    - Need sample telco economics by attach rate and claims rate.
  - - OEM embedded protection
