company:
  name: Lila Sciences
chapter:
  number: 6
  title: Customers
  summary: Lila publicly describes two customer-facing routes—on-demand access to AI Science Factories and partner-led discovery campaigns—but the assigned evidence does not identify a named paying customer, contract, renewal, or customer-level outcome. Adoption evidence is therefore strongest at the level of product positioning and reported experiments, with commercial durability still unresolved.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      Lila's public customer model separates access to infrastructure from ownership of
      downstream discovery. Its official solutions page describes access to AI Science
      Factories “on demand” and “without the capital commitment of building it yourself,”
      which points to research organizations that need experimental capacity but do not
      want to build an autonomous laboratory. Independent coverage separately describes a
      partner model in which biotech, energy, semiconductor, and drug-development
      companies use Lila's infrastructure while partners or startups carry later-stage
      product development. That distinction matters for diligence: the user may be a
      scientist or R&D team, the payer may be a corporate innovation or research budget,
      and the economic beneficiary may be a partner commercializing a molecule or material.
      The assigned sources do not disclose pricing, minimum program size, procurement
      cycle, or whether either route has converted into recurring revenue.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-evidence
    title: Adoption and proof of use
    body: >-
      The available record shows a credible operating surface but not customer adoption in
      the SaaS or contract-research sense. Lila's own page describes an extensible network
      of instruments and a workflow from hypothesis to experimentation to market-ready
      solutions; the company and investors also describe experiments across life sciences,
      chemistry, and materials. Those are platform-capability and activity signals, not
      disclosed customer counts, active accounts, production deployments, or paid usage.
      Secondary reporting says Lila intends to open its platform to partners and that it
      will not itself take therapeutic candidates into clinical trials, leaving downstream
      development to partners. The evidence therefore supports a partner-enabled
      commercialization thesis, while the conversion from experiments to contracted,
      repeatable customer programs remains unverified.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: retention-expansion
    title: Durability, expansion, and concentration
    body: >-
      No assigned source reports net revenue retention, gross retention, churn, renewal
      rates, contract duration, backlog, customer concentration, or expansion revenue.
      The public model could support expansion if a research team starts with capacity
      access and later commissions a broader discovery campaign, but that is a commercial
      hypothesis rather than an observed land-and-expand pattern. The same model creates
      concentration risk: a small number of large scientific programs could represent
      substantial utilization or strategic value, while the absence of named references
      prevents an investor from testing whether outcomes repeat across customers,
      geographies, or domains. Current diligence should prioritize customer references,
      signed-program terms, renewal cohorts, utilization by instrument, and the share of
      work attributable to any single partner.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
    figureRefs: [FU001]
