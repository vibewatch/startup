callouts:
  - calloutType: insight
    title: Capability evidence is ahead of customer evidence
    body: Lila has public evidence for a proposed workflow and reported experimental activity, but not for named paying customers, repeat deployments, retention, or customer-attributed outcomes.
    claimRefs: [CU005, CU008, CU010]
  - calloutType: risk
    title: Commercial durability is the key customer diligence gap
    body: Without contracts, customer references, pricing, utilization, or cohort data, an investor cannot distinguish a scalable research service from a small number of bespoke strategic programs.
    claimRefs: [CU009, CU011, CU012]
