artifact: competitors
slug: lila-sciences
runDate: 2026-10-25
company:
  name: Lila Sciences
chapter:
  number: 3
  title: Competitors
  summary: >-
    Lila competes most directly with integrated AI-drug-discovery platforms such as
    Recursion/Exscientia, while cloud labs, CROs, internal automation, and open AI
    research stacks provide narrower substitutes. Its vertical integration is a
    meaningful differentiator, but public evidence does not yet establish durable
    switching costs, comparable pricing, or independently peer-reviewed superiority.
sections:
  - id: competitive-landscape
    title: The buyer can assemble the job several ways
    body: >-
      Lila's competitive set is broader than companies using the same "AI Science
      Factory" language. The direct category comprises platforms that join scientific
      models, automated experiment design, wet-lab execution, and iterative learning.
      Recursion and Exscientia are the clearest retained life-sciences peer because
      their proposed combination joined scaled biological exploration, molecular
      design, and automated chemistry. Adjacent self-driving and cloud laboratories
      sell remote experimental capacity, while CROs execute customer-specified work.
      Internal lab automation preserves control but requires the buyer to integrate
      software, instruments, protocols, and staff. Open research efforts such as
      OpenBioML lower access barriers to scientific models but do not supply Lila's
      physical execution loop. The relevant buying decision is therefore not one
      vendor shortlist: it is whether to buy an integrated loop, assemble components,
      outsource experiments, or retain the manual status quo.
    claimRefs: [CP001, CP005, CP006, CP008, CP010, CP011]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: direct-peer-scale
    title: A consolidated peer can bring scale and distribution
    body: >-
      Recursion/Exscientia demonstrates the competitive pressure from a scaled,
      domain-focused platform. Recursion's issuer materials claim capacity of up to
      millions of wet-lab experiments per week, while the proposed Exscientia
      combination was designed to add precision molecular design and automated
      synthesis. The transaction was documented in an SEC filing and later received
      shareholder approvals, so the strategic direction is more concrete than a
      generic competitor roadmap, although claims about future platform performance
      remained forward-looking. Independent reporting also described turbulence at
      Exscientia before the deal, showing that capital, clinical programs, and partner
      relationships do not remove execution risk. For Lila, the threat is not feature
      parity alone: established pharma partnerships, proprietary datasets, and a
      clinical pipeline can supply distribution and trust that a newer general-purpose
      platform must build.
    claimRefs: [CP005, CP006, CP007, CP015]
    tableRefs: [TP002]
  - id: access-and-economics
    title: Access model and integration shape switching costs
    body: >-
      Lila's integrated architecture can reduce coordination between model, protocol,
      and laboratory, but it also concentrates dependency. A current third-party
      review found no public pricing, no self-serve tier, no public API, and no route
      for customers to bring their own laboratory equipment; those observations imply
      a high-touch enterprise motion rather than a modular software purchase. Cloud
      labs offer a different tradeoff: subscription remote access and lower entry
      barriers, but weaker visibility into sample handling and troubleshooting.
      Traditional CROs remain flexible for bespoke protocols, while internal builds
      retain data and workflow control at the cost of integration burden. The retained
      evidence does not disclose contract terms, data-portability rights, reagent
      pass-throughs, minimum commitments, or realized prices across these alternatives.
      Consequently, the strength of Lila's lock-in and any total-cost advantage remain
      diligence questions rather than demonstrated moat.
    claimRefs: [CP002, CP003, CP008, CP011, CP016]
    tableRefs: [TP003]
  - id: moat-and-displacement
    title: Vertical integration is differentiated, not yet proven durable
    body: >-
      Lila's official strategy is a single general platform rather than a collection
      of narrow tools, and investor-authored material reports benchmark-beating results
      across several domains. Those claims support breadth, but they are not independent
      validation. SiliconANGLE reported in March 2025 that Lila's research had not yet
      been independently peer reviewed, and the Royal Society review says the published
      self-driving-lab field had reached Level 4 autonomy while full Level 5 autonomy
      had not yet been realized. This creates two displacement paths: specialized
      platforms may win with deeper domain data and distribution, while modular cloud
      labs and open models may commoditize pieces of the stack. Trust is also part of
      competition. Patent treatment for AI-generated inventions, safety controls,
      cybersecurity, and ultimate human accountability can influence which platform a
      regulated buyer adopts. Lila's moat will be durable only if proprietary
      experiment data and cross-domain learning produce repeatable outcomes that exceed
      both focused peers and assembled alternatives after accounting for integration
      cost.
    claimRefs: [CP004, CP009, CP012, CP013, CP014]
tables:
  - id: TP001
    title: Competitive landscape and substitute set
    columns:
      - Alternative
      - Category
      - Public scale or proof
      - Target buyer
      - Differentiation
      - Limitation
    rows:
      - - Lila Sciences
        - Integrated autonomous-science platform
        - Public commercial scale is undisclosed; company and investor benchmark claims are not independently validated
        - Life sciences, chemistry, and materials R&D
        - General platform joining models with robotic experiment execution
        - No public pricing or self-serve access; reported dependence on Lila-operated infrastructure
      - - Recursion / Exscientia
        - Direct life-sciences peer
        - Recursion issuer claim of up to millions of wet-lab experiments weekly
        - Biopharma discovery and development teams
        - Biology mapping plus molecular design and automated chemistry
        - Scope is concentrated in drug discovery; combination benefits were forward-looking
      - - Self-driving and cloud labs
        - Adjacent infrastructure platform
        - Academic review documents subscription cloud labs and Level 3-4 autonomous systems
        - Researchers seeking remote experiment capacity
        - Lower entry barrier and modular access to automated laboratories
        - Sample-handling visibility and failure troubleshooting can be difficult
      - - Traditional CRO
        - Service substitute
        - No named CRO operating metric was retained
        - Teams outsourcing defined experimental programs
        - Broad protocol flexibility and established procurement path
        - Customer must specify and review successive experiments; continuous learning is not inherent
      - - Internal build / status quo
        - Build substitute
        - Company-specific and not publicly comparable
        - Large R&D organizations with existing labs
        - Maximum workflow, data, and instrument control
        - Integration, staffing, maintenance, and utilization remain with the buyer
      - - OpenBioML and open scientific models
        - Adjacent model-layer entrant
        - TechCrunch reported access to more than 5,000 Nvidia A100 GPUs for community projects
        - Researchers prioritizing open models and collaboration
        - Open participation and model access
        - Does not provide an integrated physical experiment loop
    notes: >-
      Comparative categories are analytical groupings from the retained sources; unknown
      scale, pricing, and contract fields are not estimated.
    claimRefs: [CP001, CP005, CP006, CP008, CP010, CP011, CP012, CP013]
  - id: TP002
    title: Capability comparison with unsupported cells marked
    columns:
      - Buying criterion
      - Lila Sciences
      - Recursion / Exscientia
      - Cloud lab / SDL
      - CRO, internal build, or open stack
    rows:
      - - Hypothesis and model layer
        - Reported as integrated and cross-domain
        - Reported biology mapping and generative design
        - Varies by customer agent and autonomy level
        - CRO unknown; internal/open stack is buyer-selected
      - - Automated experiment design
        - Reported as part of the autonomous loop
        - Design-make-test-learn capability was planned for the combined platform
        - Present in higher-autonomy SDLs
        - CRO generally customer-directed; internal build varies
      - - Physical experiment execution
        - Lila-operated robotic infrastructure reported
        - Wet-lab scale and automated chemistry reported by issuer
        - Remote lab-as-a-service execution
        - CRO executes physically; open model alone does not
      - - Closed-loop learning
        - Core product claim
        - Active-learning loop described in combination materials
        - Available in qualifying Level 3-4 SDL configurations
        - Not inherent to CRO or manual status quo
      - - Customer deployment flexibility
        - Third-party review reports no public API or bring-your-own-lab path
        - Deployment terms not established in retained evidence
        - Subscription and customer-coded workflows documented for cloud labs
        - Internal build is flexible but integration-intensive
      - - Independent outcome validation
        - Public peer review was absent in March 2025 reporting
        - Clinical pipeline and partnerships exist, but combined-platform outcomes were prospective
        - Multiple systems appear in technical literature
        - Varies by provider and workflow; no uniform evidence retained
    notes: >-
      Cells summarize disclosed capability, not benchmark equivalence. "Unknown" means
      the assigned evidence pool did not establish the criterion.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP008, CP010, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Alternative
      - Public price
      - Contract or access model
      - Included scope
      - Underwriting implication
    rows:
      - - Lila Sciences
        - Undisclosed
        - Contact-led enterprise access; no public self-serve tier
        - AI platform plus access to robotic lab infrastructure, according to third-party review
        - Request realized price, minimum commitment, lab-time allocation, and pass-through costs
      - - Recursion / Exscientia
        - Not established in retained evidence
        - Partnerships and internal pipeline; customer packaging is unknown
        - Biology, design, synthesis, and translation capabilities were described
        - Do not infer a directly comparable platform price from partnership economics
      - - Cloud labs
        - Not established in retained evidence
        - Subscription remote access documented at category level
        - Executable-code access to standardized lab workflows
        - Compare utilization limits, failure reruns, data export, and instrument coverage
      - - Traditional CRO
        - No sourced like-for-like price retained
        - Project or program service
        - Defined experimental execution with broad protocol flexibility
        - Compare change-order economics and iteration latency, not only project price
      - - Internal build / open stack
        - No comparable all-in value retained
        - Owned infrastructure plus software and staffing
        - Buyer controls components, data, and operating model
        - Include capex, integration labor, maintenance, and utilization in total cost
    notes: >-
      No retained source provides like-for-like realized pricing. The table deliberately
      excludes unsourced contract estimates and treats missing economics as diligence gaps.
    claimRefs: [CP002, CP003, CP008, CP011, CP016]
figures:
  - id: FP001
    title: Competitive positioning by autonomy and access openness
    type: quadrant
    summary: >-
      Lila occupies the high-autonomy, low-openness corner; modular alternatives trade
      integration for broader access or buyer control.
    data:
      xAxis:
        label: Closed-loop autonomy
        min: 1
        max: 5
        lowLabel: Human-directed
        highLabel: Highly autonomous
        scale: Analyst ordinal score
      yAxis:
        label: Access openness
        min: 1
        max: 5
        lowLabel: Closed enterprise access
        highLabel: Open or modular access
        scale: Analyst ordinal score
      points:
        - label: Lila Sciences
          x: 5
          y: 1
          detail: Full-loop positioning; no public self-serve, API, or bring-your-own-lab path reported.
        - label: Recursion / Exscientia
          x: 4
          y: 2
          detail: Integrated biology, design, and automated synthesis; partnership-led access.
        - label: Cloud labs / SDLs
          x: 3
          y: 4
          detail: Remote experiment execution with customer-selected software autonomy.
        - label: Traditional CRO
          x: 1
          y: 2
          detail: Broad physical execution but successive work is primarily customer-directed.
        - label: Internal build
          x: 3
          y: 1
          detail: Buyer-controlled stack with autonomy dependent on internal integration.
        - label: OpenBioML / open models
          x: 2
          y: 5
          detail: Open model collaboration without an integrated physical laboratory loop.
    approximationNotes: >-
      Coordinates are evidence-backed ordinal analyst scores from 1 to 5, not measured
      benchmarks. They reflect disclosed autonomy and access model only; pricing,
      performance, and scientific quality are not encoded.
    claimRefs: [CP001, CP002, CP003, CP006, CP008, CP010, CP011, CP012]
callouts:
  - calloutType: risk
    title: Integration can create both moat and lock-in
    body: >-
      The same coupling of models, data, protocols, and robotic infrastructure that may
      accelerate learning can make portability and multi-homing difficult. Contract-level
      evidence on data export, instrument interoperability, and termination rights is not public.
    claimRefs: [CP003, CP008, CP016]
