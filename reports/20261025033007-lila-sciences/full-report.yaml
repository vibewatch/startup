chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Lila Sciences was founded in 2023 inside Flagship Pioneering and is headquartered in Cambridge,
              Massachusetts. Its stated product is an autonomous-science platform that connects specialized AI models
              with robotic laboratories so hypotheses can be generated, experiments designed and run, and results fed
              back into subsequent cycles. The commercial model remains earlier than the financing profile: Reuters
              reported a plan to offer enterprise software access to the models and automated labs, while the company
              said interested sectors included energy, semiconductors, and drug development without naming customers.
              The resulting profile is a heavily financed platform build, not a publicly demonstrated recurring-revenue
              business.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
