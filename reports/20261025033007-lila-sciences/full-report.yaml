        blocks:
          - type: paragraph
            body: >-
              The capital history accelerated quickly after the March 2025 unveiling. A $200 million committed seed
              financing was followed by a reported $235 million Series A tranche in September 2025 and a $115 million
              extension in October. Reuters reported that the extension brought the Series A to $350 million, total
              capital raised to $550 million, and valuation above $1.3 billion. Flagship remains both company originator
              and investor; the syndicate also spans venture, institutional, sovereign-linked, and strategic capital.
              This breadth helps fund laboratories and hiring, but the valuation and funding totals should not be
              interpreted as revenue, cash availability, or proof of product-market fit.
