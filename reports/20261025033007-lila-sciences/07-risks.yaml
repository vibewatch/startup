callouts:
  - calloutType: risk
    title: The core risk is proof, not ambition
    body: "Lila describes large-scale autonomous experimentation, but public evidence does not yet establish independent replication, paid production adoption, or progression into regulated products."
    claimRefs: [CR001, CR002, CR010]
  - calloutType: assumption
    title: Absence of incident evidence is not clearance
    body: "The assigned pool did not contain a verified Lila outage, breach, recall, or enforcement record; this is recorded as an evidence gap rather than a clean bill of health."
    claimRefs: [CR009]
  - calloutType: recommendation
    title: Require operating proof before underwriting scale
    body: "Before treating the platform as a scalable infrastructure business, require reproducibility packages, unit economics, customer contracts, and control evidence tied to measurable kill criteria."
    claimRefs: [CR005, CR009, CR014]
