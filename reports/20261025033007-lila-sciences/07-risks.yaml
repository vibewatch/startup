company:
  name: Lila Sciences
chapter:
  number: 7
  title: Risks
  summary: Public evidence points to a technically ambitious platform whose main risks are proof of repeatable scientific and commercial value, high physical operating intensity, and the regulatory and governance burden of translating autonomous experimentation into products. The risk posture is therefore high until independent validation, unit economics, customer contracts, and control evidence are disclosed.
sections:
  - id: evidence-and-regulatory-risk
    title: Evidence, scientific validity, and regulatory translation
    body: >-
      Lila's own financing announcement describes AI agents that generate hypotheses, design
      experiments, run them, learn from results, and iterate thousands of times, while also
      claiming thousands of discoveries and hundreds of thousands of AI-driven experiments.
      Those are company-issued indicators of activity, not independent evidence of reproducible
      outcomes, peer-reviewed benchmarks, customer acceptance, or regulatory readiness. The
      external risk is material because the FDA says that most drugs entering preclinical
      testing never reach human testing and that candidates reaching review face scrutiny of
      trial design, side effects, and manufacturing. The Wyss Institute likewise cautions that
      biological model data can be limited and biased by the experiments that generated it,
      and that AI-generated compounds may be difficult to synthesize or lack drug-like
      properties. Lila therefore faces a translation risk: fast experimental loops can improve
      search, but they do not by themselves establish safety, efficacy, manufacturability, or
      approval. The immediate diligence requirement is an audit-ready record of datasets,
      controls, blinded replication, benchmark definitions, and the handoff from discovery to
      regulated development.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operating-and-governance-risk
    title: Operating, AI governance, and facility execution
    body: >-
      The operating model couples frontier software with robotics, sensors, laboratory
      instruments, reagents, facilities, and scientific staff. Lila's announcement describes
      unified facilities and expansion into Boston, San Francisco, and London; external
      coverage describes autonomous labs as expensive and hard to operate because they require
      elite AI and scientific talent, robotics, instruments, facilities, and quality controls.
      That coupling creates several correlated failure modes: instrument downtime can interrupt
      data generation, poor calibration can contaminate training data, and facility expansion
      can add fixed cost before customer utilization is proven. NIST's AI Risk Management
      Framework is voluntary and intended to improve the incorporation of trustworthiness into
      design, development, use, and evaluation, which gives Lila a relevant governance baseline
      but does not demonstrate that Lila has implemented it. The company should provide system
      inventories, access controls, incident logs, validation records, change management, and
      human override evidence for each factory and model. Until then, mitigation maturity is
      low-to-developing rather than demonstrated.
    claimRefs: [CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: capital-partner-and-thesis-break-risk
    title: Capital intensity, dependency, and thesis-break triggers
    body: >-
      Lila has substantial disclosed financing, but financing is not cash available for
      operations, and neither the company-issued sources nor the independent coverage reviewed
      here discloses burn, runway, gross margin, pricing, recurring revenue, customer
      concentration, or contract structure. Independent coverage says the latest verified base
      was $550 million raised and more than $1.3 billion valuation, while also emphasizing that
      customers and partners still need evidence and that the business must convert faster
      discovery into durable revenue. This creates financing and partner-dependency risk:
      capital may fund infrastructure, but a platform that depends on pharmaceutical, energy, or
      semiconductor partners can face long procurement, validation, regulatory, and
      commercialization cycles. The risk is not that a new valuation or mega-round is proven;
      Startup Fortune explicitly says no new mega-round was publicly confirmed. The practical
      kill criteria are measurable: two consecutive quarters without disclosed or verifiable
      paid production deployments, inability to reproduce a claimed result under independent
      protocols, materially rising facility cost per validated experiment, or a financing event
      that requires a down-round or materially tighter terms. Management should provide a
      24-month cash bridge, customer-level revenue and renewal evidence, and dependency
      exposure by facility and partner.
    claimRefs: [CR010, CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or failure mode, Jurisdiction or scope, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - ["Biased or non-representative training and experimental data", "Biology and chemistry workflows", "high", "critical", "low", "High: model outputs may not generalize beyond generated data", "Obtain dataset lineage, coverage analysis, blinded replication, and out-of-distribution benchmark results."]
      - ["Discovery claims do not translate to safe, effective, manufacturable products", "FDA-regulated therapeutics and diagnostics", "high", "critical", "developing", "High: discovery evidence is not clinical or manufacturing approval", "Trace selected programs through preclinical packages, IND/IRB plans, manufacturing controls, and independent outcomes."]
      - ["AI-generated compounds are difficult to synthesize or lack drug-like properties", "Drug-discovery programs", "medium", "high", "developing", "Material: generated candidates may fail downstream screening", "Reconcile design success metrics with synthesis yield, potency, toxicity, and developability data."]
      - ["Trustworthiness and human-oversight controls are incomplete", "AI systems and laboratory operations", "medium", "high", "low", "Material: errors could propagate through autonomous loops", "Map controls to NIST AI RMF functions and inspect approval, audit, override, and incident records."]
    notes: "Rows are ordered by analyst-assessed severity using public evidence; likelihood and residual exposure are risk judgments, not company-reported probabilities. Null is not used because each row has a stated public evidence basis."
    enumerationScope:
      coverage: sample
      basis: "Four highest-priority regulatory and scientific failure modes identified from the assigned 2026 refresh evidence."
    claimRefs: [CR001, CR003, CR004, CR008]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Instrument or facility downtime interrupts closed-loop experimentation", "high", "high", "low", "High: physical infrastructure is a required system component", "No public uptime, redundancy, maintenance, or recovery metrics."]
      - ["Calibration or sample-handling error contaminates generated data", "medium", "critical", "low", "High: corrupted data can reinforce incorrect model behavior", "No public calibration, chain-of-custody, QC thresholds, or data-rejection rates."]
      - ["Expansion across multiple hubs increases fixed cost and execution complexity", "medium", "high", "developing", "Material: Boston, San Francisco, and London expansion is described but utilization is undisclosed", "Obtain site-level capex, opex, utilization, staffing, and validated-experiment economics."]
      - ["Cybersecurity, access, or sensitive-data control failure", "medium", "high", "low", "Material: no public incident or control attestations were identified in the pool", "Request SOC 2/ISO evidence if applicable, threat model, privileged-access logs, and incident history."]
    notes: "The pool contains no verified Lila incident record; that absence is a gap, not evidence that incidents did not occur. Operational likelihoods are qualitative assessments anchored to the disclosed hardware-and-software architecture."
    claimRefs: [CR006, CR007, CR009]
  - id: TR003
    title: Partner, capital, and dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["External capital", "Venture investors and corporate backers", "Capital markets tighten before scientific proof or revenue scale", "high", "Large disclosed funding base and long-term investor mix", "High: burn, runway, and terms are undisclosed", "Review cash bridge, liquidation preferences, debt, covenants, and next-financing sensitivity."]
      - ["Pharmaceutical and industrial partners", "Potential enterprise customers", "Long validation or procurement cycles delay revenue and feedback", "high", "Platform is designed for enterprise access and domain breadth", "High: no named paid production contracts or renewal data in assigned evidence", "Inspect customer list, contract terms, paid pilots, deployment status, and concentration."]
      - ["Specialist scientific and engineering talent", "Internal workforce", "Hiring or retention shortfall slows model, robotics, and quality execution", "medium", "Multidisciplinary team and planned hubs", "Material: staffing cost and retention metrics are undisclosed", "Review headcount by function, attrition, hiring plan, and key-person dependencies."]
      - ["Regulated-development and manufacturing ecosystem", "External CROs, manufacturers, regulators, and clinical partners", "Discovery output cannot progress into approved or scaled products", "high", "FDA pathway and postmarket controls are known external requirements", "High: no program-level handoff evidence is public in the pool", "Trace one representative program through preclinical, clinical, manufacturing, and regulatory owners."]
    notes: "Funding raised is not treated as cash available, and company plans are not treated as executed customer or regulatory outcomes. Counterparty roles are framed as dependencies implied by the disclosed platform and applicable development pathway."
    claimRefs: [CR010, CR011, CR012, CR014]
