evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Audited revenue, ARR, pricing, gross margin, burn, runway, current headcount, and named customer metrics.
    whyItMatters: >-
      The public financing and valuation cannot be connected to commercial traction or capital efficiency without
      operating metrics.
    diligencePath: >-
      Request monthly management accounts, current cash and burn schedules, customer contracts, cohort data, pricing
      schedules, and a dated employee roster.
    relatedQuestionRefs:
      - QO005
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete board roster, cap table, voting rights, investor protections, related-party arrangements, and succession
      plan.
    whyItMatters: Flagship's overlapping sponsor, investor, and leadership roles make control and key-person exposure material.
    diligencePath: >-
      Review the charter, bylaws, voting agreements, board minutes, financing documents, option ledger, and key-person
      employment terms.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: validation
    missingEvidence: >-
      Independent replication, peer-reviewed support, and customer-validated throughput or economics for Lila's
      scientific claims.
    whyItMatters: >-
      Scientific activity and company-authored publication listings do not establish repeatability, superiority, or
      commercial value.
    diligencePath: >-
      Obtain underlying datasets and protocols, commission expert replication review, and interview named customers or
      research partners under NDA.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Lila-specific customer count, annual contract value, serviceable workflow count, deployment capacity, and
      geographic scope.
    whyItMatters: Without bottom-up commercial inputs, public category estimates cannot be converted into a defensible SAM or SOM.
    diligencePath: >-
      Request a customer cohort and pipeline review with pricing, pilot conversion, utilization, and workflow
      eligibility by target vertical.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: Comparable inclusion rules and methodology for the materially different lab-automation estimates.
    whyItMatters: The spread between estimates is large enough to change market-share and valuation conclusions.
    diligencePath: >-
      Obtain the underlying definitions and segment tables from each provider and reconcile hardware, software,
      services, and end-user coverage.
    relatedQuestionRefs:
      - QM002
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-segmentation
    missingEvidence: Independent interviews or public procurement evidence naming Lila's actual buyers, users, and payers.
    whyItMatters: The buyer map is currently an evidence-constrained hypothesis rather than observed traction.
    diligencePath: >-
      Interview reference customers and review procurement documents, paid pilots, renewal terms, and implementation
      ownership.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer contracts covering data ownership, export rights, instrument interoperability, termination assistance,
      and multi-homing.
    whyItMatters: These terms determine whether vertical integration creates defensible retention or buyer resistance.
    diligencePath: >-
      Request a redacted master services agreement, data-processing addendum, export demonstration, and two
      former-customer references.
    relatedQuestionRefs:
      - QP009
