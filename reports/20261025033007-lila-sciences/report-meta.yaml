companyProfile:
  summary: >-
    Lila Sciences is a Cambridge-based AI-for-science company that originated inside Flagship Pioneering and pairs
    scientific reasoning models with autonomous laboratories. Its platform is aimed at life sciences, chemistry,
    materials, and adjacent research domains, but the public record does not yet establish recurring revenue, named
    production customers, or independently reproducible scientific outcomes.
