callouts:
  - calloutType: insight
    title: The market is real but the boundary is contested
    body: "Independent category estimates show substantial spend and growth, but their different definitions make a single headline TAM misleading. Lila's serviceable market should be rebuilt from target workflows, deployment economics, and verified buyers."
    claimRefs: [CM005, CM006, CM007, CM016]
  - calloutType: risk
    title: Integration and proof of ROI are the adoption bottlenecks
    body: "The same sources that identify throughput and labor scarcity as drivers also identify high initial investment, interoperability, validation, training, and unclear cost-effectiveness as constraints."
    claimRefs: [CM012, CM013, CM014, CM015]

