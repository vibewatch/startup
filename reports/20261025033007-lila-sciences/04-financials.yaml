company:
  name: Lila Sciences
chapter:
  number: 4
  title: Financials
  summary: Lila has disclosed substantial venture funding and a capital-intensive autonomous-lab strategy, but public evidence does not establish recurring revenue, realized pricing, gross margin, burn, runway, or customer concentration. The underwriting case therefore depends on validating whether physical experimentation can become repeatable, paid, and economically efficient before the next financing dependency becomes material.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Lila's public materials describe a B2B platform combining scientific AI with
      autonomous laboratory capacity, rather than a conventional software subscription.
      The launch release says the platform will be open to partners across life and
      material sciences, while secondary research describes two commercial lanes:
      Catalyst for access to the platform and lab capacity, and Creation for
      end-to-end discovery campaigns. Those lanes imply different revenue-quality
      questions: Catalyst may resemble usage-based lab infrastructure, while Creation
      may involve program fees, milestones, or value-linked intellectual property.
      Neither public company materials nor the assigned independent sources disclose
      realized prices, contract duration, renewal behavior, backlog, revenue
      recognition policy, or customer-level concentration. List-like descriptions of
      offerings must therefore not be treated as ARR, booked revenue, or gross margin.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure
    title: Cost structure and operating leverage
    body: >-
      The operating model is structurally more capital intensive than pure SaaS.
      Lila's launch materials describe autonomous science units, robotics, software,
      and infrastructure, and its current recruiting evidence includes procurement,
      supply-chain planning, lab-equipment lifecycle management, network and IT/OT
      operations, and custom mobile-manipulator design. These signals are consistent
      with meaningful fixed costs, specialized labor, equipment depreciation,
      consumables, facilities, compute, maintenance, and validation overhead. They
      do not provide a basis for a precise gross-margin or cash-burn estimate.
      The key financial question is whether experiment volume and customer program
      pricing can rise faster than factory, staffing, and scientific-quality costs.
      Public evidence also does not disclose working-capital terms, capex commitments,
      supplier concentration, or whether customers fund dedicated capacity.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: traction-and-capital
    title: Traction, financing dependency, and capital adequacy
    body: >-
      The financing record is visible, but operating traction is not. Flagship's
      launch release reported $200 million of committed seed capital in March 2025,
      and later coverage reported a $235 million Series A in September 2025. A
      regulatory Form D assigned to this chapter records a $817,500 equity offering
      by AVSF - Lila Sciences 2025, LLC, with the full amount sold on September 13,
      2025; that filing is a vehicle-level transaction and should not be added to
      Lila's headline financing total without resolving the relationship. Forge's
      September 2026 page reports 2026 Series B-1 and B-2 amounts and an $8.5
      billion post-money valuation, but its own disclosure says post-money valuation
      is estimated from company-submitted certificates and that it does not audit
      or independently verify received information. There is still no assigned
      source for cash on hand, monthly burn, runway, debt obligations, customer
      count, recurring revenue, or realized gross profit. Capital adequacy is thus
      a diligence blocker rather than a calculable runway.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
  - id: underwriting-verdict
    title: Financial underwriting verdict
    body: >-
      Financial quality is presently a high-uncertainty, capital-dependent thesis.
      The positive case is that disclosed financing can fund a differentiated
      science-and-robotics platform and that current hiring spans commercial,
      procurement, safety, infrastructure, and factory operations. The adverse case
      is that the same breadth increases fixed-cost exposure before public evidence
      demonstrates paid repeatability. Company- and investor-originated claims of
      benchmark performance or discoveries are not substitutes for customer
      contracts, audited revenue, contribution margin by program, or independent
      validation of throughput economics. Before underwriting, request a cohort or
      program-level revenue bridge, price and milestone schedules, customer
      concentration, experiment-level cost accounting, capex and lease commitments,
      cash and burn, debt or project-finance terms, and evidence that a second
      factory improves unit economics rather than simply expanding capacity.
    claimRefs: [CI014, CI015, CI016]
    tableRefs: []
    figureRefs: []
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism described in assigned sources, Public value/status, Financial quality, Diligence ask]
    rows:
      - [Catalyst, "Platform access plus AI Science Factory capacity", null, "Offering description only; no realized revenue disclosed", "Contracts, price card, usage units, renewal and gross-margin terms"]
      - [Creation, "End-to-end discovery campaign with validated outputs", null, "Offering description only; milestone and IP economics unclear", "Program fee, milestone schedule, acceptance criteria and IP participation"]
      - [Partner programs, "Platform opened to life and material sciences partners", null, "Partner access is described, but named paid customers are not disclosed", "Named references, contract status, backlog and concentration"]
      - [Scientific outputs, "Molecules, materials, protocols and data packages", null, "Potential deliverables; not evidence of recognized revenue", "Revenue-recognition policy and delivered-versus-roadmap ledger"]
    notes: "Rows summarize assigned source descriptions; null means no public amount was disclosed, not zero revenue. Offering language is not ARR or realized pricing."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Item, Public list or contract price, Unit or denominator, Realized-versus-list status, Underwriting implication]
    rows:
      - [Catalyst access, null, "Platform/lab capacity", "Unavailable", "Cannot calculate ARR, utilization, or payback"]
      - [Creation campaign, null, "Program or milestone", "Unavailable", "Cannot compare bookings with delivery cost"]
      - [IP or equity participation, null, "Deal-specific", "Unavailable", "Potential upside is not current revenue"]
    notes: "No assigned source reports a public price, contract denominator, discount schedule, or realized customer economics; every null requires primary diligence."
    claimRefs: [CI002, CI003, CI014]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Recurring revenue or ARR, null, "Unavailable", "Determines revenue quality and valuation support", "Monthly revenue ledger split by Catalyst, Creation and other streams"]
      - [Gross margin, null, "Unavailable", "Tests whether factory economics can support scale", "Fully loaded cost per experiment and per customer program"]
      - [CAC or sales payback, null, "Unavailable", "Tests enterprise GTM efficiency", "Bookings, sales cost, cycle length and cohort conversion"]
      - [Cash on hand and burn, null, "Unavailable", "Determines runway and financing dependency", "Latest balance sheet, twelve-month cash forecast and burn bridge"]
      - [Debt or project-finance obligations, null, "Unavailable", "Captures fixed claims ahead of equity", "Debt schedule, leases, equipment finance and covenants"]
      - [Customer concentration, null, "Unavailable", "Measures downside from a small number of programs", "Top-customer revenue and backlog share under NDA if needed"]
    notes: "Unavailable metrics are intentionally null because the assigned public evidence does not support estimates. These are underwriting requests, not implied zeros."
    claimRefs: [CI005, CI008, CI012, CI013, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: "The described model converts customer scientific problems into AI-designed experiments and either capacity access or end-to-end discovery outputs; public evidence does not quantify the monetary conversion."
    data:
      nodes:
        - id: customer-problem
          label: Customer scientific problem
          value: "Input"
          note: "Target buyers are described as life-science and materials-science partners; named paid-customer volume is unavailable."
        - id: ai-design
          label: AI hypothesis and experiment design
          value: "Process"
          note: "Company materials describe human-guided AI generation of hypotheses and experiments."
        - id: factory-execution
          label: Autonomous experiment execution
          value: "Process"
          note: "Robotics, software and lab infrastructure create capital and operating cost."
        - id: catalyst
          label: Catalyst
          value: "Commercial lane"
          note: "Platform access and lab capacity; price and usage denominator unavailable."
        - id: creation
          label: Creation
          value: "Commercial lane"
          note: "End-to-end discovery campaign; fee, milestone and IP terms unavailable."
        - id: validated-output
          label: Validated scientific output
          value: "Deliverable"
          note: "Outputs may include molecules, materials, protocols or data packages; revenue recognition is not disclosed."
      edges:
        - [customer-problem, ai-design]
        - [ai-design, factory-execution]
        - [factory-execution, catalyst]
        - [factory-execution, creation]
        - [catalyst, validated-output]
        - [creation, validated-output]
    approximationNotes: "This is an evidence-backed operating model, not a revenue forecast; no conversion rates, prices, margins, or cash values are inferred."
    claimRefs: [CI001, CI002, CI003, CI005, CI014]
callouts:
  - calloutType: strength
    title: Strong financing capacity is visible
    body: "Assigned sources support at least $200 million of committed seed capital and a later $235 million Series A announcement, but financing raised is not cash available after spending."
    claimRefs: [CI009, CI010]
  - calloutType: risk
    title: Runway cannot be underwritten
    body: "No assigned source provides cash on hand, burn, runway, debt, recurring revenue, realized pricing, or gross margin; the missing inputs are material to capital adequacy."
    claimRefs: [CI012, CI013, CI015, CI016]
  - calloutType: recommendation
    title: Demand program-level economics before underwriting
    body: "Require customer contracts, revenue recognition, experiment cost accounting, factory capex and lease schedules, and a cash forecast before treating the financing record as evidence of financial durability."
    claimRefs: [CI004, CI008, CI014, CI015]
