  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - ["AI-enabled experimental loop can create differentiated data", "Company and investor materials describe AI agents, robotics, and autonomous factories.", "Reproducible external benchmark and data-lineage evidence.", "Potential platform moat, not yet independently established."]
      - ["Capital supports a long build cycle", "$550M total capital is disclosed across seed and Series A.", "Cash, burn, runway, and use-of-proceeds disclosure.", "Financing risk is deferred, not removed."]
      - ["Commercial demand could validate the platform", "Lila says it is welcoming a first cohort of customers.", "Named contracts, pricing, renewals, and customer outcomes.", "Customer traction remains an open underwriting question."]
      - ["Scientific claims may not translate to value", "Independent coverage and sector commentary identify peer-review and late-stage efficacy gaps.", "Stage-gated outcomes, partner milestones, and independent replication.", "Do not value broad ambition as realized pipeline value."]
    notes: "The table separates company or investor assertions from independent downside evidence; the absence of disclosed data is a gap, not a negative measurement."
    claimRefs: [CV005, CV006, CV007, CV013]
  - id: TV003
    title: Bull / base / bear scenario framework
    columns: [Scenario, Operating assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Paid deployments scale across multiple scientific domains; throughput and outcomes are independently validated.", "A strategic platform premium could be justified if recurring economics become visible.", "Low-to-medium until customer and benchmark data are disclosed.", "Commercial pilots fail to convert or require heavy bespoke support."]
      - [Base, "Selective partnerships and pilots continue while Lila spends financing on factories, talent, and platform development.", "Hold or track; price should be anchored to financing evidence rather than unsupported revenue multiples.", "Most consistent with current disclosure.", "Burn or runway indicates a near-term financing need."]
      - [Bear, "Scientific claims remain difficult to reproduce and customer conversion lags investment.", "A private-mark compression or down round becomes plausible; avoid false precision on a range.", "Material risk given missing denominators.", "Down round, preference overhang, or failed milestone."]
      - [Comparator check, "Recursion is a public reference; Isomorphic's round and the Recursion-Exscientia merger are private-financing and consolidation references.", "Use only as directional yardsticks; do not apply their values directly to Lila.", "Low comparability.", "Pipeline, liquidity, and business-model differences invalidate the analogies."]
    notes: "Scenarios are qualitative because Lila does not publicly disclose the revenue, ARR, margin, customer, cap-table, or preference inputs needed for a numeric valuation range."
    claimRefs: [CV010, CV011, CV012, CV016]

