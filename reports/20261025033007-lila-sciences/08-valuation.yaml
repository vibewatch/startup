company:
  name: Lila Sciences
chapter:
  number: 8
  title: Valuation
  summary: Lila has publicly disclosed $550M of total funding and a company-reported $1.3B-plus valuation context, but public evidence does not establish recurring revenue, customer economics, or a clean basis for a higher mark. The appropriate posture is track pending independent proof of repeatable scientific and commercial output.
sections:
  - id: investment-call
    title: Investment call
    body: >-
      The public record supports a well-capitalized, ambitious AI-for-science platform, not a
      conventional software valuation case. Lila says its $350M Series A brought total capital
      raised to $550M and is being used to build AI Science Factories and open the platform to
      commercial partners. That is meaningful financing validation, but it is not revenue,
      ARR, cash available, or evidence of realized customer pricing. The decisive missing inputs
      are contracted revenue, gross margin, burn, runway, retention, and independently
      reproducible scientific outcomes. With a private-company mark above $1.3B reported in
      secondary coverage, the evidence supports tracking rather than paying an unverified
      premium.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis and anti-thesis
    body: >-
      The bull case is that Lila combines models, robotics, and automated experimentation into
      a proprietary learning loop, allowing scientific work to scale beyond human throughput.
      Investor and company materials describe experiments across biology, chemistry, and
      materials, and Lila says it is opening the platform to a first customer cohort. The
      anti-thesis is translation and commercialization risk: SiliconANGLE reported in March
      2025 that Lila's results had not been made public or independently peer reviewed, while
      broader AI-drug-development evidence says preclinical gains have not resolved late-stage
      efficacy. Founder commentary also acknowledges that platform monetization depends on
      downstream proof. The investment view should therefore rise only with named customers,
      repeatable paid deployments, audited operating metrics, and external validation.
    claimRefs: [CV005, CV006, CV007, CV008, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-comps
    title: Scenarios and comparables
    body: >-
      A conventional revenue multiple cannot be responsibly calculated from the available
      record because Lila has not disclosed revenue, ARR, pricing, margin, or customer count.
      Scenario analysis is therefore an underwriting framework rather than a forecast. The
      bull case requires commercial conversion and measurable scientific throughput to compound
      without proportionate bespoke support; the base case assumes continued financing and
      selective pilots while proof accumulates; the bear case assumes valuation compression
      before revenue quality or discovery outcomes are independently demonstrated. Recursion's
      October 2026 market capitalization provides a public reference, Isomorphic Labs' 2025
      financing shows private capital appetite, and the Recursion-Exscientia combination shows
      consolidation amid public-value pressure. These are directional references, not direct
      multiple anchors, because liquidity, operating history, pipeline exposure, and business
      models differ materially from Lila.
    claimRefs: [CV010, CV011, CV012, CV014]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-and-triggers
    title: Diligence asks and thesis breaks
    body: >-
      Entry discipline should be tied to evidence gates, not to the headline funding amount.
      Before a buy decision, diligence should obtain the cap table and preference stack, latest
      financing documents, cash and burn schedule, customer contracts, pricing and renewal
      terms, scientific benchmark definitions, and independent replication or partner outcome
      data. A thesis break would be a down round or materially worse financing terms, failure
      to convert the announced customer cohort into disclosed commercial evidence, inability to
      reproduce claimed results, or a cost structure that scales faster than scientific output.
      Until those questions are answered, the recommendation is track with medium confidence:
      the financing signal is strong, but the price-sensitive evidence is incomplete.
    claimRefs: [CV004, CV006, CV007, CV015, CV016]

