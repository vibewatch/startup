company:
  name: Lila Sciences
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Lila Sciences is a Cambridge-based, Flagship-originated AI-for-science company
    founded in 2023 that pairs specialized models with automated laboratories.
    It has substantial financing and a reported valuation above $1.3 billion, but
    public evidence still does not establish revenue, named customers, current
    headcount, or independently validated scientific performance.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Lila Sciences was founded in 2023 inside Flagship Pioneering and is
      headquartered in Cambridge, Massachusetts. Its stated product is an
      autonomous-science platform that connects specialized AI models with robotic
      laboratories so hypotheses can be generated, experiments designed and run,
      and results fed back into subsequent cycles. The commercial model remains
      earlier than the financing profile: Reuters reported a plan to offer
      enterprise software access to the models and automated labs, while the
      company said interested sectors included energy, semiconductors, and drug
      development without naming customers. The resulting profile is a heavily
      financed platform build, not a publicly demonstrated recurring-revenue
      business.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: financing-and-stakeholders
    title: Financing, valuation, and strategic stakeholders
    body: >-
      The capital history accelerated quickly after the March 2025 unveiling. A
      $200 million committed seed financing was followed by a reported $235 million
      Series A tranche in September 2025 and a $115 million extension in October.
      Reuters reported that the extension brought the Series A to $350 million,
      total capital raised to $550 million, and valuation above $1.3 billion.
      Flagship remains both company originator and investor; the syndicate also
      spans venture, institutional, sovereign-linked, and strategic capital. This
      breadth helps fund laboratories and hiring, but the valuation and funding
      totals should not be interpreted as revenue, cash availability, or proof of
      product-market fit.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Geoffrey von Maltzahn is co-founder and chief executive, with Flagship founder
      Noubar Afeyan identified as co-founder and chairman. The operating bench
      disclosed at launch covered scientific leadership, AI, materials, and
      operations through Molly Gibson, George Church, Andrew Beam, Rafael
      Gomez-Bombarelli, and Christopher Fussell. That functional breadth is relevant
      to a company attempting to coordinate models, robotics, and multiple
      scientific domains. However, the assigned public evidence does not disclose a
      complete board, voting rights, ownership, executive succession plan, or
      governance protections. The overlap between company leadership and Flagship
      also makes sponsor influence and key-person dependence important diligence
      topics rather than settled facts.
    claimRefs: [CO002, CO006, CO007]
    tableRefs: [TO002]
  - id: milestones-and-evidence-quality
    title: Milestones and evidence quality
    body: >-
      The public milestone record has advanced from formation and financing into
      visible scientific publication activity. Lila's own news page lists 2026 work
      on autonomous experiment design, AI-for-materials, CAR-T development, and
      catalyst discovery, while CNBC placed the company at number 25 on its 2026
      Disruptor 50 list. These are useful indicators of activity, not substitutes
      for commercial or scientific validation. SiliconANGLE reported in March 2025
      that the then-undisclosed experimental results had not been independently
      peer-reviewed, and Fierce Biotech reported in October 2025 that Lila had not
      publicly released data supporting repeated technology claims. Independent
      replication, current customer evidence, and audited operating metrics remain
      the main proof points required.
    claimRefs: [CO014, CO015, CO016]
    figureRefs: [FO001]
