      topic: reliability
      missingEvidence: Customer-level uptime, run success rate, calibration drift, recovery rate, and turnaround time by factory and instrument class.
      whyItMatters: Physical-lab reliability determines whether the platform is a repeatable product or a high-touch research service.
      diligencePath: Obtain a customer- or auditor-verified operating dashboard covering at least twelve months and multiple scientific workflows.
      relatedQuestionRefs: [QE004, QE008]
    - type: private-evidence-only
      severity: material
      topic: technical-proof
      missingEvidence: Reproducible benchmark protocols, raw experiment summaries, negative results, and independent replication of reported discoveries.
      whyItMatters: Experiment counts and company-reported benchmark wins do not demonstrate validated commercial or clinical outcomes.
      diligencePath: Request blinded benchmark packages and third-party replication results with denominators, controls, and pre-specified endpoints.
      relatedQuestionRefs: [QE007, QE008]
