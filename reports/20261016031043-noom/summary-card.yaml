  topStrengths:
    - Recognizable consumer-health brand with a behavior-change system that now extends into medication-assisted care.
    - Real enterprise and payer distribution suggest the platform is larger than a single D2C app.
    - Public materials indicate broad product breadth and meaningful scale signals.
  topRisks:
    - Current revenue, margin, cash, and runway remain undisclosed or only estimate-backed.
    - Regulatory, billing, and medication-fulfillment complexity increase as Noom Med expands.
    - Retention and customer economics are still hard to verify independently.
  unresolvedGaps:
    - >-
      Current revenue, growth rate, gross margin, burn, and cash runway are not officially disclosed and remain mixed
      across third-party estimates.
    - Active paying-subscriber count and churn / retention cohorts are still not disclosed.
    - Noom Med revenue contribution, mix, and margin versus legacy subscription revenue are not broken out.
    - >-
      The valuation gap between the 2021 $3.7B mark and more recent secondary-market estimates remains unresolved
      without a new priced round.
    - >-
      The outcome and financial exposure of FTC, auto-renewal, and privacy-related legal matters remain insufficiently
      quantified.
