chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Noom's addressable market is best understood as a layered preventive-health
    opportunity anchored in consumer weight management and expanding into
    medication-assisted care, employer and health-plan programs, and adjacent
    chronic-condition categories. Public evidence supports multiple top-down
    lenses, but it does not isolate a current Noom-specific SAM or SOM, so the
    chapter preserves sizing as a set of bounded market lenses rather than a
    single generic TAM claim.
sections:
  - id: "market-boundary"
    title: "Market boundary starts with weight management, then widens into preventive care"
    body: >-
      The consistent boundary across Noom's official surfaces and independent
      profiles is not "wellness" in the abstract; it is consumer-led digital
      health built around weight management and behavior change. Noom frames the
      product stack as psychology, technology, medication, and coaching, while
      independent profiles still describe the core as a subscription weight-loss
      app plus the newer Noom Med layer. That means the included spend is
      weight-management subscriptions, medication-assisted weight-loss programs,
      and related employer or payer deployments that use the same behavior
      engine. Excluded spend should remain acute care, general wellness content
      with no behavior-change program, and medication dispensing without the
      adherence and habit layer. Status-quo substitutes therefore include
      calorie trackers, legacy weight-loss programs, and medication-first
      telehealth offers that solve parts of the same job from different budget
      lines.
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM005"]
    tableRefs: ["TM001"]
  - id: "sizing-lenses"
    title: "Public sizing evidence supports multiple lenses rather than one clean TAM/SAM/SOM stack"
    body: >-
      The evidence base is useful for triangulation but not for a precise
      bottom-up market model. At the broadest edge, U.S. Chamber cites a $4.5T
      global wellness economy, which is directionally relevant to demand for
      self-directed health improvement but far too broad to treat as Noom's TAM.
      Sacra then narrows the thesis by describing a jump from a roughly $70B
      weight-loss industry to a broader $4T healthcare opportunity, while the
      company's own 2025 overview breaks the expansion story into specific
      adjacencies such as diabetes, cardiovascular health, hormonal health,
      sleep, and healthy aging. Those figures are not methodologically
      comparable, so they should be treated as boundary markers: they show that
      Noom can tell a credible market-expansion story, but not that public
      sources can yet prove a current Noom-specific SAM or SOM by program.
    claimRefs: ["CM006", "CM007", "CM008", "CM009", "CM016"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-budgets"
    title: "Buyer, user, and payer shift by channel"
    body: >-
      Noom's buyer map is not one-dimensional. In the classic D2C subscription
      path, the user is also the buyer and payer, purchasing coaching, content,
      and behavior-change support directly. In Noom Med, the same end user adds
      a clinician and prescription pathway, which broadens the addressable spend
      from app subscriptions toward medication-assisted weight management and
      potentially pharmacy-benefit or reimbursement workflows. The enterprise
      path is different again: employers, health plans, and pharma-support
      programs become the commercial buyer, while the employee, member, or
      patient becomes the user. That matters for valuation because adoption
      depends less on consumer brand alone and more on whether Noom can prove
      engagement, savings, and adherence benefits to institutional budget
      owners.
    claimRefs: ["CM004", "CM010", "CM011", "CM012", "CM013", "CM014"]
    tableRefs: ["TM003"]
  - id: "drivers-and-constraints"
    title: "Adoption drivers are engagement and ROI; constraints are SAM opacity and commoditization"
    body: >-
      The strongest adoption drivers in the retained evidence are Noom's ability
      to pair medication with behavior change, widen the top of funnel through a
      free tier and AI tools, and sell economic outcomes to payers and
      employers. Those drivers all support a category shift from an app-based
      subscription business toward a broader preventive-care platform. The main
      constraints are equally clear: public evidence still does not separate
      current revenue or users by D2C, enterprise, and medication lines, so the
      monetizable SAM remains opaque; and Sacra flags the risk that AI-driven
      weight-loss advice, GLP-1 platform crowding, regulatory pressure on
      compounded medications, and high acquisition costs could compress the
      value of Noom's current wedge before the adjacencies scale. That mix
      supports a valuation story with real upside, but not one that can rest on
      a single oversized TAM number.
    claimRefs: ["CM011", "CM012", "CM014", "CM015", "CM016"]
