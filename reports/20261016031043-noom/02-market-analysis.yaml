callouts:
  - calloutType: "insight"
    title: "The investable question is channel capture, not whether the TAM is large"
    body: >-
      Public evidence already shows large adjacent markets around Noom's core
      behavior-change engine. What remains unproven is how much of those markets
      Noom can capture through D2C subscriptions, medication-assisted programs,
      and institutional channels without disclosing a current segment-level SAM
      or SOM.
    claimRefs: ["CM008", "CM010", "CM016"]
