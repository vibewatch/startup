  topStrengths:
    - 具备辨识度的消费者健康品牌，行为改变体系如今已延伸至药物辅助医疗。
    - 企业和支付方渠道是真实存在的，说明平台规模已超出单一 D2C 应用。
    - 公开材料显示其产品覆盖面广，也释放出有意义的规模信号。
  topRisks:
