    - 随着 Noom Med 扩张，监管、计费和药品履约复杂度都会上升。
    - 留存和客户经济性仍难以独立验证。
  unresolvedGaps:
    - 当前收入、增长率、毛利率、烧钱速度和现金跑道尚未正式披露，第三方估算之间也存在分歧。
    - 活跃付费订阅用户数以及流失率 / 留存队列仍未披露。
    - Noom Med 对收入的贡献、收入结构，以及相较传统订阅收入的利润率均未拆分披露。
    - 2021 年 $3.7B 估值与近期老股市场估算之间的差距，在新一轮定价融资出现前仍无法弥合。
    - FTC、自动续费和隐私相关法律事项的结果及财务敞口仍未得到充分量化。
