      severity: blocking
      topic: liquidity-runway
      missingEvidence: Current cash balance, monthly burn, debt or working-capital facilities, and base or downside runway.
      whyItMatters: Capital adequacy and next-round dependency cannot be judged without direct liquidity evidence.
      diligencePath: Obtain CFO cash bridge, debt schedule, and board-approved operating plan with runway sensitivities.
      relatedQuestionRefs: [QI007]
      relatedTableRefs: [TI003]
    - type: conflicting-data
