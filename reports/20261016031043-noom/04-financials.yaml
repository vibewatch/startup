schemaVersion: report-v2
artifact: financials
slug: noom
runDate: 2026-10-16
company:
  name: Noom
chapter:
  number: 4
  title: Financials
  summary: >-
    Noom's public 2026 materials support a broader monetization model than the
    legacy weight-loss subscription story alone: consumer subscriptions,
    medication-assisted programs, and payer or employer channels all appear to
    be active. The underwriting problem is not lack of productized pricing but
    lack of disclosed realized revenue mix, unit economics, burn, cash, and
    runway, leaving capital adequacy and margin path dependent on management
    diligence rather than public evidence.
sections:
  - id: revenue-model-pricing
    title: Revenue model breadth is clearer than realized revenue quality
    body: >-
      Public materials now show Noom monetizing through more than one path.
      The company still sells classic behavior-change subscriptions under Noom
      Weight, but it also sells medication-assisted programs, lower-dose GLP-1
      options, telehealth intake for branded medications, and covered
      payer-sponsored access in at least one health-plan launch. That matters
      because Noom is no longer underwritten as a single DTC subscription SKU;
      the real question is how much revenue comes from each stream and how much
      gross profit survives clinical, pharmacy, coaching, and servicing costs.
      The official pricing surfaces are useful for list-price framing, but they
      still do not disclose realized net pricing, renewal mix, promotional
      discounts, or channel mix, so list price cannot be treated as revenue
      quality on its own.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI013]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-commercial-proxies
    title: Commercial traction exists, but mostly through company-selected proxies
    body: >-
      Noom does present enough evidence to show that the business has real
      commercial surfaces beyond a marketing concept. The company overview deck
      claims health-plan scale, enterprise penetration, and employer economics,
      while Highmark's 2026 benefit launch independently confirms at least one
      payer-sponsored deployment. At the same time, the most favorable traction
      metrics are company-selected and outcome-adjacent: covered lives,
      projected ROI, savings-per-member, engagement-linked weight loss, and
      comparative retention claims. Those are directionally useful because they
      show where Noom wants payers and employers to pay, but they are not a
      substitute for cohort retention, renewal, or realized gross-margin data.
    claimRefs: [CI002, CI006, CI007, CI008, CI013]
    tableRefs: [TI003]
  - id: cost-structure-capital
    title: Cost structure and capital adequacy remain the core diligence blockers
    body: >-
      The public evidence is much thinner on what matters most for
      underwriteability. Once Noom adds clinicians, medication access, coaching,
      and employer or payer servicing, the cost stack is clearly more complex
      than software alone, yet the company does not disclose gross margin by
      product or channel. Third-party funding summaries at least anchor the last
      major equity round, but they disagree on total capital raised and even on
      the round label attached to the $3.7 billion valuation. Public operating
      scale signals are also inconsistent, with the same Tracxn page surfacing
      both a 1,202 employee count and much lower entity-level counts. Without a
      current cash balance, burn trajectory, debt obligations, or runway, the
      chapter can describe monetization surfaces but cannot clear capital
      adequacy risk.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
  - id: verdict
    title: "Verdict: real monetization breadth, weak public finance visibility"
    body: >-
      Financially, Noom looks more like a multi-channel consumer-health platform
      than a single app subscription business, which is constructive for demand
      breadth and could support multiple monetization ladders. The risk is that
      nearly every number required for a true underwriting model remains
      private: realized revenue mix, margin by product, CAC, payback, churn,
      cash, burn, and runway. Independent adverse commentary already points to
      customer-acquisition and retention pressure around any future IPO timing,
      and the conflicting public funding and headcount signals make the
      operating baseline less reliable than the brand visibility implies. The
      financial conclusion is therefore "real business, incomplete public
      underwrite": progress on GLP-1 and payer channels is visible, but capital
      intensity and margin path still require management evidence.
    claimRefs: [CI001, CI002, CI010, CI012, CI013, CI014]
callouts:
  - calloutType: strength
    title: Hybrid monetization is now visible in public evidence
    body: >-
      Official pricing, the company overview, and a payer rollout all support a
      hybrid model spanning self-pay subscriptions, medication-assisted care,
      and covered payer or employer channels.
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: Public finance visibility is still too thin for clean underwriting
    body: >-
      Noom discloses list prices and selected outcome proxies, but not realized
      mix, gross margin, CAC, payback, cash, burn, or runway; third-party
      funding summaries also conflict.
    claimRefs: [CI010, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Noom Weight
        - Consumer behavior-change subscription billed upfront across plan durations
        - Subscription plan
        - 4-month $169; 6-month $179; 12-month $209 / $17.42 average monthly
        - Official list pricing only; realized net price and renewal mix undisclosed
        - Cohort mix by term, renewal rate, refund rate, and net realized ARPU
      - - Noom GLP-1Rx / GLP-1Rx Plus
        - Self-pay medication program with coaching and clinical support
        - Initial 4-week supply, then monthly recurring payment
        - Starts at $129 or $149, then $279 or $299 per month
        - Official list pricing only; conversion, refill, and discontinuation economics undisclosed
        - Rx attach rate, refill retention, and contribution margin by cohort
      - - Microdose / proactive GLP-1
        - Lower-dose self-pay medication programs and preventive-health offering
        - Monthly or 12-week recurring billing
        - Entry pricing from $79, $99, or $149 per month depending on SKU
        - Official list pricing only; medication COGS and adherence profile undisclosed
        - Pharmacy cost, dose escalation mix, and discontinuation by SKU
      - - Health plan / employer channel
        - Covered benefit or contracted enterprise/payer deployment
        - Covered life or contract
        - Highmark launch starts Jan. 1 2026; Noom claims 6.5M lives covered and 5 of top 20 health plans
        - Revenue recognition and realized contract economics undisclosed
        - PMPM or PEPM structure, implementation fees, utilization, and renewals
    notes: >-
      Combines official list pricing with one partner launch and company-claimed
      channel scale; it does not imply realized pricing or revenue mix.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - Realized pricing
      - Source
    rows:
      - - Noom Weight 12-month plan
        - $209 upfront / $17.42 average monthly
        - Unknown after taxes, promotions, and renewals
        - Noom cost page
      - - Noom Weight 6-month plan
        - $179 upfront / $29.83 average monthly
        - Unknown after taxes and discounts
        - Noom cost page
      - - Noom Weight 4-month plan
        - $169 upfront / $42.25 average monthly
        - Unknown after taxes and discounts
        - Noom cost page
      - - GLP-1Rx / GLP-1Rx Plus
        - Starts at $129 or $149 for initial 4 weeks; then $279 or $299 monthly
        - Unknown after refill behavior and any retention offers
        - Noom cost page
      - - Microdose GLP-1Rx / Plus
        - Starts at $79 or $99 for initial 4 weeks; then $179 or $199 monthly equivalent
        - Unknown after dose progression and refill behavior
        - Noom cost page
      - - Telehealth for branded medications
        - $39 for initial 30-day trial; medication not included
        - Insurance and pharmacy economics undisclosed
        - Noom cost page
    notes: >-
      This is a list-price snapshot only; nulls and "unknown" entries mean
      realized net pricing, discounts, and reimbursement mix are not publicly
      disclosed.
    claimRefs: [CI003, CI004]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value/null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Gross margin by product/channel
        - null
        - Low
        - Medication, coaching, clinician, and partner-service costs determine whether growth is profitable
        - Monthly gross margin waterfall by Weight, Med, GLP-1, and payer or employer channels
      - - CAC / payback
        - null
        - Low
        - Independent commentary flags CAC and retention as core IPO-readiness constraints
        - Channel CAC, payback period, paid-media mix, and cohort contribution margin
      - - Retention / churn
        - Company cites stronger engagement and retention proxies, but no paying cohort table
        - Medium
        - Renewal behavior drives realized LTV more than list pricing does
        - Monthly paid-retention, refill retention, and churn by product
      - - Payer / employer ROI
        - Company-claimed $1,219 Healthy Weight savings, $5,342 DPP savings, and 4.1x projected Noom Med ROI
        - Medium
        - Contract renewals and enterprise pricing depend on proven savings
        - Contract-level realized PMPM economics, utilization, and renewal rates
      - - Operating scale / cost base
        - "Public signals conflict: 1,202 employees on page summary versus 538 in entity rows"
        - Low
        - People and service costs are likely material for coaching and clinical programs
        - Consolidated current headcount and SG&A by function
      - - Cash / runway
        - null
        - Low
        - Capital dependency cannot be underwritten without liquidity and burn visibility
        - Cash balance, debt or facility terms, monthly burn, and runway bridge
    notes: >-
      "null" means the metric is not publicly disclosed in the assigned source
      pool; the non-null entries are proxies or company claims, not audited unit
      economics.
    claimRefs: [CI007, CI008, CI011, CI012, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a sequence from member acquisition to plan
      selection, billing, service delivery, outcomes claims, and retained gross
      profit, but not a quantified conversion model.
    data:
      nodes:
        - label: Member acquisition / eligibility
          value: Consumer sign-up or covered-member eligibility
          detail: Public materials show both self-pay consumer acquisition and payer-sponsored availability.
        - label: Plan selection
          value: Weight, Med, GLP-1Rx, Microdose, HRT, or employer / payer offer
          detail: Noom now presents multiple monetization paths rather than one subscription SKU.
        - label: Billing event
          value: Upfront plan fee, monthly medication fee, or covered benefit
          detail: Official pricing is visible, but net realized pricing and reimbursement mix are not.
        - label: Service delivery
          value: Lessons, coaching, clinician access, and sometimes medication fulfillment
          detail: Delivery costs extend beyond software because clinical and medication services are included in some offers.
        - label: Outcomes / ROI proof point
          value: Weight-loss, savings, or ROI claims
          detail: Company-selected metrics are visible, but renewal and cohort economics are not.
        - label: Retained gross profit
          value: Undisclosed
          detail: Underwriting still depends on margin, retention, CAC, and runway data that are not public.
    claimRefs: [CI001, CI002, CI003, CI004, CI007, CI008, CI009, CI013]
