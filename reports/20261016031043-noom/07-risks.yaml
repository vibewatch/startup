      topic: regulatory-legal-register
      missingEvidence: >-
        Exhaustive current docket, regulator, and settlement evidence covering
        FTC, privacy, auto-renewal, and pharmacy-related exposure.
      whyItMatters: >-
        The legal register is severity-ranked but sample-based; undisclosed or
        unresolved matters could change the downside case materially.
      diligencePath: >-
        Pull federal and state court dockets, regulator releases, archived terms
        changes, and any settlement or reserve disclosures, then refresh TR001.
      relatedQuestionRefs: [QR008]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: fulfillment-and-support-ops
      missingEvidence: >-
        Medication fulfillment SLAs, lost-shipment rates, refund rates,
        cancellation completion rates, and support-resolution metrics.
      whyItMatters: >-
        Customer complaints are visible, but without internal operating metrics
        it is impossible to determine whether anecdotal issues are isolated or
        structurally harmful to retention economics.
      diligencePath: >-
        Request pharmacy and shipping vendor scorecards, chargeback data, CSAT or
        NPS trends, and month-by-month complaint volumes for Noom Med.
      relatedQuestionRefs: [QR003, QR006]
    - type: missing-source
