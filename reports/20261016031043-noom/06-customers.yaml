schemaVersion: "report-v2"
artifact: customers
slug: noom
runDate: 2026-10-16
company:
  name: Noom
chapter:
  number: 6
  title: Customers
  summary: >-
    Noom clearly has a real customer base across direct-to-consumer subscriptions,
    medication-assisted members, and enterprise coverage, with company materials
    claiming more than 6.5 million covered lives, five of the top 20 US health
    plans, and hundreds of enterprise clients. The evidence for durability is
    weaker than the evidence for scale: Noom shows testimonials, review volume,
    and engagement claims, but it does not disclose cohort retention, renewal, or
    concentration metrics in the reviewed public materials.
sections:
  - id: customer-mix-and-gtm
    title: Customer mix and go-to-market
    body: >-
      Noom is serving multiple customer surfaces rather than a single subscription
      SKU. The consumer-facing core is still Noom Weight, which packages
      psychology-based lessons, logging, coaching, and AI support for individual
      payers; Noom Med layers clinician evaluation and prescription access onto
      that same behavior-change engine; and the homepage plus commercial overview
      show a third route through employers, health plans, and channel partners.
      That matters because the buyer, user, and payer are aligned in the D2C
      motion but can diverge in enterprise deployments where the covered member is
      the user and an employer or plan is the budget holder. The reviewed public
      sources support segmentation and product breadth, but not customer-count
      splits or revenue mix by segment.
    claimRefs: [CU001, CU002, CU003, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-scaled-signal
    title: Adoption proof and scaled signal
    body: >-
      Public evidence of adoption is real but uneven in quality. The strongest
      scale signals are company-issued: Noom's October 2025 overview says it
      covers more than 6.5 million lives, works with five of the top 20 health
      plans, and serves hundreds of enterprise clients; it also advertises 4.5/5
      Trustpilot scores across 66,000 reviews and a 38.76% D30 retention metric
      for its Microdose GLP-1 Rx product as of June 2026. Independent coverage
      helps validate reach rather than renewals: Forbes previously reported more
      than 50 million downloads, while independent review sites record large app
      store review volume and user-reported product friction. The net result is
      enough evidence to conclude Noom has scaled distribution and real consumer
      usage, but not enough to treat marketing testimonials as enterprise-grade
      proof of production deployment or expansion.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009, CU011, CU015, CU016]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration-risk
    title: Durability and concentration risk
    body: >-
      Durability remains the softest part of the customer story. Noom's own
      materials emphasize engagement and positive habit change, and old management
      commentary cited one-year maintenance, but the independent evidence surfaced
      in this pool is more cautious: HealthRx cites a 2020 BMJ Open analysis in
      which only 25.7% of 36,000 users remained active at six months, and
      ChoosingTherapy highlights recurring complaints about glitches, time-heavy
      food logging, and cancellation friction. More importantly, the reviewed 2025
      to 2026 materials do not disclose GRR, NRR, churn, renewal cohorts, or
      top-customer concentration, so investors cannot tell whether today's
      enterprise and GLP-1 momentum is broad-based and durable or increasingly
      dependent on a narrower set of sponsors and high-intent members.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Noom Weight self-serve consumers
        - Buyer=user=payer; individual subscriber
        - Psychology-led weight loss, coaching, food logging
        - Millions helped; 50M+ historical downloads
        - Core D2C subscription base and brand funnel
        - No current paid-subscriber count or cohort retention disclosed
      - - Noom Med consumers
        - Buyer=user; payer is cash-pay member or insured patient
        - GLP-1 prescribing plus behavior-change support
        - D30 retention and weight-loss claims disclosed by company
        - Higher-ARPU upsell and cross-sell from core weight program
        - No public breakout of members, revenue mix, or renewal
      - - Employer-sponsored populations
        - Buyer=payer employer; user is covered employee/member
        - Preventive weight-management benefit
        - Hundreds of enterprise clients; average size 13,000+ employees
        - PMPM contracts diversify beyond consumer subscriptions
        - Named customers and contract sizes are not disclosed
      - - Health plans
        - Buyer=payer health plan; user is covered member
        - Weight-management / GLP-1 support and plan engagement
        - Five of top 20 US health plans claimed
        - Potentially sticky channel if medical-cost savings hold
        - No disclosed renewal, utilization, or concentration data
      - - Partners / channels
        - Buyer varies by partner; user may come through partner channel
        - Distribution and co-marketing
        - Homepage explicitly lists partners as a channel
        - Broadens access and lowers CAC if partner-led
        - No public evidence on partner contribution or dependence
    notes: >-
      Synthesized from reviewed public materials; null-like gaps mean the metric
      or split is not disclosed in the assigned source pool.
    claimRefs: [CU001, CU002, CU003, CU011, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Historical app downloads
        - 50M+
        - "2020"
        - Forbes via company interview
        - medium
        - Large top-of-funnel consumer reach is real
        - Paid conversion from downloads to subscribers
      - - Covered lives
        - 6.5M+
        - Oct 2025
        - Noom overview PDF
        - medium
        - Enterprise / payer channel is scaled, not merely experimental
        - Active users, paid contracts, and covered-to-engaged conversion
      - - Health-plan penetration
        - 5 of top 20 US health plans
        - Oct 2025
        - Noom overview PDF
        - medium
        - Supports payer-channel credibility
        - Which plans, member counts, and renewal duration
      - - Enterprise client base
        - Hundreds; average client size 13,000+ employees
        - Oct 2025
        - Noom overview PDF
        - medium
        - Suggests broad employer distribution
        - Total covered employees actually using Noom
      - - Trustpilot social proof
        - 4.5/5 across 66k reviews
        - "2026"
        - Noom overview PDF
        - medium
        - Strong visible consumer review volume
        - How much of the score comes from current GLP-1 cohorts vs legacy app users
      - - Microdose GLP-1 Rx retention
        - 38.76% D30
        - "2026-06-22"
        - Noom overview PDF
        - medium
        - Noom is monitoring early engagement in Med
        - Full churn curve, cohort mix, and post-D30 retention
      - - External app-store / review snapshot
        - 4.7/816.7K Apple; 4.2/310K Google Play; 3.9/63,524 Trustpilot
        - "2026"
        - ChoosingTherapy review
        - medium
        - Independent review footprint is large
        - Time-window consistency versus Noom's own review snapshot
    notes: >-
      Mixes company-issued and third-party snapshots; values are not directly
      cohort-comparable and missing denominators are preserved rather than imputed.
    claimRefs: [CU002, CU008, CU009, CU011, CU015, CU016]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Raouf
        - Noom Weight member
        - Psychology-led weight-loss and habit-change program
        - Production individual use
        - Reports better sleep, alertness, and confidence
        - Company-curated testimonial; no duration or independent verification
      - - Karla
        - Noom Med member
        - GLP-1 plus lifestyle-program pairing
        - Production individual use
        - Reports 80-pound loss after starting GLP-1 in Jan 2023
        - Company-curated testimonial; no baseline, time series, or clinician context
      - - Angelique
        - Noom Weight member
        - Behavioral weight-management program
        - Production individual use
        - Reports improved eating habits and biomarker improvements
        - Self-reported outcome on official surface
      - - Angelia
        - Noom Med member
        - Menopause-related weight management with medication support
        - Production individual use
        - Reports losing 17 pounds with program + meds
        - Not evidence of broader menopause-cohort retention or scale
      - - Michael
        - Noom Weight member
        - Mindfulness and emotion-management support for weight control
        - Production individual use
        - Reports sustained mindfulness and confidence months after trial
        - Demonstrates testimonial freshness, not enterprise proof
    notes: >-
      Sample of public named testimonials only; enterprise clients and health-plan
      customers are not named in the reviewed pool.
    enumerationScope:
      coverage: partial
      basis: >-
        Compiled from Noom's public 2026 member-testimonial page plus independent
        review coverage; the reviewed source pool does not name employer or health
        plan customers, so this is a partial sample rather than a complete census.
    claimRefs: [CU004, CU005, CU006, CU007, CU009]
figures:
  - id: FU001
    title: Customer acquisition and expansion journey
    type: journey-map
    summary: >-
      Noom's customer journey runs from self-serve behavioral programs into
      medication-assisted care and, separately, enterprise-sponsored coverage.
    data:
      items:
        - label: Consumer acquisition
          actor: Prospective individual member
          phase: Discovery
          tone: neutral
          touchpoints:
            - Quiz / free-trial flow on Noom homepage
            - Psychology-based weight-loss positioning
        - label: Noom Weight enrollment
          actor: Self-pay consumer
          phase: Initial conversion
          tone: positive
          touchpoints:
            - Daily lessons and food logging
            - AI + human-led coaching via chat
        - label: Med qualification and prescribing
          actor: Higher-intent obesity / weight-management consumer
          phase: Upsell / clinical expansion
          tone: opportunity
          touchpoints:
            - Clinician evaluation
            - GLP-1 Rx or Microdose GLP-1 Rx eligibility
        - label: Ongoing engagement loop
          actor: Active member
          phase: Retention
          tone: neutral
          touchpoints:
            - Weight logging and app opens
            - Coaching, content, and behavioral nudges
        - label: Enterprise coverage path
          actor: Employer / health plan buyer
          phase: B2B2C distribution
          tone: opportunity
          touchpoints:
            - Employer / health-plan sponsorship
            - Covered-member activation inside the same platform
        - label: Renewal and durability gate
          actor: Noom revenue owner / sponsor
          phase: Expansion risk
          tone: risk
          touchpoints:
            - Public NRR / GRR / churn not disclosed
            - Review friction and cancellation complaints can weaken renewals
    claimRefs: [CU001, CU003, CU004, CU013, CU014]
callouts:
  - calloutType: strength
    title: Enterprise adoption looks real, not notional
    body: >-
      The clearest 2025-2026 customer proof is Noom's claim of 6.5M+ covered
      lives, five top-20 health plans, and hundreds of enterprise clients; that
      is enough to treat payer / employer distribution as a material channel.
    claimRefs: [CU002, CU008, CU016]
  - calloutType: risk
    title: Durability proof lags scale proof
    body: >-
      Noom shows testimonials, review volume, and early engagement metrics, but
      the assigned sources do not disclose renewal, churn, or cohort retention
      data that would prove expansion durability.
    claimRefs: [CU011, CU012, CU013, CU014]
  - calloutType: insight
    title: Customer evidence is strongest at the top of funnel
    body: >-
      Downloads, covered lives, app-store reviews, and marketing testimonials all
      show reach; the harder diligence question is whether those users renew,
      expand into Med, and stay active long enough to support durable economics.
    claimRefs: [CU008, CU009, CU011, CU014]
