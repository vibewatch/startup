        title: 商业 traction 存在，但主要靠公司选择的代理指标
        blocks:
          - type: paragraph
            body: >-
              Noom 提供了足够证据，说明这不是只有营销概念的业务。公司概览声称具备健康计划规模、企业渗透和雇主经济性；Highmark 2026 年福利上线则独立确认至少一次支付方赞助的部署。同时，最有利的
              traction 指标都由公司选择，且接近结果指标：覆盖人数、预计 ROI、每成员节省、参与度相关减重和相对留存。这些指标能说明 Noom 希望支付方和雇主为哪些结果付费，但不能替代客户 cohort
