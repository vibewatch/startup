              - CO014
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              领导层已明显从创始人主导转向职业经理人主导。第三方历史页面称，Jeong 于 2023 年 7 月从 CEO 转任执行董事长，Geoff Cook 接任
              CEO；当前领导层页面也显示，公司在技术、财务、产品、医疗、商业、法务、战略和人力运营方面均有较完整的负责人阵容。这种广度降低了单一职能执行风险，但 Cook 当前的经营节奏和 Jeong
              的创始人叙事仍带来较高关键人依赖，尤其是在 Noom 试图围绕 GLP-1 相关预防医疗重新定位之际。
            claimRefs:
              - CO005
              - CO006
              - CO014
