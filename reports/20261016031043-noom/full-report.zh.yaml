            title: 当前主线是平台扩张，而不只是减肥
            body: 最有力的战略变化证据，是 Noom 从心理学驱动的减重应用转向更广泛的预防健康平台，将教练服务、AI、企业渠道和 GLP-1 相关医疗结合起来。
