      - number: '7.4'
        title: 依赖与模式风险
        blocks:
          - type: paragraph
            body: >-
              Noom 已不只是消费者应用，也暴露在合作伙伴和渠道依赖之下。公司材料展示了支付方和雇主关系，公开资料则显示有专门的药房和健康运营领导层，这说明这些依赖是实质性的而非偶然的。更深层的问题是集中度：如果 Noom
              Med 确实已占收入多数，那么药物供应、药房表现和 GLP-1 需求就会塑造整个投资判断。Sacra 2024 年的观点又增加了一层模式风险，将 Noom
              与多垂直远程医疗玩家对比，并将这种竞争与历史高额广告支出联系起来。投资含义是，Noom 必须证明自己拥有更好的留存和结果，或更高的获客效率；否则，以药物为主的转型可能带来更大但更脆弱的收入基础。
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 药物执行是打破主线的风险
            body: 如果 Noom 在 Noom Med 增长期间无法稳定处方、履约、续费和支持质量，那么药物转型带来的下行经营杠杆会大于上行收益。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR010
          - type: callout
            title: 缓释因素可见，但尚未独立完整验证
            body: 医疗领导层、药房运营负责人和出版物档案降低了可信度风险，但不能替代关于当前 cohort 留存、经济性或法律敞口的独立证据。
            calloutType: insight
            claimRefs:
              - CR009
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与证据边界
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，而不是买入或回避。Noom 概览声称收入增长超过 50%、Med 同比增长 108%，且 EBITDA
              和自由现金流为正，这些都是方向上有吸引力的经营信号。但它们由公司发布，没有给出绝对收入和现金数值，也没有提供当前企业或股权估值。融资证据同样过时且不一致：一份竞争对手撰写的回顾称，2021 年曾以 $540
              million 融资轮对应 $3.7 billion 估值；AInvest 则报道了高得多的 2025
              年估值。两者都没有提供当前交易条款。没有当前一级价格、经审计财务、净债务、优先股堆叠或完全稀释所有权，就无法计算可辩护的入场倍数和目标回报。
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV012
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV016
      - number: '8.2'
        title: 主线与反主线
        blocks:
          - type: paragraph
            body: >-
              主线建立在规模与产品广度的潜在有价值组合上。Noom 称其项目覆盖超过 6.5m 人，触达美国二十大健康计划中的 5
              家及数百家企业客户。当前平台覆盖行为支持、临床医疗、药物、糖尿病和更年期；一家独立营销行业来源将 Noom Med 的推出时间定为 2023
              年。反主线则是，规模和广度尚未转化为独立验证的经济性。Metabolic Ledger 批评季度计费透明度，明确的产品竞争对手 Nutrola
              则报告了反复出现的教练质量问题。这些来源存在商业或编辑局限，但指出了应当验证而不是忽略的留存、信任和服务质量问题。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV014
              - CV015
      - number: '8.3'
        title: 情景框架与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据支持有条件的情景分析，但不支持数值估值区间或概率权重。乐观情景要求验证已报告的增长和正现金生成信号是否持久，以及 Noom
              的药物加行为主张能否在没有监管或计费摩擦的情况下带来留存。基准情景是带证据折价的持续增长：可信业务可能存在，但没有当前收入、利润率、现金、债务和所有权数据，就不能批准任何价格。悲观情景会在公司说法无法与审计记录对上、客户
              cohort 走弱，或获客经济性依赖损害信任的计费做法时触发。历史收入和估值只能作为背景；收入不等于 ARR，过时指标也不能替代当前企业价值。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              现有公开证据不足以支持任何退出窗口。公司披露的支付方和雇主触达可能扩大战略兴趣，控制一家药房也可能加深纵向整合，但两者都不能证明 IPO 准备度、买方需求或可实现流动性。最终尽调应取得经审计的 2024-2026
              年财务、按产品划分的月度 cohort 留存、扣除药物和临床成本后的贡献利润、现金和债务余额、完全稀释股权结构表、清算优先权，以及最新 409A
              或二级交易证据。还应核对计划层面的定价和退款机制，验证覆盖人数转化为收入的过程，并测试下行情景契约。如果经审计的增长或现金生成明显低于公司演示、导入期后留存恶化，或当前条款要求基于无支持的历史估值进行投资判断，主线就会失效。
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV011
              - CV016
