      - number: '1.3'
        title: 融资、规模与利益相关方
        blocks:
          - type: paragraph
            body: >-
              资本故事容易定位时间，但难以更新。独立来源将历史累计融资集中在 $657M-$658M 左右，并称最近一次定价融资是 2021 年 5 月的 $540M Series F，当时 Noom 估值
              $3.7B；现有来源没有提供更新的定价轮。经营质量则更复杂：Sacra 的 2023 年 ARR $1B 是外部估算，不是公司披露；公司 2025 年官方概览材料则声称 EBITDA
              为正、自由现金流为正、现金充足、无债务、覆盖超过 6.5m 人、拥有数百家雇主客户，并与美国前 20 大健康计划中的 5
              家建立关系。这些说法显示公司确有规模，但不足以填补当前收入口径、订阅用户数或所有权稀释方面的缺口。
