  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 这是一张主要竞争赛道的序数图，依据行为改变深度和药物整合程度的证据评分。
    data:
      xAxis:
        label: 行为改变深度
        min: 1
        max: 5
        low: 低
        high: 高
        description: Ordinal score based on assigned evidence for psychology curriculum, coaching, and habit support.
        scale: ordinal
      yAxis:
        label: 临床或药物整合
        min: 1
        max: 5
        low: 低
        high: 高
        description: >-
          Ordinal score based on assigned evidence for prescribing access, clinical care, and payer-facing medical
          infrastructure.
        scale: ordinal
      points:
        - label: Noom
          x: 5
          'y': 5
          note: 心理学课程、教练服务和可选 GLP-1 服务覆盖消费者与付款方两类路径。
        - label: WeightWatchers / WW Clinic
          x: 3
          'y': 4
          note: 社群和积分模式较强，且有独立证据显示其诊所业务与 GLP-1 护理存在重叠。
        - label: Ro / Hims 式 GLP-1 远程医疗
          x: 2
          'y': 5
          note: 面向线上药物需求的直接同业，但指定证据对其深度行为课程的支持较少。
        - label: Found / Calibrate 式用药辅导
          x: 3
          'y': 4
          note: 独立评论将这些品牌列入“药物 + 辅导”的替代方案集合。
        - label: Nutrisystem
          x: 1
          'y': 1
          note: 结构化餐食配送是替代路径，但现有证据几乎不支持其具备药物或行为科学深度。
        - label: 自主追踪工具
          x: 2
          'y': 1
          note: 记录型替代工具以更低投入解决部分习惯养成需求，但没有 Noom 的临床层。
    approximationNotes: 评分为序数评分且有证据支撑，不是经过基准比较的绩效指标。评分总结指定证据描述的产品范围和上市重点，不代表任何供应商效果更优。
    claimRefs:
      - CP006
      - CP007
      - CP008
      - CP009
      - CP010
      - CP012
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据支持从成员获客、计划选择、计费、服务交付到效果方面的公司声称和留存毛利的链路，但不支持量化转化模型。
    data:
      nodes:
        - label: 成员获客 / 资格
          value: Consumer sign-up or covered-member eligibility
          detail: 公开材料显示，Noom 同时面向自费消费者获客，并提供付款方赞助的服务。
        - label: 计划选择
          value: Weight, Med, GLP-1Rx, Microdose, HRT, or employer / payer offer
          detail: Noom 目前展示多条变现路径，而非单一订阅 SKU。
        - label: 计费事件
          value: Upfront plan fee, monthly medication fee, or covered benefit
          detail: 官方定价可见，但净实现价格和报销结构不可得。
        - label: 服务交付
          value: Lessons, coaching, clinician access, and sometimes medication fulfillment
          detail: 部分方案包含临床和药物服务，因此交付成本不止软件成本。
        - label: 效果 / ROI 证据点
          value: Weight-loss, savings, or ROI claims
          detail: 公司选取的指标可见，但续约和队列经济性不可得。
        - label: 留存毛利
          value: Undisclosed
          detail: 投资判断仍取决于公开资料没有披露的利润率、留存、CAC 和资金续航数据。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI007
      - CI008
      - CI009
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Noom 展示了一套分层运营模式，把问诊、临床审核、AI 个性化和交付界面串成一条参与闭环。
    data:
      layers:
        - label: 渠道与包装层
          detail: 面向消费者的 D2C Noom Weight / Noom Med，以及面向雇主的独立 Noom Weight + GLP-1Rx 套装。
          modules:
            - Noom Weight
            - Noom Med
            - 企业 GLP-1Rx 服务
          outputs:
            - 按渠道定制的 onboarding 路径
        - label: 问诊与资格筛选层
          detail: 个性化问卷加线上健康评估，用于确定目标和用药资格。
          modules:
            - 目标与生活方式问卷
            - 健康评估
            - 临床医生资格触发器
          outputs:
            - 个性化计划
            - 审核队列
        - label: 临床与药物层
          detail: 符合资格的临床医生可在适当情况下开具品牌药物，或支持 GLP-1Rx 分级方案。
          modules:
            - 合格临床医生审核
            - 品牌 GLP-1 处方
            - 复配药物分级路径
          outputs:
            - 处方决策
            - 药物获取
        - label: 行为改变层
          detail: 课程、教练服务、社群和饮食记录构成持续培养习惯的界面。
          modules:
            - 每日课程
            - 饮食记录
            - 人工教练
            - 社群圈子
          outputs:
            - 习惯支持
            - 依从性闭环
        - label: 数据与 AI 层
          detail: Noom 称，AI 工具会将参与度和健康数据转化为个性化辅助与提醒。
          modules:
            - AI 饮食记录
            - Welli 助手
            - AI Body Scan
            - 可穿戴设备 / 生物标志物输入
          outputs:
            - 个性化洞察
            - 建议
            - 提醒
        - label: 效果与扩张层
          detail: 公司将这套技术栈定义为健康 OS，可从体重管理延伸至更多病症。
          modules:
            - 参与度效果
            - 企业节省叙事
            - 品类路线图
          outputs:
            - 交叉销售界面
            - 新病症路线图
    approximationNotes: 架构层由公司营销材料和评测文本重构；指定资料池未披露公开技术实现细节。
    claimRefs:
      - CE007
      - CE011
      - CE016
  - id: FU001
    title: 客户获客与扩张旅程
    type: journey-map
    summary: Noom 的客户旅程从自助式行为项目延伸到药物辅助护理，同时另有一条企业赞助的承保路径。
    data:
      items:
        - label: 消费者获客
          actor: 潜在个人成员
          phase: 发现
          tone: neutral
          touchpoints:
            - Noom 首页上的问卷 / 免费试用流程
            - 以心理学为基础的减重定位
        - label: Noom Weight 注册
          actor: 自费消费者
          phase: 初始转化
          tone: positive
          touchpoints:
            - 每日课程和饮食记录
            - 通过聊天进行 AI + 人工教练辅导
        - label: Med 资格评估与处方
          actor: 高意向肥胖 / 体重管理消费者
          phase: 升级销售 / 临床扩张
          tone: opportunity
          touchpoints:
            - 临床医生评估
            - GLP-1 Rx 或 Microdose GLP-1 Rx 资格
        - label: 持续参与闭环
          actor: 活跃成员
          phase: 留存
          tone: neutral
          touchpoints:
            - 体重记录和打开 App
            - 教练服务、内容和行为提醒
        - label: 企业承保路径
          actor: 雇主 / 健康险计划买方
          phase: B2B2C 分发
          tone: opportunity
          touchpoints:
            - 雇主 / 健康险计划赞助
            - 在同一平台内激活承保成员
        - label: 续约与持久性关口
          actor: Noom 收入负责人 / 赞助方
          phase: 扩张风险
          tone: risk
          touchpoints:
            - NRR / GRR / 流失率未公开
            - 评测摩擦和取消投诉可能削弱续约
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在 Noom 以药物为主导的战略遭遇合规、供应和竞争集中度的交汇处，剩余严重程度最高。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: Noom Med 合规与供应
          note: 临床审核、复配药物披露和各州可用性，都使规模化依赖受监管的执行。
          values:
            - 高
            - 严重
            - 中
        - label: 互动与留存的持久性
          note: 会员参与度越高，效果越好；但 GLP-1 停用和长期习惯能否持续，仍是核心风险。
          values:
            - 高
            - 高
            - 中
        - label: 客户运营与计费信任
          note: 定价、取消和履约方面的投诉，可能把一款增长型产品变成拒付与声誉问题。
          values:
            - 中
            - 高
            - 低
        - label: 收入集中度与远程医疗竞争
          note: 如果 Noom Med 目前贡献了大部分收入，竞争或 CAC 压力影响的将是整个公司模式，而不只是某条产品线。
          values:
            - 高
            - 严重
            - 低
        - label: 论断佐证与证据治理
          note: 同行评审论文有所帮助，但与营销叙事相比，当前 Noom Med 的持续性和经济性仍缺乏同等程度的独立披露。
          values:
            - 中
            - 高
            - 中
        - label: 支付方与雇主渠道依赖
          note: 可以看到机构端采用情况，但本次指定来源池没有公开各渠道的续约情况和单位经济性。
          values:
            - 中
            - 高
            - 中
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR007
      - CR010
      - CR012
      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 这套逻辑从已报告的运营证明出发，经过证据和价格缺口，最终得出“继续研究”的决定。
    data:
      nodes:
        - id: reported-scale
          label: 已报告规模
          value: 6.5M+ covered lives
          detail: 公司报告的触达规模带来战略潜力，但它不等同于付费客户数或收入。
        - id: reported-growth
          label: 已报告增长
          value: 50%+ revenue; Med +108% YoY
          detail: 概览没有披露该期间的基准值或绝对收入。
        - id: reported-profitability
          label: 已报告现金创造
          value: Positive EBITDA and FCF
          detail: 未提供经审计的金额、勾稽表或现金余额。
        - id: commercial-friction
          label: 商业摩擦
          value: Billing and service concerns
          detail: 第三方及竞争对手撰写的来源指出了一些问题，需要直接的队列和投诉证据来验证。
        - id: price-gap
          label: 价格证据缺口
          value: No current primary valuation
          detail: 带日期的第三方估值无法确定当前入场价格或持股经济性。
        - id: decision
          label: 决策
          value: Research more
          detail: 只有取得经审计的财务数据和当前融资条款后，才能设定估值与回报门槛。
    approximationNotes: 这套顺序是定性的；它不赋予概率、转化率或与价值成比例的宽度。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV010
      - CV016
