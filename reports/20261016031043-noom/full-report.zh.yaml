      - number: '4.3'
        title: 成本结构与资本充足性仍是核心尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              公开证据质量对投资判断最关键的部分薄弱得多。Noom
              加入医生、药物获取、教练和雇主或支付方服务后，成本栈显然比单纯软件复杂，但公司没有按产品或渠道披露毛利率。第三方融资摘要至少锚定了最近一次大型股权融资，但对累计融资总额甚至 $3.7 billion
              估值对应的轮次名称都有分歧。公开经营规模信号也不一致，同一 Tracxn 页面同时出现 1,202 名员工和低得多的实体层级人数。没有当前现金余额、消耗轨迹、债务义务或
              runway，本章可以描述变现触点，但无法排除资本充足性风险。
