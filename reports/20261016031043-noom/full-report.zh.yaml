      - CO012
      - CO013
      - CO015
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 保留的证据支持从宽泛到狭窄的市场视角，但不足以清晰推导 Noom 特定的 SAM / SOM。
    data:
      items:
        - label: 全球健康经济
          value: 4500000000000
          displayValue: $4.5T
          unit: broad adjacency lens
          note: U.S. Chamber 2021 年参考；与需求背景相关，不是 Noom 特定的 TAM。
        - label: 更广泛的医疗扩张视角
          value: 4000000000000
          displayValue: $4T
          unit: broad healthcare lens
          note: Sacra 将其定义为 Noom 若超越减重领域扩张时的外层机会。
        - label: 企业健康渠道
          value: 94000000000
          displayValue: $94B
          unit: global corporate wellness by 2026
          note: 用于雇主和健康险计划销售路径的渠道视角。
        - label: 健康老龄化邻近市场
          value: 70000000000
          displayValue: $70B
          unit: company roadmap market
          note: 公司定义的邻近市场，不代表 Noom 当前份额。
        - label: 心血管邻近市场
          value: 60000000000
          displayValue: $60B
          unit: company roadmap market
          note: 来自 2025 年概览的管线邻近市场。
        - label: 糖尿病邻近市场
          value: 30000000000
          displayValue: $30B
          unit: company roadmap market
          note: 2025 年概览中的当前 / 活跃邻近市场。
        - label: 激素健康邻近市场
          value: 10000000000
          displayValue: $10B
          unit: company roadmap market
          note: 与更年期及激素健康扩张相关的邻近市场。
        - label: 睡眠邻近市场
          value: 2000000000
          displayValue: $2B
          unit: company roadmap market
          note: 保留路线图中公司定义的最小邻近市场。
    approximationNotes: 各层混合了宽泛品类视角、渠道视角和公司定义的邻近市场；其顺序从最宽泛的公开框架到更窄的市场，并非数学意义上的 TAM / SAM / SOM 漏斗。
