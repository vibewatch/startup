  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              最大剩余风险是，Noom 在仍将自己营销为广泛行为改变平台的同时，已越来越依赖药物辅助医疗。公开材料如今把 Noom Med
              放在产品中心，第三方报道称这些产品线已占收入多数。这会提高公司对处方合规、药物供应、续药体验以及支付方或客户信任的敏感度。第二个风险是结果高度依赖参与度：Noom
              自身数据显示，应用使用更频繁的用户减重更多、维持治疗更久，而其他公开材料称许多 GLP-1 用户会停药并反弹。第三个风险是面对日益拥挤的 GLP-1
              远程医疗竞争时的执行。否决条件很直接：续药摩擦恶化、拒付或取消投诉增加、应用参与度下降，或证据显示 Noom Med 无法相对于多垂直远程医疗同行守住经济性。
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR010
              - CR012
              - CR013
