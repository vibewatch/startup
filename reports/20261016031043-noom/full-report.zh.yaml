        title: 里程碑与风险信号
        blocks:
          - type: paragraph
            body: >-
              现有证据中的里程碑脉络较为连贯：Noom 于 2008 年成立，2017 年转向 D2C 减重应用，2021 年达到最近一次可见估值里程碑，2023 年推出 Noom Med，随后在 2025-2026
              年进一步押注企业分发、GLP-1 支持和供应链控制。AskCyborg 将 2026 年的动作归因于与 Highmark 的分发合作，以及 2026 年 4 月收购 Tailor Made
              Compounding。不过，本章仍需要风险视角，因为第三方证据还指向 2022 年因试用推广和取消相关指控而达成的 $62M 和解，以及 2025 年围绕复配和微剂量 GLP-1 营销的再度审查。
