  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险或下行触发因素
    rows:
      - - 乐观
        - 报告中的增长和正向现金生成能与审计记录对上；企业客户队列保持留存；整合式护理维持参与度。
        - 在提供当前收入、利润率、净债务和入场条款前，估值区间仍不可得。
        - 若审计结果验证公司材料，且队列证据显示付费留存持久，情景更有可能成立。
        - 如果增长主要靠促销、现金生成排除了经常性成本，或药房整合增加重大合规敞口，情景将失效。
      - - 基准
        - 方向上为正面的运营声称属实，但披露仍在私域，当前价格未知。
        - 继续研究；只有主要估值标记和完全稀释持股表确定入场基础后，才纳入投资判断。
        - 这最符合当前公司声称、过时的第三方背景和未解决融资数据的组合。
        - 没有价格发现、队列透明度较弱且存在计费摩擦，使证据折价维持高位。
      - - 悲观
        - 增长或盈利声称无法对账；留存走弱；客户信任或监管压力推高获客与服务成本。
        - 避免接受锚定于无支持的历史估值的条款；在重新考虑前，量化清算和债务下行风险。
        - 若审计记录偏离已报告的方向、投诉增加，或当前融资要求优先级更高的优先权，情景更有可能成立。
        - 重大现金消耗、不利融资条款、持续流失或无法证实效果，都会击穿论点。
    notes: 情景均为条件式且未加权。由于当前输入缺失，数值概率、估值区间和目标回报有意留空，而非擅自估算。
    claimRefs:
      - CV001
