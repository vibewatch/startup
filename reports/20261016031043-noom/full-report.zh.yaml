      - number: '4.4'
        title: 结论：变现广度真实，但公开财务可见度弱
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Noom
              更像多渠道消费健康平台，而非单一应用订阅业务，这有利于需求广度，也可能支撑多级变现。风险在于，真正投资模型所需的几乎所有数字仍是私有信息：实际收入组合、按产品划分的利润率、CAC、回本周期、流失、现金、消耗和
              runway。独立负面评论已提示未来 IPO 时点可能面临获客和留存压力；公开融资和员工数信号相互冲突，也使经营基线不如品牌可见度所暗示的可靠。财务结论因此是“真实业务，公开投资判断不完整”：GLP-1
              和支付方渠道的进展可见，但资本密集度和利润率路径仍需管理层证据。
