chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >-
              Noom 目前将自己定位为一家以消费者为主导的数字健康和行为改变公司，把心理学、技术、药物和教练服务结合起来，而不是单纯的减肥应用。现有证据支持其成立于 2008 年，确认 Saeju Jeong 和 Artem
              Petakov 为联合创始人，总部位于 New York City。产品范围也已扩大：体重管理仍是切入口，但公司当前材料已将平台延伸到更长期的预防健康场景，包括糖尿病、更年期和药物支持的体重管理。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO014
