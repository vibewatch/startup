    summary: Noom 的公开里程碑显示，公司从 2008 年的行为改变起点转向 2025-2026 年的预防性健康、GLP-1 和企业分发攻势。
    data:
      items:
        - year: 2008
          label: 创立与早期研究
          detail: 创始人材料将 Noom 的起源追溯至 2008 年，并确认 Saeju Jeong 与 Artem Petakov 为联合创始人。
          claimRefs:
            - CO002
            - CO003
        - year: 2017
          label: 转向 D2C 减重 App
          detail: Sacra 称，Noom 在 2017 年从早期的 B2B 定位转向 D2C 减重 App 模式。
          claimRefs:
            - CO008
        - date: 2021-05
          label: F 轮融资形成最后一个公开估值点
          detail: Sacra 和 Grokipedia 均称，2021 年 5 月 Noom 完成 $540M 的 F 轮融资，估值 $3.7B。
          claimRefs:
            - CO011
        - date: 2023-07
          label: CEO 交接
          detail: Jeong 于 2023 年 7 月转任执行董事长，Geoff Cook 出任 CEO。
          claimRefs:
            - CO005
        - year: 2023
          label: Noom Med 上线
          detail: 第三方项目历史将 Noom Med 的上线时间定为 2023 年，标志着 Noom 进入由临床医生监督、支持 GLP-1 的远程医疗。
          claimRefs:
            - CO007
        - date: 2024-09
          label: 增加复配司美格鲁肽
          detail: Grokipedia 称，Noom 于 2024 年 9 月通过其减重产品开始提供复配司美格鲁肽。
          claimRefs:
            - CO007
        - year: 2025
          label: 企业规模与资产负债表论断出现
          detail: 2025 年 10 月的公司概览材料声称 EBITDA 和 FCF 为正、现金充足、无债务、覆盖超过 6.5M 名参保人，并与五家前 20 大健康险计划建立关系。
          claimRefs:
            - CO012
            - CO013
        - date: 2025-10
          label: 宣布与 Highmark 合作
          detail: AskCyborg 称，Highmark 的合作始于 2026 年，向近 2 million 名符合条件的成员提供 Noom 项目。
          claimRefs:
            - CO015
        - date: 2026-04
          label: 收购 Tailor Made Compounding
          detail: AskCyborg 记录了 2026 年 4 月收购 Tailor Made Compounding 的交易，以加强对 GLP-1 和 HRT 履约的控制。
          claimRefs:
            - CO015
    claimRefs:
