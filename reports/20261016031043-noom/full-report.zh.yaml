            body: >-
              Noom 自身披露清楚表明，药物获取不是简单的软件功能。公司称处方需要医生审核，部分项目药物为复配药，且“FDA
              未审核其安全性、有效性或质量”，服务也并非全国可用。这些事实不能证明当前存在违规，但意味着规模化路径必须经过逐州的医疗、药房和消费者披露控制。公司的出版物库和具名医疗领导层确实是缓释因素，但没有回答另一个法律问题：在本批工作材料中，当前法院或监管机构记录尚未解决早期
              FTC、隐私或自动续费问题的状态及财务敞口。因此，投资尽调仍需直接确认执照、投诉处理、不良事件报告、营销审核控制和任何未结消费者保护事项。
