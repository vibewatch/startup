            body: >-
              运营上，Noom 必须证明能让用户保持参与，直到药物辅助的行为改变真正稳定下来，同时还要管理处方、配送、续费和支持带来的更脆弱服务链。Noom 2026 年 2
              月的发布将更高应用参与度与更好减重和更长持续时间联系起来，这令人鼓舞，但也暴露出依赖：一旦参与度走弱，临床和商业结果可能迅速恶化。本批证据中的下行信号正指向这些失效模式。Fortune
              评论称产品缺少许多长期工具，Trustpilot 评论则提到计费摩擦、争议扣款，以及临近续费时包裹丢失。这些不是系统性失败的证明，但若 Noom Med
              的扩张速度快于服务质量，它们会成为流失、退款、监管关注和品牌损害的具体预警。
