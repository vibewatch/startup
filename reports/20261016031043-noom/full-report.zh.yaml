  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界从体重管理起步，再扩展到预防医疗
        blocks:
          - type: paragraph
            body: >-
              Noom 官方渠道和独立资料对边界的描述较一致：这不是抽象的“健康生活”，而是围绕体重管理和行为改变构建的消费者数字健康服务。Noom
              将产品栈描述为心理学、技术、药物和教练服务；独立资料仍把核心描述为订阅式减重应用，加上较新的 Noom Med
              层。纳入的支出应包括体重管理订阅、药物辅助减重项目，以及使用同一行为引擎的雇主或支付方部署。排除项应包括急症医疗、没有行为改变项目的一般健康内容，以及缺少依从性和习惯层的单纯配药。现状替代品包括卡路里追踪器、传统减重项目，以及从不同预算科目解决部分相同需求的药物优先远程医疗服务。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM010
      - number: '2.2'
        title: 公开规模证据提供多个观察角度，而非一套清晰的 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              现有证据适合相互校验，但不足以构建精确的自下而上市场模型。在最宽泛的口径上，U.S. Chamber 引用 $4.5T 的全球健康经济规模，这与消费者自助改善健康的需求方向相关，但范围太宽，不能视为 Noom 的
              TAM。Sacra 随后将叙事收窄，称市场从约 $70B 的减重行业扩展到更广泛的 $4T 医疗机会；公司 2025
              年概览则把扩张拆成糖尿病、心血管健康、激素健康、睡眠和健康老龄化等具体邻近领域。这些数字在方法上不可比，因此只能作为边界标记：它们说明 Noom 能讲出可信的市场扩张故事，但还不能证明按项目划分的 Noom 专属
              SAM 或 SOM。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM013
              - CM016
      - number: '2.3'
        title: 买方、用户和支付方随渠道变化
        blocks:
          - type: paragraph
            body: >-
              Noom 的买方结构并非单一。在传统 D2C 订阅路径中，用户同时是买方和支付方，直接购买教练、内容和行为改变支持。在 Noom Med
              中，同一终端用户还要经过医生和处方路径，可触达的支出由应用订阅扩大到药物辅助体重管理，以及潜在的药房福利或报销流程。企业路径又不同：雇主、健康计划和药企支持项目成为商业买方，而员工、成员或患者成为用户。这对估值很重要，因为采用率不再只取决于消费者品牌，还取决于
              Noom 能否向机构预算负责人证明参与度、节省和依从性收益。
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 采用驱动因素是参与度和 ROI；约束来自 SAM 不透明与商品化
        blocks:
          - type: paragraph
            body: >-
              留存证据中最强的采用驱动因素，是 Noom 将药物与行为改变结合、借助免费层和 AI
              工具扩大漏斗顶部，以及向支付方和雇主销售经济结果的能力。这些因素都支持其从应用订阅业务转向更广泛的预防医疗平台。约束同样清楚：公开证据仍未按 D2C、企业和药物业务拆分当前收入或用户，因此可变现的 SAM
              仍不透明；Sacra 还提示，AI 驱动的减重建议、GLP-1 平台拥挤、复配药监管压力和高获客成本，可能在邻近领域规模化前压缩 Noom
              当前切入口的价值。这个组合支持存在真实上行空间的估值故事，但不能建立在一个过大的 TAM 数字上。
            claimRefs:
              - CM011
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 可投资问题是渠道捕获，而不是 TAM 是否足够大
            body: 公开证据已经显示，Noom 的核心行为改变引擎周围存在大型邻近市场。尚未证明的是，Noom 能否通过 D2C 订阅、药物辅助项目和机构渠道捕获其中多少市场，同时又不披露当前按细分划分的 SAM 或 SOM。
            calloutType: insight
            claimRefs:
              - CM008
              - CM010
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合如今覆盖多种买方需求
        blocks:
          - type: paragraph
            body: >-
              现有证据显示，Noom 同时处在至少四条赛道。传统一端的 WeightWatchers 和 Nutrisystem 仍在争夺同一消费者减重预算，但运营模式不同：WW
              依靠积分、社群和线下工作坊，Nutrisystem 销售分装餐食配送。新兴一端则是 GLP-1 远程医疗，与 Ro、Hims & Hers、Found 和 Calibrate
              等同场竞争，因为买方开始把药物获取视为核心比较项。两者之下还有自助追踪这一现状替代品，类似 MyFitnessPal 的记录工具能以更低投入、通常也更低成本解决部分相同需求。因此，Noom
              已不只是与“减肥应用”竞争，而是与买方最看重的教练、社群、药物获取和价格组合竞争。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP012
      - number: '3.2'
        title: 差异化来自行为改变与药物的组合
        blocks:
          - type: paragraph
            body: >-
              Noom 的定位很明确：随着 GLP-1 药物走向主流，公司希望掌握围绕药物的“行为层”。在官网、面向雇主的材料和第三方评论中，Noom
              都被描述为一款以心理学为先的产品，并在保留传统应用的同时扩展到医生介入的药物获取。战略意义在于，Noom
              可以同时服务两种购买动机：仍想要纯行为订阅的消费者，以及希望将药物支持与依从性、饮食记录和教练服务结合的消费者或支付方。通过 Noom
              Health，这套组合还进入雇主和健康计划渠道，使竞争从单纯的应用功能比较，变成与福利买方和计划赞助商之间的分发与信任竞争。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP007
              - CP009
              - CP012
              - CP013
      - number: '3.3'
        title: 定价与包装决定 Noom 的胜负区间
        blocks:
          - type: paragraph
            body: >-
              公开定价解释了 Noom 为何处在中间位置。独立评论将纯行为产品放在大致的应用订阅价格区间，而 Noom 自己 2026 年对 Microdose GLP-1Rx 和完整 GLP-1Rx
              的定价则把买方带入完全不同的支出档位。Noom
              因此比餐食配送替代品更便宜、更灵活，但往往比简单积分会员复杂；对于只想获得药物的买方，也不一定是成本最低的路径。基于杂货采购的设计对切换成本有两面性：它让习惯更易携带、避免依赖餐食配送，但也让取消和多平台使用更容易，因为用户没有被配送食品或专有硬件锁定。实际上，Noom
              最适合希望获得一体化教练服务并保留用药选项的买方，而不是只追求最低药物渠道成本或结构最重的餐食计划。
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河有用，但并不明显持久
        blocks:
          - type: paragraph
            body: >-
              证据支持存在真实但有限的护城河。Noom 拥有知名品牌、行为改变课程、支付方渠道
              traction，以及同时覆盖习惯教练和药物支持的产品。这些优势明显强于单纯处方或通用记录应用，但还构不成硬锁定。独立评论指出教练质量投诉、定价复杂度，以及 FTC 和解留下的信任损伤；Noom
              自身材料则高度依赖公司声称的留存和基准数据，而非独立的正面比较证据。与此同时，远程医疗同行越来越能复制药物和教练外壳，Noom
              也在扩展到减重之外的预防医疗邻近领域，竞争集合因此扩大。更可能的结论是药物获取存在商品化风险，而 Noom 的上行空间取决于其参与度模式和支付方关系能否持续明显优于同行。
            claimRefs:
              - CP010
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 竞争集合扩张是 2026 年的主要变化
            body: 关键变化不是 Noom 找到了一个新对手，而是 GLP-1 采用迫使 Noom 同时面对传统减肥品牌、药物优先远程医疗和低成本追踪替代品。
            calloutType: insight
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
          - type: callout
            title: 药物获取压缩差异化
            body: Noom 的行为层确实存在，但当远程医疗同行也围绕处方提供教练服务后，价格透明度和信任就变得更重要，也更难守住。
            calloutType: risk
            claimRefs:
              - CP010
              - CP014
          - type: callout
            title: 尽调应聚焦支付方与转化证据
            body: 下一步投资判断应测试 Noom 声称的支付方分发和参与度优势，是否真的能相对于 Ro、Hims 类同行和 WW 转化为更高的赢单率、留存和单位经济。
            calloutType: recommendation
            claimRefs:
              - CP013
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式广度比已实现的收入质量更清晰
        blocks:
          - type: paragraph
            body: >-
              公开材料显示，Noom 已通过多条路径变现。公司仍以 Noom Weight 销售传统行为改变订阅，但也销售药物辅助项目、低剂量 GLP-1
              选项、品牌药物的远程医疗初诊，以及至少一次健康计划上线中的支付方覆盖服务。因此，Noom 已不能按单一 D2C 订阅 SKU
              进行投资判断；真正的问题是各条业务贡献多少收入，以及扣除临床、药房、教练和服务成本后还能留下多少毛利。官方定价页面有助于理解标价，但仍未披露实际净价、续订结构、促销折扣或渠道组合，因此不能单凭标价判断收入质量。
