evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-revenue-scale
    missingEvidence: A management-verified 2026 revenue or ARR figure, plus the metric definition and reporting period.
    whyItMatters: >-
      The current underwriting story depends on whether Noom is still primarily a legacy subscription business or
      already a scaled GLP-1 and enterprise platform.
    diligencePath: Request a current board deck or monthly business review showing revenue mix, run rate, and growth by product line.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-and-headcount-scale
    missingEvidence: A current active-member, paying-subscriber, enterprise-client, and employee count from management.
    whyItMatters: >-
      Scale claims anchor CAC efficiency, operating leverage, and whether enterprise traction is large enough to offset
      any consumer weakness.
    diligencePath: >-
      Ask management for the latest KPI sheet covering active users, payers, enterprise lives, employer count, and fully
      loaded headcount.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-governance
    missingEvidence: >-
      Current ownership percentages, board composition, liquidation preferences, and investor rights since the 2021
      round.
    whyItMatters: >-
      The visible valuation benchmark is stale, so current control and dilution terms matter to any realistic view of
      exit economics.
    diligencePath: >-
      Request the current cap table, board list, and major investor-rights summary alongside any internal valuation or
      409A history.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO009
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 leadership coverage
    missingEvidence: A current board roster plus a complete executive org chart beyond the subset named in the assigned public sources.
    whyItMatters: >-
      The leadership table is intentionally partial, so hidden vacancies, board changes, or role churn could materially
      change the governance read.
    diligencePath: Request the latest leadership org chart and board list, then reconcile them against the public About Us page.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Current program mix, active member counts by product, and channel-level conversion or penetration data for D2C,
      Noom Med, and enterprise deployments.
    whyItMatters: >-
      Without this evidence, public sources cannot isolate a present-day Noom-specific SAM or SOM from broader category
      TAMs.
    diligencePath: >-
      Request current member and revenue mix by channel plus employer, health-plan, and pharma-partner deployment counts
      from management.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: stale
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Updated independent 2026 market work aligned to digital weight management, GLP-1 support services, and employer
      obesity-management budgets.
    whyItMatters: >-
      The retained public sizing lenses come from different dates and category definitions, so they are informative but
      not directly comparable.
    diligencePath: >-
      Add current independent analyst or industry reports that segment digital weight management, medication support,
      and employer or payer obesity programs on a like-for-like basis.
    relatedQuestionRefs:
      - QM002
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: >-
      Current win rates, conversion, retention, and NPS by segment versus Ro, Hims & Hers, WW Clinic, and
      employer-channel alternatives.
    whyItMatters: >-
      Without this, payer-channel and engagement claims cannot be translated into durable competitive advantage or
      underwriting confidence.
    diligencePath: >-
      Request current cohort retention, conversion, CAC, and win-loss data split across Noom Weight, Noom Med, and payer
      channels.
    relatedQuestionRefs:
      - QP004
      - QP005
  - type: missing-source
    severity: material
    topic: peer-pricing
    missingEvidence: >-
      Current public pricing and packaging for Ro, Hims & Hers, Found, and Calibrate were not retained in the assigned
      pool.
    whyItMatters: >-
      Price is one of the main buyer tradeoffs in GLP-1 telehealth, so missing competitor pricing weakens the packaging
      comparison.
    diligencePath: Retain current public pricing pages or reputable 2026 comparisons for each named telehealth peer.
    relatedQuestionRefs:
      - QP003
      - QP006
    relatedTableRefs:
      - TP003
  - type: stale
    severity: material
    topic: comparative-benchmarking
    missingEvidence: Independent head-to-head evidence for Noom's retention, outcomes, and payer-enrollment claims versus peers.
    whyItMatters: >-
      Company-stated comparative metrics can shape valuation and moat judgments, but the assigned evidence frames some
      comparisons as contextual rather than clinical or causal.
    diligencePath: >-
      Seek independent panel data, customer interviews, or payer procurement evidence that validates or challenges the
      benchmark claims.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP001
      - FP001
  - type: missing-source
    severity: minor
    topic: status-quo-alternatives
    missingEvidence: >-
      Public evidence on internal-build, primary-care, and offline-clinic alternatives was not retained in the assigned
      pool.
    whyItMatters: Those alternatives affect the true market boundary even when they are not direct branded app competitors.
    diligencePath: Add procurement, primary-care, and obesity-clinic sources in a later pass to widen the substitute map.
    relatedQuestionRefs:
      - QP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Product-level gross margin, clinician and pharmacy cost, CAC, payback, and paid-retention cohorts by major SKU and
      channel.
    whyItMatters: Margin path and capital efficiency cannot be underwritten from list pricing or company-selected outcomes alone.
    diligencePath: Request monthly cohort and contribution-margin reporting for Weight, Med, GLP-1, and payer or employer contracts.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-runway
    missingEvidence: Current cash balance, monthly burn, debt or working-capital facilities, and base or downside runway.
    whyItMatters: Capital adequacy and next-round dependency cannot be judged without direct liquidity evidence.
    diligencePath: Obtain CFO cash bridge, debt schedule, and board-approved operating plan with runway sensitivities.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding-baseline
    missingEvidence: >-
      A reconciled financing history with total capital raised, latest round label, valuation, and current fully diluted
      ownership.
    whyItMatters: >-
      Conflicting public funding summaries weaken the starting point for dilution, valuation, and balance-sheet
      analysis.
    diligencePath: >-
      Request signed financing history, cap-table summary, and the most recent board materials used for fundraising or
      liquidity planning.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: security-privacy-controls
    missingEvidence: >-
      Public security documentation such as status page history, privacy/security whitepaper, audit/certification
      detail, or trust-center controls.
    whyItMatters: >-
      The chapter can describe packaging and workflow, but it cannot validate reliability, data-governance, or
      operational resilience without primary trust artifacts.
    diligencePath: >-
      Request current SOC/HIPAA/privacy-control materials, public status history, and any customer-facing trust/security
      documentation from management.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer or practitioner signal such as API docs, public integrations, GitHub/package activity,
      engineering talks, or professional-community proxy evidence.
    whyItMatters: >-
      Product-tech evidence strategy calls for developer-signal or a practitioner proxy; without it, it is harder to
      judge implementation depth and ecosystem adoption.
    diligencePath: >-
      Ask management for API/integration materials and pull practitioner references from partner implementation docs or
      public engineering talks.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: service-operations
    missingEvidence: >-
      Support response-time metrics, clinician-capacity data, state-by-state availability, and reliability/SLA metrics
      for chat-based care.
    whyItMatters: >-
      Chat-heavy service delivery is a real part of the product, but public proof is insufficient to underwrite scale,
      quality, or escalation performance.
    diligencePath: Request operational KPI dashboards and current service-level reporting by channel and geography.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Current GRR, NRR, churn, renewal curves, and cohort retention split between Noom Weight, Noom Med, and
      enterprise-sponsored populations.
    whyItMatters: >-
      Without those disclosures, visible customer reach cannot be translated into durable revenue quality or expansion
      economics.
    diligencePath: >-
      Request cohort dashboards or board materials showing monthly active paid members, churn, and renewal by segment
      for the last 12 months.
    relatedQuestionRefs:
      - QU004
      - QU005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top employer, health-plan, and partner concentration by covered lives, revenue, and renewal timing.
    whyItMatters: >-
      A few outsized sponsors could make the enterprise and payer channel look broad while remaining economically
      concentrated.
    diligencePath: >-
      Request a customer concentration schedule with top 10 accounts, contract terms, and revenue / covered-life
      contribution.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table coverage
    missingEvidence: >-
      Named enterprise customers, health plans, or public procurement records that verify sponsor-side production
      deployments rather than only member testimonials.
    whyItMatters: >-
      The current named-proof set demonstrates real end-user stories but does not verify employer or payer expansion
      quality.
    diligencePath: >-
      Ask Noom for permissioned case studies, named sponsor references, or public partner announcements with deployment
      scale and renewal status.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-register
    missingEvidence: >-
      Exhaustive current docket, regulator, and settlement evidence covering FTC, privacy, auto-renewal, and
      pharmacy-related exposure.
    whyItMatters: >-
      The legal register is severity-ranked but sample-based; undisclosed or unresolved matters could change the
      downside case materially.
    diligencePath: >-
      Pull federal and state court dockets, regulator releases, archived terms changes, and any settlement or reserve
      disclosures, then refresh TR001.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: fulfillment-and-support-ops
    missingEvidence: >-
      Medication fulfillment SLAs, lost-shipment rates, refund rates, cancellation completion rates, and
      support-resolution metrics.
    whyItMatters: >-
      Customer complaints are visible, but without internal operating metrics it is impossible to determine whether
      anecdotal issues are isolated or structurally harmful to retention economics.
    diligencePath: >-
      Request pharmacy and shipping vendor scorecards, chargeback data, CSAT or NPS trends, and month-by-month complaint
      volumes for Noom Med.
    relatedQuestionRefs:
      - QR003
      - QR006
  - type: missing-source
    severity: material
    topic: cohort-economics
    missingEvidence: >-
      Current independent retention, churn, CAC payback, contribution margin, and channel-mix data for Noom Med versus
      legacy subscription products.
    whyItMatters: >-
      Public evidence suggests a medication-led pivot and historical ad intensity, but does not prove the current model
      is durable or efficient.
    diligencePath: >-
      Request 2025-2026 cohort tables by product and channel, plus current gross margin and acquisition-payback
      reporting.
    relatedQuestionRefs:
      - QR005
      - QR007
  - type: private-evidence-only
    severity: material
    topic: valuation evidence gap
    missingEvidence: Audited current revenue, gross margin, EBITDA, free cash flow, cash, debt, and a primary current valuation mark.
    whyItMatters: These inputs are necessary to calculate enterprise value, entry multiples, downside, and target returns.
    diligencePath: >-
      Obtain audited 2024-2026 financials, monthly management accounts, bank and debt statements, and the latest
      priced-round, 409A, or arm's-length secondary documentation.
    relatedQuestionRefs:
      - QV006
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: financing terms
    missingEvidence: >-
      Fully diluted cap table, option and warrant schedules, liquidation preferences, participation rights, senior debt,
      and proposed new-money terms.
    whyItMatters: Headline valuation does not determine investor ownership, preference-adjusted proceeds, or dilution.
    diligencePath: >-
      Review the charter, investor rights agreements, debt documents, capitalization ledger, and a preference waterfall
      under bull, base, and bear exits.
    relatedQuestionRefs:
      - QV003
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: exit readiness
    missingEvidence: >-
      Board-approved exit plan, banker materials, audited-control readiness, buyer or underwriter feedback, and
      secondary-liquidity evidence.
    whyItMatters: Covered-life reach and product breadth do not independently establish timing, demand, or realizable exit value.
    diligencePath: >-
      Interview the board and finance leadership, inspect audit and control workpapers, and review any banker, buyer, or
      secondary-market indications.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV003
