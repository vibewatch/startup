company:
  name: "Noom"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Noom is now positioning itself less as a single weight-loss app and more as a behavior-change and preventive-health platform that layers coaching, AI, and GLP-1-enabled telehealth on top of its legacy psychology-led program. The company still carries a 2021 private-market mark of $3.7B, but the assigned evidence leaves current revenue, customer count, and cap-table economics only partially visible even as company materials claim positive EBITDA, no debt, and meaningful enterprise scale."
sections:
  - id: "identity-and-positioning"
    title: "Identity and positioning"
    body: "Noom currently presents itself as a consumer-led digital health and behavior-change company that combines psychology, technology, medication, and coaching rather than as a standalone dieting app. The assigned evidence supports a founding date of 2008, identifies Saeju Jeong and Artem Petakov as the co-founders, and places headquarters in New York City. Product scope has also broadened: weight management remains the core wedge, but current company materials frame the platform around longer-term preventive-health use cases including diabetes, menopause, and medication-supported weight care."
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO007", "CO014"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: "Leadership has clearly transitioned from founder-led execution to an operator-led structure. Third-party history pages say Jeong moved from CEO to executive chairman in July 2023 while Geoff Cook became CEO, and the current leadership page shows a reasonably complete bench across technology, finance, product, medical, commercial, legal, strategy, and people operations. That breadth reduces single-function execution risk, but key-person dependence remains material around Cook's current operating cadence and Jeong's founder narrative, especially as Noom tries to reposition the business around GLP-1-adjacent preventive care."
    claimRefs: ["CO005", "CO006", "CO014"]
    tableRefs: ["TO002"]
  - id: "funding-scale-and-stakeholders"
    title: "Funding, scale, and stakeholder picture"
    body: "The capital story is easy to date but harder to refresh. Independent sources cluster total historical funding near $657M-$658M and place the last priced financing at a $540M Series F in May 2021 that valued Noom at $3.7B; assigned sources do not provide a newer priced round. Operating quality is more mixed: Sacra's $1B 2023 ARR figure is an external estimate rather than a company disclosure, while official 2025 overview materials claim positive EBITDA, free cash flow, substantial cash, no debt, more than 6.5 million covered lives, hundreds of employer clients, and relationships with five of the top 20 U.S. health plans. Those claims suggest real scale, but they are not enough to close gaps on current revenue basis, subscriber count, or ownership dilution."
    claimRefs: ["CO008", "CO009", "CO010", "CO011", "CO012", "CO013"]
    tableRefs: ["TO003"]
  - id: "milestones-and-risk-signals"
    title: "Milestones and risk signals"
    body: "The milestone arc in the assigned pool is coherent: Noom started in 2008, pivoted toward a D2C weight-loss app in 2017, reached its last visible valuation milestone in 2021, launched Noom Med in 2023, and then spent 2025-2026 leaning harder into enterprise distribution, GLP-1 support, and supply-chain control. AskCyborg attributes 2026 moves to a Highmark distribution partnership and an April 2026 Tailor Made Compounding acquisition. The same chapter still needs a risk lens, however, because assigned third-party evidence also points to a $62M 2022 settlement over trial-promotion and cancellation allegations plus renewed 2025 scrutiny around compounded and microdosed GLP-1 marketing."
    claimRefs: ["CO005", "CO007", "CO008", "CO011", "CO015", "CO016"]
    figureRefs: ["FO001"]
