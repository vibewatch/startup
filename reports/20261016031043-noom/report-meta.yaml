companyProfile:
  summary: >-
    Noom is a late-stage private consumer-health company that has evolved from a psychology-led weight-loss app into a
    broader behavior-change and preventive-care platform spanning Noom Weight, Noom Med, and employer / health-plan
    channels. The public evidence supports meaningful scale and commercial breadth, but the company still does not fully
    disclose current revenue, cash, or ownership terms, so underwriting remains dependent on third-party estimates and
    company-authored operating claims.
