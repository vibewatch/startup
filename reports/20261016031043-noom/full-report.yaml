  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of the main competitive lanes using evidence-backed scoring for behavior-change depth and medication
      integration.
    data:
      xAxis:
        label: Behavior-change depth
        min: 1
        max: 5
        low: Low
        high: High
        description: Ordinal score based on assigned evidence for psychology curriculum, coaching, and habit support.
        scale: ordinal
      yAxis:
        label: Clinical or medication integration
        min: 1
        max: 5
        low: Low
        high: High
        description: >-
          Ordinal score based on assigned evidence for prescribing access, clinical care, and payer-facing medical
          infrastructure.
        scale: ordinal
      points:
        - label: Noom
          x: 5
          'y': 5
          note: Psychology curriculum, coaching, and optional GLP-1 access span both consumer and payer motions.
        - label: WeightWatchers / WW Clinic
          x: 3
          'y': 4
          note: Strong community and points model with independent evidence of clinic overlap in GLP-1 care.
        - label: Ro / Hims-style GLP-1 telehealth
          x: 2
          'y': 5
          note: >-
            Direct peer set for online medication demand, but assigned evidence retains less proof of deep behavior
            curriculum.
        - label: Found / Calibrate-style medication coaching
          x: 3
          'y': 4
          note: Independent commentary places these brands in the medication-plus-coaching alternative set.
        - label: Nutrisystem
          x: 1
          'y': 1
          note: >-
            Structured meal delivery is a substitute route with little evidence here of medication or behavior-science
            depth.
        - label: Self-directed trackers
          x: 2
          'y': 1
          note: Logging substitutes solve part of the habit job at lower commitment but without Noom's clinical layer.
    approximationNotes: >-
      Scores are ordinal and evidence-backed, not benchmarked performance metrics. They summarize product scope and
      go-to-market emphasis described in assigned evidence rather than claiming superior outcomes for any vendor.
