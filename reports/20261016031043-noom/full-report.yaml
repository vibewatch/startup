      - number: '1.3'
        title: Funding, scale, and stakeholder picture
        blocks:
          - type: paragraph
            body: >-
              The capital story is easy to date but harder to refresh. Independent sources cluster total historical
              funding near $657M-$658M and place the last priced financing at a $540M Series F in May 2021 that valued
              Noom at $3.7B; assigned sources do not provide a newer priced round. Operating quality is more mixed:
              Sacra's $1B 2023 ARR figure is an external estimate rather than a company disclosure, while official 2025
              overview materials claim positive EBITDA, free cash flow, substantial cash, no debt, more than 6.5 million
              covered lives, hundreds of employer clients, and relationships with five of the top 20 U.S. health plans.
              Those claims suggest real scale, but they are not enough to close gaps on current revenue basis,
