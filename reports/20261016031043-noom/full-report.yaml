      - number: '5.2'
        title: Workflow, architecture, and service delivery
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to a service workflow that blends software, human support, and clinical
              review. Fortune's hands-on test says Noom Med begins with an online health assessment reviewed by a
              licensed clinician, while Noom's own site says members receive AI and human-led coaching via chat and,
              when appropriate, access to qualified prescribers. The October 2025 company overview extends that
              user-facing flow into an operating architecture: diagnostics, wearable data, pharmacy/distribution,
              clinical care, and app-derived behavior data feed a personalized-plan layer and then a set of AI-supported
              interventions such as goals, treatments, content, insights, recommendations, and nudges. That is a real
              architecture claim, but it is still marketing-surface evidence rather than technical documentation or
              public implementation detail.
