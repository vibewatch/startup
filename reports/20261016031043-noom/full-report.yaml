  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - Noom reports more than 6.5 million covered lives.
        - Verify activation, paid enrollment, retention, and revenue per covered life.
      - - Thesis
        - Noom reports relationships with major health plans and hundreds of enterprise clients.
        - Obtain customer-level concentration, contract duration, renewal, and pipeline evidence.
      - - Thesis
        - The platform combines behavioral support, clinical care, and medication.
        - Show cohort outcomes and contribution margin by product rather than blended claims.
      - - Anti-thesis
        - An independent review reports quarterly-billing and cancellation friction.
        - Reconcile checkout disclosures, refund data, complaints, and churn by billing cohort.
      - - Anti-thesis
        - A competitor-authored review reports recurring coaching-quality concerns.
        - Review coach caseloads, response times, reassignment rates, and customer satisfaction trends.
      - - Anti-thesis
        - Public valuation references are dated and do not establish current terms.
        - Provide the latest priced-round, 409A, or arm's-length secondary documentation.
    notes: >-
      Company scale and product claims are not treated as independently verified; the adverse sources are retained with
      their issuer relationships and limitations visible.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV010
      - CV014
      - CV015
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Key risks or downside trigger
    rows:
      - - Bull
        - >-
          Reported growth and positive cash generation reconcile to audited records; enterprise cohorts retain;
          integrated care sustains engagement.
        - A range remains unavailable until current revenue, margin, net debt, and entry terms are supplied.
        - Stronger if audited results validate the company deck and cohort evidence shows durable paid retention.
        - >-
          Breaks if growth is promotional, cash generation excludes recurring costs, or pharmacy integration adds
          material compliance exposure.
      - - Base
        - Directionally positive operating claims are real, but disclosure remains private and current price is unknown.
        - >-
          Research-more; underwrite only after a primary valuation mark and fully diluted ownership schedule establish
          an entry basis.
        - >-
          Most consistent with the present mix of company claims, dated third-party context, and unresolved financing
          data.
        - No price discovery, weak cohort transparency, and billing friction keep the evidence discount high.
      - - Bear
        - >-
          Growth or profitability claims fail to reconcile; retention weakens; customer trust or regulatory pressure
          raises acquisition and servicing costs.
        - >-
          Avoid at terms anchored to unsupported historical marks; quantify liquidation and debt downside before
          reconsideration.
        - >-
          Stronger if audited records miss reported direction, complaints rise, or current financing requires senior
          preferences.
        - >-
          Thesis break occurs on material cash burn, adverse financing terms, sustained churn, or inability to
          substantiate outcomes.
    notes: >-
      Cases are conditional and unweighted. Numerical probabilities, valuation ranges, and target returns are
      intentionally left unavailable rather than estimated without current inputs.
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV008
      - CV009
