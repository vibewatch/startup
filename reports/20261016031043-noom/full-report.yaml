      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Leadership has clearly transitioned from founder-led execution to an operator-led structure. Third-party
              history pages say Jeong moved from CEO to executive chairman in July 2023 while Geoff Cook became CEO, and
              the current leadership page shows a reasonably complete bench across technology, finance, product,
              medical, commercial, legal, strategy, and people operations. That breadth reduces single-function
              execution risk, but key-person dependence remains material around Cook's current operating cadence and
              Jeong's founder narrative, especially as Noom tries to reposition the business around GLP-1-adjacent
              preventive care.
