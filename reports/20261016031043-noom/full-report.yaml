  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / channel
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Medication supply and prescribing network
        - Clinicians, pharmacies, and telehealth workflow vendors
        - Prescribe, dispense, and support Noom Med
        - High
        - Supply, compliance, or service failure breaks the flagship offer
        - Critical
        - Public disclosures, clinical leadership, and pharmacy operations ownership
        - Dependence remains high because the offer is increasingly medication-led
      - - Health-plan and employer channel
        - Payers and enterprise clients
        - Sponsor or distribute covered solutions
        - Medium
        - Renewal loss or weak outcomes compress B2B growth credibility
        - High
        - Payer traction and employer studies show some institutional adoption
        - Public pool lacks current renewal, cohort, and pricing disclosure by channel
      - - Noom Med revenue concentration and telehealth rivalry
        - Consumers versus Hims & Hers, Ro, and similar telehealth peers
        - Drives growth and revenue mix
        - High
        - CAC rises or differentiation narrows before retention economics are proven
        - Critical
        - Brand, coaching, and behavior-change layer may support differentiation
        - Current margin, CAC payback, and competitive win-rate data are undisclosed
    notes: >-
      Concentration is directional because the public pool discloses dependency signals but not partner-level revenue
      shares or contract terms.
