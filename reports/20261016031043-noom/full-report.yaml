      - CU004
      - CU013
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual severity is highest where Noom's medication-led strategy meets compliance, supply, and competitive
      concentration.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
      rows:
