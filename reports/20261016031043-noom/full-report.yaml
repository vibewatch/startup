  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >-
              Noom currently presents itself as a consumer-led digital health and behavior-change company that combines
              psychology, technology, medication, and coaching rather than as a standalone dieting app. The assigned
              evidence supports a founding date of 2008, identifies Saeju Jeong and Artem Petakov as the co-founders,
              and places headquarters in New York City. Product scope has also broadened: weight management remains the
              core wedge, but current company materials frame the platform around longer-term preventive-health use
              cases including diabetes, menopause, and medication-supported weight care.
