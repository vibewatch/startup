  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a sequence from member acquisition to plan selection, billing, service delivery, outcomes
      claims, and retained gross profit, but not a quantified conversion model.
    data:
      nodes:
        - label: Member acquisition / eligibility
          value: Consumer sign-up or covered-member eligibility
          detail: Public materials show both self-pay consumer acquisition and payer-sponsored availability.
        - label: Plan selection
          value: Weight, Med, GLP-1Rx, Microdose, HRT, or employer / payer offer
          detail: Noom now presents multiple monetization paths rather than one subscription SKU.
        - label: Billing event
