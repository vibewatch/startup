  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary starts with weight management, then widens into preventive care
        blocks:
          - type: paragraph
            body: >-
              The consistent boundary across Noom's official surfaces and independent profiles is not "wellness" in the
              abstract; it is consumer-led digital health built around weight management and behavior change. Noom
              frames the product stack as psychology, technology, medication, and coaching, while independent profiles
              still describe the core as a subscription weight-loss app plus the newer Noom Med layer. That means the
              included spend is weight-management subscriptions, medication-assisted weight-loss programs, and related
              employer or payer deployments that use the same behavior engine. Excluded spend should remain acute care,
              general wellness content with no behavior-change program, and medication dispensing without the adherence
              and habit layer. Status-quo substitutes therefore include calorie trackers, legacy weight-loss programs,
              and medication-first telehealth offers that solve parts of the same job from different budget lines.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM010
      - number: '2.2'
        title: Public sizing evidence supports multiple lenses rather than one clean TAM/SAM/SOM stack
        blocks:
          - type: paragraph
            body: >-
              The evidence base is useful for triangulation but not for a precise bottom-up market model. At the
              broadest edge, U.S. Chamber cites a $4.5T global wellness economy, which is directionally relevant to
              demand for self-directed health improvement but far too broad to treat as Noom's TAM. Sacra then narrows
              the thesis by describing a jump from a roughly $70B weight-loss industry to a broader $4T healthcare
              opportunity, while the company's own 2025 overview breaks the expansion story into specific adjacencies
              such as diabetes, cardiovascular health, hormonal health, sleep, and healthy aging. Those figures are not
              methodologically comparable, so they should be treated as boundary markers: they show that Noom can tell a
              credible market-expansion story, but not that public sources can yet prove a current Noom-specific SAM or
              SOM by program.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM013
              - CM016
      - number: '2.3'
        title: Buyer, user, and payer shift by channel
        blocks:
          - type: paragraph
            body: >-
              Noom's buyer map is not one-dimensional. In the classic D2C subscription path, the user is also the buyer
              and payer, purchasing coaching, content, and behavior-change support directly. In Noom Med, the same end
              user adds a clinician and prescription pathway, which broadens the addressable spend from app
              subscriptions toward medication-assisted weight management and potentially pharmacy-benefit or
              reimbursement workflows. The enterprise path is different again: employers, health plans, and
              pharma-support programs become the commercial buyer, while the employee, member, or patient becomes the
              user. That matters for valuation because adoption depends less on consumer brand alone and more on whether
              Noom can prove engagement, savings, and adherence benefits to institutional budget owners.
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Adoption drivers are engagement and ROI; constraints are SAM opacity and commoditization
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers in the retained evidence are Noom's ability to pair medication with
              behavior change, widen the top of funnel through a free tier and AI tools, and sell economic outcomes to
              payers and employers. Those drivers all support a category shift from an app-based subscription business
              toward a broader preventive-care platform. The main constraints are equally clear: public evidence still
              does not separate current revenue or users by D2C, enterprise, and medication lines, so the monetizable
              SAM remains opaque; and Sacra flags the risk that AI-driven weight-loss advice, GLP-1 platform crowding,
              regulatory pressure on compounded medications, and high acquisition costs could compress the value of
              Noom's current wedge before the adjacencies scale. That mix supports a valuation story with real upside,
              but not one that can rest on a single oversized TAM number.
            claimRefs:
              - CM011
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable question is channel capture, not whether the TAM is large
            body: >-
              Public evidence already shows large adjacent markets around Noom's core behavior-change engine. What
              remains unproven is how much of those markets Noom can capture through D2C subscriptions,
              medication-assisted programs, and institutional channels without disclosing a current segment-level SAM or
              SOM.
            calloutType: insight
            claimRefs:
              - CM008
              - CM010
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set now spans several buyer jobs
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence shows Noom competing in at least four different lanes at once. At the legacy end,
              WeightWatchers and Nutrisystem still address the same consumer weight-loss budget, but they do so through
              different operating models: WW leans on points, community, and workshops, while Nutrisystem sells
              pre-portioned meal delivery. At the newer end, Noom now sits inside the GLP-1 telehealth set alongside
              peers such as Ro, Hims & Hers, Found, and Calibrate, because medication access has become a primary
              feature buyers compare. Below both of those sits the status quo substitute of self-directed tracking,
              where MyFitnessPal-like logging can solve part of the same job at lower commitment and often lower cost.
              That matters because Noom is no longer winning or losing only against "diet apps"; it is being compared
              against whichever mix of coaching, community, medication access, and price the buyer values most.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP012
      - number: '3.2'
        title: Differentiation comes from the behavior-plus-medication bundle
        blocks:
          - type: paragraph
            body: >-
              Noom's own positioning is explicit: as GLP-1 medications go mainstream, the company wants to own the
              "behavior layer" that surrounds them. Across its public site, employer-facing materials, and third-party
              reviews, Noom is described as a psychology-first product that has expanded into clinician-mediated
              medication access rather than abandoning its legacy app. That is strategically important because it lets
              Noom sell into two buying motions at once: consumers who still want a behavior-only subscription and
              consumers or payers who want medication support paired with adherence, food logging, and coaching. The
              same bundle also extends into employer and health-plan channels through Noom Health, which turns
              competition from a pure app-feature contest into a distribution and trust contest with benefits buyers and
              plan sponsors.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP007
              - CP009
              - CP012
              - CP013
      - number: '3.3'
        title: Pricing and packaging define where Noom wins and where it loses
        blocks:
          - type: paragraph
            body: >-
              Public pricing shows why Noom occupies a middle position. Independent reviews place the behavior-only
              product in a roughly app-subscription range, while Noom's own 2026 pricing for Microdose GLP-1Rx and full
              GLP-1Rx moves the buyer into a very different spend bracket. That leaves Noom cheaper and more flexible
              than meal-delivery substitutes, but often more complex than a simple points membership and not necessarily
              the lowest-cost path for buyers who only want pharmaceutical access. The grocery-based design also cuts
              both ways on switching cost: it keeps habits portable and avoids meal-delivery dependency, yet it makes
              cancellation and multi-homing easier because users are not locked into shipped food or a proprietary
              hardware stack. In practice, Noom seems best aligned with buyers who want integrated coaching plus an
              optional medication path rather than the cheapest drug channel or the highest-structure meal plan.
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP011
              - CP012
      - number: '3.4'
        title: The moat is useful but not obviously durable
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a real, but limited, moat. Noom has a recognizable brand, a behavior-change
              curriculum, payer-channel traction, and a product that spans both habit coaching and medication support.
              Those are meaningful advantages over a bare prescription or a generic logging app. But they do not amount
              to hard lock-in. Independent commentary points to coach-quality complaints, pricing complexity, and the
              lingering trust hit from the FTC settlement, while Noom's own materials rely heavily on company-generated
              retention and benchmark claims rather than independent head-to-head proof. At the same time, telehealth
              peers can increasingly replicate the medication and coaching wrapper, and Noom itself is broadening into
              adjacent preventive-care categories that enlarge the rival set beyond weight loss alone. The likely
              conclusion is commoditization risk around drug access, with Noom's upside resting on whether its
              engagement model and payer relationships stay meaningfully better than peers.
            claimRefs:
              - CP010
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Competitive set expansion is the main 2026 change
            body: >-
              The key shift is not that Noom found one new rival; it is that GLP-1 adoption forced Noom into
              simultaneous competition with legacy diet brands, medication-first telehealth, and low-cost tracking
              substitutes.
            calloutType: insight
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
          - type: callout
            title: Medication access compresses differentiation
            body: >-
              Noom's behavior layer is real, but once telehealth peers also offer coaching around prescribing, price
              transparency and trust become more important and harder to defend.
            calloutType: risk
            claimRefs:
              - CP010
              - CP014
          - type: callout
            title: Diligence should focus on payer and conversion proof
            body: >-
              The next underwriting step is to test whether Noom's claimed payer distribution and engagement advantages
              actually convert into superior win rates, retention, and unit economics against Ro, Hims-style peers, and
              WW.
            calloutType: recommendation
            claimRefs:
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model breadth is clearer than realized revenue quality
        blocks:
          - type: paragraph
            body: >-
              Public materials now show Noom monetizing through more than one path. The company still sells classic
              behavior-change subscriptions under Noom Weight, but it also sells medication-assisted programs,
              lower-dose GLP-1 options, telehealth intake for branded medications, and covered payer-sponsored access in
              at least one health-plan launch. That matters because Noom is no longer underwritten as a single DTC
              subscription SKU; the real question is how much revenue comes from each stream and how much gross profit
              survives clinical, pharmacy, coaching, and servicing costs. The official pricing surfaces are useful for
              list-price framing, but they still do not disclose realized net pricing, renewal mix, promotional
              discounts, or channel mix, so list price cannot be treated as revenue quality on its own.
            claimRefs:
