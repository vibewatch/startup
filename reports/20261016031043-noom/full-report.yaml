            Clinician review, compounded-drug disclosures, and state availability all make scale dependent on regulated
            execution.
          values:
            - High
            - Critical
            - Medium
        - label: Engagement and retention durability
          note: >-
            Outcomes improve when members engage more, but GLP-1 discontinuation and long-term habit durability remain
            central risks.
          values:
            - High
            - High
            - Medium
        - label: Customer operations and billing trust
          note: >-
            Complaints about pricing, cancellation, and fulfillment can turn a growth product into a chargeback and
            reputation problem.
          values:
            - Medium
            - High
            - Low
        - label: Revenue concentration and telehealth competition
