  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The logic moves from reported operating proof through evidence and price gaps to a research-more decision.
    data:
      nodes:
        - id: reported-scale
          label: Reported scale
          value: 6.5M+ covered lives
          detail: Company-reported reach creates strategic potential but is not the same as paid customers or revenue.
        - id: reported-growth
          label: Reported growth
          value: 50%+ revenue; Med +108% YoY
          detail: The overview does not disclose the period baseline or absolute revenue.
        - id: reported-profitability
          label: Reported cash generation
          value: Positive EBITDA and FCF
          detail: No audited amounts, reconciliation, or cash balance are provided.
        - id: commercial-friction
          label: Commercial friction
          value: Billing and service concerns
          detail: Third-party and competitor-authored sources flag issues that require direct cohort and complaint evidence.
        - id: price-gap
          label: Price evidence gap
          value: No current primary valuation
          detail: Dated third-party marks cannot establish today's entry price or ownership economics.
        - id: decision
          label: Decision
          value: Research more
          detail: Set valuation and return thresholds only after audited financials and current financing terms are obtained.
    approximationNotes: The sequence is qualitative; it does not assign probabilities, conversion rates, or value-proportional widths.
