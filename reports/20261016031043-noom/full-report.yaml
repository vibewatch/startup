  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Noom presents a layered operating model that ties intake, clinical review, AI personalization, and delivery
      surfaces into one engagement loop.
    data:
      layers:
        - label: Channel and packaging layer
          detail: Consumer D2C Noom Weight / Noom Med and a separate employer-facing Noom Weight + GLP-1Rx bundle.
          modules:
            - Noom Weight
            - Noom Med
            - Enterprise GLP-1Rx access
          outputs:
            - Channel-specific onboarding path
        - label: Intake and qualification layer
          detail: Personalized quiz plus online health assessment establish goals and medication eligibility.
          modules:
            - Goal and lifestyle quiz
            - Health assessment
            - Clinician eligibility trigger
          outputs:
            - Personalized plan
            - Review queue
        - label: Clinical and medication layer
          detail: Qualified clinicians can prescribe branded medications or support GLP-1Rx tiers when appropriate.
          modules:
            - Qualified clinician review
            - Branded GLP-1 prescribing
            - Compounded-tier pathway
          outputs:
            - Prescription decision
            - Medication access
        - label: Behavior-change layer
          detail: Curriculum, coaching, community, and food logging are the persistent habit-formation surface.
          modules:
            - Daily lessons
            - Food logging
            - Human coaching
            - Community circles
          outputs:
            - Habit support
            - Adherence loop
        - label: Data and AI layer
          detail: Noom says AI tools convert engagement and health data into personalized assistance and nudges.
          modules:
            - AI food logging
            - Welli assistant
            - AI Body Scan
            - Wearable / biomarker inputs
          outputs:
            - Personalized insights
            - Recommendations
            - Nudges
        - label: Outcomes and expansion layer
          detail: The company frames the stack as a health OS that can extend beyond weight into additional conditions.
          modules:
            - Engagement outcomes
            - Enterprise savings narrative
            - Category roadmap
          outputs:
            - Cross-sell surfaces
            - New-condition roadmap
    approximationNotes: >-
      Architectural layers are reconstructed from company marketing and review text; public technical implementation
      details are not disclosed in the assigned pool.
    claimRefs:
      - CE007
      - CE011
      - CE016
  - id: FU001
    title: Customer acquisition and expansion journey
    type: journey-map
    summary: >-
      Noom's customer journey runs from self-serve behavioral programs into medication-assisted care and, separately,
      enterprise-sponsored coverage.
    data:
      items:
        - label: Consumer acquisition
          actor: Prospective individual member
          phase: Discovery
          tone: neutral
          touchpoints:
            - Quiz / free-trial flow on Noom homepage
            - Psychology-based weight-loss positioning
        - label: Noom Weight enrollment
          actor: Self-pay consumer
          phase: Initial conversion
          tone: positive
          touchpoints:
            - Daily lessons and food logging
            - AI + human-led coaching via chat
        - label: Med qualification and prescribing
          actor: Higher-intent obesity / weight-management consumer
          phase: Upsell / clinical expansion
          tone: opportunity
          touchpoints:
            - Clinician evaluation
            - GLP-1 Rx or Microdose GLP-1 Rx eligibility
        - label: Ongoing engagement loop
          actor: Active member
          phase: Retention
          tone: neutral
          touchpoints:
            - Weight logging and app opens
            - Coaching, content, and behavioral nudges
        - label: Enterprise coverage path
          actor: Employer / health plan buyer
          phase: B2B2C distribution
          tone: opportunity
          touchpoints:
            - Employer / health-plan sponsorship
            - Covered-member activation inside the same platform
        - label: Renewal and durability gate
          actor: Noom revenue owner / sponsor
          phase: Expansion risk
          tone: risk
          touchpoints:
            - Public NRR / GRR / churn not disclosed
            - Review friction and cancellation complaints can weaken renewals
