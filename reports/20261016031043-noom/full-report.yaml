figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Noom's visible milestones show a shift from a 2008 behavior-change origin to a 2025-2026 preventive-health, GLP-1,
      and enterprise-distribution push.
    data:
      items:
        - year: 2008
          label: Founding and original research
          detail: >-
            Founder materials trace Noom's origins to 2008 and identify Saeju Jeong and Artem Petakov as the
            co-founders.
          claimRefs:
            - CO002
            - CO003
        - year: 2017
          label: Pivot to D2C weight-loss app
          detail: Sacra says Noom pivoted from an early B2B orientation to a D2C weight-loss app model in 2017.
          claimRefs:
            - CO008
        - date: 2021-05
          label: Series F sets the last visible valuation mark
          detail: Sacra and Grokipedia both report a $540M Series F in May 2021 at a $3.7B valuation.
          claimRefs:
            - CO011
        - date: 2023-07
          label: CEO transition
          detail: Jeong moved to executive chairman and Geoff Cook became CEO in July 2023.
          claimRefs:
            - CO005
        - year: 2023
          label: Noom Med launch
          detail: >-
            Third-party program histories date the launch of Noom Med to 2023, extending Noom into clinician-supervised
            GLP-1-enabled telehealth.
          claimRefs:
            - CO007
        - date: 2024-09
          label: Compounded semaglutide added
          detail: >-
            Grokipedia says Noom began offering compounded semaglutide in September 2024 through its weight-loss
            product.
          claimRefs:
            - CO007
        - year: 2025
          label: Enterprise scale and balance-sheet claims surface
          detail: >-
            October 2025 company overview materials claim positive EBITDA and FCF, substantial cash, no debt, more than
            6.5M covered lives, and five top-20 health-plan relationships.
          claimRefs:
            - CO012
            - CO013
        - date: 2025-10
          label: Highmark partnership announced
          detail: >-
            AskCyborg says Highmark's partnership began in 2026 and offers Noom programs to nearly 2 million eligible
            members.
          claimRefs:
            - CO015
        - date: 2026-04
          label: Tailor Made Compounding acquisition
          detail: >-
            AskCyborg records an April 2026 acquisition of Tailor Made Compounding to deepen control over GLP-1 and HRT
            fulfillment.
          claimRefs:
            - CO015
    claimRefs:
      - CO002
      - CO003
      - CO005
      - CO007
