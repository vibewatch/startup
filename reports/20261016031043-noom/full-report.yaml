            body: >-
              The milestone arc in the assigned pool is coherent: Noom started in 2008, pivoted toward a D2C weight-loss
              app in 2017, reached its last visible valuation milestone in 2021, launched Noom Med in 2023, and then
              spent 2025-2026 leaning harder into enterprise distribution, GLP-1 support, and supply-chain control.
