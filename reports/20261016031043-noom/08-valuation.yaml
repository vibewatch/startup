company:
  name: "Noom"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Noom presents meaningful operating signals, including company-reported revenue growth,
    positive EBITDA and free cash flow, and broad covered-life reach, but the public evidence
    reviewed does not establish current absolute revenue, cash, ownership terms, or a reliable
    current valuation. The appropriate stance is research-more with high risk and an unknown
    valuation stance until primary financial and financing evidence supports price discipline.
sections:
  - id: "recommendation-and-evidence-boundary"
    title: "Recommendation and evidence boundary"
    body: >-
      The recommendation is research-more, not buy or avoid. Noom's overview claims revenue
      growth above 50%, Med growth of 108% year over year, and positive EBITDA and free cash
      flow, which are directionally attractive operating signals. They are nevertheless
      company-issued, omit absolute revenue and cash values, and do not provide a current
      enterprise or equity valuation. The financing evidence is also dated and inconsistent:
      one competitor-authored retrospective reports a $540 million round at a $3.7 billion
      valuation in 2021, while AInvest reports a much higher 2025 valuation. Neither item
      supplies current transaction terms. Without a primary current price, audited financials,
      net debt, preference stack, or fully diluted ownership, a defendable entry multiple and
      target return cannot be calculated.
    claimRefs: [CV001, CV002, CV012, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: "thesis-and-anti-thesis"
    title: "Thesis and anti-thesis"
    body: >-
      The thesis rests on a potentially valuable combination of scale and product breadth.
      Noom says its programs cover more than 6.5 million lives and reach five of the twenty
      largest US health plans plus hundreds of enterprise clients. Its current platform spans
      behavioral support, clinical care, medication, diabetes, and menopause, and an
      independent marketing-industry source dates the Noom Med launch to 2023. The anti-thesis
      is that scale and breadth have not been translated into independently verified economics.
      Metabolic Ledger criticizes quarterly billing transparency, while Nutrola, an explicit
      product competitor, reports recurring coaching-quality concerns. Those sources have
      commercial or editorial limitations, but they identify retention, trust, and service
      quality questions that should be tested rather than ignored.
    claimRefs: [CV003, CV004, CV005, CV006, CV010, CV014]
    tableRefs: [TV002]
  - id: "scenario-and-entry-discipline"
    title: "Scenario framework and entry discipline"
    body: >-
      Public evidence supports conditional scenarios but not numerical valuation ranges or
      probability weights. The bull case requires verification that the reported growth and
      positive cash-generation signals are durable and that Noom's medication-plus-behavior
      proposition produces retention without regulatory or billing friction. The base case is
      continued growth with an evidence discount: a credible business may exist, but no price
      can be approved without current revenue, margin, cash, debt, and ownership data. The bear
      case is triggered if the company claims fail to reconcile to audited records, customer
      cohorts weaken, or acquisition economics depend on billing practices that impair trust.
      Historical revenue and valuation references are context only; revenue is not ARR, and
      neither dated metric is a substitute for current enterprise value.
    claimRefs: [CV001, CV002, CV007, CV008, CV009, CV010, CV012, CV013, CV015, CV016]
    tableRefs: [TV003]
  - id: "exit-readiness-and-final-diligence"
    title: "Exit readiness and final diligence"
    body: >-
      No exit window is supportable from the assigned public evidence. Company-reported payer
      and employer reach could broaden strategic interest, and control of a pharmacy may deepen
      vertical integration, but neither proves IPO readiness, buyer demand, or realizable
      liquidity. Final diligence should obtain audited 2024-2026 financials, monthly cohort
      retention by product, contribution margin after medication and clinical costs, cash and
      debt balances, the fully diluted cap table, liquidation preferences, and the latest 409A
      or secondary transaction evidence. It should also reconcile plan-level pricing and refund
      mechanics, validate covered-life conversion into revenue, and test downside covenants.
      The thesis breaks if audited growth or cash generation materially misses the company
      presentation, if retention deteriorates after introductory periods, or if current terms
      require underwriting from an unsupported historical valuation.
    claimRefs: [CV003, CV004, CV010, CV011, CV016]
tables:
  - id: "TV001"
    title: "Recommendation summary"
    columns: ["Decision element", "Assessment", "Decision implication"]
    rows:
      - ["Recommendation", "Research more", "Do not approve an investment until primary financial and financing records are reviewed."]
      - ["Confidence", "Medium", "The operating signals are current but predominantly company-issued and lack absolute financial values."]
      - ["Risk rating", "High", "Pricing, retention, cap-table, and current valuation evidence remain material gaps."]
      - ["Valuation stance", "Unknown", "The assigned evidence does not support a current enterprise value or defendable revenue multiple."]
      - ["Entry discipline", "No price approval", "Require audited current metrics, net debt, preference terms, and fully diluted ownership before setting return targets."]
    notes: >-
      Assessments are analytical judgments from the cited evidence; no numerical valuation or
      target return is shown because current primary financial and transaction inputs are absent.
    claimRefs: [CV001, CV002, CV010, CV012, CV014, CV015]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Side", "Argument", "What would change the view"]
    rows:
      - ["Thesis", "Noom reports more than 6.5 million covered lives.", "Verify activation, paid enrollment, retention, and revenue per covered life."]
      - ["Thesis", "Noom reports relationships with major health plans and hundreds of enterprise clients.", "Obtain customer-level concentration, contract duration, renewal, and pipeline evidence."]
      - ["Thesis", "The platform combines behavioral support, clinical care, and medication.", "Show cohort outcomes and contribution margin by product rather than blended claims."]
      - ["Anti-thesis", "An independent review reports quarterly-billing and cancellation friction.", "Reconcile checkout disclosures, refund data, complaints, and churn by billing cohort."]
      - ["Anti-thesis", "A competitor-authored review reports recurring coaching-quality concerns.", "Review coach caseloads, response times, reassignment rates, and customer satisfaction trends."]
      - ["Anti-thesis", "Public valuation references are dated and do not establish current terms.", "Provide the latest priced-round, 409A, or arm's-length secondary documentation."]
    notes: >-
      Company scale and product claims are not treated as independently verified; the adverse
      sources are retained with their issuer relationships and limitations visible.
    claimRefs: [CV003, CV004, CV005, CV006, CV010, CV014, CV015]
  - id: "TV003"
    title: "Bull, base, and bear scenarios"
    columns: ["Case", "Assumptions", "Valuation / return logic", "Probability signal", "Key risks or downside trigger"]
    rows:
      - ["Bull", "Reported growth and positive cash generation reconcile to audited records; enterprise cohorts retain; integrated care sustains engagement.", "A range remains unavailable until current revenue, margin, net debt, and entry terms are supplied.", "Stronger if audited results validate the company deck and cohort evidence shows durable paid retention.", "Breaks if growth is promotional, cash generation excludes recurring costs, or pharmacy integration adds material compliance exposure."]
      - ["Base", "Directionally positive operating claims are real, but disclosure remains private and current price is unknown.", "Research-more; underwrite only after a primary valuation mark and fully diluted ownership schedule establish an entry basis.", "Most consistent with the present mix of company claims, dated third-party context, and unresolved financing data.", "No price discovery, weak cohort transparency, and billing friction keep the evidence discount high."]
      - ["Bear", "Growth or profitability claims fail to reconcile; retention weakens; customer trust or regulatory pressure raises acquisition and servicing costs.", "Avoid at terms anchored to unsupported historical marks; quantify liquidation and debt downside before reconsideration.", "Stronger if audited records miss reported direction, complaints rise, or current financing requires senior preferences.", "Thesis break occurs on material cash burn, adverse financing terms, sustained churn, or inability to substantiate outcomes."]
    notes: >-
      Cases are conditional and unweighted. Numerical probabilities, valuation ranges, and target
      returns are intentionally left unavailable rather than estimated without current inputs.
    claimRefs: [CV001, CV002, CV007, CV008, CV009, CV010, CV012, CV013, CV015]
