      While lead institutions (Sequoia, Cyberstarts, Greenoaks, Redpoint) are named, individual ownership stakes and
      board composition beyond founder/operator representation remain undisclosed.
    diligencePath: >-
      Request confidential cap table and Series A voting agreement in diligence data room; verify investor board
      observer rights and governance covenants.
    relatedTableRefs:
