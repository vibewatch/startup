company:
  name: "Glow"
chapter:
  number: 4
  title: "Financials"
  summary: "Glow's public financial record supports a July 2026 private valuation of $1.2 billion but not an underwritten operating model: sources disagree whether the associated financing was a $180 million Series A or a $100 million Series B, and no revenue, pricing, margin, burn, cash, or runway data is public. Funding scale therefore cannot be treated as cash available or evidence of revenue quality."
sections:
  - id: "revenue-visibility"
    title: "Revenue visibility is too limited to establish revenue quality"
    body: >-
      Public evidence identifies Glow as a B2B endpoint-security platform, but it does
      not establish how customers are billed. Multiples labels the revenue model
      "Services" while also stating that revenue has not been publicly disclosed; no
      retained source supplies a price, billing unit, contract duration, discount,
      renewal term, or revenue-recognition policy. The Jerusalem Post relays Glow's
      statement that enterprise customers have signed in healthcare, retail, and
      financial services, but provides no customer names, counts, contract values, or
      indication of whether deployments are paid production contracts. Consequently,
      customer activity cannot be converted into ARR, recognized revenue, or gross
      profit from the public record. The revenue-stream table treats every unsupported
      mechanism as unknown rather than assuming a SaaS subscription or services mix.
    claimRefs:
      - "CI005"
      - "CI007"
      - "CI013"
      - "CI014"
      - "CI016"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-and-unit-economics"
    title: "Pricing, sales efficiency, and unit economics remain private"
    body: >-
      Neither list pricing nor realized pricing is available in the assigned evidence.
      The same disclosure gap covers annual contract value, discounting, customer
      acquisition cost, sales-cycle length, payback, churn, retention, gross margin,
      hosting cost, support cost, and professional-services effort. Public workforce
      indicators are also inconsistent: QuantLogix counted 20 open roles and said half
      were product-building as of September 16, whereas Tracxn reported 125 employees
      and Latio placed the company in a 51-100 employee band. These observations are
      activity and scale proxies, not operating-expense measurements. They cannot
      support a burn estimate without payroll, vendor, infrastructure, and capitalization
      records. The appropriate underwriting response is a structured data request, not
      a synthetic margin or CAC benchmark.
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI016"
    tableRefs:
      - "TI002"
      - "TI003"
  - id: "capital-adequacy"
    title: "Large financing does not establish available cash or runway"
    body: >-
      Three sources report $180 million of financing at a $1.2 billion valuation, and
      QuantLogix calculates that financing as 15% of post-money value while explicitly
      warning that this is not an ownership or dilution estimate. Two other databases
      instead report a $100 million Series B. This disagreement affects the opening
      capital base and must be reconciled to transaction documents. The Jerusalem Post
      reports that proceeds are intended for U.S. go-to-market expansion and Glow Labs,
      but no source states cash on hand, monthly burn, debt, restricted cash, or runway.
      Funding raised is therefore not interchangeable with liquidity available on the
      run date. A runway conclusion requires bank balances, the cash-flow statement,
      current headcount and compensation, committed hiring, vendor obligations, and the
      preferred-stock documents.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI006"
      - "CI016"
  - id: "financial-verdict"
    title: "Financial verdict: capitalized, but not publicly underwritable"
    body: >-
      The strongest public conclusion is that Glow has substantial reported venture
      backing and an aggressive expansion mandate, not that it has durable revenue or
      sufficient runway. At launch, The Cryptonomist described the company as having no
      public product and said all reported performance metrics were self-reported and
      independently unvalidated; Latio likewise displayed no user reviews. Those facts
      weaken the evidentiary link between technical claims, paid adoption, and economic
      value. The financing discrepancy further limits capitalization confidence.
      Underwriting should remain conditional on audited revenue, customer-level ARR,
      contracts, cohort retention, gross-margin and service-cost schedules, cash and
      burn records, and a reconciled capitalization table. A California regulator page
      about a fertility-app operator named Glow, Inc. is a namesake record and must not
      be attributed to this 2025-founded cybersecurity company.
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI008"
      - "CI009"
      - "CI014"
      - "CI015"
      - "CI016"
