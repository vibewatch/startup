      - ["Contract term and renewal", null, "No standard or realized term disclosed", "Renewal, termination, and ramp provisions unknown", "Master agreements, renewal schedules, and remaining performance obligations"]
      - ["Revenue recognition", null, "No recognized-revenue schedule disclosed", "Pilot, services, and subscription allocation unknown", "Audited revenue memo, deferred-revenue roll-forward, and invoice sample"]
    notes: "Null means none of the eight retained assigned sources disclosed the item; the table does not infer enterprise-software terms from sector convention."
    claimRefs:
      - "CI005"
      - "CI013"
      - "CI016"
  - id: "TI003"
    title: "Unit economics and capital-adequacy underwriting matrix"
    columns:
      - "Metric"
      - "Public value"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["Revenue / ARR", null, "Low", "Required to measure scale and valuation multiples", "Audited revenue, ARR bridge, billings, and customer-level schedule"]
      - ["Gross margin and delivery cost", null, "Low", "Required to test software leverage and service intensity", "COGS ledger split by hosting, support, implementation, and third-party services"]
      - ["CAC, payback, retention, and sales cycle", null, "Low", "Required to evaluate GTM efficiency and recurring quality", "Cohort bookings, sales expense, churn, NRR, pipeline conversion, and cycle data"]
      - ["Financing and valuation", "$180M at $1.2B reported by three sources; $100M Series B reported by two databases", "Medium", "Sets the reported capital base but remains transactionally inconsistent", "Stock-purchase agreements, capitalization table, bank receipts, and board approvals"]
      - ["Cash, burn, debt, and runway", null, "Low", "Determines financing dependency and next-round timing", "Bank balances, cash-flow statement, monthly burn, debt schedule, hiring plan, and restricted cash"]
    notes: "Values preserve each source's round label and amount; funding raised is not treated as cash available, and nulls denote missing public disclosures rather than zero."
    claimRefs:
