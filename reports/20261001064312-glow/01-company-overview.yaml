company:
  name: "Glow"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Glow is a Palo Alto-headquartered cybersecurity startup founded in 2025 by former Meta and Snowflake executives that emerged from stealth on July 22, 2026, with $180 million in all-equity Series A funding at a $1.2 billion valuation. Co-led by Sequoia Capital, Cyberstarts, Greenoaks, and Redpoint Ventures, the company provides an AI-powered endpoint security platform designed to monitor corporate devices, prevent risky software execution, and autonomously govern AI agent behavior."
sections:
  - id: "identity-and-market-positioning"
    title: "Corporate Identity and Market Positioning"
    body: |
      Glow emerged from stealth on July 22, 2026, establishing its corporate headquarters in Palo Alto, California while anchoring its research and engineering operations in Israel. Founded in 2025, the company is built around the thesis that generative artificial intelligence tools and autonomous software agents deployed on employee devices have created unprecedented attack surfaces that legacy endpoint detection and response (EDR) architectures cannot adequately secure. The company employs approximately 100 professionals, with approximately 70% located in its Israeli engineering facility and the remaining 30% in the United States driving executive leadership and commercial expansion. Glow operates a dual-hub structure designed to blend deep Israeli cybersecurity research talent with Silicon Valley go-to-market execution, positioning itself as a proactive prevention layer that stops unauthorized software and unvetted AI agents before threats manifest.
    claimRefs:
      - CO001
      - CO002
      - CO009
      - CO010
    tableRefs:
      - TO001
  - id: "founding-team-and-governance"
    title: "Executive Leadership and Technical Governance"
    body: |
      Glow's executive bench exhibits substantial founder-market fit across hyperscale engineering, cloud data security, and enterprise CISO buyer workflows. Chief Executive Officer Roi Tiger brings nine years of engineering leadership from Meta, where he served as Vice President of Engineering, relocating to Palo Alto to spearhead company strategy. Chief Technology Officer Omer Singer previously led cybersecurity strategy at Snowflake, bringing cloud data architecture expertise, while Vice President of Research and Development Ophir Arie formerly directed R&D at industrial cybersecurity leader Claroty. Chief Product Officer Arnon Joseph contributed eight years of software leadership at Meta, and Chief Operating Officer Emily Heath provides direct customer credibility as a former CISO at United Airlines and DocuSign, former partner at Cyberstarts, and previous board member at Wiz through its acquisition by Google. This combination creates high technical credibility, though key-person dependency on Tiger and Singer remains prominent.
    claimRefs:
      - CO003
      - CO004
    tableRefs:
      - TO002
  - id: "capitalization-and-investor-syndicate"
    title: "Capital Structure and Series A Syndicate"
    body: |
      In July 2026, Glow announced an all-equity Series A financing round of $180 million, catapulting the startup to a post-money valuation of $1.2 billion and establishing unicorn status directly out of stealth mode. The funding was co-led by a tier-one venture syndicate consisting of Sequoia Capital, Cyberstarts, Greenoaks, and Redpoint Ventures, with participation from Index Ventures, Swish Ventures, Lux Capital, Operator Collective, and Holly Ventures. Attaining unicorn valuation without publicly disclosing annual recurring revenue, customer logo counts, or pricing structures reflects intense venture capital conviction in AI security infrastructure. The substantial $180 million capital infusion provides multi-year operational runway for intensive model training and aggressive hiring across U.S. sales and engineering teams, while leaving capitalization table percentages and voting controls undisclosed in private filings.
    claimRefs:
      - CO005
      - CO006
      - CO007
    tableRefs:
      - TO003
  - id: "scale-validation-and-risk-factors"
    title: "Operational Scale, Efficacy Benchmarks and Risk Disambiguation"
    body: |
      While Glow reported active commercial deployments across healthcare, retail, and financial services encompassing tens of thousands of corporate endpoints, its commercial traction metrics remain strictly private. The company's platform utilizes foundational models from Anthropic and Google Gemini via Amazon Bedrock, wrapped in proprietary contextual software. Diligence must critically evaluate Glow's self-reported efficacy benchmarks, including a claimed 90% reduction in AI supply-chain risk and a 28-day autonomous resolution timeline, as these figures represent early customer pilot observations rather than independently verified third-party benchmarks. The security community will first evaluate the technology publicly at Black Hat USA 2026. Furthermore, corporate diligence must disambiguate Glow from homonymous entities, including a Miami Beach solar carbon platform founded by David Vorick and the unrelated fertility app Glow, Inc. that reached a privacy settlement with the California Department of Justice in 2020.
    claimRefs:
      - CO008
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
    figureRefs:
      - FO001
