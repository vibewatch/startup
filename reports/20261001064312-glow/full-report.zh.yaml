  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范畴、自主终端防御与客户工作流集成
        blocks:
          - type: paragraph
            body: >-
              Glow 将其核心产品定义为 AI 驱动的终端安全平台，旨在保护企业笔记本电脑、台式机与分布式工作站免受现代执行风险的威胁。Glow
              摒弃了在恶意代码落地后告警安全运营人员的传统终端检测与响应（EDR）范式，转而倡导自主预防优先架构。系统直接将专用 AI
              智能体部署至终端设备，持续测绘运行进程，实时研判执行意图，并在未授权或高风险软件建立持久化驻留之前自动予以拦截。切入客户工作流时，Glow 瞄准了因员工使用生成式 AI
              工具、未经审查的代码助手及开源软件包所造成的普遍管理盲区。平台在设备边界自主执行企业安全策略，防止开发者与知识工作者无意中引入漏洞，同时免除了 Tier-1 安全运营中心（SOC）分流队列的日常管理开销。
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE011
