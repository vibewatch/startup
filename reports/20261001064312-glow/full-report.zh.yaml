              - CR012
              - CR013
      - number: '7.4'
        title: 风险综合研判、热力矩阵与尽调否决红线
        blocks:
          - type: paragraph
            body: >-
              综合研判 Glow 的风险全貌表明，技术依赖与未产生收入前的高估值倍数风险构成了近期最严峻的运营隐患。投资者必须紧密监控五个维度的明确逻辑破裂触发点与否决红线（kill criteria）：上游基础模型弃用或
              API 成本激增超出企业合同毛利承受力；自主智能体误报干扰引发医疗或金融领域试点客户解约；高管过往 “幽灵炸弹” 行动引发声誉反噬，重新招致采购阻碍；地缘政治冲突导致以色列研发连续中断超过 14
              天；以及企业试点转化率滞后于 $180 million 资本底数所隐含的烧钱速度。在对成长期股权进行核保之前，经由 Black Hat USA 独立技术审计与 SOC 2 Type 2
              审查完成正式验证，仍是必不可少的前提条件。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR011
              - CR013
