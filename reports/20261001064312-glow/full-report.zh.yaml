      - number: '3.3'
        title: 定价、打包策略与在位者分销动态
        blocks:
          - type: paragraph
            body: >-
              从商业化视角来看，在位平台凭借企业合同打包策略与激进的捆绑销售建立了令人生畏的分销护城河。微软构成了最严峻的定价阻碍：通过其 Microsoft 365 E5 套件，企业软件买方几乎无需额外支付许可成本即可使用
              Defender for Endpoint。SentinelOne 则在 2026 年力图缩小 $1.4 billion 的收入差距，借灵活的商业折扣与自主修复宣传积极抗衡 CrowdStrike
              的市场主导地位。反观 Glow，目前仍处于私密企业部署阶段，定价体系未披露，采用定制试点合同，且未公布按终端计费的阶梯。要想与传统 EDR 平台共存甚至取而代之，Glow
              必须在高度控制成本的采购环境中展现无可辩驳的经济回报与降险成效，从而促使客户划拨全新的安全预算。
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: 护城河持久度、切换成本与市场甄别隐患
        blocks:
          - type: paragraph
            body: >-
              终端网络安全领域的客户很难更换供应商，顾虑集中在传感器冲突、智能体泛滥、业务中断，以及 SOC 工作流深度集成后的迁移风险。Glow 虽已具备 GDPR、ISO 27001 和 SOC 2 Type 2
              等基础合规资质，但要让企业风险委员会在没有人工审批的前提下信任自主 AI 修复，仍是一场硬仗。自动化预防智能体若误拦截关键生产代码库或开发者软件包，造成的业务停摆损失可能远超底层安全漏洞本身。因此，Glow
              能否建立长期护城河，不只看算法主张是否新颖，还要看它能否在异构企业环境中证明可靠、把误报率压到极低，并获得权威独立评测背书。
            claimRefs:
              - CP012
              - CP013
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 在位者打包策略与分销壁垒
            body: >-
              微软与 CrowdStrike 坐拥牢固的企业长期合同，微软更凭借 E5 套件捆绑以零边际许可成本提供终端防护。Glow 若想替代现有 EDR
              智能体或与之并存，就必须证明无可辩驳的预防有效性，从而证明部署双智能体的额外开销与设立独立预算具备合理性。
            calloutType: risk
            claimRefs:
              - CP001
              - CP010
              - CP011
          - type: callout
            title: 预防范式困境
            body: >-
              尽管 Glow 主打前置自主拦截机制，旨在恶意软件包与失控智能体执行前将其扼杀，但企业 CISO 历来偏向检测与响应模式，以防误报导致业务停摆。Glow 的商业化落地取决于能否证明其 AI
              上下文引擎可以在没有人工干预且不引发业务摩擦的前提下安全执行修复。
            calloutType: insight
            claimRefs:
