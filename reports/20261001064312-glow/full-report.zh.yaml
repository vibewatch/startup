      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 基础模型与云端集中度风险
            body: >-
              Glow 依赖经由 Amazon Bedrock 交付的 Anthropic 与 Google Gemini 模型。上游模型弃用、定价调整或 API
              服务中断构成了单点故障隐患，可能瞬间削弱客户设备集群的自主防护能力。
            calloutType: risk
