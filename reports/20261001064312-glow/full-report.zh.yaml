            body: 在未披露任何 ARR 的情况下承销 $1.2 billion 估值，面临严重的倍数压缩风险；一旦医疗、零售和金融服务领域的初期企业试点未能转化为具备法律约束力的经常性合同，估值将承受重压。
            calloutType: insight
