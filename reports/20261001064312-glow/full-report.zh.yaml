      - number: '6.2'
        title: 采纳路径、企业威胁动因与部署实证
        blocks:
          - type: paragraph
            body: >
              企业对 Glow 终端防护平台的需求，源于企业设备集群中员工自发使用 AI 工具的爆发式普及。Verizon 2026 年《数据泄露调查报告》（DBIR）的入侵分析显示，企业终端上常规使用 AI
              工具的比例在单年内由 15% 跃升至 45%，形成了传统终端检测与响应（EDR）智能体难以应对的可见性盲区。Glow 走出隐身模式时引用的行业研究表明，约 30% 的企业 AI
              智能体缺乏充分的组织防护边界，而普通企业终端上运行的软件有 67% 完全处于 IT 安全团队的监控盲区。Glow 在 2026 年 7
              月脱离隐身模式时宣布，已在医疗、零售和金融服务领域签下首批企业客户，在企业终端部署其平台以阻断恶意 npm 软件包并拦截未批准软件的执行。此外，Latio 上的独立厂商评估证实 Glow 具备 GDPR、ISO
              27001 和 SOC 2 Type 2 认证等企业合规资质，但迄今未收录任何已验证的客户评测或公开社区打分。潜在企业买方必须注意到，所有标杆客户目前均为匿名的共创伙伴（design
              partners），而非具名可背书的知名品牌。
