      - number: '8.5'
        title: 展项
        blocks:
          - type: callout
            title: 投资立场：在商业化 ARR 与基准验证落地前保持「观察」
            body: >-
              尽管 Glow 锁定了顶级投资机构阵容与巨额资金储备（$180 million），但在正式产品公开可用或 ARR 获得确认前以 $1.2 billion
              估值入场，面临极高的下行不对称风险。投资人应持续跟踪生产环境遥测数据，紧盯企业级部署中的误报率，并在实际出资前要求提供经审计的真实收入进展。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV010
              - CV015
          - type: callout
            title: 核心逻辑破裂触发点：自主拦截抗误报能力
            body: 无需人工工单审批的自主修复既是核心技术差异点，也是 Glow 最大的运营脆弱点。一旦银行或医疗行业的首批企业试点出现误删软件、破坏正常业务流程的情况，客户 CISO 的信任将迅速崩塌，迫使产品退回传统的检测模式。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
