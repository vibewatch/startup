      - 支撑逻辑
      - 尽调启示
    rows:
      - - 投资建议
        - 观察
        - Glow 兼具顶尖管理团队与 $180M 资金储备，但产品尚未成型即达 $1.2B 估值，亟需商业化验证。
        - 在企业部署基准与 ARR 爬坡得到验证前，暂缓直接股权出资。
      - - 置信度
        - 中
        - 公开披露证实了融资与财团资质，但客户合同指标仍未披露。
        - 在私下尽调中交叉比对客户证明人反馈与商机转化速度。
      - - 风险评级
        - 高
        - 估值严重不对称，自主修复主张未经验证，高管历史背景面临审视。
        - 在正式法律尽调中审查自主智能体故障防护机制，核验创始人治理保护条款。
      - - 估值立场
        - 偏高
        - 在未公开披露 ARR 的情况下投后估值达 $1.2B，入场倍数对应极高远期增长溢价。
        - 测算下行稀释情景，并设计清算优先权条款以防范未来折价融资风险。
    notes: 评估综合了 2026 年 7 月 Series A 披露信息、可比公司估值倍数以及尚未验证的产品阶段。
