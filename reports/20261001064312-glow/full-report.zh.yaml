      - number: '5.2'
        title: 技术架构、双 LLM 编排与云端推理依赖
        blocks:
          - type: paragraph
            body: >-
              架构设计上，Glow 将本地终端传感器与混合云智能管线融为一体。在终端设备端，Glow 智能体采集细粒度系统事件，包括进程启动、文件系统修改与依赖项解析调用。遥测数据随后汇入 Glow
              自研的上下文引擎，由其重构执行上下文并评估行为意图。为实现多步推理与语义策略决策，平台调用外部基础模型——特别是经由 Amazon Bedrock 接入的 Anthropic Claude 与 Google
              Gemini
              模型——并与内部策略规则协同联动。这种双基础模型策略虽能提供精细的自然语言策略解析能力，并快速适应新型漏洞利用模式，却使系统对外部云端推理基础设施产生了关键的运行依赖。关键任务级终端控制由此受制于云端 API
              Token 成本模型、网络延迟波动与第三方平台可用性，相比传统的纯本地签名引擎，形成了显著的架构权衡。
            claimRefs:
              - CE001
              - CE003
              - CE004
