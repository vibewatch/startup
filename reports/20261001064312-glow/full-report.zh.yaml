  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围界定与同名主体判别
        blocks:
          - type: paragraph
            body: >
              Glow 将其核心目标市场界定为 AI 原生企业终端安全，聚焦于实时设备测绘、软件执行控制与自主威胁修复。可触达的预算边界涵盖分配给终端防护平台（EPP）、终端检测与响应（EDR）以及新兴 AI
              智能体治理层的软件支出。该边界排除了边缘网络安全细分领域，例如网络防火墙、独立云安全状态管理（CSPM）、身份与访问管理（IAM）以及消费级安全工具。尤为关键的是，尽调自动化抓取工具常因公司同名而混入无关的市场规模数据，包括美妆细分市场（2025
              年价值 $1.19B 的 “glow drops” 及 $595.41M 的 “glow in the dark cosmetics”）以及消费级数字健康应用（例如加州司法部 2020 年对经期追踪应用
              Glow, Inc. 的监管执法）。与此不同，Glow 严格深耕于 B2B 企业终端基础设施，保护员工设备免受自动化提示词注入、未授权本地模型执行以及供应链恶意软件的侵害。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 市场规模测算视角与可触达机遇
        blocks:
          - type: paragraph
            body: >
              测算 Glow 的可触达市场，需将广泛的传统基础设施支出与自主智能体普及催生的高增长细分赛道剥离开来。来自 Mordor Intelligence 的独立行业研究预测，在云迁移与 AI
              驱动的行为分析推动下，整体企业终端安全市场将以 11% 的复合年增长率（CAGR）扩张，从 2026 年的 $23.34B 增至 2031 年的 $39.41B。然而，将这一 $23.34B
              的总可用市场（TAM）视为立即可服务的范畴，会高估 Glow 的近期捕获潜力。可服务市场（SAM）受限于实际运行本地生成式 AI 工作流的企业——根据引自 Verizon 2026 年 DBIR
              的数据，此类企业中未授权工具的普及率在一年内从 15% 激增至
              45%。近期的可获取市场（SOM）进一步收缩至风险敞口极为严峻的企业领域，尤其是金融服务、医疗与零售行业，这些领域的安全团队靠人工分流已无法跟上自动化威胁的演进速度。未经证实的消费市场数据集（如 $115B
              的大健康估算或 $2.3B 的美妆预测）均属无效路径，必须予以剔除。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 企业买方画像、付费方协同与落地节奏
        blocks:
          - type: paragraph
            body: >
              Glow 的企业采购流程主要围绕首席信息安全官（CISO）、首席信息官（CIO）以及安全工程副总裁展开，他们在推动企业采纳 AI 的同时面临确保设备合规的沉重压力。在企业汇报架构中，CISO
              掌控专属的终端与应用安全预算，而业务部门与研发团队则是终端用户，自发引入自主代码助手和未经审查的开源软件包。业务高管 Emily Heath（曾任 United Airlines 和 DocuSign 的
              CISO）指出，现有安全技术栈在企业创新速度与设备防御之间造成了不可承受的业务摩擦。初期的企业落地集中在合规要求严格（GDPR、SOC 2 Type 2、ISO
              27001）且需要持续资产可见性的强监管行业。尽管企业展开试点的意愿极高，但在评估是否信任自主 AI 修复而非人工分析师分流时，采购决策周期仍会遭遇阻力。
            claimRefs:
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 市场催化剂、架构演进与结构性制约
        blocks:
          - type: paragraph
            body: >
              AI 原生终端防护的核心增长动力源于自动化攻击面与人工响应速度之间的结构性不对称。行业观察人士引用的研究显示，30% 的企业 AI 智能体在缺乏充分治理控制的情况下运行，而企业环境中 67%
              的软件完全处于监控盲区。攻击者惯常将生成式 AI 武器化，自动化发起钓鱼攻击、生成多态恶意软件，并向 npm 等公共软件包仓库注入恶意代码。针对这一现状，Glow
              倡导预防优先的防御机制，其内部基准包括关键问题的平均化解周期为 28 天，自述将 AI 供应链风险降低 90%。相反，显著的市场制约依然存在：CrowdStrike、Microsoft Defender 和
              SentinelOne 等传统 EDR 巨头拥有根深蒂固的企业合同，而安全买方对于可能扰乱正常业务运转的误报依旧保持高度警惕。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 自动化尽调管线中的同名风险
            body: >
              分析 Glow 时的一大尽调障碍是自动化情报抓取中普遍存在的同名公司干扰。搜索引擎常将 Glow 这家估值 $1.2B 的 AI 安全独角兽与大众护肤市场（$2.3B 的 glow
              drops）、荧光化妆品（$1.02B 的 glow-in-the-dark 化妆品）以及针对 Glow, Inc.（一款消费级经期追踪应用，在 2020 年被加州总检察长处以 $250,000
              罚款）的历史监管处罚混为一谈。严格划定行业边界对于防止指标污染至关重要。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
          - type: callout
            title: 巨头护城河与对自主预防的疑虑
            body: >
              Glow 预防优先的投资逻辑要求企业授权自主 AI 智能体在无需人工批准的情况下移除软件并修改配置。CrowdStrike 和 SentinelOne 等老牌巨头拥有庞大的企业分销渠道与深厚的遥测数据池。若企业
              CISO 对授予自主软件拦截权限仍抱有疑虑，Glow 的可触达客户转化速度将滞后于企业整体的 AI 采纳进程。
            calloutType: risk
            claimRefs:
              - CM009
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与架构分层
        blocks:
          - type: paragraph
            body: >-
              企业终端安全格局在结构上由根基深厚的市场龙头主导，主要是 CrowdStrike、Microsoft Defender 与
              SentinelOne。这些在位巨头耗时十余年将智能体架构植入企业设备，牢牢占据了可观的企业安全预算。面对这些传统领军企业，2026 年夏季见证了风投资本涌入专用 AI 原生安全架构的热潮，标志性事件包括 Neo
              完成面向智能体软件安全的 $100 million 融资、Empirical Security 斩获 $25 million 预测性漏洞资金，以及更早前 Tenex（$250 million）和
              XBOW（$120 million）的融资交易。此外，第三方软件聚合平台与选型决策工具常显现显著的识别混淆，屡次将 Glow 的 AI 终端安全与风马牛不相及的物流、数据分析及协同 SaaS
              平台混淆。这种结构性分层将市场划分为覆盖广泛的检测型老牌巨头与新兴的专用 AI 安全挑战者两大阵营。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 功能差异化与执行架构
        blocks:
          - type: paragraph
            body: >-
              架构设计上，传统 EDR 系统立足于执行后威胁模型，观测遥测数据并触发检测告警以供安全运营中心（SOC）人工分流。与之不同，Glow 认为企业 AI 智能体的爆发式演进——设备采纳率在单年内由 15% 飙升至
              45%——已让依赖人工审核的检测机制彻底滞后，亟需前置软件拦截与自主修复。Glow 声称其 AI 智能体可对终端进行持续盘点并在平均 28 天的基准周期内化解威胁，更自述将供应链风险降低
              90%。然而，消费级品牌重名问题（包括此前针对无关生育应用 Glow, Inc. 的执法行动以及汽车营销活动）加剧了外部品牌认知模糊。从架构定位来看，相较于全球老牌巨头，Glow
              奉行激进的前置防御姿态，但仍处于较早的运营规模阶段。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP014
