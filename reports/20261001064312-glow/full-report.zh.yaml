chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位与市场卡位
        blocks:
          - type: paragraph
            body: >
              Glow 于 2026 年 7 月 22 日结束隐身模式，公司总部设在加州 Palo Alto，研发与工程中心则扎根以色列。公司成立于 2025 年，核心投资逻辑在于：员工设备上部署的生成式 AI
              工具与自主软件智能体带来了前所未有的攻击面，传统终端检测与响应（EDR）架构已无法提供充分保护。公司拥有约 100 名员工，其中约 70% 驻扎在以色列工程基地，其余 30%
              位于美国负责管理层领导与商业化拓展。Glow 采用双中心架构，旨在将以色列深厚的网络安全研发人才与硅谷的市场拓展能力相结合，将自身定位为主动的防御阻断层，赶在威胁显现之前拦截未授权软件与未经审查的 AI 智能体。
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO007
              - CO008
      - number: '1.2'
        title: 管理团队与技术治理
        blocks:
          - type: paragraph
            body: >
              Glow 的高管阵容在超大规模工程、云数据安全以及企业 CISO 买方工作流上展现出极强的创始人与市场匹配度（founder-market fit）。首席执行官 Roi Tiger 曾在 Meta
              担任工程副总裁，拥有 9 年工程领导经验，现已迁至 Palo Alto 掌舵公司战略。首席技术官 Omer Singer 此前负责 Snowflake 的网络安全战略，注入了云数据架构经验；研发副总裁 Ophir
              Arie 曾执掌工业网络安全领军企业 Claroty 的研发工作。首席产品官 Arnon Joseph 在 Meta 拥有 8 年软件管理经历；首席运营官 Emily Heath 曾任 United
              Airlines 与 DocuSign 的 CISO、Cyberstarts 合伙人，并曾在 Wiz 被 Google
              收购期间出任其董事，直接为公司赢得了企业客户的信任背书。这种团队组合构筑了极高的技术信誉，不过对 Tiger 与 Singer 的关键人物依赖依然十分突出。
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.3'
        title: 资本结构与 Series A 辛迪加
        blocks:
          - type: paragraph
            body: >
              2026 年 7 月，Glow 宣布完成 $180 million 全股权 Series A 轮融资，将这家初创公司的投后估值推升至 $1.2
              billion，刚脱离隐身模式便跃升为独角兽。本轮融资由一线风投辛迪加联合领投，包括 Sequoia Capital、Cyberstarts、Greenoaks 与 Redpoint Ventures，Index
              Ventures、Swish Ventures、Lux Capital、Operator Collective 和 Holly Ventures
              参投。在未公开披露年经常性收入（ARR）、客户签约数量或定价结构的情况下获得独角兽估值，折射出风险资本对 AI 安全基础设施的极强信心。这笔 $180 million
              巨额资金注入为高强度模型训练以及美国销售和工程团队的激进扩张提供了数年运营跑道，但非公开文件中仍未披露具体的股权结构表比例与投票权控制架构。
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
      - number: '1.4'
        title: 业务规模、能效基准与主体判别
        blocks:
          - type: paragraph
            body: >
              尽管 Glow 称在医疗、零售和金融服务领域已开展商业部署，覆盖数万个企业终端，但商业拓展指标仍严格保密。公司平台在自研上下文软件中封装了经由 Amazon Bedrock 调用的 Anthropic 与
              Google Gemini 基础模型。尽调必须审慎评估 Glow 自述的能效基准，包括其声称将 AI 供应链风险降低 90% 以及 28
              天自主化解周期的说法，因为这些数据仅代表早期客户试点观察，并非经第三方独立验证的基准。安全行业将在 2026 年 Black Hat USA
              大会上首次对该技术进行公开评估。此外，企业尽调必须将该主体与同名实体区分开来，包括 David Vorick 在 Miami Beach 创立的太阳能碳平台，以及在 2020
              年与加州司法部达成隐私和解协议但与本案无关的生育类应用 Glow, Inc.。
            claimRefs:
