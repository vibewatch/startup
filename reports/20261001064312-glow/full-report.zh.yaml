  - id: TV002
    title: 核心投资逻辑与反向逻辑权衡
    columns:
      - 核心支柱
      - 投资逻辑论点
      - 反向逻辑对立观点
      - 观点颠覆触发条件
    rows:
      - - 市场机遇
        - 终端自主 AI 智能体迅速普及，开辟了传统 EDR 工具无法触达的新企业攻击面。
        - CrowdStrike 与 Microsoft 等既有厂商能以更低阻力扩展现有客户端遥测，覆盖 AI 进程。
        - 既有厂商推出集成式 AI 智能体治理套件，在 Glow 形成规模前将独立防御产品平庸化。
      - - 产品与架构
        - 上下文驱动推理引擎在执行前实时阻断威胁，收缩终端攻击面。
        - 未经人工审批的自主软件拦截存在业务中断风险，面临很高的误报阻力。
        - 企业试点报告无法容忍的误报率，迫使客户关闭自动化防御。
      - - 团队与执行
        - 来自 Meta、Snowflake 与 Claroty 的顶尖创始团队，获得头部网络安全投资机构（Sequoia、Cyberstarts）注资。
        - 高管过往卷入 Onavo 与 Project Ghostbusters 的历史包袱，可能在强监管企业采购中引发声誉审视。
        - 监管部门或客户针对过往监控行为的抵制，阻碍 Fortune 500 客户的安全准入审批。
      - - 估值与风险收益比
        - 顶尖一线财团（融资 $180M）提供多年现金跑道，助力争夺 AI 终端防御品类领导地位。
        - $1.2B 投后估值计入了完美执行预期，对部署推迟或收入不及预期毫无容错空间。
        - 24 个月内未能达成 $20M ARR，被迫进行严重折价融资或结构化资本重组。
    notes: 评估权衡了核心技术差异化与企业采纳阻力及既有厂商反击。
    claimRefs:
      - CV003
      - CV004
      - CV008
      - CV011
      - CV013
      - CV015
  - id: TV003
    title: 情景估值建模（乐观、基准、悲观）
    columns:
      - 情景
      - 核心假设
      - 估值与回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - Glow 成为 AI 时代事实上的终端防御标准；4 年内达成 $100M ARR；对应 25x 估值倍数。
        - 目标估值 $2.5B 至 $3.5B（入场倍数 2.1x–2.9x）；有望实现类似 Wiz（$32B）或 CyberArk（$25B）的超级退出。
        - CrowdStrike 或 Microsoft Defender 等既有厂商激进捆绑销售，放缓企业转化。
        - 20%（要求迅速拿下 Fortune 500 客户，且零重大误报事件）。
      - - 基准情景
        - 在 AI 密集型垂直行业（加密、金融科技、科技）建立稳固利基；3–4 年内达成 $30M–$40M ARR；对应 12x–15x 估值倍数。
        - 估值维持在 $1.2B–$1.5B（1.0x–1.25x 本金保全）；通过老股交易获得流动性或由战略方收购。
        - 企业安全销售周期拉长与高昂研发烧钱速度稀释早期股权。
        - 55%（反映出创始团队实力过硬、资金储备雄厚，但主流企业需求仍未经验证）。
      - - 悲观情景
        - 自主防御未能赢得企业信任；误报干扰业务工作流；收入停滞在 $15M ARR 以下。
        - 按 $300M–$500M 估值折价重组（股权价值损失 60%–75%）或通过人才收购团队退出。
        - 客户严重流失、折价融资优先权堆叠积压，或高管过往经历引发声誉冲击。
        - 25%（反映入场估值极高，且缺乏商业化收入作为安全垫）。
    notes: 远期倍数参考高增长网络安全历史交易，并按当前宏观估值倍数折价调整。
    claimRefs:
      - CV001
      - CV007
      - CV009
      - CV011
      - CV015
