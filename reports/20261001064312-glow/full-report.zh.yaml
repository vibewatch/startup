              称该公司尚无公开产品，所有汇报的性能指标均为自述口径且未经独立验证；Latio
              同样未显示任何用户评测。这些事实削弱了技术主张、付费采纳与商业价值之间的证据链。融资数据的出入进一步压低了资本化可信度。投资核保必须以审计后收入、客户级
