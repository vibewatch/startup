  - id: FV001
    title: Glow 投资决策框架与关卡序列
    type: flow
    summary: 逐步递进的逻辑链：梳理从市场规模与产品验证、风险不对称性与估值纪律，直至最终“观察”建议的全部证据。
    data:
      nodes:
        - id: node-market
          label: 1. 市场机遇：终端 TAM 达 $23B 至 $39B，AI 设备普及率为 45%
          role: evidence
          detail: 随着企业终端成为主要 AI 攻击面，庞大市场正以 11% 复合年均增长率扩张。
        - id: node-team
          label: 2. 团队与资本：由 Sequoia 与 Cyberstarts 领投的 $180M Series A 轮
          role: strength
          detail: 来自 Meta、Snowflake 与 Claroty 的顶尖技术背景，并拥有充足的多年现金储备垫。
        - id: node-proof
          label: 3. 产品验证：处于预产品状态，90% 风险削减指标未经验证
          role: constraint
          detail: 各项性能指标均属公司自述，在 Latio 上零第三方核实验证记录。
        - id: node-risk
          label: 4. 采纳风险：企业对自主防御顾虑重重，高管历史包袱犹存
          role: risk
          detail: 自动化软件拦截遭遇采纳阻力，过往 Project Ghostbusters 监控事件面临严格审视。
        - id: node-valuation
          label: 5. 估值评估：$1.2B 投后估值计入完美预期
          role: constraint
          detail: 在缺乏已确认 ARR 的情况下顶着独角兽身价，为新投资人带来极不对称的下行风险。
        - id: node-recommendation
          label: 6. 最终立场：在获得生产环境遥测与 ARR 验证前维持“观察”立场
          role: decision
          detail: 在出资前紧密跟踪 Black Hat 2026 基准表现，静待经审计的 ARR 增长。
