  - id: FU001
    title: 企业客户采纳旅程与扩张飞轮
    type: journey-map
    summary: 从影子 AI 发现、采购、试点评估、自动化修复直至全企业设备扩张的进阶路径。
    approximationNotes: 各阶段与触点依据已披露试点行业及安全治理实践，模拟企业网络安全采购工作流。
    data:
      items:
        - label: 阶段 1：影子 AI 发现
          description: 企业 CISO 观察到员工在办公电脑上自行部署 AI 智能体、本地模型及未经审查的第三方 npm 库，数量激增。
          detail: 45% 的员工设备使用 AI 工具，而 67% 的软件清单仍未纳入传统安全技术栈监控。
          touchpoints:
            - 企业终端审计
            - 开发者影子 IT 发现
            - 管理层风险认知
          tone: risk
        - label: 阶段 2：技术试点与合规评估
          description: 安全工程团队在医疗、零售或金融领域的指定测试工作站上，以非阻断发现模式部署 Glow。
          detail: 对照企业合规标准进行审核，涵盖 SOC 2 Type 2、ISO 27001 及 GDPR 认证。
          touchpoints:
            - CISO 安全审查
            - Latio 档案评估
            - SOC 集成范围界定
          tone: neutral
        - label: 阶段 3：策略配置与软件管控
          description: SOC 管理员配置软件治理边界，针对合规应用程序与 AI 工具设定自动化策略。
          detail: 系统梳理活跃终端资产，标出缺失或性能受损的传统 EDR 客户端安装项。
          touchpoints:
            - 资产清单梳理
            - 软件白名单定义
            - 管理员策略控制面板
          tone: neutral
        - label: 阶段 4：自主修复与主动防御
          description: Glow 平台从被动监控转向自动化防御，主动阻断恶意 npm 包与高风险软件。
          detail: 厂商自述 AI 供应链风险削减 90%，重大威胁自主修复周期平均缩短至 28 天。
          touchpoints:
            - 自动化软件包阻断
            - 威胁事件日志记录
            - 异常处理分流
          tone: positive
        - label: 阶段 5：全企业设备普及与扩张
          description: 垂直行业试点成效显著，推动产品全面推向所有企业工作站、远程办公笔记本及开发者设备群。
          detail: 采用“先落地后扩张”（Land-and-expand）授权模式，将合同价值从部门级初步试用扩大至全公司年度经常性订阅。
          touchpoints:
            - 全球 CISO 续约
            - 年度合同增购
            - 多部门全面推开
          tone: positive
        - label: 阶段 6：企业业务韧性与生态锁定效应
          description: 深度平台集成将自主治理嵌入开发者流水线，构筑稳固留存与长期防御壁垒。
          detail: 持续资产情报与自动化防御大幅压低流失率，同时推升全球分支机构的年度合同金额。
          touchpoints:
            - 管理层季度业务复盘（QBR）
            - 企业合规续约
            - 多年期服务等级协议（SLA）
          tone: positive
