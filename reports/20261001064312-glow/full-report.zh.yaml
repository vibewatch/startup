            body: >-
              在指定证据库中，既无公开标价也无实际成交价格。同样未披露的还有年度合同价值（ACV）、折扣幅度、获客成本（CAC）、销售周期时长、回本周期、流失率、留存率、毛利率、托管成本、支持成本以及专业服务投入。公开渠道的员工指标亦存在矛盾：QuantLogix
              统计截至 9 月 16 日公司有 20 个在招岗位，其中半数面向产品研发；Tracxn 记录其拥有 125 名员工；Latio 则将员工规模划定在 51-100
              人区间。这些数据仅是业务活跃度与规模的替代指标，并非营业支出凭证。在缺乏薪酬、供应商、基础设施与资本结构记录的情况下，无法推导出可靠的烧钱速度估算。严谨的核保举措应是发出结构化数据尽调清单，而非臆造利润率或
