  - number: 6
    title: 客户群体
    sections:
      - number: '6.1'
        title: 客户群分层、买方画像与企业应用场景
        blocks:
          - type: paragraph
            body: >
              Glow 面向正快速采纳生成式 AI 的大型企业细分客群，在此类企业中，员工与内部工程团队在企业工作站上部署了本地 AI 工具与自主代码智能体。Glow
              销售流程中的经济买方是首席信息安全官（CISO）或企业信息安全副总裁，由其掌控终端安全与软件治理预算。CISO 承受严格的监管与运营考核，需要可验证的证据证明引入自主 AI
              软件不会泄露敏感客户记录、知识产权或生产凭证。与之相对，日常操作 Glow 管理控制台的用户则是安全运营中心（SOC）分析师、IT 桌面管理员以及负责监控企业设备集群软件执行的安全工程团队。由 Glow
              直接监管的终端用户，则是工作站运行 AI 助手、专用代码工具及开源 npm
              软件包等第三方依赖的企业知识工作者与软件开发者。目标垂直行业优先瞄准强监管领域，尤其是处理敏感患者健康数据的医疗机构、保护消费者支付基础设施的零售企业，以及防范交易管线被未经授权向外渗漏数据的金融机构。
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
