              三家信源报道公司以 $1.2 billion 估值完成 $180 million 融资，QuantLogix 计算该融资额占投后估值的 15%，同时明确提示该比例不代表持股比例或稀释测算。另有两家数据库则记录为
              $100 million Series B 轮。这一矛盾直接影响期初资本底数，必须核对交易法律文件以行核实。《耶路撒冷邮报》报道融资资金将用于美国市场拓展与 Glow
              Labs，但未见信源披露手头现金、月均烧钱速度、债务、受限现金或现金跑道。因此，所融资金不可等同于研究基准日的可用流动性。确立现金跑道结论需要银行对账单、现金流量表、现行员工数与薪酬架构、拟定招聘计划、供应商应付款项以及优先股交易文件。
