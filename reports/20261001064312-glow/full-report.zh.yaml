        blocks:
          - type: paragraph
            body: >-
              公开信息将 Glow 定性为 B2B 终端安全平台，但未指明其具体的客户计费模式。Multiples 将其商业模式归类为
              “Services”（服务），同时指出其营收未对外披露；所有留存信源均未提供价格、计费单元、合同周期、折扣、续约条款或收入确认政策。《耶路撒冷邮报》（The Jerusalem Post）援引 Glow
              官方陈述称，公司已签约医疗、零售和金融服务领域的企业客户，但未提供客户名称、签约数量、合同总值，也未透露这些部署是否属于付费生产合同。因此，依据公开记录无法将客户动态换算为
              ARR、已确认收入或毛利。收入结构分析表将缺乏依据的机制一律归为未知，而非主观假设为 SaaS 订阅或专业服务组合。
