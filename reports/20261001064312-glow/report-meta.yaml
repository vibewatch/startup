  topStrengths:
    - Experienced founding team and operating leadership with backgrounds at Meta, Snowflake, Claroty, and enterprise security organizations.
    - Strong capital base and tier-one investor syndicate provide multi-year runway for product and go-to-market execution.
    - Clear prevention-first product thesis aligned with rising enterprise AI-agent and endpoint governance demand.
