companyProfile:
  summary: Glow is a Palo Alto-based cybersecurity startup founded in 2025 by former Meta, Snowflake, and Claroty executives. It sells an AI-native endpoint security platform that continuously maps enterprise devices, blocks unauthorized software before execution, and governs local AI agents across corporate endpoints. The company emerged from stealth in July 2026 with $180 million of all-equity Series A capital at a $1.2 billion post-money valuation, but it still withholds public pricing, ARR, and named customer disclosures.
