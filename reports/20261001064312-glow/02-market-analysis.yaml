chapter:
  number: 2
  title: Market Analysis
  summary: Glow addresses the emerging AI-native endpoint security market, where rapid enterprise adoption of local AI agents and autonomous code generation has invalidated legacy detection-first paradigms. While broader endpoint security expands toward $39.41B by 2031, market sizing for autonomous prevention remains constrained by unverified vendor metrics, legacy EDR incumbency, and homonymous consumer dataset noise.
sections:
  - id: market-boundary-and-scope
    title: Market Boundary, Scope Definition, and Homonym Disambiguation
    body: |
      Glow defines its core addressable market as AI-native enterprise endpoint security, focusing on real-time device mapping, software execution control, and autonomous threat remediation. The addressable perimeter encompasses software budgets allocated to endpoint protection platforms (EPP), endpoint detection and response (EDR), and emergent AI agent governance layers. Excluded from this boundary are peripheral cybersecurity segments such as network firewalls, standalone cloud security posture management (CSPM), identity and access management (IAM), and consumer-grade security tools. Crucially, diligence discovery in automated pipelines frequently surfaces irrelevant market sizing data due to corporate homonyms, including cosmetics market segments ("glow drops" valued at $1.19B in 2025 and "glow in the dark cosmetics" at $595.41M) and consumer digital health apps (such as the 2020 California Department of Justice regulatory enforcement against fertility-tracking app Glow, Inc.). In contrast, Glow operates strictly within B2B enterprise endpoint infrastructure, protecting employee devices against automated prompt injections, unauthorized local model execution, and supply-chain malware.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
    tableRefs:
      - TM001
  - id: market-sizing-lenses
    title: Market Sizing Lenses and Addressable Opportunity
    body: |
      Quantifying Glow's addressable market requires disentangling broad legacy infrastructure spend from the high-velocity sub-segment driven by autonomous agent adoption. Independent industry research from Mordor Intelligence projects the overarching enterprise endpoint security market to expand from $23.34B in 2026 to $39.41B by 2031, reflecting an 11% compound annual growth rate (CAGR) powered by cloud migrations and AI-driven behavioral analytics. However, treating this $23.34B total addressable market (TAM) as immediately serviceable overstates Glow's near-term capture potential. The serviceable addressable market (SAM) is bounded by organizations actively running local generative AI workflows, where unauthorized tool adoption has surged from 15% to 45% in a single year according to data cited from Verizon's 2026 DBIR. The immediate serviceable obtainable market (SOM) is further restricted to enterprise segments with critical exposure—specifically financial services, healthcare, and retail—where manual security triage cannot keep pace with automated threats. Unsubstantiated consumer-market datasets (such as $115B wellness sizing or $2.3B cosmetic projections) represent invalid sizing paths that must be rejected.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-persona-and-budget
    title: Enterprise Buyer Personas, Payer Alignment, and Adoption Dynamics
    body: |
      Enterprise procurement for Glow centers on Chief Information Security Officers (CISOs), Chief Information Officers (CIOs), and VP-level security engineering leaders who face escalating pressure to facilitate corporate AI adoption without compromising device compliance. In enterprise hierarchies, CISOs control dedicated endpoint and application security budgets, while departmental business units and developer teams act as end users who organically introduce autonomous coding assistants and unvetted open-source packages. Operating executive Emily Heath (former CISO at United Airlines and DocuSign) highlights that existing security stacks force an unacceptable operational friction between enterprise innovation velocity and device defense. Initial enterprise adoption occurs across highly regulated sectors where compliance mandates (GDPR, SOC 2 Type 2, ISO 27001) require continuous asset visibility. Despite high willingness to pilot, enterprise procurement cycles encounter friction when CISOs evaluate whether to trust autonomous AI remediation over human analyst triage.
    claimRefs:
      - CM010
      - CM011
      - CM012
    tableRefs:
      - TM003
  - id: growth-drivers-and-constraints
    title: Market Catalysts, Architectural Shifts, and Structural Constraints
    body: |
      The primary growth catalyst for AI-native endpoint protection is the structural asymmetry between automated attack surfaces and manual human response times. Research cited by industry observers reveals that 30% of enterprise AI agents operate without adequate governance controls, while 67% of software in corporate environments remains completely unmonitored. Attackers routinely weaponize generative AI to automate phishing campaigns, generate polymorphic malware, and inject malicious code into public package registries such as npm. In response, Glow advocates a prevention-first posture, reporting internal benchmarks including an average resolution time of 28 days for critical issues and a claimed 90% reduction in AI supply-chain risk. Conversely, significant market constraints persist: incumbent EDR giants like CrowdStrike, Microsoft Defender, and SentinelOne possess deeply entrenched enterprise contracts, while security buyers remain cautious regarding false positives that could disrupt legitimate business applications.
    claimRefs:
      - CM013
      - CM014
      - CM015
      - CM016
