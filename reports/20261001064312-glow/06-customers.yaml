      - "CU006"
      - "CU007"
      - "CU009"
      - "CU011"
callouts:
  - calloutType: "risk"
    title: "Autonomous Remediation Face Enterprise Trust and False-Positive Blockers"
    body: "While Glow promotes autonomous threat remediation as a core differentiator, enterprise CISOs routinely resist automated software removal in mission-critical corporate environments. An automated agent that mistakenly terminates legitimate executive software or development dependencies can halt business operations, creating substantial procurement hesitation that could delay broad enterprise rollout."
    claimRefs:
      - "CU002"
      - "CU006"
      - "CU010"
  - calloutType: "insight"
    title: "Unidentified Customer Reference Base Masks True Production Conversion"
    body: "Glow's emergence at a $1.2 billion valuation without a single named customer logo reflects an acute valuation premium built on executive founder pedigree rather than audited commercial metrics. Investors must verify whether early healthcare, retail, and banking relationships represent paid enterprise contracts or exploratory beta trials before underwriting long-term retention."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU009"
      - "CU012"
