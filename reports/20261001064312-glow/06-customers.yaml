figures:
  - id: "FU001"
    title: "Enterprise customer adoption journey and expansion loop"
    type: "journey-map"
    summary: "Five-stage progression from shadow AI discovery through procurement, pilot evaluation, automated remediation, and enterprise-wide fleet expansion."
    approximationNotes: "Stages and touchpoints model enterprise cybersecurity procurement workflows based on disclosed pilot verticals and security governance practices."
    data:
      items:
        - label: "Stage 1: Shadow AI Discovery"
          description: "Enterprise CISOs observe surge in employee-deployed AI agents, local models, and unvetted third-party npm libraries across corporate laptops."
          detail: "45% of employee devices utilize AI tools while 67% of software inventory remains unmonitored by legacy security stacks."
          touchpoints:
            - "Corporate Endpoint Audits"
            - "Developer Shadow IT Discovery"
            - "Executive Risk Awareness"
          tone: "risk"
        - label: "Stage 2: Technical Pilot & Compliance Evaluation"
          description: "Security engineering teams deploy Glow in non-blocking discovery mode across designated test workstations in healthcare, retail, or finance."
          detail: "Evaluation against enterprise compliance standards including SOC 2 Type 2, ISO 27001, and GDPR certifications."
          touchpoints:
            - "CISO Security Review"
            - "Latio Profile Assessment"
            - "SOC Integration Scoping"
          tone: "neutral"
        - label: "Stage 3: Policy Configuration & Software Control"
          description: "SOC administrators configure software governance boundaries, establishing automated policies for permitted applications and AI tools."
          detail: "System maps active endpoint assets and flags missing or degraded legacy EDR agent installations."
          touchpoints:
            - "Asset Inventory Mapping"
            - "Software Whitelist Definition"
            - "Admin Policy Dashboard"
          tone: "neutral"
        - label: "Stage 4: Autonomous Remediation & Prevention"
          description: "Glow platform transitions from passive monitoring to automated prevention, actively blocking malicious npm packages and risky software."
          detail: "Vendor claims 90% AI supply-chain risk reduction and autonomous critical threat remediation averaging 28 days."
          touchpoints:
            - "Automated Package Blocking"
            - "Threat Incident Logging"
            - "Exception Handling Triage"
          tone: "positive"
        - label: "Stage 5: Fleet-Wide Enterprise Expansion"
          description: "Successful vertical pilot results prompt enterprise-wide rollout across all corporate workstations, remote laptops, and developer fleets."
          detail: "Land-and-expand licensing scales contract value from initial departmental trial to enterprise-wide annual recurring subscription."
          touchpoints:
            - "Global CISO Renewal"
            - "Annual Contract Expansion"
            - "Multi-Department Rollout"
          tone: "positive"
        - label: "Stage 6: Enterprise Durability & Ecosystem Lock-In"
          description: "Ongoing platform integration embeds autonomous governance across developer pipelines, establishing durable retention and long-term defensibility."
          detail: "Continuous asset intelligence and automated prevention minimize churn while expanding annual contract value across global corporate subsidiaries."
          touchpoints:
            - "Executive QBR Reviews"
            - "Enterprise Compliance Renewal"
            - "Multi-Year Service Level Agreements"
          tone: "positive"
    claimRefs:
