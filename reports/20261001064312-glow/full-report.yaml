  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Reputational Risk Profile
        blocks:
          - type: paragraph
            body: >-
              Glow faces nuanced legal and reputational considerations stemming from founder executive backgrounds and
              cross-border regulatory compliance. Co-founder and CEO Roi Tiger previously co-founded Onavo, which Meta
              acquired before unsealed 2024 court filings alleged criminal conduct in Project Ghostbusters for
              decrypting competitor network traffic. This history creates reputational scrutiny among enterprise CISOs
              and compliance committees. Separately, commercial diligence must disambiguate Glow from Glow, Inc., an
              unrelated fertility app vendor that entered into a $250,000 regulatory settlement with the California
              Attorney General over severe data privacy vulnerabilities. On standard cybersecurity compliance, industry
              vendor profiles list Glow as maintaining GDPR, ISO 27001, and SOC 2 Type 2 credentials, though underlying
              audit documentation remains confidential under customer NDA. Securing enterprise adoption in regulated
              industries will require proactive transparency and rigorous contractual guarantees.
