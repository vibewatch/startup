  - id: TV001
    title: Investment Recommendation and Risk-Valuation Summary
    columns:
      - Dimension
      - Assessment
      - Supporting Rationale
      - Diligence Implication
    rows:
      - - Recommendation
        - Track
        - >-
          Glow combines top-tier leadership and $180M capitalization, but pre-product status at $1.2B demands commercial
          validation.
        - Defer direct equity commitment until enterprise deployment benchmarks and ARR ramp are verified.
      - - Confidence Level
        - Medium
        - Public disclosures confirm financing and syndicate quality, but customer contract metrics remain undisclosed.
        - Cross-reference customer references and pipeline conversion velocity in private diligence.
      - - Risk Rating
        - High
        - Significant valuation asymmetry, unvalidated autonomous remediation claims, and historical executive scrutiny.
        - Audit autonomous agent fail-safes and review founder governance safeguards under formal legal diligence.
      - - Valuation Stance
        - Stretched
        - >-
          At $1.2B post-money with no publicly disclosed ARR, the entry multiple represents an extreme forward growth
          premium.
        - Model downside dilution and structure liquidation preference protections against future down-round risk.
    notes: Assessment synthesizes July 2026 Series A disclosures, peer multiples, and unvalidated product stage.
    claimRefs:
      - CV001
      - CV004
      - CV010
      - CV015
  - id: TV002
    title: Core Investment Thesis and Anti-Thesis Balance
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterpoint
      - View-Breaker Trigger
    rows:
      - - Market Opportunity
        - >-
          Rapid rise of autonomous AI agents on endpoints creates a new corporate attack surface unreachable by legacy
          EDR tools.
        - >-
          Incumbents like CrowdStrike and Microsoft can extend existing agent telemetry to cover AI processes at lower
          friction.
        - >-
          Incumbents release integrated AI agent governance suites that commoditize standalone prevention before Glow
          scales.
      - - Product & Architecture
        - >-
          Context-driven reasoning engine prevents threats in real time before execution, shrinking the endpoint attack
          surface.
        - >-
          Autonomous software blocking without human approval risks business disruption and high false-positive
          resistance.
        - >-
          Enterprise pilots report intolerable false-positive rates that force customers to disable automated
          prevention.
      - - Team & Execution
        - >-
          World-class founding team from Meta, Snowflake, and Claroty backed by premier cyber investors (Sequoia,
          Cyberstarts).
        - >-
          Executive baggage regarding Onavo and Project Ghostbusters may trigger reputational scrutiny in regulated
          enterprise procurement.
        - Regulatory or customer backlash over historical surveillance conduct impedes Fortune 500 security sign-offs.
      - - Valuation & Risk/Reward
        - >-
          Premier tier-one syndicate ($180M raise) gives multi-year runway to capture category leadership in AI endpoint
          protection.
        - >-
          $1.2B post-money valuation prices in flawless execution with zero room for deployment delays or revenue
          misses.
        - Failure to reach $20M ARR within 24 months, forcing a severe down-round or structured recapitalization.
    notes: Evaluation weighs core technical differentiation against enterprise adoption friction and incumbent response.
    claimRefs:
      - CV003
      - CV004
      - CV008
      - CV011
      - CV013
      - CV015
  - id: TV003
    title: Scenario Valuation Modeling (Bull, Base, Bear)
    columns:
      - Scenario
      - Key Assumptions
      - Valuation / Return Logic
      - Primary Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Glow becomes the de facto AI-era endpoint prevention standard; reaches $100M ARR in 4 years; 25x multiple.
        - >-
          Target valuation of $2.5B to $3.5B (2.1x–2.9x entry); potential mega-exit akin to Wiz ($32B) or CyberArk
          ($25B).
        - Incumbent aggressive bundling by CrowdStrike or Microsoft Defender slows enterprise conversion.
        - 20% (requires rapid Fortune 500 adoption and zero critical false-positive incidents).
      - - Base Case
        - >-
          Strong niche traction in AI-heavy verticals (crypto, fintech, tech); achieves $30M–$40M ARR in 3–4 years;
          12x–15x multiple.
        - >-
          Valuation holds at $1.2B–$1.5B (1.0x–1.25x capital preservation); secondary liquidity or strategic
          acquisition.
        - Lengthening enterprise security sales cycles and high R&D cash burn dilute early equity.
        - 55% (reflects credible founding team, massive cash cushion, but unproven mainstream enterprise demand).
      - - Bear Case
        - >-
          Autonomous prevention fails to gain enterprise trust; false positives disrupt workflows; revenue stalls below
          $15M ARR.
        - Down-round recapitalization at $300M–$500M (60%–75% loss of equity value) or acqui-hire exit.
        - Severe customer churn, down-round preference overhang, or reputational fallout from executive history.
        - 25% (reflects extreme entry valuation with zero commercial revenue cushion).
    notes: >-
      Forward multiples reflect historical high-growth cybersecurity transactions discounted for current macro
      multiples.
    claimRefs:
      - CV001
      - CV007
      - CV009
      - CV011
      - CV015
