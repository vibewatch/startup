              - CI004
              - CI010
              - CI011
              - CI012
              - CI016
      - number: '4.3'
        title: Large financing does not establish available cash or runway
        blocks:
          - type: paragraph
            body: >-
              Three sources report $180 million of financing at a $1.2 billion valuation, and QuantLogix calculates that
              financing as 15% of post-money value while explicitly warning that this is not an ownership or dilution
              estimate. Two other databases instead report a $100 million Series B. This disagreement affects the
              opening capital base and must be reconciled to transaction documents. The Jerusalem Post reports that
              proceeds are intended for U.S. go-to-market expansion and Glow Labs, but no source states cash on hand,
              monthly burn, debt, restricted cash, or runway. Funding raised is therefore not interchangeable with
              liquidity available on the run date. A runway conclusion requires bank balances, the cash-flow statement,
              current headcount and compensation, committed hiring, vendor obligations, and the preferred-stock
              documents.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI006
              - CI016
      - number: '4.4'
        title: 'Financial verdict: capitalized, but not publicly underwritable'
        blocks:
          - type: paragraph
            body: >-
              The strongest public conclusion is that Glow has substantial reported venture backing and an aggressive
              expansion mandate, not that it has durable revenue or sufficient runway. At launch, The Cryptonomist
              described the company as having no public product and said all reported performance metrics were
              self-reported and independently unvalidated; Latio likewise displayed no user reviews. Those facts weaken
              the evidentiary link between technical claims, paid adoption, and economic value. The financing
              discrepancy further limits capitalization confidence. Underwriting should remain conditional on audited
              revenue, customer-level ARR, contracts, cohort retention, gross-margin and service-cost schedules, cash
              and burn records, and a reconciled capitalization table. A California regulator page about a fertility-app
              operator named Glow, Inc. is a namesake record and must not be attributed to this 2025-founded
              cybersecurity company.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI008
              - CI009
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
