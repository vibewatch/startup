            title: Inference Latency and External Cloud Model Dependencies
            body: >-
              Glow's reliance on external foundation models (Anthropic Claude and Google Gemini via Amazon Bedrock)
              introduces third-party availability, latency, and inference margin risks into mission-critical endpoint
              protection workflows that historically demanded sub-millisecond local execution.
