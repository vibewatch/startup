            title: Do not convert financing headlines into runway
            body: >-
              Reported funding is neither a cash balance nor accounting burn evidence. The $100 million versus $180
              million transaction conflict and the absence of cash-flow data prevent a defensible runway estimate.
            calloutType: risk
            claimRefs:
              - CI001
              - CI003
              - CI004
