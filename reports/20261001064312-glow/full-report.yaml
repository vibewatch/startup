  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation, Buyer Personas, and Enterprise Use Cases
        blocks:
          - type: paragraph
            body: >
              Glow segments its prospective customer base across enterprise organizations undergoing rapid generative AI
              adoption, where employees and internal engineering teams deploy local AI tools and autonomous coding
              agents on corporate workstations. The economic buyer in Glow's sales motion is the Chief Information
              Security Officer (CISO) or VP of Enterprise Information Security, who controls endpoint security and
              software governance budgets. CISOs operate under strict regulatory and operational mandates, requiring
              verifiable proof that introducing autonomous AI software does not expose sensitive customer records,
              intellectual property, or production credentials. Conversely, the day-to-day users who interact with
              Glow's administrative console are Security Operations Center (SOC) analysts, IT desktop administrators,
              and security engineering teams tasked with monitoring software execution across corporate device fleets.
              The end users directly governed by Glow are corporate knowledge workers and software developers whose
              endpoint workstations run AI assistants, specialized coding tools, and third-party dependencies such as
              open-source npm packages. Target vertical segments prioritize heavily regulated industries, particularly
              healthcare organizations managing sensitive patient health data, retail enterprises protecting consumer
              payment infrastructure, and financial institutions guarding transaction pipelines against unauthorized
              external data exfiltration.
            claimRefs:
              - CU001
              - CU002
