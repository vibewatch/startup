      - number: '6.3'
        title: Customer Durability, Expansion Friction, and Concentration Hazards
        blocks:
          - type: paragraph
            body: >
              Evaluating customer retention, net revenue expansion, and account durability for Glow is severely
              constrained by the company's strict private disclosure posture upon emerging from stealth at a $1.2
              billion valuation. Glow has disclosed no audited customer retention metrics, net revenue retention (NRR)
              rates, gross revenue retention (GRR) figures, annual contract values (ACV), or logo churn percentages. In
              enterprise endpoint security, commercial durability depends on successful land-and-expand dynamics, where
              initial departmental workstation deployments expand into enterprise-wide fleet licenses across all
              employee laptops and servers. However, Glow faces structural procurement friction: enterprise CISOs are
              historically reluctant to grant autonomous AI agents unmonitored remediation authority to terminate
              processes or remove software on critical executive and engineering endpoints due to fear of business
              disruption. Furthermore, early customer engagements in healthcare and banking carry substantial account
              concentration risk, where loss of one or two marquee pilot partners would materially impact realized
              commercial traction. Crucially, Glow's headline efficacy claims—such as a 90% reduction in AI supply-chain
              risk and a 28-day autonomous resolution benchmark—remain vendor self-reported figures derived from
              internal interactions that have not undergone independent third-party stress testing or public peer audit.
            claimRefs:
