  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis Balance
        blocks:
          - type: paragraph
            body: >-
              Glow's investment thesis centers on the structural transformation of corporate endpoints into unmonitored
              launchpads for autonomous AI agents. As regular enterprise AI agent adoption expands from 15% to 45% in a
              single year, traditional endpoint detection and response architectures designed for human operators face
              severe visibility gaps. Glow counters this vulnerability through a prevention-first engine powered by
              specialized AI agents that continuously map device software and automatically restrict unapproved packages
              before execution. The founding team brings exceptional technical pedigree from Meta, Snowflake, and
              Claroty, backed by a premier syndicate including Sequoia Capital and Cyberstarts with $180 million in
              fresh capital. Conversely, the anti-thesis highlights critical operational and reputational
              vulnerabilities. Glow's autonomous remediation mechanism claims a 90% reduction in AI supply-chain risk,
              yet all published efficacy metrics remain self-reported without third-party laboratory verification.
              Furthermore, chief executive Roi Tiger's prior leadership of Meta's Onavo subsidiary—which unsealed court
              records implicated in deceptive competitor decryption under Project Ghostbusters—presents meaningful
              governance overhang. Enterprises in regulated sectors may hesitate to grant autonomous software-removal
              authority to a platform whose leadership carries historical surveillance controversies.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
