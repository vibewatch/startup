        title: Pricing, sales efficiency, and unit economics remain private
        blocks:
          - type: paragraph
            body: >-
              Neither list pricing nor realized pricing is available in the assigned evidence. The same disclosure gap
              covers annual contract value, discounting, customer acquisition cost, sales-cycle length, payback, churn,
              retention, gross margin, hosting cost, support cost, and professional-services effort. Public workforce
