  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope, Autonomous Endpoint Defense, and Customer Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Glow defines its core offering as an AI-powered endpoint security platform engineered to protect corporate
              laptops, desktops, and distributed workstations from modern execution risks. Rather than adhering to
              conventional endpoint detection and response paradigms that alert security operations personnel after
              malicious code has landed, Glow advocates an autonomous prevention-first architecture. The system deploys
              specialized AI agents directly onto endpoints to continuously map running processes, evaluate execution
              intent in real time, and automatically block unauthorized or risky software before it establishes
              persistence. In customer workflow terms, Glow targets the widespread operational blind spot created by
              employee adoption of generative AI tools, unvetted coding assistants, and open-source packages. By
              autonomously enforcing enterprise security policies at the device boundary, the platform prevents
              developers and knowledge workers from inadvertently introducing vulnerabilities, while removing
              administrative overhead from Tier-1 Security Operations Center triage queues.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE011
      - number: '5.2'
        title: Technical Architecture, Dual LLM Orchestration, and Cloud Inference Dependencies
        blocks:
          - type: paragraph
            body: >-
              Architecturally, Glow combines a local endpoint sensor with a hybrid cloud intelligence pipeline. On the
              device, Glow agents capture fine-grained system events, including process launches, file-system
              modifications, and dependency resolution calls. Telemetry is fed into Glow's proprietary context engine,
              which reconstructs execution context and evaluates behavioral intent. To execute multi-step reasoning and
              semantic policy decisions, the platform leverages external foundation models—specifically Anthropic Claude
              and Google Gemini models accessed via Amazon Bedrock—interfaced with its internal policy rules. While this
              dual foundation model strategy provides sophisticated natural language policy interpretation and rapid
              adaptation to novel exploit patterns, it introduces a critical operational dependency on external cloud
              inference infrastructure. Mission-critical endpoint controls are consequently subject to cloud API token
              economics, network latency variations, and third-party platform availability, presenting architectural
              trade-offs compared to traditional purely on-device signature engines.
