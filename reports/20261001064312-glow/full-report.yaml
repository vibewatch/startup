              band. These observations are activity and scale proxies, not operating-expense measurements. They cannot
              support a burn estimate without payroll, vendor, infrastructure, and capitalization records. The
              appropriate underwriting response is a structured data request, not a synthetic margin or CAC benchmark.
            claimRefs:
