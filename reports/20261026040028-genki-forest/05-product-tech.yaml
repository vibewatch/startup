          items:
            - label: Carbonation and filling
              detail: Reported process description, not an audited engineering specification.
        - label: Owned manufacturing
          detail: Historical factory reports and the 2026 company update describe expansion; operating metrics are absent.
          items:
            - name: Owned factories
              detail: Five factories reported historically; current footprint requires confirmation
            - label: Facility roadmap
              detail: Tianjin phase two was reported operational; Henan was described as planned.
        - label: Route to market
          detail: The 2021 U.S. announcement named channels; current distribution and sell-through are unknown.
          items:
            - name: Online
              detail: Named in a 2021 U.S. launch announcement
            - name: Selected retail
              detail: Named in the same dated announcement; current distribution is unknown
    claimRefs:
