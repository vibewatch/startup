      - ["NTUC, Sheng Siong, and Village Grocer", "Singapore and Malaysia supermarket channels", "FoodNavigator reported product availability in Singapore and Malaysia in 2020", "Named-chain availability is reported; no store count or sell-through", "Historical editorial account; no current listing or reorder confirmation"]
