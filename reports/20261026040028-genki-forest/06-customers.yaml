    notes: "These are non-comparable indicators, not a continuous adoption series. Values and metric labels are reproduced as reported; no customer, account, reorder, or retention estimate is inferred."
    claimRefs: [CU002, CU003, CU004, CU008, CU012]
  - id: TU003
