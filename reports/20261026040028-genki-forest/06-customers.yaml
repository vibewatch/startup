    notes: "Partial sample of publicly named channel relationships from 2020–2025, not a complete account enumeration. Retail listings and distributor statements are not equivalent to independently verified customer outcomes."
    enumerationScope:
      coverage: partial
      basis: "Publicly named distributor and retail references in retained sources through 2025; no full customer/account roster was available."
