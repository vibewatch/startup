company:
  name: Genki Forest
chapter:
  number: 6
  title: Customers
  summary: Historical reporting shows Genki Forest built a broad mix of direct, retail, and distributor channels, with named outlet availability and a recent company-reported growth signal. Public evidence does not establish current account-level sell-through, retention, customer concentration, or independently verified outcomes.
sections:
  - id: customer-segments
    title: Customer segments and routes to market
    body: >-
      The public record describes a consumer beverage business rather than a
      disclosed enterprise-account model. Historical coverage points to young
      consumers, e-commerce, convenience retail, and distributor-led access to
      smaller stores, while later reporting describes a distributor's
      experience with several product categories. These are channels and
      target segments, not a count of active customers or proof of recurring
      household purchase. International evidence is similarly uneven: the
      company named selected US retail outlets in a 2021 release, and a 2020
      trade interview reported specific Southeast Asian chains. The table
      separates reported availability from planned expansion and labels
      company-issued statements; none of these sources discloses retailer
      sell-through or the economic contribution of each segment.
    claimRefs: [CU001, CU005, CU006, CU007, CU008, CU009, CU010, CU011, CU013]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption signals are not retention evidence
    body: >-
      Historical scale indicators include reported e-commerce event sales,
      cross-border availability, and a company-wide 2025 growth figure
      attributed to conference materials. They use different units and
      periods: a campaign bottle count, a cumulative unit-sales claim,
      channel-share estimates, a geographic footprint, and an undefined
      “overall performance” measure cannot be combined into one adoption
      curve. A named but anonymized distributor's reported sales
      target and profitability are a useful local anecdote, not a customer
      cohort or independently verified outcome. The available marketplace
      snapshots are narrow: Amazon displayed 21 ratings for one product ASIN,
      while a separate seller-profile estimate provides no review denominator
      or observation window. No source supplies repeat-purchase rates, retailer reorder
      cadence, churn, retention cohorts, or account concentration, so durability
      and expansion remain material diligence gaps.
    claimRefs: [CU001, CU002, CU003, CU004, CU011, CU012, CU013, CU014]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: channel-risk-and-proof-quality
    title: Channel proof and unresolved commercial risks
    body: >-
      Named retail references demonstrate that products were described as
      available through selected outlets, but most are historical and one is a
      company press release. A listed product or distribution announcement
      does not show active orders, store count, sell-through, renewal, or a
      customer reference. The 2025 36Kr account reports earlier channel
      overstocking and a distributor's initial losses; the conference-oriented
      account does not quantify the scale or recurrence of those issues.
      TechCrunch separately reported a social-media backlash after a labeling
      clarification amid accusations of misleading marketing, but did not
      measure lost sales or churn. Diligence should obtain current retailer-level
      reorder and inventory data, named reference permissions, and customer
      contribution by geography and channel before treating reach as durable
      demand.
    claimRefs: [CU005, CU006, CU007, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
callouts:
  - calloutType: strength
    title: Broad historical route-to-market evidence
    body: Independent coverage described online and offline sales, while trade and investor sources named retail availability across China-linked international markets; this supports reach, not repeat purchasing.
    claimRefs: [CU001, CU002, CU005, CU006, CU007]
  - calloutType: risk
    title: Retention and concentration remain unverified
    body: No retained source provides customer cohorts, reorder cadence, churn, or top-account exposure; historical channel presence and a distributor anecdote cannot substitute for those measures.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
