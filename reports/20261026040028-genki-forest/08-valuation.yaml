  evidenceGaps:
    - type: missing-source
      severity: material
      topic: financial-disclosure
      missingEvidence: Dated, reconciled revenue, gross margin, operating profit, cash flow, working capital, and net-debt figures for 2025 and the latest interim period.
      whyItMatters: Without a current financial denominator and cash-conversion view, neither a current multiple nor a defensible scenario valuation can be calculated.
      diligencePath: Request audited statements and a management bridge from revenue through operating profit to cash flow, with period definitions and currency.
      relatedQuestionRefs: [QV003, QV004]
    - type: missing-source
      severity: material
      topic: financing-terms
      missingEvidence: Latest financing or secondary transaction price, cap table, preference stack, dilution schedule, and investor liquidity rights.
      whyItMatters: Headline round valuations do not determine common-equity proceeds or the return available to a new investor.
      diligencePath: Obtain the latest priced-round documents, fully diluted cap table, preference waterfall, and any secondary or exit restrictions.
      relatedQuestionRefs: [QV005, QV008]
    - type: missing-source
      severity: material
      topic: comparables
      missingEvidence: Dated, business-model-matched transaction or public-company comparables with comparable revenue, margins, and growth periods.
      whyItMatters: An undated valuation range or competitor headline cannot support a matched multiple or exit scenario.
      diligencePath: Build a same-period beverage peer set only after confirming Genki Forest's segment mix, margins, geography, and reporting basis.
      relatedQuestionRefs: [QV006]
