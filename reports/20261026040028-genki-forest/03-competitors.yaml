    notes: >-
      Competitor names and descriptions are limited to the cited secondary profile
      and expert commentary. Scale/funding cells are explicitly unreported where
      the assigned text supplies no comparable values; company-reported sell-through
      is not an independent market measure.
    claimRefs: [CP002, CP003, CP006, CP015, CP016]
  - id: TP002
    title: Capability comparison and evidence limits
    columns: [Buying criterion, Genki Forest evidence, Alternative evidence, Implication and unknown]
    rows:
      - [Low/no-sugar proposition, "The company release described zero-sugar and zero-calorie sparkling water.", "Campaign Asia-Pacific experts said the claim had become table stakes after Coca-Cola and Nongfu Spring entered the space.", "A familiar claim alone is not demonstrated differentiation; formula-level comparisons are absent."]
      - [Flavor and product iteration, "The 2021 release listed Asian-inspired flavors and Ran Tea; 2026 coverage attributes product and SKU focus to management.", "No named competitor flavor test or side-by-side product benchmark appears in the retained text.", "Distinctive flavor is a company positioning claim, not evidence of sustained preference."]
      - [GTM and distribution, "The release named online sales and select US retailers; historical China reporting described convenience-store and vending presence.", "The profile provides competitor names but no matching retailer coverage or channel economics.", "Current weighted distribution, reorder rates, and retailer bargaining power remain unknown."]
      - [Trust and claims, "Campaign Asia-Pacific reported historical labeling/health-claim controversy and expert concerns about perceived quality.", "No current competitor claim-substantiation audit or regulatory comparison is present.", "The older criticism creates a diligence issue, not evidence of a current violation."]
    notes: >-
      This is a qualitative comparison of what the assigned sources state, not a
      scored or independently tested product benchmark. Unknown competitor cells
      are left explicit rather than inferred.
    claimRefs: [CP003, CP004, CP006, CP007, CP008, CP009, CP010]
  - id: TP003
    title: Pricing, packaging, and contract evidence
    columns: [Offer or listing, Published unit / pack, Price or contract basis, Evidence status]
    rows:
      - [Genki Forest sparkling water, "330 ml can", "No price or contract terms stated.", "Company press release, US launch context; not realized pricing."]
      - [Genki Forest Ran Tea, "16.9 oz PET bottle", "No price or contract terms stated.", "Company press release; product and pack only."]
      - [Genki Forest Alibaba listing, "Listing also describes 330 ml × 24 cans.", "$0.53 displayed; 10,000-barrel minimum order; another field says single-item selling unit.", "Supplier listing has incompatible units and does not establish a comparable retail or wholesale price."]
      - [Named competitors, "No comparable pack size found in assigned text.", "No list, realized, or contract prices reported.", "Gap: no like-for-like price/volume comparison is supported."]
    notes: >-
      Prices and contract terms are not normalized because the marketplace listing
      mixes a displayed dollar amount, barrel-based order quantity, and single-item
      unit. No currency conversion, wholesale interpretation, or retail price is
      inferred.
    claimRefs: [CP003, CP013, CP014]
