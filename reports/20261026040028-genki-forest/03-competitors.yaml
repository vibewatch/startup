        - label: Channel execution
          values: ["Company reporting describes improved penetration and retail execution.", "Company-attributed claim", "No matched competitor coverage, reorder, or margin data."]
        - label: Pricing
          values: ["One marketplace listing has incompatible price and order-unit fields.", "Not comparable", "No defensible price-premium or cost-position conclusion."]
        - label: Trust and product claims
          values: ["An expert article recounts historical controversy and perceived-quality concerns.", "Historical and not a current regulatory finding", "Current claim-substantiation and incident records remain diligence gaps."]
        - label: Switching and lock-in
          values: ["No assigned source measures consumer switching, multi-homing, or retailer exclusivity.", "Unresolved", "Do not underwrite retention or channel lock-in from brand awareness alone."]
    claimRefs: [CP007, CP008, CP010, CP011, CP013, CP014]
callouts:
  - calloutType: risk
    title: Zero-sugar is not a durable moat by itself
    body: Campaign Asia-Pacific’s cited experts describe the claim as table stakes and point to copycat entry; the assigned evidence does not establish an independent performance edge that offsets this commoditization risk.
    claimRefs: [CP006, CP007, CP014]
  - calloutType: insight
    title: Channel discipline is a hypothesis to verify
    body: The 2026 company-attributed account describes tighter price discipline and better channel execution, but no independent reorder, retailer-economics, or competitor comparison is available.
    claimRefs: [CP009, CP010, CP011]
