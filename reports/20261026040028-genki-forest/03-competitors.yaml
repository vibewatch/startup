  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitor-scale
      missingEvidence: Current, independently sourced competitor revenue or volume, funding, customer segment, realized pricing, and market-share data on a comparable basis.
      whyItMatters: The available competitor profile is secondary and the other sources do not provide matched scale measures, preventing a defensible ranking of Genki Forest against named alternatives.
      diligencePath: Obtain current competitor filings or audited disclosures, retailer sell-through data, and a dated third-party category study using consistent geography and product definitions.
      relatedQuestionRefs: [QP002]
    - type: stale
      severity: material
      topic: trust-and-claims
      missingEvidence: Current substantiation and regulatory status for the product and health claims, together with recent consumer evidence on perceived quality.
