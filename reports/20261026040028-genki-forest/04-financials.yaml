    title: Missing financial statements are the underwriting bottleneck
    body: Public volume and growth claims do not establish revenue, margin, cash generation, or runway; require periodized financial statements before assigning operating value.
    claimRefs: [CI003, CI004, CI009, CI012, CI013]
