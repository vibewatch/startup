  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-disclosure
      missingEvidence: Audited or management-certified revenue by product, geography, and period, with metric definitions and reconciliation to reported growth and volume.
      whyItMatters: Without a defined revenue base and mix, the reported unit volume and “overall performance” growth cannot support revenue quality, growth, or valuation analysis.
      diligencePath: Request monthly and annual financial statements plus SKU- and channel-level revenue, units, returns, discounts, and revenue-recognition policies for 2023–2026.
      relatedQuestionRefs: [QI003, QI004, QI008]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Realized prices, ingredient and packaging costs, manufacturing cost by owned plant versus OEM, utilization, freight, distributor deductions, and gross margin by product.
      whyItMatters: Public reporting identifies a potentially costly ingredient and an asserted factory-cost benefit but provides no measured per-unit economics or margin bridge.
      diligencePath: Request SKU bills of material, supplier contracts, plant utilization and depreciation, OEM invoices, channel terms, and a reconciled gross-margin bridge.
      relatedQuestionRefs: [QI002, QI005]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash and restricted cash, operating cash flow, burn, debt and guarantees, capex commitments, working capital, and financing triggers.
      whyItMatters: Historical fundraising and valuation reports do not establish current cash available, runway, debt exposure, or dependence on another financing.
      diligencePath: Obtain the latest balance sheet, cash-flow statement, debt schedule, working-capital aging, capex plan, and board-approved financing forecast.
      relatedQuestionRefs: [QI010]
    - type: stale
      severity: material
      topic: product-labeling-risk
      missingEvidence: Current legal and regulatory status, substantiation for “zero sucrose” and other product claims, and any resulting penalties, relabeling, or refunds.
      whyItMatters: The assigned adverse evidence is from 2021 and does not establish the outcome or current exposure; unresolved claims could affect product availability, marketing, or costs.
      diligencePath: Request the current claims-substantiation file, regulator correspondence, litigation schedule, and remediation records from legal and regulatory teams.
      relatedQuestionRefs: [QI006]
