company:
  name: Genki Forest
chapter:
  number: 4
  title: Financials
  summary: Public evidence supports a broad beverage portfolio, company-reported growth and sales volume, and identifiable ingredient and manufacturing cost drivers. It does not establish revenue, gross margin, cash, burn, runway, or current valuation, so underwriting remains constrained by missing private financials.
sections:
  - id: sales-evidence
    title: Sales evidence is directional, not a revenue base
    body: >-
      The clearest public traction figures use unlike measures. Genki Forest's 2021 U.S.
      launch release first claimed more than 1,000,000,000 cans and bottles sold globally,
      but its About section later said more than 1,000,000; the release gives no
      measurement period, realized price, or revenue (CI003, CI011). A 2025
      performance statement reported 26% year-on-year growth in “overall performance,”
      without defining whether that meant revenue, volume, or another measure (CI004).
      Neither figure can safely be treated as ARR, current revenue, or a comparable
      growth series. Product coverage describes sparkling water and ready-to-drink tea,
      but no source here breaks sales or economics out by product (CI001). The
      activity-to-revenue flow therefore distinguishes observable product and channel
      steps from unreported sell-through and gross profit. This is evidence of demand
      and a multi-category offer, not a basis for a revenue multiple.
    claimRefs: [CI001, CI002, CI003, CI004, CI008, CI011, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: costs-and-monetization
    title: Ingredient and production economics remain unquantified
    body: >-
      Available reporting identifies plausible cost levers but not a usable unit
      economics model. A Genki Forest business-development executive told FoodNavigator
      that erythritol cost about 70 times more than other sugar replacements such as
      aspartame, with costs varying by country (CI007). The same coverage reports that
      the company began with OEM production, started operating its first Anhui factory
      in June 2020, and said owning a factory helped minimize costs versus OEM (CI005,
      CI006).
      None of these sources quantifies ingredient cost per can, factory utilization,
      capex, manufacturing savings, freight, retailer margins, or gross margin. U.S.
      customs-platform data records imports and buyer trade value, which is a cross-border
      activity proxy rather than reported customer revenue (CI008). Product-level
      pricing and channel deductions therefore remain diligence items, not model inputs.
    claimRefs: [CI005, CI006, CI007, CI008, CI011, CI016]
    tableRefs: [TI002, TI003]
  - id: capital-and-underwriting-gaps
    title: Historical financing cannot establish present capital adequacy
    body: >-
      The financing evidence is historical and does not show cash available today. In
      2021, Pandaily reported a company-announced post-investment valuation of $6
      billion and separately reported that Genki Forest denied a rumor of a proposed
      $14–15 billion valuation (CI012, CI013); the South China Morning Post had earlier
      reported a $2 billion valuation based on local media (CI014). These are dated
      valuation reports, not current enterprise value, proceeds retained, or cash
      balance. A profile compiled in August 2026 says its provided sources stated no
      publicly reported financial figures, while listing a Q1 2026 headcount estimate
      sourced to Revelio Labs (CI009, CI010). A 2021 food-labeling report also records
      legal experts' concern about potentially misleading “zero sucrose” advertising,
      despite its account that the wording was permitted on packaging (CI015); it does
      not establish a current ruling or liability. Without current statements, margins,
      working capital, debt, cash burn, and product-claim outcomes, capital needs and
      revenue quality cannot be underwritten.
    claimRefs: [CI009, CI010, CI012, CI013, CI014, CI015]
tables:
  - id: TI001
    title: Public revenue and traction evidence
    columns: [Metric or stream, Publicly stated value, Evidence status, Underwriting limit]
    rows:
      - [Portfolio, "Sparkling water and RTD tea described in 2020–2021 coverage", "Company release and independent trade coverage", "No product-level revenue or mix"]
      - [Physical sales, "Oct 2021 release says over 1,000,000,000 globally, then over 1,000,000 in its About section", "Internally inconsistent company claim; period basis not specified", "Not revenue, ARR, or a current annual run rate"]
      - [2025 performance, "26% year-on-year growth in overall performance", "Company-disclosed metric relayed by IPO Early News; metric definition absent", "Cannot assume it is revenue growth"]
      - [Revenue by product or geography, "Not quantified in the assigned public evidence", "No audited segment disclosure identified in the sources used", "Request a periodized revenue bridge"]
    notes: >-
      Sources report different measures and periods; physical units and undefined “overall
      performance” are not interchangeable with revenue. Company claims are not audited
      financial statements.
    claimRefs: [CI001, CI003, CI004, CI009]
  - id: TI002
    title: Pricing, channel and cross-border monetization evidence
    columns: [Input, Reported evidence, What it supports, Missing diligence]
    rows:
      - [U.S. route to market, "Company release named online sales and select retailers including H Mart and 99 Ranch Market", "Online plus retail availability in 2021", "Realized price, retailer terms, discounts, and sell-through"]
      - [Southeast Asia route to market, "FoodNavigator described supermarkets and e-commerce in Singapore and Malaysia", "Company-reported channel expansion; an interviewee said offline would remain the bulk outside China", "Distributor economics, channel fees, and repeat rates"]
      - [List and realized pricing, "The 2021 U.S. launch release gives no list or realized price", "The release does not provide a price input", "Current SKU-level price, net revenue, and promotions"]
      - [U.S. imports, "121 imported shipments and US$11.34 million buyer trade value, Jan 2022–Mar 2026", "Trade-data activity for Genki Forest America Inc.; not customer revenue", "Reconcile customs value to invoices, inventory, duties, and sell-through"]
    notes: >-
      Channel descriptions are historical and do not establish current availability or
      channel mix. Trademo's shipment and buyer trade-value figures are third-party
      trade-data measures, not audited revenue.
    claimRefs: [CI002, CI008, CI016]
  - id: TI003
    title: Unit-economics and capital inputs available for underwriting
    columns: [Metric or driver, Public evidence, Interpretation, Diligence request]
    rows:
      - [Sweetener cost, "Company executive said erythritol costs about 70 times more than other sugar replacements such as aspartame; varies by country", "Potential input-cost pressure; no cost per unit disclosed", "Obtain ingredient bills of material and supplier terms by SKU"]
      - [Manufacturing, "First Anhui factory began operating in Jun 2020; reported cost savings versus OEM were not quantified", "Ownership may alter the cost base but utilization and capex are unknown", "Request plant utilization, depreciation, capex, and OEM-versus-owned cost data"]
      - [Workforce, "3,438 employees in Q1 2026 in an Aug 2026 profile, attributed there to Revelio Labs", "Headcount is only a scale proxy; payroll and contractor costs are absent", "Reconcile workforce, loaded payroll, and productivity by function"]
      - [Capital and profitability, "Historical reports cite $2 billion in 2020 and $6 billion in 2021 valuations; no current cash, burn, debt, or gross margin is established", "Valuation and funding raised do not indicate cash on hand or runway", "Obtain current balance sheet, cash-flow statement, debt schedule, and financing plan"]
    notes: >-
      The ingredient cost and factory-savings figures are attributed statements, not
      independently measured unit costs. Historical valuations are not cash proceeds or
      current valuation.
    claimRefs: [CI005, CI006, CI007, CI009, CI010, CI012, CI013, CI014]
