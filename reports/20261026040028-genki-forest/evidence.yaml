evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current financials and valuation
    missingEvidence: >-
      Audited 2024–2025 revenue, gross margin, EBITDA, operating cash flow, and a current valuation supported by
      transaction or cap-table documentation.
    whyItMatters: >-
      Company-reported growth and profitability language cannot establish revenue, cash generation, or investable
      valuation, and the secondary valuation profile is internally unreconciled.
    diligencePath: >-
      Request audited financial statements, current management accounts, the financing ledger, cap table and any recent
      transaction or valuation materials under NDA.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: founding year
    missingEvidence: An authoritative incorporation record or company history reconciling the 2015 and 2016 founding dates.
    whyItMatters: Company age and the timeline should not be anchored to a single inconsistent secondary account.
    diligencePath: Request the company’s incorporation certificate and a dated history of predecessor entities and brand launch.
    relatedQuestionRefs:
      - QO001
  - type: missing-source
    severity: material
    topic: founder and board governance
    missingEvidence: >-
      A current executive roster, legal director list, ownership/control rights and succession or key-person
      arrangements.
    whyItMatters: >-
      Founder identification alone does not show whether operating responsibility and oversight are institutionalized or
      concentrated.
    diligencePath: >-
      Obtain the current organization chart, shareholder register, board composition and key-person/delegation
      documentation.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: customers and commercial scale
    missingEvidence: A dated, defined customer or household count and channel-level sales, repeat-purchase and concentration measures.
    whyItMatters: Employee estimates and geographic availability do not establish paying-customer scale or durable demand.
    diligencePath: >-
      Request monthly distributor sell-through, retailer reorder, e-commerce cohort and top-customer concentration
      schedules.
