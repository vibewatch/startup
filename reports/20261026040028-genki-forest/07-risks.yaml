company:
  name: Genki Forest
chapter:
  number: 7
  title: Risks
  summary: >-
    The clearest evidenced risk is product-claim and consumer-trust exposure: in 2021, the
    company acknowledged that milk-tea packaging could mislead buyers about total sugar, while
    current labels and controls remain unverified. A new Chinese nutrition-label standard is
    scheduled to take effect on 2027-03-16, and public evidence here does not establish company
    readiness. Historical reporting also points to sweetener-cost, manufacturing, distribution,
    and capital-market diligence needs, but does not quantify present exposure or demonstrate a
    current incident.
sections:
  - id: product-claims-and-regulation
    title: Product claims, labeling, and regulatory exposure
    body: >-
      The strongest direct adverse evidence is historical, not proof of a current violation. The
      China Project reported that Genki Forest acknowledged its milk-tea packaging and advertising
      could mislead consumers about total sugar when it emphasized zero sucrose; the company said
      it had changed the packaging and marketing. The same coverage described continued consumer
      criticism, while a separate HFGIP review questioned the visibility of a caffeine warning
      and explicitly left any legal determination to enforcement authorities. These records
      justify a current SKU-level label and laboratory audit, but they do not establish an
      enforcement finding or the present state of any product. A translated excerpt of GB
      28050-2025 sets out a future transition: the standard was issued in March 2025 and is
      scheduled to apply from March 2027. A KENFOX article describes broader scrutiny of
      “zero-sucrose” marks, but does not identify Genki Forest as an applicant or respondent.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
    tableRefs:
      - TR001
  - id: operating-and-unit-economics
    title: Operating model and unit-economics exposure
    body: >-
      Historical reporting describes an operating-model transition rather than verified current
      plant performance. FoodNavigator-Asia reported that Genki initially used OEM facilities in
      several Chinese locations and that its first company-operated factory in Anhui began
      operating in June 2020. It also quoted an executive saying erythritol cost about 70 times
      more than substitutes such as aspartame, with variation by country; this is a dated input
      price comparison, not Genki’s procurement price, formulation share, or margin impact. In
      September 2020, SCMP reported plans for two additional factories and exports to 100
      countries. Those plans, alongside company-supplied 2021 reach claims, do not prove present
      capacity, quality controls, utilization, or realized international sales. Request current
      plant, supplier, yield, rejection, recall, and SKU-level cost data before assigning
      quantified operational or margin exposure.
    claimRefs:
      - CR010
      - CR011
      - CR012
    tableRefs:
      - TR002
  - id: counterparties-and-financing
    title: Partner, channel, and financing dependencies
    body: >-
      Public evidence for counterparties is thin and dated. A 2021 company-issued release listed
      selected U.S. retailers and claimed five self-owned factories and sales in more than 30
      countries or regions; these are company statements, not independent measures of channel
      concentration, repeat orders, or overseas contribution. A Sing Tao Headline article
      reported Bloomberg-attributed preliminary adviser discussions about a possible Hong Kong
      listing while quoting a company representative saying there was no IPO plan. The fetched
      text does not establish the article’s publication date or any current transaction, so it is
      historical context rather than evidence of a 2026 financing plan. Neither the assigned
      sources nor these claims establish current partner concentration, contractual protections,
      liquidity, or cash available. The risk heatmap therefore distinguishes observed historical
      signals and a known future regulatory date from unsupported current probability estimates;
      absence of an incident in this pool is not evidence that none occurred.
    claimRefs:
      - CR013
      - CR014
      - CR015
      - CR016
    tableRefs:
      - TR003
    figureRefs:
      - FR001
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk
      - Source-grounded signal and period
      - Likelihood
      - Severity / impact
      - Mitigation maturity / residual exposure
      - Diligence path
    rows:
      - - Nutrition-label standard transition
        - "GB 28050-2025 was issued in 2025 and is scheduled to apply from 2027-03-16."
        - "Readiness unknown; deadline is established."
        - "Potentially material across affected prepackaged-food labels; company exposure is unmeasured."
        - "No company transition assessment or current SKU audit is in the assigned evidence."
        - "Obtain a SKU-by-SKU gap assessment, owners, and implementation timeline."
      - - Historical milk-tea claim ambiguity
        - "In 2021 the company said prior zero-sucrose / low-calorie packaging could mislead on total sugar."
        - "A past event is documented; current recurrence likelihood is unknown."
        - "Medium: consumer trust and claim-substantiation exposure; sales impact is not quantified."
        - "Company reported packaging and marketing changes; no current independent verification."
        - "Inspect current labels and formulations; test products and review complaint handling."
      - - Warning visibility and consumer interpretation
        - "A HFGIP author described the caffeine warning as difficult to see on a reviewed milk-tea package."
        - "Unclear; one historical review is not a representative product audit."
        - "Potentially material to consumer understanding; no regulator finding is established."
        - "No enforcement determination or present corrective-control evidence in the source."
        - "Review package readability, child-directed presentation, and legal sign-off across SKUs."
      - - “Zero sucrose” trademark scrutiny
        - "KENFOX reports CNIPA refusals involving such marks; the article names no Genki Forest proceeding."
        - "Company-specific exposure unknown."
        - "Low-to-medium as a sector signal; no company-specific impact is evidenced."
        - "No company trademark or claims review is documented in the assigned pool."
        - "Obtain counsel’s current mark, packaging, and claims review plus relevant docket results."
    notes: >-
      Partial register of labeling and trademark signals in the assigned pool, from 2021 through
      the 2027 effective date; not an exhaustive regulator, court, trademark, or SKU search.
      Likelihood and severity are qualitative diligence priorities, not measured probabilities
      or a finding of noncompliance. Unknown current status is not evidence of no incident.
    enumerationScope:
      coverage: partial
      basis: "Public labeling and trademark signals in the assigned pool, 2021 through the 2027 standard transition; not a complete docket or SKU census."
    claimRefs:
      - CR002
      - CR003
      - CR005
      - CR006
      - CR009
  - id: TR002
    title: Operational and unit-economics risk register
    columns:
      - Failure mode
      - Evidence and period
      - Likelihood
      - Severity / residual exposure
      - Mitigation maturity
      - Diligence path
    rows:
      - - Plant execution and quality-control visibility
        - "FoodNavigator reported early OEM use and an Anhui factory operating from June 2020."
        - "Current likelihood cannot be assessed from the historical account."
        - "Potentially material; utilization, rejects, recalls, and plant-level quality outcomes are not supplied."
        - "Owning a factory was described as reducing costs; this does not establish current QA maturity."
        - "Request plant-level utilization, yield, reject, audit, recall, and incident records."
      - - Sweetener input-cost sensitivity
        - "A 2020 FoodNavigator interview cited erythritol at about 70x the cost of aspartame, varying by country."
        - "Current price and sourcing exposure unknown."
        - "Potential margin pressure, not quantified; no company COGS or formulation denominator is disclosed here."
        - "No evidence of hedging, dual sourcing, or reformulation controls in the assigned sources."
        - "Obtain current supplier terms, ingredient share, alternatives, and SKU-level gross-margin sensitivities."
      - - Expansion and capacity execution
        - "SCMP reported 2020 plans for two factories and 100-country exports; plans are not delivered capacity."
        - "Execution status after those reports is unknown."
        - "Potentially material if capacity or market entry lagged; no current operating metrics are available."
        - "A 2021 company release made reach claims, but independent operational verification is absent."
        - "Reconcile current plants, markets served, volumes, and product-level service/quality metrics."
    notes: >-
      Historical reporting and company claims identify questions, not current operating
      performance. Relative ingredient price is not the company’s purchase price or cash burn;
      factory plans and company reach statements do not establish achieved capacity or sales.
    claimRefs:
      - CR010
      - CR011
      - CR012
  - id: TR003
    title: Partner, channel, and financing dependency register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration evidence
      - Failure scenario
      - Mitigation / residual exposure
      - Diligence path
    rows:
      - - U.S. retail and online access
        - "Company release named online sales and selected retailers including H Mart and 99 Ranch Market (2021)."
        - "No channel share, terms, reorder, or current distribution denominator is supplied."
        - "Loss of a route-to-market could reduce access; scale of exposure is unknown."
        - "Historical availability statement only; no current channel contingency evidence."
        - "Request retailer-level sales, renewal terms, distributor roles, and alternate-route plans."
      - - Overseas market reach
        - "The 2021 release claimed 30+ countries or regions; SCMP had earlier reported a 100-country ambition."
        - "No current geography-level revenue, partner, or concentration data is supplied."
        - "Expansion targets may not translate into durable distribution or positive contribution."
        - "Company-issued reach claim is not independent proof of current market activity."
        - "Reconcile active markets, local partners, sell-through, returns, and contribution margins."
      - - Financing / listing visibility
        - "Sing Tao Headline relayed a possible listing story and the company’s reported denial of IPO plans."
        - "No current financing, liquidity, or transaction evidence is established."
        - "A delayed or unavailable capital event could affect strategic options; magnitude is unknown."
        - "The article is undated in the fetched text and does not establish a current plan."
        - "Request current financing, debt, liquidity, cap-table, and board-approved capital plans."
    notes: >-
      Historical company announcements are issuer claims, not independent channel benchmarks.
      The listing report is undated in the fetched text and cannot support a current IPO or
      financing assertion. Missing concentration, liquidity, and contract data are diligence
      gaps, not proof of absence.
    claimRefs:
      - CR013
      - CR014
      - CR016
