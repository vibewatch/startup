callouts:
  - calloutType: risk
    title: Current product and legal status remains unverified
    body: >-
      Historical corrective statements do not establish current SKU compliance, and the pool
      contains no company-specific enforcement finding. Obtain current product labels, laboratory
      results, and regulator/court review; an unobserved incident is not evidence that none exists.
    claimRefs:
      - CR003
      - CR005
      - CR006
  - calloutType: insight
    title: Quantify transition and unit-cost exposure before assigning downside
    body: >-
      The 2027 labeling deadline and historical erythritol price comparison identify concrete
      diligence work, but neither the company’s readiness nor ingredient-level margin sensitivity
      is measured in these sources.
    claimRefs:
      - CR008
      - CR010
