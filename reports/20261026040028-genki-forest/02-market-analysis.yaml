company:
  name: Genki Forest
chapter:
  number: 2
  title: Market Analysis
  summary: China's beverage market is large, but published figures combine categories and vintages that cannot establish Genki Forest's addressable sparkling-water market. USDA FAS reports strong scale in broad beverages and selected adjacent segments, while company-specific channel evidence is older and does not disclose sell-through, market share, or a defensible SAM/SOM.
sections:
  - id: market-boundary
    title: Define the addressable category before sizing
    body: >-
      The defensible top-level boundary is China's non-alcoholic beverage market:
      USDA FAS includes bottled water, juices, carbonated drinks, tea, and
      functional beverages in its description. That broad figure is context,
      not Genki Forest's addressable market. The closest core segment is
      carbonated, zero-sugar sparkling water; ready-to-drink tea and functional
      drinks are adjacent product markets and should remain separate unless
      SKU-level evidence shows overlap. Beverage-shop service sales are also a
      distinct lens, not an incremental amount to add to packaged-drink totals.
      The assigned evidence does not isolate China's sparkling-water or
      zero-sugar sparkling-water spend, nor define which conventional soda,
      bottled-water, and tea purchases actually switch to Genki Forest.
    claimRefs: [CM001, CM002, CM006, CM009]
    tableRefs: [TM001]
  - id: market-sizing-lenses
    title: Published sizing signals do not resolve company TAM
    body: >-
      USDA FAS reported that China's beverage market exceeded US$170 billion in
      2024 and represented 12.7% of global consumption, but this is a
      multi-category market rather than a sparkling-water estimate. The China
      Project cited US$192 billion for China's retail beverage market in 2019;
      the sources do not provide matching scope or methodology, so the two
      values are not a growth series. USDA separately reports a US$49 billion
      ready-to-drink tea and beverage-shop market in 2024, plus functional and
      energy-drink measures. These are different, potentially overlapping
      lenses, not additive market layers. None of the assigned sources provides
      the category denominator or product/geography revenue required to isolate
      Genki Forest's SAM or SOM.
    claimRefs: [CM002, CM003, CM004, CM006, CM007, CM008]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-channels
    title: Buyers, use occasions, and route to market
    body: >-
      USDA FAS describes carbonated beverages as appealing broadly, especially
      to younger consumers; its segment profiles distinguish younger and
      predominantly female ready-to-drink tea consumers from more male-skewed
      sports and functional-drink consumers. For China beverages overall,
      offline channels accounted for 90.6% of sales in 2024. Daxue's older
      company-level account reports that in 2021 convenience stores represented
      35% of Genki Forest B2C sales, other offline retail 39%, and e-commerce
      roughly 25%; the periods and denominators differ and should not be
      combined. PandaDaily reported more than 1,000 dealers and over one
      million offline terminals across more than 800 Chinese cities in 2021.
      For the United States, a company release named online sales and selected
      retailers, while an independent report described an Amazon ranking in
      December 2021. These are historical channel-access signals, not current
      sell-through, market share, or repeat-purchase evidence.
    claimRefs: [CM005, CM010, CM011, CM013, CM014, CM015]
    tableRefs: [TM003]
  - id: adoption-drivers-and-constraints
    title: Health positioning meets cost and proof constraints
    body: >-
      Low-sugar positioning is directionally consistent with the demand signals
      in USDA FAS's 2025 report and Daxue's account of health-conscious Chinese
      consumers; USDA reports an 80% year-on-year rise in offline sugar-free tea
      sales, but the cited passage does not identify the comparison year.
      USDA's import-specific price observations also show a value constraint:
      imported drinks in a stated per-bottle band were most popular, while
      higher prices could meet resistance; those are not Genki Forest price
      points. Overseas channel reports describe halal certification and
      retailer safety audits as access requirements, while Costco placement
      counts establish distribution reach only. None of these sources supplies
      current sell-through, reorder rates, price elasticity, product-level
      share, or contribution margin.
    claimRefs: [CM009, CM012, CM014, CM015, CM016]
callouts:
  - calloutType: risk
    title: Broad market scale is not a company-specific TAM
    body: USDA FAS's broad China beverage figure cannot be converted into Genki Forest's addressable sparkling-water spend without a consistent category denominator and current company sell-through evidence.
    claimRefs: [CM001, CM002]
