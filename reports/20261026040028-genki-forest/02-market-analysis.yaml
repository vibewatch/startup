    title: Market boundary and included spend
    columns: [Segment or boundary, Included spend, Exclusions and substitutes, Buyer and payer evidence, Relevance to Genki Forest]
    rows:
      - [China non-alcoholic beverages, "Bottled water, juices, carbonated drinks, tea, and functional beverages in USDA FAS's broad market description.", "Alcoholic beverages are outside this stated boundary; prepared beverage-shop service spend is not assumed to be identical to packaged-drink sales.", "Consumers purchase across categories; a product-specific payer or budget owner is not established in the assigned evidence.", "Top-level context only; not a Genki Forest TAM."]
      - [Carbonated beverages, "Carbonated drinks, including both conventional and zero-sugar products where classified by the source.", "Bottled water and ready-to-drink tea are separate categories; sugary soda and other flavored drinks are substitutes.", "USDA FAS says the category appeals broadly, especially to younger consumers.", "Closest broad category for sparkling water, but no standalone value is supplied."]
      - [Zero-sugar sparkling water, "Genki Forest's sparkling-water product line is presented as zero-sugar in company-issued material.", "Do not include all bottled water, functional drinks, or other zero-sugar beverages without product-level evidence.", "The sources do not identify a distinct budget owner, switching rate, or current purchase frequency.", "Core segment; China market size and company share are not isolated."]
      - [Ready-to-drink tea, "Packaged tea beverages are included in the broad non-alcoholic market; USDA separately discusses tea and beverage-shop market sizing.", "Keep tea-shop services and packaged RTD tea distinct where source definitions permit; neither is sparkling-water spend.", "USDA describes the RTD tea consumer base as primarily young, with a significant share under 30 and women about 60%.", "Adjacent category; do not add its separate market estimate to sparkling-water TAM."]
      - [Functional and energy drinks, "Functional drinks include products such as energy and sports drinks in USDA FAS's market discussion.", "Functional classifications may overlap with beverage form factors; energy drinks are a subset, not an additional total.", "USDA describes urban white-collar and sports/fitness consumers as key functional-drink demographics.", "Adjacency with reported growth, but not an interchangeable sparkling-water market."]
      - [Beverage-shop market, "USDA reports a separate ready-to-drink tea and beverage-shop market measure.", "Not treated as packaged retail beverage spend or added to the broad market without harmonized definitions.", "The assigned report does not provide a Genki Forest-specific buyer or payer breakdown for shop beverages.", "Useful adjacent consumption context, not core addressable spend."]
    notes: Analyst-defined boundaries based on USDA FAS's category description. Market categories can overlap; beverage-shop services, packaged tea, and packaged sparkling water are not assumed to be additive. Company-specific payer, switching, and budget data are unavailable in the assigned evidence.
    claimRefs: [CM001, CM006, CM009, CM011, CM014]
  - id: TM002
    title: Sizing lenses and comparability limits
    columns: [Publisher, Measure, Geography, Period, Reported value or rate, Method and denominator, Confidence and limitation]
    rows:
      - [USDA FAS, broad beverage market, China, "2024", "More than US$170 billion; over 6% year-on-year growth", "Broad non-alcoholic category; report cites Euromonitor but the assigned text does not reproduce a full calculation method.", "High confidence as a reported estimate; not a sparkling-water TAM."]
      - [USDA FAS, share of global consumption, China, "2024", "12.7% of global consumption", "Share reported alongside the broad beverage market; precise consumption denominator is not specified in the excerpt.", "Useful market-scale lens; not a company-addressable share."]
      - [The China Project, retail beverage market, China, "2019", "US$192 billion", "Article reports a retail beverage total but does not provide category boundaries or calculation method in the fetched text.", "Historical secondary estimate; do not compare directly with the USDA 2024 figure as a growth rate."]
      - [USDA FAS, RTD tea and beverage-shop market, China, "2024; forecast to 2028", "More than US$49 billion in 2024; 6.4% year-on-year growth; projected above US$55 billion by 2028", "Separate retail/service segment measure; underlying category composition is not fully reproduced.", "Adjacent, potentially overlapping market; not additive to the broad beverage total."]
      - [USDA FAS, functional beverage growth, China vs. global, "Period not specified in cited passage", "26% CAGR for China versus 7% global average", "Report does not state the interval or precise functional-drink denominator in the cited passage.", "Directional growth signal, not a monetary TAM."]
      - [USDA FAS, energy-drink market, China, "2024; forecast to 2029", "More than US$15 billion in 2024; projected US$25 billion by 2029", "Energy drinks are a functional-drink subcategory; forecast assumptions are not detailed in the excerpt.", "Separate category lens; do not add to functional drinks or sparkling water."]
    notes: Values and rates are transcribed with their stated geography, period, category, and uncertainty. The sources use different vintages and definitions; no sum, growth rate, market share, or SAM/SOM is calculated from them.
    claimRefs: [CM002, CM003, CM004, CM006, CM007, CM008]
  - id: TM003
    title: Buyer segments and adoption evidence
    columns: [Segment or route, Buyer/user profile in evidence, Payer or budget owner, Adoption signal, Implication and limitation]
    rows:
      - [Carbonated beverages, "Broad consumer base, especially younger consumers, according to USDA FAS.", "Consumer at retail is the apparent purchase unit; specific household budget ownership is not disclosed.", "Health awareness is associated with interest in sugar-free carbonated drinks.", "Supports a broad substitution thesis, not a Genki-specific conversion rate."]
      - [Ready-to-drink tea, "Primarily young consumers; a significant portion is under 30 and women are about 60%, per USDA FAS.", "Consumer retail purchase; source does not quantify payer or spending by cohort.", "USDA reports growth in low-sugar tea and a separate tea/beverage-shop market.", "Adjacent consumer pool; tea measures cannot be used as sparkling-water demand."]
      - [Functional drinks, "Urban white-collar workers and sports/fitness consumers; higher male share, per USDA FAS.", "Consumer retail purchase; no segment-level budget or price elasticity is provided.", "USDA reports functional-drink and energy-drink growth measures.", "Potential adjacency; growth rates do not establish Genki Forest's product fit."]
      - [China retail channels, "Offline supermarkets, convenience stores, and small kiosks are primary channels in USDA FAS's report.", "Retailer assortment and shopper purchase are separate decisions; category-specific buyer budgets are unavailable.", "Offline channels represented 90.6% of China beverage sales in 2024; Daxue gives an older company B2C channel split.", "Offline distribution is material; the two reported mixes have different dates and denominators."]
      - [Genki Forest overseas sparkling water, "Company release targets younger consumers; China Daily reporting describes mainstream North American retail access.", "Company-specific household spend, retail sell-through, and reorder payer terms are not disclosed.", "Company release lists online and select US retailers; China Daily reports Costco placements in the US and Canada.", "Access and channel presence are not proof of repeat demand, share, or contribution margin."]
      - [Imported beverage price band, "USDA FAS reports imported beverages priced $1.40-$2.20 per 300-340 ml as most popular.", "Prices above $3 per bottle may face resistance; prices below $1 may prompt quality or authenticity concerns.", "Consumers pay at retail; Genki Forest's realized prices and price elasticity are not disclosed.", "An import-specific reference only; it does not establish Genki Forest's ASP or willingness-to-pay curve."]
    notes: Segment profiles are source-reported, not independently measured personas for Genki Forest. Company channel availability and reported placements are not sell-through; payer, budget owner, adoption rate, and retailer reorder cadence remain unquantified. The imported-price band is not a company price point.
    claimRefs: [CM005, CM009, CM010, CM011, CM013, CM014, CM015, CM016]
figures:
  - id: FM001
    title: Evidence-constrained market sizing boundary
    type: pyramid
    summary: Only the broad China beverage layer has a reported monetary value; the narrower sparkling-water and company-specific layers remain unquantified.
    data:
      items:
        - label: China non-alcoholic beverage market
          value: ">US$170 billion (2024)"
          detail: Broad USDA FAS category; includes bottled water, juices, carbonated drinks, tea, and functional beverages.
        - label: Carbonated beverage category
          value: Not separately quantified
          detail: Included within the broad market; no comparable category value in the assigned evidence.
        - label: Zero-sugar carbonated beverages
          value: Not separately quantified
          detail: No separate China market denominator is supplied.
        - label: Sparkling water
          value: Not separately quantified
          detail: The nearest core category, but no current China value or growth rate is retained.
        - label: Genki Forest addressable market (SAM)
          value: Not disclosed
          detail: Product- and geography-level sales or eligible buyer count are missing.
        - label: Genki Forest obtainable market (SOM)
          value: Not disclosed
          detail: Current market share, repeat purchase, and channel sell-through are not established.
    approximationNotes: Conceptual nesting only; layer widths do not represent proportional market sizes. Only the broad 2024 value is reported, and lower layers are explicitly unquantified rather than inferred.
    claimRefs: [CM001, CM002, CM009]
