  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Historical marks are not a current entry price
        blocks:
          - type: paragraph
            body: >-
              The available financing record is old and internally uneven. Multiples lists a November 2021 $15 billion
              valuation and a March 2021 $6 billion mark, while its $390 million revenue denominator is also dated March
              2021 (CV001, CV002). The 15.4x figure is therefore a historical valuation-to-revenue observation, not a
              current multiple or an ARR measure. In 2020, SCMP and KrASIA reported a possible approximately $2 billion
              financing valuation, with the latter attributing it to 36Kr and sources familiar with the matter; that is
              evidence of what was reported, not proof of closing terms (CV003). The China Project also reported a $6
              billion mark after 2021 fundraising; this confirms a historical report, not a current price (CV013).
              Dealroom's fetched public profile hides some investor data and does not disclose a dated valuation in the
              accessible text, so it cannot update the last explicit priced mark (CV006). None of these observations
              establishes an investable price, security rights, or a current enterprise-value denominator.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV013
      - number: '8.2'
        title: Operating progress is promising but not yet priceable
        blocks:
          - type: paragraph
            body: >-
              Recent coverage improves the operating narrative but not the valuation bridge. KrASIA's February 2026
              account says founder Tang Binsen described profitability as improved in 2025; it gives no profit, margin,
              cash-flow, or revenue amount (CV004). FoodTalks reports 26% year-on-year growth in the company's 2025
              performance, but the excerpt does not identify the metric, denominator, or accounting basis; it should not
              be relabeled revenue growth (CV005). Warburg Pincus's investment profile describes exports to more than 40
              countries, but this partner statement does not establish current sell through or contribution margin
              (CV008). FoodNavigator's 2020 interview reported both high erythritol input costs and competitive
              conditions for Taiwan entry, useful downside mechanisms but not current cost data (CV009, CV010). The
              evidence supports a credible operating thesis and a material disclosure countercase, not a verified
              current earnings base.
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: Scenario logic without invented precision
        blocks:
          - type: paragraph
            body: >-
              A revenue-multiple or normalized-earnings framework could eventually fit a scaled beverage business, but
              only after the company-level revenue, gross margin, operating profit, working-capital needs, and net debt
              are dated and defined on a consistent basis. The supplied platform data are not a comparable set:
              private-round marks are stale, Dealroom's fetched page does not reveal current valuation or ownership
              terms, and competitor figures cannot substitute for a matched Genki Forest denominator (CV002, CV006,
              CV011, CV014). The 2025 commentary is directional rather than a cash-conversion bridge. Bull, base, and
              bear cases therefore specify evidence-dependent assumptions and triggers, but leave valuation ranges and
              probability weights unassigned. A stale round mark is not a downside floor, and reported funding raised is
              not evidence of cash currently available.
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV011
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: Research more before setting an entry price
        blocks:
          - type: paragraph
            body: >-
              The evidence-sensitive call is research-more, with high risk and unknown valuation stance: this is not a
              conclusion that the company is overvalued, but that current public evidence cannot support a price or
              expected return (CV011, CV012). Before underwriting, obtain dated audited or otherwise reconciled revenue
              and profit measures, cash flow and debt, the latest financing or secondary price, and cap-table terms
              including preferences and dilution. Establish whether any investor liquidity path exists and whether
              overseas growth contributes profit after channel and input costs. Move to track only when these inputs
              permit a comparable entry case; reconsider positively if durable profitable growth and clean terms are
              substantiated, and negatively if margins, channel economics, or financing terms impair returns. The
              decision flow makes these evidence gates explicit.
            claimRefs:
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV007
              - CV009
              - CV011
              - CV012
