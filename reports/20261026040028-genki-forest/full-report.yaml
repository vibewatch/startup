            tableRef: TO002
            claimRefs:
              - CO004
              - CO014
      - number: '1.2'
        title: Capital, valuation and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Cathay Capital’s 9 April 2021 announcement says Sequoia China led a financing round with Warburg Pincus, L
              Catterton, Temasek, Gao Rong, Longhu and others, and that the round valued the company at $6 billion; The
              China Project also reported a $6 billion valuation in 2021 (CO005, CO006). These are dated private-round
              disclosures, not a current valuation or cash-on-hand figure. A Silicon Valley Investclub profile lists
              total funding of $500 million or more, but its financing details do not provide a fully dated amount
              schedule; its profile materials also show a $15 billion November 2021 valuation label alongside an undated
              $6 billion “latest valuation” entry (CO007, CO008). The disagreement and missing underlying transaction
              documents limit confidence in the profile’s totals. The stakeholder map captures named investors, not
              their ownership percentages, voting rights, board seats, or current status. Those are material diligence
              gaps because a list of participants does not establish present control or economic exposure.
            claimRefs:
