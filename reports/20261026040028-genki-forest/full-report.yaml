      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Current product and legal status remains unverified
            body: >-
              Historical corrective statements do not establish current SKU compliance, and the pool contains no
              company-specific enforcement finding. Obtain current product labels, laboratory results, and
              regulator/court review; an unobserved incident is not evidence that none exists.
            calloutType: risk
