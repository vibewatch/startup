              - CO006
              - CO007
              - CO008
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
      - number: '1.3'
        title: Performance, execution and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Recent coverage attributes improved 2025 profitability and high-quality growth to founder Tang’s internal
              letter, while a FoodTalks republication of IPO Early News attributes 26% year-on-year growth in “overall
              performance” to a company performance report (CO010, CO011). Neither source supplies audited revenue,
              margins, EBITDA, cash flow, or a definition that would allow “overall performance” to be relabeled as
              revenue or ARR. The same 36Kr-derived coverage says the second phase of the Tianjin factory began
              operating and a Henan facility was planned (CO013). Separately, 2020 FoodNavigator-Asia coverage reported
              that COVID-19 disrupted Singapore expansion plans and described market-entry challenges in Thailand and
              Taiwan; it is historical context, not proof of a current constraint (CO015). The timeline preserves dated
              company milestones and reported claims without treating company statements as independent verification.
              Investors should request audited financial statements, a current cap table and governance schedule, and
              channel- and plant-level operating data before underwriting current scale or profitability.
