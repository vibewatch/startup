            title: Quantify transition and unit-cost exposure before assigning downside
            body: >-
              The 2027 labeling deadline and historical erythritol price comparison identify concrete diligence work,
              but neither the company’s readiness nor ingredient-level margin sensitivity is measured in these sources.
