  - id: FV001
    title: Evidence gates for an entry decision
    type: flow
    summary: >-
      A research-more recommendation changes only after operating proof, current price, and investor-rights evidence can
      be evaluated together.
    data:
      nodes:
        - id: operating-proof
          label: Verify operating proof
          detail: Dated revenue, margin, cash flow, debt, and working capital.
        - id: current-price
          label: Establish current price
          detail: Latest financing or secondary mark and its date.
        - id: security-rights
          label: Inspect security rights
          detail: Cap table, preferences, dilution, and liquidity path.
        - id: scenario-test
          label: Test scenarios
          detail: Comparable-period assumptions, downside triggers, and returns.
        - id: entry-discipline
          label: Apply entry discipline
          detail: Do not infer fair value from stale marks or funding raised.
        - id: recommendation
          label: Reassess recommendation
          detail: Upgrade, maintain, or decline only when evidence supports the price.
    claimRefs:
      - CV007
      - CV009
      - CV011
      - CV012
