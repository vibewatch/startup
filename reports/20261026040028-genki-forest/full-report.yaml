  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Product claims, labeling, and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The strongest direct adverse evidence is historical, not proof of a current violation. The China Project
              reported that Genki Forest acknowledged its milk-tea packaging and advertising could mislead consumers
              about total sugar when it emphasized zero sucrose; the company said it had changed the packaging and
              marketing. The same coverage described continued consumer criticism, while a separate HFGIP review
              questioned the visibility of a caffeine warning and explicitly left any legal determination to enforcement
              authorities. These records justify a current SKU-level label and laboratory audit, but they do not
              establish an enforcement finding or the present state of any product. A translated excerpt of GB
              28050-2025 sets out a future transition: the standard was issued in March 2025 and is scheduled to apply
              from March 2027. A KENFOX article describes broader scrutiny of “zero-sucrose” marks, but does not
              identify Genki Forest as an applicant or respondent.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR001
