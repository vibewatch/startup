            title: Product breadth is clearer than technical defensibility
            body: >-
              Sources describe recognizable beverage categories and an owned-production strategy, but do not establish
              differentiated formulation IP, independently validated process performance, or SKU-level quality outcomes.
            calloutType: insight
            claimRefs:
