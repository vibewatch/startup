  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Sales evidence is directional, not a revenue base
        blocks:
          - type: paragraph
            body: >-
              The clearest public traction figures use unlike measures. Genki Forest's 2021 U.S. launch release first
              claimed more than 1,000,000,000 cans and bottles sold globally, but its About section later said more than
              1,000,000; the release gives no measurement period, realized price, or revenue (CI003, CI011). A 2025
              performance statement reported 26% year-on-year growth in “overall performance,” without defining whether
              that meant revenue, volume, or another measure (CI004). Neither figure can safely be treated as ARR,
              current revenue, or a comparable growth series. Product coverage describes sparkling water and
              ready-to-drink tea, but no source here breaks sales or economics out by product (CI001). The
              activity-to-revenue flow therefore distinguishes observable product and channel steps from unreported
              sell-through and gross profit. This is evidence of demand and a multi-category offer, not a basis for a
              revenue multiple.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI008
              - CI011
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI009
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
              - CI007
      - number: '4.2'
        title: Ingredient and production economics remain unquantified
        blocks:
          - type: paragraph
            body: >-
              Available reporting identifies plausible cost levers but not a usable unit economics model. A Genki Forest
              business-development executive told FoodNavigator that erythritol cost about 70 times more than other
              sugar replacements such as aspartame, with costs varying by country (CI007). The same coverage reports
              that the company began with OEM production, started operating its first Anhui factory in June 2020, and
              said owning a factory helped minimize costs versus OEM (CI005, CI006). None of these sources quantifies
              ingredient cost per can, factory utilization, capex, manufacturing savings, freight, retailer margins, or
              gross margin. U.S. customs-platform data records imports and buyer trade value, which is a cross-border
              activity proxy rather than reported customer revenue (CI008). Product-level pricing and channel deductions
              therefore remain diligence items, not model inputs.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI011
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI008
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI009
              - CI010
              - CI012
              - CI013
              - CI014
      - number: '4.3'
        title: Historical financing cannot establish present capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The financing evidence is historical and does not show cash available today. In 2021, Pandaily reported a
              company-announced post-investment valuation of $6 billion and separately reported that Genki Forest denied
              a rumor of a proposed $14–15 billion valuation (CI012, CI013); the South China Morning Post had earlier
              reported a $2 billion valuation based on local media (CI014). These are dated valuation reports, not
              current enterprise value, proceeds retained, or cash balance. A profile compiled in August 2026 says its
              provided sources stated no publicly reported financial figures, while listing a Q1 2026 headcount estimate
              sourced to Revelio Labs (CI009, CI010). A 2021 food-labeling report also records legal experts' concern
              about potentially misleading “zero sucrose” advertising, despite its account that the wording was
              permitted on packaging (CI015); it does not establish a current ruling or liability. Without current
              statements, margins, working capital, debt, cash burn, and product-claim outcomes, capital needs and
              revenue quality cannot be underwritten.
            claimRefs:
              - CI009
              - CI010
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Missing financial statements are the underwriting bottleneck
            body: >-
              Public volume and growth claims do not establish revenue, margin, cash generation, or runway; require
              periodized financial statements before assigning operating value.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
              - CI009
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The public product story is a portfolio of packaged drinks rather than a software workflow. Historical
              coverage and the company's 2021 U.S. launch release identify sparkling water and ready-to-drink tea; other
              reported categories include milk tea, juice, energy drinks, and yogurt. The latest retained operating
              update, relaying founder Binsen Tang's February 2026 internal letter, says sparkling water remained the
              revenue anchor while iced tea, Alienergy, and Haozizai grew strongly, but it gives no SKU-level sales,
              volumes, or margins. That update is a company-reported signal, not an independently measured product
              ranking. The portfolio matrix therefore separates documented product families from current availability
              and product economics that remain open.
            claimRefs:
              - CE001
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE001
              - CE003
              - CE004
              - CE005
      - number: '5.2'
        title: Formulation and operating architecture
        blocks:
          - type: paragraph
            body: >-
              Available descriptions connect flavor development to beverage formulation and production, but do not
              reveal a reproducible technical specification. A 2023 academic paper describes aseptic carbonic-acid
              mixing and filling and reports rapid flavor trials; its account is secondary evidence, not a process
              audit. It also dates a company safety-strategy event to 2011, before other retained sources say Genki
              Forest was founded in 2016, so its chronology needs corroboration. A separate profile lists zero-sugar
              formulation, carbonation engineering, and Asian-inspired flavor systems as technology themes without
              benchmarks. The architecture figure is thus a source-attributed operating model, not a verified plant or
              product design.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE009
              - CE013
              - CE014
      - number: '5.3'
        title: Production footprint and maturity
        blocks:
          - type: paragraph
            body: >-
              Company and independent coverage both describe a five-factory owned manufacturing footprint in early
              coverage, while the February 2026 update says phase two of the Tianjin factory had begun operations and a
              Henan facility was planned. This is evidence of reported vertical integration and continued capacity
              investment, not of realized throughput, utilization, yield, reject rates, or cost per unit. The company
              also described U.S. online and selected-retailer availability in 2021; that announcement does not
              establish current distribution, repeat purchase, service levels, or overseas contribution economics. A
              current facility-by-facility asset list, production metrics, and product roadmap are necessary to
              underwrite maturity.
            claimRefs:
              - CE002
              - CE003
              - CE005
      - number: '5.4'
        title: Ingredient, safety, and quality evidence
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a narrow ingredient diligence path, not a product safety conclusion. CKGSB coverage
              says erythritol was used in an early Burning Tea product, while the FDA's GRAS record concerns a Cargill
              notification for erythritol and does not approve Genki Forest products. The assigned text for a 2023
              Nature Medicine paper includes its citation but not its findings; no study result or Genki-specific risk
              is inferred. Current formulations, claim substantiation, facility audit records, batch testing, recall
              history, and incident data are not established by these sources. Absence of those records here is an
              evidence gap, not proof that controls or incidents do not exist.
            claimRefs:
              - CE010
              - CE011
              - CE012
