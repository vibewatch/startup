  - id: FR001
    title: Risk signals and unresolved exposure
    type: matrix
    summary: >-
      Separates a documented historical label episode, the scheduled 2027 standard transition, and unsupported risk-scan
      assertions from verified current exposure.
    data:
      columns:
        - Evidence / likelihood basis
        - Potential impact
        - Mitigation maturity / residual exposure
      rows:
        - label: Historical milk-tea claim episode
          values:
            - Observed in 2021 coverage; recurrence likelihood is unknown.
            - Potential consumer-trust and claims impact; no sales or penalty amount is measured.
            - Company reported a packaging update; current labels and controls remain unverified.
        - label: GB 28050-2025 transition
          values:
            - Future effective date is specified as 2027-03-16; company readiness is unknown.
            - Potentially broad label-remediation exposure; company-specific scope is unmeasured.
            - No transition plan or SKU gap assessment appears in the assigned pool.
        - label: Profitability / supply-chain assertions
          values:
            - Only a low-reputation SWOT page makes these assertions; it supplies no calculations.
            - Not quantifiable from this source and not treated as an established company fact.
            - Unknown; current cost, margin, supplier, and operating data are required.
        - label: Warning visibility
          values:
            - One HFGIP package review; current recurrence likelihood is unknown.
            - Potential consumer-information concern; no official finding or impact measure.
            - No current package audit or regulator determination is in the assigned evidence.
        - label: “Zero sucrose” trademark scrutiny
          values:
            - KENFOX describes sector-wide refusals; no Genki-specific case is identified.
            - Company-specific impact is unknown and not inferred from other applicants.
            - No current company mark or claim review is documented.
        - label: Listing report
          values:
            - Undated fetched article reports preliminary talks and a company denial.
            - Current financing impact cannot be assessed from this historical account.
            - No current transaction or liquidity evidence appears in the assigned pool.
    approximationNotes: >-
      Qualitative evidence map, not a probability-weighted heatmap or independent severity estimate; low-quality
      assertions are explicitly not treated as confirmed exposure.
