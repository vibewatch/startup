  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and routes to market
        blocks:
          - type: paragraph
            body: >-
              The public record describes a consumer beverage business rather than a disclosed enterprise-account model.
              Historical coverage points to young consumers, e-commerce, convenience retail, and distributor-led access
              to smaller stores, while later reporting describes a distributor's experience with several product
              categories. These are channels and target segments, not a count of active customers or proof of recurring
              household purchase. International evidence is similarly uneven: the company named selected US retail
              outlets in a 2021 release, and a 2020 trade interview reported specific Southeast Asian chains. The table
              separates reported availability from planned expansion and labels company-issued statements; none of these
              sources discloses retailer sell-through or the economic contribution of each segment.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
