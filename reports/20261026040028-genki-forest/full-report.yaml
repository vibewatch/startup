      - number: '6.2'
        title: Adoption signals are not retention evidence
        blocks:
          - type: paragraph
            body: >-
              Historical scale indicators include reported e-commerce event sales, cross-border availability, and a
              company-wide 2025 growth figure attributed to conference materials. They use different units and periods:
              a campaign bottle count, a cumulative unit-sales claim, channel-share estimates, a geographic footprint,
              and an undefined “overall performance” measure cannot be combined into one adoption curve. A named but
              anonymized distributor's reported sales target and profitability are a useful local anecdote, not a
              customer cohort or independently verified outcome. The available marketplace snapshots are narrow: Amazon
              displayed 21 ratings for one product ASIN, while a separate seller-profile estimate provides no review
              denominator or observation window. No source supplies repeat-purchase rates, retailer reorder cadence,
              churn, retention cohorts, or account concentration, so durability and expansion remain material diligence
              gaps.
            claimRefs:
