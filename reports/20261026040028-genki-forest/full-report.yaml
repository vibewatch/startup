              - CR003
              - CR005
              - CR006
              - CR009
      - number: '7.2'
        title: Operating model and unit-economics exposure
        blocks:
          - type: paragraph
            body: >-
              Historical reporting describes an operating-model transition rather than verified current plant
              performance. FoodNavigator-Asia reported that Genki initially used OEM facilities in several Chinese
              locations and that its first company-operated factory in Anhui began operating in June 2020. It also
              quoted an executive saying erythritol cost about 70 times more than substitutes such as aspartame, with
              variation by country; this is a dated input price comparison, not Genki’s procurement price, formulation
              share, or margin impact. In September 2020, SCMP reported plans for two additional factories and exports
              to 100 countries. Those plans, alongside company-supplied 2021 reach claims, do not prove present
              capacity, quality controls, utilization, or realized international sales. Request current plant, supplier,
              yield, rejection, recall, and SKU-level cost data before assigning quantified operational or margin
              exposure.
            claimRefs:
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Partner, channel, and financing dependencies
        blocks:
          - type: paragraph
            body: >-
              Public evidence for counterparties is thin and dated. A 2021 company-issued release listed selected U.S.
              retailers and claimed five self-owned factories and sales in more than 30 countries or regions; these are
              company statements, not independent measures of channel concentration, repeat orders, or overseas
              contribution. A Sing Tao Headline article reported Bloomberg-attributed preliminary adviser discussions
              about a possible Hong Kong listing while quoting a company representative saying there was no IPO plan.
              The fetched text does not establish the article’s publication date or any current transaction, so it is
              historical context rather than evidence of a 2026 financing plan. Neither the assigned sources nor these
              claims establish current partner concentration, contractual protections, liquidity, or cash available. The
              risk heatmap therefore distinguishes observed historical signals and a known future regulatory date from
              unsupported current probability estimates; absence of an incident in this pool is not evidence that none
              occurred.
            claimRefs:
              - CR013
              - CR014
              - CR015
