chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              The retained company profile and Cathay Capital both date Genki Forest’s founding to 2016; the profile
              specifies Beijing and April, while The China Project instead says 2015, so the year should be confirmed
              against corporate records rather than silently normalized (CO001, CO002). The Standard describes Chi
              Forest as formerly known as Genki Forest, and Warburg Pincus describes the business as a Chinese
              food-and-beverage company with sparkling water, tea, functional drinks and yogurt (CO003). Cathay
              identifies Binsen Tang as founder and CEO; the retained evidence does not provide a complete executive or
              board roster, ownership map, or succession plan (CO004, CO014). The product model is therefore best
              understood as a private branded beverage business with multiple categories, not as a technology company
              with independently verified software-like recurring revenue. Current customer counts, repeat purchase, and
              channel concentration are not established by these company-overview sources.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO014
