      - number: '6.3'
        title: Channel proof and unresolved commercial risks
        blocks:
          - type: paragraph
            body: >-
              Named retail references demonstrate that products were described as available through selected outlets,
              but most are historical and one is a company press release. A listed product or distribution announcement
              does not show active orders, store count, sell-through, renewal, or a customer reference. The 2025 36Kr
              account reports earlier channel overstocking and a distributor's initial losses; the conference-oriented
              account does not quantify the scale or recurrence of those issues. TechCrunch separately reported a
              social-media backlash after a labeling clarification amid accusations of misleading marketing, but did not
              measure lost sales or churn. Diligence should obtain current retailer-level reorder and inventory data,
              named reference permissions, and customer contribution by geography and channel before treating reach as
              durable demand.
