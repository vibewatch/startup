  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Define the addressable category before sizing
        blocks:
          - type: paragraph
            body: >-
              The defensible top-level boundary is China's non-alcoholic beverage market: USDA FAS includes bottled
              water, juices, carbonated drinks, tea, and functional beverages in its description. That broad figure is
              context, not Genki Forest's addressable market. The closest core segment is carbonated, zero-sugar
              sparkling water; ready-to-drink tea and functional drinks are adjacent product markets and should remain
              separate unless SKU-level evidence shows overlap. Beverage-shop service sales are also a distinct lens,
              not an incremental amount to add to packaged-drink totals. The assigned evidence does not isolate China's
              sparkling-water or zero-sugar sparkling-water spend, nor define which conventional soda, bottled-water,
              and tea purchases actually switch to Genki Forest.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM009
              - CM011
              - CM014
      - number: '2.2'
        title: Published sizing signals do not resolve company TAM
        blocks:
          - type: paragraph
            body: >-
              USDA FAS reported that China's beverage market exceeded US$170 billion in 2024 and represented 12.7% of
              global consumption, but this is a multi-category market rather than a sparkling-water estimate. The China
              Project cited US$192 billion for China's retail beverage market in 2019; the sources do not provide
              matching scope or methodology, so the two values are not a growth series. USDA separately reports a US$49
              billion ready-to-drink tea and beverage-shop market in 2024, plus functional and energy-drink measures.
              These are different, potentially overlapping lenses, not additive market layers. None of the assigned
              sources provides the category denominator or product/geography revenue required to isolate Genki Forest's
              SAM or SOM.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM009
      - number: '2.3'
        title: Buyers, use occasions, and route to market
        blocks:
          - type: paragraph
            body: >-
              USDA FAS describes carbonated beverages as appealing broadly, especially to younger consumers; its segment
              profiles distinguish younger and predominantly female ready-to-drink tea consumers from more male-skewed
              sports and functional-drink consumers. For China beverages overall, offline channels accounted for 90.6%
              of sales in 2024. Daxue's older company-level account reports that in 2021 convenience stores represented
              35% of Genki Forest B2C sales, other offline retail 39%, and e-commerce roughly 25%; the periods and
              denominators differ and should not be combined. PandaDaily reported more than 1,000 dealers and over one
              million offline terminals across more than 800 Chinese cities in 2021. For the United States, a company
              release named online sales and selected retailers, while an independent report described an Amazon ranking
              in December 2021. These are historical channel-access signals, not current sell-through, market share, or
              repeat-purchase evidence.
            claimRefs:
              - CM005
              - CM010
              - CM011
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Health positioning meets cost and proof constraints
        blocks:
          - type: paragraph
            body: >-
              Low-sugar positioning is directionally consistent with the demand signals in USDA FAS's 2025 report and
              Daxue's account of health-conscious Chinese consumers; USDA reports an 80% year-on-year rise in offline
              sugar-free tea sales, but the cited passage does not identify the comparison year. USDA's import-specific
              price observations also show a value constraint: imported drinks in a stated per-bottle band were most
              popular, while higher prices could meet resistance; those are not Genki Forest price points. Overseas
              channel reports describe halal certification and retailer safety audits as access requirements, while
              Costco placement counts establish distribution reach only. None of these sources supplies current
              sell-through, reorder rates, price elasticity, product-level share, or contribution margin.
            claimRefs:
              - CM009
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad market scale is not a company-specific TAM
            body: >-
              USDA FAS's broad China beverage figure cannot be converted into Genki Forest's addressable sparkling-water
              spend without a consistent category denominator and current company sell-through evidence.
            calloutType: risk
            claimRefs:
              - CM001
              - CM002
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and evidence boundary
        blocks:
          - type: paragraph
            body: >-
              The retained sources point to several overlapping alternatives rather than one clean peer group. Campaign
              Asia-Pacific commentary identifies Coca-Cola and Nongfu Spring as entrants into the zero-sugar/low-calorie
              space, while a company-profile tear sheet lists US functional and better-for-you brands including Poppi,
              Olipop, KeVita, GT’s Living Foods, Vita Coco, Oatly, and Alo. That tear sheet is a secondary profile, not
              an independent benchmark, and its competitor list does not provide comparable revenue, pricing, or
              market-share data. Genki Forest’s own 2021 US release framed sparkling water as an alternative to sugary
              soda and named select retailers, while earlier reporting described its Chinese convenience-store presence.
              This evidence supports a broad set of incumbents, adjacent brands, and beverage substitutes, not a
              verified direct-peer ranking. The 2021 company release also gives conflicting global unit totals: its lead
              says over 1 billion cans and bottles sold, while its boilerplate says over 1 million. L Catterton's Asia
              page describes a $100 million-plus target equity range for local or regional brands and retail or
              distribution businesses; this is fund strategy, not evidence that a named rival received that capital.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP015
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP015
              - CP016
      - number: '3.2'
        title: Differentiation, channels, and trust
        blocks:
          - type: paragraph
            body: >-
              The strongest disconfirming evidence concerns the durability of a simple “zero sugar” proposition.
              Campaign Asia-Pacific’s quoted branding experts said the claim had become table stakes after major
              competitors entered the category; another expert described copycats and market saturation as weakening
              distinctiveness. The same article raised questions about substantiation and consumer trust, and reported
              an overseas pricing disadvantage, but these are dated expert assessments rather than current consumer or
              sales measurements. More recent KrASIA coverage attributes improved channel execution, price discipline,
              and supply-chain efficiency to the company. Those claims suggest an operational response, but the assigned
              sources do not compare retailer economics, repeat purchase, switching costs, or product performance
              against competitors.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.3'
        title: Pricing evidence and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public price evidence is too inconsistent to establish a price advantage. The company release specifies a
              330 ml sparkling-water can and a 16.9 oz Ran Tea bottle, but gives no price. An Alibaba product listing
              displays “$0.53” alongside a 10,000-barrel minimum order quantity and a separate single-item selling-unit
              field; those conflicting units do not establish a retail price or a comparable wholesale contract.
              Historical coverage also reports ambitions for new factories and broad export reach, which are company
              plans rather than proof of current capacity or cost advantage. The resulting investment case is
              conditional: brand, flavor iteration, and distribution may help, but evidence of repeatable
              differentiation, realized pricing, and channel economics remains unavailable in this source set.
            claimRefs:
              - CP003
              - CP005
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Zero-sugar is not a durable moat by itself
            body: >-
              Campaign Asia-Pacific’s cited experts describe the claim as table stakes and point to copycat entry; the
              assigned evidence does not establish an independent performance edge that offsets this commoditization
              risk.
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP014
          - type: callout
            title: Channel discipline is a hypothesis to verify
            body: >-
              The 2026 company-attributed account describes tighter price discipline and better channel execution, but
              no independent reorder, retailer-economics, or competitor comparison is available.
            calloutType: insight
            claimRefs:
