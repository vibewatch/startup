        - Stake size, current ownership and governance rights not disclosed.
        - Obtain current cap table, security terms and board rights.
      - - Warburg Pincus
        - Named 2021 financing participant; its site lists a 2021 investment year
        - Stake size and present economic exposure not disclosed.
        - Confirm current ownership, follow-on participation and governance rights.
      - - L Catterton
        - Named 2021 financing participant
        - Stake size and present economic exposure not disclosed.
        - Confirm current ownership and any transfer or secondary activity.
      - - Temasek
        - Named 2021 financing participant
        - Stake size and present economic exposure not disclosed.
        - Confirm security type, current ownership and governance rights.
      - - Gao Rong
        - Named 2021 financing participant
        - Stake size and present economic exposure not disclosed.
        - Confirm current ownership and any fund-level transfer activity.
    notes: >-
      Named participants are drawn from Cathay Capital’s round announcement and the Silicon Valley Investclub profile.
      This is not a complete cap table; no amounts, percentages, voting rights or current holdings are inferred.
    enumerationScope:
