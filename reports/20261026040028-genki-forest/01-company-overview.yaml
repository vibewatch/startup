company:
  name: Genki Forest
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Genki Forest, now identified as Chi Forest, is a Beijing-based beverage company whose 2016 founding and founder are
    supported by investor and company-profile sources, although one report gives a conflicting founding year. Public
    sources describe a historical $6 billion financing valuation and recent company-reported growth and profitability
    improvements, but do not establish current audited financials, a reconciled valuation, or a full governance roster.
sections:
  - id: identity-and-business
    title: Identity and operating model
    body: >-
      The retained company profile and Cathay Capital both date Genki Forest’s founding to 2016; the profile specifies
      Beijing and April, while The China Project instead says 2015, so the year should be confirmed against corporate
      records rather than silently normalized (CO001, CO002). The Standard describes Chi Forest as formerly known as
      Genki Forest, and Warburg Pincus describes the business as a Chinese food-and-beverage company with sparkling
      water, tea, functional drinks and yogurt (CO003). Cathay identifies Binsen Tang as founder and CEO; the retained
      evidence does not provide a complete executive or board roster, ownership map, or succession plan (CO004, CO014).
      The product model is therefore best understood as a private branded beverage business with multiple categories,
      not as a technology company with independently verified software-like recurring revenue. Current customer counts,
      repeat purchase, and channel concentration are not established by these company-overview sources.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO014
    tableRefs:
      - TO001
      - TO002
  - id: capital-and-governance
    title: Capital, valuation and governance visibility
    body: >-
      Cathay Capital’s 9 April 2021 announcement says Sequoia China led a financing round with Warburg Pincus, L
      Catterton, Temasek, Gao Rong, Longhu and others, and that the round valued the company at $6 billion; The China
      Project also reported a $6 billion valuation in 2021 (CO005, CO006). These are dated private-round disclosures,
      not a current valuation or cash-on-hand figure. A Silicon Valley Investclub profile lists total funding of $500
      million or more, but its financing details do not provide a fully dated amount schedule; its profile materials
      also show a $15 billion November 2021 valuation label alongside an undated $6 billion “latest valuation” entry
      (CO007, CO008). The disagreement and missing underlying transaction documents limit confidence in the profile’s
      totals. The stakeholder map captures named investors, not their ownership percentages, voting rights, board seats,
      or current status. Those are material diligence gaps because a list of participants does not establish present
      control or economic exposure.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
      - CO014
    tableRefs:
      - TO003
  - id: operating-evidence-and-milestones
    title: Performance, execution and evidence limits
    body: >-
      Recent coverage attributes improved 2025 profitability and high-quality growth to founder Tang’s internal letter,
      while a FoodTalks republication of IPO Early News attributes 26% year-on-year growth in “overall performance” to a
      company performance report (CO010, CO011). Neither source supplies audited revenue, margins, EBITDA, cash flow, or
      a definition that would allow “overall performance” to be relabeled as revenue or ARR. The same 36Kr-derived
      coverage says the second phase of the Tianjin factory began operating and a Henan facility was planned (CO013).
      Separately, 2020 FoodNavigator-Asia coverage reported that COVID-19 disrupted Singapore expansion plans and
      described market-entry challenges in Thailand and Taiwan; it is historical context, not proof of a current
      constraint (CO015). The timeline preserves dated company milestones and reported claims without treating company
      statements as independent verification. Investors should request audited financial statements, a current cap table
      and governance schedule, and channel- and plant-level operating data before underwriting current scale or
      profitability.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO015
      - CO016
    figureRefs:
      - FO001
