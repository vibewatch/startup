company:
  name: SecurityScorecard
chapter:
  number: 7
  title: Risks
  summary: >-
    SecurityScorecard's most material risks cluster in four areas: (1) a structural methodology ceiling where outside-in,
    externally-only observable signals create endemic false positives and contestation exposure that competitors are using
    to gain ground; (2) competitive platform-bundling pressure from Moody's-backed BitSight, UpGuard, and GRC suites
    (ServiceNow, OneTrust) that increasingly embed risk-rating functions natively; (3) an unvalidated AI performance
    narrative—TITAN AI's claimed 99.9% accuracy and 75% supply-chain breach reduction are company-issued with no
    published independent corroboration; and (4) a five-year funding gap since the March 2021 Series E that coincides
    with a ~64% secondary-market valuation discount, creating exit-path and capital uncertainty compounded by founder
    key-person concentration and private-company disclosure opacity.

sections:
  - id: methodology-scoring-integrity
    title: Methodology Opacity, False Positives, and Outside-In Limits
    body: >-
      SecurityScorecard's core competitive asset—its outside-in ratings engine—is simultaneously its greatest structural
      liability. Because the platform relies exclusively on externally observable signals (open ports, DNS health, IP
      reputation, certificate anomalies, and dark-web exposure), it cannot assess any compensating control that is not
      internet-visible: compensating firewalls, network segmentation, application-layer protections, and internal
      governance postures are fully invisible to the model. This creates a well-documented class of false positives
      where legitimate configurations—such as cloud-provider shared IP ranges, ephemeral development environments,
      and correctly managed but externally unusual TLS settings—are scored as vulnerabilities, causing vendor friction
      and dispute escalation.


      Independent user research captured in PeerSpot and AuditXYZ reviews (updated June 2026) documents that false
      positives remain a top complaint among practitioners: "Pricing requires improvement, particularly in Brazil, and
      overall pricing expectations could be lower considering the SaaS model" co-exists alongside complaints that
      "inaccuracies arise from associating unrelated company vulnerabilities" and that remediation guidance lacks
      specificity about root-cause versus noise. Industry-wide analysis from Netcraft (2024) found that 33% of
      companies delayed responding to actual cyberattacks because teams were investigating false alarms, illustrating
      the systemic cost of high false-positive rates in automated scoring tools. SecurityScorecard's 10-day IPv4 scan
      cycle—versus UpGuard's 24-hour cycle—adds a temporal gap during which newly emerged vulnerabilities may persist
      undetected, a factual differentiator that competitors use in sales conversations. The "outside-in only" design
      also creates an asymmetric contestation market: scored companies with low grades have strong commercial incentives
      to dispute findings, and if disputes gain regulatory traction or become legally actionable, SecurityScorecard's
      core product monetisation model faces existential challenge. Score transparency and score change explanations
      were identified as recurring weaknesses in peer reviews, further undermining buyer confidence in the methodology.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR034
      - CR037
    figureRefs:
      - FR001

  - id: competitive-displacement-bundling
    title: Competitive Displacement and Platform Bundling Risks
    body: >-
      SecurityScorecard competes in an increasingly crowded third-party risk management (TPRM) market where platform
      bundlers—ServiceNow, OneTrust, and Microsoft—are embedding native risk-rating and vendor risk workflow capabilities
      into existing GRC stacks already deployed at large enterprise accounts. For buyers who have standardised on these
      platforms, the incremental value of a standalone point solution is harder to justify, particularly at
      SecurityScorecard's reported pricing (starting ~$15,000–$16,500/year for basic tiers; enterprise portfolios
      exceeding $100,000/year). A meaningful erosion risk comes from Moody's Corporation, which was a Series C investor
      in SecurityScorecard in 2017 but subsequently acquired BitSight—creating a structural conflict: a former strategic
      backer now funds and integrates a direct competitor into credit analytics, insurance underwriting, and regulatory
      workflows where Moody's brand carries embedded credibility.


      PeerSpot's June 2026 IT Vendor Risk Management comparison shows SecurityScorecard's mindshare fell to 5.7% (from
      11.1% in the prior year), while BitSight's mindshare simultaneously declined to 5.8% (from 10.8%), suggesting
      both legacy leaders are losing share to emerging entrants and bundled platforms. UpGuard positions its faster
      24-hour scan cycle and all-in-one TPRM bundle as a direct substitute, rated No. 1 by G2 in user sentiment.
      Forrester's recognition of BitSight as a Wave Leader in 2026—while SecurityScorecard was not identified as a
      Forrester Leader—creates a perception gap that enterprise procurement teams use in competitive evaluations.
      ServiceNow and OneTrust increasingly serve as the orchestration layer for vendor risk data, choosing which
      ratings engines to embed as plugins rather than treating them as strategic partners, which compresses
      SecurityScorecard's pricing power and switching-cost moat over time.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR038
    tableRefs:
      - TR003

  - id: product-execution-titan-ai
    title: Product Execution Risk and TITAN AI Validation Gap
    body: >-
      SecurityScorecard's TITAN AI launch at RSA Conference 2026 (March 23, 2026) introduced aggressive performance
      claims: 99.9% accurate risk attribution with a near-zero refute rate, up to 95% reduction in manual TPRM effort,
      9x higher vendor engagement, and up to 75% fewer supply-chain breaches. These are company-issued marketing claims
      without a published independent audit, peer-reviewed methodology, or longitudinal outcome study. The absence of
      third-party validation is material because the claims form the primary justification for pricing premium and
      pipeline acceleration; if enterprise buyers subject them to formal evaluation, SecurityScorecard may be unable to
      substantiate the numbers in a competitive bake-off, exposing the company to both commercial and reputational risk.


      TITAN AI is organised into three tiers—TITAN Watch (continuous visibility), TITAN Assess (AI-driven questionnaire
      automation), and TITAN Secure (threat-informed remediation)—each of which represents a capability that competitors
      including Safe Security's autonomous TPRM platform and UpGuard's native assessment workflows also claim to provide.
      Post-settlement collaboration with Safe Security (announced October 2025) reduces short-term litigation cost but
      also validates Safe Security as a capable market participant, potentially accelerating its growth and creating a
      longer-term competitive threat at the AI layer. The LIFARS DFIR acquisition (February 2022) added 50+ employees
      and expanded the professional services capability; integration risks—cultural alignment, service consistency, and
      DFIR tooling harmonisation—persist but are not publicly reported as resolved. Acquisition integration quality
      remains an unconfirmed diligence item given the private-company disclosure profile.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015

  - id: legal-governance-reputational
    title: Legal, Governance, and Reputational Risks
    body: >-
      SecurityScorecard's only active litigation identified through public records was the trade-secret lawsuit filed
      in 2024 against Safe Security (Safe Securities, Inc.) and Mary Polyakova in the U.S. District Court for the
      Southern District of New York (Case No. 1:24-cv-04240), alleging DTSA violations, breach of end-user agreements,
      and unfair competition. The parties settled in October 2025 and announced a collaborative research partnership,
      removing immediate litigation cost but establishing a legal precedent that customer list data and trade secrets
      carry high sensitivity for disputes involving departing employees. No GDPR regulatory sanctions, FTC enforcement
      actions, or SEC disclosure failures have been identified against SecurityScorecard through GDPR enforcement
      trackers and industry databases as of June 2026.


      The governance structure concentrates strategic, product, and reputational capital heavily in Dr. Aleksandr
      Yampolskiy, CEO and Co-Founder since 2013. Yampolskiy holds a PhD in Cryptography from Yale, has prior CISO
      experience at Gilt Groupe, and security leadership experience at Goldman Sachs and Oracle. His removal,
      incapacitation, or departure would likely impair enterprise sales relationships, partnership negotiations (e.g.,
      Aon, CISA recognition), and product vision continuity. No publicly disclosed succession plan or formal CEO
      backup governance policy has been identified. The company's private-company disclosure profile—no SEC filings,
      no public board committee disclosures—means independent governance oversight cannot be verified externally.
      A minor reputational risk exists from informal LinkedIn endorsements: third parties have cited Yampolskiy's
      social media engagement as validation of "strategic partnership" with SecurityScorecard without a formal
      commercial agreement, creating potential misrepresentation exposure.
    claimRefs:
      - CR016
      - CR017
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
      - CR025
