  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: TITAN AI accuracy validation
      missingEvidence: >-
        Independent third-party audit, peer-reviewed study, or customer-verified outcome data confirming TITAN AI's
        claimed 99.9% risk attribution accuracy, 75% supply-chain breach reduction, and 95% manual-effort reduction.
      whyItMatters: >-
        Company-claimed AI performance metrics without independent corroboration are effectively marketing assertions;
        pricing premium and enterprise pipeline conversion depend on buyers accepting these numbers, which creates
        inflated expectations and potential churn if real-world results diverge materially from stated claims.
      diligencePath: >-
        Request TITAN AI methodology white paper, pilot case study results with quantified breach-reduction data, a
        reference customer list with verifiable outcomes, and any internal or external red-team validation of the
        accuracy claims.
      relatedQuestionRefs:
        - QR008

    - type: private-evidence-only
      severity: material
      topic: governance key-person succession
      missingEvidence: >-
        Any publicly disclosed CEO succession plan, interim leadership designation, board governance charter,
        or management depth chart confirming that SecurityScorecard has formal continuity planning for the
        departure or incapacitation of CEO Yampolskiy.
      whyItMatters: >-
        Concentration of vision, enterprise sales relationships, product strategy, and brand equity in a single
        founder-CEO with no visible succession planning creates an unquantified but material continuity risk for
        both investors and enterprise customers evaluating long-term platform commitments.
      diligencePath: >-
        Request board committee minutes or a governance policy document confirming succession planning; interview
        CRO, CPO, and COO candidates on scope of independent decision-making authority without Yampolskiy present.
      relatedQuestionRefs:
        - QR013

    - type: missing-source
      severity: minor
      topic: AI competitive differentiation
      missingEvidence: >-
        An independent head-to-head technical evaluation comparing SecurityScorecard TITAN AI against Safe Security's
        autonomous TPRM and Cyber Risk Quantification platform, covering accuracy, coverage breadth, and cost
        per managed vendor.
      whyItMatters: >-
        Post-settlement collaboration between SSC and Safe Security masks competitive overlap; buyers do not yet
        have an independent reference point for evaluating which AI TPRM platform delivers superior risk reduction
        per dollar, creating selection uncertainty and reducing SSC's ability to claim unequivocal AI superiority.
      diligencePath: >-
        Commission an independent TPRM benchmark study covering TITAN AI, Safe Security, UpGuard, and BitSight on
        a shared representative vendor universe with verifiable outcome metrics.
      relatedQuestionRefs:
        - QR025

    - type: private-evidence-only
      severity: minor
      topic: headcount trend
      missingEvidence: >-
        Verified employee count data from LinkedIn headcount trend, SEC filing, WARN Act record, or official company
        disclosure confirming SecurityScorecard's headcount trajectory from its 2021-2022 peak (reported as ~600-700
        at peak) through June 2026.
      whyItMatters: >-
        A declining headcount from the Series E-era peak could indicate margin pressure, planned restructuring,
        or operational repositioning ahead of a potential exit; distinguishing genuine efficiency gains from
        quiet attrition is not possible without verified data.
      diligencePath: >-
        Cross-reference LinkedIn company headcount trend data over 24 months, review WARN Act filings in New York
        and Texas, and request from management a current org chart with function-level headcount breakdown.
      relatedQuestionRefs:
        - QR019

    - type: private-evidence-only
      severity: minor
      topic: net revenue retention rate
      missingEvidence: >-
        SecurityScorecard has not publicly disclosed net revenue retention (NRR) or gross revenue retention (GRR)
        metrics; available review data and press releases confirm customer usage and expansion deals but provide
        no quantified NRR range that could be used to assess churn risk versus upsell velocity.
      whyItMatters: >-
        NRR below 110% in a usage-priced platform suggests either pricing ceiling constraints or competitive
        displacement risk; without disclosed NRR, investors cannot independently assess whether the $150M+ ARR
        is growing through new logos or expansion, or whether existing cohorts are contracting.
      diligencePath: >-
        Request cohort-level NRR and GRR by segment (enterprise vs. mid-market vs. channel), by vintage year (2019-2025),
        and by product line (ratings, MAX, TITAN AI); cross-reference with customer reference calls and CRM pipeline data.
      relatedQuestionRefs:
        - QR028

    - type: missing-source
      severity: minor
      topic: TR001 regulatory risk register completeness
      missingEvidence: >-
        Complete regulatory mapping across all SecurityScorecard operating jurisdictions including
        EU AI Act Article 22 applicability (automated scoring of organizations), UK NIS2-equivalent
        rules, FTC data broker rule exposure, and US state-level biometric or data broker statutes;
        only major US federal and EU GDPR risks are well-evidenced in public sources.
      whyItMatters: >-
        SecurityScorecard's ratings influence consequential decisions in regulated industries
        (insurance, financial services, government contracting); incomplete jurisdictional mapping
        may miss material compliance obligations not captured in the current legal risk register.
      diligencePath: >-
        Commission an independent legal opinion covering all jurisdictions where SecurityScorecard
        sells, processes, or distributes data; assess EU AI Act applicability to automated scoring
        and evaluate FTC data broker rule exposure with outside counsel.
      relatedTableRefs:
        - TR001

