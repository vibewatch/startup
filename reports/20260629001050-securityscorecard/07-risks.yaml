callouts:
  - calloutType: risk
    title: Outside-In Methodology Creates an Unresolvable Accuracy Ceiling
    body: >-
      SecurityScorecard's outside-in-only architecture cannot assess internal compensating controls, network
      segmentation, or application-layer protections—by design. As enterprise buyers and regulators demand
      more nuanced evidence of actual risk reduction, this ceiling will face increasing scrutiny. The
      combination of documented false positives and a 10-day scan cycle gap versus faster competitors
      represents a structural risk that product enhancements alone (including TITAN AI) cannot fully
      eliminate without fundamentally changing the data-collection model.
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR034

  - calloutType: risk
    title: Valuation Overhang and Exit Uncertainty Compound Execution Risk
    body: >-
      The ~64% discount between the $1B 2021 primary round and the ~$359.5M 2026 secondary market implied
      valuation signals that investors pricing secondary trades expect either a down-round, a distressed
      acquisition, or a prolonged hold. A five-year funding gap without a public exit path forces
      management to balance aggressive TITAN AI product investment against potential capital constraints,
      and limits the company's ability to outspend well-capitalised competitors.
    claimRefs:
      - CR026
      - CR027
      - CR030

  - calloutType: recommendation
    title: Key Diligence Asks Before Committing Capital
    body: >-
      Investors should request: (1) independent validation study of TITAN AI accuracy and breach reduction
      claims; (2) board governance policy and succession plan for CEO Yampolskiy; (3) gross margin, operating
      cash flow, and ARR growth rate data; (4) audited false-positive and dispute resolution rate data;
      and (5) confirmation of cloud infrastructure business-continuity and DR architecture. None of these
      are currently available via public sources.
    claimRefs:
      - CR011
      - CR013
      - CR021
      - CR023
      - CR029

