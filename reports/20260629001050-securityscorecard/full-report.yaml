      - number: '5.5'
        title: Compliance Posture, Government Certifications, and Trust Controls
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard has built a meaningful government and regulated-sector compliance posture. In October
              2023, the company achieved the FedRAMP Ready designation for its Third-Party Cyber Risk Management
              Platform including Attack Surface Intelligence, placing it among fewer than 450 cloud-based products with
              FedRAMP designation. In February 2025, the company reaffirmed FedRAMP Ready status and additionally
              achieved StateRAMP Ready designation, broadening eligibility to state and local government agency
              procurement. Both designations indicate compliance testing has been completed against rigorous federal
              security controls, but the company has not yet received a full FedRAMP Authorization to Operate (ATO),
              which would require sponsorship and review by a specific federal agency.


              SecurityScorecard's Attack Surface Intelligence product is separately approved on the Department of
              Homeland Security (DHS) Continuous Diagnostics and Mitigation (CDM) Program Approved Products List (APL),
              enabling federal agencies to leverage the product directly. CISA incorporated SecurityScorecard into its
              catalog of Free Cybersecurity Services and Tools in 2022, and SecurityScorecard participates in the CISA
              Joint Cyber Defense Collaborative (JCDC) to share threat intelligence for the defense of public and
              private critical infrastructure. The company has an active partnership with the Transportation Security
              Administration (TSA) Surface Operations Cybersecurity Assurance Division to monitor critical
              infrastructure partners, which the White House described as a "game-changing" blueprint for sector risk
              management agencies.


              On data quality and trust, SecurityScorecard publishes a dispute resolution process that is accessible to
              customers and non-customers alike. Disputed findings are marked as such until resolved, with a promised
              response within 24 hours and score adjustments finalized within 72 hours for validated disputes. The
              company claims a false positive rate below 1%, achieved through rigorous internal validation, asset
              claiming/refutation tools, and partnerships for data corroboration.
