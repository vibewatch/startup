  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Methodology Opacity, False Positives, and Outside-In Limits
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard's core competitive asset—its outside-in ratings engine—is simultaneously its greatest
              structural liability. Because the platform relies exclusively on externally observable signals (open
              ports, DNS health, IP reputation, certificate anomalies, and dark-web exposure), it cannot assess any
              compensating control that is not internet-visible: compensating firewalls, network segmentation,
              application-layer protections, and internal governance postures are fully invisible to the model. This
              creates a well-documented class of false positives where legitimate configurations—such as cloud-provider
              shared IP ranges, ephemeral development environments, and correctly managed but externally unusual TLS
              settings—are scored as vulnerabilities, causing vendor friction and dispute escalation.


              Independent user research captured in PeerSpot and AuditXYZ reviews (updated June 2026) documents that
              false positives remain a top complaint among practitioners: "Pricing requires improvement, particularly in
              Brazil, and overall pricing expectations could be lower considering the SaaS model" co-exists alongside
              complaints that "inaccuracies arise from associating unrelated company vulnerabilities" and that
              remediation guidance lacks specificity about root-cause versus noise. Industry-wide analysis from Netcraft
              (2024) found that 33% of companies delayed responding to actual cyberattacks because teams were
              investigating false alarms, illustrating the systemic cost of high false-positive rates in automated
              scoring tools. SecurityScorecard's 10-day IPv4 scan cycle—versus UpGuard's 24-hour cycle—adds a temporal
              gap during which newly emerged vulnerabilities may persist undetected, a factual differentiator that
              competitors use in sales conversations. The "outside-in only" design also creates an asymmetric
              contestation market: scored companies with low grades have strong commercial incentives to dispute
              findings, and if disputes gain regulatory traction or become legally actionable, SecurityScorecard's core
              product monetisation model faces existential challenge. Score transparency and score change explanations
              were identified as recurring weaknesses in peer reviews, further undermining buyer confidence in the
              methodology.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR034
              - CR037
