      - number: '6.3'
        title: Named Customer Proof and Production Deployment Quality
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard's publicly available named customer library includes production-grade deployments across
              five distinct customer archetypes: international public-sector institution, global consumer brand,
              European private equity, media agency, and cyber insurance integrator. The United Nations International
              Computing Centre (UNICC) provides the highest-quality evidence: a four-page case study with named senior
              administrator Alejandro Bustos, documented deployment across 80+ UN agencies, a specific DNS-incident use
              case resolved via automated alerting, and a 70-75% time savings figure on cybersecurity operations. The
              Hershey Company case study features Phil Addison (Manager of Third-Party Cyber Risk Management) confirming
              100% cyber visibility across the full third-party landscape — including vendors not assessed via
              questionnaire — and integration into incident response, vulnerability management, and M&A due diligence
              workflows. Both cases verify production status rather than pilot deployments.


              Verdane, the European growth-equity firm, demonstrates the private-equity use case: SecurityScorecard
              provides portfolio-wide cyber due diligence across 100+ companies without deploying external consultants,
              enabling a lean in-house cybersecurity capability. Horizon Media achieved an "A" security rating and uses
              SecurityScorecard as an external trust signal in client-facing sales conversations — a documented use case
              where the platform functions as a customer acquisition tool for the rated organization. The Aon
              integration represents institutional proof at the insurance-sector level: Aon embedded SecurityScorecard's
