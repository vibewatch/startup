      - number: '5.6'
        title: Methodology Limitations, Criticism, and Product Risks
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard's scoring uses a proprietary algorithm whose detailed component-level evidence and
              factor-interaction logic are not publicly published, limiting independent audit and reproducibility.
              Organizations subject to scores often cannot trace exactly which data points or signal combinations caused
              a specific finding, frustrating CISOs who wish to verify accuracy before actioning the result. Forrester's
              2024 cybersecurity risk ratings Wave noted specific platform gaps: SecurityScorecard lacked AI-parsing
              tools to assess uploaded evidence documents (SOC 2 reports, policy PDFs), and the platform had challenges
              preventing duplicate findings when the same asset is reported under both an IP address and a hostname.
              Bitsight surpassed SecurityScorecard on Forrester's strategy score in the 2024 Wave, though
              SecurityScorecard retained the top position for current offering strength.


              The outside-in scanning model has structural limitations that are unresolvable without agent deployment. A
              verified AWS Marketplace customer noted that SecurityScorecard only monitors public-facing internet
              assets, not internal (non-internet-facing) devices, which means internal network risks — lateral movement
              vectors, non-routable host vulnerabilities, endpoint compliance — fall outside the product's coverage
              model. Attribution errors also persist: organizations are occasionally scored against IP addresses,
              domains, or assets they do not own, which can lower their grade unfairly. While the dispute mechanism
              exists, the resolution process can require weeks for complex disputes, during which the incorrect score
              affects third-party decisions made by customers, insurers, and regulators.


              AI capability claims associated with TITAN AI — including the 99.9% accurate risk attribution, 75% breach
              reduction, and 9× vendor engagement improvement — are company-asserted figures without independent
              validation. The HyperComply integration began in late 2025 and is still completing platform unification;
              the combined product track record is limited. FedRAMP Ready status (but not Authorized) may slow
              government agency adoption pending full ATO sponsorship. These gaps collectively create material diligence
              questions around scoring transparency, AI evidence quality, and government market timing.
            claimRefs:
              - CE038
              - CE039
              - CE040
              - CE041
              - CE042
