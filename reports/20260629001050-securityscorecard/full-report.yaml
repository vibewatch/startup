      - number: '4.3'
        title: Pricing Architecture and Contract Economics
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard's pricing is tiered but opaque above the entry level. The Free tier provides
              self-assessment access. The Business plan covers monitoring of up to five external entities and is priced
              at approximately $15,000–$25,000 per year based on third-party procurement data. The Enterprise plan
              covers a custom number of monitored scorecards with advanced alerting, compliance frameworks, and a
              dedicated customer success manager; pricing is "Contact Sales" only, with third-party benchmarks
              suggesting typical enterprise contracts of $50,000–$100,000+ per year. The MAX tier—which adds managed
              services, remediation support, and breach detection—carries fully custom pricing estimated at $100,000+
              per year for meaningful deployments.

              Multiple add-ons (Cyber Risk Quantification, Attack Surface Intelligence API, Automatic Vendor Detection)
              sit outside the base Enterprise subscription, potentially materially increasing total contract value. The
              per-user pricing benchmark cited in procurement databases is approximately $20,000/user/year for smaller
              deployments, scaling non-linearly for large organizations. Multi-year discounts are available but not
              systematically disclosed. SecurityScorecard's competitive displacement wins in the October 2025 press
              release involved "six-figure" contracts, confirming that the largest enterprise deals are well above the
              $100K implied ACV floor. The lack of transparent pricing creates uncertainty for buyers and analysts
              alike, and third-party pricing analysts note the "Contact Sales" model "likely targets larger enterprises"
              and has higher entry costs than some competitors.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
