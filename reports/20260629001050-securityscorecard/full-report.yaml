            body: >
              SecurityScorecard's observable financial profile is consistent with a growing, increasingly
              capital-efficient SaaS company: ARR exceeding $150M, positive free cash flow, 40% ARR/FTE improvement,
              triple-digit MAX growth, and 10+ consecutive quarters of revenue growth. These are meaningful signals for
              a private company in the TPRM market. However, nearly every metric required for full financial
              underwriting remains private or unverified.

              The adverse signal from the Safe Security CEO in June 2024—alleging that SecurityScorecard was "laying off
              significant portions of their teams because of the poor performance of their business"—was made during
              active litigation and represents a motivated competitor's characterization. The subsequent October 2025
              press release reporting positive FCF and record quarterly performance directly contradicts this framing.
              However, the litigation context of the original $150M ARR disclosure (it appeared in the lawsuit
              settlement announcement rather than a standalone financial release) invites scrutiny and reduces its
