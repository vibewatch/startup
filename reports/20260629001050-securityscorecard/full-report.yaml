      - number: '2.2'
        title: Market Sizing — Multiple Lenses and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Analyst estimates for the global TPRM software market in 2026 vary substantially depending on definition
              scope: Grand View Research puts the 2023 base at $7.42B growing to $20.59B by 2030 at a 15.7% CAGR;
              SkyQuest estimates $11.11B for 2025 scaling to $37.44B by 2033 at 16.4%; Business Research Insights places
              the 2026 market at $10.36B scaling to $45.98B by 2035 at 18.2%. The spread—roughly $8–11B for a 2026 point
              estimate—reflects different definitions of "TPRM" (pure software vs. managed services included), different
              geographies, and varying treatment of adjacent categories like GRC and EASM.


              The external attack surface management sub-segment that overlaps with SecurityScorecard's ratings engine
              is projected at $930.7M by 2026 at a 17.5% CAGR, while the broader attack surface management market
              (including internal ASM) is estimated to grow from $1.43B in 2024 to $9.19B by 2032 at a 30.4% CAGR. GRC
              software, which houses TPRM workflows for many large enterprises, is separately estimated at $23.32B in
              2026 growing to $39.01B by 2031 at a 10.84% CAGR. Cyber insurance premiums reached approximately
              $15.3–19.6B in 2025–2026 and represent an adjacent demand pool: insurers increasingly require security
              ratings as underwriting inputs, creating a derived demand signal for ratings providers.


              Constructing a bottoms-up SAM for SecurityScorecard requires isolating the software portion of TPRM
              (approximately 59% of market per Grand View Research), the North American and European share (roughly 70%
              combined), and the enterprise-grade portion excludes SME self-serve. Applying these filters to the $10–11B
              TPRM total yields a serviceable addressable market of approximately $4–7B. SecurityScorecard's reported
              $150M+ ARR implies roughly 2–4% penetration of this SAM, consistent with an early-to-mid growth stage. The
              contradictory sizing estimates are preserved in Table TM002 as required by quality policy.
