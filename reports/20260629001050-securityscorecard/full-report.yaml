      - number: '2.5'
        title: Adoption Constraints, Market Friction, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              Despite strong growth tailwinds, the cyber risk ratings and TPRM market faces structural adoption
              constraints. The most frequently cited limitation is data quality and false positives: security ratings
              rely on outside-in passive scanning, which can misattribute assets or flag deprecated infrastructure as
              active vulnerabilities. PeerSpot buyer reviews note that SecurityScorecard's mindshare in IT Vendor Risk
              Management declined from 11.1% to 5.7% between 2025 and 2026, and BitSight's declined from 10.8% to
              5.8%—suggesting category fragmentation rather than leader dominance. The 66% of CISOs who find GRC tools
              "only somewhat effective" reflects broad buyer dissatisfaction across the entire TPRM category, not just
              ratings-specific tools.


              Budget cyclicality is a structural constraint: enterprise security budgets are discretionary above
              regulatory minimums, and ISC2's 2024 data showed 37% of organizations faced security budget cuts and 25%
              experienced cybersecurity layoffs. Platform consolidation creates a displacement risk: Palo Alto Networks,
              Microsoft, and CrowdStrike are expanding their GRC and risk management capabilities, potentially absorbing
              TPRM features into existing enterprise agreements. The Gartner 2026 security spending forecast ($244.2B
              total, growing 13.3%) encompasses all of cybersecurity, and the TPRM segment's growth must compete with
              higher-urgency categories like cloud security (28.8% growth) and endpoint security.


              Procurement friction is a persistent constraint: enterprise security deals typically require CISO
              sponsorship, legal/procurement review, security questionnaire responses from the vendor, and multi-quarter
              evaluation cycles. The 79% of CISOs who lack a formal incident response plan for third-party breaches
              (Panorays) indicates that the market is still in an education and urgency-building phase, with many
              organizations recognizing the problem but not yet budgeting for continuous platform solutions. Cyber
              insurance market softening (global insurance pricing fell ~7% in Q4 2025) may reduce insurance-driven
              urgency for security improvement in the near term.
