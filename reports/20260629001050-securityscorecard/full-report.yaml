        title: Integration Ecosystem, API Platform, and Developer Surface
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard provides a RESTful API at securityscorecard.readme.io with token-based authentication,
              supporting six primary integration patterns: enterprise cyber risk management, third-party risk
              management, workflow management, cyber insurance underwriting, compliance tracking, and attack surface
              management. API calls accept a domain plus an API token and return scorecard grades, factor scores, issue
              lists, historical findings, events, compliance mappings, and third-party supply chain data. Code samples
              are available in Shell, Ruby, Python, PHP, and other languages. API keys do not expire and must be stored
              securely in application secrets rather than in client-side code.


              The Integrate360° Marketplace hosts over 100 certified partner integrations including CrowdStrike Falcon,
              ServiceNow, Archer, OneTrust, and ProcessUnity, enabling customers to route SecurityScorecard data into
              existing GRC, ticketing, and SIEM workflows without custom engineering. MAX became available for direct
              purchase in the CrowdStrike Marketplace in May 2025, letting CrowdStrike Falcon customers add continuous
              supply chain risk monitoring to their security operations. The Microsoft 365 Copilot connector gallery
              lists a SecurityScorecard connector, and the platform integrates into AWS environments through its AWS
              Marketplace listing and cloud asset scanning capabilities.


              SecurityScorecard's GitHub organization (github.com/securityscorecard) hosts 63 public repositories,
              including the design-system React component library (TypeScript, Apache-2.0 license, 13 stars),
              SSC-Threat-Intel-IoCs (public IoC data tied to technical blog posts, 75 stars), an aws-big-data-blog Java
              project (623 stars), and infrastructure tooling including grpc-python-microservice-template and
              consul-template. A separate SSCDeveloperCommunity organization hosts hackathon and community integration
              projects. Developer activity indicates an active engineering organization but the public repositories are
