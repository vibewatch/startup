      - number: '8.5'
        title: Investment Thesis, Anti-Thesis, and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              The investment thesis rests on SecurityScorecard's category leadership in a structurally growing market.
              TPRM is no longer optional: NIS2, DORA, the SEC cyber-disclosure rule, and supply-chain ransomware
              frequency have converted security ratings from a discretionary tool to a board-level mandate.
              SecurityScorecard's 12M+ rated organizations, Fortune 100 penetration (70%), and deep
              insurance-underwriting integrations (Aon, Willis, and others) constitute a data and relationship moat that
              is difficult for new entrants to replicate. The TITAN AI launch at RSA 2026 and the HyperComply
              acquisition address the questionnaire-automation gap and could expand the total contract value per
              account.

              The anti-thesis is equally documented. The TPRM field has 200+ competitors; the Forrester Wave Q2 2026
              placed BitSight as a Leader while SecurityScorecard was not top-ranked, suggesting competitive erosion at
              the highest-value enterprise deals. The outside-in ratings methodology faces persistent false-positive
              criticism that undermines buyer confidence and creates churn risk. Revenue opacity prevents verification
              of margin quality, NRR, or whether growth is driven by expansion (high multiple deserving) versus new
              logos (lower multiple deserving). The $1B valuation is five years stale with no subsequent price
              discovery, while secondary markets have moved 50–64% lower, implying investors are pricing exit
              uncertainty.

              The thesis break is a confirmed NRR below 100%, a disclosed gross margin below 70%, or a new primary round
              priced below $900M (i.e., a down round against the $1B 2021 anchor). Any of these would structurally shift
              the recommendation from TRACK to AVOID.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
