      - number: '8.2'
        title: ARR Anchor and Disclosed Operating Metrics
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard's only publicly disclosed revenue figure is "$150M+ ARR" from its October 2025
              record-quarter press release. Third-party revenue aggregator Latka estimates full-year 2024 ARR at $144.3M
              and projected 2026 ARR at approximately $153.4M. The ARR trajectory — from $71M in 2021 to $88.5M in 2022,
              $106M in 2023, and $150M+ in October 2025 — implies a four-year CAGR of approximately 21%. Channel ARR
              grew 160% year-over-year in 2025 (partner program), though this reflects expansion from a smaller base and
              does not necessarily indicate overall company ARR growth acceleration.

              The company reported positive free cash flow and a 40% improvement in ARR per full-time employee in the
              October 2025 quarter, suggesting meaningful efficiency gains. However, the key value-driver metrics that
              sophisticated buyers require — gross margin, net revenue retention (NRR), monthly burn rate, CAC payback
              period, and logo churn — remain entirely undisclosed. Without NRR, underwriting revenue quality is
              speculative: a 110%+ NRR implies a dollar-based retention engine that commands premium multiples, while a
              90% NRR suggests material churn risk and compresses applicable multiples. Comparable SaaS cybersecurity
              leaders (Palo Alto platform customers: ~120% NRR; CrowdStrike: strong NRR; SentinelOne Q1 FY27: 77%
              non-GAAP gross margin, 4% non-GAAP operating margin) show that disclosure transparency is the baseline
              expectation at this ARR scale. SecurityScorecard's opacity at $150M+ ARR is itself an investment risk.

              The 2021 Series E valued SecurityScorecard at ~14x forward ARR ($71M trailing ARR at round time). The $1B
              stated valuation today implies approximately 6.7x ARR on $150M — a meaningful compression in the implied
              multiple over five years, even though the stated price has not changed. This compression partially
              reflects the market re-rating of SaaS multiples after the 2022 correction; at the 2021 peak, high-growth
              SaaS commanded 20–40x forward revenue multiples. The question for investors is whether the 6.7x ARR
              implied today is a bargain, a fair market price, or still too high given opacity and growth rate.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Comparable Valuation Framework
        blocks:
          - type: paragraph
            body: >
              Public cybersecurity companies trade at a sector median of 7.8x EV/NTM revenue as of June 2026, per
              Multiples.vc and Windsor Drake, with wide dispersion: CrowdStrike at ~27x (platform leader, $5.25B ARR,
              24% growth), Palo Alto Networks at ~18x (platform/NGS ARR $8B), and Tenable at 3.3x (vulnerability
              management, $1B revenue, slower growth). TPRM and risk-ratings vendors as a category sit closer to the
              Tenable end of the spectrum due to narrower product scope and heavier services mix, but
              SecurityScorecard's pure-SaaS ratings engine and insurance network could justify a modest premium above
              point-solution vendors.

              Private cybersecurity SaaS commands a median of 15.2x ARR across all growth bands (Windsor Drake), but
              this masks extreme stratification: companies at 10–30% ARR growth trade at a 6.1x ARR median, those at
              30–50% at 9.8x, and hyper-growers above 50% at 15.2x. SecurityScorecard's overall ARR CAGR of
              approximately 21% since 2021 places it in the 10–30% growth band, implying a median private market
              multiple of approximately 6x–8x ARR, or $900M–$1.2B enterprise value.

              The most directly comparable private transaction is Veeam's $1.725B acquisition of Securiti AI at
              approximately $150M ARR, implying ~11x ARR — an 11x-of-revenue deal for a six-year-old, AI-native data
              security platform. ServiceNow paid approximately 23x ARR for Armis at $340M ARR growing 50% year-over-year
              — a much higher-growth asset. BitSight's 2021 round at $2.4B values it at approximately 12x ARR (on $200M+
              ARR). The $32B Wiz/Google deal at 32–45x ARR is a true outlier (cloud-native, $1B ARR, 40%+ projected 2026
              growth) and should not anchor TPRM-vendor comparable analysis.

              Synthesizing public medians (7.8x), private growth-band benchmarks (6–10x for 10–30% growth), and
              transaction comps (Securiti AI 11x, BitSight 12x strategic), a defensible base-case valuation range for
              SecurityScorecard is $900M–$1.2B at $150M ARR, with a strategic acquirer premium potentially reaching
              $1.5–2.0B. The $1B stated valuation sits comfortably within this range, but is not obviously cheap.
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
