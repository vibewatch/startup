  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Ideal Customer Profile
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard's paying customer base numbered over 3,300 organizations as of February 2026, a jump
              from approximately 2,600 customers in early 2024 — representing roughly 27% growth in two years. The
              platform's stated ideal customer profile is the enterprise CISO or TPRM manager in a regulated sector who
              must continuously monitor a complex vendor ecosystem without dedicating large internal teams to manual
              assessments. Buyer, user, and payer roles are largely unified in mid-market and enterprise accounts: the
              CISO or VP of Security typically champions the purchase, procurement or risk leadership approves the
              budget, and TPRM analysts operate the platform daily. In cyber insurance contexts, an additional payer
              emerges — underwriters at carriers like Aon use SecurityScorecard scores as part of their CyQu cyber risk
              platform, making insurance buyers an indirect customer segment that drives demand from rated organizations
              seeking favorable underwriting terms.


              Vertical concentration skews toward financial services (accounting for 12% of all PeerSpot research
              sessions), followed by technology, healthcare, government, and private equity. Large enterprises (more
              than 1,000 employees) constitute 53% of PeerSpot researchers evaluating SecurityScorecard, underscoring
              that the platform is anchored in the enterprise rather than the SMB market. The $400/month starter tier,
              added in late 2024, attempts to address SMB accessibility, but the $15,000/year entry-level paid tier and
              enterprise packages exceeding $100,000/year position the product firmly at mid-to-large organizations with
              dedicated security budgets. Geographically, the customer base is concentrated in North America, with
              meaningful Japan traction through Macnica's distributor network and growing APAC, European, and Middle
              East footprints delivered via MAX Service Delivery Partners including KPMG Canada, Crowe LLP, Uniqus
              Consultech, and P3 Group. The National Defense ISAC (ND-ISAC) offers SecurityScorecard enterprise licenses
              to its defense-sector member organizations, confirming penetration into the U.S. national security supply
              chain.
