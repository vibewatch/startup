  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Taxonomy, and Adjacent Spend
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard competes at the intersection of three overlapping software categories: cyber risk
              ratings (also called security ratings or cyber risk scoring), third-party risk management (TPRM)
              platforms, and external attack surface management (EASM). The core differentiator of the ratings category
              is the "outside-in" continuous scoring methodology— observable internet signals aggregated into A–F letter
              grades without on-premises agents or vendor participation—which provides automated coverage of millions of
              organizations at once.


              The primary included spend is enterprise software subscription revenue for platforms that monitor external
              cyber posture and vendor/supply-chain risk: security ratings feeds, TPRM workflow software, questionnaire
              automation, continuous vendor monitoring, and AI-assisted remediation orchestration. Closely adjacent
              budgets include: governance, risk and compliance (GRC) software (which often houses TPRM workflows),
              external attack surface management tools (which compete and complement on the scanning side), cyber
              insurance underwriting technology (which uses security ratings to price policies), and board-level cyber
              risk reporting dashboards. Together these adjacent categories add approximately $23–35B in software spend
              that overlaps with SecurityScorecard's platform scope.


              Excluded from the core TAM are internal network security products (firewalls, endpoint detection, SIEM),
              identity and access management, and the broader $244B global information security market estimated by
              Gartner for 2026. Substitutes for security ratings include one-time penetration tests, ad hoc
              questionnaire-only programs (often Excel-based), managed security service providers handling vendor
              assessments, and internal security teams conducting point-in-time audits. The critical boundary
              distinction is that SecurityScorecard's outside-in continuous rating model replaces periodic,
              labor-intensive assessments—a distinct value proposition that separates the product from traditional GRC
              checkbox tools, though that boundary is blurring as larger GRC platforms add continuous monitoring
              features.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
