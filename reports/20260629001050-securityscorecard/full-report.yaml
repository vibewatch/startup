        title: Exhibits
        blocks:
          - type: callout
            title: Divergent Analyst Estimates Obscure True Market Size
            body: >-
              The TPRM market lacks a consensus definition, causing analyst estimates to diverge by 40%+ (from $8.09B to
              $11.11B for the same approximate year). Broader definitions that include GRC and managed services inflate
              addressable market figures significantly. SecurityScorecard and investors should anchor sizing to the
              software-only, enterprise-tier, continuous monitoring segment rather than top-level analyst totals.
            calloutType: risk
            claimRefs:
