      - number: '3.6'
        title: Win/Loss Dynamics by Buyer Segment and Geography
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard wins most reliably in large enterprise accounts where broad supply-chain vendor
              coverage, regulatory defensibility (SEC 10-K, NIS2, DORA disclosures), and insurance integration are the
              primary buying criteria. Enterprise CISOs managing thousands of vendors across global supply chains — who
              need a ratings provider whose scores are accepted by insurers and auditors — represent SecurityScorecard's
              clearest win profile. The Aon and Willis integrations create downstream channel pull: when an insurer
              quotes cyber coverage using SecurityScorecard data, the insured organization has a natural incentive to
              adopt the platform for proactive score improvement and remediation tracking.

              Losses concentrate in mid-market accounts and in deals where integrated workflow, ease of deployment, and
              total cost of ownership dominate over ratings breadth. UpGuard wins mid-market deals where buyers want a
              bundled questionnaire-plus-ratings experience at a more accessible price point. Panorays wins where
              AI-driven supply-chain mapping and multi-tier visibility are the primary differentiator. BitSight wins in
              financial services and insurance where its Moody's-backed statistical methodology is the recognized
              industry standard for insurance risk modeling. Geographic differentiation is difficult to verify from
              public sources; SecurityScorecard's multi-language platform (including 2026 Korean language support) and
              global ratings footprint signal active international expansion, but revenue concentration by region is not
              publicly disclosed. In procurement evaluations that include analyst scorecards, Forrester's Q2 2026
              designation of BitSight and Panorays as Leaders may shift enterprise shortlists, requiring
              SecurityScorecard to defend based on unique use-case strengths rather than analyst parity. The emergence
              of large-suites bundling is an additional structural risk: if an enterprise standardizes on OneTrust or
              ServiceNow, a ratings module in the contract displaces the need for a standalone SecurityScorecard
              subscription.
            claimRefs:
              - CP039
              - CP040
              - CP041
              - CP042
              - CP043
      - number: '3.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Forrester Wave Absence Is a Mid-Cycle Sales Liability
            body: >-
              SecurityScorecard was not designated a Leader in the Forrester Wave Q2 2026 for Cybersecurity Risk
              Ratings, while BitSight and Panorays were. In enterprise procurement cycles where analyst shortlists drive
              vendor selection, this absence will require sales teams to invest additional effort in justification.
              Combined with BitSight's 30% YoY insurance-segment growth in H1 2026, the competitive pressure in
              SecurityScorecard's most defensible verticals — financial services and insurance — is materially
              increasing.
            calloutType: risk
            claimRefs:
              - CP037
              - CP041
          - type: callout
            title: Insurance Ecosystem Lock-In Is a Durable Moat
            body: >-
              SecurityScorecard's embedded integrations with Aon and Willis create a demand-chain moat where insurers
              quote using SSC data, incentivizing insureds to adopt the platform proactively. This bidirectional
              embedding is difficult for pure-play competitors to replicate without equivalent insurer partnerships. No
              direct competitor currently matches both the Aon and Willis depth of integration simultaneously, creating
              a sticky distribution channel and a natural buyer acquisition funnel through insurance workflows.
            calloutType: strength
            claimRefs:
              - CP031
              - CP032
          - type: callout
            title: GRC Platform Bundling Is the Structural Long-Term Threat
            body: >-
              The most significant long-term competitive threat to SecurityScorecard may not come from BitSight or
              UpGuard, but from large GRC platform vendors (OneTrust, ServiceNow, Archer) that bundle ratings
              functionality through API integrations at scale. When a large enterprise standardizes on OneTrust or
              ServiceNow, a ratings module in the contract can displace the need for a standalone SecurityScorecard
              subscription. The inaugural Gartner TPRM MQ 2026 naming five GRC-category Leaders — none of which are
              traditional ratings vendors — is an early market signal of this consolidation trajectory.
            calloutType: insight
            claimRefs:
              - CP022
