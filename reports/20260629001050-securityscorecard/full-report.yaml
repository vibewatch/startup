  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard operates in a crowded and intensifying competitive field spanning three distinct
              segments: direct cyber risk ratings peers (BitSight, UpGuard, Mastercard RiskRecon, Black Kite, Panorays),
              adjacent GRC and workflow platforms (OneTrust Vendorpedia, ProcessUnity/CyberGRX, ServiceNow VRM, Archer),
              and macro substitutes including internal-build programs and status-quo annual-questionnaire processes. The
              2026 Forrester Wave for Cybersecurity Risk Ratings named BitSight and Panorays as Leaders, with
              SecurityScorecard absent from that designation — a competitive differentiation signal that enterprise
              buyers will notice. In parallel, Gartner published its inaugural Magic Quadrant for TPRM Tools for
              Assurance Leaders (2026), naming OneTrust, Diligent, Optro, Certa, and Aravo as Leaders in the adjacent
              GRC workflow category. These analyst placements reflect a bifurcation: ratings-centric buyers evaluating
              BitSight vs. SecurityScorecard, and workflow-centric buyers evaluating GRC suites that bundle ratings via
              API. With Moody's backing BitSight with a $250M strategic investment and UpGuard closing a $75M Series C
              in February 2026, capitalization has increased across all primary direct competitors, intensifying product
              investment and sales capacity. The convergence of AI-driven automation, regulatory pressure, and insurance
              integration is drawing every competitor in the field toward similar capability sets, compressing
              differentiation timelines.
