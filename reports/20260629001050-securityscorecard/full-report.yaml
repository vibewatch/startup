  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing History and Current Valuation Context
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard raised $180M in its Series E round in March 2021, achieving a post-money valuation of
              approximately $1B and elevating the company to unicorn status. Total equity raised across six rounds since
              2013 stands at approximately $293M, backed by Silver Lake, Sequoia Capital, GV (Google Ventures),
              Evolution Equity Partners, Riverwood Capital, NGP Capital, and Intel Capital. No new primary equity round
              has been publicly announced since March 2021, making the $1B figure five years stale as of this report
              date.

              Secondary market platforms provide the only observable current pricing signal. Premier Alternatives (June
              2026) places the market-implied valuation at $359.5M, with approximately 210M shares outstanding and a
              per-share price of approximately $1.66, representing a 13% 52-week decline. The Hiive platform also shows
              $1.66/share; Notice.co shows $2.20/share. These signals — taken together — imply a secondary market
              enterprise value of $360–$470M, a 53–64% discount to the $1B last-round price. Secondary market prices for
              private company shares typically carry a liquidity discount of 20–40% versus intrinsic value, and may
              reflect cap table complexity, preference overhang from multiple rounds of liquidation preferences, or
              concern about the timing and exit path. Nonetheless, the compressed secondary pricing is a materially
              adverse signal that cannot be dismissed.

              The company has not disclosed IPO plans, S-1 filing timelines, or strategic sale processes. The broader
              unicorn cohort faces a tighter-than-2021 exit window: the cybersecurity IPO market reopened only in
              September 2025 with Netskope's $7.3B debut at $707M ARR (10.3x), and while the Google/Wiz $32B acquisition
              at ~32–45x ARR provided a high-water mark for cloud-native security, that premium belongs to a
              differentiated, hyper-growth asset with $1B ARR, not a TPRM/ratings provider growing at 20% overall ARR
              CAGR.
