      - number: '7.5'
        title: Financial, Valuation, and Market Cycle Risks
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard's last confirmed primary fundraising was a $180M Series E in March 2021 at a $1B
              post-money valuation. No subsequent public financing round, announced IPO, or disclosed secondary
              transaction has followed in over five years. Secondary market data from Premier Alternatives (accessed
              June 2026) shows an implied valuation of approximately $359.5M—a ~64% discount from the 2021 primary-round
              price—suggesting material valuation compression in private markets consistent with the broader 2022-2026
              re-rating of late-stage SaaS unicorns. The company exceeded $150M ARR as stated in public communications
              (cited in the October 2025 Safe Security settlement press release), but gross margin, operating cash flow,
              burn rate, and ARR growth rate remain undisclosed, creating a material information gap for any investor
              assessing the path to profitability or the justification for a re-rate back toward the $1B unicorn level.


              Revenue concentration risk exists at the product and channel levels: the company's revenue is
              disproportionately tied to cyber insurance underwriting use cases (via Aon, Willis, and carrier
              partnerships announced through 2026) and enterprise TPRM mandates that track cyber regulatory expansion.
              Munich Re's 2026 Cyber Insurance report notes that more than two-thirds of large organisations experienced
              at least one third-party cybersecurity incident in the prior 12 months—a tailwind—but also that cyber
              insurance market cycles can shift rapidly, and that reinsurance capacity constraints or catastrophic
              systemic events (e.g., a large cloud-provider outage triggering mass claims) could contract underwriting
              appetite, directly reducing demand for SecurityScorecard's insurance-linked ratings use cases. A five-year
              funding gap increases the probability of a forced exit event (IPO, acquisition, or down-round) within the
              next 12-24 months, and the secondary-market price already implies this scenario is priced in by some
              holders.
