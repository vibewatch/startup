              - CM009
              - CM010
              - CM011
          - type: callout
            title: Triple Regulatory Tailwind — NIS2, DORA, SEC — Creates Sustained Demand
            body: >-
              Three independently powerful regulatory mandates (EU NIS2, EU DORA, US SEC Disclosure Rule) simultaneously
              drive demand for continuous vendor risk monitoring. SecurityScorecard benefits from all three: NIS2 covers
              European supply chain security obligations, DORA mandates financial-sector ICT vendor monitoring, and the
              SEC rule drives US board-level demand for auditable TPRM programs. This regulatory convergence is the
              strongest single demand accelerator in the market.
            calloutType: strength
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
          - type: callout
            title: Platform Consolidation and Mindshare Erosion Are Structural Threats
            body: >-
              Both SecurityScorecard and BitSight saw IVRM mindshare decline sharply (SSC from 11.1% to 5.7%; BitSight
              from 10.8% to 5.8%) on PeerSpot, indicating category fragmentation. Larger platform vendors—Palo Alto,
              Microsoft, CrowdStrike—are adding risk management features, potentially displacing standalone vendors
              through enterprise bundling. This constraint is medium-term in nature but is already visible in buyer
              evaluation patterns.
