  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and ARR Trajectory
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard's disclosed revenue history is sparse but directionally positive. Third-party SaaS
              databases estimate ARR grew from approximately $71M in 2021 to $88.5M in 2022 (roughly 25% YoY), $106M in
              2023 (~20% YoY), and $144.3M in early 2024 (~36% YoY)—representing an implied four-year CAGR of
              approximately 27%. The only company-disclosed figure is the $150M+ ARR milestone announced in October 2025
              as part of a joint press release with Safe Security resolving a trade secret lawsuit. No standalone
              investor release, earnings call, or audited filing has confirmed this figure, limiting its auditability.
              No subsequent public ARR update has been issued as of June 2026, creating a growing freshness gap.

              The company's recurring revenue model is anchored in annual SaaS subscriptions for security ratings,
              third-party risk monitoring, and supply chain detection capabilities. These subscriptions generate
              predictable ARR with renewal dynamics typical of enterprise security software—though exact NRR and gross
              churn are not publicly available. Revenue recognition follows standard SaaS contract recognition; no
              deferred revenue complications or consumption-based anomalies have been disclosed. Given 3,300+ enterprise
              customers and $150M+ ARR, the implied average contract value is approximately $45,000 per customer per
              year—consistent with enterprise TPRM pricing benchmarks.
