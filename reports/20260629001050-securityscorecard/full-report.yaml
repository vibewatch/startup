      - number: '4.4'
        title: Cost Structure and Capital Efficiency
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard does not disclose gross margin, COGS, operating expenses, or EBITDA. Third-party
              headcount aggregators place the company in the 501–1,000 employee range, with LeadIQ reporting "501–1,000
              employees" and the Forbes Council profile citing "over 600 employees." At $150M+ ARR and approximately
              580–620 employees, the implied ARR per FTE is roughly $250,000–$260,000—consistent with efficient SaaS
              operators in the security space.

              The October 2025 press release disclosed two key financial efficiency signals: positive free cash flow for
              the quarter and a 40% improvement in ARR per full-time employee year-over-year. These signals, if
              accurate, imply that revenue is outpacing headcount growth and that the company is approaching or has
              crossed a cash-neutral operating model. The company also added three senior executives (CFO Chris Fritz,
              CRO Peter Jantzen, CMO Claire Trimble) in 2025, indicating continued investment in commercial leadership
              even during an efficiency drive.

              Gross margin for the core SaaS ratings platform is not disclosed. Industry benchmarks for comparable SaaS
              cybersecurity rating companies suggest gross margins in the 75–85% range due to the scalable, cloud-based
              delivery model with limited per-customer incremental cost. However, MAX managed services likely carries
              lower gross margins because it involves human-delivered remediation, partner cost-of-service components,
              and managed response workflows. As MAX grows faster than core subscriptions, the blended gross margin
              trajectory may face mild compression—a risk that cannot be quantified with available public data.
