      - number: '4.2'
        title: Product Revenue Mix and Emerging Growth Streams
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard's revenue mix spans four observable streams: (1) core SaaS subscription revenues from
              security ratings and TPRM platform access, which represent the majority of ARR; (2) MAX managed services,
              a high-velocity growth layer delivered through certified service partners; (3) TITAN AI questionnaire
              automation revenues, accelerated by the September 2025 HyperComply acquisition; and (4) insurance
              underwriting and data licensing revenues through partnerships with WTW and expanding broker relationships.

              MAX managed services is the standout growth signal. The product grew 370% YoY as of mid-2025 and
              contributed to triple-digit growth in the most recent quarter. Channel ARR—revenue flowing through the
              partner ecosystem—grew 160% YoY in 2025, and partner-led pipeline increased 126% YoY. With 600+ partners
              and 35 new partners added in 2025, the channel is becoming a structurally important distribution
              mechanism. The HyperComply acquisition adds questionnaire automation as a product capability; whether it
              is priced as a standalone add-on or bundled into enterprise tiers is not publicly disclosed. The insurance
              underwriting use case, referenced repeatedly in press materials and supported by WTW and other broker
              relationships, represents an emerging data-monetization channel whose contribution to total ARR is not
              quantified. International revenue is growing—Q4 2020 saw 61% YoY international recurring revenue growth
              and 89% international customer count growth—but no recent geographic revenue breakdown has been published.
