      - number: '3.2'
        title: Direct Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              BitSight is SecurityScorecard's primary direct competitor. Backed by a $250 million Moody's strategic
              investment, BitSight surpassed $200 million in ARR by 2025 and rates signals on over 350 million
              organizations globally through its Moody's integration. Its insurance segment grew 30% year-over-year in
              H1 2026, cementing its position as the preferred ratings provider among insurers and financial-services
              firms. The Forrester Wave Q2 2026 awarded BitSight the highest scores in 11 criteria categories — the most
              of any evaluated vendor. On Gartner Peer Insights, BitSight scores 4.6/5 (264 reviews) versus
              SecurityScorecard's 4.4/5 (278 reviews), a narrow but directionally meaningful gap in enterprise
              evaluation cycles. BitSight's Moody's partnership also provides access to credit-risk data integration,
              giving it a unique cross-asset risk view that SecurityScorecard does not currently replicate.

              UpGuard raised $75 million in a Series C round in February 2026 (led by Springcoast Partners, total raised
              over $120 million), and has held the No. 1 TPRM spot on G2 for 15 consecutive quarters. The platform
              processes over 100 billion risk signals daily, serves 50,000 plus organizations in more than 90 countries,
              and targets mid-market and enterprise buyers with a unified Cyber Risk Posture Management approach
              combining vendor risk, breach monitoring, and compliance under one AI-driven system. UpGuard is the
              leading challenger for mid-market displacement of SecurityScorecard, competing primarily on ease-of-use
              and total cost of ownership rather than ratings breadth.

              Mastercard RiskRecon claims a 99.1% asset validation rate and differentiates through Mastercard global
              threat intelligence integration, AI-assisted deep asset discovery, and a 2026 partnership ecosystem
              including Cloudflare and Recorded Future for enhanced attack surface monitoring. It is strongest in
              regulated financial-services verticals, where Mastercard brand trust accelerates procurement approval.

              Black Kite raised $22 million in a 2021 Series B and serves approximately 3,000 enterprise customers
              globally. Its Ransomware Susceptibility Index (RSI) and Open FAIR financial quantification differentiate
              it for buyers seeking business-contextualized risk metrics, particularly risk quantification in dollar
              terms. Mid-market pricing starts around $29,000 annually, making it more accessible than SecurityScorecard
              for price-sensitive buyers.

              Panorays, a Forrester Wave Q2 2026 Leader, serves over 1,000 customers globally and differentiates on
              AI-driven agentic workflows, real-time multi-tier supply chain mapping, and integrated questionnaire-plus-
              ratings in a single user experience. Its 2026 CISO survey of 200 US-based security leaders found that 85%
              lack full third-party threat visibility and only 41% monitor beyond Tier-1 suppliers, a market pain point
              Panorays specifically targets with nth-tier mapping capability.
