      - number: '1.3'
        title: Funding History and Capitalization
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard's disclosed capital history spans seven rounds from seed to Series E. The earliest
              documented funding was a seed round of approximately $2.2M in 2014, followed by a $13.7M Series A in
              February 2015. The company then raised a Series B (approximately $20M, June 2016) and Series C
              (approximately $27.5M, October 2017), building out its ratings platform and initial go-to-market. A Series
              D of approximately $50M in June 2019 funded international expansion and product adjacencies. The
              definitive financing event was the March 18, 2021 Series E: a $180M preferred stock round that brought
              total disclosed funding to over $290M and established a $1B post-money valuation, making SecurityScorecard
              a unicorn. J.P. Morgan Securities LLC served as sole placement agent for the Series E. No additional
              public funding rounds, IPO plans, secondary transactions, or debt facilities have been disclosed since.


              New Series E investors included Silver Lake Waterman, T. Rowe Price Associates, Kayne Anderson Rudnick,
              and Fitch Ventures (a Fitch Group subsidiary signaling strategic interest from a competing ratings
              business). Existing investors also participated: Evolution Equity Partners, Accomplice, Riverwood Capital,
              Intel Capital, NGP Capital, AXA Venture Partners, GV (Google Ventures), and Boldstart Ventures. PitchBook
              and Tracxn report cumulative raised of approximately $293M as of 2026. The investor base is notable for
              including both financial sponsors (Silver Lake, Sequoia, Riverwood) and strategics (GV/Google, Intel
              Capital, Fitch Ventures, AXA Venture Partners), implying diverse exit expectations. Exact cap table
              ownership percentages and liquidation preferences are not publicly disclosed.
