      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The primary economic buyer for SecurityScorecard is the Chief Information Security Officer (CISO), who
              owns the security strategy, vendor risk program, and board-level cyber risk reporting. A 2026 Panorays
              survey of 200 CISOs found that 85% lack full supply chain visibility and 62% report increased regulatory
              pressure over the prior 12 months, validating the problem urgency. However, only 22% of CISOs feel "fully
              prepared" to meet evolving regulatory requirements, creating a large addressable buyer segment that is
              motivated but underserved by current tools.


              The user persona is typically the Third-Party Risk Manager or vendor risk analyst within the CISO's
              organization, who uses the platform daily for vendor onboarding, continuous monitoring, and remediation
              tracking. Payers vary significantly: in regulated industries (BFSI, healthcare), TPRM budgets are often
              carved from a dedicated GRC or compliance budget; in technology companies, spend flows from a security
              engineering budget; in mid-market firms, the CISO's discretionary budget covers all.


              Secondary buyers include procurement/vendor management teams (who control vendor contract terms and may
              embed security scoring requirements into RFPs), cyber insurance underwriters (who use SecurityScorecard
              ratings as underwriting inputs to price policies and set terms—a B2B2B demand chain), and boards/audit
              committees (who consume risk dashboards and increasingly require third-party risk metrics as part of SEC
              and NIS2 governance disclosures). Enterprise large ($1B+ revenue) companies with 500+ vendor relationships
              represent the primary segment; Panorays data shows only 41% of organizations even monitor fourth-party
              vendors, indicating significant adoption gap among the mid-market.
