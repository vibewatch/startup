  - id: FV001
    title: Recommendation Logic Flow
    type: flow
    layout: wide
    summary: |
      Chain from market scale, operating proof, competitive risks, and valuation signals to the TRACK recommendation.
    data:
      nodes:
        - id: market
          label: 'Large & Regulated Market: TPRM $11B TAM, 15-18% CAGR, NIS2/DORA/SEC mandates'
        - id: scale
          label: 'Operating Scale: $150M+ ARR, 3,300 customers, 70% Fortune 100, 12M+ rated orgs'
        - id: moat
          label: 'Differentiation: Insurance network (Aon, Willis), TITAN AI, HyperComply, 12M data graph'
        - id: risks
          label: 'Risks: Opaque NRR/margin, BitSight Forrester lead, crowded field, outside-in criticism'
        - id: valuation
          label: 'Valuation: $1B (2021, 5yr stale) vs $360M secondary mkt; 6.7x stated ARR, 2.4x secondary ARR'
        - id: exit
          label: 'Exit Clarity: No IPO announced; M&A possible but no confirmed acquirer; 2026 exit window uncertain'
        - id: rec
          label: 'TRACK: Real market position, real tailwinds; valuation uncertainty and opacity prevent BUY'
      edges:
        - from: market
          to: rec
        - from: scale
          to: rec
        - from: moat
          to: rec
        - from: risks
          to: valuation
        - from: valuation
          to: rec
        - from: exit
          to: rec
    claimRefs:
      - CV031
      - CV035
      - CV036
  - id: FV002
    title: Valuation Sensitivity to ARR Multiple
    type: bar
    layout: wide
    summary: >
      Implied enterprise value at $150M ARR across multiples ranging from secondary-market-implied (2.4x) to
      strategic-acquirer-premium (23x). Comps anchored at key reference points.
    data:
      items:
        - label: 2.4x (Secondary mkt implied)
          value: 360
        - label: 3x (Bear floor)
          value: 450
        - label: 5x (Bear base)
          value: 750
        - label: 6.7x (2021 round implied)
          value: 1000
        - label: 8x (Base case)
          value: 1200
        - label: 11x (Securiti AI comp)
          value: 1650
        - label: 12x (BitSight round comp)
          value: 1800
        - label: 23x (Armis/ServiceNow comp)
          value: 3450
    approximationNotes: >
      Bars represent implied EV in USD millions at exactly $150M ARR. Actual ARR is $150M+ (undisclosed precision).
      Strategic comps (11x, 12x, 23x) include control and synergy premiums; financial-investor applicable multiples are
      3–10x. The 23x Armis comp is shown for context only; SecurityScorecard's category and growth profile do not
      support this level.
    claimRefs:
      - CV016
      - CV018
      - CV019
      - CV021
      - CV026
      - CV027
      - CV028
  - id: FV003
    title: Valuation and Return Range by Scenario
    type: range
    layout: standard
    summary: >
      Low-to-high enterprise value range for each of three scenarios at $150–175M ARR, derived from private market
      benchmarks and comparable transactions.
    data:
      items:
        - label: Bear Case (3–5x ARR)
          low: 450
          high: 750
        - label: Base Case (6–8x ARR)
          low: 900
          high: 1200
        - label: Bull Case (10–15x ARR)
          low: 1500
          high: 2250
    approximationNotes: >
      Ranges in USD millions. Bear assumes $150M ARR × 3–5x; base assumes $150–165M ARR × 6–8x; bull assumes $165–175M
      ARR × 10–15x. Strategic-premium tail (23x) excluded as non-representative of financial-investor entry multiples.
      $1B 2021 stated valuation falls at the top of base case.
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: standard
    summary: >
      IC-ready scoring across seven dimensions (0–10) reflecting evidence quality and investment attractiveness. Scores
      reflect the current state of public evidence only.
    data:
      items:
        - label: Market Opportunity
          value: 8
        - label: Product Differentiation
          value: 7
        - label: Revenue Scale & Growth
          value: 6
        - label: Competitive Moat
          value: 6
        - label: Financial Transparency
          value: 2
        - label: Valuation Attractiveness
          value: 4
        - label: Exit Readiness
          value: 4
    approximationNotes: >
      Scores (0–10) are qualitative assessments by the analyst team based on evidence quality and sector benchmarks.
      Financial Transparency scored 2/10 due to absence of any gross margin, NRR, or burn-rate disclosure at $150M+ ARR.
      Valuation Attractiveness scored 4/10 because the $1B round price is in the defensible base-case range but
      secondary markets suggest significant compression.
    claimRefs:
      - CV031
      - CV033
      - CV034
      - CV035
