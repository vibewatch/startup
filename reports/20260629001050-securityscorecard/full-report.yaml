  - id: TE003
    title: Technology and Operating Architecture — Key Components, Roles, and Risks
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Risk
    rows:
      - - IPv4 Internet Scanner
        - Scans 3.9B routable IPs every 10 days across 1,400+ ports; cloud assets scanned multi-daily
        - Proprietary in-house scanning infrastructure
        - Scanner blocking by large cloud providers could create blind spots
      - - DNS Sinkhole & Honeypot Network
        - Detects 2B+ malware DNS requests daily; enriches IP reputation and hacker chatter signals
        - Three-continent sensor network
        - Sinkhole coverage is geographically constrained; active adversaries may evade
      - - Attribution Engine
        - Maps signals to organizations via DNS lookups, BGP routing, digital footprint claims
        - Reliable public DNS/BGP data; user asset claiming
        - Attribution errors persist; misattribution lowers legitimate organizations' scores
      - - Scoring 3.0 Engine
        - Computes z-scores per issue type; applies size normalization, calibration, and breach penalties
        - 15,000+ historical breach dataset for correlation validation
        - Proprietary algorithm; no published independent audit of scoring logic
      - - AI / ML Layer
        - TITAN AI engine orchestrates risk signal fusion, questionnaire automation (RespondAI), predictive analytics
        - HyperComply RespondAI; proprietary LLM/ML models
        - AI claims (99.9% attribution accuracy) not independently verified
      - - API & Delivery Layer
        - REST API at securityscorecard.readme.io; 100+ marketplace integrations; GitHub SDKs
        - Partner integrations (CrowdStrike, ServiceNow, OneTrust, Archer)
        - API lacks published uptime SLA; no open SDK under active OSS maintenance
    notes: >-
      Architecture detail derived from official help center documentation, SecurityScorecard's developer hub, and
      Forrester Wave 2024 coverage. Internal architecture specifics (cloud infrastructure provider, data center
