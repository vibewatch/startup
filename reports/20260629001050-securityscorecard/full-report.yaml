      - number: '7.2'
        title: Competitive Displacement and Platform Bundling Risks
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard competes in an increasingly crowded third-party risk management (TPRM) market where
              platform bundlers—ServiceNow, OneTrust, and Microsoft—are embedding native risk-rating and vendor risk
              workflow capabilities into existing GRC stacks already deployed at large enterprise accounts. For buyers
              who have standardised on these platforms, the incremental value of a standalone point solution is harder
              to justify, particularly at SecurityScorecard's reported pricing (starting ~$15,000–$16,500/year for basic
              tiers; enterprise portfolios exceeding $100,000/year). A meaningful erosion risk comes from Moody's
              Corporation, which was a Series C investor in SecurityScorecard in 2017 but subsequently acquired
              BitSight—creating a structural conflict: a former strategic backer now funds and integrates a direct
              competitor into credit analytics, insurance underwriting, and regulatory workflows where Moody's brand
              carries embedded credibility.


              PeerSpot's June 2026 IT Vendor Risk Management comparison shows SecurityScorecard's mindshare fell to 5.7%
              (from 11.1% in the prior year), while BitSight's mindshare simultaneously declined to 5.8% (from 10.8%),
              suggesting both legacy leaders are losing share to emerging entrants and bundled platforms. UpGuard
              positions its faster 24-hour scan cycle and all-in-one TPRM bundle as a direct substitute, rated No. 1 by
              G2 in user sentiment. Forrester's recognition of BitSight as a Wave Leader in 2026—while SecurityScorecard
              was not identified as a Forrester Leader—creates a perception gap that enterprise procurement teams use in
              competitive evaluations. ServiceNow and OneTrust increasingly serve as the orchestration layer for vendor
              risk data, choosing which ratings engines to embed as plugins rather than treating them as strategic
              partners, which compresses SecurityScorecard's pricing power and switching-cost moat over time.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR038
