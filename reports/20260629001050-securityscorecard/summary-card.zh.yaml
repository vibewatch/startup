summary:
  headline: |
    SecurityScorecard 定义了网络风险评级品类，已有真实企业级规模和强战略位置；但 $1B 估值已停留五年，二级市场压缩到 $360–$470M，NRR 和毛利率仍未披露，因此在经济性验证前只能给出观察建议。
