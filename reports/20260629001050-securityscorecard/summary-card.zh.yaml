  topStrengths:
    - SecurityScorecard 开创了安全评级品类，如今运营更宽的 SCDR 平台，覆盖评级、TPRM、攻击面管理、AI 驱动问卷自动化和托管服务，在 3,300+ 企业客户中拥有真实产品宽度和交叉销售空间。
    - >-
      商业规模有分量，方向也正面：ARR 至少 $150M+、自由现金流为正、ARR / FTE 同比改善 40%、MAX 三位数增长、渠道 ARR 增长 160%、Fortune 100 渗透率 70%、收入连续 10+
      个季度增长。
    - NIS2、DORA、SEC 网络披露规则带来结构性监管顺风，把 TPRM 从可选工具推成合规要求，扩大可触达市场，也提高合规导向买家的切换成本。
    - FedRAMP Ready 和 StateRAMP 资质打开美国联邦与州政府采购市场；CISA 将其列为免费网络工具，又为企业转化增加了独特的非商业分发通道。
  topRisks:
    - 2021 年 3 月 Series E 的 $1B 估值已经过时五年；二级市场平台暗示企业价值仅 $360–$470M（折价 53–64%），没有新融资事件或财务披露就无法解释这道差距。
    - 毛利率、NRR、烧钱速度和过去 ARR 增速未公开披露，难以有信心承保；若没有高于 100% 的 NRR，扩张经济性无法验证。
    - Moody's 背书的 BitSight 在 Forrester Wave Q2 2026 中拿到最高战略评分，并在银行和保险中被定位为贴近信用评级的标准，对 SecurityScorecard 核心垂直行业构成持久竞争威胁。
    - 由外而内的评级方法天然容易出现误报、资产归属错误和供应商争议；竞争对手会在销售周期里利用这道天花板，监管也可能用强制准确性要求进一步收紧。
    - 关键人风险明显集中在 CEO Dr. Yampolskiy 身上：他是公司最主要的公众面孔、核心专利组合共同发明人，也是最显眼的商业资产。
  unresolvedGaps:
    - 按队列和层级拆分的 NRR —— 评估增长质量和承保扩张价值时最关键的缺失指标。
    - 按产品线拆分的毛利率（核心 SaaS、MAX 托管服务、TITAN AI），用于判断增长更快的托管服务层规模化后的利润率轨迹。
    - 截至 2026 年 6 月的当前 ARR —— $150M+ 数字已过时 8+ 个月，且披露场景是诉讼和解，而非独立财务发布。
    - 完全稀释股权结构、清算优先权、保护性条款，以及影响潜在投资人回报测算的任何二级市场交易细节。
    - 经审计财务报表、现金余额、债务计划和烧钱速度，用于验证自由现金流为正的说法，并评估当前增长率下的现金跑道。
    - 按职能拆分的准确员工数、销售生产率指标，以及每一美元销售和营销投入带来的新增 ARR，用于评估渠道组合变化后的销售效率。
