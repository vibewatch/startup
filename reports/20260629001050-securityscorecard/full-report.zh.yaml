      - number: '2.2'
        title: 市场规模——多重视角与矛盾估算
        blocks:
          - type: paragraph
            body: >-
              分析机构对 2026 年全球 TPRM 软件市场的估算差异很大，取决于定义范围：Grand View Research 认为 2023 年基数为 $7.42B，到 2030 年以 15.7% CAGR 增至
              $20.59B；SkyQuest 估算 2025 年为 $11.11B，到 2033 年以 16.4% 增至 $37.44B；Business Research Insights 将 2026 年市场规模定为
              $10.36B，到 2035 年以 18.2% 增至 $45.98B。这个区间——2026 年点估约 $8–11B——反映出「TPRM」定义不同（纯软件 vs. 纳入托管服务）、地理范围不同，以及对
              GRC、EASM 等相邻品类处理方式不同。


              与 SecurityScorecard 评级引擎重叠的外部攻击面管理子板块，预计到 2026 年达到 $930.7M，CAGR 为 17.5%；更宽的攻击面管理市场（包括内部 ASM）估算将从 2024 年
              $1.43B 增至 2032 年 $9.19B，CAGR 为 30.4%。GRC 软件为许多大型企业承载 TPRM 工作流，另有估算认为其 2026 年规模为 $23.32B，到 2031 年以 10.84%
              CAGR 增至 $39.01B。网络保险保费在 2025–2026 年约达 $15.3–19.6B，代表相邻需求池：保险公司越来越多要求把安全评级作为承保输入，为评级供应商创造派生需求信号。


              自下而上构建 SecurityScorecard 的 SAM，需要剥离出 TPRM 的软件部分（按 Grand View Research 约占市场 59%）、北美和欧洲份额（合计约 70%），并排除 SME
              自助服务之外的企业级部分。把这些过滤条件套到 $10–11B TPRM 总市场上，可服务可寻址市场约为 $4–7B。SecurityScorecard 报告的 $150M+ ARR 暗示其在该 SAM 中渗透率约
              2–4%，符合早中期成长阶段。按质量政策要求，表 TM002 保留了相互矛盾的规模估算。
