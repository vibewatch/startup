  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与当前估值背景
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard 于 2021 年 3 月完成 $180M Series E 融资，投后估值约 $1B，并由此进入独角兽行列。自 2013 年以来，公司六轮股权融资合计约
              $293M，背后投资方包括 Silver Lake、Sequoia Capital、GV（Google Ventures）、Evolution Equity Partners、Riverwood
              Capital、NGP Capital 和 Intel Capital。2021 年 3 月后，公司没有公开宣布新的一级股权融资；截至本报告日期，$1B 估值已经滞后五年。

              二级市场平台提供了唯一可观察的当前定价信号。Premier Alternatives（2026 年 6 月）给出的市场隐含估值为 $359.5M，约 210M 股流通，每股价格约 $1.66，52 周跌幅为
              13%。Hiive 平台同样显示 $1.66/股；Notice.co 显示 $2.20/股。这些信号合在一起，意味着二级市场企业价值为 $360–$470M，较上一轮 $1B 价格折价
              53–64%。私营公司股票的二级市场价格通常较内在价值存在 20–40%
              流动性折价，也可能反映股权结构复杂、多轮清算优先权造成的优先权悬压，或市场对退出时间和路径的担忧。即便如此，被压缩的二级定价仍是一个不能忽视的重大负面信号。

              公司没有披露 IPO 计划、S-1 申报时间表或战略出售流程。更广泛的独角兽群体面对比 2021 年更紧的退出窗口：网络安全 IPO 市场直到 2025 年 9 月才随 Netskope 以 $707M
              ARR（10.3x）和 $7.3B 首秀重新打开；Google/Wiz 以 $32B、约 32–45x ARR 的收购为云原生安全给出了高水位，但这一溢价属于 ARR $1B 的差异化高速增长资产，不属于整体
              ARR CAGR 20% 的 TPRM/评级提供商。
