      - number: '4.5'
        title: 资本充足性与融资姿态
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard 从 2013 年到 2021 年 3 月 Series E 共完成七轮股权融资，累计约 $293M；Series E 投后估值为 $1B。自 2021 年 3
              月以来，公司未公开宣布新的股权融资——也就是说，公司已依靠 Series E 资本栈运营超过五年。因此，$1B 估值已经滞后五年以上，且反映的是与当下条件明显不同的 Series E
              市场环境。公司没有公开确认债务融资、授信额度或二级流动性事件。

              2025 年 10 月的自由现金流为正信号显示，SecurityScorecard
              可能没有以显著速度烧钱；在五年没有新融资的背景下，这一点很重要。它意味着：（a）公司已达到或接近现金口径经营盈亏平衡；（b）Series E
              留存现金仍足以支持运营；或（c）两者兼有。没有资产负债表披露，任何假设都无法确认。ARR/FTE 效率改善 40% 强化了资本效率叙事，但绝对现金头寸仍未知。高管案例研究提到 IPO 准备度，但截至 2026 年
              6 月，公司没有披露 S-1 文件、投行聘任公告或明确 IPO 时间表。

              按超过 $150M ARR 运行率和 2026 年私营 SaaS 网络安全公司常见的 7–10x ARR 倍数计算，企业价值约为 $1.05–$1.5B，大致包住 2021 年估值。这说明相对于当前
              ARR，滞后估值既不显著便宜也不显著昂贵——但没有当前融资事件，无法验证。
