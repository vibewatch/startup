      - number: '8.7'
        title: 图表
        blocks:
          - type: callout
            title: 二级市场定价是负面估值信号
            body: >
              二级市场平台（Premier Alternatives：隐含 EV $359.5M；Hiive：$1.66/股）给 SecurityScorecard 股权的定价，较 2021 年 3 月 $1B 轮价格折价
              53–64%，且 52 周趋势为负（−13%）。虽然二级市场价格反映流动性折价、股权结构复杂和成交量有限，但如此幅度的持续折价是警示信号。在将基准情景假设放到接近 $1B 之前，投资者应把 $360–$470M
              的二级隐含 EV 视为需要通过披露 NRR 和毛利率数据主动反驳的熊市锚。
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV035
          - type: callout
            title: Securiti AI 可比交易是最直接的锚定参照
            body: >
              Veeam 在 2025 年 Q4 以 $1.725B 收购 Securiti AI，后者 ARR 约 $150M、估值约 11x ARR；这是 SecurityScorecard 最可比的交易：ARR
              规模相同，都集成 AI，都是面向企业的私营网络安全 SaaS。若出现战略买家，该可比交易把 SecurityScorecard 的战略收购中点放在约 $1.6–1.8B，舒适高于 $1B
              轮价格；但这假设买家愿意为 TPRM 加保险资产支付战略溢价，而这一点尚未发生，不能在没有证据时直接假设。
            calloutType: insight
            claimRefs:
              - CV018
              - CV019
          - type: callout
            title: NRR 和毛利披露前维持 TRACK
            body: >
              TRACK 建议反映的是：公司已展现市场领导力并受益于结构性顺风，但在缺少核心财务披露时，无法按某一具体估值承销。升级到 BUY 需要：(1) NRR 确认为 110%+ 或更高；(2) 毛利率确认为
              70%+，且符合纯 SaaS；(3) 出现 IPO 申报，或在基准情景及以上估值启动可信 M&A 流程。任一催化出现，都足以支持在 90 天内重新评估。
            calloutType: recommendation
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV043
