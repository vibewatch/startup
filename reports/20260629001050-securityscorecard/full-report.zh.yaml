        - 交付风险：公司称可减少 90-95% 手工 TPRM 工作量，但尚未验证；若 TITAN AI 交付不足，管道可能停滞
        - 中
        - 高
        - RSA 2026 分阶段推出；预计与锚定客户开展试点项目
        - 索取 TITAN AI 试点案例研究、客户验收测试结果和生产环境客户参考名单
      - - LIFARS DFIR 领导层（Ondrej Krehel）
        - DFIR 业务整合取决于留住被收购领导层；若其离任，专业服务差异化会被掏空
        - 中
        - 中
        - Krehel 被明确留任，收购后继续领导 DFIR 业务（2022）
        - 确认 Krehel 当前雇佣状态，以及 DFIR 业务是否达到收入目标
    notes: 可能性截至 2026 年 6 月按公开信号评估；没有内幕信息。严重性评级反映离任或交付不足带来的业务影响。缓释成熟度仅反映公开可观察的治理和留任信号。
    claimRefs:
