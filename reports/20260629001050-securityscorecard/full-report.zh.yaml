      - number: '3.2'
        title: 直接竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              BitSight 是 SecurityScorecard 最主要的直接竞争对手。依托 Moody's $250 million 战略投资，BitSight 到 2025 年 ARR 已超过 $200
              million，并通过 Moody's 集成在全球评级超过 350 million 个组织的信号。其保险板块在 2026 年 H1 同比增长
              30%，巩固了其在保险公司和金融服务机构中作为首选评级提供商的地位。Forrester Wave Q2 2026 给 BitSight 在 11 个标准类别中最高分，是所有被评供应商中最多的。在 Gartner
              Peer Insights 上，BitSight 得分 4.6/5（264 条评价），SecurityScorecard 为 4.4/5（278
              条评价），差距不大但在企业评估周期中具有方向性意义。BitSight 与 Moody's 的合作也让其获得信用风险数据集成，形成 SecurityScorecard 当前无法复制的跨资产风险视图。

              UpGuard 于 2026 年 2 月完成 $75 million Series C（Springcoast Partners 领投，累计融资超过 $120 million），并连续 15 个季度在 G2
              上占据 No. 1 TPRM 位置。平台每天处理超过 100 billion 个风险信号，服务 90 多个国家的 50,000+ 个组织，面向中端市场和企业买方，提供统一的 Cyber Risk Posture
              Management 方法，在一个 AI 驱动系统下结合供应商风险、泄露监测和合规。UpGuard 是在中端市场替代 SecurityScorecard
              的领先挑战者，主要靠易用性和总拥有成本竞争，而不是评级覆盖宽度。

              Mastercard RiskRecon 声称资产验证率为 99.1%，并通过 Mastercard 全球威胁情报集成、AI 辅助深度资产发现，以及 2026 年包含 Cloudflare 和 Recorded
              Future 的合作伙伴生态来增强攻击面监测。其在受监管金融服务垂直最强，Mastercard 品牌信任能加速采购批准。

              Black Kite 在 2021 年 Series B 融资 $22 million，全球服务约 3,000 个企业客户。其 Ransomware Susceptibility Index（RSI）和 Open
              FAIR 财务量化能力，让其在寻求业务语境化风险指标的买方中形成差异化，尤其适合以美元计量的风险量化。中端市场价格约从每年 $29,000 起，对价格敏感买方而言比 SecurityScorecard 更易进入。

              Panorays 是 Forrester Wave Q2 2026 Leader，全球服务超过 1,000 个客户，差异化在于 AI 驱动的 agentic
              工作流、实时多层供应链映射，以及单一用户体验中的问卷加评级集成。其 2026 年对 200 名美国安全领导者的 CISO 调查发现，85% 缺乏完整第三方威胁可见性，只有 41% 会监测 Tier-1
              供应商之外的层级；Panorays 正是用 nth-tier 映射能力瞄准这一市场痛点。
