      - number: '6.3'
        title: 具名客户证据与生产部署质量
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 公开可见的具名客户库，覆盖五类不同客户原型的生产级部署：国际公共部门机构、全球消费品牌、欧洲私募股权、媒体代理商和网络保险集成商。United Nations
              International Computing Centre（UNICC）提供最高质量证据：一份四页案例研究，具名高级管理员 Alejandro Bustos，记录覆盖 80 多个 UN agencies
              的部署、一个通过自动告警解决的具体 DNS 事件用例，以及网络安全运营节省 70-75% 时间的数字。The Hershey Company 案例研究中，Phil Addison（Manager of
              Third-Party Cyber Risk Management）确认对完整第三方版图实现 100% 网络可见性——包括未通过问卷评估的供应商——并接入事件响应、漏洞管理和 M&A
              尽调工作流。两个案例都验证的是生产状态，而非试点部署。


              Verdane 这家欧洲成长股权机构展示了私募股权用例：SecurityScorecard 在不部署外部顾问的情况下，为 100 多家公司提供组合范围网络尽调，使精简的内部网络安全能力得以落地。Horizon
              Media 获得 “A” 安全评级，并在面向客户的销售沟通中把 SecurityScorecard 用作外部信任信号——这是一个有记录的用例，平台在其中成为被评级组织的获客工具。Aon
              集成则是保险行业层面的机构级证据：Aon 把 SecurityScorecard 的外部视角能力嵌入 CyQu 承保平台，使 SecurityScorecard 数据成为 Aon 客户在 120
              多个国家网络保险流程中的标准输入。


              这些案例的参考质量很强：全部具名，多数包含具体运营指标，且全部确认生产部署。不过，客户库覆盖的垂直相对狭窄——UN 体系以外的医疗、零售和政府机构在公开案例研究中代表性不足，给这些细分留下证据缺口。
