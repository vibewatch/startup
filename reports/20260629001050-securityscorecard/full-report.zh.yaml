      - number: '7.3'
        title: 产品执行风险与 TITAN AI 验证缺口
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 在 RSA Conference 2026（2026 年 3 月 23 日）发布 TITAN AI，提出了激进的性能主张：风险归因准确率 99.9%、反驳率接近零、手工
              TPRM 工作量最多降低 95%、供应商互动提升 9 倍、供应链泄露最多减少
              75%。这些都是公司发布的营销主张，没有公开独立审计、同行评审方法论或长期结果研究。第三方验证缺位很关键，因为这些主张构成定价溢价和管线加速的主要依据；如果企业买家将其纳入正式评估，SecurityScorecard
              可能无法在竞争性比测中证明这些数字，从而暴露商业和声誉风险。


              TITAN AI 分为三层：TITAN Watch（持续可视性）、TITAN Assess（AI 驱动的问卷自动化）、TITAN Secure（威胁情报驱动的修复）。每一层都对应一种能力，而 Safe
              Security 的自主 TPRM 平台、UpGuard 的原生评估工作流等竞争对手也声称能提供类似能力。与 Safe Security 达成和解后的合作（2025 年 10
              月宣布）降低了短期诉讼成本，但也认可了 Safe Security 是有能力的市场参与者，可能加速其增长，并在 AI 层制造更长期的竞争威胁。LIFARS DFIR 收购（2022 年 2 月）带来 50
              多名员工并扩展了专业服务能力；整合风险——文化契合、服务一致性、DFIR 工具协调——仍然存在，但公司没有公开披露已经解决。考虑到私营公司的披露状态，收购整合质量仍是一个未确认的尽调项。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: 法律、治理与声誉风险
        blocks:
          - type: paragraph
            body: >-
              公开记录中识别到 SecurityScorecard 唯一仍活跃过的诉讼，是 2024 年在美国纽约南区联邦地区法院对 Safe Security（Safe Securities, Inc.）和 Mary
              Polyakova 提起的商业秘密诉讼（案号 1:24-cv-04240），指控违反 DTSA、违反终端用户协议和不正当竞争。双方于 2025 年 10
              月和解，并宣布建立合作研究伙伴关系，消除了即时诉讼成本，但也确立了一个法律先例：在涉及离职员工的争议中，客户名单数据和商业秘密高度敏感。截至 2026 年 6 月，通过 GDPR 执法跟踪器和行业数据库，未发现
              SecurityScorecard 遭遇 GDPR 监管制裁、FTC 执法行动或 SEC 披露失败。


              治理结构将战略、产品和声誉资本高度集中在 Dr. Aleksandr Yampolskiy 身上；他自 2013 年起担任 CEO 兼联合创始人。Yampolskiy 拥有 Yale 密码学博士学位，曾任
              Gilt Groupe CISO，并在 Goldman Sachs 和 Oracle 担任安全领导岗位。如果他被免职、失去履职能力或离职，企业销售关系、伙伴谈判（如 Aon、CISA
              认可）和产品愿景连续性很可能受损。未发现公开披露的继任计划或正式 CEO 备份治理政策。公司是私营企业，未提交 SEC 文件，也未公开董事会委员会披露，外部无法验证独立治理监督。非正式 LinkedIn
              背书带来轻微声誉风险：第三方曾引用 Yampolskiy 的社交媒体互动，作为与 SecurityScorecard 存在「战略伙伴关系」的验证，但双方并无正式商业协议，形成潜在误导陈述敞口。
