      - number: '3.5'
        title: 竞争弱点与不利信号
        blocks:
          - type: paragraph
            body: >-
              尽管具备规模优势，SecurityScorecard
              仍有可记录的竞争脆弱点。最根本的是，其只采用由外向内方法，因外部资产归属错误或内部补偿性控制对外部扫描器不可见而被批评会产生误报。竞争对手撰写的分析和独立评价记录了扫描器把资产错误归属给其他组织的案例，导致供应商分数下降，只能通过争议流程申诉。竞争性风险管理平台
              FortifyData 明确将这一归因限制列为客户可能偏好补充问卷或内部人信息平台的原因。SecurityScorecard 声称误报率低于 1%，并提供快速争议解决流程（通常 72
              小时内），但该指标由公司自行声称，未独立验证。

              在 Forrester Wave Q2 2026 for Cybersecurity Risk Ratings 中，SecurityScorecard 未获得 Leader 认定，而 BitSight 和
              Panorays 获得了。这会在分析师认可影响企业采购短名单的竞争销售周期中，造成声誉定位缺口。尤其在保险垂直，BitSight 2026 年 H1 保险板块同比增长 30%，说明其正在相对所有同行（包括
              SecurityScorecard）取得份额。定价不透明——企业合同按模块定制谈判，完整平台没有公开标价——给中端市场买方带来预算不确定性，也是独立评价中的反复主题。SAFE Security
              法律纠纷（商业秘密诉讼，截至报告日状态部分未决）带来品牌风险，因为方法论可信度会在竞争评估中成为销售异议。
