      - number: '6.2'
        title: 采用轨迹与市场渗透
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 的商业轨迹显示，公司已从利基安全评级提供商转为多产品平台，直接渠道和伙伴渠道共同复合增长。收入从 2022 年 $88.5M 增至 2024 年初 $144.3M（约同比增长
              36%），客户数在 2024 年初增至 2,600，并在 2026 年 2 月突破 3,300。MAX 托管服务于 2024 年 1 月推出，成为增速最快的产品，截至 2025 年中报告同比三位数增长。SCORE
              Partner Program 的渠道 ARR 在 2025 年同比增长 160%，伙伴主导的 pipeline 同比增加 126%——说明间接销售如今已与直接企业销售并列，成为主要增长机制。


              在付费客户之外，平台拥有 1,200 万个持续评级实体的“monitored universe”，并提供免费层（任何组织都可免费查看自己的
              scorecard），形成庞大的漏斗顶部认知面。FeaturedCustomers 收录 56 条 testimonials、55 个 case studies，以及 Winter 2026 Market
              Leader designation；来自 3,007 个 references 的综合评分为 4.8/5——显示跨行业客户参与度广且加深。平台还在 2025 年 2 月获得 FedRAMP Ready 和
              StateRAMP Ready designations，打开美国联邦和州政府采购的正式资格；该高价值细分合同周期长、留存特征强。从 2021 年到 2026 年，受监控实体数量从约 1,168 万（2021 年
              10 月）增至超过 1,200 万，表明新客户进入正在推动受监控宇宙温和但稳定扩张。
