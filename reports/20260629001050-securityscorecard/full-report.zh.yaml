        - 自研专有扫描基础设施
        - 大型云服务商若屏蔽扫描器，可能形成盲区
      - - DNS Sinkhole 与蜜罐网络
        - 每天检测 2B+ 次恶意软件 DNS 请求；补强 IP 声誉和黑客聊天信号
        - 覆盖三大洲的传感器网络
