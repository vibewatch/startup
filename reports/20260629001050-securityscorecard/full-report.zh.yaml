  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与 ARR 轨迹
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard 披露的收入历史很少，但方向上向好。第三方 SaaS 数据库估计，ARR 从 2021 年约 $71M 增至 2022 年 $88.5M（约同比增长 25%）、2023 年
              $106M（约同比增长 20%），并在 2024 年初达到 $144.3M（约同比增长 36%）——隐含四年 CAGR 约 27%。公司唯一披露的数字，是 2025 年 10 月与 Safe Security
              共同发布的商业秘密诉讼和解新闻稿中宣布 ARR 超过 $150M。没有独立投资者公告、业绩电话会或经审计申报文件确认该数字，可审计性受限。截至 2026 年 6 月，公司没有再发布公开 ARR
              更新，数据新鲜度缺口在扩大。

              公司的经常性收入模式，以安全评级、第三方风险监控和供应链检测能力的年度 SaaS 订阅为核心。这些订阅带来可预测 ARR，续约动态符合企业安全软件常态——但准确 NRR 和总流失率未公开。收入确认遵循标准
              SaaS 合同确认方式；公司未披露递延收入复杂性或按用量计费异常。按 3,300 多家企业客户和超过 $150M ARR 计算，隐含平均合同额约为每客户每年 $45,000——与企业 TPRM 定价基准一致。
