      - number: '5.3'
        title: 技术架构与数据基础设施
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 的数据管线始于一套自研专有全球互联网扫描框架，覆盖整个 IPv4 地址空间——超过 39 亿个可路由 IP——并以 10 天为周期扫描 1,400
              多个端口。云资产所有权变化更快，因此每天扫描多次。扫描器收集 IP 地址暴露数据，以及服务、产品、操作系统、库的指纹，包括版本号、Common Platform Enumeration（CPE）ID、CVE
              Version 2 ID 和 Nmap 脚本输出。原始信号还由横跨三大洲的传感器网络补充，再加上公司称为全球最大之一的 sinkhole 和 honeypot 网络——每天捕获超过 20 亿次恶意软件 DNS
              请求。商业和开源威胁情报 feed 补齐了信号摄取层。


              归因是运营上最关键、也最容易出错的一步：SecurityScorecard 必须把收集到的信号与特定组织的数字足迹关联起来。归因引擎依赖 DNS 查询、BGP 路由数据和其他可靠映射来源。组织可以主动认领并反驳其
              scorecard 中的资产，以提高归因准确性。Scoring 3.0 引擎按问题类型使用修改后的 z-score 计算，把每个组织与超过 1,200
              万个已评级实体组成的参照群体比较，并使用上述对数归一化。SecurityScorecard 使用机器学习算法提高发现准确性，并提供针对勒索软件变种和零日漏洞等新兴威胁的洞察。


              AI 能力通过 TITAN AI 引擎和 HyperComply RespondAI 集成嵌入平台各处。TITAN AI 平台被描述为一个“operational
              clearinghouse”，通过共享数据层连接企业和供应商——把评级引擎的外部视角攻击者遥测与评估的内部视角风险信息合并，产出预测性、高保真信号。公司宣称风险归因准确率
              99.9%，反驳率接近零，但该说法未经独立审计。
