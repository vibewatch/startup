              共同发明人，是最集中的运营风险。公司未公开披露继任计划。叠加缺少经审计财务、员工数未披露、上一次官方估值已滞后五年，公司尽调风险画像高于同等商业规模企业。2025 年 10 月的 $150M+ ARR
              信号有方向性参考价值，但不足以支撑完整商业评估。
