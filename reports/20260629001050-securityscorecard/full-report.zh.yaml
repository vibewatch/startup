      - number: '4.2'
        title: 产品收入结构与新兴增长流
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard 的收入结构横跨四条可观察路径：（1）来自安全评级和 TPRM 平台访问的核心 SaaS 订阅收入，占 ARR 大头；（2）MAX
              托管服务，通过认证服务伙伴交付，是高速增长层；（3）TITAN AI 问卷自动化收入，受 2025 年 9 月收购 HyperComply 推动；（4）通过与 WTW
              的合作及扩大的经纪商关系带来的保险承保和数据授权收入。

              MAX 托管服务是最突出的增长信号。截至 2025 年中，该产品同比增长 370%，并推动最近一个季度实现三位数增长。渠道 ARR——经合作伙伴生态流入的收入——2025 年同比增长 160%，伙伴主导的
              pipeline 同比增加 126%。公司拥有 600 多家合作伙伴，并在 2025 年新增 35 家，渠道正成为结构性重要的分销机制。HyperComply
              收购把问卷自动化纳入产品能力；该能力是作为独立附加模块定价，还是打包进企业层级，尚未公开披露。保险承保用例在新闻材料中反复出现，并由 WTW 及其他经纪商关系支撑，代表一条新兴数据变现渠道，但其对总 ARR
              的贡献未量化。国际收入在增长——2020 年 Q4 国际经常性收入同比增长 61%，国际客户数同比增长 89%——但公司没有发布近期地域收入拆分。
