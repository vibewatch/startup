              SecurityScorecard 和 BitSight 在 PeerSpot 上的 IVRM mindshare 都大幅下降（SSC 从 11.1% 降至 5.7%；BitSight 从 10.8% 降至
              5.8%），显示品类碎片化。更大的平台供应商——Palo Alto、Microsoft、CrowdStrike——正在增加风险管理功能，可能通过企业捆绑替代独立供应商。这一约束偏中期，但已经在买方评估模式中显现。
