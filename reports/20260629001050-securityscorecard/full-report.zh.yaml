      - number: '1.5'
        title: 里程碑与战略轨迹
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 的演进可分为三阶段：品类创建（2013–2019）、机构化规模与独角兽认证（2019–2022）、平台多元化与 AI 转型（2023
              至今）。第一阶段，创始人搭建由外向内评级引擎，完成 Series D 前多轮融资，并在金融服务、保险和企业技术领域验证市场需求。第二阶段以 $180M Series E、收购 LIFARS（2022 年 2
              月——增加 50+ 名 DFIR 员工和事件响应能力），以及公司跨过 200 万被监测组织为标志。2021 年 Q1 获 Forrester Wave Leader 认定，以及 2021 年 Gartner
              Peer Insights Customers' Choice，佐证了其评级市场领导者主张。


              第三阶段由平台宽度和监管采用定义。2023 年，SecurityScorecard 收购 CVEDetails（漏洞数据库，350K+ 月用户）、推出 MAX 托管服务、成为首个集成生成式 AI
              的安全评级平台，并获得 FedRAMP Ready 认定和 DHS CDM Program 批准——打开了有意义的政府收入渠道。与 Microsoft（Security Copilot）、AWS（Level 1
              MSP）和 S&P Global（Supplier Risk Index）的战略合作扩大了分销。2025 年 9 月，公司收购 HyperComply 以自动化供应商问卷。2026 年 3 月 23 日 RSA
              Conference 上，TITAN AI 发布三层产品——TITAN Watch（持续监测）、TITAN Assess（AI 问卷自动化）和 TITAN Secure（基于威胁的修复）——声称可减少 95%
              人工 TPRM 工作量，并让采用者供应链泄露减少 75%。2025 Global Third-Party Breach Report 基于 1,000 起已分析泄露，发现 2024 年数据泄露中 35.5%
              与第三方有关（同比上升 6.5%），为平台价值主张提供市场背景。
