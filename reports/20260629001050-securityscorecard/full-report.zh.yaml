        title: 财务质量评估与尽调缺口
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard 可观察的财务画像，符合一家增长中、资本效率提升的 SaaS 公司：ARR 超过 $150M、自由现金流为正、ARR/FTE 改善 40%、MAX 三位数增长、收入连续 10
              多个季度增长。这些信号对 TPRM 市场中的私营公司很有意义。但完整财务承销所需的几乎所有指标仍未公开或未经验证。

              2024 年 6 月 Safe Security CEO 的负面信号——称 SecurityScorecard “laying off significant portions of their teams
              because of the poor performance of their business”——发生在诉讼进行期间，代表带有动机的竞争对手表述。随后 2025 年 10
              月新闻稿披露自由现金流为正和创纪录季度表现，直接反驳了这种说法。不过，最初 $150M ARR
              披露的诉讼语境（出现在诉讼和解公告，而非独立财务新闻稿中）会招致审视，也降低了独立可验证性。外部视角安全评估方法也因潜在误报和深度有限受到批评，长期可能削弱定价权和企业客户追加销售能力。

