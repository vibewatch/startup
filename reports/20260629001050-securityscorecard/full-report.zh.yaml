      - number: '7.5'
        title: 财务、估值与市场周期风险
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 最后一次确认的一级融资，是 2021 年 3 月以投后 $1B 估值完成 $180M Series E。此后五年多内，没有公开后续融资轮、宣布 IPO
              或披露二级交易。Premier Alternatives 二级市场数据（2026 年 6 月访问）显示隐含估值约 $359.5M，较 2021 年一级轮价格折价约 64%，说明私募市场估值明显压缩，也符合
              2022–2026 年后期 SaaS 独角兽整体重估。公司在公开沟通中称 ARR 超过 $150M（见 2025 年 10 月 Safe Security 和解新闻稿），但毛利率、经营现金流、烧钱率和 ARR
              增长率都未披露；任何投资者若要评估盈利路径，或判断是否有理由重新估回 $1B 独角兽水平，都会面对重大信息缺口。


              收入集中风险存在于产品和渠道两个层面：公司收入过度绑定网络保险承保用例（通过 Aon、Willis 以及截至 2026 年宣布的承保方伙伴关系）和追随网络监管扩张的企业 TPRM 强制要求。Munich Re
              2026 年 Cyber Insurance 报告指出，超过三分之二的大型组织在过去 12
              个月内至少经历过一次第三方网络安全事件——这是顺风；但报告也指出，网络保险市场周期可能快速转向，再保险容量约束或灾难性系统事件（例如大型云服务商宕机引发大规模索赔）可能压缩承保意愿，直接减少对
              SecurityScorecard 保险相关评级用例的需求。五年融资空窗提高了未来 12–24 个月内被迫退出事件（IPO、收购或 down round）的概率，而二级市场价格已经暗示部分持有人将该场景计入价格。
