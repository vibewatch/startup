      - number: '6.6'
        title: 负面证据与采用摩擦
        blocks:
          - type: paragraph
            body: >-
              独立评价平台和直接竞争对手暴露出四类采用摩擦，限制 SecurityScorecard 的扩张和留存潜力。第一是方法不透明：直接竞争对手 Black Kite 形容 SecurityScorecard
              评分透明度“moderate”，且有“black box”元素——相较 Black Kite 与标准对齐的开放方法，对底层数据来源和计算逻辑的可见性有限。在 2026 年 4 月 Forrester Wave
              for Cybersecurity Risk Ratings Platforms 中，SecurityScorecard 在 AI capabilities 和 customer AI adoption 上只得
              1/5，低于 Black Kite 等同行（同类得分 5/5）。考虑到 SecurityScorecard 于 2026 年 3 月推出 TITAN AI，这一 Forrester 发现尤其重要，说明评估时平台
              AI 能力尚未成熟到足以获得顶级评分。


              第二个摩擦点是误报归因：G2 和 AuditXYZ 评论者都提到，企业收购后，SecurityScorecard
              曾错误地把漏洞归因给某组织——收购方分数可能被尚未运营整合的子公司问题拖低。解决这类争议需要被评级组织提交反证，把举证责任转移到客户身上。第三是定价摩擦：PeerSpot 评论者指出，$1,000/month
              的中档定价对小型组织负担不起，即使最近推出的 $400/month starter tier 也有限制。一些南美和欧洲客户还面临额外税费和电汇附加费，实际抬高成本。第四是服务质量回落：Capterra
              评论者指出，组织调整后，一些长期客户感到个性化服务减少、支持响应变慢。这些问题会在续约谈判中形成真实摩擦，尤其影响没有专属企业成功经理的客户。
            claimRefs:
              - CU036
              - CU037
              - CU038
              - CU039
              - CU040
