  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 外部视角评分方法与数据引擎
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 的基础产品，是其外部视角安全评级引擎——一种非侵入式、持续评估组织互联网暴露基础设施的方法，不需要安装 agent
              或供应商配合。该引擎把每个发现的安全问题归入十个风险因子组之一：Network Security、DNS Health、Patching Cadence、Endpoint Security、IP
              Reputation、Application Security、Cubit Score、Hacker Chatter、Information Leak 和 Social Engineering。每类问题都有
              High、Medium 或 Low 严重程度；这些严重程度权重直接塑造每个因子的 0 到 100 分，以及整体数字分数，并映射为 A 到 F 的字母等级，类似网络安全领域的信用评级。


              Scoring 3.0 于 2024 年 4 月 9 日发布，此前在 2023 年 9 月预览；它替代了旧方法。旧方法的总分只是十个因子分数的加权平均。3.0
              下，因子仍保留数字分数，但在整体计算中不再各自带权重；整体分数改为直接反映所有发现的安全问题及其严重程度影响。该变化提高了入侵相关性信号：F 级组织（分数 ≤60）遭遇入侵的可能性现在是 A
              级（90–100）组织的 13.8 倍，而旧模型下为 7.7 倍。SecurityScorecard 数据科学团队评估了 15,000 多起历史入侵事件，以验证这种相关性映射。


              评分算法通过对数尺度做规模归一化，确保规模差异很大的组织可以公平比较，避免小组织仅因 IP
              较少、潜在发现较少而显得人为更安全。算法为每类问题计算经规模调整的“z-scores”后，再进行季度校准，以平滑统计波动。因子分和总分每日重新校准，确保低分数波动：如果组织的数字足迹和问题数量保持稳定，分数就会日复一日保持不变。
