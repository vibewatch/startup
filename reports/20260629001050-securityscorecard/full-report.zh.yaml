      - number: '1.6'
        title: 不利事件、诉讼与风险考量
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 历史上最重大的不利事件，是 2024 年 6 月针对 Safe Security 和前员工 Mary Polyakova 的商业秘密诉讼（案号
              1:24-cv-04240，S.D.N.Y.，Edgardo Ramos 法官主持）。SecurityScorecard 指控 Polyakova 作为在其销售组织任职四年的高级销售主管，在 2024 年 5
              月加入 Safe Security 担任 VP of Central Sales 前，将「Master East List」和「CISO Prospect Lists」——价值超过 $40M
              的机密客户和潜在客户数据——发送至个人账户。起诉书进一步指控 Safe Security 使用虚假账户和空壳域名访问 SecurityScorecard 平台以获取竞争情报，并通过对
              SecurityScorecard 员工进行虚假招聘面试套取专有商业信息。SecurityScorecard 称，其已投入超过 $200M 建设客户和潜在客户基础。


              诉讼期间，Safe Security CEO Saket Modi 公开反驳称，SecurityScorecard 及类似竞争对手「因业务表现不佳而裁撤团队的大量人员」。这一说法来自正在诉讼中的对方当事人，尚未被
              WARN Act 备案、员工聚合器数据或 2024–2026 年独立新闻报道独立证实。SecurityScorecard 对此提出异议。两家公司于 2025 年 10
              月解决纠纷，并宣布在网络风险管理方面开展共同研究合作，诉讼在审判前结束。截至本报告运行日，可访问公开记录中未发现其他重大诉讼、监管执法行动或制裁。
