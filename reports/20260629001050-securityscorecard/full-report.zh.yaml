      - number: '8.2'
        title: ARR 锚点与已披露运营指标
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard 唯一公开披露的收入数字，是 2025 年 10 月创纪录季度新闻稿中的「$150M+ ARR」。第三方收入聚合方 Latka 估计 2024 全年 ARR 为
              $144.3M，预计 2026 年 ARR 约 $153.4M。ARR 轨迹——从 2021 年 $71M 到 2022 年 $88.5M、2023 年 $106M、2025 年 10 月
              $150M+——意味着四年 CAGR 约 21%。2025 年渠道 ARR 同比增长 160%（伙伴计划），但这是从较小基数扩张而来，并不必然说明公司整体 ARR 增速加快。

              公司报告 2025 年 10 月季度自由现金流为正，且每名全职员工 ARR 提升 40%，说明效率有实质改善。但成熟买家需要的关键价值驱动指标——毛利率、净收入留存（NRR）、月度烧钱率、CAC 回收期和
              logo 流失——完全没有披露。没有 NRR，就无法扎实承销收入质量：110%+ NRR 意味着按美元计的留存引擎，足以支撑溢价倍数；90% NRR 则意味着重大流失风险，并压缩适用倍数。可比 SaaS
              网络安全龙头（Palo Alto 平台客户约 120% NRR；CrowdStrike NRR 强劲；SentinelOne FY27 Q1 非 GAAP 毛利率 77%、非 GAAP 经营利润率
              4%）显示，披露透明度在这一 ARR 规模上已是基本预期。SecurityScorecard 在 $150M+ ARR 规模下仍如此不透明，本身就是投资风险。

              2021 年 Series E 给 SecurityScorecard 的估值约为远期 ARR 的 14x（融资时 trailing ARR 为 $71M）。如今 $1B 名义估值相当于基于 $150M ARR
              的约 6.7x，五年间隐含倍数明显压缩，即便名义价格未变。压缩部分反映 2022 年回调后 SaaS 倍数的市场重估；在 2021 年高点，高增长 SaaS 的远期收入倍数为
              20–40x。投资者真正要问的是：在不透明和增速背景下，今天隐含的 6.7x ARR 是便宜、合理，还是仍然太高。
            claimRefs:
