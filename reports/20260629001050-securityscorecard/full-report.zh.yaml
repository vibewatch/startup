      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 由 Dr. Aleksandr Yampolskiy 和 Sam Kassoumeh 共同创立，两人至今仍活跃在公司。Dr. Yampolskiy 拥有 Yale
              University 密码学博士学位（2006 年）以及 New York University 数学与计算机科学学士学位。创立 SecurityScorecard 之前，他曾任 Gilt Groupe
              CISO（将安全职能从服务 200 名员工扩展到 2,500 名员工）、Cinchcast/BlogTalkRadio CTO（扩展至 30M+ 月访问者），并在 Goldman Sachs 和 Oracle
              担任工程与安全领导职务。他此前在 Gilt Groupe 担任 CISO、直接管理第三方供应商风险的经历，是 SecurityScorecard 核心用例的创立动机。2021 年，他获评 New York E&Y
              Entrepreneur of the Year，并被 Cyber Defense Magazine 评为 2021 年 CEO of the Year。联合创始人 Sam Kassoumeh
              担任产品负责人，也是董事会成员；一家第三方数据库将其列为 COO，显示其公开头衔存在模糊性。


              董事会治理包括关键投资方代表：Karim Faris（General Partner，GV / Google Ventures）、Joe De Pinho（Principal，Riverwood
              Capital）、Upal Basu（General Partner，NGP Capital）和 Richard Seewald（Managing Partner，Evolution Equity
              Partners）。IBM Fellow Emeritus Nick Donofrio 带来企业技术治理经验。Tanium CEO Dan Streetman 于 2026 年 1
              月以独立董事身份加入董事会。关键人风险明显集中在 Dr. Yampolskiy 身上：他同时是
              CEO、公开形象和核心技术共同发明人；公司未公开披露继任计划。官方公司材料未提供完整现任董事会名单、委员会任命和董事独立性披露，这对任何治理评估都是实质尽调缺口。
