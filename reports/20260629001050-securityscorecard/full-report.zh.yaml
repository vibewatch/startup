      - number: '6.4'
        title: 留存信号、满意度评分与工作流深度
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 不公开披露净收入留存、总收入留存或 cohort 层面流失数据——这对任何经常性收入估值承销都是重大缺口。不过，来自公开评价平台的代理信号持续偏正面。Gartner Peer
              Insights 基于 278 条 reviews 给平台 4.4/5 分，其中 62% 为五星；Service and Support 为 4.7/5，Evaluation and Contracting 为
              4.6/5——这些分数使 SecurityScorecard 位于 Gartner Third-Party Risk Management 市场 reviews 的上游梯队。SoftwareReviews 来自
              18 名 verified users 的数据显示，plan-to-renew intent 为 100%，likeliness to recommend 为 92%。TrustRadius 基于七条
              verified reviews 给产品 9/10。这些信号合起来表明活跃企业客户的总留存较高，尽管它们无法替代正式 NRR 披露。


              工作流深度是关键留存驱动：The Hershey Company 案例研究显示，单人 TPRM 团队使用 SecurityScorecard 实现 100% 供应商版图覆盖，同时还与事件响应、SOC
              分诊、漏洞管理、暴露管理和 M&A 尽调管线集成。这种多工作流嵌入形成转换成本，保护续约。UNICC 报告网络安全运营节省 70-75% 时间。PeerSpot 用户强调，持续监控、自动告警、入侵通知集成和 IP
              reputation scanning 是产生最高回报的功能。平台把人工问卷工作量减少 92%（公司对 TITAN AI 的说法），并接入 CrowdStrike、AWS、BlinkOps 和 90
              多个生态伙伴，进一步加深客户围绕 SecurityScorecard 数据构建相邻安全运营后的工作流锁定。
