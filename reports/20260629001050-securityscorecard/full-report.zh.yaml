      - - 归因引擎
        - 借助 DNS 查询、BGP 路由和数字足迹声明，把信号映射到组织
        - 可靠的公开 DNS/BGP 数据；用户声明资产归属
        - 归因错误仍会存在；误归因会拉低合法组织评分
      - - Scoring 3.0 引擎
        - 按问题类型计算 z-score；套用规模归一化、校准和泄露惩罚
        - 15,000+ 条历史泄露数据集，用于相关性验证
        - 算法专有；未发布评分逻辑的独立审计
      - - AI / ML 层
        - TITAN AI 引擎编排风险信号融合、问卷自动化（RespondAI）和预测分析
        - HyperComply RespondAI；专有 LLM/ML 模型
        - AI 主张（99.9% 归因准确率）未获独立验证
