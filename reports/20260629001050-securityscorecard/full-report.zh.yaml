      - CV029
      - CV030
  - id: TV004
    title: 可比估值表
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >
        Covers primary cyber-risk-ratings, TPRM-adjacent, and high-growth cybersecurity SaaS comparables with documented
        round prices, M&A valuations, or public market multiples as of June 2026. Excludes general enterprise SaaS
        benchmarks not specific to cybersecurity.
    columns:
      - 可比对象
      - 类别
      - ARR / 收入
      - 企业价值 / 倍数
      - 与 SSC 的相关性
      - 关键限制
    rows:
      - - BitSight（2021 轮）
        - 网络风险评级 / TPRM
        - ~$200M+ ARR（估计）
        - $2.4B / ~12x ARR（Moody's 投资）
        - 最接近的直接可比对象 —— 同一类别、客户相似
        - 2021 年定价；Moody's 战略溢价抬高倍数；BitSight 为 $200M+ ARR，SSC 为 $150M
      - - Securiti AI（Veeam 收购，2025）
        - 数据安全 / DSPM
        - ~$150M ARR
        - $1.725B / 约 11x ARR
        - 与 SSC ARR 规模相同；AI 原生产品溢价
        - 类别不同（数据安全，不是 TPRM / 评级）；与 Veeam 备份业务的战略契合也不同
      - - Armis（ServiceNow 收购，2026）
        - OT/IoT 安全
        - ~$340M ARR，50% 同比增长
        - $7.75B / 约 23x ARR
        - 显示网络安全资产的平台级战略溢价上限
        - 增长和 ARR 规模高得多；OT/IoT 细分不同于 TPRM；50% 增长 vs. SSC 约 21% CAGR
      - - Netskope（IPO，2025 年 9 月）
        - SASE / 云安全
        - $707M ARR，33% 同比增长
        - $7.3B / 约 10.3x ARR
        - 证明当前公开市场仍愿意在 IPO 中接纳网络安全 SaaS
        - 类别不同（SASE vs. TPRM）；ARR 大得多；上市估值低于 2021 年 $7.5B 私有估值
      - - Google / Wiz（收购，2026）
        - 云原生应用安全（CNAPP）
        - ~$1B ARR，预计增长 40%+
        - $32B / 约 32x ARR
        - 网络安全战略 M&A 溢价的高水位
        - 极端离群值；云原生架构、超大规模云厂商的战略必需性；不适用于 TPRM
      - - SentinelOne（公开市场，FY27 Q1）
        - AI 端点 / XDR
        - $1.163B ARR，23% 同比增长
        - ~$10B 市值 / ~8–10x ARR
        - AI 融合型网络安全 SaaS 在中双位数 ARR 增长下的公开市场参照
        - 端点 / XDR 类别竞争动态不同；SSC 规模小得多
      - - Tenable（公开市场，LTM 2026）
        - 漏洞管理
        - ~$1B 收入
        - $3B EV / 3.3x EV/收入
        - 显示盈利但低增长网络安全 SaaS 的底部倍数
        - 成熟、盈利、风险类别不同；SSC 未披露盈利能力指标
      - - UpGuard（Series C，2026 年 2 月）
        - TPRM / 供应商风险
        - 未披露
        - $75M Series C（估值未披露）
        - 直接 TPRM 竞争对手可比；显示 VC 对该类别仍有兴趣
        - 估值未公开披露；规模小于 SSC
    notes: |
      所有倍数都是引用来源给出的时点估计；私有公司的 ARR 数字来自第三方估计或轮次时披露指标。 战略买家倍数包含控制权和协同溢价，金融投资者不能直接套用。Wiz/Google 交易只作为上限参考。
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
  - id: TV005
    title: 论点失效与终止触发器
    columns:
      - 触发器
      - 阈值或事件
      - 对论点的传导
      - 行动含义
    rows:
      - - NRR 低于 100%
        - 任何已披露或可信推断的净收入留存低于 100%
        - 表明客户流失压过扩张；收入质量坍塌；所有溢价倍数失效
        - 下调至 AVOID；将 EV 底部修正为 3–4x ARR（$450–600M）
      - - 毛利率低于 70%
        - 任何规模下披露毛利率低于 70%
        - MAX 托管服务交付成本超过 SaaS 常态；公司被重新定价为技术赋能服务
        - 套用服务倍数（4–7x EBITDA vs 6–10x ARR）；EV 压缩 30–50%
      - - Down round 或平轮
        - 一级股权融资 post-money 估值低于 $900M
        - 确认二级市场信号；清算优先权重置；早期投资者受损
        - 触发投资者治理复核；重新评估股权价值分配的 cap-table waterfall
      - - BitSight 被大型保险公司或评级机构平台化收购
        - Moody's、S&P、Verisk 或大型再保险公司收购 BitSight，或进一步将 BitSight 整合为独家网络评级标准
        - 抹去 SSC 在保险承保中的差异化；核心评级可服务市场收缩
        - 下调至 AVOID；SSC 的战略可选性被大幅折价
      - - 单一客户或合作伙伴收入集中度披露超过 20%
        - 披露或推断某客户或合作伙伴贡献 >20% ARR
        - 集中风险不符合 SaaS 溢价；客户流失风险变成灾难性
        - 任何股权购买或 LP 承诺前，要求客户集中度契约
    notes: |
      触发器按对投资论点的重要性排序。NRR 和毛利率最可操作，因为它们是管理层可控且可披露的事实。 竞争触发器（BitSight 收购）由外部驱动，需要快速重新评估。
    claimRefs:
      - CV035
      - CV036
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 净收入留存
        - 按 cohort 和细分披露毛收入留存与净收入留存（整体、企业、保险、托管服务）
        - NRR 是 SaaS 估值最重要的驱动项；没有 NRR，适用倍数范围会从 3x 到 15x ARR —— 太宽，无法承销
        - 管理层 data room 请求；与客户扩张交易公告交叉核对
      - - 毛利率
        - 披露混合毛利率及细分毛利率（SaaS 评级、MAX 托管服务、保险 API）
        - 如果托管服务毛利率只有 40–50%，混合毛利率可能低于 70% SaaS 门槛；这会触发 30–50% 的倍数折价
        - 管理层 data room；对标可比 MSSP 与 SaaS 混合型公司
      - - 股权结构与优先权栈
        - 完全稀释股数、期权池、优先清算瀑布、各轮反稀释条款
        - 二级市场交易的是普通股；6 轮融资累积的优先权悬挂，可能意味着在 $900M–$1.2B 出售时，普通股拿到的价值显著低于名义 EV
        - 直接向公司索取；按多个退出价格情景穿透优先权栈建模
      - - 保险收入贡献
        - 网络保险承保 API 和保费分析合作的量化收入
        - 保险承保 ARR 在出售给评级既有厂商（Moody's、Verisk）时有结构性溢价；不量化，这项战略资产就按零定价
        - 管理层披露，或审查渠道伙伴收入协议
      - - 按细分划分的 ARR 增速
        - 过去 8 个季度按产品线披露季度 ARR 增长（核心评级、MAX、HyperComply、国际）
        - 渠道 ARR 同比增长 160%，但总 ARR CAGR 约 21%；必须确认哪些细分带来持久增长，哪些增长集中在合作伙伴，才能预测 2027–2028 年收入
        - 管理层 data room；用 CrowdStrike 与 WTW marketplace 报告中引用的 SSC 渠道指标交叉验证
    notes: |
      尽调清单按估值影响排序。没有 NRR 和毛利率，牛市论点无法验证，建议不应从 TRACK 上调至 BUY。 股权结构和保险收入量化是次级事项，但对交易结构和战略溢价建模仍然重要。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV043
