      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >
              牛市情景建立在三个条件上：TITAN AI 到 2027 年推动可衡量的 ARR 年增速超过 30%；保险驱动收入流能够量化，并获得单独的战略资产溢价；财务或战略收购方（保险承保方、信用评级公司或大型
              GRC/风险平台）愿意为 TPRM 加保险分析组合支付 10–15x ARR 倍数。若基于预计 $175M ARR 给 15x ARR，企业价值将达到约 $2.25B，较 2021 年 $1B 锚点回报
              125%。这一情景依赖毛利率披露确认 75%+，且 NRR 为 110%+。

              基准情景假设总 ARR 继续增长 15–20%，没有战略收购方支付溢价，且 2027–2028 年公开网络安全 IPO 市场中，TPRM/风险评级厂商交易区间为 6–8x ARR。若基于 $165M（2027
              年中预计 ARR）给 7x ARR，企业价值约 $1.15B，大致符合上一轮 $1B 价格，并较当前二级市场水平提供温和上行。考虑到缺乏已披露指标提供的下行保护，基准情景不是强烈买入信号。

              熊市情景由毛利率或 NRR 披露触发：毛利率低于 70%（与服务占比较重的 MAX 模式一致），且 NRR 低于 100%（客户流失受到 BitSight/UpGuard 竞争挤压）。在该情景下，适用倍数为
              3–5x ARR，对应 $450–$750M 企业价值——低于上一轮 $1B 价格，并构成实质 down round。二级市场 $360M
              隐含估值可能已经在为该情景的不对称尾部定价，清算优先权在六轮融资中累积形成的股权结构悬压可能进一步放大该尾部。
            claimRefs:
