            title: 与入侵相关的评分，覆盖 1,200 万+ 组织
            body: >-
              SecurityScorecard 的 Scoring 3.0 方法产出与入侵相关的等级，并用 15,000+ 起历史事件验证。F 级组织相对 A 级组织的 13.8 倍入侵可能性，加上每日分数更新和全球超过
              1,200 万个已评级组织覆盖，构成一个异常广泛、持续刷新的风险情报数据集；竞争对手尚未在同等规模复制。
            calloutType: strength
            claimRefs:
              - CE004
              - CE007
              - CE009
          - type: callout
            title: 黑箱方法与归因错误暴露
            body: >-
              专有评分算法未经独立审计，归因引擎仍会产生偶发误报。被错误关联到外部 IP 地址或被误归因 domain 的组织，会遭遇不公平分数惩罚，直到人工争议解决——这可能需要数周。Forrester 2024
              年批评还指出，平台缺少针对证据文件的 AI 解析能力，限制了其验证供应商提交证明的能力。这些缺口是结构性风险，无法仅靠规模缓释。
            calloutType: risk
            claimRefs:
              - CE038
              - CE039
              - CE040
          - type: callout
            title: TITAN AI 把 SecurityScorecard 推向主动防御——但相关说法需要尽调
            body: >-
              2026 年 3 月 TITAN AI 发布，把 SecurityScorecard 从评级提供商重新定位为持续检测和响应平台。99.9% 归因准确率、75% 入侵减少承诺、95%
              人工工作量减少，这些数字很有吸引力，但完全由公司自行声称，缺少第三方验证。尽调应要求对 TITAN Secure 修复结果做客户背调取证，并独立评估 HyperComply
              集成的生产稳定性，再决定是否按表面值接受这些指标。
