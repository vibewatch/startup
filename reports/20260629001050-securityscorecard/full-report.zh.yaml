      items:
        - label: 2.4x（二级市场隐含）
          value: 360
        - label: 3x（熊市下限）
          value: 450
        - label: 5x（熊市基准）
          value: 750
        - label: 6.7x（2021 轮隐含）
          value: 1000
        - label: 8x（基准情景）
          value: 1200
        - label: 11x（Securiti AI 可比）
          value: 1650
        - label: 12x（BitSight 融资轮可比）
          value: 1800
        - label: 23x（Armis/ServiceNow 可比）
          value: 3450
    approximationNotes: >
      柱形表示在精确 $150M ARR 下的隐含 EV，单位为百万美元。实际 ARR 为 $150M+（精度未披露）。战略可比倍数（11x、12x、23x）包含控制权和协同溢价；适用于财务投资人的倍数为 3–10x。23x
      Armis 可比仅作背景展示；SecurityScorecard 的品类和增长画像不支持这一水平。
    claimRefs:
      - CV016
      - CV018
      - CV019
      - CV021
      - CV026
      - CV027
      - CV028
  - id: FV003
    title: 分情景估值与回报区间
    type: range
    layout: standard
    summary: |
      在 $150–175M ARR 下，三种情景各自的企业价值低高区间，来自私募市场基准和可比交易。
    data:
      items:
        - label: 熊市情景（3–5x ARR）
          low: 450
          high: 750
        - label: 基准情景（6–8x ARR）
          low: 900
          high: 1200
        - label: 牛市情景（10–15x ARR）
          low: 1500
          high: 2250
    approximationNotes: >
      区间单位为百万美元。熊市假设为 $150M ARR × 3–5x；基准假设为 $150–165M ARR × 6–8x；牛市假设为 $165–175M ARR ×
      10–15x。战略溢价尾部（23x）不纳入，因为它不能代表财务投资人的进入倍数。2021 年披露的 $1B 估值落在基准情景顶部。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: |
      面向 IC 的七维评分（0–10），反映证据质量和投资吸引力。评分仅反映当前公开证据状态。
    data:
      items:
        - label: 市场机会
          value: 8
        - label: 产品差异化
          value: 7
        - label: 收入规模与增长
          value: 6
        - label: 竞争护城河
          value: 6
        - label: 财务透明度
          value: 2
        - label: 估值吸引力
          value: 4
        - label: 退出就绪度
          value: 4
    approximationNotes: >
      分数（0–10）是分析师团队基于证据质量和行业基准作出的定性评估。财务透明度得分 2/10，因为在 $150M+ ARR 规模下，公司未披露任何毛利率、NRR 或现金消耗率。估值吸引力得分 4/10，因为 $1B
      融资轮价格处在可辩护的基准情景区间，但二级市场显示估值明显压缩。
    claimRefs:
      - CV031
      - CV033
      - CV034
      - CV035
