      - number: '4.4'
        title: 成本结构与资本效率
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard 不披露毛利率、COGS、运营费用或 EBITDA。第三方员工数聚合机构把公司放在 501–1,000 人区间，LeadIQ 报告为“501–1,000
              employees”，Forbes Council 简介称“over 600 employees”。按超过 $150M ARR 和约 580–620 名员工计算，隐含人均 ARR 约
              $250,000–$260,000——与安全领域高效率 SaaS 运营商一致。

              2025 年 10 月新闻稿披露了两个关键财务效率信号：该季度自由现金流为正，且 ARR / 全职员工同比改善 40%。若这些信号准确，意味着收入增长快于员工增长，公司正在接近或已经跨过现金中性运营模式。公司还在
              2025 年新增三名高管（CFO Chris Fritz、CRO Peter Jantzen、CMO Claire Trimble），说明即使在提效周期中，公司仍继续投入商业化领导团队。

              核心 SaaS 评级平台的毛利率未披露。可比 SaaS 网络安全评级公司的行业基准显示，受可扩展云交付模式和有限单客户增量成本支撑，毛利率约在 75–85%。不过，MAX
              托管服务可能毛利率更低，因为它涉及人工交付的修复、合作伙伴服务成本组件和托管响应流程。随着 MAX 增速快于核心订阅，混合毛利率轨迹可能面临轻微压缩——这一风险无法用现有公开数据量化。
