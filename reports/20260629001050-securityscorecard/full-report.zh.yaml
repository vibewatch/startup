      - number: '8.3'
        title: 可比估值框架
        blocks:
          - type: paragraph
            body: >
              根据 Multiples.vc 和 Windsor Drake，截至 2026 年 6 月，上市网络安全公司行业中位数为 7.8x EV/NTM 收入，分化很大：CrowdStrike 约
              27x（平台龙头，$5.25B ARR，增长 24%），Palo Alto Networks 约 18x（平台 / NGS ARR $8B），Tenable 为 3.3x（漏洞管理，$1B
              收入，增长较慢）。TPRM 和风险评级厂商作为一个类别，更接近 Tenable 端，因为产品范围更窄、服务成分更重；但 SecurityScorecard 的纯 SaaS
              评级引擎和保险网络，可能支撑其相较点状方案厂商有适度溢价。

              私营网络安全 SaaS 在所有增长区间的 ARR 中位数倍数为 15.2x（Windsor Drake），但这一数字掩盖了极端分层：ARR 增速 10–30% 的公司中位数为 6.1x ARR，30–50% 为
              9.8x，50% 以上的高速增长公司为 15.2x。SecurityScorecard 自 2021 年以来整体 ARR CAGR 约 21%，落在 10–30% 增长区间，对应私募市场中位数倍数约 6x–8x
              ARR，或 $900M–$1.2B 企业价值。

              最直接可比的私营交易，是 Veeam 以 $1.725B 收购 Securiti AI，后者 ARR 约 $150M，隐含约 11x ARR——这是一笔针对成立六年的 AI 原生数据安全平台的 11x
              收入交易。ServiceNow 以约 23x ARR 收购 Armis，后者 ARR $340M、同比增长 50%——这是增长高得多的资产。BitSight 2021 年一轮 $2.4B 估值约为 12x
              ARR（基于 $200M+ ARR）。$32B Wiz/Google 交易按 32–45x ARR 计，是真正的离群值（云原生、$1B ARR、预计 2026 年增长 40%+），不应作为 TPRM
              厂商可比分析的锚。

              综合上市中位数（7.8x）、私营增长区间基准（10–30% 增长对应 6–10x）和交易可比（Securiti AI 11x、BitSight 战略轮 12x），SecurityScorecard 在 $150M
              ARR 下可辩护的基准估值区间为 $900M–$1.2B；若战略收购方支付溢价，可能达到 $1.5–2.0B。$1B 名义估值舒适地落在该区间内，但并不显然便宜。
