  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与理想客户画像
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 2 月，SecurityScorecard 付费客户超过 3,300 家，较 2024 年初约 2,600 家明显增加——两年增长约 27%。平台声称的理想客户，是受监管行业的企业 CISO
              或 TPRM 经理；这些人需要持续监控复杂供应商生态，又不能投入大型内部团队做人工评估。中型市场和企业账户中，买方、用户和付款方大体合一：CISO 或 VP of Security
              通常推动采购，采购或风险负责人批准预算，TPRM 分析师日常使用平台。在网络保险场景下，还会出现额外付款方——Aon 等保险公司的承保人把 SecurityScorecard 分数作为 CyQu
              网络风险平台的一部分，使保险买方成为间接客户群，并推动希望获得有利承保条款的被评级组织产生需求。


              垂直集中度偏向金融服务（占全部 PeerSpot 研究会话的 12%），其次是科技、医疗、政府和私募股权。大型企业（超过 1,000 名员工）占评估 SecurityScorecard 的 PeerSpot
              研究者的 53%，凸显平台根基在企业市场，而非 SMB 市场。2024 年末新增的 $400/month starter tier 试图提高 SMB 可及性，但 $15,000/year 的入门付费层和超过
              $100,000/year 的企业套餐，使产品明确面向拥有专门安全预算的中大型组织。地域上，客户群集中在北美；通过 Macnica 分销网络，公司在日本取得有意义进展，并通过 KPMG Canada、Crowe
              LLP、Uniqus Consultech 和 P3 Group 等 MAX Service Delivery Partners 拓展 APAC、欧洲和中东足迹。National Defense
              ISAC（ND-ISAC）向其国防行业成员组织提供 SecurityScorecard 企业许可，确认其已渗透美国国家安全供应链。
