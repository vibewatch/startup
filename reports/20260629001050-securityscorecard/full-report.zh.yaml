            title: 分歧巨大的分析师估算遮蔽真实市场规模
            body: >-
              TPRM 市场缺少共识定义，导致分析师对同一近似年份的估算相差 40%+（从 $8.09B 到 $11.11B）。把 GRC 和托管服务纳入的宽口径，会显著抬高可寻址市场数字。SecurityScorecard
              和投资者应把规模测算锚定在仅软件、企业级、持续监测细分市场，而不是顶层分析师总数。
