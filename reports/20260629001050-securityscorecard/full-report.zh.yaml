      - number: '5.5'
        title: 合规姿态、政府认证与信任控制
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 已建立有意义的政府和受监管行业合规姿态。2023 年 10 月，公司为其 Third-Party Cyber Risk Management Platform（包括
              Attack Surface Intelligence）获得 FedRAMP Ready designation，跻身不到 450 个拥有 FedRAMP designation 的云产品之列。2025 年 2
              月，公司重申 FedRAMP Ready 状态，并额外获得 StateRAMP Ready designation，扩大到州和地方政府机构采购资格。这两个 designation
              表明公司已完成严格联邦安全控制下的合规测试，但尚未获得完整 FedRAMP Authorization to Operate（ATO），后者需要特定联邦机构赞助并审查。


              SecurityScorecard 的 Attack Surface Intelligence 产品还单独获批进入 Department of Homeland Security（DHS）Continuous
              Diagnostics and Mitigation（CDM）Program Approved Products List（APL），使联邦机构可以直接使用该产品。CISA 在 2022 年把
              SecurityScorecard 纳入 Free Cybersecurity Services and Tools 目录；SecurityScorecard 还参与 CISA Joint Cyber
              Defense Collaborative（JCDC），共享威胁情报，保护公共和私营关键基础设施。公司与 Transportation Security Administration（TSA）Surface
              Operations Cybersecurity Assurance Division 建有活跃合作，监控关键基础设施伙伴；白宫称其为行业风险管理机构的“game-changing”蓝图。


              在数据质量和信任方面，SecurityScorecard 发布了争议解决流程，客户和非客户都可使用。存在争议的发现会被标记，直到解决；公司承诺 24 小时内响应，并在争议验证后 72
              小时内完成分数调整。公司称误报率低于 1%，靠严格内部验证、资产认领 / 反驳工具，以及用于数据佐证的合作关系实现。
