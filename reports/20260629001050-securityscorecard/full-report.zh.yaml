      - number: '5.2'
        title: 产品模块与平台生态
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 的商业产品，已经从独立评级产品演进为 TITAN AI 旗下的多模块平台；TITAN AI 于 2026 年 3 月 23 日在 RSA Conference 宣布。TITAN
              AI 包含三层：TITAN Watch 对供应商生态提供常开、持续可见性——自动发现第三方和第四方关系，并实时浮现外部可观察暴露。TITAN Assess 端到端自动化问卷管理，使用 AI agent
              验证回答、排序风险，并更快完成供应商评估；公司声称可减少 95% 人工工作量，并把供应商参与率提高 9 倍。TITAN Secure
              加入威胁情报驱动的修复，把实时网络威胁情报（CTI）接入分诊工作流，使企业和供应商在识别关键暴露的第一时间协调修复。


              除自助式 TITAN 层级外，SecurityScorecard 还提供 TITAN MAX——一种通过认证伙伴特许模式交付的托管服务，公司于 2024 年 1 月推出。MAX 运营 Vendor Risk
              Operations Center（VROC），由风险管理、威胁狩猎和事件响应从业者组成。它采用与 NIST 对齐的方法，并承诺问卷审核速度提高 26 倍、问题修复率提高 2 倍、注册组织的供应链入侵减少
              75%。MAX 已在 AWS Marketplace 上架，并于 2025 年 5 月加入 CrowdStrike Marketplace，扩大渠道触达，同时不需要 SecurityScorecard
              直接销售介入。


              2025 年 9 月收购 HyperComply 后，平台新增 AI 驱动的问卷自动化。HyperComply 的专有 RespondAI 技术可将人工问卷工作减少 92%，并把问卷处理速度提高
              70%；它构建集中式合规知识库，存储经验证答案以便复用。HyperComply 功能整合始于 2025 年末，目标是为 GDPR、DORA 和 NIS2 合规提供持续、自动化的供应商保障。
