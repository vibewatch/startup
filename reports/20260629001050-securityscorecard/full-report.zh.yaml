      - number: '8.5'
        title: 投资论点、反论点与否决条件
        blocks:
          - type: paragraph
            body: >
              投资论点建立在 SecurityScorecard 在结构性增长市场中的品类领导力上。TPRM 已不再可选：NIS2、DORA、SEC
              网络披露规则和供应链勒索软件频率，已经把安全评级从可自由裁量工具变成董事会层面的强制要求。SecurityScorecard 评级覆盖 1200 万多家组织、渗透 70% 的 Fortune
              100，并深度嵌入保险承保（Aon、Willis 等），构成新进入者难以复制的数据和关系护城河。RSA 2026 发布的 TITAN AI 以及 HyperComply
              收购，补上了问卷自动化缺口，并可能扩大每个账户的总合同价值。

              反论点同样有证据支撑。TPRM 领域有 200 多个竞争对手；Forrester Wave 2026 年 Q2 将 BitSight 评为 Leader，而 SecurityScorecard
              未进入最高排名，说明最高价值企业交易中存在竞争侵蚀。外部视角评级方法持续受到误报批评，削弱买家信心并制造流失风险。收入不透明让外界无法验证毛利质量、NRR，也无法判断增长来自扩张（值得高倍数）还是新
              logo（值得低倍数）。$1B 估值已经滞后五年，之后没有新的价格发现；二级市场已下移 50–64%，意味着投资者正在为退出不确定性定价。

              论点失效条件包括：确认 NRR 低于 100%，披露毛利率低于 70%，或新一级融资低于 $900M 定价（即相对 2021 年 $1B 锚点的 down round）。任一条件出现，都会把建议从 TRACK
              结构性转向 AVOID。
            claimRefs:
