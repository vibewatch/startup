      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 已披露的资本历史横跨从种子轮到 Series E 的七轮融资。最早可记录融资为 2014 年约 $2.2M 种子轮，随后是 2015 年 2 月 $13.7M Series
              A。公司之后完成 Series B（约 $20M，2016 年 6 月）和 Series C（约 $27.5M，2017 年 10 月），用于搭建评级平台和早期 go-to-market。2019 年 6 月约
              $50M 的 Series D 资助国际扩张和产品邻接。决定性融资事件是 2021 年 3 月 18 日 Series E：$180M 优先股融资，将累计披露融资推高至 $290M 以上，并确立 $1B
              轮后估值，使 SecurityScorecard 成为独角兽。J.P. Morgan Securities LLC 是 Series E 唯一配售代理。此后，公司未披露其他公开融资轮、IPO
              计划、二级交易或债务融资。


              Series E 新投资者包括 Silver Lake Waterman、T. Rowe Price Associates、Kayne Anderson Rudnick 和 Fitch
              Ventures（Fitch Group 子公司，显示一家竞争性评级业务的战略兴趣）。既有投资者也参与其中：Evolution Equity Partners、Accomplice、Riverwood
              Capital、Intel Capital、NGP Capital、AXA Venture Partners、GV（Google Ventures）和 Boldstart Ventures。PitchBook 与
              Tracxn 报告，截至 2026 年累计融资约 $293M。投资人结构值得注意，既有财务投资方（Silver Lake、Sequoia、Riverwood），也有战略方（GV/Google、Intel
              Capital、Fitch Ventures、AXA Venture Partners），暗示退出预期多元。精确股权比例和清算优先权未公开披露。
