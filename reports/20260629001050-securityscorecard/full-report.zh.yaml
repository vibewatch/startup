chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与平台
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard, Inc. 是一家私营网络安全公司，注册于 Delaware，总部位于 1140 Avenue of the Americas, 19th Floor, New York,
              NY 10036，并在 Texas 州 Austin 设有第二办公室，员工分布全球。公司由 Dr. Aleksandr Yampolskiy 和 Sam Kassoumeh 于 2013 年创立，并于 2014
              年 7 月 17 日在 New York 正式注册（New York Department of State 文件编号 4607959）。公司仍为私营企业，凭 2021 年 3 月 Series E 轮后 $1B
              估值保留独角兽身份。公司宣称的使命是改变组织理解、缓释并向董事会、员工和供应商沟通网络安全风险的方式，让世界更安全。


              平台核心产品是一套获得专利的安全评级引擎，采集外部可观察信号——互联网扫描、DNS 健康度、IP 声誉、网络配置和端点观察——并汇总为横跨十组风险因子的 A 到 F
              字母评分，不需要本地代理，也不需要供应商提交问卷。这种「由外向内」方法让 SecurityScorecard 可以在组织不知情或未同意的情况下，持续评级数百万个组织。以评级为基础，公司已扩展为更宽的 Supply
              Chain Detection and Response（SCDR）平台，覆盖供应商风险管理（TPRM）、外部攻击面管理、自我监测、董事会报告、网络保险承保、M&A
              尽调、威胁情报，以及数字取证和事件响应。2026 年 3 月推出的 TITAN AI 进一步把平台延伸到 AI 加速问卷自动化和基于威胁的修复工作流。CISA 将 SecurityScorecard
              认定为免费网络工具与服务；截至 2026 年 3 月，平台持续评级全球超过 1,200 万个组织。
