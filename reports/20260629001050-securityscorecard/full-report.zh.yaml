            body: >-
              三个叠加风险应优先尽调。第一，SecurityScorecard 不披露 NRR、GRR 或 cohort 留存数据——没有私营公司财务数据，就无法建模有机收入耐久性。第二，2026 年 4 月
              Forrester Wave 在 AI capabilities 和 customer AI adoption 上给平台 1/5；对一家正积极把 TITAN AI
              包装为下一增长平台的公司，这是显著可信度缺口。第三，反复出现的误报归因投诉（尤其是收购后）代表 TPRM
              用例中的结构性脆弱点；不准确的供应商分数可能触发高成本修复工作流，或损害供应商关系。公司的渠道主导增长模式会放大这些风险，因为随着更多 ARR 经伙伴关系流转，留存质量越来越不透明。
