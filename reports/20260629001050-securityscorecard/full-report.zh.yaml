  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 方法不透明、误报与外部视角上限
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 的核心竞争资产——外部视角评级引擎——同时也是最大的结构性负债。平台完全依赖外部可见信号（开放端口、DNS 健康、IP
              声誉、证书异常、暗网暴露），因此无法评估任何互联网不可见的补偿性控制：补偿性防火墙、网络分段、应用层防护、内部治理状态，都在模型视野之外。这会制造一类已有充分记录的误报：云服务商共享 IP
              段、临时开发环境、管理正确但外部看来不常见的 TLS 设置等合法配置，会被打成漏洞，引发供应商摩擦和争议升级。


              PeerSpot 和 AuditXYZ 评论（2026 年 6 月更新）中的独立用户研究显示，误报仍是从业者最常见的不满之一：「定价需要改进，尤其在巴西；考虑到 SaaS
              模式，整体定价预期可以更低」与「把无关公司的漏洞关联起来会产生不准确」以及修复建议没有区分根因和噪声的抱怨并存。Netcraft 2024 年行业分析发现，33%
              的公司因为团队在排查误报而延迟响应真实网络攻击，说明自动评分工具误报率过高会带来系统性成本。SecurityScorecard 的 IPv4 扫描周期为 10 天，而 UpGuard 为 24
              小时；这留下时间缺口，新出现的漏洞可能在期间未被发现，也成为竞争对手在销售对话中使用的事实差异。纯「外部视角」设计还催生了不对称的争议市场：低评级公司有强烈商业动机去质疑发现；如果争议获得监管牵引或具备法律可诉性，SecurityScorecard
              的核心产品变现模式将面临生存级挑战。同行评论反复指出评分透明度和分数变化解释薄弱，进一步削弱买家对方法论的信心。
