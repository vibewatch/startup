      - number: '7.6'
        title: 运营、依赖与保险渠道风险
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 自身基础设施构成元系统性风险：平台持续监控 1200 多万家公司的外部攻击面，并为 3300 多家企业客户持有敏感第三方风险评估数据，其中包括 70% 以上的 Fortune
              100；一旦 SecurityScorecard 自身系统被成功攻破，就会成为一阶供应链事件，带来灾难性的声誉和监管后果。SecurityScorecard 2025 Global Third-Party
              Breach Report 发现，2024 年所有泄露中 35.5% 与第三方有关，41.4% 的勒索软件攻击从第三方开始——这正是 SecurityScorecard
              所定位防御的威胁向量。因此，公司本身会成为高能见度目标，外界也预期其内部安全状态达到从业者级别。


              2026 年 2 月宣布的 Aon 合作，将保险渠道收入和推荐流集中到单一经纪关系中；如果 Aon 风险偏好变化、Aon 扩展自有原生风险评分能力，或 Aon
              与竞争对手（BitSight/Moody's）合作，SecurityScorecard 的保险渠道收入可能大幅收缩。云基础设施集中在主要
              hyperscaler（AWS/GCP）上，形成平台依赖风险——云服务商层面的故障可能同时中断整个客户群的持续监控。2026 年未发现 SecurityScorecard 有已确认的 WARN Act
              申报、大规模裁员公告或公开重组行动，说明近期运营稳定；但员工数估计为 600–640 人（低于上一年估算），可能反映静默流失，而非正式重组。客户支持质量是已被指出的运营风险：PeerSpot
              评论记录显示，响应时间需要改善，尤其是非企业层级客户；这会在中端市场制造流失风险。
