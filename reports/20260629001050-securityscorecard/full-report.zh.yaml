      - number: '8.6'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，SecurityScorecard 没有宣布 IPO 计划，而网络安全 IPO 门槛很高：Netskope 需要 $707M ARR、33% 增长和 118% NRR，才支撑
              $7.3B 首秀。以 $150M ARR、NRR 和盈利能力未披露的状态，仅凭已披露指标，SecurityScorecard 尚未准备好进入公开市场。M&A
              退出是更可能的近期流动性路径，潜在战略买家包括信用风险数据在位者（Moody's、S&P、Verisk）、大型 GRC/风险平台厂商（ServiceNow、SAP）、托管安全服务收购方，或对 TPRM
              品类进行整合的私募股权基金。

              最关键的尽调优先事项是
              NRR、毛利率和烧钱率披露；没有这些，任何溢价倍数都站不住。次级优先事项包括股权结构透明度（优先权结构、反稀释条款、加权平均退出收益分配）以及把保险承保收入作为独立资产并量化其自身战略溢价。

              最终尽调要求见表 TV006。若 NRR 和毛利披露不能给出令人满意的回应，建议仍应为 TRACK 而非 BUY；没有一手证据，投资者不应把牛市情景结果计入价格。
