  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 因素
      - 方向
      - 时间
      - 对 SecurityScorecard 的影响
      - 尽调问题
    rows:
      - - NIS2 / DORA 监管要求（欧盟）
        - 驱动
        - 当前（2024–2025 生效）
        - 欧洲销售线索提速；欧盟总部企业因合规推动成交
        - 监测欧盟企业 ACV 增长；跟踪 2026 年 DORA 执法行动
      - - SEC 网络披露规则（美国上市公司）
        - 驱动
        - 当前（2023 年 12 月生效）
        - 董事会层面需要可审计的 TPRM 证据；内部推动者从 CISO 扩大到审计委员会
        - 跟踪有多少 10-K 披露点名 TPRM 项目
      - - 第三方泄露升级（占泄露 30–35%）
        - 驱动
        - 当前且在加速
        - 制造紧迫事件，推动应急采购；提升 CISO 认知
        - 监测 SSC STRIKE 团队报告是否带来入站销售线索
      - - 网络保险承保集成
        - 驱动
        - 当前；增长中
        - 保险公司授权使用评级数据，形成衍生需求；若保险公司把 SSC 评分嵌入保单要求，保费上行空间更大
        - 在下一轮融资披露中确认保险公司授权收入的规模与增速
      - - AI 驱动自动化（TITAN AI ROI）
        - 驱动
        - 近期（2026–2027）
        - 减少所需手工 TPRM 人力，扩大中端市场可服务范围；支撑溢价定价
        - 跟踪 TITAN AI 发布后中端市场客户数是否增长
      - - 大型厂商平台整合（Palo Alto、Microsoft、CrowdStrike）
        - 约束
        - 中期（2027+）
        - 捆绑威胁：大型厂商把 TPRM 功能免费加入现有企业协议
        - 评估 SSC 集成深度，对比 Prisma Cloud 和 Microsoft Defender 原生模块
      - - 预算周期性 / 安全预算削减
        - 约束
        - 阶段性
        - TPRM 在监管最低要求之上属于自由支配支出；预算冻结会拉长销售周期
        - 确认 SSC 销售线索在 2026 年是否显示销售周期拉长
      - - 误报与数据质量担忧
        - 约束
        - 持续存在
        - 外部视角方法在共享主机、CDN 资产、弃用基础设施上容易误判，削弱 CISO 信心
        - 在客户访谈中衡量误报率和争议解决时间
      - - 企业交易中的采购摩擦
        - 约束
        - 持续存在
        - 评估周期跨多个季度；CISO 必须向采购和法务解释评级概念
        - 跟踪平均销售周期长度，理解法务审查瓶颈
      - - 品类教育缺口（71% 称问卷无法捕捉真实风险）
        - 约束与机会
        - 当前；正在改善
        - 买家不满现状，为评级打开机会；但也说明买家怀疑任何供应商解决该问题的能力
        - 跟踪 NPS 和续约率，作为 SSC 兑现 ROI 承诺能力的代理指标
    notes: 驱动 / 约束的时间判断，基于监管生效日期和市场调研数据近似得出。影响列反映推断的战略相关性， 不是公司披露的指引。
    claimRefs:
      - CM025
      - CM026
      - CM027
      - CM028
      - CM029
      - CM030
      - CM034
      - CM035
      - CM036
      - CM037
