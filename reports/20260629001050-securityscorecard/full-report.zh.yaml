      - number: '6.5'
        title: 伙伴生态、扩张驱动与集中度风险
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 的落地扩张动作，靠两套机制相互强化。第一是产品追加销售：客户从自我监控（免费层或基础付费）开始，可以逐步增加供应商监控组合、问卷自动化（TITAN Assess）、威胁情报驱动
              TPRM（TITAN Secure），最终迁移到 MAX 托管服务——每次迁移都代表有意义的 ARR 增量。第二是渠道杠杆：SCORE Partner Program 和 MAX Service Delivery
              框架允许 MSSP、咨询公司（KPMG Canada、Crowe LLP）和技术集成商把 SecurityScorecard 打包进托管安全产品，在不消耗 SecurityScorecard
              直接销售产能的情况下，把新的企业 logo 拉入客户基数。600 多家全球伙伴和 2025 年渠道 ARR 增长 160%，确认间接销售如今是更快增长的向量。


              与 Aon 的保险行业集成，是一项独特的结构性扩张驱动：使用 CyQu 的 Aon 客户会收到 SecurityScorecard 数据作为基线评估——这形成了一条间接
              pipeline，让组织在成为直接客户之前就接触产品。类似地，SecurityScorecard 被列为 CISA
              免费工具，会在美国政府和关键基础设施运营方中推动认知和试用，后续可能转化为付费企业订阅。Macnica 的日本分销合作展示了地域集中风险缓释：这家单一高绩效本地分销商赢得 2025 年 Partner of
              the Year Japan，目前掌握了一个企业采购要求复杂市场中的主要 go-to-market。


              客户层面的集中度风险存在但不尖锐：没有单一具名客户主导已披露收入。渠道集中度风险更实质——如果 MAX 伙伴生态或 Aon 集成受扰，主要增长向量可能显著受损。渠道 ARR
              快速加速也意味着，随着更多收入通过伙伴关系流转，直接企业留存数据会越来越难观察。
