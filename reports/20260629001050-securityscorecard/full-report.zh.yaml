  - id: TR005
    title: 缓释和否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 方法论争议升级
        - 正式评分争议提交量，以及针对评级的监管挑战
        - 任一司法辖区就评分准确性发布具有约束力的法律标准；或争议 / 客户比超过 5%
        - 投资逻辑破裂：评级变成责任场景；退出，或只围绕问卷 + AI 层重组
      - - 竞争对手降价压制
        - BitSight、UpGuard 或平台捆绑方（ServiceNow、OneTrust）宣布定价调整，将评级免费嵌入
        - SSC 同一季度在 2+ 个重大竞争评估中输给免费捆绑方案
        - 提高 IPO/退出时间表紧迫性；加速平台差异化，或承认评级已商品化
      - - 融资缺口 / 退出失败
        - 到 2027 年 Q4 仍无新一轮主要融资、IPO 申报或收购公告
        - 二级市场估值跌破 $250M，或宣布投资方推动的重组
        - 重大恶化信号；提高组合对冲；直接追问烧钱率和现金跑道
      - - 关键人物离任
        - CEO、联合创始人或 CRO 公开宣布离开 SecurityScorecard
        - Yampolskiy 或 Kassoumeh 宣布离任或长期休假
        - 列入观察；评估继任者厚度；重新评估企业销售管道耐久性
      - - 网络保险市场收缩
        - Munich Re、Swiss Re 或 Lloyd's 市场数据显示网络保费规模同比下降 >15%，或承保能力实质收紧
        - 两家或更多 Tier-1 网络保险合作伙伴降低承保决策对 SSC 评分的依赖
        - 收入模型受压信号；用例暴露多元化对维持 ARR 变得关键
    notes: 阈值是投资者监测的示例触发点；并非基于管理层披露指标。所有触发项都应每季度按更新后的公开数据跟踪。行动含义面向投资者，不是给 SecurityScorecard 管理层的运营建议。
    claimRefs:
      - CR030
      - CR031
      - CR033
      - CR037
  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 含义
    rows:
      - - 建议
        - 跟踪
        - 在投入资本前，监测 NRR/利润率披露或战略退出信号
      - - 信心
        - 中
        - 市场位置证据充分；没有 NRR/利润率，估值无法按所需精度确认
      - - 风险评级
        - 高
        - 信息不透明、上一轮融资已过 5 年、市场拥挤、二级市场估值压缩，带来实质下行风险
      - - 估值立场
        - 公允（基准情景）/ 偏紧（官方 $1B vs. 二级市场约 $360M）
        - $1B 对应 6.7x ARR，基本贴合行业中位数；二级市场对应 2.4x ARR —— 差距很大且尚未解释
      - - 目标持有期
        - 24–36 个月（需要退出催化剂）
        - IPO 或战略 M&A 都要求指标披露，并且退出窗口配合
    notes: >
      估值立场是双重的：官方 $1B 轮次价格大体匹配 10–25% 增长私有网络安全 SaaS 的 6–8x ARR 区间， 但截至 2026 年 6 月，二级市场平台给出的股价比轮次价格低 53–64%。这是一处尚未解决的分歧，
      入场前必须查清。
    claimRefs:
      - CV001
      - CV025
      - CV035
  - id: TV002
    title: 论点与反论点
    columns:
      - 轴线
      - 论据
      - 什么会改变判断
    rows:
      - - 论点 1
        - 类别开创者，已评级 12M+ 组织，覆盖 70% 的 Fortune 100，并深度接入保险承保流程，数据与关系护城河更耐久
        - 用客户流失验证市场份额是否被侵蚀：Forrester Wave 未进入领导者阵营之后的流失，或 BitSight/UpGuard 的净赢单
      - - 论点 2
        - TITAN AI 与 MAX 托管服务启动 NRR 扩张引擎，可能把增长推到 25% 以上，并支撑 8–10x ARR 倍数
        - TITAN AI 的独立客户采用指标；托管服务毛利率验证
      - - 论点 3
        - NIS2、DORA、SEC 网络披露等结构性监管顺风，要求企业规模化采用 TPRM，且没有替代品
        - TPRM 要求获得监管豁免，或被整合进买方已拥有的 GRC 平台
      - - 反论点 1
        - Forrester Wave 2026 年 Q2 未将 SecurityScorecard 列为顶级领导者；BitSight（Moody's 支持，$200M+ ARR） 处在战略溢价位置，威胁最大客户替换 SSC
        - SecurityScorecard 在连续重大 Forrester/Gartner 评估中获得第一梯队认可
      - - 反论点 2
        - 毛利率、NRR、烧钱速度完全未披露；没有详细单位经济学，正自由现金流信号不足以支撑溢价倍数
        - 完整财务披露确认毛利率 75%+、NRR 110%+，且经营利润为正
      - - 反论点 3
        - $1B 估值已停留 5 年；二级市场暗示 $360M–$470M 隐含 EV（折价 53–64%），说明退出风险和潜在 down round 暴露都不小
        - 新一轮一级股权融资定价不低于 $1B，或 M&A 公告确认战略溢价
    notes: |
      论点主要来自公司发布的新闻稿（官方）和市场分析来源；反论点来自竞争情报和二级市场定价数据。 双方都缺少完整财务验证。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
  - id: TV003
    title: 牛市、基准与熊市情景分析
    columns:
      - 情景
      - 关键假设
      - 在约 $150–175M ARR 下的隐含 EV
      - 情景关键风险
      - 概率信号
    rows:
      - - 牛市
        - TITAN AI 推动 ARR 同比增速升至 30%+；毛利率 ≥75%；NRR ≥115%；战略买家 （保险 / 评级巨头）支付 12–15x ARR 溢价；2027–2028 年退出
        - $1.8B–$2.6B（基于 $150–175M ARR 的 12–15x ARR）
        - AI 牵引未经验证；战略买家未必出现；Wiz 先例不能直接套用到 TPRM
        - 中低（20–25%）
      - - 基准
        - ARR 同比增长 15–20%；毛利率 70–75%；NRR 100–110%；2027–2028 年以 6–8x ARR IPO 或出售给 PE 支持买家； 无战略溢价
        - $900M–$1.4B（基于 $150–175M ARR 的 6–8x ARR）
        - 依赖尚未披露的毛利率确认；公开市场对 TPRM SaaS 的胃口不明
        - 中（45–50%）
      - - 熊市
        - 披露后发现毛利率低于 70%、NRR 低于 100%；BitSight/UpGuard 竞争压力加速客户流失；退出推迟到 2029 年之后； 可能 down round
        - $450M–$750M（基于 $150M ARR 的 3–5x ARR）
        - 约 $360M 的二级市场价格可能已经在反映这条尾部；股权结构优先权会放大稀释
        - 中低（25–30%）
    notes: >
      ARR 情景以 2025 年 10 月的 $150M 为锚，并推演 2027 年中达到 $165–175M。倍数来自 Windsor Drake 私有网络安全基准和可比 TPRM /
      网络评级交易。概率信号是定性判断，不是模型输出。
    claimRefs:
