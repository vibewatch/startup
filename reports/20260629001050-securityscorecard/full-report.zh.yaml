      - number: '2.4'
        title: 增长驱动——监管、威胁升级与 AI
        blocks:
          - type: paragraph
            body: >-
              2026 年，网络风险评级和 TPRM 市场最强的三项增长驱动是：（1）监管要求，（2）供应链威胁升级，（3）AI 驱动自动化扩大 ROI 论证。


              监管方面：NIS2（EU）覆盖 18 个关键行业，要求到 2024 年 10 月完成转置；2026 年 1 月，EU Commission 提议有针对性修订，以减轻 28,700 家公司的合规负担。DORA（EU
              金融韧性）于 2025 年 1 月生效，要求金融实体持续管理 ICT 第三方风险。SEC 2023 年 7 月 Cybersecurity Disclosure Rule
              要求上市公司在四个工作日内报告重大事件，并在年度 10-K 文件中披露第三方风险管理治理——由此形成董事会级、可审计 TPRM 项目的需求。这三套框架共同直接要求或强烈激励安全评级所提供的持续供应商监测。


              威胁方面：2025 年，第三方参与泄露的比例翻倍至全部泄露约 30%（Verizon DBIR）；SecurityScorecard 自身 2025 年研究记录，2024 年泄露中 35.5%
              与第三方有关。Black Kite 2026 年报告发现，每起供应商泄露现在平均会级联影响 5.28 个下游组织——为有记录以来最高——同时 41.4% 的勒索软件攻击现在通过第三方路径发起。全球供应链攻击成本在
              2025 年估计达到 $60B。


              AI 方面：TITAN AI 于 2026 年 3 月发布，声称可减少 95% 人工 TPRM 工作量，验证了自动化 ROI 逻辑。Gartner 预计 AI 放大的安全市场到 2029 年将达到
              $160B，且到 2028 年 75%+ 企业将使用 AI 放大的网络安全产品。这既扩大了可寻址市场（AI 解锁此前无法配置 TPRM 团队的中端市场买方），也为较早把 AI 嵌入平台的供应商带来竞争优势。
