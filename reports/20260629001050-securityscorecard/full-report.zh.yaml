      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 的主要经济买方是 Chief Information Security Officer（CISO），其负责安全战略、供应商风险项目和董事会级网络风险报告。Panorays
              2026 年对 200 名 CISO 的调查发现，85% 缺乏完整供应链可见性，62% 报告过去 12 个月监管压力增加，验证了问题紧迫性。不过，只有 22% 的 CISO
              认为自己「完全准备好」应对不断演进的监管要求，这创造了一个庞大、动机明确但现有工具服务不足的可寻址买方群体。


              用户画像通常是 CISO 组织内的 Third-Party Risk Manager
              或供应商风险分析师，他们每天使用平台做供应商准入、持续监测和修复跟踪。付款方差异很大：在受监管行业（BFSI、医疗健康），TPRM 预算常从专门的 GRC
              或合规预算中划出；在科技公司，支出来自安全工程预算；在中端市场公司，CISO 的自由裁量预算覆盖全部。


              次级买方包括采购 / 供应商管理团队（控制供应商合同条款，并可能把安全评分要求嵌入 RFP）、网络保险承保人（用 SecurityScorecard 评级作为承保输入，为保单定价并设定条款——形成 B2B2B
              需求链），以及董事会 / 审计委员会（消费风险仪表盘，并越来越要求把第三方风险指标纳入 SEC 和 NIS2 治理披露）。年收入 $1B+、拥有 500+ 供应商关系的大型企业是主要客群；Panorays
              数据显示，只有 41% 的组织甚至会监测第四方供应商，说明中端市场仍有显著采用缺口。
            claimRefs:
