      - number: '4.3'
        title: 定价架构与合同经济性
        blocks:
          - type: paragraph
            body: >
              SecurityScorecard 采用分层定价，但入门层以上并不透明。Free 层提供自评访问。Business 计划覆盖最多五个外部实体的监控，按第三方采购数据估计，每年约
              $15,000–$25,000。Enterprise 计划覆盖自定义数量的受监控 scorecards，并提供高级告警、合规框架和专属客户成功经理；定价仅为 “Contact
              Sales”，第三方基准显示典型企业合同为每年 $50,000–$100,000+。MAX 层增加托管服务、修复支持和入侵检测，完全定制定价；有意义部署的年费估计在 $100,000+。

              多个附加模块（Cyber Risk Quantification、Attack Surface Intelligence API、Automatic Vendor Detection）位于基础
              Enterprise 订阅之外，可能显著推高合同总额。采购数据库引用的按用户定价基准约为小规模部署 $20,000/user/year，大型组织则非线性扩展。公司提供多年期折扣，但没有系统披露。2025 年 10
              月新闻稿中的 SecurityScorecard 竞争替换胜单涉及“six-figure”合同，确认最大型企业交易明显高于 $100K 的隐含 ACV
              下限。定价不透明给买方和分析师都带来不确定性；第三方定价分析师指出，“Contact Sales”模式“likely targets larger enterprises”，且入门成本高于部分竞争对手。
