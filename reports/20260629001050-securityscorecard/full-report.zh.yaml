      - number: '5.6'
        title: 方法局限、批评与产品风险
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard
              评分使用专有算法，详细组件级证据和因子交互逻辑未公开发布，限制了独立审计和可复现性。被评分组织通常无法准确追踪是哪些数据点或信号组合导致某项发现，这会让希望先核验准确性再采取行动的 CISO
              受挫。Forrester 2024 年 cybersecurity risk ratings Wave 指出具体平台缺口：SecurityScorecard 缺少用于评估上传证据文件（SOC 2 报告、政策
              PDF）的 AI 解析工具；当同一资产同时以 IP 地址和主机名上报时，平台在防止重复发现方面也存在挑战。Bitsight 在 2024 Wave 的战略得分上超过 SecurityScorecard，尽管
              SecurityScorecard 仍保住当前产品实力第一的位置。


              外部视角扫描模型存在结构性局限，除非部署 agent，否则无法解决。一名经验证 AWS Marketplace 客户指出，SecurityScorecard
              只监控面向公众互联网的资产，不监控内部（非互联网暴露）设备；这意味着内部网络风险——横向移动路径、不可路由主机漏洞、终端合规——落在产品覆盖模型之外。归因错误也持续存在：组织偶尔会因并不拥有的 IP
              地址、domain 或资产而被评分，导致等级被不公平拉低。虽然争议机制存在，复杂争议的解决过程可能需要数周，在此期间，错误分数会影响客户、保险公司和监管机构作出的第三方决策。


              与 TITAN AI 相关的 AI 能力说法——包括风险归因准确率 99.9%、入侵减少 75%、供应商参与提升 9 倍——都是公司自行声称，缺少独立验证。HyperComply 集成始于 2025
              年末，平台统一仍在完成中；组合产品的生产记录有限。FedRAMP Ready（但未 Authorized）状态可能拖慢政府机构采用，直到获得完整 ATO 赞助。这些缺口合在一起，围绕评分透明度、AI
              证据质量和政府市场时点，构成重大的尽调问题。
