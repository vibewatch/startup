  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与相邻支出
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard
              竞争的市场位于三个重叠软件品类的交叉处：网络风险评级（也称安全评级或网络风险评分）、第三方风险管理（TPRM）平台，以及外部攻击面管理（EASM）。评级品类的核心差异化在于「由外向内」的持续评分方法——把可观察互联网信号汇总为
              A–F 字母等级，不需要本地代理或供应商参与——由此一次性自动覆盖数百万个组织。


              纳入核心口径的支出，是用于监测外部网络安全态势和供应商 / 供应链风险的平台型企业软件订阅收入：安全评级数据源、TPRM 工作流软件、问卷自动化、持续供应商监测，以及 AI
              辅助修复编排。紧密相邻预算包括：治理、风险与合规（GRC）软件（常承载 TPRM
              工作流）、外部攻击面管理工具（在扫描侧既竞争又互补）、网络保险承保技术（用安全评级为保单定价），以及董事会级网络风险报告仪表盘。合计来看，这些相邻品类增加约 $23–35B 与 SecurityScorecard
              平台范围重叠的软件支出。


              核心 TAM 不包括内部网络安全产品（防火墙、端点检测、SIEM）、身份与访问管理，以及 Gartner 估算的 2026 年 $244B
              全球信息安全大市场。安全评级的替代方案包括一次性渗透测试、临时问卷制项目（常基于 Excel）、由托管安全服务商处理供应商评估，以及内部安全团队做时间点审计。关键边界在于：SecurityScorecard
              的由外向内持续评级模型替代周期性、劳动密集型评估——这是区别于传统 GRC 勾选框工具的独立价值主张，尽管随着大型 GRC 平台加入持续监测功能，这条边界正在变模糊。
            claimRefs:
