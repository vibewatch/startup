      - number: '2.5'
        title: 采用约束、市场摩擦与不利信号
        blocks:
          - type: paragraph
            body: >-
              尽管增长顺风很强，网络风险评级和 TPRM 市场仍面对结构性采用约束。最常被提及的限制是数据质量和误报：安全评级依赖由外向内的被动扫描，可能误归属资产，或把已废弃基础设施标记为活跃漏洞。PeerSpot
              买方评价指出，SecurityScorecard 在 IT Vendor Risk Management 中的 mindshare 在 2025 至 2026 年间从 11.1% 降至 5.7%，BitSight
              从 10.8% 降至 5.8%——这更像是品类碎片化，而非领导者占优。66% 的 CISO 认为 GRC 工具「仅有一定效果」，反映的是整个 TPRM 品类的广泛买方不满，而不只是评级类工具的问题。


              预算周期性是结构性约束：高于监管最低要求的企业安全预算具有自由裁量属性，ISC2 2024 年数据显示，37% 的组织遭遇安全预算削减，25% 经历网络安全裁员。平台整合带来替代风险：Palo Alto
              Networks、Microsoft 和 CrowdStrike 正在扩展 GRC 与风险管理能力，可能把 TPRM 功能吸收到既有企业协议中。Gartner 2026 年安全支出预测（总额 $244.2B，增长
              13.3%）覆盖整个网络安全，TPRM 板块的增长必须与云安全（28.8% 增长）和端点安全等优先级更高的品类竞争预算。


              采购摩擦是持续性约束：企业安全交易通常需要 CISO 赞助、法务 / 采购审查、供应商回应安全问卷，并经历跨季度评估周期。79% 的 CISO
              缺少针对第三方泄露的正式事件响应计划（Panorays），说明市场仍处于教育和紧迫感建立阶段，许多组织已经意识到问题，但尚未为持续平台方案编列预算。网络保险市场转软（2025 年 Q4 全球保险定价约下降
              7%）可能在近期削弱由保险驱动的安全改进紧迫性。
