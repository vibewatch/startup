      - number: '1.4'
        title: 规模、收入与客户版图
        blocks:
          - type: paragraph
            body: >-
              2021 年 Series E 之后，SecurityScorecard 规模显著扩张。公司 2023 年末拥有 2,600 个付费客户，70,000 个组织活跃使用平台。到 2026 年 3
              月，其官方公司页面和 TITAN AI 新闻稿均确认直接客户组织超过 3,300 个，且 70% 的 Fortune 100 信任其数据。平台持续监测超过 1,200
              万个组织——这一数字代表评级数据集的全球覆盖，而不是付费客户。SecurityScorecard 的 MAX 托管服务截至 2025 年 10 月以三位数速度增长；2020 年
              Q4，公司报告国际经常性收入同比增长 61%，国际客户数同比增长 89%。2021 年 3 月 Series E 时，公司监测组织接近 200 万个。


              收入披露仅限一个数据点：2025 年 10 月 SAFE-SSC 联合新闻稿称 SecurityScorecard 已超过 $150M ARR，MAX 以三位数速度增长。此后公司未公开披露 ARR
              更新、毛利率或收入增长率。第三方聚合器估算 2026 年员工数为 615–639 人；Forbes Council 资料提到「超过 600 名员工」。官方员工数未发布。除 New York City 和
              Texas 州 Austin 之外，地理存在主要依赖公司关于全球分布式员工队伍的表述。当前准确 ARR、毛利率和季度收入增长仍是私营公司指标。
