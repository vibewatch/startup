      - number: '5.4'
        title: 集成生态、API 平台与开发者界面
        blocks:
          - type: paragraph
            body: >-
              SecurityScorecard 在 securityscorecard.readme.io 提供 RESTful API，采用 token
              认证，支持六类主要集成模式：企业网络风险管理、第三方风险管理、工作流管理、网络保险承保、合规跟踪和攻击面管理。API 调用接收一个 domain 加一个 API token，返回 scorecard
              等级、因子分、问题清单、历史发现、事件、合规映射和第三方供应链数据。代码样例覆盖 Shell、Ruby、Python、PHP 等语言。API keys 不会过期，必须安全存放在应用 secrets
              中，不能放在客户端代码里。


              Integrate360° Marketplace 承载 100 多个认证伙伴集成，包括 CrowdStrike Falcon、ServiceNow、Archer、OneTrust 和
              ProcessUnity，使客户无需定制工程就能把 SecurityScorecard 数据路由进既有 GRC、工单和 SIEM 工作流。MAX 于 2025 年 5 月在 CrowdStrike
              Marketplace 支持直接购买，让 CrowdStrike Falcon 客户为安全运营增加持续供应链风险监控。Microsoft 365 Copilot 连接器目录列出 SecurityScorecard
              连接器；平台还通过 AWS Marketplace 上架和云资产扫描能力集成进 AWS 环境。


              SecurityScorecard 的 GitHub 组织（github.com/securityscorecard）有 63 个公开仓库，包括设计系统 React
              组件库（TypeScript、Apache-2.0 license、13 stars）、SSC-Threat-Intel-IoCs（与技术博客文章相关的公开 IoC 数据，75
              stars）、aws-big-data-blog Java 项目（623 stars），以及 grpc-python-microservice-template 和 consul-template
              等基础设施工具。另一个 SSCDeveloperCommunity 组织承载 hackathon 和社区集成项目。开发者活动显示工程组织活跃，但公开仓库主要是内部工具和样例代码，而非对外维护的开源项目。
