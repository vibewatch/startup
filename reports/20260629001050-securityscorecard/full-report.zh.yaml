  - id: TM001
    title: 市场边界——网络风险评级、TPRM 与相邻类别
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 主要买家 / 付款方
      - SecurityScorecard 相关性
    rows:
      - - 安全评级（核心）
        - 面向持续外部评分的订阅 SaaS；供保险 / M&A 使用的评级 API
        - 本地部署代理；内部渗透测试人力；手工问卷
        - CISO / 安全团队预算
        - 核心产品；与 BitSight 直接竞争
      - - 第三方风险管理（TPRM）
        - 供应商工作流软件、问卷自动化、VRM 门户、托管评估
        - 一次性渗透测试、纯人员服务、实体供应链审计
        - CISO / GRC / 采购预算
        - TITAN AI 平台扩张；与评级业务相邻
      - - 外部攻击面管理（EASM）
        - 外部扫描、资产发现、暴露验证工具
        - 内部 CSPM、云安全态势、网络访问控制
        - CISO / 安全工程预算
        - 既竞争也互补；SSC 评级引擎提供相关信号
      - - GRC 软件
        - 政策管理、审计工作流、风险登记册、合规报告
        - 法务 / 合同管理、纯 HR 合规工具、ERP 风险模块
        - 合规 / 风险官 / GRC 团队预算
        - 相邻需求；TPRM 买家常为 TPRM 工作流评估 GRC 平台
      - - 网络保险（技术驱动承保）
        - 以安全评级为输入的承保分析平台、网络风险量化
        - 纯保险保费、精算咨询服务
        - 保险 CTO / 承保 P&L
        - 衍生需求：保险公司授权使用 SSC 评级数据做承保
      - - 董事会 / 监管报告
        - 董事会仪表盘工具、SEC/DORA 报告自动化、高管网络风险记分卡
        - 通用企业报告、投资者关系软件
        - CISO / 合规 / 董事会秘书
        - SSC 董事会报告功能；监管要求推动采用提速
    notes: 分析师报告对范围边界分歧很大；TPRM 与 GRC 品类高度重叠。 SecurityScorecard 在评级核心和 TPRM 上竞争；在 EASM 和 GRC 上处于相邻位置。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
  - id: TM002
    title: TPRM 市场规模测算——多家分析机构视角（保留相互矛盾的估计）
    columns:
      - 发布方
      - 年份 / 期间
      - 地域
      - 市场价值
      - CAGR
      - 范围 / 方法
      - 置信度
      - 局限
    rows:
      - - Grand View Research
        - 2023 基准；2030 预测
        - 全球
        - $7.42B → $20.59B
        - 15.7%
        - TPRM 软件 + 服务；云端和本地部署；覆盖所有垂直行业
        - 中
        - 细节在付费墙后；定义比部分同业更窄
      - - SkyQuest
        - 2025 基准；2033 预测
        - 全球
        - $11.11B → $37.44B
        - 16.4%
        - TPRM 软件和托管服务；定义较宽
        - 中
        - 高位估计；未说明服务份额是否拆分
      - - Business Research Insights
        - 2026 基准；2035 预测
        - 全球
        - $10.36B → $45.98B
        - 18.2%
        - TPRM 平台和服务；包括 AI 工具
        - 低–中
        - 同业组里增长估计最高；方法未披露
      - - Research & Markets（2026 版）
        - 2025–2026 区间
        - 全球
        - $8.09B–$9.34B (2025–2026)
        - ~15.6%
        - TPRM 软件 + 服务；定义偏保守
        - 中
        - 付费墙；公开方法有限
      - - IONIX / Fortune Business Insights
        - 2024 基准；2032 预测
        - 全球
        - EASM：到 2026 年 $930.7M；更宽口径 ASM：$1.43B→$9.19B
        - EASM 17.5%；ASM 30.4%
        - EASM 专项扫描；仅外部扫描
        - 中
        - 仅覆盖 EASM；不是完整 TPRM 范围
      - - Mordor Intelligence
        - 2025 基准；2031 预测
        - 全球
        - GRC 软件：$21.04B→$23.32B (2026)→$39.01B (2031)
        - 10.84%
        - 仅 GRC 软件；包括政策、风险、审计；与 TPRM 相邻
        - 中
        - 范围比 TPRM 更宽；不是直接的 TPRM 估计
      - - Gallagher（Gallagher Re 数据库）
        - 2025F; 2026F
        - 全球
        - 网络保险保费：$16.9B (2025F)→$19.6B (2026F)
        - 同比约 16%
        - 总承保保费；代表相邻需求池
        - 高
        - 相邻市场；不是 TPRM 软件；仅用于衍生需求测算
    notes: 按范围不同，2026 年 TPRM 估计落在 $8–11B。服务与软件拆分、地域覆盖、是否纳入 AI 工具，是估计分化的主要来源。按质量政策保留相互矛盾的估计；不采用任何单一估计作为标准口径。
    enumerationScope:
      coverage: partial
      basis: >-
        Representative sample of publicly available analyst reports as of June 2026; excludes paywalled report detail
        and proprietary research not available via open web
