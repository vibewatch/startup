  - id: adjacent-substitutes
    title: Adjacent and Workflow Substitutes
    body: >-
      Beyond direct ratings peers, SecurityScorecard faces competition from GRC and workflow platforms that
      embed ratings functionality through native modules or API integrations, effectively substituting standalone
      ratings products within larger enterprise software contracts. OneTrust was named a Leader in the inaugural
      Gartner Magic Quadrant for TPRM Tools for Assurance Leaders (2026), scoring 8.4 out of 10 on Gartner Peer
      Insights with a 78% willingness-to-recommend rate. It competes strongly in privacy-adjacent and
      compliance-driven programs where GRC and TPRM are consolidated into a single vendor contract.

      ServiceNow VRM targets large enterprises with deep ITSM integration needs. While it typically requires
      specialized consulting for implementation, its installed-base scale creates bundling risk — when TPRM is
      absorbed into an existing ServiceNow contract, a standalone ratings layer is no longer needed. ProcessUnity's
      CyberGRX integration with ServiceNow delivers crowd-sourced third-party risk intelligence into existing
      ServiceNow workflows, enabling procurement teams to access peer-validated risk data without a separate
      ratings tool. Interos focuses on nth-tier supply chain visibility and vendor relationship mapping, targeting
      supply chain intelligence use cases rather than traditional outside-in ratings methodology.

      Recorded Future and Google Mandiant compete on threat intelligence that overlaps with EASM and ratings data
      in security-operations-centric programs. Incumbents such as RSA Archer and MetricStream address mature GRC
      programs that may embed ratings through integrations. All of these platforms represent pipeline threats for
      SecurityScorecard, particularly when a buyer is already standardized on a large enterprise software stack
      and needs only marginal ratings capability. The Gartner TPRM MQ naming five GRC-category Leaders with no
      traditional ratings vendor among them signals that the workflow layer may commoditize the ratings layer over
      time, drawing budget away from standalone products.
    claimRefs:
      - CP021
      - CP022
      - CP023
      - CP024
