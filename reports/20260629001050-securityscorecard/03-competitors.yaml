  - id: win-loss-dynamics
    title: Win/Loss Dynamics by Buyer Segment and Geography
    body: >-
      SecurityScorecard wins most reliably in large enterprise accounts where broad supply-chain vendor coverage,
      regulatory defensibility (SEC 10-K, NIS2, DORA disclosures), and insurance integration are the primary
      buying criteria. Enterprise CISOs managing thousands of vendors across global supply chains — who need
      a ratings provider whose scores are accepted by insurers and auditors — represent SecurityScorecard's
      clearest win profile. The Aon and Willis integrations create downstream channel pull: when an insurer
      quotes cyber coverage using SecurityScorecard data, the insured organization has a natural incentive to
      adopt the platform for proactive score improvement and remediation tracking.

      Losses concentrate in mid-market accounts and in deals where integrated workflow, ease of deployment,
      and total cost of ownership dominate over ratings breadth. UpGuard wins mid-market deals where buyers
      want a bundled questionnaire-plus-ratings experience at a more accessible price point. Panorays wins
      where AI-driven supply-chain mapping and multi-tier visibility are the primary differentiator. BitSight
      wins in financial services and insurance where its Moody's-backed statistical methodology is the
      recognized industry standard for insurance risk modeling. Geographic differentiation is difficult to
      verify from public sources; SecurityScorecard's multi-language platform (including 2026 Korean language
      support) and global ratings footprint signal active international expansion, but revenue concentration by
      region is not publicly disclosed. In procurement evaluations that include analyst scorecards, Forrester's
      Q2 2026 designation of BitSight and Panorays as Leaders may shift enterprise shortlists, requiring
      SecurityScorecard to defend based on unique use-case strengths rather than analyst parity. The emergence
      of large-suites bundling is an additional structural risk: if an enterprise standardizes on OneTrust or
      ServiceNow, a ratings module in the contract displaces the need for a standalone SecurityScorecard
      subscription.
    claimRefs:
      - CP039
      - CP040
      - CP041
      - CP042
      - CP043

