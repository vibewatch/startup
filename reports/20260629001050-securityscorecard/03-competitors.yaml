callouts:
  - calloutType: risk
    title: Forrester Wave Absence Is a Mid-Cycle Sales Liability
    body: >-
      SecurityScorecard was not designated a Leader in the Forrester Wave Q2 2026 for Cybersecurity Risk
      Ratings, while BitSight and Panorays were. In enterprise procurement cycles where analyst shortlists
      drive vendor selection, this absence will require sales teams to invest additional effort in justification.
      Combined with BitSight's 30% YoY insurance-segment growth in H1 2026, the competitive pressure in
      SecurityScorecard's most defensible verticals — financial services and insurance — is materially
      increasing.
    claimRefs:
      - CP037
      - CP041

  - calloutType: strength
    title: Insurance Ecosystem Lock-In Is a Durable Moat
    body: >-
      SecurityScorecard's embedded integrations with Aon and Willis create a demand-chain moat where insurers
      quote using SSC data, incentivizing insureds to adopt the platform proactively. This bidirectional
      embedding is difficult for pure-play competitors to replicate without equivalent insurer partnerships. No
      direct competitor currently matches both the Aon and Willis depth of integration simultaneously, creating
      a sticky distribution channel and a natural buyer acquisition funnel through insurance workflows.
    claimRefs:
      - CP031
      - CP032

  - calloutType: insight
    title: GRC Platform Bundling Is the Structural Long-Term Threat
    body: >-
      The most significant long-term competitive threat to SecurityScorecard may not come from BitSight or
      UpGuard, but from large GRC platform vendors (OneTrust, ServiceNow, Archer) that bundle ratings
      functionality through API integrations at scale. When a large enterprise standardizes on OneTrust or
      ServiceNow, a ratings module in the contract can displace the need for a standalone SecurityScorecard
      subscription. The inaugural Gartner TPRM MQ 2026 naming five GRC-category Leaders — none of which are
      traditional ratings vendors — is an early market signal of this consolidation trajectory.
    claimRefs:
      - CP022
      - CP027
      - CP043

