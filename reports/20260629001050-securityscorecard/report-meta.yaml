companyProfile:
  summary: >
    SecurityScorecard was founded in 2013 by Dr. Aleksandr Yampolskiy and Sam Kassoumeh and is headquartered
    in New York City. The company created the cybersecurity security ratings category and now sells a broader
    Supply Chain Detection and Response (SCDR) platform spanning continuous external ratings, third-party risk
    management workflows, attack surface management, AI-powered questionnaire automation (TITAN AI), and
    managed security services (MAX). Public evidence supports a strategically relevant business with more than
    $150M ARR, positive free cash flow, 3,300+ enterprise customers, and deep penetration into Fortune 100
    and government accounts; however, the public record still lacks audited operating data, NRR, gross margin,
    and a current funding event — and secondary market pricing implies material compression from the 2021
    $1B unicorn round.
  foundedDate: "2013-07-01"
  founders:
    - name: Dr. Aleksandr Yampolskiy
      role: Co-founder and CEO
      background: >
        Ph.D. in Cryptography from Yale University; prior CISO at Gilt Groupe and CTO at Cinchcast/BlogTalkRadio;
        founding motivation was direct experience managing vendor risk as enterprise CISO.
      claimRefs: [CO011, CO012, CO019]
    - name: Sam Kassoumeh
      role: Co-founder, Head of Product, and Board Member
      background: >
        Co-founder and product leader; remains active at the company in product and governance capacity.
      claimRefs: [CO013]
  foundingLocation: New York City, New York, USA
  headquarters: New York, New York, USA (1140 Avenue of the Americas, 19th Floor)
  productSummary: >
    SecurityScorecard's platform delivers continuous outside-in security ratings for 12M+ monitored
    organizations, vendor risk management (TPRM) workflows, external attack surface management, TITAN AI
    questionnaire automation (reducing manual assessment workload by 92%), and MAX managed detection and
    response delivered through certified service partners. Core product is a patented A-to-F scoring engine
    across ten risk factor groups requiring no agent or vendor participation.
  customerFocus: >
    Large enterprises (53% of evaluators have 1,000+ employees), financial services firms (12% of
    PeerSpot sessions), Fortune 100 and government entities, cyber insurers, and private equity. Over 3,300
    direct customers and 70,000 organizations across the free-tier monitored universe.
  businessModel: >
    Annual SaaS subscriptions for security ratings and TPRM platform access, with add-on modules for attack
    surface intelligence, cyber risk quantification, and AI automation; partner-delivered MAX managed services
    with channel ARR growing 160% YoY; insurance data licensing and federal government (FedRAMP Ready) contracts.
  stage: Series E (private unicorn; no new primary round since March 2021)
  fundingStatus: >
    Seven rounds totaling approximately $293M, culminating in a $180M Series E in March 2021 at a $1B
    post-money valuation. Backed by Silver Lake Waterman, Sequoia Capital, T. Rowe Price, GV, Evolution
    Equity Partners, Kayne Anderson Rudnick, and others. No IPO plans or new equity rounds disclosed as
    of June 2026; company is operating on Series E capital stack for 5+ years. Positive free cash flow
    signal suggests self-sustaining operations.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO006, CO011, CO012, CO013, CO024, CO026, CO027, CO029, CO031, CO033, CU001]
summary:
  headline: >
    SecurityScorecard is a category-defining cyber risk ratings platform with real enterprise scale and
    strong strategic positioning, but a five-year-stale $1B valuation, secondary market compression to
    $360–$470M, and undisclosed NRR and gross margin make this a track recommendation pending economic
    validation.
  overallScore: 6.1
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: 150
    arrUsdM: 150
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 293
    customerCount: 3300
    headcount: 627
  topStrengths:
    - SecurityScorecard created the security ratings category and now operates a broader SCDR platform covering ratings, TPRM, attack surface management, AI-powered questionnaire automation, and managed services — giving it genuine breadth and cross-sell surface across 3,300+ enterprise customers.
    - Commercial scale is meaningful and directionally positive — $150M+ ARR floor, positive free cash flow, 40% ARR-per-FTE improvement YoY, triple-digit MAX growth, 160% channel ARR growth, 70% Fortune 100 penetration, and 10+ consecutive quarters of revenue growth.
    - Structural regulatory tailwinds (NIS2, DORA, SEC cyber-disclosure rules) convert TPRM from a discretionary tool to a compliance requirement, expanding the addressable market and increasing switching costs for compliance-oriented buyers.
    - FedRAMP Ready and StateRAMP designations open the U.S. federal and state procurement market, and CISA recognition as a free cyber tool adds a unique non-commercial distribution channel for enterprise conversion.
  topRisks:
    - The $1B March 2021 Series E valuation is five years stale; secondary market platforms imply an enterprise value of $360–$470M (53–64% discount), and the gap cannot be reconciled without a new funding event or disclosed financials.
    - Gross margin, NRR, burn rate, and trailing ARR growth rate are not publicly disclosed, preventing confident underwriting; without NRR above 100%, expansion economics are unverifiable.
    - Moody's-backed BitSight holds the highest strategy score in the Forrester Wave Q2 2026 and is positioned as the credit-ratings-adjacent standard in banking and insurance, creating a durable competitive threat in SecurityScorecard's core verticals.
    - The outside-in ratings methodology is structurally prone to false positives, asset misattribution, and vendor contestation — a ceiling that competitors exploit in sales cycles and that regulators may tighten with prescriptive accuracy requirements.
    - Key-person risk is materially concentrated in CEO Dr. Yampolskiy, who is the primary public face, co-inventor of the core patent portfolio, and the company's most visible commercial asset.
  unresolvedGaps:
    - NRR by cohort and tier — the single most important missing metric for assessing growth quality and underwriting expansion value.
    - Gross margin by product line (core SaaS vs. MAX managed services vs. TITAN AI) to assess margin trajectory as faster-growing managed-service layers scale.
    - Current ARR as of June 2026 — the $150M+ figure is 8+ months stale and was disclosed in a lawsuit settlement context rather than a standalone financial release.
    - Fully diluted cap table, liquidation preferences, protective provisions, and any secondary market transaction details that affect return math for a prospective investor.
    - Audited financial statements, cash balance, debt schedule, and burn rate to verify the positive free cash flow claim and assess runway at current growth rates.
    - Exact headcount by function, sales productivity metrics, and new ARR per sales-and-marketing dollar to assess selling efficiency as the channel mix shifts.
disclaimer: >
  This report is produced for diligence and informational purposes only and does not constitute investment,
