coverageNotes: >
  This report is based on public sources available as of 2026-06-29, including SecurityScorecard product and
  customer pages, press releases, SEC-adjacent state filings, third-party market data, secondary market pricing
  services, and public review platforms. SecurityScorecard is a private company and does not publish audited
  financial statements, NRR, gross margin, or a current financing process. The $150M+ ARR figure was disclosed
  in October 2025 as part of a lawsuit settlement announcement rather than a standalone investor communication,
  limiting its auditability. The $1B valuation is from the March 2021 Series E and is five years stale;
  secondary market platforms imply a substantially compressed enterprise value of $360–$470M as of June 2026.
  Headcount estimates from third-party aggregators range from 615 to 639 employees; no official figure is
  published. This report treats the 3,300+ customer figure as the canonical paying-customer floor, consistent
  with the March 2026 TITAN AI press release; the 70,000-organization figure refers to the broader monitored
  universe and is not a paying-customer count.
