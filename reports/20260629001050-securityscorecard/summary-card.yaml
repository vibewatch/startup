summary:
  headline: >
    SecurityScorecard is a category-defining cyber risk ratings platform with real enterprise scale and strong strategic
    positioning, but a five-year-stale $1B valuation, secondary market compression to $360–$470M, and undisclosed NRR
    and gross margin make this a track recommendation pending economic validation.
