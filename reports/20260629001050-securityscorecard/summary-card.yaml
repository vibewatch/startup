  topStrengths:
    - >-
      SecurityScorecard created the security ratings category and now operates a broader SCDR platform covering ratings,
      TPRM, attack surface management, AI-powered questionnaire automation, and managed services — giving it genuine
      breadth and cross-sell surface across 3,300+ enterprise customers.
    - >-
      Commercial scale is meaningful and directionally positive — $150M+ ARR floor, positive free cash flow, 40%
      ARR-per-FTE improvement YoY, triple-digit MAX growth, 160% channel ARR growth, 70% Fortune 100 penetration, and
      10+ consecutive quarters of revenue growth.
    - >-
      Structural regulatory tailwinds (NIS2, DORA, SEC cyber-disclosure rules) convert TPRM from a discretionary tool to
      a compliance requirement, expanding the addressable market and increasing switching costs for compliance-oriented
      buyers.
    - >-
      FedRAMP Ready and StateRAMP designations open the U.S. federal and state procurement market, and CISA recognition
      as a free cyber tool adds a unique non-commercial distribution channel for enterprise conversion.
  topRisks:
    - >-
      The $1B March 2021 Series E valuation is five years stale; secondary market platforms imply an enterprise value of
      $360–$470M (53–64% discount), and the gap cannot be reconciled without a new funding event or disclosed
      financials.
    - >-
      Gross margin, NRR, burn rate, and trailing ARR growth rate are not publicly disclosed, preventing confident
      underwriting; without NRR above 100%, expansion economics are unverifiable.
    - >-
      Moody's-backed BitSight holds the highest strategy score in the Forrester Wave Q2 2026 and is positioned as the
      credit-ratings-adjacent standard in banking and insurance, creating a durable competitive threat in
      SecurityScorecard's core verticals.
    - >-
      The outside-in ratings methodology is structurally prone to false positives, asset misattribution, and vendor
      contestation — a ceiling that competitors exploit in sales cycles and that regulators may tighten with
      prescriptive accuracy requirements.
    - >-
      Key-person risk is materially concentrated in CEO Dr. Yampolskiy, who is the primary public face, co-inventor of
      the core patent portfolio, and the company's most visible commercial asset.
  unresolvedGaps:
    - >-
      NRR by cohort and tier — the single most important missing metric for assessing growth quality and underwriting
      expansion value.
    - >-
      Gross margin by product line (core SaaS vs. MAX managed services vs. TITAN AI) to assess margin trajectory as
      faster-growing managed-service layers scale.
    - >-
      Current ARR as of June 2026 — the $150M+ figure is 8+ months stale and was disclosed in a lawsuit settlement
      context rather than a standalone financial release.
    - >-
      Fully diluted cap table, liquidation preferences, protective provisions, and any secondary market transaction
      details that affect return math for a prospective investor.
    - >-
      Audited financial statements, cash balance, debt schedule, and burn rate to verify the positive free cash flow
      claim and assess runway at current growth rates.
    - >-
      Exact headcount by function, sales productivity metrics, and new ARR per sales-and-marketing dollar to assess
      selling efficiency as the channel mix shifts.
