    title: SecurityScorecard Customer Journey — Entry Points and Expansion Path
    type: journey-map
    layout: wide
    summary: >-
      Maps the customer journey from initial discovery through multi-module expansion, illustrating how the free
      tier, partner channel, and insurance integrations create multiple parallel acquisition paths converging on enterprise ARR.
    data:
      items:
        - label: Discover (free scorecard or insurance touchpoint)
          description: "Organization views its own free scorecard or encounters SSC data in Aon CyQu cyber insurance or vendor risk context"
        - label: Trial / Free Tier
          description: "Free account: domain scorecard, pre-built dashboards, questionnaire response, and basic report creation at no cost"
        - label: Evaluate and Shortlist
