        - SSC's dispute portal lets organizations flag and remove misattributed findings; response claimed within 24 hours
      - - Pricing friction for mid-market/SMB
        - $1,000/month mid-tier pricing cited as unaffordable; $400/month starter added in late 2024 but limits features
        - PeerSpot reviews; neutral-adverse
        - Low-Medium — limits TAM expansion below enterprise; not core customer concentration risk
