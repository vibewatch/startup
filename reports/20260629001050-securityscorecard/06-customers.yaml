  - id: adverse-evidence-friction
    title: Adverse Evidence and Adoption Friction
    body: >-
      Independent review platforms and direct competitors surface four categories of adoption friction that constrain
      SecurityScorecard's expansion and retention potential. The first is methodology opacity: Black Kite, a direct competitor,
      characterizes SecurityScorecard's scoring as having "moderate" transparency with "black box" elements — limited visibility
      into underlying data sources and calculation logic compared to Black Kite's standards-aligned open methodology. In the
      April 2026 Forrester Wave for Cybersecurity Risk Ratings Platforms, SecurityScorecard received a score of 1 out of 5 on
      AI capabilities and customer AI adoption — a below-par result relative to peers like Black Kite (which scored 5/5 in
      the same category). This Forrester finding is particularly significant given that SecurityScorecard launched TITAN AI in
      March 2026, suggesting the platform's AI capabilities were not yet mature enough at evaluation time to earn top-tier marks.


      The second friction point is false-positive attribution: both G2 and AuditXYZ reviewers cite instances where SecurityScorecard
      incorrectly attributes vulnerabilities to an organization after a corporate acquisition — the acquiring company's score can be
      dragged down by subsidiaries' issues that are not yet operationally integrated. Resolving these disputes requires the rated
      organization to submit counter-evidence, which shifts the burden of proof onto the customer. The third is pricing friction:
      PeerSpot reviewers note that the $1,000/month mid-tier pricing is unaffordable for smaller organizations, and even the
      recently introduced $400/month starter tier has limitations. Some South American and European customers face additional
      tax and wire-transfer surcharges that effectively raise the cost. The fourth is service-quality regression: Capterra
      reviewers note that after organizational changes, some long-term customers experienced reduced personalization and slower
      support responsiveness. These issues represent real friction in renewal conversations, especially for customers without
      dedicated enterprise success managers.
    claimRefs:
      - CU036
      - CU037
      - CU038
      - CU039
      - CU040
      - CU041

