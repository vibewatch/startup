  - id: partner-ecosystem-expansion
    title: Partner Ecosystem, Expansion Drivers, and Concentration Risk
    body: >-
      SecurityScorecard's land-and-expand motion operates through two reinforcing mechanisms. The first is product upsell: a
      customer who starts with self-monitoring (free tier or basic paid) can progressively add vendor monitoring portfolios,
      questionnaire automation (TITAN Assess), threat-informed TPRM (TITAN Secure), and ultimately migrate to MAX managed
      services — each transition represents a meaningful ARR increase. The second is channel leverage: the SCORE Partner Program
      and MAX Service Delivery framework allow MSSPs, consulting firms (KPMG Canada, Crowe LLP), and technology integrators to
      bundle SecurityScorecard within managed security offerings, pulling new enterprise logos into the base without direct
      SecurityScorecard sales capacity. The 600+ global partners and 160% channel ARR growth in 2025 confirm that indirect
      sales is now the faster-growing vector.


      Insurance sector integration with Aon represents a unique structural expansion driver: Aon clients who use CyQu receive
      SecurityScorecard data as a baseline assessment — creating an indirect pipeline of organizations that encounter the
      product before becoming direct customers. Similarly, SecurityScorecard's listing as a CISA free tool drives awareness
      and trial among U.S. government and critical infrastructure operators who may convert to paid enterprise subscriptions.
      Macnica's Japan distribution partnership demonstrates geographic concentration risk mitigation: a single high-performing
      in-country distributor that won Partner of the Year Japan for 2025 now owns the primary go-to-market in a market with
      complex enterprise procurement requirements.


      Concentration risk is present but not acute at the customer level: no single named customer dominates disclosed revenue.
      Channel concentration risk is more material — if the MAX partner ecosystem or the Aon integration were disrupted, the
      primary growth vectors could be significantly impaired. The rapid acceleration of channel ARR also means that direct
      enterprise retention data becomes increasingly hard to observe as more revenue runs through partner relationships.
    claimRefs:
