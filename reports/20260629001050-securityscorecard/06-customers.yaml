  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: NRR-retention
      missingEvidence: >-
        SecurityScorecard's net revenue retention (NRR), gross revenue retention (GRR), and cohort-level churn data.
        No public filing, press release, or credible third-party source discloses these figures.
      whyItMatters: >-
        NRR is the primary metric for modeling organic revenue growth durability in a subscription business. Without it,
        valuation underwriting relies entirely on forward-looking revenue projections without a base-rate anchor for
        existing-customer behavior.
      diligencePath: >-
        Request NRR/GRR by customer segment (direct vs. channel, enterprise vs. mid-market) in a formal data room;
        cross-reference with renewal contract terms and logo churn rates.
      relatedQuestionRefs:
        - QU020

    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Publicly verifiable named customer proof beyond the six cases documented. The broader 3,300+ customer base
        includes healthcare, retail, and government agency customers not represented in the public case study library.
      whyItMatters: >-
        Without named customer proof in regulated verticals (healthcare, government agencies, retail), the quality of
        ICP claims for those segments cannot be independently assessed, creating concentration risk in the evidence base.
      diligencePath: >-
        Request a reference list of five or more named enterprise customers in healthcare, government, and financial
        services with direct contact authorization; supplement with Gartner Peer Insights review filter by vertical.
      relatedQuestionRefs:
        - QU022
        - QU005
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: regulated-industry-adoption-friction
      missingEvidence: >-
        Specific adoption friction data for regulated industries with strict data sovereignty requirements (e.g., EU GDPR,
        Japanese METI guidelines, DORA in financial services) and how these affect SecurityScorecard's go-to-market.
      whyItMatters: >-
        DORA and NIS2 create new compliance obligations in Europe; Japanese supply chain regulations require specific
        localization capabilities. Friction in these markets could cap international expansion.
      diligencePath: >-
        Obtain SecurityScorecard's regulatory compliance documentation for EU/DORA alignment and Japan METI
        compliance; interview Macnica on Japanese enterprise procurement barriers.
      relatedQuestionRefs:
        - QU027

    - type: missing-source
      severity: minor
      topic: customer-size-vertical-mix
      missingEvidence: >-
        Breakdown of SecurityScorecard's 3,300+ customer base by size segment (SMB, mid-market, enterprise) and
        vertical (financial services, healthcare, government, insurance, technology). No public filing or analyst report
        provides this granular mix as of 2026.
      whyItMatters: >-
        Vertical mix alignment with stated ICP (enterprise, regulated industries) is a key indicator of product-market fit
        and pricing power. Without it, claims of enterprise-heaviness cannot be independently verified.
      diligencePath: >-
        Request customer mix by ARR band and vertical in the data room; cross-reference with Gartner Peer Insights
        vertical filter and representative customer references from each major vertical.
      relatedQuestionRefs:
        - QU019

    - type: private-evidence-only
      severity: minor
      topic: channel-concentration-revenue-mix
      missingEvidence: >-
        Channel ARR as a percentage of total ARR, and the revenue concentration among the top ten MAX partner
        relationships, are not publicly disclosed.
      whyItMatters: >-
        If the majority of new ARR flows through a small number of MAX Service Delivery partners (e.g., Aon), a
        partner defection could cause a disproportionate impact on growth, making the channel structure opaque
        for revenue modeling.
      diligencePath: >-
        Request channel vs. direct ARR split and partner Herfindahl index in diligence session; obtain top-10
        partner revenue concentration data and renewal terms.
      relatedQuestionRefs:
        - QU011

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TU001 contains qualitative assessments of vertical strategic value and evidence quality grades that are
      derived from case study analysis and review data rather than invented figures; notes field adequately
      describes the estimation basis and data sources used.
