callouts:
  - calloutType: strength
    title: Fortune 100 Penetration and Enterprise Lock-In Create Durable Revenue Base
    body: >-
      SecurityScorecard's 70% Fortune 100 penetration as of February 2026, combined with multi-workflow embedding in organizations
      like Hershey (TPRM, incident response, SOC, M&A) and UNICC (cross-agency security), signals that the product is not a
      point solution but an operational fabric in leading enterprises' security stacks. The 3,007 reference ratings at 4.8/5
      on FeaturedCustomers and 100% plan-to-renew on SoftwareReviews suggest that visible churn pressure is minimal among the
      named reference base. Channel ARR growth of 160% YoY via the SCORE Program extends the enterprise flywheel through 600+
      managed service partners without proportional sales cost.
    claimRefs:
      - CU001
      - CU002
      - CU011
      - CU014
      - CU025

  - calloutType: risk
    title: Undisclosed NRR, Forrester AI Score of 1/5, and False-Positive Friction Are Material Risks
    body: >-
      Three compounding risks deserve diligence priority. First, SecurityScorecard discloses no NRR, GRR, or cohort retention
      data — making it impossible to model organic revenue durability without private company financials. Second, the April 2026
      Forrester Wave scored the platform 1/5 on AI capabilities and customer AI adoption, a significant credibility gap for a
      company actively marketing TITAN AI as its next growth platform. Third, repeated false-positive attribution complaints
      (especially post-acquisition) represent a structural vulnerability in the TPRM use case, where inaccurate vendor scores
      can trigger costly remediation workflows or damage vendor relationships. These risks are amplified by the company's
      channel-led growth model, which makes retention quality increasingly opaque as more ARR runs through partner relationships.
    claimRefs:
      - CU027
      - CU037
      - CU038
      - CU039

  - calloutType: insight
    title: Insurance Integration Is a Structural Expansion Moat — and a Single-Point Concentration Risk
    body: >-
      The Aon integration is strategically significant: by embedding SecurityScorecard data into Aon's CyQu underwriting
      platform across 120+ countries, SecurityScorecard becomes an indirect prerequisite for organizations seeking favorable
      cyber insurance terms through Aon. This creates a structural demand flywheel — organizations rated poorly are incentivized
      to remediate and improve their scores, deepening engagement. However, the reverse risk is equally significant: if Aon
      terminates or displaces this integration, a major acquisition pipeline and validation channel disappears. The WTW
      (Willis Towers Watson) alliance adds a second insurer relationship, but the overall model remains concentrated in a few
      institutional insurance partners whose own competitive dynamics are volatile.
    claimRefs:
      - CU020
      - CU029
      - CU031
      - CU035

