        - Gartner Peer Insights support score (4.7/5) suggests enterprise-tier customers experience higher service quality
    notes: "Adverse findings are sourced from independent review platforms and a competitor comparison page. Competitor-sourced claims (Black Kite) carry inherent bias; Forrester citation is used by Black Kite but Forrester's Wave report is an independent primary source. SSC mitigants are company-stated."
