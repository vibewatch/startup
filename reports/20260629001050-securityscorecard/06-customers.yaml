  - id: named-customer-proof
    title: Named Customer Proof and Production Deployment Quality
    body: >-
      SecurityScorecard's publicly available named customer library includes production-grade deployments across five distinct
      customer archetypes: international public-sector institution, global consumer brand, European private equity, media agency,
      and cyber insurance integrator. The United Nations International Computing Centre (UNICC) provides the highest-quality
      evidence: a four-page case study with named senior administrator Alejandro Bustos, documented deployment across 80+ UN
      agencies, a specific DNS-incident use case resolved via automated alerting, and a 70-75% time savings figure on cybersecurity
      operations. The Hershey Company case study features Phil Addison (Manager of Third-Party Cyber Risk Management) confirming
      100% cyber visibility across the full third-party landscape — including vendors not assessed via questionnaire — and
      integration into incident response, vulnerability management, and M&A due diligence workflows. Both cases verify production
      status rather than pilot deployments.


      Verdane, the European growth-equity firm, demonstrates the private-equity use case: SecurityScorecard provides portfolio-wide
      cyber due diligence across 100+ companies without deploying external consultants, enabling a lean in-house cybersecurity
      capability. Horizon Media achieved an "A" security rating and uses SecurityScorecard as an external trust signal in
      client-facing sales conversations — a documented use case where the platform functions as a customer acquisition tool for the
      rated organization. The Aon integration represents institutional proof at the insurance-sector level: Aon embedded
      SecurityScorecard's outside-in capabilities into its CyQu underwriting platform, making SecurityScorecard data a standard
      input in Aon clients' cyber insurance processes across more than 120 countries.


      Reference quality across these cases is strong: all are named, most include specific operational metrics, and all confirm
      production deployment. However, the customer library covers a relatively narrow set of verticals — healthcare, retail, and
      government agencies outside the UN system are underrepresented among public case studies, creating an evidence gap for
      those segments.
    claimRefs:
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
