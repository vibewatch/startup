company:
  name: SecurityScorecard
chapter:
  number: 1
  title: Company Overview
  summary: >-
    SecurityScorecard is a New York-based, venture-backed cybersecurity company that pioneered the security ratings category in 2013
    and has grown into a unicorn serving over 3,300 enterprise customers, including 70% of the Fortune 100. Founded by Dr. Aleksandr
    Yampolskiy and Sam Kassoumeh, the company raised $293M across seven rounds through its March 2021 Series E at a $1B valuation,
    exceeded $150M ARR by October 2025, and in March 2026 launched TITAN AI — an AI-accelerated TPRM platform — at RSA Conference.
    Key diligence considerations include key-person risk concentrated in CEO Yampolskiy, limited public financial disclosure beyond the
    $150M+ ARR signal, and a 2024 trade secret lawsuit against Safe Security that was resolved out of court in October 2025.

sections:
  - id: identity-platform
    title: Identity, Mission, and Platform
    body: >-
      SecurityScorecard, Inc. is a privately held, Delaware-incorporated cybersecurity company headquartered at 1140 Avenue of the
      Americas, 19th Floor, New York, NY 10036, with a secondary office in Austin, Texas, and a globally distributed workforce.
      The company was founded in 2013 by Dr. Aleksandr Yampolskiy and Sam Kassoumeh and formally incorporated in New York on
      July 17, 2014 (Document No. 4607959 per the New York Department of State). It remains private with unicorn status from the
      March 2021 Series E at a $1B post-money valuation. The company's stated mission is to make the world safer by transforming
      how organizations understand, mitigate, and communicate cybersecurity risk to their boards, employees, and vendors.


      The platform's core product is a patented security ratings engine that collects externally observable signals — internet
      scanning, DNS health, IP reputation, network configuration, and endpoint observations — and aggregates them into A-to-F
      letter scores across ten risk factor groups, requiring no on-premises agent or vendor-submitted questionnaire. This "outside-in"
      approach allows SecurityScorecard to continuously rate millions of organizations without their knowledge or consent. From
      that ratings foundation, the company has expanded into a broader Supply Chain Detection and Response (SCDR) platform covering
      vendor risk management (TPRM), external attack surface management, self-monitoring, board reporting, cyber insurance
      underwriting, M&A due diligence, threat intelligence, and digital forensics and incident response. The March 2026 TITAN AI
      launch further extends the platform with AI-accelerated questionnaire automation and threat-informed remediation workflows.
      SecurityScorecard is recognized by CISA as a free cyber tool and service, and as of March 2026 the platform continuously
      rates over 12 million organizations globally.
    claimRefs:
