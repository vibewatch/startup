  - id: adverse-litigation-risks
    title: Adverse Events, Litigation, and Risk Considerations
    body: >-
      The most significant adverse event in SecurityScorecard's history is the June 2024 trade secret lawsuit against Safe
      Security and former employee Mary Polyakova (case 1:24-cv-04240, S.D.N.Y., Judge Edgardo Ramos presiding). SecurityScorecard
      alleged that Polyakova, a senior sales executive who spent four years in its sales organization, emailed the "Master East
      List" and "CISO Prospect Lists" — confidential customer and prospect data valued at more than $40M — to her personal account
      before joining Safe Security as VP of Central Sales in May 2024. The complaint further alleged that Safe Security used fake
      accounts and shell domains to access the SecurityScorecard platform for competitive intelligence and conducted fake job
      interviews with SecurityScorecard employees to extract proprietary business information. SecurityScorecard said it had
      invested more than $200M in developing its customer and prospect base.


      During the litigation, Safe Security's CEO Saket Modi publicly countered that SecurityScorecard and comparable competitors
      were "laying off significant portions of their teams because of the poor performance of their business." This claim —
      originating from an adverse party in active litigation — has not been independently confirmed by WARN Act filings, workforce
      aggregator data, or independent news reporting for 2024-2026. SecurityScorecard disputed it. Both companies resolved the
      dispute in October 2025 and announced a mutual research collaboration in cyber risk management, ending the litigation before
      trial. No other material lawsuits, regulatory enforcement actions, or sanctions have been found in accessible public records
      as of the run date.
    claimRefs:
      - CO049
      - CO050
      - CO051
      - CO052
      - CO053
      - CO054

