    data:
      nodes:
        - id: ext-signals
          label: External Observable Signals
          detail: Internet scanning, DNS health, IP reputation, network configuration, endpoint observations — collected without agent or questionnaire.
        - id: ratings-engine
          label: Proprietary Ratings Engine
          detail: Patented A-to-F scoring across ten risk factor groups; continuously updated; no active participation required from rated entities.
        - id: scdr-platform
          label: SCDR + TITAN AI Platform
          detail: Supply Chain Detection and Response platform with AI-accelerated TPRM (TITAN Watch, Assess, Secure), MAX managed services, DFIR, and threat intelligence.
        - id: use-cases
          label: Use Cases
          detail: Vendor risk management, self-monitoring, board reporting, cyber insurance underwriting, M&A due diligence, attack surface management, and incident response.
        - id: customers
          label: 3,300+ Enterprise Customers
