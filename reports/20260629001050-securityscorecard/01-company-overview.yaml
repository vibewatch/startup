  evidenceGaps:
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: Full current board roster with all director names, institutional affiliations, committee assignments, and independence designations.
      whyItMatters: Board composition and governance quality are key inputs to assessing fiduciary oversight of a private company at unicorn scale; partial board visibility prevents a complete governance risk assessment.
      diligencePath: Request formal board composition disclosure during due diligence; review board consent minutes or investor rights agreement that identifies board seat holders per series.
      relatedQuestionRefs:
        - QO006
      relatedTableRefs:
        - TO002

    - type: private-evidence-only
      severity: minor
      topic: headcount
      missingEvidence: Official headcount figure from SecurityScorecard directly or from a regulatory filing such as a state employment report or federal WARN Act submission.
      whyItMatters: Headcount is a proxy for operational scale, burn rate estimation, and revenue-per-employee benchmarking; current estimates from aggregators range 615-639 and may be materially stale.
      diligencePath: Request HR data room disclosure or check any regulatory filing that contains employment counts; cross-reference LinkedIn active employees and job posting velocity.
      relatedQuestionRefs:
        - QO010

    - type: conflicting-data
      severity: material
      topic: competitive-positioning
      missingEvidence: Independent head-to-head capability comparison with BitSight and other security ratings competitors, including methodology audit, data source overlap, false-positive rates, and rating stability studies.
      whyItMatters: SecurityScorecard competes directly with BitSight (a $2.4B Moody's-backed platform) and multiple other TPRM vendors; without independent comparative data, claims of platform superiority cannot be verified and market share estimates are unreliable.
      diligencePath: Commission a Forrester or Gartner comparative evaluation; review independent rating accuracy studies from academic or industry researchers; interview reference customers who evaluated both platforms.
      relatedQuestionRefs:
        - QO022

    - type: missing-source
      severity: material
      topic: ratings-methodology
      missingEvidence: Independent audit or credible external review of SecurityScorecard's rating methodology accuracy, coverage bias, false-positive rate, and appeal process effectiveness.
      whyItMatters: The platform's core value proposition rests on ratings accuracy; if methodology is flawed or systematically biased, it creates regulatory risk, customer churn risk, and potential liability for rated organizations that act on incorrect scores.
      diligencePath: Search for published academic critiques of security rating platforms; review FTC and SEC comment letters on cybersecurity ratings; request SSC's own methodology white papers and examine Policy Review Board processes.
      relatedQuestionRefs:
        - QO026

    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: Audited or independently verified ARR, gross margin, net revenue retention, and revenue growth rate figures beyond the $150M+ October 2025 self-disclosure.
      whyItMatters: The single ARR signal comes from a joint press release in a specific litigation-resolution context; without audited financials or investor-deck data, commercial trajectory and unit economics cannot be assessed for valuation purposes.
      diligencePath: Request audited financial statements and board deck during data room access; cross-reference with investor communications for ARR trend data; benchmark headcount-to-ARR ratio against public SaaS comparables.
      relatedQuestionRefs:
        - QO009

    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: Full capitalization table including all investor ownership percentages, preferred share class terms, liquidation preferences, anti-dilution provisions, and secondary transaction activity for all 29 reported investors.
      whyItMatters: Ownership concentration, preferred liquidation preferences, and investor veto rights materially affect exit economics and governance control at this late stage; PitchBook reports 29 total investors but ownership data is not public.
      diligencePath: Request cap table and investor rights agreement during data room access; cross-reference with any EDGAR filings or state-level securities disclosures; review Series E term sheet if available.
      relatedTableRefs:
        - TO003

    - type: missing-source
      severity: minor
      topic: operational-milestones
      missingEvidence: Complete timeline of minor product launches, sub-releases, internal operational milestones, and partnership events not captured in public press releases between 2013 and 2026.
      whyItMatters: Gaps in the milestone record may obscure strategic pivots, failed product lines, or unreported partnerships that could affect competitive positioning assessments.
      diligencePath: Review internal product roadmap documents and board deck milestone slides during data room access; cross-reference with LinkedIn product announcements and patent filings.
      relatedTableRefs:
        - TO004

