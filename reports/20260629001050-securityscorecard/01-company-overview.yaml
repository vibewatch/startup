callouts:
  - calloutType: strength
    title: Platform Network Effects and Market Penetration
    body: >-
      SecurityScorecard's ability to continuously rate 12 million+ organizations creates a data moat — the more organizations are
      monitored, the richer the benchmarking data for each paying customer's vendor risk program. The 70% Fortune 100 penetration
      rate demonstrates that the platform has crossed the enterprise adoption threshold where procurement and legal teams reference
      SSC scores as a standard due diligence input, reinforcing the network effect cycle.
    claimRefs:
      - CO007
      - CO008
      - CO004

  - calloutType: risk
    title: Key-Person Risk and Private Financial Opacity
    body: >-
      Dr. Yampolskiy's dual role as CEO, public brand, and core IP co-inventor represents the most concentrated operational risk.
      No succession plan is publicly disclosed. Combined with the absence of audited financials, undisclosed headcount, and a last
      official valuation that is five years stale, the diligence risk profile is higher than typical for a company at this
      commercial scale. The $150M+ ARR signal from October 2025 is directionally useful but insufficient for a full commercial
      assessment.
    claimRefs:
      - CO020
      - CO018
      - CO038
      - CO030

