  - id: leadership-governance
    title: Founders, Leadership, and Governance
    body: >-
      SecurityScorecard was co-founded by Dr. Aleksandr Yampolskiy and Sam Kassoumeh, both of whom remain active at the company.
      Dr. Yampolskiy holds a Ph.D. in Cryptography from Yale University (2006) and a B.A. in Mathematics and Computer Science from
      New York University. Before founding SecurityScorecard he was CISO at Gilt Groupe (where he scaled the security function from
      200 to 2,500 employees), CTO at Cinchcast/BlogTalkRadio (scaling to 30M+ monthly visitors), and held engineering and
      security leadership roles at Goldman Sachs and Oracle. His direct prior experience as CISO managing third-party vendor risk
      at Gilt Groupe is the founding motivation for SecurityScorecard's core use case. He was named E&Y Entrepreneur of the Year
      2021 in New York and Cyber Defense Magazine's CEO of the Year 2021. Sam Kassoumeh, co-founder, serves as Head of Product and
      is a board member; a third-party database lists him as COO, reflecting an ambiguous public title.


      Board governance includes investor representatives from key backers: Karim Faris (General Partner, GV / Google Ventures),
      Joe De Pinho (Principal, Riverwood Capital), Upal Basu (General Partner, NGP Capital), and Richard Seewald (Managing
      Partner, Evolution Equity Partners). Nick Donofrio, IBM Fellow Emeritus, adds enterprise technology governance experience.
      Dan Streetman, CEO of Tanium, joined the board as an independent director in January 2026. Key-person risk is meaningfully
      concentrated in Dr. Yampolskiy as CEO, public face, and co-inventor of the core technology; no succession plan has been
      publicly disclosed. A full current board roster, committee assignments, and director independence disclosures are not publicly
      available via official company materials, which represents a material diligence gap for any governance assessment.
    claimRefs:
