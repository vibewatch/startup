  - id: scale-customer-footprint
    title: Scale, Revenue, and Customer Footprint
    body: >-
      SecurityScorecard's scale has expanded substantially since the 2021 Series E. The company closed 2023 with 2,600 paying
      customers and 70,000 organizations actively using the platform. By March 2026, its official company page and TITAN AI press
      release both confirmed over 3,300 direct customer organizations, with 70% of the Fortune 100 trusting its data. The platform
      continuously monitors more than 12 million organizations — a figure that represents the global reach of the ratings data set
      rather than paying customers. SecurityScorecard's MAX managed services offering was growing at triple-digit rates as of
      October 2025, and in Q4 2020 the company reported international recurring revenue growth of 61% YoY and international
      customer count growth of 89% YoY. At the March 2021 Series E, the company had nearly 2 million monitored organizations.


      Revenue disclosure is limited to a single data point: the October 2025 SAFE-SSC joint press release stated that
      SecurityScorecard had exceeded $150M ARR, with MAX growing at triple-digit rates. No subsequent ARR update, gross margin,
      or revenue growth rate has been publicly disclosed. Headcount is estimated by third-party aggregators at 615-639 employees
      for 2026; the Forbes Council profile cited "over 600 employees." Official headcount figures are not published. Geographic
      presence beyond New York City and Austin, Texas relies on company statements about a globally distributed workforce. Exact
      current ARR, gross margin, and quarterly revenue growth remain private company metrics.
    claimRefs:
      - CO031
      - CO032
